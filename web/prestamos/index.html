  <body>
    <div id="root"></div>
    <script>
      // Fallback watchdog: if React does not mount within 3.5s due to stale browser cache
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          root.innerHTML = '<div style="min-height:100vh;background:#0f172a;display:flex;align-items:center;justify-content:center;color:#fff;font-family:sans-serif;text-align:center;padding:20px;">' +
            '<div style="max-width:420px;background:#1e293b;border:1px solid #334155;border-radius:16px;padding:24px;box-shadow:0 10px 25px rgba(0,0,0,0.5);">' +
            '<div style="font-size:32px;margin-bottom:8px;">⚡</div>' +
            '<h2 style="margin:0 0 8px 0;font-size:18px;font-weight:bold;">Actualizar Versión del Sistema</h2>' +
            '<p style="font-size:12px;color:#94a3b8;margin:0 0 16px 0;line-height:1.5;">Se detectó una versión previa en la memoria de tu navegador. Pulsa el botón para cargar la versión más reciente en tiempo real.</p>' +
            '<button onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){}window.location.reload(true);" style="background:#2563eb;color:#fff;border:none;padding:12px 24px;border-radius:12px;font-weight:bold;cursor:pointer;font-size:13px;width:100%;transition:background 0.2s;">Cargar Versión Actualizada</button>' +
            '</div></div>';
        }
      }, 3500);
    </script>
