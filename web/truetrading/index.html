<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TrueTrading Gold · Monitor Ejecutivo MT5 en Vivo</title>

  <!-- Control de Caché Estricto -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="robots" content="noindex, nofollow">

  <!-- Configuración PWA & Móviles -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TrueTrading">
  <meta name="theme-color" content="#020617">
  <link rel="manifest" href="/truetrading/manifest.json">
  <link rel="icon" type="image/png" href="/assets/brand/logo-icon.png">
  <link rel="apple-touch-icon" href="/assets/brand/logo-icon.png">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">

  <script>
    // 1. Redirección directa instantánea si se solicita mediante query string (?direct=1 o ?redirect=1)
    (function() {
      var TUNNEL_URL = 'https://dvd-deals-paul-zoloft.trycloudflare.com';
      var params = new URLSearchParams(window.location.search);
      if (params.get('direct') === '1' || params.get('redirect') === '1') {
        window.location.replace(TUNNEL_URL);
      }
    })();
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background-color: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Contenedor del Iframe a Pantalla Completa */
    #trading-frame-container {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #020617;
      z-index: 1;
    }

    #trading-iframe {
      width: 100%;
      height: 100%;
      border: 0;
      outline: 0;
      display: block;
      background: #020617;
    }

    /* Barra Flotante Superior Elegante & Discreta */
    .top-floating-bar {
      position: fixed;
      top: 10px;
      right: 12px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 9999px;
      padding: 4px 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6), 0 0 16px rgba(245, 158, 11, 0.2);
      transition: all 0.25s ease;
      user-select: none;
    }

    .top-floating-bar:hover {
      border-color: rgba(251, 191, 36, 0.7);
      box-shadow: 0 12px 30px -5px rgba(0, 0, 0, 0.75), 0 0 22px rgba(245, 158, 11, 0.35);
    }

    .top-floating-bar.collapsed .bar-content {
      display: none;
    }
    .top-floating-bar.collapsed {
      padding: 4px 6px;
      border-color: rgba(245, 158, 11, 0.3);
    }

    .bar-content {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulseGreen 1.8s infinite;
    }

    @keyframes pulseGreen {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    .divider {
      width: 1px;
      height: 14px;
      background: rgba(148, 163, 184, 0.25);
    }

    .bar-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(71, 85, 105, 0.4);
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 9999px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
      line-height: 1;
    }

    .bar-btn:hover {
      background: rgba(51, 65, 85, 0.9);
      border-color: rgba(245, 158, 11, 0.6);
      color: #fbbf24;
      transform: translateY(-1px);
    }

    .bar-btn:active {
      transform: translateY(0);
    }

    .bar-btn.gold {
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.5);
      color: #fbbf24;
    }
    .bar-btn.gold:hover {
      background: rgba(245, 158, 11, 0.28);
      border-color: #f59e0b;
      color: #ffffff;
    }

    .bar-btn.icon-only {
      padding: 4px 6px;
      font-size: 12px;
    }

    /* Pantalla de Carga / Spinner con branding TrueTrading Gold */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: #020617;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 50;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .loader-icon {
      font-size: 28px;
      filter: drop-shadow(0 0 12px rgba(245, 158, 11, 0.6));
      animation: floatAnim 2.5s ease-in-out infinite;
    }

    @keyframes floatAnim {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .loader-title {
      font-size: 18px;
      font-weight: 800;
      background: linear-gradient(135deg, #fef08a 0%, #f59e0b 50%, #d97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    .loader-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(245, 158, 11, 0.2);
      border-top-color: #fbbf24;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-subtext {
      color: #94a3b8;
      font-size: 12px;
      font-weight: 500;
    }

    /* Mensaje de fallback discreto si hay retrasos */
    #fallback-hint {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 9999px;
      padding: 6px 14px;
      font-size: 11px;
      color: #cbd5e1;
      display: none;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    #fallback-hint a {
      color: #fbbf24;
      text-decoration: underline;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- 1. Pantalla de Carga Inicial -->
  <div id="loading-overlay">
    <div class="loader-brand">
      <span class="loader-icon">📈</span>
      <span class="loader-title">TrueTrading Gold</span>
    </div>
    <div class="loader-spinner"></div>
    <div class="loader-subtext">Conectando con el Panel Ejecutivo MT5 en vivo...</div>
  </div>

  <!-- 2. Barra de Navegación Flotante -->
  <nav class="top-floating-bar" id="floatingBar" aria-label="Controles TrueTrading">
    <div class="bar-content" id="barContent">
      <div class="status-pill" title="Conexión en vivo con VPS MT5 (SSL Cloudflare)">
        <span class="pulse-dot"></span>
        <span>VPS MT5</span>
      </div>

      <div class="divider"></div>

      <a href="/" class="bar-btn" title="Volver a PhysicsAILab Principal">
        <span>🏠</span>
        <span>PhysicsAILab</span>
      </a>

      <button type="button" class="bar-btn" onclick="reloadFrame()" title="Recargar panel en vivo">
        <span>🔄</span>
        <span>Recargar</span>
      </button>

      <a id="btnDirect" href="https://dvd-deals-paul-zoloft.trycloudflare.com" target="_blank" rel="noopener noreferrer" class="bar-btn gold" title="Abrir directamente en pestaña completa">
        <span>↗️</span>
        <span>Abrir Directo</span>
      </a>

      <button type="button" class="bar-btn icon-only" onclick="toggleFullscreen()" title="Pantalla Completa">
        <span id="fsIcon">⛶</span>
      </button>

      <div class="divider"></div>
    </div>

    <button type="button" class="bar-btn icon-only" onclick="toggleCollapseBar()" id="collapseBtn" title="Minimizar / Mostrar controles" style="border:none; background:transparent;">
      <span id="collapseIcon">✕</span>
    </button>
  </nav>

  <!-- 3. Contenedor Iframe 100% Pantalla Completa -->
  <main id="trading-frame-container">
    <iframe
      id="trading-iframe"
      src="https://dvd-deals-paul-zoloft.trycloudflare.com"
      title="TrueTrading Gold · Panel Ejecutivo MT5"
      allow="fullscreen; clipboard-read; clipboard-write; web-share"
      sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts allow-top-navigation-by-user-activation"
      loading="eager">
    </iframe>
  </main>

  <!-- 4. Aviso de Respaldo por si hay bloqueo de red corporativa/antivirus -->
  <aside id="fallback-hint">
    <span>¿El panel tarda en responder?</span>
    <a href="https://dvd-deals-paul-zoloft.trycloudflare.com" target="_blank" rel="noopener noreferrer">Abrir directamente en Cloudflare ↗️</a>
  </aside>

  <script>
    var DEFAULT_URL = 'https://dvd-deals-paul-zoloft.trycloudflare.com';
    var iframe = document.getElementById('trading-iframe');
    var loadingOverlay = document.getElementById('loading-overlay');
    var fallbackHint = document.getElementById('fallback-hint');
    var btnDirect = document.getElementById('btnDirect');
    var floatingBar = document.getElementById('floatingBar');
    var collapseIcon = document.getElementById('collapseIcon');
    var fsIcon = document.getElementById('fsIcon');

    // Desvanecer overlay al cargar iframe
    function hideLoader() {
      if (loadingOverlay) {
        loadingOverlay.classList.add('hidden');
      }
    }

    if (iframe) {
      iframe.addEventListener('load', function() {
        hideLoader();
      });
    }

    // Fallback: Si tarda más de 3.5 segundos, ocultar overlay y sugerir apertura directa
    setTimeout(function() {
      hideLoader();
      if (fallbackHint) {
        fallbackHint.style.display = 'inline-flex';
        setTimeout(function() {
          fallbackHint.style.display = 'none';
        }, 12000);
      }
    }, 3800);

    // Recargar Iframe manteniendo timestamp anti-caché
    function reloadFrame() {
      if (!iframe) return;
      if (loadingOverlay) {
        loadingOverlay.classList.remove('hidden');
      }
      var base = (iframe.getAttribute('data-base-url') || iframe.src.split('?')[0]);
      var cacheBuster = '_t=' + Date.now();
      iframe.src = base + (base.indexOf('?') >= 0 ? '&' : '?') + cacheBuster;
      setTimeout(hideLoader, 2500);
    }

    // Pantalla completa nativa
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(function() {
          if (fsIcon) fsIcon.textContent = '🗗';
        }).catch(function(){});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().then(function() {
            if (fsIcon) fsIcon.textContent = '⛶';
          }).catch(function(){});
        }
      }
    }

    // Minimizar / Restaurar la barra flotante
    function toggleCollapseBar() {
      var isCollapsed = floatingBar.classList.toggle('collapsed');
      if (isCollapsed) {
        collapseIcon.textContent = '📈';
        floatingBar.title = 'Mostrar Controles de TrueTrading';
      } else {
        collapseIcon.textContent = '✕';
        floatingBar.title = 'Minimizar Controles';
      }
    }

    // Sincronización en segundo plano con /api/truetrading-config por si la URL del túnel cambia dinámicamente
    (function syncConfig() {
      fetch('/api/truetrading-config', { cache: 'no-store' })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data && data.ok && data.apiUrl) {
            var activeUrl = data.apiUrl.replace(/\/+$/, '');
            if (btnDirect) {
              btnDirect.href = activeUrl;
            }
            if (iframe && !iframe.getAttribute('data-base-url')) {
              iframe.setAttribute('data-base-url', activeUrl);
              // Si la URL devuelta por Firebase es distinta a la actual, actualizar iframe
              if (!iframe.src.startsWith(activeUrl)) {
                iframe.src = activeUrl;
              }
            }
          }
        })
        .catch(function(err) {
          // Si falla la API local, no interrumpe el túnel por defecto
          console.warn('[TrueTrading] Usando endpoint VPS predeterminado:', DEFAULT_URL);
        });
    })();
  </script>
</body>
</html>
