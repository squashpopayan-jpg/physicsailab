<p class="lead">Resumen de las expresiones del curso, en el orden en que aparecen. Entre paréntesis, el capítulo donde se explican.</p>

<section>
<h2>Unidades y costos (cap. 1–3)</h2>
<div class="eq">\[1\ \text{pip}=0.10\ \text{USD},\qquad 1\ \text{lote}=100\ \text{onzas},\qquad \text{lote}=\Big\lfloor\frac{\text{riesgo}}{(d_{SL}+s)\cdot100+k}\Big\rfloor_{0.01}\]</div>
<div class="eq">\[c=\frac{100\,s+k}{100\,D+k},\quad D=d_{SL}+s;\qquad R=\frac{\text{resultado en USD}}{\text{riesgo nominal}}\]</div>
<div class="eq">\[E=p\,b-(1-p)-c,\qquad p^{*}=\frac{1+c}{1+b+c},\qquad \frac{\mathrm d p^{*}}{\mathrm d c}=\frac{b}{(1+b+c)^2}\]</div>
</section>

<section>
<h2>Indicadores y sesgo (cap. 4)</h2>
<div class="eq">\[\mathrm{EMA}_t=\alpha C_t+(1-\alpha)\mathrm{EMA}_{t-1},\ \ \alpha=\tfrac{2}{N+1};\qquad \mathrm{TR}_t=\max(H_t-L_t,|H_t-C_{t-1}|,|L_t-C_{t-1}|),\ \ \mathrm{ATR}_t=\tfrac{(N-1)\mathrm{ATR}_{t-1}+\mathrm{TR}_t}{N}\]</div>
<div class="eq">\[H_{30}(t)=\max_{k=1..30}H_{t-k},\ \ L_{30},\ H_{120},\ L_{120}\ \text{análogos};\qquad \text{sesgo}=\begin{cases}\text{bajista}&C_{H4}-\mathrm{EMA}_{50}\lt-b\\ \text{alcista}&C_{H4}-\mathrm{EMA}_{50}\gt b\\ \text{neutro}&\text{en otro caso}\end{cases}\]</div>
</section>

<section>
<h2>Reglas de entrada y salida (cap. 5–6)</h2>
<div class="eq">\[\text{Venta (tocar):}\ \ H\ge H_{30},\ C\le O,\ |H_{30}-C|\le 8\ \text{pips},\ C\gt \mathrm{EMA}_{20}^{M15},\ C\le H_{120}+20\ \text{pips}\ \ (\text{con sesgo bajista})\]</div>
<div class="eq">\[\mathrm{SL}=\mathrm{clip}(0.8\,\mathrm{ATR},45,60),\quad \mathrm{TP}=\mathrm{clip}(1.4\,\mathrm{ATR},80,100)\ \text{pips};\qquad \text{ruina del jugador: } P(\text{TP primero})=\tfrac{a}{a+b}\Rightarrow E=0\]</div>
</section>

<section>
<h2>Mercado sintético y memoria (cap. 9)</h2>
<div class="eq">\[C_t=O_t+m_t-\kappa\frac{O_t-A_t}{48}+\sigma_t z_t,\quad \sigma_t=\sigma\,h\,e^{x_t};\qquad M=\tfrac12\Big(O+C+\sqrt{(C-O)^2-2\sigma^2\ln U}\Big)\]</div>
<div class="eq">\[\mathrm{VR}(q)=\frac{\operatorname{Var}(C_{t+q}-C_t)}{q\,\operatorname{Var}(C_{t+1}-C_t)}\quad(<1:\ \text{reversión};\ >1:\ \text{momento})\]</div>
</section>

<section>
<h2>Estadística de la evidencia (cap. 12–15)</h2>
<div class="eq">\[\mathrm{EE}=\frac{s}{\sqrt n},\quad \mathrm{IC}_{95}=\bar R\pm1.96\,\mathrm{EE},\quad t=\frac{\bar R}{\mathrm{EE}};\qquad n\approx\Big(\frac{(z_{0.975}+z_{\text{pot}})\,s}{\Delta}\Big)^2\]</div>
<div class="eq">\[P(\text{al menos un falso positivo})=1-(1-\alpha)^K,\qquad \text{umbral de Bonferroni:}\ |t|\gt z_{1-\alpha/2K},\qquad \mathbb E[\max_K t]\approx z_{1-1/(K+1)}\]</div>
</section>

<section>
<h2>Riesgo, reto y candados (cap. 19–21)</h2>
<div class="eq">\[g(f)\approx fE-\tfrac12 f^2\sigma^2,\qquad f^{*}=\frac{E}{\sigma^2},\qquad C_n=C_0\prod_i(1+fR_i)\]</div>
<div class="eq">\[P(+a\ \text{antes que}\ -b)=\frac{1-e^{2\mu b/\sigma^2}}{e^{-2\mu a/\sigma^2}-e^{2\mu b/\sigma^2}},\qquad T_{\text{días}}\approx\frac{\text{objetivo}}{\lambda\,E\,r\,C_0},\qquad \mathbb E[\text{día}]=E\cdot\mathbb E[N_{\text{ops}}]\]</div>
</section>
