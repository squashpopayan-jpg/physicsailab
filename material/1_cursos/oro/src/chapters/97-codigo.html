<h2>Uso mínimo</h2>
<div class="pycode" data-file="ejemplo.py"><div class="pycode-head"><b>ejemplo.py</b><span class="sp"></span></div><pre><code>import motor
from ayuda import *

S = motor.cargar('m5')                       # velas M5 reales de oro (17 meses)
P = motor.params(slk=0.5, tpk=2.5)           # el manual con otro stop y take profit (ver motor.DEFECTO)
ops = motor.correr(S, P)                     # lista de operaciones (diccionarios)
print(linea('mi configuración', ops))        # R medio, intervalo del 95 %, factor de beneficio...
nu = nulo(S, None, P, n_rep=100)             # R medio de 100 réplicas de entradas al azar
print('el azar da %+.3f; la señal supera al %.0f %% de las réplicas' % (nu.mean(), 100 * (nu &lt; R_de(ops).mean()).mean()))</code></pre></div>
