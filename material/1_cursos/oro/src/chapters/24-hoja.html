<template class="chapter-src" data-id="hoja" data-num="24" data-title="La hoja de estrategia: el punto dulce y su evidencia" data-part="Parte VII · De la estrategia a la práctica" data-short="Qué se sabe y qué no; tabla de evidencia por hallazgo; hoja de parámetros recomendada con su nivel de confianza; panel integral de pruebas; plan de doce meses y qué cambiaría la conclusión">
<p class="lead">Este capítulo reúne todo el curso en una sola hoja: los parámetros que merecen confianza, los que son una hipótesis y los que conviene eliminar, con la evidencia de cada uno. El «punto dulce» que sí puede defenderse hoy no es un conjunto mágico de números que haga rentable la estrategia día a día; es una <b>configuración simple, con el horario correcto, una gestión mínima, un riesgo que sube solo cuando la evidencia lo justifica y un protocolo de validación en marcha</b>.</p>

<section>
<h2>Lo aprovechable, primero</h2>
<ul>
<li><b>La premisa tiene sustento</b>: el oro de la ventana de Londres revierte moderadamente (razón de varianza 0.87 / 0.86 / 0.78 a 30 min, 1 h y 2 h; también 0.91 y 0.88 en M1 y M15). Una estrategia de pullback pro-tendencia apunta a esa propiedad.</li>
<li><b>La regla de entrada aporta algo sobre el azar</b> en los datos disponibles (+0.14 R sobre entrar sin regla; la señal supera al 93 % de las réplicas aleatorias en M5), en dirección coherente con la premisa.</li>
<li><b>El riesgo está bien contenido</b>: caída máxima de 0.7–3 % de la cuenta y pérdida diaria máxima de 250 USD (0.25 %) frente al 5 % permitido.</li>
<li><b>Hay un hallazgo estadísticamente sólido</b>: no operar de madrugada (el manual pierde −0.32 R con \(t\approx-4.9\) entre 02:00 y 08:00).</li>
<li><b>Se dispone de un laboratorio</b>: motor validado, datos, modelo nulo, mapas de parámetros, walk-forward y simulador de reto para evaluar cualquier cambio.</li>
</ul>
</section>

<section>
<h2>Lo que la evidencia no permite afirmar</h2>
<ul>
<li><b>Que la estrategia gane en promedio</b>: R = 0.00 (M1), +0.11 (M5) y −0.08 (M15), todos con intervalos que incluyen el cero y son de ±0.12 a ±0.24 R. Con +0.10 R de ventaja real harían falta unas 600 a 1 100 operaciones para saberlo.</li>
<li><b>Que algún parámetro esté «optimizado»</b>: ningún perfil de sensibilidad supera su ruido, y la optimización en una mitad no se sostiene en la otra.</li>
<li><b>Que la ganancia sea regular</b>: en M5, un solo trimestre (2025-T3) aporta más que el total.</li>
<li><b>Que las cifras del reto sean una promesa</b>: suponen ventaja constante e independencia.</li>
</ul>
<div class="box warn"><p>«Rentable día a día» no es una propiedad que se diseñe con parámetros. Con una ventaja de unas décimas de R por operación y 0.2–0.8 operaciones al día, la mayoría de los días no hay operación (45–82 %) y entre los días con operación hay tantos rojos como verdes (27 % contra 28 %): la rentabilidad aparece en meses, no en días. Un horizonte diario conduce a sobreoperar y a ajustar el ruido.</p></div>
</section>

<section>

<section>
<h2>Panel integral</h2>
<p>El panel ejecuta el manual y la candidata sobre la serie elegida y reúne en un solo lugar todas las pruebas del curso: R con su intervalo, comparación con el azar, las dos mitades, orden intrabarra pesimista, costos de estrés (comisión de 7 USD y un pip de deslizamiento) y la probabilidad de aprobar un reto con distintos riesgos y tres supuestos de ventaja (límite inferior del intervalo, estimación puntual y límite superior).</p>
<div class="sim" data-sim="hoja" data-title="Panel integral: manual contra candidata, con todas las pruebas"></div>
<div class="sim-guide"><ul>
<li>La candidata mejora el R puntual en las tres series, pero sus intervalos son más anchos (payoff alto) y <b>en la segunda mitad no supera al manual</b>: el signo de la mejora no se sostiene. Es lo que se espera de una pista.</li>
<li>Los tres supuestos de ventaja del reto muestran el problema de información: con el límite inferior (ventaja ≈ 0 o negativa) el reto casi nunca se aprueba sin fallar; con el superior, sí.</li>
<li>Pruebe con el riesgo de 0.125 % (el del manual) y con 0.5 %: el segundo aprueba en meses si la ventaja es real y falla con una probabilidad apreciable si no lo es.</li>
</ul></div>
</section>

<section>
<h2>Plan de doce meses</h2>
<ol>
<li><b>Mes 0 – fijar</b>: escribir la hoja v1.4, los criterios del capítulo 23 y el calendario; guardar el documento con fecha.</li>
<li><b>Meses 1–6 – demo o sombra</b>: operar la candidata <i>y</i> el manual en paralelo (sombra) con riesgo de 0.125 %. Registrar toda operación y su equivalente del backtest. Si el ritmo es de 0.3 operaciones por día, se juntarán unas 40–80 por trimestre: se necesita ampliar la muestra con los datos de M1 del propio broker (capítulo 23).</li>
<li><b>Mes 6 – primera revisión</b>: aplicar la regla secuencial. Si descarta, volver al laboratorio con la pregunta «¿qué propiedad del mercado dejó de cumplirse?» (la razón de varianza es el primer indicador). Si aprueba con \(t>2.5\) y n ≥ 100, pasar a 0.25 %.</li>
<li><b>Meses 7–12 – escalar con evidencia</b>: pasar a 0.5 % solo si el límite inferior del intervalo del 95 % es positivo con al menos 200 operaciones por nivel; considerar entonces el reto de fondeo con el riesgo de la tabla del capítulo 20.</li>
</ol>
<div class="box explain"><p>Es la lógica de un estudio clínico: no se aprueba un medicamento porque dos pacientes mejoraron, se fija de antemano cuántos pacientes hacen falta y qué mejora cuenta como éxito. La diferencia es que aquí la «dosis» (el riesgo) también se sube por etapas según la evidencia acumulada.</p></div>
</section>

<section>
<h2>Qué cambiaría esta conclusión</h2>
<ul>
<li><b>Más datos de M1</b> (un año o más del propio broker) con el manual: si el R medio supera +0.10 con \(t>2.8\) tras fijar la hoja, la ventaja dejaría de ser una pista.</li>
<li><b>Una razón de varianza estable</b> (menor que 1) en varios años y varios instrumentos: daría un respaldo causal independiente del backtest.</li>
<li><b>Resultados en vivo</b> con \(t<-1.5\) y 100 operaciones: la regla secuencial descarta y el laboratorio vuelve a empezar.</li>
</ul>
</section>

<section>
<h2>Resumen final</h2>
<div class="box keys"><ul>
<li>La premisa del manual (pullback pro-tendencia en un oro que revierte) tiene respaldo medible, pero pequeño.</li>
<li>La ventaja global no está demostrada: ±0.2 R de incertidumbre con las muestras actuales.</li>
<li>Lo sólido: no operar de madrugada, no esperar que la gestión o los candados creen rentabilidad, no promediar, y escalar el riesgo solo con evidencia.</li>
<li>Lo prometedor, pero no probado: stop corto con take profit largo y gestión mínima (solo break-even).</li>
<li>El camino a una estrategia sólida es el protocolo: fijar, medir hacia adelante, decidir con reglas escritas y escalar por etapas.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Cuál es el único hallazgo estadísticamente sólido sobre parámetros de la estrategia?
<details><summary>Respuesta</summary><p>El horario: el manual pierde −0.32 ± 0.13 R en 02:00–08:00 (\(t\approx-4.9\)); excluir esa franja está respaldado.</p></details></li>
<li><span class="lvl">Básico</span>¿Por qué se recomienda eliminar el «límite sobre H120»?
<details><summary>Respuesta</summary><p>Porque no tiene efecto (71 operaciones y el mismo R en todos sus valores): la anti-persecución ya impone la cercanía; un parámetro inerte solo añade complejidad.</p></details></li>
<li><span class="lvl">Intermedio</span>La candidata gana +0.28 en M5 con IC [−0.16, +0.71]. ¿Por qué no basta para adoptarla?
<details><summary>Respuesta</summary><p>Porque el intervalo incluye el cero, nació de mirar un mapa de 49 celdas (probar muchas), y en la segunda mitad rinde 0.00: es una pista que debe confirmarse hacia adelante.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Cuándo se sube el riesgo de 0.125 % a 0.25 %?
<details><summary>Respuesta</summary><p>Cuando la regla secuencial aprueba (\(t>2.5\) con al menos 100 operaciones) o, en general, cuando hay evidencia positiva suficiente; nunca por haber ganado unos días seguidos.</p></details></li>
<li><span class="lvl">Avanzado</span>Diseñe un criterio, antes de ver datos, para decidir si la candidata sustituye al manual.
<details><summary>Respuesta</summary><p>Ejemplo: operar ambas en paralelo durante 150 operaciones de cada una; sustituir si la diferencia de R medio (candidata − manual) por operación emparejada es positiva con límite inferior del IC95 mayor que cero, y la candidata cumple el criterio secuencial de aprobación por sí sola. En caso contrario, mantener el manual.</p></details></li>
</ol>
