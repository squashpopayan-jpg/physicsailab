    <div class="home-kicker">Curso interactivo · Trading sistemático de XAUUSD</div>
    <h1 class="home-title">Oro con método<span>entender, medir y afinar una estrategia intradía hasta encontrar su punto dulce</span></h1>
    <p class="home-lead">Un curso construido alrededor del manual técnico de TrueTrading XAUUSD: sesgo H4, entrada en la ventana de Londres, stop y take profit por ATR, gestión en tiempo real y candados diarios. Parte de lo básico (pip, lote, R, expectativa), explica cada pieza, la prueba con 100 000 velas reales de oro en un motor de backtest validado contra una implementación independiente y enseña a distinguir un buen ajuste de un ajuste afortunado. Al final obtiene una hoja de estrategia con los parámetros que merecen confianza y un protocolo para comprobarlos antes de arriesgar dinero.</p>
    <div class="maxwell-strip" aria-label="Cuatro ecuaciones que recorren el curso">
      <div><small>Expectativa por operación</small>\[E=p\,b-(1-p)-c\]</div>
      <div><small>Acierto de equilibrio</small>\[p^{*}=\frac{1+c}{1+b+c}\]</div>
      <div><small>Evidencia</small>\[t=\frac{\bar R}{s/\sqrt{n}}\]</div>
      <div><small>Operaciones necesarias</small>\[n\approx\Big(\frac{(z_{\alpha/2}+z_{\beta})\,\sigma}{\Delta}\Big)^{2}\]</div>
    </div>
    <p class="home-count ctrl-note" style="margin-top:14px;font-size:13px"></p>
    <p class="home-author"><small>Elaborado por</small><b>Mg. Manuel Alejandro Obando</b><span>Departamento de Física · Universidad del Cauca</span></p>
  </div>

<div class="home-howto">
  <div><b>Cada pieza, explicada</b><p>EMA, ATR, sesgo H4, extremos de 30 y 120 minutos, stop por volatilidad, break-even proporcional, candados y reglas de fondeo: definidos con palabras sencillas y con las ecuaciones que el motor ejecuta.</p></div>
  <div><b>Datos reales y un motor propio</b><p>100 000 velas por serie de oro real (M1, M5, M15) y 16 años de H1. El mismo motor corre en el navegador y en Python, y produce operaciones idénticas, una por una (apéndice B).</p></div>
  <div><b>Aprender a no engañarse</b><p>Modelo nulo de entradas al azar, intervalos de confianza, sobreajuste sobre ruido, mesetas de parámetros y walk-forward: la diferencia entre un buen ajuste y uno afortunado.</p></div>
  <div><b>Del laboratorio a la cuenta</b><p>Probabilidad de aprobar un reto de fondeo según el riesgo por operación, efecto real de los candados y un protocolo de prueba hacia adelante con criterios fijados de antemano.</p></div>
