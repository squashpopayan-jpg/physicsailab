<p class="lead">Las fuentes principales del curso son los textos clásicos de electrónica y las hojas de datos de los fabricantes, que son la referencia definitiva de cada componente.</p>
<section>
<h2>Libros</h2>
<ul>
<li>Horowitz, P. y Hill, W. <i>The Art of Electronics</i>, 3.ª ed. Cambridge University Press, 2015. La referencia práctica por excelencia.</li>
<li>Scherz, P. y Monk, S. <i>Practical Electronics for Inventors</i>, 4.ª ed. McGraw-Hill, 2016. Teoría y proyectos de taller.</li>
<li>Platt, C. <i>Make: Electronics</i>, 2.ª ed. Maker Media, 2015. Aprender electrónica descubriendo, con experimentos sobre protoboard.</li>
<li>Sedra, A. S., Smith, K. C., Carusone, T. C. y Gaudet, V. <i>Microelectronic Circuits</i>, 8.ª ed. Oxford University Press, 2020.</li>
<li>Malvino, A. y Bates, D. <i>Electronic Principles</i>, 8.ª ed. McGraw-Hill, 2016.</li>
<li>Boylestad, R. y Nashelsky, L. <i>Electronic Devices and Circuit Theory</i>, 11.ª ed. Pearson, 2013.</li>
<li>Alexander, C. y Sadiku, M. <i>Fundamentals of Electric Circuits</i>, 7.ª ed. McGraw-Hill, 2021.</li>
<li>Rashid, M. H. <i>Power Electronics</i>, 4.ª ed. Pearson, 2018.</li>
</ul>
<h2>Hojas de datos (consúltelas siempre antes de montar)</h2>
<p>NE555 (Texas Instruments); LM358 y LM393 (Texas Instruments, ON Semiconductor); µA741 (Texas Instruments); BC547 (ON Semiconductor); 2N3904 y 2N2222 (ON Semiconductor); 2N7000 (ON Semiconductor); IRLZ44N e IRF540N (Infineon / International Rectifier); 1N4007 y 1N4148 (varios fabricantes); LM7805 y LM317 (STMicroelectronics, Texas Instruments). Las curvas y valores límite que usa el simulador son los típicos de esas hojas.</p>
<h2>Normas</h2>
<p>IEC 60063: series de valores preferentes de resistores y condensadores (E6, E12, E24, E96). IEC 60062: códigos de marcado de resistores y condensadores. IEC 61010-1: requisitos de seguridad de instrumentos de medida (multímetros, osciloscopios).</p>
</section>
<section>
<h2>Seguridad: lo que no se negocia</h2>
<div class="box safe"><ol>
<li><b>Nada de red eléctrica en la protoboard.</b> Nunca se conectan 120 V o 230 V a una protoboard ni a un montaje casero sin aislamiento. Las prácticas de este curso usan pilas, baterías pequeñas, el secundario aislado de un transformador o la fuente de laboratorio.</li>
<li><b>Baterías de litio:</b> no se ponen en cortocircuito, no se perforan, no se cargan con cargadores inadecuados ni se dejan calentar: pueden incendiarse.</li>
<li><b>Descargar condensadores</b> grandes (a través de un resistor) antes de tocar el circuito.</li>
<li><b>Límite de corriente</b> de la fuente siempre bajo antes de encender un montaje nuevo.</li>
<li><b>Protección:</b> gafas ante la posibilidad de que revienten electrolíticos, cabello recogido cerca de motores, ventilación al soldar. Superficies calientes: resistores de potencia, reguladores, soldador.</li>
<li><b>Menores:</b> siempre con un adulto; las pilas pequeñas se guardan fuera de su alcance.</li>
<li><b>Residuos:</b> pilas y baterías se entregan en puntos de recolección; no se tiran a la basura común.</li>
</ol></div>
</section>
