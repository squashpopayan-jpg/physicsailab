<p class="lead">Este es el capítulo del laboratorio sin guion. Primero, tres <b>retos</b> pequeños con metas que el simulador comprueba solas: hay que pensar, calcular, armar y medir. Después, el <b>taller libre</b>: la protoboard completa de 830 puntos, la fuente de dos canales, el transformador, el generador, el multímetro y el osciloscopio, con todas las piezas del curso. El taller recuerda el último montaje en el navegador: hoy se arma un circuito y mañana sigue ahí.</p>

<section>
<h2>Reto 1 · Un LED a 10 mA</h2>
<p>La batería de 9 V ya está conectada a los rieles inferiores. Sobre la mesa hay un resistor y un LED rojo. <b>Meta:</b> que por el LED circulen entre 8 y 12 mA, comprobándolo con el multímetro en serie. Antes de armar, calcule el resistor: \(R=(9-V_F)/I\), con \(V_F\approx1{,}95\) V. Recuerde elegir el valor comercial y cambiarlo en el panel de propiedades de la pieza.</p>
<div class="sim" data-sim="c22-reto1" data-title="Reto 1: LED con 10 mA desde una batería de 9 V"></div>
</section>

<section>
<h2>Reto 2 · Un divisor de 3,3 V</h2>
<p>Con dos resistores de la bandeja y la batería de 9 V, <b>obtenga 3,3 V ± 3 %</b> en la columna 20 (hágalo con el agujero <b>a20</b>) respecto al riel «−». Recuerde la fórmula del divisor y que el voltímetro no debe perturbarlo; y que desperdiciar corriente es un defecto: la corriente del divisor debe ser menor de 5 mA.</p>
<div class="sim" data-sim="c22-reto2" data-title="Reto 2: 3,3 V con dos resistores"></div>
<details class="sol"><summary>Pista (después de intentarlo)</summary><ol class="steps"><li>Con \(R_2=R_1\cdot3{,}3/(9-3{,}3)=0{,}579R_1\): por ejemplo 10 kΩ arriba (R₁) y 5,6 kΩ abajo (R₂): 3,23 V; o 12 kΩ y 6,8 kΩ: 3,26 V.</li><li>Con 10 kΩ + 5,6 kΩ la corriente del divisor es 0,58 mA.</li></ol></details>
</section>

<section>
<h2>Reto 3 · Una fuente de 5 V</h2>
<p>La carga de 100 Ω está conectada entre <b>a20</b> y el riel «−». <b>Meta:</b> alimentarla con 5 V ± 2 % desde la batería de 9 V, con un 7805 que usted coloca, con su condensador de entrada, y sin que el regulador se queme ni se apague por calor. Recuerde el orden de patas del TO-220: IN – GND – OUT.</p>
<div class="sim" data-sim="c22-reto3" data-title="Reto 3: 5 V regulados para una carga de 100 Ω"></div>
<details class="sol"><summary>Pista (después de intentarlo)</summary><ol class="steps"><li>7805 en e10–e12 (IN, GND, OUT); cable de a10 al riel «+», de a11 al riel «−»; cable de la salida (a12) a la columna 20 (a20) —o coloque el 7805 de forma que OUT quede en la columna 20—; condensador de 100 nF de la entrada a tierra.</li><li>La carga de 100 Ω consume 50 mA: el 7805 disipa \((9-5)\cdot0{,}05=0{,}2\) W: no necesita disipador.</li></ol></details>
</section>

<section>
<h2>El taller libre</h2>
<p>Aquí no hay metas: hay una mesa y todo el curso. Sugerencias de proyectos para el taller: (1) un amplificador de audio de dos etapas; (2) un metrónomo con 555 y LED; (3) un voltímetro de LED con un comparador; (4) una fuente simétrica de ±12 V; (5) un circuito que enciende un LED cuando hay luz y otro cuando hay oscuridad. Use el botón <b>Revisar</b> cuando algo no funcione, la vista de <b>Tensiones</b> para ver el potencial de cada tira y la de <b>Temperatura</b> para localizar la pieza que sufre. Si algo se quema, no pasa nada: ese es el propósito.</p>
<div class="sim" data-sim="c22-libre" data-title="El taller libre: protoboard completa y todos los instrumentos"></div>
<div class="sim-guide"><ul>
<li><b>Fuentes disponibles:</b> los dos canales de la fuente de laboratorio (cada uno de 0–30 V), el transformador de 12 V~ aislado y el generador de funciones. Las baterías y pilas están en la caja de componentes («Cargas» → batería, pilas, cargador USB).</li>
<li><b>Fallas:</b> en el panel de propiedades de cada pieza se puede inyectar una falla (abierta, en cortocircuito, con fugas, con deriva) para practicar el diagnóstico.</li>
<li><b>Buenas costumbres:</b> límite de corriente bajo antes de encender, polaridad de cada pieza, una sola pata por agujero, tierra común.</li>
</ul></div>
<div class="box note"><p><b>De la simulación a la mesa.</b> Lo que se aprende en el banco virtual se verifica con piezas reales: los valores medidos diferirán un poco (tolerancias, contactos, el estado de las pilas) y, a veces, el circuito no funcionará a la primera. Es normal y es la mejor parte: se mide, se razona y se corrige, con el método del capítulo 18.</p></div>
</section>
