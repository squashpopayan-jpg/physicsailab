<template class="chapter-src" data-id="formulario" data-num="A" data-title="Formulario y patillas" data-part="Apéndices" data-short="Fórmulas clave del curso, código de colores, series de valores y diagramas de patillas de los componentes de la caja: BC547, 2N3904, IRLZ44N, 7805, LM317, LM358, LM393, NE555, LM741 y puente rectificador">
<p class="lead">Una hoja de consulta con lo que más se usa en el banco. Las patillas se dan <b>vistas desde arriba</b> (cara de las letras hacia usted, patas hacia abajo para los TO-92 y TO-220; muesca a la izquierda para los DIP).</p>

<section>
<h2>Fórmulas</h2>
<div class="tablewrap"><table class="tbl"><tr><th>Tema</th><th>Fórmula</th></tr>
<tr><td>Ley de Ohm y potencia</td><td>\(V=IR\); \(P=VI=I^2R=V^2/R\)</td></tr>
<tr><td>Serie / paralelo</td><td>\(R=R_1+R_2\); \(R=\dfrac{R_1R_2}{R_1+R_2}\)</td></tr>
<tr><td>Divisor de tensión</td><td>\(V_{out}=V_s\dfrac{R_2}{R_1+R_2}\); con carga: \(R_2\parallel R_L\)</td></tr>
<tr><td>LED y resistor</td><td>\(R=(V_s-V_F)/I_F\)</td></tr>
<tr><td>Carga RC</td><td>\(v_C=V_s(1-e^{-t/RC})\); \(\tau=RC\); corte \(f_c=1/(2\pi RC)\)</td></tr>
<tr><td>RL</td><td>\(i=\frac{V}{R}(1-e^{-t/\tau})\), \(\tau=L/R\); \(v_L=L\,di/dt\)</td></tr>
<tr><td>Valor eficaz</td><td>seno \(V_p/\sqrt2\); triángulo \(V_p/\sqrt3\); cuadrada \(V_p\)</td></tr>
<tr><td>Rizado de un filtro</td><td>\(\Delta V\approx I/(2fC)\)</td></tr>
<tr><td>BJT</td><td>\(I_C=\beta I_B\); interruptor: \(I_B=I_C/10\); \(r_e=V_T/I_E\) (25,85 mV a 25 °C)</td></tr>
<tr><td>Amplificador CE</td><td>\(A_v=-(R_C\parallel R_L)/r_e\) (desacoplado); \(-(R_C\parallel R_L)/(r_e+R_E)\)</td></tr>
<tr><td>A.O.</td><td>inversor \(-R_f/R_{in}\); no inversor \(1+R_f/R_g\); \(f_{-3dB}=GBW/A\)</td></tr>
<tr><td>555 astable</td><td>\(f=1{,}44/((R_1+2R_2)C)\); \(D=(R_1+R_2)/(R_1+2R_2)\)</td></tr>
<tr><td>555 monoestable</td><td>\(T=1{,}1\,RC\)</td></tr>
<tr><td>7805 / LM317</td><td>\(P=(V_{in}-V_{out})I\); \(V_{out}=1{,}25(1+R_2/R_1)\)</td></tr>
<tr><td>Temperatura</td><td>\(T=T_a+P\,R_\theta\)</td></tr>
<tr><td>Pila</td><td>\(V=E-Ir\)</td></tr></table></div>
</section>

<section>
<h2>Código de colores y series</h2>
<div class="tablewrap"><table class="tbl"><tr><th>Negro</th><th>Marrón</th><th>Rojo</th><th>Naranja</th><th>Amarillo</th><th>Verde</th><th>Azul</th><th>Violeta</th><th>Gris</th><th>Blanco</th></tr><tr><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td></tr></table></div>
<p>Tolerancias: dorado 5 %, plateado 10 %, marrón 1 %, rojo 2 %. <b>Serie E12:</b> 10, 12, 15, 18, 22, 27, 33, 39, 47, 56, 68, 82 (×10ⁿ). <b>Cerámicos:</b> 104 = 100 nF; 473 = 47 nF; 102 = 1 nF.</p>
</section>
