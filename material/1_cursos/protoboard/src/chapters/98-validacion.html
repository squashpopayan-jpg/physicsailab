<p class="lead">Un simulador solo sirve si se puede confiar en él. El motor del banco (análisis nodal modificado con transitorio trapezoidal, modelos de diodo, BJT, MOSFET, amplificador operacional y reguladores, y un modelo térmico para los daños) se somete a las pruebas de este apéndice cada vez que se reconstruye el curso: se comparan los resultados con <b>fórmulas exactas</b>, con una <b>solución independiente</b> del mismo circuito (bisección numérica con los mismos parámetros del modelo) y con <b>las cifras que el texto cita</b>. Las tolerancias son las propias del método (por ejemplo, el rizado con ΔV ≈ I/(2fC) es una aproximación).</p>
<!--VALIDACION-->
<div class="box note"><p><b>Qué no valida (todavía).</b> Los modelos son los de pequeña y gran señal habituales en SPICE nivel 1: no incluyen efectos de segundo orden (capacitancias no lineales, modulación térmica de la ganancia, ruido). Los tiempos de calentamiento se aceleran por defecto (la lista «Calor 1×, 4×, 20×, 100×» elige el factor); las temperaturas de equilibrio sí son las de la teoría \(T=T_a+PR_\theta\).</p></div>
