<template class="chapter-src" data-id="proyectos-energia" data-num="21" data-title="Proyectos en casa III: energía" data-part="Parte VI · Fallas, proyectos y taller" data-short="Tres proyectos sobre la energía en casa: una fuente de 5 V con 7805 para alimentar otros montajes, una fuente regulable de 1,25 a 12 V con LM317, y la medición de la resistencia interna de pilas y baterías reales">
<p class="lead">Todo montaje necesita energía. Este último capítulo de proyectos ocupa tres herramientas que se usan toda la vida: una <b>fuente de 5 V</b> para alimentar circuitos con una batería, una <b>fuente regulable</b> de laboratorio casera y un <b>experimento sobre las pilas</b> que revela por qué las pilas «se agotan» antes de gastar su energía. Los tres funcionan con baja tensión y, otra vez, ninguno toca la red eléctrica: para convertir la tensión de la red se usa un <b>adaptador comercial certificado</b> (el cargador de pared de un celular o un transformador con salida de 12 V), nunca un montaje casero.</p>

<section>
<h2>Proyecto 7 · Fuente de 5 V para proyectos con batería</h2>
<p><b>Objetivo:</b> una fuente estable de 5 V a partir de una batería de 9 V, con un 7805 y su LED de encendido. Es el montaje de alimentación de los proyectos del capítulo 19 y 20 cuando se quiere 5 V en lugar de la tensión de las pilas.</p>
<div class="tablewrap"><table class="tbl"><tr><th>Cantidad</th><th>Pieza</th><th>Origen</th></tr>
<tr><td>1</td><td>Regulador 7805 (TO-220)</td><td>Tienda; fuentes y cargadores viejos</td></tr>
<tr><td>2</td><td>Condensadores de 330 nF (entrada) y 100 nF (salida), cerámicos</td><td>—</td></tr>
<tr><td>1</td><td>Resistor de 330 Ω y LED verde</td><td>—</td></tr>
<tr><td>1</td><td>Batería de 9 V con clip</td><td>—</td></tr></table></div>
<h3>Montaje</h3>
<ol class="steps">
<li>Clip de la batería a los rieles inferiores. 7805 en <b>e10–e12</b>: IN (e10), GND (e11), OUT (e12), con la cara de letras hacia usted.</li>
<li>Cable de <b>a10</b> al riel «+»; cable de <b>a11</b> al riel «−».</li>
<li>Condensadores: 330 nF entre las columnas 10 y 11 (<b>c10</b>–<b>c11</b>) y 100 nF entre la columna 12 y la 11 (<b>c12</b>–<b>b11</b>).</li>
<li>Indicador: resistor de 330 Ω de <b>d12</b> a <b>d16</b>; LED verde con el ánodo en <b>c16</b> y el cátodo en <b>c17</b>; cable de <b>a17</b> a «−».</li>
<li>La salida de 5 V se toma de la columna 12 (cualquier agujero de a a d) y la tierra del riel «−».</li>
</ol>
<div class="sim" data-sim="p7-fuente5" data-title="Fuente de 5 V con 7805 desde una batería de 9 V"></div>
<div class="sim-guide"><ul>
<li><b>Con 9 V:</b> salida de 4,99 V con una carga de 100 Ω (50 mA); la batería baja un poco por su resistencia interna: 8,89 V. Con 230 mA (22 Ω), la salida sigue en 4,98 V.</li>
<li><b>Autonomía:</b> una batería de 9 V guarda unos 500 mAh. Con 50 mA dura unas 8 h; con 230 mA, solo 2 h. Una batería de 9 V no es adecuada para cargas grandes.</li>
<li><b>Con 4 pilas AA (6 V):</b> la salida cae a 3,96 V: ¡<b>no regula</b>! El 7805 necesita ≥ 7 V de entrada (dropout de 2 V). Con 5 V de un cargador USB, 3,1 V.</li>
<li>El 7805 disipa \((9-5)\cdot0{,}05=0{,}2\) W con 50 mA: no necesita disipador. A 230 mA llegaría a 0,9 W y 80 °C.</li>
</ul></div>
<p><b>Verifique con el multímetro:</b> 9,2 V en vacío en la batería nueva, ≈ 5,0 V en la salida con la carga. <b>Una fuente de PC vieja</b> trae 5 V y 12 V regulados listos para usar (con su cable negro como tierra), pero no se abre ni se manipula si no se sabe: tiene condensadores con tensión peligrosa.</p>
</section>

<section>
<h2>Proyecto 8 · Fuente regulable de 1,25 V a 12 V</h2>
<p><b>Objetivo:</b> una fuente variable casera con un LM317 y un potenciómetro, alimentada por un adaptador de 15 V de buena calidad, para probar circuitos a distintas tensiones.</p>
<div class="tablewrap"><table class="tbl"><tr><th>Cantidad</th><th>Pieza</th><th>Origen</th></tr>
<tr><td>1</td><td>LM317 (TO-220) con disipador pequeño</td><td>Tienda</td></tr>
<tr><td>1</td><td>Resistor de 240 Ω (R₁) y un potenciómetro lineal de 2,5 kΩ (o 5 kΩ)</td><td>Radio vieja</td></tr>
<tr><td>1</td><td>Resistor de 470 Ω/2 W (carga de prueba)</td><td>—</td></tr>
<tr><td>1</td><td>Adaptador de 15 V o 12 V (certificado) o la fuente de laboratorio</td><td>—</td></tr></table></div>
<h3>Montaje</h3>
<ol class="steps">
<li>LM317 en <b>e10–e12</b>: ADJ (e10), OUT (e11), IN (e12) — ¡orden distinto del 7805!</li>
<li>Entrada: cable de <b>a12</b> al riel «+» (15 V). R₁ = 240 Ω de <b>c11</b> (OUT) a <b>c10</b> (ADJ).</li>
<li>Potenciómetro (<b>e16, e17, e18</b>): cable de a16 a <b>a10</b> (ADJ), de a17 a b18 (el cursor con el extremo, formando un reóstato) y de a18 al riel «−».</li>
<li>La salida es la columna 11; el resistor de 470 Ω de <b>d11</b> al riel «−» es la carga de prueba.</li>
</ol>
<div class="sim" data-sim="p8-regulable" data-title="LM317 con un potenciómetro: la tensión se gira con la perilla"></div>
<div class="sim-guide"><ul>
<li>Con el potenciómetro en cero (R₂ = 0): 1,25 V. En la mitad (1250 Ω): 7,8 V. Al 75 %: 11,1 V. Con la perilla al máximo la salida queda en 12,5 V (15 V − 2,5 V de caída: el LM317 pierde la regulación, aunque el cálculo diga 14,3 V).</li>
<li>Con 7,8 V en 470 Ω (16 mA) el LM317 disipa \((15-7{,}8)\cdot0{,}016=0{,}12\) W: apenas se calienta. Con cargas de 0,5 A llegaría a 3,6 W: hace falta disipador y un fusible a la entrada.</li>
<li>Antes de conectar un circuito nuevo, ajuste la tensión con el multímetro; así no se destruyen integrados que solo toleran 5 V.</li>
</ul></div>
</section>

<section>
<h2>Proyecto 9 · La resistencia interna de las pilas</h2>
<p><b>Objetivo:</b> medir por qué una pila «agotada» sigue marcando 1,3 V sin carga pero no sirve. Toda pila tiene una <b>resistencia interna</b> \(r\) que forma un divisor con la carga: \(V=E-Ir\). Se mide con el multímetro y un resistor de carga conocido, en la protoboard.</p>
<h3>Procedimiento</h3>
<ol class="steps">
<li>Mida la tensión en vacío \(E\) (la pila sola, sin conectar nada más).</li>
<li>Conecte un resistor de carga de 22 Ω/5 W entre los bornes (en la protoboard: del riel «+» al riel «−»). Mida la tensión en carga \(V\) y calcule \(I=V/R\).</li>
<li>La resistencia interna es \(r=(E-V)/I\). Mida solo unos segundos: la pila se calienta.</li>
</ol>
<div class="sim" data-sim="p9-pila" data-title="¿Cuánta resistencia interna tiene cada fuente?"></div>
<div class="sim-guide"><ul>
<li><b>Batería alcalina de 9 V:</b> en vacío 9,00 V; con 22 Ω da 8,35 V y 0,38 A: \(r=1{,}7\ \Omega\). La pila pierde 0,25 W por dentro, calentándose.</li>
<li><b>4 pilas AA en serie:</b> 6 V → 5,84 V con 0,27 A: \(r=0{,}6\ \Omega\). <b>Li-ion 18650:</b> 0,08 Ω: ideal para corrientes grandes. <b>Cargador USB:</b> 0,25 Ω.</li>
<li>Una pila vieja puede conservar casi toda su tensión en vacío pero subir su resistencia a decenas de ohmios: por eso un reloj funciona y una linterna no. La resistencia interna, y no la tensión en vacío, mide el estado de una pila.</li>
<li><b>Cortocircuito:</b> con 22 Ω la corriente de la pila de 9 V es de 0,38 A; con un cable (≈ 0 Ω) sería 5,3 A y 48 W dentro de la pila: se vio en el capítulo 4.</li>
</ul></div>
<div class="box safe"><p><b>Nunca</b> pruebe pilas en cortocircuito «para ver si tienen carga» y no recargue pilas alcalinas no recargables: pueden estallar. Las baterías de litio se cargan solo con su cargador específico y se descartan en los puntos de reciclaje de pilas.</p></div>
</section>

<section>
<h2>Preguntas para comprobar lo aprendido</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una pila de 1,5 V entrega 1,2 V con una carga de 10 Ω. ¿Cuál es su resistencia interna?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Corriente.</b> \(I=1{,}2/10=0{,}12\) A.</li>
<li><b>Resistencia interna.</b> \(r=(1{,}5-1{,}2)/0{,}12=2{,}5\ \Omega\).</li>
<li><b>Resultado.</b> <span class="ans">2,5 Ω: una pila muy gastada (una nueva tiene 0,15 Ω).</span></li></ol></details></li>
<li><span class="lvl">Intermedio</span>El 7805 de un proyecto recibe una batería de 9 V que ya bajó a 7,5 V. ¿Regula? ¿Qué ocurre cuando la batería baje a 6 V?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>7,5 V.</b> El 7805 necesita ≥ 7 V: aún regula 5 V, pero con muy poco margen.</li>
<li><b>6 V.</b> La salida sigue a la entrada: \(6-2=4\) V; el proyecto empieza a funcionar mal sin avisar.</li>
<li><b>Resultado.</b> <span class="ans">Regula hasta ≈ 7 V; por debajo, la salida cae. Se usa un regulador LDO o se cambia la batería a tiempo.</span></li></ol></details></li>
<li><span class="lvl">Intermedio</span>Con la fuente regulable del proyecto 8 se necesita 9 V a la salida. ¿Qué valor de R₂ (con R₁ = 240 Ω) y qué posición del potenciómetro (2,5 kΩ)?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>R₂.</b> \(V_{out}=1{,}25(1+R_2/240)\Rightarrow R_2=240\,(9/1{,}25-1)=1488\ \Omega\) (ligeramente menos, por la corriente de ADJ).</li>
<li><b>Posición.</b> \(1488/2500=0{,}60\): al 60 % de la perilla.</li>
<li><b>Resultado.</b> <span class="ans">≈ 1,5 kΩ, o sea la perilla al 60 %; se afina con el multímetro.</span></li></ol></details></li>
</ol>
</section>
