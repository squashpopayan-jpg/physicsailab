    <h1 class="home-title">Protoboard<span>laboratorio de simulación: del cable al circuito</span></h1>
    <p class="home-lead">Un laboratorio completo dentro de la pantalla. Aquí se arma de verdad: las piezas se <b>arrastran</b> hasta los agujeros de la protoboard, los cables se <b>mueven</b> de un agujero a otro, la fuente se <b>regula</b>, el multímetro y el osciloscopio se <b>conectan con sus puntas</b> y el circuito se comporta como el real: <b>si se equivoca, algo se quema</b>. Un resistor de 1/4 W humea, un LED se apaga para siempre, un condensador electrolítico al revés revienta, el fusible del multímetro se funde. Cada capítulo recoge lo aprendido en los cursos de electrónica y lo lleva a la protoboard, y el curso termina con <b>proyectos para hacer en casa</b> con piezas que se consiguen o se rescatan de aparatos viejos.</p>

<div class="home-howto">
  <div><b>Una protoboard que funciona como la real</b><p>Las tiras, los rieles y el canal central están donde deben estar: dos patas en la misma tira quedan unidas, un circuito integrado a caballo del canal separa sus dos filas de patas, y cada agujero admite una sola pata.</p></div>
  <div><b>Instrumentos con sus defectos</b><p>Fuente de laboratorio de dos canales con límite de corriente, generador de funciones, multímetro de 3½ dígitos con sus tomas y fusibles, y osciloscopio de dos canales con punta ×1/×10. Se pueden usar mal… y el simulador lo castiga como el laboratorio.</p></div>
  <div><b>Las piezas se queman</b><p>El motor de cálculo es un SPICE propio (Kirchhoff, Shockley, Ebers–Moll). Cada pieza integra su potencia, su temperatura y sus esfuerzos eléctricos y falla con humo, chispas y un aviso que explica por qué.</p></div>
  <div><b>Proyectos para hacer en casa</b><p>Linterna, alarma de luz, sirena, probador de continuidad, cargador de celular con LED, controlador de motor: lista de materiales, montaje paso a paso y las mediciones que se esperan, siempre con baja tensión y con normas de seguridad.</p></div>
