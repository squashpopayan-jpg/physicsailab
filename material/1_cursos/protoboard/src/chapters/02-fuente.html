<template class="chapter-src" data-id="fuente" data-num="2" data-title="La fuente y el multímetro" data-part="Parte I · El banco de trabajo" data-short="Fuente de laboratorio con límite de corriente (CV/CC); medir tensión en paralelo, corriente en serie y resistencia con el circuito apagado; fusibles, tomas del multímetro y los errores clásicos que dañan el aparato">
<p class="lead">Un circuito necesita energía y un modo de saber qué le pasa. La energía la da la <b>fuente de laboratorio</b>; el conocimiento, el <b>multímetro</b>. Ambos son, al mismo tiempo, los instrumentos con los que más se comete errores: una fuente sin límite de corriente destruye cualquier cosa que se conecte mal, y un multímetro mal conectado se funde o miente. Este capítulo enseña a usarlos en el banco y, de una vez, a romperlos de manera controlada para que no ocurra de verdad.</p>

<section>
<h2>La fuente de laboratorio: tensión y límite de corriente</h2>
<p>El banco tiene una fuente de <b>dos canales independientes</b>, cada uno de 0 a 30 V y de 0 a 3 A. Tiene tres tomas por canal pareja —rojo (+), negro (−)— y una toma verde común, la <b>tierra</b> (⏚). Las salidas están <i>flotantes</i>: ni el + ni el − están unidos a tierra, de modo que el circuito no tiene un «lado de tierra» hasta que usted lo decide. Cada canal tiene dos perillas:</p>
<ul>
<li><b>Tensión:</b> el valor que la fuente intenta mantener en sus bornes (modo <b>C.V.</b>, <i>constant voltage</i>).</li>
<li><b>Límite de corriente:</b> la corriente máxima que dejará pasar. Si la carga pide más, la fuente cambia al modo <b>C.C.</b> (<i>constant current</i>): mantiene la corriente en el límite y deja que la <b>tensión caiga</b>.</li>
</ul>
<p>El límite de corriente es el seguro de vida de las piezas. Se ajusta <i>antes</i> de conectar el circuito: al montar un circuito nuevo, ponga la tensión de trabajo y un límite pequeño (por ejemplo 100 mA); si algo está mal conectado, la fuente limita y nada se quema.</p>
<div class="box law"><p><b>CV y CC.</b> La fuente entrega la tensión ajustada \(V_s\) mientras la corriente que pide la carga, \(I=V_s/R\), sea menor que el límite \(I_{lim}\). Si \(V_s/R>I_{lim}\), la fuente pasa a CC: \(I=I_{lim}\) y la tensión baja a \(V=I_{lim}R\). La potencia máxima que puede entregar a una resistencia \(R\) es \(P=I_{lim}^2R\) en CC y \(P=V_s^2/R\) en CV.</p></div>
<div class="sim" data-sim="c2-fuente" data-title="La fuente en modo C.V. y en modo C.C."></div>
<div class="sim-guide"><ul>
<li>Con 5 V, 0,5 A y 22 Ω circulan \(5/22=0{,}227\) A: la fuente está en <b>C.V.</b> y entrega 1,13 W.</li>
<li>Suba la tensión a 12 V: la carga pediría 0,545 A, más que el límite. La fuente pasa a <b>C.C.</b> (el indicador cambia a rojo): entrega 0,5 A y la tensión en la carga cae a 11 V.</li>
<li>Con 4,7 Ω a 5 V la carga pediría 1,06 A: en C.C., con 0,5 A, la tensión cae a 2,35 V. El límite protege tanto a la carga como a la fuente.</li>
<li>Con 1 Ω y 5 A de apetito, la fuente se queda en el límite que ajuste (hasta 3 A): es un casi cortocircuito, y el aviso rojo del banco lo señala.</li>
</ul></div>
<div class="box note"><p><b>Salida apagada = circuito abierto.</b> Con el botón de salida en «apagada» la fuente no entrega nada, aunque las perillas estén en 30 V. Es la manera segura de conectar y reconectar: se arma, se revisa y solo entonces se enciende.</p></div>
</section>

<section>
<h2>El multímetro digital</h2>
<p>El multímetro del banco es de <b>3½ dígitos</b> (hasta 3999 cuentas) con selección automática de rango. Tiene tres tomas para la punta roja, y la punta negra siempre va en <b>COM</b>:</p>
<div class="tablewrap"><table class="tbl"><tr><th>Función</th><th>Toma de la punta roja</th><th>Cómo se conecta</th><th>Resistencia interna</th></tr>
<tr><td>Tensión V⎓ / V~</td><td><b>V Ω</b></td><td>En <b>paralelo</b> con lo que se mide</td><td>10 MΩ (casi infinita)</td></tr>
<tr><td>Corriente A⎓ / A~ (hasta 200 mA)</td><td><b>mA</b> (fusible de 0,2 A)</td><td>En <b>serie</b>: se abre el circuito</td><td>≈ 1 Ω</td></tr>
<tr><td>Corriente de hasta 10 A</td><td><b>10 A</b> (fusible de 10 A)</td><td>En <b>serie</b></td><td>≈ 0,04 Ω</td></tr>
<tr><td>Resistencia Ω</td><td><b>V Ω</b></td><td>Con el circuito <b>apagado</b> y la resistencia aislada</td><td>—</td></tr>
<tr><td>Diodo →| y continuidad ·))</td><td><b>V Ω</b></td><td>Con el circuito apagado</td><td>—</td></tr></table></div>
<p>La idea de fondo es la misma en todas las medidas: el instrumento <b>forma parte del circuito</b>. El voltímetro es una resistencia enorme que se pone en paralelo (casi no toma corriente); el amperímetro es una resistencia minúscula que se pone en serie (casi no cae tensión). Por eso son peligrosos si se invierten sus papeles.</p>
</section>

<section>
<h2>Medir tensión: siempre en paralelo</h2>
<p>La tensión es una diferencia entre dos puntos: el voltímetro se conecta a los dos extremos del elemento, <i>sin abrir nada</i>. En el banco hay un divisor de tensión con R₁ = 4,7 kΩ y R₂ = 10 kΩ alimentado con 10 V. Teóricamente la tensión en R₂ es \(V_2=10\cdot\dfrac{10}{4{,}7+10}=6{,}80\) V y la de R₁, 3,20 V. Arrastre las puntas del multímetro a los extremos de cada resistor y compruebe. (Las resistencias reales tienen tolerancia del 5 %, así que las lecturas pueden diferir un poco de los valores teóricos.)</p>
<div class="sim" data-sim="c2-voltimetro" data-title="Voltímetro en paralelo: el divisor de tensión"></div>
<div class="sim-guide"><ul>
<li>El mango de cada punta se agarra y se lleva a un agujero; cuando toca uno, el multímetro mide el potencial de <b>esa columna</b>. No hace falta tocar la pata: basta el agujero de su misma columna.</li>
<li>Si invierte las puntas la lectura cambia de signo: el multímetro mide «punta roja menos punta negra».</li>
<li>Active <b>Tensiones</b> en la barra: las tiras con potencial se colorean (azul = 0 V, rojo = máximo). Así se ve el divisor sin medir.</li>
</ul></div>
</section>

<section>
<h2>Medir corriente: siempre en serie</h2>
<p>La corriente no se «ve» desde fuera: hay que obligarla a pasar por el instrumento. Eso exige <b>abrir el circuito</b> y meter el multímetro en el hueco. En la simulación el circuito (LED con resistor de 470 Ω a 5 V) tiene un hueco entre las columnas 8 y 10 de la mitad superior: allí falta el contacto. Pase la punta roja a una columna y la negra a la otra; seleccione <b>A⎓</b> y la toma <b>mA</b> (cuidado con ese paso).</p>
<div class="sim" data-sim="c2-amperimetro" data-title="Amperímetro en serie: abrir el circuito y medir"></div>
<div class="sim-guide"><ul>
<li>Con el multímetro en serie debe leer ≈ <b>6,5 mA</b>. Observe que la corriente casi no cambió: el multímetro añade 1 Ω a 470 Ω.</li>
<li>Cambie a la toma <b>10 A</b> (el shunt baja a 0,04 Ω): lee lo mismo, y su fusible es de 10 A, de modo que soporta corrientes mucho mayores.</li>
<li>Con la función A⎓ pero la punta roja en la toma <b>V Ω</b> no pasa corriente por el instrumento: el multímetro actúa como un circuito abierto, el LED se apaga y la lectura es cero.</li>
</ul></div>
</section>

<section>
<h2>Medir resistencia, continuidad y diodos: sin energía</h2>
<p>El ohmímetro mide inyectando <b>su propia</b> corriente de prueba, así que la pieza no debe estar alimentada. Además, otras piezas conectadas en paralelo alteran la lectura: lo correcto es medir la resistencia con una pata fuera del circuito. La función de continuidad (·)) es un ohmímetro que pita cuando la resistencia es menor que unos 50 Ω; la de diodo (→|) muestra la caída de tensión directa (un diodo de silicio da ≈ 0,5–0,7 V, un LED rojo ≈ 1,8 V; invertido, «OL»).</p>
</section>

<section>
<h2>Los errores que dañan el instrumento</h2>
<p>Cada uno de estos cuatro montajes reproduce una equivocación real. Cámbielos con la lista y observe qué le ocurre al aparato o a la medida:</p>
<div class="sim" data-sim="c2-trampas" data-title="Cuatro errores clásicos con el multímetro"></div>
<div class="sim-guide"><ul>
<li><b>A. Voltímetro con la punta en «mA».</b> La batería queda en paralelo con una resistencia interna de 1 Ω: circulan 9 V/2,7 Ω ≈ 3,3 A por un fusible de 0,2 A. <b>Se funde</b> (aviso en pantalla); el multímetro sigue vivo, pero ya no mide corriente hasta cambiar el fusible.</li>
<li><b>B. Ohmímetro con el circuito encendido.</b> El instrumento muestra <b>Err</b>: la medida no tiene sentido porque hay tensión donde no debe. En un aparato real puede dañar la entrada.</li>
<li><b>C. Amperímetro en paralelo.</b> Con R₁ = 1 kΩ y R₂ = 2,2 kΩ la corriente sin instrumento es 2,8 mA; con el amperímetro en paralelo con R₁ (lo cortocircuita) se lee 4,1 mA, que no es la corriente de ningún elemento: se perturbó el circuito.</li>
<li><b>D. Carga del voltímetro.</b> El divisor 1 MΩ + 1 MΩ a 9 V da 4,50 V en R₂, pero el multímetro de 10 MΩ en paralelo la deja en 4,29 V (−4,8 %): con resistencias grandes, el instrumento <i>es</i> parte del circuito.</li>
</ul></div>
<div class="box safe"><p><b>Antes de medir, tres preguntas.</b> (1) ¿Qué voy a medir: tensión, corriente o resistencia? (2) ¿En qué toma está la punta roja y en qué función el selector? (3) ¿El instrumento va en paralelo (V) o en serie (A), y el circuito está apagado si es Ω? Si la respuesta de la toma y la función no coincide, no conecte.</p></div>
</section>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una fuente ajustada a 9 V con límite de 100 mA alimenta una resistencia de 47 Ω. ¿En qué modo trabaja y qué tensión hay en la carga?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Corriente deseada.</b> \(9/47=0{,}191\) A, mayor que el límite de 0,1 A.</li>
<li><b>Modo.</b> La fuente pasa a C.C. con \(I=0{,}1\) A.</li>
<li><b>Tensión.</b> \(V=IR=0{,}1\cdot47=4{,}7\) V.</li>
<li><b>Resultado.</b> <span class="ans">Modo C.C., 4,7 V en la carga y 0,47 W.</span></li></ol></details></li>
<li><span class="lvl">Básico</span>El multímetro mide 4,29 V en una resistencia que, sin él, tendría 4,50 V. Si el multímetro tiene 10 MΩ, ¿cuánto vale la resistencia equivalente de la rama? (Nota: el montaje es 1 MΩ + 1 MΩ.)
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Paralelo.</b> \(1\,\text{M}\Omega\parallel10\,\text{M}\Omega=0{,}909\) MΩ.</li>
<li><b>Divisor.</b> \(V=9\cdot\dfrac{0{,}909}{1+0{,}909}=4{,}29\) V.</li>
<li><b>Error.</b> \((4{,}29-4{,}50)/4{,}50=-4{,}8\ \%\).</li>
<li><b>Resultado.</b> <span class="ans">La rama del medidor vale 0,909 MΩ; el instrumento introduce −4,8 %.</span></li></ol></details></li>
<li><span class="lvl">Intermedio</span>Un estudiante deja la punta roja en la toma «mA» y la función en V⎓ y toca los bornes de una batería de 9 V cuya resistencia interna es 1,7 Ω. ¿Qué corriente circula y qué le pasa al fusible de 0,2 A?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Resistencia del camino.</b> 1,7 Ω (batería) + 1 Ω (shunt de mA) = 2,7 Ω.</li>
<li><b>Corriente.</b> \(I=9/2{,}7=3{,}3\) A.</li>
<li><b>Fusible.</b> 3,3 A es 17 veces la corriente nominal: se funde en milisegundos.</li>
<li><b>Resultado.</b> <span class="ans">≈ 3,3 A; el fusible de 0,2 A se funde.</span></li></ol></details></li>
<li><span class="lvl">Intermedio</span>Para medir la corriente de un LED con resistor de 470 Ω a 5 V, ¿dónde se pone el multímetro y qué se espera leer?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Posición.</b> En serie con el LED o con el resistor: se abre el circuito y se intercala el instrumento; toma <b>mA</b>, función A⎓.</li>
<li><b>Valor.</b> \(I=\dfrac{5-1{,}95}{470}\approx6{,}5\) mA.</li>
<li><b>Resultado.</b> <span class="ans">En serie, y se espera ≈ 6,5 mA.</span></li></ol></details></li>
</ol>
</section>
