<template class="chapter-src" data-id="resistores" data-num="5" data-title="Resistores: valor, tolerancia y potencia" data-part="Parte II · Los pasivos en la protoboard" data-short="Ley de Ohm, código de colores, series normalizadas E12/E24, tolerancia, potencia nominal, resistores en serie y en paralelo medidos con el ohmímetro en la protoboard">
<p class="lead">El resistor es la pieza más usada en cualquier circuito y la que más enseña: obedece la ley de Ohm, se lee por colores, tiene tolerancia, se calienta. En la protoboard se identifica por sus bandas, se verifica con el multímetro y se combina en serie o en paralelo para conseguir valores que no existen en el catálogo. Aquí se aprende a leer un resistor, a saber cuánto vale de verdad y a no pedirle más potencia de la que puede disipar.</p>

<section>
<h2>Qué es un resistor</h2>
<p>Un resistor limita la corriente: entre sus patas la tensión es proporcional a la corriente, \(V=IR\) (<b>ley de Ohm</b>). La resistencia de un conductor homogéneo de longitud \(L\) y sección \(A\) es \(R=\rho L/A\), con \(\rho\) la resistividad del material. Los resistores comunes de la protoboard son de <b>película de carbón</b> (barato, ±5 %) o de <b>película metálica</b> (±1 %, más estable), con cuerpo cilíndrico de unos 6 mm y patas axiales. Disipan la energía en forma de calor: \(P=VI=I^2R=V^2/R\).</p>
</section>

<section>
<h2>El código de colores</h2>
<p>Las piezas son demasiado pequeñas para imprimir números; se codifican con bandas de colores. En el resistor de cuatro bandas, las dos primeras son los <b>dígitos</b>, la tercera el <b>multiplicador</b> (potencia de diez) y la cuarta la <b>tolerancia</b>, separada un poco de las demás.</p>
<div class="tablewrap"><table class="tbl"><tr><th>Color</th><th>Negro</th><th>Marrón</th><th>Rojo</th><th>Naranja</th><th>Amarillo</th><th>Verde</th><th>Azul</th><th>Violeta</th><th>Gris</th><th>Blanco</th></tr>
<tr><td>Dígito</td><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td></tr>
<tr><td>Multiplicador</td><td>×1</td><td>×10</td><td>×100</td><td>×1 k</td><td>×10 k</td><td>×100 k</td><td>×1 M</td><td>×10 M</td><td>—</td><td>—</td></tr></table></div>
<p>Tolerancia: <b>dorado</b> ±5 %, <b>plateado</b> ±10 %, <b>marrón</b> ±1 %, rojo ±2 %. <i>Ejemplo:</i> amarillo-violeta-rojo-dorado = 4, 7, ×100, ±5 % = 4700 Ω = 4,7 kΩ ±5 %. Se lee desde el lado donde las bandas están más juntas al borde (la de tolerancia queda al otro extremo).</p>
<h3>Series normalizadas</h3>
<p>No existe un resistor de cada valor posible: los fabricantes producen valores de una <b>serie geométrica</b>. La serie E12 (±10 %) tiene 12 valores por década: 10, 12, 15, 18, 22, 27, 33, 39, 47, 56, 68, 82. La E24 (±5 %) tiene 24 y la E96 (±1 %), 96. Cada valor es el anterior multiplicado por \(10^{1/12}\) (E12), de manera que las tolerancias se solapan y todo valor requerido queda a menos de la tolerancia de uno comercial.</p>
</section>

<section>
<h2>Leer y medir en la protoboard</h2>
<p>El resistor de la simulación se puede cambiar de valor y de tolerancia; las bandas se redibujan. Mida con el multímetro en <b>Ω</b>. El simulador activa las <b>tolerancias reales</b>: cada resistor tiene un valor ligeramente distinto del nominal, dentro del intervalo permitido, igual que los de la caja del laboratorio.</p>
<div class="sim" data-sim="c5-colores" data-title="Bandas de colores y lectura con el ohmímetro"></div>
<div class="sim-guide"><ul>
<li>Un resistor de 4,7 kΩ ±5 % puede medir entre 4,47 kΩ y 4,94 kΩ: aquí mide 4,90 kΩ. Es <b>correcto</b>, no está dañado.</li>
<li>Con ±1 % las lecturas se acercan mucho al valor nominal; con ±10 % el margen es amplio. Para un divisor de precisión, elija 1 %.</li>
<li>Al medir con los dedos tocando ambas puntas, la resistencia del cuerpo (≈ 1 MΩ) se pone en paralelo y baja la lectura de los valores grandes: tome las puntas por el mango, no por el metal.</li>
</ul></div>
</section>

<section>
<h2>Serie y paralelo</h2>
<ul>
<li><b>En serie</b> (la misma corriente por todos) las resistencias se suman: \(R_{eq}=R_1+R_2+R_3\). La combinación es mayor que cualquiera.</li>
<li><b>En paralelo</b> (la misma tensión en todos) se suman las conductancias: \(\dfrac{1}{R_{eq}}=\dfrac1{R_1}+\dfrac1{R_2}+\dfrac1{R_3}\). La combinación es menor que la menor. Para dos resistores: \(R_{eq}=\dfrac{R_1R_2}{R_1+R_2}\).</li>
</ul>
<p>En la protoboard, «en serie» significa que dos resistores comparten <i>una</i> columna y no están conectados a nada más ahí; «en paralelo», que sus dos extremos están en las mismas dos columnas. Elija cada conexión y compare la lectura con la teoría:</p>
<div class="sim" data-sim="c5-redes" data-title="Resistores de 220, 330 y 470 Ω: serie, paralelo y mixta"></div>
<div class="sim-guide"><ul>
<li><b>Serie:</b> 220 + 330 + 470 = 1020 Ω (lectura ≈ 1,02 kΩ).</li>
<li><b>Paralelo:</b> \(1/(1/220+1/330+1/470)=103{,}1\) Ω; la combinación es menor que 220.</li>
<li><b>Mixta:</b> \(220+\dfrac{330\cdot470}{330+470}=413{,}9\) Ω. Observe cómo comparten columnas R₂ y R₃.</li>
<li>Pruebe a mover una punta de columna: la lectura cambia en cuanto el camino medido incluye otro resistor.</li>
</ul></div>
<div class="box note"><p><b>Truco de taller.</b> Para conseguir un valor no normalizado, se combinan dos resistores: 1,5 kΩ ‖ 10 kΩ = 1,30 kΩ; 330 Ω + 100 Ω = 430 Ω. Para duplicar la potencia, se ponen dos iguales en serie o en paralelo: cada uno recibe la mitad de la potencia.</p></div>
</section>

<section>
<h2>Potencia: quién se calienta más</h2>
<p>En un circuito en serie pasa la misma corriente por todos, y la potencia disipada en cada resistor es \(P=I^2R\): <b>el de mayor resistencia es el que más se calienta</b>. Los tres resistores de 1/4 W de la simulación se conectan en serie con 100 Ω, 330 Ω y 1 kΩ. Suba la tensión: el de 1 kΩ es el primero en alcanzar su límite.</p>
<div class="sim" data-sim="c5-potencia" data-title="Tres resistores de 1/4 W en serie: ¿cuál se quema primero?"></div>
<div class="sim-guide"><ul>
<li>A 12 V circulan 8,4 mA: R₁ disipa 7 mW, R₂ 23 mW, R₃ 70 mW (28 % de su nominal).</li>
<li>A 30 V circulan 21 mA: R₃ disipa 0,44 W (1,76× la nominal): si deja correr el tiempo, se calienta y termina <b>quemándose</b>, mientras los otros dos siguen en perfecto estado.</li>
<li>Moraleja: la potencia no depende solo de la corriente, también de cuánto vale la resistencia.</li>
</ul></div>
</section>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un resistor tiene las bandas rojo, rojo, naranja, dorado. ¿Cuánto vale y entre qué valores puede medir?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Dígitos.</b> Rojo = 2, rojo = 2: «22».</li>
<li><b>Multiplicador.</b> Naranja = ×1 k: 22 kΩ. Tolerancia dorado: ±5 %.</li>
<li><b>Intervalo.</b> \(22\ \text{k}\Omega\cdot(1\pm0{,}05)\): de 20,9 kΩ a 23,1 kΩ.</li>
<li><b>Resultado.</b> <span class="ans">22 kΩ ±5 %; puede medir de 20,9 a 23,1 kΩ.</span></li></ol></details></li>
<li><span class="lvl">Básico</span>Se necesita un resistor de 150 Ω y solo hay de 100 Ω y 47 Ω. ¿Cómo se consigue?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Serie.</b> \(100+47=147\ \Omega\), que está a −2 % de 150 Ω: dentro de la tolerancia del 5 %.</li>
<li><b>Resultado.</b> <span class="ans">100 Ω en serie con 47 Ω da 147 Ω ≈ 150 Ω.</span></li></ol></details></li>
<li><span class="lvl">Intermedio</span>Dos resistores de 1 kΩ y 1/4 W se conectan en paralelo a 12 V. ¿Cuánta potencia disipa cada uno y qué corriente total circula?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Por resistor.</b> \(P=V^2/R=144/1000=0{,}144\) W (58 % de la nominal).</li>
<li><b>Corriente.</b> Cada uno \(12/1000=12\) mA; total 24 mA (resistencia equivalente 500 Ω).</li>
<li><b>Resultado.</b> <span class="ans">0,144 W en cada uno; 24 mA en total.</span></li></ol></details></li>
<li><span class="lvl">Intermedio</span>¿Cuál es la potencia máxima que puede disipar una combinación en serie de dos resistores de 1/4 W de 10 kΩ y 22 kΩ?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Corriente máxima por cada uno.</b> \(I_1=\sqrt{0{,}25/10^4}=5\) mA; \(I_2=\sqrt{0{,}25/22000}=3{,}37\) mA.</li>
<li><b>Limita el menor.</b> La corriente del conjunto no puede superar 3,37 mA.</li>
<li><b>Potencia total.</b> \(P=I^2(R_1+R_2)=(3{,}37\cdot10^{-3})^2\cdot32000=0{,}364\) W.</li>
<li><b>Resultado.</b> <span class="ans">0,36 W (en el de 22 kΩ se disipan 0,25 W y en el de 10 kΩ, 0,11 W).</span></li></ol></details></li>
</ol>
</section>
