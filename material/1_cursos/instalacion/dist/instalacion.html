<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Obra Eléctrica: Laboratorio de Instalación Residencial (RETIE & NTC 2050)</title>
<meta name="author" content="Mg. Manuel Alejandro Obando — Departamento de Física, Universidad del Cauca">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Obra Eléctrica — hoja de obra: papel gris verdoso, tinta grafito, naranja de seguridad.
   Diseño: barra de etapas arriba, zona de trabajo (plano o banco) a la izquierda y panel de tarea y revisión a la derecha. */
:root {
  --bg: #E7EAE4;
  --surface: #FAFAF6;
  --surface-2: #DFE3DB;
  --surface-3: #CDD3C9;
  --ink: #171B19;
  --ink-2: #434A46;
  --ink-3: #66706A;
  --rule: #C6CCC2;
  --rule-2: #9FA89E;
  --accent: #BF4B08;
  --accent-ink: #FFFFFF;
  --accent-soft: #F5DFCF;
  --focus: #1D5FD1;
  --ok: #2B7A4B;
  --ok-soft: #D8EBDD;
  --bad: #BD3326;
  --bad-soft: #F4D9D4;
  --warn: #9A6A00;
  --warn-soft: #F2E4BC;
  --plano-fondo: #F6F6F0;
  --muro: #1F2528;
  --muro-ext: #12171A;
  --estr: #8D7F6C;
  --estr-fill: #D5CCBF;
  --mueble: #E7E5DB;
  --mueble-l: #B9B6A8;
  --agua: #BCD6E4;
  --f-display: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
  --sombra: 0 1px 2px rgba(23, 27, 25, .08), 0 10px 24px -14px rgba(23, 27, 25, .25);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101412; --surface: #1A1F1C; --surface-2: #252B27; --surface-3: #323A35; --ink: #E8ECE7; --ink-2: #B4BCB6; --ink-3: #848D87;
    --rule: #333B36; --rule-2: #4F5A53; --accent: #FF8F4A; --accent-ink: #1A0E05; --accent-soft: #3A2616; --focus: #7FB0FF;
    --ok: #5CC48B; --ok-soft: #1B3326; --bad: #FF7A6B; --bad-soft: #3B1F1B; --warn: #E8B84A; --warn-soft: #382E12;
    --plano-fondo: #161B18; --muro: #D9DED7; --muro-ext: #EEF1EC; --estr: #9C8E7B; --estr-fill: #3B362F; --mueble: #262B27; --mueble-l: #4B514B; --agua: #274656;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101412; --surface: #1A1F1C; --surface-2: #252B27; --surface-3: #323A35; --ink: #E8ECE7; --ink-2: #B4BCB6; --ink-3: #848D87;
  --rule: #333B36; --rule-2: #4F5A53; --accent: #FF8F4A; --accent-ink: #1A0E05; --accent-soft: #3A2616; --focus: #7FB0FF;
  --ok: #5CC48B; --ok-soft: #1B3326; --bad: #FF7A6B; --bad-soft: #3B1F1B; --warn: #E8B84A; --warn-soft: #382E12;
  --plano-fondo: #161B18; --muro: #D9DED7; --muro-ext: #EEF1EC; --estr: #9C8E7B; --estr-fill: #3B362F; --mueble: #262B27; --mueble-l: #4B514B; --agua: #274656;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-text-size-adjust: 100%; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.app { max-width: 1520px; margin: 0 auto; padding-block: 12px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Encabezado */
.top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 6px 0 12px; }
.marca { display: flex; align-items: center; gap: 12px; min-width: 0; }
.marca svg { width: 38px; height: 38px; flex: none; }
.marca h1 { font: 700 30px/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase; margin: 0; }
.marca small { display: block; color: var(--ink-3); font-size: 12px; letter-spacing: .02em; margin-top: 2px; }
.top .sp { flex: 1; }
.nota-pill { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 12px; }
.nota-pill b { font: 600 24px/1 var(--f-mono); color: var(--accent); font-variant-numeric: tabular-nums; }
.nota-pill span { font-size: 12px; color: var(--ink-3); line-height: 1.2; }
.btn { border: 1px solid var(--rule-2); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 7px 12px; cursor: pointer; min-height: 36px; }
.btn:hover { background: var(--surface-2); }
.btn.primario { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primario:hover { filter: brightness(1.08); }
.btn.peq { padding: 3px 9px; min-height: 28px; font-size: 13px; }
.btn.peligro { border-color: var(--bad); color: var(--bad); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* Barra de etapas */
.pasos { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; border-bottom: 2px solid var(--ink); margin-bottom: 16px; }
.pasos button { flex: none; display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 8px 12px 9px; cursor: pointer; border-radius: 6px 6px 0 0; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.pasos button:hover { background: var(--surface-2); }
.pasos button[aria-current="page"] { background: var(--ink); color: var(--bg); }
.pasos .n { font: 600 12px var(--f-mono); width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid currentColor; }
.pasos .d { width: 8px; height: 8px; border-radius: 50%; background: var(--rule-2); }
.pasos .d.ok { background: var(--ok); } .pasos .d.falla { background: var(--bad); } .pasos .d.aviso { background: var(--warn); }

/* Cabecera de etapa y columnas */
.cab-etapa { display: grid; grid-template-columns: auto 1fr; gap: 6px 24px; align-items: end; margin-bottom: 14px; }
.cab-etapa .num { font: 600 12px var(--f-mono); color: var(--accent); letter-spacing: .12em; text-transform: uppercase; }
.cab-etapa h2 { font: 700 38px/1 var(--f-display); text-transform: uppercase; margin: 2px 0 0; letter-spacing: .01em; }
.cab-etapa .lead { margin: 0; color: var(--ink-2); max-width: 70ch; }
.cols { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(330px, 1fr); gap: 16px; align-items: start; }
.trabajo, .panel { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 1000px) { .cols { grid-template-columns: minmax(0, 1fr); } .cab-etapa { grid-template-columns: 1fr; } .cab-etapa h2 { font-size: 32px; } }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; box-shadow: var(--sombra); min-width: 0; }
.card h3 { font: 700 19px/1.1 var(--f-display); letter-spacing: .03em; text-transform: uppercase; margin: 0 0 8px; color: var(--ink); }
.card p { margin: 6px 0; }
.card p.nota, .nota { color: var(--ink-2); font-size: 13.5px; }
.ayuda { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
.sub { font: 600 12px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 10px 0 4px; }

/* Revisión */
.rev-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.rev-cab h3 { margin: 0; }
.pill { font: 600 12px var(--f-mono); padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.falla { background: var(--bad-soft); color: var(--bad); } .pill.aviso { background: var(--warn-soft); color: var(--warn); }
.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 420px; overflow-y: auto; }
.it { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 7px 9px; border-radius: 6px; background: var(--surface-2); border-left: 3px solid var(--rule-2); }
.it .ico { font: 700 13px var(--f-mono); width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; background: var(--rule-2); color: var(--surface); margin-top: 1px; }
.it .txt { font-size: 13.5px; line-height: 1.4; }
.it .ref { font: 11.5px var(--f-mono); color: var(--ink-3); margin-top: 2px; }
.it.ok { border-left-color: var(--ok); } .it.ok .ico { background: var(--ok); }
.it.falla { border-left-color: var(--bad); background: var(--bad-soft); } .it.falla .ico { background: var(--bad); }
.it.aviso { border-left-color: var(--warn); background: var(--warn-soft); } .it.aviso .ico { background: var(--warn); }
.it.pend .ico { background: transparent; border: 1.5px dashed var(--ink-3); color: var(--ink-3); }

/* Controles */
.campo { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; }
.campo > label, .lbl { font-weight: 600; font-size: 13.5px; }
select, input[type="number"], input[type="text"] { background: var(--surface); border: 1px solid var(--rule-2); border-radius: 6px; padding: 6px 8px; min-height: 36px; max-width: 100%; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.rango { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.rango output { font: 600 14px var(--f-mono); min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--rule-2); background: var(--surface); border-radius: 99px; padding: 5px 12px; cursor: pointer; min-height: 32px; }
.chip:hover { background: var(--surface-2); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.fila { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.fila.sep { justify-content: space-between; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.kpi { background: var(--surface-2); border-radius: 6px; padding: 8px 10px; }
.kpi b { display: block; font: 600 20px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12px; color: var(--ink-3); }
.kpi.ok b { color: var(--ok); } .kpi.bad b { color: var(--bad); } .kpi.warn b { color: var(--warn); }
.tabla-w { overflow-x: auto; }
.tabla { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.tabla th { text-align: left; font: 600 11.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 5px 8px; border-bottom: 1.5px solid var(--ink); white-space: nowrap; }
.tabla td { padding: 5px 8px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
.tabla tr.ok td:first-child { box-shadow: inset 3px 0 var(--ok); } .tabla tr.falla td:first-child { box-shadow: inset 3px 0 var(--bad); } .tabla tr.aviso td:first-child { box-shadow: inset 3px 0 var(--warn); }
.tabla select { min-height: 30px; padding: 2px 4px; }
.tabla td.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
.leyenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); }
.leyenda label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
.aviso-box { border-left: 3px solid var(--warn); background: var(--warn-soft); padding: 8px 10px; border-radius: 4px; font-size: 13.5px; margin: 8px 0; }
.aviso-box.bad { border-color: var(--bad); background: var(--bad-soft); } .aviso-box.ok { border-color: var(--ok); background: var(--ok-soft); }
.sol { border: 1px dashed var(--rule-2); border-radius: 6px; padding: 8px 10px; margin-top: 8px; font-size: 13px; color: var(--ink-2); }
details.card > summary { cursor: pointer; font: 700 19px var(--f-display); text-transform: uppercase; letter-spacing: .03em; }

/* Plano */
.planta-wrap { position: relative; border: 1px solid var(--rule-2); background: var(--plano-fondo); border-radius: 8px; overflow: hidden; }
.planta { width: 100%; height: clamp(380px, 74vh, 800px); display: block; touch-action: none; cursor: grab; user-select: none; }
.planta:active { cursor: grabbing; }
.zoom-btns { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; }
.zoom-btns button { width: 34px; height: 34px; border-radius: 6px; border: 1px solid var(--rule-2); background: var(--surface); cursor: pointer; font-size: 18px; line-height: 1; }
.pl-fondo { fill: var(--plano-fondo); }
.pl-piso { fill: var(--surface); opacity: .8; }
.pl-eje { stroke: var(--rule-2); stroke-width: .015; stroke-dasharray: .25 .1 .04 .1; }
.pl-burbuja { fill: var(--surface); stroke: var(--ink-3); stroke-width: .02; }
.pl-viga { fill: none; stroke: var(--estr); stroke-width: .02; stroke-dasharray: .1 .07; }
.pl-col { fill: var(--estr-fill); stroke: var(--estr); stroke-width: .02; }
.pl-muro { stroke: var(--muro); stroke-linecap: butt; }
.pl-ventana { stroke: var(--agua); } .pl-ventana-i { stroke: var(--muro); }
.pl-arco { fill: none; stroke: var(--ink-3); stroke-width: .018; stroke-dasharray: .06 .04; } .pl-hoja { stroke: var(--ink-3); stroke-width: .03; }
.pl-mueble { fill: var(--mueble); stroke: var(--mueble-l); stroke-width: .02; }
.pl-mueble.ducha, .pl-mueble.lavamanos, .pl-mueble.lavaplatos, .pl-mueble.lavadero, .pl-mueble.sanitario { fill: var(--agua); }
.pl-txt { font-family: var(--f-body); text-anchor: middle; pointer-events: none; }
.pl-txt:not([fill]) { fill: var(--ink-2); }
.pl-txt.amb { font-size: .24px; font-weight: 600; letter-spacing: .02em; }
.pl-txt.amb, .pl-txt.area, .pl-txt.mueble { fill: var(--ink-3); }
.pl-txt.area { font-size: .17px; fill: var(--ink-3); font-family: var(--f-mono); }
.pl-txt.mueble { font-size: .13px; fill: var(--ink-3); }
.pl-txt.eje { font-size: .2px; font-weight: 600; } .pl-txt.peq { font-size: .2px; text-anchor: start; }
.pl-txt.sw { font-size: .15px; font-weight: 700; text-anchor: start; } .pl-txt.ids { font-size: .14px; font-family: var(--f-mono); text-anchor: start; fill: var(--ink); }
.pl-txt.tg { font-size: .2px; font-weight: 700; fill: var(--ink); }
.pl-sim { fill: var(--plano-fondo); stroke-width: .04; } .pl-sim.fill { fill: currentColor; }
.pl-pt { cursor: pointer; } .pl-pt:hover .pl-sim, .pl-pt.sel .pl-sim { stroke-width: .07; }
.pl-pt.sel::after { content: ''; }
.pl-marca { fill: none; stroke-width: .06; } .pl-marca.ok { stroke: var(--ok); } .pl-marca.falla { stroke: var(--bad); } .pl-marca.aviso { stroke: var(--warn); } .pl-marca.sel { stroke: var(--accent); stroke-width: .08; }
.pl-tgr { fill: var(--ink); stroke: var(--accent); stroke-width: .04; }
.pl-tubo { stroke-linecap: round; opacity: .85; fill: none; } .pl-tubo.piso { stroke-dasharray: .18 .1; }
.pl-lote { fill: none; stroke: var(--rule-2); stroke-width: .03; stroke-dasharray: .3 .15; }
.pl-calle { fill: var(--surface-3); } .pl-anden { fill: var(--surface-2); } .pl-pasto { fill: var(--ok-soft); opacity: .55; }
.pl-mov { cursor: move; }

/* Tablero, cableado, instrumentos */
.svg-banco { width: 100%; height: auto; display: block; background: var(--plano-fondo); border: 1px solid var(--rule-2); border-radius: 8px; touch-action: none; user-select: none; }
.svg-banco text { font-family: var(--f-body); }
.svg-banco text:not([fill]) { fill: var(--ink-2); }
.svg-banco .caja { fill: var(--surface); stroke: var(--rule-2); stroke-width: 1.5; }
.svg-banco .cajatit { font-size: 12px; font-weight: 600; fill: var(--ink-3); }
.svg-banco .term { cursor: crosshair; stroke-width: 2; }
.svg-banco .term:hover { stroke-width: 4; }
.svg-banco .term-t { font-size: 10.5px; }
.svg-banco .cable { fill: none; stroke-width: 5; stroke-linecap: round; cursor: pointer; }
.svg-banco .cable-borde { fill: none; stroke: var(--ink); stroke-width: 7.5; stroke-linecap: round; opacity: .35; }
.svg-banco .cable-fantasma { fill: none; stroke: var(--accent); stroke-width: 3; stroke-dasharray: 6 5; pointer-events: none; }
.paleta { display: flex; flex-wrap: wrap; gap: 8px; }
.carrete { display: flex; align-items: center; gap: 6px; border: 2px solid var(--rule-2); border-radius: 99px; padding: 3px 10px 3px 4px; background: var(--surface); cursor: pointer; font-size: 13px; }
.carrete i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink-3); display: block; }
.carrete.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); font-weight: 600; }
.lampara-on { filter: drop-shadow(0 0 8px #FFD34D); }

.slot { cursor: pointer; }
.slot rect.fondo { fill: var(--surface-2); stroke: var(--rule-2); stroke-width: 1.5; stroke-dasharray: 5 3; }
.slot.lleno rect.fondo { stroke-dasharray: none; fill: var(--surface); stroke: var(--ink-2); }
.slot.obj rect.fondo { stroke: var(--accent); stroke-width: 3; }
.chip-c { cursor: grab; }
.escala { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--surface-2); }
.escala i { display: block; height: 100%; }
.barra-i { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.barra-i b { display: block; height: 100%; background: var(--ok); transition: width .2s; }
.barra-i b.warn { background: var(--warn); } .barra-i b.bad { background: var(--bad); }
.log { max-height: 190px; overflow-y: auto; font: 12.5px/1.45 var(--f-mono); }
.log div { padding: 3px 0; border-bottom: 1px solid var(--rule); }
.log .disparo { color: var(--bad); font-weight: 600; } .log .incendio { color: var(--bad); background: var(--bad-soft); } .log .aviso { color: var(--warn); }

/* Dictamen */
.dict-grande { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.anillo { width: 130px; height: 130px; }
.anillo text { font-family: var(--f-mono); }
.sello { display: inline-block; border: 3px solid currentColor; padding: 4px 14px; font: 700 26px var(--f-display); letter-spacing: .08em; text-transform: uppercase; transform: rotate(-3deg); border-radius: 4px; }
.sello.ok { color: var(--ok); } .sello.bad { color: var(--bad); } .sello.warn { color: var(--warn); }
pre.informe { white-space: pre-wrap; background: var(--surface-2); border-radius: 6px; padding: 12px; font: 12.5px/1.5 var(--f-mono); max-height: 420px; overflow: auto; }

/* Inicio */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 1000px) { .hero { grid-template-columns: 1fr; } }
.hero h2 { font: 700 54px/.95 var(--f-display); text-transform: uppercase; margin: 0 0 12px; }
.lista-etapas { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.lista-etapas li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--rule); }
.lista-etapas b { font: 600 13px var(--f-mono); color: var(--accent); }
.lista-etapas span { color: var(--ink-2); font-size: 14px; }

#toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 50; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; box-shadow: var(--sombra); max-width: 90vw; transition: opacity .4s; }
.toast.ok { background: var(--ok); color: #fff; } .toast.bad { background: var(--bad); color: #fff; }
.toast.sale { opacity: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.cols.una { grid-template-columns: minmax(0, 1fr); }
.cols.una .panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); align-items: start; }
.banco-w { overflow-x: auto; }
.ancho-min { min-width: 640px; }

details.guia { border-left: 4px solid var(--accent); }
details.guia > summary { margin-bottom: 6px; }

          }
          if (!hor && l.eje === 'x' && Math.abs(Math.abs(l.pos - m.a[0]) - F) < 1e-6) {
            const lo = Math.max(Math.min(p0[1], p1[1]), r[1]), hi = Math.min(Math.max(p0[1], p1[1]), r[3]);
            if (hi > lo + EPS) { const sa = G.proyectar(per, [l.pos, lo]).s, sb = G.proyectar(per, [l.pos, hi]).s; out.push({ id: v.id, s0: Math.min(sa, sb), s1: Math.max(sa, sb), tipo: v.tipo }); }

  G.espaciosPared = function (casa, amb, extraCortes = []) {
    const r = casa.libre(amb), per = G.perimetro(r);

    if (!cortes.length) return { per, espacios: [{ s0: 0, s1: per.P, L: per.P, cerrado: true }] };

    for (let i = 0; i < cortes.length; i++) {

    const ex = [];
    /* los mesones interrumpen la línea de piso de la regla general */
    for (const m of casa.muebles) if (m.amb === amb.id && m.tipo === 'meson') {
      const r = casa.libre(amb), per = G.perimetro(r);
      const pts = [[m.rect[0], m.rect[1]], [m.rect[2], m.rect[1]], [m.rect[2], m.rect[3]], [m.rect[0], m.rect[3]]];
      const ss = [];

      if (ss.length >= 2) {
        let s0 = Math.min(...ss), s1 = Math.max(...ss);

    const { per, espacios } = G.espaciosPared(casa, amb, ex);
    const pos = tomas.map((t) => ({ t, q: G.proyectar(per, [t.x, t.y]) })).filter((o) => o.q.d < 0.2);

    for (const e of espacios) {

        const d = dentro.length ? Math.min(...dentro.map((o) => Math.abs(o.s - s))) : Infinity;

  /* ---------- 210.52(C): mesones, toma a no más de 600 mm de cualquier punto ---------- */

      const ss = pts.map((p) => G.proyectar(per, p)).filter((q) => q.d < 0.05).map((q) => q.s);
      if (ss.length >= 2) tramos.push([Math.min(...ss), Math.max(...ss)]);

    add(P.some((p) => p.amb === 'ropas' && p.tipo === 'toma') ? 'ok' : 'falla', 'NTC 2050, 210.52(F)', 'Patio de ropas: al menos una toma para la lavadora.');

      add(d > 0 ? 'ok' : 'falla', 'RETIE 3.28.1 j', `${p.id} en el baño a ${C.fmt(d, 2)} m del espacio de la ducha (fuera de él).`, p.id);

    add(tg.z + 0.2 <= N.UMBRAL.palanca_max ? 'ok' : 'falla', 'RETIE 3.17.19 g', `Palanca más alta a ${C.fmt(tg.z + 0.2, 2)} m del piso (≤ 2,0 m).`);

      for (const p of pts) {
        va += Q.cargaPunto(p, c);
        if (p.tipo === 'lum' || p.tipo === 'aplique') cuenta.lum++;

        const ll = C.llenado([a.awg, a.awg, a.awg, N.gec(a.awg)], 'PVC', a.tubo);
        items.push(ll.ok ? it('ok', 'NTC 2050, Cap. 9, Tabla 1', `Tubo PVC de ${a.tubo} in con 3 conductores de ${a.awg} AWG y la tierra de ${N.gec(a.awg)} AWG: ocupación ${C.fmt(ll.pct, 0)} % (máx. 40 %).`)
          : it('falla', 'NTC 2050, Cap. 9, Tabla 1', `Tubo PVC de ${a.tubo} in al ${C.fmt(ll.pct, 0)} % de ocupación: supera el 40 % para más de dos conductores.`));
      }
    }
    return resumen(items, { info });
  };

  /* ---------------- 3. Puesta a tierra ---------------- */
  /* Resistividad aparente del lote (Wenner) para una separación a */
  O.rhoAp = (E, a) => {
    const s = N.LOTES[E.lote];
    return C.wenner2(a, s.rho1, s.rho2, s.h) * (E.seco ? N.ESTACION_SECA : 1);
  };
  O.rhoDiseno = (E) => O.rhoAp(E, E.tierra.L || 2.4);
  O.tierraInfo = function (E) {
    const t = E.tierra;
    const el = N.ELECTRODOS.find((x) => x.id === t.el);
    const out = { n: t.rods.length, el, rhoVerd: O.rhoDiseno(E) };
    if (t.rods.length && el) {
      const v = C.rVarillas(out.rhoVerd, t.L, el.d, t.rods.map((r) => [r.x, r.y]));
      out.R = v.R; out.R1 = v.R1;
      if (t.rho) out.Rest = C.rVarillas(t.rho, t.L, el.d, t.rods.map((r) => [r.x, r.y])).R;
    }
    let sepMin = Infinity;
    for (let i = 0; i < t.rods.length; i++) for (let j = i + 1; j < t.rods.length; j++) sepMin = Math.min(sepMin, C.dist([t.rods[i].x, t.rods[i].y], [t.rods[j].x, t.rods[j].y]));
    out.sepMin = sepMin;
    return out;
  };
  O.ev.tierra = function (E) {
    const t = E.tierra, a = E.acom;
    const info = O.tierraInfo(E);
    const items = [];
    items.push(!t.wenner.length ? it('pend', 'IEEE 81 / RETIE 3.12', 'Mida la resistividad del lote con el método de Wenner (al menos tres separaciones).')
      : t.wenner.length < 3 ? it('aviso', 'IEEE 81', 'Con menos de tres separaciones no se ve cómo cambia la resistividad con la profundidad.')
        : it('ok', 'IEEE 81 / RETIE 3.12', `${t.wenner.length} mediciones de Wenner realizadas.`));
    if (t.rho != null) {
      const e = Math.abs(t.rho - info.rhoVerd) / info.rhoVerd;
      items.push(e <= 0.25 ? it('ok', 'Memoria de cálculo', `ρ de diseño ${C.fmt(t.rho, 0)} Ω·m (valor real a la profundidad del electrodo: ${C.fmt(info.rhoVerd, 0)} Ω·m).`)
        : it('aviso', 'Memoria de cálculo', `ρ de diseño ${C.fmt(t.rho, 0)} Ω·m difiere más de 25 % de la del terreno a la profundidad del electrodo (${C.fmt(info.rhoVerd, 0)} Ω·m).`));
    } else items.push(it('pend', 'Memoria de cálculo', 'Fije la resistividad de diseño a partir de las mediciones.'));
    if (!t.el) items.push(it('pend', 'RETIE 3.12', 'Escoja el tipo de electrodo.'));
    else items.push(t.el && info.el.ok ? it('ok', 'RETIE 3.12', info.el.nombre + ': electrodo aceptado.') : it('falla', 'RETIE 3.12', info.el.falla));
    items.push(t.L >= N.ELECTRODO.longitudMin - 1e-9 ? it('ok', 'RETIE 3.12', `Longitud del electrodo ${C.fmt(t.L, 1)} m (mínimo 2,4 m).`)
      : it('falla', 'RETIE 3.12', `Longitud ${C.fmt(t.L, 1)} m: el mínimo del RETIE es 2,4 m.`));
    if (!t.rods.length) items.push(it('pend', 'NTC 2050, 250.53', 'Coloque al menos un electrodo en el lote.'));
    else {
      const ok = info.R != null && info.R <= 25 + 1e-9;
      items.push(info.R == null ? it('pend', 'RETIE 3.12', 'Escoja el electrodo para calcular la resistencia.')
        : ok ? it('ok', 'RETIE Tabla 3.12 y NTC 2050, 250.53(A)', `Resistencia de puesta a tierra ${C.fmt(info.R, 1)} Ω ≤ 25 Ω en ${E.seco ? 'época seca' : 'época húmeda'} con ${info.n} electrodo(s).`)
          : it('falla', 'RETIE Tabla 3.12 y NTC 2050, 250.53(A)', `Resistencia ${C.fmt(info.R, 1)} Ω > 25 Ω con ${info.n} electrodo(s): agregue o alargue electrodos.`));
      if (info.n >= 2) items.push(info.sepMin >= 1.8 - 1e-9 ? it('ok', 'NTC 2050, 250.53(B)', `Separación mínima entre electrodos ${C.fmt(info.sepMin, 1)} m (≥ 1,8 m).`)
        : it('falla', 'NTC 2050, 250.53(B)', `Electrodos a ${C.fmt(info.sepMin, 1)} m: separados menos de 1,8 m comparten zona de influencia.`));
      else items.push(info.R != null && info.R <= 25 ? it('ok', 'NTC 2050, 250.53(A)(2)', 'Un solo electrodo con R ≤ 25 Ω no necesita complemento.') : it('aviso', 'NTC 2050, 250.53(A)(2)', 'Un electrodo con más de 25 Ω exige un segundo electrodo.'));
      const lejos = t.rods.every((r) => r.y <= -0.5);
      items.push(lejos ? it('ok', 'Buena práctica', 'Electrodos a 0,5 m o más de la cimentación, en suelo natural del antejardín.') : it('aviso', 'Buena práctica', 'Algún electrodo queda pegado a la cimentación.'));
    }
    if (!a.awg) items.push(it('pend', 'NTC 2050, Tabla 250.66', 'Escoja primero el calibre de la acometida (etapa 2) para dimensionar el conductor del electrodo.'));
    else if (!t.awg) items.push(it('pend', 'NTC 2050, Tabla 250.66', 'Escoja el calibre del conductor del electrodo de puesta a tierra.'));
    else if (N.mayorIgual(t.awg, N.gec(a.awg))) items.push(it('ok', 'NTC 2050, Tabla 250.66', `Conductor del electrodo ${t.awg} AWG de cobre (mínimo ${N.gec(a.awg)} AWG para acometida de ${a.awg} AWG).`));
    else items.push(it('falla', 'NTC 2050, Tabla 250.66', `${t.awg} AWG es menor que el ${N.gec(a.awg)} AWG exigido para una acometida de ${a.awg} AWG.`));
    if (!t.con) items.push(it('pend', 'RETIE 3.12', 'Escoja cómo se une el conductor al electrodo.'));
    else { const c = N.CONEXIONES_TIERRA.find((x) => x.id === t.con); items.push(c.ok ? it('ok', 'RETIE 3.12', c.nombre + ': conexión aceptada.') : it('falla', 'RETIE 3.12', c.falla)); }
    items.push(t.caja ? it('ok', 'RETIE 3.12', 'Caja de inspección de 0,30 m sobre el electrodo para medir sin excavar.') : it('pend', 'RETIE 3.12', 'Falta la caja de inspección de 0,30 m sobre el electrodo.'));
    // medición con telurómetro
    if (t.medido == null) items.push(it('pend', 'IEEE 81', 'Mida la resistencia de puesta a tierra construida con el telurómetro (caída de potencial).'));
    else {
      const e = info.R ? Math.abs(t.medido - info.R) / info.R : 1;
      items.push(e <= 0.15 && t.medido <= 25 ? it('ok', 'IEEE 81 / RETIE 3.12', `Resistencia medida ${C.fmt(t.medido, 1)} Ω ≤ 25 Ω y consistente con el cálculo (${C.fmt(info.R, 1)} Ω).`)
        : t.medido > 25 ? it('falla', 'RETIE 3.12', `La resistencia medida es ${C.fmt(t.medido, 1)} Ω, por encima de 25 Ω.`)
          : it('aviso', 'IEEE 81', `La medición ${C.fmt(t.medido, 1)} Ω difiere más de 15 % del valor real (${C.fmt(info.R, 1)} Ω): coloque las sondas fuera de la zona de influencia (62 % de la distancia a la sonda de corriente).`));
    }
    return resumen(items, { info });
  };

  /* ---------------- 4. Conductores y protecciones ---------------- */
  /* Número de conductores portadores de corriente en el tramo más cargado del circuito */
  O.nPortadores = function (c, tr) {
    let n = 2;
    for (const t of tr) if (t.c === c.id) n = Math.max(n, t.senales.filter((s) => s !== 'T').length);
    return n;
  };
  O.analisisCircuito = function (E, c, casa, tr, cuadro, caidas) {
    casa = casa || O.casaDe(E);
    tr = tr || R.tramos(casa);
    cuadro = cuadro || Q.cuadro(casa);
    caidas = caidas || Q.caidas(casa);
    const r = cuadro.find((x) => x.id === c.id);
    const cd = caidas.find((x) => x.id === c.id);
    const nPort = O.nPortadores(c, tr);
    const out = { Ib: r.I, VA: r.va, nPort, caida: cd.pct, Lmax: cd.Lmax, lejano: cd.lejano };
    if (c.awg) {
      out.Iz = C.ampacidad(c.awg, 60, O.TA, nPort);
      out.pmax = C.protMax(c.awg, 60, O.TA, nPort);
      const cd2 = Q.caidas(casa).find((x) => x.id === c.id);
      out.caida = cd2.pct;
    }
    return out;
  };
  O.ev.circuitos = function (E) {
    const casa = O.casaDe(E);
    const tr = R.tramos(casa), cuadro = Q.cuadro(casa), caidas = Q.caidas(casa);
    const items = [];
    const det = {};
    // recibo de materiales
    const rec = E.cables.recibo;
    const nRec = N.ROLLOS.length;
    const hechos = N.ROLLOS.filter((r) => rec[r.id] != null).length;
    if (hechos < nRec) items.push(it('pend', 'RETIE 3.2.2 y Libro 3 (productos)', `Recibo de materiales: revise los ${nRec} rollos (${hechos} revisados).`));
    else {
      const bien = N.ROLLOS.every((r) => (rec[r.id] === 'acepta') === r.ok);
      items.push(bien ? it('ok', 'RETIE 3.2.2 y Libro 3 (productos)', 'Recibo de materiales: aceptó el rollo conforme y rechazó los tres que no cumplen.')
        : it('falla', 'RETIE 3.2.2 y Libro 3 (productos)', 'Recibo de materiales: hay rollos mal aceptados o rechazados.'));
    }
    for (const c of E.circuitos) {
      const a = O.analisisCircuito(E, c, casa, tr, cuadro, caidas);
      det[c.id] = a;
      if (!c.awg || !c.In || !c.tierra) { items.push(it('pend', 'NTC 2050, 210.19 y 240.4', `${c.id} ${c.nombre}: escoja calibre, protección y tierra.`, { c: c.id })); continue; }
      const prob = [];
      const nota = [];
      if (c.In < a.Ib - 1e-9) prob.push(`protección de ${c.In} A menor que la corriente de ${C.fmt(a.Ib, 1)} A`);
      if (c.In > a.pmax + 1e-9) prob.push(`${c.awg} AWG con ${a.nPort} conductores soporta ${C.fmt(a.Iz, 1)} A y solo admite protección hasta ${a.pmax} A, no ${c.In} A`);
      if (!N.mayorIgual(c.tierra, N.egc(c.In))) prob.push(`tierra de ${c.tierra} AWG: para ${c.In} A la Tabla 250.122 pide ${N.egc(c.In)} AWG como mínimo`);
      if (N.awgNum(c.tierra) < N.awgNum(c.awg)) prob.push(`la tierra (${c.tierra} AWG) no necesita ser mayor que el conductor de fase (${c.awg} AWG)`);
      if (['C4', 'C5', 'C6'].includes(c.id) && (c.In !== 20 || !N.mayorIgual(c.awg, '12'))) prob.push('los circuitos de pequeños artefactos de cocina y de lavandería son de 20 A con 12 AWG como mínimo (210.11(C))');
      if (c.id === 'C7') {
        if (c.In < 30) prob.push('la ducha se dimensiona para 30 A como mínimo (RETIE 3.17.15 b)');
        if (!N.mayorIgual(c.awg, '10')) prob.push('para 30 A el conductor es 10 AWG como mínimo');
      }
      if (c.In === 20 && !N.mayorIgual(c.awg, '12') && !['C4', 'C5', 'C6'].includes(c.id)) prob.push('protección de 20 A exige 12 AWG');
      if (a.caida > 5) prob.push(`caída de tensión ${C.fmt(a.caida, 1)} % (> 5 %)`);
      else if (a.caida > 3) nota.push(`caída ${C.fmt(a.caida, 1)} % (recomendado ≤ 3 % en el ramal)`);
      if (prob.length) items.push(it('falla', 'NTC 2050, 210.19, 240.4, 250.122', `${c.id}: ` + prob.join('; ') + '.', { c: c.id }));
      else if (nota.length) items.push(it('aviso', 'NTC 2050, 210.19 FPN', `${c.id}: ${c.In} A, ${c.awg} AWG, tierra ${c.tierra} AWG cumplen; ${nota.join('; ')}.`, { c: c.id }));
      else items.push(it('ok', 'NTC 2050, 210.19, 240.4, 250.122', `${c.id}: ${C.fmt(a.Ib, 1)} A ≤ ${c.In} A ≤ ${a.pmax} A; ${c.awg} AWG (Iz ${C.fmt(a.Iz, 1)} A, ${a.nPort} conductores), tierra ${c.tierra} AWG, caída ${C.fmt(a.caida, 2)} %.`, { c: c.id }));
    }
    return resumen(items, { det });
  };

  /* ---------------- 5. Canalizaciones y cajas ---------------- */
  /* Caja de un nodo: conductores que concurren, aparatos y volumen mínimo */
  O.cajaNodo = function (casa, c, id, tr) {
    const p = casa.punto(id);
    const conds = [];
    let tierras = 0;
    for (const t of tr) {
      if (t.c !== c.id) continue;
      if (t.u !== id && t.v !== id) continue;
      t.senales.forEach((s, i) => { if (s === 'T') tierras++; else conds.push(t.calibres[i]); });
    }
    let aparatos = 0;
    if (p.tipo === 'int2') aparatos = 2; else if (['int', 'conm', 'toma', 'ducha', 'estufa'].includes(p.tipo)) aparatos = 1;
    if (p.tipo === 'toma' && p.ap === 'gfci-ip') aparatos = 1;
    const aAwg = conds.length ? conds.sort((x, y) => N.awgNum(x) - N.awgNum(y))[0] : c.awg;
    const req = C.volumenCaja({ conds, aparatos, aparatosAwg: aAwg, tierras: tierras ? 1 : 0, abrazaderas: false });
    return { conds: conds.length + tierras, aparatos, req };
  };
  O.grupoCaja = (p) => (p.tipo === 'lum' || p.tipo === 'aplique' ? 'lum' : (p.tipo === 'ducha' || p.tipo === 'estufa') ? 'esp' : 'apar');
  O.CAJAS_GRUPO = { lum: ['oct-38', 'cuad-38', 'cuad-54'], apar: ['rect-pvc', 'rect-met', 'cuad-38', 'cuad-54'], esp: ['rect-pvc', 'cuad-38', 'cuad-54'] };
  O.cajaDe = (E, p) => N.CAJAS.find((x) => x.id === (E.canal.nodo[p.id] || E.canal.cajas[O.grupoCaja(p)]));
  /* Cajas sin volumen suficiente, con la caja mínima que serviría */
  O.cajasMalas = function (E, casa, tr) {
    casa = casa || O.casaDe(E); tr = tr || R.tramos(casa);
    const out = [];
    for (const c of casa.electrico.circuitos) {
      const nodos = new Set();
      c.arbol.forEach(([u, v]) => { nodos.add(u); nodos.add(v); });
      for (const id of nodos) {
        if (id === 'TG') continue;
        const p = casa.punto(id), cj = O.cajaDe(E, p), cb = O.cajaNodo(casa, c, id, tr);
        if (!cj || cb.req <= cj.vol + 1e-9) continue;
        const min = O.CAJAS_GRUPO[O.grupoCaja(p)].map((k) => N.CAJAS.find((x) => x.id === k)).sort((a, b) => a.vol - b.vol).find((x) => x.vol >= cb.req) || null;
        out.push({ id, c: c.id, caja: cj, req: cb.req, conds: cb.conds, aparatos: cb.aparatos, min });
      }
    }
    return out;
  };
  O.ev.canal = function (E) {
    const casa = O.casaDe(E);
    const tr = R.tramos(casa);
    const items = [];
    const mat = E.canal.mat;
    for (const c of E.circuitos) {
      if (!c.tubo || !c.nivel) { items.push(it('pend', 'NTC 2050, Cap. 9, Tabla 1', `${c.id} ${c.nombre}: escoja nivel y diámetro del tubo.`, { c: c.id })); continue; }
      let peor = null;
      for (const t of tr) if (t.c === c.id) {
        const ll = C.llenado(t.calibres, mat, c.tubo);
        if (!peor || ll.pct > peor.pct) peor = { pct: ll.pct, ok: ll.ok, min: ll.minimo, n: ll.n, t };
      }
      const prob = [];
      if (peor && !peor.ok) prob.push(`tubo de ${c.tubo} in al ${C.fmt(peor.pct, 0)} % en ${peor.t.u}–${peor.t.v} con ${peor.n} conductores (máx. ${C.fmt(100 * N.llenadoMax(peor.n), 0)} %; mínimo ${peor.min ? peor.min.d : '—'} in)`);
      if (c.nivel === 'losa') {
        const tubo = N.TUBOS[mat].find((x) => x.d === c.tubo);
        const lo = R.tuboEnLosa({ de: tubo.de });
        if (!lo.okD) prob.push(`un tubo de ${C.fmt(tubo.de, 1)} mm no cabe en una losa de 12 cm (máx. ${C.fmt(lo.limD, 0)} mm = e/3, NSR-10 C.6.3)`);
      }
      items.push(prob.length ? it('falla', 'NTC 2050 Cap. 9 y NSR-10 C.6.3', `${c.id}: ` + prob.join('; ') + '.', { c: c.id })
        : it('ok', 'NTC 2050 Cap. 9', `${c.id}: tubo ${mat} de ${c.tubo} in en ${c.nivel === 'losa' ? 'la losa' : 'el contrapiso'}, ocupación máxima ${C.fmt(peor.pct, 0)} % (límite ${C.fmt(100 * N.llenadoMax(peor.n), 0)} %).`, { c: c.id }));
    }
    // interferencias con la estructura
    const filtro = casa.electrico.circuitos.every((c) => c.nivel);
    const inter = R.interferencias(casa);
    const crit = inter.filter((x) => x.critico), norm = inter.filter((x) => !x.critico && x.tipo !== 'cim' && x.tipo !== 'caja');
    items.push(crit.length ? it('falla', 'NSR-10 C.6.3 y buena práctica', `${crit.length} interferencia(s) crítica(s) con la estructura: ${crit[0].texto}`)
      : norm.length ? it('ok', 'NSR-10 C.6.3', `${norm.length} cruce(s) de vigas fuera de la zona de confinamiento: se dejan camisas antes del vaciado con la aprobación del ingeniero estructural.`)
        : it('ok', 'NSR-10 C.6.3', 'Ningún tubo cruza vigas ni columnas en zona crítica.'));
    // cajas
    const grupos = ['lum', 'apar', 'esp'];
    const sinCaja = grupos.filter((g) => !E.canal.cajas[g]);
    if (sinCaja.length) items.push(it('pend', 'NTC 2050, 314.16', 'Escoja la caja para luminarias, aparatos (interruptores y tomas) y salidas especiales.'));
    else {
      const malas = O.cajasMalas(E, casa, tr);
      items.push(malas.length ? it('falla', 'NTC 2050, 314.16(B)', `${malas.length} caja(s) sin volumen suficiente; por ejemplo ${malas[0].id} necesita ${C.fmt(malas[0].req, 0)} cm³ y la caja tiene ${C.fmt(malas[0].caja.vol, 0)} cm³.`, { malas })
        : it('ok', 'NTC 2050, 314.16(B)', 'Todas las cajas tienen el volumen necesario para sus conductores y aparatos.'));
      const rect = casa.electrico.puntos.some((p) => O.grupoCaja(p) === 'apar' && O.cajaDe(E, p).id === 'rect-pvc');
      void rect;
    }
    return resumen(items, { inter, tr });
  };

  /* ---------------- 6. Tablero ---------------- */
  O.ev.tablero = function (E) {
    const casa = O.casaDe(E);
    const tg = casa.punto('TG'), sit = O.SITIOS[E.tab.sitio];
    const items = [];
    // sitio
    if (tg.amb === 'bano') items.push(it('falla', 'RETIE 3.17.19 f', 'El tablero no puede quedar en el baño ni dentro del espacio de la ducha.'));
    else {
      const esp = G.espacioTrabajo(casa, tg);
      const prob = [];
      if (!esp.ok) prob.push(`espacio de trabajo de ${C.fmt(esp.prof, 2)} m de profundidad (mínimo 0,9 m)`);
      if (tg.z + 0.2 > N.UMBRAL.palanca_max) prob.push('la palanca queda a más de 2,0 m del piso');
      const am = casa.ambiente(tg.amb);
      if (prob.length) items.push(it('falla', 'RETIE 3.17.19 y Título 4 e', prob.join('; ') + '.'));
      else if (am && am.humedo) items.push(it('aviso', 'RETIE 3.17.19', `${sit.nombre}: zona húmeda; el tablero exige un encerramiento adecuado y queda expuesto a salpicaduras.`));
      else items.push(it('ok', 'RETIE 3.17.19 y Título 4 e', `${sit.nombre}: espacio libre frontal de ${C.fmt(esp.prof, 2)} m, palanca a ${C.fmt(tg.z + 0.2, 2)} m, fuera de zonas húmedas.`));
    }
    // principal
    const info = O.acomInfo(E, casa);
    const a = E.acom;
    if (!E.tab.total) items.push(it('pend', 'NTC 2050, 230.90 y 408', 'Escoja el interruptor principal del tablero.'));
    else if (E.tab.total < info.I) items.push(it('falla', 'NTC 2050, 230.90', `El principal de ${E.tab.total} A es menor que la demanda de ${C.fmt(info.I, 1)} A.`));
    else if (a.awg && E.tab.total > C.protMax(a.awg, 60)) items.push(it('falla', 'NTC 2050, 240.4', `El principal de ${E.tab.total} A no protege el alimentador de ${a.awg} AWG.`));
    else items.push(it('ok', 'NTC 2050, 230.90', `Principal de 2 polos y ${E.tab.total} A.`));
    // circuitos colocados
    const sl = O.slots(E);
    const sin = E.circuitos.filter((c) => !sl[c.id]);
    items.push(sin.length ? it('pend', 'NTC 2050, 408', `Falta colocar en el tablero: ${sin.map((c) => c.id).join(', ')}.`)
      : it('ok', 'NTC 2050, 408', 'Todos los circuitos tienen su interruptor en el tablero.'));
    // ducha diferencial
    const cd = E.circuitos.find((c) => c.arbol.some(([, v]) => casa.punto(v) && casa.punto(v).tipo === 'ducha'));
    if (cd && sl[cd.id]) items.push(sl[cd.id].tipo === 'dif' ? it('ok', 'RETIE 3.17.15 c', `${cd.id} (ducha): interruptor con protección diferencial de 30 mA.`)
      : it('falla', 'RETIE 3.17.15 c', `${cd.id} (ducha): falta la protección diferencial de 30 mA en el tablero.`));

    });

      OB.s('line', { x1: X(t), x2: X(t), y1: m.t, y2: H - m.b, stroke: 'var(--rule)', 'stroke-width': 1 }, svg);
      OB.s('text', { x: X(t), y: H - m.b + 15, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--ink-3)' }, svg, String(t));
    });
    OB.s('rect', { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: 'none', stroke: 'var(--ink-3)' }, svg);

/* ===================================================================

(function () {
  'use strict';
  const OB = window.OB, O = OB.O, L = OB.L, C = OB.C, N = OB.N, Q = L.Q;

  /* Vista lateral: poste, vano, punto de amarre, medidor y casa */
  function dibujaAcometida(host, E) {
    const a = E.acom, lote = N.LOTES[E.lote];
    OB.vaciar(host);
    const W = 560, H = 262, gy = 205, k = 20;
    const svg = OB.s('svg', { viewBox: `0 0 ${W} ${H}`, class: 'svg-banco', role: 'img', 'aria-label': 'Vista lateral de la acometida: poste de la red, cable, punto de amarre y medidor' });
    const col = (c) => `var(--${c})`;
    OB.s('rect', { x: 0, y: gy, width: W, height: H - gy, fill: 'var(--surface-2)' }, svg);
    OB.s('line', { x1: 0, y1: gy, x2: W, y2: gy, stroke: 'var(--ink-2)', 'stroke-width': 2 }, svg);
    // poste
    const px = 44, py0 = gy - 8 * k;
    OB.s('rect', { x: px - 5, y: py0, width: 10, height: 8 * k, fill: 'var(--rule-2)', stroke: 'var(--ink-3)' }, svg);
    OB.s('rect', { x: px - 24, y: py0 + 6, width: 48, height: 5, fill: 'var(--ink-3)' }, svg);
    OB.s('text', { x: px, y: gy + 20, 'text-anchor': 'middle', 'font-size': 13 }, svg, 'Poste de la red BT');
    // casa
    const hx = 340, hw = 190, hh = 2.62 * k;
    OB.s('rect', { x: hx, y: gy - hh, width: hw, height: hh, fill: 'var(--surface)', stroke: 'var(--ink)', 'stroke-width': 3 }, svg);
    OB.s('rect', { x: hx - 6, y: gy - hh - 8, width: hw + 12, height: 8, fill: 'var(--ink-3)' }, svg);
    OB.s('text', { x: hx + hw / 2, y: gy - hh / 2, 'text-anchor': 'middle', 'font-size': 14, fill: 'var(--ink-3)' }, svg, 'Vivienda');
    // distancia
    OB.s('line', { x1: px, y1: gy + 34, x2: hx, y2: gy + 34, stroke: 'var(--ink-3)', 'marker-end': 'url(#fl)' }, svg);
    OB.s('text', { x: (px + hx) / 2, y: gy + 54, 'text-anchor': 'middle', 'font-size': 13 }, svg, `Distancia a la red: ${lote.red} m`);
    const yA = gy - a.amarre * k;
    const lowest = a.amarre - N.FLECHA;
    const okAlt = lowest >= N.ACOMETIDA_ALTURAS.fachada;
    // línea de 3,0 m
    const y3 = gy - 3.0 * k;
    OB.s('line', { x1: px + 20, y1: y3, x2: hx, y2: y3, stroke: 'var(--ok)', 'stroke-dasharray': '6 4', 'stroke-width': 1.5 }, svg);
    OB.s('text', { x: px + 28, y: y3 - 4, 'font-size': 12, fill: 'var(--ok)' }, svg, 'mínimo 3,0 m (230.24)');
    if (a.tipo === 'aerea') {
      const yp = gy - 6.5 * k;
      OB.s('path', { d: `M${px + 18} ${yp} Q${(px + hx) / 2} ${(yp + yA) / 2 + 14} ${hx} ${yA}`, fill: 'none', stroke: okAlt ? 'var(--ok)' : 'var(--bad)', 'stroke-width': 3 }, svg);
      OB.s('path', { d: `M${hx} ${yA} q-14 ${N.FLECHA * k + 4} -2 ${N.FLECHA * k} `, fill: 'none', stroke: okAlt ? 'var(--ok)' : 'var(--bad)', 'stroke-width': 3 }, svg);
      OB.s('circle', { cx: hx, cy: yA, r: 5, fill: 'var(--accent)' }, svg);
      OB.s('text', { x: W - 8, y: 22, 'text-anchor': 'end', 'font-size': 14, fill: okAlt ? 'var(--ok)' : 'var(--bad)', 'font-weight': 600 }, svg, `amarre a ${OB.fmt(a.amarre, 1)} m · punto más bajo ${OB.fmt(lowest, 2)} m`);
      // bajante hasta el medidor
      OB.s('line', { x1: hx + 4, y1: yA, x2: hx + 4, y2: gy - a.medZ * k, stroke: 'var(--ink-2)', 'stroke-width': 3 }, svg);
    } else {
      OB.s('rect', { x: px, y: gy + 12, width: hx - px, height: 8, fill: 'var(--warn-soft)', stroke: 'var(--warn)' }, svg);
      OB.s('line', { x1: px, y1: gy + 16, x2: hx + 4, y2: gy + 16, stroke: 'var(--ink)', 'stroke-width': 3, 'stroke-dasharray': '10 4' }, svg);
      OB.s('line', { x1: hx + 4, y1: gy + 16, x2: hx + 4, y2: gy - a.medZ * k, stroke: 'var(--ink)', 'stroke-width': 3 }, svg);
      OB.s('text', { x: (px + hx) / 2, y: gy + 11, 'text-anchor': 'middle', 'font-size': 12, fill: 'var(--warn)' }, svg, 'PVC enterrado a 0,6 m con cinta de aviso');
    }
    // medidor
    const mz = gy - a.medZ * k;
    const dentro = a.medidor && a.medidor !== 'fachada';
    const mx = a.medidor === 'patio' ? hx + hw - 24 : (dentro ? hx + 50 : hx - 22);
    OB.s('rect', { x: mx, y: mz - 20, width: 22, height: 34, rx: 3, fill: 'var(--surface)', stroke: dentro ? 'var(--bad)' : 'var(--ink)', 'stroke-width': 2 }, svg);
    OB.s('circle', { cx: mx + 11, cy: mz - 5, r: 7, fill: 'none', stroke: 'var(--ink-2)' }, svg);
    OB.s('text', { x: mx + 11, y: mz + 26, 'text-anchor': 'middle', 'font-size': 12 }, svg, `medidor ${OB.fmt(a.medZ, 2)} m`);
    // marcador de flecha
    const defs = OB.s('defs', null, svg);
    const mk = OB.s('marker', { id: 'fl', markerWidth: 8, markerHeight: 8, refX: 7, refY: 4, orient: 'auto' }, defs);
    OB.s('path', { d: 'M0 0L8 4L0 8z', fill: 'var(--ink-3)' }, mk);
    host.append(svg);
  }

  OB.etapas.acometida = function (root) {

        OB.h('span', null, OB.h('i', { class: 'dot', style: { background: OB.COL_C[r.id] } }), r.id), r.nombre, r.amb, OB.h('span', { class: 'mono' }, OB.fmt(r.va, 0)), OB.h('span', { class: 'mono' }, OB.fmt(r.I, 1))].map((x, i) => (i >= 3 ? OB.h('span', { class: 'mono' }, x.textContent) : x))), 'compacta'));
      tabla.append(OB.h('div', { class: 'kpis', style: { marginTop: '8px' } },
        OB.h('div', { class: 'kpi' }, OB.h('b', null, OB.fmt(d.instalada, 0)), OB.h('span', null, 'VA instalados')),
        OB.h('div', { class: 'kpi' }, OB.h('b', null, OB.fmt(casa.areaConstruida(), 1)), OB.h('span', null, 'm² construidos (caras exteriores)'))));
    };

    const pintaCalc = () => {
      OB.vaciar(calc);
      const casa = O.casaDe(E), d = Q.demanda(casa);
      calc.append(OB.h('p', { class: 'nota' }, 'Método estándar de vivienda (NTC 2050, 220.12, 220.52, 220.42, 220.53 y 220.55): alumbrado y tomas generales a 33 VA/m²; dos circuitos de pequeños artefactos y uno de lavandería a 1 500 VA; los primeros 3 000 VA al 100 % y el resto al 35 %; la estufa por la Tabla 220.55 y la ducha como artefacto fijo.'));
      calc.append(OB.campo('Área construida (m²)', OB.num(a.area, (v) => { a.area = v; nuevo(); }, { min: 0 })));
      calc.append(OB.campo('Demanda total (VA)', OB.num(a.va, (v) => { a.va = v; nuevo(); }, { min: 0 }), 'Incluya la estufa de 6 kW y la ducha de 3 500 W.'));
      const det = OB.h('div');
      const btn = OB.h('button', { class: 'btn peq', type: 'button', onclick: () => {
        if (!a.ver) { a.ver = true; E.pistas = (E.pistas || 0) + 1; nuevo(); }
        OB.vaciar(det);
        det.append(OB.tabla(['Paso', 'Valor (VA)', 'Norma'], d.pasos.map((p) => [p.t, OB.h('span', { class: 'mono' }, OB.fmt(p.va, 0)), p.ref])), OB.h('div', { class: 'fila sep', style: { marginTop: '6px' } }, OB.h('strong', null, 'Total'), OB.h('strong', { class: 'mono' }, OB.fmt(d.total, 0) + ' VA · ' + OB.fmt(d.I240, 1) + ' A')));
      } }, a.ver ? 'Mostrar el cálculo' : 'Ver el cálculo paso a paso (pista, −2 puntos)');
      calc.append(btn, det);
      if (a.ver) btn.click();
    };

    const pintaCtrl = () => {

      const info = O.acomInfo(E, O.casaDe(E));
      ctrl.append(OB.campo('Sistema de alimentación', OB.chips([['1F2H', 'Monofásico 120 V (2 hilos)'], ['1F3H', 'Monofásico 120/240 V (3 hilos)'], ['3F4H', 'Trifásico 208/120 V']], a.sistema, (v) => { a.sistema = v; nuevo(); pintaCtrl(); }, 'Sistema')));
      ctrl.append(OB.campo('Calibre de la acometida (cobre THHN/THWN-2)', OB.chips(['10', '8', '6', '4', '2'].map((x) => [x, x + ' AWG']), a.awg, (v) => { a.awg = v; if (a.tubo == null) a.tubo = null; nuevo(); pintaCtrl(); }, 'Calibre'),
        a.awg ? `${a.awg} AWG: ${info.ampac} A (columna de 60 °C) · capacidad instalable ${OB.fmt(info.ci.kVA, 1)} kVA` : 'Elija el calibre para ver su capacidad.'));

      }

/* ==== ui/22-tierra.js ==== */
/* ===================================================================
   ui/22-tierra.js — Etapa 3: puesta a tierra
   Medición de resistividad por Wenner, diseño del arreglo de
   electrodos sobre el antejardín (arrastrables), resistencia por
   Dwight con interacción entre electrodos y medición final con
   telurómetro por caída de potencial.
   =================================================================== */
(function () {
  'use strict';
  const OB = window.OB, O = OB.O, L = OB.L, C = OB.C, N = OB.N;
  const YARD = { x0: -1.3, x1: 9.3, y0: -6.3, y1: -0.45 };

  OB.etapas.tierra = function (root) {
    const E = OB.E, t = E.tierra;
    const { trabajo, panel } = OB.pantalla(root, {
      num: 'Etapa 3', titulo: 'Puesta a tierra',
      lead: 'La tierra es la referencia de seguridad de toda la instalación. Mida cómo conduce el suelo del lote, diseñe los electrodos para quedar por debajo de 25 Ω incluso en verano y compruebe la obra con el telurómetro.'
    });
    let tool = 'mover', sel = -1;
    const wrap = OB.h('div');
    const informe = OB.h('div'), wen = OB.h('div'), diseno = OB.h('div'), telu = OB.h('div');
    let influencia = true;

    const pl = new OB.Planta(wrap, {
      E, bounds: [-1.9, -7.4, 9.9, 3.2], capas: { ejes: false, estr: false, muebles: false, nombres: false, ilum: false, ctrl: false, tomas: false, esp: false },
      aria: 'Antejardín del lote con los electrodos de puesta a tierra',
      onBg: (q) => {
        if (tool !== 'agregar') return;
        if (q.x < YARD.x0 || q.x > YARD.x1 || q.y < YARD.y0 || q.y > YARD.y1) { OB.toast('Coloque el electrodo dentro del antejardín', 'bad'); return; }
        if (t.rods.length >= 8) { OB.toast('Máximo ocho electrodos', 'bad'); return; }
        t.rods.push({ x: Math.round(q.x * 10) / 10, y: Math.round(q.y * 10) / 10 });
        sel = t.rods.length - 1; OB.cambio('tierra');
      },
      onMove: (id, q, fin) => {
        const r = t.rods[+id];
        if (!r || tool === 'agregar') return;
        r.x = Math.max(YARD.x0, Math.min(YARD.x1, Math.round(q.x * 20) / 20)); r.y = Math.max(YARD.y0, Math.min(YARD.y1, Math.round(q.y * 20) / 20));
        sel = +id;
        if (fin) OB.cambio('tierra'); else { pl.render(); pintaInforme(); }
      }
    });
    pl.extra = (svg, self) => {
      OB.s('rect', { x: YARD.x0 - 0.2, y: 0.075, width: YARD.x1 - YARD.x0 + 0.4, height: 5.75, class: 'pl-pasto' }, svg);
      OB.s('rect', { x: -1.9, y: 6.4, width: 11.8, height: 0.9, class: 'pl-calle' }, svg);
      OB.s('rect', { x: -1.9, y: 5.82, width: 11.8, height: 0.58, class: 'pl-anden' }, svg);
      OB.s('text', { x: 4, y: 6.9, class: 'pl-txt amb' }, svg, 'Andén y calle');
      OB.s('text', { x: 4, y: 3.5, class: 'pl-txt amb' }, svg, 'Antejardín: zona de electrodos');
      const g = OB.s('g', null, svg);
      // medidor y barra
      OB.s('rect', { x: 0.3, y: 0.05, width: 0.4, height: 0.25, fill: 'var(--ink)' }, g);
      OB.s('text', { x: 0.5, y: 0.5, class: 'pl-txt peq', 'text-anchor': 'middle' }, g, 'medidor');
      const rods = t.rods;
      if (influencia) rods.forEach((r) => OB.s('circle', { cx: r.x, cy: -r.y, r: t.L, fill: 'var(--ok)', opacity: 0.1, stroke: 'var(--ok)', 'stroke-width': 0.02, 'stroke-dasharray': '.1 .1', 'pointer-events': 'none' }, g));
      if (rods.length) {
        const pts = [[0.5, 0.2], ...rods.map((r) => [r.x, -r.y])].map((p) => p.join(',')).join(' ');
        OB.s('polyline', { points: pts, fill: 'none', stroke: 'var(--warn)', 'stroke-width': 0.05, 'stroke-dasharray': '.15 .08', 'pointer-events': 'none' }, g);

      } else if (modo === 'pol') inst.append(OB.h('p', { class: 'nota' }, 'El probador de tomas enciende tres luces según la conexión y se complementa con la continuidad del conductor de tierra. Toque cada tomacorriente del plano: al menos una por circuito, y todas las que resulten sospechosas. Anillo verde: correcta; rojo: con defecto.'),

      else if (modo === 'gfci') inst.append(OB.h('p', { class: 'nota' }, 'Cada GFCI se prueba con su botón TEST: debe disparar y volver a rearmar. Toque cada toma con círculo naranja.'));

    function pintaEn() {

    OB.subs.push((q) => { if (q === 'tema') return; if (q !== 'prueba' && q !== 'sel') reconstruir(); pl.render(); pintaInst(); pintaFallas(); pintaVivo(); });

(function () {

  /* ---------- Estado de los indicadores ---------- */
  function estadoEtapa(id) {
    if (!O.ev[id]) return '';
    try { const r = O.ev[id](OB.E); return r.listo ? 'ok' : r.falla ? 'falla' : r.aviso && !r.pend ? 'aviso' : ''; } catch (e) { return ''; }
  }
  let pend = false;
  function refrescarCabecera() {
    if (pend) return;
    pend = true;
    requestAnimationFrame(() => {
      pend = false;
      try {
        const nav = OB.$('#pasos');
        OB.$$('button', nav).forEach((b) => {
          const d = OB.$('.d', b);
          if (d) d.className = 'd ' + estadoEtapa(b.dataset.id);
        });
        const p = O.puntaje(OB.E);
        OB.$('#nota b').textContent = p.nota;
      } catch (e) { console.error(e); }
    });
  }

  function pintarNav() {
    const nav = OB.vaciar(OB.$('#pasos'));
    OB.NAV.forEach((e) => {
      nav.append(OB.h('button', { type: 'button', data: { id: e.id }, 'aria-current': e.id === OB.actual ? 'page' : null, onclick: () => ir(e.id) },
        OB.h('span', { class: 'n' }, e.n), e.nombre, O.ev[e.id] ? OB.h('span', { class: 'd' }) : null));
    });
  }
  function ir(id) {
    if (OB.limpieza) { try { OB.limpieza(); } catch (e) { /* nada */ } OB.limpieza = null; }
    OB.actual = id;
    try { history.replaceState(null, '', '#' + id); } catch (e) { /* sin historial */ }
    pintarNav();
    const root = OB.vaciar(OB.$('#etapa'));
    OB.limpiarSubs();
    OB.subs.push(refrescarCabecera);
    (OB.etapas[id] || OB.etapas.inicio)(root);
    refrescarCabecera();
    window.scrollTo({ top: 0 });
  }
  OB.ir = ir;

  /* ---------- Inicio ---------- */
  OB.etapas.inicio = function (root) {
    const E = OB.E;
    const nombre = OB.h('input', { type: 'text', value: E.nombre || '', placeholder: 'Nombre del constructor', maxlength: 60, oninput: (e) => { E.nombre = e.target.value; OB.guardar(); } });

    const pintaReinicio = () => {
      OB.vaciar(reinicio);
      reinicio.append(confirmar
        ? OB.h('div', { class: 'aviso-box bad' }, 'Se borrarán todas sus decisiones de obra. ', OB.h('button', { class: 'btn peq peligro', type: 'button', onclick: () => { const o = { nombre: E.nombre, modo: E.modo, lote: E.lote }; OB.nuevoEstado(o); confirmar = false; OB.toast('Obra reiniciada'); ir('inicio'); } }, 'Sí, reiniciar'), ' ', OB.h('button', { class: 'btn peq', type: 'button', onclick: () => { confirmar = false; pintaReinicio(); } }, 'Cancelar'))
        : OB.h('button', { class: 'btn peq', type: 'button', onclick: () => { confirmar = true; pintaReinicio(); } }, 'Reiniciar la obra'));
    };
    pintaReinicio();
    const lotes = OB.h('div');
    const pintaLotes = () => {
      OB.vaciar(lotes);
      lotes.append(OB.chips(Object.keys(N.LOTES).map((k) => [k, N.LOTES[k].nombre]), E.lote, (v) => { E.lote = v; OB.cambio('lote'); pintaLotes(); }, 'Lote'));
      lotes.append(OB.h('p', { class: 'ayuda' }, N.LOTES[E.lote].desc + ` Red de baja tensión a ${N.LOTES[E.lote].red} m del frente.`));
    };
    pintaLotes();
    const modos = OB.h('div');
    const pintaModos = () => {
      OB.vaciar(modos);
      modos.append(OB.chips([['guiado', 'Guiado: revisión en vivo'], ['inspector', 'Inspector: revisión a solicitud']], E.modo, (v) => { E.modo = v; OB.cambio('modo'); pintaModos(); }, 'Modo'));
      modos.append(OB.h('p', { class: 'ayuda' }, E.modo === 'guiado' ? 'Cada decisión se evalúa al instante y se le dice qué norma se incumple.' : 'Como un inspector real: decide, pide la revisión de la etapa y recibe el resultado. Cada solicitud queda en el dictamen.'));
    };
    pintaModos();
    root.append(OB.h('div', { class: 'hero' },
      OB.h('div', null,
        OB.h('h2', null, 'Instale usted la red eléctrica de la casa'),
        OB.h('p', { class: 'lead', style: { fontSize: '17px', color: 'var(--ink-2)', maxWidth: '58ch' } },
          'Una vivienda de 82 m² en Popayán, con su plano eléctrico: 12 luminarias, 29 tomas, ducha y estufa eléctricas. Usted es el constructor. Calcule la demanda, tienda la acometida, clave el electrodo, escoja cada cable, su color y su tubo, arme el tablero, cablee las cajas, energice y pase la inspección. Todo es simulado y se evalúa con el RETIE y la NTC 2050.'),
        OB.card('Datos de la obra',
          OB.campo('Constructor', nombre), OB.campo('Lote', lotes), OB.campo('Modo de trabajo', modos),
          OB.h('div', { class: 'fila' }, OB.h('button', { class: 'btn primario', type: 'button', onclick: () => ir('plano') }, 'Comenzar la obra'), reinicio))),
      OB.h('div', null,
        OB.card('Las ocho etapas',
          OB.h('ol', { class: 'lista-etapas' },
            [['Plano y puntos', 'Lea el plano, mueva y agregue tomas y compruebe la regla de los 1,8 m y los GFCI.'],
              ['Demanda y acometida', 'Calcule la carga, escoja el calibre, el principal y el medidor.'],
              ['Puesta a tierra', 'Mida el suelo con Wenner, clave los electrodos y mida con el telurómetro.'],
              ['Conductores y protecciones', 'Reciba los rollos, escoja calibre, protección y tierra de cada circuito.'],
              ['Canalizaciones y cajas', 'Llenado de tubos, cruces con vigas y volumen de cada caja.'],
              ['Tablero', 'Ubíquelo, reparta los circuitos entre las fases y cierre el puente neutro–tierra.'],
              ['Colores y cableado', 'Cablee cinco montajes con el código de colores y vea si funcionan.'],
              ['Energizar y probar', 'Megger, polaridad, GFCI, plena carga, cortocircuitos y fugas.']].map((x, i) => OB.h('li', null, OB.h('b', null, String(i + 1)), OB.h('div', null, OB.h('strong', null, x[0]), OB.h('span', { style: { display: 'block' } }, x[1]))))),
          OB.h('p', { class: 'nota' }, 'Al final, el dictamen suma el puntaje y declara si la obra cumple como esquema constructivo (RETIE 3.3.2).')),
        OB.card('Cómo se maneja', OB.h('dl', { class: 'manejo' }, OB.manejo.map((m) => [OB.h('dt', null, m[0]), OB.h('dd', null, m[1])]))),
        OB.card('Para tener en cuenta',
          OB.h('p', { class: 'nota' }, 'El progreso se guarda en este navegador. Los valores normativos provienen de la guía «Cableado con criterio» (RETIE vigente a octubre de 2026 y NTC 2050); verifíquelos en la norma oficial antes de usarlos en una obra real. Material didáctico del Departamento de Física, Universidad del Cauca.')))));
  };

  /* ---------- Tema ---------- */
  function tema() {
    const r = document.documentElement;
    const oscuro = r.dataset.theme === 'dark' || (!r.dataset.theme && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    r.dataset.theme = oscuro ? 'light' : 'dark';
    OB.cambio('tema');
  }

  /* ---------- Arranque ---------- */
  function arrancar() {
    if (!OB.cargar()) OB.nuevoEstado({});
    OB.E.cert = OB.E.cert || {};
    OB.$('#btn-tema').addEventListener('click', tema);
    const h = (location.hash || '').replace('#', '');
    pintarNav();
    ir(OB.NAV.some((e) => e.id === h) ? h : 'inicio');
    window.addEventListener('hashchange', () => { const x = location.hash.replace('#', ''); if (x !== OB.actual && OB.NAV.some((e) => e.id === x)) ir(x); });

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrancar); else arrancar();
