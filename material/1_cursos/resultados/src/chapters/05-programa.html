<p class="lead">Un resultado de aprendizaje se escribe para un programa concreto. Este capítulo recoge lo que el propio programa dice de sí mismo en los documentos que reunió para la visita de pares: su presentación, el plan de estudios, el plan de mejoramiento, los microcurrículos, las actas y las encuestas. Con eso se corrigió lo que este curso suponía al principio, y se ve con claridad qué está hecho y qué falta en materia de resultados de aprendizaje.</p>

<section>

<tr><td>Línea de tiempo</td><td>Estructuración en 1995; reformas curriculares entre 1998 y 2000; registro calificado en 2004 y 2011; nuevo currículo desde 2017; renovación del registro calificado por 7 años; <b>acreditación de alta calidad en 2019 (Resolución MEN 8333 de 2019)</b>; nueva renovación del registro en 2025-2026 (la diapositiva cita la Res. 23384, con el número cortado)</td></tr>

<div class="box warn"><h4>Una corrección a este curso</h4><p>En su primera versión este curso afirmaba, a partir de la ficha pública, que no constaba una acreditación del programa. Era un error de la fuente: el programa está acreditado desde 2019 y esta visita corresponde a la <b>renovación</b> de la acreditación. El modelo que se aplicó fue el del Acuerdo CESU 02 de 2020 (la presentación evalúa los doce factores de ese modelo, con el Factor 5 «Aspectos académicos y resultados de aprendizaje»).</p></div>

<section>
<h2>Lo que declara el programa sobre resultados de aprendizaje</h2>
<p>La presentación incluye una lámina titulada «Resultados de Aprendizaje · Programa de Ingeniería Física» con <b>tres resultados</b>, cuatro indicadores de evaluación, una periodicidad semestral, el Comité de Programa como responsable y un ciclo de mejoramiento continuo. Los textos completos, el análisis y las observaciones están en el capítulo 9. Desde ahora conviene retener dos hechos que ordenan el resto del curso:</p>
<ol class="chain">
<li><b>Hay resultados definidos.</b> Los tres resultados existen, están redactados en lenguaje de egresado y mencionan contextos reales (investigación, pasantías, empresa, comunidad).</li>
<li><b>Lo que falta está después de la definición.</b> Ninguno de los 49 microcurrículos revisados menciona los resultados de aprendizaje, los indicadores son conteos de participación y no hay actas ni informes de análisis de logro. Es el ciclo de los capítulos 11 a 14, aún sin cerrar.</li>
</ol>
</section>

<section>
<h2>Cómo leer el plan de estudios como evaluador</h2>
<p>El plan abarca cálculo, álgebra lineal y ecuaciones diferenciales; mecánica, electromagnetismo, termodinámica, vibraciones y ondas, óptica, física moderna, mecánica cuántica y estado sólido; electrónica, transductores, interfaces, procesamiento de señales y control; ciencia de los materiales, métodos de análisis y diseño de experimentos; el Taller de Ingeniería Física, formulación de proyectos, planes de negocio y gestión tecnológica; electivas; y trabajo de grado en dos semestres. Con esa lista se pueden hacer tres preguntas que luego usará la matriz del capítulo 10:</p>
<ol class="chain">
<li><b>¿Dónde está el diseño?</b> Hay electrónica y un Taller de Ingeniería Física basado en proyectos y prototipos, que declara objetivos «por competencias». ¿Cuál es la evidencia de que el estudiante diseña de principio a fin y valida?</li>
<li><b>¿Dónde se aprende a medir con incertidumbre?</b> La línea de instrumentación y las asignaturas con laboratorio son abundantes; la metrología es una seña de identidad del programa. ¿Hay un lugar donde se exija y se evalúe la incertidumbre?</li>
<li><b>¿Dónde se integra todo?</b> El trabajo de grado cumple esa función, con modalidades de investigación, práctica profesional (pasantía) y otras. Dos modalidades distintas producen evidencias distintas del mismo resultado.</li>
</ol>
<div class="box note"><h4>Una pequeña inconsistencia que conviene resolver</h4><p>El microcurrículo del Taller de Ingeniería Física dice que está orientado a estudiantes de sexto semestre, y la tabla del plan de estudios lo ubica en séptimo. Es un detalle, pero los pares comparan documentos. Es mejor que el plan, los microcurrículos y el informe digan lo mismo.</p></div>
</section>

<section>
<h2>Qué evidencias hay y cuáles faltan</h2>
<p>La carpeta que el programa reunió para la visita contiene mucho material útil y algunos huecos. Para resultados de aprendizaje, el balance es este:</p>
<div class="tablewrap"><table>
<tr><th>Evidencia</th><th>Estado en los documentos recibidos</th></tr>
<tr><td>Resultados del programa (3) con indicadores, periodicidad y responsable</td><td class="ok">Existen (lámina de la presentación)</td></tr>
<tr><td>PEP actualizado en 2023 con resultados y perfil</td><td class="mid">Se menciona en la presentación; el documento del PEP no estaba en la carpeta, y otra lámina habla de «proponer» incluirlos. Aclarar</td></tr>
<tr><td>Plan de estudios, créditos, horas con y sin profesor</td><td class="ok">Completos y coherentes con el sistema de créditos</td></tr>
<tr><td>Microcurrículos (49 archivos: 29 Word y 20 PDF)</td><td class="bad">Existen, pero ninguno menciona «resultados de aprendizaje»; el formato usa «objetivo general» y «objetivos por competencias»</td></tr>
<tr><td>Registro de actualización de microcurrículos</td><td class="mid">Es una lista de asignaturas y docentes, sin estados ni fechas</td></tr>
<tr><td>Actas del comité sobre microcurrículos y resultados</td><td class="bad">Ocho actas en el formato institucional, con fecha y un tema («Re-acreditación», «Informa sobre auditoría interna»); sin desarrollo, decisiones ni firmas, y ninguna trata de resultados de aprendizaje</td></tr>
<tr><td>Plan de mejoramiento 2025-2027</td><td class="mid">Incluye una acción sobre resultados: informe semestral de seguimiento a los microcurrículos que incluya su aporte a los resultados del programa. Las fechas de esa fila aparecen vacías</td></tr>
<tr><td>Rúbricas, evidencias de logro, datos por cohorte</td><td class="bad">No aparecen en la carpeta</td></tr>
<tr><td>Encuestas a egresados, empleabilidad, caracterización de estudiantes, Permaneser</td><td class="ok">Existen; son evidencia indirecta o de contexto</td></tr>
<tr><td>Carpetas marcadas «falta»</td><td class="mid">Puntajes de Saber 11 / datos de ingreso a Saber Pro; modalidades de trabajo de grado con ejemplos de resoluciones</td></tr>
</table></div>
<p>Los 49 microcurrículos se revisaron con un escaneo automático de texto (29 Word y 20 PDF; cuatro archivos Word antiguos, en formato .doc, no se pudieron leer). El escaneo busca la expresión «resultados de aprendizaje» y no encontró ninguna. Un microcurrículo podría tratar el tema con otras palabras («logros», «competencias»); por eso conviene también mirarlos a mano.</p>
</section>

<section>
<h2>Para practicar</h2>
<ol class="problems">
<li><span class="lvl">Cálculo</span> El plan tiene 165 créditos en 10 semestres, con 3 créditos = 9 h semanales y 4 créditos = 12 h. ¿Cuántas horas semanales de dedicación total supone el promedio de un semestre de 16 semanas?
<details><summary>Respuesta</summary><p>165/10 = 16,5 créditos por semestre; 16,5 × 48 = 792 horas; 792/16 ≈ 49,5 horas por semana. El primer semestre (20 créditos) pide 60 horas semanales. Es una dedicación alta que los pares pueden relacionar con los indicadores de deserción en los primeros semestres que el propio plan de mejoramiento reconoce.</p></details></li>
<li><span class="lvl">Reflexión</span> Un par pregunta: «Los resultados están en el PEP de 2023, ¿cómo se enteran los profesores?». Con lo que hay en la carpeta, ¿qué respondería?
<details><summary>Qué mirar</summary><p>Con los microcurrículos tal como están, la respuesta honesta es que todavía no hay un mecanismo: los resultados no figuran en los formatos de las asignaturas. La acción del plan de mejoramiento (informe semestral de aporte de los microcurrículos a los resultados) es el camino, y conviene mostrarla con fechas y avance.</p></details></li>
</ol>
</section>
