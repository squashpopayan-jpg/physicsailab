<p class="lead">Después de la visita, lo importante es convertir lo aprendido en un plan con fechas y responsables. Este capítulo propone una ruta realista: quién hace qué, qué se hace en el primer mes, cómo calcular los plazos hacia atrás desde la fecha de entrega del informe y qué se entiende por un «ciclo mínimo viable» para tener datos reales cuanto antes.</p>

<section>
<h2>La observación que hay que responder</h2>
<p>La observación de los pares sobre los resultados tiene un orden natural: primero que existan de forma oficial, luego que se vean en las asignaturas, luego que se evalúen y por último que produzcan mejoras. Un compromiso que el programa puede asumir por escrito, con ese orden y con entregables verificables:</p>
<div class="tablewrap"><table>
<tr><th>Etapa</th><th>Entregable</th><th>Evidencia que queda</th></tr>
<tr><td>1. Formular</td><td>PEP limpio y aprobado; resultados aprobados por el Comité de Programa; descripción de cómo se definieron.</td><td>Acto de aprobación, acta con contenido, PEP vigente publicado.</td></tr>
<tr><td>2. Implementar</td><td>Campo de resultados en el formato de microcurrículo; microcurrículos y sílabos actualizados; matriz curricular.</td><td>Microcurrículos con resultados, matriz aprobada, informe semestral de aporte (acción ya prevista en el plan de mejoramiento).</td></tr>
<tr><td>3. Evaluar</td><td>Ficha de cada resultado con indicadores de desempeño, rúbrica, plan de evidencias y meta (es el «formato de evaluación»).</td><td>Fichas, rúbricas, registros de calibración.</td></tr>
<tr><td>4. Mejorar</td><td>Primer ciclo de medición con tres resultados; acta con decisiones; una acción verificable.</td><td>Tablero de logro, acta, plan de mejoramiento con estado.</td></tr>
</table></div>
<p>Las fechas dependen del momento en que llegue el informe oficial de los pares y de los plazos del Ministerio y del CNA, que este curso no conoce. La herramienta de cronograma de más abajo permite calcular qué es viable en el tiempo disponible.</p>
</section>

<section>
<h2>Roles: nadie lo hace todo</h2>
<div class="tablewrap"><table>
<tr><th>Rol</th><th>Responsabilidad</th></tr>
<tr><td><b>Coordinación del programa</b></td><td>Liderar el proceso, convocar el comité, representar al programa ante la Universidad y los pares.</td></tr>
<tr><td><b>Comité curricular</b></td><td>Aprobar resultados, analizar datos, decidir acciones y dejar acta.</td></tr>
<tr><td><b>Responsable de cada resultado</b></td><td>Un profesor «dueño» por resultado: mantiene la rúbrica, coordina la evidencia y presenta el análisis anual de ese resultado.</td></tr>
<tr><td><b>Profesores de asignatura</b></td><td>Aplicar la rúbrica en sus cursos, entregar la evidencia y participar en la calibración.</td></tr>
<tr><td><b>Estudiantes y egresados</b></td><td>Participar en la definición y la validación, y retroalimentar sobre cómo se vive el proceso.</td></tr>
<tr><td><b>Oficina de autoevaluación de la Universidad</b></td><td>Orientar sobre el procedimiento institucional, los formatos y los plazos.</td></tr>
</table></div>
<p>La decisión más útil para mantener el proceso vivo es la del <b>responsable por resultado</b>: sin un nombre propio asignado, los resultados quedan «de todos» y por tanto de nadie.</p>
</section>

<section>
<h2>Los primeros treinta días</h2>
<ol class="chain">
<li><b>Semana 1: aclarar el marco.</b> Confirmar por escrito con la Oficina de Autoevaluación qué modelo de acreditación aplica a su trámite y qué guías del CNA están vigentes (capítulo 2). Ubicar la política institucional de resultados de aprendizaje.</li>
<li><b>Semana 2: inventario.</b> Con la ficha de trabajo y el autodiagnóstico, saber con qué se cuenta y qué falta. Reunir los documentos existentes (capítulos 5 y 15).</li>
<li><b>Semana 3: decidir la ruta.</b> Dejar el PEP en limpio y aprobado (capítulo 9), decidir si se mantienen tres resultados o se amplían (el objetivo 4, de ética, no tiene resultado), y definir el campo de resultados en el formato de microcurrículo.</li>
<li><b>Semana 4: constituir el equipo y los roles.</b> Nombrar responsables por resultado y calendarizar el comité curricular.</li>
</ol>
</section>

<section>
<h2>Cronograma hacia atrás</h2>
<p>Los plazos se calculan mejor desde el final: se fija la fecha en que debe estar listo el informe de autoevaluación y se reparten las tareas hacia atrás, respetando las dependencias (no se pueden calibrar evaluadores antes de tener rúbricas, ni analizar resultados antes de recolectarlos). La herramienta hace ese cálculo con diez tareas típicas y muestra si el tiempo alcanza desde hoy.</p>
<p>Las duraciones propuestas son una referencia: la recolección de evidencia de un periodo académico, por ejemplo, es de 16 semanas (112 días) porque depende del calendario académico y no se puede acelerar. Las demás tareas pueden comprimirse o ejecutarse en paralelo.</p>
<div class="sim" data-sim="cronograma" data-title="Cronograma hacia atrás desde la entrega del informe"></div>
<div class="box warn"><h4>Cuidado con el calendario académico</h4><p>La herramienta cuenta días corridos. Los periodos académicos, las vacaciones y los cierres de semestre limitan cuándo se puede recoger evidencia. Contraste el resultado con el calendario académico vigente de la Universidad antes de comprometer fechas.</p></div>
</section>

<section>
<h2>El ciclo mínimo viable</h2>
<p>Esperar a tener todo para comenzar es la manera más segura de no tener nada. Un <b>ciclo mínimo viable</b> es un primer ciclo completo, pequeño pero real:</p>
<ol class="chain">
<li>Escoger <b>tres resultados</b>: el programa ya tiene tres, RA1, RA2 y RA3, y el primer ciclo puede hacerse sobre esos, con indicadores de desempeño precisados (capítulo 9). Si en cambio adopta una estructura más amplia, escoja los tres más prioritarios.</li>
<li>Para cada uno, <b>una rúbrica</b> de tres o cuatro criterios y <b>dos asignaturas</b> donde se aplicará: una intermedia y una cercana al egreso.</li>
<li>Una <b>sesión de calibración</b> entre los profesores participantes.</li>
<li><b>Un periodo académico</b> de recolección y calificación.</li>
<li>Un <b>análisis</b> con el tablero de logro y su lectura en el comité curricular.</li>
<li><b>Una o dos acciones</b> concretas, con responsable, fecha e indicador.</li>
</ol>
<p>Con eso, el programa tiene en seis a nueve meses una evidencia verdadera del funcionamiento del ciclo para tres resultados, algo mucho más convincente que un documento extenso para nueve resultados sin datos. Los otros seis se incorporan en los ciclos siguientes, en rotación (capítulo 14).</p>
</section>

<section>
<h2>Riesgos habituales y cómo evitarlos</h2>
<div class="tablewrap"><table>
<tr><th>Riesgo</th><th>Señal temprana</th><th>Respuesta</th></tr>
<tr><td>Fatiga del equipo</td><td>Las reuniones se aplazan; el proceso depende de una persona.</td><td>Repartir responsables por resultado; ciclos pequeños; reconocer el trabajo.</td></tr>
<tr><td>Cumplimiento formal</td><td>Se produce el documento pero no cambia nada en los cursos.</td><td>Exigir al menos una acción verificable por ciclo.</td></tr>
<tr><td>Sobrecarga de evaluación</td><td>Los profesores protestan por el trabajo extra.</td><td>Evaluación embebida; muestras; rotación de resultados.</td></tr>
<tr><td>Datos poco confiables</td><td>κ bajo; cambios bruscos entre periodos.</td><td>Calibrar; revisar rúbricas; no sacar conclusiones con muestras pequeñas.</td></tr>
<tr><td>Cambios de norma</td><td>Nuevas guías del CNA; cambios de modelo en 2027.</td><td>Construir sobre el ciclo, que es común a ambos modelos, y revisar el vocabulario.</td></tr>
</table></div>
</section>

<section>
<h2>Lo que este curso no puede decidir por usted</h2>
<ul>
<li>Los resultados de aprendizaje definitivos del programa.</li>
<li>Los procedimientos internos de la Universidad del Cauca y las instancias que aprueban.</li>
<li>El modelo de acreditación aplicable a su trámite y la fecha exacta del informe.</li>
<li>Las metas de logro: son decisión de la comunidad del programa.</li>
</ul>
<p>Lo que sí puede hacer es ordenar el trabajo y evitar los errores más frecuentes. Las plantillas del apéndice C, la lista de fuentes del apéndice B y el glosario del apéndice A son el equipaje de viaje.</p>
</section>

<li><span class="lvl">Cronograma</span> Fije en la herramienta la entrega del informe para el 1 de febrero de 2028. ¿Cuándo debe comenzar el programa? ¿Qué pasa si la entrega es en septiembre de 2027?
<details><summary>Qué mirar</summary><p>La ruta crítica de las diez tareas es de 372 días. Para entregar el 1 de febrero de 2028 el programa debe empezar el 25 de enero de 2027: hay holgura. Para entregar a fines de septiembre de 2027 tendría que haber empezado el 23 de septiembre de 2026, es decir, antes de hoy: desde el 6 de noviembre de 2026 quedan 328 días y la ruta necesita 372. Habría que comprimir tareas, ejecutar en paralelo o reducir el alcance con el ciclo mínimo viable.</p></details></li>
<li><span class="lvl">Decisión</span> Para el primer ciclo, ¿qué evidencia usaría para cada uno de los tres resultados vigentes, y cuál le resultaría más difícil?
<details><summary>Qué mirar</summary><p>RA1 se apoya en problemas abiertos de cursos de ciencias básicas y de ingeniería; RA2, en el Taller de Ingeniería Física y el trabajo de grado; RA3, en las pasantías y los proyectos en equipo. El más difícil de evaluar suele ser RA3, porque el liderazgo exige un concepto externo (supervisor) y una rúbrica de conductas.</p></details></li>
</ol>
