<p class="lead">La rúbrica es el instrumento que convierte un trabajo de estudiante en un dato de logro. Sin ella, cada profesor juzga con su criterio y los números no son comparables entre cursos ni entre cohortes. Con ella, y con una calibración mínima, se puede decir con alguna seguridad «el 68 % de los estudiantes alcanza el nivel logrado en incertidumbre». Este capítulo enseña a construirla y a medir si dos evaluadores concuerdan.</p>

<section>
<h2>Rúbrica analítica: criterios por niveles</h2>
<p>Una <span class="term">rúbrica analítica</span> es una tabla donde las filas son <b>criterios</b> (los indicadores de desempeño) y las columnas son <b>niveles</b>, cada celda con la descripción de lo que se observa en ese nivel. Es la herramienta que el Acuerdo 02 de 2020 supone cuando habla de valorar «periódicamente, o de manera formativa y permanente, el logro de los resultados de aprendizaje» (característica 22).</p>
<div class="box law"><h4>Cuatro niveles bastan</h4><p>Inicial · En desarrollo · Logrado · Sobresaliente. Con cuatro niveles no hay posición «intermedia» cómoda, se distinguen bien las conductas y se calibra más fácilmente que con seis o siete. Conviene que la meta del programa se defina como «nivel 3 o superior».</p></div>
<h3>Cómo escribir los descriptores</h3>
<ol class="chain">
<li><b>Escriba primero el nivel «Logrado».</b> Es el estándar del programa. Descríbalo con conductas observables.</li>
<li><b>Derive los demás por contraste.</b> «En desarrollo» es lo que le falta para llegar; «Inicial», lo que casi no tiene; «Sobresaliente», lo que añade.</li>
<li><b>Evite adjetivos vacíos.</b> «Bueno», «excelente», «adecuado» no se pueden calibrar. Use cantidades, presencia o ausencia de elementos, o calidad con un criterio.</li>
<li><b>Que los niveles difieran en una sola dimensión.</b> No mezcle «dos fuentes» con «redacción confusa» en la misma celda.</li>
<li><b>Pruébela con trabajos reales</b> antes de usarla: si no puede ubicar un trabajo en un nivel sin dudar, el descriptor es ambiguo.</li>
</ol>
</section>

<section>
<h2>Constructor y calculadora de rúbrica</h2>
<p>La herramienta trae una rúbrica de ejemplo para un resultado de experimentación y metrología (RA3 de la propuesta ampliada; los resultados vigentes no lo tratan por separado, ver capítulo 9): cuatro criterios con pesos y descriptores. Edítela, agregue criterios y califique un trabajo hipotético eligiendo el nivel de cada criterio; la calculadora da el nivel ponderado. El texto exportable sirve para llevarla a un documento.</p>
<div class="sim" data-sim="rubrica" data-title="Constructor de rúbricas analíticas"></div>
<div class="box warn"><h4>Nota o nivel</h4><p>Para el análisis de resultados del programa es mejor conservar el <b>nivel por criterio</b> que convertir todo a una nota. La nota mezcla criterios y la conversión depende del reglamento de la Universidad. Un trabajo puede tener 4,0 y mostrar un nivel inicial en incertidumbre: la nota lo oculta; el nivel por criterio lo muestra.</p></div>
</section>

<section>
<h2>Calibrar: que dos evaluadores vean lo mismo</h2>
<p>Una rúbrica sin calibración tiene validez en el papel. La calibración es una sesión corta (una hora) con los profesores que van a usarla:</p>
<ol class="chain">
<li>Se escogen de cinco a ocho trabajos <b>anónimos</b>, que cubran el rango (alto, medio, bajo).</li>
<li>Cada evaluador los califica solo, sin consultar.</li>
<li>Se comparan las calificaciones, criterio por criterio.</li>
<li>Se discuten las discrepancias hasta que el descriptor se aclara o se reescribe.</li>
<li>Se repite con otro conjunto si las discrepancias fueron muchas.</li>
</ol>
<p>Después, un subconjunto de trabajos reales (por ejemplo, el 20 %) lo califican dos evaluadores. Con esos datos se calcula la concordancia.</p>
</section>

<section>
<h2>Medir la concordancia: el κ de Cohen</h2>
<p>El porcentaje de acuerdos engaña: dos evaluadores que calificaran al azar coincidirían a veces. El coeficiente κ de Cohen descuenta el acuerdo esperado por azar. Si \(p_o\) es la proporción de acuerdos observada y \(p_e\) la esperada por azar a partir de las frecuencias marginales,</p>
<div class="eq key" data-name="Kappa de Cohen">\[\kappa=\frac{p_o-p_e}{1-p_e}\]</div>
<p>Como los niveles de una rúbrica están ordenados, un desacuerdo de un nivel es menos grave que uno de tres. El <span class="term">κ ponderado</span> penaliza los desacuerdos según su distancia (con pesos lineales o cuadráticos). Una escala habitual de lectura es la de Landis y Koch (1977): menos de 0,2 leve; 0,2 a 0,4 aceptable; 0,4 a 0,6 moderada; 0,6 a 0,8 sustancial; más de 0,8 casi perfecta. Como criterio práctico, una rúbrica se acepta para evaluar resultados si el κ ponderado supera 0,6.</p>
<div class="sim" data-sim="kappa" data-title="Concordancia entre dos evaluadores"></div>
<p>Pruebe los tres ejemplos de la herramienta. En «buena concordancia» el acuerdo observado es del 69 %, el κ es 0,585 (moderada) y el κ ponderado 0,815 (casi perfecta): casi todos los desacuerdos son de un solo nivel. En «sin calibrar» el acuerdo cae al 28 %, apenas por encima del azar (κ = 0,04). En «por azar» el κ es exactamente cero aunque haya cierto acuerdo.</p>
<div class="box note"><h4>Otras medidas</h4><p>El alfa de Cronbach mide la consistencia interna de un instrumento con varios criterios (si miden lo mismo). Es útil para validar una rúbrica o un cuestionario, pero no reemplaza al κ: uno mide si los criterios van juntos, el otro si dos evaluadores coinciden.</p></div>
</section>

<section>
<h2>Para practicar</h2>
<ol class="problems">
<li><span class="lvl">Redacción</span> Escriba los cuatro descriptores del criterio «Diseño del experimento» para RA3. Evite adjetivos vacíos.
<details><summary>Una posibilidad</summary><p>Inicial: no controla variables ni justifica el diseño. En desarrollo: controla las variables principales pero no justifica el número de mediciones. Logrado: controla variables, justifica el número de repeticiones y prevé fuentes de error. Sobresaliente: además optimiza el diseño frente a alternativas y estima su sensibilidad.</p></details></li>
<li><span class="lvl">Interpretación</span> Dos evaluadores concuerdan en el 80 % de los trabajos, pero casi todos están en el nivel 3. ¿Por qué puede ser engañoso el 80 %?
<details><summary>Respuesta</summary><p>Si ambos asignan casi siempre el nivel 3, coinciden mucho por azar y κ puede ser bajo aunque el acuerdo observado sea alto. Es la paradoja del κ con distribuciones muy desbalanceadas: conviene mirar también la tabla completa y, si hace falta, complementar con otras medidas.</p></details></li>
</ol>
</section>
