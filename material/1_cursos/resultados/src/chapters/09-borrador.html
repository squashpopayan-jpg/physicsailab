<p class="lead">El programa ya tiene resultados de aprendizaje. Este capítulo los toma tal como aparecen en la presentación a los pares, los analiza con las herramientas del curso y propone cómo avanzar. No parte de cero ni de un borrador ajeno: parte de lo que el programa ya declaró. Las observaciones son de forma y de proceso; la decisión sobre qué cambiar corresponde al Comité de Programa.</p>

<section>
<h2>Los tres resultados vigentes</h2>
<p>Transcritos de la lámina «Resultados de Aprendizaje · Programa de Ingeniería Física» de la presentación de 2026:</p>
<ol class="chain">
<li><b>RA1.</b> Aplicar el pensamiento científico y los principios de las ciencias naturales y exactas para analizar y resolver problemas científicos y tecnológicos del entorno, demostrando un dominio sólido en la aplicación de métodos y herramientas de la física y la ingeniería.</li>
<li><b>RA2.</b> Diseñar, ejecutar y evaluar proyectos de investigación y desarrollo tecnológico en las áreas disciplinares de formación que aporten al bienestar de la sociedad, demostrando habilidades avanzadas en la formulación de hipótesis, la selección y aplicación de metodologías apropiadas, la recopilación y análisis de datos, así como la comunicación efectiva de resultados.</li>
<li><b>RA3.</b> Liderar procesos de desarrollo disciplinar e interdisciplinar a través de la participación en actividades de investigación y pasantías en el contexto académico, empresarial o social, contribuyendo al avance científico-tecnológico en sus áreas de especialización y promoviendo el crecimiento profesional individual y en equipos de trabajo.</li>
</ol>
<p>La misma lámina fija cuatro <b>indicadores de evaluación</b>: el desempeño académico de los estudiantes; el número de participaciones en eventos científicos y de trabajos de grado en la modalidad de proyectos de investigación; el número de trabajos de grado en la modalidad de práctica profesional; y el número de estudiantes y proyectos disciplinares e interdisciplinares realizados desde semilleros y grupos de investigación que incluyan estudiantes. Establece una evaluación <b>semestral</b>, el <b>Comité de Programa</b> como responsable y un ciclo de mejoramiento con cuatro pasos: evaluar resultados, analizar logros y brechas, definir e implementar acciones de ajuste y actualizar el PEP.</p>
<div class="box warn"><h4>Una contradicción que los pares pueden notar</h4><p>Una lámina dice que el PEP se actualizó en 2023 con la «inclusión de los resultados de aprendizaje», y la lámina de los resultados cierra con una «acción de ajuste»: «se propone la modificación del PEP para incluir los resultados de aprendizaje del programa, sus indicadores de cumplimiento y la periodicidad de su evaluación». Hay que decidir cuál es verdad y dejarlo escrito: con el acto de aprobación y la fecha, si ya está hecho; o con un plan, si está pendiente.</p></div>
</section>

<section>
<h2>Qué hacen bien</h2>
<ul>
<li><b>Hablan del egresado.</b> Los verbos son aplicar, diseñar, ejecutar, evaluar y liderar: acciones del estudiante, no del programa.</li>
<li><b>Tienen contexto real.</b> Mencionan problemas del entorno, investigación, pasantías, empresa, comunidad, equipos. Eso refleja la identidad del programa (investigación, desarrollo e innovación) y su perfil.</li>
<li><b>Hay ciclo, periodicidad y responsable.</b> Evaluación semestral, Comité de Programa, mejora continua. Es la estructura que pide la característica 23 del Acuerdo CESU 02 de 2020; falta llenarla de datos.</li>
<li><b>Son pocos.</b> Tres resultados se pueden evaluar con seriedad en un primer ciclo.</li>
</ul>
</section>

<section>
<h2>Qué les falta</h2>
<p>El analizador del capítulo 7 da a los tres resultados 88, 75 y 88 puntos de 100 (con los verbos «aplicar», «diseñar» y «liderar», niveles 3, 6 y 3). Es una buena nota de forma. Los puntos que pierden son pocos y muestran el tipo de ajuste que haría falta:</p>
<ul>
<li><b>Ningún resultado fija un criterio de calidad.</b> «Demostrando un dominio sólido» no se puede calibrar. ¿Qué hace un estudiante con dominio sólido que no hace otro con dominio aceptable? Eso lo dirá la rúbrica (capítulo 12).</li>
<li><b>RA2 es largo y compuesto:</b> 51 palabras, tres verbos (diseñar, ejecutar, evaluar) y cuatro habilidades. Cada una de ellas puede ser un indicador, pero como resultado único es difícil de evaluar entero.</li>
<li><b>RA3 depende de dos actividades</b> (investigación y pasantías) y no dice cómo se reconoce el liderazgo. ¿Qué hace un estudiante que lidera? Eso también es trabajo de rúbrica.</li>
</ul>
<p>Pero el problema principal no está en la redacción:</p>
<div class="tablewrap"><table>
<tr><th>Hallazgo</th><th>Por qué importa</th></tr>
<tr><td><b>Los indicadores son conteos.</b> «Número de participaciones en eventos», «número de trabajos de grado en la modalidad…», «número de estudiantes y proyectos…».</td><td>Miden actividad y participación, no cuánto aprendió cada estudiante. Son útiles como evidencia indirecta o de contexto (cuántos participan), pero no dicen si el resultado se logra, ni con qué calidad. El «desempeño académico» sería la nota, que mezcla muchas cosas.</td></tr>
<tr><td><b>RA1 no tiene un indicador propio.</b> Solo «desempeño académico».</td><td>El resultado más amplio, el de las ciencias básicas y de ingeniería (74 + 33 créditos, el 65 % del plan), carece de indicador específico.</td></tr>
<tr><td><b>No hay metas.</b></td><td>Sin una meta (por ejemplo, 70 % en nivel «logrado»), cualquier dato es válido y ninguno señala una brecha.</td></tr>
<tr><td><b>Ningún microcurrículo menciona los resultados.</b> 0 de 49 archivos leídos.</td><td>Sin alineación, la evaluación en las asignaturas no se puede conectar con los resultados. Es la carencia más fácil de señalar para un par y la más fácil de resolver.</td></tr>
<tr><td><b>No hay evidencia del proceso.</b> Las actas están vacías de contenido; no hay informe de análisis de logro.</td><td>La característica 23 pide «acciones de ajuste» basadas en la evaluación. Sin actas ni informes, no se puede demostrar el ciclo.</td></tr>
<tr><td><b>Faltan temas del perfil y de la norma</b> en los resultados: metrología e instrumentación (identidad del programa), ética y responsabilidad profesional, segunda lengua.</td><td>La herramienta del capítulo 6, con los tres resultados cargados, marca como brechas el diseño de ingeniería con restricciones y la ética frente a ABET. No son obligatorios, pero conviene decidirlos a propósito.</td></tr>
</table></div>
<div class="box note"><h4>El plan de mejoramiento ya contiene la solución</h4><p>El plan de mejoramiento 2025-2027 incluye, en el Factor 5, esta acción: «realizar informe de seguimiento semestral al cumplimiento de los microcurrículos que incluya su aporte a los resultados de aprendizaje del programa», a cargo de la coordinación, con un informe por semestre como indicador. Es un buen punto de partida. Lo que falta es hacerla operativa: un formato de microcurrículo con el campo de resultados, una matriz y las fechas de la fila.</p></div>
</section>

<section>
<h2>Del indicador de conteo al indicador de desempeño</h2>
<p>La salida es sencilla: conservar los conteos como evidencia complementaria y agregar, para cada resultado, tres o cuatro <b>indicadores de desempeño</b>, evaluables con una rúbrica sobre trabajos reales. Un borrador de trabajo (ilustrativo) que respeta el texto de los resultados vigentes:</p>
<div class="tablewrap"><table>
<tr><th>Resultado</th><th>Indicadores de desempeño posibles</th><th>Evidencia directa</th></tr>
<tr><td>RA1</td><td>Plantea el modelo físico de un problema abierto e identifica sus hipótesis. Resuelve por vía analítica o numérica y verifica con un caso límite o una estimación. Selecciona y aplica herramientas matemáticas y computacionales apropiadas.</td><td>Problemas abiertos y proyectos de curso en mecánica, electromagnetismo, mecánica cuántica; módulo de razonamiento cuantitativo de Saber Pro como contraste.</td></tr>
<tr><td>RA2</td><td>Formula una pregunta o hipótesis verificable a partir de la literatura. Selecciona y justifica la metodología. Recoge y analiza datos con incertidumbre. Comunica resultados en un informe y una presentación que cumplen criterios.</td><td>Taller de Ingeniería Física, Diseño de Experimentos y trabajo de grado (cualquier modalidad).</td></tr>
<tr><td>RA3</td><td>Asume y cumple un rol de coordinación en un proyecto o pasantía. Integra conocimiento de otra disciplina o de un contexto empresarial o social. Reflexiona sobre su desempeño y su plan de desarrollo profesional.</td><td>Informe de pasantía con concepto del supervisor, valorado con rúbrica; proyectos en equipo; encuesta a egresados y empleadores como evidencia indirecta.</td></tr>
</table></div>
</section>

<section>
<h2>Prioridades, en orden</h2>
<ol class="chain">
<li><b>Dejar en limpio el estado formal.</b> ¿Está el PEP 2023 aprobado con estos resultados? Reunir el acuerdo o resolución y la fecha.</li>
<li><b>Agregar el campo «resultados de aprendizaje de la asignatura y su contribución a los del programa»</b> al formato de microcurrículo (PM-FO-4-FOR-54, según los archivos recibidos) y pedir a los profesores que lo completen. Sin esto no hay alineación.</li>
<li><b>Construir la matriz curricular</b> con la herramienta del capítulo 10, sobre el plan real.</li>
<li><b>Precisar los indicadores de desempeño, las rúbricas y las metas</b> de los tres resultados (capítulos 12 y 13).</li>
<li><b>Hacer un primer ciclo de medición completo</b> con los tres resultados (capítulo 16) y dejar actas con contenido: qué se encontró y qué se decidió.</li>
</ol>
</section>

<section>
<h2>El editor: trabaje con los resultados reales</h2>
<p>El editor se abre con los tres resultados vigentes y sus indicadores actuales. Edítelos, agregue indicadores de desempeño (uno por línea) y compruebe cómo cambia el puntaje y el nivel de Bloom. Los demás capítulos (referentes, matriz, plan de evidencias, tablero) usan esta misma lista. Con el segundo botón puede cargar una <b>propuesta ampliada de nueve resultados</b>, elaborada para este curso (no es del programa), por si el comité quisiera discutir una estructura de más resultados con identidad en medición, diseño, ética y aprendizaje autónomo. Sirve para comparar, no para sustituir sin discusión.</p>
<div class="sim" data-sim="editor-ra" data-title="Editor de los resultados de aprendizaje del programa"></div>
<div class="box note"><h4>¿Tres o nueve?</h4><p>No hay una respuesta única. Tres resultados amplios son fáciles de comunicar y de evaluar, pero obligan a tener muchos indicadores de desempeño por resultado. Nueve resultados acotados son más precisos, pero exigen más rúbricas y más coordinación. Lo importante es que, cualquiera sea la estructura, cada resultado tenga indicadores de desempeño, rúbrica, meta, asignaturas asociadas y evidencia.</p></div>
</section>

<section>
<h2>Para practicar</h2>
<ol class="problems">
<li><span class="lvl">Edición</span> Reescriba RA2 como un resultado de máximo 35 palabras sin perder significado, y envíe el resto de las habilidades a indicadores de desempeño. Compruebe con el analizador.
<details><summary>Una posibilidad</summary><p>«Diseña, ejecuta y evalúa proyectos de investigación y desarrollo tecnológico que aporten al bienestar de la sociedad, con metodología justificada y análisis de datos que comunica con rigor.» Las cuatro habilidades originales (hipótesis, metodología, datos, comunicación) pasan a ser indicadores.</p></details></li>
<li><span class="lvl">Rúbrica</span> Escriba los cuatro niveles del indicador «Asume y cumple un rol de coordinación en un proyecto o pasantía».
<details><summary>Una posibilidad</summary><p>Inicial: no asume un rol definido. En desarrollo: asume un rol pero necesita que se le recuerden las tareas. Logrado: cumple su rol y coordina las tareas de otros con plazos. Sobresaliente: además resuelve conflictos, ajusta el plan y lo documenta.</p></details></li>
<li><span class="lvl">Análisis</span> ¿Por qué el «número de trabajos de grado en la modalidad práctica profesional» no demuestra que se logra el RA3?
<details><summary>Respuesta</summary><p>Porque cuenta cuántos estudiantes eligieron la modalidad, no qué lograron en ella. Un estudiante puede hacer una pasantía sin liderar nada. Necesita una evidencia del desempeño (informe de pasantía con rúbrica y concepto del supervisor); el conteo puede acompañarla.</p></details></li>
</ol>
