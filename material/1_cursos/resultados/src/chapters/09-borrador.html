<template class="chapter-src" data-id="borrador" data-num="9" data-title="Los resultados del programa hoy: diagnóstico y propuesta" data-part="Parte III · Construir los resultados" data-short="Los tres resultados vigentes, qué hacen bien y qué les falta; indicadores de desempeño; prioridades; editor con los resultados reales y una propuesta ampliada">
<p class="lead">En la reunión con los profesores, los pares señalaron los resultados de aprendizaje como el asunto central: dijeron que el programa «no los tiene formulados» y que falta definir cómo se implementan y se evalúan. Sin embargo, el PEP y la presentación del programa traen tres resultados escritos. Este capítulo concilia las dos cosas: qué existe, por qué un par puede decir que no, y qué hay que entregar para responder. Las observaciones son de forma y de proceso; la decisión de qué cambiar corresponde al Comité de Programa.</p>

<section>
<h2>Lo que dijeron los pares y cómo se concilia con lo que hay</h2>
<p>El resumen de la reunión de los pares con los profesores (notas tomadas del audio, no el informe oficial) registra esto sobre los resultados de aprendizaje, Factor 5:</p>
<div class="box fuente"><h4>Observación de los pares</h4><p>«El programa no los tiene formulados; falta definir cómo se implementan y se evalúan. Es un requisito normativo.» Respuesta del programa en la reunión: crear un formato de evaluación y de organización de las competencias. El resumen señala además que fue el único punto que los pares trataron como una carencia normativa, y que quedó de primero en la lista de asuntos urgentes.</p></div>
<p>La frase choca con los documentos, que muestran tres resultados escritos. Una lectura posible, que conviene verificar con quienes estuvieron en la reunión, es que los pares miraron donde un programa muestra normalmente sus resultados, y no los encontraron ahí. Las razones que los datos sugieren son cuatro:</p>
<ol class="chain">
<li><b>No hay un documento aprobado y público que los contenga.</b> Están en un borrador de PEP (sin acto de aprobación a la vista, con texto de la guía y notas pendientes) y en una lámina.</li>
<li><b>Son los objetivos específicos reescritos.</b> Un par puede considerar que eso no es «formular resultados», porque falta el proceso de definición con referentes y grupos de interés.</li>
<li><b>No están implementados.</b> Ninguno de los 49 microcurrículos los menciona; no hay matriz que diga dónde se desarrolla cada uno.</li>
<li><b>No están evaluados.</b> Los indicadores son conteos de participación; no hay rúbricas, metas ni datos de logro, y las actas del comité no tratan el tema.</li>
</ol>
<p>La observación tiene tres partes y cada una pide un entregable distinto. Esta es la correspondencia con lo que ofrece el curso:</p>
<div class="tablewrap"><table>
<tr><th>Lo que piden los pares</th><th>Qué entregar</th><th>Dónde está en el curso</th></tr>
<tr><td><b>Formulados</b></td><td>Resultados aprobados por el Comité de Programa, incluidos en un PEP limpio y aprobado, con la descripción de cómo se definieron.</td><td>Capítulos 7 y 8; este capítulo; editor de abajo</td></tr>
<tr><td><b>Implementados</b></td><td>Matriz curricular; campo de resultados en cada microcurrículo y sílabo; estrategias pedagógicas relacionadas.</td><td>Capítulo 10; herramienta de la matriz</td></tr>
<tr><td><b>Evaluados</b></td><td>El «formato de evaluación» que el programa se comprometió a crear: ficha de cada resultado con indicadores de desempeño, rúbrica, plan de evidencias, meta y responsable.</td><td>Capítulos 11 a 13; apéndice C (plantillas)</td></tr>
<tr><td><b>Mejorados</b></td><td>Un primer ciclo: datos, acta con decisiones y una acción verificable.</td><td>Capítulos 14 y 16</td></tr>
</table></div>
<div class="box warn"><h4>Cuidado con «competencias» y «resultados»</h4><p>En la reunión, el programa respondió que crearía un formato «de organización de las competencias». Las competencias y los resultados de aprendizaje no son lo mismo (capítulo 4): organizar las competencias del perfil no responde por sí solo a la observación. Lo que los pares piden es que cada resultado se pueda ver desarrollado en las asignaturas y evaluado con evidencia. Conviene que el compromiso que el programa asuma por escrito use ese lenguaje.</p></div>
</section>

<section>
<h2>Los tres resultados vigentes</h2>
<p>Transcritos de la sección «Resultados de Aprendizaje» del PEP (en el PEP cada uno comienza con «Los estudiantes serán capaces de…»; la lámina de la presentación a los pares los repite con pequeñas diferencias de redacción):</p>
<ol class="chain">
<li><b>RA1.</b> Aplicar el pensamiento científico y los principios de las ciencias naturales y exactas para analizar y resolver problemas científicos y tecnológicos del entorno, demostrando un dominio sólido en la aplicación de métodos y herramientas científicas propias de la física y la ingeniería.</li>
<li><b>RA2.</b> Diseñar, ejecutar y evaluar proyectos de investigación y desarrollo tecnológico en las áreas disciplinares de formación que aporten al bienestar de la sociedad, demostrando habilidades avanzadas en la formulación de hipótesis, la selección y aplicación de metodologías apropiadas, la recopilación y análisis de datos, así como la comunicación efectiva de los resultados obtenidos.</li>
<li><b>RA3.</b> Liderar procesos de desarrollo disciplinar e interdisciplinar a través de la participación en actividades de investigación y pasantías en el contexto académico o empresarial, contribuyendo al avance científico-tecnológico en sus áreas de especialización y promoviendo el crecimiento profesional tanto a nivel individual como en los diferentes grupos de trabajo.</li>
</ol>
<p>El PEP fija cuatro <b>indicadores de evaluación</b>: el desempeño académico de los estudiantes; el número de participaciones en eventos científicos y de trabajos de grado en la modalidad de proyectos de investigación; el número de trabajos de grado en la modalidad de práctica profesional o pasantía; y el número de estudiantes y proyectos disciplinares e interdisciplinares realizados desde semilleros y grupos de investigación. Establece una evaluación <b>semestral</b>, el <b>Comité de Programa</b> como responsable y un ciclo de mejoramiento con cuatro pasos: evaluar resultados, analizar logros y brechas, definir e implementar acciones de ajuste y actualizar el PEP.</p>
<div class="box warn"><h4>Una contradicción que el propio PEP contiene</h4><p>La sección de resultados del PEP termina con esta frase: «Como acción de ajuste, se propone una modificación del Proyecto Educativo del Programa que incluya estos resultados de aprendizaje, sus indicadores de cumplimiento y la periodicidad de su evaluación». Es decir, el documento que ya contiene los resultados dice que falta incluirlos en el documento. La frase parece heredada del informe de autoevaluación anterior. Hay que quitarla o convertirla en un hecho (la fecha y el acto de aprobación), y revisar el resto del borrador, como se explica abajo.</p></div>
</section>

<section>
<h2>Qué hacen bien</h2>
<ul>
<li><b>Hablan del egresado.</b> Los verbos son aplicar, diseñar, ejecutar, evaluar y liderar: acciones del estudiante, no del programa.</li>
<li><b>Tienen contexto real.</b> Mencionan problemas del entorno, investigación, pasantías, empresa, comunidad, equipos. Eso refleja la identidad del programa (investigación, desarrollo e innovación) y su perfil.</li>
<li><b>Hay ciclo, periodicidad y responsable.</b> Evaluación semestral, Comité de Programa, mejora continua. Es la estructura que pide la característica 23 del Acuerdo CESU 02 de 2020; falta llenarla de datos.</li>
<li><b>Son pocos.</b> Tres resultados se pueden evaluar con seriedad en un primer ciclo.</li>
</ul>
</section>

<section>
<h2>Lo que muestra el PEP sobre cómo se definieron</h2>
<p>Al leer el PEP aparecen cuatro hechos que importan, porque los pares piden «el proceso de definición» de los resultados (la Resolución 21795 de 2020, hoy derogada, lo exigía; el modelo de acreditación pide coherencia con el perfil y los referentes).</p>
<ol class="chain">
<li><b>Los tres resultados son los tres primeros objetivos específicos, reescritos.</b> El objetivo 1 («formación sólida en ciencias naturales y exactas… solución de problemas científicos y tecnológicos del entorno») es RA1; el objetivo 2 («habilidades… en la formulación, realización y evaluación de proyectos de investigación y/o de desarrollo») es RA2; y el objetivo 3 («liderar procesos de desarrollo disciplinar e interdisciplinar, mediante la participación en actividades de investigación y pasantías») pasa casi palabra por palabra a RA3. Es un camino legítimo, pero no es todavía un proceso de definición con referentes y grupos de interés.</li>
<li><b>El cuarto objetivo específico quedó sin resultado.</b> «Formar personas con integridad ética, pertinencia e idoneidad profesional… comprometidas con el bienestar de la sociedad y en armonía con el entorno» no tiene un resultado asociado. Coincide con la brecha de ética que marca la herramienta del capítulo 6 y con la misión institucional, que la menciona expresamente.</li>
<li><b>Las competencias del perfil no están conectadas con los resultados.</b> El PEP lista tres capacidades del egresado (diseñar, proyectar, dirigir, ejecutar y administrar acciones; participar en proyectos tecnológicos e investigativos empresariales; asesorar a empresas en la apropiación de tecnologías), pero no dice qué resultado las evalúa. «Asesorar» y «administrar» no aparecen en ninguno.</li>
<li><b>La sección de mecanismos de evaluación es genérica.</b> Habla de reuniones periódicas, indicadores y criterios generales de autoevaluación del plan de estudios, pero no dice cómo se mide el logro de cada resultado (instrumentos, rúbricas, metas).</li>
</ol>
<div class="box warn"><h4>El archivo es un borrador sobre la guía institucional</h4><p>El documento recibido («PEP CGCAI 2023-01») está construido sobre la «Guía para la elaboración del Proyecto Educativo del Programa» del Centro de Gestión de la Calidad y la Acreditación Institucional. Conserva textos de la guía como si fueran contenido («El programa debe presentar los lineamientos pedagógicos…», «Escribir en este numeral los criterios…», «Se debe hacer referencia a los fundamentos epistemológicos…»), notas pendientes («PEDIR A COORDINADOR…», «Buscar reglamentación: reglamento estudiantil»), la sección «Análisis de la socialización del Proyecto Educativo del Programa» vacía y una portada de 2024. No se ve un acto de aprobación. Antes de entregarlo como el PEP vigente, hay que completarlo, limpiarlo y aprobarlo: un par que lo abra encontrará esas marcas.</p></div>
</section>

<section>
<h2>Qué les falta</h2>
<p>El analizador del capítulo 7 da a los tres resultados 88, 75 y 75 puntos de 100 (con los verbos «aplicar», «diseñar» y «liderar», niveles 3, 6 y 3). Es una buena nota de forma. Los puntos que pierden son pocos y muestran el tipo de ajuste que haría falta:</p>
<ul>
<li><b>Ningún resultado fija un criterio de calidad.</b> «Demostrando un dominio sólido» no se puede calibrar. ¿Qué hace un estudiante con dominio sólido que no hace otro con dominio aceptable? Eso lo dirá la rúbrica (capítulo 12).</li>
<li><b>RA2 es largo y compuesto:</b> 53 palabras, tres verbos (diseñar, ejecutar, evaluar) y cuatro habilidades. Cada una de ellas puede ser un indicador, pero como resultado único es difícil de evaluar entero. RA3 tiene 49 palabras.</li>
<li><b>RA3 depende de dos actividades</b> (investigación y pasantías) y no dice cómo se reconoce el liderazgo. ¿Qué hace un estudiante que lidera? Eso también es trabajo de rúbrica.</li>
</ul>
<p>Pero el problema principal no está en la redacción:</p>
<div class="tablewrap"><table>
<tr><th>Hallazgo</th><th>Por qué importa</th></tr>
<tr><td><b>Los indicadores son conteos.</b> «Número de participaciones en eventos», «número de trabajos de grado en la modalidad…», «número de estudiantes y proyectos…».</td><td>Miden actividad y participación, no cuánto aprendió cada estudiante. Son útiles como evidencia indirecta o de contexto (cuántos participan), pero no dicen si el resultado se logra, ni con qué calidad. El «desempeño académico» sería la nota, que mezcla muchas cosas.</td></tr>
<tr><td><b>RA1 no tiene un indicador propio.</b> Solo «desempeño académico».</td><td>El resultado más amplio, el de las ciencias básicas y de ingeniería (74 + 33 créditos, el 65 % del plan), carece de indicador específico.</td></tr>
<tr><td><b>No hay metas.</b></td><td>Sin una meta (por ejemplo, 70 % en nivel «logrado»), cualquier dato es válido y ninguno señala una brecha.</td></tr>
<tr><td><b>Ningún microcurrículo menciona los resultados.</b> 0 de 49 archivos leídos.</td><td>Sin alineación, la evaluación en las asignaturas no se puede conectar con los resultados. Es la carencia más fácil de señalar para un par y la más fácil de resolver.</td></tr>
<tr><td><b>No hay evidencia del proceso.</b> Las actas están vacías de contenido; no hay informe de análisis de logro.</td><td>La característica 23 pide «acciones de ajuste» basadas en la evaluación. Sin actas ni informes, no se puede demostrar el ciclo.</td></tr>
<tr><td><b>Faltan temas del perfil y de la norma</b> en los resultados: ética y responsabilidad profesional (el objetivo 4 del PEP), metrología e instrumentación (identidad del programa y línea de énfasis), y segunda lengua (el PEP exige cuatro niveles de idioma y espera B1 en inglés).</td><td>La herramienta del capítulo 6, con los tres resultados cargados, marca como brechas el diseño de ingeniería con restricciones y la ética frente a ABET. No son obligatorios, pero conviene decidirlos a propósito.</td></tr>
</table></div>
<div class="box note"><h4>El plan de mejoramiento ya contiene la solución</h4><p>El plan de mejoramiento 2025-2027 incluye, en el Factor 5, esta acción: «realizar informe de seguimiento semestral al cumplimiento de los microcurrículos que incluya su aporte a los resultados de aprendizaje del programa», a cargo de la coordinación, con un informe por semestre como indicador. Es un buen punto de partida. Lo que falta es hacerla operativa: un formato de microcurrículo con el campo de resultados, una matriz y las fechas de la fila.</p></div>
</section>

<section>
<h2>Del indicador de conteo al indicador de desempeño</h2>
<p>La salida es sencilla: conservar los conteos como evidencia complementaria y agregar, para cada resultado, tres o cuatro <b>indicadores de desempeño</b>, evaluables con una rúbrica sobre trabajos reales. Un borrador de trabajo (ilustrativo) que respeta el texto de los resultados vigentes:</p>
<div class="tablewrap"><table>
<tr><th>Resultado</th><th>Indicadores de desempeño posibles</th><th>Evidencia directa</th></tr>
<tr><td>RA1</td><td>Plantea el modelo físico de un problema abierto e identifica sus hipótesis. Resuelve por vía analítica o numérica y verifica con un caso límite o una estimación. Selecciona y aplica herramientas matemáticas y computacionales apropiadas.</td><td>Problemas abiertos y proyectos de curso en mecánica, electromagnetismo, mecánica cuántica; módulo de razonamiento cuantitativo de Saber Pro como contraste.</td></tr>
<tr><td>RA2</td><td>Formula una pregunta o hipótesis verificable a partir de la literatura. Selecciona y justifica la metodología. Recoge y analiza datos con incertidumbre. Comunica resultados en un informe y una presentación que cumplen criterios.</td><td>Taller de Ingeniería Física, Diseño de Experimentos y trabajo de grado (cualquier modalidad).</td></tr>
<tr><td>RA3</td><td>Asume y cumple un rol de coordinación en un proyecto o pasantía. Integra conocimiento de otra disciplina o de un contexto empresarial o social. Reflexiona sobre su desempeño y su plan de desarrollo profesional.</td><td>Informe de pasantía con concepto del supervisor, valorado con rúbrica; proyectos en equipo; encuesta a egresados y empleadores como evidencia indirecta.</td></tr>
</table></div>
</section>

<section>
<h2>Prioridades, en orden</h2>
<ol class="chain">
<li><b>Dejar en limpio el PEP.</b> Quitar el texto de la guía, resolver las notas pendientes, eliminar la frase «se propone una modificación del PEP», completar el análisis de socialización y aprobarlo, con acto y fecha. Es lo más rápido y el que más se nota.</li>
<li><b>Decidir qué pasa con el objetivo 4 y con las competencias del perfil.</b> O se agregan resultados (ética y responsabilidad profesional; asesoría y gestión de tecnología), o se explica en el PEP cómo se cubren con otros mecanismos.</li>
<li><b>Agregar el campo «resultados de aprendizaje de la asignatura y su contribución a los del programa»</b> al formato de microcurrículo (PM-FO-4-FOR-54, según los archivos recibidos) y pedir a los profesores que lo completen. Sin esto no hay alineación.</li>
<li><b>Construir la matriz curricular</b> con la herramienta del capítulo 10, sobre el plan real.</li>
<li><b>Precisar los indicadores de desempeño, las rúbricas y las metas</b> de los tres resultados (capítulos 12 y 13).</li>
<li><b>Hacer un primer ciclo de medición completo</b> con los tres resultados (capítulo 16) y dejar actas con contenido: qué se encontró y qué se decidió.</li>
</ol>
</section>

<section>
<h2>El editor: trabaje con los resultados reales</h2>
<p>El editor se abre con los tres resultados vigentes y sus indicadores actuales. Edítelos, agregue indicadores de desempeño (uno por línea) y compruebe cómo cambia el puntaje y el nivel de Bloom. Los demás capítulos (referentes, matriz, plan de evidencias, tablero) usan esta misma lista. Con el segundo botón puede cargar una <b>propuesta ampliada de nueve resultados</b>, elaborada para este curso (no es del programa), por si el comité quisiera discutir una estructura de más resultados con identidad en medición, diseño, ética y aprendizaje autónomo. Sirve para comparar, no para sustituir sin discusión.</p>
<div class="sim" data-sim="editor-ra" data-title="Editor de los resultados de aprendizaje del programa"></div>
<div class="box note"><h4>¿Tres o nueve?</h4><p>No hay una respuesta única. Tres resultados amplios son fáciles de comunicar y de evaluar, pero obligan a tener muchos indicadores de desempeño por resultado. Nueve resultados acotados son más precisos, pero exigen más rúbricas y más coordinación. Lo importante es que, cualquiera sea la estructura, cada resultado tenga indicadores de desempeño, rúbrica, meta, asignaturas asociadas y evidencia.</p></div>
</section>

<section>
<h2>Para practicar</h2>
<ol class="problems">
<li><span class="lvl">Edición</span> Reescriba RA2 como un resultado de máximo 35 palabras sin perder significado, y envíe el resto de las habilidades a indicadores de desempeño. Compruebe con el analizador.
<details><summary>Una posibilidad</summary><p>«Diseña, ejecuta y evalúa proyectos de investigación y desarrollo tecnológico que aporten al bienestar de la sociedad, con metodología justificada y análisis de datos que comunica con rigor.» Las cuatro habilidades originales (hipótesis, metodología, datos, comunicación) pasan a ser indicadores.</p></details></li>
<li><span class="lvl">Rúbrica</span> Escriba los cuatro niveles del indicador «Asume y cumple un rol de coordinación en un proyecto o pasantía».
<details><summary>Una posibilidad</summary><p>Inicial: no asume un rol definido. En desarrollo: asume un rol pero necesita que se le recuerden las tareas. Logrado: cumple su rol y coordina las tareas de otros con plazos. Sobresaliente: además resuelve conflictos, ajusta el plan y lo documenta.</p></details></li>
<li><span class="lvl">Análisis</span> ¿Por qué el «número de trabajos de grado en la modalidad práctica profesional» no demuestra que se logra el RA3?
<details><summary>Respuesta</summary><p>Porque cuenta cuántos estudiantes eligieron la modalidad, no qué lograron en ella. Un estudiante puede hacer una pasantía sin liderar nada. Necesita una evidencia del desempeño (informe de pasantía con rúbrica y concepto del supervisor); el conteo puede acompañarla.</p></details></li>
</ol>
</section>
