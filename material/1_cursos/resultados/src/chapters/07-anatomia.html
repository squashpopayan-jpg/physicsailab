<p class="lead">Un resultado de aprendizaje bien redactado cabe en una o dos líneas y permite imaginar, sin esfuerzo, el trabajo de un estudiante que lo demuestre. Uno mal redactado suena bien y no permite imaginar nada. La diferencia no es literaria: es de estructura. Este capítulo enseña la estructura, la taxonomía que la sostiene y los errores que más se repiten, y termina con una herramienta que revisa la forma de cualquier texto que se le pegue.</p>

<section>
<h2>La estructura: cuatro piezas</h2>
<div class="box law"><h4>Fórmula de redacción</h4><p><b>Verbo observable</b> + <b>objeto</b> (qué conocimiento o producto) + <b>contexto</b> (dónde, con qué) + <b>criterio</b> (qué tan bien).</p></div>
<div class="tablewrap"><table>
<tr><th>Pieza</th><th>Pregunta</th><th>Ejemplo</th></tr>
<tr><td>Verbo</td><td>¿Qué hace el estudiante?</td><td>Diseña y valida…</td></tr>
<tr><td>Objeto</td><td>¿Qué produce o sobre qué trabaja?</td><td>…un sistema de medición de una magnitud física…</td></tr>
<tr><td>Contexto</td><td>¿En qué situación?</td><td>…en un proceso o entorno de ingeniería real…</td></tr>
<tr><td>Criterio</td><td>¿Con qué calidad?</td><td>…estimando su incertidumbre y justificando la selección de sensores según normas técnicas.</td></tr>
</table></div>
<p>La Resolución 21795 de 2020 (hoy derogada, pero útil como guía) pedía que los resultados fueran «claros, concretos y verificables», que describieran «lo que el estudiante sabrá, comprenderá y será capaz de hacer», y que se centraran en «lo que el estudiante aprenderá y lo que puede llegar a demostrar que aprendió». La fórmula de cuatro piezas es una manera práctica de cumplirlo.</p>
</section>

<section>
<h2>La taxonomía: por qué importa el verbo</h2>
<p>El verbo no es un adorno: determina el nivel de exigencia. La taxonomía de Bloom revisada por Anderson y Krathwohl (2001) distingue seis niveles de proceso cognitivo, de menor a mayor complejidad: recordar, comprender, aplicar, analizar, evaluar y crear. Otras taxonomías sirven igual (la SOLO de Biggs y Collis, la de aprendizaje significativo de Fink). Lo que la norma pide, en el literal 8 del artículo 12 de la Resolución 21795, es <b>declarar cuál se usa y por qué</b>.</p>
<p>Un resultado de egreso de ingeniería debería estar, como regla práctica, en el nivel de aplicar o superior; los de los primeros cursos pueden estar en recordar y comprender, porque son escalones. Explore los niveles y sus verbos:</p>
<div class="sim" data-sim="bloom" data-title="Niveles de Bloom y verbos en Ingeniería Física"></div>
<div class="box note"><h4>Saber, saber hacer, ser</h4><p>La Resolución 21795 recordaba que toda competencia tiene tres componentes: el saber, el hacer y el ser. Los resultados de aprendizaje pueden cubrir los tres, pero los del «ser» (ética, trabajo en equipo, responsabilidad) se redactan de modo distinto: no se evalúa «ser ético», se evalúa que el estudiante <i>identifique, juzgue y actúe</i> ante un dilema, y eso sí es observable.</p></div>
</section>

<section>
<h2>Los errores más comunes</h2>
<ul>
<li><b>Verbos no verificables.</b> «Conocer», «saber», «entender», «apreciar», «dominar», «familiarizarse». Si no puede decir cómo se vería en un trabajo, cámbielo. «Comprender» está en Bloom, pero como resultado final es débil: pregunte «¿cómo lo demuestra?».</li>
<li><b>Centrados en el docente o el programa.</b> «El programa ofrece formación en…», «se pretende enseñar…», «brindar al estudiante…». Es un objetivo, no un resultado.</li>
<li><b>Demasiado generales.</b> «Resuelve problemas.» Sin objeto, contexto ni criterio, no se puede evaluar ni diferenciar de ningún otro programa.</li>
<li><b>Demasiado específicos.</b> «Calcula el momento de inercia de un cilindro.» Es un tema o un ejercicio, no un resultado de programa; sirve como indicador o resultado de asignatura.</li>
<li><b>Resultados compuestos.</b> Cinco acciones en una frase hacen imposible evaluarlas juntas: ¿qué pasa con quien logra tres? Máximo dos o tres verbos relacionados.</li>
<li><b>Sin criterio de calidad.</b> «Diseña un circuito» incluye a quien lo hace mal. «…que cumple requisitos de exactitud y seguridad» fija el estándar.</li>
<li><b>Nivel demasiado bajo para el egreso.</b> «Enumera las leyes de Newton» sirve en primer semestre, no al egresar.</li>
</ul>
</section>

<section>
<h2>El analizador de redacción</h2>
<p>La herramienta revisa ocho señales de forma. Pruebe primero los cinco ejemplos que trae (dos bien formulados, tres deficientes), luego pegue los suyos o use el constructor guiado. Su puntaje no mide si el resultado es pertinente, solo si está bien construido.</p>
<div class="sim" data-sim="analizador-ra" data-title="Analizador de resultados de aprendizaje"></div>
<div class="box warn"><h4>Qué no hace el analizador</h4><p>Reconoce verbos de una lista y busca señales en el texto: un resultado puede obtener buen puntaje y ser irrelevante, o ser excelente y puntuar mal por usar un verbo que no está en el diccionario. Úselo como segunda opinión, no como juez.</p></div>
</section>

<section>
<h2>Para practicar</h2>
<ol class="problems">
<li><span class="lvl">Reescritura</span> «Conocer las propiedades ópticas de los materiales.» Hágalo verificable y compruébelo con el analizador.
<details><summary>Una posible versión</summary><p>«Caracteriza las propiedades ópticas de un material (índice de refracción, transmitancia, absorción) con técnicas espectroscópicas y justifica su idoneidad para una aplicación dada, estimando la incertidumbre de las mediciones.»</p></details></li>
<li><span class="lvl">Diagnóstico</span> «El estudiante desarrollará habilidades de laboratorio, aprenderá a trabajar en equipo, conocerá la normativa y entenderá la ética profesional.» Señale los problemas.
<details><summary>Respuesta</summary><p>Cuatro acciones en una sola frase (compuesto); verbos no verificables (desarrollará habilidades, aprenderá, conocerá, entenderá); sin objeto, contexto ni criterio. Debe dividirse en resultados separados, cada uno con verbo observable.</p></details></li>
<li><span class="lvl">Nivel</span> ¿En qué nivel de Bloom está «Diseña un sensor de temperatura para un horno con requisitos de exactitud y costo»? ¿Y «Explica por qué el ruido térmico limita la sensibilidad de un detector»?
<details><summary>Respuesta</summary><p>El primero, crear (nivel 6). El segundo, comprender (nivel 2); si se pidiera además «estimar el límite de detección de un sensor dado», pasaría a aplicar o analizar.</p></details></li>
</ol>
