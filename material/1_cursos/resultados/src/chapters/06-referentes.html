<p class="lead">El Acuerdo CESU 02 de 2020 dice que los resultados de aprendizaje se establecen teniendo en cuenta, entre otras cosas, «los estándares internacionales». Ningún estándar internacional dice qué debe aprender un ingeniero físico de Popayán, pero todos ofrecen listas ya depuradas de lo que se espera de un ingeniero. Usarlas bien consiste en <b>contrastar</b>, no en copiar: ver qué cubre el programa, qué no, y decidir por qué.</p>

<section>
<h2>Contrastar los resultados del programa con los marcos</h2>
<p>La herramienta cruza los resultados que tenga cargados (al principio, los tres vigentes del programa; la propuesta ampliada de nueve del capítulo 9 es opcional) con cada marco. Cada celda se puede activar o desactivar: la correspondencia inicial es una lectura de este curso y usted puede cambiarla. Lo importante es la columna «Cubierto»: un elemento sin ningún resultado asociado es una brecha que el programa debe decidir si asume.</p>

<section>
<h2>Cómo usar los marcos sin perder la identidad</h2>
<ol class="chain">
<li><b>Empiece por el perfil propio.</b> Los resultados deben salir de lo que el programa quiere ser (capítulo 5). Los marcos se usan para contrastar, después.</li>
<li><b>Busque brechas, no equivalencias.</b> Si un elemento de ABET no tiene resultado asociado, pregunte: ¿lo cubre el programa de otra manera? ¿Es relevante para nuestros egresados? ¿Lo omitimos a propósito?</li>
<li><b>Agregue lo que los marcos no ven.</b> Ninguna lista internacional menciona instrumentación y control, materiales y óptica, ni la metrología como identidad del programa. Esos resultados propios son los que diferencian al ingeniero físico de Unicauca.</li>
<li><b>Verifique el nivel.</b> Compare la exigencia de sus resultados con los descriptores de Dublín y con los del nivel correspondiente del Marco Nacional de Cualificaciones (Decreto 1649 de 2021, anexo de descriptores).</li>
<li><b>Deje constancia.</b> El Decreto 1330 y la Resolución 21795 pedían describir «el proceso de definición y análisis de los resultados de aprendizaje» y los «referentes conceptuales». Una tabla como la de arriba es esa descripción.</li>
</ol>
</section>

<section>
<h2>Saber Pro: qué puede y qué no puede decir</h2>
<p>El examen Saber Pro tiene módulos de competencias genéricas (lectura crítica, razonamiento cuantitativo, comunicación escrita, inglés, competencias ciudadanas) y módulos específicos que dependen del área; según el Icfes, las instituciones pueden decidir cuáles presentan sus estudiantes. Como evidencia de resultados de aprendizaje, es útil porque es externa y comparable, pero tiene límites:</p>
<ul>
<li>Mide competencias genéricas más que los resultados específicos de Ingeniería Física.</li>
<li>No distingue el aporte del programa del de la formación previa del estudiante.</li>
<li>Los resultados se reportan por módulo, no por resultado de aprendizaje: hay que construir el puente.</li>
</ul>
<p>La práctica sensata es usar Saber Pro como una evidencia indirecta o complementaria de resultados genéricos (comunicación, razonamiento cuantitativo, inglés) y confiar en evidencias propias para los específicos.</p>
</section>

<section>
<h2>Para practicar</h2>
<ol class="problems">
<li><span class="lvl">Brechas</span> Con los tres resultados vigentes cargados, seleccione ABET. ¿Qué elementos quedan sin ningún resultado? ¿Qué decisión implica?
<details><summary>Respuesta</summary><p>Quedan sin cubrir el diseño de ingeniería con consideración de seguridad y factores ambientales, económicos y sociales (elemento 2) y las responsabilidades éticas y profesionales (elemento 4). RA2 habla de diseñar proyectos de investigación y desarrollo, pero no de diseño con restricciones. El comité debe decidir si es una brecha real, si se cubre por otro lado (por ejemplo, en el Taller de Ingeniería Física y en Ciencia, Tecnología y Sociedad) o si se asume a propósito.</p></details></li>
<li><span class="lvl">Criterio</span> Un colega propone adoptar tal cual los siete resultados de ABET como resultados del programa «para ahorrar trabajo». Dé dos argumentos a favor y dos en contra.
<details><summary>Respuesta</summary><p>A favor: son una lista reconocida y facilitan una eventual acreditación internacional; ahorran discusión. En contra: no reflejan la identidad del programa (instrumentación, materiales, óptica, metrología) y adoptar una lista ajena sin análisis incumple la exigencia de describir el proceso de definición con los referentes del contexto. Lo recomendable es contrastar, no copiar.</p></details></li>
</ol>
