<section>
<h2>Referentes mencionados sin lectura completa</h2>
<ul>
<li><b>Decreto 1649 de 2021</b> (Marco Nacional de Cualificaciones): se confirmó su existencia, que adopta ocho niveles y que adiciona la Parte 7 al Libro 2 del Decreto 1075 de 2015, pero no se leyó el anexo de descriptores.</li>
<li><b>Ley 30 de 1992, Ley 1188 de 2008, Ley 1581 de 2012 y Decreto 1075 de 2015:</b> citadas por su objeto general conocido; no se transcribió su texto.</li>
<li><b>ABET (criterio 3), Acuerdo de Washington (atributos de 2013), descriptores de Dublín, CDIO, taxonomía de Bloom revisada (Anderson y Krathwohl, 2001), alineación constructiva (Biggs), κ de Cohen y escala de Landis y Koch (1977):</b> referencias de la literatura académica conocida, no consultadas en línea durante la preparación.</li>
</ul>
</section>

<section>
<h2>Lo que no se pudo verificar y debe confirmar</h2>
<div class="box warn"><h4>Antes de usar este curso en un documento oficial</h4>
<ul>
<li><b>Guías y lineamientos del CNA</b> publicados tras el Acuerdo 01 de 2025 (el art. 67 ordenó publicarlos en seis meses). No se encontraron en las búsquedas; revise el sitio del CNA.</li>
<li><b>Política institucional de resultados de aprendizaje de la Universidad del Cauca</b> y los acuerdos académicos que regulan quién aprueba los resultados y los cambios curriculares.</li>
<li><b>Registro calificado vigente</b>: la presentación cita una renovación en 2025-2026 con la «Res. 23384», pero el número aparece cortado. La acreditación (Resolución MEN 8333 de 2019) sí figura en la presentación; confírmela con la resolución misma.</li>
<li><b>Informe de los pares</b> y sus observaciones sobre resultados de aprendizaje: no estaban en la carpeta.</li>
<li><b>PEP actualizado en 2023</b> y su acto de aprobación: se mencionan en la presentación, pero el documento no estaba en la carpeta.</li>
<li><b>Acuerdo Académico 010 de 2015</b> (anexo 4 de la carpeta): el PDF es una imagen sin texto y no se leyó.</li>
<li><b>Cuatro microcurrículos en formato .doc antiguo</b> no se pudieron leer; los otros 49 sí.</li>
<li><b>Interpretación de la transición</b> entre los Acuerdos CESU 02 de 2020 y 01 de 2025 para su trámite: confírmela por escrito con el CNA o la Oficina de Autoevaluación.</li>
<li><b>Decretos posteriores</b> sobre registro calificado (se encontraron referencias a los Decretos 1427 de 2025 y 0704 de 2026 que modifican el trámite de pre-radicación); no se leyeron.</li>
<li><b>Documento de ACOFI</b> sobre resultados de aprendizaje de ingeniería: no se pudo abrir.</li>
<li><b>Plan de estudios:</b> cursos, semestres y créditos salen de la tabla del informe de autoevaluación (reforma aplicada desde 2017); confírmelos con la malla vigente en el sistema académico.</li>
</ul></div>
</section>
