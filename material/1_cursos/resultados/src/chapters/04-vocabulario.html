<p class="lead">La mayoría de los documentos confusos sobre resultados de aprendizaje lo son porque mezclan palabras que pertenecen a pisos distintos de una misma escalera. Si se separan, el trabajo se vuelve ordenado: cada piso responde una pregunta diferente, tiene un dueño distinto y produce un documento distinto.</p>

<section>
<h2>Los siete pisos</h2>
<div class="tablewrap"><table>
<tr><th>Piso</th><th>Pregunta que responde</th><th>Ejemplo en Ingeniería Física</th><th>Quién lo escribe</th></tr>
<tr><td><b>1. Propósito u objetivo del programa</b></td><td>¿Para qué existe el programa?</td><td>«Formar profesionales idóneos y con integridad ética que desarrollen y apliquen conocimientos científicos en el campo de la Ingeniería Física.»</td><td>El programa, con la Facultad.</td></tr>
<tr><td><b>2. Perfil de egreso</b></td><td>¿Cómo es el egresado, en términos generales?</td><td>«Profesional con formación en procesos de investigación y desarrollo orientados a la solución de problemas de la industria, la investigación y la academia.»</td><td>El programa.</td></tr>
<tr><td><b>3. Competencia</b></td><td>¿Qué capacidad integrada y duradera tiene la persona?</td><td>Capacidad de plantear y resolver problemas de ingeniería movilizando conocimientos, habilidades y actitudes.</td><td>El programa, con referentes externos.</td></tr>
<tr><td><b>4. Resultado de aprendizaje del programa</b></td><td>¿Qué demuestra el estudiante al egresar?</td><td>«Diseña, ejecuta y analiza experimentos y mediciones, estimando incertidumbres con criterios metrológicos…»</td><td>El programa (comité curricular).</td></tr>
<tr><td><b>5. Resultado de aprendizaje de la asignatura</b></td><td>¿Qué demuestra el estudiante al terminar este curso?</td><td>«Calibra un sensor de temperatura con patrones trazables y reporta la incertidumbre de la calibración.»</td><td>El profesor, en el sílabo.</td></tr>
<tr><td><b>6. Indicador de desempeño</b></td><td>¿Qué conducta concreta se observa?</td><td>«Calcula la incertidumbre combinada incluyendo al menos tres fuentes.»</td><td>El profesor o el comité, junto con la rúbrica.</td></tr>
<tr><td><b>7. Evidencia</b></td><td>¿Qué producto del estudiante lo muestra?</td><td>Informe del laboratorio 4 con la hoja de cálculo de incertidumbres, valorado con la rúbrica.</td><td>El estudiante la produce; el programa la guarda.</td></tr>
</table></div>
<p>Entre los pisos 6 y 7 se inserta un elemento que los une: el <b>nivel de desempeño</b>, la descripción de cuán bien se hace cada indicador (inicial, en desarrollo, logrado, sobresaliente). Es lo que permite pasar de «hizo o no hizo» a «con qué calidad lo hizo» y lo que alimenta el análisis de logro.</p>
<div class="box def"><h4>Competencia (Acuerdo CESU 02 de 2020, numeral 2.2, lit. b)</h4><p>Conjunto articulado de conocimientos, capacidades, habilidades, disposiciones, actitudes y aptitudes que permite comprender y analizar problemas o situaciones y actuar de manera coherente y eficaz, individual o colectivamente. Es «susceptible de ser evaluada mediante resultados de aprendizaje» y le pertenece al individuo, que la sigue desarrollando.</p></div>
<p>La relación de fondo es esta: <b>la competencia es la capacidad; el resultado de aprendizaje es la manera de comprobarla</b>. Por eso el Acuerdo 02 de 2020 pide, en su característica 24, coherencia entre competencias y resultados, y por eso un buen programa no tiene que escoger entre hablar de competencias o de resultados.</p>
</section>

<h2>Clasifique usted mismo</h2>
<p>La herramienta presenta nueve enunciados reales o plausibles de un programa de Ingeniería Física. Cada uno pertenece a un piso distinto. Después de cada respuesta explica por qué.</p>
<div class="sim" data-sim="escalera" data-title="¿En qué piso está este enunciado?"></div>
</section>

<section>
<h2>Cuatro reglas de buena vecindad</h2>
<ol class="chain">
<li><b>Un resultado de programa se desarrolla en varias asignaturas.</b> Si coincide palabra por palabra con el resultado de una sola asignatura, es de asignatura, no de programa.</li>
<li><b>Un resultado de asignatura contribuye a uno o más del programa.</b> Debe poder decirse cuáles. Esa es la matriz curricular del capítulo 10.</li>
<li><b>Un indicador sin criterio es un deseo.</b> «Resuelve problemas» no es un indicador. «Resuelve el problema por vía analítica y verifica con un caso límite» sí.</li>
<li><b>Una evidencia que no se guarda no existe.</b> Para un par, el trabajo que no puede ver es un trabajo que no se hizo.</li>
</ol>
</section>

<section>
<h2>Para practicar</h2>
<ol class="problems">
<li><span class="lvl">Clasificación</span> ¿A qué piso pertenece «Ser un ingeniero comprometido con el desarrollo de la región»? ¿Se puede evaluar?
<details><summary>Respuesta</summary><p>Es un propósito (piso 1) o un rasgo del perfil (piso 2). No es un resultado de aprendizaje porque no dice qué demuestra el estudiante. Si el programa quiere evaluarlo, debe traducirlo: por ejemplo, «formula una solución tecnológica a un problema de la región, identificando a los actores afectados y evaluando su viabilidad».</p></details></li>
<li><span class="lvl">Reescritura</span> «Conocer los principios de la óptica geométrica y ondulatoria» aparece como resultado de asignatura. Conviértalo en un resultado verificable.
<details><summary>Respuesta</summary><p>Una posibilidad: «Aplica los principios de la óptica geométrica y ondulatoria para predecir y medir el comportamiento de un sistema óptico simple, y compara la predicción con la medición». Verifique su propia versión con el analizador del capítulo 7.</p></details></li>
</ol>
