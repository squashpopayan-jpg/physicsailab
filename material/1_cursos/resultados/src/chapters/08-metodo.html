<p class="lead">Los resultados de aprendizaje no se inventan en una tarde ni los redacta una sola persona. El Decreto 1330 y los Acuerdos CESU piden que se establezcan «teniendo en cuenta las tendencias de las disciplinas, el perfil de formación, la naturaleza, nivel y modalidad del programa y los estándares internacionales». Un método ordenado produce resultados mejor fundados y, de paso, deja el expediente que los pares pedirán: el proceso de definición.</p>

<section>
<h2>Los ocho pasos</h2>
<ol class="chain">
<li><b>Reunir los referentes.</b> Perfil de egreso y propósitos del programa, lo que dice la norma (capítulo 3), la política institucional, los marcos del capítulo 6 y el estado del arte de la disciplina.</li>
<li><b>Consultar a los grupos de interés.</b> Egresados, empleadores, profesores, estudiantes y, cuando aplique, institutos de investigación y entidades de normalización o metrología. Técnicas: encuesta breve, grupos focales, entrevistas, un panel de expertos.</li>
<li><b>Generar candidatos.</b> Una lista larga de cosas que un egresado debería poder demostrar. Aquí cabe todo; todavía no se redacta.</li>
<li><b>Priorizar.</b> Para cada candidato: ¿qué tan importante es y qué tan bien preparados salen hoy los egresados? La brecha entre ambas dice dónde apostar. La herramienta de abajo la calcula.</li>
<li><b>Redactar</b> con la fórmula del capítulo 7 y verificar la forma con el analizador.</li>
<li><b>Contrastar con los marcos y con el nivel.</b> ABET, Washington, Dublín, Marco Nacional de Cualificaciones. Decidir qué brechas se asumen.</li>
<li><b>Validar.</b> Con la «prueba del trabajo»: para cada resultado, describir el trabajo de un estudiante que lo demuestre. Si no se puede, el resultado no está listo. Luego revisión por profesores externos al comité y por un par de egresados.</li>
<li><b>Aprobar, publicar y divulgar</b> por las instancias que correspondan (comité curricular, consejo de facultad, según la normativa de la Universidad) y dejar acta. Divulgar de verdad: sílabos, inducción, página del programa.</li>
</ol>
<div class="box note"><h4>Quién aprueba qué</h4><p>El Decreto 1330 exige que el programa se rija por las políticas institucionales de resultados de aprendizaje (art. 2.5.3.2.3.1.3, lit. b). Las instancias que aprueban los resultados y las modificaciones curriculares dependen del reglamento de la Universidad del Cauca, que este curso no pudo consultar completo. Confírmelo con la Vicerrectoría Académica o con la coordinación del programa antes de iniciar el paso 8.</p></div>
</section>

<section>
<h2>Cuántos resultados y de qué tamaño</h2>
<p>No hay una cifra obligatoria. La práctica en programas de ingeniería es de <b>seis a diez</b>. Menos de seis casi nunca cubre un perfil profesional; más de diez se vuelve imposible de evaluar sistemáticamente con rúbricas y muestras. Dos pruebas ayudan:</p>
<ul>
<li><b>Prueba del tamaño.</b> Un resultado se desarrolla en varias asignaturas y varios semestres. Si cabe en una sola asignatura, es de asignatura.</li>
<li><b>Prueba de la evidencia.</b> Debe haber un tipo de trabajo del estudiante, o dos o tres, que permita juzgarlo. Si hace falta un examen de todo, es demasiado grande.</li>
</ul>
</section>

<section>
<h2>Priorizar con datos: importancia frente a preparación</h2>
<p>La herramienta recibe, por cada competencia candidata, la importancia que le asigna cada grupo de interés (1 a 5) y la preparación que muestran los egresados hoy. Los valores iniciales son <b>ficticios</b>: reemplácelos con los resultados de sus consultas. Los puntos en la zona sombreada son importantes y están poco logrados; son las primeras apuestas.</p>
<div class="sim" data-sim="priorizacion" data-title="Importancia frente a preparación percibida"></div>
<p>Interprete con cuidado. Una brecha grande en un candidato no implica que haya que crear un curso: puede ser un problema de enfoque, de evaluación o de la propia percepción. Y un candidato con baja importancia para los empleadores puede ser vital para el programa por su identidad (por ejemplo, la metrología), de modo que la priorización informa la decisión, no la reemplaza.</p>
</section>

<section>
<h2>Documentar el proceso: el expediente de definición</h2>
<p>La Resolución 21795 pedía «la descripción del proceso de definición y análisis de los resultados de aprendizaje del programa, mencionando los referentes conceptuales». Aunque ya no esté vigente, es exactamente lo que un par querrá ver. Un expediente completo contiene:</p>
<ol class="chain">
<li>Cronograma y responsables del proceso.</li>
<li>Referentes consultados (con la tabla de contraste del capítulo 6).</li>
<li>Evidencia de la participación de grupos de interés: listas de asistencia, instrumentos, resultados.</li>
<li>La tabla de priorización y las decisiones que se tomaron con ella.</li>
<li>Versiones sucesivas de los resultados y las razones de cada cambio.</li>
<li>Actas de validación y aprobación.</li>
<li>Plan de divulgación y sus evidencias.</li>
</ol>
</section>

<section>
<h2>Para practicar</h2>
<ol class="problems">
<li><span class="lvl">Análisis</span> En la herramienta, ponga la preparación de «Diseño en ingeniería» en 5. ¿Qué cambia en el gráfico y en el texto de la derecha?
<details><summary>Respuesta</summary><p>El punto se mueve a la zona de bajo riesgo y deja de figurar entre las prioridades: la brecha desaparece. Observe cuánto depende la priorización de una sola percepción; por eso conviene triangular con evidencia directa, no solo opiniones.</p></details></li>
<li><span class="lvl">Diseño</span> Diseñe una consulta de treinta minutos con cinco empleadores del suroccidente colombiano para el paso 2. ¿Qué preguntas haría?
<details><summary>Una posibilidad</summary><p>(1) ¿Qué problemas técnicos resuelve hoy un ingeniero físico en su organización? (2) ¿Qué sabe hacer bien el egresado y qué le falta? (3) ¿Qué evidencia les pediría para contratar a alguien? (4) ¿Qué habilidades no técnicas pesan más en su decisión? Registre ejemplos concretos, no opiniones generales.</p></details></li>
</ol>
