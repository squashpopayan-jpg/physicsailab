<p class="lead">Un resultado de aprendizaje sin evidencia es una intención. Este capítulo trata de decidir qué trabajos de estudiantes se recogen para juzgar cada resultado, en qué momentos del plan, cuántos hacen falta y cómo guardarlos. La clave es que casi todo lo necesario ya ocurre en las asignaturas: hay que organizarlo, no inventarlo.</p>

<section>
<h2>Evidencia directa e indirecta</h2>
<div class="tablewrap"><table>
<tr><th></th><th>Directa</th><th>Indirecta</th></tr>
<tr><td><b>Qué es</b></td><td>Un producto o desempeño del estudiante, evaluado contra criterios.</td><td>Una opinión o un indicador sobre el aprendizaje, no el aprendizaje mismo.</td></tr>
<tr><td><b>Ejemplos</b></td><td>Informe de laboratorio, proyecto de diseño, examen con casos, presentación oral, trabajo de grado, práctica evaluada, módulo de Saber Pro.</td><td>Encuesta a egresados y empleadores, autoevaluación del estudiante, grupo focal, tasas de graduación o empleo.</td></tr>
<tr><td><b>Fortaleza</b></td><td>Muestra qué hace el estudiante.</td><td>Capta lo que es difícil de observar y da contexto.</td></tr>
<tr><td><b>Debilidad</b></td><td>Cuesta más recoger y calibrar.</td><td>Está sujeta a percepciones y no prueba el logro.</td></tr>
</table></div>
<p>La regla es <b>triangular</b>: para cada resultado, al menos dos evidencias directas de momentos distintos, y una indirecta que las contraste. Si la encuesta a egresados dice que se sienten bien preparados en diseño y los proyectos de diseño muestran dificultades, la discrepancia es el hallazgo más valioso.</p>
</section>

<section>
<h2>Evaluación embebida: aprovechar lo que ya se hace</h2>
<p>La mayor parte de las evidencias son actividades que ya existen: los informes de laboratorio, los proyectos, los exámenes con problemas abiertos. El enfoque de <b>evaluación embebida</b> consiste en usar esas actividades, con una rúbrica por resultado o indicador, en lugar de crear pruebas adicionales. Ventajas: no recarga a estudiantes ni profesores, y la evidencia es auténtica. Condición: la actividad debe pedir realmente el resultado; un examen de fórmulas no sirve para evaluar «diseña».</p>
<p>El plan de estudios de la ficha tiene muchas actividades con laboratorio, un «Taller de Ingeniería Física», cursos de formulación de proyectos y planes de negocio, y trabajo de grado en dos asignaturas: la materia prima es abundante. Lo que hay que decidir es cuáles se usarán, en qué momento y con qué meta.</p>
</section>

<section>
<h2>¿A cuántos estudiantes hay que evaluar?</h2>
<p>No siempre hace falta revisar todos los trabajos. Cuando la cohorte es grande basta una muestra aleatoria; el tamaño necesario para estimar una proporción con margen de error \(e\) y confianza dada, en una población de \(N\) estudiantes, es</p>
<div class="eq key" data-name="Tamaño de muestra">\[n_0=\frac{z^2\,p(1-p)}{e^2},\qquad n=\frac{n_0}{1+\dfrac{n_0-1}{N}}\]</div>
<p>donde \(z\) es el valor crítico de la normal (1,645 para 90 %, 1,960 para 95 %) y \(p=0{,}5\) es la elección más conservadora. La segunda expresión es la corrección por población finita: cuando \(N\) es pequeño, \(n\) se acerca a \(N\).</p>
<div class="box note"><h4>El caso de las cohortes pequeñas</h4><p>Las cohortes de muchos programas de ingeniería física son de unas decenas de estudiantes. Con 30 estudiantes, un 95 % de confianza y un margen del 5 % exigen revisar 28: casi todos. En esos casos lo sensato es <b>evaluar a todos</b>, y agrupar dos o tres cohortes cuando se quiera estimar tendencias. Pruebe la herramienta con distintos valores.</p></div>
<div class="sim" data-sim="muestreo" data-title="Tamaño de muestra y precisión del logro observado"></div>
<p>La parte baja de la herramienta usa el <b>intervalo de Wilson</b>, que da el rango plausible de la proporción real en toda la cohorte a partir de lo observado en la muestra. Con 20 de 33 trabajos por encima de la meta (61 %), el intervalo al 90 % ronda del 46 % al 73 %: es demasiado ancho para decir si el programa cumple una meta del 70 %. Es una lección importante: <b>con muestras pequeñas, las diferencias de pocos puntos no son interpretables</b>.</p>
</section>

<section>
<h2>Archivo y datos personales</h2>
<ul>
<li><b>Guarde muestras de tres niveles</b> de desempeño por resultado y cohorte (alto, medio, bajo), con la rúbrica aplicada. Es lo que los pares piden ver.</li>
<li><b>Anonimice</b> los trabajos que se muestren. Los datos personales de estudiantes están protegidos por la Ley 1581 de 2012 de protección de datos personales; consulte con la Universidad el procedimiento de consentimiento y la política de tratamiento de datos.</li>
<li><b>Nombre los archivos de forma sistemática</b> (resultado, curso, periodo, nivel) y guárdelos en un sitio compartido con respaldo, no en computadores personales.</li>
<li><b>Registre el método.</b> Quién evaluó, con qué rúbrica, cuántos trabajos, cómo se escogieron. Sin eso, los números no son verificables.</li>
</ul>
</section>

<section>
<h2>Para practicar</h2>
<ol class="problems">
<li><span class="lvl">Cálculo</span> Una cohorte tiene 120 estudiantes. ¿Cuántos trabajos debe revisar para estimar el logro con 5 % de margen y 95 % de confianza? ¿Y con 10 % y 90 %?
<details><summary>Respuesta</summary><p>92 trabajos en el primer caso y 44 en el segundo (verifique con la herramienta). Reducir exigencias a la mitad del margen reduce el trabajo a menos de la mitad.</p></details></li>
<li><span class="lvl">Diseño</span> Para el resultado «comunica resultados técnicos en español y en una segunda lengua», proponga una evidencia directa y una indirecta.
<details><summary>Una posibilidad</summary><p>Directa: presentación oral del taller de ingeniería física y resumen en inglés del trabajo de grado, evaluados con rúbrica. Indirecta: módulo de inglés de Saber Pro y encuesta a egresados sobre uso del inglés en su trabajo.</p></details></li>
<li><span class="lvl">Interpretación</span> Un programa informa 14 de 20 estudiantes en nivel 3 o superior (70 %), con meta del 70 %. ¿Puede afirmar que cumple?
<details><summary>Respuesta</summary><p>Observa 70 %, pero con 20 estudiantes el intervalo de Wilson al 95 % es de aproximadamente 48 % a 86 %. Los datos son compatibles con cumplir y con no cumplir. Lo prudente es decir «alcanza la meta en la muestra observada» y reunir más cohortes.</p></details></li>
</ol>
