<p class="lead">La visita de pares dura pocos días y se desarrolla en conversaciones. Un programa no se salva por tener un buen informe si, ante una pregunta sencilla, el coordinador, un profesor y un estudiante cuentan tres historias distintas. Este capítulo reúne lo que los pares buscan en materia de resultados de aprendizaje, qué debe poder decir cada grupo y cómo prepararse sin improvisar. Termina con un autodiagnóstico que ordena las tareas por prioridad.</p>

<section>
<h2>La carpeta de evidencias del Factor 5</h2>
<p>Para cada característica asociada a los resultados, el programa debe poder poner sobre la mesa documentos concretos. Una lista de trabajo, organizada según las exigencias del Acuerdo CESU 02 de 2020 (y que sirve también para el modelo de 2025):</p>
<div class="tablewrap"><table>
<tr><th>Tema</th><th>Documento o evidencia</th><th>Qué debe mostrar</th></tr>
<tr><td>Definición</td><td>Documento de resultados con su proceso de construcción</td><td>Resultados aprobados, referentes, participación de grupos de interés, fechas.</td></tr>
<tr><td>Coherencia</td><td>Tabla que relaciona perfil, competencias y resultados</td><td>Que no hay perfil sin resultado ni resultado sin perfil (característica 24).</td></tr>
<tr><td>Alineación</td><td>Matriz curricular y sílabos de asignaturas clave</td><td>Dónde se introduce, refuerza y domina cada resultado.</td></tr>
<tr><td>Estrategias</td><td>Descripción pedagógica de cursos representativos</td><td>Que las estrategias son coherentes con los resultados (característica 21).</td></tr>
<tr><td>Evaluación</td><td>Rúbricas y plan de evidencias</td><td>Instrumentos con niveles; momentos del plan; evidencia directa e indirecta (característica 22).</td></tr>
<tr><td>Calibración</td><td>Registros de calibración y concordancia entre evaluadores</td><td>Que los datos son confiables.</td></tr>
<tr><td>Logro</td><td>Tablero de logro por resultado y cohorte; muestras de trabajos</td><td>Qué porcentaje alcanza la meta y cómo cambia (característica 23).</td></tr>
<tr><td>Mejora</td><td>Actas del comité curricular; plan de mejoramiento con estado</td><td>Decisiones tomadas por los datos y su verificación (características 23 y 25).</td></tr>
<tr><td>Divulgación</td><td>Evidencias de comunicación a estudiantes y profesores</td><td>Que se conocen, no solo que se publican.</td></tr>
</table></div>
<div class="box note"><h4>Una carpeta que se puede recorrer en diez minutos</h4><p>Organice la carpeta de modo que un par pueda, con cualquiera de los resultados, seguir la historia completa: definición, asignaturas, evidencias, datos, decisión. Un índice de una página y los documentos nombrados con el código del resultado resuelven la mayor parte del problema.</p></div>
</section>

<section>
<h2>Qué debe poder decir cada grupo</h2>
<ul>
<li><b>Directivos y coordinación.</b> Cuáles son los resultados y cómo se definieron; dónde está el programa en el ciclo; qué decisiones tomó a partir de los datos; qué falta y cuándo se hará.</li>
<li><b>Profesores.</b> A qué resultados contribuye su asignatura y cómo lo evalúa; cómo se enteraron de los resultados; qué cambió en su curso a partir del análisis.</li>
<li><b>Estudiantes.</b> Que existen resultados, cuáles son al menos en términos generales, cómo se evalúan y qué retroalimentación reciben. No se espera que los recite; se espera que no los desconozcan.</li>
<li><b>Egresados y empleadores.</b> Si se les consultó, cómo y qué cambió. Es la prueba más fuerte de que los resultados se definieron con participación real.</li>
</ul>
<p>No se trata de ensayar respuestas, sino de que el trabajo se haya hecho y se haya comunicado. El mejor ensayo es una reunión del comité en la que cada grupo cuente cómo vio el proceso: aparecen rápido las inconsistencias.</p>
</section>

<section>
<h2>Lo que dijeron los pares en la reunión de 2026</h2>
<p>Un resumen de la reunión con los profesores (notas del audio, no el informe oficial; algunos puntos quedaron con signo de interrogación) recoge fortalezas y debilidades. Para este curso importa la primera fila:</p>
<div class="tablewrap"><table>
<tr><th>Aspecto</th><th>Observación</th></tr>
<tr><td><b>Resultados de aprendizaje (Factor 5)</b></td><td class="bad">No están formulados; falta definir cómo se implementan y se evalúan. Los pares lo trataron como requisito normativo.</td></tr>
<tr><td>Planta profesoral, estudiantes, bienestar, egresados</td><td class="ok">Valorados muy positivamente (planta «excelente», currículo «envidiable» con pocos equipos, egresados en el exterior).</td></tr>
<tr><td>Publicación, renovación de la planta, graduación y recursos de trabajos de grado, visibilidad de egresados, difusión del bienestar, equipos</td><td class="mid">Recomendaciones de mejora; fuera del alcance de este curso.</td></tr>
<tr><td>Plan de estudios 2017</td><td class="mid">Hay pocos egresados del plan; aún no se puede hacer un balance. Es un argumento para tener resultados medidos desde ahora.</td></tr>
</table></div>
<p>La buena valoración del resto ayuda: el reproche está acotado a un asunto concreto y resoluble. La pregunta que sigue es la primera del banco de abajo.</p>
</section>

<section>
<h2>Autodiagnóstico de preparación</h2>
<p>Veintiún enunciados en seis dimensiones. Califique cada uno de 0 («no existe») a 3 («aplicado y con evidencia»). El radar muestra la forma de su preparación y la lista de tareas prioritarias pondera más los pasos finales del ciclo (análisis y mejora), que son los que menos se suelen tener. Sea honesto: la utilidad está en ver dónde está parado, no en sacar buen puntaje.</p>

<section>
<h2>Cuando faltan datos: la honestidad paga</h2>
<p>Es probable que su programa no tenga datos de varias cohortes. Eso no es un fracaso, siempre que se diga con claridad. Los pares valoran más un programa que declara «iniciamos la medición de este resultado en 2026, estos son los instrumentos y estos los primeros datos, y este es el plan para completar el ciclo» que otro que presenta cifras sin método. La autoevaluación, según el Acuerdo 01 de 2025, es un proceso orientado «a fomentar la colaboración y el aprendizaje mutuo»: la franqueza es parte del proceso.</p>
<ul>
<li>Declare lo que existe, lo que no, y desde cuándo se trabaja.</li>
<li>Muestre el plan con fechas, responsables y estado real.</li>
<li>No presente datos de ejemplo ni estimaciones como si fueran mediciones.</li>
<li>No compare con cohortes que no se evaluaron con el mismo instrumento.</li>
</ul>
</section>

<section>
<h2>Para practicar</h2>
<ol class="problems">
<li><span class="lvl">Ensayo</span> Dos personas: una hace de par y otra de coordinador. El par pregunta: «¿Cómo evalúan el resultado de ética y sociedad?». Respondan con evidencia concreta y anoten qué faltó.
<details><summary>Qué mirar</summary><p>Lo que suele faltar: una rúbrica con conductas observables y una evidencia real (un caso o dilema evaluado). Si la respuesta es «lo vemos en la materia de Ciencia, Tecnología y Sociedad» sin mostrar cómo se valora, el par seguirá preguntando.</p></details></li>
<li><span class="lvl">Autodiagnóstico</span> Complete el autodiagnóstico con las condiciones actuales del programa. ¿En qué dimensión sale más baja? ¿Coincide con su intuición?
<details><summary>Qué mirar</summary><p>Lo habitual es un perfil con «Definición» y «Alineación» altas y «Análisis» y «Mejora» bajas. Si es su caso, el trabajo prioritario no es volver a redactar resultados sino construir el ciclo de evidencias y análisis.</p></details></li>
</ol>
