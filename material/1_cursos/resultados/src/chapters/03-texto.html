<p class="lead">Este capítulo lee la norma de cerca. No resume la «idea general»: señala la frase que obliga, qué la sostiene y qué evidencia produce. La herramienta de abajo reúne las disposiciones clave con su fuente exacta y su estado de vigencia. Es el capítulo al que más se volverá cuando haya que escribir el informe.</p>

<section>
<h2>Lo que exige el registro calificado</h2>
<p>El Decreto 1330 de 2019, vigente después de las modificaciones del Decreto 529 de 2024 en los artículos que interesan aquí, pone los resultados de aprendizaje en tres lugares:</p>
<ol class="chain">
<li><b>Política institucional</b> (art. 2.5.3.2.3.1.3, lit. b). La institución debe demostrar que tiene, aplica y obtiene resultados de sus políticas académicas «asociadas a currículo, resultados de aprendizaje, créditos y actividades».</li>
<li><b>Aspectos curriculares del programa</b> (art. 2.5.3.2.3.2.4). El plan general de estudios se representa en créditos «conforme con los resultados de aprendizaje proyectados»; los mecanismos de evaluación son los instrumentos para «mejorar el desempeño de profesores y estudiantes con relación a los resultados de aprendizaje establecidos en el programa».</li>
<li><b>Crédito académico</b> (art. 2.5.3.2.4.1). El crédito expresa el esfuerzo para alcanzar los resultados previstos y equivale a 48 horas por periodo.</li>
</ol>
<p>El decreto no dice más, a propósito: deja a la autonomía institucional la forma de redactar y organizar los resultados. Por eso la Resolución 21795 de 2020 los desarrolló con detalle, hasta ser derogada. Sus requisitos ya no obligan, pero describen bien lo que un par espera ver.</p>
</section>

<section>
<h2>Los diez requisitos de la Resolución 21795 (derogada, pero útil)</h2>
<p>El artículo 12 de esa resolución decía que los resultados debían «hacer referencia a lo que el estudiante sabrá, comprenderá y será capaz de hacer, como resultado integral de su proceso formativo», y que además debían:</p>
<div class="tablewrap"><table>
<tr><th>#</th><th>Requisito</th><th>Cómo comprobarlo</th></tr>
<tr><td>1</td><td>Favorecer procesos centrados en lo que el estudiante aprenderá y puede demostrar</td><td>El verbo describe acción del estudiante, no del docente.</td></tr>
<tr><td>2</td><td>Ser comprensibles para estudiantes, profesores y comunidad académica</td><td>Léalo a un estudiante de primer semestre. ¿Lo entiende?</td></tr>
<tr><td>3</td><td>Ser claros, concretos y verificables en sus dominios o tipos de aprendizaje</td><td>Se puede imaginar una evidencia que lo muestre.</td></tr>
<tr><td>4</td><td>Establecer niveles de aprendizaje desde el ingreso hasta el egreso</td><td>Hay rutas o niveles (introducir, reforzar, dominar).</td></tr>
<tr><td>5</td><td>Establecer los posibles reconocimientos a lo largo del proceso</td><td>Se sabe qué se reconoce al avanzar (créditos, certificados, hitos).</td></tr>
<tr><td>6</td><td>Describir conocimientos, habilidades y competencias para pensar de forma crítica, ética, sistémica y creativa</td><td>Se nota esa dimensión en al menos algunos resultados.</td></tr>
<tr><td>7</td><td>Reflejar las acciones de la institución para aprender a aprender, aprender a hacer y actuar con autonomía y responsabilidad</td><td>Hay estrategias que lo sustentan.</td></tr>
<tr><td>8</td><td>Incluir una clasificación o taxonomía, con sus referentes</td><td>El programa declara cuál usa (por ejemplo, Bloom revisada) y por qué.</td></tr>
<tr><td>9</td><td>Estar alineados con el plan de estudios y el perfil de egreso</td><td>Existe la matriz curricular y la correspondencia con el perfil.</td></tr>
<tr><td>10</td><td>Ser comunicados a los estudiantes</td><td>Hay evidencia de divulgación efectiva.</td></tr>
</table></div>
<p>El artículo 13 pedía, como evidencias, la descripción del proceso de definición y análisis de los resultados y sus referentes, el texto de los resultados, la descripción de cómo se articulan con el plan de estudios, el perfil de egreso, y los medios de comunicación a los estudiantes. En la renovación (art. 58), pedía además «el resultado de las evaluaciones realizadas por la institución a los resultados de aprendizaje». Si el programa tiene estos seis documentos, está cubierto en lo esencial, con independencia de la norma que rija.</p>
</section>

<section>
<h2>Lo que pide la acreditación</h2>
<p>En el Acuerdo CESU 02 de 2020 (el que rige la visita de 2026) el Factor 5 se titula «Aspectos académicos y resultados de aprendizaje». Las características que tocan los resultados son cinco: la 18 (integralidad), la 22 (sistema de evaluación de estudiantes), la 23 (resultados de aprendizaje), la 24 (competencias) y la 25 (evaluación y autorregulación). El Acuerdo CESU 01 de 2025 reorganiza el factor, con el nombre «Aspectos académicos y evaluación», en las características 17 a 21:</p>
<div class="tablewrap"><table>
<tr><th>Tema</th><th>Acuerdo 02 de 2020</th><th>Acuerdo 01 de 2025</th></tr>
<tr><td>Integralidad y gestión curricular</td><td>Car. 18</td><td>Car. 17</td></tr>
<tr><td>Estrategias pedagógicas coherentes con los resultados</td><td>Car. 21</td><td>Car. 18</td></tr>
<tr><td>Sistema de evaluación de estudiantes</td><td>Car. 22</td><td>Car. 19</td></tr>
<tr><td>Evaluación periódica del logro y acciones de ajuste</td><td>Car. 23 «Resultados de aprendizaje»</td><td>Car. 20 «Aportes del sistema de evaluación… al mejoramiento curricular»</td></tr>
<tr><td>Coherencia entre competencias, resultados y currículo</td><td>Car. 24 «Competencias»</td><td>Car. 21</td></tr>
<tr><td>Cultura de evaluación y autorregulación</td><td>Car. 25</td><td>En gran parte, en el Factor 12 «Aseguramiento de la alta calidad del programa»</td></tr>
</table></div>
<p class="ctrl-note">La correspondencia por temas es una lectura de este curso, no una tabla oficial de equivalencias. Revise los textos completos antes de citarla en un informe.</p>
<p>Observe lo que cambia y lo que no. El vocabulario se amplía: el nuevo modelo habla de «procesos y resultados académicos» y de «competencias, capacidades, habilidades y/o destrezas», y permite que cada institución elija su enfoque pedagógico, siempre que los resultados declarados se evidencien. Lo que no cambia es el núcleo: evaluar periódicamente, en diferentes momentos del plan de estudios, el grado de logro, y ajustar con base en lo encontrado.</p>
</section>

<section>
<h2>Para practicar</h2>
<ol class="problems">
<li><span class="lvl">Búsqueda</span> Un par pregunta: «¿en qué norma se funda que ustedes evalúen el logro en varios momentos y no solo al final?». Localice la disposición y cítela.
<details><summary>Respuesta</summary><p>Acuerdo CESU 02 de 2020, Factor 5, característica 23: «de manera periódica, y en diferentes momentos a lo largo del plan de estudios». En el modelo de 2025, característica 20 con la misma exigencia.</p></details></li>
<li><span class="lvl">Análisis</span> El informe del programa dice: «el programa cumple la Resolución 21795 de 2020, art. 12». ¿Qué problema tiene esa frase en 2026?
<details><summary>Respuesta</summary><p>Cita una norma derogada (por la Resolución 2265 de 2023) como si fuera obligatoria. Es mejor citar el Decreto 1075 de 2015 modificado (art. 2.5.3.2.3.2.4), el modelo de acreditación aplicable y, si se quiere, la Resolución 21795 como referente técnico, señalando su estado.</p></details></li>
</ol>
