<p class="lead">Quien trabaja con resultados de aprendizaje se tropieza pronto con una pila de decretos, resoluciones y acuerdos, algunos derogados, otros modificados, otros en transición. Lo más útil que se puede hacer es ordenarlos por lo que cada uno regula y por la fecha en que rige. Este capítulo hace ese mapa y deja una herramienta para consultar qué norma aplica en cualquier fecha.</p>

<section>
<h2>Dos trámites, dos autoridades, dos normas</h2>
<p>El primer malentendido es creer que hay un solo proceso. Hay dos, con lógicas distintas:</p>
<div class="tablewrap"><table>
<tr><th></th><th>Registro calificado</th><th>Acreditación en alta calidad</th></tr>
<tr><td><b>Carácter</b></td><td>Obligatorio. Sin él no se puede ofrecer el programa.</td><td>Voluntario. Reconoce una calidad superior a la mínima.</td></tr>
<tr><td><b>Qué evalúa</b></td><td>Condiciones de calidad institucionales y de programa.</td><td>Factores, características y aspectos por evaluar; incluye la evidencia de resultados.</td></tr>
<tr><td><b>Quién decide</b></td><td>Ministerio de Educación Nacional, con concepto de la Conaces.</td><td>El Ministerio, con concepto del Consejo Nacional de Acreditación (CNA); el CESU define el modelo.</td></tr>
<tr><td><b>Norma central</b></td><td>Decreto 1075 de 2015, Título 3, Parte 5, Libro 2, modificado por los Decretos 1330 de 2019 y 529 de 2024.</td><td>Acuerdo CESU 02 de 2020 (hoy) y Acuerdo CESU 01 de 2025 (desde 2027).</td></tr>
<tr><td><b>Frecuencia</b></td><td>Renovación; la solicitud se presenta con no menos de 12 meses de antelación al vencimiento.</td><td>Renovación de la acreditación, con informe de autoevaluación y visita de pares.</td></tr>
</table></div>
<p>Los dos trámites se tocan: cuando se otorga o renueva la acreditación de un programa, el mismo acto ordena de oficio la renovación del registro calificado (Decreto 1075, art. 2.5.3.2.9.2).</p>
</section>

<section>
<h2>La línea de tiempo</h2>
<p>La herramienta siguiente muestra el estado de cada norma en una fecha. Pruebe tres fechas: el día en que se expidió el Decreto 1330 de 2019, la visita de pares de 2026 y el 1 de enero de 2027.</p>
<div class="sim" data-sim="linea-normativa" data-title="¿Qué norma rige en esta fecha?"></div>
<div class="box warn"><h4>Cuidado con los textos derogados que circulan</h4><p>La Resolución 21795 de 2020 fue derogada por la Resolución 2265 de 2023, y esta a su vez por el Decreto 529 de 2024 (art. 9). Muchas guías universitarias aún citan la 21795 como si estuviera vigente. Conviene citarla solo como referente técnico y no como obligación.</p></div>
</section>

<section>
<h2>Qué modelo de acreditación se aplica y cuándo</h2>
<p>El Acuerdo CESU 01 de 2025 fue expedido el 26 de mayo de 2025 y publicado en el Diario Oficial No. 53.131 del 28 de mayo de 2025. Su artículo 73 deroga los Acuerdos 02 de 2020 y 04 de 2022, pero su artículo 68 establece una <b>aplicación gradual</b>:</p>
<ul>
<li>Apreciación de condiciones iniciales (primera etapa para acreditar): desde el 1 de enero de 2026.</li>
<li>Informe de autoevaluación con fines de acreditación de programas, unidades académicas e instituciones: desde el 1 de enero de 2027.</li>
<li>Solicitudes de renovación de la acreditación: desde el 1 de junio de 2027.</li>
</ul>
<p>Los artículos 69 a 71 añaden reglas de transición para trámites suspendidos, medidas preventivas y situaciones previstas en el modelo anterior. Una lectura prudente es que los trámites que se radican antes de esas fechas siguen el modelo del Acuerdo 02 de 2020, y los posteriores, el del Acuerdo 01 de 2025. Como esto afecta decisiones de fondo, vale la pena confirmarlo por escrito con la Oficina de Autoevaluación de la Universidad y con el CNA.</p>
<div class="box note"><h4>Dónde está el programa</h4><p>Según su presentación a los pares, el programa de Ingeniería Física recibió la acreditación de alta calidad por la Resolución MEN 8333 de 2019. La visita de 2026 es, por tanto, una <b>renovación</b>, y la presentación aplica los doce factores del Acuerdo CESU 02 de 2020. La próxima renovación, de acuerdo con el artículo 68 del Acuerdo 01 de 2025, se regirá por el nuevo modelo.</p></div>
<div class="box note"><h4>Una consecuencia práctica</h4><p>La Universidad del Cauca recibió la acreditación institucional por ocho años mediante la Resolución 6218 del 13 de junio de 2019 (según el Ministerio de Educación). Esa vigencia termina a mediados de 2027, justo cuando empieza a aplicarse el nuevo modelo a las renovaciones. Un programa que ya funciona en el ciclo de resultados llega a esa fecha con ventaja para su propio informe y para el institucional.</p></div>
<p>El artículo 67 del Acuerdo 01 de 2025 ordenó al CNA publicar, dentro de los seis meses siguientes, las guías necesarias para aplicar el modelo. Compruebe en el sitio del CNA cuáles están publicadas en el momento en que usted trabaja; este curso no puede asumir su contenido.</p>
</section>

<section>
<h2>Además de las normas: los referentes que no obligan, pero pesan</h2>
<ul>
<li><b>Marco Nacional de Cualificaciones</b> (Decreto 1649 de 2021): ocho niveles con descriptores de conocimientos, destrezas, y autonomía y responsabilidad. Sirve para calibrar si un resultado tiene el nivel de un pregrado universitario.</li>
<li><b>Prueba Saber Pro</b> (Icfes): módulos de competencias genéricas y específicas. Es evidencia externa que los pares suelen pedir, aunque no mide todos los resultados de un programa.</li>
<li><b>Referentes internacionales</b>: ABET, Acuerdo de Washington, descriptores de Dublín. Se verán en el capítulo 6.</li>
<li><b>Política institucional</b>: el Decreto 1330 exige que la institución tenga políticas académicas «asociadas a currículo, resultados de aprendizaje, créditos y actividades». El programa debe conocer la de la Universidad y alinearse con ella.</li>
</ul>
</section>

<section>
<h2>Para practicar</h2>
<ol class="problems">
<li><span class="lvl">Consulta</span> Ponga la herramienta en el 15 de marzo de 2022. ¿Qué norma de acreditación regía? ¿Y cuál era la resolución de registro calificado vigente sobre resultados de aprendizaje?
<details><summary>Respuesta</summary><p>El Acuerdo CESU 02 de 2020 (en vigor desde el 1 de julio de 2020) y la Resolución 21795 de 2020 (vigente desde el 19 de noviembre de 2020 hasta que la derogó la 2265 de 2023).</p></details></li>
<li><span class="lvl">Análisis</span> Su programa radicará el informe de autoevaluación en septiembre de 2027. ¿Con qué modelo será evaluado según el artículo 68 del Acuerdo 01 de 2025?
<details><summary>Respuesta</summary><p>Con el del Acuerdo 01 de 2025, porque la fecha de radicación es posterior al 1 de enero de 2027. Eso significa preparar el informe con los factores y características de esa norma (Factor 5, «Aspectos académicos y evaluación», características 17 a 21).</p></details></li>
</ol>
</section>
