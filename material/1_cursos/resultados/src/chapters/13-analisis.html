<p class="lead">Con las evidencias calificadas con rúbrica aparece el momento más delicado: convertir las calificaciones en un juicio sobre el resultado. Es fácil hacerlo mal en dos direcciones: ver un problema donde solo hay ruido, o ver cumplimiento donde hay una brecha oculta por un promedio. Este capítulo da criterios para analizar con honestidad y presentar los datos de manera que los pares puedan confiar en ellos.</p>

<section>
<h2>Fijar la meta antes de mirar los datos</h2>
<p>Una meta es una declaración como «al menos el 70 % de los estudiantes alcanza el nivel 3 o superior en cada resultado». Debe definirse <b>antes</b> de ver los datos; si se fija después, se ajusta a lo que salió y deja de ser una meta. Para escogerla:</p>
<ul>
<li><b>Parta de datos propios previos</b> si existen (cohortes anteriores) y proponga una meta algo más exigente.</li>
<li><b>Considere el tipo de resultado.</b> Para resultados de seguridad o ética puede exigirse el 100 % en el nivel mínimo; para resultados de diseño avanzado, una proporción menor en «sobresaliente».</li>
<li><b>Sea consistente.</b> Una meta distinta para cada resultado sin una razón es más difícil de defender que una meta común con excepciones justificadas.</li>
<li><b>Revísela</b> cada ciclo: una meta alcanzada durante varios ciclos puede subir; una nunca alcanzada hay que examinarla.</li>
</ul>
</section>

<section>
<h2>Mirar la distribución, no solo el promedio</h2>
<p>Un promedio de 2,9 sobre 4 puede esconder dos realidades: un grupo homogéneo en nivel 3, o la mitad en nivel 1 y la otra en nivel 4. Con rúbricas conviene siempre reportar <b>el porcentaje de estudiantes en cada nivel</b> y la proporción que alcanza el nivel meta o superior. Es lo que muestra el tablero de abajo: barras apiladas por nivel y una línea de meta.</p>
<div class="sim" data-sim="tablero" data-title="Tablero de logro por resultado de aprendizaje"></div>
<p>Lectura del tablero: cada barra está dividida en los cuatro niveles (de izquierda a derecha, de inicial a sobresaliente). La línea punteada marca el límite que deja a su derecha la proporción exigida por la meta. Si el límite entre los niveles inferiores y el nivel mínimo aceptable queda a la izquierda de la línea, el resultado cumple; si queda a la derecha, hay brecha. A la derecha de cada barra se muestra el porcentaje que alcanza el nivel mínimo y la tendencia frente a las cohortes anteriores.</p>
<div class="box warn"><h4>Datos de demostración</h4><p>Los datos iniciales son ficticios y se generan con una semilla fija. Reemplácelos con los reales; no presente ningún dato del ejemplo como resultado del programa.</p></div>
</section>

<section>
<h2>Cuatro precauciones al interpretar</h2>
<ol class="chain">
<li><b>Tamaño de muestra.</b> Con 20 o 30 estudiantes, un cambio de cinco puntos entre cohortes no es distinguible del azar (capítulo 11). Reúna dos o tres cohortes antes de hablar de tendencias.</li>
<li><b>Comparabilidad.</b> Compare cohortes con el mismo instrumento y la misma rúbrica. Si cambió la rúbrica, la comparación es dudosa.</li>
<li><b>Concordancia.</b> Si los evaluadores no concuerdan (κ bajo), los datos reflejan al evaluador más que al estudiante. Revise esto antes de buscar causas pedagógicas.</li>
<li><b>Causalidad.</b> Que un resultado baje no significa que el curso donde se mide sea el culpable; puede ser un problema de cursos anteriores donde debía haberse introducido o reforzado. Use la matriz curricular para rastrear.</li>
</ol>
</section>

<section>
<h2>De la brecha a la causa: diagnóstico por indicador</h2>
<p>Cuando un resultado no cumple la meta, el primer paso no es proponer cambios sino localizar el problema. Los datos por indicador (cada fila de la rúbrica) suelen mostrar que la brecha se concentra en uno. Si en RA3 el procedimiento y la trazabilidad están bien y la incertidumbre es el punto débil, la acción será distinta que si fallan los tres.</p>
<ol class="chain">
<li><b>¿Dónde falla?</b> Qué indicador, en qué curso y para qué estudiantes.</li>
<li><b>¿Se introdujo y se reforzó antes?</b> Consulte la matriz: ¿hubo cursos previos donde se trabajó? ¿Con qué nivel de exigencia?</li>
<li><b>¿Se evalúa bien?</b> ¿El instrumento mide lo que dice? ¿Concuerdan los evaluadores?</li>
<li><b>¿Qué dicen los estudiantes y los profesores?</b> Un grupo focal breve suele revelar causas que los datos no ven.</li>
<li><b>Formule una hipótesis y una acción</b> y defina cómo se sabrá si funcionó (capítulo 14).</li>
</ol>
</section>

<section>
<h2>Cómo presentarlo a los pares</h2>
<p>Una página por resultado es un formato eficaz: el texto del resultado, los indicadores, las evidencias usadas, el método (muestra, evaluadores, concordancia), la distribución por niveles en las últimas cohortes, la meta, la lectura del comité curricular y las acciones derivadas. Los pares no necesitan cien tablas: necesitan ver, para cada resultado, la historia completa en un lugar.</p>
</section>

<section>
<h2>Para practicar</h2>
<ol class="problems">
<li><span class="lvl">Lectura</span> En el tablero, suba la meta al 85 %. ¿Cuántos resultados cambian de estado? ¿Qué significa «cerca de la meta»?
<details><summary>Qué mirar</summary><p>Una meta más alta convierte en brechas resultados que antes cumplían. «Cerca» significa dentro de diez puntos porcentuales de la meta. Observe cómo la decisión de la meta cambia el diagnóstico sin que los datos hayan cambiado; por eso debe fijarse antes.</p></details></li>
<li><span class="lvl">Diagnóstico</span> Un resultado de experimentación tiene el 55 % en nivel 3 o más. Sus indicadores muestran: procedimiento 85 %, incertidumbre 40 %, trazabilidad 80 %. ¿Qué haría primero?
<details><summary>Respuesta</summary><p>Concentrarse en incertidumbre: revisar dónde se introduce y se refuerza (¿solo en un curso?), comprobar que los evaluadores calibran bien este indicador y, si se confirma, reforzarlo con ejercicios y retroalimentación en cursos anteriores al de la evidencia. No tocaría procedimiento ni trazabilidad.</p></details></li>
</ol>
