    <h1 class="home-title">Resultados de aprendizaje<span>del decreto al aula, para el programa de Ingeniería Física de la Universidad del Cauca</span></h1>
    <p class="home-lead">Después de la visita de los pares académicos, los resultados de aprendizaje quedaron en el centro de la conversación. Este curso explica qué son, qué exige la norma colombiana, cómo se construyen para un programa concreto, cómo se evalúan y qué hay que hacer con lo que se encuentra. El curso se contrastó con los documentos que el programa reunió para la visita (presentación a los pares, plan de estudios, plan de mejoramiento, microcurrículos y actas): los capítulos 5 y 9 muestran lo que se encontró. Cada capítulo termina en una herramienta que se puede usar con los datos reales del programa: un analizador de redacción, una matriz curricular, una calculadora de muestras, un tablero de logro, un simulador del ciclo de mejora.</p>
    <p class="home-lead" style="font-size:.92em"><b>Importante.</b> Este material es de estudio y trabajo, no un documento oficial de la Universidad. La normativa citada se leyó en su texto oficial y se indica su estado de vigencia; los resultados de aprendizaje vigentes y el plan de estudios vienen de los documentos del programa, pero las marcas de la matriz, las propuestas de indicadores y los datos de las herramientas son <b>ejemplos ilustrativos</b> que el programa debe adaptar y aprobar por sus propias instancias.</p>
    <p class="home-count ctrl-note" style="margin-top:14px;font-size:13px"></p>
    <p class="home-author"><small>Elaborado por</small><b>Mg. Manuel Alejandro Obando</b><span>Departamento de Física · Universidad del Cauca</span></p>

<div class="home-howto">
  <div><b>Primero la norma, leída bien</b><p>Decreto 1330 de 2019, Decreto 529 de 2024, Acuerdos CESU 02 de 2020 y 01 de 2025, Marco Nacional de Cualificaciones. Qué está vigente, qué fue derogado, qué se aplica en cada fecha y qué cambia desde 2027.</p></div>
  <div><b>Después, el método</b><p>Cómo pasar del perfil de egreso a resultados bien redactados, cómo alinearlos con las asignaturas, cómo evaluarlos con rúbricas y muestras, y cómo analizar los datos sin engañarse.</p></div>
  <div><b>Por último, la visita</b><p>Qué evidencias piden los pares, qué preguntas hacen, dónde suelen tropezar los programas y una ruta de trabajo con fechas, hacia atrás desde la entrega del informe.</p></div>
