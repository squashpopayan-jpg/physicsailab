<template class="chapter-src" data-id="glosario" data-num="A" data-title="Glosario" data-part="Apéndices" data-short="Términos del curso con su definición y el capítulo donde se trabajan">
<p class="lead">Definiciones breves de los términos que más se confunden. Donde la definición viene de la norma, se indica la fuente.</p>
<section>
<h2>Términos</h2>
<div class="tablewrap"><table>
<tr><th>Término</th><th>Definición</th><th>Cap.</th></tr>
<tr><td><b>Acción de mejora</b></td><td>Cambio concreto, con responsable, plazo e indicador de éxito, derivado del análisis de los resultados.</td><td><a href="#cierre">14</a></td></tr>
<tr><td><b>Alineación constructiva</b></td><td>Coherencia entre los resultados que se persiguen, las actividades de enseñanza y los instrumentos de evaluación (J. Biggs).</td><td><a href="#alineacion">10</a></td></tr>
<tr><td><b>Alta calidad (acreditación)</b></td><td>Reconocimiento voluntario, por parte del Estado, de una calidad superior a la exigida para el registro calificado. Lo decide el Ministerio con concepto del CNA.</td><td><a href="#normas">2</a></td></tr>
<tr><td><b>Autoevaluación</b></td><td>Proceso interno y participativo con el que el programa examina sus propios resultados y capacidades y que culmina en un informe.</td><td><a href="#pares">15</a></td></tr>
<tr><td><b>Calibración</b></td><td>Sesión en la que evaluadores califican los mismos trabajos de forma independiente y discuten las diferencias hasta acordar el sentido de los descriptores.</td><td><a href="#rubricas">12</a></td></tr>
<tr><td><b>CESU</b></td><td>Consejo Nacional de Educación Superior. Define el modelo de acreditación mediante acuerdos.</td><td><a href="#normas">2</a></td></tr>
<tr><td><b>CNA</b></td><td>Consejo Nacional de Acreditación. Evalúa los informes y conceptúa sobre la acreditación; elabora guías y lineamientos.</td><td><a href="#normas">2</a></td></tr>
<tr><td><b>Competencia</b></td><td>Conjunto articulado de conocimientos, capacidades, habilidades, disposiciones, actitudes y aptitudes que permite actuar de forma coherente y eficaz; susceptible de evaluarse mediante resultados de aprendizaje (Acuerdo CESU 02 de 2020).</td><td><a href="#vocabulario">4</a></td></tr>
<tr><td><b>Conaces</b></td><td>Comisión Nacional Intersectorial de Aseguramiento de la Calidad de la Educación Superior. Emite concepto en el registro calificado.</td><td><a href="#normas">2</a></td></tr>
<tr><td><b>Crédito académico</b></td><td>Unidad de medida del trabajo académico del estudiante; equivale a 48 horas por periodo académico (Decreto 1330 de 2019).</td><td><a href="#alineacion">10</a></td></tr>
<tr><td><b>Criterio (de rúbrica)</b></td><td>Dimensión del desempeño que se valora; equivale a un indicador de desempeño.</td><td><a href="#rubricas">12</a></td></tr>
<tr><td><b>Descriptor de nivel</b></td><td>Texto que describe lo que se observa en un nivel de desempeño dentro de un criterio.</td><td><a href="#rubricas">12</a></td></tr>
<tr><td><b>Evaluación embebida</b></td><td>Uso de las actividades ordinarias de un curso como fuente de evidencia de resultados, con rúbricas, en lugar de pruebas adicionales.</td><td><a href="#evidencias">11</a></td></tr>
<tr><td><b>Evidencia directa</b></td><td>Producto o desempeño del estudiante evaluado contra criterios.</td><td><a href="#evidencias">11</a></td></tr>
<tr><td><b>Evidencia indirecta</b></td><td>Percepción o indicador sobre el aprendizaje (encuestas, tasas), no el aprendizaje mismo.</td><td><a href="#evidencias">11</a></td></tr>
<tr><td><b>Factor y característica</b></td><td>Estructura del modelo de acreditación: cada factor agrupa características que se evalúan mediante aspectos concretos.</td><td><a href="#texto">3</a></td></tr>
<tr><td><b>Indicador de desempeño</b></td><td>Conducta concreta y observable, con un criterio claro, que muestra el logro de un resultado.</td><td><a href="#vocabulario">4</a></td></tr>
<tr><td><b>κ de Cohen</b></td><td>Medida de la concordancia entre dos evaluadores corregida por el azar. El κ ponderado tiene en cuenta la distancia entre niveles.</td><td><a href="#rubricas">12</a></td></tr>
<tr><td><b>Marco Nacional de Cualificaciones</b></td><td>Estructura de ocho niveles con descriptores de conocimientos, destrezas, y autonomía y responsabilidad (Decreto 1649 de 2021).</td><td><a href="#referentes">6</a></td></tr>
<tr><td><b>Matriz curricular</b></td><td>Tabla que relaciona asignaturas con resultados del programa y el nivel de contribución (I, R, M).</td><td><a href="#alineacion">10</a></td></tr>
<tr><td><b>Meta de logro</b></td><td>Proporción de estudiantes que debe alcanzar un nivel mínimo en un resultado; se fija antes de mirar los datos.</td><td><a href="#analisis">13</a></td></tr>
<tr><td><b>Nivel de desempeño</b></td><td>Grado de calidad en que se cumple un criterio (por ejemplo, inicial, en desarrollo, logrado, sobresaliente).</td><td><a href="#rubricas">12</a></td></tr>
<tr><td><b>Objetivo</b></td><td>Lo que se propone el programa o el docente. No describe lo que demuestra el estudiante.</td><td><a href="#vocabulario">4</a></td></tr>
<tr><td><b>Perfil de egreso</b></td><td>Descripción general del profesional que forma el programa. Los resultados de aprendizaje deben estar alineados con él.</td><td><a href="#vocabulario">4</a></td></tr>
<tr><td><b>Procesos y resultados académicos</b></td><td>Expresión del Acuerdo CESU 01 de 2025 para los resultados de la formación y los procesos de enseñanza y aprendizaje que conducen a ellos.</td><td><a href="#texto">3</a></td></tr>
<tr><td><b>Registro calificado</b></td><td>Requisito obligatorio, otorgado por el Ministerio de Educación, para ofrecer un programa de educación superior.</td><td><a href="#normas">2</a></td></tr>
<tr><td><b>Resultado de aprendizaje</b></td><td>Declaración expresa de lo que se espera que un estudiante conozca y demuestre al completar su programa académico (Decreto 1330 de 2019; Acuerdo CESU 02 de 2020).</td><td><a href="#porque">1</a></td></tr>
<tr><td><b>Rúbrica analítica</b></td><td>Tabla de criterios por niveles con descriptores; instrumento para convertir un trabajo en datos de logro.</td><td><a href="#rubricas">12</a></td></tr>
<tr><td><b>SIAC</b></td><td>Sistema Interno de Aseguramiento de la Calidad de la institución.</td><td><a href="#cierre">14</a></td></tr>
<tr><td><b>Taxonomía de Bloom (revisada)</b></td><td>Clasificación de seis niveles de proceso cognitivo: recordar, comprender, aplicar, analizar, evaluar y crear (Anderson y Krathwohl, 2001).</td><td><a href="#anatomia">7</a></td></tr>
<tr><td><b>Triangulación</b></td><td>Contrastar varias fuentes de evidencia, directas e indirectas, para juzgar un mismo resultado.</td><td><a href="#evidencias">11</a></td></tr>
</table></div>
</section>
