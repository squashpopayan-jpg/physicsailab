<p class="lead">Tener resultados bien redactados es solo la mitad. La otra mitad es que cada asignatura sepa a cuáles contribuye y de qué manera. Cuando eso falta, los resultados son una declaración externa al currículo, y los pares lo notan en la primera conversación con un profesor: «¿a cuál resultado del programa contribuye su curso?». Este capítulo muestra cómo construir esa relación y cómo comprobar su coherencia.</p>

<section>
<h2>Alineación constructiva</h2>
<p>El principio, formulado por John Biggs, es simple: los <b>resultados</b> que se quieren, las <b>actividades</b> con que se enseña y la <b>evaluación</b> con que se comprueba deben ser coherentes entre sí. Si el resultado dice «diseña», pero la clase explica teoría y el examen pide fórmulas, hay desalineación: el estudiante aprende lo que se evalúa, no lo que se declara.</p>
<ol class="chain">
<li><b>Resultado.</b> «Calibra un sensor con patrones trazables y reporta la incertidumbre.»</li>
<li><b>Actividad.</b> Una práctica donde cada grupo calibra un sensor y recibe retroalimentación.</li>
<li><b>Evaluación.</b> Un informe valorado con una rúbrica de incertidumbre, no un examen de fórmulas.</li>
</ol>
<p>El Decreto 1330 lo dice con otras palabras: el plan de estudios se representa en créditos «conforme con los resultados de aprendizaje proyectados» (art. 2.5.3.2.3.2.4, lit. a), y los mecanismos de evaluación se orientan a mejorar el desempeño «con relación a los resultados de aprendizaje establecidos en el programa» (lit. e). Y el Acuerdo 02 de 2020, característica 21, exige que las estrategias pedagógicas se diseñen «de acuerdo con los resultados de aprendizaje previstos».</p>
</section>

<section>
<h2>La matriz curricular</h2>
<p>La herramienta central del alineamiento es una tabla: asignaturas en las filas, resultados del programa en las columnas, y en cada celda una letra que dice cómo contribuye la asignatura:</p>
<ul>
<li><b>I · Introduce.</b> El estudiante se encuentra con el resultado por primera vez. La evaluación es formativa.</li>
<li><b>R · Refuerza.</b> Lo practica con mayor autonomía y complejidad.</li>
<li><b>M · Domina.</b> Se espera el nivel de egreso y <b>se conserva evidencia</b> del trabajo para evaluar el resultado.</li>
</ul>
<p>La matriz cargada trae los cursos, semestres y créditos del plan vigente (suman 165). Las marcas son <b>ilustrativas</b>, derivadas por este curso: los microcurrículos del programa no declaran resultados de aprendizaje, de modo que la relación real está por construir con los profesores. Haga clic en las celdas para cambiarlas y observe las alertas que aparecen abajo.</p>
<div class="sim" data-sim="matriz" data-title="Matriz curricular: cursos y resultados"></div>
<p>Reglas que la herramienta comprueba:</p>
<ul>
<li>Todo resultado tiene al menos un curso que lo introduce, uno que lo refuerza y uno que lo domina.</li>
<li>El dominio no aparece antes que la introducción en la secuencia del plan.</li>
<li>Ningún resultado se salta de I a M sin refuerzo intermedio.</li>
<li>Cada resultado tiene al menos tres cursos asociados; menos es una cobertura débil.</li>
<li>Ninguna asignatura carga más de cuatro resultados: si lo hace, es dudoso que los evalúe todos de verdad.</li>
</ul>
<div class="box warn"><h4>La matriz no es una prueba de aprendizaje</h4><p>Que un curso aparezca marcado con «M» solo dice que se espera que allí se demuestre el resultado. No dice que se logre. Para eso están las evidencias (capítulo 11). Una matriz perfecta con evidencias vacías es el error más común.</p></div>
</section>

<section>
<h2>Resultados de asignatura y sílabo</h2>
<p>Cada asignatura traduce los resultados del programa en dos o cuatro resultados propios, más concretos y de alcance semestral. Ejemplo para un curso de instrumentación:</p>
<div class="tablewrap"><table>
<tr><th>Resultado de la asignatura</th><th>Contribuye a</th><th>Nivel</th><th>Evidencia</th></tr>
<tr><td>Calibra un sensor de temperatura con patrones trazables y reporta la incertidumbre de la calibración.</td><td>RA3, RA5</td><td>R</td><td>Informe de laboratorio 3, rúbrica de medición</td></tr>
<tr><td>Selecciona un sensor para una aplicación dada, justificando con especificaciones técnicas.</td><td>RA5</td><td>R</td><td>Caso de estudio, rúbrica de selección</td></tr>
</table></div>
<p>El sílabo es el documento donde esto queda escrito y se comunica al estudiante. Debe incluir, como mínimo: los resultados de la asignatura, a cuáles resultados del programa contribuye y con qué nivel, las actividades y su relación con los resultados, la evaluación (instrumentos y ponderaciones), los créditos con su distribución de horas, y la bibliografía. La Resolución 21795 pedía además que los resultados se comunicaran a los estudiantes; el sílabo es el medio más natural. En el apéndice C hay una plantilla.</p>
</section>

<section>
<h2>Créditos y horas: la otra mitad de la alineación</h2>
<p>El crédito es la unidad que mide el esfuerzo necesario para lograr los resultados. El Decreto 1330 (art. 2.5.3.2.4.1) dice que un crédito equivale a <b>48 horas</b> por periodo académico y que la institución determina y justifica la proporción entre horas con el profesor y horas de trabajo independiente. Si una asignatura tiene tres créditos, el estudiante dedica 144 horas en total al semestre; el sílabo debe repartir esas horas en actividades que conduzcan a los resultados. Pruebe la calculadora:</p>

<p>El número de créditos de una actividad es siempre un entero (art. 2.5.3.2.4.2). Cuando el cálculo exacto da, por ejemplo, 3,5, la institución debe decidir el entero y justificarlo con los resultados previstos.</p>
</section>

<section>
<h2>Para practicar</h2>
<ol class="problems">
<li><span class="lvl">Matriz</span> En la herramienta, quite las marcas M de RA2 (Diseño de Experimentos en Ingeniería, Gestión Tecnológica y Trabajo de Grado II). ¿Qué alerta aparece? ¿Qué decisión implica?
<details><summary>Respuesta</summary><p>RA2 deja de tener un curso que lo domine. El programa debe decidir si el resultado se logra en algún otro lugar (y marcarlo) o si hay una brecha curricular que cerrar con una actividad nueva.</p></details></li>
<li><span class="lvl">Cálculo</span> Según la presentación del programa, una asignatura de 3 créditos tiene 6 horas semanales con el profesor. En 16 semanas, ¿cuántas horas de trabajo independiente quedan y qué proporción resulta?
<details><summary>Respuesta</summary><p>3 × 48 = 144 horas totales; con el profesor 6 × 16 = 96 horas; quedan 48 horas independientes, es decir, 3 por semana (33 %). La proporción es 2 : 1 con el profesor. Con 4 créditos, el programa indica 6 y 6 horas semanales (50 % autónomo): conviene que el sílabo explique por qué.</p></details></li>
<li><span class="lvl">Diagnóstico</span> En el sílabo de un curso se lee: «Objetivo: transmitir los fundamentos de la óptica». ¿Qué falta para que sea un resultado de aprendizaje alineado?
<details><summary>Respuesta</summary><p>Un verbo que describa lo que demuestra el estudiante, el resultado o resultados del programa a los que contribuye, el nivel (I, R o M) y la evidencia con la que se evalúa.</p></details></li>
</ol>
