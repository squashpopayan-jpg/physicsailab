<p class="lead">La palabra que más repite el modelo de acreditación es «mejoramiento». La característica 23 del Acuerdo 02 de 2020 no pide solo evaluar el logro: pide que «con base en dicha evaluación, se tomen acciones de ajuste a los aspectos curriculares y a las metodologías de enseñanza-aprendizaje». Un programa que mide pero no actúa tiene el ciclo abierto. Este capítulo trata de cerrarlo: qué tipo de acciones existen, cómo se documentan y cómo se comprueba que funcionaron.</p>

<section>
<h2>Tipos de acción</h2>
<div class="tablewrap"><table>
<tr><th>Tipo</th><th>Ejemplos en Ingeniería Física</th><th>Cuándo conviene</th></tr>
<tr><td><b>Curricular</b></td><td>Mover un contenido a un curso anterior; agregar un laboratorio; crear un hito de diseño en semestres intermedios; ajustar los prerrequisitos.</td><td>La brecha viene de que el resultado no se introdujo o no se reforzó.</td></tr>
<tr><td><b>Pedagógica</b></td><td>Pasar de clase magistral a aprendizaje basado en proyectos en un curso; retroalimentación escrita sobre incertidumbres antes de la evaluación final.</td><td>El resultado se trabaja pero los estudiantes no lo logran.</td></tr>
<tr><td><b>De evaluación</b></td><td>Reescribir una rúbrica ambigua; calibrar evaluadores; cambiar la evidencia por una más auténtica.</td><td>Los datos son poco confiables o no miden el resultado.</td></tr>
<tr><td><b>De recursos</b></td><td>Adquirir un equipo, actualizar software, reforzar el apoyo de monitores.</td><td>Los estudiantes no tienen oportunidades de práctica suficientes.</td></tr>
<tr><td><b>De apoyo al estudiante</b></td><td>Tutorías, cursos de nivelación, alertas tempranas.</td><td>La brecha se concentra en un grupo identificable.</td></tr>
</table></div>
<p>Antes de decidir, recuerde la regla del capítulo 13: <b>primero compruebe que el instrumento mide bien</b>. Una acción pedagógica costosa para corregir un problema que era de calificación es dinero perdido.</p>
</section>

<section>
<h2>Cómo documentar una acción</h2>
<p>Una acción útil, y creíble ante los pares, responde siempre a las mismas preguntas:</p>
<ol class="chain">
<li><b>Hallazgo.</b> ¿Qué dicen los datos? (resultado, indicador, cohorte, cifra)</li>
<li><b>Hipótesis de causa.</b> ¿Por qué cree que ocurre?</li>
<li><b>Acción.</b> ¿Qué se cambia, concretamente?</li>
<li><b>Responsable, fecha y recursos.</b></li>
<li><b>Indicador de éxito.</b> ¿Qué dato debería cambiar y cuánto?</li>
<li><b>Verificación.</b> ¿Cuándo y cómo se mide de nuevo?</li>
<li><b>Estado y aprendizaje.</b> ¿Se hizo? ¿Funcionó? ¿Se mantiene, se ajusta o se descarta?</li>
</ol>
<div class="box ex"><h4>Ejemplo completo</h4>
<p><b>Hallazgo:</b> en RA3, el indicador «incertidumbre» alcanza el nivel 3 en el 40 % de los estudiantes del curso de laboratorio avanzado (meta 70 %). <b>Hipótesis:</b> la incertidumbre se enseña en un solo curso y se evalúa recién en séptimo semestre. <b>Acción:</b> incorporar tres informes con incertidumbre y retroalimentación en los laboratorios de segundo, tercer y cuarto semestre. <b>Responsable:</b> coordinador del área de laboratorios; <b>fecha:</b> dos periodos académicos. <b>Indicador de éxito:</b> subir a 60 % en la cohorte que cursa el laboratorio avanzado tras el cambio. <b>Verificación:</b> medir de nuevo con la misma rúbrica y concordancia entre evaluadores en el periodo siguiente a la implementación completa.</p></div>
<p>Observe que la acción es verificable: nadie puede decir «ya se hizo» sin mostrar los informes y los datos nuevos. Es el tipo de acción que los pares reconocen como evidencia de mejora.</p>
</section>

<section>
<h2>Un ciclo cuesta años: por qué se necesita paciencia</h2>
<p>Un cambio curricular que se aplica en segundo semestre solo se refleja en los resultados de la cohorte cuando llega a séptimo o noveno. Con el ritmo de un programa de diez semestres, un ciclo completo (medir, decidir, implementar, volver a medir) toma tres o cuatro años. Dos consecuencias prácticas:</p>
<ul>
<li><b>Trabaje en rotación.</b> Evalúe tres resultados por año; en tres años se cubren los nueve. Evaluar todo todos los años satura al programa y produce datos superficiales.</li>
<li><b>Use indicadores intermedios.</b> Lo que se hace en segundo semestre puede verificarse en los informes de ese curso sin esperar al trabajo de grado.</li>
</ul>
<p>La simulación siguiente ilustra la diferencia entre medir y mejorar: con el ciclo cerrado, cada ciclo cierra una fracción de la brecha; con el ciclo abierto, el logro solo fluctúa por azar. Mueva la eficacia y la variación entre cohortes para ver qué parte del movimiento es mejora y cuál es ruido.</p>

<section>
<h2>Lo que piden las normas sobre la mejora</h2>
<ul>
<li><b>Registro calificado</b> (Decreto 1075, art. 2.5.3.2.3.2.12, modificado por el Decreto 529 de 2024): la renovación exige evidenciar «el avance del programa a partir de la autorregulación, la autoevaluación y/o el diseño, aplicación y resultados de planes de mejoramiento en la última vigencia».</li>
<li><b>Acreditación</b> (Acuerdo 02 de 2020, característica 23; Acuerdo 01 de 2025, característica 20): evaluar periódicamente, en diferentes momentos del plan de estudios, el grado de logro y tomar acciones de ajuste.</li>
<li><b>Sistema interno de aseguramiento de la calidad:</b> el Acuerdo 01 de 2025 dedica un factor a «Aseguramiento de la alta calidad del programa»; la Universidad cuenta con procedimientos institucionales de acreditación y autoevaluación que el programa debe seguir.</li>
</ul>
<div class="box note"><h4>Un buen antecedente: el plan de mejoramiento anterior</h4><p>Según la presentación, el plan de mejoramiento de la acreditación anterior pasó de 23 a 38 actividades y se cumplió en un 95 %. Ese historial es una fortaleza: el programa sabe cumplir un plan. Lo que se pide ahora es cumplir un plan de otro tipo, uno cuyas acciones nacen de datos de logro y cuyo efecto se mide después.</p></div>
<div class="box warn"><h4>El plan que nadie mira</h4><p>Un error muy frecuente es un plan de mejoramiento extenso, redactado una vez para el informe, que no se vuelve a abrir. Los pares preguntan por el estado de las acciones: ¿cuáles están hechas? ¿cuáles no? ¿por qué? Un plan corto, vivo y con estado actualizado vale más que uno grande y estático.</p></div>
</section>

<section>
<h2>Para practicar</h2>
<ol class="problems">
<li><span class="lvl">Simulación</span> En la herramienta fije el logro inicial en 50 %, la meta en 80 % y la eficacia en 20 %. ¿Cuántos ciclos necesita para alcanzar la meta? ¿Qué le dice eso sobre la paciencia que requiere el proceso?
<details><summary>Qué mirar</summary><p>Con eficacia baja, la meta puede no alcanzarse en seis ciclos. Si cada ciclo dura tres años, el horizonte de decisión es largo: la planeación debe sostenerse más allá de una administración o una acreditación.</p></details></li>
<li><span class="lvl">Redacción</span> Escriba una acción completa (las siete partes) para el hallazgo «los egresados no se sienten preparados para presentar resultados en inglés».
<details><summary>Una posibilidad</summary><p>Hallazgo: en la encuesta a egresados, 55 % declara nivel insuficiente para presentaciones técnicas en inglés. Hipótesis: el inglés no se usa en las asignaturas de la línea. Acción: exigir un resumen y una presentación breve en inglés en tres asignaturas de séptimo a noveno. Responsable: coordinación y profesores de esas asignaturas; fecha: dos periodos. Indicador: 70 % en nivel 3 de la rúbrica de comunicación en segunda lengua. Verificación: medición con la misma rúbrica en el trabajo de grado de la cohorte siguiente.</p></details></li>
</ol>
