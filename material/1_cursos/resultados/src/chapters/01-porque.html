<p class="lead">Durante años, un programa se acreditaba mostrando que tenía lo necesario para formar bien: profesores con doctorado, laboratorios, bibliotecas, un plan de estudios coherente. Hoy se le pide además que muestre qué logran sus estudiantes y qué hace con esa información. La pregunta de los pares ya no es solo «¿qué ofrecen?» sino «¿cómo saben que funciona?». Este capítulo explica ese cambio y deja claro qué es lo que realmente se evalúa.</p>

<section>
<h2>Del «qué tengo» al «qué logran»</h2>
<p>El sistema colombiano de aseguramiento de la calidad nació evaluando <span class="term">capacidades y procesos</span>: infraestructura, profesores, currículo, gestión. Es lo que muestran los considerandos del Decreto 1330 de 2019, que reconocen que el sistema «se centra en la evaluación de capacidades y procesos» y proponen integrar los <span class="term">resultados académicos</span>, que incorporan los resultados de aprendizaje de los estudiantes. El Acuerdo CESU 02 de 2020 hizo lo mismo en acreditación: un factor completo sobre «aspectos académicos y resultados de aprendizaje», y el Acuerdo CESU 01 de 2025 lo reformula como «aspectos académicos y evaluación», hablando de «procesos y resultados académicos».</p>
<p>La razón es sencilla. Un programa puede tener excelentes profesores y laboratorios y aun así no saber si sus egresados saben medir con incertidumbre, diseñar un sistema o trabajar en equipo. Los resultados de aprendizaje son la manera de convertir esa pregunta en algo verificable.</p>
<div class="box def"><h4>Resultado de aprendizaje</h4><p>Declaración expresa de lo que se espera que un estudiante <b>conozca y demuestre</b> en el momento de completar su programa académico (Acuerdo CESU 02 de 2020, numeral 2.2; Decreto 1330 de 2019, considerandos). Se define para un programa específico y es el eje de un proceso de mejoramiento: se evalúa el grado en que los estudiantes lo alcanzan y, a partir de ello, se ajusta el currículo.</p></div>
<p>Dos palabras de esa definición merecen atención. <b>Demuestre</b>: no basta con «haber visto» un tema; tiene que existir un modo de mostrar que se logró. <b>Programa específico</b>: no son los resultados de la Universidad ni los de la Facultad. Los de Ingeniería Física deben describir a un ingeniero físico, no a un egresado genérico.</p>
</section>

<section>
<h2>Qué ven los pares en la visita</h2>
<p>Los pares trabajan con el informe de autoevaluación y con lo que ven y escuchan en tres o cuatro días: entrevistas con directivos, profesores, estudiantes, egresados y empleadores; revisión de documentos; visita a laboratorios. Sobre resultados de aprendizaje, buscan respuestas a cinco preguntas encadenadas:</p>
<ol class="chain">
<li><b>¿Están definidos?</b> Hay resultados del programa, claros, aprobados y públicos.</li>
<li><b>¿Se desarrollan?</b> Se sabe en qué asignaturas y experiencias se desarrolla cada uno, con una secuencia razonable.</li>
<li><b>¿Se evalúan?</b> Existen instrumentos y evidencias, no solo notas de asignatura.</li>
<li><b>¿Qué se encontró?</b> Hay datos de logro por resultado y por cohorte, comparados con metas.</li>
<li><b>¿Qué se hizo con eso?</b> Hay decisiones tomadas, con efecto verificado en el ciclo siguiente.</li>
</ol>
<p>La característica 23 del Acuerdo CESU 02 de 2020 resume el conjunto: el programa debe demostrar «un proceso de mejoramiento continuo, en el cual se evalúa, de manera periódica, y en diferentes momentos a lo largo del plan de estudios, el grado en que los estudiantes alcanzan los resultados de aprendizaje y, con base en dicha evaluación, se toman acciones de ajuste». Las palabras clave son <i>periódica</i>, <i>diferentes momentos</i>, <i>grado</i> y <i>acciones de ajuste</i>.</p>
<div class="sim" data-sim="ciclo-mejora" data-title="El ciclo completo, paso a paso"></div>
</section>

<section>
<h2>Los tres errores que más se ven</h2>
<ul>
<li><b>Tener resultados sin evidencias.</b> Un documento bien redactado que nadie usa. Los pares piden ver un trabajo de estudiante evaluado con esos resultados; si no existe, el documento no cuenta.</li>
<li><b>Medir sin actuar.</b> Hay datos, hay incluso informes, pero ninguna decisión se deriva de ellos. Es el «ciclo abierto» del diagrama anterior, y es lo que más se reprocha.</li>
<li><b>Confundir el resultado con la nota.</b> Una nota de 3,8 en Óptica no dice qué parte del resultado «diseña y valida sistemas ópticos» se logró. Las notas mezclan asistencia, tareas, exámenes y esfuerzo. Para evaluar resultados hace falta mirar criterios específicos.</li>
</ul>
<div class="box warn"><h4>Una trampa de lenguaje</h4><p>«Competencias», «objetivos», «resultados de aprendizaje», «logros» y «perfil» se usan a veces como sinónimos. No lo son, y mezclarlos es la causa de muchos documentos confusos. El capítulo 4 los separa uno por uno.</p></div>
</section>

<section>
<h2>Por qué le conviene al programa, más allá de la visita</h2>
<p>Hay motivos prácticos. La acreditación en alta calidad ordena de oficio la renovación del registro calificado: por siete años, o por el tiempo de la acreditación si es mayor (Decreto 1075 de 2015, art. 2.5.3.2.9.2, modificado por el Decreto 529 de 2024). Para la renovación del registro, el programa debe evidenciar «el avance del programa a partir de la autorregulación, la autoevaluación y/o el diseño, aplicación y resultados de planes de mejoramiento» (art. 2.5.3.2.3.2.12). Es decir, un programa que ya mide y mejora sus resultados tiene los documentos para ambos trámites.</p>
<p>Y hay un motivo más importante: es la forma de saber si lo que se hace en el aula produce lo que se promete en el perfil de egreso. Un programa de Ingeniería Física promete un profesional con «formación en procesos de investigación y desarrollo» capaz de «detectar, planear y resolver problemas». Los resultados de aprendizaje son la vara con la que se comprueba esa promesa.</p>
</section>

<section>
<h2>Para practicar</h2>
<ol class="problems">
<li><span class="lvl">Reflexión</span> Escriba, sin mirar documentos, tres cosas que sus egresados deberían ser capaces de hacer y que usted pueda <i>observar</i>. Compárelas luego con las que aparecen en los documentos oficiales del programa. ¿Coinciden?
<details><summary>Qué mirar</summary><p>Si lo que escribió coincide solo parcialmente con el documento, esa diferencia ya es un hallazgo: sugiere que el programa no tiene una versión compartida de lo que promete. Anótela; será útil en el capítulo 8.</p></details></li>
<li><span class="lvl">Análisis</span> En el diagrama del ciclo, ¿en qué paso cree que está hoy su programa? ¿Cuál es el primero que no podría demostrar con documentos?
<details><summary>Qué mirar</summary><p>Casi todos los programas tienen mejor preparados los primeros pasos (definir, alinear) que los últimos (analizar, actuar). Use esa respuesta para orientar el autodiagnóstico del capítulo 15.</p></details></li>
</ol>
