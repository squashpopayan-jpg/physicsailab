<p class="lead">El viernes 8 de noviembre de 1895, en el laboratorio del Instituto de Física de Würzburg, Wilhelm Röntgen oscureció el cuarto, cubrió con cartón negro un tubo de Crookes y vio que una pantalla de platinocianuro de bario, a un metro, brillaba. El cartón era opaco para la luz. Durante siete semanas no habló con nadie: se quedó a dormir en el laboratorio y estudió la nueva radiación con una obstinación casi maníaca. Antes de Navidad fotografió la mano de su mujer, con el anillo y los huesos. En enero de 1896 la imagen dio la vuelta al mundo. En dieciocho años, entre el tubo de Crookes y el experimento de la lámina de oro, la física pasó del átomo indivisible de Dalton a un núcleo diminuto rodeado de electrones.</p>

<section>
<h2>Un fin de siglo que se creía terminado</h2>
<div class="box contexto"><h4>«Solo queda añadir decimales»</h4><p>La frase suele atribuirse a Kelvin o a Michelson (1894: «las leyes fundamentales están firmemente establecidas»), aunque las versiones varían y Kelvin habló en 1900 de «dos nubes» en el horizonte: el éter (capítulo 23) y la radiación del cuerpo negro (capítulo 25). La imagen de una física acabada es una exageración retrospectiva; en 1895 había químicos que dudaban de los átomos (Ostwald, Mach; capítulo 18), físicos que los daban por reales y una industria nueva de tubos de vacío (Geissler, Crookes, Hittorf, Lenard) con la que se producían los «rayos catódicos», sobre cuya naturaleza había una disputa nacional: los alemanes (Hertz, Lenard) los veían como ondas del éter y los ingleses (Crookes, Thomson) como partículas con carga negativa.</p></div>
<div class="people">
<div class="persona"><b>Wilhelm Conrad Röntgen</b><small>1845 – 1923 · Lennep, Würzburg, Múnich</small><p>Experimentador meticuloso y reservado, hijo de un comerciante textil. No patentó los rayos X ni quiso un título nobiliario con «von»; donó el dinero del primer Nobel de Física (1901).</p></div>
<div class="persona"><b>Henri Becquerel</b><small>1852 – 1908 · París</small><p>Tercera generación de una dinastía de físicos del Museo de Historia Natural; su familia estudiaba la fosforescencia desde 1830.</p></div>
<div class="persona"><b>Marie Skłodowska-Curie</b><small>1867 – 1934 · Varsovia, París</small><p>Estudió en la Sorbona y se doctoró con una tesis sobre la radiactividad. Única persona con dos premios Nobel en dos ciencias (Física 1903, Química 1911). Sufrió la xenofobia y el escándalo de prensa de 1911.</p></div>
<div class="persona"><b>Pierre Curie</b><small>1859 – 1906 · París</small><p>Físico de cristales y magnetismo. Murió atropellado por un carro de caballos en una calle lluviosa de París.</p></div>
<div class="persona"><b>Joseph John Thomson</b><small>1856 – 1940 · Cambridge</small><p>Director del Cavendish desde 1884, con 28 años; maestro de siete futuros premios Nobel.</p></div>
<div class="persona"><b>Ernest Rutherford</b><small>1871 – 1937 · Montreal, Mánchester, Cambridge</small><p>Hijo de un granjero neozelandés, becario del imperio. De voz fuerte y genio práctico; llamó «la mejor ciencia, poner sellos» a lo teórico y a lo que no se medía.</p></div>
<div class="persona"><b>Frederick Soddy</b><small>1877 – 1956 · Montreal, Glasgow, Oxford</small><p>Químico que colaboró con Rutherford en McGill (1901-1903) y propuso el nombre «isótopo».</p></div>
<div class="persona"><b>Robert Millikan y Felix Ehrenhaft</b><small>1868–1953 · 1879–1952</small><p>Dos experimentadores con la misma técnica y conclusiones opuestas sobre la carga mínima.</p></div>
</div>

<section>
<h2>Rayos X y radiactividad</h2>
<ol class="chain">
<li><b class="y">8 nov 1895 <span>· Röntgen</span></b><p>El mismo tubo de Crookes que Lenard había usado antes con una ventana de aluminio emitía algo más que rayos catódicos. Röntgen lo llamó «X» (incógnita), y el nombre quedó. Descubrió que atraviesan papel, madera y carne, pero no los huesos ni el plomo, que no se desvían con un imán, que ionizan el aire y que no se refractan ni se reflejan como la luz visible. En 1912 Laue demostrará que son ondas electromagnéticas de longitud de onda muy corta (capítulo 25).</p></li>
<li><b class="y">20 ene 1896 <span>· Poincaré y Becquerel</span></b><p>Poincaré mostró a la Academia las fotografías de Röntgen y preguntó si la fluorescencia del vidrio del tubo era el origen de los rayos. Becquerel, experto en fosforescencia, probó con sales de uranio expuestas al Sol sobre placas envueltas en papel negro. Obtuvo imágenes. Con Sol, sin Sol: las placas se impresionaban también en el cajón. La radiación del uranio no dependía de la excitación externa.</p></li>
<li><b class="y">1898 <span>· Los Curie</span></b><p>Marie Curie midió con un electrómetro la ionización del aire debida a los minerales de uranio y encontró que la pechblenda era más activa que el uranio que contenía: debía haber otro elemento. Junto con Pierre, procesó toneladas del residuo de las minas de Joachimsthal en un cobertizo con goteras. En julio anunciaron el polonio (por Polonia) y en diciembre el radio. Marie acuñó la palabra «radiactividad».</p></li>
<li><b class="y">1902-1903 <span>· Rutherford y Soddy</span></b><p>En McGill (Montreal) Rutherford y Soddy separaron del torio un gas radiactivo («emanación») y midieron cómo decaían ambos: la actividad del gas se reducía a la mitad cada 54.5 s, y el torio X recuperaba su actividad. Concluyeron que la radiactividad es la <em>transmutación espontánea</em> de un elemento en otro. Soddy dijo: «¡Rutherford, esto es transmutación!», y Rutherford respondió: «Por Dios, Soddy, no le llame transmutación; nos cortarán la cabeza como alquimistas».</p></li>
</ol>
<div class="eq key" data-name="Ley de desintegración y cadena de dos pasos">\[N(t)=N_0\,2^{-t/T_{1/2}},\qquad N_2(t)=N_0\frac{\lambda_1}{\lambda_2-\lambda_1}\left(e^{-\lambda_1t}-e^{-\lambda_2t}\right).\]</div>
<div class="sim" data-sim="decaimiento-cadena" data-title="La cadena radiactiva de Rutherford y Soddy"></div>
<div class="sim-guide"><ul>
<li>Con el hijo mucho más breve que el padre (cociente pequeño), el hijo llega a un máximo temprano y sigue al padre con \(N_2/N_1=\lambda_1/(\lambda_2-\lambda_1)\): el <em>equilibrio secular</em>. Es la razón por la que el radio se encuentra siempre con el uranio.</li>
<li>Active la escala logarítmica: el padre es una recta (decaimiento exponencial) y el hijo se une a ella. Rutherford usó esa recta para medir vidas medias.</li>
</ul></div>
<div class="box leyenda"><h4>El día nublado de Becquerel</h4><p>La versión de libro de texto es que Becquerel dejó las placas con uranio en un cajón porque París estaba nublado el 26 y 27 de febrero de 1896 y, cuando las reveló por si acaso, vio imágenes intensas. Es posible que sea cierto en lo esencial, pero está mal documentado: el propio Becquerel dijo que las reveló el 1 de marzo y la meteorología de esos días no fue totalmente nublada. Lo importante es el paso epistemológico: Becquerel buscaba la relación entre fosforescencia y rayos X, y lo que vio no encajaba en su hipótesis. Aceptó el resultado contrario a su idea y exploró: el uranio metálico, sin fosforescencia, daba la misma radiación. La serendipia favorece, como decía Pasteur, solo a «los espíritus preparados».</p></div>
<div class="box rivalidad"><h4>Una mujer, un tribunal y un escándalo</h4><p>Marie Curie fue en 1911 candidata a la Academia de Ciencias francesa y perdió por dos votos frente a Édouard Branly (inventor del cohesor), en una campaña con insultos xenófobos y misóginos. Ese mismo año, la prensa publicó cartas de su relación con el físico Paul Langevin, casado y separado. El comité Nobel le pidió que no fuera a Estocolmo, y ella fue igualmente a recoger el Nobel de Química. Los dos premios, y que el primero estuvo a punto de no incluirla (la propuesta de la Academia mencionaba solo a Becquerel y Pierre, hasta que Mittag-Leffler avisó a Pierre), ilustran los obstáculos de género que reaparecen en el capítulo 35.</p></div>
</section>

<section>
<h2>El electrón</h2>
<ol class="chain">
<li><b class="y">1890-1896 <span>· Dos escuelas</span></b><p>Los rayos catódicos se desviaban con un imán y eran negativos (Perrin, 1895); pero no se desviaban con un campo eléctrico (Hertz, 1892), lo que se interpretó como ondas. Lenard los hizo salir del tubo con una ventana fina y no veía desviaciones eléctricas.</p></li>
<li><b class="y">1897 <span>· Thomson y los campos cruzados</span></b><p>Thomson vació mejor el tubo (el gas residual apantallaba el campo) y vio la desviación eléctrica. Con un campo magnético y uno eléctrico cruzados midió \(e/m\) y la velocidad de los rayos. Obtuvo 1.7×10¹¹ C/kg (hoy, 1.759×10¹¹), unas 1000 veces la del ion hidrógeno. Lo llamó «corpúsculo». Hizo tres suposiciones: que son partículas, que esa relación es universal y que son constituyentes de todos los átomos. La tercera fue la más audaz, porque contradecía la indivisibilidad del átomo.</p></li>
<li><b class="y">1899-1913 <span>· Medir e</span></b><p>Thomson y su alumno H. A. Wilson midieron la carga con gotitas de niebla (1899-1903). Millikan y Fletcher mejoraron en Chicago el método con gotas de <em>aceite</em>, que no se evaporan: una gota se observa varias horas, se carga con rayos X y se sigue su caída (con el campo apagado) y su subida (con el campo encendido). De dos velocidades, con la ley de Stokes, se obtiene la carga.</p></li>
</ol>
<div class="sim" data-sim="thomson-cruzados" data-title="Los campos cruzados de Thomson"></div>
<div class="sim-guide"><ul>
<li>Con \(B=0\) el punto de la pantalla está muy desviado por el campo eléctrico. Aumente \(B\) hasta que el punto vuelva a cero: ese \(B=E/v\) da la velocidad. Cambie la tensión de aceleración y compruebe que \(e/m\) deducida no cambia: la relación carga/masa es una propiedad de la partícula, no del montaje.</li>
</ul></div>
<div class="sim" data-sim="millikan-gotas" data-title="Las gotas de Millikan: la carga está cuantizada"></div>
<div class="sim-guide"><ul>
<li>Con 60 gotas y 0.8 % de error se ven los niveles horizontales de las cargas de 1, 2, 3, … electrones. Con 10 gotas o 4 % de error la discretización se pierde y \(e\) queda mal determinada: por eso Millikan necesitó selección y paciencia.</li>
</ul></div>
<div class="box epist"><h4>Los cuadernos de Millikan</h4><p>Holton (1978) estudió los cuadernos de Millikan y halló que de 140 gotas del experimento de 1913 se publicaron 58 y que se anotaban comentarios como «error» o «muy bueno». Millikan declaró en el artículo que publicaba todas las gotas medidas y que no hubo selección; en realidad eligió las gotas en las que la medida era fiable (volumen estable, sin convección). Franklin (1981) mostró que incluir todas las gotas habría dado casi el mismo valor de \(e\) con más error, y que los criterios eran físicamente razonables, aunque la declaración fue engañosa. Lo que Millikan «descartó» eran gotas que no pasaban un control de calidad que hoy aceptaríamos. Hay una lección sobre la distinción entre <em>seleccionar con criterio previo</em> y <em>seleccionar con el resultado a la vista</em>, y sobre la honestidad del informe. Además, su valor de \(e\) fue un 0.6 % bajo por usar un valor erróneo de la viscosidad del aire; los valores posteriores se acercaron de a poco (Feynman: los experimentadores posteriores tardaron en alejarse de Millikan, porque descartaban resultados distintos).</p></div>
<div class="box rivalidad"><h4>Ehrenhaft y los «subelectrones»</h4><p>Felix Ehrenhaft, en Viena, repitió el método con partículas metálicas y creyó medir cargas inferiores a \(e\). La disputa (1910-1925) fue áspera: Millikan lo acusó de errores en el tamaño de las partículas y de la convección; Ehrenhaft creyó en los subelectrones hasta su muerte, y luego defendió ideas heterodoxas. Los argumentos de Millikan eran correctos (las partículas metálicas no son esferas y su densidad era desconocida). La discusión muestra cómo se decide que un resultado es un artefacto: no con un experimento, sino con la combinación de datos, teoría de los errores y confianza en la comunidad.</p></div>
</section>

<section>
<h2>El átomo con núcleo</h2>
<ol class="chain">
<li><b class="y">1903-1904 <span>· Pudín y saturno</span></b><p>Thomson imaginó el átomo como una esfera uniforme de carga positiva con electrones incrustados (como pasas en un pudín), estable por equilibrio entre repulsión y atracción. Nagaoka, en Japón, propuso el modelo saturniano: un centro pesado y anillos de electrones. Kelvin y Thomson defendieron el primero.</p></li>
<li><b class="y">1909 <span>· Geiger y Marsden</span></b><p>Rutherford encargó a Geiger y a un estudiante de pregrado, Ernest Marsden, que buscaran partículas α desviadas por una lámina de oro con ángulos grandes, «por si acaso». Marsden las halló: una de cada 8000 rebotaba hacia atrás. Rutherford dijo después que era «lo más increíble que me ha pasado en la vida».</p></li>
<li><b class="y">1911 <span>· El átomo nuclear</span></b><p>Rutherford resolvió la dispersión de Coulomb y mostró que cada α es desviada por un centro de carga \(Ze\) concentrado en menos de 10⁻¹⁴ m. Predijo la distribución angular \(1/\sen^4(\theta/2)\), la dependencia con \(Z^2\) y con \(1/E^2\). Geiger y Marsden las confirmaron en 1913. Pero su átomo era inestable según Maxwell: un electrón en órbita debía irradiar y caer en el núcleo. Bohr resolverá esto en 1913 (capítulo 28).</p></li>
</ol>
<div class="eq key" data-name="Dispersión de Rutherford">\[\tan\frac\theta2=\frac{d}{2b},\qquad d=\frac{Z_1Z_2e^2}{4\pi\varepsilon_0E},\qquad \frac{d\sigma}{d\Omega}=\left(\frac d4\right)^2\frac1{\sen^4(\theta/2)} .\]</div>
<div class="sim" data-sim="rutherford-nucleo" data-title="Las partículas α y el núcleo de oro"></div>
<div class="sim-guide"><ul>
<li>Las trayectorias son ramas de hipérbola. Con 5.3 MeV y oro, el máximo acercamiento es 43 fm; el núcleo tiene 7 fm: nunca penetra. Baje \(Z\) o suba la energía y verá cómo disminuye la deflexión; la línea del pudín está siempre por debajo de 0.02°.</li>
<li>La fracción desviada más de 90° en una lámina de 0.4 µm es de unas 3×10⁻⁵: del orden de lo que midieron Geiger y Marsden.</li>
</ul></div>
<div class="box epist"><h4>Qué prueba el experimento de la lámina</h4><p>El experimento excluyó el modelo del pudín (una predicción cualitativa muy fuerte: ningún rebote), pero no determinó «cómo es» el átomo. Rutherford construyó su modelo con una hipótesis auxiliar (fuerza de Coulomb hasta distancias de 10⁻¹⁴ m) que nadie había comprobado y que pasó la prueba con la ley \(1/\sen^4\). La comprobación de 1913 es un caso de lo que Hacking llama <em>intervenir</em>: la creencia en el núcleo se apoyó no solo en el modelo sino en que se podía manejar (disparar α contra distintos blancos y obtener \(Z^2\)). Y como ocurre a menudo, el modelo ganador era incompleto: contradecía la estabilidad de los átomos, y el problema abrió la puerta a la cuántica.</p></div>
<div class="box leyenda"><h4>Un proyectil de quince pulgadas contra papel de seda</h4><p>La frase de Rutherford («era como disparar un proyectil de quince pulgadas contra un pedazo de papel de seda y que el proyectil volviera y te diera») es de 1936, 25 años después, y se repite con variaciones. Que Rutherford quedara muy sorprendido es cierto, aunque los hechos son menos teatrales: tardó casi dos años en dar con la interpretación, y su artículo de 1911 trataba el resultado como un problema de dispersión múltiple frente a simple. Hasta 1913 el modelo no se consideró establecido.</p></div>
</section>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una muestra tiene \(N_0\) átomos de radio-226 (vida media 1600 años). ¿Qué fracción queda al cabo de 4800 años?
<details><summary>Respuesta</summary><p>Tres vidas medias: \(2^{-3}=1/8\).</p></details></li>
<li><span class="lvl">Básico</span>Los rayos catódicos de Thomson tienen \(e/m=1.76\times10^{11}\) C/kg y el ion H⁺ \(9.6\times10^7\) C/kg. ¿Cuántas veces es más ligero el electrón, si la carga es la misma?
<details><summary>Respuesta</summary><p>\(1.76\times10^{11}/9.6\times10^7=1833\): casi exacto el 1/1836 actual.</p></details></li>
<li><span class="lvl">Intermedio</span>Con \(E=3\times10^4\) V/m y \(B=0.5\) mT se anula la desviación. ¿Cuál es la velocidad de los electrones y su energía?
<details><summary>Respuesta</summary><p>\(v=E/B=6\times10^7\) m/s (0.2 c); \(K=\tfrac12mv^2=1.64\times10^{-15}\) J = 10.2 keV.</p></details></li>
<li><span class="lvl">Intermedio</span>Una α de 5.3 MeV incide de frente sobre un núcleo de oro (\(Z=79\)). ¿A qué distancia se detiene?
<details><summary>Respuesta</summary><p>\(d=Z_1Z_2e^2/(4\pi\varepsilon_0E)=2\cdot79\cdot1.44\,\text{MeV·fm}/5.3\,\text{MeV}=43\) fm.</p></details></li>
<li><span class="lvl">Avanzado</span>Muestre con la fórmula de Rutherford que, al reducir la energía a la mitad, la sección eficaz a un ángulo fijo se cuadruplica. ¿Qué predice para el número de rebotes a 90° con α de 2.65 MeV frente a 5.3 MeV?
<details><summary>Respuesta</summary><p>\(d\sigma/d\Omega\propto d^2\propto1/E^2\): al dividir \(E\) por 2 el factor es 4. Así que se espera cuatro veces más cuentas a la misma geometría, hasta que \(E\) es tan bajo que la α no se acerca al núcleo.</p></details></li>
<li><span class="lvl">Avanzado</span>La selección de datos de Millikan: ¿cuándo es legítima y cuándo es un sesgo? Proponga un criterio.
<details><summary>Respuesta</summary><p>Es legítima si el criterio se fija antes y sin mirar el valor de \(e\) que resulta (volumen de la gota, estabilidad de la velocidad, estadística de las medidas) y se informa. Es sesgo si se descarta lo que se aleja del valor esperado. La solución moderna es el <em>análisis ciego</em> y la publicación de todos los datos.</p></details></li>
</ol>
