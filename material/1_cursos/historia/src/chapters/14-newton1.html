<p class="lead">En enero de 1684, en una taberna de Londres, tres miembros de la Royal Society (Robert Hooke, Christopher Wren y Edmond Halley) discutían si la fuerza que mantiene a los planetas en sus órbitas, si disminuía con el cuadrado de la distancia, producía las elipses de Kepler. Hooke dijo que lo había demostrado pero que no lo mostraría todavía; Wren ofreció un libro de cuarenta chelines a quien lo probara en dos meses. Nadie lo logró. En agosto Halley viajó a Cambridge a visitar a un profesor reservado que no publicaba casi nada. «¿Qué curva describirían los planetas si la atracción fuera inversa al cuadrado?» «Una elipse», respondió Newton. «Ya lo calculé.» No encontró el papel. Tres meses después, le mandó nueve páginas. Con esa excusa nacieron los <em>Principia</em>.</p>

<section>
<h2>Un niño huérfano de padre, una guerra civil, una peste</h2>
<div class="box contexto"><h4>Inglaterra en la época de Newton</h4><p>Isaac Newton nació el 25 de diciembre de 1642 (según el calendario juliano vigente en Inglaterra: el 4 de enero de 1643 en el gregoriano), tres meses después de la muerte de su padre, un granjero analfabeto, en Woolsthorpe, Lincolnshire. Era el año de la guerra civil que enfrentó al rey Carlos I con el Parlamento; Carlos fue ejecutado en 1649. A los tres años su madre se casó con un clérigo, Barnabas Smith, y lo dejó al cuidado de la abuela: un abandono que se ha considerado la raíz de su carácter. Pasó por la escuela de Grantham, vivió en casa de un boticario (donde leyó libros de química) y en 1661 entró en el Trinity College de Cambridge como sizar, un estudiante pobre que servía a los demás. Cuando estalló la peste de 1665, la universidad cerró y Newton regresó a Woolsthorpe; en dos años elaboró el cálculo de fluxiones, el teorema del binomio, la composición de la luz blanca y los primeros cálculos de la gravitación: su <em>annus mirabilis</em> (aunque fueron dos años, 1665-1666, y no todo ocurrió allí).</p></div>
<div class="people">
<div class="persona"><b>Isaac Newton</b><small>1642 – 1727 · Woolsthorpe, Cambridge, Londres</small><p>Profesor lucasiano (1669-1701), presidente de la Royal Society (1703-1727), director de la Casa de la Moneda (1699-1727), caballero (1705). Secreto, irascible y de una capacidad de concentración legendaria. Soltero toda la vida.</p></div>
<div class="persona"><b>Isaac Barrow</b><small>1630 – 1677 · Cambridge</small><p>Primer profesor lucasiano. Reconoció el talento de Newton, le cedió la cátedra en 1669 y le abrió las puertas de la matemática.</p></div>
<div class="persona"><b>Edmond Halley</b><small>1656 – 1742 · Londres, Oxford</small><p>Astrónomo, matemático, navegante, empresario. Dibujó el cielo austral desde Santa Elena (1677), financió y editó los <em>Principia</em>, y predijo el regreso del cometa de 1682 (capítulo 16).</p></div>
<div class="persona"><b>John Flamsteed</b><small>1646 – 1719 · Greenwich</small><p>Primer astrónomo real. Observador meticuloso, proporcionó a Newton los datos de la Luna y de los cometas y fue su víctima en una larga disputa por la publicación de su catálogo.</p></div>
<div class="persona"><b>Gottfried Wilhelm Leibniz</b><small>1646 – 1716 · Leipzig, Hanóver</small><p>Filósofo, matemático, diplomático y bibliotecario. Creó el cálculo diferencial e integral de modo independiente, con la notación que hoy usamos (capítulo 16).</p></div>
<div class="persona"><b>Roger Cotes</b><small>1682 – 1716 · Cambridge</small><p>Joven profesor, editor de la segunda edición de los <em>Principia</em> (1713). Newton dijo de su muerte temprana: «si hubiera vivido, habríamos sabido algo».</p></div>
<div class="persona"><b>Jean Picard</b><small>1620 – 1682 · París</small><p>Astrónomo de la Académie. Midió un grado del meridiano en 1669-1670 con un cuadrante y una cadena de triángulos: 111.2 km. Su cifra permitió a Newton verificar la gravitación.</p></div>
</div>
</section>

<section>
<h2>La prueba de la Luna</h2>
<p>El problema de fondo era: si la Luna da vueltas alrededor de la Tierra y los cuerpos caen, ¿es la misma fuerza? La idea de Newton, en su <em>annus mirabilis</em>, fue unir dos resultados: la fórmula de Huygens para la aceleración centrípeta de un cuerpo en movimiento circular (\(a=v^2/r=4\pi^2r/T^2\), capítulo 13) y la tercera ley de Kepler (capítulo 10).</p>
<ol class="chain">
<li><b class="y">Paso 1 <span>· de Kepler a la fuerza</span></b><p>Con órbitas circulares, \(T^2=kr^3\), de modo que la aceleración requerida es \(a=4\pi^2r/T^2=4\pi^2/(k\,r^2)\): <em>inversa al cuadrado de la distancia</em>. Es casi inmediato, y otros (Hooke, Wren, Halley) lo vieron hacia 1670-1680.</p></li>
<li><b class="y">Paso 2 <span>· ¿es la misma fuerza que hace caer la manzana?</span></b><p>La Luna está a unos 60 radios terrestres. Si la gravedad terrestre decrece como \(1/r^2\), a esa distancia vale \(g/60^2=g/3600\). Basta compararlo con la aceleración centrípeta observada de la Luna, \(4\pi^2r/T^2\).</p></li>
<li><b class="y">Paso 3 <span>· el dato clave: el radio de la Tierra</span></b><p>Newton necesitaba el tamaño de la Tierra. Usó el valor de los marineros ingleses, 60 millas por grado, que es incorrecto (69.5), de modo que obtuvo un radio 13 % demasiado pequeño y un desacuerdo de un sexto. Guardó el cálculo.</p></li>
<li><b class="y">Paso 4 <span>· la corrección</span></b><p>Alrededor de 1682-1684 conoció la medida de Picard (1669-1670), con un grado de 57 060 toesas: el desacuerdo desapareció. Con la ley confirmada con la Luna, escribió los <em>Principia</em>.</p></li>
</ol>
<div class="sim" data-sim="prueba-luna" data-title="La prueba de la Luna: la manzana y el cielo"></div>
<div class="sim-guide"><ul>
<li>Con el radio terrestre de los marineros, la aceleración observada de la Luna es 0.86 veces la prevista por la ley \(1/r^2\); con el de Picard (y con el moderno) el cociente es 1.008: coincidencia dentro del 1 %. Un error en una constante auxiliar (el radio de la Tierra) basta para que una teoría correcta parezca refutada.</li>
<li>Es un ejemplo del problema de Duhem (capítulo 1): Newton podía abandonar la ley o dudar de la medición de la Tierra. Hizo esto último, y tuvo razón; pero cuando una teoría ya vale la pena, el «error está en otra parte» puede ser una estrategia razonable o una excusa.</li>
</ul></div>
<div class="box leyenda"><h4>Qué sabemos de la manzana y de los dos años</h4><p>Todos los relatos de la manzana, del «año milagroso» y de la prueba de la Luna en 1666 proceden de recuerdos de Newton ya anciano (1714-1727), anotados por Conduitt, Stukeley, Pemberton y De Moivre, y no concuerdan en los detalles. Historiadores como Richard Westfall (<em>Never at Rest</em>, 1980) creen que Newton situó retrospectivamente en 1666 ideas que maduraron entre 1679 y 1685, y que el relato del joven genio solitario en el campo sirvió para sostener su prioridad frente a Hooke y Leibniz. Los manuscritos que se conservan de 1665-1666 sí muestran el cálculo, la óptica y una primera estimación de la «fuerza de la Luna».</p></div>
</section>

<section>
<h2>Hooke, Wren, Halley y la pregunta de 1684</h2>
<div class="box rivalidad"><h4>La carta de Hooke y el silencio de Newton</h4><p>En noviembre de 1679 Hooke, nuevo secretario de la Royal Society, escribió a Newton para reconciliarse (habían discutido sobre la luz, capítulo 15) y le preguntó por la trayectoria de un cuerpo bajo una atracción inversa al cuadrado. Newton, que se había retirado de la discusión pública, respondió con un error: dibujó una espiral hasta el centro. Hooke le corrigió con cortesía: la curva, sin resistencia, era «una especie de elipsoide» (una órbita cerrada), y le dio la ley del inverso del cuadrado. Newton no contestó. Años después, al saber de los <em>Principia</em>, Hooke exigió un reconocimiento. Newton escribió a Halley con furia que Hooke había aportado «nada» y amenazó con suprimir el libro III. Halley, con diplomacia, lo convenció de que no. Newton suprimió algunas de las referencias a Hooke que figuraban en el manuscrito. La enemistad duró hasta la muerte de Hooke (1703); Newton publicó <em>Opticks</em> al año siguiente.</p><p>En una carta de 1676 a Hooke, Newton había escrito: «si he visto más lejos es porque estaba sobre los hombros de gigantes». La frase venía de Bernardo de Chartres (siglo XII) y se ha leído como cortesía, y también como una pulla velada a Hooke, de baja estatura y encorvado.</p></div>
<p>Halley, pagando de su bolsillo (la Royal Society acababa de arruinarse con una <em>Historia de los peces</em> de Willughby que nadie compró), se encargó de la edición. Newton escribió el libro en dieciocho meses, de 1685 a 1686, y se sabe que casi no dormía ni comía. La obra se presentó a la Royal Society en abril de 1686 y salió en julio de 1687, con la licencia de su presidente, Samuel Pepys.</p>
</section>

<section>
<h2>Qué dicen los Principia</h2>
<p>Los <em>Principia</em> están escritos como los <em>Elementos</em> de Euclides: definiciones, axiomas, proposiciones, demostraciones geométricas. Newton había usado el cálculo para descubrir los resultados, pero los presentó con geometría sintética, probablemente para que fueran aceptados por los matemáticos de su tiempo. Estructura:</p>
<ul>
<li><b>Definiciones:</b> cantidad de materia (<em>masa</em>, definida como «densidad por volumen»), cantidad de movimiento, fuerza impresa, fuerza centrípeta. Un escolio fija el <em>espacio absoluto</em> y el <em>tiempo absoluto</em>, y el experimento del cubo de agua que gira.</li>
<li><b>Axiomas o leyes del movimiento:</b> (1) todo cuerpo persevera en su estado de reposo o de movimiento rectilíneo uniforme, salvo que una fuerza lo cambie; (2) el cambio de movimiento es proporcional a la fuerza impresa y ocurre en la dirección de ésta; (3) a toda acción hay siempre una reacción contraria e igual.</li>
<li><b>Libro I:</b> movimiento de cuerpos bajo fuerzas centrales en el vacío. Proposición 1: el área barrida es proporcional al tiempo si y solo si la fuerza es central (la segunda ley de Kepler, con una demostración geométrica de una elegancia incomparable). Proposición 11: si la órbita es una elipse y la fuerza se dirige a un foco, la fuerza es inversa al cuadrado. Proposiciones 70-71: una esfera uniforme atrae como si su masa estuviera en el centro.</li>
<li><b>Libro II:</b> movimiento en medios resistentes; refuta los vórtices de Descartes (un torbellino no puede producir las órbitas de Kepler).</li>
<li><b>Libro III:</b> <em>El sistema del mundo</em>. Aplica la ley a los planetas, las lunas, los cometas, las mareas, la forma de la Tierra (achatada en los polos) y la precesión de los equinoccios.</li>
</ul>
<div class="eq key" data-name="Segunda ley y gravitación universal">\[\frac{\dd(m\vb v)}{\dd t}=\vb F,\qquad F=G\,\frac{m_1m_2}{r^2}.\]</div>
<div class="box epist"><h4>Lo que Newton no escribió</h4><p>La forma \(\vb F=m\vb a\) no aparece en los <em>Principia</em>; Newton habla del «cambio de movimiento» (cantidad de movimiento); la formulación diferencial con vectores y masa constante es de Euler (1750). Tampoco aparece la constante \(G\): la ley está escrita como proporcionalidades. La constante, y por tanto la masa de la Tierra, se obtendrá con el experimento de Cavendish (1798, capítulo 16). Los libros de texto atribuyen a Newton fórmulas que se pulieron en los siglos XVIII y XIX: es una lección sobre cómo se escribe el pasado desde el presente.</p></div>
<div class="sim" data-sim="orbita-newton" data-title="Órbitas bajo fuerzas centrales: por qué el inverso del cuadrado"></div>
<div class="sim-guide"><ul>
<li>Con \(n=2\) la órbita es una elipse cerrada para cualquier velocidad inicial (menor que la de escape): se superpone consigo misma. Con \(n=2.1\) el perihelio avanza con cada vuelta. Con \(n=1.9\), retrocede. El momento angular se conserva en todos los casos: la ley de las áreas.</li>
<li>La precisión de la astronomía hacia 1700 (Mercurio y la Luna con un perihelio que avanzaba) mostraba que la ley del cuadrado era exacta a pocas partes por mil. Pero el perihelio de Mercurio avanza 43″ por siglo más de lo previsto (capítulo 27).</li>
</ul></div>
<div class="sim" data-sim="canon-newton" data-title="El cañón de Newton: caer es orbitar"></div>
<div class="sim-guide"><ul>
<li>Con una montaña de 100 km (muy exagerada, como en el dibujo de Newton) y velocidad menor que la circular el proyectil cae; con 7.85 km/s da una vuelta casi circular; con 9 km/s es una elipse alargada; con más de 11.1 km/s se escapa.</li>
<li>La Luna es un proyectil que lleva cuatro siglos «cayendo» alrededor de la Tierra sin llegar al suelo; los satélites artificiales (1957) lo hacen por sí mismos.</li>
</ul></div>
</section>

<section>
<h2>Reglas del razonar y «no invento hipótesis»</h2>
<p>El libro III empieza con cuatro <em>Reglas para razonar en filosofía</em>:</p>
<ol>
<li>No admitir más causas que las verdaderas y suficientes para explicar los fenómenos (un principio de economía).</li>
<li>A los mismos efectos naturales hay que asignar, hasta donde sea posible, las mismas causas (la piedra que cae en Europa y en América; la luz del fuego y la del Sol).</li>
<li>Las cualidades de los cuerpos que no pueden aumentar ni disminuir, y que se encuentran en todos los cuerpos que podemos experimentar, se consideran cualidades de todos los cuerpos (universalización por inducción: extensión, dureza, impenetrabilidad, inercia, gravedad).</li>
<li>En la filosofía experimental, las proposiciones deducidas por inducción de los fenómenos se consideran verdaderas, o muy aproximadamente verdaderas, a pesar de las hipótesis contrarias, hasta que otros fenómenos las hagan más precisas o las sujeten a excepciones.</li>
</ol>
<p>Y en el Escolio General de la segunda edición (1713), a propósito de la <em>causa</em> de la gravedad: «No he logrado descubrir la causa de estas propiedades de la gravedad a partir de los fenómenos, y no invento hipótesis (<em>hypotheses non fingo</em>). Pues todo lo que no se deduce de los fenómenos debe llamarse hipótesis; y las hipótesis, sean metafísicas o físicas, no tienen cabida en la filosofía experimental. En esta filosofía las proposiciones se infieren de los fenómenos y se hacen generales por inducción. Así se descubrieron la impenetrabilidad, la movilidad, la fuerza de los cuerpos, y las leyes del movimiento y de la gravitación. Y basta que la gravedad exista, que actúe según las leyes expuestas, y que sirva para explicar los movimientos de los cuerpos celestes y del mar».</p>
<div class="box epist"><h4>Una ciencia que no sabe por qué</h4><p>Para los cartesianos, la gravedad de Newton, una fuerza que actúa a través del vacío sin contacto, era un retroceso a las «cualidades ocultas» de la escolástica. Leibniz lo dijo así, y Huygens, que reconocía la ley matemática, no aceptaba la acción a distancia. El mismo Newton, en una carta a Bentley (1693), escribió que «que la gravedad sea innata, inherente y esencial a la materia, de modo que un cuerpo pueda actuar sobre otro a distancia, a través del vacío y sin mediación, es para mí un absurdo tan grande que ningún hombre con una facultad competente de pensar en materias filosóficas puede caer en él». Newton no estaba conforme con su propia teoría, pero la defendió porque funcionaba. Es el primer gran ejemplo de una teoría <em>instrumental</em> cuyo éxito predictivo obliga a aceptarla antes de conocer su causa, un patrón que se repetirá con la mecánica cuántica.</p></div>
<div class="box epist"><h4>Análisis y síntesis</h4><p>En la cuestión 31 de la <em>Opticks</em> (1706) Newton describe su método: «El análisis consiste en hacer experimentos y observaciones, en sacar conclusiones generales por inducción… La síntesis consiste en suponer las causas descubiertas y establecidas como principios, y explicar con ellos los fenómenos». Esto es, inducción desde los fenómenos hasta las leyes y deducción desde las leyes hasta los fenómenos: el método hipotético-deductivo que Huygens declaraba y que después los científicos usaron sin nombrarlo. Kuhn observó que, tras los <em>Principia</em>, los físicos aprendieron el método de problemas ejemplares (la manzana, la Luna, las mareas) más que de las «reglas»: los ejemplos son el paradigma.</p></div>
</section>

<section>
<h2>Después de 1687: la Casa de la Moneda, el cálculo y los magos</h2>
<div class="box contexto"><h4>Política, universidad, y un nombramiento</h4><p>En 1687 el rey católico Jacobo II quiso imponer a Cambridge que otorgara un título a un monje benedictino sin el juramento anglicano. Newton formó parte de la delegación que acudió ante el juez Jeffreys y logró mantener el rechazo. Tras la Revolución Gloriosa de 1688 fue diputado por la Universidad. En 1693, tras una crisis nerviosa (cartas delirantes a Locke y Pepys; se han propuesto causas como envenenamiento por mercurio, a la vista de análisis de su cabello, pero es una conjetura), dejó la investigación activa. En 1696 se trasladó a Londres como guardián de la Casa de la Moneda, donde dirigió la gran reacuñación de 1696-1698 y persiguió a los falsificadores, a uno de los cuales (William Chaloner) envió a la horca. Fue presidente de la Royal Society desde 1703 hasta su muerte (1727) y fue armado caballero en 1705 por la reina Ana, en una visita a Cambridge con intenciones políticas (cuestión de votos). Su funeral fue en la abadía de Westminster; Voltaire, que presenció la ceremonia, escribió que Newton fue enterrado como un rey que hubiera hecho bien a sus súbditos.</p></div>
<div class="box rivalidad"><h4>Flamsteed y las estrellas</h4><p>Para verificar la teoría lunar, Newton necesitaba los datos de Flamsteed, y éste los daba a regañadientes. Flamsteed quería publicar su catálogo estelar completo; Newton, como presidente de la Royal Society, forzó en 1712 una edición incompleta con Halley como editor. Flamsteed la consideró un robo y en 1716 quemó los ejemplares que logró recuperar. Es un episodio de la tensión, aún vigente, entre quien obtiene los datos y quien los aprovecha.</p></div>
<div class="box leyenda"><h4>«El último de los magos»</h4><p>John Maynard Keynes compró en 1936, en una subasta de Sotheby's, un lote de manuscritos de Newton y se asombró: la mayor parte trataba de alquimia, cronología bíblica, profecías y teología arriana (negaba la Trinidad: una herejía que lo habría privado de su cátedra). Escribió: «Newton no fue el primero de la edad de la razón. Fue el último de los magos». Newton dedicó más palabras a la alquimia y a la teología que a la física, creyó que los antiguos poseían un saber perdido (<em>prisca sapientia</em>), y calculó que el fin del mundo no ocurriría antes de 2060. La imagen del racionalista puro es, también, una invención de la Ilustración, que prefirió leerlo así.</p></div>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>La Luna está a 384 400 km y tarda 27.32 días en una vuelta. Calcule su aceleración centrípeta y compárela con \(g/60.27^2\).
<details><summary>Respuesta</summary><p>\(a=4\pi^2r/T^2=2.72\times10^{-3}\) m/s²; \(g/60.27^2=2.70\times10^{-3}\) m/s²: cociente 1.008.</p></details></li>
<li><span class="lvl">Básico</span>Calcule la velocidad circular y la de escape en la superficie de la Tierra (\(GM=3.986\times10^5\) km³/s², \(R=6371\) km).
<details><summary>Respuesta</summary><p>\(v_c=\sqrt{GM/R}=7.91\) km/s; \(v_e=\sqrt2\,v_c=11.19\) km/s.</p></details></li>
<li><span class="lvl">Intermedio</span>Con \(T^2=k r^3\), demuestre que la aceleración centrípeta de un planeta en órbita circular es \(4\pi^2/(kr^2)\) y que la ley es consistente para todos los planetas con la misma \(k\).
<details><summary>Respuesta</summary><p>\(a=4\pi^2r/T^2=4\pi^2r/(kr^3)=4\pi^2/(kr^2)\). La misma \(k\) para todos los planetas implica que la fuerza por unidad de masa depende solo de la distancia al Sol: una fuerza central que cumple el inverso del cuadrado.</p></details></li>
<li><span class="lvl">Intermedio</span>Si la fuerza fuese \(F\propto1/r^{2.1}\), ¿cuántos grados avanzaría el perihelio por revolución en una órbita casi circular? (ángulo apsidal \(\pi/\sqrt{3-n}\)).
<details><summary>Respuesta</summary><p>Entre perihelio y perihelio: \(2\pi/\sqrt{0.9}=6.623\) rad, es decir 379.5°: 19.5° de avance por vuelta.</p></details></li>
<li><span class="lvl">Avanzado</span>Newton afirmó «no invento hipótesis» y a la vez usó el espacio absoluto, la acción a distancia y una causa oculta de la gravedad que no explicó. Analice si hay contradicción desde Lakatos (núcleo duro) y desde Popper.
<details><summary>Respuesta</summary><p>Desde Lakatos: el núcleo duro (tres leyes, gravitación, espacio absoluto) no se somete a prueba; lo que se contrasta son las hipótesis auxiliares (masas, posiciones, perturbaciones). El programa fue progresivo: predijo Neptuno (1846), el regreso del cometa, la forma de la Tierra. Desde Popper: la ley es falsable y, de hecho, fue refutada en Mercurio y en velocidades altas (capítulos 26-27). La frase «no invento hipótesis» es un lema de método más que una descripción de su práctica.</p></details></li>
</ol>
