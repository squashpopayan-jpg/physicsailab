<p class="lead">En la primavera de 1820, mientras daba una clase nocturna en Copenhague, el profesor Hans Christian Œrsted acercó por casualidad un hilo con corriente a una brújula, y la aguja se movió. Llevaba años buscando un vínculo entre electricidad y magnetismo, convencido, como la filosofía de la naturaleza de su época, de que todas las fuerzas son una. Lo curioso es lo que vio: la fuerza no iba a lo largo del hilo sino <em>alrededor</em> de él. En septiembre, el físico François Arago llevó la noticia a París; una semana después, André-Marie Ampère mostraba que dos hilos con corriente se atraen. Once años más tarde, un autodidacta sin formación matemática, hijo de un herrero, daría con el efecto inverso.</p>

<section>
<h2>Una sorpresa preparada: Œrsted</h2>
<div class="box contexto"><h4>Naturphilosophie y la unidad de las fuerzas</h4><p>En la Alemania y Dinamarca de 1800, la <em>Naturphilosophie</em> de Schelling y Kant defendía que las fuerzas naturales eran manifestaciones de una fuerza única, y que debía haber transformaciones entre ellas (luz, calor, electricidad, magnetismo, afinidad química). Œrsted (1777-1851), filósofo y químico, había sostenido ya en 1813 que debía de existir una conexión entre electricidad y magnetismo; buscarla era buscar una prueba de esa unidad. Esta convicción filosófica estaba detrás del hallazgo, como el atomismo de Demócrito detrás de Perrin. Para los físicos franceses, de formación newtoniana (fuerzas centrales, acción a distancia), la propuesta de una fuerza circular era casi extravagante.</p></div>
<p>El experimento se hizo al final de una conferencia (abril de 1820), a un público de estudiantes, con un cable de platino conectado a una pila voltaica muy potente; Œrsted notó la oscilación, pero necesitó meses de pruebas para estar seguro. El 21 de julio de 1820 publicó, en latín y en cuatro páginas, <em>Experimenta circa effectum conflictus electrici in acum magneticam</em> («conflicto eléctrico» era su nombre para la corriente) que envió a toda Europa. Escribía que «el conflicto eléctrico no está confinado al conductor, sino que se dispersa bastante en el espacio circundante» y que actúa «en círculo».</p>
<div class="sim" data-sim="oersted-brujula" data-title="La brújula de Œrsted: un campo que gira alrededor del hilo"></div>
<div class="sim-guide"><ul>
<li>Con 10 A y la brújula a 2 cm, el campo del hilo (10⁻⁴ T) es cuatro veces el terrestre y la aguja se desvía 77°. Con 1 A a 15 cm, apenas 3°. Invierta la corriente: la aguja se desvía al lado contrario, un hecho extraño en 1820: ninguna fuerza conocida cambiaba de signo con el sentido de la corriente.</li>
<li>Œrsted no tenía galvanómetros: usaba una brújula como detector. De ella salió el primer instrumento de medida eléctrico, el galvanómetro (Schweigger, 1820), que multiplicó el efecto con una bobina.</li>
</ul></div>
<div class="box epist"><h4>La serendipia no existe sin una mente preparada</h4><p>Los manuales cuentan que Œrsted descubrió el electromagnetismo «por casualidad». La casualidad fue acercar el hilo a la brújula <em>en esa disposición</em>; pero llevaba años buscando el efecto, y por una razón teórica concreta. Otros habían acercado hilos a brújulas sin notar nada: lo habían colocado mal (alineado con la aguja, de modo que el campo circular es perpendicular y casi nulo en su eje) o no esperaban ver nada. Pasteur lo dijo después: «en el campo de la observación el azar favorece solo a las mentes preparadas».</p></div>
</section>

<section>
<h2>Ampère y los franceses: la semana que cambió la física</h2>
<div class="people">
<div class="persona"><b>Hans Christian Œrsted</b><small>1777 – 1851 · Copenhague</small><p>Físico y químico danés. Fundó la Escuela Politécnica de Copenhague (1829) y fue muy influyente en la cultura científica de Dinamarca.</p></div>
<div class="persona"><b>André-Marie Ampère</b><small>1775 – 1836 · Lyon, París</small><p>Hijo de un comerciante guillotinado en 1793; viudo en 1803; profesor de matemáticas y física. Llamado por Maxwell «el Newton de la electricidad». Hizo un gran trabajo teórico en una semana de 1820 y siete años de síntesis.</p></div>
<div class="persona"><b>François Arago</b><small>1786 – 1853 · París</small><p>Astrónomo, político republicano, secretario perpetuo de la Académie. Llevó la noticia de Œrsted a París y repitió el experimento ante la Académie el 11 de septiembre de 1820.</p></div>
<div class="persona"><b>Jean-Baptiste Biot y Félix Savart</b><small>1774–1862 · 1791–1841 · París</small><p>Biot (profesor del Collège de France) y Savart (médico y físico) midieron la fuerza de un hilo sobre un polo magnético y dedujeron la ley \(B\propto I/r\) (octubre de 1820).</p></div>
<div class="persona"><b>Michael Faraday</b><small>1791 – 1867 · Londres</small><p>Hijo de un herrero; aprendiz de encuadernador; director del laboratorio de la Royal Institution. Considerado el mayor experimentador de la historia.</p></div>
<div class="persona"><b>Joseph Henry</b><small>1797 – 1878 · Albany, Princeton, Washington</small><p>Físico estadounidense. Descubrió la inducción casi a la vez que Faraday y la autoinducción antes; construyó potentes electroimanes; primer secretario de la Smithsonian.</p></div>
<div class="persona"><b>Heinrich Lenz</b><small>1804 – 1865 · San Petersburgo</small><p>Físico báltico. Enunció en 1834 la regla del sentido de la corriente inducida: se opone a la causa que la origina.</p></div>
</div>
<ol class="chain">
<li><b class="y">11 de septiembre de 1820 <span>· Arago</span></b><p>Repite en la Académie el experimento de Œrsted, que casi todos tomaban por una curiosidad.</p></li>
<li><b class="y">18 de septiembre <span>· Ampère</span></b><p>Una semana después, muestra que dos hilos paralelos se <em>atraen</em> si las corrientes van en el mismo sentido y se repelen si van en sentido contrario. En los dos meses siguientes concibe que un imán es un conjunto de corrientes circulares («corrientes moleculares»): <em>todo magnetismo es electricidad en movimiento</em>.</p></li>
<li><b class="y">Octubre de 1820 <span>· Biot y Savart</span></b><p>Midiendo el periodo de oscilación de un imán cerca de un hilo largo, hallan la ley para el efecto sobre un polo.</p></li>
<li><b class="y">1826 <span>· la teoría de Ampère</span></b><p>Publica la <em>Théorie mathématique des phénomènes électrodynamiques, uniquement déduite de l'expérience</em>, con una fórmula de fuerza entre elementos de corriente. Es un modelo de física matemática, con una fuerza a distancia como la de Newton.</p></li>
</ol>
<div class="eq key" data-name="Ley de Biot–Savart / campo de un hilo">\[\dd\vb B=\frac{\mu_0}{4\pi}\,\frac{I\,\dd\vb l\times\uv r}{r^2},\qquad B_{hilo}=\frac{\mu_0 I}{2\pi r}.\]</div>
<div class="box rivalidad"><h4>Biot y Ampère: «las leyes de la ciencia no se descubren en una tarde»</h4><p>Biot y Ampère, ambos de la Académie, se disputaron la prioridad y la interpretación. Biot defendía una explicación con polos magnéticos que se magnetizaban en el hilo; Ampère, con corrientes. Biot era conservador, newtoniano, experimentalista; Ampère, intuitivo y rápido. Ampère se quejó de que se le atribuyera menos de lo que merecía; Biot, de que se ignoraran sus medidas. Con el tiempo, la ley de Biot–Savart (campo en cada punto) y la de Ampère (fuerza entre hilos) resultaron equivalentes. Ampère vivió con tristeza y estrecheces; murió en Marsella durante una gira de inspección, y su lápida dice <em>Tandem felix</em> («por fin, feliz»).</p></div>
</section>

<section>
<h2>Faraday: de aprendiz a Royal Institution</h2>
<div class="box contexto"><h4>Clase, religión y ciencia</h4><p>Michael Faraday nació en 1791 en un barrio pobre de Londres, hijo de un herrero y de una familia de la secta sandemaniana, una pequeña iglesia cristiana estricta. Con trece años entró como aprendiz de un encuadernador. Leía los libros que encuadernaba: la <em>Enciclopedia británica</em> (artículo «Electricidad») y las <em>Conversaciones sobre química</em> de Jane Marcet, que le abrieron el camino. Un cliente le regaló entradas para las conferencias de Humphry Davy en la Royal Institution (1812); Faraday tomó notas, las encuadernó, se las envió con una carta pidiendo trabajo, y Davy, tras una explosión que lo dejó temporalmente sin vista, lo contrató como ayudante (1813). En el viaje de Davy por Europa (1813-1815), Faraday fue a la vez ayudante y criado, y la esposa de Davy lo trató como sirviente; conoció a Ampère, Volta y Gay-Lussac. La sociedad inglesa del siglo XIX, muy clasista, nunca lo trató del todo como un caballero. Rechazó dos veces la presidencia de la Royal Society y el título de «sir».</p></div>
<p>Faraday no sabía matemáticas más allá del álgebra elemental, y esta carencia fue una de sus fuerzas: pensaba con imágenes, con las «líneas de fuerza» que ve uno al espolvorear limaduras sobre un imán. Guardó un diario de laboratorio de más de 16 000 párrafos numerados, un registro sin igual de cómo se hace una investigación, con aciertos y errores.</p>
<ol class="chain">
<li><b class="y">1821 <span>· el primer motor</span></b><p>Siguiendo las ideas de Ampère, hizo girar un hilo con corriente alrededor de un imán y un imán alrededor de un hilo, en un recipiente con mercurio. Es el primer dispositivo en que un movimiento continuo se produce por electricidad. Publicó sin dar el crédito debido a Wollaston, que había intentado algo parecido, y Davy lo acusó de plagio. Faraday quedó marcado por la disputa durante años.</p></li>
<li><b class="y">1822-1831 <span>· ¿electricidad desde el magnetismo?</span></b><p>En su diario de 1822 anotó: «convertir magnetismo en electricidad». Durante nueve años, con interrupciones, lo intentó, con imanes cerca de hilos, sin resultado. Una corriente <em>estacionaria</em> en un hilo no produce nada en otro.</p></li>
<li><b class="y">29 de agosto de 1831 <span>· el anillo</span></b><p>Arrolló dos bobinas aisladas en un anillo de hierro dulce (de 15 cm). Conectó una a una pila y la otra a un galvanómetro. Al cerrar el circuito, la aguja del galvanómetro se movió y volvió a cero; al abrirlo, se movió en sentido contrario. La corriente aparecía solo <em>cuando la primera cambiaba</em>.</p></li>
<li><b class="y">17 de octubre de 1831 <span>· el imán</span></b><p>Introdujo y sacó un imán cilíndrico de una bobina: cada movimiento daba una sacudida de signo opuesto. Concluyó que lo decisivo era el <em>cambio</em> del magnetismo en la bobina.</p></li>
<li><b class="y">28 de octubre de 1831 <span>· el disco</span></b><p>Hizo girar un disco de cobre entre los polos de un imán: generó una corriente continua. Dínamo.</p></li>
</ol>
<div class="eq key" data-name="Ley de inducción de Faraday (forma moderna de Neumann, 1845)">\[\varepsilon=-\frac{\dd\Phi_B}{\dd t},\qquad\Phi_B=\int\vb B\cdot\dd\vb S.\]</div>
<div class="sim" data-sim="induccion-faraday" data-title="Un imán atraviesa una bobina: la inducción y su detección"></div>
<div class="sim-guide"><ul>
<li>El pulso positivo (imán que entra) y el negativo (imán que sale) son del mismo tamaño y la carga neta es cero. El área del pulso, \(\int\varepsilon\,\dd t=\Delta\Phi\), no depende de la velocidad: un imán más lento produce un pulso más ancho y más bajo.</li>
<li>Active «galvanómetro lento»: promedia durante 0.1 s y borra casi el pulso (señal con 10 veces menos amplitud). Es el caso de Colladon (1825): metió un imán en una bobina conectada a un galvanómetro situado <em>en otra habitación</em> para evitar que el imán lo desviara, y al volver a mirar la aguja estaba quieta.</li>
</ul></div>
<div class="box epist"><h4>Cómo se pierde un descubrimiento: el sesgo del diseño</h4><p>Colladon, Ampère y Arago tenían los instrumentos y las ideas, y fallaron porque sus montajes ocultaban el efecto: el galvanómetro lejos (por precaución legítima), el imán estático, o la corriente continua. Es un ejemplo de que un experimento puede estar bien hecho respecto de lo que se <em>espera</em> y mal respecto de lo que ocurre. Faraday tenía una ventaja: no sabía la teoría de Ampère, de modo que no tenía una expectativa precisa (esperaba una corriente «estacionaria» y se sorprendió con un efecto transitorio). La metodología de Faraday, con control de variables, repetición y registro, es modelo del experimento científico; los casos fallidos de sus colegas muestran que la <em>observación está cargada de teoría</em> (Hanson) y que la teoría puede ocultar fenómenos.</p></div>
<div class="box rivalidad"><h4>Faraday y Henry: la prioridad de un mes</h4><p>Joseph Henry, profesor en la Academia de Albany, logró producir corrientes inducidas en el verano de 1830, con imanes más fuertes, pero no publicó hasta 1832, cuando ya se conocía lo de Faraday (publicado en noviembre de 1831). Henry aceptó con elegancia: en la ciencia vale quién publica primero. Descubrió además la autoinducción (1832). La unidad de inductancia, el henry, lleva su nombre, el único consuelo. Su carácter conservador ante la prioridad contrasta con las polémicas europeas.</p></div>
</section>

<section>
<h2>Líneas de fuerza, electrólisis y la luz</h2>
<p>Faraday no aceptó la idea de acción a distancia: pensaba que la fuerza se transmite por el espacio a través de las «líneas de fuerza», que ve en las limaduras sobre un imán, una realidad física que llena el espacio. En 1832-1838 hizo una serie de experimentos sobre la naturaleza de la electricidad, y demostró que la electricidad de la pila, la estática, la animal (de la anguila eléctrica), la termoeléctrica y la magnética son la misma. En 1833-1834, el análisis cuantitativo de la <em>electrólisis</em> lo llevó a sus leyes: la masa depositada es proporcional a la carga que pasa y, para cada sustancia, a su peso equivalente. Con ayuda de William Whewell acuñó las palabras «electrodo», «ánodo», «cátodo», «electrólisis» e «ion».</p>
<div class="eq key" data-name="Leyes de la electrólisis (1833)">\[m=\frac{M}{zF}\,Q,\qquad F=N_Ae=96\,485\ \mathrm{C/mol}.\]</div>
<p>La constante de Faraday implica que la carga eléctrica viene en paquetes: la electricidad es <em>atómica</em>, como la materia. Faraday no lo afirmó (era prudente con los átomos), pero Helmholtz lo dijo en 1881 y Stoney estimó en 1874 la unidad de carga y la bautizó «electrón» en 1891 (capítulo 24). En 1845, Faraday hizo un experimento que lo llevó a pensar que la luz y el magnetismo estaban relacionados: un campo magnético intenso hace girar el plano de polarización de la luz que atraviesa un vidrio pesado (el <em>efecto Faraday</em>). Y propuso, en 1846, que la luz podría ser una vibración de las líneas de fuerza: la semilla de Maxwell (capítulo 21).</p>
<div class="sim" data-sim="disco-faraday" data-title="El disco de Faraday: la primera dinamo"></div>
<div class="sim-guide"><ul>
<li>Con 1 T, 50 Hz y un disco de 10 cm de radio, la fem es de 1.6 V entre el eje y el borde. Con 1 mΩ de resistencia de carga circularían 1 500 A: la dinamo de disco (homopolar) da tensiones pequeñas y corrientes enormes, y se usa para pulsos de gran potencia.</li>
<li>La fem crece con \(B\), con \(\omega\) y con \(R^2\). Esta proporcionalidad cuadrática en el radio explica por qué los generadores de la central eléctrica de Faraday se hicieron más grandes, no más rápidos.</li>
</ul></div>
<div class="box epist"><h4>Un físico sin matemáticas, y una teoría de campos</h4><p>Faraday escribió a Maxwell en 1857 que le preocupaba si sus ideas, expresadas «en un lenguaje vulgar», no tendrían una traducción matemática: «¿no es posible mostrar las leyes de mi manera, expresadas en las formas convencionales de los matemáticos?». Maxwell lo hizo. Es el ejemplo más claro de la división de labores entre una intuición física (campos continuos, líneas de fuerza) y su formalización (ecuaciones de campo). También ilustra cómo dos <em>programas de investigación</em> rivales (acción a distancia, como en Ampère o Weber; campos, como en Faraday) pueden producir resultados equivalentes en el régimen de baja velocidad y divergir después: la inducción y las ondas electromagnéticas fueron la victoria de los campos.</p></div>
<div class="box leyenda"><h4>«¿Para qué sirve?»</h4><p>Se cuenta que Gladstone, ministro de Hacienda, preguntó a Faraday para qué servía la electricidad, y que éste respondió: «Señor, algún día podrá cobrarle impuestos». Es una anécdota sin fuente contemporánea. Los biógrafos coinciden en que Faraday rechazó toda orientación comercial (podía haber ganado mucho dinero como consultor) por convicción religiosa y por devoción a la investigación, aunque sí hizo trabajos de ingeniería (faros, ventilación de minas, contaminación del Támesis).</p></div>
<div class="sim" data-sim="timeline" data-ch="faraday" data-from="1810" data-to="1870" data-title="Línea de tiempo del electromagnetismo hasta Faraday"></div>
<div class="sim" data-sim="vidas" data-ids="davy,oersted,ampere,biot,arago,faraday,henry,lenz,colladon,wollaston,gauss,weber,ohm,volta" data-title="Los electromagnetistas: quién pudo conocer a quién"></div>
<div class="sim-guide"><ul>
<li>Faraday conoció a Ampère y a Volta en el viaje de 1813-1815. Œrsted, Ampère, Arago y Faraday formaron una red de cartas y visitas; Ohm trabajaba aislado.</li>
<li>Ampère nació antes que Davy, y Henry y Faraday nacieron con cinco años de diferencia, y los dos descubrieron la inducción.</li>
</ul></div>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule el campo de un hilo con 5 A a 2 cm, y la desviación de una brújula si la componente horizontal terrestre es 2.4×10⁻⁵ T.
<details><summary>Respuesta</summary><p>\(B=\mu_0I/2\pi r=5\times10^{-5}\) T; \(\theta=\arctan(5/2.4)=64\)°.</p></details></li>
<li><span class="lvl">Básico</span>Un disco de cobre de 20 cm de radio gira a 30 Hz en un campo de 0.5 T. ¿Qué fem se obtiene entre el eje y el borde?
<details><summary>Respuesta</summary><p>\(\varepsilon=\tfrac12B\omega R^2=\tfrac12\times0.5\times188.5\times0.04=1.88\) V.</p></details></li>
<li><span class="lvl">Intermedio</span>El flujo a través de una bobina de 400 vueltas cambia de +2×10⁻⁴ Wb a −2×10⁻⁴ Wb en 0.05 s. ¿Qué fem media aparece?
<details><summary>Respuesta</summary><p>\(\varepsilon=-N\Delta\Phi/\Delta t=-400\times(-4\times10^{-4})/0.05=3.2\) V.</p></details></li>
<li><span class="lvl">Intermedio</span>Con un galvanómetro de constante de tiempo 0.1 s y un pulso de 2 ms de ancho, ¿cuánto se reduce la amplitud medida? ¿Qué debió hacer Colladon?
<details><summary>Respuesta</summary><p>Se reduce unas 50 veces (cociente 2 ms/0.1 s). Debió ponerse junto al galvanómetro, usar un imán potente y moverlo rápido, o un galvanómetro balístico que integra la carga.</p></details></li>
<li><span class="lvl">Avanzado</span>Compare «acción a distancia» (Ampère, Weber) y «campo» (Faraday) como programas de investigación. ¿Qué evidencia de 1831-1888 los distingue?
<details><summary>Respuesta</summary><p>Ambos explican la inducción y las fuerzas entre corrientes. Los campos predicen que las perturbaciones se propagan con velocidad finita; las fuerzas a distancia (Weber) pueden dar acciones instantáneas o retardadas con una ley especial. La evidencia decisiva fue la detección de las ondas electromagnéticas por Hertz (1887-1888), con velocidad c (capítulo 21).</p></details></li>
</ol>
