<p class="lead">El 23 de diciembre de 1947, en los Laboratorios Bell de Murray Hill (Nueva Jersey), dos físicos hicieron una demostración a sus jefes. John Bardeen y Walter Brattain habían clavado dos puntas de oro muy próximas sobre un cristal de germanio y, al aplicar una pequeña corriente a una de ellas, la corriente de la otra se amplificaba unas cien veces. Era el primer transistor: un interruptor sólido que reemplazaba a la válvula de vacío, sin filamento caliente, sin vidrio, sin peso. William Shockley, jefe del grupo, estaba en la sala y no estaba contento: la invención era de sus subordinados. Esa noche se encerró en un hotel de Chicago y, en un mes, concibió otro transistor más sólido. La rivalidad entre los tres cambió la historia de la electrónica, de la fotografía y del siglo.</p>

<section>
<h2>De la teoría de bandas a la industria</h2>
<div class="box contexto"><h4>Una física que nació para la industria</h4><p>La mecánica cuántica (capítulo 29) se aplicó muy pronto a los sólidos: Bloch (1928), Peierls y Wilson (1931) mostraron que los electrones en un cristal ocupan bandas de energía y que la distinción entre metales, aislantes y semiconductores depende de la ocupación de las bandas. Pero fue la necesidad industrial la que dio sentido práctico al conocimiento: los Laboratorios Bell, financiados por el monopolio de AT&T, necesitaban sustituir los costosos y poco fiables amplificadores de válvulas del sistema telefónico. En 1945 fundaron un grupo de «física del estado sólido» con una mezcla deliberada de teóricos (Shockley, Bardeen), experimentadores (Brattain) y químicos. Fue uno de los primeros ejemplos de investigación fundamental planificada para un objetivo tecnológico, con una libertad muy amplia: «ciencia para la ingeniería».</p></div>
<div class="people">
<div class="persona"><b>Felix Bloch y Alan Wilson</b><small>1905–1983 · 1906–1995</small><p>Bloch, alumno de Heisenberg; demostró el teorema que lleva su nombre. Wilson aplicó la idea a los semiconductores, con la teoría de las impurezas donantes y aceptoras.</p></div>
<div class="persona"><b>Heike Kamerlingh Onnes</b><small>1853 – 1926 · Leiden</small><p>Licuó el helio (1908), el último gas «permanente», y en 1911 observó que la resistencia del mercurio se anula bruscamente a 4.2 K. Nobel 1913.</p></div>
<div class="persona"><b>William Shockley</b><small>1910 – 1989 · Bell Labs, Stanford</small><p>Brillante, ambicioso y autoritario. Fundó la primera empresa de semiconductores de Silicon Valley (1956), de la que huyeron ocho de sus mejores ingenieros («los ocho traidores»), que fundaron Fairchild. En su vejez defendió ideas racistas sobre la inteligencia, que lo aislaron.</p></div>
<div class="persona"><b>John Bardeen y Walter Brattain</b><small>1908–1991 · 1902–1987</small><p>Bardeen, el único con dos Nobel de Física (1956 y 1972, este último por la superconductividad). Brattain, experimentador intuitivo, «un hombre de manos».</p></div>
<div class="persona"><b>Jack Kilby y Robert Noyce</b><small>1923–2005 · 1927–1990</small><p>Inventores independientes del circuito integrado (1958-1959), el primero con alambres de oro sobre germanio y el segundo con una capa de óxido y metal sobre silicio (proceso planar).</p></div>
<div class="persona"><b>Gordon Moore</b><small>1929 – 2023 · Fairchild, Intel</small><p>Químico de formación. Cofundador de Intel con Noyce (1968), formuló en 1965 la ley que lleva su nombre.</p></div>
<div class="persona"><b>Charles Townes y Theodore Maiman</b><small>1915–2015 · 1927–2007</small><p>Townes inventó el máser (1954) y propuso el láser con Schawlow (1958); Maiman, ingeniero de Hughes, hizo funcionar el primero (1960), con un cristal de rubí.</p></div>
</div>

<section>
<h2>Cómo se llegó al transistor</h2>
<ol class="chain">
<li><b class="y">1928-1931 <span>· Bandas</span></b><p>Bloch demostró que las soluciones de la ecuación de Schrödinger en un potencial periódico son ondas moduladas por la periodicidad de la red. Los niveles se agrupan en bandas con brechas prohibidas. Kronig y Penney (1931) resolvieron un modelo exacto de barreras rectangulares periódicas; Wilson dedujo que un cristal aislante o semiconductor tiene la banda de valencia llena y una brecha hasta la de conducción.</p></li>
<li><b class="y">1938-1947 <span>· El problema de la superficie</span></b><p>La idea del transistor de efecto de campo (un campo que cambia la conductividad de un semiconductor) fue patentada por Lilienfeld en 1925 y 1930, pero nadie la hizo funcionar porque los estados de la superficie apantallaban el campo. Bardeen propuso en 1946 una teoría de los estados superficiales, y su experimento con Brattain (diciembre de 1947) estaba orientado a verificar el efecto de campo cuando, por azar, encontraron la amplificación por un punto de contacto.</p></li>
<li><b class="y">1948-1951 <span>· Shockley y la unión</span></b><p>Shockley propuso un transistor de unión p–n, con un semiconductor dopado con donantes y aceptores, de manufactura más robusta. Demostró la ecuación del diodo \(I=I_s(e^{eV/kT}-1)\). En 1951 Teal, de Bell, hizo crecer cristales de germanio con uniones; en 1954 Texas Instruments fabricó el primer transistor de silicio.</p></li>
<li><b class="y">1958-1971 <span>· De uno a un millón</span></b><p>Kilby (Texas Instruments, verano de 1958) fabricó un circuito con transistor, resistencias y capacidad sobre una sola pieza de germanio. Noyce (Fairchild, 1959) hizo la versión planar con silicio y óxido, la base de la industria. En 1971 Intel presentó el 4004, con 2300 transistores. Cada dos años el número se duplicó.</p></li>
</ol>
<div class="eq key" data-name="Bandas, diodo y ley de Moore">\[\cos ka=\cos\alpha a+\frac{P}{\alpha a}\sen\alpha a,\qquad I=I_s\big(e^{eV/nk_BT}-1\big),\qquad N(t)=N_0\,2^{t/2\text{ años}} .\]</div>

<div class="sim-guide"><ul>
<li>Con \(P\) pequeño las bandas son anchas y casi se tocan: es un metal. Con \(P\) grande son estrechas, con brechas amplias. La zona sombreada marca dónde la función es menor que 1 en módulo (energías permitidas).</li>
</ul></div>
<div class="sim" data-sim="ley-moore" data-title="Cincuenta años de la ley de Moore"></div>
<div class="sim-guide"><ul>
<li>Los puntos son procesadores reales (de 2300 a 11 800 millones de transistores). El ajuste da una duplicación cada ≈2 años; en los últimos años el ritmo es algo más lento. Cambie el tiempo supuesto: con 1 año, la ley predicha de 1965 habría dado números imposibles.</li>
</ul></div>
<div class="box rivalidad"><h4>Shockley, Bardeen y Brattain: un trío que no pudo seguir</h4><p>El día de la demostración, Shockley sintió que su nombre no aparecía en la patente del transistor de contacto: el abogado de Bell advirtió que una solicitud de Lilienfeld de 1930 invalidaría la reivindicación del efecto de campo, que era la idea de Shockley, y se patentó solo el transistor de Bardeen y Brattain. Shockley se sintió desplazado y trabajó en secreto en la teoría de la unión. Cuando Bell publicó el comunicado de prensa (junio de 1948), las fotos mostraban a Shockley sentado en la silla de en medio, con los otros dos detrás: una disposición que Bardeen y Brattain aborrecieron. Bardeen dejó Bell en 1951, en parte por la hostilidad de Shockley, y fue a Illinois, donde desarrolló la teoría BCS. El trío compartió el Nobel de 1956 y no volvió a reunirse nunca.</p></div>
<div class="box epist"><h4>Ciencia pura, ciencia aplicada, tecnociencia</h4><p>El transistor desafía la separación entre ciencia básica y aplicada. Se apoya en una teoría de 1928-1931 hecha sin intención práctica; pero la teoría no basta: hacían falta cristales de germanio de pureza extrema (una parte en 10⁹), una teoría de las superficies y un laboratorio con química, metalurgia y física. Los historiadores (Hoddeson, Riordan) hablan de «paradigma de investigación industrial». Hacking diría que aquí <em>intervenir</em> precede a <em>representar</em>: el transistor funcionó antes de que se entendiera del todo por qué.</p></div>
</section>

<section>
<h2>Superconductividad y láser</h2>
<ol class="chain">
<li><b class="y">1911-1933 <span>· Una resistencia que desaparece</span></b><p>En 1911, en Leiden, el ayudante Gilles Holst y Onnes vieron que el mercurio, enfriado a 4.2 K, pierde su resistencia: no disminuye, desaparece. Meissner y Ochsenfeld (1933) descubrieron que un superconductor expulsa el campo magnético (efecto Meissner): no es un conductor perfecto, es una fase de la materia distinta. Durante 46 años nadie supo explicarla.</p></li>
<li><b class="y">1957 <span>· BCS</span></b><p>Bardeen, Cooper y Schrieffer propusieron que los electrones forman pares (de Cooper) con una atracción residual mediada por las vibraciones de la red. Aparece una brecha de energía \(\Delta\approx1.764\,k_BT_c\) en el espectro, que impide la dispersión. La predicción de la dependencia con la masa isotópica (verificada en 1950) fue uno de los indicios. Nobel 1972.</p></li>
<li><b class="y">1917-1960 <span>· Emisión estimulada y láser</span></b><p>Einstein, al deducir la ley de Planck con transiciones (1917), introdujo el proceso de emisión estimulada: un fotón induce a un átomo excitado a emitir otro idéntico. Durante 40 años fue una curiosidad. Townes, en 1951, esperando en un banco de un parque de Washington, pensó en usar una cavidad resonante para amplificar microondas con moléculas de amoníaco (máser, 1954). Con Schawlow propuso el láser óptico (1958). Maiman lo hizo en mayo de 1960 con un cristal de rubí y una lámpara de destellos fotográfica: 694.3 nm.</p></li>
<li><b class="y">1986 <span>· Alta temperatura crítica</span></b><p>Bednorz y Müller, en IBM Zúrich, hallaron superconductividad a 35 K en un óxido de lantano, bario y cobre, un material que la teoría BCS no sabía prever. En un año, se alcanzaron 93 K (YBCO), por encima del nitrógeno líquido. Nobel 1987, un año después. Hoy no hay teoría aceptada de estos materiales.</p></li>
</ol>
<div class="sim" data-sim="laser-umbral" data-title="El umbral del láser"></div>
<div class="sim-guide"><ul>
<li>Con \(\beta=10^{-4}\) la salida crece cuatro órdenes de magnitud al pasar por el umbral (línea vertical). Con \(\beta=10^{-1}\) (microláseres) el umbral se difumina. La inversión de población queda «anclada» por encima del umbral: el exceso de bombeo se convierte en luz.</li>
</ul></div>
<div class="box leyenda"><h4>«Una solución en busca de un problema»</h4><p>La frase se atribuye a menudo al láser, y a los colegas de Maiman que no vieron aplicaciones. Lo cierto es que Hughes tenía un interés militar (telemetría), que el artículo de Maiman fue rechazado por <em>Physical Review Letters</em> (donde un editor lo creyó una repetición del máser) y apareció en <em>Nature</em>, y que las primeras aplicaciones comerciales (códigos de barras, discos compactos, fibra óptica, cirugía ocular) llegaron en los años 70-80. La frase resume bien un patrón histórico (Maxwell no previó la radio, Hertz tampoco; capítulo 21): la utilidad de un descubrimiento básico rara vez es predecible.</p></div>
<div class="box epist"><h4>Los resultados que desafían una teoría exitosa</h4><p>La superconductividad de alta temperatura es un caso interesante: una teoría (BCS) predecía un límite alrededor de 30-40 K, y los óxidos de cobre lo superaron ampliamente. Esto no refutó BCS en su dominio, pero dejó un problema abierto sin explicación aceptada después de 35 años. Una comunidad de unos 100 000 científicos sigue trabajando en él: una anomalía en el sentido de Kuhn que, por ahora, no ha desembocado ni en crisis ni en una nueva teoría, y que muestra la importancia de lo que no se entiende.</p></div>
</section>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule la tensión térmica \(k_BT/e\) a 300 K y la corriente de un diodo con \(I_s=10^{-12}\) A a 0.6 V.
<details><summary>Respuesta</summary><p>\(V_T=25.85\) mV. \(I=10^{-12}(e^{0.6/0.02585}-1)=1.2\) mA.</p></details></li>
<li><span class="lvl">Básico</span>Un chip de 2300 transistores en 1971 se duplica cada 2 años. ¿Cuántos tendrá en 2021?
<details><summary>Respuesta</summary><p>\(2300\times2^{25}=7.7\times10^{10}\) (los chips reales de 2021 tienen \(\sim10^{10}\)–\(10^{11}\)).</p></details></li>
<li><span class="lvl">Intermedio</span>El láser de rubí emite 694.3 nm. ¿Qué energía tiene cada fotón? ¿Cuántos fotones hay en un pulso de 1 J?
<details><summary>Respuesta</summary><p>\(E=1239.84/694.3=1.786\) eV \(=2.86\times10^{-19}\) J; \(N=1/2.86\times10^{-19}=3.5\times10^{18}\) fotones.</p></details></li>
<li><span class="lvl">Intermedio</span>Para el aluminio (\(T_c=1.18\) K) calcule la brecha BCS.
<details><summary>Respuesta</summary><p>\(\Delta=1.764\,k_BT_c=1.764\times8.617\times10^{-5}\times1.18=0.18\) meV (medido: 0.18 meV).</p></details></li>
<li><span class="lvl">Avanzado</span>Con la condición de Kronig–Penney, explique por qué a \(P\to\infty\) las bandas se reducen a los niveles de un pozo de ancho \(a\).
<details><summary>Respuesta</summary><p>Si \(P\) es grande, \(\sen\alpha a\) debe ser casi nulo para que el segundo miembro no supere 1: \(\alpha a=n\pi\), que son las energías del pozo infinito de ancho \(a\), con bandas de ancho \(\to0\).</p></details></li>
<li><span class="lvl">Avanzado</span>¿Fue Shockley el inventor del transistor? Discuta quién inventa cuando una invención surge de un equipo.
<details><summary>Respuesta</summary><p>La invención del transistor de contacto es de Bardeen y Brattain; la del transistor de unión, de Shockley, que además dirigió el grupo y formuló la teoría de la unión. La noción de autor individual se vuelve borrosa en equipos, y las patentes y premios la simplifican. El caso muestra cómo los conflictos de reconocimiento pueden cambiar una carrera y una industria.</p></details></li>
</ol>
