<p class="lead">A fines de mayo de 1925, un joven físico alemán de 23 años, aquejado de una fiebre del heno violenta, pidió permiso a Max Born para retirarse a Helgoland, una isla rocosa del mar del Norte sin polen. Durante diez días, Werner Heisenberg calculó niveles de energía de un oscilador anarmónico con tablas de números en las que figuraban solo cantidades observables (frecuencias e intensidades de las líneas) y no órbitas. Una noche, hacia las tres de la madrugada, terminó el último cálculo y vio que la energía se conservaba. «Al principio estaba profundamente alarmado. Sentía que miraba, a través de la superficie de los fenómenos atómicos, un interior extrañamente hermoso, y me mareaba pensar que ahora debía investigar esa riqueza de estructuras matemáticas… Era demasiado excitado para dormir.» Seis meses después, un físico de 38 años, en una estación de esquí suiza con una amante, formulaba una teoría completamente distinta con la que obtendría los mismos resultados.</p>

<section>
<h2>Dos teorías para un mismo átomo</h2>
<div class="box contexto"><h4>La Europa de Weimar, Gotinga y Copenhague</h4><p>La mecánica cuántica fue obra de una generación joven (Heisenberg 23, Pauli 25, Dirac 23, Jordan 22) en una Europa de posguerra: hiperinflación alemana (1923), hambre y exclusión de los científicos alemanes de congresos internacionales hasta 1926. Los centros fueron Gotinga (Born, Franck, Hilbert), Múnich (Sommerfeld), Copenhague (Bohr) y Zúrich (Schrödinger y Pauli). La ayuda de la Fundación Rockefeller, que financió estancias en Copenhague, permitió la circulación. Era una comunidad con intensa correspondencia, y pocos físicos de más de 40 años participaron: la mayoría se mantuvo en la vieja teoría.</p></div>
<div class="people">
<div class="persona"><b>Louis de Broglie</b><small>1892 – 1987 · París</small><p>Príncipe (después duque), historiador de formación; su tesis de 1924 propuso que a toda partícula con impulso \(p\) le corresponde una onda de longitud \(\lambda=h/p\). El tribunal dudó; Langevin envió la tesis a Einstein, que dijo: «Ha levantado una punta del gran velo».</p></div>
<div class="persona"><b>Werner Heisenberg</b><small>1901 – 1976 · Múnich, Gotinga, Copenhague</small><p>Alumno de Sommerfeld, ayudante de Born y de Bohr. Líder del programa nuclear alemán durante la guerra, con un papel moral y científico muy discutido.</p></div>
<div class="persona"><b>Erwin Schrödinger</b><small>1887 – 1961 · Viena, Zúrich, Berlín</small><p>Austriaco, lector de filosofía india, con una vida personal poco convencional. Dejó Alemania en 1933 por rechazo al nazismo; vivió en Dublín desde 1939.</p></div>
<div class="persona"><b>Max Born</b><small>1882 – 1970 · Gotinga, Edimburgo</small><p>Descubrió que la multiplicación de las tablas de Heisenberg era el producto de matrices; propuso la interpretación probabilística. Nobel en 1954 (28 años después), un olvido que le dolió.</p></div>
<div class="persona"><b>Paul A. M. Dirac</b><small>1902 – 1984 · Bristol, Cambridge</small><p>Ingeniero eléctrico, parco hasta lo legendario. Unificó las dos mecánicas (teoría de transformaciones), y escribió la ecuación relativista del electrón (1928).</p></div>
<div class="persona"><b>Wolfgang Pauli</b><small>1900 – 1958 · Hamburgo, Zúrich</small><p>«El azote de Dios» de los teóricos por su crítica feroz. Su principio de exclusión (1925) explica la tabla periódica.</p></div>
<div class="persona"><b>Albert Einstein y Niels Bohr</b><small>1879–1955 · 1885–1962</small><p>Los dos que más pesaron en el debate: amigos, y sin llegar a un acuerdo en treinta años.</p></div>
</div>

<section>
<h2>Cómo se llegó a la mecánica cuántica</h2>
<ol class="chain">
<li><b class="y">1923-1924 <span>· De Broglie</span></b><p>Si la luz, que es una onda, se comporta como partículas (Einstein, Compton), quizá las partículas se comporten como ondas. De Broglie dedujo de la relatividad que \(\lambda=h/p\) y mostró que las órbitas de Bohr son las que contienen un número entero de ondas: \(2\pi r=n\lambda\).</p></li>
<li><b class="y">julio 1925 <span>· Helgoland: la mecánica matricial</span></b><p>Heisenberg decidió prescindir de lo inobservable (la trayectoria del electrón) y trabajar con las frecuencias y amplitudes de las líneas, que forman tablas de dos índices \(x_{nm}\). Descubrió que su producto no es conmutativo: \(xp-px\neq0\). Born reconoció que eran matrices, y con Jordan formuló \(xp-px=i\hbar\) (el artículo «de los tres hombres», noviembre de 1925).</p></li>
<li><b class="y">diciembre 1925–1926 <span>· Arosa: la mecánica ondulatoria</span></b><p>Schrödinger, en una estación de esquí suiza, siguió la propuesta de De Broglie (Debye le había pedido que explicara las ondas de materia en un seminario) y buscó una ecuación de ondas para el electrón en el átomo, con la analogía óptico-mecánica de Hamilton (capítulo 16). Obtuvo primero una ecuación relativista (que daba mal la estructura fina) y luego la no relativista que lleva su nombre: \(i\hbar\partial_t\psi=H\psi\). En cuatro comunicaciones de 1926 resolvió el átomo de hidrógeno, el oscilador y el rotor, y demostró que su teoría es matemáticamente equivalente a la de Heisenberg.</p></li>
<li><b class="y">1926 <span>· La regla de Born</span></b><p>¿Qué significa \(\psi\)? Schrödinger pensó en una densidad de carga. Born, estudiando colisiones, vio que \(|\psi|^2\) es la <em>probabilidad</em> de hallar la partícula. Lo puso en una nota a pie de página de su artículo, y en la versión larga lo desarrolló. Einstein, que lo había alentado, no lo aceptó.</p></li>
<li><b class="y">febrero–marzo 1927 <span>· Incertidumbre</span></b><p>En Copenhague, mientras Bohr esquiaba en Noruega, Heisenberg pensó en el «microscopio de rayos γ» y en que la trayectoria de un electrón no es observable. Publicó la relación \(\Delta x\,\Delta p\gtrsim\hbar\). Bohr, a su regreso, no estuvo conforme con el argumento (que se basaba en una perturbación), y le obligó a añadir una nota. De esa disputa salió la <em>complementariedad</em>, anunciada en Como en septiembre de 1927.</p></li>
<li><b class="y">1927 <span>· Davisson, Germer y Thomson</span></b><p>La difracción de electrones por cristales de níquel (y por láminas de oro en Aberdeen) mostró la longitud de onda de De Broglie con la precisión de la fórmula de Bragg.</p></li>
</ol>

<div class="box rivalidad"><h4>Heisenberg contra Schrödinger</h4><p>La rivalidad entre las dos teorías fue áspera. Heisenberg escribió a Pauli en junio de 1926: «Cuanto más pienso en la parte física de la teoría de Schrödinger, más me repugna». Schrödinger, a su vez, en Copenhague (octubre de 1926), dijo a Bohr que «si hay que mantener este maldito salto cuántico, lamento haberme metido en esto». Heisenberg vio a la mecánica ondulatoria como una concesión al conservadurismo de las imágenes clásicas; Schrödinger vio a la matricial como un álgebra abstrusa. El hecho de que las dos fueran equivalentes (Schrödinger, Pauli, Eckart) resolvió el problema formal, pero no el interpretativo: ¿es \(\psi\) una onda real, como pensaba Schrödinger, o un instrumento para calcular probabilidades? Las matemáticas de Hilbert, von Neumann (1932) y Dirac unificaron el formalismo; la <em>interpretación</em> sigue discutiéndose cien años después.</p></div>
<div class="box epist"><h4>Observables, positivismo y la influencia de Mach</h4><p>El primer artículo de Heisenberg se presentó como un programa positivista: «basar la teoría en relaciones entre cantidades observables». Einstein le objetó en Berlín (abril de 1926): «Es la teoría la que decide lo que se puede observar», un argumento sobre la carga teórica de la observación (Hanson, Kuhn) que Heisenberg recordó como decisivo en la formulación de la incertidumbre: lo que se observa depende de lo que la teoría diga que sucede en el instrumento. Mach, positivista, había sido el modelo de Einstein en 1905, y su rechazo de la mecánica cuántica es una ironía filosófica que Einstein reconocería.</p></div>
</section>

<section>
<h2>Solvay 1927 y el debate Einstein–Bohr</h2>
<ol class="chain">
<li><b class="y">octubre 1927 <span>· Quinto Congreso Solvay</span></b><p>De los 29 asistentes de la famosa fotografía en Bruselas, 17 fueron o serían premios Nobel (Einstein, Bohr, Planck, Lorentz, Marie Curie, De Broglie, Born, Heisenberg, Schrödinger, Dirac, Pauli, Compton, W. L. Bragg, Langmuir, Debye…). Se enfrentaron la «interpretación de Copenhague» (Bohr, Heisenberg, Born) y la de Einstein, Schrödinger y De Broglie. Einstein planteó experimentos mentales (un haz de electrones que pasa por una rendija y se difracta: ¿cómo «sabe» la pantalla entera que el electrón ha llegado a un punto?). Bohr respondía con la complementariedad. Ehrenfest escribió que fue «como ajedrez: cada mañana Einstein inventaba una nueva máquina, y cada noche Bohr la desmontaba».</p></li>
<li><b class="y">1930 <span>· La caja de fotones</span></b><p>En el Solvay de 1930, Einstein propuso una caja con un reloj que abre un obturador un instante y libera un fotón: pesando la caja antes y después (\(E=mc^2\)) se conocería la energía y el instante, y se violaría \(\Delta E\,\Delta t\ge\hbar/2\). Bohr pasó una noche sin dormir; al día siguiente mostró que el pesado en un campo gravitatorio introduce una incertidumbre en el tiempo del reloj por el corrimiento al rojo gravitacional (capítulo 27): usó la relatividad general de Einstein contra él.</p></li>
<li><b class="y">1935 <span>· EPR y el gato</span></b><p>En Princeton, Einstein, Podolsky y Rosen publicaron «¿Se puede considerar completa la descripción mecanocuántica de la realidad física?». Dos partículas que interaccionaron y se separaron tienen correlaciones perfectas: midiendo la posición de una, se conoce la de la otra sin perturbarla. Si no hay «acción a distancia», ambas deben tener ya valores definidos; la mecánica cuántica no los da, y por tanto es incompleta. Bohr respondió en el mismo año con un artículo de título idéntico. Schrödinger, escribiendo a Einstein, acuñó <em>Verschränkung</em> (entrelazamiento) y propuso el gato: un gato en una caja con un átomo radiactivo y un frasco de veneno estaría «en una superposición de vivo y muerto».</p></li>
<li><b class="y">1964 y después <span>· Bell y los experimentos</span></b><p>Bell mostró en 1964 que cualquier teoría con variables ocultas locales satisface unas desigualdades que la mecánica cuántica viola. Clauser (1972), Aspect (1982) y los experimentos sin lagunas de 2015 dieron la razón a la mecánica cuántica: no existen variables ocultas locales. El Nobel de Física de 2022 fue para Aspect, Clauser y Zeilinger.</p></li>
</ol>
<div class="box leyenda"><h4>«Dios no juega a los dados»</h4><p>La frase es de una carta de Einstein a Born, de diciembre de 1926: «La mecánica cuántica es muy impresionante. Pero una voz interior me dice que no es todavía la verdadera. La teoría dice mucho, pero apenas nos acerca al secreto del Viejo. Yo, en todo caso, estoy convencido de que Él no juega a los dados». Bohr le respondió, según la tradición de Solvay, «deje de decirle a Dios lo que debe hacer». Se cita para decir que Einstein «se oponía por tonto» a la teoría. En realidad, Einstein reconoció que la teoría era correcta empíricamente, ayudó a su nacimiento (el fotón, las estadísticas de Bose–Einstein, el cuanto) y su objeción de 1935 es una objeción filosófica de realismo y localidad que Bell hizo experimentalmente comprobable. Fue en parte refutada, pero la pregunta era legítima.</p></div>
<div class="box epist"><h4>Realismo, instrumentalismo y la subdeterminación</h4><p>Las interpretaciones de la mecánica cuántica son un caso perfecto de <em>subdeterminación</em>: Copenhague, onda piloto de Bohm (1952), muchos mundos de Everett (1957) y colapso objetivo (GRW, 1986) dan las mismas predicciones, y la elección entre ellas no se decide con experimentos actuales. La actitud de Bohr era instrumentalista y pragmática («no hay un mundo cuántico; hay solo una descripción cuántica abstracta»), la de Einstein, realista. La respuesta de la mayoría de los físicos fue «calla y calcula» (Mermin). Kuhn diría que la teoría cuántica es un paradigma que triunfó por su eficacia, con una interpretación sin consenso; Popper defendió la interpretación realista con propensiones; Lakatos habló de «programas de variables ocultas» y su estado tras Bell.</p></div>
</section>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule la longitud de onda de de Broglie de un electrón de 54 eV.
<details><summary>Respuesta</summary><p>\(\lambda=h/\sqrt{2mE}=1.226/\sqrt{54}\) nm \(=0.167\) nm.</p></details></li>
<li><span class="lvl">Básico</span>Calcule la longitud de onda de una pelota de 0.1 kg a 10 m/s.
<details><summary>Respuesta</summary><p>\(h/(mv)=6.6\times10^{-34}\) m: miles de millones de veces más pequeña que un núcleo; las ondas de materia macroscópicas son inobservables.</p></details></li>
<li><span class="lvl">Intermedio</span>Un electrón en un pozo infinito de 1 nm: calcule \(E_1\) y la longitud de onda del fotón emitido en la transición \(2\to1\).
<details><summary>Respuesta</summary><p>\(E_n=0.376\,n^2\) eV: \(E_1=0.376\) eV; \(\Delta E=3\times0.376=1.13\) eV, \(\lambda=1.1\) µm (infrarrojo).</p></details></li>
<li><span class="lvl">Intermedio</span>Un electrón está localizado en 0.1 nm (el tamaño de un átomo). ¿Cuál es la mínima incertidumbre en su velocidad?
<details><summary>Respuesta</summary><p>\(\Delta p\ge\hbar/(2\Delta x)=5.3\times10^{-25}\) kg·m/s; \(\Delta v=\Delta p/m=5.8\times10^{5}\) m/s: la velocidad en la primera órbita de Bohr es del mismo orden (2.2×10⁶ m/s).</p></details></li>
<li><span class="lvl">Avanzado</span>Explique por qué un electrón en un átomo de radio \(a\) tiene una energía cinética mínima del orden \(\hbar^2/(2ma^2)\) y use eso para estimar el tamaño del átomo de hidrógeno minimizando \(E(a)=\hbar^2/(2ma^2)-e^2/(4\pi\varepsilon_0a)\).
<details><summary>Respuesta</summary><p>Con \(\Delta p\sim\hbar/a\), \(E_k\sim\hbar^2/(2ma^2)\). Minimizando: \(a=4\pi\varepsilon_0\hbar^2/(me^2)=a_0=52.9\) pm y \(E=-13.6\) eV: el átomo es estable porque la incertidumbre impide que el electrón caiga al núcleo.</p></details></li>
<li><span class="lvl">Avanzado</span>La fotografía del Solvay de 1927 incluye una sola mujer. ¿Quién era y qué otros hechos de la época ilustran el papel de las mujeres en la física cuántica?
<details><summary>Respuesta</summary><p>Marie Curie. En la misma época, Lise Meitner (fisión, 1938), Emmy Noether (simetrías y leyes de conservación, 1918) y Maria Goeppert-Mayer (modelo de capas) hicieron contribuciones fundamentales con acceso limitado a cátedras. Se retoma en el capítulo 35.</p></details></li>
</ol>
