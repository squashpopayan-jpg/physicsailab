<p class="lead">El 21 de agosto de 1609, un profesor de Padua subió al campanario de San Marcos, en Venecia, con unos senadores, y les hizo mirar por un tubo de ocho aumentos: la lejana isla de Murano, las velas que se acercaban al puerto, las naves a dos horas de distancia. Les había vendido, o casi, un instrumento holandés inventado el año anterior; los senadores, que valoraban la utilidad militar, le doblaron el sueldo. Pocos meses después Galileo Galilei apuntó ese mismo instrumento al cielo, y vio mundos donde Aristóteles prohibía verlos. Es la mejor historia de la ciencia: un artefacto, un hombre con talento y ambición y una época en que la ciudad, la corte, la Iglesia y las universidades tenían todas algo que ganar o perder con lo que se veía.</p>

<section>
<h2>Un hijo de músico y la ciencia de la naturaleza</h2>
<div class="box contexto"><h4>Una Italia fragmentada, una Iglesia en alerta</h4><p>Galileo nació en Pisa en 1564 (el año en que murió Miguel Ángel y nació Shakespeare), hijo de Vincenzo Galilei, un músico y teórico de la música que atacó con experimentos las doctrinas pitagóricas de la afinación: halló que, para obtener una quinta, la tensión de una cuerda debe cambiar en una razón no de 3:2 sino de 9:4. Es decir, que el cociente de frecuencias va con la <em>raíz cuadrada</em> de la tensión, un resultado que Galileo recordará al escribir los <em>Discursos</em> (capítulo 3). Italia, dividida en ciudades-estado, era un mercado de patrocinios: la República de Venecia (independiente, desafiante del papa), el Gran Ducado de Toscana (Médicis), los Estados Pontificios. Tras el Concilio de Trento (1545-1563) la Contrarreforma había endurecido la vigilancia doctrinal, con el Santo Oficio y el Índice de libros prohibidos. Un científico italiano debía escoger con cuidado sus protectores.</p></div>
<div class="people">
<div class="persona"><b>Galileo Galilei</b><small>1564 – 1642 · Pisa, Padua, Florencia, Arcetri</small><p>Matemático, físico, astrónomo, escritor de prosa brillante. Cortesano y polemista. Tuvo tres hijos con Marina Gamba; dos hijas entraron al convento: Virginia (sor María Celeste) fue su mayor apoyo.</p></div>
<div class="persona"><b>Vincenzo Galilei</b><small>c. 1520 – 1591 · Florencia</small><p>Laudista y teórico. Experimentó con cuerdas para criticar a Zarlino y enseñó a su hijo a desconfiar de la autoridad.</p></div>
<div class="persona"><b>Paolo Sarpi</b><small>1552 – 1623 · Venecia</small><p>Fraile servita, consejero de la República en su pleito con el papa. Amigo de Galileo, le sirvió de interlocutor sobre la caída de los cuerpos.</p></div>
<div class="persona"><b>Robert Belarmino</b><small>1542 – 1621 · Roma</small><p>Cardenal jesuita, teólogo y jefe de la Inquisición en los años 1616. Examinó a Galileo; era un hombre inteligente, que escribió que si hubiera prueba real del movimiento de la Tierra habría que reinterpretar la Biblia.</p></div>
<div class="persona"><b>Cristóbal Clavius</b><small>1538 – 1612 · Roma</small><p>Jesuita, el astrónomo del Colegio Romano y autor de la reforma gregoriana. En 1610-1611 confirmó con sus alumnos las observaciones de Galileo.</p></div>
<div class="persona"><b>Cristóbal Scheiner</b><small>1575 – 1650 · Ingolstadt, Roma</small><p>Jesuita, inventor del pantógrafo (1603) y rival de Galileo en las manchas solares; observó el Sol durante años con gran rigor.</p></div>
<div class="persona"><b>Orazio Grassi</b><small>1583 – 1654 · Roma</small><p>Jesuita, arquitecto y matemático. Su teoría de los cometas (el de 1618) fue el blanco del <em>Saggiatore</em>.</p></div>
<div class="persona"><b>Federico Cesi</b><small>1585 – 1630 · Roma</small><p>Príncipe de Aquasparta, fundó la Accademia dei Lincei (1603), primera sociedad científica moderna. Editó las cartas sobre las manchas solares.</p></div>
<div class="persona"><b>Urbano VIII (Maffeo Barberini)</b><small>1568 – 1644 · Roma</small><p>Papa desde 1623, amigo y admirador de Galileo, poeta, mecenas, firmemente inclinado a la autoridad en tiempos de guerra.</p></div>
</div>
</section>

<section>
<h2>El péndulo, el plano y la ley de la caída</h2>
<h3>La lámpara de Pisa</h3>
<p>Viviani, discípulo y primer biógrafo de Galileo (1654), cuenta que en 1583, a los 19 años, durante una misa, Galileo observó una lámpara oscilar en la catedral de Pisa y notó, midiendo con su pulso, que cada oscilación duraba lo mismo aunque la amplitud disminuyera. De ahí el <em>isocronismo del péndulo</em>. La historia es plausible, pero la lámpara que hoy se muestra es posterior (de 1587). Lo cierto es que Galileo estudió el péndulo toda su vida.</p>
<div class="sim" data-sim="pendulo-galileo" data-title="¿Es el péndulo realmente isócrono?"></div>
<div class="sim-guide"><ul>
<li>Con 5° de amplitud, el periodo es 0.05 % mayor que el de pequeñas oscilaciones: Galileo no podía detectarlo. Con 30°, 1.7 %; con 60°, 7.3 %; con 90°, 18 %. Un reloj de péndulo exige cuidar la amplitud (o usar la curva cicloidal de Huygens, capítulo 13).</li>
</ul></div>
<h3>La ley de la caída: un error, una corrección</h3>
<p>En una carta a Sarpi (1604), Galileo escribe que los cuerpos que caen aumentan su velocidad en proporción a la distancia recorrida: es un error (lo correcto es proporcional al tiempo). La corrección vino con el plano inclinado y con la geometría de Oresme y de los calculadores (capítulo 8). Hacia 1604-1608 hizo rodar bolas por un canal sobre una tabla inclinada y midió los tiempos con un reloj de agua.</p>
<div class="box fuente"><h4>Galileo, <em>Dos nuevas ciencias</em> (1638), Jornada tercera</h4><blockquote>Tomamos un listón de madera de unos doce codos de largo… en cuyo borde habíamos excavado un canal de un dedo de anchura, bien recto y revestido de pergamino lo más liso posible; por él rodaba una bola de bronce muy dura, redonda y pulida… Medíamos el tiempo con una gran vasija llena de agua… La experiencia se repitió cien veces… sin que nunca la diferencia entre dos pesadas alcanzara la décima parte de un latido de pulso.</blockquote><p>Resumen libre. Las distancias recorridas en tiempos iguales guardaban la relación de los cuadrados de los tiempos: la ley de la caída uniformemente acelerada.</p></div>
<div class="sim" data-sim="plano-inclinado" data-title="El plano inclinado y el reloj de agua de Galileo"></div>
<div class="sim-guide"><ul>
<li>Con los datos de Galileo (puntos naranjas) la bola recorre 1, 3.9, 9.0, 15.9, 25.0, 36.1, 49.1 y 63.8 veces la primera distancia: se desvían de 1, 4, 9, 16, 25, 36, 49, 64 apenas un 0.5 % en promedio. Ruido de 0.5 a 2 % en la simulación da una dispersión del mismo orden.</li>
<li>Con la casilla «rueda» la aceleración es \(\tfrac57g\sin\theta\) y \(g\) «deducido» sale 7.0 m/s², no 9.8: Galileo ignoraba la rotación y no pudo obtener el valor de \(g\), pero la <em>ley</em> \(s\propto t^2\) no depende del factor. Un error sistemático en la constante no destruye una ley de proporcionalidad.</li>
</ul></div>
<div class="box epist"><h4>¿Hizo Galileo realmente sus experimentos?</h4><p>Alexandre Koyré (<em>Études galiléennes</em>, 1939) sostuvo que los experimentos de Galileo, tal como los describe, eran imposibles con los medios de la época, y que su ciencia nació del pensamiento matemático y de experimentos mentales, no de la observación: una revolución «platónica». En 1961, Thomas Settle reconstruyó el plano inclinado con un reloj de agua y obtuvo resultados excelentes; en 1973 Stillman Drake estudió los manuscritos (el folio 116v del manuscrito 72, en Florencia) y halló las cifras de las mediciones reales, escritas con la tinta de la época. Las dos lecturas no son excluyentes: hace falta la idealización matemática <em>y</em> la medida. Pero el episodio recuerda que la historia de la ciencia que se escribe desde las obras publicadas puede ser distinta de la que contienen los cuadernos de trabajo.</p></div>
<div class="box epist"><h4>Una prueba por reducción al absurdo</h4><p>En los <em>Discursos</em> Galileo da un argumento lógico contra Aristóteles: sea una piedra pesada que cae más rápido que otra ligera. Átelas: el compuesto debe caer más lento (la ligera frena a la pesada) y más rápido (pesa más): contradicción. Luego todas caen igual. No es una prueba física (omite la resistencia) pero es el modelo de un experimento mental decisivo. Con él se desmonta la regla \(v\propto F/R\) del capítulo 4.</p></div>
<div class="box leyenda"><h4>La torre de Pisa</h4><p>No hay documento de Galileo de la prueba de la torre. La historia viene de Viviani, que escribió 60 años después. Quien sí soltó plomos desde 10 m, en Delft, y publicó el resultado en 1586, fue Simon Stevin con Jan de Groot (capítulo 1). Y el experimento que sí hizo Galileo en el aire (con bolas y péndulos de plomo y corcho) muestra una diferencia real por la resistencia del aire, lo que él supo explicar.</p></div>
</section>

<section>
<h2>El telescopio: ver lo que no se podía ver</h2>
<p>Hans Lipperhey, un óptico de Middelburg, pidió en octubre de 1608 una patente en los Países Bajos por un tubo con lentes que acercaba los objetos. Se denegó (otros lo reclamaban) pero la noticia llegó a Venecia en 1609. Galileo, que se enteró en julio, construyó uno de tres aumentos, luego de ocho, y en pocas semanas uno de unos veinte (con un tubo de plomo y lentes pulidas por él mismo); lo presentó al Senado el 21 de agosto. Era un artefacto de moda, vendido en ferias, y su uso en el cielo no era obvio: nadie lo había apuntado seriamente hacia arriba.</p>
<ol class="chain">
<li><b class="y">Noviembre-diciembre de 1609 <span>· la Luna</span></b><p>La superficie de la Luna no es lisa y perfecta: tiene montañas, cráteres y valles, iluminados con sombras como los de la Tierra. Con el teorema de Pitágoras y la distancia de una cumbre iluminada al terminador, calculó alturas de «más de cuatro millas».</p></li>
<li><b class="y">7 de enero de 1610 <span>· Júpiter</span></b><p>Tres puntos luminosos a su lado, en línea; al día siguiente, cambiados de lugar. El 13 de enero, cuatro. Los siguió durante dos meses: giran en torno a Júpiter. Los llamó «estrellas Medicea» en honor de Cosme II de Médicis, que le pagó el puesto de «filósofo y matemático» de la corte.</p></li>
<li><b class="y">12 de marzo de 1610 <span>· <em>Sidereus Nuncius</em></span></b><p>Un libro de 60 páginas, escrito en cuatro meses y vendido en Venecia en días: la Vía Láctea es un enjambre de estrellas, la Luna es otro mundo, Júpiter tiene satélites.</p></li>
<li><b class="y">Diciembre de 1610 <span>· Venus</span></b><p>Venus tiene fases, como la Luna. Galileo anunció el hallazgo en una anagrama enviada al embajador de los Médicis en Praga («Haec immatura a me iam frustra leguntur oy»), que Kepler intentó descifrar equivocadamente; la solución, revelada en enero de 1611, era «<em>Cynthiae figuras aemulatur mater amorum</em>» («la madre de los amores imita las figuras de Cintia»: Venus imita a la Luna).</p></li>
<li><b class="y">1611-1613 <span>· manchas solares</span></b><p>El Sol, cuerpo «incorruptible», tiene manchas, que aparecen, cambian de forma y rotan con él. Escribió <em>Cartas sobre las manchas solares</em> (1613), publicadas por la Academia de los Linces.</p></li>
</ol>
<div class="sim" data-sim="montanas-luna" data-title="La altura de una montaña de la Luna con el teorema de Pitágoras"></div>
<div class="sim-guide"><ul>
<li>Con una cumbre iluminada a 1/20 del diámetro lunar del terminador, la altura obtenida es de unos 8.7 km: una cifra coherente con «más de cuatro millas». El método es de geometría elemental: un triángulo rectángulo con el radio lunar como cateto.</li>
</ul></div>
<div class="sim" data-sim="lunas-jupiter" data-title="Las cuatro lunas de Júpiter noche tras noche"></div>
<div class="sim-guide"><ul>
<li>Cada luna oscila de lado a lado de Júpiter con su propio periodo (1.77, 3.55, 7.15 y 16.7 días). Galileo, que solo veía la proyección, tuvo que deducir que eran órbitas circulares vistas de canto.</li>
<li>El cociente T²/a³ es el mismo para las cuatro: la tercera ley de Kepler (capítulo 10) rige también este «sistema solar en miniatura», aunque ninguno de los dos lo notó entonces.</li>
</ul></div>
<div class="sim" data-sim="fases-venus" data-title="Las fases de Venus: la observación que separa a Ptolomeo de Copérnico"></div>
<div class="sim-guide"><ul>
<li>En el modelo de Ptolomeo, Venus (siempre entre la Tierra y el Sol) muestra a lo sumo el 44 % de su disco iluminado (nunca gibosa ni llena), con tamaños que varían entre 0.16 y 0.98 UA. En el copernicano pasa por todas las fases, de 0 a 100 %, con el mayor tamaño en fase creciente y el menor en fase llena.</li>
<li>Galileo observó fases gibosas y casi llenas: ¡imposible con Ptolomeo! Pero compatibles con el sistema de Tycho, que se volvió el favorito de los jesuitas. Por eso no fue una prueba del movimiento de la Tierra, sino solo del <em>giro de Venus alrededor del Sol</em>.</li>
</ul></div>
<div class="box epist"><h4>Cuando se desconfía de un instrumento</h4><p>Muchos sabios dudaron al principio de lo visto con el telescopio, y con buenas razones: no había una teoría óptica que explicara cómo formaba imágenes (Kepler la dará en 1611), los telescopios eran de mala calidad y daban imágenes con colores, y lo que se veía podía ser un artefacto de las lentes. En abril de 1610, en Bolonia, Martin Horky (ayudante de Magini) escribió que en una sesión nadie pudo ver con claridad las lunas, y que Galileo era un impostor; Kepler lo ridiculizó. La confianza se logró cuando otros observadores con instrumentos mejores (los jesuitas del Colegio Romano) lo confirmaron, a fines de 1610. Paul Feyerabend, en <em>Contra el método</em>, resalta que Galileo no tenía todavía una prueba independiente de que el telescopio no mentía en el cielo: lo probó en la Tierra y extrapoló. Es un caso modelo de <em>validación de un instrumento nuevo</em>.</p></div>
<div class="box rivalidad"><h4>Scheiner, las manchas y el plagio</h4><p>Las manchas solares las vieron, hacia 1610-1611, Thomas Harriot en Inglaterra, Johannes Fabricius y su padre en Frisia (quien publicó primero, en junio de 1611), Scheiner y Galileo. Scheiner, jesuita, firmaba con el seudónimo «Apelles» y sostuvo que las manchas eran pequeños planetas que pasaban frente al Sol, para salvar su incorruptibilidad; Galileo, en cartas a Mark Welser, probó con geometría que estaban en la superficie del Sol, y acusó a Scheiner de haberle copiado. Scheiner, ofendido, se volvió un enemigo; algunos historiadores creen (sin pruebas) que su rencor influyó en el proceso de 1633. Lo cierto es que los jesuitas, que habían sido aliados de Galileo en 1611, se convirtieron en rivales.</p></div>
</section>

<section>
<h2>La Biblia, Belarmino y 1616</h2>
<div class="box contexto"><h4>Entre Trento y la guerra de los Treinta Años</h4><p>En 1614, el dominico Tommaso Caccini predicó en Florencia contra los matemáticos, con el pasaje bíblico «Varones de Galilea, ¿qué hacéis mirando al cielo?» (Hechos 1,11). En 1615 Galileo respondió por carta a Cristina de Lorena, madre del Gran Duque, con un argumento sobre la relación entre la ciencia y la Escritura: la Biblia enseña cómo ir al cielo, no cómo va el cielo (frase que atribuye al cardenal Baronio). Si una demostración física contradice una interpretación bíblica, hay que reinterpretar el texto. Belarmino respondió, en una carta a Foscarini (abril de 1615), con una posición simétrica: <em>si</em> hubiera una demostración real de que la Tierra se mueve, habría que revisar la Escritura, pero hasta entonces conviene decir que se trata de una hipótesis matemática. Galileo creía tener la demostración (las mareas); no la tenía.</p></div>
<p>En febrero de 1616 los consultores del Santo Oficio calificaron que el Sol inmóvil en el centro era «necio y absurdo en filosofía y formalmente herético», y que el movimiento de la Tierra era «al menos erróneo en la fe». El 5 de marzo se suspendió el <em>De revolutionibus</em> «hasta ser corregido» (se corrigieron diez frases en 1620). Belarmino comunicó a Galileo, el 26 de febrero, que debía abandonar la opinión; consta en el expediente un acta, sin firmar, que prohíbe «de cualquier modo mantenerla, enseñarla o defenderla». Esa hoja volverá en 1633.</p>
</section>

<section>
<h2>Cometas, el Saggiatore y la estrategia de la polémica</h2>
<p>En 1618 aparecieron tres cometas. Orazio Grassi, jesuita del Colegio Romano, dio una conferencia (<em>De tribus cometis</em>) siguiendo a Tycho: eran cuerpos celestes. Galileo, que estaba enfermo, respondió con un <em>Discurso sobre los cometas</em> (1619, firmado por su discípulo Guiducci): eran un efecto óptico, reflexiones de vapores. Grassi contestó con una <em>Libra astronómica</em> (1619), firmada por «Lotario Sarsi». Galileo contestó con el <em>Saggiatore</em> («el ensayador»; 1623), una obra maestra de la prosa polémica, donde aparece:</p>
<div class="box fuente"><h4>El libro de la naturaleza</h4><blockquote>La filosofía está escrita en este grandísimo libro que continuamente tenemos abierto ante los ojos (el universo), pero no se puede comprender si primero no se aprende a comprender la lengua y a conocer los caracteres en que está escrito. Está escrito en lengua matemática, y sus caracteres son triángulos, círculos y otras figuras geométricas, sin las cuales es humanamente imposible entender una sola palabra.</blockquote><p>Galileo, <em>Il Saggiatore</em> (1623). Galileo distingue las cualidades «primarias» (forma, número, movimiento) de las «secundarias» (sabor, color), que «residen solo en la conciencia», una distinción de Demócrito (capítulo 3) que reaparecerá en Descartes y Locke.</p></div>
<p>En el fondo Galileo se equivocó: los cometas son astros, Tycho y Grassi tenían razón. Lo importante es que la discusión llevó a Galileo a formular un criterio de método (hay que tener una prueba matemática antes de hablar de cualquier cosa) y a ganarse enemigos entre los jesuitas.</p>
</section>

<section>
<h2>El Diálogo y el proceso de 1633</h2>
<p>En 1623 su amigo Maffeo Barberini fue elegido papa como Urbano VIII. Galileo fue a Roma a felicitarlo, tuvo seis audiencias en 1624 y salió convencido de que podría escribir sobre el sistema copernicano si lo trataba como <em>hipótesis</em>, sin pretender demostrarlo. Escribió el <em>Diálogo sobre los dos máximos sistemas del mundo</em> (1632): tres interlocutores (Salviati, copernicano; Sagredo, el hombre inteligente y abierto; Simplicio, el aristotélico) discuten cuatro jornadas. El libro tiene el imprimátur romano de 1630, con retoques, y se imprimió en Florencia en febrero de 1632.</p>
<div class="sim" data-sim="barco-galileo" data-title="El barco de Galileo: la relatividad del movimiento uniforme"></div>
<div class="sim-guide"><ul>
<li>En el sistema de la orilla la piedra describe una parábola; en el del barco, cae en vertical y llega al pie del mástil. Cualquier experimento mecánico hecho en una cabina sin ventanas da el mismo resultado con el barco en reposo o en movimiento uniforme.</li>
<li>Galileo presenta este argumento contra la objeción de que una Tierra en movimiento dejaría atrás los objetos soltados. Es lo que hoy llamamos <em>relatividad galileana</em>, antecedente del principio de Einstein (capítulo 26).</li>
</ul></div>
<div class="box rivalidad"><h4>El argumento de Urbano en boca de Simplicio</h4><p>Urbano VIII había pedido que se incluyera su argumento favorito: que Dios, siendo omnipotente, podría producir los mismos fenómenos de cualquier otra manera, y por tanto ninguna teoría física puede demostrar cómo es el mundo. Galileo lo incluyó, pero en boca de Simplicio al final del libro, donde Salviati lo recibe con cortesía y lo deja de lado. Para Urbano, aquello fue una burla personal. Hay más: en 1632 el papa estaba aislado: la guerra de los Treinta Años le había enemistado con España, los cardenales proespañoles lo acusaban de blando con los protestantes, y toleraba mal que un libro licenciado resultara escandaloso. El Santo Oficio, que halló el acta de 1616, citó a Galileo a Roma en octubre de 1632. Tenía 68 años y estaba enfermo.</p></div>
<p>El proceso (abril-junio de 1633) fue largo y penoso. Galileo sostuvo que su libro no defendía a Copérnico; la acusación mostró lo contrario. Se negociaba una salida: admitir un «exceso de vanidad» y retractarse. El 22 de junio, vestido de penitente en el convento de Santa María sobre Minerva, abjuró de rodillas: «con sincero corazón y fe no fingida, abjuro, maldigo y detesto los dichos errores y herejías». Fue condenado a prisión «a voluntad» (conmutada por arresto domiciliario), el <em>Diálogo</em> fue prohibido y se le impuso recitar semanalmente siete salmos penitenciales. Pasó sus últimos nueve años en Arcetri, cerca del convento de su hija; ella murió en 1634. Se quedó ciego en 1637.</p>
<div class="box leyenda"><h4>«Eppur si muove»</h4><p>La frase «y sin embargo se mueve» que Galileo habría murmurado al abjurar no aparece en ningún testimonio de su tiempo: la imprime por primera vez Giuseppe Baretti en 1757, en Londres. Para quien la dijo, no hay un solo testigo. Galileo, vencido, tuvo cuidado de no volver a provocar al Santo Oficio, y siguió trabajando.</p></div>
<div class="box epist"><h4>Prueba y persuasión</h4><p>El caso de Galileo suele contarse como el choque entre ciencia y religión. Los historiadores (Finocchiaro, Biagioli, Redondi) muestran que fue más complejo: un conflicto de poder entre un cortesano ambicioso, jesuitas ofendidos, un papa inseguro, un cardenal que defendía un criterio de prueba razonable, y una disputa epistemológica sobre qué significa «demostrar». Galileo no tenía una prueba concluyente del movimiento de la Tierra: sus mareas son incorrectas (decía que la rotación y el movimiento orbital producían oscilaciones de los mares y negaba que la Luna influyera: Kepler tenía razón), y la paralaje estelar no se había observado. Su pretensión de certeza era mayor que sus pruebas. La Iglesia se equivocó al prohibir; Galileo, al exigir certeza que no tenía.</p></div>
</section>

<section>
<h2>Los Discursos: la ciencia de lo que se mueve y de lo que resiste</h2>
<p>Condenado, Galileo escribió su mejor obra: <em>Discursos y demostraciones matemáticas en torno a dos nuevas ciencias</em> (Leiden, 1638, impreso por los Elzevir, fuera del alcance de la Inquisición). La primera ciencia es la de la <em>resistencia de los materiales</em>: una ley de escala (el área crece con el cuadrado y el volumen con el cubo) que explica por qué un gigante de mismas proporciones se rompería y por qué los huesos de los animales grandes son más gruesos. La segunda, la del <em>movimiento</em>: caída uniforme, plano inclinado, péndulo, y la composición de un movimiento uniforme horizontal con uno uniformemente acelerado vertical, que da la <span class="term">trayectoria parabólica</span>.</p>
<div class="eq key" data-name="Leyes de Galileo (Discursos, 1638)">\[s=\tfrac12 a t^2,\qquad v=a t,\qquad y=x\tan\alpha-\frac{g\,x^2}{2v_0^2\cos^2\alpha}.\]</div>
<p>Con esa obra la física tuvo, por primera vez, un modelo de cómo se hace una ley: idealizar (plano sin rozamiento, vacío), medir (reloj de agua, péndulos), proponer una relación matemática, deducir consecuencias que se pueden comprobar. Huygens, Newton y todo lo demás vienen de ahí. Newton nació, por la coincidencia de calendarios, el año de la muerte de Galileo.</p>
<div class="box note"><h4>Rehabilitación</h4><p>El <em>Diálogo</em> salió del Índice en 1835. En 1992, tras una comisión de estudio, Juan Pablo II reconoció ante la Academia Pontificia que los teólogos de entonces habían cometido un error al confundir una interpretación de la Escritura con una cuestión de física; no fue una absolución del proceso sino un reconocimiento de que se había mal entendido la relación entre fe y ciencia.</p></div>

<li>Elija a Torricelli (1608-1647): discípulo de Galileo en Arcetri en 1641, es el puente a la física del vacío (capítulo 12).</li>

<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una bola maciza rueda por un plano de 4° de inclinación. Calcule su aceleración y la distancia recorrida en 1, 2 y 3 s.
<details><summary>Respuesta</summary><p>\(a=\tfrac57\times9.81\times\sen4^\circ=0.489\) m/s². \(s=\tfrac12at^2\): 0.244, 0.978 y 2.20 m (razones 1:4:9).</p></details></li>
<li><span class="lvl">Básico</span>Con los datos de Galileo (33, 130, 298, … puntos) calcule la desviación porcentual del tercer valor respecto de 9 veces el primero.
<details><summary>Respuesta</summary><p>\(298/33=9.03\); desviación +0.3 %.</p></details></li>
<li><span class="lvl">Intermedio</span>Un reloj de péndulo de 1 m de longitud se pone a oscilar con 60° de amplitud en lugar de 5°. ¿Cuánto se atrasa por hora?
<details><summary>Respuesta</summary><p>Periodo ×1.073 (60°) frente a ×1.0005 (5°): atraso relativo \(1-1.0005/1.073=6.8\%\), unos 4 minutos por hora.</p></details></li>
<li><span class="lvl">Intermedio</span>El período de Calisto es 16.689 d y su semieje 26.36 radios de Júpiter; el de Ío, 1.769 d y 5.905 radios. Compruebe la tercera ley de Kepler.
<details><summary>Respuesta</summary><p>\(T^2/a^3\): Calisto \(278.5/18\,316=0.01521\); Ío \(3.130/205.9=0.01520\). Iguales.</p></details></li>
<li><span class="lvl">Avanzado</span>Compare las posturas de Koyré (los experimentos de Galileo eran mentales) y de Drake (eran reales) respecto de qué evidencia las separa y por qué ambas pueden ser parcialmente ciertas.
<details><summary>Respuesta</summary><p>Evidencia: el manuscrito 72 contiene números de medidas con una dispersión realista; los textos publicados describen idealizaciones. Una ciencia como la de Galileo requiere ambas: la <em>idealización</em> (qué magnitudes importan, qué se desprecia) y la <em>medida</em> (que cumple de modo aproximado). La lección: la distinción entre experimento mental y real no es tajante; el segundo orienta y el primero valida.</p></details></li>
</ol>
