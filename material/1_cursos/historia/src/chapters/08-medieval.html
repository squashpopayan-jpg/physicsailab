<p class="lead">En 1377, el obispo de Lisieux, un clérigo normando consejero del rey Carlos V de Francia, terminó un libro en francés sobre el cielo y el mundo. En él construía, con argumentos que parecen de Galileo, el caso a favor de que la Tierra gira cada día sobre su eje: si un hombre dentro de un barco que avanza lanza una piedra hacia arriba, esta cae junto a él, igual que si el barco estuviera quieto. Y luego, después de refutar todos los argumentos contrarios, concluía: «y sin embargo, todos sostienen, y yo lo creo, que los cielos se mueven y que la Tierra no». Nicolás Oresme sabía muy bien lo que decía. Aquel desafío, el de pensar cómo sería el mundo si… fue la gran invención intelectual de la Edad Media.</p>

<section>
<h2>Traducir para aprender</h2>
<div class="box contexto"><h4>De Toledo a París</h4><p>Cuando Alfonso VI de Castilla conquistó Toledo en 1085, la ciudad conservaba bibliotecas árabes enteras. Durante dos siglos un grupo de traductores, cristianos, judíos y árabes (entre ellos Gerardo de Cremona, c. 1114-1187, que vertió al latín unas setenta obras) convirtieron al latín el <em>Almagesto</em>, los <em>Elementos</em> de Euclides, la <em>Física</em> de Aristóteles con los comentarios de Averroes, el <em>Canon</em> de Avicena y el <em>Álgebra</em> de al-Juarismi. Alfonso X el Sabio (1252-1284) encargó las <em>Tablas alfonsíes</em> (1272), que se usarán hasta Copérnico. Paralelamente nacen las universidades: Bolonia (c. 1088), París (c. 1150-1200), Oxford (c. 1167), Cambridge (1209) y Salamanca (1218), corporaciones de maestros y estudiantes con estatutos propios, que otorgan títulos y administran justicia a sus miembros.</p></div>
<p>Con las traducciones llegó un corpus aristotélico completo, con una física, una cosmología y una teoría de la ciencia. La Iglesia reaccionó con cautela: en 1210 y 1215 prohibió enseñar la filosofía natural de Aristóteles en París, pero hacia 1255 el texto ya era obligatorio. Tomás de Aquino (1225-1274) lo incorporó a la teología. El método era la <span class="term">disputa escolástica</span>: se formula una pregunta (<em>quaestio</em>), se enumeran argumentos a favor y en contra, se responde y se refutan las objeciones. Era una cultura de la discusión pública y razonada, heredera de la crítica jónica (capítulo 3), con la que los estudiantes aprendían a defender tesis contrarias.</p>
<div class="people">
<div class="persona"><b>Roberto Grosseteste</b><small>c. 1175 – 1253 · Oxford, Lincoln</small><p>Canciller de Oxford y obispo. Pensó el universo como una expansión de luz (<em>De luce</em>), propuso un método de «resolución y composición» y trabajó la óptica y el arcoíris.</p></div>
<div class="persona"><b>Roger Bacon</b><small>c. 1214 – c. 1292 · Oxford, París</small><p>Franciscano. En el <em>Opus maius</em> (1267) escribió al papa Clemente IV que la «ciencia experimental» debía regir las demás. Estudió óptica, espejos y lentes.</p></div>
<div class="persona"><b>Pedro Peregrino de Maricourt</b><small>siglo XIII · Picardía</small><p>Ingeniero militar. Su <em>Epistola de magnete</em> (1269), escrita durante el sitio de Lucera, describe experimentos con imanes: polos, atracción, repulsión, y una rueda de movimiento perpetuo (que no funciona).</p></div>
<div class="persona"><b>Teodorico de Freiberg</b><small>c. 1250 – c. 1310 · Colonia, París</small><p>Dominico. Su tratado <em>De iride</em> (c. 1304-1310) explica el arcoíris con experimentos con frascos de agua: dos refracciones y una reflexión en cada gota.</p></div>
<div class="persona"><b>Guillermo de Ockham</b><small>c. 1287 – 1347 · Oxford, Aviñón, Múnich</small><p>Franciscano. Nominalista: lo real son los individuos. De él viene la «navaja»: no multiplicar las entidades sin necesidad. Excomulgado, murió en Múnich, probablemente de peste.</p></div>
<div class="persona"><b>Tomás Bradwardine</b><small>c. 1295 – 1349 · Oxford, Canterbury</small><p>Matemático. Su <em>Tratado de las proporciones</em> (1328) corrige la regla de Aristóteles con una función logarítmica. Arzobispo de Canterbury durante pocas semanas: murió de peste.</p></div>
<div class="persona"><b>Juan Buridán</b><small>c. 1300 – c. 1360 · París</small><p>Dos veces rector de la universidad de París. Desarrolló la teoría del <em>impetus</em>: el motor imprime al móvil una cualidad proporcional a su velocidad y a su cantidad de materia.</p></div>
<div class="persona"><b>Nicolás Oresme</b><small>c. 1320 – 1382 · París, Lisieux</small><p>Consejero de Carlos V, traductor de Aristóteles al francés, obispo. Inventó las gráficas de «latitud de las formas», demostró que la serie armónica diverge y discutió el movimiento de la Tierra.</p></div>
<div class="persona"><b>Nicolás de Cusa</b><small>1401 – 1464 · Kues, Roma</small><p>Cardenal y filósofo. En <em>De docta ignorantia</em> (1440) sostuvo que el universo no tiene centro ni límite y que la Tierra se mueve como cualquier otro astro.</p></div>
</div>
</section>

<section>
<h2>1277: una condena que abrió posibilidades</h2>
<p>En marzo de 1277, el obispo de París Étienne Tempier condenó 219 proposiciones, entre ellas varias de Aristóteles y de Averroes: se consideraban un límite a la omnipotencia divina. Una de las condenadas decía que Dios no podía crear más de un mundo; otra, que no podía mover el cielo en línea recta y dejar un vacío tras de sí. Para los filósofos, la lección fue paradójica: <em>puede pensarse</em> que Dios hiciera mundos múltiples o un vacío, y es lícito estudiar qué ocurriría. Pierre Duhem (1913) vio aquí el nacimiento de la ciencia moderna, porque el pensamiento hipotético liberó la física del dogma aristotélico. Los historiadores actuales (Edward Grant) matizan: la condena cambió los márgenes de la discusión, pero también frenó a algunos, y el progreso medieval tuvo también otras causas.</p>
<div class="box epist"><h4>Pensar lo contrafáctico</h4><p>«¿Qué pasaría si Dios hubiera puesto un vacío?» es un <em>experimento mental</em>. La física moderna lo usa constantemente: el ascensor de Einstein, el gato de Schrödinger, el demonio de Maxwell. Los escolásticos desarrollaron el hábito de examinar situaciones imposibles para extraer consecuencias, y eso explica que Oxford y París produjeran antes que nadie análisis del movimiento <em>sin</em> resistencia, del movimiento <em>en el vacío</em> o del infinito.</p></div>
</section>

<section>
<h2>Calculadores de Oxford: medir lo que no se había medido</h2>
<p>En el Merton College de Oxford, un grupo de maestros (Bradwardine, Heytesbury, Swineshead, Dumbleton, en la década de 1320-1350) estudiaron las <em>cualidades que varían de intensidad</em>: el calor, la blancura, la velocidad. ¿Cómo se pueden comparar intensidades? Crearon un lenguaje de «grados», «latitudes» y proporciones.</p>
<ol class="chain">
<li><b class="y">1328 <span>· Bradwardine</span></b><p>La regla de Aristóteles \(v\propto F/R\) tiene un defecto: si \(F<R\) (un niño empuja una roca) debería haber un movimiento lento, pero en la práctica no hay ninguno. Bradwardine propone que la velocidad crece al multiplicar la razón \(F/R\): doblar la velocidad requiere <em>elevar al cuadrado</em> la razón. En lenguaje actual, \(v\propto\ln(F/R)\), y nula si \(F\le R\).</p></li>
<li><b class="y">c. 1335 <span>· Heytesbury</span></b><p>Distinguen el movimiento uniforme del «uniformemente difforme» (en el que la velocidad cambia al mismo ritmo) y enuncian la <span class="term">regla de la velocidad media</span>: un móvil que parte del reposo y acelera de modo uniforme recorre en un tiempo dado la misma distancia que otro que se moviera uniformemente durante ese tiempo con la velocidad del <em>instante medio</em>.</p></li>
<li><b class="y">c. 1350 <span>· Oresme</span></b><p>Representa la velocidad con una altura y el tiempo con una base: la distancia es el área, y el triángulo del movimiento uniformemente difforme equivale al rectángulo de la velocidad media. Es una demostración gráfica del teorema.</p></li>
<li><b class="y">1551 <span>· Domingo de Soto</span></b><p>El dominico español, en su comentario a la <em>Física</em>, aplica por primera vez en forma explícita la regla a la caída libre: la caída es un movimiento uniformemente difforme. Galileo llegará a lo mismo en 1604 y lo demostrará con el plano inclinado.</p></li>
</ol>
<div class="eq key" data-name="Regla de Merton (velocidad media)">\[s=\frac{v_0+v_f}{2}\,t\qquad\Longrightarrow\qquad s=\tfrac12\,a\,t^2\quad(v_0=0).\]</div>
<div class="sim" data-sim="oresme" data-title="Oresme: la distancia es el área bajo la gráfica de la velocidad"></div>
<div class="sim-guide"><ul>
<li>En el movimiento acelerado, las distancias recorridas en intervalos de tiempo iguales están en la razón 1 : 3 : 5 : 7 : 9… Los números impares serán la clave experimental de Galileo en el plano inclinado (capítulo 11).</li>
<li>Con el movimiento uniforme, todas las distancias son iguales. La línea de puntos es la velocidad media, a mitad de camino.</li>
</ul></div>
<div class="box epist"><h4>Teoría sin hipótesis física</h4><p>Oresme y los calculadores tenían las matemáticas del movimiento uniformemente acelerado casi tres siglos antes de Galileo, pero no la hipótesis de que las cosas que caen se mueven así. Para ellos era un ejercicio de lógica sobre «qué pasaría si», sin compromiso con el mundo real. La contribución de Galileo no fue la geometría, sino atreverse a identificar la naturaleza con una de las posibilidades y a someterla a medida. Es un buen ejemplo de que una teoría matemática no se convierte en ciencia hasta que alguien afirma que la naturaleza la cumple, y la contrasta.</p></div>
<div class="sim" data-sim="armonica" data-title="Oresme y la serie armónica: crece sin límite"></div>
<div class="sim-guide"><ul>
<li>Agrupe \(1+\tfrac12+(\tfrac13+\tfrac14)+(\tfrac15+\dots+\tfrac18)+\cdots\): cada paréntesis suma al menos ½. Con \(2^k\) términos, la suma es al menos \(1+k/2\). Con \(k=20\) (más de un millón de términos) apenas llega a 14.4: diverge, pero con una lentitud extrema.</li>
</ul></div>
</section>

<section>
<h2>Impetus: la primera crítica seria a Aristóteles</h2>
<p>Filópono (capítulo 6) y Avicena (capítulo 7) habían propuesto que el lanzador imprime algo al proyectil. Buridán lo hizo con claridad en el siglo XIV:</p>
<div class="box fuente"><h4>Buridán, <em>Quaestiones super octo libros Physicorum</em> (hacia 1330-1340)</h4><blockquote>El motor, al mover el móvil, le imprime cierto impetus, cierta fuerza capaz de moverlo en la dirección en que el motor lo impulsa, hacia arriba, hacia abajo, a un lado o en círculo. Cuanto más rápidamente mueve el motor al móvil, tanto más intenso es el impetus que le imprime… Y el impetus es mayor cuanta más materia contiene el cuerpo.</blockquote><p>Paráfrasis de la traducción de A. Maier. La medida del impetus es la <em>velocidad por la cantidad de materia</em>: la cantidad de movimiento, \(p=mv\).</p></div>
<p>Con esta idea se explican varias cosas: por qué una piedra pesada lanzada llega más lejos que una pluma, por qué un cuerpo que cae se acelera (la gravedad le va añadiendo impetus continuamente) y, de forma importante, por qué los astros siguen moviéndose: Dios les dio un impetus al crearlos, y no hace falta una inteligencia que empuje las esferas. El impetus se gastaba, según Buridán, solo por resistencia del medio y por la gravedad opuesta; si no hubiera resistencia, nunca se agotaría. Es casi la inercia. Pero está lejos todavía: el impetus es una causa <em>interna</em> del móvil, algo que se «tiene» y se gasta, mientras que la inercia de Newton es un estado que no necesita causa.</p>
<div class="sim" data-sim="bradwardine" data-title="De Aristóteles a Bradwardine: velocidad según la razón fuerza/resistencia"></div>
<div class="sim-guide"><ul>
<li>La recta de Aristóteles no se anula nunca: aun con una fuerza menor que la resistencia habría movimiento. La curva de Bradwardine vale cero cuando \(F=R\) y crece con el logaritmo de la razón.</li>
<li>Es una de las primeras funciones <em>no lineales</em> propuestas en física, escrita con proporciones y no con símbolos.</li>
</ul></div>
</section>

<section>
<h2>La luz: gafas, arcoíris e imanes</h2>
<p>El mundo medieval fue de gran creatividad técnica y empírica en la óptica. Hacia 1286 se fabricaron las primeras lentes para leer (gafas) en Pisa o Florencia; un sermón de 1306 de fray Giordano da Pisa dice que «no hace aún veinte años» que se inventó. Bacon (1267) había dado la teoría de lentes y espejos de Alhazen a los occidentales. Y hacia 1304, Teodorico de Freiberg resolvió con un experimento ingenioso el viejo problema del arcoíris:</p>
<ol class="chain">
<li><b class="y">El modelo</b><p>Una esfera de vidrio llena de agua es una gota ampliada. Los rayos del sol entran, se refractan, se reflejan en la pared posterior y salen refractados. Se mira al frasco desde distintos ángulos y se ve qué colores salen.</p></li>
<li><b class="y">El resultado</b><p>Una sola reflexión da el arco primario; dos, el secundario, más débil e invertido. Los colores aparecen en la segunda refracción.</p></li>
<li><b class="y">La cifra</b><p>Descartes (1637) calculó con la ley de refracción que hay una desviación mínima: 137.5° para el arco primario y 230° para el secundario. El rojo está a 42.4° del punto antisolar y el violeta a 40.5°; el arco secundario, a 50.4° (rojo) y 53.7° (violeta). Newton explicó el color con la dispersión (capítulo 15).</p></li>
</ol>
<div class="sim" data-sim="arcoiris" data-title="El arcoíris en una gota de lluvia"></div>
<div class="sim-guide"><ul>
<li>Desplace el parámetro de impacto: cerca del mínimo de la gráfica de la derecha, muchos rayos salen en la misma dirección. Eso concentra la luz en un arco y no en una mancha.</li>
<li>Cambie el índice entre 1.331 (rojo) y 1.344 (violeta): el arco se ensancha y aparecen los colores. En el arco secundario el orden de los colores se invierte.</li>
</ul></div>
<p>En 1269 Pedro Peregrino describió en una carta a un amigo experimentos con una piedra imán esférica (<em>terrella</em>): cubierta con agujas de hierro, estas se alinean según «meridianos» que convergen en dos puntos, a los que llamó <em>polos</em> (palabra suya); al romper el imán, cada trozo tiene dos polos. Es el primer tratado experimental sobre el magnetismo, y Gilbert (capítulo 12) lo conocía.</p>
</section>

<section>
<h2>Cusa, la Peste y el final del ciclo</h2>
<div class="box contexto"><h4>La Peste Negra (1347-1351)</h4><p>La peste llegó a Europa desde el mar Negro en 1347 y mató entre un tercio y la mitad de la población. Murieron maestros (Bradwardine y probablemente Ockham), cerraron escuelas y se vació el tejido urbano. Pero los efectos económicos fueron complejos: la escasez de mano de obra subió los salarios, impulsó la mecanización y favoreció a las ciudades. En el aspecto intelectual, las cifras no permiten concluir que detuvo la física escolástica: Buridán y Oresme escriben hacia 1350-1380; lo que sí cambia es la atmósfera, con más preocupación por la muerte y la salvación que por la cuantificación de formas.</p></div>
<p>Oresme (1377) había desarmado todas las objeciones contra la rotación de la Tierra y se había detenido en el último paso por razones de fe. Nicolás de Cusa (1440) sí lo dio, aunque no como astrónomo sino como filósofo: si Dios es infinito, el universo no puede tener un centro ni un borde; todo está en movimiento, la Tierra incluida; cada cuerpo es el centro desde su propio punto de vista. Ni Cusa ni Oresme dieron cálculos. Copérnico, un siglo después, será el astrónomo que sí los haga (capítulo 9).</p>
<div class="box leyenda"><h4>«En la Edad Media se creía que la Tierra era plana»</h4><p>Es uno de los mitos más persistentes. Beda (725), Isidoro (c. 630), Hildegarda, Santo Tomás, Dante y, sobre todo, el libro de texto universitario del siglo XIII, <em>De sphaera</em> de Sacrobosco, dan por hecho que la Tierra es una esfera. El mito nace en el siglo XIX: Washington Irving inventó en su biografía de Colón (1828) una escena en la que los eruditos de Salamanca objetaban que se caería por el borde, y luego Draper y White lo usaron en su relato del «conflicto entre ciencia y religión». La discusión con Colón era sobre el <em>tamaño</em> de la Tierra: los sabios tenían razón, y él se equivocaba (suponía que Asia estaba mucho más cerca). Jeffrey Burton Russell lo documentó en <em>Inventing the Flat Earth</em> (1991).</p></div>
<div class="box leyenda"><h4>Otras leyendas medievales</h4><p><b>El asno de Buridán</b> (un asno entre dos fardos iguales moriría de hambre) no aparece en los escritos de Buridán; el argumento se encuentra antes en Aristóteles y al-Ghazali. <b>La navaja de Ockham</b> «<em>entia non sunt multiplicanda praeter necessitatem</em>» no se halla con esas palabras en Ockham; es una síntesis posterior de varias frases suyas. <b>«¿Cuántos ángeles caben en la punta de un alfiler?»</b> no consta como tema de ninguna disputa medieval real: es una sátira del siglo XVII sobre la escolástica.</p></div>

<div class="sim" data-sim="vidas" data-ids="gerardo,sacrobosco,grosseteste,rbacon,aquino,teodorico,ockham,bradwardine,buridan,oresme,cusa" data-title="Los maestros medievales: quién pudo conocer a quién"></div>

<li>Buridán y Oresme coincidieron en París (Oresme fue estudiante allí hacia 1340) y se leyeron: Oresme cita a Buridán en el <em>Livre du ciel</em>. Con edad mínima de 20 años la coincidencia es larga.</li>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un móvil parte del reposo y acelera de manera uniforme hasta 20 m/s en 4 s. ¿Qué distancia recorre según la regla de Merton? ¿Y en el último segundo?
<details><summary>Respuesta</summary><p>Velocidad media 10 m/s, \(s=40\) m. La aceleración es 5 m/s²: en el primer segundo recorre 2.5 m y en el cuarto 17.5 m (razón 1:7).</p></details></li>
<li><span class="lvl">Básico</span>Con \(n=1.333\), calcule el ángulo de incidencia del arco primario y su desviación.
<details><summary>Respuesta</summary><p>\(\cos^2i=(n^2-1)/3=0.2593\Rightarrow i=59.4^\circ\). \(r=\arcsin(\sen i/n)=40.2^\circ\). \(D=180^\circ+2i-4r=137.9^\circ\) y el arco está a \(180^\circ-D=42.1^\circ\) del punto antisolar.</p></details></li>
<li><span class="lvl">Intermedio</span>Con la regla de Bradwardine \(v=k\ln(F/R)\), si \(F=2R\) la velocidad es \(v_1\). ¿Qué razón \(F/R\) duplica la velocidad? ¿Y con la regla de Aristóteles?
<details><summary>Respuesta</summary><p>Bradwardine: \(2k\ln2=k\ln4\) → \(F/R=4\) (se eleva al cuadrado). Aristóteles: \(v\propto F/R\): \(F/R=4\) duplicaría la velocidad de \(F/R=2\); la diferencia está en los valores bajos, cerca de \(F=R\).</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre con la agrupación de Oresme que \(H(2^k)\ge1+k/2\), y calcule cuántos términos hacen falta como mínimo para superar 10.
<details><summary>Respuesta</summary><p>Cada bloque \(\tfrac1{2^{j}+1}+\dots+\tfrac1{2^{j+1}}\) tiene \(2^j\) términos, cada uno al menos \(1/2^{j+1}\): suma ≥ ½. Para \(1+k/2\ge10\) hace falta \(k=18\), es decir \(2^{18}=262\,144\) términos; el valor real basta con unos 12 367.</p></details></li>
<li><span class="lvl">Avanzado</span>La tesis de Duhem sostiene que 1277 fue el origen de la ciencia moderna. Enumere dos evidencias a favor y dos en contra y diga qué tipo de documentos las resolverían.
<details><summary>Respuesta</summary><p>A favor: surgen discusiones sobre vacío, mundos múltiples y movimiento terrestre en París en las décadas siguientes (Buridán, Oresme). En contra: esos temas ya se debatían antes; muchos maestros se ciñeron más al texto por prudencia; y las matemáticas de Oxford, ajenas a París, no dependen de la condena. Se resolvería con series de comentarios a la <em>Física</em> fechados antes y después, comparando frecuencia y tono de las cuestiones afectadas.</p></details></li>
</ol>
<div class="box note"><h4>Para profundizar</h4><p>E. Grant, <em>The Foundations of Modern Science in the Middle Ages</em> (1996). A. C. Crombie, <em>Robert Grosseteste and the Origins of Experimental Science</em> (1953). M. Clagett, <em>The Science of Mechanics in the Middle Ages</em> (1959). J. B. Russell, <em>Inventing the Flat Earth</em> (1991). P. Duhem, <em>Le système du monde</em> (1913-1959). J. Jeans, <em>Historia de la física</em> (1948), cap. IV. Oresme, <em>Le livre du ciel et du monde</em> (1377).</p></div>
