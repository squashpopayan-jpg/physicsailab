<p class="lead">El 23 de septiembre de 1846, en el Observatorio de Berlín, el astrónomo Johann Galle recibió una carta de un matemático francés, Urbain Le Verrier, que le pedía que apuntara su telescopio a un punto del cielo en la constelación de Capricornio, donde debía haber un planeta. Esa misma noche, en menos de media hora, Galle lo encontró a un grado del lugar calculado. Se trataba de Neptuno, hallado con lápiz y papel a partir de las irregularidades de Urano. Para muchos fue el mayor triunfo de la física newtoniana: se había visto un planeta con la ley de la gravitación antes de verlo con el ojo. Pero para llegar a esa precisión hizo falta casi siglo y medio de matemáticos que reescribieron los <em>Principia</em> en otro idioma.</p>

<section>
<h2>Un siglo de matemáticos</h2>
<div class="box contexto"><h4>De las academias a las cortes</h4><p>La ciencia del siglo XVIII se hizo en las academias que sostenían los monarcas ilustrados: la de París (1666), Berlín (1700, reorganizada por Federico II en 1744), San Petersburgo (1724, fundada por Pedro el Grande con el consejo de Leibniz). Los científicos eran funcionarios: se les encargaban mapas, calendarios, tablas de navegación y expediciones. Su producción se publicaba en las <em>Mémoires</em> de cada academia, y la correspondencia entre sabios (Euler escribió casi diez mil cartas) conectaba Europa. Los problemas prácticos (hallar la longitud en el mar, predecir la Luna, conocer la forma de la Tierra) fijaban la agenda; el Parlamento británico ofreció en 1714 hasta 20 000 libras por un método de longitud. La mecánica se convirtió en una matemática aplicada, y el idioma que la sostenía fue el cálculo.</p></div>
<div class="people">
<div class="persona"><b>Jakob y Johann Bernoulli</b><small>1654 – 1705 · 1667 – 1748 · Basilea</small><p>Hermanos matemáticos y rivales. Johann lanzó la braquistócrona (1696) y fue maestro de Euler; ambos aprendieron el cálculo de Leibniz y lo desarrollaron.</p></div>
<div class="persona"><b>Daniel Bernoulli</b><small>1700 – 1782 · Basilea, San Petersburgo</small><p>Hijo de Johann. <em>Hydrodynamica</em> (1738): relación entre presión y velocidad de un fluido. Fue quien propuso la teoría cinética de los gases.</p></div>
<div class="persona"><b>Leonhard Euler</b><small>1707 – 1783 · Basilea, San Petersburgo, Berlín</small><p>El matemático más productivo de la historia (casi 900 publicaciones). Perdió el ojo derecho en 1738 y quedó ciego en 1771; siguió dictando. Fundó la mecánica del sólido, la hidrodinámica y el cálculo de variaciones.</p></div>
<div class="persona"><b>Émilie du Châtelet</b><small>1706 – 1749 · Cirey, París</small><p>Matemática y física. Tradujo y comentó los <em>Principia</em> al francés (publicado en 1759) y defendió la fuerza viva de Leibniz. Murió de un parto, a los 42 años.</p></div>
<div class="persona"><b>Pierre Louis Maupertuis</b><small>1698 – 1759 · París, Berlín</small><p>Dirigió la expedición a Laponia (1736-1737) que midió un grado de meridiano y confirmó la forma achatada de la Tierra; presidió la Academia de Berlín. Formuló el principio de mínima acción.</p></div>
<div class="persona"><b>Charles-Marie de La Condamine</b><small>1701 – 1774 · París, Quito</small><p>Dirigió la expedición geodésica al virreinato de Quito (1735-1744), con Godin, Bouguer, Jorge Juan y Antonio de Ulloa. Volvió bajando el Amazonas.</p></div>
<div class="persona"><b>Jean le Rond d'Alembert</b><small>1717 – 1783 · París</small><p>Hijo natural abandonado en las escaleras de una iglesia (Saint-Jean-le-Rond). Principio de d'Alembert (1743); coeditor de la <em>Enciclopedia</em>.</p></div>
<div class="persona"><b>Joseph-Louis Lagrange</b><small>1736 – 1813 · Turín, Berlín, París</small><p><em>Mécanique analytique</em> (1788): toda la mecánica a partir de un principio y un cálculo, «sin una sola figura».</p></div>
<div class="persona"><b>Pierre-Simon Laplace</b><small>1749 – 1827 · París</small><p><em>Mécanique céleste</em> (1799-1825). Estabilidad del sistema solar, hipótesis nebular, probabilidades. Ministro del Interior de Napoleón durante seis semanas.</p></div>
<div class="persona"><b>Henry Cavendish</b><small>1731 – 1810 · Londres</small><p>Rico, tímido, casi misógino: hablaba lo menos posible. Descubrió la composición del agua, el hidrógeno («aire inflamable») y la densidad de la Tierra; casi nada publicó.</p></div>
<div class="persona"><b>William Rowan Hamilton</b><small>1805 – 1865 · Dublín</small><p>Astrónomo real de Irlanda. A los 22 años dio una formulación de la óptica y de la mecánica con una sola función.</p></div>
</div>

<section>
<h2>Leibniz, Newton y el cálculo</h2>
<div class="box rivalidad"><h4>La guerra del cálculo</h4><p>Newton elaboró el cálculo de «fluxiones» en 1665-1666 pero no lo publicó. Leibniz, en París, lo creó de manera independiente en 1675-1676 (con la notación \(\dd x\), \(\int\) que usamos) y lo publicó en 1684. En 1699 un matemático suizo acusó a Leibniz de plagio; en 1711 Leibniz pidió a la Royal Society que lo desmintiera; Newton, su presidente, nombró un comité y redactó el informe en secreto (<em>Commercium epistolicum</em>, 1712), que declaraba que la prioridad era suya. Leibniz murió en 1716 desprestigiado y casi solo. Los matemáticos del continente adoptaron su notación, mucho más cómoda, y la ciencia inglesa, fiel al método geométrico de Newton, quedó rezagada un siglo hasta que Babbage, Herschel y Peacock introdujeron la notación de Leibniz en Cambridge (1812). La historia hoy da por probado que los dos inventaron el cálculo de modo independiente.</p></div>
<div class="box epist"><h4>Cuando la notación es parte de la teoría</h4><p>La disputa fue política y personal, pero también muestra que un <em>lenguaje</em> puede acelerar o frenar una ciencia. La notación \(\dd y/\dd x\) permite manipular derivadas como fracciones, cambios de variable, series, ecuaciones; la de puntos de Newton, \(\dot x\), era más pobre. Los matemáticos del continente, usándola, resolvieron en cincuenta años problemas que los ingleses habían dejado abiertos desde los <em>Principia</em>.</p></div>
</section>

<section>
<h2>Fuerza viva: la cantidad que se conserva</h2>
<p>Descartes decía que se conserva \(mv\); Leibniz (1686) mostró que lo que determina cuánto sube un cuerpo lanzado es \(mv^2\), a la que llamó <em>vis viva</em> («fuerza viva»). Los newtonianos replicaron que \(mv\) es la medida correcta. Durante medio siglo (1686-1743) se discutió. En 1743 d'Alembert, en el prólogo de su <em>Traité de dynamique</em>, sostuvo que era una discusión de palabras: \(mv\) mide el efecto <em>en el tiempo</em> y \(mv^2\) el efecto <em>en el espacio</em>. Entre medias, el físico holandés Willem 's Gravesande hizo caer bolas de latón en barro blando y halló que la profundidad era proporcional a \(v^2\), y Émilie du Châtelet, en 1740, repitió y difundió sus resultados con la conclusión de que Leibniz tenía razón. Voltaire, según la tradición, la llamó «un gran hombre cuyo único defecto era ser mujer».</p>
<div class="box leyenda"><h4>Émilie du Châtelet y los Principia</h4><p>Entre 1745 y 1749 la marquesa du Châtelet tradujo los <em>Principia</em> al francés y añadió un comentario analítico, con ideas propias sobre la energía. Terminó el manuscrito semanas antes de morir al dar a luz. La traducción se publicó en 1759 y fue durante dos siglos la única versión francesa. Con frecuencia se la presenta solo como «la amante de Voltaire»; sus <em>Institutions de physique</em> (1740) fueron un texto original donde defendía la prueba experimental de las leyes de Leibniz.</p></div>
</section>

<section>
<h2>La forma de la Tierra: Laponia y Quito</h2>
<p>Newton había deducido que la Tierra, al girar, debe estar achatada en los polos. Los Cassini (padre e hijo, Observatorio de París) habían medido el arco del meridiano en Francia y concluido lo opuesto: una Tierra alargada como un huevo. El problema era político: Francia contra Inglaterra, cartesianos contra newtonianos. La Académie organizó dos expediciones para medir un grado de meridiano cerca del polo y cerca del ecuador.</p>
<ol class="chain">
<li><b class="y">1735-1744 <span>· Quito</span></b><p>Godin, Bouguer y La Condamine, con los españoles Jorge Juan y Antonio de Ulloa (guardiamarinas de 22 y 19 años, enviados por el rey de España), pasaron nueve años en los Andes ecuatoriales, en un trabajo de triangulación entre Quito y Cuenca con pendientes de 4 000 m, lluvias, rivalidades y un asesinato de un cirujano del equipo (Jean Seniergues, 1739).</p></li>
<li><b class="y">1736-1737 <span>· Laponia</span></b><p>Maupertuis, Clairaut y Celsius, con un equipo de ocho, midieron un grado de meridiano en el río Tornio, en pleno invierno: 57 438 toesas, más largo que en Francia (57 060). Es decir, la curvatura es menor cerca del polo: la Tierra está achatada.</p></li>
<li><b class="y">1740-1744 <span>· Resultados</span></b><p>El grado en Quito dio 56 753 toesas. La secuencia 56 753 (ecuador), 57 060 (Francia), 57 438 (polo) confirmó a Newton: el achatamiento es 1/210 (1/298 actual). Voltaire felicitó a Maupertuis por haber «aplastado a Cassini y a la Tierra». Y de esta expedición nació el metro (1791: la diezmillonésima parte del cuarto de meridiano).</p></li>
</ol>
<div class="box contexto"><h4>Quito, hoy Ecuador, y la Nueva Granada</h4><p>El virreinato de Nueva Granada (Bogotá) y la Audiencia de Quito formaban parte del mismo imperio; Los académicos franceses y los marinos españoles llegaron en 1735 a Cartagena de Indias, el gran puerto de la Nueva Granada, camino de Panamá y de Quito; La Condamine volvió a Europa en 1743-1745 por el Amazonas y Cayena. Ulloa y Jorge Juan escribieron las <em>Observaciones astronómicas y físicas</em> (1748) y la <em>Relación histórica del viaje</em>. Estos viajes sembraron el interés por la geografía y la historia natural de la región: José Celestino Mutis y Francisco José de Caldas pertenecen a esa tradición (capítulo 34). Fue, además, la primera gran ocasión en que científicos europeos hicieron una medida con ayuda de autoridades y personal locales, a menudo sin el crédito.</p></div>
</section>

<section>
<h2>Euler, Lagrange y la mecánica «sin figuras»</h2>
<ol class="chain">
<li><b class="y">1736-1750 <span>· Euler</span></b><p>En su <em>Mechanica</em> (1736) rehízo la dinámica con cálculo. En 1750 escribió la segunda ley en la forma que usamos: \(\vb F=m\vb a\), para cada partícula; añadió la mecánica del sólido rígido (ecuaciones de Euler, 1752-1765) y la hidrodinámica (ecuaciones de Euler, 1757).</p></li>
<li><b class="y">1743 <span>· d'Alembert</span></b><p>Reducción de los problemas de dinámica a problemas de estática: añadiendo una «fuerza de inercia», se obtiene el equilibrio. Con él se estudian sistemas con ligaduras.</p></li>
<li><b class="y">1744-1746 <span>· Maupertuis y Euler</span></b><p>La naturaleza actúa siempre con la menor «acción» (producto de masa, velocidad y camino). Euler lo formuló con rigor para una partícula en un campo conservativo: \(\delta\int mv\,\dd s=0\).</p></li>
<li><b class="y">1788 <span>· Lagrange</span></b><p>Mécanique analytique: partiendo del principio de los trabajos virtuales, con coordenadas generalizadas \(q_i\), halló ecuaciones válidas en cualquier sistema de coordenadas.</p></li>
</ol>
<div class="eq key" data-name="Ecuaciones de Lagrange">\[\frac{\dd}{\dd t}\frac{\partial L}{\partial\dot q_i}-\frac{\partial L}{\partial q_i}=0,\qquad L=T-V.\]</div>
<p>En el prefacio, Lagrange escribió: «No se encontrarán figuras en esta obra. Los métodos que expongo no requieren construcciones ni razonamientos geométricos o mecánicos, sino solamente operaciones algebraicas, sometidas a una marcha regular y uniforme». La mecánica se convertía en cálculo: una receta que, dada una energía cinética y una potencial, produce las ecuaciones. La misma receta servirá en el electromagnetismo (capítulo 21) y en la mecánica cuántica (capítulo 29).</p>
<div class="sim" data-sim="braquistocrona" data-title="La braquistócrona: la curva del descenso más rápido"></div>
<div class="sim-guide"><ul>
<li>Cuatro bolas parten juntas por la recta, el arco circular, la parábola y la cicloide: la cicloide llega antes. Con el desnivel y la distancia por defecto, la cicloide ahorra un 20 % del tiempo respecto de la recta. Un problema de «el mejor camino» no se resuelve con álgebra sino con una nueva rama del análisis, el <em>cálculo de variaciones</em> (Euler, 1744; Lagrange, 1760).</li>
</ul></div>
<div class="box rivalidad"><h4>El principio de acción mínima, el caso König y Voltaire</h4><p>En 1751 Samuel König, discípulo de Johann Bernoulli y miembro de la Academia de Berlín, acusó a su presidente Maupertuis de haber tomado el principio de una carta de Leibniz, que no pudo mostrar en original. Maupertuis lo hizo expulsar. Euler, que había demostrado el principio con rigor, defendió a su presidente y condenó al acusador. Voltaire, que vivía en la corte de Federico II, se puso del lado de König y publicó la <em>Diatribe du Docteur Akakia</em> (1752), una sátira que ridiculizaba a Maupertuis (con alusiones a su viaje, a sus ideas de perforar la Tierra y a su proyecto de ir a la Patagonia a disecar cerebros). El rey ordenó quemar el panfleto en Berlín; Voltaire se fue de Prusia en 1753. Es un caso de una disputa de prioridad con política de corte: el principio sobrevivió y se expresa hoy en la formulación de Hamilton.</p></div>
</section>

<section>
<h2>Laplace y el sistema solar como reloj</h2>
<p>En los cinco volúmenes de la <em>Mécanique céleste</em> (1799-1825), Laplace aplicó el análisis a las perturbaciones mutuas de los planetas. Demostró que, a primer orden, los semiejes de las órbitas no cambian de manera secular (con lo que el sistema solar sería estable). Explicó la aceleración secular de la Luna y las desigualdades de Júpiter y Saturno, que Halley había hallado y se pensaba que anunciaban un colapso. Propuso en su <em>Exposition du système du monde</em> (1796) la hipótesis nebular: el sistema solar nació de una nube en rotación. Una anécdota, probablemente apócrifa, cuenta que Napoleón le preguntó por qué su libro no mencionaba a Dios, y él respondió: «No he necesitado esa hipótesis».</p>
<div class="box fuente"><h4>El demonio de Laplace (1814)</h4><blockquote>Una inteligencia que en un instante dado conociera todas las fuerzas que animan la naturaleza y la situación respectiva de los seres que la componen, si además fuera lo bastante vasta para someter estos datos al análisis, abrazaría en la misma fórmula los movimientos de los mayores cuerpos del universo y los del átomo más ligero: nada le sería incierto y el futuro, como el pasado, estaría presente ante sus ojos.</blockquote><p>Laplace, <em>Essai philosophique sur les probabilités</em> (1814). Es la formulación clásica del determinismo, y en el mismo ensayo la probabilidad se presenta como una medida de nuestra ignorancia. La mecánica cuántica (capítulo 29) y la teoría del caos lo desafiaron de modos distintos.</p></div>
<div class="sim" data-sim="pendulo-doble" data-title="Dos péndulos dobles casi idénticos: el límite del determinismo"></div>
<div class="sim-guide"><ul>
<li>Con ángulos grandes (> 90°) la diferencia inicial de una milésima de radián crece exponencialmente hasta ser de orden 1 en pocos segundos: se acaba toda predicción práctica. Con ángulos pequeños permanecen juntos: el sistema es casi lineal.</li>
<li>La energía se conserva con una deriva relativa de unas 10⁻⁷: el integrador de Runge–Kutta es fiable. La divergencia no es un error de cálculo, sino una propiedad de las ecuaciones.</li>
</ul></div>
</section>

<section>
<h2>Pesar la Tierra y descubrir un planeta</h2>
<h3>Cavendish (1798)</h3>
<p>Newton había escrito que la fuerza de gravedad es proporcional a las masas y inversa al cuadrado de la distancia, pero nadie conocía la <em>constante</em>. Para conocerla había que medir la atracción entre dos masas de laboratorio, mil millonésimas de newton. El pastor John Michell construyó una balanza de torsión y murió (1793) antes de usarla; el aparato pasó a Cavendish, que lo reconstruyó, lo aisló en un cobertizo para evitar corrientes de aire y observaba con un telescopio desde otra habitación. El resultado fue una densidad de la Tierra de 5.448 veces la del agua. De ello se deduce la masa de la Tierra: casi 6×10²⁴ kg. La frase «pesar la Tierra» es de la época.</p>
<div class="eq key" data-name="Constante de gravitación (de Cavendish)">\[G=\frac{2\pi^2 L\,\theta\,r^2}{M\,T^2}\ \ \Rightarrow\ \ M_\oplus=\frac{gR_\oplus^2}{G}.\]</div>
<div class="sim" data-sim="cavendish" data-title="La balanza de torsión de Cavendish: pesar la Tierra"></div>
<div class="sim-guide"><ul>
<li>Con L = 1.86 m, M = 158 kg, r = 22.6 cm, T = 420 s y θ = 1 mrad se obtiene \(G=6.7\times10^{-11}\) y una densidad de 5.4 g/cm³: la cifra de Cavendish.</li>
<li>Un error del 10 % en el periodo (que entra al cuadrado) produce un 20 % en G. Los valores modernos de G tienen todavía una precisión de solo ~10⁻⁵, la peor de todas las constantes fundamentales: ¡con una balanza de Cavendish refinada!</li>
</ul></div>
<div class="box epist"><h4>G no estaba en los Principia</h4><p>Newton no usó G; la ley está escrita con proporcionalidades. El mismo Cavendish no mencionó G: «su» resultado era una densidad. La constante se hizo explícita con Baily (1843) y Cornu y Baille (1873), y la notación \(G\) es del siglo XIX. Es otro ejemplo de que lo que hoy llamamos «ley de Newton» es un edificio al que muchos aportaron.</p></div>
<h3>Neptuno y Vulcano</h3>
<p>El 13 de marzo de 1781, William Herschel, un músico alemán de Bath que construía telescopios, vio un astro con disco que luego identificó como un planeta: Urano. (Herschel quiso llamarlo «Georgium Sidus» en honor de Jorge III; el nombre actual lo propuso Bode.) Al calcular su órbita, las tablas no concordaban con las posiciones observadas. En 1845-1846, el inglés John Couch Adams y el francés Urbain Le Verrier calcularon independientemente la posición de un planeta que perturbaba a Urano.</p>
<div class="box rivalidad"><h4>Adams, Le Verrier, Airy y Challis</h4><p>Adams, un joven de Cambridge, entregó sus cálculos al astrónomo real George Airy en octubre de 1845; Airy, escéptico, no respondió con urgencia. El director del Observatorio de Cambridge, James Challis, buscó el planeta de modo poco sistemático en el verano de 1846, y lo observó dos veces sin reconocerlo. Le Verrier publicó su predicción en junio de 1846 y mandó una carta a Galle en septiembre: lo halló la primera noche. Hubo una polémica de prioridad entre Inglaterra y Francia, resuelta con un reparto del crédito: ambos son descubridores. Con Adams, la «prueba» de Neptuno fue un triunfo de la formalidad: la predicción del cálculo coincidió con la observación en menos de 1°. Los cálculos de ambos, sin embargo, daban una distancia errónea (36 UA en vez de 30.1 UA): el acierto en la posición fue cuestión de época (Neptuno pasaba entonces por un lugar cercano al predicho).</p></div>
<p>El éxito animó a repetirlo: Le Verrier descubrió en 1859 que el perihelio de Mercurio avanza 38″ por siglo más de lo que predicen las perturbaciones conocidas (el valor actual es 43″), y propuso un planeta interior, <em>Vulcano</em>. Un médico de provincia, Lescarbault, creyó verlo en 1859; durante cincuenta años se anunciaron avistamientos. No existía. El error de Mercurio se resolvió en 1915 con la relatividad general (capítulo 27). La analogía entre Neptuno y Vulcano muestra que el mismo razonamiento (añadir una hipótesis auxiliar para salvar una teoría) puede llevar al éxito o al error (capítulo 1).</p>
<h3>Hamilton</h3>
<p>En 1833-1835 William Rowan Hamilton, un niño prodigio irlandés que dominaba trece idiomas, mostró que la mecánica puede derivarse de un solo principio variacional, \(\delta\int L\,\dd t=0\), y reescribió las ecuaciones con las coordenadas \(q_i\) y los momentos \(p_i\) en pie de igualdad:</p>
<div class="eq key" data-name="Ecuaciones de Hamilton">\[\dot q_i=\frac{\partial H}{\partial p_i},\qquad\dot p_i=-\frac{\partial H}{\partial q_i},\qquad H=\sum p_i\dot q_i-L.\]</div>
<p>La forma hamiltoniana, que parecía un ejercicio de elegancia, fue la que pasó casi intacta a la mecánica estadística (Gibbs, Boltzmann) y a la mecánica cuántica (Schrödinger, Dirac): el hamiltoniano \(H\) es el operador energía. Es un caso en que una reformulación matemática, sin contenido físico nuevo, preparó el terreno para teorías que aún no existían.</p>
</section>

<section>
<h2>Epistemología del análisis</h2>
<div class="box epist"><h4>La física como cálculo deductivo, los principios como convenciones</h4><p>La mecánica analítica sugirió a Lagrange y a los ilustrados que la física podía ser un sistema deductivo a partir de un principio. D'Alembert escribió que la mecánica debía ser «tan cierta como la geometría». La estética de la unificación (Lagrange: «una especie de poema científico») iba acompañada de una creencia: que la naturaleza es simple y matemática. Ernst Mach (<em>Die Mechanik in ihrer Entwicklung</em>, 1883) criticó esa actitud: los principios de la mecánica son resúmenes económicos de experiencias, no verdades a priori. Poincaré (1902) añadió que los principios son <em>convenciones</em> aceptadas por su comodidad. Así la historia de las ideas sobre «qué es un principio físico» recorre desde Newton (inducción), Lagrange (deducción) hasta Mach y Poincaré.</p></div>
<div class="sim" data-sim="timeline" data-ch="analitica" data-from="1690" data-to="1850" data-title="Línea de tiempo de la mecánica analítica"></div>

<li>Elija a Voltaire: coincidió con Newton solo por su funeral (1727), pero con Maupertuis, Euler, Federico II y Châtelet casi toda su vida.</li>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Con \(G=6.674\times10^{-11}\), \(g=9.807\) y \(R=6371\) km, calcule la masa y la densidad media de la Tierra.
<details><summary>Respuesta</summary><p>\(M=gR^2/G=5.96\times10^{24}\) kg; \(\rho=3M/(4\pi R^3)=5.50\) g/cm³ (valor aceptado 5.51).</p></details></li>
<li><span class="lvl">Básico</span>Con grados de meridiano de 56 753 (ecuador), 57 060 (Francia) y 57 438 (Laponia) toesas, ¿qué tendencia confirma la forma achatada?
<details><summary>Respuesta</summary><p>El grado crece con la latitud: cerca de los polos el meridiano es menos curvado (radio de curvatura mayor): Tierra achatada, como predijo Newton. Los Cassini esperaban lo contrario.</p></details></li>
<li><span class="lvl">Intermedio</span>La braquistócrona entre (0,0) y (1.5, 0.6) m: calcule el tiempo por la recta y por la cicloide.
<details><summary>Respuesta</summary><p>Recta: 0.94 s (\(t=\sqrt{2L^2/(g\,y_f)}\)). Cicloide: \(	heta\sqrt{a/g}\) con \(	heta\) tal que \((	heta-\sen	heta)/(1-\cos	heta)=2.5\): \(	heta=3.82\), \(a=0.337\) m, 0.71 s. La cicloide ahorra un 25 %.</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre con las ecuaciones de Lagrange que un péndulo simple (\(L=\tfrac12ml^2\dot\theta^2+mgl\cos\theta\)) cumple \(\ddot\theta=-(g/l)\sen\theta\).
<details><summary>Respuesta</summary><p>\(\partial L/\partial\dot\theta=ml^2\dot\theta\); \(\partial L/\partial\theta=-mgl\sen\theta\). La ecuación \(\tfrac{\dd}{\dd t}(ml^2\dot\theta)+mgl\sen\theta=0\) da lo pedido.</p></details></li>
<li><span class="lvl">Avanzado</span>Compare Neptuno y Vulcano como aplicaciones del mismo razonamiento. ¿Qué criterio, antes de conocer el desenlace, habría permitido distinguirlos?
<details><summary>Respuesta</summary><p>Para Neptuno, la anomalía de Urano era un efecto muy grande (2′) y existían perturbaciones sin explicar, y el planeta hipotético debía estar en un lugar accesible a las observaciones; la predicción era <em>nueva</em>, falsable y se confirmó. Para Vulcano, la anomalía era pequeña (43″ por siglo) y el candidato debía estar muy cerca del Sol (difícil de observar), con avistamientos inconsistentes; el programa fue degenerativo (Lakatos). Ningún criterio es infalible a priori: solo el éxito predictivo posterior decide.</p></details></li>
</ol>
