    <h1 class="home-title">Cómo llegamos a saber<span>de los filósofos de Jonia al bosón de Higgs</span></h1>
    <p class="home-lead">Las fórmulas de los libros de texto aparecen limpias, como si hubieran estado siempre ahí. Este cuaderno cuenta lo que hay detrás: las teorías que reinaban en cada época, los instrumentos que hicieron posible medir, las cartas, las peleas por la prioridad, la envidia, la política, el dinero, las guerras, los errores que casi arruinan un descubrimiento y las leyendas que se contaron después. Desde las tablillas babilónicas y la sombra de Eratóstenes hasta la fisión, la mecánica cuántica y las ondas gravitacionales, cada capítulo reconstruye el camino que llevó a una fórmula, lo reproduce con una simulación y lo discute con las herramientas de la epistemología: qué se sabía, qué contaba como prueba y por qué se aceptó o se rechazó cada idea.</p>

<div class="home-howto">
  <div><b>Cada fórmula tiene una biografía</b><p>En cada tema se sigue la cadena de pasos que condujo a la ley: el problema abierto, el dato que no encajaba, quién dio el siguiente paso y qué le faltaba todavía. La ley de Newton no nació en un día de 1687, y la de Planck empezó siendo un ajuste de curvas.</p></div>
  <div><b>Personas, no estatuas</b><p>Ptolomeo, Tycho, Kepler, Galileo, Newton, Hooke, Faraday, Maxwell, Boltzmann, Curie, Meitner, Einstein, Heisenberg, Schrödinger, Noether, Rubin, Wu… con sus orígenes, sus cartas, sus manías, sus rivales, sus maestros y las circunstancias políticas que les tocó vivir.</p></div>
  <div><b>Leyenda y documento</b><p>La manzana, la torre de Pisa, el «¡Eureka!», la frase de Kelvin que nunca dijo. En cada capítulo se separa lo que consta en documentos de lo que se contó después, y en el apéndice D se reúnen con su veredicto.</p></div>
  <div><b>Simulaciones que reconstruyen</b><p>Medir la Tierra con una sombra, ajustar la órbita de Marte, rodar bolas por el plano de Galileo, pesar la Tierra con la balanza de Cavendish, ver desvanecerse el éter en el interferómetro, ajustar la curva del cuerpo negro o jugar a descubrir una regla oculta como lo hacen los científicos.</p></div>
