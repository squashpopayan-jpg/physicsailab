<p class="lead">En 1746 el abate Jean-Antoine Nollet reunió en el patio del palacio de Versalles a 180 guardias reales, los hizo cogerse de la mano formando un círculo, y pidió al primero y al último que tocaran los extremos de una botella de Leiden cargada. Delante del rey, los ciento ochenta soldados dieron el mismo salto a la vez. La electricidad, que hasta entonces era el hechizo del ámbar frotado y una curiosidad de salón, se había vuelto un espectáculo y una fuerza que viajaba a través de los cuerpos. Medio siglo más tarde los experimentadores habrían de aprender a medirla, a guardarla en pilas y a ponerla a trabajar.</p>

<section>
<h2>El siglo de los salones eléctricos</h2>
<div class="box contexto"><h4>Entre la ciencia y el espectáculo</h4><p>En el siglo XVIII los experimentos eléctricos eran a la vez ciencia y entretenimiento de la Ilustración. Había «niños colgados» que atraían plumas, «besos eléctricos», conferencias itinerantes con máquinas de globo de vidrio y botellas que daban descargas. Los salones, las cortes y las academias pagaban a los demostradores. Los instrumentos que se hicieron para el espectáculo (la máquina de fricción, la botella de Leiden) fueron también los de la investigación. La interpretación se disputaba en publicaciones y en la esfera pública: los cuerpos «eléctricos» y «no eléctricos», los fluidos, los «efluvios», la imagen que cada autor ofrecía de la naturaleza. La razón por la cual la electricidad tardó tanto en «madurar» es que no tenía todavía un instrumento de medida; cuando los hubo, avanzó rápido.</p></div>
<div class="people">
<div class="persona"><b>Stephen Gray</b><small>1666 – 1736 · Londres</small><p>Pensionista del Charterhouse y hombre de pocos medios. En 1729 halló que la electricidad se transmite por un hilo; distinguió conductores y aislantes. Colgó a un niño con cuerdas de seda y lo electrizó.</p></div>
<div class="persona"><b>Charles du Fay</b><small>1698 – 1739 · París</small><p>Intendente de los jardines del rey. En 1733 descubrió dos clases de electricidad, «vítrea» y «resinosa»: los cuerpos de la misma clase se repelen.</p></div>
<div class="persona"><b>Pieter van Musschenbroek</b><small>1692 – 1761 · Leiden</small><p>Físico holandés. Su alumno Cunaeus y él descubrieron en 1746 la botella de Leiden; la sacudida le hizo escribir a Réaumur que no repetiría la experiencia «por el reino de Francia».</p></div>
<div class="persona"><b>Jean-Antoine Nollet</b><small>1700 – 1770 · París</small><p>Abate y divulgador, profesor de física del rey. Sus demostraciones de 1746 dieron fama a la electricidad. Defendía la teoría de «efluvios» con una cuerda de afluentes y efluentes.</p></div>
<div class="persona"><b>Benjamin Franklin</b><small>1706 – 1790 · Filadelfia, Londres, París</small><p>Impresor, autor de la <em>Autobiografía</em>, político y científico. Entre 1747 y 1752 propuso una teoría de un solo fluido y el pararrayos. Embajador en París (1776-1785).</p></div>
<div class="persona"><b>Joseph Priestley</b><small>1733 – 1804 · Leeds, Birmingham, Pensilvania</small><p>Pastor disidente, químico (descubrió el oxígeno) y escritor. <em>La historia y el estado actual de la electricidad</em> (1767). Su casa fue incendiada por una turba en 1791; emigró a América.</p></div>
<div class="persona"><b>Charles-Augustin de Coulomb</b><small>1736 – 1806 · París</small><p>Ingeniero militar que trabajó en la Martinica y en Mézières. Estudió la fricción, la torsión de hilos y la resistencia de materiales antes de la electricidad.</p></div>
<div class="persona"><b>Luigi Galvani</b><small>1737 – 1798 · Bolonia</small><p>Médico y profesor de anatomía. Descubrió que ancas de rana se contraen con electricidad. Creía en una «electricidad animal».</p></div>
<div class="persona"><b>Alessandro Volta</b><small>1745 – 1827 · Como, Pavía</small><p>Profesor de Pavía. Inventó el electróforo, el condensador y la pila (1800). Napoleón lo hizo conde y senador.</p></div>
<div class="persona"><b>Georg Simon Ohm</b><small>1789 – 1854 · Erlangen, Colonia, Núremberg, Múnich</small><p>Hijo de un cerrajero que le dio una sólida formación en matemática. Profesor de liceo hasta los 44 años: su ley le abrió la cátedra solo en 1852.</p></div>
</div>
</section>

<section>
<h2>Dos fluidos, un fluido, una ley de conservación</h2>
<ol class="chain">
<li><b class="y">1729 <span>· Gray</span></b><p>La electricidad se propaga por un hilo de cáñamo o un cable mojado hasta 250 metros, pero no por seda. Hay materiales que la conducen y otros que la retienen: es una propiedad que se puede <em>transmitir</em>.</p></li>
<li><b class="y">1733 <span>· Du Fay</span></b><p>Dos clases de electricidad: la del vidrio frotado y la del ámbar frotado; cada una repele a su semejante y atrae a la otra. Propuso dos fluidos.</p></li>
<li><b class="y">1745-1746 <span>· la botella de Leiden</span></b><p>Ewald von Kleist en Pomerania (octubre de 1745) y Musschenbroek en Leiden (enero de 1746) hallaron que un frasco de vidrio con agua y un clavo, electrizado, almacena una carga que da una descarga violenta al tocar el clavo. Primer condensador. La noticia recorrió Europa en semanas.</p></li>
<li><b class="y">1747-1752 <span>· Franklin</span></b><p>Con sus colegas de la Junto (Kinnersley, Hopkinson, Syng) mostró que la botella almacena la carga en el vidrio y que existe un único fluido: un cuerpo tiene un exceso («más») o un defecto («menos»). La suma de las cargas no cambia: <em>conservación de la carga</em>. Inventó los términos «positivo» y «negativo», «batería» y «conductor».</p></li>
</ol>
<div class="box leyenda"><h4>El error de Franklin que sufrimos todos los días</h4><p>Franklin llamó «positivo» al vidrio frotado con seda, sin saber qué se movía realmente. Como los electrones tienen un exceso en el ámbar y un defecto en el vidrio, resultó que los portadores de carga de los metales llevan carga «negativa». Por ese azar, en todos los circuitos la corriente convencional se dibuja yendo del polo positivo al negativo, al contrario del movimiento de los electrones. La convención llegó a ser imposible de cambiar. Es un ejemplo de cómo una decisión arbitraria, con información insuficiente, se arrastra durante siglos.</p></div>
<div class="box rivalidad"><h4>Nollet contra Franklin</h4><p>Nollet, favorito de la corte francesa, sostuvo una teoría de «efluvios» con corrientes simultáneas, y atacó la de Franklin como obra de un aficionado provinciano. La traducción francesa de las cartas de Franklin (1752, por Dalibard) y los resultados del pararrayos le dieron la razón a Franklin; Nollet acabó aceptando en 1760 la conducción de rayos, pero no la teoría. La Académie nombró a Franklin corresponsal (1772) y socio extranjero (1772).</p></div>
</section>

<section>
<h2>El rayo es electricidad</h2>
<p>Franklin supuso que el rayo es una descarga eléctrica (1749) y propuso en 1750 verificarlo con una barra metálica puntiaguda en un pabellón elevado. En Francia, Thomas-François Dalibard ejecutó el experimento en Marly-la-Ville el 10 de mayo de 1752: una barra de hierro de 12 metros produjo chispas durante una tormenta. Lo repitieron en París, Londres y San Petersburgo. El 6 de agosto de 1753, el profesor Georg Richmann murió fulminado en San Petersburgo al repetirlo: el primer mártir de la electricidad.</p>
<p>Franklin, por su parte, relató (en el <em>Pennsylvania Gazette</em>, octubre de 1752, sin dar el nombre) el experimento de la cometa en la tormenta, con una llave de metal en el cordel: la forma más conocida del experimento. Priestley lo contó en su <em>Historia</em> (1767) como un hecho. Los historiadores se dividen sobre si realmente se hizo así, y sobre la riqueza de detalles que aporta la versión de Priestley; hay consenso en que, de haberlo hecho tal como se cuenta, un rayo directo lo habría matado: la chispa de la cometa en la llave puede ser, a lo sumo, electricidad estática de la nube.</p>
<div class="box contexto"><h4>De la ciencia al poder</h4><p>El pararrayos fue el primer invento científico que cambió la vida cotidiana: las iglesias dejaron de incendiarse (hasta entonces los campanarios eran los blancos favoritos: en Brescia, en 1769, un rayo hizo estallar 90 toneladas de pólvora almacenadas en la iglesia de San Nazaro). Franklin lo difundió sin patente, «por el bien común». Su fama de científico lo convirtió en diplomático: en 1776-1785 fue embajador de las colonias rebeldes en París, donde fue una celebridad. El debate sobre si las puntas o las bolas eran mejores para los pararrayos enfrentó a Londres y a Filadelfia durante la guerra: el rey Jorge III mandó colocar bolas, y los patriotas, puntas.</p></div>
</section>

<section>
<h2>La ley de las fuerzas: Priestley, Cavendish, Coulomb</h2>
<p>Newton había dado la ley de la gravedad; ¿existe una ley igual para la electricidad? Tres pasos:</p>
<ol class="chain">
<li><b class="y">1755-1767 <span>· Franklin y Priestley</span></b><p>Franklin notó que un corcho suspendido dentro de una copa metálica cargada no se movía. Priestley, informado, escribió: «¿No podemos inferir de esto que la atracción eléctrica está sujeta a la misma ley que la gravitación, es decir, al cuadrado de la distancia? Pues es fácil demostrar que si la Tierra tuviera forma de cascarón, un cuerpo dentro no sentiría ninguna atracción». Era el teorema de Newton aplicado a las cargas.</p></li>
<li><b class="y">1771-1773 <span>· Cavendish</span></b><p>Midió con dos esferas concéntricas conectadas por un hilo si la esfera interior se cargaba cuando la exterior lo estaba: no detectó nada y dedujo que la fuerza varía como \(1/r^{2\pm0.02}\). No publicó nada. Sus manuscritos se editaron en 1879.</p></li>
<li><b class="y">1785 <span>· Coulomb</span></b><p>Con una balanza de torsión (un hilo fino con una aguja de goma laca y una bolita) midió directamente la fuerza entre dos bolitas cargadas: inversa al cuadrado de la distancia y proporcional al producto de las cargas (esto último midiendo la repulsión tras repartir la carga entre bolas iguales).</p></li>
</ol>
<div class="eq key" data-name="Ley de Coulomb (1785)">\[F=k\,\frac{q_1\,q_2}{r^2},\qquad k=\frac1{4\pi\varepsilon_0}=8.99\times10^9\ \mathrm{N\,m^2/C^2}.\]</div>
<div class="sim" data-sim="coulomb-balanza" data-title="La balanza de torsión de Coulomb: los números de 1785"></div>
<div class="sim-guide"><ul>
<li>Los tres pares de datos de Coulomb dan exponentes de 2.00 (36° a 18°) y 1.92 (36° a 8.5°) si se toma la distancia como el ángulo, y de 2.04 y 1.94 con la cuerda. Coulomb las aceptó como compatibles con 2, explicando la desviación por la fuga de carga en el aire (la bolita pierde carga durante el experimento).</li>
<li>Con un exponente supuesto de 1.5 o 2.5 las predicciones se apartan mucho: la evidencia es contundente, pero no una «prueba» matemática.</li>
</ul></div>
<div class="sim" data-sim="prueba-esfera" data-title="El cero dentro de la esfera: la prueba más fina de la ley del cuadrado"></div>
<div class="sim-guide"><ul>
<li>Con \(n=2\) el campo dentro de una cáscara es exactamente cero en cualquier punto; con \(n=2.1\) o \(1.9\), no. El experimento de Cavendish aprovecha esta sensibilidad: un cero «negativo» acota \(|n-2|\). La misma idea usó Williams en 1971 con un resultado de \(|n-2|<3\times10^{-16}\), unos cien billones de veces más preciso que la medida directa de Coulomb.</li>
<li>La prueba de un <em>cero</em> es mejor que la de una medida: cualquier lectura distinta de cero es una señal, y no hace falta calibrar el instrumento.</li>
</ul></div>
<div class="box epist"><h4>Analogía como motor y la publicación como condición de la ciencia</h4><p>Priestley llegó al resultado por analogía con Newton: la electricidad y la gravedad se parecían en forma matemática, y eso fue sugerente. Cavendish tenía la prueba más precisa pero la guardó en un cajón (vivía casi aislado y solo publicaba lo que consideraba cerrado). La ciencia no depende solo de descubrir, sino de <em>comunicar</em>: el crédito se asigna al que publica. Al conocerse los manuscritos de Cavendish (1879), sus resultados se atribuyeron a Coulomb; a los de Coulomb, el nombre de la ley. Es un caso en que «la prioridad» y «la influencia» van por separado.</p></div>
</section>

<section>
<h2>Galvani, Volta y la pila</h2>
<div class="box contexto"><h4>Revolución y guerra</h4><p>Italia en 1790-1800 estaba entre la Revolución francesa y Napoleón. Galvani, católico fiel, se negó en 1797 a jurar fidelidad a la República Cisalpina que creó Bonaparte y fue destituido; murió pobre al año siguiente. Volta, que jura, ganó honores. En 1801 Napoleón lo invitó a París para exhibir su pila ante el Instituto y le dio una medalla de oro. La ciencia no era ajena a la política.</p></div>
<ol class="chain">
<li><b class="y">1780-1791 <span>· Galvani</span></b><p>Una rana disecada sobre la mesa, con una máquina eléctrica cerca, hace una mueca cuando un asistente toca con el bisturí un nervio. Galvani exploró el efecto con tormentas, y descubrió que una rana colgada de un gancho de cobre en una barandilla de hierro se contraía sin máquina. En 1791 publicó su teoría: los animales tienen un fluido eléctrico intrínseco.</p></li>
<li><b class="y">1792-1799 <span>· Volta</span></b><p>Replicó los experimentos y notó que la contracción necesitaba <em>dos metales distintos</em>: la fuente de la electricidad era el contacto entre metales, y la rana, un simple detector sensible. Para demostrarlo, apiló discos de cinc y de cobre separados por cartón mojado en salmuera, y obtuvo una corriente continua, sostenida: la <em>pila</em> (carta a Banks, marzo de 1800).</p></li>
<li><b class="y">1800 <span>· la química eléctrica</span></b><p>A las pocas semanas, Nicholson y Carlisle descompusieron agua en hidrógeno y oxígeno con una pila. Davy, en 1807, con una pila de 250 pares aisló el potasio y el sodio, por primera vez. La electroquímica nació de la pila.</p></li>
</ol>
<div class="sim" data-sim="pila-volta" data-title="La pila de Volta: tensión, corriente y potencia"></div>
<div class="sim-guide"><ul>
<li>Con 20 pares de 0.76 V en circuito abierto, la tensión es 15 V. Con una carga baja la tensión baja porque cada par tiene resistencia interna. La potencia útil es máxima cuando la resistencia externa iguala la interna total (\(R=nr\)): un caso del llamado «teorema de máxima transferencia de potencia».</li>
<li>Con una carga como un cuerpo humano seco (\(\sim10^5\) Ω) la pila de Volta apenas da una sensación; con la piel mojada, se nota el calambre. Por eso Volta usaba la lengua y los ojos como detectores.</li>
</ul></div>
<div class="box leyenda"><h4>Galvani, Aldini y Frankenstein</h4><p>El sobrino de Galvani, Giovanni Aldini, hizo en 1803, en Londres, una demostración pública en el cadáver recién ahorcado del asesino George Forster: al aplicarle las corrientes de una pila gigante el cuerpo hizo muecas, abrió un ojo y levantó un puño. La escena, vista por el público como una vuelta a la vida, circuló por Inglaterra. Mary Shelley escribió <em>Frankenstein</em> (1818) tras conversaciones sobre el galvanismo con Byron y Shelley. La literatura convirtió en mito un problema real: la naturaleza de la «electricidad animal» (que Matteucci y Du Bois-Reymond mostrarán real, con otra interpretación: los potenciales de acción de los nervios).</p></div>
<div class="box epist"><h4>Galvani y Volta tenían razón los dos</h4><p>Es una controversia clásica: Volta tenía razón en que dos metales distintos generan tensión, y Galvani en que los tejidos animales producen corrientes. Una teoría de la «electricidad de contacto» contra una de la «electricidad animal» fue en realidad una disputa de dos fenómenos distintos. A veces un instrumento (una rana) responde a dos causas. Es otro ejemplo de que el desacuerdo científico suele ser parcial: ambos bandos tienen parte del fenómeno.</p></div>
</section>

<section>
<h2>Ohm: una ley rechazada</h2>
<p>La pila daba una corriente, pero ¿cómo depende de la longitud y de la sección del alambre? Antes de Ohm no había una ley: se hablaba de «intensidad» y de «tensión» sin precisar. Ohm, profesor de matemáticas en el Gymnasium jesuita de Colonia, midió la corriente en alambres de distinta longitud conectados a una fuente estable: no una pila (cuya fem decaía), sino un par termoeléctrico bismuto-cobre (efecto Seebeck, 1821), con una aguja de torsión como amperímetro. Encontró que la corriente es inversamente proporcional a una resistencia que suma la del circuito interior y la del alambre.</p>
<div class="eq key" data-name="Ley de Ohm (1827)">\[I=\frac{V}{R},\qquad R=\rho\,\frac{l}{A},\qquad I=\frac{\mathcal E}{r+R}.\]</div>
<p>Su libro, <em>Die galvanische Kette, mathematisch bearbeitet</em> (1827), con una teoría matemática basada en la analogía con la conducción del calor de Fourier, fue recibido con frialdad. El ministro prusiano de Educación la calificó de «tela de fantasías desnudas». Ohm renunció a su puesto y vivió seis años de enseñanza privada. En 1841 la Royal Society de Londres le concedió la medalla Copley; en 1852 obtuvo la cátedra de Múnich, dos años antes de morir. La unidad de resistencia lleva su nombre desde 1861.</p>
<div class="box epist"><h4>Por qué fue rechazada: la filosofía de la ciencia en Alemania</h4><p>En los años 1820 la filosofía de la naturaleza de Hegel y Schelling dominaba la universidad alemana y se miraba con desconfianza una ciencia que partía de mediciones y fórmulas. Una ley como la de Ohm, simple, cuantitativa y sin explicación metafísica, parecía un reduccionismo grosero. En Inglaterra y Francia, con la cultura de la medida de Newton y Laplace, el recibimiento fue mejor. Es una lección sobre cómo el <em>contexto filosófico</em> determina qué resultados se perciben como «científicos». También muestra algo del método: Ohm eligió la fuente estable (la termopila) antes que la pila: controlar las condiciones <em>antes</em> de buscar la ley fue la clave.</p></div>
<div class="sim" data-sim="timeline" data-ch="electricidad" data-from="1700" data-to="1860" data-title="Línea de tiempo de la electricidad hasta Ohm"></div>
<div class="sim" data-sim="vidas" data-ids="gilbert,gray,dufay,musschenbroek,nollet,franklin,priestley,cavendish,coulomb,galvani,volta,davy,ohm,aldini" data-title="Los electricistas: quién pudo conocer a quién"></div>
<div class="sim-guide"><ul>
<li>Franklin (1706-1790) coincidió con Du Fay, Musschenbroek, Nollet, Priestley, Cavendish, Coulomb, Galvani y Volta (en París, 1782, conoció a Volta: sus equipos se vieron). No coincidió con Ohm.</li>
<li>Ohm (1789-1854) fue casi contemporáneo de Faraday y de Ampère, de los que hablaremos en el capítulo siguiente.</li>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Con las medidas de Coulomb (par total 36°, 144°, 575.5° para separaciones de 36°, 18° y 8.5°), calcule el exponente entre el primero y el tercero.
<details><summary>Respuesta</summary><p>\(n=\ln(575.5/36)/\ln(36/8.5)=2.772/1.443=1.92\).</p></details></li>
<li><span class="lvl">Básico</span>Una pila de 10 pares de 0.8 V cada uno y 1 Ω de resistencia interna cada uno alimenta un alambre de 20 Ω. ¿Qué corriente circula?
<details><summary>Respuesta</summary><p>\(I=nE/(nr+R)=8/(10+20)=0.267\) A. Tensión en el alambre: 5.3 V.</p></details></li>
<li><span class="lvl">Intermedio</span>Una botella de Leiden de 1 nF cargada a 20 kV. ¿Qué energía almacena? ¿Cuántas veces menos que una pila AA (≈ 10 kJ)?
<details><summary>Respuesta</summary><p>\(E=\tfrac12CV^2=0.2\) J. La pila guarda 50 000 veces más, pero la botella la entrega en microsegundos: potencia pico enorme.</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que, con fuerza \(F\propto1/r^2\), el campo dentro de una cáscara esférica uniforme es cero (teorema de Newton) con el cálculo de un anillo en el centro.
<details><summary>Respuesta</summary><p>En el centro, las contribuciones de elementos opuestos se cancelan por simetría. Para un punto interior a distancia \(x\), los elementos de ángulo sólido \(\dd\Omega\) subtendidos por conos opuestos tienen áreas proporcionales a \(r_1^2\) y \(r_2^2\) y fuerzas \(\propto1/r_1^2\) y \(1/r_2^2\): se compensan. Con otro exponente no.</p></details></li>
<li><span class="lvl">Avanzado</span>¿Qué rasgos tienen en común el rechazo a Waterston (capítulo 18), a Ohm y a Carnot? ¿Qué distingue a cada caso?
<details><summary>Respuesta</summary><p>Común: autores aislados y fuera del centro académico, publicaciones en lugares poco visibles, teorías que desafiaban un marco aceptado (calórico, filosofía de la naturaleza, mecánica sin moléculas). Diferencias: Waterston fue rechazado por un evaluador por supuestas «tonterías»; Ohm por un ministro con criterios filosóficos; Carnot, por simple ignorancia. En los tres hubo recuperación por parte de otros (Rayleigh, Royal Society, Clapeyron/Kelvin): el reconocimiento dependió de intermediarios.</p></details></li>
</ol>
