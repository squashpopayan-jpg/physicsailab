<p class="lead">En 1925, una joven inglesa de 25 años presentó en Harvard la tesis de doctorado más brillante de la historia de la astronomía, según el juicio posterior de Otto Struve. Cecilia Payne había aplicado a los espectros de las estrellas la ecuación de ionización de un físico indio, Meghnad Saha, y había concluido dos cosas: que los espectros son una secuencia de <em>temperatura</em> y no de composición, y que las estrellas están hechas casi solo de hidrógeno y helio. La segunda conclusión contradecía la creencia de que el Sol tenía la misma composición que la Tierra. Henry Norris Russell, de Princeton, el árbitro de la disciplina, le escribió que era «claramente imposible». Payne añadió a la tesis una frase: el resultado era «casi con seguridad espurio». Cuatro años después, Russell publicó el mismo resultado con sus propios datos y le dio su crédito, en una nota a pie de página. Durante décadas se le atribuyó a él.</p>

<section>
<h2>La estructura social de la física</h2>
<div class="box contexto"><h4>Cuatro infraestructuras</h4><p>La física se hace con tres cosas visibles (ideas, experimentos, instrumentos) y cuatro invisibles. (1) <em>Las instituciones</em>: academias (la Royal Society, 1660; la Académie des sciences, 1666), universidades reformadas (el modelo de Humboldt en Berlín, 1810, con investigación y docencia unidas) y laboratorios (el Cavendish, 1874; el Reichsanstalt, 1887; Bell Labs). (2) <em>La imprenta y la revista</em>: la <em>Philosophical Transactions</em> (1665) inventó el artículo científico, con fecha y nombre para fijar la prioridad; la revisión por pares se fue estableciendo en los siglos XIX y XX. (3) <em>El dinero</em>: mecenas (Tycho, los Médici), Estado (Colbert, la Admiralty, el Cold War), empresas (Bell, IBM) y fundaciones (Rockefeller, Carnegie). (4) <em>La inclusión</em>: quién puede entrar al laboratorio, al congreso y a la lista de autores. Este capítulo trata de esas cuatro cosas y de quienes quedaron fuera de las historias que contamos.</p></div>
<div class="people">
<div class="persona"><b>Emmy Noether</b><small>1882 – 1935 · Erlangen, Gotinga, Bryn Mawr</small><p>Hija de un matemático. Le permitieron seguir clases en Erlangen como oyente (1900), se doctoró en 1907 sin cátedra ni salario, y en Gotinga (1915) dio sus clases anunciadas bajo el nombre de Hilbert. Su teorema (1918) es una de las ideas centrales de la física teórica. Expulsada en 1933 por ser judía, murió en EE. UU. dos años después tras una operación.</p></div>
<div class="persona"><b>Cecilia Payne-Gaposchkin</b><small>1900 – 1979 · Cambridge, Harvard</small><p>Estudió en Cambridge sin poder obtener el título (Cambridge no otorgó títulos a mujeres hasta 1948). Con una beca emigró a Harvard. Fue la primera catedrática del Departamento de Astronomía (1956).</p></div>
<div class="persona"><b>Meghnad Saha</b><small>1893 – 1956 · Calcuta, Allahabad</small><p>De una familia humilde de Bengala; su ecuación de ionización (1920) fue la base de la astrofísica estelar. Se dedicó después a la política y a la planificación de la ciencia en la India independiente.</p></div>
<div class="persona"><b>Henry Norris Russell</b><small>1877 – 1957 · Princeton</small><p>«El decano de los astrónomos estadounidenses». Su prestigio y su error (la composición terrestre del Sol) retrasaron cuatro años el consenso.</p></div>
<div class="persona"><b>Marie Curie, Lise Meitner, Chien-Shiung Wu</b><small>capítulos 24, 30, 31</small><p>Tres de las mayores experimentadoras del siglo XX, con obstáculos distintos: Curie, la Academia (1911) y la prensa; Meitner, el exilio y el Nobel de Hahn; Wu, el Nobel de Lee y Yang.</p></div>
<div class="persona"><b>Maria Goeppert Mayer</b><small>1906 – 1972 · Gotinga, Chicago</small><p>Doctora con Born (1930). Trabajó muchos años como «voluntaria» sin sueldo en las universidades donde su marido era profesor, por las reglas contra el nepotismo. Modelo de capas del núcleo (1949); Nobel 1963, la segunda mujer después de Curie.</p></div>
<div class="persona"><b>Rosalind Franklin y Hertha Ayrton</b><small>1920–1958 · 1854–1923</small><p>Franklin, cristalógrafa (fotografía 51 del ADN); Ayrton, ingeniera eléctrica, fue propuesta para la Royal Society y rechazada porque era «una mujer casada» (1902), aunque recibió la medalla Hughes (1906).</p></div>
<div class="persona"><b>Derek de Solla Price y Vannevar Bush</b><small>1922–1983 · 1890–1974</small><p>Price fundó la cienciometría; Bush, ingeniero del MIT y director de la investigación científica de guerra de EE. UU., diseñó la política científica de la posguerra.</p></div>
</div>

<section>
<h2>Las mujeres en la física: obstáculos y logros</h2>
<ol class="chain">
<li><b class="y">hasta 1900 <span>· Fuera de la academia</span></b><p>Émilie du Châtelet (capítulo 16) tradujo a Newton y publicó <em>Institutions de physique</em> pero no pudo ser admitida en la Academia; Laura Bassi, en Bolonia, fue catedrática de física newtoniana (1732), una excepción; Caroline Herschel, ayudante de su hermano, descubrió ocho cometas. Las universidades europeas no admitieron mujeres hasta 1860-1900; Marie Curie se matriculó en la Sorbona en 1891 tras trabajar como institutriz.</p></li>
<li><b class="y">1900-1933 <span>· Un acceso limitado</span></b><p>Entraron a los laboratorios pero casi sin cátedras: Meitner fue «ayudante» hasta 1926, Noether trabajó sin sueldo hasta 1923 y Payne no pudo ser profesora de Harvard hasta 1956. Los estatutos de la mayor parte de las universidades impedían contratar a la esposa de un profesor (nepotismo) y obligaban a renunciar a las casadas.</p></li>
<li><b class="y">1933-1945 <span>· Persecución y guerra</span></b><p>Las leyes nazis expulsaron de las universidades a científicos de origen judío o políticamente sospechosos: Einstein, Born, Franck, Meitner, Noether, Bethe, Peierls y cientos más. La física estadounidense y británica se benefició. Muchas físicas y físicos entraron en el Proyecto Manhattan y en proyectos de guerra (radar, criptografía), con una presencia mayor de mujeres como computadoras y técnicas, casi nunca en puestos de dirección.</p></li>
<li><b class="y">1945-2023 <span>· Cifras</span></b><p>Hoy, las mujeres son alrededor de una cuarta parte de los doctorados en física en EE. UU. y Europa, y bastante menos de los catedráticos. El Nobel de Física lo han recibido solo 5 de unos 225 laureados: Marie Curie (1903), Maria Goeppert Mayer (1963), Donna Strickland (2018), Andrea Ghez (2020) y Anne L'Huillier (2023). Las desigualdades de reconocimiento afectan también al origen social, a la geografía (los países periféricos, capítulo 34) y a la etnia.</p></li>
</ol>

<div class="box leyenda"><h4>«No somos una casa de baños»</h4><p>En 1915 Hilbert y Klein invitaron a Noether a Gotinga para trabajar con ellos en las ecuaciones de la relatividad general (capítulo 27). La facultad de filosofía se opuso a su habilitación: «¿Qué pensarán nuestros soldados cuando vuelvan y se encuentren con que deben aprender a los pies de una mujer?». Hilbert respondió en la sesión que no veía «que el sexo de la candidata sea un argumento contra su admisión como Privatdozent. Después de todo, somos una universidad, no una casa de baños». El episodio está documentado (la frase, en la versión de la carta de Hilbert, aparece en varias fuentes); la habilitación llegó solo en 1919, tras la guerra. Mientras tanto, Noether daba clases bajo el nombre de Hilbert.</p></div>
<div class="box epist"><h4>El efecto Matilda y el efecto Mateo</h4><p>Merton (1968) describió el <em>efecto Mateo</em> («al que tiene se le dará»): el crédito de un descubrimiento va a quien ya es famoso (Russell por la composición solar; Hahn por la fisión). Rossiter (1993) lo llamó <em>efecto Matilda</em> cuando afecta sistemáticamente a las mujeres: el trabajo se atribuye a colegas varones (Meitner/Hahn, Wu/Lee y Yang, Payne/Russell, Franklin/Watson). No son todos casos de mala fe; son los mecanismos de la comunicación científica (quién firma, quién habla en el congreso, quién cita) y de la jerarquía. Un criterio útil es preguntar de quién se habló en el momento y de quién se habla ahora. La historia de la ciencia, que antes buscaba genios, descubre cada vez más la importancia de los técnicos, los calculistas, los dibujantes, las traductoras, las enfermeras y los guías locales (capítulo 34) que hicieron posible el resultado.</p></div>
</section>

<section>
<h2>Guerra, Estado y gran ciencia</h2>
<ol class="chain">
<li><b class="y">1665-1900 <span>· Revistas, academias y mecenas</span></b><p>La Royal Society (1660) y la Académie (1666) no pagaban a los científicos, pero la revista fijaba la prioridad: la <em>Philosophical Transactions</em> (1665) es la primera en dar fecha de recepción y nombre al autor. El Estado entró con la longitud (el Almirantazgo y la Junta de la Longitud, capítulo 14), la artillería, la navegación y la industria (Alemania, 1887).</p></li>
<li><b class="y">1940-1945 <span>· La física en la guerra</span></b><p>El radar (MIT Rad Lab, con 4000 personas), la bomba (Los Álamos, Oak Ridge, Hanford: 130 000 personas y 2000 millones de dólares), el sonar y la criptografía cambiaron la escala. Bush, en su informe <em>Science, the Endless Frontier</em> (1945), propuso que el Estado financiara la ciencia básica en las universidades, y en 1950 se creó la National Science Foundation. La física obtuvo un prestigio y un presupuesto sin precedentes («ahora los físicos tenemos pecado», dijo Oppenheimer).</p></li>
<li><b class="y">1957-1990 <span>· Sputnik, CERN, Guerra Fría</span></b><p>El Sputnik soviético (octubre de 1957) desencadenó en EE. UU. una enorme expansión de la enseñanza de la ciencia y de la financiación de la física. Se construyeron aceleradores cada vez mayores y más caros (el Fermilab, el CERN, el SSC cancelado en 1993) y se normalizó el trabajo en colaboraciones de cientos y miles de autores. La física de altas energías se convirtió en una ciencia dependiente de la diplomacia.</p></li>
<li><b class="y">1963 <span>· Price: Little Science, Big Science</span></b><p>Price contó las revistas científicas y descubrió que se duplican cada 15 años desde 1665; lo mismo ocurre con el número de científicos. Predijo que el crecimiento exponencial no podía continuar y que la ciencia pasaría de un régimen de «pequeña ciencia» a la «gran ciencia» con rendimientos decrecientes.</p></li>
</ol>

<div class="box rivalidad"><h4>Los científicos, el dinero y el poder</h4><p>La relación con quien paga es siempre ambivalente. Tycho necesitó a Federico II y a Rodolfo II; Galileo adulaba a los Médici (capítulo 11); Newton se hizo funcionario del Estado como Director de la Casa de la Moneda. En el siglo XX, los físicos que dirigieron proyectos militares (Oppenheimer, Teller, Lawrence) obtuvieron poder político y pagaron costos personales: Oppenheimer fue juzgado en 1954. En la URSS, los físicos nucleares (Kurchátov, Sájarov) tuvieron privilegios y prisiones; Landau estuvo preso en 1938. En la Alemania nazi, la «física aria» de Lenard y Stark persiguió a la «física judía» (la relatividad y la mecánica cuántica) hasta que la guerra mostró la superioridad de la física «judía». Un historiador (Forman, 1971) sostiene que el clima cultural de Weimar influyó en la aceptación del indeterminismo cuántico: hay quienes lo discuten, y es un caso clásico del <em>programa fuerte</em> de la sociología del conocimiento.</p></div>
<div class="box epist"><h4>Diversidad y objetividad</h4><p>¿Importa quién hace ciencia? Para el empirismo clásico, no: la objetividad es una propiedad de los métodos. Pero las epistemólogas feministas (Longino, Harding, Haraway) sostienen que la objetividad es una propiedad de <em>comunidades</em> críticas y diversas: lo que un grupo homogéneo da por supuesto, otro grupo lo cuestiona. La historia de la física tiene ejemplos concretos: Payne cuestionó una hipótesis de composición que el consenso había adoptado sin examinarla; las cuestiones sobre las curvas de rotación de Rubin (capítulo 33) y la acumulación de ciertos supuestos en la teoría de partículas. La relación entre justicia y buena ciencia no es automática, pero la exclusión sistemática tiene costos epistémicos, además de morales.</p></div>
</section>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Si el número de revistas se duplica cada 15 años, ¿cuántas veces se multiplica en un siglo?
<details><summary>Respuesta</summary><p>\(2^{100/15}=101\): unas cien veces (cerca del factor 10 cada 50 años).</p></details></li>
<li><span class="lvl">Básico</span>¿Qué fracción de los laureados del Nobel de Física son mujeres?
<details><summary>Respuesta</summary><p>5 de 225: 2.2 %.</p></details></li>
<li><span class="lvl">Intermedio</span>Con la ecuación de Saha para el hidrógeno (\(\chi=13.6\) eV, \(n_e=10^{20}\) m⁻³) calcule la razón \(n_{II}/n_I\) a 9000 K y a 12 000 K.
<details><summary>Respuesta</summary><p>El prefactor \((2\pi m_ekT/h^2)^{3/2}/n_e\) y \(e^{-\chi/kT}\) dan \(\approx0.5\) a 9000 K y \(\approx60\) a 12 000 K: el hidrógeno pasa de neutro a ionizado en unos 3000 K.</p></details></li>
<li><span class="lvl">Intermedio</span>El lagrangiano \(L=\tfrac12m\dot x^2-mgx\) no depende de \(y\). ¿Qué se conserva? ¿Y si se añade \(-kx\)?
<details><summary>Respuesta</summary><p>La simetría \(y\to y+a\) da la conservación del impulso \(p_y\). Como el lagrangiano no depende del tiempo, la energía también se conserva. Añadir \(-kx\) (un potencial lineal) no cambia eso.</p></details></li>
<li><span class="lvl">Avanzado</span>Explique la diferencia entre el efecto Mateo y el efecto Matilda y proponga una forma de medir cada uno con datos de citas.
<details><summary>Respuesta</summary><p>Mateo: los autores ya conocidos reciben más citas por el mismo trabajo; se mide comparando citas de artículos equivalentes en calidad con autores famosos y desconocidos. Matilda: se comparan las citas y premios de autoras y autores con contribuciones similares, controlando el campo y el lugar en la lista de autores. Estudios recientes (Ross et al.) muestran sesgos de este tipo en la concesión de premios y financiación.</p></details></li>
<li><span class="lvl">Avanzado</span>¿Qué cambió en la ciencia con el paso de la «pequeña» a la «gran ciencia»? Discuta autoría, evaluación y decisiones epistemológicas.
<details><summary>Respuesta</summary><p>El artículo con miles de autores no permite atribuir ideas individuales; la evaluación y la decisión de qué instrumento construir dependen de comités y política; los resultados se validan por colaboraciones independientes (ATLAS y CMS), lo que reemplaza la réplica individual. Surgen nuevas formas de confianza (Shapin: «el testimonio de los gentilhombres»), y se plantean cuestiones de responsabilidad, coste y representatividad.</p></details></li>
</ol>
