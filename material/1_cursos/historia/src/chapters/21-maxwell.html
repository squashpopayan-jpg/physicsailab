<template class="chapter-src" data-id="maxwell" data-num="21" data-title="Maxwell y Hertz" data-part="Parte V · Siglos XVIII y XIX" data-short="Maxwell, de Edimburgo al Cavendish; el modelo de ruedas y vórtices; la corriente de desplazamiento; la luz como onda electromagnética; las veinte ecuaciones y las cuatro de Heaviside; Hertz y las ondas; Marconi; el cable transatlántico y las unidades eléctricas">
<p class="lead">En 1862, un escocés de 31 años que enseñaba en King's College de Londres hizo un cálculo con dos números medidos en laboratorios alemanes: la razón entre las unidades electrostática y electromagnética de carga, hallada por Weber y Kohlrausch con una botella de Leiden, y la velocidad de la luz, medida por Fizeau con una rueda dentada. Los dos resultados, uno de la electricidad y otro de la óptica, eran casi iguales: unos 310 000 km/s. James Clerk Maxwell escribió, con una calma que solo el tiempo vuelve dramática: «casi no podemos evitar la inferencia de que la luz consiste en las ondulaciones transversales del mismo medio que es la causa de los fenómenos eléctricos y magnéticos».</p>

<div class="vitals">
<div><b>Época</b>1855 – 1900</div>
<div><b>Lugares</b>Edimburgo, Cambridge, Aberdeen, Londres, Karlsruhe, Bonn, Bolonia</div>
<div><b>Idea</b>campo continuo; la luz es electromagnética</div>
<div><b>Resultado</b>las ecuaciones de Maxwell, ondas de radio</div>

<section>
<h2>Un escocés extraño</h2>
<div class="box contexto"><h4>Telégrafo, imperio e industria</h4><p>La Gran Bretaña de 1860 estaba cubierta de cables. El primer cable transatlántico (1858) funcionó tres semanas y se estropeó cuando un ingeniero aplicó demasiada tensión; el segundo (1866), con el barco <em>Great Eastern</em>, tuvo éxito gracias a la teoría de William Thomson (la ecuación del telegrafista y su galvanómetro de espejo), que valió a Thomson el título de caballero. El telégrafo exigía <em>unidades</em> comunes de resistencia y de tensión: la Asociación Británica creó en 1861 un comité (Maxwell, Thomson, Jenkin y otros) que definió el ohm, el voltio y la unidad de capacidad, y midió con precisión la razón entre unidades. Esa ciencia práctica fue la base del cálculo de Maxwell. Cuando el duque de Devonshire, rico y cultor de la ciencia, donó el dinero para el laboratorio de física de Cambridge (1871), el primer catedrático fue Maxwell, tras declinar Thomson y Helmholtz.</p></div>
<div class="people">
<div class="persona"><b>James Clerk Maxwell</b><small>1831 – 1879 · Edimburgo, Aberdeen, Londres, Cambridge</small><p>Hijo único de un abogado escocés; sus compañeros del colegio lo llamaban «Dafty» por sus rarezas. Con 14 años publicó un artículo sobre óvalos. Profesor a los 25. Casado con Katherine Dewar, sin hijos. Murió de cáncer a los 48 años.</p></div>
<div class="persona"><b>Oliver Heaviside</b><small>1850 – 1925 · Londres, Newcastle, Torquay</small><p>Ingeniero telegrafista, autodidacta, medio sordo. Simplificó las ecuaciones de Maxwell, inventó el cálculo operacional y predijo la ionosfera. Vivió pobre y excéntrico, enfrentado a la ortodoxia matemática.</p></div>
<div class="persona"><b>Heinrich Hertz</b><small>1857 – 1894 · Hamburgo, Karlsruhe, Bonn</small><p>Alumno de Helmholtz. Confirmó con ondas las predicciones de Maxwell (1886-1888). Murió a los 36 años de una septicemia crónica.</p></div>
<div class="persona"><b>Hermann von Helmholtz</b><small>1821 – 1894 · Berlín</small><p>El mayor físico alemán del siglo. Propuso en 1879 el premio sobre la teoría de Maxwell que motivó a Hertz.</p></div>
<div class="persona"><b>Wilhelm Weber y Rudolf Kohlrausch</b><small>1804–1891 · 1809–1858</small><p>Midieron en 1855-1856 la razón de las unidades electrostática y electromagnética, con el valor 3.107×10⁸ m/s: el «número» que Maxwell reconoció como la velocidad de la luz.</p></div>
<div class="persona"><b>Guglielmo Marconi</b><small>1874 – 1937 · Bolonia, Londres</small><p>Ingeniero e empresario italiano. Convirtió las ondas de Hertz en comunicación: 1895 en Pontecchio, 1901 a través del Atlántico.</p></div>
</div>
</section>

<section>
<h2>De las líneas de fuerza a las ecuaciones</h2>
<ol class="chain">
<li><b class="y">1855-1856 <span>· «Sobre las líneas de fuerza de Faraday»</span></b><p>Maxwell, aún en Cambridge, tradujo las ideas de Faraday (capítulo 20) al lenguaje de William Thomson: un fluido incompresible cuyos tubos de flujo representan el campo. Es una <em>analogía</em> (no una teoría): permitía usar las matemáticas de la hidrodinámica para describir el magnetismo y la electricidad.</p></li>
<li><b class="y">1861-1862 <span>· «Sobre las líneas físicas de fuerza»</span></b><p>Propuso un modelo mecánico del éter: un mar de pequeños vórtices (celdas de rotación) que representan el campo magnético, separados por ruedas dentadas libres («ruedas locas») que transmiten el giro y representan la electricidad. Con ese modelo dedujo una modificación de la ley de Ampère: para que una corriente variable en un condensador cree campo magnético, el campo eléctrico variable debe actuar como una corriente, la <em>corriente de desplazamiento</em>. El medio elástico del modelo debía propagar ondas transversales a una velocidad que se calcula con las constantes eléctricas.</p></li>
<li><b class="y">1862 <span>· la luz</span></b><p>La velocidad calculada, 310 740 km/s, coincidía con la de la luz. Maxwell concluyó que la luz es una onda electromagnética.</p></li>
<li><b class="y">1864-1865 <span>· «Una teoría dinámica del campo electromagnético»</span></b><p>Abandonó el modelo de ruedas, que había cumplido su función, y presentó veinte ecuaciones con veinte variables, deducidas con la mecánica de Lagrange (capítulo 16), sin recurrir a la mecánica de vórtices. El campo, no el éter, era la realidad central.</p></li>
<li><b class="y">1873 <span>· Tratado de electricidad y magnetismo</span></b><p>Dos volúmenes con la teoría completa. Es un libro difícil, con la teoría expuesta junto a modelos, analogías y largas discusiones de medidas; fueron Heaviside, Hertz y Lorentz quienes la depuraron.</p></li>
</ol>
<div class="eq key" data-name="Corriente de desplazamiento y velocidad de las ondas">\[\nabla\times\vb B=\mu_0\vb J+\mu_0\varepsilon_0\frac{\partial\vb E}{\partial t}\qquad\Longrightarrow\qquad c=\frac1{\sqrt{\mu_0\varepsilon_0}}.\]</div>
<div class="sim" data-sim="medidas-c" data-title="Ciento ochenta años de medidas de la velocidad de la luz"></div>
<div class="sim-guide"><ul>
<li>Desplace el control año a año. En 1855 las cifras de Römer (220 000), de Bradley (301 000), de Fizeau (315 300) y de Weber y Kohlrausch (310 740) están en el mismo orden de magnitud y se superponen con sus errores: de ahí el vínculo que vio Maxwell.</li>
<li>La coincidencia de dos métodos <em>independientes</em> (uno con electricidad estática y otro con luz) no es casual: es la misma estructura que usó Perrin con los átomos (capítulo 18). El valor actual es exacto desde 1983: el metro se define a partir de c.</li>
</ul></div>
<div class="box epist"><h4>Un modelo que se tira, una analogía que fecunda</h4><p>El modelo de ruedas y vórtices de Maxwell es casi cómico, y sin embargo produjo la corriente de desplazamiento, un término que no estaba en ninguna medida de la época. Maxwell lo dijo con franqueza: no creía que el éter fuera de ruedas, sino que ese modelo era «una imagen mental de cómo podría ser». Su filosofía (en el ensayo <em>Sobre las analogías físicas</em>, 1856) era que, mientras no se conozca la verdadera naturaleza de un fenómeno, es útil una analogía formal con otro mejor entendido. La analogía es una <em>heurística</em>, no una explicación, y puede desecharse cuando ha dado fruto. Hertz resumió su posición en 1889: «la teoría de Maxwell es el sistema de ecuaciones de Maxwell»: las ecuaciones valen sin el modelo.</p></div>
<div class="box leyenda"><h4>Las «ecuaciones de Maxwell» no son de Maxwell</h4><p>Las cuatro ecuaciones elegantes que hoy se llaman de Maxwell (con \(\nabla\cdot\) y \(\nabla\times\)) se las debemos a Heaviside, que las reescribió entre 1884 y 1888 con el cálculo vectorial de Gibbs y suyo, y a Hertz (1890). El texto de 1865 usaba veinte ecuaciones con componentes y potenciales; Maxwell, que aún no tenía el cálculo vectorial, no pudo ver la simetría. La fuerza de Lorentz, ausente en Maxwell (la ecuación de fuerza sobre una carga), la añadieron Heaviside (1889) y Lorentz (1892). Es un ejemplo extremo de lo que Stigler diría: las leyes se nombran por quien las inspiró, no por quien les dio su forma actual.</p></div>
<div class="sim" data-sim="fdtd-maxwell" data-title="Las ecuaciones de Maxwell en acción: un pulso que cruza una frontera"></div>
<div class="sim-guide"><ul>
<li>Con \(n=1.5\) la teoría da reflexión de amplitud 0.2 (4 % de la energía) y transmisión 0.8. Pruebe \(n=3\): reflexión del 50 % en amplitud (25 % en energía). La velocidad en el medio es \(c/n\) con \(n=\sqrt{\varepsilon_r}\): la <em>óptica</em> (reflexión, refracción, índice) sale de la teoría electromagnética.</li>
<li>Es el cálculo que Fresnel hizo en 1823 con un modelo mecánico del éter; Maxwell lo reproduce sin suponer qué vibra.</li>
</ul></div>
<div class="box rivalidad"><h4>Heaviside contra los matemáticos</h4><p>Oliver Heaviside, que aprendió solo y dejó su empleo de telegrafista en 1874, resolvía ecuaciones diferenciales con un «cálculo operacional» eficaz pero sin rigor. Los matemáticos de Cambridge lo desdeñaron; él les respondía: «¿Debo rechazar mi cena porque no comprendo del todo el proceso de la digestión?». En el <em>Electrician</em> y en tres volúmenes de <em>Electromagnetic Theory</em> (1893-1912) criticó a los «matemáticos puros» y a los ingenieros de la Oficina de Correos (William Preece, que lo atacó en público y retrasó sus publicaciones). Fue elegido miembro de la Royal Society en 1891, y fue marginado por su carácter. Murió en 1925 en Torquay: se cuenta que pintaba las uñas de rosa y usaba bloques de granito como muebles. La rehabilitación de su cálculo llegó con la transformada de Laplace.</p></div>
</section>

<section>
<h2>Hertz: las ondas existen</h2>
<div class="box contexto"><h4>Helmholtz y el premio de 1879</h4><p>Maxwell murió en 1879 sin ver confirmada su teoría; en Alemania dominaba la electrodinámica de acción a distancia de Weber y Neumann. Helmholtz propuso a la Academia de Berlín en 1879 un premio para quien pusiera a prueba la teoría de Maxwell contra la de Weber, y un estudiante suyo, Heinrich Hertz, que veía claro que era una gran cuestión, se interesó, pero estimó que los medios de la época no bastaban. En 1885, ya profesor en Karlsruhe, comenzó a hacerlo.</p></div>
<ol class="chain">
<li><b class="y">1886 <span>· la chispa que salta sola</span></b><p>Descargó un carrete con un entrehierro y notó que en otro circuito cercano, sin conexión, saltaban chispas. Lo atribuyó a un efecto de inducción a distancia que aparecía con retraso.</p></li>
<li><b class="y">1887 <span>· el oscilador</span></b><p>Un circuito con un entrehierro entre dos esferas, activado por una bobina de Ruhmkorff, que emitía «oscilaciones» de 30 a 500 MHz; y un detector, un anillo de alambre con un hueco minúsculo, en el que se veía una chispa. Midió la intensidad de la chispa a distintas distancias.</p></li>
<li><b class="y">1888 <span>· ondas estacionarias</span></b><p>Con una pared de cinc a 13 m reflejando las ondas, halló nodos y vientres de la chispa separados por 4.8 m: longitud de onda de 9.6 m. Con la frecuencia del circuito, \(c\simeq\lambda f\simeq3\times10^8\) m/s. Mostró también que las ondas se reflejan, se refractan (con un prisma de brea de 1.5 toneladas) y se polarizan (con una rejilla de alambres): son como la luz.</p></li>
</ol>
<div class="sim" data-sim="hertz-ondas" data-title="El experimento de Hertz: ondas estacionarias de radio"></div>
<div class="sim-guide"><ul>
<li>Con 300 nH y 95 pF la frecuencia es de 29.8 MHz y la longitud de onda de 10 m: nodos cada 5 m. Cambie la distancia al reflector: los nodos mantienen su separación; solo cambia cuántos caben. Hertz ajustaba la posición del detector para localizarlos.</li>
<li>El valor de c que se obtiene depende de que la <em>frecuencia</em> calculada del circuito (con L y C estimadas) sea correcta: la medición de Hertz tenía un error del 10 % por esa razón.</li>
</ul></div>
<div class="box fuente"><h4>Hertz, 1888 (a Helmholtz) y la publicación de 1892</h4><blockquote>Estas experiencias… parecen eliminar las dudas sobre la identidad de la luz, el calor radiante y el movimiento ondulatorio electromagnético.</blockquote><p>Hertz, <em>Untersuchungen über die Ausbreitung der elektrischen Kraft</em> (1892). Hertz enunció en 1889 una visión del método científico (en la introducción de sus <em>Principios de la mecánica</em>, 1894): las teorías son «imágenes» (<em>Bilder</em>) que nos hacemos de los fenómenos, tales que las consecuencias lógicas de las imágenes coinciden con las consecuencias de los fenómenos; y de varias imágenes posibles, elegimos la más simple. Wittgenstein tomó de ahí su teoría pictórica del lenguaje.</p></div>
<div class="box leyenda"><h4>«No sirve para nada»</h4><p>Se atribuye a Hertz haber respondido, cuando un alumno le preguntó por las aplicaciones de sus ondas: «No creo que tengan ninguna aplicación práctica. Es solamente un experimento que demuestra que el maestro Maxwell tenía razón». Aunque se cita siempre, no hay fuente primaria que lo confirme. Sí es verdad que Hertz no vio las posibilidades de comunicación, y que murió a los 36 años. Su nombre pasó a la unidad de frecuencia (hercio) en 1930; la radio nació de otros: Marconi, Popov, Lodge, Tesla, Branly.</p></div>
</section>

<section>
<h2>Marconi y la ciencia que se vuelve industria</h2>
<p>Guglielmo Marconi, joven aficionado de Bolonia, leyó los trabajos de Hertz y de Righi (su profesor) y en 1895 logró enviar señales a 2 km con un alambre alto y una toma de tierra. Sin un puesto en la universidad italiana, fue a Inglaterra, donde el director de la Oficina de Correos, Preece (el mismo que había obstaculizado a Heaviside), lo apoyó. En 1899 cruzó el Canal y en diciembre de 1901 afirmó haber recibido en Terranova, en Signal Hill, la letra «S» (tres puntos) transmitida desde Poldhu (Cornualles). Hubo escepticismo (no hubo testigos independientes, y la teoría de entonces sostenía que las ondas no podían seguir la curvatura de la Tierra); Heaviside y Kennelly sugirieron en 1902 una capa conductora de la atmósfera, la ionosfera, que reflejaría las ondas. Marconi compartió el Nobel de 1909.</p>
<div class="box contexto"><h4>De la ecuación a la industria</h4><p>La trayectoria de las ecuaciones de Maxwell es un buen ejemplo de la relación entre ciencia básica y tecnología: 1865 (teoría), 1888 (confirmación), 1895 (comunicación), 1901 (cruce del Atlántico), 1920 (radiodifusión), 1940 (radar), 1990 (telefonía móvil). Lo que fue el esfuerzo de un teórico fascinado por la analogía con Faraday, transformó la sociedad en cincuenta años. En paralelo, la «guerra de las corrientes» (1880-1892) entre Edison (corriente continua) y Westinghouse y Tesla (corriente alterna) dependía directamente de las leyes de Faraday y Maxwell, y de la política comercial.</p></div>
<div class="sim" data-sim="timeline" data-ch="maxwell" data-from="1850" data-to="1905" data-title="Línea de tiempo de Maxwell y Hertz"></div>

<li>Hertz (1857-1894) y Marconi (1874-1937) no coincidieron; la radio se construyó sobre sus papers, no sobre su trato.</li>

<section>
<h2>Epistemología de la unificación</h2>
<div class="box epist"><h4>Dos campos de la física se funden: ¿qué cuenta como prueba?</h4><p>La unificación de la electricidad, el magnetismo y la óptica fue vista como un triunfo de la teoría; pero Maxwell no tenía una prueba experimental directa hasta Hertz. ¿Qué lo hizo creíble? (1) La <em>coincidencia numérica</em> de dos constantes de campos distintos; (2) la <em>fertilidad</em> (explicaba la reflexión, la refracción, la polarización y predecía fenómenos nuevos: ondas de radio, presión de radiación); (3) la <em>simplicidad formal</em> de las ecuaciones; (4) la <em>consonancia</em> con la intuición de Faraday. Las dos primeras son del tipo que un popperiano valora (predicciones arriesgadas); las dos siguientes son estéticas. Whewell habló de <em>consiliencia</em>: una teoría gana crédito cuando explica fenómenos de dominios que no se habían considerado relacionados. Después de Hertz, la teoría de Maxwell se convirtió en el modelo mismo de cómo debe ser una teoría física, y por contraste motivó la crisis del éter (capítulo 23), porque sus ecuaciones no eran invariantes bajo las transformaciones de Galileo.</p></div>
</section>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Con \(\mu_0=4\pi\times10^{-7}\) y \(\varepsilon_0=8.854\times10^{-12}\), calcule \(c=1/\sqrt{\mu_0\varepsilon_0}\).
<details><summary>Respuesta</summary><p>\(\mu_0\varepsilon_0=1.1127\times10^{-17}\) s²/m²; \(c=2.998\times10^8\) m/s.</p></details></li>
<li><span class="lvl">Básico</span>Un circuito LC con 300 nH y 95 pF. ¿Qué frecuencia y qué longitud de onda emite?
<details><summary>Respuesta</summary><p>\(f=1/(2\pi\sqrt{LC})=29.8\) MHz; \(\lambda=c/f=10.1\) m; nodos cada 5.0 m.</p></details></li>
<li><span class="lvl">Intermedio</span>En una interfaz aire–vidrio con \(n=1.5\), calcule la fracción de energía reflejada a incidencia normal.
<details><summary>Respuesta</summary><p>\(R=((1-1.5)/(1+1.5))^2=0.04\): el 4 %.</p></details></li>
<li><span class="lvl">Intermedio</span>Weber y Kohlrausch obtuvieron \(3.107\times10^8\) m/s y Fizeau \(3.153\times10^8\) m/s; el valor actual es \(2.998\times10^8\). ¿Qué error relativo tenía cada uno? ¿Por qué la coincidencia era una prueba pese a los errores?
<details><summary>Respuesta</summary><p>+3.6 % y +5.2 %. La coincidencia de dos números <em>sin relación aparente</em> en un 1.5 % es muy improbable por azar: pocos números entre 1 y 10 coincidirían así, y no había razón para que la razón de unidades eléctricas diera una velocidad.</p></details></li>
<li><span class="lvl">Avanzado</span>Compare el uso del modelo mecánico en Maxwell (1861) y la actitud de Hertz (1889) y de Duhem sobre los modelos. ¿Qué papel tienen en el descubrimiento y en la justificación?
<details><summary>Respuesta</summary><p>Para Maxwell el modelo es una ayuda heurística para el descubrimiento; la justificación está en las ecuaciones y los datos. Hertz y Duhem rechazan que un modelo mecánico sea necesario y lo ven como un andamio. Los británicos (Thomson: «no comprendo nada hasta que puedo construir un modelo mecánico») lo consideraban condición de comprensión. La disputa entre «comprender» (modelo) y «predecir» (ecuaciones) reaparece con la mecánica cuántica.</p></details></li>
</ol>
