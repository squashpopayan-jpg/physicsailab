<p class="lead">Hacia 1800 a. C., en alguna ciudad del sur de Mesopotamia, un escriba redondeó un disco de arcilla del tamaño de la palma de la mano, trazó dos diagonales sobre un cuadrado y escribió, con la cuña de su estilete, la raíz cuadrada de 2 con una precisión de una parte en un millón. No tenía telescopio ni cálculo: tenía una escuela de escribas, un sistema de numeración de base 60 y siglos de práctica. La física no empieza con los griegos; empieza cuando alguien decide anotar lo que el cielo hace y buscar regularidades.</p>

<section>
<h2>Mirar el cielo para vivir</h2>
<p>Los primeros «físicos» fueron agricultores, sacerdotes y administradores. Había motivos prácticos: saber cuándo sembrar, cuándo esperaba la crecida del río, cuándo debían pagarse los impuestos, cuándo se celebraban las fiestas. El calendario era una herramienta de poder: quien lo fijaba, mandaba. En Mesopotamia, los reyes mandaban consultar a los astrónomos sobre las señales del cielo; en Egipto, los sacerdotes del templo vigilaban la salida de Sirio.</p>
<div class="box contexto"><h4>Escribas, templos y palacios</h4><p>La astronomía babilonia no la hacía un aficionado, sino funcionarios pagados por el templo o el palacio. Las observaciones se archivaban en «diarios astronómicos» que se llevaron durante unos setecientos años (desde mediados del siglo VII a. C. hasta el siglo I a. C.): lunaciones, posiciones planetarias, el clima, el precio de la cebada. Esa continuidad es una condición social de la ciencia que los griegos recibieron y aprovecharon: Ptolomeo, ocho siglos después, usa eclipses babilonios desde el año 721 a. C. como datos.</p></div>
<p>La motivación dominante era la adivinación: se creía que los fenómenos celestes anunciaban sucesos terrenales, y la colección <em>Enuma Anu Enlil</em> reunía unas siete mil presagios. Eso no fue un estorbo sino un motor. Para interpretar un eclipse como señal había que saber cuándo ocurriría y vigilar el cielo con constancia; el rey, que temía un eclipse, nombraba a un «rey sustituto» que cargaba con el mal presagio. La astrología, por esa vía, financió durante siglos la astronomía precisa.</p>
<div class="people">
<div class="persona"><b>Los escribas de Babilonia</b><small>c. 1800 – 100 a. C. · Babilonia, Uruk, Nínive</small><p>Funcionarios que dominaban la escritura cuneiforme y el sistema sexagesimal. Anónimos en su mayoría; a algunos los conocemos por colofones de tablillas, como Nabu-rimanni (siglo V a. C.) y Kidinnu (siglo IV a. C.), a quienes se atribuyen los dos sistemas aritméticos de predicción lunar.</p></div>
<div class="persona"><b>Mozi</b><small>c. 470 – c. 391 a. C. · China (Estado de Lu)</small><p>Filósofo artesano, fundador de la escuela moísta. Su escuela dejó el primer tratado óptico conocido: explica la imagen invertida que produce un orificio y la reflexión en espejos.</p></div>
<div class="persona"><b>Zhang Heng</b><small>78 – 139 · Nanyang, Luoyang</small><p>Astrónomo, matemático y funcionario de la dinastía Han. Construyó un sismoscopio en 132 y una esfera armilar movida por agua.</p></div>
<div class="persona"><b>Shen Kuo</b><small>1031 – 1095 · Hangzhou, Kaifeng</small><p>Polímata y funcionario Song. En el <em>Meng Xi Bi Tan</em> («Ensayos de la corriente de los sueños», 1088) describe la declinación magnética y varias formas de brújula.</p></div>
<div class="persona"><b>Aryabhata</b><small>476 – c. 550 · Kusumapura (Pataliputra)</small><p>Matemático astrónomo indio. En el <em>Aryabhatiya</em> (499) da una tabla de senos, \(\pi\approx 3.1416\) y propone que la Tierra gira sobre su eje para explicar el movimiento diario de las estrellas.</p></div>
<div class="persona"><b>Brahmagupta</b><small>598 – 668 · Bhinmal (Rajastán)</small><p>Astrónomo y matemático. En el <em>Brahmasphutasiddhanta</em> (628) fija reglas aritméticas para el cero y los números negativos.</p></div>
</div>

<section>
<h2>Babilonia: aritmética para predecir</h2>
<h3>La base 60</h3>
<p>Los babilonios contaban en base 60 posicional, cosa que los demás pueblos de la época no hacían. Heredamos de ella los 60 minutos de la hora, los 60 segundos del minuto y los 360° del círculo. Tenía la ventaja de que 60 es divisible por 2, 3, 4, 5, 6, 10, 12, 15, 20 y 30, lo que facilita las fracciones. Y permitía hacer cuentas con una sola tabla de multiplicar (de 1 a 59) y una tabla de inversos de números «regulares» (los que solo tienen factores 2, 3 y 5).</p>
<h3>YBC 7289: √2 en una tablilla</h3>
<p>La tablilla YBC 7289 (Colección Babilonia de Yale, c. 1800–1600 a. C.) muestra un cuadrado de lado 30 con sus diagonales. Sobre una de ellas está escrito \(1;24,51,10\) (es decir, \(1+\tfrac{24}{60}+\tfrac{51}{3600}+\tfrac{10}{216\,000}=1.41421296\)) y debajo \(42;25,35\), que es \(30\times1.41421296\), la longitud de la diagonal. El resultado difiere de \(\sqrt2\) en seis millonésimas.</p>
<p>No se sabe cómo lo obtuvieron, pero el valor coincide con la segunda iteración del método de promediar una estimación con su complemento: partiendo de \(x_0=3/2\), \(x_1=\tfrac12(x_0+2/x_0)=17/12\) y \(x_2=577/408=1.41421569\), cuyos tres primeros decimales sexagesimales son 24, 51, 10. Es el algoritmo que más tarde se asoció a Herón de Alejandría (siglo I) y a Newton.</p>
<div class="eq key" data-name="Método babilónico (o de Herón)">\[x_{n+1}=\frac12\left(x_n+\frac{a}{x_n}\right),\qquad x_n\to\sqrt a .\]</div>
<div class="sim" data-sim="babsqrt" data-title="√2 con el método babilónico y la tablilla YBC 7289"></div>
<div class="sim-guide"><ul>
<li>Con \(x_0=1.5\) y dos iteraciones se reproduce, hasta la tercera cifra sexagesimal, el valor de la tablilla. La convergencia es <em>cuadrática</em>: cada paso duplica las cifras correctas.</li>
<li>Cambie la estimación inicial: aun partiendo de 1 o de 2 se llega al mismo valor en unos pocos pasos.</li>
</ul></div>
<h3>Plimpton 322</h3>
<p>La tablilla Plimpton 322 (c. 1800 a. C., Columbia University) tiene cuatro columnas y quince filas de números. Cada fila contiene los lados de un triángulo rectángulo de lados enteros: (119, 120, 169), (3367, 3456, 4825), (65, 72, 97)… Escribir la terna \((b,h,d)\) con \(b^2+h^2=d^2\) mil años antes de Pitágoras muestra que el teorema se conocía y se usaba. Lo que no hay es una demostración: los babilonios daban procedimientos, no teoremas.</p>
<p>¿Para qué servía? Hay tres lecturas, y la tablilla no resuelve la discusión. Otto Neugebauer (1945) vio un listado de ternas generadas con números regulares, una pieza de teoría de números. Eleanor Robson (2001) la interpretó como una hoja de trabajo para maestros de escribas, para resolver ecuaciones cuadráticas. Daniel Mansfield y Norman Wildberger (2017) propusieron que es una tabla trigonométrica, porque los ángulos bajan casi uniformemente de 45° a 32°. Es un ejemplo de <span class="term">subdeterminación histórica</span>: el documento admite varias interpretaciones, y lo que se elige refleja las preguntas de cada época.</p>
<div class="sim" data-sim="plimpton" data-title="Las quince filas de Plimpton 322"></div>
<div class="sim-guide"><ul>
<li>Recorra las filas: la comprobación \(b^2+h^2=d^2\) se cumple siempre con los valores corregidos. La tablilla original tiene algunos errores de copia que los especialistas han identificado.</li>
<li>A la derecha, el ángulo desciende con regularidad. Es el argumento principal de quienes la leen como tabla trigonométrica.</li>
</ul></div>
<h3>El ciclo de Saros</h3>
<p>La hazaña astronómica babilonia es el descubrimiento de que los eclipses se repiten. Un eclipse lunar exige luna llena y que la Luna esté cerca de un nodo (el punto donde su órbita cruza la eclíptica). Los tres «meses» de la Luna son distintos: el sinódico (de luna nueva a luna nueva, 29.5306 días), el dracónico (de nodo a nodo, 27.2122 d) y el anomalístico (de perigeo a perigeo, 27.5545 d). Pero ocurre una coincidencia notable:</p>
<div class="eq key" data-name="Ciclo de Saros">\[223\,\text{lunaciones}=6585.32\,\text{d}\approx242\,\text{meses dracónicos}\approx239\,\text{meses anomalísticos}\approx18\text{ años y }11\text{ días}.\]</div>
<p>Después de 6585⅓ días, los tres cuadran y el eclipse se repite casi igual, desplazado unas 8 horas (por eso el siguiente se ve 120° más al oeste). El nombre «saros» no es babilonio: lo introdujo Edmond Halley en 1691, malinterpretando un término caldeo que designaba otra cosa. Los babilonios usaban una lista de eclipses por pares de ciclos y predicciones con aritmética, no con geometría.</p>
<div class="sim" data-sim="saros" data-title="Por qué 223 lunaciones: tres ciclos que coinciden"></div>
<div class="sim-guide"><ul>
<li>Las curvas muestran, para cada \(N\), cuán lejos queda \(N\) lunaciones del múltiplo entero más cercano de meses dracónicos (rojo) y anomalísticos (azul). En 223 ambos desfases son menores que un día.</li>
<li>Pulse «Metón (235)»: 235 lunaciones valen casi exactamente 19 años tropicales (desfase de 0.09 días), el ciclo que usaron más tarde los griegos para su calendario.</li>
</ul></div>
<div class="box epist"><h4>Predecir sin explicar</h4><p>Los babilonios predecían eclipses con una precisión que los griegos no igualaron durante siglos, pero lo hacían con tablas y reglas aritméticas, sin un modelo geométrico del movimiento. Cuando los griegos reciben estos datos (Hiparco, siglo II a. C.), lo que añaden es una pregunta: <em>¿qué movimiento en el espacio produce esto?</em> El contraste entre una ciencia de recetas y una de modelos recorre toda la historia: cuando Kepler o Newton dan «causas», se discute si eso aumenta el poder predictivo o solo la comprensión (capítulo 14).</p></div>
</section>

<section>
<h2>Egipto: el río, la sombra y el papiro</h2>
<p>Heródoto llamó a Egipto «don del Nilo». La crecida anual fertilizaba la tierra y borraba los linderos: de ahí la necesidad de medir y volver a medir los campos, y de ahí (según el propio Heródoto) la geometría, «medida de la tierra». El calendario civil constaba de 12 meses de 30 días más 5 días «epagómenos», 365 días en total, sin años bisiestos. Se quedaba atrás respecto de las estaciones un día cada cuatro años, de modo que en 1460 años recorría todas las estaciones. La referencia natural era la salida helíaca de Sirio, que coincidía aproximadamente con el inicio de la crecida.</p>
<p>Las matemáticas eran prácticas. El <em>papiro Rhind</em> (c. 1550 a. C., copia de un original más antiguo por el escriba Ahmes) enseña a calcular áreas y volúmenes; para el círculo, usa el cuadrado de \(\tfrac89\) del diámetro, lo que equivale a \(\pi\approx3.1605\), un error del 0.6 %. El papiro de Moscú (c. 1850 a. C.) contiene el cálculo exacto del volumen de un tronco de pirámide. Los egipcios medían el tiempo con relojes de agua (clepsidras), uno de los cuales, hallado en Karnak, se fecha hacia 1400 a. C.</p>
<div class="box leyenda"><h4>Las pirámides y π</h4><p>Se repite a menudo que la Gran Pirámide «contiene» el número π o la proporción áurea. La razón entre el perímetro de su base y su altura es cercana a \(2\pi\), pero eso sale de la <em>pendiente</em> elegida, el <em>seked</em> de 5½ palmos por codo, una medida corriente para construir. No hay texto egipcio que hable de proporción áurea. Es un caso de pareidolia matemática: con muchas medidas y muchas razones posibles, algo siempre coincide.</p></div>
</section>

<section>
<h2>China: luz, sismos e imanes</h2>
<p>En China el cielo era asunto de Estado: la dinastía gobernaba con el «mandato del cielo» y los astrónomos oficiales registraban cometas, eclipses y «estrellas invitadas». Del año 240 a. C. data el primer registro seguro del cometa Halley; en el año 1054 los cronistas chinos anotaron una «estrella huésped» tan brillante que se vio de día durante semanas: era la supernova cuyo residuo es hoy la nebulosa del Cangrejo.</p>
<p>La escuela de Mozi, entre los siglos V y IV a. C., buscó causas mecánicas: la <em>luz viaja en línea recta</em>, y por eso un orificio produce una imagen invertida (hoy diríamos, una cámara oscura). Esta es la primera explicación que conservamos de ese efecto. Zhang Heng, en 132, presentó a la corte un «instrumento para medir los vientos y movimientos de la Tierra»: un recipiente de bronce con ocho dragones cuyas bolas caían en las bocas de ranas cuando un temblor, lejano, movía un péndulo interno. Los historiadores discuten si funcionaba como lo cuentan las crónicas.</p>
<p>El imán es otro caso. La «cuchara que apunta al sur» (<em>sinan</em>) de la época Han (siglos III a. C. – II d. C.) era un objeto de adivinación; la aguja magnética para navegar surge hacia el siglo XI. Shen Kuo, en 1088, notó que la aguja magnetizada «siempre se desvía un poco hacia el este y no apunta exactamente al sur»: la <span class="term">declinación magnética</span>. En Europa, Colón la observará en 1492 y Gilbert la sistematizará en 1600 (capítulo 12).</p>
<div class="box leyenda"><h4>La brújula «inventada para navegar»</h4><p>Es frecuente leer que los chinos la crearon para navegar. Los textos más antiguos (siglos III a. C. – I d. C.) la describen como instrumento geománico, para orientar casas y tumbas según el <em>feng shui</em>. Las primeras referencias al uso en el mar son de los siglos XI-XII, y en Europa aparecen casi simultáneamente (Alexander Neckam, hacia 1190). Se ignora si fue transmitida o si se inventó de forma independiente.</p></div>
</section>

<section>
<h2>India: el cero, los senos y la rotación terrestre</h2>
<p>El mayor regalo de la India a la física es posiblemente una convención de escritura: el sistema decimal posicional con el cero como número. Se conoce plenamente en los textos del siglo VII; Brahmagupta (628) define la suma y la resta con cero y enuncia reglas para las cantidades negativas («una deuda restada de cero es un bien»). Pasará al mundo islámico (al-Juarismi, siglo IX) y a Europa (Fibonacci, 1202), y sin él no habría álgebra simbólica ni cálculo.</p>
<p>Aryabhata (499) calculó una tabla de senos de 24 valores (de 3¾° en 3¾°) con una precisión de cuatro cifras, un avance respecto de las cuerdas griegas. Propuso además que las estrellas parecen moverse al oeste porque la Tierra gira hacia el este, «como un hombre en un barco que ve las orillas moverse hacia atrás». Fue una idea minoritaria: sus propios comentaristas la rechazaron y la reinterpretaron.</p>
<p>La escuela Vaisheshika (Kanada, entre los siglos VI y II a. C. según las fuentes) ofreció una teoría atómica: el mundo está hecho de partículas indivisibles (<em>paramanu</em>) de cuatro elementos. Como la griega que se verá en el capítulo 3, nació del razonamiento y no del experimento.</p>
</section>

<section>
<h2>Mesoamérica: Venus y los 584 días</h2>
<p>El Códice de Dresde (copia del siglo XI-XII, de un original anterior) contiene una tabla de Venus. Los mayas habían observado que el planeta repite su aparición cada 584 días (el valor moderno es 583.92); 5 ciclos son 2920 días, es decir, exactamente 8 años de 365 días. Sabían que 584 fallaba un poco, y la tabla incluye correcciones que a lo largo de 65 ciclos (37 960 días, dos «ruedas calendáricas» de 52 años) mantienen el error en unas pocas horas. Es el mismo estilo babilónico: una aritmética de períodos calibrada con siglos de observaciones. El almanaque ritual de 260 días y el año de 365 se engranaban en una «rueda calendárica» que se repetía cada 52 años.</p>
<p>Al llegar los españoles, la mayor parte de los códices fue quemada, como en 1562 por orden del obispo Diego de Landa en Maní (Yucatán): solo sobreviven tres códices mayas indiscutidos (Dresde, Madrid y París) y un cuarto, el Grolier, cuya autenticidad se discute. Es un ejemplo de lo frágil que es la memoria científica cuando depende de un soporte y de un poder.</p>
</section>

<section>
<h2>Qué faltaba: la física como pregunta</h2>
<p>Las civilizaciones anteriores dominaron las cuentas, los calendarios y los procedimientos, pero (con excepciones, como la óptica de Mozi) ofrecían pocas explicaciones naturales. Los fenómenos eran obra de dioses o de órdenes cósmicos que se conocían por ritual. En el capítulo 3, algunos griegos de la costa de Asia Menor propondrán algo distinto: que la naturaleza obedece causas propias, comprensibles con la razón y discutibles en público. El historiador de la ciencia G. E. R. Lloyd llama a esto «la invención de la naturaleza»: no solo conocimientos, sino el concepto de que existe algo llamado naturaleza y que se puede estudiar sin referirse a los dioses.</p>

<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Escriba 100 en base 60 y el número \(2;30\) como fracción decimal.
<details><summary>Respuesta</summary><p>\(100=1\cdot60+40\), es decir, \(1,40\). \(2;30=2+30/60=2.5\).</p></details></li>
<li><span class="lvl">Básico</span>Compruebe que \(5\times583.92\) días es casi \(8\) años de 365 días, y estime el desfase en horas.
<details><summary>Respuesta</summary><p>\(5\times583.92=2919.6\) d frente a \(8\times365=2920\) d: desfase de 0.4 d \(\approx 9.6\) h.</p></details></li>
<li><span class="lvl">Intermedio</span>Con \(N=223\) lunaciones, calcule el desfase respecto de 242 meses dracónicos y de 239 anomalísticos.
<details><summary>Respuesta</summary><p>\(223\times29.530589=6585.322\) d; \(242\times27.212221=6585.357\) d (desfase \(-0.035\) d); \(239\times27.554550=6585.537\) d (desfase \(-0.215\) d).</p></details></li>
<li><span class="lvl">Intermedio</span>Muestre que la segunda iteración del método babilónico desde \(x_0=3/2\) es \(577/408\) y que difiere de \(\sqrt2\) en menos de \(2\times10^{-6}\).
<details><summary>Respuesta</summary><p>\(x_1=\tfrac12(\tfrac32+\tfrac43)=\tfrac{17}{12}\); \(x_2=\tfrac12(\tfrac{17}{12}+\tfrac{24}{17})=\tfrac{577}{408}=1.4142157\). Error \(2.1\times10^{-6}\).</p></details></li>
<li><span class="lvl">Avanzado</span>Un historiador afirma que los babilonios «conocían el teorema de Pitágoras» porque Plimpton 322 lista ternas. Redacte, desde la epistemología, qué evidencia adicional haría falta para distinguirlo de «tenían un procedimiento para generar ternas».
<details><summary>Respuesta</summary><p>Sería necesario un texto que aplique la relación a otros triángulos no listados (YBC 7289 lo hace con el caso del cuadrado: la diagonal es \(\sqrt2\) veces el lado), o un problema en que se pida el lado desconocido de un triángulo rectángulo dado. Hay varios (tablilla BM 85196, problema de la viga apoyada). Siguen sin dar una demostración general.</p></details></li>
</ol>
