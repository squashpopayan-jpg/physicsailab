<p class="lead">En 1917, dos años después de terminar la relatividad general, Einstein aplicó sus ecuaciones al universo entero. El resultado le desagradó: sus ecuaciones decían que el cosmos tenía que expandirse o contraerse, y él, como todos los de su tiempo, estaba convencido de que era eterno y estático. Añadió un término, una «constante cosmológica» \(\Lambda\), para frenar la expansión y salvar el universo estático. Cinco años después, un matemático ruso de San Petersburgo, Alexander Friedmann, resolvió las ecuaciones sin el término: el universo se expande. Einstein escribió una nota diciendo que Friedmann se había equivocado. Después retiró la nota. Friedmann murió en 1925 de tifus, a los 37 años, sin saber cuánto iba a valer su artículo.</p>

<section>
<h2>De un universo estático a uno en expansión</h2>
<div class="box contexto"><h4>La cosmología deja de ser filosofía</h4><p>Hasta 1915 la cosmología era un género literario: el universo de Newton era infinito y estático (con el problema de la inestabilidad de Bentley y la paradoja de Olbers, 1823, que preguntaba por qué el cielo nocturno es oscuro si hay infinitas estrellas); el de Kant, una jerarquía de «universos isla». La relatividad general ofreció por primera vez ecuaciones para el conjunto, y el telescopio de 2.5 m de Mount Wilson (1917) y el de 5 m de Palomar (1948) ofrecieron los datos. La cosmología es la única de las ciencias históricas en que el objeto de estudio es único: un solo universo, sin réplica, que no se puede manipular. Eso condiciona su epistemología (Ellis, Kragh).</p></div>
<div class="people">
<div class="persona"><b>Alexander Friedmann</b><small>1888 – 1925 · San Petersburgo</small><p>Matemático y meteorólogo; durante la Primera Guerra Mundial voló en globo y bombardeó. Publicó sus soluciones en 1922 y 1924 en <em>Zeitschrift für Physik</em>.</p></div>
<div class="persona"><b>Georges Lemaître</b><small>1894 – 1966 · Lovaina</small><p>Sacerdote belga, físico y astrónomo; estudió con Eddington y Shapley. Dedujo la expansión de las ecuaciones (1927) y propuso la hipótesis del «átomo primitivo» (1931). Su artículo de 1927 se publicó en francés en una revista belga poco conocida.</p></div>
<div class="persona"><b>Henrietta Leavitt</b><small>1868 – 1921 · Harvard</small><p>Una de las «calculadoras» del Observatorio de Harvard, sorda y mal pagada. Descubrió la relación entre periodo y luminosidad de las cefeidas, la «vara de medir» del universo.</p></div>
<div class="persona"><b>Vesto Slipher</b><small>1875 – 1969 · Flagstaff</small><p>Midió en 1912-1925 los corrimientos al rojo de unas 40 nebulosas espirales, casi todos hacia el rojo (alejamiento). Sus datos fueron la base de Hubble.</p></div>
<div class="persona"><b>Edwin Hubble</b><small>1889 – 1953 · Mount Wilson</small><p>Abogado, boxeador y estudiante de Oxford, imponía una imagen de superioridad. Con el telescopio de 2.5 m resolvió cefeidas en Andrómeda (1923-1925) y demostró que es otra galaxia.</p></div>
<div class="persona"><b>Fritz Zwicky</b><small>1898 – 1974 · Caltech</small><p>Suizo, brillante y áspero. Predijo las estrellas de neutrones (con Baade), propuso las lentes gravitacionales y halló la «masa faltante».</p></div>
<div class="persona"><b>Vera Rubin</b><small>1928 – 2016 · Carnegie</small><p>Se le negó la admisión a Princeton por ser mujer (no admitía astrónomas hasta 1971). Con Ford midió curvas de rotación planas. Nunca recibió el Nobel.</p></div>
<div class="persona"><b>Penzias, Wilson, Dicke</b><small>1933–2024 · 1936– · 1916–1997</small><p>Dos radioastrónomos de Bell Labs y un físico de Princeton: la radiación de fondo se descubrió en el cruce de dos grupos que no sabían del otro.</p></div>
</div>

<section>
<h2>Cómo se supo que el universo se expande</h2>
<ol class="chain">
<li><b class="y">1912-1925 <span>· La regla de las cefeidas</span></b><p>Leavitt estudió las estrellas variables de las Nubes de Magallanes, todas a la misma distancia, y vio que cuanto más lentamente varían, más brillantes son. Con una calibración de distancias (Hertzsprung, Shapley) esa relación permite medir distancias. En 1923-1925 Hubble halló cefeidas en Andrómeda y la situó a 900 000 años luz (valor de la época; hoy 2.5 millones), mucho más allá de la Vía Láctea. Acabó el «Gran Debate» de 1920 entre Shapley y Curtis sobre si las nebulosas espirales eran galaxias.</p></li>
<li><b class="y">1922-1927 <span>· Friedmann y Lemaître</span></b><p>Friedmann resolvió las ecuaciones de Einstein para un universo homogéneo e isótropo y obtuvo universos que se expanden y se contraen, con o sin comienzo. Lemaître las redescubrió en 1927 sin conocer a Friedmann, y fue más lejos: comparó con los corrimientos al rojo de Slipher y las distancias de Hubble y dedujo \(v=H_0 d\) con \(H_0\approx625\) km/s/Mpc. Einstein le dijo: «Sus cálculos son correctos, su física es abominable».</p></li>
<li><b class="y">1929 <span>· Hubble</span></b><p>Hubble publicó con las distancias de 24 galaxias una relación lineal entre velocidad y distancia con pendiente 500 km/s/Mpc. Las distancias estaban sobrestimadas en un factor 7 (por la confusión de dos tipos de cefeidas, aclarada por Baade en 1952). Los datos eran escasos, y Hubble ni mencionó a Lemaître ni a Slipher. En 1931 Einstein visitó Mount Wilson, y aceptó la expansión: «el mayor error de mi vida», le habría dicho a Gamow.</p></li>
<li><b class="y">1931-1948 <span>· El átomo primitivo</span></b><p>Lemaître propuso que el universo comenzó a partir de un «átomo primitivo» que se desintegró. Gamow, Alpher y Herman (1948) añadieron que a esa temperatura tendría lugar la síntesis de elementos ligeros y quedaría un fondo de radiación de unos 5 K.</p></li>
</ol>
<div class="eq key" data-name="Ley de Hubble y ecuación de Friedmann">\[v=H_0\,d,\qquad \Big(\frac{\dot a}{a}\Big)^2=\frac{8\pi G}{3}\rho-\frac{kc^2}{a^2}+\frac\Lambda3 .\]</div>
<div class="sim" data-sim="hubble-1929" data-title="Los datos de Hubble de 1929"></div>
<div class="sim-guide"><ul>
<li>Fíjese en la dispersión: varias galaxias cercanas tienen velocidades negativas. Hubble ajustó la recta con ordenada (500 km/s/Mpc) y sin ella (465). La línea punteada es la ley con el valor actual: el eje vertical de los datos de 1929 está sobre ella, pero con las distancias de hoy todos los puntos se desplazarían siete veces a la derecha.</li>
<li>El tiempo de Hubble \(1/H_0\) con 500 km/s/Mpc es 2 mil millones de años: menos que la Tierra. Esto sostuvo la teoría del estado estacionario de Bondi, Gold y Hoyle (1948).</li>
</ul></div>
<div class="box rivalidad"><h4>Big Bang contra estado estacionario</h4><p>Entre 1948 y 1965, la cosmología se dividió. El estado estacionario (Bondi, Gold, Hoyle) suponía un universo eterno con creación continua de materia para mantener la densidad constante: evitaba el problema de la edad y el «comienzo». Hoyle, brillante y combativo, divulgó su teoría por radio, y en 1949 llamó «big bang» a la rival, en una emisión de la BBC. La rivalidad movió observaciones (los recuentos de radiofuentes de Ryle, 1955, favorables a la evolución) y teorías: Hoyle, Fowler y los Burbidge (1957) mostraron cómo los elementos pesados se forman en las estrellas, resolviendo la parte que Gamow no podía explicar (el carbono). Hoyle nunca aceptó el Big Bang. La disputa se cerró en 1965 con el descubrimiento del fondo de microondas, que el estado estacionario no podía explicar.</p></div>
<div class="box epist"><h4>¿Una ciencia con un solo ejemplar?</h4><p>La cosmología plantea problemas metodológicos propios. No hay réplica del universo, y los grandes números (por qué la densidad es casi crítica, por qué el fondo es tan uniforme) se explican con hipótesis, como la inflación (Guth, 1981), que no son todavía bien contrastables. Popper dudaba de la cosmología como ciencia falsable; la existencia de predicciones arriesgadas (el fondo, su espectro de cuerpo negro, las anisotropías, la abundancia de helio) la salvaron. Los cosmólogos distinguen entre <em>observaciones</em> (lo que se ve) y <em>inferencias</em> (lo que se dice del universo entero), y debaten si una teoría que predice un «multiverso» inobservable es ciencia (Ellis, Silk). Es un caso vivo de la demarcación entre ciencia y metafísica.</p></div>
</section>

<section>
<h2>El fondo, la materia oscura y la aceleración</h2>
<ol class="chain">
<li><b class="y">1965 <span>· Dos radioastrónomos y una antena</span></b><p>Penzias y Wilson, en Holmdel (Nueva Jersey), calibraban una antena de 6 metros diseñada para los satélites Echo y Telstar. Les sobraba un ruido de 3.5 K que no desaparecía con la dirección ni con la hora. Limpiaron la antena de excrementos de palomas («material dieléctrico blanco») y mataron las palomas. El ruido seguía. Dicke, a unos 60 km, tenía a Roll y Wilkinson construyendo un detector para buscar justo esa radiación predicha por su modelo de universo oscilante. Cuando Penzias llamó a Dicke, éste dijo a su grupo: «Nos han ganado». Publicaron dos cartas consecutivas en <em>Astrophysical Journal</em>: la medida y su interpretación. Nobel 1978 a Penzias y Wilson.</p></li>
<li><b class="y">1933-1980 <span>· La materia oscura</span></b><p>Zwicky aplicó el teorema del virial al cúmulo de Coma y halló que las galaxias se mueven demasiado deprisa: debía haber 400 veces más masa que la visible. Se le prestó poca atención. En 1970, Rubin y Ford vieron que la curva de rotación de Andrómeda es plana hasta 24 kpc; con el espectrógrafo CCD de Rubin (1978-1985) se hizo con más de 60 galaxias. La conclusión: cada galaxia está rodeada de un halo de materia que no se ve y que aporta 5 veces más masa que la ordinaria. Su naturaleza sigue desconocida.</p></li>
<li><b class="y">1992 <span>· COBE</span></b><p>El satélite COBE midió el espectro del fondo: un cuerpo negro perfecto a 2.725 K, con una precisión de 50 partes por millón, y anisotropías de 10⁻⁵ (Smoot y Mather, Nobel 2006). La curva se publicó en enero de 1990 ante 1500 astrofísicos que la aplaudieron en pie.</p></li>
<li><b class="y">1998 <span>· La expansión se acelera</span></b><p>Dos equipos competidores, el Supernova Cosmology Project (Perlmutter) y el High-z Supernova Search Team (Schmidt y Riess), midieron supernovas tipo Ia lejanas y las encontraron más débiles de lo esperado: la expansión se acelera, impulsada por una «energía oscura» (la constante de Einstein, reencarnada). Nobel 2011. Ese mismo año se supo que el 70 % del contenido del universo es de naturaleza desconocida.</p></li>
</ol>
<div class="sim" data-sim="curvas-rotacion" data-title="Las curvas de rotación de las galaxias y la materia oscura"></div>
<div class="sim-guide"><ul>
<li>Con la velocidad del halo en 0 se obtiene la curva «visible» (kepleriana): cae al alejarse. Con un halo de 200 km/s la curva queda plana: es lo que se mide. La masa dentro de 30 kpc es varias veces la visible.</li>
</ul></div>
<div class="sim" data-sim="supernovas-ia" data-title="Supernovas Ia: el universo se acelera"></div>
<div class="sim-guide"><ul>
<li>Con \(\Omega_m=1\) (Einstein–de Sitter) las supernovas lejanas serían más brillantes que en el universo vacío; con \(\Omega_m=0.3\) y \(\Omega_\Lambda=0.7\) son más débiles, como se midió. La edad también cambia: 9.3 Gyr en EdS con \(H_0=70\) (menor que la de las estrellas más viejas), 13.5 Gyr con Λ.</li>
</ul></div>
<div class="box leyenda"><h4>«El mayor error de mi vida»</h4><p>La cita atribuida a Einstein viene de Gamow (<em>My World Line</em>, 1970): «Einstein me dijo que la introducción del término cosmológico fue el mayor error de su vida». No hay otro testimonio directo, y en sus cartas y artículos posteriores Einstein trató a Λ con indiferencia, no con arrepentimiento. Es un dicho que gusta porque la constante cosmológica volvió con la aceleración de 1998: el «error» de Einstein parece haber acertado. En rigor, la energía oscura puede ser algo distinto de la constante, y la razón de su valor (120 órdenes de magnitud menor que la estimación de la teoría cuántica de campos) es uno de los grandes problemas abiertos.</p></div>
</section>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Con \(H_0=500\) km/s/Mpc, ¿qué edad da \(1/H_0\)? ¿Y con 70?
<details><summary>Respuesta</summary><p>\(1/H_0=9.78/H_0\) en Gyr (con \(H_0\) en 100 km/s/Mpc): 1.96 Gyr y 13.97 Gyr.</p></details></li>
<li><span class="lvl">Básico</span>Una galaxia se aleja a 7000 km/s. ¿A qué distancia está (\(H_0=70\))?
<details><summary>Respuesta</summary><p>\(d=v/H_0=100\) Mpc \(=326\) millones de años luz.</p></details></li>
<li><span class="lvl">Intermedio</span>Con \(T=2.7255\) K calcule la densidad de fotones del fondo y el máximo de frecuencia.
<details><summary>Respuesta</summary><p>\(n=2\zeta(3)/\pi^2\,(k_BT/\hbar c)^3=411\) cm⁻³; \(\nu_{\max}=2.82\,k_BT/h=160\) GHz.</p></details></li>
<li><span class="lvl">Intermedio</span>Una galaxia tiene una curva de rotación plana de 200 km/s. Estime la masa dentro de 30 kpc.
<details><summary>Respuesta</summary><p>\(M=v^2r/G=(2\times10^5)^2\times9.26\times10^{20}/6.67\times10^{-11}=5.5\times10^{41}\) kg \(=2.8\times10^{11}\,M_\odot\).</p></details></li>
<li><span class="lvl">Avanzado</span>Muestre que en un universo de Einstein–de Sitter (\(\Omega_m=1\)) la edad es \(t_0=2/(3H_0)\).
<details><summary>Respuesta</summary><p>\(H^2=H_0^2a^{-3}\) → \(\dot a=H_0a^{-1/2}\) → \(a^{1/2}da=H_0dt\) → \(t=\tfrac2{3H_0}\): 9.3 Gyr con \(H_0=70\).</p></details></li>
<li><span class="lvl">Avanzado</span>¿Qué distingue la «crisis de la edad» de 1929-1952 de una anomalía refutadora? ¿Cómo se resolvió y qué papel jugaron los instrumentos?
<details><summary>Respuesta</summary><p>La contradicción (universo más joven que la Tierra) no refutó la relatividad ni el Big Bang: se resolvió reexaminando una hipótesis auxiliar, la calibración de distancias. Baade (1952), con el telescopio de Palomar, vio que había dos poblaciones de cefeidas, y las distancias se duplicaron. Ilustra la tesis de Duhem–Quine: los datos nunca prueban una teoría aislada, sino una teoría más sus auxiliares.</p></details></li>
</ol>
