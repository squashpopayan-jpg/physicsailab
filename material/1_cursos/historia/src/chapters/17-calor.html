<p class="lead">En 1798, un conde bávaro nacido en Massachusetts, que había sido espía británico, ministro de guerra y reformador de la sopa de los pobres de Múnich, observó mientras se perforaban cañones en el arsenal que el metal, el agua y las virutas se calentaban sin cesar, y que el calor no parecía agotarse nunca: dos caballos que giraban el taladro podían hervir 26 libras de agua en dos horas y media. Si el calor fuera un fluido contenido en el metal, tendría que agotarse. Benjamin Thompson, conde Rumford, concluyó que el calor es movimiento. Fue el primer golpe a una teoría que había parecido sólida durante todo un siglo.</p>

<section>
<h2>Máquinas antes que teoría</h2>
<div class="box contexto"><h4>El carbón y el vapor</h4><p>La minería británica del siglo XVIII necesitaba bombear agua de pozos cada vez más hondos. Thomas Newcomen construyó en 1712 la primera máquina de vapor eficaz con un émbolo (con un consumo de carbón enorme: rendimiento inferior al 1 %). James Watt, constructor de instrumentos de la Universidad de Glasgow, reparó en 1763 un modelo de Newcomen y notó que se gastaba más vapor en recalentar el cilindro; propuso en 1765 un condensador separado, patentado en 1769. Con el empresario Matthew Boulton (Soho Manufactory, Birmingham, 1775) fabricó máquinas que consumían una cuarta parte del carbón y que, vendidas por el ahorro de combustible, hicieron fortuna. Boulton y Watt eran miembros de la Lunar Society, un club de industriales y científicos (Priestley, Wedgwood, Erasmus Darwin) que se reunía en las noches de luna llena. Fue la máquina de vapor quien impulsó la teoría, y no al revés: la termodinámica nació para entender las máquinas.</p></div>
<div class="people">
<div class="persona"><b>James Watt</b><small>1736 – 1819 · Glasgow, Birmingham</small><p>Constructor de instrumentos, ingeniero; definió el caballo de vapor (550 libras-pie por segundo) y el indicador de presión que mide el trabajo de un ciclo.</p></div>
<div class="persona"><b>Joseph Black</b><small>1728 – 1799 · Glasgow, Edimburgo</small><p>Químico y médico. Distinguió calor y temperatura; midió calores específicos y el calor latente (1761); aisló el dióxido de carbono («aire fijo»).</p></div>
<div class="persona"><b>Antoine Lavoisier</b><small>1743 – 1794 · París</small><p>Fundador de la química moderna. En su <em>Traité élémentaire de chimie</em> (1789) incluyó el <em>calórico</em> entre los elementos. Recaudador de impuestos (la Ferme générale), fue guillotinado en 1794.</p></div>
<div class="persona"><b>Benjamin Thompson, conde Rumford</b><small>1753 – 1814 · Woburn, Múnich, Londres, París</small><p>Aventurero y reformador. Fundó la Royal Institution (1799). Se casó con la viuda de Lavoisier, y se separaron al poco tiempo.</p></div>
<div class="persona"><b>Sadi Carnot</b><small>1796 – 1832 · París</small><p>Ingeniero militar, hijo del «organizador de la victoria» Lazare Carnot. Escribió un único libro, a los 28 años, y murió de cólera. Sus papeles fueron quemados por precaución sanitaria.</p></div>
<div class="persona"><b>Julius Robert Mayer</b><small>1814 – 1878 · Heilbronn</small><p>Médico de Heilbronn. Navegó a Java en 1840 como médico de a bordo. Fue el primero en enunciar y calcular la equivalencia entre calor y trabajo (1842) y sufrió largo tiempo una enfermedad nerviosa.</p></div>
<div class="persona"><b>James Prescott Joule</b><small>1818 – 1889 · Salford</small><p>Hijo de un cervecero de Manchester; científico aficionado y empresario cervecero. Educado en casa por John Dalton. Su dedicación a la medición precisa convirtió la equivalencia en ciencia.</p></div>
<div class="persona"><b>Hermann von Helmholtz</b><small>1821 – 1894 · Königsberg, Heidelberg, Berlín</small><p>Médico militar y fisiólogo, físico y filósofo. En 1847 formuló la conservación de la energía como principio general.</p></div>
<div class="persona"><b>William Thomson, lord Kelvin</b><small>1824 – 1907 · Glasgow</small><p>Niño prodigio: profesor a los 22 años. Dio escala absoluta de temperatura (1848), el segundo principio (1851) y dirigió el cable transatlántico (1858-1866).</p></div>
<div class="persona"><b>Rudolf Clausius</b><small>1822 – 1888 · Berlín, Zúrich, Bonn</small><p>Físico alemán. Reformuló la teoría de Carnot (1850) y definió la entropía (1865).</p></div>
</div>

<section>
<h2>El calor como sustancia</h2>
<p>Hasta 1800 la teoría dominante consideraba el calor una sustancia sutil, imponderable e indestructible: el <span class="term">calórico</span>. Explicaba los fenómenos con éxito: la dilatación (el calórico separa las partículas), el calor latente (al fundirse el hielo, el calórico se «combina» con el agua), el calentamiento por compresión, la conducción (un fluido que fluye de caliente a frío). Joseph Black midió con precisión que una masa de hielo a 0 °C absorbe, para fundirse, tanto calor como el que llevaría el mismo peso de agua de 0 a unos 80 °C, y que distintas sustancias necesitan cantidades distintas de calor para subir 1 °C (<em>calor específico</em>). Laplace calculó en 1816 la velocidad del sonido con una corrección adiabática basada en el calórico y obtuvo, por primera vez, el valor correcto (Newton había obtenido un 15 % menos).</p>
<div class="box epist"><h4>Una teoría rival que funcionaba</h4><p>El calórico no era absurdo: dio explicaciones cuantitativas durante cien años. Hasok Chang (<em>Is Water H₂O?</em>, 2012) insiste en que «abandonar» una teoría exitosa no fue obvio ni inmediato: los experimentos de Rumford se podían explicar suponiendo que el calor latente se liberaba al reducirse el metal a virutas (Davy y Rumford sostuvieron lo contrario con experimentos). La idea de que una teoría se abandona por un experimento negativo es demasiado simple. Un cambio de teoría exige además una alternativa con éxitos propios (la termodinámica) y una comunidad dispuesta.</p></div>
<div class="box epist"><h4>Medir la temperatura: un problema anterior</h4><p>Para hablar de calor había que tener termómetros. Fahrenheit (1714) usó mercurio, con una escala que fijaba 0 °F en una mezcla de hielo y sal y 96 °F en la temperatura del cuerpo; Celsius (1742) fijó 0 y 100 en los puntos de congelación y ebullición del agua, en sentido inverso (el actual lo invirtió Linneo o Stromer). Pero ¿cómo saber que un termómetro de mercurio mide «igual» que uno de alcohol? Chang (<em>Inventing Temperature</em>, 2004) estudia esa circularidad: se necesita una teoría de la temperatura para validar los termómetros, y termómetros para validar la teoría. Se resolvió gradualmente, con comparaciones y con la escala absoluta de Kelvin (1848).</p></div>
</section>

<section>
<h2>Rumford y el calor como movimiento</h2>
<ol class="chain">
<li><b class="y">1798 <span>· el arsenal de Múnich</span></b><p>Mientras supervisaba la perforación de cañones, midió la temperatura del agua que rodeaba el taladro: 26.5 libras de agua hirvieron en 2.5 horas. Con un taladro sin filo (sin virutas) el calor seguía apareciendo. Concluyó que el calor producido «parece inagotable»: «es difícil concebir nada que se pueda suministrar de esta forma sin límite que sea una sustancia material».</p></li>
<li><b class="y">1799 <span>· Davy</span></b><p>Humphry Davy afirmó haber fundido hielo frotando dos bloques en el vacío (resultado dudoso en el montaje), y se lo contó a la Royal Institution.</p></li>
<li><b class="y">1798 <span>· la cifra</span></b><p>Rumford estimó que cada caloría (el calor necesario para elevar 1 gramo de agua un grado) equivalía a unos 5.6 J de trabajo. Fue la primera estimación cuantitativa del «equivalente mecánico del calor»; el valor aceptado hoy es 4.184.</p></li>
</ol>
<div class="box leyenda"><h4>Un conde con cuatro vidas</h4><p>Benjamin Thompson, de Massachusetts, fue partidario de la Corona durante la guerra de Independencia (espió para los británicos), emigró, sirvió al elector de Baviera, que lo nombró conde del Sacro Imperio con el título de «Rumford» (el nombre de su pueblo de adopción en New Hampshire), organizó los talleres militares, creó el Jardín Inglés de Múnich y puso en marcha comedores para los pobres con una sopa de bajo costo («sopa de Rumford»). Inventó la chimenea moderna con tiro y la cafetera de filtro. En 1805, ya en París, se casó con Marie-Anne Paulze, viuda de Lavoisier, y la separación llegó a los cuatro años: él decía que, en matrimonio, solo un calor poco benéfico se mantenía. Las biografías ponen de relieve su vanidad y su inteligencia práctica.</p></div>
</section>

<section>
<h2>Carnot: la teoría de la máquina</h2>
<div class="box contexto"><h4>Francia mira a Inglaterra</h4><p>Tras Waterloo (1815), Francia observaba con inquietud la superioridad industrial inglesa, basada en la máquina de vapor. Sadi Carnot, que tenía formación de ingeniero (École polytechnique), escribió en 1824 <em>Réflexions sur la puissance motrice du feu et sur les machines propres à développer cette puissance</em>, 118 páginas dedicadas a averiguar si existe un límite al rendimiento. Se vendieron pocos ejemplares y lo ignoró la Académie. Carnot murió de cólera en 1832, y por las normas sanitarias sus papeles fueron quemados con casi todo lo que le pertenecía. Se salvó un cuaderno, publicado por su hermano en 1878.</p></div>
<ol class="chain">
<li><b class="y">La analogía</b><p>Una caída de agua produce trabajo porque el agua pasa de un nivel alto a uno bajo; una máquina de vapor produce trabajo porque el calor pasa de un foco caliente a uno frío. Lo importante es la <em>diferencia</em> de temperatura, no el calor en sí.</p></li>
<li><b class="y">La imposibilidad del movimiento perpetuo</b><p>Si una máquina reversible fuese menos eficiente que otra, se podría acoplar una a la otra y obtener trabajo sin gasto: <em>perpetuum mobile</em>. Es imposible (la Académie des sciences rechazaba desde 1775 proyectos de movimiento perpetuo). Luego todas las máquinas reversibles entre las mismas temperaturas tienen el mismo rendimiento.</p></li>
<li><b class="y">El ciclo</b><p>Dibujó (con las gráficas de Clapeyron, 1834) un ciclo ideal de cuatro etapas, dos isotermas y dos adiabáticas, y mostró que su rendimiento depende solo de las dos temperaturas.</p></li>
</ol>
<div class="eq key" data-name="Rendimiento de Carnot (como lo escribió Kelvin)">\[\eta_{max}=1-\frac{T_f}{T_c}.\]</div>
<div class="sim" data-sim="ciclo-carnot" data-title="El ciclo de Carnot: el límite del rendimiento"></div>
<div class="sim-guide"><ul>
<li>Con 150 °C en la caldera y 40 °C en el condensador (el caso de las máquinas de 1824) el límite es 26 %; las máquinas reales rendían menos del 5 %. Carnot mostró que había margen de mejora, y que la mejora venía de usar vapor a más alta temperatura, no de cambiar de fluido.</li>
<li>El área encerrada por el ciclo es el trabajo útil; coincide con \(Q_c-Q_f\) hasta la precisión numérica. El rendimiento no depende de la razón de expansión isoterma (cambie el control).</li>
</ul></div>
</section>

<section>
<h2>La conservación de la energía: un descubrimiento coral</h2>
<p>Entre 1837 y 1854 al menos una docena de personas, en países y con profesiones distintas, enunciaron el principio de conservación de la energía. Thomas Kuhn, en su ensayo de 1959, los agrupó y se preguntó por qué.</p>
<ol class="chain">
<li><b class="y">1840-1842 <span>· Mayer</span></b><p>Médico a bordo de un barco holandés en Java, notó que la sangre venosa de los marineros en el trópico era roja y brillante: el cuerpo gastaba menos «combustible» para mantener su temperatura. Pensó que calor y movimiento son equivalentes y que «de nada, nada sale; nada se pierde». En 1842 publicó (en <em>Annalen der Chemie</em>) un cálculo basado en el calor de expansión del aire: \(J=R/(c_p-c_v)\) con 365 kgf·m/kcal (3.58 J/cal).</p></li>
<li><b class="y">1843-1850 <span>· Joule</span></b><p>Midió la equivalencia con corriente eléctrica, con compresión de gases y con agitación del agua con paletas: 4.15 J/cal. En 1847, ante la Asociación Británica en Oxford, presentó el resultado: casi nadie escuchó, excepto William Thomson.</p></li>
<li><b class="y">1847 <span>· Helmholtz</span></b><p>Memoria <em>Über die Erhaltung der Kraft</em> (sobre la conservación de la fuerza), con una demostración general desde las leyes de la mecánica con fuerzas centrales y con aplicaciones a la química, la electricidad y la fisiología. La revista <em>Annalen der Physik</em> la rechazó; la presentó ante la Sociedad de Física de Berlín y la publicó por su cuenta.</p></li>
<li><b class="y">1850-1851 <span>· Clausius y Kelvin</span></b><p>Reconciliaron la teoría de Carnot con la conservación de la energía: sigue siendo cierto que el calor «cae» de un foco caliente a uno frío, pero parte se convierte en trabajo. Del enlace salió la segunda ley (capítulo 18).</p></li>
</ol>
<div class="eq key" data-name="Primera ley de la termodinámica">\[\Delta U=Q-W,\qquad 1\ \text{cal}=4.184\ \text{J}.\]</div>
<div class="sim" data-sim="joule-paletas" data-title="El experimento de las paletas de Joule"></div>
<div class="sim-guide"><ul>
<li>Con los pesos de 27 kg cayendo 10.9 m veinte veces, el agua (30 kg) se calienta solo 0.3 K: Joule necesitaba termómetros de resolución de milésimas de grado. Reduzca la masa de agua: la medida se facilita, pero crecen las pérdidas.</li>
<li>Con rendimiento 95 %, el «J» deducido sale 5 % más alto: un sesgo sistemático. Su verdadera hazaña fue conocer y corregir las pérdidas.</li>
</ul></div>
<div class="sim" data-sim="mayer" data-title="El cálculo de Mayer con el calor específico del aire"></div>
<div class="sim-guide"><ul>
<li>Con los datos de 1842 (\(c_p=0.267\), \(\gamma=1.421\)) resultan 3.6 J/cal; con los datos modernos (\(c_p=0.2395\), \(\gamma=1.40\)), 4.20. La idea de Mayer era perfecta; sus constantes, no.</li>
</ul></div>
<div class="box rivalidad"><h4>Prioridad: Mayer, Joule y Helmholtz</h4><p>Mayer sostuvo que había descubierto el principio antes que Joule; Joule publicó mediciones más exactas. En 1862 John Tyndall, en la Royal Institution, presentó a Mayer como el descubridor; Joule y Thomson defendieron a Joule; las cartas fueron agrias y hasta un testigo (Tait) acusó a Tyndall de nacionalismo. Mayer, que había sufrido una crisis en 1850 (intentó suicidarse saltando por una ventana y estuvo internado), recibió reconocimientos tardíos: la medalla Copley a Joule (1866); a Mayer, la nobleza personal de Württemberg (1867) y un premio de la Académie des sciences (1870). La prioridad a veces es una cuestión de a quién se le da el crédito de lo medido (Joule) frente a lo concebido (Mayer).</p></div>
<div class="box epist"><h4>¿Por qué todos a la vez? (Kuhn, 1959)</h4><p>Kuhn propuso tres factores que se combinaban: (1) la <em>disponibilidad de procesos de conversión</em>: la pila de Volta, el electroimán, la termoelectricidad, la máquina de vapor, la fotosíntesis mostraban que una forma de «fuerza» se transforma en otra; (2) el interés de los ingenieros en la <em>economía de las máquinas</em>; (3) la influencia de la <em>Naturphilosophie</em> romántica alemana (Schelling, Oersted, Mayer y Helmholtz la conocían), según la cual todas las fuerzas son manifestaciones de una única. Ninguno fue un descubrimiento sin preparación: el terreno estaba maduro. Pero cada uno tuvo su estilo: Mayer, filosófico; Joule, experimental; Helmholtz, matemático. «Descubrimiento» es una palabra demasiado simple.</p></div>
<div class="box leyenda"><h4>La luna de miel de Joule y la cascada</h4><p>Se cuenta que Joule, al casarse en agosto de 1847 y viajar a Suiza, llevaba un termómetro de gran sensibilidad para medir la diferencia de temperatura entre lo alto y el pie de una cascada: el agua debería calentarse 0.2 °F por una caída de 270 pies. En Chamonix se encontró por casualidad con William Thomson, que se interesó por sus medidas y empezó con él una colaboración de años. Joule no pudo hacer allí una medida precisa, por las salpicaduras y el viento: lo que se cuenta es una escena de la memoria posterior de ambos.</p></div>
</section>

<section>
<h2>La palabra «energía»</h2>
<p>Los autores de 1840 hablaban de «fuerza» (<em>Kraft</em>) para lo que hoy llamamos energía. El término <em>energy</em> lo había usado Thomas Young en 1807 (para la <em>vis viva</em>) y W. J. M. Rankine (1853) y Thomson (1851-1855) lo establecieron con su sentido actual, con las especies «cinética» y «potencial». Es un proceso típico: una cantidad conservada que cuesta ver porque cambia de forma, y que para descubrirla hace falta un nombre. En 1847 Helmholtz escribía <em>Erhaltung der Kraft</em>; hoy lo traduciríamos como conservación de la energía.</p>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Con 2 pesos de 13.6 kg cada uno que caen 10.9 m, 20 veces, sobre 30 kg de agua, ¿cuánto sube la temperatura?
<details><summary>Respuesta</summary><p>\(E=27.2\times9.81\times10.9\times20=58.2\) kJ; \(\Delta T=E/(Mc)=58\,200/(30\times4186)=0.46\) K.</p></details></li>
<li><span class="lvl">Básico</span>Una máquina opera entre 150 °C y 40 °C. ¿Cuál es el rendimiento máximo? Si absorbe 1 MJ por ciclo, ¿qué trabajo máximo produce?
<details><summary>Respuesta</summary><p>\(\eta=1-313/423=26\%\). \(W=0.26\) MJ.</p></details></li>
<li><span class="lvl">Intermedio</span>Con \(c_p=0.2395\) cal/(g·K), \(\gamma=1.40\) y \(R=0.287\) J/(g·K) para el aire, calcule J.
<details><summary>Respuesta</summary><p>\(c_p-c_v=c_p(1-1/\gamma)=0.0684\) cal/(g·K). \(J=0.287/0.0684=4.195\) J/cal.</p></details></li>
<li><span class="lvl">Intermedio</span>Rumford hirvió 26.5 libras de agua (de 15 °C) en 2.5 horas con el trabajo de un caballo (≈ 745 W). ¿Qué J obtiene?
<details><summary>Respuesta</summary><p>26.5 lb = 12.0 kg; calor = \(12\times85\times1000=1.02\times10^6\) cal; trabajo = \(745\times9000=6.7\times10^6\) J; J ≈ 6.6 J/cal si todo el trabajo del caballo se hubiera convertido en calor del agua; Rumford, con su estimación de la potencia efectiva, dio 5.6. Las pérdidas al aire hacen que el valor verdadero (4.18) sea menor.</p></details></li>
<li><span class="lvl">Avanzado</span>Kuhn explica el descubrimiento simultáneo por condiciones de época. Un crítico (Elkana) responde que eso ignora diferencias esenciales entre los autores. ¿Qué evidencia respaldaría cada lectura?
<details><summary>Respuesta</summary><p>A favor de Kuhn: los resultados coinciden en el principio con tres procedencias distintas y el mismo año; se citan ejemplos comunes (pila, máquina). A favor de Elkana: Mayer se interesó por la sangre, Helmholtz por las fuerzas centrales, Joule por la medición: cada formulación implica concepciones distintas de «fuerza» y de «conservación», que luego tuvieron que reconciliarse; la identidad del principio se reconoce a posteriori.</p></details></li>
</ol>
