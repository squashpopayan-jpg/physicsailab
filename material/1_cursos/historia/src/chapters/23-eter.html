<p class="lead">Si la luz es una onda (capítulo 22), ¿qué es lo que ondula? Todas las ondas conocidas eran ondas <em>de algo</em>: de agua, de aire, de una cuerda. Fresnel había mostrado que la luz es transversal, y una onda transversal exige un medio con rigidez, como un sólido. Así que el espacio entero, las estrellas, los planetas y nosotros mismos debíamos estar sumergidos en un sólido más tenue que el aire y más rígido que el acero, que no frena a los planetas. Durante todo el siglo XIX fue el único camino aceptable. En 1887, en un sótano de Cleveland, dos hombres intentaron medir la velocidad de la Tierra a través de ese medio, y no la encontraron.</p>

<div class="vitals">
<div><b>Época</b>1818 – 1930</div>
<div><b>Lugares</b>Potsdam, Cleveland, Leiden, Dublín</div>
<div><b>Idea</b>el éter como medio de las ondas luminosas</div>
<div><b>Resultado</b>sin viento de éter detectable</div>
</div>

<section>
<h2>El éter, un medio que todos necesitaban</h2>
<div class="box contexto"><h4>Un sólido invisible</h4><p>El éter del siglo XIX tuvo muchas versiones. Para Fresnel era un fluido elástico, extremadamente rígido para vibraciones transversales de alta frecuencia y casi sin masa; para Stokes era una sustancia como la cera de zapatero, que fluye lentamente bajo esfuerzos prolongados (los planetas no se frenan) pero vibra como un sólido bajo vibraciones rápidas; para Maxwell, el medio del campo electromagnético, con vórtices (capítulo 21); para Kelvin, un sólido con las propiedades de la gelatina. La necesidad del éter no era una ocurrencia sino una consecuencia de todos los modelos mecánicos de la luz. Lo que cambiaba entre unos y otros era si la Tierra lo arrastraba o se movía a través de él.</p></div>
<div class="people">
<div class="persona"><b>Albert Abraham Michelson</b><small>1852 – 1931 · Strelno, Annapolis, Chicago</small><p>Nacido en la Polonia prusiana, emigró a los 2 años a California. Oficial de la Marina de EE. UU. y profesor de física. Obsesionado con medir la velocidad de la luz y obtener, con instrumentos de precisión, la última cifra decimal. Nobel de Física 1907, el primer estadounidense. Padecía crisis nerviosas.</p></div>
<div class="persona"><b>Edward Williams Morley</b><small>1838 – 1923 · Cleveland</small><p>Químico de la Case School; hijo de un pastor congregacionalista. Famoso por su medida del peso atómico del oxígeno. Aportó la precisión mecánica del montaje.</p></div>
<div class="persona"><b>George Francis FitzGerald</b><small>1851 – 1901 · Dublín</small><p>Físico irlandés; lector de Maxwell y su divulgador en Inglaterra. Propuso en 1889 una contracción de los cuerpos.</p></div>
<div class="persona"><b>Hendrik Antoon Lorentz</b><small>1853 – 1928 · Leiden</small><p>El físico más respetado del cambio de siglo; teoría de electrones, contracción, tiempo local, transformaciones. Nobel 1902.</p></div>
<div class="persona"><b>George Gabriel Stokes</b><small>1819 – 1903 · Cambridge</small><p>Catedrático lucasiano. Propuso que el éter es arrastrado por la Tierra y trató de conciliarlo con la aberración.</p></div>
<div class="persona"><b>Dayton C. Miller</b><small>1866 – 1941 · Cleveland, Mount Wilson</small><p>Colega de Morley en Case. Repitió el experimento durante veinte años y anunció (1925) una señal pequeña a 1800 m de altura; el resultado se atribuyó después a efectos térmicos.</p></div>
</div>
</section>

<section>
<h2>¿La Tierra arrastra el éter?</h2>
<ol class="chain">
<li><b class="y">1728-1818 <span>· La aberración y el arrastre parcial</span></b><p>Bradley (capítulo 15) explicó la aberración de las estrellas con la composición de la velocidad de la Tierra y la de la luz: la luz no es arrastrada por la Tierra. Si el telescopio se llena de agua, la aberración no debería cambiar (Airy lo comprobó en 1871 y no cambió) a menos que el éter dentro del agua sea arrastrado en parte. Fresnel (1818) propuso que un medio de índice \(n\) arrastra una fracción \(k=1-1/n^2\) del éter que contiene: suficiente para que la aberración no cambiara.</p></li>
<li><b class="y">1851 <span>· Fizeau y el agua</span></b><p>Fizeau, con un interferómetro de dos tubos y agua a 7 m/s, midió el desplazamiento de las franjas. Se obtuvo un arrastre parcial, de acuerdo con Fresnel. Michelson y Morley (1886) lo repitieron con mayor precisión: 0.434 ± 0.02. Un éter totalmente arrastrado (Stokes) quedaba descartado.</p></li>
<li><b class="y">1881 <span>· Potsdam</span></b><p>Michelson, con financiación de Alexander Graham Bell, construyó su interferómetro en el laboratorio de Helmholtz en Berlín y lo trasladó a Potsdam para evitar las vibraciones de las calles. El desplazamiento esperado era de 0.04 de franja; no lo observó. Lorentz señaló un error en el cálculo del brazo perpendicular (el efecto era la mitad de lo previsto) y el resultado quedó en entredicho.</p></li>
<li><b class="y">1887 <span>· Cleveland</span></b><p>Michelson y Morley repitieron la medida con un interferómetro sobre una losa de arenisca de 1.5 m de lado, flotando en mercurio, con espejos que multiplicaban por 8 el camino hasta unos 11 m. Observaron durante seis horas en julio, al mediodía y a la tarde. El desplazamiento esperado era 0.4; el observado, menos de 0.01.</p></li>
</ol>
<div class="eq key" data-name="El efecto esperado en 1887">\[\Delta N=\frac{2L}{\lambda}\,\frac{v^2}{c^2}\approx\frac{2\cdot11}{5.5\times10^{-7}}\cdot10^{-8}=0.4 .\]</div>

<li>Con 30 km/s y 11 m, la curva alcanza 0.2 de franja de amplitud (0.4 de ida y vuelta); el límite de detección es 0.01 (línea). La observación de Michelson y Morley es la curva plana dentro de las líneas.</li>
<li>Active la contracción de FitzGerald–Lorentz: el efecto desaparece por completo. Todos los resultados nulos son compatibles con ella.</li>
</ul></div>

<li>La curva de Fresnel está entre los dos extremos (éter inmóvil y éter arrastrado). El punto del agua (0.434) está sobre ella. La relatividad especial reproducirá esta fórmula sin recurrir al éter, con la composición de velocidades de Einstein (capítulo 26).</li>
</ul></div>
<div class="box epist"><h4>Un resultado negativo no es un resultado nulo</h4><p>Michelson y Morley no mostraron que el éter no existe, sino que la Tierra no se movía respecto de él a más de ≈ 5 km/s. Había tres salidas: (1) el éter es arrastrado por la Tierra (Stokes), contradicho por la aberración y por Fizeau; (2) los cuerpos se contraen (FitzGerald, Lorentz) y compensan el efecto; (3) la velocidad de la luz es independiente del movimiento del observador (que sería la salida de Einstein). Un experimento solo prueba un conjunto de hipótesis (Duhem, Quine); lo que hizo el de Michelson fue obligar a escoger entre varias salidas, cada una con un precio.</p></div>
</section>

<section>
<h2>Salvar el éter</h2>
<ol class="chain">
<li><b class="y">1889 <span>· FitzGerald</span></b><p>FitzGerald, en una carta a la revista <em>Science</em> (1889), propuso que la fuerza entre moléculas, que es de origen electromagnético, cambia con el movimiento: los cuerpos se acortan en la dirección del movimiento en el factor \(\sqrt{1-v^2/c^2}\), lo bastante para compensar el desfase. Lo publicó de forma casi casual, y apenas es citado.</p></li>
<li><b class="y">1892-1895 <span>· Lorentz</span></b><p>Lorentz propuso la misma contracción por su cuenta, derivándola de la teoría de electrones, e introdujo el «tiempo local» como variable auxiliar. Con ellos explicó todos los resultados nulos de segundo orden. Poincaré (1900-1904) señaló que se acumulaban las hipótesis ad hoc y que había que adoptar un «principio de relatividad» como postulado.</p></li>
<li><b class="y">1904 <span>· Las transformaciones</span></b><p>Lorentz publicó las transformaciones completas (espacio y tiempo) que dejan invariantes las ecuaciones de Maxwell, aún con un éter inmóvil en el fondo. Dos años después, Einstein mostró que el éter era innecesario (capítulo 26).</p></li>
<li><b class="y">1920s <span>· Miller</span></b><p>Dayton Miller repitió la medida durante dos décadas, en Cleveland y en Mount Wilson, y en 1925 anunció una señal de unos 10 km/s. Era la mayor campaña experimental contra la relatividad; los análisis de Shankland (1955) mostraron que se debía a gradientes térmicos. Michelson, Morley y Pease repitieron en 1929 sin señal.</p></li>
</ol>
<div class="box leyenda"><h4>«Michelson y Morley refutaron el éter y Einstein nació del resultado»</h4><p>El relato ordenado dice: éter → experimento negativo → crisis → relatividad. La realidad es más desordenada: el experimento fue interpretado de formas distintas durante veinte años; la mayoría de los físicos de 1900 pensaba que la teoría de Lorentz bastaba. Einstein dijo en varios momentos que conocía el resultado, pero sin que fuera decisivo: le preocupaba más la asimetría de la inducción en los conductores móviles y la invariancia de las ecuaciones de Maxwell. Holton (1969) documentó que el papel del experimento en la génesis de la relatividad fue mucho menor de lo que se cuenta en los libros de texto. El mito sirve a la pedagogía: un hecho experimental claro y una teoría que lo explica.</p></div>
<div class="box rivalidad"><h4>Miller contra todos</h4><p>Miller, el mejor experimentador de interferometría después de Michelson, creyó haber encontrado un movimiento del éter a gran altura, y su anuncio en 1925 (con un premio de la AAAS) tuvo cierto eco. Einstein respondió: «Dios es sutil, pero no malicioso» (cuando le comunicaron el resultado), una frase de amplio uso. El episodio es un ejemplo de lo difícil que es separar una señal sistemática: cada experimento de este tipo está rodeado de efectos instrumentales, y la comunidad tarda años en convencerse.</p></div>
<div class="box epist"><h4>Hipótesis ad hoc, programas degenerativos</h4><p>Popper llamaba <em>ad hoc</em> a una hipótesis añadida solo para salvar a la teoría de una refutación, y la consideraba contraria al espíritu científico; para Lakatos, la teoría del éter con contracciones era un programa <em>degenerativo</em>: cada anomalía se arreglaba con una hipótesis auxiliar que no predecía nada nuevo. Hay una ironía: la contracción de Lorentz es <em>correcta</em> (en el marco de la relatividad), y lo que parecía ad hoc fue una pista. Kuhn lo habría descrito como la acumulación de anomalías que precede a un cambio de paradigma; Feyerabend, como la prueba de que una hipótesis aparentemente ad hoc puede ser la semilla de una teoría nueva, y que prohibir lo ad hoc es peligroso.</p></div>
</section>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule el desplazamiento esperado de franjas en el experimento de 1887: \(L=11\) m, \(\lambda=550\) nm, \(v=30\) km/s.
<details><summary>Respuesta</summary><p>\(\Delta N=2Lv^2/(c^2\lambda)=2\cdot11\cdot10^{-8}/(5.5\times10^{-7})=0.40\).</p></details></li>
<li><span class="lvl">Básico</span>Si el desplazamiento detectable es 0.01 de franja, ¿qué velocidad de la Tierra respecto del éter queda excluida?
<details><summary>Respuesta</summary><p>\(v<c\sqrt{0.01\,\lambda/(2L)}=4.7\) km/s: menos de 1/6 de la velocidad orbital.</p></details></li>
<li><span class="lvl">Intermedio</span>Calcule el coeficiente de arrastre de Fresnel para el agua (\(n=4/3\)) y la velocidad de la luz en agua que se mueve a 7 m/s en el sentido de la luz.
<details><summary>Respuesta</summary><p>\(k=1-9/16=0.4375\); \(u=c/n+kv=2.2484\times10^8+3.06\) m/s. La corrección es de 3 m/s sobre 2.25×10⁸: una parte en 10⁸; se mide con franjas.</p></details></li>
<li><span class="lvl">Intermedio</span>Muestre que con la contracción \(L'=L\sqrt{1-\beta^2}\) en el brazo paralelo los dos tiempos de ida y vuelta son iguales.
<details><summary>Respuesta</summary><p>\(t_\parallel=\dfrac{2L\sqrt{1-\beta^2}}{c(1-\beta^2)}=\dfrac{2L}{c\sqrt{1-\beta^2}}=t_\perp\).</p></details></li>
<li><span class="lvl">Avanzado</span>¿Por qué el experimento de 1887 no podía excluir un éter arrastrado, y qué otros resultados lo excluían?
<details><summary>Respuesta</summary><p>Un éter arrastrado por la Tierra no produce viento en el laboratorio y da un resultado nulo. Lo descartaban la aberración estelar (que requiere una velocidad relativa) y el experimento de Fizeau, que mostraba arrastre solo parcial. Por eso los físicos intentaron salvar el éter inmóvil con la contracción.</p></details></li>
<li><span class="lvl">Avanzado</span>Discuta si la contracción de FitzGerald–Lorentz es una hipótesis <em>ad hoc</em> según Popper y según Lakatos.
<details><summary>Respuesta</summary><p>Para Popper lo era, porque reducía el contenido refutable de la teoría al dejar de contar con el efecto medible. Para Lakatos formaba parte de un programa degenerativo hasta que la relatividad la reinterpretó y le dio contenido predictivo (dilatación del tiempo, masa relativista). Epistemológicamente muestra que ad hoc no equivale a falso.</p></details></li>
</ol>
