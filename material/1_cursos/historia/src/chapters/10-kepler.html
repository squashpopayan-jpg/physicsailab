<p class="lead">En 1600, un joven matemático luterano expulsado de Graz por la Contrarreforma llegó al castillo de un noble danés con una nariz de metal. Tycho, con la mejor colección de observaciones de Marte, no iba a entregarlas: Marte era el planeta que ninguno de sus ayudantes había podido domar. Kepler, de 28 años, prometió resolverlo en ocho días. Tardó ocho años. Y cuando lo logró, el cielo había cambiado: los círculos perfectos habían desaparecido y las órbitas eran elipses. Lo decisivo fue una diferencia de ocho minutos de arco, la octava parte de un grado, que Kepler se negó a ignorar.</p>

<section>
<h2>Un joven místico en una Europa en guerra</h2>
<div class="box contexto"><h4>Praga, la corte de un emperador melancólico</h4><p>Rodolfo II (1552-1612), emperador del Sacro Imperio, se retiró a Praga y reunió allí una corte singular: alquimistas, astrólogos, pintores (Arcimboldo), relojeros, y también a Tycho y a Kepler. Pagaba mal y tarde: cuando Kepler murió, la corte le debía unos 12 000 florines. Las guerras de religión marcaron toda su vida. Fue expulsado de Graz en 1600 por negarse a convertirse al catolicismo; perdió a su primera esposa, Barbara, y a un hijo en 1611, justo antes de que Rodolfo fuera depuesto por su hermano; la Guerra de los Treinta Años estalló en 1618 con la Defenestración de Praga y lo persiguió en Linz (sitiada en 1626) y en Ulm. En ese escenario hizo ciencia: con sueldos atrasados, calculando horóscopos para pagar el pan y publicando sus libros con ayuda de amigos.</p></div>
<div class="people">
<div class="persona"><b>Johannes Kepler</b><small>1571 – 1630 · Weil der Stadt, Tubinga, Graz, Praga, Linz</small><p>Nacido prematuro, enfermizo, con mala vista. Becario luterano del Stift de Tubinga. Su maestro Maestlin le enseñó el sistema de Copérnico. Fue astrónomo imperial y también astrólogo.</p></div>
<div class="persona"><b>Katharina Kepler</b><small>c. 1546 – 1622 · Leonberg</small><p>Su madre, curandera con hierbas, acusada de brujería en 1615. Estuvo presa catorce meses (1620-1621) y fue liberada gracias a la defensa jurídica de su hijo; murió seis meses después.</p></div>
<div class="persona"><b>Tycho Brahe</b><small>1546 – 1601 · Praga</small><p>El jefe del observatorio. Le encargó a Kepler la «guerra contra Marte», pero guardó celosamente sus registros.</p></div>
<div class="persona"><b>Franz Tengnagel</b><small>1576 – 1622 · Praga</small><p>Yerno de Tycho. Heredero de las observaciones, casi las retiene; negoció con Kepler su uso y su publicación.</p></div>
<div class="persona"><b>Christian Longomontanus</b><small>1562 – 1647 · Hven, Praga, Copenhague</small><p>Ayudante principal de Tycho. Había trabajado en Marte sin éxito antes de la llegada de Kepler.</p></div>
<div class="persona"><b>Jeremiah Horrocks</b><small>1618 – 1641 · Inglaterra</small><p>Joven astrónomo, corrigió las Tablas Rudolfinas y predijo y observó el tránsito de Venus de 1639.</p></div>
</div>
</section>

<section>
<h2>El misterio del cosmos (1596)</h2>
<p>El 19 de julio de 1595, durante una clase en Graz, Kepler dibujó en la pizarra un triángulo equilátero inscrito en una circunferencia y la circunferencia inscrita en el triángulo: la razón de sus radios (2:1) le recordó la de las órbitas de Saturno y Júpiter. Un salto de la imaginación: ¿por qué hay seis planetas, y por qué esas distancias? Respuesta: porque entre seis esferas caben cinco sólidos regulares (capítulo 4). Si se anidan en el orden cubo, tetraedro, dodecaedro, icosaedro, octaedro, las esferas inscritas y circunscritas dan los seis radios, con un desacuerdo de menos del 10 % con los valores de Copérnico.</p>
<div class="box epist"><h4>Una hipótesis equivocada que produjo la astronomía moderna</h4><p>El <em>Mysterium Cosmographicum</em> es falso (hoy conocemos ocho planetas y centenares de lunas, y las proporciones no se cumplen), pero movilizó a Kepler a estudiar las órbitas con precisión: para refutar o mejorar su modelo necesitaba los datos más exactos del mundo, los de Tycho. Kuhn y Holton han insistido en el papel de las convicciones <em>previas</em> (en este caso, platónicas y teológicas) en el descubrimiento; lo que importa es que, una vez que la teoría choca con los datos, el científico cambie la teoría y no los datos. Kepler lo hizo.</p></div>
</section>

<section>
<h2>La guerra contra Marte</h2>
<p>Tycho prometía a Kepler acceso a sus datos, pero sospechaba de él, un copernicano que podía usarlos para su sistema, y le reveló apenas lo necesario. Murió el 24 de octubre de 1601; su yerno Tengnagel y la familia reclamaron los libros. Kepler, nombrado sucesor como matemático imperial, se hizo cargo de las observaciones sin esperar la conformidad de los herederos y más tarde lo reconoció con franqueza: las había tomado, escribió, «o quizá usurpado». Es una disputa de herencia que decidió la historia de la astronomía.</p>
<div class="box rivalidad"><h4>Los datos como propiedad</h4><p>Tycho había conseguido que su observatorio produjera datos privados, y los publicaba selectivamente, protegiéndose de rivales como Ursus, que lo acusó de plagiar su sistema (la polémica de 1588-1601). Kepler necesitaba los datos de Tycho; Tycho, a Kepler como calculista. Ese pacto desigual duró año y medio. Los registros acabaron en manos de Kepler, y su publicación, en las <em>Tablas Rudolfinas</em> (1627), por un esfuerzo personal que hubo de financiar a medias con dinero propio. Hoy la ciencia abierta insiste en que los datos se compartan; la historia de Marte muestra lo que cuesta no compartirlos.</p></div>
<ol class="chain">
<li><b class="y">1600-1601 <span>· Tycho y el círculo</span></b><p>Longomontano llevaba años intentando que un modelo de círculos con ecuante diera cuenta de Marte con la exactitud de las observaciones de Tycho, sin conseguirlo. Marte es el planeta de mayor excentricidad entre los clásicos y, por eso, el más delator.</p></li>
<li><b class="y">1602-1604 <span>· La hipótesis vicaria</span></b><p>Kepler construyó un modelo ptolemaico perfeccionado (círculo con ecuante bisecado), ajustado a diez oposiciones. Daba las longitudes de las oposiciones con errores de 2′, igual que la precisión de Tycho: «vicaria» porque hacía las veces de la verdadera. Pero en otros puntos de la órbita fallaba hasta 8′, y las latitudes no cuadraban (véase la simulación del ecuante en el capítulo 5).</p></li>
<li><b class="y">1604-1605 <span>· La Tierra por triangulación</span></b><p>Para conocer la órbita de Marte necesitaba conocer primero la de la Tierra. Observó Marte, en dos fechas separadas por un periodo de Marte, y triangulaba la <em>Tierra</em> desde Marte. Resultado: la órbita de la Tierra también es excéntrica, y la Tierra se mueve más rápido cuando está más cerca del Sol (la ley de las áreas, que adivina con un cálculo de sumar distancias).</p></li>
<li><b class="y">1605 <span>· La órbita de Marte</span></b><p>Con posiciones de Marte triangulándolo desde las dos posiciones de la Tierra, comprobó que su órbita no era un círculo: se hundía 0.0086 en radio en los costados (un «óvalo»). Ensayó fórmulas con óvalos (hasta setenta intentos, dice) hasta que una elipse con el Sol en un foco encajó.</p></li>
</ol>
<div class="box fuente"><h4>Los ocho minutos</h4><blockquote>Si yo hubiera creído que podíamos ignorar estos ocho minutos de longitud, habría remendado mi hipótesis. Pero como no era lícito ignorarlos, esos ocho minutos señalaron el camino hacia una reforma completa de la astronomía.</blockquote><p>Kepler, <em>Astronomia nova</em> (1609), cap. 19 (paráfrasis de las traducciones). Una confianza total en la calidad de los datos de Tycho, cuya precisión estimaba en 2′, se impuso a la costumbre de siglos.</p></div>
<div class="sim" data-sim="triangulacion-marte" data-title="Reconstruir la órbita de Marte desde la Tierra"></div>
<div class="sim-guide"><ul>
<li>Con 2′ de error (la precisión de Tycho) y 60 determinaciones, Δχ² ronda 8: círculo y elipse no se distinguen. Suba las determinaciones a 300 y Δχ² pasa de 30: la elipse gana. Con 1′ basta una sesentena. El éxito de Kepler requirió datos numerosos y buenos.</li>
<li>Sin ruido, el círculo sigue sin ajustar (residuo 2×10⁻³ UA, el abultamiento de la elipse), mientras que la elipse da 10⁻¹³ UA: es la misma órbita.</li>
</ul></div>
<div class="box epist"><h4>Cuando los datos mandan</h4><p>El episodio de los ocho minutos es uno de los casos ejemplares de refutación de un modelo por un dato discrepante, y también un caso de <em>contexto de justificación</em>: Kepler publicó en la <em>Astronomia nova</em> todos sus fracasos (incluidos los largos cálculos que no sirvieron), una honestidad inusual. Popper lo cita; Lakatos recuerda que hay una cadena de hipótesis auxiliares que se ajustan antes de abandonar un núcleo (los círculos), y que Kepler abandonó el núcleo solo después de agotar los ajustes razonables.</p></div>
</section>

<section>
<h2>Las dos primeras leyes (1609)</h2>
<div class="eq key" data-name="Primera ley">\[r(\theta)=\frac{a(1-e^2)}{1+e\cos\theta}\qquad\text{(elipse con el Sol en un foco).}\]</div>
<div class="eq key" data-name="Segunda ley">\[\frac{\dd A}{\dd t}=\text{cte}\qquad\Longleftrightarrow\qquad r^2\dot\theta=\text{cte}.\]</div>
<p>La segunda ley es en realidad anterior: Kepler la descubrió con una argumentación física: si una fuerza motriz del Sol empuja al planeta, su efecto es inversamente proporcional a la distancia, y la <em>suma de las distancias</em> a lo largo del arco mide el tiempo; esa suma es proporcional al área barrida. Kepler lo reconoció como una aproximación; la demostración exacta (el momento angular) vendrá con Newton (capítulo 14).</p>
<div class="sim" data-sim="areas-kepler" data-title="Áreas iguales en tiempos iguales"></div>
<div class="sim-guide"><ul>
<li>Cada sector de color corresponde al mismo intervalo de tiempo. Cambie la excentricidad: los sectores se ensanchan cerca del afelio, pero todos tienen la misma área. Con Marte (0.093) la deformación es sutil; con un cometa tipo Halley (e ≈ 0.967) llega a un cociente de velocidades de casi 60.</li>
<li>La velocidad en el perihelio es mayor que en el afelio exactamente en la razón \((1+e)/(1-e)\).</li>
</ul></div>
<div class="box leyenda"><h4>«Kepler descubrió la elipse en poco tiempo con los datos de Tycho»</h4><p>Por el contrario, ocho años de cálculo. Kepler cuenta que alrededor de setenta pruebas fracasaron; que rechazó la elipse al principio por parecerle demasiado ajena a un cielo perfecto; y que halló la ley de las áreas antes que la elipse. Es un caso donde el orden del <em>libro</em> (primera ley, luego segunda) es inverso al del descubrimiento (la segunda, antes). Casi todos los textos de física presentan las leyes en el orden numérico, y ocultan el recorrido.</p></div>
</section>

<section>
<h2>La tercera ley y la armonía del mundo (1619)</h2>
<p>En el <em>Harmonices Mundi</em> (1619) Kepler seguía buscando una música del cosmos: asignó notas a las velocidades angulares extremas de cada planeta, y razones numéricas a los intervalos. En el libro V aparece el resultado que hoy consideramos más importante, la relación entre los periodos y las distancias:</p>
<div class="eq key" data-name="Tercera ley">\[\frac{T^2}{a^3}=\text{la misma constante para todos los planetas}.\]</div>
<div class="box fuente"><h4>El día que lo encontró</h4><blockquote>Si quieres la fecha exacta, el 8 de marzo de este año de 1618 vino a mi mente; pero, desafortunado en el cálculo, lo descarté como falso. Finalmente volvió el 15 de mayo y con un nuevo ataque venció las tinieblas de mi inteligencia.</blockquote><p>Kepler, <em>Harmonices Mundi</em>, libro V (paráfrasis). Lo notable: la ley sale de su convicción de que debe haber una relación armónica entre periodos y distancias; el primer intento falló por un error aritmético.</p></div>
<div class="sim" data-sim="tercera-ley" data-title="La tercera ley, en el Sol y en Júpiter"></div>
<div class="sim-guide"><ul>
<li>Los puntos de los seis planetas siguen una recta de pendiente 1.5 en la gráfica doble logarítmica. Cambie a las lunas de Júpiter: la ley es la misma, con otra constante, y ahora permite «pesar» a Júpiter.</li>
<li>Newton mostró que \(T^2=4\pi^2a^3/GM\). Con Marte se obtiene la masa del Sol; con Ío, la de Júpiter. Ése es el verdadero poder de la ley.</li>
</ul></div>
<div class="box epist"><h4>Descubrimiento místico, resultado empírico</h4><p>Muchos de los hallazgos de Kepler salieron de convicciones místicas que hoy no compartimos (música de las esferas, geometría sagrada). La tercera ley es el ejemplo extremo: nació de la búsqueda de una armonía. La epistemología distingue entre el <em>contexto de descubrimiento</em> (psicológico, histórico, a veces absurdo) y el <em>contexto de justificación</em> (lógico, empírico): la ley es verdadera con independencia de cómo se halló. Es una lección de humildad a la vez para quienes desprecian las motivaciones no científicas y para quienes creen que las verdaderas teorías necesitan buenas razones desde el principio.</p></div>
</section>

<section>
<h2>Una física del cielo</h2>
<p>El subtítulo de la <em>Astronomia nova</em> es «basada en las causas, o física celeste». Para Kepler la pregunta no era solo <em>cómo</em> se mueven los planetas (geometría), sino <em>por qué</em>. Rechazó las inteligencias angélicas que movían las esferas: «mi propósito es mostrar que la máquina celeste no es un ser divino viviente, sino una especie de mecanismo de relojería» (carta de 1605). Imaginó que el Sol, que gira sobre sí mismo, emite una fuerza (<em>anima motrix</em>) que arrastra los planetas como rayos de una rueda, y que decae con la distancia. Con ayuda de <em>De magnete</em> de Gilbert (1600) pensó que era magnética. El modelo era erróneo (la fuerza real no empuja tangencialmente), pero aceptó que la ciencia debe exigir causas físicas, y no solo geométricas: justamente el programa de Newton. Acuñó además la palabra <em>inercia</em> («pereza», la resistencia de los cuerpos al movimiento), aunque con un sentido distinto del actual.</p>
<h3>Óptica, el telescopio y los copos de nieve</h3>
<p>Kepler fue también el fundador de la óptica moderna: en <em>Astronomiae Pars Optica</em> (1604) explicó la cámara oscura, dedujo que la intensidad de la luz decrece con el inverso del cuadrado de la distancia, y comprendió que la imagen se forma en la retina (invertida) y que las gafas corrigen la focalización. Cuando Galileo publicó el <em>Sidereus Nuncius</em> (1610), Kepler fue el primero entre los sabios en apoyarlo públicamente, sin tener telescopio; poco después (<em>Dioptrice</em>, 1611) diseñó el telescopio de dos lentes convexas. En <em>Strena seu de nive sexangula</em> (1611), un regalo de año nuevo, se preguntó por qué los copos de nieve son hexagonales y propuso que se debía al empaquetamiento de esferas: su conjetura sobre el empaquetamiento máximo de esferas (74 %) se demostró en 1998-2014 (Hales, con ayuda de computadores). En el <em>Somnium</em> (escrito en 1608, publicado en 1634) imaginó un viaje a la Luna.</p>
<div class="box rivalidad"><h4>Galileo no escuchó a Kepler</h4><p>Kepler le escribió a Galileo en 1597 y en 1610, le envió sus libros y le pidió su opinión. Galileo contestó con cortesía, pero nunca citó las leyes de Kepler en sus escritos principales: el <em>Diálogo</em> (1632) mantiene los círculos y no menciona las elipses. Se han ofrecido varias explicaciones: la escasa circulación de la <em>Astronomia nova</em>, la lealtad de Galileo a los círculos como movimiento «natural», y su deseo de que sus descubrimientos propios no se mezclaran con los de otro. Los dos mayores científicos de su tiempo no colaboraron: una pérdida.</p></div>
<div class="box contexto"><h4>La bruja de Leonberg</h4><p>En 1615, una vecina acusó a Katharina Kepler de causarle daño con una bebida. El proceso se alargó por seis años, en el clima de una persecución que en el Württemberg de la época mató a cientos de mujeres. Kepler dejó Linz en 1620 y se hizo cargo de la defensa legal; la presentó con argumentos formales (declaró nulas las pruebas) y Katharina fue absuelta en octubre de 1621, tras catorce meses de prisión. Murió a los pocos meses. La historia es un recordatorio de que el hombre que midió Marte tenía una casa llena de supersticiones a su alrededor, y las enfrentó con paciencia jurídica.</p></div>
</section>

<section>
<h2>Las Tablas Rudolfinas y el final</h2>
<p>Las <em>Tablas Rudolfinas</em> (Ulm, 1627) aplicaron las elipses a un catálogo de 1006 estrellas (el de Tycho) y a tablas para calcular los planetas: con errores del orden de 10′ en los planetas, frente a grados enteros en las tablas anteriores. Con ellas, Kepler predijo para noviembre de 1631 un tránsito de Mercurio por el disco del Sol, que Pierre Gassendi observó en París (7 de noviembre): fue el primero registrado, y Kepler ya había muerto. Horrocks corrigió el cálculo de Venus y fue el primero en ver un tránsito de Venus (4 de diciembre de 1639). Era un triunfo predictivo que obligó a los astrónomos a tomar las elipses en serio.</p>
<p>Kepler murió en Ratisbona el 15 de noviembre de 1630, de una fiebre, cuando había viajado a cobrar sus sueldos atrasados. Está enterrado en una tumba que se perdió en la guerra. Su epitafio, que compuso él mismo, dice (en traducción): «Medí los cielos, y ahora mido las sombras; el espíritu era celeste, el cuerpo yace en la tierra».</p>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Con \(e=0.0934\) y \(a=1.5237\) UA, calcule el perihelio y el afelio de Marte, y el cociente de velocidades.
<details><summary>Respuesta</summary><p>\(r_{peri}=a(1-e)=1.381\) UA; \(r_{af}=a(1+e)=1.666\) UA; \(v_p/v_a=(1+e)/(1-e)=1.206\).</p></details></li>
<li><span class="lvl">Básico</span>Saturno tarda 29.457 años en una vuelta. ¿Cuál es su semieje según la tercera ley?
<details><summary>Respuesta</summary><p>\(a=T^{2/3}=29.457^{2/3}=9.54\) UA.</p></details></li>
<li><span class="lvl">Intermedio</span>El cometa Halley tiene \(e=0.967\) y \(T=76\) años. Calcule su semieje, perihelio, afelio y el cociente de velocidades.
<details><summary>Respuesta</summary><p>\(a=76^{2/3}=17.9\) UA; \(r_p=a(1-e)=0.59\) UA; \(r_a=35.2\) UA; \(v_p/v_a=(1+e)/(1-e)=59.6\).</p></details></li>
<li><span class="lvl">Intermedio</span>Phobos orbita Marte a 9 376 km en 0.3189 días. Calcule la masa de Marte.
<details><summary>Respuesta</summary><p>\(M=4\pi^2a^3/(GT^2)=4\pi^2(9.376\times10^6)^3/[6.674\times10^{-11}\times(27\,553)^2]=6.42\times10^{23}\) kg (valor aceptado 6.417×10²³).</p></details></li>
<li><span class="lvl">Avanzado</span>Un discrepancia de 8′ entre modelo y datos con una precisión de 2′: ¿es significativa? ¿Y si el error de los datos fuera de 8′? Relacione con la decisión de Kepler.
<details><summary>Respuesta</summary><p>Con 2′ de incertidumbre, 8′ son 4σ, casi seguro no es azar. Con 8′ de incertidumbre, sería 1σ y no se podría concluir nada: Kepler lo sabía porque conocía el instrumental de Tycho (cuadrantes, calibraciones). La decisión dependió de la <em>confianza en la precisión de los datos</em>, evaluada mediante la historia del instrumento.</p></details></li>
</ol>
