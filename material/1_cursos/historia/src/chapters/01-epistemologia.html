<p class="lead">En abril de 1726, un Newton de 84 años cenó con su joven amigo William Stukeley bajo unos manzanos, y le contó que, en un día igual a aquel, la idea de la gravitación le había venido al ver caer una manzana. Esa conversación es casi todo lo que sabemos de la manzana. De ella salió una de las escenas más repetidas de la ciencia, con una versión que Newton nunca contó (la manzana en la cabeza). Antes de recorrer 2 600 años de física hay que aclarar dos preguntas: cómo se llega a saber algo sobre la naturaleza, y cómo nos cuentan después que se llegó.</p>

<section>
<h2>Dos preguntas distintas</h2>
<p>La <span class="term">epistemología</span> estudia qué es el conocimiento, cómo se justifica y dónde están sus límites. Aplicada a la física, pregunta qué cuenta como prueba, cuándo una teoría es mejor que otra, qué hacemos con un dato que no encaja, y por qué creemos en entidades que nadie ha visto, como los campos o los quarks. La <span class="term">historiografía</span> estudia cómo se escribe la historia. Aplicada a la ciencia, pregunta qué se cuenta, desde dónde y para qué.</p>
<p>Ambas se tocan en un punto delicado: casi todo lo que sabemos del pasado nos llega mediado por quienes lo contaron después, muchas veces los propios protagonistas, sus discípulos o los autores de los libros de texto. Los libros de texto, en particular, presentan la física como una acumulación ordenada de resultados y borran los errores, los callejones sin salida y las disputas. Thomas Kuhn lo comparó con un mapa de turista: sirve para llegar, pero no cuenta cómo se hizo el camino.</p>
<div class="people">
<div class="persona"><b>Herbert Butterfield</b><small>1900–1979 · Cambridge</small><p>Historiador británico. En <em>La interpretación whig de la historia</em> (1931) criticó la costumbre de leer el pasado como una marcha hacia el presente, con buenos (los que acertaron) y malos (los que se equivocaron).</p></div>
<div class="persona"><b>Robert K. Merton</b><small>1910–2003 · Estados Unidos</small><p>Sociólogo. Estudió los descubrimientos múltiples y las disputas de prioridad, y describió en 1968 el «efecto Mateo»: el crédito va a quien ya es famoso.</p></div>
<div class="persona"><b>Ian Hacking</b><small>1936–2023 · Toronto</small><p>Filósofo. Sostuvo que creemos en un electrón no por la teoría sino porque lo usamos para manipular otras cosas: «si puedes rociarlos, son reales».</p></div>
</div>
<p>Tres defectos habituales de la historia de la ciencia se verán una y otra vez:</p>
<ul>
<li><b>Presentismo y estilo whig.</b> Juzgar a Aristóteles por no haber conocido a Newton, o a Ptolomeo por no haber sido Copérnico. Un buen relato pregunta qué podía saber y qué preguntas se hacía cada uno <em>en su época</em>.</li>
<li><b>Hagiografía y genio solitario.</b> Atribuir a una sola persona lo que fue obra de muchas, de instrumentos, de redes de cartas y de talleres. La física no se hace en una buhardilla.</li>
<li><b>Anécdota como prueba.</b> La manzana, la torre de Pisa, el «¡Eureka!». Muchas escenas famosas son tardías o inventadas. Eso no las vuelve inútiles (dicen qué quería ver cada época en sus héroes) pero obliga a señalarlas.</li>
</ul>
<div class="box note"><h4>La ley de Stigler</h4><p>El estadístico Stephen Stigler propuso en 1980, en broma seria, que «ningún descubrimiento científico lleva el nombre de su descubridor», y como corresponde, se la atribuyó a Merton. Es útil como ejercicio: la ley de Boyle la había observado Towneley y Power; la ley de Hubble la dedujo antes Lemaître; la ley de Snell la conocía Ibn Sahl hacia el año 984; las ecuaciones de Maxwell en su forma de cuatro fueron obra de Heaviside. Volveremos a esto en el capítulo 36.</p></div>
</section>

<section>
<h2>Cómo se llega a saber: los grandes proyectos</h2>
<p>El mundo antiguo dejó dos modelos. Platón confiaba en la razón pura y en las matemáticas como acceso a lo que no cambia; Aristóteles, su alumno, partía de la observación cuidadosa y la clasificación. La revolución científica del siglo XVII los reelaboró y ofreció los dos caminos clásicos:</p>
<ul>
<li><b>Inducción</b> (Francis Bacon, <em>Novum Organum</em>, 1620): acumular observaciones ordenadas, sin prejuicios, hasta que emerjan las leyes. Bacon advirtió de los «ídolos» de la mente (de la tribu, de la caverna, del mercado, del teatro) que nos hacen ver lo que esperamos.</li>
<li><b>Deducción</b> (Descartes, <em>Discurso del método</em>, 1637): partir de principios claros y evidentes, y deducir de ellos el resto, a la manera de la geometría.</li>
</ul>
<p>Newton combinó ambos de modo característico: de los fenómenos se infieren proposiciones por inducción, que luego se tratan como verdaderas mientras no aparezcan excepciones, y se deducen consecuencias que se confrontan con la observación. Su frase «<em>hypotheses non fingo</em>» (no invento hipótesis) rechazaba explicar la causa de la gravedad sin datos, aunque él mismo escribió muchas conjeturas.</p>

<h3>Hume y el problema de la inducción</h3>
<p>David Hume (1739) señaló una dificultad lógica profunda: que el Sol haya salido todos los días hasta hoy no <em>implica</em> que saldrá mañana. Para pasar del pasado al futuro hay que suponer que la naturaleza es uniforme, y esa suposición solo se justifica con… la experiencia pasada. La argumentación es circular. Ninguna cantidad de cisnes blancos demuestra que todos los cisnes lo sean; un cisne negro (Australia, 1697, Willem de Vlamingh) basta para refutarlo.</p>

<h3>Del positivismo a Popper</h3>
<p>Auguste Comte (1830-42) defendió que la ciencia madura se limita a leyes entre fenómenos, sin buscar causas ocultas. Ernst Mach llevó esa idea a la física y desconfió de los átomos y del espacio absoluto (influyó en Einstein, y combatió a Boltzmann). El Círculo de Viena (Schlick, Carnap, años veinte) propuso que un enunciado solo tiene sentido si puede verificarse con la experiencia.</p>
<p>Karl Popper (<em>Logik der Forschung</em>, 1934) respondió con un giro: no podemos <em>verificar</em> una ley universal, pero sí <em>refutarla</em> con un solo caso contrario. Lo que distingue a la ciencia es que sus teorías prohíben algo y se exponen a fallar. Sus ejemplos favoritos: la relatividad general de Einstein, que en 1919 arriesgó una predicción numérica precisa sobre la desviación de la luz (capítulo 27), frente al psicoanálisis de Freud y Adler o a cierto marxismo, que podían «explicar» cualquier conducta o hecho, y por eso, decía, no decían nada.</p>

<h3>Los límites de la refutación</h3>
<p>Pierre Duhem (1906) y luego W. V. Quine (1951) mostraron que una hipótesis nunca se contrasta sola. Cuando una predicción falla, falla el <em>conjunto</em>: la teoría, las condiciones iniciales, el funcionamiento del instrumento, las hipótesis auxiliares. Ejemplos de manual: en 1846 la órbita anómala de Urano no refutó a Newton sino que llevó a postular un planeta (Neptuno, hallado en la posición calculada por Le Verrier); en 1859 la anomalía de Mercurio llevó al mismo razonamiento (el planeta «Vulcano»), que esta vez fue un camino equivocado: lo que fallaba era Newton (capítulo 27). Solo con el resultado en la mano se sabe cuál de las dos reacciones era razonable. A esto se llama <span class="term">subdeterminación</span>: los datos disponibles nunca bastan para elegir una sola teoría.</p>

<h3>Kuhn, Lakatos y Feyerabend</h3>
<p>Thomas Kuhn (1962) tomó la historia en serio y vio un patrón: largos períodos de <span class="term">ciencia normal</span>, en los que una comunidad resuelve «rompecabezas» con un <span class="term">paradigma</span> compartido (ejemplos ejemplares, instrumentos, valores); anomalías que se acumulan; una crisis; y una <span class="term">revolución</span> tras la cual el nuevo paradigma redefine hasta qué es una buena pregunta. Entre paradigmas hay cierta <em>inconmensurabilidad</em>: «masa» en Newton y en Einstein no significa lo mismo.</p>
<p>Imre Lakatos (1970) intentó conciliar a Popper con Kuhn: lo que se evalúa no es una teoría aislada sino un <span class="term">programa de investigación</span>, con un núcleo duro protegido por un cinturón de hipótesis auxiliares. Un programa es <em>progresivo</em> si sus ajustes predicen hechos nuevos, y <em>degenerativo</em> si solo parchea para salvarse. Paul Feyerabend (1975), amigo y adversario de Lakatos, fue más lejos: examinó casos como el de Galileo y concluyó que no hay un método único; el progreso a veces exige romper las reglas («todo vale» fue su provocación, no su recomendación).</p>

<section>
<h2>El juego 2-4-6: por qué tendemos a confirmar</h2>
<p>En 1960 el psicólogo Peter Wason propuso a estudiantes un rompecabezas. El experimentador tiene en mente una regla que cumplen ciertas series de tres números; la serie 2, 4, 6 la cumple. El participante propone nuevas series, recibe «sí» o «no», y debe averiguar la regla. La mayoría pensaba «cada número es dos más que el anterior» y probaba 8, 10, 12 o 20, 22, 24, que recibían «sí». Tras varias respuestas afirmativas, declaraban la regla con seguridad… y se equivocaban. La regla era mucho más amplia: «cualquier serie creciente». Solo quien probaba una serie que su hipótesis <em>prohibía</em> (por ejemplo 1, 2, 50, o incluso 6, 4, 2) podía descubrir el error.</p>
<p>La lección de Popper aparece en el laboratorio de psicología: probar casos que confirman una hipótesis no distingue entre ella y otras más generales; los casos informativos son los que podrían contradecirla.</p>
<div class="sim" data-sim="wason" data-title="El juego 2-4-6 de Wason"></div>
<div class="sim-guide"><ul>
<li>Elija tres números y pulse «Probar la serie». La respuesta «sí» o «no» viene de una regla oculta. Cuando se sienta seguro, declare la regla.</li>
<li>Al terminar se cuenta cuántas de sus pruebas eran del tipo «progresión aritmética» (la hipótesis más tentadora). Si casi todas lo eran, usted jugó a confirmar.</li>
<li>Pruebe «Otra partida»: cambia la regla oculta. Las series que contradicen su hipótesis siempre aportan más información.</li>
</ul></div>
<div class="box epist"><h4>Confirmar no es probar</h4><p>Los físicos son humanos: Millikan descartó gotas «malas» al medir la carga del electrón (capítulo 24); Eddington descartó placas en 1919 (capítulo 27). Lo importante es que el criterio de descarte esté declarado y sea defendible antes de ver el resultado, no después.</p></div>
</section>

<section>
<h2>Cuánto vale una predicción arriesgada</h2>
<p>El teorema de Bayes (publicado póstumamente en 1763 por Richard Price, amigo de Thomas Bayes) da una forma precisa de actualizar la confianza en una teoría \(T\) cuando aparece un dato \(E\):</p>
<div class="eq key" data-name="Teorema de Bayes">\[P(T\mid E)=\frac{P(E\mid T)\,P(T)}{P(E\mid T)\,P(T)+P(E\mid\neg T)\,P(\neg T)}.\]</div>
<p>La clave está en \(P(E\mid\neg T)\): la probabilidad de ver ese dato <em>aunque la teoría fuera falsa</em>. Si la predicción es vaga (casi cualquier teoría la cumpliría), el dato apenas mueve la confianza. Si es arriesgada (muy improbable sin la teoría), un acierto la dispara. Es la versión cuantitativa de la idea de Popper, y explica por qué la desviación de la luz de 1919, el regreso del cometa Halley en 1758 y el descubrimiento de Neptuno en 1846 impresionaron tanto: eran números que casi nadie habría acertado por casualidad.</p>
<div class="sim" data-sim="bayes-pred" data-title="Predicciones vagas y predicciones arriesgadas"></div>
<div class="sim-guide"><ul>
<li>Parta de una confianza inicial baja (5 %). Con una predicción vaga (\(P(E\mid\neg T)\) alto) la confianza casi no sube; con una arriesgada, salta.</li>
<li>El cociente \(P(E\mid T)/P(E\mid\neg T)\) es el <em>factor de Bayes</em>: cuántas veces más probable era el dato con la teoría que sin ella.</li>
</ul></div>
</section>

<section>
<h2>Cómo se cuenta: leyenda y documento</h2>
<p>A cada capítulo de este cuaderno le acompañan cajas de colores. Las <em>amarillas</em> separan la leyenda del documento; las <em>azules</em> dan el contexto social y político; las <em>rojas</em> cuentan rivalidades y envidias; las <em>moradas</em> hacen la lectura epistemológica; las <em>marrones</em> reproducen fuentes primarias. Para entrenar el ojo, algunas escenas famosas:</p>
<div class="box leyenda"><h4>La manzana de Newton</h4><p>Existen cuatro relatos casi contemporáneos: el de Stukeley (conversación del 15 de abril de 1726), el de John Conduitt (su sobrino político, 1727), el de Voltaire (que lo supo de la sobrina de Newton y lo popularizó en 1727), y el de Henry Pemberton (1728). En ninguno la manzana golpea a Newton: él habría estado en el jardín de Woolsthorpe «contemplativo» y preguntándose por qué la manzana cae siempre perpendicular al suelo, y por qué su atracción no se extendería a la Luna. Lo importante del episodio es la pregunta, no la fruta. Tampoco la ley fue instantánea: el cálculo con la Luna en 1666 salió mal por un dato incorrecto del radio terrestre, y la ley completa se escribió en los <em>Principia</em> veinte años más tarde (capítulo 14).</p></div>
<div class="box leyenda"><h4>El genio solitario de 1905</h4><p>La imagen del empleado de patentes que revoluciona la física en 1905 sin ayuda tiene algo de cierto (trabajó fuera de la universidad), pero omite la <em>Olympia Academy</em> de amigos con quienes leía a Hume, Mach y Poincaré, las cartas con Michele Besso y Marcel Grossmann, y el contexto de problemas en el aire: Lorentz, Poincaré y Abraham trabajaban en lo mismo (capítulo 26).</p></div>
<p>El apéndice D reúne más de una docena de afirmaciones célebres con su veredicto. Es un buen ejercicio abrirlo ahora y adivinar cuáles son ciertas.</p>
</section>

<section>
<h2>Un mapa del cuaderno</h2>
<p>El recorrido sigue el orden cronológico, con paradas por temas:</p>
<ol>
<li><b>Antigüedad (cap. 2-6).</b> Calendarios y astronomía de Mesopotamia y Egipto; los jonios y la <em>physis</em>; Platón y Aristóteles; Alejandría con Euclides, Arquímedes, Eratóstenes y Ptolomeo; Roma y el cierre de las escuelas.</li>
<li><b>Edad Media (cap. 7-8).</b> La óptica de Alhazén, el método de Biruni, las traducciones de Toledo, el <em>impetus</em> y las gráficas de Oresme.</li>
<li><b>Revolución científica (cap. 9-15).</b> Copérnico, Tycho, Kepler, Galileo, el vacío, Descartes, Huygens y Newton.</li>
<li><b>Siglos XVIII y XIX (cap. 16-23).</b> Mecánica analítica, calor y energía, entropía, electricidad y magnetismo, Maxwell, la luz como onda y la crisis del éter.</li>
<li><b>Siglo XX (cap. 24-33).</b> Rayos X, cuantos, relatividad, átomo de Bohr, mecánica cuántica, núcleo, partículas, materia condensada y cosmos.</li>
<li><b>Más allá del laboratorio (cap. 34-36).</b> La física en Nueva Granada y Colombia, quién hace física (mujeres, guerra, dinero), y los patrones que se repiten.</li>
</ol>
<p>Las fuentes de partida son el breve y elegante <em>Historia de la física</em> de Sir James Jeans (1948), <em>La historia de la física</em> de Anne Rooney y una cronología general; todos los datos se contrastaron con bibliografía especializada (apéndice F) y los cálculos de las simulaciones, con SciPy y con los valores publicados por los propios autores (apéndice E).</p>
</section>

<section>
<h2>Problemas y preguntas de análisis</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un colega afirma: «Todas mis medidas confirman mi teoría». ¿Qué pregunta le haría, desde Popper, y cuál, desde Duhem?
<details><summary>Respuesta</summary><p>Desde Popper: ¿qué resultado habría contradicho la teoría, y lo buscó? Desde Duhem: si algún día una medida falla, ¿qué hipótesis auxiliar (instrumento, condiciones) revisaría antes de abandonar la teoría, y la fijó de antemano?</p></details></li>
<li><span class="lvl">Básico</span>Con prior \(P(T)=0.05\), \(P(E\mid T)=0.9\) y \(P(E\mid\neg T)=0.5\), calcule \(P(T\mid E)\). Repita con \(P(E\mid\neg T)=0.01\).
<details><summary>Respuesta</summary><p>Primero: \(0.045/(0.045+0.475)=0.087\). Segundo: \(0.045/(0.045+0.0095)=0.826\).</p></details></li>
<li><span class="lvl">Intermedio</span>Explique con el caso de Urano (1846) y el de Mercurio (1859) por qué Lakatos habla de «programas» y no de «teorías aisladas».
<details><summary>Respuesta</summary><p>En ambos casos la reacción fue conservar el núcleo (mecánica newtoniana) y modificar las hipótesis auxiliares (un planeta nuevo). En el primero la modificación predijo un hecho nuevo (Neptuno) y el programa fue progresivo; en el segundo nunca apareció Vulcano y el parche fue degenerativo hasta que la relatividad general dio la explicación en 1915.</p></details></li>
<li><span class="lvl">Intermedio</span>Busque en el apéndice D tres afirmaciones que sean falsas y clasifique por qué se difundieron: ¿fue por interés nacional, por dramatismo o por un malentendido?
<details><summary>Respuesta</summary><p>Respuesta abierta. Ejemplo: «Tierra plana medieval» surgió de una biografía novelesca de Colón (dramatismo y propaganda contra la Iglesia); «Einstein suspendió matemáticas» de un malentendido de escalas de notas.</p></details></li>
<li><span class="lvl">Avanzado</span>Diseñe una regla oculta distinta de «creciente» para el juego 2-4-6 en la que una estrategia puramente confirmatoria nunca la descubra. ¿Qué serie la delataría?
<details><summary>Respuesta</summary><p>Por ejemplo «la suma es par». La serie 2, 4, 6 cumple; también 8, 10, 12 y 1, 3, 4. Quien solo prueba progresiones aritméticas de paso 2 jamás ve un «no». La serie 1, 2, 3 (suma par, pero rompe la progresión de paso 2) no lo delata; pero 1, 2, 4 (suma impar) devuelve «no» y obliga a replantear.</p></details></li>
</ol>
