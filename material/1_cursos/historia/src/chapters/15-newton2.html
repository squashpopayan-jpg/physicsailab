<p class="lead">En febrero de 1672, un profesor lucasiano de 29 años escribió una carta a Henry Oldenburg, secretario de la Royal Society, para decir que había hecho «el más extraño, si no el más considerable, descubrimiento hasta ahora hecho respecto de las operaciones de la naturaleza»: la luz blanca no es simple. Se publicó en las <em>Philosophical Transactions</em>. Y lo que esperaba fuera recibido como un triunfo se convirtió en una pesadilla: críticas, cartas de réplica, demandas de repeticiones, y un enemigo implacable en Robert Hooke. Newton juró no volver a publicar, y mantuvo la <em>Opticks</em> sin imprimir treinta años, hasta que murió Hooke.</p>

<div class="vitals">
<div><b>Época</b>1666 – 1730</div>
<div><b>Lugares</b>Woolsthorpe, Cambridge, Londres, París, Copenhague, Kew</div>
<div><b>Instrumentos</b>prisma, telescopio de reflexión, anillos, sector zenital, eclipses de Ío</div>
<div><b>Pregunta</b>¿Qué es la luz y cuánto tarda en llegar?</div>
</div>

<section>
<h2>La luz blanca no es simple</h2>
<p>En 1666, en Woolsthorpe, Newton hizo un experimento sencillo: hizo pasar un rayo de sol por un agujero en la contraventana y por un prisma, y miró el resultado en la pared del fondo, a siete metros. Lo esperado, según la ley de refracción (capítulos 7 y 13), era un círculo de luz; lo que apareció fue una banda <em>alargada</em>, cinco veces más larga que ancha, con los colores del arcoíris.</p>
<ol class="chain">
<li><b class="y">Idea previa <span>· la doctrina de las modificaciones</span></b><p>Desde Aristóteles se creía que el color nacía de una mezcla de luz y oscuridad, o que el prisma «modificaba» la luz blanca, que era pura. Descartes y Hooke, aunque con diferencias, compartían esa idea: el rojo sería un movimiento más intenso del éter, el azul uno más débil.</p></li>
<li><b class="y">El experimento clave <span>· experimentum crucis</span></b><p>Newton colocó dos tablas con orificios. Con el primer prisma extendía el espectro; con la tabla seleccionaba un solo color (por ejemplo el rojo) que enviaba a un segundo prisma. El rojo se desviaba en el segundo prisma como siempre, y <em>seguía siendo rojo</em>: no se descomponía ni cambiaba. Concluyó que cada color tiene una refrangibilidad propia e inmutable y que la luz blanca es una mezcla.</p></li>
<li><b class="y">La prueba inversa</b><p>Si se recoge toda la luz dispersa con una lente o un segundo prisma, se recompone la luz blanca. Mezclar colores en un disco que gira da un gris blanquecino: «el blanco es un compuesto de todos los colores».</p></li>
<li><b class="y">Consecuencia técnica</b><p>Los telescopios de lentes tienen aberración cromática (las lentes desvían los colores de modo distinto) y se pensó que no tenía remedio. Newton, para evitarla, construyó un telescopio de reflexión con un espejo cóncavo (1668); presentó uno a la Royal Society en diciembre de 1671, y con eso fue elegido miembro en enero de 1672.</p></li>
</ol>
<div class="sim" data-sim="prisma-newton" data-title="El prisma de Newton: dispersión, experimentum crucis y recomposición"></div>
<div class="sim-guide"><ul>
<li>El abanico violeta–rojo es de unos 1.5° en vidrio BK7 con ángulo de prisma de 60°: la dispersión es pequeña frente a la desviación (38°), por eso los colores se ven mejor a gran distancia. Gire el prisma: hay un ángulo de desviación mínima, en el que el rayo atraviesa simétricamente, y allí la desviación vale \(\delta=2\arcsin(n\operatorname{sen}(A/2))-A\).</li>
<li>Los modos «experimentum crucis» y «prisma invertido» son esquemas del razonamiento; la trayectoria exacta de los rayos depende de la posición de cada elemento.</li>
</ul></div>
<div class="box leyenda"><h4>Siete colores, siete notas</h4><p>Newton distinguió en el espectro siete colores: rojo, naranja, amarillo, verde, azul, índigo y violeta. Pero un espectro es continuo. En su cuaderno primero escribió cinco colores y luego añadió el naranja y el índigo, para tener siete como las siete notas de la escala musical. La razón de la analogía es numerológica y muy newtoniana: la creencia de que el cosmos tiene una armonía que va de las cuerdas pitagóricas a los colores. Es otra de las influencias del misticismo en el nacimiento de la física (capítulos 3 y 10).</p></div>
</section>

<section>
<h2>La disputa: Hooke, Huygens y las réplicas que no salían</h2>
<div class="box rivalidad"><h4>Una carta que cambió a Newton</h4><p>Hooke respondió a la carta con desdén: el fenómeno se explicaba con su propia teoría de <em>pulsos</em> (el color es un tipo de pulso oblicuo, véase la <em>Micrographia</em>) y los experimentos no probaban nada nuevo. Huygens objetó que bastarían dos colores (amarillo y azul) para explicar los demás, y que las hipótesis sobre la naturaleza de la luz eran precisamente lo que Newton eludía. Un jesuita de Lieja, Lucas, dijo que no obtenía el mismo espectro. Newton respondió a todos, con lujo de detalles y creciente irritación. En 1676 escribió a Oldenburg: «veo que un hombre debe decidirse a no publicar nada nuevo, o a ser esclavo para defenderlo». La actitud de Newton respecto a la crítica fue de ahí en adelante defensiva: las decisiones de publicar tarde, con pocas pruebas públicas, o de ocultar los cálculos, tienen su origen en esta querella.</p></div>
<p>El problema epistemológico era real: Newton afirmaba haber <em>demostrado</em> sus conclusiones con experimentos, con una certeza «matemática». Hooke y Huygens, en cambio, ofrecían hipótesis sobre la naturaleza de la luz, y reclamaban que la prueba de Newton no excluía otras explicaciones. Newton contestó que no se trataba de hipótesis sobre la naturaleza de la luz, sino de propiedades observables de los rayos, y que no era necesario saber qué es la luz para saber cómo se comporta. Es el origen de su «no invento hipótesis» (capítulo 14).</p>
<div class="box epist"><h4>Replicar es difícil: el experimento que Francia no pudo repetir</h4><p>Edme Mariotte intentó en 1681 repetir el <em>experimentum crucis</em> en París y no obtuvo el resultado: el color seleccionado se descomponía de nuevo. Las condiciones que Newton había omitido (la limpieza de los prismas, el tamaño del orificio, la distancia) importaban, y las descripciones de la <em>Philosophical Transactions</em> no bastaban. En Francia el experimento no se aceptó hasta que John Theophilus Desaguliers lo realizó ante los académicos en París, en 1715. Es un caso de lo que Collins llama «regresión del experimentador»: si el resultado de una réplica es negativo, ¿es que el experimento falló o que el fenómeno no existe? No se puede saber sin un criterio independiente de lo que cuenta como un «buen» experimento.</p></div>
<div class="box epist"><h4>Goethe contra Newton</h4><p>En 1810, Johann Wolfgang von Goethe publicó <em>Zur Farbenlehre</em> («Teoría de los colores») para refutar a Newton. Para el poeta, el color es un fenómeno de la visión que nace de la interacción entre luz y oscuridad, y el experimento de un solo orificio es una experiencia artificial que «tortura» a la naturaleza. Newton, decía, tomó un caso particular y lo erigió en ley. Los físicos rechazaron a Goethe (con razón: sus predicciones fallaban), pero el debate señala una tensión permanente: una descripción física (la longitud de onda) deja fuera lo que vemos (el color como percepción). Schopenhauer y, más tarde, Wittgenstein y los psicólogos de la percepción lo retomaron: la ciencia mide una cosa y la experiencia contiene otra.</p></div>
</section>

<section>
<h2>Los anillos de Newton y la <em>Opticks</em></h2>
<p>En la <em>Opticks</em> (1704), con una prosa clara en inglés (no en latín), Newton reunió sus resultados sobre la luz: Libro I, reflexión y refracción y la composición del blanco; Libro II, los colores de láminas delgadas (burbujas de jabón, películas de aceite, y los <em>anillos</em>); Libro III, difracción. Terminó con una serie de <em>Cuestiones</em> (31 en la edición de 1717), una colección de especulaciones fascinantes: que los rayos de luz son corpúsculos, que los cuerpos y la luz actúan unos sobre otros a distancia, que los átomos tienen fuerzas, que la gravedad y la electricidad pueden tener un origen común.</p>
<p>Los anillos aparecen cuando se apoya una lente de gran radio de curvatura sobre un cristal plano: Newton midió que el espesor del aire entre ambos en el primer anillo brillante era 1/178 000 de pulgada (0.143 µm). Un hecho notable que, con ondas, equivale a \(\lambda/4\), con \(\lambda\) = 571 nm: casi exactamente el amarillo-verde. Pero Newton lo interpretó como «accesos de fácil reflexión y fácil transmisión» que la luz tendría de manera periódica (un cierto carácter ondulatorio en una teoría corpuscular).</p>
<div class="eq key" data-name="Anillos de Newton">\[r_m=\sqrt{m\,\lambda\,R}\quad(\text{anillos oscuros},\ m=0,1,2,\dots),\qquad d_m=\frac{m\lambda}{2}.\]</div>
<div class="sim" data-sim="anillos-newton" data-title="Los anillos de Newton y la longitud de onda"></div>
<div class="sim-guide"><ul>
<li>Cambie el color: los anillos se achican hacia el violeta y se agrandan hacia el rojo. Con luz blanca se mezclan: son coloridos cerca del centro y se desdibujan lejos, porque los colores se desfasan.</li>
<li>Con el espesor de Newton (λ/4 = 143 nm en el primer anillo brillante) se obtiene λ = 570 nm. Young hizo ese cálculo en 1801 con los datos de Newton para los siete colores y halló del rojo extremo (1/36 000 de pulgada, 706 nm) al violeta (1/60 000, 423 nm): las primeras longitudes de onda de la historia. El mérito fue, otra vez, de la memoria de un libro.</li>
</ul></div>
<div class="box epist"><h4>Una teoría con dos caras</h4><p>Newton evitó pronunciarse sobre si la luz era corpuscular u ondulatoria, aunque sus preferencias eran claras. Dio argumentos físicos: la luz se propaga en línea recta y proyecta sombras nítidas (las ondas se «doblarían», como el sonido); y la doble refracción mostraba que los rayos tienen «lados» (polarización), cosa imposible con las ondas longitudinales de Huygens. Estos argumentos eran razonables en 1704. La autoridad de Newton impuso la idea corpuscular durante todo el siglo XVIII (con excepciones, como Euler en 1746); con Young y Fresnel el balance se invertiría (capítulo 22). Cuando se supo que las ondas luminosas son transversales, el argumento de la polarización se volvió contra Newton. Una objeción correcta puede desmoronarse con una mejor teoría de la clase rival.</p></div>
</section>

<section>
<h2>La velocidad de la luz: Römer (1676)</h2>
<p>Galileo intentó medir la velocidad de la luz con dos ayudantes sobre colinas distantes y linternas con pantallas: no encontró retraso apreciable, como era de esperar (hubiera necesitado una precisión de microsegundos). Descartes sostenía que la luz es instantánea. Ole Römer, un joven danés que había llegado a París en 1672 como ayudante de Picard, observó por años los eclipses de Ío, la luna más interna de Júpiter, un «reloj» con periodo de 1.769 días, y notó que no eran regulares.</p>
<ol class="chain">
<li><b class="y">La anomalía</b><p>Los eclipses de Ío ocurrían <em>antes</em> de lo previsto cuando la Tierra se acercaba a Júpiter, y <em>después</em> cuando se alejaba, y la desviación se acumulaba: unos 22 minutos de diferencia entre la posición más cercana y la más lejana.</p></li>
<li><b class="y">La explicación</b><p>La luz tarda en cruzar la distancia variable entre Júpiter y la Tierra; a un lado del Sol la distancia es mayor en dos radios de la órbita terrestre. Si el retraso es de unos 22 minutos para ese diámetro, la velocidad es la distancia dividida entre ese tiempo.</p></li>
<li><b class="y">La predicción</b><p>En septiembre de 1676 anunció en la Académie que el eclipse del 9 de noviembre llegaría diez minutos más tarde de lo calculado: así ocurrió.</p></li>
<li><b class="y">La cifra</b><p>Con la distancia de la Tierra al Sol que acababan de medir Cassini y Richer (138 millones de km, 1672), Huygens calculó en 1678 unos 2.1×10⁵ km/s (el valor actual es 2.998×10⁵). Era la primera medida de una constante universal.</p></li>
</ol>
<div class="sim" data-sim="roemer" data-title="Los eclipses de Ío y el retraso de la luz"></div>
<div class="sim-guide"><ul>
<li>La curva muestra el retraso acumulado en función del mes. El máximo teórico con c actual es de 16.6 minutos (y no 22: Römer sobreestimó el retraso por sus medidas y por la incertidumbre en la órbita de Júpiter).</li>
<li>Pulse «Römer (22 min)»: con 22 minutos y 138 millones de km se obtiene \(c=2.09\times10^5\) km/s, un 30 % menos del real. Cassini, jefe de Römer, nunca aceptó su interpretación (prefería una irregularidad de Ío) y a Römer no le dio el crédito. Fue Huygens y, en 1704, Newton, quien la adoptó.</li>
</ul></div>
<div class="box rivalidad"><h4>Un danés en la Académie de París</h4><p>La Académie des sciences nació en 1666 con el patrocinio de Colbert y se llenó de extranjeros: el holandés Huygens, el italiano Cassini, el danés Römer. Gian Domenico Cassini (1625-1712) dirigió el Observatorio, descubrió cuatro lunas de Saturno y la «división de Cassini» (1675) y, con Richer en Cayena (1672), midió la paralaje de Marte y fijó la distancia al Sol. Cassini era un gran observador y un jefe celoso, y se negó a admitir que la anomalía de Ío fuera un efecto de la velocidad de la luz (aunque en 1675 la había propuesto). Römer volvió a Copenhague en 1681, fue astrónomo real, alcalde y jefe de policía: la vida de un científico en el siglo XVII no era solo ciencia. Los grados de su termómetro inspiraron a Fahrenheit.</p></div>
</section>

<section>
<h2>Bradley y una paralaje que no era</h2>
<p>Desde 1725, James Bradley, con su amigo Samuel Molyneux, observó con un telescopio de 24 pies fijo verticalmente en Kew la estrella γ Draconis, que pasa casi por el cenit de Londres. Buscaba la paralaje anual que probaría el movimiento de la Tierra (capítulo 9). Encontró un movimiento anual de la estrella de unos 40″ de amplitud: la estrella estaba al sur en diciembre, al norte en junio. Si fuera paralaje, el máximo debía ocurrir en septiembre y marzo. Estaba desfasado 90°.</p>
<div class="eq key" data-name="Aberración de la luz (Bradley, 1728)">\[\tan\alpha=\frac vc\ \ \Rightarrow\ \ \alpha=20.5''\ \text{para}\ v=29.78\ \text{km/s}\ \Rightarrow\ c=3.00\times10^5\ \text{km/s}.\]</div>
<p>Según la tradición, se le ocurrió la explicación paseando en barco por el Támesis: al virar la embarcación, la veleta del mástil cambiaba de dirección, aunque el viento no hubiera cambiado. De igual modo, la luz de una estrella parece llegar con una pequeña inclinación debido a que la Tierra se mueve. En 1729 comunicó que el desplazamiento es de 20.2″ en cada sentido, y que, por tanto, la luz del Sol tarda 8 minutos 12 segundos en llegar a la Tierra (el valor moderno es 8 min 19 s). Dos grandes resultados de una vez: la velocidad de la luz coincide con la de Römer; y la Tierra, por fin, <em>se mueve</em>, con una prueba directa. En 1748, Bradley halló una segunda oscilación (la nutación, con periodo de 18.6 años), debida al efecto de la Luna sobre el abultamiento ecuatorial, como Newton había previsto.</p>
<div class="sim" data-sim="aberracion" data-title="La aberración estelar: la Tierra se mueve y la luz tiene velocidad finita"></div>
<div class="sim-guide"><ul>
<li>Con la estrella en el polo de la eclíptica la posición aparente recorre un círculo de 20.5″ de radio; a latitud 0, un segmento de línea. A 51.5° (γ Draconis) una elipse de 20.5″ por 16″.</li>
<li>Con \(v=29.78\) km/s y \(\kappa=20.5''\) se obtiene \(c=2.996\times10^5\) km/s, mejor que la de Römer con datos de 1676, y es independiente de la distancia al Sol.</li>
</ul></div>
<div class="box epist"><h4>Descubrir lo que no se buscaba</h4><p>La aberración es un caso clásico de <em>serendipia</em> («hallazgo afortunado») y de lo que Kuhn llamó <em>anomalía productiva</em>: Bradley midió bien, descartó los errores de instrumento, la paralaje, la refracción atmosférica y la nutación (que aún no se conocía), y quedó con un resultado que no esperaba y que explicaba mejor de lo que había buscado. Pero también es un recordatorio: solo los instrumentos <em>excelentes</em> permiten hallar anomalías; Hooke había intentado la misma medida con γ Draconis en 1669 y obtuvo resultados inconsistentes, que atribuyó a paralaje.</p></div>
<div class="sim" data-sim="timeline" data-ch="newton2" data-from="1660" data-to="1760" data-title="Línea de tiempo de la luz en el siglo de Newton"></div>

<div class="sim-guide"><ul>
<li>Bradley (1693-1762) nació cuando Newton ya tenía 51 años: lo conoció y fue su colaborador y amigo, y Newton ya era presidente de la Royal Society.</li>
<li>Römer (1644-1710) y Huygens trabajaron juntos en París entre 1672 y 1681. Cassini y Huygens eran rivales en la Académie.</li>
</ul></div>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule el radio del primer y del décimo anillo oscuro con luz de 589 nm y una lente de 1 m de radio de curvatura.
<details><summary>Respuesta</summary><p>\(r_m=\sqrt{m\lambda R}\): \(r_1=0.77\) mm; \(r_{10}=2.43\) mm.</p></details></li>
<li><span class="lvl">Básico</span>Con \(n=1.5144\) (rojo) y \(1.5302\) (violeta) en un prisma de 60°, calcule la desviación mínima de cada color y el abanico.
<details><summary>Respuesta</summary><p>\(\delta=2\arcsin(n\sen30^\circ)-60^\circ\): 38.43° y 39.83°; abanico 1.40°.</p></details></li>
<li><span class="lvl">Intermedio</span>Con la distancia al Sol de 138×10⁶ km y un retraso de 22 minutos para la órbita completa (2 UA), calcule c; ¿qué error relativo tiene respecto del valor real?
<details><summary>Respuesta</summary><p>\(c=2\times138\times10^6/(22\times60)=2.09\times10^5\) km/s; error −30 %. Con datos modernos (2 UA, 16.6 min) se obtiene 3.0×10⁵.</p></details></li>
<li><span class="lvl">Intermedio</span>Con \(v=29.78\) km/s y \(\kappa=20.5''\), calcule c y el tiempo que tarda la luz del Sol (1 UA).
<details><summary>Respuesta</summary><p>\(c=v/\tan\kappa=2.996\times10^5\) km/s; \(t=1.496\times10^8/2.996\times10^5=499\) s = 8 min 19 s.</p></details></li>
<li><span class="lvl">Avanzado</span>La luz de la teoría corpuscular de Newton exigía \(v_{agua}>v_{aire}\); la de Huygens, \(v_{agua}<v_{aire}\). Con Römer y Bradley se sabía c en el aire. ¿Qué medición faltaba para decidir y por qué tardó 150 años?
<details><summary>Respuesta</summary><p>Faltaba medir la velocidad de la luz en un medio material, en un laboratorio: se requerían tiempos de recorrido de nanosegundos en un metro de agua. Foucault y Fizeau (1850) lo lograron con un espejo giratorio de alta velocidad. Antes no había instrumentos capaces; las dos teorías coexistieron hasta que la tecnología lo permitió (capítulo 22).</p></details></li>
</ol>
