<p class="lead">El 24 de agosto de 79, Plinio el Viejo, almirante de la flota de Miseno, vio una nube con forma de pino sobre el Vesubio. Mandó preparar un barco para estudiar el fenómeno de cerca y para rescatar a quienes estaban en la costa. No volvió: murió asfixiado en la playa de Estabia. Su sobrino, que lo contaría en una carta, anotó que en aquellas horas su tío dictaba observaciones. Roma no dejó teoremas de física, pero dejó una curiosidad enciclopédica, ingenieros extraordinarios y una cadena de textos copiados que, cuando casi todo se perdía, hizo posible que algo sobreviviera.</p>

<section>
<h2>Roma: ingenieros más que filósofos</h2>
<div class="box contexto"><h4>Una república práctica</h4><p>Roma conquistó la cuenca del Mediterráneo y heredó la ciencia griega sin cultivarla en la misma medida. Cicerón lo dice sin rodeos en las <em>Tusculanas</em>: los griegos veneraron la geometría, «nosotros la limitamos a medir y contar». Los romanos invirtieron en acueductos, caminos, concreto hidráulico (el Panteón conserva la mayor cúpula de hormigón sin armar), alcantarillado y un ejército de ingenieros. Su cultura dio prestigio a la oratoria, el derecho y la administración. Los intelectuales leían en griego y la ciencia seguía hablándose en esa lengua: los grandes textos físicos y astronómicos del Imperio (Ptolomeo, Galeno) están en griego. El latín tuvo traducciones, compendios y enciclopedias, no un sistema propio.</p></div>
<div class="people">
<div class="persona"><b>Tito Lucrecio Caro</b><small>c. 99 – c. 55 a. C. · Roma</small><p>Poeta epicúreo. <em>De rerum natura</em> (c. 55 a. C.) expone en verso la física atomista de Epicuro: átomos, vacío, desviación espontánea (<em>clinamen</em>) y un universo sin dioses entrometidos.</p></div>
<div class="persona"><b>Vitruvio</b><small>c. 80 – c. 15 a. C. · Roma</small><p>Arquitecto e ingeniero militar de César y Augusto. Sus <em>Diez libros de arquitectura</em> incluyen acústica de teatros, máquinas, relojes de agua y la anécdota de Arquímedes y la corona.</p></div>
<div class="persona"><b>Séneca</b><small>c. 4 a. C. – 65 d. C. · Roma</small><p>Filósofo estoico y consejero de Nerón. En <em>Cuestiones naturales</em> afirma que los cometas son cuerpos permanentes que regresan, y que «vendrá un tiempo» en que se conocerán sus órbitas. Se suicidó por orden de Nerón.</p></div>
<div class="persona"><b>Plinio el Viejo</b><small>23 – 79 d. C. · Como, Roma, Miseno</small><p>Su <em>Historia natural</em> (37 libros, 77 d. C.) recoge unos 20 000 datos de 2000 libros: astronomía, geografía, zoología, minerales, medicina. Compiló sin criticar; por eso conserva lo que otras fuentes perdieron.</p></div>
<div class="persona"><b>Hipatia de Alejandría</b><small>c. 355 – 415 · Alejandría</small><p>Maestra de matemática, astronomía y filosofía neoplatónica; hija del matemático Teón. Comentó el <em>Almagesto</em> y a Apolonio. Asesinada por una turba cristiana.</p></div>
<div class="persona"><b>Juan Filópono</b><small>c. 490 – c. 570 · Alejandría</small><p>Cristiano y filósofo aristotélico. Criticó la física de Aristóteles: propuso que el lanzador transmite al proyectil una «fuerza impresa» y que cuerpos de distinto peso caen casi igual en el vacío.</p></div>
<div class="persona"><b>Boecio</b><small>c. 477 – 524 · Roma, Pavía</small><p>Alto funcionario del rey ostrogodo Teodorico. Tradujo y comentó a Aristóteles y escribió sobre aritmética y música. Condenado por traición, escribió en prisión <em>La consolación de la filosofía</em>.</p></div>
<div class="persona"><b>Beda el Venerable</b><small>c. 673 – 735 · Jarrow</small><p>Monje inglés. Su <em>De temporum ratione</em> (725) fija el cómputo de la Pascua y explica las mareas por la Luna; confirma una Tierra esférica.</p></div>
</div>
</section>

<section>
<h2>Lucrecio: los átomos en el rayo de sol</h2>
<p>Epicuro (341-270 a. C.) recuperó el atomismo de Demócrito y le añadió el <em>clinamen</em>: los átomos caen en el vacío, pero se desvían un poco al azar, lo que permite choques y libertad. Lucrecio lo cantó en seis libros de hexámetros latinos. Es una física de lo no visible que se defiende por analogía con lo visible, y contiene una observación memorable:</p>
<div class="box fuente"><h4>El polvo en el rayo de luz</h4><blockquote>Mira lo que ocurre cuando los rayos del sol entran en una habitación a oscuras: verás una multitud de partículas minúsculas mezclarse de muchas maneras en el vacío, y como en una guerra eterna combatir en escuadrones, sin darse tregua.</blockquote><p>Lucrecio, <em>De rerum natura</em>, II, 114-122 (resumen libre). Esas partículas, dice, son un reflejo de lo que hacen los átomos invisibles: «de ellos viene el primer movimiento».</p></div>
<p>El polvo no se mueve por el movimiento de los átomos, sino por corrientes de aire; pero la <em>analogía</em> de Lucrecio es tan buena que, dos mil años después, Einstein (1905) mostró que granos suspendidos de unos micras sí son zarandeados por las moléculas del fluido, con un desplazamiento cuadrático medio que crece linealmente con el tiempo: \(\langle r^2\rangle=4Dt\) en el plano. Jean Perrin lo midió en 1908 y obtuvo el número de Avogadro; ganó el Nobel de 1926 (capítulo 18).</p>
<div class="eq key" data-name="Movimiento browniano (plano)">\[\langle r^2\rangle=4Dt,\qquad D=\frac{k_BT}{6\pi\eta a}.\]</div>
<div class="sim" data-sim="polvo" data-title="El polvo de Lucrecio: empujones al azar y desplazamiento medio"></div>
<div class="sim-guide"><ul>
<li>Cada grano recibe empujones gaussianos de tamaño \(\sigma\) en \(x\) e \(y\). La curva azul (promedio sobre todos los granos) sigue la recta discontinua \(2\sigma^2t\): el desplazamiento cuadrático crece <em>linealmente</em>, no con el cuadrado del tiempo como en un movimiento con velocidad constante.</li>
<li>Con muy pocos granos la curva se desvía más de la recta: el promedio necesita estadística.</li>
</ul></div>
<div class="box epist"><h4>Una buena idea sin pruebas todavía</h4><p>La pintura de Lucrecio muestra algo importante: un fenómeno visible puede interpretarse como indicio de uno invisible, pero solo se vuelve prueba cuando la teoría predice <em>cuánto</em>. En el siglo XIX el botánico Robert Brown vio en 1827 gránulos de polen agitados y pensó primero que estaban vivos; descartó la hipótesis con polvo de minerales. Faltaron otros ochenta años para tener la fórmula.</p></div>
</section>

<section>
<h2>El calendario: una cuestión de poder y de matemática</h2>
<p>El calendario romano antiguo era un caos manejado por sacerdotes y políticos, que añadían meses a conveniencia. En 46 a. C. Julio César, aconsejado por el astrónomo alejandrino Sosígenes, decretó un año de 365 días con un día más cada cuatro años (365.25 d), y alargó ese año a 445 días para recolocar las estaciones («el año de la confusión»). El año tropical dura en realidad 365.2422 d: el calendario juliano se adelanta un día cada 128 años.</p>
<ol class="chain">
<li><b class="y">325 <span>· Concilio de Nicea</span></b><p>El Concilio fija reglas para la fecha de la Pascua: el primer domingo tras la primera luna llena posterior al equinoccio, que cae el 21 de marzo.</p></li>
<li><b class="y">Siglos VIII-XIII <span>· Beda, Roger Bacon</span></b><p>Los cómputos acumulan desfase: Beda lo advierte; Roger Bacon (1267) escribe al papa pidiendo corregir; sin efecto.</p></li>
<li><b class="y">1514-1563 <span>· Letrán y Trento</span></b><p>El Quinto Concilio de Letrán consulta a Copérnico (1514), que contesta que primero hay que conocer mejor los movimientos del Sol y la Luna (su libro de 1543 quiso ser esa contribución). El Concilio de Trento deja en 1563 la reforma en manos del papa.</p></li>
<li><b class="y">1582 <span>· Gregorio XIII</span></b><p>Con cálculos de Luigi Lilio y Christopher Clavius se suprimen 10 días (el jueves 4 de octubre fue seguido del viernes 15) y se eliminan tres bisiestos cada 400 años (los años seculares no divisibles por 400): año medio de \(365+97/400=365.2425\) d.</p></li>
</ol>
<div class="eq key" data-name="Año gregoriano">\[\bar T=365+\frac{97}{400}=365.2425\ \text{d},\qquad \Delta T=T_{trop}-\bar T=-0.0003\ \text{d}\ \Rightarrow\ \text{1 día cada }\approx3\,200\text{ años}.\]</div>
<div class="sim" data-sim="calendario" data-title="El desfase de los calendarios respecto del Sol"></div>
<div class="sim-guide"><ul>
<li>Use «Nicea (325) → 1582»: el calendario juliano llevaba 9.8 días de adelanto (10 en la práctica). El egipcio de 365 días, sin bisiestos, se va quedando atrás un día cada cuatro años.</li>
<li>La línea verde casi horizontal es el calendario gregoriano.</li>
</ul></div>
<div class="box contexto"><h4>Tardó siglos en adoptarse</h4><p>Los países católicos lo aplicaron de inmediato (España, Portugal, Italia en 1582). Los protestantes y ortodoxos, desconfiando de un decreto del papa, esperaron: los estados luteranos de Alemania hacia 1700, Gran Bretaña y sus colonias en 1752 (suprimiendo 11 días), Suecia en 1753, Rusia en 1918 (por eso la «Revolución de Octubre» es de noviembre en el calendario gregoriano), Grecia en 1923. Se atribuye a Kepler la ironía de que los protestantes preferían «estar en desacuerdo con el Sol que de acuerdo con el papa».</p></div>
<div class="box leyenda"><h4>«¡Devuélvannos nuestros once días!»</h4><p>Se cuenta que en Inglaterra, en 1752, hubo motines de gente que reclamaba los días perdidos. La imagen se apoya en un grabado de William Hogarth (1755) con una pancarta electoral. No hay registro de tales motines: es un pequeño mito, quizá sobre el fanatismo del pueblo. La sociedad ya contaba rentas, deudas y alquileres, y el reajuste pudo afectar a la contabilidad, no a la vida.</p></div>
</section>

<section>
<h2>La Antigüedad tardía: ciencia en comentarios</h2>
<p>Después de Ptolomeo y Galeno la ciencia griega entra en una fase de comentario. En Alejandría y en Atenas se enseña neoplatonismo, y los matemáticos (Pappo, Teón, Diofanto) conservan y glosan. No es una época estéril: allí se discutirán, sin consecuencias inmediatas, ideas que tendrán largo futuro.</p>
<h3>Hipatia y la política de Alejandría</h3>
<p>Hipatia dirigía una escuela privada donde tuvo alumnos cristianos y paganos, y fue consejera de Orestes, el prefecto imperial. En 415, durante una disputa entre éste y el obispo Cirilo, una turba de cristianos fanáticos la sacó de su carruaje y la mató. Su muerte fue política antes que científica: el conflicto era entre el poder civil y el eclesiástico, y ella era una aliada del primero. La memoria posterior (Gibbon, Voltaire, y el cine) la convirtió en mártir de la ciencia, y eso la ha vuelto un símbolo, pero conviene distinguir.</p>
<div class="box leyenda"><h4>Hipatia y el fin de la ciencia antigua</h4><p>Se repite que con su muerte «terminó la ciencia antigua» y que fue «la última directora de la Biblioteca». Ninguna de las dos cosas es cierta. La Biblioteca principal había desaparecido mucho antes; Hipatia enseñaba en su casa; y la actividad científica siguió en Alejandría durante más de un siglo (Filópono, ya en el siglo VI, es de allí). También es dudoso que haya inventado el astrolabio o el hidrómetro, atribuciones tardías. Lo cierto es su asesinato y su obra de comentarista, hoy perdida.</p></div>
<h3>Filópono: la primera crisis de la física aristotélica</h3>
<p>Filópono (siglo VI), cristiano, comentó la <em>Física</em> y la corrigió. Dos críticas importan para la historia posterior:</p>
<ul>
<li><b>Caída:</b> «si se dejan caer desde la misma altura dos cuerpos, uno muchas veces más pesado que el otro, se verá que la relación de los tiempos no es la de los pesos, sino que la diferencia de tiempo es muy pequeña». Es una observación, no una teoría, y es la primera que contradice la regla \(v\propto F/R\) con una experiencia. Casi mil años después Galileo la repetirá.</li>
<li><b>Proyectiles:</b> la antiperístasis de Aristóteles no sirve (¿cómo empuja el aire una flecha que se aleja de él?). El lanzador comunica al proyectil una «fuerza motriz incorpórea» que se va gastando. Es el origen del <span class="term">impetus</span> que Buridán formulará en el siglo XIV (capítulo 8).</li>
</ul>
<div class="box epist"><h4>Por qué el sistema aguantó</h4><p>La física aristotélica sobrevivió a las críticas de Filópono porque no había alternativa global. Una anomalía aislada (la caída casi igual, el proyectil) no derriba un paradigma si no hay otro sistema que explique todo lo demás. Kuhn insistió en ello: «un paradigma solo se abandona cuando hay otro dispuesto a sustituirlo».</p></div>
<div class="box contexto"><h4>Justiniano cierra las escuelas</h4><p>En 529 el emperador Justiniano prohibió a los «paganos» enseñar y confiscó los bienes de la Academia de Atenas. Siete filósofos, entre ellos Simplicio, buscaron asilo en la corte persa de Cosroes, volvieron en 532 y siguieron escribiendo comentarios, con un debilitado apoyo oficial. El cierre fue un golpe, pero no un telón: la Academia llevaba décadas decadente, y las escuelas de Alejandría siguieron hasta la conquista árabe de 641.</p></div>
</section>

<section>
<h2>Monasterios, enciclopedias y compendios</h2>
<p>En la Europa latina, tras la caída de Roma de Occidente (476), el saber físico se redujo a compendios. Boecio tradujo los tratados lógicos de Aristóteles y manuales de aritmética y música, que fueron el currículo básico durante siglos. Casiodoro (c. 485-580) fundó el monasterio de Vivario donde los monjes copiaban manuscritos. Isidoro de Sevilla (c. 560-636) compiló en sus <em>Etimologías</em> el saber de su época; Beda (725) explicó la relación entre las mareas y la Luna y escribió sobre el cómputo. Ni Isidoro ni Beda creían en una Tierra plana (Isidoro la describe como una esfera), a pesar de lo que dice una leyenda del siglo XIX (capítulo 8). Eran copistas y divulgadores: sin su labor no habría habido textos que traducir.</p>
<p>Cosmas Indicopleustes (siglo VI), un comerciante alejandrino convertido en monje, escribió una <em>Topografía cristiana</em> donde defiende una tierra plana con la forma del tabernáculo de Moisés. Es la excepción que confirma la regla: su libro fue marginal y se conoce sobre todo por los historiadores que lo usan para el mito.</p>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>El año juliano supera al tropical en \(365.25-365.2422=0.0078\) d. ¿Cuántos años acumulan un día de error? ¿Cuántos días de desfase entre 325 y 1582?
<details><summary>Respuesta</summary><p>\(1/0.0078\approx128\) años. En 1257 años: \(1257\times0.0078=9.8\) d, que la reforma redondeó a 10.</p></details></li>
<li><span class="lvl">Básico</span>Compruebe que el año gregoriano medio es 365.2425 d.
<details><summary>Respuesta</summary><p>En 400 años hay \(100-3=97\) bisiestos: \(365+97/400=365.2425\).</p></details></li>
<li><span class="lvl">Intermedio</span>En una caminata aleatoria plana con pasos gaussianos de desviación \(\sigma\) por eje, ¿cuánto vale \(\langle r^2\rangle\) tras \(t\) pasos? ¿Y la constante \(D\) si cada paso dura \(\Delta\tau\)?
<details><summary>Respuesta</summary><p>\(\langle r^2\rangle=2\sigma^2t\); con \(\langle r^2\rangle=4D\,t\Delta\tau\) resulta \(D=\sigma^2/(2\Delta\tau)\).</p></details></li>
<li><span class="lvl">Intermedio</span>Para Hipatia, ¿qué fuentes antiguas tenemos? ¿Qué problema de método plantea que casi todo sobre ella proceda de autores posteriores y con intereses distintos?
<details><summary>Respuesta</summary><p>Sinesio (cartas de su alumno), Sócrates Escolástico (historia eclesiástica), Damascio y Juan de Nikiu. Cada uno cuenta según su bando: es el problema de la fuente interesada; se reconstruye contrastando versiones y descontando lo que coincide con la tesis del autor.</p></details></li>
<li><span class="lvl">Avanzado</span>Aplique la distinción de Kuhn entre anomalía y crisis a las objeciones de Filópono a Aristóteles. ¿Por qué no hubo crisis en el siglo VI y sí en el XVII?
<details><summary>Respuesta</summary><p>En el siglo VI las anomalías (caída casi igual, proyectiles) eran aisladas, no existía una alternativa completa ni una comunidad que la quisiera, y el marco aristotélico servía a la teología. En el XVII se acumularon observaciones (telescopio, vacío, péndulos), apareció un sistema alternativo (mecánica de Galileo-Newton) y un cambio institucional (sociedades científicas).</p></details></li>
</ol>
