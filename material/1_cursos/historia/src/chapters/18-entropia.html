<p class="lead">El 5 de septiembre de 1906, durante unas vacaciones con su familia en Duino, cerca de Trieste, Ludwig Boltzmann, 62 años, se ahorcó mientras su mujer y su hija nadaban. Llevaba años de depresión, vista y asma deterioradas y la sensación, dirían algunos, de haber perdido la batalla por los átomos. Dos años más tarde, el físico francés Jean Perrin empezó a medir el movimiento browniano y, en 1909, el químico Wilhelm Ostwald, el mayor adversario de Boltzmann, reconoció que los átomos existen. La fórmula \(S=k\ln W\) está grabada en la lápida de su tumba, en el cementerio central de Viena.</p>

<div class="vitals">
<div><b>Época</b>1738 – 1913</div>
<div><b>Lugares</b>Glasgow, Cambridge, Berlín, Viena, París</div>
<div><b>Pregunta</b>¿Por qué el tiempo tiene una flecha, y existen los átomos?</div>
<div><b>Resultado</b>la mecánica estadística; la entropía como probabilidad</div>
</div>

<section>
<h2>La segunda ley y la muerte térmica</h2>
<div class="box contexto"><h4>La Inglaterra victoriana y la energía</h4><p>Con la máquina de vapor, la termodinámica se convirtió en una ciencia con valor industrial y moral. En 1852, Kelvin publicó un breve artículo, «Sobre una tendencia universal de la naturaleza a la disipación de la energía mecánica»: la energía se conserva pero se degrada, y el universo, tarde o temprano, se «enfriará». Esa idea (la <em>muerte térmica</em>) fue un tema de debate teológico y literario en la era victoriana: la naturaleza como un reloj que se acaba, el sol que se apaga, Thomas Hardy y H. G. Wells. En 1865 Clausius dio la formulación definitiva: introdujo una nueva magnitud, la <em>entropía</em> (del griego <em>tropé</em>, «transformación», que quiso que sonara parecido a «energía»), y resumió las dos leyes: «La energía del universo es constante. La entropía del universo tiende a un máximo».</p></div>
<div class="eq key" data-name="Segunda ley (Clausius, 1865)">\[\dd S=\frac{\delta Q_{rev}}{T},\qquad\Delta S_{universo}\ge0.\]</div>
<div class="people">
<div class="persona"><b>James Clerk Maxwell</b><small>1831 – 1879 · Edimburgo, Cambridge</small><p>Escocés, matemático y físico. Dedujo la distribución de velocidades de un gas (1860) y unificó la luz y el electromagnetismo (capítulo 21). Murió de cáncer a los 48 años.</p></div>
<div class="persona"><b>Ludwig Boltzmann</b><small>1844 – 1906 · Viena, Graz, Múnich, Leipzig</small><p>Austríaco, profesor en Viena. Creó la mecánica estadística con la fórmula que lleva su nombre. Brillante, expansivo y vulnerable a la crítica.</p></div>
<div class="persona"><b>Josiah Willard Gibbs</b><small>1839 – 1903 · New Haven</small><p>Casi desconocido en vida. Formuló los potenciales químicos (1876-1878) y los conjuntos estadísticos (1902). Maxwell escribió una nota sobre sus gráficas, y lo dio a conocer.</p></div>
<div class="persona"><b>John James Waterston</b><small>1811 – 1883 · Edimburgo, Bombay</small><p>Ingeniero escocés. Su teoría cinética de 1845 fue rechazada por la Royal Society; el manuscrito apareció en sus archivos en 1891.</p></div>
<div class="persona"><b>Josef Loschmidt</b><small>1821 – 1895 · Viena</small><p>Estimó en 1865 el tamaño de las moléculas y objetó en 1876 que la reversibilidad de la mecánica contradice la irreversibilidad.</p></div>
<div class="persona"><b>Wilhelm Ostwald</b><small>1853 – 1932 · Riga, Leipzig</small><p>Químico, Nobel 1909. Defendió la «energética»: todo es energía; los átomos son ficciones útiles. Se retractó en 1909.</p></div>
<div class="persona"><b>Jean Perrin</b><small>1870 – 1942 · París</small><p>Físico francés. Nobel 1926 por sus trabajos sobre la discontinuidad de la materia y la sedimentación. Su libro <em>Les Atomes</em> (1913) fue la prueba final.</p></div>
<div class="persona"><b>Paul y Tatyana Ehrenfest</b><small>1880 – 1933 · Viena, Leiden</small><p>Escribieron en 1911 la crítica más lúcida de la mecánica estadística; el modelo de la urna es suyo.</p></div>
</div>
</section>

<section>
<h2>La edad de la Tierra: un duelo entre la física y la geología</h2>
<p>Kelvin aplicó la termodinámica a una pregunta incómoda: ¿cuánto tiempo lleva la Tierra enfriándose? Con la ecuación de Fourier de la conducción del calor y el gradiente medido en las minas (1 °F cada 50 pies) obtuvo en 1862 una edad de 98 millones de años (con unos límites de 20 a 400). Era mucho menos que los cientos de millones que pedían los geólogos (Lyell) y Darwin para la sedimentación y la evolución («una de las más graves objeciones», reconoció Darwin en 1869; suprimió en la edición siguiente el cálculo de 300 millones de años que había propuesto para la erosión del Weald). En 1897 Kelvin redujo su estimación a 24 millones.</p>
<div class="eq key" data-name="Enfriamiento de un semiespacio (Fourier–Kelvin)">\[G=\frac{T_0}{\sqrt{\pi\kappa t}}\ \ \Longrightarrow\ \ t=\frac{T_0^{\,2}}{\pi\kappa\,G^2}.\]</div>
<div class="sim" data-sim="edad-tierra" data-title="La edad de la Tierra según Kelvin"></div>
<div class="sim-guide"><ul>
<li>Con los datos de Kelvin (3 900 K, 36.5 K/km, κ = 1.18×10⁻⁶ m²/s) se obtienen 98 millones de años. Pero el resultado depende de tres números: un factor 2 en cualquiera de ellos cambia la edad por 2 o 4.</li>
<li>La edad correcta (4 550 millones) exige un gradiente efectivo mucho menor que el medido (porque el calor interno se repone con la desintegración del uranio, el torio y el potasio) y un manto que convecta (Perry, 1895).</li>
</ul></div>
<div class="box epist"><h4>Un argumento sólido con una premisa que faltaba</h4><p>Kelvin no se equivocó en la matemática ni en los datos: se equivocó en una premisa, que no existe otra fuente de calor. Era la más económica de su época, pues las leyes conocidas de la energía no daban otra. Cuando Rutherford, en 1904, expuso en la Royal Institution que el radio libera calor sin cesar (con Kelvin, de 80 años, entre el público) y que la radiactividad podía mantener caliente a la Tierra, Kelvin ya no aceptaba el argumento. Ese episodio se cita como ejemplo de prudencia: un cálculo riguroso es válido solo con las hipótesis explícitas; las ocultas son las que fallan. A la vez es un ejemplo de lo contrario: los geólogos y biólogos <em>confiaron en su evidencia</em> contra el prestigio del mejor físico de su tiempo, y tuvieron razón.</p></div>
</section>

<section>
<h2>La teoría cinética: un gas de moléculas</h2>
<ol class="chain">
<li><b class="y">1738 <span>· Daniel Bernoulli</span></b><p>La presión de un gas se debe al choque de las partículas contra las paredes: \(P\propto\) energía cinética por unidad de volumen. La idea quedó sin eco durante un siglo: se prefería el calórico (capítulo 17).</p></li>
<li><b class="y">1845 <span>· Waterston</span></b><p>Escribió un trabajo con las ideas esenciales: temperatura proporcional a la energía cinética media; equipartición; relación entre calores específicos. La Royal Society lo rechazó: un evaluador dijo que era «nada más que tonterías, ni siquiera apto para leerse ante la Sociedad». El manuscrito durmió en los archivos hasta que lord Rayleigh lo rescató en 1891: «un caso de lo difícil que es ser un pionero». Waterston desapareció en 1883, probablemente ahogado, sin saber de su rehabilitación.</p></li>
<li><b class="y">1857-1858 <span>· Clausius</span></b><p>Introdujo el <em>camino libre medio</em> para responder a Buys-Ballot, que le objetó: si las moléculas van a cientos de metros por segundo, ¿por qué el olor tarda en llegar a la habitación contigua? Porque chocan miles de millones de veces por segundo.</p></li>
<li><b class="y">1860 <span>· Maxwell</span></b><p>Con la simetría y la independencia de las componentes de la velocidad (un argumento de siete líneas) dedujo la distribución:</p></li>
</ol>
<div class="eq key" data-name="Distribución de Maxwell (Maxwell, 1860)">\[f(v)\,\dd v=4\pi\left(\frac{m}{2\pi k_BT}\right)^{3/2}v^2\,\ee^{-mv^2/2k_BT}\,\dd v.\]</div>
<p>Maxwell hizo una predicción sorprendente: la viscosidad de un gas es independiente de su densidad (las moléculas más numerosas transportan más, pero llegan de más cerca). Los físicos de la época la tomaron por absurda. Maxwell y su esposa Katherine la comprobaron con un torno con discos oscilantes en el desván de su casa de Londres (1865): era cierta.</p>
<div class="sim" data-sim="maxwell-boltzmann" data-title="De cualquier distribución inicial a la de Maxwell"></div>
<div class="sim-guide"><ul>
<li>Arranque «todas con la misma rapidez»: la distribución inicial es un pico. A los pocos miles de colisiones es la de Maxwell, con una distancia KS menor de 0.04. La energía y el momento total se conservan exactamente.</li>
<li>Con una sola partícula muy rápida, la energía se reparte entre todas (equipartición): la «termalización». Pulse «Revertir las velocidades»: el sistema <em>deshace</em> el camino durante un tiempo (la mecánica es reversible) y después continúa. Es la objeción de Loschmidt.</li>
</ul></div>
<div class="box epist"><h4>El demonio de Maxwell</h4><p>En una carta a Tait (1867) Maxwell imaginó una criatura diminuta que vigila una compuerta entre dos cámaras: deja pasar a la derecha las moléculas rápidas y a la izquierda las lentas, y así genera una diferencia de temperatura <em>sin gastar trabajo</em>, violando la segunda ley. Maxwell concluyó que la segunda ley es de naturaleza estadística: «tiene la misma certeza que la afirmación de que, si se arroja un vaso de agua al mar, no se podrá recuperar el mismo vaso de agua». Lord Kelvin lo llamó «demonio» en 1874. Szilard (1929) mostró que el demonio necesita información, y Landauer (1961) y Bennett (1982) que <em>borrar</em> un bit de memoria cuesta como mínimo \(k_BT\ln2\) de energía disipada (2.9×10⁻²¹ J a 300 K), con lo que la segunda ley se salva. Se verificó en el laboratorio en 2012 (Bérut y colaboradores).</p></div>
</section>

<section>
<h2>Boltzmann: la flecha del tiempo como estadística</h2>
<div class="box contexto"><h4>Viena, 1870-1906</h4><p>Boltzmann hizo su carrera en un imperio con universidades vivas y profesores combativos. En Viena, la filosofía positivista de Ernst Mach (que ocupó en 1895 una cátedra de «filosofía inductiva» en la misma universidad) sostenía que la ciencia solo debe hablar de lo observable y que los átomos son «cosas del pensamiento». Boltzmann y Mach, colegas y adversarios, se respetaban. En el congreso de Lübeck de 1895 Boltzmann debatió con Ostwald y Helm sobre la «energética»; los testigos opinaron que ganó con claridad, pero la corriente antiatomista era fuerte en Alemania. Boltzmann dedicó años a defender el significado del mundo microscópico, y escribió que era «un hombre que lucha contra la corriente».</p></div>
<ol class="chain">
<li><b class="y">1872 <span>· el teorema H</span></b><p>Con una hipótesis sobre las colisiones (cuántas ocurren entre moléculas no correlacionadas), mostró que la función \(H\) siempre decrece, y que su mínimo es la distribución de Maxwell. Parecía que había derivado la segunda ley de la mecánica.</p></li>
<li><b class="y">1876 <span>· Loschmidt</span></b><p>Si cada movimiento es reversible, por cada proceso en el que \(H\) disminuye hay otro, invertido, en el que aumenta. ¿Cómo puede una ley irreversible salir de leyes reversibles?</p></li>
<li><b class="y">1877 <span>· interpretación estadística</span></b><p>Boltzmann respondió que el segundo principio es una afirmación de <em>probabilidad</em>: los estados de equilibrio son enormemente más numerosos que los de no equilibrio. Para N partículas el estado «macroscópico» más probable es el que tiene más «microestados», \(W\). La entropía es proporcional a \(\ln W\).</p></li>
<li><b class="y">1896 <span>· Zermelo</span></b><p>Por el teorema de recurrencia de Poincaré (1890), el sistema volverá arbitrariamente cerca del estado inicial. Boltzmann respondió que el tiempo de recurrencia para un gas es tan grande que equivale a nunca.</p></li>
</ol>
<div class="eq key" data-name="Entropía de Boltzmann">\[S=k_B\ln W.\]</div>
<p>La constante \(k_B\) la llamó así Planck en 1900-1901, que fue el primero en escribir la fórmula con ese signo. Boltzmann nunca la escribió en esa forma: usó \(S\propto\ln W\). Pero su nombre quedó grabado en la lápida.</p>
<div class="sim" data-sim="ehrenfest" data-title="La urna de Ehrenfest: de dónde sale la flecha del tiempo"></div>
<div class="sim-guide"><ul>
<li>Con 40 bolas el sistema se mueve hacia 20/20 y fluctúa alrededor. Con 4 bolas vuelve con frecuencia a «todas a la izquierda»; con 100, no se ve volver en la práctica. La entropía crece <em>en media</em> y ocasionalmente decrece.</li>
<li>El tiempo de recurrencia crece como \(2^N\): para un mol de gas (N = 6×10²³) supera cualquier edad del universo. La flecha del tiempo es una cuestión de <em>números grandes</em> y de las condiciones iniciales (un universo que partió con entropía baja, problema que sigue abierto).</li>
</ul></div>
<div class="box rivalidad"><h4>Los anti-atomistas: Mach, Ostwald y la energética</h4><p>Mach (1838-1916) pensaba que la ciencia debe limitarse a describir sensaciones y sus relaciones; los átomos eran, como mucho, un recurso económico. Ostwald (Nobel de Química en 1909) desarrolló la energética: la energía es lo único real y la materia, una manifestación suya. Henri Poincaré, con matices, y Pierre Duhem compartían el escepticismo. No era una tontería: hasta 1905 ninguna medida de la teoría atómica daba resultados que la teoría continua no pudiera dar. Cuando en 1905 Einstein calculó el movimiento browniano con átomos, Mach no respondió; Ostwald escribió en 1909 en el prólogo de su <em>Grundriss der allgemeinen Chemie</em>: «Ahora estoy convencido de que hemos entrado en posesión de pruebas experimentales de la naturaleza discreta de la materia». Boltzmann había muerto tres años antes.</p></div>
</section>

<section>
<h2>Perrin y los granos de gutagamba</h2>
<p>Robert Brown observó en 1827 que los granos de polen suspendidos en agua se agitan sin cesar; descartó que estuvieran vivos al ver lo mismo con polvo de piedra. En 1905 Einstein (capítulo 25) y en 1906 Smoluchowski calcularon que el desplazamiento cuadrático medio crece como \(2Dt\) con \(D=kT/6\pi\eta a\) y que, midiendo \(D\), se obtiene \(k\) y por tanto \(N_A=R/k\). Perrin lo comprobó con granos de gutagamba de tamaño uniforme que seleccionó por centrifugación fraccionada, un trabajo de años. Al mismo tiempo midió la sedimentación: la concentración baja con la altura como una atmósfera en miniatura. Ambos métodos dieron \(N_A\simeq6.5\)–\(7.2\times10^{23}\).</p>
<div class="sim" data-sim="perrin" data-title="Una atmósfera visible: el equilibrio de sedimentación de Perrin"></div>
<div class="sim-guide"><ul>
<li>Con granos de 0.212 µm y 206 kg/m³ de exceso de densidad, la concentración cae a la mitad cada 35 µm: se ve en un microscopio con enfoque a distintas alturas. Con granos mayores, la columna se aplasta.</li>
<li>Con un 10 % de error en la altura el número de Avogadro tiene un 10 % de dispersión, y a pesar de ello la coincidencia de trece métodos distintos (viscosidad, difusión, color del cielo, radiactividad, cuerpo negro) convenció a la comunidad.</li>
</ul></div>
<div class="box epist"><h4>Convergencia de métodos independientes</h4><p>Perrin reunió trece vías independientes que daban el mismo número dentro de ~10 %. El argumento no es una prueba lógica sino de <em>coincidencia improbable</em>: si los átomos no existieran, sería un milagro que métodos físicos totalmente distintos dieran la misma cifra. Es un modelo de <em>consilience</em> (Whewell) y de lo que Hacking llamaría realismo de entidades: creemos en los átomos porque podemos usar sus propiedades en muchos contextos. Nótese que no hace falta que ninguna medida fuera exacta.</p></div>
<div class="sim" data-sim="timeline" data-ch="entropia" data-from="1735" data-to="1915" data-title="Línea de tiempo de la entropía y los átomos"></div>
<div class="sim" data-sim="vidas" data-ids="waterston,clausius,kelvin,maxwell,loschmidt,boltzmann,mach,gibbs,ostwald,zermelo,perrin,smoluchowski,ehrenfest" data-title="El debate atómico: quién pudo conocer a quién"></div>
<div class="sim-guide"><ul>
<li>Boltzmann (1844-1906) coincidió con Mach y con Loschmidt en Viena, y con Ostwald en los congresos. No llegó a conocer la medida de Perrin, ni la de Einstein en su plenitud.</li>
<li>Elija a Ehrenfest: nació cuando Boltzmann tenía 36 años; se doctoró con él en Viena (1904) y continuó su obra en Leiden. Ambos murieron por suicidio (Ehrenfest en 1933); atribuir esas muertes a una teoría sería un error y una falta de respeto: dependían de causas personales y de la salud.</li>
</ul></div>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Con \(T_0=3900\) K, \(G=0.0365\) K/m y \(\kappa=1.18\times10^{-6}\) m²/s, calcule la edad según Kelvin. ¿Cuánto cambia si el gradiente real efectivo fuese la quinta parte?
<details><summary>Respuesta</summary><p>\(t=T_0^2/(\pi\kappa G^2)=3.08\times10^{15}\) s = 98 Ma. Con \(G\) cinco veces menor, \(t\) es 25 veces mayor: 2 440 Ma.</p></details></li>
<li><span class="lvl">Básico</span>Con 20 bolas, ¿cuántos microestados tiene el macroestado «10 a la izquierda»? ¿Y el macroestado «todas a la izquierda»?
<details><summary>Respuesta</summary><p>\(\binom{20}{10}=184\,756\); \(\binom{20}{20}=1\). Cociente: 184 756.</p></details></li>
<li><span class="lvl">Intermedio</span>Con granos de \(r=0.212\) µm, \(\Delta\rho=206\) kg/m³ a 293 K, calcule la altura de escala y el número de Avogadro que se obtendría si midiera \(h_s=51\) µm.
<details><summary>Respuesta</summary><p>\(m'=\tfrac43\pi r^3\Delta\rho=8.2\times10^{-18}\) kg; \(h_s=kT/m'g=50\) µm; \(N_A=RT/(m'gh_s)=6.0\times10^{23}\).</p></details></li>
<li><span class="lvl">Intermedio</span>¿Cuánta energía disipa como mínimo el borrado de 1 GB (8×10⁹ bits) a 300 K, según Landauer?
<details><summary>Respuesta</summary><p>\(8\times10^9\times2.87\times10^{-21}=2.3\times10^{-11}\) J. Los ordenadores actuales disipan miles de millones de veces más.</p></details></li>
<li><span class="lvl">Avanzado</span>Compare los argumentos de Boltzmann sobre la reversibilidad (Loschmidt) y la recurrencia (Zermelo). ¿Qué hipótesis añade cada respuesta y cuál es la parte aún abierta?
<details><summary>Respuesta</summary><p>Loschmidt: Boltzmann responde que los estados de baja entropía son improbables; el teorema H es estadístico, no determinista. Zermelo: los tiempos de recurrencia son astronómicos. Queda la pregunta del origen de la baja entropía inicial del universo (Penrose, «hipótesis de Weyl»): la flecha del tiempo se explica por un pasado especial, no por las leyes dinámicas.</p></details></li>
</ol>
