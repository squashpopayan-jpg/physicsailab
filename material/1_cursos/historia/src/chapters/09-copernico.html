<p class="lead">El 24 de mayo de 1543, según la tradición, un canónigo anciano de la catedral de Frombork, en la costa báltica de Polonia, murió después de recibir, ya sin conocimiento, el primer ejemplar impreso de su libro. Nicolás Copérnico había tardado treinta años en decidirse a publicar. Su obra no contenía nuevos datos ni predecía mejor que la de Ptolomeo; proponía que el Sol, y no la Tierra, es el centro de los movimientos planetarios, y tenía a cambio una virtud inesperada: ordenaba el cielo, fijaba por primera vez las distancias relativas de los planetas y explicaba por qué Marte, Júpiter y Saturno retroceden justo cuando están en oposición. Treinta años después, un noble danés con una prótesis de metal en la nariz iba a mirar al cielo con la mejor precisión que el ojo humano permite, y a destruir la distinción entre Tierra y cielo.</p>

<div><b>Pregunta</b>¿Cuál es el orden real del cielo, y cómo saberlo?</div>

<section>
<h2>El mundo en que nace Copérnico</h2>
<div class="box contexto"><h4>Imprenta, humanismo y un planeta ampliado</h4><p>Hacia 1450 Gutenberg imprimió en Maguncia con tipos móviles. En 1500 había en Europa unas mil imprentas y unos veinte millones de libros. Los textos dejaron de depender de copistas: las erratas se corregían en la siguiente edición, y la <em>misma</em> tabla, el mismo mapa, el mismo diagrama podía verse en Cracovia y en Lisboa. La caída de Constantinopla (1453) trajo a Italia manuscritos y sabios griegos; Regiomontano (1436-1476) tradujo el <em>Almagesto</em> con su <em>Epítome</em> (1496) y mostró que Ptolomeo tenía problemas (la distancia de la Luna varía el doble de lo observado). Colón llegó a América en 1492 (con una Tierra más pequeña de lo real, y los eruditos tenían razón en objetar); Magallanes y Elcano dieron la vuelta al mundo (1519-1522). Tras Lutero (1517), Europa se partió en confesiones, y cada una controlaba a sus universidades y censores. Cualquier hipótesis sobre el cielo caía en medio de una disputa de poder.</p></div>
<div class="people">
<div class="persona"><b>Nicolás Copérnico</b><small>1473 – 1543 · Toruń, Cracovia, Bolonia, Padua, Frombork</small><p>Sobrino de un obispo; estudió astronomía, medicina y derecho canónico. Canónigo de Warmia, administrador, médico y economista (escribió sobre reforma monetaria). Observó poco: unas sesenta observaciones propias.</p></div>
<div class="persona"><b>Georg Joachim Rheticus</b><small>1514 – 1576 · Wittenberg, Núremberg, Cracovia</small><p>Joven profesor luterano que visitó a Copérnico en 1539 y le dedicó dos años. Publicó la <em>Narratio prima</em> (1540), resumen del sistema, y logró convencerlo de imprimir el libro.</p></div>
<div class="persona"><b>Andreas Osiander</b><small>1498 – 1552 · Núremberg</small><p>Teólogo luterano que supervisó la impresión y añadió, sin firmarlo, un prefacio que presenta la teoría como mera hipótesis de cálculo.</p></div>
<div class="persona"><b>Tycho Brahe</b><small>1546 – 1601 · Knutstorp, Hven, Praga</small><p>Noble danés, el mayor observador anterior al telescopio. Perdió parte de la nariz en un duelo de estudiante (1566); la reemplazó, dicen, con una prótesis metálica.</p></div>
<div class="persona"><b>Sophie Brahe</b><small>1556 – 1643 · Hven, Dinamarca</small><p>Hermana de Tycho. Ayudó en las observaciones, estudió astronomía y química, y colaboró en genealogías; gran parte de su vida científica queda en la sombra.</p></div>
<div class="persona"><b>Giordano Bruno</b><small>1548 – 1600 · Nola, París, Londres, Roma</small><p>Dominico filósofo. Defendió un universo infinito con innumerables mundos. Quemado en Roma el 17 de febrero de 1600.</p></div>
<div class="persona"><b>Thomas Digges</b><small>1546 – 1595 · Inglaterra</small><p>Matemático inglés. En 1576 publicó la primera exposición del sistema copernicano en inglés, con las estrellas distribuidas en un espacio infinito.</p></div>
</div>
</section>

<section>
<h2>Copérnico y la revolución que no fue inmediata</h2>
<p>Copérnico estudió en Cracovia (1491-1495), donde aprendió astronomía ptolemaica, y luego en Bolonia, Padua y Ferrara. En Italia se enteró de los textos griegos sobre ideas heliocéntricas (Cicerón y Plutarco lo mencionan: Aristarco, Filolao). Hacia 1514 hizo circular un manuscrito de unas veinte páginas, el <em>Commentariolus</em>, con siete postulados: el centro de la Tierra no es el centro del universo; el movimiento aparente del Sol se debe a la Tierra; la rotación diaria explica el movimiento del cielo; los movimientos retrógrados de los planetas son aparentes; y la distancia a las estrellas es inmensa comparada con el radio de la órbita terrestre.</p>
<ol class="chain">
<li><b class="y">El problema <span>· la herencia de Ptolomeo</span></b><p>El ecuante violaba el principio del movimiento uniforme sobre círculos: «un monstruo», dice Copérnico. Además los astrónomos no se ponían de acuerdo en el orden de los planetas, y los tamaños de las órbitas no tenían significado.</p></li>
<li><b class="y">La clave <span>· las retrogradaciones</span></b><p>Si la Tierra gira alrededor del Sol más rápido que Marte, lo adelanta y lo ve retroceder, como un coche que adelanta a otro. Los epiciclos de Ptolomeo, cuyo periodo en todos los planetas superiores es de un año, son un reflejo del movimiento de la Tierra. Con la Tierra moviéndose se eliminan tantos epiciclos como planetas superiores.</p></li>
<li><b class="y">La armonía <span>· el orden y la escala</span></b><p>El tiempo que tarda cada planeta en dar la vuelta ordena sus distancias: cuanto más lento, más lejos. Y las observaciones de las elongaciones y de las oposiciones permiten calcular los radios relativos de las órbitas.</p></li>
<li><b class="y">La obra <span>· 1543</span></b><p>En <em>De revolutionibus orbium coelestium</em> (seis libros) deduce todo con círculos, epiciclos y excéntricas. Para ajustar el sistema, Copérnico necesitaba unos 34 círculos (el número que da él mismo), un poco menos que Ptolomeo, pero no con una precisión mayor. El Sol no está exactamente en el centro de las órbitas.</p></li>
</ol>
<div class="eq key" data-name="La escala copernicana">\[a_{\text{inferior}}=\operatorname{sen}\varepsilon_{\max},\qquad a_{\text{superior}}=\frac{1}{\cos\varphi},\quad\varphi=2\pi t\left(\frac1{P_\oplus}-\frac1{P}\right).\]</div>
<div class="sim" data-sim="escala-copernico" data-title="Medir el sistema solar con elongaciones y cuadraturas"></div>
<div class="sim-guide"><ul>
<li>Con la mayor elongación de Venus (46.3°) se obtiene 0.723 UA, la cifra moderna. Para Marte basta cronometrar los 106 días entre oposición y cuadratura: 1.52 UA.</li>
<li>El resultado es independiente de la unidad: en el sistema de Copérnico la <em>forma</em> del conjunto queda fijada. Es un argumento de simplicidad y de armonía que ningún astrónomo ptolemaico podía igualar, porque su deferente y su epiciclo se podían escalar a voluntad.</li>
</ul></div>
<div class="box epist"><h4>Una teoría con virtudes no empíricas</h4><p>Copérnico no ganó con datos nuevos, sino por <em>virtudes teóricas</em>: unidad, orden, armonía, determinación de parámetros. Kuhn (<em>La revolución copernicana</em>, 1957) subraya que el sistema no era más simple (necesitaba unos 34 círculos) ni más exacto; lo que tenía es una coherencia interna que los defensores de Ptolomeo no sabían explicar. Esa clase de argumento, que apela a la <em>estética</em> y la <em>unificación</em>, es frecuente en la física: Newton (gravitación), Maxwell (la luz como onda electromagnética), Einstein (la relatividad general). No son pruebas, pero orientan a una comunidad cuando las pruebas aún no existen.</p></div>
</section>

<section>
<h2>El prefacio de Osiander y la pregunta por la verdad</h2>
<p>Copérnico murió dejando su libro en manos de Rheticus, que se fue a Leipzig y encargó la supervisión de la impresión a Osiander. Este añadió una advertencia «al lector» sin firmar: las hipótesis de los astrónomos «no necesitan ser verdaderas, ni siquiera verosímiles; basta con que permitan calcular». Era una forma de proteger el libro de objeciones teológicas, convirtiendo la tesis del movimiento de la Tierra en un artificio matemático, y contradecía lo que Copérnico pensaba: en el libro I defiende la realidad de ese movimiento con argumentos físicos. Durante décadas los lectores creyeron que el prefacio era del autor; Kepler lo desenmascaró en 1609.</p>
<div class="box fuente"><h4>Osiander, «Al lector, sobre las hipótesis de esta obra» (1543)</h4><blockquote>Pues no hace falta que estas hipótesis sean verdaderas, ni siquiera verosímiles; basta con que el cálculo basado en ellas concuerde con las observaciones.</blockquote><p>Es la postura llamada <em>instrumentalismo</em>: una teoría es un instrumento de cálculo, no una descripción de la realidad. Frente a ella está el <em>realismo</em>: la teoría afirma cómo es el mundo. El debate reaparece con Galileo y el cardenal Belarmino (1615-1616), con Mach y Boltzmann (átomos), y con la interpretación de la mecánica cuántica.</p></div>
<div class="box leyenda"><h4>«Copérnico no se atrevió a publicar por miedo a la Iglesia»</h4><p>La razón no fue esa. El papa Clemente VII escuchó con interés una exposición de la teoría en 1533, y el cardenal Schönberg le escribió en 1536 pidiendo copia. Copérnico dudó por perfeccionismo y miedo al ridículo entre los astrónomos («el desprecio que merecería mi novedad»). Fueron los protestantes quienes reaccionaron primero: Lutero (según unas Charlas de sobremesa, 1539) llamó «necio» al astrónomo que quería «invertir toda la ciencia de la astronomía»; Melanchton atacó la teoría. La Iglesia católica no condenó el libro hasta 1616, setenta y tres años después, y solo con una corrección «<em>donec corrigatur</em>» (hasta que se corrija).</p></div>
<div class="sim" data-sim="tres-sistemas" data-title="Ptolomeo, Copérnico y Tycho: tres sistemas que dan el mismo cielo"></div>
<div class="sim-guide"><ul>
<li>Mueva el tiempo: la dirección Tierra→Marte (línea roja) es idéntica en los tres paneles; la diferencia máxima es de orden \(10^{-13}\) grados, error numérico.</li>
<li>En el sistema de Tycho (1588) la Tierra está quieta, el Sol y la Luna giran a su alrededor y los planetas giran en torno al Sol. Es <em>geométricamente equivalente</em> al de Copérnico para los datos de la época, y evita tanto el movimiento de la Tierra como la paralaje estelar. Fue la opción de la mayoría de los astrónomos jesuitas tras 1610.</li>
</ul></div>
</section>

<section>
<h2>Tycho Brahe: el cielo medido</h2>
<p>Tycho nació noble en Dinamarca y fue criado por un tío rico. Con 16 años presenció un eclipse parcial predicho con días de error, y decidió dedicarse a corregir las tablas. En 1566 perdió parte de la nariz en un duelo con otro estudiante sobre quién era mejor matemático, y desde entonces llevó una prótesis (la exhumación de 1901 halló restos verdosos de cobre alrededor del orificio, así que seguramente era de latón o cobre y no de oro y plata como contaban). Lo que más importa es lo que mejoró: la precisión.</p>
<ol class="chain">
<li><b class="y">1572 <span>· la nueva estrella</span></b><p>El 11 de noviembre de 1572 Tycho vio en Casiopea un astro más brillante que Venus que no había estado allí antes. Midió su posición con respecto a las estrellas vecinas a distintas horas de la noche (con un sextante grande): no mostraba paralaje diurna medible. Por tanto estaba mucho más lejos que la Luna, en el reino de «lo eterno e incorruptible». <em>De nova stella</em> (1573). Hoy sabemos que era una supernova (SN 1572), a unos 7500 años luz.</p></li>
<li><b class="y">1576 <span>· Uraniborg</span></b><p>Federico II de Dinamarca le cedió la isla de Hven con rentas y le financió un observatorio con taller, imprenta, laboratorio de química y un molino de papel. Los instrumentos (cuadrantes murales, esferas armilares con dos metros de radio) dieron medidas de un minuto de arco o menos, sin telescopio.</p></li>
<li><b class="y">1577 <span>· el cometa</span></b><p>Observó el cometa de 1577 y calculó su paralaje: menor que la de la Luna, así que estaba a más de cuatro veces su distancia. Y su trayectoria atravesaba las órbitas de los planetas: las esferas cristalinas de Aristóteles no podían existir como sólidos.</p></li>
<li><b class="y">1588 <span>· su sistema</span></b><p>Propuso el sistema geo-heliocéntrico: la Tierra quieta en el centro; el Sol y la Luna giran a su alrededor; los cinco planetas giran en torno al Sol.</p></li>
<li><b class="y">1599-1601 <span>· Praga</span></b><p>Tras la muerte de Federico II y el desacuerdo con su sucesor, Tycho dejó Hven y pasó a ser matemático imperial de Rodolfo II en Praga. Allí recibió a un joven calculista, Kepler, en 1600. Murió el 24 de octubre de 1601.</p></li>
</ol>
<div class="sim" data-sim="paralaje" data-title="Cuánto mide el cielo: la paralaje de la Luna, la nova, el cometa y las estrellas"></div>
<div class="sim-guide"><ul>
<li>Con la nova de 1572 y una paralaje menor que 1′, la distancia mínima es de 3 400 radios terrestres: unas 57 veces la distancia a la Luna. Cualquier cosa más lejos de eso ya no era «sublunar».</li>
<li>La paralaje anual de la estrella más cercana es de solo 0.77″: es 80 veces menor que la precisión de Tycho. Por eso la ausencia de paralaje no refutaba a Copérnico: lo que se necesitaba eran estrellas lejanas y mejores instrumentos (Bessel, 1838).</li>
</ul></div>
<div class="box contexto"><h4>Un señor feudal y su isla</h4><p>Tycho no fue solo un sabio: era señor de Hven, con derechos de corvea sobre sus campesinos, que debían trabajar para él días enteros; los documentos y las quejas ante el rey muestran un trato duro y litigios. El observatorio costó, según se estima, hasta un 1 % del presupuesto anual del reino. Cuando el rey Cristián IV, ya mayor, le recortó el apoyo, y los nobles de la corte, que consideraban inútil esa fortuna, presionaron, Tycho se fue. Un retrato de las condiciones de la ciencia: los grandes instrumentos exigen grandes patrocinios, y los patronos no son eternos.</p></div>
<div class="box leyenda"><h4>La muerte de Tycho</h4><p>Se dice que Tycho murió porque, durante un banquete en Praga, se aguantó las ganas de ir al baño por cortesía y se le reventó la vejiga. El relato proviene de Kepler. En 1901 y en 2010 se exhumó su cuerpo: el análisis no halló mercurio en cantidad letal (se había sospechado un asesinato, incluso por parte de Kepler), y la causa más probable parece ser una infección urinaria. Los detalles de la anécdota no se pueden confirmar.</p></div>
</section>

<section>
<h2>El cielo se vuelve infinito: Bruno</h2>
<p>Giordano Bruno defendió que si el espacio es infinito y la creación perfecta, hay infinitos mundos como el nuestro. Pasó años errante (Ginebra, París, Londres, Alemania), volvió a Venecia por invitación de un noble que lo denunció a la Inquisición; fue juzgado en Roma entre 1593 y 1600 y quemado en el Campo de' Fiori el 17 de febrero de 1600. La idea de que murió «por defender a Copérnico» es una simplificación: las acusaciones eran teológicas (la Trinidad, la divinidad de Cristo, la transubstanciación, la reencarnación, los mundos múltiples), y su cosmología era más mística que científica. Pero su caso mostró que la teología y la cosmología estaban entrelazadas, y que la discusión sobre el cielo tenía un precio.</p>
<div class="sim" data-sim="timeline" data-ch="copernico" data-from="1430" data-to="1650" data-title="Línea de tiempo del siglo de Copérnico y Tycho"></div>
<div class="sim" data-sim="vidas" data-ids="regiomontano,novara,copernico,lutero,osiander,rheticus,tycho,sophie,bruno,digges,maestlin" data-title="De Regiomontano a Tycho: quién pudo conocer a quién"></div>
<div class="sim-guide"><ul>
<li>Rheticus pudo conocer a Copérnico (visitó Frombork en 1539) pero no a Tycho; Tycho no conoció a Copérnico. Lo que recibió fueron <em>libros</em>: hojeó el <em>De revolutionibus</em> desde joven y lo anotó.</li>
<li>Michael Maestlin (1550-1631), el profesor de Kepler en Tubinga, enseñaba Ptolomeo en el curso oficial y Copérnico en privado.</li>
</ul></div>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>La mayor elongación de Mercurio observada es 23° y la de Venus 46°. Calcule sus radios orbitales (UA).
<details><summary>Respuesta</summary><p>\(a_M=\operatorname{sen}23^\circ=0.391\); \(a_V=\operatorname{sen}46^\circ=0.719\) (modernos 0.387 y 0.723).</p></details></li>
<li><span class="lvl">Básico</span>Si Marte está en cuadratura 106 días después de la oposición, calcule su radio orbital con \(P_\oplus=365.26\) d y \(P_M=686.98\) d.
<details><summary>Respuesta</summary><p>\(\varphi=360^\circ\times106\times(1/365.26-1/686.98)=48.9^\circ\); \(a=1/\cos\varphi=1.52\) UA.</p></details></li>
<li><span class="lvl">Intermedio</span>Si la paralaje de una estrella fuese 0.1″, ¿qué distancia tiene (UA y años luz)?
<details><summary>Respuesta</summary><p>\(d=1\text{ UA}/\tan0.1''=2.06\times10^6\) UA = 32.6 años luz = 10 pársecs.</p></details></li>
<li><span class="lvl">Intermedio</span>Tycho midió posiciones con 1′ de precisión. ¿Cuál es la menor distancia a la que habría detectado un objeto por paralaje diurna (línea de base de un radio terrestre)? ¿Y por paralaje anual (1 UA) hasta cuántas UA?
<details><summary>Respuesta</summary><p>Diurna: \(6371\,\text{km}/\tan1'=2.2\times10^7\) km = 3438 radios terrestres. Anual: \(1\text{ UA}/\tan1'=3438\) UA (0.054 años luz): las estrellas están a más de cien millones de UA, de modo que no había nada que detectar.</p></details></li>
<li><span class="lvl">Avanzado</span>¿Qué experimento o argumento decidiría entre el sistema de Copérnico y el de Tycho antes de 1700? ¿Y después?
<details><summary>Respuesta</summary><p>Antes de 1700 ninguna observación astronómica decide entre ambos: son equivalentes geométricamente. La aberración de la luz (Bradley, 1728) y la paralaje estelar (1838) exigen movimiento de la Tierra; la mecánica de Newton (1687) favorecía que el Sol, mucho más masivo, no girara en torno a la Tierra; y el péndulo de Foucault (1851) mostró la rotación terrestre.</p></details></li>
</ol>
