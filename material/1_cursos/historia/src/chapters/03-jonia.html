<section>
<h2>Por qué en Jonia y por qué entonces</h2>
<p>En el siglo VI a. C., la costa occidental de Asia Menor (la Jonia) era un cruce de rutas: allí llegaban los comerciantes de Egipto, Lidia, Fenicia y Persia, y con ellos el saber práctico de Babilonia y del Nilo. Mileto, la mayor ciudad, vivía del comercio marítimo y de la lana; sus colonias bordeaban el mar Negro. En Lidia (Creso) se acuñaron las primeras monedas, un invento que hace pensar en la «medida» y la equivalencia.</p>
<div class="box contexto"><h4>Una ciudad sin casta sacerdotal</h4><p>En Egipto y Babilonia el saber estaba en manos de sacerdotes y escribas, que dependían del templo. En las ciudades griegas no hubo un clero con monopolio de la verdad: los poetas (Homero, Hesíodo) eran la «teología» común, pero no una Iglesia. Las decisiones se discutían en la plaza y, en algunas polis, el voto de los ciudadanos libres contaba. Esa cultura de argumentar en público, de aceptar un argumento porque convence y no porque lo dice una autoridad, es la condición social del nuevo modo de pensar. Hay que añadir que la vida de ocio de los filósofos descansaba sobre el trabajo de esclavos y mujeres sin voz política: la «libertad» de pensar era la de unos pocos.</p></div>
<p>Los historiadores llaman <span class="term">physis</span> (naturaleza) a lo que los jonios inventaron: la idea de que el mundo tiene un orden y unos principios propios, que pueden conocerse mediante la razón sin recurrir a la voluntad caprichosa de los dioses. No eran ateos; eran, más bien, indiferentes a los dioses como explicación.</p>
<div class="people">
<div class="persona"><b>Tales de Mileto</b><small>c. 624 – c. 546 a. C. · Mileto</small><p>Considerado el primero de los Siete Sabios. No conservamos nada escrito. Propuso que todo procede del agua y que la Tierra flota sobre ella. Se le atribuye geometría traída de Egipto: midió la altura de las pirámides por la sombra.</p></div>
<div class="persona"><b>Anaximandro</b><small>c. 610 – c. 546 a. C. · Mileto</small><p>Discípulo de Tales. Su principio es el <em>apeiron</em> (lo ilimitado). Dibujó el primer mapa del mundo conocido, instaló un gnomon y sostuvo que la Tierra permanece suspendida sin apoyo porque está a igual distancia de todo.</p></div>
<div class="persona"><b>Anaxímenes</b><small>c. 585 – c. 525 a. C. · Mileto</small><p>Su principio es el aire; al enrarecerse da fuego y al condensarse viento, nube, agua, tierra y piedra: cambios cuantitativos que producen diferencias cualitativas.</p></div>
<div class="persona"><b>Heráclito</b><small>c. 535 – c. 475 a. C. · Éfeso</small><p>«Lo oscuro». Todo fluye; el fuego es símbolo del cambio; hay un <em>logos</em> que ordena el devenir. Se le atribuye «no se baña uno dos veces en el mismo río».</p></div>
<div class="persona"><b>Parménides</b><small>c. 515 – c. 450 a. C. · Elea</small><p>Argumentó que el ser no puede cambiar ni dividirse, porque pensar «lo que no es» es contradictorio. El movimiento y la pluralidad serían apariencias. Un reto lógico para todos sus sucesores.</p></div>
<div class="persona"><b>Zenón de Elea</b><small>c. 490 – c. 430 a. C. · Elea</small><p>Discípulo de Parménides. Sus paradojas (Aquiles y la tortuga, la flecha) pretendían probar que el movimiento es contradictorio. Aristóteles le atribuyó el origen de la dialéctica.</p></div>
<div class="persona"><b>Pitágoras</b><small>c. 570 – c. 495 a. C. · Samos, Crotona</small><p>Fundó una hermandad religiosa y matemática en el sur de Italia. «Todo es número». Los datos sobre su vida están rodeados de leyenda; casi nada de lo atribuido es seguro.</p></div>
<div class="persona"><b>Empédocles</b><small>c. 494 – c. 434 a. C. · Agrigento</small><p>Poeta y médico. Cuatro «raíces» (tierra, agua, aire, fuego) movidas por Amor y Discordia. Mostró con una clepsidra que el aire es materia.</p></div>
<div class="persona"><b>Anaxágoras</b><small>c. 500 – c. 428 a. C. · Clazómenas, Atenas</small><p>Trajo la filosofía a Atenas. Explicó los eclipses y dijo que el Sol era una piedra incandescente. Acusado de impiedad, se exilió en Lámpsaco.</p></div>
<div class="persona"><b>Leucipo y Demócrito</b><small>c. 460 – c. 370 a. C. · Abdera</small><p>Los fundadores del atomismo: átomos indivisibles en un vacío infinito. De Leucipo casi no sabemos nada; de Demócrito, solo fragmentos.</p></div>
</div>
</section>

<section>
<h2>Tales y la búsqueda del principio</h2>
<p>Ni una línea de Tales ha llegado hasta nosotros; todo lo sabemos por autores que escriben siglos después (Aristóteles, Diógenes Laercio, Plutarco). Eso exige cautela: es un caso extremo de lo que en historia de la ciencia se llama «testimonio doxográfico». Lo que se dice de Tales es:</p>
<ol class="chain">
<li><b class="y">Principio único <span>· siglo VI a. C.</span></b><p>El agua sería el origen de todas las cosas (Aristóteles, <em>Metafísica</em> I). Importa menos la respuesta que la <em>pregunta</em>: ¿cuál es la sustancia fundamental de la que todo deriva por transformación? Es la primera formulación de un programa de unificación que llega al Modelo Estándar.</p></li>
<li><b class="y">Magnetismo y ámbar <span>· siglo VI a. C.</span></b><p>Aristóteles cuenta que Tales atribuía «alma» a la piedra imán y al ámbar frotado, porque mueven otras cosas. El ámbar (<em>élektron</em>) dará su nombre a la electricidad (capítulos 12 y 19).</p></li>
<li><b class="y">Geometría con la sombra <span>· siglo VI a. C.</span></b><p>Se le atribuyen los primeros teoremas (el ángulo inscrito en una semicircunferencia es recto, los ángulos de la base de un triángulo isósceles son iguales) y la medida de la altura de una pirámide: se mide la sombra cuando la sombra de un bastón iguala su altura. Aplicar semejanza de triángulos al mundo es la clave de lo que hará Eratóstenes en el capítulo 5.</p></li>
<li><b class="y">El eclipse del 585 a. C.</b><p>Heródoto cuenta que durante una batalla entre lidios y medos, junto al río Halis, «el día se hizo noche»; Tales habría predicho el año. Los cálculos modernos señalan el eclipse total del 28 de mayo de 585 a. C.. La predicción de un año, no de un día ni de un lugar, bien pudo hacerse con el Saros babilonio (capítulo 2), si Tales lo conoció. Muchos historiadores dudan de que pudiera predecirlo.</p></li>
</ol>
<div class="sim" data-sim="sombra-tales" data-title="Medir una pirámide con su sombra"></div>
<div class="sim-guide"><ul>
<li>A 45° de altura solar la sombra de una persona de 1.80 m mide 1.80 m. En ese momento, la sombra de la pirámide (medida desde el centro de la base) iguala su altura: 146.6 m.</li>
<li>Con otro ángulo hay que aplicar semejanza de triángulos: \(H/s_{piramide}=h/s_{persona}\). Introduzca un error de unos metros en la marca de la punta: la altura se desvía menos del 2 %.</li>
</ul></div>
<div class="box leyenda"><h4>Tales cae al pozo, Tales predice el eclipse</h4><p>El pozo es una anécdota de Platón (<em>Teeteto</em>, siglo IV a. C.) que usa para burlarse de los filósofos que miran al cielo; no es historia sino filosofía en forma de cuento. La predicción del eclipse es posible pero incierta: ni Heródoto dice cómo, ni se conoce un método griego antes de Hiparco para predecir un eclipse de un lugar concreto. Es un buen ejemplo de la frecuencia con que se atribuye a los fundadores lo que se admira después.</p></div>
</section>

<section>
<h2>Anaximandro: una Tierra que flota sin apoyo</h2>
<p>La ruptura más importante la hizo Anaximandro. Si Tales ponía la Tierra sobre el agua (y entonces: ¿sobre qué se apoya el agua?), Anaximandro razonó: la Tierra es un cilindro corto, suspendido en el centro del universo, y no cae <em>porque no hay razón para que caiga en una dirección más que en otra</em>. Es el primer argumento de simetría de la física, una versión antigua del «principio de razón suficiente» (Leibniz) con el que se resolverán más tarde muchos problemas, y la primera vez que un modelo cosmológico prescinde de un soporte físico.</p>
<p>Anaximandro describió el Sol, la Luna y las estrellas como «ruedas» de fuego con aberturas, una imagen que ya no es mítica, pues sugiere un mecanismo. Defendía además un origen natural de los seres vivos a partir de lo húmedo (el hombre procedería de animales parecidos a peces). No hay observación ni experimento; hay una constricción lógica entre lo que se quiere explicar y lo que puede dar cuenta de ello. Es el estilo del primer pensamiento físico: modelos <em>posibles</em>, defendidos con argumentos.</p>
<div class="box epist"><h4>Del mito a la crítica</h4><p>Los mitos no se discuten; se heredan. Los modelos jonios se discuten, y cada discípulo corrige al maestro: Anaxímenes sustituye el <em>apeiron</em> por el aire. Karl Popper vio en ese gesto, el de la <em>tradición crítica</em>, la verdadera novedad: una escuela en la que el discípulo aprende a refutar al maestro. Si un conocimiento puede mejorarse criticándolo, hay progreso posible.</p></div>
</section>

<section>
<h2>El cambio y lo permanente: Heráclito, Parménides, Zenón</h2>
<p>¿Es el cambio la realidad fundamental, o solo apariencia? Heráclito sostenía lo primero: «todo fluye», la unidad del mundo es la tensión de contrarios, y el fuego es su emblema. Parménides contestó con el primer argumento puramente lógico de la filosofía natural: «lo que es, es; lo que no es, no es». Si algo cambia, lo que antes no era pasa a ser; pero de «lo que no es» nada puede salir. Por tanto el ser es uno, eterno e inmóvil, y el cambio es una ilusión de los sentidos.</p>
<p>Zenón, su discípulo, defendió esa tesis con paradojas del movimiento. En la de Aquiles y la tortuga, Aquiles, diez veces más veloz, da cien metros de ventaja a la tortuga. Cuando llega adonde estaba, la tortuga está diez metros más adelante; cuando recorre esos diez, la tortuga ha avanzado uno; y así sin fin: nunca la alcanzaría. La paradoja muestra que la intuición de que una suma de infinitos pasos tiene que ser infinita está equivocada: los tiempos \(10, 1, 0.1,\dots\) segundos suman \(100/9\) s.</p>
<div class="eq key" data-name="Suma de la serie geométrica">\[t=\frac{d}{v_a}\sum_{n=0}^{\infty}\left(\frac{v_t}{v_a}\right)^n=\frac{d}{v_a}\cdot\frac{1}{1-v_t/v_a}=\frac{d}{v_a-v_t}.\]</div>
<div class="sim" data-sim="zenon" data-title="Aquiles y la tortuga: etapas que suman un tiempo finito"></div>
<div class="sim-guide"><ul>
<li>Aumente las etapas de Zenón: el tiempo acumulado se acerca al instante exacto del alcance, que es la solución «\(d/(v_a-v_t)\)» de la cinemática más sencilla.</li>
<li>Cambie la tortuga a una velocidad cercana a la de Aquiles: la serie converge cada vez más lentamente, pero converge mientras \(v_t&lt;v_a\).</li>
</ul></div>
<div class="box epist"><h4>La física pasa por la lógica</h4><p>Las paradojas no se resolvieron con experimentos, porque nadie duda de que Aquiles alcanza a la tortuga. Se tardó 2 300 años en tener una teoría de las series, límites y del continuo que explicara <em>por qué</em> el razonamiento falla. Un buen argumento puede ser una molestia más útil que una observación: obliga a revisar las premisas que dábamos por obvias.</p></div>
</section>

<section>
<h2>Pitágoras y la música: la primera ley física cuantitativa</h2>
<p>Pitágoras (o, con más cautela, los pitagóricos) descubrió que los intervalos musicales consonantes corresponden a razones de números enteros pequeños entre las longitudes de una cuerda: la octava es 2:1, la quinta 3:2, la cuarta 4:3. Esto significa que la <em>cualidad</em> del sonido (agradable o no) se traduce en una <em>cantidad</em> medible. Fue una revelación: si la música, un asunto de sensaciones, obedecía a números, quizá todo el cosmos lo hiciera. «Todo es número» no era una idea mística sin más; era una extrapolación de un caso real, y es la semilla de la convicción de Galileo («el libro de la naturaleza está escrito en lenguaje matemático»).</p>
<ol class="chain">
<li><b class="y">Una cuerda tensa <span>· siglo VI a. C.</span></b><p>Se usa un monocordio: una sola cuerda con un puente móvil. Al pulsarla entera y luego la mitad, suena la misma nota una octava más alta.</p></li>
<li><b class="y">Razones simples <span>· siglo VI a. C.</span></b><p>Con \(2/3\) de la cuerda suena una quinta; con \(3/4\), una cuarta. Las consonancias son aquellas con razones de números hasta el 4.</p></li>
<li><b class="y">Ley de la cuerda <span>· Mersenne 1636; Galileo 1638</span></b><p>La frecuencia es inversa a la longitud, y crece como la raíz de la tensión: \(f=\tfrac{1}{2L}\sqrt{T/\mu}\). Esta ley la formularán Mersenne y Galileo, dos mil años después, con ayuda de la nueva física.</p></li>
</ol>
<div class="sim" data-sim="monocordio" data-title="El monocordio: la música como razón de números"></div>
<div class="sim-guide"><ul>
<li>Pulse «Hacer sonar» con el puente en la mitad (octava), en 2/3 (quinta) y en 3/4 (cuarta). Después pruebe una posición intermedia como 0.60 y compare.</li>
<li>La lectura de cents mide el intervalo: la octava son 1200 y la quinta justa, 701.96. Doce quintas apiladas sobrepasan siete octavas en 23.46 cents (la «coma pitagórica», \(1.5^{12}/2^7=1.01364\)); ese desajuste dará lugar a siglos de discusiones sobre afinación.</li>
</ul></div>
<div class="box leyenda"><h4>Los martillos del herrero</h4><p>Se cuenta (Nicómaco, siglo II d. C.) que Pitágoras pasó junto a una herrería y notó que los martillos sonaban en octava, quinta y cuarta, y que sus pesos guardaban razones 2:1, 3:2, 4:3. Al llegar a casa, lo comprobó colgando pesos de cuerdas. Es falso: el tono de un martillo contra un yunque no cambia de ese modo con el peso, y colgar pesos a una cuerda da frecuencias que van con la <em>raíz</em> del peso, no con el peso. Galileo ya lo señaló en 1638. Lo que sí es cierto, y verificable hoy, es la ley de la longitud: la leyenda del herrero le puso dramatismo a un dato real.</p></div>
<div class="box contexto"><h4>Una hermandad con secretos</h4><p>En Crotona, los pitagóricos formaron una comunidad religiosa con reglas (no comer habas, no recoger lo caído) y secreto de doctrina. Sufrieron persecuciones políticas hacia 510 y 450 a. C., y una tradición atribuye a Hipaso de Metaponto una muerte por ahogamiento por haber revelado la irracionalidad de \(\sqrt2\). Ese relato es posterior y dudoso, pero ilustra que el descubrimiento de que la diagonal del cuadrado no es conmensurable con su lado quebraba la tesis «todo es razón de enteros».</p></div>
</section>

<section>
<h2>Empédocles, Anaxágoras y el pluralismo</h2>
<p>Tras el reto de Parménides, varios pensadores intentaron conservar el cambio sin que nada salga de la nada: lo que cambia son las <em>mezclas</em> de sustancias que no cambian. Empédocles propuso cuatro raíces (tierra, agua, aire, fuego), unidas y separadas por dos fuerzas (Amor y Discordia). Es la primera teoría con elementos y fuerzas; dominará hasta el siglo XVII. Ilustró que el aire es un cuerpo: al sumergir en agua una clepsidra (un recipiente con un orificio arriba) con el dedo tapando el orificio, el agua no entra, porque el aire está dentro. Aparece el experimento en un debate teórico.</p>
<p>Anaxágoras fue a Atenas, donde vivió bajo la protección de Pericles. Afirmó que la Luna brilla con luz del Sol y explicó el eclipse de Sol por interposición de la Luna. Llamó «piedra incandescente» al Sol, probablemente tras la caída de un meteorito en Egospótamos hacia 467 a. C. Fue acusado de impiedad (sin duda en parte para golpear a Pericles, su protector) y salió de Atenas. Esta tensión entre pensamiento libre y poder político es una constante: Sócrates (399 a. C.) pagará con la vida acusaciones similares.</p>
<div class="box rivalidad"><h4>La política persigue a los físicos</h4><p>Hacia 432 a. C., según Plutarco, el adivino Diopeites logró un decreto en Atenas que castigaba «a quienes no creyeran en los dioses o enseñaran doctrinas sobre los cuerpos celestes». Era un instrumento contra los amigos de Pericles. Es el primer caso documentado en que una teoría astronómica se convierte en delito. No será el último: Galileo, 2 000 años después (capítulo 11).</p></div>
</section>

<section>
<h2>Demócrito y el átomo</h2>
<p>La respuesta más radical al reto de Parménides fue la de Leucipo y su discípulo Demócrito: el mundo se compone de <span class="term">átomos</span> (<em>a-tomos</em>, «lo que no se corta»), infinitos, eternos, invisibles, que difieren solo en forma, orden y posición, y se mueven en el <em>vacío</em>. Parménides tenía razón en que el ser no cambia: los átomos son inmutables. Pero admitir el vacío («lo que no es» existe, en cierto sentido) permite el movimiento y la pluralidad. Los cambios que vemos son agregaciones y disgregaciones de átomos.</p>
<p>Los átomos no tienen color, olor ni sabor: «por convención el dulce, por convención el amargo; en realidad, átomos y vacío». Es la primera distinción entre cualidades primarias (forma, tamaño, movimiento) y secundarias (color, sabor), que Galileo y Locke recuperarán. Demócrito escribió, según Diógenes Laercio, unos setenta títulos de los que quedan fragmentos. «Prefiero encontrar una sola causa que ser rey de los persas», dijo.</p>
<div class="box epist"><h4>Una hipótesis que no se podía probar</h4><p>El atomismo antiguo no se apoyaba en ninguna observación que lo distinguiera de otras teorías; nadie podía ver un átomo ni medir su tamaño. Se aceptó o rechazó por razones filosóficas: Aristóteles lo rechazó (no admitía el vacío) y su peso hizo que el atomismo casi desapareciera de la Edad Media. Lucrecio lo recuperará en Roma (capítulo 6) y Gassendi en el siglo XVII. Hubo que esperar a Dalton (1803, la química), a Boltzmann (1877, el gas) y a Perrin (1908, el movimiento browniano) para que un modelo con átomos hiciera predicciones cuantitativas que otros modelos no daban (capítulos 17-18). Una idea correcta puede esperar dos milenios: no fue verdadera <em>por</em> la razón por la que se defendió.</p></div>
<div class="sim" data-sim="vidas" data-ids="tales,anaximandro,anaximenes,heraclito,jenofanes,pitagoras,parmenides,anaxagoras,zenon,empedocles,leucipo,democrito,herodoto" data-title="Los presocráticos: quién pudo conocer a quién"></div>

<li>Elija a Pitágoras: apenas coincidió de adulto con Tales y con Anaximandro (unos cuatro años), pero sí con Anaxímenes durante veinte; la tradición lo hace discípulo de los dos primeros, algo que las fechas permiten pero no prueban. Suba la edad mínima a 30 y vea cómo cambia el grupo.</li>
<li>Elija a Demócrito: pudo discutir con Anaxágoras y con Zenón en Atenas.</li>
</ul></div>

<section>
<h2>Balance epistemológico</h2>
<p>Hasta aquí no hay ni una medida moderna y casi ningún experimento. Lo que hay es nuevo en tres sentidos:</p>
<ul>
<li><b>Naturalismo:</b> las causas son del mismo orden que los efectos (agua, aire, fuego), no voluntades divinas.</li>
<li><b>Crítica:</b> los modelos se discuten y se mejoran, y se firman con el nombre propio.</li>
<li><b>Matemática:</b> aparecen la proporción y la geometría como lenguaje (Tales, Pitágoras).</li>
</ul>
<p>Falta algo que solo llegará con Aristóteles (capítulo 4) y sobre todo con Galileo (capítulo 11): usar la medida para decidir entre modelos rivales.</p>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>La sombra de Tales mide 1.80 m (igual a su estatura) y la de una pirámide, medida desde el borde de la base, mide 31.4 m. La mitad de la base es 115.2 m. ¿Qué altura obtiene?
<details><summary>Respuesta</summary><p>\(H=31.4+115.2=146.6\) m, la altura original de la Gran Pirámide.</p></details></li>
<li><span class="lvl">Básico</span>Una cuerda de longitud \(L\) da una nota. ¿Qué longitud da una quinta por encima? ¿Y dos octavas por encima?
<details><summary>Respuesta</summary><p>Una quinta: \(2L/3\). Dos octavas: \(L/4\).</p></details></li>
<li><span class="lvl">Intermedio</span>Aquiles corre a 8 m/s y la tortuga a 0.5 m/s, con 60 m de ventaja. ¿En qué tiempo la alcanza, y cuánto suman las tres primeras etapas de Zenón?
<details><summary>Respuesta</summary><p>\(t=60/7.5=8\) s. Primera etapa: 7.5 s; segunda: \(7.5\times0.0625=0.469\) s; tercera: 0.029 s. Suma: 8.0 s (7.998).</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que doce quintas justas superan a siete octavas en la proporción \(3^{12}/2^{19}\) y calcule la coma en cents.
<details><summary>Respuesta</summary><p>\((3/2)^{12}/2^7=3^{12}/2^{19}=531441/524288=1.013643\). En cents: \(1200\log_2 1.013643=23.46\).</p></details></li>
<li><span class="lvl">Avanzado</span>El argumento de Anaximandro («no hay razón para que la Tierra caiga en una dirección») es una prueba por simetría. Cite otro ejemplo de la física posterior en que se usa y discuta su límite.
<details><summary>Respuesta</summary><p>Ejemplos: la ley de Gauss para un campo central, el equilibrio del asno de Buridán, la conservación de la cantidad de movimiento (Noether, 1918). Límite: la simetría puede romperse espontáneamente (el asno acabará comiendo), y entonces el argumento ya no prohíbe la caída, solo no indica adónde.</p></details></li>
</ol>
