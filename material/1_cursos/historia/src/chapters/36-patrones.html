<p class="lead">Hemos recorrido cuatro mil años: calendarios de arcilla, esferas de cristal, planos inclinados, péndulos, bombas de vacío, prismas, pilas, motores, ondas, electrones, átomos, espacios curvos y universos en expansión. Cada capítulo contaba una historia distinta, con sus personas y sus equivocaciones. Este último pregunta qué se repite. No hay leyes de la historia de la ciencia, pero sí regularidades que se pueden contar: casi nunca fue una persona sola; casi siempre se llegó a una idea por caminos que no son los que cuentan los manuales; los errores sirvieron más de lo que se cree; y los nombres de las leyes suelen ser injustos. Conviene mirarlas con cuidado, con humildad y con datos.</p>

<section>
<h2>Simultaneidad: cuando la idea está madura</h2>
<div class="box contexto"><h4>Dieciocho casos</h4><p>La energía se conserva: lo vio Mayer en 1842, Joule en 1843, Colding en Dinamarca, Helmholtz en 1847, Grove, Séguin, Carnot en notas póstumas. La selección natural: Darwin en 1838 y Wallace en 1858. El cálculo: Newton hacia 1666 y Leibniz hacia 1675. Neptuno: Adams en Cambridge y Le Verrier en París con un año de diferencia (capítulo 16). El teléfono: Bell y Gray presentaron la patente el mismo día de 1876. El mecanismo de Higgs: tres grupos en 1964. La relatividad: Einstein y Poincaré, en 1905. Robert Merton (1961) catalogó cientos de casos y sostuvo que los descubrimientos múltiples son <em>la regla</em>; los singletons (los que solo ocurren una vez) serían los casos en que los otros no llegaron a publicar o fueron olvidados.</p></div>
<div class="sim" data-sim="descubrimientos-multiples" data-title="Descubrimientos múltiples: un modelo y los datos"></div>
<div class="sim-guide"><ul>
<li>Con 5 equipos y una tasa de 0.2 por año, la probabilidad de que los dos primeros coincidan en 2 años es del 80 %: alcanza con que haya varios grupos buscando lo mismo con medios parecidos. Baje \(n\) a 2: solo un 33 %. La mediana de los casos históricos es de 1 año.</li>
<li>El modelo es simplista (equipos independientes, tasa constante), pero ilustra el argumento: si la madurez de una idea se mide con el número de grupos capaces de plantearla, la prioridad es en buena parte cuestión de suerte.</li>
</ul></div>
<div class="box epist"><h4>¿Qué hace madura una idea?</h4><p>Kuhn (1959, «Energy conservation as an example of simultaneous discovery») identificó en el caso de la energía tres condiciones: la disponibilidad de los datos (el equivalente mecánico del calor, las pilas, la fisiología animal), el interés práctico (las máquinas de vapor) y una filosofía favorable (la <em>Naturphilosophie</em> alemana, que veía una unidad de las fuerzas). Si lo mismo ocurre en otros casos, la historia de la ciencia no es una galería de genios sino un paisaje con relieve: las ideas aparecen donde el terreno las deja subir. Pero hay discontinuidades que no se explican así: el análisis de Newton de la órbita lunar (capítulo 14) y la relatividad general de Einstein (capítulo 27), de la que no hay un segundo descubridor en una década. No todos los saltos son colectivos.</p></div>
</section>

<section>
<h2>Prioridad y nombres</h2>
<p>La ciencia moderna se construyó sobre el artículo con nombre y fecha (capítulo 35), de modo que la prioridad importa: da crédito, trabajo y premios. Las disputas han sido feroces (Newton contra Leibniz, Hooke contra Newton, Galileo contra Scheiner, Heaviside contra todos), y las resoluciones, injustas con frecuencia. El «efecto Mateo» y el «efecto Matilda» se suman al problema de cómo se ponen los nombres.</p>
<div class="box leyenda"><h4>La ley de Stigler de la eponimia</h4><p>Stigler (1980) enunció, con humor y con el permiso de Merton, que «ningún descubrimiento científico lleva el nombre de su descubridor», y añadió: «incluida esta ley». En este curso hemos encontrado:</p>
<div class="tablewrap"><table class="hist"><tr><th>Ley o resultado</th><th>Nombre usual</th><th>Anterior o paralelo</th></tr>
<tr><td>Teorema de Pitágoras</td><td>Pitágoras (c. 530 a. C.)</td><td>Tablillas babilonias (c. 1800 a. C.), Plimpton 322 (capítulo 2)</td></tr>
<tr><td>Ley de la refracción</td><td>Snell (1621)</td><td>Ibn Sahl (984), Harriot (1602)</td></tr>
<tr><td>Ley de Hubble</td><td>Hubble (1929)</td><td>Lemaître (1927)</td></tr>
<tr><td>Ecuaciones de Maxwell (cuatro)</td><td>Maxwell (1865)</td><td>Heaviside y Hertz (1884-1890)</td></tr>
<tr><td>Transformaciones de Lorentz</td><td>Lorentz (1904)</td><td>Voigt (1887), Larmor (1897)</td></tr>
<tr><td>Ley de Boyle</td><td>Boyle (1662)</td><td>Towneley y Power (1661) (capítulo 12)</td></tr>
<tr><td>Anillos de Newton</td><td>Newton (1704)</td><td>Hooke (1665) (capítulo 15)</td></tr>
</table></div>
<p>La eponimia no es una injusticia al azar: sigue el efecto Mateo (el nombre va al más famoso o al que dio la forma más clara). A veces la fama es merecida (Newton formuló la ley con generalidad) y a veces no. Es útil como ejercicio crítico: ante un nombre, preguntar quién hizo qué.</p></div>
</section>

<section>
<h2>El error como motor</h2>
<ol class="chain">
<li><b class="y">Errores fecundos</b><p>Ptolomeo se equivocó con la Tierra inmóvil, pero su sistema era un buen instrumento de cálculo durante catorce siglos. Kepler descartó una órbita circular que concordaba con Tycho a 8′ y halló las elipses (capítulo 10). Maxwell construyó una máquina de ruedas y vórtices que no existía, y obtuvo la corriente de desplazamiento (capítulo 21). Bohr tuvo un átomo incoherente que reprodujo el espectro (capítulo 28). Fermi vio la fisión sin reconocerla (capítulo 30). El error forma parte del método.</p></li>
<li><b class="y">Errores tercos</b><p>Kelvin dio 20-40 millones de años para la edad de la Tierra (capítulo 18) con una física impecable, y se equivocó porque faltaba la radiactividad. Millikan mantuvo que el fotón era insostenible (capítulo 25). Einstein no aceptó la interpretación probabilística (capítulo 29). Hubble tuvo una constante siete veces mayor (capítulo 33). Eddington, Russell, Planck: los grandes también se equivocan con calma.</p></li>
<li><b class="y">Errores de datos</b><p>El valor de la viscosidad del aire en Millikan, los canales de Marte de Lowell, los rayos N de Blondlot (1903: decenas de artículos de físicos franceses «vieron» una radiación inexistente), la «fusión fría» (1989), los neutrinos superlumínicos de OPERA (2011: un cable de fibra óptica mal conectado). Se descubrieron y se corrigieron: la ciencia se defiende de los errores con la réplica, con la crítica y con la competencia entre grupos.</p></li>
</ol>
<div class="box epist"><h4>La estructura de la corrección</h4><p>Popper vio la ciencia como conjeturas y refutaciones; Kuhn, como períodos de ciencia normal interrumpidos por crisis; Lakatos, como programas que progresan o degeneran; Feyerabend, como un anarquismo metodológico; Hacking y Chang, como una colección de prácticas con instrumentos. Los casos de este cuaderno apoyan una mezcla: los datos, los instrumentos y las teorías se ajustan mutuamente (Chang llama a esto <em>coherentismo activo</em>), con un criterio práctico de que un error queda establecido cuando varios procedimientos independientes lo detectan. La técnica de la <em>convergencia de métodos</em> (Perrin con el número de Avogadro, capítulo 18; Hubble, Planck y las supernovas en cosmología, capítulo 33) es probablemente el patrón más sólido para decidir que algo es real.</p></div>
</section>

<section>
<h2>Revoluciones: cómo cambian las teorías</h2>
<p>De la física aristotélica a la de Newton, de la de Newton a la relatividad y la cuántica, hay dos formas de contar la historia: la acumulativa («cada teoría incluye a la anterior como caso límite») y la revolucionaria (Kuhn: los paradigmas son <em>inconmensurables</em>). Hay elementos de ambas.</p>
<ul>
<li><b>Continuidad matemática.</b> Las ecuaciones de Newton son el límite de las de Einstein para \(v\ll c\); la mecánica clásica es el límite de la cuántica para \(\hbar\to0\); la óptica geométrica es el límite de la ondulatoria para \(\lambda\to0\). El principio de correspondencia (Bohr) fue una guía.</li>
<li><b>Ruptura conceptual.</b> Pero las nociones cambian: la «masa» de Newton y la de Einstein, el «tiempo absoluto» y el «tiempo propio», la «trayectoria» y la «función de onda» no se traducen sin resto. La relatividad no es una corrección: es otra forma de entender espacio y tiempo.</li>
<li><b>Resistencias humanas.</b> Los mayores se aferran a lo conocido: Planck dijo que una nueva verdad triunfa cuando mueren sus oponentes, y las generaciones de Lorentz, Kelvin y Einstein se resistieron cada una a una ruptura. Los estudios empíricos (Hull, Sulloway) sugieren que quienes aceptan antes las teorías nuevas tienden a ser más jóvenes, con excepciones notables (Copérnico, Planck).</li>
<li><b>Tiempo largo.</b> Las «revoluciones» duran décadas. Entre Copérnico y Newton pasaron 144 años; entre Planck y la mecánica cuántica, 25; entre las primeras observaciones de la expansión y su aceptación, 20.</li>
</ul>
<div class="box rivalidad"><h4>Lo que Kuhn y Popper no vieron</h4><p>Ningún modelo filosófico abarca todos los casos. Kuhn exagera la discontinuidad en la física del siglo XIX (la teoría ondulatoria, el electromagnetismo y la termodinámica crecieron sin crisis) y Popper exagera la importancia de la refutación (Newton no abandonó la gravitación cuando Mercurio no cuadraba, y tuvo razón: eran los datos de las otras perturbaciones). La pauta más útil es quizá la de Lakatos: preguntar de cada programa si predice cosas nuevas. Pero el juicio sobre «progresivo» y «degenerativo» solo es posible retrospectivamente, y ahí está la dificultad.</p></div>
</section>

<section>
<h2>El azar, la belleza y lo que no se sabe</h2>
<ul>
<li><b>Serendipia y preparación.</b> Röntgen, Becquerel, Penzias y Wilson, Davisson y Germer, Hertz con su chispa: muchas veces el descubrimiento fue un hallazgo inesperado. Pero casi siempre lo vio alguien capaz de reconocer su importancia, y lo siguió con trabajo metódico.</li>
<li><b>Belleza y simplicidad.</b> Dirac, Einstein, Weyl y los teóricos del siglo XX consideraron la belleza matemática un criterio de verdad. Funcionó muchas veces (relatividad general, ecuación de Dirac) y falló otras (los modelos de Kelvin de torbellinos, la teoría de las cuerdas todavía sin comprobación). No es un criterio lógico, sino un hábito de la comunidad.</li>
<li><b>Instrumentos y técnicas.</b> El telescopio, el prisma, la bomba de vacío, la cámara de niebla, el acelerador, el interferómetro: casi todas las revoluciones fueron precedidas por un instrumento nuevo, y a veces por la fabricación de uno que nadie sabía para qué serviría (Hacking).</li>
<li><b>Lo que no se sabe.</b> A comienzos del siglo XXI se desconoce de qué está hecho el 95 % del universo (materia y energía oscuras), cómo unir la gravedad con la cuántica, por qué las constantes tienen sus valores y si la mecánica cuántica es completa. En 1900 se creía lo contrario: que quedaba poco por descubrir. Una lección de este cuaderno es que, de las preguntas abiertas de cada época, algunas se resolvieron y otras desaparecieron al cambiar de teoría; las verdaderamente nuevas casi nunca estaban en la lista.</li>
</ul>

<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Con 4 equipos independientes y una tasa de 0.25 por año, ¿cuál es la probabilidad de que los dos primeros descubran a menos de 1 año?
<details><summary>Respuesta</summary><p>\(1-e^{-(4-1)\times0.25\times1}=1-e^{-0.75}=0.53\).</p></details></li>
<li><span class="lvl">Intermedio</span>Elija tres leyes de la física con nombre de persona y busque quién las formuló antes o a la vez. ¿Cuáles obedecen la ley de Stigler?
<details><summary>Respuesta</summary><p>Hay muchas posibilidades: ley de Snell (Ibn Sahl), ley de Hubble (Lemaître), transformaciones de Lorentz (Voigt), ecuaciones de Maxwell (Heaviside), ley de Titius-Bode, ley de Hooke, ecuación de Schrödinger (la de Klein–Gordon), etc.</p></details></li>
<li><span class="lvl">Avanzado</span>Compare el patrón de la «crisis del éter» (capítulo 23) y la «crisis de la edad» (capítulo 33) con la estructura kuhniana de anomalía, crisis y revolución. ¿Cuál se ajusta más?
<details><summary>Respuesta</summary><p>La crisis del éter acumuló anomalías con respuestas ad hoc (contracción) y terminó en un cambio de marco (relatividad): ajusta a Kuhn. La crisis de la edad se resolvió con una hipótesis auxiliar (calibración de distancias): es un ajuste dentro de un paradigma (ciencia normal). La misma etiqueta de «crisis» cubre cosas distintas.</p></details></li>
<li><span class="lvl">Avanzado</span>Elija un capítulo de este cuaderno y escriba la historia que contaría un manual escolar y la que cuenta el documento. ¿Qué papel juega la leyenda en la enseñanza? ¿Qué se gana y qué se pierde con ella?
<details><summary>Respuesta</summary><p>Un ejemplo: la caída de la manzana de Newton. El manual: una caída y una inspiración. El documento: una anécdota tardía contada por Newton a Stukeley y a Conduitt (1726-1727), de un jardín en Woolsthorpe en 1666, con una elaboración matemática que tardó veinte años (capítulo 14). Se gana la memorabilidad y se pierde la idea de que el descubrimiento es un proceso largo y colectivo. Un uso responsable de la leyenda es contarla y decir qué es.</p></details></li>
</ol>
