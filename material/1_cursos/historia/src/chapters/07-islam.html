<p class="lead">Hacia el año 1011, en El Cairo, un sabio llamado Ibn al-Haytham, según contó siglos después un biógrafo, había prometido al califa al-Hakim regular las crecidas del Nilo; al comprobar que era imposible, fingió locura para escapar del castigo y pasó diez años bajo arresto domiciliario. Esa anécdota probablemente es leyenda, pero es cierto que durante aquella década escribió siete libros de óptica donde afirmaba que la visión ocurre porque la luz entra en el ojo, no porque salga de él; y que probó cada afirmación con un experimento que otros pudieran repetir. Al-Haytham, que en Europa fue «Alhazen», es posiblemente el eslabón que une el método de Arquímedes con el de Galileo.</p>

<section>
<h2>Bagdad: papel, califas y traductores</h2>
<div class="box contexto"><h4>Un imperio que quiso el saber</h4><p>Tras la conquista árabe (632-750), el califato abasí fundó Bagdad en 762, crucero de rutas entre China, la India y el Mediterráneo. En 751, tras la batalla de Talas, la fabricación de papel pasó de prisioneros chinos a Samarcanda; hacia 800 había fábricas en Bagdad: el saber dejó de depender del costoso pergamino. El califa al-Mamún (813-833) impulsó la <em>Bayt al-Hikma</em> («Casa de la Sabiduría»), una biblioteca y centro de traducción donde cristianos nestorianos, judíos, sabeos y musulmanes vertían al árabe a Aristóteles, Euclides, Arquímedes, Ptolomeo, Galeno y a los matemáticos indios. Se cuenta que Hunayn ibn Ishaq, traductor, recibía el peso en oro de cada libro traducido; es una exageración, pero marca el lugar que tenía el saber para la corte. Motivos prácticos ayudaron: el calendario islámico exigía precisar las fases de la Luna; la oración, la dirección de La Meca (<em>qibla</em>) y los horarios; el comercio y el reparto de herencias, el álgebra.</p></div>
<div class="people">
<div class="persona"><b>Al-Juarismi</b><small>c. 780 – c. 850 · Bagdad</small><p>Su <em>Álgebra</em> (c. 820) resuelve ecuaciones cuadráticas con reglas sistemáticas; de su nombre viene «algoritmo», y de <em>al-jabr</em>, «álgebra». Difundió la numeración india.</p></div>
<div class="persona"><b>Al-Kindi</b><small>c. 801 – c. 873 · Bagdad</small><p>«El filósofo de los árabes». Escribió sobre óptica (<em>De aspectibus</em>), criptoanálisis y filosofía; defendió el valor de las ciencias extranjeras.</p></div>
<div class="persona"><b>Al-Razi</b><small>865 – 925 · Rayy, Bagdad</small><p>Médico y alquimista («Rhazes»). Sus <em>Dudas sobre Galeno</em> son una crítica empírica de la autoridad; clasificó sustancias por propiedades y escribió sobre el sarampión y la viruela.</p></div>
<div class="persona"><b>Ibn Sahl</b><small>c. 940 – c. 1000 · Bagdad</small><p>Matemático de la corte buyí. En <em>Sobre los espejos y lentes ardientes</em> (984) enuncia la ley de la refracción en forma geométrica.</p></div>
<div class="persona"><b>Ibn al-Haytham (Alhazen)</b><small>c. 965 – c. 1040 · Basora, El Cairo</small><p>El mayor físico del Islam. Su <em>Libro de óptica</em> (c. 1011-1021) fundó la óptica geométrica y fisiológica con razonamiento y experimento.</p></div>
<div class="persona"><b>Al-Biruni</b><small>973 – c. 1048 · Kath (Corasmia), Gazni</small><p>Polímata. Midió con gran precisión densidades de metales y piedras, el radio de la Tierra y la latitud de Gazni; escribió sobre la India tras acompañar a Mahmud de Gazni, y discutió si la Tierra gira.</p></div>
<div class="persona"><b>Ibn Sina (Avicena)</b><small>980 – 1037 · Bujará, Hamadán, Isfahán</small><p>Médico y filósofo; su <em>Canon de medicina</em> fue el manual europeo por siglos. Propuso un <em>mayl</em> (inclinación) que mantiene el movimiento del proyectil, antecesor del impetus.</p></div>
<div class="persona"><b>Nasir al-Din al-Tusi</b><small>1201 – 1274 · Tus, Alamut, Maragha</small><p>Dirigió el observatorio de Maragha por encargo del jan mongol Hulagu (1259). Introdujo el «par de Tusi» y las <em>Tablas ilkhánicas</em>.</p></div>
<div class="persona"><b>Ibn al-Shatir</b><small>c. 1304 – c. 1375 · Damasco</small><p>Astrónomo-regulador de horarios de la mezquita Omeya. Sus modelos de la Luna y Mercurio eliminan el ecuante y coinciden, matemáticamente, con los de Copérnico.</p></div>
<div class="persona"><b>Ulugh Beg</b><small>1394 – 1449 · Herat, Samarcanda</small><p>Nieto de Tamerlán, príncipe y astrónomo. Su observatorio de Samarcanda produjo un catálogo de 1018 estrellas (1437). Fue asesinado por orden de su hijo.</p></div>
</div>

<section>
<h2>Alhazen y la luz</h2>
<p>La visión era el gran problema de la óptica antigua. Había dos familias de teorías: la <span class="term">extramisión</span> (Euclides, Ptolomeo): el ojo emite rayos que «tocan» los objetos; y la <span class="term">intromisión</span> (los atomistas, Aristóteles): los objetos emiten algo que llega al ojo. Alhazen unificó la geometría de Euclides con la fisiología de Galeno y la intromisión, y la sostuvo con argumentos y experimentos:</p>
<ol class="chain">
<li><b class="y">El deslumbramiento</b><p>Si se mira el Sol, el ojo duele y queda una imagen persistente. Si el ojo emitiera rayos, no sufriría daño de la luz: la luz entra y lo hiere.</p></li>
<li><b class="y">El rayo y la cámara oscura</b><p>Desde cada punto de un objeto salen rayos en todas direcciones, y el orificio de un cuarto oscuro selecciona uno que va a cada punto de la pared opuesta: la imagen resulta invertida. Alhazen lo comprobó con velas colocadas a distinta altura y tapando una de ellas: se apagaba el punto correspondiente. Una prueba de que la luz viaja en línea recta, descrita con control experimental.</p></li>
<li><b class="y">Reflexión y refracción</b><p>Verifica la ley de la reflexión con espejos planos y esféricos, y estudia la refracción con recipientes de agua y de vidrio (no llegó a la ley de los senos). Plantea el «problema de Alhazen»: dados dos puntos y un espejo esférico, encontrar el punto de reflexión; lleva a una ecuación de cuarto grado.</p></li>
<li><b class="y">La ilusión</b><p>Explica por qué la Luna parece mayor cerca del horizonte con un razonamiento de óptica fisiológica y psicológica: el cerebro, no el ojo, juzga el tamaño según la distancia estimada.</p></li>
</ol>
<div class="sim" data-sim="camara-oscura" data-title="El orificio óptimo de la cámara oscura"></div>
<div class="sim-guide"><ul>
<li>Con una pantalla a 50 cm, el orificio óptimo mide 0.82 mm. Un orificio de 3 mm da una imagen borrosa por geometría; uno de 0.1 mm, por difracción.</li>
<li>Alhazen no conocía la difracción (se descubre en el siglo XVII con Grimaldi), pero sí que reducir el orificio mejora la imagen hasta cierto límite; su explicación del límite fue la «rareza de la luz».</li>
</ul></div>
<div class="box fuente"><h4>Sobre la duda y la autoridad</h4><blockquote>El que busca la verdad no es quien estudia los escritos de los antiguos y, según su inclinación natural, confía en ellos, sino quien sospecha de su fe en ellos y cuestiona lo que ha reunido de ellos, quien se somete al argumento y la demostración y no a las palabras de un hombre.</blockquote><p>Ibn al-Haytham, <em>Dudas sobre Ptolomeo</em> (c. 1020; paráfrasis de una traducción conocida). En ese libro enumera las incoherencias del <em>Almagesto</em>, como el ecuante, que no puede materializarse con esferas físicas, y las critica con respeto.</p></div>
<div class="box epist"><h4>Un método con pasos</h4><p>En el <em>Libro de óptica</em> Alhazen sigue un procedimiento: observar, formular una hipótesis, ponerla a prueba con experimentos controlados, examinar si se cumplen las consecuencias, y registrar la conclusión. Los historiadores (Sabra, Rashed) debaten si es un método «moderno» o si lo leemos hoy con ojos modernos; pero su insistencia en que la teoría debe someterse a la experiencia, y en que las observaciones deben repetirse, no tiene precedentes. La obra pasó al latín hacia 1200 como <em>De aspectibus</em>, y su influencia aparece en Roger Bacon, Witelo y Kepler (1604).</p></div>
<h3>Ibn Sahl y la ley de la refracción</h3>
<p>Mientras Alhazen medía ángulos de refracción sin hallar la regla, Ibn Sahl, tres décadas antes, había demostrado en un tratado sobre lentes la ley que hoy asociamos con Snell, en forma geométrica: la razón de las longitudes de los dos rayos hasta una misma línea paralela a la normal es constante. El manuscrito (Teherán y Damasco) se identificó en 1990 gracias a Roshdi Rashed. La ley fue olvidada en Europa; Snell la redescubrió hacia 1621 sin publicarla, y Descartes la publicó en 1637 (capítulo 13).</p>
<div class="eq key" data-name="Ley de la refracción (Ibn Sahl, Snell, Descartes)">\[\frac{L_2}{L_1}=\frac{\sen\theta_1}{\sen\theta_2}=n_{21}=\frac{v_1}{v_2}.\]</div>
<div class="sim" data-sim="sahl" data-title="La refracción de Ibn Sahl: cociente de longitudes"></div>
<div class="sim-guide"><ul>
<li>Para cualquier ángulo, \(L_2/L_1\) es igual al índice. Es la forma que Ibn Sahl pudo usar sin funciones seno: solo razones de segmentos.</li>
</ul></div>
</section>

<section>
<h2>Al-Biruni: medir la Tierra desde una montaña</h2>
<p>Biruni, que escribió sobre casi todo (astronomía, farmacia, mineralogía, India), midió el radio de la Tierra con una idea nueva: no hace falta recorrer un meridiano, basta subir una montaña. Desde la cima, el horizonte aparece <em>por debajo</em> de la horizontal un pequeño ángulo \(\theta\) (la depresión del horizonte): un astrolabio lo mide. Con la altura \(h\) de la cima, la geometría de la tangente da el radio. Lo ejecutó en la fortaleza de Nandana (Punjab), hacia 1025.</p>
<div class="eq key" data-name="Radio de la Tierra de Biruni">\[\cos\theta=\frac{R}{R+h}\quad\Longrightarrow\quad R=\frac{h\cos\theta}{1-\cos\theta}.\]</div>
<div class="sim" data-sim="biruni" data-title="El radio de la Tierra desde una montaña"></div>
<div class="sim-guide"><ul>
<li>Con 305 m de altura y 34′ de depresión se obtiene un radio de unos 6 240 km, a un 2 % del valor real. Pero un error de un minuto de arco en el ángulo cambia el resultado un 6 %: la medición es muy sensible y exige un instrumento excelente.</li>
<li>Biruni calculó la altura con triangulación en la ladera (dos mediciones de ángulo y una base), un método que se enseña hoy.</li>
</ul></div>
<div class="box epist"><h4>Errores sistemáticos</h4><p>Biruni sabía que los instrumentos y los observadores fallan, e insistía en repetir las mediciones y promediar. Aquí la fuente de error principal es la refracción atmosférica, que eleva el horizonte aparente: un efecto que no pudo considerar, y que un siglo después se cuenta como el origen de las variaciones de sus resultados. Hay una diferencia entre pensar que un instrumento puede mentir y medir cuánto: la segunda llegó con el cálculo de errores de Gauss (1809).</p></div>
</section>

<section>
<h2>Maragha, Damasco y Copérnico: el par de Tusi</h2>
<p>El saber astronómico del Islam se organizó en observatorios con instrumentos grandes: Maragha (1259), Samarcanda (1420) y Estambul (1577). Quienes allí trabajaron compartían una incomodidad con el modelo de Ptolomeo: el ecuante violaba el principio de movimiento uniforme sobre círculos. Los astrónomos de Maragha (Tusi, Urdi, Shirazi) y de Damasco (Ibn al-Shatir) idearon sustitutos.</p>
<p>Tusi propuso en 1247 (<em>Tadhkira</em>) un recurso geométrico: un círculo pequeño de radio \(r\) rueda por dentro de otro de radio \(R=2r\) y un punto de su circunferencia describe una recta, el diámetro. Con dos movimientos circulares uniformes se obtiene un movimiento <em>lineal</em>. Con ese artefacto se pueden reproducir las variaciones de distancia sin ecuante.</p>
<div class="sim" data-sim="tusi" data-title="El par de Tusi: dos círculos que dibujan una recta"></div>
<div class="sim-guide"><ul>
<li>Con R/r = 2 la desviación respecto de una recta es 0, y la amplitud es 4r (el diámetro mayor). Cambie la razón: la hipocicloide se vuelve una curva con más lóbulos.</li>
</ul></div>
<p>Copérnico (1543) emplea exactamente el mismo mecanismo (con las letras griegas de la figura casi idénticas a las de Tusi) y, además, usa modelos lunares y de Mercurio matemáticamente equivalentes a los de Ibn al-Shatir. ¿Se enteró? La hipótesis de la transmisión (Swerdlow, Neugebauer, Saliba) sostiene que sí: por manuscritos griegos bizantinos que contenían la traducción del árabe, uno de los cuales se conserva en el Vaticano. No hay prueba de que Copérnico los haya tenido en las manos. Puede ser una reinvención independiente. Es un caso de <em>problema histórico con evidencia circunstancial</em>.</p>
<div class="box leyenda"><h4>Copérnico plagió a los árabes</h4><p>Se lee a veces que Copérnico «copió» a Tusi y Ibn al-Shatir. Es excesivo: la equivalencia matemática está probada, el camino de transmisión está sin probar, y lo que es de Copérnico (poner el Sol en el centro y derivar de ello las distancias relativas de los planetas) no está en ningún texto árabe. Lo que sí desmiente es la imagen de que los astrónomos del Islam fueron solo transmisores: sus modelos fueron un laboratorio de ideas.</p></div>
</section>

<section>
<h2>Política, mecenazgo y la discusión de la «decadencia»</h2>
<div class="box contexto"><h4>Principes que protegen y que matan</h4><p>La ciencia del Islam dependió de mecenas: califas, visires y sultanes que pagaban observatorios y bibliotecas, y que también los cerraban. Los mongoles destruyeron Bagdad en 1258, y la Casa de la Sabiduría ya había perdido su papel; sin embargo, el jan Hulagu, que acababa de arrasar la ciudad, financió el observatorio de Maragha. Ulugh Beg, sultán de Samarcanda, fundó una <em>madrasa</em> y un observatorio con un sextante de 40 m de radio, y su catálogo estelar (1437) fue el mejor desde Ptolomeo hasta Tycho; en 1449 fue ejecutado por orden de su hijo, con apoyo del clero conservador que lo veía como un hereje, y su observatorio quedó en ruinas.</p></div>
<p>Se ha debatido por qué una civilización con tantas innovaciones no desencadenó una revolución científica como la europea. La tesis clásica señala a al-Ghazali (<em>La incoherencia de los filósofos</em>, 1095) y a una reacción religiosa contra la filosofía; los historiadores recientes (Saliba) rechazan esa narración: la actividad astronómica y matemática continuó cuatro siglos más, y la institución clave de la ciencia europea, el espacio de debate libre entre pares, también faltó en muchas otras civilizaciones. Una explicación más económica apunta a causas políticas y económicas: la fragmentación del califato, las invasiones mongolas y turcas, y el desplazamiento de las rutas del comercio después de 1500. Es una cuestión abierta.</p>
<div class="box leyenda"><h4>«Los árabes solo conservaron a los griegos»</h4><p>La idea de que el Islam fue un «puente» pasivo es de la historiografía europea del siglo XIX. Los textos muestran creación: el álgebra como disciplina, la trigonometría esférica moderna (Biruni, Nasir al-Din), la óptica experimental, la astronomía observacional con grandes instrumentos y los primeros ataques razonados al <em>Almagesto</em>. Cuando los europeos tradujeron (Toledo, 1085-1280), tradujeron a Alhazen, a Avicena, a Averroes y a al-Juarismi, no solo a Aristóteles.</p></div>
<div class="sim" data-sim="timeline" data-ch="islam" data-from="740" data-to="1460" data-title="Línea de tiempo de la ciencia del Islam"></div>

<li>Elija a Ibn al-Shatir: coincidió con Al-Farisi solo un par de décadas. Las ideas viajan por manuscritos y alumnos.</li>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Desde una montaña de 600 m el horizonte aparece a 0.77° bajo la horizontal. Calcule el radio de la Tierra según Biruni.
<details><summary>Respuesta</summary><p>\(\cos0.77^\circ=0.999910\); \(1-\cos\theta=9.03\times10^{-5}\); \(R=600\times0.99991/9.03\times10^{-5}=6.64\times10^6\) m, es decir, 6 640 km (+4 %).</p></details></li>
<li><span class="lvl">Básico</span>Un rayo pasa del aire al vidrio (\(n=1.5\)) con 40° de incidencia. Calcule el ángulo refractado y el cociente \(L_2/L_1\).
<details><summary>Respuesta</summary><p>\(\sen\theta_2=\sen40^\circ/1.5=0.4285\Rightarrow\theta_2=25.4^\circ\). \(L_1/L_2=\sen\theta_2/\sen\theta_1=1/1.5=0.667\) (o 1.5 si se mide al revés).</p></details></li>
<li><span class="lvl">Intermedio</span>Calcule el diámetro óptimo de un orificio para una cámara oscura de 30 cm de profundidad con luz de 550 nm.
<details><summary>Respuesta</summary><p>\(d=\sqrt{2.44\lambda f}=\sqrt{2.44\times550\times10^{-9}\times0.3}=0.63\) mm.</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que el punto de la circunferencia del círculo de radio \(r\) que rueda por dentro del de radio \(2r\) permanece sobre un diámetro.
<details><summary>Respuesta</summary><p>Con \(P=(R-r)\ee^{\ii t}+r\ee^{-\ii(R-r)t/r}\) y \(R=2r\): \(P=r\ee^{\ii t}+r\ee^{-\ii t}=2r\cos t\), real: el punto oscila sobre el eje horizontal con amplitud \(2r\).</p></details></li>
<li><span class="lvl">Avanzado</span>Se discute si Copérnico conoció el par de Tusi. Plantee qué tres tipos de evidencia permitirían decidirlo y cuál sería el mayor sesgo del historiador.
<details><summary>Respuesta</summary><p>(a) Documental: un manuscrito con anotaciones de Copérnico o un catálogo de su biblioteca; (b) de transmisión: una cadena de manuscritos traducidos y fechas plausibles (Bizancio, Italia, Cracovia); (c) interna: errores o letras copiadas que no tendrían razón de coincidir. Sesgo: la atracción del relato de la «transmisión» o, al revés, la reticencia a restar originalidad a un héroe nacional; cada una de las narraciones explica la historia que se quería contar.</p></details></li>
</ol>
