<p class="lead">En la Navidad de 1938, dos físicos austriacos exiliados, una tía y su sobrino, caminaban por la nieve de un pueblo sueco, Kungälv, con una carta recién llegada de Berlín. Otto Hahn, el químico, escribía que al bombardear uranio con neutrones había encontrado bario, un elemento a la mitad de la tabla, y que no entendía cómo. Lise Meitner, que había perdido su cargo y su laboratorio berlinés cuando Alemania se anexionó Austria, y que había trabajado quince años con Hahn, se sentó sobre un tronco con un papel y un lápiz. Si el núcleo de uranio, pensó, es una gota de líquido cargada, el neutrón puede deformarla hasta que se parta en dos. Calculó la repulsión eléctrica entre los fragmentos: unos 200 MeV. Y con la masa que faltaba, \(E=mc^2\), tuvo la cifra exacta. Sin Meitner, el hallazgo de Hahn era un enigma químico; con ella, era el comienzo de una era.</p>

<section>
<h2>Un núcleo con estructura</h2>
<div class="box contexto"><h4>Ciencia pura que se volvió política de estado</h4><p>Hasta 1939 la física nuclear era una ciencia académica de laboratorios pequeños (el Cavendish, el Instituto Kaiser Wilhelm, los Via Panisperna de Fermi). La política alemana y europea la cambió: las leyes raciales de 1933 y 1938 expulsaron a científicos como Einstein, Meitner, Szilárd, Born, Franck, Bethe, Peierls y Fermi (cuya mujer era judía), que fueron a EE. UU. y Gran Bretaña. La fisión se descubrió en Berlín en diciembre de 1938, meses antes de la guerra; en agosto de 1939 una carta de Szilárd, firmada por Einstein, advirtió al presidente de que Alemania podía fabricar una bomba. Lo que había sido la «física de los átomos» se convirtió, en tres años, en el mayor proyecto científico-industrial de la historia.</p></div>
<div class="people">
<div class="persona"><b>James Chadwick</b><small>1891 – 1974 · Cambridge, Liverpool</small><p>Descubrió el neutrón en 1932, tras tres semanas de trabajo casi sin dormir. Premio Nobel 1935; dirigió la misión británica en Los Álamos.</p></div>
<div class="persona"><b>Enrico Fermi</b><small>1901 – 1954 · Roma, Chicago</small><p>El último físico completo, teórico y experimental. Con sus «chicos de Via Panisperna» descubrió que los neutrones lentos son más eficaces. Nobel 1938, emigró a EE. UU. en el viaje de recogida del premio.</p></div>
<div class="persona"><b>Otto Hahn y Fritz Strassmann</b><small>1879–1968 · 1902–1980 · Berlín</small><p>Químicos radiactivos. Strassmann, con un puesto de ayudante sin sueldo por negarse a afiliarse al partido nazi, hizo el análisis decisivo del bario.</p></div>
<div class="persona"><b>Lise Meitner</b><small>1878 – 1968 · Viena, Berlín, Estocolmo</small><p>Segunda mujer doctora en física en Viena; trabajó 30 años en Berlín. De origen judío, huyó en julio de 1938. Nunca quiso trabajar en la bomba: «no tendré nada que ver con una bomba».</p></div>
<div class="persona"><b>Otto Robert Frisch</b><small>1904 – 1979 · Copenhague, Birmingham</small><p>Sobrino de Meitner, físico austriaco. Acuñó la palabra «fisión» tomándola de la biología. Con Peierls redactó en 1940 el memorando que mostró que bastaban kilogramos de uranio-235 para una bomba.</p></div>
<div class="persona"><b>Leó Szilárd</b><small>1898 – 1964 · Budapest, Londres, Chicago</small><p>Concibió la reacción en cadena en 1933, la patentó, y se la regaló al Almirantazgo británico para que fuera secreta. Después de Hiroshima promovió una petición de científicos contra el empleo de la bomba.</p></div>
<div class="persona"><b>J. Robert Oppenheimer</b><small>1904 – 1967 · Berkeley, Los Álamos</small><p>Teórico, director científico de Los Álamos. En 1954 se le retiró la autorización de seguridad en un proceso por supuesta deslealtad.</p></div>
<div class="persona"><b>George Gamow y Geoffrey I. Taylor</b><small>1904–1968 · 1886–1975</small><p>Gamow explicó la desintegración alfa como efecto túnel; Taylor, experto en fluidos, midió la energía de Trinity con una fotografía.</p></div>
</div>

<section>
<h2>De la radiactividad a la fisión</h2>
<ol class="chain">
<li><b class="y">1928 <span>· Gamow: el efecto túnel</span></b><p>Una partícula α dentro del núcleo está rodeada de una barrera de potencial de Coulomb de unos 30 MeV, pero las α emitidas tienen 4-9 MeV. Clásicamente no podrían escapar. Gamow (y, por separado, Gurney y Condon) mostró que la onda penetra la barrera con probabilidad \(e^{-2G}\), y la integral explica la ley empírica de Geiger y Nuttall (1911): una variación de 24 órdenes de magnitud en la vida media entre el polonio-212 (0.3 µs) y el uranio-238 (4.5×10⁹ años), debida a un factor de solo dos en la energía. Fue la primera aplicación nuclear de la mecánica cuántica.</p></li>
<li><b class="y">1932 <span>· El neutrón</span></b><p>Los Joliot-Curie observaron una radiación penetrante al bombardear berilio con α y la tomaron por rayos γ. Chadwick demostró que era una partícula neutra de masa casi igual a la del protón. La estructura del núcleo (protones y neutrones, no protones y electrones) quedó clara, y se disponía de un proyectil sin carga que no es rechazado por el núcleo.</p></li>
<li><b class="y">1934 <span>· Fermi y los neutrones lentos</span></b><p>Fermi irradió todos los elementos de la tabla con neutrones. Descubrió que si los neutrones pasan primero por parafina se frenan y son capturados con mucha más probabilidad. Al irradiar uranio obtuvo radiactividades que atribuyó a elementos nuevos, transuránicos (93, 94): un error de interpretación; Ida Noddack propuso la idea de que el núcleo «se rompía en grandes fragmentos», pero nadie le hizo caso.</p></li>
<li><b class="y">1938-1939 <span>· Berlín, Kungälv y Copenhague</span></b><p>Hahn y Strassmann hallaron bario y lo comunicaron a Meitner. Ella y Frisch escribieron el artículo (enero de 1939), que se publicó en <em>Nature</em>; Frisch midió con una cámara de ionización los pulsos de energía de los fragmentos (confirmación experimental en pocos días). Bohr, que oyó la noticia a bordo del barco rumbo a EE. UU., propuso con Wheeler una teoría de la fisión: el isótopo uranio-235 es el responsable de la fisión por neutrones lentos.</p></li>
</ol>
<div class="eq key" data-name="Energía de enlace y energía de fisión">\[B=a_VA-a_SA^{2/3}-a_C\frac{Z(Z-1)}{A^{1/3}}-a_A\frac{(A-2Z)^2}{A}+\delta,\qquad Q\simeq 200\ \mathrm{MeV\ por\ fisión}.\]</div>
<div class="sim" data-sim="energia-enlace" data-title="La energía de enlace por nucleón y el balance de la fisión"></div>
<div class="sim-guide"><ul>
<li>Con \(A=235\) la fórmula da la energía de enlace por nucleón del uranio (7.6 MeV) y, al partirlo en dos, una liberación de unos 200 MeV. Si elige \(A=56\) (hierro) y lo parte, la energía se consume: el hierro es el final de la fusión estelar.</li>
<li>Los puntos rojos son las medidas; la fórmula los sigue con una diferencia menor de 0.1 MeV por nucleón en núcleos medianos y pesados.</li>
</ul></div>
<div class="box leyenda"><h4>Hahn, solo, ganó el Nobel</h4><p>En 1945 se anunció el Nobel de Química 1944 «a Otto Hahn por el descubrimiento de la fisión de los núcleos pesados». Meitner y Strassmann no fueron incluidos. Los archivos del comité (abiertos en 1990-1997, estudiados por Crawford, Sime y Walker) muestran que la propuesta se evaluó dentro de la comisión de química, que valoraba la química y desconocía la importancia de la contribución física de Meitner, y que el aislamiento político de los científicos alemanes y el carácter interdisciplinario del descubrimiento influyeron. Hahn, por su parte, minimizó en sus memorias el papel de Meitner, y nunca discutió su exclusión. Se la ha llamado «el mayor error de la historia del Nobel»; el elemento 109, meitnerio, lleva su nombre desde 1997.</p></div>
<div class="box epist"><h4>Cuando los datos esperan a la teoría adecuada</h4><p>Fermi vio la fisión en 1934 sin reconocerla: interpretó los productos como transuránicos porque esa era la hipótesis dominante, y los químicos que habrían podido corregirlo (Noddack) fueron ignorados por no tener un modelo del núcleo que permitiera un corte en dos mitades. Fue la teoría de la gota líquida de Bohr y Frenkel lo que permitió a Meitner y Frisch dar el paso. Es un buen ejemplo de la carga teórica de la observación (Hanson): hasta que existió el marco conceptual, el bario no podía «verse» como producto de la fisión. También ilustra la importancia de la diversidad de experiencias: la unión de un químico con un físico exiliado, que habían trabajado juntos y que aún se escribían.</p></div>
</section>

<section>
<h2>La cadena, la carta y la bomba</h2>
<ol class="chain">
<li><b class="y">1933 <span>· Szilárd y la idea de la cadena</span></b><p>Szilárd, esperando un semáforo en Southampton Row, imaginó que si un neutrón rompe un núcleo y libera dos neutrones, habría una cadena exponencial. Aún no se conocía la fisión; pensó en elementos ligeros. Patentó la idea y la cedió al Almirantazgo.</p></li>
<li><b class="y">agosto 1939 <span>· La carta Einstein–Szilárd</span></b><p>Szilárd redactó y Einstein firmó una carta al presidente Roosevelt: los trabajos de Fermi y de Szilárd hacían probable una reacción en cadena en una masa grande de uranio, con la que podrían construirse «bombas de un tipo nuevo y extremadamente poderoso»; Alemania había detenido la venta de uranio de las minas de Checoslovaquia. Alexander Sachs la entregó a Roosevelt en octubre. Nació el Comité del Uranio.</p></li>
<li><b class="y">1940-1941 <span>· El memorando Frisch–Peierls</span></b><p>En Birmingham, dos exiliados «enemigos extranjeros» calcularon que la masa crítica de uranio-235 puro no era de toneladas sino de menos de un kilogramo (en realidad unos 15 kg). Eso hizo posible una bomba y llevó a los británicos al comité MAUD, y de ahí, a EE. UU.</p></li>
<li><b class="y">2 diciembre 1942 <span>· Chicago Pile-1</span></b><p>Bajo las gradas de una cancha de squash de la Universidad de Chicago, Fermi hizo funcionar la primera pila nuclear: 6 toneladas de uranio metálico y 40 de óxido en un bloque de grafito de 7.5 m. Con barras de cadmio como control, llevó \(k\) hasta 1.0006 y mantuvo la cadena 28 minutos. El mensaje en clave: «El navegante italiano ha llegado al Nuevo Mundo».</p></li>
<li><b class="y">16 julio 1945 <span>· Trinity</span></b><p>A las 5:29 de la mañana, en el desierto de Jornada del Muerto (Nuevo México), explotó un artefacto de plutonio-239 de implosión: unos 21 kt. Meses antes, Oppenheimer, Fermi (que apostó con colegas si la atmósfera se incendiaría), Bethe y otros habían calculado y descartado esa posibilidad. Hiroshima (uranio, 6 de agosto) y Nagasaki (plutonio, 9 de agosto) causaron más de 100 000 muertos inmediatos.</p></li>
</ol>
<div class="sim" data-sim="cadena-neutrones" data-title="La reacción en cadena como proceso aleatorio"></div>
<div class="sim-guide"><ul>
<li>Con \(k=1.2\), el 69 % de las cadenas se apaga por azar en las primeras generaciones, aunque la media crezca. Con \(k=2\) la probabilidad de extinción baja al 20 %; con \(k=0.9\) todas se extinguen. La curva roja es el valor medio \(k^n\).</li>
<li>Esta probabilidad es la razón de que, en una bomba, hace falta una fuente de neutrones para el momento de la máxima compresión.</li>
</ul></div>
<div class="sim" data-sim="trinity-taylor" data-title="La fotografía de Trinity y el análisis dimensional de Taylor"></div>
<div class="sim-guide"><ul>
<li>Los puntos del radio de la bola de fuego frente al tiempo, en escalas logarítmicas, siguen una recta de pendiente 0.4 (la ley \(R\propto t^{2/5}\)). La energía se despeja con la densidad del aire y la constante \(\xi\approx1.03\) (calculada por Taylor con la integración numérica de la onda de choque): unos 20 kt.</li>
</ul></div>
<div class="box rivalidad"><h4>Los científicos y la bomba</h4><p>Los físicos del Proyecto Manhattan no tuvieron una sola actitud. Los exiliados (Szilárd, Franck, Bethe, Teller) trabajaron convencidos de que Alemania podía hacerlo antes. Cuando se supo, en 1944-1945, que el programa alemán (con Heisenberg, que no logró una pila) estaba lejos, algunos (Rotblat, el único que abandonó Los Álamos por esa razón) plantearon que no tenía sentido seguir; Franck y Szilárd redactaron el Informe Franck (junio de 1945) recomendando una demostración en un lugar deshabitado, y la petición de Szilárd de julio, firmada por 70 científicos, no llegó al presidente Truman. Oppenheimer, director de Los Álamos, dijo que los físicos «han conocido el pecado» y se opuso después a la bomba de hidrógeno, lo que le costó el proceso de 1954. El debate sobre la responsabilidad, que reaparece con la inteligencia artificial y la biología, es parte de esta historia.</p></div>
<div class="box leyenda"><h4>«Me he convertido en la Muerte»</h4><p>La cita del Bhagavad Gita («Ahora me he convertido en la Muerte, el destructor de mundos») la dijo Oppenheimer en 1965, en un documental de televisión, y la contó como un recuerdo del momento de la explosión. Su hermano Frank, que estaba allí, recordó que Robert solo dijo: «Funcionó». Es plausible que le viniera a la mente, pero la forma teatral viene de la rememoración, no del registro contemporáneo. Hay muchas «últimas palabras» así en la historia de la ciencia: se fijan con el relato de los años siguientes.</p></div>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Con \(U^{235}+n\to Ba^{141}+Kr^{92}+3n\) y las masas atómicas (235.0439, 1.00866, 140.9144, 91.9262 u), calcule la energía de la reacción.
<details><summary>Respuesta</summary><p>\(\Delta m=0.1860\) u; \(Q=0.1860\times931.5=173\) MeV (las demás fisiones y la desintegración de los fragmentos elevan el total a 200 MeV).</p></details></li>
<li><span class="lvl">Básico</span>¿Cuántos kilotones de TNT son un kilogramo de U-235 completamente fisionado? (1 kt = 4.184×10¹² J)
<details><summary>Respuesta</summary><p>\(N=6.02\times10^{23}\times1000/235=2.56\times10^{24}\) núcleos; \(\times200\) MeV \(=8.2\times10^{13}\) J = 19.6 kt.</p></details></li>
<li><span class="lvl">Intermedio</span>Con \(k=2\) por generación, ¿cuántas generaciones hacen falta para pasar de 1 neutrón a \(10^{24}\)?
<details><summary>Respuesta</summary><p>\(2^n=10^{24}\Rightarrow n=79.7\) generaciones: del orden de 10⁻⁸ s cada una, 0.8 µs en total. Por eso una explosión dura microsegundos.</p></details></li>
<li><span class="lvl">Intermedio</span>Con el análisis dimensional, muestre que \(R\propto(Et^2/\rho)^{1/5}\) es la única combinación de \(E\), \(\rho\) y \(t\) con unidades de longitud.
<details><summary>Respuesta</summary><p>\([E]=ML^2T^{-2}\), \([\rho]=ML^{-3}\), \([t]=T\). \(E^a\rho^bt^c\): \(a+b=0\), \(2a-3b=1\), \(-2a+c=0\) → \(a=1/5\), \(b=-1/5\), \(c=2/5\).</p></details></li>
<li><span class="lvl">Avanzado</span>Con la fotografía de Trinity a \(t=15\) ms, el radio es 106.5 m. Estime la energía (\(\rho=1.2\) kg/m³, \(\xi=1.033\)).
<details><summary>Respuesta</summary><p>\(E=\rho R^5/(\xi^5t^2)=1.2\times1.38\times10^{10}/(1.18\times2.25\times10^{-4})=6.2\times10^{13}\) J ≈ 15 kt: el orden de magnitud correcto con un solo punto (el ajuste global da 20 kt).</p></details></li>
<li><span class="lvl">Avanzado</span>¿Qué obligaciones tiene un científico respecto de las aplicaciones de su trabajo? Discuta los casos de Meitner, Szilárd y Oppenheimer.
<details><summary>Respuesta</summary><p>Meitner se negó a participar; Szilárd promovió la carta y después la oposición al uso; Oppenheimer dirigió y después se opuso a la bomba H. No hay una respuesta única: depende de si se concibe la ciencia como neutra, si se cree que el saber puede esconderse y de quién decide su uso. El Informe Franck y la petición de Szilárd muestran que algunos científicos intentaron la deliberación política antes de la decisión.</p></details></li>
</ol>
