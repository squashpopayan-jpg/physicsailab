<p class="lead">El domingo 7 de octubre de 1900, Heinrich Rubens y su mujer fueron a tomar el té a casa de Max Planck, en Berlín. Rubens contó que sus medidas del infrarrojo lejano mostraban que la ley de Wien fallaba y que la radiación crecía, para longitudes de onda largas, como la temperatura. Esa misma noche, Planck buscó una fórmula que se pareciera a Wien en un extremo y a la nueva medida en el otro. Escribió una interpolación; Rubens la comprobó al día siguiente y encajaba. Planck la presentó el 19 de octubre. «La ley había sido adivinada», escribió después, y buscó durante dos meses una razón. La encontró el 14 de diciembre de 1900, a costa de una hipótesis que él mismo consideró un «acto de desesperación»: la energía de un oscilador solo puede intercambiarse en paquetes \(h\nu\).</p>

<div><b>Época</b>1859 – 1925</div>

<div><b>Idea</b>la energía se intercambia en cuantos</div>

<section>
<h2>El cuerpo negro: un problema industrial</h2>
<div class="box contexto"><h4>Lámparas, acero y el Instituto Imperial de Física</h4><p>La radiación térmica no era una curiosidad: Alemania, que quería competir con la iluminación de Edison y con los hornos de acero ingleses, fundó en 1887 el Physikalisch-Technische Reichsanstalt, donde Lummer, Pringsheim, Kurlbaum y Rubens medían con bolómetros la emisión de cavidades calentadas (el «cuerpo negro» realizado como un horno con un orificio). Kirchhoff (1859) había demostrado que la emisión de un cuerpo en equilibrio con la radiación depende solo de la temperatura y de la longitud de onda, y no del material: una función universal. Hallarla era hallar algo fundamental, y además útil para la normalización de la luz y la medida de temperaturas elevadas.</p></div>
<div class="people">
<div class="persona"><b>Max Planck</b><small>1858 – 1947 · Kiel, Berlín</small><p>Hijo de un jurista, pianista excelente, conservador y creyente. Termodinamista, enemigo de los átomos de Boltzmann hasta 1900. Catedrático en Berlín desde 1892. Perdió un hijo en la Primera Guerra Mundial y otro, Erwin, fue ejecutado por la Gestapo en 1945 por el atentado contra Hitler.</p></div>
<div class="persona"><b>Wilhelm Wien</b><small>1864 – 1928 · Berlín, Wurzburgo</small><p>Experimentador del Reichsanstalt. Dedujo en 1893 la ley del desplazamiento y en 1896 su fórmula del espectro (Nobel 1911).</p></div>
<div class="persona"><b>Heinrich Rubens y Ferdinand Kurlbaum</b><small>1865–1922 · 1857–1927</small><p>Midieron con el método de los «rayos residuales» el infrarrojo lejano (51 µm) y descubrieron la proporcionalidad con \(T\). Sin ellos Planck no habría tenido la fórmula.</p></div>
<div class="persona"><b>Lord Rayleigh y James Jeans</b><small>1842–1919 · 1877–1946</small><p>Rayleigh (junio de 1900) propuso una ley aplicando el equipartición al campo; Jeans corrigió un factor 2 en 1905. El resultado clásico, correcto para longitudes largas, diverge hacia el ultravioleta.</p></div>
<div class="persona"><b>Albert Einstein</b><small>1879 – 1955 · Berna, Zúrich, Berlín</small><p>Funcionario de la oficina de patentes de Berna en 1905, doctor por Zúrich. Su artículo sobre la luz (marzo de 1905) fue, según él mismo, «muy revolucionario».</p></div>
<div class="persona"><b>Philipp Lenard</b><small>1862 – 1947 · Heidelberg</small><p>Premio Nobel 1905 por los rayos catódicos. Sus datos del efecto fotoeléctrico (1902) fueron la base de Einstein. Después se volvió nazi y atacó la «física judía».</p></div>
<div class="persona"><b>Arthur Compton y Peter Debye</b><small>1892–1962 · 1884–1966</small><p>Compton, en St. Louis, midió el desplazamiento de rayos X dispersados (1923). Debye, en Zúrich, llegó al mismo resultado por teoría casi a la vez.</p></div>
</div>
</section>

<section>
<h2>Cómo se llegó a la ley de Planck</h2>
<ol class="chain">
<li><b class="y">1859-1884 <span>· Kirchhoff, Stefan y Boltzmann</span></b><p>Kirchhoff demostró la universalidad. Stefan encontró empíricamente (1879) que la potencia total emitida crece como \(T^4\), y Boltzmann la dedujo en 1884 aplicando la termodinámica a la presión de radiación de Maxwell (capítulo 21): \(j=\sigma T^4\).</p></li>
<li><b class="y">1893-1896 <span>· Wien</span></b><p>Wien probó que el espectro tiene la forma \(\lambda^{-5}f(\lambda T)\), con el máximo a \(\lambda_{\max}T=\) constante. Con un argumento (no del todo sólido) propuso \(f\propto e^{-b/\lambda T}\). Describía bien los datos de Paschen en el visible y el infrarrojo próximo.</p></li>
<li><b class="y">1900 <span>· La interpolación</span></b><p>Rubens y Kurlbaum mostraron que Wien fallaba en el infrarrojo lejano. Planck propuso \(B_\lambda=\tfrac{2hc^2}{\lambda^5}\big/(e^{hc/\lambda kT}-1)\): para \(\lambda\) corta tiende a Wien, para \(\lambda\) larga a \(2ckT/\lambda^4\).</p></li>
<li><b class="y">14 dic 1900 <span>· La deducción</span></b><p>Para explicar su fórmula, Planck calculó la entropía de \(N\) osciladores con la combinatoria de Boltzmann, que había rechazado por años. Para contar necesitaba repartir la energía total en un número entero de elementos finitos \(\varepsilon=h\nu\); hizo \(\varepsilon\to0\) al final, pero comprobó que la ley solo se obtiene con \(\varepsilon\) <em>finito</em>. De sus datos extrajo \(h=6.55\times10^{-34}\) J·s y \(k=1.346\times10^{-23}\) J/K, y de \(k\), el número de Avogadro (6.17×10²³) y la carga del electrón (1.56×10⁻¹⁹ C): mejores que cualquier otra determinación de entonces.</p></li>
</ol>
<div class="eq key" data-name="Ley de Planck">\[B_\lambda(T)=\frac{2hc^2}{\lambda^5}\,\frac{1}{e^{hc/\lambda kT}-1}\ \xrightarrow{\ \lambda\to\infty\ }\ \frac{2ckT}{\lambda^4},\qquad \lambda_{\max}T=\frac{hc}{4.9651\,k}.\]</div>
<div class="sim" data-sim="cuerpo-negro" data-title="El cuerpo negro: Wien, Rayleigh–Jeans y Planck"></div>
<div class="sim-guide"><ul>
<li>Active y desactive las curvas clásicas: Rayleigh–Jeans (discontinua) explota hacia el ultravioleta; Wien (punteada) se desvía en la zona larga. Solo Planck sigue a ambas.</li>
<li>Suba la temperatura a 8000 K: el máximo se desplaza hacia el azul (ley de Wien) y la potencia total crece como \(T^4\). A 5000 K el máximo está en 580 nm.</li>
</ul></div>
<div class="box leyenda"><h4>«La catástrofe ultravioleta llevó a Planck a su ley»</h4><p>Es la versión de los manuales. En 1900 Planck no pensaba en el equipartición de Rayleigh y Jeans (cuyo «fracaso» fue formulado con tal nombre por Ehrenfest en 1911). Su problema era la entropía de la radiación, y los datos del infrarrojo. Kuhn (1978) sostiene incluso que Planck no introdujo el cuanto en 1900 en el sentido que luego se le atribuyó: usaba elementos de energía como recurso de conteo y no admitió la discontinuidad física hasta que Einstein y Ehrenfest (1905-1906) la señalaron. Hay historiadores que discrepan, pero es un caso claro de cómo la historia posterior reordena lo que fue una trayectoria incierta.</p></div>
<div class="box epist"><h4>Una fórmula adivinada y una teoría posterior</h4><p>La ley de Planck nació como un <em>ajuste</em> (curve fitting) guiado por dos límites asintóticos, y solo después recibió una teoría. Es un caso de «contexto de descubrimiento» sin lógica clara (Popper, Reichenbach) y de abducción: se pasa de los datos a una fórmula por analogía con la forma de otras. También muestra lo que Lakatos llamó una <em>anomalía</em> convertida en un programa: Planck quiso eliminar el cuanto durante una década y se dijo «reaccionario» de la física. Su carrera ilustra el famoso comentario: «una nueva verdad científica no triunfa porque convenza a sus oponentes, sino porque estos mueren y crece una generación que se familiariza con ella» (Planck, 1948). Y sin embargo, aquí fue Planck, en su cumbre, el que construyó la ruptura.</p></div>
</section>

<section>
<h2>Einstein: la luz como cuantos</h2>
<ol class="chain">
<li><b class="y">1902 <span>· Lenard</span></b><p>Lenard hizo incidir luz de arco sobre un metal en vacío y midió la energía de los electrones emitidos: era independiente de la intensidad (se variaba con la distancia al arco por un factor de un millón) y aumentaba con la frecuencia. Para la teoría ondulatoria, una luz más intensa debía dar electrones más energéticos y debía haber un retardo.</p></li>
<li><b class="y">1905 <span>· «Un punto de vista heurístico»</span></b><p>Einstein, partiendo de la entropía de la radiación de Wien (termodinámica estadística, sin usar la ley de Planck), mostró que a bajas intensidades la radiación se comporta como \(N\) partículas independientes de energía \(h\nu\). De ahí dedujo \(K_{\max}=h\nu-\phi\) y propuso comprobarla midiendo la tensión de frenado frente a \(\nu\). El título es cauteloso: «heurístico», un punto de vista que ayuda a organizar datos y no una afirmación definitiva.</p></li>
<li><b class="y">1907 <span>· Los sólidos</span></b><p>Einstein aplicó el cuanto a los átomos de un sólido, tratados como osciladores de frecuencia \(\nu_E\), y obtuvo la caída del calor específico a baja temperatura, un resultado que no tenía nada que ver con la radiación. Aquí el cuanto no era una propiedad de la luz sino de la materia.</p></li>
<li><b class="y">1916 <span>· Millikan, a su pesar</span></b><p>Millikan dedicó diez años a refutar la ecuación fotoeléctrica y la confirmó con gran precisión en 1916 con superficies de sodio y litio limpiadas en vacío con una cuchilla: \(h=6.57\times10^{-34}\), con 0.5 % de error. Concluyó, sin embargo, que la «teoría corpuscular» de Einstein era «insostenible», aunque su ecuación era perfecta.</p></li>
<li><b class="y">1923 <span>· Compton</span></b><p>Compton hizo incidir rayos X de 71 pm sobre grafito y vio que a 90° la radiación dispersada tenía una componente de longitud de onda mayor en 2.4 pm. Con el fotón con momento \(h/\lambda\) y la conservación del momento y de la energía, \(\Delta\lambda=(h/m_ec)(1-\cos\theta)\). Esa colisión «bola de billar» entre un fotón y un electrón convenció a casi todos.</p></li>
</ol>
<div class="eq key" data-name="Ecuación fotoeléctrica y desplazamiento de Compton">\[K_{\max}=h\nu-\phi,\qquad \Delta\lambda=\frac{h}{m_ec}(1-\cos\theta).\]</div>
<div class="sim" data-sim="fotoelectrico" data-title="El efecto fotoeléctrico: la energía depende del color"></div>
<div class="sim-guide"><ul>
<li>Con 400 nm sobre sodio (2.28 eV) la tensión de frenado es 0.82 V. Suba la intensidad: más electrones, pero la energía máxima no cambia. Pase a 600 nm: no hay emisión, ni con intensidad 3.</li>
<li>La pendiente de la recta \(V_p(\nu)\) es \(h/e\): es la que midió Millikan.</li>
</ul></div>
<div class="sim" data-sim="calor-einstein" data-title="El calor específico de los sólidos según Einstein"></div>
<div class="sim-guide"><ul>
<li>Con \(\theta_E=1300\) K (diamante), a 300 K el calor específico es unos 5.8 J/(mol·K), una quinta parte de Dulong y Petit. Suba \(\theta_E\) o baje la temperatura: se aplana. Es la prueba de que la física clásica falla en materia, no solo en luz.</li>
</ul></div>
<div class="box rivalidad"><h4>Millikan, Planck y el fotón que nadie quería</h4><p>Hasta 1923 casi nadie aceptaba el fotón: Planck lo juzgó un exceso de Einstein; Lorentz y Bohr preferían los osciladores cuantizados con luz clásica; Millikan lo veía imposible por la interferencia. En 1924 Bohr, Kramers y Slater propusieron una teoría que prescindía de la conservación de la energía en procesos individuales para evitar el fotón, y las medidas de Bothe y Geiger (1925) la refutaron. Einstein sostuvo la partícula de luz en solitario durante dieciocho años. Una de las lecciones es que una hipótesis que explica bien una cosa («heurística») puede tardar décadas en ser aceptada si choca con otra evidencia sólida (la interferencia).</p></div>
<div class="box leyenda"><h4>«Einstein ganó el Nobel por la relatividad»</h4><p>Recibió el de 1921 (otorgado en 1922) «por su contribución a la física teórica, y especialmente por el descubrimiento de la ley del efecto fotoeléctrico». El comité, conservador, no se decidía sobre la relatividad, que consideraba especulativa (había un informe de 1920 de un miembro, Gullstrand, contra ella). Es un detalle que pesa sobre la historia: la prueba más sólida de la existencia del fotón vino de uno de sus trabajos menos aceptados.</p></div>
</section>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule \(\lambda_{\max}\) del Sol (5772 K) y de una persona (310 K).
<details><summary>Respuesta</summary><p>\(\lambda_{\max}=2.898\times10^{-3}/T\): 502 nm (verde-azul) y 9.35 µm (infrarrojo medio).</p></details></li>
<li><span class="lvl">Básico</span>¿Cuál es la energía en eV de un fotón de 400 nm? ¿Qué tensión de frenado se espera sobre sodio (\(\phi=2.28\) eV)?
<details><summary>Respuesta</summary><p>\(E=1239.84/400=3.10\) eV; \(V_p=3.10-2.28=0.82\) V.</p></details></li>
<li><span class="lvl">Intermedio</span>Con los datos de Planck de 1900 (\(k=1.346\times10^{-23}\) J/K), calcule el número de Avogadro con \(R=8.314\) J/(mol·K).
<details><summary>Respuesta</summary><p>\(N_A=R/k=6.18\times10^{23}\), un 2.6 % mayor que el actual; con \(F=96485\) C/mol, \(e=F/N_A=1.56\times10^{-19}\) C.</p></details></li>
<li><span class="lvl">Intermedio</span>Rayos X de 71 pm se dispersan 90° sobre grafito. ¿Cuál es la longitud de onda dispersada?
<details><summary>Respuesta</summary><p>\(\Delta\lambda=h/(m_ec)=2.43\) pm; \(\lambda'=73.4\) pm.</p></details></li>
<li><span class="lvl">Avanzado</span>Muestre que para \(\lambda\gg hc/kT\) la ley de Planck se reduce a Rayleigh–Jeans y que, integrada, la de Rayleigh–Jeans da una emitancia infinita.
<details><summary>Respuesta</summary><p>\(e^x-1\approx x\) con \(x=hc/\lambda kT\): \(B\approx2ckT/\lambda^4\). La integral \(\int_0^\infty\lambda^{-4}\,d\lambda\) diverge en \(\lambda\to0\).</p></details></li>
<li><span class="lvl">Avanzado</span>La ecuación de Einstein de 1905 era una predicción arriesgada. ¿Qué dato le habría hecho falsa? ¿Por qué Millikan, al confirmarla, no se convenció del fotón?
<details><summary>Respuesta</summary><p>Una pendiente distinta de \(h/e\), una dependencia con la intensidad o una frecuencia umbral que variara con ella. Millikan aceptó la ecuación como descripción de los datos pero no su interpretación: la luz como onda explicaba todo el resto (interferencia), y sin un modelo coherente prefirió una «teoría de disparo» de la energía interna del átomo. Es la distinción entre una <em>ley empírica</em> y su <em>interpretación teórica</em>.</p></details></li>
</ol>
<div class="box note"><h4>Para profundizar</h4><p>M. Planck, «Zur Theorie des Gesetzes der Energieverteilung im Normalspectrum» (1900). A. Einstein, «Über einen die Erzeugung und Verwandlung des Lichtes betreffenden heuristischen Gesichtspunkt», <em>Annalen der Physik</em> (1905). T. Kuhn, <em>Black-Body Theory and the Quantum Discontinuity</em> (1978). H. Kangro, <em>Early History of Planck's Radiation Law</em> (1976). A. Pais, <em>Subtle is the Lord</em> (1982). J. Heilbron, <em>The Dilemmas of an Upright Man</em> (1986). J. Jeans, <em>Historia de la física</em> (1948), cap. XI. A. Rooney, <em>La historia de la física</em>, cap. 6.</p></div>
