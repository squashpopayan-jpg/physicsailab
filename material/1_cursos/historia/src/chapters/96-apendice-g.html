<p class="lead">Un vocabulario mínimo para leer el cuaderno. Las definiciones son breves y se refieren al uso que tienen aquí.</p>

<section>
<h2>Epistemología</h2>
<dl>
<dt>Abducción</dt><dd>Inferencia hacia la mejor explicación: de unos datos se salta a la hipótesis que los explicaría. Peirce la distinguió de la deducción y de la inducción. Es el modo de razonar de Kepler y de Planck en 1900.</dd>
<dt>Ad hoc</dt><dd>Hipótesis añadida solo para salvar una teoría de una refutación, sin consecuencias comprobables propias. Para Popper, rechazable; Lakatos la ve como señal de un programa degenerativo.</dd>
<dt>Carga teórica de la observación</dt><dd>Lo que se observa depende de las teorías con las que se interpreta, sobre todo cuando se usan instrumentos (Hanson, Kuhn). Ejemplos: Galileo y el telescopio, Kirchhoff y el espectroscopio.</dd>
<dt>Consiliencia</dt><dd>Concordancia de resultados de dominios distintos como prueba de una teoría (Whewell). Maxwell y la luz.</dd>
<dt>Contexto de descubrimiento / de justificación</dt><dd>Distinción de Reichenbach entre cómo se llega a una idea y cómo se la prueba. La historia muestra que se entrelazan.</dd>
<dt>Convencionalismo</dt><dd>Tesis (Poincaré, Duhem) de que ciertos enunciados, como la geometría o la sincronización de relojes, se fijan por convención.</dd>
<dt>Experimento crucial</dt><dd>Experimento que decidiría entre dos teorías. Duhem y Quine sostuvieron que no existe en sentido estricto. Foucault y la luz en el agua.</dd>
<dt>Falsacionismo</dt><dd>Criterio de Popper: una teoría es científica si puede ser refutada por la observación.</dd>
<dt>Inconmensurabilidad</dt><dd>Imposibilidad de traducir sin resto los conceptos de dos paradigmas (Kuhn, Feyerabend). La «masa» de Newton y la de Einstein.</dd>
<dt>Navaja de Occam</dt><dd>No multiplicar las entidades sin necesidad.</dd>
<dt>Paradigma y ciencia normal</dt><dd>Para Kuhn, el conjunto de ejemplos, métodos y creencias de una comunidad que define los problemas legítimos; la ciencia normal resuelve rompecabezas dentro de él hasta que las anomalías acumuladas provocan una crisis y una revolución.</dd>
<dt>Programa de investigación</dt><dd>Estructura de Lakatos: un núcleo duro protegido por un cinturón de hipótesis auxiliares; es progresivo si predice hechos nuevos, degenerativo si solo parchea.</dd>
<dt>Realismo e instrumentalismo</dt><dd>El realismo sostiene que las teorías describen cómo es el mundo; el instrumentalismo, que son instrumentos de predicción. Bohr y Einstein; Osiander y Copérnico.</dd>
<dt>Subdeterminación</dt><dd>Los mismos datos son compatibles con teorías distintas. Lorentz–Poincaré y Einstein; las interpretaciones de la mecánica cuántica.</dd>
<dt>Tesis de Duhem–Quine</dt><dd>Una hipótesis nunca se contrasta sola, sino junto con un conjunto de hipótesis auxiliares: ante un resultado negativo no está lógicamente determinado qué parte rechazar.</dd>
</dl>
</section>

<section>
<h2>Historia y sociología</h2>
<dl>
<dt>Descubrimiento simultáneo</dt><dd>Aparición independiente de la misma idea en lugares distintos (Merton): cálculo, conservación de la energía, selección natural.</dd>
<dt>Ley de Stigler</dt><dd>Ninguna ley científica lleva el nombre de su descubridor (broma que Stigler atribuyó a Merton).</dd>
<dt>Historia whig</dt><dd>Relato del pasado como un progreso inevitable hacia el presente, con buenos y malos (Butterfield).</dd>
<dt>Presentismo</dt><dd>Juzgar el pasado con las categorías del presente.</dd>
<dt>Programa fuerte</dt><dd>Posición de la sociología del conocimiento (Bloor, Barnes): explicar con las mismas causas sociales las creencias verdaderas y las falsas.</dd>
<dt>Regresión del experimentador</dt><dd>Para decidir si un experimento sale bien hay que saber qué resultado es el correcto, y para saberlo hay que hacer el experimento (Collins).</dd>
<dt>Serendipia</dt><dd>Hallazgo afortunado de algo no buscado; Pasteur: la suerte favorece a la mente preparada. Röntgen, Becquerel, Penzias y Wilson.</dd>
<dt>Tecnociencia</dt><dd>Organización de la ciencia con grandes instrumentos, presupuestos y equipos (Proyecto Manhattan, CERN, LIGO).</dd>
</dl>
</section>

<section>
<h2>Física</h2>
<dl>
<dt>Cuanto</dt><dd>Paquete mínimo de una cantidad física, como la energía \(h\nu\).</dd>
<dt>Éter luminífero</dt><dd>Medio hipotético de las ondas luminosas en el siglo XIX.</dd>
<dt>Entrelazamiento</dt><dd>Correlación entre sistemas cuánticos que no puede describirse con estados separados (Schrödinger, 1935).</dd>
<dt>Equivalencia (principio de)</dt><dd>La caída libre no se distingue de la ausencia de gravedad localmente; fundamento de la relatividad general.</dd>
<dt>Intervalo</dt><dd>Cantidad \(c^2t^2-x^2-y^2-z^2\), invariante por transformaciones de Lorentz.</dd>
<dt>Vieja teoría cuántica</dt><dd>Reglas de cuantización de 1900-1925 aplicadas con mecánica clásica (Bohr, Sommerfeld), antes de la mecánica cuántica.</dd>
</dl>
</section>
