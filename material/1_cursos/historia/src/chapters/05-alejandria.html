<p class="lead">Hacia 240 a. C., el bibliotecario de Alejandría hizo cavar la historia más famosa de la geometría aplicada: un pozo de Siena donde, al mediodía del solsticio, el Sol se miraba en el fondo del agua, y un palo vertical en Alejandría que, ese mismo día, proyectaba sombra. Eratóstenes dividió una cifra por otra y midió la Tierra con un error que depende de qué estadio se use. Sus colegas le pusieron el apodo «Beta», el segundo: segundo en todo, primero en nada. Fue el hombre que mejor midió el mundo.</p>

<section>
<h2>Un museo con mecenas</h2>
<div class="box contexto"><h4>Los Ptolomeos compran prestigio</h4><p>A la muerte de Alejandro (323 a. C.) sus generales se repartieron el imperio. Ptolomeo I se quedó con Egipto y fundó, con ayuda del ateniense Demetrio de Falero, el <em>Museion</em> («casa de las Musas»): un conjunto de salas de estudio, comedores y jardines donde los sabios recibían sueldo del rey y no tenían que enseñar. Allí cabían matemáticos, astrónomos, médicos, filólogos y poetas. La Biblioteca anexa llegó, según las cifras antiguas (quizá exageradas), a cientos de miles de rollos. Los reyes mandaban confiscar los libros de los barcos que atracaban en el puerto: se copiaban y se devolvía la copia, cuenta Galeno. Era propaganda dinástica: una monarquía extranjera, griega en un país egipcio, se legitimaba como centro del saber. El poeta Timón de Fliunte se burló de los eruditos como «ganado de la jaula de las Musas», alimentados en la jaula del rey.</p></div>
<p>Con esa financiación y con la lengua griega como idioma común, la matemática y la astronomía dieron un salto. Por primera vez se organizaron las ciencias en una institución permanente, con textos compartidos, catálogos y discípulos. Se imponía una tradición nueva: los resultados se publicaban como <em>demostraciones</em>, y se comparaban con medidas.</p>
<div class="people">
<div class="persona"><b>Euclides</b><small>c. 325 – c. 265 a. C. · Alejandría</small><p>Casi nada se sabe de su vida. Los <em>Elementos</em> (c. 300 a. C.) ordenaron la geometría en definiciones, postulados y proposiciones demostradas, y fueron el libro de texto de más larga vida. Su <em>Óptica</em> trata la visión con rayos rectilíneos.</p></div>
<div class="persona"><b>Aristarco de Samos</b><small>c. 310 – c. 230 a. C. · Samos, Alejandría</small><p>Midió las distancias relativas del Sol y la Luna y propuso que la Tierra gira alrededor del Sol. Su único texto conservado es <em>Sobre los tamaños y distancias del Sol y la Luna</em>.</p></div>
<div class="persona"><b>Arquímedes</b><small>c. 287 – 212 a. C. · Siracusa</small><p>Matemático, mecánico, físico. Palanca, centros de gravedad, hidrostática, el valor de π, el cálculo de áreas y volúmenes de formas curvas. Murió en el saqueo de Siracusa por los romanos.</p></div>
<div class="persona"><b>Eratóstenes</b><small>c. 276 – c. 194 a. C. · Cirene, Atenas, Alejandría</small><p>Bibliotecario jefe. Geógrafo, matemático (la criba para hallar primos), poeta. Midió la circunferencia de la Tierra y la oblicuidad de la eclíptica.</p></div>
<div class="persona"><b>Apolonio de Perge</b><small>c. 262 – c. 190 a. C. · Perge, Alejandría</small><p>«El gran geómetra». Su tratado sobre las cónicas (elipse, parábola, hipérbola) será esencial para Kepler y Newton. Demostró la equivalencia entre epiciclos y excéntricas.</p></div>
<div class="persona"><b>Ctesibio</b><small>fl. c. 285 – 222 a. C. · Alejandría</small><p>Ingeniero. Inventó la bomba de pistón, el reloj de agua con regulación del caudal y mecanismos de aire comprimido.</p></div>
<div class="persona"><b>Hiparco de Nicea</b><small>c. 190 – c. 120 a. C. · Nicea, Rodas</small><p>El mayor astrónomo de la antigüedad. Descubrió la precesión de los equinoccios, hizo un catálogo estelar, fundó la trigonometría con tablas de cuerdas y modeló el Sol y la Luna con excéntricas.</p></div>
<div class="persona"><b>Herón de Alejandría</b><small>fl. c. 62 d. C.</small><p>Ingeniero. Describió la eolípila (una turbina de vapor de juguete), puertas automáticas, autómatas y la ley de reflexión por el camino más corto.</p></div>
<div class="persona"><b>Claudio Ptolomeo</b><small>c. 100 – c. 170 d. C. · Alejandría</small><p>Autor del <em>Almagesto</em> (c. 150), la <em>Geografía</em>, la <em>Óptica</em> y la <em>Harmónica</em>. Su sistema astronómico dominó durante 14 siglos.</p></div>
</div>
</section>

<section>
<h2>Eratóstenes y el tamaño de la Tierra</h2>
<p>Que la Tierra era una esfera estaba aceptado: Aristóteles lo había argumentado (la sombra circular en los eclipses de Luna, las estrellas distintas visibles desde latitudes distintas) y citaba una estimación de 400 000 estadios, de origen desconocido. Medirla era otra cosa. Eratóstenes, hacia 240 a. C., aplicó la semejanza de triángulos que ya había usado Tales con la sombra de la pirámide (capítulo 3), a una escala planetaria.</p>
<ol class="chain">
<li><b class="y">El dato <span>· un informe de viaje</span></b><p>Los viajeros decían que en Siena, al sur, el solsticio de verano a mediodía el Sol iluminaba el fondo de los pozos: estaba en el cenit y los objetos verticales no proyectaban sombra.</p></li>
<li><b class="y">La medición <span>· Alejandría</span></b><p>Ese día, en Alejandría, un gnomon vertical sí proyectaba sombra. Midiéndola, Eratóstenes obtuvo un ángulo de 1/50 de circunferencia, 7.2°.</p></li>
<li><b class="y">La suposición <span>· geometría</span></b><p>El Sol está tan lejos que sus rayos llegan paralelos. Entonces el ángulo en Alejandría es el ángulo en el centro de la Tierra entre las dos ciudades. Si además están en el mismo meridiano, los 7.2° corresponden al arco que las separa.</p></li>
<li><b class="y">La distancia <span>· caravanas</span></b><p>La distancia entre ambas ciudades, de 5000 estadios, la daban los bematistas, agrimensores que contaban pasos, o los tiempos de camello. La circunferencia resulta \(50\times5000=250\,000\) estadios (después se corrigió a 252 000, divisible por 60).</p></li>
</ol>
<div class="eq key" data-name="Medida de Eratóstenes">\[C=\frac{360^\circ}{\Delta\varphi}\,d\qquad\Longleftrightarrow\qquad R=\frac{d}{\Delta\varphi}\;(\Delta\varphi\text{ en radianes}).\]</div>
<div class="sim" data-sim="eratostenes" data-title="Medir la Tierra con una sombra"></div>
<div class="sim-guide"><ul>
<li>Con el estadio egipcio de 157.5 m el resultado es de 39 375 km, apenas un 1.6 % por debajo de los 40 008 km del meridiano; con el estadio ático de 185 m, 46 250 km (+16 %). No sabemos cuál usó, y por eso la afirmación «lo midió con 1 % de error» es optimista.</li>
<li>Pruebe a cambiar el ángulo en 0.5° o la distancia en 500 estadios: el error es del 7 % y del 10 % respectivamente. Su gran mérito fue la idea y el método, más que la precisión.</li>
</ul></div>
<div class="box rivalidad"><h4>El apodo «Beta»</h4><p>La Suda (léxico bizantino) cuenta que Eratóstenes era llamado «Beta» porque era segundo en cada campo y primero en ninguno, y «Pentatlón» por la misma razón. Tratándose de quien midió la Tierra, creó la geografía matemática y dirigió la Biblioteca, el apodo suena a envidia profesional. Es un caso típico: la comunidad de eruditos siempre fue un ambiente competitivo, con burlas de colegas.</p></div>
</section>

<section>
<h2>Aristarco: el Sol grande y la Tierra que se mueve</h2>
<p>Aristarco intentó medir la distancia del Sol con una idea geométrica brillante: cuando la Luna está en cuarto, la línea Luna–Sol es perpendicular a la línea Tierra–Luna. Midiendo el ángulo \(\theta\) entre el Sol y la Luna visto desde la Tierra, se obtiene \(d_L/d_S=\cos\theta\). Aristarco midió \(\theta=87^\circ\), lo que da que el Sol está 19 veces más lejos que la Luna. Pero el ángulo verdadero es 89.85°, y la razón real es de 390. El método es correcto; el instrumento, no: cerca de 90° el coseno cambia muy rápido. Con eclipses lunares estimó los tamaños: el Sol sería unas 6 o 7 veces mayor que la Tierra (en realidad 109). Aun con ese error, el Sol resultaba mayor que la Tierra.</p>
<div class="sim" data-sim="aristarco" data-title="Un ángulo mal medido cambia por completo la escala del cielo"></div>
<div class="sim-guide"><ul>
<li>Con 87° la razón es 19.1; con 88°, 28.7; con 89.853°, 390. Cada grado extra multiplica la distancia por un factor grande: es un ejemplo de <em>problema mal condicionado</em>.</li>
</ul></div>
<p>Arquímedes, en el <em>Arenario</em>, atribuye a Aristarco la hipótesis de que «las estrellas fijas y el Sol permanecen inmóviles, y la Tierra gira alrededor del Sol en una circunferencia». Plutarco añade que el estoico Cleantes pensó que había que acusarlo de impiedad por «mover el hogar del mundo». Pero la hipótesis no prosperó, y por buenas razones científicas, no solo por prejuicio:</p>
<ul>
<li><b>Paralaje:</b> si la Tierra se mueve alrededor del Sol, las estrellas cercanas deberían desplazarse respecto de las lejanas a lo largo del año. Nadie lo observó (la primera medición es de Bessel en 1838, capítulo 9). Aristarco respondió que las estrellas están inmensamente lejos, lo que parecía absurdo.</li>
<li><b>Física:</b> una Tierra en movimiento, ¿por qué no deja atrás las nubes, los pájaros y las piedras que se lanzan hacia arriba? Los argumentos de Ptolomeo en el <em>Almagesto</em> I son de esta clase y no carecen de lógica con la física aristotélica.</li>
<li><b>Precisión:</b> el modelo con círculos centrados en el Sol no ajustaba mejor los planetas que el geocéntrico, y Aristarco no ofreció cálculos detallados.</li>
</ul>
<div class="box epist"><h4>Una hipótesis correcta que perdió por buenas razones</h4><p>En retrospectiva, Aristarco tuvo razón. Pero el heliocentrismo exigía renunciar a la física de Aristóteles y suponer distancias estelares gigantescas, y con la evidencia disponible, rechazarlo fue lo razonable. La «derrota» de Aristarco muestra que una teoría no triunfa solo por ser verdadera: necesita un marco físico compatible y pruebas decisivas. Copérnico tendrá que esperar a Galileo y a Newton para obtener ese marco (capítulos 9 a 14).</p></div>
</section>

<section>
<h2>Arquímedes: la física matemática</h2>
<p>Arquímedes es el primer físico en sentido moderno: formula principios, los demuestra con rigor geométrico y los aplica a máquinas reales. Vivió en Siracusa, gobernada por Hierón II, pariente suyo. Sus principales logros:</p>
<ol class="chain">
<li><b class="y">La palanca <span>· <em>Sobre el equilibrio de los planos</em></span></b><p>Dos pesos están en equilibrio cuando son inversamente proporcionales a sus distancias al punto de apoyo: \(F_1d_1=F_2d_2\). Lo demuestra a partir de postulados de simetría, sin experimentos: un caso de física deductiva. De aquí la frase atribuida por Pappo: «dadme un punto de apoyo y moveré la Tierra».</p></li>
<li><b class="y">Centros de gravedad</b><p>Calcula el centro de gravedad de triángulos, trapecios y segmentos de parábola, con la técnica de comparar figuras con una balanza.</p></li>
<li><b class="y">Hidrostática <span>· <em>Sobre los cuerpos flotantes</em></span></b><p>Un cuerpo sumergido recibe un empuje igual al peso del fluido desalojado: \(E=\rho_fVg\). La leyenda del baño y la corona de Hierón se cuenta en Vitruvio (siglo I a. C.), casi dos siglos después de su muerte.</p></li>
<li><b class="y">Geometría de lo curvo</b><p>Con el método de exhaución acota \(\pi\) con polígonos de 96 lados: \(3\tfrac{10}{71}<\pi<3\tfrac17\). Calcula el área de la parábola, el volumen de la esfera (dos tercios del cilindro circunscrito: lo que pidió en su tumba) y escribe el <em>Arenario</em>, donde estima cuántos granos de arena caben en el universo (\(\sim10^{63}\)) e inventa una notación para números enormes.</p></li>
</ol>
<div class="sim" data-sim="corona" data-title="La corona de Hierón: cuánto agua desplaza el fraude"></div>
<div class="sim-guide"><ul>
<li>Con 20 % de plata, una corona de 1 kg desplaza 8.7 cm³ de agua más que una de oro puro: es fácil de medir con una balanza de 1 g. Un fraude del 2 % necesita una precisión de décimas de gramo.</li>
<li>El método que se atribuye a Arquímedes (comparar volúmenes) funciona; el que contó Vitruvio (derramar agua de una vasija) es más difícil de ejecutar con precisión. Galileo propuso, en 1586, una balanza hidrostática que lo haría bien.</li>
</ul></div>
<div class="box leyenda"><h4>Los espejos ardientes</h4><p>Se cuenta que Arquímedes incendió la flota romana con espejos durante el asedio de Siracusa (213-212 a. C.). La historia no aparece en Polibio, Tito Livio ni Plutarco, que sí describen las máquinas de guerra (grúas que levantaban naves, catapultas). El primer relato es de Luciano, cuatro siglos después. Los intentos modernos (la serie MythBusters, el MIT en 2005) lograron prender madera solo en condiciones muy favorables. Se ha convertido en una prueba de cuánto crecen las leyendas con el tiempo.</p></div>
<div class="box fuente"><h4>El palimpsesto de Arquímedes</h4><blockquote>El <em>Método</em> de Arquímedes, donde explica cómo descubrió sus teoremas con una balanza imaginaria antes de demostrarlos con rigor, se creía perdido.</blockquote><p>Un manuscrito del siglo X con obras de Arquímedes fue raspado en 1229 y reutilizado para un libro de oraciones. En 1906, Johan Heiberg lo identificó en Constantinopla y fotografió la escritura inferior. Desapareció durante el siglo XX, reapareció en una subasta en 1998 (se vendió por 2.2 millones de dólares) y desde entonces se estudia con imágenes multiespectrales y rayos X. Revela que Arquímedes usaba un razonamiento casi integral: cortaba las figuras en rebanadas infinitesimales y las equilibraba como pesos. Es un hecho científico y a la vez una historia de cómo sobreviven los textos: por azar y por copistas.</p></div>
<div class="box epist"><h4>Descubrir y demostrar son cosas distintas</h4><p>Arquímedes distingue, en una carta a Eratóstenes, entre la manera como se <em>encuentra</em> un resultado (con una balanza imaginaria, heurística mecánica) y la manera como se <em>demuestra</em> (con exhaución, estrictamente lógica). Esa distinción entre «contexto de descubrimiento» y «contexto de justificación» (Reichenbach, 1938) es una de las más fértiles de la epistemología: los libros solo muestran la justificación, y la historia debe recuperar el descubrimiento.</p></div>
</section>

<section>
<h2>Hiparco y la máquina de Anticitera</h2>
<p>Hiparco (siglo II a. C.) combinó los registros babilonios (capítulo 2) con la geometría griega. Fue el primero en tabular cuerdas (la trigonometría), en construir un catálogo de unas 850 estrellas con su magnitud (la escala que aún usamos, invertida) y en estimar con la paralaje la distancia de la Luna; él y luego Ptolomeo dieron unos 60 radios terrestres (el valor real es 60.3).</p>
<p>Su descubrimiento estrella es la <span class="term">precesión de los equinoccios</span>: comparando la posición de Espiga (Spica) con las medidas de Timocares, cien años antes, notó que se había corrido unos 2° respecto del equinoccio. El eje terrestre oscila despacio como un trompo (un ciclo en 25 772 años) y los puntos equinocciales retroceden 50.3″ al año: 2.1° en 150 años. Hiparco, prudente, dio como mínimo 1° por siglo (36″ al año), un 30 % por debajo del valor real.</p>
<p>En 1900, unos buzos de esponjas hallaron frente a la isla de Anticitera un naufragio romano con estatuas, monedas y un bloque corroído de bronce. Derek de Solla Price lo reconoció en 1974 como un mecanismo de engranajes, y la tomografía de 2005 permitió leer sus inscripciones: unos 30 engranajes que calculaban las fases de la Luna, el calendario de los Juegos Olímpicos, los eclipses por el ciclo de Saros (el de 223 lunaciones del capítulo 2) y, probablemente, las posiciones de los planetas. Se fabricó entre 150 y 100 a. C., en una tradición de tecnología astronómica que el Occidente no igualó hasta los relojes astronómicos medievales, mil quinientos años después.</p>
</section>

<section>
<h2>Ptolomeo: el sistema que duró catorce siglos</h2>
<p>El <em>Almagesto</em> (c. 150 d. C.) reúne en trece libros una teoría completa del movimiento de los astros con la Tierra en reposo en el centro. Los planetas se mueven con una combinación de círculos: el <span class="term">deferente</span> (un círculo grande), el <span class="term">epiciclo</span> (uno pequeño cuyo centro recorre el deferente), la <span class="term">excéntrica</span> (la Tierra no está en el centro del deferente) y, la gran innovación de Ptolomeo, el <span class="term">ecuante</span>: un punto, distinto del centro del círculo, respecto del cual el centro del epiciclo avanza con velocidad angular uniforme.</p>
<p>El ecuante viola el principio platónico de movimiento circular uniforme <em>sobre el círculo</em>, y por ello fue criticado hasta Copérnico («una monstruosidad»). Pero daba mucho mejores resultados, y puede verse como una aproximación a la segunda ley de Kepler: en una órbita elíptica de baja excentricidad, el planeta se mueve con velocidad angular casi uniforme vista desde el <em>otro foco</em>, que está a una distancia \(2ae\) del Sol, el doble de lo que está el centro de la elipse. Eso es lo que hace Ptolomeo cuando «biseca la excentricidad».</p>
<div class="sim" data-sim="ecuante" data-title="El ecuante de Ptolomeo frente a la elipse de Kepler"></div>
<div class="sim-guide"><ul>
<li>Con Marte (\(e=0.0934\)) y ecuante bisecado, el error máximo es 0.15° (9 minutos de arco); sin ecuante, 5.4°. El modelo de Ptolomeo, con un artificio geométrico, daba la longitud de Marte con una precisión que no se superó hasta Tycho (capítulo 9).</li>
<li>Los 8′ de diferencia que Kepler descubrirá en 1604 respecto de los datos de Tycho son del mismo orden. Resolvió que el error no era de los datos sino del modelo, y de ahí nacieron las elipses (capítulo 10).</li>
</ul></div>
<div class="sim" data-sim="home-hero" data-num="Epiciclos" data-title="Un epiciclo es un movimiento heliocéntrico visto desde la Tierra"></div>
<div class="sim-guide"><ul>
<li>A la izquierda, el movimiento real (heliocéntrico) de Marte y la Tierra; a la derecha, la construcción de Ptolomeo con deferente y epiciclo. Las dos producen exactamente el mismo bucle, porque dos círculos con los periodos de la Tierra y de Marte son una descomposición del mismo movimiento relativo.</li>
<li>Para predecir el cielo daba igual cuál se usara; para decidir cuál es real, hacía falta otra cosa: las fases de Venus (Galileo, 1610), la paralaje estelar (Bessel, 1838) o la mecánica de Newton.</li>
</ul></div>
<h3>La óptica de Ptolomeo: una tabla demasiado perfecta</h3>
<p>En su <em>Óptica</em>, Ptolomeo mide el ángulo de refracción del aire al agua para ángulos de incidencia de 10° a 80°. Sus valores coinciden con la ley que descubrirán Snell y Descartes 1500 años después, con un error pequeño (la mayor diferencia es de 2.4°):</p>
<div class="tablewrap"><table class="hist">
<tr><th>Incidencia</th><th class="c">Ptolomeo</th><th class="c">Ley de Snell (n = 1.333)</th><th class="c">Diferencia</th></tr>
<tr><td>10°</td><td class="c">8.0°</td><td class="c">7.5°</td><td class="c">+0.5°</td></tr>
<tr><td>20°</td><td class="c">15.5°</td><td class="c">14.9°</td><td class="c">+0.6°</td></tr>
<tr><td>30°</td><td class="c">22.5°</td><td class="c">22.0°</td><td class="c">+0.5°</td></tr>
<tr><td>40°</td><td class="c">29.0°</td><td class="c">28.8°</td><td class="c">+0.2°</td></tr>
<tr><td>50°</td><td class="c">35.0°</td><td class="c">35.1°</td><td class="c">−0.1°</td></tr>
<tr><td>60°</td><td class="c">40.5°</td><td class="c">40.5°</td><td class="c">0.0°</td></tr>
<tr><td>70°</td><td class="c">45.5°</td><td class="c">44.8°</td><td class="c">+0.7°</td></tr>
<tr><td>80°</td><td class="c">50.0°</td><td class="c">47.6°</td><td class="c">+2.4°</td></tr>
</table></div>
<p>Pero los valores de Ptolomeo no son medidas puras: las diferencias entre filas sucesivas bajan exactamente de 0.5 en 0.5 (7.5, 7, 6.5, 6, 5.5, 5, 4.5). Es una progresión aritmética de segundo orden, es decir, una parábola \(r=ai-bi^2\) ajustada a unos pocos puntos. Algunos autores (Newton, 1977; Gingerich) acusaron a Ptolomeo de manipular; otros señalan que era costumbre «interpolar» las tablas con fórmulas sencillas. Lo cierto es que sin ley (la de Snell exige una función seno que no existía) la tabla era la única forma de tener «una ley».</p>
<div class="box rivalidad"><h4>El «crimen» de Ptolomeo</h4><p>En 1977, el astrofísico Robert R. Newton publicó <em>The Crime of Claudius Ptolemy</em>: el <em>Almagesto</em> sería un fraude, con observaciones inventadas para ajustar sus parámetros y datos de Hiparco presentados como propios. La polémica fue áspera. El catálogo estelar de Ptolomeo parece en efecto una versión del de Hiparco, con las longitudes llevadas a su época mediante la precesión (y un desfase de casi 1° que se explicaría si usó la tasa de 1° por siglo de Hiparco). Los defensores, como Gingerich y Jones, replican que lo hizo con honestidad según la norma de su época: reformular un catálogo preexistente. Es un ejemplo de por qué la ética de la prioridad y el crédito es histórica: lo que hoy es plagio, entonces era erudición.</p></div>
</section>

<section>
<h2>Por qué se apagó</h2>
<p>Hacia el siglo II d. C. la ciencia alejandrina parecía agotada. Las causas se discuten:</p>
<ul>
<li><b>Política:</b> los Ptolomeos perdieron poder, y en 145 a. C. Ptolomeo VIII expulsó a los intelectuales extranjeros. Roma conquistó el Mediterráneo oriental (Siracusa en 212 a. C., Corinto en 146 a. C., Egipto en 30 a. C.) y los romanos invirtieron más en ingeniería que en teoría.</li>
<li><b>Institucional:</b> la Biblioteca decayó con el tiempo (un incendio en la guerra de César en 48 a. C., recortes, la destrucción de Aureliano hacia 272); el Serapeo fue demolido por cristianos en 391. La historia de que el califa Omar la quemó en 642 es una leyenda tardía: para entonces ya no existía.</li>
<li><b>Epistemológica:</b> la ciencia griega era matemática y deductiva, con pocos instrumentos y casi sin experimentación sistemática, y ningún marco físico como el de Newton unificaba el cielo y la Tierra. El historiador Lucio Russo sostiene que la ciencia helenística fue «una revolución olvidada», que casi llegó a una física matemática moderna y quedó cortada por la conquista romana.</li>
</ul>

<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>En Alejandría la sombra de un gnomon de 1 m mide 12.6 cm cuando en Siena no hay sombra. Calcule el ángulo y, para una distancia de 5000 estadios de 157.5 m, la circunferencia.
<details><summary>Respuesta</summary><p>\(\tan\varphi=0.126\Rightarrow\varphi=7.18^\circ\). \(C=(360/7.18)\times5000\times0.1575\,\text{km}=39\,500\) km.</p></details></li>
<li><span class="lvl">Básico</span>¿Qué ángulo de cuarto lunar daría una razón Sol/Luna de 100? ¿De 390?
<details><summary>Respuesta</summary><p>\(\cos\theta=1/r\): \(\theta=89.427^\circ\) y \(89.853^\circ\).</p></details></li>
<li><span class="lvl">Intermedio</span>La precesión es de 50.29″ por año. Hiparco comparó posiciones separadas por 150 años y encontró unos 2°. ¿Qué precesión por siglo da? ¿Cuántos años tarda un ciclo completo?
<details><summary>Respuesta</summary><p>2° en 150 años son 1.33° por siglo (7200″/150 = 48″ al año, muy cerca de 50.3″). Un ciclo: \(360\times3600/50.29=25\,770\) años.</p></details></li>
<li><span class="lvl">Intermedio</span>Con los polígonos de 6, 12, 24, 48 y 96 lados Arquímedes acotó π. Demuestre que para el semiperímetro del polígono circunscrito \(a_{2n}=\tfrac{2a_nb_n}{a_n+b_n}\) y para el inscrito \(b_{2n}=\sqrt{a_{2n}b_n}\), y calcule las cotas para 96 lados.
<details><summary>Respuesta</summary><p>Las dos recurrencias salen de las semejanzas de triángulos al bisecar un ángulo. Con \(a_6=2\sqrt3,\;b_6=3\) se obtiene para 96 lados \(3.14103<\pi<3.14271\), que encierra a π. Arquímedes, sin decimales, publicó cotas algo más holgadas, \(223/71<\pi<22/7\), porque redondeó con fracciones simples las raíces cuadradas que aparecen.</p></details></li>
<li><span class="lvl">Avanzado</span>Una tabla se ajusta a una parábola \(r=ai-bi^2\) por Ptolomeo. ¿Qué dos hipótesis alternativas pueden explicarlo y qué evidencia las distinguiría?
<details><summary>Respuesta</summary><p>(a) Manipulación o interpolación: se tomaron pocas medidas y se completó con una fórmula; evidencia: la regularidad perfecta de las diferencias, imposible con medidas independientes. (b) Que los valores sean medidas y la regularidad una coincidencia; sería sorprendente en siete diferencias. La primera es más probable; el contexto (los antiguos solían suavizar tablas) la hace también menos escandalosa.</p></details></li>
</ol>
