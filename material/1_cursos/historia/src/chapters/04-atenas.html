<p class="lead">Se cuenta que sobre la puerta de la Academia de Platón estaba escrito «que no entre nadie que ignore la geometría», y que Aristóteles, su alumno durante veinte años, escribió después que la naturaleza no se entiende con geometría sino mirando. Ambas historias son embellecimientos posteriores. Lo seguro es que en Atenas, a lo largo del siglo IV a. C., dos escuelas dieron a la física su vocabulario y su estructura para casi dos mil años: causa, lugar, movimiento natural, elemento, cielo. Y los libros de Aristóteles, vistos de lejos, parecen más sensatos que los de Galileo.</p>

<section>
<h2>Atenas, de la derrota a Macedonia</h2>
<div class="box contexto"><h4>Guerra, juicios y un imperio nuevo</h4><p>Atenas perdió la guerra del Peloponeso en 404 a. C., sufrió el régimen de los Treinta Tiranos y, en 399, condenó a muerte a Sócrates por «impiedad y corrupción de la juventud». Platón, joven aristócrata y discípulo de Sócrates, concluyó que la democracia ateniense era incapaz de reconocer la verdad: de ahí su desconfianza en la opinión de la mayoría y su insistencia en un conocimiento de lo permanente. Fundó la Academia hacia 387 a. C. en un parque dedicado a Academo. Medio siglo más tarde Filipo II de Macedonia sometió a las ciudades griegas en Queronea (338 a. C.), y su hijo Alejandro conquistó el imperio persa. Eso cambió la ciencia: abrió a los griegos el acceso a los archivos de Babilonia y Egipto, y dejó a Atenas como una capital intelectual dentro de un mundo políticamente mayor.</p></div>
<div class="people">
<div class="persona"><b>Platón</b><small>c. 428 – c. 348 a. C. · Atenas</small><p>Discípulo de Sócrates, fundador de la Academia. En el <em>Timeo</em> narra la creación del cosmos por un artesano divino que lo ordena según proporciones matemáticas. Sus diálogos son la primera filosofía de la ciencia escrita.</p></div>
<div class="persona"><b>Eudoxo de Cnido</b><small>c. 408 – c. 355 a. C. · Cnido, Atenas</small><p>Matemático y astrónomo. Creó la teoría de la proporción de Euclides V y el método de exhaución. Su modelo de esferas homocéntricas es el primer sistema astronómico geométrico.</p></div>
<div class="persona"><b>Aristóteles</b><small>384 – 322 a. C. · Estagira, Atenas, Pella</small><p>Hijo de un médico de la corte macedonia. Veinte años en la Academia; tutor de Alejandro; fundó el Liceo (335). Escribió sobre lógica, física, biología, ética y política. Casi toda su obra publicada se perdió; se conservan sus apuntes de clase.</p></div>
<div class="persona"><b>Teofrasto</b><small>c. 371 – c. 287 a. C. · Éreso, Atenas</small><p>Sucesor de Aristóteles en el Liceo. Fundó la botánica científica y escribió sobre piedras, sobre el imán y el ámbar.</p></div>
<div class="persona"><b>Estratón de Lámpsaco</b><small>c. 335 – c. 269 a. C. · Atenas, Alejandría</small><p>Tercer director del Liceo, «el físico». Defendió que los cuerpos que caen se aceleran y que el vacío existe en pequeños intersticios. Fue preceptor de Ptolomeo II en Alejandría.</p></div>
<div class="persona"><b>Alejandro Magno</b><small>356 – 323 a. C. · Pella, Babilonia</small><p>Discípulo de Aristóteles durante tres años. Sus conquistas conectaron el saber griego con el babilonio y el egipcio, y fundaron Alejandría.</p></div>
</div>
</section>

<section>
<h2>Platón: salvar los fenómenos</h2>
<p>Para Platón el mundo sensible es una copia imperfecta de las Formas, objetos matemáticos eternos. De ahí una tarea clara para el astrónomo, que Simplicio (siglo VI) atribuye a Platón: <em>hallar qué movimientos uniformes y ordenados, de círculos perfectos, bastan para dar cuenta del movimiento aparentemente irregular de los planetas</em>. Los griegos llamaron «errantes» (<em>planetai</em>) a los cinco planetas porque van en un sentido, se detienen, retroceden y vuelven a avanzar. Se trataba de <em>salvar los fenómenos</em>: construir un modelo geométrico cuya apariencia sea la observada, sin pretender necesariamente que sea la realidad. Esa expresión se repetirá hasta Galileo (capítulo 11).</p>
<p>En el <em>Timeo</em> (c. 360 a. C.), Platón propone que los cuatro elementos de Empédocles son sólidos regulares formados por triángulos: tetraedro (fuego, el más agudo y móvil), cubo (tierra, estable), octaedro (aire), icosaedro (agua, el más «redondo»), y el dodecaedro como el cosmos. Los cinco sólidos platónicos existen porque \(V-A+C=2\) y solo hay cinco poliedros convexos regulares, un resultado que Teeteto, miembro de la Academia, había demostrado. Es una primera idea de que la estructura de la materia es geometría, que reaparece en Kepler (1596), en la cristalografía y en las simetrías de la física de partículas.</p>
<div class="sim" data-sim="platonicos" data-title="Los cinco sólidos platónicos y los elementos del Timeo"></div>
<div class="sim-guide"><ul>
<li>La lectura «V − A + C» da 2 para los cinco sólidos: es la relación de Euler (1752), que ya Platón no podía conocer, pero que explica por qué no hay más.</li>
<li>Es una teoría <em>sin experimento</em>: cada elemento se asigna por su aspecto, y nadie podía contrastarla. Pero introduce el principio de que la naturaleza obedece a estructuras matemáticas.</li>
</ul></div>
<div class="box leyenda"><h4>«Que no entre el que no sepa geometría»</h4><p>La inscripción sobre la entrada de la Academia aparece por primera vez en escritos de los siglos IV-VI d. C. (Filópono, Elías, Tzetzes). Ningún texto de la época de Platón la menciona. Como muchas frases-resumen, expresa el espíritu de una escuela mejor que cualquier documento; pero no es un hecho.</p></div>
</section>

<section>
<h2>Eudoxo y las esferas: el primer modelo geométrico</h2>
<p>Eudoxo dio la respuesta con un ingenio notable: cada planeta está sujeto a un grupo de <em>esferas concéntricas con la Tierra</em>, cada una girando alrededor de su propio eje, que está engastado en la esfera exterior. Con 27 esferas en total (1 para las estrellas fijas, 3 para el Sol, 3 para la Luna y 4 para cada uno de los cinco planetas) construyó un universo que se mueve sin vacío, sin deslizamientos y con puro movimiento circular uniforme.</p>
<p>La idea para un planeta es esta: las dos esferas exteriores reproducen el movimiento diario y el recorrido sobre el zodíaco; las dos interiores tienen ejes inclinados un ángulo \(\alpha\) entre sí y giran con la misma velocidad y en sentidos opuestos. La composición traza sobre el cielo un lazo en forma de ocho, la <em>hipopedia</em> («traba de caballo»), que, sumado al avance zodiacal, produce las estaciones y la retrogradación.</p>
<div class="sim" data-sim="eudoxo" data-title="Cuatro esferas por planeta: la hipopedia de Eudoxo"></div>
<div class="sim-guide"><ul>
<li>Con «Saturno» y el botón «Ajustar α al arco observado» se obtiene un ángulo de unos 6° y un arco retrógrado igual al observado, con latitudes minúsculas: el modelo <em>salva el fenómeno</em>.</li>
<li>Cambie a «Marte»: el modelo no produce el arco real en ningún ángulo, y con α alto la latitud sale absurda. Con «Venus» no hay retrogradación. Es la limitación que ya anotó la Antigüedad: Calipo añadió esferas (34 en total) y Aristóteles, 55, sin resolverla; Ptolomeo cambió de método.</li>
</ul></div>
<div class="box epist"><h4>Un modelo falsable, con una anomalía reconocida</h4><p>El sistema de Eudoxo hacía una predicción clara y falsable: los planetas siempre están a la misma distancia de la Tierra, porque se mueven sobre esferas concéntricas. Pero Marte y Venus cambian visiblemente de brillo, y una esfera con la Tierra en el centro no lo puede explicar. Autolico de Pitane, hacia 330 a. C., ya lo objetó. Es el tipo de anomalía que, según Kuhn, se acumula dentro de un paradigma; aquí el paradigma cedió (y no del todo) ante otra construcción geométrica, los epiciclos (capítulo 5), dos siglos después.</p></div>
</section>

<section>
<h2>Aristóteles: observar, clasificar y explicar</h2>
<p>Aristóteles discrepó de Platón en un punto central: las Formas no están en un cielo aparte, sino en las cosas; para entender un caballo hay que estudiar caballos. Pasó dos años en Lesbos disecando animales con Teofrasto, describió más de quinientas especies, y en algunos casos acertó con una precisión que no se confirmó hasta el siglo XIX (la placenta del tiburón <em>Mustelus</em>, el cuidado del nido por el macho del siluro <em>glanis</em>).</p>
<div class="box leyenda"><h4>«Las mujeres tienen menos dientes que los hombres»</h4><p>En la <em>Historia de los animales</em> (501b) Aristóteles dice, sin vacilar, que los hombres tienen más dientes que las mujeres. Era falso, y bastaba contar. Bertrand Russell se burló de que, casado dos veces, nunca se le ocurriera pedir a su mujer que abriera la boca. La frase es auténtica, no leyenda, y muestra algo útil: un gran observador puede repetir sin comprobar lo que «todo el mundo sabe». No sustituye el hecho de que sus descripciones biológicas fueran excepcionales.</p></div>
<h3>La física de los lugares naturales</h3>
<p>Para Aristóteles, la física estudia «lo que tiene en sí mismo el principio del movimiento y del reposo». Cada cosa tiene cuatro causas: material, formal, eficiente y final. La explicación incluye <em>para qué</em>: la lluvia cae porque el agua busca su lugar natural; los dientes incisivos están para cortar. Los cuatro elementos terrestres tienen sus lugares: la tierra abajo, el agua encima, luego el aire y el fuego; el movimiento «natural» es la vuelta al lugar propio (recto, hacia el centro o desde él). Cualquier otro movimiento es «violento» y necesita una causa que lo empuje mientras dure. El cielo se compone de un quinto elemento, el <em>éter</em>, de movimiento natural circular, incorruptible. El universo es finito, con la Tierra inmóvil en el centro y una última esfera de estrellas.</p>
<ol class="chain">
<li><b class="y">Observación cotidiana</b><p>Una carreta se detiene cuando los bueyes dejan de tirar. Una piedra pesada cae más rápido que una pluma. Una bola lanzada se detiene. Toda observación inmediata sugiere que <em>el movimiento requiere una causa que lo mantenga</em>.</p></li>
<li><b class="y">Regla cuantitativa</b><p>Aristóteles propone que la velocidad de un cuerpo es proporcional a la fuerza motriz (peso, en la caída) e inversamente proporcional a la resistencia del medio. Es una proporcionalidad cualitativa (el texto no da números), pero equivale a una ley.</p></li>
<li><b class="y">Consecuencia: no hay vacío</b><p>En el vacío la resistencia sería nula, y la velocidad infinita: un cuerpo estaría en todas partes a la vez, lo que es absurdo. Además, no habría razón para que un cuerpo se detuviera aquí y no allá. Luego el vacío no existe (<em>Física</em> IV, 8).</p></li>
<li><b class="y">Un punto débil: el proyectil</b><p>Si el movimiento exige empuje, ¿por qué sigue la flecha cuando ya dejó la cuerda? Aristóteles responde con la <em>antiperístasis</em>: el aire desplazado por la flecha da la vuelta y la empuja por detrás. Es una explicación ingeniosa y débil que se discutirá durante dos mil años (capítulos 6 y 8).</p></li>
</ol>
<div class="eq key" data-name="La regla de Aristóteles (reconstruida)">\[v\;\propto\;\frac{F}{R}\qquad\text{(caída: }F=\text{peso},\;R=\text{resistencia del medio).}\]</div>
<div class="sim" data-sim="caida-arist" data-title="¿Cae antes lo más pesado? Aristóteles frente a las medidas"></div>
<div class="sim-guide"><ul>
<li>En el aire, plomo y madera del mismo tamaño caen casi a la vez desde 10 m; no cumple «diez veces más pesado, diez veces más rápido». Pero la diferencia existe: el plomo gana por unos centésimos de segundo, y por eso la observación no refuta de golpe a Aristóteles.</li>
<li>En agua o en aceite los tiempos difieren mucho más, y en el vacío son idénticos. En un medio denso la regla de Aristóteles funciona <em>cualitativamente</em>: lo pesado cae más rápido, y la madera de pino ni siquiera cae. Su error es extrapolar al aire y al vacío.</li>
</ul></div>
<div class="box epist"><h4>Una teoría que ordena la experiencia</h4><p>La física aristotélica no era tonta: describe bien lo que vemos cuando hay rozamiento (casi siempre) y se apoya en un sistema completo (elementos, lugares, causas, cielos). La idea de inercia exige imaginar una situación que nadie ha visto (un cuerpo sin ninguna fuerza), y es fácil comprender por qué tardó tanto en aparecer. Lo que cambia con Galileo no es que de pronto se mirara mejor; es que se idealiza y se mide (capítulo 11).</p></div>
<div class="sim" data-sim="vidas" data-ids="socrates,democrito,platon,arquitas,eudoxo,aristoteles,alejandro,teofrasto,estraton" data-title="Atenas y Macedonia: quién pudo conocer a quién"></div>
<div class="sim-guide"><ul>
<li>Elija a Aristóteles: pasó veinte años en la Academia con Platón y con Eudoxo, pero no pudo conocer a Sócrates (murió quince años antes de que él naciera); Platón es el puente entre ambos.</li>
<li>Alejandro fue alumno de Aristóteles hacia los 13-16 años: con la edad mínima en 20 no cuenta como coincidencia entre adultos. Fue una educación de adolescente, más breve de lo que sugiere la leyenda.</li>
</ul></div>
</section>

<section>
<h2>La frontera entre matemática y física</h2>
<p>Para Aristóteles, el objeto de las matemáticas son abstracciones sin movimiento ni materia; el de la física, los cuerpos que cambian. Cada ciencia tiene su propio género y no se puede pasar de uno a otro (<em>metabasis eis allo genos</em>): demostrar una proposición física con argumentos geométricos es, dice, un error de categoría. De ahí que su física sea casi sin números. Esa prohibición es consecuencia de su filosofía y tuvo un efecto de larga duración: la física cuantitativa de Galileo exigirá violar esa regla, y por eso muchos aristotélicos se negaron a considerar sus argumentos como «física». Quienes sí aplicaron las matemáticas a la naturaleza fueron, en cambio, los astrónomos, los ópticos y los mecánicos de la tradición alejandrina (capítulo 5). El tratado seudoaristotélico <em>Mecánica</em> (c. 280 a. C.) explica la palanca con el movimiento de círculos: es una excepción.</p>
<div class="box epist"><h4>Demostración y principios</h4><p>En los <em>Analíticos posteriores</em> el conocimiento científico (<em>epistéme</em>) se define como el que se obtiene por demostración a partir de premisas verdaderas, primarias y causales. ¿De dónde salen esas premisas? De la <em>epagogé</em>: tras muchas experiencias, el intelecto «ve» el principio. Esto es una teoría de la inducción, pero con una metáfora de visión directa, no con la lógica probabilística de hoy. Se distingue además el saber <em>que</em> algo ocurre (<em>to hóti</em>) del saber <em>por qué</em> (<em>to dióti</em>): los babilonios sabían que los eclipses se repiten; los griegos querían saber por qué.</p></div>
<div class="box rivalidad"><h4>De Atenas a Calcis</h4><p>A la muerte de Platón (348-347), la dirección de la Academia pasó a su sobrino Espeusipo, y Aristóteles se marchó de Atenas. Volvió en 335 y fundó su propia escuela en el Liceo, con biblioteca y colección de mapas y animales. Cuando murió Alejandro (323), estalló en Atenas la hostilidad antimacedonia, y Aristóteles, cuyo pasado palatino lo hacía sospechoso, fue acusado de impiedad. Se retiró a Calcis, en Eubea, «para que Atenas no pecara por segunda vez contra la filosofía» (como lo cuenta la tradición); murió allí en 322. El mismo año, Demóstenes murió envenenado y Atenas perdió su independencia.</p></div>
</section>

<section>
<h2>Estratón: la primera revisión</h2>
<p>Un siglo después del nacimiento de Aristóteles, su escuela empezó a corregirlo. Estratón de Lámpsaco (director del Liceo de 287 a 269) observó que el agua que cae desde el tejado forma una columna continua en lo alto y se rompe en gotas más abajo: la velocidad aumenta durante la caída, y las partes que van adelante se separan de las que siguen. Es el primer argumento conservado de que la caída es acelerada. También pensó que el vacío existe en pequeños huecos entre las partículas de la materia, porque de otro modo el aire no podría comprimirse ni la luz atravesar un cuerpo. Es la primera crítica interna al sistema de Aristóteles, y un ejemplo de lo común que es que el discípulo mejore al maestro, siempre que haya una escuela con memoria.</p>
</section>

<section>
<h2>Qué dejó Atenas</h2>
<ul>
<li>La <b>noción de explicación causal</b> y un vocabulario técnico que llegará, vía árabe y latín, hasta Newton (<em>energeia</em>, <em>dynamis</em>, <em>entelecheia</em>).</li>
<li>El <b>programa matemático</b> (salvar los fenómenos con círculos) y el primer modelo geométrico (Eudoxo), con la limitación de Marte y Venus.</li>
<li>Una <b>física cualitativa y global</b>, útil para el sentido común, pero sin leyes cuantitativas ni vacío ni inercia.</li>
<li>La <b>institución</b>: una escuela con biblioteca, discípulos y sucesión. Alejandría la copiará con un museo a escala imperial (capítulo 5).</li>
</ul>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un tetraedro, un cubo, un octaedro, un icosaedro y un dodecaedro tienen respectivamente 4, 8, 6, 12 y 20 vértices. Con 6, 12, 12, 30 y 30 aristas, calcule el número de caras de cada uno.
<details><summary>Respuesta</summary><p>\(C=2-V+A\): 4, 6, 8, 20, 12.</p></details></li>
<li><span class="lvl">Básico</span>Según la regla \(v\propto F/R\), si un cuerpo A pesa 10 veces más que B (misma forma), ¿qué relación de tiempos de caída predice? ¿Qué razón obtiene en el vacío?
<details><summary>Respuesta</summary><p>A caería 10 veces más rápido: \(t_A/t_B=1/10\). En el vacío la regla da velocidad infinita en ambos; la física moderna da \(t_A=t_B\).</p></details></li>
<li><span class="lvl">Intermedio</span>Una esfera de 5 cm de diámetro (plomo) cae 10 m en el aire. Con \(C_d=0.47\), calcule el tiempo y compárelo con la caída libre.
<details><summary>Respuesta</summary><p>\(t_{libre}=\sqrt{2h/g}=1.428\) s; con resistencia \(t=1.430\) s (la velocidad terminal es 115 m/s). La diferencia es de dos milésimas de segundo: nadie pudo medirla en la Antigüedad.</p></details></li>
<li><span class="lvl">Intermedio</span>Con la condición \(2\omega\sin(\alpha/2)>\Omega\), demuestre que para Saturno (\(S=378\) d, \(P=10759\) d) basta una inclinación de pocos grados, y que para Marte (\(S=780\) d, \(P=687\) d) hace falta un ángulo de casi 70°.
<details><summary>Respuesta</summary><p>La velocidad del punto en el centro del ocho es \(2\omega\sin(\alpha/2)\) y debe superar la deriva \(\Omega\). Con \(\Omega/\omega=S/P\): Saturno 0.035 → \(\alpha>2.0^\circ\); Marte 1.135 → \(\sin(\alpha/2)>0.57\), \(\alpha>69^\circ\). Con tanta inclinación, el modelo da latitudes enormes (la simulación lo comprueba).</p></details></li>
<li><span class="lvl">Avanzado</span>Aristóteles defendía que el método consiste en partir de los fenómenos, y a la vez declaraba que los dientes de las mujeres son menos. ¿Qué enseñanza epistemológica ve en esta contradicción?
<details><summary>Respuesta</summary><p>Que enunciar un método no basta para seguirlo, y que la autoridad de una fuente («lo que se dice») sustituye con facilidad la observación directa, incluso en quien la reivindica. Una buena práctica científica necesita procedimientos que obliguen a comprobar, no solo la intención de hacerlo.</p></details></li>
</ol>
