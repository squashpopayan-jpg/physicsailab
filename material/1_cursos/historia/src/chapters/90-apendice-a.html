<p class="lead">Cada capítulo trae su propia línea de tiempo. Esta reúne todos los acontecimientos del cuaderno, desde los calendarios de Mesopotamia hasta la detección de las ondas gravitacionales, para ver qué ocurría a la vez: quién descubría qué mientras otros, en otro lugar, trabajaban en lo mismo. Use los atajos para acercarse a una época y las casillas para ver solo un tipo de hechos.</p>
<section>
<h2>Todos los acontecimientos</h2>
<div class="sim" data-sim="timeline" data-aspect="1.5" data-title="Línea de tiempo maestra de la historia de la física"></div>
<div class="sim-guide"><ul>
<li>Mire cómo se agrupan los puntos: la revolución científica (1543-1687), la física del siglo XIX y el «milagro» de 1895-1935 son los tres picos del registro. Es en parte un efecto del archivo (se conserva más de lo reciente) y en parte real: las comunidades científicas crecieron.</li>
<li>El tipo «met» recoge hechos de método y de filosofía; «ast», astronomía; «mec», mecánica; «cal», calor y termodinámica; «em», electromagnetismo y física moderna; «opt», óptica.</li>
</ul></div>
