<p class="lead">El 10 de noviembre de 1619, un soldado francés de 23 años, alojado durante el invierno en un cuartel de la Baviera luterana, se encerró en una habitación con una estufa y, según su propio relato, tuvo tres sueños que le revelaron «el fundamento de una ciencia admirable». Se llamaba René Descartes. Dieciocho años después publicaría, en holandés, en Leiden y sin su nombre, un breve <em>Discurso del método</em>, con tres apéndices sobre óptica, meteoros y geometría, y la certeza de que el mundo es una gran máquina cuyas leyes se pueden deducir con la razón. Mientras tanto, a pocos kilómetros, un niño llamado Christiaan Huygens crecía en casa de un diplomático que escribía con él, y que había sido amigo de Descartes.</p>

<section>
<h2>Una filosofía para una Europa cansada de guerras</h2>
<div class="box contexto"><h4>La República holandesa, refugio y laboratorio</h4><p>Los Países Bajos del norte (las Provincias Unidas) lograron su independencia de España tras ochenta años de guerra (1568-1648). Eran protestantes, mercantiles y tolerantes con los refugiados: allí imprimió Elzevir a Galileo, se refugió Descartes durante veinte años (1628-1649) y se educó Huygens. Leiden tenía una universidad desde 1575. Amsterdam era la mayor bolsa del mundo; sus talleres producían lentes, instrumentos y mapas; los cuadros de Vermeer y Rembrandt son contemporáneos de los microscopios de Leeuwenhoek. Un país de comerciantes necesitaba relojes exactos para navegar, canales con esclusas, molinos de viento y diques: la mecánica era una industria. Esa cultura práctica fundó la idea de que la naturaleza es una máquina.</p></div>
<div class="people">
<div class="persona"><b>René Descartes</b><small>1596 – 1650 · La Haye, La Flèche, Holanda, Estocolmo</small><p>Estudió con los jesuitas de La Flèche, fue soldado voluntario, vivió en una veintena de domicilios holandeses para trabajar en paz. Con 54 años murió de una pulmonía en Estocolmo, donde enseñaba a la reina Cristina a las cinco de la mañana.</p></div>
<div class="persona"><b>Christiaan Huygens</b><small>1629 – 1695 · La Haya, Leiden, París</small><p>Hijo de Constantijn Huygens, secretario de los príncipes de Orange. Matemático, astrónomo, físico, relojero. Miembro fundador de la Académie des sciences.</p></div>
<div class="persona"><b>Pierre de Fermat</b><small>1601 – 1665 · Toulouse</small><p>Magistrado del Parlamento de Toulouse. Dedicó sus ratos libres a las matemáticas y publicó casi nada: sus resultados viajaron por cartas. Autor del «último teorema».</p></div>
<div class="persona"><b>Willebrord Snell</b><small>1580 – 1626 · Leiden</small><p>Matemático. Halló la ley de la refracción hacia 1621, no la publicó y se perdió; Huygens, que vio su manuscrito, la dio a conocer.</p></div>
<div class="persona"><b>Elisabeth de Bohemia</b><small>1618 – 1680 · La Haya, Herford</small><p>Princesa exiliada, alumna y corresponsal de Descartes. Sus preguntas sobre la relación entre alma y cuerpo hicieron que Descartes precisara su doctrina.</p></div>
<div class="persona"><b>Constantijn Huygens</b><small>1596 – 1687 · La Haya</small><p>Diplomático, poeta, músico, mecenas. Descubrió a Rembrandt y fue amigo de Descartes, de Mersenne y de todos los sabios de Europa.</p></div>
</div>
</section>

<section>
<h2>Descartes: la razón construye el mundo</h2>
<p>Descartes formuló un programa: dudar de todo lo que no sea evidente; aceptar solo lo «claro y distinto»; descomponer cada problema en partes simples y reconstruir; y fundar la física sobre unos pocos principios deducidos. El primero de todos es el <em>cogito</em>, «pienso, luego soy». La naturaleza es <em>materia extensa</em> (res extensa), sin cualidades ocultas: todo lo que ocurre es movimiento y choque de partes de materia. No hay vacío (la extensión misma es materia: el espacio vacío sería una contradicción) ni acción a distancia. De ahí su universo: un <em>plenum</em> lleno de materia sutil, con «torbellinos» (vórtices) que arrastran los planetas alrededor del Sol, como un remolino arrastra los corchos.</p>
<ol class="chain">
<li><b class="y">1633 <span>· Le Monde</span></b><p>Descartes tenía terminado un tratado completo del universo, con la Tierra en movimiento. Al enterarse de la condena de Galileo (junio de 1633) lo retiró: «prefiero vivir en paz». Se publicó en 1664, póstumo.</p></li>
<li><b class="y">1637 <span>· Discurso del método y ensayos</span></b><p><em>La Dioptrique</em> (ley de refracción, telescopio, tallado de lentes), <em>Les Météores</em> (arcoíris, ver capítulo 8) y <em>La Géométrie</em>, donde un punto se representa por dos números y una curva por una ecuación. La geometría analítica (también de Fermat, independiente) es la matemática de la física posterior.</p></li>
<li><b class="y">1644 <span>· Principia Philosophiae</span></b><p>Tres leyes del movimiento: (1) cada cosa permanece en su estado mientras nada la cambie; (2) todo movimiento es en línea recta; (3) cuando un cuerpo choca con otro más fuerte, no pierde nada de su movimiento; si es más débil, pierde lo que da. Es la primera formulación de la inercia con movimiento recto (Galileo la veía circular). Y de ahí la conservación de la «cantidad de movimiento» total, \(\sum m|v|\), por la constancia de Dios.</p></li>
<li><b class="y">1644-1649 <span>· vórtices y gravedad</span></b><p>La gravedad sería la presión de la materia sutil en rotación alrededor de la Tierra, que empuja los cuerpos pesados hacia el centro. Parecía una explicación «mecánica», sin acción a distancia.</p></li>
</ol>
<div class="box epist"><h4>Razón, hipótesis y fábulas</h4><p>Descartes no era un puro deductivista. En la sexta parte del <em>Discurso</em> admite que los principios generales dan muchas explicaciones posibles de los fenómenos, y que solo los experimentos permiten elegir entre ellas. Califica incluso su mundo de «fábula» (<em>fable</em>), una forma de poner distancia con el dogma después de 1633. Esa idea, que una teoría es un modelo hipotético cuya verdad solo alcanza «certeza moral», es la raíz del método hipotético-deductivo. Lo notable es que su física concreta, que se pretendía deducida de principios evidentes, resultó casi toda falsa: la <em>forma</em> del método (mecanicismo, geometrización, ausencia de causas ocultas) perduró; su <em>contenido</em> no.</p></div>
<div class="box rivalidad"><h4>Cartesianos y prohibiciones</h4><p>La filosofía de Descartes tuvo enemigos de todo bando. En Utrecht el teólogo Voetius logró en 1642 que se condenara el cartesianismo, por considerarlo ateo. La Iglesia romana puso sus obras en el Índice en 1663 («hasta que se corrijan»). Luis XIV, en 1671, prohibió enseñar cartesianismo en la Universidad de París, y Boileau satirizó el decreto con un <em>Arrêt burlesque</em> en que el Parlamento de la Razón prohibía a la Razón entrar en los colegios. Cuarenta años después la situación se invertiría: los cartesianos serían el bloque «establecido» y los newtonianos, los rebeldes (capítulo 14).</p></div>
</section>

<section>
<h2>La ley de los senos y la discusión con Fermat</h2>
<p>En <em>La Dioptrique</em>, Descartes dedujo la refracción (que luego llamaremos de Snell o de Snell–Descartes) con una analogía mecánica: la luz es como una pelota de tenis que atraviesa una tela; su componente horizontal se conserva y la vertical cambia. Como la tela frena el movimiento vertical en el agua, la ley de los senos se cumple con un índice mayor que 1 pero <em>con la luz más rápida en el medio denso</em>: \(\operatorname{sen}\theta_1/\operatorname{sen}\theta_2=v_2/v_1\). Descartes pensaba que la luz se propaga instantáneamente, de modo que la velocidad era una metáfora.</p>
<p>Fermat objetó que la naturaleza «obra por los caminos más cortos». En 1657 enunció que la luz sigue el camino de menor tiempo entre dos puntos, y en 1662 lo aplicó a la refracción: para que el tiempo sea mínimo, la luz debe ir más despacio en el medio denso. Los cartesianos (Clerselier) respondieron que la naturaleza no tiene fines ni sabe adónde va; Fermat, con paciencia, dijo que le bastaba haber obtenido el mismo resultado con otro supuesto. Cada uno de los dos supuestos tiene una consecuencia física opuesta, y habría que esperar a 1850 para saber quién tenía razón: Foucault midió que la luz va <em>más lenta</em> en el agua (capítulo 22).</p>
<div class="eq key" data-name="Principio de Fermat">\[\delta\int_A^B n\,\dd s=0\quad\Longrightarrow\quad n_1\operatorname{sen}\theta_1=n_2\operatorname{sen}\theta_2.\]</div>
<div class="sim" data-sim="fermat" data-title="El principio de Fermat: el camino de menor tiempo"></div>
<div class="sim-guide"><ul>
<li>Mueva el punto de cruce: el tiempo de recorrido (curva azul) tiene un mínimo muy plano. En el mínimo se cumple exactamente la ley de los senos.</li>
<li>El mínimo es una propiedad <em>global</em>, no local. Ese tipo de razonamiento (un principio variacional) será el esqueleto de la mecánica analítica del siglo XVIII (capítulo 16).</li>
</ul></div>
<div class="box leyenda"><h4>Quién descubrió la ley de los senos</h4><p>Cuatro veces, al menos: Ibn Sahl (984, capítulo 7), Thomas Harriot (c. 1602, inédito), Willebrord Snell (c. 1621, inédito, conocido por Huygens y por Isaac Vossius, que acusó a Descartes de plagio en 1662) y Descartes (1637, publicado, con una demostración equivocada). Hoy se llama «de Snell» en el mundo anglosajón y «de Descartes» en Francia. Descartes pudo haber visto el manuscrito de Snell en Leiden, pero hay también quien cree que la dedujo independientemente. Es un caso paradigmático de descubrimiento múltiple (Merton) y de la ley de Stigler (capítulo 1).</p></div>
<div class="box fuente"><h4>Fermat sobre su «último teorema»</h4><blockquote>Es imposible descomponer un cubo en dos cubos, una cuarta potencia en dos cuartas potencias, y en general ninguna potencia superior al cuadrado en dos potencias del mismo exponente. He encontrado una demostración verdaderamente admirable de este hecho, que este margen es demasiado estrecho para contener.</blockquote><p>Anotación de hacia 1637 al margen de la <em>Arithmetica</em> de Diofanto (edición de Bachet), publicada por su hijo Samuel en 1670. Wiles lo demostró en 1994-1995 con técnicas del siglo XX que Fermat no pudo conocer. Fermat no fue físico de profesión, pero su método de «adigualdad» para hallar máximos y mínimos y trazar tangentes es un antecedente directo del cálculo; Newton lo reconoció.</p></div>
</section>

<section>
<h2>Huygens: la medida del tiempo y de la luz</h2>
<ol class="chain">
<li><b class="y">1655 <span>· Titán</span></b><p>Con un telescopio de 3.7 m de distancia focal construido con su hermano (lentes talladas por ellos mismos), descubrió en marzo la primera luna de Saturno, Titán. Un año después aclaró el enigma de las «asas» de Saturno que Galileo había visto: un anillo delgado, plano e inclinado respecto de la eclíptica, que anunció primero con un anagrama (<em>aaaaaaa ccccc d eeeee g h iiiiiii…</em>) para asegurar la prioridad. Publicado en <em>Systema Saturnium</em> (1659).</p></li>
<li><b class="y">1656-1657 <span>· el reloj de péndulo</span></b><p>Aplicó el péndulo (capítulo 11) a un mecanismo de escape y obtuvo relojes con un error de menos de un minuto al día (frente a los 15 minutos diarios de los anteriores). Patentó el reloj en 1657 con el relojero Salomon Coster. Los marinos necesitaban relojes para determinar la longitud en el mar (capítulo 16); los de péndulo fallaban con el balanceo del barco.</p></li>
<li><b class="y">1659 <span>· fuerza centrífuga</span></b><p>Calculó que un cuerpo que gira en círculo con velocidad \(v\) y radio \(r\) tiene aceleración \(v^2/r\) dirigida al centro: la fórmula que Newton usará para el cálculo con la Luna (capítulo 14).</p></li>
<li><b class="y">1673 <span>· Horologium oscillatorium</span></b><p>Resolvió el péndulo isócrono: sobre una cicloide el tiempo de descenso es independiente de la altura. Demostró que la evoluta de la cicloide es otra cicloide y diseñó «mejillas» cicloidales para el hilo. En la práctica, los relojes mantuvieron el péndulo simple con amplitudes pequeñas, pero la matemática fue una de las mayores del siglo.</p></li>
</ol>
<div class="eq key" data-name="Péndulo y fuerza centrífuga (Huygens)">\[T=2\pi\sqrt{\frac{L}{g}},\qquad a=\frac{v^2}{r}.\]</div>
<div class="sim" data-sim="tautocrona" data-title="La cicloide: el péndulo isócrono de Huygens"></div>
<div class="sim-guide"><ul>
<li>A la izquierda, dos cuentas sueltas desde alturas distintas sobre una cicloide llegan <em>al mismo tiempo</em> al punto más bajo, cualquiera que sea la altura. A la derecha, en un arco circular de longitud equivalente, la que sale de más arriba llega más tarde (el isocronismo de Galileo solo vale para oscilaciones pequeñas, capítulo 11).</li>
<li>El tiempo es \(T/4=\pi\sqrt{a/g}\) y el periodo \(T=4\pi\sqrt{a/g}\): equivalente a un péndulo de longitud \(L=4a\).</li>
</ul></div>
<h3>La luz como onda</h3>
<p>En París, Huygens preparó entre 1676 y 1678 un tratado que no publicó hasta 1690 (<em>Traité de la lumière</em>): la luz es un movimiento ondulatorio de la materia sutil (el éter), análogo al sonido. Cada punto del frente de onda es un nuevo foco de ondículas y el frente siguiente es la envolvente de todas. Con esta construcción explicó la reflexión y la refracción, y también la <em>doble refracción</em> del espato de Islandia (Bartholin, 1669), con ondículas elipsoidales: un gran logro. No explicó la propagación rectilínea con el rigor que luego dará Fresnel (capítulo 22), y su onda era longitudinal (no podía explicar la polarización, que él mismo observó en 1690).</p>
<div class="sim" data-sim="huygens-onda" data-title="La construcción de Huygens: ondículas y refracción"></div>
<div class="sim-guide"><ul>
<li>Cada círculo es una ondícula emitida por un punto de la interfaz cuando llegó el frente incidente. En el segundo medio los radios son menores. La recta roja que los toca a todos es el frente refractado; su inclinación reproduce la ley de Snell para cualquier índice.</li>
</ul></div>
<div class="box epist"><h4>La prueba por verosimilitud: Huygens y el método hipotético-deductivo</h4><p>En el prefacio del <em>Traité</em> Huygens escribió que en física no se obtienen demostraciones como en geometría: se imaginan hipótesis y se comprueba que de ellas se deducen los fenómenos; si se cumplen muchas consecuencias, y sobre todo las inesperadas, la hipótesis alcanza «un grado de verosimilitud muy próximo a la certeza». Lo dijo a la vez que escribía sobre probabilidad (su <em>De ratiociniis in ludo aleae</em>, 1657, nació de las cartas de Pascal y Fermat): fue uno de los primeros en pensar que la confianza en una teoría se mide por grados. Es el primer enunciado explícito de lo que luego será el método científico estándar.</p></div>
</section>

<section>
<h2>El choque de los cuerpos: Descartes frente a Huygens</h2>
<p>Si el mundo es materia en movimiento y todos los fenómenos son choques, la ley de los choques es la ley fundamental. Descartes dio siete reglas en los <em>Principios</em>, y casi todas están mal. En 1668 la Royal Society pidió a los matemáticos que resolvieran el problema. Wallis (choques inelásticos), Wren y Huygens (elásticos) respondieron con soluciones basadas en la conservación de la cantidad de movimiento <em>con signo</em> \(\sum mv\), no en valor absoluto. Huygens agregó que en el choque elástico también se conserva \(\sum mv^2\) («vis viva», concepto de Leibniz que se verá en el capítulo 16).</p>
<div class="sim" data-sim="colisiones" data-title="Choques: las reglas de Descartes frente a la solución de Huygens"></div>
<div class="sim-guide"><ul>
<li>Con B pequeño que choca contra un C mayor en reposo, Descartes decía que B rebota con la misma rapidez y C no se mueve: se viola la conservación de la cantidad de movimiento (B termina con \(-mv\), C con 0). La solución elástica da a C un movimiento pequeño y B rebota con menos rapidez.</li>
<li>Pruebe masas iguales: B queda quieto y C parte con la velocidad de B (la bola de billar). Con \(m_2\gg m_1\): B rebota con casi \(-v_1\) (la pelota contra la pared).</li>
</ul></div>
</section>

<section>
<h2>Del mecanicismo a Newton: lo que se ganó y lo que se perdió</h2>
<p>La filosofía mecánica dejó una herencia de ideas decisivas: el mundo físico es legible, no mágico; sus leyes son matemáticas; las causas son contactos y choques; los fenómenos naturales no dependen de fines. Pero chocaba con dos hechos: la gravedad, que parecía actuar sin contacto, y los vórtices, que Newton mostraría incompatibles con las leyes de Kepler (en 1687). El triunfo de Newton es también la crisis del cartesianismo; su «acción a distancia» fue vista como retroceso a las cualidades ocultas por Huygens y Leibniz, y años después Voltaire resumió el cambio: «un francés que llega a Londres encuentra las cosas muy cambiadas en filosofía: dejó el mundo lleno, y lo encuentra vacío».</p>
<div class="sim" data-sim="timeline" data-ch="mecanicismo" data-from="1615" data-to="1700" data-title="Línea de tiempo del mecanicismo"></div>
<div class="sim" data-sim="vidas" data-ids="harriot,snell,descartes,mersenne,fermat,pascal,constantijn,huygens,elisabeth,grimaldi,bartholin,wallis,wren" data-title="Los mecanicistas: quién pudo conocer a quién"></div>
<div class="sim-guide"><ul>
<li>Huygens (1629-1695) y Newton (1642-1727) coincidieron como adultos casi 40 años; se conocieron en Londres en 1689, cuando Newton ya era el autor de los <em>Principia</em>.</li>
<li>Descartes murió cuando Huygens tenía 21 años; se conocieron en casa de Constantijn Huygens.</li>
</ul></div>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un rayo pasa del aire al agua (\(n=1.333\)) con 45° de incidencia. Calcule el ángulo refractado y la velocidad en el agua.
<details><summary>Respuesta</summary><p>\(\operatorname{sen}\theta_2=0.7071/1.333=0.530\Rightarrow\theta_2=32.0^\circ\); \(v=c/n=2.25\times10^8\) m/s.</p></details></li>
<li><span class="lvl">Básico</span>Un péndulo de cicloide de parámetro \(a=0.25\) m: ¿cuál es su periodo?
<details><summary>Respuesta</summary><p>\(T=4\pi\sqrt{a/g}=4\pi\sqrt{0.25/9.81}=2.006\) s (equivale a \(L=4a=1\) m).</p></details></li>
<li><span class="lvl">Intermedio</span>Un cuerpo de 2 kg y 4 m/s choca elásticamente con otro de 6 kg en reposo. Calcule las velocidades finales y compruebe la conservación de \(mv\) y de \(mv^2\).
<details><summary>Respuesta</summary><p>\(u_1=(2-6)\times4/8=-2\) m/s; \(u_2=2\times2\times4/8=2\) m/s. \(\sum mv\): 8 → \(-4+12=8\). \(\sum\tfrac12mv^2\): 16 → \(4+12=16\).</p></details></li>
<li><span class="lvl">Intermedio</span>Con la regla 4 de Descartes, para las mismas masas y velocidad, ¿qué cantidad de movimiento total resulta? ¿Qué ley se viola?
<details><summary>Respuesta</summary><p>B rebota a \(-4\) m/s y C queda quieto: \(p=-8\) kg·m/s, frente a +8 antes: se viola la conservación del vector cantidad de movimiento (Descartes solo conservaba \(\sum m|v|\), que sí se mantiene: 8 → 8).</p></details></li>
<li><span class="lvl">Avanzado</span>La refracción se puede deducir de dos supuestos con consecuencias físicas opuestas (luz más rápida o más lenta en el medio denso). ¿Qué lección epistemológica deja? ¿Qué experimento resolvió la cuestión?
<details><summary>Respuesta</summary><p>Subdeterminación: dos teorías con consecuencias idénticas en un dominio (los ángulos) pueden discrepar en otro (la velocidad). Se resolvió midiendo la velocidad de la luz en un medio (Foucault, 1850: más lenta en agua que en aire; ver capítulo 22). Un resultado correcto puede salir de una premisa falsa.</p></details></li>
</ol>
