<p class="lead">En febrero de 1913, un joven danés de 27 años, que trabajaba en el problema de la estabilidad del átomo de Rutherford sin llegar a nada, conversó con su colega H. M. Hansen sobre los espectros. Hansen le preguntó si conocía la fórmula de Balmer. Niels Bohr no la recordaba; se la miró en una biblioteca. «Tan pronto como vi la fórmula de Balmer, todo se aclaró», dijo después. La fórmula que un profesor de un colegio de niñas de Basilea había adivinado en 1885, con cuatro números de las líneas del hidrógeno, tenía que decir algo sobre lo que ocurría dentro del átomo. Tres semanas después, Bohr tenía el esquema del modelo.</p>

<section>
<h2>Aritmética de espectros</h2>
<div class="box contexto"><h4>Una colección de líneas sin teoría</h4><p>Desde Fraunhofer y Kirchhoff (capítulo 22) los espectroscopistas habían reunido miles de longitudes de onda. Eran datos precisos pero sin una teoría: se sabía que cada elemento tiene sus líneas y que el hidrógeno tiene una serie de cuatro líneas visibles (Hα, Hβ, Hγ, Hδ), medidas por Ångström en 1853-1868. Ritz y Rydberg descubrieron regularidades; nadie sabía por qué. Los físicos teóricos de la época (Lorentz, Larmor) pensaban en el átomo como un oscilador con una frecuencia propia por línea, y no podían explicar por qué los espectros tienen series. Planck y Einstein (capítulo 25) habían introducido el cuanto para la luz y la materia, pero sin aplicación al átomo.</p></div>
<div class="people">
<div class="persona"><b>Johann Jakob Balmer</b><small>1825 – 1898 · Basilea</small><p>Profesor de matemáticas en un colegio de niñas y docente de la universidad. A los 60 años, un colega (Hagenbach) le habló de las líneas del hidrógeno. En pocas semanas dio con la fórmula, y la comprobó con una quinta y sexta líneas medidas por Huggins en estrellas.</p></div>
<div class="persona"><b>Johannes Rydberg</b><small>1854 – 1919 · Lund</small><p>Sueco, dio la forma general en números de onda, con una constante universal que lleva su nombre.</p></div>
<div class="persona"><b>Niels Bohr</b><small>1885 – 1962 · Copenhague</small><p>Hijo de un fisiólogo; jugador de fútbol (su hermano Harald fue medallista olímpico). Doctor en 1911, estudió con J. J. Thomson en Cambridge, con quien no se entendió, y con Rutherford en Mánchester (1912).</p></div>
<div class="persona"><b>Arnold Sommerfeld</b><small>1868 – 1951 · Múnich</small><p>Maestro de la generación siguiente: Heisenberg, Pauli, Bethe, Debye. Extendió el modelo a órbitas elípticas y relativistas.</p></div>
<div class="persona"><b>Henry Moseley</b><small>1887 – 1915 · Oxford, Mánchester</small><p>Alumno de Rutherford, brillante y dado a trabajar solo. Murió con 27 años en Galípoli, en la Primera Guerra Mundial.</p></div>
<div class="persona"><b>James Franck y Gustav Hertz</b><small>1882–1964 · 1887–1975</small><p>Físicos experimentales de Berlín. Franck, de origen judío, emigró en 1933 y trabajó en el Proyecto Manhattan; Hertz, sobrino de Heinrich, fue deportado a trabajar a la URSS en la posguerra.</p></div>
</div>
</section>

<section>
<h2>Cómo se llegó a las órbitas de Bohr</h2>
<ol class="chain">
<li><b class="y">1885-1888 <span>· Balmer y Rydberg</span></b><p>Balmer ajustó \(\lambda=364.56\,m^2/(m^2-4)\) nm. Rydberg (1888) lo reescribió como \(1/\lambda=R(1/n_1^2-1/n_2^2)\), con \(n_1=2\) para la serie de Balmer y otros valores para otras series: Lyman (ultravioleta, 1906), Paschen (infrarrojo, 1908). Con ello se predijeron series que se encontraron después.</p></li>
<li><b class="y">1911-1912 <span>· Rutherford y el problema de la estabilidad</span></b><p>El átomo nuclear (capítulo 24) es inestable en la electrodinámica clásica: un electrón en órbita irradia y cae al núcleo en 10⁻¹¹ s. Nicholson (1912) había aplicado ideas cuánticas con éxito al espectro de la corona solar, con un momento angular cuantizado en múltiplos de \(h/2\pi\). Bohr tomó la idea de Nicholson.</p></li>
<li><b class="y">1913 <span>· La trilogía</span></b><p>Bohr propuso tres postulados: (1) el electrón se mueve en órbitas estacionarias sin irradiar; (2) el momento angular está cuantizado: \(L=n\hbar\); (3) al saltar entre órbitas emite o absorbe un fotón \(h\nu=E_2-E_1\). De ellos salen \(E_n=-13.6/n^2\) eV, \(r_n=n^2a_0\) con \(a_0=52.9\) pm, y la constante de Rydberg \(R=2\pi^2me^4/(h^3c)\) con una exactitud del 1 % con los valores de 1913.</p></li>
<li><b class="y">1913-1914 <span>· Pruebas</span></b><p>Pickering había visto en 1896 una serie de líneas en la estrella \(\zeta\) Puppis que atribuyó al hidrógeno con semienteros; Bohr dijo que eran del ion He⁺ (con \(Z=2\)). Fowler objetó que la constante de Rydberg era ligeramente diferente; Bohr respondió que la masa reducida del núcleo, que es mayor en el helio, lo explica: razón 1.0004, que se había medido. Hevesy contó que Einstein, al oír el argumento de la masa reducida, dijo que entonces era «uno de los mayores descubrimientos».</p></li>
<li><b class="y">1913 <span>· Moseley</span></b><p>Con un espectrógrafo de cristal, Moseley midió las líneas K y L de rayos X de 38 elementos del calcio al cinc y verificó que \(\sqrt\nu\propto Z-1\). Antes de él el «número atómico» era un puesto en la tabla periódica; con él, la carga del núcleo (de Rutherford). Mostró que hay huecos en 43, 61, 72 y 75.</p></li>
<li><b class="y">1914 <span>· Franck y Hertz</span></b><p>La corriente de electrones que atraviesan vapor de mercurio cae cada 4.9 V: el átomo absorbe energía en paquetes. Cuando Bohr conoció los resultados, mostró que concordaban con su modelo y con la línea ultravioleta de 253.7 nm (\(1239.84/4.9=253\) nm).</p></li>
</ol>
<div class="eq key" data-name="Niveles de Bohr y fórmula de Rydberg">\[E_n=-\frac{me^4}{8\varepsilon_0^2h^2}\frac{Z^2}{n^2}=-13.6\,\frac{Z^2}{n^2}\ \mathrm{eV},\qquad \frac1\lambda=R_\infty Z^2\Big(\frac1{n_1^2}-\frac1{n_2^2}\Big).\]</div>
<div class="sim" data-sim="niveles-bohr" data-title="Niveles de energía y series del hidrógeno"></div>
<div class="sim-guide"><ul>
<li>Con \(Z=1\) y \(n_1=2\) (Balmer), las cuatro primeras líneas están en el visible (656, 486, 434 y 410 nm). Con \(n_1=1\) (Lyman) están en el ultravioleta; con \(n_1=3\) (Paschen), en el infrarrojo. Suba \(Z\) a 2: el ion He⁺ tiene las mismas series con longitudes de onda cuatro veces menores.</li>
</ul></div>
<div class="sim" data-sim="moseley-ley" data-title="La ley de Moseley"></div>
<div class="sim-guide"><ul>
<li>La recta pasa por todos los puntos hasta Z = 47 con una precisión del 3 %; en el tungsteno la desviación sube a 8 % (efectos relativistas y de apantallamiento que Moseley no conocía). Cambie la vista a energía: la curva es una parábola.</li>
</ul></div>
<div class="sim" data-sim="franck-hertz" data-title="El experimento de Franck y Hertz"></div>
<div class="sim-guide"><ul>
<li>Cambie la energía del primer nivel: los picos se desplazan a múltiplos de ese valor. Aumente la dispersión de energías y los picos se difuminan: por eso el experimento requiere un vapor a temperatura controlada.</li>
</ul></div>
<div class="box epist"><h4>Un modelo que viola su teoría y funciona</h4><p>El átomo de Bohr es incoherente: usa la mecánica clásica para el movimiento y el electromagnetismo clásico para el campo, pero contradice la segunda (el electrón acelerado no irradia) y añade una regla de cuantización sin justificación. Para Popper es un ejemplo de teoría audaz, que arriesga predicciones; para Lakatos, un programa con un «núcleo duro» (los postulados) rodeado de hipótesis auxiliares (las órbitas elípticas, la corrección relativista). Para Kuhn, es la ciencia en la fase de «crisis», entre dos paradigmas: la vieja teoría cuántica es una colección de recetas que funcionan sin una teoría coherente. Y para Bohr, un instrumento de pensamiento: «cualquiera que no se escandalice con la teoría cuántica es que no la ha comprendido» (se le atribuye). Su principio de correspondencia (los resultados cuánticos deben coincidir con los clásicos para números cuánticos grandes) guió la búsqueda: era una regla heurística, y no una deducción.</p></div>
<div class="box leyenda"><h4>El átomo de Bohr como sistema solar</h4><p>La imagen del electrón en órbita alrededor del núcleo, como un planeta, es la que vive en los libros y en el logotipo de la energía atómica. No fue la de Bohr, que la consideraba una analogía para su método de cálculo: en 1913 escribió que las órbitas «no pueden ser observadas»; y en 1925 Heisenberg eliminó el concepto de órbita de su teoría de la mecánica matricial, precisamente porque no se podía observar (capítulo 29). La imagen de Bohr fue importante porque funcionó y porque Rutherford, Nagaoka y Thomson ya la usaban, pero su uso posterior en la educación tiene poco que ver con la física que se hizo después.</p></div>
<div class="box rivalidad"><h4>Rutherford y Bohr: una carta difícil</h4><p>Rutherford recibió el primer artículo de Bohr (marzo de 1913) y le contestó con preocupación: «¿cómo sabe el electrón a qué frecuencia debe vibrar cuando salta de una órbita a otra? Parece que el electrón debe saber de antemano a dónde va a ir». Era una objeción profunda: el salto cuántico no tenía mecanismo. Bohr no la contestó (no se pudo), y en 1913 Rutherford ayudó a publicar el artículo en el <em>Philosophical Magazine</em> pese a sus dudas. J. J. Thomson, el otro gran modelista, nunca se convenció. Hay un patrón en la historia: los jóvenes (Bohr, Moseley, Einstein) aceptaron la ruptura mucho antes que los consagrados.</p></div>
</section>

<section>
<h2>Sommerfeld, los límites y el final</h2>
<ol class="chain">
<li><b class="y">1916 <span>· Estructura fina</span></b><p>Sommerfeld introdujo órbitas elípticas con un segundo número cuántico y las corrigió con la masa relativista, que hace que las elipses precesen como el perihelio de Mercurio. Obtuvo la separación de las líneas del hidrógeno, \(\alpha^2\times13.6/16\) eV en el nivel \(n=2\), con una constante sin dimensiones \(\alpha=e^2/(4\pi\varepsilon_0\hbar c)\approx1/137\). La fórmula era correcta, pero por una compensación casual de errores: la teoría de Dirac la obtendrá de otro modo.</p></li>
<li><b class="y">1920-1924 <span>· Ordenar los elementos</span></b><p>Bohr construyó, con el principio de correspondencia y las capas, la explicación de la tabla periódica, y predijo que el elemento 72 sería un metal de transición parecido al circonio (y no una tierra rara). Hevesy y Coster lo encontraron en circonitas de Noruega en 1923 y lo llamaron hafnio (Hafnia, Copenhague).</p></li>
<li><b class="y">1922-1925 <span>· El fracaso</span></b><p>La vieja teoría no podía calcular el helio (dos electrones), la intensidad de las líneas, el efecto Zeeman anómalo ni las moléculas. Pauli escribió en 1925: «la física es hoy demasiado difícil, desearía ser un comediante de cine». El electrón necesitaba un cuarto número cuántico (espín) y una regla de exclusión (1925). La teoría quedó en una tabla de reglas ad hoc que anunciaba una mecánica nueva (capítulo 29).</p></li>
</ol>
<div class="box epist"><h4>El método de «predicción con restos»</h4><p>La vieja teoría cuántica dio muchas predicciones que se cumplían sin que se supiera por qué. Es un caso estudiado por Kuhn y Heilbron (<em>The Early Years of Quantum Theory</em>): una comunidad (Múnich, Copenhague, Gotinga) capaz de trabajar sin una base teórica, guiada por analogías y por la espectroscopia. Pauli y Heisenberg criticaron este método como «numerología». Pero ahí se establecieron los números cuánticos \(n, \ell, m, s\) que siguen en uso.</p></div>
</section>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Con la fórmula de Balmer, calcule la longitud de onda de Hβ (\(m=4\)).
<details><summary>Respuesta</summary><p>\(364.56\cdot16/12=486.08\) nm (valor medido en el aire: 486.13 nm).</p></details></li>
<li><span class="lvl">Básico</span>Calcule la energía del fotón emitido en la transición \(3\to2\) en el hidrógeno.
<details><summary>Respuesta</summary><p>\(13.6(1/4-1/9)=1.89\) eV, \(\lambda=656.5\) nm (rojo).</p></details></li>
<li><span class="lvl">Intermedio</span>El ion He⁺ salta de \(n=4\) a \(n=3\). ¿Qué longitud de onda emite? ¿Por qué Pickering la confundió con hidrógeno?
<details><summary>Respuesta</summary><p>\(\lambda=1/[4R(1/9-1/16)]=468.7\) nm. Coincide casi con la serie de Balmer del H si \(n\) es semientero, porque \(Z^2=4\); la diferencia viene de la masa reducida (1.0004).</p></details></li>
<li><span class="lvl">Intermedio</span>Con la ley de Moseley, ¿qué energía tiene la línea Kα del hierro (\(Z=26\))?
<details><summary>Respuesta</summary><p>\(0.75\times13.6\times25^2=6.38\) keV (valor medido: 6.40 keV).</p></details></li>
<li><span class="lvl">Avanzado</span>Calcule el radio y la velocidad del electrón en la primera órbita de Bohr. ¿Qué significa que la velocidad sea \(\alpha c\)?
<details><summary>Respuesta</summary><p>\(r=52.9\) pm, \(v=\alpha c=2.19\times10^6\) m/s (0.73 % de \(c\)). Los efectos relativistas son del orden de \(\alpha^2\sim5\times10^{-5}\): la estructura fina.</p></details></li>
<li><span class="lvl">Avanzado</span>¿Qué es el principio de correspondencia y qué papel juega en el método de Bohr? ¿Es una ley o una heurística?
<details><summary>Respuesta</summary><p>Es la exigencia de que para números cuánticos grandes la teoría cuántica tienda a la clásica: la frecuencia de la luz emitida en la transición \(n\to n-1\) se aproxima a la de la órbita clásica. Guió la elección de reglas (como la regla de selección \(\Delta\ell=\pm1\)) sin ser una ley deducida; es una heurística que se justificó después con la mecánica cuántica.</p></details></li>
</ol>
