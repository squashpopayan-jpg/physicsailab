<p class="lead">Los jardineros del Gran Duque de Toscana sabían una cosa desagradable: las bombas aspirantes no suben el agua más allá de unos 18 codos (unos diez metros y cuarto). Galileo, ciego y recluido en Arcetri, lo había apuntado como curiosidad: la «fuerza del vacío» tiene un límite. Su último discípulo, Evangelista Torricelli, pensó que el límite no era de la fuerza del vacío, sino del <em>peso del aire</em>: quizás una columna de agua de diez metros pesaba lo mismo que la atmósfera entera que lo empujaba. En 1643, con mercurio, que es 13.6 veces más denso que el agua, el mismo razonamiento diría que la columna debía medir 76 centímetros. Y midió 76.</p>

<section>
<h2>Del imán a la Tierra: Gilbert</h2>
<div class="box contexto"><h4>Navegar exige entender la aguja</h4><p>La Inglaterra isabelina, potencia marítima naciente (derrota de la Armada en 1588, la Compañía de las Indias Orientales en 1600), tenía un problema práctico: la brújula marcaba mal y de manera diferente según el lugar. Robert Norman, un fabricante de instrumentos, descubrió en 1581 que una aguja libre se <em>inclina</em> hacia abajo (en Londres, 71° 50′), y que su declinación varía. La corte, los mercaderes y los capitanes querían saber por qué. William Gilbert, médico de Isabel I, ofreció una respuesta experimental.</p></div>
<p>En <em>De magnete</em> (1600), Gilbert hizo experimentos con una <em>terrella</em> («pequeña Tierra»), una esfera de piedra imán sobre la que paseaba una aguja pequeña. La aguja se orientaba y se inclinaba como en la Tierra. Su conclusión, atrevida, fue que <em>la Tierra misma es un imán gigante</em>. Con ello explicó la brújula (no apunta a una estrella, sino al polo magnético de la Tierra) y la inclinación (la aguja sigue las líneas del campo). Distinguió además por primera vez la atracción <em>magnética</em> de la <em>eléctrica</em> (la del ámbar frotado, <em>elektron</em> en griego, de donde su palabra «eléctrico»), con una lista de materiales que se electrizan.</p>
<div class="sim" data-sim="terrella" data-title="La terrella de Gilbert: la inclinación de la aguja con la latitud"></div>
<div class="sim-guide"><ul>
<li>En el ecuador la aguja es horizontal; en los polos, vertical. Cerca de la latitud de Londres, el modelo de dipolo da 68°; la medida de Norman fue 71.8°. La diferencia ya muestra que la Tierra no es un imán uniforme: la brújula de hoy se corrige con modelos con miles de parámetros.</li>
</ul></div>
<div class="box fuente"><h4>Gilbert sobre el método</h4><blockquote>En el descubrimiento de los secretos y en la investigación de las causas ocultas, se obtienen razones más seguras de experimentos fiables y de argumentos demostrados que de las conjeturas probables y de las opiniones de los profesores de filosofía común.</blockquote><p>Paráfrasis del prefacio de <em>De magnete</em>. Gilbert rechazó la autoridad de Aristóteles y apeló al experimento, aunque sus explicaciones del magnetismo (un «alma» en el imán) seguían siendo aristotélicas. Kepler y Galileo lo leyeron con entusiasmo.</p></div>
</section>

<section>
<h2>Los diez metros de agua y el océano de aire</h2>
<p>Aristóteles había negado el vacío (capítulo 4): la naturaleza lo «aborrece» y llena todo hueco de inmediato. Los filósofos medievales discutieron si Dios podría crear vacío (capítulo 8), pero en la práctica todos aceptaban que no había. Sin embargo, los pozos de Florencia demostraban que el agua dejaba de subir a los 10.3 m. Galileo lo interpretó como un límite de la «resistencia al vacío». Hacia 1640-1643 en Roma, Gasparo Berti hizo el experimento más espectacular: un tubo de plomo de unos once metros sobre la fachada de su casa, con un extremo de vidrio para ver, lleno de agua e invertido en una tina: el agua bajaba hasta unos diez metros y dejaba arriba un espacio. Los curiosos de Roma se agolparon.</p>
<ol class="chain">
<li><b class="y">1643 <span>· Florencia</span></b><p>Torricelli sustituyó el agua por mercurio y el tubo de once metros por uno de un metro. El mercurio bajó hasta 76 cm, a pesar de la inclinación del tubo (la altura vertical seguía igual): es el <em>barómetro</em>. Vio que la altura variaba un poco de un día a otro: el peso del aire cambia con el tiempo.</p></li>
<li><b class="y">11 de junio de 1644 <span>· carta a Ricci</span></b><p>«Vivimos sumergidos en el fondo de un océano de aire elemental, que sabemos por experimentos indudables que tiene peso.» El «vacío» de arriba era realmente vacío, y la «fuerza» que sostenía el mercurio era la presión del aire.</p></li>
<li><b class="y">1646-1647 <span>· París y Ruan</span></b><p>Mersenne llevó la noticia a Francia. Pascal, de 23 años, repitió el experimento en Ruan con tubos de vidrio de 14 m llenos de agua y de vino; publicó <em>Expériences nouvelles touchant le vide</em> (octubre de 1647). El jesuita Étienne Noël respondió que el espacio de arriba estaba lleno de una «materia sutil», y la polémica produjo textos de gran claridad epistemológica.</p></li>
<li><b class="y">19 de septiembre de 1648 <span>· Puy de Dôme</span></b><p>Pascal, enfermo, pidió a su cuñado Florin Périer que repitiera el experimento en la montaña de Clermont, para ver si la columna bajaba con la altura (si es el peso del aire lo que la sostiene, a menos aire encima, menos altura). Periér, con testigos eclesiásticos y científicos, midió 26 pulgadas 3½ líneas (711.7 mm) en el convento de los Mínimos, en la ciudad, y 23 pulgadas 2 líneas (627.1 mm) en la cima. La hipótesis salió confirmada.</p></li>
</ol>
<div class="eq key" data-name="Barómetro de Torricelli">\[P_{atm}=\rho_{Hg}\,g\,h\qquad(h=0.760\ \text{m};\ \rho_{Hg}=13\,595\ \text{kg/m}^3\ \Rightarrow\ P=101\,325\ \text{Pa}).\]</div>
<div class="sim" data-sim="torricelli" data-title="Torricelli, Pascal y la altura de la columna"></div>
<div class="sim-guide"><ul>
<li>Con agua, la columna mide 10.35 m; con mercurio, 0.76 m; con vino, algo más que con agua (más ligero). En la cima del Puy de Dôme la presión es 12 % menor.</li>
<li>De las dos lecturas de Périer se deduce, con la atmósfera isoterma \(P=P_0\ee^{-h/H}\) (\(H=8.4\) km), una diferencia de altitud de 1 067 m: la real es de unos 1 070 m. Es un uso antes que nada <em>altimétrico</em> del barómetro. Pruebe con Bogotá (2 640 m): la columna de mercurio mide unos 56 cm.</li>
</ul></div>
<div class="box epist"><h4>Una teoría que prohíbe: un experimento crucial</h4><p>El Puy de Dôme es un ejemplo de manual de <em>experimento crucial</em> (Bacon lo llamó <em>instantia crucis</em>): dos hipótesis rivales, «horror al vacío» y «peso del aire», hacen predicciones opuestas sobre un hecho que se puede observar. Si la naturaleza aborreciese el vacío, la columna debería medir lo mismo en la cima. No fue así. Duhem advertiría después que ningún experimento es del todo crucial, porque siempre se pueden salvar las hipótesis cambiando las auxiliares (Noël y los plenistas lo intentaron con la «materia sutil»), pero la comunidad científica aceptó el resultado casi de inmediato.</p></div>
<div class="box rivalidad"><h4>Descartes, Pascal y el Puy de Dôme</h4><p>Descartes, que creía en un mundo lleno de materia sutil (el vacío era para él una contradicción), visitó a Pascal en septiembre de 1647 y, según su propio testimonio posterior (carta de 1649), le sugirió el experimento de la montaña. Pascal lo negó: en noviembre de 1647 ya se lo había propuesto a su cuñado por carta. Es una típica disputa de prioridad con el sabor de la época: el mayor de los dos, que creía tener razón sobre la <em>causa</em>, quiso el crédito del <em>experimento</em> que mostró que se equivocaba.</p></div>
<div class="box leyenda"><h4>El tonel de Pascal</h4><p>Se cuenta que Pascal reventó un tonel de vino lleno de agua insertando un tubo largo y delgado por el que echó solo unos litros hasta alcanzar alturas grandes: la presión depende de la altura, no del volumen. La anécdota se atribuye a Pascal sin documento propio ni de testigos, y la primera mención conocida es posterior; los principios del <em>Traité de l’équilibre des liqueurs</em> (1651-1654) están bien establecidos, pero con argumentos teóricos y experimentos con tubos, fuelles y jeringas.</p></div>
</section>

<section>
<h2>Pascal: la presión y el azar</h2>
<p>Blaise Pascal (1623-1662) demostró a los 16 años un teorema sobre hexágonos inscritos en cónicas, a los 19 inventó una máquina de calcular para su padre, recaudador de impuestos (la <em>pascalina</em>), y a los 24 refutó las ideas de Descartes con experimentos. En 1654 mantuvo con Fermat una correspondencia que fundó la teoría de la probabilidad, a propósito de un problema del caballero de Méré (cómo repartir las apuestas de un juego interrumpido); su <em>Pensées</em> se publicó póstumamente. Murió a los 39 años.</p>
<div class="box fuente"><h4>Pascal sobre la autoridad y el experimento (prefacio al <em>Tratado del vacío</em>, c. 1651)</h4><blockquote>Hay materias en que sólo cuenta la autoridad (la historia, la jurisprudencia, la teología). Pero en las que se someten a los sentidos o al razonamiento, la autoridad es inútil: sólo la razón puede descubrir la verdad. Los antiguos nos han dado el punto de partida y debemos aprovechar lo que aprendieron para llegar más lejos.</blockquote><p>Paráfrasis. Pascal responde a quienes oponían las autoridades de Aristóteles a los experimentos: la ciencia progresa porque cada generación suma a la anterior. Es una de las formulaciones más claras de la idea de progreso acumulativo.</p></div>
<div class="eq key" data-name="Principio de Pascal">\[\Delta P\ \text{se transmite sin pérdida a todo el fluido:}\qquad \frac{F_1}{A_1}=\frac{F_2}{A_2}.\]</div>
<div class="sim" data-sim="prensa-pascal" data-title="La prensa hidráulica: multiplicar fuerzas"></div>
<div class="sim-guide"><ul>
<li>Un émbolo grande de 20 cm y uno pequeño de 2 cm multiplican la fuerza por 100: 100 N se convierten en 10 000 N. Pero el émbolo grande sube 100 veces menos que el pequeño baja: la máquina no crea trabajo, solo lo transforma.</li>
</ul></div>
</section>

<section>
<h2>Guericke y el espectáculo del vacío</h2>
<div class="box contexto"><h4>Un alcalde en la guerra de los Treinta Años</h4><p>Otto von Guericke (1602-1686) estudió leyes e ingeniería. En mayo de 1631, el ejército imperial del conde Tilly tomó Magdeburgo y dejó la ciudad en ruinas: murieron unos veinte mil de sus habitantes. Guericke perdió su casa, trabajó como ingeniero para Suecia y volvió como alcalde (1646-1676). Mientras reconstruía su ciudad, se dedicó al vacío: quería saber si el espacio infinito de Copérnico y Bruno era realmente vacío.</p></div>
<p>Hacia 1650 construyó una bomba de émbolo capaz de evacuar un tonel. Vio que una vela se apagaba, que un animal moría, que una campana en el vacío no sonaba. En 1654, en la Dieta de Ratisbona ante el emperador Fernando III, mostró con dos hemisferios de cobre de unos 50 cm de diámetro, de los que había extraído el aire, que dos tiros de ocho caballos no podían separarlos. La demostración se hizo famosa por la descripción de Gaspar Schott (1657) y era propaganda: un alcalde de provincias que mostraba al Imperio, devastado por la guerra, que la naturaleza podía ser un teatro. Con la misma bomba, predijo una tormenta en 1660 mediante un barómetro de agua que «bajó». También fabricó una esfera de azufre que, frotada, atraía y repelía objetos: la primera máquina electrostática.</p>
<div class="sim" data-sim="hemisferios" data-title="Los hemisferios de Magdeburgo: cuántos caballos hacen falta"></div>
<div class="sim-guide"><ul>
<li>Con el vacío perfecto y un radio de 25.5 cm, la fuerza es 20.7 kN: unas 2.1 toneladas-fuerza, es decir, 30 caballos de 700 N. Con dos tiros de ocho caballos (16 × 0.7 = 11 kN) solo se salvan si la presión interior queda por encima del 45 % de la atmosférica, es decir, con un vacío mediocre, algo plausible para una bomba de la época.</li>
<li>Guericke no lo ocultaba: sabía que su vacío era imperfecto. Lo notable fue la puesta en escena.</li>
</ul></div>
</section>

<section>
<h2>Boyle, Hooke y la bomba de aire</h2>
<div class="box contexto"><h4>Después de la guerra civil inglesa</h4><p>Robert Boyle (1627-1691), decimocuarto hijo del conde de Cork, heredó una fortuna y la gastó en ciencia. En Oxford (1654-1668) formó parte del círculo de John Wilkins, John Wallis, Christopher Wren, Thomas Willis. Tras la caída del Protectorado y la Restauración de Carlos II (1660), este grupo, que se reunía en Gresham College, Londres, fundó la <em>Royal Society</em> (28 de noviembre de 1660; carta real en 1662). Querían una ciencia al margen de las disputas políticas y religiosas que habían desangrado al país: una comunidad de «caballeros» que verificaría hechos con experimentos y los publicaría. El secretario Henry Oldenburg lanzó en marzo de 1665 las <em>Philosophical Transactions</em>, la primera revista científica regular, con la fecha de recepción como prueba de prioridad. En Francia, Colbert fundó en 1666 la Académie royale des sciences; en Florencia, el príncipe Leopoldo de Médicis patrocinó la Accademia del Cimento (1657-1667), cuyo lema era «<em>Provando e riprovando</em>» (probando y volviendo a probar).</p></div>
<div class="people">
<div class="persona"><b>Robert Boyle</b><small>1627 – 1691 · Lismore, Oxford, Londres</small><p>Físico y químico, teólogo, escéptico. <em>The Sceptical Chymist</em> (1661), <em>New Experiments Physico-Mechanical</em> (1660), ley de los gases (1662). Rico, ocupado y reservado.</p></div>
<div class="persona"><b>Robert Hooke</b><small>1635 – 1703 · Oxford, Londres</small><p>Constructor de la bomba de Boyle, conservador de experimentos de la Royal Society, autor de <em>Micrographia</em> (1665), arquitecto tras el Gran Incendio. Brillante, irritable, a menudo sin crédito.</p></div>
<div class="persona"><b>Richard Towneley y Henry Power</b><small>1629–1707 · 1623–1668 · Lancashire, Halifax</small><p>Aficionados del norte de Inglaterra. Midieron el aire comprimido en el barómetro y formularon la relación recíproca, que Boyle publicó en 1662 con su nombre.</p></div>
<div class="persona"><b>Thomas Hobbes</b><small>1588 – 1679 · Londres</small><p>Filósofo mecanicista. Rechazó el vacío y la autoridad del experimento en su <em>Dialogus physicus</em> (1661).</p></div>
<div class="persona"><b>Edme Mariotte</b><small>1620 – 1684 · Dijon, París</small><p>Prior y físico de la Académie. Redescubrió la ley de Boyle (1676), que en Francia lleva su nombre.</p></div>
<div class="persona"><b>Henry Oldenburg</b><small>c. 1619 – 1677 · Bremen, Londres</small><p>Secretario de la Royal Society y editor de las <em>Transactions</em>, mantuvo correspondencia con la mitad de Europa. Fue encarcelado brevemente en 1667 por sospecha de espionaje.</p></div>
</div>
<p>En 1658-1659, Boyle encargó a su ayudante Hooke construir una bomba de aire inspirada en la de Guericke, con un recipiente de vidrio y un émbolo. Con ella hizo cuarenta y tres experimentos, publicados en <em>New Experiments Physico-Mechanical, Touching the Spring of the Air</em> (1660): un animal muere, una llama se extingue, un reloj no se oye, el humo cae. Un adversario escolástico, Franciscus Linus, objetó que el mercurio se sostenía en el tubo no por el peso del aire sino por un «funículo», una cuerda invisible. Boyle contestó en 1662 con el experimento del tubo en J.</p>
<div class="sim" data-sim="boyle-jtube" data-title="El tubo en J de Boyle y su tabla de 1662"></div>
<div class="sim-guide"><ul>
<li>Las 25 medidas de Boyle caen sobre la recta \(P=1401/V+0.2\), con una ordenada en el origen prácticamente nula: \(PV\) es constante con desviaciones menores del 1 %.</li>
<li>Mueva el mercurio: la columna de aire se reduce a la mitad cuando la presión se duplica (29 pulgadas de mercurio añadidas a las 29 de la atmósfera).</li>
</ul></div>
<div class="eq key" data-name="Ley de Boyle–Mariotte">\[P\,V=\text{cte}\quad(T\ \text{constante}).\]</div>
<div class="box epist"><h4>Hechos, testigos y el aire de Boyle</h4><p>En <em>Leviathan and the Air-Pump</em> (1985), Steven Shapin y Simon Schaffer estudiaron la controversia entre Boyle y Hobbes como la construcción de una forma de conocer. Boyle sostenía que los «hechos de la naturaleza» se establecen con experimentos hechos ante testigos, y que cada experimento debe ser publicado con detalles para que los lectores sean «testigos virtuales» sin estar presentes. Hobbes replicaba que el vacío era filosóficamente imposible, que la bomba era un instrumento caro con fugas, y que nada que dependiera de un aparato privado podía producir certeza. Boyle triunfó (la Royal Society adoptó su estilo) y hoy cada artículo experimental sigue su modelo: método detallado, repetibilidad, testigos.</p><p>El episodio más instructivo fue el de la <em>suspensión anómala</em>: en un barómetro de agua dentro de la bomba, el agua quedaba suspendida contra toda la teoría. Solo Huygens, que construyó una bomba en La Haya, la reprodujo en 1661; Boyle aceptó el fenómeno cuando Huygens lo vio con sus ojos en Londres, en 1663. En ese caso, un experimento difícil fue aceptado por la autoridad de un testigo prestigioso, no por una réplica abierta a todos: una advertencia sobre la «crisis de replicación» de cualquier siglo.</p></div>
<h3>Hooke y la elasticidad</h3>
<p>Hooke trabajaba sobre resortes para los relojes: en 1676 publicó un anagrama (<em>ceiiinosssttuv</em>) para asegurar la prioridad sin revelar el contenido, y dos años después su significado: <em>ut tensio, sic vis</em>, «como la extensión, así la fuerza».</p>
<div class="eq key" data-name="Ley de Hooke (1678)">\[F=-k\,x.\]</div>
<p>La ley es una aproximación válida mientras no se supere el <em>límite elástico</em>; pero toda fuerza restauradora es, para pequeñas deformaciones, un resorte (desarrollo de Taylor), de modo que es una de las leyes más generales de la física: de los péndulos a las vibraciones de los cristales (capítulos 16 y 32). El uso de anagramas era corriente (Galileo con Venus, Huygens con el anillo de Saturno): protegían la prioridad sin revelar el secreto. Una época que aún no tenía patentes ni revistas rápidas inventó este curioso mecanismo.</p>
<div class="box rivalidad"><h4>Hooke, el hombre que quedó en segundo plano</h4><p>Hooke fue un genio práctico y sufrió la competencia de todos. Disputó con Huygens sobre el resorte espiral del reloj (1675), con Oldenburg sobre sus lentes y con Newton sobre la luz y la gravitación (capítulos 14 y 15). Murió sin que existiera ningún retrato suyo (el que se le atribuía es de otro). Boyle, rico, aparece como «inventor» de la ley de los gases; Hooke construyó la bomba; Towneley y Power lanzaron la hipótesis. Es un caso de efecto Mateo (Merton, 1968): el crédito va al más famoso del trío.</p></div>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule la altura de la columna de agua (998 kg/m³) y de aceite (920 kg/m³) que sostiene la presión atmosférica de 101 325 Pa.
<details><summary>Respuesta</summary><p>\(h=P/\rho g\): agua 10.35 m; aceite 11.23 m.</p></details></li>
<li><span class="lvl">Básico</span>Una prensa hidráulica tiene émbolos de 4 cm y 40 cm de diámetro. Con 200 N en el pequeño, ¿qué fuerza hay en el grande?
<details><summary>Respuesta</summary><p>\(F_2=F_1(D_2/D_1)^2=200\times100=20\,000\) N.</p></details></li>
<li><span class="lvl">Intermedio</span>En Clermont, \(h=711.7\) mm; en la cima, \(627.1\) mm. Con \(P=P_0\ee^{-z/H}\) y \(H=8.43\) km, calcule el desnivel.
<details><summary>Respuesta</summary><p>\(z=H\ln(711.7/627.1)=8430\times0.1265=1067\) m.</p></details></li>
<li><span class="lvl">Intermedio</span>En el tubo de Boyle, la columna de aire pasa de 48 a 24 pulgadas. ¿Cuánto mercurio hay que añadir (con \(P_0=29.125\) pulg Hg)?
<details><summary>Respuesta</summary><p>\(P_f=P_0\times48/24=58.25\) pulg; mercurio añadido: 29.1 pulg. Boyle midió 29 11/16 = 29.69 (desfase del 2 %).</p></details></li>
<li><span class="lvl">Avanzado</span>Aplique las nociones de Shapin y Schaffer (testigo virtual, confianza social) al criterio actual de reproducibilidad. ¿Qué papel cumple hoy la «réplica independiente» frente al testimonio de una figura prestigiosa?
<details><summary>Respuesta</summary><p>Respuesta abierta. Elementos: la publicación de métodos detallados y de datos sustituye al público presente; las réplicas independientes (como la de Huygens) son el criterio de aceptación; los casos en que un resultado fue aceptado por la fama del autor y falló al replicarse (fusión fría, 1989) muestran que la norma moderna es más estricta que la del siglo XVII, pero no inmune.</p></details></li>
</ol>
