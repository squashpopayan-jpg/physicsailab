<p class="lead">En 1803, en una sala de la Royal Institution de Londres, un médico de treinta años puso una tarjeta de un décimo de pulgada de grosor en el camino de un haz de luz solar y observó la sombra: junto a los bordes aparecían franjas de colores y, dentro de la sombra, franjas oscuras y brillantes. La luz que bordeaba la tarjeta por un lado interfería con la del otro. Thomas Young había dado el argumento más sencillo a favor de una idea que Newton, un siglo antes, había rechazado: que la luz es una onda. El mundo científico británico lo ignoró, y Henry Brougham, un abogado con ambiciones literarias, escribió que sus artículos eran «sin valor». Veinte años después, un ingeniero francés casi desconocido demostró lo mismo con una teoría completa, y esta vez ganó.</p>

<div class="vitals">
<div><b>Época</b>1801 – 1862</div>
<div><b>Lugares</b>Londres, París, Múnich, Heidelberg</div>
<div><b>Idea</b>interferencia, difracción, ondas transversales</div>
<div><b>Resultado</b>luz ondulatoria, espectroscopía</div>

<section>
<h2>El estado de la cuestión hacia 1800</h2>
<div class="box contexto"><h4>Una «victoria» de Newton que no era tan clara</h4><p>En 1800 la óptica era newtoniana en Francia y en Inglaterra: la luz como un chorro de corpúsculos que pasan de un medio a otro (capítulo 15). Esa idea explicaba bien la reflexión y la propagación rectilínea; la refracción exigía que los corpúsculos aceleraran al entrar en el vidrio, la difracción de Grimaldi (1665) y los anillos de Newton exigían «accesos» de fácil transmisión que Newton nunca explicó del todo. Huygens (1690) y Euler (1746) defendían una onda de éter, pero la onda de Huygens era longitudinal, como el sonido, y no explicaba la doble refracción más que con el «segundo rayo» de su elipsoide. En París, la escuela de Laplace y Berthollet (el grupo de Arcueil) dominaba el panorama científico con el programa de reducir la física a fuerzas de corto alcance entre partículas de materia y de luz; y los mejores físicos de la Academia (Laplace, Biot, Poisson, Malus) eran partidarios de la emisión.</p></div>
<div class="people">
<div class="persona"><b>Thomas Young</b><small>1773 – 1829 · Londres, Cambridge</small><p>Cuáquero, hijo mayor de un comerciante, políglota precoz. Médico, físico, egiptólogo (descifró parte de la piedra Rosetta), inventor del concepto de módulo de elasticidad y de la teoría tricromática del color. Fue el último hombre que lo sabía todo, según su biógrafo, y quizá por eso no destacó en ningún sitio durante su vida.</p></div>
<div class="persona"><b>Étienne-Louis Malus</b><small>1775 – 1812 · París</small><p>Ingeniero militar de Napoleón (Egipto), estudió la doble refracción por reflexión en 1808 mirando el sol poniente reflejado en las ventanas del Palacio de Luxemburgo a través de un cristal de espato de Islandia. Murió a los 36 años, de tuberculosis.</p></div>
<div class="persona"><b>Augustin-Jean Fresnel</b><small>1788 – 1827 · Broglie, París</small><p>Ingeniero de Puentes y Caminos, hijo de un arquitecto monárquico. Perseguido y suspendido por apoyar a Napoleón en los Cien Días, aprovechó el exilio forzado en la casa de su madre para dedicarse a la óptica. Murió de tuberculosis a los 39 años.</p></div>
<div class="persona"><b>François Arago</b><small>1786 – 1853 · París</small><p>Astrónomo, secretario perpetuo de la Academia de Ciencias. Convertido a la teoría ondulatoria por Fresnel, fue su protector. Hizo el experimento de la mancha de Poisson.</p></div>
<div class="persona"><b>Siméon Denis Poisson</b><small>1781 – 1840 · París</small><p>Matemático, miembro del jurado del concurso de 1818. Defensor de la emisión; dedujo la mancha como consecuencia absurda de la teoría de Fresnel.</p></div>
<div class="persona"><b>Joseph von Fraunhofer</b><small>1787 – 1826 · Múnich</small><p>Huérfano, aprendiz de vidriero; sobrevivió al derrumbe de su taller en 1801. Fue el mejor óptico de su tiempo y descubrió las líneas del espectro solar al calibrar sus lentes.</p></div>
<div class="persona"><b>Hippolyte Fizeau y Léon Foucault</b><small>1819–1896 · 1819–1868 · París</small><p>Amigos de juventud (fotografiaron juntos el Sol en 1845) hasta 1849, cuando se disputaron la medida de la velocidad de la luz. Fizeau, rico, usó una rueda dentada; Foucault, hijo de un editor y abandonó medicina por impresionabilidad, un espejo giratorio.</p></div>
<div class="persona"><b>Gustav Kirchhoff y Robert Bunsen</b><small>1824–1887 · 1811–1899 · Heidelberg</small><p>El físico teórico y el químico experimental. Con un mechero (el de Bunsen) y un espectroscopio abrieron la química del cielo.</p></div>
</div>
</section>

<section>
<h2>Young y la interferencia</h2>
<ol class="chain">
<li><b class="y">1800-1801 <span>· Sonido y luz</span></b><p>Young, que investigaba el sonido y el ojo, notó que dos sonidos de frecuencia próxima producen batidos. Si la luz fuera una onda, deberían existir fenómenos análogos: puntos donde luz más luz da oscuridad. En 1801 (Bakerian Lecture) formuló el principio de interferencia y explicó los anillos de Newton con él: la separación entre los anillos se relacionaba con la longitud de onda; con los datos de Newton obtuvo unos 0.5 µm.</p></li>
<li><b class="y">1802-1803 <span>· La tarjeta y los dos agujeros</span></b><p>La famosa versión de «dos agujeros» no es la primera: Young describió en 1803 la sombra de una tarjeta fina con franjas, y luego dos pequeños orificios en una pantalla. La separación de las franjas depende de la longitud de onda: \(y_m=m\lambda L/d\). Con sus medidas estimó λ entre 1/60 000 (violeta) y 1/36 000 (rojo) de pulgada: 423 y 706 nm. Los valores modernos son 400 y 700 nm: el error es de menos del 6 %.</p></li>
<li><b class="y">1804-1809 <span>· Brougham y el silencio</span></b><p>Brougham, en la <em>Edinburgh Review</em>, llamó a la obra de Young «una colección de hipótesis sin valor» (1803, 1804). Young, que no era buen conferenciante ni polemista y había aceptado un cargo de médico, abandonó la óptica durante una década; en la <em>Enciclopedia</em> británica y en su curso de 1807 dejó una exposición completa que nadie leyó.</p></li>
<li><b class="y">1817 <span>· La luz transversal</span></b><p>Arago escribió a Young sobre un resultado de Fresnel: dos haces polarizados en planos perpendiculares no interfieren. Young respondió que eso era posible si las vibraciones de la luz fueran <em>transversales</em>, como las de una cuerda: la hipótesis más audaz del siglo, porque en un fluido (el éter) no existen ondas transversales.</p></li>
</ol>
<div class="eq key" data-name="Franjas de Young">\[I(y)=I_0\cos^2\!\left(\frac{\pi d\,y}{\lambda L}\right)\operatorname{sinc}^2\!\left(\frac{\pi a\,y}{\lambda L}\right).\]</div>
<div class="sim" data-sim="young-franjas" data-title="Las franjas de Young frente a la predicción corpuscular"></div>
<div class="sim-guide"><ul>
<li>Con la predicción corpuscular activada se ve una envolvente ancha, sin ceros en el centro, que es lo que daría un chorro de partículas pasando por dos rendijas. La onda muestra ceros exactos entre los máximos: <em>luz más luz puede dar oscuridad</em>.</li>
<li>Aumente \(d\): las franjas se juntan; cambie el color: las franjas del rojo son más anchas que las del violeta. Así es como Young pudo asociar cada color a una longitud de onda.</li>
</ul></div>
<div class="box epist"><h4>Por qué no convenció (la teoría no basta con la evidencia)</h4><p>Young tenía la evidencia (las franjas) y la analogía (el sonido), pero no tenía una <em>teoría matemática completa</em> capaz de calcular intensidades y explicar la propagación rectilínea y la polarización. Y la autoridad de Newton, la de Laplace y la del programa de Arcueil pesaban sobre sus críticos. Lo que hace aceptable una teoría no es solo un experimento: es un programa de investigación que produce predicciones nuevas (Lakatos). Fue lo que hizo Fresnel. Kuhn añadiría que cuando un paradigma está bien asentado, las anomalías se archivan, y las franjas fueron durante veinte años una anomalía curiosa.</p></div>
<div class="box leyenda"><h4>Young «demostró» que la luz es una onda</h4><p>Es una versión simplificada. Las franjas de Young eran compatibles con una teoría corpuscular con «accesos» newtonianos modificada; fue necesario el trabajo de Fresnel, con una teoría que explicaba la difracción, la polarización y la propagación rectilínea con un solo principio. Y la demostración llegó con un experimento que nadie esperaba (la mancha de Poisson) y, después, con la medida de la velocidad en el agua (1850).</p></div>
</section>

<section>
<h2>Fresnel, la Academia y la mancha</h2>
<ol class="chain">
<li><b class="y">1808-1810 <span>· Malus</span></b><p>Malus encontró que un haz reflejado en un vidrio a cierto ángulo se comporta como si tuviera «lados», como si hubiera sido polarizado, y que cada haz de la doble refracción también. La ley \(I=I_0\cos^2\theta\) (1809) es suya. Explicó el fenómeno con corpúsculos con polos, y la Academia le dio el premio de 1810: otra victoria de la emisión.</p></li>
<li><b class="y">1815-1818 <span>· Fresnel</span></b><p>Fresnel, aislado en Normandía y sin conocer los trabajos de Young, redescubrió la interferencia con medidas de bandas de difracción en los bordes de pantallas y con el «espejo doble» (1816). Combinó el principio de Huygens con la interferencia de las ondas secundarias para calcular la difracción con integrales (las de Fresnel). Arago, que vio la fuerza de sus resultados, lo hizo venir a París.</p></li>
<li><b class="y">1818-1819 <span>· El concurso de la Academia</span></b><p>El tema de 1818 era la difracción, y los jueces eran Laplace, Biot, Poisson, Arago y Gay-Lussac: cuatro de los cinco eran partidarios de la emisión. Fresnel presentó la memoria sobre la difracción de los bordes y de rendijas. Poisson hizo notar, con ironía, que su teoría predecía un punto brillante en el centro de la sombra de un disco opaco. Arago hizo el experimento y el punto apareció. Fresnel ganó el premio.</p></li>
<li><b class="y">1821-1823 <span>· Ondas transversales y dobles refracciones</span></b><p>Fresnel adoptó la sugerencia de Young: la luz son vibraciones perpendiculares a la dirección de propagación. De ahí dedujo las leyes de la reflexión y la transmisión con las polarizaciones (las fórmulas que llevan su nombre, 1823) y las de la doble refracción en cristales biaxiales. Predijo la refracción cónica, que Hamilton calculó y Lloyd observó en 1832.</p></li>
</ol>
<div class="sim" data-sim="poisson-mancha" data-title="La mancha de Arago–Poisson en la sombra de un disco"></div>
<div class="sim-guide"><ul>
<li>Cambie el número de Fresnel \(F=a^2/(\lambda z)\): el centro de la sombra queda casi tan brillante como sin disco (≈ 0.9) y está rodeado de anillos. La óptica de rayos predice un círculo de sombra perfecta.</li>
<li>La imagen de la derecha reproduce con anillos la sombra: el disco, el punto central y los anillos de difracción.</li>
</ul></div>
<div class="sim" data-sim="borde-fresnel" data-title="La difracción de un borde recto: integrales de Fresnel"></div>
<div class="sim-guide"><ul>
<li>Fuera de la sombra aparecen franjas cuya primera cresta alcanza 1.37 veces la luz incidente; en el borde geométrico la intensidad es 1/4; dentro, cae sin borde nítido. Cambie λ y z para ver cómo se escala el patrón con \(\sqrt{\lambda z/2}\).</li>
</ul></div>
<div class="box rivalidad"><h4>Poisson, Arago y la prioridad</h4><p>La imagen del jurado derrotado por su propio argumento es una buena historia, pero la rivalidad se manifestó de otra forma. Biot, que no aceptó nunca del todo la teoría ondulatoria, siguió defendiendo la emisión hasta los años 1830, y los de Arcueil nunca fueron hostiles a Fresnel en lo personal: Laplace votó por el premio. Lo que sí hubo fue una discusión de prioridad: Young se quejó con razón de que Fresnel había redescubierto sus resultados, y Fresnel, honradamente, reconoció la prioridad de Young en la interferencia en una carta de 1824. Arago, que presidía la Academia y se hizo defensor de Fresnel, tuvo un papel decisivo: la teoría de Young se había perdido en Londres; la de Fresnel ganó en París porque Arago supo difundirla. La ciencia tiene un componente de política institucional.</p></div>
<div class="box leyenda"><h4>«Poisson se burló y fue desmentido»</h4><p>Es verdad en su estructura (una consecuencia aparentemente absurda que el experimento confirma) pero la mancha había sido descrita por Maraldi (1723) y por Delisle, sin que nadie la relacionara con la teoría. Lo esencial es epistemológico: era una <em>predicción arriesgada</em>, algo que un popperiano llamaría el prototipo de una teoría audaz sometida a refutación; la teoría del concurrente no podía predecirla ni explicarla.</p></div>
</section>

<section>
<h2>¿Más lenta en el agua? El experimento crucial</h2>
<ol class="chain">
<li><b class="y">1838 <span>· La propuesta de Arago</span></b><p>Arago propuso comparar la velocidad de la luz en el aire y en el agua con un espejo giratorio. Si la luz es una partícula, debe ir <em>más rápida</em> en el agua (donde se acerca a la normal); si es una onda, <em>más lenta</em>. Era un experimento crucial de manual (<em>experimentum crucis</em>, en el sentido de Bacon).</p></li>
<li><b class="y">1849 <span>· Fizeau</span></b><p>Fizeau midió la velocidad de la luz en el aire con una rueda dentada de 720 dientes y un recorrido de 8.6 km (de Suresnes a Montmartre): 315 300 km/s. La luz que pasaba por un hueco volvía y era eclipsada por el diente siguiente. Un error de un 5 % comparado con el valor actual.</p></li>
<li><b class="y">1850 <span>· Foucault y el agua</span></b><p>Con un espejo giratorio a unas 800 vueltas por segundo, Foucault comparó dos haces, uno por aire y otro por un tubo de agua, y mostró que en el agua la imagen se desviaba <em>más</em>: la velocidad era menor, en la razón 3/4 (el índice 4/3). Fizeau, en una carrera con Foucault, publicó el mismo resultado pocas semanas después. La emisión de Newton quedó refutada.</p></li>
<li><b class="y">1862 <span>· La velocidad absoluta</span></b><p>Foucault, con una versión mejorada, obtuvo 298 000 ± 500 km/s: la mejor cifra hasta entonces, a un 0.6 % del valor correcto. Esa cifra, junto con la de Weber y Kohlrausch, es la que aprovecharía Maxwell (capítulo 21).</p></li>
</ol>
<div class="sim" data-sim="foucault-espejo" data-title="El espejo giratorio de Foucault"></div>
<div class="sim-guide"><ul>
<li>La desviación de la imagen es \(s=4\Omega D R/c\): del orden de un milímetro a unos 800 rev/s y 20 m. Active el tubo de agua: la desviación aumenta en un factor 4/3. Es la evidencia en contra de Newton.</li>
</ul></div>
<div class="box epist"><h4>¿Existen los experimentos cruciales?</h4><p>Foucault y los suyos habían descubierto, según la narración habitual, el experimento que decide entre dos teorías. Duhem, medio siglo después, dijo que no existe tal cosa: un experimento solo pone a prueba un <em>conjunto</em> de hipótesis, y concluir que la luz es una onda a partir de que la emisión falla supone que no hay más alternativas, lo que ninguna lógica garantiza. Hay un doble problema: (1) lo que se refutó fue una teoría concreta de los corpúsculos, y alguien podía haber ajustado las hipótesis auxiliares; (2) cualquier experimento nuevo supone una teoría de los instrumentos. Con todo, en la práctica la comunidad aceptó la teoría de ondas: el peso de la evidencia acumulada (interferencia, difracción, polarización, mancha, velocidad) convirtió el resultado de Foucault en un «experimento decisivo» en un sentido pragmático. Quine retomó el argumento: nada se enfrenta solo al tribunal de la experiencia. Y Kuhn observó que las generaciones de newtonianos no se convencieron por el experimento, sino que se fueron retirando.</p></div>
</section>

<section>
<h2>Fraunhofer, Kirchhoff y Bunsen: leer los espectros</h2>
<ol class="chain">
<li><b class="y">1802-1814 <span>· Líneas oscuras</span></b><p>Wollaston (1802) vio siete líneas oscuras en el espectro solar y creyó que eran los límites entre colores. Fraunhofer, en Múnich, quería una luz de longitud de onda definida para calibrar sus lentes acromáticas; con un prisma de calidad excepcional y un telescopio vio 574 líneas oscuras (1814) y marcó las principales con letras A a K. Descubrió que las mismas líneas están en la luz de la Luna y de los planetas, y que las estrellas tenían espectros distintos: las líneas son propiedad de la luz solar, no del prisma.</p></li>
<li><b class="y">1821-1823 <span>· La rejilla</span></b><p>Fraunhofer construyó rejillas de hilos finos y, luego, rayadas con diamante, y con ellas midió <em>longitudes de onda absolutas</em>: para la línea D, 588.7 nm (hoy 589.3). La ecuación de la rejilla es \(d\,\sen\theta=m\lambda\). Su prematura muerte (a los 39 años, de tuberculosis, quizá agravada por los vapores de plomo y vidrio) interrumpió el programa.</p></li>
<li><b class="y">1859-1861 <span>· Kirchhoff y Bunsen</span></b><p>En Heidelberg, Kirchhoff mostró que la línea oscura D de Fraunhofer coincide con la línea brillante del sodio, y que la luz de una lámpara pasando por la llama del sodio muestra D <em>en absorción</em>: los gases absorben las mismas líneas que emiten. Dedujo que el Sol tiene una atmósfera con sodio, hierro, calcio y otros elementos. Bunsen y Kirchhoff descubrieron dos elementos nuevos por sus líneas: el cesio (1860) y el rubidio (1861).</p></li>
</ol>
<div class="sim" data-sim="espectrometro-red" data-title="Un espectrómetro de rejilla"></div>
<div class="sim-guide"><ul>
<li>Cada fila es el espectro de un elemento. Cambie las líneas por milímetro: las posiciones de las líneas no cambian en la escala de longitud de onda, pero el poder de resolución depende de \(N\,m\). Con 1000 líneas en primer orden es suficiente para separar las dos líneas del sodio (589.0 y 589.6 nm).</li>
</ul></div>
<div class="box leyenda"><h4>Comte y las estrellas</h4><p>Auguste Comte (1835) puso como ejemplo de conocimiento imposible la composición química de las estrellas: «jamás podremos estudiar su composición química». Veinticuatro años después, Kirchhoff y Bunsen lo hicieron. La anécdota se cuenta como una refutación del positivismo; Comte, sin embargo, hablaba de lo que parecía inalcanzable <em>con los métodos conocidos</em>, y el episodio muestra más bien que los límites del conocimiento los fijan las técnicas, no la filosofía: un tema que reaparecerá con el helio (visto en el Sol en 1868 antes de encontrarse en la Tierra, 1895).</p></div>
<div class="box epist"><h4>Ver con instrumentos y a través de teorías</h4><p>Una línea espectral solo es «un elemento» si se acepta una teoría de la emisión y la absorción de la luz (Kirchhoff, 1859), y si el espectroscopio no inventa las líneas (Fraunhofer comprobó que no). Los instrumentos son teorías materializadas (Bachelard): lo que se observa depende de la teoría con la que se interpreta. Que las líneas de un mismo elemento aparecieran siempre en el mismo lugar era una regularidad sin explicación hasta Bohr, ochenta años después (capítulo 28).</p></div>
</section>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>En un experimento de Young con \(d=0.25\) mm y pantalla a \(L=1\) m con luz de 550 nm, ¿cuál es la distancia entre franjas?
<details><summary>Respuesta</summary><p>\(\Delta y=\lambda L/d=550\times10^{-9}\cdot1/0.25\times10^{-3}=2.2\) mm.</p></details></li>
<li><span class="lvl">Básico</span>Convierta a nanómetros las longitudes de onda de Young: 1/36 000 y 1/60 000 de pulgada.
<details><summary>Respuesta</summary><p>\(25.4\text{ mm}/36000=705.6\) nm y \(25.4\text{ mm}/60000=423.3\) nm.</p></details></li>
<li><span class="lvl">Intermedio</span>Con la ley de Malus: un haz sin polarizar de intensidad \(I_0\) pasa por un polarizador, luego por un segundo a 45° y por un tercero a 90° del primero. ¿Qué intensidad sale?
<details><summary>Respuesta</summary><p>Tras el primero \(I_0/2\); tras el segundo, \(\tfrac{I_0}{2}\cos^2 45^\circ=I_0/4\); tras el tercero, \(\tfrac{I_0}{4}\cos^2 45^\circ=I_0/8\). Sin el polarizador intermedio saldría 0: es una prueba de que la luz es una onda <em>transversal</em>.</p></details></li>
<li><span class="lvl">Intermedio</span>Si Foucault gira el espejo a 800 rev/s, el espejo fijo está a 20 m y la pantalla a 1 m del espejo giratorio, ¿cuál es la desviación de la imagen?
<details><summary>Respuesta</summary><p>\(s=4\Omega DR/c=4\cdot(2\pi\cdot800)\cdot20\cdot1/(3\times10^8)=1.34\) mm. En el agua sería 1.79 mm (factor 4/3).</p></details></li>
<li><span class="lvl">Avanzado</span>¿Cuántas líneas ilumina una rejilla para resolver en primer orden el doblete D del sodio (588.995 y 589.592 nm)?
<details><summary>Respuesta</summary><p>\(R=\lambda/\Delta\lambda=589.3/0.597\approx987\). Se necesitan al menos 987 líneas en primer orden (494 en segundo).</p></details></li>
<li><span class="lvl">Avanzado</span>Duhem sostiene que un experimento no puede ser crucial. ¿Cómo aplicaría el argumento al experimento de Foucault y qué hipótesis auxiliares había?
<details><summary>Respuesta</summary><p>Se probó la hipótesis «la luz son corpúsculos que se aceleran al entrar en un medio más denso» junto con la teoría del instrumento (el espejo y la medida del ángulo) y el supuesto de que no hay más teorías posibles. Un partidario de la emisión podía rechazar un auxiliar (por ejemplo, la influencia del éter o de la dispersión), y se hizo. Lo que decidió fue el conjunto de la evidencia, no el experimento aislado.</p></details></li>
</ol>
