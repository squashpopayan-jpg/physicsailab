<p class="lead">En mayo de 1905, en Berna, un empleado de tercera clase de la oficina de patentes fue a visitar a su amigo Michele Besso. Habían hablado durante semanas de un problema que le obsesionaba: las ecuaciones de Maxwell daban el mismo resultado para un imán que se mueve hacia una bobina que para una bobina que se mueve hacia un imán, pero la explicación era distinta en cada caso (en uno había un campo eléctrico, en el otro no). «Le dije adiós y le dije: “He resuelto el problema”», recordó Albert Einstein. «Una análisis del concepto de tiempo era la solución.» Seis semanas después envió a los <em>Annalen der Physik</em> el artículo «Sobre la electrodinámica de los cuerpos en movimiento», sin una sola nota a pie de página con referencias.</p>

<section>
<h2>Un problema que no cabía en ninguna casilla</h2>
<div class="box contexto"><h4>Un joven sin cátedra</h4><p>Einstein se graduó en el Politécnico de Zúrich en 1900 con 21 años; fue el único de su promoción que no obtuvo un puesto de ayudante, y vivió dos años de clases particulares y suplencias. Un amigo, Marcel Grossmann, intercedió con su padre, y en 1902 entró en la oficina de patentes de Berna, donde examinaba solicitudes de aparatos eléctricos y de sincronización de relojes, un tema en el que las ideas de Poincaré sobre la simultaneidad eran un asunto práctico: los ferrocarriles suizos sincronizaban los relojes de las estaciones por señales eléctricas. En 1905, el «annus mirabilis», entregó cinco artículos: el cuanto de luz (capítulo 25), el movimiento browniano (capítulo 18), la tesis doctoral sobre el tamaño de las moléculas, la relatividad y E = mc².</p></div>
<div class="people">
<div class="persona"><b>Albert Einstein</b><small>1879 – 1955 · Ulm, Zúrich, Berna, Berlín</small><p>Alumno rebelde, lector de Hume, Mach y Poincaré. Con Besso, Solovine y Habicht formó la «Academia Olimpia», donde se leyeron esos libros. La anécdota de que fue mal estudiante de matemáticas es un mito: había dominado el cálculo a los quince años.</p></div>
<div class="persona"><b>Michele Besso</b><small>1873 – 1955 · Berna</small><p>Ingeniero, amigo y caja de resonancia. Es la única persona agradecida en el artículo de 1905.</p></div>
<div class="persona"><b>Mileva Marić</b><small>1875 – 1948 · Zúrich, Berna</small><p>Serbia, la única mujer de su curso en el Politécnico. Primera esposa de Einstein (1903-1919). Su papel en la teoría es un asunto de discusión pública (véase más abajo).</p></div>
<div class="persona"><b>Hendrik Lorentz y Henri Poincaré</b><small>1853–1928 · 1854–1912</small><p>Los dos grandes de la teoría previa. Lorentz mantuvo el éter hasta su muerte; Poincaré enunció el principio de relatividad en 1904 y publicó en 1905-1906 una teoría casi completa, pero siempre con el éter como marco privilegiado.</p></div>
<div class="persona"><b>Walter Kaufmann y Max Abraham</b><small>1871–1947 · 1875–1922</small><p>Experimentador y teórico de la masa del electrón. Abraham defendió hasta su muerte una teoría electromagnética alternativa.</p></div>
<div class="persona"><b>Hermann Minkowski</b><small>1864 – 1909 · Zúrich, Gotinga</small><p>Matemático, antiguo profesor de Einstein. Dio a la relatividad su forma geométrica en 1908; murió de apendicitis a los 44 años.</p></div>
<div class="persona"><b>Bruno Rossi</b><small>1905 – 1993 · Florencia, Chicago, MIT</small><p>Físico de rayos cósmicos, expulsado de Italia por las leyes raciales de 1938. Midió con David Hall la vida de los muones.</p></div>
</div>

<section>
<h2>De la teoría del éter a la de Einstein</h2>
<ol class="chain">
<li><b class="y">1895-1904 <span>· Lorentz</span></b><p>Lorentz (capítulo 23) introdujo el tiempo local \(t'=t-vx/c^2\) como variable auxiliar y la contracción \(\sqrt{1-v^2/c^2}\), y en 1904 demostró que las ecuaciones de Maxwell son invariantes bajo una transformación que él llamó «de segundo orden». Pensaba que el tiempo verdadero era el del éter, y que el local no era más que una ayuda de cálculo.</p></li>
<li><b class="y">1898-1905 <span>· Poincaré</span></b><p>Poincaré observó que las señales luminosas con las que sincronizamos relojes suponen que la velocidad de ida y vuelta es la misma: una <em>convención</em>, no una verdad. Enunció (1904) el «principio de relatividad» y obtuvo en 1905-1906 la forma completa de las transformaciones, el carácter de grupo y la invariancia de \(t^2-x^2\), con una dinámica del electrón «de Lorentz». Su ensayo de junio de 1905 salió casi a la vez que el de Einstein.</p></li>
<li><b class="y">junio 1905 <span>· Einstein</span></b><p>Einstein parte de dos postulados: (1) las leyes de la física son iguales en todos los sistemas inerciales; (2) la luz se propaga en el vacío con una velocidad \(c\) independiente del movimiento de la fuente. Define la simultaneidad con señales luminosas, deduce las transformaciones, la dilatación del tiempo, la contracción de longitudes, la composición de velocidades y el efecto Doppler, y reescribe la dinámica del electrón. No necesita el éter: simplemente es «superfluo». El resultado es una teoría que, para el experimento, es indistinguible de la de Lorentz y Poincaré; lo nuevo es la <em>interpretación</em>.</p></li>
<li><b class="y">septiembre 1905 <span>· E = mc²</span></b><p>Una nota de tres páginas muestra que un cuerpo que emite radiación con energía \(E\) pierde masa \(E/c^2\): «La masa de un cuerpo es una medida de su contenido de energía». Einstein sugirió que podría comprobarse con sales de radio.</p></li>
<li><b class="y">1908 <span>· Minkowski</span></b><p>En Colonia, Minkowski declaró: «De ahora en adelante el espacio por sí mismo y el tiempo por sí mismo están condenados a desvanecerse en sombras, y solo una especie de unión de los dos conservará una realidad independiente». El espacio-tiempo de cuatro dimensiones con el intervalo \(s^2=c^2t^2-x^2-y^2-z^2\) mostraba que las transformaciones de Lorentz son giros hiperbólicos. Einstein, que había llamado a eso «una erudición superflua», lo usaría en la relatividad general (capítulo 27).</p></li>
</ol>
<div class="eq key" data-name="Transformación de Lorentz y equivalencia masa-energía">\[x'=\gamma(x-vt),\quad t'=\gamma\Big(t-\frac{vx}{c^2}\Big),\quad \gamma=\frac1{\sqrt{1-v^2/c^2}};\qquad E=\gamma mc^2,\quad E^2=(pc)^2+(mc^2)^2 .\]</div>
<div class="sim" data-sim="minkowski-boost" data-title="Simultaneidad relativa en un diagrama de Minkowski"></div>
<div class="sim-guide"><ul>
<li>Para el observador en reposo A y B son simultáneos. Cambie \(\beta\): para el que se mueve, B ocurre antes (\(\beta>0\)) o después (\(\beta<0\)). Con \(x=3\) y \(\beta=0.6\), \(t'=-2.25\) años.</li>
<li>El intervalo \(t^2-x^2\) es el mismo en ambos sistemas (tercera línea).</li>
</ul></div>
<div class="box epist"><h4>¿Qué hizo Einstein que no hubieran hecho Lorentz y Poincaré?</h4><p>Las ecuaciones son las mismas, y la discusión de la prioridad (que apasionó a historiadores y publicistas) tiene dos respuestas honestas. Whittaker (1953) dio el crédito a Lorentz y Poincaré; Holton, Pais y la mayoría sostienen que Einstein dio un salto conceptual: en vez de explicar el resultado nulo de Michelson con una compensación entre efectos (contracción más tiempo local), lo dedujo de dos principios y dio un significado físico al tiempo de cada observador. En términos de Lakatos, el programa de Lorentz era <em>degenerativo</em> (cada hipótesis nueva explicaba un hecho ya conocido), y el de Einstein, progresivo (predecía \(E=mc^2\), la dilatación del tiempo, el efecto Doppler transversal). Kuhn diría que no es una cuestión de verdad sino de qué es un problema legítimo: Poincaré creía en la convencionalidad de la simultaneidad pero conservaba el éter como marco; Einstein eliminó la distinción entre «tiempo verdadero» y «tiempo local».</p></div>
<div class="box leyenda"><h4>«Mileva escribió la relatividad»</h4><p>La historia de que la primera esposa de Einstein fue coautora aparece en una biografía de 1990 y en documentales posteriores. Las cartas de 1899-1903 muestran que él la llamaba «mi hermanita» y que hablaban de física y de «nuestro trabajo sobre el movimiento relativo». Pero no hay manuscritos, borradores, cálculos ni testimonios independientes que le atribuyan una contribución específica; una frase de una carta («nuestro trabajo») no demuestra autoría. Lo que sí es una injusticia documentada es lo que perdió: una mujer con las mejores notas de su curso que suspendió dos veces el examen final (con Einstein, Ricci y Grossmann ya aprobados) y no pudo hacer carrera. La historia del papel de las mujeres en la física aparece en el capítulo 35.</p></div>
</section>

<section>
<h2>La prueba experimental</h2>
<ol class="chain">
<li><b class="y">1901-1908 <span>· Kaufmann, Abraham y Bucherer</span></b><p>Kaufmann midió e/m de los electrones β del radio en campos eléctricos y magnéticos cruzados con placas fotográficas. Abraham desarrolló una teoría del electrón como esfera rígida cuya masa es puramente electromagnética y varía con la velocidad de otro modo que la de Lorentz–Einstein. Los datos de Kaufmann (1906) favorecían a Abraham; Planck los reanalizó y mostró que no discriminaban. Bucherer (1908) usó condensadores con campo uniforme y favoreció a Lorentz–Einstein (aunque Bestelmeyer discrepó); no hubo acuerdo hasta Neumann (1914) y Guye y Lavanchy (1916).</p></li>
<li><b class="y">1911 <span>· Los gemelos</span></b><p>Langevin planteó que un viajero que va y vuelve a velocidad cercana a \(c\) llega más joven que su gemelo. La «paradoja» es que el movimiento es relativo, y el viajero podría decir lo mismo. La respuesta es que la situación no es simétrica: solo el viajero invierte su velocidad (cambia de sistema inercial) y su camino en el espacio-tiempo es el «más corto».</p></li>
<li><b class="y">1941 <span>· Rossi y Hall</span></b><p>Midieron con contadores el número de muones cósmicos a 3240 m y a 1616 m, y la velocidad. De la atenuación dedujeron la vida media en el sistema del muón: los resultados solo eran compatibles con la vida media de 2.2 µs si se incluía la dilatación del tiempo.</p></li>
</ol>

<div class="box rivalidad"><h4>Poincaré, Einstein y la cortesía de no citar</h4><p>Einstein nunca citó a Poincaré en sus artículos de 1905 sobre la relatividad, y en sus conferencias mencionó a Lorentz con respeto. Poincaré nunca pronunció públicamente el nombre de Einstein como autor de la relatividad hasta 1911 (en un informe de recomendación, lo elogió como un espíritu original, de quien «se puede esperar mucho»). La frialdad era mutua y probablemente metodológica: Poincaré no podía aceptar abandonar el éter; Einstein no creyó necesario discutir con él. El episodio es una advertencia contra las narraciones de prioridad: ambas tradiciones usaban el mismo formalismo y distinto concepto de qué era lo que se estaba haciendo.</p></div>
<div class="box epist"><h4>Postulados, convenciones y teorías de principios</h4><p>Einstein distinguió en 1919 entre <em>teorías de constructivas</em> (que explican un fenómeno desde un modelo, como la teoría cinética) y <em>teorías de principios</em> (que parten de leyes empíricas generales, como la termodinámica). La relatividad es de la segunda clase: sus postulados limitan lo que cualquier teoría física puede hacer, y le permiten ser inmune a los detalles del modelo (el éter o el electrón rígido). Es una estrategia que Einstein tomó de la termodinámica y que Kuhn, Reichenbach y Grünbaum discutieron: ¿la elección de que la velocidad de ida y de vuelta sea igual es una convención o un hecho? Hay una respuesta convencionalista (Reichenbach) y una realista; los experimentos de la sección siguiente no pueden zanjarla.</p></div>
</section>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule \(\gamma\) para \(\beta=0.6\) y \(\beta=0.99\).
<details><summary>Respuesta</summary><p>\(\gamma=1.25\) y \(7.09\).</p></details></li>
<li><span class="lvl">Básico</span>Una nave viaja a 0.8c hasta una estrella a 4 años luz y vuelve. ¿Cuánto tiempo pasa en la Tierra y para el viajero?
<details><summary>Respuesta</summary><p>Tierra: \(2L/v=10\) años. Viajero: \(10/\gamma=6\) años.</p></details></li>
<li><span class="lvl">Intermedio</span>Dos naves viajan al encuentro con 0.9c cada una respecto de la Tierra. ¿Cuál es su velocidad relativa?
<details><summary>Respuesta</summary><p>\((0.9+0.9)/(1+0.81)=0.9945\,c\).</p></details></li>
<li><span class="lvl">Intermedio</span>Un gramo de materia se convierte por completo en energía: ¿cuántos julios y cuántas toneladas de TNT (4.184 GJ/t)?
<details><summary>Respuesta</summary><p>\(mc^2=8.99\times10^{13}\) J = 21.5 kt de TNT.</p></details></li>
<li><span class="lvl">Avanzado</span>Un muón se produce a 15 km con \(\beta=0.9952\) y vive \(\tau=2.197\) µs en su reposo. Compare la supervivencia con y sin relatividad. Calcule la altura de la atmósfera en el sistema del muón.
<details><summary>Respuesta</summary><p>\(t=15\,000/(0.9952c)=50.3\) µs. Sin relatividad: \(e^{-50.3/2.197}=1.1\times10^{-10}\). Con \(\gamma=10.2\): \(e^{-50.3/22.4}=0.106\). Altura contraída: \(15/\gamma=1.47\) km, que el muón recorre en 4.9 µs: \(e^{-4.9/2.197}=0.107\). Los dos cálculos coinciden.</p></details></li>
<li><span class="lvl">Avanzado</span>¿Por qué es relevante para la epistemología que Lorentz–Poincaré y Einstein den las mismas predicciones? ¿Qué criterio prefiere Einstein sobre Lorentz?
<details><summary>Respuesta</summary><p>Es un caso de <em>subdeterminación</em> (Duhem, Quine): los datos no escogen entre dos teorías empíricamente equivalentes. Se escogió por simplicidad, unificación (mecánica y electromagnetismo en el mismo grupo) y fertilidad (relatividad general), criterios no empíricos. Las hipótesis ad hoc que cancelan efectos (contracción, tiempo local) disminuyen la elegancia pero no la verificabilidad.</p></details></li>
</ol>
