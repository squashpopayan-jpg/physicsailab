<p class="lead">En diciembre de 1930, Wolfgang Pauli, que no podía asistir a una reunión de físicos radiactivos en Tubinga por tener que ir a un baile en Zúrich, les escribió una carta que empezaba «Queridos señores y señoras radiactivos» y proponía una «cura desesperada» para un problema: en la desintegración beta, el electrón sale con una energía variable y parece que la energía no se conserva. ¿Y si un tercer cuerpo, una partícula neutra y ligera, se llevara la diferencia? «No me atrevo a publicarlo —añadía—, pero quien no arriesga no gana.» Treinta y seis años después, en 1956, esa partícula, el neutrino, que atraviesa la Tierra sin tocar nada, fue detectada junto a un reactor de Savannah River. Pauli, que tenía 56 años, recibió un telegrama: «Hemos detectado neutrinos».</p>

<section>
<h2>Del átomo a la tabla de partículas</h2>
<div class="box contexto"><h4>De la mesa de laboratorio al acelerador</h4><p>Hasta 1950 las partículas nuevas se encontraban en los rayos cósmicos, con cámaras de niebla y emulsiones fotográficas llevadas a la montaña en globos (Powell las llevó a los Pirineos y a Chacaltaya, en Bolivia). Después, el instrumento fue el acelerador: el ciclotrón de Lawrence (1931), el Cosmotrón de Brookhaven (1952), el Bevatrón de Berkeley (1954), el CERN (1954), el Acelerador Lineal de Stanford (1966). Con ellos nació la «física de altas energías»: grandes equipos (de 3 a 3000 autores por artículo), detectores del tamaño de edificios y colaboraciones internacionales. Fue la primera ciencia cuyo presupuesto depende de la política de Estado, y también la primera con un debate abierto sobre su coste y su sentido (el SSC de Texas se canceló en 1993 tras gastar 2000 millones de dólares).</p></div>
<div class="people">
<div class="persona"><b>Carl Anderson</b><small>1905 – 1991 · Pasadena</small><p>Joven alumno de Millikan; fotografió un electrón con carga positiva en una cámara de niebla (1932), sin conocer la predicción de Dirac. Descubrió el muón en 1936.</p></div>
<div class="persona"><b>Hideki Yukawa</b><small>1907 – 1981 · Osaka, Kioto</small><p>Sin acceso a acelerador ni a colegas, en un Japón aislado, predijo el mesón en 1935 con un argumento de alcance y masa. Primer japonés con el Nobel (1949).</p></div>
<div class="persona"><b>Cecil Powell</b><small>1903 – 1969 · Bristol</small><p>Con César Lattes (brasileño) y Giuseppe Occhialini identificó el pión en emulsiones expuestas en montañas, con una técnica barata que los grandes laboratorios desdeñaban.</p></div>
<div class="persona"><b>Chien-Shiung Wu</b><small>1912 – 1997 · Columbia</small><p>«La Primera Dama de la física»; llevó a cabo el experimento de la paridad en 1956-1957. Nunca recibió el Nobel.</p></div>
<div class="persona"><b>Murray Gell-Mann</b><small>1929 – 2019 · Caltech</small><p>Brillante, políglota y de carácter difícil. Ordenó los hadrones y propuso los quarks (1964).</p></div>
<div class="persona"><b>Weinberg, Salam y Glashow</b><small>1933–2021 · 1926–1996 · Harvard, Trieste</small><p>Los tres construyeron la teoría electrodébil unificada (1961-1968): una simetría rota por el campo de Higgs, que predijo los bosones W y Z y las corrientes neutras.</p></div>
<div class="persona"><b>Carlo Rubbia y Simon van der Meer</b><small>1934–2025 · 1925–2011 · CERN</small><p>Convirtieron el sincrotrón de protones del CERN en un colisionador protón–antiprotón y descubrieron W y Z (1983).</p></div>
</div>

<section>
<h2>Cómo apareció el zoo y cómo se ordenó</h2>
<ol class="chain">
<li><b class="y">1928-1932 <span>· La antimateria</span></b><p>Dirac (capítulo 29) descubrió que su ecuación del electrón tiene soluciones de energía negativa y las interpretó (1931) como partículas con carga opuesta. Anderson fotografió el positrón en 1932 en una cámara de niebla con un campo magnético y una placa de plomo: una traza con la curvatura del electrón, pero en sentido contrario.</p></li>
<li><b class="y">1930-1934 <span>· El neutrino</span></b><p>Pauli salvó la conservación de la energía en la desintegración beta con una partícula neutra, y Fermi la bautizó «neutrino» y construyó en 1934 la primera teoría de la interacción débil, con un artículo que <em>Nature</em> rechazó por «demasiado alejado de la realidad». El neutrino tarda un cuarto de siglo en detectarse: es esencialmente invisible (una sección eficaz de 10⁻⁴⁴ cm²).</p></li>
<li><b class="y">1935-1947 <span>· Yukawa y el pión</span></b><p>Yukawa razonó: el alcance de una fuerza es \(\hbar/mc\); un alcance de 1.4 fm implica un mediador de 140 MeV. En 1936 Anderson y Neddermeyer hallaron en los rayos cósmicos una partícula de 106 MeV y se creyó haber encontrado el mesón; pero casi no interaccionaba con los núcleos: era el muón. Rabi preguntó: «¿Quién ha pedido eso?». El auténtico pión (139.6 MeV) lo halló Powell en 1947. La emulsión mostró un pión que se detenía y se desintegraba en un muón.</p></li>
<li><b class="y">1947-1962 <span>· El zoo</span></b><p>Rochester y Butler (1947) hallaron partículas «extrañas», creadas rápidamente y desintegradas lentamente. En diez años se acumularon decenas de hadrones (Δ, Σ, Ξ, Λ, K, ρ…): «El descubridor de una nueva partícula debería recibir una multa», bromeó Fermi (o Lamb; hay varias versiones). La extrañeza (Gell-Mann y Nishijima, 1953) y el isospín ordenaron una parte.</p></li>
<li><b class="y">1956-1957 <span>· La paridad</span></b><p>Lee y Yang señalaron que la conservación de la paridad (la simetría especular) nunca se había probado en las interacciones débiles. Wu enfrió cobalto-60 a 0.01 K en un campo magnético y vio que los electrones salían preferentemente en una dirección: la naturaleza distingue la izquierda de la derecha. Pauli, que había apostado contra el resultado, escribió: «Me alegro de no haber apostado dinero».</p></li>
<li><b class="y">1961-1964 <span>· El óctuple camino y los quarks</span></b><p>Gell-Mann y Ne'eman ordenaron los hadrones en octetes y decupletes según una simetría SU(3). El decuplete tenía un hueco, y la fórmula predijo la masa del Ω⁻ (1680 MeV). Se encontró en Brookhaven en 1964 con 1672 MeV. Ese año, Gell-Mann y Zweig propusieron que los hadrones están formados por tres componentes (quarks) con cargas fraccionarias, que nadie había visto. Gell-Mann las consideró una herramienta matemática, no partículas reales; Zweig, que las llamó «ases», fue más literal y por ello su trabajo fue rechazado en el CERN.</p></li>
</ol>
<div class="sim" data-sim="yukawa-alcance" data-title="Yukawa: el alcance de una fuerza y la masa de su mediador"></div>
<div class="sim-guide"><ul>
<li>Con 140 MeV el alcance es 1.4 fm y la fuerza a 5 fm es unas 30 veces menor que la de Coulomb. Baje la masa a 1 o 10 MeV: el alcance crece. Para un fotón (m = 0) el alcance es infinito.</li>
</ul></div>
<div class="sim" data-sim="decuplete" data-title="El decuplete de Gell-Mann y la predicción del Ω⁻"></div>
<div class="sim-guide"><ul>
<li>Las tres masas conocidas (1232, 1385, 1530 MeV) están aproximadamente a la misma distancia: 150 MeV por unidad de extrañeza. Prolongando la recta se llega a 1680 MeV; la medida de 1964 fue 1672: un error del 0.5 %. Es una de las predicciones más celebradas de la física del siglo XX, comparable al descubrimiento de Neptuno (capítulo 16).</li>
</ul></div>
<div class="box epist"><h4>Predecir una partícula: el estilo de Mendeléyev</h4><p>Gell-Mann actuó como Mendeléyev (capítulo 17): una tabla con un hueco, una regularidad en las masas y una predicción con consecuencias. Es una forma de «ciencia de patrones» que Kuhn llamó ciencia normal (resolución de rompecabezas) y que, en este caso, tuvo un contenido empírico excedente fuerte (Lakatos). Pero la explicación profunda (los quarks) tardó años en ser aceptada. La realidad de los quarks fue un problema epistemológico: ¿cómo puede ser real algo que, por confinamiento, nunca se observará aislado? Los argumentos fueron indirectos: la dispersión inelástica de SLAC (1968) mostró «granos» puntuales dentro del protón, y Hacking diría que se creyó en ellos cuando se pudo «intervenir» (usarlos como haces).</p></div>
</section>

<section>
<h2>El Modelo Estándar</h2>
<ol class="chain">
<li><b class="y">1968-1973 <span>· Partones y libertad asintótica</span></b><p>En SLAC, Friedman, Kendall y Taylor dispersaron electrones sobre protones y vieron que algunos rebotaban con ángulos grandes, como en el experimento de Rutherford (capítulo 24): el protón tiene constituyentes puntuales. Feynman los llamó partones. Gross, Wilczek y Politzer demostraron en 1973 que las fuerzas fuertes (cromodinámica cuántica) se debilitan a distancias pequeñas, de modo que los quarks se comportan casi como libres dentro del protón, pero no pueden separarse.</p></li>
<li><b class="y">1967-1973 <span>· La teoría electrodébil</span></b><p>Glashow (1961), Weinberg (1967) y Salam (1968) unificaron electromagnetismo e interacción débil con una simetría rota por un campo escalar (mecanismo de Higgs, 1964). Predijo los bosones W y Z y una «corriente neutra». 't Hooft y Veltman mostraron en 1971-1972 que la teoría es calculable. En 1973 Gargamelle, en el CERN, observó las corrientes neutras.</p></li>
<li><b class="y">noviembre 1974 <span>· La revolución de noviembre</span></b><p>Dos grupos, Ting (Brookhaven) y Richter (SLAC), encontraron la misma resonancia estrecha de 3.1 GeV (J/ψ), un quark encanto con su antiquark, que predijo Glashow con Iliopoulos y Maiani (1970). Convenció a los escépticos de la realidad de los quarks. Ting la bautizó J y Richter ψ: la partícula conserva ambos.</p></li>
<li><b class="y">1983 <span>· Los bosones W y Z</span></b><p>Rubbia dirigió en el CERN el experimento UA1 y van der Meer inventó el enfriamiento estocástico que permitió acumular antiprotones. Se encontraron W (80 GeV) y Z (91 GeV) con las masas predichas. Nobel 1984, dos años después.</p></li>
<li><b class="y">1989-2000 <span>· LEP</span></b><p>El Gran Colisionador Electrón–Positrón, en el túnel de 27 km, produjo millones de Z. La anchura de la resonancia midió el número de neutrinos ligeros: tres.</p></li>
<li><b class="y">4 julio 2012 <span>· El bosón de Higgs</span></b><p>Los experimentos ATLAS y CMS del LHC anunciaron una partícula de 125 GeV con las propiedades del bosón de Higgs, con una búsqueda de casi cincuenta años. Englert y Higgs recibieron el Nobel de 2013.</p></li>
</ol>
<div class="sim" data-sim="resonancia-z" data-title="La resonancia del Z y el número de neutrinos"></div>
<div class="sim-guide"><ul>
<li>Con 3 familias el pico es de 41.5 nb y la anchura 2.495 GeV: es lo que midió LEP. Con 4 el pico baja a 36 nb y la resonancia se ensancha: los datos habrían sido muy distintos. Con 2, el pico sube. Un resultado negativo (no hay más neutrinos ligeros) sale de la forma de una curva.</li>
<li>La vida media del Z es \(\hbar/\Gamma=2.6\times10^{-25}\) s: la anchura mide la vida.</li>
</ul></div>
<div class="box leyenda"><h4>El Nobel que no recibió Chien-Shiung Wu</h4><p>El Nobel de 1957 fue para Lee y Yang. Wu, cuyo experimento mostró el efecto, no fue incluida. Pese a ello, el comité no reconoció nunca el hecho, y Wu recibió la Medalla Nacional de Ciencia, el premio Wolf (1978) y fue presidenta de la Sociedad Americana de Física. Es uno de los casos más citados del llamado <em>efecto Matilda</em> (Rossiter): a las mujeres científicas se les atribuye con menos frecuencia el mérito de sus descubrimientos. Lise Meitner (capítulo 30), Rosalind Franklin y Jocelyn Bell son otros ejemplos. Wu hizo, además, un segundo experimento (1949) sobre el entrelazamiento de los fotones de la aniquilación electrón–positrón, relevante para la desigualdad de Bell (capítulo 29).</p></div>
<div class="box epist"><h4>Una teoría que no se contradice con ningún dato y que nadie cree definitiva</h4><p>El Modelo Estándar reproduce con una precisión de 10⁻¹² el momento magnético del electrón y predijo W, Z, el quark top (1995) y el Higgs; ningún experimento de colisionador lo ha contradicho. Sin embargo, los físicos están convencidos de que es incompleto: no incluye la gravedad, ni la materia oscura, ni la masa de los neutrinos (observada en 1998 con oscilaciones). Es una situación nueva en la historia: una teoría exitosa sin anomalías que apunten a la siguiente. Es un caso opuesto al de Mercurio en 1900 (capítulo 27): ahora no hay un dato terco que indique el camino. Lakatos hablaría de un programa progresivo que parece haberse quedado sin predicciones nuevas; los defensores de la supersimetría y de las cuerdas lo ven como una pausa, y los críticos (Smolin, Woit), como una crisis de método.</p></div>
</section>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un mediador de 140 MeV, ¿qué alcance tiene? ¿Y uno de 80 GeV (el W)?
<details><summary>Respuesta</summary><p>\(R=197.3/140=1.41\) fm; para el W, \(197.3/80\,400=2.5\times10^{-3}\) fm: la fuerza débil es de alcance 1000 veces menor que el radio del protón.</p></details></li>
<li><span class="lvl">Básico</span>Un pión en reposo se desintegra en \(\mu^+\nu\). ¿Qué momento lleva el muón?
<details><summary>Respuesta</summary><p>\(p=(m_\pi^2-m_\mu^2)/(2m_\pi)=29.8\) MeV/c; energía cinética del muón: 4.1 MeV.</p></details></li>
<li><span class="lvl">Intermedio</span>Con las masas 1232, 1385 y 1530 MeV del decuplete, calcule el espaciado medio y la masa predicha del Ω⁻.
<details><summary>Respuesta</summary><p>\(\Delta=(1530-1232)/2=149\) MeV; \(M_{\Omega}=1530+149.5=1679.5\) MeV; medido: 1672.45 (0.4 %).</p></details></li>
<li><span class="lvl">Intermedio</span>La anchura del Z es 2.495 GeV. ¿Cuál es su vida media?
<details><summary>Respuesta</summary><p>\(\tau=\hbar/\Gamma=6.58\times10^{-25}\text{ GeV·s}/2.495\text{ GeV}=2.6\times10^{-25}\) s.</p></details></li>
<li><span class="lvl">Avanzado</span>Con \(\Gamma_Z=2495.2\), \(\Gamma_{\rm had}=1744.4\), \(\Gamma_{\ell\ell}=84.0\) MeV y \(\Gamma_{\nu\nu}=167.2\) MeV por familia, deduzca \(N_\nu\).
<details><summary>Respuesta</summary><p>\(\Gamma_{\rm inv}=2495.2-1744.4-3\times84.0=499\) MeV; \(N_\nu=499/167.2=2.98\).</p></details></li>
<li><span class="lvl">Avanzado</span>¿Cuándo se «cree» en una entidad inobservable como el quark? Discuta con Hacking y con el realismo de entidades.
<details><summary>Respuesta</summary><p>Para Hacking, en cuanto se la usa para intervenir en otra cosa (los quarks como componentes en la dispersión inelástica), igual que los electrones en los microscopios. Los quarks, además, son consistentes con muchos datos independientes (espectros, dispersión, desintegraciones, jets). El confinamiento impide verlos aislados, pero deja huellas indirectas: la creencia se basa en convergencia, no en observación directa.</p></details></li>
</ol>
