<p class="lead">En 1802, un hombre de 34 años recorría a pie y a lomo de mula las montañas entre Popayán y Quito con un termómetro de precisión, un barómetro de mercurio y una olla de latón. Cada vez que llegaba a una meseta, a una cima o a una ciudad, encendía una pequeña lámpara de alcohol, ponía a hervir agua y anotaba la temperatura. Francisco José de Caldas, nacido en Popayán, abogado de estudios y autodidacta de hecho, no tenía un instrumento barato para medir altura, de modo que improvisó el único que conocía por un libro: el agua hierve a menos temperatura cuanto más alto se está. Su ciencia se hacía con las manos, con lo que la tierra y el comercio le dejaban. Catorce años después, un consejo de guerra lo condenó a muerte. Tenía 48 años.</p>

<section>
<h2>Ciencia en una colonia</h2>
<div class="box contexto"><h4>El Nuevo Reino de Granada hacia 1780</h4><p>Nueva Granada era un virreinato de unos 1.5 millones de habitantes, con una pequeña élite criolla y un régimen colonial de monopolios. Dos instituciones eran la sede de la enseñanza: el Colegio Mayor del Rosario y el de San Bartolomé, de órdenes religiosas, con una enseñanza escolástica. En Popayán, la Universidad del Cauca (fundada en 1827, heredera del Colegio Seminario) vendría mucho después, y su departamento de física nace en el siglo XX. La reforma borbónica (Carlos III) impulsó un ilustrado «utilitarismo»: se financiaron expediciones botánicas y geodésicas (la Misión Geodésica Francesa en Quito, 1735-1743, con La Condamine, Bouguer y Godin, para medir un arco de meridiano en el ecuador; capítulo 14) para conocer, explotar y gobernar los recursos del imperio. La ciencia colonial era una ciencia útil, con rutas de intercambio entre sabios locales y europeos.</p></div>
<div class="people">
<div class="persona"><b>José Celestino Mutis</b><small>1732 – 1808 · Cádiz, Santafé</small><p>Médico, botánico y sacerdote, discípulo de Linneo por correspondencia. Llegó a Nueva Granada en 1760 con el virrey Messía de la Cerda y enseñó matemáticas y física en el Rosario desde 1762, con una cátedra de Newton, y defendió el sistema copernicano. Dirigió la Real Expedición Botánica (1783-1808), con unas 6000 láminas de plantas de dibujantes locales.</p></div>
<div class="persona"><b>Francisco José de Caldas</b><small>1768 – 1816 · Popayán, Santafé</small><p>«El Sabio». Autodidacta, comerciante en Popayán, aprendió astronomía con libros y mediciones propias. Midió alturas y latitudes, formuló una «geografía de las plantas» y dirigió el Observatorio (1805-1810). Murió fusilado por los realistas.</p></div>
<div class="persona"><b>Jorge Tadeo Lozano</b><small>1771 – 1816 · Santafé</small><p>Zoólogo de la Expedición y político independentista: presidente de Cundinamarca. Fusilado en octubre de 1816.</p></div>
<div class="persona"><b>Francisco Antonio Zea</b><small>1766 – 1822 · Medellín, Madrid</small><p>Botánico de la Expedición; director del Jardín Botánico de Madrid, vicepresidente de la Gran Colombia.</p></div>
<div class="persona"><b>Alexander von Humboldt y Aimé Bonpland</b><small>1769–1859 · 1773–1858</small><p>El prusiano y el francés viajaron de 1799 a 1804 por Venezuela, Colombia, Ecuador, Perú y México. En Ibarra, en 1802, conocieron a Caldas, quien quiso acompañarlos, pero no lo consiguió.</p></div>
<div class="persona"><b>Julio Garavito Armero</b><small>1865 – 1920 · Bogotá</small><p>Ingeniero civil por la Universidad Nacional, autodidacta en astronomía. Director del Observatorio Astronómico Nacional desde 1892 y profesor de matemáticas. Estudió la teoría de la Luna y la mecánica celeste. En 1970 la UAI bautizó un cráter lunar con su nombre.</p></div>
</div>

<section>
<h2>Mutis y la física newtoniana</h2>
<ol class="chain">
<li><b class="y">1762 <span>· Newton en las aulas</span></b><p>Mutis inauguró en el Colegio del Rosario un curso de matemáticas, con una lección de apertura que exponía la física de Newton y el sistema copernicano, hasta entonces vedados en las aulas por la tradición aristotélica (capítulo 4). Fue la primera cátedra de física moderna en lo que hoy es Colombia.</p></li>
<li><b class="y">1774 <span>· Copérnico y la Inquisición</span></b><p>En unas conclusiones públicas, un discípulo de Mutis sostuvo la validez del sistema copernicano. Un fraile dominico lo denunció ante el Santo Oficio de Cartagena. El virrey Guirior protegió a Mutis, que respondió con un tratado en el que distinguía entre «hipótesis» y «tesis», una distinción que Osiander había usado en 1543 (capítulo 9). No hubo proceso. El episodio muestra cómo el instrumentalismo servía a la prudencia política.</p></li>
<li><b class="y">1783-1808 <span>· La Expedición Botánica</span></b><p>Mutis consiguió que el rey financiara una expedición botánica. La sede, primero en Mariquita y luego en Santafé, tuvo un taller de dibujo con decenas de pintores (casi todos de Quito y Bogotá), que produjeron unas 6000 láminas, una de las colecciones más importantes del siglo XVIII. Era una ciencia de clasificación y descripción (Linneo), con aplicaciones médicas (la quina, el té de Bogotá) y económicas (canela, cera de palma).</p></li>
</ol>
<div class="box epist"><h4>La ciencia periférica y sus redes</h4><p>La historiografía reciente (Nieto Olarte, Safier, Pimentel) evita pensar la ciencia colonial como un reflejo débil de la europea. En los trópicos se creaba conocimiento con las poblaciones locales: guías indígenas, esclavos, pintores y colectores, cuya labor quedaba sin firma. Humboldt, que firmó la síntesis, debía a esas redes buena parte de sus datos. La pregunta de quién es el autor de un conocimiento local reaparece en el capítulo 35.</p></div>
</section>

<section>
<h2>Caldas: medir un país</h2>
<ol class="chain">
<li><b class="y">1795-1801 <span>· Aprendiz de astrónomo</span></b><p>Caldas, comerciante de Popayán, descubrió la astronomía con libros prestados y un cuadrante, y la usó para fijar la latitud de su ciudad (2°26′ N). Aprendió a observar eclipses y a calcular longitudes. Sus mediciones llamaron la atención de Mutis, que le ofreció un puesto en la Expedición.</p></li>
<li><b class="y">1802 <span>· El hipsómetro</span></b><p>Su método para medir alturas era más barato que un barómetro: hervir agua. Con un termómetro graduado de 0.1 °C (un «instrumento de precisión» comprado en Cartagena), medía la temperatura de ebullición, y de ella sacaba la presión y la altura. Con ese procedimiento midió, entre Popayán y Quito, las alturas de ciudades y volcanes, y propuso la «geografía de las plantas»: las especies se distribuyen en pisos térmicos según la altura, idea que Humboldt había formulado casi a la vez.</p></li>
<li><b class="y">1805-1810 <span>· El Observatorio y el Semanario</span></b><p>Mutis consiguió el edificio del Observatorio Astronómico, una torre de dos pisos de piedra y ladrillo construida entre 1802 y 1803 en los jardines de la Expedición. Caldas la dirigió desde 1805 y fundó en 1808 el <em>Semanario del Nuevo Reino de Granada</em>, la primera publicación científica del país, con artículos sobre el clima, la geografía, la medicina y la agricultura. En su memoria sobre «El influjo del clima sobre los seres organizados» (1808), argumentó contra el determinismo climático de Montesquieu y Buffon sobre los criollos.</p></li>
<li><b class="y">1810-1816 <span>· La ciencia y la guerra</span></b><p>Caldas se unió a la causa patriota (1810), dirigió el cuerpo de ingenieros militares de la Junta, fabricó cañones y fortificaciones y levantó mapas. Cuando el general Morillo reconquistó Nueva Granada (1816), Caldas fue apresado en la hacienda de un amigo, juzgado sumariamente y fusilado en Santafé a fines de octubre. Murieron con él Lozano y decenas de otros hombres de ciencia. Con ellos se perdió una generación: para algunos historiadores, la Reconquista retrasó la ciencia en Colombia medio siglo.</p></li>
</ol>

<div class="box leyenda"><h4>«España no necesita sabios»</h4><p>La frase, atribuida al general Morillo o a un funcionario del Consejo de Purificación para responder a las súplicas de clemencia por Caldas, está en todos los libros escolares colombianos. No se encuentra en el proceso, ni en las cartas de Morillo, ni en los testimonios de los coetáneos; aparece hacia 1850 en textos de la tradición patriótica. No es un invento absurdo (la política de la Reconquista fue de exterminio de las élites criollas, y Caldas era un conocido insurgente), pero es una frase de memoria, no de documento. Lo que sí consta es la ejecución y la ausencia de clemencia. Como en el capítulo 30, una frase formulada <em>a posteriori</em> condensa una verdad histórica en un dicho.</p></div>
<div class="box rivalidad"><h4>Caldas, Humboldt y el reconocimiento</h4><p>Cuando Humboldt y Bonpland llegaron a Ibarra (junio de 1802), Caldas, que acababa de medir altitudes, se acercó a conocerlos y pidió acompañarlos como ayudante. Humboldt lo recibió con interés pero le dijo que no tenía fondos; Caldas se quedó trabajando en Quito. En su obra <em>Voyage aux régions équinoxiales</em>, Humboldt citó a Caldas en varias ocasiones y reconoció su exactitud; pero sus relaciones con él fueron las de un maestro con un ayudante de lujo, y la huella de Caldas en la historia europea es mínima. Para Caldas, que se creía su igual y escribía con furia sobre «los extranjeros que nos recogen las flores», el desencuentro fue decisivo.</p></div>
</section>

<section>
<h2>Garavito y la ciencia después de la independencia</h2>
<ol class="chain">
<li><b class="y">1819-1892 <span>· Un siglo difícil</span></b><p>Las guerras civiles del siglo XIX, la inestabilidad política y la falta de presupuesto dejaron la ciencia al borde de la extinción: el Observatorio fue abandonado y casi se desmoronó; la Expedición Botánica, desmembrada (buena parte de sus láminas y herbarios fue a Madrid, donde aún se conserva). La Comisión Corográfica (1850-1859), de Agustín Codazzi, mapeó el país con apoyo del Estado, con dibujantes (Henry Price, Carmelo Fernández) y naturalistas. Se fundó la Universidad Nacional (1867), con facultades de matemáticas e ingeniería.</p></li>
<li><b class="y">1892-1920 <span>· Garavito</span></b><p>Julio Garavito, hijo de un militar, ingeniero de la Nacional, se hizo cargo del Observatorio, que reconstruyó con instrumentos de la poca capacidad del Estado. Hizo cálculos de la órbita lunar, de eclipses y de mecánica celeste, estudió la forma de la Tierra y la hora legal del país, y enseñó matemáticas y astronomía en la Escuela de Ingenieros. Su trabajo sobre la teoría de la Luna le dio un lugar entre los astrónomos de su tiempo. Murió a los 54 años, soltero y con poco dinero; su retrato aparece en el billete de 20 000 pesos.</p></li>
<li><b class="y">1920-1970 <span>· La física institucional</span></b><p>La física como profesión comenzó en los años 1930-1960, con las universidades Nacional, de Antioquia, del Valle y de los Andes, y los primeros posgrados. En la Universidad del Cauca, la física aparece con la Facultad de Ciencias Naturales y los departamentos de los años 60, con maestros formados en el exterior. En 1936 se fundó la Academia Colombiana de Ciencias Exactas, Físicas y Naturales, que dio forma institucional a una comunidad todavía pequeña.</p></li>
</ol>
<div class="box epist"><h4>¿Cuándo hay una ciencia nacional?</h4><p>Basalla (1967) propuso tres fases para la ciencia en los países no europeos: (1) la naturaleza se estudia con intereses europeos (las expediciones); (2) una ciencia colonial en que los locales cooperan con los centros de decisión extranjeros; (3) una ciencia nacional independiente. Su modelo ha sido muy criticado (Arnold, Kumar, Saldaña) por ser difusionista, pero sirve para plantear una pregunta: ¿qué instituciones, qué tradiciones de enseñanza y qué dinero hacen falta para que una comunidad científica sea capaz de plantear sus propios problemas? En Colombia, la historia de la ciencia está llena de generaciones perdidas (1816, las guerras civiles, la violencia de 1948-1965) y de rutas de formación en el exterior.</p></div>
</section>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿A qué temperatura hierve el agua en Popayán (1738 m) y en Bogotá (2640 m)? Suponga atmósfera estándar.
<details><summary>Respuesta</summary><p>Presiones: 82.1 y 73.4 kPa. Con la ecuación de Antoine: 94.2 °C y 91.3 °C.</p></details></li>
<li><span class="lvl">Básico</span>Caldas mide que el agua hierve a 88.0 °C en un páramo. ¿Qué altura tiene?
<details><summary>Respuesta</summary><p>\(p_v(88\,^\circ\text{C})=64.9\) kPa; \(h=[1-(0.640)^{1/5.256}]/2.256\times10^{-5}=3.53\) km.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Con qué incertidumbre se mide la altura si el termómetro se lee con ±0.1 °C?
<details><summary>Respuesta</summary><p>Hay unos 3.3 °C por cada kilómetro: \(0.1\) °C ↔ 30 m.</p></details></li>
<li><span class="lvl">Intermedio</span>Si el Sol pasa por el cenit de Popayán el 28 de marzo, ¿cuál es su declinación ese día? ¿Qué altura tiene el 21 de junio?
<details><summary>Respuesta</summary><p>\(\delta=2.44^\circ\) N (latitud de Popayán). El 21 de junio, \(\delta=23.44^\circ\): \(h=90-(23.44-2.44)=69^\circ\), al norte.</p></details></li>
<li><span class="lvl">Avanzado</span>La Misión Geodésica Francesa (1735-1743) midió un grado de meridiano en el ecuador y mostró que la Tierra es achatada (capítulo 14). ¿Qué papel tuvieron los criollos, como Jorge Juan, Antonio de Ulloa y Pedro Vicente Maldonado?
<details><summary>Respuesta</summary><p>Participaron españoles (Juan y Ulloa) con los franceses y un criollo, Maldonado, cartógrafo y geodesta de Quito. El proyecto dependía de redes locales (guías, mulas, agrimensores, financiación). Dejaron memoria en la ciencia local: Caldas conoció los resultados y la obra de La Condamine.</p></details></li>
<li><span class="lvl">Avanzado</span>¿Qué es una «ciencia periférica»? ¿Qué hace que una ciencia producida en la colonia tenga un valor epistemológico propio y no solo derivado?
<details><summary>Respuesta</summary><p>Una ciencia hecha lejos de los centros de decisión y con los instrumentos y las preguntas que uno mismo plantea. Tiene valor propio porque el conocimiento local (de especies, climas, usos) no existe en otra parte, porque las redes de datos solo funcionan con los locales (Latour: «centros de cálculo») y porque la formación de comunidades locales permite problemas que no son prioritarios en el centro.</p></details></li>
</ol>
