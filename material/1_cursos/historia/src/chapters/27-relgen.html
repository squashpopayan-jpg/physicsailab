<p class="lead">En 1907, sentado en su silla de la oficina de patentes de Berna, Einstein pensó: si una persona cae libremente desde un tejado, no siente su propio peso. «Fue la idea más feliz de mi vida.» Si en una caída no se siente la gravedad, la gravedad y la aceleración son equivalentes, y entonces la relatividad especial, que solo vale para sistemas sin aceleración, debía ampliarse. Ese pensamiento lo llevó ocho años: a la geometría de Riemann, a una colaboración con su amigo Grossmann, a un error de dos años que casi lo apartó del camino, y a las cuatro semanas de noviembre de 1915 en que, trabajando contra el reloj porque David Hilbert, en Gotinga, estaba a punto de llegar a lo mismo, presentó cuatro comunicaciones a la Academia de Prusia, una por semana, cada una corrigiendo la anterior.</p>

<div><b>Época</b>1907 – 2015</div>

<div><b>Idea</b>la gravedad es la curvatura del espacio-tiempo</div>

<section>
<h2>Un camino de ocho años</h2>
<div class="box contexto"><h4>Una teoría sin experimentos que la reclamaran</h4><p>A diferencia de la relatividad especial, que respondía a un problema de la electrodinámica, la general no tenía una anomalía experimental clamorosa: solo el avance de Mercurio, que se atribuía a Vulcano o a la forma del Sol. Era una teoría construida por razones estéticas y de principio (la igualdad de masa inercial y gravitatoria, comprobada por Eötvös a 1 parte en 10⁹; el principio de Mach de que la inercia depende de la materia lejana), y es uno de los pocos casos de teoría física que se adelantó décadas a los datos. En los años de guerra, Einstein estaba en Berlín (profesor en la Academia desde 1914, sin obligación de enseñar) y vivía solo, separado de Mileva y sus hijos, que se habían ido a Zúrich.</p></div>
<div class="people">
<div class="persona"><b>Marcel Grossmann</b><small>1878 – 1936 · Zúrich</small><p>Matemático, amigo de estudios de Einstein, del que había tomado apuntes en clase. Le enseñó el cálculo tensorial de Ricci y Levi-Civita («Debes ayudarme o me volveré loco»). Es coautor del <em>Entwurf</em> (1913).</p></div>
<div class="persona"><b>David Hilbert</b><small>1862 – 1943 · Gotinga</small><p>El matemático más influyente del siglo. Einstein lo visitó en Gotinga en el verano de 1915 y le expuso su teoría; Hilbert, entusiasmado, se puso a buscar la formulación variacional.</p></div>
<div class="persona"><b>Karl Schwarzschild</b><small>1873 – 1916 · Potsdam</small><p>Director del Observatorio de Potsdam, se alistó como voluntario con 41 años. En el frente ruso calculó, en dos cartas a Einstein, la solución exacta para una masa esférica. Murió de pénfigo a los 42 años.</p></div>
<div class="persona"><b>Arthur Eddington</b><small>1882 – 1944 · Cambridge</small><p>Astrónomo cuáquero y objetor de conciencia. Fue el primer inglés en entender la teoría de Einstein y el organizador de la expedición de 1919.</p></div>
<div class="persona"><b>Frank Dyson</b><small>1868 – 1939 · Greenwich</small><p>Astrónomo real; consiguió fondos del gobierno británico en plena guerra para dos expediciones.</p></div>
<div class="persona"><b>Tullio Levi-Civita</b><small>1873 – 1941 · Padua, Roma</small><p>Corrigió a Einstein varios errores sobre el cálculo tensorial. Perseguido por las leyes raciales de 1938.</p></div>
</div>
</section>

<section>
<h2>Cómo se construyeron las ecuaciones</h2>
<ol class="chain">
<li><b class="y">1907 <span>· El principio de equivalencia</span></b><p>Un observador en caída libre no nota la gravedad; un observador acelerado en un cohete sin gravedad nota una «gravedad». Einstein dedujo tres consecuencias que se podían medir: la luz se curva en un campo gravitatorio, el tiempo corre más lento en un campo más fuerte (corrimiento al rojo) y las masas pesada e inerte son idénticas.</p></li>
<li><b class="y">1911 <span>· Primera predicción</span></b><p>Con el principio de equivalencia solamente, Einstein calculó una desviación de la luz de 0.83″ para un rayo rasante al Sol, el mismo valor que había calculado Soldner con la teoría corpuscular en 1801. Pidió a astrónomos que lo comprobaran en un eclipse. La expedición alemana de Freundlich a Crimea (agosto de 1914) fue interrumpida por la guerra y sus miembros, capturados por los rusos. Si el eclipse se hubiera medido, habría refutado el valor de 1911.</p></li>
<li><b class="y">1912-1914 <span>· Geometría y el error del «Entwurf»</span></b><p>Con Grossmann, Einstein vio que la gravedad debe describirse con un tensor métrico \(g_{\mu\nu}\) de 10 componentes. En el <em>Entwurf</em> (1913) propuso unas ecuaciones no covariantes generalmente; para justificarlas formuló el «argumento del agujero» (<em>Lochbetrachtung</em>), un razonamiento erróneo que le hizo abandonar la covariancia general durante dos años.</p></li>
<li><b class="y">noviembre 1915 <span>· Cuatro semanas</span></b><p>El 4, 11, 18 y 25 de noviembre, Einstein presentó cuatro versiones. El 18 mostró que la teoría daba 43″ para Mercurio, y que la desviación de la luz era el doble: 1.75″. El 25 presentó las ecuaciones definitivas \(G_{\mu\nu}=8\pi G\,T_{\mu\nu}/c^4\). El 20 de noviembre Hilbert había presentado una versión con la acción variacional.</p></li>
<li><b class="y">1916 <span>· Schwarzschild</span></b><p>Schwarzschild halló desde el frente la solución exacta de las ecuaciones de campo en el vacío alrededor de una masa esférica, con una singularidad en \(r=2GM/c^2\). Einstein la presentó a la Academia en su nombre. Durante decenios se creyó que esa superficie era una peculiaridad matemática (cap. 33).</p></li>
</ol>
<div class="eq key" data-name="Ecuaciones de campo y avance del perihelio">\[G_{\mu\nu}=\frac{8\pi G}{c^4}T_{\mu\nu};\qquad \Delta\varphi=\frac{6\pi GM}{c^2a(1-e^2)};\qquad \delta=\frac{4GM}{c^2b}.\]</div>
<div class="sim" data-sim="roseton-precesion" data-title="Una órbita relativista: el rosetón"></div>
<div class="sim-guide"><ul>
<li>La órbita se integra con la ecuación \(w''+w=1+3\varepsilon w^2\): la corrección \(3\varepsilon w^2\) es el término que añade la relatividad general respecto de Newton, que da una elipse cerrada. El avance por órbita medido coincide con \(6\pi\varepsilon\) al 3 %.</li>
<li>Para Mercurio \(\varepsilon\approx2.7\times10^{-8}\): 0.1″ por órbita, 43″ por siglo.</li>
</ul></div>
<div class="box rivalidad"><h4>Einstein y Hilbert: cinco días</h4><p>La disputa de prioridad ha sido una de las más discutidas. Hilbert presentó el 20 de noviembre un trabajo con las ecuaciones de campo derivadas de un principio variacional; Einstein presentó las suyas el 25. Un hallazgo de 1997 (Corry, Renn y Stachel) de las pruebas de imprenta de Hilbert, con la fecha del 6 de diciembre, mostró que su primera versión no contenía las ecuaciones actuales y que las añadió después de ver las de Einstein. Hilbert, honesto y generoso, escribió que la teoría era de Einstein, y que a él correspondía la formulación matemática. Einstein, que se sintió traicionado por un momento (escribió a Besso y a Zangger), hizo las paces en diciembre. La disputa es un caso de <em>descubrimiento simultáneo</em> de dos científicos que se leían y estaban en contacto, y por eso es más difícil de resolver que otros.</p></div>
<div class="box epist"><h4>Una teoría que se adelanta a los datos</h4><p>La relatividad general ejemplifica un camino de «arriba abajo»: principios generales (equivalencia, covariancia) y exigencias matemáticas guían la construcción antes de que haya datos. Einstein no resolvió la anomalía de Mercurio: la comprobó. En términos de Lakatos, es un programa con un «contenido empírico excedente» (<em>excess content</em>) enorme, y en términos de Popper una teoría con predicciones arriesgadas y precisas. Lo notable es que Einstein dijo que, si la desviación de la luz hubiera salido de 0.87″, «mala suerte para el buen Dios: la teoría es correcta». La frase, probablemente apócrifa o ilustrativa (la contó a Ilse Rosenthal-Schneider), expresa una actitud hacia la belleza de una teoría que es más que un criterio popperiano.</p></div>
</section>

<section>
<h2>El eclipse de 1919</h2>
<ol class="chain">
<li><b class="y">1917-1919 <span>· La expedición en tiempo de guerra</span></b><p>Dyson, Astrónomo Real, vio que el eclipse total del 29 de mayo de 1919 ocurría con el Sol frente al cúmulo de las Híades, muchas estrellas brillantes en la línea de visión: la ocasión ideal. Obtuvo 1000 libras del Gobierno en plena guerra. Eddington, que habría sido reclutado en 1918, fue exceptuado del servicio militar porque su labor era necesaria a la expedición (era objetor de conciencia cuáquero).</p></li>
<li><b class="y">29 mayo 1919 <span>· Príncipe y Sobral</span></b><p>Eddington y Cottingham observaron en la isla de Príncipe con las nubes cubriendo el cielo hasta minutos antes de la totalidad: solo obtuvieron unas pocas placas con pocas estrellas. Crommelin y Davidson, en Sobral (Brasil), tuvieron cielo despejado y dos telescopios. Las placas se compararon con otras de las mismas estrellas sin Sol, tomadas en Oxford en enero.</p></li>
<li><b class="y">6 noviembre 1919 <span>· Londres</span></b><p>En una sesión conjunta de la Royal Society y la Royal Astronomical Society, Dyson anunció que las medidas «concuerdan con la predicción de Einstein». Joseph J. Thomson, presidente, dijo que era «uno de los mayores logros de la historia del pensamiento humano». <em>The Times</em> publicó al día siguiente «Revolución en la ciencia / Nueva teoría del Universo / Las ideas newtonianas, derrocadas». Einstein se hizo famoso en el mundo.</p></li>
</ol>
<div class="sim" data-sim="eclipse-1919" data-title="Las placas del eclipse de 1919"></div>
<div class="sim-guide"><ul>
<li>Con las dos series aceptadas, la media ponderada es 1.93″ ± 0.11 (muy cercana a 1.75″, y lejos de 0.87″). Active el astrográfico de Sobral que Eddington descartó: la media baja a 1.87″ y no cambia la conclusión. Compare los χ².</li>
</ul></div>
<div class="box leyenda"><h4>¿Eddington manipuló los datos?</h4><p>Earman y Glymour (1980) acusaron a Eddington de haber descartado las placas del astrográfico de Sobral porque contradecían a Einstein y de haber presentado sus datos de Príncipe como más fiables de lo que eran. Desde entonces el episodio apareció en libros de sociología de la ciencia como ejemplo de que la evidencia está cargada de teoría (Collins y Pinch). Kennefick (2009) volvió a las placas con la documentación original: el espejo del astrográfico se deformó con el calor, desenfocó las imágenes, y los astrónomos de Greenwich ya habían decidido ese criterio <em>antes</em> de conocer el resultado. Un reanálisis de 1979 con instrumentos modernos (Harvey) dio la razón a Eddington: las placas descartadas tienen un error sistemático por la escala del espejo. Las placas mal descartadas habrían dado una media similar. La historia correcta es que la evidencia de 1919 era buena para refutar el valor newtoniano, pero no para <em>medir</em> con precisión el valor de Einstein: eso vino con radiointerferometría en los años 1970 (con 1 %).</p></div>
</section>

<section>
<h2>Las demás pruebas</h2>
<ol class="chain">
<li><b class="y">1959 <span>· Pound y Rebka</span></b><p>En la torre de la Jefferson Physical Laboratory de Harvard, de 22.5 m, midieron con el efecto Mössbauer el corrimiento de la radiación gamma del hierro-57 entre el suelo y el techo: \(gh/c^2=2.46\times10^{-15}\). Pound y Snider lo repitieron en 1965 con un 1 % de error.</p></li>
<li><b class="y">1971 <span>· Hafele y Keating</span></b><p>Comparar relojes atómicos de cesio en vuelos comerciales alrededor de la Tierra mostró diferencias de decenas de nanosegundos, de acuerdo con la relatividad especial y general (con barras de error del 10 %). Se financió con 8000 dólares y se compraron dos asientos «para el señor Cesio».</p></li>
<li><b class="y">1978 <span>· GPS</span></b><p>El sistema de posicionamiento global está diseñado con la corrección relativista incorporada: sin ella, el error de posición sería de 11 km por día.</p></li>
<li><b class="y">2015 <span>· LIGO</span></b><p>El 14 de septiembre de 2015, dos interferómetros de 4 km (Livingston y Hanford) detectaron una señal de 0.2 s, con frecuencia entre 35 y 250 Hz, producida por la fusión de dos agujeros negros de 36 y 29 masas solares a 1300 millones de años luz. La deformación relativa fue de 10⁻²¹. Rainer Weiss, Kip Thorne y Barry Barish recibieron el Nobel de 2017.</p></li>
</ol>
<div class="sim" data-sim="reloj-gps" data-title="Los relojes de los satélites GPS"></div>
<div class="sim-guide"><ul>
<li>En 20 200 km (órbita GPS), la corrección total es +38.5 µs por día. Observe que los dos efectos tienen signo opuesto: a unos 3000 km sobre el suelo el neto es cero. Los relojes de los satélites se ajustan en la fábrica para ir 38 µs/día más despacio en el suelo.</li>
</ul></div>
<div class="sim" data-sim="chirrido-gw" data-title="El chirrido de las ondas gravitacionales"></div>
<div class="sim-guide"><ul>
<li>Con 36 y 29 masas solares la frecuencia 0.2 s antes de la fusión es de 35 Hz y sube hasta 250 Hz: la señal de GW150914. Con masas mayores el chirrido es más rápido y de frecuencia más baja.</li>
</ul></div>
<div class="box epist"><h4>Cien años para ver una onda</h4><p>La existencia misma de las ondas gravitacionales fue discutida por Einstein (1916-1936: dos veces dijo que existían, una que no, y un manuscrito de 1936 con Rosen que rechazó la revista <em>Physical Review</em> y que Einstein retiró molesto con el referee), por Eddington («las ondas se propagan a la velocidad del pensamiento»), y la cuestión no se resolvió hasta el congreso de Chapel Hill (1957) con el argumento de las perlas de Bondi y Feynman. Weber, en los años 1960, afirmó haberlas detectado con barras resonantes; nadie pudo reproducirlo. La polémica de Weber, estudiada por Collins, muestra cómo se disuelve una reivindicación en la <em>regresión del experimentador</em>: para saber si el detector funciona hay que saber si detecta ondas, y para saber si hay ondas hay que tener un detector fiable. LIGO la rompió con coincidencias entre dos detectores, inyecciones de señal y un análisis ciego.</p></div>
</section>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule el radio de Schwarzschild del Sol (\(1.99\times10^{30}\) kg) y de la Tierra (\(5.97\times10^{24}\) kg).
<details><summary>Respuesta</summary><p>\(r_s=2GM/c^2\): 2.95 km y 8.87 mm.</p></details></li>
<li><span class="lvl">Básico</span>¿Qué fracción de diferencia de frecuencia se espera para la luz que sube 22.5 m?
<details><summary>Respuesta</summary><p>\(gh/c^2=9.8\times22.5/(9\times10^{16})=2.46\times10^{-15}\): el experimento de Pound y Rebka.</p></details></li>
<li><span class="lvl">Intermedio</span>Con \(GM_\odot=1.327\times10^{20}\) m³/s² y \(b=R_\odot=6.957\times10^8\) m, calcule la desviación de la luz según Einstein y según Newton.
<details><summary>Respuesta</summary><p>Einstein: \(4GM/(c^2b)=8.49\times10^{-6}\) rad = 1.75″; Newton: 0.875″.</p></details></li>
<li><span class="lvl">Intermedio</span>El perihelio de Mercurio avanza \(6\pi GM/(c^2a(1-e^2))\) por órbita con \(a=5.79\times10^{10}\) m y \(e=0.2056\). ¿Cuánto es por siglo (87.97 días por órbita)?
<details><summary>Respuesta</summary><p>0.103″ por órbita × 415.2 órbitas/siglo = 42.98″.</p></details></li>
<li><span class="lvl">Avanzado</span>Muestre que un reloj en un satélite a \(r\) de la Tierra va más rápido por gravedad en \(\tfrac{GM}{c^2}(1/R-1/r)\) y más lento por velocidad en \(\tfrac{GM}{2c^2r}\); calcule el neto a 26 571 km.
<details><summary>Respuesta</summary><p>+45.7 µs/día − 7.2 µs/día = +38.5 µs/día.</p></details></li>
<li><span class="lvl">Avanzado</span>La acusación contra Eddington (descartar placas) ¿es un ejemplo de sesgo de confirmación? ¿Qué reglas de análisis lo evitarían?
<details><summary>Respuesta</summary><p>Habría sesgo si el criterio se hubiera decidido mirando el resultado; Kennefick muestra que el criterio (calidad de las placas) era anterior. La buena práctica es el análisis ciego, fijar el criterio de exclusión antes de los datos y publicar todo. El caso se estudia hoy porque los controles de LIGO se diseñaron para evitar este tipo de acusación.</p></details></li>
</ol>
