<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel del docente</title>
<link rel="stylesheet" href="estilos.css">
<style>
  main { padding: 22px 0 40px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 14px 0 18px; overflow-x: auto; }
  .tabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 10px 14px; white-space: nowrap; }
  .tabs button.on { border-bottom-color: var(--acc); font-weight: 700; color: var(--acc); }
  .sess { cursor: pointer; }
  .sess:hover { border-color: var(--acc); }
  .bigtimer { font-size: 2.4rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .log { max-height: 260px; overflow: auto; font-size: .85rem; }
  .log div { padding: 4px 0; border-bottom: 1px solid var(--line); }
  .heat { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 4px; }
  .heat div { border-radius: 6px; text-align: center; font-size: .72rem; padding: 4px 0; background: color-mix(in srgb, var(--acc) calc(var(--p) * 1%), var(--soft)); }
  .mini { width: 90px; display: inline-block; vertical-align: middle; }
  .mini .bar { display: block; }
  .codigo { font-family: Consolas, "Courier New", monospace; letter-spacing: .06em; }
  tr.alerta td { background: var(--warn-soft); }
  tr.caido td { background: var(--bad-soft); }
  .qprev { border-top: 1px solid var(--line); padding: 14px 0; break-inside: avoid; }
  .slips { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .slip { border: 1px dashed var(--muted); border-radius: 8px; padding: 10px; break-inside: avoid; }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#/"><span class="logo">∑</span><span>Panel del docente</span></a>
  <span class="spacer"></span>
  <a href="#/bancos" class="btn ghost sm">Bancos de pruebas</a>
  <span id="usuario" class="small muted"></span>
  <button id="btn-salir" class="sm ghost hidden">Salir</button>
</div></header>
<main class="wrap" id="app"><p class="muted">Cargando…</p></main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="analisis.js"></script>
<script src="informe.js"></script>
<script src="panel.js"></script>
</body>
</html>
