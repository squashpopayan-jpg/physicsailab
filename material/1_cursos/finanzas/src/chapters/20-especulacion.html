<p class="lead">Las redes sociales están llenas de personas que muestran ganancias de trading: divisas, oro, índices, criptomonedas, con gráficas, señales y cursos. Este capítulo no pretende prohibir nada, sino poner los números sobre la mesa como lo haría un profesional. Primero, qué dice la evidencia sobre los resultados de los operadores minoristas. Después, por qué la frecuencia, los costos y el apalancamiento cambian por completo la estadística. Al final, cómo gana dinero quien vende cursos y señales, y qué reglas mínimas debería seguir quien decida especular.</p>

<section>
<h2>Invertir, especular y apostar</h2>
<p>Benjamin Graham, el maestro de Warren Buffett, escribió en 1934 que una operación de inversión es la que, tras un análisis cuidadoso, promete seguridad del capital y una rentabilidad adecuada; lo que no cumple eso es especulación. Para este curso conviene una distinción más operativa:</p>
<ul>
<li><b>Invertir</b>: poseer activos que generan valor (empresas que producen utilidades, bonos que pagan intereses, inmuebles que dan arriendo). La expectativa es positiva para todos los participantes a la vez, porque la economía crea riqueza.</li>
<li><b>Especular</b>: apostar a cambios de precio en plazos cortos. Frente al mercado, es un juego de suma cero antes de costos: lo que un operador gana por encima del mercado, otro lo pierde. Después de costos, la suma es negativa.</li>
<li><b>Apostar</b>: participar en un juego con expectativa negativa por diseño (loterías, casinos, apuestas deportivas). La casa siempre gana en promedio.</li>
</ul>
</section>

<section>
<h2>Lo que dice la evidencia</h2>
<div class="box evid"><p><b>Estados Unidos.</b> Barber y Odean (2000) estudiaron 66.465 hogares con cuentas de corretaje entre 1991 y 1996. El 20 % que más operaba obtuvo una rentabilidad neta de 11,4 % anual, frente a 17,9 % del mercado. Su título lo resume: «operar es peligroso para su riqueza».</p>
<p><b>Taiwán.</b> Barber, Lee, Liu y Odean (2014) analizaron todos los operadores intradía de la bolsa de Taiwán durante 15 años. Menos de 1 % logró ganancias predecibles después de costos.</p>
<p><b>Brasil.</b> Chague, De-Losso y Giovannetti (2019) siguieron a todas las personas que empezaron a operar intradía en futuros del índice brasileño entre 2013 y 2015. De las que persistieron más de 300 días, 97 % perdió dinero. Solo 1,1 % ganó más que el salario mínimo.</p>
<p><b>Europa.</b> Desde 2018 la autoridad europea de valores (ESMA) obliga a los brókeres de CFD a publicar qué porcentaje de cuentas minoristas pierde dinero. Los avisos suelen mostrar cifras entre 70 % y 90 %.</p></div>
<p>La explicación no es que los minoristas sean tontos. En el corto plazo, los precios de los mercados líquidos se parecen mucho a un camino aleatorio, los costos se pagan en cada operación y del otro lado hay profesionales con más información, mejor tecnología y menores costos.</p>
</section>

<section>
<h2>Expectativa, costos y frecuencia</h2>
<p>Si cada operación arriesga una unidad \(R\) (la distancia al stop), gana \(b\) unidades con probabilidad \(p\) y paga un costo \(c\) (spread y comisiones), la <span class="term">expectativa</span> por operación es:</p>
<div class="eq key" data-name="Expectativa por operación">\[E=p\,b-(1-p)-c\qquad\text{(en unidades de riesgo }R\text{)} .\]</div>
<p>Con \(p=50\,\%\) y \(b=1\), la expectativa es exactamente \(-c\): todo lo que se paga en costos se pierde. Además, aun con expectativa cero, la mayoría de las cuentas termina perdiendo por el arrastre de la volatilidad del capítulo 16: unas pocas ganan mucho y la mayoría pierde algo.</p>
<div class="sim" data-sim="trader" data-title="Dos mil cuentas de trading durante dos años"></div>
<div class="sim-guide"><ul>
<li>Cada cuenta hace 200 operaciones al año arriesgando 2 % del capital en cada una, con 50 % de aciertos y beneficio igual al riesgo. Sin costos, 61 % de las cuentas termina perdiendo, aunque la expectativa sea cero.</li>
<li>Con un costo de 0,08 R por operación (un spread modesto), pierde 96 % de las cuentas y la mediana termina con la mitad del capital.</li>
<li>Suba la frecuencia a 1.000 operaciones al año: los costos se multiplican. Para que una estrategia sobreviva a los costos necesita una ventaja real, medida con cientos de operaciones e intervalos de confianza, no con un buen mes.</li>
</ul></div>
</section>

<section>
<h2>Apalancamiento: ganar más rápido, perder más rápido</h2>
<p>Los CFD, el forex y las cuentas de margen permiten controlar una posición mucho mayor que el dinero depositado. Con apalancamiento \(x\), un movimiento de 1 % en el precio es un \(x\,\%\) en el capital. Si las pérdidas llevan el capital por debajo del margen de mantenimiento, el bróker cierra la posición: la pérdida queda realizada aunque el precio se recupere al día siguiente.</p>
<div class="sim" data-sim="apalancamiento" data-title="Probabilidad de liquidación según el apalancamiento"></div>
<div class="sim-guide"><ul>
<li>Subyacente con 16 % de volatilidad anual y 5 % de tendencia (parecido a un índice de acciones o al oro en años normales). Sin apalancamiento, nadie es liquidado en un año.</li>
<li>Con 5 veces, más de la mitad de las cuentas pierde la mitad del capital y es liquidada en un año. Con 30 veces, casi nueve de cada diez, aunque el activo suba en promedio.</li>
<li>Cambie la volatilidad a 70 % (criptomonedas): incluso 2 o 3 veces de apalancamiento producen liquidaciones masivas.</li>
</ul></div>
<div class="box co"><p>En Colombia, los brókeres extranjeros de CFD y forex que ofrecen sus servicios por internet no están vigilados por la Superintendencia Financiera. En caso de conflicto, la protección del cliente depende de las reglas del país donde están registrados, que pueden ser muy laxas. La Superintendencia publica alertas sobre entidades no autorizadas para captar recursos en el país.</p></div>
</section>

<section>
<h2>El criterio de Kelly</h2>
<p>John Kelly, un físico de los laboratorios Bell, resolvió en 1956 qué fracción del capital apostar en un juego favorable repetido para maximizar el crecimiento a largo plazo. Si se gana \(b\) por cada unidad apostada con probabilidad \(p\), el crecimiento logarítmico esperado por apuesta y la fracción óptima son:</p>
<div class="eq key" data-name="Criterio de Kelly">\[G(f)=p\ln(1+bf)+(1-p)\ln(1-f),\qquad f^{*}=p-\frac{1-p}{b} .\]</div>
<p>Dos lecciones importan para cualquier especulador. Primera: si la expectativa no es positiva, \(f^*\le0\) y la única fracción racional es cero. Segunda: apostar más que \(f^*\) reduce el crecimiento, y apostar el doble lo lleva a cero o a negativo, aun con ventaja. El exceso de riesgo destruye una estrategia ganadora.</p>
<div class="sim" data-sim="kelly" data-title="Crecimiento a largo plazo según la fracción arriesgada"></div>
<div class="sim-guide"><ul>
<li>Con 55 % de aciertos y pago de 1,5 a 1, Kelly recomienda 25 % por apuesta. Con 50 %, el crecimiento se vuelve negativo.</li>
<li>Los profesionales usan fracciones menores, como «medio Kelly»: sacrifican poco crecimiento a cambio de mucha menos volatilidad, y protegen el error de haber sobreestimado su ventaja.</li>
<li>Ponga 50 % de aciertos con pago 1 a 1: \(f^*=0\). Sin ventaja, el tamaño óptimo de apuesta es no apostar.</li>
</ul></div>
</section>

<section>
<h2>El negocio de enseñar a especular</h2>
<p>Si alguien tuviera un método que ganara de forma confiable, lo más rentable sería aplicarlo con su propio capital, en silencio. Entonces, ¿por qué hay tantos cursos y grupos de señales? Porque el negocio está en otra parte:</p>
<ul>
<li><b>Suscripciones y cursos</b>: ingresos seguros, independientes de que los alumnos ganen.</li>
<li><b>Comisiones de afiliado</b>: muchos brókeres pagan a quien les refiere clientes según el volumen que estos operan. El que enseña gana cuando el alumno opera mucho, gane o pierda.</li>
<li><b>Sesgo de supervivencia</b>: se muestran las capturas de las operaciones ganadoras y los alumnos que ganaron. Los demás no publican nada.</li>
<li><b>Resultados sin auditar</b>: capturas de cuentas demo o de periodos elegidos a dedo.</li>
</ul>
<div class="box myth">
<p class="m"><b>Mito</b>«Con disciplina y el curso correcto, cualquiera puede vivir del trading».</p>
<p class="r"><b>Realidad</b>En el estudio de Brasil, de los que persistieron más de 300 días, 97 % perdió dinero y apenas 1,1 % ganó más que un salario mínimo. La disciplina es necesaria pero no suficiente: sin una ventaja estadística real y medida, más disciplina solo significa perder de forma más ordenada.</p>
</div>
</section>

<section>
<h2>Si de todas formas decide especular</h2>
<p>Especular con dinero propio es una decisión legítima de un adulto, igual que cualquier pasatiempo costoso. Un profesional pondría estas reglas mínimas:</p>
<ol>
<li><b>Capital separado y limitado</b>: solo un dinero que se pueda perder por completo sin afectar el colchón, las deudas ni las metas. Una referencia común es no más de 5 % a 10 % del patrimonio financiero.</li>
<li><b>Regulación</b>: operar solo con entidades vigiladas por una autoridad seria, y entender dónde queda custodiado el dinero.</li>
<li><b>Registro de cada operación</b>: fecha, motivo, riesgo, resultado y costos. Sin registro no hay aprendizaje, solo anécdotas.</li>
<li><b>Medir la ventaja con estadística</b>: expectativa por operación con un intervalo de confianza, sobre una muestra grande (100 operaciones o más), comparada con no hacer nada y con un índice.</li>
<li><b>Probar antes en simulación o con montos mínimos</b>, y fijar de antemano el criterio para aumentar el capital o abandonar.</li>
<li><b>Riesgo fijo por operación y topes de pérdida</b> diarios y mensuales. Nunca promediar pérdidas ni aumentar el riesgo para «recuperar».</li>
<li><b>Apalancamiento bajo</b>: la liquidación convierte una mala racha en una pérdida permanente.</li>
</ol>
<div class="box teach"><p><b>El torneo de la moneda.</b> Cada estudiante empieza con 100 puntos y «opera» lanzando una moneda: cara gana el monto arriesgado, sello lo pierde, y cada operación paga 1 punto de comisión. Cada uno elige cuánto arriesgar por lanzamiento. Después de 30 lanzamientos se publica la tabla de resultados. Siempre hay algunos «genios» arriba, y casi todos terminan por debajo de 100. Pregunte: ¿quién ganó, la habilidad, la suerte o la casa? La casa, que cobró 30 puntos a cada uno.</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>Invertir es poseer activos que crean valor; especular es apostar a precios de corto plazo (suma cero antes de costos); apostar tiene expectativa negativa por diseño.</li>
<li>La evidencia de Estados Unidos, Taiwán, Brasil y Europa coincide: la gran mayoría de los operadores minoristas pierde dinero.</li>
<li>\(E=pb-(1-p)-c\). Con frecuencia alta, los costos dominan. Aun con expectativa cero, la mayoría de las cuentas pierde.</li>
<li>El apalancamiento multiplica la probabilidad de liquidación, que convierte pérdidas temporales en permanentes.</li>
<li>Kelly: sin ventaja, apostar cero; con ventaja, apostar de más destruye el crecimiento.</li>
<li>Quien vende cursos y señales gana con suscripciones y comisiones de afiliado, no con el éxito de sus alumnos.</li>
</ul></div>
<div class="box do"><ul>
<li>Si especula, calcule su expectativa por operación con todas sus operaciones registradas, incluidos los costos.</li>
<li>Compare su resultado de los últimos 12 meses con haber tenido el mismo dinero en un fondo índice.</li>
<li>Escriba sus reglas de riesgo antes de la próxima operación.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Una estrategia acierta 40 % de las veces, gana 2 R cuando acierta y paga 0,1 R de costo por operación. ¿Cuál es su expectativa?
<details><summary>Respuesta</summary><p>\(0{,}4\times2-0{,}6-0{,}1=0{,}1\) R por operación. Positiva, si los parámetros se midieron bien sobre una muestra grande.</p></details></li>
<li><span class="lvl">Básico</span>Con apalancamiento de 20 veces, ¿qué movimiento en contra del precio deja el capital en cero?
<details><summary>Respuesta</summary><p>\(1/20=5\,\%\). Y la liquidación llega antes, cuando se toca el margen de mantenimiento.</p></details></li>
<li><span class="lvl">Intermedio</span>Un operador hizo 50 operaciones con resultado promedio de +0,15 R y desviación estándar de 1,1 R por operación. ¿Puede concluir que tiene ventaja?
<details><summary>Respuesta</summary><p>Error estándar: \(1{,}1/\sqrt{50}\approx0{,}156\) R. El intervalo de 95 % es \(0{,}15\pm0{,}31\): de −0,16 a +0,46 R. Incluye el cero: todavía no hay evidencia de ventaja. Necesitaría muchas más operaciones.</p></details></li>
<li><span class="lvl">Intermedio</span>Con \(p=0{,}6\) y \(b=1\), ¿qué fracción recomienda Kelly? ¿Qué pasa con el crecimiento si se arriesga el 40 %?
<details><summary>Respuesta</summary><p>\(f^*=0{,}6-0{,}4=20\,\%\). Con 40 %: \(G=0{,}6\ln1{,}4+0{,}4\ln0{,}6\approx0{,}2019-0{,}2043\approx-0{,}002\): crecimiento negativo con una ventaja real.</p></details></li>
<li><span class="lvl">Avanzado</span>Deduzca \(f^*\) derivando \(G(f)\) e igualando a cero.
<details><summary>Respuesta</summary><p>\(G'(f)=\frac{pb}{1+bf}-\frac{1-p}{1-f}=0\Rightarrow pb(1-f)=(1-p)(1+bf)\Rightarrow f=\frac{pb-(1-p)}{b}=p-\frac{1-p}{b}\).</p></details></li>
</ol>
