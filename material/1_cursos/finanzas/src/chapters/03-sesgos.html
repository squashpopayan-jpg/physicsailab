<template class="chapter-src" data-id="sesgos" data-num="3" data-title="Sesgos que cuestan dinero" data-part="Parte I · La mente y el dinero" data-short="Teoría prospectiva y aversión a la pérdida; sesgo del presente; contabilidad mental; anclaje, exceso de confianza, manada y supervivencia; antídotos">
<p class="lead">Las decisiones de dinero no las toma una calculadora sino un cerebro con atajos. Esos atajos sirven casi siempre, pero fallan de maneras predecibles cuando hay riesgo, tiempo o números grandes de por medio. La economía del comportamiento, que le valió el Nobel a Daniel Kahneman en 2002 y a Richard Thaler en 2017, catalogó esos errores. Conocerlos no los elimina, pero permite diseñar reglas que los esquiven.</p>

<section>
<h2>Dos maneras de pensar</h2>
<p>Kahneman resume la mente en dos modos. El <span class="term">sistema 1</span> es rápido, automático e intuitivo: reconoce caras, completa frases, siente miedo ante una caída de la bolsa. El <span class="term">sistema 2</span> es lento, deliberado y costoso: calcula una cuota, compara dos créditos, lee la letra pequeña. Casi todo el tiempo manda el sistema 1, y está bien, pero sus atajos (las <span class="term">heurísticas</span>) producen <span class="term">sesgos</span>: desviaciones sistemáticas respecto de lo que una persona decidiría con calma y toda la información.</p>
<p>La palabra clave es <b>sistemáticas</b>. No son errores al azar que se cancelan entre sí, sino errores que van siempre en la misma dirección. Por eso las empresas los conocen y los usan en el diseño de precios, cuotas y publicidad.</p>
</section>

<section>
<h2>Perder duele más que ganar: la teoría prospectiva</h2>
<p>Kahneman y Tversky (1979) observaron que las personas no valoran la riqueza total, sino las <b>ganancias y pérdidas respecto de un punto de referencia</b> (lo que tenían, lo que esperaban, lo que pagaron). Su función de valor tiene tres rasgos: depende del cambio y no del nivel, se aplana a medida que los montos crecen (de $0 a $100.000 se siente más que de $1.000.000 a $1.100.000) y es más empinada para las pérdidas.</p>
<div class="eq key" data-name="Función de valor de Tversky y Kahneman (1992)">\[v(x)=\begin{cases}x^{\alpha} & x\ge 0\\ -\lambda\,(-x)^{\beta} & x\lt 0\end{cases}\qquad \alpha\approx\beta\approx0{,}88,\quad \lambda\approx2{,}25 .\]</div>
<p>El parámetro \(\lambda\) es la <span class="term">aversión a la pérdida</span>: una pérdida pesa más o menos el doble que una ganancia del mismo tamaño. Además, las probabilidades no se ponderan como son. Las pequeñas se sobrevaloran y las medianas y grandes se subvaloran, según una función de ponderación \(w(p)\).</p>
<div class="eq">\[w(p)=\frac{p^{\gamma}}{\big(p^{\gamma}+(1-p)^{\gamma}\big)^{1/\gamma}},\qquad \gamma\approx0{,}61 .\]</div>
<div class="sim" data-sim="prospectiva" data-title="Función de valor, ponderación de probabilidades y una apuesta"></div>
<div class="sim-guide"><ul>
<li>Con los parámetros típicos, la apuesta «ganar $150.000 o perder $100.000 lanzando una moneda» tiene valor esperado positivo (+$25.000) y aun así la teoría predice que se rechaza. Busque la ganancia mínima que la vuelve aceptable.</li>
<li>Ponga \(\lambda=1\): desaparece la aversión a la pérdida y la decisión se acerca a la del valor esperado.</li>
<li>Cambie la apuesta a «ganar $5.000.000 con 1 % de probabilidad» y mire \(w(0{,}01)\approx0{,}055\). La probabilidad se siente cinco veces mayor de lo que es. Ese es el motor psicológico de las loterías y de las garantías extendidas.</li>
</ul></div>
<p>Tres consecuencias para el bolsillo:</p>
<ul>
<li><b>Efecto disposición.</b> Se venden rápido las inversiones que ganan (para «asegurar» la ganancia) y se mantienen las que pierden (para no «hacer real» la pérdida). Odean (1998), con 10.000 cuentas de inversionistas, encontró que realizaban ganancias cerca de 1,5 veces más que pérdidas, y que las acciones vendidas rendían después más que las que conservaban.</li>
<li><b>Seguros para lo pequeño, nada para lo grande.</b> Se compra la garantía extendida del celular y no un seguro de vida teniendo hijos (capítulo 13).</li>
<li><b>El encuadre manda.</b> «Ahorre $200.000» y «evite perder $200.000» son lo mismo, pero lo segundo mueve más.</li>
</ul>
</section>

<section>
<h2>El presente pesa demasiado</h2>
<p>Preferir un pago hoy a uno mañana es razonable. Lo que no es razonable es cambiar de opinión solo porque pasa el tiempo. Con un descuento <span class="term">exponencial</span>, \(D(t)=\delta^{t}\), la preferencia entre dos fechas no cambia al acercarse a ellas. Las personas reales descuentan de forma <span class="term">hiperbólica</span>, \(D(t)=1/(1+kt)\), o casi hiperbólica, \(D(0)=1\) y \(D(t)=\beta\delta^{t}\) (Laibson, 1997): el «hoy» tiene un peso especial.</p>
<div class="box ex"><p>Ante «$100.000 hoy o $120.000 en una semana», muchos eligen hoy. Ante «$100.000 dentro de 30 días o $120.000 dentro de 37 días», casi todos esperan los siete días. Pero cuando llega el día 30 la primera pregunta se repite y vuelven a elegir el dinero inmediato. Lo mismo pasa con el ahorro: «desde el mes que viene empiezo» es sincero hoy y se incumple cuando el mes llega.</p></div>
<div class="sim" data-sim="hiperbolico" data-title="Descuento exponencial frente a hiperbólico: la inversión de preferencias"></div>
<div class="sim-guide"><ul>
<li>La gráfica de la izquierda muestra cuánto vale hoy un peso futuro en cada modelo. La hiperbólica cae muy rápido al principio y luego se aplana.</li>
<li>La de la derecha compara las dos opciones vistas desde distintas distancias. Donde las curvas se cruzan, la persona hiperbólica cambia de opinión. La exponencial nunca lo hace.</li>
<li>Suba \(k\) (impaciencia): el punto de cambio se aleja y la tentación del presente gana más veces.</li>
</ul></div>
<div class="box evid"><p>DellaVigna y Malmendier (2006) estudiaron gimnasios en Estados Unidos. Quienes pagaban una mensualidad iban tan poco que cada visita les costaba en promedio más de 17 dólares, cuando el gimnasio ofrecía tiquetes de 10 dólares por visita. Al inscribirse, se imaginaban yendo seguido. Es el sesgo del presente en estado puro: el yo de mañana iba a hacer el esfuerzo. La solución no es más fuerza de voluntad, sino <span class="term">mecanismos de compromiso</span> que decidan por adelantado: débitos automáticos, CDT, el programa «Ahorre más mañana» del capítulo 5.</p></div>
</section>

<section>
<h2>Contabilidad mental</h2>
<p>El dinero es <span class="term">fungible</span>: un peso de la prima vale exactamente lo mismo que un peso del salario. Pero Thaler mostró que las personas le ponen etiquetas («esta plata es para vacaciones», «esto me lo gané en una rifa») y la tratan distinto según la etiqueta. A esto lo llamó <span class="term">contabilidad mental</span>.</p>
<div class="box ex"><p>Diana tiene $5.000.000 en un CDT al 9 % EA «para no tocarlo» y, al mismo tiempo, debe $5.000.000 en la tarjeta de crédito al 27 % EA. Mantener las dos cuentas le cuesta cada año aproximadamente \(5.000.000\times(0{,}27-0{,}09)=\) $900.000, sin contar la retención en la fuente del CDT. Pagar la tarjeta con el CDT y luego reponer el ahorro con la misma cuota que pagaba a la tarjeta la deja mejor en cualquier escenario, salvo que ese CDT sea su único colchón para emergencias.</p></div>
<p>La contabilidad mental no siempre es mala. Bien usada, es la base del método de sobres y de las cuentas separadas por meta (capítulo 12): etiquetar el ahorro para la universidad de los hijos hace menos probable gastarlo en otra cosa. El problema aparece cuando las etiquetas llevan a pagar intereses altos teniendo dinero quieto, o a gastar sin control el dinero «extra».</p>
</section>

<section>
<h2>Anclaje, exceso de confianza, manada y supervivencia</h2>
<ul>
<li><b>Anclaje.</b> El primer número que se ve contamina la estimación. «Antes $499.900, hoy $299.900» hace parecer barato algo que quizá vale $200.000. En una negociación de salario, quien pone primero una cifra razonable suele mover el resultado hacia ella.</li>
<li><b>Exceso de confianza.</b> Casi todos nos creemos mejores conductores o inversionistas que el promedio. Barber y Odean (2001) encontraron que los hombres operaban en bolsa cerca de 45 % más que las mujeres y que eso les restaba más rentabilidad. Operar mucho es la huella del exceso de confianza (capítulo 20).</li>
<li><b>Efecto manada.</b> Si todos compran, parece seguro comprar. Así se inflan las burbujas y crecen las pirámides: cuando el vecino gana, la presión social pesa más que el análisis.</li>
<li><b>Costo hundido.</b> «Ya invertí tanto en este negocio que no puedo dejarlo». Lo gastado no vuelve. La decisión correcta mira solo el futuro.</li>
<li><b>Sesgo de supervivencia.</b> Solo vemos a quienes sobrevivieron: el emprendedor exitoso, el fondo que sigue abierto, el gurú que acertó. Los que fracasaron no dan conferencias.</li>
</ul>
<div class="sim" data-sim="supervivencia" data-title="Diez mil «expertos» lanzan una moneda: ¿cuántos parecen genios?"></div>
<div class="sim-guide"><ul>
<li>Cada experto predice «sube o baja» al azar, con 50 % de probabilidad de acertar. Tras 10 rondas, alrededor de 10 de los 10.000 tienen un historial perfecto: \(10.000\times0{,}5^{10}\approx9{,}8\).</li>
<li>Esos diez venderán cursos con su «récord». Pruebe con un millón de expertos y 15 rondas: siguen quedando una treintena de genios, todos por pura suerte.</li>
<li>Suba la probabilidad de acierto a 55 % (habilidad real modesta) y compare: la habilidad pequeña se confunde fácilmente con la suerte. El capítulo 19 calcula cuántos años hacen falta para distinguirlas.</li>
</ul></div>
<div class="box myth">
<p class="m"><b>Mito</b>«Si ese señor se volvió millonario con su método, a mí también me funcionará».</p>
<p class="r"><b>Realidad</b>Un caso exitoso no dice nada sin los casos fallidos que usaron el mismo método. Pregunte siempre: ¿cuántos lo intentaron?, ¿cuántos perdieron?, ¿dónde están los resultados auditados? Sin esas respuestas, el éxito ajeno es una anécdota.</p>
</div>
</section>

<section>
<h2>Antídotos: reglas escritas en frío</h2>
<p>Saber que existen los sesgos ayuda poco en el momento de la tentación. Funciona mejor decidir las reglas con calma y dejarlas escritas o automatizadas.</p>
<div class="tablewrap"><table>
<thead><tr><th>Sesgo</th><th>Cómo se ve</th><th>Regla que lo esquiva</th></tr></thead>
<tbody>
<tr><td>Sesgo del presente</td><td>«Desde el próximo mes ahorro»</td><td>Débito automático el día de pago, antes de ver el dinero</td></tr>
<tr><td>Aversión a la pérdida</td><td>Vender todo en una caída</td><td>Plan de inversión escrito con la mezcla y el rebalanceo definidos</td></tr>
<tr><td>Contabilidad mental</td><td>Ahorro al 9 % y deuda al 27 %</td><td>Revisar una vez al año todas las tasas juntas, activos y deudas</td></tr>
<tr><td>Anclaje</td><td>«Antes valía el doble»</td><td>Comparar con otros vendedores, no con el precio tachado</td></tr>
<tr><td>Exceso de confianza</td><td>Operar seguido en bolsa</td><td>Registrar cada decisión y su resultado; compararse con un fondo índice</td></tr>
<tr><td>Manada</td><td>«Todos están metidos»</td><td>Esperar 48 horas y pedir la opinión de alguien que no gane nada si usted acepta</td></tr>
<tr><td>Supervivencia</td><td>Testimonios de éxito</td><td>Preguntar por el total de participantes y por los que perdieron</td></tr>
</tbody></table></div>
<div class="box teach"><p><b>Experimento en clase (15 minutos).</b> Antes de explicar nada, pida que respondan en papel: (a) «¿aceptaría lanzar una moneda en la que gana $150.000 o pierde $100.000?»; (b) «¿prefiere $100.000 hoy o $120.000 en una semana?»; (c) «¿y $100.000 en 30 días o $120.000 en 37 días?». Cuente las respuestas a mano alzada. Casi siempre la mayoría rechaza (a) y muchos cambian entre (b) y (c). Así el grupo descubre los sesgos en sí mismo antes de verlos en el tablero.</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>Los sesgos son desviaciones sistemáticas, no errores al azar. Las empresas los conocen y los usan.</li>
<li>Las pérdidas pesan cerca del doble que las ganancias (\(\lambda\approx2{,}25\)) y las probabilidades pequeñas se sobrevaloran.</li>
<li>El descuento hiperbólico produce inversiones de preferencias: los planes de ahorro de mañana se incumplen hoy.</li>
<li>La contabilidad mental puede ayudar (cuentas por meta) o dañar (deuda cara junto a ahorro barato).</li>
<li>Anclaje, exceso de confianza, manada, costo hundido y supervivencia distorsionan decisiones. El antídoto es tener reglas decididas en frío y automatizadas.</li>
</ul></div>
<div class="box do"><ul>
<li>Haga una lista de todas sus deudas y ahorros con su tasa. ¿Tiene dinero quieto mientras paga intereses altos?</li>
<li>Escriba tres reglas personales, por ejemplo: «ninguna compra mayor de $300.000 sin esperar 48 horas».</li>
<li>La próxima vez que vea un precio tachado, busque el mismo producto en dos tiendas más antes de decidir.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Con \(\alpha=\beta=1\) y \(\lambda=2\), ¿qué valor psicológico tiene una apuesta 50/50 de ganar $300 o perder $200? ¿Se acepta?
<details><summary>Respuesta</summary><p>Sin ponderación de probabilidades: \(0{,}5\times300+0{,}5\times(-2\times200)=150-200=-50\). Se rechaza, aunque el valor esperado en pesos sea +$50.</p></details></li>
<li><span class="lvl">Básico</span>Una tienda ofrece «paga 12 cuotas sin interés o lleva 10 % de descuento de contado». ¿Qué sesgo explotan las cuotas y qué debería calcular el comprador?
<details><summary>Respuesta</summary><p>El sesgo del presente: la cuota pequeña duele menos hoy. Hay que calcular la tasa implícita de renunciar al descuento (capítulo 9). Pagar 12 cuotas de \(P/12\) en vez de \(0{,}9P\) hoy equivale a una tasa cercana a 1,7 % mensual, unos 22 % EA.</p></details></li>
<li><span class="lvl">Intermedio</span>Con descuento hiperbólico \(D(t)=1/(1+kt)\) y \(k=0{,}05\) por día, ¿prefiere la persona $100 hoy o $120 en 7 días? ¿Y $100 en 30 días o $120 en 37 días?
<details><summary>Respuesta</summary><p>Hoy: \(100\) frente a \(120/1{,}35\approx88{,}9\), elige $100. A 30 días: \(100/2{,}5=40\) frente a \(120/2{,}85\approx42{,}1\), elige $120. Es una inversión de preferencias.</p></details></li>
<li><span class="lvl">Intermedio</span>Un fondo anuncia: «De nuestros fondos, el 90 % superó al mercado en los últimos diez años». ¿Qué pregunta haría por el sesgo de supervivencia?
<details><summary>Respuesta</summary><p>¿Cuántos fondos tenía la gestora hace diez años y cuántos cerró o fusionó por malos resultados? Si cerró la mitad, el 90 % de los sobrevivientes es solo el 45 % de los originales.</p></details></li>
<li><span class="lvl">Avanzado</span>Muestre que con descuento exponencial nunca hay inversión de preferencias entre \(a\) en \(s\) y \(b\) en \(s+d\).
<details><summary>Respuesta</summary><p>Se prefiere \(b\) si \(b\,\delta^{s+d}>a\,\delta^{s}\), es decir, si \(b\,\delta^{d}>a\). La condición no depende de \(s\): la elección es la misma vista desde cualquier distancia.</p></details></li>
</ol>
