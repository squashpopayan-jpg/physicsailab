    <h1 class="home-title">Cuentas <em>claras</em><span>psicología del dinero y finanzas personales con método profesional</span></h1>
    <p class="home-lead">Seguramente le han dicho que si cambia su forma de ver el dinero, la riqueza llegará. Eso es cierto a medias. Las creencias sí importan, porque guían lo que hacemos con cada peso. Pero el patrimonio solo cambia con lo que hacemos: cuánto se ahorra, cómo se usa la deuda, dónde se invierte y por cuánto tiempo. Este curso trabaja las dos cosas con el método de un planificador financiero. Explica cada idea con palabras sencillas, la escribe en una fórmula, la pone a prueba en una simulación con datos reales y la convierte en una tarea para esta semana.</p>
    <div class="maxwell-strip" aria-label="Cuatro ecuaciones que recorren el curso">
      <div><small>Riqueza (patrimonio)</small>\[W=\text{Activos}-\text{Deudas}\]</div>
      <div><small>Interés compuesto</small>\[\VF=\VP\,(1+i)^{n}\]</div>
      <div><small>Tasa real</small>\[1+r=\frac{1+i}{1+\pi}\]</div>
      <div><small>Años hasta la independencia</small>\[n=\frac{\ln\!\Big(1+\dfrac{r\,(1-s)}{s\,w}\Big)}{\ln(1+r)}\]</div>
    </div>
    <p class="home-count ctrl-note" style="margin-top:14px;font-size:13px"></p>
    <p class="home-author"><small>Elaborado por</small><b>Mg. Manuel Alejandro Obando</b><span>Departamento de Física · Universidad del Cauca</span></p>
  </div>
  <div class="home-live">
    <div class="sim" data-sim="home-hero" data-num="En vivo" data-title="Ciento veinte futuros posibles de ahorrar $300.000 al mes durante 30 años"></div>
    <p class="home-note"><b>Cómo leer la animación.</b> Cada línea fina es una vida posible con el mismo hábito de ahorro y un portafolio mixto (rentabilidad real esperada de 6 % anual con altibajos). La línea punteada es lo que la persona aportó de su bolsillo; la banda muestra el rango probable. Nadie controla la suerte de los mercados, pero sí el hábito y el tiempo.</p>

<div class="home-howto">
  <div><b>Mente y método</b><p>Cada capítulo une la psicología (creencias, sesgos, hábitos) con la técnica de un profesional (fórmulas, indicadores, planes). Los recuadros «Mito y realidad» separan lo que repiten los gurús de lo que muestra la evidencia.</p></div>
  <div><b>Simulaciones con datos reales</b><p>Créditos, inflación, inversiones y retiro se simulan en el navegador. Los cálculos coinciden con Excel y numpy-financial, y las series históricas son las de Damodaran (1928-2025) y el Banco Mundial (apéndice D).</p></div>
  <div><b>Contexto colombiano</b><p>Salario mínimo, UVT, tasa de usura, Fogafín, cesantías, renta y pensiones con cifras de octubre de 2026 y su fuente. Los recuadros «En Colombia» dicen qué verificar cuando cambien.</p></div>
  <div><b>Listo para enseñar</b><p>Cada capítulo trae una tarea para la semana, problemas con respuesta y una actividad de clase. El apéndice C organiza el curso en sesiones; el apéndice B es la hoja de trabajo del plan personal.</p></div>
