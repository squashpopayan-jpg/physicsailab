<p class="lead">Este curso se escribió para aprender y también para enseñar. Este apéndice reúne lo necesario para llevarlo a un aula, un taller comunitario o una empresa: qué se sabe sobre la eficacia de la educación financiera, principios para enseñar sin exponer a nadie, cuatro secuencias de sesiones con sus actividades y una evaluación diagnóstica que sirve antes y después.</p>

<section>
<h2>Qué dice la evidencia sobre la educación financiera</h2>
<div class="box evid"><p>Un metaanálisis influyente (Fernandes, Lynch y Netemeyer, 2014) encontró que las intervenciones de educación financiera explicaban una parte muy pequeña de las conductas y que su efecto se desvanecía en menos de dos años. Un metaanálisis posterior, restringido a experimentos aleatorizados (Kaiser, Lusardi, Menkhoff y Urban, 2022), encontró efectos positivos sobre el conocimiento y sobre conductas como ahorrar, presupuestar y endeudarse menos, de tamaño parecido al de otras intervenciones educativas. La conclusión práctica: enseñar finanzas funciona, pero modestamente, y funciona mejor cuando está cerca de una decisión real y cuando convierte el conocimiento en hábitos y sistemas.</p></div>
<p>De ahí los tres principios del curso: enseñar <b>justo a tiempo</b> (cuando el estudiante tiene que decidir algo: el primer salario, el primer crédito, la primera inversión), convertir cada tema en una <b>tarea concreta</b> (los recuadros «Para hacer esta semana») y diseñar <b>sistemas</b> en lugar de pedir fuerza de voluntad (capítulo 5).</p>
</section>

<section>
<h2>Principios didácticos y éticos</h2>
<ul>
<li><b>Nunca exponer cifras personales.</b> El dinero toca vergüenza, pobreza, deudas y, a veces, violencia económica en el hogar. Use casos ficticios para el trabajo en grupo; las cifras propias se trabajan en privado (apéndice B).</li>
<li><b>Primero la experiencia, después la teoría.</b> Los experimentos de los recuadros «Para enseñarlo» (la moneda, los dados, las fichas) funcionan mejor antes de explicar el concepto.</li>
<li><b>Calcular a mano una vez.</b> Construir una tabla de amortización o una escalera de CDT en la hoja de cálculo deja una comprensión que ninguna simulación reemplaza. Las simulaciones sirven después para explorar.</li>
<li><b>Neutralidad comercial.</b> No recomendar entidades ni productos concretos, ni aceptar patrocinios que condicionen el contenido. Enseñar a comparar con las cinco preguntas del capítulo 18.</li>
<li><b>No dar asesoría individual de inversión.</b> El docente enseña criterios; las decisiones con montos importantes, impuestos o pensiones requieren un profesional que conozca toda la situación.</li>
<li><b>Honestidad con la evidencia.</b> Decir qué está bien demostrado, qué es discutido y qué es mito. Los recuadros «Lo que dice la evidencia» y «Mito y realidad» están para eso.</li>
<li><b>Actualizar las cifras colombianas</b> al empezar cada curso: salario mínimo, UVT, usura, inflación y estado de la reforma pensional (apéndice A).</li>
</ul>
</section>

<h3>Taller corto: 4 sesiones de 2 horas</h3>
<ol>
<li><b>Mente y dinero</b> (capítulos 1, 2 y 5): las tres preguntas, guiones, WOOP y un sistema automático.</li>
<li><b>Las cuentas</b> (6, 7 y 10): compuesto, tasas efectivas y la tabla de un crédito.</li>
<li><b>El hogar</b> (11, 12 y 14): diagnóstico, presupuesto con provisión y plan de deudas.</li>
<li><b>El futuro</b> (16, 22 y 25): riesgo y horizonte, metas con cuota y señales de fraude.</li>
</ol>
<h3>Colegio (grados 10 y 11): 6 sesiones</h3>
<p>Capítulos 1, 3, 6, 7, 12 y 25, con énfasis en actividades: salario real por hora de un primer empleo, sesgos con preguntas en papel, el grano de arroz, anuncios de crédito y celulares a cuotas, presupuesto con fichas y el juego de la pirámide. Evitar cifras del hogar de los estudiantes y trabajar con personajes ficticios.</p>
<h3>Comunidad o empresa: 3 sesiones</h3>
<p>Capítulos 12, 13 y 14, más el 25: presupuesto con provisión para la cuesta de enero, fondo de emergencia, salir de deudas, gota a gota y pirámides. Son los temas con mayor efecto inmediato en hogares con ingresos ajustados. Cierre con la hoja del apéndice B en el celular de cada participante.</p>

<h2>Evaluación diagnóstica</h2>
<p>Las diez preguntas siguientes sirven como prueba de entrada y de salida. Aplicadas antes y después, permiten medir el avance del grupo sin calificar a nadie individualmente.</p>
<div class="sim" data-sim="evaluacion" data-title="Prueba de entrada y salida del curso (10 preguntas)"></div>
<h3>Rúbrica del plan financiero</h3>
<div class="tablewrap"><table>
<thead><tr><th>Criterio</th><th>Inicial (1)</th><th>En desarrollo (2)</th><th>Logrado (3)</th></tr></thead>
<tbody>
<tr><td>Diagnóstico</td><td>Cifras incompletas o sin indicadores</td><td>Indicadores calculados, sin interpretación</td><td>Indicadores interpretados en tres frases: qué está bien, qué urge, primer paso</td></tr>
<tr><td>Metas</td><td>Metas vagas</td><td>Metas con monto o fecha</td><td>Metas en pesos de hoy, con fecha, instrumento según horizonte y cuota calculada</td></tr>
<tr><td>Prioridades</td><td>Sin orden</td><td>Orden parcial</td><td>Orden justificado (colchón, deudas caras, protección, retiro, metas)</td></tr>
<tr><td>Cálculos</td><td>Errores de tasa o de unidades</td><td>Cálculos correctos sin verificación</td><td>Cálculos correctos y verificados con la hoja de cálculo o las simulaciones</td></tr>
<tr><td>Plan de acción</td><td>Intenciones generales</td><td>Acciones concretas</td><td>Acciones concretas, automatizadas, con fecha y regla personal</td></tr>
<tr><td>Criterio</td><td>Acepta afirmaciones sin evidencia</td><td>Identifica algunos mitos</td><td>Distingue evidencia, mito y conflicto de interés en sus fuentes</td></tr>
</tbody></table></div>
<p>El plan se puede evaluar sin conocer las cifras reales: el estudiante puede presentar el proceso con un caso ficticio parecido al suyo.</p>
</section>

<section>
<h2>Materiales</h2>
<ul>
<li>Computador o celular con una hoja de cálculo (Excel, Google Sheets o LibreOffice) y este curso abierto.</li>
<li>Fichas o papelitos (presupuesto, pirámide), dados (diversificación), monedas (sesgos, trading), sobres de papel.</li>
<li>Anuncios reales de créditos, tarjetas, CDT y compras a cuotas, recogidos por el grupo.</li>
<li>Casos ficticios de hogares: un joven recién graduado, una pareja con hijos, un independiente y un jubilado.</li>
</ul>
