<p class="lead">Este capítulo cierra el curso donde empezó: con la promesa de que la riqueza puede aparecer. Las pirámides y los esquemas Ponzi venden exactamente eso, rentabilidades altas, rápidas y seguras, y en Colombia han dejado miles de familias arruinadas. Con las herramientas de los capítulos anteriores se puede demostrar con números por qué colapsan siempre, reconocer las señales de alerta y verificar a quién se le entrega el dinero. También se aplica el mismo criterio a los libros, cursos y gurús que prometen cambiar la vida financiera.</p>

<section>
<h2>Anatomía de un esquema Ponzi</h2>
<p>En 1920, Charles Ponzi prometió en Boston 50 % de rentabilidad en 45 días comprando cupones postales internacionales. No compraba casi nada: pagaba los «rendimientos» de los primeros inversionistas con el dinero de los nuevos. Un <span class="term">esquema Ponzi</span> es eso: no hay un negocio que genere la rentabilidad prometida, y los pagos salen de los aportes de quienes llegan después. Funciona mientras entra más dinero del que sale. Como las obligaciones crecen a la tasa prometida, el esquema necesita que los aportes nuevos crezcan al menos a esa velocidad para siempre. Eso es imposible, así que siempre colapsa. La única pregunta es cuándo.</p>
<div class="sim" data-sim="ponzi" data-title="Dinámica de un esquema Ponzi: caja real frente a saldos prometidos"></div>
<div class="sim-guide"><ul>
<li>El esquema promete 10 % mensual. Los aportes nuevos crecen 15 % al mes durante el auge. La mitad de los participantes retira sus «rendimientos» y el resto los deja reinvertidos, aunque solo existen en papel. Los organizadores se quedan con 20 % de cada aporte.</li>
<li>Mientras crecen los aportes, la caja parece sana y se pagan los rendimientos puntualmente: eso genera los testimonios. Cuando el reclutamiento se frena, en el mes 18 del ejemplo, la caja se agota en pocos meses.</li>
<li>Al colapsar, los saldos prometidos superan con creces la caja. Mueva el mes del freno: el colapso solo se aplaza, y la pérdida final es mayor cuanto más dura el auge.</li>
</ul></div>
<div class="box co"><p>Colombia conoce bien estos esquemas. En 2008, DMG y otras «pirámides» captaron dinero de cientos de miles de personas, sobre todo en el sur del país, incluido el Cauca, con promesas de rendimientos altísimos. Su intervención y colapso dejaron pérdidas enormes. Captar dinero del público de forma masiva y habitual sin autorización es un delito (artículo 316 del Código Penal), y la Superintendencia Financiera publica alertas sobre entidades que lo hacen. Los esquemas actuales suelen presentarse como «trading con inteligencia artificial», «minería de criptomonedas», «inversión en forex» o «natillera digital».</p></div>
</section>

<section>
<h2>Las pirámides y el techo de la población</h2>
<p>Una <span class="term">pirámide</span> paga por reclutar: cada participante entra pagando y recupera su dinero, y gana, si consigue que entren otros debajo de él. Si cada persona debe reclutar a \(k\) personas, el nivel \(n\) tiene \(k^n\) personas. Esa progresión geométrica choca muy pronto con el tamaño de la población.</p>
<div class="sim" data-sim="piramide" data-title="¿Cuántos niveles caben en Colombia?"></div>
<div class="sim-guide"><ul>
<li>Si cada uno debe traer 6 personas, en el nivel 10 se necesitan más de 60 millones de personas nuevas: más que toda la población de Colombia.</li>
<li>Cuando la pirámide se detiene, el último nivel, que pagó y no alcanzó a reclutar, es la mayoría: con \(k=6\), cerca de 83 % de todos los participantes.</li>
<li>Por eso, en una pirámide, la mayoría pierde por diseño, no por mala suerte. Las primeras personas, las que dan los testimonios, son las únicas que ganan.</li>
</ul></div>
<div class="box warn"><p>No todo negocio de venta directa es una pirámide. La diferencia legal y práctica es de dónde salen los ingresos: si vienen de vender productos a clientes reales, es un negocio (aunque a veces malo); si vienen principalmente de las inscripciones de nuevos miembros, es una pirámide. Desconfíe de cualquier propuesta en la que se gane más por reclutar que por vender.</p></div>
</section>

<section>
<h2>Señales de alerta</h2>
<p>Las autoridades financieras de muchos países coinciden en una lista de señales. Una sola no prueba un fraude; varias juntas lo hacen muy probable:</p>
<ul>
<li>Rentabilidad <b>alta y garantizada</b>, sin riesgo. En finanzas, rentabilidad alta y riesgo bajo no van juntos (capítulo 16).</li>
<li><b>Urgencia</b>: «solo quedan cupos», «la oportunidad se cierra el viernes».</li>
<li>Ganancias por <b>reclutar</b> a otros.</li>
<li>Explicaciones <b>vagas o secretas</b>: «un algoritmo», «inteligencia artificial», «arbitraje», «minería», sin estados financieros auditados.</li>
<li>La entidad <b>no está vigilada</b> por la Superintendencia Financiera o se presenta como «no necesita» estarlo.</li>
<li>Pagos iniciales <b>puntuales</b> que generan confianza, seguidos de trabas para retirar el capital.</li>
<li><b>Fraude por afinidad</b>: llega por familiares, amigos, la iglesia o el trabajo, y criticarlo se vuelve una traición.</li>
<li>Ostentación y testimonios en redes sociales, en lugar de información verificable.</li>
</ul>
<div class="sim" data-sim="checklist" data-title="Evalúe una oferta: lista de verificación de señales de alerta"></div>
<div class="sim-guide"><ul>
<li>Marque lo que aplica a una oferta que le hayan hecho. La lista pondera las señales según su gravedad.</li>
<li>Si la oferta promete más de 2 % mensual garantizado, compare con la tasa de usura del capítulo 7: ningún negocio legal puede sostener eso para sus clientes.</li>
<li>Es una guía para pensar, no un dictamen. Ante la duda, consulte a la Superintendencia Financiera antes de entregar dinero.</li>
</ul></div>
</section>

<section>
<h2>Cómo verificar en Colombia</h2>
<ol>
<li><b>¿Está vigilada?</b> En el sitio de la Superintendencia Financiera se puede consultar la lista de entidades vigiladas. Si la entidad capta dinero del público y no aparece, no está autorizada.</li>
<li><b>¿Hay alertas?</b> La Superintendencia publica advertencias sobre personas y sitios que ofrecen servicios financieros sin autorización.</li>
<li><b>¿Existe la empresa?</b> El Registro Único Empresarial y Social (RUES) de las cámaras de comercio muestra si está registrada y desde cuándo. Estar registrada no significa estar autorizada para captar dinero.</li>
<li><b>¿El producto está inscrito?</b> Las ofertas públicas de valores deben estar en el Registro Nacional de Valores y Emisores.</li>
<li><b>¿Quién custodia el dinero?</b> En los productos legítimos, el dinero queda en una entidad vigilada y separado del patrimonio de quien lo administra.</li>
</ol>
<p>Si ya entregó dinero a un esquema sospechoso, documente todo (mensajes, comprobantes, contratos), deje de aportar, no reclute a nadie más y denuncie ante la Fiscalía y la Superintendencia.</p>
</section>

<section>
<h2>Libros, cursos y gurús: el mismo criterio</h2>
<p>La industria de la educación financiera también tiene incentivos. Antes de pagar un curso o seguir a un gurú, conviene hacer cinco preguntas:</p>
<ol>
<li>¿Cómo gana dinero quien enseña: con lo que dice saber hacer o con lo que vende a sus alumnos?</li>
<li>¿Sus afirmaciones tienen evidencia, o solo anécdotas y testimonios?</li>
<li>¿Promete resultados («libertad financiera en 12 meses»)?</li>
<li>¿Muestra los casos que fracasaron y los riesgos, o solo los éxitos?</li>
<li>¿Hay una escalera de ventas (curso gratis, luego taller, luego «mentoría élite») o le piden reclutar?</li>
</ol>
<p>Con esas preguntas y la evidencia de este curso, esta es una lectura crítica de los libros sobre dinero más recomendados en América Latina:</p>

<div class="box myth">
<p class="m"><b>Mito</b>«Si el libro me motivó, cumplió su función».</p>
<p class="r"><b>Realidad</b>La motivación dura poco si no se convierte en sistemas (capítulo 5). Y un libro puede motivar hacia decisiones dañinas: comprar con apalancamiento, dejar los estudios, entrar en negocios de reclutamiento. La pregunta útil no es si motivó, sino qué decisiones concretas provocó y si esas decisiones resisten los números.</p>
</div>
<div class="box teach"><p><b>El juego de la pirámide (con fichas, sin dinero).</b> Organice una pirámide simulada: el primer estudiante «invierte» 10 fichas y recibe 30 cuando recluta a tres compañeros, que a su vez deben reclutar a tres cada uno. Con un grupo de 30 personas, el juego se agota en el tercer nivel. Cuente cuántos ganaron y cuántos perdieron. El resultado, siempre igual, se recuerda mejor que cualquier explicación. Use solo fichas y deje claro desde el principio que es una demostración.</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>Un Ponzi paga rendimientos con aportes nuevos; una pirámide paga por reclutar. Ambos colapsan siempre, porque exigen crecimiento infinito.</li>
<li>En una pirámide, la mayoría de los participantes, los del último nivel, pierde por diseño.</li>
<li>Señales: rentabilidad alta garantizada, urgencia, reclutamiento, explicaciones vagas, entidad no vigilada, trabas para retirar, fraude por afinidad.</li>
<li>Verificar: entidades vigiladas y alertas de la Superintendencia Financiera, RUES, Registro Nacional de Valores y custodia del dinero.</li>
<li>Para libros, cursos y gurús: ¿cómo gana dinero quien enseña?, ¿qué evidencia tiene?, ¿qué decisiones concretas propone?</li>
</ul></div>
<div class="box do"><ul>
<li>Repase con la lista 25.3 la última «oportunidad» de inversión que le ofrecieron.</li>
<li>Busque en el sitio de la Superintendencia Financiera la lista de entidades vigiladas y guarde el enlace.</li>
<li>Elija un libro de la tabla y escriba tres decisiones concretas que tomaría a partir de él.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Un esquema promete 8 % mensual. ¿A qué tasa efectiva anual equivale? Compárela con la usura.
<details><summary>Respuesta</summary><p>\(1{,}08^{12}-1\approx152\,\%\) E.A., más de cinco veces la tasa de usura de octubre de 2026. Ningún negocio legal la sostiene para sus clientes.</p></details></li>
<li><span class="lvl">Básico</span>En una pirámide donde cada uno recluta 4 personas, ¿cuántas personas hay en el nivel 12?
<details><summary>Respuesta</summary><p>\(4^{12}=16.777.216\). Sumando todos los niveles hasta el 12 hay más de 22 millones de personas.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Por qué los esquemas Ponzi suelen pagar puntualmente los primeros meses?
<details><summary>Respuesta</summary><p>Porque al principio entra mucho más dinero del que hay que pagar, y los pagos puntuales son la mejor publicidad: generan testimonios y atraen nuevos aportes, que son los que sostienen el esquema.</p></details></li>
<li><span class="lvl">Intermedio</span>Si un Ponzi promete una tasa \(r\) mensual sobre todo lo aportado, ¿a qué ritmo mínimo deben crecer los aportes nuevos para que no colapse?
<details><summary>Respuesta</summary><p>Al menos a la tasa \(r\) (y más, si los organizadores se quedan con una parte). Si los aportes crecen más despacio que las obligaciones, el déficit crece sin límite. Con 10 % mensual, los aportes tendrían que multiplicarse por más de 3 cada año, para siempre.</p></details></li>
<li><span class="lvl">Avanzado</span>Muestre que en una pirámide de \(N\) niveles completos con \(k\) reclutas por persona, la fracción de participantes en el último nivel tiende a \((k-1)/k\).
<details><summary>Respuesta</summary><p>Total: \(\sum_{n=0}^{N-1}k^n=(k^N-1)/(k-1)\). Último nivel: \(k^{N-1}\). Fracción: \(k^{N-1}(k-1)/(k^N-1)\to(k-1)/k\) cuando \(N\) crece. Con \(k=6\), 83 %; con \(k=2\), la mitad.</p></details></li>
</ol>
