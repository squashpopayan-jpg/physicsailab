<template class="chapter-src" data-id="presupuesto" data-num="12" data-title="Presupuesto y gasto consciente" data-part="Parte III · La economía del hogar" data-short="Para qué sirve un presupuesto; métodos 50/30/20, base cero, sobres y pagarse primero; gastos irregulares y la cuesta de enero; gastos hormiga; presupuesto en pareja">
<p class="lead">La palabra presupuesto suena a restricción, pero un buen presupuesto hace lo contrario: decide de antemano a qué se le dice sí, para no tener que decir que no a todo lo demás. No existe un método único correcto. Existe el que una persona puede sostener. Este capítulo presenta los métodos más usados, los adapta a los ingresos colombianos y ataca dos fugas clásicas: los gastos que llegan una vez al año y los gastos hormiga.</p>

<section>
<h2>Para qué sirve un presupuesto</h2>
<p>Un presupuesto es un plan de gasto hecho <b>antes</b> de que llegue el dinero. Cumple tres funciones: asegura que lo importante (ahorro, deudas, necesidades) se pague primero; hace visibles las decisiones (gastar en restaurantes es elegir no gastar en otra cosa); y permite comparar el plan con lo real para aprender. El registro de gastos del capítulo 5 dice adónde fue el dinero. El presupuesto dice adónde debe ir.</p>
<div class="box myth">
<p class="m"><b>Mito</b>«No hago presupuesto porque no me alcanza ni para lo básico».</p>
<p class="r"><b>Realidad</b>Cuanto más justo es el dinero, más falta hace el plan, porque cada error cuesta más. Con ingresos bajos, un presupuesto sencillo de cinco categorías anotado en un cuaderno suele evitar préstamos caros a fin de mes.</p>
</div>
</section>

<section>
<h2>Cuatro métodos</h2>
<div class="tablewrap"><table>
<thead><tr><th>Método</th><th>Cómo funciona</th><th>Para quién</th></tr></thead>
<tbody>
<tr><td><b>50/30/20</b></td><td>50 % necesidades, 30 % deseos, 20 % ahorro y pago extra de deudas (Warren y Warren Tyagi, 2005)</td><td>Quien quiere una regla simple de proporciones</td></tr>
<tr><td><b>Base cero</b></td><td>Se asigna cada peso del ingreso a una categoría hasta que ingreso − asignaciones = 0</td><td>Quien quiere control fino o tiene metas exigentes</td></tr>
<tr><td><b>Sobres</b></td><td>Dinero separado por categoría, en efectivo o en «bolsillos» digitales; cuando el sobre se acaba, se acaba</td><td>Quien se desborda en categorías variables</td></tr>
<tr><td><b>Págate primero</b></td><td>Ahorro automático el día de pago; el resto se gasta libremente sin registrar cada peso</td><td>Quien ya tiene hábitos sanos y detesta los detalles</td></tr>
</tbody></table></div>
<p>La regla 50/30/20 se diseñó en Estados Unidos. En Colombia, con salarios más bajos frente al costo de la vivienda y la comida, las necesidades suelen pasar de 60 % o 70 %. Insistir en el 50 % lleva a abandonar el presupuesto. Es más útil fijar primero la proporción de ahorro (aunque empiece en 5 % o 10 %) y ajustar las demás.</p>
<div class="sim" data-sim="presupuesto" data-title="Su presupuesto frente a la regla 50/30/20"></div>
<div class="sim-guide"><ul>
<li>El ejemplo es un hogar con ingreso neto de $4,5 millones. Las necesidades se llevan 75 %, los deseos 20 % y el ahorro solo 5 %: un caso muy común.</li>
<li>Mueva las categorías hasta que el ahorro llegue al menos a 10 %. ¿De dónde sale más fácil? Casi siempre de las categorías variables (domicilios, compras) y no de las fijas.</li>
<li>Las necesidades fijas altas (arriendo, cuotas) solo se reducen con decisiones grandes: mudarse, refinanciar o vender el carro. Por eso conviene pensarlas bien antes de asumirlas.</li>
</ul></div>
</section>

<section>
<h2>Los gastos que llegan una vez al año</h2>
<p>El SOAT, el impuesto predial, la matrícula, los útiles escolares, el mantenimiento del carro, las vacaciones y los regalos de diciembre no son imprevistos: se sabe que vendrán, solo que no cada mes. Quien no los <span class="term">prorratea</span> los vive como emergencias y los paga con tarjeta. La solución profesional es sumarlos, dividir entre doce y separar esa cuota cada mes en una cuenta o bolsillo aparte:</p>
<div class="eq key" data-name="Provisión mensual">\[\text{provisión mensual}=\frac{\sum \text{gastos periódicos del año}}{12} .\]</div>
<div class="box co"><p>En Colombia los trabajadores con contrato reciben una <b>prima de servicios</b> de un mes de salario al año, pagada en dos mitades, en junio y en diciembre, y sus <b>cesantías</b> se consignan en un fondo en febrero. La «cuesta de enero» (matrículas, útiles, impuestos y deudas de diciembre) es predecible. Asignar la prima de diciembre desde antes a los gastos de enero, y no a más compras de fin de año, es uno de los cambios con mayor efecto en las finanzas de muchas familias.</p></div>
<div class="sim" data-sim="prorrateo" data-title="El año mes a mes: con y sin provisión para gastos periódicos"></div>
<div class="sim-guide"><ul>
<li>Las barras muestran el saldo disponible al final de cada mes. Sin provisión, enero y febrero caen en rojo aunque el año completo cuadre.</li>
<li>Active la provisión: cada mes se separa la doceava parte y los meses difíciles se pagan con lo apartado. El total del año es el mismo; desaparecen los huecos.</li>
<li>Use la prima de junio y diciembre de dos formas: gastarla en el mes en que llega o enviarla a la provisión. Compare los resultados.</li>
</ul></div>
</section>

<section>
<h2>Gastos hormiga</h2>
<p>Un café de $6.000, un snack de $4.000, un domicilio, una suscripción que no se usa: los <span class="term">gastos hormiga</span> son pequeños, frecuentes y casi invisibles. Sumados durante años y con su costo de oportunidad, pueden ser enormes.</p>
<div class="sim" data-sim="hormiga" data-title="Lo que cuesta un gasto pequeño repetido"></div>
<div class="sim-guide"><ul>
<li>$12.000 al día, cinco días a la semana, son unos $3,1 millones al año. Invertidos al 5 % real durante 20 años serían cerca de $105 millones de hoy.</li>
<li>Mire también el costo en horas de vida con el salario real por hora del capítulo 1.</li>
<li>Esto no significa que haya que eliminar el café. Significa elegirlo a conciencia: si da bienestar real, se conserva (capítulo 4); si es costumbre sin placer, se corta.</li>
</ul></div>
<div class="box evid"><p>El «efecto latte», la idea de que basta dejar el café para hacerse rico, ha sido criticado con razón: para la mayoría de los hogares, las decisiones grandes (vivienda, carro, deudas, tasa de ahorro) pesan mucho más que los cafés. La lección útil de los gastos hormiga es otra: lo que no se mira crece sin control. El registro de 30 días los saca a la luz, y entonces cada uno decide.</p></div>
</section>

<section>
<h2>Presupuesto en pareja y en familia</h2>
<p>El dinero es una de las causas más frecuentes de conflicto en las parejas. Hay tres sistemas comunes, y ninguno es mejor en abstracto: <b>todo junto</b> (una sola bolsa), <b>todo separado</b> (cada uno paga cosas distintas) y <b>proporcional</b> (una cuenta común a la que cada uno aporta según su ingreso, más dinero personal para cada uno). Lo que sí predice problemas es no hablarlo. La cita semanal con el dinero del capítulo 5, hecha en pareja, convierte el tema en rutina. Con los hijos, involucrarlos según su edad en decisiones reales (el mercado, las vacaciones) es la mejor educación financiera que existe.</p>
<div class="box teach"><p><b>Presupuesto con fichas.</b> Entregue a cada grupo 45 fichas que representan un ingreso de $4,5 millones (cada ficha vale $100.000) y una lista de gastos de un hogar ficticio. El grupo debe repartir las fichas en sobres de papel por categoría. Después, saque al azar «tarjetas de evento» (SOAT, matrícula, el carro se varó, prima de diciembre) y observe cómo reaccionan los grupos con y sin sobre de provisión. Es un juego de 40 minutos que deja la idea de provisión para siempre.</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>Un presupuesto es un plan de gasto hecho antes de que llegue el dinero. Vale más cuando el dinero es justo.</li>
<li>Métodos: 50/30/20, base cero, sobres, pagarse primero. El mejor es el que se sostiene; en Colombia conviene adaptar las proporciones.</li>
<li>Los gastos periódicos no son imprevistos: se prorratean y se apartan cada mes. La prima de diciembre puede financiar la cuesta de enero.</li>
<li>Los gastos hormiga importan menos que las decisiones grandes, pero sumados son significativos. Se eligen a conciencia, no por inercia.</li>
<li>En pareja, el sistema importa menos que conversar con regularidad.</li>
</ul></div>
<div class="box do"><ul>
<li>Liste sus gastos periódicos del último año, súmelos y divida entre doce. Abra un bolsillo o cuenta para esa provisión.</li>
<li>Haga su presupuesto del próximo mes con la simulación 12.1 o en una hoja de cálculo.</li>
<li>Elija un gasto hormiga y decida, a conciencia, si se queda o se va.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Con un ingreso neto de $3.200.000, ¿cuánto corresponde a cada parte de la regla 50/30/20?
<details><summary>Respuesta</summary><p>Necesidades $1.600.000, deseos $960.000, ahorro y deudas $640.000.</p></details></li>
<li><span class="lvl">Básico</span>Gastos periódicos al año: SOAT $480.000, predial $900.000, matrícula $1.800.000, regalos $1.000.000, vacaciones $1.500.000. ¿Cuál es la provisión mensual?
<details><summary>Respuesta</summary><p>Suma: $5.680.000. Provisión: $473.333 al mes.</p></details></li>
<li><span class="lvl">Intermedio</span>Un domicilio de $35.000 dos veces por semana. ¿Cuánto cuesta al año? ¿Cuántas horas de vida, si el salario real es $12.000 por hora?
<details><summary>Respuesta</summary><p>\(35.000\times2\times52=\) $3.640.000 al año, unas 303 horas de vida: casi dos meses de trabajo.</p></details></li>
<li><span class="lvl">Intermedio</span>Explique por qué un hogar que «cuadra» en el año puede necesitar crédito en enero.
<details><summary>Respuesta</summary><p>Porque los gastos periódicos se concentran en ciertos meses y el ingreso llega parejo. Sin provisión, los meses con gastos acumulados (enero y febrero) tienen déficit aunque el año completo tenga superávit. El problema es de flujo, no de nivel.</p></details></li>
<li><span class="lvl">Avanzado</span>Un gasto diario \(g\) durante 260 días al año, invertido al final de cada año a la tasa real \(r\), ¿cuánto suma en \(n\) años? Aplíquelo a $12.000, 5 % y 20 años.
<details><summary>Respuesta</summary><p>\(\VF=260g\,\frac{(1+r)^n-1}{r}\). Con los datos: \(3.120.000\times33{,}07\approx\) $103 millones. La simulación da un poco más ($105,5 millones) porque invierte mes a mes.</p></details></li>
</ol>
