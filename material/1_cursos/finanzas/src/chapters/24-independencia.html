<template class="chapter-src" data-id="independencia" data-num="24" data-title="Independencia financiera: la matemática de la tasa de ahorro" data-part="Parte V · El largo plazo y el criterio profesional" data-short="Qué es la independencia financiera; los años necesarios dependen de la tasa de ahorro; el gasto pesa doble; independencia por inercia y parcial; críticas y matices; el dinero para decir que no">
<p class="lead">La independencia financiera es el punto en que los rendimientos del patrimonio pueden cubrir el gasto, de modo que trabajar se vuelve una elección y no una obligación. Suena a privilegio de pocos, pero su matemática tiene una sorpresa: los años que faltan para llegar dependen casi solo de la tasa de ahorro, no del nivel de ingreso. Este capítulo deduce esa relación, muestra por qué recortar gastos pesa doble y discute con honestidad los límites del movimiento que la popularizó.</p>

<section>
<h2>Qué es la independencia financiera</h2>
<p>Con la regla del capítulo 23, una persona es financieramente independiente cuando su patrimonio invertido \(W\) alcanza para financiar su gasto anual \(G\) con una tasa de retiro prudente \(w\):</p>
<div class="eq key" data-name="Condición de independencia">\[W\ \ge\ \frac{G}{w}\qquad(w=4\,\%\Rightarrow W\ge25\,G) .\]</div>
<p>El movimiento FIRE (por sus siglas en inglés: independencia financiera, retiro temprano), inspirado en <i>La bolsa o la vida</i> de Robin y Dominguez y popularizado en blogs desde 2010, propone llegar a ese punto mucho antes de la edad de pensión ahorrando una fracción alta del ingreso.</p>
</section>

<section>
<h2>Solo importa la tasa de ahorro</h2>
<p>Supongamos que una persona ahorra una fracción \(s\) de su ingreso \(Y\), gasta el resto, \((1-s)Y\), invierte con rentabilidad real \(r\) y quiere mantener el mismo gasto cuando sea independiente. Midiendo todo en múltiplos del ingreso, la meta es \((1-s)/w\) y el ahorro anual es \(s\). Con la anualidad del capítulo 6:</p>
<div class="eq key" data-name="Años hasta la independencia">\[s\,\frac{(1+r)^{n}-1}{r}=\frac{1-s}{w}\qquad\Longrightarrow\qquad n=\frac{\ln\!\Big(1+\dfrac{r\,(1-s)}{s\,w}\Big)}{\ln(1+r)} .\]</div>
<p>El ingreso \(Y\) desaparece de la ecuación. Quien gana $2 millones y ahorra 30 % tarda lo mismo que quien gana $20 millones y ahorra 30 %. Con 5 % real y retiro de 4 %:</p>
<div class="tablewrap narrow"><table>
<thead><tr><th>Tasa de ahorro</th><th>Años hasta la independencia</th></tr></thead>
<tbody>
<tr><td class="num">10 %</td><td class="num">51</td></tr>
<tr><td class="num">20 %</td><td class="num">37</td></tr>
<tr><td class="num">30 %</td><td class="num">28</td></tr>
<tr><td class="num">40 %</td><td class="num">22</td></tr>
<tr><td class="num">50 %</td><td class="num">17</td></tr>
<tr><td class="num">60 %</td><td class="num">12</td></tr>
<tr><td class="num">70 %</td><td class="num">9</td></tr>
</tbody></table></div>
<div class="sim" data-sim="anos-fi" data-title="Años hasta la independencia financiera según la tasa de ahorro"></div>
<div class="sim-guide"><ul>
<li>La curva baja muy rápido al principio: pasar de 10 % a 20 % de ahorro le quita casi 15 años al camino; de 50 % a 60 %, unos 4.</li>
<li>Baje la tasa de retiro a 3,5 % (más prudente para retiros largos): la meta sube, y el camino se alarga 2 a 3 años en la zona media.</li>
<li>Agregue patrimonio inicial: quien ya tiene algo ahorrado empieza más adelante en la curva.</li>
</ul></div>
</section>

<section>
<h2>El gasto pesa doble</h2>
<p>Un peso menos de gasto hace dos cosas a la vez: aumenta el ahorro de hoy y reduce el capital que se necesitará mañana, porque el estilo de vida que hay que financiar es más barato. Un peso más de ingreso, si el gasto no cambia, solo hace lo primero.</p>
<div class="sim" data-sim="gasto-doble" data-title="Subir el ingreso 10 % o bajar el gasto 10 %"></div>
<div class="sim-guide"><ul>
<li>Con ingreso de $5 millones y gasto de $4 millones (ahorro de 20 %), la independencia está a unos 37 años.</li>
<li>Subir el ingreso 10 % sin subir el gasto la acerca a 30 años. Bajar el gasto 10 % la acerca a 29,5 años, con un esfuerzo en pesos menor ($400.000 frente a $500.000).</li>
<li>Pero si el aumento de ingreso se gasta, como suele pasar por la adaptación hedónica del capítulo 4, la fecha no se mueve. La clave es la brecha entre ingreso y gasto.</li>
</ul></div>
</section>

<section>
<h2>Independencia por inercia y parcial</h2>
<p>No hace falta llegar al 100 % para ganar libertad. Dos metas intermedias muy útiles:</p>
<ul>
<li><b>Independencia por inercia</b> (<i>Coast FI</i>): tener ya ahorrado lo suficiente para que, sin aportar más, el dinero llegue solo a la meta de retiro. Desde ese momento, el trabajo solo tiene que cubrir los gastos corrientes, lo que permite trabajar menos o en algo peor pagado pero más satisfactorio.</li>
<li><b>Independencia parcial</b>: que las rentas cubran una parte del gasto (por ejemplo, la vivienda y la comida). Reduce la dependencia del empleo y da margen para cambiar de rumbo.</li>
</ul>
<div class="eq">\[W_{\text{inercia}}=\frac{G/w}{(1+r)^{n}}\qquad\text{(con }n\text{ años hasta la edad de retiro deseada)} .\]</div>
<div class="sim" data-sim="coast-fi" data-title="¿Cuánto hace falta hoy para llegar por inercia?"></div>
<div class="sim-guide"><ul>
<li>Para una meta de retiro de $1.000 millones de hoy dentro de 25 años, con 5 % real, bastan unos $295 millones ahorrados hoy.</li>
<li>La curva muestra cómo cae el capital necesario cuanto más lejos está la fecha: el tiempo trabaja por quien empieza temprano (capítulo 6).</li>
<li>Compare con su ahorro actual: la diferencia es lo que falta para poder dejar de aportar.</li>
</ul></div>
</section>

<section>
<h2>Críticas y matices</h2>
<p>Un profesional serio también señala los límites:</p>
<ul>
<li><b>Retiros muy largos</b>: un retiro de 50 años exige tasas de retiro de 3 % a 3,5 %, no 4 % (capítulo 23).</li>
<li><b>Salud y longevidad</b>: los gastos médicos crecen con la edad y un retiro temprano puede quedar sin pensión ni cobertura completa.</li>
<li><b>No todos pueden</b>: con ingresos bajos, ahorrar 50 % es imposible sin sacrificar necesidades. La fórmula dice que el ingreso no importa, pero en la práctica la tasa de ahorro alcanzable sí depende del ingreso.</li>
<li><b>Bienestar</b>: una frugalidad extrema puede costar más bienestar del que da la libertad futura (capítulo 4). El equilibrio importa.</li>
<li><b>Riesgo de país y de moneda</b>: los cálculos usan rentabilidades reales de largo plazo que no están garantizadas, menos aún en mercados pequeños.</li>
</ul>
<div class="box myth">
<p class="m"><b>Mito</b>«La independencia financiera es para los que ganan mucho».</p>
<p class="r"><b>Realidad</b>La matemática dice que depende de la tasa de ahorro, no del ingreso. Es más fácil ahorrar una fracción alta con un ingreso alto, pero muchas personas de ingreso alto nunca llegan, porque gastan casi todo, y algunas de ingreso medio sí, porque mantienen una brecha amplia durante años. Más útil que la meta extrema es la idea de fondo: cada punto de ahorro compra tiempo libre futuro.</p>
</div>
<div class="box explain"><p>Antes que retirarse a los 40, para la mayoría la independencia financiera significa algo más modesto y valioso: tener <b>dinero para decir que no</b>. No a un jefe abusivo, no a un negocio que no convence, no a un préstamo caro. Ese margen cambia la calidad de las decisiones mucho antes de llegar a la meta completa.</p></div>
<div class="box teach"><p><b>Taller de la tasa de ahorro.</b> Muestre la tabla de años según la tasa de ahorro y pida a cada estudiante que estime (en privado) su tasa actual y la que podría lograr con dos cambios concretos. Luego, en la curva de la simulación 24.1, que ubique cuántos años de libertad compraría ese cambio. Es una manera poderosa de mostrar que pequeños puntos de ahorro tienen consecuencias grandes.</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>Independencia financiera: patrimonio ≥ gasto anual / tasa de retiro (25 veces el gasto con 4 %).</li>
<li>Los años necesarios dependen de la tasa de ahorro, no del ingreso: \(n=\ln\!\big(1+\frac{r(1-s)}{sw}\big)/\ln(1+r)\).</li>
<li>Bajar el gasto pesa doble: más ahorro hoy y menor meta mañana.</li>
<li>Metas intermedias: independencia por inercia y parcial.</li>
<li>Límites: retiros largos, salud, ingresos bajos, bienestar presente y riesgo de mercado. La idea de fondo es comprar opciones y libertad.</li>
</ul></div>
<div class="box do"><ul>
<li>Calcule su tasa de ahorro real: ahorro mensual total (incluidos aportes voluntarios) dividido entre ingreso neto.</li>
<li>Ubíquese en la curva 24.1 y defina cuántos puntos quiere subir este año.</li>
<li>Calcule su meta de independencia parcial: ¿qué gasto le gustaría que cubrieran sus rentas primero?</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Una persona gasta $4.000.000 al mes. ¿Cuál es su número de independencia con 4 % y con 3,5 %?
<details><summary>Respuesta</summary><p>Gasto anual: $48 millones. Con 4 %: $1.200 millones. Con 3,5 %: unos $1.371 millones.</p></details></li>
<li><span class="lvl">Básico</span>¿Cuántos años tarda alguien que ahorra 25 % con 5 % real y retiro de 4 %?
<details><summary>Respuesta</summary><p>\(n=\ln(1+0{,}05\times0{,}75/(0{,}25\times0{,}04))/\ln1{,}05=\ln(4{,}75)/0{,}0488\approx31{,}9\) años.</p></details></li>
<li><span class="lvl">Intermedio</span>Muestre que si \(r=0\), \(n=(1-s)/(s\,w)\). ¿Cuánto da con \(s=50\,\%\) y \(w=4\,\%\)?
<details><summary>Respuesta</summary><p>Sin rendimientos, la meta \((1-s)/w\) se alcanza ahorrando \(s\) por año: \(n=(1-s)/(sw)\). Con 50 % y 4 %: 25 años, frente a 16,6 con 5 % real. Los rendimientos ahorran casi 9 años.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Por qué el ingreso no aparece en la fórmula de los años?
<details><summary>Respuesta</summary><p>Porque el ahorro anual (\(sY\)) y la meta (\((1-s)Y/w\)) son ambos proporcionales al ingreso \(Y\): al igualarlos, \(Y\) se cancela. Lo que importa es qué fracción se ahorra y qué fracción se necesita financiar.</p></details></li>
<li><span class="lvl">Avanzado</span>Con un patrimonio inicial \(W_0\) (en múltiplos del ingreso anual), deduzca la fórmula general de los años hasta la independencia.
<details><summary>Respuesta</summary><p>\(W_0(1+r)^n+s\frac{(1+r)^n-1}{r}=\frac{1-s}{w}\Rightarrow(1+r)^n=\frac{(1-s)/w+s/r}{W_0+s/r}\Rightarrow n=\ln\!\Big(\frac{(1-s)/w+s/r}{W_0+s/r}\Big)/\ln(1+r)\). Es la función que usa la simulación 24.1.</p></details></li>
</ol>
