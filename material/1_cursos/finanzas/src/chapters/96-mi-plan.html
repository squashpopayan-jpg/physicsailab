<p class="lead">Este apéndice convierte el curso en un plan propio. La hoja de trabajo sigue los siete pasos del capítulo 22: registra la situación, calcula el diagnóstico, propone el orden de prioridades, calcula la cuota de cada meta y termina con un resumen de una página para copiar. Viene con los datos de un hogar de ejemplo. Reemplácelos por los suyos.</p>

<section>
<h2>Antes de empezar</h2>
<ul>
<li>Use cifras mensuales y en pesos de hoy. Una estimación honesta es mejor que una cifra perfecta que nunca se termina.</li>
<li>Los datos se guardan solo en este navegador y en este dispositivo. No se envían a ningún lado, y nadie más los ve. Si usa un computador compartido, bórrelos al terminar.</li>
<li>Si el curso se usa en clase, cada estudiante puede llenar la hoja en su propio celular. El docente no necesita ver las cifras: basta con discutir el proceso y las decisiones.</li>
</ul>
</section>

<section>
<h2>La hoja de trabajo</h2>
<div class="sim" data-sim="mi-plan" data-title="Mi plan financiero"></div>
<div class="box note"><p>La hoja aplica reglas generales del curso (capítulos 11, 13, 14, 22 y 23). No reemplaza la asesoría de un profesional que conozca toda su situación, en especial para impuestos, pensiones y seguros.</p></div>
</section>

<section>
<h2>Cómo seguir</h2>
<ol>
<li>Copie el resumen y guárdelo donde lo vea: una nota del celular, un correo a usted mismo, una hoja impresa en la nevera.</li>
<li>Haga hoy el primer paso que escribió. Si es automatizar algo, mejor.</li>
<li>Agende la revisión en su calendario. En la revisión, vuelva a esta hoja, actualice las cifras y compare los indicadores.</li>
</ol>
</section>
