<p class="lead">Antes de cambiar la relación con el dinero conviene saber qué es. Este capítulo separa tres ideas que se confunden a diario: dinero, ingreso y riqueza. La riqueza resulta ser un nivel que sube o baja según la diferencia entre lo que entra y lo que sale, como el agua en una bañera. Y el precio de las cosas se puede medir en lo que realmente cuestan: horas de la propia vida.</p>

<section>
<h2>Qué es el dinero</h2>
<p>El dinero es una herramienta social con tres funciones. Es <span class="term">medio de cambio</span>: permite comprar sin trueque. Es <span class="term">unidad de cuenta</span>: todos los precios se expresan en pesos y así se pueden comparar. Y es <span class="term">depósito de valor</span>: permite guardar hoy poder de compra para usarlo después. La tercera función es la más frágil, porque la inflación (capítulo 8) erosiona lo que se guarda.</p>
<div class="box def"><p><b>Dinero fiduciario.</b> Un billete de $50.000 no está respaldado por oro ni por ningún bien. Vale porque la ley lo establece como medio de pago y porque todos confiamos en que otros lo aceptarán. La mayor parte del dinero, sin embargo, no son billetes: son saldos en cuentas bancarias, que los bancos crean cuando otorgan créditos.</p></div>
<p>Que el dinero sea un acuerdo no lo hace imaginario ni despreciable. Lo que sí implica es que el dinero en sí no es la meta. Es un medio para conseguir seguridad, tiempo, salud, experiencias, oportunidades para los hijos y libertad para decir que no. Cuando una persona aclara para qué quiere el dinero, empieza a tomar mejores decisiones con él. Ese es el cambio de percepción que sí produce resultados, y el capítulo 2 lo trabaja a fondo.</p>
<div class="box co"><p>El <b>Banco de la República</b> es el banco central de Colombia. La Constitución de 1991 (artículos 371 a 373) le encarga mantener el poder adquisitivo de la moneda. Para eso fija la tasa de interés de política monetaria con una meta de inflación del 3 % anual. Es el único que emite billetes y monedas. Los bancos comerciales, vigilados por la Superintendencia Financiera, administran los depósitos y otorgan los créditos.</p></div>
</section>

<section>
<h2>Ingreso no es riqueza: flujos y nivel</h2>
<p>Ingreso y gasto son <span class="term">flujos</span>: se miden en pesos por mes. El patrimonio es un <span class="term">nivel</span> (los físicos dicen «una variable de estado»): se mide en pesos en un instante. La relación entre ellos es la misma que entre el caudal de una llave y el nivel del agua en una bañera.</p>
<div class="box def"><p><b>Patrimonio (riqueza neta).</b> Es todo lo que una persona tiene menos todo lo que debe: \(W=\text{Activos}-\text{Pasivos}\). Un carro de $60 millones con un crédito de $55 millones aporta solo $5 millones al patrimonio.</p></div>
<p>Si \(W\) es el patrimonio, \(I\) el ingreso, \(G\) el gasto y \(r\) la rentabilidad de lo ahorrado, el patrimonio cambia según</p>
<div class="eq key" data-name="Ecuación de la bañera">\[\frac{\dd W}{\dd t}=\underbrace{I-G}_{\text{ahorro}}+\underbrace{r\,W}_{\text{rendimiento}} ,\qquad\text{o mes a mes}\qquad W_{k+1}=W_k\,(1+r_m)+I_k-G_k .\]</div>
<p>Tres consecuencias saltan a la vista. Un ingreso alto no garantiza nada: si \(G=I\), el patrimonio no crece, gane uno 2 o 20 millones al mes. El término \(rW\) es pequeño al comienzo y domina al final: los primeros años la bañera se llena casi solo con ahorro, y después el rendimiento aporta más que la llave. Y si \(G>I\), la bañera se vacía y, cuando llega al fondo, sigue bajando en forma de deuda. Entonces el término \(rW\) cambia de signo y trabaja en contra.</p>
<div class="sim" data-sim="banera" data-title="La bañera del patrimonio: ingreso, gasto y rendimiento"></div>
<div class="sim-guide"><ul>
<li>Con los valores iniciales (ingreso de $3,5 millones y gasto de $3,1 millones), el ahorro de $400.000 mensuales parece poco. Mire cuánto hay a los 30 años y qué parte vino del rendimiento.</li>
<li>Suba el ingreso a $6 millones y el gasto a $5,9 millones: se gana más y se acumula menos. El nivel depende de la diferencia, no del tamaño de los flujos.</li>
<li>Ponga el gasto por encima del ingreso: la bañera se vacía, aparece deuda (en rojo) y el rendimiento se vuelve costo. Con una tasa de 2 % mensual, típica de una tarjeta de crédito, la caída se acelera.</li>
<li>Con rentabilidad 0 % la curva es una recta. Con 6 % se curva hacia arriba: esa curvatura es el interés compuesto del capítulo 6.</li>
</ul></div>
<div class="box myth">
<p class="m"><b>Mito</b>«Cuando gane más, voy a poder ahorrar».</p>
<p class="r"><b>Realidad</b>Los gastos tienden a crecer al ritmo del ingreso. Los economistas lo llaman inflación del estilo de vida y los psicólogos, adaptación hedónica (capítulo 4). Quien no ahorra con un ingreso bajo rara vez empieza a hacerlo con uno alto, salvo que cambie el sistema y no la cifra: ahorro automático apenas llega el pago (capítulo 5). El estudio clásico de Stanley y Danko con millonarios estadounidenses encontró muchos hogares de ingreso alto y patrimonio bajo, y muchos de ingreso medio que acumularon riqueza gastando por debajo de sus posibilidades durante décadas.</p>
</div>
</section>

<section>
<h2>El precio de las cosas en horas de vida</h2>
<p>Vicki Robin y Joe Dominguez propusieron en 1992 un ejercicio que cambia la manera de ver los precios. Uno no cambia su tiempo por el salario que aparece en el contrato. Lo cambia por lo que queda después de descontar lo que cuesta trabajar, y dedica al trabajo más horas que las de la jornada.</p>
<div class="eq key" data-name="Salario real por hora">\[\text{salario real por hora}=\frac{\text{ingreso neto}-\text{costos de trabajar}}{\text{horas de trabajo}+\text{horas de desplazamiento y preparación}} .\]</div>
<div class="box ex"><p>Ana gana $3.500.000 de salario. Le descuentan 8 % de salud y pensión y recibe $3.220.000. Gasta $250.000 en transporte, $300.000 en almuerzos fuera de casa y $80.000 en ropa para el trabajo, así que le quedan $2.590.000. Trabaja 48 horas a la semana (unas 208 al mes) y gasta dos horas diarias en desplazarse, 44 horas más. Su salario real es \(2.590.000/252\approx\) $10.300 por hora, no los $16.800 que sugiere dividir el salario entre las horas de contrato. Un celular de $1.200.000 le cuesta unas 117 horas: más de dos semanas de su vida laboral, contando los trayectos.</p></div>
<div class="sim" data-sim="horas-vida" data-title="¿Cuántas horas de vida cuesta?"></div>
<div class="sim-guide"><ul>
<li>Escriba su salario y sus costos reales de trabajar. La diferencia entre el salario «de contrato» por hora y el real suele sorprender.</li>
<li>Cambie el precio del artículo por algo que esté pensando comprar. La pregunta no es si es caro, sino si vale esas horas.</li>
<li>Aumente las horas de desplazamiento: un trabajo mejor pagado pero lejano puede pagar menos por hora real.</li>
</ul></div>
<div class="box explain"><p>Antes de una compra grande, traduzca el precio a horas: «estos tenis me cuestan 34 horas de trabajo». No es para sentir culpa, es para decidir con una unidad que uno siente. Muchas compras siguen valiendo la pena. Otras se caen solas cuando se miran en horas.</p></div>
</section>

<section>
<h2>Cuatro destinos para cada peso</h2>
<p>Un profesional financiero ve cada peso que entra con cuatro destinos posibles, y el orden importa:</p>
<ol>
<li><b>Proteger</b>: cubrir los riesgos que podrían arruinar todo lo demás. Fondo de emergencia, seguros indispensables, salud (capítulo 13).</li>
<li><b>Gastar</b> en lo necesario y en lo que de verdad aporta bienestar (capítulos 4 y 12).</li>
<li><b>Ahorrar</b>: no gastar hoy. Es una decisión de conducta.</li>
<li><b>Invertir</b>: poner el ahorro a trabajar aceptando riesgo para que crezca más que la inflación. Es una decisión técnica (parte IV).</li>
</ol>
<p>Ahorrar e invertir no son lo mismo. Se puede ahorrar mucho e invertir mal (todo en una cuenta que pierde contra la inflación o en un negocio que no se entiende). Y no se puede invertir lo que no se ahorró. Por eso este curso empieza por la conducta y deja la inversión para la parte IV.</p>
</section>

<section>
<h2>¿Cuánto sabemos? Las tres preguntas</h2>
<p>Annamaria Lusardi y Olivia Mitchell diseñaron tres preguntas para medir la cultura financiera básica: interés compuesto, inflación y diversificación. Se usan en encuestas de decenas de países. Respóndalas antes de seguir; las dos últimas son adicionales.</p>
<div class="sim" data-sim="tres-preguntas" data-title="Prueba rápida: las tres preguntas de Lusardi y Mitchell (más dos)"></div>
<div class="box evid"><p>En la encuesta estadounidense de salud y retiro de 2004, con adultos mayores de 50 años, solo alrededor de un tercio respondió bien las tres preguntas (Lusardi y Mitchell, 2011). En la encuesta mundial S&amp;P Global FinLit de 2014, con unos 150.000 adultos de más de 140 países, apenas uno de cada tres resultó tener cultura financiera básica. Saber estas respuestas no hace rico a nadie, pero no saberlas sale caro: quienes fallan tienden a planear menos el retiro, a endeudarse a tasas más altas y a pagar más comisiones.</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>El dinero es un acuerdo social con tres funciones: medio de cambio, unidad de cuenta y depósito de valor. La última es la que la inflación ataca.</li>
<li>Ingreso y gasto son flujos; el patrimonio (activos menos pasivos) es un nivel. El nivel depende de la diferencia entre los flujos, no de su tamaño.</li>
<li>\(\dd W/\dd t=I-G+rW\): al principio la riqueza crece por el ahorro y después por el rendimiento. Con deudas, el rendimiento juega en contra.</li>
<li>El salario real por hora descuenta los costos y las horas que exige trabajar. Medir precios en horas de vida aclara decisiones.</li>
<li>Cada peso puede proteger, gastarse, ahorrarse o invertirse. Ahorrar es conducta; invertir es técnica.</li>
</ul></div>
<div class="box do"><ul>
<li>Calcule su salario real por hora con la simulación 1.2 y anótelo en un lugar visible.</li>
<li>Traduzca a horas las tres compras más grandes del último mes. ¿Volvería a hacerlas?</li>
<li>Escriba en una frase para qué quiere el dinero. La retomará en el capítulo 2.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Carlos tiene un apartamento de $250 millones con una hipoteca de $180 millones, un carro de $45 millones con un crédito de $30 millones, $6 millones en ahorros y una tarjeta con saldo de $4 millones. ¿Cuál es su patrimonio?
<details><summary>Respuesta</summary><p>Activos: 250 + 45 + 6 = $301 millones. Pasivos: 180 + 30 + 4 = $214 millones. Patrimonio: $87 millones. Aunque «tiene» cosas por $301 millones, su riqueza neta es menos de un tercio de eso.</p></details></li>
<li><span class="lvl">Básico</span>Laura gana $8 millones y gasta $7,9 millones. Mateo gana $2,5 millones y gasta $2 millones. Sin rendimientos, ¿cuánto patrimonio acumula cada uno en 10 años?
<details><summary>Respuesta</summary><p>Laura ahorra $100.000 al mes: $12 millones en 10 años. Mateo ahorra $500.000: $60 millones. Mateo gana menos de un tercio que Laura y acumula cinco veces más.</p></details></li>
<li><span class="lvl">Intermedio</span>Un trabajo paga $4.000.000 a 15 minutos de casa; otro paga $4.600.000 a 1 hora y 15 minutos de cada trayecto, con $350.000 más de transporte. Ambos son de 44 horas semanales y 22 días al mes. Compare el salario real por hora (ignore los descuentos de nómina).
<details><summary>Respuesta</summary><p>Horas al mes: unas 191 de trabajo. Primero: 191 + 11 de desplazamiento = 202 horas; $4.000.000/202 ≈ $19.800 por hora. Segundo: 191 + 55 = 246 horas; ($4.600.000 − $350.000)/246 ≈ $17.300 por hora. El trabajo que paga más paga menos por hora de vida.</p></details></li>
<li><span class="lvl">Intermedio</span>Con la ecuación mes a mes, una persona sin patrimonio ahorra $500.000 mensuales con una rentabilidad de 0,5 % mensual. ¿Cuánto tiene al final del primer, segundo y tercer mes? ¿Qué parte del saldo del tercer mes es rendimiento?
<details><summary>Respuesta</summary><p>Mes 1: $500.000. Mes 2: 500.000 × 1,005 + 500.000 = $1.002.500. Mes 3: 1.002.500 × 1,005 + 500.000 = $1.507.512,50. El rendimiento acumulado es $7.512,50: muy poco al comienzo, como predice la ecuación de la bañera.</p></details></li>
<li><span class="lvl">Avanzado</span>Resuelva \(\dd W/\dd t=A+rW\) con \(W(0)=0\), donde \(A=I-G\) es constante. Interprete el resultado cuando \(rt\) es pequeño y cuando es grande.
<details><summary>Respuesta</summary><p>\(W(t)=\frac{A}{r}\big(\ee^{rt}-1\big)\). Si \(rt\ll1\), \(\ee^{rt}-1\approx rt\) y \(W\approx At\): crecimiento lineal por ahorro. Si \(rt\gg1\), \(W\approx\frac{A}{r}\ee^{rt}\): crecimiento exponencial dominado por el rendimiento.</p></details></li>
</ol>
<div class="box teach"><p><b>Actividad de 20 minutos: «la bañera en el tablero».</b> Dibuje una bañera con una llave (ingreso), un desagüe (gasto) y una segunda llave pequeña (rendimiento). Pida a cada estudiante que estime sus flujos mensuales en papel, sin compartirlos, y que calcule cuánto subiría o bajaría su bañera en un año. Cierre con la pregunta: «¿qué es más fácil de mover este mes: la llave o el desagüe?». Evite pedir cifras personales en voz alta. En muchos grupos hay realidades económicas difíciles, y el ejercicio funciona igual en privado.</p></div>
