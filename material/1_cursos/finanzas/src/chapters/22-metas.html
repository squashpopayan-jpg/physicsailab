<p class="lead">Todo lo anterior converge aquí. Un plan financiero no es una hoja de cálculo complicada: es una lista corta de metas con fecha y costo, un orden para atenderlas y un sistema para ahorrar hacia cada una con el instrumento adecuado a su plazo. Este capítulo presenta el proceso que siguen los planificadores certificados, enseña a calcular cuánto ahorrar para una meta y con qué probabilidad se alcanza, y propone un orden de prioridades que funciona para la mayoría de los hogares.</p>

<section>
<h2>El proceso profesional en siete pasos</h2>
<p>El CFP Board, la entidad que certifica a los planificadores financieros en Estados Unidos, describe la práctica profesional en siete pasos. Sirven igual para planificar las finanzas propias:</p>
<ol>
<li><b>Entender la situación</b>: el diagnóstico del capítulo 11, junto con los valores, prioridades y preocupaciones de la persona.</li>
<li><b>Identificar y seleccionar metas</b>: concretas, con fecha y costo.</li>
<li><b>Analizar</b> el rumbo actual y las alternativas: ¿adónde lleva seguir igual?</li>
<li><b>Desarrollar recomendaciones</b>: qué cambiar, en qué orden.</li>
<li><b>Presentarlas</b>: por escrito, con los supuestos explícitos.</li>
<li><b>Implementar</b>: automatizar, abrir cuentas, cambiar seguros, pagar deudas.</li>
<li><b>Monitorear y actualizar</b>: revisar al menos una vez al año y ante cambios de vida.</li>
</ol>
<p>El apéndice B es una hoja de trabajo que recorre estos pasos para escribir el plan propio.</p>
</section>

<section>
<h2>Metas que se pueden cumplir</h2>
<p>«Quiero tener más plata» no es una meta. «Tener $40 millones para la cuota inicial de un apartamento en 5 años» sí lo es. Una buena meta tiene cinco rasgos, que suelen resumirse con la sigla SMART en inglés: es <b>específica</b>, <b>medible</b>, <b>alcanzable</b>, <b>relevante</b> para la persona y tiene <b>fecha</b>.</p>
<p>Un detalle técnico importa mucho: las metas se expresan en <b>pesos de hoy</b> y se calculan con rentabilidades <b>reales</b>. Así no hay que adivinar la inflación: si la meta son $40 millones de hoy y el ahorro rinde 3 % real, la cuenta ya incluye que en 5 años esa misma cosa costará más en pesos corrientes. El aporte mensual calculado también está en pesos de hoy, y debería subir cada año con la inflación.</p>
<div class="box co"><p>Metas frecuentes en los hogares colombianos, con sus herramientas: <b>educación de los hijos</b> (ahorro programado en CDT o fondos según el plazo, y seguros educativos, cuyos costos conviene comparar con ahorrar por cuenta propia),<b>cuota inicial de vivienda</b> (AFC, FNA, cesantías, capítulo 21), <b>vehículo</b> (mejor ahorrado que financiado), <b>retiro</b> (pensión obligatoria más voluntaria, capítulo 23) y <b>emprendimiento</b> (con un colchón aparte y un plan de negocio con números).</p></div>
</section>

<section>
<h2>El orden de prioridades</h2>
<p>Cuando el dinero no alcanza para todo al mismo tiempo, que es lo normal, el orden importa. Una secuencia que funciona para la mayoría:</p>
<ol>
<li>Presupuesto con superávit: gastar menos de lo que entra (capítulo 12).</li>
<li>Colchón mínimo de un mes de gastos (capítulo 13).</li>
<li>Pagar las deudas caras: tarjetas, créditos de consumo, préstamos informales (capítulo 14).</li>
<li>Completar el colchón a 3 a 6 meses.</li>
<li>Proteger: seguros para los riesgos catastróficos (capítulo 13).</li>
<li>Retiro: aportes al sistema y ahorro voluntario (capítulo 23).</li>
<li>Metas de mediano plazo: vivienda, educación, vehículo.</li>
<li>Inversión de largo plazo adicional e independencia financiera (capítulo 24).</li>
</ol>
<div class="sim" data-sim="priorizar" data-title="Plan mes a mes: ¿cuándo se cumple cada etapa?"></div>
<div class="sim-guide"><ul>
<li>El excedente mensual se dirige a una etapa a la vez: primero el colchón mínimo, luego la deuda cara (que sigue cobrando intereses), luego el colchón completo y, por último, se reparte entre retiro y otras metas.</li>
<li>El ejemplo es el hogar del capítulo 11, con $600.000 de excedente al mes. Suba el excedente a $1.000.000: todas las etapas se adelantan y la deuda cuesta menos intereses.</li>
<li>Esta secuencia no es una ley. Si hay una oportunidad muy clara, o un subsidio que se pierde si no se aprovecha, conviene ajustarla. Pero sin un orden, el dinero se dispersa y ninguna meta avanza.</li>
</ul></div>
</section>

<section>
<h2>¿Cuánto ahorrar para una meta, y con qué probabilidad?</h2>
<p>Con la meta en pesos de hoy, la rentabilidad real esperada \(r\) y el plazo \(n\), la cuota sale de la anualidad del capítulo 9: <code class="f">=PAGO(tasa_mensual; meses; -ahorro_actual; meta)</code>. Pero esa cuota se calcula con la rentabilidad <i>esperada</i>, y la realidad tendrá altibajos. Si el instrumento es volátil, ahorrar exactamente esa cuota da una probabilidad cercana a 50 % de llegar a la meta.</p>
<div class="sim" data-sim="meta" data-title="Cuota necesaria para una meta y probabilidad de alcanzarla"></div>
<div class="sim-guide"><ul>
<li>El ejemplo: $40 millones de hoy en 5 años, con un instrumento que rinde 3 % real con 6 % de volatilidad. La cuota calculada es de unos $619.000 al mes, y con ella se llega en cerca de la mitad de los casos.</li>
<li>Suba la cuota hasta que la probabilidad llegue a 80 % o 90 %. Esa es la cuota de un plan prudente.</li>
<li>Pruebe un instrumento más volátil (acciones, 18 %) para una meta de 5 años: la rentabilidad esperada sube, pero la probabilidad de quedarse corto también puede subir. Por eso el horizonte manda en la elección del instrumento.</li>
</ul></div>
</section>

<section>
<h2>El instrumento según el horizonte</h2>
<p>La regla profesional es sencilla: el dinero que se necesita pronto no debe estar en activos que pueden caer mucho, y el dinero de largo plazo no debe quedarse en activos que pierden contra la inflación. Los datos históricos del capítulo 16 permiten ver por qué.</p>
<div class="sim" data-sim="cubetas" data-title="Probabilidad histórica de perder poder de compra según el horizonte"></div>
<div class="sim-guide"><ul>
<li>Para cada horizonte se calcula, con todas las ventanas de 1928 a 2025, qué fracción terminó con pérdida real y cuál fue la peor rentabilidad anualizada.</li>
<li>A un año, todo puede perder, y las acciones pueden caer 38 % real. A 15 años, el portafolio 60/40 y las acciones perdieron poder de compra en solo 6 % de las ventanas, mientras las letras y los bonos lo hicieron en más de un tercio.</li>
<li>De ahí las «cubetas»: hasta 2 años, liquidez; de 2 a 5, renta fija de corto plazo; más de 10, una mezcla con acciones.</li>
</ul></div>
<div class="tablewrap narrow"><table>
<thead><tr><th>Horizonte de la meta</th><th>Instrumentos típicos</th></tr></thead>
<tbody>
<tr><td>Menos de 2 años</td><td>Cuenta de ahorros, CDT cortos, FIC a la vista</td></tr>
<tr><td>2 a 5 años</td><td>Escaleras de CDT, FIC de renta fija de corto plazo, TES cortos</td></tr>
<tr><td>5 a 10 años</td><td>Mezcla de renta fija y acciones, con más renta fija al acercarse la fecha</td></tr>
<tr><td>Más de 10 años</td><td>Portafolio diversificado con proporción importante de acciones, local e internacional, a bajo costo</td></tr>
</tbody></table></div>
</section>

<section>
<h2>La revisión anual</h2>
<p>Un plan se desactualiza: cambian los ingresos, nacen hijos, se pierden empleos, suben las tasas. Una revisión anual de una o dos horas, idealmente en una fecha fija (por ejemplo, en enero o en el cumpleaños), mantiene el plan vivo:</p>
<ul>
<li>Actualizar el balance y los indicadores (capítulo 11).</li>
<li>Revisar el avance de cada meta y ajustar cuotas a la inflación.</li>
<li>Rebalancear las inversiones (capítulo 17).</li>
<li>Revisar seguros, beneficiarios y deudas.</li>
<li>Revisar comisiones y costos (capítulo 19).</li>
<li>Preguntarse si las metas siguen siendo las correctas.</li>
</ul>
<div class="box teach"><p><b>La carta al yo del futuro.</b> Al final de esta parte del curso, pida a cada participante que escriba una carta para sí mismo, para abrir dentro de un año, con tres metas concretas (monto, fecha, instrumento) y el primer paso de cada una. Si es posible, recójalas en sobres cerrados y devuélvalas al año. Es el ejercicio con el que muchos estudiantes dicen haber empezado de verdad.</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>El proceso profesional: entender, fijar metas, analizar, recomendar, presentar, implementar y revisar.</li>
<li>Metas específicas, medibles, alcanzables, relevantes y con fecha, en pesos de hoy y con rentabilidades reales.</li>
<li>Orden típico: superávit, colchón mínimo, deudas caras, colchón completo, seguros, retiro, metas de mediano plazo, inversión adicional.</li>
<li>La cuota calculada con la rentabilidad esperada da cerca de 50 % de probabilidad con instrumentos volátiles; un plan prudente ahorra algo más.</li>
<li>El instrumento se elige por el horizonte de la meta.</li>
<li>Revisar el plan al menos una vez al año.</li>
</ul></div>
<div class="box do"><ul>
<li>Escriba tres metas con monto en pesos de hoy, fecha e instrumento.</li>
<li>Calcule la cuota de cada una con la simulación 22.2 y súmelas. ¿Cabe en su excedente?</li>
<li>Agende su revisión anual en el calendario.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Meta: $24 millones de hoy en 3 años, con 2 % real anual y sin ahorro inicial. ¿Cuánto hay que ahorrar al mes?
<details><summary>Respuesta</summary><p>Tasa mensual: \(1{,}02^{1/12}-1\approx0{,}165\,\%\). Cuota: \(24.000.000\times0{,}00165/(1{,}00165^{36}-1)\approx\) $647.000 al mes, que debe ajustarse cada año con la inflación.</p></details></li>
<li><span class="lvl">Básico</span>¿Por qué no conviene ahorrar la cuota inicial de una vivienda para dentro de 2 años en un fondo de acciones?
<details><summary>Respuesta</summary><p>Porque en horizontes cortos las acciones pueden caer mucho (más de 20 % real en ventanas de 3 años en la historia), y la meta tiene fecha fija. El riesgo no tiene tiempo de compensarse.</p></details></li>
<li><span class="lvl">Intermedio</span>Un hogar tiene $3 millones de tarjeta al 2,3 % mensual, ningún colchón y $500.000 de excedente. Ordene sus siguientes pasos.
<details><summary>Respuesta</summary><p>1) Colchón mínimo de un mes de gastos, para no volver a usar la tarjeta. 2) Todo el excedente a la tarjeta hasta pagarla. 3) Completar el colchón a 3 meses. 4) Seguros y retiro. 5) Metas de mediano plazo.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Por qué se recomienda expresar las metas en pesos de hoy?
<details><summary>Respuesta</summary><p>Porque así la meta conserva su significado (lo que se quiere comprar) y se calcula con rentabilidades reales, sin tener que pronosticar la inflación. Basta con ajustar el aporte cada año según la inflación.</p></details></li>
<li><span class="lvl">Avanzado</span>Si los rendimientos anuales son independientes con media real \(\mu\) y volatilidad \(\sigma\), ¿por qué la probabilidad de alcanzar una meta calculada con \(\mu\) es cercana a 50 %?
<details><summary>Respuesta</summary><p>Porque la cuota se calcula para que el saldo esperado iguale la meta. Si la distribución del saldo final es casi simétrica alrededor de su media (volatilidad moderada y plazo corto), la mitad de los escenarios queda arriba y la mitad abajo. Con más volatilidad o plazos largos, la distribución se sesga a la derecha, la mediana queda por debajo de la media y la probabilidad cae por debajo de 50 %.</p></details></li>
</ol>
