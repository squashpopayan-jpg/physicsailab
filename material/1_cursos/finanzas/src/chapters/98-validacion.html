<p class="lead">Las simulaciones del curso no usan ninguna biblioteca financiera: todas las funciones (valor futuro, cuota, TIR, tablas de amortización, estadísticas históricas, regla del 4 %, impuestos) están escritas desde cero. Para confiar en ellas, cada una se compara aquí con una implementación independiente o con una identidad matemática exacta. Las pruebas se pueden ejecutar en el navegador.</p>

<section>
<h2>Cómo se valida</h2>
<p>Un programa en Python (<code>tests/referencias.py</code>) calcula los mismos casos con herramientas independientes, y sus resultados se incrustan en el curso:</p>
<ul>
<li><strong>numpy-financial</strong>, que usa las mismas convenciones de Excel: VF, VA, PAGO, NPER, TASA, VNA, TIR y la descomposición de cada cuota en interés y abono a capital.</li>
<li><strong>SciPy</strong>: raíces de ecuaciones (prima máxima de un seguro, ganancia mínima de la teoría prospectiva, años hasta la independencia), optimización (peso de mínima varianza, fracción de Kelly) y la distribución normal.</li>
<li><strong>La hoja original de Damodaran</strong> (enero de 2026), leída de nuevo con pandas sin pasar por los datos del curso: medias aritméticas y geométricas, volatilidad, caída máxima, correlación y la tasa de éxito histórica de la regla del 4 %.</li>
<li><strong>Simulaciones independientes en Python</strong>: pago mínimo de una tarjeta, avalancha y bola de nieve con cuatro deudas.</li>
<li><strong>Identidades exactas</strong>: un bono con rendimiento igual al cupón vale su nominal; un crédito sin abonos extraordinarios coincide con el de cuota fija; la UVR sin inflación coincide con el crédito en pesos; la contabilidad de un esquema Ponzi cuadra; la tabla de renta es continua salvo por los redondeos de la ley.</li>
</ul>
<div class="box note"><p>Fuera del navegador, <code>node tests/validar.js</code> ejecuta las mismas pruebas y escribe <code>docs/VALIDACION.md</code>. Si se actualizan las fuentes, <code>python tests/datos.py</code> regenera los datos históricos y <code>python tests/referencias.py</code> las referencias.</p></div>
</section>
