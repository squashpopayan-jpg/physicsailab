<template class="chapter-src" data-id="deudas" data-num="14" data-title="Deudas: usarlas bien y salir de ellas" data-part="Parte III · La economía del hogar" data-short="Deuda productiva y de consumo; cuánta deuda es sana; la tarjeta de crédito, diferir a cuotas y el pago mínimo; avalancha frente a bola de nieve; centrales de riesgo y habeas data; gota a gota y otras trampas">
<p class="lead">La deuda no es buena ni mala: es una forma de traer al presente un dinero del futuro, a cambio de un precio. Ese precio puede valer la pena (una vivienda, una carrera, un negocio con números claros) o puede convertirse en una carga que se come el ingreso durante años. Este capítulo enseña a distinguir, a entender cómo cobra intereses una tarjeta de crédito en Colombia y a salir de las deudas con un método, con la matemática y la psicología de su lado.</p>

<section>
<h2>Deuda productiva y deuda de consumo</h2>
<p>Una deuda es <span class="term">productiva</span> cuando financia algo que, con razonable probabilidad, vale más de lo que cuesta: una vivienda a una tasa sensata que reemplaza un arriendo, una formación que aumenta los ingresos (capítulo 15), un negocio con flujos que superan las cuotas. Es <span class="term">de consumo</span> cuando financia algo que se usa y desaparece o pierde valor: vacaciones, ropa, celulares, celebraciones. La deuda de consumo no está prohibida, pero equivale a pagar más por las mismas cosas: un viaje de $3 millones diferido a 24 cuotas al 2,1 % mensual cuesta cerca de $3,8 millones.</p>
<div class="box myth">
<p class="m"><b>Mito</b>«Hay que endeudarse para tener historial crediticio».</p>
<p class="r"><b>Realidad</b>El historial se construye pagando a tiempo, no debiendo mucho. Una tarjeta usada para compras normales y pagada completa cada mes, sin intereses, construye un historial excelente. Endeudarse a cuotas solo para «tener vida crediticia» es pagar intereses sin necesidad.</p>
</div>
<p>Las referencias de salud del capítulo 11 aplican aquí: la suma de cuotas no debería pasar de 30 % del ingreso neto, y la deuda de consumo cara debería tender a cero.</p>
</section>

<section>
<h2>La tarjeta de crédito, sin misterio</h2>
<p>La tarjeta tiene un <b>cupo</b>, una <b>fecha de corte</b> (cuando se cierran las compras del periodo) y una <b>fecha límite de pago</b>. En Colombia, al comprar se elige el número de cuotas. La mayoría de las tarjetas amortizan con <b>abono constante a capital</b> (capítulo 10): cada mes se paga la parte del capital de cada compra más los intereses sobre el saldo pendiente. Muchas no cobran interés en las compras a una cuota si se paga el total a tiempo. Los <b>avances</b> en efectivo generan intereses desde el primer día y suelen tener una comisión.</p>
<div class="sim" data-sim="pago-minimo" data-title="Diferir a cuotas y pagar el mínimo: el costo del tiempo"></div>
<div class="sim-guide"><ul>
<li>A la izquierda, una compra de $3 millones al 2,1 % mensual. A 6 cuotas paga unos $220.000 de intereses; a 36 cuotas, $1,17 millones, casi 40 % de la compra.</li>
<li>A la derecha, una deuda que solo se paga con un mínimo porcentual. Con 5 % de mínimo tarda 63 meses y paga $1,7 millones de intereses. Con 3 %, tarda más de 14 años y los intereses superan los $5 millones.</li>
<li>La regla práctica: si no puede pagar algo en una o pocas cuotas, probablemente no puede pagarlo.</li>
</ul></div>
<div class="box explain"><p>La tarjeta es una herramienta excelente para pagar, no para financiarse. Quien la usa como medio de pago y paga el total cada mes recibe 30 a 50 días de crédito gratis, a veces con puntos o devoluciones. Quien la usa para financiarse paga una de las tasas más altas del mercado.</p></div>
</section>

<section>
<h2>Cómo salir de las deudas</h2>
<p>El método profesional tiene cuatro pasos:</p>
<ol>
<li><b>Inventario</b>: listar todas las deudas con saldo, tasa (en E.A.) y cuota mínima.</li>
<li><b>Parar la hemorragia</b>: no tomar deuda nueva, guardar las tarjetas en un cajón y tener un colchón mínimo para no volver a usarlas ante el primer imprevisto.</li>
<li><b>Fijar un presupuesto mensual para deudas</b> por encima de la suma de los mínimos.</li>
<li><b>Elegir un orden</b> para el excedente: la deuda de mayor tasa primero (<span class="term">avalancha</span>) o la de menor saldo primero (<span class="term">bola de nieve</span>). Cuando una deuda se termina, su cuota pasa a la siguiente.</li>
</ol>
<p>La avalancha es la que matemáticamente paga menos intereses. La bola de nieve da victorias tempranas: cerrar una cuenta pronto motiva a seguir.</p>
<div class="box evid"><p>Gal y McShane (2012) analizaron miles de personas en un programa de pago de deudas y encontraron que quienes cerraban más cuentas pequeñas al principio tenían más probabilidad de eliminar toda la deuda, aunque eso no fuera lo óptimo en intereses. Kettle y otros (2016) encontraron que concentrar los pagos en una sola cuenta, en lugar de repartirlos, aumenta la sensación de progreso y la motivación. La psicología cuenta: el mejor método es el que se termina.</p></div>
<div class="sim" data-sim="avalancha-bola" data-title="Avalancha, bola de nieve o solo mínimos: cuatro deudas, un presupuesto"></div>
<div class="sim-guide"><ul>
<li>El ejemplo tiene cuatro deudas (dos tarjetas, una libranza y un crédito de almacén) y $1.000.000 al mes para pagarlas.</li>
<li>Con solo pagos mínimos tarda 41 meses y paga unos $6 millones de intereses. Con avalancha o bola de nieve, 18 meses y unos $2,5 millones. La diferencia entre las dos estrategias es pequeña (unos $60.000). La diferencia contra no tener estrategia es enorme.</li>
<li>Mire en qué mes se cierra cada deuda: la bola de nieve cierra la segunda cuenta en el mes 4, la avalancha en el mes 10. Si eso le da impulso, vale los $60.000.</li>
</ul></div>
<div class="box co"><p><b>Opciones colombianas cuando la deuda desborda.</b> La <b>compra de cartera</b> permite trasladar deudas caras a otra entidad con menor tasa; conviene si la tasa nueva es menor y no se vuelve a usar el cupo liberado. Las <b>libranzas</b> (descuento por nómina) suelen tener tasas más bajas, pero comprometen el salario. Los fondos de empleados y las cooperativas ofrecen crédito más barato a sus asociados. Para situaciones graves, la <b>insolvencia de persona natural no comerciante</b> (Código General del Proceso, Ley 1564 de 2012) permite negociar con todos los acreedores a la vez ante un centro de conciliación o una notaría.</p></div>
</section>

<section>
<h2>Centrales de riesgo y habeas data</h2>
<p>Las entidades reportan el comportamiento de pago a las centrales de información, como DataCrédito Experian y TransUnion. Ese historial determina si a una persona le prestan y a qué tasa. Los derechos del titular están en la Ley 1266 de 2008, modificada por la Ley 2157 de 2021 («borrón y cuenta nueva»):</p>
<ul>
<li>Antes de un reporte negativo, la entidad debe avisarle al deudor y darle un plazo para pagar o aclarar.</li>
<li>Después de pagar, la información negativa permanece un tiempo igual al doble de la mora, con un máximo de cuatro años desde el pago.</li>
<li>El titular puede consultar su historial gratis, y pedir que se corrija lo que esté errado.</li>
</ul>
<p>Pagar a tiempo y mantener la carga de deuda baja es lo que mejora el puntaje. Ninguna empresa puede «limpiar» un reporte verdadero a cambio de dinero: esas ofertas son estafas.</p>
</section>

<section>
<h2>Gota a gota y otras trampas</h2>
<p>El préstamo «gota a gota» es crédito informal e ilegal: se recibe el dinero sin trámites y se paga en cuotas diarias, con un recargo típico de 20 % al mes. Como las cuotas empiezan al día siguiente, el costo efectivo es mucho mayor que 20 % mensual. Además, el cobro suele ir acompañado de intimidación y violencia.</p>
<div class="sim" data-sim="gota-a-gota" data-title="El mismo millón prestado de cuatro maneras"></div>
<div class="sim-guide"><ul>
<li>Un millón «al 20 %» pagado en 30 cuotas diarias de $40.000 tiene una tasa diaria de 1,22 %, que equivale a 44 % mensual y a más de 8.000 % efectivo anual.</li>
<li>Compare con un avance de tarjeta, un crédito de cooperativa o de fondo de empleados, y la tasa de usura.</li>
<li>El costo no es solo financiero. Tener a mano un colchón y una línea de crédito formal, decidida con calma (capítulo 2), es la verdadera defensa.</li>
</ul></div>
<div class="box warn"><p>También hay aplicaciones de préstamos rápidos que operan sin vigilancia de la Superintendencia Financiera, con cobros desproporcionados y acoso a los contactos del deudor. Antes de pedir un préstamo, verifique que la entidad esté vigilada (capítulo 25) y pida la tasa efectiva anual y el costo total por escrito.</p></div>
<div class="box teach"><p><b>Taller del inventario de deudas.</b> Entregue a cada grupo un caso ficticio con cinco deudas (tasas, saldos y mínimos) y un presupuesto mensual. Cada grupo elige una estrategia, calcula en la hoja de cálculo el mes en que cierra cada deuda y presenta. Después se comparan con la simulación 14.2. Discuta qué estrategia elegirían ellos y por qué: la respuesta revela mucho sobre la motivación de cada persona.</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>La deuda trae dinero del futuro a cambio de un precio. Es productiva si financia algo que vale más de lo que cuesta.</li>
<li>Las cuotas totales no deberían pasar de 30 % del ingreso neto, y la deuda de consumo cara debería tender a cero.</li>
<li>Diferir a muchas cuotas y pagar el mínimo multiplica los intereses. La tarjeta es para pagar, no para financiarse.</li>
<li>Salir de deudas: inventario, parar la hemorragia, presupuesto fijo y un orden (avalancha o bola de nieve). Cualquiera de las dos es mucho mejor que solo pagar mínimos.</li>
<li>Los reportes negativos permanecen el doble de la mora, con un máximo de cuatro años desde el pago (Ley 2157 de 2021).</li>
<li>El gota a gota cuesta miles por ciento al año. La defensa es el colchón y el crédito formal decidido con calma.</li>
</ul></div>
<div class="box do"><ul>
<li>Haga el inventario de sus deudas con tasa efectiva anual y mínimo de cada una.</li>
<li>Consulte gratis su historial en una central de riesgo y verifique que esté correcto.</li>
<li>Si tiene deudas caras, defina su presupuesto mensual para pagarlas y elija el orden.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Una compra de $1.200.000 se difiere a 12 cuotas al 2 % mensual con abono constante a capital. ¿Cuánto paga de intereses?
<details><summary>Respuesta</summary><p>\(i\,P\,(n+1)/2=0{,}02\times1.200.000\times13/2=\) $156.000.</p></details></li>
<li><span class="lvl">Básico</span>¿Por qué un avance de $500.000 por una semana puede ser más caro de lo que parece?
<details><summary>Respuesta</summary><p>Porque genera intereses desde el primer día y suele cobrar una comisión fija. Una comisión de $10.000 sobre $500.000 por una semana ya equivale a 2 % semanal, más del 180 % efectivo anual, antes de intereses.</p></details></li>
<li><span class="lvl">Intermedio</span>Tiene una tarjeta de $2.000.000 al 2,4 % mensual y un crédito de $8.000.000 al 1,2 % mensual. Le sobran $400.000 al mes después de los mínimos. ¿A cuál los dirige según cada estrategia?
<details><summary>Respuesta</summary><p>Ambas estrategias coinciden: la tarjeta tiene la tasa más alta y el saldo más pequeño. Cuando ambas reglas coinciden, la decisión es obvia.</p></details></li>
<li><span class="lvl">Intermedio</span>Un deudor pagó una mora de 8 meses. ¿Cuánto tiempo puede permanecer el reporte negativo?
<details><summary>Respuesta</summary><p>El doble de la mora: 16 meses desde el pago, por debajo del máximo de cuatro años.</p></details></li>
<li><span class="lvl">Avanzado</span>Muestre que una deuda nunca se termina de pagar con un mínimo porcentual \(q\) si \(q\le i/(1+i)\), sin piso fijo.
<details><summary>Respuesta</summary><p>Cada mes el saldo pasa de \(S\) a \(S(1+i)(1-q)\). Si \((1+i)(1-q)\ge1\), es decir \(q\le i/(1+i)\), el saldo no baja. Aun con \(q\) un poco mayor, el saldo baja geométricamente y nunca llega exactamente a cero: por eso los bancos fijan un piso mínimo en pesos.</p></details></li>
</ol>
