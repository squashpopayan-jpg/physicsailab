<template class="chapter-src" data-id="retiro" data-num="23" data-title="Pensión, retiro y la regla del 4 %" data-part="Parte V · El largo plazo y el criterio profesional" data-short="Los riesgos del retiro; el sistema pensional colombiano y la reforma; ahorro voluntario; la regla del 4 % con datos históricos; el riesgo de secuencia; rentas vitalicias; un ciclo de vida completo simulado">
<p class="lead">El retiro es la meta financiera más grande y la más lejana, y por eso la más fácil de postergar. Tiene riesgos propios: vivir más de lo previsto, que la inflación erosione los ingresos, que los mercados caigan justo al comenzar y que la salud cueste más. Este capítulo explica cómo funciona el sistema pensional colombiano, qué cambia con la reforma y cuánto capital hace falta para complementar la pensión. Responde esa última pregunta con 98 años de datos reales.</p>

<section>
<h2>Los riesgos del retiro</h2>
<ul>
<li><b>Longevidad</b>: no se sabe cuántos años durará el retiro. Planear con la esperanza de vida promedio implica una probabilidad cercana a 50 % de vivir más que eso.</li>
<li><b>Inflación</b>: en 25 años de retiro, con 4 % de inflación, los precios se multiplican por 2,7.</li>
<li><b>Mercado y secuencia</b>: una caída fuerte en los primeros años de retiro, cuando se está retirando dinero, hace mucho más daño que la misma caída años después.</li>
<li><b>Salud</b>: los gastos médicos suelen crecer con la edad.</li>
</ul>
<p>Una medida útil es la <span class="term">tasa de reemplazo</span>: la pensión como porcentaje del ingreso antes de retirarse. Muchos planificadores sugieren apuntar a 70 % u 80 % del ingreso previo, entre la pensión y el ahorro propio, aunque el número correcto depende del estilo de vida que se quiera mantener.</p>
</section>

<section>
<h2>El sistema pensional colombiano</h2>
<div class="box co"><p><b>Hoy (octubre de 2026).</b> Los trabajadores dependientes aportan 16 % de su salario a pensión: 12 % lo paga el empleador y 4 % el trabajador, más un aporte adicional al Fondo de Solidaridad Pensional desde 4 salarios mínimos. Existen dos regímenes. En el de <b>prima media</b>, administrado por Colpensiones, la pensión se calcula como un porcentaje del salario promedio de los últimos años y exige edad (57 años las mujeres, 62 los hombres) y un número mínimo de semanas: 1.300 para los hombres y, para las mujeres, 1.250 en 2026, con una reducción gradual hasta 1.000 en 2036, ordenada por la Corte Constitucional (sentencias C-197 de 2023 y C-054 de 2024). En el de <b>ahorro individual</b>, administrado por los fondos privados, la pensión depende del saldo acumulado en la cuenta de cada persona y sus rendimientos, y hay una garantía de pensión mínima para quien cumpla la edad y 1.150 semanas. En ambos, la pensión mínima es de un salario mínimo. Para personas de bajos ingresos existen los BEPS y el programa Colombia Mayor.</p>
<p><b>La reforma.</b> La Ley 2381 de 2024 reorganiza el sistema en pilares: uno solidario, uno semicontributivo, uno contributivo (en el que los aportes hasta un umbral de salarios mínimos irían a Colpensiones y el excedente a una cuenta individual) y uno voluntario. A octubre de 2026 la Corte Constitucional avaló la mayor parte de la ley (agosto de 2026), devolvió algunos artículos al Congreso para corregir su trámite y fijó su entrada en vigencia para el 1 de abril de 2027; Colpensiones pidió aplazarla. La ley está aprobada pero no vigente. Verifique su situación antes de tomar decisiones, en especial antes de un traslado de régimen, que exige asesoría previa.</p></div>
<p>El punto práctico, con o sin reforma, es que la pensión obligatoria reemplaza solo una parte del ingreso, especialmente para quien gana más de unos pocos salarios mínimos, para quien tiene lagunas de cotización y para los independientes. El resto debe venir de ahorro propio.</p>
</section>

<section>
<h2>El ahorro voluntario</h2>
<p>Los <b>fondos de pensiones voluntarias</b> y las <b>cuentas AFC</b> permiten ahorrar con beneficios tributarios: los aportes pueden ser renta exenta dentro de topes (capítulo 15) si se cumplen requisitos de permanencia o de uso, por ejemplo para vivienda en el caso de las AFC. Más allá del beneficio tributario, lo importante es lo de siempre: comisiones bajas, un portafolio acorde al horizonte y aportes automáticos.</p>
</section>

<section>
<h2>¿Cuánto capital hace falta? La regla del 4 %</h2>
<p>En 1994, el planificador William Bengen se preguntó cuál era la mayor tasa de retiro inicial, ajustada luego cada año por inflación, que habría sobrevivido 30 años en cualquier periodo de la historia de Estados Unidos desde 1926. Encontró que alrededor de 4 % del capital inicial. En 1998, el llamado «estudio Trinity» (Cooley, Hubbard y Walz) lo confirmó con tasas de éxito. De ahí sale la regla práctica: el capital necesario es cerca de <b>25 veces el gasto anual</b> que debe cubrir el ahorro.</p>
<div class="eq key" data-name="Capital necesario">\[W_0\approx\frac{\text{gasto anual a cubrir}}{w}\qquad (w=4\,\%\ \Rightarrow\ W_0\approx25\times\text{gasto anual}) .\]</div>
<div class="box ex"><p>Una persona espera una pensión de $2.000.000 al mes y quiere gastar $3.500.000. El ahorro debe cubrir $1.500.000 al mes, $18 millones al año. Con 4 %, necesita unos \(18/0{,}04=\) $450 millones de hoy al retirarse. Con 3,5 %, más prudente para retiros largos, unos $514 millones.</p></div>
<div class="sim" data-sim="regla-4" data-title="¿Habría alcanzado el dinero? Todos los retiros desde 1928"></div>
<div class="sim-guide"><ul>
<li>Cada barra es un retiro que empieza en un año distinto, con la tasa y la mezcla elegidas, y muestra el capital real al final. En rojo, los retiros en los que el dinero se agotó.</li>
<li>Con 4 % y 60 % en acciones durante 30 años, el dinero alcanzó en 94 % de los casos. Fallaron quienes se retiraron a mediados de los sesenta, justo antes de una década de inflación alta y bolsa estancada.</li>
<li>Extienda el retiro a 40 años: con 4 %, el éxito baja a 85 %; con 3,5 %, sube a 98 %. Para quien se retira joven o espera vivir mucho, la tasa prudente es menor.</li>
<li>Pruebe 0 % en acciones: con solo bonos, el dinero se agota en muchos más casos. Para un retiro largo hace falta una parte en activos que le ganen a la inflación.</li>
</ul></div>
<div class="box warn"><p>La regla del 4 % viene de datos de Estados Unidos, un mercado excepcional (capítulo 16). No incluye comisiones (1 % anual de costos equivale a restarle mucho a la tasa sostenible) ni impuestos, y supone 30 años. Para Colombia, con otra moneda, otro mercado y retiros que pueden durar más, conviene usarla como orden de magnitud y ser más prudente: 3 % a 3,5 %, o retiros flexibles que bajen en los años malos.</p></div>
</section>

<section>
<h2>El riesgo de secuencia</h2>
<p>Mientras se ahorra, el orden de las rentabilidades no importa: el resultado final es el producto de todos los factores \((1+R_k)\), que no depende del orden. Cuando se está retirando dinero, sí importa. Si los años malos llegan al comienzo, se venden activos baratos para vivir y quedan menos activos para la recuperación.</p>
<div class="sim" data-sim="secuencia" data-title="Las mismas rentabilidades en distinto orden"></div>
<div class="sim-guide"><ul>
<li>Se toman las rentabilidades reales de un portafolio 60/40 durante 30 años a partir del año elegido, y se aplican en su orden y en orden inverso, con el mismo retiro anual.</li>
<li>Desde 1966, en el orden real, el dinero se agota en el año 21. Con las mismas rentabilidades en orden inverso, termina con 1,4 veces el capital inicial. La rentabilidad promedio es idéntica.</li>
<li>Defensas: un colchón de uno o dos años de gastos en activos líquidos, retiros flexibles en los años malos y una mezcla menos riesgosa en los primeros años del retiro.</li>
</ul></div>
</section>

<section>
<h2>Rentas vitalicias</h2>
<p>Una <span class="term">renta vitalicia</span> convierte un capital en un ingreso mensual de por vida, pagado por una aseguradora. Es un seguro contra la longevidad: si la persona vive hasta los 100 años, la aseguradora sigue pagando. A cambio, el capital ya no se hereda (salvo pactos especiales) y se pierde flexibilidad. En el régimen de ahorro individual colombiano es una de las modalidades de pensión, junto con el retiro programado. Para muchas personas, combinar una base de ingreso vitalicio (pensión o renta) con un portafolio flexible es la estructura más robusta.</p>
</section>

<section>
<h2>Un ciclo de vida completo</h2>
<div class="sim" data-sim="ciclo-vida" data-title="Del primer ahorro a los 95 años: probabilidad de que el dinero alcance"></div>
<div class="sim-guide"><ul>
<li>Se simulan 2.000 vidas: se ahorra hasta la edad de retiro y después se retira lo necesario para completar el gasto deseado con la pensión. Todo en pesos de hoy.</li>
<li>Con 35 años, $20 millones ahorrados, $600.000 al mes, una pensión esperada de $2 millones y un gasto deseado de $3,5 millones, el dinero alcanza hasta los 95 años en cerca de 60 % de las vidas.</li>
<li>Pruebe tres palancas: ahorrar más, retirarse dos años después o gastar un poco menos. Retrasar el retiro suele ser la más poderosa, porque suma ahorro, suma rendimientos y resta años de gasto a la vez.</li>
</ul></div>
<div class="box teach"><p><b>La entrevista con el abuelo.</b> Pida a los estudiantes que entrevisten a una persona jubilada: ¿con qué vive?, ¿le alcanza?, ¿qué haría distinto? En clase, organicen las respuestas según los riesgos de este capítulo (longevidad, inflación, salud, falta de ahorro, lagunas de cotización). La conversación entre generaciones suele dejar más huella que cualquier cifra.</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>Riesgos del retiro: longevidad, inflación, mercado y secuencia, salud.</li>
<li>Hoy en Colombia conviven prima media (Colpensiones) y ahorro individual; la reforma de la Ley 2381 de 2024 está aprobada pero, a octubre de 2026, no vigente.</li>
<li>La pensión obligatoria cubre solo una parte; el resto exige ahorro voluntario, con comisiones bajas y aportes automáticos.</li>
<li>Regla del 4 %: capital ≈ 25 veces el gasto anual a cubrir. En los datos de Estados Unidos, 4 % con 60/40 alcanzó 30 años en 94 % de los casos; para retiros largos o fuera de ese mercado conviene 3 % a 3,5 %.</li>
<li>El riesgo de secuencia hace que las caídas al inicio del retiro sean las más dañinas.</li>
<li>Las rentas vitalicias aseguran contra la longevidad a cambio de flexibilidad.</li>
</ul></div>
<div class="box do"><ul>
<li>Pida su historia laboral a Colpensiones o a su fondo y verifique sus semanas cotizadas.</li>
<li>Estime su pensión y calcule cuánto debe cubrir con ahorro propio.</li>
<li>Calcule con la simulación 23.3 su probabilidad de que el dinero alcance, y elija una palanca para mejorarla.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Para cubrir $2.500.000 mensuales con ahorro propio y una tasa de retiro de 4 %, ¿qué capital se necesita?
<details><summary>Respuesta</summary><p>Gasto anual: $30 millones. Capital: \(30/0{,}04=\) $750 millones de hoy.</p></details></li>
<li><span class="lvl">Básico</span>¿Por qué el orden de las rentabilidades no importa mientras se ahorra una suma única, pero sí cuando se retira dinero?
<details><summary>Respuesta</summary><p>Con una suma única, el resultado es \(W_0\prod(1+R_k)\), que no depende del orden. Con retiros, cada retiro se hace sobre el saldo de ese momento; si el saldo está bajo por una caída temprana, se venden más unidades por cada peso retirado y quedan menos para la recuperación.</p></details></li>
<li><span class="lvl">Intermedio</span>Con 4 % de inflación, ¿cuánto costará en 25 años lo que hoy cuesta $3.500.000?
<details><summary>Respuesta</summary><p>\(3.500.000\times1{,}04^{25}\approx\) $9.330.000. Por eso los cálculos de retiro se hacen en pesos de hoy y con retiros ajustados por inflación.</p></details></li>
<li><span class="lvl">Intermedio</span>Si las comisiones del portafolio son 1 % anual, ¿qué pasa aproximadamente con la tasa de retiro sostenible del 4 %?
<details><summary>Respuesta</summary><p>La rentabilidad neta baja un punto cada año. Con los datos de 1928-2025, un 60/40 durante 30 años: retirando 4 % sin comisiones, el dinero alcanzó en 94 % de los casos; con 1 % de comisión, el éxito cae a 84 %, y para volver a 94 % hay que bajar el retiro a 3,5 %. Las comisiones pesan tanto en el retiro como en la acumulación.</p></details></li>
<li><span class="lvl">Avanzado</span>Con una rentabilidad real constante \(r\) y retiros constantes \(w\,W_0\) al inicio de cada año, ¿cuántos años dura el dinero? Aplíquelo a \(r=2\,\%\) y \(w=5\,\%\).
<details><summary>Respuesta</summary><p>El saldo sigue \(W_{k+1}=(W_k-wW_0)(1+r)\). Se agota cuando el valor presente de los retiros iguala el capital: \(w\sum_{k=0}^{n-1}(1+r)^{-k}=1\), es decir \(n=-\ln\!\big(1-\frac{r}{w(1+r)}\big)/\ln(1+r)\). Con 2 % y 5 %: \(n\approx-\ln(1-0{,}392)/0{,}0198\approx25{,}1\) años.</p></details></li>
</ol>
