<template class="chapter-src" data-id="formulario" data-num="A" data-title="Formulario y funciones de hoja de cálculo" data-part="Apéndices" data-short="Todas las fórmulas del curso en una página, las funciones equivalentes de Excel, Google Sheets y LibreOffice, y las cifras colombianas de referencia de 2026">
<p class="lead">Este apéndice reúne las fórmulas del curso con su capítulo de origen, las funciones de hoja de cálculo que las calculan y las cifras colombianas de referencia vigentes en octubre de 2026. Sirve como hoja de consulta para clase o para llevar impresa a una asesoría.</p>

<section>
<h2>Interés, tasas e inflación</h2>
<div class="tablewrap"><table>
<thead><tr><th>Concepto</th><th>Fórmula</th><th>Cap.</th></tr></thead>
<tbody>
<tr><td>Interés simple</td><td>\(\VF=\VP(1+i\,n)\)</td><td class="c">6</td></tr>
<tr><td>Interés compuesto</td><td>\(\VF=\VP(1+i)^n\)</td><td class="c">6</td></tr>
<tr><td>Tiempo de duplicación</td><td>\(n_2=\ln2/\ln(1+i)\approx72/(100\,i)\)</td><td class="c">6</td></tr>
<tr><td>Efectiva anual desde periódica</td><td>\(i_{\text{EA}}=(1+i_p)^m-1\)</td><td class="c">7</td></tr>
<tr><td>Periódica desde efectiva anual</td><td>\(i_p=(1+i_{\text{EA}})^{1/m}-1\)</td><td class="c">7</td></tr>
<tr><td>Nominal vencida a efectiva</td><td>\(i_{\text{EA}}=(1+j/m)^m-1\)</td><td class="c">7</td></tr>
<tr><td>Anticipada a vencida</td><td>\(i_v=i_a/(1-i_a)\)</td><td class="c">7</td></tr>
<tr><td>Tasa real (Fisher)</td><td>\(r=(1+i)/(1+\pi)-1\approx i-\pi\)</td><td class="c">7</td></tr>
<tr><td>Poder de compra tras \(n\) años</td><td>\(1/\prod_k(1+\pi_k)\)</td><td class="c">8</td></tr>
</tbody></table></div>
</section>

<section>
<h2>Valor del dinero en el tiempo y créditos</h2>
<div class="tablewrap"><table>
<thead><tr><th>Concepto</th><th>Fórmula</th><th>Cap.</th></tr></thead>
<tbody>
<tr><td>Valor presente</td><td>\(\VP=\VF/(1+i)^n\)</td><td class="c">9</td></tr>
<tr><td>Valor futuro de una anualidad vencida</td><td>\(\VF=A\,[(1+i)^n-1]/i\)</td><td class="c">6</td></tr>
<tr><td>Valor presente de una anualidad vencida</td><td>\(\VP=A\,[1-(1+i)^{-n}]/i\)</td><td class="c">9</td></tr>
<tr><td>Anualidad anticipada</td><td>multiplicar por \((1+i)\)</td><td class="c">6, 9</td></tr>
<tr><td>Perpetuidad y perpetuidad creciente</td><td>\(\VP=A/i\), \(\VP=A/(i-g)\)</td><td class="c">9</td></tr>
<tr><td>VPN y TIR</td><td>\(\VPN=\sum_t F_t/(1+i)^t\), \(\VPN(\TIR)=0\)</td><td class="c">9</td></tr>
<tr><td>Cuota fija</td><td>\(\text{cuota}=P\,i/[1-(1+i)^{-n}]\)</td><td class="c">10</td></tr>
<tr><td>Intereses con abono constante</td><td>\(i\,P\,(n+1)/2\)</td><td class="c">10</td></tr>
<tr><td>Interés y abono de cada cuota</td><td>\(\text{interés}_k=iS_{k-1}\), \(\text{abono}_k=\text{cuota}_k-\text{interés}_k\)</td><td class="c">10</td></tr>
</tbody></table></div>
</section>

<section>
<h2>Hogar, inversión y retiro</h2>
<div class="tablewrap"><table>
<thead><tr><th>Concepto</th><th>Fórmula</th><th>Cap.</th></tr></thead>
<tbody>
<tr><td>Patrimonio</td><td>\(W=\text{activos}-\text{pasivos}\)</td><td class="c">1, 11</td></tr>
<tr><td>Ecuación de la bañera</td><td>\(\dd W/\dd t=I-G+rW\)</td><td class="c">1</td></tr>
<tr><td>Tasa de ahorro, carga de deuda, colchón</td><td>ahorro/ingreso; cuotas/ingreso; líquidos/gasto mensual</td><td class="c">11</td></tr>
<tr><td>Patrimonio esperado (Stanley y Danko)</td><td>edad × ingreso anual / 10</td><td class="c">11</td></tr>
<tr><td>Equivalente cierto con utilidad logarítmica</td><td>\(\text{EC}=\exp\big(p\ln(W-X)+(1-p)\ln W\big)\)</td><td class="c">13</td></tr>
<tr><td>Rentabilidad total</td><td>\(R=(P_1-P_0+D)/P_0\)</td><td class="c">16</td></tr>
<tr><td>Media geométrica</td><td>\(g=\big(\prod(1+R_k)\big)^{1/n}-1\approx\mu-\sigma^2/2\)</td><td class="c">16</td></tr>
<tr><td>Portafolio de dos activos</td><td>\(\sigma_p^2=w^2\sigma_1^2+(1-w)^2\sigma_2^2+2w(1-w)\rho\sigma_1\sigma_2\)</td><td class="c">17</td></tr>
<tr><td>Diversificación con \(n\) activos</td><td>\(\sigma_p^2=\sigma^2/n+(1-1/n)\rho\sigma^2\)</td><td class="c">17</td></tr>
<tr><td>Precio de un bono y duración</td><td>\(P=\sum C/(1+y)^k+F/(1+y)^N\), \(\Delta P/P\approx-D_{\text{mod}}\Delta y\)</td><td class="c">18</td></tr>
<tr><td>Arrastre de las comisiones</td><td>\(W_n=W_0[(1+r)(1-f)]^n\)</td><td class="c">19</td></tr>
<tr><td>Años para distinguir habilidad</td><td>\(n\gt(1{,}96\,\sigma_{\text{TE}}/\alpha)^2\)</td><td class="c">19</td></tr>
<tr><td>Expectativa por operación</td><td>\(E=pb-(1-p)-c\)</td><td class="c">20</td></tr>
<tr><td>Kelly</td><td>\(f^*=p-(1-p)/b\)</td><td class="c">20</td></tr>
<tr><td>Capital para el retiro</td><td>\(W_0\approx\text{gasto anual}/w\)</td><td class="c">23</td></tr>
<tr><td>Años hasta la independencia</td><td>\(n=\ln\big(1+r(1-s)/(sw)\big)/\ln(1+r)\)</td><td class="c">24</td></tr>
<tr><td>Capital para llegar por inercia</td><td>\(W=(G/w)/(1+r)^n\)</td><td class="c">24</td></tr>
</tbody></table></div>
</section>

<section>
<h2>Funciones de hoja de cálculo</h2>
<p>Excel en español usa punto y coma para separar argumentos; Google Sheets y Excel en inglés usan coma. LibreOffice Calc admite los nombres en español. Convención de signos: el dinero que sale del bolsillo es negativo; <code class="f">tipo</code> = 0 para pagos al final del periodo y 1 al inicio.</p>
<div class="tablewrap"><table>
<thead><tr><th>Para calcular</th><th>Excel (español)</th><th>Inglés</th><th>Ejemplo</th></tr></thead>
<tbody>
<tr><td>Valor futuro</td><td><code class="f">VF(tasa;nper;pago;[va];[tipo])</code></td><td><code class="f">FV</code></td><td><code class="f">=VF(1%;120;-100000;-1000000)</code> → 26.304.256</td></tr>
<tr><td>Valor presente</td><td><code class="f">VA(tasa;nper;pago;[vf];[tipo])</code></td><td><code class="f">PV</code></td><td><code class="f">=VA(0,8%;60;-450000)</code> → 21.376.896</td></tr>
<tr><td>Cuota</td><td><code class="f">PAGO(tasa;nper;va;[vf];[tipo])</code></td><td><code class="f">PMT</code></td><td><code class="f">=PAGO(1,2%;48;25000000)</code> → −688.189</td></tr>
<tr><td>Número de periodos</td><td><code class="f">NPER(tasa;pago;va;[vf];[tipo])</code></td><td><code class="f">NPER</code></td><td><code class="f">=NPER(1,5%;-300000;5000000)</code> → 19,32</td></tr>
<tr><td>Tasa implícita</td><td><code class="f">TASA(nper;pago;va;[vf];[tipo])</code></td><td><code class="f">RATE</code></td><td><code class="f">=TASA(24;-520000;10000000)</code> → 1,854 %</td></tr>
<tr><td>Valor presente neto</td><td><code class="f">VNA(tasa;flujos_1_a_n)+flujo_0</code></td><td><code class="f">NPV</code></td><td><code class="f">=VNA(11%;B2:B6)+B1</code> → 2.187.833</td></tr>
<tr><td>Tasa interna de retorno</td><td><code class="f">TIR(flujos_0_a_n)</code></td><td><code class="f">IRR</code></td><td><code class="f">=TIR(B1:B6)</code> → 13,56 %</td></tr>
<tr><td>Nominal a efectiva</td><td><code class="f">INT.EFECTIVO(nominal;m)</code></td><td><code class="f">EFFECT</code></td><td><code class="f">=INT.EFECTIVO(24%;12)</code> → 26,82 %</td></tr>
<tr><td>Efectiva a nominal</td><td><code class="f">TASA.NOMINAL(efectiva;m)</code></td><td><code class="f">NOMINAL</code></td><td><code class="f">=TASA.NOMINAL(28,59%;12)</code> → 25,41 %</td></tr>
<tr><td>Interés de una cuota</td><td><code class="f">PAGOINT(tasa;per;nper;va)</code></td><td><code class="f">IPMT</code></td><td>tabla de amortización</td></tr>
<tr><td>Abono a capital de una cuota</td><td><code class="f">PAGOPRIN(tasa;per;nper;va)</code></td><td><code class="f">PPMT</code></td><td>tabla de amortización</td></tr>
</tbody></table></div>
<p>Los resultados de la columna de ejemplos coinciden con los de numpy-financial y con el núcleo de cálculo del curso (apéndice D).</p>
</section>
