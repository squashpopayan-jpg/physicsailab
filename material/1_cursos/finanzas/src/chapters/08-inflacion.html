<template class="chapter-src" data-id="inflacion" data-num="8" data-title="Inflación y poder adquisitivo" data-part="Parte II · Las matemáticas del dinero" data-short="Qué es y cómo se mide el IPC; historia de la inflación en Colombia desde 1960; el dinero guardado pierde; ilusión monetaria y salario real; el dólar y la paridad del poder adquisitivo; cómo protegerse">
<p class="lead">La inflación es un impuesto silencioso: nadie lo cobra en ventanilla, pero cada año se lleva una parte del poder de compra del dinero guardado. Este capítulo explica cómo se mide, recorre con datos reales los 65 años de inflación colombiana, muestra cuánto pierde el dinero quieto y por qué un aumento de sueldo puede ser una rebaja. También explica por qué el dólar sube a largo plazo y qué activos protegen.</p>

<section>
<h2>Qué es la inflación y cómo se mide</h2>
<p>La <span class="term">inflación</span> es el aumento sostenido y generalizado de los precios. En Colombia la mide el DANE con el <span class="term">índice de precios al consumidor</span> (IPC): el costo de una canasta de bienes y servicios que compran los hogares, con ponderaciones que reflejan cuánto pesa cada rubro en el gasto (alimentos, vivienda, transporte, educación, salud). La inflación anual es la variación porcentual del índice:</p>
<div class="eq key" data-name="Inflación">\[\pi_{t}=\frac{\text{IPC}_{t}}{\text{IPC}_{t-1}}-1,\qquad \text{poder de compra de }\$1\text{ tras }n\text{ años}=\frac{1}{\prod_{k=1}^{n}(1+\pi_k)} .\]</div>
<p>Hay dos maneras de reportar la inflación de un año, y conviene no confundirlas. La <b>anual a diciembre</b> compara el índice de diciembre con el de diciembre anterior; es la que anuncia el DANE en enero (5,1 % en 2025). La <b>promedio anual</b> compara el promedio de los doce meses con el del año anterior; es la que usan bases de datos internacionales como la del Banco Mundial (5,14 % en 2025). En años de cambios bruscos difieren bastante: en 2022 la primera fue 13,12 % y la segunda 10,18 %.</p>
<div class="box note"><p>Cada hogar tiene su propia inflación. Una familia que gasta mucho en alimentos sintió en 2022 una inflación mayor que el promedio, porque los alimentos subieron más que el resto. Un estudiante que paga matrícula siente la inflación de la educación (7,36 % en 2025). El IPC es un promedio útil, no una medida exacta para cada persona.</p></div>
</section>

<section>
<h2>Sesenta y cinco años de inflación en Colombia</h2>
<p>Colombia tuvo inflación de dos dígitos durante casi tres décadas. El pico fue 1977, con 33,8 % de inflación promedio. Desde la Constitución de 1991, que dio independencia al Banco de la República y le encargó proteger el poder adquisitivo, la inflación bajó hasta un dígito a finales de los noventa. En 2000 se adoptó formalmente el esquema de metas de inflación, con una meta de largo plazo del 3 %. La pandemia, la guerra en Ucrania y la depreciación del peso la llevaron otra vez por encima del 10 % en 2022 y 2023.</p>
<div class="sim" data-sim="historia-ipc" data-title="Inflación de Colombia 1960-2025 y lo que costaba cada cosa"></div>
<div class="sim-guide"><ul>
<li>Las barras son la inflación promedio de cada año (Banco Mundial, a partir de datos del DANE). Elija un año de partida para ver cuánto se multiplicaron los precios desde entonces.</li>
<li>Desde 1990 los precios se multiplicaron por cerca de 22: lo que costaba $1.000 cuesta unos $22.000. Desde 2000, por unos 3,5.</li>
<li>Active la tasa de cambio: el dólar pasó de unos $6,6 en 1960 a unos $4.053 en 2025 (promedio anual). La sección siguiente explica por qué ambas curvas se parecen tanto.</li>
</ul></div>
</section>

<section>
<h2>El dinero guardado pierde</h2>
<p>Con una inflación de 5 % anual, el poder de compra de un billete cae a la mitad en unos 14 años (regla del 72: \(72/5\)) y a 61 % en 10 años. Guardar efectivo debajo del colchón o en una cuenta que paga casi cero es una pérdida segura, aunque el saldo en pesos no cambie.</p>
<div class="sim" data-sim="colchon" data-title="$10 millones guardados de cuatro maneras: poder de compra real"></div>
<div class="sim-guide"><ul>
<li>Las curvas están en «pesos de hoy»: muestran qué se podría comprar con el saldo, descontada la inflación.</li>
<li>El efectivo pierde exactamente la inflación. La cuenta de ahorros con 1 % pierde un poco menos. El CDT al 9 % gana algo si la inflación es moderada.</li>
<li>Suba la inflación a 13 %, la de 2022: incluso el CDT pierde poder de compra.</li>
</ul></div>
<div class="box myth">
<p class="m"><b>Mito</b>«En el banco no pierdo plata; mi saldo sigue ahí».</p>
<p class="r"><b>Realidad</b>El saldo en pesos sigue ahí, pero lo que compra ese saldo no. Si la cuenta paga 1 % y la inflación es 5 %, cada año se pierde cerca de 4 % del poder de compra. Para un fondo de emergencia esa pérdida es el precio de la liquidez y vale la pena. Para el ahorro de largo plazo, no.</p>
</div>
</section>

<section>
<h2>Ilusión monetaria y salario real</h2>
<p>Las personas tienden a pensar en pesos corrientes y no en poder de compra. Shafir, Diamond y Tversky (1997) lo llamaron <span class="term">ilusión monetaria</span>. En uno de sus experimentos, la mayoría de las personas consideraba que alguien con un aumento de 5 % y una inflación de 4 % estaba más contento que alguien con un aumento de 2 % sin inflación, aunque reconocían que el segundo estaba mejor en términos económicos.</p>
<div class="eq">\[\text{aumento real}=\frac{1+\text{aumento nominal}}{1+\pi}-1 .\]</div>
<div class="box co"><p>El salario mínimo de 2026 es $1.750.905 (Decreto 1469 de 2025), 23 % más que el de 2025. Con una inflación de 5,1 % en 2025, el aumento real es \(1{,}23/1{,}051-1\approx17\,\%\), uno de los mayores de la historia. Muchos salarios por encima del mínimo, en cambio, se ajustan cerca de la inflación: su aumento real es casi cero aunque la cifra suba.</p></div>
<div class="sim" data-sim="salario-real" data-title="Aumentos de sueldo frente a inflación: el salario real año a año"></div>
<div class="sim-guide"><ul>
<li>La línea gris es el salario en pesos corrientes; la azul, el mismo salario en pesos del año inicial.</li>
<li>Si el aumento iguala la inflación, la línea azul queda plana: el sueldo «sube» pero compra lo mismo.</li>
<li>Pruebe aumentos de 1 punto por debajo de la inflación durante 10 años: el poder de compra cae casi 9 %, sin que la cifra del sueldo haya bajado nunca.</li>
</ul></div>
</section>

<section>
<h2>¿Por qué sube el dólar?</h2>
<p>La tasa de cambio se mueve todos los días por muchas razones: precios del petróleo, tasas de interés, confianza de los inversionistas, política. Pero a largo plazo hay una fuerza de fondo, la <span class="term">paridad del poder adquisitivo</span>. Si los precios en Colombia suben más rápido que en Estados Unidos, el peso tiende a perder valor frente al dólar en una proporción parecida.</p>
<div class="box ex"><p>Entre 2000 y 2025, según el Banco Mundial, los precios al consumidor en Colombia se multiplicaron por unos 3,55 y en Estados Unidos por unos 1,86. La paridad predice que el dólar se multiplicaría por \(3{,}55/1{,}86\approx1{,}91\). El dólar promedio pasó de unos $2.088 en 2000 a unos $4.053 en 2025, un factor de 1,94. En el camino hubo años de dólar a $1.800 y años a más de $4.800, pero la tendencia de 25 años la explicó casi toda la diferencia de inflación.</p></div>
<p>Para una familia, la consecuencia es que lo importado (tecnología, viajes, deudas en dólares, matrículas en el exterior) tiende a encarecerse con el tiempo. Tener una parte del ahorro de largo plazo en activos internacionales (capítulo 17) es una forma de diversificar ese riesgo, no una apuesta a que el dólar va a subir mañana.</p>
</section>

<section>
<h2>Cómo protegerse de la inflación</h2>
<ul>
<li><b>No guardar de más en efectivo.</b> Solo el fondo de emergencia necesita liquidez inmediata (capítulo 13).</li>
<li><b>Buscar tasas reales positivas</b> para el ahorro de mediano plazo: CDT, fondos de inversión colectiva conservadores o títulos atados a la inflación (TES en UVR).</li>
<li><b>Para el largo plazo, activos reales</b>: acciones y finca raíz han superado la inflación en periodos largos, con altibajos (capítulos 16 y 21).</li>
<li><b>Negociar el salario en términos reales</b>: un aumento igual a la inflación es mantenerse, no subir.</li>
<li><b>Deudas a tasa fija en pesos</b>: con inflación alta e inesperada, el deudor paga con pesos que valen menos. Es un efecto real, aunque los bancos lo anticipan en las tasas.</li>
</ul>
<div class="box co"><p>La <b>UVR</b> (unidad de valor real) es una unidad de cuenta que calcula el Banco de la República y que se ajusta cada día según la inflación. Se usa en créditos de vivienda (capítulo 10) y en los TES UVR, bonos del Gobierno cuyo capital crece con la inflación. Es la herramienta colombiana más directa para fijar valores en términos reales.</p></div>
<div class="box teach"><p><b>La caja de precios del abuelo.</b> Pida al grupo que pregunte en casa cuánto costaba un pasaje de bus, una gaseosa o el salario mínimo en el año en que nacieron sus padres. En clase, use la simulación 8.1 para «traer» esos precios a pesos de hoy y compare. Casi siempre aparecen sorpresas: algunas cosas se abarataron en términos reales (la tecnología) y otras se encarecieron (la educación, la vivienda en las ciudades).</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>La inflación se mide con el IPC del DANE. La cifra «a diciembre» y la «promedio anual» son distintas.</li>
<li>Colombia tuvo inflación de dos dígitos entre los años setenta y los noventa; desde 1991 el Banco de la República la redujo, con un repunte en 2022-2023.</li>
<li>El dinero quieto pierde la inflación: con 5 % anual, la mitad del poder de compra en unos 14 años.</li>
<li>Ilusión monetaria: un aumento nominal igual a la inflación no mejora nada.</li>
<li>A largo plazo, el dólar sube en proporción parecida a la diferencia de inflación entre Colombia y Estados Unidos.</li>
<li>Protección: liquidez solo la necesaria, tasas reales positivas, activos reales a largo plazo, UVR.</li>
</ul></div>
<div class="box do"><ul>
<li>Calcule cuánto poder de compra perdió su ahorro líquido el último año.</li>
<li>Calcule su aumento salarial real de los últimos tres años.</li>
<li>Decida cuánto efectivo y saldo en cuenta necesita de verdad; el resto pertenece a otro plan.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Con una inflación de 6 % anual, ¿cuánto vale en pesos de hoy un millón dentro de 8 años?
<details><summary>Respuesta</summary><p>\(1.000.000/1{,}06^8\approx\) $627.400.</p></details></li>
<li><span class="lvl">Básico</span>Su salario subió de $3.000.000 a $3.150.000 y la inflación fue de 5,2 %. ¿Cuál fue el aumento real?
<details><summary>Respuesta</summary><p>Nominal: 5 %. Real: \(1{,}05/1{,}052-1\approx-0{,}19\,\%\). En poder de compra, bajó un poco.</p></details></li>
<li><span class="lvl">Intermedio</span>Las inflaciones a diciembre de 2022 a 2025 fueron 13,12 %, 9,28 %, 5,20 % y 5,10 %. ¿Cuánto subieron los precios en esos cuatro años? ¿Cuál fue la inflación anual promedio geométrica?
<details><summary>Respuesta</summary><p>\(1{,}1312\times1{,}0928\times1{,}052\times1{,}051\approx1{,}367\): los precios subieron cerca de 36,7 %. Promedio geométrico: \(1{,}367^{1/4}-1\approx8{,}1\,\%\) anual.</p></details></li>
<li><span class="lvl">Intermedio</span>Si la inflación esperada en Colombia es 4 % anual y en Estados Unidos 2,5 %, ¿cuánto predice la paridad del poder adquisitivo para el dólar en 10 años, si hoy está a $4.000?
<details><summary>Respuesta</summary><p>\(4.000\times(1{,}04/1{,}025)^{10}\approx4.000\times1{,}156\approx\) $4.625. Es una tendencia de fondo, no un pronóstico para una fecha concreta.</p></details></li>
<li><span class="lvl">Avanzado</span>Muestre que si la inflación es constante \(\pi\), el tiempo para que el poder de compra caiga a la mitad es \(\ln2/\ln(1+\pi)\).
<details><summary>Respuesta</summary><p>\((1+\pi)^{-n}=1/2\Rightarrow n\ln(1+\pi)=\ln2\). Es el mismo tiempo de duplicación del capítulo 6, porque los precios se duplican cuando el poder de compra se reduce a la mitad.</p></details></li>
</ol>
