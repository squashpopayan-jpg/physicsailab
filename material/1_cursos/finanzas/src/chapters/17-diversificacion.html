<template class="chapter-src" data-id="diversificacion" data-num="17" data-title="Diversificación y portafolios" data-part="Parte IV · Invertir con método" data-short="La varianza de un portafolio y la correlación; riesgo sistemático e idiosincrático; la frontera eficiente con datos reales; diversificar entre países y monedas; rebalancear; lo que no es diversificar">
<p class="lead">Harry Markowitz demostró en 1952 algo que parece un truco: combinar activos riesgosos puede producir un portafolio menos riesgoso que cualquiera de ellos, sin sacrificar rentabilidad esperada. Por eso se dice que la diversificación es lo más parecido a un almuerzo gratis en finanzas. Este capítulo explica de dónde sale ese almuerzo y cuánto alcanza. Con datos reales construye la frontera eficiente de acciones y bonos, y muestra que rebalancear sirve para controlar el riesgo más que para ganar más.</p>

<section>
<h2>La varianza de un portafolio</h2>
<p>Si un portafolio tiene una fracción \(w\) en el activo 1 y \(1-w\) en el activo 2, su rentabilidad esperada es el promedio ponderado, pero su varianza no:</p>
<div class="eq key" data-name="Portafolio de dos activos">\[\mu_p=w\mu_1+(1-w)\mu_2,\qquad \sigma_p^2=w^2\sigma_1^2+(1-w)^2\sigma_2^2+2w(1-w)\,\rho\,\sigma_1\sigma_2 .\]</div>
<p>El término clave es la <span class="term">correlación</span> \(\rho\), entre −1 y 1, que mide si los activos suben y bajan juntos. Si \(\rho=1\), no hay beneficio: la volatilidad es el promedio. Si \(\rho\lt 1\), la volatilidad del portafolio es menor que el promedio de las volatilidades. Con \(\rho=-1\) se podría eliminar el riesgo por completo.</p>
<div class="box ex"><p>Entre 1928 y 2025, las acciones del S&amp;P 500 tuvieron media de 11,85 % y volatilidad de 19,4 %; los bonos del Tesoro a 10 años, 4,82 % y 7,9 %; y su correlación fue prácticamente nula (0,02). Un portafolio con 14 % en acciones y 86 % en bonos tuvo una volatilidad de 7,4 %, <b>menor que la de los bonos solos</b>, y una media de 5,8 %, mayor que la de los bonos. Agregar un poco de un activo más riesgoso redujo el riesgo.</p></div>
</section>

<section>
<h2>Riesgo que se va y riesgo que se queda</h2>
<p>Cada acción tiene un <span class="term">riesgo idiosincrático</span> (la empresa se equivoca, pierde un contrato, tiene un escándalo) y un <span class="term">riesgo sistemático</span> o de mercado (recesiones, tasas de interés, crisis) que afecta a todas. Con \(n\) activos de igual volatilidad \(\sigma\) y correlación \(\rho\) entre todos, en partes iguales:</p>
<div class="eq key" data-name="Diversificación con n activos">\[\sigma_p^2=\frac{\sigma^2}{n}+\Big(1-\frac1n\Big)\rho\,\sigma^2\ \xrightarrow{\ n\to\infty\ }\ \rho\,\sigma^2 .\]</div>
<p>El primer término, el idiosincrático, desaparece al aumentar \(n\). El segundo, el sistemático, se queda: no se puede diversificar. Por eso el mercado solo paga prima de riesgo por el riesgo sistemático. Concentrarse en pocas acciones es asumir un riesgo que nadie compensa.</p>
<div class="sim" data-sim="n-activos" data-title="¿Cuántas acciones hacen falta para diversificar?"></div>
<div class="sim-guide"><ul>
<li>Con acciones de 35 % de volatilidad y correlación 0,3 entre ellas, una sola tiene 35 %; diez, 21 %; treinta, 20 %. El piso es \(\sqrt{0{,}3}\times35\,\%\approx19\,\%\): el riesgo de mercado.</li>
<li>La mayor parte del beneficio llega con las primeras 10 a 20 acciones, si son de sectores distintos. Suba la correlación (acciones del mismo sector o del mismo país pequeño) y el piso sube.</li>
<li>Un fondo índice con cientos o miles de acciones llega al piso a bajo costo (capítulo 19).</li>
</ul></div>
</section>

<section>
<h2>La frontera eficiente</h2>
<p>Al variar la mezcla de dos activos se dibuja una curva en el plano riesgo–rentabilidad. La parte superior, desde el portafolio de mínima varianza hacia arriba, es la <span class="term">frontera eficiente</span>: para cada nivel de riesgo, la máxima rentabilidad esperada. Ningún inversionista racional elegiría un punto por debajo de ella, porque habría otro con más rentabilidad y el mismo riesgo.</p>
<div class="sim" data-sim="frontera" data-title="La frontera eficiente de acciones y bonos con datos reales"></div>
<div class="sim-guide"><ul>
<li>Los parámetros iniciales son los de 1928-2025. Recorra el peso en acciones: de 0 % a 14 % el riesgo baja y la rentabilidad sube. Ese tramo es gratis.</li>
<li>Más allá del portafolio de mínima varianza, cada punto de rentabilidad adicional cuesta más volatilidad. Dónde detenerse depende del horizonte y de la tolerancia al riesgo, no de una fórmula.</li>
<li>Lleve la correlación a 0,8 (activos parecidos): la curva se aplana y casi desaparece el beneficio. Llévela a −0,5: el beneficio crece mucho.</li>
</ul></div>
<div class="box warn"><p>La correlación entre acciones y bonos no es constante. Fue negativa en gran parte de 2000-2020 y positiva en 2022, cuando ambos cayeron a la vez por la subida de tasas: −18 % las acciones y −18 % los bonos a 10 años, según los datos de Damodaran. La diversificación reduce el riesgo en promedio; no garantiza que todo no pueda caer junto un año.</p></div>
</section>

<section>
<h2>Diversificar entre países y monedas</h2>
<p>Los inversionistas de todo el mundo tienden a concentrar su dinero en su propio país (el <span class="term">sesgo local</span>, documentado por French y Poterba en 1991). Para un colombiano, ese sesgo es especialmente costoso: la bolsa local es pequeña, está concentrada en pocas empresas y sectores (finanzas, energía, servicios públicos), y la economía, el empleo y la moneda de la persona ya dependen de Colombia.</p>
<div class="box co"><p>Un inversionista colombiano puede diversificar internacionalmente con fondos de inversión colectiva globales, con fondos de pensiones voluntarias que tienen portafolios internacionales y, a través de comisionistas de bolsa, con ETF y acciones extranjeras listadas en el Mercado Global Colombiano o en el exterior. Tener una parte del ahorro de largo plazo en activos en dólares diversifica también el riesgo de devaluación del peso (capítulo 8). La proporción depende de los gastos futuros: si se va a gastar en pesos, la mayor parte del riesgo debe estar en pesos o cubierta.</p></div>
</section>

<section>
<h2>Rebalancear</h2>
<p>Con el tiempo, los activos que más suben ganan peso en el portafolio. Un 60/40 que no se toca durante décadas termina siendo casi todo acciones, con un riesgo que el inversionista nunca eligió. <span class="term">Rebalancear</span> es volver periódicamente a la mezcla objetivo: vender un poco de lo que subió y comprar de lo que bajó. Es una regla mecánica que obliga a comprar barato y vender caro, en contra de las emociones.</p>
<div class="sim" data-sim="rebalanceo" data-title="60/40 rebalanceado cada año frente a comprar y no tocar, con datos reales"></div>
<div class="sim-guide"><ul>
<li>Desde 1928, no tocar el portafolio terminó con más dinero, porque las acciones rindieron mucho más que los bonos. Pero al final ese portafolio era casi 100 % acciones.</li>
<li>Desde 1970, el portafolio sin rebalancear terminó con 95 % en acciones y tuvo una caída máxima de 27 %, frente a 21 % del rebalanceado.</li>
<li>La lección honesta: rebalancear no es para ganar más, es para mantener el riesgo que uno eligió. Si se quiere más rentabilidad esperada, se elige desde el principio una mezcla con más acciones.</li>
</ul></div>
</section>

<section>
<h2>Lo que no es diversificar</h2>
<ul>
<li><b>Tener cinco fondos que invierten en lo mismo</b>: cambia la etiqueta, no el riesgo.</li>
<li><b>Tener todo en el mismo banco por encima de la cobertura de Fogafín</b>: la cobertura es por entidad, así que repartir depósitos grandes entre entidades sí diversifica.</li>
<li><b>Varias criptomonedas</b>: suelen moverse juntas, con correlaciones altas entre ellas.</li>
<li><b>Varios apartamentos en la misma ciudad</b>: dependen del mismo mercado, la misma economía local y la misma moneda.</li>
<li><b>Invertir en la empresa donde se trabaja</b>: concentra capital humano y financiero en el mismo riesgo (capítulo 15).</li>
</ul>
<div class="box teach"><p><b>Experimento con dados.</b> Cada estudiante representa una «acción» y su rentabilidad del año es lo que salga en un dado menos 3,5 (de −2,5 a +2,5). Con un segundo dado común para todos se simula el «mercado». Pida que calculen, durante diez rondas, la rentabilidad de su acción sola y la del promedio de toda la clase. El promedio de la clase oscila mucho menos que cada estudiante, salvo por el dado común. La diferencia entre riesgo idiosincrático y sistemático queda a la vista.</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>La varianza de un portafolio depende de las correlaciones. Con \(\rho\lt 1\), el riesgo combinado es menor que el promedio.</li>
<li>El riesgo idiosincrático se elimina diversificando; el sistemático no. Solo este último tiene premio.</li>
<li>La frontera eficiente muestra la máxima rentabilidad esperada para cada riesgo. Con datos de 1928-2025, agregar 14 % de acciones a los bonos redujo el riesgo.</li>
<li>Un inversionista colombiano tiene buenas razones para diversificar fuera del país y de la moneda.</li>
<li>Rebalancear mantiene el riesgo elegido; no es una estrategia para ganar más.</li>
</ul></div>
<div class="box do"><ul>
<li>Haga la lista de sus inversiones y pregúntese a qué riesgo común están expuestas.</li>
<li>Defina su mezcla objetivo (por ejemplo, 50/50 o 70/30) y una regla de rebalanceo (una vez al año).</li>
<li>Revise si su ahorro de largo plazo depende solo de Colombia y del peso.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Dos activos con volatilidad de 20 % cada uno y correlación 0. ¿Cuál es la volatilidad de un portafolio 50/50?
<details><summary>Respuesta</summary><p>\(\sigma_p^2=0{,}25\times0{,}04+0{,}25\times0{,}04=0{,}02\); \(\sigma_p\approx14{,}1\,\%\).</p></details></li>
<li><span class="lvl">Básico</span>¿Y si la correlación es 1? ¿Y −1?
<details><summary>Respuesta</summary><p>Con \(\rho=1\): 20 %, sin beneficio. Con \(\rho=-1\): 0 %, riesgo eliminado.</p></details></li>
<li><span class="lvl">Intermedio</span>Con \(\sigma=40\,\%\) y \(\rho=0{,}2\), ¿cuál es la volatilidad mínima alcanzable con muchas acciones? ¿Cuántas hacen falta para quedar a menos de 10 % de ese piso?
<details><summary>Respuesta</summary><p>Piso: \(\sqrt{0{,}2}\times40\,\%\approx17{,}9\,\%\). Se busca \(\sigma_p\le1{,}1\times17{,}9\,\%\), es decir, \(\sigma_p^2\le0{,}0387\): \(0{,}16/n+0{,}032(1-1/n)\le0{,}03872\Rightarrow0{,}128/n\le0{,}00672\Rightarrow n\ge19{,}05\): hacen falta 20 acciones.</p></details></li>
<li><span class="lvl">Intermedio</span>Explique por qué un portafolio 60/40 sin rebalancear desde 1928 terminó casi 100 % en acciones.
<details><summary>Respuesta</summary><p>Las acciones se multiplicaron unas 11.500 veces y los bonos unas 76 veces. El peso de las acciones fue creciendo hasta dominar por completo el valor del portafolio.</p></details></li>
<li><span class="lvl">Avanzado</span>Deduzca el peso de mínima varianza \(w^*=\dfrac{\sigma_2^2-\rho\sigma_1\sigma_2}{\sigma_1^2+\sigma_2^2-2\rho\sigma_1\sigma_2}\).
<details><summary>Respuesta</summary><p>Derivando \(\sigma_p^2\) respecto de \(w\) e igualando a cero: \(2w\sigma_1^2-2(1-w)\sigma_2^2+2(1-2w)\rho\sigma_1\sigma_2=0\). Despejando \(w\) se obtiene la expresión. Con los datos de 1928-2025 da 13,8 % en acciones.</p></details></li>
</ol>
