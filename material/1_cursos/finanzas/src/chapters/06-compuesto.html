<template class="chapter-src" data-id="compuesto" data-num="6" data-title="Interés compuesto: la física del crecimiento" data-part="Parte II · Las matemáticas del dinero" data-short="Interés simple y compuesto; crecimiento exponencial y la regla del 72; empezar temprano; aportes periódicos; el compuesto en contra; promesas imposibles">
<p class="lead">El interés compuesto es la ecuación más importante de las finanzas personales y la que peor intuye el cerebro. Crece despacio al principio y vertiginosamente al final, igual que una población de bacterias o la carga en un circuito con realimentación. Este capítulo la deduce, la mide con la regla del 72, muestra por qué empezar diez años antes vale más que ahorrar treinta y advierte que la misma ecuación trabaja contra quien debe.</p>

<section>
<h2>Interés simple y compuesto</h2>
<p>Con <span class="term">interés simple</span>, los intereses se calculan siempre sobre el capital inicial. Con <span class="term">interés compuesto</span>, los intereses de cada periodo se suman al capital y en el periodo siguiente también generan intereses.</p>
<div class="eq key" data-name="Valor futuro">\[\underbrace{\VF=\VP\,(1+i\,n)}_{\text{simple}}\qquad\qquad \underbrace{\VF=\VP\,(1+i)^{n}}_{\text{compuesto}}\]</div>
<p>Aquí \(\VP\) es el valor presente (lo que se invierte hoy), \(i\) la tasa por periodo y \(n\) el número de periodos. La tasa y los periodos deben estar en la misma unidad: tasa mensual con meses, tasa anual con años (capítulo 7).</p>
<div class="box ex"><p>$10.000.000 al 1 % mensual durante 5 años (60 meses). Con interés simple: \(10.000.000\times(1+0{,}01\times60)=\) $16.000.000. Con interés compuesto: \(10.000.000\times1{,}01^{60}\approx\) $18.166.967. La diferencia, unos $2,17 millones, son intereses ganados sobre intereses.</p></div>
<div class="sim" data-sim="simple-compuesto" data-title="Interés simple frente a compuesto: los intereses de los intereses"></div>
<div class="sim-guide"><ul>
<li>Al principio las dos curvas casi coinciden: el compuesto parece no importar. Lleve el plazo a 30 años y mire la separación.</li>
<li>La franja dorada son los «intereses sobre intereses». Llega un momento en que es más grande que el capital y los intereses simples juntos.</li>
<li>Duplique la tasa: el resultado final mucho más que se duplica. En el compuesto, la tasa está en el exponente.</li>
</ul></div>
</section>

<section>
<h2>Crecimiento exponencial y la regla del 72</h2>
<p>Si el capital crece de forma continua a una tasa \(r\) por año, su variación es proporcional a sí mismo: \(\dd W/\dd t=rW\). Es la misma ecuación del decaimiento radiactivo con el signo cambiado, y su solución es una exponencial:</p>
<div class="eq">\[W(t)=W_0\,\ee^{rt},\qquad (1+i)^n=\ee^{\,n\ln(1+i)}\approx \ee^{\,i\,n}\ \text{ si } i \text{ es pequeña}.\]</div>
<p>Una pregunta práctica es cuánto tarda el dinero en duplicarse. Igualando \((1+i)^n=2\):</p>
<div class="eq key" data-name="Tiempo de duplicación">\[n_{2}=\frac{\ln 2}{\ln(1+i)}\approx\frac{0{,}693}{i}\approx\frac{72}{100\,i} .\]</div>
<p>La <span class="term">regla del 72</span> dice que una inversión al 8 % anual se duplica en unos \(72/8=9\) años, y que una deuda al 2 % mensual se duplica en unos \(72/2=36\) meses (el valor exacto es 35). Se usa 72 en vez de 69,3 porque compensa el error de la aproximación para tasas habituales y porque tiene muchos divisores: 2, 3, 4, 6, 8, 9, 12.</p>
<div class="sim" data-sim="regla72" data-title="¿Qué tan buena es la regla del 72?"></div>
<div class="sim-guide"><ul>
<li>La curva exacta y la regla del 72 casi coinciden entre 4 % y 15 %. Para tasas bajas la regla del 70 es mejor; para tasas muy altas, ambas fallan.</li>
<li>Lea la duplicación como «periodos»: si la tasa es mensual, el resultado está en meses.</li>
<li>Úsela al revés: para duplicar en 6 años hace falta una tasa cercana a \(72/6=12\,\%\) anual.</li>
</ul></div>
</section>

<section>
<h2>Empezar temprano: Ana y Beto</h2>
<p>Ana empieza a ahorrar $300.000 al mes a los 25 años, lo hace durante 10 años y luego no aporta un peso más, pero deja el dinero invertido. Beto empieza a los 35 y ahorra $300.000 al mes durante 30 años, hasta los 65. Beto aporta tres veces más: $108 millones frente a $36 millones.</p>
<div class="sim" data-sim="ana-beto" data-title="Ana ahorra 10 años, Beto ahorra 30: ¿quién tiene más a los 65?"></div>
<div class="sim-guide"><ul>
<li>Con una rentabilidad real de 6 % anual, Beto termina con un poco más (unos $292 millones frente a $280 millones de Ana), habiendo puesto el triple.</li>
<li>Con 7 %, Ana termina con más que Beto (unos $391 millones frente a $351 millones), con un tercio de los aportes. Busque la tasa a partir de la cual Ana gana.</li>
<li>Mueva la edad de inicio de Beto. Cada año de retraso cuesta más de lo que parece, porque se pierden los últimos años de crecimiento, que son los más grandes.</li>
</ul></div>
<div class="box myth">
<p class="m"><b>Mito</b>«Ya estoy muy viejo para empezar» o «soy muy joven para preocuparme».</p>
<p class="r"><b>Realidad</b>Para el joven, el tiempo es el activo más valioso: cada peso ahorrado a los 25 años puede multiplicarse varias veces antes del retiro. Para quien empieza tarde, el compuesto todavía trabaja durante la jubilación, que puede durar 20 años o más. El peor momento para empezar es nunca; el segundo peor es el año que viene.</p>
</div>
</section>

<section>
<h2>Aportes periódicos</h2>
<p>Casi nadie invierte una sola suma. Lo normal es aportar una cuota \(A\) cada periodo. Sumando los valores futuros de cada aporte se obtiene una serie geométrica:</p>
<div class="eq key" data-name="Valor futuro de una anualidad vencida">\[\VF=A\,\frac{(1+i)^{n}-1}{i}\qquad\text{(aportes al final de cada periodo)} .\]</div>
<p>Si los aportes se hacen al inicio de cada periodo (anualidad <span class="term">anticipada</span>), cada uno gana un periodo más de interés y el resultado se multiplica por \((1+i)\).</p>
<div class="box xl"><p>Todas las hojas de cálculo traen la función <code class="f">VF</code> (en inglés <code class="f">FV</code>): <code class="f">=VF(tasa; nper; pago; [va]; [tipo])</code>. El dinero que sale del bolsillo se escribe negativo, y por eso el resultado sale positivo. Para $1.000.000 iniciales más $100.000 mensuales durante 10 años al 1 % mensual:</p>

<section>
<h2>El compuesto también trabaja en contra</h2>
<p>La ecuación no sabe si la persona es inversionista o deudora. Una deuda de tarjeta de crédito al 2 % mensual, si no se paga, se duplica en unos 35 meses y se multiplica por diez en unos 10 años. Un préstamo «gota a gota» al 20 % mensual se duplica en menos de 4 meses. En el capítulo 14 se verá cómo el pago mínimo de una tarjeta convierte el compuesto en una trampa.</p>
<div class="box warn"><p><b>Promesas imposibles.</b> Si alguien ofrece «10 % mensual garantizado», haga la cuenta: \(1{,}10^{12}\approx3{,}14\), es decir, 214 % efectivo anual. En 5 años, \(1{,}10^{60}\approx304\): un millón se convertiría en 304 millones. Ningún negocio legal sostiene eso. Si lo hiciera, quien lo ofrece no necesitaría su dinero. Es la firma típica de una pirámide o de un esquema Ponzi (capítulo 25).</p></div>
<div class="box teach"><p><b>El grano de arroz.</b> Cuente la leyenda del ajedrez: un grano en la primera casilla, dos en la segunda, cuatro en la tercera, y así hasta la casilla 64. Pida que estimen cuánto arroz habrá en la última, antes de calcular. La respuesta, \(2^{63}\approx9{,}2\times10^{18}\) granos, supera con mucho toda la producción mundial de arroz de siglos. Luego pregunte: ¿qué tasa por casilla es esa? (100 %). Así se fija la idea de que el exponente manda.</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>Interés compuesto: \(\VF=\VP(1+i)^n\). La tasa y los periodos deben estar en la misma unidad.</li>
<li>El crecimiento compuesto es exponencial: lento al principio, explosivo al final. La tasa está en el exponente.</li>
<li>Regla del 72: el dinero se duplica en unos \(72/(100\,i)\) periodos.</li>
<li>Empezar temprano vale más que aportar mucho tarde: el tiempo es el multiplicador.</li>
<li>Anualidad vencida: \(\VF=A\,[(1+i)^n-1]/i\); en la hoja de cálculo, <code class="f">=VF(tasa;nper;pago;va;tipo)</code>.</li>
<li>El compuesto juega en contra de las deudas, y las promesas de rentabilidades altas «garantizadas» lo violan.</li>
</ul></div>
<div class="box do"><ul>
<li>Calcule con la regla del 72 en cuánto tiempo se duplica su deuda más cara si no la pagara.</li>
<li>Use la simulación 6.3 con su edad y su posible ahorro mensual. Anote la cifra a los 65 años.</li>
<li>Repita el ejercicio de la hoja de cálculo con sus propios números.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>¿En cuánto se convierten $5.000.000 al 9 % anual en 8 años con interés compuesto? ¿Y con interés simple?
<details><summary>Respuesta</summary><p>Compuesto: \(5.000.000\times1{,}09^{8}\approx\) $9.962.813. Simple: \(5.000.000\times(1+0{,}72)=\) $8.600.000.</p></details></li>
<li><span class="lvl">Básico</span>Con la regla del 72, ¿cuánto tarda en triplicarse aproximadamente una inversión al 12 % anual?
<details><summary>Respuesta</summary><p>Se duplica en 6 años. Para triplicar se necesita \(\ln3/\ln1{,}12\approx9{,}7\) años. Una regla análoga para triplicar usa 114 en vez de 72: \(114/12\approx9{,}5\).</p></details></li>
<li><span class="lvl">Intermedio</span>¿Cuánto hay que ahorrar al mes, al 0,6 % mensual, para tener $50 millones en 6 años?
<details><summary>Respuesta</summary><p>\(A=\VF\cdot i/[(1+i)^n-1]=50.000.000\times0{,}006/(1{,}006^{72}-1)\approx\) $557.260. En la hoja: <code class="f">=PAGO(0,6%;72;0;50000000)</code>, que da el valor con signo negativo.</p></details></li>
<li><span class="lvl">Intermedio</span>Una deuda de $2.000.000 crece al 2,2 % mensual sin pagos. ¿Cuánto se debe al cabo de 2 años? ¿Cuánto tarda en duplicarse?
<details><summary>Respuesta</summary><p>\(2.000.000\times1{,}022^{24}\approx\) $3.370.000. Duplicación: \(\ln2/\ln1{,}022\approx31{,}8\) meses (la regla del 72 da \(72/2{,}2\approx32{,}7\)).</p></details></li>
<li><span class="lvl">Avanzado</span>Deduzca la fórmula del valor futuro de la anualidad sumando la serie \(A\sum_{k=0}^{n-1}(1+i)^k\).
<details><summary>Respuesta</summary><p>Es una serie geométrica de razón \(q=1+i\): \(\sum_{k=0}^{n-1}q^k=(q^n-1)/(q-1)=[(1+i)^n-1]/i\). El aporte del último periodo no gana interés (\(k=0\)) y el primero gana \(n-1\) periodos.</p></details></li>
</ol>
