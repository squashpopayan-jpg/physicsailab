<template class="chapter-src" data-id="costos" data-num="19" data-title="Costos, gestión activa e indexación" data-part="Parte IV · Invertir con método" data-short="Las comisiones también se componen; la aritmética de la gestión activa; qué dice la evidencia; suerte frente a habilidad; fondos índice; costos ocultos y conflictos de interés">
<p class="lead">De todas las variables de una inversión, el costo es la única que se conoce de antemano y que se puede controlar. Una comisión de 1,5 % anual parece pequeña, pero en 30 años se lleva un tercio del resultado. Este capítulo muestra por qué, en promedio, los fondos que intentan ganarle al mercado terminan por debajo de él, por qué es tan difícil distinguir la habilidad de la suerte y por qué los fondos índice de bajo costo son la recomendación por defecto de la mayoría de los académicos.</p>

<section>
<h2>Las comisiones también se componen</h2>
<p>Una comisión anual \(f\) sobre el saldo no resta \(f\) una vez: resta cada año, sobre un saldo que incluye las ganancias pasadas. El efecto se compone igual que el interés:</p>
<div class="eq key" data-name="Arrastre de las comisiones">\[W_n=W_0\,\big[(1+r)(1-f)\big]^{n}\approx W_0\,(1+r-f)^{n} .\]</div>
<div class="box ex"><p>$10 millones a 30 años con 7 % de rentabilidad bruta anual. Con una comisión de 0,2 % terminan en unos $71,7 millones; con 1,5 %, en $48,4 millones; con 2,5 %, en $35,6 millones. La diferencia entre 0,2 % y 1,5 % son $23 millones, casi un tercio del resultado, a cambio de nada que esté garantizado.</p></div>
<div class="sim" data-sim="comisiones" data-title="Lo que se lleva la comisión en una vida de ahorro"></div>
<div class="sim-guide"><ul>
<li>Con aportes mensuales durante décadas, la comisión pesa todavía más, porque se cobra sobre un saldo que crece.</li>
<li>Compare dos fondos: uno de bajo costo (0,2 %) y uno caro (2 %). La franja roja es lo que el fondo caro se lleva, frente al barato.</li>
<li>Pruebe una rentabilidad bruta de 4 %, típica de renta fija: con una comisión de 2 %, la mitad de la rentabilidad se va en costos.</li>
</ul></div>
</section>

<section>
<h2>La aritmética de la gestión activa</h2>
<p>William Sharpe, premio Nobel de 1990, publicó en 1991 un argumento de una página que no necesita datos. Se divide a todos los inversionistas de un mercado en «pasivos», que tienen el índice completo, y «activos», que compran y venden tratando de ganarle. Antes de costos, los pasivos obtienen exactamente la rentabilidad del mercado. Como entre todos tienen todo el mercado, los activos, en conjunto, también obtienen la rentabilidad del mercado antes de costos. Pero los activos pagan más comisiones y más costos de transacción. Por lo tanto, después de costos, <b>el dólar activo promedio rinde menos que el dólar pasivo promedio</b>. No es una opinión: es aritmética.</p>
<div class="box evid"><p>Los informes SPIVA de S&amp;P Dow Jones Indices comparan desde 2002 los fondos activos con sus índices de referencia. En Estados Unidos, en horizontes de 15 años, alrededor de 9 de cada 10 fondos de acciones grandes quedan por debajo del S&amp;P 500. Los informes de América Latina (Brasil, Chile, México) muestran resultados parecidos: la mayoría de los fondos activos queda por debajo de su índice en horizontes largos. Además, los informes de persistencia muestran que muy pocos fondos que estuvieron entre los mejores en un periodo siguen entre los mejores en el siguiente.</p></div>
<div class="sim" data-sim="activos-pasivos" data-title="Mil gestores activos frente al índice"></div>
<div class="sim-guide"><ul>
<li>Cada gestor tiene una habilidad propia, que puede ser positiva o negativa, más ruido anual, y cobra una comisión. En promedio, la habilidad antes de costos es cero: entre todos son el mercado.</li>
<li>Con 1,5 % de comisión, después de 15 años solo uno de cada siete supera al índice. Baje la comisión a 0,3 % y la proporción sube, pero nunca pasa de la mitad.</li>
<li>La segunda gráfica mide la persistencia: de los gestores que estuvieron en el mejor cuarto en los primeros 5 años, ¿cuántos siguen ahí en los 5 siguientes? Si todo fuera suerte, serían 25 %.</li>
</ul></div>
</section>

<section>
<h2>Suerte frente a habilidad</h2>
<p>Supongamos que un gestor tiene una habilidad real \(\alpha\) (rentabilidad extra por año) y que su resultado frente al índice tiene un ruido anual \(\sigma_{\text{TE}}\), llamado <span class="term">error de seguimiento</span>. Para que su historial demuestre la habilidad con 95 % de confianza, el promedio de \(n\) años debe superar dos errores estándar:</p>
<div class="eq key" data-name="Años necesarios para distinguir habilidad de suerte">\[\alpha\gt \frac{1{,}96\,\sigma_{\text{TE}}}{\sqrt n}\qquad\Longrightarrow\qquad n\gt\Big(\frac{1{,}96\,\sigma_{\text{TE}}}{\alpha}\Big)^{2} .\]</div>
<p>Con \(\alpha=2\,\%\) (una habilidad excelente) y \(\sigma_{\text{TE}}=6\,\%\), hacen falta unos 35 años de historial. Con \(\alpha=1\,\%\) y 5 %, casi un siglo. Ningún inversionista puede esperar tanto para saber si eligió bien. Por eso los rendimientos pasados de 3 o 5 años, que son los que muestra la publicidad, dicen muy poco.</p>
<div class="sim" data-sim="suerte-habilidad" data-title="¿Cuántos años de historial hacen falta para confiar en un gestor?"></div>
<div class="sim-guide"><ul>
<li>La curva muestra los años necesarios según el tamaño de la habilidad. Es enorme para habilidades realistas, de 1 a 2 % anual.</li>
<li>Reduzca el error de seguimiento (un gestor que se parece mucho al índice): hace falta menos tiempo, pero también la diferencia que puede lograr es menor.</li>
<li>Recuerde la simulación 3.3: entre miles de gestores, algunos tendrán historiales brillantes por pura suerte.</li>
</ul></div>
</section>

<section>
<h2>Fondos índice: la opción por defecto</h2>
<p>En 1976, John Bogle lanzó el primer fondo índice para inversionistas individuales, con la idea de comprar todo el mercado y cobrar lo mínimo. Fue ridiculizado y hoy los fondos índice administran billones de dólares. Warren Buffett, uno de los gestores activos más exitosos de la historia, recomienda en sus cartas a los accionistas que la mayoría de las personas invierta en un fondo índice de bajo costo. En 2008 incluso apostó un millón de dólares a que un fondo índice del S&amp;P 500 le ganaría en diez años a una selección de fondos de cobertura, y ganó la apuesta.</p>
<div class="box co"><p>En Colombia hay ETF sobre el índice COLCAP y, a través de comisionistas de bolsa, acceso a ETF internacionales en el Mercado Global Colombiano. También hay FIC y fondos de pensiones voluntarias con portafolios que replican índices. Al comparar, mire el costo total (comisión de administración, más comisiones de compra y venta y la diferencia entre precio de compra y de venta) y la diversificación real del índice. El COLCAP, por ejemplo, concentra buena parte de su peso en pocas empresas.</p></div>
<div class="box myth">
<p class="m"><b>Mito</b>«Con un fondo índice me conformo con el promedio».</p>
<p class="r"><b>Realidad</b>Por la aritmética de Sharpe, después de costos el índice queda por encima del inversionista activo promedio, y en horizontes largos por encima de la gran mayoría. Conformarse con el índice es, en la práctica, quedar en el grupo de arriba.</p>
</div>
</section>

<section>
<h2>Costos ocultos y conflictos de interés</h2>
<ul>
<li><b>Costos de transacción</b>: comisiones de corretaje y diferencia entre precio de compra y de venta, que se pagan en cada operación. Un fondo que rota mucho su portafolio paga más.</li>
<li><b>Comisiones de entrada, salida o éxito</b>: además de la de administración.</li>
<li><b>Impuestos</b>: operar mucho puede generar impuestos que un inversionista de largo plazo no pagaría.</li>
<li><b>Asesores remunerados por comisión</b>: quien gana según el producto que vende tiene un incentivo a recomendar el más caro. La pregunta clave es: «¿cómo le pagan a usted?».</li>
</ul>
<div class="box teach"><p><b>Torneo de selección.</b> Antes de la clase, prepare la rentabilidad real de 20 fondos o acciones durante cinco años, pero muestre solo los tres primeros años. Pida a cada grupo que elija el «mejor» para los dos años siguientes, con los argumentos que quieran. Luego revele los dos años restantes y compárelos con un índice. Casi siempre el índice queda por encima de la mayoría de las selecciones. Discuta por qué el pasado reciente predijo tan poco.</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>Las comisiones se componen: \(W_n\approx W_0(1+r-f)^n\). Entre 0,2 % y 1,5 % la diferencia en 30 años es de un tercio del resultado.</li>
<li>Por aritmética (Sharpe, 1991), el dinero activo promedio rinde menos que el pasivo después de costos.</li>
<li>La evidencia SPIVA: alrededor de 9 de cada 10 fondos activos de acciones grandes en Estados Unidos quedan por debajo de su índice en 15 años, con resultados parecidos en América Latina.</li>
<li>Distinguir habilidad de suerte exige décadas de historial: \(n\gt(1{,}96\,\sigma_{\text{TE}}/\alpha)^2\).</li>
<li>Los fondos índice amplios y de bajo costo son la opción por defecto razonable. Pregunte siempre cómo se le paga a quien le asesora.</li>
</ul></div>
<div class="box do"><ul>
<li>Busque la comisión de administración de cada fondo en el que tiene dinero.</li>
<li>Calcule con la simulación 19.1 cuánto le costarían esas comisiones en 20 años.</li>
<li>Si tiene asesor, pregúntele por escrito cómo se le paga.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Un fondo cobra 2 % anual y rinde 9 % bruto. Aproximadamente, ¿qué fracción de la rentabilidad se va en comisión?
<details><summary>Respuesta</summary><p>2/9 ≈ 22 % de la rentabilidad bruta. Si la inflación es 4 %, se lleva 2 de los 5 puntos reales: 40 % de la rentabilidad real.</p></details></li>
<li><span class="lvl">Básico</span>¿Por qué el argumento de Sharpe no depende de los datos?
<details><summary>Respuesta</summary><p>Porque es una identidad contable: el mercado es la suma de los activos y los pasivos. Si los pasivos obtienen el mercado antes de costos, los activos en conjunto también; los costos mayores de los activos los ponen por debajo.</p></details></li>
<li><span class="lvl">Intermedio</span>Un gestor con error de seguimiento de 8 % presume de haberle ganado al índice por 3 % anual durante 4 años. ¿Es significativo?
<details><summary>Respuesta</summary><p>Error estándar: \(8\,\%/\sqrt4=4\,\%\). Un exceso de 3 % está a 0,75 errores estándar: totalmente compatible con la suerte. Necesitaría \((1{,}96\times8/3)^2\approx27\) años.</p></details></li>
<li><span class="lvl">Intermedio</span>Aportando $500.000 mensuales durante 25 años con 7 % de rentabilidad bruta, compare el saldo final con comisiones de 0,3 % y de 1,8 %.
<details><summary>Respuesta</summary><p>Con la simulación 19.1: unos $373 millones frente a $296 millones. La comisión alta se lleva cerca de $77 millones.</p></details></li>
<li><span class="lvl">Avanzado</span>Si en un mercado el 80 % del dinero es pasivo y el 20 % activo, y los activos pagan 1 % más de costos, ¿cuánto rinden los activos en conjunto frente al índice después de costos?
<details><summary>Respuesta</summary><p>Antes de costos, el conjunto de activos rinde igual al mercado; después de costos, 1 % menos. Lo que unos gestores activos ganen de más, otros activos lo pierden. La proporción 80/20 no cambia la conclusión.</p></details></li>
</ol>
