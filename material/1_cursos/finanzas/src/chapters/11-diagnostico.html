<template class="chapter-src" data-id="diagnostico" data-num="11" data-title="Diagnóstico financiero personal" data-part="Parte III · La economía del hogar" data-short="El balance personal y el estado de flujo de caja; activos líquidos, de inversión y de uso; indicadores profesionales con rangos de referencia; la fórmula de Stanley y Danko; un caso completo">
<p class="lead">Ningún médico receta sin examinar, y ningún planificador financiero recomienda sin un diagnóstico. El examen tiene dos documentos: el balance, que es una foto de lo que se tiene y se debe, y el flujo de caja, que es la película de lo que entra y sale cada mes. Con ellos se calculan cuatro o cinco indicadores que dicen, como los signos vitales, qué está bien y qué urge. Este capítulo enseña a construirlos y a leerlos.</p>

<section>
<h2>El balance personal</h2>
<p>El <span class="term">balance</span> (o estado de situación) lista, en una fecha, todos los activos y todos los pasivos a su valor de mercado: lo que se recibiría hoy si se vendieran, no lo que se pagó. La diferencia es el patrimonio. Un profesional separa los activos en tres grupos, porque cumplen funciones distintas:</p>
<div class="tablewrap"><table>
<thead><tr><th>Grupo</th><th>Ejemplos</th><th>Para qué sirve</th></tr></thead>
<tbody>
<tr><td><b>Líquidos</b></td><td>Efectivo, cuentas de ahorro, CDT de corto plazo, fondos a la vista</td><td>Pagar emergencias sin endeudarse</td></tr>
<tr><td><b>De inversión</b></td><td>Fondos, acciones, pensiones voluntarias, cesantías, inmuebles arrendados</td><td>Crecer y generar ingresos futuros</td></tr>
<tr><td><b>De uso</b></td><td>Vivienda donde se vive, carro, muebles, equipos</td><td>Dar servicio; no producen ingresos y muchos se deprecian</td></tr>
</tbody></table></div>
<p>Los pasivos se separan en corto plazo (tarjetas, cuentas por pagar) y largo plazo (hipoteca, crédito de vehículo, libranza). La distinción importa porque un hogar puede tener un patrimonio alto concentrado en activos de uso y, al mismo tiempo, estar a un mes de no poder pagar el mercado.</p>
<div class="sim" data-sim="balance" data-title="Balance personal: activos, pasivos y patrimonio"></div>
<div class="sim-guide"><ul>
<li>El ejemplo es una familia con casa, carro y buenos ingresos. Su patrimonio es de $146 millones, pero casi todo está en activos de uso. Sus activos líquidos alcanzan para menos de un mes.</li>
<li>Escriba sus propias cifras. Los datos se quedan en su navegador; nada se envía a ningún lado.</li>
<li>Fíjese en la barra de los activos: ¿cuánto del patrimonio podría convertir en dinero en una semana sin malvender nada?</li>
</ul></div>
<div class="box explain"><p>Un carro de $55 millones financiado con un crédito de $38 millones no es «un carro de 55 millones». Es una deuda de 38 millones con un carro encima, que además pierde valor cada año. Mirar el balance con esa crudeza no es pesimismo: es lo que hace un banco antes de prestar.</p></div>
</section>

<section>
<h2>El flujo de caja mensual</h2>
<p>El <span class="term">flujo de caja</span> resume lo que entra y sale en un mes típico. Los ingresos se anotan <b>netos</b>, después de descuentos de nómina. Los gastos se separan en fijos (arriendo, servicios, colegios, cuotas), variables (mercado, transporte, salidas) y periódicos (SOAT, impuesto predial, matrículas, regalos de diciembre), que se prorratean mes a mes (capítulo 12). Lo que queda es el ahorro, y es la cifra más importante de la parte III, porque es el término \(I-G\) de la bañera del capítulo 1.</p>
</section>

<section>
<h2>Indicadores profesionales</h2>
<p>Con el balance y el flujo se calculan los signos vitales. Los rangos de la tabla son referencias usadas en la práctica de la planificación financiera, no leyes: cada caso tiene matices.</p>
<div class="tablewrap"><table>
<thead><tr><th>Indicador</th><th>Fórmula</th><th>Sano</th><th>Alerta</th><th>Riesgo</th></tr></thead>
<tbody>
<tr><td>Tasa de ahorro</td><td>ahorro / ingreso neto</td><td>≥ 15 %</td><td>5–15 %</td><td>&lt; 5 %</td></tr>
<tr><td>Carga de la deuda</td><td>cuotas / ingreso neto</td><td>≤ 30 %</td><td>30–40 %</td><td>&gt; 40 %</td></tr>
<tr><td>Colchón de liquidez</td><td>activos líquidos / gasto mensual total</td><td>≥ 3 meses</td><td>1–3 meses</td><td>&lt; 1 mes</td></tr>
<tr><td>Endeudamiento</td><td>pasivos / activos</td><td>≤ 40 %</td><td>40–60 %</td><td>&gt; 60 %</td></tr>
<tr><td>Deuda cara</td><td>saldo en tarjetas y créditos de consumo / ingreso neto mensual</td><td>0</td><td>hasta 1 mes</td><td>más de 1 mes</td></tr>
</tbody></table></div>
<div class="sim" data-sim="indicadores" data-title="Tablero de signos vitales financieros"></div>
<div class="sim-guide"><ul>
<li>Cada indicador se colorea según los rangos de la tabla. El orden de atención lo da el capítulo 22: primero liquidez y deuda cara, después ahorro, después inversión.</li>
<li>En el ejemplo, la familia tiene la deuda bajo control y una tasa de ahorro aceptable, pero el colchón de liquidez está en rojo. La prioridad es clara: construir tres meses de gastos antes de cualquier otra meta.</li>
<li>Suba el gasto en $500.000 y mire cómo cambian a la vez el ahorro y el colchón. Los indicadores están conectados.</li>
</ul></div>
<div class="box co"><p>Dos límites legales colombianos se relacionan con la carga de deuda. En los créditos de vivienda, la Ley 546 de 1999 establece que la primera cuota no puede superar el 30 % de los ingresos familiares. Y en las libranzas, los descuentos de nómina tienen un tope: el trabajador debe recibir al menos el 50 % de su salario neto después de los descuentos de ley (Ley 1527 de 2012). Que algo sea legal no significa que sea sano: una carga de 45 % deja muy poco margen ante cualquier imprevisto.</p></div>
</section>

<section>
<h2>¿Cuánto patrimonio «debería» tener? La fórmula de Stanley y Danko</h2>
<p>En <i>El millonario de al lado</i> (1996), Thomas Stanley y William Danko propusieron una regla para comparar el patrimonio con el ingreso, según la edad:</p>
<div class="eq key" data-name="Patrimonio esperado (Stanley y Danko)">\[W_{\text{esperado}}=\frac{\text{edad}\times\text{ingreso anual bruto}}{10} .\]</div>
<p>Llamaron <span class="term">acumuladores prodigiosos</span> a quienes tienen el doble o más de lo esperado, y <span class="term">acumuladores insuficientes</span> a quienes tienen la mitad o menos. Su hallazgo central fue que muchos de los primeros tenían ingresos moderados y vidas sencillas, y que muchos de los segundos tenían ingresos altos y consumo visible: casas grandes, carros nuevos, ropa de marca.</p>
<div class="sim" data-sim="millonario" data-title="¿Acumulador prodigioso o insuficiente?"></div>
<div class="sim-guide"><ul>
<li>La regla funciona mejor después de los 40 años. A los 25, casi nadie tiene patrimonio y el resultado no dice mucho.</li>
<li>Pruebe la familia del ejemplo (42 años, $90 millones de ingreso anual, $146 millones de patrimonio): queda en zona de acumulación insuficiente.</li>
<li>La regla no es una meta exacta. Sirve para hacerse la pregunta incómoda: ¿mi patrimonio refleja lo que he ganado en mi vida?</li>
</ul></div>
<div class="box warn"><p>El libro de Stanley y Danko tiene un sesgo de supervivencia (capítulo 3): estudia a quienes llegaron a millonarios, no a quienes vivieron igual de frugales y no lo lograron. La fórmula se diseñó con hogares estadounidenses de ingresos altos. Úsela como espejo, no como juicio.</p></div>
</section>

<section>
<h2>Leer el diagnóstico como un profesional</h2>
<p>Un buen diagnóstico termina en tres frases: qué está bien, qué urge y cuál es el primer paso. Para la familia del ejemplo:</p>
<ol>
<li><b>Lo que está bien</b>: ahorran algo cada mes y la carga de deuda es moderada (24,6 %).</li>
<li><b>Lo que urge</b>: no tienen colchón (0,8 meses) y deben $6 millones en tarjeta. Cualquier imprevisto se pagará con más tarjeta.</li>
<li><b>El primer paso</b>: juntar con el ahorro mensual un colchón mínimo de un mes, para no volver a la tarjeta con el próximo imprevisto; luego pagar la tarjeta y después completar tres meses de colchón. Revisar también si el carro es el que su patrimonio puede sostener.</li>
</ol>
<div class="box teach"><p><b>Caso para resolver en grupos.</b> Entregue a cada grupo una ficha con el balance y el flujo de un hogar ficticio (puede usar los datos del ejemplo y variarlos: un joven recién graduado, una pareja con hijos, un independiente, un jubilado). Cada grupo calcula los indicadores, escribe las tres frases y presenta en cinco minutos. Usar casos ficticios evita exponer la situación de cada estudiante y permite discutir con libertad.</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>Balance: activos (líquidos, de inversión, de uso) menos pasivos (corto y largo plazo) igual a patrimonio, a valor de mercado.</li>
<li>Flujo de caja: ingresos netos menos gastos fijos, variables y periódicos prorrateados igual a ahorro.</li>
<li>Indicadores: tasa de ahorro, carga de la deuda, colchón de liquidez, endeudamiento y deuda cara, con rangos de referencia.</li>
<li>Stanley y Danko: patrimonio esperado = edad × ingreso anual / 10. Sirve como espejo después de los 40.</li>
<li>Un diagnóstico profesional termina en qué está bien, qué urge y el primer paso.</li>
</ul></div>
<div class="box do"><ul>
<li>Haga su balance con la simulación 11.1. No tiene que ser perfecto: una estimación honesta basta.</li>
<li>Calcule sus cinco indicadores con 11.2 y escriba sus tres frases.</li>
<li>Repita el balance dentro de seis meses. El cambio del patrimonio es la mejor medida de progreso.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Ingreso neto $4.000.000, gastos $3.100.000, cuotas $700.000. Calcule tasa de ahorro y carga de deuda.
<details><summary>Respuesta</summary><p>Ahorro: $200.000, tasa de 5 % (alerta). Carga: 700/4.000 = 17,5 % (sano). El problema no es la deuda sino el gasto.</p></details></li>
<li><span class="lvl">Básico</span>Tiene $2.400.000 en la cuenta y gasta $3.200.000 al mes, cuotas incluidas. ¿Cuántos meses de colchón tiene? ¿Cuánto le falta para tres?
<details><summary>Respuesta</summary><p>0,75 meses. Para tres meses necesita $9.600.000: le faltan $7.200.000.</p></details></li>
<li><span class="lvl">Intermedio</span>Una persona de 50 años con ingreso anual de $120 millones tiene un patrimonio de $700 millones. ¿Qué dice la regla de Stanley y Danko?
<details><summary>Respuesta</summary><p>Esperado: \(50\times120/10=\) $600 millones. Tiene 1,17 veces lo esperado: acumulador promedio, ni prodigioso (≥ 1.200) ni insuficiente (≤ 300).</p></details></li>
<li><span class="lvl">Intermedio</span>¿Por qué el balance debe usar valores de mercado y no los precios de compra?
<details><summary>Respuesta</summary><p>Porque el balance responde «¿qué tengo hoy?». Un carro comprado en $60 millones hace cinco años puede valer $35 millones; un apartamento pudo valorizarse. Con precios de compra, el patrimonio sería ficticio.</p></details></li>
<li><span class="lvl">Avanzado</span>Dos hogares tienen el mismo patrimonio de $200 millones. El primero tiene $150 millones en vivienda propia sin deuda y $50 millones en un fondo; el segundo, $400 millones en vivienda con una hipoteca de $250 millones y $50 millones en un fondo. Compare su riesgo.
<details><summary>Respuesta</summary><p>El segundo está apalancado: si la vivienda cae 20 % ($80 millones), su patrimonio baja 40 %; al primero, la misma caída de 20 % ($30 millones) le resta 15 %. Además, el segundo tiene una cuota mensual que el primero no tiene. Igual patrimonio no significa igual riesgo.</p></details></li>
</ol>
