<p class="lead">Casi todo el curso trata de qué hacer con el dinero que entra. Este capítulo trata de la otra llave de la bañera: el ingreso. Para una persona joven, su mayor activo no es la casa ni el fondo de pensiones, sino su capacidad de generar ingresos durante décadas, que los economistas llaman capital humano. Protegerlo, invertir en él y cobrar lo justo por él son decisiones financieras de primer orden. También hay que entender cuánto de ese ingreso se lleva el Estado, y despejar el mito más común sobre la renta.</p>

<section>
<h2>Su mayor activo: el capital humano</h2>
<p>El <span class="term">capital humano</span> es el valor presente de todos los ingresos laborales futuros. Para alguien de 25 años que gana $3 millones al mes, con aumentos reales de 2 % al año hasta los 62 y una tasa de descuento de 4 %, ese valor ronda los $920 millones: probablemente mucho más que todo lo que tendrá en activos financieros durante décadas.</p>
<div class="eq key" data-name="Capital humano">\[H(t)=\sum_{k=t}^{T-1}\frac{Y_k}{(1+i)^{\,k-t+1}} ,\]</div>
<p>donde \(Y_k\) es el ingreso laboral del año \(k\) y \(T\) la edad de retiro. A lo largo de la vida, el capital humano se va convirtiendo en capital financiero: baja a medida que se acerca el retiro, mientras el ahorro acumulado sube (Ibbotson, Milevsky, Chen y Zhu, 2007).</p>
<div class="sim" data-sim="capital-humano" data-title="Capital humano y capital financiero a lo largo de la vida"></div>
<div class="sim-guide"><ul>
<li>La curva azul es el capital humano: alto a los 25, cero al retirarse. La verde es el capital financiero, que crece con el ahorro y sus rendimientos.</li>
<li>Si el ahorro es bajo, al llegar al retiro el capital humano se agotó sin haberse convertido en capital financiero. Es la situación de quien llega a viejo sin pensión ni ahorros.</li>
<li>Tres consecuencias prácticas. Proteger el capital humano: salud, seguros de vida e invalidez (capítulo 13). Invertir en él: formación, habilidades, red de contactos. Diversificar: si su empleo depende de un sector, no ponga también sus ahorros en ese mismo sector.</li>
</ul></div>
<div class="box evid"><p>Los empleados de Enron tenían en 2001 buena parte de sus ahorros de retiro en acciones de su propia empresa. Cuando Enron quebró, perdieron a la vez el empleo y los ahorros. Es el ejemplo clásico de capital humano y financiero concentrados en el mismo riesgo.</p></div>
</section>

<section>
<h2>Invertir en uno mismo: el VPN de un posgrado</h2>
<p>Una especialización, una maestría o un curso técnico son inversiones: cuestan matrícula, a veces ingresos que se dejan de recibir, y prometen un ingreso mayor después. Se evalúan con las herramientas del capítulo 9. A nivel mundial, la rentabilidad privada promedio de un año adicional de escolaridad ronda el 9 % (Psacharopoulos y Patrinos, 2018), y es mayor en la educación superior, pero varía muchísimo según el programa, la institución y la persona.</p>
<div class="sim" data-sim="vpn-posgrado" data-title="¿Vale la pena el posgrado? VPN, TIR y años para recuperarlo"></div>
<div class="sim-guide"><ul>
<li>Un posgrado de $30 millones en dos años, estudiando mientras se trabaja, que sube el salario 15 %. Con 30 años de carrera por delante, el VPN es claramente positivo.</li>
<li>Pase a tiempo completo: se pierden dos años de salario y la decisión se vuelve mucho más exigente.</li>
<li>Reduzca los años de carrera restantes: la misma formación rinde menos a los 55 que a los 30. Y reduzca el aumento esperado a 5 %: muchos programas no mueven el salario.</li>
</ul></div>
<div class="box warn"><p>El aumento salarial esperado es el dato más incierto y el más inflado por la publicidad de los programas. Busque información independiente: el Observatorio Laboral para la Educación del Ministerio de Educación publica salarios de entrada de graduados por programa e institución. Y recuerde que la educación también tiene valor no monetario, que el VPN no mide.</p></div>
</section>

<section>
<h2>Negociar el salario</h2>
<p>Una diferencia de 10 % en el salario inicial se arrastra durante toda la carrera, porque los aumentos suelen calcularse en porcentaje. Algunas reglas de negociación con respaldo en la investigación sobre anclaje (capítulo 3):</p>
<ul>
<li><b>Investigar el mercado</b> antes: rangos salariales del cargo, encuestas sectoriales, conversaciones con colegas.</li>
<li><b>Anclar con una cifra concreta y justificada</b>, en el extremo alto de lo razonable. Las cifras precisas ($4.750.000) suelen percibirse como más estudiadas que las redondas.</li>
<li><b>Negociar el paquete completo</b>: salario, bonificaciones, horario, teletrabajo, formación pagada, tipo de contrato.</li>
<li><b>Tener una alternativa</b>: la mejor posición para negociar es poder decir que no.</li>
</ul>
</section>

<section>
<h2>Si trabaja como independiente</h2>
<div class="box co"><p>Un contratista por prestación de servicios o trabajador independiente no recibe prima, cesantías, intereses de cesantías ni vacaciones pagadas, y debe pagar su propia seguridad social: aporta sobre un ingreso base de cotización del 40 % de sus ingresos mensuales, con 12,5 % para salud y 16 % para pensión, más la ARL. En total, cerca de 11,4 % del ingreso bruto, sin contar la ARL. Para comparar una oferta de contrato con un empleo, una regla útil es que el contrato debe pagar al menos 1,4 a 1,5 veces el salario equivalente, para cubrir prestaciones, seguridad social, vacaciones no pagadas y los meses sin contrato.</p></div>
<p>El independiente necesita, además, un colchón más grande (capítulo 13), apartar mes a mes sus propias «prestaciones» y una disciplina tributaria mayor, porque nadie le retiene la renta exactamente.</p>
</section>

<section>
<h2>Impuestos: tarifa marginal y tarifa media</h2>
<p>El impuesto de renta de las personas naturales residentes en Colombia se calcula con una tabla progresiva en UVT (artículo 241 del Estatuto Tributario). Cada tramo de la base gravable paga su propia tarifa, como los pisos de un edificio:</p>
<div class="tablewrap narrow"><table>
<thead><tr><th>Base gravable anual (UVT)</th><th>Tarifa marginal</th><th>Impuesto</th></tr></thead>
<tbody>
<tr><td class="num">0 a 1.090</td><td class="num">0 %</td><td>0</td></tr>
<tr><td class="num">1.090 a 1.700</td><td class="num">19 %</td><td>(base − 1.090) × 19 %</td></tr>
<tr><td class="num">1.700 a 4.100</td><td class="num">28 %</td><td>(base − 1.700) × 28 % + 116 UVT</td></tr>
<tr><td class="num">4.100 a 8.670</td><td class="num">33 %</td><td>(base − 4.100) × 33 % + 788 UVT</td></tr>
<tr><td class="num">8.670 a 18.970</td><td class="num">35 %</td><td>(base − 8.670) × 35 % + 2.296 UVT</td></tr>
<tr><td class="num">18.970 a 31.000</td><td class="num">37 %</td><td>(base − 18.970) × 37 % + 5.901 UVT</td></tr>
<tr><td class="num">más de 31.000</td><td class="num">39 %</td><td>(base − 31.000) × 39 % + 10.352 UVT</td></tr>
</tbody></table></div>
<p>La <span class="term">tarifa marginal</span> es la que se paga sobre el último peso. La <span class="term">tarifa media</span> es el impuesto total dividido entre el ingreso, y siempre es menor. Antes de llegar a la base gravable se restan los aportes obligatorios, las deducciones y las rentas exentas, con topes (entre ellos, una renta exenta de 25 % del ingreso laboral y un límite conjunto de 40 % del ingreso neto y 1.340 UVT al año).</p>
<div class="box myth">
<p class="m"><b>Mito</b>«No me conviene que me suban el sueldo porque paso a otro rango y pago más impuesto».</p>
<p class="r"><b>Realidad</b>Con una tabla marginal, solo los pesos que pasan a un tramo superior pagan la tarifa mayor. Un aumento siempre deja más dinero en el bolsillo. Con un salario de $8 millones, un aumento de $500.000 al mes deja, después de aportes y renta, unos $4,7 millones más al año.</p>
</div>
<div class="sim" data-sim="renta-marginal" data-title="Renta de un asalariado: tarifa marginal, tarifa media y el efecto de un aumento"></div>
<div class="sim-guide"><ul>
<li>La estimación es simplificada (asalariado, 12 salarios, deducciones básicas). Sirve para entender la mecánica, no para presentar la declaración.</li>
<li>Con un salario de $8 millones al mes, la base gravable queda cerca de 1.250 UVT y el impuesto ronda $1,6 millones al año: una tarifa media de apenas 1,7 %, aunque la marginal sea 19 %.</li>
<li>Pruebe el aumento: el impuesto adicional es una fracción del aumento, nunca más que el aumento.</li>
</ul></div>
<div class="box co"><p><b>Datos tributarios de referencia (octubre de 2026).</b> UVT 2026: $52.374 (Resolución DIAN 000238 de 2025). Deben declarar renta, entre otros, quienes en el año tengan ingresos brutos de 1.400 UVT o más, o un patrimonio bruto de 4.500 UVT o más al 31 de diciembre, o consumos con tarjeta de crédito, compras o consignaciones de 1.400 UVT o más. Para el año gravable 2025, declarado en 2026, se usa la UVT de 2025 ($49.799): 1.400 UVT = $69.718.600 y 4.500 UVT = $224.095.500. El gravamen a los movimientos financieros (4×1000) tiene una exención para retiros de hasta 350 UVT al mes ($18.330.900 en 2026) en una sola cuenta marcada. Los aportes voluntarios a pensión y a cuentas AFC pueden ser renta exenta con topes y requisitos de permanencia. Verifique siempre con la DIAN o con un contador, porque las normas cambian.</p></div>
<div class="box teach"><p><b>El edificio de los impuestos.</b> Dibuje en el tablero un edificio de siete pisos con las tarifas de la tabla. Explique que el ingreso «sube» por el edificio y que cada piso cobra solo por los pesos que están en él. Luego pida que calculen el impuesto de tres bases distintas a mano y verifiquen con la simulación. El mito del «cambio de rango» desaparece en diez minutos.</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>El capital humano (valor presente de los ingresos futuros) es el mayor activo de una persona joven. Se protege, se invierte en él y se diversifica.</li>
<li>La formación se evalúa con VPN y TIR. El dato clave, y más incierto, es el aumento salarial esperado.</li>
<li>En una negociación conviene anclar con una cifra concreta y justificada y negociar el paquete completo.</li>
<li>Un contrato independiente debe pagar del orden de 1,4 a 1,5 veces un salario equivalente.</li>
<li>La renta es progresiva por tramos: la tarifa marginal solo aplica a los pesos del tramo. Un aumento nunca reduce el ingreso disponible.</li>
</ul></div>
<div class="box do"><ul>
<li>Calcule su capital humano con la simulación 15.1. ¿Está protegido con seguros si alguien depende de él?</li>
<li>Investigue el rango salarial de su cargo en el mercado.</li>
<li>Revise si está obligado a declarar renta y si tiene marcada una cuenta exenta del 4×1000.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Con base gravable de 2.000 UVT, ¿cuánto impuesto se paga? ¿Cuál es la tarifa media sobre la base?
<details><summary>Respuesta</summary><p>\((2.000-1.700)\times28\,\%+116=84+116=200\) UVT. Tarifa media: \(200/2.000=10\,\%\), aunque la marginal sea 28 %.</p></details></li>
<li><span class="lvl">Básico</span>Un contratista factura $6 millones al mes. ¿Cuánto paga aproximadamente de salud y pensión?
<details><summary>Respuesta</summary><p>IBC: 40 % de 6 millones = $2,4 millones. Salud 12,5 % ($300.000) y pensión 16 % ($384.000): $684.000, unos 11,4 % del ingreso, más la ARL.</p></details></li>
<li><span class="lvl">Intermedio</span>Un posgrado cuesta $20 millones hoy y sube el salario en $600.000 al mes durante 25 años. Con 6 % de descuento anual, ¿vale la pena?
<details><summary>Respuesta</summary><p>Aumento anual $7,2 millones. VP de 25 años al 6 %: \(7{,}2\times[1-1{,}06^{-25}]/0{,}06\approx92\) millones. VPN \(\approx\) $72 millones: vale la pena si el aumento es realista.</p></details></li>
<li><span class="lvl">Intermedio</span>Una oferta como empleado paga $4 millones con todas las prestaciones. ¿Cuánto debería pagar, como mínimo, un contrato de prestación de servicios equivalente?
<details><summary>Respuesta</summary><p>Con la regla de 1,4 a 1,5 veces: entre $5,6 y $6 millones al mes. La cifra exacta depende de la duración del contrato y de los meses sin trabajo.</p></details></li>
<li><span class="lvl">Avanzado</span>Muestre que, con una tabla de tarifas marginales crecientes y continua, el impuesto total es una función creciente del ingreso y la tarifa media nunca supera a la marginal.
<details><summary>Respuesta</summary><p>El impuesto es \(R(b)=\int_0^b t(x)\,\dd x\), con \(t\ge0\) creciente: \(R\) es creciente y convexa. La tarifa media es \(R(b)/b=\frac1b\int_0^b t(x)\,\dd x\le t(b)\), porque el promedio de una función creciente en \([0,b]\) no supera su valor final.</p></details></li>
</ol>
