<template class="chapter-src" data-id="tiempo" data-num="9" data-title="El valor del dinero en el tiempo" data-part="Parte II · Las matemáticas del dinero" data-short="Valor presente y costo de oportunidad; anualidades y perpetuidades; valor presente neto y tasa interna de retorno; contado o a cuotas; una calculadora financiera completa">
<p class="lead">Un millón hoy no vale lo mismo que un millón dentro de un año. Con esa idea se comparan créditos, inversiones, negocios, seguros y pensiones. Este capítulo da las herramientas que usa cualquier analista financiero: valor presente, anualidades, valor presente neto (VPN) y tasa interna de retorno (TIR). Las convierte en preguntas cotidianas, como si conviene pagar de contado o a cuotas o cuánto vale hoy una renta mensual.</p>

<section>
<h2>Un peso hoy vale más que un peso mañana</h2>
<p>Hay tres razones. La primera es el <span class="term">costo de oportunidad</span>: el peso de hoy se puede invertir y convertirse en más de un peso. La segunda es la inflación, que reduce lo que compra el peso de mañana. La tercera es el riesgo, porque la promesa de pagar mañana puede no cumplirse. Las tres se resumen en una <span class="term">tasa de descuento</span> \(i\), y con ella se trae cualquier valor futuro al presente:</p>
<div class="eq key" data-name="Valor presente">\[\VP=\frac{\VF}{(1+i)^{n}} .\]</div>
<p>La tasa de descuento correcta es la rentabilidad de la mejor alternativa con riesgo parecido. Para una persona con deudas caras, su mejor «inversión» es pagarlas, y su tasa de descuento es la tasa de esas deudas. Para quien no tiene deudas, es la rentabilidad de un CDT o de su portafolio.</p>
<div class="box ex"><p>Le ofrecen $12.000.000 dentro de 3 años o $9.000.000 hoy. Si su alternativa es un CDT al 10 % E.A., el valor presente de la oferta futura es \(12.000.000/1{,}1^{3}\approx\) $9.015.778, apenas mejor que los 9 millones de hoy. Si su alternativa es pagar una tarjeta al 27 %, el valor presente es \(12.000.000/1{,}27^{3}\approx\) $5.858.000: los 9 millones de hoy valen mucho más.</p></div>
</section>

<section>
<h2>Anualidades y perpetuidades</h2>
<p>Una <span class="term">anualidad</span> es una serie de pagos iguales a intervalos regulares: las cuotas de un crédito, un arriendo, una pensión. Su valor presente es la suma de una serie geométrica:</p>
<div class="eq key" data-name="Valor presente de una anualidad vencida">\[\VP=A\,\frac{1-(1+i)^{-n}}{i}\qquad\Longleftrightarrow\qquad A=\VP\,\frac{i}{1-(1+i)^{-n}} .\]</div>
<p>La segunda forma es la fórmula de la cuota fija de un crédito (capítulo 10). Si los pagos no terminan nunca, se tiene una <span class="term">perpetuidad</span>, y si además crecen a una tasa \(g\lt i\), una perpetuidad creciente:</p>
<div class="eq">\[\VP_{\text{perpetuidad}}=\frac{A}{i},\qquad \VP_{\text{creciente}}=\frac{A}{i-g} .\]</div>
<p>La perpetuidad sirve para estimar cuánto capital hace falta para vivir de las rentas: con 4 % real anual, una renta de $3.000.000 mensuales ($36 millones al año) exige \(36/0{,}04=\) $900 millones. Es el origen de la «regla del 4 %» del capítulo 23.</p>
<div class="sim" data-sim="anualidad" data-title="Calculadora financiera: valor presente, valor futuro, cuota, plazo y tasa"></div>
<div class="sim-guide"><ul>
<li>Elija qué quiere calcular. Las otras variables se fijan con los deslizadores. Es la misma lógica de <code class="f">VA</code>, <code class="f">VF</code>, <code class="f">PAGO</code>, <code class="f">NPER</code> y <code class="f">TASA</code> en la hoja de cálculo, y debajo aparece la fórmula exacta para copiar.</li>
<li>Pregunta típica: «¿cuánto me prestan si puedo pagar $800.000 al mes durante 5 años al 1,5 % mensual?». Calcule el valor presente.</li>
<li>Otra: «¿a qué tasa me están prestando si recibo $10 millones y pago 24 cuotas de $520.000?». Calcule la tasa: 1,85 % mensual, unos 24,7 % E.A.</li>
</ul></div>
</section>

<section>
<h2>Valor presente neto y tasa interna de retorno</h2>
<p>Cuando los flujos no son iguales (un negocio, un posgrado, una inversión en finca raíz) se trae cada uno al presente y se suman, incluida la inversión inicial con signo negativo:</p>
<div class="eq key" data-name="VPN y TIR">\[\VPN(i)=\sum_{t=0}^{n}\frac{F_t}{(1+i)^{t}},\qquad \VPN(\TIR)=0 .\]</div>
<p>Regla de decisión: si el VPN a la tasa de descuento es positivo, el proyecto crea valor frente a la alternativa; si es negativo, la destruye. La TIR es la tasa a la que el proyecto «rinde»: si supera la tasa de descuento, el VPN es positivo.</p>
<div class="box ex"><p>Montar un pequeño negocio exige $30 millones y se esperan flujos netos de 6, 8, 9, 10 y 12 millones en los próximos cinco años. A una tasa de descuento de 11 % el VPN es \(\approx\) $2,19 millones y la TIR es \(\approx13{,}56\,\%\). Vale la pena si la alternativa rinde 11 %, y deja de valer si la alternativa rinde más de 13,56 %, o si los flujos esperados son optimistas.</p></div>
<div class="sim" data-sim="linea-tiempo" data-title="Línea de tiempo de un proyecto: VPN y TIR"></div>
<div class="sim-guide"><ul>
<li>Arriba, cada barra es un flujo: rojo lo que sale, verde lo que entra. La línea punteada muestra cuánto vale cada flujo hoy: cuanto más lejos, más se encoge.</li>
<li>Abajo, el perfil del VPN según la tasa. Donde corta el cero está la TIR.</li>
<li>Reduzca los flujos de los últimos años: el VPN cae poco, porque esos flujos ya estaban muy descontados. Los primeros años pesan más.</li>
</ul></div>
<div class="box warn"><p>La TIR tiene trampas. Con flujos que cambian de signo varias veces puede haber más de una TIR, o ninguna. Además, compara mal proyectos de distinto tamaño: un proyecto con TIR de 50 % que gana $100.000 vale menos que uno con TIR de 20 % que gana $10 millones. Para decidir entre alternativas excluyentes, el VPN es el criterio correcto.</p></div>
<div class="box xl"><p>En la hoja de cálculo, <code class="f">=VNA(tasa; flujos_1_a_n) + flujo_0</code> da el VPN, porque <code class="f">VNA</code> descuenta el primer valor un periodo. Por eso la inversión inicial (año 0) se suma aparte. <code class="f">=TIR(flujos_0_a_n)</code> da la tasa interna de retorno. Con los datos del ejemplo en B1:B6 (de −30.000.000 a 12.000.000): <code class="f">=VNA(11%;B2:B6)+B1</code> da $2.187.833 y <code class="f">=TIR(B1:B6)</code> da 13,56 %.</p></div>
</section>

<section>
<h2>¿De contado o a cuotas?</h2>
<p>«Sin interés» casi nunca es gratis: a menudo el precio a cuotas es mayor que el de contado, o se renuncia a un descuento. La pregunta correcta es qué tasa implícita se paga por diferir el pago, y eso se responde con la función <code class="f">TASA</code>: recibir hoy el producto (que vale el precio de contado) y pagar las cuotas.</p>
<div class="sim" data-sim="contado-cuotas" data-title="Precio de contado frente a cuotas: la tasa escondida"></div>
<div class="sim-guide"><ul>
<li>Con un televisor de $2.000.000 de contado y 12 cuotas de $185.000 (que suman $2.220.000), la tasa implícita es 1,64 % mensual, unos 21,6 % E.A.</li>
<li>Pruebe «12 cuotas sin interés» con 10 % de descuento de contado: la tasa implícita es cercana a 1,7 % mensual. Renunciar al descuento equivale a pedir un crédito caro.</li>
<li>Si el precio de contado y la suma de las cuotas son iguales, sin descuento, la tasa es cero y las cuotas sí convienen, siempre que se paguen a tiempo y no se usen como excusa para comprar lo que no se necesita.</li>
</ul></div>
<div class="box teach"><p><b>Taller de anuncios «sin interés».</b> Lleve tres anuncios de electrodomésticos con precio de contado y precio a cuotas. En grupos, calculen la tasa implícita con la hoja de cálculo (<code class="f">=TASA(n; -cuota; contado)</code>) y conviértanla a E.A. Comparen con la tasa de usura del mes. Es uno de los ejercicios que más cambian la manera de comprar de los estudiantes.</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>\(\VP=\VF/(1+i)^n\). La tasa de descuento es el costo de oportunidad: la rentabilidad de la mejor alternativa con riesgo parecido.</li>
<li>Anualidad: \(\VP=A[1-(1+i)^{-n}]/i\). Perpetuidad: \(A/i\). Creciente: \(A/(i-g)\).</li>
<li>VPN positivo crea valor; la TIR es la tasa que hace cero el VPN. Para elegir entre alternativas, el VPN manda.</li>
<li>«Sin interés» puede esconder una tasa: compare siempre contado con cuotas usando <code class="f">TASA</code>.</li>
<li>Funciones: <code class="f">VA</code>, <code class="f">VF</code>, <code class="f">PAGO</code>, <code class="f">NPER</code>, <code class="f">TASA</code>, <code class="f">VNA</code>, <code class="f">TIR</code>.</li>
</ul></div>
<div class="box do"><ul>
<li>Busque una compra a cuotas que haya hecho y calcule su tasa implícita.</li>
<li>Con la calculadora 9.1, calcule cuánto capital necesitaría para una renta mensual de su elección.</li>
<li>Defina cuál es su tasa de descuento personal hoy: ¿su deuda más cara o su mejor inversión?</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Cuánto vale hoy un pago de $20.000.000 dentro de 5 años con una tasa de 8 % E.A.?
<details><summary>Respuesta</summary><p>\(20.000.000/1{,}08^{5}\approx\) $13.611.664.</p></details></li>
<li><span class="lvl">Básico</span>¿Qué cuota mensual paga un crédito de $15.000.000 a 36 meses al 1,4 % mensual?
<details><summary>Respuesta</summary><p>\(A=15.000.000\times0{,}014/(1-1{,}014^{-36})\approx\) $533.300. En la hoja: <code class="f">=PAGO(1,4%;36;15000000)</code>.</p></details></li>
<li><span class="lvl">Intermedio</span>Un arriendo de $1.500.000 mensuales que sube con la inflación (4 % anual) se quiere valorar como perpetuidad creciente con una tasa de 10 % anual. ¿Cuánto vale?
<details><summary>Respuesta</summary><p>Renta anual: $18.000.000. \(\VP=18.000.000/(0{,}10-0{,}04)=\) $300.000.000. Es una forma rápida de estimar el valor de un inmueble arrendado, antes de costos.</p></details></li>
<li><span class="lvl">Intermedio</span>Pagar $3.600.000 de contado o 6 cuotas de $640.000. ¿Qué tasa mensual implícita tiene la compra a cuotas?
<details><summary>Respuesta</summary><p>Se resuelve \(3.600.000=640.000\,[1-(1+i)^{-6}]/i\): \(i\approx1{,}88\,\%\) mensual, unos 25 % E.A.: una tasa de tarjeta de crédito, no muy lejos del techo de usura de octubre de 2026.</p></details></li>
<li><span class="lvl">Avanzado</span>Muestre que el VPN de una perpetuidad creciente diverge si \(g\ge i\) y explique por qué eso no ocurre en la realidad.
<details><summary>Respuesta</summary><p>\(\sum_{t\ge1}A(1+g)^{t-1}/(1+i)^t=\frac{A}{1+i}\sum q^{t-1}\) con \(q=(1+g)/(1+i)\). Si \(q\ge1\) la serie no converge. En la realidad ningún flujo puede crecer para siempre más rápido que la tasa de descuento: terminaría siendo mayor que toda la economía.</p></details></li>
</ol>
