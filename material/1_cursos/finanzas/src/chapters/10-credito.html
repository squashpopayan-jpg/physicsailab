<template class="chapter-src" data-id="credito" data-num="10" data-title="Créditos y tablas de amortización" data-part="Parte II · Las matemáticas del dinero" data-short="Cómo se paga un crédito; cuota fija y abono constante a capital; la tabla de amortización; abonos extraordinarios para reducir plazo o cuota; créditos en pesos y en UVR; seguros y derechos del deudor">
<p class="lead">Un crédito de vivienda puede ser la decisión financiera más grande de una vida. Aun así, mucha gente firma sin saber cuánto de cada cuota va a intereses ni cuánto ahorraría con un abono extra. Este capítulo abre la caja: cómo se arma una tabla de amortización, por qué al principio casi todo es interés, qué cambia entre pagar cuota fija o abono constante y qué conviene más, en pesos o en UVR.</p>

<section>
<h2>Cómo se paga un crédito</h2>
<p>En cada periodo, el banco cobra interés sobre el <b>saldo</b> que se le debe. La cuota que se paga tiene dos partes: el interés del periodo y un <span class="term">abono a capital</span>, que es lo único que reduce la deuda.</p>
<div class="eq key" data-name="Mecánica de cada cuota">\[\text{interés}_k=i\cdot S_{k-1},\qquad \text{abono}_k=\text{cuota}_k-\text{interés}_k,\qquad S_k=S_{k-1}-\text{abono}_k .\]</div>
<p>La <span class="term">tabla de amortización</span> es la lista de esas cuentas, periodo por periodo, hasta que el saldo llega a cero. Toda entidad financiera debe entregarla al desembolsar un crédito, y se puede pedir en cualquier momento.</p>
</section>

<section>
<h2>Cuota fija y abono constante a capital</h2>
<p>En el sistema de <span class="term">cuota fija</span> (o sistema francés), todas las cuotas son iguales. Es una anualidad, así que la cuota sale de la fórmula del capítulo 9:</p>
<div class="eq">\[\text{cuota}=P\,\frac{i}{1-(1+i)^{-n}} .\]</div>
<p>Como el interés se calcula sobre un saldo que al principio es enorme, las primeras cuotas son casi todo interés y el abono a capital es pequeño. Con el tiempo la proporción se invierte.</p>
<div class="box ex"><p>Un crédito de vivienda de $150.000.000 a 20 años con 12,5 % E.A. (0,986 % mensual) tiene una cuota de $1.634.542. En la primera cuota, $1.479.537 son intereses (91 %) y solo $155.005 reducen la deuda. El abono a capital supera al interés recién en la cuota 171, después de 14 años. En total se pagan $392,3 millones: $242,3 millones de intereses, más de una vez y media lo prestado.</p></div>
<p>En el sistema de <span class="term">abono constante a capital</span> (o sistema alemán), lo fijo es el abono: \(P/n\) cada periodo. La cuota empieza alta y va bajando, porque el interés sobre un saldo cada vez menor también baja. En total se pagan menos intereses, porque la deuda se reduce más rápido al comienzo. Así difieren las compras muchas tarjetas de crédito en Colombia.</p>
<div class="sim" data-sim="amortizacion" data-title="Tabla de amortización: cuota fija frente a abono constante"></div>
<div class="sim-guide"><ul>
<li>Las barras muestran cada cuota dividida en interés (rojo) y abono a capital (azul). Con cuota fija, el rojo domina los primeros años.</li>
<li>Cambie al abono constante: la primera cuota sube (de $1,63 a $2,10 millones en el ejemplo) pero el total de intereses baja de $242 a $178 millones.</li>
<li>Acorte el plazo a 10 años: la cuota sube, pero los intereses totales caen a menos de la mitad. El plazo es la palanca más poderosa.</li>
<li>La tabla de abajo es la misma que entrega el banco. Recórrala para ver cómo cambia la proporción.</li>
</ul></div>
<div class="box xl"><p>Las funciones <code class="f">PAGOINT(tasa; periodo; nper; va)</code> y <code class="f">PAGOPRIN(tasa; periodo; nper; va)</code> dan el interés y el abono a capital de una cuota cualquiera del sistema de cuota fija. En inglés son <code class="f">IPMT</code> y <code class="f">PPMT</code>. Para armar la tabla completa basta una fila por mes con saldo inicial, interés <code class="f">=saldo*tasa</code>, abono <code class="f">=cuota-interés</code> y saldo final <code class="f">=saldo-abono</code>, y arrastrar hacia abajo.</p></div>
</section>

<section>
<h2>Abonos extraordinarios: menos plazo o menos cuota</h2>
<p>Un abono extraordinario va completo a capital, así que deja de generar intereses desde ese mismo día y durante todo el resto del crédito. Por eso los abonos tempranos valen mucho más que los tardíos. Al abonar se puede pedir una de dos cosas:</p>
<ul>
<li><b>Reducir el plazo</b>: la cuota sigue igual y el crédito termina antes. Es lo que más ahorra en intereses.</li>
<li><b>Reducir la cuota</b>: el plazo sigue igual y las cuotas bajan. Ahorra menos, pero alivia el flujo mensual.</li>
</ul>
<div class="sim" data-sim="abonos" data-title="¿Cuánto ahorra un abono extra cada mes?"></div>
<div class="sim-guide"><ul>
<li>Con $200.000 adicionales al mes en el crédito del ejemplo, reduciendo plazo, el crédito termina en 14 años en vez de 20 y se ahorran unos $85 millones en intereses.</li>
<li>Pase a «reducir cuota»: el ahorro baja a unos $35 millones. La diferencia es el precio de la flexibilidad.</li>
<li>Agregue una prima anual (por ejemplo, la prima de diciembre) y mire cuántos años más se ganan.</li>
</ul></div>
<div class="box co"><p>La Ley 1555 de 2012 permite a los consumidores pagar anticipadamente sus créditos, total o parcialmente, sin sanciones ni penalidades, para créditos de hasta 880 salarios mínimos. El deudor puede elegir si el abono reduce el plazo o el valor de la cuota. Pida siempre por escrito la aplicación del abono y la nueva tabla de amortización.</p></div>
<div class="box warn"><p>Antes de abonar a una hipoteca, revise el orden de prioridades del capítulo 22: primero el fondo de emergencia y las deudas más caras. Abonar a un crédito al 12 % mientras se paga una tarjeta al 28 % es contabilidad mental del capítulo 3. Tampoco conviene dejarse sin liquidez: el dinero abonado a una hipoteca no se puede sacar en una emergencia.</p></div>
</section>

<section>
<h2>¿En pesos o en UVR?</h2>
<p>En Colombia los créditos de vivienda pueden pactarse en pesos o en <span class="term">UVR</span>. En un crédito en UVR, la deuda y las cuotas se fijan en unidades de valor real, que se ajustan cada día con la inflación (capítulo 8), y la tasa de interés es una tasa real, más baja que la de pesos. La cuota en pesos arranca más baja que la de un crédito en pesos, pero sube con la inflación todos los años. Al principio, el saldo en pesos puede incluso crecer.</p>
<div class="sim" data-sim="uvr-pesos" data-title="El mismo crédito en pesos y en UVR"></div>
<div class="sim-guide"><ul>
<li>Con 7,5 % real más 4,5 % de inflación (cerca de 12,3 % nominal, casi la misma tasa del crédito en pesos), la cuota inicial en UVR es de unos $1,19 millones, frente a $1,63 millones en pesos.</li>
<li>La cuota en UVR crece con la inflación y termina cerca de $2,86 millones. El saldo en pesos sube los primeros años y llega a unos $163 millones antes de empezar a bajar.</li>
<li>Suba la inflación a 10 %: el crédito en UVR se encarece mucho, porque el deudor asume el riesgo de inflación. En pesos, ese riesgo lo asume el banco, y por eso cobra una tasa mayor.</li>
</ul></div>
<p>¿Cuál conviene? Depende de la inflación futura, que nadie conoce, y de si el ingreso del deudor sube con ella. La UVR facilita la entrada (cuota inicial menor) y tiene sentido si el ingreso crece al menos con la inflación. El crédito en pesos da certeza: la cuota nunca sube. A igualdad de tasa real esperada, la decisión es sobre quién asume el riesgo de inflación.</p>
</section>

<section>
<h2>Seguros y costo total</h2>
<p>Los créditos de vivienda exigen seguros de vida para el deudor y de incendio y terremoto para el inmueble, que se cobran con la cuota. Los créditos de consumo suelen incluir seguro de vida. Esos cobros aumentan el costo efectivo (capítulo 7). El deudor tiene derecho a presentar una póliza propia que cumpla las condiciones del crédito, endosada a favor del banco, en lugar de la que este ofrece. A veces resulta más barata.</p>
<div class="box teach"><p><b>Construir la tabla a mano.</b> Antes de mostrar la simulación, pida a los estudiantes que construyan en una hoja de cálculo la tabla de un crédito pequeño ($5.000.000, 12 meses, 2 % mensual), fila por fila, con las fórmulas de saldo, interés, abono y nuevo saldo. Cuando la terminen, pídales que cambien la tasa y el plazo. Haber armado la tabla una vez quita para siempre el misterio de los extractos.</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>Cada cuota paga el interés sobre el saldo y abona el resto a capital. Solo el abono reduce la deuda.</li>
<li>Con cuota fija, las primeras cuotas son casi todo interés. Con abono constante, la cuota empieza más alta, baja con el tiempo y se pagan menos intereses.</li>
<li>El plazo es la palanca más poderosa: a más plazo, cuota menor y muchos más intereses.</li>
<li>Los abonos extraordinarios tempranos ahorran mucho; reducir plazo ahorra más que reducir cuota. En Colombia se puede prepagar sin penalidad (Ley 1555 de 2012).</li>
<li>En UVR la cuota empieza más baja y sube con la inflación; el deudor asume el riesgo de inflación.</li>
</ul></div>
<div class="box do"><ul>
<li>Pida a su entidad la tabla de amortización de su crédito y ubique en qué cuota va y cuánto abona a capital cada mes.</li>
<li>Simule con 9.1 y 10.2 qué pasaría con un abono mensual pequeño a su deuda más cara.</li>
<li>Revise el costo de los seguros de su crédito y cotice una póliza propia.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Un crédito de $12.000.000 a 24 meses al 1,5 % mensual con cuota fija. ¿Cuál es la cuota? ¿Cuánto interés y cuánto abono tiene la primera?
<details><summary>Respuesta</summary><p>Cuota: \(12.000.000\times0{,}015/(1-1{,}015^{-24})\approx\) $599.090. Interés de la primera: \(0{,}015\times12.000.000=\) $180.000; abono: $419.090.</p></details></li>
<li><span class="lvl">Básico</span>El mismo crédito con abono constante a capital: ¿cuál es la primera cuota y cuál la última?
<details><summary>Respuesta</summary><p>Abono: $500.000 por mes. Primera: 500.000 + 180.000 = $680.000. Última: el saldo antes de pagarla es $500.000, así que el interés es $7.500 y la cuota es $507.500.</p></details></li>
<li><span class="lvl">Intermedio</span>Muestre que, con abono constante, el total de intereses es \(i\,P\,(n+1)/2\).
<details><summary>Respuesta</summary><p>Los saldos antes de cada pago son \(P, P(n-1)/n,\dots,P/n\); suman \(\frac{P}{n}\cdot\frac{n(n+1)}{2}=P\frac{n+1}{2}\). Multiplicando por \(i\) se obtiene el total de intereses.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Por qué un abono de $1.000.000 en el mes 6 de una hipoteca a 20 años ahorra muchos más intereses que el mismo abono en el mes 200?
<details><summary>Respuesta</summary><p>El abono deja de generar intereses durante todo el resto del crédito. En el mes 6 quedan 234 meses: el millón habría crecido a \(1{,}00986^{234}\approx10\) millones de pesos equivalentes. En el mes 200 quedan 40 meses, y el factor es apenas \(\approx1{,}48\).</p></details></li>
<li><span class="lvl">Avanzado</span>En un crédito en UVR con tasa real \(r\) e inflación constante \(\pi\), ¿cuál es la tasa nominal equivalente? ¿Por qué el saldo en pesos puede subir al principio?
<details><summary>Respuesta</summary><p>Nominal: \((1+r)(1+\pi)-1\). El saldo en UVR baja desde el primer mes, pero muy poco al principio (casi toda la cuota es interés real). Si la inflación hace crecer la UVR más rápido de lo que baja el saldo en unidades, el saldo en pesos sube.</p></details></li>
</ol>
