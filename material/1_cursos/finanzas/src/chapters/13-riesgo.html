<template class="chapter-src" data-id="riesgo" data-num="13" data-title="Fondo de emergencia, riesgo y seguros" data-part="Parte III · La economía del hogar" data-short="Los riesgos de un hogar y cómo gestionarlos; el fondo de emergencia simulado; cómo funciona un seguro y por qué conviene aunque pierda en promedio; qué asegurar y qué no; cuánto seguro de vida">
<p class="lead">Un plan financiero sin protección es un castillo de naipes: funciona hasta que llega el primer imprevisto. Este capítulo trata la parte menos glamorosa y más importante del oficio de planificador, la gestión del riesgo. Responde dos preguntas con números: cuánto colchón hace falta y qué seguros valen la pena. La segunda tiene una respuesta matemática bonita: un seguro es una apuesta que se pierde en promedio y que, aun así, puede ser la mejor decisión.</p>

<section>
<h2>Los riesgos de un hogar</h2>
<p>Un hogar enfrenta tres tipos de riesgo financiero: perder el ingreso (desempleo, enfermedad, incapacidad), tener gastos inesperados (salud, reparaciones, un familiar en apuros) y sufrir catástrofes (muerte de quien sostiene el hogar, invalidez, incendio, terremoto, una demanda). La gestión profesional del riesgo los ordena según su probabilidad y su impacto:</p>
<div class="tablewrap"><table>
<thead><tr><th></th><th>Impacto pequeño</th><th>Impacto grande</th></tr></thead>
<tbody>
<tr><td><b>Frecuente</b></td><td><b>Retener</b> con el presupuesto: reparaciones menores, consultas médicas</td><td><b>Evitar o reducir</b>: no prestar dinero a quien no paga, manejar con cuidado</td></tr>
<tr><td><b>Raro</b></td><td><b>Retener</b> con el fondo de emergencia: celular dañado, un mes sin trabajo</td><td><b>Transferir</b> con un seguro: muerte, invalidez, incendio, enfermedad grave</td></tr>
</tbody></table></div>
<p>La regla que resume la tabla es simple: <b>asegure lo que no podría pagar y pague usted lo que sí puede</b>. El fondo de emergencia es un seguro propio, sin prima ni papeleo, para los golpes medianos.</p>
</section>

<section>
<h2>El fondo de emergencia</h2>
<p>La recomendación habitual es tener entre <b>3 y 6 meses de gastos esenciales</b> en dinero disponible. Conviene acercarse a 6 meses, o más, cuando el ingreso es variable (independientes, comisionistas), cuando hay un solo ingreso en el hogar, cuando hay dependientes o cuando se trabaja en un sector inestable. Debe estar en un lugar <b>seguro, líquido y separado</b>: una cuenta de ahorros distinta de la del día a día, CDT cortos escalonados o fondos de inversión colectiva a la vista de bajo riesgo.</p>
<div class="sim" data-sim="emergencia" data-title="Diez años de imprevistos: ¿cuánto colchón hace falta?"></div>
<div class="sim-guide"><ul>
<li>Cada línea es una vida simulada mes a mes durante diez años, con probabilidad de perder el empleo y de tener gastos inesperados. Cuando el colchón no alcanza, la diferencia se cubre con tarjeta de crédito.</li>
<li>Sin colchón, casi todas las vidas terminan endeudadas en algún momento. Con tres meses, alrededor de la mitad. Con seis, menos de un tercio, con los supuestos iniciales.</li>
<li>Suba la probabilidad de desempleo o su duración (un independiente o un sector en crisis): el colchón necesario crece. Fíjese en los intereses acumulados: el colchón «rinde» lo que ahorra en intereses de tarjeta.</li>
</ul></div>
<div class="box co"><p>Al terminar un contrato laboral, las <b>cesantías</b> se pueden retirar del fondo, y por eso funcionan como un colchón adicional para el desempleo. El Mecanismo de Protección al Cesante (Ley 1636 de 2013), administrado por las cajas de compensación, da durante algunos meses aportes a salud y pensión y otros beneficios limitados, pero no reemplaza el salario. Los depósitos en bancos y otras entidades inscritas están protegidos por el seguro de Fogafín hasta $50 millones por persona y por entidad. Los fondos de inversión colectiva no son depósitos y no tienen ese seguro, aunque sus activos están separados de los de la sociedad que los administra.</p></div>
<div class="box myth">
<p class="m"><b>Mito</b>«Tener plata quieta en un fondo de emergencia es desperdiciarla».</p>
<p class="r"><b>Realidad</b>El colchón no se juzga por su rentabilidad sino por lo que evita: préstamos al 2 % mensual, vender inversiones en el peor momento, decisiones desesperadas en el túnel de la escasez (capítulo 2). Es un seguro, y como todo seguro, «pierde» casi todos los años y gana el año que importa.</p>
</div>
</section>

<section>
<h2>Cómo funciona un seguro</h2>
<p>Una aseguradora reúne a muchas personas expuestas al mismo riesgo. Si cada una tiene probabilidad \(p\) de perder \(X\), la pérdida esperada por persona es \(pX\). La prima que cobra la aseguradora es esa pérdida esperada más sus gastos y su utilidad, así que <b>en promedio el asegurado pierde dinero</b>. ¿Por qué tiene sentido entonces asegurarse?</p>
<p>Porque perder la mitad del patrimonio duele mucho más que el doble de perder una cuarta parte. Con una utilidad logarítmica (capítulo 4), lo que importa no es la riqueza esperada sino la utilidad esperada, y su <span class="term">equivalente cierto</span>: la riqueza segura que daría la misma satisfacción.</p>
<div class="eq key" data-name="Utilidad esperada y equivalente cierto">\[\E[U]=p\ln(W-X)+(1-p)\ln W,\qquad \text{EC}=\ee^{\E[U]} .\]</div>
<p>El seguro conviene si la riqueza con seguro, \(W-\text{prima}\), es mayor que el equivalente cierto sin seguro. La <b>prima máxima</b> que vale la pena pagar es \(W-\text{EC}\).</p>
<div class="sim" data-sim="seguro" data-title="¿Vale la pena este seguro? Valor esperado frente a utilidad"></div>
<div class="sim-guide"><ul>
<li>Primer caso: un patrimonio de $20 millones y 2 % de probabilidad de perder $15 millones. La pérdida esperada es $300.000, pero la prima máxima razonable es cerca de $547.000. Un seguro a $350.000 conviene, aunque «pierda» $50.000 en promedio.</li>
<li>Segundo caso: cambie la pérdida a $1,5 millones con 10 % de probabilidad (un celular). La pérdida esperada es $150.000 y la prima máxima apenas $155.000. Casi ningún seguro de ese tipo vale la pena: es mejor el autoseguro.</li>
<li>Agregue un deducible: la prima baja y usted asume la parte pequeña de la pérdida, que puede pagar con su colchón.</li>
</ul></div>
<div class="box explain"><p>Un seguro no es una inversión, es una transferencia: usted le paga a alguien para que asuma un golpe que usted no podría aguantar. Por eso conviene para lo grande y raro, y no para lo pequeño y frecuente, donde la prima es casi la pérdida esperada más los costos.</p></div>
</section>

<section>
<h2>Qué asegurar y qué no</h2>
<div class="tablewrap"><table>
<thead><tr><th>Riesgo</th><th>Herramienta</th><th>Cuándo es prioritario</th></tr></thead>
<tbody>
<tr><td>Muerte de quien sostiene el hogar</td><td>Seguro de vida a término</td><td>Si hay personas que dependen de su ingreso o deudas que quedarían a la familia</td></tr>
<tr><td>Enfermedad grave</td><td>EPS; plan complementario o medicina prepagada; póliza de salud</td><td>Siempre la EPS; lo adicional según ingresos y preferencias</td></tr>
<tr><td>Invalidez</td><td>Sistema de pensiones y ARL; seguro de incapacidad</td><td>Independientes sin cobertura completa y profesiones de riesgo</td></tr>
<tr><td>Vivienda</td><td>Incendio y terremoto; hogar (contenidos y responsabilidad civil)</td><td>Obligatorio con hipoteca; recomendable si el inmueble es el principal activo</td></tr>
<tr><td>Vehículo</td><td>SOAT (obligatorio); póliza todo riesgo; responsabilidad civil</td><td>Todo riesgo si el carro vale mucho frente al patrimonio; la responsabilidad civil siempre</td></tr>
<tr><td>Pequeños daños</td><td>Garantías extendidas, seguros de celular o de electrodomésticos</td><td>Casi nunca: mejor el fondo de emergencia</td></tr>
</tbody></table></div>
<p>Para el seguro de vida, el método profesional es el de <b>necesidades</b>: calcular cuánto capital necesitaría la familia para reemplazar el ingreso durante los años en que dependerán de él, pagar las deudas y cubrir metas como la educación, y restar lo que ya existe (ahorros, otros seguros, pensión de sobrevivientes).</p>
<div class="sim" data-sim="seguro-vida" data-title="¿Cuánto seguro de vida necesita una familia?"></div>
<div class="sim-guide"><ul>
<li>El ingreso a reemplazar es el aporte de la persona al hogar, no su salario completo: sus propios gastos desaparecen.</li>
<li>El valor presente usa una tasa real moderada, porque el dinero del seguro se invertiría mientras se va usando.</li>
<li>El resultado es una suma asegurada orientativa. Un seguro de vida a término (solo protección, sin ahorro) suele ser la forma más barata de cubrirla mientras los hijos crecen.</li>
</ul></div>
<div class="box teach"><p><b>La subasta de riesgos.</b> Prepare tarjetas con riesgos (celular robado, incendio de la casa, muerte del padre con tres hijos, carro rayado, cáncer, perder el empleo). En grupos, cada uno ubica las tarjetas en la matriz de probabilidad e impacto y decide para cada una: evitar, reducir, retener o transferir. Luego compare las decisiones entre grupos. Aparecen discusiones muy ricas, por ejemplo sobre las garantías extendidas que ofrecen en las tiendas.</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>Riesgos frecuentes y pequeños se retienen con el presupuesto; raros y medianos, con el fondo de emergencia; raros y catastróficos, con seguros.</li>
<li>Fondo de emergencia: 3 a 6 meses de gastos esenciales, seguro, líquido y separado. Más si el ingreso es variable o hay dependientes.</li>
<li>El seguro pierde en promedio y conviene por la utilidad: protege contra pérdidas que no se podrían absorber.</li>
<li>Prima máxima razonable = riqueza − equivalente cierto. Para riesgos pequeños, la prima casi nunca vale la pena.</li>
<li>Seguro de vida por necesidades: valor presente del ingreso a reemplazar más deudas y metas, menos activos existentes.</li>
</ul></div>
<div class="box do"><ul>
<li>Calcule su gasto esencial mensual y cuántos meses cubre hoy su dinero disponible.</li>
<li>Haga la lista de sus seguros actuales y marque cuáles cubren riesgos catastróficos y cuáles pequeños.</li>
<li>Si alguien depende de su ingreso, calcule su necesidad de seguro de vida con la simulación 13.3.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Una familia gasta $4.200.000 al mes en lo esencial y tiene un solo ingreso, variable. ¿Qué fondo de emergencia le recomendaría?
<details><summary>Respuesta</summary><p>Hacia el extremo alto: unos 6 meses, $25.200.000, o más si el sector es inestable. Se puede construir por etapas: primero un mes, luego tres, luego seis.</p></details></li>
<li><span class="lvl">Básico</span>Un seguro de celular cuesta $18.000 al mes. El celular vale $1.200.000 y la probabilidad de robo o daño total al año es de 8 %. ¿Cuál es la pérdida esperada anual y cuánto se paga de prima?
<details><summary>Respuesta</summary><p>Pérdida esperada: $96.000 al año. Prima: $216.000 al año, más del doble. Conviene el autoseguro, salvo que perder el celular sea un golpe que no se pueda absorber.</p></details></li>
<li><span class="lvl">Intermedio</span>Con \(W=\) $50 millones, una pérdida de $40 millones con probabilidad 1 % y utilidad logarítmica, ¿cuál es la prima máxima razonable?
<details><summary>Respuesta</summary><p>\(\E[U]=0{,}01\ln(10)+0{,}99\ln(50)\) en millones; \(\text{EC}=10^{0{,}01}\times50^{0{,}99}\approx49{,}2\) millones. Prima máxima: unos $800.000, el doble de la pérdida esperada de $400.000.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Por qué un deducible alto puede ser buena idea para quien tiene un buen fondo de emergencia?
<details><summary>Respuesta</summary><p>Porque el deducible es la parte de la pérdida que se retiene. Si el colchón puede pagarla, se ahorra la parte de la prima que cubre pérdidas pequeñas, que es la más cara en proporción.</p></details></li>
<li><span class="lvl">Avanzado</span>Una persona aporta $2.500.000 al mes a su hogar y su hija menor tiene 6 años. Con 4 % real, ¿cuál es el valor presente de 16 años de ese aporte, pagado mes a mes?
<details><summary>Respuesta</summary><p>Tasa mensual \(1{,}04^{1/12}-1\approx0{,}327\,\%\); \(\VP=2.500.000\,[1-1{,}00327^{-192}]/0{,}00327\approx\) $356 millones. A eso se suman deudas y metas, y se restan los activos existentes.</p></details></li>
</ol>
