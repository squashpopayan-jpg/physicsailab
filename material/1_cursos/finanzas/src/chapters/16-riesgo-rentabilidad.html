<template class="chapter-src" data-id="riesgo-rentabilidad" data-num="16" data-title="Riesgo, rentabilidad y volatilidad" data-part="Parte IV · Invertir con método" data-short="Rentabilidad simple, total, real y en otra moneda; el riesgo como dispersión, caída y pérdida permanente; un siglo de datos de acciones, bonos, letras, vivienda y oro; media aritmética y geométrica; el horizonte; la prima de riesgo">
<p class="lead">Invertir es aceptar incertidumbre a cambio de una rentabilidad esperada mayor. Para hacerlo con criterio hay que medir las dos cosas. Este capítulo define rentabilidad y riesgo como lo hace un analista, y los pone a prueba con 98 años de datos reales de acciones, bonos, letras del Tesoro, vivienda y oro. También explica por qué la volatilidad le resta al crecimiento y por qué el horizonte lo cambia todo.</p>

<section>
<h2>Medir la rentabilidad</h2>
<p>La <span class="term">rentabilidad total</span> de un periodo incluye el cambio de precio y lo que el activo pagó en el camino (dividendos, cupones, arriendos):</p>
<div class="eq key" data-name="Rentabilidad total y anualizada">\[R=\frac{P_1-P_0+D}{P_0},\qquad R_{\text{anual}}=\Big(\prod_{k=1}^{n}(1+R_k)\Big)^{1/n}-1 .\]</div>
<p>La segunda fórmula es la <span class="term">media geométrica</span>: la tasa constante que habría producido el mismo resultado final. Es la que importa para el patrimonio. Para un inversionista colombiano que invierte en dólares, además, la rentabilidad en pesos incluye el cambio en la tasa de cambio: \((1+R_{\text{USD}})(1+\Delta_{\text{dólar}})-1\). Y para saber si se ganó poder de compra, todo se lleva a términos reales con la ecuación de Fisher (capítulo 7).</p>
</section>

<section>
<h2>¿Qué es el riesgo?</h2>
<p>En finanzas, el riesgo tiene varias caras, y conviene mirarlas todas:</p>
<ul>
<li><b>Volatilidad</b>: la desviación estándar de las rentabilidades, \(\sigma\). Mide cuánto se aleja cada año del promedio.</li>
<li><b>Caída máxima</b>: la mayor pérdida desde un máximo previo hasta un mínimo posterior. Es lo que se siente en el estómago.</li>
<li><b>Probabilidad de perder</b> en un horizonte dado: depende mucho del plazo.</li>
<li><b>Pérdida permanente</b>: cuando el dinero no vuelve. Es la empresa que quiebra, la pirámide que colapsa, la venta forzada en el peor momento. Es el riesgo que de verdad hay que evitar.</li>
</ul>
<p>Un activo volátil no necesariamente pierde dinero a largo plazo, y un activo «estable», como la cuenta de ahorros, puede perder poder de compra todos los años. El riesgo depende de para qué y para cuándo se necesita el dinero.</p>
</section>

<section>
<h2>Un siglo de datos</h2>
<p>El profesor Aswath Damodaran, de la Universidad de Nueva York, publica cada año las rentabilidades anuales de los principales activos de Estados Unidos desde 1928. Con su actualización de enero de 2026, los números de 1928 a 2025 son estos (en dólares):</p>

<p>Cien dólares invertidos en el S&amp;P 500 a comienzos de 1928, reinvirtiendo dividendos, se habrían convertido en unos 1,16 millones de dólares al final de 2025; descontada la inflación, unos 61.700 dólares de 1928. En letras del Tesoro, los mismos 100 dólares se habrían convertido en 2.578, apenas 138 en términos reales. La diferencia es la <span class="term">prima de riesgo</span>: lo que las acciones pagaron, en promedio, por aguantar su volatilidad.</p>
<div class="sim" data-sim="historia-activos" data-title="Cien dólares desde el año que usted elija: acciones, bonos, letras, vivienda y oro"></div>
<div class="sim-guide"><ul>
<li>La escala es logarítmica: una pendiente constante es una tasa de crecimiento constante. Las acciones suben con más pendiente y con caídas profundas: 1929-1932, 1973-1974, 2000-2002, 2008.</li>
<li>Active «en términos reales». Los bonos perdieron cerca de la mitad de su poder de compra entre 1940 y 1981, por la inflación. Y el oro perdió 77 % de su valor real entre 1980 y 2001, y tardó hasta 2011 en recuperar su máximo real.</li>
<li>La serie de vivienda es solo el precio de las casas, sin el arriendo que producen. Su rentabilidad real como inversión es mayor que la que muestra la curva (capítulo 21).</li>
</ul></div>
<div class="box warn"><p>Estos datos son de Estados Unidos, el mercado más exitoso del siglo XX. Hay un sesgo de supervivencia: los inversionistas de Rusia en 1917 o de Alemania en 1945 perdieron casi todo. Los estudios con muchos países (Dimson, Marsh y Staunton) muestran primas de riesgo positivas en casi todos, pero menores en promedio que la estadounidense. Mercados pequeños y concentrados, como el colombiano, han pasado más de una década sin ganancias reales. Por eso la diversificación internacional del capítulo 17 importa.</p></div>
</section>

<section>
<h2>Media aritmética y media geométrica</h2>
<p>Si una inversión gana 50 % un año y pierde 50 % el siguiente, la media aritmética es 0 %, pero el inversionista termina con \(1{,}5\times0{,}5=0{,}75\): perdió 25 %. La volatilidad le resta al crecimiento compuesto. Para rentabilidades no muy grandes vale la aproximación</p>
<div class="eq key" data-name="Arrastre de la volatilidad">\[g\approx\mu-\frac{\sigma^{2}}{2} ,\]</div>
<p>donde \(\mu\) es la media aritmética, \(\sigma\) la volatilidad y \(g\) la media geométrica. Con los datos del S&amp;P 500: \(0{,}1185-0{,}194^2/2\approx0{,}100\), muy cerca del 10,02 % observado. Por eso dos inversiones con la misma rentabilidad promedio no terminan igual: la más volátil crece menos.</p>
<div class="sim" data-sim="caminos" data-title="Doscientas trayectorias: la misma media, distinta volatilidad"></div>
<div class="sim-guide"><ul>
<li>Todas las trayectorias tienen la misma rentabilidad esperada anual. Al subir la volatilidad, el abanico se abre y la mediana (la trayectoria típica) baja.</li>
<li>El promedio de todas las trayectorias sigue creciendo a la tasa aritmética, empujado por unas pocas que terminan muy arriba. La mayoría de los inversionistas obtiene la mediana, no el promedio.</li>
<li>Con 40 % de volatilidad, una de cada varias trayectorias termina por debajo de lo invertido, aunque la rentabilidad esperada sea alta. Es la estadística de las criptomonedas y de las acciones individuales.</li>
</ul></div>
</section>

<section>
<h2>El horizonte lo cambia todo</h2>
<p>La volatilidad de un año no es la de veinte. Si las rentabilidades anuales fueran independientes, la desviación de la rentabilidad <i>anualizada</i> en \(n\) años caería como \(\sigma/\sqrt{n}\). Los datos históricos lo confirman de forma aproximada.</p>
<div class="sim" data-sim="horizonte" data-title="Todas las ventanas de N años desde 1928: ¿cuántas perdieron poder de compra?"></div>
<div class="sim-guide"><ul>
<li>Cada punto es la rentabilidad real anualizada de una ventana de \(N\) años consecutivos. Con \(N=1\), el S&amp;P 500 perdió poder de compra en 32 % de los años, con años de −38 %.</li>
<li>Con \(N=10\), 12 % de las ventanas fueron negativas, y la peor dio −3,8 % anual. Con \(N=20\), ninguna ventana perdió poder de compra; la peor ganó 0,6 % real al año.</li>
<li>Cambie a bonos del Tesoro: con 20 años, un tercio de las ventanas perdió poder de compra. Los bonos son menos volátiles año a año, pero no protegen de la inflación prolongada.</li>
</ul></div>
<div class="box myth">
<p class="m"><b>Mito</b>«La bolsa es un casino».</p>
<p class="r"><b>Realidad</b>En un casino la expectativa es negativa y no mejora con el tiempo: cuanto más se juega, más seguro es perder. Un portafolio diversificado de acciones tiene expectativa positiva, porque las empresas producen utilidades, y la probabilidad de perder baja con el horizonte. Lo que sí se parece a un casino es operar con frecuencia y con apalancamiento (capítulo 20).</p>
</div>
<div class="box teach"><p><b>La subasta de la moneda.</b> Proponga dos juegos: A paga $100.000 seguros; B lanza una moneda y paga $250.000 o $0. Pregunte cuánto pagarían por cada uno y anote. Luego repita imaginando que se juega 20 veces y se suman los resultados. La mayoría paga mucho menos por B que su valor esperado ($125.000) cuando es una sola vez, y bastante más cuando se repite. Es la intuición de la prima de riesgo y del horizonte.</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>Rentabilidad total = cambio de precio + pagos. La que importa para el patrimonio es la media geométrica, real y en la moneda en que se gasta.</li>
<li>El riesgo tiene varias caras: volatilidad, caída máxima, probabilidad de pérdida y pérdida permanente. La última es la que hay que evitar.</li>
<li>De 1928 a 2025, en Estados Unidos, las acciones rindieron 6,8 % real anual y los bonos del Tesoro 1,5 %, con volatilidades de 19 % y 8 %.</li>
<li>La volatilidad le resta al crecimiento: \(g\approx\mu-\sigma^2/2\). La mayoría obtiene la mediana, no el promedio.</li>
<li>El horizonte reduce la probabilidad de perder: ninguna ventana de 20 años del S&amp;P 500 perdió poder de compra. Pero los datos de Estados Unidos tienen sesgo de supervivencia.</li>
</ul></div>
<div class="box do"><ul>
<li>Escriba para qué y para cuándo necesita cada parte de su ahorro: menos de 2 años, 2 a 10 años, más de 10 años.</li>
<li>Con la simulación 16.3, observe qué activo habría sido adecuado para cada horizonte.</li>
<li>Pregunte la rentabilidad real y la volatilidad del fondo donde tiene sus ahorros.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Una acción se compra a $10.000, paga un dividendo de $400 y al año vale $10.800. ¿Cuál fue su rentabilidad total?
<details><summary>Respuesta</summary><p>\((10.800-10.000+400)/10.000=12\,\%\).</p></details></li>
<li><span class="lvl">Básico</span>Las rentabilidades de tres años fueron +20 %, −10 % y +15 %. Calcule la media aritmética y la geométrica.
<details><summary>Respuesta</summary><p>Aritmética: 8,33 %. Geométrica: \((1{,}2\times0{,}9\times1{,}15)^{1/3}-1=1{,}242^{1/3}-1\approx7{,}49\,\%\).</p></details></li>
<li><span class="lvl">Intermedio</span>Un fondo en dólares rindió 8 % en un año en que el dólar pasó de $4.000 a $4.300. ¿Cuál fue la rentabilidad en pesos? ¿Y si el dólar hubiera bajado a $3.800?
<details><summary>Respuesta</summary><p>Subida: \(1{,}08\times1{,}075-1=16{,}1\,\%\). Bajada: \(1{,}08\times0{,}95-1=2{,}6\,\%\). La tasa de cambio puede pesar tanto como la inversión.</p></details></li>
<li><span class="lvl">Intermedio</span>Con \(\mu=9\,\%\) y \(\sigma=30\,\%\), estime la rentabilidad geométrica. ¿Qué pasa con \(\sigma=45\,\%\)?
<details><summary>Respuesta</summary><p>\(0{,}09-0{,}09/2=4{,}5\,\%\). Con 45 %: \(0{,}09-0{,}2025/2\approx-1{,}1\,\%\): con esa volatilidad, la trayectoria típica pierde dinero aunque la media sea positiva.</p></details></li>
<li><span class="lvl">Avanzado</span>Deduzca \(g\approx\mu-\sigma^2/2\) usando \(\ln(1+R)\approx R-R^2/2\).
<details><summary>Respuesta</summary><p>\(\ln(1+g)=\E[\ln(1+R)]\approx\E[R]-\E[R^2]/2=\mu-(\sigma^2+\mu^2)/2\). Como \(\ln(1+g)\approx g-g^2/2\) y \(g\approx\mu\) a primer orden, los términos \(\mu^2/2\) se cancelan y queda \(g\approx\mu-\sigma^2/2\).</p></details></li>
</ol>
