<template class="chapter-src" data-id="vivienda" data-num="21" data-title="Vivienda: ¿comprar o arrendar?" data-part="Parte IV · Invertir con método" data-short="La casa propia como meta y como inversión; los costos reales de poseer; la comparación correcta: comprar frente a arrendar e invertir la diferencia; ahorrar la cuota inicial; el inmueble para arrendar; ¿es la casa un activo?; reglas colombianas del arriendo">
<p class="lead">«Arrendar es botar la plata» y «la casa propia es la mejor inversión» son dos de las frases más repetidas en las familias colombianas. Tienen parte de razón, pero la decisión de comprar o arrendar no se resuelve con un refrán. Depende de cuánto cuesta realmente poseer, de la tasa del crédito, de cuánto se valoriza el inmueble, de cuánto cuesta el arriendo y, sobre todo, de qué hace quien arrienda con la diferencia. Este capítulo arma la comparación completa, mes a mes.</p>

<section>
<h2>La casa: consumo, inversión y seguridad</h2>
<p>Una vivienda propia cumple tres funciones a la vez. Es <b>consumo</b>: da techo, igual que un arriendo. Es <b>inversión</b>: puede valorizarse y libera de pagar arriendo en el futuro. Y es <b>seguridad</b>: nadie puede pedirla de vuelta, se puede adaptar al gusto y da estabilidad a los hijos. La tercera función tiene valor real, pero no aparece en las cuentas. Por eso conviene hacer primero la comparación financiera y luego decidir cuánto se está dispuesto a pagar por la seguridad y la estabilidad.</p>
</section>

<section>
<h2>Los costos reales de poseer</h2>
<p>Quien compra no paga solo la cuota del crédito. Debe sumar:</p>
<ul>
<li><b>Cuota inicial</b>, que deja de estar invertida en otra parte (costo de oportunidad). Los bancos suelen financiar hasta 70 % del valor, o hasta 80 % en vivienda de interés social.</li>
<li><b>Costos de compra</b>: notaría, impuesto de registro (beneficencia), registro, estudio de títulos y avalúo, del orden de 2 % a 3 % del precio.</li>
<li><b>Intereses</b> del crédito, que en los primeros años son casi toda la cuota (capítulo 10).</li>
<li><b>Impuesto predial, mantenimiento y seguros</b>, que juntos suelen sumar entre 1 % y 2 % del valor al año, y la <b>administración</b> en propiedad horizontal.</li>
<li><b>Costos de venta</b> cuando se venda: comisión inmobiliaria, impuestos, avalúo.</li>
</ul>
<p>Quien arrienda paga el canon y, a cambio, conserva la cuota inicial y la diferencia mensual, si la hay, para invertirlas.</p>
<div class="box co"><p>La Ley 820 de 2003 regula el arrendamiento de vivienda urbana: el canon mensual no puede superar el 1 % del valor comercial del inmueble, y cada 12 meses puede aumentar como máximo lo que aumentó el IPC del año calendario anterior. En las ciudades grandes, los arriendos suelen estar entre 0,4 % y 0,6 % mensual del valor del inmueble, lo que da rentabilidades brutas por arriendo de 5 % a 7 % al año.</p></div>
</section>

<section>
<h2>La comparación correcta</h2>
<p>La comparación profesional no es «cuota frente a arriendo», sino <b>patrimonio frente a patrimonio</b> al final de un horizonte. Se simulan dos personas idénticas. Una compra con crédito. La otra arrienda, invierte la cuota inicial y los costos de compra y, cada mes, invierte la diferencia entre lo que paga la que compró (cuota más costos de poseer) y su propio arriendo. Si en algún mes poseer sale más barato que arrendar, es la compradora la que invierte la diferencia. Al final, la compradora tiene la vivienda menos el saldo del crédito y los costos de venta; la arrendataria, su portafolio.</p>
<div class="sim" data-sim="comprar-arrendar" data-title="Comprar con crédito o arrendar e invertir la diferencia"></div>
<div class="sim-guide"><ul>
<li>El escenario inicial: vivienda de $300 millones, 30 % de cuota inicial, crédito al 12,5 % E.A. a 20 años (cuota de $2,29 millones), arriendo de 0,45 % mensual del valor, valorización de 5 % y una rentabilidad de inversiones de 9 % anual. A 20 años, arrendar e invertir termina con más patrimonio.</li>
<li>Pero cambie la rentabilidad de las inversiones a 7 %: casi empatan. Suba el arriendo a 0,6 %: gana comprar. Suba la valorización a 7 %: empatan. No hay una respuesta universal: hay una respuesta para cada caso.</li>
<li>El supuesto más frágil es que quien arrienda de verdad invierta la diferencia todos los meses durante 20 años. Si la gasta, comprar gana casi siempre, porque la hipoteca funciona como un ahorro forzoso.</li>
</ul></div>
<div class="box myth">
<p class="m"><b>Mito</b>«Arrendar es botar la plata».</p>
<p class="r"><b>Realidad</b>Quien compra también «bota» plata: intereses, predial, mantenimiento, seguros y costos de compra y venta, que en los primeros años pueden superar el arriendo equivalente. Lo que se recupera como patrimonio es solo el abono a capital y la valorización. Arrendar no es botar la plata si la diferencia se invierte; sí lo es si se gasta.</p>
</div>
</section>

<section>
<h2>Ahorrar la cuota inicial</h2>
<p>La cuota inicial es la barrera de entrada más grande. Si el precio de la vivienda sube mientras se ahorra, la meta se aleja. La pregunta práctica es cuántos años de ahorro hacen falta, con qué aporte mensual y en qué instrumento, sabiendo que es una meta de mediano plazo (capítulos 18 y 22).</p>
<div class="sim" data-sim="cuota-inicial" data-title="¿Cuánto tarda en reunirse la cuota inicial?"></div>
<div class="sim-guide"><ul>
<li>La línea dorada es la cuota inicial que se necesita en cada momento: crece con la valorización. La azul es lo ahorrado.</li>
<li>Con un ahorro de $1,5 millones al mes al 9 % y una vivienda de $250 millones que se valoriza 5 % al año, la cuota inicial de 30 % se reúne en algo más de 4 años.</li>
<li>Si el ahorro rinde menos que la valorización, la meta corre más rápido que el ahorro. Pruebe un instrumento al 4 %.</li>
</ul></div>
<div class="box co"><p>Para vivienda hay herramientas específicas que conviene revisar con la entidad: cuentas AFC (ahorro para el fomento de la construcción), con beneficios tributarios si se usan para comprar vivienda; el Fondo Nacional del Ahorro, que administra cesantías y otorga créditos; las cesantías, que se pueden retirar para compra o mejora de vivienda; los subsidios de las cajas de compensación y de programas del Gobierno; y el leasing habitacional, en el que el banco compra el inmueble y se lo arrienda al cliente con opción de compra. Las condiciones de los subsidios cambian con frecuencia: verifíquelas antes de planear con ellas.</p></div>
</section>

<section>
<h2>El inmueble para arrendar como inversión</h2>
<p>Comprar para arrendar es una inversión con rentabilidad propia: el arriendo neto más la valorización. La rentabilidad bruta (canon anual entre precio) se reduce con los meses vacíos, el predial, el mantenimiento, la administración, los impuestos y el riesgo de arrendatarios que no pagan.</p>
<div class="eq key" data-name="Rentabilidad de un inmueble arrendado">\[R\approx\underbrace{\frac{(12-v)\,c-\text{costos anuales}}{P}}_{\text{rentabilidad neta por arriendo}}+\ \text{valorización},\qquad \frac{P}{12c}=\text{años de arriendo que vale el inmueble} .\]</div>
<div class="sim" data-sim="precio-arriendo" data-title="Rentabilidad de un inmueble para arrendar"></div>
<div class="sim-guide"><ul>
<li>Un apartamento de $300 millones arrendado en $1.350.000 tiene una rentabilidad bruta de 5,4 %. Con un mes vacío al año y costos de 1,2 % del valor, la neta baja a 3,75 %. Con 5 % de valorización, el total es cerca de 9 % nominal.</li>
<li>Compare con la rentabilidad de un portafolio diversificado del capítulo 17, que no exige administración ni concentra todo en un solo inmueble.</li>
<li>Los datos de Damodaran muestran que en Estados Unidos el precio de la vivienda le ganó a la inflación apenas 1,1 % al año entre 1928 y 2025. La mayor parte de la rentabilidad de la finca raíz viene del arriendo, no de la valorización.</li>
</ul></div>
</section>

<section>
<h2>¿La casa es un activo?</h2>
<p>Robert Kiyosaki popularizó en <i>Padre rico, padre pobre</i> la idea de que la casa propia no es un activo, porque «saca dinero del bolsillo» cada mes. En contabilidad sí lo es: tiene un valor de mercado y aparece en el balance. Ambas miradas tienen algo de razón. La casa propia es un <b>activo de uso</b> (capítulo 11): no genera flujo de caja, pero ahorra el arriendo que habría que pagar, y ese ahorro es su rendimiento. Lo que sí es un error es creer que una casa más grande es siempre una mejor inversión, o comprar la vivienda que el banco aprueba en lugar de la que el presupuesto soporta con holgura.</p>
<div class="box teach"><p><b>Debate con números.</b> Divida el grupo en «compradores» y «arrendatarios». Cada equipo recibe el mismo caso y debe defender su opción con la simulación 21.1, buscando supuestos razonables que la favorezcan. Al final, ambos equipos reconocen qué supuestos inclinan la balanza: valorización, tasa del crédito, arriendo, rentabilidad de las inversiones y disciplina para invertir. Esa lista es la conclusión del ejercicio.</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>La vivienda propia es consumo, inversión y seguridad. La seguridad tiene valor, pero hay que separarla de las cuentas.</li>
<li>Poseer cuesta: cuota inicial (costo de oportunidad), costos de compra y venta, intereses, predial, mantenimiento, seguros y administración.</li>
<li>La comparación correcta es patrimonio contra patrimonio: comprar frente a arrendar e invertir la diferencia. El resultado depende de los supuestos.</li>
<li>Arrendar solo gana si la diferencia se invierte de verdad. La hipoteca funciona como ahorro forzoso.</li>
<li>Un inmueble para arrendar rinde arriendo neto más valorización; en el largo plazo, la mayor parte viene del arriendo.</li>
<li>Ley 820 de 2003: canon máximo de 1 % mensual del valor comercial y aumentos anuales limitados al IPC del año anterior.</li>
</ul></div>
<div class="box do"><ul>
<li>Si arrienda, calcule la relación entre su canon y el valor de la vivienda (canon mensual / valor).</li>
<li>Si piensa comprar, haga la simulación 21.1 con sus propios números y tres escenarios de valorización.</li>
<li>Escriba cuánto pagaría, en pesos al mes, por la seguridad de tener casa propia.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Un apartamento vale $200 millones y se arrienda en $900.000. ¿Cuál es la rentabilidad bruta? ¿Cuántos años de arriendo vale?
<details><summary>Respuesta</summary><p>Bruta: \(12\times900.000/200.000.000=5{,}4\,\%\). Vale \(200/10{,}8\approx18{,}5\) años de arriendo.</p></details></li>
<li><span class="lvl">Básico</span>Con un canon de $1.500.000 y una inflación de 5,1 % el año anterior, ¿cuál es el canon máximo el año siguiente según la Ley 820?
<details><summary>Respuesta</summary><p>\(1.500.000\times1{,}051=\) $1.576.500.</p></details></li>
<li><span class="lvl">Intermedio</span>En el escenario inicial de la simulación 21.1, ¿por qué en los primeros años quien compra paga cada mes bastante más que quien arrienda?
<details><summary>Respuesta</summary><p>Porque paga una cuota de $2,29 millones más unos $300.000 de costos de poseer, frente a un arriendo de $1,35 millones. Al comienzo, casi toda la cuota del crédito es interés (capítulo 10). La diferencia, invertida, es lo que hace crecer el patrimonio de quien arrienda.</p></details></li>
<li><span class="lvl">Intermedio</span>Explique por qué un horizonte corto (3 a 5 años) suele favorecer arrendar.
<details><summary>Respuesta</summary><p>Porque los costos de compra y venta (2 % a 3 % más otro 3 %) se pagan una sola vez y pesan mucho si se reparten en pocos años, y porque al principio la cuota es casi toda interés y el patrimonio acumulado en la vivienda es pequeño.</p></details></li>
<li><span class="lvl">Avanzado</span>¿Qué rentabilidad de inversión iguala aproximadamente las dos opciones en el escenario inicial? ¿Qué significa eso para quien arrienda?
<details><summary>Respuesta</summary><p>Con la simulación: alrededor de 6,8 % nominal anual (unos 2,2 % reales con 4,5 % de inflación). Quien arrienda necesita invertir la diferencia en algo que rinda al menos eso de forma sostenida, lo que exige un portafolio con acciones y disciplina durante décadas.</p></details></li>
</ol>
