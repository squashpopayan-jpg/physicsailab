<template class="chapter-src" data-id="bienestar" data-num="4" data-title="Dinero y bienestar" data-part="Parte I · La mente y el dinero" data-short="Qué dice la investigación sobre ingreso y felicidad; la relación logarítmica; adaptación hedónica; comparación social; cómo gastar mejor; el valor del colchón; definir «suficiente»">
<p class="lead">Si el dinero no tuviera que ver con el bienestar, no valdría la pena estudiarlo. Si lo fuera todo, no habría ricos tristes. La investigación de las últimas dos décadas da una respuesta más útil: el dinero sí aumenta el bienestar, pero de forma logarítmica, la gente se adapta rápido a lo que gana y compra, y pesa más cómo se gasta que cuánto se gasta. Este capítulo convierte esos hallazgos en criterios para decidir.</p>

<section>
<h2>¿Compra felicidad el dinero?</h2>
<p>Los investigadores distinguen dos tipos de bienestar. La <span class="term">evaluación de la vida</span> es el juicio global: «en una escala de 0 a 10, ¿qué tan buena es su vida?». El <span class="term">bienestar emocional</span> o experimentado son las emociones del día a día: alegría, estrés, tristeza. El dinero se relaciona distinto con cada uno.</p>
<div class="box evid"><p><b>Kahneman y Deaton (2010)</b>, con 450.000 respuestas de encuestas Gallup en Estados Unidos: la evaluación de la vida sube sin parar con el logaritmo del ingreso, pero el bienestar emocional parecía estancarse hacia los 75.000 dólares anuales. <b>Killingsworth (2021)</b>, con 1,7 millones de reportes en tiempo real de 33.391 adultos, no encontró ese techo: el bienestar emocional también seguía subiendo con el logaritmo del ingreso. En 2023, Killingsworth, Kahneman y Mellers publicaron juntos una «colaboración adversarial» para resolver la contradicción. Para la mayoría de las personas la felicidad sigue aumentando con el ingreso. Solo en el 20 % más infeliz se estanca a partir de cierto nivel, porque sus problemas (duelos, depresión, soledad) no se resuelven con dinero.</p></div>
<p>La palabra que importa es <b>logaritmo</b>. Si la felicidad crece como \(\ln(\text{ingreso})\), cada <i>duplicación</i> del ingreso aporta lo mismo, sin importar desde dónde se parte:</p>
<div class="eq key" data-name="Utilidad logarítmica">\[F(y)\approx a+b\,\ln y\qquad\Longrightarrow\qquad F(2y)-F(y)=b\ln 2\quad\text{para cualquier }y .\]</div>
<p>Un aumento de $500.000 mensuales cambia la vida de quien gana un salario mínimo y casi no se nota en quien gana $15 millones. Por eso redistribuir, ayudar o donar a quien tiene menos produce más bienestar total que el mismo monto en manos de quien ya tiene mucho. Y por eso pasar de no tener colchón a tenerlo vale más, en bienestar, que pasar de mucho a muchísimo.</p>
<div class="sim" data-sim="log-ingreso" data-title="El mismo aumento, dos personas: la curva logarítmica"></div>
<div class="sim-guide"><ul>
<li>Las dos personas reciben el mismo aumento en pesos. Compare las flechas verticales: la ganancia de bienestar de quien gana menos es varias veces mayor.</li>
<li>Active «duplicar»: los escalones horizontales son cada vez más largos, pero los verticales siempre miden lo mismo.</li>
<li>Una implicación práctica: si tiene que elegir entre un aumento de sueldo y tiempo libre, piense en dónde está usted en la curva.</li>
</ul></div>
</section>

<section>
<h2>La adaptación hedónica</h2>
<p>Las personas se acostumbran a casi todo. El carro nuevo emociona unas semanas y luego es solo el carro. Un aumento de sueldo se siente durante unos meses, hasta que los nuevos gastos se vuelven normales. Esa tendencia a volver al nivel de satisfacción habitual se llama <span class="term">adaptación hedónica</span>, y su versión financiera es la <span class="term">inflación del estilo de vida</span>: el gasto sube con el ingreso y el punto de referencia se mueve.</p>
<div class="box evid"><p>Un estudio clásico (Brickman, Coates y Janoff-Bulman, 1978) encontró que ganadores de lotería no eran mucho más felices que sus vecinos tiempo después. La muestra era pequeña. Un estudio más sólido con ganadores de lotería suecos (Lindqvist, Östling y Cesarini, 2020) mostró que los premios grandes sí aumentan la satisfacción con la vida, de forma duradera, incluso veinte años después. Lo que no cambiaba era la felicidad del día a día. La adaptación es real, pero incompleta.</p></div>
<div class="sim" data-sim="adaptacion" data-title="Un aumento de sueldo y tres maneras de usarlo"></div>
<div class="sim-guide"><ul>
<li>En el mes 12 llega un aumento del 20 %. Quien lo gasta todo siente un salto grande de bienestar que se desvanece en unos meses, a medida que el nuevo nivel de consumo se vuelve su referencia.</li>
<li>Quien lo ahorra todo no siente el salto, pero acumula patrimonio (barras), y ese colchón aporta seguridad (siguiente sección).</li>
<li>Gastar la mitad y ahorrar la mitad da un salto más pequeño y deja patrimonio. Cambie la velocidad de adaptación: con adaptación rápida, gastar todo deja casi nada al cabo de un año.</li>
</ul></div>
</section>

<section>
<h2>La comparación con los demás</h2>
<p>Parte de la satisfacción depende de cómo nos va en comparación con otros. El economista Richard Easterlin notó en 1974 que, dentro de un país, los ricos son más felices que los pobres, pero que cuando todo el país se enriquece la felicidad promedio sube poco. Su explicación fue la comparación: si todos mejoran, nadie se siente mejor que su vecino. La paradoja se discute todavía (Stevenson y Wolfers encontraron en 2008 que los países más ricos sí son más felices en promedio), pero el efecto de comparación tiene buen respaldo.</p>
<div class="box evid"><p>Erzo Luttmer (2005) cruzó encuestas de felicidad de Estados Unidos con los ingresos de cada vecindario. A igual ingreso propio, las personas que vivían rodeadas de vecinos más ricos reportaban menos felicidad. Las redes sociales llevaron ese vecindario al bolsillo: cada día vemos los viajes, carros y celebraciones de cientos de personas, y casi nunca sus deudas.</p></div>
<div class="sim" data-sim="comparacion" data-title="Ganar más que antes o ganar más que el vecino"></div>
<div class="sim-guide"><ul>
<li>El modelo supone bienestar \(=\ln y-\theta\ln\bar y\), donde \(\bar y\) es el ingreso típico del grupo con el que uno se compara y \(\theta\) es el peso de la comparación.</li>
<li>Con \(\theta=0\) solo importa el ingreso propio. Con \(\theta\) cercano a 1, si todos suben igual nadie gana bienestar, y si suben todos menos usted, usted pierde aunque su ingreso no haya cambiado.</li>
<li>Una defensa práctica: elegir con cuidado con quién se compara uno, y compararse con uno mismo en el pasado.</li>
</ul></div>
</section>

<section>
<h2>Cómo gastar mejor</h2>
<p>Elizabeth Dunn y Michael Norton reunieron la evidencia sobre qué compras producen más bienestar por peso gastado. Sus cinco principios:</p>
<ol>
<li><b>Comprar experiencias</b> más que cosas: viajes, cursos, conciertos, comidas con amigos. Se comparten, se recuerdan y se comparan menos (Van Boven y Gilovich, 2003).</li>
<li><b>Convertirlo en un gusto</b>: lo especial deja de serlo si se vuelve diario. Un café de tienda los viernes rinde más que uno todos los días.</li>
<li><b>Comprar tiempo</b>: pagar para delegar tareas que se odian se asocia con más bienestar (Whillans y otros, 2017).</li>
<li><b>Pagar ahora y disfrutar después</b>: la anticipación es parte del placer. Las cuotas hacen lo contrario: se disfruta hoy y se sufre después.</li>
<li><b>Invertir en otros</b>: en el experimento de Dunn, Aknin y Norton (2008), quienes recibieron dinero con la instrucción de gastarlo en otra persona terminaron el día más felices que quienes lo gastaron en sí mismos.</li>
</ol>
<div class="box explain"><p>Antes de comprar, tres preguntas rápidas: ¿esto me dará un recuerdo o solo un objeto?, ¿me ahorra tiempo para algo que valoro?, ¿lo voy a seguir disfrutando en tres meses? Si las tres respuestas son «no», probablemente la emoción dure menos que las cuotas.</p></div>
</section>

<section>
<h2>La seguridad vale más que el lujo</h2>
<p>Hay un tipo de gasto, o mejor, de no gasto, con efecto claro sobre el bienestar: tener dinero disponible. Ruberton, Gladstone y Lyubomirsky (2016) encontraron que el dinero en efectivo y en cuentas de ahorro predecía la satisfacción con la vida mejor que el ingreso, las inversiones o las deudas por separado. La razón es psicológica: el colchón reduce la preocupación por lo que podría salir mal. Es el antídoto contra la escasez del capítulo 2.</p>
<div class="box myth">
<p class="m"><b>Mito</b>«Ahorrar es privarse; la plata es para disfrutarla».</p>
<p class="r"><b>Realidad</b>Un colchón de pocos meses de gastos es, probablemente, la compra de bienestar más rentable que existe. No se ve ni se presume, pero cambia cómo se duerme, cómo se negocia un empleo y cómo se reacciona ante un imprevisto.</p>
</div>
</section>

<section>
<h2>¿Cuánto es suficiente?</h2>
<p>Robin y Dominguez proponen pensar en una <span class="term">curva de la plenitud</span>: al principio, más gasto trae mucha satisfacción (cubrir lo básico), luego menos (comodidades) y a partir de cierto punto, el de «suficiente», más gasto empieza a restar, porque exige más horas de trabajo, más deudas y más cosas que cuidar. La curva logarítmica de este capítulo y el salario real por hora del capítulo 1 dicen lo mismo con números: cada peso extra aporta menos bienestar y cuesta las mismas horas de vida.</p>
<p>Definir «suficiente» no es renunciar a progresar. Es decidir con anticipación qué estilo de vida se quiere y qué hacer con lo que sobre: invertirlo en libertad (parte V), en otros o en experiencias que de verdad importen.</p>
<div class="box teach"><p><b>Discusión guiada (25 minutos).</b> Pida que cada persona escriba las tres compras de los últimos dos años que más bienestar le dieron y las tres que menos. Luego clasifiquen todas según los cinco principios de Dunn y Norton. Casi siempre las mejores son experiencias, compras de tiempo o regalos, y las peores son objetos comprados por impulso o para impresionar. El grupo llega solo a la conclusión.</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>El dinero aumenta el bienestar, de forma aproximadamente logarítmica: cada duplicación del ingreso aporta lo mismo.</li>
<li>La adaptación hedónica hace que los aumentos gastados se desvanezcan; ahorrar parte del aumento deja un efecto que dura: patrimonio y seguridad.</li>
<li>La comparación social reduce el efecto del ingreso. Elegir con quién compararse es una decisión financiera.</li>
<li>Experiencias, tiempo, gustos ocasionales, anticipación y gasto en otros rinden más bienestar por peso.</li>
<li>El dinero líquido disponible predice satisfacción con la vida: el colchón es una compra de tranquilidad.</li>
</ul></div>
<div class="box do"><ul>
<li>Revise el extracto del último mes y marque las compras que siguen dándole satisfacción.</li>
<li>Decida qué hará con su próximo aumento o prima antes de recibirlo: por ejemplo, la mitad a ahorro automático.</li>
<li>Escriba en un párrafo cómo sería para usted una vida con «suficiente».</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Con \(F=b\ln y\), ¿cuánto bienestar aporta subir de $2 a $3 millones comparado con subir de $10 a $11 millones?
<details><summary>Respuesta</summary><p>\(b\ln(3/2)\approx0{,}405\,b\) frente a \(b\ln(11/10)\approx0{,}095\,b\). El mismo millón aporta más de cuatro veces más a quien gana menos.</p></details></li>
<li><span class="lvl">Básico</span>¿Qué ingreso hace falta, partiendo de $4 millones, para obtener el mismo aumento de bienestar que pasar de $1,5 a $3 millones?
<details><summary>Respuesta</summary><p>Pasar de 1,5 a 3 es duplicar; desde 4 millones habría que llegar a $8 millones.</p></details></li>
<li><span class="lvl">Intermedio</span>En el modelo de comparación con \(\theta=0{,}5\), suben 20 % su ingreso y el del grupo. ¿Cuánto cambia el bienestar? ¿Y si solo sube el grupo?
<details><summary>Respuesta</summary><p>Ambos: \(\ln1{,}2-0{,}5\ln1{,}2=0{,}5\ln1{,}2\approx0{,}091\). Solo el grupo: \(-0{,}5\ln1{,}2\approx-0{,}091\). Con la misma cifra en el bolsillo, se siente peor.</p></details></li>
<li><span class="lvl">Intermedio</span>Explique por qué «pagar ahora y disfrutar después» es lo contrario de la compra a cuotas, en términos de bienestar.
<details><summary>Respuesta</summary><p>Al pagar primero, la espera se llena de anticipación placentera y el disfrute llega libre de deuda. Con cuotas, el disfrute es inmediato y breve (adaptación) y el pago se arrastra durante meses, asociado a algo que ya no emociona.</p></details></li>
<li><span class="lvl">Avanzado</span>Con \(F=b\ln y\), muestre que transferir una pequeña cantidad \(\varepsilon\) de una persona con ingreso \(y_1\) a otra con \(y_2\lt y_1\) aumenta la suma de bienestares.
<details><summary>Respuesta</summary><p>El cambio es \(b\big[\ln(y_2+\varepsilon)-\ln y_2\big]-b\big[\ln y_1-\ln(y_1-\varepsilon)\big]\approx b\,\varepsilon\,(1/y_2-1/y_1)>0\), porque la utilidad marginal \(b/y\) es mayor con ingreso menor.</p></details></li>
</ol>
