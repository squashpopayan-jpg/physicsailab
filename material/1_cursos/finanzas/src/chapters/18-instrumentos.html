<p class="lead">Con los conceptos de riesgo y diversificación claros, se puede recorrer el menú de instrumentos sin perderse en los nombres comerciales. Cada producto se evalúa con las mismas cinco preguntas: cuánto rinde en términos reales, cuánto puede caer, cuándo se puede sacar el dinero, cuánto cuesta y quién lo vigila. Este capítulo recorre los instrumentos disponibles en Colombia, de los más líquidos y seguros a los más volátiles, y propone un orden para usarlos.</p>

<section>
<h2>El mapa: liquidez, riesgo y rentabilidad</h2>
<p>Ningún instrumento es a la vez muy líquido, muy seguro y muy rentable. Ganar en una dimensión cuesta en otra. Los datos históricos del capítulo 16 lo muestran con claridad: a mayor volatilidad, mayor rentabilidad real de largo plazo, con excepciones como el oro, que es muy volátil y rindió poco en promedio.</p>
<div class="sim" data-sim="mapa-riesgo" data-title="Mapa histórico de riesgo y rentabilidad real (1928-2025)"></div>
<div class="sim-guide"><ul>
<li>Cada punto es un activo, con su volatilidad anual y su rentabilidad real geométrica en el periodo elegido.</li>
<li>Las letras del Tesoro, el equivalente a una cuenta o un CDT de corto plazo, apenas le ganaron a la inflación. Las acciones pagaron la prima de riesgo.</li>
<li>Cambie el periodo a 2000-2025 o a 1966-1981: el mapa cambia mucho. Las relaciones de largo plazo no se cumplen en cada década.</li>
</ul></div>
</section>

<section>
<h2>Cuentas, CDT y escaleras</h2>
<p>La <b>cuenta de ahorros</b> ofrece liquidez total y, normalmente, una tasa baja. El <b>certificado de depósito a término</b> (CDT) paga una tasa fija por un plazo fijo; a cambio, el dinero no se puede retirar antes del vencimiento, aunque un CDT desmaterializado se puede vender en el mercado secundario. Ambos están cubiertos por el seguro de Fogafín hasta $50 millones por persona y por entidad, y sus intereses tienen retención en la fuente.</p>
<p>Una <span class="term">escalera de CDT</span> combina rentabilidad y liquidez: en vez de un solo CDT a un año, se abren varios con vencimientos escalonados (3, 6, 9 y 12 meses). Cuando vence cada uno, se renueva a un año. Después del primer año, todos rinden la tasa de un año y uno vence cada trimestre.</p>
<div class="sim" data-sim="escalera-cdt" data-title="Escalera de CDT: liquidez cada trimestre con tasa de largo plazo"></div>
<div class="sim-guide"><ul>
<li>Cada barra horizontal es un CDT. Las marcas indican cuándo vence y se renueva.</li>
<li>Compare la tasa promedio de la escalera con poner todo en un CDT a 90 días (máxima liquidez) o todo a un año (máxima tasa, sin liquidez).</li>
<li>Útil para la parte del fondo de emergencia que no se necesita el primer mes, y para metas de 1 a 3 años.</li>
</ul></div>
</section>

<section>
<h2>Renta fija: bonos y TES</h2>
<p>Un <span class="term">bono</span> es un préstamo que el inversionista le hace a un gobierno o a una empresa: paga cupones periódicos y devuelve el capital al vencimiento. En Colombia, los <b>TES</b> son los bonos del Gobierno nacional, en pesos a tasa fija o en UVR. Los bonos de empresas tienen además <b>riesgo de crédito</b>, medido por las calificadoras.</p>
<p>El precio de un bono es el valor presente de sus flujos a la tasa de mercado (el <span class="term">rendimiento</span>). Por eso, cuando las tasas suben, los bonos ya emitidos bajan de precio. La sensibilidad se mide con la <span class="term">duración</span>:</p>
<div class="eq key" data-name="Precio y duración">\[P=\sum_{k=1}^{N}\frac{C}{(1+y)^{k}}+\frac{F}{(1+y)^{N}},\qquad \frac{\Delta P}{P}\approx-D_{\text{mod}}\,\Delta y .\]</div>
<div class="sim" data-sim="precio-bono" data-title="Precio de un bono frente a la tasa de mercado"></div>
<div class="sim-guide"><ul>
<li>Un bono a 10 años con cupón de 9 % semestral vale $880,50 por cada $1.000 si el mercado exige 11 %, y exactamente $1.000 si exige 9 %.</li>
<li>Su duración modificada es 6,2 años: si la tasa sube un punto, el precio cae cerca de 6 %. Así se explican las pérdidas de los fondos de renta fija cuando las tasas suben, como en 2022.</li>
<li>Acorte el plazo a 2 años: la curva se aplana y el riesgo de tasa casi desaparece. Por eso para el corto plazo conviene renta fija de corto plazo.</li>
</ul></div>
</section>

<section>
<h2>Fondos de inversión colectiva y pensiones voluntarias</h2>
<p>Un <b>fondo de inversión colectiva</b> (FIC) reúne el dinero de muchos inversionistas y lo invierte según un reglamento. Lo administran sociedades fiduciarias, comisionistas de bolsa o sociedades administradoras de inversión vigiladas por la Superintendencia Financiera. Los hay a la vista (se retira en cualquier momento), con pacto de permanencia, de renta fija, de acciones, inmobiliarios e internacionales. Los <b>fondos de pensiones voluntarias</b> funcionan de forma parecida y pueden tener beneficios tributarios con requisitos de permanencia (capítulo 15).</p>
<div class="box xl"><p><b>Cómo leer la ficha técnica de un FIC.</b> Todo FIC publica una ficha mensual. Busque cinco datos: (1) la <b>comisión de administración</b>, que se descuenta del rendimiento todos los días; (2) la <b>rentabilidad neta</b> de 1, 3 y 5 años, después de comisión; (3) la <b>volatilidad</b> histórica; (4) el <b>plazo</b> y las penalidades por retiro anticipado; (5) la <b>composición</b> del portafolio, para saber en qué se invierte de verdad. Compare siempre la rentabilidad neta real, no la bruta.</p></div>
<div class="box co"><p>Los FIC no son depósitos y no tienen seguro de Fogafín. Su protección es otra: los activos del fondo están separados del patrimonio de la sociedad administradora, así que si esta quiebra, el dinero de los inversionistas no hace parte de sus bienes. Lo que sí puede pasar es que el valor de la unidad baje si bajan los activos del fondo.</p></div>
</section>

<section>
<h2>Acciones, índices y ETF</h2>
<p>Una <b>acción</b> es una parte de la propiedad de una empresa: da derecho a una porción de sus utilidades (dividendos) y de su valor. Comprar pocas acciones individuales es concentrar riesgo idiosincrático (capítulo 17). Un <b>índice</b> agrupa muchas acciones según una regla (por ejemplo, el COLCAP en Colombia o el S&amp;P 500 en Estados Unidos), y un <b>fondo índice</b> o un <b>ETF</b> (fondo cotizado en bolsa) replica ese índice a bajo costo. Para la mayoría de los inversionistas, la forma más sensata de tener acciones es a través de fondos índice amplios y baratos (capítulo 19).</p>
<div class="box warn"><p>Muchas aplicaciones extranjeras permiten comprar acciones y ETF desde Colombia. Algunas son serias, pero no están vigiladas por la Superintendencia Financiera, y en caso de problemas la protección depende de las reglas de otro país. Antes de usar cualquier plataforma, verifique quién la regula, dónde quedan custodiados los activos y cómo se reportan los impuestos en Colombia.</p></div>
</section>

<section>
<h2>Oro y criptoactivos</h2>
<p>El <b>oro</b> no produce flujos: su rentabilidad depende de que alguien pague más por él en el futuro. Entre 1928 y 2025 rindió 2,5 % real anual con 21 % de volatilidad, y perdió 77 % de su valor real entre 1980 y 2001. Suele subir en crisis y con inflación alta, lo que lo hace útil como pequeña porción diversificadora, no como base de un plan.</p>
<p>Los <b>criptoactivos</b> no son moneda de curso legal en Colombia ni están respaldados por el Banco de la República, y las plataformas que los negocian no están, en general, vigiladas por la Superintendencia Financiera. Son extremadamente volátiles, con caídas históricas de más de 70 %, y son el vehículo preferido de muchas estafas recientes (capítulo 25). Si se decide tener algo, debe ser una porción que se pueda perder por completo sin alterar el plan.</p>
</section>

<section>
<h2>El orden de la inversión</h2>
<p>Un planificador suele recomendar construir de abajo hacia arriba:</p>
<ol>
<li><b>Colchón</b> de emergencia en cuentas y CDT cortos (capítulo 13).</li>
<li><b>Deudas caras</b> pagadas: ninguna inversión rinde de forma segura el 25 % E.A. que se ahorra al pagar una tarjeta.</li>
<li><b>Metas de 1 a 5 años</b> (estudios, cuota inicial): CDT, escaleras, FIC de renta fija de corto plazo.</li>
<li><b>Largo plazo</b> (más de 5 a 10 años, retiro): portafolio diversificado con acciones y bonos, local e internacional, a bajo costo.</li>
<li><b>Especulación</b>, si se desea: una porción pequeña, separada y que se pueda perder (capítulo 20).</li>
</ol>
<div class="box teach"><p><b>Feria de productos.</b> Asigne a cada grupo un instrumento (CDT, FIC a la vista, TES, ETF de S&amp;P 500, acciones de una empresa colombiana, oro, una criptomoneda, finca raíz). Cada grupo prepara una ficha con las cinco preguntas: rentabilidad real, caída posible, liquidez, costo y vigilancia. Luego todos se ubican en un «mapa» dibujado en el piso con cinta: eje de riesgo y eje de rentabilidad. La discusión sobre dónde se para cada uno vale más que cualquier tabla.</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>Cinco preguntas para cualquier instrumento: rentabilidad real, caída posible, liquidez, costo y quién lo vigila.</li>
<li>Cuentas y CDT: seguros (Fogafín hasta $50 millones por entidad) y poco rentables. Las escaleras de CDT combinan liquidez y tasa.</li>
<li>Los bonos bajan de precio cuando suben las tasas: \(\Delta P/P\approx-D_{\text{mod}}\Delta y\). El plazo determina el riesgo de tasa.</li>
<li>FIC y pensiones voluntarias: vigilados, sin Fogafín, con activos separados. Hay que leer la ficha técnica, sobre todo la comisión.</li>
<li>Para acciones, los fondos índice amplios y baratos son la vía más sensata para la mayoría.</li>
<li>Oro y criptoactivos: porciones pequeñas, nunca la base del plan.</li>
</ul></div>
<div class="box do"><ul>
<li>Clasifique cada producto donde tiene dinero según las cinco preguntas.</li>
<li>Descargue la ficha técnica de un FIC y encuentre su comisión de administración y su rentabilidad neta a 3 años.</li>
<li>Escriba su pirámide personal: cuánto va en cada piso.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Tiene $120 millones en un solo banco. ¿Cuánto está cubierto por Fogafín? ¿Cómo podría cubrirlo todo?
<details><summary>Respuesta</summary><p>$50 millones. Repartiendo el dinero en tres entidades inscritas distintas, con no más de $50 millones en cada una, quedaría cubierto por completo.</p></details></li>
<li><span class="lvl">Básico</span>Un bono tiene duración modificada de 4 años. ¿Cuánto cambia su precio si las tasas bajan 1,5 puntos?
<details><summary>Respuesta</summary><p>\(\Delta P/P\approx-4\times(-0{,}015)=+6\,\%\).</p></details></li>
<li><span class="lvl">Intermedio</span>Un FIC de acciones rindió 12 % bruto con una comisión de 2,5 % anual. Un ETF del mismo índice cobra 0,1 %. ¿Cuánta diferencia hay en 20 años sobre $10 millones?
<details><summary>Respuesta</summary><p>FIC: \(10\times(1{,}12\times0{,}975)^{20}\approx10\times1{,}092^{20}\approx\) $58 millones. ETF: \(10\times(1{,}12\times0{,}999)^{20}\approx\) $94 millones. La comisión se lleva más de un tercio del resultado (capítulo 19).</p></details></li>
<li><span class="lvl">Intermedio</span>¿Por qué un fondo de renta fija «conservador» puede tener rentabilidad negativa en un año?
<details><summary>Respuesta</summary><p>Porque si las tasas de mercado suben, el precio de los bonos que tiene el fondo baja (en proporción a su duración). El fondo valora sus activos a precios de mercado, así que la caída se refleja en la unidad aunque ningún emisor deje de pagar.</p></details></li>
<li><span class="lvl">Avanzado</span>Muestre que \(D_{\text{mod}}=-\frac{1}{P}\frac{\dd P}{\dd y}\) para un bono con pagos anuales, partiendo de la fórmula del precio.
<details><summary>Respuesta</summary><p>\(\frac{\dd P}{\dd y}=-\sum_k \frac{k\,F_k}{(1+y)^{k+1}}=-\frac{1}{1+y}\sum_k k\frac{F_k}{(1+y)^k}=-\frac{P\,D_{\text{mac}}}{1+y}\). Dividiendo entre \(-P\) se obtiene \(D_{\text{mac}}/(1+y)=D_{\text{mod}}\).</p></details></li>
</ol>
