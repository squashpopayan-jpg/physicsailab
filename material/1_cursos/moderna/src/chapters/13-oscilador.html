<template class="chapter-src" data-id="oscilador" data-num="13" data-title="Oscilador armónico cuántico" data-part="Parte III · Mecánica ondulatoria" data-short="Los niveles equiespaciados y la energía de punto cero, las funciones de Hermite y la región clásicamente prohibida, y las vibraciones de las moléculas diatómicas con el potencial de Morse y los espectros infrarrojos">
<p class="lead">Casi todo sistema que oscila con poca amplitud alrededor de un equilibrio estable se comporta como un oscilador armónico: el enlace de una molécula, el campo de un modo de luz, los átomos de un cristal. Con la cuantización, sus energías son equiespaciadas, \(E_n=(n+\tfrac12)\hbar\omega\), y esa regularidad es la clave de la espectroscopía vibracional, de la ley de Planck y del calor específico de los sólidos. Este capítulo resuelve el oscilador, verifica sus propiedades con las funciones de onda de Hermite y lo aplica a las moléculas diatómicas, donde la corrección de anarmonicidad (el potencial de Morse) explica por qué el espectro infrarrojo real difiere ligeramente del armónico.</p>

<section>
<h2>El oscilador armónico cuántico</h2>
<p>Una partícula de masa \(\mu\) en el potencial \(V=\tfrac12\mu\omega^2x^2\) tiene la ecuación \(-\tfrac{\hbar^2}{2\mu}\psi''+\tfrac12\mu\omega^2x^2\psi=E\psi\). Con la longitud característica \(x_0=\sqrt{\hbar/\mu\omega}\) y \(\xi=x/x_0\), se reduce a \(\psi''+(2E/\hbar\omega-\xi^2)\psi=0\). Las soluciones normalizables solo existen para \(2E/\hbar\omega=2n+1\), \(n=0,1,2,\dots\), y son los polinomios de Hermite por una gaussiana:</p>
<div class="eq key" data-name="Estados del oscilador armónico">\[E_n=\Bigl(n+\frac12\Bigr)\hbar\omega,\qquad \psi_n(\xi)=\frac{H_n(\xi)\,e^{-\xi^2/2}}{\sqrt{2^nn!\sqrt\pi\,x_0}},\qquad \psi_0\propto e^{-\xi^2/2},\ \ \psi_1\propto\xi e^{-\xi^2/2},\ \ \psi_2\propto(2\xi^2-1)e^{-\xi^2/2}.\]</div>
<p>Cinco propiedades. (i) <b>Niveles equiespaciados</b> con el mismo salto \(\hbar\omega\): el oscilador emite y absorbe cuantos de esa energía. (ii) <b>Energía de punto cero</b> \(E_0=\tfrac12\hbar\omega\): el estado fundamental no está en reposo en el fondo del pozo, porque localizarlo ahí violaría \(\Delta x\Delta p\ge\hbar/2\); de hecho \(\Delta x\Delta p=(n+\tfrac12)\hbar\) (el fundamental satura la cota). (iii) <b>Teorema del virial</b>: \(\langle K\rangle=\langle V\rangle=E_n/2\), con \(\langle x^2\rangle=(n+\tfrac12)x_0^2\). (iv) <b>Región prohibida</b>: la clásica limitaría \(|\xi|\le\sqrt{2n+1}\), pero \(\psi_n\) se extiende más allá; la probabilidad de encontrar la partícula allí es 15.73 % para \(n=0\) (\(\operatorname{erfc}1\)), 11.16 % para \(n=1\), 9.51 % para \(n=2\), 7.40 % para \(n=5\) y 6.01 % para \(n=10\): disminuye lentamente, como \(n^{-1/3}\). (v) <b>Correspondencia</b>: para \(n\) grande \(|\psi_n|^2\), promediada sobre sus oscilaciones rápidas, tiende a la densidad clásica \(1/(\pi\sqrt{A^2-x^2})\), que es máxima en los puntos de retorno (donde el oscilador se mueve más despacio).</p>
<p>Para un oscilador macroscópico, \(x_0\) es minúsculo: una masa de 1 kg en un muelle con \(\omega=1\) s\(^{-1}\) tiene \(\hbar\omega=1.05\times10^{-34}\) J y \(x_0=1.03\times10^{-17}\) m; con 0.5 J de energía, \(n\approx4.7\times10^{33}\): el límite clásico es una cuestión de números cuánticos enormes. En cambio, en una molécula de CO (\(\mu=6.856\) u, \(\omega_e=2169.81\) cm\(^{-1}\)) \(x_0=4.76\) pm, \(\hbar\omega=0.2690\) eV y la energía de punto cero, \(0.1345\) eV, es una fracción grande de la energía de enlace.</p>
<div class="box ex"><h4>La molécula de CO como oscilador</h4>
<p><strong>Datos.</strong> \(\omega_e=2169.81\) cm\(^{-1}\), \(\mu=6.8562\) u. <strong>Procedimiento.</strong> (1) \(\omega=2\pi c\tilde\nu=2\pi(2.99792\times10^{10}\text{ cm/s})(2169.81\text{ cm}^{-1})=4.0872\times10^{14}\) s\(^{-1}\) (frecuencia de 65.05 THz, periodo de 15.37 fs). (2) Constante de fuerza \(k=\mu\omega^2=1.1385\times10^{-26}\times(4.0872\times10^{14})^2=1902\) N/m. (3) \(\hbar\omega=0.26902\) eV; energía de punto cero \(0.13451\) eV. (4) \(x_0=\sqrt{\hbar/\mu\omega}=4.76\) pm; en el estado \(n=4\), puntos de retorno \(\pm3x_0=\pm14.28\) pm y \(E_4=4.5\hbar\omega=1.2106\) eV. (5) Temperatura vibracional \(\hbar\omega/k_B=3122\) K: a 300 K, la fracción de moléculas en \(n=1\) es \(e^{-10.41}=3.0\times10^{-5}\), de modo que todas están en \(n=0\) (por eso la espectroscopía infrarroja de CO a temperatura ambiente solo ve la banda \(1\leftarrow0\)). <strong>Resultado.</strong> \(k=1902\) N/m, \(\hbar\omega=0.269\) eV, \(x_0=4.76\) pm.</p></div>

<section>
<h2>Moléculas diatómicas: el potencial de Morse</h2>
<p>El potencial real entre dos átomos es parabólico solo cerca del mínimo: se achata para \(r\gt r_e\) y termina en la disociación, donde las fuerzas se anulan, y es muy repulsivo para \(r\lt r_e\). Un modelo con solución exacta lo describe bien, el potencial de Morse, \(V(r)=D_e\bigl(1-e^{-a(r-r_e)}\bigr)^2\), con \(a=\sqrt{k/2D_e}\). Sus niveles (resolviendo la ecuación de Schrödinger) son exactamente cuadráticos en \(n\):</p>
<div class="eq key" data-name="Niveles vibracionales de Morse">\[E_n=\hbar\omega_e\Bigl(n+\tfrac12\Bigr)-\hbar\omega_ex_e\Bigl(n+\tfrac12\Bigr)^2,\qquad D_e=\frac{\omega_e^2}{4\,\omega_ex_e},\qquad N_\text{ligados}=\Bigl\lfloor\frac{\omega_e}{2\omega_ex_e}-\tfrac12\Bigr\rfloor+1,\]</div>
<p>(con \(\omega_e\) y \(\omega_ex_e\) en cm\(^{-1}\)). Los niveles se acercan al aumentar \(n\), y las transiciones del espectro infrarrojo valen \(\tilde\nu_{0\to1}=\omega_e-2\omega_ex_e\), \(\tilde\nu_{0\to2}=2\omega_e-6\omega_ex_e\), etc.: la primera banda, la fundamental, cae un poco por debajo de \(\omega_e\) y el primer sobretono es algo menor que el doble. Para el CO: \(\omega_ex_e=13.288\) cm\(^{-1}\) y los números predichos son \(2143.23\) (observado \(2143.27\)) y \(4259.9\) (observado \(4259.7\)): un acuerdo de 0.002 % y 0.004 %. Los valores de \(D_e\) que da la relación de Morse son aproximados (10.98 eV para CO, 5.25 eV para HCl —el valor experimental es 4.6 eV—, 4.95 eV para H\(_2\) —4.75 eV— y 12.04 eV para N\(_2\) —9.9 eV—), porque el potencial de Morse no reproduce bien el comportamiento lejos del equilibrio.</p>
<h3>Efecto isotópico y aplicaciones</h3>
<p>La frecuencia es \(\omega\propto\mu^{-1/2}\): al sustituir H por D en HCl, \(\mu\) pasa de 0.9796 a 1.9044 u y \(\omega_e\) baja de 2990.95 a \(2990.95\sqrt{0.9796/1.9044}=2145.1\) cm\(^{-1}\) (observado: 2145.2). Esta firma isotópica permite identificar moléculas, y mide el cociente D/H en el espacio y en la atmósfera. Las bandas vibracionales (2–15 µm) son la huella digital de cada molécula: el CO\(_2\) (15 y 4.3 µm), el H\(_2\)O y el CH\(_4\) absorben la radiación infrarroja que emite la Tierra, base del efecto invernadero. A cada nivel vibracional se superpone una estructura rotacional (capítulo 18).</p>
<div class="sim" data-sim="morse" data-title="El potencial de Morse: niveles, anarmonicidad y bandas infrarrojas"></div>
<div class="sim-guide"><ul>
<li>CO con 8 niveles: \(D_e=10.982\) eV (88 578 cm\(^{-1}\)), 82 estados ligados, fundamental predicha 2143.23 frente a 2143.27 cm\(^{-1}\) (error \(-0.002\) %), primer sobretono 4259.89 cm\(^{-1}\), \(k=1901.9\) N/m y \(a=2.325\) Å\(^{-1}\). El espaciado cae de 2143.2 (\(n=0\to1\)) a 1957.2 cm\(^{-1}\) (\(n=7\to8\)).</li>
<li>H\(_2\) es la más anarmónica (\(\omega_ex_e=121.34\) cm\(^{-1}\), solo 18 estados ligados): la fundamental predicha es 4158.53 cm\(^{-1}\) frente a 4161.17 observada (\(-0.063\) %). El N\(_2\) y el CO son casi armónicos en los primeros niveles.</li>
<li>La curva de la derecha muestra que el espaciado decrece linealmente con \(n\) hasta anularse en la disociación: ese «colapso de la escalera» es la medida de \(D_e\), conocida como método de Birge–Sponer.</li>
</ul></div>
</section>

<section>
<h2>Más allá de las moléculas</h2>
<p>El oscilador cuántico aparece en cada capítulo siguiente. El campo electromagnético en una cavidad es un conjunto de osciladores de frecuencias \(\omega_k\), y el número \(n\) de cuantos en cada modo es el número de fotones: la energía media de la ley de Planck, \(\bar E=\hbar\omega/(e^{\hbar\omega/k_BT}-1)\), es la de un oscilador en equilibrio térmico, y la energía de punto cero \(\tfrac12\hbar\omega\) de cada modo es la raíz de la fuerza de Casimir. Los átomos de un cristal son osciladores acoplados cuyos cuantos son los fonones (capítulo 19); la capacidad calorífica de los sólidos a baja temperatura, que la física clásica no explicaba, resulta de esa cuantización (Einstein, 1907). Los núcleos oscilan en la molécula con los niveles de este capítulo, y a su vez cada modo vibracional tiene la «temperatura» \(\Theta=\hbar\omega/k_B\) por debajo de la cual se congela (3122 K para el CO, 6332 K para el H\(_2\)).</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Para el CO (\(\omega_e=2169.81\) cm\(^{-1}\), \(\mu=6.8562\) u) halle la frecuencia y el periodo de vibración, la constante de fuerza, la energía de punto cero y la longitud \(x_0\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Frecuencia.</b> \(\nu=c\tilde\nu=2.99792\times10^{10}\times2169.81=6.5049\times10^{13}\) Hz; \(T=1/\nu=15.37\) fs; \(\omega=2\pi\nu=4.0872\times10^{14}\) s\(^{-1}\).</li>
<li><b>Constante de fuerza.</b> \(\mu=6.8562\times1.66054\times10^{-27}=1.1385\times10^{-26}\) kg; \(k=\mu\omega^2=1902\) N/m.</li>
<li><b>Punto cero.</b> \(\tfrac12\hbar\omega=\tfrac12(1.05457\times10^{-34})(4.0872\times10^{14})/1.60218\times10^{-19}=0.1345\) eV.</li>
<li><b>Longitud.</b> \(x_0=\sqrt{\hbar/\mu\omega}=4.76\) pm.</li>
<li><b>Resultado.</b> <span class="ans">65.05 THz y 15.37 fs; 1902 N/m; 0.1345 eV; 4.76 pm.</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>(a) Fracción de moléculas de CO en el estado \(n=1\) a 300 K, relativa a \(n=0\), y temperatura vibracional. (b) Probabilidad de encontrar la partícula en la región clásicamente prohibida en el estado fundamental.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>(a) Población.</b> \(N_1/N_0=e^{-\hbar\omega/k_BT}\); \(\hbar\omega=0.26902\) eV, \(k_BT=0.025852\) eV a 300 K: \(\hbar\omega/k_BT=10.41\), \(N_1/N_0=3.0\times10^{-5}\). Temperatura vibracional \(\Theta=\hbar\omega/k_B=3122\) K.</li>
<li><b>(b) Región prohibida.</b> \(|\psi_0|^2=e^{-\xi^2}/\sqrt\pi\); la región clásica es \(|\xi|\le1\): \(P=2\int_1^\infty e^{-\xi^2}\dd\xi/\sqrt\pi=\operatorname{erfc}(1)=0.1573\).</li>
<li><b>Resultado.</b> <span class="ans">\(3.0\times10^{-5}\); 3122 K; 15.73 %.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>El HCl tiene \(\omega_e=2990.95\) cm\(^{-1}\) con \(\mu_{\text{H}^{35}\text{Cl}}=0.97959\) u. Halle \(\omega_e\) del D\(^{35}\)Cl (\(m_\text{D}=2.01410\) u, \(m_{35}=34.96885\) u).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Masas reducidas.</b> \(\mu_\text{HCl}=1.00783\times34.96885/35.97668=0.97959\) u; \(\mu_\text{DCl}=2.01410\times34.96885/36.98295=1.90441\) u.</li>
<li><b>Cociente.</b> \(\omega_D/\omega_H=\sqrt{\mu_H/\mu_D}=\sqrt{0.51438}=0.71720\) (la constante de fuerza es la misma: depende solo de los electrones).</li>
<li><b>Frecuencia.</b> \(\omega_e(\text{DCl})=2990.95\times0.71720=2145.1\) cm\(^{-1}\).</li>
<li><b>Resultado.</b> <span class="ans">0.7172; 2145.1 cm\(^{-1}\) (observado 2145.2).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Con \(\omega_e=2169.81\) cm\(^{-1}\) y \(\omega_ex_e=13.288\) cm\(^{-1}\) (CO), calcule con Morse la banda fundamental, el primer sobretono, \(D_e\) y el número de estados ligados, y compare con 2143.27 y 4259.7 cm\(^{-1}\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Fundamental.</b> \(\omega_e-2\omega_ex_e=2169.81-26.576=2143.23\) cm\(^{-1}\) (\(-0.002\) % frente al observado).</li>
<li><b>Sobretono.</b> \(2\omega_e-6\omega_ex_e=4339.62-79.728=4259.89\) cm\(^{-1}\) (observado 4259.74).</li>
<li><b>\(D_e\).</b> \(\omega_e^2/4\omega_ex_e=2169.81^2/53.152=88\,578\) cm\(^{-1}=10.98\) eV.</li>
<li><b>Estados.</b> \(\lfloor2169.81/26.576-0.5\rfloor+1=82\).</li>
<li><b>Resultado.</b> <span class="ans">2143.23 y 4259.89 cm\(^{-1}\); 10.98 eV; 82 estados.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Compruebe para \(n=1\) que la función \(\psi_1\propto\xi e^{-\xi^2/2}\) cumple la ecuación con \(E=\tfrac32\hbar\omega\), y calcule \(\langle x^2\rangle\), \(\langle p^2\rangle\), \(\Delta x\Delta p\) y la energía potencial media.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Ecuación.</b> \(\psi'=(1-\xi^2)e^{-\xi^2/2}\), \(\psi''=(\xi^3-3\xi)e^{-\xi^2/2}\); \(\psi''+(3-\xi^2)\psi=(\xi^3-3\xi+3\xi-\xi^3)e^{-\xi^2/2}=0\), es decir, \(2E/\hbar\omega=3\).</li>
<li><b>Valores esperados.</b> Con \(\psi_1^2=2\xi^2e^{-\xi^2}/\sqrt\pi\): \(\langle\xi^2\rangle=\tfrac32\) (en unidades de \(x_0^2\)); \(\langle p^2\rangle=\tfrac32\hbar^2/x_0^2\).</li>
<li><b>Incertidumbre.</b> \(\Delta x\Delta p=\sqrt{\tfrac32\cdot\tfrac32}\hbar=1.5\hbar\) (\(=(n+\tfrac12)\hbar\)).</li>
<li><b>Energía potencial.</b> \(\langle V\rangle=\tfrac12\mu\omega^2\langle x^2\rangle=\tfrac12\hbar\omega\cdot\tfrac32=\tfrac34\hbar\omega=E_1/2\).</li>
<li><b>Resultado.</b> <span class="ans">\(\langle x^2\rangle=\tfrac32x_0^2\); \(\langle p^2\rangle=\tfrac32\hbar^2/x_0^2\); \(1.5\hbar\); \(\langle V\rangle=\tfrac34\hbar\omega\).</span></li>
</ol></details></li>
</ol>
