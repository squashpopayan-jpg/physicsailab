<template class="chapter-src" data-id="etero" data-num="1" data-title="El problema del éter y los postulados de Einstein" data-part="Parte I · Relatividad especial" data-short="La relatividad galileana, el fracaso de la electrodinámica de Maxwell ante ella, el experimento de Michelson y Morley, los dos postulados de Einstein, el reloj de luz y la simultaneidad relativa">
<p class="lead">A fines del siglo XIX la física tenía dos teorías magníficas que no se llevaban bien: la mecánica de Newton, que obedece el principio de relatividad de Galileo, y el electromagnetismo de Maxwell, que predice una velocidad fija para la luz. Para reconciliarlas se postuló un medio, el éter, y se diseñó un experimento para detectar el movimiento de la Tierra a través de él. El resultado fue nulo. Este capítulo reconstruye ese argumento con todos sus pasos, enuncia los postulados con los que Einstein lo resolvió en 1905 y obtiene, solo con ellos y un poco de geometría, las dos primeras sorpresas de la relatividad: el tiempo transcurre a ritmos distintos y la simultaneidad depende del observador.</p>

<section>
<h2>Relatividad galileana y la luz de Maxwell</h2>
<p>Un <span class="term">sistema inercial</span> es aquel en que una partícula libre se mueve con velocidad constante. Si \(S'\) se mueve respecto de \(S\) con velocidad constante \(v\) a lo largo de \(x\) y los orígenes coinciden en \(t=0\), la mecánica clásica relaciona las coordenadas con la <span class="term">transformación de Galileo</span>:</p>
<div class="eq key" data-name="Transformación de Galileo">\[x'=x-vt,\quad y'=y,\quad z'=z,\quad t'=t\qquad\Longrightarrow\qquad u'=u-v,\quad a'=a.\]</div>
<p>Las leyes de Newton (\(F=ma\), con fuerzas que dependen solo de las posiciones relativas) tienen la misma forma en \(S\) y en \(S'\): ningún experimento de mecánica dentro de un vagón con velocidad constante delata su movimiento. Es el principio de relatividad que Galileo ilustró en 1632 con el barco. Pero la ley de adición de velocidades \(u'=u-v\) choca con el electromagnetismo. De las ecuaciones de Maxwell en el vacío se deduce que los campos obedecen la ecuación de ondas y que la velocidad de propagación es una constante fija por las propiedades eléctricas y magnéticas del vacío:</p>
<div class="eq key" data-name="La velocidad de la luz en las ecuaciones de Maxwell">\[\nabla^2\vb E-\frac1{c^2}\pdv{^2\vb E}{t^2}=0,\qquad c=\frac1{\sqrt{\mu_0\varepsilon_0}}=299\,792\,458\ \text{m/s}.\]</div>
<p>Si la transformación de Galileo fuese cierta, la ecuación de ondas no tendría la misma forma en todos los sistemas inerciales. Con \(x=x'+vt'\) y \(t=t'\), las derivadas se transforman como \(\partial_x=\partial_{x'}\) y \(\partial_t=\partial_{t'}-v\,\partial_{x'}\). Sustituyendo en una dimensión:</p>
<div class="eq">\[\pdv{^2\psi}{x^2}-\frac1{c^2}\pdv{^2\psi}{t^2}=\Bigl(1-\frac{v^2}{c^2}\Bigr)\pdv{^2\psi}{x'^2}+\frac{2v}{c^2}\,\frac{\partial^2\psi}{\partial x'\,\partial t'}-\frac1{c^2}\pdv{^2\psi}{t'^2}.\]</div>
<p>Aparece un término cruzado que no existe en \(S\): en \(S'\) las ondas viajarían con velocidad \(c-v\) en un sentido y \(c+v\) en el otro. Solo habría un sistema privilegiado, el del medio en que la luz se propaga, donde vale \(c\) en todas las direcciones. Ese medio, el <span class="term">éter luminífero</span>, era la salida natural: la luz sería una vibración del éter, como el sonido lo es del aire. Si el éter existe, la Tierra, que orbita con \(29.78\) km/s, se mueve a través de él y la velocidad de la luz medida en el laboratorio debería depender de la dirección y de la estación.</p>
<div class="box note"><h4>Lo que se podía esperar del éter</h4><p>La razón entre la velocidad orbital terrestre y la de la luz es \(\beta=v/c=9.93\times10^{-5}\). Cualquier efecto de primer orden en \(\beta\) se habría medido hace tiempo; la aberración estelar (el desplazamiento aparente de las estrellas hasta 20.49″, descubierto por Bradley en 1728) y el arrastre parcial de Fresnel explicaban esos casos. Un efecto de segundo orden, \(\beta^2\approx10^{-8}\), exigía un instrumento de sensibilidad extrema: el interferómetro de Michelson.</p></div>
</section>

<section>
<h2>El experimento de Michelson y Morley</h2>
<p>Albert Michelson inventó su interferómetro para este fin (1881) y lo perfeccionó con Edward Morley en Cleveland (1887). Un haz de luz se divide en dos con un espejo semiplateado; cada mitad recorre un brazo de longitud \(L\), los brazos son perpendiculares, se refleja en un espejo y regresa; al recombinarse producen franjas de interferencia cuya posición depende de la diferencia de tiempos de recorrido. Para ganar sensibilidad usaron reflexiones múltiples (longitud efectiva \(L\approx11\) m) y montaron todo sobre una losa de piedra que flotaba en mercurio, para poder girarla sin vibraciones.</p>
<h3>Deducción de la diferencia de tiempos</h3>
<p>Sea \(\beta=v/c\) la velocidad del aparato respecto del éter, en la dirección del brazo 1. En el sistema del éter la luz viaja a \(c\) en todas direcciones.</p>
<p><b>Brazo paralelo al movimiento.</b> Hacia el espejo, que se aleja a \(v\), la luz avanza a velocidad relativa \(c-v\); de regreso, \(c+v\):</p>
<div class="eq">\[T_\parallel=\frac L{c-v}+\frac L{c+v}=\frac{2Lc}{c^2-v^2}=\frac{2L}c\,\frac1{1-\beta^2}.\]</div>
<p><b>Brazo perpendicular.</b> Mientras la luz va y vuelve, el espejo se desplaza \(vT_\perp/2\) en cada tramo; por Pitágoras, cada tramo mide \(cT_\perp/2\) y satisface \((cT_\perp/2)^2=L^2+(vT_\perp/2)^2\):</p>
<div class="eq">\[T_\perp=\frac{2L}c\,\frac1{\sqrt{1-\beta^2}}.\]</div>
<p>La diferencia, desarrollando en \(\beta^2\), es \(T_\parallel-T_\perp=\dfrac{2L}c\left[(1+\beta^2+\dots)-(1+\tfrac12\beta^2+\dots)\right]\approx\dfrac{L}{c}\beta^2\). Al girar el aparato 90° los brazos intercambian sus papeles y la diferencia cambia de signo, de modo que el cambio total es el doble. En franjas (cada \(\lambda/c\) de retraso mueve una franja):</p>
<div class="eq key" data-name="Corrimiento de franjas esperado con éter">\[\Delta N=\frac{c\,\Delta(T_\parallel-T_\perp)}\lambda\approx\frac{2L}{\lambda}\,\frac{v^2}{c^2}.\]</div>
<p>Para un brazo en un ángulo \(\theta\) con el viento de éter, el mismo razonamiento da exactamente \(T(\theta)=\dfrac{2L}c\dfrac{\sqrt{1-\beta^2\operatorname{sen}^2\theta}}{1-\beta^2}\), de donde la posición de las franjas varía como \(\cos2\theta\) al girar el aparato (el simulador de abajo usa esta expresión exacta).</p>
<div class="box ex"><h4>Lo que Michelson y Morley esperaban</h4>
<p><strong>Datos.</strong> \(L=11\) m, \(\lambda=550\) nm, \(v=29.78\) km/s (velocidad orbital de la Tierra, la mínima que el éter debía tener respecto del laboratorio en algún momento del año). <strong>Procedimiento.</strong> (1) \(\beta=v/c=29\,780/299\,792\,458=9.9335\times10^{-5}\), \(\beta^2=9.8675\times10^{-9}\). (2) \(\Delta N=2L\beta^2/\lambda=2(11)(9.8675\times10^{-9})/(550\times10^{-9})=0.395\) franjas. (3) Con la velocidad del Sol respecto de la radiación cósmica de fondo (369.8 km/s) habría sido \(\Delta N=60.9\). <strong>Resultado.</strong> Un corrimiento cercano a 0.4 franja, perfectamente medible: se podía apreciar una centésima de franja. Michelson y Morley observaron, a lo sumo, del orden de 0.01 franja, menos de 1/40 de lo esperado y dentro del ruido, sin la dependencia con la orientación ni con la hora que predecía el éter.</p></div>
<div class="sim" data-sim="michelson" data-title="Interferómetro de Michelson–Morley: franjas esperadas con éter"></div>
<div class="sim-guide"><ul>
<li>Con los valores de 1887 (\(L=11\) m, 550 nm, 29.78 km/s) la curva oscila entre \(\pm0.197\) franja según la orientación; la diferencia entre los extremos, el cambio al girar 90°, es \(0.395\) franja. La banda de ±0.01 franja es lo que realmente se midió.</li>
<li>Active la contracción de FitzGerald–Lorentz: la curva se aplana en cero para cualquier velocidad, longitud u orientación. Esa hipótesis (\(L_\parallel=L\sqrt{1-\beta^2}\), propuesta por FitzGerald en 1889 y por Lorentz en 1892) reproduce el resultado nulo, pero como un arreglo hecho a la medida; Einstein la deduce de los postulados.</li>
<li>Con una cota de 0.01 franja se obtiene \(v\lt4.74\) km/s, cerca de 1/6 de la velocidad orbital. Y el éter no podía estar «arrastrado» por la Tierra sin contradecir la aberración estelar. Los experimentos con resonadores ópticos criogénicos (Herrmann et al., 2009; Eisele et al., 2009) han reducido la anisotropía de la velocidad de la luz hasta \(|\Delta c/c|\lesssim10^{-17}\).</li>
</ul></div>
</section>

<section>
<h2>Los postulados de Einstein</h2>
<p>En «Sobre la electrodinámica de los cuerpos en movimiento» (<em>Annalen der Physik</em> 17, 891, 1905), Einstein no intentó salvar el éter: observó que la asimetría que aparece en la electrodinámica al pasar de un imán que se mueve a un conductor que se mueve (la misma corriente inducida se explicaba de dos formas distintas) no está en los fenómenos, sino en la teoría, y propuso dos postulados:</p>
<div class="eq key" data-name="Los postulados de la relatividad especial">\[\textbf{I. }\text{Las leyes de la física tienen la misma forma en todos los sistemas inerciales.}\qquad \textbf{II. }\text{La luz se propaga en el vacío con la misma velocidad } c \text{ en todos ellos, independientemente del movimiento de la fuente.}\]</div>
<p>El primero extiende a toda la física, incluida la electrodinámica, el principio de Galileo y elimina el sistema privilegiado: el éter es superfluo. El segundo es la afirmación empírica que los resultados de Michelson y Morley respaldan y que se ha comprobado con mucha mayor precisión: Alväger et al. (<em>Phys. Lett.</em> 12, 260, 1964) midieron la velocidad de los fotones emitidos por piones neutros que se movían a \(0.99975\,c\) y obtuvieron \((2.9977\pm0.0004)\times10^8\) m/s, la misma \(c\) y no \(c+v\). Desde 1983 el metro se define fijando el valor exacto \(c=299\,792\,458\) m/s.</p>
<div class="box warn"><h4>Qué no dice el segundo postulado</h4><p>No dice que la velocidad de la luz en un medio sea siempre \(c\) (en el agua es \(c/1.33\)); habla del vacío. Tampoco que no se puedan sumar velocidades: lo que el postulado obliga es a cambiar la regla de suma, \(u'=u-v\), por otra distinta a velocidades altas, que se deduce en el capítulo 2. La transformación de Galileo es un límite válido para \(v\ll c\), y Newton queda como aproximación excelente, no como error.</p></div>
</section>

<section>
<h2>El reloj de luz y la dilatación del tiempo</h2>
<p>Con solo los postulados se puede deducir cómo corre un reloj en movimiento. Considere un <span class="term">reloj de luz</span>: dos espejos separados una distancia \(L\) perpendicular al movimiento, entre los que rebota un pulso; un «tic» es una ida y vuelta. En su sistema propio (el del reloj) el pulso sube y baja, y el tiempo de un tic es</p>
<div class="eq">\[T_0=\frac{2L}c.\]</div>
<p>En otro sistema \(S\), en el que el reloj se mueve con velocidad \(v\) en la dirección \(x\), los espejos no cambian su separación transversal (una longitud perpendicular al movimiento no se modifica: si lo hiciera, dos varillas idénticas lanzadas una al lado de la otra, y que se cruzan, dejarían marcas distintas en una pared, y eso es una contradicción para ambos observadores). La luz describe un zigzag: en un tic \(T\) el reloj avanza \(vT\) y el pulso, por el segundo postulado, sigue viajando a \(c\), no a \(\sqrt{c^2+v^2}\). Cada tramo tiene proyección vertical \(L\) y horizontal \(vT/2\):</p>
<div class="eq">\[\Bigl(\frac{cT}2\Bigr)^2=L^2+\Bigl(\frac{vT}2\Bigr)^2\ \Rightarrow\ T=\frac{2L}{c\sqrt{1-v^2/c^2}}=\gamma\,T_0.\]</div>
<div class="eq key" data-name="Dilatación del tiempo y factor de Lorentz">\[\Delta t=\gamma\,\Delta\tau,\qquad \gamma=\frac1{\sqrt{1-\beta^2}},\qquad \beta=\frac vc.\]</div>
<p>\(\Delta\tau\) es el <span class="term">tiempo propio</span>: el intervalo medido por un único reloj que está presente en los dos sucesos. Es el menor posible, y todo otro observador, para quien los dos sucesos ocurren en lugares distintos, mide un intervalo mayor en el factor \(\gamma\). La conclusión no depende de que el reloj sea de luz: si un reloj de otro tipo marchara a un ritmo distinto, se violaría el primer postulado, pues permitiría distinguir el movimiento absoluto comparando los dos relojes. El efecto es simétrico: cada observador ve que el reloj del otro atrasa, y no hay contradicción porque no comparan los relojes en el mismo lugar (es la clave de la paradoja de los gemelos, capítulo 3).</p>
<div class="box ex"><h4>Un reloj de luz de 30 cm</h4>
<p><strong>Datos.</strong> \(L=0.30\) m. <strong>Procedimiento.</strong> (1) Periodo propio: \(T_0=2L/c=0.60/299\,792\,458=2.0014\) ns. (2) A \(\beta=0.6\): \(\gamma=1/\sqrt{1-0.36}=1.25\) y \(T=2.5017\) ns; el recorrido de la luz por tic es \(cT=0.75\) m frente a \(2L=0.60\) m, con catetos \(0.60\) y \(vT=0.45\) m (triángulo 3-4-5). (3) A \(\beta=0.99\): \(\gamma=7.0888\) y \(T=14.187\) ns. <strong>Resultado.</strong> Mientras en el sistema \(S\) transcurre un tiempo de 14.187 ns, el reloj en movimiento a 0.99\(c\) solo cuenta un tic de 2.0014 ns.</p></div>
<div class="sim" data-sim="relojluz" data-title="Reloj de luz: de la geometría del zigzag a la dilatación del tiempo"></div>
<div class="sim-guide"><ul>
<li>A \(\beta=0.6\), el reloj de la izquierda hace 1.25 tics por cada tic del de la derecha (\(\gamma=1.25\)); la luz recorre \(0.75\) m por tic en lugar de \(0.60\) m, con catetos \(0.60\) m y \(0.45\) m.</li>
<li>Suba \(\beta\) a 0.99: el periodo observado pasa a 14.19 ns y el cateto horizontal \(vT=4.21\) m es unas siete veces el trayecto vertical \(2L=0.60\) m. Cuando \(\beta\to1\), \(\gamma\to\infty\): visto desde \(S\), el reloj casi se detiene.</li>
<li>Con \(\beta=0\) el zigzag degenera en la línea vertical y \(\gamma=1\). Para velocidades cotidianas (\(\beta\sim10^{-6}\), un avión) \(\gamma-1\approx\tfrac12\beta^2\sim10^{-13}\): el efecto es real pero diminuto.</li>
</ul></div>
</section>

<section>
<h2>La relatividad de la simultaneidad</h2>
<p>Medir el tiempo en un lugar es fácil; compararlo en lugares distintos exige una convención. Einstein definió la sincronización con luz: el reloj en B se pone en marcha con la lectura \(t_B=t_A+d/c\) cuando le llega una señal emitida desde A en \(t_A\), donde \(d\) es la distancia que los separa. Dos sucesos son <span class="term">simultáneos</span> en un sistema si una pareja de relojes sincronizados así les asigna el mismo tiempo. Aplicando el mismo procedimiento en otro sistema, los resultados no coinciden.</p>
<h3>El tren de Einstein</h3>
<p>Un tren de longitud propia \(L_0\) pasa a velocidad \(v\) frente a un andén. En el andén, dos rayos caen a la vez (\(t=0\)) en los extremos A (delantero) y B (trasero). Una pasajera sentada en el centro M del tren recibe la luz de los dos. En el sistema del andén, M se acerca a la luz que viene de A y se aleja de la que viene de B, de modo que recibe primero el destello de A. Pero la pasajera sabe que está a la misma distancia de ambos extremos en su propio sistema, y que la luz va a \(c\) en los dos sentidos: debe concluir que el rayo A cayó <em>antes</em> que el B. Lo que para el andén es simultáneo no lo es para el tren. El desfase se calcula a partir de la longitud medida en el andén \(L\):</p>
<div class="eq key" data-name="Relatividad de la simultaneidad">\[\Delta t'=-\gamma\,\frac{v\,\Delta x}{c^2}\quad\text{para sucesos con }\Delta t=0,\qquad |\Delta t'|=\gamma\frac{vL}{c^2}=\frac{vL_0}{c^2}.\]</div>
<p>El último paso usa \(L=L_0/\gamma\), la contracción de la longitud que se deduce en el capítulo siguiente (aquí se adelanta, pues se necesita para expresar el desfase con la longitud propia). El signo indica que, en el tren, el suceso delantero (\(\Delta x>0\) hacia la dirección del movimiento) ocurre antes. Cuanto mayor la separación espacial, mayor el desfase: la relatividad de la simultaneidad es un efecto de la distancia, y por eso no se nota en la vida cotidiana (\(vL_0/c^2\) para un tren real de 200 m a 100 km/h son \(6\times10^{-14}\) s).</p>
<div class="box ex"><h4>Un tren muy rápido</h4>
<p><strong>Datos.</strong> \(L_0=200\) m, \(\beta=0.6\). <strong>Procedimiento.</strong> (1) \(\gamma=1.25\); longitud en el andén \(L=L_0/\gamma=160\) m, de modo que A y B están en \(x=\pm80\) m. (2) En el tren, los rayos se registran en \(t'=\gamma(t-vx/c^2)\): \(t'_A=-2.0014\times10^{-7}\) s y \(t'_B=+2.0014\times10^{-7}\) s. (3) Desfase: \(\Delta t'=\gamma vL/c^2=4.0028\times10^{-7}\) s \(=400.3\) ns; coincide con \(vL_0/c^2=0.6(200)/c\). (4) <strong>Comprobación.</strong> El intervalo \(c^2\Delta t^2-\Delta x^2\) es el mismo en ambos sistemas: en el andén \(0-160^2=-25\,600\) m²; en el tren, \((c\Delta t')^2-L_0^2=120^2-200^2=-25\,600\) m². Ese número, que no depende del observador, es el germen del espacio-tiempo del capítulo 3.</p></div>
<div class="sim" data-sim="tren" data-title="El tren de Einstein: dos rayos simultáneos en el andén, no en el tren"></div>
<div class="sim-guide"><ul>
<li>Con \(L_0=200\) m y \(\beta=0.6\): en el andén el tren mide 160 m; en el tren, A cae 400.3 ns antes que B. La línea de «\(t'=0\)» está inclinada respecto de la de «\(t=0\)» en el diagrama, con pendiente \(\beta\).</li>
<li>Los rayos de luz del diagrama (a 45°) llegan al pasajero M con una diferencia de 400.3 ns, igual al desfase de emisión en el tren: M está a mitad de camino de ambos en su sistema, y es consistente con los dos postulados.</li>
<li>Con \(\beta\to0\) las dos líneas coinciden y se recupera la simultaneidad absoluta de Newton. A \(\beta=0.95\) el tren mide solo 62.45 m en el andén y el desfase en el tren es de 633.8 ns.</li>
</ul></div>
</section>

<section>
<h2>Lo que queda por hacer</h2>
<p>Los postulados han dado dos resultados cualitativamente nuevos: los relojes en movimiento marchan más lento y la simultaneidad no es absoluta. Falta una transformación de coordenadas que los contenga y reemplace a la de Galileo: es la transformación de Lorentz, y se deduce en el capítulo 2 exigiendo solo que sea lineal y que deje invariante la velocidad de la luz. De allí saldrán la contracción de las longitudes, la nueva regla de suma de velocidades (que ya no permite superar \(c\)) y las pruebas experimentales, como la supervivencia de los muones atmosféricos y los relojes atómicos viajeros.</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule el corrimiento de franjas que predice la hipótesis del éter para un interferómetro de brazos efectivos de 11 m con luz de 550 nm si la velocidad respecto del éter es la orbital de la Tierra, y la velocidad máxima compatible con un corrimiento de 0.01 franja.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Planteamiento.</b> \(\Delta N=2L\beta^2/\lambda\) al girar 90°. <span class="given">Datos: \(L=11\) m, \(\lambda=550\) nm, \(v=29.78\) km/s, \(c=299\,792\,458\) m/s.</span></li>
<li><b>Cociente de velocidades.</b> \(\beta=29\,780/299\,792\,458=9.9335\times10^{-5}\), \(\beta^2=9.8675\times10^{-9}\).</li>
<li><b>Corrimiento esperado.</b> \(\Delta N=2(11)(9.8675\times10^{-9})/(550\times10^{-9})=0.3947\).</li>
<li><b>Cota.</b> Con \(\Delta N\le0.01\): \(\beta\le\sqrt{\Delta N\lambda/2L}=\sqrt{0.01(550\times10^{-9})/22}=1.5811\times10^{-5}\), es decir, \(v\le4.740\) km/s, el 15.9 % de la velocidad orbital (cerca de 1/6).</li>
<li><b>Resultado.</b> <span class="ans">\(\Delta N=0.395\) franjas; \(v\lt4.74\) km/s.</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Un reloj de luz tiene espejos separados 0.30 m. Halle su periodo propio y el periodo que mide un observador respecto del cual se mueve a \(\beta=0.6\) y a \(\beta=0.99\), y la longitud del trayecto de la luz por tic en el primer caso.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Periodo propio.</b> \(T_0=2L/c=0.60/299\,792\,458=2.0014\) ns.</li>
<li><b>\(\beta=0.6\).</b> \(\gamma=1/\sqrt{1-0.36}=1.25\); \(T=\gamma T_0=2.5017\) ns.</li>
<li><b>Trayecto de la luz.</b> \(cT=299\,792\,458\times2.5017\times10^{-9}=0.7500\) m; el reloj avanza \(vT=0.6\,cT=0.4500\) m y la altura recorrida es \(2L=0.60\) m (\(0.60^2+0.45^2=0.75^2\)).</li>
<li><b>\(\beta=0.99\).</b> \(\gamma=1/\sqrt{1-0.9801}=7.0888\); \(T=14.187\) ns.</li>
<li><b>Resultado.</b> <span class="ans">\(T_0=2.0014\) ns; \(T=2.5017\) ns y \(0.750\) m; \(T=14.187\) ns.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Un tren de longitud propia 200 m viaja a \(\beta=0.6\). Dos rayos caen simultáneamente, en el sistema del andén, en sus dos extremos. Calcule la longitud del tren en el andén, el desfase entre los rayos en el sistema del tren y compruebe la invariancia del intervalo.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Longitud en el andén.</b> \(\gamma=1.25\), \(L=L_0/\gamma=160\) m (se justifica en el capítulo 2).</li>
<li><b>Desfase.</b> En el andén \(\Delta t=0\) y \(\Delta x=160\) m, así que \(\Delta t'=-\gamma v\Delta x/c^2\); en valor absoluto \(|\Delta t'|=1.25(0.6)(160)/c=120/299\,792\,458=4.0028\times10^{-7}\) s. El rayo delantero cae primero.</li>
<li><b>Separación espacial en el tren.</b> \(\Delta x'=\gamma(\Delta x-v\Delta t)=1.25(160)=200\) m, la longitud propia.</li>
<li><b>Intervalo.</b> Andén: \(c^2\Delta t^2-\Delta x^2=-160^2=-25\,600\) m². Tren: \((c\Delta t')^2-\Delta x'^2=120^2-200^2=-25\,600\) m². Coinciden.</li>
<li><b>Resultado.</b> <span class="ans">\(L=160\) m; \(\Delta t'=400.3\) ns (A antes que B); intervalo \(-25\,600\) m² en ambos sistemas.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que la ecuación de ondas no es invariante bajo la transformación de Galileo (obtenga el término cruzado) y calcule, con \(v=0.5c\), la velocidad de un pulso de luz que viaja en \(+x\) y en \(-x\) vista desde \(S'\) si valiera la regla galileana.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Derivadas.</b> Con \(x=x'+vt'\), \(t=t'\): \(\partial_x=\partial_{x'}\), \(\partial_t=\partial_{t'}-v\partial_{x'}\); luego \(\partial_t^2=\partial_{t'}^2-2v\partial_{x'}\partial_{t'}+v^2\partial_{x'}^2\).</li>
<li><b>Sustitución.</b> \(\partial_x^2\psi-c^{-2}\partial_t^2\psi=(1-v^2/c^2)\partial_{x'}^2\psi+(2v/c^2)\partial_{x'}\partial_{t'}\psi-c^{-2}\partial_{t'}^2\psi\). El coeficiente cruzado, \(2v/c^2\ne0\), no se anula: la forma de la ecuación cambia (SymPy lo confirma con una función arbitraria).</li>
<li><b>Velocidades.</b> Una onda \(f(x-ct)=f(x'-(c-v)t')\) en \(S'\) se mueve a \(c-v=0.5c\) en \(+x\); la onda en \(-x\), \(g(x+ct)=g(x'+(c+v)t')\), a \(c+v=1.5c\). La razón es 3.</li>
<li><b>Resultado.</b> <span class="ans">Coeficiente cruzado \(2v/c^2\); velocidades \(0.5c\) y \(1.5c\).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Para \(\beta=0.1\) y \(L=1\) m calcule exactamente la diferencia de caminos \(c(T_\parallel-T_\perp)\) y compárela con la aproximación \(L\beta^2\). Muestre que con la contracción de FitzGerald–Lorentz el resultado es exactamente nulo.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Fórmulas exactas.</b> \(cT_\parallel=2L/(1-\beta^2)\), \(cT_\perp=2L/\sqrt{1-\beta^2}\).</li>
<li><b>Números.</b> \(1/(1-0.01)=1.010101\), \(1/\sqrt{0.99}=1.005038\); diferencia \(0.005063\); por \(2L\): \(0.010126\) m.</li>
<li><b>Comparación.</b> \(L\beta^2=0.010000\) m; el error de la aproximación es del 1.26 %: el desarrollo completo es \(L\beta^2(1+\tfrac54\beta^2+\dots)\), y \(\tfrac54\beta^2=1.25\,\%\).</li>
<li><b>Con contracción.</b> El brazo paralelo mide \(L\sqrt{1-\beta^2}\): \(cT'_\parallel=2L\sqrt{1-\beta^2}/(1-\beta^2)=2L/\sqrt{1-\beta^2}=cT_\perp\). La diferencia es cero para todo \(\beta\).</li>
<li><b>Resultado.</b> <span class="ans">\(0.010126\) m frente a \(0.010000\) m; con contracción, \(0\).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Un interferómetro moderno con láser de He–Ne (632.8 nm) y brazos de 1 m se gira en un aparato que detecta corrimientos de 0.001 franja. ¿Qué corrimiento daría un «viento de éter» de 300 km/s y qué velocidad mínima del aparato podría detectar?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Corrimiento a 300 km/s.</b> \(\beta=10^{-3}\) (aproximadamente): \(\Delta N=2L\beta^2/\lambda=2(1)(10^{-6})/(632.8\times10^{-9})=3.16\) franjas.</li>
<li><b>Sensibilidad.</b> \(\beta_{\min}=\sqrt{\Delta N_{\min}\lambda/2L}=\sqrt{10^{-3}(632.8\times10^{-9})/2}=1.7788\times10^{-5}\), que corresponde a \(v_{\min}=5.33\) km/s.</li>
<li><b>Comentario.</b> Con un brazo de 1 m el aparato mejora la cota de 1887 apenas lo que mejora la sensibilidad de franja (de 0.01 a 0.001) y reduce \(L\); los resonadores modernos ganan órdenes de magnitud porque la medida es de frecuencia (\(\Delta\nu/\nu\sim10^{-17}\)), no de franjas.</li>
<li><b>Resultado.</b> <span class="ans">3.16 franjas; \(v_{\min}=5.33\) km/s.</span></li>
</ol></details></li>
</ol>
