<template class="chapter-src" data-id="atomos" data-num="16" data-title="Átomos con varios electrones" data-part="Parte IV · Átomos, luz y moléculas" data-short="Partículas idénticas y principio de exclusión, el átomo de helio (perturbación, variacional y Hartree–Fock), el llenado de capas y la tabla periódica, los términos espectroscópicos y las reglas de Hund, y el apantallamiento de Slater">
<p class="lead">El hidrógeno se resuelve exactamente; con dos electrones ya no. Aparece la repulsión entre ellos, que impide separar el problema, y una propiedad sin análogo clásico: los electrones son partículas idénticas y la función de onda debe cambiar de signo si se intercambian. De estas dos ideas, el principio de exclusión y el apantallamiento, sale la tabla periódica. Este capítulo resuelve el helio de tres maneras (perturbación, variacional y Hartree–Fock numérico), compara con la energía exacta, construye el llenado de capas y los términos fundamentales por las reglas de Hund, y los contrasta con las configuraciones medidas de los 54 primeros elementos.</p>

<section>
<h2>Partículas idénticas y principio de exclusión</h2>
<p>Dos electrones son indistinguibles: ningún experimento puede decir cuál es el «primero». Por eso \(|\Psi(1,2)|^2\) debe ser igual al intercambiar sus coordenadas (posición y espín), y \(\Psi\) solo puede ser simétrica o antisimétrica. Los electrones, de espín semientero, son <span class="term">fermiones</span> y su función de onda total es antisimétrica (el teorema espín–estadística, deducible de la teoría cuántica de campos relativista, cap. 26). Para dos electrones en orbitales \(\phi_a,\phi_b\):</p>
<div class="eq key" data-name="Antisimetría de la función de onda (determinante de Slater)">\[\Psi(1,2)=\frac1{\sqrt2}\bigl[\phi_a(1)\phi_b(2)-\phi_b(1)\phi_a(2)\bigr]\ \Longrightarrow\ \Psi=0\ \text{si}\ \phi_a=\phi_b.\]</div>
<p>Es el <span class="term">principio de exclusión de Pauli</span> (1925): dos electrones no pueden ocupar el mismo estado cuántico \((n,l,m_l,m_s)\). Cada orbital espacial cabe, pues, con dos electrones de espines opuestos, y la capa \(n\) admite \(2n^2\) electrones (2, 8, 18, 32…). Como la función total debe ser antisimétrica, la parte espacial y la de espín están ligadas: espín <em>singlete</em> (antiparalelo, \(S=0\)) con parte espacial simétrica, y espín <em>triplete</em> (paralelo, \(S=1\)) con parte espacial antisimétrica. En el triplete los dos electrones tienden a estar lejos (hueco de intercambio) y su repulsión media es menor: la causa de la regla de Hund, y del ferromagnetismo, no es un acoplamiento magnético, sino la repulsión eléctrica combinada con la antisimetría.</p>
</section>

<section>
<h2>El átomo de helio</h2>
<p>En unidades atómicas (energía en hartree, 1 Ha \(=27.2114\) eV), el hamiltoniano del helio (o de un ion con dos electrones y carga \(Z\)) es \(H=-\tfrac12\nabla_1^2-\tfrac12\nabla_2^2-Z/r_1-Z/r_2+1/r_{12}\). El último término no permite separar variables y no hay solución analítica: la energía exacta no relativista, \(-2.90372\) Ha (\(-79.01\) eV), se obtiene con funciones de prueba de cientos de términos (Hylleraas, Pekeris, Drake) y concuerda con el experimento (suma de las dos ionizaciones, 24.587 + 54.418 eV, es decir \(-79.005\) eV) hasta correcciones relativistas y de electrodinámica cuántica de unos meV. Veamos tres aproximaciones.</p>
<p><strong>1. Perturbación de primer orden.</strong> Se toma \(1/r_{12}\) como perturbación. El estado de orden cero es \(1s^2\) hidrogenoide con \(E^{(0)}=-Z^2=-4\) Ha, y \(\langle1/r_{12}\rangle=5Z/8=1.25\) Ha: \(E=-Z^2+5Z/8=-2.75\) Ha \(=-74.83\) eV, un 5.3 % por encima del experimento. La perturbación (el 31 % de la energía de orden cero) no es pequeña.</p>
<p><strong>2. Variacional.</strong> Con la función de prueba \(\psi=(\zeta^3/\pi)e^{-\zeta(r_1+r_2)}\), donde \(\zeta\) representa una carga nuclear efectiva, \(\langle H\rangle(\zeta)=\zeta^2-2Z\zeta+\tfrac58\zeta\). El mínimo está en \(\zeta=Z-\tfrac5{16}\): cada electrón apantalla \(5/16=0.3125\) de la carga del otro. Para el helio, \(\zeta=27/16=1.6875\) y \(E=-(27/16)^2=-2.8477\) Ha \(=-77.49\) eV (error 1.9 %). Por el principio variacional, la energía de prueba nunca queda por debajo de la exacta, y es una cota superior; la primera aproximación (\(\zeta=Z\)) no es más que un punto de la parábola.</p>
<p><strong>3. Hartree–Fock.</strong> Se busca el mejor orbital \(\phi(\mathbf r)\) sin forzar su forma: cada electrón se mueve en el campo del núcleo y de la densidad promediada del otro, \(V_H(r)=\int|\phi(r')|^2/|\mathbf r-\mathbf r'|\,d^3r'\), y se itera hasta que el orbital sea autoconsistente. Para el helio da \(E_{HF}=-2.86168\) Ha \(=-77.87\) eV (error 1.4 %), con energía orbital \(\varepsilon=-0.918\) Ha. La diferencia con la energía exacta es la <span class="term">energía de correlación</span>: \(E_{\rm corr}=E_{\rm exacta}-E_{HF}=-0.04204\) Ha \(=-1.14\) eV, debida a que los electrones evitan estar juntos, algo que un campo promedio no recoge. En el simulador, el cálculo numérico de Hartree (malla logarítmica, extrapolación de Richardson) se compara con el método de Roothaan con orbitales de Slater y con el límite de Hartree–Fock de la literatura.</p>
<div class="sim" data-sim="helio" data-title="Helio y iones con dos electrones: perturbación, variacional y Hartree–Fock"></div>
<div class="sim-guide"><ul>
<li>Con \(Z=2\) y \(\zeta=1.6875\) el punto negro cae en el fondo de la parábola: \(-77.49\) eV, por encima de la línea de Hartree–Fock (\(-77.87\) eV) y de la exacta (\(-79.01\) eV). Con \(\zeta=2\) (sin apantallamiento) vuelve a \(-74.83\) eV: la perturbación de primer orden.</li>
<li>En la gráfica de la derecha, el orbital Hartree–Fock es más extendido que el hidrogenoide \(\zeta=Z\) y casi idéntico al de prueba óptimo: el electrón «ve» una carga menor que \(Z\).</li>
<li>Aumente \(Z\): al crecer la atracción nuclear, la repulsión entre electrones pesa menos y los errores relativos de todas las aproximaciones bajan; la energía de correlación cambia poco (de 1.14 eV en el He a 1.22 eV en el B³⁺).</li>
</ul></div>
<p>El helio también muestra el efecto de la antisimetría en los estados excitados \(1s2s\): con orbitales hidrogenoides, \(E=E_0+J\pm K\) con la integral de Coulomb \(J=17Z/81\) y la de intercambio \(K=16Z/729\) (hartree); el triplete (\(-K\), espacial antisimétrica) queda por debajo del singlete (\(+K\)). Los estados triplete y singlete se llaman <em>ortohelio</em> y <em>parahelio</em>; con \(Z=2\) la separación \(2K=2.39\) eV es tres veces mayor que la medida (0.80 eV, entre 19.82 y 20.62 eV sobre el fundamental), porque los orbitales hidrogenoides sin apantallar sobreestiman el solapamiento: la dirección es correcta, el tamaño no.</p>
</section>

<section>
<h2>El llenado de capas y la tabla periódica</h2>
<p>Para átomos con más electrones se usa el <span class="term">modelo de campo central</span>: cada electrón ocupa un orbital \((n,l)\) en el potencial apantallado del núcleo y de los demás. A diferencia del hidrógeno, la energía depende de \(l\): los orbitales penetrantes (\(s\), luego \(p\)) sienten más carga nuclear y bajan frente a \(d\) y \(f\). El orden de llenado se resume en la <span class="term">regla de Madelung</span>: de menor a mayor \(n+l\), y a igual \(n+l\) de menor \(n\): 1s, 2s, 2p, 3s, 3p, 4s, 3d, 4p, 5s, 4d, 5p… Las capas cerradas dan los gases nobles (\(Z=2,10,18,36,54\)), y los períodos tienen longitudes 2, 8, 8, 18, 18…</p>
<p>La regla no es una ley, sino un resumen. Entre los 54 primeros elementos, la configuración medida (NIST) coincide con la de Madelung en 46, y falla en ocho: Cr (\(3d^54s^1\)), Cu (\(3d^{10}4s^1\)), Nb, Mo, Ru, Rh, Pd y Ag, en los que las capas \(d\) semillenas o llenas, muy próximas en energía a la \(s\), ganan por intercambio. La simulación muestra la tabla de los 54 primeros elementos coloreada por una propiedad y marca las excepciones.</p>
<div class="sim" data-sim="periodica" data-title="Tabla periódica de los 54 primeros elementos: propiedades y configuraciones"></div>
<div class="sim-guide"><ul>
<li>Con «energía de primera ionización» (datos NIST), los máximos están en los gases nobles (He 24.587 eV, Ne 21.565 eV) y los mínimos en los alcalinos (Li 5.392 eV, Na 5.139 eV): después de cerrar una capa, el electrón siguiente está en una capa nueva, lejos y apantallado.</li>
<li>Con «carga efectiva de Slater» se ve que \(Z_{ef}\) crece a lo largo de un período (más protones y poco apantallamiento entre electrones de la misma capa) y cae al comenzar el siguiente: es la causa de la periodicidad de la ionización y del radio atómico.</li>
<li>Con Z = 24 y 29 (Cr, Cu) la configuración medida difiere de la de Madelung; el contorno naranja marca las ocho excepciones.</li>
</ul></div>
<h3>Reglas de Hund y términos espectroscópicos</h3>
<p>Dentro de una subcapa abierta, los electrones se acoplan en un momento angular orbital total \(L\) y un espín total \(S\) (acoplamiento LS, válido para átomos ligeros), y luego en \(J=L+S\), con el término \(^{2S+1}L_J\). Las <span class="term">reglas de Hund</span> dan el término de menor energía: (1) \(S\) máximo (espines paralelos: menor repulsión por antisimetría); (2) con ese \(S\), \(L\) máximo; (3) \(J=|L-S|\) si la subcapa está a menos de la mitad, \(J=L+S\) si está a más de la mitad (la espín–órbita invierte su signo). Por ejemplo, el carbono \(2p^2\): \(S=1\), \(L=1\) y \(J=0\): \(^3P_0\); el nitrógeno \(2p^3\) (mitad): \(S=\tfrac32\), \(L=0\): \(^4S_{3/2}\); el oxígeno \(2p^4\): \(S=1\), \(L=1\), \(J=2\): \(^3P_2\); el hierro \(3d^64s^2\): \(^5D_4\); el cromo \(3d^54s^1\): \(^7S_3\). Se comprobó el algoritmo contra la enumeración de todos los microestados de las subcapas \(p\), \(d\) y \(f\), y contra la lista de términos fundamentales del NIST para los 48 primeros elementos.</p>
<div class="sim" data-sim="hund" data-title="Llenado de orbitales y término fundamental por las reglas de Hund"></div>
<div class="sim-guide"><ul>
<li>Recorra Z = 5…10: el boro 2p¹ es \(^2P_{1/2}\); el carbono \(^3P_0\); el nitrógeno, con los tres orbitales \(p\) ocupados por espines paralelos, \(^4S_{3/2}\), el de mayor espín; el oxígeno empareja uno: \(^3P_2\).</li>
<li>En Z = 24 (Cr) las flechas muestran 3d⁵ 4s¹: seis espines paralelos, \(S=3\), \(^7S_3\); en Z = 26 (Fe), seis electrones d: cinco paralelos y uno antiparalelo, \(^5D_4\).</li>
</ul></div>
<h3>Apantallamiento: las reglas de Slater</h3>
<p>Un electrón con configuración \((n,l)\) siente una carga efectiva \(Z_{ef}=Z-\sigma\), donde \(\sigma\) suma las contribuciones de los demás electrones. Slater (1930) las resumió: para un electrón \(s\) o \(p\), cada otro electrón del mismo grupo apantalla 0.35 (0.30 en 1s), cada uno de la capa \(n-1\) 0.85, y los de capas más internas 1.00; para uno \(d\) o \(f\), 0.35 en su grupo y 1.00 en todos los grupos a su izquierda. El resultado explica tendencias: \(Z_{ef}\) del 2p vale 3.25 en el carbono y 5.85 en el neón; para el sodio, \(Z_{ef}(3s)=2.20\) (los diez electrones internos apantallan casi todo, queda ~2: el electrón 3s ve una carga mucho menor que \(Z=11\)). Son reglas empíricas con errores de varias decenas por ciento en propiedades; las energías orbitales de Slater no son energías de ionización. Para cálculos fiables se resuelve el problema autoconsistente (Hartree–Fock o la teoría del funcional de la densidad).</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule la energía del estado fundamental del helio en perturbación de primer orden y compárela con el valor experimental \(-79.005\) eV.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Orden cero.</b> Dos electrones \(1s\) hidrogenoides con \(Z=2\): \(E^{(0)}=-Z^2=-4\) Ha.</li>
<li><b>Primer orden.</b> \(\langle1/r_{12}\rangle=5Z/8=1.25\) Ha.</li>
<li><b>Suma.</b> \(E=-4+1.25=-2.75\) Ha; con 1 Ha \(=27.2114\) eV, \(E=-74.83\) eV.</li>
<li><b>Error.</b> \(|{-74.83}+79.005|/79.005=5.3\) %.</li>
<li><b>Resultado.</b> <span class="ans">\(-2.75\) Ha \(=-74.83\) eV, 5.3 % por encima del experimento.</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Halle el término fundamental del hierro (\(3d^64s^2\)) y del cromo (\(3d^54s^1\)) con las reglas de Hund.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Fe, subcapa 3d⁶ (la 4s² está llena).</b> Cinco espines paralelos en \(m_l=2,1,0,-1,-2\), y el sexto, antiparalelo, en \(m_l=2\): \(S=\tfrac52-\tfrac12=2\), \(L=2+1+0-1-2+2=2\) (D).</li>
<li><b>J.</b> La subcapa está a más de la mitad: \(J=L+S=4\). Término \(^{2S+1}L_J=\,^5D_4\) (\(2S+1=5\)).</li>
<li><b>Cr.</b> 3d⁵ semillena (\(S=\tfrac52\), \(L=0\)) y 4s¹ (\(S=\tfrac12\), \(L=0\)), con espines paralelos: \(S=3\), \(L=0\), \(J=S=3\); \(2S+1=7\).</li>
<li><b>Resultado.</b> <span class="ans">Fe: \(^5D_4\); Cr: \(^7S_3\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Deduzca la energía variacional del helio con la función de prueba \(e^{-\zeta(r_1+r_2)}\), halle \(\zeta\) óptimo y la energía en hartree y eV, y su error.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Energía cinética.</b> Para cada electrón \(\langle T\rangle=\zeta^2/2\): total \(\zeta^2\).</li>
<li><b>Atracción.</b> \(\langle -Z/r\rangle=-Z\zeta\) por electrón: total \(-2Z\zeta\). Repulsión: \(\tfrac58\zeta\).</li>
<li><b>Función.</b> \(E(\zeta)=\zeta^2-2Z\zeta+\tfrac58\zeta\); en \(Z=2\): \(E(1)=-2.375\), \(E(2)=-2.75\) Ha.</li>
<li><b>Mínimo.</b> \(dE/d\zeta=2\zeta-2Z+\tfrac58=0\Rightarrow\zeta=Z-\tfrac5{16}=1.6875\) (apantallamiento 0.3125).</li>
<li><b>Energía.</b> \(E=-\zeta^2=-2.8477\) Ha \(=-77.49\) eV; error \(|{-77.49}+79.005|/79.005=1.9\) %.</li>
<li><b>Resultado.</b> <span class="ans">\(\zeta=1.6875\); \(-2.8477\) Ha \(=-77.49\) eV; 1.9 %.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Con las reglas de Slater, halle \(Z_{ef}\) del electrón más externo del sodio (3s), del hierro (4s) y del cloro (3p).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Na (\(1s^22s^22p^63s^1\)).</b> Capa \(n-1=2\): 8 electrones × 0.85 = 6.8; capa 1: 2 × 1.00 = 2. \(\sigma=8.8\), \(Z_{ef}=11-8.8=2.20\).</li>
<li><b>Fe (\(\ldots3s^23p^63d^64s^2\)).</b> Mismo grupo: 1 × 0.35; capa 3 (14 electrones) × 0.85 = 11.9; capas 1 y 2 (10) × 1.00. \(\sigma=22.25\), \(Z_{ef}=26-22.25=3.75\).</li>
<li><b>Cl (\(\ldots3s^23p^5\)).</b> Mismo grupo (3s, 3p): 6 × 0.35 = 2.1; capa 2: 8 × 0.85 = 6.8; capa 1: 2 × 1.00. \(\sigma=10.9\), \(Z_{ef}=17-10.9=6.10\).</li>
<li><b>Resultado.</b> <span class="ans">2.20; 3.75; 6.10.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Estime la energía de primera ionización del helio con la energía variacional y compárela con la exacta y la medida (24.587 eV). La energía del ion He⁺ es \(-Z^2/2=-2\) Ha.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Variacional.</b> \(I=E(\text{He}^+)-E(\text{He})=-2-(-2.8477)=0.8477\) Ha \(=23.07\) eV.</li>
<li><b>Exacta.</b> \(-2+2.90372=0.90372\) Ha \(=24.59\) eV; medida 24.587 eV.</li>
<li><b>Error variacional.</b> \(|23.07-24.587|/24.587=6.2\) %.</li>
<li><b>Resultado.</b> <span class="ans">23.07 eV (variacional), 24.59 eV (exacta), 6.2 % de error.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Con orbitales hidrogenoides 1s y 2s con \(Z=2\), halle \(J\), \(K\) (en Ha y eV) y la separación singlete–triplete del estado 1s2s del helio, y compárela con la experimental.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Coulomb.</b> \(J=17Z/81=34/81=0.4198\) Ha \(=11.42\) eV.</li>
<li><b>Intercambio.</b> \(K=16Z/729=32/729=0.04390\) Ha \(=1.194\) eV.</li>
<li><b>Niveles.</b> \(E_{\rm triplete}=E_0+J-K\), \(E_{\rm singlete}=E_0+J+K\): separación \(2K=2.39\) eV.</li>
<li><b>Comparación.</b> Medida: \(20.62-19.82=0.80\) eV; el orden (triplete más bajo) es correcto, pero la separación se sobreestima: los orbitales sin apantallar solapan demasiado.</li>
<li><b>Resultado.</b> <span class="ans">\(J=0.4198\) Ha, \(K=0.04390\) Ha, \(2K=2.39\) eV (experimento 0.80 eV).</span></li>
</ol></details></li>
</ol>
