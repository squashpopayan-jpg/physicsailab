<p class="lead">Planck cuantizó la energía de los osciladores de la pared; Einstein fue más lejos y propuso que la luz misma está hecha de cuantos. Este capítulo recorre las pruebas de que la luz, además de onda, es un haz de partículas con energía \(E=h\nu\) y momento \(p=h/\lambda\): el efecto fotoeléctrico, la dispersión de rayos X por electrones (Compton), la producción de rayos X por electrones frenados, y los procesos de alta energía en los que un fotón desaparece creando materia. Cada uno se completa con sus consecuencias prácticas, desde los detectores de luz hasta la tomografía por emisión de positrones, y con los cálculos que se verifican contra tablas de datos y cálculos numéricos independientes.</p>

<section>
<h2>El efecto fotoeléctrico y el fotón</h2>
<p>Cuando la luz incide sobre un metal, este emite electrones (Hertz, 1887). Los hechos que la teoría ondulatoria no podía explicar son cuatro: existe una frecuencia umbral \(\nu_0\) por debajo de la cual no hay emisión por intensa que sea la luz; la energía cinética máxima crece linealmente con \(\nu\) y no depende de la intensidad; la emisión es instantánea (menos de \(10^{-9}\) s) incluso con luz muy débil; y el número de electrones es proporcional a la intensidad. Einstein (1905) lo explicó suponiendo que la luz se absorbe en cuantos de energía \(h\nu\), uno por electrón:</p>
<div class="eq key" data-name="Ecuación fotoeléctrica de Einstein">\[K_\text{máx}=h\nu-\varphi,\qquad eV_0=K_\text{máx},\qquad \nu_0=\frac\varphi h,\qquad \frac{\dd V_0}{\dd\nu}=\frac he=4.1357\times10^{-15}\ \text{V·s},\]</div>
<p>con \(\varphi\) la <span class="term">función de trabajo</span> del metal (la energía mínima para arrancar un electrón) y \(V_0\) el potencial de frenado. Millikan (1914–1916), que esperaba refutar la propuesta, midió la recta \(V_0(\nu)\) con sodio y litio y obtuvo \(h\) con una precisión del 0.5 %; Einstein recibió el Nobel de 1921 por esta explicación. Una precisión necesaria: el efecto fotoeléctrico solo, por sí mismo, <em>no</em> demuestra que la luz sea cuántica (un tratamiento semiclásico, con luz clásica y electrones cuantizados en el metal, reproduce la relación \(K=h\nu-\varphi\), como mostraron Lamb y Scully en 1969). Las pruebas decisivas del fotón como cuanto son la coincidencia temporal entre la dispersión Compton y la emisión del electrón (Bothe y Geiger; Compton y Simon, 1925) y el <em>antiagrupamiento de fotones</em> en la fluorescencia de resonancia de un solo átomo (Kimble, Dagenais y Mandel, 1977).</p>
<p>El fotón es una partícula sin masa con energía \(E=h\nu=hc/\lambda\) y momento \(p=E/c=h/\lambda\). Su momento se manifiesta en la presión de radiación (en el capítulo 7 se vio: \(p=u/3\) para un gas de fotones), en la presión de un rayo sobre un espejo, \(F=2P/c\) para un haz de potencia \(P\) reflejado a incidencia normal, y en el retroceso de los átomos que emiten luz. Un láser de 1 W absorbido por una superficie ejerce una fuerza de solo \(3.34\) nN, pero a escala atómica es suficiente para enfriar átomos con luz.</p>
<div class="sim" data-sim="fotoelectrico" data-title="Efecto fotoeléctrico: recta de Millikan y curvas corriente–voltaje"></div>
<div class="sim-guide"><ul>
<li>Sodio (\(\varphi=2.75\) eV) con 300 nm: fotón de 4.133 eV, \(K_\text{máx}=1.383\) eV y umbral en 450.9 nm. Duplique la intensidad: la corriente de saturación se duplica y \(V_0\) no cambia.</li>
<li>Con 500 nm no hay fotoelectrones con sodio aunque la intensidad sea máxima, pero sí con cesio (\(\varphi=2.14\) eV): \(K=0.340\) eV. La pendiente de la recta de la izquierda es la misma para todos los metales, \(h/e\); solo cambia la ordenada, \(-\varphi\).</li>
<li>Aplicaciones: fotomultiplicadores (un fotón arranca un electrón que se multiplica \(10^6\) veces), cámaras CCD y CMOS, células solares y espectroscopía de fotoelectrones (XPS), donde \(K\) mide la energía de ligadura de los electrones de cada átomo.</li>

<div class="box ex"><h4>Una lámpara ultravioleta sobre cinc</h4>
<p><strong>Datos.</strong> Zn, \(\varphi=4.33\) eV; luz de 250 nm, potencia 1 mW; rendimiento cuántico \(10^{-4}\) electrones por fotón. <strong>Procedimiento.</strong> (1) \(E=1239.84/250=4.959\) eV. (2) \(K_\text{máx}=4.959-4.33=0.629\) eV, \(V_0=0.629\) V; umbral \(\lambda_0=1239.84/4.33=286.3\) nm. (3) Fotones por segundo: \(P/E=10^{-3}/(4.959\times1.602\times10^{-19})=1.259\times10^{15}\) s\(^{-1}\). (4) Corriente: \(1.259\times10^{15}\times10^{-4}\times1.602\times10^{-19}=2.02\times10^{-8}\) A. <strong>Resultado.</strong> \(V_0=0.629\) V; \(I=20\) nA (la intensidad cambia la corriente, no \(V_0\)).</p></div>

<section>
<h2>La dispersión Compton y la sección de Klein–Nishina</h2>
<p>En 1923 A. H. Compton hizo incidir rayos X de molibdeno (\(\lambda=71.07\) pm) sobre grafito y midió la radiación dispersada. Además de la línea original aparecía otra de mayor longitud de onda, con un desplazamiento que dependía solo del ángulo. Si un fotón (\(E=hc/\lambda\), \(p=h/\lambda\)) choca elásticamente con un electrón libre en reposo, la conservación del momento (\(p_e^2=p^2+p'^2-2pp'\cos\theta\)) y de la energía relativista (\(E_e=(p-p')c+m_ec^2\), con \(E_e^2=p_e^2c^2+m_e^2c^4\)) permite eliminar \(p_e\) y llegar a \((p-p')m_ec=pp'(1-\cos\theta)\); dividiendo por \(pp'm_ec\) y recordando que \(1/p=\lambda/h\):</p>
<div class="eq key" data-name="Desplazamiento Compton">\[\lambda'-\lambda=\frac h{m_ec}(1-\cos\theta)=\lambda_C(1-\cos\theta),\quad \lambda_C=2.426\,310\ \text{pm},\qquad E'=\frac E{1+\varepsilon(1-\cos\theta)},\ \ \varepsilon=\frac E{m_ec^2}.\]</div>
<p>El desplazamiento no depende de \(\lambda\): 0 hacia delante, \(\lambda_C\) a 90° y \(2\lambda_C\) en la retrodispersión; solo se aprecia con rayos X o gamma (para luz visible es \(10^{-5}\) de \(\lambda\)). La energía cinética del electrón es \(K=E-E'\) y su ángulo de retroceso cumple \(\cot\varphi=(1+\varepsilon)\tan(\theta/2)\). La <span class="term">sección eficaz</span> de este proceso la calcularon Klein y Nishina (1929) con la electrodinámica cuántica relativista de Dirac. Para fotones no polarizados:</p>
<div class="eq key" data-name="Fórmula de Klein–Nishina">\[\frac{\dd\sigma}{\dd\Omega}=\frac{r_e^2}2\Bigl(\frac{E'}E\Bigr)^2\Bigl(\frac{E'}E+\frac E{E'}-\operatorname{sen}^2\theta\Bigr),\quad \sigma=2\pi r_e^2\Bigl\{\frac{1+\varepsilon}{\varepsilon^2}\Bigl[\frac{2(1+\varepsilon)}{1+2\varepsilon}-\frac{\ln(1+2\varepsilon)}\varepsilon\Bigr]+\frac{\ln(1+2\varepsilon)}{2\varepsilon}-\frac{1+3\varepsilon}{(1+2\varepsilon)^2}\Bigr\}.\]</div>
<p>Con \(r_e=e^2/(4\pi\varepsilon_0m_ec^2)=2.8179\) fm el radio clásico del electrón. A baja energía (\(\varepsilon\to0\), \(E'\to E\)) se recupera la sección de Thomson, \(\sigma_T=8\pi r_e^2/3=0.6652\) b (el barn vale \(10^{-28}\) m\(^2\)), con la distribución angular \(\tfrac12r_e^2(1+\cos^2\theta)\); a alta energía la sección decrece (\(\sigma\approx\pi r_e^2(\ln2\varepsilon+\tfrac12)/\varepsilon\)) y la dispersión se concentra hacia delante. El <span class="term">coeficiente másico de atenuación Compton</span> de un material es \(\mu/\rho=N_A(Z/A)\sigma_{KN}\). Valida: el cálculo coincide con el coeficiente incoherente tabulado (Elam et al.) dentro de 3 % para elementos ligeros a 100–1000 keV; las diferencias se deben a la ligadura de los electrones.</p>
<p>En espectroscopia gamma, un fotón de energía \(E\) que se dispersa por Compton en el cristal y escapa deja allí una energía entre 0 y \(T_\text{máx}=2E^2/(m_ec^2+2E)\), el <span class="term">borde Compton</span>, y el fotón retrodispersado lleva \(E/(1+2E/m_ec^2)\). Para el \(^{137}\)Cs (661.657 keV): borde en 477.3 keV y pico de retrodispersión en 184.3 keV, características visibles en cualquier espectro.</p>
<div class="box ex"><h4>Compton a 100 keV y 60°</h4>
<p><strong>Datos.</strong> \(E=100\) keV (\(\varepsilon=0.19570\)), \(\theta=60^\circ\). <strong>Procedimiento.</strong> (1) \(1+\varepsilon(1-\cos60^\circ)=1.09785\), de modo que \(E'=100/1.09785=91.09\) keV. (2) Energía del electrón: \(K=E-E'=8.91\) keV. (3) Desplazamiento: \(\Delta\lambda=\lambda_C(1-\cos60^\circ)=1.2132\) pm (con \(\lambda=12.398\) pm, \(\lambda'=13.612\) pm). (4) Retroceso: \(\cot\varphi=(1+\varepsilon)\tan30^\circ=0.6903\Rightarrow\varphi=55.38^\circ\). <strong>Comprobación.</strong> \(p_e=\sqrt{K(K+2mc^2)}=95.85\) keV/\(c\) y \(\sqrt{(100-91.09\cos60^\circ)^2+(91.09\sin60^\circ)^2}=95.85\). <strong>Resultado.</strong> \(E'=91.09\) keV; \(K=8.91\) keV; \(\varphi=55.4^\circ\).</p></div>

<section>
<h2>Rayos X: el tubo, Duane–Hunt y Bragg</h2>
<p>Röntgen descubrió los rayos X en 1895 en un tubo de descarga. En un <em>tubo de Coolidge</em> (1913) un cátodo caliente emite electrones que se aceleran con una diferencia de potencial \(V\) y chocan contra un blanco metálico. Se observan dos componentes: un <span class="term">espectro continuo</span> de frenado (<em>bremsstrahlung</em>), cuyo límite de longitudes de onda cortas depende solo de \(V\), y <span class="term">líneas características</span> del material del blanco. El límite es la ley de Duane–Hunt (1915): el electrón puede ceder como mucho toda su energía \(eV\) a un solo fotón, de modo que</p>
<div class="eq key" data-name="Ley de Duane–Hunt, espectro de Kramers y ley de Moseley">\[\lambda_\text{mín}=\frac{hc}{eV}=\frac{1.2398\ \text{nm}}{V\,[\text{kV}]},\qquad I(\lambda)\propto\frac1{\lambda^2}\Bigl(\frac\lambda{\lambda_\text{mín}}-1\Bigr)\ (\text{máximo en }2\lambda_\text{mín}),\qquad E_{K\alpha}\simeq\tfrac34\,Ry\,(Z-1)^2.\]</div>
<p>Es la relación inversa del efecto fotoeléctrico: allí un fotón da toda su energía a un electrón; aquí un electrón da toda su energía a un fotón, y se usó para obtener \(h/e\) con \(10^{-3}\) de precisión. El espectro continuo de Kramers (1923) es la intensidad por longitud de onda de la radiación de frenado de un conjunto de electrones que pierden energía a lo largo de su trayectoria en el blanco. Solo cerca del 1 % de la energía del haz se convierte en rayos X (el rendimiento es \(\sim10^{-9}ZV\), con \(V\) en voltios); el resto calienta el blanco. Las líneas características se generan cuando un electrón del haz expulsa un electrón de la capa \(K\) del átomo y uno de las capas superiores cae: solo aparecen si \(eV\) supera la energía del borde \(K\). Moseley (1913) midió las líneas \(K_\alpha\) de unos 38 elementos y encontró que \(\sqrt\nu\) crece linealmente con el número atómico \(Z\): fue la primera medida directa de \(Z\) como carga nuclear, y la base de la ordenación definitiva de la tabla periódica (capítulo 10). El simulador compara la fórmula con las líneas tabuladas.</p>
<div class="sim" data-sim="rayosx" data-title="Tubo de rayos X: espectro continuo, líneas características y ley de Moseley"></div>
<div class="sim-guide"><ul>
<li>Con Mo y 35 kV: \(\lambda_\text{mín}=0.035424\) nm (35.42 pm, 35 keV) y el máximo del continuo en 0.07085 nm. Como \(35\text{ keV}\gt20.00\) keV (borde K del Mo), aparecen \(K_\alpha\) (17.480 keV, 0.07093 nm) y \(K_\beta\) (19.606 keV). Moseley da 17.15 keV, un 1.9 % por debajo.</li>
<li>Con W a 35 kV solo se ve el continuo: el borde K del wolframio está en 69.5 keV. Suba el voltaje por encima de 69.5 kV y aparecen sus líneas en 59.3 keV y 67.2 keV.</li>
<li>La fórmula \(\tfrac34Ry(Z-1)^2\) falla un poco para \(Z\) grande (8 % en W) por el apantallamiento y los efectos relativistas, pero la linealidad de \(\sqrt{E}\) en \(Z\) se ve en la gráfica de la derecha.</li>
</ul></div>
<h3>Difracción de Bragg</h3>
<p>En 1912 Laue, Friedrich y Knipping difractaron rayos X en un cristal, probando a la vez su naturaleza ondulatoria y la periodicidad del cristal. W. L. Bragg interpretó el resultado como una reflexión en planos atómicos paralelos separados una distancia \(d\): hay interferencia constructiva cuando \(2d\operatorname{sen}\theta=n\lambda\). Con la línea Cu \(K_{\alpha1}\) (\(\lambda=0.15409\) nm) y los planos (111) del silicio (\(d=a/\sqrt3=0.31356\) nm, con \(a=0.543102\) nm), el pico aparece en \(\theta=14.22^\circ\) (\(2\theta=28.45^\circ\)), el pico más intenso del polvo de silicio. La difracción de rayos X, de electrones y de neutrones (capítulo 9) es la herramienta principal para determinar estructuras cristalinas, desde la sal común hasta las proteínas.</p>
</section>

<section>
<h2>Producción de pares y aniquilación</h2>
<p>A energías superiores a \(2m_ec^2=1.022\) MeV un fotón puede desaparecer creando un electrón y un positrón, la antipartícula del electrón (Dirac, 1928–1931; Anderson, 1932). Hace falta un tercer cuerpo, un núcleo, que absorba el exceso de momento (en el vacío no es posible: \(\sqrt s=0\) para un fotón solo). El umbral en el campo de un núcleo de masa \(M\) es \(E_\text{u}=2m_ec^2(1+m_e/M)\): 1022.55 keV para un protón; en el campo de un electrón (producción de tripletes, \(\gamma+e^-\to e^-e^-e^+\)) es \(4m_ec^2=2.044\) MeV. El proceso inverso es la <em>aniquilación</em>: un par \(e^+e^-\) en reposo da dos fotones de 511 keV emitidos en direcciones opuestas (uno solo violaría la conservación del momento). Es la base de la <span class="term">tomografía por emisión de positrones</span> (PET): un trazador emisor de positrones (\(^{18}\)F) se acumula en un tejido; los pares de fotones de 511 keV detectados en coincidencia fijan una línea que contiene el punto de aniquilación, y con una resolución temporal de 500 ps se localiza el punto a lo largo de la línea con \(c\Delta t/2=7.5\) cm (el tiempo de vuelo).</p>
<p>De los tres mecanismos de interacción de un fotón con la materia, el fotoeléctrico domina a baja energía (crece como \(Z^4/E^3\)), el Compton a energías intermedias y la producción de pares a altas (crece con \(Z^2\)). En agua el Compton predomina entre unos 30 keV y 30 MeV; en plomo, el fotoeléctrico domina hasta unos 500 keV, y los pares por encima de unos 5 MeV. Por eso los rayos X de diagnóstico (20–100 keV) dan contraste entre el hueso (Ca, \(Z=20\)) y el tejido blando (\(Z\approx7.5\)): la diferencia de \(Z^4\) de más de un orden de magnitud.</p>
</section>

<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Luz de 250 nm y 1 mW incide sobre cinc (\(\varphi=4.33\) eV). Halle la energía del fotón, \(K_\text{máx}\), el potencial de frenado, la longitud de onda umbral y la corriente si el rendimiento cuántico es \(10^{-4}\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Fotón.</b> \(E=hc/\lambda=1239.84/250=4.959\) eV.</li>
<li><b>Energía cinética.</b> \(K=4.959-4.33=0.629\) eV, \(V_0=0.629\) V; \(\lambda_0=1239.84/4.33=286.3\) nm.</li>
<li><b>Fotones por segundo.</b> \(N=10^{-3}/(4.959\times1.602\times10^{-19})=1.259\times10^{15}\) s\(^{-1}\).</li>
<li><b>Corriente.</b> \(I=Ne\eta=1.259\times10^{15}\times10^{-4}\times1.602\times10^{-19}=2.02\times10^{-8}\) A.</li>
<li><b>Resultado.</b> <span class="ans">4.959 eV; 0.629 eV; 0.629 V; 286.3 nm; 20.2 nA.</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Un fotón de 100 keV se dispersa 60° por un electrón libre. Halle la energía del fotón dispersado, la energía cinética del electrón, el desplazamiento de longitud de onda y el ángulo de retroceso.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Planteamiento.</b> \(\varepsilon=E/m_ec^2=100/510.999=0.19570\); \(E'=E/[1+\varepsilon(1-\cos\theta)]\).</li>
<li><b>\(E'\).</b> \(1+0.19570\times0.5=1.09785\Rightarrow E'=91.09\) keV.</li>
<li><b>\(K\).</b> \(100-91.09=8.91\) keV.</li>
<li><b>\(\Delta\lambda\).</b> \(2.4263\times0.5=1.2132\) pm.</li>
<li><b>Retroceso.</b> \(\cot\varphi=(1+\varepsilon)\tan30^\circ=1.19570\times0.57735=0.6903\Rightarrow\varphi=55.38^\circ\).</li>
<li><b>Resultado.</b> <span class="ans">91.09 keV; 8.91 keV; 1.213 pm; 55.4°.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Para fotones del \(^{137}\)Cs (661.657 keV): (a) la sección de Klein–Nishina, (b) el coeficiente másico de atenuación Compton del agua y la fracción transmitida por 10 cm sin otros procesos, (c) el borde Compton y la energía del fotón retrodispersado.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>(a)</b> \(\varepsilon=661.657/510.999=1.29483\); con la fórmula cerrada \(\sigma=0.2562\) b (\(2.562\times10^{-25}\) cm\(^2\)); cociente \(\sigma/\sigma_T=0.3851\).</li>
<li><b>(b)</b> \(\mu/\rho=N_A(Z/A)\sigma=6.022\times10^{23}\times0.5551\times2.562\times10^{-25}=0.08564\) cm\(^2\)/g; con \(\rho=1\) g/cm\(^3\): \(\mu=0.0856\) cm\(^{-1}\) y \(e^{-0.856}=0.4247\).</li>
<li><b>(c)</b> \(T_\text{máx}=2E^2/(m_ec^2+2E)=875\,580/1834.3=477.3\) keV; \(E'=661.657/(1+2.5897)=184.3\) keV; suma \(=661.7\) keV.</li>
<li><b>Resultado.</b> <span class="ans">0.2562 b; 0.0856 cm\(^2\)/g, 42.5 % transmitido; 477.3 keV y 184.3 keV.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Un tubo de rayos X de molibdeno funciona a 35 kV. Halle \(\lambda_\text{mín}\), la longitud de onda del máximo del continuo, si se excitan las líneas K (borde K a 20.00 keV) y la \(K_{\alpha1}\) (17.480 keV) comparada con la fórmula de Moseley.

<li><b>Máximo de Kramers.</b> \(2\lambda_\text{mín}=0.07085\) nm.</li>
<li><b>Excitación.</b> \(eV=35\) keV \(\gt20.00\) keV: las líneas K se excitan; \(\lambda_{K\alpha1}=1239.84/17\,480=0.07093\) nm.</li>
<li><b>Moseley.</b> \(E=\tfrac34(13.606)(41)^2=17.15\) keV; error \(=-1.9\) %.</li>
<li><b>Resultado.</b> <span class="ans">35.42 pm; 70.85 pm; sí; 17.48 keV (Moseley 17.15 keV).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>(a) La línea Cu \(K_{\alpha1}\) (8046.3 eV) se difracta en los planos (111) del silicio (\(a=0.543102\) nm): halle \(d\), el ángulo de Bragg de primer orden y \(2\theta\). (b) Umbral de pares en el campo de un protón y de un electrón. (c) Resolución espacial del tiempo de vuelo en un PET de 500 ps.

<li><b>(b)</b> \(E_\text{u}=2m_ec^2(1+m_e/M)=1021.998\times1.000545=1022.55\) keV (protón); en el campo de un electrón, \(4m_ec^2=2043.996\) keV.</li>
<li><b>(c)</b> \(c\Delta t/2=299\,792\,458\times500\times10^{-12}/2=0.0749\) m \(=7.49\) cm.</li>
<li><b>Resultado.</b> <span class="ans">0.31356 nm, 14.22°, 28.45°; 1022.55 keV y 2044.0 keV; 7.5 cm.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Un láser verde de 1 W (532 nm) se absorbe en un blanco. Halle el momento de un fotón, el número de fotones por segundo y la fuerza; y compare con un espejo perfecto. Compruebe la relación entre la fuerza y el momento transferido.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Fotón.</b> \(E=hc/\lambda=3.734\times10^{-19}\) J (2.33 eV); \(p=h/\lambda=1.2455\times10^{-27}\) kg m/s.</li>
<li><b>Flujo.</b> \(N=P/E=1/3.734\times10^{-19}=2.678\times10^{18}\) s\(^{-1}\).</li>
<li><b>Fuerza (absorbente).</b> \(F=Np=2.678\times10^{18}\times1.2455\times10^{-27}=3.336\times10^{-9}\) N \(=P/c\).</li>
<li><b>Espejo.</b> El momento transferido por fotón se duplica: \(F=2P/c=6.67\) nN.</li>
<li><b>Resultado.</b> <span class="ans">\(1.2455\times10^{-27}\) kg m/s; \(2.68\times10^{18}\) fotones/s; 3.34 nN (absorbente) y 6.67 nN (espejo).</span></li>
</ol></details></li>
</ol>
