<template class="chapter-src" data-id="dinamica" data-num="4" data-title="Momento, energía y E = mc²" data-part="Parte I · Relatividad especial" data-short="El momento y la energía relativistas, la energía cinética, el cuadrimomento, los umbrales de producción de partículas, los colisionadores, las desintegraciones de dos cuerpos y la equivalencia entre masa y energía">
<p class="lead">La cinemática del capítulo 2 obliga a modificar la dinámica: con la regla de suma de velocidades de Lorentz, el momento \(m\mathbf v\) de Newton deja de conservarse en las colisiones. Este capítulo deduce el momento y la energía que sí se conservan, extrae de ellos la equivalencia entre masa y energía y los aplica a lo que los físicos de partículas y nucleares hacen a diario: calcular cuánta energía hay que dar a un haz para producir una partícula nueva, qué ventaja tiene un colisionador sobre un blanco fijo, con qué energía se llevan los productos de una desintegración y cuánta masa pierde un núcleo al ligarse.</p>

<section>
<h2>El momento relativista</h2>
<p>Una colisión elástica entre dos partículas idénticas, estudiada en el sistema de su centro de masas, es simétrica y conserva \(m\mathbf v\) trivialmente. Vista desde otro sistema inercial, las velocidades se transforman con la suma relativista de velocidades, y entonces \(\sum m\mathbf v\) cambia entre el antes y el después, mientras que otra cantidad se conserva. En el centro de masas, dos partículas iguales con \(\pm0.6c\) a lo largo de \(x\) se dispersan 40° (\(\pm0.6c\) en las direcciones \(\pm40^\circ\)). Visto desde un sistema que se mueve a \(-0.5c\) (el centro de masas se mueve a \(+0.5c\) para él), las velocidades en \(x\) antes de la colisión son \(0.8462c\) y \(-0.1429c\); \(\sum mv_x/mc=0.7033\) antes y \(0.8327\) después, y aparece una componente transversal total de \(-0.162\) donde antes no había ninguna. En cambio, \(\sum\gamma mv_x/mc=1.4434\) antes y después, y \(\sum\gamma mv_y=0\). La cantidad conservada es</p>
<div class="eq key" data-name="Momento relativista">\[\mathbf p=\gamma m\mathbf v=\frac{m\mathbf v}{\sqrt{1-v^2/c^2}},\qquad \mathbf F=\frac{\dd\mathbf p}{\dd t}.\]</div>
<p>\(m\) es la <span class="term">masa invariante</span> (o masa en reposo), la misma en todos los sistemas, y es la única que se usa en este curso: hablar de una «masa que crece con la velocidad» no aporta nada y confunde. A bajas velocidades \(\mathbf p\to m\mathbf v\). El momento crece sin límite cuando \(v\to c\), y de ahí que ninguna fuerza acelere un cuerpo material hasta \(c\). Con \(\mathbf F=\dd\mathbf p/\dd t\), la aceleración ya no es paralela a la fuerza: para una fuerza paralela a la velocidad, \(F=\gamma^3ma\); para una perpendicular (movimiento circular uniforme en un campo magnético), \(F=\gamma ma\). La fórmula \(p=\gamma mv\) fija el radio de las trayectorias en los aceleradores: \(p=eBR\), con \(p\) en GeV/\(c\), \(B\) en teslas y \(R\) en metros, \(p=0.29979\,BR\) (el LHC tiene \(R=2804\) m y \(B=8.33\) T para protones de 7 TeV).</p>
</section>

<section>
<h2>La energía relativista y la ecuación de Einstein</h2>
<p>El trabajo de la fuerza sobre una partícula que parte del reposo es su energía cinética: \(K=\int F\,\dd x=\int v\,\dd p\). Como \(p=\gamma mv\) y \(\dd\gamma/\dd v=\gamma^3v/c^2\), se tiene \(v\,\dd(\gamma v)=v\gamma^3\dd v=c^2\dd\gamma\), de modo que:</p>
<div class="eq key" data-name="Energía cinética, energía total y relación energía–momento">\[K=\int_0^v v\,\dd p=mc^2(\gamma-1),\qquad E=\gamma mc^2=K+mc^2,\qquad E^2=(pc)^2+(mc^2)^2.\]</div>
<p>La última relación se obtiene de \(E^2-(pc)^2=\gamma^2m^2c^4(1-\beta^2)=m^2c^4\). Interpretaciones: (i) una partícula en reposo tiene la <span class="term">energía en reposo</span> \(E_0=mc^2\), de modo que la masa es una forma de energía (Einstein, 1905); (ii) para \(K\ll mc^2\), \(\gamma-1\approx\tfrac12\beta^2+\tfrac38\beta^4\) y \(K\to\tfrac12mv^2\); (iii) para una partícula sin masa (el fotón), \(E=pc\) y \(v=c\). Para \(K\gg mc^2\), \(E\approx pc\). En unidades de \(mc^2\) los tres lados del triángulo rectángulo \(E,\,pc,\,mc^2\) forman una figura simple. La velocidad es \(\mathbf v=\mathbf pc^2/E\).</p>
<div class="box ex"><h4>Un electrón de 1 MeV</h4>
<p><strong>Datos.</strong> \(m_ec^2=0.510999\) MeV, \(K=1.000\) MeV. <strong>Procedimiento.</strong> (1) \(\gamma=1+K/mc^2=2.9570\). (2) \(\beta=\sqrt{1-1/\gamma^2}=0.94108\). (3) \(pc=\sqrt{K(K+2mc^2)}=\sqrt{1\times2.02200}=1.4220\) MeV; la fórmula clásica \(\sqrt{2mK}\) daría \(1.0109\) MeV. (4) Con la fórmula clásica, \(v/c=\sqrt{2K/mc^2}=1.978\): ¡casi el doble de la velocidad de la luz! (5) Con la velocidad verdadera, \(\tfrac12mv^2=0.2263\) MeV, el 22.6 % de la energía real. <strong>Resultado.</strong> \(\gamma=2.957\), \(\beta=0.9411\), \(p=1.422\) MeV/\(c\). A 1 MeV un electrón ya es muy relativista: es la energía típica de una desintegración beta.</p></div>
<p>La prueba directa es el experimento de Bertozzi (1964): se aceleran electrones con distintas energías cinéticas (0.5 a 15 MeV) y se mide el tiempo que tardan en recorrer una distancia de 8.4 m. Con \(K=15\) MeV la fórmula clásica daría \(v=7.66c\); la relatividad, \(v=0.99946c\) con \(\gamma=30.35\). Los resultados siguen la curva relativista y no la clásica, y muestran que al aumentar la energía la velocidad se satura en \(c\) mientras que la energía cinética medida (con el calor depositado en el blanco) sigue creciendo.</p>
<div class="sim" data-sim="energia" data-title="Energía cinética, momento y velocidad: relativista frente a clásica"></div>
<div class="sim-guide"><ul>
<li>Con el electrón y \(K/mc^2=1.957\) (1 MeV): \(\gamma=2.957\), \(\beta=0.9411\), \(pc=1.422\) MeV frente a 1.011 MeV de la fórmula clásica, y la «velocidad clásica» sería 1.978c. A \(K/mc^2=0.01\) (5.1 keV): \(\beta=0.1404\) y \(\tfrac12mv^2\) se queda 1.5 % por debajo de \(K\) (el error crece como \(\tfrac34\beta^2\)).</li>
<li>En el triángulo de la derecha, \(mc^2\) es el cateto fijo \(=1\); al subir \(K\), \(pc\) crece y \(E\) se acerca a \(pc\): la hipotenusa y el cateto casi coinciden. Con \(K=1000\,mc^2\) para un protón (938 GeV), \(\gamma=1001\) y \(1-\beta=5.0\times10^{-7}\).</li>
<li>La curva clásica corta la línea de \(c\) en \(K=\tfrac12mc^2\) y la sobrepasa: la relativista nunca. La misma gráfica vale para cualquier partícula en unidades de \(mc^2\): las tres masas del selector dan la misma figura y solo cambian las energías absolutas.</li>
</ul></div>
</section>

<section>
<h2>Cuadrimomento, energía disponible y umbrales</h2>
<p>La energía y el momento forman un cuadrivector, el <span class="term">cuadrimomento</span>:</p>
<div class="eq key" data-name="Cuadrimomento">\[p^\mu=m\,u^\mu=\Bigl(\frac Ec,\;\mathbf p\Bigr),\qquad p\cdot p=\frac{E^2}{c^2}-|\mathbf p|^2=m^2c^2,\qquad \sum p^\mu_\text{antes}=\sum p^\mu_\text{después}.\]</div>
<p>La conservación del cuadrimomento incluye la de la energía total (con las masas) y la del momento. El cuadrado del cuadrimomento total es un invariante: \(s=(\sum E)^2-|\sum\mathbf pc|^2\). En el sistema del centro de masas el momento total es cero y \(\sqrt s\) es la energía total, la que está disponible para crear partículas nuevas. Para un proyectil (\(m_1\), \(E_1\)) que choca contra un blanco en reposo \(m_2\) y contra otro de igual energía (colisionador de haces simétricos), respectivamente:</p>
<div class="eq">\[\sqrt s_\text{fijo}=\sqrt{m_1^2c^4+m_2^2c^4+2E_1m_2c^2},\qquad \sqrt s_\text{colisionador}=2E\quad(E_1=E_2=E\gg mc^2).\]</div>
<p>Una reacción que produce partículas de masas finales \(m_f\) solo es posible si \(\sqrt s\ge\sum m_fc^2=Mc^2\); en el umbral los productos están en reposo en el centro de masas. Con blanco fijo:</p>
<div class="eq key" data-name="Energía de umbral en blanco fijo">\[K_u=\frac{(Mc^2)^2-(m_1c^2+m_2c^2)^2}{2m_2c^2}.\]</div>
<p>Con blanco fijo, \(\sqrt s\) crece como \(\sqrt{2m_2c^2E_1}\): para duplicar la masa disponible hay que cuadruplicar la energía del haz, porque la mayor parte de la energía se pierde en el movimiento del centro de masas. Un colisionador simétrico, en cambio, pone toda la energía a disposición: \(\sqrt s=2E\). Por eso se construyen: los experimentos de blanco fijo del siglo XX (el Bevatron de Berkeley, 6.2 GeV, que descubrió el antiprotón en 1955 con \(K_u=6m_pc^2=5.63\) GeV para \(pp\to pppp̄\)) dieron paso a los anillos de colisión (SPS, Tevatrón, LEP, LHC).</p>
<div class="box ex"><h4>El antiprotón, el LHC y el bosón Z</h4>
<p><strong>(a) Antiprotón.</strong> \(pp\to p\,p\,p\,\bar p\): \(M=4m_p\), \(m_1=m_2=m_p\): \(K_u=(16-4)m_p^2c^4/(2m_pc^2)=6m_pc^2=5629.6\) MeV. En un colisionador bastaría con \(E=2m_pc^2=1876.5\) MeV por haz, \(7m_pc^2/(2m_pc^2)=3.5\) veces menos energía total (\(E_u=K_u+m_pc^2=7m_pc^2\)). <strong>(b) LHC.</strong> Haces de 6.8 TeV: \(\sqrt s=13.6\) TeV; un haz de blanco fijo con el mismo \(\sqrt s\) necesitaría \(E=(s-2m_p^2c^4)/(2m_pc^2)=9.856\times10^7\) GeV \(\approx10^{17}\) eV. <strong>(c) Z.</strong> \(e^-e^+\to Z^0\) (\(91.1876\) GeV): cada haz del LEP tiene 45.59 GeV; en blanco fijo, el electrón incidente necesitaría \(8.136\times10^{9}\) MeV \(\approx8\times10^6\) GeV. <strong>Resultado.</strong> Cociente blanco fijo/colisionador: 3.5 para el antiprotón, \(1.8\times10^5\) para la Z.</p></div>
<div class="sim" data-sim="umbral" data-title="Energía disponible, umbrales de producción y colisionadores"></div>
<div class="sim-guide"><ul>
<li>\(pp\to pppp̄\): \(K_u=5629.6\) MeV (el Bevatron usó protones de 6.2 GeV, un 10 % sobre el umbral). Con \(K=1.5K_u\), \(\sqrt s\) ya supera \(M=3753\) MeV. Para \(e^-e^+\to Z^0\), el umbral en blanco fijo es \(8.136\times10^9\) MeV, y en colisionador, 45.59 GeV por haz.</li>
<li>\(e^-e^+\to\mu^-\mu^+\): el umbral en blanco fijo es 43.69 GeV; la energía de cada haz del colisionador, solo 105.66 MeV (1/413.5 de la total del blanco fijo). Para \(\tau^+\tau^-\) la relación es 6954.</li>
<li>La curva exacta se separa de la asintótica \(\sqrt{2m_2E}\) solo cerca del umbral; la gráfica de la derecha muestra por qué la energía de un acelerador de blanco fijo crece como \(M^2\) y la de un colisionador como \(M\).</li>
</ul></div>
</section>

<section>
<h2>Desintegraciones y masa invariante</h2>
<p>Una partícula de masa \(M\) en reposo se desintegra en dos de masas \(m_1\), \(m_2\). Las leyes de conservación fijan los momentos de cada producto en el reposo del padre: son iguales y opuestos, \(p^*\), y \(Mc^2=\sqrt{m_1^2c^4+p^{*2}c^2}+\sqrt{m_2^2c^4+p^{*2}c^2}\). Despejando:</p>
<div class="eq key" data-name="Desintegración de dos cuerpos en reposo">\[p^*c=\frac{\sqrt{\bigl[M^2-(m_1+m_2)^2\bigr]\bigl[M^2-(m_1-m_2)^2\bigr]}}{2M}\,c^2.\]</div>
<p>En el caso \(\pi^+\to\mu^+\nu_\mu\) (\(M=139.570\), \(m_\mu=105.658\), \(m_\nu\approx0\) MeV/\(c^2\)): \(p^*c=(M^2-m_\mu^2)/(2M)=29.792\) MeV, la energía cinética del muón es \(\sqrt{29.792^2+105.658^2}-105.658=4.120\) MeV y la del neutrino \(29.792\) MeV. La energía del muón es la misma para todos los piones en reposo: una línea monoenergética que identifica la desintegración. Un resultado más sutil es el del \(\pi^0\to\gamma\gamma\) en vuelo. En su reposo cada fotón lleva \(m_{\pi^0}c^2/2=67.49\) MeV, en una dirección isótropa. En el laboratorio, con el \(\pi^0\) de energía \(E\) y \(\beta\), la energía del fotón es \(E_\gamma=\tfrac12E(1+\beta\cos\theta^*)\). Como \(\cos\theta^*\) está uniformemente distribuido en \([-1,1]\), la energía de los fotones también lo está, entre \(E(1-\beta)/2\) y \(E(1+\beta)/2\): <em>un espectro plano</em>, de ancho \(\beta E\). El ángulo entre los dos fotones se obtiene con la masa invariante: \(m^2c^4=2E_1E_2(1-\cos\theta)=4E_1E_2\operatorname{sen}^2(\theta/2)\), cuyo mínimo (para \(E_1=E_2=E/2\)) es</p>
<div class="eq">\[\theta_\text{mín}=2\arcsin\frac1\gamma=2\arcsin\frac{m_{\pi^0}c^2}{E}.\]</div>
<p>Midiendo la energía y el ángulo de los dos fotones en un calorímetro se reconstruye \(m_{\pi^0}\) y se identifican los \(\pi^0\) entre millones de fotones, que es lo que hacen los experimentos de colisiones.</p>
<div class="sim" data-sim="pi0" data-title="π⁰ → γγ: espectro plano de los fotones y ángulo de apertura"></div>
<div class="sim-guide"><ul>
<li>Con \(E=1000\) MeV: \(\gamma=7.409\), \(\beta=0.99085\); los fotones tienen energías entre \(4.576\) y \(995.4\) MeV con la misma probabilidad, y el ángulo mínimo de apertura es 15.51°. Con \(\cos\theta^*=0.6\): \(E_1=797.3\) MeV, \(E_2=202.7\) MeV.</li>
<li>Con \(E=5000\) MeV el ángulo mínimo baja a 3.09°: los dos fotones llegan casi superpuestos en el calorímetro, lo que dificulta identificar \(\pi^0\) de alta energía (se confunden con un solo fotón).</li>
<li>Para cualquier fotón elegido, la masa reconstruida \(\sqrt{2E_1E_2(1-\cos\theta)}\) da exactamente 134.977 MeV/\(c^2\): es la prueba de que los dos fotones provienen de la misma partícula.</li>
</ul></div>
</section>

<section>
<h2>E = mc²: masa y energía de ligadura</h2>
<p>La ecuación de Einstein dice que toda energía que sale de un sistema aislado se lleva masa: \(\Delta m=\Delta E/c^2\). En química el efecto es imperceptible (\(\sim10^{-10}\) de la masa), pero en un núcleo, donde las energías son de megaelectronvoltios, es medible con espectrómetros de masas. La energía de ligadura de un núcleo es \(B=(\sum m_\text{constituyentes}-m_\text{núcleo})c^2\). Para el deuterón (protón y neutrón ligados): \(B=(938.2721+939.5654-1875.6129)\,\text{MeV}=2.2246\) MeV, que se mide también como la energía del fotón que se emite al capturar un neutrón en hidrógeno, \(n+p\to d+\gamma\) (2.2232 MeV, con la corrección del retroceso del deuterón). La reacción \(^7\text{Li}+p\to2\,^4\text{He}\), con la que Cockcroft y Walton (1932) hicieron la primera prueba de \(E=mc^2\) con un acelerador, tiene \(Q=(m_\text{in}-m_\text{out})c^2=17.346\) MeV a partir de las masas atómicas, y los dos \(\alpha\) salen con 8.7 MeV cada uno: la energía medida en 1932 coincide con este valor dentro de su incertidumbre experimental.</p>
<div class="box ex"><h4>Cuánta masa pierde el Sol cada segundo</h4>
<p><strong>Datos.</strong> Luminosidad solar \(L_\odot=3.828\times10^{26}\) W, \(c^2=8.98755\times10^{16}\) m²/s². <strong>Procedimiento.</strong> (1) \(\dot m=L_\odot/c^2=4.259\times10^9\) kg/s: más de cuatro millones de toneladas por segundo. (2) En un año: \(1.344\times10^{17}\) kg, \(6.8\times10^{-14}\) de su masa (\(1.989\times10^{30}\) kg). (3) Convertir 1 g de masa libera \(mc^2=8.988\times10^{13}\) J \(=21.5\) kilotones de TNT (1 kt \(=4.184\times10^{12}\) J). <strong>Resultado.</strong> El Sol ha perdido por radiación solo el 0.03 % de su masa en 4600 millones de años.</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un electrón tiene \(K=1.000\) MeV. Calcule \(\gamma\), \(\beta\), \(pc\), la velocidad que daría la fórmula clásica y el error de usarla. Repita para \(K=15\) MeV (\(\beta\) y velocidad clásica).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Planteamiento.</b> \(\gamma=1+K/mc^2\); \(\beta=\sqrt{1-\gamma^{-2}}\); \(pc=\sqrt{K(K+2mc^2)}\). <span class="given">Datos: \(mc^2=0.510999\) MeV.</span></li>
<li><b>\(K=1\) MeV.</b> \(\gamma=2.9570\), \(\beta=0.94108\), \(pc=1.4220\) MeV.</li>
<li><b>Fórmula clásica.</b> \(p_\text{cl}=\sqrt{2mK}=1.0109\) MeV/\(c\); \(v_\text{cl}/c=\sqrt{2K/mc^2}=1.9784\), que excede \(c\). Con \(\beta=0.94108\), \(\tfrac12mv^2=0.2263\) MeV: un error del 77 %.</li>
<li><b>\(K=15\) MeV.</b> \(\gamma=30.354\), \(\beta=0.999457\); clásica: \(\sqrt{2(15)/0.510999}=7.662\,c\).</li>
<li><b>Resultado.</b> <span class="ans">\(\gamma=2.957\), \(\beta=0.9411\), \(p=1.422\) MeV/\(c\); 1.978c clásica; 15 MeV: \(\beta=0.99946\) frente a 7.66c.</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>(a) Calcule la masa que pierde el Sol por segundo y la fracción de su masa que ha perdido por radiación en 4.6 \(\times10^9\) años. (b) ¿A cuántos kilotones de TNT equivale la conversión completa de 1 g de materia?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>(a) Tasa.</b> \(\dot m=L_\odot/c^2=3.828\times10^{26}/8.98755\times10^{16}=4.259\times10^9\) kg/s.</li>
<li><b>(a) Fracción.</b> \(4.6\times10^9\) años \(=1.452\times10^{17}\) s; \(\Delta m=6.18\times10^{26}\) kg \(=3.1\times10^{-4}\) de \(1.989\times10^{30}\) kg, o 0.031 % (con luminosidad constante; es una cota, pues el Sol era algo menos luminoso).</li>
<li><b>(b) Energía.</b> \(E=(10^{-3}\text{ kg})c^2=8.988\times10^{13}\) J; en kilotones: \(8.988\times10^{13}/4.184\times10^{12}=21.48\) kt.</li>
<li><b>Resultado.</b> <span class="ans">\(4.26\times10^9\) kg/s; 0.031 %; 21.5 kt.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Calcule el \(Q\) de la reacción de Cockcroft–Walton \(^7\text{Li}+{}^1\text{H}\to2\,{}^4\text{He}\) con las masas atómicas \(7.016003\), \(1.007825\) y \(4.002603\) u (1 u \(=931.494\) MeV/\(c^2\)), la energía de cada \(\alpha\) y la energía de ligadura del deuterón (\(m_p=938.2721\), \(m_n=939.5654\), \(m_d=1875.6129\) MeV/\(c^2\)).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Reacción.</b> Masas iniciales: \(7.016003+1.007825=8.023828\) u (con las masas atómicas el número de electrones coincide: 4 a cada lado).</li>
<li><b>Masas finales.</b> \(2(4.002603)=8.005206\) u.</li>
<li><b>Q.</b> \(\Delta m=0.018622\) u \(\Rightarrow Q=0.018622\times931.494=17.346\) MeV. Con el protón en reposo, el reparto es simétrico: cada \(\alpha\) lleva \(Q/2=8.67\) MeV.</li>
<li><b>Deuterón.</b> \(B=938.2721+939.5654-1875.6129=2.2246\) MeV.</li>
<li><b>Resultado.</b> <span class="ans">\(Q=17.35\) MeV; 8.67 MeV por \(\alpha\); \(B_d=2.2246\) MeV.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>(a) Halle la energía cinética de umbral de \(pp\to ppp\bar p\) con blanco fijo y la energía por haz en un colisionador simétrico; (b) la de \(pp\to pp\pi^0\) (\(m_{\pi^0}=134.977\) MeV/\(c^2\)); (c) la energía del haz de blanco fijo equivalente al LHC (haces de 6.8 TeV).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>(a) Umbral.</b> \(K_u=[(4m_p)^2-(2m_p)^2]/(2m_p)=6m_p=5629.6\) MeV. Colisionador: \(E=Mc^2/2=2m_pc^2=1876.5\) MeV por haz.</li>
<li><b>(b) \(\pi^0\).</b> \(K_u=m_\pi(4m_p+m_\pi)/(2m_p)=134.977(3888.07)/(1876.54)=279.66\) MeV.</li>
<li><b>(c) LHC.</b> \(s=(13.6\ \text{TeV})^2=1.8496\times10^8\) GeV²; \(E=(s-2m_p^2)/(2m_p)=9.856\times10^7\) GeV, esto es, \(K=9.856\times10^{16}\) eV.</li>
<li><b>Resultado.</b> <span class="ans">5629.6 MeV (blanco fijo) y 1876.5 MeV por haz; 279.66 MeV; \(9.86\times10^7\) GeV.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Un pión cargado en reposo se desintegra \(\pi^+\to\mu^+\nu_\mu\) (\(m_\pi=139.570\), \(m_\mu=105.658\) MeV/\(c^2\), \(m_\nu=0\)). Halle los momentos y las energías cinéticas del muón y del neutrino.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Planteamiento.</b> Conservación del momento: \(\mathbf p_\mu=-\mathbf p_\nu\), \(|p|=p^*\); energía: \(m_\pi c^2=\sqrt{m_\mu^2c^4+p^2c^2}+pc\).</li>
<li><b>Momento.</b> Despejando: \(pc=(m_\pi^2-m_\mu^2)c^4/(2m_\pi c^2)=(19479.9-11163.7)/279.14=29.792\) MeV.</li>
<li><b>Muón.</b> \(E_\mu=\sqrt{29.792^2+105.658^2}=109.778\) MeV, \(K_\mu=4.120\) MeV, \(\beta_\mu=p/E=0.2714\).</li>
<li><b>Neutrino.</b> \(E_\nu=pc=29.792\) MeV. Comprobación: \(109.778+29.792=139.570\) MeV.</li>
<li><b>Resultado.</b> <span class="ans">\(p=29.79\) MeV/\(c\) para ambos; \(K_\mu=4.12\) MeV; \(E_\nu=29.79\) MeV.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Un \(\pi^0\) de 1 GeV de energía total se desintegra en dos fotones. Halle el intervalo de energías de los fotones, el ángulo mínimo de apertura y, para dos fotones medidos con 800 MeV y 200 MeV, el ángulo entre ellos y la masa invariante.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>\(\gamma\) y \(\beta\).</b> \(\gamma=1000/134.977=7.4087\), \(\beta=\sqrt{1-1/\gamma^2}=0.99085\).</li>
<li><b>Energías.</b> \(E_\gamma=\tfrac12E(1+\beta\cos\theta^*)\): mínimo \(\tfrac12(1000)(1-0.99085)=4.576\) MeV, máximo \(995.42\) MeV; distribución plana.</li>
<li><b>Ángulo mínimo.</b> \(\theta_\text{mín}=2\arcsin(1/\gamma)=2\arcsin(0.13498)=15.51^\circ\) (con \(E_1=E_2=500\) MeV).</li>
<li><b>Fotones de 800 y 200 MeV.</b> \(1-\cos\theta=m^2/(2E_1E_2)=18218.7/320\,000=0.056934\Rightarrow\theta=19.43^\circ\).</li>
<li><b>Masa.</b> \(m=\sqrt{2E_1E_2(1-\cos\theta)}=\sqrt{2(800)(200)(0.056934)}=134.977\) MeV/\(c^2\); además, \(E_1+E_2=1000\) MeV es consistente con \(E_\pi\).</li>
<li><b>Resultado.</b> <span class="ans">4.58–995.4 MeV; \(\theta_\text{mín}=15.51^\circ\); \(\theta=19.43^\circ\); \(m=134.98\) MeV/\(c^2\).</span></li>
</ol></details></li>
</ol>
