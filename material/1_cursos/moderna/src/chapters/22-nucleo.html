<template class="chapter-src" data-id="nucleo" data-num="22" data-title="El núcleo: tamaño, masa, ligadura y modelos" data-part="Parte VI · Física nuclear" data-short="La composición y el tamaño del núcleo, la energía de ligadura a partir de las masas atómicas, la fórmula semiempírica de masas ajustada a los núcleos estables, el valle de estabilidad y el modelo de capas con números mágicos">
<p class="lead">El núcleo es un sistema de protones y neutrones ligados por la interacción fuerte, en un volumen de unos \(10^{-15}\) m. La masa de un núcleo es menor que la suma de las masas de sus nucleones, y la diferencia, la energía de ligadura, es la fuente de la energía nuclear. Este capítulo la calcula con masas atómicas medidas, ajusta por mínimos cuadrados la fórmula semiempírica de masas (el modelo de la gota líquida), la usa para explicar el valle de estabilidad y las parábolas de isóbaros, y resuelve la ecuación de Schrödinger en un potencial de Woods–Saxon con acoplamiento espín–órbita, donde aparecen los números mágicos. Los resultados se comparan con valores publicados de masas y con soluciones numéricas independientes.</p>

<section>
<h2>Composición y tamaño</h2>
<p>El núcleo de un átomo con número atómico \(Z\) y número másico \(A\) contiene \(Z\) protones y \(N=A-Z\) neutrones (Chadwick, 1932). Se escribe \(^A_ZX\); los <em>isótopos</em> tienen igual \(Z\), los <em>isóbaros</em> igual \(A\) y los <em>isótonos</em> igual \(N\). La dispersión de partículas \(\alpha\) y de electrones muestra que el volumen del núcleo es proporcional a \(A\): el radio es \(R=r_0A^{1/3}\) con \(r_0\simeq1.2\) fm, y la densidad es la misma en todos los núcleos (saturación de la fuerza nuclear). Con \(r_0=1.2\) fm, la densidad numérica es \(3/4\pi r_0^3=0.138\) nucleones/fm\(^3\) y la densidad de masa \(2.29\times10^{17}\) kg/m\(^3\): un centímetro cúbico de materia nuclear pesaría 229 millones de toneladas. Radios: ⁴He, 1.90 fm; ¹²C, 2.75 fm; ⁵⁶Fe, 4.59 fm; ²⁰⁸Pb, 7.11 fm; ²³⁸U, 7.44 fm.</p>
</section>

<section>
<h2>Masa y energía de ligadura</h2>
<p>La masa de un núcleo es menor que la suma de las de sus constituyentes; el defecto de masa da, por \(E=mc^2\), la <span class="term">energía de ligadura</span>. Con masas atómicas (que ya incluyen los \(Z\) electrones, cuya energía de ligadura es despreciable) es</p>
<div class="eq key" data-name="Energía de ligadura nuclear">\[B(Z,A)=\bigl[Z\,m(^1\text{H})+(A-Z)\,m_n-M(Z,A)\bigr]c^2,\qquad 1\ \text{u}\,c^2=931.494\ \text{MeV}.\]</div>
<p>Calculada con las masas atómicas de la evaluación AME (tabla de masas incluida en el curso), reproduce los valores publicados con error relativo menor que \(2\times10^{-4}\):</p>
<table class="data"><thead><tr><th>Núcleo</th><th>\(B\) (MeV)</th><th>\(B/A\) (MeV)</th></tr></thead><tbody>
<tr><td>²H</td><td>2.225</td><td>1.112</td></tr>
<tr><td>⁴He</td><td>28.296</td><td>7.074</td></tr>
<tr><td>¹²C</td><td>92.162</td><td>7.680</td></tr>
<tr><td>¹⁶O</td><td>127.619</td><td>7.976</td></tr>
<tr><td>⁵⁶Fe</td><td>492.260</td><td>8.790</td></tr>
<tr><td>⁶²Ni</td><td>545.262</td><td>8.795</td></tr>
<tr><td>²⁰⁸Pb</td><td>1636.43</td><td>7.867</td></tr>
<tr><td>²³⁸U</td><td>1801.69</td><td>7.570</td></tr>
</tbody></table>
<p>La energía de ligadura por nucleón crece rápidamente hasta unos 8 MeV para \(A\sim20\), alcanza un máximo en la región del hierro y el níquel (entre los núcleos estables, el máximo es el ⁶²Ni, con 8.795 MeV; el ⁵⁶Fe, 8.790 MeV, es el de menor masa por nucleón) y luego decrece lentamente hasta 7.6 MeV en el uranio. Por eso la fusión de núcleos ligeros y la fisión de núcleos pesados liberan energía (capítulo 24). Que \(B/A\) sea aproximadamente constante (\(\approx8\) MeV) indica que cada nucleón interactúa solo con sus vecinos inmediatos (fuerza de corto alcance que satura), y no con los \(A-1\) restantes (de ser así, \(B\propto A^2\)).</p>
<div class="sim" data-sim="ligadura" data-title="Energía de ligadura por nucleón y fórmula semiempírica"></div>
<div class="sim-guide"><ul>
<li>Con \(A=56\): el isóbaro más estable es \(Z=26\) (hierro), \(B/A=8.759\) MeV de la fórmula y \(8.790\) MeV experimental. Las barras muestran cuánto aporta cada término por nucleón: volumen \(+15.77\), superficie \(-4.75\), Coulomb \(-2.17\), asimetría \(-0.12\) y apareamiento \(+0.03\) MeV.</li>
<li>A \(A=4\), la fórmula falla (22.8 MeV frente a 28.3): el ⁴He está doblemente ligado por una capa cerrada. Para \(A\gtrsim20\) el ajuste es bueno (desviación cuadrática media 2.24 MeV).</li>
<li>En \(A\)=208 la barra de Coulomb domina sobre la superficie: la repulsión eléctrica explica la caída de \(B/A\) en núcleos pesados.</li>
</ul></div>
</section>

<section>
<h2>Fórmula semiempírica de masas y valle de estabilidad</h2>
<p>Bethe y Weizsäcker (1935) modelaron el núcleo como una gota de líquido incompresible, con términos que corrigen el volumen:</p>
<div class="eq key" data-name="Fórmula semiempírica de masas">\[B=a_VA-a_SA^{2/3}-a_C\frac{Z(Z-1)}{A^{1/3}}-a_A\frac{(A-2Z)^2}A+\delta,\qquad \delta=\begin{cases}+a_P/\sqrt A&\text{par–par}\\0&A\text{ impar}\\-a_P/\sqrt A&\text{impar–impar.}\end{cases}\]</div>
<p>El término de <em>volumen</em> expresa la saturación; el de <em>superficie</em> corrige a los nucleones de la periferia, que tienen menos vecinos; el de <em>Coulomb</em> es la repulsión entre protones (para una esfera uniforme, \(\tfrac35e^2/4\pi\varepsilon_0r_0=0.72\) MeV con \(r_0=1.2\) fm); el de <em>asimetría</em> viene del principio de Pauli (con \(N\ne Z\) se llenan niveles más altos de uno de los dos tipos); el de <em>apareamiento</em> favorece los pares de nucleones iguales. Se ajustaron los cinco coeficientes por mínimos cuadrados (ecuaciones normales) a las masas de los 269 núcleos estables con \(A\ge20\), y se comparó con <code>numpy.linalg.lstsq</code> (acuerdo a \(10^{-8}\)):</p>
<div class="eq">\[a_V=15.77,\quad a_S=18.18,\quad a_C=0.717,\quad a_A=22.57,\quad a_P=12.87\ \text{MeV},\qquad \sigma_{\rm rms}=2.24\ \text{MeV.}\]</div>
<p>(Los valores tabulados en la literatura son \(a_V\approx15.8\), \(a_S\approx17.8\)–18.3, \(a_C\approx0.71\), \(a_A\approx23\)–23.7 y \(a_P\approx11\)–12 MeV.) Para el ⁵⁶Fe los términos son \(+883.05\), \(-266.06\), \(-121.77\), \(-6.45\) y \(+1.72\) MeV, con suma 490.49 MeV frente a 492.26 MeV medidos (1.77 MeV de diferencia, 0.4 %). Para el ²⁰⁸Pb la diferencia es +7.33 MeV, y para el ⁴He, +5.49 MeV: son los núcleos con capas cerradas, que están más ligados de lo que predice la gota, y la desviación es una pista del modelo de capas.</p>
<p>Fijado \(A\), la energía de masa \(M(Z)=Zm_p+(A-Z)m_n+Zm_e-B/c^2\) es una parábola en \(Z\) (por los términos de Coulomb y asimetría): para \(A\) impar hay una sola; para \(A\) par, dos, separadas por \(2a_P/\sqrt A\) (la de \(Z\) par queda abajo). El mínimo da el isóbaro más estable, y el resto se desintegra por \(\beta\) hacia él (cap. 23). El mismo cálculo predice la línea de estabilidad: para \(A=101\), \(Z=44\) (rutenio-101, el único isóbaro estable); para \(A=56\), \(Z=26\); para \(A=208\), \(Z=82\). De los 193 números másicos \(A\ge20\) con algún isóbaro estable, el \(Z\) predicho acierta (con \(\pm1\)) en 192. La fórmula explica también que casi no hay núcleos estables impar–impar (solo ²H, ⁶Li, ¹⁰B y ¹⁴N, más unos pocos de vida geológica como ⁴⁰K, ⁵⁰V, ¹³⁸La, ¹⁷⁶Lu y ¹⁸⁰Ta): la parábola de los impar–impar queda arriba. La fórmula empírica de Evans, \(Z=A/(1.98+0.0155A^{2/3})\), da \(Z=25.4\) para \(A=56\) y 92.4 para \(A=238\).</p>
<div class="sim" data-sim="valle" data-title="Valle de estabilidad e isóbaros: parábolas de masa"></div>
<div class="sim-guide"><ul>
<li>Los puntos azules son los núcleos estables en el plano \((N,Z)\): siguen \(N=Z\) en los ligeros y se desvían a \(N>Z\) en los pesados (\(N/Z=1.54\) en el plomo), por la repulsión de Coulomb. La línea naranja es la predicción de la fórmula de masas.</li>
<li>Con \(A=101\) (impar): una parábola con mínimo en \(Z=44\) (rutenio), el único estable (círculo grande). Con \(A=100\) (par) hay dos parábolas (puntos azules y rojos) y dos isóbaros naturales, ¹⁰⁰Ru y ¹⁰⁰Mo (este último, con una vida media de \(7\times10^{18}\) años por doble desintegración \(\beta\)), por el desplazamiento del apareamiento.</li>
</ul></div>
</section>

<section>
<h2>Modelo de capas y números mágicos</h2>
<p>Los núcleos con \(Z\) o \(N\) igual a 2, 8, 20, 28, 50, 82 o 126 (<span class="term">números mágicos</span>) son especialmente estables: más ligados que lo que prevé la gota (⁴He, ¹⁶O, ⁴⁰Ca, ²⁰⁸Pb tienen \(\Delta B=+5.5,+3.5,+1.5,+7.3\) MeV respecto de la fórmula), con energías de separación mayores y primeros estados excitados altos, como los gases nobles en la química. Mayer y Jensen (1949) lo explicaron con un modelo de capas: cada nucleón se mueve en un potencial medio central. Con un potencial de <em>Woods–Saxon</em> \(V(r)=-V_0/(1+e^{(r-R)/a})\) (con \(V_0=51+33(N-Z)/A\) MeV para neutrones, \(R=1.27A^{1/3}\) fm y \(a=0.67\) fm) solo se reproducen los primeros números mágicos 2, 8 y 20; la clave está en un acoplamiento <em>espín–órbita</em> fuerte (a diferencia del atómico, atractivo para \(j=l+\tfrac12\)) \(V_{ls}=\lambda\,\dfrac1r\dfrac{df}{dr}\,\langle\mathbf l\cdot\mathbf s\rangle\), que baja el nivel de mayor \(j\) de cada capa: el \(1g_{9/2}\), \(1h_{11/2}\), \(1i_{13/2}\) quedan junto a la capa inferior y producen los huecos en 28, 50, 82 y 126. Se resolvió la ecuación radial para cada canal \((l,j)\) por bisección de Sturm y se comparó con <code>scipy.linalg.eigh_tridiagonal</code> con otra malla (acuerdo de \(10^{-4}\) en unos treinta niveles). Con \(\lambda=45\) MeV fm\(^2\), los huecos mayores aparecen en 2 (4.06 MeV), 8 (4.32), 20 (3.03), 28 (2.11), 50 (3.43), 82 (4.71) y 126 (3.28): exactamente los números mágicos. Sin espín–órbita (\(\lambda=0\)) desaparecen 28, 50, 82 y 126 y aparecen otros cierres (34, 40, 58, 92). (La intensidad \(\lambda\) se tomó de modo que el patrón sea claro; el modelo no pretende dar los niveles a pocos MeV.)</p>
<div class="sim" data-sim="capas" data-title="Modelo de capas: niveles de un neutrón y números mágicos"></div>
<div class="sim-guide"><ul>
<li>Con \(\lambda=45\) y \(A=208\), los niveles en verde cierran capa en 2, 8, 20, 28, 50, 82 y 126; la etiqueta de cada nivel indica \(nl_j\), su degeneración \(2j+1\) y la ocupación acumulada.</li>
<li>Baje \(\lambda\): con \(\lambda\simeq15\) ya aparecen huecos en 82 (1.7 MeV) y 126 (2.3 MeV), pero todavía no en 28 y 50; con \(\lambda=0\) desaparecen los cuatro y quedan los cierres de un pozo sin espín–órbita.</li>
<li>La separación espín–órbita crece con \(l\): casi nula en las capas \(p\), grande en \(g\), \(h\) e \(i\) (la \(1i_{13/2}\) cae desde la capa de arriba).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Con \(r_0=1.2\) fm calcule el radio del ⁵⁶Fe y del ²⁰⁸Pb, y la densidad de masa y numérica de la materia nuclear.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Radios.</b> \(R=1.2\,A^{1/3}\): ⁵⁶Fe, \(1.2\times3.826=4.59\) fm; ²⁰⁸Pb, \(1.2\times5.925=7.11\) fm.</li>
<li><b>Densidad numérica.</b> \(3/4\pi r_0^3=3/(4\pi\times1.728)=0.138\) fm\(^{-3}\).</li>
<li><b>Densidad de masa.</b> \(3m_u/4\pi r_0^3=3(1.6605\times10^{-27})/(4\pi\,1.728\times10^{-45})=2.29\times10^{17}\) kg/m\(^3\).</li>
<li><b>Resultado.</b> <span class="ans">4.59 fm y 7.11 fm; 0.138 fm⁻³; \(2.29\times10^{17}\) kg/m³ (229 millones de toneladas por cm³).</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Calcule la energía de ligadura del ⁴He con las masas atómicas \(M(^4\text{He})=4.0026033\) u, \(m(^1\text{H})=1.0078250\) u, \(m_n=1.0086649\) u, y \(B/A\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Suma de constituyentes.</b> \(2(1.0078250)+2(1.0086649)=4.0329798\) u.</li>
<li><b>Defecto de masa.</b> \(4.0329798-4.0026033=0.0303765\) u.</li>
<li><b>Energía.</b> \(0.0303765\times931.494=28.296\) MeV.</li>
<li><b>Por nucleón.</b> \(28.296/4=7.074\) MeV.</li>
<li><b>Resultado.</b> <span class="ans">28.296 MeV; 7.074 MeV por nucleón.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Compare \(B/A\) del ⁵⁶Fe (\(B=492.26\) MeV), del ⁶²Ni (\(545.26\) MeV) y del ²³⁸U (\(1801.69\) MeV). ¿Qué núcleo estable es el más ligado por nucleón?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>⁵⁶Fe.</b> \(492.26/56=8.790\) MeV.</li>
<li><b>⁶²Ni.</b> \(545.26/62=8.795\) MeV.</li>
<li><b>²³⁸U.</b> \(1801.69/238=7.570\) MeV.</li>
<li><b>Conclusión.</b> El ⁶²Ni es el estable más ligado; el ⁵⁶Fe tiene la menor masa por nucleón porque contiene proporcionalmente menos neutrones, que pesan 0.782 MeV más que un átomo de hidrógeno, pero algo menos de \(B/A\).</li>
<li><b>Resultado.</b> <span class="ans">8.790, 8.795 y 7.570 MeV; el ⁶²Ni es el más ligado entre los estables.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Con los coeficientes del ajuste, calcule los cinco términos de la fórmula de masas para el ⁵⁶Fe y compare la suma con \(B=492.26\) MeV.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Volumen.</b> \(15.769\times56=883.05\) MeV.</li>
<li><b>Superficie.</b> \(-18.177\times56^{2/3}=-18.177\times14.637=-266.06\) MeV.</li>
<li><b>Coulomb.</b> \(-0.7167\times26\times25/56^{1/3}=-121.77\) MeV.</li>
<li><b>Asimetría.</b> \(-22.573\times(56-52)^2/56=-6.45\) MeV.</li>
<li><b>Apareamiento.</b> par–par: \(+12.869/\sqrt{56}=+1.72\) MeV.</li>
<li><b>Suma.</b> \(490.49\) MeV; diferencia con el valor medido, \(+1.77\) MeV (0.36 %).</li>
<li><b>Resultado.</b> <span class="ans">\(+883.05,-266.06,-121.77,-6.45,+1.72\); total 490.49 MeV (medido 492.26 MeV).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Para \(A=101\), use la fórmula de masas para hallar el isóbaro más estable y las diferencias de energía de masa con los isóbaros \(Z=43\) y 45.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Energía de masa.</b> \(M(Z)=Zm_p+(A-Z)m_n+Zm_e-B(Z,A)\).</li>
<li><b>Mínimo.</b> Para \(A=101\) (impar, sin apareamiento) el mínimo está en \(Z=44\) (rutenio).</li>
<li><b>Vecinos.</b> \(M(43)-M(44)=0.06\) MeV y \(M(45)-M(44)=2.03\) MeV: ambos positivos, de modo que los vecinos tienden a desintegrarse (\(\beta^-\) del Tc y \(\beta^+\)/captura del Rh) hacia el Ru.</li>
<li><b>Resultado.</b> <span class="ans">\(Z=44\); \(\Delta M(43)=+0.06\) MeV y \(\Delta M(45)=+2.03\) MeV.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Muestre con la fórmula de masas que los núcleos doblemente mágicos ⁴He, ¹⁶O, ⁴⁰Ca y ²⁰⁸Pb están más ligados que la predicción de la gota, y compárelos con un núcleo sin capas cerradas, el ⁵⁶Fe.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Ligadura medida.</b> 28.296, 127.619, 342.052 y 1636.43 MeV.</li>
<li><b>Fórmula.</b> 22.80, 124.17, 340.55 y 1629.10 MeV.</li>
<li><b>Diferencias.</b> \(+5.49\), \(+3.45\), \(+1.51\) y \(+7.33\) MeV; para el ⁵⁶Fe, solo \(+1.77\) MeV.</li>
<li><b>Interpretación.</b> Las diferencias positivas y grandes en los núcleos doblemente mágicos son la energía extra de las capas cerradas (el modelo de la gota no las conoce); el ⁵⁶Fe no tiene capa cerrada de protones (\(Z=26\)) ni de neutrones (\(N=30\)), y su diferencia es pequeña.</li>
<li><b>Resultado.</b> <span class="ans">\(\Delta B=+5.49,+3.45,+1.51,+7.33\) MeV (doblemente mágicos) frente a \(+1.77\) MeV (⁵⁶Fe).</span></li>
</ol></details></li>
</ol>
