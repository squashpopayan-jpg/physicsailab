<template class="chapter-src" data-id="hidrogeno" data-num="14" data-title="Átomo de hidrógeno y orbitales" data-part="Parte III · Mecánica ondulatoria" data-short="La ecuación de Schrödinger con potencial de Coulomb, los números cuánticos n, l y m, las funciones radiales y los orbitales, y las transiciones dipolares con sus reglas de selección y sus vidas medias">
<p class="lead">El átomo de hidrógeno es el único átomo con solución exacta, y es la piedra angular de la física atómica: la ecuación de Schrödinger con la fuerza de Coulomb reproduce los niveles de Bohr, y además da la forma de los orbitales, la degeneración de los niveles, las reglas que dicen qué transiciones son posibles y cuánto tarda en decaer cada estado. Este capítulo plantea el problema, enumera sus soluciones, calcula valores medios con las funciones radiales y obtiene, con la integral dipolar, los coeficientes de Einstein de las líneas del hidrógeno, que se comparan con los valores publicados (NIST). Todo lo demás (átomos con varios electrones, la tabla periódica, las moléculas) es una variación de lo que aquí se aprende.</p>

<section>
<h2>La ecuación y sus números cuánticos</h2>
<p>El electrón y el protón se mueven con la energía potencial de Coulomb \(V=-e^2/4\pi\varepsilon_0r\); pasando al sistema de centro de masas, el problema es el de una partícula de masa reducida \(\mu\) (\(\mu=0.999\,456\,m_e\) para el hidrógeno) en un potencial central. En coordenadas esféricas, la función \(\psi=R(r)Y_l^m(\theta,\varphi)\) separa la ecuación en una parte angular (los armónicos esféricos \(Y_l^m\), autofunciones del momento angular, con \(L^2=l(l+1)\hbar^2\) y \(L_z=m\hbar\)) y una radial:</p>
<div class="eq key" data-name="Ecuación radial y niveles del hidrógeno">\[-\frac{\hbar^2}{2\mu}\frac1{r^2}\dd_r\bigl(r^2\dd_rR\bigr)+\Bigl[\frac{l(l+1)\hbar^2}{2\mu r^2}-\frac{e^2}{4\pi\varepsilon_0r}\Bigr]R=ER,\qquad E_n=-\frac{\mu c^2\alpha^2}{2n^2}=-\frac{13.6057\,\mu/m_e}{n^2}\ \text{eV}.\]</div>
<p>La ecuación radial solo tiene soluciones normalizables (que decaen en el infinito y son regulares en el origen) si la energía es \(E_n\), y esto exige que \(n\) sea un entero positivo y \(l\le n-1\). Los tres <span class="term">números cuánticos</span> son:</p>
<div class="tablewrap"><table>
<tr><th>Número</th><th>Valores</th><th>Significado</th></tr>
<tr><td>\(n\) (principal)</td><td>1, 2, 3, …</td><td>Energía \(E_n=-Ry/n^2\); número de nodos radiales \(=n-l-1\)</td></tr>
<tr><td>\(l\) (orbital)</td><td>0, 1, …, \(n-1\) (s, p, d, f, …)</td><td>Módulo del momento angular \(\sqrt{l(l+1)}\,\hbar\); forma angular (l nodos angulares)</td></tr>
<tr><td>\(m\)</td><td>\(-l,\dots,+l\)</td><td>Componente \(L_z=m\hbar\); orientación</td></tr>
</table></div>
<p>Como la energía depende solo de \(n\) (una propiedad del potencial \(1/r\) que no se da en otros potenciales centrales, relacionada con una simetría oculta de Coulomb), cada nivel \(n\) tiene una degeneración \(\sum_{l=0}^{n-1}(2l+1)=n^2\) estados (el doble con el espín del capítulo siguiente: \(2n^2\)). El nivel \(n=4\), por ejemplo, tiene 16 estados orbitales (1 s, 3 p, 5 d y 7 f) y 32 con el espín. La notación espectroscópica \(nl\) (1s, 2p, 3d, …) viene de los nombres de las series de líneas (<em>sharp</em>, <em>principal</em>, <em>diffuse</em>, <em>fundamental</em>).</p>
</section>

<section>
<h2>Funciones radiales y tamaño del átomo</h2>
<p>Con \(a=a_0/(\mu/m_e)\) (\(a_0=52.918\) pm es el radio de Bohr), las soluciones son un polinomio de Laguerre por una exponencial decreciente: \(R_{nl}\propto\rho^le^{-\rho/2}L_{n-l-1}^{2l+1}(\rho)\), con \(\rho=2r/na\). Las más sencillas, con \(a_0=1\):</p>
<div class="eq">\[R_{10}=2e^{-r},\qquad R_{20}=\tfrac1{\sqrt2}\bigl(1-\tfrac r2\bigr)e^{-r/2},\qquad R_{21}=\tfrac1{2\sqrt6}\,r\,e^{-r/2},\qquad \int_0^\infty R_{nl}^2\,r^2\dd r=1.\]</div>
<p>La probabilidad de encontrar al electrón entre \(r\) y \(r+\dd r\) es \(r^2R_{nl}^2\dd r\) (la densidad por el volumen de la capa). Valores medios exactos: \(\langle r\rangle=\tfrac12[3n^2-l(l+1)]a_0\), \(\langle r^2\rangle=\tfrac12n^2[5n^2+1-3l(l+1)]a_0^2\), \(\langle1/r\rangle=1/n^2a_0\). Para el 1s: \(\langle r\rangle=1.5\,a_0\), el radio más probable es exactamente \(a_0\) (el de Bohr) y la probabilidad de hallar al electrón a menos de \(a_0\) del protón es \(1-5e^{-2}=32.3\) %. El nivel \(n\) con \(l=n-1\) (los orbitales «circulares», 2p, 3d, 4f) no tiene nodos radiales y su máximo está en \(n^2a_0\): el radio de Bohr \(r_n\). El tamaño crece como \(n^2\): un átomo de Rydberg con \(n=100\) mide \(0.529\) µm de radio y tiene \(E=-1.36\) meV.</p>
<div class="box ex"><h4>El nodo del 2s y el radio del 3d</h4>
<p><strong>(a)</strong> \(R_{20}\) se anula en \(r=2a_0\); \(R_{30}\propto1-\tfrac23r+\tfrac2{27}r^2\) tiene dos nodos, en \(r=\tfrac12(9\pm\sqrt{27})\,a_0=1.902\) y \(7.098\,a_0\). <strong>(b)</strong> \(\langle r\rangle\) de los estados con \(n=3\): \(13.5\,a_0\) (3s), \(12.5\) (3p) y \(10.5\) (3d); el 3d, sin nodos, tiene su máximo en \(9a_0=476\) pm. <strong>(c)</strong> El 2p tiene su máximo en \(4a_0=212\) pm y \(\langle r\rangle=5a_0\); el 2s, con un nodo, \(\langle r\rangle=6a_0\), con máximo en \(5.24a_0\). <strong>Resultado.</strong> A igual \(n\), los estados con \(l\) menor penetran más cerca del núcleo (tienen amplitud cerca de \(r=0\)), lo que explica por qué la energía de los átomos con varios electrones depende de \(l\) (capítulo 16).</p></div>
<div class="sim" data-sim="radial" data-title="Funciones radiales del hidrógeno: R_nl, densidad radial, valores medios"></div>
<div class="sim-guide"><ul>
<li>Con \(n=3\), \(l=1\): \(E=-1.5109\) eV (con masa reducida), \(\langle r\rangle=12.5\,a_0=661\) pm, 1 nodo radial (\(n-l-1=1\)), máximo de la densidad en \(12\,a_0\) y 9 estados degenerados en \(n=3\).</li>
<li>Con \(n=1\), \(l=0\): la densidad radial tiene su máximo en \(1.00\,a_0\) y la probabilidad de estar dentro de \(a_0\) es 32.3 %. Con \(n=3\), \(l=2\): sin nodos, máximo en \(9.00\,a_0\) (\(n^2a_0\)): el «orbital circular».</li>
<li>Suba \(n\) con \(l=0\): hay \(n-1\) nodos radiales, y la densidad radial se concentra en un lóbulo externo cuyo radio crece como \(n^2\); \(\langle r\rangle\) pasa de 1.5 (1s) a 6 (2s), 13.5 (3s) y 24 \(a_0\) (4s).</li>
</ul></div>
</section>

<section>
<h2>Los orbitales</h2>
<p>El <span class="term">orbital</span> \(\psi_{nlm}(r,\theta,\varphi)=R_{nl}(r)Y_l^m(\theta,\varphi)\) es la región donde es probable encontrar al electrón. Los estados con \(m\ne0\) se pueden combinar para dar orbitales reales: los \(s\) (\(l=0\)) son esféricos; los \(p\) (\(l=1\)) tienen la forma de un par de lóbulos opuestos a lo largo de los ejes \(x\), \(y\) o \(z\), con un plano nodal que pasa por el núcleo; los \(d\) (\(l=2\)) tienen cuatro lóbulos o un lóbulo con anillo (\(d_{z^2}\)), con dos superficies nodales. El número de superficies nodales angulares es \(l\) y el de nodos radiales \(n-l-1\), de modo que el número total de nodos es \(n-1\) para todos los estados de la capa \(n\). Estas formas determinan la geometría de los enlaces químicos (los orbitales \(p\) apuntan en direcciones perpendiculares, la molécula de agua tiene 104.5°) y la estructura de los cristales (capítulo 20).</p>
<div class="sim" data-sim="orbitales" data-title="Orbitales del hidrógeno: densidad en un plano que contiene el eje z"></div>
<div class="sim-guide"><ul>
<li>El orbital \(3d_{z^2}\) (\(n=3\), \(l=2\), \(m=0\)): dos lóbulos a lo largo de \(z\) y un anillo en el plano ecuatorial, con 2 superficies nodales cónicas (\(\cos^2\theta=1/3\), \(\theta=54.7^\circ\) y \(125.3^\circ\)) y ningún nodo radial; \(\langle r\rangle=10.5\,a_0\).</li>
<li>Con \(n=2\), \(l=1\), \(m=0\) se ve el \(2p_z\): dos lóbulos y el plano nodal \(z=0\). Con \(n=2\), \(l=0\) aparece el nodo esférico en \(r=2a_0\). Con \(n=4\), \(l=0\) hay tres nodos esféricos y la densidad se concentra en el lóbulo exterior.</li>
<li>Los orbitales con \(m\ne0\) se muestran como combinaciones reales (\(\cos m\varphi\) o \(\operatorname{sen}|m|\varphi\)); la rotación alrededor de \(z\) las convierte unas en otras sin cambiar la energía, que depende solo de \(n\).</li>
</ul></div>
</section>

<section>
<h2>Transiciones, reglas de selección y vidas medias</h2>
<p>Un átomo en un estado \(i\) emite espontáneamente un fotón y pasa a un estado \(f\) de menor energía con una tasa dada por el momento dipolar eléctrico entre ambos estados, \(\mathbf d=-e\langle f|\mathbf r|i\rangle\) (Einstein, 1916; Dirac, 1927). La integral angular de \(\langle f|\mathbf r|i\rangle\) se anula salvo si \(\Delta l=\pm1\) y \(\Delta m=0,\pm1\) (<span class="term">reglas de selección dipolares</span>: el fotón se lleva una unidad de momento angular), mientras que \(n\) puede cambiar en cualquier cantidad. La tasa, en unidades atómicas, es</p>
<div class="eq key" data-name="Coeficiente de Einstein de la emisión espontánea">\[A_{i\to f}=\frac43\,\alpha^3\omega_{if}^3\,\frac{l_>}{2l_i+1}\,\bigl|\langle n_fl_f|r|n_il_i\rangle\bigr|^2\times\frac{E_h}{\hbar},\qquad \langle n_fl_f|r|n_il_i\rangle=\int_0^\infty R_{n_fl_f}\,R_{n_il_i}\,r^3\dd r,\]</div>
<p>con \(\omega_{if}\) en hartree (\(E_h=27.211\) eV), \(E_h/\hbar=4.1341\times10^{16}\) s\(^{-1}\) y \(l_>=\max(l_i,l_f)\); la vida media de un estado es \(\tau=1/\sum_fA_{i\to f}\) y la fracción de átomos que sigue cada canal, \(A_{i\to f}/\sum A\). Para la línea Lyman-\(\alpha\) (\(2p\to1s\)), \(\langle1s|r|2p\rangle=128\sqrt6/243=1.2903\,a_0\) (exacto) y \(\omega=\tfrac38E_h\), de donde \(A=6.2649\times10^8\) s\(^{-1}\) y \(\tau_{2p}=1.596\) ns; el valor publicado (NIST) es \(6.2649\times10^8\) s\(^{-1}\). La tabla compara los cálculos de este curso con los datos de la base de espectros atómicos del NIST (ambos con masa reducida, promediando la estructura fina):</p>
<div class="tablewrap"><table>
<tr><th>Transición</th><th>\(\lambda\) (nm)</th><th>\(A\) calculada (s\(^{-1}\))</th><th>\(A\) NIST (s\(^{-1}\))</th></tr>
<tr><td>2p → 1s (Lyα)</td><td>121.568</td><td>\(6.2649\times10^8\)</td><td>\(6.2649\times10^8\)</td></tr>
<tr><td>3p → 1s (Lyβ)</td><td>102.57</td><td>\(1.6725\times10^8\)</td><td>\(1.6725\times10^8\)</td></tr>
<tr><td>3p → 2s (Hα)</td><td>656.47</td><td>\(2.2448\times10^7\)</td><td>\(2.2449\times10^7\)</td></tr>
<tr><td>3s → 2p (Hα)</td><td>656.47</td><td>\(6.3136\times10^6\)</td><td>\(6.3141\times10^6\)</td></tr>
<tr><td>3d → 2p (Hα)</td><td>656.47</td><td>\(6.4651\times10^7\)</td><td>\(6.4651\times10^7\)</td></tr>
<tr><td>4p → 1s (Lyγ)</td><td>97.25</td><td>\(6.8187\times10^7\)</td><td>\(6.8186\times10^7\)</td></tr>
</table></div>
<p>Vidas medias resultantes: 2p, 1.596 ns; 3p, 5.271 ns (\(3p\to1s\) el 88.2 % de las veces y \(3p\to2s\) el 11.8 %); 3d, 15.47 ns (solo \(3d\to2p\)); 3s, 158.4 ns (solo \(3s\to2p\)); 4f, 72.5 ns. El estado 2s no puede decaer al 1s por emisión dipolar (\(\Delta l=0\)): es <em>metaestable</em>, y decae por emisión simultánea de dos fotones en 0.12 s, lo que lo hace unos 8 órdenes de magnitud más longevo que el 2p. En las nebulosas planetarias esa emisión de dos fotones es una componente continua importante.</p>
<div class="sim" data-sim="lineas" data-title="Transiciones dipolares del hidrógeno: canales, longitudes de onda y vidas medias"></div>
<div class="sim-guide"><ul>
<li>Del estado 3p salen dos canales: \(3p\to1s\) (\(A=1.673\times10^8\) s\(^{-1}\), 102.57 nm, 88.2 %) y \(3p\to2s\) (\(2.245\times10^7\), 656.47 nm, 11.8 %); la vida media es 5.271 ns. Las flechas finas son canales débiles: el grosor es proporcional a \(\sqrt A\).</li>
<li>Con 3s solo existe \(3s\to2p\) (\(6.31\times10^6\) s\(^{-1}\)): 158.4 ns. Con 2s no hay ningún canal permitido (se muestra el mensaje de la regla de selección). Con 4f solo \(4f\to3d\): 72.5 ns.</li>
<li>La gráfica de la derecha muestra que las tasas de los estados np caen con \(n\) (aproximadamente como \(n^{-3}\)): los estados muy excitados son más longevos, y por eso las líneas de los átomos de Rydberg son estrechas.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Para el estado 1s (\(R_{10}=2e^{-r}\), \(a_0=1\)): compruebe la normalización, halle \(\langle r\rangle\), el radio más probable y la probabilidad de hallar al electrón a menos de \(a_0\) del protón.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Normalización.</b> \(\int_0^\infty4e^{-2r}r^2\dd r=4\cdot\dfrac{2!}{2^3}=1\).</li>
<li><b>Radio medio.</b> \(\langle r\rangle=\int_0^\infty4e^{-2r}r^3\dd r=4\cdot\dfrac{3!}{2^4}=1.5\,a_0\) (79.4 pm).</li>
<li><b>Más probable.</b> \(\dd(r^2e^{-2r})/\dd r=0\Rightarrow r=1\,a_0\) (52.9 pm).</li>
<li><b>\(P(r\lt a_0)\).</b> \(\int_0^14r^2e^{-2r}\dd r=1-5e^{-2}=0.3233\).</li>
<li><b>Resultado.</b> <span class="ans">1 (normalizada); 1.5\(\,a_0\); \(a_0\); 32.3 %.</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Halle los nodos radiales del 2s y del 3s, el radio más probable y \(\langle r\rangle\) del 2p, y el número de estados (sin espín) en las capas \(n=3\) y \(n=4\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>2s.</b> \(R_{20}\propto(2-r)\): nodo en \(r=2a_0\).</li>
<li><b>3s.</b> \(1-\tfrac23r+\tfrac2{27}r^2=0\Rightarrow r^2-9r+13.5=0\Rightarrow r=(9\pm5.196)/2=1.902,\ 7.098\,a_0\).</li>
<li><b>2p.</b> \(r^2R_{21}^2\propto r^4e^{-r}\): máximo en \(r=4a_0\); \(\langle r\rangle=\tfrac12(12-2)=5\,a_0\).</li>
<li><b>Degeneración.</b> \(n^2\): 9 y 16 estados (18 y 32 con el espín).</li>
<li><b>Resultado.</b> <span class="ans">\(2a_0\); \(1.902\) y \(7.098\,a_0\); \(4a_0\) y \(5a_0\); 9 y 16.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Con la masa reducida (\(\mu=0.999\,456\,m_e\), \(R_H=10\,967\,758\) m\(^{-1}\)) calcule las longitudes de onda de Lyman-\(\alpha\), Hα, Hβ, la primera de Paschen y de Brackett, y la energía para ionizar desde \(n=2\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Lyα.</b> \(1/\lambda=R_H(1-\tfrac14)\Rightarrow\lambda=121.568\) nm.</li>
<li><b>Hα, Hβ.</b> \(R_H(\tfrac14-\tfrac19)\Rightarrow656.470\) nm; \(R_H(\tfrac14-\tfrac1{16})\Rightarrow486.274\) nm.</li>
<li><b>Paschen α, Brackett α.</b> \(R_H(\tfrac19-\tfrac1{16})\Rightarrow1875.63\) nm; \(R_H(\tfrac1{16}-\tfrac1{25})\Rightarrow4052.28\) nm.</li>
<li><b>Ionización desde \(n=2\).</b> \(Ry\,\mu/m_e/4=3.3996\) eV.</li>
<li><b>Resultado.</b> <span class="ans">121.568, 656.470, 486.274, 1875.63, 4052.28 nm; 3.3996 eV.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Calcule el coeficiente de Einstein de \(2p\to1s\) con la integral dipolar \(\langle1s|r|2p\rangle=1.2903\,a_0\) y \(\omega=\tfrac38E_h\), y la vida media del 2p. Si el 3p decae por \(3p\to1s\) y \(3p\to2s\) con \(1.673\times10^8\) y \(2.245\times10^7\) s\(^{-1}\), halle la vida media y las fracciones.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Fórmula.</b> \(A=\tfrac43\alpha^3\omega^3\,(l_>/(2l_i+1))\,|r|^2\,E_h/\hbar\) con \(l_i=1\), \(l_f=0\): \(l_>/(2l_i+1)=1/3\).</li>
<li><b>Números.</b> \(\alpha^3=3.8859\times10^{-7}\); \(\omega^3=0.375^3=0.052734\); \(|r|^2=1.2903^2=1.6648\). Con \(\mu=m_e\): \(A=\tfrac43(3.8859\times10^{-7})(0.052734)(\tfrac13)(1.6648)\times4.1341\times10^{16}=6.2683\times10^8\) s\(^{-1}\). Con la masa reducida, \(\omega\propto\mu\) y \(|r|^2\propto\mu^{-2}\), así que \(A\propto\mu\): \(A=6.2683\times10^8\times0.999\,456=6.2649\times10^8\) s\(^{-1}\).</li>
<li><b>Vida media.</b> \(\tau_{2p}=1/A=1.596\) ns.</li>
<li><b>3p.</b> \(\sum A=1.897\times10^8\) s\(^{-1}\Rightarrow\tau=5.27\) ns; fracciones \(88.2\) % y \(11.8\) %.</li>
<li><b>Resultado.</b> <span class="ans">\(6.2649\times10^8\) s\(^{-1}\), 1.596 ns; 5.27 ns, 88.2 % y 11.8 %.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Un átomo de Rydberg de \(n=100\): calcule el radio de Bohr \(r_n\), la energía de ligadura, el momento angular máximo y el campo eléctrico del protón a esa distancia (compárelo con 1 V/cm).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Radio.</b> \(r_n=n^2a_0=10^4(52.918\text{ pm})=529.2\) nm.</li>
<li><b>Energía.</b> \(E=-13.6057/10^4=-1.3606\) meV.</li>
<li><b>Momento angular máximo.</b> \(l=n-1=99\): \(L=\sqrt{99\cdot100}\,\hbar=99.5\,\hbar\).</li>
<li><b>Campo.</b> \(E=e/(4\pi\varepsilon_0r_n^2)=1.4400\times10^{-9}\text{ V·m}/(529.2\times10^{-9}\text{ m})^2=5.14\times10^{3}\) V/m \(=51.4\) V/cm: un campo de decenas de V/cm ioniza el átomo.</li>
<li><b>Resultado.</b> <span class="ans">529.2 nm; \(-1.3606\) meV; \(99.5\,\hbar\); 51.4 V/cm.</span></li>
</ol></details></li>
</ol>
