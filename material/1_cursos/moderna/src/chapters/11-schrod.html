<template class="chapter-src" data-id="schrod" data-num="11" data-title="Función de onda y ecuación de Schrödinger" data-part="Parte III · Mecánica ondulatoria" data-short="La interpretación de Born, la ecuación de Schrödinger y los estados estacionarios, la partícula en una caja, la dinámica de las superposiciones y sus revivals, y el confinamiento en puntos cuánticos">
<p class="lead">Si la materia es una onda, hace falta la ecuación que gobierna esa onda. Schrödinger la escribió en 1926 y Born le dio, el mismo año, su significado: el módulo cuadrado de la función de onda es una densidad de probabilidad. Este capítulo parte de la onda de de Broglie para llegar a la ecuación, resuelve el problema más simple con ella, la partícula en una caja, y extrae todo lo que contiene: la energía está cuantizada, la partícula tiene energía incluso en el nivel más bajo, las probabilidades no son uniformes y la dinámica de una superposición tiene una frecuencia que es justamente la de la luz que se emite. La caja es un modelo de las moléculas conjugadas, de los núcleos y de los puntos cuánticos de las pantallas modernas.</p>

<section>
<h2>La función de onda y la regla de Born</h2>
<p>Una onda de materia plana de momento \(p=\hbar k\) y energía \(E=\hbar\omega\) es \(\psi=Ae^{i(kx-\omega t)}\). Un estado general es una superposición de ellas, y la función \(\psi(x,t)\) es en general <em>compleja</em>: no es un campo medible, sino una amplitud. Born propuso que \(|\psi(x,t)|^2\,\dd x\) es la probabilidad de hallar la partícula entre \(x\) y \(x+\dd x\):</p>
<div class="eq key" data-name="Regla de Born, normalización y valores esperados">\[P(a\le x\le b)=\int_a^b|\psi|^2\dd x,\qquad \int_{-\infty}^{\infty}|\psi|^2\dd x=1,\qquad \langle f(x)\rangle=\int\psi^*f(x)\,\psi\,\dd x,\qquad \Delta x=\sqrt{\langle x^2\rangle-\langle x\rangle^2}.\]</div>
<p>La probabilidad se obtiene de la amplitud y no de la intensidad de una onda: de ahí la interferencia (si \(\psi=\psi_1+\psi_2\), \(|\psi|^2=|\psi_1|^2+|\psi_2|^2+2\operatorname{Re}\psi_1^*\psi_2\)) y el patrón de la doble rendija del capítulo 9. La condición de normalización exige que \(\psi\) sea cuadráticamente integrable, y además \(\psi\) y su derivada \(\psi'\) deben ser continuas allí donde el potencial sea finito: de esas exigencias nace la cuantización.</p>
</section>

<section>
<h2>La ecuación de Schrödinger</h2>
<p>Para una partícula libre no relativista, \(E=p^2/2m\) se traduce, con \(E=\hbar\omega\) y \(p=\hbar k\), en \(\hbar\omega=\hbar^2k^2/2m\). La ecuación lineal que tiene como soluciones las ondas planas con esa relación de dispersión se obtiene con \(\partial_t\psi=-i\omega\psi\) y \(\partial_x^2\psi=-k^2\psi\): \(i\hbar\partial_t\psi=-\tfrac{\hbar^2}{2m}\partial_x^2\psi\). Cuando hay un potencial \(V(x)\):</p>
<div class="eq key" data-name="Ecuación de Schrödinger">\[i\hbar\,\pdv{\psi}t=-\frac{\hbar^2}{2m}\pdv{^2\psi}{x^2}+V(x)\,\psi,\qquad \psi(x,t)=\psi_E(x)\,e^{-iEt/\hbar}\ \Rightarrow\ -\frac{\hbar^2}{2m}\psi_E''+V\psi_E=E\,\psi_E.\]</div>
<p>La ecuación es lineal (las superposiciones de soluciones son soluciones) y de primer orden en el tiempo (el estado inicial determina el futuro). Los <span class="term">estados estacionarios</span> \(\psi_E(x)e^{-iEt/\hbar}\) tienen una densidad \(|\psi|^2\) independiente del tiempo y una energía definida; como la ecuación es lineal, cualquier estado es una superposición de estacionarios, \(\psi=\sum_nc_n\psi_n e^{-iE_nt/\hbar}\), con \(|c_n|^2\) la probabilidad de medir \(E_n\). La ecuación independiente del tiempo es una ecuación de autovalores: las soluciones aceptables (normalizables y continuas) existen solo para ciertos valores de \(E\): la energía se cuantiza.</p>
</section>

<section>
<h2>La partícula en una caja</h2>
<p>El modelo más simple: una partícula libre dentro de \(0\lt x\lt L\) y confinada por paredes infinitas. Dentro, \(V=0\) y \(\psi''=-k^2\psi\), con \(k=\sqrt{2mE}/\hbar\). Fuera \(\psi=0\), y la continuidad exige \(\psi(0)=\psi(L)=0\): \(\psi=A\operatorname{sen}kx\) con \(kL=n\pi\) (una onda estacionaria cuyas mitades de longitud de onda caben en la caja: \(\lambda=2L/n\), la misma condición que de Broglie dio para la órbita de Bohr). La normalización \(\int_0^LA^2\operatorname{sen}^2(n\pi x/L)\dd x=A^2L/2=1\) da \(A=\sqrt{2/L}\):</p>
<div class="eq key" data-name="Estados de la partícula en una caja">\[\psi_n(x)=\sqrt{\frac2L}\operatorname{sen}\frac{n\pi x}L,\qquad E_n=\frac{n^2\pi^2\hbar^2}{2mL^2}=n^2E_1,\qquad n=1,2,3,\dots\]</div>
<p>Consecuencias. (i) <b>Energía de punto cero</b>: el estado más bajo no es \(E=0\) sino \(E_1\gt0\): confinar una partícula en \(L\) le obliga a tener \(\Delta p\ge\hbar/2\Delta x\) (capítulo 9), y por tanto energía cinética. (ii) <b>Los niveles crecen como \(n^2\)</b> y se separan más a medida que \(L\) disminuye: \(E_n\propto1/mL^2\). (iii) <b>Las probabilidades no son uniformes</b>: \(|\psi_n|^2=(2/L)\operatorname{sen}^2(n\pi x/L)\) tiene \(n\) máximos y \(n-1\) nodos interiores (el «imposible» de la mecánica clásica: la partícula nunca está en el centro en \(n=2\)). Para el intervalo \([a,b]\) (en unidades de \(L\)), \(P=(b-a)-[\operatorname{sen}2n\pi b-\operatorname{sen}2n\pi a]/2n\pi\). (iv) <b>Límite clásico</b>: para \(n\to\infty\) las oscilaciones se promedian a la densidad uniforme \(1/L\) de una partícula que rebota, y \(\Delta x\to L/\sqrt{12}\) (principio de correspondencia). Además \(\langle x\rangle=L/2\), \(\langle x^2\rangle=L^2(\tfrac13-\tfrac1{2n^2\pi^2})\), \(\Delta p=n\pi\hbar/L\), de modo que \(\Delta x\Delta p=\tfrac\hbar2\sqrt{n^2\pi^2/3-2}\ge\tfrac\hbar2\cdot1.136\).</p>
<div class="box ex"><h4>Un electrón en una caja de 0.4 nm</h4>
<p><strong>Datos.</strong> \(L=0.4\) nm (tamaño de una molécula pequeña). <strong>Procedimiento.</strong> (1) \(E_1=\pi^2\hbar^2/(2m_eL^2)=0.37603\ \text{eV}\times(1\ \text{nm}/0.4\ \text{nm})^2=2.350\) eV. (2) \(E_2=4E_1=9.401\) eV; \(E_3=9E_1=21.15\) eV. (3) Salto \(2\to1\): \(3E_1=7.051\) eV, fotón de \(\lambda=1239.84/7.051=175.85\) nm (ultravioleta); salto \(3\to2\): \(5E_1=11.75\) eV, 105.5 nm. <strong>Resultado.</strong> Los niveles de un electrón confinado en dimensiones atómicas están separados por varios eV y las transiciones caen en el ultravioleta; con \(L=1\) nm, \(E_1=0.376\) eV y el salto \(3\to2\) (1.88 eV) cae en el rojo (659 nm). Para un protón en un núcleo de 10 fm, \(E_1=2.05\) MeV: la escala de las energías nucleares.</p></div>
<div class="sim" data-sim="caja" data-title="Partícula en una caja: niveles, funciones de onda y probabilidades"></div>
<div class="sim-guide"><ul>
<li>Electrón en \(L=1\) nm, \(n=3\): \(E_3=3.384\) eV, \(E_1=0.376\) eV, el fotón del salto \(3\to2\) tiene 1.880 eV (659.4 nm). Con la ventana \([0.25L,0.75L]\), la probabilidad cuántica en \(n=3\) es del 39.4 % (clásica: 50 %); con \(n=1\) es del 81.8 %.</li>
<li>Baje \(L\): las energías crecen como \(1/L^2\). Con \(L=0.1\) nm (un átomo) \(E_1=37.6\) eV: del orden de la energía de ionización. Con el protón en 10 fm (\(10^{-5}\) nm): 2.05 MeV.</li>
<li>Con \(n=8\) la densidad ya oscila rápido alrededor de la clásica (línea discontinua): el límite clásico. El producto \(\Delta x\Delta p/(\hbar/2)=\sqrt{n^2\pi^2/3-2}\): 1.136 para \(n=1\) y 14.4 para \(n=8\) (el estado deja de ser de «mínima incertidumbre»).</li>
</ul></div>
</section>

<section>
<h2>Dinámica: superposiciones y revivals</h2>
<p>Un estado estacionario no cambia con el tiempo. Pero una superposición de dos, \(\psi=c_1\psi_1e^{-iE_1t/\hbar}+c_2\psi_2e^{-iE_2t/\hbar}\), sí: su densidad contiene el término cruzado \(2c_1c_2\psi_1\psi_2\cos[(E_2-E_1)t/\hbar]\), que oscila con la frecuencia \(\nu=(E_2-E_1)/h\). Es la condición de frecuencias de Bohr obtenida de la ecuación: el átomo en superposición de dos niveles tiene un dipolo oscilante que emite luz a esa frecuencia. Para una caja, el tiempo \(T_\text{rev}=4mL^2/\pi\hbar\) cumple \(E_nT_\text{rev}/\hbar=2\pi n^2\) para todo \(n\), así que <em>todas</em> las fases vuelven a su valor inicial: un paquete cualquiera se reconstruye exactamente (<span class="term">revival</span>). Entre medias, se ensancha, choca contra las paredes, interfiere consigo mismo y en los tiempos fraccionarios \(T_\text{rev}\cdot p/q\) se reconstruye en \(q\) copias (revivals fraccionarios, Averbukh y Perelman, 1989).</p>
<div class="box ex"><h4>Una superposición en 1 nm</h4>
<p><strong>Datos.</strong> Electrón en \(L=1\) nm, \(\psi=(\psi_1e^{-iE_1t/\hbar}+\psi_2e^{-iE_2t/\hbar})/\sqrt2\). <strong>Procedimiento.</strong> (1) \(E_2-E_1=3E_1=1.1281\) eV. (2) Frecuencia \(\nu=\Delta E/h=2.728\times10^{14}\) Hz (\(\lambda=1099\) nm, infrarrojo cercano); periodo \(T=1/\nu=3.666\) fs. (3) Energía media \(\langle E\rangle=\tfrac12(E_1+E_2)=2.5E_1=0.940\) eV. (4) Revival \(T_\text{rev}=4mL^2/\pi\hbar=10.998\) fs: tres periodos de batido. <strong>Resultado.</strong> La probabilidad de medir \(E_1\) o \(E_2\) es 1/2 cada una en todo momento; lo que oscila es dónde está la partícula (de la mitad izquierda a la derecha).</p></div>
<div class="sim" data-sim="paquete" data-title="Evolución temporal en el pozo: superposiciones, paquetes y revivals"></div>
<div class="sim-guide"><ul>
<li>Con la superposición \(n=1\) y \(n=2\) la densidad se desplaza de un lado a otro con el periodo \(2\pi\hbar/(E_2-E_1)=3.666\) fs; el solapamiento con el estado inicial cae a cero y vuelve a 1 en \(T_\text{rev}=10.998\) fs.</li>
<li>Con el paquete gaussiano (\(\sigma=0.05L\), \(k_0=40/L\)) el paquete avanza hacia la pared, rebota, se ensancha y se hace una nube; en \(t=T_\text{rev}\) se reconstruye en la misma posición y en \(T_\text{rev}/2\) en la posición espejada (\(0.7L\)).</li>
<li>El estado estacionario \(n=2\) no cambia: \(|\psi|^2\) es constante. La energía media y la norma permanecen constantes en todos los casos: el tiempo no altera las probabilidades \(|c_n|^2\).</li>
</ul></div>
</section>

<section>
<h2>Confinamiento en la práctica: puntos cuánticos</h2>
<p>Un cristal semiconductor de pocos nanómetros (un <span class="term">punto cuántico</span>) confina un electrón y un hueco como una caja tridimensional. Para una esfera de radio \(R\) con paredes infinitas, el nivel más bajo (\(l=0\)) tiene \(E=\pi^2\hbar^2/2m^*R^2\) (la ecuación radial para \(u=rR\) es la de la caja con \(L=R\)). Con las masas efectivas del electrón y del hueco en el cristal y la atracción coulombiana entre ellos, la energía del primer estado excitado del par (Brus, 1984) es</p>
<div class="eq key" data-name="Fórmula de Brus (modelo de masa efectiva)">\[E(R)=E_g+\frac{\pi^2\hbar^2}{2R^2}\Bigl(\frac1{m_e^*}+\frac1{m_h^*}\Bigr)-\frac{1.786\,e^2}{4\pi\varepsilon_0\varepsilon_rR}.\]</div>
<p>Para el CdSe (\(E_g=1.74\) eV, \(m_e^*=0.13\,m_e\), \(m_h^*=0.45\,m_e\), \(\varepsilon_r=10.6\)) y \(R=2\) nm: confinamiento \(+0.932\) eV, Coulomb \(-0.121\) eV, \(E=2.551\) eV (486 nm). Al bajar de tamaño la energía sube y el color pasa del rojo al azul: es el principio de las pantallas de puntos cuánticos (premio Nobel de Química 2023: Bawendi, Brus y Ekimov). Cuidado con la precisión: el modelo supone paredes infinitas y masas efectivas de volumen, y <em>sobrestima</em> el confinamiento; la curva de calibración medida en CdSe (Yu et al., 2003) da para un diámetro de 4 nm (R = 2 nm) un primer pico de absorción cerca de 580 nm, no los 486 nm del modelo. El valor de la fórmula es la tendencia: \(E-E_g\propto1/R^2\) y la sintonización del color con el tamaño.</p>
<div class="sim" data-sim="puntos" data-title="Puntos cuánticos: el color de la emisión según el radio (modelo de Brus)"></div>
<div class="sim-guide"><ul>
<li>CdSe: \(R=1.5\) nm, 3.235 eV (383 nm); 2 nm, 2.551 eV (486 nm); 2.5 nm, 2.239 eV (554 nm); 3 nm, 2.073 eV (598 nm); 4 nm, 1.912 eV (648 nm). Para tamaños grandes la energía tiende a \(E_g=1.74\) eV (713 nm, el macizo).</li>
<li>La curva es el mismo orden en los tres materiales: a igual radio, el InP (masas efectivas más ligeras: \(m_e^*=0.08\)) se confina más. Para \(R=2\) nm en CdSe, el confinamiento suma el 54 % de \(E_g\) y el término de Coulomb resta el 7 %.</li>
<li>El color mostrado es el correspondiente a la longitud de onda de la fórmula; el modelo real de un punto de CdSe de ese radio absorbe a longitudes de onda mayores (véase el texto).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un electrón está confinado en una caja de 0.4 nm. Halle los tres primeros niveles y la longitud de onda de los fotones emitidos en las transiciones \(2\to1\) y \(3\to2\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>\(E_1\).</b> \(E_1=\pi^2\hbar^2/(2m_eL^2)=0.376030\ \text{eV}\times(1/0.4)^2=2.350\) eV.</li>
<li><b>Niveles.</b> \(E_2=4E_1=9.401\) eV; \(E_3=9E_1=21.15\) eV.</li>
<li><b>Fotones.</b> \(2\to1\): \(3E_1=7.051\) eV, \(\lambda=1239.84/7.051=175.85\) nm. \(3\to2\): \(5E_1=11.75\) eV, \(\lambda=105.5\) nm.</li>
<li><b>Resultado.</b> <span class="ans">2.350, 9.401, 21.15 eV; 175.85 nm y 105.5 nm (ultravioleta).</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Halle la probabilidad de encontrar la partícula en el primer tercio de la caja, \([0,L/3]\), para \(n=1,2,3\); y en la mitad central \([L/4,3L/4]\) para \(n=1\), y compare con la clásica.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Fórmula.</b> \(P=(b-a)-[\operatorname{sen}2n\pi b-\operatorname{sen}2n\pi a]/(2n\pi)\) con \(a,b\) en unidades de \(L\).</li>
<li><b>Primer tercio.</b> \(n=1\): \(\tfrac13-\operatorname{sen}(2\pi/3)/2\pi=0.3333-0.1378=0.1955\). \(n=2\): \(\tfrac13-\operatorname{sen}(4\pi/3)/4\pi=0.3333+0.0689=0.4022\). \(n=3\): \(\tfrac13-\operatorname{sen}2\pi/6\pi=0.3333\).</li>
<li><b>Mitad central, \(n=1\).</b> \(\tfrac12-[\operatorname{sen}(3\pi/2)-\operatorname{sen}(\pi/2)]/2\pi=\tfrac12+1/\pi=0.8183\); la clásica es 0.5.</li>
<li><b>Resultado.</b> <span class="ans">0.1955, 0.4022, 0.3333 (clásica: 0.3333); 0.8183 frente a 0.5.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Calcule \(\Delta x\), \(\Delta p\) y el producto \(\Delta x\Delta p\) (en unidades de \(\hbar/2\)) para \(n=1\) y \(n=10\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Fórmulas.</b> \(\langle x\rangle=L/2\); \(\langle x^2\rangle=L^2(\tfrac13-\tfrac1{2n^2\pi^2})\); \(\Delta p=n\pi\hbar/L\).</li>
<li><b>\(n=1\).</b> \(\Delta x=L\sqrt{1/12-1/(2\pi^2)}=0.1808\,L\); \(\Delta p=\pi\hbar/L\); \(\Delta x\Delta p=0.568\,\hbar=1.1357\,\hbar/2\).</li>
<li><b>\(n=10\).</b> \(\Delta x=L\sqrt{1/12-1/(200\pi^2)}=0.2878\,L\); \(\Delta p=10\pi\hbar/L\); producto \(=\sqrt{100\pi^2/3-2}\,\hbar/2=18.083\,\hbar/2\).</li>
<li><b>Resultado.</b> <span class="ans">0.1808L y 0.2878L; \(\pi\hbar/L\) y \(10\pi\hbar/L\); 1.1357 y 18.08 en unidades de \(\hbar/2\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Electrón en una caja de 1 nm en la superposición \(\tfrac1{\sqrt2}(\psi_1+\psi_2)\). Halle la frecuencia y el periodo de la oscilación de la densidad, la energía media y el tiempo de revival.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Frecuencia.</b> \(E_2-E_1=3(0.376030)=1.1281\) eV \(=1.8074\times10^{-19}\) J; \(\nu=\Delta E/h=2.728\times10^{14}\) Hz (\(\lambda=1099\) nm).</li>
<li><b>Periodo.</b> \(T=h/\Delta E=3.666\) fs.</li>
<li><b>Energía media.</b> \(\langle E\rangle=\tfrac12E_1+\tfrac12(4E_1)=2.5E_1=0.940\) eV.</li>
<li><b>Revival.</b> \(T_\text{rev}=4m_eL^2/(\pi\hbar)=4(9.109\times10^{-31})(10^{-18})/(\pi\times1.0546\times10^{-34})=1.0998\times10^{-14}\) s \(=10.998\) fs.</li>
<li><b>Resultado.</b> <span class="ans">\(2.728\times10^{14}\) Hz; 3.666 fs; 0.940 eV; 11.0 fs.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Con la fórmula de Brus y los parámetros del CdSe, halle la energía de la transición y la longitud de onda para radios de 1.5, 2 y 3 nm; y descompóngala (confinamiento y Coulomb) para \(R=2\) nm.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Confinamiento.</b> \(\pi^2\hbar^2/(2m_eR^2)=0.37603\,\text{eV}\,(1\,\text{nm}/R)^2\); con \((1/0.13+1/0.45)=9.9145\): \(R=2\) nm: \(0.09401\times9.9145=0.9320\) eV.</li>
<li><b>Coulomb.</b> \(1.786\times1.43996\ \text{eV·nm}/(10.6\times2\ \text{nm})=0.1213\) eV.</li>
<li><b>Energías.</b> \(R=2\) nm: \(1.74+0.9320-0.1213=2.551\) eV, \(\lambda=486.1\) nm. \(R=1.5\) nm: 3.235 eV, 383 nm. \(R=3\) nm: 2.073 eV, 598 nm.</li>
<li><b>Resultado.</b> <span class="ans">2.551 eV (486 nm) con +0.932 eV y −0.121 eV; 3.235 eV (383 nm); 2.073 eV (598 nm).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Una partícula en una caja está en el estado \(\psi=0.8\psi_1+0.6\psi_2\). Compruebe que está normalizada, halle las probabilidades de medir \(E_1\) y \(E_2\), la energía media y la incertidumbre en la energía (con \(L=1\) nm, electrón).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Normalización.</b> \(\int|\psi|^2=0.64+0.36+2(0.48)\int\psi_1\psi_2=1+0=1\) (por la ortogonalidad).</li>
<li><b>Probabilidades.</b> \(|c_1|^2=0.64\), \(|c_2|^2=0.36\).</li>
<li><b>Energía media.</b> \(\langle E\rangle=0.64E_1+0.36(4E_1)=2.08E_1=0.7822\) eV.</li>
<li><b>Incertidumbre.</b> \(\langle E^2\rangle=0.64E_1^2+0.36(16E_1^2)=6.40E_1^2\); \(\Delta E=\sqrt{6.40-4.3264}\,E_1=1.440\,E_1=0.5415\) eV.</li>
<li><b>Resultado.</b> <span class="ans">0.64 y 0.36; 0.7821 eV; \(\Delta E=0.5415\) eV.</span></li>
</ol></details></li>
</ol>
