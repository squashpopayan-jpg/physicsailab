<template class="chapter-src" data-id="cuerpo" data-num="7" data-title="Cuerpo negro y el cuanto de Planck" data-part="Parte II · Cuantos de luz y de materia" data-short="La radiación térmica, las leyes de Stefan–Boltzmann y de Wien, la catástrofe ultravioleta, la hipótesis de Planck, el gas de fotones, el color de las estrellas y el fondo cósmico de microondas">
<p class="lead">La física cuántica nace de un problema aparentemente técnico: calcular cuánta luz emite un horno caliente. La mecánica estadística y el electromagnetismo clásicos daban una respuesta que fallaba de manera absurda, y para corregirla Planck introdujo en 1900 una hipótesis ajena a toda la física anterior: la energía se intercambia en paquetes. En este capítulo se deduce paso a paso la ley de Planck y todo lo que de ella se sigue (la ley de Stefan–Boltzmann, la de Wien, las propiedades del gas de fotones) y se aplica a dos casos que cubren casi veinte órdenes de magnitud en temperatura: la luz de las estrellas y la radiación que quedó del universo primitivo, el espectro más perfecto de un cuerpo negro conocido.</p>

<section>
<h2>Radiación térmica y cuerpo negro</h2>
<p>Todo cuerpo a temperatura \(T\gt0\) emite radiación electromagnética. Kirchhoff mostró en 1859 que, en equilibrio térmico, la razón entre la emisión y la absorción de un cuerpo es la misma función universal de \(\nu\) y \(T\), de modo que un absorbente perfecto es también el mejor emisor: un <span class="term">cuerpo negro</span>. Se realiza con una cavidad cerrada de paredes opacas con un pequeño orificio: la radiación que sale por él es una muestra de la que está en equilibrio con las paredes, y su espectro depende únicamente de \(T\). Antes de 1900 se conocían dos leyes exactas:</p>
<div class="eq key" data-name="Leyes de Stefan–Boltzmann y de desplazamiento de Wien">\[M=\sigma T^4\ \ (\text{Stefan, 1879; Boltzmann, 1884}),\qquad \lambda_\text{máx}T=b=2.8978\times10^{-3}\ \text{m·K}\ \ (\text{Wien, 1893}).\]</div>
<p>La primera sale de la termodinámica: la radiación ejerce una presión \(p=u/3\) (u es su densidad de energía) y, aplicando el primer y el segundo principio a un ciclo de Carnot con radiación, \(u\propto T^4\). La segunda es una consecuencia de la invariancia del espectro bajo una compresión adiabática de la cavidad (el efecto Doppler en los espejos móviles), que obliga a que \(u_\nu=\nu^3\,F(\nu/T)\) con \(F\) una función universal. Lo que ni la termodinámica ni la teoría electromagnética daban era la función \(F\).</p>
</section>

<section>
<h2>La catástrofe ultravioleta y la hipótesis de Planck</h2>
<p><b>Contar los modos.</b> En una cavidad cúbica de lado \(\ell\), el campo se descompone en ondas estacionarias con \(\mathbf k=(\pi/\ell)(n_x,n_y,n_z)\), \(n_i\ge1\) (y dos polarizaciones). El número de modos con frecuencia entre \(\nu\) y \(\nu+\dd\nu\) es un octavo del volumen de la capa esférica en el espacio \(n\) (\(4\pi n^2\dd n\), con \(n=2\ell\nu/c\)) por dos polarizaciones:</p>
<div class="eq">\[\dd N=2\cdot\frac18\cdot4\pi n^2\dd n=\frac{8\pi\nu^2V}{c^3}\,\dd\nu,\qquad V=\ell^3.\]</div>
<p><b>La energía por modo clásica.</b> Por la equipartición, cada modo (un oscilador armónico, con dos términos cuadráticos en la energía) tiene energía media \(k_BT\). La densidad de energía espectral sería \(u_\nu=8\pi\nu^2k_BT/c^3\) (<span class="term">Rayleigh–Jeans</span>), que concuerda con el experimento solo para frecuencias bajas y crece como \(\nu^2\): la energía total diverge, la «catástrofe ultravioleta». En el otro extremo, Wien propuso en 1896 la forma empírica \(u_\nu\propto\nu^3e^{-\beta\nu/T}\), que ajusta los datos en frecuencias altas y falla en bajas, como Rubens y Kurlbaum mostraron en el infrarrojo lejano en 1900.</p>
<p><b>La hipótesis de Planck.</b> El 19 de octubre de 1900 Planck presentó una fórmula que interpolaba entre las dos regiones y ajustaba todas las medidas; dos meses después la justificó suponiendo que los osciladores de las paredes (de frecuencia \(\nu\)) solo emiten y absorben energía en múltiplos enteros de \(h\nu\). Si el modo de frecuencia \(\nu\) tiene la energía \(E_n=nh\nu\) con probabilidad proporcional a \(e^{-nh\nu/k_BT}\), la energía media es</p>
<div class="eq key" data-name="Energía media de un modo y ley de Planck">\[\bar E(\nu,T)=\frac{\sum_nnh\nu\,e^{-nh\nu/k_BT}}{\sum_ne^{-nh\nu/k_BT}}=\frac{h\nu}{e^{h\nu/k_BT}-1},\qquad u_\nu=\frac{8\pi\nu^2}{c^3}\bar E=\frac{8\pi h\nu^3}{c^3}\frac1{e^{h\nu/k_BT}-1}.\]</div>
<p>Se usan \(\sum_nq^n=1/(1-q)\) y \(\sum_nnq^n=q/(1-q)^2\) con \(q=e^{-h\nu/k_BT}\). Para \(h\nu\ll k_BT\), \(\bar E\to k_BT\) (la equipartición); para \(h\nu\gg k_BT\), \(\bar E\to h\nu\,e^{-h\nu/k_BT}\to0\): los modos de alta frecuencia están <em>congelados</em>, pues activarlos cuesta un cuanto entero que casi nunca está disponible a esa temperatura. En \(h\nu=k_BT\), \(\bar E=0.5820\,k_BT\). Con los datos de Rubens y Kurlbaum, Planck obtuvo en 1901 \(h=6.55\times10^{-34}\) J·s y \(k_B=1.346\times10^{-23}\) J/K (valores actuales: \(6.62607\times10^{-34}\) y \(1.380649\times10^{-23}\)); de \(k_B\) y la constante de los gases, \(N_A=R/k_B=6.18\times10^{23}\) mol\(^{-1}\) (hoy \(6.022\times10^{23}\)), la mejor determinación de su tiempo, y la carga del electrón, antes de que se la midiera con precisión.</p>
<div class="sim" data-sim="planck" data-title="Espectro de Planck, ley de Wien y catástrofe ultravioleta"></div>
<div class="sim-guide"><ul>
<li>Con \(T=5772\) K el máximo está en 502 nm y el 46.5 % de la potencia es luz visible. Con los ejes logarítmicos activados, a 400 nm la fórmula clásica supera a la de Planck por un factor 81, mientras que a 4 µm el cociente es solo 1.39.</li>
<li>Con 2000 K (un filamento): máximo en 1.45 µm y solo el 1.7 % de la potencia es visible; por eso una bombilla incandescente es ineficaz. La curva de Wien (puntos) coincide con Planck a longitudes de onda cortas; la de Rayleigh–Jeans, a largas: Planck interpola las dos.</li>
<li>La ley de Planck contiene la de Wien (\(\lambda_\text{máx}T=hc/(4.9651\,k_B)\)) y la de Stefan–Boltzmann (\(\sigma=2\pi^5k_B^4/15h^3c^2\)) sin parámetros libres: dos constantes medidas en el laboratorio térmico quedan expresadas por \(h\), \(k_B\) y \(c\).</li>
</ul></div>
</section>

<section>
<h2>El gas de fotones</h2>
<p>El espectro de Planck se puede escribir con \(x=h\nu/k_BT\), y las integrales que aparecen son \(\int_0^\infty x^2/(e^x-1)\,\dd x=2\zeta(3)=2.4041\) y \(\int_0^\infty x^3/(e^x-1)\,\dd x=\pi^4/15=6.4939\). Con ellas se obtienen las propiedades termodinámicas de la radiación en equilibrio, un <span class="term">gas de fotones</span>:</p>
<div class="eq key" data-name="Propiedades del gas de fotones">\[n=16\pi\zeta(3)\Bigl(\frac{k_BT}{hc}\Bigr)^3,\quad u=aT^4,\ \ a=\frac{4\sigma}c=\frac{8\pi^5k_B^4}{15h^3c^3}=7.5657\times10^{-16}\ \frac{\text{J}}{\text{m}^3\text{K}^4},\quad p=\frac u3,\quad s=\frac43aT^3,\quad \bar\varepsilon=\frac uN=2.701\,k_BT.\]</div>
<p>La radiación emitida por unidad de área (emitancia) es \(M=\tfrac14cu=\sigma T^4\): un cuarto, porque la mitad de los fotones va hacia fuera y su componente normal media a la superficie es \(c/2\). Para un cuerpo real, gris, con emisividad \(\varepsilon\lt1\), \(M=\varepsilon\sigma T^4\); la potencia neta que intercambia con su entorno a \(T_0\) es \(P=\varepsilon\sigma A(T^4-T_0^4)\). El <span class="term">máximo del espectro</span> depende de la variable que se grafique: el máximo de \(B_\nu\) está en \(\nu_\text{máx}=2.8214\,k_BT/h=58.79\ \text{GHz/K}\times T\) y el de \(B_\lambda\) en \(\lambda_\text{máx}=b/T\), y no son equivalentes (\(c/\nu_\text{máx}\ne\lambda_\text{máx}\)); en general el máximo no es el valor «típico» de la radiación.</p>
<div class="box ex"><h4>Una persona, una estrella y la Tierra</h4>
<p><strong>(a) Un cuerpo humano.</strong> Piel a 34 °C (307.15 K), \(\varepsilon=0.97\), \(A=1.8\) m², habitación a 20 °C (293.15 K): emitida \(\varepsilon\sigma AT^4=881.2\) W, absorbida del entorno \(\varepsilon\sigma AT_0^4=731.2\) W, neta \(150.0\) W. El máximo está en \(b/T=9.43\) µm, en el infrarrojo térmico (de ahí las cámaras de 8–14 µm). <strong>(b) Sirio A</strong> (\(T=9940\) K, \(R=1.711\,R_\odot\)): \(\lambda_\text{máx}=291.5\) nm (ultravioleta; la estrella se ve blanco-azulada porque el visible está en la cola de Rayleigh–Jeans); \(L/L_\odot=R^2(T/5772)^4=25.7\). <strong>(c) Temperatura de equilibrio de la Tierra.</strong> Potencia absorbida \(S(1-A)\pi R^2\) y emitida \(4\pi R^2\sigma T^4\), con \(S=1361\) W/m² y albedo \(A=0.306\): \(T=[S(1-A)/4\sigma]^{1/4}=254.0\) K \((-19\,^\circ\text{C})\); la temperatura media real es 288 K, la diferencia (34 K) es el efecto invernadero.</p></div>
<h3>Estrellas</h3>
<p>El color de una estrella se lee en su espectro. A partir del espectro de Planck y de las funciones de igualación del color del ojo (CIE 1931) se obtiene la cromaticidad: 3000 K, naranja; 5772 K (el Sol), blanco-amarillento; 10 000 K, blanco-azulado. Combinado con \(L=4\pi R^2\sigma T^4\), permite situar las estrellas en el diagrama de Hertzsprung–Russell y deducir sus radios desde la distancia sin necesitar una medida directa: Betelgeuse (\(T\approx3600\) K, \(L\sim10^5L_\odot\)) tiene un radio \(\sim760\,R_\odot\) porque es fría y brillante.</p>
<div class="sim" data-sim="estrellas" data-title="Estrellas como cuerpos negros: color, luminosidad y diagrama H–R"></div>
<div class="sim-guide"><ul>
<li>Con \(T=5772\) K y \(R=1\,R_\odot\): \(L=3.828\times10^{26}\) W, \(\lambda_\text{máx}=502\) nm (2.47 eV). El color es casi blanco con un toque amarillo. Con \(T=3000\) K el máximo pasa a 966 nm (infrarrojo) y el color es naranja; con 15 000 K, a 193 nm (UV) y la estrella es blanco-azulada.</li>
<li>Las líneas punteadas del diagrama son radios constantes (\(L\propto R^2T^4\)): con \(R=100\,R_\odot\) y \(T=3600\) K, \(L=1.5\times10^3L_\odot\). Betelgeuse (764 \(R_\odot\), 3600 K) está en \(8.8\times10^4L_\odot\); Próxima Centauri (0.154 \(R_\odot\), 3042 K) en \(1.8\times10^{-3}L_\odot\).</li>
<li>Una estrella de la misma temperatura que el Sol pero con \(R=10\,R_\odot\) es 100 veces más luminosa. Observe cómo la fracción de la emitancia en el visible baja rápidamente por debajo de 3500 K y por encima de 15 000 K.</li>
</ul></div>
</section>

<section>
<h2>El fondo cósmico de microondas</h2>
<p>Penzias y Wilson (1965) detectaron en Holmdel un ruido de microondas isótropo e independiente de la estación, que correspondía a una temperatura de antena de unos 3.5 K: es la radiación fósil del universo primitivo, emitida cuando el cosmos se enfrió lo bastante para que los átomos se formaran y la materia se hiciera transparente, unos 380 000 años después del Big Bang, y enfriada por la expansión (capítulo 28). El instrumento FIRAS del satélite COBE (Mather et al., 1990–1994) midió su espectro entre 60 y 600 GHz y encontró un cuerpo negro de \(T_0=2.7255\pm0.0006\) K (Fixsen, 2009) con desviaciones inferiores a unas 50 partes por millón del máximo: es el espectro de cuerpo negro mejor medido de la naturaleza. Hoy hay \(n=16\pi\zeta(3)(k_BT/hc)^3=410.7\) fotones por cm\(^3\) y una densidad de energía \(aT^4=0.2606\) eV/cm\(^3\) (\(4.17\times10^{-14}\) J/m\(^3\)), con \(6.34\times10^{-4}\) eV de energía media por fotón. El espectro tiene el máximo de \(B_\nu\) en 160.23 GHz (\(\lambda=1.871\) mm) y el de \(B_\lambda\) en 1.063 mm. Además, la Tierra se mueve a \(369.8\) km/s respecto de la radiación, lo que produce el <em>dipolo</em> \(T_0\beta=3.362\) mK del capítulo 5.</p>
<div class="sim" data-sim="cmb" data-title="Espectro de cuerpo negro del fondo cósmico y energía media por modo"></div>
<div class="sim-guide"><ul>
<li>Con \(T=2.7255\) K: \(\nu_\text{máx}=160.23\) GHz, \(\lambda_\text{máx}=1.063\) mm, 410.7 fotones/cm\(^3\), 0.2606 eV/cm\(^3\) y una presión de radiación de \(1.39\times10^{-14}\) Pa. El dipolo vale 3.362 mK.</li>
<li>Si el universo fuera dos veces más caliente (5.45 K) el máximo pasaría a 320.5 GHz y habría 8 veces más fotones y 16 veces más energía (\(n\propto T^3\), \(u\propto T^4\)). La curva de Rayleigh–Jeans (puntos) se separa de Planck por encima de unos 30 GHz.</li>
<li>La gráfica de la derecha es la clave de la teoría cuántica: la energía media por modo, \(\bar E/k_BT=x/(e^x-1)\), vale 1 para \(x\ll1\) (equipartición clásica) y cae a cero para \(x\gg1\): sin esa caída la energía de la radiación sería infinita.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Sirio A tiene \(T=9940\) K y \(R=1.711\,R_\odot\) (\(R_\odot=6.957\times10^8\) m, \(T_\odot=5772\) K). Halle su longitud de onda de máxima emisión, la energía del fotón en ese máximo y su luminosidad en unidades solares.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Planteamiento.</b> Wien: \(\lambda_\text{máx}=b/T\); \(L\propto R^2T^4\).</li>
<li><b>\(\lambda_\text{máx}\).</b> \(2.8978\times10^{-3}/9940=2.9153\times10^{-7}\) m \(=291.5\) nm.</li>
<li><b>Fotón.</b> \(hc/\lambda=1239.84/291.53=4.253\) eV.</li>
<li><b>Luminosidad.</b> \(L/L_\odot=(1.711)^2(9940/5772)^4=2.9275\times8.795=25.7\).</li>
<li><b>Resultado.</b> <span class="ans">291.5 nm (ultravioleta); 4.25 eV; 25.7 \(L_\odot\).</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Calcule la potencia neta que radia una persona (\(A=1.8\) m², \(\varepsilon=0.97\), piel a 34 °C) en una habitación a 20 °C y su longitud de onda de máxima emisión.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Planteamiento.</b> \(P=\varepsilon\sigma A(T^4-T_0^4)\); \(T=307.15\) K, \(T_0=293.15\) K.</li>
<li><b>Cuartas potencias.</b> \(T^4=8.9002\times10^9\) K\(^4\); \(T_0^4=7.3852\times10^9\) K\(^4\); diferencia \(1.5151\times10^9\).</li>
<li><b>Potencia.</b> \(P=0.97(5.6704\times10^{-8})(1.8)(1.5151\times10^9)=150.0\) W.</li>
<li><b>Máximo.</b> \(b/T=2.8978\times10^{-3}/307.15=9.434\) µm.</li>
<li><b>Resultado.</b> <span class="ans">150 W; 9.43 µm.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Para el fondo de microondas (\(T=2.7255\) K) halle: la frecuencia del máximo de \(B_\nu\) y la longitud de onda del máximo de \(B_\lambda\), la densidad numérica de fotones, la densidad de energía y la energía media por fotón.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>\(\nu_\text{máx}\).</b> \(2.821439\,k_BT/h=58.789\ \text{GHz/K}\times2.7255\) K \(=160.23\) GHz (\(\lambda=c/\nu=1.871\) mm).</li>
<li><b>\(\lambda_\text{máx}\).</b> \(b/T=2.8978\times10^{-3}/2.7255=1.0632\) mm (no coincide con \(c/\nu_\text{máx}\): son máximos de funciones distintas).</li>
<li><b>Fotones.</b> \(n=16\pi\zeta(3)(k_BT/hc)^3\) con \(k_BT/hc=2.7255\times1.380649\times10^{-23}/(1.98645\times10^{-25})=189.43\) m\(^{-1}\): \(n=60.42(189.43)^3=4.107\times10^{8}\) m\(^{-3}\) \(=410.7\) cm\(^{-3}\).</li>
<li><b>Energía.</b> \(u=aT^4=7.5657\times10^{-16}\times55.18=4.175\times10^{-14}\) J/m\(^3\) \(=0.2606\) eV/cm\(^3\); media \(u/n=1.016\times10^{-22}\) J \(=6.344\times10^{-4}\) eV (\(=2.701k_BT\)).</li>
<li><b>Resultado.</b> <span class="ans">160.23 GHz; 1.063 mm; 410.7 cm\(^{-3}\); 0.2606 eV/cm\(^3\); 6.34×10\(^{-4}\) eV.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Estime la temperatura de equilibrio de la Tierra sin atmósfera, con \(S=1361\) W/m² y albedo 0.306, e interprete la diferencia con los 288 K medios.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Balance.</b> Absorbida: \(S(1-A)\pi R^2\); emitida: \(4\pi R^2\sigma T^4\) ⇒ \(T^4=S(1-A)/(4\sigma)\).</li>
<li><b>Número.</b> \(1361\times0.694/(4\times5.6704\times10^{-8})=4.1643\times10^9\) K\(^4\) \(\Rightarrow T=254.0\) K.</li>
<li><b>Interpretación.</b> La diferencia con 288 K, 34 K, la causa el efecto invernadero: la atmósfera absorbe parte de la radiación infrarroja (máximo en 11 µm a 254 K) que emite la superficie y la devuelve.</li>
<li><b>Resultado.</b> <span class="ans">254.0 K (−19 °C); el efecto invernadero añade unos 34 K.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>(a) Calcule la energía media de un modo con \(h\nu=k_BT\) y compárela con la equipartición. (b) Halle el número de modos de una cavidad de 1 litro entre 500 y 600 nm. (c) Compruebe que \(\int_0^\infty x^3/(e^x-1)\,\dd x=\pi^4/15\) con la serie \(6\sum_{k\ge1}k^{-4}\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>(a)</b> \(\bar E=h\nu/(e^{h\nu/k_BT}-1)=k_BT/(e-1)=0.5820\,k_BT\): el 58 % del valor clásico.</li>
<li><b>(b)</b> Con \(N=(8\pi V/3c^3)(\nu_2^3-\nu_1^3)\), \(\nu_1=c/600\text{ nm}=4.9965\times10^{14}\) Hz, \(\nu_2=5.9958\times10^{14}\) Hz y \(V=10^{-3}\) m\(^3\): \(N=3.109\times10^{-28}\times9.081\times10^{43}=2.82\times10^{16}\) modos.</li>
<li><b>(c)</b> \(1/(e^x-1)=\sum_{k\ge1}e^{-kx}\), \(\int_0^\infty x^3e^{-kx}\dd x=6/k^4\), de modo que la integral es \(6\zeta(4)=6\pi^4/90=\pi^4/15=6.4939\).</li>
<li><b>Resultado.</b> <span class="ans">0.5820 kT; \(2.8\times10^{16}\) modos; \(6.4939\).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>(a) La presión de radiación en el centro del Sol (\(T_c=1.57\times10^7\) K) y su cociente con la presión total (\(2.5\times10^{16}\) Pa). (b) La fuerza que ejerce la luz solar (\(S=1361\) W/m²) sobre una vela solar absorbente de 1 km² y sobre una reflectante.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>(a)</b> \(p=aT^4/3=7.5657\times10^{-16}(1.57\times10^7)^4/3=1.532\times10^{13}\) Pa; con respecto a \(2.5\times10^{16}\) Pa es \(6\times10^{-4}\): en el Sol domina la presión del gas.</li>
<li><b>(b) Absorbente.</b> \(p=S/c=1361/299\,792\,458=4.540\) µPa; fuerza sobre \(10^6\) m\(^2\): 4.54 N.</li>
<li><b>(b) Reflectante.</b> \(p=2S/c=9.080\) µPa; fuerza \(9.08\) N.</li>
<li><b>Resultado.</b> <span class="ans">\(1.53\times10^{13}\) Pa (0.06 % de la total); 4.54 N y 9.08 N.</span></li>
</ol></details></li>
</ol>
