<template class="chapter-src" data-id="espin" data-num="15" data-title="Momento angular, espín y estructura fina" data-part="Parte III · Mecánica ondulatoria" data-short="El momento magnético orbital y el efecto Zeeman, el experimento de Stern y Gerlach, el espín del electrón, el efecto Zeeman anómalo y Paschen–Back, la estructura fina e hiperfina del hidrógeno (la línea de 21 cm) y la resonancia magnética">
<p class="lead">El electrón no es solo una carga que se mueve: tiene un momento angular propio, el espín, y un momento magnético asociado. Esta propiedad, sin análogo clásico, se descubrió por la manera en que los átomos se comportan en un campo magnético, y explica el detalle fino de los espectros, la estructura del sistema periódico (capítulo 16) y la resonancia magnética que se usa en la medicina. Este capítulo parte del momento magnético orbital y el efecto Zeeman normal, llega a la medida de Stern y Gerlach que mostró la cuantización espacial, construye el espín ½ y sus consecuencias (efecto Zeeman anómalo, estructura fina e hiperfina, la línea de 21 cm del hidrógeno) y termina con la resonancia magnética de núcleos y electrones.</p>

<section>
<h2>Momento magnético orbital y efecto Zeeman normal</h2>
<p>Un electrón con momento angular orbital \(\mathbf L\) es una pequeña espira de corriente con un momento magnético \(\boldsymbol\mu_l=-\dfrac{e}{2m_e}\mathbf L=-\dfrac{\mu_B}\hbar\mathbf L\), donde \(\mu_B=e\hbar/2m_e=9.2740\times10^{-24}\) J/T \(=5.7884\times10^{-5}\) eV/T es el <span class="term">magnetón de Bohr</span>. En un campo \(\mathbf B=B\hat z\) la energía de interacción es \(-\boldsymbol\mu\cdot\mathbf B=\mu_BBm_l\): un nivel de momento angular \(l\) se desdobla en \(2l+1\) subniveles equiespaciados, con separación \(\mu_BB\) (13.996 GHz por tesla). Una línea espectral entre estados de singlete (espín total nulo) se desdobla en un triplete con componentes \(\nu_0\) y \(\nu_0\pm\mu_BB/h\) (<span class="term">efecto Zeeman normal</span>; Zeeman, 1896, Nobel 1902; Lorentz lo explicó clásicamente). Para la línea roja del cadmio (643.8 nm) en 1 T: \(\Delta\nu=13.996\) GHz, \(\Delta\lambda=\lambda^2\Delta\nu/c=0.01935\) nm: pequeño pero observable con un espectrómetro de buena resolución.</p>
<p>Pero la mayoría de las líneas se desdobla en más componentes y de una manera distinta (efecto Zeeman <em>anómalo</em>), y eso no lo explicaba ninguna teoría con solo el momento angular orbital.</p>
</section>

<section>
<h2>El experimento de Stern y Gerlach y el espín</h2>
<p>En 1922, Stern y Gerlach hicieron pasar un haz de átomos de plata a través de un campo magnético no uniforme. Un momento magnético \(\boldsymbol\mu\) en un gradiente \(\partial B_z/\partial z\) sufre una fuerza \(F_z=\mu_z\,\partial B_z/\partial z\), y se desvía una cantidad proporcional a \(\mu_z\). La teoría clásica, con momentos orientados al azar (\(\mu_z\) continuo entre \(-\mu\) y \(+\mu\)), predice una mancha continua. La cuántica, con \(\mu_z\) cuantizado, un conjunto de líneas separadas. Observaron <b>dos</b> líneas, y no tres ni una: el átomo de plata tiene un solo electrón de valencia en un estado \(s\) (\(l=0\), sin momento orbital), así que el momento magnético que se observaba no podía ser orbital, ni tenía un número impar de orientaciones. Uhlenbeck y Goudsmit (1925) propusieron que el electrón posee un momento angular intrínseco, el <span class="term">espín</span>, con número cuántico \(s=\tfrac12\) y dos orientaciones \(m_s=\pm\tfrac12\):</p>
<div class="eq key" data-name="Espín del electrón">\[S^2=s(s+1)\hbar^2=\tfrac34\hbar^2,\qquad S_z=m_s\hbar=\pm\tfrac12\hbar,\qquad \boldsymbol\mu_s=-g_e\frac{\mu_B}\hbar\,\mathbf S,\qquad g_e=2.0023193\ (\text{Dirac: }g=2).\]</div>
<p>El factor giromagnético \(g\approx2\) es el doble del que daría la relación clásica entre momento magnético y momento angular: lo explica la ecuación de Dirac (capítulo 26), y la pequeña corrección \(g-2=2.3\times10^{-3}\) (\(a_e=(g-2)/2=1.159652\times10^{-3}\)) la calcula la electrodinámica cuántica y concuerda con la medida hasta una parte en \(10^{12}\): la predicción más precisa de la física. Pauli añadió en 1925 el principio de exclusión: dos electrones no pueden tener los mismos cuatro números cuánticos \((n,l,m_l,m_s)\).</p>
<div class="box ex"><h4>La desviación en el experimento original</h4>
<p><strong>Datos.</strong> Átomos de Ag (\(m=107.868\) u) con \(\mu_z=\pm\mu_B\), horno a 1200 K; gradiente 1000 T/m, imán de 3.5 cm y 1 cm hasta la pantalla. <strong>Procedimiento.</strong> (1) Velocidad media del haz: \(\bar v=\sqrt{8k_BT/\pi m}=485.3\) m/s. (2) Fuerza \(F=\mu_B\,\partial_zB=9.274\times10^{-21}\) N; aceleración \(a=F/m=5.178\times10^4\) m/s\(^2\). (3) Desviación a la salida más la deriva libre: \(z=a\,L(L/2+D)/\bar v^2=5.178\times10^4(0.035)(0.0275)/(485.3)^2=0.2116\) mm. <strong>Resultado.</strong> Las dos líneas se separan \(2z=0.423\) mm, del orden de lo que midieron (0.2 mm entre cada línea y la posición sin campo), pero claramente resolubles: una observación notable en 1922, con aparatos de pocos centímetros.</p></div>
<div class="sim" data-sim="sterngerlach" data-title="Experimento de Stern y Gerlach: dos líneas cuánticas frente a una mancha clásica"></div>
<div class="sim-guide"><ul>
<li>Con el modelo cuántico, 1200 K y 1000 T/m: \(\bar v=485.3\) m/s, \(a=5.178\times10^4\) m/s\(^2\) y dos picos en \(\pm0.2116\) mm (la forma de cada pico refleja la dispersión de velocidades del horno). Con el modelo clásico, una banda continua entre \(\pm0.2116\) mm.</li>
<li>El modelo «espín 1» (hipotético) muestra tres líneas en \(-z\), 0 y \(+z\): el número de líneas es \(2s+1\), de donde se obtiene \(s\). Con los átomos de Ag, 2 líneas: \(s=\tfrac12\).</li>
<li>Sube la temperatura del horno: la desviación disminuye como \(1/\bar v^2\propto1/T\) y las líneas se juntan; sube el gradiente: la separación crece proporcionalmente.</li>
</ul></div>
</section>

<section>
<h2>Espín–órbita: efecto Zeeman anómalo y estructura fina</h2>
<p>El electrón con momento orbital \(l\gt0\) siente, en su sistema de reposo, el campo magnético que genera el movimiento del núcleo, que se acopla a su espín: la interacción <span class="term">espín–órbita</span> \(H_{so}=A\,\mathbf L\cdot\mathbf S/\hbar^2\). Con ella, \(L\) y \(S\) no se conservan por separado, sino el momento angular total \(\mathbf J=\mathbf L+\mathbf S\), con \(J=|l-\tfrac12|,\,l+\tfrac12\), y los niveles se separan en un <span class="term">doblete</span> de <em>estructura fina</em>. Para un estado \(p\) (\(l=1\)): \(J=\tfrac32\) tiene energía \(+A/2\) y \(J=\tfrac12\) tiene \(-A\), con separación \(\Delta E_{fs}=3A/2\). En el hidrógeno, con la ecuación de Dirac, las energías son</p>
<div class="eq key" data-name="Estructura fina del hidrógeno (Dirac)">\[E_{nj}=-\frac{Ry}{n^2}\Bigl[1+\frac{\alpha^2}{n^2}\Bigl(\frac n{j+\frac12}-\frac34\Bigr)\Bigr],\qquad E(2p_{3/2})-E(2p_{1/2})=\frac{\alpha^2Ry}{16}=4.528\times10^{-5}\ \text{eV}\ (10.95\ \text{GHz}).\]</div>
<p>La separación es de orden \(\alpha^2\sim10^{-5}\) de la energía de enlace, razón por la que se llama «fina»; el valor medido (10.969 GHz) difiere ligeramente porque hay correcciones de la electrodinámica cuántica. Los niveles \(2s_{1/2}\) y \(2p_{1/2}\), que la ecuación de Dirac predice degenerados, están separados 1057.845 MHz (4.37 µeV): es el <em>desplazamiento de Lamb</em>, medido por Lamb y Retherford en 1947 y explicado por la electrodinámica cuántica (el electrón interacciona con las fluctuaciones del vacío).</p>
<p>En un campo \(B\), el hamiltoniano es \(H=A\,\mathbf L\cdot\mathbf S/\hbar^2+\mu_BB(L_z+2S_z)/\hbar\), y su diagonalización exacta (por bloques de \(m_j\) fijo, de tamaño 1 o 2) da dos regímenes. Con \(\mu_BB\ll A\) (<span class="term">efecto Zeeman anómalo</span>), \(J\) es un buen número cuántico y los niveles se desdoblan según \(E=g_Jm_J\mu_BB\), con el <span class="term">factor de Landé</span> \(g_J=1+\dfrac{J(J+1)+S(S+1)-L(L+1)}{2J(J+1)}\): \(g=2\) para \(^2S_{1/2}\), \(\tfrac23\) para \(^2P_{1/2}\) y \(\tfrac43\) para \(^2P_{3/2}\). Con \(\mu_BB\gg A\) (<span class="term">Paschen–Back</span>), el campo domina y \(L\) y \(S\) se desacoplan: \(E\to\mu_BB(m_l+2m_s)\). La transición ocurre en \(B^*=A/\mu_B\): 24.6 T en el sodio (\(\Delta E_{fs}=2.132\) meV en el 3p) y solo 0.52 T en el hidrógeno 2p.</p>
<div class="box ex"><h4>Las líneas D del sodio en un campo débil</h4>
<p><strong>Datos.</strong> D\(_2\): \(3^2P_{3/2}\to3^2S_{1/2}\); D\(_1\): \(3^2P_{1/2}\to3^2S_{1/2}\); \(g(S_{1/2})=2\), \(g(P_{3/2})=\tfrac43\), \(g(P_{1/2})=\tfrac23\). <strong>Procedimiento.</strong> El desplazamiento de cada componente es \((g'm'-gm)\,\mu_BB\) con la regla \(\Delta m=0,\pm1\). (1) D\(_2\): seis componentes en \(\pm\tfrac13,\pm1,\pm\tfrac53\) (en unidades de \(\mu_BB\)). (2) D\(_1\): cuatro componentes en \(\pm\tfrac23,\pm\tfrac43\). (3) Con \(B=1\) T, \(\mu_BB=57.88\) µeV: las componentes extremas de D\(_2\) están en \(\pm96.5\) µeV (\(\pm23.3\) GHz) y las de D\(_1\) en \(\pm77.2\) µeV. <strong>Resultado.</strong> Una línea del triplete normal pasa a 6 o 4 componentes con distancias fraccionarias de \(\mu_BB\): la huella del espín. Aun sin entrar en el cálculo de las intensidades, el patrón es una prueba directa de que \(g_s\approx2\).</p></div>
<div class="sim" data-sim="zeeman" data-title="Estado p en un campo magnético: del Zeeman anómalo al régimen de Paschen–Back"></div>
<div class="sim-guide"><ul>
<li>Sodio 3p: a \(B\ll24.6\) T las pendientes son \(g_Jm_J\), es decir \(\pm2,\pm\tfrac23\) (con \(g=\tfrac43\)) y \(\pm\tfrac13\) (con \(g=\tfrac23\)), en unidades de \(\mu_B\); a \(B\gg24.6\) T, \(m_l+2m_s=\pm2,\pm1,0,0\). Con \(B=5\) T (\(\mu_BB=0.29\) meV frente a \(A=1.421\) meV) los niveles ya se curvan, alejándose de las rectas de campo débil.</li>
<li>Con hidrógeno el cruce ocurre en \(B^*=0.52\) T: ya con 5 T el átomo está en Paschen–Back. El nivel más alto (\(m_j=\tfrac32\), \(m_l=1\), \(m_s=\tfrac12\)) tiene siempre \(E=A/2+2\mu_BB\) exactamente.</li>
<li>En \(B=0\), los seis niveles se agrupan en el doblete de estructura fina (\(J=\tfrac32\) con cuatro estados y \(J=\tfrac12\) con dos), separados \(3A/2=2.132\) meV en el sodio.</li>
</ul></div>
</section>

<section>
<h2>Hiperfina y la línea de 21 cm</h2>
<p>El protón tiene también espín ½ y un momento magnético \(\mu_p=g_p\mu_N/2\) con \(g_p=5.5857\) y el magnetón nuclear \(\mu_N=e\hbar/2m_p\) (1836 veces menor que \(\mu_B\)). La interacción entre los momentos magnéticos del electrón y del protón (contacto de Fermi, en el estado 1s) desdobla el nivel fundamental en dos, con espines paralelos (triplete, \(F=1\)) y antiparalelos (singlete, \(F=0\)) y, con la masa reducida del par en el factor \((\mu/m_e)^3=0.99837\):</p>
<div class="eq key" data-name="Estructura hiperfina del hidrógeno (línea de 21 cm)">\[\Delta E_{hf}=\frac43\,g_p\,\frac{m_e}{m_p}\,\alpha^4m_ec^2\Bigl(\frac\mu{m_e}\Bigr)^3=5.87\ \mu\text{eV},\qquad \nu=1420.405\,751\,768\ \text{MHz},\quad\lambda=21.106\ \text{cm}.\]</div>
<p>El cálculo de Fermi (1418.84 MHz) difiere un 0.11 % del valor medido, que se conoce con 13 cifras gracias al máser de hidrógeno; la diferencia es la anomalía del electrón y correcciones nucleares y radiativas. Es una transición de dipolo magnético, de probabilidad muy pequeña (\(A=2.87\times10^{-15}\) s\(^{-1}\): vida media del estado \(F=1\) de unos \(1.1\times10^7\) años); a pesar de ello, el hidrógeno neutro del medio interestelar la emite y absorbe en tales cantidades que la línea de 21 cm (predicha por van de Hulst en 1944, observada por Ewen y Purcell en 1951) es la herramienta principal para cartografiar la estructura espiral de la Vía Láctea, medir la rotación de las galaxias (y evidenciar la materia oscura) y estudiar el universo antes de las primeras estrellas.</p>
</section>

<section>
<h2>Resonancia magnética</h2>
<p>Un espín ½ con razón giromagnética \(\gamma\) en un campo \(B\) tiene dos niveles separados \(\Delta E=\hbar\gamma B\); un campo de radiofrecuencia de frecuencia \(\nu=\gamma B/2\pi\) induce transiciones entre ellos (<span class="term">resonancia magnética</span>, Rabi, 1938; Bloch y Purcell, 1946). Para el protón \(\gamma_p/2\pi=42.5775\) MHz/T; para el electrón, \(\gamma_e/2\pi=g_e\mu_B/h=28.0250\) GHz/T. Los equipos de imagen por resonancia magnética (RM) trabajan a 1.5 T (63.87 MHz), 3 T (127.73 MHz) y 7 T (298.04 MHz), con ondas de radio; la resonancia de espín electrónico (ESR) con microondas de 9.5 GHz (banda X) en 0.339 T. La señal depende de la diferencia de población, que es mínima: a 3 T y 300 K, \(\Delta E=0.528\) µeV frente a \(k_BT=25.9\) meV, y la polarización es \(P=\tanh(\gamma\hbar B/2k_BT)=1.02\times10^{-5}\), diez partes por millón; aun así, el cuerpo tiene del orden de \(10^{27}\) protones de hidrógeno, y la señal es suficiente. En un campo no uniforme la frecuencia de resonancia depende de la posición, y eso, junto con la dependencia en el entorno químico, permite obtener imágenes (Lauterbur y Mansfield, Nobel 2003).</p>
<div class="sim" data-sim="rmn" data-title="Resonancia magnética: frecuencias de resonancia y polarización térmica"></div>
<div class="sim-guide"><ul>
<li>Con \(B=3\) T y 300 K: protón a 127.73 MHz, neutrón a 87.49 MHz y ESR a 84.07 GHz; polarización de los protones \(1.02\times10^{-5}\) (10.2 ppm), con \(\Delta E=0.528\) µeV. A 1.5 T la polarización es la mitad (\(5.1\times10^{-6}\)) y a 7 T, \(2.4\times10^{-5}\).</li>
<li>Enfríe la muestra a 4 K con 3 T: la polarización sube a \(P=7.7\times10^{-4}\) (crece como \(1/T\) mientras \(P\ll1\)); por eso, para aumentar la señal, algunas técnicas enfrían o «hiperpolarizan» la muestra.</li>
<li>Las tres rectas tienen pendiente 1 en la escala logarítmica: \(\nu=\gamma B/2\pi\). Las frecuencias de los núcleos son radiofrecuencia (MHz), las del electrón microondas (GHz), pues su razón giromagnética es 658 veces la del protón.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>La línea roja del cadmio (643.8 nm, transición de singlete) se observa en un campo de 1 T. Halle la separación en frecuencia y en longitud de onda de las componentes del triplete de Zeeman normal, y el número de componentes.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Frecuencia.</b> \(\Delta\nu=\mu_BB/h=9.2740\times10^{-24}/6.6261\times10^{-34}=1.3996\times10^{10}\) Hz \(=13.996\) GHz.</li>
<li><b>Longitud de onda.</b> \(\Delta\lambda=\lambda^2\Delta\nu/c=(643.8\times10^{-9})^2(1.3996\times10^{10})/2.998\times10^8=1.935\times10^{-11}\) m \(=0.01935\) nm.</li>
<li><b>Componentes.</b> Con \(\Delta m=0,\pm1\): tres líneas (\(\nu_0\), \(\nu_0\pm13.996\) GHz).</li>
<li><b>Resultado.</b> <span class="ans">13.996 GHz; 0.01935 nm; 3 componentes.</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Calcule los factores de Landé de \(^2S_{1/2}\), \(^2P_{1/2}\) y \(^2P_{3/2}\), y los desplazamientos (en unidades de \(\mu_BB\)) de las componentes de las líneas D\(_1\) y D\(_2\) del sodio. ¿Cuánto valen las componentes extremas de D\(_2\) a 1 T?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Landé.</b> \(g=1+[J(J+1)+S(S+1)-L(L+1)]/[2J(J+1)]\): \(^2S_{1/2}\): \(1+[0.75+0.75-0]/1.5=2\). \(^2P_{1/2}\): \(1+[0.75+0.75-2]/1.5=\tfrac23\). \(^2P_{3/2}\): \(1+[3.75+0.75-2]/7.5=\tfrac43\).</li>
<li><b>D\(_2\).</b> \((\tfrac43m'-2m)\): \(m'=\tfrac32\to\tfrac12\): \(2-1=1\); \(\tfrac12\to\tfrac12\): \(\tfrac23-1=-\tfrac13\); \(\tfrac12\to-\tfrac12\): \(\tfrac23+1=\tfrac53\); y las simétricas: \(\pm\tfrac13\), \(\pm1\), \(\pm\tfrac53\) (6 líneas).</li>
<li><b>D\(_1\).</b> \((\tfrac23m'-2m)\): \(\tfrac12\to\tfrac12\): \(-\tfrac23\); \(\tfrac12\to-\tfrac12\): \(\tfrac43\); simétricas: \(\pm\tfrac23\), \(\pm\tfrac43\) (4 líneas).</li>
<li><b>A 1 T.</b> \(\mu_BB=57.88\) µeV; \(\tfrac53\mu_BB=96.47\) µeV \(=23.33\) GHz.</li>
<li><b>Resultado.</b> <span class="ans">2, 2/3, 4/3; D₂: ±1/3, ±1, ±5/3; D₁: ±2/3, ±4/3; ±96.5 µeV (±23.3 GHz).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>En un experimento de Stern–Gerlach con átomos de plata a 1200 K (\(m=107.868\) u), gradiente 1000 T/m, imán de 3.5 cm y 1 cm hasta la pantalla, calcule \(\bar v\), \(a\), la desviación y la separación entre las dos líneas.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Masa.</b> \(m=107.868\times1.66054\times10^{-27}=1.7912\times10^{-25}\) kg.</li>
<li><b>Velocidad.</b> \(\bar v=\sqrt{8k_BT/\pi m}=\sqrt{8(1.3806\times10^{-23})(1200)/(\pi\times1.7912\times10^{-25})}=485.3\) m/s.</li>
<li><b>Aceleración.</b> \(a=\mu_B(\partial_zB)/m=9.274\times10^{-24}\times1000/1.7912\times10^{-25}=5.178\times10^4\) m/s\(^2\).</li>
<li><b>Desviación.</b> \(z=a\,L(L/2+D)/\bar v^2=5.178\times10^4\times0.035\times0.0275/235\,539=2.116\times10^{-4}\) m.</li>
<li><b>Resultado.</b> <span class="ans">485.3 m/s; \(5.178\times10^4\) m/s²; 0.2116 mm; separación 0.423 mm.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Halle la separación de estructura fina \(2p_{3/2}-2p_{1/2}\) del hidrógeno en eV, GHz y cm\(^{-1}\), y la energía y la longitud de onda de la transición hiperfina del 1s con la fórmula de Fermi (\(g_p=5.58569\)); compárelas con 1420.4058 MHz.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Estructura fina.</b> \(\alpha^2Ry/16=(5.3251\times10^{-5})(13.6057)/16=4.528\times10^{-5}\) eV; \(\nu=4.528\times10^{-5}\text{ eV}/h=10.95\) GHz; \(\tilde\nu=0.3652\) cm\(^{-1}\).</li>
<li><b>Hiperfina.</b> \(\Delta E=\tfrac43g_p(m_e/m_p)\alpha^4m_ec^2\,(\mu/m_e)^3=\tfrac43(5.58569)(5.4462\times10^{-4})(2.8357\times10^{-9})(510\,999\text{ eV})(0.99837)=5.868\times10^{-6}\) eV; \(\nu=1418.84\) MHz.</li>
<li><b>Comparación.</b> \(1418.84/1420.406-1=-0.11\) %; \(\lambda=c/\nu=21.106\) cm; el valor medido da \(\Delta E=5.874\) µeV (\(T=0.068\) K).</li>
<li><b>Resultado.</b> <span class="ans">\(4.528\times10^{-5}\) eV, 10.95 GHz, 0.3652 cm\(^{-1}\); 1418.84 MHz (−0.11 % frente a 1420.406); 21.1 cm.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Para la imagen por resonancia magnética a 3 T: calcule la frecuencia de resonancia del protón, la separación de los niveles de espín, la polarización a 300 K y la longitud de onda de las ondas de radio correspondientes. Repita la frecuencia a 1.5 T y a 7 T.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Frecuencia.</b> \(\nu=(\gamma_p/2\pi)B=42.5775\times3=127.73\) MHz; a 1.5 T, 63.87 MHz; a 7 T, 298.04 MHz.</li>
<li><b>Separación.</b> \(\Delta E=h\nu=6.6261\times10^{-34}\times1.2773\times10^8=8.463\times10^{-26}\) J \(=0.528\) µeV.</li>
<li><b>Polarización.</b> \(P=\tanh(\Delta E/2k_BT)\approx\Delta E/2k_BT=0.528\ \mu\text{eV}/(2\times25.85\ \text{meV})=1.02\times10^{-5}\).</li>
<li><b>Longitud de onda.</b> \(\lambda=c/\nu=299\,792\,458/1.2773\times10^8=2.347\) m.</li>
<li><b>Resultado.</b> <span class="ans">127.73 MHz; 0.528 µeV; \(1.02\times10^{-5}\); 2.35 m. A 1.5 T y 7 T: 63.87 y 298.04 MHz.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Calcule el campo de cruce \(B^*=A/\mu_B\) para el sodio (\(\Delta E_{fs}=2.132\) meV) y para el hidrógeno 2p (\(\Delta E_{fs}=4.528\times10^{-2}\) meV), con \(A=\tfrac23\Delta E_{fs}\); y decida el régimen del sodio a 5 T y del hidrógeno a 5 T. Compruebe que a \(B=0\) las energías son \(A/2\) (\(\times4\)) y \(-A\) (\(\times2\)).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Sodio.</b> \(A=\tfrac23(2.132\ \text{meV})=1.4213\) meV; \(B^*=A/\mu_B=1.4213\times10^{-3}/5.7884\times10^{-5}=24.55\) T.</li>
<li><b>Hidrógeno.</b> \(A=\tfrac23(4.528\times10^{-5}\text{ eV})=3.019\times10^{-5}\) eV; \(B^*=0.5215\) T.</li>
<li><b>Regímenes.</b> Sodio a 5 T: \(5/24.55=0.20\): transición del régimen débil al intermedio (los niveles apenas se desvían de las rectas de Landé); hidrógeno a 5 T: \(5/0.52=9.6\): Paschen–Back.</li>
<li><b>A B = 0.</b> \(J=\tfrac32\): \(\tfrac A2\) (4 estados); \(J=\tfrac12\): \(-A\) (2 estados); suma de energías \(4(A/2)+2(-A)=0\), y separación \(3A/2=\Delta E_{fs}\).</li>
<li><b>Resultado.</b> <span class="ans">24.55 T y 0.5215 T; Na a 5 T: casi Zeeman débil; H a 5 T: Paschen–Back.</span></li>
</ol></details></li>
</ol>
