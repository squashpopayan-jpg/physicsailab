<template class="chapter-src" data-id="general" data-num="6" data-title="Relatividad general: de la equivalencia a las ondas gravitacionales" data-part="Parte I · Relatividad especial" data-short="El principio de equivalencia, el tiempo gravitacional y el GPS, la métrica de Schwarzschild, la deflexión de la luz y el perihelio de Mercurio, los agujeros negros y las ondas gravitacionales detectadas por LIGO">
<p class="lead">La relatividad especial vale entre sistemas inerciales; la gravedad la rompe, porque un campo gravitatorio no desaparece al cambiar a un sistema inercial «global». Einstein vio en 1907 que la caída libre sí elimina localmente la gravedad, y de esa observación salió una teoría en la que la gravedad no es una fuerza sino la geometría del espacio-tiempo. Este capítulo no desarrolla el formalismo tensorial completo, sino lo que un curso de física moderna debe poder calcular con él: el ritmo de los relojes en un campo gravitatorio (que corrige hoy el GPS), la deflexión de la luz, el avance del perihelio de Mercurio, el radio del horizonte de un agujero negro y las ondas gravitacionales. Todos los números se contrastan con integraciones numéricas independientes de las ecuaciones de las geodésicas y con datos medidos.</p>

<section>
<h2>El principio de equivalencia</h2>
<p>La masa inercial \(m_i\) (la de \(F=m_ia\)) y la masa gravitatoria \(m_g\) (la que aparece en \(F=m_gg\)) son iguales: por eso todos los cuerpos caen con la misma aceleración, como mostró Galileo. Eötvös (1908) lo comprobó con una balanza de torsión con una precisión de \(3\times10^{-9}\); el experimento con balanzas de torsión de Washington lo llevó a \(10^{-13}\), y el satélite MICROSCOPE (2022), que compara cilindros de titanio y platino en órbita, midió una diferencia de aceleración relativa \(\eta=(-1.5\pm2.3\pm1.5)\times10^{-15}\), compatible con cero. Einstein lo elevó a principio: <em>en un laboratorio pequeño en caída libre no se puede distinguir la ausencia de gravedad de la ausencia de aceleración</em>, y, a la inversa, un laboratorio acelerado es equivalente a uno en un campo gravitatorio. Se deduce enseguida un efecto medible:</p>
<h3>Corrimiento gravitatorio hacia el rojo</h3>
<p>En una torre de altura \(h\) un haz de luz sube del suelo a la cima. Visto desde un cohete que acelera con \(g\) y cuya cabina tiene altura \(h\), la luz tarda \(h/c\) en llegar al techo; en ese tiempo el techo ha ganado una velocidad \(v=gh/c\) alejándose de la luz, de modo que el receptor la ve con la frecuencia reducida por el Doppler:</p>
<div class="eq key" data-name="Corrimiento gravitatorio hacia el rojo (campo uniforme)">\[\frac{\Delta f}{f}=-\frac{gh}{c^2},\qquad \text{y en general}\quad \frac{\Delta f}f=-\frac{\Delta\Phi}{c^2}.\]</div>
<p>Los relojes más bajos, en un potencial \(\Phi\) más profundo, marchan más lentos. Pound y Rebka (1960) lo midieron con rayos \(\gamma\) de \(^{57}\)Fe (14.4 keV) que subían la torre de 22.5 m de la Universidad de Harvard con el efecto Mössbauer: \(gh/c^2=2.455\times10^{-15}\), y encontraron la razón medida/predicha de \(0.9990\pm0.0076\) (Pound y Snider, 1965). Hoy los relojes ópticos atómicos lo miden entre dos alturas separadas 33 cm (Chou et al., 2010; unos \(4\times10^{-17}\), en acuerdo con el valor \(3.6\times10^{-17}\) que da la fórmula), y en 2022 a escala de una fracción de milímetro. Con una nube de átomos a 1 km de altura sobre otra, la diferencia sería de \(1.09\times10^{-13}\), esto es, 9.4 ns por día.</p>
<p>El mismo argumento aplicado a un haz de luz que cruza la cabina en el cohete acelerado dice que su trayectoria se curva hacia abajo: la luz cae. Con solo el principio de equivalencia se obtiene la mitad del valor de la deflexión de la luz del Sol (\(2GM/c^2b\)); la otra mitad viene de la curvatura del espacio, y solo la relatividad general completa da el valor total.</p>
</section>

<section>
<h2>La métrica de Schwarzschild y el tiempo gravitacional</h2>
<p>En relatividad general el espacio-tiempo es una variedad con una <span class="term">métrica</span> \(g_{\mu\nu}\) que da los intervalos, \(\dd s^2=g_{\mu\nu}\dd x^\mu\dd x^\nu\), y las partículas libres siguen <em>geodésicas</em>: las líneas de universo de tiempo propio máximo (como en el capítulo 3). La materia le dice al espacio-tiempo cómo curvarse (las ecuaciones de Einstein \(G_{\mu\nu}=8\pi GT_{\mu\nu}/c^4\)) y el espacio-tiempo le dice a la materia cómo moverse. La solución para el exterior de una masa esférica \(M\) (Schwarzschild, 1916) es:</p>
<div class="eq key" data-name="Métrica de Schwarzschild">\[\dd s^2=-\Bigl(1-\frac{r_s}r\Bigr)c^2\dd t^2+\frac{\dd r^2}{1-r_s/r}+r^2\bigl(\dd\theta^2+\operatorname{sen}^2\theta\,\dd\varphi^2\bigr),\qquad r_s=\frac{2GM}{c^2}.\]</div>
<p>En esta convención (signatura \(-+++\)) un reloj en reposo en la coordenada \(r\) mide el tiempo propio \(\dd\tau=\sqrt{1-r_s/r}\,\dd t\), con \(t\) el de un reloj lejano. El radio de Schwarzschild es de \(2.953\) km para el Sol y de \(8.87\) mm para la Tierra: para los cuerpos ordinarios, \(r_s\ll R\) y los efectos son pequeños, del orden de \(r_s/R\) (\(2.1\times10^{-6}\) en la superficie del Sol, \(7\times10^{-10}\) en la de la Tierra). En el límite de campo débil, \(g_{00}\approx-(1+2\Phi/c^2)\) con \(\Phi=-GM/r\) el potencial de Newton, y se recupera \(\Delta f/f=-\Delta\Phi/c^2\).</p>
<h3>El GPS</h3>
<p>Cada satélite GPS lleva relojes atómicos y emite su hora; el receptor calcula distancias como \(c\) por la diferencia de tiempos. Un error de \(1\) ns en un reloj es un error de 30 cm en la posición. Para un reloj en órbita circular de radio \(a\) hay dos efectos que se suman (a primer orden en \(1/c^2\)) respecto de un reloj en el geoide, cuyo potencial total (gravitatorio más centrífugo) es \(W_0=62\,636\,856\) m²/s²:</p>
<div class="eq key" data-name="Relojes de un satélite en órbita circular frente a la Tierra">\[\frac{\Delta f}{f}=\underbrace{\frac{W_0-GM_\oplus/a}{c^2}}_{\text{gravitatorio}\,(>0)}\;\underbrace{-\;\frac{v^2}{2c^2}}_{\text{velocidad}\,(\lt0)}\;=\;\frac{W_0-\tfrac32\,GM_\oplus/a}{c^2},\qquad v^2=\frac{GM_\oplus}a.\]</div>
<p>Para el semieje nominal del GPS, \(a=26\,561.75\) km (periodo de 11 h 58 min, velocidad 3.874 km/s): el efecto gravitatorio es \(+45.79\) µs/día, el de la velocidad \(-7.21\) µs/día y el neto \(+38.58\) µs/día, esto es, \(\Delta f/f=4.4647\times10^{-10}\). Por esto se sintoniza el reloj del satélite a 10.22999999543 MHz en lugar de 10.23 MHz antes del lanzamiento: ya en órbita, los relojes de la constelación avanzan al mismo ritmo que los terrestres. Sin la corrección, la posición se degradaría en \(c\times38.58\ \mu\text{s}=11.6\) km <em>cada día</em>. Es la aplicación cotidiana más masiva de la relatividad. Un reloj a 408 km (la ISS) va, en cambio, \(24.5\) µs/día más lento que uno en tierra, porque domina el efecto de la velocidad; ambos efectos se cancelan a unos 3 170 km de altura.</p>
<div class="sim" data-sim="gps" data-title="Relojes en órbita: efecto gravitatorio, efecto de velocidad y corrección neta"></div>
<div class="sim-guide"><ul>
<li>A 20 200 km (órbita GPS): \(+45.80\) µs/día (gravedad), \(-7.21\) µs/día (velocidad), \(+38.59\) µs/día neto, y un error de 11.6 km por día si no se corrigiera. El periodo es 11.98 h y la velocidad 3.873 km/s.</li>
<li>A 408 km (ISS): \(+3.75\) y \(-28.23\), neto \(-24.48\) µs/día. A 35 786 km (órbita geoestacionaria): \(+51.13\) y \(-4.54\), neto \(+46.58\) µs/día. El neto cruza cero cerca de 3 167 km, de modo que los relojes de esa órbita marchan como los del suelo.</li>
<li>Los dos efectos dependen de la altura de forma opuesta: el gravitatorio crece con \(a\) (hasta \(W_0/c^2=6.97\times10^{-10}\), 60.2 µs/día) y el de velocidad decrece como \(1/a\).</li>
</ul></div>
</section>

<section>
<h2>Deflexión de la luz y avance del perihelio</h2>
<p>La luz sigue geodésicas nulas (\(\dd s=0\)). Con la métrica de Schwarzschild y la conservación de la energía y del momento angular, la ecuación de la trayectoria \(u=1/r\) es \((\dd u/\dd\varphi)^2=1/b^2-u^2+r_su^3\), donde \(b\) es el parámetro de impacto. En campo débil la luz se desvía</p>
<div class="eq key" data-name="Deflexión de la luz por una masa">\[\alpha=\frac{4GM}{c^2b}=\frac{2r_s}{b},\qquad \text{Sol, rayo rasante }(b=R_\odot):\ \ \alpha=1.751''.\]</div>
<p>Es el doble del valor «newtoniano» (\(0.876''\), el que da el principio de equivalencia). En 1919, Eddington y Dyson fotografiaron estrellas cercanas al Sol durante un eclipse total en Príncipe (África) y Sobral (Brasil) y obtuvieron \(1.61''\pm0.30''\) y \(1.98''\pm0.12''\), compatibles con 1.75″ e incompatibles con 0.87″. Hoy la interferometría de radio de muy larga base (VLBI) mide el parámetro \(\gamma_\text{PPN}=1\) con una precisión de \(10^{-4}\), y la sonda Cassini (2003) midió el retardo de las señales de radio que pasaban junto al Sol (retardo de Shapiro) con \(|\gamma-1|\lt5\times10^{-5}\). Júpiter, en el borde, desvía la luz apenas \(0.016''\).</p>
<p>La trayectoria de una partícula de masa \(m\) con energía \(E\) y momento angular \(\ell\) obedece \((\dd u/\dd\varphi)^2=(E^2-1)/\ell^2+2u/\ell^2-u^2+2u^3\) (en unidades \(G=c=M=1\)). Es la ecuación de Newton más un término \(2u^3\) que la perturba y hace que la elipse no se cierre: el periastro avanza una cantidad por órbita</p>
<div class="eq key" data-name="Avance del perihelio">\[\Delta\varphi=\frac{6\pi GM}{c^2a(1-e^2)}\quad\text{por órbita (campo débil)},\qquad \text{Mercurio: }42.98''\text{ por siglo}.\]</div>
<p>Mercurio (\(a=0.38710\) AU, \(e=0.2056\), 87.969 días) avanza \(5.019\times10^{-7}\) rad por órbita, que con 415.2 órbitas por siglo da \(42.98''\), la diferencia entre la precesión observada (574″ por siglo) y la que explican las perturbaciones newtonianas de los demás planetas (531″). Le Verrier la detectó en 1859 (con un valor inicial de unos 38″ que Newcomb refinó a 43″ en 1882), y durante medio siglo se atribuyó a un planeta inexistente, Vulcano. Einstein la calculó en 1915 sin ningún parámetro libre. En el simulador de abajo el campo es fuerte (periastros de pocas decenas de \(m=GM/c^2\)) y la precesión es enorme: allí la aproximación \(6\pi/p\) deja de valer y se usa la integral exacta, validada con la integración numérica de la ecuación diferencial.</p>
<div class="sim" data-sim="orbitas" data-title="Órbitas en Schwarzschild: precesión del periastro en campo fuerte"></div>
<div class="sim-guide"><ul>
<li>Con \(r_p=10m\) y \(r_a=40m\) (\(e=0.6\)): el periastro avanza \(1.686\) rad (96.6°) por órbita, frente a 1.178 rad de la fórmula de campo débil (cociente 1.43). Con \(r_p=20m\), \(r_a=60m\): 0.744 rad frente a 0.628 (1.18).</li>
<li>Para una órbita real del sistema solar \(p\sim10^7m\) y la precesión es del orden de \(10^{-7}\)–\(10^{-6}\) rad por órbita: la integral exacta y la fórmula coinciden a 10 cifras. El avance es pequeño, pero acumulativo: por eso se midió en el siglo XIX.</li>
<li>Por debajo del límite de estabilidad (\(r_p\) en torno a \(6m\) para órbitas casi circulares) el simulador lo indica: la partícula cae al horizonte. Con \(r_p=r_a=6m\) se obtiene la última órbita circular estable (ISCO).</li>
</ul></div>
</section>

<section>
<h2>Agujeros negros</h2>
<p>La métrica de Schwarzschild tiene una frontera especial en \(r=r_s\): el <span class="term">horizonte de sucesos</span>. Desde dentro, ninguna señal puede salir: todos los futuros posibles apuntan hacia \(r=0\). Visto desde lejos, un reloj que cae se acerca al horizonte con una frecuencia que se corre al rojo sin límite (\(\dd\tau/\dd t=\sqrt{1-r_s/r}\to0\)); para el reloj que cae, sin embargo, cruza el horizonte en un tiempo propio finito y sin notar nada especial (sí las fuerzas de marea, que crecen como \(GM/r^3\): para un agujero de \(10\,M_\odot\) son letales fuera del horizonte; para uno de \(4\times10^6M_\odot\) lo cruzan sin daño). Las órbitas tienen tres radios característicos, en unidades de \(m=GM/c^2=r_s/2\): la esfera de fotones en \(3m\) (donde la luz puede orbitar), la última órbita circular estable (ISCO) en \(6m\) y el horizonte en \(2m\). La luz con parámetro de impacto menor que \(b_c=3\sqrt3\,m=5.196\,m\) es capturada, y un agujero negro iluminado por detrás se vería como un disco oscuro de diámetro angular \(2b_c/D=2\sqrt{27}\,GM/(c^2D)\) (la sombra). El simulador muestra los rayos y la deflexión exacta, que diverge cuando \(b\to b_c\).</p>
<div class="sim" data-sim="deflexion" data-title="Luz alrededor de un agujero negro: trazado de rayos y deflexión exacta"></div>
<div class="sim-guide"><ul>
<li>Con \(b=7m\): \(\alpha=1.128\) rad (64.6°), casi el doble de la aproximación \(4m/b=0.571\); la distancia de máximo acercamiento es \(5.62m\). Con \(b=10m\): 0.590 rad frente a 0.400. Con \(b=30m\): 0.148 rad frente a 0.133, solo un 11 % de diferencia.</li>
<li>Con \(b\lt5.196m\) la luz cae al agujero (rayos rojos): ese valor define el borde de la sombra. Cerca de \(b_c\) la luz da vueltas antes de salir: \(\alpha\to\infty\) (a \(b=5.2m\), \(\alpha=11.2\) rad, casi dos vueltas).</li>
<li>La sombra tiene diámetro \(2\sqrt{27}\,m=10.39\,m=5.196\,r_s\). Para M87* (\(6.5\times10^9M_\odot\), 16.8 Mpc) son 39.7 µas; el Event Horizon Telescope midió un anillo de \(42\pm3\) µas (2019). Para Sgr A* (\(4.15\times10^6M_\odot\), 8.15 kpc), 52.2 µas; el anillo medido en 2022 es de 51.8 ± 2.3 µas.</li>
</ul></div>
<p>Un agujero negro tiene temperatura: Hawking (1974) mostró que la teoría cuántica de campos en el espacio-tiempo del horizonte da radiación térmica con \(T_H=\hbar c^3/(8\pi GMk_B)\), que para \(1\,M_\odot\) es \(6.17\times10^{-8}\) K (mucho menor que los 2.7 K del fondo cósmico, de modo que hoy los agujeros estelares absorben más de lo que emiten) y para evaporarse completamente tardaría \(5120\pi G^2M^3/(\hbar c^4)=2.1\times10^{67}\) años. Es el único lugar del curso donde la relatividad general, la cuántica y la termodinámica se encuentran; no tiene todavía una confirmación experimental directa.</p>
</section>

<section>
<h2>Ondas gravitacionales</h2>
<p>Si el espacio-tiempo es dinámico, las perturbaciones de la métrica se propagan: Einstein predijo en 1916 las ondas gravitacionales, que son oscilaciones del tensor métrico \(h_{\mu\nu}\) que viajan a \(c\) y estiran y comprimen el espacio transversalmente (una onda de amplitud \(h\) cambia la longitud de un brazo \(L\) en \(\Delta L=\tfrac12hL\)). A diferencia de la radiación electromagnética, el término dipolar no existe (la conservación del momento lo prohíbe) y el primero que radia es el cuadrupolo. Para dos masas en órbita circular de semieje \(a\), la potencia emitida es \(P=\tfrac{32}{5}G^4(m_1m_2)^2(m_1+m_2)/(c^5a^5)\); la órbita se cierra y la frecuencia sube, con la ley de «chirp» determinada por la <span class="term">masa de chirp</span> \(M_c=(m_1m_2)^{3/5}/(m_1+m_2)^{1/5}\):</p>
<div class="eq key" data-name="Chirp de una binaria compacta (orden cuadrupolar)">\[f_{GW}(\tau)=\frac1\pi\Bigl(\frac5{256\,\tau}\Bigr)^{3/8}\Bigl(\frac{GM_c}{c^3}\Bigr)^{-5/8},\qquad \dot f=\frac{96}5\pi^{8/3}\Bigl(\frac{GM_c}{c^3}\Bigr)^{5/3}f^{11/3},\qquad h\approx\frac4D\Bigl(\frac{GM_c}{c^2}\Bigr)^{5/3}\Bigl(\frac{\pi f}c\Bigr)^{2/3},\]</div>
<p>con \(\tau\) el tiempo que falta hasta la fusión. El inspiral termina aproximadamente en el ISCO, con una frecuencia de la onda \(f_\text{ISCO}=c^3/(6^{3/2}\pi GM)=4.4\,\text{kHz}\,(M_\odot/M)\); después vienen la fusión y la oscilación amortiguada del agujero negro final (\(\textit{ringdown}\)), que requieren relatividad numérica. El primer indicio indirecto fue el púlsar binario PSR B1913+16 de Hulse y Taylor (1974): su periodo orbital disminuye exactamente como predice la pérdida de energía por ondas gravitacionales (el acuerdo con la RG es mejor que el 0.5 %, Nobel 1993). La detección directa llegó el 14 de septiembre de 2015, con LIGO (dos interferómetros de Michelson de brazos de 4 km, en Livingston y Hanford): <b>GW150914</b>, la fusión de dos agujeros negros de unas \(36\) y \(29\,M_\odot\) a unos 410 Mpc, que dejó uno de \(62\,M_\odot\) y radió \(3\,M_\odot c^2=5.4\times10^{47}\) J, con una potencia máxima de unos \(3.6\times10^{49}\) W, mayor que la luminosidad conjunta de todas las estrellas del universo observable. La deformación medida fue \(h\approx10^{-21}\): una diferencia de \(hL=4\times10^{-18}\) m entre los dos brazos de 4 km, unas 200 veces menor que el diámetro de un protón. En 2017, GW170817 (dos estrellas de neutrones) se observó también en luz, y el retraso de 1.7 s entre las ondas gravitacionales y los rayos \(\gamma\) tras recorrer unos 40 Mpc fija la diferencia entre la velocidad de la gravedad y la de la luz en menos de \(10^{-15}\) de \(c\).</p>
<div class="sim" data-sim="ligo" data-title="Chirp de una fusión de agujeros negros: frecuencia y señal"></div>
<div class="sim-guide"><ul>
<li>Con 36 + 29 \(M_\odot\): masa de chirp 28.10 \(M_\odot\), masa total 65 \(M_\odot\), \(f_\text{ISCO}=67.6\) Hz; a 0.2 s de la fusión la onda tiene 34.3 Hz y desde 35 Hz restan 0.190 s. La amplitud a 410 Mpc es del orden de \(1.2\times10^{-21}\) en el ISCO (el pico real, con la fusión, es \(\sim10^{-21}\)).</li>
<li>Con dos estrellas de neutrones (\(1.4+1.4\,M_\odot\), \(M_c=1.219\,M_\odot\)) el chirp es mucho más lento: desde 35 Hz pasan 35.5 s y el ISCO llega a 1570 Hz. El detector «oye» la señal mucho tiempo antes de la fusión; el sonido (frecuencia) sube y se hace más agudo.</li>
<li>Más lejos, más débil: \(h\propto1/D\). A 4000 Mpc, la amplitud baja a \(\sim10^{-22}\), cerca del límite de ruido de los detectores actuales.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Para un satélite GPS de semieje \(a=26\,561.75\) km calcule el efecto gravitatorio, el de velocidad y el neto, en µs por día, el desplazamiento relativo de frecuencia y el error de posición acumulado en un día. (\(GM_\oplus=3.986004418\times10^{14}\) m³/s², \(W_0=62\,636\,856\) m²/s².)
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Planteamiento.</b> \(\Delta f/f=(W_0-GM/a)/c^2-GM/(2ac^2)\). Con \(GM/a=3.986004418\times10^{14}/2.656175\times10^7=1.50066\times10^7\) m²/s².</li>
<li><b>Gravitatorio.</b> \((62\,636\,856-15\,006\,558)/c^2=4.7630\times10^7/8.98755\times10^{16}=5.2996\times10^{-10}\), esto es, \(5.2996\times10^{-10}\times86\,400\) s \(=45.79\) µs/día.</li>
<li><b>Velocidad.</b> \(-GM/(2ac^2)=-0.75033\times10^7/c^2=-8.349\times10^{-11}\Rightarrow-7.21\) µs/día.</li>
<li><b>Neto.</b> \(4.4647\times10^{-10}\Rightarrow+38.58\) µs/día. Error de posición: \(c\times38.58\) µs \(=11.56\) km/día.</li>
<li><b>Resultado.</b> <span class="ans">+45.79, −7.21, +38.58 µs/día; \(4.4647\times10^{-10}\); 11.6 km/día.</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Calcule la deflexión de un rayo de luz que roza el Sol (\(GM_\odot=1.32712\times10^{20}\) m³/s², \(R_\odot=6.957\times10^8\) m) y la de uno que roza Júpiter (\(GM_J=1.26687\times10^{17}\) m³/s², \(R_J=7.1492\times10^7\) m), y compárelas con el valor «newtoniano».
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Fórmula.</b> \(\alpha=4GM/(c^2b)\).</li>
<li><b>Sol.</b> \(\alpha=4(1.32712\times10^{20})/(8.98755\times10^{16}\times6.957\times10^8)=8.490\times10^{-6}\) rad \(=1.751''\).</li>
<li><b>Newtoniano (mitad).</b> \(0.8756''\).</li>
<li><b>Júpiter.</b> \(\alpha=4(1.26687\times10^{17})/(8.98755\times10^{16}\times7.1492\times10^7)=7.887\times10^{-8}\) rad \(=0.01627''\) (16.3 mas).</li>
<li><b>Resultado.</b> <span class="ans">1.751″ (Sol); 0.0163″ (Júpiter); la mitad (0.876″) con solo el principio de equivalencia.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Calcule el avance del perihelio de Mercurio por órbita y por siglo (\(a=0.38710\) AU, \(e=0.20564\), periodo 87.9691 días).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Datos.</b> \(a=0.38709927\times1.495978707\times10^{11}=5.79092\times10^{10}\) m; \(1-e^2=0.957714\).</li>
<li><b>Por órbita.</b> \(\Delta\varphi=6\pi GM/(c^2a(1-e^2))=6\pi(1.32712\times10^{20})/(8.98755\times10^{16}\times5.79092\times10^{10}\times0.957714)=5.0187\times10^{-7}\) rad.</li>
<li><b>Órbitas por siglo.</b> \(36\,525/87.9691=415.20\).</li>
<li><b>Por siglo.</b> \(5.0187\times10^{-7}\times415.20=2.0838\times10^{-4}\) rad \(=42.98''\).</li>
<li><b>Resultado.</b> <span class="ans">\(5.019\times10^{-7}\) rad por órbita; 42.98″ por siglo (observado: 42.98″ ± 0.04″).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Halle el radio de Schwarzschild del Sol, de la Tierra y de un agujero negro de \(4.15\times10^6M_\odot\) (Sgr A*); el radio de la ISCO y de la esfera de fotones de este último, y el diámetro angular de la sombra de Sgr A* a 8.15 kpc y de M87* (\(6.5\times10^9M_\odot\), 16.8 Mpc).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>\(r_s\).</b> \(r_s=2GM/c^2\): Sol, \(2(1.32712\times10^{20})/8.98755\times10^{16}=2953.25\) m; Tierra, \(2(3.986\times10^{14})/c^2=8.870\) mm; Sgr A*: \(4.15\times10^6\times2.95325\) km \(=1.2256\times10^7\) km \(\approx0.082\) AU.</li>
<li><b>Radios característicos de Sgr A*.</b> \(m=r_s/2=6.128\times10^6\) km: esfera de fotones \(3m=1.838\times10^7\) km; ISCO \(6m=3.677\times10^7\) km.</li>
<li><b>Sombra.</b> \(\theta=2\sqrt{27}\,m/D=10.392\,m/D\). Sgr A*: \(6.128\times10^9\) m \(\times10.392/(8150\times3.0857\times10^{16}\) m\()=2.532\times10^{-10}\) rad \(=52.2\) µas. M87*: \(m=9.598\times10^{12}\) m, \(D=16.8\times3.0857\times10^{22}\) m \(=5.184\times10^{23}\) m, \(\theta=1.924\times10^{-10}\) rad \(=39.7\) µas.</li>
<li><b>Resultado.</b> <span class="ans">2.953 km, 8.87 mm, \(1.226\times10^7\) km; \(1.84\times10^7\) y \(3.68\times10^7\) km; 52.2 µas y 39.7 µas.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Una fusión de dos agujeros negros de 36 y 29 \(M_\odot\) (GW150914): halle la masa de chirp, la frecuencia de la onda en la ISCO, el tiempo que falta para la fusión desde 35 Hz y la energía radiada si la masa final es \(62\,M_\odot\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Masa de chirp.</b> \(M_c=(36\times29)^{3/5}/65^{1/5}=1044^{0.6}/65^{0.2}=64.5/2.302=28.10\,M_\odot\).</li>
<li><b>ISCO.</b> \(f=c^3/(6^{3/2}\pi GM)\) con \(GM=65\times1.32712\times10^{20}\) m³/s²: \(f=67.65\) Hz.</li>
<li><b>Tiempo desde 35 Hz.</b> \(\tau=(5/256)(\pi f)^{-8/3}(GM_c/c^3)^{-5/3}\); \(GM_\odot/c^3=4.9255\times10^{-6}\) s, así que \(GM_c/c^3=28.10\times4.9255\times10^{-6}=1.384\times10^{-4}\) s; \(\pi f=109.96\) s\(^{-1}\); \(\tau=0.1901\) s.</li>
<li><b>Energía.</b> \(\Delta m=36+29-62=3\,M_\odot\); \(E=3M_\odot c^2=3\times1.98841\times10^{30}\times8.98755\times10^{16}=5.36\times10^{47}\) J.</li>
<li><b>Resultado.</b> <span class="ans">\(M_c=28.10\,M_\odot\); 67.65 Hz; 0.190 s; \(5.4\times10^{47}\) J.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>(a) Calcule el corrimiento gravitatorio \(gh/c^2\) del experimento de Pound–Rebka (22.5 m), del de relojes ópticos separados 33 cm y entre dos relojes a 1 km de distancia vertical, y cuánto adelanta por día el reloj superior en este último caso. (b) Demuestre la fórmula con el cohete acelerado.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>(a) Pound–Rebka.</b> \(gh/c^2=9.80665(22.5)/8.98755\times10^{16}=2.455\times10^{-15}\).</li>
<li><b>33 cm.</b> \(9.80665(0.33)/c^2=3.601\times10^{-17}\).</li>
<li><b>1 km.</b> \(9.80665(1000)/c^2=1.0911\times10^{-13}\); en un día: \(1.0911\times10^{-13}\times86\,400\) s \(=9.43\) ns.</li>
<li><b>(b) Cohete.</b> Una señal emitida desde el suelo de una cabina de altura \(h\) que acelera con \(g\) llega al techo tras \(t=h/c\); en ese tiempo el techo se alejó de la fuente a \(v=gt=gh/c\); Doppler: \(\Delta f/f=-v/c=-gh/c^2\). Por el principio de equivalencia, vale lo mismo en un campo \(g\).</li>
<li><b>Resultado.</b> <span class="ans">\(2.455\times10^{-15}\); \(3.60\times10^{-17}\); \(1.091\times10^{-13}\) (9.43 ns/día).</span></li>
</ol></details></li>
</ol>
