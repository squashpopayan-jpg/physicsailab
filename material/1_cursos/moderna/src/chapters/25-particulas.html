<template class="chapter-src" data-id="particulas" data-num="25" data-title="Partículas elementales y el Modelo Estándar" data-part="Parte VII · Partículas, estrellas y cosmos" data-short="El Modelo Estándar de leptones, quarks y bosones; las leyes de conservación; el modelo de quarks y la fórmula de Gell-Mann–Okubo; la interacción débil (vida del muón, anchura del Z y el número de neutrinos) y las oscilaciones de neutrinos">
<p class="lead">Todo lo que sabemos de la materia ordinaria se construye con tres partículas: el electrón, el quark u y el quark d. Pero hay muchas más: en los aceleradores y en los rayos cósmicos aparecen cientos de partículas inestables, que se ordenan en patrones (el «zoo de partículas») que los quarks explican. El <span class="term">Modelo Estándar</span> reúne seis leptones, seis quarks y los bosones que transmiten tres de las cuatro interacciones, y ha resistido medio siglo de pruebas de precisión. Este capítulo recorre sus ingredientes con los datos del Particle Data Group (PDG), comprueba con las leyes de conservación qué reacciones están permitidas, reproduce con los quarks las cargas y las masas de los hadrones (la fórmula de Gell-Mann–Okubo y la predicción del Ω⁻), calcula la desintegración débil del muón, el pión y el Z (con el número de familias de neutrinos) y las oscilaciones de neutrinos, que muestran que tienen masa.</p>

<section>
<h2>Los ingredientes del Modelo Estándar</h2>
<p>Las partículas de materia son <em>fermiones</em> de espín ½, en tres «familias» o generaciones de propiedades idénticas y masas crecientes: leptones cargados (electrón, muón, tau), un neutrino para cada uno, y seis quarks (u, d; c, s; t, b), con cargas \(+\tfrac23\) y \(-\tfrac13\). Cada fermión tiene una antipartícula. Las fuerzas se transmiten por <em>bosones</em> de espín 1: el fotón (electromagnetismo, sin masa), los bosones \(W^\pm\) y \(Z^0\) (débil, muy masivos), y ocho gluones (fuerte, entre quarks, que tienen una «carga de color»); el campo de Higgs, de espín 0, da masa a los demás. Las masas del PDG:</p>
<table class="data"><thead><tr><th>Leptones</th><th>Quarks</th><th>Bosones</th></tr></thead><tbody>
<tr><td>e: 0.511 MeV</td><td>u: 2.16 MeV · d: 4.7 MeV</td><td>γ, g: 0</td></tr>
<tr><td>μ: 105.66 MeV</td><td>s: 92.9 MeV · c: 1.273 GeV</td><td>W: 80.362 GeV</td></tr>
<tr><td>τ: 1776.9 MeV</td><td>b: 4.186 GeV · t: 172.6 GeV</td><td>Z: 91.188 GeV · H: 125.13 GeV</td></tr>
</tbody></table>
<p>(Los neutrinos tienen masas \(<1\) eV; las masas de los quarks ligeros son las «corrientes» de la teoría, no las «constituyentes» de unos 300 MeV.) El quark top es tan masivo y su desintegración tan rápida (ancho 1.42 GeV, vida media \(\hbar/\Gamma=4.6\times10^{-25}\) s) que se desintegra antes de formar hadrones. El ancho y la vida media de cualquier estado inestable están ligados por \(\Gamma=\hbar/\tau\): la \(\Delta(1232)\), de la interacción fuerte, tiene \(\Gamma=117\) MeV y \(\tau=5.6\times10^{-24}\) s; el \(\pi^+\), débil, \(\tau=26.0\) ns: una diferencia de \(10^{16}\) en la escala de tiempos.</p>
</section>

<section>
<h2>Leyes de conservación</h2>
<p>Las reacciones entre partículas están restringidas por magnitudes que se conservan: la energía, el momento y el momento angular (como siempre), la <em>carga eléctrica</em>, el <em>número bariónico</em> \(B\) (\(+1\) para un barión, \(-1\) para un antibarión, es decir, \(\tfrac13\) por quark), los <em>números leptónicos</em> \(L_e,L_\mu,L_\tau\) (de cada sabor por separado) y la <em>extrañeza</em> \(S\) (\(-1\) por quark s), que conservan las interacciones fuerte y electromagnética pero no la débil. Un simple recuento permite clasificar reacciones. Permitidas: \(n\to p\,e^-\bar\nu_e\) (desintegración beta); \(\pi^+\to\mu^+\nu_\mu\); \(\mu^-\to e^-\bar\nu_e\nu_\mu\); \(\Lambda\to p\pi^-\) (débil: \(\Delta S=1\)); \(\pi^-p\to K^0\Lambda\) (fuerte: \(S=0\to(+1)+(-1)\)). Prohibidas: \(p\to e^+\pi^0\) (viola \(B\), y \(L\); la vida del protón es \(>10^{34}\) años), \(\mu^-\to e^-\gamma\) (viola el sabor leptónico: la razón de ramificación es \(<4\times10^{-13}\)), \(n\to pe^-\) (sin neutrino, \(L\) cambia en 1), \(np\to p\Lambda\) (viola \(S\) en una interacción fuerte), \(e^-\to\nu_e\gamma\) (carga). Se comprobó con un programa que suma los números cuánticos todos estos casos.</p>
<div class="sim" data-sim="conservacion" data-title="Comprobador de leyes de conservación en reacciones de partículas"></div>
<div class="sim-guide"><ul>
<li>Con \(\pi^-+p\to K^0+\Lambda\) en modo «fuerte», se conserva todo: la extrañeza \(0\to(+1)+(-1)\). Pase a \(n+p\to p+\Lambda\): solo se viola la extrañeza (\(0\to-1\)); es un proceso posible únicamente por la interacción débil (cambie el modo a «débil»). Con un \(K^0\) o \(K^+\) adicional en el estado final la extrañeza se compensa.</li>
<li>Pruebe \(p\to e^++\pi^0\): violan el número bariónico y el leptónico; \(\mu^-\to e^-+\gamma\): el sabor leptónico (\(L_\mu\) de 1 a 0 y \(L_e\) de 0 a 1).</li>
<li>Con \(n\to p+e^-\) falta un antineutrino: añada «ν̄ₑ» como tercera partícula final y la reacción queda permitida.</li>
</ul></div>
</section>

<section>
<h2>Quarks y hadrones</h2>
<p>Los <em>hadrones</em> (partículas con interacción fuerte) son estados ligados de quarks: <em>bariones</em> de tres quarks (\(p=uud\), \(n=udd\), \(\Lambda=uds\), \(\Omega^-=sss\)) y <em>mesones</em> de un quark y un antiquark (\(\pi^+=u\bar d\), \(K^+=u\bar s\)). La carga es la suma de las de los quarks, el número bariónico \(\tfrac13\) por quark y la extrañeza \(-1\) por quark s; se comprobó, para catorce hadrones del PDG, que la carga obtenida de los quarks coincide con la tabulada, y que los bariones tienen \(B=1\) y los mesones \(B=0\). Para \(\Omega^-=sss\) resulta \(Q=-1\), \(S=-3\), \(J=\tfrac32\); para el \(\Delta^{++}=uuu\), \(Q=+2\): tres quarks idénticos en el mismo estado espacial con espines paralelos violarían el principio de Pauli, a menos que tengan un número cuántico adicional, el <span class="term">color</span>.</p>
<p>Gell-Mann y Ne'eman (1961) ordenaron los hadrones por carga y extrañeza en figuras simétricas del grupo SU(3). Los ocho bariones de espín ½ (N, Λ, Σ, Ξ) forman un <em>octete</em> y los diez de espín 3/2, un <em>decuplete</em> (Δ, Σ*, Ξ*, Ω⁻). El patrón de masas es tan regular que permitió la predicción de una partícula no observada: en el decuplete, cada paso de extrañeza (de Δ a Σ* a Ξ*) agrega unos 150 MeV; el Ω⁻ completaba el diagrama en 1685 MeV con \(S=-3\), y se halló en 1964 en una cámara de burbujas con una masa de 1672 MeV, como se había previsto. Con las masas del PDG: \(\Delta\), 1232 MeV; \(\Sigma^*\), 1384.6; \(\Xi^*\), 1533.4; \(\Omega^-\), 1672.45 (espaciados 152.6, 148.8 y 139.1 MeV; el espaciado igual predice 1682 MeV). Para el octete, la <span class="term">fórmula de Gell-Mann–Okubo</span> \(\tfrac12(m_N+m_\Xi)=\tfrac14(3m_\Lambda+m_\Sigma)\) da 1128.6 MeV frente a 1135.1 MeV: coinciden al 0.6 %.</p>
<div class="sim" data-sim="decuplete" data-title="Octete y decuplete bariónicos: regularidades de masas y el Ω⁻"></div>
<div class="sim-guide"><ul>
<li>La línea de los cuatro estados del decuplete es casi recta: espaciado de 150 MeV (diferencia de masa entre un quark s y uno u/d). El punto naranja es la predicción de espaciado igual para el Ω⁻ (1682 MeV).</li>
<li>El octete (azul) satisface la fórmula de Gell-Mann–Okubo a 0.6 %; compare las masas de N, Λ, Σ, Ξ.</li>
</ul></div>
</section>

<section>
<h2>La interacción débil</h2>
<p>La desintegración débil la transmiten los bosones \(W^\pm\) y \(Z^0\); a energías bajas se reduce a la interacción de contacto de Fermi con la constante \(G_F=1.1663788\times10^{-5}\) GeV\(^{-2}\). La desintegración del muón \(\mu^-\to e^-\bar\nu_e\nu_\mu\) tiene la anchura \(\Gamma=G_F^2m_\mu^5/192\pi^3\), es decir, una vida media \(\tau=2.187\ \mu\)s, frente a los 2.196981 µs medidos: la diferencia, del 0.44 %, son correcciones radiativas, y tomada con ellas es como se mide \(G_F\) en el PDG. Para el pión, la desintegración \(\pi^+\to e^+\nu_e\) está muy suprimida frente a \(\pi^+\to\mu^+\nu_\mu\) por la <em>helicidad</em>: la interacción débil acopla solo neutrinos de helicidad izquierda y positrones, o electrones, con velocidad próxima a \(c\), de modo que para un pión sin espín el leptón cargado debe tener la helicidad «equivocada», lo que cuesta un factor \(m_\ell^2\): \(\Gamma(\pi\to e\nu)/\Gamma(\pi\to\mu\nu)=(m_e/m_\mu)^2[(m_\pi^2-m_e^2)/(m_\pi^2-m_\mu^2)]^2=1.283\times10^{-4}\), frente a \(1.2327\times10^{-4}\) medido (−3.9 % por correcciones radiativas). Los momentos de las desintegraciones se obtienen de la cinemática de dos cuerpos, \(p^*=\sqrt{[M^2-(m_1+m_2)^2][M^2-(m_1-m_2)^2]}/2M\) (comprobada con la solución numérica de la conservación de energía): \(\pi^+\to\mu^+\nu\), \(p=29.79\) MeV/c (\(T_\mu=4.12\) MeV); \(K^+\to\mu^+\nu\), 235.5 MeV/c; \(\Lambda\to p\pi^-\), 100.6 MeV/c; \(\Omega^-\to\Lambda K^-\), 211.2 MeV/c; \(Z\to e^+e^-\), 45.594 GeV/c.</p>
<p>En el nivel árbol, la masa del \(W\) sale de \(G_F\), \(\alpha\) y el ángulo de mezcla \(\theta_W\) (\(\sin^2\theta_W=0.2312\)): \(M_W=(\pi\alpha/\sqrt2G_F)^{1/2}/\sin\theta_W=37.28/0.4808=77.5\) GeV, frente a 80.36 GeV medidos: la diferencia del 3.5 % son correcciones radiativas, que dependen de la masa del quark top (de ahí que antes de descubrirlo se predijera ~170 GeV) y del Higgs.</p>
<h3>El Z y el número de familias de neutrinos</h3>
<p>En el LEP (CERN, 1989–2000) los positrones y electrones colisionaban a \(\sqrt s\approx91\) GeV y producían la resonancia del \(Z^0\). La sección eficaz de la producción de hadrones (línea de forma de Breit–Wigner) es \(\sigma(\sqrt s)=\dfrac{12\pi\Gamma_{ee}\Gamma_{\rm had}}{M_Z^2}\dfrac{s}{(s-M_Z^2)^2+s^2\Gamma_Z^2/M_Z^2}(\hbar c)^2\) y en el pico vale \(12\pi\Gamma_{ee}\Gamma_{\rm had}/(M_Z^2\Gamma_Z^2)=41.53\) nb (medida: 41.48 nb). La anchura \(\Gamma_Z\) suma todos los canales: hadrones (1744.4 MeV), tres leptones cargados (\(3\times83.98\) MeV) y los neutrinos que no se ven; cada familia de neutrinos ligeros aporta \(\Gamma_{\nu\nu}=G_FM_Z^3/12\sqrt2\pi=165.9\) MeV en el nivel árbol (167.2 MeV con correcciones). De \(\Gamma_Z=2495.2\) MeV resulta \(N_\nu=(2495.2-1744.4-3\times83.984)/167.2=2.984\): exactamente tres familias de neutrinos con masa menor que \(M_Z/2\). Una cuarta reduciría el máximo de 41.5 a 36.5 nb (12 %), una diferencia enorme frente a la precisión de las medidas. La resonancia mide el número de familias de partículas.</p>
<div class="sim" data-sim="z" data-title="La resonancia del Z y el número de familias de neutrinos"></div>
<div class="sim-guide"><ul>
<li>Con \(N_\nu=3\) la curva (naranja) tiene el máximo de 41.4–41.5 nb y anchura \(\Gamma_Z\approx2.5\) GeV. Con \(N_\nu=2\) el pico sube a 47.6 nb y con \(N_\nu=4\) baja a 36.4 nb; los datos de LEP seleccionan el 3.</li>
<li>La anchura de cada curva a media altura coincide con \(\Gamma_Z\); la amplitud cae como \(1/\Gamma_Z^2\).</li>
</ul></div>
</section>

<section>
<h2>Mezcla de sabores y oscilaciones de neutrinos</h2>
<p>Los quarks se acoplan al \(W\) con una <em>matriz de mezcla</em> unitaria de Cabibbo–Kobayashi–Maskawa (CKM): los estados que interaccionan débilmente son combinaciones de los de masa definida. Con tres ángulos y una fase (parametrización estándar), \(\sin\theta_{12}=0.2250\), \(\sin\theta_{23}=0.04182\), \(\sin\theta_{13}=0.003732\), \(\delta=1.144\) rad, se obtiene \(|V_{ud}|=0.97435\), \(|V_{us}|=0.2250\), \(|V_{cb}|=0.0418\), \(|V_{ub}|=0.0037\), \(|V_{tb}|=0.99912\) (los valores del PDG, a mejor que 0.3 %), con la matriz unitaria a \(10^{-15}\). La fase \(\delta\) es la fuente de la violación de CP en los quarks. Para los neutrinos hay una matriz análoga (PMNS), con mezclas mucho mayores (\(\theta_{12}=33.4^\circ\), \(\theta_{23}\approx49^\circ\), \(\theta_{13}=8.6^\circ\)).</p>
<p>La consecuencia observable es la <span class="term">oscilación</span>: un neutrino producido con un sabor \(\nu_\alpha\) es una superposición de estados de masa \(m_i\), que se propagan con distinta fase, de modo que a una distancia \(L\) puede detectarse como \(\nu_\beta\). Con dos sabores,</p>
<div class="eq key" data-name="Oscilaciones de neutrinos (dos sabores)">\[P(\nu_\alpha\to\nu_\beta)=\sin^22\theta\,\sin^2\Bigl(1.267\,\frac{\Delta m^2[\text{eV}^2]\,L[\text{km}]}{E[\text{GeV}]}\Bigr),\qquad L_1=\frac{\pi E}{2\times1.267\,\Delta m^2}.\]</div>
<p>Se comprobó contra la evolución exacta con la exponencial matricial del hamiltoniano de dos niveles (scipy.linalg.expm) para cinco casos. Con los parámetros atmosféricos (\(\Delta m^2=2.5\times10^{-3}\) eV\(^2\), \(\theta=45^\circ\)) y \(E=0.6\) GeV, el primer máximo cae en \(L_1=297.6\) km, y el experimento T2K (295 km) obtiene \(P=0.9998\): casi todos los \(\nu_\mu\) desaparecen. Con \(E=1\) GeV, \(L_1=496\) km. Para los neutrinos solares/de reactor (\(\Delta m^2=7.5\times10^{-5}\) eV\(^2\), \(\theta_{12}=33.4^\circ\)) y 4 MeV a 180 km (KamLAND), \(P=0.69\). Que haya oscilación exige \(\Delta m^2\ne0\): los neutrinos tienen masa (Nobel 2015: Kajita y McDonald), algo que el Modelo Estándar original no incluía.</p>
<div class="sim" data-sim="oscilacion" data-title="Oscilaciones de neutrinos de dos sabores"></div>
<div class="sim-guide"><ul>
<li>Con \(\theta=45^\circ\) (mezcla máxima), \(\Delta m^2=2.5\times10^{-3}\) eV² y \(E=0.6\) GeV, la probabilidad llega a 1 en \(L_1=297.6\) km (línea punteada naranja) y vuelve a cero en 595 km.</li>
<li>Reduzca \(\theta\) a 8.6° (el \(\theta_{13}\) de los reactores): el máximo baja a \(\sin^22\theta=0.087\). Aumente la energía: el máximo se aleja proporcionalmente a \(E\).</li>
<li>A distancias \(\gg L_1\), con la resolución finita en energía, la oscilación se promedia a \(\tfrac12\sin^22\theta\).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Decida con las leyes de conservación si son posibles (a) \(\mu^-\to e^-+\gamma\); (b) \(\Lambda\to p+\pi^-\); (c) \(p+p\to p+\Lambda\) (y \(n+p\to p+\Lambda\)); (d) \(\pi^-+p\to K^0+\Lambda\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>(a)</b> \(L_\mu:1\to0\), \(L_e:0\to1\): se viola el sabor leptónico: prohibida (BR \(<4\times10^{-13}\)).</li>
<li><b>(b)</b> Carga \(0\to+1-1\); \(B=1\to1\); leptónicos 0; \(S:-1\to0\): solo la interacción débil la permite (\(\tau=0.26\) ns).</li>
<li><b>(c)</b> Con \(p+p\) la carga no se conserva (\(+2\to+1\)); con \(n+p\to p+\Lambda\) se conserva la carga pero \(S:0\to-1\): violada por la interacción fuerte (haría falta un \(K^0\), \(S=+1\), en el estado final).</li>
<li><b>(d)</b> Carga \(0\to0\), \(B=1\to1\), \(S:0\to(+1)+(-1)=0\): permitida (fuerte).</li>
<li><b>Resultado.</b> <span class="ans">(a) no; (b) solo débil; (c) no; (d) sí.</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Calcule el momento y la energía cinética del muón en \(\pi^+\to\mu^+\nu_\mu\) (\(m_\pi=139.570\) MeV, \(m_\mu=105.658\) MeV), y el momento en \(K^+\to\mu^+\nu\) (\(m_K=493.677\) MeV).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Fórmula.</b> Con \(m_\nu=0\): \(p=(M^2-m_\mu^2)/(2M)\).</li>
<li><b>Pión.</b> \((139.570^2-105.658^2)/(2\times139.570)=29.79\) MeV/c.</li>
<li><b>Energía cinética.</b> \(T_\mu=\sqrt{p^2+m_\mu^2}-m_\mu=4.12\) MeV.</li>
<li><b>Kaón.</b> \((493.677^2-105.658^2)/(2\times493.677)=235.5\) MeV/c.</li>
<li><b>Resultado.</b> <span class="ans">29.79 MeV/c; 4.12 MeV; 235.5 MeV/c.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Calcule la vida media del muón con \(G_F=1.1664\times10^{-5}\) GeV\(^{-2}\) y \(m_\mu=0.10566\) GeV (\(\hbar=6.582\times10^{-25}\) GeV s), y compárela con 2.197 µs.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Anchura.</b> \(\Gamma=G_F^2m_\mu^5/192\pi^3\).</li>
<li><b>Vida media.</b> \(\tau=192\pi^3\hbar/(G_F^2m_\mu^5)=2.187\) µs.</li>
<li><b>Comparación.</b> \((2.197-2.187)/2.197=0.44\) %: las correcciones radiativas.</li>
<li><b>Resultado.</b> <span class="ans">2.187 µs (medido 2.197 µs).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Calcule la anchura Z → νν̄ de una familia, la anchura invisible y el número de neutrinos con \(\Gamma_Z=2495.2\), \(\Gamma_{\rm had}=1744.4\), \(\Gamma_{\ell\ell}=83.984\) MeV y \(\Gamma_{\nu\nu}=167.2\) MeV.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Nivel árbol.</b> \(G_FM_Z^3/(12\sqrt2\pi)=165.9\) MeV (167.2 MeV con correcciones).</li>
<li><b>Invisible.</b> \(\Gamma_{\rm inv}=2495.2-1744.4-3\times83.984=498.8\) MeV.</li>
<li><b>Número.</b> \(N_\nu=498.8/167.2=2.984\).</li>
<li><b>Resultado.</b> <span class="ans">165.9 MeV; 498.8 MeV; \(N_\nu=2.98\): tres familias.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Para neutrinos de \(\Delta m^2=2.5\times10^{-3}\) eV\(^2\), mezcla máxima y \(E=0.6\) GeV, halle el primer máximo de oscilación, la probabilidad en 295 km (T2K), y la distancia del primer máximo con \(E=1\) GeV.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Primer máximo.</b> \(1.267\,\Delta m^2L/E=\pi/2\Rightarrow L=\pi E/(2\times1.267\,\Delta m^2)=297.6\) km.</li>
<li><b>A 295 km.</b> \(P=\sin^2(1.267\times2.5\times10^{-3}\times295/0.6)=\sin^2(1.5575)=0.9998\).</li>
<li><b>Con 1 GeV.</b> \(L_1=496\) km.</li>
<li><b>Resultado.</b> <span class="ans">297.6 km; 0.9998; 496 km.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Con las masas del PDG de N (938.9), Λ (1115.68), Σ (1193.2) y Ξ (1318.3), comprobar Gell-Mann–Okubo, y predecir la masa del Ω⁻ por espaciado igual de Δ (1232), Σ* (1384.6) y Ξ* (1533.4 MeV).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Octete.</b> \(\tfrac12(m_N+m_\Xi)=\tfrac12(938.9+1318.3)=1128.6\) MeV (con las masas medias de cada multiplete del PDG).</li>
<li><b>Lado derecho.</b> \(\tfrac14(3\times1115.68+1193.2)=1135.1\) MeV: diferencia 0.6 %.</li>
<li><b>Espaciados.</b> \(1384.6-1232=152.6\); \(1533.4-1384.6=148.8\) MeV.</li>
<li><b>Predicción.</b> \(m_{\Omega^-}\approx1533.4+148.8=1682\) MeV (Gell-Mann: 1685).</li>
<li><b>Medida.</b> 1672.45 MeV (la diferencia, 0.6 %).</li>
<li><b>Resultado.</b> <span class="ans">1128.6 y 1135.1 MeV; Ω⁻ ≈ 1682 MeV (medido 1672.45).</span></li>
</ol></details></li>
</ol>
