<template class="chapter-src" data-id="bohr" data-num="10" data-title="Átomo de Bohr, espectros, Franck–Hertz y Moseley" data-part="Parte II · Cuantos de luz y de materia" data-short="La dispersión de Rutherford y el núcleo atómico, los espectros de líneas y la fórmula de Rydberg, el modelo de Bohr con masa reducida (deuterio, positronio, hidrógeno muónico), el experimento de Franck y Hertz y la ley de Moseley">
<p class="lead">Con los fotones de Planck y Einstein y las ondas de materia de de Broglie ya se puede abordar el problema que dio sentido a todos ellos: la estructura del átomo. Este capítulo reconstruye el camino que llevó del átomo de Thomson al de Bohr, con las tres pruebas experimentales que lo sostienen: el descubrimiento del núcleo (Geiger, Marsden y Rutherford), los espectros de líneas, la existencia de niveles discretos de energía (Franck y Hertz) y la identificación del número atómico con la carga nuclear (Moseley). El modelo de Bohr es una teoría provisional, que mezcla física clásica y cuantización, pero sus predicciones (los niveles del hidrógeno, las series espectrales, el efecto de la masa reducida) son cuantitativamente exactas, y marca el punto en que la teoría cuántica deja de ser un conjunto de excepciones.</p>

<section>
<h2>El núcleo: la dispersión de Rutherford</h2>
<p>En 1904 Thomson propuso un átomo como una esfera difusa de carga positiva con electrones incrustados (el «pudín de pasas»). Un haz de partículas \(\alpha\) (núcleos de helio de unos 5–8 MeV) que atraviesa ese átomo se desviaría muy poco, del orden de una fracción de grado por átomo, porque el campo eléctrico de una esfera de radio \(10^{-10}\) m es modesto. En 1909 Geiger y Marsden, en el laboratorio de Rutherford, midieron la dispersión de partículas \(\alpha\) por láminas finas de oro y encontraron que una de cada varios miles se dispersaba a más de 90°: «era como disparar un proyectil de 15 pulgadas a un trozo de papel de seda y que este rebotara». Rutherford (1911) concluyó que la carga positiva y casi toda la masa estaban concentradas en un núcleo mucho más pequeño que el átomo.</p>
<h3>La fórmula de Rutherford</h3>
<p>Una partícula \(\alpha\) de carga \(2e\) y energía cinética \(K\) que se acerca a un núcleo de carga \(Ze\) (con una masa mucho mayor, en reposo) con parámetro de impacto \(b\) describe una hipérbola por la fuerza de Coulomb repulsiva. Con la conservación de la energía y del momento angular, y definiendo la distancia de máximo acercamiento en un choque frontal, \(d_0=2Ze^2/(4\pi\varepsilon_0K)\):</p>
<div class="eq key" data-name="Dispersión de Rutherford">\[\tan\frac\theta2=\frac{d_0}{2b},\qquad r_\text{mín}=\frac{d_0}2\Bigl[1+\sqrt{1+\bigl(2b/d_0\bigr)^2}\Bigr],\qquad \frac{\dd\sigma}{\dd\Omega}=\Bigl(\frac{d_0}4\Bigr)^2\frac1{\operatorname{sen}^4(\theta/2)},\qquad \sigma(\theta\gt\theta_0)=\pi\Bigl(\frac{d_0}2\Bigr)^2\cot^2\frac{\theta_0}2.\]</div>
<p>Se obtienen a partir de \(b=(d_0/2)\cot(\theta/2)\) (la sección diferencial es \(b\,\dd b/(\sen\theta\,\dd\theta)\)). La ley \(1/\sen^4(\theta/2)\) concuerda con la medida de Geiger y Marsden a ángulos entre 5° y 150°, con 5 órdenes de magnitud de variación de la intensidad, y valida la hipótesis nuclear. Para \(\alpha\) de 7.69 MeV (las del \(^{214}\)Po, usadas por Geiger y Marsden) sobre oro: \(d_0=2(79)(1.44\ \text{MeV·fm})/7.69\ \text{MeV}=29.59\) fm, mucho mayor que el radio nuclear del oro, \(R\approx1.2A^{1/3}=6.98\) fm: la partícula \(\alpha\) nunca llega a tocarlo, y el núcleo se comporta como una carga puntual. A \(\theta=90^\circ\), \(b=d_0/2=14.8\) fm; a 150°, \(b=0.134\,d_0=3.96\) fm; \(b\) es unas \(10^{-5}\) veces el radio del átomo, de donde se deduce que la dispersión grande es un solo choque con un núcleo y no la suma de muchas pequeñas desviaciones. La ley se rompe cuando la energía basta para que la \(\alpha\) toque el núcleo y entren en juego las fuerzas nucleares: para el oro a unos 26 MeV, y para el aluminio ya a 7.7 MeV (Rutherford y Chadwick, 1921).</p>
<div class="box ex"><h4>Partículas α de 7.69 MeV sobre una lámina de oro</h4>
<p><strong>Datos.</strong> \(K=7.69\) MeV, \(Z=79\), \(A=197\), \(n=5.90\times10^{28}\) m\(^{-3}\), espesor 0.4 µm. <strong>Procedimiento.</strong> (1) \(d_0=29.59\) fm. (2) Choque con \(\theta=90^\circ\): \(b=d_0/2=14.79\) fm y \(r_\text{mín}=\tfrac12d_0(1+\sqrt2)=35.7\) fm. (3) Sección para \(\theta\gt90^\circ\): \(\pi(d_0/2)^2=6.87\times10^{-28}\) m\(^2\) (6.9 barns). (4) Fracción dispersada a más de 90° con un espesor \(t\): \(nt\sigma=5.90\times10^{28}\times4\times10^{-7}\times6.87\times10^{-28}=1.62\times10^{-5}\), una de cada 62 000. (5) Cociente de intensidades entre 10° y 150°: \((\sen75^\circ/\sen5^\circ)^4=1.51\times10^4\). <strong>Resultado.</strong> Una \(\alpha\) de cada 62 000 rebota hacia atrás (más de 90°) en una lámina de oro de 0.4 µm: imposible en el modelo de Thomson, donde la desviación típica es de una fracción de grado.</p></div>
<div class="sim" data-sim="rutherford" data-title="Dispersión de Rutherford: trayectorias de partículas α, ángulo y sección eficaz"></div>
<div class="sim-guide"><ul>
<li>Con 7.69 MeV sobre oro, \(b=0.5\,d_0\): \(\theta=90.00^\circ\), distancia mínima 35.7 fm y \(d_0=29.59\) fm, frente a un radio de contacto de 8.7 fm. La fracción dispersada a más de 90° para 0.4 µm es \(1.62\times10^{-5}\).</li>
<li>Con el aluminio (\(Z=13\)) a 7.69 MeV, \(d_0=4.87\) fm es menor que el radio de contacto (\(1.2\cdot27^{1/3}+1.7=5.3\) fm): la \(\alpha\) alcanza el núcleo y la ley de Rutherford deja de valer.</li>
<li>A medida que baja \(b\) la trayectoria se acerca a la inversión: con \(b=0.03\,d_0\), \(\theta=173.1^\circ\) y la \(\alpha\) llega a \(1.001\,d_0\). La curva de la derecha cae casi \(10^5\) veces entre 10° y 150°.</li>
</ul></div>
</section>

<section>
<h2>Espectros de líneas y el átomo de Bohr</h2>
<p>Kirchhoff y Bunsen (1859) establecieron que cada elemento emite y absorbe luz solo en líneas de longitudes de onda características. En 1885 Balmer encontró que las del hidrógeno visible obedecen una regla numérica, y Rydberg (1888) la generalizó:</p>
<div class="eq key" data-name="Fórmula de Rydberg">\[\frac1\lambda=R\left(\frac1{n_f^2}-\frac1{n_i^2}\right),\quad n_i\gt n_f,\qquad R_\infty=1.097\,373\times10^7\ \text{m}^{-1}.\]</div>
<p>\(n_f=1\) es la serie de Lyman (ultravioleta, desde 121.57 nm hasta el límite en 91.18 nm), 2 la de Balmer (visible, 364.7–656.5 nm), 3 la de Paschen (infrarrojo: 820.6–1875.6 nm) y 4 la de Brackett (hasta 4.05 µm). Un modelo planetario no podía explicarlo: un electrón acelerado radiaría y caería al núcleo en unos \(10^{-11}\) s, emitiendo un espectro continuo. Bohr (1913) propuso, abandonando la electrodinámica dentro del átomo, dos postulados: (i) existen órbitas estacionarias, en las que el electrón no irradia, con momento angular \(L=mvr=n\hbar\); (ii) la luz se emite o absorbe al saltar entre ellas, con \(h\nu=E_i-E_f\). Con la fuerza de Coulomb como fuerza centrípeta, \(mv^2/r=Ze^2/(4\pi\varepsilon_0r^2)\), se despeja:</p>
<div class="eq key" data-name="Niveles de Bohr con masa reducida">\[r_n=\frac{n^2}Z\,\frac{4\pi\varepsilon_0\hbar^2}{\mu e^2},\qquad v_n=\frac{Z\alpha c}n,\qquad E_n=-\frac{\mu c^2\alpha^2Z^2}{2n^2}=-\frac{Z^2}{n^2}\,Ry\,\frac\mu{m_e},\qquad Ry=13.605\,693\ \text{eV},\]</div>
<p>con \(\mu=m_eM/(m_e+M)\) la masa reducida del par electrón–núcleo (el núcleo también se mueve) y \(\alpha=e^2/(4\pi\varepsilon_0\hbar c)\approx1/137.036\) la constante de estructura fina. Con \(\hbar\nu=E_i-E_f\) se obtiene la fórmula de Rydberg con \(R_M=R_\infty\mu/m_e\): sin parámetros libres. Así, para el hidrógeno \(R_H=10\,967\,758.34\) m\(^{-1}\), y la línea Hα (\(3\to2\)) está en 656.470 nm (en el vacío), Hβ en 486.274 nm, Hγ en 434.173 nm y Hδ en 410.294 nm; el límite de la serie de Balmer en 364.705 nm. La masa reducida permitió a Urey (1932) descubrir el deuterio: su Hα está en 656.291 nm, 0.179 nm por debajo de la del hidrógeno, y la línea azul de Pickering (\(4\to3\)) de la estrella \(\zeta\) Puppis, atribuida al hidrógeno, se reveló como la del \(\text{He}^+\) (\(Z=2\)): 468.716 nm, una prueba temprana de Bohr. El mismo modelo da el átomo de <span class="term">positronio</span> (\(e^-e^+\), \(\mu=m_e/2\)): \(E_1=-6.803\) eV, radio \(2a_0=105.8\) pm, la línea Lyman-\(\alpha\) del positronio a 243.0 nm; y el <span class="term">hidrógeno muónico</span> (\(\mu^-p\), \(\mu=185.84\,m_e\)): \(E_1=-2528.5\) eV, \(a=284.7\) fm y una línea \(2p\to1s\) de rayos X de 1.896 keV. El principio de correspondencia de Bohr afirma que para \(n\) grande la frecuencia de la luz emitida en \(n\to n-1\) coincide con la frecuencia orbital: un puente con la física clásica.</p>
<div class="sim" data-sim="bohr" data-title="Niveles de Bohr, series espectrales e isótopos"></div>
<div class="sim-guide"><ul>
<li>Hidrógeno, Balmer, \(n_i=3\): 656.47 nm; las cuatro líneas visibles (Hα, Hβ, Hγ, Hδ) entre 656 y 410 nm. Lyman (91–122 nm) está en el ultravioleta lejano; Paschen (0.82–1.88 µm) y Brackett (1.46–4.05 µm), en el infrarrojo.</li>
<li>Con deuterio, la línea de Balmer pasa a 656.29 nm. Con \(\text{He}^+\) y \(n_f=3\), \(n_i=4\): 468.72 nm (línea de Pickering); la energía de ionización del \(\text{He}^+\) es \(4Ry=54.42\) eV.</li>
<li>El modelo falla para átomos con más de un electrón, no da las intensidades ni la estructura fina, y viola la incertidumbre (supone una trayectoria definida); además predice un estado fundamental con \(L=\hbar\), cuando el verdadero tiene \(L=0\). La ecuación de Schrödinger (capítulo 14) reproduce los niveles \(E_n\) y mucho más.</li>
</ul></div>
<div class="box warn"><h4>Qué se salvó del modelo de Bohr</h4><p>Quedaron los niveles de energía discretos, los saltos con emisión o absorción de un fotón (\(h\nu=\Delta E\)) y la fórmula de Rydberg; se descartaron las órbitas con trayectoria definida y el momento angular \(n\hbar\) (el momento angular de la teoría cuántica es \(\sqrt{l(l+1)}\,\hbar\) con \(l\le n-1\)). La coincidencia entre ambos es una propiedad del potencial de Coulomb: los niveles de Schrödinger dependen solo de \(n\) y valen \(-Ry/n^2\).</p></div>
</section>

<section>
<h2>El experimento de Franck y Hertz</h2>
<p>Los espectros sugerían niveles discretos, pero ¿se podía demostrar su existencia con un método independiente de la luz? Franck y Hertz (1914) lo hicieron con electrones. En un tubo con vapor de mercurio, los electrones emitidos por un cátodo se aceleran hacia una rejilla con un voltaje variable \(V\); tras la rejilla hay un ánodo con un pequeño potencial retardador (\(\sim\)1.5 V) que bloquea a los electrones que han perdido casi toda su energía. La corriente en el ánodo, en lugar de crecer de forma monótona, <em>cae bruscamente</em> a intervalos de unos 4.9 V. Explicación: mientras la energía del electrón es menor que la del primer nivel excitado del mercurio, 4.887 eV, solo hay colisiones elásticas, casi sin pérdida; al llegar a 4.887 eV puede excitar un átomo y perder esa energía de golpe (queda con poca para vencer el retardador); al seguir subiendo \(V\), el electrón vuelve a acelerarse y a excitar de nuevo, con mínimos a \(V\approx n\times4.9\) V más un desplazamiento. Y a la vez, el tubo emite la línea ultravioleta de 253.7 nm, \(hc/4.887\ \text{eV}\): la misma energía vista de dos maneras. (Franck y Hertz creyeron al principio que medían el potencial de ionización; fue Bohr quien aclaró que era un potencial de excitación.) El experimento recibió el Nobel de 1925.</p>
<div class="sim" data-sim="franck" data-title="Franck–Hertz: corriente frente al voltaje (simulación de Monte Carlo)"></div>
<div class="sim-guide"><ul>
<li>Con mercurio y los valores por defecto aparecen mínimos de corriente en 5.8, 10.7, 15.6, 20.4 y 25.3 V, separados unos 4.9 V (\(E_{ex}/e=4.887\) V); el tubo emite a 253.7 nm. Con un camino libre medio mayor (0.1) los mínimos se hacen menos profundos y terminan por desaparecer. Con un potencial retardador de 3 V los mínimos se desplazan hacia voltajes mayores (6.4, 11.8, 17.1 V, frente a 5.8, 10.7, 15.6 V con 1.5 V).</li>
<li>Con neón (excitación a unos 18.7 eV) el espaciado es de unos 19 V. En el experimento real con neón se ven bandas luminosas (anaranjadas) en el tubo en las zonas donde los electrones excitan los átomos.</li>
<li>El modelo es simple (colisiones sucesivas con pérdida fija de \(E_{ex}\) con probabilidad 0.9), pero reproduce lo esencial: la periodicidad de la corriente es la del nivel de excitación.</li>
</ul></div>
</section>

<section>
<h2>La ley de Moseley</h2>
<p>En 1913, el joven físico inglés Henry Moseley (a la edad de 25 años) midió la frecuencia de las líneas \(K_\alpha\) de unos 38 elementos, del aluminio al oro, y encontró una relación simple. Con el modelo de Bohr, el electrón de la capa \(K\) que cae a un hueco en \(K\) desde la capa \(L\) ve la carga nuclear \(Ze\) apantallada por el otro electrón de la capa \(K\) (\(Z-1\)), de modo que</p>
<div class="eq key" data-name="Ley de Moseley">\[h\nu_{K\alpha}\simeq Ry\,(Z-\sigma)^2\Bigl(1-\frac14\Bigr)=\tfrac34\,Ry\,(Z-\sigma)^2,\quad\sigma\approx1,\qquad \text{o}\quad \sqrt{\nu_{K\alpha}}=a\,(Z-\sigma),\ \ a=\sqrt{\tfrac34cR_\infty}.\]</div>
<p>\(\sqrt\nu\) crece linealmente con \(Z\): una recta, sin curvatura, para todos los elementos. Moseley interpretó \(Z\) como la carga del núcleo (y no la masa atómica) y concluyó que debía haber elementos todavía no descubiertos con \(Z=43,61,72,75\): se descubrieron después (tecnecio, 1937; prometio, 1945; hafnio, 1923; renio, 1925). Reordenó la tabla periódica y resolvió los «pares invertidos» de Mendeléiev (Ar–K, Co–Ni, Te–I). Moseley murió en combate en Gallipoli en 1915 a los 27 años. Con las líneas \(K\alpha_1\) tabuladas (Elam, Ravel y Sieber, 2002), un ajuste lineal de \(\sqrt E\) frente a \(Z\) para \(Z=12\)–30 (Mg, Ca, Ti, Cr, Fe, Co, Cu, Zn) da \(a=3.1973\) eV\(^{1/2}\) (el de Bohr: \(\sqrt{\tfrac34Ry}=3.1944\), una diferencia de 0.09 %) y \(\sigma=0.963\); para \(Z\) alto aparecen correcciones relativistas y la pendiente sube.</p>
<div class="sim" data-sim="moseley" data-title="Ley de Moseley: ajuste de las líneas Kα y determinación de Z"></div>
<div class="sim-guide"><ul>
<li>Con el ajuste hasta \(Z=30\) (Mg, Ca, Ti, Cr, Fe, Co, Cu y Zn): \(a=3.1973\) y \(\sigma=0.963\). Un elemento con \(K\alpha=8.05\) keV tiene \(Z=29.09\): cobre. Con el ajuste hasta \(Z=47\): \(a=3.2457\), \(\sigma=1.284\); hasta \(Z=79\): \(a=3.3851\), \(\sigma=2.377\).</li>
<li>La fórmula de Bohr subestima la energía de las líneas de los elementos pesados: para el wolframio (\(Z=74\)) da 54.4 keV frente a 59.3 keV medidos (8 %); para el oro, 62.1 frente a 68.8 keV. La razón es relativista: los electrones de la capa \(K\) tienen \(v/c=Z\alpha\sim0.5\).</li>
<li>La recta continua de Bohr, \(\sqrt{\tfrac34Ry}(Z-1)\), pasa por los puntos de Moseley con una discrepancia de 1–2 % a bajo \(Z\): una de las confirmaciones más precisas del modelo de Bohr, y la prueba de que \(Z\) y no \(A\) ordena los elementos.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Partículas \(\alpha\) de 7.69 MeV inciden sobre oro (\(Z=79\)). Halle \(d_0\), el parámetro de impacto para dispersión a 90° y a 150°, la distancia mínima en el caso de 90° y la fracción dispersada a más de 90° por una lámina de 0.4 µm (\(n=5.90\times10^{28}\) m\(^{-3}\)).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>\(d_0\).</b> \(d_0=2Ze^2/(4\pi\varepsilon_0K)=2(79)(1.43996)/7.69=29.59\) fm.</li>
<li><b>Parámetros de impacto.</b> \(b=(d_0/2)\cot(\theta/2)\): 90°, \(b=14.79\) fm; 150°, \(b=14.79\times\cot75^\circ=3.96\) fm.</li>
<li><b>\(r_\text{mín}\).</b> Con \(\theta=90^\circ\): \(\tfrac12d_0[1+\sqrt{1+1}]=14.79\times2.4142=35.71\) fm.</li>
<li><b>Fracción.</b> \(\sigma=\pi(d_0/2)^2=\pi(14.79\times10^{-15})^2=6.87\times10^{-28}\) m\(^2\); \(nt\sigma=5.90\times10^{28}\times4\times10^{-7}\times6.87\times10^{-28}=1.62\times10^{-5}\).</li>
<li><b>Resultado.</b> <span class="ans">29.59 fm; 14.79 fm y 3.96 fm; 35.7 fm; \(1.62\times10^{-5}\) (1 en 62 000).</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Con \(R_H=10\,967\,758.34\) m\(^{-1}\) halle las longitudes de onda en el vacío de Hα, Hβ, Hγ y del límite de la serie de Balmer, la primera línea de Lyman y la de Paschen \(\alpha\); y el desplazamiento isotópico de Hα entre hidrógeno y deuterio (\(R_D=10\,970\,742.66\) m\(^{-1}\)).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Hα.</b> \(1/\lambda=R_H(1/4-1/9)=R_H(5/36)=1\,523\,299.8\) m\(^{-1}\Rightarrow\lambda=656.470\) nm.</li>
<li><b>Hβ y Hγ.</b> \(R_H(3/16)\Rightarrow486.274\) nm; \(R_H(21/100)\Rightarrow434.173\) nm. Límite: \(4/R_H=364.705\) nm.</li>
<li><b>Lyman α.</b> \(R_H(3/4)\Rightarrow121.568\) nm. <b>Paschen α.</b> \(R_H(1/9-1/16)\Rightarrow1875.63\) nm.</li>
<li><b>Deuterio.</b> \(\lambda_D=36/(5R_D)=656.291\) nm; \(\Delta\lambda=656.470-656.291=0.179\) nm.</li>
<li><b>Resultado.</b> <span class="ans">656.470, 486.274, 434.173, 364.705 nm; 121.568 nm; 1875.63 nm; 0.179 nm.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Halle para el positronio y el hidrógeno muónico (\(m_\mu=206.768\,m_e\)) la energía del estado fundamental, el radio de Bohr y la longitud de onda (o energía) de la línea \(2\to1\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Positronio.</b> \(\mu=m_e/2\): \(E_1=-Ry/2=-6.803\) eV; \(a=2a_0=105.84\) pm; \(2\to1\): \(\tfrac34(6.803)=5.102\) eV, \(\lambda=1239.84/5.102=243.0\) nm.</li>
<li><b>Muónico.</b> \(\mu=m_\mu m_p/(m_\mu+m_p)=185.84\,m_e\). \(E_1=-13.6057\times185.84=-2528.5\) eV; \(a=a_0/185.84=284.7\) fm.</li>
<li><b>Línea \(2\to1\).</b> \(\tfrac34(2528.5)=1896.4\) eV \(=1.896\) keV (rayos X blandos, \(\lambda=0.654\) nm).</li>
<li><b>Resultado.</b> <span class="ans">−6.803 eV, 105.8 pm, 243.0 nm; −2528.5 eV, 284.7 fm, 1.896 keV.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>En un tubo de Franck–Hertz de mercurio se observan mínimos de corriente a 6.1, 11.0, 15.9 y 20.8 V. Halle el espaciado, el desplazamiento del primer mínimo respecto del potencial de excitación, y la longitud de onda de la luz que emiten los átomos al volver al estado fundamental.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Espaciado.</b> \((20.8-6.1)/3=4.90\) V, igual a \(E_{ex}/e\) con \(E_{ex}=4.887\) eV.</li>
<li><b>Desplazamiento.</b> \(6.1-4.887=1.2\) V: suma del potencial retardador y de la diferencia de potenciales de contacto entre cátodo y rejilla.</li>
<li><b>Luz emitida.</b> \(\lambda=hc/E_{ex}=1239.84/4.887=253.7\) nm (ultravioleta).</li>
<li><b>Resultado.</b> <span class="ans">4.90 V; 1.2 V; 253.7 nm.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Con la ley de Moseley (\(a=3.1973\) eV\(^{1/2}\), \(\sigma=0.963\)) determine \(Z\) de elementos cuyas líneas \(K\alpha_1\) están en 8.046 keV y 17.48 keV, y compare la energía de cobre con la predicha por \(\tfrac34Ry(Z-1)^2\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>\(Z\) desde \(E\).</b> \(Z=\sqrt E/a+\sigma\). Para 8046.3 eV: \(\sqrt E=89.70\), \(Z=89.70/3.1973+0.963=29.02\Rightarrow\) cobre.</li>
<li><b>17.48 keV.</b> \(\sqrt{17\,480}=132.21\); \(Z=41.35+0.963=42.3\Rightarrow\) molibdeno (\(Z=42\)); el valor sale algo alto porque la recta se ajustó solo con \(Z\le30\).</li>
<li><b>Bohr para el cobre.</b> \(\tfrac34(13.6057)(28)^2=8000.1\) eV: 0.57 % menos que lo medido (8046.3 eV).</li>
<li><b>Resultado.</b> <span class="ans">\(Z=29\) (Cu) y \(Z=42\) (Mo); la fórmula de Bohr da 8.000 keV para el Cu.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Demuestre el principio de correspondencia en el átomo de hidrógeno: para \(n\gg1\) la frecuencia de la transición \(n\to n-1\) tiende a la frecuencia orbital clásica. Calcule ambas para \(n=100\) y compárelas.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Frecuencia orbital.</b> \(f_\text{orb}=v_n/2\pi r_n\). Con \(v_n=\alpha c/n\) y \(r_n=n^2a_0\): \(f_\text{orb}=\alpha c/(2\pi a_0n^3)=2cR_\infty/n^3\) (pues \(R_\infty=\alpha/4\pi a_0\)).</li>
<li><b>Frecuencia de transición.</b> \(f=cR_\infty[1/(n-1)^2-1/n^2]=cR_\infty(2n-1)/[n^2(n-1)^2]\to2cR_\infty/n^3\) cuando \(n\to\infty\).</li>
<li><b>Para \(n=100\).</b> \(cR_\infty=3.28984\times10^{15}\) Hz. \(f_\text{orb}=6.5797\times10^{9}\) Hz; \(f=3.28984\times10^{15}\times2.0304\times10^{-6}=6.6797\times10^9\) Hz.</li>
<li><b>Comparación.</b> Cociente \(f/f_\text{orb}=1.0152\): coinciden al 1.5 %, y el error disminuye como \(1/n\).</li>
<li><b>Resultado.</b> <span class="ans">\(6.580\times10^9\) Hz y \(6.680\times10^9\) Hz; cociente 1.015.</span></li>
</ol></details></li>
</ol>
