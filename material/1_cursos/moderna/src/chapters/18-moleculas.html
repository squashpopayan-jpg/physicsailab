<template class="chapter-src" data-id="moleculas" data-num="18" data-title="Moléculas: enlace, rotación y vibración" data-part="Parte IV · Átomos, luz y moléculas" data-short="La aproximación de Born–Oppenheimer, el enlace químico en el ion H₂⁺ (LCAO), la rotación de las moléculas diatómicas y su espectro, el espectro de vibración–rotación (HCl, CO) y el efecto Raman rotacional con la estadística nuclear">
<p class="lead">Una molécula es un conjunto de núcleos y electrones. Como los núcleos son miles de veces más pesados, se mueven mucho más despacio, y esto separa el problema en tres escalas de energía muy distintas: electrónica (eV), vibracional (décimas de eV) y rotacional (meV). Este capítulo construye esa jerarquía: el enlace químico en el sistema molecular más sencillo, H₂⁺, calculado por combinación lineal de orbitales atómicos; la rotación de las diatómicas y su espectro de microondas; la vibración–rotación del infrarrojo (con el HCl y el CO) y el espectro Raman rotacional del N₂, donde la estadística de los núcleos idénticos deja una huella directa en las intensidades. Las integrales del enlace se comprueban por cuadratura numérica, y las constantes espectroscópicas por diagonalización de la ecuación radial.</p>

<section>
<h2>Aproximación de Born–Oppenheimer y enlace covalente</h2>
<p>La función de onda molecular se aproxima como \(\Psi=\psi_{\rm el}(\mathbf r;R)\,\chi_{\rm nuc}(R)\): para cada distancia \(R\) entre los núcleos se resuelve el problema electrónico con los núcleos fijos, y la energía \(E(R)\) (incluida la repulsión nuclear \(1/R\)) hace de potencial para el movimiento nuclear. El parámetro de la expansión es \(\kappa=(m_e/M)^{1/4}\approx0.1\) (Born y Oppenheimer), y es lo que permite hablar de «la curva de energía potencial» de una molécula.</p>
<p>El caso más sencillo es el ion H₂⁺: dos protones y un electrón. Con la combinación lineal de orbitales atómicos \(\psi_\pm=(\phi_A\pm\phi_B)/\sqrt{2(1\pm S)}\), donde \(\phi_{A,B}\) son los orbitales 1s centrados en cada protón, las integrales se calculan en forma cerrada (unidades atómicas, \(R\) en \(a_0\)):</p>
<div class="eq key" data-name="Integrales del ion H₂⁺ (LCAO)">\[S=e^{-R}\Bigl(1+R+\tfrac{R^2}{3}\Bigr),\quad j=\frac1R-e^{-2R}\Bigl(1+\frac1R\Bigr),\quad k=e^{-R}(1+R),\quad E_\pm(R)=-\frac12+\frac1R-\frac{j\pm k}{1\pm S}.\]</div>
<p>Las tres integrales se comprobaron contra una cuadratura numérica bidimensional en coordenadas esferoidales prolatas, y las energías contra la diagonalización del problema generalizado \(\mathbf H\mathbf c=E\mathbf S\mathbf c\) con esas integrales (precisión de \(10^{-8}\)). El orbital \(\sigma_g\) (suma, densidad acumulada entre los núcleos) tiene un mínimo: \(R_e=2.49\,a_0=1.32\) Å y \(D_e=1.76\) eV; el \(\sigma_u\) (diferencia, con nodo entre los núcleos) es repulsivo para todo \(R\). El resultado exacto del problema (Bates, Ledsham y Stewart, 1953) es \(R_e=2.00\,a_0\) y \(D_e=2.79\) eV: la LCAO subestima la ligadura, como cabe esperar de un método variacional con base mínima, pero da la física esencial: el enlace es la acumulación de carga entre los núcleos que permite que el electrón sienta ambos y reduce su energía cinética.</p>
<div class="sim" data-sim="enlace" data-title="Enlace en H₂⁺: orbitales σ_g y σ_u, curvas de energía y densidad electrónica"></div>
<div class="sim-guide"><ul>
<li>Con \(R=2.49\,a_0\) el punto se sitúa en el mínimo de \(\sigma_g\): \(-1.76\) eV respecto de H + H⁺. La densidad (mapa de calor) se concentra entre los dos núcleos, y con \(\sigma_u\) hay un plano nodal entre ellos y la energía es positiva.</li>
<li>Para \(R\to\infty\), \(S\to0\) y las dos curvas tienden a 0 (átomo + protón): la molécula se disocia. A \(R=2\,a_0\): \(S=0.586\), \(E_+=-1.46\) eV y \(E_-=+9.23\) eV respecto del límite.</li>
<li>Para \(R\to0\) las dos energías divergen por la repulsión nuclear \(1/R\).</li>
</ul></div>
<p>En el H₂ neutro, el método de Heitler y London (1927) con dos electrones da una ligadura de unos 3.1 eV, y los cálculos modernos con funciones de correlación (Kołos y Wolniewicz) dan \(D_e=4.748\) eV, es decir, \(D_0=4.478\) eV al restar la energía del punto cero: coinciden con el experimento. Fue el primer cálculo cuántico del enlace químico, y demostró que no es una fuerza nueva sino la repulsión de Coulomb y la antisimetría de los electrones, vistas con la ecuación de Schrödinger.</p>
</section>

<section>
<h2>Rotación de moléculas diatómicas</h2>
<p>Con la longitud del enlace fija, una molécula diatómica es un rotor rígido con momento de inercia \(I=\mu r^2\) y energías \(E_J=\dfrac{\hbar^2}{2I}J(J+1)=hcB\,J(J+1)\), con la <span class="term">constante rotacional</span> \(B=h/8\pi^2cI\) (en cm\(^{-1}\)). Las transiciones de dipolo (\(\Delta J=\pm1\), solo moléculas con momento dipolar permanente) absorben en \(\tilde\nu=2B(J+1)\): líneas equiespaciadas, separadas \(2B\). Para el CO, con \(\mu=6.8562\) u y \(r=1.1283\) Å, \(I=1.449\times10^{-46}\) kg m\(^2\) y \(B_e=1.9314\) cm\(^{-1}\); la línea \(J=0\to1\) con la constante medida \(B_0=1.92253\) cm\(^{-1}\) cae en 115.27 GHz (2.6 mm), la más usada de la radioastronomía molecular. De la separación de las líneas se mide la distancia de enlace con una precisión de milésimas de ångström: es la mejor manera de «ver» la geometría de una molécula. El efecto isotópico confirma la masa reducida: \(B(^{13}\text{CO})/B(^{12}\text{CO})=\mu_{12}/\mu_{13}=0.9559\).</p>
<p>A temperatura \(T\) los niveles se pueblan según Boltzmann con degeneración \(2J+1\): \(N_J\propto(2J+1)e^{-hcBJ(J+1)/k_BT}\), con un máximo en \(J_{\max}=\sqrt{k_BT/2hcB}-\tfrac12\) y función de partición \(Z\approx k_BT/hcB\). Para el CO a 300 K: \(k_BT=208.5\) cm\(^{-1}\), \(J_{\max}=6.86\) (el nivel más poblado es \(J=7\), con el 8.2 % de las moléculas) y \(Z=108.8\).</p>
<p><strong>Estadística nuclear.</strong> En una molécula homonuclear, el intercambio de los dos núcleos idénticos fuerza una simetría sobre la función de onda total, y por tanto los niveles de \(J\) par e impar tienen pesos distintos. En el H₂ (protones, espín ½, fermiones) los niveles con \(J\) impar (espín nuclear triplete, <em>orto</em>) pesan 3 y los de \(J\) par (singlete, <em>para</em>), 1; en el N₂ (núcleos \(^{14}\)N, espín 1, bosones) el peso es 6 para \(J\) par y 3 para \(J\) impar. A altas temperaturas, el H₂ tiene 3/4 de ortohidrógeno; a 77 K el equilibrio es 48 % orto y a 20 K, solo 0.14 %. El hidrógeno líquido recién licuado, con 75 % de orto, se convierte lentamente en para liberando calor, y se usan catalizadores para que no se evapore durante el almacenamiento.</p>
<div class="sim" data-sim="rotacion" data-title="Espectro rotacional: poblaciones térmicas, líneas y estadística nuclear"></div>
<div class="sim-guide"><ul>
<li>Con CO a 300 K: líneas en 3.845, 7.69, 11.53 cm⁻¹ (115.27, 230.54, 345.82 GHz), y la población máxima en \(J=7\); la intensidad de las líneas sigue \((J+1)e^{-E_J/kT}\) y tiene un máximo en el mismo lugar.</li>
<li>Con ¹³CO las líneas se desplazan hacia abajo un 4.5 % (masa reducida mayor): así se detectan las especies isotópicas en el medio interestelar.</li>
<li>Con H₂ (barras naranja = \(J\) impar, peso 3) y N₂ (peso 2:1 en \(J\) par) se ve la alternancia de intensidades; a 10 K el H₂ casi no tiene más que \(J=0\).</li>
</ul></div>
</section>

<section>
<h2>Vibración–rotación y Raman</h2>
<p>La energía de una molécula en el nivel vibracional \(v\) y rotacional \(J\) es, aproximadamente, \(E=G(v)+F_v(J)\), con \(G(v)=\omega_e(v+\tfrac12)-\omega_ex_e(v+\tfrac12)^2\) y \(F_v(J)=B_vJ(J+1)-D_vJ^2(J+1)^2\), donde \(B_v=B_e-\alpha_e(v+\tfrac12)\): la molécula se alarga al vibrar con amplitud y su momento de inercia crece, por lo que \(B\) disminuye. En el infrarrojo se absorbe con \(\Delta v=+1\) y \(\Delta J=\pm1\), con dos ramas: <strong>R</strong> (\(J\to J+1\)) a mayores números de onda y <strong>P</strong> (\(J\to J-1\)) a menores, separadas por un hueco central (\(\approx4B\)) donde estaría la rama Q (\(\Delta J=0\)), prohibida en las diatómicas de momento angular electrónico nulo. Con los parámetros del H\(^{35}\)Cl (\(\omega_e=2990.946\), \(\omega_ex_e=52.8186\), \(B_e=10.5934\), \(\alpha_e=0.30718\) cm\(^{-1}\)) se obtiene el origen \(\nu_0=\omega_e-2\omega_ex_e=2885.31\) cm\(^{-1}\), \(R(0)=2905.57\) y \(P(1)=2864.43\) cm\(^{-1}\), frente a los 2906.25 y 2865.09 medidos (diferencia 0.7 cm\(^{-1}\), de orden \(2\times10^{-4}\): términos de orden superior de Dunham que no se incluyen). Para el CO, \(R(0)=2147.05\) y \(P(1)=2139.39\) cm\(^{-1}\) (medidos: 2147.08 y 2139.43). La estructura del HCl muestra además un doblete por la mezcla isotópica del cloro (\(^{35}\)Cl y \(^{37}\)Cl, 3:1): por el cambio de masa reducida, el origen de la banda se desplaza \(\nu_0(1-\sqrt{\mu_{35}/\mu_{37}})=2.18\) cm\(^{-1}\), observado como doblete de unos 2 cm\(^{-1}\).</p>
<p>Las constantes se comprobaron resolviendo numéricamente la ecuación radial de un potencial de Morse con la parte centrífuga, \(-\tfrac{\hbar^2}{2\mu}u''+[V_{\rm Morse}(r)+\tfrac{\hbar^2J(J+1)}{2\mu r^2}]u=Eu\), con los parámetros del HCl (\(D_e=37270\) cm\(^{-1}\), \(r_e=1.2746\) Å) en una malla de \(4\times10^{-4}\) Å (scipy): las fórmulas de Pekeris para \(\alpha_e\), \(D_e\) y \(\beta_e\) reproducen las energías de vibración–rotación con un error relativo menor que \(2\times10^{-4}\) hasta \(J=10\) (es decir, 0.4 cm\(^{-1}\)). El potencial de Morse no es exacto para el HCl real: da \(\omega_ex_e=\omega_e^2/4D_e=60.0\) cm\(^{-1}\) frente al valor real, 52.82 cm\(^{-1}\).</p>
<h3>Efecto Raman rotacional</h3>
<p>En la dispersión Raman el fotón del láser cambia su frecuencia por una transición de la molécula. La regla de selección de las rotaciones puras es \(\Delta J=0,\pm2\) (la polarizabilidad es anisótropa), válida también para moléculas homonucleares, que no tienen espectro de microondas. Las líneas Stokes (\(J\to J+2\)) aparecen en \(-B(4J+6)\) respecto del láser: la primera, para el N₂ (\(B_0=1.98957\) cm\(^{-1}\)), en \(6B_0=11.94\) cm\(^{-1}\), y las siguientes a intervalos \(4B_0=7.96\) cm\(^{-1}\), con las antiStokes simétricas. De esta separación se obtiene la longitud del enlace del N₂, \(r_0=1.1001\) Å, sin necesidad de un dipolo. Las intensidades alternan por la estadística nuclear (6 : 3 para \(J\) par e impar): a 298 K, las dos primeras líneas Stokes (\(J=0\) y \(J=1\)) tienen una razón de 1.13 y la de \(J=2\) es 2.75 veces la de \(J=1\).</p>
<div class="sim" data-sim="rovib" data-title="Espectros de vibración–rotación (HCl, CO) y Raman rotacional (N₂)"></div>
<div class="sim-guide"><ul>
<li>Con HCl a 300 K, las líneas más intensas son R(2) y P(3); la rama R (azul) está a mayor número de onda y tiene líneas separadas algo menos de \(2B\) (19.6 cm\(^{-1}\) entre R(0) y R(1), frente a \(2B_e=21.2\)), y su separación disminuye al crecer \(J\) porque \(B_1<B_0\) (las ramas R se comprimen y las P se alejan).</li>
<li>El hueco central entre R(0) y P(1) mide 41.1 cm\(^{-1}\), cerca de 4B (42.4): la línea Q no existe.</li>
<li>Al subir la temperatura se pueblan más niveles de \(J\) altos y el espectro se ensancha: es un termómetro molecular.</li>
<li>Con el N₂ (Raman) se ve la alternancia de intensidades por el espín nuclear.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Para el ion H₂⁺ a \(R=2.0\,a_0\), calcule \(S\), \(j\), \(k\) y las energías \(E_\pm\) del enlazante y el antienlazante con la LCAO, y compare con la energía exacta \(-0.602634\) Ha.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Solapamiento.</b> \(S=e^{-2}(1+2+4/3)=0.1353\times4.3333=0.5865\).</li>
<li><b>Integrales.</b> \(j=1/2-e^{-4}(1+1/2)=0.4725\); \(k=e^{-2}(1+2)=0.4060\).</li>
<li><b>Enlazante.</b> \(E_+=-0.5+0.5-(0.4725+0.4060)/1.5865=-0.5538\) Ha.</li>
<li><b>Antienlazante.</b> \(E_-=-0.5+0.5-(0.4725-0.4060)/0.4135=-0.1609\) Ha.</li>
<li><b>Comparación.</b> \(E_+=-0.5538\) Ha es mayor que la exacta \(-0.6026\) Ha (principio variacional): la LCAO queda 0.049 Ha (1.3 eV) por encima.</li>
<li><b>Resultado.</b> <span class="ans">\(S=0.5865\), \(j=0.4725\), \(k=0.4060\); \(E_+=-0.5538\) Ha, \(E_-=-0.1609\) Ha.</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Halle la constante rotacional del CO (\(\mu=6.8562\) u, \(r=1.1283\) Å) y la frecuencia de la línea \(J=0\to1\), y compárela con la medida con \(B_0=1.92253\) cm\(^{-1}\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Momento de inercia.</b> \(I=\mu r^2=6.8562\times1.66054\times10^{-27}\times(1.1283\times10^{-10})^2=1.4494\times10^{-46}\) kg m\(^2\).</li>
<li><b>B.</b> \(B=h/(8\pi^2cI)=1.9314\) cm\(^{-1}\) (con \(c\) en cm/s).</li>
<li><b>Línea.</b> \(\nu=2Bc=2(1.9314)(2.998\times10^{10})=115.80\) GHz con \(B_e\); con \(B_0\): 115.27 GHz.</li>
<li><b>Resultado.</b> <span class="ans">\(B_e=1.9314\) cm⁻¹; 115.80 GHz (115.27 GHz con \(B_0\)).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Halle, para el CO a 300 K con \(B_0=1.92253\) cm\(^{-1}\), \(J_{\max}\), la función de partición y la fracción de moléculas en \(J=0\) y en el nivel más poblado.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>kT.</b> \(k_BT/hc=208.51\) cm\(^{-1}\).</li>
<li><b>J_max.</b> \(\sqrt{208.51/(2\times1.92253)}-0.5=6.86\): el nivel entero más poblado es \(J=7\).</li>
<li><b>Partición.</b> \(Z=\sum(2J+1)e^{-BJ(J+1)/kT}=108.8\) (comparar con \(kT/B=108.5\)).</li>
<li><b>Fracciones.</b> \(N_0/N=1/Z=0.92\) %; \(N_7/N=15\,e^{-1.92253\times56/208.51}/108.8=8.2\) %.</li>
<li><b>Resultado.</b> <span class="ans">\(J_{\max}=6.86\) (nivel 7); \(Z=108.8\); 0.92 % en \(J=0\) y 8.2 % en \(J=7\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Calcule la fracción de ortohidrógeno en equilibrio a 300 K y a 77 K (\(B=60.853\) cm\(^{-1}\)) y explique por qué es 3/4 a alta temperatura.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Fracción.</b> \(f=\dfrac{3\sum_{J\ \rm impar}(2J+1)e^{-E_J/kT}}{3\sum_{\rm impar}+\sum_{\rm par}}\).</li>
<li><b>300 K.</b> \(f=0.749\); <b>77 K.</b> \(f=0.479\).</li>
<li><b>Límite.</b> A \(T\to\infty\) las sumas pares e impares son iguales y \(f=3/(3+1)=0.75\); a 0 K solo queda \(J=0\) (para) y \(f=0\).</li>
<li><b>Resultado.</b> <span class="ans">0.749 (300 K), 0.479 (77 K), 0.75 en el límite clásico.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Con las constantes del H\(^{35}\)Cl, halle el origen de la banda, las líneas R(0) y P(1), el hueco central y el desplazamiento del origen para el isótopo H\(^{37}\)Cl.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Origen.</b> \(\nu_0=\omega_e-2\omega_ex_e=2990.946-105.637=2885.31\) cm\(^{-1}\).</li>
<li><b>R(0).</b> \(\nu_0+F_1(1)-F_0(0)=\nu_0+2(B_e-1.5\alpha_e)=2905.57\) cm\(^{-1}\) (la distorsión centrífuga aporta \(-0.002\) cm\(^{-1}\)).</li>
<li><b>P(1).</b> \(\nu_0-2(B_e-0.5\alpha_e)\) (con la distorsión centrífuga) \(=2864.43\) cm\(^{-1}\); hueco \(R(0)-P(1)=41.14\) cm\(^{-1}\) (4B = 42.37).</li>
<li><b>Isótopo.</b> \(\mu_{35}=0.97959\) u, \(\mu_{37}=0.98108\) u: \(\nu_0(1-\sqrt{\mu_{35}/\mu_{37}})=2885.31(1-0.999243)=2.18\) cm\(^{-1}\).</li>
<li><b>Resultado.</b> <span class="ans">2885.31; 2905.57; 2864.43 cm⁻¹; hueco 41.14 cm⁻¹; 2.18 cm⁻¹.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>En el espectro Raman rotacional del N₂ (\(B_0=1.98957\) cm\(^{-1}\)), halle las tres primeras líneas Stokes, la longitud del enlace a partir de \(B_0\) (\(\mu=7.0015\) u) y la razón de las intensidades de las líneas \(J=0\) y \(J=1\) a 298 K, con pesos nucleares 6 y 3 y factores de Placzek–Teller \(3(J+1)(J+2)/2(2J+1)(2J+3)\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Líneas.</b> \(B(4J+6)\): 11.94, 19.90 y 27.85 cm\(^{-1}\) (\(J=0,1,2\)).</li>
<li><b>Enlace.</b> \(r=\sqrt{h/(8\pi^2c\mu B)}=1.1001\) Å.</li>
<li><b>Factores.</b> Placzek–Teller: \(J=0\): 1; \(J=1\): 0.6.</li>
<li><b>Pesos.</b> \(6\cdot1\,e^{0}\) para \(J=0\) y \(3\cdot3\,e^{-2B/kT}\) para \(J=1\): razón \(0.680\).</li>
<li><b>Intensidades.</b> \(0.680\times1/0.6=1.13\).</li>
<li><b>Resultado.</b> <span class="ans">11.94, 19.90, 27.85 cm⁻¹; 1.1001 Å; \(I_0/I_1=1.13\).</span></li>
</ol></details></li>
</ol>
