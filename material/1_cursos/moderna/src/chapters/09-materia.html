<template class="chapter-src" data-id="materia" data-num="9" data-title="Ondas de materia e incertidumbre" data-part="Parte II · Cuantos de luz y de materia" data-short="La hipótesis de de Broglie y su confirmación con electrones, neutrones, átomos y moléculas, el experimento de la doble rendija partícula a partícula, la complementariedad y el principio de incertidumbre de Heisenberg con sus consecuencias">
<p class="lead">Si la luz, que es onda, se comporta como partícula, ¿no debería la materia, que es partícula, comportarse como onda? De Broglie propuso en 1924 que sí, y tres años después los electrones difractados por un cristal de níquel lo confirmaron. Este capítulo recorre esa idea desde su deducción hasta sus consecuencias más profundas: el patrón de interferencia que construyen, de uno en uno, electrones, neutrones, átomos y moléculas que llegan como puntos; la imposibilidad de saber por qué rendija pasó cada uno sin destruir las franjas (complementariedad); y el principio de incertidumbre de Heisenberg, que no es una limitación de los instrumentos sino una propiedad de las ondas, y que permite estimar con un par de líneas el tamaño y la energía del átomo de hidrógeno.</p>

<section>
<h2>La hipótesis de de Broglie y la difracción de partículas</h2>
<p>En su tesis de 1924, Louis de Broglie razonó por simetría: la luz tiene \(E=h\nu\) y \(p=h/\lambda\); a una partícula de momento \(p\) corresponde una onda de longitud</p>
<div class="eq key" data-name="Longitud de onda de de Broglie">\[\lambda=\frac hp=\frac{hc}{\sqrt{K(K+2mc^2)}}\ \xrightarrow{K\ll mc^2}\ \frac h{\sqrt{2mK}},\qquad \nu=\frac Eh;\qquad \lambda_e[\text{nm}]\approx\frac{1.2264}{\sqrt{V[\text{V}]}}.\]</div>
<p>Con la condición de que una onda estacionaria cierre sobre una órbita, \(2\pi r=n\lambda\), el momento angular queda \(L=n\hbar\): la cuantización de Bohr (capítulo 10) es la condición de resonancia de la onda de materia. La confirmación fue accidental. En 1927, Davisson y Germer enviaron electrones de 54 V (\(\lambda=0.1669\) nm) contra un cristal de níquel y observaron un máximo agudo de intensidad a 50° del haz; con \(d=0.215\) nm entre filas de átomos, \(\operatorname{sen}\varphi=\lambda/d=0.776\Rightarrow\varphi=50.9^\circ\). Independientemente, G. P. Thomson obtuvo anillos de difracción de electrones de decenas de keV en películas delgadas de oro (ambos compartieron el Nobel de 1937). Después se difractaron neutrones (hoy una técnica estándar para estudiar cristales y magnetismo: los neutrones térmicos a 300 K tienen \(\lambda=0.1452\) nm, igual que los espaciados atómicos), átomos de helio, moléculas de \(\text{H}_2\) y, en 1999, moléculas de \(\text{C}_{60}\) (Arndt, Zeilinger y colaboradores) con \(\lambda=4.73\) pm a 117 m/s. En 2019 se observó interferencia con moléculas de más de 25 000 unidades de masa atómica, con unos 2000 átomos (Fein et al., 2019).</p>
<div class="box ex"><h4>Longitudes de onda a ambos lados del límite clásico</h4>
<p><strong>(a)</strong> Un electrón de 54 V: \(\lambda=1.2264/\sqrt{54}=0.16689\) nm. Con 100 V: 0.12264 nm; con 1 kV: 38.76 pm; con 100 kV (microscopio electrónico): 3.701 pm, bien por debajo de 0.1 nm: de ahí la resolución atómica. <strong>(b)</strong> A 50 keV la fórmula relativista da \(\lambda=5.355\) pm y la no relativista \(5.485\) pm, un 2.4 % de más. <strong>(c)</strong> Un neutrón frío de 25 meV: 0.1809 nm. <strong>(d)</strong> Una pelota de béisbol (0.145 kg, 40 m/s): \(h/mv=1.14\times10^{-34}\) m, \(10^{19}\) veces menor que el tamaño de un núcleo: la naturaleza ondulatoria del mundo macroscópico es indetectable, y por eso Newton basta.</p></div>
<div class="sim" data-sim="broglie" data-title="Longitud de onda de de Broglie y difracción de electrones por un cristal"></div>
<div class="sim-guide"><ul>
<li>Con \(V=54\) V y \(d=0.215\) nm: \(\lambda=0.16689\) nm y el primer máximo cae a 50.9°, cerca de lo medido. A 100 V, \(\lambda=0.1226\) nm y el máximo pasa a 34.8°; a partir de unos 130 V aparece el segundo orden.</li>
<li>A igual energía de 54 eV, el neutrón tiene 3.89 pm y el átomo de helio 1.95 pm: las masas mayores dan longitudes de onda menores y difractan solo con redes muy finas. Los neutrones térmicos tienen 0.145 nm: de ahí su utilidad en cristalografía.</li>
<li>La onda de de Broglie no es una vibración de un medio ni la «forma» del electrón: cada electrón llega como un punto; la onda determina dónde es probable que llegue.</li>
</ul></div>
</section>

<section>
<h2>La doble rendija, partícula a partícula</h2>
<p>Una onda plana de longitud \(\lambda\) que pasa por dos rendijas de anchura \(a\) separadas \(d\) forma, lejos de ellas (difracción de Fraunhofer), un patrón de intensidad</p>
<div class="eq key" data-name="Doble rendija de Fraunhofer">\[\frac{I(\theta)}{I(0)}=\cos^2\!\beta\;\operatorname{sinc}^2\!\alpha,\qquad \beta=\frac{\pi d\operatorname{sen}\theta}\lambda,\quad \alpha=\frac{\pi a\operatorname{sen}\theta}\lambda,\qquad \Delta\theta_\text{franja}=\frac\lambda d.\]</div>
<p>El factor \(\cos^2\beta\) es la interferencia de las dos rendijas (franjas igualmente espaciadas con separación angular \(\lambda/d\)) y \(\operatorname{sinc}^2\alpha\) la envolvente de difracción de una sola rendija (cuyo primer cero está en \(\operatorname{sen}\theta=\lambda/a\)): dentro del lóbulo central caben unas \(2d/a-1\) franjas brillantes. Con electrones, Jönsson (1961) obtuvo franjas con rendijas de unos micrómetros y electrones de 50 keV; Merli, Missiroli y Pozzi (1974) y Tonomura et al. (1989) lograron la parte más reveladora: enviando los electrones <em>de uno en uno</em>, con intervalos tan grandes que nunca hay dos en el aparato, cada uno se detecta como un punto en un lugar impredecible, y al cabo de miles de impactos las franjas emergen de la nube de puntos. La onda de de Broglie no describe cómo se reparte un electrón: describe la <em>probabilidad</em> de que llegue a cada lugar. Ningún modelo en el que cada electrón pase por una sola rendija reproduce el patrón: la interferencia exige que las dos posibilidades coexistan hasta que se mide.</p>
<h3>Complementariedad</h3>
<p>Si se coloca un detector que revele por cuál rendija pasó cada partícula, las franjas desaparecen, no por la perturbación mecánica del detector sino porque la información de camino impide que las dos amplitudes interfieran. Englert (1996) formuló la relación cuantitativa: con la <em>visibilidad</em> de las franjas \(V=(I_\text{máx}-I_\text{mín})/(I_\text{máx}+I_\text{mín})\) y la <em>distinguibilidad</em> de los caminos \(D\) (la probabilidad de acertar con el camino menos la de errar), siempre</p>
<div class="eq key" data-name="Relación de dualidad (Englert, 1996)">\[V^2+D^2\le1,\qquad V=\sqrt{1-D^2}\ \text{ (estado puro)}.\]</div>
<p>Las dos propiedades, onda (\(V\)) y partícula (\(D\)), son complementarias: ganar una es perder la otra, con un intercambio continuo. En un interferómetro de átomos, Dürr, Nonn y Rempe (1998) mostraron que la visibilidad se pierde cuando los átomos dispersan fotones que revelan su camino, y que se recupera si la información de camino se borra. La misma idea, aplicada a neutrones (interferómetro de Rauch, 1974), permitió la medida de Colella, Overhauser y Werner (1975) del efecto de la gravedad sobre la fase de una onda de materia.</p>
<div class="sim" data-sim="rendijas" data-title="Doble rendija con partículas una a una: franjas, anchura y información de camino"></div>
<div class="sim-guide"><ul>
<li>Con electrones de 50 keV (\(\lambda=5.355\) pm), \(d=2\) µm y \(a/d=0.25\): separación angular de franjas \(\lambda/d=2.678\) µrad, 7 franjas brillantes en el lóbulo central, que termina en \(\theta=\lambda/a=10.7\) µrad (\(u=4\)). Deje correr: unos cientos de impactos parecen una nube sin patrón; con unos miles las franjas se distinguen claramente.</li>
<li>Suba \(D\) a 0.6: \(V=0.8\) y las franjas pierden contraste (el mínimo ya no llega a cero); con \(D=1\), \(V=0\) y queda solo la envolvente de difracción: la suma de las dos rendijas por separado.</li>
<li>Cambie el tipo de partícula: la forma del patrón, en función del orden \(u=d\operatorname{sen}\theta/\lambda\), es la misma para electrones, neutrones, moléculas de \(\text{C}_{60}\) y luz: solo cambia la escala angular, \(\lambda/d\): 2.68 µrad (e), 90 µrad (neutrón frío con \(d=2\) µm), 2.4 µrad (\(\text{C}_{60}\)) y 0.32 rad (He–Ne).</li>
</ul></div>
</section>

<section>
<h2>El principio de incertidumbre</h2>
<p>Una onda localizada es una superposición de ondas planas de muchos \(k\): un tren corto tiene una anchura espectral grande. El análisis de Fourier fija la relación entre las anchuras: si \(\psi(x)\) tiene dispersión \(\Delta x\) y su transformada \(\phi(k)\), \(\Delta k\), entonces \(\Delta x\,\Delta k\ge\tfrac12\), con igualdad para el paquete gaussiano. Con \(p=\hbar k\) (de Broglie), se obtiene el <span class="term">principio de incertidumbre</span> de Heisenberg (1927; la forma con desigualdad es de Kennard, 1927, y de Robertson, 1929, que la dedujo del conmutador \([\hat x,\hat p]=i\hbar\)):</p>
<div class="eq key" data-name="Relaciones de incertidumbre">\[\Delta x\,\Delta p_x\ge\frac\hbar2,\qquad \Delta E\,\Delta t\gtrsim\frac\hbar2.\]</div>
<p>No es un enunciado sobre la perturbación del aparato de medida, sino sobre el estado: no existe ningún estado en el que \(x\) y \(p\) estén ambos bien definidos. La versión con la energía y el tiempo tiene otro significado: \(\Delta t\) no es la incertidumbre de una variable \(t\) sino el tiempo característico de variación del sistema. Un nivel atómico excitado de vida media \(\tau\) tiene una anchura en energía \(\Gamma=\hbar/\tau\) y la línea que emite una anchura natural \(\Delta\nu=1/(2\pi\tau)\). Para Lyman-\(\alpha\) del hidrógeno (\(2p\to1s\), \(A=6.2649\times10^8\) s\(^{-1}\), \(\tau=1.596\) ns): \(\Gamma=\hbar A=4.124\times10^{-7}\) eV y \(\Delta\nu=A/2\pi=99.7\) MHz, es decir, un factor de calidad de \(\nu_0/\Delta\nu=2.5\times10^7\).</p>
<h3>Un paquete de ondas libre</h3>
<p>El paquete gaussiano de anchura inicial \(\sigma_0\) tiene \(\Delta p=\hbar/2\sigma_0\) y, como la velocidad de cada componente es \(p/m\), se ensancha con el tiempo (la dispersión de de Broglie): \(\sigma(t)=\sigma_0\sqrt{1+(\hbar t/2m\sigma_0^2)^2}\). El tiempo característico de expansión es \(t_s=2m\sigma_0^2/\hbar\); el producto \(\Delta x\Delta p=\tfrac\hbar2\sqrt{1+(t/t_s)^2}\) crece (el estado deja de ser el de mínima incertidumbre). Para un electrón con \(\sigma_0=0.1\) nm, \(t_s=1.73\times10^{-16}\) s: el paquete se duplica en unos femtosegundos, y su dispersión de velocidad es \(5.79\times10^5\) m/s. Para una molécula de \(\text{C}_{60}\) con \(\sigma_0=1\) nm, \(t_s=22.7\) ns; para un grano de polvo de 1 µg con \(\sigma_0=1\) µm, \(t_s=1.9\times10^{13}\) s \(=6\times10^5\) años: el mundo macroscópico no se «derrama» en ninguna escala observable.</p>
<div class="sim" data-sim="incert" data-title="Paquete gaussiano libre: incertidumbre y ensanchamiento según la masa"></div>
<div class="sim-guide"><ul>
<li>Electrón con \(\sigma_0=0.1\) nm y \(t=t_s=1.73\times10^{-16}\) s: \(\sigma=1.414\,\sigma_0\), \(\Delta p=5.27\times10^{-25}\) kg·m/s (\(\Delta v=5.79\times10^5\) m/s) y \(\Delta x\Delta p=1.414\,\hbar/2\). Con \(t=20t_s\): \(\sigma=20.02\sigma_0\) (la curva continua de la derecha).</li>
<li>Cambie a \(\text{C}_{60}\): para el mismo \(\sigma_0\) el tiempo \(t_s\) es 1.3×10\(^6\) veces mayor, porque la masa lo es (\(t_s\propto m\sigma_0^2\)): 0.227 ns con \(\sigma_0=0.1\) nm. Con el grano de polvo, tras un segundo \(t/t_s\approx5\times10^{-14}\) y no se aprecia ensanchamiento alguno.</li>
<li>La curva punteada es el paquete inicial: el área bajo ambas es 1. Cuanto más estrecho el paquete inicial, más rápido se ensancha: localizar una partícula tiene un coste en la dispersión de velocidades.</li>
</ul></div>
<h3>Estimaciones con la incertidumbre</h3>
<p>Un electrón confinado en una región de tamaño \(r\) tiene \(\Delta p\gtrsim\hbar/r\) y, por tanto, una energía cinética de al menos \(\hbar^2/2mr^2\); la energía potencial coulombiana es \(-e^2/4\pi\varepsilon_0r\). Minimizando la suma:</p>
<div class="eq key" data-name="Tamaño y energía del átomo de hidrógeno a partir de la incertidumbre">\[E(r)=\frac{\hbar^2}{2mr^2}-\frac{e^2}{4\pi\varepsilon_0r}\ \Rightarrow\ r_\text{mín}=\frac{4\pi\varepsilon_0\hbar^2}{me^2}=a_0=52.918\ \text{pm},\qquad E_\text{mín}=-\frac{me^4}{2(4\pi\varepsilon_0)^2\hbar^2}=-13.606\ \text{eV}.\]</div>
<p>Se obtienen el radio de Bohr y la energía del estado fundamental con un argumento de dos líneas: la repulsión de la «presión cuántica» (\(1/r^2\)) frena el colapso que causaría la atracción coulombiana (\(1/r\)), y por eso el átomo es estable. El mismo razonamiento descarta que un electrón viva en el núcleo: confinado en \(r=5\) fm, \(pc\approx\hbar c/r=39.5\) MeV, varias veces mayor que la atracción coulombiana de un núcleo de \(Z\approx30\) a esa distancia (8.6 MeV); un protón, en cambio, con \(K\sim(\hbar c/r)^2/2m_pc^2=0.83\) MeV, tiene energías del orden de los MeV, la escala de la física nuclear.</p>
<div class="sim" data-sim="hestimado" data-title="El átomo de hidrógeno estimado con la incertidumbre: balance entre cinética y potencial"></div>
<div class="sim-guide"><ul>
<li>En \(r=a_0=52.9\) pm: \(K=13.606\) eV, \(U=-27.211\) eV y \(E=-13.606\) eV (el mínimo; coincide exactamente con el nivel de Bohr y de la ecuación de Schrödinger). Se cumple \(K=-E\) y \(U=2E\): es el teorema del virial.</li>
<li>Con \(r=100\) pm: \(K=3.810\) eV, \(U=-14.400\) eV y \(E=-10.590\) eV (menos ligado). Con \(r=20\) pm la cinética domina (\(K=95\) eV) y \(E\) es positiva: el electrón no se comprime hacia el núcleo.</li>
<li>La coincidencia con el valor exacto depende de cómo se tome \(\Delta p\) (aquí \(\hbar/r\)): una estimación tan burda solo garantiza la escala correcta. El cálculo exacto con la ecuación de Schrödinger (capítulo 14) da el mismo valor para el estado fundamental del hidrógeno.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule la longitud de onda de de Broglie de: (a) electrones de 54 V y de 100 kV; (b) un neutrón térmico a 300 K (\(K=\tfrac32k_BT\)); (c) una pelota de 0.145 kg a 40 m/s. (d) El ángulo del primer máximo de Davisson–Germer con \(d=0.215\) nm a 54 V.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>(a)</b> 54 V: \(\lambda=hc/\sqrt{K(K+2mc^2)}=1239.84/\sqrt{54(54+1.022\times10^6)}=0.16689\) nm. 100 kV: \(1239.84/\sqrt{10^5(10^5+1.022\times10^6)}=3.701\) pm.</li>
<li><b>(b)</b> \(K=\tfrac32(1.3806\times10^{-23})(300)=6.213\times10^{-21}\) J; \(\lambda=h/\sqrt{2m_nK}=6.626\times10^{-34}/\sqrt{2(1.6749\times10^{-27})(6.213\times10^{-21})}=1.452\times10^{-10}\) m.</li>
<li><b>(c)</b> \(\lambda=h/(mv)=6.626\times10^{-34}/(0.145\times40)=1.14\times10^{-34}\) m.</li>
<li><b>(d)</b> \(\operatorname{sen}\varphi=0.16689/0.215=0.7762\Rightarrow\varphi=50.9^\circ\).</li>
<li><b>Resultado.</b> <span class="ans">0.1669 nm y 3.701 pm; 0.1452 nm; \(1.14\times10^{-34}\) m; 50.9°.</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Electrones de 50 keV atraviesan dos rendijas de anchura \(a=0.5\) µm separadas \(d=2\) µm. Halle \(\lambda\), la separación angular de las franjas, la posición del primer cero de difracción, el número de franjas brillantes del lóbulo central y la separación de las franjas sobre una pantalla a 0.35 m.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>\(\lambda\).</b> \(\lambda=hc/\sqrt{K(K+2mc^2)}=5.355\) pm.</li>
<li><b>Franjas.</b> \(\Delta\theta=\lambda/d=5.355\times10^{-12}/2\times10^{-6}=2.678\) µrad.</li>
<li><b>Cero de difracción.</b> \(\operatorname{sen}\theta=\lambda/a=10.71\) µrad (en unidades de \(u=d\operatorname{sen}\theta/\lambda\): \(u=d/a=4\)).</li>
<li><b>Franjas en el lóbulo.</b> \(2d/a-1=7\) franjas brillantes (\(u=0,\pm1,\pm2,\pm3\)).</li>
<li><b>En la pantalla.</b> \(\Delta y=L\Delta\theta=0.35\times2.678\times10^{-6}=0.937\) µm.</li>
<li><b>Resultado.</b> <span class="ans">5.355 pm; 2.678 µrad; 10.71 µrad; 7; 0.937 µm.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Un electrón se confina en una región de \(\sigma_0=0.1\) nm (un tamaño atómico). Halle \(\Delta p\) y \(\Delta v\) mínimos, compárelas con la velocidad de Bohr (\(2.19\times10^6\) m/s) y calcule el tiempo en que el paquete libre duplica su anchura (\(\sigma=2\sigma_0\)).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Incertidumbre.</b> \(\Delta p=\hbar/(2\sigma_0)=1.0546\times10^{-34}/(2\times10^{-10})=5.273\times10^{-25}\) kg·m/s.</li>
<li><b>Velocidad.</b> \(\Delta v=\Delta p/m=5.273\times10^{-25}/9.109\times10^{-31}=5.79\times10^5\) m/s, el 26 % de la velocidad de Bohr: el mismo orden de magnitud.</li>
<li><b>Tiempo de expansión.</b> \(t_s=2m\sigma_0^2/\hbar=2(9.109\times10^{-31})(10^{-20})/1.0546\times10^{-34}=1.728\times10^{-16}\) s.</li>
<li><b>Duplicación.</b> \(\sqrt{1+(t/t_s)^2}=2\Rightarrow t=\sqrt3\,t_s=2.99\times10^{-16}\) s.</li>
<li><b>Resultado.</b> <span class="ans">\(5.27\times10^{-25}\) kg·m/s; \(5.79\times10^5\) m/s; 0.299 fs.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Con \(E(r)=\hbar^2/2mr^2-e^2/4\pi\varepsilon_0r\), halle el mínimo analíticamente y evalúe \(K\), \(U\) y \(E\) en \(r=100\) pm.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Mínimo.</b> \(\dd E/\dd r=-\hbar^2/(mr^3)+e^2/(4\pi\varepsilon_0r^2)=0\Rightarrow r=4\pi\varepsilon_0\hbar^2/(me^2)=a_0=52.918\) pm.</li>
<li><b>Energía.</b> \(K=\hbar^2/(2ma_0^2)=13.606\) eV; \(U=-e^2/(4\pi\varepsilon_0a_0)=-27.211\) eV; \(E=-13.606\) eV.</li>
<li><b>\(r=100\) pm.</b> \(K=\hbar^2/(2mr^2)=3.810\) eV; \(U=-14.400\) eV; \(E=-10.590\) eV (mayor que el mínimo).</li>
<li><b>Resultado.</b> <span class="ans">\(a_0=52.918\) pm, \(E_\text{mín}=-13.606\) eV; en 100 pm: 3.810, −14.400 y −10.590 eV.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>(a) Estime la energía de un electrón confinado en un núcleo de 5 fm con \(p\approx\hbar/r\) y compárela con la masa en reposo. (b) Estime la energía cinética de un protón en el mismo núcleo.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>(a) Electrón.</b> \(pc\approx\hbar c/r=197.327\ \text{MeV·fm}/5\ \text{fm}=39.47\) MeV \(\gg m_ec^2=0.511\) MeV: ultrarrelativista, \(K=pc-mc^2=38.95\) MeV.</li>
<li><b>Comparación.</b> La atracción coulombiana del núcleo (\(Z\sim30\)) a 5 fm es \(Ze^2/4\pi\varepsilon_0r=30\times1.44\ \text{MeV·fm}/5\ \text{fm}=8.6\) MeV, menor que 39 MeV: el electrón no queda ligado.</li>
<li><b>(b) Protón.</b> Con \(pc\approx39.47\) MeV, \(K\approx(pc)^2/2m_pc^2=39.47^2/1876.5=0.83\) MeV (no relativista, pues \(pc\ll m_pc^2\)); del orden de megaelectronvoltios, la escala de las energías nucleares.</li>
<li><b>Resultado.</b> <span class="ans">39.5 MeV (el electrón no puede estar en el núcleo); 0.83 MeV para el protón.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Para la línea Lyman-\(\alpha\) del hidrógeno (121.567 nm, \(A_{2p\to1s}=6.2649\times10^8\) s\(^{-1}\)): vida media, anchura natural en energía y en frecuencia, factor de calidad y anchura en longitud de onda.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Vida media.</b> \(\tau=1/A=1.596\) ns.</li>
<li><b>Energía.</b> \(\Gamma=\hbar/\tau=\hbar A=6.5821\times10^{-16}\ \text{eV·s}\times6.2649\times10^8\ \text{s}^{-1}=4.124\times10^{-7}\) eV.</li>
<li><b>Frecuencia.</b> \(\Delta\nu=A/2\pi=99.71\) MHz. Con \(\nu_0=c/\lambda=2.466\times10^{15}\) Hz, \(Q=\nu_0/\Delta\nu=2.5\times10^7\).</li>
<li><b>Longitud de onda.</b> \(\Delta\lambda=\lambda^2\Delta\nu/c=(121.567\times10^{-9})^2(9.971\times10^7)/299\,792\,458=4.92\times10^{-15}\) m.</li>
<li><b>Resultado.</b> <span class="ans">1.596 ns; \(4.124\times10^{-7}\) eV; 99.7 MHz; \(2.5\times10^7\); 4.9 fm.</span></li>
