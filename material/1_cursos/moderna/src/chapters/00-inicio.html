    <h1 class="home-title">Física Moderna<span>de la relatividad al Big Bang</span></h1>
    <p class="home-lead">Un curso completo de física moderna en siete partes y veintiocho capítulos: la relatividad especial y general; los cuantos de luz y de materia (el cuerpo negro, el efecto fotoeléctrico, Compton, de Broglie, Bohr); la mecánica ondulatoria (Schrödinger, el efecto túnel, el oscilador, el hidrógeno y el espín); los átomos, el láser y las moléculas; la estadística cuántica y la materia condensada (semiconductores, superconductividad, condensados de Bose–Einstein); la física nuclear; y las partículas, las estrellas y el cosmos. Cada capítulo deduce los resultados, los aplica en ejemplos resueltos, los ilustra con simulaciones de parámetros ajustables y termina con problemas con solución paso a paso. Todos los conceptos y todas las cifras del texto están validados contra referencias independientes: SciPy, SymPy, mpmath, astropy, el Particle Data Group, las tablas del NIST y los valores publicados en la literatura.</p>
    <div class="maxwell-strip" aria-label="Ecuaciones centrales del curso">
      <div><small>Relatividad</small>\[E^2=(pc)^2+(mc^2)^2\]</div>
      <div><small>Cuantos</small>\[E=h\nu,\quad\lambda=\frac hp\]</div>
      <div><small>Ondas de materia</small>\[\ii\hbar\,\partial_t\psi=\hat H\psi\]</div>
      <div><small>Cosmos</small>\[\frac{H^2}{H_0^2}=\frac{\Omega_m}{a^3}+\Omega_\Lambda\]</div>
    </div>

<div class="home-howto">
  <div><b>De los experimentos a la teoría</b><p>Cada parte arranca de la crisis experimental que obligó a cambiar la física: Michelson–Morley, la catástrofe ultravioleta, el efecto fotoeléctrico, las líneas espectrales, el calor específico de los sólidos, la radiactividad, los hadrones, la expansión del universo.</p></div>
  <div><b>Simulaciones con parámetros</b><p>Dilatación del tiempo y gemelos, diagramas de Minkowski, GPS y agujeros negros, Planck y Compton, Bohr y de Broglie, el túnel y el STM, orbitales y Zeeman, láser, bandas y uniones pn, BCS y Josephson, cadenas de Bateman, Gamow, pico de Gamow, Lane–Emden, enanas blancas y estrellas de neutrones, oscilaciones de neutrinos, Friedmann y curvas de rotación.</p></div>
  <div><b>Validación cifra a cifra</b><p>Cada número que aparece en el texto o en las soluciones se comprueba con un cálculo independiente: integración numérica de ecuaciones diferenciales, diagonalización de hamiltonianos, constantes CODATA, masas de AME, datos del PDG y astropy.cosmology. El apéndice B enumera las pruebas.</p></div>
  <div><b>Ejemplos con contexto</b><p>El GPS, las líneas de Fraunhofer, la línea de 21 cm del hidrógeno, la resonancia magnética, el láser de He–Ne, el diodo y la celda solar, el radiocarbono, la protonterapia, el LHC, el Sol, Sirius B, la supernova 1987A y el fondo cósmico de microondas.</p></div>
