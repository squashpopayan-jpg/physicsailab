<template class="chapter-src" data-id="doppler" data-num="5" data-title="Doppler, aberración, Cherenkov y campos en movimiento" data-part="Parte I · Relatividad especial" data-short="El efecto Doppler relativista y el corrimiento al rojo, la aberración de la luz y el efecto faro, la radiación de Cherenkov y la transformación de los campos eléctrico y magnético, con el magnetismo como efecto relativista">
<p class="lead">La luz es el mensajero con que se observa casi todo lo que se mueve rápido, y en ella la relatividad deja huellas medibles: la frecuencia cambia con la velocidad de la fuente, la dirección de los rayos cambia con la velocidad del observador, una partícula más rápida que la luz <em>en el medio</em> deja una onda de choque luminosa, y los campos eléctrico y magnético se mezclan al cambiar de sistema. Este capítulo parte de que la fase de una onda es un invariante, de donde se obtienen el Doppler y la aberración con un solo cálculo, y termina mostrando que la fuerza magnética no es una interacción nueva sino la electrostática vista por un observador en movimiento.</p>

<section>
<h2>El efecto Doppler relativista</h2>
<p>La fase de una onda plana, \(\phi=\omega t-\mathbf k\cdot\mathbf x\), cuenta crestas y es la misma para todos los observadores. Eso significa que \(k^\mu=(\omega/c,\mathbf k)\) se transforma como un cuadrivector. Para la luz en el vacío, \(|\mathbf k|=\omega/c\) y \(k\cdot k=0\). Si una fuente en reposo en \(S'\) emite luz de frecuencia \(\omega_0\) y se mueve con velocidad \(\beta c\) respecto del observador \(S\), la transformación de Lorentz de \(k^\mu\) da, para la luz que llega al observador formando un ángulo \(\theta\) (medido en \(S\)) con la velocidad de la fuente:</p>
<div class="eq key" data-name="Efecto Doppler relativista">\[f=\frac{f_0}{\gamma\,(1-\beta\cos\theta)},\qquad f_\text{acerca}=f_0\sqrt{\frac{1+\beta}{1-\beta}},\quad f_\text{aleja}=f_0\sqrt{\frac{1-\beta}{1+\beta}},\quad f_{\theta=90^\circ}=\frac{f_0}{\gamma}.\]</div>
<p>Hay tres diferencias con el Doppler del sonido. (i) Solo importa la velocidad relativa: no hay un medio privilegiado. (ii) Aparece un efecto <em>transversal</em>: cuando la luz llega perpendicular a la velocidad (en el sistema del observador) la frecuencia disminuye en \(1/\gamma\): es la dilatación del tiempo de la fuente, sin análogo clásico. (iii) La fórmula depende del ángulo en el sistema del observador: para el que la luz fue emitida perpendicularmente en el sistema de la fuente, la frecuencia observada es \(\gamma f_0\), ¡mayor! En astronomía se usa el <span class="term">corrimiento al rojo</span> \(z=\lambda/\lambda_0-1\); para una fuente que se aleja en línea recta, \(1+z=\sqrt{(1+\beta)/(1-\beta)}\), es decir, \(\beta=[(1+z)^2-1]/[(1+z)^2+1]\): \(z=0.1\) corresponde a \(\beta=0.0950\), \(z=1\) a \(\beta=0.6\) y \(z=2\) a \(0.8\). (El corrimiento al rojo cosmológico de las galaxias lejanas no es un efecto Doppler, sino la expansión del espacio: capítulo 28.)</p>
<div class="box ex"><h4>Hα de una galaxia que se aleja y el radar de la policía</h4>
<p><strong>(a)</strong> Una galaxia se aleja a \(\beta=0.1\). Para la línea Hα (656.28 nm): \(1+z=\sqrt{1.1/0.9}=1.10554\); \(\lambda=725.54\) nm, \(z=0.1055\) (la fórmula clásica \(\beta\) da \(z=0.1\), con un error de 5.5 %). <strong>(b)</strong> Un radar de tráfico a 24.15 GHz refleja la señal en un coche a 100 km/h (27.78 m/s): el reflejo se desplaza dos veces (la carretera recibe una frecuencia desplazada y la reemite desplazada de nuevo), \(\Delta f\approx2f_0v/c=4475\) Hz. <strong>(c)</strong> La velocidad medida de una galaxia con Hα observada en 700 nm: \(1+z=700/656.28=1.0666\), \(\beta=0.0644\) (19 300 km/s).</p></div>
<h3>Comprobaciones experimentales</h3>
<p>El experimento de Ives y Stilwell (1938) usó rayos canales (iones \(\text{H}_2^+\), \(\text{H}_3^+\) a \(\beta\approx0.005\)) y midió en el mismo espectro las líneas desplazadas al azul (iones que se acercan) y al rojo (iones que se alejan). La física clásica, con la fuente móvil, predice \(\lambda=\lambda_0(1\mp\beta)\), cuya media es exactamente \(\lambda_0\); la relatividad, \(\lambda_0\sqrt{(1\mp\beta)/(1\pm\beta)}\), cuya media es \(\gamma\lambda_0\): un corrimiento del centro de las dos líneas \(\lambda_0(\gamma-1)\approx\tfrac12\beta^2\lambda_0=6.08\) pm para Hβ (486.13 nm), que es lo que midieron. En el anillo de almacenamiento TSR de Heidelberg, con iones de \(^7\text{Li}^+\) a \(\beta=0.03\) y 0.064 y espectroscopía láser de dos fotones, se confirmó la dilatación del tiempo con una precisión de unas dos partes por mil millones (Reinhardt et al., 2007). Un caso cosmológico es el de la radiación del fondo de microondas: el movimiento de la Tierra respecto de él, \(v=369.8\) km/s (\(\beta=1.2336\times10^{-3}\)), produce una temperatura \(T(\theta)=T_0/[\gamma(1-\beta\cos\theta)]\approx T_0(1+\beta\cos\theta)\), un dipolo de amplitud \(T_0\beta=2.7255\ \text{K}\times1.2336\times10^{-3}=3.362\) mK, que es el valor medido por COBE, WMAP y Planck.</p>
<div class="sim" data-sim="doppler" data-title="Efecto Doppler relativista: ángulo, velocidad y color de la línea observada"></div>
<div class="sim-guide"><ul>
<li>Con \(\beta=0.3\) y \(\theta=180^\circ\) (se aleja): \(f/f_0=0.7338\), y Hα (656.28 nm) se observa en 894.4 nm (infrarrojo), \(z=0.3628\). Con \(\theta=0\) se acerca: \(1.3628\), y Hα pasaría a 481.6 nm.</li>
<li>Con \(\theta=90^\circ\) y \(\beta=0.6\): \(f/f_0=1/\gamma=0.8\) (transversal puro). La curva clásica (punteada) es simétrica en el ángulo: la relativista no lo es, pues su valor para 90° es menor que 1.</li>
<li>Con \(\beta=0.99\): \(f_\text{acerca}/f_0=14.1\) y \(f_\text{aleja}/f_0=0.0709\). A pequeñas velocidades las curvas de acercamiento y alejamiento son casi simétricas respecto de 1 (\(1\pm\beta\)) y la transversal es casi horizontal: el efecto transversal es de segundo orden en \(\beta\) (\(1-\tfrac12\beta^2\)).</li>
</ul></div>
</section>

<section>
<h2>Aberración de la luz y efecto faro</h2>
<p>El mismo cuadrivector \(k^\mu\) da la dirección. Con un impulso \(\beta\) a lo largo de \(x\), el ángulo \(\theta\) que forma con \(x\) la dirección de propagación en \(S\) y el ángulo \(\theta'\) en \(S'\) cumplen \(\cos\theta'=(\cos\theta-\beta)/(1-\beta\cos\theta)\). Para el observador que se mueve con \(\beta\) a lo largo de una dirección, una estrella que está a un ángulo \(\alpha\) de esa dirección (respecto del sistema de las estrellas lejanas) se ve a un ángulo \(\alpha'\) menor:</p>
<div class="eq key" data-name="Aberración de la luz">\[\cos\alpha'=\frac{\cos\alpha+\beta}{1+\beta\cos\alpha},\qquad \tan\frac{\alpha'}2=\sqrt{\frac{1-\beta}{1+\beta}}\,\tan\frac\alpha2,\qquad \alpha=90^\circ:\ \ \Delta\alpha\approx\beta.\]</div>
<p>Las estrellas se agolpan hacia la dirección del movimiento. La Tierra, a \(29.78\) km/s respecto del Sol, produce un desplazamiento anual de \(\beta=9.93\times10^{-5}\) rad \(=20.49''\), la constante de aberración que Bradley encontró en 1728 (y que prueba el movimiento de la Tierra sin recurrir al éter ni a un arrastre).</p>
<p>La misma ley, leída en el otro sentido, da el <span class="term">efecto faro</span>. Una fuente que emite isótropamente en su propio sistema se ve, desde otro, concentrada hacia delante: un fotón emitido a \(\theta^*\) llega con \(\cos\theta=(\cos\theta^*+\beta)/(1+\beta\cos\theta^*)\); los fotones del hemisferio delantero (\(\cos\theta^*>0\)) quedan dentro del cono \(\cos\theta>\beta\), de semiángulo \(\theta_{1/2}=\arccos\beta\approx1/\gamma\). La densidad de fotones por ángulo sólido es \(\dd N/\dd\Omega=D^2/4\pi\), con \(D=1/[\gamma(1-\beta\cos\theta)]\) el factor de Doppler; la integral sobre la esfera es 1, y delante vale \(D^2=(1+\beta)/(1-\beta)\). Es el origen de la radiación de sincrotrón (electrones de \(\gamma\sim10^4\) emiten en conos de \(10^{-4}\) rad), y de que los chorros relativistas de los núcleos activos de galaxias se vean mucho más brillantes de un lado que del otro, con velocidades aparentes superiores a \(c\): un blob emitido con \(\beta\) a un ángulo \(\theta\) de la visual parece moverse con \(v_\text{ap}=\beta c\operatorname{sen}\theta/(1-\beta\cos\theta)\), máximo \(\gamma\beta c\) en \(\cos\theta=\beta\) (\(4.92c\) para \(\beta=0.98\)): es una ilusión geométrica, no una señal más rápida que la luz.</p>
<div class="sim" data-sim="aberracion" data-title="Aberración estelar y efecto faro de una fuente isótropa"></div>
<div class="sim-guide"><ul>
<li>Con \(\beta=0.8\): una estrella a 90° se ve a 36.87° (desplazada 53.1°). La mitad de los fotones de una fuente isótropa queda en un cono de \(\pm36.87^\circ\) (\(\arccos0.8\)); la intensidad hacia delante es \(D^2=9\) veces la isótropa y hacia atrás, \(1/9=0.111\).</li>
<li>Con \(\beta=0.0001\) (la Tierra en su órbita) la aberración es de 20.6″ en el máximo; la curva es casi un círculo. Con \(\beta=0.99\), \(\theta_{1/2}=8.1^\circ\), y la intensidad hacia delante es 199 veces la isótropa.</li>
<li>El ángulo \(\arccos\beta\) y \(1/\gamma\) (en rad) coinciden para \(\beta\to1\) (a \(\beta=0.8\): 36.9° y 34.4°).</li>
</ul></div>
</section>

<section>
<h2>La radiación de Cherenkov</h2>
<p>Ninguna partícula supera \(c\) en el vacío, pero en un medio de índice \(n\) la luz va a \(c/n\) y una partícula cargada con \(\beta\gt1/n\) sí es más rápida que la luz <em>en ese medio</em>. Entonces los frentes de onda que emite en cada punto de su trayectoria (construcción de Huygens: esferas de radio \((c/n)(t-t_0)\)) se superponen en un cono, como la onda de choque de un avión supersónico, y la luz sale perpendicular a él (Cherenkov, 1934; Frank y Tamm, 1937, Nobel 1958):</p>
<div class="eq key" data-name="Ángulo y rendimiento de la radiación de Cherenkov">\[\cos\theta_c=\frac1{n\beta},\qquad \beta_\text{umbral}=\frac1n,\qquad \frac{\dd N}{\dd x}=2\pi\alpha\,z^2\sin^2\theta_c\Bigl(\frac1{\lambda_1}-\frac1{\lambda_2}\Bigr).\]</div>
<p>Las energías de umbral dependen de la masa: \(K_u=mc^2\bigl[(1-1/n^2)^{-1/2}-1\bigr]\). En agua (\(n=1.333\)), \(\gamma_u=1.5123\), \(K_u=0.2618\) MeV para el electrón, \(54.1\) MeV para el muón, \(71.5\) MeV para un pión cargado y \(480.7\) MeV para un protón. A \(\beta=1\), el ángulo es \(\arccos(1/n)=41.39^\circ\) y se emiten \(334\) fotones por centímetro entre 300 y 600 nm. Esto permite identificar partículas por la velocidad (contadores de Cherenkov y detectores RICH) y reconstruir su dirección: el detector Super-Kamiokande, un tanque de 50 000 toneladas de agua rodeado de unos 11 000 fotomultiplicadores, detecta los neutrinos por los anillos de Cherenkov de los electrones y muones que producen, y el resplandor azul de los reactores nucleares en el agua es luz de Cherenkov.</p>
<div class="sim" data-sim="cherenkov" data-title="Radiación de Cherenkov: cono, umbral y rendimiento de fotones"></div>
<div class="sim-guide"><ul>
<li>Electrón de 5 MeV en agua: \(\beta=0.99569\), \(\theta_c=41.11^\circ\), unos 330 fotones/cm entre 300 y 600 nm. El mismo electrón con 0.2 MeV (\(\beta=0.695\)) queda bajo el umbral (\(\beta=0.75\)): sin luz.</li>
<li>Muón de 1 GeV: \(\beta=0.99542\), \(\theta_c=41.09^\circ\): casi el ángulo máximo de 41.39°. El ángulo apenas varía a energías altas; en el aerogel (\(n=1.03\)) el máximo es 13.86° y el electrón necesita \(K_u=1.62\) MeV; en el aire (\(n=1.000293\)), 1.39° y 20.6 MeV.</li>
<li>En el gráfico de la derecha cada medio arranca en \(\beta=1/n\) con un ángulo de cero y crece hasta \(\arccos(1/n)\): la distinción entre partículas de la misma energía y distinta masa (piones y kaones) se hace midiendo ese ángulo.</li>
</ul></div>
</section>

<section>
<h2>Campos en movimiento: el magnetismo como efecto relativista</h2>
<p>El tensor electromagnético \(F^{\mu\nu}\), que reúne las seis componentes de \(\mathbf E\) y \(\mathbf B\), se transforma con la matriz de Lorentz (\(F'=\Lambda F\Lambda^T\)). Para un impulso \(\beta\) a lo largo de \(x\):</p>
<div class="eq key" data-name="Transformación de los campos">\[E'_x=E_x,\quad E'_y=\gamma(E_y-vB_z),\quad E'_z=\gamma(E_z+vB_y);\qquad B'_x=B_x,\quad B'_y=\gamma\Bigl(B_y+\frac{v}{c^2}E_z\Bigr),\quad B'_z=\gamma\Bigl(B_z-\frac v{c^2}E_y\Bigr).\]</div>
<p>Un campo puramente eléctrico en \(S\) es en parte magnético en \(S'\) y viceversa: no son dos entidades, sino dos aspectos de una. Hay dos invariantes: \(E^2-c^2B^2\) y \(\mathbf E\cdot\mathbf B\). Si en un sistema \(\mathbf E\perp\mathbf B\) y \(E\lt cB\), existe otro sistema donde el campo eléctrico es nulo. Una consecuencia es el campo de una carga con velocidad uniforme: visto desde el laboratorio, el campo eléctrico de una carga \(q\) en movimiento tiene su dirección <em>radial desde la posición presente</em> (no la retardada) y su módulo es</p>
<div class="eq">\[E=\frac{q}{4\pi\varepsilon_0r^2}\,\frac{1-\beta^2}{\bigl(1-\beta^2\operatorname{sen}^2\theta\bigr)^{3/2}},\qquad \mathbf B=\frac{\mathbf v\times\mathbf E}{c^2},\]</div>
<p>con \(r\) la distancia a la posición presente y \(\theta\) el ángulo con la velocidad. Esto se obtiene transformando el campo de Coulomb del sistema de reposo, y se verifica contra el cálculo con el tiempo retardado (campos de Liénard–Wiechert) en la validación del curso. Las líneas de campo se aplastan en un «panqueque» perpendicular al movimiento: en \(\theta=90^\circ\) el campo es \(\gamma\) veces el de Coulomb y a lo largo del movimiento, \(1/\gamma^2\) veces.</p>
<div class="sim" data-sim="cargamovil" data-title="Campo de una carga en movimiento uniforme: líneas y distribución angular"></div>
<div class="sim-guide"><ul>
<li>Con \(\beta=0.8\) (\(\gamma=1.667\)): el campo perpendicular es 1.667 veces el de Coulomb y el longitudinal, \(0.36\) veces (\(1/\gamma^2\)). Las líneas se concentran en el plano perpendicular; a \(\beta\to1\) forman un disco: así se ve el campo de los protones del LHC.</li>
<li>El campo magnético \(B=vE/c^2\) crece con \(\beta\): a \(\beta=0.8\), \(cB=0.8E\). A velocidades pequeñas, \(B\sim\beta E/c\) es minúsculo; por eso el magnetismo cotidiano parece independiente.</li>
<li>La figura es la prueba visual de que la fuerza es una función de la posición presente: no hay «retraso» en el campo de una carga con velocidad constante.</li>
</ul></div>
<h3>El alambre de Purcell</h3>
<p>Un alambre neutro con corriente \(I\) (los electrones se mueven, los iones están en reposo) no ejerce fuerza eléctrica sobre una carga en reposo, pero ejerce una fuerza magnética \(qvB\) sobre una carga \(q\) que se mueve con \(v\) paralela a la corriente, con \(B=\mu_0I/2\pi d\). Visto desde el sistema de la carga, la carga está en reposo y no puede haber fuerza magnética: pero allí el alambre <em>no es neutro</em>. Las densidades de carga positiva y negativa se contraen de manera distinta (los electrones ya se movían; los iones no), y queda una carga neta lineal \(\lambda'=-\gamma vI/c^2\). El campo eléctrico de esa carga neta sobre \(q\) es \(E'=\lambda'/2\pi\varepsilon_0d\), de módulo \(\gamma\mu_0vI/2\pi d\), y la fuerza \(F'=qE'\) vuelve al laboratorio con un factor \(1/\gamma\): \(F=qv\mu_0I/(2\pi d)=qvB\). El magnetismo es la electrostática más la relatividad.</p>
<div class="box ex"><h4>Un alambre de 100 A visto por una carga a \(10^6\) m/s</h4>
<p><strong>Datos.</strong> \(I=100\) A, \(d=1\) cm, \(v=10^6\) m/s (\(\gamma=1.000006\)), \(q=e\). <strong>Procedimiento.</strong> (1) Laboratorio: \(B=\mu_0I/2\pi d=2\times10^{-3}\) T y \(F=evB=3.204\times10^{-16}\) N. (2) Sistema de la carga: carga neta lineal \(\lambda'=vI/c^2=1.113\times10^{-9}\) C/m (más de un nanocoulomb por metro en un alambre neutro). (3) \(E'=\lambda'/(2\pi\varepsilon_0d)=2000\) V/m y \(F'=eE'=3.204\times10^{-16}\) N. <strong>Resultado.</strong> La fuerza eléctrica del sistema de la carga y la magnética del laboratorio coinciden (la corrección \(\gamma\) es \(6\times10^{-6}\)).</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>(a) Una galaxia se aleja a \(0.1c\): ¿en qué longitud de onda se observa Hα (656.28 nm) y cuál es \(z\)? (b) Una línea Hα se observa en 700 nm en el espectro de otra galaxia que se aleja: halle su velocidad. (c) El desplazamiento Doppler de un radar de 24.15 GHz sobre un coche a 100 km/h.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>(a)</b> \(1+z=\sqrt{(1+\beta)/(1-\beta)}=\sqrt{1.1/0.9}=1.10554\); \(\lambda=656.28\times1.10554=725.54\) nm; \(z=0.1055\).</li>
<li><b>(b)</b> \(1+z=700/656.28=1.06662\); \(\beta=[(1+z)^2-1]/[(1+z)^2+1]=0.13767/2.13767=0.0644\), esto es, \(v=1.93\times10^4\) km/s.</li>
<li><b>(c)</b> Reflexión: \(\Delta f\approx2f_0v/c=2(24.15\times10^9)(27.78)/299\,792\,458=4475\) Hz.</li>
<li><b>Resultado.</b> <span class="ans">725.5 nm, \(z=0.1055\); \(\beta=0.0644\); 4475 Hz.</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>El movimiento del sistema solar respecto del fondo de microondas es de 369.82 km/s. Calcule la amplitud del dipolo de temperatura (\(T_0=2.7255\) K) y la temperatura en la dirección hacia la que se mueve.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Planteamiento.</b> \(T(\theta)=T_0/[\gamma(1-\beta\cos\theta)]\approx T_0(1+\beta\cos\theta)\).</li>
<li><b>Velocidad.</b> \(\beta=369\,820/299\,792\,458=1.2336\times10^{-3}\).</li>
<li><b>Dipolo.</b> \(T_0\beta=2.7255\times1.2336\times10^{-3}=3.362\) mK.</li>
<li><b>Hacia delante (exacto).</b> \(T=T_0\sqrt{(1+\beta)/(1-\beta)}=2.72886\) K, es decir, \(T_0+3.364\) mK; el término de segundo orden \(\tfrac12\beta^2T_0=2.07\) µK es el pequeño cuadrupolo de origen cinemático.</li>
<li><b>Resultado.</b> <span class="ans">3.362 mK; 2.72886 K.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>En el experimento de Ives y Stilwell los iones se mueven a \(\beta=0.005\) y emiten Hβ (\(\lambda_0=486.13\) nm). Calcule las longitudes de onda de las líneas desplazadas al azul y al rojo, su media y la predicción clásica (fuente móvil).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Relativista.</b> \(\lambda_\text{azul}=\lambda_0\sqrt{(1-\beta)/(1+\beta)}=483.705\) nm; \(\lambda_\text{rojo}=\lambda_0\sqrt{(1+\beta)/(1-\beta)}=488.567\) nm.</li>
<li><b>Media.</b> \((483.705+488.567)/2=486.136\) nm \(=\gamma\lambda_0\); desplazamiento \(\lambda_0(\gamma-1)=486.13\times1.2500\times10^{-5}=6.08\) pm.</li>
<li><b>Clásica.</b> \(\lambda=\lambda_0(1\mp\beta)=483.699\), \(488.561\) nm; media exacta \(\lambda_0\): desplazamiento 0.</li>
<li><b>Resultado.</b> <span class="ans">483.705 y 488.567 nm; media 486.136 nm (+6.08 pm); clásica: 0.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Una fuente emite isótropamente en su sistema y se mueve a \(0.8c\). Halle el semiángulo del cono con la mitad de los fotones, las intensidades hacia delante y hacia atrás relativas a la isótropa, y el ángulo aparente de una estrella situada a 90° para un observador con ese movimiento.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Cono.</b> La mitad de los fotones es la del hemisferio delantero (\(\cos\theta^*>0\)): \(\cos\theta_{1/2}=\beta=0.8\Rightarrow36.87^\circ\).</li>
<li><b>Intensidades.</b> \(D^2=(1+\beta)/(1-\beta)=1.8/0.2=9\) delante; \(D^2=(1-\beta)/(1+\beta)=0.2/1.8=0.1111\) detrás.</li>
<li><b>Aberración.</b> \(\cos\alpha'=(0+0.8)/(1)=0.8\Rightarrow\alpha'=36.87^\circ\) (desplazamiento \(53.13^\circ\)).</li>
<li><b>Resultado.</b> <span class="ans">36.87°; 9 y 0.111; 36.87°.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Para agua (\(n=1.333\)): halle la energía cinética de umbral del electrón y del muón, el ángulo de Cherenkov de un electrón de 5 MeV y los fotones emitidos por centímetro entre 300 y 600 nm a \(\beta=1\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Umbral.</b> \(\beta_u=1/n=0.7502\), \(\gamma_u=1/\sqrt{1-1/n^2}=1.51234\). \(K_u=(\gamma_u-1)mc^2\): electrón, \(0.51234\times0.510999=0.2618\) MeV; muón, \(0.51234\times105.658=54.13\) MeV.</li>
<li><b>Electrón de 5 MeV.</b> \(\gamma=1+5/0.510999=10.785\), \(\beta=0.995692\); \(\cos\theta_c=1/(1.333\times0.995692)=0.75340\Rightarrow\theta_c=41.11^\circ\).</li>
<li><b>Fotones.</b> \(\dd N/\dd x=2\pi\alpha\sin^2\theta_c(1/\lambda_1-1/\lambda_2)\) con \(\sin^2\theta_c=1-1/n^2=0.43722\) y \(1/\lambda_1-1/\lambda_2=1.6667\times10^6\) m\(^{-1}\): \(2\pi/137.036=0.045851\); \(\dd N/\dd x=0.045851\times0.43722\times1.6667\times10^6=3.341\times10^4\) por metro, o 334 por centímetro.</li>
<li><b>Resultado.</b> <span class="ans">0.2618 MeV y 54.13 MeV; 41.11°; 334 fotones/cm.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Un alambre neutro con 100 A y una carga \(e\) que viaja con \(10^6\) m/s paralela a la corriente a 1 cm. Calcule \(B\), la fuerza en el laboratorio, la carga neta lineal del alambre en el sistema de la carga, el campo \(E'\) y la fuerza allí.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Laboratorio.</b> \(B=\mu_0I/2\pi d=(2\times10^{-7})(100)/0.01=2.000\times10^{-3}\) T; \(F=evB=(1.602\times10^{-19})(10^6)(2\times10^{-3})=3.204\times10^{-16}\) N.</li>
<li><b>Sistema de la carga.</b> \(\lambda'=-\gamma vI/c^2\approx-(10^6)(100)/8.98755\times10^{16}=-1.1127\times10^{-9}\) C/m.</li>
<li><b>Campo.</b> \(E'=\lambda'/(2\pi\varepsilon_0d)=1.1127\times10^{-9}/(2\pi\times8.854\times10^{-12}\times0.01)=2000\) V/m (\(=vB\), con \(\gamma\to1\)).</li>
<li><b>Fuerza.</b> \(F'=eE'=3.204\times10^{-16}\) N: igual a la fuerza magnética; para \(\gamma\ne1\), \(F=F'/\gamma\).</li>
<li><b>Resultado.</b> <span class="ans">\(B=2\times10^{-3}\) T; \(3.204\times10^{-16}\) N; \(\lambda'=1.113\) nC/m; \(E'=2000\) V/m.</span></li>
</ol></details></li>
</ol>
