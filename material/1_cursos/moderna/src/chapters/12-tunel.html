<template class="chapter-src" data-id="tunel" data-num="12" data-title="Pozos finitos, barreras y efecto túnel" data-part="Parte III · Mecánica ondulatoria" data-short="La barrera de potencial y el efecto túnel, la transmisión exacta y la aproximación de barrera gruesa, el pozo finito y sus estados ligados, y el microscopio de efecto túnel como aplicación">
<p class="lead">Una pelota que rueda hacia una colina más alta que su energía vuelve hacia atrás. Una partícula cuántica, en cambio, tiene una probabilidad no nula de aparecer al otro lado. Este capítulo resuelve la ecuación de Schrödinger para los dos casos básicos con paredes finitas, la barrera y el pozo, calcula la probabilidad de túnel con la fórmula exacta y la compara con la aproximación exponencial, y muestra que el mismo mecanismo que permite que un núcleo emita partículas alfa y que el Sol funda hidrógeno permite también «ver» átomos con un microscopio sin lentes. El rasgo común es que la función de onda no se anula bruscamente en la región prohibida clásicamente, sino que decae exponencialmente.</p>

<section>
<h2>La barrera rectangular</h2>
<p>Una partícula de energía \(E\) llega desde la izquierda a una barrera \(V=V_0\) en \(0\le x\le a\). Con \(E\lt V_0\), la ecuación de Schrödinger da en cada región:</p>
<div class="eq">\[\psi=e^{ikx}+r\,e^{-ikx}\ (x\lt0),\qquad \psi=Ce^{\kappa x}+De^{-\kappa x}\ (0\le x\le a),\qquad \psi=t\,e^{ikx}\ (x\gt a),\qquad k=\frac{\sqrt{2mE}}\hbar,\ \ \kappa=\frac{\sqrt{2m(V_0-E)}}\hbar.\]</div>
<p>Dentro de la barrera no hay oscilación sino una combinación de exponenciales reales: la onda no se anula, <em>decae</em> con una longitud de penetración \(1/\kappa\). Imponiendo la continuidad de \(\psi\) y \(\psi'\) en \(x=0\) y \(x=a\) (cuatro ecuaciones) se obtienen \(r\), \(C\), \(D\) y \(t\), y los coeficientes de reflexión y transmisión \(R=|r|^2\), \(T=|t|^2\) (con \(R+T=1\), conservación de la corriente de probabilidad):</p>
<div class="eq key" data-name="Transmisión de una barrera rectangular">\[T=\Bigl[1+\frac{V_0^2\operatorname{senh}^2\kappa a}{4E(V_0-E)}\Bigr]^{-1}\ (E\lt V_0),\qquad T=\Bigl[1+\frac{V_0^2\operatorname{sen}^2k_2a}{4E(E-V_0)}\Bigr]^{-1}\ (E\gt V_0,\ k_2=\tfrac{\sqrt{2m(E-V_0)}}\hbar),\qquad T\xrightarrow{\kappa a\gg1}\frac{16E(V_0-E)}{V_0^2}e^{-2\kappa a}.\]</div>
<p>Tres rasgos. (i) <b>Túnel</b>: \(T\gt0\) aunque \(E\lt V_0\), pero decrece exponencialmente con el espesor y con \(\sqrt{m(V_0-E)}\). (ii) <b>Reflexión sobre la barrera</b>: para \(E\gt V_0\) la mecánica clásica da \(T=1\); la cuántica da \(T\lt1\), salvo en las <em>resonancias</em> \(k_2a=n\pi\), donde \(T=1\) (interferencia entre las ondas reflejadas en las dos caras, como en un interferómetro de Fabry–Pérot). (iii) <b>Dependencia con la masa</b>: la longitud \(1/\kappa\propto1/\sqrt m\) crece cuando la partícula es ligera: túnel de electrones: común; de protones: raro; de objetos macroscópicos: nunca.</p>
<div class="box ex"><h4>Un electrón contra una barrera de 5 eV</h4>
<p><strong>Datos.</strong> \(E=1\) eV, \(V_0=5\) eV, \(\hbar^2/2m_e=0.0380998\) eV·nm². <strong>Procedimiento.</strong> (1) \(\kappa=\sqrt{4/0.0380998}=10.246\) nm\(^{-1}\); longitud de penetración \(1/\kappa=0.0976\) nm. (2) \(a=0.3\) nm: \(\kappa a=3.074\), \(T=5.467\times10^{-3}\); la forma gruesa da \(5.474\times10^{-3}\) (error de 0.12 %). (3) \(a=1\) nm: \(T=3.22\times10^{-9}\); \(a=2\) nm: \(T=4.06\times10^{-18}\): cada 0.1 nm de espesor reduce \(T\) en un factor \(e^{2\kappa\cdot0.1}=7.8\). (4) Con \(E=4.5\) eV, \(a=0.5\) nm: \(T=0.0390\). (5) Con \(E=7\) eV (sobre la barrera), \(a=0.4\) nm: \(T=0.9747\) (\(R=2.5\) %); la resonancia \(k_2a=\pi\) se da en \(E=7.350\) eV, donde \(T=1\). En \(E=V_0\): \(T=1/(1+mV_0a^2/2\hbar^2)=0.160\). <strong>Resultado.</strong> El mismo proceso con un protón (\(1/\kappa\) cuarenta veces menor) daría \(T\sim10^{-115}\) para \(a=0.3\) nm.</p></div>
<div class="sim" data-sim="barrera" data-title="Barrera rectangular: onda estacionaria de dispersión y transmisión T(E)"></div>
<div class="sim-guide"><ul>
<li>Con \(E=1\) eV, \(V_0=5\) eV y \(a=0.3\) nm: \(T=5.467\times10^{-3}\) y \(R=0.99453\), \(\kappa=10.246\) nm\(^{-1}\) (\(1/\kappa=0.098\) nm). Dentro de la barrera la densidad decae de forma exponencial, y a la derecha es una onda plana de amplitud pequeña; a la izquierda hay franjas de interferencia entre la onda incidente y la reflejada (\(|\psi|^2\) oscila entre \((1-|r|)^2\) y \((1+|r|)^2\)).</li>
<li>Suba la energía por encima de \(V_0\): \(T\) oscila entre un mínimo y 1 (resonancias en \(k_2a=n\pi\)); con \(E=7\) eV y \(a=0.4\) nm, \(T=0.9747\). Con \(a=1\) nm la transmisión es muy sensible: \(3.2\times10^{-9}\).</li>
<li>La aproximación de barrera gruesa coincide con la exacta con 0.1 % de error para \(\kappa a\gtrsim3\), y falla para barreras finas (con \(a=0.15\) nm, \(E=3\), \(V_0=4.5\): 0.541 frente a 0.430).</li>
</ul></div>
</section>

<section>
<h2>El pozo de potencial finito</h2>
<p>Para un pozo de profundidad \(V_0\) y anchura \(2a\) (\(V=0\) en \(|x|\lt a\)), los estados ligados tienen \(0\lt E\lt V_0\); dentro, \(\psi\) oscila con \(k=\sqrt{2mE}/\hbar\) y fuera decae con \(\kappa=\sqrt{2m(V_0-E)}/\hbar\). Por la simetría, las soluciones tienen paridad definida: pares (\(\cos kx\) dentro) e impares (\(\operatorname{sen}kx\)). La continuidad de \(\psi\) y de \(\psi'/\psi\) en \(x=a\) da, con \(z=ka\) y \(z_0=(a/\hbar)\sqrt{2mV_0}\):</p>
<div class="eq key" data-name="Estados ligados del pozo finito">\[\text{pares: }z\tan z=\sqrt{z_0^2-z^2},\qquad \text{impares: }-z\cot z=\sqrt{z_0^2-z^2},\qquad E_n=\frac{\hbar^2z_n^2}{2ma^2},\qquad N=\Bigl\lceil\frac{2z_0}\pi\Bigr\rceil.\]</div>
<p>No tienen solución cerrada: se resuelven numéricamente (cruce de la curva de la izquierda con el círculo \(\sqrt{z_0^2-z^2}\)). Hay siempre al menos un estado ligado en una dimensión, por débil que sea el pozo; cada estado está a \(E_n\lt n^2\pi^2\hbar^2/(2m(2a)^2)\) (menor que en el pozo infinito, porque la función de onda se «derrama» fuera y su longitud efectiva es mayor); y para \(V_0\to\infty\) se recupera el pozo infinito. Para \(V_0=10\) eV y \(2a=1\) nm: \(z_0=8.100\), seis estados con energías 0.2976, 1.186, 2.652, 4.663, 7.145 y 9.769 eV (en el pozo infinito serían 0.376, 1.504, 3.384, 6.016, 9.401 y 13.54 eV); el estado fundamental tiene \(0.33\ \%\) de probabilidad fuera del pozo, el sexto, el \(44\ \%\), porque está muy cerca de \(V_0\).</p>
<div class="sim" data-sim="pozo" data-title="Pozo de potencial finito: niveles, función de onda y penetración"></div>
<div class="sim-guide"><ul>
<li>Con \(V_0=10\) eV y \(2a=1\) nm: 6 estados; el fundamental tiene \(E_1=0.29760\) eV (79 % del valor del pozo infinito) y una probabilidad de \(0.33\ \%\) fuera, con penetración \(1/\kappa=0.0627\) nm. Suba \(n\) hasta 6: \(E_6=9.769\) eV y 43.8 % de probabilidad fuera.</li>
<li>Con \(V_0=2\) eV y la misma anchura quedan 3 estados (0.2289, 0.8872, 1.815 eV) y el fundamental sale un 2.6 % del pozo. Con \(V_0=0.5\) eV (\(z_0=1.81\)) quedan 2; con \(V_0=0.1\) eV (\(z_0=0.81\)), uno solo: un pozo débil siempre liga al menos un estado.</li>
<li>Suba \(V_0\) a 1000 eV: 52 estados y los niveles se aproximan a \(n^2E_1^\infty\) con \(E_1^\infty=0.376\) eV; la probabilidad fuera del pozo tiende a cero como \(1/\kappa\).</li>
</ul></div>
</section>

<section>
<h2>El microscopio de efecto túnel</h2>
<p>Binnig y Rohrer (IBM Zúrich, 1981; Nobel 1986) acercaron una punta metálica muy fina a la superficie de una muestra conductora, a una distancia de menos de un nanómetro, y aplicaron un voltaje pequeño: los electrones atraviesan por efecto túnel el vacío entre ambas. La corriente depende exponencialmente de la distancia:</p>
<div class="eq key" data-name="Corriente de túnel">\[I\propto V\,e^{-2\kappa d},\qquad \kappa=\frac{\sqrt{2m\varphi}}\hbar=\frac{\sqrt{\varphi[\text{eV}]}}{0.1951\ \text{nm}}\ \ \Rightarrow\ \ \kappa=10.87\ \text{nm}^{-1}\ \text{para}\ \varphi=4.5\ \text{eV},\]</div>
<p>con \(\varphi\) la función de trabajo (típicamente 4–5 eV). Con ese valor, un cambio de 0.1 nm (1 Å) multiplica la corriente por 8.79 y una década de corriente corresponde a solo 0.106 nm. Esta sensibilidad es lo que da resolución atómica: una corrugación de 10 pm de amplitud (distancia pico a valle de 20 pm) modula la corriente en un factor 1.54, y un cambio de solo 1 pm en la altura cambia la corriente en un 2.2 %, mensurable con un amplificador de corriente. Se escanea la punta con un actuador piezoeléctrico, ya sea a altura constante registrando \(I(x,y)\), ya sea con un circuito de retroalimentación que mantiene \(I\) constante y registra el voltaje piezoeléctrico, que sigue el relieve. En 1983 se resolvió la reconstrucción \(7\times7\) del silicio (111); en 1990 Eigler y Schweizer movieron 35 átomos de xenón sobre níquel para escribir «IBM». La resolución vertical es de picómetros porque depende exponencialmente de \(d\); la lateral, de unas décimas de nanómetro, porque el túnel se concentra en el átomo de la punta más cercano a la muestra.</p>
<div class="sim" data-sim="stm" data-title="Microscopio de efecto túnel: la corriente depende exponencialmente de la distancia"></div>
<div class="sim-guide"><ul>
<li>Con \(\varphi=4.5\) eV: \(\kappa=10.868\) nm\(^{-1}\) (1.087 Å\(^{-1}\)), una década cada 0.1059 nm y un factor 8.79 por ångström. Con \(\varphi=3.5\) eV (metales alcalinos): \(\kappa=9.585\) nm\(^{-1}\) y 6.8 por Å; con 5.5 eV: 12.01 nm\(^{-1}\) y 11.1 por Å.</li>
<li>Con una corrugación de 10 pm la corriente se modula en un factor 1.545 (54 %) de pico a valle al recorrer un átomo; con 1 pm, 2.2 %. Es la razón de la sensibilidad vertical en picómetros.</li>
<li>Sobre la gráfica logarítmica de la derecha se ve que 1 nm de separación atenúa la corriente en \(e^{-2\kappa\cdot0.7}\sim2\times10^{-7}\): por eso la distancia debe mantenerse con precisión sub-ångström y el aparato debe aislarse de las vibraciones.</li>
</ul></div>
<h3>Otras manifestaciones</h3>
<p>El mismo efecto está detrás de varios fenómenos de este curso. La <b>desintegración alfa</b> (Gamow, Gurney y Condon, 1928): una partícula \(\alpha\) de unos 5 MeV en el núcleo atraviesa una barrera de Coulomb de más de 20 MeV; las vidas medias de los emisores \(\alpha\) abarcan más de 24 órdenes de magnitud, de 0.3 µs (\(^{212}\)Po) a \(4.5\times10^9\) años (\(^{238}\)U), porque \(T\) depende exponencialmente de la energía (capítulo 23). En el <b>Sol</b>, la energía térmica de un protón en el núcleo (\(T_c=1.57\times10^7\) K) es \(k_BT=1.35\) keV, unas mil veces menor que la barrera de Coulomb entre dos protones a 1 fm (1.44 MeV): sin túnel no habría fusión (capítulo 24). El <b>diodo túnel</b> (Esaki, 1957; Nobel 1973), las memorias flash (túnel de Fowler–Nordheim a través de óxidos de pocos nanómetros), la unión Josephson (capítulo 21) y la inversión de la molécula de amoníaco, cuyas líneas de inversión, en torno a 23.7–23.9 GHz, son las del primer máser (Townes, 1954), son también túneles.</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un electrón de 1 eV incide sobre una barrera de 5 eV y 0.3 nm de espesor. Halle \(\kappa\), la longitud de penetración, \(T\) exacta y con la aproximación de barrera gruesa, y \(T\) si el espesor es 1 nm.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>\(\kappa\).</b> \(\kappa=\sqrt{2m(V_0-E)}/\hbar=\sqrt{4/0.0380998}=10.246\) nm\(^{-1}\); \(1/\kappa=0.0976\) nm.</li>
<li><b>\(T\) exacta.</b> \(\kappa a=3.0739\); \(\operatorname{senh}(3.0739)=10.79\), \(\operatorname{senh}^2=116.4\); con \(V_0^2/[4E(V_0-E)]=25/16=1.5625\): \(T=1/(1+1.5625\times116.4)=5.467\times10^{-3}\).</li>
<li><b>Barrera gruesa.</b> \(16E(V_0-E)/V_0^2=16\cdot4/25=2.56\); \(2.56\,e^{-6.1476}=5.474\times10^{-3}\) (0.12 % más).</li>
<li><b>1 nm.</b> \(\kappa a=10.246\); \(T=2.56\,e^{-20.49}=3.22\times10^{-9}\).</li>
<li><b>Resultado.</b> <span class="ans">\(\kappa=10.246\) nm\(^{-1}\); 0.0976 nm; \(5.467\times10^{-3}\) y \(5.474\times10^{-3}\); \(3.22\times10^{-9}\).</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>En el microscopio de efecto túnel con \(\varphi=4.5\) eV calcule \(\kappa\), el cambio de corriente por ångström, la distancia para una década de corriente y el cambio relativo de corriente por 1 pm.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>\(\kappa\).</b> \(\kappa=\sqrt{\varphi/(\hbar^2/2m)}=\sqrt{4.5/0.0380998}=10.868\) nm\(^{-1}\).</li>
<li><b>Por ångström.</b> \(e^{2\kappa\cdot0.1\,\text{nm}}=e^{2.1736}=8.790\).</li>
<li><b>Década.</b> \(\ln10/(2\kappa)=2.3026/21.736=0.1059\) nm.</li>
<li><b>Por picómetro.</b> \(e^{2\kappa\times0.001}-1=2.20\ \%\).</li>
<li><b>Resultado.</b> <span class="ans">10.868 nm\(^{-1}\); ×8.79; 0.1059 nm; 2.2 %.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Para un pozo de \(V_0=10\) eV y anchura 1 nm (\(a=0.5\) nm) halle \(z_0\), el número de estados ligados y la energía del fundamental (compárela con el pozo infinito); verifique la ecuación \(z\tan z=\sqrt{z_0^2-z^2}\) para el fundamental.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>\(z_0\).</b> \(z_0=a\sqrt{V_0/(\hbar^2/2m)}=0.5\sqrt{10/0.0380998}=8.1004\); \(N=\lceil2z_0/\pi\rceil=\lceil5.157\rceil=6\).</li>
<li><b>Fundamental.</b> La raíz de \(z\tan z=\sqrt{z_0^2-z^2}\) en \((0,\pi/2)\) se halla numéricamente: \(z_1=1.3974\) (comprobación: \(1.3974\tan1.3974=7.98=\sqrt{65.62-1.953}\)). \(E_1=z_1^2(0.0380998)/a^2=1.9527\times0.0380998/0.25=0.2976\) eV.</li>
<li><b>Pozo infinito.</b> \(\pi^2(0.0380998)/1^2=0.3760\) eV; cociente \(0.7914\).</li>
<li><b>Resultado.</b> <span class="ans">\(z_0=8.100\); 6 estados; \(E_1=0.2976\) eV, 79 % del valor infinito.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Compare el túnel de un electrón y de un protón a través de una barrera con \(V_0-E=4\) eV y \(a=0.3\) nm usando \(T\approx e^{-2\kappa a}\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Electrón.</b> \(\kappa_e=\sqrt{4/0.0380998}=10.246\) nm\(^{-1}\); \(2\kappa a=6.148\); \(T\approx e^{-6.148}=2.1\times10^{-3}\) (con el prefactor 16E(V₀−E)/V₀²: \(5.5\times10^{-3}\)).</li>
<li><b>Protón.</b> \(\kappa_p=\kappa_e\sqrt{m_p/m_e}=10.246\times42.85=439.06\) nm\(^{-1}\); \(2\kappa_pa=263.4\); \(T\approx e^{-263.4}=4\times10^{-115}\).</li>
<li><b>Cociente.</b> \(\kappa_p/\kappa_e=\sqrt{1836.15}=42.85\): la masa entra por la raíz, pero el exponente la amplifica: 112 órdenes de magnitud.</li>
<li><b>Resultado.</b> <span class="ans">\(\sim2\times10^{-3}\) para el electrón; \(\sim4\times10^{-115}\) para el protón.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Un electrón con \(E=7\) eV pasa sobre una barrera de 5 eV y 0.4 nm. Halle \(T\) y la energía de la primera resonancia \(k_2a=\pi\); compare con \(T\) en \(E=V_0\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>\(k_2\).</b> \(k_2=\sqrt{2/0.0380998}=7.245\) nm\(^{-1}\); \(k_2a=2.898\) rad.</li>
<li><b>Transmisión.</b> \(T=[1+V_0^2\operatorname{sen}^2k_2a/(4E(E-V_0))]^{-1}=[1+25(0.0581)/56]^{-1}=0.9747\); \(R=2.5\) %.</li>
<li><b>Resonancia.</b> \(k_2a=\pi\Rightarrow E-V_0=\hbar^2\pi^2/(2ma^2)=0.0380998\,\pi^2/0.16=2.350\) eV \(\Rightarrow E=7.350\) eV, \(T=1\).</li>
<li><b>\(E=V_0\).</b> \(T=1/(1+V_0a^2/4c)=1/(1+5(0.16)/0.152399)=0.160\).</li>
<li><b>Resultado.</b> <span class="ans">0.9747; 7.350 eV; 0.160.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Estime la probabilidad de que el electrón del estado fundamental del pozo de \(V_0=10\) eV y 1 nm esté fuera del pozo, y la longitud de penetración, usando \(E_1=0.2976\) eV.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Constantes.</b> \(k=\sqrt{E_1/0.0380998}=2.7948\) nm\(^{-1}\); \(\kappa=\sqrt{(10-0.2976)/0.0380998}=15.958\) nm\(^{-1}\); \(1/\kappa=0.0627\) nm.</li>
<li><b>Norma dentro.</b> Para \(\psi=A\cos kx\): \(\int_{-a}^aA^2\cos^2kx\,\dd x=A^2[a+\operatorname{sen}(2ka)/2k]=A^2(0.5+0.3398/5.590)=0.5608\,A^2\).</li>
<li><b>Norma fuera.</b> \(2\int_a^\infty A^2\cos^2(ka)\,e^{-2\kappa(x-a)}\dd x=A^2\cos^2(ka)/\kappa=A^2(0.02976/15.958)=0.001865\,A^2\) (con \(\cos1.3974=0.1725\)).</li>
<li><b>Probabilidad.</b> \(P_\text{fuera}=0.001865/(0.5608+0.001865)=3.31\times10^{-3}\).</li>
<li><b>Resultado.</b> <span class="ans">\(P_\text{fuera}=0.33\) %; \(1/\kappa=0.0627\) nm.</span></li>
</ol></details></li>
</ol>
