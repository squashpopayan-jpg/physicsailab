<section>
<h2>Unidades y conversiones</h2>
<p>En las <span class="term">unidades atómicas</span> (Hartree) se toma \(\hbar=m_e=e=4\pi\varepsilon_0=1\): las longitudes se miden en radios de Bohr y las energías en hartrees. La ecuación de Schrödinger del átomo de hidrógeno queda \(\big(-\tfrac12\nabla^2-\tfrac1r\big)\psi=E\psi\), con \(E_1=-\tfrac12\) Ha.</p>
<div class="tablewrap"><table>
<tr><th>Energía</th><th class="c">eV</th><th class="c">kJ/mol</th><th class="c">kcal/mol</th><th class="c">K (\(E/\kB\))</th><th class="c">cm⁻¹</th></tr>
<tr><td>1 eV</td><td class="c num">1</td><td class="c num">96.485</td><td class="c num">23.061</td><td class="c num">11 604.5</td><td class="c num">8065.54</td></tr>
<tr><td>1 Ha</td><td class="c num">27.2114</td><td class="c num">2625.50</td><td class="c num">627.509</td><td class="c num">315 775</td><td class="c num">219 474.6</td></tr>
<tr><td>\(\kB T\) a 300 K</td><td class="c num">0.025 852</td><td class="c num">2.494</td><td class="c num">0.596</td><td class="c num">300</td><td class="c num">208.5</td></tr>

<p>Útiles: un fotón de longitud de onda \(\lambda\) tiene \(E=1239.84/\lambda[\text{nm}]\) eV; \(\hbar^2/2m_e=3.81\) eV·Å²; la distancia B–N en hBN-MC es 1.44 Å.</p>
</section>

<section>
<h2>Fórmulas esenciales</h2>
<h3>Parte I · Mecánica cuántica</h3>
<div class="tablewrap"><table>
<tr><td>Planck, Einstein, de Broglie</td><td class="c">\(E=h\nu,\quad p=h/\lambda,\quad E=\hbar\omega,\ p=\hbar k\)</td></tr>
<tr><td>Ecuación de Schrödinger</td><td class="c">\(i\hbar\,\partial_t\Psi=\hat H\Psi,\qquad \hat H=-\frac{\hbar^2}{2m}\nabla^2+V\)</td></tr>
<tr><td>Regla de Born; valor esperado</td><td class="c">\(P=|\psi|^2\dd x,\qquad \expval{A}=\mel{\psi}{\hat A}{\psi}\)</td></tr>
<tr><td>Incertidumbre</td><td class="c">\(\sigma_x\sigma_p\ge\hbar/2,\qquad [\hat x,\hat p]=i\hbar\)</td></tr>
<tr><td>Pozo infinito, oscilador</td><td class="c">\(E_n=\frac{n^2\pi^2\hbar^2}{2mL^2},\qquad E_n=\hbar\omega(n+\tfrac12)\)</td></tr>
<tr><td>Átomo de hidrógeno</td><td class="c">\(E_n=-\frac{13.606\ \text{eV}}{n^2}=-\frac{1}{2n^2}\ \text{Ha}\)</td></tr>
<tr><td>Espín y exclusión</td><td class="c">\(\Psi(\dots,i,\dots,j,\dots)=-\Psi(\dots,j,\dots,i,\dots)\) para fermiones</td></tr>
</table></div>
<h3>Parte II · De los átomos a los sólidos</h3>
<div class="tablewrap"><table>
<tr><td>Principio variacional</td><td class="c">\(E_0\le\mel{\phi}{\hat H}{\phi}/\braket{\phi}{\phi}\)</td></tr>
<tr><td>Dos niveles acoplados</td><td class="c">\(E_\pm=\frac{\varepsilon_A+\varepsilon_B}{2}\pm\sqrt{\Big(\frac{\varepsilon_A-\varepsilon_B}{2}\Big)^2+t^2}\)</td></tr>
<tr><td>Teorema de Bloch</td><td class="c">\(\psi_{\vb k}(\vb r+\vb R)=\ee^{i\vb k\cdot\vb R}\psi_{\vb k}(\vb r)\)</td></tr>
<tr><td>Bandas del panal (h-BN, grafeno)</td><td class="c">\(E_\pm(\vb k)=\bar\varepsilon\pm\sqrt{(\Delta/2)^2+t^2|f(\vb k)|^2},\quad f=\sum_j\ee^{i\vb k\cdot\boldsymbol\delta_j},\quad E_g=\Delta\)</td></tr>
</table></div>
<h3>Parte III · Teoría del funcional de la densidad</h3>
<div class="tablewrap"><table>
<tr><td>Hohenberg–Kohn</td><td class="c">\(E_0=\min_n E[n],\qquad E[n]=F[n]+\int v\,n\)</td></tr>
<tr><td>Kohn–Sham</td><td class="c">\(\Big[-\tfrac12\nabla^2+v+v_\text{H}[n]+v_\text{xc}[n]\Big]\phi_i=\varepsilon_i\phi_i,\quad n=\sum_i^\text{ocup}|\phi_i|^2\)</td></tr>
<tr><td>Hartree</td><td class="c">\(v_\text{H}(\vb r)=\int\frac{n(\vb r')}{|\vb r-\vb r'|}\dd^3r'\)</td></tr>
<tr><td>Intercambio LDA</td><td class="c">\(\varepsilon_\text{x}(n)=-\tfrac34\big(\tfrac{3}{\pi}\big)^{1/3}n^{1/3}=-\frac{0.4582}{r_s}\ \text{Ha}\)</td></tr>
</table></div>
<h3>Parte IV · Mecánica estadística</h3>
<div class="tablewrap"><table>
<tr><td>Boltzmann y partición</td><td class="c">\(p_i=\ee^{-E_i/\kB T}/Z,\qquad Z=\sum_i\ee^{-E_i/\kB T},\qquad F=-\kB T\ln Z\)</td></tr>
<tr><td>Energía y calor específico</td><td class="c">\(U=\expval E,\qquad C=\Var(E)/\kB T^2\)</td></tr>
<tr><td>Entropía</td><td class="c">\(S=\kB\ln\Omega=-\kB\sum_ip_i\ln p_i\)</td></tr>
<tr><td>Gran canónico; Langmuir</td><td class="c">\(p\propto\ee^{-(E-\mu N)/\kB T},\qquad \theta=\big[1+\ee^{(\varepsilon-\mu)/\kB T}\big]^{-1}\)</td></tr>
<tr><td>Fermi–Dirac, Bose–Einstein</td><td class="c">\(\bar n=\big[\ee^{(\varepsilon-\mu)/\kB T}\pm1\big]^{-1}\)</td></tr>
<tr><td>Hidrógeno gaseoso</td><td class="c">\(\mu_\text{H}=\tfrac12E(\text{H}_2)+\Delta\mu_\text{H}(T,p)\)</td></tr>
<tr><td>Ising: Onsager</td><td class="c">\(\kB T_c=\frac{2J}{\ln(1+\sqrt2)}=2.269J\) (cuadrada), \(1.519J\) (panal)</td></tr>
</table></div>
<h3>Parte V · Monte Carlo</h3>
<div class="tablewrap"><table>
<tr><td>Error de un promedio</td><td class="c">\(\sigma/\sqrt{N_\text{ef}},\qquad N_\text{ef}=N/(2\tau_\text{int})\)</td></tr>
<tr><td>Balance detallado; Metropolis</td><td class="c">\(\pi_iW_{ij}=\pi_jW_{ji},\qquad A=\min\big(1,\ee^{-\Delta E/\kB T}\big)\)</td></tr>
<tr><td>Intercambio de réplicas</td><td class="c">\(A=\min\big(1,\ee^{(\beta_i-\beta_j)(E_i-E_j)}\big)\)</td></tr>
<tr><td>Intervalo de confianza de un lote</td><td class="c">\(\bar x\pm t_{0.975,R-1}\,s/\sqrt R\)</td></tr>
<tr><td>Cumulante de Binder</td><td class="c">\(U_4=1-\expval{m^4}/3\expval{m^2}^2\)</td></tr>
</table></div>
<h3>Parte VI · El modelo de hBN-MC</h3>
<div class="tablewrap"><table>
<tr><td>Modelo de enlaces</td><td class="c">\(E=\sum_{\alpha\le\beta}n_{\alpha\beta}\varepsilon_{\alpha\beta}\)</td></tr>
<tr><td>Coordinación; energía de mezcla</td><td class="c">\(3N_\alpha=2n_{\alpha\alpha}+\sum_{\beta\ne\alpha}n_{\alpha\beta},\qquad w_{\alpha\beta}=\varepsilon_{\alpha\beta}-\tfrac12(\varepsilon_{\alpha\alpha}+\varepsilon_{\beta\beta})\)</td></tr>
<tr><td>Intercambio B↔N; mezcla BN–C</td><td class="c">\(-4w_\text{NB}=6.24\ \text{eV},\qquad w_\text{CN}+w_\text{CB}-w_\text{NB}=0.45\ \text{eV}\)</td></tr>
<tr><td>Energía de formación</td><td class="c">\(E_\text{form}=E_\text{fís}-\sum_in_i\mu_i,\qquad \mu_\text{B}+\mu_\text{N}=3\varepsilon_\text{NB}\)</td></tr>
<tr><td>Ventana química</td><td class="c">\(\Delta\mu_\text{H}\le\frac{E(\text{NH}_3)+E(\text{BH}_3)-\mu_\text{BN}}{6}-\frac{E(\text{H}_2)}{2}\)</td></tr>
<tr><td>Energía de borde</td><td class="c">\(E=\text{cte}+N_\text{H}e_\text{H};\quad e_\text{H}=-8.46\ \text{eV (tesis)},\ \ -0.943-\Delta\mu_\text{H}\ \text{(gran canónico)}\)</td></tr>
<tr><td>Fragmentación de un triángulo de orden \(n\)</td><td class="c">\(\Delta E=(3n^2-3n)\,e_\text{H},\qquad T^*\approx\Delta E/\Delta S\)</td></tr>
</table></div>
</section>
