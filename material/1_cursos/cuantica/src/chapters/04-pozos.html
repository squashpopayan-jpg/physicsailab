<template class="chapter-src" data-id="pozos" data-num="4" data-title="Pozos, barreras y efecto túnel" data-part="Parte I · Fundamentos de la mecánica cuántica" data-short="Ecuación estacionaria en 1D, pozo infinito y finito, escalón, barrera, efecto túnel y resonancias">
<p class="lead">Los problemas unidimensionales con potenciales constantes a trozos se resuelven con lápiz y papel, y sin embargo contienen casi toda la fenomenología cuántica: niveles discretos, energía de punto cero, penetración en zonas prohibidas y paso a través de barreras. Son también el modelo más simple de un electrón confinado en una molécula, un punto cuántico o un nanoporo.</p>

<section>
<h2>La ecuación estacionaria y cómo leerla</h2>
<p>En una dimensión, los estados estacionarios cumplen</p>
<div class="eq key" data-name="Ecuación de Schrödinger independiente del tiempo (1D)">\[-\frac{\hbar^2}{2m}\,\psi''(x)+V(x)\,\psi(x)=E\,\psi(x)\quad\Longleftrightarrow\quad \psi''=\frac{2m}{\hbar^2}\,\big[V(x)-E\big]\,\psi .\]</div>
<p>La segunda forma se lee geométricamente. Donde \(E\gt V\) (región <span class="term">clásicamente permitida</span>), \(\psi''\) tiene signo contrario a \(\psi\): la función se curva hacia el eje y oscila, con número de onda local \(k(x)=\sqrt{2m(E-V)}/\hbar\). Donde \(E\lt V\) (región <span class="term">clásicamente prohibida</span>), \(\psi''\) tiene el mismo signo que \(\psi\): la función se aleja del eje y crece o decae exponencialmente con \(\kappa(x)=\sqrt{2m(V-E)}/\hbar\).</p>
<div class="box def"><p>Condiciones que debe cumplir una solución físicamente aceptable:</p><ul>
<li>\(\psi\) es continua en todas partes.</li>
<li>\(\psi'\) es continua donde \(V\) es finito (un salto finito de \(V\) solo produce un salto en \(\psi''\)).</li>
<li>Para un estado ligado, \(\psi\to0\) cuando \(|x|\to\infty\), de modo que se pueda normalizar.</li>
</ul></div>
<p>Estas condiciones son las que cuantizan la energía: para un potencial que confina, solo ciertos valores de \(E\) permiten que la solución decaiga en ambos extremos. Dos propiedades generales en 1D: los estados ligados no son degenerados, y el estado \(n\)-ésimo (ordenado por energía) tiene exactamente \(n-1\) <span class="term">nodos</span>. Si \(V(-x)=V(x)\), los estados son alternadamente pares e impares.</p>
</section>

<section>
<h2>El pozo infinito</h2>
<p>Una partícula confinada en \(0\lt x\lt L\) por paredes infinitas cumple \(\psi''=-k^2\psi\) dentro, con \(\psi(0)=\psi(L)=0\). La solución \(A\sen kx\) satisface la primera condición; la segunda exige \(kL=n\pi\):</p>
<div class="eq key" data-name="Pozo infinito">\[\psi_n(x)=\sqrt{\frac2L}\,\sen\frac{n\pi x}{L},\qquad E_n=\frac{n^2\pi^2\hbar^2}{2mL^2}=n^2E_1,\qquad n=1,2,3,\dots\]</div>
<p>Observaciones que se generalizan:</p>
<ul>
<li>La energía mínima no es cero: \(E_1\gt0\) es la <span class="term">energía de punto cero</span>, consecuencia de la incertidumbre (confinar cuesta energía cinética).</li>
<li>Las energías crecen como \(1/L^2\): cuanto más pequeña la caja, más separados los niveles. Para un electrón, \(E_1=0.376\un{eV}\,(1\un{nm}/L)^2\).</li>
<li>Las funciones son ortonormales, \(\int_0^L\psi_m\psi_n\,\dd x=\delta_{mn}\), y forman una base completa (la serie de Fourier en senos).</li>
</ul>
<div class="sim" data-sim="pozo-infinito" data-title="Pozo infinito: niveles, funciones y superposiciones"></div>
<div class="sim-guide"><ul>
<li>Reduzca \(L\) a la mitad: todas las energías se multiplican por 4.</li>
<li>Active la superposición de \(n=1\) y \(n=2\): la densidad oscila de un lado a otro con periodo \(h/(E_2-E_1)\).</li>
<li>Cuente los nodos de cada \(\psi_n\): siempre \(n-1\).</li>
</ul></div>
<div class="box explain"><p>La cuerda de una guitarra fija en sus dos extremos solo puede vibrar con ciertas longitudes de onda: la fundamental y sus armónicos. El electrón en una caja es exactamente eso, y la «nota» de cada armónico es su energía. Una cuerda más corta suena más aguda; una caja más pequeña tiene energías más altas.</p></div>
<div class="box ex">
<h4>Color de un punto cuántico</h4>
<p>Modele un nanocristal como una caja de ancho \(L\). ¿Qué \(L\) hace que el salto \(1\to2\) de un electrón absorba luz de 500 nm?</p>
<details><summary>Solución</summary>
<p>\(E_2-E_1=3E_1=hc/\lambda=2.48\) eV \(\Rightarrow E_1=0.827\) eV \(=0.376\un{eV}(1\un{nm}/L)^2\) \(\Rightarrow L=0.67\) nm. El modelo es burdo, pero explica por qué los puntos cuánticos cambian de color con el tamaño.</p>
</details>
</div>
</section>

<section>
<h2>El pozo finito</h2>
<p>Ahora \(V=-V_0\) para \(|x|\lt a=L/2\) y \(V=0\) fuera. Un estado ligado tiene \(-V_0\lt E\lt0\). Dentro la solución oscila, \(\cos kx\) o \(\sen kx\) con \(k=\sqrt{2m(E+V_0)}/\hbar\); fuera decae como \(\ee^{-\kappa|x|}\) con \(\kappa=\sqrt{-2mE}/\hbar\). Igualar la derivada logarítmica \(\psi'/\psi\) en \(x=a\) da las condiciones de cuantización. Con las variables adimensionales \(z=ka\) y \(z_0=a\sqrt{2mV_0}/\hbar\), y usando \(k^2+\kappa^2=2mV_0/\hbar^2\):</p>
<div class="eq key" data-name="Pozo finito: condiciones de cuantización">\[\text{pares: }\ \tan z=\frac{\sqrt{z_0^2-z^2}}{z},\qquad \text{impares: }\ -\cot z=\frac{\sqrt{z_0^2-z^2}}{z},\qquad N_\text{ligados}=\left\lceil\frac{2z_0}{\pi}\right\rceil .\]</div>
<p>Son ecuaciones trascendentes: se resuelven gráfica o numéricamente. Siempre existe al menos un estado ligado par, por poco profundo que sea el pozo. La función penetra en la región prohibida una distancia característica \(1/\kappa\), la <span class="term">longitud de penetración</span>; por eso las energías del pozo finito son algo menores que las de un pozo infinito del mismo ancho (la partícula dispone de algo más de espacio).</p>
<div class="sim" data-sim="pozo-finito" data-title="Pozo finito: solución gráfica y estados ligados"></div>
<div class="sim-guide"><ul>
<li>Cada intersección de las curvas en la gráfica de la izquierda es un estado ligado; al hacer el pozo más profundo aparecen nuevas intersecciones.</li>
<li>Compare las energías de la solución gráfica con las del cálculo numérico por diferencias finitas.</li>
<li>El último estado ligado, cerca de \(E=0\), se extiende mucho fuera del pozo: \(1/\kappa\) diverge.</li>
</ul></div>
</section>

<section>
<h2>Escalones y barreras: reflexión y transmisión</h2>
<p>Si la energía está por encima del potencial en ambos lados, la partícula no está ligada y se describe con ondas planas: una onda incidente \(\ee^{ikx}\), una reflejada \(r\,\ee^{-ikx}\) y una transmitida \(t\,\ee^{ik'x}\). Los coeficientes de reflexión y transmisión son cocientes de corrientes de probabilidad: \(R=|r|^2\), \(T=(k'/k)|t|^2\), con \(R+T=1\).</p>
<p>En un escalón de altura \(V_0\lt E\), clásicamente la partícula siempre pasa; cuánticamente se refleja una fracción</p>
<div class="eq">\[R=\left(\frac{k-k'}{k+k'}\right)^2,\qquad k'=\frac{\sqrt{2m(E-V_0)}}{\hbar}.\]</div>
<h3>El efecto túnel</h3>
<p>Para una barrera rectangular de altura \(V_0\) y ancho \(a\), con \(E\lt V_0\), la solución dentro es una combinación de \(\ee^{\pm\kappa x}\) y la transmisión, calculada imponiendo continuidad de \(\psi\) y \(\psi'\) en los dos bordes, es</p>
<div class="eq key" data-name="Transmisión por una barrera rectangular">\[T=\left[1+\frac{V_0^2\,\senh^2(\kappa a)}{4E(V_0-E)}\right]^{-1}\ \xrightarrow{\ \kappa a\gg1\ }\ T\approx16\,\frac{E}{V_0}\Big(1-\frac{E}{V_0}\Big)\,\ee^{-2\kappa a}.\]</div>
<p>La partícula atraviesa una región donde clásicamente no puede estar. La dependencia exponencial con \(\kappa a\) hace el efecto extremadamente sensible al ancho: para un electrón y una barrera que está 4 eV por encima de su energía, añadir 1 Å de ancho reduce la transmisión en un factor \(\ee^{2\kappa\cdot1\un{Å}}\approx8\). Para \(E\gt V_0\) aparecen <span class="term">resonancias</span> con \(T=1\) cuando \(k'a=n\pi\): la onda dentro de la barrera interfiere constructivamente consigo misma. Para barreras de forma arbitraria, la aproximación WKB da \(T\approx\exp\!\big(-2\int\kappa(x)\,\dd x\big)\).</p>
<div class="sim" data-sim="barrera-tunel" data-title="Barrera de potencial: transmisión y función de onda"></div>
<div class="sim-guide"><ul>
<li>Con la escala logarítmica, \(\ln T\) cae casi linealmente con el ancho: la pendiente es \(-2\kappa\).</li>
<li>Por encima de la barrera, \(T\) oscila y toca el valor 1 en las resonancias.</li>
<li>Con dos barreras, la transmisión es casi total en energías muy concretas (<span class="term">túnel resonante</span>): son los niveles del pozo que queda entre ellas.</li>
</ul></div>
<div class="sim" data-sim="paquete-barrera" data-title="Un paquete de ondas contra una barrera"></div>
<div class="sim-guide"><ul>
<li>El paquete se divide en una parte reflejada y otra transmitida; cada partícula individual, al medirse, estará en una de las dos.</li>
<li>La probabilidad transmitida coincide con el promedio de \(T(k)\) sobre las componentes del paquete, no con \(T(k_0)\).</li>
</ul></div>
<div class="box note"><p>El efecto túnel está detrás del microscopio de efecto túnel (la corriente cambia un orden de magnitud por ångström de distancia, lo que permite ver átomos), de la desintegración alfa de los núcleos y de la memoria flash. El propio h-BN se usa como barrera de túnel ultradelgada en dispositivos de grafeno: con su brecha de unos 6 eV, la corriente cae exponencialmente con el número de capas atómicas de h-BN.</p></div>
<div class="box valid"><p>La simulación de la barrera evalúa la fórmula cerrada y, para varias barreras, el método de matrices de transferencia; el apéndice B verifica que ambos coinciden con error menor que \(10^{-10}\). El pozo finito se valida comparando las raíces de la ecuación trascendente con la diagonalización por diferencias finitas en una malla alineada con los bordes (error relativo menor que \(10^{-6}\)).</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>Donde \(E\gt V\) la función oscila; donde \(E\lt V\) crece o decae exponencialmente.</li>
<li>Las condiciones de contorno cuantizan la energía; el nivel \(n\) tiene \(n-1\) nodos.</li>
<li>Pozo infinito: \(E_n=n^2\pi^2\hbar^2/2mL^2\); confinar más sube la energía como \(1/L^2\).</li>
<li>Pozo finito: condiciones trascendentes, penetración \(1/\kappa\) en la zona prohibida.</li>
<li>Barrera: \(T\sim\ee^{-2\kappa a}\) para barreras gruesas; resonancias \(T=1\) sobre la barrera.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule \(E_1\), \(E_2\) y \(E_3\) para un electrón en una caja de 0.5 nm.
<details><summary>Respuesta</summary><p>\(E_1=1.50\) eV, \(E_2=6.02\) eV, \(E_3=13.5\) eV.</p></details></li>
<li><span class="lvl">Básico</span>¿Cuántos estados ligados tiene un pozo finito con \(z_0=5\)?
<details><summary>Respuesta</summary><p>\(\lceil10/\pi\rceil=\lceil3.18\rceil=4\).</p></details></li>
<li><span class="lvl">Intermedio</span>Un electrón de 1 eV incide sobre una barrera de 5 eV y 5 Å. Estime \(T\).
<details><summary>Respuesta</summary><p>\(\kappa=\sqrt{4/3.81}\) Å⁻¹ \(=1.025\) Å⁻¹; \(\kappa a=5.12\); \(T\approx16\cdot0.2\cdot0.8\cdot\ee^{-10.25}=9.1\times10^{-5}\).</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que \(R+T=1\) para el escalón con \(E\gt V_0\).
<details><summary>Respuesta</summary><p>\(r=(k-k')/(k+k')\), \(t=2k/(k+k')\); \(R+T=\frac{(k-k')^2+4kk'}{(k+k')^2}=1\).</p></details></li>
<li><span class="lvl">Avanzado</span>Para la superposición \((\psi_1+\psi_2)/\sqrt2\) del pozo infinito, calcule \(\expval x(t)\).
<details><summary>Respuesta</summary><p>\(\expval x=\frac L2-\frac{16L}{9\pi^2}\cos\!\big(\frac{(E_2-E_1)t}{\hbar}\big)\): oscila con amplitud \(0.18L\).</p></details></li>
</ol>
</section>
