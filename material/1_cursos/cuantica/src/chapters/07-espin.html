<template class="chapter-src" data-id="espin" data-num="7" data-title="Espín y partículas idénticas" data-part="Parte I · Fundamentos de la mecánica cuántica" data-short="Stern–Gerlach, espín ½, matrices de Pauli, bosones y fermiones, exclusión de Pauli, intercambio y llenado de niveles">
<p class="lead">Al electrón le falta todavía una propiedad: un momento angular propio, el espín, que no tiene análogo clásico. Y cuando hay varios electrones aparece una regla sin equivalente en la física clásica: dos electrones son estrictamente indistinguibles, y su función de onda debe cambiar de signo al intercambiarlos. De esa regla salen la tabla periódica, la estabilidad de la materia y la energía de intercambio que la DFT tendrá que aproximar.</p>

<section>
<h2>El experimento de Stern–Gerlach</h2>
<p>En 1922 Otto Stern y Walther Gerlach hicieron pasar un haz de átomos de plata por un campo magnético no uniforme. Un imán diminuto con momento magnético \(\vb\mu\) en un campo con gradiente sufre una fuerza \(F_z=\mu_z\,\partial B_z/\partial z\); si los imanes atómicos estuvieran orientados al azar, el haz se ensancharía en una mancha continua. Se observaron exactamente <em>dos</em> manchas. El momento magnético de la plata se debe a un único electrón desapareado con \(l=0\): el electrón tiene un momento angular intrínseco cuya proyección solo toma dos valores.</p>
<div class="box def"><p>El <span class="term">espín</span> es un momento angular intrínseco \(\vb S\) con número cuántico \(s=\tfrac12\) para el electrón (también para protón y neutrón). Sus proyecciones son \(S_z=m_s\hbar\) con \(m_s=\pm\tfrac12\) («arriba» ↑ y «abajo» ↓), y \(|\vb S|=\hbar\sqrt{s(s+1)}=\tfrac{\sqrt3}{2}\hbar\).</p></div>
<p>El estado de espín es un vector de dos componentes (un <span class="term">espinor</span>), \(\chi=a\ket\uparrow+b\ket\downarrow\), exactamente el sistema de dos niveles del capítulo 3. Los operadores de espín son matrices \(2\times2\):</p>
<div class="eq key" data-name="Matrices de Pauli">\[\op{\vb S}=\frac\hbar2\,\vb\sigma,\qquad \sigma_x=\begin{pmatrix}0&1\\1&0\end{pmatrix},\ \ \sigma_y=\begin{pmatrix}0&-i\\i&0\end{pmatrix},\ \ \sigma_z=\begin{pmatrix}1&0\\0&-1\end{pmatrix},\qquad [\sigma_x,\sigma_y]=2i\sigma_z .\]</div>
<p>Medir el espín a lo largo de una dirección \(\uv n\) que forma un ángulo \(\theta\) con el estado da «+» con probabilidad \(\cos^2(\theta/2)\). Un electrón preparado ↑ en \(z\) y medido en \(x\) da ± con 50 % cada uno; y si después se vuelve a medir en \(z\), ¡vuelve a salir 50 %! La medida en \(x\) borró la información sobre \(z\).</p>
<div class="sim" data-sim="stern-gerlach" data-title="Aparatos de Stern–Gerlach en serie"></div>
<div class="sim-guide"><ul>
<li>Configuración z–x–z: bloquee la salida − del primer aparato. Aunque todos los átomos que entran al tercero «eran ↑ en z», el tercero da mitad y mitad.</li>
<li>Configuración z–z: el segundo aparato siempre confirma el resultado del primero (postulado de reducción).</li>
<li>Con ángulos intermedios, compare las cuentas con \(\cos^2(\theta/2)\).</li>
</ul></div>
</section>

<section>
<h2>Espín en un campo magnético</h2>
<p>El espín lleva asociado un momento magnético \(\vb\mu=-g\mu_\text B\vb S/\hbar\), con el <span class="term">magnetón de Bohr</span> \(\mu_\text B=e\hbar/2m_e=5.788\times10^{-5}\) eV/T y el factor \(g\approx2.0023\). En un campo \(\vb B=B\uv z\) el hamiltoniano es</p>
<div class="eq key" data-name="Espín en un campo magnético">\[\op H=-\vb\mu\cdot\vb B=\frac{g\mu_\text BB}{2}\,\sigma_z,\qquad \Delta E=g\mu_\text BB,\qquad \omega_L=\frac{g\mu_\text BB}{\hbar}.\]</div>
<p>Los dos niveles se separan (efecto Zeeman: 0.116 meV por tesla) y un espín inclinado precesa alrededor del campo con la frecuencia de Larmor, 28 GHz por tesla para el electrón. La resonancia de espín electrónico y la resonancia magnética nuclear (de los núcleos ¹¹B y ¹⁴N en el h-BN, por ejemplo) se basan en estas ecuaciones.</p>
</section>

<section>
<h2>Partículas idénticas: bosones y fermiones</h2>
<p>Dos bolas de billar se pueden distinguir siempre siguiendo sus trayectorias. Dos electrones no: sus funciones de onda se solapan y no hay trayectorias. Si \(\psi(1,2)\) describe dos partículas idénticas (1 y 2 abrevian posición y espín), intercambiarlas no puede cambiar ninguna probabilidad: \(|\psi(2,1)|^2=|\psi(1,2)|^2\). Al intercambiar dos veces se vuelve al estado original, así que \(\psi(2,1)=\pm\psi(1,2)\):</p>
<div class="eq key" data-name="Simetría de intercambio">\[\psi(2,1)=+\psi(1,2)\ \ \text{(bosones: espín entero)},\qquad \psi(2,1)=-\psi(1,2)\ \ \text{(fermiones: espín semientero)} .\]</div>
<p>El <span class="term">teorema de espín-estadística</span> de la teoría cuántica de campos relaciona el signo con el espín. Electrones, protones y neutrones son fermiones; fotones, fonones y átomos de ⁴He son bosones.</p>
<h3>El principio de exclusión de Pauli</h3>
<p>Si dos fermiones ocupan los estados de una partícula (espín-orbitales) \(\varphi_a\) y \(\varphi_b\), la única combinación antisimétrica es</p>
<div class="eq key" data-name="Determinante de Slater">\[\psi(1,2)=\frac{1}{\sqrt2}\Big[\varphi_a(1)\varphi_b(2)-\varphi_b(1)\varphi_a(2)\Big]=\frac1{\sqrt2}\begin{vmatrix}\varphi_a(1)&\varphi_b(1)\\\varphi_a(2)&\varphi_b(2)\end{vmatrix},\]</div>
<p>que se anula idénticamente si \(a=b\): <strong>dos fermiones no pueden ocupar el mismo espín-orbital</strong>. Para \(N\) electrones, la función antisimétrica más sencilla es el determinante \(N\times N\) de Slater. En un átomo, cada orbital espacial admite a lo sumo dos electrones, con espines opuestos.</p>
<h3>Singlete, triplete y el hueco de intercambio</h3>
<p>La antisimetría se aplica a la función total, espacio × espín. Para dos electrones hay dos opciones: parte espacial simétrica con espín antisimétrico (<span class="term">singlete</span>, espín total 0) o parte espacial antisimétrica con espín simétrico (<span class="term">triplete</span>, espín total 1). En el triplete, \(\psi(\vb r,\vb r)=0\): los electrones con el mismo espín se evitan, rodeados de un <span class="term">hueco de intercambio</span>. Como se repelen menos, su energía de Coulomb es menor en la cantidad \(K_{ab}\) (la <span class="term">integral de intercambio</span>). Esta es la razón de la primera regla de Hund: los electrones de una capa incompleta prefieren espines paralelos.</p>
<div class="sim" data-sim="particulas-identicas" data-title="Dos partículas idénticas en una caja"></div>
<div class="sim-guide"><ul>
<li>Fermiones: la densidad \(|\psi(x_1,x_2)|^2\) se anula en toda la diagonal \(x_1=x_2\). Bosones: se refuerza sobre ella.</li>
<li>Compare la distancia media \(\expval{|x_1-x_2|}\) y la energía de repulsión: los fermiones del mismo espín se mantienen más separados.</li>
<li>Con \(n_a=n_b\) no existe estado de fermiones (en el mismo espín): la función se anula entera.</li>
</ul></div>
<div class="box explain"><p>Los fermiones son como pasajeros de un bus en el que cada asiento admite a una sola persona (dos si una va mirando hacia delante y otra hacia atrás, que es el espín). Los bosones son como fotones en un concierto: todos pueden amontonarse delante del escenario, e incluso lo prefieren.</p></div>
</section>

<section>
<h2>Llenar niveles: la energía de Fermi</h2>
<p>Para \(N\) fermiones que no interactúan, el estado fundamental se construye llenando los niveles de una partícula desde abajo, dos electrones (↑↓) por nivel. La energía del último nivel ocupado es la <span class="term">energía de Fermi</span> \(E_F\). En una caja de longitud \(L\), con \(N\) par,</p>
<div class="eq">\[E_F=\frac{\pi^2\hbar^2}{2mL^2}\Big(\frac N2\Big)^2,\qquad E_\text{total}=2\sum_{n=1}^{N/2}\frac{\pi^2\hbar^2n^2}{2mL^2}\approx\frac{N}{3}\,E_F\ \ (N\gg1).\]</div>
<p>La energía total crece como \(N^3\): comprimir fermiones cuesta muchísimo. Esa <span class="term">presión de degeneración</span> es la que impide que la materia colapse y sostiene a las enanas blancas. Los bosones, en cambio, pueden estar todos en el nivel más bajo, con energía total \(NE_1\).</p>
<div class="sim" data-sim="llenado" data-title="Llenado de niveles: fermiones, fermiones sin espín y bosones"></div>
<div class="sim-guide"><ul>
<li>Añada partículas: con fermiones de espín ½ los niveles se llenan de dos en dos; la energía total sigue la curva \(N^3\).</li>
<li>La densidad total \(n(x)=\sum|\varphi_i|^2\) tiene \(N/2\) ondulaciones: es un ejemplo de densidad electrónica como las de la DFT.</li>
</ul></div>
<div class="box hbn"><p>El sistema de Kohn–Sham de la DFT (capítulo 16) es exactamente esto: \(N\) electrones ficticios que no interactúan, llenando orbitales de dos en dos según el principio de Pauli, con la densidad \(n(\vb r)=\sum_i|\varphi_i(\vb r)|^2\). Todo el efecto del intercambio (el hueco que acabamos de ver) y de la correlación queda encerrado en un único término, \(E_\text{xc}[n]\), que es lo que aproximan LDA y GGA. En los cálculos SIESTA de la tesis, sin polarización de espín, cada orbital de Kohn–Sham lleva dos electrones.</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>El electrón tiene espín ½: \(S_z=\pm\hbar/2\); su estado es un espinor de dos componentes y sus operadores, las matrices de Pauli.</li>
<li>Medir en una dirección a \(\theta\) del estado da + con probabilidad \(\cos^2(\theta/2)\); cada medida reduce el estado.</li>
<li>Partículas idénticas: \(\psi\) simétrica (bosones) o antisimétrica (fermiones) bajo intercambio.</li>
<li>Pauli: dos fermiones no comparten espín-orbital; la antisimetría crea el hueco de intercambio y la regla de Hund.</li>
<li>\(N\) fermiones llenan los niveles de dos en dos hasta \(E_F\); es el punto de partida de átomos, bandas y Kohn–Sham.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule los autovalores de \(\sigma_x\) y sus autovectores.
<details><summary>Respuesta</summary><p>\(\pm1\), con \((1,\pm1)/\sqrt2\): los estados ↑ y ↓ a lo largo de \(x\).</p></details></li>
<li><span class="lvl">Básico</span>¿Cuánto vale la separación Zeeman del electrón en un campo de 9.4 T? ¿A qué frecuencia de microondas corresponde?
<details><summary>Respuesta</summary><p>\(\Delta E=2.0023\cdot5.788\times10^{-5}\cdot9.4=1.09\) meV; \(\nu=\Delta E/h=263\) GHz.</p></details></li>
<li><span class="lvl">Intermedio</span>Un electrón preparado ↑ en \(z\) pasa por un aparato orientado a 60° y se selecciona la salida +. ¿Qué fracción pasa? Si luego se mide en \(z\), ¿qué fracción da ↓?
<details><summary>Respuesta</summary><p>\(\cos^230^\circ=0.75\); después, \(\sen^230^\circ=0.25\) da ↓ (y 0.75 ↑).</p></details></li>
<li><span class="lvl">Intermedio</span>Escriba el determinante de Slater de tres electrones en \(\varphi_1\uparrow\), \(\varphi_1\downarrow\), \(\varphi_2\uparrow\) y compruebe que cambia de signo al intercambiar dos electrones.
<details><summary>Respuesta</summary><p>\(\psi=\frac1{\sqrt6}\det[\chi_j(i)]\); intercambiar dos electrones intercambia dos filas del determinante, lo que cambia su signo.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que para \(N\gg1\) fermiones en una caja 1D la energía media por partícula es \(E_F/3\).
<details><summary>Respuesta</summary><p>\(E=2E_1\sum_{n=1}^{N/2}n^2\approx2E_1\frac{(N/2)^3}{3}=\frac N3E_1\big(\frac N2\big)^2=\frac N3E_F\).</p></details></li>
</ol>
</section>
