<template class="chapter-src" data-id="formacion" data-num="28" data-title="Potenciales químicos, energía de formación y estabilidad de los poros" data-part="Parte VI · El modelo de hBN-MC" data-short="Reservorios, ventana química, energía de formación de vacancias y poros, energía de borde por hidrógeno y penalización H–H">
<p class="lead">Un poro en una lámina de h-BN no aparece de la nada: los átomos que faltan se fueron a algún sitio (al gas, al haz de electrones del microscopio) y los hidrógenos del borde vinieron de algún sitio. Para decir si un defecto es «barato» o «caro» hay que llevar la cuenta de ese intercambio con los reservorios. Es el ensamble gran canónico del capítulo 22 aplicado a hBN-MC.</p>

<section>
<h2>Energía de formación</h2>
<p>Si la lámina intercambia átomos con reservorios de potenciales químicos \(\mu_i\), la cantidad que decide la estabilidad no es la energía sino el gran potencial \(E-\sum_i\mu_iN_i\) (capítulo 22). La <span class="term">energía de formación</span> de una configuración es</p>
<div class="eq key" data-name="Energía de formación">\[E_\text{form}=E_\text{fís}-n_\text{B}\,\mu_\text{B}-n_\text{N}\,\mu_\text{N}-n_\text{C}\,\mu_\text{C}-n_\text{H}\,\mu_\text{H},\]</div>
<p>donde \(E_\text{fís}\) es la energía del modelo de enlaces sin términos artificiales (sin el término X–X ni penalizaciones) y \(n_i\) el número de átomos de cada especie, incluidos los H de pasivación. Restar \(\mu_in_i\) significa «cobrar» a cada átomo lo que vale en su reservorio: un defecto tiene \(E_\text{form}\lt0\) si sacar esos átomos y traer esos H baja el gran potencial.</p>
<div class="box explain"><p>Es una contabilidad de empresa: no basta con saber cuánto vale el edificio después de una remodelación; hay que descontar lo que se vendió (los átomos que se fueron, a su precio de mercado \(\mu\)) y lo que se compró (los H). Los potenciales químicos son los precios de mercado de cada especie.</p></div>
<p>hBN-MC fija la escala con \(\mu_\text{B}+\mu_\text{N}=\mu_\text{BN}=3\varepsilon_\text{NB}\) (la energía de un par BN en la lámina perfecta según el propio modelo) y \(\mu_\text{C}=\tfrac32\varepsilon_\text{CC}\). Con esa elección, la lámina perfecta de h-BN y la de grafeno tienen \(E_\text{form}=0\) exactamente.</p>
</section>

<section>
<h2>El potencial químico del hidrógeno y la ventana química</h2>
<p>El reservorio de H es el gas H<sub>2</sub>: \(\mu_\text{H}=\tfrac12E(\text{H}_2)+\Delta\mu_\text{H}\), donde \(\Delta\mu_\text{H}(T,p)\) es la contribución de traslación, rotación y vibración calculada en el capítulo 22 (por ejemplo, −0.57 eV a 1000 K y 1 bar). Para B y N, la lámina impone \(\mu_\text{B}+\mu_\text{N}=\mu_\text{BN}\) y quedan dos límites:</p>
<ul>
<li><strong>rico en N</strong>: el N está en equilibrio con NH<sub>3</sub>, \(\mu_\text{N}^\text{máx}=E(\text{NH}_3)-3\mu_\text{H}\) (si \(\mu_\text{N}\) fuera mayor, la lámina se descompondría formando amoníaco);</li>
<li><strong>rico en B</strong>: el B está en equilibrio con BH<sub>3</sub>, \(\mu_\text{B}^\text{máx}=E(\text{BH}_3)-3\mu_\text{H}\), es decir \(\mu_\text{N}^\text{mín}=\mu_\text{BN}-\mu_\text{B}^\text{máx}\).</li>
</ul>
<p>La <span class="term">ventana química</span> es el intervalo \(\mu_\text{N}^\text{mín}\le\mu_\text{N}\le\mu_\text{N}^\text{máx}\). Solo existe si \(\mu_\text{N}^\text{máx}\ge\mu_\text{N}^\text{mín}\), es decir, si</p>
<div class="eq key" data-name="Apertura de la ventana química">\[E(\text{NH}_3)+E(\text{BH}_3)-6\mu_\text{H}\ \ge\ \mu_\text{BN}\quad\Longleftrightarrow\quad \Delta\mu_\text{H}\le\frac{E(\text{NH}_3)+E(\text{BH}_3)-\mu_\text{BN}}{6}-\frac{E(\text{H}_2)}{2}.\]</div>
<p>Con las energías de la Tabla 5.1 de la tesis, \(E(\text{NH}_3)+E(\text{BH}_3)-3E(\text{H}_2)=-388.064\) eV es <em>menor</em> que \(E(\text{BN})=-386.72\) eV: con \(\Delta\mu_\text{H}=0\) la lámina es menos estable que NH<sub>3</sub> + BH<sub>3</sub> por 1.34 eV por par BN y la ventana está vacía. Se abre para</p>
<ul>
<li>\(\Delta\mu_\text{H}\le-0.224\) eV con \(\mu_\text{BN}=E(\text{BN})\) (≈ 575 K a 1 bar de H<sub>2</sub>);</li>
<li>\(\Delta\mu_\text{H}\le-0.596\) eV con \(\mu_\text{BN}=3\varepsilon_\text{NB}\), la escala del modelo (≈ 1030 K a 1 bar, ≈ 640 K a \(10^{-5}\) bar).</li>
</ul>
<div class="sim" data-sim="ventana-quimica" data-title="La ventana química del nitrógeno frente a Δμ<sub>H</sub>"></div>
<div class="sim-guide"><ul>
<li>La zona sombreada es el intervalo permitido de \(\mu_\text{N}\). Por encima del umbral de \(\Delta\mu_\text{H}\) las dos rectas se cruzan y la ventana desaparece.</li>
<li>Cambie la referencia de \(\mu_\text{BN}\): el umbral se desplaza de −0.596 a −0.224 eV.</li>
<li>La lectura de temperatura traduce \(\Delta\mu_\text{H}\) a la temperatura de un gas de H<sub>2</sub> a la presión elegida (capítulo 22).</li>
</ul></div>
<div class="box warn"><p>Que la lámina sea inestable frente a la hidrogenación con \(\Delta\mu_\text{H}=0\) es un resultado que el informe de hBN-MC señala para discusión: o la energía de referencia del H<sub>2</sub> en SIESTA no está bien convergida respecto a las demás, o los cálculos describen condiciones pobres en hidrógeno. hBN-MC lo advierte y dice a partir de qué \(\Delta\mu_\text{H}\) se abre la ventana. (Hasta la versión 14.x, los límites rico en N y rico en B estaban intercambiados sin advertirlo.)</p></div>
</section>

<section>
<h2>Vacancias pasivadas</h2>
<p>Una vacancia de B pasivada con tres H (V<sub>B</sub> + 3H) cambia 3 enlaces N–B por 3 N–H, saca un B y trae tres H:</p>
<div class="eq key" data-name="Formación de V_B + 3H y V_N + 3H">\[E_\text{form}(\text{V}_\text{B}+3\text{H})=3\varepsilon_\text{XN}-\mu_\text{N}-3\mu_\text{H},\qquad E_\text{form}(\text{V}_\text{N}+3\text{H})=3\varepsilon_\text{XB}-\mu_\text{B}-3\mu_\text{H}.\]</div>
<p>(Para el primero: \(-3\varepsilon_\text{NB}+3\varepsilon_\text{XN}+\mu_\text{B}-3\mu_\text{H}\), con \(\mu_\text{B}=3\varepsilon_\text{NB}-\mu_\text{N}\).) En el límite rico en N, \(\mu_\text{N}+3\mu_\text{H}=E(\text{NH}_3)\) y \(E_\text{form}(\text{V}_\text{B}+3\text{H})=3\big(\varepsilon_\text{XN}-E(\text{NH}_3)/3\big)=-1.026\) eV, independiente de \(\Delta\mu_\text{H}\) y de \(\varepsilon_\text{NB}\). En el rico en B, \(E_\text{form}(\text{V}_\text{N}+3\text{H})=-1.056\) eV.</p>
<p>Un poro triangular de orden \(n\) con bordes de N (\(n^2\) vacancias, \(3n\) enlaces N–H) saca \(n\) átomos de B más que de N. Como los pares BN completos cuestan exactamente \(\mu_\text{BN}\), resulta</p>
<div class="eq key" data-name="Poros triangulares">\[E_\text{form}(\text{triángulo}_n^\text{N})=n\,E_\text{form}(\text{V}_\text{B}+3\text{H}),\qquad E_\text{form}(\text{triángulo}_n^\text{B})=n\,E_\text{form}(\text{V}_\text{N}+3\text{H}):\]</div>
<p>proporcional al número de H del borde. En ambiente rico en N los triángulos con borde de N son los más favorables, y en rico en B los de borde de B: una predicción de orden relativo que puede compararse con la microscopía electrónica, donde a temperatura ambiente predominan los poros triangulares con bordes de N.</p>
<div class="sim" data-sim="eform-mu" data-title="Energía de formación de vacancias y poros frente a μ<sub>N</sub>"></div>
<div class="sim-guide"><ul>
<li>Las rectas de pendiente −1 (bordes de N) y +1 (bordes de B) se cruzan cerca del centro de la ventana.</li>
<li>Al aumentar el orden \(n\) del poro, la recta se escala por \(n\): el signo y el orden relativo no cambian.</li>
<li>Los valores salen del motor de red del curso (red de 30 × 30 con el poro), y coinciden con las fórmulas cerradas.</li>
</ul></div>
<div class="box warn"><p>Energías de formación negativas significan que, en esas condiciones, la lámina «quiere» llenarse de vacancias pasivadas. Aquí ocurre porque \(\varepsilon_\text{XN}\) y \(\varepsilon_\text{XB}\) son 0.34–0.35 eV más negativos que \(E(\text{NH}_3)/3\) y \(E(\text{BH}_3)/3\). Es una consecuencia de la escala de los parámetros (capítulo 27), no una predicción física robusta: lo confiable es el <em>orden relativo</em> de las energías de formación entre formas y terminaciones.</p></div>
<div class="box valid"><p>El apéndice B comprueba \(E_\text{form}=0\) para la lámina perfecta, \(-1.026\) eV para V<sub>B</sub> + 3H en rico en N, \(-1.056\) eV para V<sub>N</sub> + 3H en rico en B, los umbrales de apertura −0.224 y −0.596 eV, que \(E_\text{form}\) de un triángulo de orden 4 es exactamente 4 veces la de V<sub>B</sub> + 3H y que fragmentar el triángulo de 25 vacancias con el reservorio de la tesis cuesta −507.5 eV (informe: −507 eV).</p></div>
</section>

<section>
<h2>La energía de borde por hidrógeno</h2>
<p>En una lámina de h-BN ordenada, con la composición y el número de vacancias fijos (como en el Monte Carlo, que solo intercambia sitios), la energía depende de la forma de los poros únicamente a través del número de H del borde:</p>
<div class="eq key" data-name="Energía de borde">\[E=\text{constante}+N_\text{H}\,e_\text{H},\qquad e_\text{H}=-\frac{\varepsilon_\text{NB}-\varepsilon'_\text{XN}-\varepsilon'_\text{XB}}{2}-\frac{\varepsilon'_\text{XX}}{2},\]</div>
<p>donde las primas indican los valores efectivos del Monte Carlo con el reservorio activo. Hay dos formulaciones en hBN-MC:</p>
<ul>
<li><strong>Tesis 2019</strong>: \(\varepsilon'_\text{XY}=\varepsilon_\text{XY}\) y \(\varepsilon'_\text{XX}=E(\text{H}_2)/2\). Resulta \(e_\text{H}=-8.46\) eV.</li>
<li><strong>Gran canónico respecto de H<sub>2</sub></strong>: \(\varepsilon'_\text{XY}=\varepsilon_\text{XY}-\mu_\text{H}\) y \(\varepsilon'_\text{XX}=0\). Resulta \(e_\text{H}=-0.943\ \text{eV}-\Delta\mu_\text{H}\): −0.94 eV para \(\Delta\mu_\text{H}=0\) y +0.56 eV para \(\Delta\mu_\text{H}=-1.5\) eV.</li>
</ul>
<p>El signo de \(e_\text{H}\) lo decide todo. Si \(e_\text{H}\lt0\), aumentar el perímetro baja la energía y un poro compacto se <em>fragmenta</em> en monovacancias: un triángulo de orden \(n\) tiene \(3n\) H, y sus \(n^2\) vacancias separadas tendrían \(3n^2\), así que</p>
<div class="eq key" data-name="Energía de fragmentación">\[\Delta E_\text{frag}=(3n^2-3n)\,e_\text{H}.\]</div>
<p>Para \(n=5\) con el Hamiltoniano de la tesis, \(60\times(-8.46)=-507\) eV: fragmentarse es enormemente favorable. En modo gran canónico, el poro compacto es estable solo si \(\Delta\mu_\text{H}\lt-0.943\) eV (≈ 1420 K a 1 bar, ≈ 900 K a \(10^{-5}\) bar).</p>
<div class="sim" data-sim="energia-borde" data-title="Energía de borde: ¿poro compacto o fragmentado?"></div>
<div class="sim-guide"><ul>
<li>Las dos redes tienen exactamente los mismos átomos y vacancias; solo cambia cómo están agrupadas las vacancias.</li>
<li>La diferencia de energía calculada con el motor completo coincide con \(\Delta N_\text{H}\,e_\text{H}\) hasta \(10^{-8}\) eV.</li>
<li>Con el reservorio de la tesis gana siempre la fragmentación; en gran canónico, el signo cambia en \(\Delta\mu_\text{H}=-0.943\) eV.</li>
</ul></div>
<div class="box explain"><p>Cada H del borde es como un «sello» que el sistema compra en el reservorio y que le permite cortar un enlace B–N. Si los sellos son baratos (H abundante, \(e_\text{H}\lt0\)), conviene cortar muchos enlaces y la lámina se llena de bordes: los poros se deshacen. Si son caros (H escaso, \(e_\text{H}\gt0\)), conviene minimizar el borde: los poros son compactos.</p></div>
</section>

<section>
<h2>La penalización H–H</h2>
<p>Con el Hamiltoniano de la tesis, \(e_\text{H}=-8.46\) eV, y nada impediría que los poros se disolvieran. El término \(\varepsilon_\text{XX}=E(\text{H}_2)/2\) por enlace vacancia–vacancia equivale a un potencial químico implícito del H de \(E(\text{H}_2)/4\), unos 7.5 eV por encima del H<sub>2</sub>: un ambiente absurdamente rico en H. Para estabilizar los poros, hBN-MC incluye una <span class="term">penalización estérica</span> empírica: \(K_\text{HH}=35\) eV por par de H demasiado cercanos (3 pares por monovacancia, 2 por divacancia y 3 por poro clasificado como triangular). Su efecto en el experimento del informe (poro de 25 vacancias, red 24 × 24) es drástico: sin ella el poro se fragmenta en 25 monovacancias a cualquier temperatura; con ella, el triángulo queda intacto.</p>
<div class="box warn"><p>La penalización H–H no procede de la DFT y depende del clasificador geométrico de poros, de modo que introduce en la energía un término que cambia con la forma asignada. El informe de hBN-MC recomienda presentar los resultados de morfología en modo gran canónico con \(\Delta\mu_\text{H}\) explícito, o al menos un análisis de sensibilidad a \(K_\text{HH}\). El motor del curso no implementa esta penalización: usa el modelo de enlaces puro.</p></div>
<div class="box hbn"><p>En hBN-MC, el Paso 4 de la pestaña CTRL controla todo este capítulo: el <em>reservorio de H del MC</em> (Tesis 2019 o gran canónico, con la energía de borde por H mostrada debajo), la <em>penalización H–H</em>, y la <em>energía de formación</em> (ambiente rico en N, rico en B o punto medio, \(\Delta\mu_\text{H}\) y referencia de \(\mu_\text{BN}\)), con la ventana de \(\mu_\text{N}\) y un aviso si está vacía. INV → <em>Energética de poros</em> calcula \(E_\text{form}\) a \(T=0\) de triángulos, paralelogramos y hexágonos por tamaño: el análisis que se compara con la microscopía sin depender de la escala de temperatura.</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>\(E_\text{form}=E_\text{fís}-\sum n_i\mu_i\); con \(\mu_\text{BN}=3\varepsilon_\text{NB}\) la lámina perfecta tiene \(E_\text{form}=0\).</li>
<li>\(\mu_\text{H}=E(\text{H}_2)/2+\Delta\mu_\text{H}(T,p)\); ventana de \(\mu_\text{N}\) entre los límites NH<sub>3</sub> y BH<sub>3</sub>, abierta para \(\Delta\mu_\text{H}\le-0.596\) eV (escala del modelo).</li>
<li>\(E_\text{form}(\text{V}_\text{B}+3\text{H})=-1.026\) eV (rico en N); triángulos: \(n\) veces la monovacancia de su terminación.</li>
<li>Energía de borde: \(E=\text{cte}+N_\text{H}e_\text{H}\); \(e_\text{H}\lt0\) fragmenta, \(e_\text{H}\gt0\) compacta. Tesis: −8.46 eV; gran canónico: \(-0.943-\Delta\mu_\text{H}\).</li>
<li>La penalización H–H es empírica; la formulación gran canónica la hace innecesaria con \(\Delta\mu_\text{H}\lt-0.943\) eV.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Cuántos H tiene en el borde un poro triangular de orden 4 y cuántas vacancias?
<details><summary>Respuesta</summary><p>16 vacancias y 12 H.</p></details></li>
<li><span class="lvl">Básico</span>Con \(\Delta\mu_\text{H}=-1.2\) eV y el reservorio gran canónico, ¿cuál es \(e_\text{H}\)? ¿Qué forma de poro se favorece?
<details><summary>Respuesta</summary><p>\(e_\text{H}=-0.943+1.2=+0.257\) eV: positivo, se favorecen los poros compactos.</p></details></li>
<li><span class="lvl">Intermedio</span>Deduzca \(E_\text{form}(\text{V}_\text{N}+3\text{H})=3\big(\varepsilon_\text{XB}-E(\text{BH}_3)/3\big)\) en el límite rico en B.
<details><summary>Respuesta</summary><p>\(E_\text{form}=3\varepsilon_\text{XB}-\mu_\text{B}-3\mu_\text{H}\) y en rico en B \(\mu_\text{B}+3\mu_\text{H}=E(\text{BH}_3)\).</p></details></li>
<li><span class="lvl">Intermedio</span>Calcule la energía de fragmentación de un triángulo de orden 3 con el reservorio de la tesis.
<details><summary>Respuesta</summary><p>\((27-9)\times(-8.46)=-152\) eV.</p></details></li>
<li><span class="lvl">Avanzado</span>Muestre que \(e_\text{H}\) en el reservorio gran canónico es la mitad de la energía de cortar un enlace B–N y pasivar ambos extremos con H tomados del reservorio.
<details><summary>Respuesta</summary><p>Cortar y pasivar: \(\Delta E=\varepsilon_\text{XN}+\varepsilon_\text{XB}-\varepsilon_\text{NB}-2\mu_\text{H}\). Por H, \(\tfrac12(\varepsilon_\text{XN}+\varepsilon_\text{XB}-\varepsilon_\text{NB})-\mu_\text{H}\), que es la fórmula de \(e_\text{H}\) con \(\varepsilon'_\text{XY}=\varepsilon_\text{XY}-\mu_\text{H}\) y \(\varepsilon'_\text{XX}=0\).</p></details></li>
</ol>
</section>
