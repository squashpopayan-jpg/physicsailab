<template class="chapter-src" data-id="huckel" data-num="11" data-title="Orbitales moleculares de Hückel" data-part="Parte II · Átomos, moléculas y sólidos" data-short="Aproximación π, polienos, brecha HOMO–LUMO, benceno, borazina, aromaticidad y el paso de la molécula al sólido">
<p class="lead">El método de Hückel (1931) reduce una molécula plana a una matriz con dos números: la energía de un orbital \(p_z\) aislado y el acoplamiento entre vecinos. Con esa simplicidad explica el color de los pigmentos, la estabilidad del benceno y la diferencia entre el benceno y la borazina, que es, a escala molecular, la diferencia entre el grafeno y el h-BN.</p>

<section>
<h2>La aproximación de Hückel</h2>
<p>En una molécula plana con átomos sp² (capítulo 10), los enlaces \(\sigma\) forman el esqueleto y los orbitales \(p_z\), perpendiculares al plano, forman un sistema \(\pi\) aparte. Hückel describe cada orbital molecular \(\pi\) como combinación de los \(p_z\) atómicos, \(\psi=\sum_ic_i\,p_{z,i}\), y aproxima los elementos de matriz así:</p>
<div class="box def"><ul>
<li>\(H_{ii}=\alpha_i\): energía de un electrón en el \(p_z\) del átomo \(i\) (la <span class="term">integral de Coulomb</span>); para carbono se toma como referencia \(\alpha=0\).</li>
<li>\(H_{ij}=\beta\) si \(i\) y \(j\) están enlazados (la <span class="term">integral de resonancia</span>, negativa: \(\beta\approx-2.7\) eV en C–C), y 0 si no.</li>
<li>\(S_{ij}=\delta_{ij}\): se ignora el solapamiento.</li>
</ul></div>
<p>Las energías de los orbitales \(\pi\) son los autovalores de la matriz \(\mathsf H\), que tiene la forma de la matriz de conectividad de la molécula. Se llenan con los electrones \(\pi\) (uno por cada carbono) de dos en dos. El orbital ocupado más alto es el <span class="term">HOMO</span> y el desocupado más bajo, el <span class="term">LUMO</span>; su diferencia, la <span class="term">brecha HOMO–LUMO</span>, controla el color y la reactividad.</p>
<div class="box ex">
<h4>Etileno</h4>
<p>Dos carbonos enlazados: \(\mathsf H=\begin{pmatrix}\alpha&\beta\\\beta&\alpha\end{pmatrix}\). Halle los orbitales.</p>
<details><summary>Solución</summary>
<p>\(E=\alpha\pm\beta\). Como \(\beta\lt0\), \(\alpha+\beta\) es el enlazante \(\pi=(p_1+p_2)/\sqrt2\), ocupado por los dos electrones; \(\alpha-\beta\) es el antienlazante \(\pi^*\). La brecha es \(2|\beta|\approx5.4\) eV: el etileno absorbe en el ultravioleta.</p>
</details>
</div>
</section>

<section>
<h2>Cadenas: polienos y el límite de banda</h2>
<p>Para una cadena lineal de \(N\) átomos iguales, la matriz es tridiagonal y sus autovalores y autovectores se conocen en forma cerrada (son ondas estacionarias en una caja discreta):</p>
<div class="eq key" data-name="Cadena de Hückel">\[E_k=\alpha+2\beta\cos\frac{k\pi}{N+1},\qquad c_i^{(k)}=\sqrt{\frac{2}{N+1}}\,\sen\frac{ik\pi}{N+1},\qquad k=1,\dots,N .\]</div>
<p>Todos los niveles quedan dentro del intervalo \([\alpha-2|\beta|,\ \alpha+2|\beta|]\), de ancho \(4|\beta|\), y se apiñan al crecer \(N\): es el germen de una banda de energía (capítulo 13). La brecha HOMO–LUMO de un polieno con \(N\) par disminuye como \(\sim1/N\). Por eso los pigmentos con largas cadenas conjugadas, como el β-caroteno (22 carbonos conjugados), absorben luz visible y tienen color.</p>
<p>Si los enlaces fueran todos iguales, la brecha se cerraría para \(N\to\infty\) (un metal). En los polienos reales los enlaces se alternan, corto–largo (\(\beta_1\ne\beta_2\)), y la brecha no se cierra: es la <span class="term">dimerización de Peierls</span>, que reaparece en la cadena diatómica del capítulo 13.</p>
<div class="sim" data-sim="huckel-cadena" data-title="Cadenas conjugadas: niveles, orbitales y brecha"></div>
<div class="sim-guide"><ul>
<li>Aumente \(N\): los niveles llenan el intervalo de ancho \(4|\beta|\) y la brecha HOMO–LUMO cae.</li>
<li>Introduzca alternancia de enlaces: la brecha queda abierta incluso para cadenas muy largas.</li>
<li>Introduzca alternancia de energías de sitio (como B–N–B–N): también abre una brecha, ahora de origen «iónico».</li>
</ul></div>
</section>

<section>
<h2>Anillos: benceno y aromaticidad</h2>
<p>En un anillo de \(N\) átomos el último está unido al primero. La simetría de rotación obliga a que los coeficientes sean ondas que dan la vuelta completa, \(c_j\propto\ee^{2\pi ikj/N}\), y las energías son</p>
<div class="eq key" data-name="Anillo de Hückel">\[E_k=\alpha+2\beta\cos\frac{2\pi k}{N},\qquad k=0,1,\dots,N-1 .\]</div>
<p>Para el benceno (\(N=6\)): \(\alpha+2\beta\), dos niveles \(\alpha+\beta\), dos \(\alpha-\beta\) y \(\alpha-2\beta\). Los seis electrones \(\pi\) llenan exactamente las tres capas más bajas. La energía \(\pi\) total, \(6\alpha+8\beta\), es menor que la de tres etilenos aislados (\(6\alpha+6\beta\)) en \(2|\beta|\): es la <span class="term">energía de deslocalización</span> o estabilización aromática. Su valor experimental, unos 1.6 eV (36 kcal/mol), corresponde a un \(\beta\) «termoquímico» de unos −0.8 eV, distinto del que se ajusta a los espectros (≈ −2.7 eV): el modelo de Hückel es cualitativo y sus parámetros se calibran según la propiedad que se quiera describir. Los anillos con \(4n+2\) electrones \(\pi\) cierran capa y son especialmente estables (regla de Hückel); con \(4n\) quedan electrones en niveles degenerados a medio llenar (ciclobutadieno, antiaromático).</p>
<h3>Borazina: el «benceno inorgánico»</h3>
<p>La borazina, B₃N₃H₆, tiene la misma geometría que el benceno con boro y nitrógeno alternados. En el modelo de Hückel, los sitios alternan \(\alpha_\text{B}\gt\alpha_\text{N}\). La diferencia \(\Delta=\alpha_\text{B}-\alpha_\text{N}\) abre una brecha mayor y concentra los orbitales ocupados sobre los nitrógenos. Con \(\alpha=\pm\Delta/2\) los niveles son</p>
<div class="eq">\[E=\pm\sqrt{\Big(\frac{\Delta}{2}\Big)^2+|\beta|^2\Big|1+\ee^{\pm2\pi i k/3}\Big|^2}\ ,\]</div>
<p>el mismo resultado de dos niveles que en el h-BN, ahora en una molécula de seis átomos. La borazina es mucho menos aromática que el benceno: sus electrones \(\pi\) no circulan libremente porque «prefieren» los nitrógenos.</p>
<div class="sim" data-sim="huckel-molecula" data-title="Moléculas conjugadas: diagrama de niveles y orbitales"></div>
<div class="sim-guide"><ul>
<li>Benceno: observe la degeneración doble de HOMO y LUMO y los coeficientes que alternan de signo.</li>
<li>Borazina: el HOMO vive en los nitrógenos y el LUMO en los boros (tamaño de los círculos).</li>
<li>Naftaleno: dos anillos fusionados, el inicio del camino hacia el grafeno.</li>
</ul></div>
</section>

<section>
<h2>De la molécula al sólido</h2>
<p>Un anillo de \(N\) átomos con \(N\) muy grande ya es un sólido unidimensional: sus energías \(\alpha+2\beta\cos(2\pi k/N)\) llenan densamente una banda, y el índice \(k\) se convierte en un número de onda. El grafeno puede verse como un benceno infinito y el h-BN como una borazina infinita; sus bandas (capítulo 14) son el límite de \(N\to\infty\) de los diagramas de Hückel de este capítulo.</p>
<div class="sim" data-sim="huckel-anillo" data-title="Anillos de N átomos: de los niveles a la banda"></div>
<div class="sim-guide"><ul>
<li>Con \(N\) grande los puntos \((k,E_k)\) dibujan la curva continua \(E(k)=\alpha+2\beta\cos k\).</li>
<li>Con sitios alternados (B–N), aparecen dos bandas separadas por una brecha \(|\Delta|\): el modelo más sencillo de un aislante.</li>
</ul></div>
<div class="box explain"><p>Imagine un coro: una sola voz da una nota, dos voces acopladas dan dos notas, y un coro de mil voces da un sonido que cubre un intervalo continuo de tonos. Así se pasa de los niveles discretos de una molécula a las bandas de un sólido.</p></div>
<div class="box valid"><p>El apéndice B comprueba que la diagonalización numérica de Hückel da \(\alpha+2\beta\) para el nivel más bajo del benceno, que la brecha HOMO–LUMO de la borazina con \(\alpha=\pm1\), \(\beta=-1\) es \(2\sqrt2\), y que el nivel más bajo de una cadena de 10 sitios es \(2\beta\cos(\pi/11)\), todos con error menor que \(10^{-10}\).</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>Hückel: \(H_{ii}=\alpha_i\), \(H_{ij}=\beta\) entre vecinos; las energías \(\pi\) son los autovalores de la matriz de conectividad.</li>
<li>Cadena: \(E_k=\alpha+2\beta\cos\frac{k\pi}{N+1}\); la brecha cae con la longitud (color de los pigmentos).</li>
<li>Anillo: \(E_k=\alpha+2\beta\cos\frac{2\pi k}{N}\); \(4n+2\) electrones cierran capa (aromaticidad).</li>
<li>Alternar \(\alpha_B\ne\alpha_N\) abre una brecha y polariza los orbitales: borazina frente a benceno, h-BN frente a grafeno.</li>
<li>Los niveles de un anillo grande forman una banda: el puente hacia la física de sólidos.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Halle los niveles \(\pi\) del radical alilo (cadena de 3 carbonos).
<details><summary>Respuesta</summary><p>\(\alpha+\sqrt2\beta,\ \alpha,\ \alpha-\sqrt2\beta\).</p></details></li>
<li><span class="lvl">Básico</span>¿Cuántos electrones \(\pi\) tiene el naftaleno? ¿Cumple la regla \(4n+2\)?
<details><summary>Respuesta</summary><p>10 = 4·2 + 2: sí.</p></details></li>
<li><span class="lvl">Intermedio</span>Calcule la brecha HOMO–LUMO del hexatrieno (\(N=6\)) en unidades de \(|\beta|\) y estime su longitud de onda de absorción con \(|\beta|=2.7\) eV.
<details><summary>Respuesta</summary><p>\(4|\beta|\cos(3\pi/7)=0.890|\beta|=2.40\) eV → 516 nm. (El valor experimental es 258 nm: el modelo exagera la deslocalización; los parámetros de Hückel se ajustan a cada familia de moléculas.)</p></details></li>
<li><span class="lvl">Intermedio</span>Compruebe que la energía \(\pi\) del benceno es \(6\alpha+8\beta\).
<details><summary>Respuesta</summary><p>\(2(\alpha+2\beta)+4(\alpha+\beta)=6\alpha+8\beta\).</p></details></li>
<li><span class="lvl">Avanzado</span>En un anillo de \(N\) sitios con energías alternadas \(\pm\Delta/2\) y salto \(\beta\), demuestre que la brecha mínima es \(\Delta\).
<details><summary>Respuesta</summary><p>Con una celda de dos sitios, \(E=\pm\sqrt{\Delta^2/4+|\beta|^2|1+\ee^{ik}|^2}\); en \(k=\pi\) el segundo término se anula y la separación es \(\Delta\).</p></details></li>
</ol>
</section>
