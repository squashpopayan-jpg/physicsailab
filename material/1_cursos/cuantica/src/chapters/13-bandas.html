<template class="chapter-src" data-id="bandas" data-num="13" data-title="Bandas de energía" data-part="Parte II · Átomos, moléculas y sólidos" data-short="Enlace fuerte en 1D, masa efectiva, densidad de estados, cadena diatómica, brechas, metales y aislantes, electrones casi libres">
<p class="lead">Cuando muchos átomos se acercan, cada nivel atómico se abre en una banda de estados casi continua. El modo en que esas bandas se llenan de electrones decide si un material es metal, semiconductor o aislante. En este capítulo construimos bandas desde dos extremos opuestos: átomos casi aislados que se acoplan débilmente (enlace fuerte) y electrones casi libres que sienten un potencial periódico débil.</p>

<section>
<h2>El modelo de enlace fuerte en una dimensión</h2>
<p>Consideremos una cadena de átomos separados \(a\), cada uno con un orbital de energía \(\varepsilon\), y un salto \(t\gt0\) entre vecinos (el \(-\beta\) de Hückel). Por el teorema de Bloch, el estado con número de onda \(k\) es una combinación de orbitales con fases \(\ee^{ikna}\):</p>
<div class="eq">\[\ket k=\frac{1}{\sqrt N}\sum_n\ee^{ikna}\ket n,\qquad \op H\ket n=\varepsilon\ket n-t\big(\ket{n+1}+\ket{n-1}\big).\]</div>
<p>Aplicando \(\op H\) a \(\ket k\) se obtiene directamente la <span class="term">relación de dispersión</span>:</p>
<div class="eq key" data-name="Banda de enlace fuerte">\[E(k)=\varepsilon-2t\cos ka,\qquad -\frac\pi a\lt k\le\frac\pi a .\]</div>
<ul>
<li>El nivel atómico se convierte en una banda de ancho \(W=4t\): cuanto mayor el solapamiento entre átomos vecinos, más ancha la banda.</li>
<li>Cerca del fondo, \(E\approx\varepsilon-2t+ta^2k^2\): el electrón se comporta como libre con una <span class="term">masa efectiva</span> \(m^*=\hbar^2/(2ta^2)\). Bandas estrechas implican electrones «pesados».</li>
<li>La <span class="term">velocidad de grupo</span> \(v=\frac1\hbar\,\dd E/\dd k=\frac{2ta}{\hbar}\sen ka\) se anula en el fondo y en el borde de zona: allí las ondas son estacionarias.</li>
</ul>
<h3>Densidad de estados</h3>
<p>La <span class="term">densidad de estados</span> \(g(E)\) cuenta cuántos estados hay por unidad de energía. Con condiciones periódicas los \(k\) permitidos están equiespaciados (\(\Delta k=2\pi/Na\)), así que</p>
<div class="eq key" data-name="Densidad de estados en 1D">\[g(E)=\frac{Na}{\pi}\left|\odv{k}{E}\right|=\frac{N}{\pi}\,\frac{1}{\sqrt{4t^2-(E-\varepsilon)^2}} ,\]</div>
<p>que diverge en los bordes de la banda (<span class="term">singularidades de van Hove</span>), donde la banda es plana y muchos \(k\) comparten energía. En 2D y 3D las formas cambian, pero la idea es la misma: la densidad de estados es alta donde las bandas son planas.</p>
<div class="sim" data-sim="cadena-tb" data-title="Banda de una cadena: estados, densidad de estados y nivel de Fermi"></div>
<div class="sim-guide"><ul>
<li>Con pocos átomos, los niveles son discretos; con muchos, llenan la banda y el histograma reproduce la curva de van Hove.</li>
<li>Llene la banda con un electrón por átomo (media banda): el nivel de Fermi queda en medio de estados disponibles, la cadena es un metal.</li>
<li>Con dos electrones por átomo la banda queda llena: no hay estados cercanos para acelerar electrones, la cadena es aislante.</li>
</ul></div>
</section>

<section>
<h2>Dos átomos por celda: aparece la brecha</h2>
<p>Si la cadena alterna dos tipos de átomo (energías \(\varepsilon_A\), \(\varepsilon_B\)) o dos tipos de enlace (saltos \(t_1\), \(t_2\)), la celda contiene dos sitios y por cada \(k\) hay un problema de dos niveles:</p>
<div class="eq key" data-name="Cadena diatómica">\[E_\pm(k)=\bar\varepsilon\pm\sqrt{\Big(\frac{\Delta}{2}\Big)^2+\big|t_1+t_2\ee^{ika}\big|^2},\qquad \Delta=\varepsilon_A-\varepsilon_B .\]</div>
<p>Aparecen dos bandas. En el borde de zona, \(|t_1+t_2\ee^{i\pi}|=|t_1-t_2|\), y la <span class="term">brecha</span> vale</p>
<div class="eq">\[E_g=2\sqrt{\Big(\frac\Delta2\Big)^2+(t_1-t_2)^2}\ \xrightarrow{\ t_1=t_2\ }\ |\Delta| .\]</div>
<p>Dos mecanismos abren brechas: la diferencia química entre átomos (origen «iónico», el del h-BN) y la alternancia de enlaces (origen «covalente», la dimerización de Peierls de los polienos). Con dos electrones por celda, la banda inferior queda llena y la superior vacía: el material es aislante si la brecha es grande, semiconductor si es moderada.</p>
<div class="sim" data-sim="cadena-diatomica" data-title="Cadena diatómica: dos bandas y una brecha"></div>
<div class="sim-guide"><ul>
<li>Con \(\Delta=0\) y \(t_1=t_2\) las dos bandas se tocan en el borde de zona: es la cadena simple «plegada».</li>
<li>Aumente \(\Delta\): la banda de valencia (llena) se concentra en el átomo B, de menor energía, y la de conducción en el A. Es la imagen 1D del h-BN.</li>
<li>Con \(t_1\ne t_2\) y \(\Delta=0\) la brecha es \(2|t_1-t_2|\).</li>
</ul></div>
</section>

<section>
<h2>Metales, semiconductores y aislantes</h2>
<p>Los electrones llenan los estados de menor energía respetando Pauli hasta el <span class="term">nivel de Fermi</span> \(E_F\). Lo que distingue a los materiales es dónde cae \(E_F\):</p>
<div class="tablewrap"><table>
<tr><th>Tipo</th><th>Situación de \(E_F\)</th><th>Ejemplo</th><th>Brecha</th></tr>
<tr><td>Metal</td><td>dentro de una banda parcialmente llena</td><td>cobre, aluminio</td><td class="c">—</td></tr>
<tr><td>Semimetal</td><td>bandas que se tocan en puntos</td><td>grafeno</td><td class="c">0</td></tr>
<tr><td>Semiconductor</td><td>en una brecha pequeña</td><td>silicio, MoS₂</td><td class="c">0.5–3 eV</td></tr>
<tr><td>Aislante</td><td>en una brecha grande</td><td>h-BN, diamante</td><td class="c">≳ 5 eV</td></tr>
</table></div>
<p>A temperatura \(T\), la ocupación sigue la distribución de Fermi–Dirac (capítulo 22) y la densidad de electrones excitados a la banda de conducción es proporcional a \(\ee^{-E_g/2\kB T}\). Para el silicio (\(E_g=1.1\) eV) a 300 K es pequeña pero útil; para el h-BN (\(E_g\approx6\) eV) es despreciable: el h-BN es uno de los mejores aislantes bidimensionales, y por eso se usa como sustrato y barrera en dispositivos de grafeno.</p>
</section>

<section>
<h2>El extremo opuesto: electrones casi libres</h2>
<p>Partamos ahora de electrones libres, \(E=\hbar^2k^2/2m\), y añadamos un potencial periódico débil \(V(x)=2V_G\cos(Gx)\) con \(G=2\pi/a\). Las ondas \(\ee^{ikx}\) y \(\ee^{i(k-G)x}\) tienen la misma energía en \(k=G/2=\pi/a\) (el borde de zona) y el potencial las acopla: otra vez un sistema de dos niveles degenerados. Se forman ondas estacionarias \(\cos(\pi x/a)\) y \(\sen(\pi x/a)\), una con la densidad sobre los mínimos del potencial y otra sobre los máximos, y aparece una brecha:</p>
<div class="eq key" data-name="Brecha en el borde de zona">\[E_g=2|V_G| .\]</div>
<p>Físicamente es una <span class="term">reflexión de Bragg</span>: en el borde de zona la longitud de onda es \(2a\) y las ondas reflejadas por planos sucesivos interfieren constructivamente. Los dos puntos de vista, enlace fuerte y electrones casi libres, describen el mismo fenómeno: un potencial periódico abre brechas en los bordes de la zona de Brillouin.</p>
<div class="sim" data-sim="casi-libres" data-title="Electrones casi libres: bandas con base de ondas planas"></div>
<div class="sim-guide"><ul>
<li>Con \(V=0\) la parábola libre se pliega en la primera zona. Al encender \(V\) se abren brechas en \(k=0\) y \(k=\pm\pi/a\).</li>
<li>Compare la primera brecha numérica con \(2|V_G|\): coinciden para \(V\) pequeño.</li>
<li>Con pocas ondas planas en la base, las bandas altas son incorrectas: la base debe ampliarse hasta que el resultado no cambie (capítulo 18).</li>
</ul></div>
<div class="box explain"><p>En una autopista con baches regularmente espaciados, la mayoría de los coches pasa sin notar nada. Pero un coche cuya suspensión rebota justo al ritmo de los baches entra en resonancia y es «rechazado». En un cristal, el electrón cuya longitud de onda coincide con el doble del espaciado atómico es reflejado: esa energía queda prohibida.</p></div>
<div class="box valid"><p>El apéndice B comprueba que los autovalores numéricos de un anillo de 12 sitios coinciden con \(-2t\cos(2\pi m/N)\) y que la brecha de la cadena diatómica con \(t_1=t_2\) es exactamente \(|\varepsilon_A-\varepsilon_B|\).</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>Enlace fuerte: \(E(k)=\varepsilon-2t\cos ka\); ancho \(4t\), masa efectiva \(\hbar^2/2ta^2\).</li>
<li>La densidad de estados es alta donde la banda es plana (van Hove).</li>
<li>Dos sitios por celda: dos bandas y una brecha \(2\sqrt{(\Delta/2)^2+(t_1-t_2)^2}\).</li>
<li>Metal, semimetal, semiconductor o aislante según dónde cae el nivel de Fermi y cuánto mide la brecha.</li>
<li>Electrones casi libres: un potencial periódico abre brechas \(2|V_G|\) en los bordes de zona (reflexión de Bragg).</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Una banda de enlace fuerte tiene ancho 2 eV y \(a=2.5\) Å. ¿Cuánto vale su masa efectiva en unidades de \(m_e\)?
<details><summary>Respuesta</summary><p>\(t=0.5\) eV; \(m^*/m_e=\frac{\hbar^2/2m_e}{ta^2}=\frac{3.81}{0.5\cdot6.25}=1.22\).</p></details></li>
<li><span class="lvl">Básico</span>¿Es metal o aislante una cadena monoatómica con 2 electrones por átomo en una sola banda?
<details><summary>Respuesta</summary><p>Aislante: la banda (2 estados por átomo con espín) queda llena.</p></details></li>
<li><span class="lvl">Intermedio</span>Calcule la velocidad máxima de un electrón en una banda de enlace fuerte con \(t=1\) eV y \(a=3\) Å.
<details><summary>Respuesta</summary><p>\(v_{\max}=2ta/\hbar=2\cdot1\cdot3\times10^{-10}/6.58\times10^{-16}=9.1\times10^5\) m/s, en \(k=\pi/2a\).</p></details></li>
<li><span class="lvl">Intermedio</span>¿Qué fracción de electrones está excitada a la banda de conducción en un material con brecha 6 eV a 1000 K (estimación \(\ee^{-E_g/2\kB T}\))?
<details><summary>Respuesta</summary><p>\(\ee^{-6/(2\cdot0.0862)}=\ee^{-34.8}\approx8\times10^{-16}\): prácticamente ninguno.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que con \(\Delta\gg t\) el ancho de cada banda de la cadena diatómica (\(t_1=t_2=t\)) es aproximadamente \(4t^2/\Delta\).
<details><summary>Respuesta</summary><p>\(\sqrt{\Delta^2/4+4t^2\cos^2(ka/2)}\approx\frac\Delta2+\frac{4t^2}{\Delta}\cos^2\frac{ka}{2}\); el término variable recorre de 0 a \(4t^2/\Delta\). Saltar entre átomos A pasando por un B lejano en energía es un proceso de segundo orden.</p></details></li>
</ol>
</section>
