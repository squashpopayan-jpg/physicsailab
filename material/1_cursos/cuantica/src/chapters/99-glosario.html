<template class="chapter-src" data-id="glosario" data-num="C" data-title="Glosario" data-part="Apéndice" data-short="Los términos del curso definidos en una o dos frases, con el capítulo donde se explican">
<p class="lead">Cada término está definido en una o dos frases, de la forma en que convendría explicárselo a un colega o a un estudiante, con el capítulo donde se desarrolla.</p>

<section>
<h2>A – D</h2>
<dl class="gloss">
<dt>Aceptación (probabilidad de)</dt><dd>En Metropolis, \(\min(1,\ee^{-\Delta E/\kB T})\): la probabilidad de aceptar un cambio propuesto. <a href="#montecarlo">Cap. 24</a></dd>
<dt>Antisitio</dt><dd>Defecto en que un átomo ocupa la subred de la otra especie, por ejemplo un B en un sitio de N. En h-BN, un par de antisitios vecinos cuesta 6.24 eV en el modelo de enlaces. <a href="#modelo-enlaces">Cap. 27</a></dd>
<dt>Autoconsistencia (SCF)</dt><dd>Procedimiento iterativo en el que la densidad determina el potencial y el potencial determina la densidad, hasta que ambos dejan de cambiar. <a href="#muchos-cuerpos">Cap. 15</a>, <a href="#kohn-sham">16</a></dd>
<dt>Balance detallado</dt><dd>Condición \(\pi_iW_{ij}=\pi_jW_{ji}\): en equilibrio, el flujo de probabilidad entre cada par de estados es igual en ambos sentidos. Garantiza que la cadena de Markov muestree \(\pi\). <a href="#montecarlo">Cap. 24</a></dd>
<dt>Banda de energía</dt><dd>Conjunto continuo de niveles \(E_n(\vb k)\) de un electrón en un cristal; entre bandas puede haber una brecha prohibida. <a href="#bandas">Cap. 13</a></dd>
<dt>Barrido (MCS)</dt><dd>\(N\) intentos de movimiento en un sistema de \(N\) sitios: la unidad de tiempo de una simulación Monte Carlo. hBN-MC cuenta pasos individuales. <a href="#ising-mc">Cap. 25</a></dd>
<dt>Base (de funciones)</dt><dd>Conjunto de funciones con las que se expande la función de onda: gaussianas, orbitales atómicos numéricos (SIESTA), ondas planas. <a href="#aproximados">Cap. 9</a>, <a href="#dft-practica">18</a></dd>
<dt>Bloch (teorema de)</dt><dd>En un potencial periódico, los estados son ondas planas moduladas por una función periódica, \(\psi_{\vb k}(\vb r+\vb R)=\ee^{i\vb k\cdot\vb R}\psi_{\vb k}(\vb r)\). <a href="#cristales">Cap. 12</a></dd>
<dt>Bordes zigzag y armchair</dt><dd>Las dos orientaciones principales del borde de una lámina de panal; en grafeno, el zigzag tiene estados de borde de energía cero. <a href="#grafeno-hbn">Cap. 14</a></dd>
<dt>Brecha (gap)</dt><dd>Intervalo de energía sin estados entre la banda de valencia y la de conducción. En el modelo de enlace fuerte del h-BN es \(\varepsilon_\text{B}-\varepsilon_\text{N}\). <a href="#grafeno-hbn">Cap. 14</a></dd>
<dt>Cadena de Markov</dt><dd>Sucesión de estados en la que cada uno depende solo del anterior, con probabilidades de transición fijas. <a href="#montecarlo">Cap. 24</a></dd>
<dt>Calor específico</dt><dd>Cuánto cambia la energía con la temperatura; por el teorema de fluctuación, \(C=\Var(E)/\kB T^2\). <a href="#canonico">Cap. 21</a></dd>
<dt>Campo medio</dt><dd>Aproximación que reemplaza a los vecinos de una partícula por su valor promedio; predice transiciones de fase, con \(T_c\) sobrestimada. <a href="#ising">Cap. 23</a></dd>
<dt>Conmutador</dt><dd>\([\hat A,\hat B]=\hat A\hat B-\hat B\hat A\). Si no es cero, las dos magnitudes no pueden tener valores definidos a la vez. <a href="#formalismo">Cap. 3</a></dd>
<dt>Correlación (energía de)</dt><dd>La parte de la energía electrónica que falta en Hartree–Fock: los electrones se evitan más de lo que describe un solo determinante. <a href="#muchos-cuerpos">Cap. 15</a>, <a href="#xc">17</a></dd>
<dt>Cumulante de Binder</dt><dd>\(U_4=1-\expval{m^4}/3\expval{m^2}^2\); sus curvas para distintos tamaños se cruzan en la temperatura crítica. <a href="#ising-mc">Cap. 25</a></dd>
<dt>Densidad electrónica</dt><dd>\(n(\vb r)\), el número de electrones por unidad de volumen; la variable central de la DFT. <a href="#kohn-sham">Cap. 16</a></dd>
<dt>DFT (teoría del funcional de la densidad)</dt><dd>Teoría que obtiene la energía del estado fundamental a partir de la densidad electrónica en lugar de la función de onda de muchos electrones. <a href="#kohn-sham">Cap. 16</a></dd>
</dl>
</section>

<section>
<h2>E – I</h2>
<dl class="gloss">
<dt>Energía de borde por H (\(e_\text{H}\))</dt><dd>En una lámina de h-BN ordenada, cuánto cambia la energía del Monte Carlo por cada H de borde adicional. Si es negativa, los poros se fragmentan. <a href="#formacion">Cap. 28</a></dd>
<dt>Energía de formación</dt><dd>\(E_\text{form}=E-\sum n_i\mu_i\): el costo de crear un defecto contando lo que valen, en sus reservorios, los átomos que se van y los que llegan. <a href="#formacion">Cap. 28</a></dd>
<dt>Energía de mezcla</dt><dd>\(w_{\alpha\beta}=\varepsilon_{\alpha\beta}-\tfrac12(\varepsilon_{\alpha\alpha}+\varepsilon_{\beta\beta})\): si es negativa, las especies se alternan; si es positiva, se segregan. <a href="#ising">Cap. 23</a>, <a href="#modelo-enlaces">27</a></dd>
<dt>Enlace fuerte (tight-binding)</dt><dd>Modelo en que los electrones saltan entre orbitales de átomos vecinos con una amplitud \(t\); da las bandas del grafeno y del h-BN. <a href="#bandas">Cap. 13</a>, <a href="#grafeno-hbn">14</a></dd>
<dt>Ensamble canónico</dt><dd>Sistema a temperatura fija en contacto con un baño térmico; cada estado tiene probabilidad \(\ee^{-E/\kB T}/Z\). <a href="#canonico">Cap. 21</a></dd>
<dt>Ensamble gran canónico</dt><dd>Sistema que intercambia energía y partículas con reservorios de temperatura y potencial químico fijos. <a href="#gran-canonico">Cap. 22</a></dd>
<dt>Entropía</dt><dd>\(S=\kB\ln\Omega\): mide cuántos microestados son compatibles con lo que se sabe del sistema. <a href="#entropia">Cap. 20</a></dd>
<dt>Ergodicidad</dt><dd>Propiedad de una dinámica que puede llegar desde cualquier estado a cualquier otro; sin ella, los promedios dependen del inicio. <a href="#montecarlo">Cap. 24</a></dd>
<dt>Espín</dt><dd>Momento angular intrínseco de las partículas; para el electrón toma dos valores, \(\pm\hbar/2\). <a href="#espin">Cap. 7</a></dd>
<dt>Expansión en clústeres</dt><dd>Escribir la energía de una aleación en una red como suma de contribuciones de puntos, pares, tríos…; el modelo de hBN-MC conserva solo los pares de primeros vecinos. <a href="#modelo-enlaces">Cap. 27</a></dd>
<dt>Fermión y bosón</dt><dd>Partículas cuya función de onda cambia de signo (fermiones, como el electrón) o no (bosones) al intercambiar dos de ellas. Los fermiones cumplen el principio de exclusión. <a href="#espin">Cap. 7</a></dd>
<dt>Función de onda</dt><dd>\(\psi(x,t)\), la amplitud cuyo módulo al cuadrado da la densidad de probabilidad de encontrar la partícula. <a href="#onda">Cap. 2</a></dd>
<dt>Función de partición</dt><dd>\(Z=\sum_i\ee^{-E_i/\kB T}\): la suma que normaliza las probabilidades y de la que se obtienen todas las magnitudes termodinámicas. <a href="#canonico">Cap. 21</a></dd>
<dt>Funcional</dt><dd>Una regla que asigna un número a una función entera, como \(E[n]\). <a href="#kohn-sham">Cap. 16</a></dd>
<dt>GGA</dt><dd>Aproximación de gradiente generalizado: un funcional de intercambio y correlación que usa la densidad y su gradiente (por ejemplo, PBE). <a href="#xc">Cap. 17</a></dd>
<dt>Hamiltoniano</dt><dd>El operador de la energía total; sus autovalores son las energías permitidas. <a href="#formalismo">Cap. 3</a></dd>
<dt>Hartree–Fock</dt><dd>Aproximación que describe los electrones con un solo determinante de Slater; incluye exactamente el intercambio, pero no la correlación. <a href="#muchos-cuerpos">Cap. 15</a></dd>
<dt>Histéresis</dt><dd>Diferencia entre las ramas de ida y vuelta al recorrer un parámetro: señal de que el sistema no siguió al equilibrio. <a href="#ising">Cap. 23</a>, <a href="#recocido">26</a></dd>
<dt>Hückel (método de)</dt><dd>Modelo mínimo de electrones \(\pi\) con dos parámetros (\(\alpha\), \(\beta\)); el antecedente químico del enlace fuerte. <a href="#huckel">Cap. 11</a></dd>
<dt>Identidad de coordinación</dt><dd>\(3N_\alpha=2n_{\alpha\alpha}+\sum_{\beta\ne\alpha}n_{\alpha\beta}\) en una red de panal: los conteos de enlaces no son independientes. <a href="#modelo-enlaces">Cap. 27</a></dd>
<dt>Intercambio (energía de)</dt><dd>Término de energía que aparece por la antisimetría de la función de onda; reduce la repulsión entre electrones del mismo espín. <a href="#muchos-cuerpos">Cap. 15</a>, <a href="#xc">17</a></dd>
<dt>Intercambio de réplicas</dt><dd>Varias copias del sistema a distintas temperaturas que intercambian configuraciones; permite muestrear paisajes con barreras altas. <a href="#recocido">Cap. 26</a></dd>
<dt>Intervalo de confianza</dt><dd>Intervalo que contiene el valor verdadero con una probabilidad dada (95 %); para \(n\) datos se usa la \(t\) de Student. <a href="#probabilidad">Cap. 19</a>, <a href="#recocido">26</a></dd>
<dt>Ising (modelo de)</dt><dd>Espines \(\pm1\) en una red con interacción entre vecinos; el modelo más simple de transición de fase, equivalente a una aleación binaria. <a href="#ising">Cap. 23</a></dd>
</dl>
</section>

<section>
<h2>K – P</h2>
<dl class="gloss">
<dt>Kawasaki (dinámica de)</dt><dd>Monte Carlo por intercambio de pares de especies distintas: conserva la composición. Es la dinámica de hBN-MC. <a href="#ising-mc">Cap. 25</a></dd>
<dt>Kohn–Sham (ecuaciones de)</dt><dd>Ecuaciones de un electrón en un potencial efectivo cuya densidad reproduce la del sistema real; la forma práctica de la DFT. <a href="#kohn-sham">Cap. 16</a></dd>
<dt>LDA</dt><dd>Aproximación de densidad local: el intercambio y la correlación en cada punto son los de un gas de electrones homogéneo con esa densidad. <a href="#xc">Cap. 17</a></dd>
<dt>Lentitud crítica</dt><dd>Aumento del tiempo de autocorrelación cerca de una transición de fase; exige simulaciones mucho más largas. <a href="#ising-mc">Cap. 25</a></dd>
<dt>Longitud de correlación</dt><dd>Tamaño típico de las regiones cuyos elementos están correlacionados; diverge en el punto crítico. <a href="#ising-mc">Cap. 25</a></dd>
<dt>Metaestable (estado)</dt><dd>Mínimo local de la energía libre separado del global por una barrera; el sistema puede permanecer en él mucho tiempo. <a href="#ising">Cap. 23</a>, <a href="#recocido">26</a></dd>
<dt>Metropolis (algoritmo de)</dt><dd>Proponer un cambio al azar y aceptarlo con probabilidad \(\min(1,\ee^{-\Delta E/\kB T})\); muestrea la distribución de Boltzmann sin conocer \(Z\). <a href="#montecarlo">Cap. 24</a></dd>
<dt>Mínimos cuadrados</dt><dd>Ajuste que minimiza la suma de residuos al cuadrado; da los parámetros, sus errores y su correlación. <a href="#modelo-enlaces">Cap. 27</a></dd>
<dt>Monte Carlo</dt><dd>Familia de métodos que estiman promedios mediante muestras aleatorias. <a href="#montecarlo">Cap. 24</a></dd>
<dt>Muestreo por importancia</dt><dd>Tomar las muestras con una probabilidad parecida a la del integrando para reducir la varianza. <a href="#montecarlo">Cap. 24</a></dd>
<dt>Nanoporo</dt><dd>Racimo de vacancias en la lámina, con los enlaces del borde pasivados con H. <a href="#formacion">Cap. 28</a></dd>
<dt>Operador</dt><dd>Regla que transforma funciones de onda; cada magnitud medible tiene asociado un operador hermítico. <a href="#formalismo">Cap. 3</a></dd>
<dt>Orbital</dt><dd>Función de onda de un electrón: atómica (1s, 2p…) o molecular (enlazante, antienlazante). <a href="#hidrogeno">Cap. 6</a>, <a href="#enlace">10</a></dd>
<dt>Penalización H–H</dt><dd>Término empírico de hBN-MC (\(K_\text{HH}=35\) eV por par de H cercanos) que estabiliza los poros con el Hamiltoniano de la tesis; no procede de la DFT. <a href="#formacion">Cap. 28</a></dd>
<dt>Potencial químico</dt><dd>\(\mu\), la variación de energía libre al añadir una partícula: el «precio» de cada especie en su reservorio. <a href="#gran-canonico">Cap. 22</a></dd>
<dt>Pseudopotencial</dt><dd>Potencial suave que reemplaza al núcleo y los electrones internos y reproduce el comportamiento de los electrones de valencia. <a href="#dft-practica">Cap. 18</a></dd>
</dl>
</section>

<section>
<h2>R – W</h2>
<dl class="gloss">
<dt>Recocido simulado</dt><dd>Bajar la temperatura de un Monte Carlo lentamente para encontrar configuraciones de energía mínima. <a href="#recocido">Cap. 26</a></dd>
<dt>Red recíproca</dt><dd>Red de vectores de onda asociada a un cristal; en ella viven los \(\vb k\) de las bandas y la zona de Brillouin. <a href="#cristales">Cap. 12</a></dd>
<dt>Reservorio</dt><dd>Sistema mucho mayor que fija la temperatura o el potencial químico del sistema estudiado (por ejemplo, el gas H<sub>2</sub>). <a href="#gran-canonico">Cap. 22</a>, <a href="#formacion">28</a></dd>
<dt>Semilla</dt><dd>Número inicial de un generador pseudoaleatorio; con la misma semilla la simulación se repite bit a bit. <a href="#montecarlo">Cap. 24</a></dd>
<dt>Superposición</dt><dd>Combinación lineal de estados; las amplitudes interfieren. <a href="#onda">Cap. 2</a>, <a href="#formalismo">3</a></dd>
<dt>Temperatura de simulación</dt><dd>En hBN-MC, un parámetro de control del muestreo (miles de kelvin) elegido porque los movimientos cuestan varios eV; no es la temperatura física del material. <a href="#recocido">Cap. 26</a>, <a href="#modelo-enlaces">27</a></dd>
<dt>Termalización</dt><dd>Fase inicial de una simulación, que se descarta, durante la cual el sistema olvida su configuración de partida. <a href="#ising-mc">Cap. 25</a></dd>
<dt>Túnel (efecto)</dt><dd>Paso de una partícula a través de una barrera más alta que su energía, con probabilidad que decae exponencialmente con el ancho. <a href="#pozos">Cap. 4</a></dd>
<dt>Validación cruzada</dt><dd>Evaluar un ajuste prediciendo datos que no se usaron en él; mide la capacidad de predecir. <a href="#modelo-enlaces">Cap. 27</a></dd>
<dt>Ventana química</dt><dd>Intervalo de potenciales químicos de N (y B) en el que la lámina de h-BN es estable frente a la formación de NH<sub>3</sub> y BH<sub>3</sub>. <a href="#formacion">Cap. 28</a></dd>
<dt>Warren–Cowley (parámetro de)</dt><dd>\(\alpha=1-P(B|A)/x_B\): orden de corto alcance; 0 al azar, positivo si hay segregación, negativo si hay alternancia. hBN-MC lo calcula para el carbono. <a href="#ising">Cap. 23</a>, <a href="#ising-mc">25</a></dd>
</dl>
</section>
