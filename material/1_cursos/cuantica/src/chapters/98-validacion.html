<p class="lead">Un curso que enseña a desconfiar de las simulaciones debe dejarse revisar. Cada número importante que aparece en el texto sale de un núcleo de cálculo (álgebra lineal, ecuación de Schrödinger, átomo de Kohn–Sham, enlace fuerte, mecánica estadística, Monte Carlo, modelo de hBN-MC), y cada núcleo se compara aquí con una referencia independiente.</p>

<section>
<h2>Cómo se valida</h2>
<p>Cada prueba tiene cinco elementos: qué se calcula, el valor obtenido, el valor de referencia, la fuente de la referencia y la tolerancia aceptada. Las referencias son de tres tipos:</p>
<ul>
<li><strong>Soluciones exactas</strong>: pozo infinito, oscilador armónico, átomo de hidrógeno, Pöschl–Teller, H<sub>2</sub><sup>+</sup> en la base mínima, Hückel, solución de Onsager, enumeración de los 65 536 estados de un Ising 4 × 4, identidades algebraicas.</li>
<li><strong>Datos publicados</strong>: energías LDA atómicas del NIST (Kotochigova y colaboradores, 1997), Hartree–Fock del helio (Clementi y Roetti, 1974), NIST-JANAF para el H<sub>2</sub>, tablas de la \(t\) de Student y de la normal.</li>
<li><strong>Resultados de hBN-MC</strong>: la Tabla 5.8 de la tesis y los números del informe científico de la aplicación (ajuste, escala energética, energía de borde, ventana química, energías de formación, estabilidad de poros).</li>
</ul>
<p>Las pruebas estadísticas (Monte Carlo) usan semillas fijas, de modo que son reproducibles, y tolerancias acordes con su error estadístico. La tolerancia puede ser absoluta o relativa, según se indica.</p>
<div class="box note"><p>Las mismas pruebas se ejecutan fuera del navegador con <code>node tests/validar.js</code>, que escribe el informe <code>docs/VALIDACION.md</code> y termina con un código de error si alguna falla.</p></div>
</section>
