<template class="chapter-src" data-id="grafeno-hbn" data-num="14" data-title="Grafeno, h-BN y h-BNC" data-part="Parte II · Átomos, moléculas y sólidos" data-short="Bandas π del panal, conos de Dirac, brecha del h-BN, nanocintas zigzag y armchair, dominios de carbono y nanoporos">
<p class="lead">El grafeno y el nitruro de boro hexagonal comparten estructura y número de electrones, pero uno conduce como un metal sin masa y el otro es uno de los mejores aislantes bidimensionales. Toda la diferencia cabe en un sistema de dos niveles: dos sitios por celda con energías iguales o distintas. En este capítulo calculamos sus bandas, vemos qué ocurre en los bordes y en las mezclas h-BNC, y preparamos el terreno físico de los nanoporos.</p>

<section>
<h2>Bandas π del panal</h2>
<p>De los cuatro orbitales de valencia de cada átomo, tres forman los enlaces \(\sigma\) sp² (bandas profundas y muy separadas del nivel de Fermi) y el cuarto, \(p_z\), forma las bandas \(\pi\) que gobiernan las propiedades electrónicas. Con un orbital \(p_z\) por sitio, dos sitios por celda (A y B) y un salto \(t\) entre primeros vecinos, el hamiltoniano de Bloch es una matriz \(2\times2\):</p>
<div class="eq key" data-name="Hamiltoniano de Bloch del panal">\[\mathsf H(\vb k)=\begin{pmatrix}\varepsilon_A & -t\,f(\vb k)\\ -t\,f^*(\vb k) & \varepsilon_B\end{pmatrix},\qquad f(\vb k)=\sum_{j=1}^{3}\ee^{i\vb k\cdot\vb\delta_j},\]</div>
<div class="eq key" data-name="Bandas π">\[E_\pm(\vb k)=\frac{\varepsilon_A+\varepsilon_B}{2}\pm\sqrt{\Big(\frac{\varepsilon_A-\varepsilon_B}{2}\Big)^2+t^2|f(\vb k)|^2},\qquad |f|^2=3+2\cos(\vb k\cdot\vb a_1)+2\cos(\vb k\cdot\vb a_2)+2\cos\big(\vb k\cdot(\vb a_1-\vb a_2)\big).\]</div>
<p>\(|f|\) vale 3 en \(\Gamma\), 1 en \(M\) y 0 en los vértices \(K\) y \(K'\) de la zona de Brillouin. Cada átomo aporta un electrón \(\pi\), así que la banda inferior queda llena y la superior vacía.</p>
</section>

<section>
<h2>Grafeno: conos de Dirac</h2>
<p>Con \(\varepsilon_A=\varepsilon_B=0\), las bandas son \(E_\pm=\pm t|f(\vb k)|\). Se tocan exactamente en \(K\) y \(K'\), donde está el nivel de Fermi: el grafeno es un <span class="term">semimetal</span> de brecha nula. Cerca de \(K\), escribiendo \(\vb k=\vb K+\vb q\), la dispersión es lineal:</p>
<div class="eq key" data-name="Cono de Dirac">\[E_\pm(\vb q)\approx\pm\hbar v_F|\vb q|,\qquad v_F=\frac{3td}{2\hbar}\approx0.9\times10^6\un{m/s}\ \ (t=2.7\un{eV}).\]</div>
<p>Es la relación de una partícula sin masa que viaja a velocidad constante \(v_F\), unas 300 veces menor que la de la luz: los electrones del grafeno se describen con una ecuación de tipo Dirac. La densidad de estados cerca de \(E_F\) crece linealmente, \(g(E)\propto|E|\), y se anula en el punto de Dirac. La banda \(\pi\) completa tiene ancho \(6t\approx16\) eV.</p>
</section>

<section>
<h2>h-BN: la brecha iónica</h2>
<p>En el h-BN los dos sitios son distintos. El orbital \(p_z\) del nitrógeno (más electronegativo) está más bajo que el del boro, \(\varepsilon_\text N\lt\varepsilon_\text B\). En \(K\), donde \(f=0\), la matriz es diagonal y las bandas valen exactamente \(\varepsilon_\text N\) y \(\varepsilon_\text B\):</p>
<div class="eq key" data-name="Brecha del h-BN en el modelo π">\[E_g=E_+(K)-E_-(K)=\varepsilon_\text B-\varepsilon_\text N=\Delta .\]</div>
<ul>
<li>La banda de valencia (llena) tiene casi todo su peso en los N y la de conducción en los B: el sistema \(\pi\) del h-BN es el «par solitario» del nitrógeno, compartido solo un poco con el boro.</li>
<li>Con \(t\approx2.3\) eV y \(\Delta\approx4.6\) eV el modelo reproduce la brecha directa en \(K\) que dan los cálculos DFT-LDA/GGA de la monocapa (4.5–4.7 eV). La brecha óptica medida en h-BN es de unos 6 eV: la DFT con LDA/GGA subestima las brechas, un problema que se discute en el capítulo 17.</li>
<li>Cerca de \(K\) las bandas son parabólicas: los electrones tienen masa efectiva, como en una ecuación de Dirac con masa \(\Delta/2v_F^2\).</li>
</ul>
<div class="sim" data-sim="bandas-panal-3d" data-title="Superficies de energía del grafeno y del h-BN"></div>
<div class="sim-guide"><ul>
<li>Con \(\Delta=0\) las dos superficies se tocan en los seis vértices del hexágono (los conos de Dirac).</li>
<li>Aumente \(\Delta\): los conos se separan y se redondean. La brecha mínima siempre está en \(K\).</li>
</ul></div>
<div class="sim" data-sim="bandas-camino" data-title="Bandas a lo largo de Γ–K–M–Γ y densidad de estados"></div>
<div class="sim-guide"><ul>
<li>Lea la pendiente cerca de \(K\) en el grafeno: es \(\hbar v_F\). La lectura numérica coincide con \(3td/2\hbar\).</li>
<li>La densidad de estados del grafeno se anula en \(E=0\) y tiene picos de van Hove en \(\pm t\) (punto \(M\)). En el h-BN aparece una brecha limpia.</li>
<li>Pase a h-BNC promedio (\(\varepsilon\) intermedias): la brecha se reduce.</li>
</ul></div>
<div class="box explain"><p>Piense en dos escalones iguales unidos por una rampa: el agua (los electrones) puede pasar libremente de uno a otro. Si un escalón está más alto que el otro (B frente a N), el agua se queda en el de abajo y hace falta un salto de energía para subirla. El grafeno tiene los escalones a la misma altura; el h-BN, a alturas distintas.</p></div>
<div class="box valid"><p>El apéndice B comprueba que \(|f(K)|=0\) (cono de Dirac), que la brecha del modelo en \(K\) es exactamente \(\varepsilon_\text B-\varepsilon_\text N\) y que la pendiente numérica de la banda cerca de \(K\) da \(v_F=3td/2\hbar=8.74\times10^5\) m/s con error menor que \(10^{-4}\).</p></div>
</section>

<section>
<h2>Bordes: nanocintas zigzag y armchair</h2>
<p>Una <span class="term">nanocinta</span> es una tira de panal infinita en una dirección y de ancho finito en la otra. Su periodicidad es 1D, y para cada \(k\) a lo largo de la cinta hay tantas bandas como átomos por celda. El tipo de borde cambia radicalmente la física:</p>
<ul>
<li><strong>Zigzag.</strong> Cada borde contiene átomos de una sola subred. En el grafeno aparecen <span class="term">estados de borde</span> casi planos en \(E=0\) para \(2\pi/3\le|ka|\le\pi\), localizados en los átomos del borde (Fujita <i>et al.</i>, 1996). En el h-BN, un borde zigzag es todo B o todo N, y sus estados de borde se colocan cerca de la banda de conducción (borde B) o de valencia (borde N).</li>
<li><strong>Armchair.</strong> Cada borde contiene pares B–N (o C–C). En el grafeno la brecha depende del ancho: en el modelo de primeros vecinos, las cintas con \(W=3p+2\) líneas de dímeros son metálicas y las demás semiconductoras.</li>
</ul>
<p>En una cinta real los enlaces colgantes de los bordes están saturados con hidrógeno, que se lleva el orbital sp² sobrante; el orbital \(p_z\) del átomo de borde sigue formando parte del sistema \(\pi\). Por eso el modelo de enlace fuerte \(\pi\) de una cinta pasivada simplemente corta la red sin añadir nada.</p>
<div class="sim" data-sim="nanocinta" data-title="Bandas de nanocintas zigzag y armchair"></div>
<div class="sim-guide"><ul>
<li>Cinta zigzag de grafeno: la banda plana en \(E=0\) entre \(ka=2\pi/3\) y \(\pi\) son los estados de borde. Sus pesos (color) están en las primeras filas.</li>
<li>Cinta armchair de grafeno: cambie el ancho de 7 a 8: la brecha se cierra en \(W=8=3\cdot2+2\).</li>
<li>Cambie a h-BN: la cinta zigzag tiene un borde de B y otro de N, y sus estados de borde quedan pegados a cada banda.</li>
</ul></div>
</section>

<section>
<h2>h-BNC: dominios de carbono en h-BN</h2>
<p>Las láminas h-BNC mezclan las dos estructuras. Como C–C y B–N son isoelectrónicos, el carbono puede sustituir pares BN sin cambiar el número de electrones. Experimentalmente (Ci <i>et al.</i>, 2010) el carbono no se reparte al azar: forma dominios de grafeno dentro del h-BN. La razón energética se verá en el capítulo 27: en el modelo de enlaces de la tesis, cambiar un par de enlaces C–C + B–N por C–N + C–B cuesta \(+0.45\) eV, de modo que las interfaces entre dominios son caras y el sistema tiende a segregarse.</p>
<p>Electrónicamente, un dominio de carbono es un «pozo» dentro del aislante: sus estados \(\pi\) caen dentro de la brecha del h-BN y la brecha efectiva de la lámina disminuye con el tamaño del dominio, como en un punto cuántico (capítulo 4). Así se pueden diseñar brechas intermedias entre 0 y 6 eV.</p>
<div class="sim" data-sim="copo-bnc" data-title="Copos h-BNC: brecha y estados de borde según la distribución del carbono"></div>
<div class="sim-guide"><ul>
<li>Con 0 % de carbono la brecha es la del h-BN (menos un poco por el tamaño finito). Un dominio circular de C introduce estados dentro de la brecha.</li>
<li>Compare dominio compacto y carbono disperso con la misma cantidad: el dominio da la brecha menor, porque los estados se deslocalizan en una región más grande.</li>
<li>El mapa muestra dónde vive el HOMO: en el carbono o en los bordes del copo.</li>
</ul></div>
</section>

<section>
<h2>Nanoporos en h-BN</h2>
<p>Un <span class="term">nanoporo</span> es un hueco de pocos átomos en la lámina. Bajo el haz de electrones de un microscopio, el h-BN pierde átomos preferentemente de una subred, y a temperatura ambiente se forman poros triangulares con bordes zigzag de una sola especie, en su mayoría de nitrógeno. A temperaturas altas (cientos de °C) los experimentos de Pham <i>et al.</i> (2016) observaron que los defectos cambian de forma y aparecen poros con bordes mixtos. Explicar ese cambio de morfología con la temperatura es la motivación de la tesis de la que nace hBN-MC.</p>
<p>Para ese problema el detalle electrónico se resume en energías: cuánto cuesta cada tipo de enlace (B–N, N–H, B–H, …). Esas energías se obtienen con DFT (Parte III) y se usan en un modelo estadístico (Partes IV–VI).</p>
<div class="box hbn"><p>hBN-MC trabaja en la escala de los enlaces, no de los electrones: no calcula bandas, sino la energía total \(E=\sum\varepsilon_{\alpha\beta}n_{\alpha\beta}\). Pero los conceptos de este capítulo explican sus ingredientes: la red de panal bipartita (B y N alternados), los bordes zigzag de una sola especie de los poros triangulares, la isoelectronía C₂/BN que permite las mezclas h-BNC y la preferencia por segregar el carbono, que la aplicación cuantifica con el parámetro de Warren–Cowley \(\alpha_\text C\).</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>Bandas \(\pi\) del panal: \(E_\pm=\bar\varepsilon\pm\sqrt{(\Delta/2)^2+t^2|f(\vb k)|^2}\), con \(f(K)=0\).</li>
<li>Grafeno (\(\Delta=0\)): conos de Dirac en \(K\), \(v_F=3td/2\hbar\approx10^6\) m/s, semimetal.</li>
<li>h-BN: brecha \(\Delta=\varepsilon_B-\varepsilon_N\) en \(K\); valencia en N, conducción en B.</li>
<li>Bordes zigzag: una subred, estados de borde; armchair: pares, brecha dependiente del ancho.</li>
<li>h-BNC: los dominios de C son pozos dentro del aislante; la segregación es energéticamente favorable.</li>
<li>Los nanoporos triangulares tienen bordes zigzag de una sola especie, saturados con H.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Cuánto vale la energía de las bandas del grafeno en \(\Gamma\) y en \(M\) con \(t=2.7\) eV?
<details><summary>Respuesta</summary><p>\(\Gamma\): \(\pm3t=\pm8.1\) eV; \(M\): \(\pm t=\pm2.7\) eV.</p></details></li>
<li><span class="lvl">Básico</span>¿Qué \(\Delta\) hace falta en el modelo π para una brecha de 6 eV?
<details><summary>Respuesta</summary><p>\(\Delta=6\) eV: en \(K\) la brecha es exactamente \(\Delta\).</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que \(|f(\Gamma)|=3\) y \(|f(M)|=1\).
<details><summary>Respuesta</summary><p>En \(\Gamma\) las tres fases son 0. En \(M=(\pi/\sqrt3d,\pi/3d)\): \(\vb M\cdot\vb\delta_1=\pi/3\), \(\vb M\cdot\vb\delta_2=\pi/3\), \(\vb M\cdot\vb\delta_3=-2\pi/3\); \(|2\ee^{i\pi/3}+\ee^{-2i\pi/3}|=|\ee^{i\pi/3}|=1\).</p></details></li>
<li><span class="lvl">Intermedio</span>Estime la masa efectiva en \(K\) del h-BN con \(\Delta=4.6\) eV y \(\hbar v_F=5.0\) eV·Å.
<details><summary>Respuesta</summary><p>\(E\approx\frac\Delta2+\frac{(\hbar v_Fq)^2}{\Delta}\) → \(m^*=\frac{\Delta\hbar^2}{2(\hbar v_F)^2}\); con \(\hbar^2/2m_e=3.81\) eV·Å²: \(m^*/m_e=\frac{4.6\cdot3.81}{25}=0.70\).</p></details></li>
<li><span class="lvl">Avanzado</span>¿Por qué un copo triangular zigzag de grafeno tiene estados de energía cero mientras que uno hexagonal no?
<details><summary>Respuesta</summary><p>El triángulo tiene más átomos de una subred que de la otra; por el teorema de Lieb para redes bipartitas aparecen \(|N_A-N_B|\) estados de energía cero. El hexágono tiene \(N_A=N_B\).</p></details></li>
</ol>
</section>
