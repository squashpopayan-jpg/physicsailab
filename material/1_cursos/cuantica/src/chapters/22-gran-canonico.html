<template class="chapter-src" data-id="gran-canonico" data-num="22" data-title="Potencial químico y ensamble gran canónico" data-part="Parte IV · Mecánica estadística" data-short="Potencial químico, gas ideal, μ del hidrógeno frente a T y p, ensamble gran canónico, adsorción de Langmuir, Fermi–Dirac y Bose–Einstein">
<p class="lead">La temperatura dice hacia dónde fluye la energía; el potencial químico dice hacia dónde fluyen las partículas. En un nanoporo de h-BN, los átomos de hidrógeno que saturan los bordes pueden ir y venir hacia el gas que rodea la lámina, y el potencial químico del hidrógeno, \(\mu_\text{H}\), decide cuántos se quedan. Es la magnitud \(\Delta\mu_\text{H}\) que aparece en los controles de hBN-MC.</p>

<section>
<h2>El potencial químico</h2>
<div class="box def"><p>El <span class="term">potencial químico</span> de una especie es el cambio de energía libre al añadir una partícula manteniendo fijos la temperatura, el volumen y las demás especies:</p>
<div class="eq key" data-name="Potencial químico">\[\mu=\pdv{F}{N}\bigg|_{T,V}=-T\pdv{S}{N}\bigg|_{E,V}.\]</div></div>
<p>Igual que el calor fluye de alta a baja temperatura, las partículas fluyen de alto a bajo potencial químico, porque así crece la entropía total. En equilibrio, el potencial químico de cada especie es el mismo en todas las fases y regiones en contacto. En una reacción química \(\sum_i\nu_iX_i=0\), el equilibrio exige \(\sum_i\nu_i\mu_i=0\); por ejemplo, para \(\text{H}_2\rightleftharpoons2\text{H}\): \(\mu_{\text{H}_2}=2\mu_\text{H}\).</p>
<div class="box explain"><p>El potencial químico es como el precio de una partícula en distintos mercados. Si en un lugar «vale» más que en otro, las partículas se mueven hasta que el precio se iguala. Un gas de hidrógeno a alta presión es un mercado donde el hidrógeno es caro (abunda y «quiere salir»); al vacío, el hidrógeno es barato y los átomos tienden a abandonar la superficie.</p></div>
</section>

<section>
<h2>El gas ideal y el potencial químico del H₂</h2>
<p>Para un gas ideal de moléculas independientes, la función de partición del sistema es \(Z=q^N/N!\), con \(q\) la función de partición de una molécula. Con \(F=-\kB T\ln Z\) y Stirling:</p>
<div class="eq key" data-name="Potencial químico de un gas ideal">\[\mu=-\kB T\ln\frac{q}{N}=\kB T\ln\frac{p\,\lambda^3}{\kB T}-\kB T\ln q_\text{int},\qquad \lambda=\frac{h}{\sqrt{2\pi m\kB T}} .\]</div>
<p>\(\lambda\) es la longitud de onda térmica (traslación) y \(q_\text{int}\) recoge los grados de libertad internos. La dependencia con la presión es universal:</p>
<div class="eq key" data-name="Dependencia con la presión">\[\mu(T,p)=\mu(T,p^\circ)+\kB T\ln\frac{p}{p^\circ}.\]</div>
<p>Para una molécula diatómica como el H₂, \(q_\text{int}=q_\text{rot}\,q_\text{vib}\). La parte rotacional suma los niveles \(J(J+1)\kB\theta_\text{rot}\) (\(\theta_\text{rot}=85.3\) K) con los pesos de las formas para y orto del hidrógeno; la vibracional usa el oscilador cuántico (\(\theta_\text{vib}=6332\) K), con su energía de punto cero \(\hbar\omega/2=0.27\) eV.</p>
<p>En los cálculos de energía de formación se toma como referencia la energía DFT de la molécula aislada en reposo, \(E(\text{H}_2)\), y se escribe</p>
<div class="eq key" data-name="Potencial químico del hidrógeno">\[\mu_\text{H}=\tfrac12E(\text{H}_2)+\Delta\mu_\text{H}(T,p),\qquad \Delta\mu_\text{H}=\tfrac12\big[\mu_{\text{H}_2}(T,p)-E(\text{H}_2)\big].\]</div>
<p>\(\Delta\mu_\text{H}\) es negativo y crece en valor absoluto con la temperatura y al bajar la presión: un ambiente caliente y a baja presión es «pobre en hidrógeno». A 300 K y 1 bar vale unos −0.02 eV (−0.16 eV sin la energía de punto cero); a 1000 K y 1 bar, unos −0.57 eV; en alto vacío (1 Pa) y a 1000 K, unos −1.07 eV. (Estos valores incluyen la energía de punto cero de la molécula, porque la referencia \(E(\text{H}_2)\) es la energía electrónica en el fondo del pozo.)</p>
<div class="sim" data-sim="mu-h2" data-title="El potencial químico del hidrógeno, Δμ<sub>H</sub>, frente a la temperatura y la presión"></div>
<div class="sim-guide"><ul>
<li>Cada década de presión desplaza \(\Delta\mu_\text{H}\) en \(\frac12\kB T\ln10\): 0.03 eV a 300 K, 0.1 eV a 1000 K.</li>
<li>Busque qué condiciones dan \(\Delta\mu_\text{H}=-1.5\) eV, el valor usado en el ejemplo de la portada.</li>
<li>Las líneas horizontales marcan los umbrales del informe de hBN-MC por debajo de los cuales la ventana química del h-BN se abre (capítulo 28).</li>
</ul></div>
<div class="box valid"><p>La entropía estándar del H₂ calculada con estas funciones de partición, 130.60 J/(mol·K) a 298.15 K y 1 bar, coincide con el valor de las tablas NIST-JANAF (130.68) con error relativo de \(6\times10^{-4}\) (apéndice B).</p></div>
</section>

<section>
<h2>El ensamble gran canónico</h2>
<p>Si el sistema intercambia energía y partículas con un reservorio de temperatura \(T\) y potencial químico \(\mu\), la probabilidad de un microestado con energía \(E_i\) y \(N_i\) partículas es</p>
<div class="eq key" data-name="Distribución gran canónica">\[p_i=\frac{\ee^{-(E_i-\mu N_i)/\kB T}}{\Xi},\qquad \Xi=\sum_i\ee^{-(E_i-\mu N_i)/\kB T},\qquad \expval N=\kB T\pdv{\ln\Xi}{\mu}.\]</div>
<p>Es la distribución de Boltzmann con la energía sustituida por \(E-\mu N\): añadir una partícula «cuesta» \(-\mu\). La magnitud que se minimiza es el gran potencial \(\Omega_G=-\kB T\ln\Xi=F-\mu N\).</p>
<div class="box hbn"><p>El reservorio «gran canónico respecto de H₂» de hBN-MC es exactamente esto: cada hidrógeno de pasivación de un borde suma a la energía su energía de enlace y resta \(\mu_\text{H}=E(\text{H}_2)/2+\Delta\mu_\text{H}\). En el código, cada enlace vacancia–átomo vale \(\varepsilon_{X\alpha}-\mu_\text{H}\) (función <code>epsEff</code>). Con \(\Delta\mu_\text{H}\) muy negativo los bordes con muchos H se encarecen y los poros tienden a ser compactos; con \(\Delta\mu_\text{H}\) alto, a fragmentarse (capítulo 28).</p></div>
</section>

<section>
<h2>Adsorción: la isoterma de Langmuir</h2>
<p>El ejemplo más sencillo de ensamble gran canónico es una superficie con \(M\) sitios independientes, cada uno vacío (energía 0) u ocupado por una partícula (energía \(\varepsilon\), negativa si la partícula se liga). Para un sitio, \(\xi=1+\ee^{-(\varepsilon-\mu)/\kB T}\) y la <span class="term">cobertura</span> es</p>
<div class="eq key" data-name="Isoterma de Langmuir">\[\theta=\frac{\expval{N}}{M}=\frac{1}{1+\ee^{(\varepsilon-\mu)/\kB T}} .\]</div>
<p>Si \(\mu\) está muy por encima de \(\varepsilon\), los sitios están llenos; muy por debajo, vacíos; la transición tiene un ancho de unos pocos \(\kB T\). Como \(\mu\) del gas depende de \(\ln p\), la cobertura frente a la presión es la isoterma de Langmuir, \(\theta=Kp/(1+Kp)\). Los enlaces colgantes del borde de un poro son «sitios» para el hidrógeno: si la energía de enlace de un H a un N o a un B del borde es mucho más negativa que \(\mu_\text{H}\), los bordes estarán siempre saturados, que es la hipótesis del modelo.</p>
<div class="sim" data-sim="langmuir" data-title="Cobertura de sitios en equilibrio con un gas"></div>
<div class="sim-guide"><ul>
<li>La cobertura es ½ exactamente cuando \(\mu=\varepsilon\).</li>
<li>A temperatura más alta la transición se ensancha; a presión más baja se desplaza hacia energías de enlace más negativas.</li>
</ul></div>
</section>

<section>
<h2>Estadísticas cuánticas: Fermi–Dirac y Bose–Einstein</h2>
<p>Aplicando el ensamble gran canónico a un solo nivel de energía \(\varepsilon\) de partículas idénticas se obtienen las ocupaciones medias de la física cuántica. Para fermiones, cada nivel admite 0 o 1 partícula (Pauli); para bosones, cualquier número:</p>
<div class="eq key" data-name="Ocupaciones de Fermi–Dirac y Bose–Einstein">\[f_\text{FD}(\varepsilon)=\frac{1}{\ee^{(\varepsilon-\mu)/\kB T}+1},\qquad f_\text{BE}(\varepsilon)=\frac{1}{\ee^{(\varepsilon-\mu)/\kB T}-1}.\]</div>
<p>Cuando \(\varepsilon-\mu\gg\kB T\) ambas se reducen a la de Boltzmann, \(\ee^{-(\varepsilon-\mu)/\kB T}\). La distribución de Fermi–Dirac describe los electrones de un sólido: a \(T=0\) es un escalón en \(\mu=E_F\), y a temperatura finita el escalón se suaviza en unos \(4\kB T\). Por eso, en un aislante como el h-BN con \(E_F\) en medio de una brecha de 6 eV, la ocupación de la banda de conducción es \(\sim\ee^{-3\un{eV}/\kB T}\): despreciable a cualquier temperatura razonable. La isoterma de Langmuir es, matemáticamente, una distribución de Fermi–Dirac: cada sitio admite un solo hidrógeno.</p>
<div class="sim" data-sim="fermi-dirac" data-title="Ocupación de un nivel: Fermi–Dirac, Bose–Einstein y Boltzmann"></div>
<div class="sim-guide"><ul>
<li>Lejos de \(\mu\) las tres curvas coinciden; cerca de \(\mu\) los fermiones se saturan en 1 y los bosones divergen.</li>
<li>A \(T\to0\) la distribución de Fermi–Dirac se convierte en un escalón.</li>
</ul></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>\(\mu=\partial F/\partial N\): las partículas fluyen hacia el menor \(\mu\); en equilibrio \(\mu\) es uniforme y \(\sum\nu_i\mu_i=0\).</li>
<li>Gas ideal: \(\mu=\kB T\ln(p\lambda^3/\kB T)-\kB T\ln q_\text{int}\); depende de \(\ln p\).</li>
<li>\(\mu_\text{H}=\frac12E(\text{H}_2)+\Delta\mu_\text{H}(T,p)\), con \(\Delta\mu_\text{H}\lt0\) y más negativo a alta \(T\) y baja \(p\).</li>
<li>Gran canónico: \(p_i\propto\ee^{-(E_i-\mu N_i)/\kB T}\); es el reservorio H₂ de hBN-MC.</li>
<li>Langmuir y Fermi–Dirac: \(1/(\ee^{(\varepsilon-\mu)/\kB T}+1)\).</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Cuánto cambia \(\Delta\mu_\text{H}\) al bajar la presión de 1 bar a \(10^{-6}\) bar a 1000 K?
<details><summary>Respuesta</summary><p>\(\frac12\kB T\ln10^{-6}=\frac12\cdot0.0862\cdot(-13.8)=-0.60\) eV.</p></details></li>
<li><span class="lvl">Básico</span>Un sitio tiene \(\varepsilon=-1.0\) eV y \(\mu=-1.2\) eV a 500 K. ¿Cobertura?
<details><summary>Respuesta</summary><p>\(\theta=1/(1+\ee^{0.2/0.0431})=0.0096\): casi vacío.</p></details></li>
<li><span class="lvl">Intermedio</span>Calcule la longitud de onda térmica del H₂ a 300 K y compárela con la distancia media entre moléculas a 1 bar.
<details><summary>Respuesta</summary><p>\(\lambda=0.71\) Å; distancia media \((\kB T/p)^{1/3}=34\) Å. Como \(\lambda\ll\) distancia, el gas es clásico.</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que la isoterma de Langmuir se escribe \(\theta=Kp/(1+Kp)\).
<details><summary>Respuesta</summary><p>\(\ee^{\mu/\kB T}=\frac{p}{p^\circ}\ee^{\mu^\circ/\kB T}\), luego \(\theta=\frac{\ee^{(\mu-\varepsilon)/\kB T}}{1+\ee^{(\mu-\varepsilon)/\kB T}}\) con \(K=\ee^{(\mu^\circ-\varepsilon)/\kB T}/p^\circ\).</p></details></li>
<li><span class="lvl">Avanzado</span>Obtenga \(f_\text{FD}\) a partir de \(\xi=1+\ee^{-(\varepsilon-\mu)/\kB T}\).
<details><summary>Respuesta</summary><p>\(\expval n=\kB T\,\partial\ln\xi/\partial\mu=\frac{\ee^{-(\varepsilon-\mu)/\kB T}}{1+\ee^{-(\varepsilon-\mu)/\kB T}}=\frac{1}{\ee^{(\varepsilon-\mu)/\kB T}+1}\).</p></details></li>
</ol>
</section>
