<template class="chapter-src" data-id="hidrogeno" data-num="6" data-title="Momento angular y átomo de hidrógeno" data-part="Parte I · Fundamentos de la mecánica cuántica" data-short="Ecuación en 3D, momento angular, armónicos esféricos, ecuación radial, niveles y orbitales del hidrógeno, unidades atómicas">
<p class="lead">El átomo de hidrógeno es el único átomo que se resuelve exactamente, y de su solución sale el vocabulario de toda la química: los números cuánticos \(n,l,m\), los orbitales s, p y d, sus formas y sus nodos. Aquí resolvemos el problema completo, con una idea que se repetirá en el resto del curso: separar un problema difícil en piezas más sencillas.</p>

<section>
<h2>La ecuación de Schrödinger en tres dimensiones</h2>
<p>En 3D el operador de energía cinética contiene el laplaciano, y la ecuación estacionaria es</p>
<div class="eq">\[-\frac{\hbar^2}{2m}\lap\psi(\vb r)+V(\vb r)\,\psi(\vb r)=E\,\psi(\vb r),\qquad |\psi(\vb r)|^2\,\dd^3r=\text{probabilidad en el volumen }\dd^3r .\]</div>
<p>Cuando el potencial solo depende de la distancia al origen, \(V=V(r)\) (un <span class="term">potencial central</span>, como la atracción de Coulomb del núcleo), conviene usar coordenadas esféricas \((r,\theta,\phi)\). El laplaciano se separa en una parte radial y una angular:</p>
<div class="eq">\[\lap=\frac{1}{r^2}\pdv{}{r}\Big(r^2\pdv{}{r}\Big)-\frac{\op L^2}{\hbar^2r^2},\qquad \op L^2=-\hbar^2\Big[\frac{1}{\sen\theta}\pdv{}{\theta}\Big(\sen\theta\pdv{}{\theta}\Big)+\frac{1}{\sen^2\theta}\pdv{^2}{\phi^2}\Big].\]</div>
<p>Toda la dependencia angular está en el operador \(\op L^2\), el cuadrado del momento angular. Por eso las soluciones se factorizan: \(\psi(r,\theta,\phi)=R(r)\,Y(\theta,\phi)\).</p>
</section>

<section>
<h2>El momento angular cuantizado</h2>
<p>El momento angular clásico es \(\vb L=\vb r\times\vb p\). Sus componentes cuánticas no conmutan entre sí, \([\op L_x,\op L_y]=i\hbar\op L_z\) (y permutaciones cíclicas), pero cada una conmuta con \(\op L^2\). Por tanto se pueden conocer a la vez \(L^2\) y una sola componente, que por convención es \(L_z=-i\hbar\,\partial/\partial\phi\). Sus autofunciones comunes son los <span class="term">armónicos esféricos</span>:</p>
<div class="eq key" data-name="Momento angular">\[\op L^2Y_{lm}=\hbar^2l(l+1)\,Y_{lm},\qquad \op L_zY_{lm}=\hbar m\,Y_{lm},\qquad l=0,1,2,\dots;\quad m=-l,\dots,l .\]</div>
<p>La condición \(Y(\phi+2\pi)=Y(\phi)\) exige \(m\) entero; la regularidad en los polos exige \(|m|\le l\). El módulo del momento angular es \(\hbar\sqrt{l(l+1)}\), siempre mayor que su proyección máxima \(\hbar l\): el vector nunca apunta exactamente a lo largo de \(z\), porque entonces se conocerían las tres componentes.</p>
<div class="tablewrap"><table>
<tr><th>\(l\)</th><th>Letra</th><th>\(Y_{lm}\) (formas reales normalizadas)</th></tr>
<tr><td class="c">0</td><td class="c">s</td><td>\(\frac{1}{\sqrt{4\pi}}\)</td></tr>
<tr><td class="c">1</td><td class="c">p</td><td>\(p_x,p_y,p_z=\sqrt{\frac{3}{4\pi}}\,\frac{x}{r},\ \sqrt{\frac{3}{4\pi}}\,\frac{y}{r},\ \sqrt{\frac{3}{4\pi}}\,\frac{z}{r}\)</td></tr>
<tr><td class="c">2</td><td class="c">d</td><td>\(d_{z^2}=\sqrt{\frac{5}{16\pi}}\frac{3z^2-r^2}{r^2},\ d_{xz},d_{yz},d_{xy}=\sqrt{\frac{15}{4\pi}}\frac{xz}{r^2},\dots,\ d_{x^2-y^2}=\sqrt{\frac{15}{16\pi}}\frac{x^2-y^2}{r^2}\)</td></tr>
</table></div>
<p>Los armónicos con \(m\ne0\) son complejos (\(\propto\ee^{im\phi}\)); en química se usan combinaciones reales, como \(p_x\propto Y_{1,-1}-Y_{1,1}\), que tienen la misma energía y formas más intuitivas.</p>
<div class="sim" data-sim="armonicos" data-title="Armónicos esféricos en tres dimensiones"></div>
<div class="sim-guide"><ul>
<li>El número de planos nodales (donde el orbital cambia de signo) es igual a \(l\).</li>
<li>En modo \(|Y_{lm}|^2\) complejo, las formas son simétricas alrededor del eje \(z\): no dependen de \(\phi\).</li>
<li>Gire la vista: \(p_x\), \(p_y\) y \(p_z\) son el mismo objeto orientado en tres direcciones.</li>
</ul></div>
<div class="box explain"><p>Los armónicos esféricos son a la superficie de una esfera lo que los armónicos de una cuerda de guitarra son a la cuerda: los modos de vibración posibles. Un globo que vibra puede hincharse entero (s), oscilar entre dos polos (p) o deformarse en cuatro lóbulos (d).</p></div>
</section>

<section>
<h2>La ecuación radial y el potencial efectivo</h2>
<p>Sustituyendo \(\psi=R(r)Y_{lm}\) y definiendo \(u(r)=rR(r)\), la parte radial se reduce a una ecuación unidimensional:</p>
<div class="eq key" data-name="Ecuación radial">\[-\frac{\hbar^2}{2m}\,u''(r)+\Big[V(r)+\frac{\hbar^2l(l+1)}{2mr^2}\Big]u(r)=E\,u(r),\qquad u(0)=0,\qquad \int_0^\infty u^2\,\dd r=1 .\]</div>
<p>Es un problema 1D con un <span class="term">potencial efectivo</span> que incluye la <span class="term">barrera centrífuga</span> \(\hbar^2l(l+1)/2mr^2\). Esa barrera aleja del núcleo a los electrones con \(l\gt0\): los orbitales p y d casi no tocan el núcleo, mientras que los s sí. Cerca del origen, \(u\propto r^{l+1}\).</p>
</section>

<section>
<h2>El átomo de hidrógeno</h2>
<p>Con \(V=-Ze^2/(4\pi\eo r)\), la ecuación radial se resuelve con polinomios de Laguerre. Solo hay soluciones normalizables para energías</p>
<div class="eq key" data-name="Niveles del hidrógeno">\[E_n=-\frac{Z^2}{n^2}\,\frac{\hbar^2}{2m_ea_0^2}=-\frac{13.606\un{eV}\,Z^2}{n^2},\qquad n=1,2,\dots;\quad l=0,\dots,n-1;\quad m=-l,\dots,l,\]</div>
<div class="eq key" data-name="Funciones radiales">\[R_{nl}(r)=\sqrt{\Big(\frac{2Z}{na_0}\Big)^3\frac{(n-l-1)!}{2n\,(n+l)!}}\ \ee^{-\rho/2}\rho^l\,L^{2l+1}_{n-l-1}(\rho),\qquad \rho=\frac{2Zr}{na_0}.\]</div>
<ul>
<li>Las energías coinciden con las de Bohr, pero no hay órbitas: hay nubes de probabilidad.</li>
<li>La energía solo depende de \(n\): cada nivel tiene \(n^2\) estados (\(2n^2\) contando el espín). Esta degeneración «accidental» en \(l\) es exclusiva del potencial \(1/r\); en átomos con más electrones desaparece (capítulo 8).</li>
<li>Hay \(n-l-1\) nodos radiales y \(l\) nodos angulares: \(n-1\) en total.</li>
<li>La distancia media es \(\expval r=\frac{a_0}{2Z}[3n^2-l(l+1)]\); para el estado 1s el radio más probable (máximo de \(r^2R^2\)) es exactamente \(a_0\).</li>
<li>El estado fundamental tiene \(l=0\): momento angular nulo. Es un error del modelo de Bohr imaginarlo girando.</li>
</ul>
<div class="sim" data-sim="radial-hidrogeno" data-title="Funciones radiales, potencial efectivo y solución numérica"></div>
<div class="sim-guide"><ul>
<li>Compare 2s y 2p: misma energía, pero el 2s tiene un nodo radial y una pequeña probabilidad cerca del núcleo; el 2p queda fuera por la barrera centrífuga.</li>
<li>Active la solución numérica (Numerov en malla logarítmica): se superpone a la exacta y su energía coincide con \(-Z^2/2n^2\) Ha en todos los decimales mostrados.</li>
<li>Para He⁺ (\(Z=2\)) todo se contrae a la mitad y las energías se cuadruplican.</li>
</ul></div>
</section>

<section>
<h2>Orbitales atómicos</h2>
<p>Un <span class="term">orbital</span> es una función de onda de un electrón, \(\psi_{nlm}=R_{nl}Y_{lm}\). Se nombra con \(n\) y la letra de \(l\): 1s, 2s, 2p, 3d… Su módulo al cuadrado es la nube de probabilidad; su <em>signo</em> (la fase) no se ve en la densidad, pero decide si dos orbitales vecinos se suman o se restan al formar un enlace (capítulo 10). Por eso los dibujos químicos colorean los lóbulos de dos colores.</p>
<div class="sim" data-sim="orbitales-2d" data-title="Orbitales del hidrógeno: corte en el plano xz"></div>
<div class="sim-guide"><ul>
<li>Los colores indican el signo de \(\psi\); la intensidad, \(|\psi|^2\). Las líneas donde el color se anula son nodos.</li>
<li>El orbital 3p tiene un nodo radial (una esfera) y un plano nodal; el 3d\(_{z^2}\) tiene dos conos nodales.</li>
<li>La escala logarítmica revela la cola exponencial y las regiones de baja densidad.</li>
</ul></div>
<div class="sim" data-sim="nube-3d" data-title="La nube electrónica: muestreo de |ψ|² en 3D"></div>
<div class="sim-guide"><ul>
<li>Cada punto es una posible medida de la posición del electrón, sorteada con probabilidad \(|\psi|^2\) (la regla de Born del capítulo 2).</li>
<li>Los puntos se colorean según el signo de \(\psi\) en ese lugar.</li>
</ul></div>
</section>

<section>
<h2>Unidades atómicas</h2>
<p>Las constantes \(\hbar\), \(m_e\), \(e\) y \(4\pi\eo\) aparecen en todas las fórmulas atómicas. Es cómodo tomarlas iguales a 1: son las <span class="term">unidades atómicas de Hartree</span>. La longitud natural es el radio de Bohr y la energía natural es el hartree:</p>
<div class="eq key" data-name="Unidades atómicas">\[1\,a_0=0.529\,177\un{Å},\qquad 1\un{Ha}=\frac{\hbar^2}{m_ea_0^2}=27.211\,386\un{eV}=2\un{Ry},\qquad 1\un{Ry}=13.605\,693\un{eV}.\]</div>
<p>En estas unidades la ecuación del hidrógeno es simplemente \(-\frac12\lap\psi-\frac Zr\psi=E\psi\), con \(E_n=-Z^2/2n^2\) Ha. Todo el átomo autoconsistente de los capítulos 15–17 trabaja en unidades atómicas.</p>
<div class="box hbn"><p>SIESTA, el código con el que se calcularon los parámetros de hBN-MC, usa internamente rydbergs y radios de Bohr: el parámetro <code>MeshCutoff</code> se da en Ry (por ejemplo 200 Ry) y las distancias pueden darse en Bohr o en Å. Sus salidas de energía total aparecen en eV. Confundir Ry con Ha (un factor 2) o Bohr con Å (casi un factor 2) es uno de los errores más frecuentes al trabajar con códigos de DFT.</p></div>
<div class="box valid"><p>El resolvedor radial de Numerov reproduce las energías del hidrógeno 1s, 3d y 4f con error menor que \(10^{-8}\) Ha; las integrales numéricas de \(R_{nl}\) confirman la normalización y \(\expval r_{2p}=5a_0\) con error menor que \(10^{-8}\), y el radio más probable del 1s resulta \(a_0\) (apéndice B).</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>En un potencial central, \(\psi=R(r)Y_{lm}(\theta,\phi)\): la parte angular es universal.</li>
<li>\(L^2=\hbar^2l(l+1)\) y \(L_z=\hbar m\), con \(|m|\le l\); solo una componente de \(\vb L\) está definida.</li>
<li>La ecuación radial es 1D con potencial efectivo \(V+\hbar^2l(l+1)/2mr^2\).</li>
<li>Hidrógeno: \(E_n=-13.6\,Z^2/n^2\) eV, \(n^2\) estados por nivel, \(n-1\) nodos.</li>
<li>Los orbitales s, p, d tienen \(l=0,1,2\) planos nodales; el signo de la función decide los enlaces.</li>
<li>Unidades atómicas: \(a_0=0.529\) Å, 1 Ha = 27.21 eV = 2 Ry.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Cuántos orbitales (sin espín) tiene la capa \(n=3\)? Enumérelos.
<details><summary>Respuesta</summary><p>9: un 3s, tres 3p y cinco 3d.</p></details></li>
<li><span class="lvl">Básico</span>Exprese en eV y en Ry la energía del estado 2p del He⁺.
<details><summary>Respuesta</summary><p>\(E=-4/(2\cdot4)=-0.5\) Ha \(=-13.6\) eV \(=-1\) Ry.</p></details></li>
<li><span class="lvl">Intermedio</span>Compruebe que \(\psi_{100}=\ee^{-r/a_0}/\sqrt{\pi a_0^3}\) está normalizada y que \(\expval r=\frac32a_0\).
<details><summary>Respuesta</summary><p>\(\int_0^\infty4\pi r^2\frac{\ee^{-2r/a_0}}{\pi a_0^3}\dd r=\frac{4}{a_0^3}\cdot\frac{2a_0^3}{8}=1\); \(\expval r=\frac4{a_0^3}\cdot\frac{6a_0^4}{16}=\frac32a_0\).</p></details></li>
<li><span class="lvl">Intermedio</span>¿Cuál es el mínimo valor posible del ángulo entre \(\vb L\) y el eje \(z\) para \(l=2\)?
<details><summary>Respuesta</summary><p>\(\cos\theta=m/\sqrt{l(l+1)}=2/\sqrt6\) → \(\theta=35.3^\circ\).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que para \(l=n-1\) la densidad radial \(r^2R^2\) tiene su máximo en \(r=n^2a_0/Z\), el radio de Bohr.
<details><summary>Respuesta</summary><p>\(R_{n,n-1}\propto r^{n-1}\ee^{-Zr/na_0}\); \(P\propto r^{2n}\ee^{-2Zr/na_0}\), \(P'=0\Rightarrow 2n/r=2Z/(na_0)\).</p></details></li>
</ol>
</section>
