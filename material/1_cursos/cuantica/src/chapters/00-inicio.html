    <h1 class="home-title">De la cuántica al nanoporo<span>mecánica cuántica, mecánica estadística y DFT para entender hBN-MC</span></h1>
    <p class="home-lead">Todo lo que hay detrás de un simulador de nanoporos en nitruro de boro hexagonal, construido desde cero: la función de onda, los átomos y el enlace químico, las bandas del grafeno y del h-BN, la teoría del funcional de la densidad que calcula SIESTA, la estadística de Boltzmann y el algoritmo de Metropolis. Cada idea se explica con palabras sencillas, se formaliza con sus ecuaciones y se pone a prueba en una simulación validada.</p>
    <div class="maxwell-strip" aria-label="Cuatro ecuaciones que recorren el curso">
      <div><small>Schrödinger</small>\[\op{H}\,\psi=E\,\psi\]</div>
      <div><small>Kohn–Sham</small>\[\Big[-\tfrac12\lap+v_s[n](\vb r)\Big]\phi_i=\varepsilon_i\,\phi_i\]</div>
      <div><small>Boltzmann</small>\[p_i=\frac{\ee^{-E_i/\kB T}}{Z}\]</div>
      <div><small>Metropolis</small>\[P_{\text{acep}}=\min\!\big(1,\ee^{-\Delta E/\kB T}\big)\]</div>
    </div>
    <p class="home-count ctrl-note" style="margin-top:14px;font-size:13px"></p>
    <p class="home-author"><small>Elaborado por</small><b>Mg. Manuel Alejandro Obando</b><span>Departamento de Física · Universidad del Cauca</span></p>
  </div>
  <div class="home-live">
    <div class="sim" data-sim="home-hero" data-num="En vivo" data-title="El Hamiltoniano de hBN-MC en acción: nanoporo triangular con borde de nitrógeno, 6 500 K, Δμ<sub>H</sub> = −1.5 eV"></div>
