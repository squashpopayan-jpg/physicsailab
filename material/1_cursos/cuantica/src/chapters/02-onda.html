<template class="chapter-src" data-id="onda" data-num="2" data-title="La función de onda" data-part="Parte I · Fundamentos de la mecánica cuántica" data-short="Regla de Born, valores esperados, operadores, paquetes de onda, incertidumbre y ecuación de Schrödinger">
<p class="lead">En mecánica clásica, el estado de una partícula se da con su posición y su velocidad. En mecánica cuántica se da con una función compleja, la función de onda \(\psi(x,t)\), que no dice dónde está la partícula sino con qué probabilidad se la encontrará en cada lugar. Este capítulo define esa función, enseña a extraer de ella números medibles y presenta la ecuación que la hace evolucionar.</p>

<section>
<h2>La función de onda y la regla de Born</h2>
<div class="box def"><p>El estado de una partícula en una dimensión se describe con una <span class="term">función de onda</span> \(\psi(x,t)\), en general compleja. Según la <span class="term">regla de Born</span> (1926), la probabilidad de encontrar la partícula entre \(x\) y \(x+\dd x\) en el instante \(t\) es</p>
<div class="eq key" data-name="Regla de Born">\[\dd P=|\psi(x,t)|^2\,\dd x=\psi^*(x,t)\,\psi(x,t)\,\dd x .\]</div>
<p>\(|\psi|^2\) es una <em>densidad de probabilidad</em> (unidades de 1/longitud en 1D, 1/volumen en 3D).</p></div>
<p>Como la partícula tiene que estar en algún lugar, la probabilidad total es uno: la función de onda debe estar <span class="term">normalizada</span>,</p>
<div class="eq key" data-name="Normalización">\[\int_{-\infty}^{\infty}|\psi(x,t)|^2\,\dd x=1 .\]</div>
<p>Si una función no está normalizada, basta multiplicarla por una constante. Multiplicar \(\psi\) por un factor de fase \(\ee^{i\alpha}\) no cambia ninguna probabilidad: la fase global no es observable. Las fases <em>relativas</em> entre partes de la función de onda sí lo son, y producen la interferencia que vimos en la doble rendija.</p>
<div class="box ex">
<h4>Normalizar y calcular una probabilidad</h4>
<p>Una partícula en un segmento \(0\le x\le L\) tiene \(\psi(x)=A\sen(\pi x/L)\) y \(\psi=0\) fuera. Halle \(A\) y la probabilidad de encontrarla en el tercio central.</p>
<details><summary>Solución</summary>
<p>\(\int_0^LA^2\sen^2(\pi x/L)\,\dd x=A^2L/2=1\Rightarrow A=\sqrt{2/L}\). La probabilidad en \([L/3,2L/3]\) es \(\frac2L\int_{L/3}^{2L/3}\sen^2(\pi x/L)\dd x=\frac13+\frac{\sqrt3}{2\pi}=0.609\). Un 61 % en el tercio central, frente al 33 % de una partícula clásica que rebota con rapidez constante.</p>
</details>
</div>
<div class="box explain"><p>La función de onda es como el mapa de probabilidad de lluvia del pronóstico del tiempo: dice en qué zonas es más probable que llueva, pero cada día llueve en sitios concretos. Una medida de posición es «un día»: da un punto. Solo repitiendo muchas veces el mismo experimento se reconstruye el mapa.</p></div>
</section>

<section>
<h2>Valores esperados y operadores</h2>
<p>Si medimos la posición de muchas partículas preparadas en el mismo estado, el promedio de los resultados es el <span class="term">valor esperado</span></p>
<div class="eq">\[\expval{x}=\int x\,|\psi|^2\,\dd x,\qquad \expval{x^2}=\int x^2|\psi|^2\,\dd x,\qquad \sigma_x=\Delta x=\sqrt{\expval{x^2}-\expval{x}^2}.\]</div>
<p>¿Y el momento? No podemos escribir \(\int p|\psi|^2\dd x\) porque no conocemos \(p\) en función de \(x\). La respuesta la da la <span class="term">onda plana</span> de de Broglie, \(\psi=\ee^{i(kx-\omega t)}\) con \(p=\hbar k\): derivar respecto de \(x\) multiplica por \(ik\), así que \(-i\hbar\,\partial\psi/\partial x=\hbar k\,\psi=p\,\psi\). Esto sugiere representar el momento por un <span class="term">operador</span> diferencial:</p>
<div class="eq key" data-name="Operadores de posición, momento y energía">\[\op x=x,\qquad \op p=-i\hbar\pdv{}{x},\qquad \op H=\frac{\op p^{\,2}}{2m}+V(x)=-\frac{\hbar^2}{2m}\pdv{^2}{x^2}+V(x).\]</div>
<p>El valor esperado de cualquier magnitud \(Q\) se obtiene «emparedando» su operador entre \(\psi^*\) y \(\psi\):</p>
<div class="eq key" data-name="Valor esperado">\[\expval{Q}=\int\psi^*(x)\,\op Q\,\psi(x)\,\dd x .\]</div>
<p>El operador \(\op H\) se llama <span class="term">hamiltoniano</span>: su valor esperado es la energía media. Toda la mecánica cuántica de átomos, moléculas y sólidos consiste en escribir el hamiltoniano correcto y extraer información de él.</p>
<div class="box ex">
<h4>Momento medio de un paquete</h4>
<p>Para \(\psi(x)=g(x)\,\ee^{ik_0x}\) con \(g\) real y normalizada, calcule \(\expval{p}\).</p>
<details><summary>Solución</summary>
<p>\(\op p\psi=-i\hbar(g'+ik_0g)\ee^{ik_0x}\). Entonces \(\expval p=\int g(-i\hbar g'+\hbar k_0g)\dd x=-i\hbar\int gg'\dd x+\hbar k_0\). El primer término es \(-\tfrac{i\hbar}{2}[g^2]_{-\infty}^{\infty}=0\). Resultado: \(\expval p=\hbar k_0\). La fase \(\ee^{ik_0x}\) es lo que codifica el movimiento; una función de onda real tiene momento medio cero.</p>
</details>
</div>
</section>

<section>
<h2>Ondas planas y paquetes de onda</h2>
<p>Una onda plana \(\ee^{i(kx-\omega t)}\) tiene momento bien definido, \(p=\hbar k\), y energía \(E=\hbar\omega=\hbar^2k^2/2m\), pero \(|\psi|^2=1\) en todas partes: la partícula está igualmente repartida por todo el espacio y la función no se puede normalizar. Para describir una partícula localizada se superponen ondas planas con distintos \(k\):</p>
<div class="eq key" data-name="Paquete de ondas (transformada de Fourier)">\[\psi(x,t)=\frac{1}{\sqrt{2\pi}}\int_{-\infty}^{\infty}\phi(k)\,\ee^{i(kx-\omega(k)t)}\,\dd k,\qquad \phi(k)=\frac{1}{\sqrt{2\pi}}\int\psi(x,0)\,\ee^{-ikx}\,\dd x .\]</div>
<p>\(\phi(k)\) es la función de onda en el espacio de momentos: \(|\phi(k)|^2\) es la densidad de probabilidad de que \(p=\hbar k\). El <span class="term">teorema de Parseval</span> garantiza que si \(\psi\) está normalizada también lo está \(\phi\).</p>
<p>Cada onda plana viaja con su <span class="term">velocidad de fase</span> \(\omega/k=\hbar k/2m\), pero el paquete como un todo se mueve con la <span class="term">velocidad de grupo</span></p>
<div class="eq">\[v_g=\odv{\omega}{k}=\frac{\hbar k_0}{m}=\frac{p}{m},\]</div>
<p>que es exactamente la velocidad clásica. Así se recupera la mecánica de Newton en promedio.</p>
<div class="sim" data-sim="paquete-fourier" data-title="Construir un paquete sumando ondas planas"></div>
<div class="sim-guide"><ul>
<li>Con una sola onda (N = 1) la partícula está en todas partes. Al sumar más ondas, el paquete se concentra.</li>
<li>Reduzca la dispersión en \(k\): el paquete se ensancha en \(x\). El producto \(\Delta x\,\Delta k\) nunca baja de ½.</li>
<li>Con pocas ondas el paquete se repite periódicamente: se necesitan infinitas ondas con \(k\) continuo para un paquete único.</li>
</ul></div>
</section>

<section>
<h2>El principio de incertidumbre</h2>
<p>La construcción anterior contiene un resultado general de las transformadas de Fourier: una función estrecha en \(x\) necesita un rango amplio de \(k\), y viceversa. Con \(p=\hbar k\), esto se convierte en el <span class="term">principio de incertidumbre de Heisenberg</span>:</p>
<div class="eq key" data-name="Principio de incertidumbre">\[\Delta x\,\Delta p\ \ge\ \frac{\hbar}{2}.\]</div>
<p>La igualdad se alcanza con el paquete gaussiano \(\psi\propto\ee^{-x^2/4\sigma^2}\ee^{ik_0x}\), para el cual \(\Delta x=\sigma\) y \(\Delta p=\hbar/2\sigma\). No se trata de una limitación de los instrumentos: la partícula no <em>tiene</em> simultáneamente posición y momento definidos.</p>
<h3>La incertidumbre fija el tamaño de los átomos</h3>
<p>Confinar un electrón en una región de tamaño \(a\) le da un momento de al menos \(\hbar/2a\) y una energía cinética del orden de \(\hbar^2/(2m_ea^2)\). Para el hidrógeno, la energía total aproximada \(E(a)\approx\frac{\hbar^2}{2m_ea^2}-\frac{e^2}{4\pi\eo a}\) tiene un mínimo en \(a=a_0=0.53\) Å con \(E=-13.6\) eV: el resultado exacto. El electrón no cae al núcleo porque confinarlo más le costaría demasiada energía cinética. Esta competencia entre energía cinética de confinamiento y atracción eléctrica decide también la longitud de los enlaces químicos.</p>
<div class="box explain"><p>En música, un golpe seco de tambor (muy corto en el tiempo) contiene muchísimas frecuencias; una nota pura y afinada necesita sonar un buen rato. No se puede tener a la vez un sonido instantáneo y una frecuencia exacta. Con los electrones pasa igual entre posición y momento.</p></div>
</section>

<section>
<h2>La ecuación de Schrödinger</h2>
<p>La evolución de la función de onda obedece la <span class="term">ecuación de Schrödinger dependiente del tiempo</span> (1926). Puede motivarse aplicando los operadores anteriores a la relación clásica \(E=p^2/2m+V\), con \(E\to i\hbar\,\partial/\partial t\):</p>
<div class="eq key" data-name="Ecuación de Schrödinger">\[i\hbar\,\pdv{\psi}{t}=\op H\psi=-\frac{\hbar^2}{2m}\pdv{^2\psi}{x^2}+V(x)\,\psi .\]</div>
<p>Es una ecuación lineal: si \(\psi_1\) y \(\psi_2\) son soluciones, cualquier combinación \(c_1\psi_1+c_2\psi_2\) también lo es (<span class="term">principio de superposición</span>). Es de primer orden en el tiempo: conocida \(\psi(x,0)\), queda determinado todo el futuro. La aleatoriedad cuántica no está en la evolución, que es determinista, sino en el resultado de las medidas.</p>
<h3>Conservación de la probabilidad</h3>
<p>Derivando \(|\psi|^2\) respecto del tiempo y usando la ecuación de Schrödinger se obtiene una <span class="term">ecuación de continuidad</span>, como la de la carga eléctrica:</p>
<div class="eq key" data-name="Corriente de probabilidad">\[\pdv{|\psi|^2}{t}+\pdv{j}{x}=0,\qquad j(x,t)=\frac{\hbar}{m}\Ima\!\left(\psi^*\pdv{\psi}{x}\right).\]</div>
<p>La probabilidad no se crea ni se destruye: fluye. En consecuencia, una función de onda normalizada sigue normalizada en todo instante. Un método numérico que respete esta propiedad (como el de Crank–Nicolson que usa la simulación) se llama <span class="term">unitario</span>.</p>
<h3>El paquete libre se ensancha</h3>
<p>Para \(V=0\) y un paquete gaussiano inicial de anchura \(\sigma_0\), la solución exacta se mantiene gaussiana, su centro avanza con \(v_g=\hbar k_0/m\) y su anchura crece:</p>
<div class="eq key" data-name="Dispersión del paquete gaussiano">\[\sigma(t)=\sigma_0\sqrt{1+\left(\frac{\hbar t}{2m\sigma_0^2}\right)^2}.\]</div>
<p>Cuanto más localizado está el paquete al principio, más rápido se ensancha: las componentes de \(k\) muy distintas viajan a velocidades muy distintas. Un electrón localizado en 1 Å duplica su anchura en menos de un femtosegundo.</p>
<div class="sim" data-sim="paquete-libre" data-title="Evolución de un paquete de ondas (Crank–Nicolson)"></div>
<div class="sim-guide"><ul>
<li>Observe los colores: codifican la fase de \(\psi\). En el frente del paquete la fase cambia más rápido: allí están los \(k\) grandes, que se adelantan.</li>
<li>Compare la anchura numérica con la fórmula exacta; la norma se mantiene en 1 con precisión de máquina.</li>
<li>Con la pared, el paquete se refleja e interfiere consigo mismo: aparecen franjas cerca de la pared.</li>
</ul></div>
<div class="box valid"><p>El apéndice B verifica que el integrador de Crank–Nicolson conserva la norma con error menor que \(10^{-12}\) tras 1000 pasos, que la anchura del paquete libre en \(t=5\) coincide con la fórmula exacta con error menor que 0.2 % (la diferencia se debe a la discretización espacial), y que un paquete gaussiano cumple \(\Delta x\,\Delta p=\hbar/2\) con error menor que \(10^{-6}\).</p></div>
</section>

<section>
<h2>Medir: muestrear la densidad de probabilidad</h2>
<p>Una única medida de posición da un solo número, imposible de predecir. Lo que la teoría predice es la <em>distribución</em> de resultados. Si se preparan \(N\) sistemas idénticos y se mide la posición en cada uno, el histograma de resultados tiende a \(|\psi(x)|^2\) y el promedio tiende a \(\expval{x}\), con una incertidumbre estadística que disminuye como \(\sigma_x/\sqrt N\).</p>
<div class="sim" data-sim="medida-posicion" data-title="Medidas repetidas de la posición"></div>
<div class="sim-guide"><ul>
<li>Con 10 medidas el histograma no se parece a \(|\psi|^2\); con 10 000 lo reproduce muy bien.</li>
<li>En el estado \(n=2\) de la caja nunca se encuentra la partícula en el centro (nodo), aunque el valor esperado de \(x\) está justo allí.</li>
<li>La superposición \((\psi_1+\psi_2)/\sqrt2\) no es simétrica: el promedio se aleja del centro.</li>
</ul></div>
<div class="box hbn"><p>La magnitud central de la teoría del funcional de la densidad (capítulos 15–18) es precisamente una densidad de probabilidad: la <span class="term">densidad electrónica</span> \(n(\vb r)=\sum_i|\psi_i(\vb r)|^2\), el número de electrones por unidad de volumen. SIESTA la calcula para cada una de las estructuras cuyas energías se usaron para ajustar los parámetros \(\varepsilon_{\alpha\beta}\) de hBN-MC.</p></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>El estado es una función compleja \(\psi\); \(|\psi|^2\) es la densidad de probabilidad y debe integrar 1.</li>
<li>Las magnitudes medibles son operadores: \(\op p=-i\hbar\,\partial_x\), \(\op H=-\frac{\hbar^2}{2m}\partial_x^2+V\); su promedio es \(\int\psi^*\op Q\psi\,\dd x\).</li>
<li>Un paquete de ondas es una suma de ondas planas; se mueve con la velocidad de grupo \(p/m\).</li>
<li>\(\Delta x\,\Delta p\ge\hbar/2\): localizar cuesta energía cinética; eso da tamaño a átomos y enlaces.</li>
<li>\(i\hbar\,\partial_t\psi=\op H\psi\) es lineal, determinista y conserva la probabilidad.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Normalice \(\psi(x)=A\,\ee^{-|x|/a}\) y halle la probabilidad de encontrar la partícula en \(|x|\lt a\).
<details><summary>Respuesta</summary><p>\(A=1/\sqrt a\); \(P=1-\ee^{-2}=0.865\).</p></details></li>
<li><span class="lvl">Básico</span>Para el estado fundamental de la caja, calcule \(\expval{x}\) y \(\expval{p}\).
<details><summary>Respuesta</summary><p>\(\expval x=L/2\) por simetría; \(\expval p=0\) porque \(\psi\) es real.</p></details></li>
<li><span class="lvl">Intermedio</span>Un electrón está localizado en \(\Delta x=1\) Å. Estime la mínima dispersión de su energía cinética en eV.
<details><summary>Respuesta</summary><p>\(\Delta p\ge\hbar/2\Delta x\), \(K\sim(\Delta p)^2/2m=\hbar^2/(8m\Delta x^2)=0.95\) eV.</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que la corriente de probabilidad de una onda plana \(A\ee^{ikx}\) es \(j=|A|^2\hbar k/m\) e interprétela.
<details><summary>Respuesta</summary><p>\(\psi^*\psi'=ik|A|^2\), \(j=\frac\hbar m k|A|^2=\) densidad × velocidad.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Cuánto tarda en duplicar su anchura un paquete de electrón con \(\sigma_0=1\) Å? ¿Y una partícula de polvo de \(10^{-15}\) kg con \(\sigma_0=1\) µm?
<details><summary>Respuesta</summary><p>\(t=2\sqrt3\,m\sigma_0^2/\hbar\): electrón \(3.0\times10^{-16}\) s; polvo \(3.3\times10^{7}\) s (más de un año).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre la ecuación de continuidad a partir de la ecuación de Schrödinger y su conjugada.
<details><summary>Respuesta</summary><p>\(\partial_t|\psi|^2=\psi^*\dot\psi+\psi\dot\psi^*=\frac{i\hbar}{2m}(\psi^*\psi''-\psi\psi^{*\prime\prime})=-\partial_x\big[\frac{\hbar}{2mi}(\psi^*\psi'-\psi\psi^{*\prime})\big]\) y el corchete es \(j\); el potencial real se cancela.</p></details></li>
</ol>
</section>
