<template class="chapter-src" data-id="azar" data-num="46" data-world="10" data-title="El azar y el caos" data-short="Monedas, dados, campanas, el efecto mariposa y por qué algunas cosas son imposibles de predecir.">
<p class="lead">¿Puede la física predecir el resultado de lanzar una moneda? ¿Y el clima de dentro de un mes? Algunas cosas ocurren por <strong>azar</strong>, y otras son tan sensibles a pequeños cambios que son prácticamente imposibles de predecir: eso es el <strong>caos</strong>. Pero incluso del azar sale un orden asombroso.</p>

<div class="learn"><ul>
<li>Un solo evento aleatorio es impredecible, pero muchos juntos siguen un patrón.</li>
<li>La ley de los grandes números: con muchas repeticiones, las frecuencias se acercan a las probabilidades.</li>
<li>La curva en forma de campana aparece cuando se suman muchos pequeños azares.</li>
<li>En el caos, cambios minúsculos al principio llevan a resultados totalmente distintos.</li>
</ul></div>

<div class="say" data-who="terra" data-mood="think"><p>Cuando lanzas una moneda no sabes qué saldrá… pero si la lanzas diez mil veces, ¡sabes casi seguro que unas cinco mil serán cara! Hay un orden escondido en el desorden. ¡Vamos a verlo!</p></div>

<section>
<h2>Las monedas y la ley de los grandes números</h2>
<p>Una moneda honesta tiene la misma probabilidad de salir cara o sello: 1/2. Pero eso no significa que si lanzas 10 veces saldrán exactamente 5 caras. Con pocas tiradas, los resultados se alejan mucho de la mitad (a veces 8 caras, o incluso 10). Con muchísimas tiradas, la proporción se va acercando a 1/2. Esta idea se llama la <dfn data-def="Cuando repites algo al azar muchísimas veces, la proporción de resultados se acerca a su probabilidad.">ley de los grandes números</dfn>.</p>
<div class="fact"><p>La moneda <b>no tiene memoria</b>: si ya salieron 5 caras seguidas, la siguiente tiene otra vez 50 % de salir cara. Creer que «ya le toca sello» es un error muy común, llamado la falacia del jugador.</p></div>
<div class="sim" data-sim="monedas" data-title="Lanza monedas" data-goal="Lanza muchas monedas y mira cómo la proporción de caras se acerca al 50 %. ¡Llega a más de 2000 lanzamientos!">
<ul><li>Con 10 lanzamientos la proporción oscila mucho.</li><li>Con 1000 o más, se acerca a la mitad.</li></ul>
</div>
</section>

<section>
<h2>La campana: el tablero de Galton</h2>
<p>Imagina bolitas que caen por un tablero con clavos: en cada clavo, la bolita va a la izquierda o a la derecha con la misma probabilidad. Es imposible saber por dónde pasará una bolita en particular, pero cuando caen cientos, se forma una pila en forma de <b>campana</b>: muchas en el centro y pocas en los extremos. Es la <dfn data-def="Una curva en forma de campana que aparece cuando se suman muchos pequeños efectos al azar.">distribución normal</dfn>, y aparece por todas partes: en las estaturas de las personas, en los errores de las medidas, en las notas de un examen.</p>
<div class="sim" data-sim="galton" data-title="El tablero de Galton" data-goal="Suelta al menos 200 bolitas con probabilidad del 50 % y mira cómo se forma la campana.">
<ul><li>Con probabilidad 50 %, la campana queda centrada.</li><li>Si cambias la probabilidad hacia un lado, la campana se desplaza.</li></ul>
</div>
<details class="curious"><p>El tablero de Galton se debe al inglés Francis Galton (siglo XIX). La forma de campana la describió matemáticamente Carl Friedrich Gauss. El resultado general se llama «teorema del límite central»: al sumar muchas variables aleatorias independientes, el resultado tiende a una distribución normal. También explica por qué la presión de un gas es tan estable: ¡es la suma de los choques de billones de moléculas!</p></details>
<div class="story" data-title="El baile de las partículas"><p>En 1827, el botánico Robert Brown vio que los granitos de polen en el agua se movían sin parar de forma errática. Pensó que estaban vivos, pero también se movían partículas de roca. En 1905, Einstein explicó que las moléculas de agua, invisibles, empujan a los granitos desde todos lados al azar. Con eso se probó que los átomos existen. Es el <b>movimiento browniano</b>: una caminata al azar.</p></div>
</section>

<section>
<h2>El caos: el efecto mariposa</h2>
<p>Un péndulo simple es muy predecible. Pero si cuelgas un péndulo de otro péndulo (un <b>péndulo doble</b>), su movimiento se vuelve ¡una locura! Aunque todo se rige por leyes exactas, <b>una diferencia diminuta al empezar</b> se agranda rapidísimo, y al cabo de unos segundos los dos péndulos casi idénticos hacen cosas totalmente distintas. A eso se le llama <dfn data-def="Cuando un pequeño cambio inicial produce enormes diferencias después, haciendo imposible la predicción a largo plazo.">caos</dfn>.</p>
<div class="story" data-title="La mariposa de Lorenz"><p>En 1961, el meteorólogo Edward Lorenz repitió una simulación del clima con un número redondeado (0,506 en vez de 0,506127). ¡Y el resultado fue totalmente distinto! Descubrió que el clima es caótico: un pequeño cambio puede crecer mucho. Se hizo famosa la imagen: el aleteo de una mariposa en Brasil podría cambiar un tornado en Texas. Por eso el pronóstico del tiempo es bueno para unos días, pero imposible para meses.</p></div>
<div class="sim" data-sim="pendulo-doble" data-title="El péndulo doble y la mariposa" data-goal="Suelta dos péndulos dobles casi idénticos (con 0,06° de diferencia) desde un ángulo grande y mira cómo se separan. Luego prueba con un ángulo pequeño.">
<ul><li>Con ángulos pequeños, los dos péndulos siguen juntos.</li><li>Con ángulos grandes, se separan por completo: ¡caos!</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="50 lanzamientos de moneda" data-time="15 min" data-level="1">
<ul class="mat"><li>🪙 Una moneda</li><li>📝 Papel y lápiz</li></ul>
<ol class="steps"><li>Lanza la moneda 10 veces y anota cuántas caras salen. Repite 5 veces.</li><li>Ahora lanza 50 veces y cuenta las caras.</li><li>Compara: ¿qué tanto se alejan de la mitad los resultados de 10 lanzamientos, comparado con los de 50?</li></ol>
<p class="predict">¿Con cuál serie estará la proporción de caras más cerca de la mitad?</p>
<p class="result">Con 10 lanzamientos salen resultados como 3, 7, 4 y hasta 8 caras. Con 50 lanzamientos, casi siempre salen entre 20 y 30 caras: más cerca de la mitad.</p>
<p class="why">Con pocas tiradas, el azar domina. Con muchas, las desviaciones se compensan y aparece el promedio: eso es la ley de los grandes números.</p>
</div>
<div class="exp" data-title="La caminata del borracho" data-time="20 min" data-level="1">
<ul class="mat"><li>🎲 Un dado (o una moneda)</li><li>🧱 Un piso con baldosas (o una hoja cuadriculada)</li><li>🖍️ Tiza o lápiz</li></ul>
<ol class="steps"><li>Párate en una baldosa (o dibuja un punto en el centro de la hoja).</li><li>Lanza el dado: 1–2 = un paso adelante, 3–4 = atrás, 5 = derecha, 6 = izquierda.</li><li>Haz 30 pasos, marcando cada baldosa o dibujando el camino.</li><li>Mide qué tan lejos terminaste del punto de partida. Repite 3 veces.</li></ol>
<p class="predict">Después de 30 pasos, ¿cuánto crees que te alejarás del inicio?</p>
<p class="result">Casi nunca te alejas 30 pasos: normalmente terminas a unos 5 o 6 pasos del inicio. Y los tres caminos terminan en lugares distintos.</p>
<p class="why">Los pasos hacia un lado y hacia otro se compensan en gran parte: la distancia típica crece como la raíz cuadrada del número de pasos (√30 ≈ 5,5). Así se mueven las moléculas en el movimiento browniano.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>Una moneda salió cara 5 veces seguidas. ¿Qué probabilidad hay de cara en el siguiente lanzamiento?</p><ol><li>Menos del 50 %</li><li>50 %</li><li>Más del 50 %</li></ol><p class="why">La moneda no tiene memoria: cada lanzamiento es independiente.</p></div>
<div class="q" data-ans="0"><p>Lanzas una moneda muchísimas veces. ¿Qué proporción de caras esperas?</p><ol><li>Cerca de la mitad</li><li>Siempre exactamente la mitad</li><li>Muy lejos de la mitad</li></ol><p class="why">Con muchos lanzamientos, la proporción se acerca a 1/2, pero casi nunca es exactamente 1/2.</p></div>
<div class="q" data-ans="2"><p>¿Qué forma aparece en el tablero de Galton?</p><ol><li>Un cuadrado</li><li>Una línea recta</li><li>Una campana</li></ol><p class="why">La distribución normal: muchas bolitas al centro y pocas en los extremos.</p></div>
<div class="q" data-ans="1"><p>En un sistema caótico, un cambio minúsculo en el inicio…</p><ol><li>No cambia nada</li><li>Puede cambiar muchísimo el resultado</li><li>Mejora la predicción</li></ol><p class="why">Es el efecto mariposa: las pequeñas diferencias se amplifican.</p></div>
</div>
