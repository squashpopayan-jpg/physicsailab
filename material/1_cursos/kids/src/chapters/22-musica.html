<template class="chapter-src" data-id="musica" data-num="22" data-world="5" data-title="La física de la música" data-short="Notas, cuerdas, flautas de botellas y pulsos: por qué un instrumento suena como suena.">
<p class="lead">La música es física que se disfruta. Cada nota tiene una frecuencia, cada instrumento vibra a su manera, y hasta las cuerdas de una guitarra siguen reglas exactas. ¡Vamos a afinar instrumentos con física!</p>

<div class="learn"><ul>
<li>Cada nota musical es una frecuencia: Do, Re, Mi, Fa, Sol, La, Si.</li>
<li>Una cuerda más corta, más tensa o más delgada suena más aguda.</li>
<li>Una columna de aire más corta suena más aguda.</li>
<li>Cada instrumento tiene su timbre: su «color» de sonido.</li>
</ul></div>

<div class="say" data-who="eco" data-mood="wink"><p>¡Atención, músicos! Hoy soy el director de la orquesta de la física. ¿Listo para afinar? Recuerda tener el sonido activado (🔊).</p></div>

<section>
<h2>Las notas y las octavas</h2>
<p>Una nota musical es una <strong>frecuencia</strong>. La nota «La» que se usa para afinar (la de los diapasones) vibra 440 veces por segundo: 440 Hz. Si doblas la frecuencia (880 Hz) obtienes de nuevo un La, pero más agudo: está <em>una octava</em> arriba. Entre un La y el siguiente caben siete notas: Do, Re, Mi, Fa, Sol, La, Si.</p>
<div class="story" data-title="Pitágoras y las cuerdas"><p>Hace unos 2500 años, en Grecia, Pitágoras (o sus seguidores) descubrió que una cuerda que mide la mitad de largo suena una octava más aguda, y que las cuerdas con longitudes en proporciones sencillas (2:3, 3:4) suenan bien juntas. Fue una de las primeras veces en que se vio que la música y los números están conectados.</p></div>

<h3>Las cuerdas</h3>
<p>En una guitarra o un violín, el sonido sale de una cuerda que vibra. Su frecuencia depende de tres cosas:</p>
<ul><li><b>Largo:</b> más corta, más aguda (por eso los guitarristas presionan el traste).</li><li><b>Tensión:</b> más tensa, más aguda (por eso se aprietan las clavijas para afinar).</li><li><b>Grosor:</b> más gruesa, más grave (por eso los bajos tienen cuerdas gordas).</li></ul>
<div class="sim" data-sim="cuerda-guitarra" data-title="Afina la cuerda" data-goal="Cambia el largo, la tensión o el grosor hasta que la cuerda suene un La (440 Hz). ¡Pulsa para escucharla!">
<ul><li>Acorta la cuerda con la barra: sube la frecuencia.</li><li>Cambia a una cuerda más gruesa y verás que baja.</li></ul>
</div>
<details class="curious"><p>La frecuencia fundamental de una cuerda es f = (1 / 2L)·√(T / μ), donde L es el largo, T la tensión y μ la masa por metro. Además de la fundamental, la cuerda vibra con múltiplos (2f, 3f, 4f…) llamados armónicos. La mezcla de armónicos es lo que le da su timbre a cada instrumento.</p></details>
</section>

<section>
<h2>Los vientos: columnas de aire</h2>
<p>En una flauta, una trompeta o una botella en la que soplas, lo que vibra es el <strong>aire</strong> dentro del tubo. Mientras más corta es la columna de aire, más aguda es la nota. Si le pones agua a una botella, la columna de aire se acorta y el sonido de soplar sube: ¡más agua, más agudo! (Pero si la golpeas con una cuchara, ocurre lo contrario: ¡más agua, más grave!, porque lo que vibra es el vidrio con el agua.)</p>
<div class="sim" data-sim="flauta-botellas" data-title="La flauta de botellas" data-goal="Pon agua en cada botella para afinarla a su nota: Do, Re, Mi, Sol y La.">
<ul><li>Selecciona una botella, mueve el nivel del agua y presiona «Soplar».</li><li>El Do necesita más aire (menos agua) y el La menos aire (más agua).</li></ul>
</div>
</section>

<section>
<h2>Los pulsos: afinando de oído</h2>
<p>Cuando dos notas casi iguales suenan juntas, se oye un «wuaa-wuaa-wuaa» que sube y baja de volumen. Esos son los <dfn data-def="Las subidas y bajadas de volumen que se oyen cuando suenan juntas dos notas de frecuencias muy parecidas.">pulsos</dfn>. Mientras más parecidas son las frecuencias, más lentos son los pulsos. Cuando son exactamente iguales, ¡los pulsos desaparecen! Así afinan los músicos de oído.</p>
<div class="sim" data-sim="pulsos" data-title="Afinación por pulsos" data-goal="Mueve la segunda cuerda hasta que desaparezcan los pulsos: estará afinada con la primera.">
<ul><li>Los pulsos por segundo son la diferencia entre las dos frecuencias.</li><li>Con 440 Hz y 443 Hz oyes 3 pulsos por segundo.</li></ul>
</div>
</section>

<section>
<h2>¿Por qué cada instrumento suena distinto?</h2>
<p>Un violín y una flauta pueden tocar la misma nota, y aun así los reconoces. Esa diferencia se llama <strong>timbre</strong>. Cada instrumento produce, junto con la nota principal, muchas notas más suaves y más agudas llamadas armónicos, en cantidades distintas. Es su «huella digital» sonora. Tu voz también tiene un timbre único: por eso reconoces a tu mamá por teléfono.</p>
<div class="cols3">
<div class="card"><div class="big-emoji">🎻</div><h4>Cuerdas</h4><p>Guitarra, violín, arpa, tiple, cuatro. La cuerda vibra y una caja de madera amplifica el sonido.</p></div>
<div class="card"><div class="big-emoji">🎺</div><h4>Vientos</h4><p>Flauta, quena, trompeta, saxofón. Vibra el aire dentro de un tubo.</p></div>
<div class="card"><div class="big-emoji">🥁</div><h4>Percusión</h4><p>Tambor, marimba, maracas. Vibra una piel o una barra al golpearla.</p></div>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="El xilófono de vasos con agua" data-time="20 min" data-level="1">
<ul class="mat"><li>🥛 Cinco vasos o frascos de vidrio iguales</li><li>💧 Agua</li><li>🥄 Una cuchara de metal</li></ul>
<ol class="steps"><li>Alinea los vasos. Pon en cada uno distinta cantidad de agua: vacío, un cuarto, la mitad, tres cuartos y casi lleno.</li><li>Golpea suavemente cada vaso con la cuchara y escucha el tono.</li><li>Ajusta el agua para formar una escala que suba (Do-Re-Mi…). Intenta tocar una canción sencilla.</li></ol>
<p class="predict">¿El vaso con más agua sonará más agudo o más grave?</p>
<p class="result">El vaso con más agua suena más grave; el vacío suena más agudo.</p>
<p class="why">Con más agua, la masa que vibra es mayor, y lo más pesado vibra más despacio. Pero si soplas sobre la boca de una botella, el tono sube con más agua, porque se acorta la columna de aire.</p>
</div>
<div class="exp" data-title="La guitarra de ligas" data-time="20 min" data-level="1">
<ul class="mat"><li>📦 Una caja de zapatos sin tapa</li><li>➰ 4 ligas de distinto grosor</li><li>✏️ Dos lápices</li></ul>
<ol class="steps"><li>Estira las ligas sobre la caja, a lo ancho del hueco, una al lado de la otra.</li><li>Pon un lápiz debajo de las ligas en cada extremo para que queden elevadas.</li><li>Puntea cada liga y escucha. Después estira una con más fuerza, o presiona un punto con el dedo para acortarla.</li></ol>
<p class="predict">¿Qué liga sonará más aguda: la gruesa o la delgada?</p>
<p class="result">La liga delgada y más tensa suena más aguda. La gruesa suena más grave. Si la acortas con el dedo, sube el tono.</p>
<p class="why">Más delgada, más tensa y más corta significa más vibraciones por segundo: una nota más aguda. Son las mismas reglas de la guitarra.</p>
</div>
</section>

<div class="q" data-ans="1"><p>Una cuerda se acorta a la mitad. ¿Qué pasa con la nota?</p><ol><li>Suena más grave</li><li>Suena una octava más aguda</li><li>No cambia</li></ol><p class="why">La mitad del largo duplica la frecuencia: una octava más aguda.</p></div>
<div class="q" data-ans="0"><p>Dos notas casi iguales suenan juntas y oyes «wuaa-wuaa». ¿Qué son?</p><ol><li>Pulsos</li><li>Ecos</li><li>Armónicos</li></ol><p class="why">Son pulsos, y desaparecen cuando las frecuencias son iguales.</p></div>
