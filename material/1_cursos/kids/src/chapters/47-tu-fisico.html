<section>

<tr><td>💧 Agua y aire · Gotín</td><td>Fluidos</td><td>Flota lo menos denso; la presión sube con la profundidad.</td></tr>

<section>
<h2>Cinco grandes ideas que te llevas</h2>
<ol class="steps5">
<li><b>🔭 Pregunta y comprueba.</b> Una idea vale por lo que se puede probar, no por quién la dice.</li>
<li><b>⚖️ Lo que se conserva.</b> La energía, el momento y la carga eléctrica no se crean ni se destruyen: se transforman o se reparten.</li>
<li><b>🌊 Todo vibra.</b> Ondas y oscilaciones están en el sonido, la luz, los átomos y hasta en la materia.</li>
<li><b>🧩 Lo grande viene de lo pequeño.</b> De átomos y partículas salen la química, la vida y las estrellas.</li>
<li><b>🌌 Las mismas leyes en todas partes.</b> Una manzana, la Luna y una galaxia obedecen la misma física.</li>
</ol>
</section>

<section>
<h2>Tu proyecto para la feria de ciencias</h2>
<p>Un buen proyecto responde una pregunta con un experimento. Sigue estos pasos:</p>
<ol class="tl">
<li><span class="tl-y">Paso 1</span><b>🤔 Elige una pregunta que puedas probar</b><p>Por ejemplo: «¿Qué liga se estira más?», «¿Qué avión de papel vuela más lejos?», «¿Qué color se calienta más al Sol?».</p></li>
<li><span class="tl-y">Paso 2</span><b>💭 Adivina la respuesta (tu hipótesis)</b><p>Escribe lo que crees que pasará, y por qué.</p></li>
<li><span class="tl-y">Paso 3</span><b>🧪 Diseña una prueba justa</b><p>Cambia solo UNA cosa a la vez y mantén todo lo demás igual. Repite cada medida 3 veces.</p></li>
<li><span class="tl-y">Paso 4</span><b>📏 Mide y anota</b><p>Usa tablas y gráficas. Anota también lo inesperado.</p></li>
<li><span class="tl-y">Paso 5</span><b>📣 Cuenta lo que descubriste</b><p>Muestra tus datos, di si tu hipótesis era correcta y qué preguntas nuevas aparecieron.</p></li>
</ol>
<div class="cols2">
<div class="card"><h4>💡 10 ideas de proyecto</h4><p>1) Aviones de papel · 2) Péndulo y longitud · 3) Cohete de botella · 4) Termo casero · 5) Cámara oscura · 6) Pila de limón · 7) Electroimán · 8) Puente de papel (¿cuánto peso aguanta?) · 9) Cristales de azúcar · 10) Terremoto y edificios de espagueti.</p></div>
<div class="card"><h4>📓 Tu cuaderno de científico</h4><p>Anota cada día: ¿Qué pregunta me hice hoy? ¿Qué probé? ¿Qué pasó? ¿Qué me sorprendió? ¿Qué preguntaré mañana? Con dibujos, ¡como hacía Leonardo!</p></div>
</div>
</section>

<h2>¿Y ahora qué?</h2>
<p>Hay mucha física esperándote: en los museos de ciencia y los planetarios, en los clubes de astronomía y robótica, en las olimpiadas de física y de ciencias, en los libros y videos. Y si te encanta, puedes ser <b>física o físico</b>, ingeniera o ingeniero, astrónoma, médico con equipos de rayos X, creador de videojuegos, científica de datos, o inventor. Los científicos de verdad hacen exactamente lo que tú hiciste aquí: <em>preguntar, probar, equivocarse, volver a intentar y compartir</em>.</p>
