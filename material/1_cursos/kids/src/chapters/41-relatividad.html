<template class="chapter-src" data-id="relatividad" data-num="41" data-world="9" data-title="La relatividad de Einstein" data-short="El tiempo que corre distinto, el espacio que se curva y por qué el GPS necesita a Einstein.">
<p class="lead">¿Y si el tiempo no corriera igual para todos? ¿Y si la gravedad no fuera una fuerza, sino la forma del espacio? Albert Einstein, un joven de 26 años que trabajaba en una oficina de patentes, cambió para siempre la forma de entender el tiempo, el espacio y la gravedad.</p>

<div class="learn"><ul>
<li>Nada puede ir más rápido que la luz, y su rapidez es la misma para todos.</li>
<li>Para quien se mueve muy rápido, el tiempo pasa más despacio (¡es verdad!).</li>
<li>La masa dobla el espacio y el tiempo, y eso es lo que sentimos como gravedad.</li>
<li>Los relojes de los satélites GPS corrigen efectos relativistas todos los días.</li>
</ul></div>

<div class="say" data-who="quarki" data-mood="wow"><p>¡Cuidado, que esto es de los temas más locos de la física! El tiempo y el espacio no son lo que parecen. Pero todo se ha comprobado con experimentos. ¿Te atreves?</p></div>

<section>
<h2>Relatividad especial: la luz siempre igual</h2>
<p>En 1905, Einstein partió de una idea sencilla y extraña: <strong>la luz siempre viaja a la misma rapidez</strong> (300 000 km/s), sin importar si tú te mueves hacia ella o te alejas. Si vas en un tren a 100 km/h y lanzas una pelota hacia adelante, la rapidez de la pelota respecto al suelo se suma. Pero con la luz no: ¡siempre es la misma!</p>
<p>Para que esto sea posible, hay algo que tiene que ceder: el <strong>tiempo</strong> y el <strong>espacio</strong>. Para alguien que se mueve a una rapidez parecida a la de la luz, el tiempo pasa más despacio. A esto se le llama <dfn data-def="Cuando el tiempo pasa más despacio para algo que se mueve muy rápido, comparado con algo que está quieto.">dilatación del tiempo</dfn>.</p>
<div class="magic" data-name="El reloj de luz"><big>más rápido = tiempo más lento</big>A 87 % de la rapidez de la luz, el tiempo pasa a la mitad de velocidad.</div>
<div class="sim" data-sim="reloj-luz" data-title="El reloj de luz y los gemelos" data-goal="Manda a un viajero a una velocidad cercana a la de la luz, para que al volver sea la mitad de viejo que su hermano gemelo.">
<ul><li>Dentro del reloj, un fotón rebota entre dos espejos. Cuando el reloj se mueve, el fotón recorre un camino más largo en diagonal: ¡cada tic tarda más!</li><li>A 87 % de la velocidad de la luz, el viajero envejece la mitad.</li></ul>
</div>
<div class="fact"><p>La dilatación del tiempo no es teoría solamente: se ha medido con relojes atómicos en aviones y con partículas llamadas muones, que viven apenas 2 millonésimas de segundo y, gracias a la dilatación, llegan hasta el suelo desde la alta atmósfera. ¡Sin relatividad no llegarían!</p></div>
<details class="curious"><p>El factor de dilatación es γ = 1/√(1 − v²/c²). A v = 0,5c, γ = 1,15; a v = 0,87c, γ = 2; a v = 0,99c, γ = 7,1; a v = 0,9999c, γ = 70. Cuando v se acerca a c, γ crece sin límite: se necesitaría una energía infinita para alcanzar la rapidez de la luz. Por eso nada con masa puede llegar a ella. Además, E = mc² dice que masa y energía son equivalentes: por eso un objeto que se acelera «pesa» más.</p></details>
</section>

<section>
<h2>Relatividad general: el espacio que se curva</h2>
<p>En 1915, Einstein dio un paso más: la gravedad no es una fuerza que jala, sino un efecto de que <strong>la masa curva el espacio y el tiempo</strong>. Imagina una sábana elástica bien estirada: si pones una bola pesada en el centro, la sábana se hunde, y una canica que pase cerca cae hacia la bola. Así, los planetas giran alrededor del Sol porque el Sol «hunde» el espacio a su alrededor, y siguen el camino más recto posible en ese espacio curvo.</p>
<div class="story" data-title="El eclipse que hizo famoso a Einstein"><p>Si la masa curva el espacio, también debe doblar la luz de las estrellas que pasan cerca del Sol. En 1919, durante un eclipse total, el astrónomo Arthur Eddington fotografió estrellas cerca del borde del Sol y comprobó que parecían estar un poquito desplazadas, justo lo que había predicho Einstein. ¡Fue noticia en todo el mundo!</p></div>
<div class="sim" data-sim="lente-gravitacional" data-title="Doblando la luz con una estrella" data-goal="Ajusta la masa y la distancia para que la luz curvada por la estrella llegue al blanco.">
<ul><li>Más masa o más cerca: la luz se dobla más.</li><li>(El ángulo está exagerado para que se vea; en la realidad es muy pequeño.)</li></ul>
</div>
<div class="fact"><p>En 2015, el detector LIGO captó por primera vez ondas gravitacionales: «arrugas» del espacio-tiempo producidas por dos agujeros negros que chocaron hace 1300 millones de años. Einstein las había predicho cien años antes. Y en 2019 y 2022 se obtuvieron las primeras imágenes de agujeros negros.</p></div>
</section>

<section>
<h2>La relatividad en tu bolsillo: el GPS</h2>
<p>Los satélites del GPS giran a unos 20 000 km de altura a casi 4 km/s. Sus relojes atómicos van <b>más lentos</b> por su velocidad (relatividad especial: −7 millonésimas de segundo por día) y <b>más rápidos</b> porque están donde la gravedad es más débil (relatividad general: +46 millonésimas de segundo por día). El resultado neto: ¡sus relojes adelantan unos 38 millonésimas de segundo al día! Parece poquísimo, pero el GPS calcula tu posición midiendo el tiempo de las señales de radio (que viajan a la velocidad de la luz), así que cada millonésima de segundo de error equivale a unos 300 metros.</p>
<div class="sim" data-sim="gps-relatividad" data-title="Si no corrigiéramos a Einstein" data-goal="Mira cuánto se equivocaría tu GPS sin la relatividad, y cómo se corrige.">
<ul><li>Sin corrección, el error crecería unos 11 kilómetros cada día.</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="El trampolín del espacio-tiempo" data-time="30 min" data-level="2">
<ul class="mat"><li>🧵 Una tela elástica (media de nylon, lycra o una camiseta elástica)</li><li>🪟 Un aro de bordado o la tapa de una caja grande sin fondo para estirarla</li><li>🔮 Una bola pesada (una bola de petanca o una naranja) y canicas pequeñas</li></ul>
<ol class="steps"><li>Estira la tela sobre el aro, bien tensa.</li><li>Pon la bola pesada en el centro: verás cómo hunde la tela.</li><li>Lanza una canica pequeña desde el borde, con un empujoncito de lado, hacia la bola. Observa su camino.</li><li>Prueba con distintas velocidades y con una bola más liviana en el centro.</li></ol>
<p class="predict">¿La canica irá en línea recta o hará una curva?</p>
<p class="result">La canica hace una curva alrededor de la bola del centro y, si va con la rapidez adecuada, da varias vueltas, ¡como un planeta! Con una bola más pesada la curva es más cerrada.</p>
<p class="why">La bola central deforma la tela: la canica sigue el camino más recto en una superficie curva. Esto representa cómo la masa curva el espacio-tiempo (con una diferencia: en la tela, la fricción y la gravedad real que mueven la canica sí tienen un papel).</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>Según Einstein, ¿qué pasa con el tiempo para un viajero que va a una velocidad cercana a la de la luz?</p><ol><li>Pasa más rápido</li><li>Pasa más despacio, comparado con alguien quieto</li><li>No cambia</li></ol><p class="why">La dilatación del tiempo: para quien se mueve muy rápido, el tiempo pasa más lento.</p></div>
<div class="q" data-ans="2"><p>Según la relatividad general, la gravedad es…</p><ol><li>Un hilo invisible</li><li>Una fuerza magnética</li><li>El efecto de la masa que curva el espacio-tiempo</li></ol><p class="why">Los objetos con masa curvan el espacio y el tiempo; los demás siguen caminos curvos.</p></div>
<div class="q" data-ans="0"><p>¿Qué se necesita corregir en los satélites GPS?</p><ol><li>Sus relojes, por efectos relativistas</li><li>Sus colores</li><li>Su tamaño</li></ol><p class="why">Si no se corrigen, el GPS se equivocaría varios kilómetros por día.</p></div>
<div class="q" data-ans="1"><p>¿Qué máximo de rapidez existe en el universo?</p><ol><li>La del sonido</li><li>La de la luz</li><li>No hay máximo</li></ol><p class="why">Nada con masa puede alcanzar la rapidez de la luz en el vacío: unos 300 000 km/s.</p></div>
</div>
