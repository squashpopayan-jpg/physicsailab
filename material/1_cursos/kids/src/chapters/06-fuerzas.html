<template class="chapter-src" data-id="fuerzas" data-num="6" data-world="2" data-title="Empujones y tirones: las leyes de Newton" data-short="Fuerzas, inercia, por qué un cohete despega y cómo equilibrar a un elefante.">
<p class="lead">Una patada al balón, el viento que mueve las hojas, un imán que atrapa un clip: todo eso son <strong>fuerzas</strong>. Hace unos 340 años, Isaac Newton descubrió tres reglas que explican cómo funcionan. ¡Se llaman las leyes de Newton!</p>

<div class="learn"><ul>
<li>Una fuerza es un empujón o un tirón. Se mide en newtons (N).</li>
<li>Primera ley: las cosas siguen como están (quietas o en movimiento) si nada las empuja. A eso se le llama inercia.</li>
<li>Segunda ley: mientras más fuerza y menos masa, más acelera algo.</li>
<li>Tercera ley: si empujas algo, ese algo te empuja a ti.</li>
</ul></div>

<div class="say" data-who="newti" data-mood="wow"><p>¡Miau! ¡Mi tocayo Newton! Dicen que se llamó «Newti» por él… ¡o quizás yo por él! Bueno, vamos a conocer sus leyes con juegos.</p></div>

<section>
<h2>¿Qué es una fuerza?</h2>
<p>Una fuerza puede <strong>mover</strong> algo que está quieto, <strong>frenarlo</strong>, <strong>cambiar su dirección</strong> o <strong>deformarlo</strong> (como cuando aprietas una esponja). Las fuerzas tienen un <em>tamaño</em> y una <em>dirección</em>. Por eso las dibujamos como flechas: mientras más larga, más fuerte.</p>
<p>La unidad de fuerza es el <dfn data-def="La unidad de fuerza. Una manzana mediana pesa más o menos 1 newton.">newton</dfn> (N). Una manzana mediana pesa más o menos 1 N. Y cuando varias fuerzas empujan una cosa, lo que importa es la <strong>fuerza neta</strong>: la suma de todas, teniendo en cuenta hacia dónde van.</p>
<div class="sim" data-sim="tira-afloja" data-title="Tira y afloja: ¡equilibra al elefante!" data-goal="¿Cuántos niños se necesitan para empatar con el elefante?">
<ul><li>Si las fuerzas son iguales, la cuerda no se mueve: la fuerza neta es cero.</li><li>Si una es mayor, la cuerda se mueve hacia ese lado.</li></ul>
</div>
</section>

<section>
<h2>Primera ley: la inercia</h2>
<div class="magic" data-name="Primera ley de Newton"><big>Todo sigue como está</big>Lo quieto sigue quieto y lo que se mueve sigue moviéndose derecho y con la misma rapidez, hasta que una fuerza lo cambie.</div>
<p>Esa «pereza» de las cosas para cambiar su movimiento se llama <dfn data-def="La tendencia de las cosas a seguir quietas o a seguir moviéndose igual, mientras nada las empuje.">inercia</dfn>. Cuando el bus frena de golpe, tu cuerpo sigue hacia adelante: ¡es la inercia! Por eso se usa el cinturón de seguridad.</p>
<div class="fact"><p>Antes de Galileo y Newton, mucha gente pensaba que hacía falta una fuerza para <em>mantener</em> algo en movimiento. En realidad la fuerza solo sirve para <em>cambiar</em> el movimiento. Si no existiera la fricción, una bola rodaría para siempre.</p></div>
</section>

<section>
<h2>Segunda ley: fuerza, masa y aceleración</h2>
<div class="magic" data-name="Segunda ley de Newton"><big>fuerza = masa × aceleración</big>aceleración = fuerza ÷ masa</div>
<p>La <strong>masa</strong> es la cantidad de materia que tiene algo. Un carrito pesado (mucha masa) es difícil de acelerar. Si lo empujas con el doble de fuerza, acelera el doble. Y si tiene el doble de masa, acelera la mitad.</p>
<div class="sim" data-sim="carrito-fma" data-title="El carrito de Newti" data-goal="Elige una fuerza y una masa para que el carrito llegue a la bandera justo a tiempo.">
<ul><li>Más fuerza, más aceleración. Más masa, menos aceleración.</li><li>Calcula la aceleración: fuerza ÷ masa.</li></ul>
</div>
<details class="curious"><p>Con aceleración constante a, la distancia recorrida desde el reposo es d = ½·a·t². Si quieres llegar a una distancia d en un tiempo t, necesitas a = 2d ÷ t². Por ejemplo, 20 m en 4 s necesita a = 2×20 ÷ 16 = 2,5 m/s², y eso lo da una fuerza de 5 N empujando 2 kg.</p></details>
</section>

<section>
<h2>Tercera ley: acción y reacción</h2>
<div class="magic" data-name="Tercera ley de Newton"><big>Si empujas, te empujan</big>Cuando un cuerpo empuja a otro, el otro lo empuja a él con la misma fuerza y en sentido contrario.</div>
<p>Si estás en patines y empujas una pared, ¡tú sales rodando hacia atrás! Un pez nada empujando el agua hacia atrás. Tú caminas empujando el piso hacia atrás y el piso te empuja a ti hacia adelante. Un cohete expulsa gases hacia abajo y los gases lo empujan hacia arriba.</p>
<div class="sim" data-sim="skate-retroceso" data-title="Lanzar una bola desde un monopatín" data-goal="Lanza la bola para que Newti retroceda a más de 1 m/s.">
<ul><li>Una bola más pesada o más rápida empuja más hacia atrás.</li><li>Newti pesa mucho más que la bola, por eso retrocede más despacio que la bola avanza.</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Cohete de globo" data-time="15 min" data-level="1">
<ul class="mat"><li>🎈 Un globo largo</li><li>🧵 5 metros de hilo o pita</li><li>🥤 Una pajilla</li><li>🩹 Cinta pegante</li><li>🪑 Dos sillas</li></ul>
<ol class="steps"><li>Pasa el hilo por la pajilla y amarra cada extremo del hilo a una silla, bien estirado.</li><li>Infla el globo sin amarrarlo, y sostén la boquilla con los dedos.</li><li>Pega el globo a la pajilla con cinta, de modo que la boquilla apunte hacia una de las sillas.</li><li>Suelta la boquilla. ¡Mira qué pasa!</li></ol>
<p class="predict">¿Hacia dónde crees que irá el globo: hacia donde sale el aire o hacia el lado contrario?</p>
<p class="result">El globo sale disparado por el hilo en dirección contraria al chorro de aire, ¡como un cohete!</p>
<p class="why">El globo empuja el aire hacia atrás y el aire empuja al globo hacia adelante. Es la tercera ley de Newton: acción y reacción. Así funcionan los cohetes de verdad.</p>
</div>
<div class="exp" data-title="La tarjeta y la moneda" data-time="5 min" data-level="1">
<ul class="mat"><li>🥛 Un vaso</li><li>🃏 Una tarjeta o cartulina</li><li>🪙 Una moneda</li></ul>
<ol class="steps"><li>Pon la tarjeta sobre el vaso y la moneda encima de la tarjeta, justo en el centro.</li><li>Da un golpecito rápido y fuerte a la tarjeta con el dedo, hacia un lado.</li><li>Observa qué le pasa a la moneda.</li></ol>
<p class="predict">¿La moneda saldrá volando con la tarjeta o caerá en el vaso?</p>
<p class="result">La tarjeta sale volando y la moneda cae dentro del vaso.</p>
<p class="why">La moneda tiene inercia: tiende a quedarse quieta. La tarjeta sale tan rápido que casi no alcanza a empujarla.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="2"><p>Un auto frena de golpe y tú sigues hacia adelante. ¿Por qué?</p><ol><li>Porque el auto te empuja</li><li>Porque eres liviano</li><li>Por la inercia</li></ol><p class="why">La inercia hace que tu cuerpo siga moviéndose aunque el auto se detenga. ¡Por eso se usa el cinturón!</p></div>
<div class="q" data-ans="1"><p>Si empujas dos carritos con la misma fuerza, ¿cuál acelera más?</p><ol><li>El más pesado</li><li>El más liviano</li><li>Los dos igual</li></ol><p class="why">Aceleración = fuerza ÷ masa. Con menos masa, más aceleración.</p></div>
<div class="q" data-ans="0"><p>¿Cómo vuela un cohete?</p><ol><li>Empuja gases hacia abajo y los gases lo empujan hacia arriba</li><li>Se agarra del aire</li><li>Lo jala la Luna</li></ol><p class="why">Es la tercera ley de Newton. El cohete funciona hasta en el espacio, donde no hay aire.</p></div>
<div class="q" data-ans="2"><p>Si dos equipos tiran con la misma fuerza, ¿qué pasa con la cuerda?</p><ol><li>Va hacia la izquierda</li><li>Va hacia la derecha</li><li>No se mueve</li></ol><p class="why">Las fuerzas se compensan: la fuerza neta es cero y la cuerda queda en equilibrio.</p></div>
</div>
</template>
