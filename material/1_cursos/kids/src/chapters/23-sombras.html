<p class="lead">Gracias a la luz puedes ver este texto, tus amigos y los colores del mundo. ¿Qué es la luz? ¿Por qué hace sombras? ¿Qué tan rápido va? ¡Entremos al mundo de la luz con Lumi, la luciérnaga!</p>

<div class="learn"><ul>
<li>La luz viaja en línea recta y es la cosa más rápida del universo.</li>
<li>Una sombra aparece cuando algo opaco bloquea la luz.</li>
<li>Una caja oscura con un agujerito puede formar imágenes.</li>
</ul></div>

<div class="say" data-who="lumi" data-mood="happy"><p>¡Hola! Soy Lumi, una luciérnaga. Yo produzco mi propia luz por las noches. ¡Es una luz fría, casi sin calor! Cuéntame: ¿has jugado alguna vez a hacer sombras con las manos?</p></div>

<section>
<h2>La luz viaja derecho</h2>
<p>Los objetos que producen su propia luz se llaman <strong>fuentes de luz</strong>: el Sol, una vela, un bombillo, una luciérnaga. Los demás objetos solo los vemos cuando la luz de una fuente <em>rebota</em> en ellos y llega a nuestros ojos. Así vemos la Luna: refleja la luz del Sol.</p>
<p>La luz viaja en <strong>línea recta</strong>. Por eso no puedes ver a alguien que está detrás de una esquina, y por eso cuando algo opaco se interpone, se forma una sombra.</p>
<div class="fact"><p>La luz es lo más rápido que existe: viaja a casi 300 000 kilómetros por segundo. ¡Podría dar 7 vueltas y media a la Tierra en un segundo! Tarda 1,3 s en llegar de la Luna y 8 minutos y 20 segundos en llegar del Sol. Cuando miras al Sol, lo ves como era hace 8 minutos.</p></div>
<h3>Transparente, translúcido y opaco</h3>
<p>Los materiales dejan pasar la luz de distinta manera: los <b>transparentes</b> (vidrio, agua limpia) dejan pasar casi toda la luz y se ve claro a través; los <b>translúcidos</b> (papel encerado, vidrio esmerilado) la dejan pasar pero la desordenan; los <b>opacos</b> (madera, metal, cartón) no la dejan pasar.</p>
<div class="sim" data-sim="materiales-luz" data-title="¿Transparente, translúcido u opaco?" data-goal="Clasifica cada objeto según deje pasar la luz."></div>
</section>

<section>
<h2>Las sombras</h2>
<p>La sombra es la zona donde no llega luz porque un objeto la bloquea. Mientras más cerca está el objeto de la linterna, <strong>más grande</strong> es su sombra; mientras más lejos, más pequeña. Esto se parece a las proyecciones de las manos en la pared: ¡acercas la mano a la linterna y la sombra se hace enorme!</p>
<div class="sim" data-sim="sombras" data-title="El teatro de sombras" data-goal="Mueve el muñeco entre la linterna y la pared para que su sombra mida justo 2 metros (con 10 cm de margen).">
<ul><li>Acerca el muñeco a la linterna: la sombra crece.</li><li>Alejalo: la sombra se reduce. Siempre es más grande que el muñeco, porque la luz se abre como un cono.</li></ul>
</div>
<div class="fact"><p>Un eclipse de Sol es una sombra gigante: la Luna se pone entre el Sol y la Tierra, y su sombra cae sobre una parte de la Tierra. Por un par de minutos, ¡es de noche en pleno día!</p></div>
</section>

<section>
<h2>La cámara oscura</h2>
<p>Si en una caja cerrada y oscura haces un agujerito muy pequeño, la luz de afuera entra por ahí y dibuja en la pared del fondo una imagen del paisaje: ¡<strong>al revés</strong>! Cada punto del objeto manda un rayito por el agujero y cae en un punto distinto de la pared. Es la <dfn data-def="Una caja oscura con un pequeño agujero que forma imágenes invertidas de lo que hay afuera.">cámara oscura</dfn>, el antepasado de las cámaras fotográficas y de tus ojos.</p>
<div class="story" data-title="Ibn al-Haytham y la cámara oscura"><p>Hace unos 1000 años, el sabio Ibn al-Haytham estudió la cámara oscura y explicó que vemos porque la luz que rebota en las cosas entra a nuestro ojo. Su libro de óptica cambió la forma de entender la visión.</p></div>
<div class="sim" data-sim="camara-oscura" data-title="La cámara oscura" data-goal="Consigue una imagen nítida (agujero de 2 mm o menos) y de al menos 8 cm de alto.">
<ul><li>Un agujero grande da una imagen brillante pero borrosa.</li><li>Un agujero pequeñito da una imagen nítida pero tenue.</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Tu propia cámara oscura" data-time="30 min" data-level="2" data-adult="1">
<ul class="mat"><li>📦 Una caja de cartón o un tubo de papas fritas</li><li>🧻 Papel encerado o papel de calco</li><li>🪡 Una aguja (¡con adulto!)</li><li>🍬 Papel aluminio</li><li>🩹 Cinta negra</li></ul>
<ol class="steps"><li>En un extremo del tubo, pega un pedazo de papel encerado (será la pantalla). Tapa el otro extremo con aluminio.</li><li>Con la aguja, un adulto hace un agujerito pequeño en el centro del aluminio.</li><li>Dirige el lado del agujero hacia una ventana luminosa o una lámpara y mira el papel encerado desde atrás, tapándote la cabeza con una tela oscura.</li><li>Prueba acercando y alejando la cámara de la ventana.</li></ol>
<p class="predict">¿Cómo se verá la imagen en el papel?</p>
<p class="result">Aparece una imagen pequeña de la ventana y de lo de afuera, ¡pero al revés! Con la cámara más lejos de la ventana, la imagen se hace más pequeña.</p>
<p class="why">Los rayos de luz viajan en línea recta, se cruzan en el agujero y llegan a puntos invertidos en la pantalla: lo de arriba queda abajo.</p>
</div>
<div class="exp" data-title="Teatro de sombras" data-time="20 min" data-level="1">
<ul class="mat"><li>🔦 Una linterna</li><li>🧻 Una sábana o pared blanca</li><li>✂️ Cartulina negra y palitos</li></ul>
<ol class="steps"><li>Recorta figuras (animales, personajes) de la cartulina y pégalas a un palito.</li><li>Pon la linterna en un lado y la sábana en otro, en un cuarto oscuro.</li><li>Pon la figura entre la linterna y la sábana. Acércala y aléjala de la linterna.</li><li>Cuenta una historia con tus sombras.</li></ol>
<p class="predict">¿Cómo cambia el tamaño de la sombra al acercar la figura a la linterna?</p>
<p class="result">Mientras más cerca de la linterna, más grande y más borrosa es la sombra. Más cerca de la sábana, más pequeña y nítida.</p>
<p class="why">La luz se abre como un cono desde la linterna: ¡por eso la sombra crece cuando el objeto está cerca de la fuente!</p>
</div>
</section>
