<template class="chapter-src" data-id="familias" data-num="0" data-kind="page" data-world="0" data-title="Para familias y maestros" data-short="Cómo acompañar a niñas y niños en este curso: edades, seguridad, materiales y ritmo.">
<p class="lead">Física KIDS es un curso interactivo para niñas y niños de unos 6 a 12 años que recorre <strong>todas las ramas de la física</strong>, desde los primeros curiosos hasta las partículas y las galaxias. Está pensado para que lo exploren con curiosidad, jugando y experimentando, con ayuda de una persona adulta cuando haga falta.</p>

<section>
<h2>Cómo está organizado</h2>
<ul>
<li><b>10 mundos y 47 capítulos.</b> Cada mundo tiene un personaje guía y una rama de la física: orígenes, mecánica, fluidos, calor, ondas y sonido, luz y color, electricidad y magnetismo, astronomía, átomos y partículas, y Tierra y vida.</li>
<li><b>Cada capítulo</b> tiene: una historia corta, explicaciones sencillas, <b>juegos y simulaciones</b> con retos, un <b>experimento para hacer en casa</b>, <b>preguntas</b> con explicación y, para quien quiera ir más allá, un recuadro <b>«Para mentes curiosas»</b>.</li>
<li><b>Estrellas y pasaporte.</b> Cada reto superado, pregunta acertada y experimento realizado suma una estrella. El progreso se guarda en el navegador del dispositivo (no se envía a ningún servidor). Al final hay un diploma imprimible.</li>
<li><b>Leer en voz alta.</b> El botón 🔊 de cada sección lee el texto con la voz del dispositivo. Ayuda a quienes aún están aprendiendo a leer.</li>
<li><b>Cajón de experimentos y diccionario.</b> Reúnen en un solo lugar todos los experimentos y las palabras explicadas.</li>
</ul>
</section>

<section>
<h2>Edades y ritmo sugerido</h2>
<div class="cols2">
<div class="card"><h4>6 a 8 años</h4><p>Con un adulto: leer juntos, jugar las simulaciones, hacer los experimentos y responder las preguntas en voz alta. Los recuadros «Para mentes curiosas» pueden saltarse.</p></div>
<div class="card"><h4>9 a 12 años</h4><p>Pueden avanzar solos y pedir ayuda para los experimentos con adulto. Los «Para mentes curiosas» incluyen fórmulas y datos más avanzados.</p></div>
</div>
<p>Un ritmo cómodo es <b>un capítulo por semana</b> (unas 40 a 50 semanas), o un mundo cada mes. Pueden seguir el orden o saltar al mundo que más les guste: cada capítulo se entiende por sí solo, aunque hay conexiones entre ellos (se indican en el texto). Las <b>sesiones cortas</b> de 20 a 30 minutos funcionan mejor que las largas.</p>
</section>

<section>
<h2>Seguridad en los experimentos</h2>
<p>Los experimentos usan materiales de casa. Los que necesitan ayuda están marcados con <b>👩‍👧 Con un adulto</b>. Reglas generales:</p>
<ol>
<li>Un adulto presente en todo experimento con fuego, agua caliente, objetos cortantes, hielo seco, alcohol o presión.</li>
<li><b>Nunca</b> experimentar con la corriente de la pared, ni meter objetos en enchufes. En electricidad se usan solo pilas pequeñas.</li>
<li>No mirar nunca directamente al Sol, a un láser ni a una linterna potente. Usar gafas de protección cuando se indique.</li>
<li>No probar ni oler sustancias. Lavarse las manos al terminar.</li>
<li>Trabajar sobre una superficie despejada y limpiar al terminar.</li>
<li>En los cohetes de botella, las pruebas de presión y los experimentos con microondas, seguir las indicaciones con un adulto y en lugares abiertos o adecuados.</li>
</ol>
</section>

<section>
<h2>El cajón de la ciencia: materiales que conviene tener</h2>
<p>Con una cajita de materiales sencillos se pueden hacer casi todos los experimentos: papel, cartón y cartulina; cinta pegante y tijeras; hilo y pita; globos; pajillas; vasos y botellas plásticas; monedas; clips; ligas; una regla o cinta métrica; un cronómetro (el del celular sirve); una linterna; pilas AA con soporte y cables con pinzas; un imán; una brújula; lupa; sal, azúcar, bicarbonato y colorante de comida; arroz y espaguetis; aluminio y lana. Cada experimento lista lo que necesita.</p>
</section>

<section>
<h2>Cómo acompañar la curiosidad</h2>
<ul>
<li><b>Preguntar antes de explicar.</b> Cada experimento tiene un espacio de «piensa antes»: dejen que el niño o la niña haga su predicción, aunque sea equivocada. Equivocarse es parte del método científico.</li>
<li><b>Hablar de lo que vieron.</b> «¿Qué pasó? ¿Por qué creen? ¿Qué cambiarían?» Más importante que acertar es observar y razonar.</li>
<li><b>Conectar con la vida diaria.</b> El columpio, el atardecer, la olla hirviendo y el eco de la montaña son ejemplos de física.</li>
<li><b>Usar el cuaderno de científico.</b> Anotar y dibujar cada experimento fortalece la observación y la escritura.</li>
<li><b>Aceptar los «no sé».</b> Muchas preguntas (como qué es la materia oscura) no tienen todavía respuesta. ¡Eso también es ciencia!</li>
</ul>
</section>

<section>
<h2>Sobre la exactitud</h2>
<p>El curso busca ser <b>correcto y a la vez sencillo</b>. Las simulaciones son modelos simplificados (por ejemplo, sin fricción del aire en algunos casos, o con ángulos exagerados para que se vean) y así se indica en el texto cuando es importante. Los números que usan (gravedades, velocidades, temperaturas, constantes) son valores de referencia, y las funciones de cálculo se comprueban con más de 260 pruebas automáticas contra soluciones exactas y valores conocidos. Si encuentran un error, ¡avisen! La ciencia mejora corrigiéndose.</p>
</section>

<section>
<h2>Cómo usarlo</h2>
<ul>
<li>Funciona en computador, tableta y celular con un navegador moderno (Chrome, Edge, Firefox, Safari). Las simulaciones funcionan sin conexión; las tipografías y algunos recursos usan internet si está disponible.</li>
<li>El botón 🔊 de la barra superior activa o silencia los sonidos; el botón de día/noche cambia el modo de color.</li>
<li>El progreso queda en el navegador y dispositivo en el que se juega; al borrar los datos del navegador, se pierde. En el pasaporte se puede borrar el progreso para que otra persona empiece desde cero.</li>
</ul>
</section>
