<template class="chapter-src" data-id="particulas" data-num="42" data-world="9" data-title="Partículas y fuerzas fundamentales" data-short="Quarks, electrones, neutrinos, las cuatro fuerzas de la naturaleza y el gran acelerador de partículas.">
<p class="lead">Los protones y neutrones tampoco son lo más pequeño: están hechos de partículas aún más diminutas llamadas <strong>quarks</strong>. Hoy sabemos que todo el universo está construido con un puñado de partículas y cuatro fuerzas. ¡Es como un juego de piezas de construcción cósmico!</p>

<div class="learn"><ul>
<li>Los protones y neutrones están hechos de quarks (de tipos «arriba» y «abajo»).</li>
<li>Los electrones y los neutrinos son partículas fundamentales (no tienen partes).</li>
<li>Existen cuatro fuerzas: gravedad, electromagnética, fuerte y débil.</li>
<li>Los aceleradores de partículas, como el LHC del CERN, chocan partículas para descubrir otras nuevas.</li>
</ul></div>

<div class="say" data-who="quarki" data-mood="happy"><p>¡Ya casi terminas el mundo de lo pequeño! Esta es la parte más fundamental: las piezas más básicas de todo. Los quarks y yo somos primos… ¡aunque ellos son mucho más chiquitos!</p></div>

<section>
<h2>Los ladrillos de la materia</h2>
<p>En los años 1960, los físicos propusieron que protones y neutrones están hechos de partículas más pequeñas: los <dfn data-def="Las partículas fundamentales que forman los protones y neutrones. Hay seis tipos; los más comunes son el «arriba» y el «abajo».">quarks</dfn>. Hay seis tipos, pero para la materia normal solo importan dos:</p>
<ul><li>el quark <b>arriba</b> (u, de «up») tiene carga +2/3,</li><li>el quark <b>abajo</b> (d, de «down») tiene carga −1/3.</li></ul>
<p>Un <b>protón</b> son dos quarks arriba y uno abajo (uud): +2/3 + 2/3 − 1/3 = +1. Un <b>neutrón</b> es uno arriba y dos abajo (udd): +2/3 − 1/3 − 1/3 = 0. ¡Los quarks nunca se ven solos: siempre están en grupos!</p>
<div class="sim" data-sim="arma-particulas" data-title="Arma partículas con quarks" data-goal="Construye un protón (uud) y un neutrón (udd) con quarks arriba y abajo.">
<ul><li>Suma las cargas: +2/3 y −1/3.</li><li>También puedes probar otras combinaciones raras, como uuu o ddd, que existen un instante cortísimo.</li></ul>
</div>
<div class="fact"><p>Los electrones, en cambio, no tienen partes conocidas: son partículas fundamentales. Y hay otras parecidas: los <b>neutrinos</b>, partículas casi sin masa y sin carga que atraviesan todo: ¡unos 65 000 millones de neutrinos del Sol atraviesan cada centímetro cuadrado de tu piel cada segundo! Y casi ninguno choca con nada.</p></div>
<details class="curious"><p>El «modelo estándar» de la física de partículas agrupa 12 partículas de materia (6 quarks y 6 leptones, como el electrón y el neutrino), 4 partículas portadoras de fuerzas (fotón, gluón, W y Z) y el bosón de Higgs, que da masa a las demás. Además, cada partícula tiene una antipartícula con carga contraria: la del electrón es el positrón. Cuando una partícula y su antipartícula se juntan, ¡se aniquilan y se convierten en energía! (Se usa en los equipos PET de los hospitales.)</p></details>
</section>

<section>
<h2>Las cuatro fuerzas de la naturaleza</h2>
<div class="cols2">
<div class="card"><div class="big-emoji">🌍</div><h4>Gravedad</h4><p>Atrae todo lo que tiene masa. Es débil, pero llega lejísimos. Mantiene a los planetas y las galaxias.</p></div>
<div class="card"><div class="big-emoji">⚡</div><h4>Electromagnética</h4><p>Actúa entre cargas eléctricas. Mantiene los átomos unidos, hace funcionar la luz, la electricidad, los imanes y la química.</p></div>
<div class="card"><div class="big-emoji">🧲</div><h4>Fuerte</h4><p>Pega los quarks dentro de los protones y mantiene unidos a los protones y neutrones en el núcleo. ¡La más fuerte de todas!</p></div>
<div class="card"><div class="big-emoji">☢️</div><h4>Débil</h4><p>Causa ciertos tipos de radiactividad y permite que el Sol funda el hidrógeno.</p></div>
</div>
<div class="sim" data-sim="cuatro-fuerzas" data-title="¿Qué fuerza es?" data-goal="Une cada situación con la fuerza fundamental que la explica."></div>
<p>Las fuerzas se transmiten mediante partículas «mensajeras»: los fotones llevan la fuerza electromagnética, los gluones la fuerte, y los bosones W y Z la débil. Es como si dos personas patinando se lanzaran una pelota: al lanzarla y atraparla, ¡se empujan!</p>
</section>

<section>
<h2>El acelerador de partículas</h2>
<p>Para descubrir las partículas más pequeñas, los científicos las hacen <b>chocar con muchísima energía</b>. Del choque pueden salir partículas nuevas (por E = mc², la energía se convierte en masa). Para llevar las partículas a casi la rapidez de la luz usan <strong>aceleradores</strong>: anillos enormes donde campos eléctricos las aceleran y <b>imanes</b> gigantes las mantienen en círculo.</p>
<div class="story" data-title="El LHC y el bosón de Higgs"><p>El Gran Colisionador de Hadrones (LHC) está en el CERN, en la frontera entre Suiza y Francia. Es un anillo subterráneo de 27 kilómetros de largo donde chocan protones a casi la rapidez de la luz. En 2012 descubrió el bosón de Higgs, la pieza que faltaba y que explica por qué las partículas tienen masa. Participan miles de científicos de todo el mundo, incluidos investigadores de universidades colombianas.</p></div>
<div class="sim" data-sim="acelerador" data-title="Mini acelerador de partículas" data-goal="Ajusta la energía de los protones y el campo magnético para que el haz recorra el anillo sin chocar. Luego provoca colisiones.">
<ul><li>Para mantener el haz en el anillo: radio = energía ÷ (0,3 × campo).</li><li>Más energía necesita un campo magnético más fuerte.</li><li>Cuando el haz es estable, presiona «¡Chocar!».</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Una cámara de niebla casera" data-time="45 min" data-level="3" data-adult="1">
<ul class="mat"><li>🫙 Un frasco transparente con tapa de metal (o un acuario pequeño)</li><li>🧴 Alcohol isopropílico (≥ 90 %)</li><li>🧽 Una esponja o fieltro negro</li><li>🧊 Hielo seco (¡solo un adulto!) o varios paquetes de hielo muy frío</li><li>🔦 Una linterna potente</li><li>🧤 Guantes y gafas de seguridad</li></ul>
<ol class="steps"><li>Un adulto pega el fieltro en el fondo del frasco boca abajo (la tapa) y lo empapa de alcohol.</li><li>Pon la tapa sobre el hielo muy frío con el frasco boca abajo, de modo que el fondo (la tapa) quede frío.</li><li>Espera unos 10 minutos y alumbra de lado con la linterna en un cuarto oscuro.</li><li>Mira con paciencia: aparecen «rayitas» blancas de niebla que duran un segundo.</li></ol>
<p class="warn">El alcohol es inflamable y el hielo seco quema la piel. Un adulto debe manejarlos. No fumes ni uses fuego cerca.</p>
<p class="predict">¿Qué crees que son las rayitas?</p>
<p class="result">Aparecen trazas finas de niebla que salen de un punto y duran un instante: son las huellas de partículas (rayos cósmicos y partículas de radiactividad natural) que atraviesan la cámara.</p>
<p class="why">Las partículas con carga que atraviesan el vapor de alcohol enfriado lo ionizan y dejan una línea de gotitas, como la estela de un avión. ¡Estás viendo los rayos cósmicos que llegan del espacio!</p>
</div>
</section>

<div class="q" data-ans="0"><p>¿Qué fuerza mantiene unidos a los protones y neutrones en el núcleo?</p><ol><li>La fuerza fuerte</li><li>La gravedad</li><li>El magnetismo</li></ol><p class="why">La fuerza nuclear fuerte es la más intensa y pega el núcleo.</p></div>
