<template class="chapter-src" data-id="electromagnetismo" data-num="31" data-world="7" data-title="Electricidad + magnetismo = ¡electromagnetismo!" data-short="Electroimanes, motores, generadores y por qué llega la luz a tu casa desde una central lejana.">
<p class="lead">Durante siglos, la electricidad y el magnetismo parecían dos cosas distintas. Pero en 1820 un profesor danés descubrió algo asombroso: ¡una corriente eléctrica mueve la aguja de una brújula! Eran hermanos. Y de esa familia nacieron los motores, los generadores y casi toda la tecnología moderna.</p>

<div class="learn"><ul>
<li>Una corriente eléctrica crea un campo magnético (electroimán).</li>
<li>Un imán que se mueve cerca de un cable crea corriente (generador).</li>
<li>Con esto funcionan los motores, los parlantes, los trenes de levitación y las centrales eléctricas.</li>
<li>Los transformadores cambian el voltaje para llevar la electricidad lejos con pocas pérdidas.</li>
</ul></div>

<div class="say" data-who="chispa" data-mood="wow"><p>¡Esta es mi parte favorita! Cuando yo, la electricidad, me muevo por un cable… ¡se vuelve magnética! Y cuando el magnetismo se mueve cerca de un cable… ¡me dan ganas de correr! Somos un equipo imparable.</p></div>

<section>
<h2>Oersted y el electroimán</h2>
<div class="story" data-title="La clase de Oersted"><p>En 1820, Hans Christian Oersted daba una clase y, por casualidad, tenía una brújula cerca de un cable. Cuando conectó la corriente, ¡la aguja de la brújula se movió! Era la primera prueba de que una corriente eléctrica produce magnetismo. En pocos meses, André-Marie Ampère y otros desarrollaron la teoría.</p></div>
<p>Si enrollas un cable alrededor de un clavo de hierro y conectas una pila, el clavo se convierte en un <strong>electroimán</strong>: atrae clips como un imán, ¡pero solo mientras pasa corriente! Su fuerza aumenta si le pones más vueltas de cable o más corriente (más pilas). Los electroimanes gigantes levantan carros enteros en los chatarrales.</p>
<div class="sim" data-sim="electroiman" data-title="El electroimán" data-goal="Cambia las vueltas de cable y las pilas para levantar 8 clips o más.">
<ul><li>Más vueltas de cable, más fuerza.</li><li>Más pilas, más corriente, más fuerza (¡y el cable se calienta!).</li></ul>
</div>
</section>

<section>
<h2>Faraday y la inducción</h2>
<p>Once años después, el inglés Michael Faraday descubrió lo contrario: si mueves un imán cerca de una bobina de cable, <strong>aparece corriente eléctrica</strong> en el cable. Se llama <dfn data-def="La aparición de corriente eléctrica en un cable cuando cambia el campo magnético a su alrededor.">inducción electromagnética</dfn>. Mientras más rápido mueves el imán y más vueltas tiene la bobina, más electricidad se genera.</p>
<p>Así funcionan los <b>generadores</b>: una turbina (movida por agua, vapor o viento) hace girar imanes dentro de bobinas de cable, y se genera electricidad. Un <b>motor</b> hace lo contrario: usa la electricidad para hacer girar un eje.</p>
<div class="sim" data-sim="dinamo" data-title="La dínamo de la bicicleta" data-goal="Gira la manivela para que el LED brille con más del 50 %.">
<ul><li>Mientras más rápido giras, más voltaje se genera.</li><li>Más vueltas de bobina, más voltaje.</li><li>El sentido de giro cambia el sentido de la corriente.</li></ul>
</div>
<div class="fact"><p>Más de la mitad de la electricidad de Colombia se genera en centrales hidroeléctricas, donde el agua cae por una tubería y hace girar turbinas que mueven generadores. ¡Cada vez que prendes una luz, estás usando agua de una represa convertida en electricidad!</p></div>
</section>

<section>
<h2>Del generador a tu casa</h2>
<p>La electricidad se genera lejos y hay que transportarla por cables largos. Pero los cables se calientan y pierden energía: la pérdida depende de la <em>corriente</em> al cuadrado. La solución: subir el voltaje con un <strong>transformador</strong>. Con voltaje muy alto, la misma potencia viaja con muy poca corriente y casi no se pierde. Al llegar a tu barrio, otro transformador baja el voltaje a 120 V para que sea seguro.</p>
<div class="sim" data-sim="red-electrica" data-title="La línea de alta tensión" data-goal="Escoge el voltaje de la línea para que se pierda menos del 5 % de la energía en el camino.">
<ul><li>Con voltaje bajo, la corriente es enorme y el cable se calienta mucho.</li><li>Por eso las líneas de transmisión de larga distancia usan decenas de miles de voltios.</li></ul>
</div>
<details class="curious"><p>El transformador funciona porque la corriente alterna cambia de dirección 60 veces por segundo en Colombia (60 Hz), y eso hace que el campo magnético en el hierro del transformador cambie, induciendo voltaje en la otra bobina. La relación de voltajes es la misma que la de las vueltas de cada bobina: V₂/V₁ = N₂/N₁. Un transformador no crea energía: si sube el voltaje, baja la corriente.</p></details>
</section>

<section>
<h2>Maxwell y la luz</h2>
<p>En 1865, el escocés James Clerk Maxwell reunió todo en unas pocas ecuaciones y descubrió algo asombroso: un campo eléctrico que cambia crea un campo magnético, y uno magnético que cambia crea uno eléctrico, ¡y así se pueden empujar mutuamente y viajar por el espacio! Calculó su velocidad y resultó ser la misma de la luz. ¡La luz es una onda electromagnética! Veremos más sobre eso en el siguiente capítulo.</p>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="El electroimán de clavo" data-time="20 min" data-level="2" data-adult="1">
<ul class="mat"><li>🔩 Un clavo grande de hierro (o un tornillo largo de hierro)</li><li>🔌 1 m de alambre de cobre esmaltado delgado (de un motor viejo o electrónica)</li><li>🔋 Una o dos pilas AA (1,5 V) con su soporte</li><li>📎 Clips de metal</li></ul>
<ol class="steps"><li>Enrolla el alambre al clavo, unas 30 vueltas, todas en el mismo sentido, dejando las puntas libres.</li><li>Un adulto ayuda a quitar el esmalte de las puntas con papel de lija.</li><li>Conecta las puntas a la pila. Acerca la punta del clavo a los clips.</li><li>Desconecta la pila y mira qué pasa. Prueba con más vueltas.</li></ol>
<p class="warn">El alambre y la pila pueden calentarse. No dejes el circuito conectado más de unos segundos.</p>
<p class="predict">¿El clavo atraerá los clips cuando desconectes la pila?</p>
<p class="result">Con la pila conectada, el clavo atrae varios clips. Al desconectar, ¡los clips se caen! Con más vueltas, atrae más clips.</p>
<p class="why">La corriente en el alambre crea un campo magnético, y el hierro del clavo lo refuerza. Sin corriente, no hay campo: ¡un imán que se prende y se apaga!</p>
</div>
<div class="exp" data-title="Un cable que mueve una brújula" data-time="10 min" data-level="2" data-adult="1">
<ul class="mat"><li>🧭 Una brújula</li><li>🔌 Un cable largo</li><li>🔋 Una pila AA</li></ul>
<ol class="steps"><li>Pon la brújula sobre la mesa y espera a que apunte al norte.</li><li>Coloca el cable paralelo a la aguja de la brújula, justo encima.</li><li>Toca por un instante (1 segundo) los extremos del cable con los polos de la pila y mira la aguja. Vuelve a separar.</li></ol>
<p class="warn">No dejes el cable conectado: se calienta y la pila se gasta muy rápido.</p>
<p class="predict">¿La aguja de la brújula se moverá cuando pase la corriente?</p>
<p class="result">¡Sí! La aguja se desvía un poco cuando pasa la corriente y vuelve cuando desconectas.</p>
<p class="why">Es el experimento de Oersted: la corriente crea un campo magnético alrededor del cable, y la aguja se alinea con él.</p>
</div>
</section>

<div class="q" data-ans="2"><p>Mueves un imán dentro de una bobina de cable. ¿Qué aparece en el cable?</p><ol><li>Luz</li><li>Calor solamente</li><li>Una corriente eléctrica</li></ol><p class="why">Es la inducción electromagnética que descubrió Faraday.</p></div>
