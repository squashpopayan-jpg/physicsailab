<template class="chapter-src" data-id="moverse" data-num="4" data-world="2" data-title="Moverse: rapidez y recorrido" data-short="Qué tan rápido va algo: caracoles, guepardos, trenes y tú.">
<p class="lead">Todo se mueve: tú caminando, las nubes, la Tierra alrededor del Sol. ¿Cómo sabemos qué tan rápido va algo? ¡Con la <strong>rapidez</strong>!</p>

<div class="learn"><ul>
<li>La rapidez dice cuánto avanza algo en cada segundo, o en cada hora.</li>
<li>Rapidez = distancia ÷ tiempo.</li>
<li>Algo puede estar quieto para ti y moverse para otra persona.</li>
</ul></div>

<div class="say" data-who="newti" data-mood="wow"><p>¡Miau! ¡Bienvenido al mundo del movimiento! Yo soy Newti. Me encanta correr, saltar y, sobre todo, caer de pie. Aquí vamos a descubrir por qué se mueven las cosas.</p></div>

<section>
<h2>¿Qué es la rapidez?</h2>
<p>Si caminas 10 metros en 10 segundos, avanzas <strong>1 metro cada segundo</strong>. Esa es tu rapidez: <b>1 metro por segundo</b>, que se escribe 1 m/s. Para sacarla divides lo que recorriste entre el tiempo que tardaste.</p>
<div class="magic" data-name="Fórmula mágica de la rapidez"><big>rapidez = distancia ÷ tiempo</big>Por ejemplo: 100 m en 20 s → 100 ÷ 20 = 5 m/s</div>
<p>En las carreteras se usan los <strong>kilómetros por hora</strong> (km/h). Para pasar de m/s a km/h se multiplica por 3,6. Por ejemplo, 10 m/s son 36 km/h.</p>
<table><tr><th>Quién o qué</th><th>Rapidez aproximada</th></tr>
<tr><td>🐌 Caracol</td><td>0,013 m/s · 0,05 km/h</td></tr>
<tr><td>🐢 Tortuga gigante</td><td>0,3 m/s · 1 km/h</td></tr>
<tr><td>🚶 Persona caminando</td><td>1,4 m/s · 5 km/h</td></tr>
<tr><td>🏃 Niño corriendo</td><td>4 m/s · 14 km/h</td></tr>
<tr><td>🐎 Caballo al galope</td><td>15 m/s · 54 km/h</td></tr>
<tr><td>🐆 Guepardo</td><td>29 m/s · 105 km/h</td></tr>
</table>
<div class="fact"><p>El guepardo es el animal terrestre más veloz, pero solo puede correr tan rápido unos 20 segundos. Después se cansa. ¡Pero el halcón peregrino, cuando se lanza en picada desde el cielo, puede pasar de 300 km/h!</p></div>
<div class="sim" data-sim="carrera-animales" data-title="La gran carrera de animales" data-goal="Corre la carrera en las tres distancias y descubre cuánto tarda cada animal.">
<ul><li>El caracol tarda más de dos horas en 100 metros. ¡Por eso el video va rápido!</li><li>Mira cómo la distancia y el tiempo cambian la carrera.</li></ul>
</div>
<details class="curious"><p>La rapidez de un objeto se puede ver en una gráfica: en el eje horizontal va el tiempo y en el vertical la distancia. Si va a rapidez constante, la gráfica es una línea recta, y mientras más inclinada, más rápido. Cuando la rapidez cambia, la línea se curva. Eso se llama <strong>aceleración</strong>: lo verás en el siguiente capítulo.</p></details>
</section>

<section>
<h2>¡Eres un radar!</h2>
<p>La policía usa radares para saber qué tan rápido pasan los carros. Un radar mide el tiempo que tarda el carro entre dos puntos que están a una distancia conocida, o usa ondas. Tú puedes hacerlo con un cronómetro: ¡aquí tienes un tramo de 50 metros!</p>
<div class="sim" data-sim="radar" data-title="Radar con cronómetro" data-goal="Toca «Iniciar» cuando el carro pase el primer poste y «Parar» cuando pase el segundo. Calcula la rapidez: ¡acércate al valor real!">
<ul><li>Recuerda: rapidez = distancia ÷ tiempo, con 50 m de distancia.</li><li>Si tardó 5 segundos: 50 ÷ 5 = 10 m/s = 36 km/h.</li></ul>
</div>
</section>

<section>
<h2>¿Quieto o en movimiento?</h2>
<p>Imagina que vas sentado en un bus. Para ti, tu mochila está quieta junto a ti. Pero para alguien que esté parado en la calle, ¡tu mochila va moviéndose con el bus! Entonces, ¿quién tiene razón? <strong>Los dos.</strong> El movimiento siempre se mide <em>respecto a algo</em>.</p>
<div class="say" data-who="cosmo" data-mood="think"><p>¡Yo lo sé bien! Mientras tú lees esto, la Tierra gira y viaja alrededor del Sol a unos 30 kilómetros por segundo. ¡Estás en una nave espacial y no te habías dado cuenta!</p></div>
<div class="fact"><p>Cuando dos trenes van a la misma velocidad por vías paralelas, desde la ventana de uno parece que el otro está quieto. Hasta que uno acelera: ¡entonces parece que el tuyo se mueve hacia atrás!</p></div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="¿Qué tan rápido eres?" data-time="15 min" data-level="1">
<ul class="mat"><li>⏱️ Cronómetro (o celular)</li><li>📏 Cinta métrica o 10 pasos largos</li><li>🧂 Dos objetos para marcar (zapatos, botellas)</li><li>🧑‍🤝‍🧑 Un ayudante</li></ul>
<ol class="steps"><li>Marca un tramo de 10 metros en un patio o parque (o mide 10 pasos largos de adulto).</li><li>Tu ayudante cuenta el tiempo mientras caminas el tramo. Anótalo.</li><li>Ahora recorre el tramo corriendo. Anota el tiempo.</li><li>Calcula tus rapideces: 10 ÷ tiempo. Multiplica por 3,6 para saber cuántos km/h.</li></ol>
<p class="predict">¿Cuántas veces más rápido correrás que caminarás?</p>
<p class="result">Caminando se tardan unos 7 segundos (1,4 m/s) y corriendo unos 2,5 a 3 segundos (3,5 a 4 m/s). ¡Corriendo vas casi tres veces más rápido!</p>
<p class="why">La rapidez es la distancia dividida entre el tiempo. Si usas el mismo tramo, mientras menos tiempo tardes, mayor es tu rapidez.</p>
</div>
</section>
