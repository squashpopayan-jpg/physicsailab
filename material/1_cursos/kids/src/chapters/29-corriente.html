<template class="chapter-src" data-id="corriente" data-num="29" data-world="7" data-title="Voltaje, corriente y resistencia" data-short="El «río de electrones»: qué son los voltios, los amperios y los ohmios, y cómo usar la energía con seguridad.">
<p class="lead">Un río necesita una pendiente que lo empuje, un caudal de agua y un cauce más o menos estrecho. La electricidad es parecida: tiene <strong>voltaje</strong> (el empujón), <strong>corriente</strong> (el caudal de electrones) y <strong>resistencia</strong> (qué tan difícil es pasar).</p>

<div class="learn"><ul>
<li>El voltaje (en voltios, V) es el «empujón» que da la pila a los electrones.</li>
<li>La corriente (en amperios, A) es cuántos electrones pasan por segundo.</li>
<li>La resistencia (en ohmios, Ω) es qué tanto frena el paso de la corriente.</li>
<li>Ley de Ohm: corriente = voltaje ÷ resistencia.</li>
</ul></div>

<div class="say" data-who="chispa" data-mood="wink"><p>Imagina una manguera: el voltaje es qué tan alto está el tanque (el empujón del agua), la corriente es cuánta agua sale por segundo, y la resistencia es qué tan delgada es la manguera. ¡Con una manguera más delgada sale menos agua!</p></div>

<section>
<h2>La analogía del río</h2>
<table><tr><th>Electricidad</th><th>Río de agua</th><th>Se mide en…</th></tr>
<tr><td>Voltaje</td><td>La pendiente (qué tan alto cae)</td><td>Voltios (V)</td></tr>
<tr><td>Corriente</td><td>El caudal (litros por segundo)</td><td>Amperios (A)</td></tr>
<tr><td>Resistencia</td><td>Lo angosto y áspero del cauce</td><td>Ohmios (Ω)</td></tr></table>
<div class="magic" data-name="Ley de Ohm"><big>corriente = voltaje ÷ resistencia</big>I = V ÷ R · Una pila de 6 V con un bombillo de 20 Ω da una corriente de 0,3 A.</div>
<div class="story" data-title="Ohm y su ley"><p>En 1827, el alemán Georg Ohm descubrió que, en un alambre, la corriente es proporcional al voltaje. Al principio muchos científicos no le creyeron y hasta lo criticaron. Hoy su ley se usa en todos los aparatos eléctricos del mundo, y la unidad de resistencia lleva su nombre: el ohmio.</p></div>
<div class="sim" data-sim="rio-electrones" data-title="El río de electrones" data-goal="Escoge el voltaje y la resistencia extra para que el bombillo brille al 80–110 % de su brillo normal, ¡sin fundirse!">
<ul><li>Más voltaje, más corriente y más brillo.</li><li>Más resistencia, menos corriente.</li><li>¡Si pasa demasiada corriente, el bombillo se funde!</li></ul>
</div>
</section>

<section>
<h2>Pilas en serie y en paralelo</h2>
<p>Cuando conectas pilas <b>en serie</b> (una tras otra, + con −), sus voltajes se <em>suman</em>: 4 pilas de 1,5 V dan 6 V. Cuando las conectas <b>en paralelo</b> (+ con + y − con −), el voltaje es el mismo que el de una sola, ¡pero duran más tiempo!</p>
<div class="sim" data-sim="pilas" data-title="Armando baterías" data-goal="Enciende el bombillo de 6 V con la combinación correcta de pilas, y luego haz que el de 1,5 V dure lo más posible."></div>
</section>

<section>
<h2>La electricidad en casa y la seguridad</h2>
<p>La electricidad de la pared en Colombia es de unos <b>120 voltios</b>: ¡80 veces más que una pila! Y puede pasar por tu cuerpo, que conduce, con consecuencias muy peligrosas. Por eso las casas tienen <strong>interruptores automáticos</strong> (breakers) que cortan la corriente si pasa más de lo seguro. Cada aparato usa una potencia (en vatios o watts): potencia = voltaje × corriente. Si enchufas muchos aparatos de mucha potencia en el mismo circuito, la corriente total sube y el breaker se «salta» para evitar un incendio.</p>
<div class="sim" data-sim="enchufe" data-title="El enchufe sobrecargado" data-goal="Enchufa aparatos hasta usar entre 1500 y 1800 W sin que se dispare el breaker de 15 A.">
<ul><li>Corriente = potencia ÷ 120 V.</li><li>El breaker de 15 A aguanta como máximo 1800 W.</li></ul>
</div>
<div class="warn"><p>Nunca metas objetos en los enchufes ni juegues con cables. No toques aparatos eléctricos con las manos mojadas ni con los pies en el agua. Si ves un cable caído, aléjate y avisa a un adulto. Solo experimenta con pilas pequeñas, ¡nunca con la corriente de la pared!</p></div>
<details class="curious"><p>El voltio se llama así por Alessandro Volta, que en 1800 inventó la primera pila poniendo discos de cobre y zinc separados por papel mojado en salmuera. Antes, Luigi Galvani había visto que las patas de una rana muerta se movían al tocarlas con metales, y Volta demostró que eso era electricidad producida por los metales. La potencia se mide en vatios por James Watt, el de las máquinas de vapor.</p></details>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="La pila de limón" data-time="30 min" data-level="2">
<ul class="mat"><li>🍋 3 a 4 limones</li><li>🔩 Clavos galvanizados (de zinc) o tornillos</li><li>🪙 Monedas de cobre o trozos de alambre de cobre</li><li>🔌 Cables con pinzas</li><li>💡 Un LED rojo o una calculadora pequeña (o un multímetro)</li></ul>
<ol class="steps"><li>Clava un clavo de zinc y una moneda de cobre en cada limón, sin que se toquen.</li><li>Conecta con los cables la moneda de un limón al clavo del siguiente, formando una cadena (serie).</li><li>Conecta los extremos libres al LED (la pata larga hacia el cobre) o a un multímetro.</li></ol>
<p class="predict">¿Cuánto voltaje crees que dará un limón?</p>
<p class="result">Cada limón da cerca de 0,9 V. Con 3 o 4 limones en serie se alcanza 2,7 a 3,6 V, y un LED rojo puede encender (aunque débil) o con el multímetro mides el voltaje.</p>
<p class="why">El zinc y el cobre, en medio del ácido del limón, producen una reacción química que empuja electrones por los cables. Es una pila química, como la de Volta. En serie, los voltajes se suman.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>Una pila de 6 V se conecta a un bombillo de 20 Ω. ¿Qué corriente pasa?</p><ol><li>120 A</li><li>0,3 A</li><li>26 A</li></ol><p class="why">I = V ÷ R = 6 ÷ 20 = 0,3 A.</p></div>
<div class="q" data-ans="0"><p>Conectas 3 pilas de 1,5 V en serie. ¿Qué voltaje dan?</p><ol><li>4,5 V</li><li>1,5 V</li><li>0,5 V</li></ol><p class="why">En serie los voltajes se suman: 3 × 1,5 = 4,5 V.</p></div>
<div class="q" data-ans="2"><p>¿Por qué se «dispara» el breaker?</p><ol><li>Porque falta electricidad</li><li>Porque se aburrió</li><li>Porque pasa más corriente de la segura</li></ol><p class="why">Corta el circuito cuando la corriente es demasiado alta, para evitar sobrecalentamiento e incendios.</p></div>
<div class="q" data-ans="1"><p>Con más resistencia en un circuito (y el mismo voltaje), la corriente…</p><ol><li>Aumenta</li><li>Disminuye</li><li>No cambia</li></ol><p class="why">I = V ÷ R: más resistencia, menos corriente.</p></div>
</div>
