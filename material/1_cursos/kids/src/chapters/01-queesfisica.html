<template class="chapter-src" data-id="queesfisica" data-num="1" data-world="1" data-title="¿Qué es la física?" data-short="Preguntas, ramas de la física y el método de los científicos.">
<p class="lead">¿Por qué cae una manzana? ¿Por qué brilla el Sol? ¿Por qué suena una guitarra? La <dfn data-def="La ciencia que estudia cómo funciona la naturaleza: el movimiento, la luz, el calor, la electricidad, los átomos y el universo.">física</dfn> es la ciencia de hacerse preguntas sobre TODO lo que pasa a nuestro alrededor… ¡y encontrar las respuestas!</p>

<div class="learn"><ul>
<li>La física estudia cómo funciona el universo, de lo más pequeño a lo más grande.</li>
<li>Tiene muchas ramas, como un árbol.</li>
<li>Los científicos usan un método: preguntar, imaginar, probar, mirar y contar.</li>
</ul></div>

<div class="say" data-who="buho" data-mood="happy"><p>¡Hola, soy el Búho Sabio! Hace muchísimo tiempo, las personas miraban el cielo y se preguntaban cosas. Hoy tú vas a hacer lo mismo. ¡Bienvenido, bienvenida a la aventura de la física!</p></div>

<section>
<h2>Todo tiene una explicación</h2>
<p>Mira a tu alrededor. Una pelota rueda, el agua hierve, la luz entra por la ventana, el celular suena, la Luna sale de noche. Todo eso tiene una <strong>explicación</strong>, y buscarla es el trabajo de la física.</p>
<p>La palabra «física» viene de una palabra griega, <em>physis</em>, que quiere decir <strong>naturaleza</strong>. Los físicos y las físicas estudian la naturaleza: cómo se mueven las cosas, por qué se calientan, cómo viaja la luz y de qué están hechas.</p>
<div class="fact"><p>Hay preguntas de física muy grandes («¿cómo empezó el universo?») y muy pequeñas («¿de qué está hecho un átomo?»). ¡Y también muy cotidianas, como «¿por qué se enfría mi chocolate?»!</p></div>
<div class="say" data-who="newti" data-mood="wow"><p>¡Miau! Yo me pregunto siempre por qué los gatos caemos de pie. ¡Eso también es física!</p></div>
</section>

<section>
<h2>Las ramas de la física</h2>
<p>La física es como un árbol enorme con muchas ramas. Cada rama estudia un tipo de cosas. Tú vas a visitar <strong>diez mundos</strong>, y cada uno tiene un amigo que te guía:</p>
<div class="cols2">
<div class="card"><h4>🐱 Mecánica · Newti</h4><p>El movimiento y las fuerzas: correr, caer, empujar, girar y chocar.</p></div>
<div class="card"><h4>💧 Fluidos · Gotín</h4><p>El agua y el aire: flotar, presionar, volar.</p></div>
<div class="card"><h4>🔥 Calor · Flamo</h4><p>La temperatura, el hielo, el vapor y la energía. Se llama <em>termodinámica</em>.</p></div>
<div class="card"><h4>🔊 Ondas y sonido · Eco</h4><p>Vaivenes, olas, ecos y música. Se llama <em>acústica</em>.</p></div>
<div class="card"><h4>💡 Luz y color · Lumi</h4><p>Sombras, espejos, lentes, arcoíris. Se llama <em>óptica</em>.</p></div>
<div class="card"><h4>⚡ Electricidad y magnetismo · Chispa</h4><p>Chispas, circuitos, imanes y ondas invisibles. Se llama <em>electromagnetismo</em>.</p></div>
<div class="card"><h4>🚀 Cielo y espacio · Cosmo</h4><p>La Luna, los planetas, las estrellas y todo el universo. Se llama <em>astronomía</em> y <em>cosmología</em>.</p></div>
<div class="card"><h4>⚛️ Lo muy pequeño · Quarki</h4><p>Átomos, núcleos, física cuántica, relatividad y partículas.</p></div>
<div class="card"><h4>🌍 Tierra y vida · Terra</h4><p>Terremotos, el cuerpo, los materiales, el azar y el caos.</p></div>
<div class="card"><h4>📜 Orígenes · Búho</h4><p>La historia de la ciencia y cómo medimos el mundo.</p></div>
</div>
<div class="sim" data-sim="une-ramas" data-title="Une la pregunta con su rama" data-goal="Une cada pregunta con la rama de la física que la estudia."></div>
</section>

<section>
<h2>El método de los científicos</h2>
<p>Los científicos no adivinan: <strong>comprueban</strong>. Siguen cinco pasos, que también puedes seguir tú:</p>
<ol class="steps5">
<li><b>🤔 Pregunta.</b> Algo te llama la atención: «¿cae más rápido lo pesado?»</li>
<li><b>💭 Imagina.</b> Piensas una respuesta posible. Los científicos le llaman <dfn data-def="Una respuesta posible a una pregunta, que todavía hay que comprobar.">hipótesis</dfn>.</li>
<li><b>🧪 Prueba.</b> Haces un <dfn data-def="Una prueba que se hace a propósito para ver qué pasa y responder una pregunta.">experimento</dfn>.</li>
<li><b>👀 Mira.</b> Observas y anotas lo que pasó, sin trampa.</li>
<li><b>📣 Cuenta.</b> Compartes lo que descubriste. A veces tu idea era buena… ¡y a veces aprendes algo mejor!</li>
</ol>
<div class="fact"><p>Equivocarse no es malo en ciencia. Muchos descubrimientos empezaron con una idea que resultó ser falsa y alguien tuvo la paciencia de probarla.</p></div>
<div class="say" data-who="buho" data-mood="think"><p>Hace más de 2000 años, un sabio famoso llamado Aristóteles pensaba que las cosas pesadas siempre caen más rápido. ¿Tendría razón? ¡Probémoslo con un juego!</p></div>
<div class="sim" data-sim="predice-cae" data-title="Predice y prueba: ¿cuál llega primero?" data-goal="Elige tu predicción, suelta los objetos y mira si acertaste. ¡Acierta una vez para ganar la estrella!">
<ul><li>Prueba la bola de boliche y la pluma con aire. ¿Cuál llega primero?</li><li>Ahora cámbialo a «Sin aire»: ¡todo cae igual! Así lo comprobaron los astronautas en la Luna.</li><li>La hoja de papel y el globo caen despacio por el aire, no por ser «livianos».</li></ul>
</div>
<details class="curious"><p>La caída de los objetos depende de la <strong>resistencia del aire</strong>. Sin aire, todos los objetos caen con la misma aceleración sin importar su masa (en la Tierra, 9,8 m/s²). Galileo lo razonó hacia 1600, y en 1971 el astronauta David Scott lo mostró en la Luna soltando un martillo y una pluma: llegaron al suelo al mismo tiempo.</p></details>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="El libro y la hoja de papel" data-time="5 min" data-level="1">
<ul class="mat"><li>📖 Un libro</li><li>📄 Una hoja de papel</li></ul>
<ol class="steps"><li>Sostén el libro en una mano y la hoja en la otra, a la misma altura.</li><li>Suéltalos a la vez. ¿Cuál llega primero al suelo?</li><li>Ahora pon la hoja <b>encima del libro</b>, bien apoyada, y suéltalos juntos.</li><li>Después arruga la hoja formando una bolita y suelta la bolita y el libro.</li></ol>
<p class="predict">¿Qué crees que pasará cuando la hoja vaya encima del libro?</p>
<p class="result">La hoja sola cae despacio y el libro rápido. Pero con la hoja encima del libro, ¡caen juntos! Y la bolita de papel cae casi tan rápido como el libro.</p>
<p class="why">El aire frena más a la hoja abierta, porque tiene mucha superficie. El libro va empujando el aire y la hoja queda «escondida» detrás, sin que el aire la frene. Al arrugarla, el aire la frena mucho menos.</p>
</div>
</section>

<section>
<h2>Un poco de historia</h2>
<div class="story" data-title="Los primeros que se preguntaron">
<p>Hace unos 2600 años, en Grecia, un hombre llamado <strong>Tales de Mileto</strong> frotó un trozo de ámbar y vio que atraía pedacitos de paja. Se preguntó por qué. Era una de las primeras preguntas de electricidad. Muy lejos de allí, en otros lugares del mundo, también había gente que miraba el cielo, medía las sombras y contaba los días. La ciencia es una historia de todos los pueblos. En el capítulo 2 conocerás a muchos de ellos.</p>
</div>
</section>
