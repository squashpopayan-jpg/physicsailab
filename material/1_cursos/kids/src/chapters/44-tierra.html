<template class="chapter-src" data-id="tierra" data-num="44" data-world="10" data-title="Tierra viva: terremotos, volcanes y clima" data-short="El interior de la Tierra, las ondas de los terremotos, los volcanes de Colombia y las brisas del mar.">
<p class="lead">Vivimos sobre una gran roca que se mueve por dentro, tiembla a veces y tiene volcanes. Debajo de tus pies hay capas calientísimas, y encima hay un océano de aire con vientos y nubes. Estudiar todo eso es la <strong>geofísica</strong>: ¡la física de la Tierra!</p>

<div class="learn"><ul>
<li>La Tierra tiene capas: corteza, manto, núcleo externo (líquido) y núcleo interno (sólido).</li>
<li>Las placas de la corteza se mueven y producen terremotos y volcanes.</li>
<li>Las ondas de los terremotos nos permiten «ver» el interior de la Tierra y localizar el epicentro.</li>
<li>Los vientos como las brisas nacen de diferencias de temperatura.</li>
</ul></div>

<div class="say" data-who="terra" data-mood="wow"><p>¡Hola! Soy Terra. A veces me muevo un poquito y ustedes lo sienten como un temblor. No es que me enoje: ¡es que por dentro estoy llena de energía y calor!</p></div>

<section>
<h2>El interior de la Tierra</h2>
<p>La Tierra es como un huevo gigante, con varias capas. Nadie ha podido perforar más allá de unos 12 kilómetros (¡la Tierra tiene un radio de 6371 km!). Sabemos qué hay abajo gracias a las ondas de los terremotos.</p>
<ul>
<li><b>Corteza</b> (de 5 a 70 km): la capa delgada y sólida donde vivimos, como la cáscara de una manzana.</li>
<li><b>Manto</b> (hasta unos 2900 km): roca muy caliente que fluye lentísimo, unos centímetros por año.</li>
<li><b>Núcleo externo</b> (hasta unos 5150 km): hierro líquido que se mueve y crea el campo magnético.</li>
<li><b>Núcleo interno</b> (radio de unos 1220 km): una bola sólida de hierro y níquel a unos 5400 °C, ¡tan caliente como la superficie del Sol!, pero sólida por la enorme presión.</li>
</ul>
<div class="sim" data-sim="capas-tierra" data-title="Viaje al centro de la Tierra" data-goal="Baja por el interior de la Tierra y visita las cuatro capas.">
<ul><li>Mira cómo aumentan la temperatura y la presión con la profundidad.</li><li>En el centro, la presión es unos 3,6 millones de veces la del aire.</li></ul>
</div>
</section>

<section>
<h2>Placas, terremotos y volcanes</h2>
<p>La corteza no es una cáscara entera: está partida en grandes pedazos llamados <strong>placas tectónicas</strong>, que flotan sobre el manto y se mueven unos pocos centímetros por año (¡lo que crecen tus uñas!). Cuando se rozan, se empujan o se separan, se acumula energía en las rocas hasta que de repente se rompen y se desliza: eso es un <strong>terremoto</strong>. Algunos de esos bordes dejan salir roca derretida (magma): son los <b>volcanes</b>.</p>
<div class="fact"><p>Colombia está en una zona donde se encuentran las placas de Nazca, Suramericana y del Caribe, por eso tenemos terremotos y volcanes como el Nevado del Ruiz, el Galeras y el Puracé (cerca de Popayán). El terremoto de Popayán del 31 de marzo de 1983 ocurrió un Jueves Santo y causó mucha destrucción. Por eso es importante construir casas resistentes y estar preparados.</p></div>
<h3>Cómo se localiza un terremoto</h3>
<p>Un terremoto produce dos tipos de ondas: las <b>ondas P</b> (que van más rápido, unos 6 km/s) y las <b>ondas S</b> (más lentas, unos 3,5 km/s). Las P llegan primero y después las S. Entre más lejos esté el terremoto, más tiempo pasa entre la llegada de las dos. Con esa diferencia de tiempo en tres estaciones sismológicas, se puede encontrar el <b>epicentro</b>, el punto de la superficie justo encima del lugar donde se originó.</p>
<div class="magic" data-name="Distancia al terremoto"><big>distancia ≈ 8,4 × (tiempo S − tiempo P)</big>Con el tiempo en segundos, la distancia sale en kilómetros</div>
<div class="sim" data-sim="epicentro" data-title="¡Encuentra el epicentro!" data-goal="Con la diferencia de tiempo S–P de tres estaciones, dibuja los círculos y encuentra donde está el epicentro.">
<ul><li>Cada estación te dice cuántos segundos pasaron entre las ondas P y S.</li><li>Calcula la distancia y dibuja el círculo; el epicentro está donde se cruzan los tres.</li></ul>
</div>
<details class="curious"><p>La diferencia de tiempos entre P y S es Δt = d·(1/v<sub>S</sub> − 1/v<sub>P</sub>) = d·(1/3,5 − 1/6) = d/8,4. Por eso d = 8,4·Δt. La magnitud de un terremoto se mide con una escala logarítmica: cada punto más es unas 32 veces más energía. Las ondas S no atraviesan líquidos: gracias a eso se descubrió que el núcleo externo de la Tierra es líquido.</p></details>
</section>

<section>
<h2>El clima y las brisas</h2>
<p>Sobre la superficie hay un océano de aire que se mueve por diferencias de temperatura: el aire caliente sube y el frío baja, como en la convección que viste en el mundo del calor. En la costa, de día, la tierra se calienta más rápido que el mar (el agua cambia de temperatura más despacio), el aire caliente sube sobre la tierra y el aire fresco del mar llega a reemplazarlo: es la <strong>brisa marina</strong>. De noche pasa al revés: la tierra se enfría antes y el viento sopla de la tierra al mar.</p>
<div class="sim" data-sim="brisa-marina" data-title="La brisa de la costa" data-goal="Mira cómo cambia el viento durante el día y la noche, y encuentra la hora en que cambia de dirección.">
<ul><li>De día, el viento va del mar a la tierra; de noche, al revés.</li><li>El agua tarda mucho más en calentarse y enfriarse que la tierra.</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Edificio que resiste un terremoto" data-time="40 min" data-level="2">
<ul class="mat"><li>🍝 Espaguetis crudos</li><li>🍡 Malvaviscos o plastilina</li><li>🥣 Una bandeja con gelatina firme (o un plato con arroz)</li><li>⏱️ Reloj</li></ul>
<ol class="steps"><li>Construye una torre pegando espaguetis con malvaviscos o bolitas de plastilina. Intenta hacerla lo más alta posible.</li><li>Ponla sobre la bandeja con gelatina (que hará de suelo blando).</li><li>Sacude la bandeja suavemente de lado a lado, como un terremoto. ¿Se mantiene en pie?</li><li>Mejórala poniendo triángulos (diagonales) en las paredes y una base más ancha. Prueba otra vez.</li></ol>
<p class="predict">¿Qué diseño resistirá mejor: uno alto y estrecho o uno bajo y ancho con triángulos?</p>
<p class="result">Las torres más bajas, con base ancha y diagonales formando triángulos, resisten mucho mejor. Las altas y sin diagonales se tuercen y caen.</p>
<p class="why">Los triángulos son formas rígidas: no se deforman fácil. Los ingenieros de edificios resistentes usan diagonales y bases anchas y flexibles. Por eso en lugares con muchos temblores, las construcciones siguen normas especiales.</p>
</div>
<div class="exp" data-title="La brisa marina en una bandeja" data-time="30 min" data-level="2">
<ul class="mat"><li>🥧 Una bandeja o fuente honda</li><li>🏖️ Arena o tierra seca</li><li>💧 Agua</li><li>🌡️ Dos termómetros (opcional)</li><li>💡 Una lámpara fuerte o el Sol</li></ul>
<ol class="steps"><li>Pon arena en un lado de la bandeja y agua en el otro.</li><li>Alumbra con la lámpara o deja al Sol durante unos 15 minutos.</li><li>Mide la temperatura de la arena y la del agua (o toca con cuidado).</li></ol>
<p class="predict">¿Cuál se calentará más rápido: la arena o el agua?</p>
<p class="result">La arena se calienta mucho más rápido y llega a una temperatura mayor que el agua. Al apagar la lámpara, la arena también se enfría más rápido.</p>
<p class="why">El agua necesita mucha más energía para cambiar de temperatura (tiene mayor «calor específico»). Por eso el mar es más fresco de día y más tibio de noche que la tierra, y por eso hay brisas en la costa.</p>
</div>
</section>
