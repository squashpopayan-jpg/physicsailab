<template class="chapter-src" data-id="estrellas" data-num="35" data-world="8" data-title="Las estrellas: nacen, viven y mueren" data-short="De qué están hechas, por qué tienen colores, cómo viven y mueren, y los dibujos que forman en el cielo.">
<p class="lead">Cuando miras el cielo de noche, ves miles de puntitos brillantes. Cada uno es un <strong>Sol</strong>, muy, muy lejano. Las estrellas nacen, viven millones de años y mueren. Y de sus cenizas estamos hechos tú, yo y todo lo que nos rodea.</p>

<div class="learn"><ul>
<li>Una estrella es una bola gigante de gas que brilla porque funde hidrógeno en su centro.</li>
<li>El color de una estrella dice su temperatura: las azules son las más calientes y las rojas las más frías.</li>
<li>Las estrellas grandes viven poco y mueren en explosiones; las pequeñas viven muchísimo.</li>
<li>Casi todos los átomos de tu cuerpo se hicieron dentro de estrellas.</li>
</ul></div>

<div class="say" data-who="cosmo" data-mood="wow"><p>¡Guau! Las estrellas son mis vecinas favoritas. Aunque algunas están tan lejos que su luz tardó miles de años en llegar: ¡cuando las miras, ves el pasado!</p></div>

<section>
<h2>¿Qué es una estrella?</h2>
<p>El Sol es una estrella. Las demás estrellas se ven pequeñas solo porque están lejísimos: la más cercana después del Sol, Próxima Centauri, está a 4,2 años luz (la luz tarda 4,2 años en llegar). Una estrella es una enorme bola de gas (sobre todo hidrógeno) que la gravedad aprieta tanto que en el centro hace muchísimo calor y presión: ¡tanto que los átomos de hidrógeno se unen en átomos de helio! A esto se le llama <dfn data-def="Cuando átomos pequeños se unen para formar uno más grande y sueltan muchísima energía. Es lo que hace brillar a las estrellas.">fusión nuclear</dfn>, y suelta la energía que ves como luz.</p>
<div class="story" data-title="Cecilia Payne y de qué están hechas las estrellas"><p>En 1925, una joven astrónoma británica, Cecilia Payne, estudió la luz de las estrellas y descubrió que están hechas sobre todo de hidrógeno y helio. Era algo tan inesperado que su propio profesor le pidió que dijera que su resultado era «casi seguro un error»… ¡pero ella tenía razón! Hoy sabemos que el 98 % de lo que hay en una estrella es hidrógeno y helio.</p></div>
<h3>El color de las estrellas</h3>
<p>Un trozo de hierro, al calentarse, se pone primero rojo, luego naranja, luego amarillo y por último blanco azulado. Con las estrellas pasa igual: <b>su color depende de su temperatura</b>. Una estrella roja tiene unos 3000 °C en la superficie, el Sol (amarillo) unos 5500 °C, y una estrella azul puede pasar de 20 000 °C.</p>
<div class="sim" data-sim="color-estrella" data-title="¿De qué color es cada estrella?" data-goal="Une cada estrella con su color según su temperatura."></div>
</section>

<section>
<h2>La vida de una estrella</h2>
<p>Las estrellas nacen en nubes de gas y polvo llamadas <b>nebulosas</b>. La gravedad junta el gas, que se calienta hasta que se enciende la fusión: ¡nace una estrella! Después vive millones o miles de millones de años quemando hidrógeno. Cuando el hidrógeno del centro se acaba, la estrella cambia, y su final <strong>depende de su masa</strong>:</p>
<ul>
<li><b>Estrellas pequeñas</b> (enanas rojas): viven billones de años y se apagan despacio.</li>
<li><b>Estrellas como el Sol</b>: se hinchan hasta ser gigantes rojas, sueltan sus capas formando una nebulosa y dejan un núcleo pequeño y caliente: una <i>enana blanca</i>.</li>
<li><b>Estrellas grandes</b> (más de 8 veces el Sol): explotan como <i>supernovas</i> y dejan una estrella de neutrones.</li>
<li><b>Estrellas gigantes</b> (más de 20 veces el Sol): explotan y dejan un <i>agujero negro</i>.</li>
</ul>
<div class="sim" data-sim="vida-estrella" data-title="La vida de una estrella" data-goal="Cambia la masa de la estrella y descubre tres finales diferentes: enana blanca, estrella de neutrones y agujero negro.">
<ul><li>Mientras más masa tiene una estrella, más caliente es, más azul se ve y ¡menos vive!</li><li>El Sol vivirá unos 10 000 millones de años; una estrella 20 veces más grande, solo unos 10 millones.</li></ul>
</div>
<div class="fact"><p>Dentro de las estrellas se fabrican los átomos más pesados: el carbono, el oxígeno, el calcio, el hierro… Cuando una estrella explota, esos átomos se esparcen por el espacio y con ellos se forman nuevas estrellas, planetas y hasta personas. Casi todos los átomos de tu cuerpo estuvieron alguna vez dentro de una estrella: ¡eres polvo de estrellas!</p></div>
<details class="curious"><p>El tiempo de vida de una estrella en la secuencia principal es aproximadamente t ≈ 10 000 millones de años × (M/M☉)<sup>−2,5</sup>. Por eso una estrella de 10 masas solares vive solo unos 30 millones de años. Los agujeros negros tienen tanta gravedad que ni la luz puede escapar. El primero que se «fotografió» fue el del centro de la galaxia M87, en 2019; en 2022 se obtuvo la imagen del que hay en el centro de nuestra galaxia, la Vía Láctea.</p></details>
</section>

<section>
<h2>Las constelaciones</h2>
<p>Desde hace miles de años, los pueblos de todo el mundo conectaron las estrellas con líneas imaginarias para dibujar figuras: las <strong>constelaciones</strong>. Sirven como mapa del cielo. Cada cultura las veía distinto: los griegos veían a Orión el cazador, y los pueblos andinos veían animales en las manchas oscuras de la Vía Láctea. En Colombia podemos ver Orión, la Cruz del Sur y las siete estrellas de la Osa Mayor.</p>
<div class="sim" data-sim="constelaciones" data-title="Conecta las estrellas" data-goal="Toca las estrellas en orden (1, 2, 3…) para dibujar la Cruz del Sur, Orión y la Osa Mayor.">
<ul><li>Las estrellas de una constelación no están juntas: solo se ven juntas desde la Tierra, pero pueden estar a distancias enormes.</li><li>La Cruz del Sur sirve para encontrar el sur.</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Un planetario casero" data-time="30 min" data-level="1" data-adult="1">
<ul class="mat"><li>🥤 Un vaso o tubo de cartón opaco</li><li>🪡 Una aguja o chinche (¡con adulto!)</li><li>🔦 Una linterna</li><li>🗺️ Dibujo de una constelación (Orión, Cruz del Sur)</li><li>📄 Papel de aluminio</li></ul>
<ol class="steps"><li>Dibuja en un círculo de papel la constelación que quieras.</li><li>Pega el papel sobre el fondo del vaso y, con la aguja, un adulto hace un agujerito en cada estrella (los lugares marcados).</li><li>En una habitación oscura, pon la linterna por el lado abierto del vaso y alumbra la pared por los agujeritos.</li></ol>
<p class="predict">¿Qué verás en la pared?</p>
<p class="result">La pared se llena de puntitos de luz que forman la constelación. Si los agujeros son de distinto tamaño, tendrás estrellas más brillantes y más tenues.</p>
<p class="why">Cada agujero deja pasar un rayito de luz en línea recta. Las estrellas brillan más por su tamaño y su distancia: las más grandes y cercanas se ven más brillantes.</p>
</div>
</section>
