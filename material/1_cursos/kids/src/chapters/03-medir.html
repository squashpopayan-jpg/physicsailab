<template class="chapter-src" data-id="medir" data-num="3" data-world="1" data-title="Medir el mundo" data-short="Metros, kilos y segundos: cómo medimos, y qué tan grande o pequeño es todo.">
<p class="lead">Para saber cuánto, cuánto pesa o cuánto dura algo, hay que <strong>medir</strong>. Medir es comparar con algo que todos conocemos. ¡Y la física no puede vivir sin medir!</p>

<div class="learn"><ul>
<li>Medimos longitud, masa y tiempo con metros, kilogramos y segundos.</li>
<li>Todos usamos las mismas unidades para entendernos.</li>
<li>El universo tiene cosas desde ultra pequeñas hasta gigantescas.</li>
</ul></div>

<div class="say" data-who="buho" data-mood="think"><p>Hace mucho, cada pueblo medía con su propio «palmo» o su «paso». ¡Y todos eran distintos! Imagina comprar tela y que el vendedor tenga las manos más pequeñas que las tuyas…</p></div>

<section>
<h2>Las tres medidas básicas</h2>
<div class="cols3">
<div class="card"><div class="big-emoji">📏</div><h4>Longitud</h4><p>¿Qué tan largo? Se mide en <dfn data-def="La unidad de longitud. Más o menos lo que mide una zancada grande de una persona.">metros</dfn> (m). Un metro tiene 100 centímetros (cm) y 1000 milímetros (mm).</p></div>
<div class="card"><div class="big-emoji">⚖️</div><h4>Masa</h4><p>¿Cuánta materia tiene? Se mide en <dfn data-def="La unidad de masa. Un litro de agua tiene una masa de casi un kilogramo.">kilogramos</dfn> (kg). Un kilo tiene 1000 gramos (g).</p></div>
<div class="card"><div class="big-emoji">⏱️</div><h4>Tiempo</h4><p>¿Cuánto dura? Se mide en <dfn data-def="La unidad de tiempo. Es más o menos lo que tarda un latido de tu corazón.">segundos</dfn> (s). Un minuto tiene 60 segundos.</p></div>
</div>
<div class="fact"><p>El metro se inventó en Francia hace más de 200 años para que todo el mundo midiera igual. Hoy, el segundo se mide con relojes atómicos tan exactos que no se atrasan ni un segundo en millones de años.</p></div>
<div class="say" data-who="newti" data-mood="happy"><p>Un truco: una hoja de cuaderno mide casi 30 cm de largo, ¡y una puerta mide cerca de 2 metros!</p></div>
<div class="sim" data-sim="estima-largo" data-title="Adivina cuánto mide" data-goal="Mira la barra y adivina cuántos centímetros mide. ¡Acierta 3 de 5!">
<ul><li>Usa la regla pequeña de arriba para comparar: mide justo 5 cm.</li><li>Una buena adivinanza no tiene que ser perfecta: ¡basta acercarse un poquito!</li></ul>
</div>
</section>

<section>
<h2>¿Qué tan grande es todo?</h2>
<p>Hay cosas diminutas, como un átomo, y cosas gigantes, como una galaxia. Para hablar de ellas, los científicos usan los <strong>poderes de diez</strong>: cada paso es 10 veces más grande. Un metro es 10 veces mayor que 10 centímetros. Y 10 metros es 10 veces más que 1 metro.</p>
<div class="say" data-who="cosmo" data-mood="wow"><p>¡Guau! Con solo 40 pasos de «diez veces más grande» vamos de un átomo al universo entero.</p></div>
<div class="sim" data-sim="escalas" data-title="Viaje por los tamaños" data-goal="Mueve la barra para recorrer los tamaños. ¡Encuentra 8 cosas distintas!">
<ul><li>Llega hasta la izquierda: ¡las cosas más pequeñitas!</li><li>Y hasta la derecha: ¡lo más inmenso!</li></ul>
</div>
<details class="curious"><p>Para escribir números enormes o diminutos se usa la <strong>notación científica</strong>: 10<sup>3</sup> es 1000, 10<sup>6</sup> es un millón. Y 10<sup>−3</sup> es una milésima: 0,001. Cada «escalón» del exponente multiplica por diez. Un átomo mide unos 10<sup>−10</sup> m y el universo observable, unos 10<sup>27</sup> m: ¡37 escalones de diferencia!</p></details>
</section>

<section>
<h2>Medir el tiempo: ¡tus reflejos!</h2>
<p>El tiempo se mide con relojes y cronómetros. Cuando algo pasa muy rápido, como el parpadeo de un ojo, usamos <strong>milisegundos</strong> (ms): una milésima de segundo. Una persona tarda más o menos <strong>0,2 a 0,3 segundos</strong> en reaccionar a una luz: eso son 200 a 300 ms.</p>
<div class="sim" data-sim="reflejos" data-title="¿Qué tan rápidos son tus reflejos?" data-goal="Espera a que la pantalla se ponga verde y toca lo más rápido que puedas. ¡Baja de 350 milisegundos!">
<ul><li>Si tocas antes de tiempo, ¡pierdes ese intento!</li><li>Las personas que juegan videojuegos o practican deportes suelen reaccionar más rápido.</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Mide con tu cuerpo" data-time="15 min" data-level="1">
<ul class="mat"><li>🛋️ Una mesa o una cama</li><li>📏 Una regla o cinta métrica</li><li>🧑‍🤝‍🧑 Un amigo o familiar</li></ul>
<ol class="steps"><li>Mide el largo de la mesa con tus <b>palmos</b> (con la mano abierta, de la punta del pulgar a la del meñique). Cuenta cuántos son.</li><li>Pide a un amigo o familiar que también la mida con sus palmos.</li><li>Ahora mídela con <b>pasos</b> (pie con pie) y con la regla en centímetros.</li><li>Compara todos los números.</li></ol>
<p class="predict">¿Tu amigo y tú obtendrán el mismo número de palmos?</p>
<p class="result">Los números de palmos y de pasos son distintos, porque las manos y los pies de cada persona no miden igual. Pero con la regla ¡todos obtienen los mismos centímetros!</p>
<p class="why">Por eso los científicos usan unidades iguales para todos: el metro, el kilogramo y el segundo. Así, un resultado en Popayán se entiende igual en Japón.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>¿En qué unidad se mide la longitud?</p><ol><li>Kilogramos</li><li>Metros</li><li>Segundos</li></ol><p class="why">La longitud se mide en metros. Los kilogramos son para la masa y los segundos para el tiempo.</p></div>
<div class="q" data-ans="2"><p>¿Cuántos centímetros tiene un metro?</p><ol><li>10</li><li>50</li><li>100</li></ol><p class="why">1 metro = 100 centímetros.</p></div>
<div class="q" data-ans="0"><p>¿Qué es más grande?</p><ol><li>Una bacteria</li><li>Un átomo</li><li>Un protón</li></ol><p class="why">Una bacteria tiene millones de átomos. Un átomo es muchísimo más grande que su propio núcleo, y el protón está dentro del núcleo.</p></div>
<div class="q" data-ans="1"><p>¿Por qué usamos las mismas unidades en todo el mundo?</p><ol><li>Porque es más bonito</li><li>Para que todos midamos igual y nos entendamos</li><li>Porque lo mandó un rey</li></ol><p class="why">Así los resultados se pueden comparar sin confusiones.</p></div>
</div>
