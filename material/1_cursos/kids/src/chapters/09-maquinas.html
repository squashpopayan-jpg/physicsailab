<p class="lead">¿Puede un niño levantar un piano? ¡Con la ayuda de la física, casi! Las <strong>máquinas simples</strong> son inventos muy antiguos que nos permiten hacer el trabajo con menos fuerza. Existen desde hace miles de años y están en todas partes.</p>

<div class="learn"><ul>
<li>Una máquina simple cambia la fuerza o la dirección que necesitas.</li>
<li>Las palancas funcionan por el giro: importa qué tan lejos del centro empujas.</li>
<li>Una polea con varias cuerdas divide el peso entre ellas.</li>
<li>Lo que ahorras en fuerza lo pagas en distancia.</li>
</ul></div>

<div class="say" data-who="newti" data-mood="wink"><p>¿Alguna vez has abierto una lata con una cuchara? ¡Eso es una palanca! ¿Y has usado un sube y baja? ¡También!</p></div>

<section>
<h2>Las máquinas simples</h2>
<div class="cols3">
<div class="card"><div class="big-emoji">⚖️</div><h4>Palanca</h4><p>Una barra que gira sobre un punto: balancín, tijeras, carretilla, abrelatas.</p></div>
<div class="card"><div class="big-emoji">🏗️</div><h4>Polea</h4><p>Una rueda con cuerda: grúas, banderas, pozos.</p></div>
<div class="card"><div class="big-emoji">📐</div><h4>Plano inclinado</h4><p>Una rampa: subir una moto a un camión es más fácil con rampa.</p></div>
<div class="card"><div class="big-emoji">🛞</div><h4>Rueda y eje</h4><p>La rueda reduce la fricción: bicicletas, carros, perillas de puertas.</p></div>
<div class="card"><div class="big-emoji">🪓</div><h4>Cuña</h4><p>Se mete entre dos cosas para separarlas: cuchillos, hachas, clavos.</p></div>
<div class="card"><div class="big-emoji">🔩</div><h4>Tornillo</h4><p>Una rampa enrollada: tornillos, tapas de frascos, gatos de carro.</p></div>
</div>
<div class="story" data-title="«Dadme un punto de apoyo…»"><p>Arquímedes, el sabio de Siracusa, decía que con una palanca suficientemente larga y un punto de apoyo podría mover el mundo. No es del todo cierto en la práctica (¡la palanca tendría que ser larguísima!), pero la idea es correcta: <strong>una palanca larga multiplica tu fuerza</strong>.</p></div>
</section>

<section>
<h2>La palanca y el balancín</h2>
<p>En un balancín (o sube y baja), el punto de apoyo está en el centro. Lo que hace girar el balancín no es solo el peso, sino también <strong>qué tan lejos del centro</strong> está. Un niño liviano sentado muy lejos del centro puede equilibrar a uno más pesado sentado cerca.</p>
<div class="magic" data-name="La regla del balancín"><big>peso × distancia = peso × distancia</big>Cuando son iguales a cada lado, el balancín queda derecho.</div>
<div class="sim" data-sim="balancin" data-title="Equilibra el balancín" data-goal="Pon un peso a cada lado, a distancias distintas, para que el balancín quede derecho.">
<ul><li>Prueba con 40 kg a 1 m y 20 kg a 2 m: ¡quedan equilibrados!</li><li>Un peso más lejos del centro «pesa» más para el balancín.</li></ul>
</div>
<details class="curious"><p>A ese efecto de giro se le llama <strong>torque</strong> o momento de una fuerza: es la fuerza multiplicada por la distancia al punto de giro (τ = F·d). El balancín queda en equilibrio cuando el torque hacia un lado es igual al del otro lado. Lo usan los ingenieros para diseñar grúas, puentes y hasta tu cuerpo funciona así: los músculos y huesos son palancas.</p></details>
</section>

<section>
<h2>Las poleas: dividir el peso</h2>
<p>Una polea fija solo cambia la dirección del tirón (jalar hacia abajo para subir algo). Pero si usas varias cuerdas que sostienen la carga, ¡el peso se reparte! Con 4 cuerdas, cada una sostiene solo la cuarta parte. Pero hay un precio: debes jalar 4 veces más cuerda.</p>
<div class="magic" data-name="Poleas"><big>fuerza = peso ÷ número de cuerdas</big>pero jalas más cuerda: distancia × número de cuerdas</div>
<div class="sim" data-sim="poleas" data-title="Levanta el piano con poleas" data-goal="Newti puede jalar con 250 N. ¡Elige la polea para levantar un piano de 100 kg o más!">
<ul><li>Fíjate: más cuerdas significa menos fuerza, pero más cuerda que jalar.</li><li>El trabajo (fuerza × distancia) es casi el mismo: ¡no hay almuerzo gratis!</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Una balanza con una regla" data-time="15 min" data-level="2">
<ul class="mat"><li>📏 Una regla de 30 cm</li><li>✏️ Un lápiz redondo</li><li>🪙 Monedas iguales (10 o más)</li></ul>
<ol class="steps"><li>Pon el lápiz en el suelo y apoya la regla sobre él, justo en la marca de 15 cm: ¡queda como un balancín!</li><li>Pon 2 monedas apiladas a 5 cm del centro, a la izquierda.</li><li>Pon monedas a la derecha hasta lograr el equilibrio, a 5 cm del centro. ¿Cuántas hacen falta?</li><li>Ahora pon las monedas de la derecha a 10 cm del centro. ¿Cuántas hacen falta?</li></ol>
<p class="predict">Si pones las monedas al doble de distancia, ¿cuántas necesitas?</p>
<p class="result">A 5 cm necesitas 2 monedas (igual que a la izquierda); a 10 cm necesitas solo 1 moneda. ¡Al doble de distancia, la mitad de peso!</p>
<p class="why">Lo que equilibra es peso × distancia: 2 × 5 = 10 y 1 × 10 = 10. Así funcionan las balanzas antiguas y las palancas.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>Un niño liviano se sienta lejos del centro de un balancín. Otro más pesado, cerca del centro. ¿Puede quedar equilibrado?</p><ol><li>Nunca</li><li>Sí, si el peso × la distancia es igual a cada lado</li><li>Solo si pesan lo mismo</li></ol><p class="why">Lo importante es el peso multiplicado por la distancia al centro.</p></div>
<div class="q" data-ans="2"><p>Una polea con 4 cuerdas sostiene una carga de 400 N. ¿Qué fuerza debes hacer?</p><ol><li>400 N</li><li>200 N</li><li>100 N</li></ol><p class="why">400 ÷ 4 = 100 N. Pero tienes que jalar 4 veces más cuerda.</p></div>
<div class="q" data-ans="0"><p>¿Cuál de estas cosas es una palanca?</p><ol><li>Unas tijeras</li><li>Un globo</li><li>Un vaso</li></ol><p class="why">Las tijeras son dos palancas unidas por el tornillo del centro.</p></div>
<div class="q" data-ans="1"><p>¿Qué se paga cuando una máquina simple reduce la fuerza?</p><ol><li>Nada: es gratis</li><li>Se recorre más distancia</li><li>Se pierde la masa</li></ol><p class="why">Ahorras fuerza pero debes mover más distancia: el trabajo casi no cambia.</p></div>
