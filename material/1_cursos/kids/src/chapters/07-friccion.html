<template class="chapter-src" data-id="friccion" data-num="7" data-world="2" data-title="La fricción: frenar y agarrar" data-short="Por qué las cosas se detienen, por qué resbalas en el hielo y cómo frena un carro.">
<p class="lead">Si empujas un carrito de juguete por el piso, se detiene solito. ¿Quién lo frena? Una fuerza muy común y muy importante: la <strong>fricción</strong>.</p>

<div class="learn"><ul>
<li>La fricción es una fuerza que aparece cuando dos cosas se rozan y se opone al movimiento.</li>
<li>Depende de qué superficies se tocan: hielo resbala, goma agarra.</li>
<li>Sin fricción no podrías caminar ni frenar un carro.</li>
</ul></div>

<div class="say" data-who="newti" data-mood="happy"><p>Los gatos tenemos almohadillas en las patas para agarrar bien. ¡Eso es fricción a nuestro favor! Con patines, en cambio, resbalas más que cualquiera.</p></div>

<section>
<h2>¿Qué es la fricción?</h2>
<p>Si miras con un microscopio una superficie que parece lisa, verás montañitas y huecos diminutos. Cuando dos superficies se frotan, sus montañitas se enredan y se resisten a deslizar. Esa resistencia es la <dfn data-def="La fuerza que aparece cuando dos superficies se rozan y que se opone al movimiento.">fricción</dfn>.</p>
<ul>
<li><b>Es útil:</b> te permite caminar, agarrar un vaso, frenar una bicicleta y que las llantas no resbalen.</li>
<li><b>Es molesta:</b> desgasta los zapatos, calienta las cosas y gasta energía. Por eso se usa aceite en las máquinas.</li>
</ul>
<div class="fact"><p>Cuando frotas tus manos, se calientan por la fricción. ¡Así los primeros humanos hacían fuego frotando palos!</p></div>
<div class="sim" data-sim="rampa-materiales" data-title="La rampa de los materiales" data-goal="Sube la rampa poco a poco y encuentra el ángulo justo en que el bloque empieza a deslizarse.">
<ul><li>En el hielo el bloque se desliza con casi nada de inclinación.</li><li>En la goma o la lija tienes que inclinar mucho más.</li><li>Mira las flechas: el peso lo jala hacia abajo y la fricción lo sujeta.</li></ul>
</div>
<details class="curious"><p>La fuerza de fricción máxima es proporcional a la fuerza con que las superficies se aprietan: f = μ·N, donde μ (se lee «mu») es el <strong>coeficiente de fricción</strong>. En una rampa, el bloque empieza a deslizar cuando la tangente del ángulo supera a μ. Por ejemplo, para μ = 0,4 el ángulo crítico es unos 22°. Así se puede medir μ con solo una rampa y un transportador.</p></details>
</section>

<section>
<h2>La fricción y la seguridad en la calle</h2>
<p>Cuando un conductor ve un peligro, primero pasa un tiempo de <strong>reacción</strong> (cerca de 1 segundo) en el que el carro sigue a la misma rapidez. Después frena. La distancia de frenado depende mucho de la rapidez: si duplicas la rapidez, ¡frenar cuesta 4 veces más distancia! Y si el piso está mojado, la fricción es menor y se necesita más espacio.</p>
<div class="say" data-who="buho" data-mood="think"><p>Por eso hay límites de velocidad cerca de los colegios y parques. ¡Van de la mano de la física!</p></div>
<div class="sim" data-sim="frenado" data-title="¡Frena antes del cono!" data-goal="Elige la rapidez y el piso. Frena sin chocar con el cono yendo a 40 km/h o más.">
<ul><li>Fíjate: mojado y hielo necesitan mucho más espacio para frenar.</li><li>La distancia total es: reacción + frenado.</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="La rampa y la moneda" data-time="15 min" data-level="2">
<ul class="mat"><li>📖 Un libro grande o una tabla</li><li>🪙 Una moneda</li><li>🧽 Un trozo de tela</li><li>📄 Papel de lija o cartón rugoso</li><li>📚 Otros libros para subir la rampa</li></ul>
<ol class="steps"><li>Apoya el libro como una rampa, con un extremo en el piso y el otro en una pila de libros pequeña.</li><li>Pon la moneda arriba. Si no se desliza, sube un poco la pila.</li><li>Sigue subiendo hasta que la moneda empiece a deslizar. Anota cuántos libros usaste.</li><li>Repite pegando antes la tela y luego la lija sobre la rampa.</li></ol>
<p class="predict">¿Con qué superficie hará falta una rampa más inclinada?</p>
<p class="result">Con la lija (o la tela) hace falta una rampa mucho más inclinada que con el libro liso. ¡Con una superficie mojada y lisa la moneda resbala casi enseguida!</p>
<p class="why">Cada superficie tiene su propia fricción. Cuando la rampa se inclina, el peso jala la moneda hacia abajo, y cuando supera a la fricción, empieza a deslizarse.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="0"><p>¿Qué hace la fricción?</p><ol><li>Se opone al movimiento entre superficies que se rozan</li><li>Hace que las cosas floten</li><li>Hace que todo caiga</li></ol><p class="why">La fricción se opone al deslizamiento y por eso frena las cosas.</p></div>
<div class="q" data-ans="2"><p>¿Sobre cuál superficie resbalas más?</p><ol><li>Goma</li><li>Madera</li><li>Hielo</li></ol><p class="why">El hielo casi no tiene fricción, por eso patinamos tan fácil.</p></div>
<div class="q" data-ans="1"><p>Un carro va al doble de rapidez. ¿Cuánto espacio necesita para frenar (sin contar la reacción)?</p><ol><li>El doble</li><li>Cuatro veces</li><li>La mitad</li></ol><p class="why">La distancia de frenado crece con el cuadrado de la rapidez: el doble de rapidez, cuatro veces más distancia.</p></div>
<div class="q" data-ans="1"><p>¿Por qué se calientan las manos al frotarlas?</p><ol><li>Por la gravedad</li><li>Por la fricción</li><li>Por el aire</li></ol><p class="why">La fricción convierte parte del movimiento en calor.</p></div>
</div>
