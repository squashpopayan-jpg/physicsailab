<template class="chapter-src" data-id="cuantico" data-num="40" data-world="9" data-title="El mundo cuántico" data-short="Partículas que también son ondas, la luz en paquetitos, átomos con escalones y lo rarísimo de lo muy pequeño.">
<p class="lead">En el mundo de lo diminuto —átomos, electrones, luz— las reglas son muy distintas a las de nuestra vida diaria. Una pelota hace lo que se espera; un electrón hace cosas que parecen magia. A esa física se le llama <strong>física cuántica</strong>, y gracias a ella existen los celulares, los láseres y los computadores.</p>

<div class="learn"><ul>
<li>La energía viene en paquetitos llamados cuantos; la luz está hecha de fotones.</li>
<li>Los electrones en un átomo solo pueden tener ciertos niveles de energía, como los escalones de una escalera.</li>
<li>Las partículas diminutas se comportan a veces como ondas y a veces como bolitas.</li>
<li>No se puede conocer exactamente a la vez dónde está un electrón y a qué rapidez va.</li>
</ul></div>

<div class="say" data-who="quarki" data-mood="wow"><p>¡Atención! Aquí mis primos los electrones se portan de forma muy rara. Los científicos tardaron años en aceptarlo, y todavía hoy ¡siguen sorprendiéndose! Mantén la mente abierta.</p></div>

<section>
<h2>La luz viene en paquetitos</h2>
<p>En 1900, el alemán Max Planck descubrió que, para explicar cómo brillan las cosas calientes, la energía tenía que soltarse en <b>paquetitos</b>, no de manera continua. Cinco años después Albert Einstein usó esa idea para explicar algo curioso: el <dfn data-def="Cuando la luz arranca electrones de un metal. Solo funciona si cada fotón tiene suficiente energía.">efecto fotoeléctrico</dfn>. Si iluminas un metal con luz azul o ultravioleta, saltan electrones del metal. Pero con luz roja, por muy intensa que sea, ¡no sale ni uno! Einstein lo explicó: la luz está hecha de partículas llamadas <strong>fotones</strong>, y cada fotón tiene una energía que depende de su color (de su frecuencia). Un fotón rojo no tiene energía suficiente para sacar un electrón; uno ultravioleta sí. Por esto ganó el Premio Nobel de 1921.</p>
<div class="magic" data-name="La energía de un fotón"><big>mayor frecuencia = más energía</big>Fotón azul &gt; fotón rojo · ultravioleta &gt; azul</div>
<div class="sim" data-sim="fotoelectrico" data-title="El efecto fotoeléctrico" data-goal="Ilumina el metal: comprueba que mucha luz roja no saca electrones, pero un poco de luz ultravioleta sí.">
<ul><li>Cambia el color (la longitud de onda) y la intensidad de la luz.</li><li>La intensidad da más fotones; el color da la energía de cada uno.</li></ul>
</div>
<div class="fact"><p>Los paneles solares y las cámaras de los celulares funcionan por el efecto fotoeléctrico: la luz saca electrones de un material (el silicio) y se produce corriente eléctrica. ¡Una idea de Einstein de 1905 está en tu bolsillo!</p></div>
</section>

<section>
<h2>Los átomos tienen escalones de energía</h2>
<p>En 1913, el danés Niels Bohr propuso que los electrones de un átomo solo pueden estar en ciertos «pisos» de energía, como los pisos de un edificio: no puedes quedarte entre dos pisos. Cuando un electrón baja de un piso alto a uno más bajo, suelta un <strong>fotón</strong> con justo la energía de la diferencia. Como cada elemento tiene sus propios pisos, cada uno emite colores (líneas) característicos: ¡una huella digital de luz! Así sabemos de qué están hechas las estrellas.</p>
<div class="sim" data-sim="niveles-hidrogeno" data-title="Los saltos del electrón en el hidrógeno" data-goal="Haz que el electrón baje de nivel y produzca luz roja, luz azul-verdosa y luz violeta.">
<ul><li>Cuando baja al nivel 2 (serie de Balmer) la luz es visible.</li><li>Cuando baja al nivel 1, la luz es ultravioleta (invisible).</li><li>Mientras más largo el salto, más energía y color más violeta.</li></ul>
</div>
<details class="curious"><p>Para el hidrógeno, la energía de cada nivel es E<sub>n</sub> = −13,6 eV / n². Un salto de n = 3 a n = 2 libera 1,89 eV: luz roja de 656 nm, la línea «H-alfa». Las lámparas de neón, las de sodio de las calles y los fuegos artificiales brillan con los colores de sus propios átomos. ¡Un espectroscopio los separa y sirve para identificar el elemento!</p></details>
</section>

<section>
<h2>¿Onda o partícula?</h2>
<p>La luz parece una onda (se difracta, hace interferencia) pero también se comporta como partículas (fotones). Y en 1924, Louis de Broglie propuso que <em>las partículas también son ondas</em>. Pocos años después, se comprobó con electrones. El experimento más famoso es el de la <strong>doble rendija</strong>: si disparas electrones, uno por uno, contra una pared con dos rendijas, cada uno llega a la pantalla en un punto, como una bolita. Pero al acumular muchos, ¡se forma un patrón de franjas de interferencia, como si cada electrón hubiera pasado por las dos rendijas a la vez!</p>
<p>Y lo más raro: si intentas <em>observar</em> por cuál rendija pasa cada electrón, el patrón de franjas desaparece y quedan solo dos montoncitos, como si fueran bolitas.</p>
<div class="sim" data-sim="doble-rendija" data-title="Electrones y dos rendijas" data-goal="Dispara electrones uno por uno, mira cómo se forma un patrón de franjas y luego mira qué pasa si observas por cuál rendija pasan.">
<ul><li>Cada punto es un electrón que llegó a la pantalla.</li><li>Con muchos electrones, aparecen franjas: ¡un patrón de onda!</li><li>Activa «observar» y el patrón de franjas desaparece.</li></ul>
</div>
<div class="story" data-title="La incertidumbre de Heisenberg"><p>En 1927, Werner Heisenberg descubrió que hay un límite en la naturaleza: <b>no se puede conocer con exactitud, al mismo tiempo, la posición y la rapidez de una partícula pequeña</b>. No es un problema de los aparatos: es así el mundo. Mientras con más precisión sabes dónde está un electrón, menos sabes a qué rapidez va, y al revés. Se llama el principio de incertidumbre.</p></div>
<div class="story" data-title="El gato de Schrödinger"><p>Erwin Schrödinger imaginó en 1935 un experimento <em>pensado</em> (no real): un gato en una caja con un mecanismo que depende de un átomo que puede decaer o no. Según la física cuántica, mientras no se mide, el átomo está en una «mezcla» de las dos posibilidades. Schrödinger quería mostrar lo extraño que sonaba esto aplicado a algo grande como un gato. ¡Ningún gato real fue maltratado! El experimento sirve para pensar sobre cómo conectamos el mundo cuántico con el mundo de todos los días.</p></div>
</section>

<section>
<h2>La cuántica en tu vida</h2>
<p>La física cuántica no es solo rara: es útil. Gracias a ella existen los <b>transistores</b> (los chips de los celulares), los <b>LED</b> y las pantallas, los <b>láseres</b> (lectores de códigos, cirugía, internet por fibra), los <b>paneles solares</b>, las <b>resonancias magnéticas</b> de los hospitales y los relojes atómicos del GPS. Y se están construyendo <b>computadores cuánticos</b> que podrían resolver problemas imposibles para los de hoy.</p>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Un espectroscopio con un CD" data-time="40 min" data-level="2" data-adult="1">
<ul class="mat"><li>📦 Una caja pequeña de cartón (o un tubo)</li><li>💿 Un trozo de CD o DVD sin etiqueta</li><li>✂️ Tijeras o bisturí (¡adulto!)</li><li>🩹 Cinta negra</li><li>🔦 Fuentes de luz: bombillo incandescente, bombillo LED, tubo fluorescente (¡nunca el Sol directo!)</li></ul>
<ol class="steps"><li>Un adulto hace una rendija muy delgada en un extremo de la caja (con dos hojas de afeitar o cinta negra).</li><li>En el otro extremo, haz una ventanita para el ojo y pega adentro el trozo de CD inclinado unos 45°.</li><li>Apunta la rendija hacia la luz de una lámpara y mira por la ventana: verás los colores separados.</li><li>Compara los espectros de un bombillo incandescente, un LED y un fluorescente.</li></ol>
<p class="warn">No apuntes jamás el espectroscopio directamente hacia el Sol.</p>
<p class="predict">¿Todas las luces mostrarán un arcoíris continuo?</p>
<p class="result">El bombillo incandescente da un arcoíris continuo. El tubo fluorescente muestra unas pocas líneas brillantes (verde, azul, rojo). El LED muestra picos más anchos.</p>
<p class="why">Cada material emite colores propios según sus «escalones» de energía. El fluorescente tiene gas de mercurio, con líneas definidas. Así los científicos identifican de qué están hechas las estrellas.</p>
</div>
</section>
