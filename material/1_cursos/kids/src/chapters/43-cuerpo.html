<template class="chapter-src" data-id="cuerpo" data-num="43" data-world="10" data-title="La física de tu cuerpo y de los animales" data-short="Palancas en tus brazos, el equilibrio, el corazón, y los superpoderes de los animales.">
<p class="lead">Tu cuerpo es una máquina física increíble: tus huesos son palancas, tu corazón es una bomba, tus ojos son cámaras y tus nervios llevan electricidad. Y los animales tienen «superpoderes» que usan física que nosotros apenas empezamos a entender. ¡Vamos a explorarlos con Terra!</p>

<div class="learn"><ul>
<li>Los huesos y músculos funcionan como palancas.</li>
<li>Algo se mantiene en equilibrio si su centro de gravedad está sobre su apoyo.</li>
<li>El corazón es una bomba que mueve la sangre usando presión.</li>
<li>Muchos animales detectan ondas y campos que nosotros no sentimos.</li>
</ul></div>

<div class="say" data-who="terra" data-mood="happy"><p>¡Hola! Soy Terra, el planeta Tierra, y estoy lleno de vida. Cada ser vivo es un experimento de física que lleva millones de años funcionando. ¡Empecemos por tu propio cuerpo!</p></div>

<section>
<h2>Tu brazo es una palanca</h2>
<p>Cuando levantas algo con la mano, el hueso del antebrazo funciona como una <strong>palanca</strong>: el codo es el punto de apoyo y el bíceps (el músculo) jala del hueso a unos 4 centímetros del codo. Pero la mano está a unos 30 centímetros del codo. Como la carga está mucho más lejos del apoyo que el músculo, ¡el músculo debe hacer una fuerza mucho mayor que el peso que levantas! Para sostener 1 kg, el bíceps hace unos 7 kg de fuerza. Estamos hechos para <em>moverlas rápido</em> y con mucho recorrido, pero no para ahorrar fuerza.</p>
<div class="sim" data-sim="brazo-palanca" data-title="El bíceps y la palanca" data-goal="Sostén un peso de 4 kg con la menor fuerza posible del bíceps: ¡acerca el peso al codo!">
<ul><li>Mientras más lejos del codo está el peso, más fuerza hace falta.</li><li>Un músculo que se une más lejos del codo haría menos fuerza… pero se movería menos.</li></ul>
</div>
<div class="fact"><p>Tu fémur (el hueso del muslo) es el más largo y resistente del cuerpo: aguanta más que el concreto. Y el hueso más pequeño del cuerpo es el estribo, dentro del oído: mide unos 3 mm, ¡y ayuda a transmitir el sonido!</p></div>
</section>

<section>
<h2>El equilibrio y el centro de gravedad</h2>
<p>Cada objeto tiene un punto llamado <strong>centro de gravedad</strong>, donde parece concentrarse todo su peso. Un objeto se mantiene en equilibrio mientras la vertical que baja desde ese punto cae <em>sobre</em> la base de apoyo. Si cae afuera, se vuelca. Por eso abres las piernas para no caerte, y por eso un acróbata usa una vara larga para equilibrarse en la cuerda floja. Y por eso cuando llevas una mochila pesada en la espalda te inclinas hacia adelante.</p>
<p>Con ladrillos apilados puedes mostrar algo asombroso: si los desplazas con cuidado, ¡puedes hacer que la torre se asome mucho más allá de la mesa! El ladrillo de arriba puede asomar la mitad de su largo, el siguiente un cuarto, el siguiente un sexto…</p>
<div class="sim" data-sim="torre-asoma" data-title="La torre que se asoma" data-goal="Apila ladrillos de modo que el de arriba se asome al menos un ladrillo completo más allá de la mesa, sin que se caiga.">
<ul><li>Cada ladrillo solo puede asomarse mientras el centro de gravedad de todo lo que hay encima siga sobre el ladrillo de abajo.</li><li>Pista: ¡los ladrillos de arriba asoman más y los de abajo menos!</li></ul>
</div>
</section>

<section>
<h2>El corazón: una bomba</h2>
<p>Tu corazón es una bomba muscular del tamaño de tu puño. Late unas 70 veces por minuto, y con cada latido empuja unos 70 mL de sangre. ¡Eso es unos 5 litros por minuto, 7200 litros al día, y más de 100 000 latidos diarios! La sangre viaja por tubos (las arterias y venas) con una presión que mides cuando te toman la tensión: unos 120 (la máxima) sobre 80 (la mínima) milímetros de mercurio.</p>
<p>Tus nervios son «cables» que llevan señales eléctricas, y tu cerebro funciona con unos 20 vatios, ¡menos que una bombilla pequeña!</p>
</section>

<section>
<h2>Superpoderes de los animales</h2>
<p>Muchos animales detectan cosas que nosotros no podemos: ondas de sonido muy agudas o muy graves, calor, luz ultravioleta, campos magnéticos o eléctricos. ¡Todo eso es física que ya conoces!</p>

</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Tu pulso y el ejercicio" data-time="15 min" data-level="1">
<ul class="mat"><li>⏱️ Un cronómetro o reloj con segundero</li><li>🏃 Tu cuerpo y un poco de espacio</li></ul>
<ol class="steps"><li>Siéntate en calma y busca tu pulso en la muñeca (debajo del pulgar) o en el cuello. Cuenta los latidos durante 30 segundos y multiplica por 2.</li><li>Salta en el lugar durante 1 minuto (o haz 30 saltos de tijera).</li><li>Mide tu pulso de nuevo inmediatamente y después de 2 minutos de descanso.</li></ol>
<p class="predict">¿Tu corazón latirá más rápido o más despacio después de saltar?</p>
<p class="result">Después de saltar late mucho más rápido (de unos 80 a unos 120 o más). A los 2 minutos de descanso vuelve casi a lo normal.</p>
<p class="why">Cuando te mueves, tus músculos necesitan más oxígeno, y el corazón bombea más sangre por minuto, así que late más rápido. Los deportistas entrenados tienen un pulso en reposo más bajo, porque su corazón es más fuerte y bombea más en cada latido.</p>
</div>
<div class="exp" data-title="El tenedor equilibrista" data-time="10 min" data-level="1">
<ul class="mat"><li>🍴 Un tenedor y una cuchara</li><li>🪵 Un palillo de dientes</li><li>🥛 Un vaso</li></ul>
<ol class="steps"><li>Une un tenedor y una cuchara por sus cabezas, con las puntas hacia el mismo lado.</li><li>Atraviesa el palillo entre los dos y apoya el extremo del palillo en el borde del vaso.</li><li>Ajusta hasta que quede en equilibrio.</li></ol>
<p class="predict">¿Se caerá el conjunto de tenedor y cuchara?</p>
<p class="result">¡Queda en equilibrio sobre el borde del vaso, como por arte de magia! Si lo empujas un poco, se balancea y vuelve.</p>
<p class="why">El centro de gravedad del conjunto queda justo debajo del punto de apoyo (el palillo en el borde del vaso). Cuando el centro de gravedad está debajo del apoyo, el equilibrio es estable: se vuelve a enderezar.</p>
</div>
</section>
