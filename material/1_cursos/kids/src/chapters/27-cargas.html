<template class="chapter-src" data-id="cargas" data-num="27" data-world="7" data-title="Cargas y chispas" data-short="La electricidad estática: globos, rayos, truenos y por qué te da un chispazo al tocar una puerta.">
<p class="lead">Frotas un globo contra tu pelo y se pega a la pared. Te quitas un suéter y se oyen chispitas. Ves un rayo en una tormenta. Todo eso es <strong>electricidad</strong>, que viene de unas partículas diminutas con una propiedad especial: la carga eléctrica.</p>

<div class="learn"><ul>
<li>Hay dos tipos de carga: positiva y negativa.</li>
<li>Cargas iguales se repelen; cargas distintas se atraen.</li>
<li>Al frotar, los electrones pasan de un objeto a otro: así se carga algo.</li>
<li>Un rayo es una gigantesca chispa de electricidad estática.</li>
</ul></div>

<div class="say" data-who="chispa" data-mood="wow"><p>¡¡Hola!! ¡Soy Chispa! Soy pura electricidad: ¡zas, chas, zumbido! Casi todo lo que tiene que ver con la electricidad lo explico yo. ¿Listo para recibir una descarga… de conocimiento?</p></div>

<section>
<h2>Átomos con cargas</h2>
<p>Todo está hecho de átomos. Cada átomo tiene un núcleo con carga <b>positiva (+)</b> y, alrededor, unos electroncitos con carga <b>negativa (−)</b>. Normalmente cada átomo tiene la misma cantidad de las dos, y por eso las cosas son <em>neutras</em>. Pero los electrones se pueden mover. Si frotas dos materiales, algunos electrones pasan de uno al otro: uno queda con exceso de electrones (carga <b>negativa</b>) y el otro con falta (carga <b>positiva</b>).</p>
<div class="magic" data-name="La regla de las cargas"><big>iguales se repelen, distintas se atraen</big>+ con + se rechazan · − con − se rechazan · + con − se atraen</div>
<div class="story" data-title="El ámbar de Tales"><p>Hace 2600 años, el griego Tales de Mileto frotó un trozo de ámbar (resina fósil) con una piel y vio que atraía plumitas y pajas. La palabra griega para ámbar es <em>elektron</em>, y de ahí viene la palabra «electricidad»… ¡y también «electrón»!</p></div>
<div class="sim" data-sim="globo-papelitos" data-title="El globo y los papelitos" data-goal="Frota el globo en el pelo (arrastrándolo adelante y atrás) y atrae al menos 6 papelitos.">
<ul><li>Cuantas más veces frotas, más carga tiene el globo.</li><li>Acerca el globo a los papelitos: se pegan.</li></ul>
</div>
</section>

<section>
<h2>La fuerza entre cargas</h2>
<p>Dos cargas se atraen o se repelen con una fuerza que depende de dos cosas: <b>cuánta carga tienen</b> (más carga, más fuerza) y <b>qué tan lejos están</b> (¡mucho más débil al alejarse! si duplicas la distancia, la fuerza se hace 4 veces menor). Charles Coulomb midió esto en 1785.</p>
<div class="sim" data-sim="cargas-fuerza" data-title="Dos cargas frente a frente" data-goal="Haz que se atraigan, luego que se repelan, y duplica la distancia para ver que la fuerza se reduce a la cuarta parte.">
<ul><li>Cambia el signo de las cargas con los controles.</li><li>La flecha más larga significa más fuerza.</li></ul>
</div>
<details class="curious"><p>La ley de Coulomb dice F = k·q₁·q₂ / r², con k = 9 × 10⁹ N·m²/C². La carga se mide en coulombs (C): un electrón tiene −1,6 × 10⁻¹⁹ C. ¡Un coulomb equivale a 6 mil millones de billones de electrones! La fuerza eléctrica entre un protón y un electrón del átomo es unos 10³⁹ veces mayor que su atracción de gravedad.</p></details>
</section>

<section>
<h2>Rayos y truenos</h2>
<p>En una nube de tormenta, las gotas y los cristales de hielo chocan y se frotan, y la nube se carga: abajo se acumula carga negativa y en el suelo se acumula carga positiva. Cuando la diferencia es enorme, el aire deja de aislar y salta una chispa gigante: el <strong>rayo</strong>. Calienta el aire a unos 30 000 °C (¡cinco veces más caliente que el Sol!), y el aire se expande de golpe: eso es el <strong>trueno</strong>.</p>
<div class="fact"><p>Un rayo puede tener más de 100 millones de voltios y dura menos de una décima de segundo. Colombia es uno de los países donde caen más rayos del mundo: en la zona de Catatumbo, en Venezuela, cerca de nuestra frontera, hay tormentas casi todas las noches.</p></div>
<p>Como la luz viaja casi un millón de veces más rápido que el sonido, ves el rayo antes de oír el trueno. Cuenta los segundos entre los dos: <b>cada 3 segundos son más o menos 1 km</b> de distancia.</p>
<div class="sim" data-sim="tormenta" data-title="¿A qué distancia cayó el rayo?" data-goal="Mide los segundos entre el rayo y el trueno y calcula la distancia. ¡Acércate al 25 %!">
<ul><li>Cuenta mentalmente o mira el cronómetro.</li><li>distancia (km) = segundos ÷ 3</li></ul>
</div>
<div class="warn"><p>Si hay tormenta, métete a una casa o a un carro cerrado. Aléjate de árboles solos, campos abiertos, el agua y los objetos de metal. Si el trueno llega en menos de 30 segundos después del rayo, la tormenta está muy cerca. Los pararrayos protegen los edificios llevando el rayo a la tierra.</p></div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="El globo que atrae papelitos y se pega a la pared" data-time="10 min" data-level="1">
<ul class="mat"><li>🎈 Un globo inflado</li><li>📄 Papelitos picados muy pequeños</li><li>🧣 Un suéter de lana o tu propio pelo limpio y seco</li></ul>
<ol class="steps"><li>Frota el globo contra tu pelo o el suéter durante 20 segundos.</li><li>Acerca el globo (sin tocarlos) a los papelitos sobre la mesa.</li><li>Ahora frota el globo otra vez y ponlo contra la pared.</li></ol>
<p class="predict">¿El globo atraerá los papelitos o los rechazará?</p>
<p class="result">Los papelitos saltan y se pegan al globo. Y el globo se queda pegado a la pared unos minutos.</p>
<p class="why">Al frotarlo, el globo toma electrones del pelo y queda cargado negativamente. Los papelitos, neutros, se «polarizan»: sus cargas se separan un poquito y el lado más cercano al globo tiene carga contraria, que se atrae más de lo que la otra se repele.</p>
</div>
<div class="exp" data-title="El chorrito de agua que se dobla" data-time="10 min" data-level="1">
<ul class="mat"><li>🚰 Una llave de agua que salga en un chorrito fino</li><li>💇 Un peine de plástico</li><li>🧣 Un suéter de lana o tu pelo</li></ul>
<ol class="steps"><li>Abre la llave hasta que salga un chorrito fino y continuo.</li><li>Frota el peine rápidamente contra el pelo seco o el suéter durante unos 30 segundos.</li><li>Acerca el peine al chorro (sin tocarlo).</li></ol>
<p class="predict">¿Qué le pasará al chorro de agua al acercar el peine?</p>
<p class="result">¡El chorro se dobla hacia el peine, sin tocarlo!</p>
<p class="why">El peine cargado atrae a las moléculas de agua, que son polares (tienen un lado un poco positivo y otro un poco negativo), y el chorro se desvía.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>Dos cargas negativas se acercan. ¿Qué pasa?</p><ol><li>Se atraen</li><li>Se repelen</li><li>Nada</li></ol><p class="why">Cargas iguales se repelen.</p></div>
<div class="q" data-ans="2"><p>Al frotar un globo en tu pelo, ¿qué se mueve de un objeto a otro?</p><ol><li>Los protones</li><li>Los átomos enteros</li><li>Los electrones</li></ol><p class="why">Los electrones son los que se mueven y pasan de un material a otro.</p></div>
<div class="q" data-ans="0"><p>Ves un rayo y oyes el trueno 6 segundos después. ¿A qué distancia cayó?</p><ol><li>Unos 2 km</li><li>Unos 6 km</li><li>Unos 20 km</li></ol><p class="why">Cada 3 s son 1 km: 6 ÷ 3 = 2 km.</p></div>
<div class="q" data-ans="1"><p>Al duplicar la distancia entre dos cargas, la fuerza…</p><ol><li>Se reduce a la mitad</li><li>Se reduce a la cuarta parte</li><li>Se duplica</li></ol><p class="why">La fuerza es inversamente proporcional al cuadrado de la distancia: 2² = 4, así que queda la cuarta parte.</p></div>
</div>
