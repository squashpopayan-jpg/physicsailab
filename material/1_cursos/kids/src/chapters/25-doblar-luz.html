<template class="chapter-src" data-id="doblarluz" data-num="25" data-world="6" data-title="Doblar la luz: lentes y refracción" data-short="Por qué una pajilla se ve «quebrada», cómo funcionan las lupas, las gafas y los telescopios.">
<p class="lead">Mete una pajilla en un vaso de agua: ¡parece quebrada! Mira una moneda en el fondo de una piscina: ¡parece más cerca de la superficie! La luz cambia de dirección cuando pasa de un material a otro. A eso se le llama <strong>refracción</strong>.</p>

<div class="learn"><ul>
<li>La luz se dobla cuando pasa de un material a otro, por ejemplo del aire al agua.</li>
<li>Una lente curva la luz para juntarla (convergente) o para abrirla (divergente).</li>
<li>Los lentes sirven para lupas, gafas, microscopios, cámaras y telescopios.</li>
</ul></div>

<div class="say" data-who="lumi" data-mood="wow"><p>¡La luz también se confunde! Cuando entra al agua va un poquito más lenta y se desvía, como un carrito de juguete que pasa del pavimento a la arena.</p></div>

<section>
<h2>La refracción</h2>
<p>La luz viaja a 300 000 km/s en el vacío (y casi igual en el aire), pero en el agua va más despacio (unos 225 000 km/s) y en el vidrio todavía más. Cuando un rayo entra en otro material en diagonal, un lado del rayo se frena antes que el otro y el rayo se <strong>dobla</strong>. A cuánto se frena la luz en un material se le llama <dfn data-def="Un número que dice cuántas veces más lenta va la luz en un material que en el vacío.">índice de refracción</dfn>.</p>
<table><tr><th>Material</th><th>Índice de refracción</th></tr><tr><td>Aire</td><td>1,00</td></tr><tr><td>Agua</td><td>1,33</td></tr><tr><td>Vidrio</td><td>1,5</td></tr><tr><td>Diamante</td><td>2,4</td></tr></table>
<p>Por eso los objetos dentro del agua parecen estar más cerca de la superficie de lo que realmente están. Los peces, las rocas del fondo de un río… ¡parecen más cerca! Y por eso a los pescadores que usan lanza les cuesta tanto acertar: ¡tienen que apuntar más abajo de donde ven al pez!</p>
<div class="sim" data-sim="pesca-laser" data-title="La pesca con láser y con lanza" data-goal="Apunta el láser y la lanza al pez para acertar con los dos. ¡Cuidado: el pez no está donde lo ves!">
<ul><li>Con el láser: apunta hacia donde VES al pez (el pez fantasma).</li><li>Con la lanza (que no se dobla): apunta hacia donde ESTÁ realmente.</li></ul>
</div>
<details class="curious"><p>La ley de Snell dice que n₁·sen θ₁ = n₂·sen θ₂, donde θ es el ángulo respecto a la perpendicular a la superficie. Al pasar del aire (n = 1) al agua (n = 1,33) el rayo se acerca a la perpendicular. Si la luz intenta salir del agua con un ángulo muy grande (más de unos 49°), no sale: se refleja del todo. Se llama reflexión total y es lo que permite a la fibra óptica llevar internet por cables de vidrio.</p></details>
</section>

<section>
<h2>Las lentes</h2>
<p>Una <strong>lente</strong> es un vidrio con superficies curvas que dobla la luz de una manera especial:</p>
<ul><li>La lente <b>convergente</b> (más gruesa en el centro, como una lupa) junta los rayos en un punto: el foco. Si pones un objeto cerca de ella, ¡se ve agrandado!</li><li>La lente <b>divergente</b> (más delgada en el centro) abre los rayos y hace que las cosas se vean más pequeñas.</li></ul>
<div class="sim" data-sim="lente" data-title="La lupa" data-goal="Con la lente convergente, acerca el objeto dentro del foco para que la imagen sea grande, derecha y virtual: ¡una lupa!">
<ul><li>Dentro del foco: imagen virtual, derecha y grande (lupa).</li><li>Fuera del foco: imagen real e invertida (así funciona un proyector o una cámara).</li></ul>
</div>
<div class="story" data-title="Galileo y su telescopio"><p>En 1609, Galileo oyó que en Holanda alguien había juntado dos lentes y veía más cerca lo lejano. Hizo su propio telescopio, lo apuntó al cielo y vio montañas en la Luna, manchas en el Sol, ¡y cuatro lunitas girando alrededor de Júpiter! Con eso se probó que no todo gira alrededor de la Tierra.</p></div>
</section>

<section>
<h2>Tu ojo: una cámara con lente</h2>
<p>Tu ojo tiene una lente (el cristalino) que enfoca la luz sobre el fondo del ojo, la <strong>retina</strong>, donde hay millones de células que detectan la luz. Si la imagen no cae justo sobre la retina, ves borroso. A veces el ojo es un poquito demasiado largo (<b>miopía</b>: ves borroso de lejos) o un poquito corto (<b>hipermetropía</b>: ves borroso de cerca). Se corrigen con gafas: una lente divergente para el miope y una convergente para el hipermétrope.</p>
<div class="sim" data-sim="ojo-gafas" data-title="El ojo y las gafas" data-goal="Corrige el ojo miope y el ojo hipermétrope con la lente adecuada para que el foco caiga justo en la retina.">
<ul><li>El ojo miope enfoca delante de la retina: necesita una lente que abra un poco los rayos.</li><li>El ojo hipermétrope enfoca detrás de la retina: necesita una lente que los junte más.</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="La moneda que aparece" data-time="10 min" data-level="1">
<ul class="mat"><li>🥣 Un tazón no transparente</li><li>🪙 Una moneda</li><li>💧 Agua</li></ul>
<ol class="steps"><li>Pon la moneda en el fondo del tazón.</li><li>Aléjate hasta que, desde tu posición, el borde del tazón tape justo la moneda: no la ves.</li><li>Sin moverte, pide a un ayudante que eche agua despacio en el tazón.</li></ol>
<p class="predict">Cuando el tazón se llene de agua, ¿seguirás sin ver la moneda?</p>
<p class="result">¡La moneda aparece! Al llenar el tazón con agua, la moneda se ve de nuevo.</p>
<p class="why">Los rayos de luz que vienen de la moneda se doblan al salir del agua y alcanzan a pasar por encima del borde hasta tus ojos. La luz dobló y la moneda parece más arriba.</p>
</div>
<div class="exp" data-title="Una lupa con una gota de agua" data-time="10 min" data-level="1">
<ul class="mat"><li>📰 Un periódico o texto con letras pequeñas</li><li>🧴 Un pedazo de plástico transparente (de una bolsa o botella)</li><li>💧 Agua con un gotero o cuchara</li></ul>
<ol class="steps"><li>Pon el plástico encima de las letras.</li><li>Deja caer una gotita de agua sobre las letras.</li><li>Mira a través de la gota.</li></ol>
<p class="predict">¿Cómo se verán las letras debajo de la gota?</p>
<p class="result">Se ven más grandes, ¡como con una lupa!</p>
<p class="why">La gota es curva como una lente convergente. Si las letras están dentro de su foco, la lente forma una imagen virtual más grande.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>¿Por qué se ve «quebrada» una pajilla en un vaso con agua?</p><ol><li>Porque el agua la dobla</li><li>Porque la luz se dobla (refracta) al pasar del agua al aire</li><li>Porque el vaso es curvo</li></ol><p class="why">La refracción hace que la luz cambie de dirección y que la pajilla se vea desplazada.</p></div>
<div class="q" data-ans="2"><p>Un pescador con lanza ve un pez. ¿Dónde debe apuntar?</p><ol><li>Un poco arriba del pez</li><li>Exactamente donde lo ve</li><li>Un poco más abajo de donde lo ve</li></ol><p class="why">El pez está más profundo de lo que parece. La lanza no se dobla, así que hay que apuntar más abajo.</p></div>
<div class="q" data-ans="0"><p>Una lupa es una lente…</p><ol><li>Convergente</li><li>Divergente</li><li>Plana</li></ol><p class="why">Una lente convergente, más gruesa en el centro, agranda lo que está dentro de su foco.</p></div>
<div class="q" data-ans="1"><p>Una persona miope ve borroso lo…</p><ol><li>Cercano</li><li>Lejano</li><li>Oscuro</li></ol><p class="why">La miopía hace ver borroso de lejos; se corrige con lentes divergentes.</p></div>
</div>
