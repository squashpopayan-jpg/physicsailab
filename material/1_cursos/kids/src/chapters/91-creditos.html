<section>
<h2>De dónde salen los datos</h2>
<p>Las cifras del curso provienen de valores de referencia ampliamente aceptados y se verifican con pruebas de cálculo. Entre las fuentes generales de consulta:</p>
<ul>
<li>El Sistema Internacional de Unidades y las constantes fundamentales (BIPM, CODATA/NIST).</li>
<li>Datos planetarios y del Sistema Solar (NASA), definiciones de la Unión Astronómica Internacional.</li>
<li>Información sobre partículas, aceleradores y el bosón de Higgs (CERN).</li>
<li>Información sobre sismos y volcanes de Colombia (Servicio Geológico Colombiano) y sobre el interior de la Tierra (USGS).</li>
<li>Libros de física conceptual y de divulgación, y la historia de la ciencia documentada en biografías y compilaciones científicas.</li>
</ul>
<p>Las comprobaciones numéricas incluyen: caída libre con resistencia del aire (solución exacta), tiro parabólico, choques (conservación del momento y de la energía), presión y puntos de ebullición según la altura, curva de calentamiento del agua, ley de Snell, dispersión en un prisma, ley de Coulomb, ecuación de Tsiolkovski, órbitas y leyes de Kepler, líneas espectrales del hidrógeno, relatividad (dilatación del tiempo y GPS), desintegración radiactiva, ondas sísmicas, péndulo doble (conservación de la energía y caos) y más.</p>
</section>
