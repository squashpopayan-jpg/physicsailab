<template class="chapter-src" data-id="colores" data-num="26" data-world="6" data-title="El color: arcoíris y atardeceres" data-short="Por qué hay colores, cómo se forma el arcoíris, por qué el cielo es azul y los atardeceres rojos.">
<p class="lead">La luz del Sol parece blanca, pero guarda un secreto: ¡contiene todos los colores del arcoíris! Y cada color es una onda de luz con su propia longitud. Hoy vamos a separar los colores, mezclarlos y descubrir por qué el cielo es azul.</p>

<div class="learn"><ul>
<li>La luz blanca es la mezcla de todos los colores.</li>
<li>Un prisma o una gota de agua separan los colores: así se forma el arcoíris.</li>
<li>Con luz roja, verde y azul se pueden hacer todos los colores.</li>
<li>El cielo es azul porque el aire dispersa más la luz azul.</li>
</ul></div>

<div class="say" data-who="lumi" data-mood="happy"><p>Mi luz es amarillo-verdosa, ¡pero hoy te voy a enseñar todos los colores! Un truco: de lejos, el arcoíris parece un puente de siete colores, pero en realidad hay una infinidad de tonos.</p></div>

<section>
<h2>Newton y el prisma</h2>
<div class="story" data-title="El experimento de Newton"><p>En 1666, un joven Isaac Newton hizo un agujero en la ventana de su cuarto oscuro y dejó entrar un rayito de sol. Lo hizo pasar por un prisma de vidrio y en la pared apareció un arcoíris. Pero lo más importante: cuando dejó pasar uno solo de esos colores por otro prisma, ¡ya no se separaba más! Concluyó que la luz blanca está hecha de todos los colores, y que el prisma solo los separa.</p></div>
<p>El prisma separa los colores porque la luz de cada color <strong>se dobla un poquito distinto</strong> al entrar en el vidrio: la violeta se dobla más y la roja menos. Eso se llama <dfn data-def="La separación de la luz blanca en sus colores cuando pasa por un prisma o por gotas de agua.">dispersión</dfn>. En el arcoíris las gotas de lluvia hacen de pequeños prismas.</p>
<div class="sim" data-sim="prisma" data-title="El prisma de Newton" data-goal="Manda luz blanca por el prisma y luego luz de un solo color: ¡mira la diferencia!">
<ul><li>Con luz roja o azul sola, el rayo se dobla pero no se separa.</li><li>Cambia el ángulo del rayo y observa cuánto se abre el abanico de colores.</li></ul>
</div>
<div class="fact"><p>Cada color de luz es una onda con distinta longitud: la roja mide unos 700 nanómetros (0,0007 mm) y la violeta unos 400. ¡Más cortas que el grosor de un cabello! Hay luces «más allá» del rojo y del violeta que no vemos: infrarrojo y ultravioleta.</p></div>
</section>

<section>
<h2>Mezclar luces y mezclar pinturas</h2>
<p>Con solo tres luces de colores —<b style="color:#E0001B">roja</b>, <b style="color:#0A9B3F">verde</b> y <b style="color:#1E4FD8">azul</b>— se pueden hacer casi todos los colores. Es lo que hacen las pantallas del celular y de la tele: cada puntito tiene tres lucecitas. Esto se llama <strong>mezcla aditiva</strong>: al sumar luces se llega al blanco.</p>
<ul><li>Rojo + verde = <b>amarillo</b></li><li>Verde + azul = <b>cian</b></li><li>Rojo + azul = <b>magenta</b></li><li>Rojo + verde + azul = <b>blanco</b></li></ul>
<p>Con las pinturas pasa lo contrario: cada pintura <em>absorbe</em> (quita) colores de la luz. Mientras más pinturas mezclas, más luz quitas, y más oscuro queda. Es la <strong>mezcla sustractiva</strong>, por eso mezclar todas las pinturas da un color marrón oscuro.</p>
<div class="sim" data-sim="mezclador-rgb" data-title="El mezclador de luces" data-goal="Mezcla las luces roja, verde y azul para conseguir los tres colores de las tarjetas.">
<ul><li>Ajusta cada luz de 0 a 255.</li><li>Los colores aparecen al sumar luces: amarillo es rojo y verde juntos.</li></ul>
</div>
<details class="curious"><p>Nuestros ojos tienen tres tipos de células sensibles al color, llamadas conos: unos responden más al rojo, otros al verde y otros al azul. El cerebro mezcla sus señales para «inventar» los colores. Por eso con tres luces se engaña al ojo para ver cualquier color. Algunos animales tienen más tipos de conos: las mariposas, por ejemplo, ven colores que nosotros no imaginamos.</p></details>
</section>

<section>
<h2>El cielo azul y los atardeceres rojos</h2>
<p>Si la luz del Sol es blanca, ¿por qué el cielo es azul? Porque el aire está lleno de moléculas diminutas que <strong>dispersan</strong> la luz: la desparraman en todas direcciones. Y dispersan <em>mucho más</em> la luz azul que la roja. Cuando miras al cielo, ves la luz azul del Sol que se desparramó hacia ti desde todos lados.</p>
<p>Al atardecer, el Sol está bajo en el horizonte y su luz atraviesa muchísimo más aire. El azul se dispersa casi todo por el camino y llega solo el naranja y el rojo: ¡por eso los atardeceres son rojizos!</p>
<div class="sim" data-sim="cielo-azul" data-title="El cielo a lo largo del día" data-goal="Baja el Sol hasta el atardecer y súbelo hasta el mediodía para ver cómo cambian los colores.">
<ul><li>Con el Sol alto, su luz atraviesa poco aire y se ve amarillento-blanco.</li><li>Con el Sol casi en el horizonte, su luz atraviesa mucho aire y se ve roja.</li></ul>
</div>
</section>

<section>
<h2>¿Por qué un objeto tiene color?</h2>
<p>Un tomate se ve rojo porque <strong>refleja</strong> la luz roja y <strong>absorbe</strong> los demás colores. Un objeto blanco refleja todos, y uno negro absorbe todos. Si pones un tomate bajo una luz azul, no tiene luz roja para reflejar: ¡se ve casi negro!</p>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Un arcoíris con un vaso de agua" data-time="15 min" data-level="1">
<ul class="mat"><li>🥛 Un vaso transparente con agua (casi lleno)</li><li>📄 Una hoja de papel blanco</li><li>☀️ Una ventana con sol (o una linterna potente en la oscuridad)</li></ul>
<ol class="steps"><li>Pon el vaso al borde de una mesa o ventana donde le dé el Sol.</li><li>Coloca la hoja de papel en el piso, a un lado del vaso, donde caiga la luz que sale por el agua.</li><li>Mueve el vaso o el papel hasta que aparezca una franja de colores.</li></ol>
<p class="predict">¿Se verá algún arcoíris en la hoja?</p>
<p class="result">¡Aparece una franja de colores en el papel! A veces hay que mover el vaso un poco para encontrarla.</p>
<p class="why">El vaso con agua hace de prisma: la luz blanca se dobla al entrar y al salir, y cada color se desvía distinto. Se separan los colores.</p>
</div>
<div class="exp" data-title="Un atardecer en un vaso" data-time="10 min" data-level="1">
<ul class="mat"><li>🥛 Un vaso con agua transparente (casi lleno)</li><li>🥄 Unas gotas de leche</li><li>🔦 Una linterna potente</li></ul>
<ol class="steps"><li>Echa tres o cuatro gotas de leche en el agua y revuelve: debe quedar apenas turbia.</li><li>En una habitación oscura, alumbra con la linterna el vaso desde un lado.</li><li>Mira el vaso desde el lado (el azulado) y luego desde el lado opuesto a la linterna (el anaranjado).</li></ol>
<p class="predict">¿De qué color verás la luz del vaso desde cada lado?</p>
<p class="result">Desde el lado verás una luz azulada, y mirando la linterna a través del vaso, la luz se ve anaranjada o rojiza, ¡como un atardecer!</p>
<p class="why">Las partículas de leche dispersan más la luz azul hacia los lados, y la que atraviesa todo el vaso queda sin azul: naranja. Es lo mismo que pasa en la atmósfera.</p>
</div>
</section>

<div class="q" data-ans="1"><p>Mezclas luz roja con luz verde. ¿Qué color te da?</p><ol><li>Azul</li><li>Amarillo</li><li>Marrón</li></ol><p class="why">Rojo + verde = amarillo (mezcla aditiva de luces).</p></div>

</div>
