<p class="lead">Antes de que existieran los celulares, los carros o las lámparas, ya había personas que miraban el cielo, probaban cosas y se hacían preguntas. Gracias a ellas, hoy sabemos tantas cosas. ¡Vamos a conocerlas!</p>

<div class="learn"><ul>
<li>La física tiene miles de años de historia.</li>
<li>Personas de todo el mundo aportaron: mujeres y hombres, de muchos pueblos.</li>
<li>Cada descubrimiento se apoya en los anteriores.</li>
</ul></div>

<div class="say" data-who="buho" data-mood="happy"><p>Yo he vivido en muchas épocas… bueno, ¡en mi imaginación! Te voy a contar las historias de los curiosos más famosos. Algunos eran sabios, otros eran inventores, y otros solo tenían mucha paciencia.</p></div>

<section>
<h2>Una línea del tiempo</h2>
<ol class="tl">
<li><span class="tl-y">Hace 2600 años</span><b>🏺 Tales de Mileto</b><p>En Grecia frotó un trozo de ámbar y vio que atraía pedacitos de paja. Fue una de las primeras preguntas sobre electricidad. (De la palabra griega para ámbar, <em>elektron</em>, viene «electricidad».)</p></li>
<li><span class="tl-y">Hace 2250 años</span><b>🛁 Arquímedes</b><p>Descubrió por qué algunas cosas flotan. La leyenda cuenta que se metió a la bañera, entendió la idea y salió corriendo gritando «¡Eureka!» («¡lo encontré!»).</p></li>
<li><span class="tl-y">Hace 2250 años</span><b>📏 Eratóstenes</b><p>Midió el tamaño de la Tierra con dos palos y sus sombras, en dos ciudades distintas. ¡Y casi acertó!</p></li>
<li><span class="tl-y">Hace unos 1900 años</span><b>🌍 Zhang Heng, en China</b><p>Construyó un aparato con dragones y sapos de bronce que avisaba cuando había un temblor lejano.</p></li>
<li><span class="tl-y">Hace 1000 años</span><b>👁️ Ibn al-Haytham</b><p>En El Cairo estudió la luz. Probó con experimentos que vemos porque la luz que rebota en las cosas entra a nuestros ojos. Usó una cámara oscura.</p></li>
<li><span class="tl-y">Hace 415 años</span><b>🔭 Galileo Galilei</b><p>Apuntó un telescopio al cielo y vio montañas en la Luna y cuatro lunas dando vueltas a Júpiter. Y probó que los objetos caen juntos si no hay aire.</p></li>
<li><span class="tl-y">Hace 340 años</span><b>🍎 Isaac Newton</b><p>Explicó la gravedad y las leyes del movimiento. Con sus ideas se pueden calcular desde las órbitas de los planetas hasta el vuelo de una pelota.</p></li>
<li><span class="tl-y">Hace unos 200 años</span><b>🌿 Francisco José de Caldas</b><p>Nació en Popayán. Midió la altura de las montañas viendo a qué temperatura hierve el agua. ¡Un físico de nuestra tierra!</p></li>
<li><span class="tl-y">Hace unos 160 años</span><b>⚡ Michael Faraday y James Maxwell</b><p>Descubrieron cómo se relacionan la electricidad, el magnetismo y la luz. Gracias a ellos hay motores, bombillos y radio.</p></li>
<li><span class="tl-y">Hace unos 125 años</span><b>☢️ Marie Curie</b><p>Estudió la radiactividad, descubrió dos elementos nuevos y ganó dos premios Nobel.</p></li>
<li><span class="tl-y">Hace 120 años</span><b>🌌 Albert Einstein</b><p>Cambió nuestra idea del tiempo, el espacio y la luz con su teoría de la relatividad.</p></li>
<li><span class="tl-y">Hace unos 100 años</span><b>🌟 Cecilia Payne</b><p>Descubrió de qué están hechas las estrellas: sobre todo, de hidrógeno.</p></li>
</ol>
<div class="fact"><p>Los mayas llevaban cuentas muy precisas de los movimientos de Venus y de los eclipses. Los antiguos pueblos de América, de África, de Asia y de Europa hicieron ciencia observando el cielo para saber cuándo sembrar y cuándo viajar.</p></div>

<section>
<h2>Cómo se construye la ciencia</h2>
<p>Ningún científico lo hizo todo solo. Newton escribió que había visto más lejos porque se había subido a <strong>hombros de gigantes</strong>: los que habían trabajado antes. Cada generación comprueba, corrige y agrega algo. Y las ideas viajan: de Grecia a Egipto, de China a Arabia, de Arabia a Europa, de allá a América y de vuelta otra vez.</p>
<p>Hoy hay miles de científicos en todo el mundo, y en nuestra región también: en universidades, observatorios y laboratorios. ¡Algún día podrías ser tú!</p>
<details class="curious"><p>Aristóteles, que vivió hace unos 2350 años, pensaba que los cuerpos pesados caían más rápido que los livianos, y durante casi dos mil años se aceptó su idea sin probarla. Galileo (y otros antes que él) hicieron pruebas con rampas y bolas. La lección: <strong>una idea vale por lo que se puede comprobar</strong>, no por lo famoso que sea quien la dice.</p></details>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Tu propio reloj de sol" data-time="1 día (mirando cada hora)" data-level="1">
<ul class="mat"><li>✏️ Un lápiz largo o un palito</li><li>🧱 Plastilina</li><li>📄 Una hoja grande o cartón</li><li>🖍️ Un marcador</li><li>☀️ Un día de sol</li></ul>
<ol class="steps"><li>Pega el lápiz parado con plastilina en el centro de la hoja.</li><li>Pon la hoja en un lugar donde dé el Sol todo el día. Pégala con cinta para que no se mueva.</li><li>Cada hora, marca con el marcador la punta de la sombra y escribe la hora al lado.</li><li>Observa cómo cambia el largo y la dirección de la sombra.</li></ol>
<p class="predict">¿A qué hora crees que la sombra será más corta?</p>
<p class="result">La sombra es larga por la mañana y por la tarde, y muy corta hacia el mediodía. Además la sombra va girando, como la manecilla de un reloj.</p>
<p class="why">El Sol parece moverse por el cielo porque la Tierra gira. Al mediodía está más alto y la sombra se acorta. Los antiguos usaban relojes de sol como este para saber la hora.</p>
</div>
