(function () {
  'use strict';
  const FK = window.FK, D = FK.d, M = FK.M, C = FK.calc;

  const bar = (c, x, y, w, h, flip) => {
    const a = flip ? '#1E88FF' : '#FF4757', b = flip ? '#FF4757' : '#1E88FF';
    D.rr(c, x, y, w / 2, h, 8); c.fillStyle = a; c.fill(); D.rr(c, x + w / 2, y, w / 2, h, 8); c.fillStyle = b; c.fill();
    D.box(c, x, y, w, h, 'rgba(0,0,0,0)', { r: 8, lw: 4 });
    D.text(c, flip ? 'S' : 'N', x + w / 4, y + h / 2, { size: 26, align: 'center', color: '#fff', weight: 700 }); D.text(c, flip ? 'N' : 'S', x + (3 * w) / 4, y + h / 2, { size: 26, align: 'center', color: '#fff', weight: 700 });
  };

  /* ---------- Atracción y repulsión ---------- */
  FK.sim('polos', function (g) {
    const ctx = g.canvas(2.6);
    g.button('🔄 Girar el imán azul', () => { S.flip = !S.flip; S.v = 0; }, { kind: 'ghost' });
    g.out('est', 'Estado', { icon: '🧲', hl: true });
    const AW = 150, BH = 56, AX = 120, CY = 170;
    const S = { x: 560, v: 0, drag: false, flip: false, att: false, rep: false, gx: 0 };
    g.pointer({
      down(x, y) { if (Math.abs(y - CY) < 60 && x > S.x - 10 && x < S.x + AW + 10) { S.drag = true; S.gx = x - S.x; S.v = 0; } },
      move(x, y, e, down) { if (down && S.drag) { S.x = M.clamp(x - S.gx, AX + AW + 4, 640); S.v = 0; } },
      up() { S.drag = false; }
    });
    g.run({
      init() { S.x = 560; S.v = 0; S.drag = false; S.flip = false; g.say('El imán rojo-azul está fijo. Arrastra el otro hacia él y suéltalo.'); },
      step(dt) {
        const gap = Math.max(8, S.x - (AX + AW)); /* A: N|S ; frente a B su polo S */
        const bLeftIsN = !S.flip; /* B: N|S normal, de modo que su polo izquierdo es N (atrae al S de A) */
        const F = C.magnetForce(gap / 40) * (bLeftIsN ? 1 : -1); /* + atrae */
        g.show('est', S.x - (AX + AW) < 6 ? '✊ pegados' : bLeftIsN ? '🧲 se atraen' : '↔️ se rechazan');
        if (!S.drag) {
          S.v += (-F * 3000 - S.v * 4) * dt * 1; S.x += S.v * dt;
          if (S.x < AX + AW + 3) { S.x = AX + AW + 3; if (S.v < 0) { S.v = 0; if (bLeftIsN && !S.att) { S.att = true; FK.sfx.pop(); g.say('¡Clac! Polos distintos se atraen y se pegaron.', 'wow'); } } }
          if (S.x > 640) { S.x = 640; S.v = 0; }
          if (!bLeftIsN && S.x > AX + AW + 200 && !S.rep) { S.rep = true; g.say('¡Fuera! Polos iguales se rechazan: el imán salió empujado.', 'wow'); FK.sfx.ok(); }
          if (S.att && S.rep && !g.won()) g.win('¡Las dos cosas! Polos distintos se atraen y polos iguales se repelen.');
        }
      },
      draw(c, W, H) {
        D.sky(c, W, H, '#FFE5F2', '#FFF6FB'); D.ground(c, W, H - 50, H, '#C9C9D9', '#9A9AB5');
        bar(c, AX, CY - BH / 2, AW, BH, false);
        bar(c, S.x, CY - BH / 2, AW, BH, S.flip);
        const gap = S.x - (AX + AW);
        if (gap > 20) { const bLeftIsN = !S.flip, L = Math.min(120, 3000 / (gap + 30)); D.arrow(c, AX + AW + gap / 2 - L, CY - 70, AX + AW + gap / 2 + L, CY - 70, bLeftIsN ? '#12B76A' : '#FF4757', 8); if (bLeftIsN) { D.arrow(c, AX + AW + gap / 2 + L, CY - 70, AX + AW + gap / 2 - L, CY - 70, '#12B76A', 8); } }
        D.text(c, S.drag ? '✋ arrastrando' : 'arrástralo →', S.x + AW / 2, CY + 70, { size: 16, align: 'center', weight: 700 });
        D.char(c, 'chispa', W - 60, 50, 64, 'happy');
      }
    });
  });

  /* ---------- Limaduras y brújula ---------- */
  FK.sim('limaduras', function (g) {
    const ctx = g.canvas(2);
    g.choice('vista', { label: 'Mostrar', icon: '👁️', options: [['lim', 'Limaduras'], ['lin', 'Líneas del campo']], value: 'lim' });
    g.out('v', 'Zonas visitadas con la brújula', { icon: '🧭', hl: true });
    const CX = 400, CY = 200, HL = 70; /* semilongitud del imán */
    const S = { cx: 600, cy: 120, zones: new Set(), drag: false };
    const field = (x, y) => { /* campo de dos polos magnéticos: N a la izquierda (−HL), S a la derecha */
      let bx = 0, by = 0;
      for (const [px, q] of [[CX - HL, 1], [CX + HL, -1]]) { const dx = x - px, dy = y - CY, r2 = dx * dx + dy * dy + 100, r3 = Math.pow(r2, 1.5); bx += (q * dx) / r3; by += (q * dy) / r3; }
      return [bx, by];
    };
    g.pointer({ down(x, y) { S.drag = Math.hypot(x - S.cx, y - S.cy) < 50; }, move(x, y, e, down) { if (down && S.drag) { S.cx = M.clamp(x, 30, 770); S.cy = M.clamp(y, 30, 370); const dx = S.cx - CX, dy = S.cy - CY; if (Math.hypot(dx, dy) > 95) { const z = Math.abs(dx) > Math.abs(dy) * 1.2 ? (dx < 0 ? 'izq' : 'der') : dy < 0 ? 'arr' : 'aba'; S.zones.add(z); g.show('v', S.zones.size + ' de 4'); if (S.zones.size >= 4 && !g.won()) g.win('¡Alrededor del imán! La brújula siempre se alinea con las líneas del campo.'); } } }, up() { S.drag = false; } });
    g.run({
      static: true,
      init() { S.zones.clear(); g.show('v', '0 de 4'); g.say('Arrastra la brújula por arriba, abajo, izquierda y derecha del imán.'); },
      draw(c, W, H) {
        D.sky(c, W, H, '#FFFBF2', '#FFF1D9');
        if (g.p.vista === 'lim') {
          c.lineWidth = 2; c.lineCap = 'round';
          for (let y = 12; y < H; y += 16) for (let x = 12; x < W; x += 16) {
            if (Math.abs(x - CX) < HL + 4 && Math.abs(y - CY) < 22) continue;
            const [bx, by] = field(x, y), m = Math.hypot(bx, by), s = M.clamp(Math.sqrt(m) * 70, 0.25, 1), a = Math.atan2(by, bx), L = 6 + 3 * s;
            c.strokeStyle = `rgba(43,35,80,${0.25 + 0.7 * s})`; c.beginPath(); c.moveTo(x - Math.cos(a) * L, y - Math.sin(a) * L); c.lineTo(x + Math.cos(a) * L, y + Math.sin(a) * L); c.stroke();
          }
        } else {
          c.lineWidth = 3;
          for (let a0 = 50; a0 <= 310; a0 += 20) {
            const an = M.rad(a0); let x = CX - HL + 14 * Math.cos(an), y = CY + 14 * Math.sin(an); const pts = [[x, y]];
            for (let i = 0; i < 500; i++) { const [bx, by] = field(x, y), m = Math.hypot(bx, by); x += (bx / m) * 4; y += (by / m) * 4; if (Math.hypot(x - (CX + HL), y - CY) < 12 || x < -50 || x > 850 || y < -50 || y > 450) break; pts.push([x, y]); }
            c.strokeStyle = 'rgba(142,92,246,.8)'; c.beginPath(); pts.forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]))); c.stroke();
          }
        }
        bar(c, CX - HL, CY - 20, HL * 2, 40, false);
        /* brújula */
        const [bx, by] = field(S.cx, S.cy), a = Math.atan2(by, bx);
        D.circle(c, S.cx, S.cy, 40, '#fff', D.INK, 4);
        c.save(); c.translate(S.cx, S.cy); c.rotate(a);
        D.poly(c, [[34, 0], [-4, -8], [-4, 8]], '#FF4757', D.INK, 2); D.poly(c, [[-34, 0], [4, -8], [4, 8]], '#1E88FF', D.INK, 2); c.restore();
        D.circle(c, S.cx, S.cy, 4, D.INK);
        D.text(c, S.drag ? '' : '👆 arrástrame', S.cx, S.cy + 56, { size: 14, align: 'center' });
      }
    });
  });

  /* ---------- El imán de la Tierra ---------- */
  FK.sim('brujula-tierra', function (g) {
    const ctx = g.canvas(2.4);
    g.slider('lat', { label: 'Latitud (modelo de imán simple)', icon: '🌍', min: -90, max: 90, step: 1, value: 0, unit: '°', fmt: (v) => FK.n(v, 0) });
    g.out('dip', 'Inclinación de la brújula', { icon: '🧭', hl: true }); g.out('lug', 'Lugar', { icon: '📍' });
    const seen = new Set();
    g.run({
      static: true,
      init() { seen.clear(); g.say('Desplaza la brújula del ecuador al polo y fíjate cómo se inclina.'); },
      draw(c, W, H) {
        const lat = g.p.lat, dip = C.dipAngle(lat), cx = 240, cy = H / 2, R = 150;
        const zone = Math.abs(lat) <= 3 ? 'ecuador' : Math.abs(lat) >= 85 ? 'polo' : Math.abs(lat - 45) <= 3 || Math.abs(lat + 45) <= 3 ? 'medio' : null;
        g.show('dip', FK.n(Math.abs(dip), 0) + '° ' + (dip > 0.5 ? '(hacia abajo)' : dip < -0.5 ? '(hacia arriba)' : '(horizontal)')); g.show('lug', zone === 'ecuador' ? 'cerca del ecuador' : zone === 'polo' ? 'cerca de un polo' : lat > 0 ? 'hemisferio norte' : 'hemisferio sur');
        if (zone && !seen.has(zone)) { seen.add(zone); FK.sfx.ok(); if (seen.size >= 3 && !g.won()) g.win('¡Visitaste el ecuador, la latitud media y el polo! La brújula se inclina más a medida que te acercas a los polos.'); }
        D.sky(c, W, H, '#E6F4FF', '#F8FCFF');
        D.circle(c, cx, cy, R, '#6CC3FF', D.INK, 5);
        c.beginPath(); c.arc(cx, cy, R, -Math.PI / 2, 0); c.fillStyle = 'rgba(92,208,104,.5)'; c.lineTo(cx, cy); c.fill();
        /* líneas de campo del dipolo */
        c.lineWidth = 2; c.strokeStyle = 'rgba(142,92,246,.7)';
        for (const L of [1.7, 2.4, 3.3]) { c.beginPath(); for (let th = 0.12; th < Math.PI - 0.12; th += 0.04) { const r = L * R * Math.sin(th) ** 2 * 0.95; const x = cx + r * Math.sin(th), y = cy - r * Math.cos(th); th === 0.12 ? c.moveTo(x, y) : c.lineTo(x, y); } c.stroke(); c.beginPath(); for (let th = 0.12; th < Math.PI - 0.12; th += 0.04) { const r = L * R * Math.sin(th) ** 2 * 0.95; const x = cx - r * Math.sin(th), y = cy - r * Math.cos(th); th === 0.12 ? c.moveTo(x, y) : c.lineTo(x, y); } c.stroke(); }
        D.box(c, cx - 24, cy - R - 60, 48, 120 + 2 * R - 120 + 0, 'rgba(0,0,0,0)', { r: 0, stroke: false });
        D.text(c, 'N', cx, cy - R - 16, { size: 20, align: 'center', weight: 700 }); D.text(c, 'S', cx, cy + R + 18, { size: 20, align: 'center', weight: 700 });
        /* lugar */
        const a = M.rad(lat), px = cx + R * Math.cos(a), py = cy - R * Math.sin(a);
        D.emoji(c, '📍', px, py - 8, 26);
        /* brújula 3D simplificada a la derecha */
        const kx = 600, ky = H / 2;
        D.circle(c, kx, ky, 90, '#fff', D.INK, 5); D.text(c, 'horizonte', kx, ky + 112, { size: 14, align: 'center' }); D.text(c, '(vista de lado)', kx, ky + 130, { size: 12, align: 'center', color: D.INK });
        D.line(c, kx - 90, ky, kx + 90, ky, 'rgba(43,35,80,.3)', 2, [6, 6]);
        const d = M.rad(dip); c.save(); c.translate(kx, ky); c.rotate(d);
        D.poly(c, [[80, 0], [-6, -10], [-6, 10]], '#FF4757', D.INK, 3); D.poly(c, [[-80, 0], [6, -10], [6, 10]], '#1E88FF', D.INK, 3); c.restore();
        D.text(c, 'N →', kx + 105, ky, { size: 14 });
        D.char(c, 'chispa', W - 60, 50, 64, 'happy');
      }
    });
  });
})();

(function () {

  FK.sim('electroiman', function (g) {

    g.slider('p', { label: 'Pilas', icon: '🔋', min: 1, max: 4, step: 1, value: 1, fmt: (v) => FK.n(v, 0) });
    g.toggle('on', { label: 'Interruptor encendido', value: true });
    g.out('clips', 'Clips levantados', { icon: '📎', hl: true }); g.out('I', 'Corriente', { icon: '🌊' });
    const S = { clips: 0, shown: 0 };
    g.run({
      static: false,
      init() { S.shown = 0; g.say('Enrolla más cable o pon más pilas. ¿Cuántos clips alcanzas a levantar?'); },
      step(dt) {

      },

        D.line(c, 560, 107, cx + 34, top + 30, on ? '#FFC21A' : 'rgba(0,0,0,.25)', 4);

        D.emoji(c, '🕹️', cx, cy + 150, 28);
        /* LED */

(function () {

  /* ---------- El cañón de Newton ---------- */
  FK.sim('canon-newton', function (g) {
    const ctx = g.canvas(1.8);
    g.slider('v', { label: 'Rapidez de salida', icon: '💨', min: 1, max: 13, step: 0.1, value: 5, unit: 'km/s', fmt: (v) => FK.n(v, 1) });
    g.button('🔥 ¡Disparar!', () => fire(), { kind: 'primary' });
    g.out('r', 'Qué pasó', { icon: '🌍', hl: true }); g.out('vc', 'Rapidez para órbita circular', { icon: '⭕' });
    const R = 6371, H0 = 300, SC = 0.027;
    const S = { st: 'idle', x: 0, y: 0, vx: 0, vy: 0, trail: [], ang: 0, orbited: false, esc: false, t: 0, minr: 1e9 };
    function fire() { const r0 = R + H0; S.st = 'fly'; S.x = 0; S.y = r0; S.vx = g.p.v; S.vy = 0; S.trail = [[0, r0]]; S.ang = 0; S.sw = 0; S.t = 0; S.minr = r0; FK.sfx.boom(); }
    g.run({
      init() { S.st = 'idle'; S.trail = []; S.orbited = S.orbited && g.won(); g.show('r', '—'); g.show('vc', FK.n(C.circularV(R + H0), 2) + ' km/s'); g.say('El cañón está en una montaña de 300 km sobre la Tierra. Elige la rapidez y dispara.'); },
      step(dt) {
        if (S.st !== 'fly') return;
        const k = 750, n = 80; /* tiempo comprimido */
        for (let i = 0; i < n && S.st === 'fly'; i++) {
          const h = (dt * k) / n, r = Math.hypot(S.x, S.y), a = C.GM_EARTH / (r * r * r);
          S.vx -= S.x * a * h; S.vy -= S.y * a * h; S.x += S.vx * h; S.y += S.vy * h; S.t += h;
          const r2 = Math.hypot(S.x, S.y); S.minr = Math.min(S.minr, r2);
          const th = Math.atan2(S.x, S.y); const d = ((th - S.ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI; S.ang += d; S.sw = (S.sw || 0) + d; if (i % 4 === 0) S.trail.push([S.x, S.y]);
          if (r2 <= R) { S.st = 'crash'; g.show('r', '💥 se estrelló'); g.say(`Cayó a la Tierra tras recorrer ${FK.int(R * Math.abs(S.sw || 0))} km. Necesita más rapidez.`, 'think'); S.sw = 0; break; }
          if (r2 > R * 6) { S.st = 'escape'; S.esc = true; g.show('r', '🚀 escapó al espacio'); g.say('¡Escapó de la Tierra! Pasó la rapidez de escape (unos 10,8 km/s a esta altura).', 'wow'); S.sw = 0; break; }
          if (Math.abs(S.sw || 0) > Math.PI * 2 * 1.02) { S.st = 'orbit'; S.orbited = true; g.show('r', '🛰️ ¡en órbita!'); g.say(`¡Dio la vuelta completa! Se queda cayendo alrededor de la Tierra: ${S.minr < R + 80 ? 'casi roza la atmósfera' : 'una órbita estable'}.`, 'wow'); S.sw = 0; FK.sfx.ok(); break; }
        }
        if ((S.orbited || g.won()) && S.esc && !g.won()) g.win('¡Órbita y escape! Newton tenía razón: lanzar más rápido hace que caiga cada vez más lejos.');
        if (S.orbited && S.esc && !g.won()) g.win('¡Órbita y escape! Newton tenía razón.');
      },
      draw(c, W, H) {
        D.night(c, W, H, 21, 70);

        D.circle(c, cx, cy, R * sc, '#2E7BE8', '#9FD0FF', 4); c.beginPath(); c.arc(cx, cy, R * sc, -2.2, -0.9); c.fillStyle = 'rgba(92,208,104,.7)'; c.lineTo(cx, cy); c.fill();

        c.beginPath(); S.trail.forEach((p, i) => { const x = cx + p[0] * sc, y = cy - p[1] * sc; i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.strokeStyle = '#FFC21A'; c.lineWidth = 3; c.stroke();

  /* ---------- Kepler ---------- */
  const PLANETS = [['Mercurio', 0.387, '#B5B5B5', 5], ['Venus', 0.723, '#E8C07A', 8], ['Tierra', 1, '#3D9BFF', 8], ['Marte', 1.524, '#E0583A', 6], ['Júpiter', 5.203, '#D8A068', 14], ['Saturno', 9.537, '#EBD28A', 12], ['Urano', 19.19, '#9FE3F0', 10], ['Neptuno', 30.07, '#4A6BE8', 10]];

        D.text(c, 'las órbitas no están a escala exacta', 14, 24, { size: 13, color: '#B9B3E6' });
        D.char(c, 'cosmo', W - 60, H - 60, 72, 'happy');
      }
    });
  });

  /* ---------- Camina por el sistema solar ---------- */
  const SCALE = [['Sol', 0, 1], ['Mercurio', 0.387, 0.0035], ['Venus', 0.723, 0.0087], ['Tierra', 1, 0.0091], ['Marte', 1.524, 0.0049], ['Júpiter', 5.203, 0.1004], ['Saturno', 9.537, 0.0836], ['Urano', 19.19, 0.0364], ['Neptuno', 30.07, 0.0354]];
  FK.sim('escala-sistema', function (g) {
    const ctx = g.canvas(2.4);
    g.slider('m', { label: 'Camino desde el Sol', icon: '🚶', min: 0, max: 3300, step: 5, value: 0, unit: 'm', fmt: (v) => FK.int(v) });
    g.out('t', 'Tiempo caminando a 1,4 m/s', { icon: '⏱️' }); g.out('n', 'Planeta más cercano', { icon: '🪐', hl: true });

    g.button('Lanzar 10', () => flip(10), { icon: '🪙' }); g.button('Lanzar 100', () => flip(100), { icon: '🪙' }); g.button('Lanzar 1000', () => flip(1000), { icon: '🪙', kind: 'ghost' }); g.button('Lanzar 10 000', () => flip(10000), { icon: '🪙', kind: 'ghost' });
    g.out('n', 'Lanzamientos', { icon: '🪙' }); g.out('p', 'Caras', { icon: '👑', hl: true }); g.out('l', 'Último lote', { icon: '🎲' });
    const show = () => { g.show('n', FK.int(S.n)); g.show('p', S.n ? FK.n((S.h / S.n) * 100, 1) + ' % (' + FK.int(S.h) + ')' : '—'); g.show('l', S.last.length ? S.last[0] + ' caras de ' + FK.int(S.last[1]) : '—'); g.dirty(); };
    g.run({
      static: true,

      draw(c, W, H) {

        const gx = 60, gy = 30, gw = W - 100, gh = H - 80; D.box(c, gx, gy, gw, gh, '#fff', { r: 10 });
        const Y = (p) => gy + gh - p * gh, X = (n) => gx + (Math.log10(Math.max(n, 1)) / 4.3) * gw;
        D.line(c, gx, Y(0.5), gx + gw, Y(0.5), '#12B76A', 3, [8, 6]); D.text(c, '50 %', gx - 8, Y(0.5), { size: 14, align: 'right', color: '#0A7A46', weight: 700 }); D.text(c, '100 %', gx - 8, Y(1), { size: 12, align: 'right' }); D.text(c, '0 %', gx - 8, Y(0), { size: 12, align: 'right' });
        [1, 10, 100, 1000, 10000].forEach((n) => { D.line(c, X(n), gy + gh, X(n), gy + gh + 6, D.INK, 2); D.text(c, FK.int(n), X(n), gy + gh + 20, { size: 12, align: 'center' }); }); D.text(c, 'número de lanzamientos →', gx + gw - 4, gy + gh + 38, { size: 12, align: 'right' });

  /* ---------- Tablero de Galton ---------- */
  FK.sim('galton', function (g) {
    const ctx = g.canvas(1.7);
    g.slider('p', { label: 'Probabilidad de ir a la derecha', icon: '➡️', min: 0.1, max: 0.9, step: 0.05, value: 0.5, fmt: (v) => FK.n(v * 100, 0) + ' %' , onchange: () => { S.bins = new Array(ROWS + 1).fill(0); S.n = 0; S.balls = []; } });
    g.button('Soltar 1', () => drop(1), { icon: '⚪' }); g.button('Soltar 20', () => drop(20), { icon: '⚪' }); g.button('Soltar 100', () => drop(100), { icon: '⚪', kind: 'ghost' });
    g.toggle('th', { label: 'Mostrar la curva teórica', value: false });
    g.out('n', 'Bolitas', { icon: '⚪', hl: true });
    const ROWS = 10, S = { balls: [], bins: new Array(ROWS + 1).fill(0), n: 0, half: 0 };
    function drop(k) { for (let i = 0; i < k; i++) { const path = []; let r = 0; for (let j = 0; j < ROWS; j++) { const right = Math.random() < g.p.p; if (right) r++; path.push(right); } if (S.balls.length < 40) S.balls.push({ path, t: -i * 0.08, r }); else { S.bins[r]++; S.n++; } } g.show('n', S.n + S.balls.length); }

      step(dt) {
        S.balls.forEach((b) => (b.t += dt * 6));
        S.balls = S.balls.filter((b) => { if (b.t >= ROWS) { S.bins[b.r]++; S.n++; return false; } return true; });
        g.show('n', S.n + S.balls.length);
        if (S.n >= 200 && Math.abs(g.p.p - 0.5) < 0.01 && !g.won()) g.win('¡Una campana! Cada bolita es impredecible, pero juntas forman un patrón.');
      },
      draw(c, W, H) {
        D.sky(c, W, H, '#F6E4D0', '#FFF6E5');
        const cx = W / 2, top = 40, dy = 28, dx = 36;
        for (let r = 0; r < ROWS; r++) for (let k = 0; k <= r; k++) D.circle(c, cx + (k - r / 2) * dx, top + r * dy, 4.5, '#8A8AA0', D.INK, 1.5);
        S.balls.forEach((b) => { if (b.t < 0) return; const rr = Math.min(ROWS, b.t); let x = 0; const whole = Math.floor(rr); let k = 0; for (let j = 0; j < whole; j++) k += b.path[j] ? 1 : 0; const frac = rr - whole; const nxt = whole < ROWS ? (b.path[whole] ? 1 : 0) : 0; const px = cx + ((k + frac * nxt) - (whole + frac) / 2) * dx; D.circle(c, px, top + rr * dy + 8, 6, '#FF8A1F', D.INK, 2); });
        const bx0 = cx - (ROWS / 2) * dx, bot = H - 14, mx = Math.max(6, ...S.bins);
        for (let i = 0; i <= ROWS; i++) { const h = (S.bins[i] / mx) * 130, x = bx0 + i * dx - dx / 2; D.box(c, x + 2, bot - h, dx - 4, h, '#8E5CF6', { r: 4, lw: 2 }); }
        if (g.p.th && S.n > 0) { c.beginPath(); for (let i = 0; i <= ROWS; i++) { const p = C.binomPMF(ROWS, i, g.p.p), tot = S.n; const h = (p * tot / mx) * 130, x = bx0 + i * dx; i ? c.lineTo(x, bot - h) : c.moveTo(x, bot - h); } c.strokeStyle = '#FF4757'; c.lineWidth = 3; c.stroke(); }
        D.char(c, 'terra', 70, H - 90, 70, 'happy');
      }
    });
  });

  /* ---------- Péndulo doble (caos) ---------- */
  FK.sim('pendulo-doble', function (g) {
    const ctx = g.canvas(1.9);
    g.slider('a', { label: 'Ángulo inicial', icon: '📐', min: 5, max: 170, step: 5, value: 120, unit: '°', fmt: (v) => FK.n(v, 0), reset: true });
    g.out('t', 'Tiempo', { icon: '⏱️' }); g.out('d', 'Separación entre los dos péndulos', { icon: '↔️', hl: true });
    const S = { A: null, B: null, trA: [], trB: [], t: 0, big: false, small: 0 };
    g.run({
      init() { const a = M.rad(g.p.a); S.A = [a, a, 0, 0]; S.B = [a + 0.001, a, 0, 0]; S.trA = []; S.trB = []; S.t = 0; g.say('Los dos péndulos empiezan con una diferencia de solo 0,06°. ¿Seguirán juntos?'); },
      step(dt) {
        const n = 6, h = (dt * 1.6) / n;
        for (let i = 0; i < n; i++) { S.A = C.dblPend(S.A, h); S.B = C.dblPend(S.B, h); S.t += h / 1.6 * 1.6; }
        const tipA = [Math.sin(S.A[0]) + Math.sin(S.A[1]), -Math.cos(S.A[0]) - Math.cos(S.A[1])], tipB = [Math.sin(S.B[0]) + Math.sin(S.B[1]), -Math.cos(S.B[0]) - Math.cos(S.B[1])];
        S.trA.push(tipA); S.trB.push(tipB); if (S.trA.length > 220) { S.trA.shift(); S.trB.shift(); }
        const sep = Math.hypot(tipA[0] - tipB[0], tipA[1] - tipB[1]); g.show('t', FK.n(S.t, 1) + ' s'); g.show('d', sep < 0.01 ? '≈ 0 (siguen juntos)' : FK.n(sep, 2) + ' (de 4)');
        if (S.t > 5 && g.p.a >= 100 && sep > 1.2) S.big = true; if (S.t > 18 && g.p.a <= 30 && sep < 0.05) S.small = 1;
        if (S.big && S.small && !g.won()) g.win('¡Caos! Con ángulos grandes una diferencia minúscula crece hasta hacer movimientos totalmente distintos; con ángulos pequeños, no.');
        else if (S.big && !S.said) { S.said = true; g.say('¡Se separaron! Ahora prueba con un ángulo pequeño (30° o menos) y espera unos 20 segundos.', 'wow'); }
      },
      draw(c, W, H) {
        D.sky(c, W, H, '#F3EAFF', '#FFFFFF'); const px = W / 2, py = 120, L = 85;
        const draw = (st, col, tr) => { c.beginPath(); tr.forEach((p, i) => { const x = px + p[0] * L, y = py - p[1] * L; i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.strokeStyle = col; c.globalAlpha = 0.4; c.lineWidth = 2; c.stroke(); c.globalAlpha = 1; const x1 = px + L * Math.sin(st[0]), y1 = py + L * Math.cos(st[0]), x2 = x1 + L * Math.sin(st[1]), y2 = y1 + L * Math.cos(st[1]); D.line(c, px, py, x1, y1, col, 4); D.line(c, x1, y1, x2, y2, col, 4); D.circle(c, x1, y1, 8, col, '#fff', 2); D.circle(c, x2, y2, 11, col, '#fff', 2); };
        draw(S.A, '#1E88FF', S.trA); draw(S.B, '#FF4757', S.trB); D.circle(c, px, py, 6, D.INK);
        D.text(c, 'azul y rojo: casi idénticos', 20, 24, { size: 14, color: D.INK }); D.char(c, 'terra', W - 60, 56, 66, 'happy');
      }
    });
  });
})();

(function () {
  'use strict';
  const FK = window.FK, M = FK.M;

  FK.sim('quien-soy', function (g) {
    FK.kit.match(g, [
      ['📜 Búho Sabio', 'Historia y método de la ciencia'], ['🐱 Newti', 'Mecánica: movimiento y fuerzas'], ['💧 Gotín', 'Fluidos: agua y aire'], ['🔥 Flamo', 'Termodinámica: calor'], ['🦇 Eco', 'Ondas y sonido'],
      ['💡 Lumi', 'Óptica: luz y color'], ['⚡ Chispa', 'Electricidad y magnetismo'], ['🚀 Cosmo', 'Astronomía y cosmología'], ['⚛️ Quarki', 'Átomos, cuántica y partículas'], ['🌍 Terra', 'Tierra, cuerpo, materiales y azar']
    ]);
  });

  /* ---------- El Gran Reto: 10 preguntas al azar de todos los capítulos ---------- */
  FK.sim('gran-reto', function (g) {
    const area = g.area('gr');
    const bank = [];
    FK.chapters.forEach((c) => c.tpl.content.querySelectorAll('.quiz .q').forEach((q) => {
      const p = q.querySelector('p'), opts = Array.from(q.querySelectorAll('ol li')).map((l) => l.innerHTML), why = q.querySelector('p.why');
      if (p && opts.length && why) bank.push({ q: p.innerHTML, opts, ans: +q.dataset.ans, why: why.innerHTML, ch: c });
    }));
    const S = { qs: [], i: 0, ok: 0, done: false };
    const N = 10;
    function newRound() {
      /* una pregunta por capítulo distinto, al azar */
      const byCh = M.shuffle(FK.chapters.filter((c) => c.num !== 47));
      S.qs = byCh.slice(0, N).map((c) => M.pick(bank.filter((b) => b.ch === c)));
      S.i = 0; S.ok = 0; S.done = false; render();
    }
    function render() {
      if (S.done) {
        const win = S.ok >= 8;
        area.innerHTML = `<div class="gr-end"><div class="gr-big">${win ? '🏆' : '💪'}</div><h3>${S.ok} de ${N}</h3><p>${win ? '¡Superaste el Gran Reto! Eres oficialmente un/a gran físico/a KIDS.' : 'Casi. Repasa los capítulos y vuelve a intentar con otras preguntas.'}</p><button class="btn primary" type="button">🔁 Otro Gran Reto</button></div>`;
        area.querySelector('button').addEventListener('click', newRound);
        if (win) g.win(`¡${S.ok} de ${N}! ¡Superaste el Gran Reto!`); else g.say(`Acertaste ${S.ok} de ${N}. Necesitas 8. ¡Tú puedes!`, 'think');
        return;
      }
      const q = S.qs[S.i];
      area.innerHTML = `<div class="gr-bar"><span>Pregunta ${S.i + 1} de ${N}</span><span>⭐ ${S.ok} aciertos</span></div><div class="gr-ch">Capítulo ${q.ch.num}: ${q.ch.title}</div><h3 class="gr-q">${q.q}</h3><div class="opts"></div><div class="gr-why" hidden></div><div class="btnrow"><button class="btn primary gr-next" type="button" hidden>Siguiente →</button></div>`;
      const box = area.querySelector('.opts'), why = area.querySelector('.gr-why'), next = area.querySelector('.gr-next');
      q.opts.forEach((o, j) => {
        const b = FK.el('button', 'opt', `<span class="opt-l">${'ABCD'[j]}</span><span>${o}</span>`); b.type = 'button';
        b.addEventListener('click', () => {
          if (box.classList.contains('locked')) return; box.classList.add('locked');
          const right = j === q.ans; if (right) { S.ok++; b.classList.add('right'); FK.sfx.ok(); } else { b.classList.add('wrong'); box.children[q.ans].classList.add('right'); FK.sfx.no(); }
          why.hidden = false; why.innerHTML = (right ? '<b>¡Correcto!</b> ' : '<b>La respuesta era la ' + 'ABCD'[q.ans] + '.</b> ') + q.why; next.hidden = false; next.textContent = S.i === N - 1 ? 'Ver mi resultado' : 'Siguiente →';
        });
        box.appendChild(b);
      });
      next.addEventListener('click', () => { S.i++; if (S.i >= N) S.done = true; render(); });
    }
    g.run({ static: true, init() { newRound(); g.say('¡Prepárate! Diez preguntas de diez mundos distintos.'); } });
  });
})();

      <h2 class="sec-t">Mi diploma</h2>
      <div class="diploma-box"><label class="nm">¿Cómo te llamas? <input id="ppName" type="text" maxlength="40" placeholder="Escribe tu nombre" value="${String(name).replace(/"/g, '&quot;')}"></label>
        <div class="diploma" id="diploma"><div class="dp-in"><div class="dp-top">${FK.char('buho', 'happy', 70)}${FK.char('newti', 'happy', 70)}${FK.char('cosmo', 'happy', 70)}${FK.char('chispa', 'happy', 70)}${FK.char('quarki', 'happy', 70)}</div><small>Diploma de</small><h2>Física KIDS</h2><p>Se entrega con orgullo a</p><div class="dp-name" id="dpName">${name || '________________'}</div><p>por explorar el universo, hacer preguntas, experimentar y ganar <b>${tot.done}</b> estrellas.</p><p class="dp-t">${title}</p><div class="dp-sign">Mg. Manuel Alejandro Obando<br><small>Departamento de Física · Universidad del Cauca</small></div></div></div>
        <div class="btnrow"><button class="btn primary" id="ppPrint" type="button">🖨️ Imprimir mi diploma</button></div></div>
      <h2 class="sec-t">Opciones</h2>
      <div class="btnrow"><button class="btn ghost" id="ppReset" type="button">🗑️ Borrar mi progreso</button></div><p class="sec-p" id="ppResetMsg"></p></div>`;
    $('#ppName').addEventListener('input', (e) => { FK.store.set('nombre', e.target.value); $('#dpName').textContent = e.target.value || '________________'; });
    $('#ppPrint').addEventListener('click', () => { document.body.classList.add('print-dp'); try { window.print(); } catch (e) { /* sin impresión */ } FK.toast('Si no se abre la impresión, toma una captura de pantalla del diploma 📸'); setTimeout(() => document.body.classList.remove('print-dp'), 800); });
    let armed = false;
    $('#ppReset').addEventListener('click', (e) => {
      if (!armed) { armed = true; e.target.textContent = '⚠️ Toca otra vez para borrar todo'; $('#ppResetMsg').textContent = 'Se borrarán tus estrellas y experimentos. No se puede deshacer.'; setTimeout(() => { armed = false; e.target.textContent = '🗑️ Borrar mi progreso'; $('#ppResetMsg').textContent = ''; }, 5000); return; }
      FK.store.keys().filter((k) => /^(win|q|e):/.test(k)).forEach((k) => FK.store.del(k));
      FK.updateProgress(); renderPassport();
    });
    FK.updateProgress(); setTitle('Mi pasaporte');
  }

  /* ---------- Glosario (autogenerado de las palabras <dfn>) ---------- */
  function renderGlossary() {
    const map = new Map();
    FK.chapters.forEach((c) => c.tpl.content.querySelectorAll('dfn[data-def]').forEach((d) => {
      const k = d.textContent.trim().toLowerCase();
      if (!map.has(k)) map.set(k, { t: d.textContent.trim(), def: d.dataset.def, ch: c });
    }));
    const items = Array.from(map.values()).sort((a, b) => a.t.localeCompare(b.t, 'es'));
    let letter = '', html = '';
    items.forEach((it) => {
      const L = it.t[0].toUpperCase();
      if (L !== letter) { letter = L; html += `<h3 class="gl-l">${L}</h3>`; }
      html += `<div class="gl-i"><b>${it.t}</b><span>${it.def}</span><a href="#${it.ch.id}">cap. ${it.ch.num}</a></div>`;
    });
    main().innerHTML = `<div class="home"><header class="pp-h"><div><div class="kicker">Diccionario</div><h1>📖 Palabras de ciencia</h1><p class="hero-p">${items.length} palabras explicadas fácil. En los capítulos, toca las palabras subrayadas para ver su significado.</p></div></header><input class="gl-s" id="glS" type="search" placeholder="Buscar una palabra…" aria-label="Buscar una palabra"><div id="glList">${html}</div></div>`;
    $('#glS').addEventListener('input', (e) => {
      const v = e.target.value.trim().toLowerCase();
      $$('#glList .gl-i').forEach((x) => { x.style.display = !v || x.textContent.toLowerCase().includes(v) ? '' : 'none'; });
      $$('#glList .gl-l').forEach((x) => { let n = x.nextElementSibling, any = false; while (n && n.classList.contains('gl-i')) { if (n.style.display !== 'none') any = true; n = n.nextElementSibling; } x.style.display = any ? '' : 'none'; });
    });
    setTitle('Diccionario');
  }

  /* ---------- Cajón de experimentos ---------- */
  function renderExperiments() {
    const rows = [];
    FK.chapters.forEach((c) => c.tpl.content.querySelectorAll('.exp').forEach((e, i) => rows.push({ c, i, t: e.dataset.title, time: e.dataset.time || '10 min', lvl: { 1: 'Fácil', 2: 'Medio', 3: 'Reto' }[e.dataset.level] || 'Fácil', adult: e.dataset.adult === '1', mat: Array.from(e.querySelectorAll('ul.mat li')).map((x) => x.textContent) })));
    const html = FK.WORLDS.filter(Boolean).map((w) => {
      const rs = rows.filter((r) => r.c.world === w.id);
      if (!rs.length) return '';
      const ch = FK.CHARS[w.char];
      return `<h3 class="ex-w" style="--c:${ch.color}">${FK.char(w.char, 'happy', 38)} ${w.name}</h3>` + rs.map((r) => {
        const done = FK.store.get(FK.eKey(r.c.id, r.i), false);
        return `<a class="ex-i ${done ? 'done' : ''}" href="#${r.c.id}"><span class="ex-ck">${done ? '✅' : '🧪'}</span><span class="ex-b"><b>${r.t}</b><small>cap. ${r.c.num} · ⏱ ${r.time} · ⭐ ${r.lvl}${r.adult ? ' · 👩‍👧 con adulto' : ''}</small><small class="ex-m">${r.mat.join(' · ')}</small></span></a>`;
      }).join('');
    }).join('');
    const done = rows.filter((r) => FK.store.get(FK.eKey(r.c.id, r.i), false)).length;
    main().innerHTML = `<div class="home"><header class="pp-h"><div><div class="kicker">Cajón de experimentos</div><h1>🧪 ${rows.length} experimentos</h1><p class="hero-p">Todos con cosas que hay en casa. Has hecho <b>${done}</b>. Toca uno para ver los pasos.</p></div></header>${html}</div>`;
    setTitle('Cajón de experimentos');
  }

  /* ---------- Menú lateral ---------- */
  function buildDrawer() {
    const d = $('#drawerList');
    d.innerHTML = `<a class="dr-h" href="#inicio">🗺️ Mapa de mundos</a><a class="dr-h" href="#pasaporte">🎫 Mi pasaporte</a>` + FK.WORLDS.filter(Boolean).map((w) => {
      const c = FK.CHARS[w.char];
      return `<div class="dr-w" style="--c:${c.color}"><div class="dr-wt"><span>${FK.char(w.char, 'happy', 30)}</span>${w.id}. ${w.name}</div>${FK.chapters.filter((x) => x.world === w.id).map((x) => `<a class="dr-c" data-prog="${x.id}" data-id="${x.id}" href="#${x.id}"><span class="dr-n">${x.num}</span>${x.title}</a>`).join('')}</div>`;
    }).join('') + `<a class="dr-h" href="#experimentos">🧪 Cajón de experimentos</a><a class="dr-h" href="#glosario">📖 Diccionario</a><a class="dr-h" href="#familias">👨‍👩‍👧 Familias y maestros</a><a class="dr-h" href="#creditos">🏷️ Créditos</a>`;
  }
  function openDrawer(v) { document.body.classList.toggle('drawer-open', v); $('#menuBtn').setAttribute('aria-expanded', v ? 'true' : 'false'); }

  /* ---------- Rutas ---------- */
  function route() {
    FK.stopSpeak();
    FK.activeSims && FK.activeSims.forEach((g) => { g._dead = true; if (g._stopAudio) g._stopAudio(); });
    FK.activeSims = new Set();
    const h = decodeURIComponent(location.hash.replace(/^#/, '')) || 'inicio';
    openDrawer(false);
    let scroll = true;
    if (h === 'inicio') renderHome();
    else if (h.startsWith('mundo-')) { renderHome(); const el = document.getElementById(h); if (el) { el.scrollIntoView(); scroll = false; } }
    else if (h === 'pasaporte') renderPassport();
    else if (h === 'glosario') renderGlossary();
    else if (h === 'experimentos') renderExperiments();
    else if (FK.pages[h]) renderPage(FK.pages[h]);
    else if (byId(h)) renderChapter(byId(h));
    else { location.hash = '#inicio'; return; }
    $$('.dr-c').forEach((a) => a.classList.toggle('cur', a.dataset.id === h));
    if (scroll) window.scrollTo(0, 0);
    FK.updateProgress();
  }

  /* ---------- Tema ---------- */
  function applyTheme() {
    const t = FK.store.get('theme', 'auto');
    if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
    const b = $('#themeBtn'); if (b) b.querySelector('span').textContent = t === 'dark' ? '🌙' : t === 'light' ? '☀️' : '🌗';
  }
  function applySound() { const b = $('#soundBtn'); if (b) b.textContent = FK.soundOn() ? '🔊' : '🔇'; }

  /* ---------- Arranque ---------- */
  function boot() {
    buildDrawer();
    $('#menuBtn').addEventListener('click', () => openDrawer(!document.body.classList.contains('drawer-open')));
    $('#scrim').addEventListener('click', () => openDrawer(false));
    $('#themeBtn').addEventListener('click', () => { const o = ['auto', 'light', 'dark'], t = FK.store.get('theme', 'auto'); FK.store.set('theme', o[(o.indexOf(t) + 1) % 3]); applyTheme(); });
    $('#soundBtn').addEventListener('click', () => { FK.store.set('sound', !FK.soundOn()); applySound(); if (FK.soundOn()) FK.sfx.ok(); });
    $('#drawerSearch').addEventListener('input', (e) => {
      const v = e.target.value.trim().toLowerCase();
      $$('#drawerList .dr-c').forEach((a) => { const c = byId(a.dataset.id); a.style.display = !v || (c.title + ' ' + c.short).toLowerCase().includes(v) ? '' : 'none'; });
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') openDrawer(false); });
    applyTheme(); applySound();
    window.addEventListener('hashchange', route);
    route();
    if (FK.speakOK()) window.speechSynthesis.getVoices();
    FK.updateProgress();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
</html>
