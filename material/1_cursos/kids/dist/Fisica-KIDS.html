<!-- 41-relatividad.html -->
<template class="chapter-src" data-id="relatividad" data-num="41" data-world="9" data-title="La relatividad de Einstein" data-short="El tiempo que corre distinto, el espacio que se curva y por qué el GPS necesita a Einstein.">
<p class="lead">¿Y si el tiempo no corriera igual para todos? ¿Y si la gravedad no fuera una fuerza, sino la forma del espacio? Albert Einstein, un joven de 26 años que trabajaba en una oficina de patentes, cambió para siempre la forma de entender el tiempo, el espacio y la gravedad.</p>

<div class="learn"><ul>
<li>Nada puede ir más rápido que la luz, y su rapidez es la misma para todos.</li>
<li>Para quien se mueve muy rápido, el tiempo pasa más despacio (¡es verdad!).</li>
<li>La masa dobla el espacio y el tiempo, y eso es lo que sentimos como gravedad.</li>
<li>Los relojes de los satélites GPS corrigen efectos relativistas todos los días.</li>
</ul></div>

<div class="say" data-who="quarki" data-mood="wow"><p>¡Cuidado, que esto es de los temas más locos de la física! El tiempo y el espacio no son lo que parecen. Pero todo se ha comprobado con experimentos. ¿Te atreves?</p></div>

<section>
<h2>Relatividad especial: la luz siempre igual</h2>
<p>En 1905, Einstein partió de una idea sencilla y extraña: <strong>la luz siempre viaja a la misma rapidez</strong> (300 000 km/s), sin importar si tú te mueves hacia ella o te alejas. Si vas en un tren a 100 km/h y lanzas una pelota hacia adelante, la rapidez de la pelota respecto al suelo se suma. Pero con la luz no: ¡siempre es la misma!</p>
<p>Para que esto sea posible, hay algo que tiene que ceder: el <strong>tiempo</strong> y el <strong>espacio</strong>. Para alguien que se mueve a una rapidez parecida a la de la luz, el tiempo pasa más despacio. A esto se le llama <dfn data-def="Cuando el tiempo pasa más despacio para algo que se mueve muy rápido, comparado con algo que está quieto.">dilatación del tiempo</dfn>.</p>
<div class="magic" data-name="El reloj de luz"><big>más rápido = tiempo más lento</big>A 87 % de la rapidez de la luz, el tiempo pasa a la mitad de velocidad.</div>
<div class="sim" data-sim="reloj-luz" data-title="El reloj de luz y los gemelos" data-goal="Manda a un viajero a una velocidad cercana a la de la luz, para que al volver sea la mitad de viejo que su hermano gemelo.">
<ul><li>Dentro del reloj, un fotón rebota entre dos espejos. Cuando el reloj se mueve, el fotón recorre un camino más largo en diagonal: ¡cada tic tarda más!</li><li>A 87 % de la velocidad de la luz, el viajero envejece la mitad.</li></ul>
</div>
<div class="fact"><p>La dilatación del tiempo no es teoría solamente: se ha medido con relojes atómicos en aviones y con partículas llamadas muones, que viven apenas 2 millonésimas de segundo y, gracias a la dilatación, llegan hasta el suelo desde la alta atmósfera. ¡Sin relatividad no llegarían!</p></div>
<details class="curious"><p>El factor de dilatación es γ = 1/√(1 − v²/c²). A v = 0,5c, γ = 1,15; a v = 0,87c, γ = 2; a v = 0,99c, γ = 7,1; a v = 0,9999c, γ = 70. Cuando v se acerca a c, γ crece sin límite: se necesitaría una energía infinita para alcanzar la rapidez de la luz. Por eso nada con masa puede llegar a ella. Además, E = mc² dice que masa y energía son equivalentes: por eso un objeto que se acelera «pesa» más.</p></details>
</section>

<section>
<h2>Relatividad general: el espacio que se curva</h2>
<p>En 1915, Einstein dio un paso más: la gravedad no es una fuerza que jala, sino un efecto de que <strong>la masa curva el espacio y el tiempo</strong>. Imagina una sábana elástica bien estirada: si pones una bola pesada en el centro, la sábana se hunde, y una canica que pase cerca cae hacia la bola. Así, los planetas giran alrededor del Sol porque el Sol «hunde» el espacio a su alrededor, y siguen el camino más recto posible en ese espacio curvo.</p>
<div class="story" data-title="El eclipse que hizo famoso a Einstein"><p>Si la masa curva el espacio, también debe doblar la luz de las estrellas que pasan cerca del Sol. En 1919, durante un eclipse total, el astrónomo Arthur Eddington fotografió estrellas cerca del borde del Sol y comprobó que parecían estar un poquito desplazadas, justo lo que había predicho Einstein. ¡Fue noticia en todo el mundo!</p></div>
<div class="sim" data-sim="lente-gravitacional" data-title="Doblando la luz con una estrella" data-goal="Ajusta la masa y la distancia para que la luz curvada por la estrella llegue al blanco.">
<ul><li>Más masa o más cerca: la luz se dobla más.</li><li>(El ángulo está exagerado para que se vea; en la realidad es muy pequeño.)</li></ul>
</div>
<div class="fact"><p>En 2015, el detector LIGO captó por primera vez ondas gravitacionales: «arrugas» del espacio-tiempo producidas por dos agujeros negros que chocaron hace 1300 millones de años. Einstein las había predicho cien años antes. Y en 2019 y 2022 se obtuvieron las primeras imágenes de agujeros negros.</p></div>
</section>

<section>
<h2>La relatividad en tu bolsillo: el GPS</h2>
<p>Los satélites del GPS giran a unos 20 000 km de altura a casi 4 km/s. Sus relojes atómicos van <b>más lentos</b> por su velocidad (relatividad especial: −7 millonésimas de segundo por día) y <b>más rápidos</b> porque están donde la gravedad es más débil (relatividad general: +46 millonésimas de segundo por día). El resultado neto: ¡sus relojes adelantan unos 38 millonésimas de segundo al día! Parece poquísimo, pero el GPS calcula tu posición midiendo el tiempo de las señales de radio (que viajan a la velocidad de la luz), así que cada millonésima de segundo de error equivale a unos 300 metros.</p>
<div class="sim" data-sim="gps-relatividad" data-title="Si no corrigiéramos a Einstein" data-goal="Mira cuánto se equivocaría tu GPS sin la relatividad, y cómo se corrige.">
<ul><li>Sin corrección, el error crecería unos 11 kilómetros cada día.</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="El trampolín del espacio-tiempo" data-time="30 min" data-level="2">
<ul class="mat"><li>🧵 Una tela elástica (media de nylon, lycra o una camiseta elástica)</li><li>🪟 Un aro de bordado o la tapa de una caja grande sin fondo para estirarla</li><li>🔮 Una bola pesada (una bola de petanca o una naranja) y canicas pequeñas</li></ul>
<ol class="steps"><li>Estira la tela sobre el aro, bien tensa.</li><li>Pon la bola pesada en el centro: verás cómo hunde la tela.</li><li>Lanza una canica pequeña desde el borde, con un empujoncito de lado, hacia la bola. Observa su camino.</li><li>Prueba con distintas velocidades y con una bola más liviana en el centro.</li></ol>
<p class="predict">¿La canica irá en línea recta o hará una curva?</p>
<p class="result">La canica hace una curva alrededor de la bola del centro y, si va con la rapidez adecuada, da varias vueltas, ¡como un planeta! Con una bola más pesada la curva es más cerrada.</p>
<p class="why">La bola central deforma la tela: la canica sigue el camino más recto en una superficie curva. Esto representa cómo la masa curva el espacio-tiempo (con una diferencia: en la tela, la fricción y la gravedad real que mueven la canica sí tienen un papel).</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>Según Einstein, ¿qué pasa con el tiempo para un viajero que va a una velocidad cercana a la de la luz?</p><ol><li>Pasa más rápido</li><li>Pasa más despacio, comparado con alguien quieto</li><li>No cambia</li></ol><p class="why">La dilatación del tiempo: para quien se mueve muy rápido, el tiempo pasa más lento.</p></div>
<div class="q" data-ans="2"><p>Según la relatividad general, la gravedad es…</p><ol><li>Un hilo invisible</li><li>Una fuerza magnética</li><li>El efecto de la masa que curva el espacio-tiempo</li></ol><p class="why">Los objetos con masa curvan el espacio y el tiempo; los demás siguen caminos curvos.</p></div>
<div class="q" data-ans="0"><p>¿Qué se necesita corregir en los satélites GPS?</p><ol><li>Sus relojes, por efectos relativistas</li><li>Sus colores</li><li>Su tamaño</li></ol><p class="why">Si no se corrigen, el GPS se equivocaría varios kilómetros por día.</p></div>
<div class="q" data-ans="1"><p>¿Qué máximo de rapidez existe en el universo?</p><ol><li>La del sonido</li><li>La de la luz</li><li>No hay máximo</li></ol><p class="why">Nada con masa puede alcanzar la rapidez de la luz en el vacío: unos 300 000 km/s.</p></div>
</div>

<!-- 42-particulas.html -->
<template class="chapter-src" data-id="particulas" data-num="42" data-world="9" data-title="Partículas y fuerzas fundamentales" data-short="Quarks, electrones, neutrinos, las cuatro fuerzas de la naturaleza y el gran acelerador de partículas.">
<p class="lead">Los protones y neutrones tampoco son lo más pequeño: están hechos de partículas aún más diminutas llamadas <strong>quarks</strong>. Hoy sabemos que todo el universo está construido con un puñado de partículas y cuatro fuerzas. ¡Es como un juego de piezas de construcción cósmico!</p>

<div class="learn"><ul>
<li>Los protones y neutrones están hechos de quarks (de tipos «arriba» y «abajo»).</li>
<li>Los electrones y los neutrinos son partículas fundamentales (no tienen partes).</li>
<li>Existen cuatro fuerzas: gravedad, electromagnética, fuerte y débil.</li>
<li>Los aceleradores de partículas, como el LHC del CERN, chocan partículas para descubrir otras nuevas.</li>
</ul></div>

<div class="say" data-who="quarki" data-mood="happy"><p>¡Ya casi terminas el mundo de lo pequeño! Esta es la parte más fundamental: las piezas más básicas de todo. Los quarks y yo somos primos… ¡aunque ellos son mucho más chiquitos!</p></div>

<section>
<h2>Los ladrillos de la materia</h2>
<p>En los años 1960, los físicos propusieron que protones y neutrones están hechos de partículas más pequeñas: los <dfn data-def="Las partículas fundamentales que forman los protones y neutrones. Hay seis tipos; los más comunes son el «arriba» y el «abajo».">quarks</dfn>. Hay seis tipos, pero para la materia normal solo importan dos:</p>
<ul><li>el quark <b>arriba</b> (u, de «up») tiene carga +2/3,</li><li>el quark <b>abajo</b> (d, de «down») tiene carga −1/3.</li></ul>
<p>Un <b>protón</b> son dos quarks arriba y uno abajo (uud): +2/3 + 2/3 − 1/3 = +1. Un <b>neutrón</b> es uno arriba y dos abajo (udd): +2/3 − 1/3 − 1/3 = 0. ¡Los quarks nunca se ven solos: siempre están en grupos!</p>
<div class="sim" data-sim="arma-particulas" data-title="Arma partículas con quarks" data-goal="Construye un protón (uud) y un neutrón (udd) con quarks arriba y abajo.">
<ul><li>Suma las cargas: +2/3 y −1/3.</li><li>También puedes probar otras combinaciones raras, como uuu o ddd, que existen un instante cortísimo.</li></ul>
</div>
<div class="fact"><p>Los electrones, en cambio, no tienen partes conocidas: son partículas fundamentales. Y hay otras parecidas: los <b>neutrinos</b>, partículas casi sin masa y sin carga que atraviesan todo: ¡unos 65 000 millones de neutrinos del Sol atraviesan cada centímetro cuadrado de tu piel cada segundo! Y casi ninguno choca con nada.</p></div>
<details class="curious"><p>El «modelo estándar» de la física de partículas agrupa 12 partículas de materia (6 quarks y 6 leptones, como el electrón y el neutrino), 4 partículas portadoras de fuerzas (fotón, gluón, W y Z) y el bosón de Higgs, que da masa a las demás. Además, cada partícula tiene una antipartícula con carga contraria: la del electrón es el positrón. Cuando una partícula y su antipartícula se juntan, ¡se aniquilan y se convierten en energía! (Se usa en los equipos PET de los hospitales.)</p></details>
</section>

<section>
<h2>Las cuatro fuerzas de la naturaleza</h2>
<div class="cols2">
<div class="card"><div class="big-emoji">🌍</div><h4>Gravedad</h4><p>Atrae todo lo que tiene masa. Es débil, pero llega lejísimos. Mantiene a los planetas y las galaxias.</p></div>
<div class="card"><div class="big-emoji">⚡</div><h4>Electromagnética</h4><p>Actúa entre cargas eléctricas. Mantiene los átomos unidos, hace funcionar la luz, la electricidad, los imanes y la química.</p></div>
<div class="card"><div class="big-emoji">🧲</div><h4>Fuerte</h4><p>Pega los quarks dentro de los protones y mantiene unidos a los protones y neutrones en el núcleo. ¡La más fuerte de todas!</p></div>
<div class="card"><div class="big-emoji">☢️</div><h4>Débil</h4><p>Causa ciertos tipos de radiactividad y permite que el Sol funda el hidrógeno.</p></div>
</div>
<div class="sim" data-sim="cuatro-fuerzas" data-title="¿Qué fuerza es?" data-goal="Une cada situación con la fuerza fundamental que la explica."></div>
<p>Las fuerzas se transmiten mediante partículas «mensajeras»: los fotones llevan la fuerza electromagnética, los gluones la fuerte, y los bosones W y Z la débil. Es como si dos personas patinando se lanzaran una pelota: al lanzarla y atraparla, ¡se empujan!</p>
</section>

<section>
<h2>El acelerador de partículas</h2>
<p>Para descubrir las partículas más pequeñas, los científicos las hacen <b>chocar con muchísima energía</b>. Del choque pueden salir partículas nuevas (por E = mc², la energía se convierte en masa). Para llevar las partículas a casi la rapidez de la luz usan <strong>aceleradores</strong>: anillos enormes donde campos eléctricos las aceleran y <b>imanes</b> gigantes las mantienen en círculo.</p>
<div class="story" data-title="El LHC y el bosón de Higgs"><p>El Gran Colisionador de Hadrones (LHC) está en el CERN, en la frontera entre Suiza y Francia. Es un anillo subterráneo de 27 kilómetros de largo donde chocan protones a casi la rapidez de la luz. En 2012 descubrió el bosón de Higgs, la pieza que faltaba y que explica por qué las partículas tienen masa. Participan miles de científicos de todo el mundo, incluidos investigadores de universidades colombianas.</p></div>
<div class="sim" data-sim="acelerador" data-title="Mini acelerador de partículas" data-goal="Ajusta la energía de los protones y el campo magnético para que el haz recorra el anillo sin chocar. Luego provoca colisiones.">
<ul><li>Para mantener el haz en el anillo: radio = energía ÷ (0,3 × campo).</li><li>Más energía necesita un campo magnético más fuerte.</li><li>Cuando el haz es estable, presiona «¡Chocar!».</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Una cámara de niebla casera" data-time="45 min" data-level="3" data-adult="1">
<ul class="mat"><li>🫙 Un frasco transparente con tapa de metal (o un acuario pequeño)</li><li>🧴 Alcohol isopropílico (≥ 90 %)</li><li>🧽 Una esponja o fieltro negro</li><li>🧊 Hielo seco (¡solo un adulto!) o varios paquetes de hielo muy frío</li><li>🔦 Una linterna potente</li><li>🧤 Guantes y gafas de seguridad</li></ul>
<ol class="steps"><li>Un adulto pega el fieltro en el fondo del frasco boca abajo (la tapa) y lo empapa de alcohol.</li><li>Pon la tapa sobre el hielo muy frío con el frasco boca abajo, de modo que el fondo (la tapa) quede frío.</li><li>Espera unos 10 minutos y alumbra de lado con la linterna en un cuarto oscuro.</li><li>Mira con paciencia: aparecen «rayitas» blancas de niebla que duran un segundo.</li></ol>
<p class="warn">El alcohol es inflamable y el hielo seco quema la piel. Un adulto debe manejarlos. No fumes ni uses fuego cerca.</p>
<p class="predict">¿Qué crees que son las rayitas?</p>
<p class="result">Aparecen trazas finas de niebla que salen de un punto y duran un instante: son las huellas de partículas (rayos cósmicos y partículas de radiactividad natural) que atraviesan la cámara.</p>
<p class="why">Las partículas con carga que atraviesan el vapor de alcohol enfriado lo ionizan y dejan una línea de gotitas, como la estela de un avión. ¡Estás viendo los rayos cósmicos que llegan del espacio!</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>¿De qué están hechos los protones?</p><ol><li>De electrones</li><li>De quarks</li><li>De neutrinos</li></ol><p class="why">Un protón tiene dos quarks arriba y un quark abajo.</p></div>
<div class="q" data-ans="0"><p>¿Qué fuerza mantiene unidos a los protones y neutrones en el núcleo?</p><ol><li>La fuerza fuerte</li><li>La gravedad</li><li>El magnetismo</li></ol><p class="why">La fuerza nuclear fuerte es la más intensa y pega el núcleo.</p></div>
<div class="q" data-ans="2"><p>¿Para qué sirve un acelerador de partículas?</p><ol><li>Para hacer más rápido el internet</li><li>Para calentar agua</li><li>Para chocar partículas y descubrir otras nuevas</li></ol><p class="why">Se hacen chocar partículas con mucha energía y se observa lo que sale.</p></div>
<div class="q" data-ans="1"><p>¿Qué se descubrió en el LHC en 2012?</p><ol><li>La gravedad</li><li>El bosón de Higgs</li><li>El átomo</li></ol><p class="why">El bosón de Higgs, la partícula asociada con el origen de la masa.</p></div>
</div>

<!-- 43-cuerpo.html -->
<template class="chapter-src" data-id="cuerpo" data-num="43" data-world="10" data-title="La física de tu cuerpo y de los animales" data-short="Palancas en tus brazos, el equilibrio, el corazón, y los superpoderes de los animales.">
<p class="lead">Tu cuerpo es una máquina física increíble: tus huesos son palancas, tu corazón es una bomba, tus ojos son cámaras y tus nervios llevan electricidad. Y los animales tienen «superpoderes» que usan física que nosotros apenas empezamos a entender. ¡Vamos a explorarlos con Terra!</p>

<div class="learn"><ul>
<li>Los huesos y músculos funcionan como palancas.</li>
<li>Algo se mantiene en equilibrio si su centro de gravedad está sobre su apoyo.</li>
<li>El corazón es una bomba que mueve la sangre usando presión.</li>
<li>Muchos animales detectan ondas y campos que nosotros no sentimos.</li>
</ul></div>

<div class="say" data-who="terra" data-mood="happy"><p>¡Hola! Soy Terra, el planeta Tierra, y estoy lleno de vida. Cada ser vivo es un experimento de física que lleva millones de años funcionando. ¡Empecemos por tu propio cuerpo!</p></div>

<section>
<h2>Tu brazo es una palanca</h2>
<p>Cuando levantas algo con la mano, el hueso del antebrazo funciona como una <strong>palanca</strong>: el codo es el punto de apoyo y el bíceps (el músculo) jala del hueso a unos 4 centímetros del codo. Pero la mano está a unos 30 centímetros del codo. Como la carga está mucho más lejos del apoyo que el músculo, ¡el músculo debe hacer una fuerza mucho mayor que el peso que levantas! Para sostener 1 kg, el bíceps hace unos 7 kg de fuerza. Estamos hechos para <em>moverlas rápido</em> y con mucho recorrido, pero no para ahorrar fuerza.</p>
<div class="sim" data-sim="brazo-palanca" data-title="El bíceps y la palanca" data-goal="Sostén un peso de 4 kg con la menor fuerza posible del bíceps: ¡acerca el peso al codo!">
<ul><li>Mientras más lejos del codo está el peso, más fuerza hace falta.</li><li>Un músculo que se une más lejos del codo haría menos fuerza… pero se movería menos.</li></ul>
</div>
<div class="fact"><p>Tu fémur (el hueso del muslo) es el más largo y resistente del cuerpo: aguanta más que el concreto. Y el hueso más pequeño del cuerpo es el estribo, dentro del oído: mide unos 3 mm, ¡y ayuda a transmitir el sonido!</p></div>
</section>

<section>
<h2>El equilibrio y el centro de gravedad</h2>
<p>Cada objeto tiene un punto llamado <strong>centro de gravedad</strong>, donde parece concentrarse todo su peso. Un objeto se mantiene en equilibrio mientras la vertical que baja desde ese punto cae <em>sobre</em> la base de apoyo. Si cae afuera, se vuelca. Por eso abres las piernas para no caerte, y por eso un acróbata usa una vara larga para equilibrarse en la cuerda floja. Y por eso cuando llevas una mochila pesada en la espalda te inclinas hacia adelante.</p>
<p>Con ladrillos apilados puedes mostrar algo asombroso: si los desplazas con cuidado, ¡puedes hacer que la torre se asome mucho más allá de la mesa! El ladrillo de arriba puede asomar la mitad de su largo, el siguiente un cuarto, el siguiente un sexto…</p>
<div class="sim" data-sim="torre-asoma" data-title="La torre que se asoma" data-goal="Apila ladrillos de modo que el de arriba se asome al menos un ladrillo completo más allá de la mesa, sin que se caiga.">
<ul><li>Cada ladrillo solo puede asomarse mientras el centro de gravedad de todo lo que hay encima siga sobre el ladrillo de abajo.</li><li>Pista: ¡los ladrillos de arriba asoman más y los de abajo menos!</li></ul>
</div>
</section>

<section>
<h2>El corazón: una bomba</h2>
<p>Tu corazón es una bomba muscular del tamaño de tu puño. Late unas 70 veces por minuto, y con cada latido empuja unos 70 mL de sangre. ¡Eso es unos 5 litros por minuto, 7200 litros al día, y más de 100 000 latidos diarios! La sangre viaja por tubos (las arterias y venas) con una presión que mides cuando te toman la tensión: unos 120 (la máxima) sobre 80 (la mínima) milímetros de mercurio.</p>
<p>Tus nervios son «cables» que llevan señales eléctricas, y tu cerebro funciona con unos 20 vatios, ¡menos que una bombilla pequeña!</p>
</section>

<section>
<h2>Superpoderes de los animales</h2>
<p>Muchos animales detectan cosas que nosotros no podemos: ondas de sonido muy agudas o muy graves, calor, luz ultravioleta, campos magnéticos o eléctricos. ¡Todo eso es física que ya conoces!</p>
<div class="sim" data-sim="supersentidos" data-title="Los superpoderes de los animales" data-goal="Une cada animal con el superpoder físico que usa."></div>
</section>

<section>
<h2>¡A experimentar!</h2>

<div class="learn"><ul>
<li>La Tierra tiene capas: corteza, manto, núcleo externo (líquido) y núcleo interno (sólido).</li>
<li>Las placas de la corteza se mueven y producen terremotos y volcanes.</li>
<li>Las ondas de los terremotos nos permiten «ver» el interior de la Tierra y localizar el epicentro.</li>
<li>Los vientos como las brisas nacen de diferencias de temperatura.</li>
</ul></div>

<div class="say" data-who="terra" data-mood="wow"><p>¡Hola! Soy Terra. A veces me muevo un poquito y ustedes lo sienten como un temblor. No es que me enoje: ¡es que por dentro estoy llena de energía y calor!</p></div>

<section>
<h2>El interior de la Tierra</h2>
<p>La Tierra es como un huevo gigante, con varias capas. Nadie ha podido perforar más allá de unos 12 kilómetros (¡la Tierra tiene un radio de 6371 km!). Sabemos qué hay abajo gracias a las ondas de los terremotos.</p>
<ul>
<li><b>Corteza</b> (de 5 a 70 km): la capa delgada y sólida donde vivimos, como la cáscara de una manzana.</li>
<li><b>Manto</b> (hasta unos 2900 km): roca muy caliente que fluye lentísimo, unos centímetros por año.</li>
<li><b>Núcleo externo</b> (hasta unos 5150 km): hierro líquido que se mueve y crea el campo magnético.</li>
<li><b>Núcleo interno</b> (radio de unos 1220 km): una bola sólida de hierro y níquel a unos 5400 °C, ¡tan caliente como la superficie del Sol!, pero sólida por la enorme presión.</li>
</ul>
<div class="sim" data-sim="capas-tierra" data-title="Viaje al centro de la Tierra" data-goal="Baja por el interior de la Tierra y visita las cuatro capas.">
<ul><li>Mira cómo aumentan la temperatura y la presión con la profundidad.</li><li>En el centro, la presión es unos 3,6 millones de veces la del aire.</li></ul>
</div>
</section>

<section>
<h2>Placas, terremotos y volcanes</h2>
<p>La corteza no es una cáscara entera: está partida en grandes pedazos llamados <strong>placas tectónicas</strong>, que flotan sobre el manto y se mueven unos pocos centímetros por año (¡lo que crecen tus uñas!). Cuando se rozan, se empujan o se separan, se acumula energía en las rocas hasta que de repente se rompen y se desliza: eso es un <strong>terremoto</strong>. Algunos de esos bordes dejan salir roca derretida (magma): son los <b>volcanes</b>.</p>
<div class="fact"><p>Colombia está en una zona donde se encuentran las placas de Nazca, Suramericana y del Caribe, por eso tenemos terremotos y volcanes como el Nevado del Ruiz, el Galeras y el Puracé (cerca de Popayán). El terremoto de Popayán del 31 de marzo de 1983 ocurrió un Jueves Santo y causó mucha destrucción. Por eso es importante construir casas resistentes y estar preparados.</p></div>
<h3>Cómo se localiza un terremoto</h3>
<p>Un terremoto produce dos tipos de ondas: las <b>ondas P</b> (que van más rápido, unos 6 km/s) y las <b>ondas S</b> (más lentas, unos 3,5 km/s). Las P llegan primero y después las S. Entre más lejos esté el terremoto, más tiempo pasa entre la llegada de las dos. Con esa diferencia de tiempo en tres estaciones sismológicas, se puede encontrar el <b>epicentro</b>, el punto de la superficie justo encima del lugar donde se originó.</p>
<div class="magic" data-name="Distancia al terremoto"><big>distancia ≈ 8,4 × (tiempo S − tiempo P)</big>Con el tiempo en segundos, la distancia sale en kilómetros</div>
<div class="sim" data-sim="epicentro" data-title="¡Encuentra el epicentro!" data-goal="Con la diferencia de tiempo S–P de tres estaciones, dibuja los círculos y encuentra donde está el epicentro.">
<ul><li>Cada estación te dice cuántos segundos pasaron entre las ondas P y S.</li><li>Calcula la distancia y dibuja el círculo; el epicentro está donde se cruzan los tres.</li></ul>
</div>
<details class="curious"><p>La diferencia de tiempos entre P y S es Δt = d·(1/v<sub>S</sub> − 1/v<sub>P</sub>) = d·(1/3,5 − 1/6) = d/8,4. Por eso d = 8,4·Δt. La magnitud de un terremoto se mide con una escala logarítmica: cada punto más es unas 32 veces más energía. Las ondas S no atraviesan líquidos: gracias a eso se descubrió que el núcleo externo de la Tierra es líquido.</p></details>
</section>

<section>
<h2>El clima y las brisas</h2>
<p>Sobre la superficie hay un océano de aire que se mueve por diferencias de temperatura: el aire caliente sube y el frío baja, como en la convección que viste en el mundo del calor. En la costa, de día, la tierra se calienta más rápido que el mar (el agua cambia de temperatura más despacio), el aire caliente sube sobre la tierra y el aire fresco del mar llega a reemplazarlo: es la <strong>brisa marina</strong>. De noche pasa al revés: la tierra se enfría antes y el viento sopla de la tierra al mar.</p>
<div class="sim" data-sim="brisa-marina" data-title="La brisa de la costa" data-goal="Mira cómo cambia el viento durante el día y la noche, y encuentra la hora en que cambia de dirección.">
<ul><li>De día, el viento va del mar a la tierra; de noche, al revés.</li><li>El agua tarda mucho más en calentarse y enfriarse que la tierra.</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Edificio que resiste un terremoto" data-time="40 min" data-level="2">
<ul class="mat"><li>🍝 Espaguetis crudos</li><li>🍡 Malvaviscos o plastilina</li><li>🥣 Una bandeja con gelatina firme (o un plato con arroz)</li><li>⏱️ Reloj</li></ul>
<ol class="steps"><li>Construye una torre pegando espaguetis con malvaviscos o bolitas de plastilina. Intenta hacerla lo más alta posible.</li><li>Ponla sobre la bandeja con gelatina (que hará de suelo blando).</li><li>Sacude la bandeja suavemente de lado a lado, como un terremoto. ¿Se mantiene en pie?</li><li>Mejórala poniendo triángulos (diagonales) en las paredes y una base más ancha. Prueba otra vez.</li></ol>
<p class="predict">¿Qué diseño resistirá mejor: uno alto y estrecho o uno bajo y ancho con triángulos?</p>
<p class="result">Las torres más bajas, con base ancha y diagonales formando triángulos, resisten mucho mejor. Las altas y sin diagonales se tuercen y caen.</p>
<p class="why">Los triángulos son formas rígidas: no se deforman fácil. Los ingenieros de edificios resistentes usan diagonales y bases anchas y flexibles. Por eso en lugares con muchos temblores, las construcciones siguen normas especiales.</p>
</div>
<div class="exp" data-title="La brisa marina en una bandeja" data-time="30 min" data-level="2">
<ul class="mat"><li>🥧 Una bandeja o fuente honda</li><li>🏖️ Arena o tierra seca</li><li>💧 Agua</li><li>🌡️ Dos termómetros (opcional)</li><li>💡 Una lámpara fuerte o el Sol</li></ul>
<ol class="steps"><li>Pon arena en un lado de la bandeja y agua en el otro.</li><li>Alumbra con la lámpara o deja al Sol durante unos 15 minutos.</li><li>Mide la temperatura de la arena y la del agua (o toca con cuidado).</li></ol>
<p class="predict">¿Cuál se calentará más rápido: la arena o el agua?</p>
<p class="result">La arena se calienta mucho más rápido y llega a una temperatura mayor que el agua. Al apagar la lámpara, la arena también se enfría más rápido.</p>
<p class="why">El agua necesita mucha más energía para cambiar de temperatura (tiene mayor «calor específico»). Por eso el mar es más fresco de día y más tibio de noche que la tierra, y por eso hay brisas en la costa.</p>
</div>
</section>

<template class="chapter-src" data-id="materiales" data-num="45" data-world="10" data-title="Materiales, cristales y chips" data-short="Por qué el vidrio se rompe y la goma no, cómo funcionan los chips y por qué algunos materiales levitan.">
<p class="lead">El acero de un puente, el vidrio de una ventana, la goma de un balón, el silicio de un celular… ¡cada material se comporta distinto! La física de los materiales explica por qué y permite inventar materiales nuevos: más fuertes, más ligeros, más inteligentes.</p>

<div class="learn"><ul>
<li>Los materiales pueden ser elásticos (vuelven a su forma), plásticos (quedan deformados) o frágiles (se rompen).</li>
<li>Muchos sólidos forman cristales: átomos ordenados en patrones que se repiten.</li>
<li>Los chips de los celulares se hacen con semiconductores como el silicio.</li>
<li>Los superconductores, muy fríos, conducen sin resistencia y hacen levitar imanes.</li>
</ul></div>

<div class="say" data-who="terra" data-mood="happy"><p>Yo estoy hecha de montones de materiales: rocas, metales, arena, agua… ¡y todos tienen su propio carácter! Hoy vamos a ver cómo se portan cuando los estiras, cuando los usas para pensar y cuando los enfrías muchísimo.</p></div>

<section>
<h2>Estirar y romper</h2>
<p>Si estiras una liga, se alarga y, cuando la sueltas, vuelve a su tamaño: es <strong>elástica</strong>. Si estiras plastilina, se alarga y se queda estirada: es <strong>plástica</strong>. Y si doblas un vidrio, ¡se rompe! es <strong>frágil</strong>. Los metales como el acero son elásticos con una fuerza pequeña, y luego se deforman de forma permanente (por eso se puede doblar un clip). Cada material tiene un «límite elástico» y un punto de ruptura.</p>
<div class="sim" data-sim="estirar-materiales" data-title="¿Cómo se estira cada material?" data-goal="Estira cada material y mira si vuelve a su forma, queda deformado o se rompe. ¡Descubre un material de cada tipo!">
<ul><li>La goma vuelve a su forma casi siempre.</li><li>La plastilina se queda estirada.</li><li>El vidrio casi no se estira… ¡y se rompe!</li></ul>
</div>
<div class="fact"><p>El acero de la Torre Eiffel, el aluminio de los aviones y la fibra de carbono de las bicicletas de carreras son materiales «inventados» para ser muy fuertes y livianos. La telaraña es, por su peso, más resistente que el acero. Y el grafeno (una lámina de carbono de un solo átomo de grosor, descubierta en 2004) es unas 200 veces más fuerte que el acero.</p></div>
</section>

<section>
<h2>Cristales: átomos en fila</h2>
<p>En muchos sólidos, los átomos se acomodan en filas y capas ordenadas que se repiten: un <strong>cristal</strong>. La sal, el azúcar, el cuarzo, el hielo, los diamantes y los metales son cristales. La forma del cristal depende de cómo se ordenan los átomos. Por ejemplo, los copos de nieve son cristales de hielo y siempre tienen seis puntas, ¡porque las moléculas de agua se acomodan en hexágonos! El vidrio, en cambio, tiene los átomos desordenados (es «amorfo»).</p>
<div class="fact"><p>El diamante y el grafito (la mina del lápiz) están hechos solo de carbono. La diferencia es cómo se ordenan los átomos: en el diamante forman una estructura rígida en todas direcciones y es el material natural más duro; en el grafito forman capas que se deslizan, por eso escribe y es blando.</p></div>
</section>

<section>
<h2>Semiconductores y chips</h2>
<p>Los metales conducen muy bien la electricidad, y los aislantes casi nada. Entre los dos están los <strong>semiconductores</strong>, como el silicio: conducen un poquito, y lo mejor es que se puede controlar cuánto. Si les añades unos pocos átomos de otro elemento (se llama «dopar»), cambia su comportamiento. Con eso se fabrican los <b>transistores</b>, que funcionan como interruptores diminutos controlados por electricidad. Se inventaron en 1947 y cambiaron el mundo.</p>
<p>Un chip de celular tiene decenas de miles de millones de transistores, cada uno más pequeño que un virus. Con ellos se forman <b>puertas lógicas</b>, que toman decisiones simples: la puerta Y (AND) enciende la salida solo si las dos entradas están encendidas; la O (OR) si alguna lo está. Combinando millones de puertas, un computador hace cuentas, dibuja imágenes y ¡juega contigo!</p>
<div class="sim" data-sim="puertas-logicas" data-title="Descubre la puerta lógica" data-goal="Prueba las combinaciones de A y B, mira cuándo se enciende el LED y adivina qué puerta hay dentro de la caja. ¡Acierta 4!">
<ul><li>Prueba las cuatro combinaciones: apagado-apagado, apagado-encendido, encendido-apagado y encendido-encendido.</li><li>Fíjate en la tabla de verdad: ¡te muestra lo que ya probaste!</li></ul>
</div>
<details class="curious"><p>Los chips se fabrican «dibujando» con luz ultravioleta extrema sobre discos de silicio ultrapuro, con detalles de pocos nanómetros (como unos 50 átomos de ancho). Los LED (diodos emisores de luz) también son semiconductores: cuando los electrones pasan por una unión especial sueltan fotones. Inventar el LED azul fue tan difícil que sus inventores ganaron el Premio Nobel de 2014.</p></details>
</section>

<section>
<h2>Superconductores: electricidad sin resistencia</h2>
<p>En 1911, el holandés Heike Kamerlingh Onnes enfrió mercurio a −269 °C y descubrió que perdía toda su resistencia eléctrica: la corriente podía circular por siempre sin gastarse. Se llama <strong>superconductividad</strong>. Además, un superconductor empuja los campos magnéticos hacia afuera, y por eso un imán puede <em>levitar</em> sobre uno. Los superconductores más modernos funcionan a −180 °C, y se enfrían con nitrógeno líquido (−196 °C). Se usan en los equipos de resonancia magnética, en trenes de levitación magnética (maglev) y en los imanes del LHC.</p>
<div class="sim" data-sim="superconductor" data-title="El imán que levita" data-goal="Enfría el superconductor por debajo de su temperatura crítica y mira cómo el imán se eleva.">
<ul><li>Por encima de −181 °C el imán no flota.</li><li>Por debajo, ¡levita! Se llama efecto Meissner.</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Cristales de azúcar: caramelo de roca" data-time="1 semana (con 15 min de trabajo)" data-level="2" data-adult="1">
<ul class="mat"><li>🍬 Azúcar (unas 3 tazas)</li><li>💧 1 taza de agua</li><li>🫙 Un frasco de vidrio limpio</li><li>🥢 Un palito de brocheta y un clip de ropa</li><li>♨️ Una olla y un adulto</li></ul>
<ol class="steps"><li>Un adulto calienta el agua y disuelve el azúcar poco a poco hasta que ya no se disuelva más (agua saturada). Deja enfriar unos minutos.</li><li>Moja el palito en agua, pásalo por azúcar seca (ayudará a empezar), y déjalo secar.</li><li>Vierte el almíbar tibio en el frasco y cuelga el palito con el clip, sin tocar el fondo. Pon el frasco en un lugar tranquilo.</li><li>Cada día mira cómo crecen los cristales sobre el palito.</li></ol>
<p class="predict">¿Qué forma tendrán los cristales de azúcar?</p>
<p class="result">En unos días se forman cristales grandes y transparentes de forma geométrica, con caras planas y ángulos regulares.</p>
<p class="why">A medida que el agua se evapora, el azúcar ya no cabe disuelto y se une a los cristales que ya hay, colocándose en filas ordenadas. Esa forma geométrica refleja el orden de las moléculas por dentro.</p>
</div>
<div class="exp" data-title="¿Cuánto se estira una liga?" data-time="20 min" data-level="1">
<ul class="mat"><li>➰ Una liga ancha</li><li>🥫 Pesos iguales (monedas, tornillos o latas pequeñas)</li><li>🛍️ Una bolsita para colgar los pesos</li><li>📏 Una regla</li></ul>
<ol class="steps"><li>Cuelga la liga de un borde y mide su largo.</li><li>Añade pesos de a uno en una bolsita y mide cuánto se estira cada vez.</li><li>Dibuja una gráfica con el peso y el alargamiento.</li><li>Quita los pesos y mira si vuelve a su largo original.</li></ol>
<p class="predict">Si duplicas el peso, ¿se duplicará el alargamiento?</p>
<p class="result">Al principio sí: la gráfica es casi una línea recta. Con muchos pesos, ya no crece de manera pareja. Al quitar los pesos, la liga vuelve a su largo (si no te pasaste).</p>
<p class="why">Mientras estás en el rango elástico, el alargamiento es proporcional a la fuerza (ley de Hooke). Si te pasas del límite elástico, el material se deforma de forma permanente.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="0"><p>Un material que vuelve a su forma original después de estirarlo es…</p><ol><li>Elástico</li><li>Frágil</li><li>Plástico</li></ol><p class="why">Los materiales elásticos recuperan su forma.</p></div>
<div class="q" data-ans="2"><p>¿Con qué material se fabrican principalmente los chips de los celulares?</p><ol><li>Madera</li><li>Cobre puro</li><li>Silicio</li></ol><p class="why">El silicio es un semiconductor: se puede controlar cuánta electricidad conduce.</p></div>

<!-- 46-azar.html -->
<template class="chapter-src" data-id="azar" data-num="46" data-world="10" data-title="El azar y el caos" data-short="Monedas, dados, campanas, el efecto mariposa y por qué algunas cosas son imposibles de predecir.">
<p class="lead">¿Puede la física predecir el resultado de lanzar una moneda? ¿Y el clima de dentro de un mes? Algunas cosas ocurren por <strong>azar</strong>, y otras son tan sensibles a pequeños cambios que son prácticamente imposibles de predecir: eso es el <strong>caos</strong>. Pero incluso del azar sale un orden asombroso.</p>

<div class="learn"><ul>
<li>Un solo evento aleatorio es impredecible, pero muchos juntos siguen un patrón.</li>
<li>La ley de los grandes números: con muchas repeticiones, las frecuencias se acercan a las probabilidades.</li>
<li>La curva en forma de campana aparece cuando se suman muchos pequeños azares.</li>
<li>En el caos, cambios minúsculos al principio llevan a resultados totalmente distintos.</li>
</ul></div>

<div class="say" data-who="terra" data-mood="think"><p>Cuando lanzas una moneda no sabes qué saldrá… pero si la lanzas diez mil veces, ¡sabes casi seguro que unas cinco mil serán cara! Hay un orden escondido en el desorden. ¡Vamos a verlo!</p></div>

<section>
<h2>Las monedas y la ley de los grandes números</h2>
<p>Una moneda honesta tiene la misma probabilidad de salir cara o sello: 1/2. Pero eso no significa que si lanzas 10 veces saldrán exactamente 5 caras. Con pocas tiradas, los resultados se alejan mucho de la mitad (a veces 8 caras, o incluso 10). Con muchísimas tiradas, la proporción se va acercando a 1/2. Esta idea se llama la <dfn data-def="Cuando repites algo al azar muchísimas veces, la proporción de resultados se acerca a su probabilidad.">ley de los grandes números</dfn>.</p>
<div class="fact"><p>La moneda <b>no tiene memoria</b>: si ya salieron 5 caras seguidas, la siguiente tiene otra vez 50 % de salir cara. Creer que «ya le toca sello» es un error muy común, llamado la falacia del jugador.</p></div>
<div class="sim" data-sim="monedas" data-title="Lanza monedas" data-goal="Lanza muchas monedas y mira cómo la proporción de caras se acerca al 50 %. ¡Llega a más de 2000 lanzamientos!">
<ul><li>Con 10 lanzamientos la proporción oscila mucho.</li><li>Con 1000 o más, se acerca a la mitad.</li></ul>
</div>
</section>

<section>
<h2>La campana: el tablero de Galton</h2>
<p>Imagina bolitas que caen por un tablero con clavos: en cada clavo, la bolita va a la izquierda o a la derecha con la misma probabilidad. Es imposible saber por dónde pasará una bolita en particular, pero cuando caen cientos, se forma una pila en forma de <b>campana</b>: muchas en el centro y pocas en los extremos. Es la <dfn data-def="Una curva en forma de campana que aparece cuando se suman muchos pequeños efectos al azar.">distribución normal</dfn>, y aparece por todas partes: en las estaturas de las personas, en los errores de las medidas, en las notas de un examen.</p>
<div class="sim" data-sim="galton" data-title="El tablero de Galton" data-goal="Suelta al menos 200 bolitas con probabilidad del 50 % y mira cómo se forma la campana.">
<ul><li>Con probabilidad 50 %, la campana queda centrada.</li><li>Si cambias la probabilidad hacia un lado, la campana se desplaza.</li></ul>
</div>
<details class="curious"><p>El tablero de Galton se debe al inglés Francis Galton (siglo XIX). La forma de campana la describió matemáticamente Carl Friedrich Gauss. El resultado general se llama «teorema del límite central»: al sumar muchas variables aleatorias independientes, el resultado tiende a una distribución normal. También explica por qué la presión de un gas es tan estable: ¡es la suma de los choques de billones de moléculas!</p></details>
<div class="story" data-title="El baile de las partículas"><p>En 1827, el botánico Robert Brown vio que los granitos de polen en el agua se movían sin parar de forma errática. Pensó que estaban vivos, pero también se movían partículas de roca. En 1905, Einstein explicó que las moléculas de agua, invisibles, empujan a los granitos desde todos lados al azar. Con eso se probó que los átomos existen. Es el <b>movimiento browniano</b>: una caminata al azar.</p></div>
</section>

<section>
<h2>El caos: el efecto mariposa</h2>
<p>Un péndulo simple es muy predecible. Pero si cuelgas un péndulo de otro péndulo (un <b>péndulo doble</b>), su movimiento se vuelve ¡una locura! Aunque todo se rige por leyes exactas, <b>una diferencia diminuta al empezar</b> se agranda rapidísimo, y al cabo de unos segundos los dos péndulos casi idénticos hacen cosas totalmente distintas. A eso se le llama <dfn data-def="Cuando un pequeño cambio inicial produce enormes diferencias después, haciendo imposible la predicción a largo plazo.">caos</dfn>.</p>
<div class="story" data-title="La mariposa de Lorenz"><p>En 1961, el meteorólogo Edward Lorenz repitió una simulación del clima con un número redondeado (0,506 en vez de 0,506127). ¡Y el resultado fue totalmente distinto! Descubrió que el clima es caótico: un pequeño cambio puede crecer mucho. Se hizo famosa la imagen: el aleteo de una mariposa en Brasil podría cambiar un tornado en Texas. Por eso el pronóstico del tiempo es bueno para unos días, pero imposible para meses.</p></div>
<div class="sim" data-sim="pendulo-doble" data-title="El péndulo doble y la mariposa" data-goal="Suelta dos péndulos dobles casi idénticos (con 0,06° de diferencia) desde un ángulo grande y mira cómo se separan. Luego prueba con un ángulo pequeño.">
<ul><li>Con ángulos pequeños, los dos péndulos siguen juntos.</li><li>Con ángulos grandes, se separan por completo: ¡caos!</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="50 lanzamientos de moneda" data-time="15 min" data-level="1">
<ul class="mat"><li>🪙 Una moneda</li><li>📝 Papel y lápiz</li></ul>
<ol class="steps"><li>Lanza la moneda 10 veces y anota cuántas caras salen. Repite 5 veces.</li><li>Ahora lanza 50 veces y cuenta las caras.</li><li>Compara: ¿qué tanto se alejan de la mitad los resultados de 10 lanzamientos, comparado con los de 50?</li></ol>
<p class="predict">¿Con cuál serie estará la proporción de caras más cerca de la mitad?</p>
<p class="result">Con 10 lanzamientos salen resultados como 3, 7, 4 y hasta 8 caras. Con 50 lanzamientos, casi siempre salen entre 20 y 30 caras: más cerca de la mitad.</p>
<p class="why">Con pocas tiradas, el azar domina. Con muchas, las desviaciones se compensan y aparece el promedio: eso es la ley de los grandes números.</p>
</div>
<div class="exp" data-title="La caminata del borracho" data-time="20 min" data-level="1">
<ul class="mat"><li>🎲 Un dado (o una moneda)</li><li>🧱 Un piso con baldosas (o una hoja cuadriculada)</li><li>🖍️ Tiza o lápiz</li></ul>
<ol class="steps"><li>Párate en una baldosa (o dibuja un punto en el centro de la hoja).</li><li>Lanza el dado: 1–2 = un paso adelante, 3–4 = atrás, 5 = derecha, 6 = izquierda.</li><li>Haz 30 pasos, marcando cada baldosa o dibujando el camino.</li><li>Mide qué tan lejos terminaste del punto de partida. Repite 3 veces.</li></ol>
<p class="predict">Después de 30 pasos, ¿cuánto crees que te alejarás del inicio?</p>
<p class="result">Casi nunca te alejas 30 pasos: normalmente terminas a unos 5 o 6 pasos del inicio. Y los tres caminos terminan en lugares distintos.</p>
<p class="why">Los pasos hacia un lado y hacia otro se compensan en gran parte: la distancia típica crece como la raíz cuadrada del número de pasos (√30 ≈ 5,5). Así se mueven las moléculas en el movimiento browniano.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>Una moneda salió cara 5 veces seguidas. ¿Qué probabilidad hay de cara en el siguiente lanzamiento?</p><ol><li>Menos del 50 %</li><li>50 %</li><li>Más del 50 %</li></ol><p class="why">La moneda no tiene memoria: cada lanzamiento es independiente.</p></div>
<div class="q" data-ans="0"><p>Lanzas una moneda muchísimas veces. ¿Qué proporción de caras esperas?</p><ol><li>Cerca de la mitad</li><li>Siempre exactamente la mitad</li><li>Muy lejos de la mitad</li></ol><p class="why">Con muchos lanzamientos, la proporción se acerca a 1/2, pero casi nunca es exactamente 1/2.</p></div>
<div class="q" data-ans="2"><p>¿Qué forma aparece en el tablero de Galton?</p><ol><li>Un cuadrado</li><li>Una línea recta</li><li>Una campana</li></ol><p class="why">La distribución normal: muchas bolitas al centro y pocas en los extremos.</p></div>
<div class="q" data-ans="1"><p>En un sistema caótico, un cambio minúsculo en el inicio…</p><ol><li>No cambia nada</li><li>Puede cambiar muchísimo el resultado</li><li>Mejora la predicción</li></ol><p class="why">Es el efecto mariposa: las pequeñas diferencias se amplifican.</p></div>
</div>
</template>

<!-- 90-familias.html -->
<template class="chapter-src" data-id="familias" data-num="0" data-kind="page" data-world="0" data-title="Para familias y maestros" data-short="Cómo acompañar a niñas y niños en este curso: edades, seguridad, materiales y ritmo.">
<p class="lead">Física KIDS es un curso interactivo para niñas y niños de unos 6 a 12 años que recorre <strong>todas las ramas de la física</strong>, desde los primeros curiosos hasta las partículas y las galaxias. Está pensado para que lo exploren con curiosidad, jugando y experimentando, con ayuda de una persona adulta cuando haga falta.</p>

<section>
<h2>Cómo está organizado</h2>
<ul>
<li><b>10 mundos y 47 capítulos.</b> Cada mundo tiene un personaje guía y una rama de la física: orígenes, mecánica, fluidos, calor, ondas y sonido, luz y color, electricidad y magnetismo, astronomía, átomos y partículas, y Tierra y vida.</li>
<li><b>Cada capítulo</b> tiene: una historia corta, explicaciones sencillas, <b>juegos y simulaciones</b> con retos, un <b>experimento para hacer en casa</b>, <b>preguntas</b> con explicación y, para quien quiera ir más allá, un recuadro <b>«Para mentes curiosas»</b>.</li>
<li><b>Estrellas y pasaporte.</b> Cada reto superado, pregunta acertada y experimento realizado suma una estrella. El progreso se guarda en el navegador del dispositivo (no se envía a ningún servidor). Al final hay un diploma imprimible.</li>
<li><b>Leer en voz alta.</b> El botón 🔊 de cada sección lee el texto con la voz del dispositivo. Ayuda a quienes aún están aprendiendo a leer.</li>
<li><b>Cajón de experimentos y diccionario.</b> Reúnen en un solo lugar todos los experimentos y las palabras explicadas.</li>
</ul>
</section>

<section>
<h2>Edades y ritmo sugerido</h2>
<div class="cols2">
<div class="card"><h4>6 a 8 años</h4><p>Con un adulto: leer juntos, jugar las simulaciones, hacer los experimentos y responder las preguntas en voz alta. Los recuadros «Para mentes curiosas» pueden saltarse.</p></div>
<div class="card"><h4>9 a 12 años</h4><p>Pueden avanzar solos y pedir ayuda para los experimentos con adulto. Los «Para mentes curiosas» incluyen fórmulas y datos más avanzados.</p></div>
</div>
<p>Un ritmo cómodo es <b>un capítulo por semana</b> (unas 40 a 50 semanas), o un mundo cada mes. Pueden seguir el orden o saltar al mundo que más les guste: cada capítulo se entiende por sí solo, aunque hay conexiones entre ellos (se indican en el texto). Las <b>sesiones cortas</b> de 20 a 30 minutos funcionan mejor que las largas.</p>
</section>

<section>
<h2>Seguridad en los experimentos</h2>
<p>Los experimentos usan materiales de casa. Los que necesitan ayuda están marcados con <b>👩‍👧 Con un adulto</b>. Reglas generales:</p>
<ol>
<li>Un adulto presente en todo experimento con fuego, agua caliente, objetos cortantes, hielo seco, alcohol o presión.</li>
<li><b>Nunca</b> experimentar con la corriente de la pared, ni meter objetos en enchufes. En electricidad se usan solo pilas pequeñas.</li>
<li>No mirar nunca directamente al Sol, a un láser ni a una linterna potente. Usar gafas de protección cuando se indique.</li>
<li>No probar ni oler sustancias. Lavarse las manos al terminar.</li>
<li>Trabajar sobre una superficie despejada y limpiar al terminar.</li>
<li>En los cohetes de botella, las pruebas de presión y los experimentos con microondas, seguir las indicaciones con un adulto y en lugares abiertos o adecuados.</li>
</ol>
</section>

<section>
<h2>El cajón de la ciencia: materiales que conviene tener</h2>
<p>Con una cajita de materiales sencillos se pueden hacer casi todos los experimentos: papel, cartón y cartulina; cinta pegante y tijeras; hilo y pita; globos; pajillas; vasos y botellas plásticas; monedas; clips; ligas; una regla o cinta métrica; un cronómetro (el del celular sirve); una linterna; pilas AA con soporte y cables con pinzas; un imán; una brújula; lupa; sal, azúcar, bicarbonato y colorante de comida; arroz y espaguetis; aluminio y lana. Cada experimento lista lo que necesita.</p>
</section>

<section>
<h2>Cómo acompañar la curiosidad</h2>
<ul>
<li><b>Preguntar antes de explicar.</b> Cada experimento tiene un espacio de «piensa antes»: dejen que el niño o la niña haga su predicción, aunque sea equivocada. Equivocarse es parte del método científico.</li>
<li><b>Hablar de lo que vieron.</b> «¿Qué pasó? ¿Por qué creen? ¿Qué cambiarían?» Más importante que acertar es observar y razonar.</li>
<li><b>Conectar con la vida diaria.</b> El columpio, el atardecer, la olla hirviendo y el eco de la montaña son ejemplos de física.</li>
<li><b>Usar el cuaderno de científico.</b> Anotar y dibujar cada experimento fortalece la observación y la escritura.</li>
<li><b>Aceptar los «no sé».</b> Muchas preguntas (como qué es la materia oscura) no tienen todavía respuesta. ¡Eso también es ciencia!</li>
</ul>
</section>

<section>
<h2>Sobre la exactitud</h2>
<p>El curso busca ser <b>correcto y a la vez sencillo</b>. Las simulaciones son modelos simplificados (por ejemplo, sin fricción del aire en algunos casos, o con ángulos exagerados para que se vean) y así se indica en el texto cuando es importante. Los números que usan (gravedades, velocidades, temperaturas, constantes) son valores de referencia, y las funciones de cálculo se comprueban con más de 260 pruebas automáticas contra soluciones exactas y valores conocidos. Si encuentran un error, ¡avisen! La ciencia mejora corrigiéndose.</p>
</section>

<section>
<h2>Cómo usarlo</h2>
<ul>
<li>Funciona en computador, tableta y celular con un navegador moderno (Chrome, Edge, Firefox, Safari). Las simulaciones funcionan sin conexión; las tipografías y algunos recursos usan internet si está disponible.</li>
<li>El botón 🔊 de la barra superior activa o silencia los sonidos; el botón de día/noche cambia el modo de color.</li>
<li>El progreso queda en el navegador y dispositivo en el que se juega; al borrar los datos del navegador, se pierde. En el pasaporte se puede borrar el progreso para que otra persona empiece desde cero.</li>
</ul>
</section>

/* ===================================================================
   00-base.js — espacio de nombres FK, utilidades, sonido, voz, confeti
   =================================================================== */
(function () {
  'use strict';
  const FK = (window.FK = window.FK || {});
  FK.sims = {};
  FK.sim = function (name, factory) { FK.sims[name] = factory; };

  /* ---------- Matemática pequeña ---------- */
  const M = (FK.M = {
    TAU: Math.PI * 2,
    clamp: (x, a, b) => Math.min(b, Math.max(a, x)),
    lerp: (a, b, t) => a + (b - a) * t,
    rad: (d) => (d * Math.PI) / 180,
    deg: (r) => (r * 180) / Math.PI,
    sq: (x) => x * x,
    sign: (x) => (x > 0 ? 1 : x < 0 ? -1 : 0),
    rnd: (a = 0, b = 1) => a + Math.random() * (b - a),
    rndInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
    shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
    smooth: (t) => t * t * (3 - 2 * t),
    gauss() { let u = 0, v = 0; while (u === 0) u = Math.random(); while (v === 0) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); },
    map: (x, a, b, c, d) => c + ((x - a) * (d - c)) / (b - a)
  });

  /* ---------- Formato (coma decimal, espacio para miles) ---------- */
  FK.n = function (x, d = 1) {
    if (x === null || x === undefined || Number.isNaN(x)) return '—';
    if (!isFinite(x)) return x > 0 ? '∞' : '−∞';
    let s = Math.abs(x).toFixed(d);
    let [i, f] = s.split('.');
    i = i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    const neg = x < 0 && /[1-9]/.test(s);
    return (neg ? '−' : '') + i + (f ? ',' + f : '');
  };
  FK.int = (x) => FK.n(Math.round(x), 0);
  const SUPS = { '-': '⁻', '.': '·', ',': ',', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
  FK.sup = (n) => String(n).split('').map((c) => SUPS[c] || c).join('');
  const UNSUP = { '⁻': '−', '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9', '·': ',' };
  /* Convierte exponentes en unicode (10⁻¹⁰) a <sup> para que se vean bien con cualquier fuente */
  FK.supHtml = (s) => String(s).replace(/[⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, (m) => '<sup>' + m.split('').map((c) => UNSUP[c] || c).join('') + '</sup>');
  FK.pow10 = (e) => '10' + FK.sup(Math.round(e * 10) / 10 === Math.round(e) ? Math.round(e) : (Math.round(e * 10) / 10).toString().replace('.', ','));
  /* Número «bonito»: pocas cifras, sin ceros de sobra */
  FK.nice = function (x, sig = 3) {
    if (!isFinite(x)) return FK.n(x);
    if (x === 0) return '0';
    const a = Math.abs(x);
    if (a >= 1e7 || a < 1e-3) {
      const e = Math.floor(Math.log10(a));
      const m = (x / Math.pow(10, e)).toFixed(sig - 1).replace(/\.?0+$/, '').replace('.', ',');
      const sup = String(e).split('').map((c) => ({ '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' }[c])).join('');
      return m + ' × 10' + sup;
    }
    const dec = Math.max(0, sig - 1 - Math.floor(Math.log10(a)));
    return FK.n(x, Math.min(dec, 6)).replace(/,?0+$/, (m) => (m.includes(',') ? '' : m));
  };

  /* ---------- DOM ---------- */
  FK.el = function (tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined && html !== null) e.innerHTML = html;
    return e;
  };
  FK.$ = (s, r) => (r || document).querySelector(s);
  FK.$$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  FK.reduced = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* ---------- Almacenamiento (progreso) ---------- */
  const mem = {};
  FK.store = {
    get(k, d) { try { const v = localStorage.getItem('fisicakids:' + k); return v === null ? (k in mem ? mem[k] : d) : JSON.parse(v); } catch (e) { return k in mem ? mem[k] : d; } },
    set(k, v) { mem[k] = v; try { localStorage.setItem('fisicakids:' + k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } },
    del(k) { delete mem[k]; try { localStorage.removeItem('fisicakids:' + k); } catch (e) { /* */ } },
    keys() { const out = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('fisicakids:')) out.push(k.slice(11)); } } catch (e) { /* */ } return out.concat(Object.keys(mem).filter((k) => !out.includes(k))); }
  };

  /* ---------- Sonido (WebAudio) ---------- */
  let ac = null;
  FK.soundOn = () => FK.store.get('sound', true) !== false;
  FK.audioCtx = function () {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  };
  FK.tone = function (freq, dur = 0.2, o = {}) {
    if (!FK.soundOn()) return;
    const a = FK.audioCtx(); if (!a) return;
    const t = a.currentTime + (o.delay || 0);
    const osc = a.createOscillator(), g = a.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol || 0.15, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(a.destination);
    osc.start(t); osc.stop(t + dur + 0.05);
  };
  /* Tono sostenido (para simulaciones de sonido): devuelve { set(freq, vol), stop() } */
  FK.hum = function (freq = 440, vol = 0.1, type = 'sine') {
    if (!FK.soundOn()) return { set() {}, stop() {}, off: true };
    const a = FK.audioCtx(); if (!a) return { set() {}, stop() {}, off: true };
    const osc = a.createOscillator(), g = a.createGain();
    osc.type = type; osc.frequency.value = freq; g.gain.value = 0.0001;
    osc.connect(g); g.connect(a.destination); osc.start();
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), a.currentTime + 0.05);
    let dead = false;
    return {
      set(f, v) { if (dead) return; const t = a.currentTime; if (f) osc.frequency.setTargetAtTime(f, t, 0.02); if (v !== undefined) g.gain.setTargetAtTime(Math.max(0.0001, v), t, 0.03); },
      stop() { if (dead) return; dead = true; const t = a.currentTime; g.gain.setTargetAtTime(0.0001, t, 0.03); osc.stop(t + 0.2); }
    };
  };
  FK.sfx = {
    ok() { FK.tone(660, 0.12); FK.tone(880, 0.18, { delay: 0.1 }); },
    no() { FK.tone(240, 0.25, { type: 'triangle', to: 150, vol: 0.18 }); },
    win() { [523, 659, 784, 1047].forEach((f, i) => FK.tone(f, 0.22, { delay: i * 0.11, type: 'triangle', vol: 0.16 })); },
    pop() { FK.tone(420, 0.09, { to: 900, vol: 0.12 }); },
    tick() { FK.tone(1000, 0.03, { vol: 0.05 }); },
    boom() { FK.tone(140, 0.4, { type: 'sawtooth', to: 40, vol: 0.2 }); },
    whoosh() { FK.tone(300, 0.3, { type: 'sawtooth', to: 900, vol: 0.05 }); }
  };

  /* ---------- Voz: leer en voz alta ---------- */
  FK.speakOK = () => 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
  FK.speaking = false;
  FK.speak = function (text, onend) {
    if (!FK.speakOK()) return false;
    const s = window.speechSynthesis;
    s.cancel();
    const clean = String(text).replace(/\s+/g, ' ').trim();
    if (!clean) return false;
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'es-CO';
    const vs = s.getVoices();
    const v = vs.find((x) => /^es[-_](CO|MX|US|419)/i.test(x.lang)) || vs.find((x) => /^es/i.test(x.lang));
    if (v) { u.voice = v; u.lang = v.lang; }
    u.rate = 0.92; u.pitch = 1.1;
    u.onend = u.onerror = () => { FK.speaking = false; if (onend) onend(); };
    FK.speaking = true;
    s.speak(u);
    return true;
  };
  FK.stopSpeak = function () { if (FK.speakOK()) window.speechSynthesis.cancel(); FK.speaking = false; };

  /* ---------- Confeti ---------- */
  FK.confetti = function (n = 70) {
    if (FK.reduced()) return;
    const cv = FK.el('canvas', 'confetti');
    cv.width = window.innerWidth; cv.height = window.innerHeight;
    document.body.appendChild(cv);
    const ctx = cv.getContext('2d');
    const cols = ['#FF4757', '#FF8A1F', '#FFC21A', '#12B76A', '#1E88FF', '#8E5CF6', '#FF3E9D'];
    const ps = Array.from({ length: n }, () => ({
      x: cv.width / 2 + (Math.random() - 0.5) * cv.width * 0.3, y: cv.height * 0.35,
      vx: (Math.random() - 0.5) * 12, vy: -Math.random() * 12 - 3, r: 4 + Math.random() * 5, a: Math.random() * 6, va: (Math.random() - 0.5) * 0.4,
      c: cols[(Math.random() * cols.length) | 0]
    }));
    const t0 = performance.now();
    (function f(now) {
      const t = (now - t0) / 1000;
      ctx.clearRect(0, 0, cv.width, cv.height);
      for (const p of ps) {
        p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.vx *= 0.99; p.a += p.va;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - t / 2.2);
        ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore();
      }
      if (t < 2.2) requestAnimationFrame(f); else cv.remove();
    })(t0);
  };

  /* ---------- Aviso breve ---------- */
  FK.toast = function (html) {
    const t = FK.el('div', 'toast', html);
    document.body.appendChild(t);
    setTimeout(() => t.classList.add('show'), 10);
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 2600);
  };

  /* Animación breve: fn(p) con p de 0 a 1 */
  FK.tween = function (dur, fn, done) {
    const t0 = performance.now(); let stop = false;
    const tick = (now) => { if (stop) return; const p = Math.min(1, (now - t0) / (dur * 1000)); fn(p); if (p < 1) requestAnimationFrame(tick); else if (done) done(); };
    requestAnimationFrame(tick);
    return () => { stop = true; };
  };
})();

      case 'happy': return arc(L, cy, r) + arc(R, cy, r);
      case 'wink': return open(L, cy, r, 0.5, 0.5) + arc(R, cy, r);
      case 'wow': return open(L, cy, r * 1.2, 0, 0) + open(R, cy, r * 1.2, 0, 0);
      case 'think': return open(L, cy, r, 1.6, -1.6) + open(R, cy, r, 1.6, -1.6);
      case 'sad': return open(L, cy, r, 0, 1) + open(R, cy, r, 0, 1) + brow(L, cy, r, -1) + brow(R, cy, r, 1);

      case 'sad': return `<path d="M${cx - w * 0.8} ${cy + 3}Q${cx} ${cy - w * 0.6} ${cx + w * 0.8} ${cy + 3}" ${s}/>`;
      default: return `<path d="M${cx - w * 0.8} ${cy}Q${cx} ${cy + w * 0.8} ${cx + w * 0.8} ${cy}" ${s}/>`;
    }
  }
  const cheeks = (cx, cy, dx) => `<ellipse cx="${cx - dx}" cy="${cy}" rx="4" ry="2.6" fill="#FF6B8B" opacity=".45"/><ellipse cx="${cx + dx}" cy="${cy}" rx="4" ry="2.6" fill="#FF6B8B" opacity=".45"/>`;

      <ellipse cx="50" cy="60" rx="31" ry="33" fill="#00B3A4" ${outline}/>
      <ellipse cx="50" cy="70" rx="20" ry="22" fill="#B5F0E9"/>
      <path d="M40 66q4 5 8 0M52 66q4 5 8 0M40 76q4 5 8 0M52 76q4 5 8 0" fill="none" stroke="#00B3A4" stroke-width="1.8" stroke-linecap="round"/>
      <ellipse cx="19" cy="64" rx="8" ry="19" fill="#007A70" ${outline} transform="rotate(8 19 64)"/>

      <circle cx="37" cy="45" r="13" fill="#fff" stroke="#FFC21A" stroke-width="3.5"/><circle cx="63" cy="45" r="13" fill="#fff" stroke="#FFC21A" stroke-width="3.5"/>
      <path d="M50 45h0" stroke="#FFC21A" stroke-width="3.5"/>
