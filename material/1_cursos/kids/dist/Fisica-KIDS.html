<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Física KIDS</title>
<meta name="author" content="Mg. Manuel Alejandro Obando — Universidad del Cauca">
<meta name="description" content="Curso interactivo de física para niñas y niños: todas las ramas, juegos, experimentos en casa y diez personajes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap">
<style>
/* ===================== Física KIDS — estilos ===================== */
:root {
  --bg: #FFF6E5; --bg2: #FFFBF2; --card: #FFFFFF; --ink: #2B2350; --ink2: #5E5A86; --edge: #2B2350;
  --pri: #6C4DFF; --pri2: #8F78FF; --ok: #12B76A; --bad: #FF4757; --gold: #FFC21A;
  --soft: #F1ECFF; --stage: #FFFFFF; --line: rgba(43,35,80,.14);
  --f-head: "Fredoka", "Baloo 2", "Nunito", system-ui, sans-serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --sh: 0 5px 0 var(--edge);
  --w: #6C4DFF; --wt: #fff;
}
:root[data-theme="dark"] {
  --bg: #15123A; --bg2: #1C1850; --card: #272263; --ink: #F5F2FF; --ink2: #BDB7EA; --edge: #0A081F;
  --soft: #322C7A; --stage: #1F1B55; --line: rgba(255,255,255,.16); --pri: #8F78FF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15123A; --bg2: #1C1850; --card: #272263; --ink: #F5F2FF; --ink2: #BDB7EA; --edge: #0A081F;
    --soft: #322C7A; --stage: #1F1B55; --line: rgba(255,255,255,.16); --pri: #8F78FF;
  }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 500 18px/1.65 var(--f-body); background-image: radial-gradient(circle at 12% 8%, rgba(255,194,26,.18) 0 90px, transparent 91px), radial-gradient(circle at 92% 20%, rgba(142,92,246,.14) 0 120px, transparent 121px), radial-gradient(circle at 80% 90%, rgba(30,136,255,.12) 0 140px, transparent 141px); background-attachment: fixed; }
h1, h2, h3, h4 { font-family: var(--f-head); line-height: 1.2; margin: 0 0 .5em; font-weight: 600; }
a { color: var(--pri); }
p { margin: 0 0 1em; }
img, svg { max-width: 100%; }
[hidden] { display: none !important; }
button { font-family: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.char { display: block; overflow: visible; }

/* ---------- barra superior ---------- */
.topbar { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--card); border-bottom: 3px solid var(--edge); }
.menu-btn, .tb-btn { appearance: none; border: 3px solid var(--edge); background: var(--bg2); color: var(--ink); width: 44px; height: 44px; border-radius: 14px; font-size: 20px; cursor: pointer; box-shadow: 0 3px 0 var(--edge); display: grid; place-items: center; padding: 0; }
.menu-btn:active, .tb-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge); }
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); font-family: var(--f-head); font-weight: 700; font-size: 25px; margin-right: auto; line-height: 1; }
.brand .kids { background: linear-gradient(90deg, #FF4757, #FF8A1F, #FFC21A, #12B76A, #1E88FF, #8E5CF6); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: 1px; }
.brand svg { width: 38px; height: 38px; }
.stars { display: inline-flex; align-items: center; gap: 6px; background: #FFF1B8; color: #5A3C00; font-family: var(--f-head); font-weight: 700; padding: 6px 14px; border: 3px solid var(--edge); border-radius: 999px; box-shadow: 0 3px 0 var(--edge); font-size: 20px; text-decoration: none; }

/* ---------- menú ---------- */
.scrim { position: fixed; inset: 0; background: rgba(20,15,60,.5); z-index: 49; opacity: 0; pointer-events: none; transition: opacity .2s; }
.drawer { position: fixed; z-index: 50; left: 0; top: 0; bottom: 0; width: min(360px, 88vw); background: var(--bg2); border-right: 3px solid var(--edge); transform: translateX(-102%); transition: transform .25s; display: flex; flex-direction: column; }
.drawer-open .drawer { transform: none; }
.drawer-open .scrim { opacity: 1; pointer-events: auto; }
.drawer-top { padding: 12px; border-bottom: 3px solid var(--edge); background: var(--card); display: flex; gap: 8px; align-items: center; }
.drawer-top input { flex: 1; min-width: 0; font: inherit; padding: 9px 14px; border: 3px solid var(--edge); border-radius: 999px; background: var(--bg2); color: var(--ink); }
#drawerList { overflow: auto; padding: 10px 12px 40px; }
.dr-h { display: block; padding: 10px 14px; margin: 6px 0; border-radius: 14px; border: 3px solid var(--edge); background: var(--card); color: var(--ink); text-decoration: none; font-family: var(--f-head); font-weight: 600; box-shadow: 0 3px 0 var(--edge); }
.dr-w { margin: 14px 0 6px; }
.dr-wt { display: flex; align-items: center; gap: 8px; font-family: var(--f-head); font-weight: 700; color: var(--ink); padding: 4px 4px; border-bottom: 4px solid var(--c); margin-bottom: 4px; }
.dr-c { display: flex; align-items: center; gap: 10px; padding: 7px 8px; color: var(--ink); text-decoration: none; border-radius: 10px; font-size: 16px; line-height: 1.25; }
.dr-c:hover, .dr-c.cur { background: color-mix(in srgb, var(--c) 18%, transparent); }
.dr-n { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--c); color: #fff; font: 700 14px var(--f-head); }
.dr-c[data-prog] { position: relative; }
.dr-c[data-prog]::after { content: ""; position: absolute; right: 8px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; border: 2px solid var(--edge); background: conic-gradient(var(--gold) var(--pct, 0%), transparent 0); }
.dr-w .dr-n { background: var(--c); }
.dr-w:nth-child(n) { --c: var(--c); }

/* ---------- botones y chips ---------- */
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 3px solid var(--edge); border-radius: 16px; padding: 10px 18px; font: 600 17px var(--f-head); cursor: pointer; text-decoration: none; box-shadow: 0 4px 0 var(--edge); transition: transform .08s, box-shadow .08s; color: var(--ink); background: var(--card); min-height: 46px; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
.btn.primary { background: var(--w); color: var(--wt); }
.btn.ghost { background: var(--card); }
.btn.big { padding: 14px 26px; font-size: 20px; border-radius: 20px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btnrow { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0; }
.chip-i { display: inline-block; padding: 2px 12px; border: 2.5px solid var(--edge); border-radius: 999px; background: var(--card); font: 600 14px var(--f-head); }
.chip-i.adult { background: #FFD6E3; color: #6A0F33; }
:root[data-theme="dark"] .chip-i.adult { background: #5E1A3C; color: #FFD6E3; }

/* ---------- portada ---------- */
.home { max-width: 1120px; margin: 0 auto; padding: 22px 16px 60px; }
.hero { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; align-items: center; background: linear-gradient(135deg, #FFE27A 0%, #FFB36B 45%, #FF8FB1 100%); border: 4px solid var(--edge); border-radius: 32px; box-shadow: 0 8px 0 var(--edge); padding: 26px 28px; overflow: hidden; position: relative; color: #2B2350; }
.kicker { font: 700 15px var(--f-head); text-transform: uppercase; letter-spacing: .08em; opacity: .8; }
.logo { font-size: clamp(48px, 9vw, 92px); margin: 4px 0 8px; line-height: 1; letter-spacing: -1px; text-shadow: 0 4px 0 rgba(255,255,255,.5); }
.logo .kids i { font-style: normal; display: inline-block; text-shadow: 0 4px 0 rgba(43,35,80,.25); } .logo .kids i:nth-child(1) { color: #FF4757; transform: rotate(-4deg); } .logo .kids i:nth-child(2) { color: #1E88FF; transform: translateY(-3px); } .logo .kids i:nth-child(3) { color: #12B76A; transform: rotate(3deg); } .logo .kids i:nth-child(4) { color: #8E5CF6; transform: translateY(-2px) rotate(-3deg); }
.hero-p { font-size: 20px; max-width: 34em; }
.hero-b { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; }
.hero .btn.primary { background: #2B2350; color: #fff; }
.hero-crew { position: relative; height: 270px; }
.float { position: absolute; animation: bob 3.4s ease-in-out infinite; filter: drop-shadow(0 6px 0 rgba(43,35,80,.2)); }
.float.f0 { left: 4%; top: 30%; } .float.f1 { left: 34%; top: 0; animation-delay: -.7s; } .float.f2 { right: 2%; top: 26%; animation-delay: -1.4s; } .float.f3 { left: 16%; top: 62%; animation-delay: -2s; } .float.f4 { right: 22%; top: 60%; animation-delay: -2.6s; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-12px) rotate(3deg); } }
.how { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 22px 0; }
.how-c { background: var(--card); border: 3px solid var(--edge); border-radius: 20px; padding: 12px 16px; box-shadow: var(--sh); display: flex; flex-direction: column; font-size: 16px; line-height: 1.4; }
.how-c b { font: 700 19px var(--f-head); margin-bottom: 4px; }
.sec-t { font-size: clamp(26px, 4vw, 36px); margin: 34px 0 10px; }
.sec-p { color: var(--ink2); max-width: 44em; }
.crew { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.crew-c { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding: 12px 8px 14px; text-decoration: none; color: var(--ink); background: color-mix(in srgb, var(--c) 18%, var(--card)); border: 3px solid var(--edge); border-radius: 22px; box-shadow: var(--sh); transition: transform .15s; }
.crew-c:hover { transform: translateY(-4px) rotate(-1deg); }
.crew-c b { font: 700 20px var(--f-head); }
.crew-c small { font-size: 13.5px; line-height: 1.25; color: var(--ink2); }
.world { margin: 24px 0; padding: 18px; background: color-mix(in srgb, var(--c) 14%, var(--card)); border: 4px solid var(--edge); border-radius: 28px; box-shadow: 0 7px 0 var(--edge); scroll-margin-top: 80px; }
.world-h { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; }
.world-av { flex: none; filter: drop-shadow(0 5px 0 rgba(43,35,80,.18)); }
.world-h small { font: 700 14px var(--f-head); text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); }
.world-h h3 { font-size: clamp(24px, 3.4vw, 32px); margin: 2px 0 4px; }
.world-h p { margin: 0 0 6px; color: var(--ink2); font-size: 17px; line-height: 1.4; }
.branch { display: inline-block; font: 600 14px var(--f-head); background: var(--card); border: 2.5px solid var(--edge); border-radius: 999px; padding: 1px 12px; }
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.lvl { --pct: 0%; position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; text-decoration: none; color: var(--ink); background: var(--card); border: 3px solid var(--edge); border-radius: 18px; box-shadow: 0 4px 0 var(--edge); font: 600 16px/1.2 var(--f-head); transition: transform .12s; }
.lvl:hover { transform: translateY(-3px); }
.lvl-n { flex: none; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; background: conic-gradient(var(--c) var(--pct), color-mix(in srgb, var(--c) 22%, var(--card)) 0); border: 3px solid var(--edge); position: relative; font-size: 17px; z-index: 0; color: var(--ink); }
.lvl-n::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--card); z-index: -1; }
.lvl.full { background: color-mix(in srgb, var(--gold) 30%, var(--card)); }
.lvl.full .lvl-n::after { content: "⭐"; position: absolute; right: -10px; top: -12px; font-size: 18px; }
.extra { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 36px; }
.extra-c { display: flex; flex-direction: column; gap: 2px; padding: 16px; text-decoration: none; color: var(--ink); background: var(--card); border: 3px solid var(--edge); border-radius: 22px; box-shadow: var(--sh); }
.extra-c span { font-size: 34px; } .extra-c b { font: 700 20px var(--f-head); } .extra-c small { color: var(--ink2); font-size: 15px; line-height: 1.3; }

/* ---------- pasaporte, glosario, experimentos ---------- */
.pp-h { display: flex; align-items: center; justify-content: space-between; gap: 18px; background: linear-gradient(135deg, #C9B8FF, #9ED8FF); border: 4px solid var(--edge); border-radius: 28px; padding: 22px 26px; box-shadow: 0 7px 0 var(--edge); color: #2B2350; }
.pp-h h1 { font-size: clamp(30px, 5vw, 46px); margin: 2px 0 6px; }
.pp-big { font: 700 64px var(--f-head); display: flex; align-items: center; gap: 4px; }
.pp-bar { height: 22px; border: 3px solid var(--edge); border-radius: 999px; background: var(--card); margin: 18px 0; overflow: hidden; }
.pp-bar i { display: block; height: 100%; background: repeating-linear-gradient(45deg, #FFC21A 0 14px, #FFD84D 14px 28px); }
.stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.stamp { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding: 14px 10px; text-decoration: none; color: var(--ink); background: var(--card); border: 3px dashed var(--edge); border-radius: 22px; filter: grayscale(.9); opacity: .75; }
.stamp.got { background: color-mix(in srgb, var(--c) 18%, var(--card)); border-style: solid; filter: none; opacity: 1; box-shadow: var(--sh); }
.stamp b { font: 700 18px var(--f-head); line-height: 1.2; } .stamp small { font-size: 14px; color: var(--ink2); }
.stamp-bar { width: 100%; height: 10px; border: 2px solid var(--edge); border-radius: 999px; background: var(--card); overflow: hidden; margin-top: 6px; } .stamp-bar i { display: block; height: 100%; background: var(--c); }
.nm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font: 600 18px var(--f-head); margin-bottom: 12px; }
.nm input, .gl-s { font: 600 18px var(--f-body); padding: 10px 16px; border: 3px solid var(--edge); border-radius: 14px; background: var(--card); color: var(--ink); min-width: 260px; max-width: 100%; }
.gl-s { width: 100%; margin: 16px 0; }
.diploma { background: #FFFBEA; border: 6px double #C79A1B; border-radius: 18px; padding: 8px; max-width: 760px; margin: 0 auto 14px; color: #2B2350; }
.dp-in { border: 3px solid #E8C45A; border-radius: 12px; padding: 22px 20px; text-align: center; background: radial-gradient(circle at 50% 0, #FFF4C2, #FFFBEA 60%); }
.dp-top { display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; } .dp-in h2 { font-size: 46px; margin: 4px 0; color: #6C4DFF; } .dp-in p { margin: 4px 0; }
.dp-name { font: 700 38px var(--f-head); border-bottom: 3px solid #C79A1B; display: inline-block; min-width: 60%; margin: 8px 0; } .dp-t { font: 700 22px var(--f-head); color: #C0182B; } .dp-sign { margin-top: 16px; font: 600 16px var(--f-head); }
.gl-l { font-size: 34px; color: var(--pri); border-bottom: 4px solid var(--line); margin: 22px 0 6px; }
.gl-i { display: grid; grid-template-columns: 190px 1fr auto; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: baseline; font-size: 17px; line-height: 1.4; } .gl-i b { font-family: var(--f-head); font-size: 19px; } .gl-i a { font-size: 14px; }
.ex-w { display: flex; align-items: center; gap: 10px; margin: 28px 0 8px; padding-bottom: 4px; border-bottom: 4px solid var(--c); }
.ex-i { display: flex; gap: 12px; padding: 10px 14px; margin: 8px 0; background: var(--card); border: 3px solid var(--edge); border-radius: 18px; text-decoration: none; color: var(--ink); box-shadow: 0 3px 0 var(--edge); } .ex-i.done { background: color-mix(in srgb, var(--ok) 16%, var(--card)); }
.ex-ck { font-size: 28px; } .ex-b { display: flex; flex-direction: column; } .ex-b b { font: 600 19px var(--f-head); } .ex-b small { color: var(--ink2); font-size: 14.5px; line-height: 1.35; }

/* ---------- capítulo ---------- */
.chapter { --soft: color-mix(in srgb, var(--w) 14%, var(--card)); --soft2: color-mix(in srgb, var(--w) 26%, var(--card)); max-width: 940px; margin: 0 auto; padding: 18px 16px 60px; }
.chhero { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; background: var(--w); color: var(--wt); border: 4px solid var(--edge); border-radius: 30px; box-shadow: 0 8px 0 var(--edge); padding: 22px 26px; position: relative; overflow: hidden; }
.chhero::before { content: ""; position: absolute; right: -60px; top: -60px; width: 260px; height: 260px; border-radius: 50%; background: rgba(255,255,255,.18); }
.chhero::after { content: ""; position: absolute; right: 120px; bottom: -80px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.12); }
.chhero > * { position: relative; z-index: 1; }
.chhero h1 { font-size: clamp(32px, 5.4vw, 52px); margin: 2px 0 6px; text-shadow: 0 3px 0 rgba(0,0,0,.14); }
.chhero .crumb { color: inherit; font: 600 15px var(--f-head); opacity: .92; text-decoration: none; background: rgba(0,0,0,.14); padding: 3px 12px; border-radius: 999px; display: inline-block; }
.chnum { font: 700 15px var(--f-head); text-transform: uppercase; letter-spacing: .1em; opacity: .9; margin-top: 10px; }
.chshort { font-size: 17px; opacity: .95; margin: 0 0 10px; max-width: 34em; line-height: 1.4; }
.chbig { display: block; animation: bob 3.6s ease-in-out infinite; filter: drop-shadow(0 6px 0 rgba(0,0,0,.2)); }
.prog { display: flex; align-items: center; gap: 10px; font: 600 16px var(--f-head); max-width: 380px; }
.prog-bar { flex: 1; height: 16px; border: 3px solid var(--edge); border-radius: 999px; background: rgba(255,255,255,.55); overflow: hidden; } .prog-bar i { display: block; height: 100%; width: var(--pct, 0%); background: repeating-linear-gradient(45deg, #FFC21A 0 10px, #FFD84D 10px 20px); transition: width .4s; }
.prog.big { max-width: none; background: var(--soft); border: 3px solid var(--edge); border-radius: 18px; padding: 10px 16px; flex-wrap: wrap; color: var(--ink); } .prog.big b { flex: 1 0 100%; font-size: 17px; }
.prog-t { white-space: nowrap; }
.chbody { padding: 22px 0 0; }
.lead { font-size: 21px; line-height: 1.55; font-weight: 600; }
.learn { background: var(--soft); border: 3px solid var(--edge); border-radius: 22px; padding: 14px 20px 8px; box-shadow: var(--sh); margin: 18px 0 8px; }
.learn h3 { font-size: 22px; margin: 0 0 4px; } .learn ul { margin: 0 0 8px; padding-left: 24px; } .learn li { margin: 3px 0; }
section { margin: 36px 0; }
section > h2 { position: relative; font-size: clamp(26px, 4vw, 34px); padding: 6px 16px; display: inline-block; background: var(--w); color: var(--wt); border: 3px solid var(--edge); border-radius: 16px; box-shadow: 0 4px 0 var(--edge); margin: 0 0 16px; transform: rotate(-.8deg); }
.tts { appearance: none; margin-left: 12px; border: 3px solid var(--edge); background: var(--card); border-radius: 50%; width: 38px; height: 38px; font-size: 18px; cursor: pointer; vertical-align: middle; box-shadow: 0 3px 0 var(--edge); padding: 0; }
.tts.on { background: var(--gold); animation: pulse .8s infinite alternate; } .tts.big { width: auto; border-radius: 999px; padding: 6px 16px; font: 600 16px var(--f-head); height: auto; margin: 0 0 18px; color: var(--ink); }
@keyframes pulse { to { transform: scale(1.12); } }
ul, ol { padding-left: 1.4em; } li { margin: .3em 0; }
ol.steps5 { list-style: none; padding: 0; counter-reset: k; }
ol.steps5 li { counter-increment: k; position: relative; padding: 10px 14px 10px 62px; margin: 10px 0; background: var(--card); border: 3px solid var(--edge); border-radius: 18px; box-shadow: 0 4px 0 var(--edge); }
ol.steps5 li::before { content: counter(k); position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border-radius: 50%; background: var(--w); color: var(--wt); border: 3px solid var(--edge); display: grid; place-items: center; font: 700 19px var(--f-head); }
dfn { font-style: normal; font-weight: 700; border-bottom: 3px dotted var(--w); cursor: help; background: color-mix(in srgb, var(--w) 12%, transparent); border-radius: 4px; padding: 0 2px; }
.dfn-tip { position: absolute; z-index: 60; background: #2B2350; color: #fff; padding: 10px 14px; border-radius: 14px; font-size: 16px; line-height: 1.4; opacity: 0; pointer-events: none; transition: opacity .15s; border: 3px solid #fff; box-shadow: 0 6px 0 rgba(0,0,0,.25); } .dfn-tip.on { opacity: 1; }
.say { --c: var(--w); display: flex; gap: 12px; align-items: flex-start; margin: 20px 0; }
.say-av { flex: none; width: 84px; text-align: center; } .say-n { display: block; font: 700 14px var(--f-head); margin-top: -4px; color: var(--ink); }
.say-b { position: relative; flex: 1; background: var(--cs, var(--soft)); border: 3px solid var(--edge); border-radius: 22px; padding: 10px 18px; box-shadow: var(--sh); font-weight: 600; }
:root[data-theme="dark"] .say-b { background: color-mix(in srgb, var(--c) 24%, var(--card)); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .say-b { background: color-mix(in srgb, var(--c) 24%, var(--card)); } }

<!-- 01-queesfisica.html -->
<template class="chapter-src" data-id="queesfisica" data-num="1" data-world="1" data-title="¿Qué es la física?" data-short="Preguntas, ramas de la física y el método de los científicos.">
<p class="lead">¿Por qué cae una manzana? ¿Por qué brilla el Sol? ¿Por qué suena una guitarra? La <dfn data-def="La ciencia que estudia cómo funciona la naturaleza: el movimiento, la luz, el calor, la electricidad, los átomos y el universo.">física</dfn> es la ciencia de hacerse preguntas sobre TODO lo que pasa a nuestro alrededor… ¡y encontrar las respuestas!</p>

<div class="learn"><ul>
<li>La física estudia cómo funciona el universo, de lo más pequeño a lo más grande.</li>
<li>Tiene muchas ramas, como un árbol.</li>
<li>Los científicos usan un método: preguntar, imaginar, probar, mirar y contar.</li>
</ul></div>

<div class="say" data-who="buho" data-mood="happy"><p>¡Hola, soy el Búho Sabio! Hace muchísimo tiempo, las personas miraban el cielo y se preguntaban cosas. Hoy tú vas a hacer lo mismo. ¡Bienvenido, bienvenida a la aventura de la física!</p></div>

<section>
<h2>Todo tiene una explicación</h2>
<p>Mira a tu alrededor. Una pelota rueda, el agua hierve, la luz entra por la ventana, el celular suena, la Luna sale de noche. Todo eso tiene una <strong>explicación</strong>, y buscarla es el trabajo de la física.</p>
<p>La palabra «física» viene de una palabra griega, <em>physis</em>, que quiere decir <strong>naturaleza</strong>. Los físicos y las físicas estudian la naturaleza: cómo se mueven las cosas, por qué se calientan, cómo viaja la luz y de qué están hechas.</p>
<div class="fact"><p>Hay preguntas de física muy grandes («¿cómo empezó el universo?») y muy pequeñas («¿de qué está hecho un átomo?»). ¡Y también muy cotidianas, como «¿por qué se enfría mi chocolate?»!</p></div>
<div class="say" data-who="newti" data-mood="wow"><p>¡Miau! Yo me pregunto siempre por qué los gatos caemos de pie. ¡Eso también es física!</p></div>
</section>

<section>
<h2>Las ramas de la física</h2>
<p>La física es como un árbol enorme con muchas ramas. Cada rama estudia un tipo de cosas. Tú vas a visitar <strong>diez mundos</strong>, y cada uno tiene un amigo que te guía:</p>
<div class="cols2">
<div class="card"><h4>🐱 Mecánica · Newti</h4><p>El movimiento y las fuerzas: correr, caer, empujar, girar y chocar.</p></div>
<div class="card"><h4>💧 Fluidos · Gotín</h4><p>El agua y el aire: flotar, presionar, volar.</p></div>
<div class="card"><h4>🔥 Calor · Flamo</h4><p>La temperatura, el hielo, el vapor y la energía. Se llama <em>termodinámica</em>.</p></div>
<div class="card"><h4>🔊 Ondas y sonido · Eco</h4><p>Vaivenes, olas, ecos y música. Se llama <em>acústica</em>.</p></div>
<div class="card"><h4>💡 Luz y color · Lumi</h4><p>Sombras, espejos, lentes, arcoíris. Se llama <em>óptica</em>.</p></div>
<div class="card"><h4>⚡ Electricidad y magnetismo · Chispa</h4><p>Chispas, circuitos, imanes y ondas invisibles. Se llama <em>electromagnetismo</em>.</p></div>
<div class="card"><h4>🚀 Cielo y espacio · Cosmo</h4><p>La Luna, los planetas, las estrellas y todo el universo. Se llama <em>astronomía</em> y <em>cosmología</em>.</p></div>
<div class="card"><h4>⚛️ Lo muy pequeño · Quarki</h4><p>Átomos, núcleos, física cuántica, relatividad y partículas.</p></div>
<div class="card"><h4>🌍 Tierra y vida · Terra</h4><p>Terremotos, el cuerpo, los materiales, el azar y el caos.</p></div>
<div class="card"><h4>📜 Orígenes · Búho</h4><p>La historia de la ciencia y cómo medimos el mundo.</p></div>
</div>
<div class="sim" data-sim="une-ramas" data-title="Une la pregunta con su rama" data-goal="Une cada pregunta con la rama de la física que la estudia."></div>
</section>

<section>
<h2>El método de los científicos</h2>
<p>Los científicos no adivinan: <strong>comprueban</strong>. Siguen cinco pasos, que también puedes seguir tú:</p>
<ol class="steps5">
<li><b>🤔 Pregunta.</b> Algo te llama la atención: «¿cae más rápido lo pesado?»</li>
<li><b>💭 Imagina.</b> Piensas una respuesta posible. Los científicos le llaman <dfn data-def="Una respuesta posible a una pregunta, que todavía hay que comprobar.">hipótesis</dfn>.</li>
<li><b>🧪 Prueba.</b> Haces un <dfn data-def="Una prueba que se hace a propósito para ver qué pasa y responder una pregunta.">experimento</dfn>.</li>
<li><b>👀 Mira.</b> Observas y anotas lo que pasó, sin trampa.</li>
<li><b>📣 Cuenta.</b> Compartes lo que descubriste. A veces tu idea era buena… ¡y a veces aprendes algo mejor!</li>
</ol>
<div class="fact"><p>Equivocarse no es malo en ciencia. Muchos descubrimientos empezaron con una idea que resultó ser falsa y alguien tuvo la paciencia de probarla.</p></div>
<div class="say" data-who="buho" data-mood="think"><p>Hace más de 2000 años, un sabio famoso llamado Aristóteles pensaba que las cosas pesadas siempre caen más rápido. ¿Tendría razón? ¡Probémoslo con un juego!</p></div>
<div class="sim" data-sim="predice-cae" data-title="Predice y prueba: ¿cuál llega primero?" data-goal="Elige tu predicción, suelta los objetos y mira si acertaste. ¡Acierta una vez para ganar la estrella!">
<ul><li>Prueba la bola de boliche y la pluma con aire. ¿Cuál llega primero?</li><li>Ahora cámbialo a «Sin aire»: ¡todo cae igual! Así lo comprobaron los astronautas en la Luna.</li><li>La hoja de papel y el globo caen despacio por el aire, no por ser «livianos».</li></ul>
</div>
<details class="curious"><p>La caída de los objetos depende de la <strong>resistencia del aire</strong>. Sin aire, todos los objetos caen con la misma aceleración sin importar su masa (en la Tierra, 9,8 m/s²). Galileo lo razonó hacia 1600, y en 1971 el astronauta David Scott lo mostró en la Luna soltando un martillo y una pluma: llegaron al suelo al mismo tiempo.</p></details>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="El libro y la hoja de papel" data-time="5 min" data-level="1">
<ul class="mat"><li>📖 Un libro</li><li>📄 Una hoja de papel</li></ul>
<ol class="steps"><li>Sostén el libro en una mano y la hoja en la otra, a la misma altura.</li><li>Suéltalos a la vez. ¿Cuál llega primero al suelo?</li><li>Ahora pon la hoja <b>encima del libro</b>, bien apoyada, y suéltalos juntos.</li><li>Después arruga la hoja formando una bolita y suelta la bolita y el libro.</li></ol>
<p class="predict">¿Qué crees que pasará cuando la hoja vaya encima del libro?</p>
<p class="result">La hoja sola cae despacio y el libro rápido. Pero con la hoja encima del libro, ¡caen juntos! Y la bolita de papel cae casi tan rápido como el libro.</p>
<p class="why">El aire frena más a la hoja abierta, porque tiene mucha superficie. El libro va empujando el aire y la hoja queda «escondida» detrás, sin que el aire la frene. Al arrugarla, el aire la frena mucho menos.</p>
</div>
</section>

<section>
<h2>Un poco de historia</h2>
<div class="story" data-title="Los primeros que se preguntaron">
<p>Hace unos 2600 años, en Grecia, un hombre llamado <strong>Tales de Mileto</strong> frotó un trozo de ámbar y vio que atraía pedacitos de paja. Se preguntó por qué. Era una de las primeras preguntas de electricidad. Muy lejos de allí, en otros lugares del mundo, también había gente que miraba el cielo, medía las sombras y contaba los días. La ciencia es una historia de todos los pueblos. En el capítulo 2 conocerás a muchos de ellos.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>¿Qué estudia la física?</p><ol><li>Solo los planetas</li><li>Cómo funciona la naturaleza, de lo muy pequeño a lo muy grande</li><li>Solo las máquinas</li></ol><p class="why">La física estudia todo lo que pasa en la naturaleza: el movimiento, el calor, la luz, la electricidad, los átomos y las estrellas.</p></div>
<div class="q" data-ans="0"><p>¿Cuál es el primer paso del método de los científicos?</p><ol><li>Hacerse una pregunta</li><li>Dar la respuesta</li><li>Guardar los resultados</li></ol><p class="why">Todo empieza con una pregunta, con la curiosidad.</p></div>
<div class="q" data-ans="2"><p>¿Por qué la hoja abierta cae más despacio que el libro?</p><ol><li>Porque el papel no tiene peso</li><li>Porque la Tierra no la atrae</li><li>Porque el aire la frena más</li></ol><p class="why">El aire frena más a los objetos livianos y anchos. Sin aire, caerían igual.</p></div>
<div class="q" data-ans="1"><p>¿Qué rama de la física estudia la luz y los arcoíris?</p><ol><li>La mecánica</li><li>La óptica</li><li>La astronomía</li></ol><p class="why">La óptica es la rama de la luz, los espejos, los lentes y los colores.</p></div>
</div>
</template>

<!-- 02-curiosos.html -->
<template class="chapter-src" data-id="curiosos" data-num="2" data-world="1" data-title="Los primeros curiosos" data-short="Quiénes se hicieron las primeras preguntas y cómo cambió el mundo.">
<p class="lead">Antes de que existieran los celulares, los carros o las lámparas, ya había personas que miraban el cielo, probaban cosas y se hacían preguntas. Gracias a ellas, hoy sabemos tantas cosas. ¡Vamos a conocerlas!</p>

<div class="learn"><ul>
<li>La física tiene miles de años de historia.</li>
<li>Personas de todo el mundo aportaron: mujeres y hombres, de muchos pueblos.</li>
<li>Cada descubrimiento se apoya en los anteriores.</li>
</ul></div>

<div class="say" data-who="buho" data-mood="happy"><p>Yo he vivido en muchas épocas… bueno, ¡en mi imaginación! Te voy a contar las historias de los curiosos más famosos. Algunos eran sabios, otros eran inventores, y otros solo tenían mucha paciencia.</p></div>

<section>
<h2>Una línea del tiempo</h2>
<ol class="tl">
<li><span class="tl-y">Hace 2600 años</span><b>🏺 Tales de Mileto</b><p>En Grecia frotó un trozo de ámbar y vio que atraía pedacitos de paja. Fue una de las primeras preguntas sobre electricidad. (De la palabra griega para ámbar, <em>elektron</em>, viene «electricidad».)</p></li>
<li><span class="tl-y">Hace 2250 años</span><b>🛁 Arquímedes</b><p>Descubrió por qué algunas cosas flotan. La leyenda cuenta que se metió a la bañera, entendió la idea y salió corriendo gritando «¡Eureka!» («¡lo encontré!»).</p></li>
<li><span class="tl-y">Hace 2250 años</span><b>📏 Eratóstenes</b><p>Midió el tamaño de la Tierra con dos palos y sus sombras, en dos ciudades distintas. ¡Y casi acertó!</p></li>
<li><span class="tl-y">Hace unos 1900 años</span><b>🌍 Zhang Heng, en China</b><p>Construyó un aparato con dragones y sapos de bronce que avisaba cuando había un temblor lejano.</p></li>
<li><span class="tl-y">Hace 1000 años</span><b>👁️ Ibn al-Haytham</b><p>En El Cairo estudió la luz. Probó con experimentos que vemos porque la luz que rebota en las cosas entra a nuestros ojos. Usó una cámara oscura.</p></li>
<li><span class="tl-y">Hace 415 años</span><b>🔭 Galileo Galilei</b><p>Apuntó un telescopio al cielo y vio montañas en la Luna y cuatro lunas dando vueltas a Júpiter. Y probó que los objetos caen juntos si no hay aire.</p></li>
<li><span class="tl-y">Hace 340 años</span><b>🍎 Isaac Newton</b><p>Explicó la gravedad y las leyes del movimiento. Con sus ideas se pueden calcular desde las órbitas de los planetas hasta el vuelo de una pelota.</p></li>
<li><span class="tl-y">Hace unos 200 años</span><b>🌿 Francisco José de Caldas</b><p>Nació en Popayán. Midió la altura de las montañas viendo a qué temperatura hierve el agua. ¡Un físico de nuestra tierra!</p></li>
<li><span class="tl-y">Hace unos 160 años</span><b>⚡ Michael Faraday y James Maxwell</b><p>Descubrieron cómo se relacionan la electricidad, el magnetismo y la luz. Gracias a ellos hay motores, bombillos y radio.</p></li>
<li><span class="tl-y">Hace unos 125 años</span><b>☢️ Marie Curie</b><p>Estudió la radiactividad, descubrió dos elementos nuevos y ganó dos premios Nobel.</p></li>
<li><span class="tl-y">Hace 120 años</span><b>🌌 Albert Einstein</b><p>Cambió nuestra idea del tiempo, el espacio y la luz con su teoría de la relatividad.</p></li>
<li><span class="tl-y">Hace unos 100 años</span><b>🌟 Cecilia Payne</b><p>Descubrió de qué están hechas las estrellas: sobre todo, de hidrógeno.</p></li>
</ol>
<div class="fact"><p>Los mayas llevaban cuentas muy precisas de los movimientos de Venus y de los eclipses. Los antiguos pueblos de América, de África, de Asia y de Europa hicieron ciencia observando el cielo para saber cuándo sembrar y cuándo viajar.</p></div>
<div class="sim" data-sim="ordena-historia" data-title="Ordena la historia" data-goal="Toca las tarjetas desde la más antigua hasta la más reciente."></div>
</section>

<section>
<h2>¿Quién fue quién?</h2>
<div class="say" data-who="cosmo" data-mood="wow"><p>¡Guau! ¿Y si ahora pruebas lo que recuerdas? Une a cada personaje con lo que hizo.</p></div>
<div class="sim" data-sim="quien-fue" data-title="¿Quién descubrió qué?" data-goal="Une a cada personaje con su descubrimiento."></div>
</section>

<section>
<h2>Cómo se construye la ciencia</h2>
<p>Ningún científico lo hizo todo solo. Newton escribió que había visto más lejos porque se había subido a <strong>hombros de gigantes</strong>: los que habían trabajado antes. Cada generación comprueba, corrige y agrega algo. Y las ideas viajan: de Grecia a Egipto, de China a Arabia, de Arabia a Europa, de allá a América y de vuelta otra vez.</p>
<p>Hoy hay miles de científicos en todo el mundo, y en nuestra región también: en universidades, observatorios y laboratorios. ¡Algún día podrías ser tú!</p>
<details class="curious"><p>Aristóteles, que vivió hace unos 2350 años, pensaba que los cuerpos pesados caían más rápido que los livianos, y durante casi dos mil años se aceptó su idea sin probarla. Galileo (y otros antes que él) hicieron pruebas con rampas y bolas. La lección: <strong>una idea vale por lo que se puede comprobar</strong>, no por lo famoso que sea quien la dice.</p></details>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Tu propio reloj de sol" data-time="1 día (mirando cada hora)" data-level="1">
<ul class="mat"><li>✏️ Un lápiz largo o un palito</li><li>🧱 Plastilina</li><li>📄 Una hoja grande o cartón</li><li>🖍️ Un marcador</li><li>☀️ Un día de sol</li></ul>
<ol class="steps"><li>Pega el lápiz parado con plastilina en el centro de la hoja.</li><li>Pon la hoja en un lugar donde dé el Sol todo el día. Pégala con cinta para que no se mueva.</li><li>Cada hora, marca con el marcador la punta de la sombra y escribe la hora al lado.</li><li>Observa cómo cambia el largo y la dirección de la sombra.</li></ol>
<p class="predict">¿A qué hora crees que la sombra será más corta?</p>
<p class="result">La sombra es larga por la mañana y por la tarde, y muy corta hacia el mediodía. Además la sombra va girando, como la manecilla de un reloj.</p>
<p class="why">El Sol parece moverse por el cielo porque la Tierra gira. Al mediodía está más alto y la sombra se acorta. Los antiguos usaban relojes de sol como este para saber la hora.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="0"><p>¿Qué descubrió Arquímedes?</p><ol><li>Por qué flotan las cosas</li><li>Cómo funciona un telescopio</li><li>La radiactividad</li></ol><p class="why">Arquímedes estudió por qué algunas cosas flotan y otras se hunden. Lo veremos en el mundo del agua.</p></div>
<div class="q" data-ans="2"><p>¿Quién fue Francisco José de Caldas?</p><ol><li>Un astronauta</li><li>Un inventor de la bombilla</li><li>Un científico nacido en Popayán</li></ol><p class="why">Caldas nació en Popayán, estudió la naturaleza y midió alturas usando la temperatura a la que hierve el agua.</p></div>
<div class="q" data-ans="1"><p>¿Quién midió el tamaño de la Tierra con sombras?</p><ol><li>Galileo</li><li>Eratóstenes</li><li>Marie Curie</li></ol><p class="why">Eratóstenes comparó la sombra de un palo en dos ciudades y calculó el tamaño de la Tierra.</p></div>
<div class="q" data-ans="1"><p>¿Cuándo se hacen más largas las sombras?</p><ol><li>Al mediodía</li><li>Por la mañana y por la tarde</li><li>De noche</li></ol><p class="why">Cuando el Sol está bajo en el cielo, las sombras son largas.</p></div>
</div>
</template>

<!-- 03-medir.html -->
<template class="chapter-src" data-id="medir" data-num="3" data-world="1" data-title="Medir el mundo" data-short="Metros, kilos y segundos: cómo medimos, y qué tan grande o pequeño es todo.">
<p class="lead">Para saber cuánto, cuánto pesa o cuánto dura algo, hay que <strong>medir</strong>. Medir es comparar con algo que todos conocemos. ¡Y la física no puede vivir sin medir!</p>

<div class="learn"><ul>
<li>Medimos longitud, masa y tiempo con metros, kilogramos y segundos.</li>
<li>Todos usamos las mismas unidades para entendernos.</li>
<li>El universo tiene cosas desde ultra pequeñas hasta gigantescas.</li>
</ul></div>

<div class="say" data-who="buho" data-mood="think"><p>Hace mucho, cada pueblo medía con su propio «palmo» o su «paso». ¡Y todos eran distintos! Imagina comprar tela y que el vendedor tenga las manos más pequeñas que las tuyas…</p></div>

<section>
<h2>Las tres medidas básicas</h2>
<div class="cols3">
<div class="card"><div class="big-emoji">📏</div><h4>Longitud</h4><p>¿Qué tan largo? Se mide en <dfn data-def="La unidad de longitud. Más o menos lo que mide una zancada grande de una persona.">metros</dfn> (m). Un metro tiene 100 centímetros (cm) y 1000 milímetros (mm).</p></div>
<div class="card"><div class="big-emoji">⚖️</div><h4>Masa</h4><p>¿Cuánta materia tiene? Se mide en <dfn data-def="La unidad de masa. Un litro de agua tiene una masa de casi un kilogramo.">kilogramos</dfn> (kg). Un kilo tiene 1000 gramos (g).</p></div>
<div class="card"><div class="big-emoji">⏱️</div><h4>Tiempo</h4><p>¿Cuánto dura? Se mide en <dfn data-def="La unidad de tiempo. Es más o menos lo que tarda un latido de tu corazón.">segundos</dfn> (s). Un minuto tiene 60 segundos.</p></div>
</div>
<div class="fact"><p>El metro se inventó en Francia hace más de 200 años para que todo el mundo midiera igual. Hoy, el segundo se mide con relojes atómicos tan exactos que no se atrasan ni un segundo en millones de años.</p></div>
<div class="say" data-who="newti" data-mood="happy"><p>Un truco: una hoja de cuaderno mide casi 30 cm de largo, ¡y una puerta mide cerca de 2 metros!</p></div>
<div class="sim" data-sim="estima-largo" data-title="Adivina cuánto mide" data-goal="Mira la barra y adivina cuántos centímetros mide. ¡Acierta 3 de 5!">
<ul><li>Usa la regla pequeña de arriba para comparar: mide justo 5 cm.</li><li>Una buena adivinanza no tiene que ser perfecta: ¡basta acercarse un poquito!</li></ul>
</div>
</section>

<section>
<h2>¿Qué tan grande es todo?</h2>
<p>Hay cosas diminutas, como un átomo, y cosas gigantes, como una galaxia. Para hablar de ellas, los científicos usan los <strong>poderes de diez</strong>: cada paso es 10 veces más grande. Un metro es 10 veces mayor que 10 centímetros. Y 10 metros es 10 veces más que 1 metro.</p>
<div class="say" data-who="cosmo" data-mood="wow"><p>¡Guau! Con solo 40 pasos de «diez veces más grande» vamos de un átomo al universo entero.</p></div>
<div class="sim" data-sim="escalas" data-title="Viaje por los tamaños" data-goal="Mueve la barra para recorrer los tamaños. ¡Encuentra 8 cosas distintas!">
<ul><li>Llega hasta la izquierda: ¡las cosas más pequeñitas!</li><li>Y hasta la derecha: ¡lo más inmenso!</li></ul>
</div>
<details class="curious"><p>Para escribir números enormes o diminutos se usa la <strong>notación científica</strong>: 10<sup>3</sup> es 1000, 10<sup>6</sup> es un millón. Y 10<sup>−3</sup> es una milésima: 0,001. Cada «escalón» del exponente multiplica por diez. Un átomo mide unos 10<sup>−10</sup> m y el universo observable, unos 10<sup>27</sup> m: ¡37 escalones de diferencia!</p></details>
</section>

<section>
<h2>Medir el tiempo: ¡tus reflejos!</h2>
<p>El tiempo se mide con relojes y cronómetros. Cuando algo pasa muy rápido, como el parpadeo de un ojo, usamos <strong>milisegundos</strong> (ms): una milésima de segundo. Una persona tarda más o menos <strong>0,2 a 0,3 segundos</strong> en reaccionar a una luz: eso son 200 a 300 ms.</p>
<div class="sim" data-sim="reflejos" data-title="¿Qué tan rápidos son tus reflejos?" data-goal="Espera a que la pantalla se ponga verde y toca lo más rápido que puedas. ¡Baja de 350 milisegundos!">
<ul><li>Si tocas antes de tiempo, ¡pierdes ese intento!</li><li>Las personas que juegan videojuegos o practican deportes suelen reaccionar más rápido.</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Mide con tu cuerpo" data-time="15 min" data-level="1">
<ul class="mat"><li>🛋️ Una mesa o una cama</li><li>📏 Una regla o cinta métrica</li><li>🧑‍🤝‍🧑 Un amigo o familiar</li></ul>
<ol class="steps"><li>Mide el largo de la mesa con tus <b>palmos</b> (con la mano abierta, de la punta del pulgar a la del meñique). Cuenta cuántos son.</li><li>Pide a un amigo o familiar que también la mida con sus palmos.</li><li>Ahora mídela con <b>pasos</b> (pie con pie) y con la regla en centímetros.</li><li>Compara todos los números.</li></ol>
<p class="predict">¿Tu amigo y tú obtendrán el mismo número de palmos?</p>
<p class="result">Los números de palmos y de pasos son distintos, porque las manos y los pies de cada persona no miden igual. Pero con la regla ¡todos obtienen los mismos centímetros!</p>
<p class="why">Por eso los científicos usan unidades iguales para todos: el metro, el kilogramo y el segundo. Así, un resultado en Popayán se entiende igual en Japón.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>¿En qué unidad se mide la longitud?</p><ol><li>Kilogramos</li><li>Metros</li><li>Segundos</li></ol><p class="why">La longitud se mide en metros. Los kilogramos son para la masa y los segundos para el tiempo.</p></div>
<div class="q" data-ans="2"><p>¿Cuántos centímetros tiene un metro?</p><ol><li>10</li><li>50</li><li>100</li></ol><p class="why">1 metro = 100 centímetros.</p></div>
<div class="q" data-ans="0"><p>¿Qué es más grande?</p><ol><li>Una bacteria</li><li>Un átomo</li><li>Un protón</li></ol><p class="why">Una bacteria tiene millones de átomos. Un átomo es muchísimo más grande que su propio núcleo, y el protón está dentro del núcleo.</p></div>
<div class="q" data-ans="1"><p>¿Por qué usamos las mismas unidades en todo el mundo?</p><ol><li>Porque es más bonito</li><li>Para que todos midamos igual y nos entendamos</li><li>Porque lo mandó un rey</li></ol><p class="why">Así los resultados se pueden comparar sin confusiones.</p></div>
</div>
</template>

<!-- 04-moverse.html -->
<template class="chapter-src" data-id="moverse" data-num="4" data-world="2" data-title="Moverse: rapidez y recorrido" data-short="Qué tan rápido va algo: caracoles, guepardos, trenes y tú.">
<p class="lead">Todo se mueve: tú caminando, las nubes, la Tierra alrededor del Sol. ¿Cómo sabemos qué tan rápido va algo? ¡Con la <strong>rapidez</strong>!</p>

<div class="learn"><ul>
<li>La rapidez dice cuánto avanza algo en cada segundo, o en cada hora.</li>
<li>Rapidez = distancia ÷ tiempo.</li>
<li>Algo puede estar quieto para ti y moverse para otra persona.</li>
</ul></div>

<div class="say" data-who="newti" data-mood="wow"><p>¡Miau! ¡Bienvenido al mundo del movimiento! Yo soy Newti. Me encanta correr, saltar y, sobre todo, caer de pie. Aquí vamos a descubrir por qué se mueven las cosas.</p></div>

<section>
<h2>¿Qué es la rapidez?</h2>
<p>Si caminas 10 metros en 10 segundos, avanzas <strong>1 metro cada segundo</strong>. Esa es tu rapidez: <b>1 metro por segundo</b>, que se escribe 1 m/s. Para sacarla divides lo que recorriste entre el tiempo que tardaste.</p>
<div class="magic" data-name="Fórmula mágica de la rapidez"><big>rapidez = distancia ÷ tiempo</big>Por ejemplo: 100 m en 20 s → 100 ÷ 20 = 5 m/s</div>
<p>En las carreteras se usan los <strong>kilómetros por hora</strong> (km/h). Para pasar de m/s a km/h se multiplica por 3,6. Por ejemplo, 10 m/s son 36 km/h.</p>
<table><tr><th>Quién o qué</th><th>Rapidez aproximada</th></tr>
<tr><td>🐌 Caracol</td><td>0,013 m/s · 0,05 km/h</td></tr>
<tr><td>🐢 Tortuga gigante</td><td>0,3 m/s · 1 km/h</td></tr>
<tr><td>🚶 Persona caminando</td><td>1,4 m/s · 5 km/h</td></tr>
<tr><td>🏃 Niño corriendo</td><td>4 m/s · 14 km/h</td></tr>
<tr><td>🐎 Caballo al galope</td><td>15 m/s · 54 km/h</td></tr>
<tr><td>🐆 Guepardo</td><td>29 m/s · 105 km/h</td></tr>
</table>
<div class="fact"><p>El guepardo es el animal terrestre más veloz, pero solo puede correr tan rápido unos 20 segundos. Después se cansa. ¡Pero el halcón peregrino, cuando se lanza en picada desde el cielo, puede pasar de 300 km/h!</p></div>
<div class="sim" data-sim="carrera-animales" data-title="La gran carrera de animales" data-goal="Corre la carrera en las tres distancias y descubre cuánto tarda cada animal.">
<ul><li>El caracol tarda más de dos horas en 100 metros. ¡Por eso el video va rápido!</li><li>Mira cómo la distancia y el tiempo cambian la carrera.</li></ul>
</div>
<details class="curious"><p>La rapidez de un objeto se puede ver en una gráfica: en el eje horizontal va el tiempo y en el vertical la distancia. Si va a rapidez constante, la gráfica es una línea recta, y mientras más inclinada, más rápido. Cuando la rapidez cambia, la línea se curva. Eso se llama <strong>aceleración</strong>: lo verás en el siguiente capítulo.</p></details>
</section>

<section>
<h2>¡Eres un radar!</h2>
<p>La policía usa radares para saber qué tan rápido pasan los carros. Un radar mide el tiempo que tarda el carro entre dos puntos que están a una distancia conocida, o usa ondas. Tú puedes hacerlo con un cronómetro: ¡aquí tienes un tramo de 50 metros!</p>
<div class="sim" data-sim="radar" data-title="Radar con cronómetro" data-goal="Toca «Iniciar» cuando el carro pase el primer poste y «Parar» cuando pase el segundo. Calcula la rapidez: ¡acércate al valor real!">
<ul><li>Recuerda: rapidez = distancia ÷ tiempo, con 50 m de distancia.</li><li>Si tardó 5 segundos: 50 ÷ 5 = 10 m/s = 36 km/h.</li></ul>
</div>
</section>

<section>
<h2>¿Quieto o en movimiento?</h2>
<p>Imagina que vas sentado en un bus. Para ti, tu mochila está quieta junto a ti. Pero para alguien que esté parado en la calle, ¡tu mochila va moviéndose con el bus! Entonces, ¿quién tiene razón? <strong>Los dos.</strong> El movimiento siempre se mide <em>respecto a algo</em>.</p>
<div class="say" data-who="cosmo" data-mood="think"><p>¡Yo lo sé bien! Mientras tú lees esto, la Tierra gira y viaja alrededor del Sol a unos 30 kilómetros por segundo. ¡Estás en una nave espacial y no te habías dado cuenta!</p></div>
<div class="fact"><p>Cuando dos trenes van a la misma velocidad por vías paralelas, desde la ventana de uno parece que el otro está quieto. Hasta que uno acelera: ¡entonces parece que el tuyo se mueve hacia atrás!</p></div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="¿Qué tan rápido eres?" data-time="15 min" data-level="1">
<ul class="mat"><li>⏱️ Cronómetro (o celular)</li><li>📏 Cinta métrica o 10 pasos largos</li><li>🧂 Dos objetos para marcar (zapatos, botellas)</li><li>🧑‍🤝‍🧑 Un ayudante</li></ul>
<ol class="steps"><li>Marca un tramo de 10 metros en un patio o parque (o mide 10 pasos largos de adulto).</li><li>Tu ayudante cuenta el tiempo mientras caminas el tramo. Anótalo.</li><li>Ahora recorre el tramo corriendo. Anota el tiempo.</li><li>Calcula tus rapideces: 10 ÷ tiempo. Multiplica por 3,6 para saber cuántos km/h.</li></ol>
<p class="predict">¿Cuántas veces más rápido correrás que caminarás?</p>
<p class="result">Caminando se tardan unos 7 segundos (1,4 m/s) y corriendo unos 2,5 a 3 segundos (3,5 a 4 m/s). ¡Corriendo vas casi tres veces más rápido!</p>
<p class="why">La rapidez es la distancia dividida entre el tiempo. Si usas el mismo tramo, mientras menos tiempo tardes, mayor es tu rapidez.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>Si un perro corre 20 metros en 4 segundos, ¿cuál es su rapidez?</p><ol><li>80 m/s</li><li>5 m/s</li><li>24 m/s</li></ol><p class="why">Rapidez = distancia ÷ tiempo = 20 ÷ 4 = 5 m/s.</p></div>
<div class="q" data-ans="2"><p>¿Cuál va más rápido?</p><ol><li>Una tortuga</li><li>Una persona caminando</li><li>Un guepardo</li></ol><p class="why">El guepardo es el campeón de rapidez entre los animales de tierra.</p></div>
<div class="q" data-ans="0"><p>Vas sentado en un bus que se mueve. ¿Tu mochila se mueve?</p><ol><li>Depende de respecto a qué la mires</li><li>Nunca</li><li>Siempre, para todos</li></ol><p class="why">Para ti, que vas en el bus, está quieta. Para alguien en la calle, se mueve con el bus. El movimiento se mide respecto a algo.</p></div>
<div class="q" data-ans="1"><p>¿Qué es más rápido: 10 m/s o 30 km/h?</p><ol><li>30 km/h</li><li>10 m/s</li><li>Son iguales</li></ol><p class="why">10 m/s son 36 km/h, así que son más rápidos que 30 km/h.</p></div>
</div>
</template>

<!-- 05-caer.html -->
<template class="chapter-src" data-id="caer" data-num="5" data-world="2" data-title="Caer y acelerar" data-short="Por qué las cosas caen cada vez más rápido y cómo lanzar al blanco.">
<p class="lead">Suelta una pelota: ¡cae! Pero fíjate bien: al principio va despacio y cada vez más rápido. Cuando la rapidez cambia, los científicos dicen que hay <strong>aceleración</strong>.</p>

<div class="learn"><ul>
<li>Acelerar es cambiar la rapidez: ir más rápido, más lento o cambiar de dirección.</li>
<li>La gravedad hace que todo lo que cae aumente su rapidez 9,8 m/s cada segundo.</li>
<li>En otros mundos la gravedad es distinta.</li>
</ul></div>

<div class="say" data-who="newti" data-mood="happy"><p>Cuando el bus arranca, tú sientes el empujón en la espalda. ¡Eso es acelerar! Y cuando frena también aceleras (¡hacia atrás!).</p></div>

<section>
<h2>La gravedad y la caída</h2>
<p>La <strong>gravedad</strong> es la fuerza con la que la Tierra atrae todo hacia su centro. Por eso las cosas caen. Y cuando algo cae, su rapidez aumenta: después de <b>1 segundo</b> va a 9,8 m/s, después de <b>2 segundos</b> a 19,6 m/s, después de <b>3 segundos</b> a casi 30 m/s. ¡Casi 106 km/h!</p>
<div class="magic" data-name="La gravedad de la Tierra"><big>cada segundo: +9,8 m/s</big>A eso se le llama g = 9,8 m/s²</div>
<p>Y lo más curioso: si no hubiera aire, <em>todo</em> caería igual, sea pesado o liviano. Lo viste en el capítulo 1. Lo comprobó Galileo, y los astronautas lo repitieron en la Luna.</p>
<div class="fact"><p>En la Luna, la gravedad es 6 veces menor que en la Tierra. ¡Un salto en la Luna te llevaría 6 veces más alto! En Júpiter, en cambio, sentirías que pesas más del doble.</p></div>
<div class="sim" data-sim="galeria-caida" data-title="Caída en otros mundos" data-goal="Suelta la pelota en 3 mundos distintos y compara cuánto tarda y qué tan rápido llega.">
<ul><li>Fíjate en los puntitos: están más separados abajo porque la pelota va cada vez más rápido.</li><li>En la Luna no hay aire: ¡la pluma y la pelota llegan juntas!</li></ul>
</div>
<details class="curious"><p>Si una cosa cae desde el reposo durante un tiempo <em>t</em>, su rapidez es v = g·t y la distancia que baja es d = ½·g·t². Por eso, en 2 segundos cae 4 veces más que en 1 segundo: 4,9 m en 1 s y 19,6 m en 2 s. La distancia crece con el <em>cuadrado</em> del tiempo.</p></details>
</section>

<section>
<h2>¡Lanza al blanco!</h2>
<p>Cuando lanzas una pelota hacia adelante, mientras avanza, la gravedad la va bajando. Por eso su camino es una curva: una <strong>parábola</strong>. El ángulo y la rapidez del lanzamiento deciden hasta dónde llega.</p>
<div class="say" data-who="newti" data-mood="wink"><p>¿Sabías que, sin aire, el ángulo de 45° es el que lanza más lejos? ¡Pruébalo en el cañón!</p></div>
<div class="sim" data-sim="canon-blanco" data-title="El cañón de Newti" data-goal="Ajusta el ángulo y la rapidez para dar en el blanco. ¡Acierta 3 veces!">
<ul><li>Con el ángulo de 45° llegas más lejos con la misma rapidez.</li><li>Dos ángulos distintos, como 30° y 60°, caen en el mismo lugar. ¡Pruébalo!</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="La regla que cae: ¿qué tan rápidos son tus reflejos?" data-time="10 min" data-level="1">
<ul class="mat"><li>📏 Una regla de 30 cm</li><li>🧑‍🤝‍🧑 Un ayudante</li></ul>
<ol class="steps"><li>Tu ayudante sostiene la regla por el extremo de 30 cm, con el cero hacia abajo.</li><li>Pon tus dedos abiertos junto al cero, sin tocar la regla.</li><li>Tu ayudante la suelta sin avisar. Tú la atrapas apretando los dedos lo más rápido posible.</li><li>Mira en qué número quedaron tus dedos. Ese es el número de centímetros que cayó. Repite 3 veces.</li></ol>
<p class="predict">¿Cuántos centímetros crees que alcanzará a caer la regla antes de que la atrapes?</p>
<p class="result">Casi todas las personas atrapan la regla entre los 10 y los 20 cm. Tabla: caída de 10 cm = 0,14 s · 15 cm = 0,17 s · 20 cm = 0,20 s · 25 cm = 0,23 s · 30 cm = 0,25 s.</p>
<p class="why">La regla cae cada vez más rápido por la gravedad. Mientras más tarda tu cerebro en mandar la orden a tus dedos, más cae la regla. Así se mide el tiempo de reacción con solo una regla.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>¿Qué quiere decir «acelerar»?</p><ol><li>Solo ir muy rápido</li><li>Cambiar la rapidez</li><li>Estar quieto</li></ol><p class="why">Acelerar es cambiar la rapidez: aumentarla, disminuirla o cambiar la dirección.</p></div>
<div class="q" data-ans="2"><p>Una piedra cae. Después de 2 segundos, ¿qué rapidez lleva (sin aire)?</p><ol><li>9,8 m/s</li><li>2 m/s</li><li>19,6 m/s</li></ol><p class="why">Cada segundo gana 9,8 m/s. En 2 s: 2 × 9,8 = 19,6 m/s.</p></div>
<div class="q" data-ans="0"><p>¿Dónde pesarías menos?</p><ol><li>En la Luna</li><li>En la Tierra</li><li>En Júpiter</li></ol><p class="why">La gravedad de la Luna es 6 veces menor que la de la Tierra.</p></div>
<div class="q" data-ans="1"><p>Con el cañón, sin aire, ¿qué ángulo lanza más lejos?</p><ol><li>10°</li><li>45°</li><li>90°</li></ol><p class="why">El ángulo de 45° llega más lejos. Con 90° la pelota sube y baja derecho, y con 10° casi no se eleva.</p></div>
</div>
</template>

<!-- 06-fuerzas.html -->
<template class="chapter-src" data-id="fuerzas" data-num="6" data-world="2" data-title="Empujones y tirones: las leyes de Newton" data-short="Fuerzas, inercia, por qué un cohete despega y cómo equilibrar a un elefante.">
<p class="lead">Una patada al balón, el viento que mueve las hojas, un imán que atrapa un clip: todo eso son <strong>fuerzas</strong>. Hace unos 340 años, Isaac Newton descubrió tres reglas que explican cómo funcionan. ¡Se llaman las leyes de Newton!</p>

<div class="learn"><ul>
<li>Una fuerza es un empujón o un tirón. Se mide en newtons (N).</li>
<li>Primera ley: las cosas siguen como están (quietas o en movimiento) si nada las empuja. A eso se le llama inercia.</li>
<li>Segunda ley: mientras más fuerza y menos masa, más acelera algo.</li>
<li>Tercera ley: si empujas algo, ese algo te empuja a ti.</li>
</ul></div>

<div class="say" data-who="newti" data-mood="wow"><p>¡Miau! ¡Mi tocayo Newton! Dicen que se llamó «Newti» por él… ¡o quizás yo por él! Bueno, vamos a conocer sus leyes con juegos.</p></div>

<section>
<h2>¿Qué es una fuerza?</h2>
<p>Una fuerza puede <strong>mover</strong> algo que está quieto, <strong>frenarlo</strong>, <strong>cambiar su dirección</strong> o <strong>deformarlo</strong> (como cuando aprietas una esponja). Las fuerzas tienen un <em>tamaño</em> y una <em>dirección</em>. Por eso las dibujamos como flechas: mientras más larga, más fuerte.</p>
<p>La unidad de fuerza es el <dfn data-def="La unidad de fuerza. Una manzana mediana pesa más o menos 1 newton.">newton</dfn> (N). Una manzana mediana pesa más o menos 1 N. Y cuando varias fuerzas empujan una cosa, lo que importa es la <strong>fuerza neta</strong>: la suma de todas, teniendo en cuenta hacia dónde van.</p>
<div class="sim" data-sim="tira-afloja" data-title="Tira y afloja: ¡equilibra al elefante!" data-goal="¿Cuántos niños se necesitan para empatar con el elefante?">
<ul><li>Si las fuerzas son iguales, la cuerda no se mueve: la fuerza neta es cero.</li><li>Si una es mayor, la cuerda se mueve hacia ese lado.</li></ul>
</div>
</section>

<section>
<h2>Primera ley: la inercia</h2>
<div class="magic" data-name="Primera ley de Newton"><big>Todo sigue como está</big>Lo quieto sigue quieto y lo que se mueve sigue moviéndose derecho y con la misma rapidez, hasta que una fuerza lo cambie.</div>
<p>Esa «pereza» de las cosas para cambiar su movimiento se llama <dfn data-def="La tendencia de las cosas a seguir quietas o a seguir moviéndose igual, mientras nada las empuje.">inercia</dfn>. Cuando el bus frena de golpe, tu cuerpo sigue hacia adelante: ¡es la inercia! Por eso se usa el cinturón de seguridad.</p>
<div class="fact"><p>Antes de Galileo y Newton, mucha gente pensaba que hacía falta una fuerza para <em>mantener</em> algo en movimiento. En realidad la fuerza solo sirve para <em>cambiar</em> el movimiento. Si no existiera la fricción, una bola rodaría para siempre.</p></div>
</section>

<section>
<h2>Segunda ley: fuerza, masa y aceleración</h2>
<div class="magic" data-name="Segunda ley de Newton"><big>fuerza = masa × aceleración</big>aceleración = fuerza ÷ masa</div>
<p>La <strong>masa</strong> es la cantidad de materia que tiene algo. Un carrito pesado (mucha masa) es difícil de acelerar. Si lo empujas con el doble de fuerza, acelera el doble. Y si tiene el doble de masa, acelera la mitad.</p>
<div class="sim" data-sim="carrito-fma" data-title="El carrito de Newti" data-goal="Elige una fuerza y una masa para que el carrito llegue a la bandera justo a tiempo.">
<ul><li>Más fuerza, más aceleración. Más masa, menos aceleración.</li><li>Calcula la aceleración: fuerza ÷ masa.</li></ul>
</div>
<details class="curious"><p>Con aceleración constante a, la distancia recorrida desde el reposo es d = ½·a·t². Si quieres llegar a una distancia d en un tiempo t, necesitas a = 2d ÷ t². Por ejemplo, 20 m en 4 s necesita a = 2×20 ÷ 16 = 2,5 m/s², y eso lo da una fuerza de 5 N empujando 2 kg.</p></details>
</section>

<section>
<h2>Tercera ley: acción y reacción</h2>
<div class="magic" data-name="Tercera ley de Newton"><big>Si empujas, te empujan</big>Cuando un cuerpo empuja a otro, el otro lo empuja a él con la misma fuerza y en sentido contrario.</div>
<p>Si estás en patines y empujas una pared, ¡tú sales rodando hacia atrás! Un pez nada empujando el agua hacia atrás. Tú caminas empujando el piso hacia atrás y el piso te empuja a ti hacia adelante. Un cohete expulsa gases hacia abajo y los gases lo empujan hacia arriba.</p>
<div class="sim" data-sim="skate-retroceso" data-title="Lanzar una bola desde un monopatín" data-goal="Lanza la bola para que Newti retroceda a más de 1 m/s.">
<ul><li>Una bola más pesada o más rápida empuja más hacia atrás.</li><li>Newti pesa mucho más que la bola, por eso retrocede más despacio que la bola avanza.</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Cohete de globo" data-time="15 min" data-level="1">
<ul class="mat"><li>🎈 Un globo largo</li><li>🧵 5 metros de hilo o pita</li><li>🥤 Una pajilla</li><li>🩹 Cinta pegante</li><li>🪑 Dos sillas</li></ul>
<ol class="steps"><li>Pasa el hilo por la pajilla y amarra cada extremo del hilo a una silla, bien estirado.</li><li>Infla el globo sin amarrarlo, y sostén la boquilla con los dedos.</li><li>Pega el globo a la pajilla con cinta, de modo que la boquilla apunte hacia una de las sillas.</li><li>Suelta la boquilla. ¡Mira qué pasa!</li></ol>
<p class="predict">¿Hacia dónde crees que irá el globo: hacia donde sale el aire o hacia el lado contrario?</p>
<p class="result">El globo sale disparado por el hilo en dirección contraria al chorro de aire, ¡como un cohete!</p>
<p class="why">El globo empuja el aire hacia atrás y el aire empuja al globo hacia adelante. Es la tercera ley de Newton: acción y reacción. Así funcionan los cohetes de verdad.</p>
</div>
<div class="exp" data-title="La tarjeta y la moneda" data-time="5 min" data-level="1">
<ul class="mat"><li>🥛 Un vaso</li><li>🃏 Una tarjeta o cartulina</li><li>🪙 Una moneda</li></ul>
<ol class="steps"><li>Pon la tarjeta sobre el vaso y la moneda encima de la tarjeta, justo en el centro.</li><li>Da un golpecito rápido y fuerte a la tarjeta con el dedo, hacia un lado.</li><li>Observa qué le pasa a la moneda.</li></ol>
<p class="predict">¿La moneda saldrá volando con la tarjeta o caerá en el vaso?</p>
<p class="result">La tarjeta sale volando y la moneda cae dentro del vaso.</p>
<p class="why">La moneda tiene inercia: tiende a quedarse quieta. La tarjeta sale tan rápido que casi no alcanza a empujarla.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="2"><p>Un auto frena de golpe y tú sigues hacia adelante. ¿Por qué?</p><ol><li>Porque el auto te empuja</li><li>Porque eres liviano</li><li>Por la inercia</li></ol><p class="why">La inercia hace que tu cuerpo siga moviéndose aunque el auto se detenga. ¡Por eso se usa el cinturón!</p></div>
<div class="q" data-ans="1"><p>Si empujas dos carritos con la misma fuerza, ¿cuál acelera más?</p><ol><li>El más pesado</li><li>El más liviano</li><li>Los dos igual</li></ol><p class="why">Aceleración = fuerza ÷ masa. Con menos masa, más aceleración.</p></div>
<div class="q" data-ans="0"><p>¿Cómo vuela un cohete?</p><ol><li>Empuja gases hacia abajo y los gases lo empujan hacia arriba</li><li>Se agarra del aire</li><li>Lo jala la Luna</li></ol><p class="why">Es la tercera ley de Newton. El cohete funciona hasta en el espacio, donde no hay aire.</p></div>
<div class="q" data-ans="2"><p>Si dos equipos tiran con la misma fuerza, ¿qué pasa con la cuerda?</p><ol><li>Va hacia la izquierda</li><li>Va hacia la derecha</li><li>No se mueve</li></ol><p class="why">Las fuerzas se compensan: la fuerza neta es cero y la cuerda queda en equilibrio.</p></div>
</div>
</template>

<!-- 07-friccion.html -->
<template class="chapter-src" data-id="friccion" data-num="7" data-world="2" data-title="La fricción: frenar y agarrar" data-short="Por qué las cosas se detienen, por qué resbalas en el hielo y cómo frena un carro.">
<p class="lead">Si empujas un carrito de juguete por el piso, se detiene solito. ¿Quién lo frena? Una fuerza muy común y muy importante: la <strong>fricción</strong>.</p>

<div class="learn"><ul>
<li>La fricción es una fuerza que aparece cuando dos cosas se rozan y se opone al movimiento.</li>
<li>Depende de qué superficies se tocan: hielo resbala, goma agarra.</li>
<li>Sin fricción no podrías caminar ni frenar un carro.</li>
</ul></div>

<div class="say" data-who="newti" data-mood="happy"><p>Los gatos tenemos almohadillas en las patas para agarrar bien. ¡Eso es fricción a nuestro favor! Con patines, en cambio, resbalas más que cualquiera.</p></div>

<section>
<h2>¿Qué es la fricción?</h2>
<p>Si miras con un microscopio una superficie que parece lisa, verás montañitas y huecos diminutos. Cuando dos superficies se frotan, sus montañitas se enredan y se resisten a deslizar. Esa resistencia es la <dfn data-def="La fuerza que aparece cuando dos superficies se rozan y que se opone al movimiento.">fricción</dfn>.</p>
<ul>
<li><b>Es útil:</b> te permite caminar, agarrar un vaso, frenar una bicicleta y que las llantas no resbalen.</li>
<li><b>Es molesta:</b> desgasta los zapatos, calienta las cosas y gasta energía. Por eso se usa aceite en las máquinas.</li>
</ul>
<div class="fact"><p>Cuando frotas tus manos, se calientan por la fricción. ¡Así los primeros humanos hacían fuego frotando palos!</p></div>
<div class="sim" data-sim="rampa-materiales" data-title="La rampa de los materiales" data-goal="Sube la rampa poco a poco y encuentra el ángulo justo en que el bloque empieza a deslizarse.">
<ul><li>En el hielo el bloque se desliza con casi nada de inclinación.</li><li>En la goma o la lija tienes que inclinar mucho más.</li><li>Mira las flechas: el peso lo jala hacia abajo y la fricción lo sujeta.</li></ul>
</div>
<details class="curious"><p>La fuerza de fricción máxima es proporcional a la fuerza con que las superficies se aprietan: f = μ·N, donde μ (se lee «mu») es el <strong>coeficiente de fricción</strong>. En una rampa, el bloque empieza a deslizar cuando la tangente del ángulo supera a μ. Por ejemplo, para μ = 0,4 el ángulo crítico es unos 22°. Así se puede medir μ con solo una rampa y un transportador.</p></details>
</section>

<section>
<h2>La fricción y la seguridad en la calle</h2>
<p>Cuando un conductor ve un peligro, primero pasa un tiempo de <strong>reacción</strong> (cerca de 1 segundo) en el que el carro sigue a la misma rapidez. Después frena. La distancia de frenado depende mucho de la rapidez: si duplicas la rapidez, ¡frenar cuesta 4 veces más distancia! Y si el piso está mojado, la fricción es menor y se necesita más espacio.</p>
<div class="say" data-who="buho" data-mood="think"><p>Por eso hay límites de velocidad cerca de los colegios y parques. ¡Van de la mano de la física!</p></div>
<div class="sim" data-sim="frenado" data-title="¡Frena antes del cono!" data-goal="Elige la rapidez y el piso. Frena sin chocar con el cono yendo a 40 km/h o más.">
<ul><li>Fíjate: mojado y hielo necesitan mucho más espacio para frenar.</li><li>La distancia total es: reacción + frenado.</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="La rampa y la moneda" data-time="15 min" data-level="2">
<ul class="mat"><li>📖 Un libro grande o una tabla</li><li>🪙 Una moneda</li><li>🧽 Un trozo de tela</li><li>📄 Papel de lija o cartón rugoso</li><li>📚 Otros libros para subir la rampa</li></ul>
<ol class="steps"><li>Apoya el libro como una rampa, con un extremo en el piso y el otro en una pila de libros pequeña.</li><li>Pon la moneda arriba. Si no se desliza, sube un poco la pila.</li><li>Sigue subiendo hasta que la moneda empiece a deslizar. Anota cuántos libros usaste.</li><li>Repite pegando antes la tela y luego la lija sobre la rampa.</li></ol>
<p class="predict">¿Con qué superficie hará falta una rampa más inclinada?</p>
<p class="result">Con la lija (o la tela) hace falta una rampa mucho más inclinada que con el libro liso. ¡Con una superficie mojada y lisa la moneda resbala casi enseguida!</p>
<p class="why">Cada superficie tiene su propia fricción. Cuando la rampa se inclina, el peso jala la moneda hacia abajo, y cuando supera a la fricción, empieza a deslizarse.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="0"><p>¿Qué hace la fricción?</p><ol><li>Se opone al movimiento entre superficies que se rozan</li><li>Hace que las cosas floten</li><li>Hace que todo caiga</li></ol><p class="why">La fricción se opone al deslizamiento y por eso frena las cosas.</p></div>
<div class="q" data-ans="2"><p>¿Sobre cuál superficie resbalas más?</p><ol><li>Goma</li><li>Madera</li><li>Hielo</li></ol><p class="why">El hielo casi no tiene fricción, por eso patinamos tan fácil.</p></div>
<div class="q" data-ans="1"><p>Un carro va al doble de rapidez. ¿Cuánto espacio necesita para frenar (sin contar la reacción)?</p><ol><li>El doble</li><li>Cuatro veces</li><li>La mitad</li></ol><p class="why">La distancia de frenado crece con el cuadrado de la rapidez: el doble de rapidez, cuatro veces más distancia.</p></div>
<div class="q" data-ans="1"><p>¿Por qué se calientan las manos al frotarlas?</p><ol><li>Por la gravedad</li><li>Por la fricción</li><li>Por el aire</li></ol><p class="why">La fricción convierte parte del movimiento en calor.</p></div>
</div>
</template>

<!-- 08-energia.html -->
<template class="chapter-src" data-id="energia" data-num="8" data-world="2" data-title="Energía: la fuerza de hacer cosas" data-short="Montañas rusas, resortes y por qué la energía nunca se pierde.">
<p class="lead">Para correr, para que un carro avance, para que se encienda una luz: todo necesita <strong>energía</strong>. La energía es la capacidad de hacer que las cosas pasen. Y tiene un secreto muy importante: nunca desaparece, ¡solo cambia de forma!</p>

<div class="learn"><ul>
<li>La energía tiene muchas formas: movimiento, altura, calor, luz, electricidad…</li>
<li>Cuando algo sube, gana energía de altura; cuando cae, la convierte en energía de movimiento.</li>
<li>La energía no se crea ni se destruye: se transforma.</li>
</ul></div>

<div class="say" data-who="flamo" data-mood="wow"><p>¡Hola! Soy Flamo y vengo de visita del mundo del calor. La energía es mi tema favorito: yo soy puro calor y luz. Pero la energía está en todas partes, ¡hasta en una montaña rusa!</p></div>

<section>
<h2>Las formas de la energía</h2>
<div class="cols2">
<div class="card"><h4>🏃 Energía de movimiento</h4><p>La tienen las cosas que se mueven: mientras más rápidas y pesadas, más tienen. Se llama <em>cinética</em>.</p></div>
<div class="card"><h4>⛰️ Energía guardada</h4><p>La tiene una piedra arriba de una montaña (energía de altura o <em>potencial</em>), un resorte apretado, una pila o un banano (energía química).</p></div>
<div class="card"><h4>🔥 Calor</h4><p>Las partículas de las cosas se agitan más cuando algo está caliente.</p></div>
<div class="card"><h4>💡 Luz, 🔊 sonido y ⚡ electricidad</h4><p>También son formas de energía. ¡Y se transforman unas en otras!</p></div>
</div>
<div class="sim" data-sim="formas-energia" data-title="¿Qué forma de energía es?" data-goal="Clasifica cada tarjeta. ¡Acierta casi todas!"></div>
<div class="fact"><p>Casi toda la energía de la Tierra viene del Sol. Las plantas la guardan en sus hojas, tú comes plantas (o animales que comieron plantas) y la usas para correr y pensar. ¡Eres una máquina que funciona con luz del Sol guardada!</p></div>
</section>

<section>
<h2>La montaña rusa</h2>
<p>Cuando el carrito sube lentamente por la primera cuesta, gana <strong>energía de altura</strong>. Al bajar, esa energía se convierte en <strong>energía de movimiento</strong>: ¡va cada vez más rápido! Al subir otra colina, el movimiento se convierte otra vez en altura. Por eso ninguna colina puede ser más alta que la primera: ¡no habría energía para subirla!</p>
<div class="magic" data-name="Conservación de la energía"><big>energía total = siempre igual</big>Lo que se pierde en altura se gana en movimiento, y al revés.</div>
<div class="sim" data-sim="montana-rusa" data-title="Construye tu montaña rusa" data-goal="Elige la altura de salida para que el carrito pase la colina más alta y llegue hasta el final.">
<ul><li>Mira las barras de energía mientras baja y sube.</li><li>Activa la fricción: el carrito pierde energía en forma de calor. ¡Necesitarás empezar más arriba!</li></ul>
</div>
<details class="curious"><p>La energía de altura es m·g·h y la de movimiento es ½·m·v². Si no hay fricción, m·g·h₀ = m·g·h + ½·m·v², así que la rapidez en cualquier punto es v = √(2·g·(h₀ − h)). Fíjate que no depende de la masa: ¡un carrito pesado y uno liviano llegan igual de rápido!</p></details>
</section>

<section>
<h2>La energía de un resorte</h2>
<p>Cuando aprietas un resorte, guardas energía en él. Al soltarlo, esa energía se convierte en movimiento y puede lanzar una bola hacia arriba. Mientras más lo aprietes y más duro sea, ¡más alto llega la bola!</p>
<div class="sim" data-sim="resorte-lanzador" data-title="El lanzador de resorte" data-goal="Escoge el resorte y cuánto lo comprimes para que la bola llegue justo a la estrella.">
<ul><li>Resorte más duro o más comprimido: más energía, más altura.</li><li>La altura se mide desde el punto donde la bola sale del resorte.</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="La pelota que rebota" data-time="15 min" data-level="1">
<ul class="mat"><li>⚽ Una pelota de goma o tenis</li><li>📏 Una regla larga o cinta métrica pegada a la pared</li><li>🏀 Otra pelota diferente (opcional)</li></ul>
<ol class="steps"><li>Pega la cinta métrica en la pared, hacia arriba desde el suelo.</li><li>Suelta la pelota desde 100 cm (1 m) y mira hasta qué altura rebota la primera vez. Anótalo.</li><li>Repite 3 veces y saca el promedio.</li><li>Ahora suéltala desde 50 cm. Compara qué fracción de la altura recupera.</li></ol>
<p class="predict">¿La pelota rebotará más alto que desde donde la soltaste?</p>
<p class="result">Nunca rebota más alto. Una pelota de tenis llega a unos 55–60 cm si la sueltas desde 1 m. Cada rebote es más bajo que el anterior.</p>
<p class="why">En cada golpe, parte de la energía se convierte en calor y sonido (¡y se escucha el «toc»!). La energía no se destruye, pero ya no sirve para rebotar más alto.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>Un carrito baja de una colina. ¿Qué pasa con su energía?</p><ol><li>Desaparece</li><li>La energía de altura se convierte en energía de movimiento</li><li>Se multiplica</li></ol><p class="why">Al bajar, la altura se convierte en movimiento. La energía total se conserva.</p></div>
<div class="q" data-ans="0"><p>¿Por qué una montaña rusa no puede tener una segunda colina más alta que la primera?</p><ol><li>No tendría energía suficiente para subirla</li><li>Porque se vería feo</li><li>Por el viento</li></ol><p class="why">La energía de altura inicial no alcanza para subir más arriba.</p></div>
<div class="q" data-ans="2"><p>¿Cuál tiene energía guardada?</p><ol><li>Un carro corriendo</li><li>Una fogata</li><li>Un resorte apretado</li></ol><p class="why">Un resorte apretado guarda energía hasta que se suelta.</p></div>
<div class="q" data-ans="1"><p>La pelota rebota cada vez más bajo porque…</p><ol><li>Se desinfla el aire</li><li>Parte de la energía se vuelve calor y sonido</li><li>La gravedad cambia</li></ol><p class="why">Con cada golpe, un poco de energía se transforma en calor y sonido.</p></div>
</div>
</template>

<!-- 09-maquinas.html -->
<template class="chapter-src" data-id="maquinas" data-num="9" data-world="2" data-title="Máquinas simples: palancas y poleas" data-short="Cómo un balancín, una polea o una rampa te ayudan a levantar cosas pesadas.">
<p class="lead">¿Puede un niño levantar un piano? ¡Con la ayuda de la física, casi! Las <strong>máquinas simples</strong> son inventos muy antiguos que nos permiten hacer el trabajo con menos fuerza. Existen desde hace miles de años y están en todas partes.</p>

<div class="learn"><ul>
<li>Una máquina simple cambia la fuerza o la dirección que necesitas.</li>
<li>Las palancas funcionan por el giro: importa qué tan lejos del centro empujas.</li>
<li>Una polea con varias cuerdas divide el peso entre ellas.</li>
<li>Lo que ahorras en fuerza lo pagas en distancia.</li>
</ul></div>

<div class="say" data-who="newti" data-mood="wink"><p>¿Alguna vez has abierto una lata con una cuchara? ¡Eso es una palanca! ¿Y has usado un sube y baja? ¡También!</p></div>

<section>
<h2>Las máquinas simples</h2>
<div class="cols3">
<div class="card"><div class="big-emoji">⚖️</div><h4>Palanca</h4><p>Una barra que gira sobre un punto: balancín, tijeras, carretilla, abrelatas.</p></div>
<div class="card"><div class="big-emoji">🏗️</div><h4>Polea</h4><p>Una rueda con cuerda: grúas, banderas, pozos.</p></div>
<div class="card"><div class="big-emoji">📐</div><h4>Plano inclinado</h4><p>Una rampa: subir una moto a un camión es más fácil con rampa.</p></div>
<div class="card"><div class="big-emoji">🛞</div><h4>Rueda y eje</h4><p>La rueda reduce la fricción: bicicletas, carros, perillas de puertas.</p></div>
<div class="card"><div class="big-emoji">🪓</div><h4>Cuña</h4><p>Se mete entre dos cosas para separarlas: cuchillos, hachas, clavos.</p></div>
<div class="card"><div class="big-emoji">🔩</div><h4>Tornillo</h4><p>Una rampa enrollada: tornillos, tapas de frascos, gatos de carro.</p></div>
</div>
<div class="story" data-title="«Dadme un punto de apoyo…»"><p>Arquímedes, el sabio de Siracusa, decía que con una palanca suficientemente larga y un punto de apoyo podría mover el mundo. No es del todo cierto en la práctica (¡la palanca tendría que ser larguísima!), pero la idea es correcta: <strong>una palanca larga multiplica tu fuerza</strong>.</p></div>
</section>

<section>
<h2>La palanca y el balancín</h2>
<p>En un balancín (o sube y baja), el punto de apoyo está en el centro. Lo que hace girar el balancín no es solo el peso, sino también <strong>qué tan lejos del centro</strong> está. Un niño liviano sentado muy lejos del centro puede equilibrar a uno más pesado sentado cerca.</p>
<div class="magic" data-name="La regla del balancín"><big>peso × distancia = peso × distancia</big>Cuando son iguales a cada lado, el balancín queda derecho.</div>
<div class="sim" data-sim="balancin" data-title="Equilibra el balancín" data-goal="Pon un peso a cada lado, a distancias distintas, para que el balancín quede derecho.">
<ul><li>Prueba con 40 kg a 1 m y 20 kg a 2 m: ¡quedan equilibrados!</li><li>Un peso más lejos del centro «pesa» más para el balancín.</li></ul>
</div>
<details class="curious"><p>A ese efecto de giro se le llama <strong>torque</strong> o momento de una fuerza: es la fuerza multiplicada por la distancia al punto de giro (τ = F·d). El balancín queda en equilibrio cuando el torque hacia un lado es igual al del otro lado. Lo usan los ingenieros para diseñar grúas, puentes y hasta tu cuerpo funciona así: los músculos y huesos son palancas.</p></details>
</section>

<section>
<h2>Las poleas: dividir el peso</h2>
<p>Una polea fija solo cambia la dirección del tirón (jalar hacia abajo para subir algo). Pero si usas varias cuerdas que sostienen la carga, ¡el peso se reparte! Con 4 cuerdas, cada una sostiene solo la cuarta parte. Pero hay un precio: debes jalar 4 veces más cuerda.</p>
<div class="magic" data-name="Poleas"><big>fuerza = peso ÷ número de cuerdas</big>pero jalas más cuerda: distancia × número de cuerdas</div>
<div class="sim" data-sim="poleas" data-title="Levanta el piano con poleas" data-goal="Newti puede jalar con 250 N. ¡Elige la polea para levantar un piano de 100 kg o más!">
<ul><li>Fíjate: más cuerdas significa menos fuerza, pero más cuerda que jalar.</li><li>El trabajo (fuerza × distancia) es casi el mismo: ¡no hay almuerzo gratis!</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Una balanza con una regla" data-time="15 min" data-level="2">
<ul class="mat"><li>📏 Una regla de 30 cm</li><li>✏️ Un lápiz redondo</li><li>🪙 Monedas iguales (10 o más)</li></ul>
