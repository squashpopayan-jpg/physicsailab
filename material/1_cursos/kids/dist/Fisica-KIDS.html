<details class="curious"><p>Para una fuente que se acerca con rapidez v, la frecuencia que oyes es f′ = f·c/(c − v); cuando se aleja, f′ = f·c/(c + v), con c = 343 m/s. Para una sirena de 700 Hz y una ambulancia a 20 m/s, oyes 743 Hz al acercarse y 661 Hz al alejarse. La astronomía usa el mismo efecto con la luz para saber si las estrellas se acercan o se alejan.</p></details>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="El teléfono de vasos" data-time="15 min" data-level="1">
<ul class="mat"><li>🥤 Dos vasos de plástico o latas</li><li>🧵 5 a 10 metros de hilo o pita</li><li>📍 Una aguja o chinche (¡con adulto!)</li></ul>
<ol class="steps"><li>Haz un agujerito en el fondo de cada vaso (un adulto ayuda) y pasa el hilo por cada uno, con un nudo adentro.</li><li>Cada persona toma un vaso y se aleja hasta que el hilo quede bien tirante.</li><li>Una persona habla en su vaso y la otra pone el suyo en el oído.</li><li>Prueba con el hilo flojo, y después tocándolo con la mano.</li></ol>
<p class="predict">¿Se escuchará con el hilo flojo?</p>
<p class="result">Con el hilo tirante se oye muy bien, aunque susurres. Con el hilo flojo o tocado con los dedos, casi no se oye.</p>
<p class="why">El sonido viaja como vibración por el hilo tirante, que lo lleva mejor que el aire. Si el hilo está flojo o lo tocas, la vibración se corta.</p>
</div>
<div class="exp" data-title="La regla que suena" data-time="10 min" data-level="1">
<ul class="mat"><li>📏 Una regla de plástico o de madera</li><li>🪑 El borde de una mesa</li></ul>
<ol class="steps"><li>Apoya la regla en el borde de la mesa dejando fuera unos 20 cm. Sujétala con una mano.</li><li>Con la otra mano, baja la punta y suéltala: vibra y suena.</li><li>Acorta la parte que sobresale (10 cm, 5 cm) y vuelve a hacerla vibrar.</li></ol>
<p class="predict">¿El sonido será más agudo o más grave cuando la parte libre sea más corta?</p>
<p class="result">Mientras más corta es la parte libre, más rápido vibra y el sonido es más agudo.</p>
<p class="why">Una regla más corta vibra con una frecuencia mayor: más vibraciones por segundo, un tono más agudo.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>¿Qué produce el sonido?</p><ol><li>Algo quieto</li><li>Algo que vibra</li><li>Algo caliente</li></ol><p class="why">Todo sonido nace de una vibración.</p></div>
<div class="q" data-ans="0"><p>Un sonido de frecuencia alta suena…</p><ol><li>Agudo</li><li>Grave</li><li>Fuerte</li></ol><p class="why">Frecuencia alta, tono agudo. Volumen y tono son cosas distintas.</p></div>
<div class="q" data-ans="2"><p>Gritas frente a una montaña y el eco vuelve en 2 segundos. ¿A qué distancia está?</p><ol><li>686 m</li><li>171 m</li><li>343 m</li></ol><p class="why">343 × 2 ÷ 2 = 343 m (el sonido va y vuelve, por eso se divide entre 2).</p></div>
<div class="q" data-ans="1"><p>¿Por qué en el espacio no se escucha el sonido?</p><ol><li>Porque hace mucho frío</li><li>Porque no hay aire (ni materia) que lo lleve</li><li>Porque es de noche</li></ol><p class="why">El sonido necesita materia para viajar: aire, agua o sólidos.</p></div>
</div>
</template>

<!-- 22-musica.html -->
<template class="chapter-src" data-id="musica" data-num="22" data-world="5" data-title="La física de la música" data-short="Notas, cuerdas, flautas de botellas y pulsos: por qué un instrumento suena como suena.">
<p class="lead">La música es física que se disfruta. Cada nota tiene una frecuencia, cada instrumento vibra a su manera, y hasta las cuerdas de una guitarra siguen reglas exactas. ¡Vamos a afinar instrumentos con física!</p>

<div class="learn"><ul>
<li>Cada nota musical es una frecuencia: Do, Re, Mi, Fa, Sol, La, Si.</li>
<li>Una cuerda más corta, más tensa o más delgada suena más aguda.</li>
<li>Una columna de aire más corta suena más aguda.</li>
<li>Cada instrumento tiene su timbre: su «color» de sonido.</li>
</ul></div>

<div class="say" data-who="eco" data-mood="wink"><p>¡Atención, músicos! Hoy soy el director de la orquesta de la física. ¿Listo para afinar? Recuerda tener el sonido activado (🔊).</p></div>

<section>
<h2>Las notas y las octavas</h2>
<p>Una nota musical es una <strong>frecuencia</strong>. La nota «La» que se usa para afinar (la de los diapasones) vibra 440 veces por segundo: 440 Hz. Si doblas la frecuencia (880 Hz) obtienes de nuevo un La, pero más agudo: está <em>una octava</em> arriba. Entre un La y el siguiente caben siete notas: Do, Re, Mi, Fa, Sol, La, Si.</p>
<div class="story" data-title="Pitágoras y las cuerdas"><p>Hace unos 2500 años, en Grecia, Pitágoras (o sus seguidores) descubrió que una cuerda que mide la mitad de largo suena una octava más aguda, y que las cuerdas con longitudes en proporciones sencillas (2:3, 3:4) suenan bien juntas. Fue una de las primeras veces en que se vio que la música y los números están conectados.</p></div>

<h3>Las cuerdas</h3>
<p>En una guitarra o un violín, el sonido sale de una cuerda que vibra. Su frecuencia depende de tres cosas:</p>
<ul><li><b>Largo:</b> más corta, más aguda (por eso los guitarristas presionan el traste).</li><li><b>Tensión:</b> más tensa, más aguda (por eso se aprietan las clavijas para afinar).</li><li><b>Grosor:</b> más gruesa, más grave (por eso los bajos tienen cuerdas gordas).</li></ul>
<div class="sim" data-sim="cuerda-guitarra" data-title="Afina la cuerda" data-goal="Cambia el largo, la tensión o el grosor hasta que la cuerda suene un La (440 Hz). ¡Pulsa para escucharla!">
<ul><li>Acorta la cuerda con la barra: sube la frecuencia.</li><li>Cambia a una cuerda más gruesa y verás que baja.</li></ul>
</div>
<details class="curious"><p>La frecuencia fundamental de una cuerda es f = (1 / 2L)·√(T / μ), donde L es el largo, T la tensión y μ la masa por metro. Además de la fundamental, la cuerda vibra con múltiplos (2f, 3f, 4f…) llamados armónicos. La mezcla de armónicos es lo que le da su timbre a cada instrumento.</p></details>
</section>

<section>
<h2>Los vientos: columnas de aire</h2>
<p>En una flauta, una trompeta o una botella en la que soplas, lo que vibra es el <strong>aire</strong> dentro del tubo. Mientras más corta es la columna de aire, más aguda es la nota. Si le pones agua a una botella, la columna de aire se acorta y el sonido de soplar sube: ¡más agua, más agudo! (Pero si la golpeas con una cuchara, ocurre lo contrario: ¡más agua, más grave!, porque lo que vibra es el vidrio con el agua.)</p>
<div class="sim" data-sim="flauta-botellas" data-title="La flauta de botellas" data-goal="Pon agua en cada botella para afinarla a su nota: Do, Re, Mi, Sol y La.">
<ul><li>Selecciona una botella, mueve el nivel del agua y presiona «Soplar».</li><li>El Do necesita más aire (menos agua) y el La menos aire (más agua).</li></ul>
</div>
</section>

<section>
<h2>Los pulsos: afinando de oído</h2>
<p>Cuando dos notas casi iguales suenan juntas, se oye un «wuaa-wuaa-wuaa» que sube y baja de volumen. Esos son los <dfn data-def="Las subidas y bajadas de volumen que se oyen cuando suenan juntas dos notas de frecuencias muy parecidas.">pulsos</dfn>. Mientras más parecidas son las frecuencias, más lentos son los pulsos. Cuando son exactamente iguales, ¡los pulsos desaparecen! Así afinan los músicos de oído.</p>
<div class="sim" data-sim="pulsos" data-title="Afinación por pulsos" data-goal="Mueve la segunda cuerda hasta que desaparezcan los pulsos: estará afinada con la primera.">
<ul><li>Los pulsos por segundo son la diferencia entre las dos frecuencias.</li><li>Con 440 Hz y 443 Hz oyes 3 pulsos por segundo.</li></ul>
</div>
</section>

<section>
<h2>¿Por qué cada instrumento suena distinto?</h2>
<p>Un violín y una flauta pueden tocar la misma nota, y aun así los reconoces. Esa diferencia se llama <strong>timbre</strong>. Cada instrumento produce, junto con la nota principal, muchas notas más suaves y más agudas llamadas armónicos, en cantidades distintas. Es su «huella digital» sonora. Tu voz también tiene un timbre único: por eso reconoces a tu mamá por teléfono.</p>
<div class="cols3">
<div class="card"><div class="big-emoji">🎻</div><h4>Cuerdas</h4><p>Guitarra, violín, arpa, tiple, cuatro. La cuerda vibra y una caja de madera amplifica el sonido.</p></div>
<div class="card"><div class="big-emoji">🎺</div><h4>Vientos</h4><p>Flauta, quena, trompeta, saxofón. Vibra el aire dentro de un tubo.</p></div>
<div class="card"><div class="big-emoji">🥁</div><h4>Percusión</h4><p>Tambor, marimba, maracas. Vibra una piel o una barra al golpearla.</p></div>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="El xilófono de vasos con agua" data-time="20 min" data-level="1">
<ul class="mat"><li>🥛 Cinco vasos o frascos de vidrio iguales</li><li>💧 Agua</li><li>🥄 Una cuchara de metal</li></ul>
<ol class="steps"><li>Alinea los vasos. Pon en cada uno distinta cantidad de agua: vacío, un cuarto, la mitad, tres cuartos y casi lleno.</li><li>Golpea suavemente cada vaso con la cuchara y escucha el tono.</li><li>Ajusta el agua para formar una escala que suba (Do-Re-Mi…). Intenta tocar una canción sencilla.</li></ol>
<p class="predict">¿El vaso con más agua sonará más agudo o más grave?</p>
<p class="result">El vaso con más agua suena más grave; el vacío suena más agudo.</p>
<p class="why">Con más agua, la masa que vibra es mayor, y lo más pesado vibra más despacio. Pero si soplas sobre la boca de una botella, el tono sube con más agua, porque se acorta la columna de aire.</p>
</div>
<div class="exp" data-title="La guitarra de ligas" data-time="20 min" data-level="1">
<ul class="mat"><li>📦 Una caja de zapatos sin tapa</li><li>➰ 4 ligas de distinto grosor</li><li>✏️ Dos lápices</li></ul>
<ol class="steps"><li>Estira las ligas sobre la caja, a lo ancho del hueco, una al lado de la otra.</li><li>Pon un lápiz debajo de las ligas en cada extremo para que queden elevadas.</li><li>Puntea cada liga y escucha. Después estira una con más fuerza, o presiona un punto con el dedo para acortarla.</li></ol>
<p class="predict">¿Qué liga sonará más aguda: la gruesa o la delgada?</p>
<p class="result">La liga delgada y más tensa suena más aguda. La gruesa suena más grave. Si la acortas con el dedo, sube el tono.</p>
<p class="why">Más delgada, más tensa y más corta significa más vibraciones por segundo: una nota más aguda. Son las mismas reglas de la guitarra.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>Una cuerda se acorta a la mitad. ¿Qué pasa con la nota?</p><ol><li>Suena más grave</li><li>Suena una octava más aguda</li><li>No cambia</li></ol><p class="why">La mitad del largo duplica la frecuencia: una octava más aguda.</p></div>
<div class="q" data-ans="0"><p>Dos notas casi iguales suenan juntas y oyes «wuaa-wuaa». ¿Qué son?</p><ol><li>Pulsos</li><li>Ecos</li><li>Armónicos</li></ol><p class="why">Son pulsos, y desaparecen cuando las frecuencias son iguales.</p></div>
<div class="q" data-ans="2"><p>Soplas sobre una botella y le agregas agua. El sonido…</p><ol><li>Se hace más grave</li><li>No cambia</li><li>Se hace más agudo</li></ol><p class="why">Con más agua la columna de aire es más corta y la nota sube.</p></div>
<div class="q" data-ans="1"><p>¿Por qué un violín y una flauta suenan distinto aunque toquen la misma nota?</p><ol><li>Por el volumen</li><li>Por su timbre (los armónicos que producen)</li><li>Por el tamaño de la sala</li></ol><p class="why">Cada instrumento tiene su mezcla de armónicos: su timbre.</p></div>
</div>
</template>

<!-- 23-sombras.html -->
<template class="chapter-src" data-id="sombras" data-num="23" data-world="6" data-title="La luz y las sombras" data-short="La luz viaja derecho, hace sombras y lo hace todo visible. ¡Hasta una caja con un agujero puede ser una cámara!">
<p class="lead">Gracias a la luz puedes ver este texto, tus amigos y los colores del mundo. ¿Qué es la luz? ¿Por qué hace sombras? ¿Qué tan rápido va? ¡Entremos al mundo de la luz con Lumi, la luciérnaga!</p>

<div class="learn"><ul>
<li>La luz viaja en línea recta y es la cosa más rápida del universo.</li>
<li>Una sombra aparece cuando algo opaco bloquea la luz.</li>
<li>Una caja oscura con un agujerito puede formar imágenes.</li>
</ul></div>

<div class="say" data-who="lumi" data-mood="happy"><p>¡Hola! Soy Lumi, una luciérnaga. Yo produzco mi propia luz por las noches. ¡Es una luz fría, casi sin calor! Cuéntame: ¿has jugado alguna vez a hacer sombras con las manos?</p></div>

<section>
<h2>La luz viaja derecho</h2>
<p>Los objetos que producen su propia luz se llaman <strong>fuentes de luz</strong>: el Sol, una vela, un bombillo, una luciérnaga. Los demás objetos solo los vemos cuando la luz de una fuente <em>rebota</em> en ellos y llega a nuestros ojos. Así vemos la Luna: refleja la luz del Sol.</p>
<p>La luz viaja en <strong>línea recta</strong>. Por eso no puedes ver a alguien que está detrás de una esquina, y por eso cuando algo opaco se interpone, se forma una sombra.</p>
<div class="fact"><p>La luz es lo más rápido que existe: viaja a casi 300 000 kilómetros por segundo. ¡Podría dar 7 vueltas y media a la Tierra en un segundo! Tarda 1,3 s en llegar de la Luna y 8 minutos y 20 segundos en llegar del Sol. Cuando miras al Sol, lo ves como era hace 8 minutos.</p></div>
<h3>Transparente, translúcido y opaco</h3>
<p>Los materiales dejan pasar la luz de distinta manera: los <b>transparentes</b> (vidrio, agua limpia) dejan pasar casi toda la luz y se ve claro a través; los <b>translúcidos</b> (papel encerado, vidrio esmerilado) la dejan pasar pero la desordenan; los <b>opacos</b> (madera, metal, cartón) no la dejan pasar.</p>
<div class="sim" data-sim="materiales-luz" data-title="¿Transparente, translúcido u opaco?" data-goal="Clasifica cada objeto según deje pasar la luz."></div>
</section>

<section>
<h2>Las sombras</h2>
<p>La sombra es la zona donde no llega luz porque un objeto la bloquea. Mientras más cerca está el objeto de la linterna, <strong>más grande</strong> es su sombra; mientras más lejos, más pequeña. Esto se parece a las proyecciones de las manos en la pared: ¡acercas la mano a la linterna y la sombra se hace enorme!</p>
<div class="sim" data-sim="sombras" data-title="El teatro de sombras" data-goal="Mueve el muñeco entre la linterna y la pared para que su sombra mida justo 2 metros (con 10 cm de margen).">
<ul><li>Acerca el muñeco a la linterna: la sombra crece.</li><li>Alejalo: la sombra se reduce. Siempre es más grande que el muñeco, porque la luz se abre como un cono.</li></ul>
</div>
<div class="fact"><p>Un eclipse de Sol es una sombra gigante: la Luna se pone entre el Sol y la Tierra, y su sombra cae sobre una parte de la Tierra. Por un par de minutos, ¡es de noche en pleno día!</p></div>
</section>

<section>
<h2>La cámara oscura</h2>
<p>Si en una caja cerrada y oscura haces un agujerito muy pequeño, la luz de afuera entra por ahí y dibuja en la pared del fondo una imagen del paisaje: ¡<strong>al revés</strong>! Cada punto del objeto manda un rayito por el agujero y cae en un punto distinto de la pared. Es la <dfn data-def="Una caja oscura con un pequeño agujero que forma imágenes invertidas de lo que hay afuera.">cámara oscura</dfn>, el antepasado de las cámaras fotográficas y de tus ojos.</p>
<div class="story" data-title="Ibn al-Haytham y la cámara oscura"><p>Hace unos 1000 años, el sabio Ibn al-Haytham estudió la cámara oscura y explicó que vemos porque la luz que rebota en las cosas entra a nuestro ojo. Su libro de óptica cambió la forma de entender la visión.</p></div>
<div class="sim" data-sim="camara-oscura" data-title="La cámara oscura" data-goal="Consigue una imagen nítida (agujero de 2 mm o menos) y de al menos 8 cm de alto.">
<ul><li>Un agujero grande da una imagen brillante pero borrosa.</li><li>Un agujero pequeñito da una imagen nítida pero tenue.</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Tu propia cámara oscura" data-time="30 min" data-level="2" data-adult="1">
<ul class="mat"><li>📦 Una caja de cartón o un tubo de papas fritas</li><li>🧻 Papel encerado o papel de calco</li><li>🪡 Una aguja (¡con adulto!)</li><li>🍬 Papel aluminio</li><li>🩹 Cinta negra</li></ul>
<ol class="steps"><li>En un extremo del tubo, pega un pedazo de papel encerado (será la pantalla). Tapa el otro extremo con aluminio.</li><li>Con la aguja, un adulto hace un agujerito pequeño en el centro del aluminio.</li><li>Dirige el lado del agujero hacia una ventana luminosa o una lámpara y mira el papel encerado desde atrás, tapándote la cabeza con una tela oscura.</li><li>Prueba acercando y alejando la cámara de la ventana.</li></ol>
<p class="predict">¿Cómo se verá la imagen en el papel?</p>
<p class="result">Aparece una imagen pequeña de la ventana y de lo de afuera, ¡pero al revés! Con la cámara más lejos de la ventana, la imagen se hace más pequeña.</p>
<p class="why">Los rayos de luz viajan en línea recta, se cruzan en el agujero y llegan a puntos invertidos en la pantalla: lo de arriba queda abajo.</p>
</div>
<div class="exp" data-title="Teatro de sombras" data-time="20 min" data-level="1">
<ul class="mat"><li>🔦 Una linterna</li><li>🧻 Una sábana o pared blanca</li><li>✂️ Cartulina negra y palitos</li></ul>
<ol class="steps"><li>Recorta figuras (animales, personajes) de la cartulina y pégalas a un palito.</li><li>Pon la linterna en un lado y la sábana en otro, en un cuarto oscuro.</li><li>Pon la figura entre la linterna y la sábana. Acércala y aléjala de la linterna.</li><li>Cuenta una historia con tus sombras.</li></ol>
<p class="predict">¿Cómo cambia el tamaño de la sombra al acercar la figura a la linterna?</p>
<p class="result">Mientras más cerca de la linterna, más grande y más borrosa es la sombra. Más cerca de la sábana, más pequeña y nítida.</p>
<p class="why">La luz se abre como un cono desde la linterna: ¡por eso la sombra crece cuando el objeto está cerca de la fuente!</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>La luz viaja…</p><ol><li>En círculos</li><li>En línea recta</li><li>En zigzag</li></ol><p class="why">La luz va en línea recta, por eso hace sombras nítidas.</p></div>
<div class="q" data-ans="2"><p>Acercas tu mano a una linterna. La sombra en la pared…</p><ol><li>Se hace más pequeña</li><li>Queda igual</li><li>Se hace más grande</li></ol><p class="why">Mientras más cerca de la fuente, más grande la sombra.</p></div>
<div class="q" data-ans="0"><p>La imagen que forma una cámara oscura es…</p><ol><li>Invertida (al revés)</li><li>Derecha</li><li>De colores cambiados</li></ol><p class="why">Los rayos se cruzan en el agujero y la imagen queda al revés.</p></div>
<div class="q" data-ans="1"><p>¿Cuánto tarda la luz del Sol en llegar a la Tierra?</p><ol><li>1 segundo</li><li>Unos 8 minutos</li><li>1 día</li></ol><p class="why">Unos 8 minutos y 20 segundos.</p></div>
</div>
</template>

<!-- 24-espejos.html -->
<template class="chapter-src" data-id="espejos" data-num="24" data-world="6" data-title="Espejos y reflejos" data-short="Cómo rebota la luz, por qué ves tu reflejo y cómo funcionan los espejos curvos y el periscopio.">
<p class="lead">Cuando te miras en un espejo, ¡ves a alguien igualito a ti, pero al revés de izquierda a derecha! Los espejos son uno de los inventos más antiguos y más útiles de la luz. ¡Aprendamos su regla secreta!</p>

<div class="learn"><ul>
<li>La luz rebota en los espejos con una regla: el ángulo de llegada es igual al de salida.</li>
<li>Un espejo plano forma una imagen virtual detrás del espejo, del mismo tamaño que tú.</li>
<li>Los espejos curvos pueden agrandar, achicar o enfocar la luz.</li>
</ul></div>

<div class="say" data-who="lumi" data-mood="wink"><p>A mí me encantan los espejos: ¡duplican mi luz! Hay uno en cada linterna de bicicleta y en cada faro de carro, para mandar la luz hacia donde se necesita.</p></div>

<section>
<h2>La ley de la reflexión</h2>
<p>Cuando un rayo de luz llega a un espejo, rebota como una pelota contra una pared. El rayo que llega se llama <b>incidente</b> y el que se va, <b>reflejado</b>. La regla es muy sencilla:</p>
<div class="magic" data-name="Ley de la reflexión"><big>ángulo que llega = ángulo que sale</big>Los dos ángulos se miden desde la perpendicular al espejo (la «normal»).</div>
<p>Si te paras a 2 metros frente a un espejo plano, tu imagen parece estar a 2 metros <em>detrás</em> del espejo: ¡a 4 metros de ti! Esa imagen no está realmente ahí: es una imagen <strong>virtual</strong>, que solo se forma en tu cerebro.</p>
<div class="sim" data-sim="laser-espejos" data-title="El laberinto del láser" data-goal="Gira los espejos arrastrándolos para que el rayo láser llegue hasta la diana. ¡Pasa los tres niveles!">
<ul><li>Arrastra la punta de un espejo para girarlo.</li><li>El rayo siempre rebota con el mismo ángulo con que llega.</li><li>En el nivel 3 hay un muro: necesitas varios espejos.</li></ul>
</div>
<div class="fact"><p>Los espejos del telescopio espacial James Webb están hechos de berilio cubierto con una capa finísima de oro: ¡tan lisos que si fueran del tamaño de un país, no tendrían una irregularidad más alta que un dedo! Y se usan para recoger la luz de las galaxias más lejanas.</p></div>
</section>

<section>
<h2>Espejos curvos</h2>
<p>Si el espejo es curvo, los rayos no rebotan todos en la misma dirección y ocurren cosas nuevas:</p>
<ul><li>El espejo <b>cóncavo</b> (como el interior de una cuchara) junta los rayos en un punto llamado <dfn data-def="El punto donde se juntan los rayos que llegan paralelos a un espejo cóncavo.">foco</dfn>. Si te acercas mucho, te ves grande y derecho (el espejo de maquillaje o de afeitar).</li><li>El espejo <b>convexo</b> (como el exterior de una cuchara) abre los rayos: ves una imagen más pequeña pero con un campo de visión amplio. Se usa en los espejos retrovisores y en las esquinas de las tiendas.</li></ul>
<div class="sim" data-sim="espejo-curvo" data-title="El espejo curvo" data-goal="Con el espejo cóncavo, pon el objeto más cerca que el foco para que su imagen se vea grande y derecha.">
<ul><li>El foco está a la mitad del radio de curvatura del espejo.</li><li>Dentro del foco, la imagen es virtual (detrás del espejo), derecha y grande.</li><li>Fuera del foco, la imagen es real e invertida.</li></ul>
</div>
<details class="curious"><p>La ecuación de los espejos relaciona la distancia al objeto d<sub>o</sub>, la distancia a la imagen d<sub>i</sub> y la distancia focal f: 1/f = 1/d<sub>o</sub> + 1/d<sub>i</sub>. El aumento es m = −d<sub>i</sub>/d<sub>o</sub>. Si d<sub>i</sub> es negativa, la imagen es virtual (detrás del espejo). Para un espejo convexo la distancia focal se toma negativa, y la imagen siempre es virtual, derecha y más pequeña.</p></details>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Un periscopio de cartón" data-time="40 min" data-level="2" data-adult="1">
<ul class="mat"><li>🥛 Una caja alargada de leche o de jugo (1 litro)</li><li>🪞 Dos espejos pequeños (o papel aluminio liso pegado en cartón)</li><li>✂️ Tijeras (un adulto corta)</li><li>🩹 Cinta pegante</li></ul>
<ol class="steps"><li>Un adulto corta una ventana cuadrada cerca de la parte de arriba de una cara de la caja y otra cerca de la parte de abajo, en la cara opuesta.</li><li>Dentro de la caja, pega un espejo en cada ventana, inclinados a 45°, de modo que se miren entre sí.</li><li>Cierra la caja. Mira por la ventana de abajo: verás lo que hay arriba, ¡aunque tú estés escondido!</li></ol>
<p class="predict">¿Podrás ver por encima de una pared mirando por tu periscopio?</p>
<p class="result">¡Sí! Puedes ver por encima de una mesa o de una pared, y por las esquinas.</p>
<p class="why">El primer espejo manda la luz hacia abajo y el segundo la manda a tus ojos. Cada espejo gira el rayo 90° gracias a la ley de la reflexión. Los submarinos usan periscopios para ver la superficie.</p>
</div>
<div class="exp" data-title="Escribir como Leonardo" data-time="10 min" data-level="1">
<ul class="mat"><li>📝 Una hoja y un lápiz</li><li>🪞 Un espejo pequeño</li></ul>
<ol class="steps"><li>Escribe tu nombre en una hoja y ponla frente al espejo. ¿Cómo se ve?</li><li>Ahora escribe tu nombre «al revés» (de derecha a izquierda, con las letras invertidas) y míralo en el espejo.</li></ol>
<p class="predict">¿Puedes escribir algo que se lea bien en el espejo?</p>
<p class="result">Si lo escribes al revés, en el espejo se lee perfecto. Leonardo da Vinci escribía así todos sus cuadernos.</p>
<p class="why">Un espejo invierte la izquierda y la derecha (no arriba y abajo). Dos inversiones se anulan: lo escrito al revés se ve bien.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="2"><p>Un rayo llega a un espejo con un ángulo de 30° respecto a la normal. ¿Con qué ángulo sale?</p><ol><li>60°</li><li>90°</li><li>30°</li></ol><p class="why">El ángulo de reflexión es igual al ángulo de incidencia.</p></div>
<div class="q" data-ans="0"><p>Te paras a 2 m de un espejo plano. ¿A qué distancia de ti parece estar tu imagen?</p><ol><li>4 m</li><li>2 m</li><li>1 m</li></ol><p class="why">La imagen parece estar a 2 m detrás del espejo, o sea a 4 m de ti.</p></div>
<div class="q" data-ans="1"><p>¿Qué espejo se usa para maquillarse o afeitarse, porque agranda?</p><ol><li>Convexo</li><li>Cóncavo</li><li>Plano</li></ol><p class="why">El cóncavo, cuando te acercas dentro del foco, da una imagen grande y derecha.</p></div>
<div class="q" data-ans="2"><p>¿Para qué sirve un periscopio?</p><ol><li>Para oír mejor</li><li>Para ver más lejos con un telescopio</li><li>Para ver por encima o alrededor de obstáculos</li></ol><p class="why">Con dos espejos a 45° se desvía la luz para ver sin asomar la cabeza.</p></div>
</div>
</template>

<!-- 25-doblar-luz.html -->
<template class="chapter-src" data-id="doblarluz" data-num="25" data-world="6" data-title="Doblar la luz: lentes y refracción" data-short="Por qué una pajilla se ve «quebrada», cómo funcionan las lupas, las gafas y los telescopios.">
<p class="lead">Mete una pajilla en un vaso de agua: ¡parece quebrada! Mira una moneda en el fondo de una piscina: ¡parece más cerca de la superficie! La luz cambia de dirección cuando pasa de un material a otro. A eso se le llama <strong>refracción</strong>.</p>

<div class="learn"><ul>
<li>La luz se dobla cuando pasa de un material a otro, por ejemplo del aire al agua.</li>
<li>Una lente curva la luz para juntarla (convergente) o para abrirla (divergente).</li>
<li>Los lentes sirven para lupas, gafas, microscopios, cámaras y telescopios.</li>
</ul></div>

<div class="say" data-who="lumi" data-mood="wow"><p>¡La luz también se confunde! Cuando entra al agua va un poquito más lenta y se desvía, como un carrito de juguete que pasa del pavimento a la arena.</p></div>

<section>
<h2>La refracción</h2>
<p>La luz viaja a 300 000 km/s en el vacío (y casi igual en el aire), pero en el agua va más despacio (unos 225 000 km/s) y en el vidrio todavía más. Cuando un rayo entra en otro material en diagonal, un lado del rayo se frena antes que el otro y el rayo se <strong>dobla</strong>. A cuánto se frena la luz en un material se le llama <dfn data-def="Un número que dice cuántas veces más lenta va la luz en un material que en el vacío.">índice de refracción</dfn>.</p>
<table><tr><th>Material</th><th>Índice de refracción</th></tr><tr><td>Aire</td><td>1,00</td></tr><tr><td>Agua</td><td>1,33</td></tr><tr><td>Vidrio</td><td>1,5</td></tr><tr><td>Diamante</td><td>2,4</td></tr></table>
<p>Por eso los objetos dentro del agua parecen estar más cerca de la superficie de lo que realmente están. Los peces, las rocas del fondo de un río… ¡parecen más cerca! Y por eso a los pescadores que usan lanza les cuesta tanto acertar: ¡tienen que apuntar más abajo de donde ven al pez!</p>
<div class="sim" data-sim="pesca-laser" data-title="La pesca con láser y con lanza" data-goal="Apunta el láser y la lanza al pez para acertar con los dos. ¡Cuidado: el pez no está donde lo ves!">
<ul><li>Con el láser: apunta hacia donde VES al pez (el pez fantasma).</li><li>Con la lanza (que no se dobla): apunta hacia donde ESTÁ realmente.</li></ul>
</div>
<details class="curious"><p>La ley de Snell dice que n₁·sen θ₁ = n₂·sen θ₂, donde θ es el ángulo respecto a la perpendicular a la superficie. Al pasar del aire (n = 1) al agua (n = 1,33) el rayo se acerca a la perpendicular. Si la luz intenta salir del agua con un ángulo muy grande (más de unos 49°), no sale: se refleja del todo. Se llama reflexión total y es lo que permite a la fibra óptica llevar internet por cables de vidrio.</p></details>
</section>

<section>
<h2>Las lentes</h2>
<p>Una <strong>lente</strong> es un vidrio con superficies curvas que dobla la luz de una manera especial:</p>
<ul><li>La lente <b>convergente</b> (más gruesa en el centro, como una lupa) junta los rayos en un punto: el foco. Si pones un objeto cerca de ella, ¡se ve agrandado!</li><li>La lente <b>divergente</b> (más delgada en el centro) abre los rayos y hace que las cosas se vean más pequeñas.</li></ul>
<div class="sim" data-sim="lente" data-title="La lupa" data-goal="Con la lente convergente, acerca el objeto dentro del foco para que la imagen sea grande, derecha y virtual: ¡una lupa!">
<ul><li>Dentro del foco: imagen virtual, derecha y grande (lupa).</li><li>Fuera del foco: imagen real e invertida (así funciona un proyector o una cámara).</li></ul>
</div>
<div class="story" data-title="Galileo y su telescopio"><p>En 1609, Galileo oyó que en Holanda alguien había juntado dos lentes y veía más cerca lo lejano. Hizo su propio telescopio, lo apuntó al cielo y vio montañas en la Luna, manchas en el Sol, ¡y cuatro lunitas girando alrededor de Júpiter! Con eso se probó que no todo gira alrededor de la Tierra.</p></div>
</section>

<section>
<h2>Tu ojo: una cámara con lente</h2>
<p>Tu ojo tiene una lente (el cristalino) que enfoca la luz sobre el fondo del ojo, la <strong>retina</strong>, donde hay millones de células que detectan la luz. Si la imagen no cae justo sobre la retina, ves borroso. A veces el ojo es un poquito demasiado largo (<b>miopía</b>: ves borroso de lejos) o un poquito corto (<b>hipermetropía</b>: ves borroso de cerca). Se corrigen con gafas: una lente divergente para el miope y una convergente para el hipermétrope.</p>
<div class="sim" data-sim="ojo-gafas" data-title="El ojo y las gafas" data-goal="Corrige el ojo miope y el ojo hipermétrope con la lente adecuada para que el foco caiga justo en la retina.">
<ul><li>El ojo miope enfoca delante de la retina: necesita una lente que abra un poco los rayos.</li><li>El ojo hipermétrope enfoca detrás de la retina: necesita una lente que los junte más.</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="La moneda que aparece" data-time="10 min" data-level="1">
<ul class="mat"><li>🥣 Un tazón no transparente</li><li>🪙 Una moneda</li><li>💧 Agua</li></ul>
<ol class="steps"><li>Pon la moneda en el fondo del tazón.</li><li>Aléjate hasta que, desde tu posición, el borde del tazón tape justo la moneda: no la ves.</li><li>Sin moverte, pide a un ayudante que eche agua despacio en el tazón.</li></ol>
<p class="predict">Cuando el tazón se llene de agua, ¿seguirás sin ver la moneda?</p>
<p class="result">¡La moneda aparece! Al llenar el tazón con agua, la moneda se ve de nuevo.</p>
<p class="why">Los rayos de luz que vienen de la moneda se doblan al salir del agua y alcanzan a pasar por encima del borde hasta tus ojos. La luz dobló y la moneda parece más arriba.</p>
</div>
<div class="exp" data-title="Una lupa con una gota de agua" data-time="10 min" data-level="1">
<ul class="mat"><li>📰 Un periódico o texto con letras pequeñas</li><li>🧴 Un pedazo de plástico transparente (de una bolsa o botella)</li><li>💧 Agua con un gotero o cuchara</li></ul>
<ol class="steps"><li>Pon el plástico encima de las letras.</li><li>Deja caer una gotita de agua sobre las letras.</li><li>Mira a través de la gota.</li></ol>
<p class="predict">¿Cómo se verán las letras debajo de la gota?</p>
<p class="result">Se ven más grandes, ¡como con una lupa!</p>
<p class="why">La gota es curva como una lente convergente. Si las letras están dentro de su foco, la lente forma una imagen virtual más grande.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>¿Por qué se ve «quebrada» una pajilla en un vaso con agua?</p><ol><li>Porque el agua la dobla</li><li>Porque la luz se dobla (refracta) al pasar del agua al aire</li><li>Porque el vaso es curvo</li></ol><p class="why">La refracción hace que la luz cambie de dirección y que la pajilla se vea desplazada.</p></div>
<div class="q" data-ans="2"><p>Un pescador con lanza ve un pez. ¿Dónde debe apuntar?</p><ol><li>Un poco arriba del pez</li><li>Exactamente donde lo ve</li><li>Un poco más abajo de donde lo ve</li></ol><p class="why">El pez está más profundo de lo que parece. La lanza no se dobla, así que hay que apuntar más abajo.</p></div>
<div class="q" data-ans="0"><p>Una lupa es una lente…</p><ol><li>Convergente</li><li>Divergente</li><li>Plana</li></ol><p class="why">Una lente convergente, más gruesa en el centro, agranda lo que está dentro de su foco.</p></div>
<div class="q" data-ans="1"><p>Una persona miope ve borroso lo…</p><ol><li>Cercano</li><li>Lejano</li><li>Oscuro</li></ol><p class="why">La miopía hace ver borroso de lejos; se corrige con lentes divergentes.</p></div>
</div>
</template>

<!-- 26-colores.html -->
<template class="chapter-src" data-id="colores" data-num="26" data-world="6" data-title="El color: arcoíris y atardeceres" data-short="Por qué hay colores, cómo se forma el arcoíris, por qué el cielo es azul y los atardeceres rojos.">
<p class="lead">La luz del Sol parece blanca, pero guarda un secreto: ¡contiene todos los colores del arcoíris! Y cada color es una onda de luz con su propia longitud. Hoy vamos a separar los colores, mezclarlos y descubrir por qué el cielo es azul.</p>

<div class="learn"><ul>
<li>La luz blanca es la mezcla de todos los colores.</li>
<li>Un prisma o una gota de agua separan los colores: así se forma el arcoíris.</li>
<li>Con luz roja, verde y azul se pueden hacer todos los colores.</li>
<li>El cielo es azul porque el aire dispersa más la luz azul.</li>
</ul></div>

<div class="say" data-who="lumi" data-mood="happy"><p>Mi luz es amarillo-verdosa, ¡pero hoy te voy a enseñar todos los colores! Un truco: de lejos, el arcoíris parece un puente de siete colores, pero en realidad hay una infinidad de tonos.</p></div>

<section>
<h2>Newton y el prisma</h2>
<div class="story" data-title="El experimento de Newton"><p>En 1666, un joven Isaac Newton hizo un agujero en la ventana de su cuarto oscuro y dejó entrar un rayito de sol. Lo hizo pasar por un prisma de vidrio y en la pared apareció un arcoíris. Pero lo más importante: cuando dejó pasar uno solo de esos colores por otro prisma, ¡ya no se separaba más! Concluyó que la luz blanca está hecha de todos los colores, y que el prisma solo los separa.</p></div>
<p>El prisma separa los colores porque la luz de cada color <strong>se dobla un poquito distinto</strong> al entrar en el vidrio: la violeta se dobla más y la roja menos. Eso se llama <dfn data-def="La separación de la luz blanca en sus colores cuando pasa por un prisma o por gotas de agua.">dispersión</dfn>. En el arcoíris las gotas de lluvia hacen de pequeños prismas.</p>
<div class="sim" data-sim="prisma" data-title="El prisma de Newton" data-goal="Manda luz blanca por el prisma y luego luz de un solo color: ¡mira la diferencia!">
<ul><li>Con luz roja o azul sola, el rayo se dobla pero no se separa.</li><li>Cambia el ángulo del rayo y observa cuánto se abre el abanico de colores.</li></ul>
</div>
<div class="fact"><p>Cada color de luz es una onda con distinta longitud: la roja mide unos 700 nanómetros (0,0007 mm) y la violeta unos 400. ¡Más cortas que el grosor de un cabello! Hay luces «más allá» del rojo y del violeta que no vemos: infrarrojo y ultravioleta.</p></div>
</section>

<section>
<h2>Mezclar luces y mezclar pinturas</h2>
<p>Con solo tres luces de colores —<b style="color:#E0001B">roja</b>, <b style="color:#0A9B3F">verde</b> y <b style="color:#1E4FD8">azul</b>— se pueden hacer casi todos los colores. Es lo que hacen las pantallas del celular y de la tele: cada puntito tiene tres lucecitas. Esto se llama <strong>mezcla aditiva</strong>: al sumar luces se llega al blanco.</p>
<ul><li>Rojo + verde = <b>amarillo</b></li><li>Verde + azul = <b>cian</b></li><li>Rojo + azul = <b>magenta</b></li><li>Rojo + verde + azul = <b>blanco</b></li></ul>
<p>Con las pinturas pasa lo contrario: cada pintura <em>absorbe</em> (quita) colores de la luz. Mientras más pinturas mezclas, más luz quitas, y más oscuro queda. Es la <strong>mezcla sustractiva</strong>, por eso mezclar todas las pinturas da un color marrón oscuro.</p>
<div class="sim" data-sim="mezclador-rgb" data-title="El mezclador de luces" data-goal="Mezcla las luces roja, verde y azul para conseguir los tres colores de las tarjetas.">
<ul><li>Ajusta cada luz de 0 a 255.</li><li>Los colores aparecen al sumar luces: amarillo es rojo y verde juntos.</li></ul>
</div>
<details class="curious"><p>Nuestros ojos tienen tres tipos de células sensibles al color, llamadas conos: unos responden más al rojo, otros al verde y otros al azul. El cerebro mezcla sus señales para «inventar» los colores. Por eso con tres luces se engaña al ojo para ver cualquier color. Algunos animales tienen más tipos de conos: las mariposas, por ejemplo, ven colores que nosotros no imaginamos.</p></details>
</section>

<section>
<h2>El cielo azul y los atardeceres rojos</h2>
<p>Si la luz del Sol es blanca, ¿por qué el cielo es azul? Porque el aire está lleno de moléculas diminutas que <strong>dispersan</strong> la luz: la desparraman en todas direcciones. Y dispersan <em>mucho más</em> la luz azul que la roja. Cuando miras al cielo, ves la luz azul del Sol que se desparramó hacia ti desde todos lados.</p>
<p>Al atardecer, el Sol está bajo en el horizonte y su luz atraviesa muchísimo más aire. El azul se dispersa casi todo por el camino y llega solo el naranja y el rojo: ¡por eso los atardeceres son rojizos!</p>
<div class="sim" data-sim="cielo-azul" data-title="El cielo a lo largo del día" data-goal="Baja el Sol hasta el atardecer y súbelo hasta el mediodía para ver cómo cambian los colores.">
<ul><li>Con el Sol alto, su luz atraviesa poco aire y se ve amarillento-blanco.</li><li>Con el Sol casi en el horizonte, su luz atraviesa mucho aire y se ve roja.</li></ul>
</div>
</section>

<section>
<h2>¿Por qué un objeto tiene color?</h2>
<p>Un tomate se ve rojo porque <strong>refleja</strong> la luz roja y <strong>absorbe</strong> los demás colores. Un objeto blanco refleja todos, y uno negro absorbe todos. Si pones un tomate bajo una luz azul, no tiene luz roja para reflejar: ¡se ve casi negro!</p>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Un arcoíris con un vaso de agua" data-time="15 min" data-level="1">
<ul class="mat"><li>🥛 Un vaso transparente con agua (casi lleno)</li><li>📄 Una hoja de papel blanco</li><li>☀️ Una ventana con sol (o una linterna potente en la oscuridad)</li></ul>
<ol class="steps"><li>Pon el vaso al borde de una mesa o ventana donde le dé el Sol.</li><li>Coloca la hoja de papel en el piso, a un lado del vaso, donde caiga la luz que sale por el agua.</li><li>Mueve el vaso o el papel hasta que aparezca una franja de colores.</li></ol>
<p class="predict">¿Se verá algún arcoíris en la hoja?</p>
<p class="result">¡Aparece una franja de colores en el papel! A veces hay que mover el vaso un poco para encontrarla.</p>
<p class="why">El vaso con agua hace de prisma: la luz blanca se dobla al entrar y al salir, y cada color se desvía distinto. Se separan los colores.</p>
</div>
<div class="exp" data-title="Un atardecer en un vaso" data-time="10 min" data-level="1">
<ul class="mat"><li>🥛 Un vaso con agua transparente (casi lleno)</li><li>🥄 Unas gotas de leche</li><li>🔦 Una linterna potente</li></ul>
<ol class="steps"><li>Echa tres o cuatro gotas de leche en el agua y revuelve: debe quedar apenas turbia.</li><li>En una habitación oscura, alumbra con la linterna el vaso desde un lado.</li><li>Mira el vaso desde el lado (el azulado) y luego desde el lado opuesto a la linterna (el anaranjado).</li></ol>
<p class="predict">¿De qué color verás la luz del vaso desde cada lado?</p>
<p class="result">Desde el lado verás una luz azulada, y mirando la linterna a través del vaso, la luz se ve anaranjada o rojiza, ¡como un atardecer!</p>
<p class="why">Las partículas de leche dispersan más la luz azul hacia los lados, y la que atraviesa todo el vaso queda sin azul: naranja. Es lo mismo que pasa en la atmósfera.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="2"><p>La luz blanca está hecha de…</p><ol><li>Solo luz amarilla</li><li>Luz sin color</li><li>Todos los colores mezclados</li></ol><p class="why">Newton demostró que la luz blanca contiene todos los colores del arcoíris.</p></div>
<div class="q" data-ans="1"><p>Mezclas luz roja con luz verde. ¿Qué color te da?</p><ol><li>Azul</li><li>Amarillo</li><li>Marrón</li></ol><p class="why">Rojo + verde = amarillo (mezcla aditiva de luces).</p></div>
<div class="q" data-ans="0"><p>¿Por qué el cielo es azul?</p><ol><li>El aire dispersa más la luz azul que la roja</li><li>Porque refleja el mar</li><li>Porque el Sol es azul</li></ol><p class="why">Las moléculas del aire dispersan mucho más la luz azul, por eso la vemos llegar de todo el cielo.</p></div>
<div class="q" data-ans="1"><p>¿Por qué un tomate se ve rojo?</p><ol><li>Porque absorbe la luz roja</li><li>Porque refleja la luz roja y absorbe las demás</li><li>Porque produce luz roja</li></ol><p class="why">Los objetos tienen el color de la luz que reflejan.</p></div>
</div>
</template>

<!-- 27-cargas.html -->
<template class="chapter-src" data-id="cargas" data-num="27" data-world="7" data-title="Cargas y chispas" data-short="La electricidad estática: globos, rayos, truenos y por qué te da un chispazo al tocar una puerta.">
<p class="lead">Frotas un globo contra tu pelo y se pega a la pared. Te quitas un suéter y se oyen chispitas. Ves un rayo en una tormenta. Todo eso es <strong>electricidad</strong>, que viene de unas partículas diminutas con una propiedad especial: la carga eléctrica.</p>

<div class="learn"><ul>
<li>Hay dos tipos de carga: positiva y negativa.</li>
<li>Cargas iguales se repelen; cargas distintas se atraen.</li>
<li>Al frotar, los electrones pasan de un objeto a otro: así se carga algo.</li>
<li>Un rayo es una gigantesca chispa de electricidad estática.</li>
</ul></div>

<div class="say" data-who="chispa" data-mood="wow"><p>¡¡Hola!! ¡Soy Chispa! Soy pura electricidad: ¡zas, chas, zumbido! Casi todo lo que tiene que ver con la electricidad lo explico yo. ¿Listo para recibir una descarga… de conocimiento?</p></div>

<section>
<h2>Átomos con cargas</h2>
<p>Todo está hecho de átomos. Cada átomo tiene un núcleo con carga <b>positiva (+)</b> y, alrededor, unos electroncitos con carga <b>negativa (−)</b>. Normalmente cada átomo tiene la misma cantidad de las dos, y por eso las cosas son <em>neutras</em>. Pero los electrones se pueden mover. Si frotas dos materiales, algunos electrones pasan de uno al otro: uno queda con exceso de electrones (carga <b>negativa</b>) y el otro con falta (carga <b>positiva</b>).</p>
<div class="magic" data-name="La regla de las cargas"><big>iguales se repelen, distintas se atraen</big>+ con + se rechazan · − con − se rechazan · + con − se atraen</div>
<div class="story" data-title="El ámbar de Tales"><p>Hace 2600 años, el griego Tales de Mileto frotó un trozo de ámbar (resina fósil) con una piel y vio que atraía plumitas y pajas. La palabra griega para ámbar es <em>elektron</em>, y de ahí viene la palabra «electricidad»… ¡y también «electrón»!</p></div>
<div class="sim" data-sim="globo-papelitos" data-title="El globo y los papelitos" data-goal="Frota el globo en el pelo (arrastrándolo adelante y atrás) y atrae al menos 6 papelitos.">
<ul><li>Cuantas más veces frotas, más carga tiene el globo.</li><li>Acerca el globo a los papelitos: se pegan.</li></ul>
</div>
</section>

<section>
<h2>La fuerza entre cargas</h2>
<p>Dos cargas se atraen o se repelen con una fuerza que depende de dos cosas: <b>cuánta carga tienen</b> (más carga, más fuerza) y <b>qué tan lejos están</b> (¡mucho más débil al alejarse! si duplicas la distancia, la fuerza se hace 4 veces menor). Charles Coulomb midió esto en 1785.</p>
<div class="sim" data-sim="cargas-fuerza" data-title="Dos cargas frente a frente" data-goal="Haz que se atraigan, luego que se repelan, y duplica la distancia para ver que la fuerza se reduce a la cuarta parte.">
<ul><li>Cambia el signo de las cargas con los controles.</li><li>La flecha más larga significa más fuerza.</li></ul>
</div>
<details class="curious"><p>La ley de Coulomb dice F = k·q₁·q₂ / r², con k = 9 × 10⁹ N·m²/C². La carga se mide en coulombs (C): un electrón tiene −1,6 × 10⁻¹⁹ C. ¡Un coulomb equivale a 6 mil millones de billones de electrones! La fuerza eléctrica entre un protón y un electrón del átomo es unos 10³⁹ veces mayor que su atracción de gravedad.</p></details>
</section>

<section>
<h2>Rayos y truenos</h2>
<p>En una nube de tormenta, las gotas y los cristales de hielo chocan y se frotan, y la nube se carga: abajo se acumula carga negativa y en el suelo se acumula carga positiva. Cuando la diferencia es enorme, el aire deja de aislar y salta una chispa gigante: el <strong>rayo</strong>. Calienta el aire a unos 30 000 °C (¡cinco veces más caliente que el Sol!), y el aire se expande de golpe: eso es el <strong>trueno</strong>.</p>
<div class="fact"><p>Un rayo puede tener más de 100 millones de voltios y dura menos de una décima de segundo. Colombia es uno de los países donde caen más rayos del mundo: en la zona de Catatumbo, en Venezuela, cerca de nuestra frontera, hay tormentas casi todas las noches.</p></div>
<p>Como la luz viaja casi un millón de veces más rápido que el sonido, ves el rayo antes de oír el trueno. Cuenta los segundos entre los dos: <b>cada 3 segundos son más o menos 1 km</b> de distancia.</p>
<div class="sim" data-sim="tormenta" data-title="¿A qué distancia cayó el rayo?" data-goal="Mide los segundos entre el rayo y el trueno y calcula la distancia. ¡Acércate al 25 %!">
<ul><li>Cuenta mentalmente o mira el cronómetro.</li><li>distancia (km) = segundos ÷ 3</li></ul>
</div>
<div class="warn"><p>Si hay tormenta, métete a una casa o a un carro cerrado. Aléjate de árboles solos, campos abiertos, el agua y los objetos de metal. Si el trueno llega en menos de 30 segundos después del rayo, la tormenta está muy cerca. Los pararrayos protegen los edificios llevando el rayo a la tierra.</p></div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="El globo que atrae papelitos y se pega a la pared" data-time="10 min" data-level="1">
<ul class="mat"><li>🎈 Un globo inflado</li><li>📄 Papelitos picados muy pequeños</li><li>🧣 Un suéter de lana o tu propio pelo limpio y seco</li></ul>
<ol class="steps"><li>Frota el globo contra tu pelo o el suéter durante 20 segundos.</li><li>Acerca el globo (sin tocarlos) a los papelitos sobre la mesa.</li><li>Ahora frota el globo otra vez y ponlo contra la pared.</li></ol>
<p class="predict">¿El globo atraerá los papelitos o los rechazará?</p>
<p class="result">Los papelitos saltan y se pegan al globo. Y el globo se queda pegado a la pared unos minutos.</p>
<p class="why">Al frotarlo, el globo toma electrones del pelo y queda cargado negativamente. Los papelitos, neutros, se «polarizan»: sus cargas se separan un poquito y el lado más cercano al globo tiene carga contraria, que se atrae más de lo que la otra se repele.</p>
</div>
<div class="exp" data-title="El chorrito de agua que se dobla" data-time="10 min" data-level="1">
<ul class="mat"><li>🚰 Una llave de agua que salga en un chorrito fino</li><li>💇 Un peine de plástico</li><li>🧣 Un suéter de lana o tu pelo</li></ul>
<ol class="steps"><li>Abre la llave hasta que salga un chorrito fino y continuo.</li><li>Frota el peine rápidamente contra el pelo seco o el suéter durante unos 30 segundos.</li><li>Acerca el peine al chorro (sin tocarlo).</li></ol>
<p class="predict">¿Qué le pasará al chorro de agua al acercar el peine?</p>
<p class="result">¡El chorro se dobla hacia el peine, sin tocarlo!</p>
<p class="why">El peine cargado atrae a las moléculas de agua, que son polares (tienen un lado un poco positivo y otro un poco negativo), y el chorro se desvía.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>Dos cargas negativas se acercan. ¿Qué pasa?</p><ol><li>Se atraen</li><li>Se repelen</li><li>Nada</li></ol><p class="why">Cargas iguales se repelen.</p></div>
<div class="q" data-ans="2"><p>Al frotar un globo en tu pelo, ¿qué se mueve de un objeto a otro?</p><ol><li>Los protones</li><li>Los átomos enteros</li><li>Los electrones</li></ol><p class="why">Los electrones son los que se mueven y pasan de un material a otro.</p></div>
<div class="q" data-ans="0"><p>Ves un rayo y oyes el trueno 6 segundos después. ¿A qué distancia cayó?</p><ol><li>Unos 2 km</li><li>Unos 6 km</li><li>Unos 20 km</li></ol><p class="why">Cada 3 s son 1 km: 6 ÷ 3 = 2 km.</p></div>
<div class="q" data-ans="1"><p>Al duplicar la distancia entre dos cargas, la fuerza…</p><ol><li>Se reduce a la mitad</li><li>Se reduce a la cuarta parte</li><li>Se duplica</li></ol><p class="why">La fuerza es inversamente proporcional al cuadrado de la distancia: 2² = 4, así que queda la cuarta parte.</p></div>
</div>
</template>

<!-- 28-circuitos.html -->
<template class="chapter-src" data-id="circuitos" data-num="28" data-world="7" data-title="Circuitos: el camino de la electricidad" data-short="Cómo se enciende un bombillo: pila, cables, interruptores y caminos cerrados.">
<p class="lead">Para que se encienda una linterna, la electricidad necesita un camino que empiece y termine en la pila, sin interrupciones. A ese camino se le llama <strong>circuito</strong>. Si se corta en algún punto, ¡todo se apaga!</p>

<div class="learn"><ul>
<li>Un circuito eléctrico es un camino cerrado para la corriente.</li>
<li>Necesita una fuente (pila), un camino de material conductor y algo que usar (un bombillo).</li>
<li>Los materiales conductores dejan pasar la electricidad; los aislantes no.</li>
<li>Los bombillos pueden ir uno tras otro (serie) o en caminos separados (paralelo).</li>
</ul></div>

<div class="say" data-who="chispa" data-mood="happy"><p>¡Soy como un corredor de relevos! Los electrones salen de un lado de la pila, recorren todo el circuito y vuelven a la pila por el otro lado. Si la pista está cortada, ¡no pasa nadie!</p></div>

<section>
<h2>Las partes de un circuito</h2>
<div class="cols2">
<div class="card"><div class="big-emoji">🔋</div><h4>La pila (fuente)</h4><p>Empuja a los electrones por el circuito. Una pila común (tipo AA) da 1,5 voltios.</p></div>
<div class="card"><div class="big-emoji">➖</div><h4>Los cables</h4><p>Son de metal (cobre) por dentro y de plástico por fuera: el metal conduce, y el plástico aísla.</p></div>
<div class="card"><div class="big-emoji">💡</div><h4>El bombillo (carga)</h4><p>Usa la energía: el filamento se pone al rojo vivo y da luz (o un LED, más eficiente).</p></div>
<div class="card"><div class="big-emoji">🔘</div><h4>El interruptor</h4><p>Abre o cierra el camino. Abierto, no pasa nada; cerrado, pasa la corriente.</p></div>
</div>
<p>Los electrones salen del lado negativo de la pila, recorren el camino y regresan por el lado positivo. Los electrones se mueven lentísimo (algo como un milímetro por segundo), pero como todos empujan a la vez, ¡la luz se enciende al instante!</p>
<div class="sim" data-sim="constructor-circuito" data-title="Construye tu circuito" data-goal="Toca los cuadros para cambiar las piezas. Enciende un bombillo en serie y luego, en paralelo, deja uno encendido y el otro apagado.">
<ul><li>Toca cada cuadro para cambiar de pieza: cable, bombillo, interruptor, pila o aislante.</li><li>En serie todo está en un solo camino: si uno se corta, ¡todo se apaga!</li><li>En paralelo hay dos caminos: cada uno se enciende por separado.</li></ul>
</div>
</section>

<section>
<h2>Serie y paralelo</h2>
<ul><li><b>En serie</b>: los bombillos están uno después del otro. Si uno se funde, se apagan todos, y mientras más bombillos, más débil brilla cada uno (como las viejas luces de Navidad).</li><li><b>En paralelo</b>: cada bombillo tiene su propio camino. Si uno se funde, los demás siguen. Así están conectados los bombillos y enchufes de tu casa.</li></ul>
</section>

<section>
<h2>Conductores y aislantes</h2>
<p>Los materiales dejan pasar la electricidad de manera muy distinta. Los <strong>conductores</strong> (como los metales) tienen electrones que se mueven con libertad. Los <strong>aislantes</strong> (como el plástico, la madera seca, el vidrio o la goma) tienen sus electrones muy atados, y no dejan pasar corriente.</p>
<div class="sim" data-sim="conductores" data-title="¿Conduce o aísla?" data-goal="Clasifica cada material: ¿conduce la electricidad o es aislante?"></div>
<div class="warn"><p>El agua común (del grifo) y tu cuerpo conducen la electricidad. Por eso nunca debes tocar enchufes con las manos mojadas, ni meter objetos metálicos en los tomacorrientes. Trabaja solo con pilas pequeñas, nunca con la corriente de la pared.</p></div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="El probador de conductividad" data-time="20 min" data-level="2">
<ul class="mat"><li>🔋 Una pila AA o D (1,5 V)</li><li>💡 Un bombillo de linterna con su casquillo (o un LED con resistencia)</li><li>🔌 Tres cables con pinzas (cocodrilos) o papel aluminio</li><li>🧰 Cosas para probar: moneda, clip, llave, lápiz (mina), cuchara de madera, goma, vidrio, tela, aluminio</li></ul>
<ol class="steps"><li>Conecta un cable del polo + de la pila al bombillo, y otro del bombillo a un cable libre. El tercer cable sale del polo − de la pila.</li><li>Los dos extremos libres son tu «probador»: toca cada extremo con las puntas de lo que quieres probar (los dos puntos del objeto).</li><li>Si el bombillo se enciende, ¡el objeto conduce!</li></ol>
<p class="predict">¿Cuáles objetos crees que encenderán el bombillo?</p>
<p class="result">Encienden: moneda, clip, llave, aluminio y la mina del lápiz (grafito). No encienden: madera, goma, vidrio y tela.</p>
<p class="why">Los metales tienen muchos electrones libres. El grafito también conduce. La madera, el vidrio y la goma no tienen electrones libres: son aislantes.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="2"><p>Para que se encienda un bombillo, el circuito debe estar…</p><ol><li>Abierto</li><li>Roto</li><li>Cerrado</li></ol><p class="why">Debe haber un camino completo, sin interrupciones.</p></div>
<div class="q" data-ans="0"><p>Tres bombillos están en paralelo y uno se funde. ¿Qué pasa con los otros?</p><ol><li>Siguen encendidos</li><li>Se apagan</li><li>Se funden también</li></ol><p class="why">En paralelo, cada bombillo tiene su propio camino.</p></div>
<div class="q" data-ans="1"><p>¿Cuál de estos es un aislante?</p><ol><li>El cobre</li><li>El plástico</li><li>El aluminio</li></ol><p class="why">El plástico no deja pasar la corriente. Por eso los cables están forrados de plástico.</p></div>
<div class="q" data-ans="1"><p>¿Por qué no debes tocar enchufes con las manos mojadas?</p><ol><li>Porque se rompen</li><li>Porque el agua y el cuerpo conducen la electricidad</li><li>Porque se apagan</li></ol><p class="why">El agua y tu cuerpo conducen: la corriente podría pasar por ti.</p></div>
</div>
</template>

<!-- 29-corriente.html -->
<template class="chapter-src" data-id="corriente" data-num="29" data-world="7" data-title="Voltaje, corriente y resistencia" data-short="El «río de electrones»: qué son los voltios, los amperios y los ohmios, y cómo usar la energía con seguridad.">
<p class="lead">Un río necesita una pendiente que lo empuje, un caudal de agua y un cauce más o menos estrecho. La electricidad es parecida: tiene <strong>voltaje</strong> (el empujón), <strong>corriente</strong> (el caudal de electrones) y <strong>resistencia</strong> (qué tan difícil es pasar).</p>

<div class="learn"><ul>
<li>El voltaje (en voltios, V) es el «empujón» que da la pila a los electrones.</li>
<li>La corriente (en amperios, A) es cuántos electrones pasan por segundo.</li>
<li>La resistencia (en ohmios, Ω) es qué tanto frena el paso de la corriente.</li>
<li>Ley de Ohm: corriente = voltaje ÷ resistencia.</li>
</ul></div>

<div class="say" data-who="chispa" data-mood="wink"><p>Imagina una manguera: el voltaje es qué tan alto está el tanque (el empujón del agua), la corriente es cuánta agua sale por segundo, y la resistencia es qué tan delgada es la manguera. ¡Con una manguera más delgada sale menos agua!</p></div>

<section>
<h2>La analogía del río</h2>
<table><tr><th>Electricidad</th><th>Río de agua</th><th>Se mide en…</th></tr>
<tr><td>Voltaje</td><td>La pendiente (qué tan alto cae)</td><td>Voltios (V)</td></tr>
<tr><td>Corriente</td><td>El caudal (litros por segundo)</td><td>Amperios (A)</td></tr>
<tr><td>Resistencia</td><td>Lo angosto y áspero del cauce</td><td>Ohmios (Ω)</td></tr></table>
<div class="magic" data-name="Ley de Ohm"><big>corriente = voltaje ÷ resistencia</big>I = V ÷ R · Una pila de 6 V con un bombillo de 20 Ω da una corriente de 0,3 A.</div>
<div class="story" data-title="Ohm y su ley"><p>En 1827, el alemán Georg Ohm descubrió que, en un alambre, la corriente es proporcional al voltaje. Al principio muchos científicos no le creyeron y hasta lo criticaron. Hoy su ley se usa en todos los aparatos eléctricos del mundo, y la unidad de resistencia lleva su nombre: el ohmio.</p></div>
<div class="sim" data-sim="rio-electrones" data-title="El río de electrones" data-goal="Escoge el voltaje y la resistencia extra para que el bombillo brille al 80–110 % de su brillo normal, ¡sin fundirse!">
<ul><li>Más voltaje, más corriente y más brillo.</li><li>Más resistencia, menos corriente.</li><li>¡Si pasa demasiada corriente, el bombillo se funde!</li></ul>
</div>
</section>

<section>
<h2>Pilas en serie y en paralelo</h2>
<p>Cuando conectas pilas <b>en serie</b> (una tras otra, + con −), sus voltajes se <em>suman</em>: 4 pilas de 1,5 V dan 6 V. Cuando las conectas <b>en paralelo</b> (+ con + y − con −), el voltaje es el mismo que el de una sola, ¡pero duran más tiempo!</p>
<div class="sim" data-sim="pilas" data-title="Armando baterías" data-goal="Enciende el bombillo de 6 V con la combinación correcta de pilas, y luego haz que el de 1,5 V dure lo más posible."></div>
</section>

<section>
<h2>La electricidad en casa y la seguridad</h2>
<p>La electricidad de la pared en Colombia es de unos <b>120 voltios</b>: ¡80 veces más que una pila! Y puede pasar por tu cuerpo, que conduce, con consecuencias muy peligrosas. Por eso las casas tienen <strong>interruptores automáticos</strong> (breakers) que cortan la corriente si pasa más de lo seguro. Cada aparato usa una potencia (en vatios o watts): potencia = voltaje × corriente. Si enchufas muchos aparatos de mucha potencia en el mismo circuito, la corriente total sube y el breaker se «salta» para evitar un incendio.</p>
<div class="sim" data-sim="enchufe" data-title="El enchufe sobrecargado" data-goal="Enchufa aparatos hasta usar entre 1500 y 1800 W sin que se dispare el breaker de 15 A.">
<ul><li>Corriente = potencia ÷ 120 V.</li><li>El breaker de 15 A aguanta como máximo 1800 W.</li></ul>
</div>
<div class="warn"><p>Nunca metas objetos en los enchufes ni juegues con cables. No toques aparatos eléctricos con las manos mojadas ni con los pies en el agua. Si ves un cable caído, aléjate y avisa a un adulto. Solo experimenta con pilas pequeñas, ¡nunca con la corriente de la pared!</p></div>
<details class="curious"><p>El voltio se llama así por Alessandro Volta, que en 1800 inventó la primera pila poniendo discos de cobre y zinc separados por papel mojado en salmuera. Antes, Luigi Galvani había visto que las patas de una rana muerta se movían al tocarlas con metales, y Volta demostró que eso era electricidad producida por los metales. La potencia se mide en vatios por James Watt, el de las máquinas de vapor.</p></details>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="La pila de limón" data-time="30 min" data-level="2">
<ul class="mat"><li>🍋 3 a 4 limones</li><li>🔩 Clavos galvanizados (de zinc) o tornillos</li><li>🪙 Monedas de cobre o trozos de alambre de cobre</li><li>🔌 Cables con pinzas</li><li>💡 Un LED rojo o una calculadora pequeña (o un multímetro)</li></ul>
<ol class="steps"><li>Clava un clavo de zinc y una moneda de cobre en cada limón, sin que se toquen.</li><li>Conecta con los cables la moneda de un limón al clavo del siguiente, formando una cadena (serie).</li><li>Conecta los extremos libres al LED (la pata larga hacia el cobre) o a un multímetro.</li></ol>
<p class="predict">¿Cuánto voltaje crees que dará un limón?</p>
<p class="result">Cada limón da cerca de 0,9 V. Con 3 o 4 limones en serie se alcanza 2,7 a 3,6 V, y un LED rojo puede encender (aunque débil) o con el multímetro mides el voltaje.</p>
<p class="why">El zinc y el cobre, en medio del ácido del limón, producen una reacción química que empuja electrones por los cables. Es una pila química, como la de Volta. En serie, los voltajes se suman.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>Una pila de 6 V se conecta a un bombillo de 20 Ω. ¿Qué corriente pasa?</p><ol><li>120 A</li><li>0,3 A</li><li>26 A</li></ol><p class="why">I = V ÷ R = 6 ÷ 20 = 0,3 A.</p></div>
<div class="q" data-ans="0"><p>Conectas 3 pilas de 1,5 V en serie. ¿Qué voltaje dan?</p><ol><li>4,5 V</li><li>1,5 V</li><li>0,5 V</li></ol><p class="why">En serie los voltajes se suman: 3 × 1,5 = 4,5 V.</p></div>
<div class="q" data-ans="2"><p>¿Por qué se «dispara» el breaker?</p><ol><li>Porque falta electricidad</li><li>Porque se aburrió</li><li>Porque pasa más corriente de la segura</li></ol><p class="why">Corta el circuito cuando la corriente es demasiado alta, para evitar sobrecalentamiento e incendios.</p></div>
<div class="q" data-ans="1"><p>Con más resistencia en un circuito (y el mismo voltaje), la corriente…</p><ol><li>Aumenta</li><li>Disminuye</li><li>No cambia</li></ol><p class="why">I = V ÷ R: más resistencia, menos corriente.</p></div>
</div>
</template>

<!-- 30-imanes.html -->
<template class="chapter-src" data-id="imanes" data-num="30" data-world="7" data-title="Los imanes" data-short="Polos, campos magnéticos, brújulas y por qué la Tierra es un gigantesco imán.">
<p class="lead">Un imán atrae al hierro sin tocarlo. A veces se pegan, a veces se rechazan. Son uno de los misterios más antiguos de la naturaleza: ¡hace más de 2000 años la gente ya jugaba con ellos! Ahora vamos a descubrir sus secretos.</p>

<div class="learn"><ul>
<li>Todo imán tiene dos polos: norte y sur.</li>
<li>Polos distintos se atraen y polos iguales se repelen.</li>
<li>Un imán crea a su alrededor un campo magnético, invisible.</li>
<li>La Tierra entera es un imán gigante: por eso funcionan las brújulas.</li>
</ul></div>

<div class="say" data-who="chispa" data-mood="happy"><p>Mi primo el magnetismo y yo somos inseparables: ¡la electricidad y el magnetismo son hermanos! Pero primero conozcamos al magnetismo solito, con los imanes de siempre.</p></div>

<section>
<h2>Polos: norte y sur</h2>
<p>Todo imán tiene dos extremos con más fuerza, llamados <strong>polos</strong>: uno <b style="color:#E0001B">norte (N)</b> y otro <b style="color:#1E4FD8">sur (S)</b>. Se parecen a las cargas, con una gran diferencia: <b>nunca puedes separar un polo del otro</b>. Si cortas un imán por la mitad, ¡obtienes dos imanes más pequeños, cada uno con su polo norte y su polo sur!</p>
<div class="magic" data-name="La regla de los imanes"><big>polos distintos se atraen</big>N con S se atraen · N con N se rechazan · S con S se rechazan</div>
<div class="sim" data-sim="polos" data-title="Atracción y repulsión" data-goal="Arrastra el imán azul hasta el rojo para ver cómo se atraen, y luego gíralo para que se repelan.">
<ul><li>Arrastra el imán de la derecha con el dedo o el ratón y suéltalo.</li><li>Usa el botón para girar el imán y cambiar de polo.</li></ul>
</div>
<div class="fact"><p>La palabra «magnetismo» viene de Magnesia, una región de Grecia donde se encontraron piedras naturales (magnetita) que atraían el hierro. Los chinos construyeron las primeras brújulas hace más de 1000 años usando una aguja de magnetita.</p></div>
<p>Un imán solo atrae a ciertos materiales: los que tienen hierro, níquel o cobalto. No atrae al aluminio, al cobre, al plástico, al vidrio ni a la madera. Es por eso que puedes sacar un clip de un vaso de agua con un imán por fuera.</p>
</section>

<section>
<h2>El campo magnético</h2>
<p>Alrededor de un imán hay una zona donde sus efectos se sienten: el <dfn data-def="La región alrededor de un imán donde actúan las fuerzas magnéticas. No se ve, pero se puede dibujar con líneas.">campo magnético</dfn>. No lo ves, pero se puede «mostrar» con limaduras de hierro: se acomodan formando líneas curvas que salen del polo norte y entran por el polo sur. También se puede ver con una brújula, que se alinea con el campo.</p>
<div class="sim" data-sim="limaduras" data-title="Las limaduras de hierro y la brújula" data-goal="Arrastra la brújula alrededor del imán y observa cómo siempre apunta a lo largo de las líneas del campo.">
<ul><li>Las limaduras forman las líneas del campo, como en los experimentos de Faraday.</li><li>La punta roja de la brújula apunta hacia el polo sur del imán (el que atrae al norte).</li></ul>
</div>
</section>

<section>
<h2>La Tierra, un imán gigante</h2>
<p>La Tierra se comporta como un enorme imán, causado por el hierro líquido que se mueve dentro de su núcleo. Por eso la aguja de una brújula (un imanito) siempre apunta hacia el norte: su polo «norte» es atraído por el polo magnético que está en el Ártico. (¡Ese polo, en realidad, es un polo sur magnético!)</p>
<div class="story" data-title="La Tierra es un imán"><p>En 1600, el inglés William Gilbert hizo una pequeña «tierra» de magnetita y mostró que una brújula se comportaba sobre ella igual que sobre la Tierra. Concluyó que nuestro planeta es un gran imán. Hoy sabemos que el campo magnético de la Tierra nos protege de las partículas cargadas del Sol (el «viento solar») y crea las auroras boreales.</p></div>
<div class="sim" data-sim="brujula-tierra" data-title="El imán de la Tierra" data-goal="Viaja desde el ecuador hasta el polo y mira cómo se inclina la brújula. ¡Visita tres lugares distintos!">
<ul><li>En el ecuador del imán la brújula está horizontal; en los polos apunta hacia abajo o hacia arriba.</li><li>Este es un modelo simple: la Tierra real tiene un campo más irregular.</li></ul>
</div>
<div class="fact"><p>Muchos animales usan el campo magnético de la Tierra para orientarse: las tortugas marinas, las aves migratorias, las ballenas y hasta algunas bacterias. Tienen en el cuerpo pequeños cristales de magnetita que funcionan como brújulas.</p></div>
<details class="curious"><p>Los polos magnéticos de la Tierra se han invertido muchas veces: el último cambio total ocurrió hace unos 780 000 años. Los científicos lo saben porque las rocas volcánicas guardan «grabada» la dirección del campo magnético cuando se enfriaron. Ahora el polo norte magnético se mueve unos 50 kilómetros por año, desde Canadá hacia Siberia.</p></details>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Una brújula casera con una aguja flotante" data-time="20 min" data-level="2" data-adult="1">
<ul class="mat"><li>🪡 Una aguja de coser (¡con cuidado!)</li><li>🧲 Un imán</li><li>🥣 Un tazón con agua</li><li>🍃 Un trozo de corcho, de hoja o de espuma</li><li>🧭 Una brújula para comparar (opcional)</li></ul>
<ol class="steps"><li>Frota la aguja siempre en el mismo sentido, 30 a 50 veces, contra un solo polo del imán (de la cabeza hacia la punta).</li><li>Pon la aguja sobre el corcho que flota en el agua (sin que el agua esté revuelta).</li><li>Observa hacia dónde apunta la aguja cuando deja de girar. Compárala con una brújula.</li></ol>
<p class="predict">¿Hacia dónde apuntará la aguja?</p>
<p class="result">La aguja gira lentamente y queda apuntando en la dirección norte-sur, ¡igual que una brújula!</p>
<p class="why">Al frotarla con el imán, los pequeños imanes del hierro de la aguja se alinean. Entonces la aguja es un imán débil, y se alinea con el campo magnético de la Tierra.</p>
</div>
<div class="exp" data-title="Limaduras que muestran el campo" data-time="15 min" data-level="1">
<ul class="mat"><li>🧲 Un imán de barra o de nevera</li><li>📄 Una hoja de papel</li><li>🔩 Limaduras de hierro (se pueden hacer raspando una esponjilla de acero con una lima, ¡con cuidado!)</li></ul>
<ol class="steps"><li>Pon el imán sobre la mesa y cubre con la hoja.</li><li>Espolvorea las limaduras sobre el papel, con una mano suave.</li><li>Golpea suavemente el papel por debajo y observa el dibujo.</li></ol>
<p class="predict">¿Las limaduras se repartirán parejas o formarán líneas?</p>
<p class="result">Las limaduras forman líneas curvas que salen de un polo y entran al otro. Se amontonan más cerca de los polos.</p>
<p class="why">Cada limadura se vuelve un imancito pequeño y se alinea con el campo. Así dibuja el campo magnético que antes no veías.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="0"><p>Acercas el polo norte de un imán al polo norte de otro. ¿Qué pasa?</p><ol><li>Se repelen</li><li>Se atraen</li><li>No pasa nada</li></ol><p class="why">Polos iguales se rechazan.</p></div>
<div class="q" data-ans="1"><p>Cortas un imán por la mitad. ¿Qué obtienes?</p><ol><li>Un polo norte y un polo sur separados</li><li>Dos imanes completos, cada uno con sus dos polos</li><li>Dos pedazos sin magnetismo</li></ol><p class="why">No se pueden separar los polos: siempre salen pares.</p></div>
<div class="q" data-ans="2"><p>¿Cuál de estos objetos atrae un imán?</p><ol><li>Una moneda de aluminio</li><li>Un vaso de vidrio</li><li>Un clip de acero</li></ol><p class="why">Los imanes atraen materiales con hierro, níquel o cobalto, como el acero.</p></div>
<div class="q" data-ans="1"><p>¿Por qué una brújula apunta al norte?</p><ol><li>Porque el norte está arriba</li><li>Porque la Tierra es como un gran imán y la aguja se alinea con su campo</li><li>Porque el Sol la atrae</li></ol><p class="why">La aguja imantada se alinea con el campo magnético de la Tierra.</p></div>
</div>
</template>

<!-- 31-electromagnetismo.html -->
<template class="chapter-src" data-id="electromagnetismo" data-num="31" data-world="7" data-title="Electricidad + magnetismo = ¡electromagnetismo!" data-short="Electroimanes, motores, generadores y por qué llega la luz a tu casa desde una central lejana.">
<p class="lead">Durante siglos, la electricidad y el magnetismo parecían dos cosas distintas. Pero en 1820 un profesor danés descubrió algo asombroso: ¡una corriente eléctrica mueve la aguja de una brújula! Eran hermanos. Y de esa familia nacieron los motores, los generadores y casi toda la tecnología moderna.</p>

<div class="learn"><ul>
<li>Una corriente eléctrica crea un campo magnético (electroimán).</li>
<li>Un imán que se mueve cerca de un cable crea corriente (generador).</li>
<li>Con esto funcionan los motores, los parlantes, los trenes de levitación y las centrales eléctricas.</li>
<li>Los transformadores cambian el voltaje para llevar la electricidad lejos con pocas pérdidas.</li>
</ul></div>

<div class="say" data-who="chispa" data-mood="wow"><p>¡Esta es mi parte favorita! Cuando yo, la electricidad, me muevo por un cable… ¡se vuelve magnética! Y cuando el magnetismo se mueve cerca de un cable… ¡me dan ganas de correr! Somos un equipo imparable.</p></div>

<section>
<h2>Oersted y el electroimán</h2>
<div class="story" data-title="La clase de Oersted"><p>En 1820, Hans Christian Oersted daba una clase y, por casualidad, tenía una brújula cerca de un cable. Cuando conectó la corriente, ¡la aguja de la brújula se movió! Era la primera prueba de que una corriente eléctrica produce magnetismo. En pocos meses, André-Marie Ampère y otros desarrollaron la teoría.</p></div>
<p>Si enrollas un cable alrededor de un clavo de hierro y conectas una pila, el clavo se convierte en un <strong>electroimán</strong>: atrae clips como un imán, ¡pero solo mientras pasa corriente! Su fuerza aumenta si le pones más vueltas de cable o más corriente (más pilas). Los electroimanes gigantes levantan carros enteros en los chatarrales.</p>
<div class="sim" data-sim="electroiman" data-title="El electroimán" data-goal="Cambia las vueltas de cable y las pilas para levantar 8 clips o más.">
<ul><li>Más vueltas de cable, más fuerza.</li><li>Más pilas, más corriente, más fuerza (¡y el cable se calienta!).</li></ul>
</div>
</section>

<section>
<h2>Faraday y la inducción</h2>
<p>Once años después, el inglés Michael Faraday descubrió lo contrario: si mueves un imán cerca de una bobina de cable, <strong>aparece corriente eléctrica</strong> en el cable. Se llama <dfn data-def="La aparición de corriente eléctrica en un cable cuando cambia el campo magnético a su alrededor.">inducción electromagnética</dfn>. Mientras más rápido mueves el imán y más vueltas tiene la bobina, más electricidad se genera.</p>
<p>Así funcionan los <b>generadores</b>: una turbina (movida por agua, vapor o viento) hace girar imanes dentro de bobinas de cable, y se genera electricidad. Un <b>motor</b> hace lo contrario: usa la electricidad para hacer girar un eje.</p>
<div class="sim" data-sim="dinamo" data-title="La dínamo de la bicicleta" data-goal="Gira la manivela para que el LED brille con más del 50 %.">
<ul><li>Mientras más rápido giras, más voltaje se genera.</li><li>Más vueltas de bobina, más voltaje.</li><li>El sentido de giro cambia el sentido de la corriente.</li></ul>
</div>
<div class="fact"><p>Más de la mitad de la electricidad de Colombia se genera en centrales hidroeléctricas, donde el agua cae por una tubería y hace girar turbinas que mueven generadores. ¡Cada vez que prendes una luz, estás usando agua de una represa convertida en electricidad!</p></div>
</section>

<section>
<h2>Del generador a tu casa</h2>
<p>La electricidad se genera lejos y hay que transportarla por cables largos. Pero los cables se calientan y pierden energía: la pérdida depende de la <em>corriente</em> al cuadrado. La solución: subir el voltaje con un <strong>transformador</strong>. Con voltaje muy alto, la misma potencia viaja con muy poca corriente y casi no se pierde. Al llegar a tu barrio, otro transformador baja el voltaje a 120 V para que sea seguro.</p>
<div class="sim" data-sim="red-electrica" data-title="La línea de alta tensión" data-goal="Escoge el voltaje de la línea para que se pierda menos del 5 % de la energía en el camino.">
<ul><li>Con voltaje bajo, la corriente es enorme y el cable se calienta mucho.</li><li>Por eso las líneas de transmisión de larga distancia usan decenas de miles de voltios.</li></ul>
</div>
<details class="curious"><p>El transformador funciona porque la corriente alterna cambia de dirección 60 veces por segundo en Colombia (60 Hz), y eso hace que el campo magnético en el hierro del transformador cambie, induciendo voltaje en la otra bobina. La relación de voltajes es la misma que la de las vueltas de cada bobina: V₂/V₁ = N₂/N₁. Un transformador no crea energía: si sube el voltaje, baja la corriente.</p></details>
</section>

<section>
<h2>Maxwell y la luz</h2>
<p>En 1865, el escocés James Clerk Maxwell reunió todo en unas pocas ecuaciones y descubrió algo asombroso: un campo eléctrico que cambia crea un campo magnético, y uno magnético que cambia crea uno eléctrico, ¡y así se pueden empujar mutuamente y viajar por el espacio! Calculó su velocidad y resultó ser la misma de la luz. ¡La luz es una onda electromagnética! Veremos más sobre eso en el siguiente capítulo.</p>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="El electroimán de clavo" data-time="20 min" data-level="2" data-adult="1">
<ul class="mat"><li>🔩 Un clavo grande de hierro (o un tornillo largo de hierro)</li><li>🔌 1 m de alambre de cobre esmaltado delgado (de un motor viejo o electrónica)</li><li>🔋 Una o dos pilas AA (1,5 V) con su soporte</li><li>📎 Clips de metal</li></ul>
<ol class="steps"><li>Enrolla el alambre al clavo, unas 30 vueltas, todas en el mismo sentido, dejando las puntas libres.</li><li>Un adulto ayuda a quitar el esmalte de las puntas con papel de lija.</li><li>Conecta las puntas a la pila. Acerca la punta del clavo a los clips.</li><li>Desconecta la pila y mira qué pasa. Prueba con más vueltas.</li></ol>
<p class="warn">El alambre y la pila pueden calentarse. No dejes el circuito conectado más de unos segundos.</p>
<p class="predict">¿El clavo atraerá los clips cuando desconectes la pila?</p>
<p class="result">Con la pila conectada, el clavo atrae varios clips. Al desconectar, ¡los clips se caen! Con más vueltas, atrae más clips.</p>
<p class="why">La corriente en el alambre crea un campo magnético, y el hierro del clavo lo refuerza. Sin corriente, no hay campo: ¡un imán que se prende y se apaga!</p>
</div>
<div class="exp" data-title="Un cable que mueve una brújula" data-time="10 min" data-level="2" data-adult="1">
<ul class="mat"><li>🧭 Una brújula</li><li>🔌 Un cable largo</li><li>🔋 Una pila AA</li></ul>
<ol class="steps"><li>Pon la brújula sobre la mesa y espera a que apunte al norte.</li><li>Coloca el cable paralelo a la aguja de la brújula, justo encima.</li><li>Toca por un instante (1 segundo) los extremos del cable con los polos de la pila y mira la aguja. Vuelve a separar.</li></ol>
<p class="warn">No dejes el cable conectado: se calienta y la pila se gasta muy rápido.</p>
<p class="predict">¿La aguja de la brújula se moverá cuando pase la corriente?</p>
<p class="result">¡Sí! La aguja se desvía un poco cuando pasa la corriente y vuelve cuando desconectas.</p>
<p class="why">Es el experimento de Oersted: la corriente crea un campo magnético alrededor del cable, y la aguja se alinea con él.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>¿Qué es un electroimán?</p><ol><li>Un imán que no necesita nada</li><li>Un imán creado por una corriente eléctrica</li><li>Un imán muy grande</li></ol><p class="why">Un cable con corriente crea un campo magnético; enrollado en un hierro, forma un electroimán.</p></div>
<div class="q" data-ans="2"><p>Mueves un imán dentro de una bobina de cable. ¿Qué aparece en el cable?</p><ol><li>Luz</li><li>Calor solamente</li><li>Una corriente eléctrica</li></ol><p class="why">Es la inducción electromagnética que descubrió Faraday.</p></div>
<div class="q" data-ans="0"><p>¿Por qué se transmite la electricidad a voltajes muy altos?</p><ol><li>Para que la corriente sea pequeña y se pierda menos energía</li><li>Para que llegue más rápido</li><li>Para que se vea bonito</li></ol><p class="why">Con voltaje alto la corriente es baja y se pierde menos energía en el calentamiento de los cables.</p></div>
<div class="q" data-ans="1"><p>La luz es…</p><ol><li>Una corriente de agua</li><li>Una onda electromagnética</li><li>Una partícula de aire</li></ol><p class="why">Maxwell mostró que la luz es una onda de campos eléctricos y magnéticos.</p></div>
</div>
</template>

<!-- 32-luz-invisible.html -->
<template class="chapter-src" data-id="luzinvisible" data-num="32" data-world="7" data-title="La luz invisible: el espectro electromagnético" data-short="Ondas de radio, microondas, infrarrojo, ultravioleta, rayos X y gamma: la misma familia que la luz, ¡pero invisible!">
