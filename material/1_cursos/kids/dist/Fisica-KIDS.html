<ol class="steps"><li>Pon el lápiz en el suelo y apoya la regla sobre él, justo en la marca de 15 cm: ¡queda como un balancín!</li><li>Pon 2 monedas apiladas a 5 cm del centro, a la izquierda.</li><li>Pon monedas a la derecha hasta lograr el equilibrio, a 5 cm del centro. ¿Cuántas hacen falta?</li><li>Ahora pon las monedas de la derecha a 10 cm del centro. ¿Cuántas hacen falta?</li></ol>
<p class="predict">Si pones las monedas al doble de distancia, ¿cuántas necesitas?</p>
<p class="result">A 5 cm necesitas 2 monedas (igual que a la izquierda); a 10 cm necesitas solo 1 moneda. ¡Al doble de distancia, la mitad de peso!</p>
<p class="why">Lo que equilibra es peso × distancia: 2 × 5 = 10 y 1 × 10 = 10. Así funcionan las balanzas antiguas y las palancas.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>Un niño liviano se sienta lejos del centro de un balancín. Otro más pesado, cerca del centro. ¿Puede quedar equilibrado?</p><ol><li>Nunca</li><li>Sí, si el peso × la distancia es igual a cada lado</li><li>Solo si pesan lo mismo</li></ol><p class="why">Lo importante es el peso multiplicado por la distancia al centro.</p></div>
<div class="q" data-ans="2"><p>Una polea con 4 cuerdas sostiene una carga de 400 N. ¿Qué fuerza debes hacer?</p><ol><li>400 N</li><li>200 N</li><li>100 N</li></ol><p class="why">400 ÷ 4 = 100 N. Pero tienes que jalar 4 veces más cuerda.</p></div>
<div class="q" data-ans="0"><p>¿Cuál de estas cosas es una palanca?</p><ol><li>Unas tijeras</li><li>Un globo</li><li>Un vaso</li></ol><p class="why">Las tijeras son dos palancas unidas por el tornillo del centro.</p></div>
<div class="q" data-ans="1"><p>¿Qué se paga cuando una máquina simple reduce la fuerza?</p><ol><li>Nada: es gratis</li><li>Se recorre más distancia</li><li>Se pierde la masa</li></ol><p class="why">Ahorras fuerza pero debes mover más distancia: el trabajo casi no cambia.</p></div>
</div>
</template>

<!-- 10-girar.html -->
<template class="chapter-src" data-id="girar" data-num="10" data-world="2" data-title="Girar y girar" data-short="Patinadoras, hondas, trompos y por qué no sales volando en una curva.">
<p class="lead">La Tierra gira, las ruedas giran, los trompos giran y los bailarines también. ¡Todo gira! Y girar tiene reglas muy curiosas.</p>

<div class="learn"><ul>
<li>Algo que gira necesita una fuerza que lo jale hacia el centro.</li>
<li>Si esa fuerza desaparece, la cosa sale disparada en línea recta.</li>
<li>Si una patinadora encoge los brazos, gira más rápido.</li>
</ul></div>

<div class="say" data-who="newti" data-mood="wow"><p>¡Cuando voy en un carro y toma una curva, siento que me voy hacia afuera! ¿Por qué? Hoy lo descubrimos.</p></div>

<section>
<h2>Girar en círculo</h2>
<p>Para que algo se mueva en círculo, algo tiene que <strong>jalarlo hacia el centro</strong> todo el tiempo. Cuando haces girar una piedra amarrada a una cuerda, la cuerda tira de la piedra hacia tu mano. A esa fuerza se le llama <dfn data-def="La fuerza que jala hacia el centro de un círculo a lo que está girando.">fuerza centrípeta</dfn>, que significa «que busca el centro».</p>
<p>Si sueltas la cuerda, la piedra no sigue el círculo: sale <strong>en línea recta</strong>, tangente al círculo, como lo manda la primera ley de Newton. ¡Por eso en una curva sientes que el cuerpo «se va hacia afuera»: tu cuerpo quiere seguir derecho!</p>
<div class="story" data-title="David y la honda"><p>Hace miles de años, los pastores usaban hondas para lanzar piedras: giraban la piedra sobre su cabeza y la soltaban en el momento justo. Una historia muy antigua cuenta que así el joven David venció a un gigante. Hay que soltarla justo cuando la piedra apunta hacia el blanco. ¡Prueba tu puntería!</p></div>
<div class="sim" data-sim="honda" data-title="La honda" data-goal="Suelta la piedra en el momento justo para dar en el blanco. ¡Acierta 3 veces!">
<ul><li>Activa «Mostrar la dirección» para ver hacia dónde saldría la piedra si la sueltas ahora.</li><li>La piedra sale siempre en línea recta, tangente al círculo.</li></ul>
</div>
</section>

<section>
<h2>La patinadora que gira</h2>
<p>¿Has visto a una patinadora girar con los brazos abiertos y luego encogerlos? ¡Empieza a girar muchísimo más rápido! Esto pasa porque en la naturaleza se conserva algo que se llama <strong>momento angular</strong>: si algo gira y nada lo empuja, su «cantidad de giro» no cambia. Si las masas están cerca del centro, tiene que girar más rápido.</p>
<div class="magic" data-name="Una regla de las patinadoras"><big>brazos cerca = giro rápido</big>Brazos lejos = giro lento</div>
<div class="sim" data-sim="patinadora" data-title="La patinadora" data-goal="Encoge los brazos hasta girar a más de 1 vuelta por segundo.">
<ul><li>Prueba con pesas en las manos: el efecto es todavía mayor.</li><li>Los gatos usan algo parecido para caer siempre de pie: ¡giran su cuerpo en el aire!</li></ul>
</div>
<div class="fact"><p>Un gato que cae boca arriba se gira en el aire en menos de un segundo, sin tocar nada. Mueve las patas y la cola para cambiar cómo gira cada parte del cuerpo. ¡Es física pura!</p></div>
</section>

<section>
<h2>Trompos y la Tierra</h2>
<p>Un trompo parado se cae, pero uno que gira rápido se mantiene derecho. También por la conservación del giro: es difícil cambiar la dirección de algo que gira rápido. Por eso una bicicleta en movimiento es más fácil de equilibrar que una quieta, y por eso la Tierra mantiene su eje inclinado apuntando casi siempre a la misma estrella (la Estrella Polar).</p>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="La silla giratoria" data-time="10 min" data-level="2" data-adult="1">
<ul class="mat"><li>🪑 Una silla giratoria</li><li>💧 Dos botellas pequeñas con agua (o dos libros)</li><li>🧑‍🤝‍🧑 Un adulto cerca</li></ul>
<p class="warn">Siéntate bien, empieza girando despacio y detente si te mareas. Pon la silla lejos de muebles y paredes.</p>
<ol class="steps"><li>Siéntate en la silla giratoria con una botella en cada mano. Tu ayudante te da un empujón suave para que gires despacio.</li><li>Con los brazos bien abiertos, mira a qué rapidez giras.</li><li>Ahora junta las botellas contra el pecho. ¿Qué pasa?</li><li>Vuelve a abrir los brazos.</li></ol>
<p class="predict">Al encoger los brazos, ¿girarás más rápido o más despacio?</p>
<p class="result">¡Más rápido! Y al abrir los brazos otra vez, giras más despacio.</p>
<p class="why">Como no hay nadie empujándote, tu «cantidad de giro» se conserva. Si la masa de las botellas queda cerca del centro, tienes que girar más rápido para mantenerla. Es lo mismo que hace la patinadora.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>Giras una piedra atada a una cuerda y la sueltas. ¿Hacia dónde sale?</p><ol><li>Hacia el centro</li><li>En línea recta, tangente al círculo</li><li>Sigue girando</li></ol><p class="why">Sin la cuerda, no hay nada que la jale hacia el centro. Sigue derecho, como dice la primera ley de Newton.</p></div>
<div class="q" data-ans="0"><p>Una patinadora encoge los brazos mientras gira. ¿Qué pasa?</p><ol><li>Gira más rápido</li><li>Gira más despacio</li><li>Se detiene</li></ol><p class="why">Al acercar la masa al centro, el giro se acelera para conservar el momento angular.</p></div>
<div class="q" data-ans="2"><p>¿Qué fuerza mantiene a un carrusel girando en círculo?</p><ol><li>Una que lo empuja hacia afuera</li><li>Ninguna</li><li>Una que lo jala hacia el centro</li></ol><p class="why">Hace falta una fuerza hacia el centro (la centrípeta). Lo que sientes «hacia afuera» es la inercia de tu cuerpo.</p></div>
<div class="q" data-ans="1"><p>¿Por qué un trompo que gira rápido no se cae?</p><ol><li>Porque es mágico</li><li>Porque es difícil cambiar la dirección de lo que gira rápido</li><li>Porque pesa mucho</li></ol><p class="why">Cuando algo gira rápido, mantiene la dirección de su eje de giro.</p></div>
</div>
</template>

<!-- 11-choques.html -->
<template class="chapter-src" data-id="choques" data-num="11" data-world="2" data-title="Choques y rebotes" data-short="Bolas de billar, cuna de Newton, cinturones y cascos: qué pasa cuando las cosas chocan.">
<p class="lead">Una bola de billar golpea a otra, dos carros chocan, una pelota rebota en la pared. En todos los choques se cumple una regla maravillosa: <strong>se conserva el movimiento total</strong>.</p>

<div class="learn"><ul>
<li>Cuando dos cosas chocan, se reparten el movimiento, pero el total no cambia.</li>
<li>Si dos bolas iguales chocan de frente, la que va se detiene y la otra sale.</li>
<li>Los cascos y los airbags alargan el tiempo del choque para que duela menos.</li>
</ul></div>

<div class="say" data-who="newti" data-mood="happy"><p>Cuando juegas a las canicas y una golpea a otra, ¡eso es física! A la cantidad de movimiento le llamamos «momento lineal»… ¡pero tú le puedes decir «el empuje del movimiento»!</p></div>

<section>
<h2>Choques entre bolas</h2>
<p>El «empuje del movimiento» de algo depende de dos cosas: su <strong>masa</strong> y su <strong>rapidez</strong>. Un camión lento puede ser más difícil de detener que una bicicleta rápida. En física se llama <dfn data-def="La masa de algo multiplicada por su rapidez. Mide qué tan difícil es detenerlo.">momento lineal</dfn>: masa × rapidez.</p>
<div class="magic" data-name="Conservación del momento"><big>antes del choque = después del choque</big>El momento total de las bolas no cambia, solo se reparte.</div>
<p>Hay dos tipos de choque: el <strong>elástico</strong>, en el que las bolas rebotan (como las de billar), y el <strong>pegajoso</strong> o inelástico, en el que se quedan unidas (como cuando un carro choca con otro y se enredan).</p>
<div class="sim" data-sim="billar" data-title="El billar de Newti" data-goal="Haz que la bola azul (la que llega) se detenga completamente después del choque.">
<ul><li>Con bolas iguales y choque elástico, la que llega se queda quieta y la otra sale con toda la rapidez.</li><li>Prueba con una bola muy pesada golpeando a una liviana.</li></ul>
</div>
<details class="curious"><p>En un choque elástico se conserva el momento y también la energía de movimiento. Las fórmulas para la bola que llega (masa m₁, rapidez v) y la que espera (masa m₂) dan: rapidez final 1 = (m₁ − m₂)/(m₁ + m₂)·v y rapidez final 2 = 2m₁/(m₁ + m₂)·v. En el choque pegajoso, ambas salen juntas con v′ = m₁·v/(m₁ + m₂).</p></details>
</section>

<section>
<h2>La cuna de Newton</h2>
<p>¿Has visto ese juguete con bolitas de metal colgadas? Si levantas una y la sueltas, sale <em>una</em> en el otro extremo. Si levantas dos, salen <em>dos</em>. ¡Parece magia! Es la conservación del momento y de la energía, bola por bola.</p>
<div class="sim" data-sim="cuna-newton" data-title="La cuna de Newton" data-goal="Predice cuántas bolas saldrán por el otro lado y mira si acertaste.">
<ul><li>Cambia cuántas bolas levantas y mira cuántas salen.</li><li>Cada choque pasa el movimiento de bola en bola, casi sin pérdidas.</li></ul>
</div>
</section>

<section>
<h2>Choques suaves: cascos y airbags</h2>
<p>Cuando algo se detiene, el empujón que sufre depende de <strong>cuánto tiempo</strong> dura el choque. Si te detienes muy rápido, el golpe es muy fuerte. Si el choque dura más, el golpe es mucho menos fuerte. Por eso se doblan las rodillas al caer de un salto, por eso los cascos tienen espuma, ¡y por eso existen los airbags!</p>
<div class="say" data-who="buho" data-mood="think"><p>Es como atrapar una pelota: si dejas que tus manos vayan hacia atrás mientras la atrapas, ¡no duele!</p></div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Canicas en fila" data-time="10 min" data-level="1">
<ul class="mat"><li>🔮 4 canicas iguales (o monedas)</li><li>📏 Una regla con surco, o dos reglas pegadas formando un riel</li></ul>
<ol class="steps"><li>Pon 3 canicas quietas y juntas en el riel.</li><li>Lanza una cuarta canica contra ellas y observa qué pasa.</li><li>Ahora lanza dos canicas juntas contra las otras dos.</li></ol>
<p class="predict">Si lanzas una canica contra tres quietas, ¿cuántas se mueven después del choque?</p>
<p class="result">Sale una sola canica por el otro lado, y las del medio quedan quietas. Con dos canicas, salen dos. ¡Igual que la cuna de Newton!</p>
<p class="why">El movimiento pasa de canica en canica y se conserva. Como son iguales, la canica que llega se detiene y entrega todo su movimiento.</p>
</div>
<div class="exp" data-title="Cápsula salvahuevos" data-time="40 min" data-level="3" data-adult="1">
<ul class="mat"><li>🥚 Un huevo crudo (o un tomate maduro)</li><li>📦 Una cajita, bolsas, algodón, esponja, papel</li><li>🩹 Cinta pegante</li><li>🧑‍🤝‍🧑 Un adulto</li></ul>
<ol class="steps"><li>Diseña una cápsula para que el huevo sobreviva a una caída. Usa algodón, esponja o papel arrugado alrededor del huevo.</li><li>Con un adulto, suéltala desde una altura de 1 m sobre el piso (sobre un periódico o en el patio).</li><li>Si se rompe, mejora el diseño y vuelve a probar desde más alto.</li></ol>
<p class="predict">¿Qué material crees que protegerá mejor al huevo?</p>
<p class="result">Los materiales blandos y gruesos (esponja, algodón, papel arrugado) protegen más. ¡Se puede salvar el huevo incluso desde 2 o 3 metros!</p>
<p class="why">Los materiales blandos alargan el tiempo del choque. El huevo se frena más despacio, entonces la fuerza sobre él es menor y la cáscara resiste.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>Una bola choca de frente con otra igual que estaba quieta (choque elástico). ¿Qué pasa?</p><ol><li>Las dos salen juntas</li><li>La primera se detiene y la segunda sale</li><li>Las dos se detienen</li></ol><p class="why">Con bolas iguales, la que llega se detiene y la otra sale con su rapidez.</p></div>
<div class="q" data-ans="2"><p>¿De qué depende el momento lineal de algo?</p><ol><li>Solo del color</li><li>Solo de su tamaño</li><li>De su masa y su rapidez</li></ol><p class="why">Momento lineal = masa × rapidez.</p></div>
<div class="q" data-ans="0"><p>¿Por qué un casco tiene espuma por dentro?</p><ol><li>Para alargar el tiempo del choque y reducir el golpe</li><li>Para que se vea bonito</li><li>Para que pese más</li></ol><p class="why">La espuma se aplasta y hace que el golpe dure más, así la fuerza sobre tu cabeza es menor.</p></div>
<div class="q" data-ans="1"><p>En la cuna de Newton levantas 2 bolas. ¿Cuántas salen por el otro lado?</p><ol><li>1</li><li>2</li><li>5</li></ol><p class="why">Salen tantas bolas como levantaste.</p></div>
</div>
</template>

<!-- 12-flotar.html -->
<template class="chapter-src" data-id="flotar" data-num="12" data-world="3" data-title="Flotar y hundirse" data-short="Por qué un barco gigante flota, un huevo flota con sal y los insectos caminan sobre el agua.">
<p class="lead">Un barco de acero que pesa miles de toneladas flota, pero un clavito diminuto se hunde. ¿Cómo puede ser? La respuesta la encontró hace más de 2000 años Arquímedes, ¡y se la sabe cualquier gota de agua!</p>

<div class="learn"><ul>
<li>La densidad dice cuánta materia hay en un volumen: lo denso pesa más «por tamaño».</li>
<li>Algo flota si es menos denso que el líquido en el que está.</li>
<li>La superficie del agua se comporta como una piel elástica.</li>
</ul></div>

<div class="say" data-who="gotin" data-mood="happy"><p>¡Hola! Soy Gotín, una gotita de agua. Yo conozco todo sobre flotar, ¡porque vivo en el agua! Te voy a contar el secreto de Arquímedes.</p></div>

<section>
<h2>La densidad: ¿pesado o liviano… por su tamaño?</h2>
<p>Una bolsa de plumas ocupa más espacio que una piedra del mismo peso. Los científicos dicen que la piedra es más <dfn data-def="Cuánta masa hay en cada pedacito de espacio. El agua tiene una densidad de 1 gramo por cada centímetro cúbico.">densa</dfn>. La densidad es la masa dividida entre el volumen. La del agua es 1 g/cm³, y es la referencia para todas.</p>
<div class="magic" data-name="Regla para flotar"><big>menos denso que el líquido → flota</big>más denso que el líquido → se hunde</div>
<table><tr><th>Material</th><th>Densidad (g/cm³)</th><th>En agua</th></tr>
<tr><td>🏓 Pelota de ping-pong</td><td>0,08</td><td>Flota</td></tr><tr><td>🪵 Madera</td><td>0,6</td><td>Flota</td></tr><tr><td>🧊 Hielo</td><td>0,92</td><td>Flota (casi todo sumergido)</td></tr>
<tr><td>💧 Agua</td><td>1,00</td><td>—</td></tr><tr><td>🥚 Huevo</td><td>1,08</td><td>Se hunde</td></tr><tr><td>🪨 Piedra</td><td>2,7</td><td>Se hunde</td></tr><tr><td>🪙 Hierro y acero</td><td>7,8</td><td>Se hunde</td></tr></table>
<div class="sim" data-sim="hundir-flotar" data-title="¿Flota o se hunde?" data-goal="Predice si cada objeto flota o se hunde. ¡Acierta 5 veces!">
<ul><li>Cambia el líquido: el huevo se hunde en agua pero flota en agua muy salada.</li><li>Cuando algo flota, ¡fíjate en qué fracción queda sumergida!</li></ul>
</div>
</section>

<section>
<h2>Por qué flota un barco de acero</h2>
<p>El acero es más denso que el agua… ¡pero un barco flota! Porque no es una pieza maciza: está lleno de aire. Cuando el barco se mete en el agua, empuja el agua y la <strong>desplaza</strong>. El agua empuja hacia arriba con una fuerza igual al peso del agua que desplazó. Esa es la idea de Arquímedes: el <strong>empuje</strong>.</p>
<div class="magic" data-name="Principio de Arquímedes"><big>el empuje = peso del agua que desalojas</big>Un barco flota cuando desaloja tanta agua como pesa él.</div>
<div class="sim" data-sim="barco" data-title="Carga el barco" data-goal="Carga el barco con 10 contenedores sin que se hunda. ¡Elige bien el tamaño del casco!">
<ul><li>Un casco más ancho desaloja más agua con poca profundidad.</li><li>En el mar (agua salada, más densa) los barcos flotan un poquito más alto que en un río.</li></ul>
</div>
<details class="curious"><p>La profundidad a la que se hunde un barco (el calado) es d = m / (ρ·A), donde m es la masa total, ρ la densidad del agua y A el área del casco. Los barcos llevan pintada la «línea de Plimsoll», que marca el máximo calado seguro según el agua sea de río, de mar o de clima tropical.</p></details>
</section>

<section>
<h2>La piel del agua</h2>
<p>Las moléculas de agua se atraen mucho entre sí. Por eso la superficie del agua se comporta como una piel elástica fina: se llama <dfn data-def="La fuerza que hace que la superficie de un líquido se comporte como una piel elástica.">tensión superficial</dfn>. Permite que algunos insectos, como los zapateros, caminen sobre el agua, que una gota sea redonda y que un clip de acero pueda flotar si se pone con cuidado.</p>
<div class="sim" data-sim="gotas-moneda" data-title="¿Cuántas gotas caben en una moneda?" data-goal="Cuenta cuántas gotas aguanta la moneda con agua y luego con jabón. ¡Haz las dos pruebas!">
<ul><li>El agua forma una cúpula en la moneda porque se atrae a sí misma.</li><li>El jabón debilita esa «piel», por eso caben menos gotas.</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="El huevo que flota con sal" data-time="15 min" data-level="1">
<ul class="mat"><li>🥚 Un huevo crudo</li><li>🥛 Un vaso alto con agua</li><li>🧂 Sal (6 cucharadas)</li><li>🥄 Una cuchara</li></ul>
<ol class="steps"><li>Llena el vaso con agua y mete el huevo con cuidado. ¿Se hunde?</li><li>Saca el huevo. Disuelve sal en el agua, cucharada por cucharada, revolviendo bien.</li><li>Vuelve a meter el huevo. Sigue añadiendo sal hasta que flote.</li></ol>
<p class="predict">¿Cuántas cucharadas de sal necesitarás para que el huevo flote?</p>
<p class="result">En el agua normal, el huevo se hunde hasta el fondo. Con 5 o 6 cucharadas de sal, empieza a subir y flota. ¡Si le echas agua sin sal con cuidado encima, queda a medio camino!</p>
<p class="why">La sal hace el agua más densa. Cuando el agua es más densa que el huevo, el huevo flota. Por eso es fácil flotar en el Mar Muerto, que es muy salado.</p>
</div>
<div class="exp" data-title="El clip que flota" data-time="10 min" data-level="2">
<ul class="mat"><li>📎 Un clip de metal</li><li>🥣 Un tazón con agua quieta</li><li>🧻 Un trozo de papel de cocina</li><li>🧴 Una gota de jabón</li></ul>
<ol class="steps"><li>Pon el papel de cocina sobre el agua y encima el clip, con mucho cuidado.</li><li>Cuando el papel se hunda, retíralo. Si lo hiciste bien, el clip queda flotando.</li><li>Ahora toca el agua con una gota de jabón, lejos del clip. ¡Observa!</li></ol>
<p class="predict">¿Qué pasará cuando el jabón toque el agua?</p>
<p class="result">El clip flota sobre la superficie. Al echar el jabón, el clip se hunde de repente.</p>
<p class="why">El clip no flota por su densidad (es mucho más denso que el agua), sino sostenido por la piel del agua. El jabón la debilita y el clip se hunde.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="0"><p>Un objeto flota en el agua si es…</p><ol><li>Menos denso que el agua</li><li>Más denso que el agua</li><li>Más grande que el agua</li></ol><p class="why">Si tiene menos masa por volumen que el agua, el agua lo empuja hacia arriba y flota.</p></div>
<div class="q" data-ans="2"><p>¿Por qué flota un barco de acero?</p><ol><li>Porque el acero es más liviano que el agua</li><li>Porque es mágico</li><li>Porque desaloja tanta agua como pesa</li></ol><p class="why">El casco, lleno de aire, desplaza mucha agua y recibe un empuje igual a su peso.</p></div>
<div class="q" data-ans="1"><p>¿Para qué se echa sal al agua en el experimento del huevo?</p><ol><li>Para que se ponga más caliente</li><li>Para hacer el agua más densa</li><li>Para darle sabor</li></ol><p class="why">Con sal el agua es más densa y el huevo flota.</p></div>
<div class="q" data-ans="1"><p>¿Qué le pasa a la «piel» del agua cuando le pones jabón?</p><ol><li>Se hace más fuerte</li><li>Se debilita</li><li>No pasa nada</li></ol><p class="why">El jabón reduce la tensión superficial: caben menos gotas y el clip se hunde.</p></div>
</div>
</template>

<!-- 13-presion.html -->
<template class="chapter-src" data-id="presion" data-num="13" data-world="3" data-title="La presión: el peso de todo lo que nos rodea" data-short="El aire pesa, el agua aprieta, y en Popayán el agua hierve antes de los 100 grados.">
<p class="lead">Aunque no lo notes, ¡el aire que te rodea te está apretando todo el tiempo! Y si te metes al agua, sientes que te aprieta más y más mientras bajas. Eso se llama <strong>presión</strong>.</p>

<div class="learn"><ul>
<li>La presión es la fuerza repartida en una superficie.</li>
<li>El agua aprieta más mientras más profundo estás.</li>
<li>El aire pesa: mientras más alto subes, hay menos aire encima y menos presión.</li>
</ul></div>

<div class="say" data-who="gotin" data-mood="think"><p>Cuando me sumerjo hasta el fondo de la piscina, siento un apretón en los oídos. ¡Es la presión del agua que está encima de mí!</p></div>

<section>
<h2>¿Qué es la presión?</h2>
<p>La <dfn data-def="La fuerza dividida entre el área sobre la que se reparte.">presión</dfn> es la fuerza dividida entre el área donde se reparte. Si te paras en la nieve con zapatos, te hundes. Pero con esquís no, ¡porque tu peso se reparte en más área y la presión es menor! Y un clavo entra en la madera porque su punta es diminuta: toda la fuerza se concentra en un área pequeñísima, ¡y la presión es enorme!</p>
<div class="magic" data-name="Presión"><big>presión = fuerza ÷ área</big>Mucha área = poca presión · Poca área = mucha presión</div>

<h3>El agua aprieta más abajo</h3>
<p>En el agua, la presión crece con la profundidad: ¡cada 10 metros hacia abajo se suma una atmósfera! Una <dfn data-def="La presión que hace el aire sobre nosotros al nivel del mar. Se llama atmósfera (1 atm).">atmósfera</dfn> es la presión que hace todo el aire sobre ti al nivel del mar. Por eso los buzos solo pueden bajar hasta cierta profundidad sin ayuda especial.</p>
<div class="sim" data-sim="chorros" data-title="El tanque con agujero" data-goal="Haz un agujero a la altura correcta para que el chorro caiga dentro de la taza. ¡Acierta 2 veces!">
<ul><li>Más profundo = chorro más fuerte, porque la presión es mayor.</li><li>Pero ojo: un hueco muy abajo sale con fuerza, pero cae cerca del tanque. La mayor distancia se logra con el agujero en una altura intermedia.</li></ul>
</div>
<div class="sim" data-sim="buzo" data-title="Bajando al fondo del mar" data-goal="Baja con el buzo hasta 30 metros y observa cómo la presión aplasta el globo.">
<ul><li>A 10 m hay 2 atmósferas, a 20 m hay 3, a 30 m hay 4.</li><li>El globo se encoge porque el agua lo aprieta más y más.</li></ul>
</div>
<details class="curious"><p>La presión de un líquido a profundidad h es P = P₀ + ρ·g·h, donde P₀ es la presión del aire arriba. Para el agua, ρ·g·h aumenta casi 1 atmósfera (101 kPa) cada 10,3 m. Y el volumen de un globo con aire cambia al revés de la presión (ley de Boyle): a 4 atmósferas, el globo se reduce a la cuarta parte de su volumen.</p></details>
</section>

<section>
<h2>El océano de aire</h2>
<p>El aire también pesa. Sobre ti hay una columna de aire de más de 100 kilómetros de alto, y su peso es la presión atmosférica. ¡Tu cuerpo no se aplasta porque por dentro también tienes presión igual!</p>
<div class="story" data-title="Torricelli y el mercurio"><p>En 1643, el italiano Evangelista Torricelli llenó un tubo de vidrio con mercurio y lo puso al revés en un recipiente. El mercurio bajó un poco y se quedó a unos 76 cm de altura: ¡el peso del aire lo sostenía! Así inventó el <em>barómetro</em>.</p></div>
<p>Cuando subes una montaña, hay menos aire encima de ti y la presión baja. En Popayán (1738 m sobre el nivel del mar), la presión es de unas 0,82 atmósferas. Y eso cambia algo curioso: ¡el agua hierve antes!</p>
<div class="say" data-who="buho" data-mood="wow"><p>El sabio Francisco José de Caldas, nacido en Popayán, aprovechó eso: midió la altura de las montañas viendo a qué temperatura hervía el agua. ¡Mientras más alto, menos temperatura hacía falta!</p></div>
<div class="sim" data-sim="altura-presion" data-title="Subiendo la montaña" data-goal="Sube hasta Popayán, Bogotá y la cima del Everest para ver la presión y a qué temperatura hierve el agua.">
<ul><li>Mira la presión del aire a cada altura.</li><li>En la cima del Everest el agua hierve a solo 71 °C: ¡no alcanza para cocinar bien un huevo!</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Botella con tres agujeros" data-time="15 min" data-level="1" data-adult="1">
<ul class="mat"><li>🧴 Una botella plástica de 2 litros</li><li>📍 Una chinche o un clavo caliente (¡solo el adulto!)</li><li>🩹 Cinta pegante</li><li>🥣 Un lavaplatos o patio</li></ul>
<ol class="steps"><li>Un adulto hace tres agujeritos en una línea vertical de la botella: uno arriba, uno en medio y uno abajo.</li><li>Tapa los tres con cinta pegante y llena la botella de agua.</li><li>Ponla al borde del lavaplatos o en el patio. Quita las cintas todas a la vez.</li><li>Observa cómo salen los chorros y qué tan lejos llegan.</li></ol>
<p class="predict">¿Cuál agujero lanzará el chorro con más fuerza?</p>
<p class="result">El agujero de abajo lanza el chorro con más fuerza, y el de arriba con menos. El de en medio llega más o menos igual de lejos que el de abajo.</p>
<p class="why">Abajo, el agua tiene más agua encima empujándola: hay más presión. Por eso salen más fuerte los chorros más profundos.</p>
</div>
<div class="exp" data-title="El vaso que no deja caer el agua" data-time="5 min" data-level="1">
<ul class="mat"><li>🥛 Un vaso de vidrio o plástico</li><li>💧 Agua</li><li>🃏 Un trozo de cartulina o una tarjeta</li><li>🛁 Un lavaplatos o un recipiente grande</li></ul>
<ol class="steps"><li>Llena el vaso con agua hasta el borde.</li><li>Cubre la boca con la cartulina, sin que queden burbujas.</li><li>Sujeta la tarjeta con una mano, dale vuelta al vaso con la otra sobre el lavaplatos, y aparta la mano que sujeta la tarjeta.</li></ol>
<p class="predict">¿La tarjeta se caerá con el agua?</p>
<p class="result">¡La tarjeta se queda pegada al vaso y el agua no se cae!</p>
<p class="why">El aire de afuera empuja la tarjeta hacia arriba con más fuerza que el peso del agua que empuja hacia abajo. ¡La presión del aire sostiene el agua!</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="2"><p>¿Dónde es mayor la presión del agua?</p><ol><li>En la superficie</li><li>A 5 metros</li><li>A 30 metros</li></ol><p class="why">La presión aumenta con la profundidad.</p></div>
<div class="q" data-ans="1"><p>Una atmósfera es…</p><ol><li>La capa más alta del cielo</li><li>La presión que hace el aire al nivel del mar</li><li>Una nube</li></ol><p class="why">1 atmósfera es la presión normal del aire al nivel del mar.</p></div>
<div class="q" data-ans="0"><p>En una montaña muy alta, ¿la presión del aire es…?</p><ol><li>Menor que abajo</li><li>Mayor que abajo</li><li>Igual</li></ol><p class="why">Arriba hay menos aire encima, así que la presión baja.</p></div>
<div class="q" data-ans="1"><p>¿Por qué un clavo entra fácilmente en la madera?</p><ol><li>Porque es de metal</li><li>Porque su punta tiene muy poca área y la presión es enorme</li><li>Porque pesa mucho</li></ol><p class="why">La misma fuerza en un área pequeñísima produce una presión muy grande.</p></div>
</div>
</template>

<!-- 14-volar.html -->
<template class="chapter-src" data-id="volar" data-num="14" data-world="3" data-title="Volar: aviones, globos y paracaídas" data-short="Cómo se sostiene un avión, por qué un paracaídas frena y cómo sube un globo de aire caliente.">
<p class="lead">Las aves lo hacen desde siempre; los humanos tardamos miles de años en aprender. ¡Volar es pura física del aire! Un avión de 70 toneladas, un globo gigante y un paracaídas siguen las mismas reglas del aire que sientes en la cara cuando corres.</p>

<div class="learn"><ul>
<li>Un ala empuja el aire hacia abajo y el aire empuja el ala hacia arriba: eso es la sustentación.</li>
<li>El aire frena a las cosas que caen: un paracaídas es un freno enorme.</li>
<li>Un globo sube cuando el aire caliente de adentro pesa menos que el aire de afuera.</li>
</ul></div>

<div class="say" data-who="gotin" data-mood="wow"><p>El aire también es un fluido, igual que yo, ¡pero más ligerito! Fluye, empuja y se mueve alrededor de las cosas, igual que el agua.</p></div>

<section>
<h2>Cómo vuela un avión</h2>
<p>Un avión se sostiene en el aire por sus alas. Son más curvas arriba y más planas abajo, y están un poquito inclinadas hacia arriba. Cuando el avión avanza muy rápido, las alas empujan el aire hacia abajo y, por la tercera ley de Newton, el aire las empuja hacia arriba. A esa fuerza se le llama <dfn data-def="La fuerza hacia arriba que el aire hace sobre las alas de un avión en movimiento.">sustentación</dfn>.</p>
<p>Además, el aire que pasa rápido por encima del ala tiene menos presión que el aire de abajo, y eso también ayuda a empujar el ala hacia arriba. Es el efecto que describió Daniel Bernoulli hace casi 300 años: <strong>donde el aire va más rápido, la presión es menor</strong>.</p>
<div class="magic" data-name="Para volar necesitas"><big>sustentación ≥ peso</big>Más velocidad o más ángulo = más sustentación (¡pero con cuidado!)</div>
<div class="sim" data-sim="ala-avion" data-title="Pilota el avioncito" data-goal="Mantén el avión volando a la misma altura durante 6 segundos. ¡Cuidado con inclinar demasiado el ala!">
<ul><li>Si vas muy despacio, el avión cae. Si inclinas demasiado el ala, ¡el aire se separa y se «pierde» la sustentación!</li><li>A eso se le llama entrar en pérdida.</li></ul>
</div>
<details class="curious"><p>La sustentación es L = ½·ρ·v²·S·C<sub>L</sub>, donde ρ es la densidad del aire, v la rapidez, S la superficie de las alas y C<sub>L</sub> el coeficiente de sustentación, que aumenta con el ángulo del ala hasta unos 15°; después baja de golpe (pérdida). Por eso los aviones necesitan pista larga para despegar: tienen que alcanzar la rapidez suficiente.</p></details>
</section>

<section>
<h2>El paracaídas: un freno de aire</h2>
<p>Cuando algo cae, el aire lo frena. Mientras más rápido cae, más lo frena el aire, hasta que llega un momento en que el freno iguala al peso y ya no acelera más. Esa es la <dfn data-def="La rapidez máxima a la que cae algo cuando el aire lo frena tanto como la gravedad lo jala.">rapidez terminal</dfn>. Un paracaidista cayendo con los brazos abiertos llega a unos 200 km/h. Con el paracaídas abierto baja a unos 20 km/h: ¡10 veces más despacio!</p>
<div class="sim" data-sim="paracaidas" data-title="Salta y aterriza suave" data-goal="Salta, escoge el tamaño del paracaídas y ábrelo a tiempo para aterrizar a menos de 7 m/s.">
<ul><li>Un paracaídas más grande frena más.</li><li>Si lo abres muy tarde, no alcanza a frenar.</li></ul>
</div>
</section>

<section>
<h2>El globo de aire caliente</h2>
<p>El aire caliente se expande y pesa menos por litro que el aire frío. Un globo lleno de aire caliente es más liviano que el aire de afuera, entonces el aire frío lo empuja hacia arriba, igual que el agua empuja hacia arriba un corcho. ¡Es el mismo principio de Arquímedes, pero en el aire!</p>
<div class="sim" data-sim="globo-aire" data-title="El globo aerostático" data-goal="Calienta el aire del globo con el quemador y llega a los 200 metros de altura.">
<ul><li>Con poco calor, el globo no despega: pesa más que el empuje.</li><li>Si dejas de calentar, el aire se enfría y el globo baja despacio.</li></ul>
</div>
<div class="fact"><p>El primer vuelo humano fue en un globo de aire caliente, en 1783, en Francia, hecho por los hermanos Montgolfier. ¡Antes que los aviones, casi 120 años antes! Los primeros pasajeros fueron… una oveja, un pato y un gallo.</p></div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Aviones de papel" data-time="25 min" data-level="1">
<ul class="mat"><li>📄 3 hojas de papel iguales</li><li>📏 Una cinta métrica</li><li>✏️ Un lápiz para anotar</li></ul>
<ol class="steps"><li>Dobla tres aviones distintos: uno clásico de punta, uno con alas anchas y otro con alas muy pequeñas.</li><li>Lánzalos desde el mismo punto y con la misma fuerza, de 3 veces cada uno.</li><li>Mide hasta dónde llega cada uno y anota los resultados.</li><li>Mejora tu diseño doblando un poquito hacia arriba la parte de atrás de las alas y vuelve a probar.</li></ol>
<p class="predict">¿Cuál volará más lejos: el de alas anchas o el de alas pequeñas?</p>
<p class="result">Depende de cómo lo lances, pero casi siempre el de alas medianas y punta aguda llega más lejos. Los de alas muy anchas flotan más tiempo, pero van lento.</p>
<p class="why">Las alas más grandes dan más sustentación, pero el aire las frena más. Hay un equilibrio entre ambas cosas, ¡como en los aviones de verdad!</p>
</div>
<div class="exp" data-title="Dos papeles que se juntan" data-time="5 min" data-level="1">
<ul class="mat"><li>📄 Dos tiras de papel de 3 × 20 cm</li></ul>
<ol class="steps"><li>Sostén las dos tiras, una al lado de la otra, a unos 3 cm de separación, con los extremos colgando.</li><li>Sopla entre ellas por la parte de arriba.</li></ol>
<p class="predict">¿Las tiras se separarán o se juntarán?</p>
<p class="result">¡Se juntan! Aunque parece que deberían separarse por el soplido.</p>
<p class="why">El aire que pasa entre las tiras va más rápido y tiene menos presión. El aire de afuera, con más presión, las empuja una contra otra. Es el efecto Bernoulli.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>¿Qué hace que un avión se sostenga en el aire?</p><ol><li>Los motores lo jalan hacia arriba</li><li>La sustentación de sus alas</li><li>Que sea muy liviano</li></ol><p class="why">Las alas hacen que el aire las empuje hacia arriba: eso es la sustentación.</p></div>
<div class="q" data-ans="0"><p>¿Para qué sirve un paracaídas?</p><ol><li>Para que el aire frene la caída</li><li>Para que la gravedad no actúe</li><li>Para volar hacia arriba</li></ol><p class="why">El paracaídas ofrece mucha superficie y el aire lo frena. La gravedad sigue actuando.</p></div>
<div class="q" data-ans="2"><p>¿Por qué sube un globo de aire caliente?</p><ol><li>Porque el fuego lo empuja</li><li>Porque lo jala el Sol</li><li>Porque el aire caliente pesa menos que el aire frío y el aire frío lo empuja</li></ol><p class="why">Es el principio de Arquímedes aplicado al aire.</p></div>
<div class="q" data-ans="1"><p>Según Bernoulli, donde el aire va más rápido…</p><ol><li>La presión es mayor</li><li>La presión es menor</li><li>No cambia la presión</li></ol><p class="why">Rápido = menos presión. Por eso las tiras de papel se juntan al soplar entre ellas.</p></div>
</div>
</template>

<!-- 15-temperatura.html -->
<template class="chapter-src" data-id="temperatura" data-num="15" data-world="4" data-title="Temperatura y calor" data-short="Qué es estar caliente o frío, cómo funcionan los termómetros y por qué la mano engaña.">
<p class="lead">El chocolate está caliente, el helado está frío, el sol quema… Todos sabemos lo que es «caliente» y «frío», pero ¿qué pasa por dentro de las cosas para estar así? ¡Vamos a descubrirlo!</p>

<div class="learn"><ul>
<li>Todo está hecho de partículas diminutas que se mueven sin parar.</li>
<li>Temperatura es qué tan agitadas están esas partículas.</li>
<li>El calor es la energía que pasa de lo caliente a lo frío.</li>
</ul></div>

<div class="say" data-who="flamo" data-mood="wow"><p>¡Hola, soy Flamo! Soy fuego, luz y calor. Mi trabajo es hacer que las partículas bailen más rápido. ¡Cuando se mueven muy rápido, algo está muy caliente!</p></div>

<section>
<h2>Partículas que bailan</h2>
<p>Si pudieras ver con un súper microscopio, verías que el agua, el aire y tu cuerpo están hechos de partículas tan pequeñas que no se alcanzan a ver, y que están todo el tiempo moviéndose y vibrando. Cuando algo se calienta, sus partículas se mueven <em>más rápido</em>. Cuando se enfría, se mueven <em>más despacio</em>.</p>
<div class="magic" data-name="Temperatura"><big>temperatura = qué tan rápido bailan las partículas</big>Más rápido = más caliente</div>
<p>Y entonces, ¿qué es el <strong>calor</strong>? Es la energía que pasa de un cuerpo más caliente a otro más frío. Si pones una cuchara fría en una sopa caliente, la sopa le entrega calor a la cuchara hasta que las dos tengan igual temperatura. ¡Nunca pasa al revés, solo!</p>
<div class="fact"><p>La temperatura más baja posible se llama cero absoluto: −273,15 °C. Allí las partículas casi no se mueven. ¡Nunca nada puede estar más frío que eso!</p></div>
</section>

<section>
<h2>El termómetro y sus escalas</h2>
<p>Un termómetro mide la temperatura. Los de líquido tienen alcohol coloreado (o mercurio) en un tubito: cuando se calienta, el líquido se expande y sube. Hay varias escalas. La más usada en Colombia es la <strong>Celsius</strong> (°C): el agua se congela a 0 °C y hierve a 100 °C (al nivel del mar). En Estados Unidos se usa la <strong>Fahrenheit</strong> (°F), y los científicos usan la <strong>Kelvin</strong> (K).</p>
<table><tr><th>Qué</th><th>°C</th><th>°F</th><th>K</th></tr><tr><td>El agua se congela</td><td>0</td><td>32</td><td>273</td></tr><tr><td>Tu cuerpo</td><td>37</td><td>98,6</td><td>310</td></tr><tr><td>El agua hierve</td><td>100</td><td>212</td><td>373</td></tr></table>
<div class="sim" data-sim="termometros" data-title="El termómetro triple" data-goal="Encuentra la temperatura del agua que hierve, la del hielo y la de tu cuerpo. ¡Y la temperatura donde °C y °F son iguales!">
<ul><li>Mueve la barra y mira las tres escalas a la vez.</li><li>Hay una temperatura muy rara en la que Celsius y Fahrenheit dicen el mismo número. ¿La encuentras? Está muy fría…</li></ul>
</div>
<details class="curious"><p>Para pasar de Celsius a Fahrenheit: °F = °C × 9/5 + 32. Para pasar a Kelvin: K = °C + 273,15. Los grados Celsius y los kelvin tienen el mismo «tamaño», pero parten de lugares distintos. El kelvin parte del cero absoluto, por eso nunca hay kelvin negativos.</p></details>
</section>

<section>
<h2>Mezclando aguas</h2>
<p>Si mezclas agua caliente con agua fría, queda tibia: el calor pasa del agua caliente a la fría hasta que las dos tienen la misma temperatura. Esa temperatura final depende de <strong>cuánta</strong> agua pones de cada una: más agua caliente, más tibia queda.</p>
<div class="sim" data-sim="mezcla-aguas" data-title="La mezcla perfecta" data-goal="Mezcla agua caliente (80 °C) y fría (10 °C) para conseguir justo la temperatura que pide el reto.">
<ul><li>La mezcla queda más cerca de la temperatura del agua que haya en mayor cantidad.</li><li>Si pones la misma cantidad de cada una, queda justo en el promedio.</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Los tres tazones: la mano engaña" data-time="10 min" data-level="1" data-adult="1">
<ul class="mat"><li>🥣 Tres tazones</li><li>🧊 Agua con hielo</li><li>🚰 Agua tibia (de la llave)</li><li>♨️ Agua caliente (que no queme; ¡con ayuda de un adulto!)</li></ul>
<ol class="steps"><li>Pon agua con hielo en un tazón, agua tibia en el del medio, y agua caliente (que no queme) en el otro.</li><li>Pon una mano en el agua fría y la otra en la caliente durante 1 minuto.</li><li>Ahora pasa las dos manos al tazón del medio, al agua tibia. ¿Qué sientes en cada mano?</li></ol>
<p class="predict">El agua tibia está igual para las dos manos. ¿Las dos sentirán lo mismo?</p>
<p class="result">¡No! La mano que estaba en el agua caliente siente el agua tibia como fría, y la mano que estaba en el agua fría la siente caliente.</p>
<p class="why">Tus manos no miden la temperatura, sino el <em>cambio</em> de calor que pasa por tu piel. Por eso los científicos usan termómetros: ¡no se dejan engañar!</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>¿Qué pasa con las partículas de algo cuando se calienta?</p><ol><li>Se detienen</li><li>Se mueven más rápido</li><li>Desaparecen</li></ol><p class="why">Más calor significa partículas más agitadas.</p></div>
<div class="q" data-ans="2"><p>¿A qué temperatura se congela el agua?</p><ol><li>100 °C</li><li>37 °C</li><li>0 °C</li></ol><p class="why">El agua se congela a 0 °C y hierve a 100 °C (al nivel del mar).</p></div>
<div class="q" data-ans="0"><p>Mezclas 1 litro de agua a 80 °C con 1 litro a 20 °C. ¿Cuánto queda aproximadamente?</p><ol><li>50 °C</li><li>100 °C</li><li>20 °C</li></ol><p class="why">Con cantidades iguales queda en el promedio: (80 + 20) ÷ 2 = 50 °C.</p></div>
<div class="q" data-ans="1"><p>El calor siempre pasa…</p><ol><li>De lo frío a lo caliente</li><li>De lo caliente a lo frío</li><li>En todas direcciones igual</li></ol><p class="why">Solo, el calor va de lo caliente a lo frío.</p></div>
</div>
</template>

<!-- 16-calor-viaja.html -->
<template class="chapter-src" data-id="calorviaja" data-num="16" data-world="4" data-title="El calor viaja" data-short="Conducción, convección y radiación: cómo llega el calor de un lugar a otro.">
<p class="lead">El calor de una estufa llega a la sopa. El calor del Sol llega a la Tierra, a través del espacio vacío. ¿Cómo viaja el calor? ¡De tres formas muy distintas!</p>

<div class="learn"><ul>
<li>Conducción: el calor pasa por contacto, de partícula en partícula.</li>
<li>Convección: el calor viaja con el movimiento de líquidos y gases.</li>
<li>Radiación: el calor viaja como luz, aunque no haya nada en medio.</li>
</ul></div>

<div class="say" data-who="flamo" data-mood="happy"><p>Yo me muevo de tres maneras: me paso de un lugar a otro por contacto, me subo con el aire caliente, o me lanzo como rayito de luz. ¡Te las enseño!</p></div>

<section>
<h2>1. Conducción: de mano en mano</h2>
<p>Si dejas una cuchara de metal en una sopa caliente, el mango también se calienta. El calor «camina» por la cuchara: las partículas del extremo caliente vibran fuerte y empujan a las vecinas, y estas a las siguientes. A eso se le llama <dfn data-def="El paso del calor a través de un material, de partícula en partícula, sin que el material se mueva.">conducción</dfn>.</p>
<p>Algunos materiales conducen muy bien el calor, como los metales. Otros casi no, como la madera, el plástico, el vidrio y el aire. A estos se les llama <strong>aislantes</strong>. Por eso las ollas son de metal pero sus mangos son de plástico o madera.</p>
<div class="sim" data-sim="conduccion" data-title="La carrera del calor en las cucharas" data-goal="Prende la llama y mira qué cuchara suelta primero su bolita de mantequilla. ¡Espera a que caigan dos!">
<ul><li>Fíjate en los colores: rojo es muy caliente y azul es frío.</li><li>La madera casi no deja pasar el calor: ¡su bolita nunca cae!</li></ul>
</div>
</section>

<section>
<h2>2. Convección: el calor que viaja en corrientes</h2>
<p>En los líquidos y los gases, el calor puede viajar de otra forma. Cuando calientas agua en una olla, el agua de abajo se calienta, se vuelve menos densa y <em>sube</em>. El agua de arriba, más fría y más pesada, <em>baja</em>. Se forman corrientes que giran, llamadas <dfn data-def="El movimiento de un líquido o gas por diferencias de temperatura: lo caliente sube y lo frío baja.">convección</dfn>. ¡Así se mueve el calor!</p>
<div class="fact"><p>Los vientos y las brisas son corrientes de convección gigantes. ¡Hasta el interior de la Tierra tiene convección! La roca caliente sube muy, muy despacio, y mueve los continentes.</p></div>
<div class="sim" data-sim="conveccion" data-title="La olla de las corrientes" data-goal="Pon el fuego fuerte y observa cómo la confetti sube por el centro y baja por los lados durante unos segundos.">
<ul><li>El rojo es caliente, el azul es frío. El confeti caliente sube.</li><li>Mientras más fuego, más rápido giran las corrientes.</li></ul>
</div>
</section>

<section>
<h2>3. Radiación: el calor que viaja como luz</h2>
<p>Entre el Sol y la Tierra hay unos 150 millones de kilómetros de espacio vacío. Ahí no hay aire ni partículas que conduzcan nada. Sin embargo, el calor del Sol llega. Viaja como ondas de luz, llamadas <dfn data-def="La forma en que el calor viaja como ondas de luz, incluso a través del vacío.">radiación</dfn>. También sientes el calor de una fogata en la cara aunque estés a un metro de distancia: eso es radiación.</p>
<p>Los colores oscuros <strong>absorben</strong> más radiación y se calientan más. Los claros la <strong>reflejan</strong> y se calientan menos. ¡Por eso en un día de sol conviene ropa blanca!</p>
<div class="sim" data-sim="radiacion-color" data-title="Camisetas al sol" data-goal="Deja las cuatro camisetas al sol 10 minutos y mira cuál se calienta más.">
<ul><li>Cambia el tiempo con la barra o usa el botón para dejar pasar los 10 minutos.</li><li>La camiseta negra absorbe casi toda la radiación.</li></ul>
</div>
<details class="curious"><p>Un termo conserva el calor porque bloquea las tres vías: tiene doble pared con vacío en medio (sin conducción ni convección) y paredes plateadas por dentro que reflejan la radiación. La velocidad con que el calor pasa por un material depende de su conductividad térmica: el cobre conduce unas 1500 veces mejor que la madera y unas 15 000 veces mejor que el aire quieto.</p></details>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Un termo casero" data-time="30 min" data-level="2">
<ul class="mat"><li>🧊 4 cubos de hielo iguales</li><li>🥣 4 recipientes pequeños iguales</li><li>🧣 Lana o un pedazo de tela gruesa</li><li>🍬 Papel aluminio</li><li>📰 Periódico</li><li>⏱️ Reloj</li></ul>
<ol class="steps"><li>Pon un cubo de hielo en cada recipiente.</li><li>Deja el primero tal cual (descubierto). Envuelve el segundo en papel aluminio, el tercero en lana y el cuarto en periódico.</li><li>Ponlos todos en un lugar tibio, y revisa cada 10 minutos cuánto hielo queda.</li><li>Anota cuál tarda más en derretirse.</li></ol>
<p class="predict">¿Cuál recipiente conservará el hielo por más tiempo?</p>
<p class="result">El de lana (o el de lana y aluminio juntos) conserva el hielo por más tiempo. El descubierto se derrite primero.</p>
<p class="why">La lana atrapa aire entre sus fibras, y el aire quieto es un excelente aislante: casi no conduce el calor. El aluminio refleja la radiación. ¡Por eso los abrigos y los termos conservan el calor!</p>
</div>
</section>

<div class="q" data-ans="1"><p>¿Qué ropa conviene en un día muy soleado?</p><ol><li>Negra</li><li>Blanca o clara</li><li>Da igual</li></ol><p class="why">Los colores claros reflejan más radiación y se calientan menos.</p></div>
</div>

<!-- 17-estados.html -->
<template class="chapter-src" data-id="estados" data-num="17" data-world="4" data-title="Sólido, líquido, gas… ¡y plasma!" data-short="Los estados de la materia, el hielo, el vapor y por qué el agua hierve sin subir de temperatura.">
<p class="lead">El hielo es duro, el agua se derrama y el vapor se escapa en el aire. ¡Y sin embargo, los tres son lo mismo: agua! Lo único que cambia es qué tan agitadas están sus partículas y cuánto se atraen entre sí.</p>

<div class="learn"><ul>
<li>La materia puede estar en cuatro estados: sólido, líquido, gas y plasma.</li>
<li>Al calentar, las partículas se mueven más y la materia cambia de estado.</li>
<li>Mientras algo cambia de estado, su temperatura se queda quieta.</li>
</ul></div>

<div class="say" data-who="gotin" data-mood="happy"><p>¡Yo soy agua en estado líquido! Pero si me congelo, soy hielo. Y si me caliento mucho, me escapo como vapor. ¡Soy la misma Gotín, pero en un traje distinto!</p></div>

<section>
<h2>Los cuatro estados</h2>
<div class="cols2">
<div class="card"><div class="big-emoji">🧊</div><h4>Sólido</h4><p>Las partículas están muy juntas y solo vibran en su sitio. Tiene forma propia: un cubo de hielo, una piedra.</p></div>
<div class="card"><div class="big-emoji">💧</div><h4>Líquido</h4><p>Las partículas están juntas pero se deslizan unas sobre otras. Toma la forma del recipiente.</p></div>
<div class="card"><div class="big-emoji">☁️</div><h4>Gas</h4><p>Las partículas están lejos y se mueven muy rápido. Ocupa todo el espacio que hay.</p></div>
<div class="card"><div class="big-emoji">⚡</div><h4>Plasma</h4><p>Un gas tan caliente que sus átomos se rompen en partes con electricidad. Es el estado del Sol, de los rayos y de las lámparas de neón.</p></div>
</div>
<div class="fact"><p>Casi toda la materia que se ve en el universo (el Sol y las demás estrellas) está en estado de plasma. En la Tierra el plasma es raro, ¡pero lo ves en los rayos de una tormenta y en las auroras!</p></div>
<div class="sim" data-sim="fiesta-moleculas" data-title="La fiesta de las moléculas" data-goal="Cambia la temperatura y consigue ver las partículas como sólido, como líquido y como gas.">
<ul><li>Con poca temperatura las partículas se quedan pegadas casi quietas (sólido).</li><li>Con temperatura media se deslizan unas sobre otras (líquido).</li><li>Con mucha temperatura vuelan separadas (gas).</li></ul>
</div>
</section>

<section>
<h2>Cambios de estado</h2>
<p>Cuando calientas hielo, se derrite a 0 °C. Cuando calientas agua, hierve a 100 °C (al nivel del mar) y se convierte en vapor. Cuando enfrías vapor, se condensa (es lo que forma las gotas en el espejo del baño). Y cuando enfrías agua, se congela.</p>
<p>Lo más curioso es que, <strong>mientras algo cambia de estado, su temperatura no sube</strong>, aunque le sigas dando calor. Toda esa energía se gasta en separar las partículas, no en agitarlas más. Por eso el agua hirviendo se queda a 100 °C aunque pongas el fuego al máximo.</p>
<div class="sim" data-sim="curva-agua" data-title="Calentar un cubo de hielo" data-goal="Calienta 100 gramos de hielo hasta que hierva. ¡Mira los escalones de la gráfica!">
<ul><li>Cada «escalón» es un cambio de estado: la temperatura se queda quieta.</li><li>Con más potencia, la gráfica se recorre más rápido, pero tiene la misma forma.</li></ul>
</div>
<details class="curious"><p>La energía para derretir 1 g de hielo es 334 J (calor latente de fusión) y para evaporar 1 g de agua es 2260 J (calor latente de vaporización). Para subir 1 g de agua 1 °C hacen falta 4,18 J. Por eso evaporar agua cuesta tanto: ¡es como calentarla 540 °C! Es lo que hace el sudor: al evaporarse se lleva mucho calor de tu piel y te refresca.</p></details>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Helado en una bolsa" data-time="20 min" data-level="2" data-adult="1">
<ul class="mat"><li>🥛 ½ taza de leche (con crema si hay)</li><li>🍬 1 cucharada de azúcar</li><li>🍦 Unas gotas de vainilla</li><li>🧊 Hielo en cubos (como 3 tazas)</li><li>🧂 Sal gruesa (6 cucharadas)</li><li>🛍️ Dos bolsas con cierre, una pequeña y una grande</li><li>🧤 Guantes o una toalla</li></ul>
<ol class="steps"><li>En la bolsa pequeña mezcla la leche, el azúcar y la vainilla. Ciérrala muy bien.</li><li>En la bolsa grande pon el hielo y la sal. Mete dentro la bolsa pequeña y cierra la grande.</li><li>Sacude y rueda las bolsas durante 10 minutos (con guantes: ¡quema de frío!).</li><li>Saca la bolsa pequeña, límpiala por fuera y… ¡a comer!</li></ol>
<p class="predict">¿Cómo logrará la sal que el hielo pueda congelar la leche, si el hielo ya está a 0 °C?</p>
<p class="result">¡La leche se vuelve helado cremoso! Y la bolsa grande queda tan fría que quema los dedos.</p>
<p class="why">La sal hace que el hielo se derrita a una temperatura menor que 0 °C (hasta −10 °C o menos). Ese hielo salado tan frío le quita calor a la leche hasta congelarla. ¡Por eso se echa sal en las calles con hielo!</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="2"><p>¿Qué estado de la materia tiene partículas muy separadas moviéndose muy rápido?</p><ol><li>Sólido</li><li>Líquido</li><li>Gas</li></ol><p class="why">En un gas las partículas están lejos unas de otras y se mueven rápido.</p></div>
<div class="q" data-ans="1"><p>El agua hierve en una olla y tú subes el fuego. ¿Qué pasa con su temperatura?</p><ol><li>Sube sin parar</li><li>Se queda en 100 °C (al nivel del mar)</li><li>Baja</li></ol><p class="why">Mientras hierve, el calor se usa para pasar de líquido a gas y la temperatura no sube.</p></div>
<div class="q" data-ans="0"><p>¿En qué estado está el Sol?</p><ol><li>Plasma</li><li>Sólido</li><li>Líquido</li></ol><p class="why">El Sol es una bola gigante de plasma.</p></div>
<div class="q" data-ans="1"><p>¿Para qué se echa sal en el hielo del helado casero?</p><ol><li>Para darle sabor</li><li>Para que el hielo se derrita a una temperatura más baja y enfríe más</li><li>Para que se caliente</li></ol><p class="why">La sal baja la temperatura de fusión del hielo: la mezcla queda más fría que 0 °C.</p></div>
</div>

<!-- 18-motores.html -->
<template class="chapter-src" data-id="motores" data-num="18" data-world="4" data-title="Motores de calor y la flecha del tiempo" data-short="Cómo funciona una máquina de vapor y por qué el café se enfría pero nunca se calienta solo.">
<p class="lead">Una máquina de vapor, el motor de un carro, una planta de energía: todas usan calor para hacer que algo se mueva. Y todas obedecen una regla muy profunda de la naturaleza: ¡el calor nunca se convierte del todo en movimiento!</p>

<div class="learn"><ul>
<li>Una máquina de calor convierte parte del calor en movimiento y desperdicia el resto.</li>
<li>Mientras más caliente es el fuego respecto al ambiente, mejor funciona.</li>
<li>Las cosas se mezclan solas pero no se separan solas: esto marca la dirección del tiempo.</li>
</ul></div>

<div class="say" data-who="flamo" data-mood="wink"><p>Yo calenté el agua en la primera máquina de vapor. ¡Casi todos los trenes antiguos funcionaban conmigo! Pero ni siquiera yo logro que todo mi calor se vuelva movimiento…</p></div>

<section>
<h2>La máquina de vapor</h2>
<p>El fuego calienta agua en una caldera hasta hacerla vapor. El vapor ocupa muchísimo más espacio que el agua, entonces empuja un émbolo (un pistón) con mucha fuerza. El pistón mueve una rueda, y la rueda mueve un tren, una fábrica o un barco. Después, el vapor se enfría y se vuelve agua otra vez, y el ciclo se repite.</p>
<div class="story" data-title="La Revolución de las máquinas"><p>Hace unos 300 años, Thomas Newcomen y después James Watt mejoraron las máquinas de vapor. Con ellas se movieron fábricas, trenes y barcos, y el mundo cambió mucho. Fue la primera vez que los humanos usaron el calor del fuego para mover cosas grandes sin músculos de animales o personas.</p></div>
<p>Pero hay un problema: una máquina de calor solo logra convertir una parte del calor en movimiento. El resto se escapa al ambiente. Un buen motor de carro aprovecha cerca de un tercio de la energía de la gasolina; ¡las otras dos terceras partes se van como calor!</p>
<div class="magic" data-name="Máquinas de calor"><big>más diferencia de temperatura = mejor</big>pero nunca se aprovecha el 100 %</div>
<div class="sim" data-sim="maquina-vapor" data-title="La máquina de vapor" data-goal="Sube la temperatura de la caldera hasta lograr que más de un cuarto de la energía (25 %) se convierta en movimiento.">
<ul><li>Mientras más caliente la caldera respecto al ambiente (30 °C), más aprovechas.</li><li>Hay un límite teórico que ninguna máquina puede superar: el límite de Carnot.</li></ul>
</div>
<details class="curious"><p>El físico francés Sadi Carnot descubrió en 1824 que el máximo rendimiento posible de una máquina de calor entre una fuente a temperatura T<sub>caliente</sub> y un ambiente a T<sub>frío</sub> (en kelvin) es η = 1 − T<sub>frío</sub>/T<sub>caliente</sub>. Para 300 °C (573 K) y 30 °C (303 K): η = 1 − 303/573 = 47 %. Ninguna máquina real lo alcanza, pero marca el límite. Es la segunda ley de la termodinámica.</p></details>
</section>

<section>
<h2>Por qué el tiempo solo va hacia adelante</h2>
<p>Si dejas un café caliente en la mesa, se enfría. Pero jamás has visto un café frío calentarse solo. Si dejas caer una gota de colorante en agua, se esparce. Pero nunca has visto el colorante juntarse de nuevo en una gota. Si ves una película de un vaso que se rompe, sabes si va hacia adelante o hacia atrás. ¡La naturaleza tiene una dirección!</p>
<p>¿Por qué? No porque lo prohíba una ley que diga «no se puede», sino porque es <strong>muchísimo más probable</strong>. Hay una cantidad gigantesca de formas de estar mezclado y desordenado, y muy pocas de estar ordenado. Si las partículas se mueven al azar, casi siempre terminarán mezcladas. A esa «cantidad de desorden» los físicos la llaman <dfn data-def="Una medida de qué tan mezclado o desordenado está algo. En la naturaleza, la entropía casi siempre aumenta.">entropía</dfn>.</p>
<div class="sim" data-sim="entropia" data-title="Partículas y puerta abierta" data-goal="Prueba con pocas partículas (4): a veces vuelven a juntarse todas. ¡Cuenta dos veces!">
<ul><li>Con pocas partículas, volver al orden es fácil. Con muchas, es casi imposible.</li><li>¡Imagina con trillones de partículas, como en una taza de café!</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="El colorante que se esparce" data-time="15 min" data-level="1" data-adult="1">
<ul class="mat"><li>🥛 Dos vasos transparentes iguales</li><li>🚰 Agua fría (con unos cubos de hielo)</li><li>♨️ Agua caliente de la llave o del calentador (un adulto la sirve)</li><li>🎨 Colorante de comida (o tinta)</li><li>⏱️ Reloj</li></ul>
<ol class="steps"><li>Llena un vaso con agua fría y otro con agua caliente. Deja que se calmen un minuto.</li><li>Echa una gota de colorante en cada vaso, a la vez, sin revolver.</li><li>Observa cómo se esparce en cada uno y mide cuánto tarda en teñir todo el vaso.</li></ol>
<p class="predict">¿En cuál vaso se esparcirá más rápido el colorante?</p>
<p class="result">En el agua caliente el colorante se esparce mucho más rápido. En el agua fría tarda bastante más.</p>
<p class="why">En el agua caliente las partículas se mueven más rápido, entonces mezclan el colorante más rápido. Y fíjate: el colorante nunca se vuelve a juntar solo en una gota.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>¿Qué hace el vapor en una máquina de vapor?</p><ol><li>Enfría el aire</li><li>Empuja un pistón</li><li>Apaga el fuego</li></ol><p class="why">El vapor se expande y empuja el pistón, que mueve la máquina.</p></div>
<div class="q" data-ans="2"><p>Un motor de carro convierte en movimiento…</p><ol><li>Toda la energía de la gasolina</li><li>Nada de energía</li><li>Solo una parte; el resto se pierde como calor</li></ol><p class="why">Ninguna máquina de calor convierte todo el calor en movimiento.</p></div>
<div class="q" data-ans="0"><p>¿Por qué el colorante se esparce en el agua pero no se junta solo?</p><ol><li>Porque mezclado es muchísimo más probable que ordenado</li><li>Porque el agua se lo come</li><li>Porque la gravedad lo ordena</li></ol><p class="why">Hay muchísimas más formas de estar mezclado que juntito. Eso es la entropía.</p></div>
<div class="q" data-ans="1"><p>¿Qué suele pasar con un café caliente en una mesa fría?</p><ol><li>Se calienta más</li><li>Se enfría</li><li>Se queda igual</li></ol><p class="why">El calor pasa de lo caliente a lo frío hasta que se igualan las temperaturas.</p></div>
</div>
</template>

<!-- 19-vaivenes.html -->
<template class="chapter-src" data-id="vaivenes" data-num="19" data-world="5" data-title="Vaivenes: péndulos y resortes" data-short="El columpio, el reloj de péndulo y el resorte que rebota: lo que se repite una y otra vez.">
<p class="lead">Un columpio va y viene, un resorte sube y baja, un reloj de péndulo hace tic-tac. Todo lo que se repite una y otra vez de ida y vuelta se llama <strong>oscilación</strong>. Y detrás hay reglas muy sencillas y sorprendentes.</p>

<div class="learn"><ul>
<li>El tiempo que tarda un vaivén completo se llama período.</li>
<li>Un péndulo más largo tarda más; su masa no importa.</li>
<li>Si empujas un columpio al ritmo justo, ¡sube cada vez más! Eso es resonancia.</li>
</ul></div>

<div class="say" data-who="eco" data-mood="happy"><p>¡Hola, soy Eco! Para mí todo es ritmo y sonido. Y antes de hablar de ondas y de música, tenemos que entender los vaivenes, que son como los latidos de todo.</p></div>

<section>
<h2>El péndulo de Galileo</h2>
<div class="story" data-title="La lámpara de la catedral"><p>Cuenta la historia que en 1583, un joven Galileo estaba en la catedral de Pisa y vio balancearse una lámpara. Con su propio pulso midió que tardaba el mismo tiempo en cada vaivén, aunque el balanceo fuera grande o pequeño. De ahí salió el reloj de péndulo, que fue el reloj más exacto del mundo durante casi 300 años.</p></div>
<p>El <dfn data-def="El tiempo que tarda un movimiento que se repite en completar un ciclo, por ejemplo un vaivén de ida y vuelta.">período</dfn> de un péndulo (lo que tarda en ir y volver) solo depende de lo <strong>largo</strong> que es el hilo. Si el hilo es más largo, el vaivén es más lento. ¿Y la masa? ¡No importa! Un péndulo con una bola pesada y otro con una bola liviana, del mismo largo, tardan igual.</p>
<div class="magic" data-name="El péndulo"><big>más largo = más lento</big>Un péndulo de 1 metro tarda casi 2 segundos en ir y volver.</div>
<div class="sim" data-sim="pendulo" data-title="El péndulo de Galileo" data-goal="Arma un péndulo que haga una ida y vuelta completa en exactamente 1 segundo.">
<ul><li>Cambia la masa: ¡el período no cambia!</li><li>Cambia el ángulo de salida (si es pequeño): tampoco cambia casi nada.</li><li>Solo importa el largo del hilo.</li></ul>
</div>
<details class="curious"><p>Para ángulos pequeños, el período es T = 2π√(L/g), donde L es el largo del péndulo y g = 9,8 m/s². Para L = 1 m da T ≈ 2,01 s. Si quieres un período de 1 s necesitas L ≈ 25 cm. En la Luna (g = 1,62) el mismo péndulo de 1 m tardaría 4,9 s. ¡Un péndulo sirve para medir la gravedad!</p></details>
</section>

<section>
<h2>El resorte que rebota</h2>
<p>Un resorte, cuando lo estiras, quiere volver a su largo normal. Mientras más lo estiras, más fuerte tira (hasta cierto punto). Esa regla se llama <dfn data-def="La estiramiento de un resorte es proporcional a la fuerza que se le aplica.">ley de Hooke</dfn>: el estiramiento es proporcional a la fuerza. Por eso funcionan las balanzas de resorte (los dinamómetros): cuelgas algo y miras cuánto se estiró el resorte.</p>
<div class="sim" data-sim="balanza-resorte" data-title="La balanza de resorte" data-goal="Mira cuánto se estira el resorte y adivina cuántos kilos pesa el objeto misterioso.">
<ul><li>Más masa, más estiramiento. Si la masa es el doble, el estiramiento es el doble.</li><li>Con 100 N/m, cada kilo estira el resorte unos 10 cm.</li></ul>
</div>
</section>

<section>
<h2>Resonancia: empujar en el momento justo</h2>
<p>Cada vaivén tiene su propio ritmo natural. Si empujas al columpio al ritmo justo, justo cuando va a empezar a volver, cada empujón suma y el columpio sube cada vez más. A esto se le llama <dfn data-def="Cuando empujas algo con el mismo ritmo de su vaivén natural y su movimiento crece mucho.">resonancia</dfn>. Pero si empujas a destiempo, tus empujones se cancelan y el columpio casi no se mueve.</p>
<div class="fact"><p>En 1940, el puente de Tacoma Narrows (en Estados Unidos) se movió tanto con el viento, como un columpio con resonancia, que se rompió y se cayó. Hoy los ingenieros diseñan los puentes y edificios para evitar la resonancia. Los soldados rompen el paso al cruzar un puente por la misma razón.</p></div>
<div class="sim" data-sim="resonancia-columpio" data-title="El columpio y los empujones" data-goal="Empuja el columpio con el ritmo justo para hacerlo subir hasta 35 grados.">
<ul><li>El columpio tiene un período natural de unos 3 segundos.</li><li>Si empujas más rápido o más despacio, casi no sube.</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="El péndulo casero" data-time="20 min" data-level="1">
<ul class="mat"><li>🧵 Un hilo de 1 metro</li><li>🔩 Una tuerca, una moneda o una bolita pesada</li><li>⏱️ Un cronómetro</li><li>📏 Una regla</li></ul>
<ol class="steps"><li>Amarra la tuerca al hilo y cuélgalo de una puerta o una silla, con el hilo midiendo 1 m.</li><li>Suelta el péndulo y mide cuánto tardan <b>10 vaivenes</b> (ida y vuelta). Divide entre 10: ese es el período.</li><li>Repite con el hilo de 50 cm y de 25 cm.</li><li>Cambia la tuerca por dos tuercas juntas: ¿cambia el período?</li></ol>
<p class="predict">Si acortas el hilo a la cuarta parte, ¿cuánto tardará cada vaivén?</p>
<p class="result">Con 1 m: unos 2,0 s. Con 25 cm: unos 1,0 s, ¡la mitad! Con dos tuercas, el período es igual.</p>
<p class="why">El período depende de la raíz cuadrada del largo: con la cuarta parte del largo, tarda la mitad. Y la masa no importa porque la gravedad acelera igual a todas las masas.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>¿De qué depende el período de un péndulo?</p><ol><li>De su masa</li><li>Del largo del hilo</li><li>Del color de la bola</li></ol><p class="why">Solo del largo del hilo (y de la gravedad del lugar).</p></div>
<div class="q" data-ans="0"><p>Un péndulo largo, comparado con uno corto, es…</p><ol><li>Más lento</li><li>Más rápido</li><li>Igual</li></ol><p class="why">Mientras más largo, más tarda en ir y volver.</p></div>
<div class="q" data-ans="2"><p>¿Qué es la resonancia?</p><ol><li>Un sonido muy fuerte</li><li>Un resorte roto</li><li>Empujar al ritmo natural y lograr que el movimiento crezca</li></ol><p class="why">Los empujones al ritmo justo se suman y el vaivén se hace grande.</p></div>
<div class="q" data-ans="1"><p>Un resorte se estira 5 cm con 1 kg. ¿Cuánto se estira con 2 kg?</p><ol><li>5 cm</li><li>10 cm</li><li>2,5 cm</li></ol><p class="why">El estiramiento es proporcional al peso: el doble de masa, el doble de estiramiento.</p></div>
</div>
</template>

<!-- 20-ondas.html -->
<template class="chapter-src" data-id="ondas" data-num="20" data-world="5" data-title="Las ondas: olas que viajan" data-short="Olas del mar, ondas en una cuerda, rizos en el agua y la ola mexicana del estadio.">
<p class="lead">Cuando tiras una piedra al agua, se forman círculos que se alejan. El agua no viaja con ellos: solo sube y baja. Lo que viaja es la perturbación, la <strong>onda</strong>. Las ondas llevan energía de un lugar a otro sin llevar la materia.</p>

<div class="learn"><ul>
<li>Una onda es una perturbación que viaja y lleva energía.</li>
<li>Tiene amplitud (qué tan alta), longitud de onda (qué tan larga) y frecuencia (cuántas por segundo).</li>
<li>Las ondas rebotan, se cruzan y se suman: ¡interferencia!</li>
</ul></div>

<div class="say" data-who="eco" data-mood="wow"><p>¿Has visto la «ola mexicana» en un estadio? Cada persona se levanta y se sienta, pero nadie se mueve de su puesto… ¡y la ola le da la vuelta a todo el estadio! Eso es una onda.</p></div>

<section>
<h2>Partes de una onda</h2>
<p>Imagina que mueves la punta de una cuerda arriba y abajo. Se forma una onda con crestas (partes altas) y valles (partes bajas):</p>
<ul>
<li><b>Amplitud:</b> qué tan alta es la cresta. Más amplitud, más energía.</li>
<li><b>Longitud de onda:</b> la distancia de una cresta a la siguiente.</li>
<li><b>Frecuencia:</b> cuántas ondas pasan por un punto en un segundo. Se mide en <dfn data-def="La unidad de frecuencia: un ciclo o vaivén por segundo.">hercios</dfn> (Hz).</li>
<li><b>Velocidad:</b> qué tan rápido viaja la onda.</li>
</ul>
<div class="magic" data-name="La fórmula de las ondas"><big>velocidad = frecuencia × longitud de onda</big>Si pasan 2 ondas por segundo y cada una mide 3 m, la onda viaja a 6 m/s.</div>
<div class="sim" data-sim="onda-cuerda" data-title="La cuerda que vibra" data-goal="Sacude la cuerda al ritmo justo para que se forme una onda estacionaria grande (resonancia).">
<ul><li>Envía un pulso: rebota en el extremo. Si el extremo es fijo, vuelve «al revés»; si es libre, vuelve «al derecho».</li><li>En continuo, al ritmo justo (0,5; 1,0; 1,5 Hz…) la cuerda se hace enorme.</li></ul>
</div>
<details class="curious"><p>Cuando una onda que va y otra que viene se cruzan con la frecuencia justa, forman una <strong>onda estacionaria</strong>: hay puntos que no se mueven (nodos) y puntos que se mueven mucho (vientres). Es lo que hace sonar las cuerdas de una guitarra y los tubos de una flauta. Una cuerda de largo L fija en ambos extremos vibra en las frecuencias f<sub>n</sub> = n·v/(2L), con n = 1, 2, 3…</p></details>
</section>

<section>
<h2>Dos tipos de ondas</h2>
<div class="cols2">
<div class="card"><div class="big-emoji">〰️</div><h4>Transversales</h4><p>Cada partícula se mueve de lado, perpendicular a la dirección en que viaja la onda. Ejemplos: una cuerda, la luz, las ondas de la superficie del agua.</p></div>
<div class="card"><div class="big-emoji">🌀</div><h4>Longitudinales</h4><p>Las partículas van y vienen en la misma dirección de la onda, comprimiéndose y estirándose. Ejemplos: el sonido, un resorte al que le das un empujón.</p></div>
</div>
<div class="sim" data-sim="trans-long" data-title="Ondas de lado y ondas de empujón" data-goal="Mira los dos tipos de onda y fíjate cómo se mueve la partícula roja.">
<ul><li>La partícula roja siempre vuelve a su sitio: solo la onda avanza.</li><li>En el sonido, el aire se comprime y se estira en la misma dirección en que viaja.</li></ul>
</div>
</section>

<section>
<h2>Cuando las ondas se encuentran</h2>
<p>Dos ondas pueden cruzarse sin molestarse y, cuando se encuentran, <strong>se suman</strong>. Dos crestas juntas forman una cresta enorme; una cresta con un valle se cancelan. A eso se le llama <dfn data-def="Lo que pasa cuando dos ondas se encuentran y se suman o se cancelan.">interferencia</dfn>. Si tiras dos piedras al estanque, verás el patrón en el agua: algunas zonas están muy agitadas y otras están en calma.</p>
<div class="sim" data-sim="rizos" data-title="Dos gotas en el estanque" data-goal="Separa las dos fuentes para conseguir cuatro o más líneas de calma entre ellas.">
<ul><li>Las líneas oscuras son zonas donde una cresta se encuentra con un valle y el agua casi no se mueve.</li><li>A más separación entre las fuentes o más pequeña la longitud de onda, más líneas.</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="La ola de la cuerda" data-time="15 min" data-level="1">
<ul class="mat"><li>🪢 Una cuerda o un resorte largo (como un slinky)</li><li>🎀 Una cinta de color</li><li>🧑‍🤝‍🧑 Un amigo</li></ul>
<ol class="steps"><li>Amarra la cinta en medio de la cuerda.</li><li>Tú sostienes un extremo y tu amigo el otro, con la cuerda un poco estirada, apoyada en el piso.</li><li>Sacude tu extremo de lado, una sola vez. Mira cómo viaja el pulso y qué hace la cinta.</li><li>Ahora sacude de lado una y otra vez: mira la forma de la onda.</li></ol>
<p class="predict">Cuando pase la onda, ¿la cinta viajará con ella hasta tu amigo?</p>
<p class="result">La cinta solo se mueve de lado y vuelve a su sitio. La onda llega al otro extremo, pero la cinta no.</p>
<p class="why">Una onda transporta energía, no materia. Cada parte de la cuerda empuja a la siguiente y vuelve a su lugar.</p>
</div>
<div class="exp" data-title="Ondas en una bandeja con agua" data-time="10 min" data-level="1">
<ul class="mat"><li>🥧 Una bandeja o fuente con agua (1 cm de profundidad)</li><li>💧 Un gotero o una pajilla</li><li>🔦 Una linterna (opcional)</li></ul>
<ol class="steps"><li>Pon la bandeja en una mesa y espera a que el agua quede quieta.</li><li>Deja caer una gota en el centro. Mira los círculos.</li><li>Deja caer dos gotas a la vez, en puntos separados, y observa dónde se cruzan las ondas.</li></ol>
<p class="predict">¿Qué pasará cuando se encuentren las ondas de las dos gotas?</p>
<p class="result">Se cruzan y siguen sus caminos sin chocar. Donde se encuentran, forman un dibujo de zonas movidas y zonas calmadas.</p>
<p class="why">Las ondas se suman donde se cruzan (interferencia), pero después cada una sigue como si nada.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>¿Qué transporta una onda?</p><ol><li>Materia</li><li>Energía</li><li>Color</li></ol><p class="why">Las ondas llevan energía de un lugar a otro sin llevar la materia.</p></div>
<div class="q" data-ans="2"><p>Si pasan 4 ondas por segundo y cada una mide 2 m, ¿a qué velocidad viaja la onda?</p><ol><li>2 m/s</li><li>6 m/s</li><li>8 m/s</li></ol><p class="why">velocidad = frecuencia × longitud de onda = 4 × 2 = 8 m/s.</p></div>
<div class="q" data-ans="0"><p>El sonido es una onda…</p><ol><li>Longitudinal</li><li>Transversal</li><li>De luz</li></ol><p class="why">El aire se comprime y se estira en la misma dirección en que viaja el sonido.</p></div>
<div class="q" data-ans="1"><p>Una cresta se encuentra con un valle de igual tamaño. ¿Qué pasa?</p><ol><li>Se hacen más grandes</li><li>Se cancelan</li><li>Rebotan</li></ol><p class="why">Se suman: una positiva y una negativa dan cero. Es interferencia destructiva.</p></div>
</div>
</template>

<!-- 21-sonido.html -->
<template class="chapter-src" data-id="sonido" data-num="21" data-world="5" data-title="El sonido" data-short="Qué es el sonido, el eco, cuánto va de rápido y por qué la ambulancia cambia de tono al pasar.">
<p class="lead">Tu voz, el timbre, un trueno, una guitarra: todos son <strong>sonido</strong>. El sonido es una onda que viaja por el aire (o por el agua, o por un sólido) y llega a tus oídos. ¡Vamos a escucharlo con ojos de físico!</p>

<div class="learn"><ul>
<li>El sonido es una onda de aire que se comprime y se estira.</li>
<li>Necesita materia para viajar: en el vacío no hay sonido.</li>
<li>Viaja a unos 343 m/s en el aire: mucho más lento que la luz.</li>
<li>Agudo o grave depende de la frecuencia; fuerte o suave, de la amplitud.</li>
</ul></div>

<div class="say" data-who="eco" data-mood="happy"><p>¡Soy Eco, el murciélago! Yo veo con los oídos: grito y escucho el eco de las cosas. Vamos a explorar el sonido, y recuerda activar el altavoz (🔊) arriba para escucharlo.</p></div>

<section>
<h2>¿Cómo se produce el sonido?</h2>
<p>Todo sonido nace de algo que <strong>vibra</strong>: una cuerda de guitarra, tus cuerdas vocales, el parlante de un celular. Al vibrar, empuja el aire de alrededor, que se aprieta y se afloja una y otra vez. Esas zonas de aire apretado y aflojado viajan como una onda, hasta tu oído, donde mueven el tímpano y tu cerebro lo interpreta como sonido.</p>
<div class="fact"><p>En el espacio no se escucha nada, porque no hay aire. Las explosiones de las películas espaciales ¡serían totalmente silenciosas! Y el sonido va más rápido en el agua (1500 m/s) y en el acero (5000 m/s) que en el aire.</p></div>

<h3>Agudo y grave, fuerte y suave</h3>
<ul>
<li>El <strong>tono</strong> (agudo o grave) depende de la <em>frecuencia</em>: cuántas vibraciones por segundo. Una frecuencia alta suena aguda, una baja suena grave.</li>
<li>El <strong>volumen</strong> (fuerte o suave) depende de la <em>amplitud</em>: qué tanto se mueve el aire.</li>
<li>Los humanos oímos frecuencias entre unos 20 Hz y 20 000 Hz. Los niños oyen más agudos que los adultos.</li>
</ul>
<div class="sim" data-sim="tono-volumen" data-title="Fabrica sonidos" data-goal="Haz sonar un sonido grave (menos de 200 Hz) y uno agudo (más de 1500 Hz). ¡Sube el volumen del altavoz de tu dispositivo con cuidado!">
<ul><li>Activa el sonido con el botón 🔊 de arriba.</li><li>Mira la onda: más ondas juntas es más agudo; más alta es más fuerte.</li><li>Prueba hasta qué agudo puedes oír: ¡los murciélagos oyen mucho más allá!</li></ul>
</div>
<div class="warn"><p>No pongas el volumen muy alto: los sonidos fuertes pueden dañar los oídos.</p></div>
</section>

<section>
<h2>El eco</h2>
<p>Cuando gritas frente a una montaña o un edificio grande, el sonido rebota y vuelve a ti: es el <dfn data-def="El sonido que rebota en una superficie y regresa, después de un tiempo.">eco</dfn>. El tiempo que tarda en volver depende de la distancia: ¡ida y vuelta! Como el sonido va a unos 343 m/s, si el eco tarda 2 segundos, la pared está a unos 343 m (343 × 2 ÷ 2).</p>
<div class="magic" data-name="Distancia con el eco"><big>distancia = 343 × tiempo ÷ 2</big>(se divide entre 2 porque el sonido va y vuelve)</div>
<div class="sim" data-sim="eco" data-title="Grita a la montaña" data-goal="Mide cuánto tarda el eco y adivina a qué distancia está la montaña. ¡Acércate al 10 %!">
<ul><li>Si el eco tarda 1 s, la montaña está a 171 m.</li><li>Los barcos usan el eco (sonar) para medir la profundidad del mar.</li></ul>
</div>
<div class="story" data-title="El trueno y el rayo"><p>La luz viaja casi un millón de veces más rápido que el sonido. Por eso ves el rayo primero y escuchas el trueno después. Cada 3 segundos entre el rayo y el trueno son aproximadamente 1 kilómetro de distancia a la tormenta.</p></div>
</section>

<section>
<h2>El efecto Doppler</h2>
<p>Cuando una ambulancia se acerca, su sirena suena más aguda. Y cuando se aleja, ¡suena más grave! Es como si las ondas se «apretaran» cuando vienen hacia ti y se «estiraran» cuando se alejan. Este cambio se llama <dfn data-def="El cambio de tono que escuchas cuando una fuente de sonido se acerca o se aleja de ti.">efecto Doppler</dfn>, por el físico austríaco Christian Doppler, que lo explicó en 1842.</p>
<div class="sim" data-sim="doppler" data-title="La ambulancia que pasa" data-goal="Pon la ambulancia a más de 20 m/s y deja que pase: escucha cómo baja el tono.">
<ul><li>Mira cómo las ondas se aprietan delante de la ambulancia y se estiran detrás.</li><li>Mientras más rápida va, mayor es el cambio de tono.</li></ul>
</div>
