      { t: '🌟 Una estrella', bin: 'luz', why: 'Las estrellas brillan: dan luz.' },
      { t: '🏔️ Una roca en lo alto de la montaña', bin: 'guard', why: 'La altura guarda energía (potencial).' }
    ], { need: 0.78 });
  });

  /* ---------- Montaña rusa ---------- */
  const PTS = [[0, 8], [3, 0.2], [8, 6], [12, 0.4], [16, 3.4], [19, 0.3], [22, 0.3]];
  const trackY = (x, h) => {
    const p = PTS.map((q, i) => (i ? q : [0, h]));
    let i = 0; while (i < p.length - 2 && x > p[i + 1][0]) i++;
    const t = M.clamp((x - p[i][0]) / (p[i + 1][0] - p[i][0]), 0, 1);
    return p[i][1] + (p[i + 1][1] - p[i][1]) * (1 - Math.cos(Math.PI * t)) / 2;
  };
  const trackSlope = (x, h) => (trackY(x + 0.01, h) - trackY(x - 0.01, h)) / 0.02;
  FK.sim('montana-rusa', function (g) {
    const ctx = g.canvas(2.1);
    g.slider('h', { label: 'Altura de salida', icon: '⛰️', min: 2, max: 10, step: 0.5, value: 5, unit: 'm', fmt: (v) => FK.n(v, 1), reset: true });
    g.toggle('fric', { label: 'Con fricción (pierde energía)', value: false, reset: true });
    g.button('¡Soltar!', () => { if (s.st === 'ready') { s.st = 'run'; FK.sfx.whoosh(); } }, { icon: '🎢' });
    g.out('v', 'Rapidez', { icon: '💨' }); g.out('hh', 'Altura', { icon: '📏' });
    const s = { st: 'ready', x: 0.2, v: 0, t: 0, loss: 0, E0: 0, end: 0 };
    const X0 = 40, PXM = 31, Y0 = 380 - 40, PYM = 29;
    g.run({
      init() { s.st = 'ready'; s.x = 0.2; s.v = 0; s.loss = 0; s.E0 = 9.8 * trackY(0.2, g.p.h); s.end = 0; g.say('Elige la altura de salida (la colina grande mide 6 m) y suelta el carrito.'); },
      step(dt) {
        if (s.st === 'ready') return;
        if (s.st === 'run') {
          const mu = g.p.fric ? 0.03 : 0, n = 12;
          for (let i = 0; i < n; i++) {
            const h = dt / n, sl = trackSlope(s.x, g.p.h), cs = 1 / Math.sqrt(1 + sl * sl), sn = sl * cs;
            let a = -9.8 * sn;
            if (Math.abs(s.v) > 1e-3) a -= mu * 9.8 * cs * Math.sign(s.v); else if (Math.abs(a) < mu * 9.8 * cs) a = 0;
            s.v += a * h; s.x += s.v * cs * h;
            s.loss += mu * 9.8 * cs * Math.abs(s.v) * h;
            if (s.x >= 21.9) { s.st = 'win'; break; }
            if (s.x < 0.1) { s.x = 0.1; s.v = 0; }
          }
          if (s.v < -0.05) { s.st = 'back'; g.say('¡Ay! No alcanzó la cima y se devolvió. Sube la altura de salida.', 'sad'); FK.sfx.no(); }
          const y = trackY(s.x, g.p.h);
          g.show('v', FK.n(Math.abs(s.v), 1) + ' m/s'); g.show('hh', FK.n(y, 1) + ' m');
        }
        if (s.st === 'win') { s.st = 'done'; g.win('¡Pasó todas las colinas! La energía de altura alcanzó.'); }
        if (s.st === 'back' || s.st === 'done') { s.end += dt; }
      },
      draw(c, W, H) {
        D.sky(c, W, H, '#BFE9FF', '#EAF8FF'); D.cloud(c, 500, 50, 1); D.cloud(c, 90, 90, 0.8);
        const h = g.p.h;
        c.beginPath(); c.moveTo(X0, Y0 + 40);
        for (let x = 0; x <= 22; x += 0.1) c.lineTo(X0 + x * PXM, Y0 - trackY(x, h) * PYM);
        c.lineTo(X0 + 22 * PXM, Y0 + 40); c.closePath(); c.fillStyle = '#B9824A'; c.fill();
        c.beginPath(); for (let x = 0; x <= 22; x += 0.1) { const px = X0 + x * PXM, py = Y0 - trackY(x, h) * PYM; x ? c.lineTo(px, py) : c.moveTo(px, py); }
        c.lineWidth = 6; c.strokeStyle = '#FF4757'; c.stroke();
        /* marcas de altura */
        D.line(c, X0 + 8 * PXM, Y0 - 6 * PYM, X0 + 8 * PXM, Y0 - 6 * PYM - 40, D.INK, 2); D.tag(c, 'colina de 6 m', X0 + 8 * PXM, Y0 - 6 * PYM - 52, '#FFF1B8', { size: 13 });
        D.line(c, X0 - 8, Y0 - h * PYM, X0 + 30, Y0 - h * PYM, '#1E88FF', 2, [6, 5]); D.text(c, FK.n(h, 1) + ' m', X0 - 4, Y0 - h * PYM - 14, { size: 14, color: '#1E88FF', weight: 700 });
        D.text(c, '🏁', X0 + 22 * PXM - 10, Y0 - 0.3 * PYM - 26, { size: 26 });
        /* carrito */
        const y = trackY(s.x, h), sl = trackSlope(s.x, h), ang = Math.atan(sl);
        c.save(); c.translate(X0 + s.x * PXM, Y0 - y * PYM); c.rotate(-Math.atan2(sl * PYM, PXM)); D.box(c, -16, -26, 32, 20, '#FFC21A', { r: 6 }); D.char(c, 'newti', 0, -30, 34, s.st === 'back' ? 'sad' : 'happy'); D.circle(c, -9, -4, 5, D.INK); D.circle(c, 9, -4, 5, D.INK); c.restore();
        /* barras de energía */
        const E0 = s.E0 || 1, ke = 0.5 * s.v * s.v, pe = 9.8 * y, ht = Math.max(0, E0 - ke - pe);
        const bx = W - 150, by = 30;
        D.bar(c, bx, by, 130, 18, ke / Math.max(E0, 1), '#FF4757', 'movimiento', { size: 12 });
        D.bar(c, bx, by + 24, 130, 18, pe / Math.max(E0, 1), '#1E88FF', 'altura', { size: 12 });
        D.bar(c, bx, by + 48, 130, 18, g.p.fric ? ht / Math.max(E0, 1) : 0, '#FF8A1F', 'calor', { size: 12 });
      }
    });
  });

  /* ---------- Lanzador de resorte ---------- */
  FK.sim('resorte-lanzador', function (g) {
    const ctx = g.canvas(1.7);
    const KS = { blando: ['Blando', 100], medio: ['Medio', 200], duro: ['Duro', 400] };
    g.choice('k', { label: 'Resorte', icon: '🌀', options: Object.keys(KS).map((k) => [k, KS[k][0] + ' (' + KS[k][1] + ' N/m)']), value: 'medio', reset: true });
    g.slider('x', { label: 'Cuánto lo aprietas', icon: '🤏', min: 0.1, max: 0.4, step: 0.01, value: 0.25, fmt: (v) => FK.n(v * 100, 0) + ' cm', reset: true });
    g.button('¡Soltar!', () => { if (s.st === 'ready') { s.st = 'push'; FK.sfx.pop(); } }, { icon: '🚀' });
    g.out('pred', 'Altura que alcanzará', { icon: '📈', hl: true }); g.out('ener', 'Energía guardada', { icon: '🔋' });
    const MASS = 0.5, s = { st: 'ready', y: 0, v: 0, apex: 0, target: 3, tries: 0 };
    const gnd = (H) => H - 50, PXM = 56;
    g.run({
      init() {
        const k = KS[g.p.k][1], x = g.p.x; s.st = 'ready'; s.y = -x; s.v = 0; s.apex = 0;
        if (!s.keep) s.target = Math.round(M.rnd(1, 5) * 2) / 2; s.keep = true;
        g.goal(`Haz que la bola llegue a la estrella, a ${FK.n(s.target, 1)} m sobre el punto de salida (margen: 25 cm).`);
        g.show('pred', FK.n(C.springHeight(k, x, MASS, 9.8), 2) + ' m'); g.show('ener', FK.n(0.5 * k * x * x, 1) + ' J');
        g.say('Escoge el resorte y cuánto lo aprietas. Luego suelta.');
      },
      step(dt) {
        if (s.st === 'ready' || s.st === 'done') return;
        const k = KS[g.p.k][1], x = g.p.x, n = 20;
        for (let i = 0; i < n; i++) {
          const h = dt / n; let a;
          if (s.st === 'push') { a = (k * (-s.y)) / MASS - 9.8; if (s.y >= 0) s.st = 'fly'; } else a = -9.8;
          if (s.st === 'push' && a < 0 && s.v <= 0) { /* no alcanza a salir */ }
          s.v += a * h; s.y += s.v * h; s.apex = Math.max(s.apex, s.y);
          if (s.st === 'fly' && s.v <= 0) { s.st = 'done'; break; }
        }
        if (s.st === 'done') {
          const ok = Math.abs(s.apex - s.target) <= 0.25;
          if (ok) { g.win(`¡Llegó a ${FK.n(s.apex, 2)} m, justo a la estrella!`); s.keep = false; }
          else g.say(`Llegó a ${FK.n(s.apex, 2)} m y la estrella está a ${FK.n(s.target, 1)} m. ${s.apex < s.target ? 'Aprieta más el resorte o usa uno más duro.' : 'Aprieta menos el resorte.'}`, 'think');
        }
      },
      draw(c, W, H) {
        D.sky(c, W, H, '#E6E0FF', '#F8F5FF'); D.grid(c, W, H, 40);
        const gy = gnd(H), x0 = 200, top0 = gy - 90; /* punto de salida a 90 px del suelo */
        const Y = (m) => top0 - m * PXM;
        D.box(c, x0 - 40, gy, 80, 40, '#8A8AA0', { r: 8 });
        D.box(c, x0 - 28, top0, 8, gy - top0, '#C9C9D9', { r: 3, lw: 2 }); D.box(c, x0 + 20, top0, 8, gy - top0, '#C9C9D9', { r: 3, lw: 2 });
        D.spring(c, x0, gy, x0, Y(s.st === 'ready' ? -g.p.x : Math.min(0, s.y)) + 22, 9, 18, '#FF4757', 5);
        const by = Y(s.y);
        D.circle(c, x0, by, 20, '#FFC21A', D.INK, 3);
        D.line(c, x0 - 150, top0, x0 + 150, top0, '#1E88FF', 2, [6, 6]); D.text(c, '0 m (punto de salida)', x0 + 160, top0, { size: 14, color: '#1E88FF', weight: 700 });
        for (let m = 1; m <= 6; m++) { D.line(c, x0 + 90, Y(m), x0 + 104, Y(m), D.INK, 2); D.text(c, m + ' m', x0 + 112, Y(m), { size: 13 }); }
        D.emoji(c, '⭐', x0 + 300, Y(s.target), 44); D.line(c, x0 + 120, Y(s.target), x0 + 275, Y(s.target), '#FFC21A', 3, [4, 6]);
        D.emoji(c, '🐱', 90, gy - 20, 60);
        if (s.apex > 0) D.tag(c, 'máximo: ' + FK.n(s.apex, 2) + ' m', x0 + 340, Y(s.apex), '#fff', { size: 14 });
      }
    });
  });
})();

    g.slider('dR', { label: 'Distancia derecha al centro', icon: '↔️', min: 0.5, max: 3, step: 0.25, value: 1.5, unit: 'm', fmt: (v) => FK.n(v, 2) });

        const w = (m, d, col, side) => { const x = side * d * px, sz = 26 + m * 0.55; D.box(c, x - sz / 2, -10 - sz, sz, sz, col, { r: 6 }); D.text(c, m + ' kg', x, -10 - sz / 2, { size: Math.max(11, sz / 3.2), align: 'center', color: '#fff' }); };
        c.save(); w(g.p.mL, g.p.dL, '#FF4757', -1); w(g.p.mR, g.p.dR, '#1E88FF', 1); c.restore();

    g.slider('m', { label: 'Masa de la carga', icon: '⚖️', min: 20, max: 150, step: 10, value: 100, unit: 'kg', fmt: (v) => FK.n(v, 0), reset: true });
    g.button('¡Jalar!', () => { if (s.st === 'ready') { const F = (g.p.m * 9.8) / g.p.n; if (F <= 250) { s.st = 'lift'; FK.sfx.pop(); } else { s.st = 'fail'; FK.sfx.no(); g.say(`Se necesitan ${FK.n(F, 0)} N y Newti solo puede hacer 250 N. ¡Usa más cuerdas!`, 'sad'); } } }, { icon: '💪' });
    g.out('F', 'Fuerza necesaria', { icon: '💪', hl: true }); g.out('L', 'Cuerda que jalas para subir 2 m', { icon: '📏' });

        const gy = H - 40, top = 40, bx = 360, pxm = 60;

        D.arrow(c, nx - 50, gy - 100, nx - 50, gy - 100 + Math.min(70, 70 * (g.p.m * 9.8) / g.p.n / 250), '#FF4757', 8);
        D.text(c, 'jala', nx - 70, gy - 80, { size: 14, align: 'right', color: '#FF4757', weight: 700 });

(function () {
  'use strict';

  /* ---------- La honda ---------- */
  FK.sim('honda', function (g) {
    const ctx = g.canvas(2);
    g.slider('w', { label: 'Rapidez de giro', icon: '🌀', min: 2, max: 7, step: 0.5, value: 4, unit: 'rad/s', fmt: (v) => FK.n(v, 1) });
    g.slider('R', { label: 'Largo de la cuerda', icon: '📏', min: 60, max: 150, step: 10, value: 100, unit: 'cm', fmt: (v) => FK.n(v, 0) });
    g.toggle('guia', { label: 'Mostrar la dirección de salida', value: true });
    g.button('¡Soltar!', () => release(), { icon: '🎯' });
    g.out('v', 'Rapidez de la piedra', { icon: '💨' }); g.out('h', 'Aciertos', { icon: '⭐', hl: true });
    const cx = 400, cy = 200, S = { th: 0, stone: null, tx: 0, ty: 0, hits: 0, msg: 0 };
    const newTarget = () => { const a = M.rnd(0, M.TAU), r = M.rnd(210, 300); S.tx = cx + r * Math.cos(a); S.ty = cy + r * Math.sin(a) * 0.62; S.ty = M.clamp(S.ty, 40, 360); };
    function release() {
      if (S.stone) return;
      const R = g.p.R, w = g.p.w;
      S.stone = { x: cx + R * Math.cos(S.th), y: cy + R * Math.sin(S.th), vx: -R * w * Math.sin(S.th) * 1.6, vy: R * w * Math.cos(S.th) * 1.6, t: 0 };
      FK.sfx.whoosh();
    }
    g.run({
      init() { S.stone = null; S.th = 0; if (!S.tx) newTarget(); g.show('h', S.hits + ' de 3'); g.say('La piedra gira. ¡Suéltala cuando salga derecho hacia el blanco!'); },
      step(dt) {
        g.show('v', FK.n((g.p.R / 100) * g.p.w, 1) + ' m/s');
        if (!S.stone) S.th += g.p.w * dt;
        else {
          const st = S.stone; st.x += st.vx * dt; st.y += st.vy * dt; st.t += dt;
          if (Math.hypot(st.x - S.tx, st.y - S.ty) < 28) { S.hits++; S.stone = null; FK.sfx.ok(); g.show('h', S.hits + ' de 3'); newTarget(); if (S.hits >= 3) { g.win('¡3 blancos! ¡Eres un pastor con muy buena puntería!'); S.hits = 0; } else g.say('¡Dio en el blanco!', 'wow'); }
          else if (st.x < -40 || st.x > 840 || st.y < -40 || st.y > 440 || st.t > 4) { S.stone = null; FK.sfx.no(); g.say('Falló. Fíjate: la piedra salió en línea recta, tangente al círculo. ¡Suéltala antes o después!', 'think'); }
        }
      },
      draw(c, W, H) {
        D.sky(c, W, H, '#D9F2C6', '#EAF9DD'); D.grid(c, W, H, 50, 'rgba(43,35,80,.07)');
        D.circle(c, cx, cy, g.p.R, null, 'rgba(43,35,80,.25)', 2);
        const sx = S.stone ? S.stone.x : cx + g.p.R * Math.cos(S.th), sy = S.stone ? S.stone.y : cy + g.p.R * Math.sin(S.th);
        if (!S.stone) {
          D.line(c, cx, cy, sx, sy, '#A9743B', 4);
          if (g.p.guia) { const tx = -Math.sin(S.th), ty = Math.cos(S.th); D.line(c, sx, sy, sx + tx * 600, sy + ty * 600, '#FF4757', 3, [10, 8]); D.arrow(c, sx, sy, sx + tx * 70, sy + ty * 70, '#FF4757', 6); }
        }
        D.emoji(c, '🎯', S.tx, S.ty, 52);
        D.char(c, 'newti', cx, cy, 70, 'wow');
        D.circle(c, sx, sy, 12, '#8A8AA0', D.INK, 3);
      }
    });
    g.pointer({ down: () => release() });
  });

  /* ---------- La patinadora ---------- */
  FK.sim('patinadora', function (g) {
    const ctx = g.canvas(2.4);
    g.slider('r', { label: 'Brazos abiertos', icon: '🙆', min: 0.1, max: 0.9, step: 0.05, value: 0.9, unit: 'm', fmt: (v) => FK.n(v, 2) });
    g.toggle('pesas', { label: 'Con pesas en las manos', value: false });
    g.out('w', 'Rapidez de giro', { icon: '🌀', hl: true }); g.out('I', 'Vueltas por segundo', { icon: '🔄' });
    const L = 3.0, I0 = 0.4, S = { th: 0, w: 2.9 };
    g.run({
      init() { S.th = 0; S.w = 2.9; g.say('La patinadora gira sin que nadie la empuje. Encoge los brazos y mira qué pasa.'); },
      step(dt) {
        const target = C.skaterOmega(L, I0, g.p.pesas ? 2.4 : 0.8, g.p.r);
        S.w += (target - S.w) * Math.min(1, dt * 6);
        S.th += S.w * dt;
        g.show('w', FK.n(S.w, 1) + ' rad/s'); g.show('I', FK.n(S.w / M.TAU, 2) + ' vueltas/s');
        if (S.w / M.TAU > 1.0) g.win('¡Más de una vuelta por segundo! Encoger los brazos aumenta el giro.');
      },
      draw(c, W, H) {
        D.sky(c, W, H, '#E3F6FF', '#FFFFFF');
        const cx = W / 2, cy = H / 2 + 10, rpx = g.p.r * 190;
        D.circle(c, cx, cy, 168, 'rgba(142,92,246,.10)', 'rgba(142,92,246,.35)', 3);
        c.save(); c.translate(cx, cy); c.rotate(S.th);
        D.line(c, -rpx, 0, rpx, 0, '#FF8FB1', 14);
        const hand = g.p.pesas ? 20 : 11, col = g.p.pesas ? '#8E5CF6' : '#FFC21A';
        D.circle(c, -rpx, 0, hand, col, D.INK, 3); D.circle(c, rpx, 0, hand, col, D.INK, 3);
        D.circle(c, 0, 0, 34, '#FF3E9D', D.INK, 4); D.circle(c, 0, 0, 20, '#FFD6E3');
        D.circle(c, 0, -8, 9, '#FFE0B8', D.INK, 2);
        c.restore();
        D.text(c, 'vista desde arriba', 14, 24, { size: 15, color: D.INK });
        const rev = (S.th / M.TAU) | 0; D.text(c, 'vueltas: ' + rev, W - 14, 24, { size: 17, align: 'right', weight: 700 });
      }
    });
  });
})();

/* ==== chapters/11-choques.js ==== */
/* Capítulo 11 — Choques y rebotes */
(function () {
  'use strict';
  const FK = window.FK, D = FK.d, M = FK.M, C = FK.calc;

  /* ---------- Billar ---------- */
  FK.sim('billar', function (g) {
    const ctx = g.canvas(3);
    g.slider('mA', { label: 'Masa de la bola azul', icon: '🔵', min: 1, max: 5, step: 1, value: 2, unit: 'kg', fmt: (v) => FK.n(v, 0), reset: true });
    g.slider('vA', { label: 'Rapidez de la azul', icon: '💨', min: 1, max: 6, step: 1, value: 4, unit: 'm/s', fmt: (v) => FK.n(v, 0), reset: true });
    g.slider('mB', { label: 'Masa de la bola roja', icon: '🔴', min: 1, max: 5, step: 1, value: 1, unit: 'kg', fmt: (v) => FK.n(v, 0), reset: true });
    g.choice('tipo', { label: 'Tipo de choque', icon: '💥', options: [['el', 'Rebotan (elástico)'], ['pe', 'Se pegan']], value: 'el', reset: true });
    g.button('¡Lanzar!', () => { if (S.st === 'ready') { S.st = 'go'; FK.sfx.pop(); } }, { icon: '🎱' });
    g.out('a', 'Azul después', { icon: '🔵' }); g.out('b', 'Roja después', { icon: '🔴' }); g.out('p', 'Momento total', { icon: '⚖️' });
    const PX = 70;
    const S = { st: 'ready', xa: 60, xb: 420, hit: false, va: 0, vb: 0 };
    g.run({
      init() { S.st = 'ready'; S.xa = 60; S.xb = 420; S.hit = false; S.va = g.p.vA; S.vb = 0; g.show('a', '—'); g.show('b', '—'); g.show('p', FK.n(g.p.mA * g.p.vA, 0) + ' kg·m/s'); g.say('La bola azul va hacia la roja, que está quieta. ¿Qué pasará después del choque?'); },
      step(dt) {
        if (S.st !== 'go') return;
        S.xa += S.va * PX * dt; S.xb += S.vb * PX * dt;
        const rA = 12 + g.p.mA * 5, rB = 12 + g.p.mB * 5;
        if (!S.hit && S.xb - S.xa <= rA + rB) {
          S.hit = true;
          const r = g.p.tipo === 'el' ? C.collide1D(g.p.mA, g.p.vA, g.p.mB, 0) : C.stick1D(g.p.mA, g.p.vA, g.p.mB, 0);
          S.va = r[0]; S.vb = r[1]; FK.sfx.pop();
          g.show('a', FK.n(S.va, 2) + ' m/s'); g.show('b', FK.n(S.vb, 2) + ' m/s');
          const tot = g.p.mA * S.va + g.p.mB * S.vb; g.show('p', FK.n(tot, 0) + ' kg·m/s (igual)');
          if (g.p.tipo === 'el' && Math.abs(S.va) < 0.05) g.win('¡La azul se detuvo! Con masas iguales, toda la rapidez pasa a la otra bola.');
          else g.say(g.p.tipo === 'el' ? `La azul queda con ${FK.n(S.va, 2)} m/s y la roja sale con ${FK.n(S.vb, 2)} m/s.` : `Se pegaron y salen juntas con ${FK.n(S.va, 2)} m/s.`, 'wow');
        }
        if (S.xa < -40 || S.xb > 900) S.st = 'end';
      },
      draw(c, W, H) {
        D.sky(c, W, H, '#1F8A5B', '#2AA874');
        D.box(c, 6, 6, W - 12, H - 12, 'rgba(0,0,0,0)', { stroke: '#8A5A2B', lw: 10, r: 18 });
        D.line(c, 30, H / 2, W - 30, H / 2, 'rgba(255,255,255,.12)', 2, [8, 10]);
        const rA = 12 + g.p.mA * 5, rB = 12 + g.p.mB * 5;
        D.circle(c, S.xb, H / 2, rB, '#FF4757', D.INK, 3); D.text(c, g.p.mB + ' kg', S.xb, H / 2, { size: 13, align: 'center', color: '#fff' });
        D.circle(c, S.xa, H / 2, rA, '#1E88FF', D.INK, 3); D.text(c, g.p.mA + ' kg', S.xa, H / 2, { size: 13, align: 'center', color: '#fff' });
        if (S.st === 'ready') D.arrow(c, S.xa + rA + 6, H / 2 - 40, S.xa + rA + 6 + g.p.vA * 18, H / 2 - 40, '#FFE066', 7);
      }
    });
  });

  /* ---------- Cuna de Newton ---------- */
  FK.sim('cuna-newton', function (g) {
    const ctx = g.canvas(2.2);
    g.slider('k', { label: 'Bolas que levantas', icon: '⬆️', min: 1, max: 3, step: 1, value: 2, reset: true });
    g.choice('pred', { label: 'Mi predicción: ¿cuántas salen?', icon: '🤔', options: [[1, '1'], [2, '2'], [3, '3']], value: 1 });
    g.button('¡Soltar!', () => { if (S.st === 'ready') { S.st = 'go'; S.t = 0; FK.sfx.pop(); } }, { icon: '🔔' });
    g.out('sal', 'Salen', { icon: '🔔', hl: true });
    const T = 1.6, TH = 0.7, S = { st: 'ready', t: 0, said: false };
    g.run({
      init() { S.st = 'ready'; S.t = 0; S.said = false; g.show('sal', '—'); g.say('Elige cuántas bolas levantas, adivina cuántas saldrán y suelta.'); },
      step(dt) {
        if (S.st !== 'go') return;
        S.t += dt;
        if (!S.said && S.t > T * 0.25 + 0.25) {
          S.said = true; g.show('sal', g.p.k);
          if (g.p.pred === g.p.k) g.win(`¡Acertaste! Salieron ${g.p.k}: el movimiento pasa de bola en bola.`); else g.say(`Salieron ${g.p.k}, igual que las que levantaste. ¡Intenta otra vez!`, 'think');
        }
      },
      draw(c, W, H) {
        D.sky(c, W, H, '#FFF6E5', '#FFE9C7');
        const top = 40, L = 220, n = 7, r = 27, x0 = W / 2 - (n - 1) * r;

(function () {

    const S = { st: 'ready', y: 0, vy: 0, ok: 0, settled: false };

      },
      draw(c, W, H) {

(function () {
  'use strict';
  const FK = window.FK, D = FK.d, M = FK.M, C = FK.calc;

  /* ---------- Conducción: cucharas ---------- */
  const BARS = [['Aluminio', 1.0, '#C9D2E8'], ['Acero', 0.12, '#9AA3BC'], ['Vidrio', 0.012, '#BFE9F2'], ['Madera', 0.0015, '#C98A3F']];
  FK.sim('conduccion', function (g) {
    const ctx = g.canvas(2.1);
    g.choice('vel', { label: 'Velocidad del tiempo', icon: '⏩', options: [[1, 'Normal'], [4, 'Rápido'], [16, 'Muy rápido']], value: 4, onchange: (v) => { g.speed = v; } });
    g.button('🔥 Encender la llama', () => { S.on = true; FK.sfx.pop(); }, { kind: 'primary' });
    g.out('c', 'Bolitas caídas', { icon: '🧈', hl: true });
    const N = 30, BEAD = 24, S = { T: BARS.map(() => new Array(N).fill(0)), on: false, fell: BARS.map(() => null), drop: BARS.map(() => 0), t: 0, n: 0 };
    g.speed = 4;
    g.run({
      init() { S.T = BARS.map(() => new Array(N).fill(0)); S.on = false; S.fell = BARS.map(() => null); S.drop = BARS.map(() => 0); S.t = 0; g.show('c', '0'); g.say('Enciende la llama y mira cómo viaja el calor por cada cuchara.'); },
      step(dt) {
        if (!S.on) return;
        S.t += dt;
        const sub = Math.max(1, Math.round(dt * 60 * 6));
        for (let s = 0; s < sub; s++) BARS.forEach((b, i) => {
          const T = S.T[i], r = 0.45 * b[1], T0 = T.slice(); T[0] = 1;
          for (let k = 1; k < N - 1; k++) T[k] = T0[k] + r * (T0[k + 1] - 2 * T0[k] + (k === 1 ? 1 : T0[k - 1]));
          T[N - 1] = T[N - 2];
        });
        let n = 0;
        BARS.forEach((b, i) => { if (S.fell[i] === null && S.T[i][BEAD] > 0.22) { S.fell[i] = S.t; FK.sfx.tick(); } if (S.fell[i] !== null) { n++; S.drop[i] += dt * 400 * Math.min(1, (S.t - S.fell[i]) + 0.2); } });
        g.show('c', n + ' de 4');

      },

          if (b[0] === 'Madera' && S.t > 8 && S.fell[i] === null) D.tag(c, 'no cae…', bx + 20, y + bh + 14, '#FFC7CD', { size: 12 });
        });

  /* ---------- Convección ---------- */
  FK.sim('conveccion', function (g) {
    const ctx = g.canvas(1.9);

    g.out('t', 'Tiempo con fuego fuerte', { icon: '⏱️', hl: true });
    const NP = 150;
    const P = Array.from({ length: NP }, () => ({ x: Math.random(), y: Math.random(), T: 0.2 }));
    const S = { hold: 0 };
    g.run({
      init() { S.hold = 0; P.forEach((p) => { p.x = Math.random(); p.y = Math.random(); p.T = 0.2; }); g.say('Sube el fuego a más del 70 % y mira las corrientes durante unos 8 segundos.'); },
      step(dt) {
        const f = g.p.f / 100, A = 0.045 * f;
        P.forEach((p) => {
          const u = A * Math.PI * Math.sin(2 * Math.PI * p.x) * Math.cos(Math.PI * p.y) * 6, v = -A * 2 * Math.PI * Math.cos(2 * Math.PI * p.x) * Math.sin(Math.PI * p.y) * 6;
          p.x += u * dt + (Math.random() - 0.5) * 0.006; p.y += v * dt + (Math.random() - 0.5) * 0.006;
          if (p.x < 0.01) p.x = 0.01; if (p.x > 0.99) p.x = 0.99;

          const heat = p.y < 0.25 ? f * 1.6 : 0, cool = p.y > 0.75 ? 1.2 : 0;

        });

        if (S.hold >= 8 && !S.said) { S.said = true; g.win('¡Se formaron corrientes de convección! Lo caliente sube y lo frío baja.'); }
      },

        for (let i = 0; i < 5; i++) D.emoji(c, f > 0.05 ? '🔥' : '▫️', x0 + 60 + i * 95, bot + 40, 20 + f * 34);
        D.text(c, '↑ sube lo caliente', x0 + w / 2, top + 20, { size: 15, align: 'center', color: '#C0182B', weight: 700 });

  /* ---------- Camisetas al sol ---------- */
  const SHIRT = [['Blanca', 0.2, '#FFFFFF'], ['Amarilla', 0.45, '#FFD84D'], ['Roja', 0.7, '#FF4757'], ['Negra', 0.95, '#2B2350']];
  FK.sim('radiacion-color', function (g) {

    g.button('Pasar 10 minutos', () => g.setSlider('min', 10), { icon: '⏩' });
    g.out('x', 'La más caliente', { icon: '🔥', hl: true });
    g.run({

      draw(c, W, H) {

        const t = g.p.min; let best = 0;
        SHIRT.forEach((s, i) => {

          D.box(c, x - 40, 110, 80, 70, s[2], { r: 14 });

/* Capítulo 17 — Sólido, líquido, gas y plasma */
(function () {
  'use strict';
  const FK = window.FK, D = FK.d, M = FK.M, C = FK.calc;

  /* ---------- La fiesta de las moléculas: dinámica molecular 2D (Lennard-Jones, unidades reducidas) ---------- */
  FK.sim('fiesta-moleculas', function (g) {
    const ctx = g.canvas(1.8);
    g.slider('T', { label: 'Temperatura', icon: '🌡️', min: 0.03, max: 1.6, step: 0.01, value: 0.1, fmt: (v) => (v < 0.2 ? 'muy fría' : v < 0.5 ? 'fresca' : v < 0.9 ? 'caliente' : 'ardiente') });
    g.out('est', 'Estado', { icon: '🔬', hl: true }); g.out('z', 'Vecinos por partícula', { icon: '🤝' });
    const N = 48, LX = 22, LY = 13, DT = 0.005;
    const P = [];
    const S = { z: 4, seen: new Set() };
    const init = () => {
      P.length = 0;
      const cols = 8;
      for (let i = 0; i < N; i++) P.push({ x: 4 + (i % cols) * 1.12 + ((Math.floor(i / cols)) % 2) * 0.56, y: 3 + Math.floor(i / cols) * 0.97, vx: M.gauss() * 0.2, vy: M.gauss() * 0.2, fx: 0, fy: 0 });
    };
    const forces = () => {
      for (const p of P) { p.fx = 0; p.fy = 0; }
      for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
        const a = P[i], b = P[j], dx = a.x - b.x, dy = a.y - b.y, r2 = dx * dx + dy * dy;
        if (r2 > 6.25) continue;
        const ir2 = 1 / Math.max(r2, 0.64), ir6 = ir2 * ir2 * ir2, f = 24 * (2 * ir6 * ir6 - ir6) * ir2;
        a.fx += f * dx; a.fy += f * dy; b.fx -= f * dx; b.fy -= f * dy;
      }
    };
    g.run({
      init() { init(); S.seen.clear(); forces(); g.say('Las partículas se atraen y se mueven. Cambia la temperatura y mira qué pasa.'); },
      step() {
        const T0 = g.p.T;
        for (let s = 0; s < 14; s++) {
          for (const p of P) { p.vx += 0.5 * DT * p.fx; p.vy += 0.5 * DT * p.fy; p.x += DT * p.vx; p.y += DT * p.vy;
            if (p.x < 0.5) { p.x = 0.5; p.vx = Math.abs(p.vx); } if (p.x > LX - 0.5) { p.x = LX - 0.5; p.vx = -Math.abs(p.vx); }
            if (p.y < 0.5) { p.y = 0.5; p.vy = Math.abs(p.vy); } if (p.y > LY - 0.5) { p.y = LY - 0.5; p.vy = -Math.abs(p.vy); } }
          forces();
          let ke = 0; for (const p of P) { p.vx += 0.5 * DT * p.fx; p.vy += 0.5 * DT * p.fy; ke += p.vx * p.vx + p.vy * p.vy; }
          const T = ke / (2 * N), lam = Math.sqrt(1 + 0.02 * (T0 / Math.max(T, 1e-6) - 1));
          for (const p of P) { p.vx *= lam; p.vy *= lam; }
        }
        /* vecinos: pares a menos de 1,4 */
        let pairs = 0; for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) { const dx = P[i].x - P[j].x, dy = P[i].y - P[j].y; if (dx * dx + dy * dy < 1.96) pairs++; }
        S.z += ((2 * pairs) / N - S.z) * 0.05;
        const st = S.z >= 4.6 ? 'sólido' : S.z >= 2.2 ? 'líquido' : 'gas';
        g.dbg = { z: S.z, st };
        g.show('est', st === 'sólido' ? '🧊 sólido' : st === 'líquido' ? '💧 líquido' : '☁️ gas'); g.show('z', FK.n(S.z, 1));
        if (g.t > 1.5) S.seen.add(st);
        if (S.seen.size >= 3 && !g.won()) g.win('¡Viste los tres estados! Más temperatura = partículas más rápidas y más separadas.');
      },
      draw(c, W, H) {
        D.sky(c, W, H, '#FFF6E5', '#FFE9C7');
        const sc = (W - 80) / LX, ox = 40, oy = H - 30 - LY * sc * 0.0;
        const bx = ox, by = 30, bw = LX * sc, bh = Math.min(H - 60, LY * sc);
        D.box(c, bx, by, bw, bh, '#fff', { r: 14, lw: 5 });
        const syy = bh / LY;
        for (const p of P) { const sp = Math.hypot(p.vx, p.vy); D.circle(c, bx + p.x * sc, by + p.y * syy, 0.5 * Math.min(sc, syy) * 1.05, D.heat(Math.min(1, sp / 2.4)), D.INK, 2); }
        D.char(c, 'flamo', W - 56, H - 36, 56, 'happy');
      }
    });
  });

  /* ---------- Calentar un cubo de hielo ---------- */
  FK.sim('curva-agua', function (g) {
    const ctx = g.canvas(2.1);
    g.slider('P', { label: 'Potencia del calentador', icon: '🔌', min: 200, max: 2000, step: 100, value: 600, unit: 'W', fmt: (v) => FK.int(v) });
    g.button('▶ Calentar', () => { S.on = true; }, { kind: 'primary' }); g.button('⏸ Pausa', () => { S.on = false; }, { kind: 'ghost' });
    g.out('T', 'Temperatura', { icon: '🌡️', hl: true }); g.out('f', 'Fase', { icon: '🔬' }); g.out('t', 'Tiempo', { icon: '⏱️' });
    const MASS = 100, S = { Q: 0, on: false, hist: [], t: 0 };
    const QMAX = C.heatCurve(1e9, MASS).Qtotal;
    g.run({
      init() { S.Q = 0; S.on = false; S.hist = [[0, -20]]; S.t = 0; g.say('Tienes 100 g de hielo a −20 °C. Presiona «Calentar» y mira la gráfica.'); },
      step(dt) {
        if (S.on && S.Q < QMAX) { const dQ = g.p.P * dt * 30; S.Q += dQ; S.t += dt * 30; const r = C.heatCurve(S.Q, MASS); S.hist.push([S.Q, r.T]); if (S.hist.length > 2000) S.hist = S.hist.filter((_, i) => i % 2 === 0); }
        const r = C.heatCurve(S.Q, MASS);
        g.show('T', FK.n(r.T, 1) + ' °C'); g.show('f', { hielo: '🧊 hielo', derrite: '🧊💧 derritiéndose', agua: '💧 agua', hierve: '💧☁️ hirviendo', vapor: '☁️ vapor' }[r.phase]); g.show('t', FK.n(S.t / 60, 1) + ' min');
        if (r.phase === 'hierve' && r.frac > 0.3 && !g.won()) g.win('¡Está hirviendo! Fíjate: la temperatura se quedó en 100 °C mientras cambia de líquido a gas.');
      },
      draw(c, W, H) {
        D.sky(c, W, H, '#FFF6E5', '#FFE9C7');
        const r = C.heatCurve(S.Q, MASS);
        /* gráfica */
        const gx = 300, gy = 30, gw = W - 330, gh = H - 80;
        D.box(c, gx, gy, gw, gh, '#fff', { r: 10 });
        const X = (q) => gx + 12 + (q / QMAX) * (gw - 24), Y = (t) => gy + gh - 16 - ((t + 30) / 170) * (gh - 36);
        for (const t of [0, 100]) { D.line(c, gx + 8, Y(t), gx + gw - 8, Y(t), 'rgba(43,35,80,.2)', 2, [6, 6]); D.text(c, t + ' °C', gx + 14, Y(t) - 10, { size: 13 }); }
        c.beginPath(); S.hist.forEach((p, i) => (i ? c.lineTo(X(p[0]), Y(p[1])) : c.moveTo(X(p[0]), Y(p[1])))); c.strokeStyle = '#FF4757'; c.lineWidth = 5; c.lineJoin = 'round'; c.stroke();
        D.circle(c, X(S.Q), Y(r.T), 8, '#FFC21A', D.INK, 3);
        D.text(c, 'energía recibida →', gx + gw - 10, gy + gh - 4, { size: 13, align: 'right' }); D.text(c, 'temperatura', gx + 8, gy + 14, { size: 13 });
        /* vaso */
        const vx = 70, vy = 70;
        D.poly(c, [[vx, vy], [vx + 170, vy], [vx + 150, vy + 230], [vx + 20, vy + 230]], 'rgba(220,240,255,.7)', D.INK, 4);
        if (r.phase === 'hielo' || r.phase === 'derrite') { const f = r.phase === 'hielo' ? 0 : r.frac; D.box(c, vx + 45, vy + 140 + f * 60, 80, 90 - f * 60, '#BFE9FF', { r: 10 }); }
        if (r.phase !== 'hielo' && r.phase !== 'vapor') { const lvl = r.phase === 'hierve' ? 50 * (1 - r.frac) + 20 : 60 * (r.phase === 'derrite' ? r.frac : 1) + 10; c.fillStyle = 'rgba(40,140,255,.6)'; c.fillRect(vx + 22, vy + 230 - 10 - lvl * 2.2, 126, lvl * 2.2); }
        if (r.phase === 'hierve' || r.phase === 'vapor') for (let i = 0; i < 10; i++) { const t = (g.t * 0.7 + i * 0.37) % 1; D.circle(c, vx + 30 + (i * 37) % 110 + Math.sin(g.t * 3 + i) * 8, vy - t * 70, 5 + t * 8, 'rgba(255,255,255,.8)', 'rgba(43,35,80,.3)', 2); }
        D.emoji(c, S.on ? '🔥' : '🔌', vx + 85, vy + 262, 36);
        D.char(c, 'flamo', 40, 24, 50, 'happy');
      }
    });
  });
})();

(function () {
  'use strict';
  const FK = window.FK, D = FK.d, M = FK.M, C = FK.calc;

  /* ---------- Máquina de vapor ---------- */
  FK.sim('maquina-vapor', function (g) {
    const ctx = g.canvas(2.1);
    g.slider('T', { label: 'Temperatura de la caldera', icon: '🔥', min: 100, max: 300, step: 5, value: 120, unit: '°C', fmt: (v) => FK.n(v, 0) });
    g.out('car', 'Límite de Carnot', { icon: '📏' }); g.out('real', 'Convertido en movimiento', { icon: '⚙️', hl: true }); g.out('per', 'Perdido como calor', { icon: '♨️' });
    const S = { ang: 0 };
    g.run({
      init() { S.ang = 0; g.say('El ambiente está a 30 °C. Sube la temperatura de la caldera y mira cuánta energía se aprovecha.'); },
      step(dt) {
        const Th = g.p.T + 273.15, Tc = 303.15, car = C.carnot(Th, Tc), real = 0.6 * car;
        g.show('car', FK.n(car * 100, 0) + ' %'); g.show('real', FK.n(real * 100, 0) + ' %'); g.show('per', FK.n((1 - real) * 100, 0) + ' %');
        S.ang += dt * (2 + real * 22);
        if (real > 0.25 && !g.won()) g.win(`¡Más del 25 %! A ${g.p.T} °C: ${FK.n(real * 100, 0)} % se vuelve movimiento. Pero ni a 300 °C pasa del 28 %.`);
      },
      draw(c, W, H) {
        D.sky(c, W, H, '#FFF6E5', '#FFE9C7');
        const Th = g.p.T + 273.15, car = C.carnot(Th, 303.15), real = 0.6 * car, hot = (g.p.T - 100) / 200;
        /* caldera */
        D.box(c, 40, 130, 190, 140, D.heat(0.55 + hot * 0.4), { r: 22 });
        D.emoji(c, '🔥', 90, 300, 40); D.emoji(c, '🔥', 135, 300, 46); D.emoji(c, '🔥', 180, 300, 40);
        D.text(c, g.p.T + ' °C', 135, 200, { size: 28, align: 'center', color: '#fff', stroke: 'rgba(43,35,80,.5)', weight: 700 });
        /* tubo y pistón */
        const cx = 400, cy = 160, pistonX = cx + 40 * Math.cos(S.ang) * 0 + 24 + (1 - Math.cos(S.ang)) * 18;
        D.line(c, 230, 180, 330, 180, '#9A9AB5', 10);
        D.box(c, 330, 130, 160, 100, '#C9D2E8', { r: 8 }); D.box(c, 335 + (1 - Math.cos(S.ang)) * 30, 138, 40, 84, '#7B7A99', { r: 6 });
        const wx = 620, wy = 230; D.circle(c, wx, wy, 70, '#FFC21A', D.INK, 5);
        for (let i = 0; i < 6; i++) { const a = S.ang + (i * M.TAU) / 6; D.line(c, wx, wy, wx + 66 * Math.cos(a), wy + 66 * Math.sin(a), D.INK, 3); }
        D.circle(c, wx, wy, 10, D.INK);
        const pa = wx + 40 * Math.cos(S.ang), pb = wy + 40 * Math.sin(S.ang);
        D.line(c, 375 + (1 - Math.cos(S.ang)) * 30, 180, pa, pb, '#7B7A99', 7);

        /* barras de energía */
        D.bar(c, 270, 290, 300, 26, 1, '#FF8A1F', 'energía del fuego: 100 %', { ink: '#fff' });
        D.bar(c, 270, 324, 300, 26, real, '#12B76A', 'movimiento: ' + FK.n(real * 100, 0) + ' %', { ink: '#2B2350' });
        c.fillStyle = 'rgba(0,0,0,0)';
        D.text(c, '♨️ calor perdido: ' + FK.n((1 - real) * 100, 0) + ' %', 420, 368, { size: 16, align: 'center', color: '#C0182B', weight: 700 });
      }
    });
  });

  /* ---------- Entropía: urna de Ehrenfest ---------- */
  FK.sim('entropia', function (g) {
    const ctx = g.canvas(2.2);
    g.slider('N', { label: 'Número de partículas', icon: '⚛️', min: 2, max: 120, step: 1, value: 4, fmt: (v) => FK.n(v, 0), reset: true });
    g.button('🚪 Abrir la puerta', () => { S.open = true; FK.sfx.pop(); }, { kind: 'primary' });
    g.out('izq', 'En la izquierda', { icon: '⬅️' }); g.out('vec', 'Veces que volvieron a juntarse', { icon: '🔁', hl: true });
    const S = { open: false, pts: [], left: 0, ret: 0, acc: 0, was: true };
    g.run({
      init() {
        S.open = false; S.ret = 0; S.acc = 0; S.was = true; const n = g.p.N; S.pts = [];
        for (let i = 0; i < n; i++) S.pts.push({ side: 0, x: M.rnd(40, 340), y: M.rnd(70, 300), tx: 0, ty: 0 });
        S.pts.forEach((p) => { p.tx = p.x; p.ty = p.y; });
        g.say('Todas las partículas están en la izquierda. Abre la puerta y mira qué pasa.');
      },
      step(dt) {
        const n = S.pts.length;
        if (S.open) {
          S.acc += dt * 14;
          while (S.acc >= 1) {
            S.acc -= 1; const p = S.pts[(Math.random() * n) | 0]; p.side = 1 - p.side;
            p.tx = p.side ? M.rnd(460, 760) : M.rnd(40, 340); p.ty = M.rnd(70, 300);
            const nl = S.pts.filter((q) => q.side === 0).length;
            if (nl === n && !S.was) { S.ret++; FK.sfx.ok(); if (S.ret >= 2 && n <= 6 && !g.won()) g.win('¡Volvieron a juntarse solas! Con pocas partículas pasa. Ahora prueba con 100: ¡nunca ocurrirá!'); }
            S.was = nl === n;
          }
        }
        S.pts.forEach((p) => { p.x += (p.tx - p.x) * Math.min(1, dt * 6); p.y += (p.ty - p.y) * Math.min(1, dt * 6); if (Math.random() < dt * 2) { p.ty = M.clamp(p.ty + M.rnd(-40, 40), 70, 300); p.tx = M.clamp(p.tx + M.rnd(-40, 40), p.side ? 460 : 40, p.side ? 760 : 340); } });
        const nl = S.pts.filter((q) => q.side === 0).length; g.show('izq', nl + ' de ' + n); g.show('vec', S.ret);

(function () {
  'use strict';
  const FK = window.FK, D = FK.d, M = FK.M, C = FK.calc;

  /* ---------- Péndulo ---------- */
  FK.sim('pendulo', function (g) {
    const ctx = g.canvas(2);
    g.slider('L', { label: 'Largo del hilo', icon: '📏', min: 0.1, max: 1.5, step: 0.01, value: 1, unit: 'm', fmt: (v) => FK.n(v, 2), reset: true });
    g.slider('m', { label: 'Masa de la bola', icon: '⚖️', min: 0.1, max: 2, step: 0.1, value: 0.5, unit: 'kg', fmt: (v) => FK.n(v, 1), reset: true });
    g.slider('a', { label: 'Ángulo de salida', icon: '📐', min: 5, max: 40, step: 1, value: 20, unit: '°', fmt: (v) => FK.n(v, 0), reset: true });
    g.out('T', 'Período medido', { icon: '⏱️', hl: true }); g.out('Tt', 'Período calculado', { icon: '🧮' });
    const S = { th: 0, w: 0, t: 0, last: null, T: null, n: 0 };
    g.run({
      init() { S.th = M.rad(g.p.a); S.w = 0; S.t = 0; S.last = null; S.T = null; g.show('T', '…'); g.show('Tt', FK.n(C.pendulumPeriod(g.p.L), 2) + ' s'); g.say('Mira cómo oscila. ¿Qué largo necesitas para que dure 1 segundo?'); },
      step(dt) {
        const n = 10;
        for (let i = 0; i < n; i++) { const h = dt / n, a = -(9.8 / g.p.L) * Math.sin(S.th); S.w += a * h; const th0 = S.th; S.th += S.w * h; S.t += h;
          if (th0 > 0 && S.th <= 0 && S.w < 0) { if (S.last !== null) { S.T = S.t - S.last; g.show('T', FK.n(S.T, 2) + ' s'); if (Math.abs(S.T - 1) < 0.03 && !g.won()) g.win('¡Un período de 1 s! Un hilo de unos 25 cm.'); } S.last = S.t; } }
      },

      }
    });
  });

  /* ---------- Balanza de resorte ---------- */
  FK.sim('balanza-resorte', function (g) {
    const ctx = g.canvas(1.7);
    g.slider('guess', { label: 'Mi respuesta', icon: '🤔', min: 0.1, max: 2.5, step: 0.05, value: 1, unit: 'kg', fmt: (v) => FK.n(v, 2) });
    g.button('Comprobar', () => check(), { icon: '✅' }); g.button('Otro objeto', () => g.restart(), { icon: '🎒', kind: 'ghost' });
    g.out('x', 'Estiramiento', { icon: '📏', hl: true }); g.out('k', 'Dureza del resorte', { icon: '🌀' });
    const K = 100, S = { m: 1, y: 0, vy: 0, done: false };
    const ITEMS = ['🎒', '🍉', '📦', '🧱', '🐈'];
    function check() { if (S.done) return; const err = Math.abs(g.p.guess - S.m) / S.m; S.done = true; if (err <= 0.1) g.win(`¡Sí! Era de ${FK.n(S.m, 2)} kg. Masa = fuerza ÷ 9,8, y la fuerza = 100 × estiramiento.`); else g.say(`Era de ${FK.n(S.m, 2)} kg. Con 100 N/m cada 10 cm son 1 kg. ¡Otro intento!`, 'think'); }
    g.run({
      init() { S.m = Math.round(M.rnd(0.3, 2.2) * 20) / 20; S.y = 0; S.vy = 0; S.done = false; S.it = M.pick(ITEMS); g.show('k', '100 N/m'); g.say('El resorte se estira según el peso del objeto. ¿Cuánto pesa? ¡Mira la regla!'); },
      step(dt) {

      },

        D.arrow(c, px + 50, by, rx - 4, by, '#FF4757', 4);

  FK.sim('resonancia-columpio', function (g) {

    g.slider('Tp', { label: 'Tiempo entre empujones', icon: '⏱️', min: 1, max: 6, step: 0.1, value: 2, unit: 's', fmt: (v) => FK.n(v, 1) });
    g.out('A', 'Altura máxima del columpio', { icon: '📈', hl: true }); g.out('Tn', 'Período natural', { icon: '🎯' });
    const L = 2, W0 = Math.sqrt(9.8 / L), S = { th: 0, w: 0, t: 0, amp: 0, push: 0, maxA: 0 };
    g.run({
      init() { S.th = 0.05; S.w = 0; S.t = 0; S.maxA = 0; S.push = 0; g.show('Tn', FK.n(C.pendulumPeriod(L), 2) + ' s'); g.say('Un empujón suave cada cierto tiempo. ¿Cada cuánto debes empujar para que suba mucho?'); },
      step(dt) {
        const n = 10;
        for (let i = 0; i < n; i++) {
          const h = dt / n; S.t += h; S.push += h;
          let f = 0;
          if (S.push >= g.p.Tp) { S.push = 0; S.kick = 0.25; }
          const a = -(W0 * W0) * Math.sin(S.th) - 0.06 * S.w;
          S.w += a * h; S.th += S.w * h;
          if (S.kick > 0) { S.w += 0.36 * Math.min(S.kick, h * 4) * 4; S.kick -= h * 4; }
        }
        S.maxA = Math.max(S.maxA * 0.999, Math.abs(M.deg(S.th)));
        g.show('A', FK.n(S.maxA, 0) + '°');
        if (S.maxA >= 35 && !g.won()) g.win('¡Lo lograste! Empujar al ritmo natural hace crecer el vaivén: resonancia.');
      },
      draw(c, W, H) {

        const bx = px + len * Math.sin(S.th), by = py + len * Math.cos(S.th);

(function () {
  'use strict';
  const FK = window.FK, D = FK.d, M = FK.M, C = FK.calc;

  /* ---------- La cuerda que vibra ---------- */
  FK.sim('onda-cuerda', function (g) {
    const ctx = g.canvas(2.4);
    const N = 160;
    g.choice('mode', { label: 'Tipo de onda', icon: '🌊', options: [['pulso', 'Un pulso', '1️⃣'], ['cont', 'Continua', '♾️']], value: 'cont', onchange: () => { S.on = false; } });
    g.choice('end', { label: 'Extremo derecho', icon: '📌', options: [['fijo', 'Fijo'], ['libre', 'Libre']], value: 'fijo', reset: true });
    g.slider('f', { label: 'Frecuencia', icon: '🎵', min: 0.3, max: 4, step: 0.05, value: 1, unit: 'Hz', fmt: (v) => FK.n(v, 2) });
    g.slider('A', { label: 'Amplitud', icon: '↕️', min: 0.1, max: 0.5, step: 0.05, value: 0.3, fmt: (v) => FK.n(v, 2) });
    g.button('¡Sacudir!', () => { if (g.p.mode === 'pulso') { S.pulse = 0.0001; } else S.on = !S.on; FK.sfx.pop(); }, { icon: '✋' });
    g.out('amax', 'Amplitud máxima de la cuerda', { icon: '📈', hl: true });
    const S = { u: new Float32Array(N), v: new Float32Array(N), on: false, pulse: 0, t: 0, amax: 0, hold: 0 };
    const R = 0.9, DT = 0.9 / N;
    g.run({
      init() { S.u.fill(0); S.v.fill(0); S.on = false; S.pulse = 0; S.t = 0; S.amax = 0; S.hold = 0; g.say('Sacude el extremo izquierdo. ¿A qué frecuencia se forma una onda grande?'); },
      step(dt) {
        const sub = Math.max(1, Math.round(dt * 60 * 3));
        for (let s = 0; s < sub; s++) {
          S.t += DT;
          const un = new Float32Array(N);
          for (let i = 1; i < N - 1; i++) un[i] = 2 * S.u[i] - S.v[i] + R * R * (S.u[i + 1] - 2 * S.u[i] + S.u[i - 1]) - 0.0012 * (S.u[i] - S.v[i]);
          /* fuente en el extremo izquierdo */
          let src = 0;
          if (g.p.mode === 'cont' && S.on) src = g.p.A * Math.sin(M.TAU * g.p.f * S.t);
          if (g.p.mode === 'pulso' && S.pulse > 0) { const tt = S.pulse; src = g.p.A * Math.exp(-Math.pow((tt - 0.12) / 0.05, 2)); S.pulse += DT; if (S.pulse > 0.3) S.pulse = 0; }
          un[0] = src;
          un[N - 1] = g.p.end === 'fijo' ? 0 : un[N - 2];
          S.v = S.u; S.u = un;
        }
        let m = 0; for (let i = 0; i < N; i++) m = Math.max(m, Math.abs(S.u[i])); S.amax = Math.max(S.amax * 0.995, m);
        g.show('amax', FK.n(S.amax / g.p.A, 1) + ' × la de la mano');
        if (g.p.mode === 'cont' && S.on && g.p.end === 'fijo') { if (S.amax > 2.5 * g.p.A) S.hold += dt; else S.hold = 0; if (S.hold > 2 && !g.won()) g.win('¡Resonancia! La cuerda vibra con una amplitud 2,5 veces mayor que tu mano.'); }
      },
      draw(c, W, H) {
        D.sky(c, W, H, '#F3EAFF', '#FFFFFF');
        const x0 = 50, x1 = W - 50, cy = H / 2, sc = H * 0.42;
        D.line(c, x0, cy, x1, cy, 'rgba(43,35,80,.2)', 2, [6, 6]);
        c.beginPath(); for (let i = 0; i < N; i++) { const x = x0 + (i / (N - 1)) * (x1 - x0), y = cy - S.u[i] * sc * 1.6; i ? c.lineTo(x, y) : c.moveTo(x, y); }
        c.strokeStyle = '#8E5CF6'; c.lineWidth = 7; c.lineCap = 'round'; c.lineJoin = 'round'; c.stroke();
        D.circle(c, x0, cy - S.u[0] * sc * 1.6, 12, '#FFC21A', D.INK, 3);
        if (g.p.end === 'fijo') { D.box(c, x1 - 4, cy - 40, 14, 80, '#8A5A2B', { r: 4 }); } else { D.circle(c, x1, cy - S.u[N - 1] * sc * 1.6, 10, '#12B76A', D.INK, 3); }
        D.char(c, 'eco', W - 70, 56, 70, 'happy');
        D.text(c, S.on || S.pulse > 0 ? '' : 'presiona «¡Sacudir!»', x0 + 10, 30, { size: 16, color: D.INK });
      }
    });
  });

  /* ---------- Transversal y longitudinal ---------- */
  FK.sim('trans-long', function (g) {
    const ctx = g.canvas(2.4);
    g.choice('tipo', { label: 'Tipo de onda', icon: '🌊', options: [['t', 'Transversal (de lado)', '〰️'], ['l', 'Longitudinal (de empujón)', '🌀']], value: 't', reset: true });
    g.slider('lam', { label: 'Longitud de onda', icon: '↔️', min: 120, max: 400, step: 10, value: 240, unit: 'cm', fmt: (v) => FK.n(v, 0) });
    g.out('t', 'Tiempo visto', { icon: '👀' });
    const N = 42, S = { seen: { t: 0, l: 0 } };
    g.run({
      init() { g.say('Mira la partícula roja. ¿Viaja con la onda o solo se mueve en su lugar?'); },
      step(dt) { S.seen[g.p.tipo] += dt; g.show('t', `de lado: ${FK.n(S.seen.t, 0)} s · de empujón: ${FK.n(S.seen.l, 0)} s`); if (S.seen.t > 4 && S.seen.l > 4 && !g.won()) g.win('¡Muy bien! En los dos tipos, la partícula solo va y viene: lo que viaja es la onda.'); },
      draw(c, W, H) {
        D.sky(c, W, H, '#F3EAFF', '#FFFFFF');
        const x0 = 60, x1 = W - 60, cy = H / 2, dx = (x1 - x0) / (N - 1), k = (M.TAU * (x1 - x0)) / (g.p.lam * 3.2), w = 2.4, amp = 38;
        for (let i = 0; i < N; i++) {
          const xe = x0 + i * dx, ph = k * (i * dx) / (x1 - x0) * 0 + (xe - x0) * (M.TAU / (g.p.lam * 1.6)) - w * g.t;
          let x = xe, y = cy;
          if (g.p.tipo === 't') y = cy + amp * Math.sin(ph); else x = xe + amp * 0.55 * Math.sin(ph);
          const red = i === 14;
          D.circle(c, x, y, red ? 11 : 8, red ? '#FF4757' : '#8E5CF6', D.INK, red ? 3 : 2);
          if (red) { D.line(c, xe, cy - 60, xe, cy + 60, 'rgba(255,71,87,.35)', 2, [4, 6]); }
        }
        D.tag(c, g.p.tipo === 't' ? 'La partícula roja sube y baja' : 'La partícula roja va y viene', W / 2, 36, '#FFE0E3', { size: 16 });
        D.arrow(c, W / 2 - 60, H - 36, W / 2 + 60, H - 36, '#12B76A', 7); D.text(c, 'la onda avanza', W / 2, H - 14, { size: 14, align: 'center' });
      }
    });
  });

  /* ---------- Rizos de interferencia ---------- */
  FK.sim('rizos', function (g) {
    const ctx = g.canvas(2);
    g.slider('d', { label: 'Separación de las gotas', icon: '↔️', min: 40, max: 360, step: 5, value: 120, unit: 'cm', fmt: (v) => FK.n(v, 0) });
    g.slider('lam', { label: 'Longitud de onda', icon: '〰️', min: 30, max: 90, step: 5, value: 60, unit: 'cm', fmt: (v) => FK.n(v, 0) });
    g.out('n', 'Líneas de calma', { icon: '😌', hl: true });
    const IW = 200, IH = 100, off = document.createElement('canvas'); off.width = IW; off.height = IH;
    const octx = off.getContext('2d'), img = octx.createImageData(IW, IH);
    g.run({
      init() { g.say('Dos gotas caen en el agua. Las zonas oscuras son de calma.'); },
      step() {
        const n = C.nodalLines(g.p.d, g.p.lam); g.show('n', n);
        if (n >= 4 && !g.won()) g.win('¡' + n + ' líneas de calma! Donde una cresta se une a un valle, el agua queda quieta.');
      },
      draw(c, W, H) {
        const sx = W / IW, s1 = [W / 2 - g.p.d / 2, H / 2], s2 = [W / 2 + g.p.d / 2, H / 2], k = M.TAU / g.p.lam, ph = g.t * 6;
        for (let j = 0; j < IH; j++) for (let i = 0; i < IW; i++) {
          const x = (i + 0.5) * sx, y = (j + 0.5) * sx;
          const r1 = Math.hypot(x - s1[0], y - s1[1]) + 6, r2 = Math.hypot(x - s2[0], y - s2[1]) + 6;
          const v = (Math.cos(k * r1 - ph) / Math.sqrt(r1 / 40) + Math.cos(k * r2 - ph) / Math.sqrt(r2 / 40)) / 2;
          const t = M.clamp(v * 0.9, -1, 1), idx = (j * IW + i) * 4;
          img.data[idx] = 40 + 120 * (t > 0 ? t : 0) + 60 * (1 + t) * 0.3; img.data[idx + 1] = 110 + 100 * (1 + t) / 2 + 40 * (t > 0 ? t : 0); img.data[idx + 2] = 200 + 55 * (1 + t) / 2; img.data[idx + 3] = 255;
        }
        octx.putImageData(img, 0, 0);
        c.imageSmoothingEnabled = true; c.drawImage(off, 0, 0, W, H);
        D.circle(c, s1[0], s1[1], 9, '#FFC21A', D.INK, 3); D.circle(c, s2[0], s2[1], 9, '#FFC21A', D.INK, 3);
        D.emoji(c, '💧', s1[0], s1[1] - 24, 22); D.emoji(c, '💧', s2[0], s2[1] - 24, 22);
      }
    });
  });
})();

(function () {
  'use strict';
  const FK = window.FK, D = FK.d, M = FK.M, C = FK.calc;

  /* ---------- Fabrica sonidos ---------- */
  FK.sim('tono-volumen', function (g) {
    const ctx = g.canvas(2.6);
    g.slider('lf', { label: 'Frecuencia (tono)', icon: '🎵', min: 0, max: 100, step: 1, value: 40, fmt: (v) => FK.n(C.logFreq(v), 0) + ' Hz' });
    g.slider('vol', { label: 'Volumen', icon: '🔊', min: 0, max: 100, step: 1, value: 30, unit: '%', fmt: (v) => FK.n(v, 0) });
    g.choice('tipo', { label: 'Forma de onda', icon: '〰️', options: [['sine', 'Suave'], ['triangle', 'Triángulo'], ['square', 'Cuadrada'], ['sawtooth', 'Diente de sierra']], value: 'sine', onchange: () => restartHum() });
    g.button('▶ Sonar', () => { S.on = !S.on; if (S.on) restartHum(); else stop(); }, { kind: 'primary' });
    g.out('f', 'Frecuencia', { icon: '🎵', hl: true }); g.out('T', 'Período', { icon: '⏱️' });
    const S = { on: false, hum: null, low: false, high: false };
    const stop = () => { if (S.hum) { S.hum.stop(); S.hum = null; } };
    const restartHum = () => { stop(); if (S.on) S.hum = FK.hum(C.logFreq(g.p.lf), 0.25 * (g.p.vol / 100) * (g.p.vol / 100), g.p.tipo); };
    g._stopAudio = () => { stop(); S.on = false; };
    g.run({
      static: false,
      init() { stop(); S.on = false; g.say('Presiona «Sonar» (y activa el altavoz de arriba). Mueve la frecuencia y el volumen.'); },
      step() {
        const f = C.logFreq(g.p.lf); g.show('f', FK.n(f, 0) + ' Hz'); g.show('T', FK.n(1000 / f, f > 500 ? 2 : 1) + ' ms');
        if (S.hum && !S.hum.off) S.hum.set(f, 0.25 * (g.p.vol / 100) * (g.p.vol / 100));
        if (S.on) { if (f < 200) S.low = true; if (f > 1500) S.high = true; if (S.low && S.high && !g.won()) g.win('¡Grave y agudo! Frecuencia baja = grave; frecuencia alta = agudo.'); }
      },
      draw(c, W, H) {
        D.sky(c, W, H, '#F3EAFF', '#FFFFFF'); D.grid(c, W, H, 40, 'rgba(43,35,80,.06)');
        const f = C.logFreq(g.p.lf), amp = (g.p.vol / 100) * (H * 0.4), cy = H / 2;
        D.line(c, 0, cy, W, cy, 'rgba(43,35,80,.2)', 2);
        const cyc = M.clamp(Math.log10(f / 100) * 4 + 2, 1, 40);
        c.beginPath();
        for (let x = 0; x <= W; x += 3) {
          const ph = (x / W) * cyc * M.TAU - (S.on ? g.t * 8 : 0);
          let v = Math.sin(ph); if (g.p.tipo === 'square') v = Math.sign(v); else if (g.p.tipo === 'triangle') v = (2 / Math.PI) * Math.asin(Math.sin(ph)); else if (g.p.tipo === 'sawtooth') v = 2 * ((ph / M.TAU) % 1 + 1) % 2 - 1;
          x ? c.lineTo(x, cy - v * amp) : c.moveTo(x, cy - v * amp);
        }
        c.strokeStyle = S.on ? '#8E5CF6' : '#B9A5F0'; c.lineWidth = 6; c.lineJoin = 'round'; c.stroke();
        D.char(c, 'eco', W - 60, 50, 64, S.on ? 'wow' : 'happy');
        if (!FK.soundOn()) D.tag(c, '🔇 el sonido está apagado (botón de arriba)', W / 2, 24, '#FFE0E3', { size: 14 });
        D.text(c, f < 20 ? 'infrasonido' : f > 20000 ? 'ultrasonido' : f < 250 ? 'grave' : f > 2000 ? 'agudo' : 'medio', 16, H - 16, { size: 18, weight: 700 });
      }
    });
  });

  /* ---------- Eco ---------- */
  FK.sim('eco', function (g) {
    const ctx = g.canvas(2.4);
    g.slider('guess', { label: 'Mi cálculo de la distancia', icon: '🤔', min: 20, max: 700, step: 5, value: 300, unit: 'm', fmt: (v) => FK.n(v, 0) });
    g.button('¡Gritar!', () => shout(), { icon: '📢' }); g.button('Comprobar', () => check(), { icon: '✅', kind: 'ghost' }); g.button('Otra montaña', () => g.restart(), { icon: '⛰️', kind: 'ghost' });
    g.out('t', 'Tiempo del eco', { icon: '⏱️', hl: true }); g.out('v', 'Rapidez del sonido', { icon: '💨' });
    const S = { D: 200, st: 'ready', t: 0, tt: 0, done: false };
    function shout() { if (S.st !== 'ready') return; S.st = 'go'; S.t = 0; FK.tone(330, 0.25, { type: 'sawtooth', vol: 0.12 }); }
    function check() { if (S.tt === 0 || S.done) { g.say('Primero grita y mide el tiempo del eco.', 'think'); return; } S.done = true; const err = Math.abs(g.p.guess - S.D) / S.D; if (err <= 0.1) g.win(`¡Muy bien! La montaña estaba a ${S.D} m: 343 × ${FK.n(S.tt, 2)} ÷ 2.`); else g.say(`La montaña estaba a ${S.D} m. Recuerda: distancia = 343 × tiempo ÷ 2. ¡Otra montaña!`, 'think'); }
    g.run({
      init() { S.D = Math.round(M.rnd(50, 600) / 5) * 5; S.st = 'ready'; S.t = 0; S.tt = 0; S.done = false; g.show('t', '—'); g.show('v', '343 m/s'); g.say('Grita y mira cuánto tarda el eco. Después calcula la distancia a la montaña.'); },
      step(dt) {
        if (S.st !== 'go') return;
        S.t += dt;
        const tt = C.echoTime(S.D);
        if (S.t >= tt) { S.st = 'back'; S.tt = tt; g.show('t', FK.n(tt, 2) + ' s'); FK.tone(330, 0.3, { type: 'sine', vol: 0.06 }); }
      },
      draw(c, W, H) {
        D.sky(c, W, H, '#BFE9FF', '#EAF8FF'); D.ground(c, W, H - 50, H, '#7ED957', '#B9824A');
        const gy = H - 50, x0 = 110, x1 = W - 120;
        c.beginPath(); c.moveTo(W - 200, gy); c.lineTo(W - 100, gy - 220); c.lineTo(W - 20, gy - 70); c.lineTo(W, gy - 100); c.lineTo(W, gy); c.closePath(); c.fillStyle = '#8A8AA0'; c.fill(); c.lineWidth = 4; c.strokeStyle = D.INK; c.stroke();

        if (S.st === 'go' || S.st === 'back') {
          const tt = C.echoTime(S.D), p = S.st === 'back' ? 1 : S.t / tt, out = Math.min(1, p * 2), back = Math.max(0, p * 2 - 1);
          const xs = x0 + 60 + (out - back) * (x1 - x0 - 60);
          for (let i = 0; i < 4; i++) { c.beginPath(); if (back > 0) c.arc(xs + i * 22, gy - 60, 28 + i * 8, Math.PI - 0.9, Math.PI + 0.9); else c.arc(xs - i * 22, gy - 60, 28 + i * 8, -0.9, 0.9); c.strokeStyle = back > 0 ? '#12B76A' : '#8E5CF6'; c.lineWidth = 5; c.lineCap = 'round'; c.stroke(); }
        }
        D.tag(c, '¿cuántos metros?', (x0 + x1) / 2, gy + 26, '#fff', { size: 14 });
        if (S.done) D.tag(c, 'real: ' + S.D + ' m', (x0 + x1) / 2, gy - 130, '#B8F2D0', { size: 18 });
      }
    });
  });

  /* ---------- Efecto Doppler ---------- */
  FK.sim('doppler', function (g) {
    const ctx = g.canvas(2.4);
    g.slider('v', { label: 'Rapidez de la ambulancia', icon: '🚑', min: 0, max: 50, step: 1, value: 25, unit: 'm/s', fmt: (v) => FK.n(v, 0) });
    g.button('🚑 ¡Que pase!', () => { S.x = -80; S.run = true; if (!S.hum && FK.soundOn()) S.hum = FK.hum(700, 0.12, 'square'); }, { kind: 'primary' });
    g.out('f', 'Tono que oyes', { icon: '👂', hl: true }); g.out('f0', 'Tono de la sirena', { icon: '🔔' });
    const S = { x: -80, run: false, hum: null, passed: false, waves: [] };
    const stop = () => { if (S.hum) { S.hum.stop(); S.hum = null; } };
    g._stopAudio = () => { stop(); S.run = false; };
    g.run({
      init() { stop(); S.x = -80; S.run = false; S.waves = []; S.passed = false; g.show('f0', '700 Hz'); g.show('f', '—'); g.say('Observa cómo las ondas se aprietan delante de la ambulancia. Presiona «¡Que pase!».'); },
      step(dt) {
        const v = g.p.v, ox = 400;
        if (S.run) {
          S.x += v * dt * 10; S.acc = (S.acc || 0) + dt; if (S.acc > 0.12) { S.acc = 0; S.waves.push({ x: S.x, r: 0 }); }
          const dx = ox - S.x, d = Math.hypot(dx, 60), vr = (v * dx) / d; /* componente hacia el oyente */
          const f = C.dopplerSource(700, vr);
          g.show('f', FK.n(f, 0) + ' Hz ' + (vr > 0.5 ? '⬆️ agudo' : vr < -0.5 ? '⬇️ grave' : ''));
          if (S.hum && !S.hum.off) S.hum.set(f, 0.12);
          if (S.x > ox + 40 && !S.passed) { S.passed = true; if (v >= 20 && !g.won()) g.win('¡Pasó! Al acercarse sonó más agudo y al alejarse más grave: efecto Doppler.'); }
          if (S.x > 900) { S.run = false; stop(); }
        }
        S.waves.forEach((w) => { w.r += dt * 343 * 0.6; }); S.waves = S.waves.filter((w) => w.r < 600);
      },
      draw(c, W, H) {
        D.sky(c, W, H, '#E6E0FF', '#F8F5FF'); D.ground(c, W, H - 60, H, '#C9C9D9', '#9A9AB5');
        S.waves.forEach((w) => { c.beginPath(); c.arc(w.x, H - 110, w.r, 0, M.TAU); c.strokeStyle = `rgba(142,92,246,${Math.max(0, 0.7 - w.r / 600)})`; c.lineWidth = 3; c.stroke(); });
        D.emoji(c, '🚑', S.x, H - 100, 64, 0, true);
        D.char(c, 'eco', 400, H - 40, 70, 'happy');
        D.tag(c, '👂 oyente', 400, H - 4, '#fff', { size: 12 });
      }
    });
  });
})();

(function () {

    g.choice('T', { label: 'Tensión', icon: '🔧', options: [[40, 'Floja'], [70, 'Media'], [100, 'Tensa']], value: 70 });
    g.choice('mu', { label: 'Grosor', icon: '🧵', options: [[0.4, 'Fina'], [1.0, 'Media'], [3.0, 'Gruesa']], value: 0.4 });
    g.button('🎸 Pulsar la cuerda', () => pluck(), { kind: 'primary' });
    g.out('f', 'Frecuencia', { icon: '🎵', hl: true }); g.out('n', 'Nota más cercana', { icon: '🎼' });
    const S = { amp: 0, t: 0 };
    const freq = () => C.stringFreq(g.p.L, g.p.T, g.p.mu / 1000);
    function pluck() {
      S.amp = 1; const f = freq();
      FK.tone(f, 1.4, { type: 'triangle', vol: 0.2 }); FK.tone(2 * f, 0.9, { type: 'sine', vol: 0.05 });
      if (Math.abs(f - 440) <= 4.4) g.win(`¡La! ${FK.n(f, 1)} Hz: está afinada.`); else g.say(`Suena a ${FK.n(f, 1)} Hz. ${f > 440 ? 'Está muy aguda: alárgala, afloja o usa una cuerda más gruesa.' : 'Está muy grave: acórtala, tensa o usa una cuerda más fina.'}`, 'think');
    }
    g.run({
      init() { S.amp = 0; g.say('Para un La necesitas 440 Hz. Cambia el largo, la tensión o el grosor y pulsa.'); },
      step(dt) { S.amp = Math.max(0, S.amp - dt * 0.7); S.t += dt; const f = freq(); g.show('f', FK.n(f, 1) + ' Hz'); g.show('n', C.noteName(f)); },
      draw(c, W, H) {
        D.sky(c, W, H, '#FFF1D9', '#FFFBF2');
        D.box(c, 20, 60, W - 40, H - 120, '#C98A3F', { r: 18 }); D.circle(c, W - 160, H / 2, 70, '#5A3418', D.INK, 4);
        const x0 = 50, x1 = 50 + (g.p.L / 0.65) * (W - 160), cy = H / 2, th = 2 + (g.p.mu / 3) * 6;
        c.strokeStyle = D.INK; c.lineWidth = 8; c.lineCap = 'round';
        D.line(c, x0, cy - 50, x0, cy + 50, '#E8E0D0', 10);
        const f = freq(), cyc = 3;
        c.beginPath(); for (let x = x0; x <= x1; x += 4) { const u = (x - x0) / (x1 - x0), y = cy + S.amp * 16 * Math.sin(Math.PI * u) * Math.sin(S.t * Math.min(120, f / 6)); x === x0 ? c.moveTo(x, y) : c.lineTo(x, y); }
        c.strokeStyle = '#2B2350'; c.lineWidth = th; c.stroke();
        D.circle(c, x1, cy, 9, '#FFC21A', D.INK, 3);
        D.char(c, 'eco', W - 60, 40, 60, 'happy');
        D.tag(c, 'objetivo: La = 440 Hz', 150, 36, '#fff', { size: 15 });
      }
    });
  });

  /* ---------- Flauta de botellas ---------- */
  const NOTES = [['Do', 261.63], ['Re', 293.66], ['Mi', 329.63], ['Sol', 392.0], ['La', 440.0]];
  FK.sim('flauta-botellas', function (g) {
    const ctx = g.canvas(2.4);
    g.choice('b', { label: 'Botella', icon: '🍾', options: NOTES.map((n, i) => [i, n[0]]), value: 0, onchange: (v) => { g.setSlider('h', lv[v] * 100); } });
    g.slider('h', { label: 'Agua en la botella', icon: '💧', min: 0, max: 36, step: 0.5, value: 0, unit: 'cm', fmt: (v) => FK.n(v, 1), onchange: (v) => { lv[g.p.b] = v / 100; } });
    g.button('🎶 Soplar', () => blow(), { kind: 'primary' });
    g.out('f', 'Frecuencia de esta botella', { icon: '🎵', hl: true }); g.out('ok', 'Botellas afinadas', { icon: '✅' });
    const H = 0.4, lv = [0, 0, 0, 0, 0], S = { t: 0, sel: -1, ok: [false, false, false, false, false] };
    const freq = (i) => C.bottleFreq(H - lv[i]);
    function blow() {
      const i = g.p.b, f = freq(i); S.sel = i; S.t = 0;
      FK.tone(f, 0.9, { type: 'sine', vol: 0.2 }); FK.tone(2 * f, 0.5, { type: 'sine', vol: 0.03 });
      const err = Math.abs(f - NOTES[i][1]) / NOTES[i][1];
      S.ok[i] = err <= 0.015;
      if (S.ok[i]) { FK.sfx.ok(); g.say(`¡${NOTES[i][0]}! ${FK.n(f, 0)} Hz. Esta botella está afinada.`, 'happy'); } else g.say(`Suena a ${FK.n(f, 0)} Hz y el ${NOTES[i][0]} es ${FK.n(NOTES[i][1], 0)} Hz. ${f > NOTES[i][1] ? 'Muy aguda: quita agua.' : 'Muy grave: añade agua.'}`, 'think');
      if (S.ok.every(Boolean)) g.win('¡Las cinco botellas están afinadas! Ya puedes tocar una melodía.');

    g.run({
      init() { for (let i = 0; i < 5; i++) { lv[i] = 0; S.ok[i] = false; } g.setSlider('h', 0); g.setChoice('b', 0); g.say('Cada botella tiene su nota. Añade agua para acortar la columna de aire y subir el tono.'); },
      step(dt) { S.t += dt; g.show('f', FK.n(freq(g.p.b), 0) + ' Hz'); g.show('ok', S.ok.filter(Boolean).length + ' de 5'); },
      draw(c, W, H2) {

          D.tag(c, n[0], x, gy + 22, S.ok[i] ? '#B8F2D0' : '#fff', { size: 17 });
          if (S.sel === i && S.t < 0.8) { for (let k = 0; k < 3; k++) { c.beginPath(); c.arc(x, gy - bh - 6 - k * 10 - S.t * 30, 14 + k * 8, Math.PI * 1.15, Math.PI * 1.85); c.strokeStyle = '#8E5CF6'; c.lineWidth = 4; c.stroke(); } }
          if (S.ok[i]) D.text(c, '✅', x, gy - bh - 20, { size: 22, align: 'center' });
        });
        D.char(c, 'eco', W - 60, 50, 64, 'happy');
      }
    });
  });

  /* ---------- Pulsos ---------- */
  FK.sim('pulsos', function (g) {
    const ctx = g.canvas(2.6);
    g.slider('d', { label: 'Frecuencia de la 2.ª cuerda', icon: '🎵', min: 430, max: 450, step: 0.5, value: 446, unit: 'Hz', fmt: (v) => FK.n(v, 1) });
    g.button('▶ Sonar las dos', () => { S.on = !S.on; if (S.on) start(); else stop(); }, { kind: 'primary' });
    g.out('p', 'Pulsos por segundo', { icon: '〰️', hl: true });
    const S = { on: false, h1: null, h2: null };
    const stop = () => { if (S.h1) { S.h1.stop(); S.h2.stop(); S.h1 = S.h2 = null; } };

      init() { stop(); S.on = false; g.setSlider('d', M.pick([434, 436, 444, 446, 448])); g.say('La primera cuerda suena a 440 Hz. Mueve la segunda hasta que no haya pulsos.'); },
      step() {

      },
      draw(c, W, H) {
        D.sky(c, W, H, '#F3EAFF', '#FFFFFF'); D.grid(c, W, H, 40, 'rgba(43,35,80,.06)');

        D.char(c, 'eco', W - 60, H - 40, 60, Math.abs(d) < 0.01 ? 'wow' : 'happy');
      }
    });
  });
})();

(function () {
  'use strict';
  const FK = window.FK, D = FK.d, M = FK.M, C = FK.calc;

  /* ---------- El laberinto del láser ---------- */
  const LEVELS = [
    { src: [60, 330], dir: 0, target: [700, 90], mirrors: [{ x: 520, y: 330, a: 90 }], walls: [] },
    { src: [60, 60], dir: 0, target: [80, 340], mirrors: [{ x: 600, y: 60, a: 0 }, { x: 300, y: 330, a: 0 }], walls: [] },
    { src: [60, 340], dir: -5, target: [740, 340], mirrors: [{ x: 200, y: 340, a: 90 }, { x: 200, y: 70, a: 0 }, { x: 600, y: 70, a: 0 }, { x: 600, y: 340, a: 90 }], walls: [[395, 130, 410, 400]] }
  ];
  const ML = 90;
  FK.laserLevels = LEVELS;
  /* Traza el rayo láser de un nivel L con los espejos mir [{x,y,a}] */
  FK.laserTrace = function (L, mir) {
    let p = [L.src[0], L.src[1]], d = [Math.cos(M.rad(L.dir)), Math.sin(M.rad(L.dir))];
    const path = [[p[0], p[1]]]; let hit = false;
    for (let k = 0; k < 14; k++) {
      let best = 1e9, kind = null, nrm = null;
      const segs = [];
      mir.forEach((m, i) => { const a = M.rad(m.a), dx = Math.cos(a) * ML / 2, dy = Math.sin(a) * ML / 2; segs.push([m.x - dx, m.y - dy, m.x + dx, m.y + dy, 'm', i]); });
      L.walls.forEach((w) => { const [x0, y0, x1, y1] = w; segs.push([x0, y0, x1, y0, 'w'], [x1, y0, x1, y1, 'w'], [x1, y1, x0, y1, 'w'], [x0, y1, x0, y0, 'w']); });
      segs.push([0, 0, 800, 0, 'w'], [800, 0, 800, 400, 'w'], [800, 400, 0, 400, 'w'], [0, 400, 0, 0, 'w']);
      for (const s of segs) { const t = C.raySegment(p, d, s); if (t !== null && t > 1e-3 && t < best) { best = t; kind = s[4]; nrm = s; } }
      const tc = C.rayCircle(p, d, L.target, 24); if (tc !== null && tc > 1e-3 && tc < best) { path.push([p[0] + d[0] * tc, p[1] + d[1] * tc]); hit = true; break; }
      const q = [p[0] + d[0] * best, p[1] + d[1] * best]; path.push(q);
      if (kind !== 'm') break;
      const sx = nrm[2] - nrm[0], sy = nrm[3] - nrm[1], len = Math.hypot(sx, sy), n = [-sy / len, sx / len];
      d = C.reflect(d, n); p = q;
    }
    return { path, hit };
  };
  FK.sim('laser-espejos', function (g) {
    const ctx = g.canvas(2);
    g.choice('lv', { label: 'Nivel', icon: '🎮', options: [[0, '1'], [1, '2'], [2, '3']], value: 0, onchange: () => load() });
    g.out('st', 'Estado', { icon: '🎯', hl: true });
    const S = { L: LEVELS[0], mir: [], path: [], hit: false, drag: -1, done: [false, false, false] };
    function load() { const L = LEVELS[g.p.lv]; S.L = L; S.mir = L.mirrors.map((m) => ({ x: m.x, y: m.y, a: m.a })); S.hit = false; trace(); g.say(['Nivel 1: un espejo. Gíralo para que el rayo llegue a la diana.', 'Nivel 2: dos espejos. El rayo debe volver a la diana de abajo.', 'Nivel 3: ¡un muro! Usa los cuatro espejos para rodearlo.'][g.p.lv]); }
    function trace() {
      const r = FK.laserTrace(S.L, S.mir); S.path = r.path; S.hit = r.hit;
      g.show('st', S.hit ? '✅ ¡Dio en la diana!' : '❌ Sigue girando espejos');
      if (S.hit && !S.done[g.p.lv]) { S.done[g.p.lv] = true; FK.sfx.ok(); if (S.done.every(Boolean)) g.win('¡Los tres niveles! El ángulo de llegada siempre es igual al de salida.'); else g.say('¡Nivel superado! Pasa al siguiente con los botones de arriba.', 'wow'); }
    }
    g.pointer({
      down(x, y) { S.drag = -1; S.mir.forEach((m, i) => { if (Math.hypot(x - m.x, y - m.y) < ML / 2 + 14) S.drag = i; }); },
      move(x, y, e, down) { if (down && S.drag >= 0) { const m = S.mir[S.drag]; let a = M.deg(Math.atan2(y - m.y, x - m.x)); a = Math.round(a / 5) * 5; m.a = a; trace(); } },
      up() { S.drag = -1; }
    });
    g.run({
      static: true,
      init() { load(); },
      draw(c, W, H) {
        D.night(c, W, H, 9, 40); D.grid(c, W, H, 50, 'rgba(255,255,255,.06)');
        S.L.walls.forEach((w) => D.box(c, w[0], w[1], w[2] - w[0], w[3] - w[1], '#5A5A8A', { r: 4, stroke: '#fff', lw: 2 }));
        c.beginPath(); S.path.forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]))); c.strokeStyle = 'rgba(255,60,60,.35)'; c.lineWidth = 12; c.lineJoin = 'round'; c.stroke(); c.strokeStyle = '#FF3B3B'; c.lineWidth = 4; c.stroke();
        S.mir.forEach((m, i) => { const a = M.rad(m.a), dx = Math.cos(a) * ML / 2, dy = Math.sin(a) * ML / 2; D.line(c, m.x - dx, m.y - dy, m.x + dx, m.y + dy, '#BFE9FF', 10); D.line(c, m.x - dx, m.y - dy, m.x + dx, m.y + dy, '#fff', 3); D.circle(c, m.x + dx, m.y + dy, 8, '#FFC21A', D.INK, 2); });
        D.emoji(c, '🎯', S.L.target[0], S.L.target[1], 50); D.emoji(c, '🔦', S.L.src[0] - 12, S.L.src[1], 40);

      }

  FK.sim('espejo-curvo', function (g) {

    g.slider('o', { label: 'Distancia del objeto al espejo', icon: '↔️', min: 8, max: 120, step: 1, value: 60, unit: 'cm', fmt: (v) => FK.n(v, 0) });
    g.out('im', 'Imagen', { icon: '🖼️', hl: true }); g.out('m', 'Tamaño', { icon: '📏' }); g.out('di', 'Distancia de la imagen', { icon: '📍' });
    const SC = 3.6, VX = 600, AY = 230, HO = 14;
    g.run({
      static: true,
      init() { g.say('La flecha amarilla es el objeto. Mira cómo se forma la imagen con tres rayos.'); },
      draw(c, W, H) {
        const f = (g.p.tipo === 'con' ? 1 : -1) * g.p.f, o = g.p.o, di = C.mirrorImage(f, o), m = -di / o;
        g.show('im', (di > 0 ? 'real e invertida' : 'virtual y derecha')); g.show('m', FK.n(Math.abs(m), 2) + ' ×' + (Math.abs(m) > 1 ? ' (más grande)' : ' (más pequeña)')); g.show('di', FK.n(Math.abs(di), 1) + ' cm ' + (di > 0 ? 'delante' : 'detrás'));
        if (g.p.tipo === 'con' && o < g.p.f * 0.9 && !g.won()) g.win('¡Dentro del foco! La imagen es virtual, derecha y más grande: así funciona un espejo de maquillaje.');
        D.sky(c, W, H, '#FFF6E5', '#FFE9C7');
        D.line(c, 20, AY, W - 10, AY, 'rgba(43,35,80,.3)', 2, [8, 6]);
        /* espejo */
        const R = 2 * Math.abs(f) * SC, sgn = f > 0 ? 1 : -1, am = Math.asin(Math.min(1, 125 / R));
        c.beginPath();
        for (let a = -am; a <= am + 1e-6; a += am / 20) { const px = VX - sgn * R * (1 - Math.cos(a)), py = AY + R * Math.sin(a); a === -am ? c.moveTo(px, py) : c.lineTo(px, py); }
        c.strokeStyle = '#8E5CF6'; c.lineWidth = 8; c.lineCap = 'round'; c.stroke();
        const F = VX - f * SC; D.circle(c, F, AY, 5, '#FF4757'); D.text(c, 'F', F, AY + 18, { size: 14, align: 'center', color: '#FF4757', weight: 700 });
        /* objeto */
        const xo = VX - o * SC, yt = AY - HO * SC;
        D.arrow(c, xo, AY, xo, yt, '#FFC21A', 8);
        /* rayos: 1) paralelo → pasa por F; 2) al vértice */
        const ray = (x1, y1, x2, y2, col, dash) => D.line(c, x1, y1, x2, y2, col, 3, dash);
        ray(xo, yt, VX, yt, '#12B76A');
        const P = [VX, yt], dF = [(F - VX) * sgn, (AY - yt) * sgn], LF = Math.hypot(dF[0], dF[1]), uF = [dF[0] / LF, dF[1] / LF];
        ray(P[0], P[1], P[0] + uF[0] * 900, P[1] + uF[1] * 900, '#12B76A');
        const r = [-(VX - xo), AY - yt], Lr = Math.hypot(r[0], r[1]), ur = [r[0] / Lr, r[1] / Lr];
        ray(xo, yt, VX, AY, '#1E88FF'); ray(VX, AY, VX + ur[0] * 900, AY + ur[1] * 900, '#1E88FF');
        if (di < 0) { ray(P[0], P[1], P[0] - uF[0] * 500, P[1] - uF[1] * 500, '#12B76A', [6, 6]); ray(VX, AY, VX - ur[0] * 500, AY - ur[1] * 500, '#1E88FF', [6, 6]); }
        /* imagen */

    g.button('¡Disparar!', () => fire(), { icon: '💥' });
    g.out('l', 'Acierto con láser', { icon: '🔦' }); g.out('s', 'Acierto con lanza', { icon: '🔱' });

      else g.say(g.p.arma === 'laser' ? 'Fallaste. Apunta el láser justo a donde ves al pez fantasma (el que está más arriba).' : 'Fallaste. Para la lanza debes apuntar más abajo: ¡al pez de verdad!', 'think');

(function () {
  'use strict';
  const FK = window.FK, D = FK.d, M = FK.M, C = FK.calc;

  /* ---------- Globo y papelitos ---------- */
  FK.sim('globo-papelitos', function (g) {
    const ctx = g.canvas(2.1);
    g.button('Soltar los papelitos', () => g.restart(), { icon: '📄', kind: 'ghost' });
    g.out('q', 'Carga del globo', { icon: '⚡' }); g.out('p', 'Papelitos pegados', { icon: '📄', hl: true });
    const S = { bx: 600, by: 250, q: 0, rub: false, last: null, bits: [], hair: [90, 60, 260, 230] };
    g.pointer({
      down(x, y) { S.drag = Math.hypot(x - S.bx, y - S.by) < 70; S.last = [x, y]; },
      move(x, y, e, down) {
        if (!down || !S.drag) return;
        S.bx = M.clamp(x, 40, 760); S.by = M.clamp(y, 40, 410);
        const [hx0, hy0, hx1, hy1] = S.hair;
        if (x > hx0 && x < hx1 && y > hy0 && y < hy1 && S.last) { const d = Math.hypot(x - S.last[0], y - S.last[1]); S.q = Math.min(100, S.q + d * 0.12); if (d > 6 && Math.random() < 0.15) FK.sfx.tick(); }
        S.last = [x, y];
      },
      up() { S.drag = false; }
    });
    g.run({
      init() { S.bx = 600; S.by = 250; S.q = 0; S.bits = Array.from({ length: 10 }, (_, i) => ({ x: 360 + i * 38 + M.rnd(-6, 6), y: 385, a: M.rnd(-0.3, 0.3), on: false, vy: 0, ox: 0, oy: 0 })); g.say('Arrastra el globo sobre el pelo (la zona marrón) varias veces. ¡Luego acércalo a los papelitos!'); },
      step(dt) {
        const reach = 40 + S.q * 3.2; /* alcance de la atracción según la carga */
        let on = 0;
        S.bits.forEach((b) => {
          const d = Math.hypot(b.x - S.bx, (b.y - 14) - S.by);
          if (!b.on && S.q > 8 && d < reach * 0.6 && d < 160) { b.on = true; b.ox = b.x - S.bx; b.oy = b.y - S.by; FK.sfx.pop(); }
          if (b.on) { b.ox += (M.rnd(-30, 30) - b.ox) * dt * 2; b.oy += (M.rnd(40, 70) - b.oy) * dt * 3; b.x = S.bx + b.ox; b.y = S.by + b.oy; on++; }
        });
        S.q = Math.max(0, S.q - dt * 0.4);
        g.show('q', FK.n(S.q, 0) + ' %'); g.show('p', on + ' de 10');
        if (on >= 6 && !g.won()) g.win('¡Seis papelitos! El globo cargado atrae los objetos neutros.');
      },
      draw(c, W, H) {
        D.sky(c, W, H, '#FFE5F2', '#FFF6FB'); D.ground(c, W, H - 30, H, '#C98A3F', '#A86B2A');
        c.fillStyle = 'rgba(120,70,30,.35)'; D.rr(c, S.hair[0], S.hair[1], S.hair[2] - S.hair[0], S.hair[3] - S.hair[1], 30); c.fill();
        D.emoji(c, '🧒', 175, 180, 160); D.text(c, 'frota aquí', 175, 270, { size: 16, align: 'center', weight: 700, color: '#7A400B' });
        S.bits.forEach((b) => { c.save(); c.translate(b.x, b.y); c.rotate(b.a + (b.on ? Math.sin(g.t * 5 + b.x) * 0.4 : 0)); c.fillStyle = '#fff'; c.fillRect(-9, -6, 18, 12); c.strokeStyle = D.INK; c.lineWidth = 2; c.strokeRect(-9, -6, 18, 12); c.restore(); });
        D.circle(c, S.bx, S.by, 56, '#FF3E9D', D.INK, 4); D.circle(c, S.bx - 18, S.by - 18, 12, 'rgba(255,255,255,.5)');
        D.line(c, S.bx, S.by + 56, S.bx - 6, S.by + 86, D.INK, 3);
        const minus = Math.floor(S.q / 12); for (let i = 0; i < minus; i++) D.text(c, '−', S.bx - 30 + (i % 4) * 20, S.by - 10 + Math.floor(i / 4) * 22, { size: 24, color: '#fff', weight: 700 });
        D.bar(c, 500, 24, 260, 22, S.q / 100, '#FF3E9D', 'carga: ' + FK.n(S.q, 0) + ' %', { ink: '#fff' });
        D.char(c, 'chispa', 700, 100, 70, S.q > 50 ? 'wow' : 'happy');
      }
    });

  /* ---------- Dos cargas ---------- */
  FK.sim('cargas-fuerza', function (g) {
    const ctx = g.canvas(2.6);
    g.choice('s1', { label: 'Carga de la izquierda', icon: '⬅️', options: [[1, '+ positiva'], [-1, '− negativa']], value: 1 });
    g.choice('s2', { label: 'Carga de la derecha', icon: '➡️', options: [[1, '+ positiva'], [-1, '− negativa']], value: -1 });
    g.slider('r', { label: 'Distancia entre ellas', icon: '↔️', min: 1, max: 6, step: 0.5, value: 2, unit: 'cm', fmt: (v) => FK.n(v, 1) });
    g.out('F', 'Fuerza', { icon: '💪', hl: true }); g.out('t', 'Qué pasa', { icon: '🔁' });

    g.run({
      static: true,

      draw(c, W, H) {

        const rel = 1 / (r * r), att = q1 * q2 < 0;
        g.show('F', FK.n(rel / (1 / 4), 2) + ' (relativa a 2 cm)'); g.show('t', att ? '🧲 se atraen' : '↔️ se repelen');
