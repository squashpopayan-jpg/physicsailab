  D.grid = function (ctx, W, H, step = 50, color = 'rgba(43,35,80,.10)') {
    ctx.strokeStyle = color; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= W; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = 0; y <= H; y += step) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
  };
  D.water = function (ctx, x, y, w, h, t = 0, color = 'rgba(30,136,255,.55)') {
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.fillStyle = color; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 3; ctx.beginPath();
    for (let i = 0; i <= w; i += 8) { const yy = y + 3 + Math.sin((i + t * 60) / 14) * 2.5; i ? ctx.lineTo(x + i, yy) : ctx.moveTo(x + i, yy); }
    ctx.stroke(); ctx.restore();
  };
  /* Personaje en el lienzo */
  D.char = function (ctx, id, x, y, size = 80, mood = 'happy', flip = false) {
    const img = FK.charImg(id, mood);
    if (!img.complete || !img.naturalWidth) return false;
    ctx.save(); ctx.translate(x, y); if (flip) ctx.scale(-1, 1);
    ctx.drawImage(img, -size / 2, -size / 2, size, size); ctx.restore();
    return true;
  };
  D.shadow = function (ctx, x, y, rx, ry = rx * 0.25) {
    ctx.save(); ctx.fillStyle = 'rgba(43,35,80,.22)'; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, M.TAU); ctx.fill(); ctx.restore();
  };
  /* Escala de colores cálido/frío para temperaturas 0..1 */
  D.heat = function (t) {
    t = M.clamp(t, 0, 1);
    const stops = [[0, [60, 90, 255]], [0.3, [40, 200, 230]], [0.5, [120, 220, 90]], [0.7, [255, 210, 40]], [1, [255, 60, 50]]];
    for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) {
      const [t0, c0] = stops[i - 1], [t1, c1] = stops[i], k = (t - t0) / (t1 - t0);
      return `rgb(${Math.round(c0[0] + (c1[0] - c0[0]) * k)},${Math.round(c0[1] + (c1[1] - c0[1]) * k)},${Math.round(c0[2] + (c1[2] - c0[2]) * k)})`;
    }
    return 'rgb(255,60,50)';
  };
  /* Color de una longitud de onda visible (nm) → rgb */
  D.wave = function (nm) {
    let r = 0, g = 0, b = 0;
    if (nm >= 380 && nm < 440) { r = -(nm - 440) / 60; b = 1; }
    else if (nm < 490) { g = (nm - 440) / 50; b = 1; }
    else if (nm < 510) { g = 1; b = -(nm - 510) / 20; }
    else if (nm < 580) { r = (nm - 510) / 70; g = 1; }
    else if (nm < 645) { r = 1; g = -(nm - 645) / 65; }
    else if (nm <= 750) { r = 1; }
    let f = 1;
    if (nm < 420) f = 0.3 + (0.7 * (nm - 380)) / 40; else if (nm > 700) f = 0.3 + (0.7 * (750 - nm)) / 50;
    const c = (x) => Math.round(255 * Math.pow(Math.max(0, x) * f, 0.8));
    return `rgb(${c(r)},${c(g)},${c(b)})`;
  };
})();

/* ==== core/20-sim.js ==== */
/* ===================================================================
   20-sim.js — motor de simulaciones tipo juego
   FK.sim('nombre', (g) => { ... })  con g.canvas, g.slider, g.choice, g.button,
   g.toggle, g.out/show, g.say, g.goal, g.win, g.run, g.pointer
   =================================================================== */
(function () {
  'use strict';
  const FK = window.FK, M = FK.M;
  const LOGICAL_W = 800;
  const uid = (() => { let n = 0; return () => 'fk' + ++n; })();

  /* Observador de visibilidad compartido: las simulaciones sólo corren cuando se ven */
  const vis = new Map();
  const io = 'IntersectionObserver' in window ? new IntersectionObserver((es) => {
    for (const e of es) { const g = vis.get(e.target); if (g) g._setVisible(e.isIntersecting); }
  }, { rootMargin: '80px' }) : null;

  FK.winKey = (name) => 'win:' + name;
  FK.isWon = (name) => !!FK.store.get(FK.winKey(name), false);

  FK.mountSim = function (host) {
    if (host._mounted) return host._g;
    const name = host.dataset.sim, factory = FK.sims[name];
    const art = host.closest('article');
    const guide = host.dataset.guide || (art && art.dataset.guide) || 'buho';
    const fig = FK.el('figure', 'simbox');
    host._mounted = true;
    if (!factory) { fig.innerHTML = `<div class="sim-error">Falta la simulación «${name}».</div>`; host.replaceChildren(fig); return null; }
    const tips = host.querySelector('ul, ol');
    const goalText = host.dataset.goal || '';
    fig.innerHTML = `
      <div class="sim-head"><span class="sim-badge" aria-hidden="true">🎮</span><b class="sim-title">${host.dataset.title || name}</b><span class="sim-star" title="Reto superado">☆</span></div>
      <div class="sim-goal" ${goalText ? '' : 'hidden'}><span aria-hidden="true">🎯</span><span class="sim-goal-t">${goalText}</span></div>
      <div class="sim-say"><span class="sim-av">${FK.char(guide, 'happy', 46)}</span><div class="sim-bubble" aria-live="polite"></div></div>
      <div class="sim-stage"></div>
      <div class="sim-outs"></div>
      <div class="sim-ctrl"></div>
      <div class="sim-foot"><button type="button" class="btn ghost sim-reset">↺ Otra vez</button></div>`;
    const q = (s) => fig.querySelector(s);
    const stage = q('.sim-stage'), ctrl = q('.sim-ctrl'), outs = q('.sim-outs'), bubble = q('.sim-bubble'), av = q('.sim-av');
    if (tips) { const d = FK.el('details', 'sim-tips'); d.innerHTML = '<summary>💡 Prueba esto</summary>'; d.appendChild(tips); fig.appendChild(d); }
    host.replaceChildren(fig);

    const g = {
      name, guide, fig, stage, host, p: {}, t: 0, playing: true, speed: 1, W: LOGICAL_W, H: 450, ctx: null, cv: null,
      _vis: false, _dirty: true, _o: null, _raf: 0, _dead: false, _h: {}, _outs: {}, _sliders: {}, _ctl: ctrl
    };
    FK.activeSims = FK.activeSims || new Set();
    FK.activeSims.add(g);

    g._setVisible = function (v) { g._vis = v; if (!v && g._stopAudio) g._stopAudio(); if (v && g._o && !g._raf) g._start(); };
    g.dirty = () => { g._dirty = true; };

    /* ----- lienzo ----- */
    g.canvas = function (aspect = 16 / 9, o = {}) {
      const cv = FK.el('canvas', 'sim-canvas');
      cv.setAttribute('role', 'img'); cv.setAttribute('aria-label', host.dataset.title || name);
      g.W = LOGICAL_W; g.H = Math.round(LOGICAL_W / aspect);
      stage.appendChild(cv);
      g.cv = cv; g.ctx = cv.getContext('2d');
      const fit = () => {
        const w = Math.max(160, Math.round(stage.clientWidth || cv.parentElement.clientWidth || 300));
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        cv.style.height = Math.round((w * g.H) / g.W) + 'px';
        cv.width = Math.round(w * dpr); cv.height = Math.round(((w * g.H) / g.W) * dpr);
        g.ctx.setTransform((w * dpr) / g.W, 0, 0, (w * dpr) / g.W, 0, 0);
        g.dirty();
      };
      g._fit = fit;
      if ('ResizeObserver' in window) new ResizeObserver(fit).observe(stage); else window.addEventListener('resize', fit);
      fit();
      return g.ctx;
    };
    /* Zona de HTML libre (juegos hechos con tarjetas y botones) */
    g.area = function (cls) { const d = FK.el('div', 'sim-area ' + (cls || '')); stage.appendChild(d); return d; };

    /* ----- controles ----- */
    const rowOf = (label, icon) => { const r = FK.el('div', 'ctl'); r.innerHTML = `<label>${icon ? `<span class="ctl-ic" aria-hidden="true">${icon}</span>` : ''}<span class="ctl-l">${label}</span></label>`; ctrl.appendChild(r); return r; };
    g.slider = function (key, o) {
      const id = uid();
      g.p[key] = o.value !== undefined ? o.value : o.min;
      const r = rowOf(o.label, o.icon);
      r.classList.add('ctl-slider');
      r.querySelector('label').setAttribute('for', id);
      const inp = FK.el('input'); inp.type = 'range'; inp.id = id;
      inp.min = o.min; inp.max = o.max; inp.step = o.step || 1; inp.value = g.p[key];
      const val = FK.el('output', 'ctl-v');
      const fmt = o.fmt || ((v) => FK.nice(v));
      const upd = () => { val.innerHTML = FK.supHtml(fmt(+inp.value) + (o.unit ? ' ' + o.unit : '')); const pct = ((+inp.value - o.min) / (o.max - o.min)) * 100; inp.style.setProperty('--pct', pct + '%'); };
      inp.addEventListener('input', () => {
        g.p[key] = +inp.value; upd(); g.dirty();
        if (o.onchange) o.onchange(g.p[key]);
        if (o.reset) g.restart();
      });
      r.append(inp, val); upd();
      g._sliders[key] = { inp, upd, o };
      return inp;
    };
    g.setSlider = function (key, v) { const s = g._sliders[key]; if (!s) return; s.inp.value = v; g.p[key] = +s.inp.value; s.upd(); g.dirty(); };
    g.choice = function (key, o) {
      g.p[key] = o.value !== undefined ? o.value : o.options[0][0];
      const r = rowOf(o.label, o.icon);
      r.classList.add('ctl-choice');
      const wrap = FK.el('div', 'chips');
      const btns = o.options.map(([v, lab, ic]) => {
        const b = FK.el('button', 'chip', `${ic ? `<span aria-hidden="true">${ic}</span>` : ''}${lab}`);
        b.type = 'button'; b.setAttribute('aria-pressed', v === g.p[key] ? 'true' : 'false');
        b.addEventListener('click', () => {
          g.p[key] = v; btns.forEach((x) => x.b.setAttribute('aria-pressed', x.v === v ? 'true' : 'false'));
          FK.sfx.tick(); g.dirty();
          if (o.onchange) o.onchange(v);
          if (o.reset) g.restart();
        });
        wrap.appendChild(b);
        return { b, v };
      });
      r.appendChild(wrap);
      g._h['choice_' + key] = (v) => { g.p[key] = v; btns.forEach((x) => x.b.setAttribute('aria-pressed', x.v === v ? 'true' : 'false')); g.dirty(); };
      return wrap;
    };
    g.setChoice = (key, v) => g._h['choice_' + key] && g._h['choice_' + key](v);
    g.toggle = function (key, o) {
      g.p[key] = !!o.value;
      const r = rowOf('', '');
      r.classList.add('ctl-toggle');
      const b = FK.el('button', 'switch', `<span class="knob"></span><span class="sw-l">${o.label}</span>`);
      b.type = 'button'; b.setAttribute('role', 'switch'); b.setAttribute('aria-checked', g.p[key] ? 'true' : 'false');
      b.addEventListener('click', () => {
        g.p[key] = !g.p[key]; b.setAttribute('aria-checked', g.p[key] ? 'true' : 'false'); FK.sfx.tick(); g.dirty();
        if (o.onchange) o.onchange(g.p[key]);
        if (o.reset) g.restart();
      });
      r.appendChild(b);
      g._h['toggle_' + key] = (v) => { g.p[key] = v; b.setAttribute('aria-checked', v ? 'true' : 'false'); g.dirty(); };
      return b;
    };
    g.setToggle = (key, v) => g._h['toggle_' + key] && g._h['toggle_' + key](v);
    g.button = function (label, fn, o = {}) {
      let bar = ctrl.querySelector(':scope > .btnrow:last-child');
      if (!bar || o.newRow) { bar = FK.el('div', 'btnrow'); ctrl.appendChild(bar); }
      const b = FK.el('button', 'btn ' + (o.kind || 'primary'), `${o.icon ? `<span aria-hidden="true">${o.icon}</span> ` : ''}${label}`);
      b.type = 'button';
      b.addEventListener('click', (e) => { try { fn(e); } catch (er) { g.error(er); } g.dirty(); });
      bar.appendChild(b);
      return b;
    };
    /* Lecturas (cifras que cambian) */
    g.out = function (key, label, o = {}) {
      const c = FK.el('div', 'out' + (o.hl ? ' hl' : ''), `<span class="out-l">${o.icon ? `<span aria-hidden="true">${o.icon}</span> ` : ''}${label}</span><b class="out-v">—</b>`);
      outs.appendChild(c);
      g._outs[key] = c.querySelector('.out-v');
      return c;
    };
    g.show = function (key, text) { const e = g._outs[key]; const h = FK.supHtml(text); if (e && e._h !== h) { e._h = h; e.innerHTML = h; } };

    /* ----- mensajes y metas ----- */
    g.say = function (text, mood = 'happy', who) {
      bubble.innerHTML = text;
      av.innerHTML = FK.char(who || guide, mood, 46);
      bubble.classList.remove('pop'); void bubble.offsetWidth; bubble.classList.add('pop');
    };
    g.goal = function (text) { const e = q('.sim-goal'); e.hidden = false; q('.sim-goal-t').innerHTML = text; };
    const starEl = q('.sim-star');
    const paintStar = () => { const w = FK.isWon(name); starEl.textContent = w ? '⭐' : '☆'; starEl.classList.toggle('on', w); };
    paintStar();
    g.won = () => FK.isWon(name);
    g.win = function (msg) {
      const first = !FK.isWon(name);
      if (first) {
        FK.store.set(FK.winKey(name), true); paintStar();
        FK.sfx.win(); FK.confetti(80);
        if (FK.updateProgress) FK.updateProgress();
        g.say(msg || '¡Reto superado! ¡Ganaste una estrella!', 'wow');
      } else {
        FK.sfx.ok(); g.say(msg || '¡Muy bien otra vez!', 'happy');
      }
      return first;
    };
    g.error = function (er) {
      console.error('[sim ' + name + ']', er);
      if (!fig.querySelector('.sim-error')) fig.appendChild(FK.el('div', 'sim-error', 'Error en la simulación «' + name + '»: ' + (er && er.message ? er.message : er)));
    };

    /* ----- bucle ----- */
    g.run = function (o) {
      g._o = o;
      try { if (o.init) o.init(); } catch (er) { g.error(er); }
      g.dirty();
      if (g._vis) g._start();
    };
    g.restart = function () {
      g.t = 0; g.playing = true;
      try { if (g._o && g._o.init) g._o.init(); } catch (er) { g.error(er); }
      g.dirty(); if (g._vis && !g._raf) g._start();
    };
    let last = 0;
    const frame = (now) => {
      if (!g._vis || g._dead || !document.body.contains(fig)) { g._raf = 0; return; }
      const dt = Math.min(0.05, (now - last) / 1000) * g.speed; last = now;
      const o = g._o;
      try {
        if (o.step && g.playing) { o.step(dt); g.t += dt; }
        if (o.draw && (!o.static || g._dirty || g.playing)) { g.ctx.save(); o.draw(g.ctx, g.W, g.H); g.ctx.restore(); g._dirty = false; }
      } catch (er) { g.error(er); g._raf = 0; return; }
      g._raf = requestAnimationFrame(frame);
    };
    g._start = function () { if (g._raf) return; last = performance.now(); g._raf = requestAnimationFrame(frame); };
    /* Para pruebas automáticas: avanza n pasos sin esperar al reloj */
    g._tick = function (n = 1, dt = 1 / 60) {
      const o = g._o; if (!o) return;
      for (let i = 0; i < n; i++) { if (o.step && g.playing) { o.step(dt); g.t += dt; } }
      if (o.draw && g.ctx) { g.ctx.save(); o.draw(g.ctx, g.W, g.H); g.ctx.restore(); }
    };

    /* ----- puntero (en coordenadas lógicas) ----- */
    g.pointer = function (h, target) {
      const cv = target || g.cv;
      cv.style.touchAction = 'none';
      const pos = (e) => { const r = cv.getBoundingClientRect(); return [((e.clientX - r.left) * g.W) / r.width, ((e.clientY - r.top) * g.H) / r.height]; };
      let down = false;
      cv.addEventListener('pointerdown', (e) => { down = true; try { cv.setPointerCapture(e.pointerId); } catch (x) { /* */ } const [x, y] = pos(e); if (h.down) h.down(x, y, e); g.dirty(); });
      cv.addEventListener('pointermove', (e) => { const [x, y] = pos(e); if (h.move) h.move(x, y, e, down); g.dirty(); });
      const up = (e) => { if (!down) return; down = false; const [x, y] = pos(e); if (h.up) h.up(x, y, e); g.dirty(); };
      cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    };

    q('.sim-reset').addEventListener('click', () => { FK.sfx.pop(); g.restart(); });

    host._g = g;
    try { factory(g); } catch (er) { g.error(er); }
    vis.set(fig, g);
    if (io) io.observe(fig); else g._setVisible(true);
    return g;
  };

  /* ===================================================================
     Kits de juegos hechos con tarjetas (sin lienzo)
     =================================================================== */
  const kit = (FK.kit = {});

  /* Une cada elemento de la izquierda con el de la derecha. pairs: [[izq, der], ...] (html) */
  kit.match = function (g, pairs, o = {}) {
    const area = g.area('kit-match');
    const L = M.shuffle(pairs.map((p, i) => ({ i, t: p[0] }))), R = M.shuffle(pairs.map((p, i) => ({ i, t: p[1] })));
    let selL = null, done = 0, errors = 0;
    area.innerHTML = '<div class="km-col km-l"></div><div class="km-col km-r"></div>';
    const cl = area.querySelector('.km-l'), cr = area.querySelector('.km-r');
    const mk = (it, col, side) => { const b = FK.el('button', 'km-card ' + side, it.t); b.type = 'button'; b.dataset.i = it.i; col.appendChild(b); it.b = b; };
    L.forEach((it) => mk(it, cl, 'l')); R.forEach((it) => mk(it, cr, 'r'));
    const click = (it, side) => {
      if (it.b.classList.contains('done')) return;
      if (side === 'l') { L.forEach((x) => x.b.classList.remove('sel')); selL = it; it.b.classList.add('sel'); FK.sfx.tick(); return; }
      if (!selL) { g.say(o.hint || 'Primero toca una tarjeta de la izquierda.', 'think'); return; }
      if (selL.i === it.i) {
        selL.b.classList.remove('sel'); selL.b.classList.add('done'); it.b.classList.add('done'); selL = null; done++; FK.sfx.ok();
        g.say('¡Correcto! ' + (o.okMsg || ''), 'happy');
        if (done === pairs.length) g.win(errors === 0 ? '¡Todo perfecto, sin errores!' : '¡Las uniste todas!');
      } else { errors++; it.b.classList.add('shake'); setTimeout(() => it.b.classList.remove('shake'), 400); FK.sfx.no(); g.say('Mmm, esa no. ¡Inténtalo otra vez!', 'sad'); }
    };
    L.forEach((it) => it.b.addEventListener('click', () => click(it, 'l')));
    R.forEach((it) => it.b.addEventListener('click', () => click(it, 'r')));
    g.run({ static: true, init() { done = 0; errors = 0; selL = null; area.querySelectorAll('.km-card').forEach((b) => b.classList.remove('done', 'sel')); g.say(o.start || 'Toca una tarjeta de la izquierda y luego la que le corresponde.'); } });
  };

  /* Ordena: el niño toca las tarjetas en el orden correcto. items en el orden CORRECTO. */
  kit.order = function (g, items, o = {}) {
    const area = g.area('kit-order');
    let next = 0, errors = 0;
    const deck = M.shuffle(items.map((t, i) => ({ i, t })));
    area.innerHTML = '<div class="ko-slots"></div><div class="ko-deck"></div>';
    const slots = area.querySelector('.ko-slots'), dk = area.querySelector('.ko-deck');
    items.forEach((_, i) => slots.appendChild(FK.el('div', 'ko-slot', `<span>${i + 1}</span>`)));
    deck.forEach((it) => { const b = FK.el('button', 'ko-card', it.t); b.type = 'button'; it.b = b; dk.appendChild(b);
      b.addEventListener('click', () => {
        if (b.classList.contains('used')) return;
        if (it.i === next) {
          b.classList.add('used'); const s = slots.children[next]; s.innerHTML = it.t; s.classList.add('full'); next++; FK.sfx.ok();
          g.say(next === items.length ? '' : (o.okMsg || '¡Bien! ¿Cuál sigue?'), 'happy');
          if (next === items.length) g.win(errors === 0 ? '¡En orden y sin errores!' : '¡Lo ordenaste!');
        } else { errors++; b.classList.add('shake'); setTimeout(() => b.classList.remove('shake'), 400); FK.sfx.no(); g.say('Esa no va todavía. ¡Piensa cuál fue antes!', 'think'); }
      }); });
    g.run({ static: true, init() { next = 0; errors = 0; deck.forEach((it) => it.b.classList.remove('used')); slots.querySelectorAll('.ko-slot').forEach((s, i) => { s.classList.remove('full'); s.innerHTML = `<span>${i + 1}</span>`; }); g.say(o.start || 'Toca las tarjetas en el orden correcto.'); } });
  };

  /* Clasifica: una tarjeta a la vez, el niño elige la caja. bins:[{id,label,icon}], items:[{t, bin}] */
  kit.sort = function (g, bins, items, o = {}) {
    const area = g.area('kit-sort');
    let order = [], k = 0, ok = 0, tries = 0;
    area.innerHTML = '<div class="ks-card"></div><div class="ks-bins"></div><div class="ks-count"></div>';
    const card = area.querySelector('.ks-card'), bb = area.querySelector('.ks-bins'), cnt = area.querySelector('.ks-count');
    bins.forEach((b) => { const x = FK.el('button', 'ks-bin', `<span class="ks-ic">${b.icon || ''}</span>${b.label}`); x.type = 'button'; x.addEventListener('click', () => pick(b.id)); bb.appendChild(x); });
    const show = () => {
      if (k >= order.length) { card.innerHTML = '🎉'; cnt.textContent = ''; const need = Math.ceil(order.length * (o.need || 0.8));
        if (ok >= need) g.win(ok === order.length ? '¡Todas bien!' : `¡${ok} de ${order.length}! ¡Muy bien!`); else g.say(`Acertaste ${ok} de ${order.length}. ¡Toca «Otra vez» para mejorar!`, 'think'); return; }
      card.innerHTML = order[k].t; card.classList.remove('bad', 'good'); cnt.textContent = `${k + 1} de ${order.length}`;
    };
    const pick = (id) => {
      if (k >= order.length) return;
      tries++;
      if (order[k].bin === id) { ok++; card.classList.add('good'); FK.sfx.ok(); g.say(order[k].why || '¡Sí!', 'happy'); } else { card.classList.add('bad'); FK.sfx.no(); const b = bins.find((x) => x.id === order[k].bin); g.say((order[k].why ? order[k].why + ' ' : '') + `Va en «${b.label}».`, 'sad'); }
      k++; setTimeout(show, 900);
    };
    g.run({ static: true, init() { order = M.shuffle(items); k = 0; ok = 0; tries = 0; g.say(o.start || 'Mira la tarjeta y elige a qué caja pertenece.'); show(); } });
  };
})();

/* ==== core/30-ui.js ==== */
/* ===================================================================
   30-ui.js — componentes de página: globos, datos curiosos, preguntas,
   experimentos, palabras con significado, lectura en voz alta
   =================================================================== */
(function () {
  'use strict';
  const FK = window.FK;
  const LET = ['A', 'B', 'C', 'D'];

  FK.qKey = (ch, i) => `q:${ch}:${i}`;
  FK.eKey = (ch, i) => `e:${ch}:${i}`;

  /* ---------- Texto para leer en voz alta ---------- */
  function readable(root) {
    const out = [];
    root.querySelectorAll('p, li, .say-b, h3, summary').forEach((e) => {
      if (e.closest('.simbox, .quiz, .exp, .tts-skip, details:not([open]) > :not(summary)')) return;
      const t = e.textContent.replace(/\s+/g, ' ').trim();
      if (t) out.push(t);
    });
    return out.join('. ');
  }

  /* ---------- Globos de diálogo ---------- */
  function say(el, art) {
    const who = el.dataset.who || art.dataset.guide;
    const mood = el.dataset.mood || 'happy';
    const c = FK.CHARS[who] || FK.CHARS.buho;
    const body = el.innerHTML;
    el.style.setProperty('--c', c.color); el.style.setProperty('--cs', c.soft); el.style.setProperty('--cd', c.dark);
    el.innerHTML = `<div class="say-av">${FK.char(who, mood, 76)}<span class="say-n">${c.name}</span></div><div class="say-b">${body}</div>`;
  }

  /* ---------- Preguntas ---------- */
  function quiz(el, art) {
    const ch = art.dataset.id;
    el.insertAdjacentHTML('afterbegin', '<h3 class="quiz-h"><span aria-hidden="true">🧠</span> ¡A pensar!</h3>');
    el.querySelectorAll('.q').forEach((q, i) => {
      const ans = +q.dataset.ans;
      const key = FK.qKey(ch, i);
      const opts = Array.from(q.querySelectorAll('ol > li'));
      const ol = q.querySelector('ol');
      const why = q.querySelector('.why');
      if (why) why.hidden = true;
      q.querySelector('p').insertAdjacentHTML('afterbegin', `<span class="qn">${i + 1}</span>`);
      const box = FK.el('div', 'opts');
      opts.forEach((li, j) => {
        const b = FK.el('button', 'opt', `<span class="opt-l">${LET[j]}</span><span>${li.innerHTML}</span>`);
        b.type = 'button';
        b.addEventListener('click', () => {
          if (q.classList.contains('solved')) return;
          if (j === ans) {
            b.classList.add('right'); q.classList.add('solved'); FK.sfx.ok();
            const first = !FK.store.get(key, false);
            FK.store.set(key, true);
            if (why) { why.hidden = false; why.insertAdjacentHTML('afterbegin', '<b>¡Correcto!</b> '); }
            if (first) { FK.confetti(25); FK.updateProgress(); }
          } else {
            b.classList.add('wrong'); FK.sfx.no();
            setTimeout(() => b.classList.remove('wrong'), 600); b.disabled = true;
            let h = q.querySelector('.hint'); if (!h) { h = FK.el('p', 'hint'); q.appendChild(h); }
            h.textContent = 'Casi… ¡prueba otra opción!';
          }
        });
        box.appendChild(b);
      });
      ol.replaceWith(box);
      if (FK.store.get(key, false)) { q.classList.add('solved'); box.children[ans].classList.add('right'); if (why) { why.hidden = false; why.insertAdjacentHTML('afterbegin', '<b>¡Correcto!</b> '); } }
    });
  }

  /* ---------- Experimentos ---------- */
  function exp(el, art, idx) {
    const ch = art.dataset.id;
    const key = FK.eKey(ch, idx);
    const title = el.dataset.title || 'Experimento';
    const adult = el.dataset.adult === '1' || el.dataset.adult === 'true';
    const level = { 1: 'Fácil', 2: 'Medio', 3: 'Reto' }[el.dataset.level] || el.dataset.level || 'Fácil';
    const mat = el.querySelector('ul.mat'), steps = el.querySelector('ol.steps'), pred = el.querySelector('.predict'), res = el.querySelector('.result'), why = el.querySelector('.why'), warn = el.querySelector('.warn');
    const matHtml = mat ? mat.innerHTML : '', stepsHtml = steps ? steps.innerHTML : '';
    const predHtml = pred ? pred.innerHTML : '', resHtml = res ? res.innerHTML : '', whyHtml = why ? why.innerHTML : '', warnHtml = warn ? warn.innerHTML : '';
    el.innerHTML = `
      <div class="exp-head"><span class="exp-ic" aria-hidden="true">🧪</span><div><small>Experimento en casa</small><b>${title}</b></div>
        <div class="exp-chips"><span class="chip-i">⏱ ${el.dataset.time || '10 min'}</span><span class="chip-i">⭐ ${level}</span>${adult ? '<span class="chip-i adult">👩‍👧 Con un adulto</span>' : ''}</div></div>
      ${adult ? '<div class="exp-adult">👩‍👧 <b>Pide ayuda a un adulto</b> para este experimento.</div>' : ''}
      ${warnHtml ? `<div class="warn"><b>⚠️ Cuidado:</b> ${warnHtml}</div>` : ''}
      <div class="exp-cols"><div><h4>🧺 Necesitas</h4><ul class="mat">${matHtml}</ul></div><div><h4>👣 Paso a paso</h4><ol class="steps">${stepsHtml}</ol></div></div>
      ${predHtml ? `<div class="exp-pred"><b>🤔 Antes de empezar, piensa:</b> ${predHtml}</div>` : ''}
      <div class="exp-reveal" hidden>${resHtml ? `<div class="exp-res"><b>👀 ¿Qué pasó?</b> ${resHtml}</div>` : ''}${whyHtml ? `<div class="exp-why"><b>💡 ¿Por qué?</b> ${whyHtml}</div>` : ''}</div>
      <div class="exp-foot"><button type="button" class="btn ghost exp-show">👀 Ver qué pasa</button><label class="done-l"><input type="checkbox" class="exp-done"><span>¡Lo hice!</span></label></div>`;
    const done = el.querySelector('.exp-done'), rev = el.querySelector('.exp-reveal');
    done.checked = !!FK.store.get(key, false);
    done.addEventListener('change', () => { FK.store.set(key, done.checked); if (done.checked) { FK.sfx.win(); FK.confetti(40); } FK.updateProgress(); });
    el.querySelector('.exp-show').addEventListener('click', (e) => { rev.hidden = !rev.hidden; e.target.textContent = rev.hidden ? '👀 Ver qué pasa' : '🙈 Esconder'; });
    if (!resHtml && !whyHtml) el.querySelector('.exp-show').remove();
  }

  /* ---------- Palabras con significado ---------- */
  let tip = null;
  function showTip(d) {
    if (!tip) { tip = FK.el('div', 'dfn-tip'); tip.setAttribute('role', 'tooltip'); document.body.appendChild(tip); document.addEventListener('click', (e) => { if (!e.target.closest('dfn')) tip.classList.remove('on'); }); }
    tip.innerHTML = `<b>${d.textContent}</b><br>${d.dataset.def}`;
    const r = d.getBoundingClientRect();
    tip.classList.add('on');
    const w = Math.min(300, window.innerWidth - 24);
    tip.style.width = w + 'px';
    tip.style.left = Math.max(12, Math.min(window.innerWidth - w - 12, r.left + window.scrollX + r.width / 2 - w / 2)) + 'px';
    tip.style.top = r.bottom + window.scrollY + 8 + 'px';
  }

  /* ---------- Mejora de un capítulo ---------- */
  FK.enhance = function (art) {
    art.querySelectorAll('.say').forEach((e) => say(e, art));
    art.querySelectorAll('.fact').forEach((e) => { if (!e.querySelector('.box-h')) e.insertAdjacentHTML('afterbegin', `<div class="box-h">🤯 ¿Sabías que…?</div>`); });
    art.querySelectorAll('.magic').forEach((e) => { if (!e.querySelector('.box-h')) e.insertAdjacentHTML('afterbegin', `<div class="box-h">✨ ${e.dataset.name || 'Fórmula mágica'}</div>`); });
    art.querySelectorAll('.story').forEach((e) => { if (!e.querySelector('.box-h')) e.insertAdjacentHTML('afterbegin', `<div class="box-h">📜 ${e.dataset.title || 'Una historia'}</div>`); });
    art.querySelectorAll(':scope .warn:not(.exp .warn)').forEach((e) => { if (!e.querySelector('.box-h')) e.insertAdjacentHTML('afterbegin', `<div class="box-h">⚠️ Cuidado</div>`); });
    art.querySelectorAll('details.curious').forEach((d) => { if (!d.querySelector('summary')) d.insertAdjacentHTML('afterbegin', '<summary>🧠 Para mentes curiosas</summary>'); });
    art.querySelectorAll('dfn[data-def]').forEach((d) => { d.tabIndex = 0; d.setAttribute('role', 'button'); d.addEventListener('click', (e) => { e.stopPropagation(); showTip(d); }); d.addEventListener('keydown', (e) => { if (e.key === 'Enter') showTip(d); }); });
    art.querySelectorAll('.exp').forEach((e, i) => exp(e, art, i));
    art.querySelectorAll('.quiz').forEach((e) => quiz(e, art));
    /* botón de lectura en voz alta en cada sección */
    if (FK.speakOK()) {
      art.querySelectorAll('section > h2').forEach((h) => {
        const b = FK.el('button', 'tts', '🔊'); b.type = 'button'; b.title = 'Escuchar esta parte'; b.setAttribute('aria-label', 'Escuchar esta parte');
        b.addEventListener('click', () => {
          if (FK.speaking) { FK.stopSpeak(); document.querySelectorAll('.tts.on').forEach((x) => x.classList.remove('on')); return; }
          const sec = h.parentElement;
          b.classList.add('on');
          FK.speak(h.firstChild.textContent + '. ' + readable(sec), () => b.classList.remove('on'));
        });
        h.appendChild(b);
      });
    }
    /* simulaciones: se montan al acercarse */
    const hosts = Array.from(art.querySelectorAll('.sim[data-sim]'));
    if ('IntersectionObserver' in window) {
      const lazy = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { lazy.unobserve(e.target); FK.mountSim(e.target); } }), { rootMargin: '500px' });
      hosts.forEach((h) => { h.classList.add('sim-ph'); h.innerHTML = '<div class="sim-loading">🎮 Preparando el juego…</div>'; lazy.observe(h); });
    } else hosts.forEach((h) => FK.mountSim(h));
  };

  /* ---------- Progreso ---------- */
  FK.stats = function (ch) {
    const info = FK.chapterInfo && FK.chapterInfo[ch];
    if (!info) return { done: 0, total: 0 };
    let done = 0;
    info.sims.forEach((s) => { if (FK.isWon(s)) done++; });
    for (let i = 0; i < info.nq; i++) if (FK.store.get(FK.qKey(ch, i), false)) done++;
    for (let i = 0; i < info.ne; i++) if (FK.store.get(FK.eKey(ch, i), false)) done++;
    return { done, total: info.sims.length + info.nq + info.ne };
  };
  FK.totalStars = function () {
    let d = 0, t = 0;
    for (const id in (FK.chapterInfo || {})) { const s = FK.stats(id); d += s.done; t += s.total; }
    return { done: d, total: t };
  };
  FK.updateProgress = function () {
    const tot = FK.totalStars();
    const el = document.getElementById('starCount');
    if (el) el.textContent = tot.done;
    document.querySelectorAll('[data-prog]').forEach((e) => {
      const s = FK.stats(e.dataset.prog);
      const pct = s.total ? Math.round((100 * s.done) / s.total) : 0;
      e.style.setProperty('--pct', pct + '%');
      if (e.classList.contains('lvl')) { e.classList.toggle('full', s.total > 0 && s.done === s.total); e.classList.toggle('some', s.done > 0); }
      const t = e.querySelector('.prog-t'); if (t) t.textContent = `${s.done} / ${s.total}`;
    });
    if (FK.onProgress) FK.onProgress();
  };
})();

/* ==== core/40-calc.js ==== */
/* ===================================================================
   40-calc.js — cálculos de física puros (se prueban en tests/run.js)
   Cada capítulo añade aquí las funciones que sus simulaciones usan.
   =================================================================== */
(function () {
  'use strict';
  const root = typeof window !== 'undefined' ? window : globalThis;
  const FK = (root.FK = root.FK || {});
  const C = (FK.calc = FK.calc || {});

  /* gravedad en la superficie (m/s²) */
  C.GRAV = { tierra: 9.8, luna: 1.62, marte: 3.71, jupiter: 24.79, venus: 8.87, mercurio: 3.7, saturno: 10.44, urano: 8.87, neptuno: 11.15, pluton: 0.62, sol: 274 };

  /* ---- Caída con resistencia del aire: a = g (1 − (v/vt)²). vt = velocidad terminal (Infinity = sin aire) ---- */
  C.stepFall = function (s, dt, g, vt) {
    const a = g * (1 - (isFinite(vt) ? (s.v * s.v) / (vt * vt) : 0));
    const v2 = s.v + a * dt;
    s.y += 0.5 * (s.v + v2) * dt; s.v = v2;
    return s;
  };
  /* Tiempo para caer h metros, integrando paso a paso */
  C.dropRun = function (h, g, vt, dt = 1 / 480) {
    const s = { y: 0, v: 0 };
    let t = 0;
    while (s.y < h && t < 600) {
      const y0 = s.y, v0 = s.v;
      C.stepFall(s, dt, g, vt);
      if (s.y >= h) { const f = (h - y0) / (s.y - y0); t += dt * f; s.v = v0 + (s.v - v0) * f; s.y = h; break; }
      t += dt;
    }
    return { t, v: s.v };
  };
  /* Solución exacta: t = (vt/g) acosh(exp(g h / vt²)) */
  C.fallTimeExact = function (h, g, vt) {
    if (!isFinite(vt)) return Math.sqrt((2 * h) / g);
    return (vt / g) * Math.acosh(Math.exp((g * h) / (vt * vt)));
  };

  /* ---- Tiro parabólico sin aire ---- */
  C.range = (v, th, g) => (v * v * Math.sin(2 * th)) / g;
  C.apex = (v, th, g) => Math.pow(v * Math.sin(th), 2) / (2 * g);
  C.flightTime = (v, th, g) => (2 * v * Math.sin(th)) / g;

  /* ---- Fuerzas ---- */
  /* Retroceso al lanzar una bola de masa m con rapidez relativa w desde un cuerpo de masa M (conserva el momento) */
  C.recoil = (M, m, w) => (m * w) / (M + m);
  /* Aceleración de un bloque en una rampa de ángulo th con rozamiento mu (0 si se queda quieto) */
  C.rampAcc = (th, mu, g = 9.8) => Math.max(0, g * (Math.sin(th) - mu * Math.cos(th)));
  C.critAngle = (mu) => Math.atan(mu);
  /* Distancia de frenado y de reacción */
  C.brakeDist = (v, mu, g = 9.8) => (v * v) / (2 * mu * g);

  /* ---- Energía ---- */
  /* Altura máxima sobre el punto de salida de una bola lanzada por un resorte comprimido x (se parte de -x) */
  C.springHeight = (k, x, m, g = 9.8) => (k * x * x) / (2 * m * g) - x;
  /* Rapidez en un punto de la montaña rusa sin fricción */
  C.coasterSpeed = (h0, h, g = 9.8) => Math.sqrt(Math.max(0, 2 * g * (h0 - h)));

  /* ---- Rotación: se conserva L = I w; I = I0 + k r² ---- */
  C.skaterOmega = (L, I0, k, r) => L / (I0 + k * r * r);

  /* ---- Choques en una dimensión (b en reposo o con velocidad vb) ---- */
  C.collide1D = (ma, va, mb, vb) => [((ma - mb) * va + 2 * mb * vb) / (ma + mb), ((mb - ma) * vb + 2 * ma * va) / (ma + mb)];
  C.stick1D = (ma, va, mb, vb) => { const v = (ma * va + mb * vb) / (ma + mb); return [v, v]; };

  /* ---- Fluidos ---- */
  C.floats = (rhoObj, rhoLiq) => rhoObj < rhoLiq;
  C.submerged = (rhoObj, rhoLiq) => Math.min(1, rhoObj / rhoLiq);
  /* Calado de un casco de área A (m²) con masa total m (kg) en agua de densidad rho (kg/m³) */
  C.draft = (m, rho, A) => m / (rho * A);
  /* Gotas que aguanta una moneda: proporcional a la tensión superficial (72 mN/m agua, ~30 con jabón) */
  C.dropCapacity = (jabon) => (jabon ? 12 : 28);

  /* Alcance horizontal de un chorro (Torricelli) que sale a profundidad y de un tanque en una mesa de altura tab, con agua a lvl */
  C.jetSpeed = (y, g = 9.8) => Math.sqrt(2 * g * y);
  C.jetRange = (y, tab, lvl, g = 9.8) => C.jetSpeed(y, g) * Math.sqrt((2 * (tab + lvl - y)) / g);
  /* Presión (atm) a profundidad d (m) en agua dulce */
  C.waterPressure = (d) => 1 + (1000 * 9.8 * d) / 101325;
  /* Presión del aire (kPa) a altura h (m): atmósfera estándar */
  C.airPressure = (h) => 101.325 * Math.pow(1 - 2.25577e-5 * h, 5.25588);
  /* Punto de ebullición del agua (°C) a presión p (kPa): ecuación de Antoine (1–100 °C) */
  C.boilingPoint = (p) => 1730.63 / (8.07131 - Math.log10(p * 7.50062)) - 233.426;

  /* ---- Vuelo ---- */
  /* Coeficiente de sustentación de un ala curva: sube con el ángulo (°) hasta 15° y luego entra en pérdida */
  C.wingCL = (a) => (a <= 15 ? 0.3 + 0.1 * a : Math.max(0.5, 1.8 - 0.25 * (a - 15)));
  C.wingLift = (v, a, S, rho = 1.2) => 0.5 * rho * v * v * S * C.wingCL(a);
  /* Rapidez terminal: peso = resistencia del aire */
  C.terminalSpeed = (m, A, Cd, rho = 1.2) => Math.sqrt((2 * m * 9.8) / (rho * Cd * A));
  /* Empuje neto de un globo de aire caliente (N): volumen V, masa total m, aire de afuera Tout, adentro Tin (°C) */
  C.balloonNet = (V, m, Tout, Tin, rhoOut = 1.2) => { const rin = (rhoOut * (Tout + 273.15)) / (Tin + 273.15); return (rhoOut - rin) * V * 9.8 - m * 9.8; };

  /* ---- Calor ---- */
  C.c2f = (c) => (c * 9) / 5 + 32;
  C.c2k = (c) => c + 273.15;
  C.f2c = (f) => ((f - 32) * 5) / 9;
  /* Temperatura final al mezclar dos masas de agua (m1 a T1, m2 a T2) */
  C.mixTemp = (m1, T1, m2, T2) => (m1 * T1 + m2 * T2) / (m1 + m2);
  /* Camiseta al sol: absorbe una fracción a de la radiación; se calienta hacia Teq con constante de 4 min */
  C.shirtTemp = (a, min, T0 = 28) => { const Teq = T0 + 38 * a; return Teq - (Teq - T0) * Math.exp(-min / 4); };

  /* Curva de calentamiento de m gramos de agua que empieza como hielo a −20 °C (J). c_hielo 2,1; fusión 334 J/g; c_agua 4,18; vaporización 2260 J/g; c_vapor 2,0 */
  C.heatCurve = (Q, m = 100) => {
    const Q1 = m * 2.1 * 20, Q2 = m * 334, Q3 = m * 4.18 * 100, Q4 = m * 2260, Q5 = m * 2.0 * 20, tot = Q1 + Q2 + Q3 + Q4 + Q5;
    if (Q <= Q1) return { T: -20 + Q / (m * 2.1), phase: 'hielo', frac: 0, Qtotal: tot };
    if (Q <= Q1 + Q2) return { T: 0, phase: 'derrite', frac: (Q - Q1) / Q2, Qtotal: tot };
    if (Q <= Q1 + Q2 + Q3) return { T: (Q - Q1 - Q2) / (m * 4.18), phase: 'agua', frac: 0, Qtotal: tot };
    if (Q <= Q1 + Q2 + Q3 + Q4) return { T: 100, phase: 'hierve', frac: (Q - Q1 - Q2 - Q3) / Q4, Qtotal: tot };
    return { T: 100 + Math.min(Q - Q1 - Q2 - Q3 - Q4, Q5) / (m * 2.0), phase: 'vapor', frac: 1, Qtotal: tot };
  };
  /* Máquinas de calor: límite de Carnot (temperaturas en kelvin) */
  C.carnot = (Th, Tc) => 1 - Tc / Th;

  /* ---- Vaivenes ---- */
  C.pendulumPeriod = (L, g = 9.8) => 2 * Math.PI * Math.sqrt(L / g);
  C.springPeriod = (m, k) => 2 * Math.PI * Math.sqrt(m / k);
  C.hookeExt = (m, k, g = 9.8) => (m * g) / k;

  /* ---- Ondas ---- */
  C.waveSpeed = (f, lam) => f * lam;
  /* Líneas nodales entre dos fuentes en fase separadas d, longitud de onda lam */
  C.nodalLines = (d, lam) => 2 * Math.floor(d / lam + 0.5);
  /* Frecuencias de una cuerda fija en ambos extremos */
  C.stringMode = (n, v, L) => (n * v) / (2 * L);

  /* ---- Sonido ---- */
  C.VSOUND = 343;
  C.logFreq = (s) => 20 * Math.pow(1000, s / 100); /* 0..100 → 20 Hz..20 kHz */
  C.echoTime = (d) => (2 * d) / C.VSOUND;
  C.echoDist = (t) => (C.VSOUND * t) / 2;
  /* Fuente que se mueve: vr = componente de su velocidad hacia el oyente (m/s, negativo si se aleja) */
  C.dopplerSource = (f0, vr) => (f0 * C.VSOUND) / (C.VSOUND - vr);
  C.thunderKm = (s) => s / 3;

  /* ---- Música ---- */
  /* Frecuencia fundamental de una cuerda: largo L (m), tensión T (N), masa por metro mu (kg/m) */
  C.stringFreq = (L, T, mu) => Math.sqrt(T / mu) / (2 * L);
  /* Botella soplada: columna de aire Lair (m), tubo cerrado en un extremo con corrección de borde */
  C.bottleFreq = (Lair) => C.VSOUND / (4 * (Lair + 0.009));
  C.noteName = (f) => {
    const midi = Math.round(69 + 12 * Math.log2(f / 440)), N = ['Do', 'Do♯', 'Re', 'Re♯', 'Mi', 'Fa', 'Fa♯', 'Sol', 'Sol♯', 'La', 'La♯', 'Si'];
    return N[((midi % 12) + 12) % 12] + (Math.floor(midi / 12) - 1);
  };

  /* ---- Luz ---- */
  C.VLIGHT = 299792458;
  /* Altura de la sombra en una pared a distancia wall de la linterna, con un objeto de altura h a distancia d (triángulos semejantes) */
  C.shadowHeight = (h, d, wall) => (h * wall) / d;
  /* Cámara oscura: objeto de alto H a distancia O (cm), pantalla a s (cm), agujero de a (cm). Imagen invertida de alto H s/O; mancha a (1 + s/O) */
  C.pinhole = (H, O, s, a) => ({ h: (H * s) / O, blur: a * (1 + s / O), bright: Math.pow(a / 1.2, 2) });

  /* Reflexión de un rayo con dirección d sobre una superficie de normal unitaria n */
  C.reflect = (d, n) => { const k = 2 * (d[0] * n[0] + d[1] * n[1]); return [d[0] - k * n[0], d[1] - k * n[1]]; };
  /* Distancia t a la que un rayo (p, d) cruza un segmento [x1,y1,x2,y2]; null si no lo cruza */
  C.raySegment = (p, d, s) => {
    const sx = s[2] - s[0], sy = s[3] - s[1], den = d[0] * sy - d[1] * sx;
    if (Math.abs(den) < 1e-12) return null;
    const t = ((s[0] - p[0]) * sy - (s[1] - p[1]) * sx) / den, u = ((s[0] - p[0]) * d[1] - (s[1] - p[1]) * d[0]) / den;
    return t > 0 && u >= 0 && u <= 1 ? t : null;
  };
  C.rayCircle = (p, d, c, r) => {
    const fx = p[0] - c[0], fy = p[1] - c[1], b = fx * d[0] + fy * d[1], cc = fx * fx + fy * fy - r * r, disc = b * b - cc;

    const a2 = (2 * Math.sin(d) * (w1 * w1 * 2 + g * 2 * Math.cos(t1) + w2 * w2 * Math.cos(d))) / den;
    return [w1, w2, a1, a2];
  };
  C.dblPend = (s, h) => {
    const add = (a, b, k) => a.map((x, i) => x + b[i] * k);
    const k1 = dbl(s), k2 = dbl(add(s, k1, h / 2)), k3 = dbl(add(s, k2, h / 2)), k4 = dbl(add(s, k3, h));
    return s.map((x, i) => x + (h / 6) * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]));
  };
  C.dblPendEnergy = (s) => { const [t1, t2, w1, w2] = s, g = 9.8; return 0.5 * (2 * w1 * w1 + w2 * w2 + 2 * w1 * w2 * Math.cos(t1 - t2)) - g * (2 * Math.cos(t1) + Math.cos(t2)); };

  if (typeof module !== 'undefined' && module.exports) module.exports = C;
})();

/* Capítulo 1 — ¿Qué es la física? */
(function () {
  'use strict';
  const FK = window.FK, D = FK.d, C = FK.calc;

  /* ---------- Une la pregunta con su rama ---------- */
  FK.sim('une-ramas', function (g) {
    FK.kit.match(g, [
      ['🌈 ¿Por qué sale el arcoíris?', 'Óptica (la luz)'],
      ['⛵ ¿Cómo flota un barco enorme?', 'Fluidos (agua y aire)'],
      ['🍲 ¿Por qué se calienta la sopa?', 'Calor y termodinámica'],
      ['🎸 ¿Cómo suena una guitarra?', 'Ondas y sonido'],
      ['💡 ¿Por qué se prende un bombillo?', 'Electricidad y magnetismo'],
      ['🌟 ¿Cómo nacen las estrellas?', 'Astronomía'],
      ['🏀 ¿Cómo viaja un balón?', 'Mecánica (el movimiento)'],
      ['⚛️ ¿De qué están hechos los átomos?', 'Física del mundo pequeño']
    ], { start: 'Toca una pregunta de la izquierda y luego su rama a la derecha.' });
  });

  /* ---------- Predice y prueba ---------- */
  const OBJ = {
    bola: ['🎳', 'Bola de boliche', 80], mart: ['🔨', 'Martillo', 60], piedra: ['🪨', 'Piedra', 50],
    pluma: ['🪶', 'Pluma', 0.6], hoja: ['📄', 'Hoja de papel', 1.5], globo: ['🎈', 'Globo', 2]
  };
  const HEIGHT = 20; /* metros de caída */
  FK.sim('predice-cae', function (g) {
    const ctx = g.canvas(2);
    const opts = Object.keys(OBJ).map((k) => [k, OBJ[k][1], OBJ[k][0]]);
    g.choice('izq', { label: 'Objeto de la izquierda', icon: '⬅️', options: opts, value: 'bola', reset: true });
    g.choice('der', { label: 'Objeto de la derecha', icon: '➡️', options: opts, value: 'pluma', reset: true });
    g.choice('lugar', { label: 'Lugar', icon: '🌍', options: [['aire', 'Con aire', '🌬️'], ['vacio', 'Sin aire (vacío)', '🌌']], value: 'aire', reset: true });
    g.choice('pred', { label: 'Mi predicción', icon: '🤔', options: [['izq', 'Gana la izquierda', '⬅️'], ['der', 'Gana la derecha', '➡️'], ['igual', 'Llegan juntos', '🤝']], value: 'izq' });
    g.toggle('lenta', { label: 'Cámara lenta', value: false, onchange: (v) => { g.speed = v ? 0.35 : 1; } });
    g.button('¡Soltar!', () => { if (s.state === 'ready') { s.state = 'falling'; FK.sfx.whoosh(); g.say('¡Ahí van!', 'wow'); } }, { icon: '🚀' });
    g.out('tl', 'Tiempo izquierda', { icon: '⏱️' });
    g.out('tr', 'Tiempo derecha', { icon: '⏱️' });
    const s = { state: 'ready', a: null, b: null };
    const mk = (key) => ({ y: 0, v: 0, t: 0, done: false, vt: g.p.lugar === 'vacio' ? Infinity : OBJ[key][2] });
    const finish = () => {
      const dt = s.a.t - s.b.t;
      const res = Math.abs(dt) < 0.06 ? 'igual' : dt < 0 ? 'izq' : 'der';
      s.state = 'done';
      const name = { izq: OBJ[g.p.izq][1], der: OBJ[g.p.der][1] };
      const msg = res === 'igual' ? 'Llegaron juntos.' : `Ganó: ${name[res]}.`;
      if (res === g.p.pred) { g.win('¡Acertaste! ' + msg); } else { FK.sfx.no(); g.say('No era eso. ' + msg + ' ¡Prueba otra vez!', 'think'); }
    };
    g.run({
      init() { s.state = 'ready'; s.a = mk(g.p.izq); s.b = mk(g.p.der); g.show('tl', '—'); g.show('tr', '—'); g.say('Elige una predicción y presiona «¡Soltar!».'); },
      step(dt) {
        if (s.state !== 'falling') return;
        const sub = 8;
        for (let i = 0; i < sub; i++) for (const o of [s.a, s.b]) if (!o.done) {
          const y0 = o.y;
          C.stepFall(o, dt / sub, 9.8, o.vt); o.t += dt / sub;
          if (o.y >= HEIGHT) { o.t -= (dt / sub) * ((o.y - HEIGHT) / (o.y - y0)); o.y = HEIGHT; o.done = true; }
        }
        g.show('tl', FK.n(s.a.t, 2) + ' s'); g.show('tr', FK.n(s.b.t, 2) + ' s');
        if (s.a.done && s.b.done) finish();
      },
      draw(c, W, H) {
        const vac = g.p.lugar === 'vacio';
        if (vac) D.night(c, W, H, 3, 50); else { D.sky(c, W, H, '#8FD3FF', '#E8F8FF'); D.cloud(c, 60, 70, 1); D.cloud(c, 640, 110, 1.2); D.cloud(c, 380, 40, 0.8); }
        const gy = H - 50;
        D.ground(c, W, gy, H, vac ? '#9AA0C8' : '#7ED957', vac ? '#6C719E' : '#B9824A');
        D.text(c, vac ? '🌌 Sin aire' : '🌬️ Con aire', 12, 24, { size: 20, color: vac ? '#fff' : D.INK, weight: 700 });
        const y0 = 70, k = (gy - 40 - y0) / HEIGHT;
        [[s.a, g.p.izq, 230], [s.b, g.p.der, 570]].forEach(([o, key, x]) => {
          D.shadow(c, x, gy + 2, 34);
          D.emoji(c, OBJ[key][0], x + Math.sin(o.t * 6) * (o.vt < 5 && o.y > 0 && !o.done ? 10 : 0), y0 + o.y * k, 58, o.vt < 5 && !o.done ? Math.sin(o.t * 5) * 0.4 : 0);
          D.tag(c, OBJ[key][1], x, gy + 28, '#fff', { size: 15 });
          if (o.done) D.text(c, FK.n(o.t, 2) + ' s', x, gy - 60, { size: 24, align: 'center', color: vac ? '#fff' : D.INK, stroke: vac ? '#14123F' : '#fff', weight: 700 });
        });
        D.line(c, 400, y0 - 28, 400, gy, vac ? 'rgba(255,255,255,.3)' : 'rgba(43,35,80,.2)', 2, [6, 8]);
        D.line(c, 90, y0, 90, y0 + HEIGHT * k, '#FF4757', 3);
        D.text(c, '20 m', 98, y0 + (HEIGHT * k) / 2, { size: 15, color: vac ? '#fff' : D.INK });
      }
    });
  });
})();

    const next = () => {
      s.L = Math.round(M.rnd(4, 18) * 2) / 2; s.shown = false; s.item = M.pick(ITEMS);
      g.setSlider('guess', 8); g.show('ronda', `${s.r + 1} de 5`); g.show('aciertos', s.ok);
      g.say('La regla pequeña de arriba mide 5 cm. ¿Cuánto mide el objeto de abajo?');
    };
    function check() {
      if (s.over) { g.restart(); return; }
      if (s.shown) { s.r++; if (s.r >= 5) { end(); return; } next(); return; }
      s.shown = true;
      const err = Math.abs(g.p.guess - s.L) / s.L;
      const ok = err <= 0.15;
      if (ok) { s.ok++; FK.sfx.ok(); g.say(`¡Bien! Medía ${FK.n(s.L, 1)} cm. Casi exacto.`, 'happy'); }

    function end() {
      s.over = true;
      if (s.ok >= 3) g.win(`¡${s.ok} aciertos de 5! ¡Tienes ojo de científico!`); else g.say(`Acertaste ${s.ok} de 5. ¡Toca «Otra vez» para mejorar!`, 'think');

        const y = 190, w = s.L * pxcm;
        const [em, col] = s.item || ITEMS[0];
        D.box(c, x0, y - 16, w, 32, col, { r: 14 });
        D.emoji(c, em, x0 + w + 22, y, 36);
        D.text(c, '¿Cuánto mide?', x0, y - 40, { size: 20, weight: 700 });

          D.line(c, x0, y + 100, x0 + w, y + 100, '#12B76A', 8); D.tag(c, 'real: ' + FK.n(s.L, 1) + ' cm', x0 + w / 2, y + 126, '#D6F5E6', { size: 14 });

        }
        s.hits.forEach(() => 0);
      }
    });
  });

  /* ---------- Viaje por los tamaños ---------- */
  const SIZES = [
    ['⚛️', 'un protón', 1.7e-15, 'Es una de las piezas del núcleo de un átomo.'],
    ['🔬', 'un átomo', 1e-10, 'Todo lo que ves está hecho de átomos.'],
    ['🦠', 'un virus', 1e-7, 'Tan pequeño que no se ve ni con una lupa.'],
    ['🩸', 'un glóbulo rojo', 8e-6, 'Lleva el oxígeno por tu sangre.'],
    ['⏳', 'un grano de arena', 5e-4, 'Medio milímetro.'],
    ['🐜', 'una hormiga', 5e-3, 'Cinco milímetros de largo.'],
    ['🍎', 'una manzana', 0.08, 'Unos 8 centímetros.'],

    ['☀️', 'el Sol', 1.39e9, 'Caben más de un millón de Tierras dentro.'],
    ['🪐', 'el Sistema Solar', 9e12, 'Hasta la órbita de Neptuno.'],
    ['⭐', 'la estrella Próxima Centauri', 4e16, 'Está a 4,2 años luz. La luz tarda más de 4 años en llegar.'],
    ['🌌', 'la Vía Láctea', 9.5e20, 'Nuestra galaxia, con cientos de miles de millones de estrellas.'],
    ['🌠', 'el universo que podemos ver', 8.8e26, 'Lo más grande que conocemos.']

  FK.sim('escalas', function (g) {

        D.emoji(c, near ? o[0] : '❓', W / 2, 105, near ? 100 : 70);

        /* regla logarítmica */
        const x0 = 40, x1 = W - 40, y = 300, X = (e) => x0 + ((e + 15) / 42) * (x1 - x0);
        D.box(c, x0 - 10, y - 8, x1 - x0 + 20, 16, 'rgba(255,255,255,.18)', { r: 8, stroke: 'rgba(255,255,255,.5)', lw: 2 });
        SIZES.forEach((q, i) => { const e = Math.log10(q[2]); D.emoji(c, q[0], X(e), y + (i % 2 ? 34 : -34), seen.has(i) ? 30 : 22); D.circle(c, X(e), y, 5, seen.has(i) ? '#FFC21A' : '#fff'); });
        const mx = X(g.p.e);
        D.poly(c, [[mx, y - 14], [mx - 11, y - 34], [mx + 11, y - 34]], '#FF4757', '#fff', 2);
                D.text(c, 'más pequeño', x0 + 70, y + 92, { size: 14, color: '#B9B3E6' }); D.text(c, 'más grande', x1 - 70, y + 92, { size: 14, color: '#B9B3E6', align: 'right' });
      }
    });
  });

  /* ---------- Reflejos ---------- */
  FK.sim('reflejos', function (g) {
    const ctx = g.canvas(2.4);
    g.button('¡Empezar!', () => start(), { icon: '🚦' });
    g.out('ult', 'Último', { icon: '⏱️' }); g.out('mejor', 'Mejor', { icon: '🏆', hl: true });
    const s = { st: 'idle', wait: 0, t0: 0, tries: [], best: null, msg: '' };
    const start = () => { if (s.st === 'wait' || s.st === 'go') return; s.st = 'wait'; s.wait = M.rnd(1.2, 3.2); s.msg = ''; g.say('Espera… ¡no toques todavía!', 'think'); };

        if (s.best < 350) g.win(`¡${s.best} milisegundos! ¡Reflejos de campeón!`); else g.say(`${ms} ms. ¡Otra vez! Intenta bajar de 350.`, 'happy');

(function () {
  'use strict';
  const FK = window.FK, D = FK.d, M = FK.M;

  /* ---------- La gran carrera de animales ---------- */
  const RACERS = [['🐌', 'Caracol', 0.013], ['🐢', 'Tortuga', 0.3], ['🚶', 'Persona caminando', 1.4], ['🏃', 'Niño corriendo', 4], ['🐎', 'Caballo', 15], ['🐆', 'Guepardo', 29]];
  const fmtT = (s) => (s < 60 ? FK.n(s, s < 10 ? 1 : 0) + ' s' : s < 3600 ? FK.n(s / 60, 1) + ' min' : FK.n(s / 3600, 1) + ' h');
  FK.sim('carrera-animales', function (g) {
    const ctx = g.canvas(2.1);
    g.choice('dist', { label: 'Distancia de la carrera', icon: '📏', options: [[10, '10 m'], [100, '100 m'], [1000, '1 km']], value: 100, reset: true });
    g.button('¡A correr!', () => { if (s.state !== 'run') { s.state = 'run'; s.T = 0; FK.sfx.whoosh(); } }, { icon: '🏁' });
    g.out('v', 'Rapidez ganador', { icon: '💨' }); g.out('t', 'Tiempo ganador', { icon: '⏱️' });
    const s = { state: 'ready', T: 0, done: {}, ran: new Set() };
    const tWin = () => g.p.dist / RACERS[5][2];
    g.run({
      init() { s.state = 'ready'; s.T = 0; g.show('v', '—'); g.show('t', '—'); g.say(`¿Quién llegará primero a ${g.p.dist} m? Presiona «¡A correr!». El tiempo va comprimido para que veas toda la carrera.`); },
      step(dt) {
        if (s.state !== 'run') return;
        /* el más rápido tarda unos 5 s en pantalla */
        const k = tWin() / 5;
        s.T += dt * k;
        if (s.T >= tWin()) {
          s.state = 'done'; s.ran.add(g.p.dist);
          g.show('v', '29 m/s'); g.show('t', fmtT(tWin()));
          g.say(`¡Ganó el guepardo en ${fmtT(tWin())}! El caracol tardaría ${fmtT(g.p.dist / RACERS[0][2])}.`, 'wow');
          if (s.ran.size >= 3) g.win('¡Corriste las tres carreras! Ya sabes cuánto tarda cada animal.');
        }
      },
      draw(c, W, H) {
        D.sky(c, W, H, '#BFE9FF', '#EAF8FF');
        const top = 40, lane = (H - top - 20) / RACERS.length;
        D.text(c, '🏁', W - 28, top - 10, { size: 22 });
        RACERS.forEach((r, i) => {
          const y = top + i * lane;
          D.box(c, 10, y + 4, W - 20, lane - 8, i % 2 ? '#C9E8A8' : '#D6F0B8', { r: 12, lw: 2 });
          const d = Math.min(g.p.dist, r[2] * s.T);
          const x = 190 + (d / g.p.dist) * (W - 290);
          D.emoji(c, r[0], x, y + lane / 2, 34, 0, true);
          D.text(c, r[1], 22, y + lane / 2, { size: 15, color: D.INK, weight: 700 });
          const tt = d >= g.p.dist ? g.p.dist / r[2] : null;
          if (tt) D.tag(c, fmtT(tt), Math.min(W - 60, x + 70), y + lane / 2, '#B8F2D0', { size: 14 });
        });
        D.line(c, W - 100, top, W - 100, H - 16, '#FF4757', 3, [8, 6]);
        if (s.state !== 'ready') D.tag(c, '⏱ ' + fmtT(s.T), W / 2, 20, '#FFF1B8', { size: 16 });
      }
    });
  });

  /* ---------- Radar con cronómetro ---------- */
  FK.sim('radar', function (g) {
    const ctx = g.canvas(2.4);
    g.button('Iniciar', () => start(), { icon: '▶️' }); g.button('Parar', () => stop(), { icon: '⏹️', kind: 'ghost' });
    g.button('Otro carro', () => g.restart(), { icon: '🚗', kind: 'ghost' });
    g.out('t', 'Tu tiempo', { icon: '⏱️' }); g.out('v', 'Tu rapidez', { icon: '🧮', hl: true }); g.out('real', 'Rapidez real', { icon: '🚗' });
    const PX = 6, X1 = 250, X2 = 550; /* 6 px por metro, tramo de 50 m */
    const s = { x: -60, v: 15, run: false, t0: 0, tm: null, done: false };
    function start() { if (s.run || s.done) return; s.run = true; s.t0 = performance.now(); s.tm = null; g.show('t', '…'); }
    function stop() {
      if (!s.run) { g.say('Primero presiona «Iniciar» cuando el carro pase el poste verde.', 'think'); return; }
      s.run = false; s.tm = (performance.now() - s.t0) / 1000; s.done = true;
      const v = 50 / s.tm; g.show('t', FK.n(s.tm, 2) + ' s'); g.show('v', FK.n(v, 1) + ' m/s = ' + FK.n(v * 3.6, 0) + ' km/h');
    }
    g.run({
      init() { s.x = -40; s.v = M.rnd(8, 22); s.run = false; s.done = false; s.tm = null; g.show('t', '—'); g.show('v', '—'); g.show('real', '?'); g.say('Mira pasar el carro. Inicia el cronómetro en el poste verde y para en el rojo.'); },
      step(dt) {
        s.x += s.v * PX * dt;
        if (s.x > 900) {
          if (s.done) {
            const real = s.v, mine = 50 / s.tm, err = Math.abs(mine - real) / real;
            g.show('real', FK.n(real, 1) + ' m/s = ' + FK.n(real * 3.6, 0) + ' km/h');
            if (err <= 0.15) g.win(`¡Muy cerca! Tú: ${FK.n(mine * 3.6, 0)} km/h, real: ${FK.n(real * 3.6, 0)} km/h.`); else g.say(`Tu medida: ${FK.n(mine * 3.6, 0)} km/h. La real: ${FK.n(real * 3.6, 0)} km/h. ¡Prueba con otro carro!`, 'think');
          } else { g.say('El carro pasó sin que lo midieras. ¡Otro carro!', 'think'); }
          s.x = -60; s.v = M.rnd(8, 22); s.done = false; s.run = false; s.tm = null; g.show('t', '—'); g.show('v', '—'); g.show('real', '?');
        }
      },
      draw(c, W, H) {
        D.sky(c, W, H, '#8FD3FF', '#E8F8FF'); D.cloud(c, 80, 50, 1); D.cloud(c, 560, 70, 1.2);
        D.ground(c, W, 220, H, '#7ED957', '#B9824A');
        c.fillStyle = '#5B5B7A'; c.fillRect(0, 250, W, 70); D.line(c, 0, 285, W, 285, '#fff', 4, [24, 18]);
        D.line(c, X1, 190, X1, 320, '#12B76A', 8); D.tag(c, 'Poste 1', X1, 175, '#B8F2D0', { size: 14 });
        D.line(c, X2, 190, X2, 320, '#FF4757', 8); D.tag(c, 'Poste 2', X2, 175, '#FFC7CD', { size: 14 });
        D.arrow(c, X1 + 6, 205, X2 - 6, 205, '#2B2350', 4); D.tag(c, '50 metros', (X1 + X2) / 2, 225, '#fff', { size: 15 });
        D.emoji(c, '🚗', s.x, 275, 56, 0, true);
        if (s.run) D.text(c, '⏱ ' + FK.n((performance.now() - s.t0) / 1000, 1) + ' s', W / 2, 60, { size: 28, align: 'center', weight: 700 });
      }
    });
    g.pointer({ down: () => { if (!s.run && !s.done) start(); else if (s.run) stop(); } });
  });
})();

/* Capítulo 5 — Caer y acelerar */
(function () {
  'use strict';
  const FK = window.FK, D = FK.d, M = FK.M, C = FK.calc;

  /* ---------- Caída en otros mundos ---------- */
  const WORLDS = { tierra: ['🌍 Tierra', 9.8, 1], luna: ['🌙 Luna', 1.62, Infinity], marte: ['🔴 Marte', 3.71, 8], jupiter: ['🟠 Júpiter', 24.79, Infinity] };
  FK.sim('galeria-caida', function (g) {
    const ctx = g.canvas(2.1);
    g.choice('mundo', { label: 'Mundo', icon: '🪐', options: Object.keys(WORLDS).map((k) => [k, WORLDS[k][0].slice(3)]), value: 'tierra', reset: true });
    g.choice('obj', { label: 'Objeto', icon: '🎒', options: [['pelota', 'Pelota', '🏀'], ['pluma', 'Pluma', '🪶']], value: 'pelota', reset: true });
    g.button('¡Soltar!', () => { if (s.st === 'ready') { s.st = 'fall'; FK.sfx.whoosh(); } }, { icon: '⬇️' });
    g.out('g', 'Gravedad', { icon: '🪐' }); g.out('t', 'Tiempo', { icon: '⏱️' }); g.out('v', 'Rapidez', { icon: '💨', hl: true });
    const H_M = 10;
    const s = { st: 'ready', y: 0, v: 0, t: 0, dots: [], next: 0.25, worlds: new Set() };
    g.run({
      init() { s.st = 'ready'; s.y = 0; s.v = 0; s.t = 0; s.dots = []; s.next = 0.25; const w = WORLDS[g.p.mundo]; g.show('g', FK.n(w[1], 2) + ' m/s²'); g.show('t', '0,00 s'); g.show('v', '0,0 m/s'); g.say(`Estás en ${w[0]}. La pelota cae desde ${H_M} metros. ¡Suéltala!`); },
      step(dt) {
        if (s.st !== 'fall') return;
        const w = WORLDS[g.p.mundo], vt = (g.p.obj === 'pluma' ? 0.6 : 20) * w[2];
        const n = 6;
        for (let i = 0; i < n && s.st === 'fall'; i++) {
          const y0 = s.y; C.stepFall(s, dt / n, w[1], vt); s.t += dt / n;
          if (s.y >= H_M) { s.t -= (dt / n) * ((s.y - H_M) / (s.y - y0)); s.y = H_M; s.st = 'done'; }
        }
        while (s.t >= s.next) { s.dots.push(s.y); s.next += 0.25; }
        g.show('t', FK.n(s.t, 2) + ' s'); g.show('v', FK.n(s.v, 1) + ' m/s = ' + FK.n(s.v * 3.6, 0) + ' km/h');
        if (s.st === 'done') {
          s.worlds.add(g.p.mundo + g.p.obj);
          g.say(`¡Llegó al suelo en ${FK.n(s.t, 2)} s con ${FK.n(s.v * 3.6, 0)} km/h!`, 'wow');
          if (new Set([...s.worlds].map((x) => x.replace(/pelota|pluma/, ''))).size >= 3) g.win('¡Ya probaste 3 mundos! La gravedad cambia en cada uno.');
        }
      },
      draw(c, W, H) {
        const k = g.p.mundo;
        if (k === 'luna') D.night(c, W, H, 5, 80); else if (k === 'marte') D.sky(c, W, H, '#FFB38A', '#FFE1C9'); else if (k === 'jupiter') D.sky(c, W, H, '#FFD9A8', '#F2B97A'); else { D.sky(c, W, H, '#8FD3FF', '#E8F8FF'); D.cloud(c, 560, 60, 1); }
        const gy = H - 44;
        D.ground(c, W, gy, H, k === 'luna' ? '#B8B8C8' : k === 'marte' ? '#D9694A' : k === 'jupiter' ? '#E8A04A' : '#7ED957', k === 'luna' ? '#8A8AA0' : k === 'marte' ? '#A8452C' : k === 'jupiter' ? '#C07A30' : '#B9824A');
        const x = 300, top = 40, pxm = (gy - 40 - top) / H_M;
        D.line(c, x - 90, top, x - 90, top + H_M * pxm, '#FF4757', 3);
        for (let m = 0; m <= H_M; m += 2) { D.line(c, x - 98, top + m * pxm, x - 82, top + m * pxm, '#FF4757', 3); D.text(c, `${H_M - m} m`, x - 106, top + m * pxm, { size: 13, align: 'right', color: k === 'luna' ? '#fff' : D.INK }); }
        s.dots.forEach((dy) => D.circle(c, x, top + dy * pxm, 5, '#8E5CF6', '#fff', 2));
        D.emoji(c, g.p.obj === 'pelota' ? '🏀' : '🪶', x, top + s.y * pxm, 46, s.st === 'fall' ? s.t * 2 : 0);
        D.shadow(c, x, gy + 3, 26);
        D.char(c, 'newti', 560, gy - 44, 90, s.st === 'done' ? 'wow' : 'happy');
        D.tag(c, 'cada punto = ¼ de segundo', 560, 40, '#fff', { size: 14 });
      }
    });
  });

  /* ---------- El cañón de Newti ---------- */
  FK.sim('canon-blanco', function (g) {
    const ctx = g.canvas(2);
    g.slider('ang', { label: 'Ángulo', icon: '📐', min: 5, max: 85, step: 1, value: 45, unit: '°', fmt: (v) => FK.n(v, 0) });
    g.slider('v', { label: 'Rapidez de salida', icon: '💨', min: 5, max: 45, step: 1, value: 25, unit: 'm/s', fmt: (v) => FK.n(v, 0) });
    g.button('¡Fuego!', () => fire(), { icon: '💥' });
    g.out('hits', 'Aciertos', { icon: '🎯', hl: true }); g.out('alc', 'Alcance', { icon: '📏' });
    const PX = 4, GX = 70, S = { ball: null, target: 100, hits: 0, trail: [], last: [], msg: '' };
    const gy = (H) => H - 56;
    function fire() { if (S.ball) return; const a = M.rad(g.p.ang); S.ball = { t: 0, x: 0, y: 0, vx: g.p.v * Math.cos(a), vy: g.p.v * Math.sin(a) }; S.trail = []; FK.sfx.boom(); }
    g.run({
      init() { S.ball = null; S.hits = S.hits || 0; S.target = Math.round(M.rnd(35, 140)); S.trail = []; g.show('hits', S.hits + ' de 3'); g.show('alc', '—'); g.say('Ajusta el ángulo y la rapidez. ¡Que la bola caiga en la bandera!'); },
      step(dt) {
        const b = S.ball; if (!b) return;
        b.t += dt; b.x = b.vx * b.t; b.y = b.vy * b.t - 4.9 * b.t * b.t;
        S.trail.push([b.x, b.y]);
        if (b.y < 0 && b.t > 0.05) {
          const R = C.range(g.p.v, M.rad(g.p.ang), 9.8);
          S.last = S.trail.slice(); S.ball = null; g.show('alc', FK.n(R, 1) + ' m');
          if (Math.abs(R - S.target) <= 3.5) { S.hits++; g.show('hits', S.hits + ' de 3'); FK.sfx.ok(); S.target = Math.round(M.rnd(35, 140)); if (S.hits >= 3) { g.win('¡3 blancos! ¡Puntería de campeón!'); S.hits = 0; } else g.say('¡Dio en el blanco! Aparece otra bandera.', 'wow'); }
          else { FK.sfx.no(); g.say(R < S.target ? `Quedó corto: llegó a ${FK.n(R, 0)} m y la bandera está a ${S.target} m. ¡Sube la rapidez!` : `Se pasó: llegó a ${FK.n(R, 0)} m y la bandera está a ${S.target} m. ¡Baja la rapidez!`, 'think'); }
        }
      },
      draw(c, W, H) {
        D.sky(c, W, H, '#8FD3FF', '#E8F8FF'); D.cloud(c, 420, 50, 1); D.cloud(c, 650, 100, 0.8);
        const Y = gy(H); D.ground(c, W, Y, H, '#7ED957', '#B9824A');
        for (let m = 0; m <= 150; m += 25) { D.line(c, GX + m * PX, Y, GX + m * PX, Y + 10, D.INK, 2); D.text(c, m + ' m', GX + m * PX, Y + 28, { size: 12, align: 'center' }); }
        /* trayectoria anterior */
        if (S.last.length) { c.fillStyle = 'rgba(142,92,246,.45)'; S.last.forEach((p, i) => { if (i % 6 === 0) { c.beginPath(); c.arc(GX + p[0] * PX, Y - p[1] * PX, 3, 0, M.TAU); c.fill(); } }); }
        /* bandera */
        const tx = GX + S.target * PX;
        D.line(c, tx, Y, tx, Y - 54, D.INK, 4); D.poly(c, [[tx, Y - 54], [tx + 30, Y - 44], [tx, Y - 34]], '#FF4757', D.INK, 2.5);
        D.box(c, tx - 3.5 * PX, Y - 6, 7 * PX, 6, 'rgba(255,194,26,.9)', { r: 3, lw: 1.5 });
        /* cañón */
        const a = -M.rad(g.p.ang);
        c.save(); c.translate(GX, Y - 8); c.rotate(a); D.box(c, -8, -12, 66, 24, '#4A4FE0', { r: 10 }); c.restore();
        D.circle(c, GX, Y - 8, 22, '#2B2350'); D.circle(c, GX, Y - 8, 9, '#8A8AA0');
        D.emoji(c, '🐱', GX - 40, Y - 22, 36);
        if (S.ball) D.circle(c, GX + S.ball.x * PX, Y - 8 - S.ball.y * PX, 10, '#FF8A1F', D.INK, 3);
        D.tag(c, `${FK.n(g.p.ang, 0)}° · ${FK.n(g.p.v, 0)} m/s`, 130, 30, '#fff', { size: 15 });
      }
    });
  });
})();

/* Capítulo 6 — Las leyes de Newton */
(function () {
  'use strict';
  const FK = window.FK, D = FK.d, M = FK.M, C = FK.calc;

  /* ---------- Tira y afloja ---------- */
  FK.sim('tira-afloja', function (g) {
    const ctx = g.canvas(2.6);
    g.slider('izq', { label: 'Niños a la izquierda', icon: '⬅️', min: 0, max: 10, step: 1, value: 3, fmt: (v) => v + ' 🧒' });
    g.slider('der', { label: 'Niños a la derecha', icon: '➡️', min: 0, max: 10, step: 1, value: 3, fmt: (v) => v + ' 🧒' });
    g.toggle('ele', { label: '🐘 Añadir un elefante a la derecha (600 N)', value: false, onchange: () => { s.hold = 0; } });
    g.out('fi', 'Fuerza izquierda', { icon: '⬅️' }); g.out('fd', 'Fuerza derecha', { icon: '➡️' }); g.out('fn', 'Fuerza neta', { icon: '⚖️', hl: true });
    const KID = 100; /* newtons por niño */
    const s = { pos: 0, hold: 0, won: false, end: 0 };
    g.run({
      init() { s.pos = 0; s.hold = 0; s.end = 0; g.say('Cada niño tira con 100 N. El elefante, con 600 N. ¡Haz que la cuerda no se mueva!'); },
      step(dt) {
        const fl = g.p.izq * KID, fr = g.p.der * KID + (g.p.ele ? 600 : 0), net = fr - fl;
        if (s.end > 0) { s.end -= dt; if (s.end <= 0) { s.pos = 0; } return; }
        s.pos += (net / 1200) * dt * 0.55;
        if (Math.abs(net) < 1 && fl >= 300) {
          s.hold += dt;
          if (s.hold > 2 && g.p.ele && !s.won) { s.won = true; g.win('¡Equilibrio! 6 niños tienen la misma fuerza que un elefante.'); }
          else if (s.hold > 2 && !g.p.ele && !s.said) { s.said = true; g.say('¡Equilibrio! Las fuerzas son iguales y la cuerda no se mueve. Ahora prueba con el elefante.', 'happy'); }
        } else { s.hold = 0; s.said = false; }
        if (Math.abs(s.pos) >= 1) { s.pos = Math.sign(s.pos); s.end = 1.5; g.say(s.pos > 0 ? '¡Ganó el lado derecho! Prueba otra combinación.' : '¡Ganó el lado izquierdo! Prueba otra combinación.', 'wow'); }
        g.show('fi', fl + ' N'); g.show('fd', fr + ' N'); g.show('fn', (net === 0 ? '0 N ⚖️' : Math.abs(net) + ' N ' + (net > 0 ? '➡️' : '⬅️')));
      },
      draw(c, W, H) {
        D.sky(c, W, H, '#BFE9FF', '#EAF8FF'); D.ground(c, W, H - 70, H, '#7ED957', '#B9824A');
        const gy = H - 70, cx = W / 2 + s.pos * 190;
        D.line(c, 40, gy - 55, W - 40, gy - 55, '#A9743B', 8);
        D.line(c, W / 2, gy + 6, W / 2, gy - 120, '#FF4757', 3, [6, 6]);
        D.poly(c, [[cx, gy - 78], [cx + 14, gy - 68], [cx, gy - 58], [cx - 14, gy - 68]], '#FFC21A', D.INK, 2.5);
        for (let i = 0; i < g.p.izq; i++) D.emoji(c, '🧒', cx - 70 - i * 38, gy - 28, 44, 0, true);
        for (let i = 0; i < g.p.der; i++) D.emoji(c, '🧒', cx + 70 + i * 38, gy - 28, 44);
        if (g.p.ele) D.emoji(c, '🐘', Math.min(W - 60, cx + 70 + g.p.der * 38 + 30), gy - 34, 70);
        const fl = g.p.izq * KID, fr = g.p.der * KID + (g.p.ele ? 600 : 0);
        D.arrow(c, W / 2 - 10, 50, W / 2 - 10 - fl / 10, 50, '#1E88FF', 12); D.arrow(c, W / 2 + 10, 50, W / 2 + 10 + fr / 10, 50, '#FF4757', 12);
        D.text(c, '⬅️ ' + fl + ' N', 24, 26, { size: 18, weight: 700 }); D.text(c, fr + ' N ➡️', W - 24, 26, { size: 18, weight: 700, align: 'right' });
      }
    });
  });

  /* ---------- El carrito de Newti: F = m a ---------- */
  FK.sim('carrito-fma', function (g) {
    const ctx = g.canvas(3);
    g.slider('F', { label: 'Fuerza del empujón', icon: '💪', min: 1, max: 20, step: 1, value: 5, unit: 'N', fmt: (v) => FK.n(v, 0) });
    g.slider('m', { label: 'Masa del carrito', icon: '⚖️', min: 1, max: 10, step: 0.5, value: 2, unit: 'kg', fmt: (v) => FK.n(v, 1) });
    g.button('¡Empujar!', () => { if (!s.run) { s.x = 0; s.v = 0; s.t = 0; s.run = true; s.result = null; FK.sfx.whoosh(); } }, { icon: '🚀' });
    g.out('a', 'Aceleración (F ÷ m)', { icon: '🧮', hl: true }); g.out('t', 'Tiempo', { icon: '⏱️' });
    const s = { x: 0, v: 0, t: 0, run: false, d: 20, T: 4, result: null };
    const newGoal = () => { s.d = M.pick([10, 16, 20]); s.T = M.pick([3, 4, 5, 6]); g.goal(`Llega a la bandera (${s.d} m) en ${s.T} segundos (con 0,3 s de margen).`); };
    g.run({
      init() { s.x = 0; s.v = 0; s.t = 0; s.run = false; s.result = null; newGoal(); g.show('t', '—'); g.say('Piensa: la aceleración que necesitas es 2 × distancia ÷ tiempo². ¡Escoge fuerza y masa!'); },
      step(dt) {
        g.show('a', FK.n(g.p.F / g.p.m, 2) + ' m/s²');
        if (!s.run) return;
        const a = g.p.F / g.p.m;
        s.v += a * dt; s.x += s.v * dt; s.t += dt; g.show('t', FK.n(s.t, 2) + ' s');
        if (s.x >= s.d || s.t > 15) {
          s.run = false;
          if (s.x >= s.d) {
            s.result = s.t;
            if (Math.abs(s.t - s.T) <= 0.3) g.win(`¡Llegó en ${FK.n(s.t, 2)} s! ¡Justo a tiempo!`);
            else g.say(`Llegó en ${FK.n(s.t, 2)} s. ${s.t > s.T ? 'Tardó mucho: aumenta la fuerza o baja la masa.' : 'Fue muy rápido: baja la fuerza o sube la masa.'}`, 'think');
          } else g.say('Se quedó muy lejos. ¡Necesitas más aceleración!', 'sad');
        }
      },
      draw(c, W, H) {
        D.sky(c, W, H, '#BFE9FF', '#EAF8FF'); D.ground(c, W, H - 70, H, '#7ED957', '#B9824A');
        const gy = H - 70, x0 = 60, k = (W - 150) / s.d;
        for (let m = 0; m <= s.d; m += s.d > 12 ? 5 : 2) { D.line(c, x0 + m * k, gy, x0 + m * k, gy + 8, D.INK, 2); D.text(c, m + ' m', x0 + m * k, gy + 24, { size: 12, align: 'center' }); }
        const fx = x0 + s.d * k; D.line(c, fx, gy, fx, gy - 70, D.INK, 4); D.poly(c, [[fx, gy - 70], [fx + 32, gy - 58], [fx, gy - 46]], '#FF4757', D.INK, 2.5);
        const w = 40 + g.p.m * 5, h = 26 + g.p.m * 2, x = x0 + s.x * k;
        D.box(c, x - w / 2, gy - h - 12, w, h, '#FF8A1F', { r: 8 }); D.circle(c, x - w / 3, gy - 8, 10, '#2B2350'); D.circle(c, x + w / 3, gy - 8, 10, '#2B2350');
        D.text(c, FK.n(g.p.m, 1) + ' kg', x, gy - h / 2 - 12, { size: 14, align: 'center', color: '#fff' });
        D.arrow(c, x - w / 2 - 62 - g.p.F * 2, gy - h / 2 - 12, x - w / 2 - 4, gy - h / 2 - 12, '#1E88FF', 8);
        D.emoji(c, '🐱', x - w / 2 - 74 - g.p.F * 2, gy - h / 2 - 12, 36, 0, true);
        D.tag(c, FK.n(g.p.F, 0) + ' N', x - w / 2 - 36 - g.p.F, gy - h / 2 - 42, '#fff', { size: 14 });
      }
    });

(function () {
  'use strict';
  const FK = window.FK, D = FK.d, M = FK.M, C = FK.calc;

  /* ---------- La rampa de los materiales ---------- */
  const MAT = { hielo: ['Hielo', 0.05, '#BFE9FF', '🧊'], madera: ['Madera', 0.4, '#D9A066', '🪵'], goma: ['Goma', 0.9, '#6C6C8A', '🛞'], lija: ['Lija', 1.3, '#C9B27C', '📄'] };
  FK.sim('rampa-materiales', function (g) {
    const ctx = g.canvas(2.2);
    g.choice('mat', { label: 'Superficie de la rampa', icon: '🧱', options: Object.keys(MAT).map((k) => [k, MAT[k][0], MAT[k][3]]), value: 'madera', onchange: () => reset() });
    g.slider('ang', { label: 'Inclinación', icon: '📐', min: 0, max: 70, step: 1, value: 5, unit: '°', fmt: (v) => FK.n(v, 0) });
    g.out('ang', 'Ángulo', { icon: '📐' }); g.out('mu', 'Fricción (μ)', { icon: '🧲' }); g.out('crit', 'Ángulo crítico', { icon: '🎯', hl: true });
    const L = 5; /* longitud de la rampa en m */
    const s = { s: 0, v: 0, sliding: false, end: 0, started: false };
    const reset = () => { s.s = 0; s.v = 0; s.sliding = false; s.end = 0; s.started = false; };
    g.run({
      init() { reset(); g.say('Sube la rampa de a poquito. ¿A qué ángulo empieza a deslizarse el bloque?'); },
      step(dt) {
        const mu = MAT[g.p.mat][1], th = M.rad(g.p.ang);
        g.show('ang', FK.n(g.p.ang, 0) + '°'); g.show('mu', FK.n(mu, 2)); g.show('crit', s.started ? FK.n(M.deg(C.critAngle(mu)), 0) + '°' : '?');
        if (s.end > 0) { s.end -= dt; if (s.end <= 0) reset(); return; }
        if (!s.sliding) {
          if (Math.tan(th) > mu) {
            s.sliding = true; s.started = true;
            const crit = M.deg(C.critAngle(mu));
            if (g.p.ang - crit <= 3.5) g.win(`¡Empezó a deslizar a ${FK.n(g.p.ang, 0)}°! El ángulo crítico de ${MAT[g.p.mat][0].toLowerCase()} es ${FK.n(crit, 0)}°.`);
            else g.say(`Empezó a deslizar a ${FK.n(g.p.ang, 0)}°: te pasaste. El ángulo justo es ${FK.n(crit, 0)}°. ¡Baja y sube despacio!`, 'think');
          }
        } else {
          const a = g.p.ang > 0 ? 9.8 * (Math.sin(th) - mu * Math.cos(th)) : -1;
          s.v += a * dt;
          if (s.v < 0) { s.v = 0; s.sliding = false; }
          s.s += s.v * dt;
          if (s.s >= L) { s.end = 1.2; }
        }
      },
      draw(c, W, H) {
        D.sky(c, W, H, '#FFF1D9', '#FFFBF2'); D.grid(c, W, H, 40);
        const th = M.rad(g.p.ang), len = 520, bx = 150, by = H - 50;
        const ex = bx + len * Math.cos(th), ey = by - len * Math.sin(th);
        D.poly(c, [[bx, by], [ex, by], [ex, ey]], MAT[g.p.mat][2], D.INK, 3);
        D.line(c, bx - 40, by, ex + 60, by, D.INK, 4);
        c.beginPath(); c.arc(bx + 70, by, 70, -th, 0); c.strokeStyle = '#FF4757'; c.lineWidth = 3; c.stroke();
        D.text(c, FK.n(g.p.ang, 0) + '°', bx + 105, by - 18, { size: 20, weight: 700, color: '#FF4757' });
        /* bloque */
        const t = L > 0 ? s.s / L : 0, px = ex - (ex - bx) * (1 - 0) * (0), pos = [ex - (ex - bx) * t - 0, ey + (by - ey) * t];
        c.save(); c.translate(ex - (ex - bx) * t, ey + (by - ey) * t); c.rotate(-th);
        D.box(c, -50, -46, 50, 46, '#FF8A1F', { r: 8 }); D.emoji(c, '🐱', -25, -23, 28);
        /* flechas: peso e inclinada */
        c.restore();
        const cx = ex - (ex - bx) * t - 25 * Math.cos(th) - 23 * Math.sin(th), cy = ey + (by - ey) * t + 25 * Math.sin(th) - 23 * Math.cos(th);
        D.arrow(c, cx, cy, cx, cy + 90, '#8E5CF6', 7); D.text(c, 'peso', cx + 10, cy + 100, { size: 14, color: '#8E5CF6', weight: 700 });
        const mu = MAT[g.p.mat][1], fr = Math.min(Math.sin(th), mu * Math.cos(th)) * 90;
        if (!s.sliding && g.p.ang > 0) { if (fr > 6) { D.arrow(c, cx, cy, cx + Math.cos(th) * fr, cy - Math.sin(th) * fr, '#1E88FF', 7); D.text(c, 'fricción', cx + Math.cos(th) * fr + 6, cy - Math.sin(th) * fr - 14, { size: 14, color: '#1E88FF', weight: 700 }); } }
        D.tag(c, MAT[g.p.mat][3] + ' ' + MAT[g.p.mat][0], 90, 30, '#fff', { size: 16 });
      }
    });
  });

  /* ---------- ¡Frena antes del cono! ---------- */
  const SURF = { seco: ['Seco', 0.7, '☀️'], mojado: ['Mojado', 0.4, '🌧️'], hielo: ['Hielo', 0.1, '🧊'] };
  FK.sim('frenado', function (g) {
    const ctx = g.canvas(2.6);
    g.slider('kmh', { label: 'Rapidez del carro', icon: '🚗', min: 20, max: 120, step: 5, value: 50, unit: 'km/h', fmt: (v) => FK.n(v, 0) });
    g.choice('sup', { label: 'Estado del piso', icon: '🛣️', options: Object.keys(SURF).map((k) => [k, SURF[k][0], SURF[k][2]]) , value: 'seco' });
    g.button('¡Ver el cono y frenar!', () => go(), { icon: '🛑' });
    g.out('rea', 'Distancia de reacción', { icon: '🧠' }); g.out('fre', 'Distancia de frenado', { icon: '🛞' }); g.out('tot', 'Total', { icon: '📏', hl: true });
    const PX = 9; /* px por metro */
    const s = { x: 0, v: 0, st: 'idle', D: 50, tr: 0, crash: false };
    function go() { if (s.st !== 'idle') return; s.st = 'react'; s.v = g.p.kmh / 3.6; s.tr = 1; s.x = 0; s.crash = false; FK.sfx.whoosh(); }
    g.run({
      init() { s.st = 'idle'; s.x = 0; s.v = 0; s.D = Math.round(M.rnd(28, 62)); s.crash = false; s.said = false; g.say(`El cono está a ${s.D} metros. Elige rapidez y piso. ¡Cuidado con el tiempo de reacción de 1 segundo!`); },
      step(dt) {
        const v0 = g.p.kmh / 3.6, mu = SURF[g.p.sup][1];
        const rea = v0 * 1, fre = C.brakeDist(v0, mu);
        g.show('rea', FK.n(rea, 0) + ' m'); g.show('fre', FK.n(fre, 0) + ' m'); g.show('tot', FK.n(rea + fre, 0) + ' m');
        if (s.st === 'idle') return;
        if (s.st === 'react') { s.x += s.v * dt; s.tr -= dt; if (s.tr <= 0) s.st = 'brake'; }
        else if (s.st === 'brake') { s.v = Math.max(0, s.v - mu * 9.8 * dt); s.x += s.v * dt; if (s.v === 0) s.st = 'stop'; }
        if (s.x >= s.D && s.st !== 'stop' && !s.crash) { s.crash = true; s.st = 'stop'; FK.sfx.boom(); g.say('¡PUM! Chocaste con el cono. Necesitabas más espacio: baja la rapidez o ¡no frenes en piso resbaloso!', 'sad'); }
        if (s.st === 'stop' && !s.crash && !s.said) { s.said = true; const gap = s.D - s.x; if (g.p.kmh >= 40) g.win(`¡Frenaste a ${FK.n(s.D - s.x, 1)} m del cono! Y yendo a ${g.p.kmh} km/h.`); else g.say(`Frenaste a tiempo, pero iba lento (${g.p.kmh} km/h). Sube la rapidez a 40 o más.`, 'think'); }
      },
      draw(c, W, H) {
        D.sky(c, W, H, g.p.sup === 'mojado' ? '#9FB4C8' : '#8FD3FF', g.p.sup === 'mojado' ? '#CDD8E4' : '#E8F8FF');
        if (g.p.sup === 'mojado') for (let i = 0; i < 40; i++) D.line(c, (i * 97) % W, (i * 53 + g.t * 400) % 150, ((i * 97) % W) - 6, ((i * 53 + g.t * 400) % 150) + 16, '#4A8AC8', 2);
        D.ground(c, W, 170, H, '#7ED957', '#B9824A');
        c.fillStyle = g.p.sup === 'hielo' ? '#CFEFFF' : g.p.sup === 'mojado' ? '#5A6A82' : '#5B5B7A'; c.fillRect(0, 195, W, 120);
        D.line(c, 0, 255, W, 255, '#fff', 4, [26, 20]);
        const x0 = 80;
        D.text(c, '🚧', x0 + s.D * PX, 245, { size: 12 }); D.emoji(c, '🚧', x0 + s.D * PX, 250, 46);
        D.tag(c, s.D + ' m', x0 + s.D * PX, 205, '#FFF1B8', { size: 14 });
        for (let m = 0; m <= 70; m += 10) D.line(c, x0 + m * PX, 315, x0 + m * PX, 325, D.INK, 2);
        D.emoji(c, s.crash ? '💥' : '🚗', x0 + s.x * PX, 262, 52, 0, true);
        if (s.st === 'brake') D.text(c, '🛑 frenando', x0 + s.x * PX, 215, { size: 16, align: 'center', color: '#C0182B', weight: 700 });
        if (s.st === 'react') D.text(c, '🧠 reaccionando…', x0 + s.x * PX, 215, { size: 16, align: 'center', color: '#B07F00', weight: 700 });
      }
    });
  });
})();

(function () {

  FK.sim('formas-energia', function (g) {
