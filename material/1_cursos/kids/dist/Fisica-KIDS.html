<p class="lead">La luz que ves es solo una <em>rendija diminuta</em> de una familia gigante de ondas. Hay ondas de la misma familia que no puedes ver: las que llevan la radio y la televisión, las que calientan tu comida, las que usan los médicos para ver tus huesos… ¡todas son ondas electromagnéticas!</p>

<div class="learn"><ul>
<li>La luz es una onda electromagnética, igual que las ondas de radio y los rayos X.</li>
<li>Todas viajan a la velocidad de la luz, pero con distinta longitud de onda.</li>
<li>De la más larga a la más corta: radio, microondas, infrarrojo, visible, ultravioleta, rayos X y rayos gamma.</li>
<li>Las de longitud más corta tienen más energía y pueden ser peligrosas.</li>
</ul></div>

<div class="say" data-who="lumi" data-mood="wow"><p>¡Yo solo produzco un pedacito de la familia, la luz visible! Pero mis primos invisibles hacen cosas increíbles: me los presenta Chispa, que sabe mucho de ondas.</p></div>

<section>
<h2>Un arcoíris más grande</h2>
<p>Ya sabes que la luz blanca se separa en un arcoíris. Pero en 1800, William Herschel puso un termómetro más allá de la luz roja… ¡y se calentó! Había una luz invisible que daba calor: el <strong>infrarrojo</strong>. Un año después, Johann Ritter encontró, más allá del violeta, otra luz invisible que oscurecía el papel con sal de plata: el <strong>ultravioleta</strong>. Más tarde se descubrieron las ondas de radio (Hertz, 1887) y los rayos X (Röntgen, 1895).</p>
<table><tr><th>Onda</th><th>Longitud de onda</th><th>Para qué sirve</th></tr>
<tr><td>📻 Ondas de radio</td><td>De 1 metro a kilómetros</td><td>Radio, televisión, celulares</td></tr>
<tr><td>🍿 Microondas</td><td>De 1 mm a 1 m</td><td>Hornos, Wi-Fi, radares, GPS</td></tr>
<tr><td>🔥 Infrarrojo</td><td>De 0,0007 mm a 1 mm</td><td>Calor, controles remotos, visión nocturna</td></tr>
<tr><td>🌈 Luz visible</td><td>De 0,0004 a 0,0007 mm</td><td>Lo que vemos</td></tr>
<tr><td>☀️ Ultravioleta</td><td>De 10 a 400 nm</td><td>Bronceado, desinfectar, bacterias</td></tr>
<tr><td>🩻 Rayos X</td><td>De 0,01 a 10 nm</td><td>Radiografías, seguridad en aeropuertos</td></tr>
<tr><td>☢️ Rayos gamma</td><td>Menos de 0,01 nm</td><td>Esterilizar, tratar el cáncer, estrellas</td></tr></table>
<div class="magic" data-name="La fórmula de la luz"><big>velocidad de la luz = frecuencia × longitud de onda</big>Todas viajan a 300 000 km/s. Mientras más corta la onda, ¡mayor su frecuencia!</div>
<div class="sim" data-sim="escalera-ondas" data-title="La escalera de las ondas" data-goal="Recorre el espectro con la barra y visita al menos seis tipos de ondas.">
<ul><li>A la izquierda, ondas gigantes (¡del tamaño de edificios!). A la derecha, ondas del tamaño de átomos.</li><li>Fíjate en cómo aumenta la frecuencia al disminuir la longitud de onda.</li></ul>
</div>
<details class="curious"><p>Un fotón (partícula de luz) tiene energía E = h·f: mientras mayor es la frecuencia, más energía. Los fotones de ultravioleta, rayos X y gamma tienen suficiente energía para arrancar electrones de los átomos y dañar el ADN: se les llama radiación ionizante. Los de radio, microondas, infrarrojo y luz visible no tienen esa energía individual, por eso no pueden ionizar (aunque con mucha intensidad pueden calentar).</p></details>
</section>

<section>
<h2>¿Quién usa qué?</h2>
<div class="sim" data-sim="que-onda" data-title="¿Qué onda usa cada cosa?" data-goal="Une cada aparato o fenómeno con la onda electromagnética que usa."></div>
<div class="fact"><p>La luz del Sol incluye casi la mitad de infrarrojo (calor), casi la mitad de luz visible y un poquito de ultravioleta. Ese poquito es suficiente para quemarte la piel. Por eso es importante el protector solar, el sombrero y las gafas con filtro UV. La capa de ozono de la atmósfera nos protege del ultravioleta más peligroso.</p></div>
</section>

<section>
<h2>Ver lo invisible</h2>
<p>Las <strong>cámaras infrarrojas</strong> (térmicas) no ven luz, sino el calor que irradian las cosas: todo lo que tiene temperatura emite infrarrojo, y mientras más caliente, más. Sirven para ver a una persona en la oscuridad, encontrar fugas de calor en un edificio o buscar personas perdidas. Algunas serpientes (como las víboras) tienen un órgano que ve infrarrojo para cazar de noche. Las abejas, en cambio, ven <strong>ultravioleta</strong>: las flores tienen dibujos que nosotros no vemos y que a ellas les muestran dónde está el néctar.</p>
<div class="sim" data-sim="camara-ir" data-title="La cámara que ve lo invisible" data-goal="Mira la escena con luz visible, con infrarrojo y con ultravioleta. En infrarrojo, toca varias cosas para saber su temperatura.">
<ul><li>En infrarrojo, el rojo es muy caliente y el azul es frío.</li><li>En ultravioleta, mira la flor: ¡las abejas la ven con un dibujo!</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Ver el infrarrojo del control remoto" data-time="5 min" data-level="1">
<ul class="mat"><li>📺 Un control remoto de TV</li><li>📱 La cámara de un celular (de la cámara frontal o trasera)</li><li>🌑 Un lugar un poco oscuro</li></ul>
<ol class="steps"><li>Abre la cámara de tu celular y apunta a la lucecita del control remoto (el LED de adelante).</li><li>Presiona cualquier botón del control mirando por la pantalla del celular.</li><li>Prueba a mirar la lucecita a simple vista. ¿Qué ves?</li></ol>
<p class="predict">A simple vista, ¿ves luz cuando presionas un botón? ¿Y con la cámara?</p>
<p class="result">A simple vista no ves nada. En la pantalla del celular ¡aparece una luz violeta o blanca parpadeando!</p>
<p class="why">El control manda luz infrarroja, invisible para tus ojos. Pero el sensor de la cámara sí la detecta y la muestra en la pantalla con un color falso.</p>
</div>
<div class="exp" data-title="Medir la velocidad de la luz con un chocolate" data-time="20 min" data-level="3" data-adult="1">
<ul class="mat"><li>🍫 Una barra de chocolate (o malvaviscos) en un plato sin plato giratorio</li><li>🍿 Un horno microondas (tiene su frecuencia en la etiqueta: casi siempre 2450 MHz)</li><li>📏 Una regla</li><li>🧤 Un adulto</li></ul>
<ol class="steps"><li>Un adulto quita el plato giratorio del microondas. Pon el chocolate sobre un plato quieto.</li><li>Calienta unos 20 a 30 segundos hasta que se vean zonas derretidas (no más, ¡no lo quemes!).</li><li>Mide la distancia entre dos puntos derretidos consecutivos: es la mitad de la longitud de onda. Dobla ese número y multiplícalo por la frecuencia (2,45 × 10⁹ Hz).</li></ol>
<p class="predict">Con 6 cm entre los puntos derretidos, ¿qué velocidad calcularás?</p>
<p class="result">Los puntos están separados unos 6 cm; λ = 12 cm = 0,12 m; c = 0,12 × 2,45 × 10⁹ ≈ 2,9 × 10⁸ m/s. ¡Casi 300 000 km/s!</p>
<p class="why">Las microondas forman una onda estacionaria dentro del horno: hay puntos de mucha energía (que derriten) y puntos de poca energía. La distancia entre ellos es la mitad de la longitud de onda, y con la frecuencia se calcula la velocidad.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="2"><p>¿Cuál de estas ondas NO es de la familia electromagnética?</p><ol><li>La luz</li><li>Las ondas de radio</li><li>El sonido</li></ol><p class="why">El sonido es una onda mecánica que necesita aire. La luz y las ondas de radio viajan hasta por el vacío.</p></div>
<div class="q" data-ans="0"><p>¿Cuál tiene la longitud de onda MÁS corta?</p><ol><li>Los rayos gamma</li><li>Las ondas de radio</li><li>La luz roja</li></ol><p class="why">Los rayos gamma son las ondas más cortas y de más energía.</p></div>
<div class="q" data-ans="1"><p>¿Qué usa el control remoto de la tele?</p><ol><li>Rayos X</li><li>Luz infrarroja</li><li>Ondas de radio</li></ol><p class="why">Un LED manda pulsos de luz infrarroja que el televisor recibe.</p></div>
<div class="q" data-ans="1"><p>¿Por qué se usa protector solar?</p><ol><li>Para no ver el Sol</li><li>Para bloquear el ultravioleta que quema la piel</li><li>Para dar más calor</li></ol><p class="why">El UV daña la piel y puede producir cáncer de piel a largo plazo.</p></div>
</div>
</template>

<!-- 33-dia-noche.html -->
<template class="chapter-src" data-id="dianoche" data-num="33" data-world="8" data-title="Día, noche, estaciones y Luna" data-short="Por qué sale el Sol, por qué hay estaciones, y cómo cambia la Luna cada noche.">
<p class="lead">Cada mañana el Sol sale y cada tarde se oculta. Parece que el Sol se mueve… ¡pero es la Tierra la que gira! Y la Luna cambia de forma cada noche. En este capítulo viajaremos con Cosmo por el cielo cercano.</p>

<div class="learn"><ul>
<li>La Tierra gira sobre sí misma cada 24 horas: por eso hay día y noche.</li>
<li>La Tierra da una vuelta al Sol cada año, y está inclinada: por eso hay estaciones.</li>
<li>La Luna da una vuelta a la Tierra cada mes: por eso cambia de fase.</li>
</ul></div>

<div class="say" data-who="cosmo" data-mood="wow"><p>¡Guau guau! ¡Soy Cosmo, el perro astronauta! Desde mi nave veo la Tierra girar como una pelota azul. ¿Sabías que mientras lees esto, ¡estás dando vueltas a 1670 km/h!?</p></div>

<section>
<h2>La Tierra gira: día y noche</h2>
<p>La Tierra gira sobre sí misma, como un trompo, una vuelta completa cada <b>24 horas</b>. Mientras gira, la parte que mira al Sol tiene <strong>día</strong> y la parte que le da la espalda tiene <strong>noche</strong>. Por eso el Sol «sale» por el este y se «oculta» por el oeste: es la Tierra la que gira hacia el este. Y por eso, cuando en Colombia es de noche, en Japón es de día.</p>
<div class="fact"><p>En el ecuador, la Tierra gira a unos 1670 km/h, ¡más rápido que un avión! No lo notas porque todo gira contigo: el aire, el suelo y tú. En Popayán, que está cerca del ecuador, los días y las noches duran casi lo mismo todo el año: unas 12 horas cada uno.</p></div>
<div class="sim" data-sim="tierra-gira" data-title="La Tierra girando" data-goal="Mueve la hora y encuentra un momento en que sea de noche en Popayán y de día en Tokio.">
<ul><li>Mira cómo la luz del Sol (a la derecha) ilumina la mitad de la Tierra.</li><li>Cada ciudad tiene una hora local distinta: ¡las zonas horarias!</li></ul>
</div>
</section>

<section>
<h2>Las estaciones</h2>
<p>Hay un secreto: la Tierra está <strong>inclinada</strong> 23,4° (como una peonza ladeada). Esa inclinación hace que, mientras la Tierra da la vuelta alrededor del Sol, unas veces el hemisferio norte apunta más hacia el Sol (verano en el norte) y otras veces el sur (verano en el sur). Cuando el Sol está más alto en el cielo, sus rayos llegan más directos y los días son más largos: ¡más calor!</p>
<div class="magic" data-name="Por qué hay estaciones"><big>no es la distancia al Sol, ¡es la inclinación!</big>En realidad, la Tierra está más cerca del Sol en enero, ¡cuando es invierno en el norte!</div>
<div class="sim" data-sim="estaciones" data-title="El año de la Tierra" data-goal="Mira cuánto dura el día en el solsticio de junio y diciembre en un lugar cerca del ecuador y en otro lejos de él.">
<ul><li>Cerca del ecuador (como Popayán) casi no cambia la duración del día.</li><li>En Londres, los días de verano son larguísimos y los de invierno, cortos.</li></ul>
</div>
<details class="curious"><p>La inclinación del eje es lo que define los trópicos (23,4° N y S) y los círculos polares (66,6° N y S). Entre los trópicos, el Sol puede estar justo sobre tu cabeza al mediodía: en Popayán sucede dos veces al año. Más allá del círculo polar, hay días en verano en que el Sol no se oculta (sol de medianoche) y días en invierno en que no sale.</p></details>
</section>

<section>
<h2>La Luna y sus fases</h2>
<p>La Luna no produce luz: refleja la del Sol. Siempre la mitad de la Luna está iluminada, pero desde la Tierra vemos más o menos esa mitad según dónde esté la Luna en su órbita. Da una vuelta a la Tierra en unos 29,5 días: eso es el «mes». Esas formas son las <dfn data-def="Las diferentes formas en que vemos iluminada la Luna a lo largo del mes.">fases</dfn>: luna nueva (no se ve), creciente, cuarto creciente, luna llena, cuarto menguante y menguante.</p>
<div class="fact"><p>La Luna siempre nos muestra la misma cara porque tarda lo mismo en girar sobre sí misma que en dar una vuelta a la Tierra. Y se está alejando de nosotros unos 3,8 cm cada año, ¡lo que crecen tus uñas en un año o dos!</p></div>
<div class="sim" data-sim="fases-luna" data-title="¿Dónde pongo la Luna?" data-goal="Mueve la Luna en su órbita para conseguir la fase que pide el reto. ¡Acierta las 4!">
<ul><li>Luna nueva: entre el Sol y la Tierra (no vemos su cara iluminada).</li><li>Luna llena: la Tierra entre el Sol y la Luna.</li></ul>
</div>
<h3>Los eclipses</h3>
<p>Un <strong>eclipse de Sol</strong> ocurre cuando la Luna pasa justo entre el Sol y la Tierra y tapa el Sol: ¡una sombra de la Luna cae sobre la Tierra! Un <strong>eclipse de Luna</strong> ocurre cuando la Tierra pasa entre el Sol y la Luna y la Luna entra en la sombra de la Tierra. No hay eclipse todos los meses porque la órbita de la Luna está inclinada unos 5° respecto a la de la Tierra, y casi siempre la sombra pasa por arriba o por abajo.</p>
<div class="story" data-title="La casualidad de los eclipses"><p>El Sol es 400 veces más grande que la Luna… ¡pero también está 400 veces más lejos! Por eso, desde la Tierra, el Sol y la Luna se ven del mismo tamaño en el cielo, y en un eclipse total la Luna tapa justo el disco del Sol y se ve su corona. ¡Una coincidencia que no pasa en ningún otro planeta del sistema solar!</p></div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Las fases de la Luna con una pelota" data-time="20 min" data-level="1">
<ul class="mat"><li>⚽ Una pelota blanca (o una naranja)</li><li>💡 Una lámpara sin pantalla</li><li>🌑 Una habitación oscura</li></ul>
<ol class="steps"><li>Pon la lámpara en un extremo del cuarto oscuro. Tú eres la Tierra: párate en el centro, frente a la lámpara.</li><li>Sostén la pelota con tu brazo estirado, a la altura de la cabeza. Gira despacio sobre ti mismo, y observa cuánto de la pelota está iluminada.</li><li>Fíjate en cuando la pelota está entre ti y la lámpara, cuando está a tu lado y cuando está del otro lado.</li></ol>
<p class="predict">¿Cuándo verás la «pelota-Luna» completamente iluminada?</p>
<p class="result">Cuando la pelota está detrás de ti respecto a la lámpara: la ves toda iluminada (luna llena). Cuando está entre tú y la lámpara, no ves la parte iluminada (luna nueva). A los lados ves la mitad (cuartos).</p>
<p class="why">Siempre está iluminada la mitad de la pelota, la que mira a la lámpara. Lo que ves depende del ángulo desde el que la miras: ¡esas son las fases!</p>
</div>
<div class="exp" data-title="Las estaciones con un globo terráqueo y una linterna" data-time="15 min" data-level="2">
<ul class="mat"><li>🌍 Un globo terráqueo (o una pelota con un dibujo)</li><li>🔦 Una linterna</li><li>🌑 Una habitación oscura</li></ul>
<ol class="steps"><li>Ilumina el globo con la linterna desde un lado, a cierta distancia. Inclina el globo (el eje apunta siempre hacia el mismo lado).</li><li>Fíjate en cuánta luz le cae al hemisferio norte y al sur, como si el globo estuviera en 4 puntos de su órbita.</li></ol>
<p class="predict">¿En qué posición recibe más luz el hemisferio norte?</p>
<p class="result">Cuando el polo norte del globo se inclina hacia la linterna, el hemisferio norte recibe más luz directa: es verano allí. Cuando se inclina hacia el otro lado, es invierno.</p>
<p class="why">La inclinación del eje cambia cuánta luz y qué tan directa le llega a cada hemisferio durante el año.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>¿Por qué hay día y noche?</p><ol><li>Porque el Sol se mueve alrededor de la Tierra</li><li>Porque la Tierra gira sobre sí misma</li><li>Porque la Luna tapa al Sol</li></ol><p class="why">La Tierra da una vuelta sobre sí misma cada 24 horas.</p></div>
<div class="q" data-ans="0"><p>¿Por qué hay estaciones?</p><ol><li>Por la inclinación del eje de la Tierra</li><li>Porque la Tierra se acerca y se aleja mucho del Sol</li><li>Por las nubes</li></ol><p class="why">Es la inclinación de 23,4° lo que cambia la luz que recibe cada hemisferio.</p></div>
<div class="q" data-ans="2"><p>En luna llena, ¿cuál es el orden Sol–Tierra–Luna?</p><ol><li>Sol, Luna, Tierra</li><li>Tierra, Sol, Luna</li><li>Sol, Tierra, Luna</li></ol><p class="why">En luna llena, la Tierra está entre el Sol y la Luna.</p></div>
<div class="q" data-ans="1"><p>Un eclipse de Sol ocurre cuando…</p><ol><li>La Tierra tapa a la Luna</li><li>La Luna pasa entre el Sol y la Tierra</li><li>El Sol se apaga</li></ol><p class="why">La Luna tapa al Sol y proyecta su sombra sobre la Tierra.</p></div>
</div>
</template>

<!-- 34-sistema-solar.html -->
<template class="chapter-src" data-id="sistemasolar" data-num="34" data-world="8" data-title="El Sistema Solar y las órbitas" data-short="Los planetas, el cañón de Newton, las leyes de Kepler y qué tan inmenso es el espacio.">
<p class="lead">Alrededor del Sol giran ocho planetas, sus lunas, asteroides y cometas. Todos se mueven siguiendo la misma regla que hace caer una manzana: la <strong>gravedad</strong>. ¡Vamos a ver cómo es nuestra casa en el espacio!</p>

<div class="learn"><ul>
<li>El Sol es una estrella y contiene casi toda la masa del Sistema Solar.</li>
<li>Un satélite está «cayendo» todo el tiempo, pero va tan rápido que nunca llega al suelo.</li>
<li>Los planetas más cercanos al Sol van más rápido y tienen años más cortos.</li>
<li>El espacio es muchísimo más grande y vacío de lo que parece en los dibujos.</li>
</ul></div>

<div class="say" data-who="cosmo" data-mood="happy"><p>¡Guau! Yo vivo en una nave espacial, pero ustedes también: la Tierra es una nave que viaja a 30 kilómetros por segundo alrededor del Sol. ¡Despegamos!</p></div>

<section>
<h2>Nuestro barrio cósmico</h2>
<table><tr><th>Planeta</th><th>Distancia al Sol (UA)</th><th>Duración del año</th><th>Tipo</th></tr>
<tr><td>☿ Mercurio</td><td>0,39</td><td>88 días</td><td>Rocoso</td></tr><tr><td>♀ Venus</td><td>0,72</td><td>225 días</td><td>Rocoso</td></tr><tr><td>🌍 Tierra</td><td>1,00</td><td>365 días</td><td>Rocoso</td></tr><tr><td>♂ Marte</td><td>1,52</td><td>687 días</td><td>Rocoso</td></tr>
<tr><td>♃ Júpiter</td><td>5,2</td><td>11,9 años</td><td>Gigante de gas</td></tr><tr><td>♄ Saturno</td><td>9,5</td><td>29,5 años</td><td>Gigante de gas</td></tr><tr><td>⛢ Urano</td><td>19,2</td><td>84 años</td><td>Gigante de hielo</td></tr><tr><td>♆ Neptuno</td><td>30,1</td><td>165 años</td><td>Gigante de hielo</td></tr></table>
<p>Una <dfn data-def="La distancia media entre la Tierra y el Sol: unos 150 millones de kilómetros. Se usa para medir distancias en el sistema solar.">unidad astronómica</dfn> (UA) es la distancia de la Tierra al Sol: 150 millones de kilómetros. Los cuatro planetas de adentro son <b>rocosos</b> y pequeños; los cuatro de afuera son enormes: Júpiter cabría 1300 veces la Tierra.</p>
<div class="fact"><p>El Sol tiene el 99,86 % de toda la masa del Sistema Solar: ¡todos los planetas juntos son apenas una pizca! En el Sol cabrían más de un millón de Tierras. Y el sistema solar tiene también planetas enanos como Plutón, miles de asteroides y cometas que vienen desde muy lejos.</p></div>
</section>

<section>
<h2>El cañón de Newton</h2>
<p>Isaac Newton imaginó lo siguiente: sobre una montaña muy alta hay un cañón que dispara una bala horizontal. Si la bala sale despacio, cae cerca. Si sale más rápido, cae más lejos. Y si sale <b>muy, muy rápido</b>… ¡la Tierra se curva debajo de la bala mientras cae y nunca llega al suelo! La bala queda <strong>en órbita</strong>: ¡cayendo para siempre alrededor de la Tierra!</p>
<div class="sim" data-sim="canon-newton" data-title="El cañón de Newton" data-goal="Prueba rapideces hasta que la bala dé la vuelta entera a la Tierra, y luego a otra con la que escape al espacio.">
<ul><li>Con 7,7 km/s a 300 km de altura queda en órbita casi circular.</li><li>Con unos 11 km/s o más escapa de la Tierra para siempre.</li><li>Entre 7,7 y 10,9 km/s la órbita es un óvalo (elipse).</li></ul>
</div>
<div class="fact"><p>La Estación Espacial Internacional está a unos 400 km de altura y da una vuelta a la Tierra cada 90 minutos, a unos 7,7 km/s (¡27 000 km/h!). Los astronautas no «flotan porque no haya gravedad»: la gravedad allá es casi la misma que aquí. Flotan porque ellos, la estación y todo lo que hay adentro están <em>cayendo juntos</em> alrededor de la Tierra.</p></div>
<details class="curious"><p>La rapidez de una órbita circular a distancia r del centro de un planeta de masa M es v = √(GM/r). Para la Tierra a 6700 km del centro (unos 300 km de altura), v ≈ 7,7 km/s. La rapidez de escape es √2 veces mayor: v = √(2GM/r) ≈ 11 km/s en la superficie. Los satélites geoestacionarios están a 35 786 km de altura, donde la órbita dura exactamente 24 horas, ¡por eso parecen quietos sobre un punto de la Tierra!</p></details>
</section>

<section>
<h2>Las leyes de Kepler: años largos y cortos</h2>
<p>Johannes Kepler (hace unos 400 años) descubrió, usando las observaciones de Tycho Brahe, que los planetas se mueven en <b>elipses</b> (óvalos) y que <b>los más lejanos van más despacio</b>. La regla es esta: si un planeta está 4 veces más lejos del Sol, tarda 8 veces más en dar la vuelta. En general: <em>período² = distancia³</em> (con el período en años y la distancia en UA).</p>
<div class="magic" data-name="Tercera ley de Kepler"><big>año² = distancia³</big>Júpiter: 5,2³ = 140,6 → √140,6 ≈ 11,9 años</div>
<div class="sim" data-sim="kepler" data-title="Los planetas en órbita" data-goal="Acelera el tiempo y deja que Júpiter dé una vuelta completa mientras Mercurio da muchísimas.">
<ul><li>Elige un planeta para ver sus datos.</li><li>Mercurio da más de 4 vueltas por cada año terrestre.</li></ul>
</div>
</section>

<section>
<h2>Qué tan grande es el espacio</h2>
<p>En los dibujos, los planetas parecen estar cerca unos de otros y ser casi del tamaño del Sol. Pero la realidad es muy distinta: <strong>el espacio es casi todo vacío</strong>. Imagina que el Sol fuera una pelota de 1 metro. ¡La Tierra sería una canica de 9 mm… a 107 metros de distancia! Neptuno estaría a más de 3 kilómetros. Y la estrella más cercana, Próxima Centauri, ¡a unos 30 000 kilómetros!</p>
<div class="sim" data-sim="escala-sistema" data-title="Camina por el sistema solar" data-goal="Camina por el Sistema Solar a escala (el Sol es una pelota de 1 m) hasta llegar a Neptuno.">
<ul><li>Fíjate cuánto espacio vacío hay entre planetas.</li><li>A paso normal (1,4 m/s) llegarías a Neptuno en unos 40 minutos a esta escala.</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="El sistema solar en un rollo de papel higiénico" data-time="30 min" data-level="1">
<ul class="mat"><li>🧻 Un rollo de papel higiénico (200 hojas o más)</li><li>🖍️ Marcadores</li><li>📋 La tabla de distancias de este capítulo</li></ul>
<ol class="steps"><li>Desenrolla el papel en el piso. El Sol está en el extremo, en la hoja 0.</li><li>Cada hoja del rollo representa 1 UA (la distancia Tierra–Sol). Marca a Mercurio a 0,4 hojas, Venus a 0,7, la Tierra en la hoja 1, Marte en 1,5.</li><li>Sigue con Júpiter (hoja 5,2), Saturno (9,5), Urano (19) y Neptuno (30).</li><li>Mira todo el espacio vacío que hay entre los planetas.</li></ol>
<p class="predict">¿Cuántas hojas habrá entre el Sol y Neptuno?</p>
<p class="result">Hay 30 hojas hasta Neptuno. Los cuatro planetas rocosos quedan en la primera hoja y media: ¡muy cerca del Sol y entre sí!</p>
<p class="why">Los planetas de adentro están muy juntos, y los de afuera, muy separados. El Sistema Solar es casi todo espacio vacío.</p>
</div>
<div class="exp" data-title="Encuentra a Venus y a Júpiter en el cielo" data-time="20 min" data-level="1" data-adult="1">
<ul class="mat"><li>🌆 Un lugar con cielo abierto, al atardecer o antes del amanecer</li><li>📱 Una aplicación gratuita de mapas del cielo (opcional)</li><li>🧑‍🤝‍🧑 Un adulto</li></ul>
<ol class="steps"><li>Sal al atardecer con un adulto y mira hacia el lugar donde se ocultó el Sol.</li><li>Busca la «estrella» más brillante: puede ser Venus. No titila (parpadea) como las estrellas.</li><li>Con una app, comprueba cuál planeta es y dónde están los otros.</li></ol>
<p class="predict">¿Los planetas se ven titilando como las estrellas?</p>
<p class="result">Los planetas brillan con una luz firme, sin parpadear mucho; las estrellas titilan.</p>
<p class="why">Las estrellas están tan lejos que son un punto diminuto cuya luz se desvía con el aire. Los planetas están más cerca y se ven como un disco muy pequeño, por lo que titilan menos. La palabra «planeta» significa «errante»: se mueven entre las estrellas.</p>
</div>
</section>

<!-- 35-estrellas.html -->
<template class="chapter-src" data-id="estrellas" data-num="35" data-world="8" data-title="Las estrellas: nacen, viven y mueren" data-short="De qué están hechas, por qué tienen colores, cómo viven y mueren, y los dibujos que forman en el cielo.">
<p class="lead">Cuando miras el cielo de noche, ves miles de puntitos brillantes. Cada uno es un <strong>Sol</strong>, muy, muy lejano. Las estrellas nacen, viven millones de años y mueren. Y de sus cenizas estamos hechos tú, yo y todo lo que nos rodea.</p>

<div class="learn"><ul>
<li>Una estrella es una bola gigante de gas que brilla porque funde hidrógeno en su centro.</li>
<li>El color de una estrella dice su temperatura: las azules son las más calientes y las rojas las más frías.</li>
<li>Las estrellas grandes viven poco y mueren en explosiones; las pequeñas viven muchísimo.</li>
<li>Casi todos los átomos de tu cuerpo se hicieron dentro de estrellas.</li>
</ul></div>

<div class="say" data-who="cosmo" data-mood="wow"><p>¡Guau! Las estrellas son mis vecinas favoritas. Aunque algunas están tan lejos que su luz tardó miles de años en llegar: ¡cuando las miras, ves el pasado!</p></div>

<section>
<h2>¿Qué es una estrella?</h2>
<p>El Sol es una estrella. Las demás estrellas se ven pequeñas solo porque están lejísimos: la más cercana después del Sol, Próxima Centauri, está a 4,2 años luz (la luz tarda 4,2 años en llegar). Una estrella es una enorme bola de gas (sobre todo hidrógeno) que la gravedad aprieta tanto que en el centro hace muchísimo calor y presión: ¡tanto que los átomos de hidrógeno se unen en átomos de helio! A esto se le llama <dfn data-def="Cuando átomos pequeños se unen para formar uno más grande y sueltan muchísima energía. Es lo que hace brillar a las estrellas.">fusión nuclear</dfn>, y suelta la energía que ves como luz.</p>
<div class="story" data-title="Cecilia Payne y de qué están hechas las estrellas"><p>En 1925, una joven astrónoma británica, Cecilia Payne, estudió la luz de las estrellas y descubrió que están hechas sobre todo de hidrógeno y helio. Era algo tan inesperado que su propio profesor le pidió que dijera que su resultado era «casi seguro un error»… ¡pero ella tenía razón! Hoy sabemos que el 98 % de lo que hay en una estrella es hidrógeno y helio.</p></div>
<h3>El color de las estrellas</h3>
<p>Un trozo de hierro, al calentarse, se pone primero rojo, luego naranja, luego amarillo y por último blanco azulado. Con las estrellas pasa igual: <b>su color depende de su temperatura</b>. Una estrella roja tiene unos 3000 °C en la superficie, el Sol (amarillo) unos 5500 °C, y una estrella azul puede pasar de 20 000 °C.</p>
<div class="sim" data-sim="color-estrella" data-title="¿De qué color es cada estrella?" data-goal="Une cada estrella con su color según su temperatura."></div>
</section>

<section>
<h2>La vida de una estrella</h2>
<p>Las estrellas nacen en nubes de gas y polvo llamadas <b>nebulosas</b>. La gravedad junta el gas, que se calienta hasta que se enciende la fusión: ¡nace una estrella! Después vive millones o miles de millones de años quemando hidrógeno. Cuando el hidrógeno del centro se acaba, la estrella cambia, y su final <strong>depende de su masa</strong>:</p>
<ul>
<li><b>Estrellas pequeñas</b> (enanas rojas): viven billones de años y se apagan despacio.</li>
<li><b>Estrellas como el Sol</b>: se hinchan hasta ser gigantes rojas, sueltan sus capas formando una nebulosa y dejan un núcleo pequeño y caliente: una <i>enana blanca</i>.</li>
<li><b>Estrellas grandes</b> (más de 8 veces el Sol): explotan como <i>supernovas</i> y dejan una estrella de neutrones.</li>
<li><b>Estrellas gigantes</b> (más de 20 veces el Sol): explotan y dejan un <i>agujero negro</i>.</li>
</ul>
<div class="sim" data-sim="vida-estrella" data-title="La vida de una estrella" data-goal="Cambia la masa de la estrella y descubre tres finales diferentes: enana blanca, estrella de neutrones y agujero negro.">
<ul><li>Mientras más masa tiene una estrella, más caliente es, más azul se ve y ¡menos vive!</li><li>El Sol vivirá unos 10 000 millones de años; una estrella 20 veces más grande, solo unos 10 millones.</li></ul>
</div>
<div class="fact"><p>Dentro de las estrellas se fabrican los átomos más pesados: el carbono, el oxígeno, el calcio, el hierro… Cuando una estrella explota, esos átomos se esparcen por el espacio y con ellos se forman nuevas estrellas, planetas y hasta personas. Casi todos los átomos de tu cuerpo estuvieron alguna vez dentro de una estrella: ¡eres polvo de estrellas!</p></div>
<details class="curious"><p>El tiempo de vida de una estrella en la secuencia principal es aproximadamente t ≈ 10 000 millones de años × (M/M☉)<sup>−2,5</sup>. Por eso una estrella de 10 masas solares vive solo unos 30 millones de años. Los agujeros negros tienen tanta gravedad que ni la luz puede escapar. El primero que se «fotografió» fue el del centro de la galaxia M87, en 2019; en 2022 se obtuvo la imagen del que hay en el centro de nuestra galaxia, la Vía Láctea.</p></details>
</section>

<section>
<h2>Las constelaciones</h2>
<p>Desde hace miles de años, los pueblos de todo el mundo conectaron las estrellas con líneas imaginarias para dibujar figuras: las <strong>constelaciones</strong>. Sirven como mapa del cielo. Cada cultura las veía distinto: los griegos veían a Orión el cazador, y los pueblos andinos veían animales en las manchas oscuras de la Vía Láctea. En Colombia podemos ver Orión, la Cruz del Sur y las siete estrellas de la Osa Mayor.</p>
<div class="sim" data-sim="constelaciones" data-title="Conecta las estrellas" data-goal="Toca las estrellas en orden (1, 2, 3…) para dibujar la Cruz del Sur, Orión y la Osa Mayor.">
<ul><li>Las estrellas de una constelación no están juntas: solo se ven juntas desde la Tierra, pero pueden estar a distancias enormes.</li><li>La Cruz del Sur sirve para encontrar el sur.</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Un planetario casero" data-time="30 min" data-level="1" data-adult="1">
<ul class="mat"><li>🥤 Un vaso o tubo de cartón opaco</li><li>🪡 Una aguja o chinche (¡con adulto!)</li><li>🔦 Una linterna</li><li>🗺️ Dibujo de una constelación (Orión, Cruz del Sur)</li><li>📄 Papel de aluminio</li></ul>
<ol class="steps"><li>Dibuja en un círculo de papel la constelación que quieras.</li><li>Pega el papel sobre el fondo del vaso y, con la aguja, un adulto hace un agujerito en cada estrella (los lugares marcados).</li><li>En una habitación oscura, pon la linterna por el lado abierto del vaso y alumbra la pared por los agujeritos.</li></ol>
<p class="predict">¿Qué verás en la pared?</p>
<p class="result">La pared se llena de puntitos de luz que forman la constelación. Si los agujeros son de distinto tamaño, tendrás estrellas más brillantes y más tenues.</p>
<p class="why">Cada agujero deja pasar un rayito de luz en línea recta. Las estrellas brillan más por su tamaño y su distancia: las más grandes y cercanas se ven más brillantes.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="2"><p>¿Por qué brilla una estrella?</p><ol><li>Porque es de fuego</li><li>Porque refleja la luz del Sol</li><li>Porque funde hidrógeno y suelta energía</li></ol><p class="why">En el centro de las estrellas, el hidrógeno se une en helio y se suelta muchísima energía: la fusión nuclear.</p></div>
<div class="q" data-ans="1"><p>¿Cuál es la estrella más caliente?</p><ol><li>La roja</li><li>La azul</li><li>La amarilla</li></ol><p class="why">Las estrellas azules son las más calientes.</p></div>
<div class="q" data-ans="0"><p>Las estrellas muy grandes viven…</p><ol><li>Menos tiempo que las pequeñas</li><li>Más tiempo que las pequeñas</li><li>Lo mismo</li></ol><p class="why">Las estrellas grandes gastan su combustible muy rápido y viven poco.</p></div>
<div class="q" data-ans="1"><p>¿De dónde vienen los átomos de carbono y oxígeno de tu cuerpo?</p><ol><li>De otro planeta</li><li>De estrellas que explotaron hace mucho</li><li>Siempre estuvieron aquí</li></ol><p class="why">Se fabricaron dentro de estrellas y se esparcieron cuando murieron.</p></div>
</div>
</template>

<!-- 36-universo.html -->
<template class="chapter-src" data-id="universo" data-num="36" data-world="8" data-title="Galaxias y el universo" data-short="La Vía Láctea, el Big Bang, el universo que se expande y cómo mirar lejos es mirar al pasado.">
<p class="lead">Las estrellas no están solas: viven en enormes ciudades de estrellas llamadas <strong>galaxias</strong>. Y hay cientos de miles de millones de galaxias en el universo. Vamos a viajar más lejos de lo que nunca has imaginado.</p>

<div class="learn"><ul>
<li>Una galaxia es un conjunto de cientos de miles de millones de estrellas, gas y polvo.</li>
<li>Vivimos en la Vía Láctea; la galaxia vecina más grande es Andrómeda.</li>
<li>El universo se está expandiendo y empezó hace 13 800 millones de años con el Big Bang.</li>
<li>Mirar objetos lejanos es mirar el pasado, porque la luz tarda en llegar.</li>
</ul></div>

<div class="say" data-who="cosmo" data-mood="wow"><p>¡Guau guau! Cada vez que miro al cielo veo ¡el pasado! La luz que llega de lejos salió hace mucho tiempo. ¡Soy un perro viajero en el tiempo!</p></div>

<section>
<h2>Nuestra galaxia: la Vía Láctea</h2>
<p>Si en una noche muy oscura miras al cielo, verás una franja blanquecina como un río de leche: es la <strong>Vía Láctea</strong> (su nombre significa «camino de leche»). Es nuestra galaxia, vista de canto desde adentro. Tiene entre 100 000 y 400 000 millones de estrellas y es un disco enorme con brazos en espiral, de unos 100 000 años luz de ancho. El Sol está a unos 26 000 años luz del centro y da una vuelta a la galaxia cada 230 millones de años: ¡la última vez que estuvimos en esta zona vivían los dinosaurios!</p>
<div class="fact"><p>Una galaxia hermana, <b>Andrómeda</b>, está a 2,5 millones de años luz. Es la galaxia grande más cercana, y se puede ver a simple vista en una noche muy oscura como una manchita. Dentro de unos 4500 millones de años chocará con la Vía Láctea y se fusionarán ¡pero las estrellas casi no chocarán, porque están muy separadas!</p></div>
<h3>Mirar lejos es mirar el pasado</h3>
<p>La luz es rapidísima, pero el universo es enorme. La luz de la Luna tarda 1,3 s en llegar, la del Sol 8 minutos, la de la estrella más cercana 4,2 años… y la de Andrómeda, ¡2,5 millones de años! Eso significa que, cuando miras Andrómeda, la ves como era hace 2,5 millones de años, cuando empezaba a haber humanos en África.</p>
<div class="sim" data-sim="mira-pasado" data-title="La máquina del tiempo de la luz" data-goal="Viaja lejos y visita al menos cinco objetos. ¡Cada uno lo ves como era en el pasado!">
<ul><li>Un año luz es la distancia que recorre la luz en un año: unos 9,5 billones de kilómetros.</li><li>Los telescopios son máquinas del tiempo: ven el pasado.</li></ul>
</div>
</section>

<section>
<h2>El universo se expande</h2>
<div class="story" data-title="Hubble y las galaxias que se alejan"><p>En 1929, el astrónomo Edwin Hubble descubrió algo asombroso: casi todas las galaxias se están <strong>alejando</strong> de nosotros, y mientras más lejos está una galaxia, más rápido se aleja. No es que la Tierra sea especial: es el espacio mismo el que se está estirando, y todas las galaxias se alejan unas de otras, como puntitos pintados sobre un globo que se infla.</p></div>
<div class="sim" data-sim="globo-expansion" data-title="El globo que se infla" data-goal="Infla el universo y elige una galaxia como referencia: ¡las más lejanas se alejan más rápido!">
<ul><li>Toca cualquier galaxia para ponerte en ella.</li><li>Mira cómo todas se alejan de ti, y las lejanas se alejan más rápido.</li></ul>
</div>
<p>Si el universo se está expandiendo, entonces antes estuvo más junto, más denso y más caliente. Retrocediendo en el tiempo, hace <b>13 800 millones de años</b>, todo el universo estaba concentrado en un punto muy caliente. Fue el <dfn data-def="El comienzo del universo hace 13 800 millones de años, a partir de un estado muy caliente y denso que se ha ido expandiendo.">Big Bang</dfn> (la «gran explosión»). Pero no fue una explosión en un lugar: fue la expansión del espacio entero.</p>
<div class="fact"><p>La luz del Big Bang todavía nos llega, enfriada, como una débil radiación de microondas que viene de todas direcciones: el «eco del Big Bang». Penzias y Wilson la descubrieron en 1965 sin querer, ¡intentando eliminar un ruido de su antena! Ganaron el Premio Nobel.</p></div>
<details class="curious"><p>Lo que vemos (estrellas, gas, galaxias) es solo el 5 % del universo. La astrónoma Vera Rubin vio en los años 1970 que las estrellas de las galaxias giran tan rápido que deberían salir volando si solo hubiera la materia visible. Hay algo más: la «materia oscura» (27 %), que no emite luz pero tiene gravedad. Y desde 1998 se sabe que la expansión se está acelerando por una «energía oscura» (68 %). Aún no sabemos qué son. ¡Son dos de los grandes misterios de la física!</p></details>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Galaxias en un globo" data-time="10 min" data-level="1">
<ul class="mat"><li>🎈 Un globo sin inflar</li><li>🖊️ Un marcador de punta fina</li><li>🧵 Un hilo o cinta métrica flexible</li></ul>
<ol class="steps"><li>Infla un poco el globo y dibuja 8 puntitos (las galaxias) en distintas partes.</li><li>Elige uno como «tu galaxia». Con el hilo, mide la distancia a otros dos puntos: uno cercano y uno lejano.</li><li>Infla mucho el globo y vuelve a medir las mismas distancias.</li></ol>
<p class="predict">¿Cuál distancia aumentó más: la del punto cercano o la del lejano?</p>
<p class="result">Todas las distancias aumentaron, pero la del punto lejano aumentó más. Si la lejana estaba al doble de distancia, ¡creció el doble!</p>
<p class="why">Cuando el espacio se estira, cada parte se estira por igual: entonces los puntos más lejanos se alejan más en el mismo tiempo. ¡Eso mismo descubrió Hubble con las galaxias!</p>
</div>
<div class="exp" data-title="Una galaxia en un plato de leche" data-time="10 min" data-level="1">
<ul class="mat"><li>🥛 Leche entera (en un plato hondo)</li><li>🎨 Colorantes de comida (varios colores)</li><li>🧴 Detergente líquido para platos</li><li>🥢 Un palillo o cotonete</li></ul>
<ol class="steps"><li>Vierte leche en el plato hasta cubrir el fondo.</li><li>Deja caer gotas de colorante en el centro, sin revolver.</li><li>Moja la punta del palillo en detergente y toca el centro del plato, unos segundos. Observa.</li></ol>
<p class="predict">¿Qué le pasará a los colores?</p>
<p class="result">¡Los colores se mueven y giran formando espirales, como una galaxia!</p>
<p class="why">El detergente rompe la tensión superficial y las grasas de la leche, y se genera un flujo que arrastra los colores. No es una galaxia de verdad, pero muestra cómo giran los remolinos, como los brazos de una galaxia espiral.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>¿Cómo se llama la galaxia donde vivimos?</p><ol><li>Andrómeda</li><li>La Vía Láctea</li><li>El Sol</li></ol><p class="why">Vivimos en la Vía Láctea. Andrómeda es la galaxia grande vecina.</p></div>
<div class="q" data-ans="0"><p>Si una estrella está a 100 años luz, ¿cómo la ves?</p><ol><li>Como era hace 100 años</li><li>Como es ahora</li><li>Como será dentro de 100 años</li></ol><p class="why">La luz tardó 100 años en llegar: ves el pasado.</p></div>
<div class="q" data-ans="2"><p>Hubble descubrió que las galaxias…</p><ol><li>Se acercan a nosotros</li><li>Están quietas</li><li>Se alejan, y más rápido las más lejanas</li></ol><p class="why">El universo se está expandiendo: todo se aleja de todo.</p></div>
<div class="q" data-ans="1"><p>¿Hace cuánto empezó el universo (Big Bang)?</p><ol><li>Hace 6000 años</li><li>Hace 13 800 millones de años</li><li>Hace 1 millón de años</li></ol><p class="why">Los científicos estiman que el universo tiene unos 13 800 millones de años.</p></div>
</div>
</template>

<!-- 37-cohetes.html -->
<template class="chapter-src" data-id="cohetes" data-num="37" data-world="8" data-title="Cohetes y exploración espacial" data-short="Cómo despega un cohete, por qué necesita etapas, y cómo se aterriza suavemente en la Luna.">
<p class="lead">Durante miles de años, los humanos soñaron con llegar a la Luna. Hoy hemos mandado personas a la Luna, robots a Marte y sondas más allá del Sistema Solar. ¿Cómo lo logramos? Con <strong>cohetes</strong> y mucha física.</p>

<div class="learn"><ul>
<li>Un cohete funciona por acción y reacción: expulsa gases hacia abajo y sube.</li>
<li>Para llegar al espacio hace falta una rapidez enorme: unos 8 km/s.</li>
<li>Los cohetes se construyen por etapas, que se sueltan cuando se gastan.</li>
<li>Aterrizar suave en otro mundo exige controlar el empuje con precisión.</li>
</ul></div>

<div class="say" data-who="cosmo" data-mood="wink"><p>¡Cuenta regresiva! Diez, nueve, ocho… Los astronautas como yo usamos todo lo que has aprendido: fuerzas, gravedad, órbitas, energía… ¡Y un montón de valentía!</p></div>

<section>
<h2>Cómo funciona un cohete</h2>
<p>Un cohete sube igual que el globo del capítulo 6: <b>expulsa algo hacia atrás para ir hacia adelante</b> (tercera ley de Newton). En un cohete se quema combustible con oxígeno, y los gases calientísimos salen a gran velocidad por la tobera. Esos gases empujan al cohete en sentido contrario. Funciona hasta en el espacio vacío: ¡no necesita aire para empujar! (Eso lo demostró el estadounidense Robert Goddard, a pesar de que un periódico se burló de él diciendo que en el vacío un cohete no puede funcionar.)</p>
<div class="story" data-title="El maestro de escuela que soñaba con el espacio"><p>El ruso Konstantín Tsiolkovski, un maestro de escuela casi sordo, calculó en 1903 cómo funcionaría un cohete. Descubrió una fórmula que dice cuánta rapidez gana un cohete según la rapidez de sus gases y cuánto combustible lleva. Dijo: «La Tierra es la cuna de la humanidad, pero no se puede vivir en la cuna para siempre.»</p></div>
<div class="magic" data-name="La idea de Tsiolkovski"><big>más gases rápidos y más combustible = más rapidez</big>Pero el combustible también pesa y hay que subirlo: ¡es un círculo difícil!</div>
</section>

<section>
<h2>¿Por qué los cohetes tienen etapas?</h2>
<p>Para entrar en órbita hacen falta unos 9,4 km/s (7,8 km/s de la órbita más las pérdidas contra el aire y la gravedad). Un solo tanque gigante no alcanza: la mayor parte del cohete es combustible, y cuando el combustible se gasta, el tanque vacío sigue siendo peso muerto. La solución: construir el cohete en <strong>etapas</strong>. Cuando se agota el combustible de la primera, se suelta (¡adiós peso!) y la siguiente enciende y sigue con un cohete mucho más liviano.</p>
<div class="sim" data-sim="etapas-cohete" data-title="Construye tu cohete" data-goal="Escoge etapas y combustible para que tu cohete llegue a la órbita de la Tierra y también a la Luna.">
<ul><li>El hidrógeno líquido da gases más rápidos que el queroseno.</li><li>Más etapas dan más rapidez, pero cada una cuesta y complica el cohete.</li></ul>
</div>
<details class="curious"><p>La ecuación del cohete de Tsiolkovski dice: Δv = v<sub>e</sub> · ln(m<sub>inicial</sub> / m<sub>final</sub>), donde v<sub>e</sub> es la rapidez de los gases y ln es el logaritmo natural. Con queroseno, v<sub>e</sub> ≈ 3 km/s; con hidrógeno, v<sub>e</sub> ≈ 4,4 km/s. Para sumar 9,4 km/s con v<sub>e</sub> = 3 km/s hace falta una razón de masas de e<sup>3,1</sup> ≈ 23: ¡el 96 % de la masa tendría que ser combustible! Con etapas, el problema se reparte y se hace posible.</p></details>
</section>

<section>
<h2>Aterrizar en la Luna</h2>
<p>Llegar es una cosa; <strong>aterrizar sin estrellarse</strong> es otra. Para posarse en la Luna hay que frenar con los motores justo a tiempo: si frenas muy tarde, te estrellas; si frenas muy temprano, te quedas sin combustible y caes. Los astronautas del Apolo 11 lo lograron el 20 de julio de 1969, con el combustible casi agotado.</p>
<div class="sim" data-sim="alunizaje" data-title="¡A alunizar!" data-goal="Mantén presionado (mouse o dedo) sobre la pantalla para encender el motor y aterriza con menos de 2 m/s de velocidad.">
<ul><li>La gravedad de la Luna es 6 veces menor que la de la Tierra: caes más despacio, pero también el motor gasta combustible.</li><li>Mantén presionado para empujar hacia arriba; suelta para caer.</li></ul>
</div>
<div class="fact"><p>Katherine Johnson, una matemática de la NASA, calculó a mano las trayectorias de los primeros vuelos tripulados de Estados Unidos y del Apolo 11. Cuando el astronauta John Glenn iba a orbitar la Tierra, pidió que ella revisara los cálculos de las computadoras antes de despegar. ¡Confiaba más en su cerebro que en las máquinas!</p></div>
</section>

<section>
<h2>Algunos hitos de la exploración espacial</h2>
<ol class="tl">
<li><span class="tl-y">1957</span><b>🛰️ Sputnik 1</b><p>El primer satélite artificial, de la Unión Soviética. Su «bip-bip» se oyó por radio en todo el mundo.</p></li>
<li><span class="tl-y">1961</span><b>👨‍🚀 Yuri Gagarin</b><p>El primer ser humano en el espacio: dio una vuelta a la Tierra. En 1963 Valentina Tereshkova fue la primera mujer.</p></li>
<li><span class="tl-y">1969</span><b>🌙 Apolo 11</b><p>Neil Armstrong y Buzz Aldrin caminaron sobre la Luna. Michael Collins los esperó en órbita.</p></li>
<li><span class="tl-y">1977</span><b>📡 Voyager 1 y 2</b><p>Dos sondas que visitaron los planetas gigantes. La Voyager 1 ya está fuera del Sistema Solar, a más de 24 000 millones de km.</p></li>
<li><span class="tl-y">1990</span><b>🔭 Telescopio espacial Hubble</b><p>Vio galaxias lejanas y nos ayudó a calcular la edad del universo.</p></li>
<li><span class="tl-y">1998–hoy</span><b>🏠 Estación Espacial Internacional</b><p>Un laboratorio donde viven astronautas de muchos países, ¡dando 16 vueltas a la Tierra cada día!</p></li>
<li><span class="tl-y">2007</span><b>🇨🇴 Libertad 1</b><p>El primer satélite colombiano, un cubesat del tamaño de una caja de cereal, construido por la Universidad Sergio Arboleda.</p></li>
<li><span class="tl-y">2021</span><b>🔭 Telescopio James Webb</b><p>Un telescopio infrarrojo que mira las primeras galaxias, a un millón y medio de km de la Tierra.</p></li>
</ol>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Cohetes de papel que vuelan soplando" data-time="25 min" data-level="1">
<ul class="mat"><li>📄 Hojas de papel</li><li>🥤 Una pajilla gruesa o un tubo de lápiz</li><li>🩹 Cinta pegante</li><li>✂️ Tijeras</li></ul>
<ol class="steps"><li>Enrolla una hoja de papel alrededor de la pajilla formando un tubito, y pégalo. Sella una punta del tubo con cinta (esa es la punta del cohete).</li><li>Saca la pajilla y haz aletas de papel o cartulina, pegándolas cerca de la base.</li><li>Pon el tubo en la pajilla y sopla fuerte: ¡el cohete sale volando!</li><li>Compara cohetes con aletas y sin aletas, con punta larga y corta.</li></ol>
<p class="predict">¿Un cohete con aletas llegará más lejos o más cerca que uno sin aletas?</p>
<p class="result">Los cohetes con aletas vuelan más derechos y llegan más lejos. Sin aletas, tienden a dar vueltas y caer rápido.</p>
<p class="why">Las aletas mantienen la parte trasera detrás, como las plumas de una flecha, y hacen que el cohete vuele de punta. Los cohetes de verdad también las tienen (o usan motores orientables).</p>
</div>
<div class="exp" data-title="Cohete de botella con agua y aire" data-time="40 min" data-level="3" data-adult="1">
<ul class="mat"><li>🧴 Una botella de gaseosa de 2 litros</li><li>🔌 Una bomba de bicicleta con adaptador y un tapón de corcho con un agujero</li><li>💧 Agua</li><li>🏞️ Un espacio abierto lejos de personas</li><li>🧑‍🤝‍🧑 Un adulto</li></ul>
<ol class="steps"><li>Llena la botella hasta un tercio con agua.</li><li>Un adulto pone el tapón con la bomba, boca abajo sobre una base estable.</li><li>Todos se alejan 5 metros. El adulto bombea aire hasta que el cohete sale disparado.</li><li>Prueba con poca agua, con mucha, y con un poco más de aire.</li></ol>
<p class="warn">Hazlo solo al aire libre con un adulto, lejos de personas, animales y cables. Usa gafas de protección y nunca te pongas encima de la botella.</p>
<p class="predict">¿Con cuánta agua subirá más alto?</p>
<p class="result">Sube más alto con alrededor de un tercio de agua. Con muy poca o con mucha, sube menos.</p>
<p class="why">El aire comprimido empuja el agua hacia abajo y el cohete sube por reacción. Con poca agua, hay poca masa expulsada; con mucha, el cohete es muy pesado. Hay un punto intermedio óptimo.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>¿Cómo se impulsa un cohete en el espacio vacío?</p><ol><li>Empujando contra el aire</li><li>Expulsando gases hacia atrás</li><li>Con la gravedad de la Luna</li></ol><p class="why">Por acción y reacción: los gases salen hacia atrás y empujan al cohete hacia adelante.</p></div>
<div class="q" data-ans="0"><p>¿Por qué los cohetes tienen etapas?</p><ol><li>Para soltar los tanques vacíos y no cargar peso inútil</li><li>Para que se vean más grandes</li><li>Para llevar más pasajeros</li></ol><p class="why">Al soltar cada etapa vacía, el cohete restante es más liviano y gana más rapidez.</p></div>
<div class="q" data-ans="2"><p>¿Quién fue el primer ser humano en viajar al espacio?</p><ol><li>Neil Armstrong</li><li>Laika</li><li>Yuri Gagarin</li></ol><p class="why">Gagarin, en 1961. Armstrong fue el primero en caminar sobre la Luna (1969).</p></div>
<div class="q" data-ans="1"><p>¿Cuánta rapidez se necesita aproximadamente para orbitar la Tierra?</p><ol><li>8 km/h</li><li>8 km/s</li><li>800 km/h</li></ol><p class="why">Unos 7,8 kilómetros por segundo: ¡unos 28 000 km/h!</p></div>
</div>
</template>

<!-- 38-atomos.html -->
<template class="chapter-src" data-id="atomos" data-num="38" data-world="9" data-title="Los átomos: de qué está hecho todo" data-short="Átomos, electrones, protones y neutrones; la tabla periódica y cómo se descubrió el núcleo.">
<p class="lead">Si cortaras una piedra por la mitad, y esa mitad por la mitad, y así muchísimas veces, ¿hasta dónde podrías seguir? Hace 2400 años, un griego llamado Demócrito pensó que llegaría un momento en que ya no se podría cortar más: una partícula indivisible, el <strong>átomo</strong>. ¡Y tenía razón (casi)!</p>

<div class="learn"><ul>
<li>Todo lo que existe está hecho de átomos, tan pequeños que no se pueden ver.</li>
<li>Un átomo tiene un núcleo (protones y neutrones) y electrones alrededor.</li>
<li>El número de protones decide de qué elemento es el átomo.</li>
<li>Los átomos son casi todo vacío: el núcleo es 100 000 veces más pequeño que el átomo.</li>
</ul></div>

<div class="say" data-who="quarki" data-mood="happy"><p>¡Hola! Soy Quarki, un átomo curioso. Estoy hecho de partes aún más chiquitas y bailo todo el día. ¡Ven a conocerme por dentro!</p></div>

<section>
<h2>Las partes del átomo</h2>
<div class="cols3">
<div class="card"><div class="big-emoji">🔴</div><h4>Protón</h4><p>Carga positiva (+). Está en el núcleo. Cuántos protones tiene un átomo decide de qué elemento es.</p></div>
<div class="card"><div class="big-emoji">⚪</div><h4>Neutrón</h4><p>Sin carga. Está en el núcleo con los protones. Pega el núcleo y le da estabilidad.</p></div>
<div class="card"><div class="big-emoji">🔵</div><h4>Electrón</h4><p>Carga negativa (−). Es ligerísimo y se mueve alrededor del núcleo en nubes.</p></div>
</div>
<p>El núcleo es diminuto pero pesa casi todo el átomo: un protón es unas 1836 veces más pesado que un electrón. Un átomo neutro tiene el mismo número de electrones que de protones, así que sus cargas se cancelan. Si pierde o gana electrones, se vuelve un <strong>ion</strong>.</p>
<div class="fact"><p>Si el núcleo de un átomo fuera una canica en el centro de un estadio de fútbol, los electrones estarían en las graderías, ¡y casi todo lo demás sería vacío! Por eso casi toda la materia es espacio vacío. Si pudieras quitar todo el vacío de los átomos de todos los humanos de la Tierra, la humanidad cabría en un cubo de azúcar.</p></div>
<div class="sim" data-sim="construye-atomo" data-title="Construye un átomo" data-goal="Añade protones, neutrones y electrones para construir átomos neutros de helio, carbono y oxígeno.">
<ul><li>El número de protones decide el elemento: 1 es hidrógeno, 2 helio, 6 carbono, 8 oxígeno.</li><li>Si tiene más electrones que protones, es un ion negativo; si tiene menos, uno positivo.</li></ul>
</div>
</section>

<section>
<h2>La tabla periódica</h2>
<p>Cada tipo de átomo se llama <strong>elemento</strong>. Hay 118 conocidos. En 1869, el ruso Dmitri Mendeléyev los ordenó en una tabla por su masa y sus propiedades, ¡y dejó espacios vacíos para elementos que aún no se habían descubierto! Poco después se encontraron y tenían justo las propiedades que él predijo.</p>
<div class="sim" data-sim="tabla-periodica" data-title="Los primeros 18 elementos" data-goal="Toca los elementos de la tabla para conocerlos. ¡Descubre al menos ocho!">
<ul><li>Cada elemento tiene un símbolo de una o dos letras.</li><li>Los elementos de una misma columna se parecen entre sí.</li></ul>
</div>
<details class="curious"><p>Los 92 elementos naturales se formaron en estrellas y en explosiones estelares: el hidrógeno y casi todo el helio nacieron en el Big Bang, el carbono y el oxígeno en estrellas, el hierro en estrellas grandes, y el oro y el platino probablemente en choques de estrellas de neutrones. El elemento más abundante del universo es el hidrógeno (75 % de la masa normal) y el segundo el helio (24 %).</p></details>
</section>

<section>
<h2>Cómo descubrimos el núcleo</h2>
<div class="story" data-title="Rutherford y la lámina de oro"><p>Al principio se pensaba que el átomo era como un «pudín de pasas»: una masa positiva con electrones incrustados. En 1909, en el laboratorio del neozelandés Ernest Rutherford, dispararon partículas (llamadas alfa) contra una lámina de oro finísima. Casi todas pasaban de largo… ¡pero de vez en cuando una rebotaba hacia atrás! Rutherford dijo que era «como disparar una bala de cañón a una hoja de papel y que rebote». La explicación: el átomo tiene un núcleo diminuto, denso y positivo en el centro, y todo lo demás es vacío. Era 1911.</p></div>
<div class="sim" data-sim="caja-negra" data-title="El experimento de Rutherford" data-goal="Dispara partículas contra un núcleo escondido, observa cómo rebotan y estima dónde está y qué tan grande es.">
<ul><li>Si las partículas casi nunca se desvían, el núcleo es pequeño.</li><li>Dispara muchas y fíjate en la zona por donde no pasa casi ninguna.</li><li>Haz clic en el lugar donde crees que está el núcleo y ajusta su tamaño.</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="La caja negra: descubre lo que no ves" data-time="25 min" data-level="2">
<ul class="mat"><li>📦 Una caja de zapatos con tapa</li><li>🔮 Un objeto que quepa dentro (una pelota pequeña, un cubo de madera, un triángulo de cartón)</li><li>🔵 Canicas o bolitas</li><li>🩹 Cinta pegante y un agujero grande en dos lados opuestos</li></ul>
<ol class="steps"><li>Un compañero pone un objeto escondido en el centro de la caja y la tapa, sin que tú lo veas.</li><li>Haz rodar canicas por la caja desde un lado, por distintos puntos, y observa por dónde salen o si rebotan.</li><li>Dibuja un mapa de dónde salen las canicas y deduce la forma y el tamaño del objeto.</li><li>Abre la caja y compara con tu dibujo.</li></ol>
<p class="predict">¿Podrás saber la forma del objeto sin verlo?</p>
<p class="result">Sí, con suficientes canicas se puede dibujar la forma aproximada: donde las canicas rebotan hay objeto, y por donde pasan hay vacío.</p>
<p class="why">Así descubrió Rutherford el núcleo: no lo vio, pero lanzando partículas y observando cómo rebotaban pudo deducir su existencia, su tamaño y su posición.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="2"><p>¿Qué decide de qué elemento es un átomo?</p><ol><li>El número de electrones</li><li>El número de neutrones</li><li>El número de protones</li></ol><p class="why">El número de protones (número atómico) define el elemento.</p></div>
<div class="q" data-ans="0"><p>El átomo es principalmente…</p><ol><li>Espacio vacío</li><li>Materia compacta</li><li>Agua</li></ol><p class="why">El núcleo es 100 000 veces más pequeño que el átomo: casi todo es vacío.</p></div>
<div class="q" data-ans="1"><p>Un átomo neutro de carbono tiene 6 protones. ¿Cuántos electrones tiene?</p><ol><li>12</li><li>6</li><li>0</li></ol><p class="why">Un átomo neutro tiene tantos electrones como protones.</p></div>
<div class="q" data-ans="1"><p>¿Qué descubrió Rutherford con las partículas alfa y la lámina de oro?</p><ol><li>Que el átomo no existe</li><li>Que el átomo tiene un núcleo diminuto y denso</li><li>Que los átomos son macizos</li></ol><p class="why">Casi todas pasaban y algunas rebotaban: el átomo tiene un núcleo pequeñito y la mayor parte es vacío.</p></div>
</div>
</template>

<!-- 39-nucleo.html -->
<template class="chapter-src" data-id="nucleo" data-num="39" data-world="9" data-title="El núcleo y la radiactividad" data-short="Átomos que se rompen solos, la vida media, el carbono-14 y cómo funciona el Sol: fisión y fusión.">
<p class="lead">El núcleo del átomo es un mundo diminuto lleno de fuerzas gigantescas. Algunos núcleos son inestables y se rompen solos soltando energía: eso es la <strong>radiactividad</strong>. Descubrirla cambió la medicina, la energía y hasta la forma de saber cuántos años tiene una momia.</p>

<div class="learn"><ul>
<li>Algunos núcleos son inestables y se transforman soltando radiación (alfa, beta o gamma).</li>
<li>La vida media es el tiempo en que se desintegra la mitad de los átomos de una muestra.</li>
<li>La radiación se reduce con distancia, tiempo y blindaje.</li>
<li>La fusión (unir núcleos) hace brillar al Sol; la fisión (partirlos) se usa en centrales nucleares.</li>
</ul></div>

<div class="say" data-who="quarki" data-mood="wow"><p>¡Yo soy un átomo estable, pero tengo primos inestables! Se ponen tan inquietos que un día… ¡pum! Se transforman en otro átomo. ¡Los científicos aprendieron a medirlo!</p></div>

<section>
<h2>Átomos que se transforman</h2>
<div class="story" data-title="Becquerel y los Curie"><p>En 1896, el francés Henri Becquerel guardó una sal de uranio sobre una placa fotográfica envuelta en papel negro y, al revelarla, ¡estaba velada! El uranio emitía algo invisible que atravesaba el papel. Marie Curie, que estudió ese fenómeno con su esposo Pierre, lo llamó <strong>radiactividad</strong> y descubrió dos elementos nuevos: el polonio (llamado así por su país natal, Polonia) y el radio. Ganó el Premio Nobel de Física en 1903 y el de Química en 1911.</p></div>
<p>Un núcleo inestable se transforma en otro soltando energía. Hay tres tipos principales de radiación:</p>
<div class="cols3">
<div class="card"><h4>α Alfa</h4><p>Un grupito de 2 protones y 2 neutrones. Es pesado y lo detiene una hoja de papel o la piel.</p></div>
<div class="card"><h4>β Beta</h4><p>Un electrón de alta rapidez. Atraviesa el papel, pero lo detiene una lámina de aluminio.</p></div>
<div class="card"><h4>γ Gamma</h4><p>Luz de muy alta energía. Es la más penetrante: hace falta plomo o concreto grueso.</p></div>
</div>
<div class="fact"><p>La radiactividad es natural y siempre ha existido. Tu cuerpo es un poquito radiactivo (por el potasio-40 que tienes, ¡como el banano!), el suelo y las rocas también, y desde el espacio llegan rayos cósmicos todo el tiempo. Una radiografía dental te da menos radiación que un día de «fondo» natural. Lo importante es la <b>dosis</b>.</p></div>
</section>

<section>
<h2>La vida media</h2>
<p>No se puede saber <em>cuándo</em> se desintegrará un átomo en particular (¡es azar!), pero si hay millones, sí se sabe cuántos lo harán. El tiempo que tarda en desintegrarse <b>la mitad</b> de los átomos se llama <dfn data-def="El tiempo que tarda en desintegrarse la mitad de los átomos radiactivos de una muestra.">vida media</dfn>. Después de una vida media queda la mitad; después de dos, la cuarta parte; después de tres, la octava parte…</p>
<div class="magic" data-name="La vida media"><big>mitad, cuarta, octava, dieciseisava…</big>Cada vida media queda la mitad de lo que había.</div>
<div class="sim" data-sim="decaimiento" data-title="El juego de las monedas que decaen" data-goal="Lanza el «dado cuántico» varias veces y mira cómo se reduce el número de átomos a la mitad en cada vida media.">
<ul><li>Cada átomo tiene 50 % de probabilidad de decaer en cada vida media.</li><li>El azar de cada átomo es impredecible, pero el grupo sigue un patrón.</li></ul>
</div>
<h3>El reloj del carbono-14</h3>
<p>Los seres vivos tienen un poquito de carbono-14, un carbono radiactivo con una vida media de <b>5730 años</b>. Cuando algo muere, deja de incorporar carbono nuevo y el carbono-14 empieza a decaer. Midiendo cuánto queda, ¡se puede calcular hace cuánto murió! Así se fechan huesos, madera, momias y restos de hasta unos 50 000 años de antigüedad.</p>
<div class="sim" data-sim="carbono14" data-title="¿Cuántos años tiene?" data-goal="Mira cuánto carbono-14 queda en el objeto y calcula su edad. ¡Acierta con un margen del 15 %!">
<ul><li>Si queda la mitad: 5730 años. Un cuarto: 11 460 años. Un octavo: 17 190 años.</li></ul>
</div>
</section>

<section>
<h2>Protegerse de la radiación</h2>
<p>La radiación fuerte puede dañar las células. Los que trabajan con ella se protegen con tres reglas: <b>tiempo</b> (estar el menor tiempo posible), <b>distancia</b> (alejarse: la radiación disminuye con el cuadrado de la distancia) y <b>blindaje</b> (poner un material entre medio, como plomo o concreto). Un contador Geiger es un aparato que «clickea» cuando detecta radiación.</p>
<div class="sim" data-sim="geiger" data-title="El contador Geiger" data-goal="Para cada fuente (alfa, beta y gamma), escoge el blindaje y la distancia que reduzcan los clics a menos de 5 por segundo.">
<ul><li>Alfa: ¡el papel basta!</li><li>Beta: necesitas aluminio.</li><li>Gamma: plomo y distancia.</li><li>(En la realidad, las partículas alfa solo recorren unos centímetros en el aire; aquí lo simplificamos.)</li></ul>
</div>
</section>

<section>
<h2>Fusión y fisión</h2>
<p>Los núcleos pueden liberar energía de dos maneras. En la <b>fisión</b>, un núcleo muy pesado (como el uranio) se parte en dos más livianos y suelta energía. Lise Meitner y Otto Frisch la explicaron en 1939. Se usa en las centrales nucleares, que producen cerca del 10 % de la electricidad del mundo sin emitir gases de efecto invernadero (pero producen residuos radiactivos que hay que guardar muchos años).</p>
<p>En la <b>fusión</b>, dos núcleos muy livianos (como el hidrógeno) se unen para formar uno más pesado (helio) y sueltan mucha más energía. Es lo que ocurre en el Sol: ¡cada segundo convierte 600 millones de toneladas de hidrógeno en helio! Pero para que los núcleos se unan hay que vencer su repulsión eléctrica, y eso exige temperaturas de millones de grados.</p>
<div class="fact"><p>La famosa fórmula de Einstein, <b>E = m c²</b>, dice que la masa y la energía son lo mismo. En la fusión, el helio que se forma pesa un poquito menos que los cuatro hidrógenos que lo originaron: esa pequeña masa «perdida» se convierte en la energía enorme del Sol. Con un gramo de masa convertida en energía se podría alumbrar una ciudad.</p></div>
<div class="sim" data-sim="fusion" data-title="El motor del Sol" data-goal="Sube la temperatura del núcleo hasta unos 15 millones de grados y mira cómo se funden los protones.">
<ul><li>A baja temperatura, los protones se repelen y rebotan.</li><li>A muy alta temperatura, chocan tan fuerte que se funden y sueltan energía.</li></ul>
</div>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Monedas que «decaen»" data-time="20 min" data-level="1">
<ul class="mat"><li>🪙 100 monedas (o 100 granos de arroz con una cara marcada)</li><li>📝 Papel y lápiz</li></ul>
<ol class="steps"><li>Lanza las 100 monedas. Las que salgan «cara» ya «decayeron»: aparta esas y anota cuántas quedan.</li><li>Recoge las que no decayeron y vuelve a lanzarlas. Repite hasta que queden muy pocas.</li><li>Dibuja una gráfica con el número de lanzamiento y las monedas que quedan.</li></ol>
<p class="predict">¿Cuántas monedas quedarán después del tercer lanzamiento?</p>
<p class="result">Después de 1 lanzamiento quedan unas 50, después de 2 unas 25, después de 3 unas 12. La gráfica es una curva que baja cada vez más despacio.</p>
<p class="why">Cada lanzamiento es una «vida media»: cada moneda tiene 50 % de probabilidad de salir cara. Con pocas monedas hay más azar y la gráfica es irregular; con muchas, sigue casi exacto la regla de la mitad.</p>
</div>
<div class="exp" data-title="La regla del cuadrado de la distancia" data-time="15 min" data-level="2">
<ul class="mat"><li>🔦 Una linterna</li><li>📄 Una hoja de papel cuadriculado</li><li>📏 Una regla</li><li>🌑 Un cuarto oscuro</li></ul>
<ol class="steps"><li>Pega la hoja en la pared. Pon la linterna a 20 cm de la hoja y dibuja el contorno del círculo de luz.</li><li>Aléjate a 40 cm y vuelve a dibujar el círculo. Después, a 60 cm.</li><li>Cuenta los cuadritos que cubre cada círculo de luz y compara.</li></ol>
<p class="predict">Al duplicar la distancia, ¿cuántas veces más grande será el área iluminada?</p>
<p class="result">A doble distancia, el área es cuatro veces más grande; a triple distancia, nueve veces. La misma luz se reparte en más área, así que cada cuadrito recibe 4 veces menos.</p>
<p class="why">Cualquier radiación que sale de una fuente en todas direcciones se debilita con el cuadrado de la distancia. Por eso alejarse es la mejor protección.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="1"><p>La vida media de una sustancia es de 10 días. Empiezas con 80 g. ¿Cuánto queda después de 20 días?</p><ol><li>40 g</li><li>20 g</li><li>0 g</li></ol><p class="why">20 días son 2 vidas medias: 80 → 40 → 20 g.</p></div>
<div class="q" data-ans="2"><p>¿Qué radiación detiene una hoja de papel?</p><ol><li>La gamma</li><li>La beta</li><li>La alfa</li></ol><p class="why">Las partículas alfa son grandes y pesadas, y el papel las detiene.</p></div>
<div class="q" data-ans="0"><p>En el Sol, ¿qué ocurre?</p><ol><li>Fusión: el hidrógeno se une para formar helio</li><li>Fisión del uranio</li><li>Combustión del carbón</li></ol><p class="why">El Sol funde hidrógeno en helio, y eso libera la energía que nos da luz y calor.</p></div>
<div class="q" data-ans="1"><p>Un hueso tiene la cuarta parte del carbono-14 que tenía un hueso vivo. ¿Qué edad tiene (vida media de 5730 años)?</p><ol><li>5730 años</li><li>11 460 años</li><li>22 920 años</li></ol><p class="why">Un cuarto son dos vidas medias: 2 × 5730 = 11 460 años.</p></div>
</div>
</template>

<!-- 40-cuantico.html -->
<template class="chapter-src" data-id="cuantico" data-num="40" data-world="9" data-title="El mundo cuántico" data-short="Partículas que también son ondas, la luz en paquetitos, átomos con escalones y lo rarísimo de lo muy pequeño.">
<p class="lead">En el mundo de lo diminuto —átomos, electrones, luz— las reglas son muy distintas a las de nuestra vida diaria. Una pelota hace lo que se espera; un electrón hace cosas que parecen magia. A esa física se le llama <strong>física cuántica</strong>, y gracias a ella existen los celulares, los láseres y los computadores.</p>

<div class="learn"><ul>
<li>La energía viene en paquetitos llamados cuantos; la luz está hecha de fotones.</li>
<li>Los electrones en un átomo solo pueden tener ciertos niveles de energía, como los escalones de una escalera.</li>
<li>Las partículas diminutas se comportan a veces como ondas y a veces como bolitas.</li>
<li>No se puede conocer exactamente a la vez dónde está un electrón y a qué rapidez va.</li>
</ul></div>

<div class="say" data-who="quarki" data-mood="wow"><p>¡Atención! Aquí mis primos los electrones se portan de forma muy rara. Los científicos tardaron años en aceptarlo, y todavía hoy ¡siguen sorprendiéndose! Mantén la mente abierta.</p></div>

<section>
<h2>La luz viene en paquetitos</h2>
<p>En 1900, el alemán Max Planck descubrió que, para explicar cómo brillan las cosas calientes, la energía tenía que soltarse en <b>paquetitos</b>, no de manera continua. Cinco años después Albert Einstein usó esa idea para explicar algo curioso: el <dfn data-def="Cuando la luz arranca electrones de un metal. Solo funciona si cada fotón tiene suficiente energía.">efecto fotoeléctrico</dfn>. Si iluminas un metal con luz azul o ultravioleta, saltan electrones del metal. Pero con luz roja, por muy intensa que sea, ¡no sale ni uno! Einstein lo explicó: la luz está hecha de partículas llamadas <strong>fotones</strong>, y cada fotón tiene una energía que depende de su color (de su frecuencia). Un fotón rojo no tiene energía suficiente para sacar un electrón; uno ultravioleta sí. Por esto ganó el Premio Nobel de 1921.</p>
<div class="magic" data-name="La energía de un fotón"><big>mayor frecuencia = más energía</big>Fotón azul &gt; fotón rojo · ultravioleta &gt; azul</div>
<div class="sim" data-sim="fotoelectrico" data-title="El efecto fotoeléctrico" data-goal="Ilumina el metal: comprueba que mucha luz roja no saca electrones, pero un poco de luz ultravioleta sí.">
<ul><li>Cambia el color (la longitud de onda) y la intensidad de la luz.</li><li>La intensidad da más fotones; el color da la energía de cada uno.</li></ul>
</div>
<div class="fact"><p>Los paneles solares y las cámaras de los celulares funcionan por el efecto fotoeléctrico: la luz saca electrones de un material (el silicio) y se produce corriente eléctrica. ¡Una idea de Einstein de 1905 está en tu bolsillo!</p></div>
</section>

<section>
<h2>Los átomos tienen escalones de energía</h2>
<p>En 1913, el danés Niels Bohr propuso que los electrones de un átomo solo pueden estar en ciertos «pisos» de energía, como los pisos de un edificio: no puedes quedarte entre dos pisos. Cuando un electrón baja de un piso alto a uno más bajo, suelta un <strong>fotón</strong> con justo la energía de la diferencia. Como cada elemento tiene sus propios pisos, cada uno emite colores (líneas) característicos: ¡una huella digital de luz! Así sabemos de qué están hechas las estrellas.</p>
<div class="sim" data-sim="niveles-hidrogeno" data-title="Los saltos del electrón en el hidrógeno" data-goal="Haz que el electrón baje de nivel y produzca luz roja, luz azul-verdosa y luz violeta.">
<ul><li>Cuando baja al nivel 2 (serie de Balmer) la luz es visible.</li><li>Cuando baja al nivel 1, la luz es ultravioleta (invisible).</li><li>Mientras más largo el salto, más energía y color más violeta.</li></ul>
</div>
<details class="curious"><p>Para el hidrógeno, la energía de cada nivel es E<sub>n</sub> = −13,6 eV / n². Un salto de n = 3 a n = 2 libera 1,89 eV: luz roja de 656 nm, la línea «H-alfa». Las lámparas de neón, las de sodio de las calles y los fuegos artificiales brillan con los colores de sus propios átomos. ¡Un espectroscopio los separa y sirve para identificar el elemento!</p></details>
</section>

<section>
<h2>¿Onda o partícula?</h2>
<p>La luz parece una onda (se difracta, hace interferencia) pero también se comporta como partículas (fotones). Y en 1924, Louis de Broglie propuso que <em>las partículas también son ondas</em>. Pocos años después, se comprobó con electrones. El experimento más famoso es el de la <strong>doble rendija</strong>: si disparas electrones, uno por uno, contra una pared con dos rendijas, cada uno llega a la pantalla en un punto, como una bolita. Pero al acumular muchos, ¡se forma un patrón de franjas de interferencia, como si cada electrón hubiera pasado por las dos rendijas a la vez!</p>
<p>Y lo más raro: si intentas <em>observar</em> por cuál rendija pasa cada electrón, el patrón de franjas desaparece y quedan solo dos montoncitos, como si fueran bolitas.</p>
<div class="sim" data-sim="doble-rendija" data-title="Electrones y dos rendijas" data-goal="Dispara electrones uno por uno, mira cómo se forma un patrón de franjas y luego mira qué pasa si observas por cuál rendija pasan.">
<ul><li>Cada punto es un electrón que llegó a la pantalla.</li><li>Con muchos electrones, aparecen franjas: ¡un patrón de onda!</li><li>Activa «observar» y el patrón de franjas desaparece.</li></ul>
</div>
<div class="story" data-title="La incertidumbre de Heisenberg"><p>En 1927, Werner Heisenberg descubrió que hay un límite en la naturaleza: <b>no se puede conocer con exactitud, al mismo tiempo, la posición y la rapidez de una partícula pequeña</b>. No es un problema de los aparatos: es así el mundo. Mientras con más precisión sabes dónde está un electrón, menos sabes a qué rapidez va, y al revés. Se llama el principio de incertidumbre.</p></div>
<div class="story" data-title="El gato de Schrödinger"><p>Erwin Schrödinger imaginó en 1935 un experimento <em>pensado</em> (no real): un gato en una caja con un mecanismo que depende de un átomo que puede decaer o no. Según la física cuántica, mientras no se mide, el átomo está en una «mezcla» de las dos posibilidades. Schrödinger quería mostrar lo extraño que sonaba esto aplicado a algo grande como un gato. ¡Ningún gato real fue maltratado! El experimento sirve para pensar sobre cómo conectamos el mundo cuántico con el mundo de todos los días.</p></div>
</section>

<section>
<h2>La cuántica en tu vida</h2>
<p>La física cuántica no es solo rara: es útil. Gracias a ella existen los <b>transistores</b> (los chips de los celulares), los <b>LED</b> y las pantallas, los <b>láseres</b> (lectores de códigos, cirugía, internet por fibra), los <b>paneles solares</b>, las <b>resonancias magnéticas</b> de los hospitales y los relojes atómicos del GPS. Y se están construyendo <b>computadores cuánticos</b> que podrían resolver problemas imposibles para los de hoy.</p>
</section>

<section>
<h2>¡A experimentar!</h2>
<div class="exp" data-title="Un espectroscopio con un CD" data-time="40 min" data-level="2" data-adult="1">
<ul class="mat"><li>📦 Una caja pequeña de cartón (o un tubo)</li><li>💿 Un trozo de CD o DVD sin etiqueta</li><li>✂️ Tijeras o bisturí (¡adulto!)</li><li>🩹 Cinta negra</li><li>🔦 Fuentes de luz: bombillo incandescente, bombillo LED, tubo fluorescente (¡nunca el Sol directo!)</li></ul>
<ol class="steps"><li>Un adulto hace una rendija muy delgada en un extremo de la caja (con dos hojas de afeitar o cinta negra).</li><li>En el otro extremo, haz una ventanita para el ojo y pega adentro el trozo de CD inclinado unos 45°.</li><li>Apunta la rendija hacia la luz de una lámpara y mira por la ventana: verás los colores separados.</li><li>Compara los espectros de un bombillo incandescente, un LED y un fluorescente.</li></ol>
<p class="warn">No apuntes jamás el espectroscopio directamente hacia el Sol.</p>
<p class="predict">¿Todas las luces mostrarán un arcoíris continuo?</p>
<p class="result">El bombillo incandescente da un arcoíris continuo. El tubo fluorescente muestra unas pocas líneas brillantes (verde, azul, rojo). El LED muestra picos más anchos.</p>
<p class="why">Cada material emite colores propios según sus «escalones» de energía. El fluorescente tiene gas de mercurio, con líneas definidas. Así los científicos identifican de qué están hechas las estrellas.</p>
</div>
</section>

<div class="quiz">
<div class="q" data-ans="2"><p>¿Qué es un fotón?</p><ol><li>Un electrón</li><li>Un átomo</li><li>Una partícula (paquete) de luz</li></ol><p class="why">La luz está hecha de fotones, cada uno con una energía que depende de su color.</p></div>
