      <!-- Notebook 1 -->
      <div class="code-block">
        <div class="code-header">
          <span>Notebook 1 · Filtrado Espacial &amp; Cancelación de Ruido (OpenCV)</span>
          <button type="button" class="btn-code-copy" onclick="copyCode(this)">Copiar</button>
        </div>
        <code><span class="sx-com"># ==========================================</span>
<span class="sx-com"># Práctica 1: Filtrado de Ruido Impulsivo y Gaussiano</span>
<span class="sx-com"># Docente: Ing. Luis Fernando Barajas Ardila</span>
<span class="sx-com"># ==========================================</span>
<span class="sx-kw">import</span> cv2
<span class="sx-kw">import</span> numpy <span class="sx-kw">as</span> np
<span class="sx-kw">import</span> matplotlib.pyplot <span class="sx-kw">as</span> plt

<span class="sx-com"># 1. Cargar imagen en escala de grises</span>
img = cv2.imread(<span class="sx-str">'muestra.jpg'</span>, cv2.IMREAD_GRAYSCALE)

<span class="sx-com"># 2. Inyectar ruido sal y pimienta artificial</span>
ruido_sp = img.copy()
prob = <span class="sx-num">0.05</span>
mask_sal = np.random.rand(*img.shape) < prob / <span class="sx-num">2</span>
mask_pim = np.random.rand(*img.shape) < prob / <span class="sx-num">2</span>
ruido_sp[mask_sal] = <span class="sx-num">255</span>
ruido_sp[mask_pim] = <span class="sx-num">0</span>

<span class="sx-com"># 3. Aplicar Filtro de Mediana (óptimo contra sal y pimienta)</span>
filtrada_mediana = cv2.medianBlur(ruido_sp, ksize=<span class="sx-num">5</span>)

<span class="sx-com"># 4. Comparar con Filtro de Media (desenfoca los bordes)</span>
filtrada_media = cv2.blur(ruido_sp, ksize=(<span class="sx-num">5</span>, <span class="sx-num">5</span>))

<span class="sx-com"># 5. Visualizar resultados</span>
fig, axes = plt.subplots(<span class="sx-num">1</span>, <span class="sx-num">3</span>, figsize=(<span class="sx-num">14</span>, <span class="sx-num">4</span>))
axes[<span class="sx-num">0</span>].imshow(ruido_sp, cmap=<span class="sx-str">'gray'</span>); axes[<span class="sx-num">0</span>].set_title(<span class="sx-str">'Ruido Sal y Pimienta'</span>)
axes[<span class="sx-num">1</span>].imshow(filtrada_media, cmap=<span class="sx-str">'gray'</span>); axes[<span class="sx-num">1</span>].set_title(<span class="sx-str">'Filtro Media (Desenfocado)'</span>)
axes[<span class="sx-num">2</span>].imshow(filtrada_mediana, cmap=<span class="sx-str">'gray'</span>); axes[<span class="sx-num">2</span>].set_title(<span class="sx-str">'Filtro Mediana (Bordes Preservados)'</span>)
plt.show()</code>

      <!-- Notebook 2 -->
      <div class="code-block">
        <div class="code-header">
          <span>Notebook 2 · Segmentación por Otsu &amp; Evaluación con Ground Truth (scikit-image)</span>
          <button type="button" class="btn-code-copy" onclick="copyCode(this)">Copiar</button>
        </div>
        <code><span class="sx-kw">from</span> skimage.filters <span class="sx-kw">import</span> threshold_otsu
<span class="sx-kw">from</span> skimage.metrics <span class="sx-kw">import</span> jaccard_score

<span class="sx-com"># 1. Calcular umbral óptimo global con Otsu</span>
thresh = threshold_otsu(img)
mascara_predicha = (img >= thresh).astype(np.uint8)

<span class="sx-com"># 2. Cargar máscara Ground Truth de referencia</span>
ground_truth = cv2.imread(<span class="sx-str">'ground_truth.png'</span>, cv2.IMREAD_GRAYSCALE) > <span class="sx-num">128</span>

<span class="sx-com"># 3. Calcular Coeficiente Dice e Índice de Jaccard (IoU)</span>
interseccion = np.logical_and(mascara_predicha, ground_truth).sum()
total_pixeles = mascara_predicha.sum() + ground_truth.sum()
dice = (<span class="sx-num">2.0</span> * interseccion) / total_pixeles
iou = jaccard_score(ground_truth.ravel(), mascara_predicha.ravel())

print(<span class="sx-str">f"Umbral de Otsu calculado: {thresh}"</span>)
print(<span class="sx-str">f"Coeficiente Dice: {dice:.4f}"</span>)
print(<span class="sx-str">f"Índice Jaccard (IoU): {iou:.4f}"</span>)</code>
      </div>

      <!-- Notebook 3 -->
      <div class="code-block">
        <div class="code-header">
          <span>Notebook 3 · Textura Haralick GLCM &amp; Local Binary Patterns (LBP)</span>
          <button type="button" class="btn-code-copy" onclick="copyCode(this)">Copiar</button>
        </div>
        <code><span class="sx-kw">from</span> skimage.feature <span class="sx-kw">import</span> graycomatrix, graycoprops, local_binary_pattern

<span class="sx-com"># 1. Matriz de Coocurrencia de Haralick (GLCM) a 4 ángulos</span>
distancias = [<span class="sx-num">1</span>, <span class="sx-num">3</span>]
angulos = [<span class="sx-num">0</span>, np.pi/<span class="sx-num">4</span>, np.pi/<span class="sx-num">2</span>, <span class="sx-num">3</span>*np.pi/<span class="sx-num">4</span>]
glcm = graycomatrix(img, distances=distancias, angles=angulos, levels=<span class="sx-num">256</span>, symmetric=<span class="sx-kw">True</span>, normed=<span class="sx-kw">True</span>)

<span class="sx-com"># 2. Descriptores de Haralick</span>
contraste = graycoprops(glcm, <span class="sx-str">'contrast'</span>).mean()
homogeneidad = graycoprops(glcm, <span class="sx-str">'homogeneity'</span>).mean()
energia = graycoprops(glcm, <span class="sx-str">'energy'</span>).mean()

<span class="sx-com"># 3. Patrones Binarios Locales (LBP Circular)</span>
radius = <span class="sx-num">2</span>
n_points = <span class="sx-num">8</span> * radius
lbp = local_binary_pattern(img, n_points, radius, method=<span class="sx-str">'uniform'</span>)

print(<span class="sx-str">f"Haralick Contraste Promedio: {contraste:.3f}"</span>)
print(<span class="sx-str">f"Haralick Homogeneidad Promedio: {homogeneidad:.3f}"</span>)
print(<span class="sx-str">f"Haralick Energía (ASM): {energia:.4f}"</span>)</code>
