    <section>
      <h2>Ruta de Aprendizaje y Organización de las Clases</h2>
      <div class="box note">
        <div class="box-head">Organización de las 7 Clases Magistrales</div>
        <ul style="margin:0; padding-left:1.2rem;">
          <li><strong>Clase 1 (Temas 1 &amp; 2):</strong> Introducción a los sistemas de percepción, visión humana, sistema auditivo y arquitectura de percepción por computador.</li>
          <li><strong>Clase 2 (Temas 3, 4 &amp; 5):</strong> Captura y digitalización, teorema de Nyquist, fuentes de ruido, entropía y cancelación de anomalías.</li>
          <li><strong>Clase 3 (Temas 6 &amp; 7):</strong> Operaciones elementales, histogramas, convolución 2D, filtrado espacial y algoritmo detector de bordes de Canny.</li>
          <li><strong>Clase 4 (Temas 8 &amp; 9):</strong> Morfología matemática (erosión, dilatación, apertura, clausura, top-hat) y análisis de frecuencia 2D con Fourier (DFT).</li>
          <li><strong>Clase 5 (Temas 10 &amp; 11):</strong> Segmentación de imágenes (Otsu, seeded region growing, watershed), momentos estadísticos y momentos invariantes de Hu.</li>
          <li><strong>Clase 6 (Temas 12 &amp; 13):</strong> Textura en imágenes (matriz de coocurrencia Haralick, LBP), bancos de filtros de Gabor y puntos clave multiescala SIFT.</li>
          <li><strong>Clase 7 (Temas 14 &amp; 15):</strong> Toma de decisiones (k-NN, SVM, redes neuronales, métricas ROC/AUC), biometría y vehículos autónomos.</li>
        </ul>
      </div>
