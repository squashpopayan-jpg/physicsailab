<p class="lead">Una de las promesas más llamativas de la PNL es curar una fobia o un trauma en una sola sesión. Suena demasiado bueno para ser verdad, y sin embargo existe un tratamiento que sí lo logra con frecuencia: la exposición. Este capítulo compara la versión de la PNL con la que tiene evidencia, revisa con cuidado un protocolo derivado de la PNL que se está estudiando en serio (RTM) y termina con una guía práctica para elegir.</p>

<section>
<h2>La «cura rápida de fobias» de la PNL</h2>
<p>La técnica, conocida también como disociación visual-cinestésica, pide a la persona que se imagine sentada en un cine, viéndose a sí misma en la pantalla revivir la situación temida en blanco y negro, desde lejos, y luego que «rebobine» la película a toda velocidad y en color. La idea es separar el recuerdo de la emoción. Se promete que basta una sesión.</p>
<div class="box evid"><p><span class="nivel n1">sin estudios controlados</span>Las publicaciones sobre la técnica en su forma original son casi todas casos clínicos o estudios sin grupo de control. No hay ensayos aleatorizados independientes que muestren que funciona mejor que un placebo o que la exposición.</p></div>
<p>Eso no significa que nunca ayude. La técnica obliga a evocar repetidamente la situación temida en un marco de seguridad, lo que es una forma de exposición imaginaria. Es plausible que, cuando funciona, funcione por eso.</p>
</section>

<section>
<h2>La exposición: lo que sí cura las fobias</h2>
<p>La terapia de exposición consiste en enfrentarse a lo temido de forma gradual, repetida y sin escapar, hasta que la persona aprende que lo que temía no ocurre o que puede tolerarlo. Es el tratamiento con mejor evidencia para las fobias específicas. Un metaanálisis de 33 ensayos aleatorizados encontró que la exposición supera con efectos grandes a no recibir tratamiento, y también supera al placebo y a otras psicoterapias (Wolitzky-Taylor y otros, 2008). El psicólogo sueco Lars-Göran Öst desarrolló una versión de una sola sesión de hasta tres horas, con exposición intensa y guiada, que en muchos ensayos produce mejoras clínicas en la mayoría de los pacientes con fobias a animales, inyecciones o alturas (Zlomke y Davis, 2008). En un ensayo reciente con niños, la sesión única no fue inferior a la terapia cognitivo-conductual de varias sesiones.</p>
<div class="box evid"><p><span class="nivel n4">sólida</span>La exposición, en vivo o imaginada, es el tratamiento de primera elección para las fobias específicas y un componente central de los tratamientos con mejor evidencia para el pánico, el trastorno obsesivo-compulsivo y el estrés postraumático.</p></div>
<p>¿Por qué funciona? La explicación clásica era la <i>habituación</i>: el miedo baja con la repetición. La visión actual, el <span class="term">aprendizaje inhibitorio</span> (Craske y otros, 2014), propone que el recuerdo de miedo no se borra: se aprende un recuerdo nuevo, «aquí no pasa nada», que compite con el viejo. Eso explica tres fenómenos bien documentados:</p>
<ul>
<li><b>Retorno del miedo con el tiempo:</b> si el nuevo aprendizaje no se practica, el viejo puede volver a dominar.</li>
<li><b>Renovación por contexto:</b> lo aprendido en el consultorio se expresa peor en otro lugar (Bouton, 2004).</li>
<li><b>Las conductas de seguridad estorban:</b> escapar, distraerse o depender de un objeto «protector» impide comprobar que no pasa nada.</li>
</ul>
<div class="sim" data-sim="exposicion" data-title="Exposición, conductas de seguridad y retorno del miedo (modelo de aprendizaje inhibitorio)"></div>
<div class="sim-guide"><ul>
<li>Modelo didáctico: cada sesión de exposición sin escape refuerza un aprendizaje de seguridad que inhibe el miedo; ese aprendizaje se generaliza mejor si se practica en varios contextos y se debilita con el tiempo si no se repite.</li>
<li>Active el escape cuando el miedo es alto: la persona se va antes de comprobar que no pasa nada y casi no aprende.</li>
<li>Compare practicar siempre en el consultorio con practicar en varios lugares: cambia mucho el miedo en una situación nueva.</li>
<li>Agregue sesiones de refuerzo: el retorno del miedo a los tres meses disminuye.</li>
</ul></div>
<div class="box safe"><p>La exposición se hace de forma gradual y planificada, idealmente con un profesional, y nunca forzando a alguien. En traumas graves, en fobias con riesgo médico (por ejemplo, desmayo ante la sangre) o si hay otros trastornos, la guía de un psicólogo clínico es necesaria.</p></div>
</section>

<section>
<h2>El protocolo RTM: un derivado de la PNL que se está estudiando en serio</h2>
<p>La Reconsolidación de Recuerdos Traumáticos (RTM, por sus siglas en inglés) es una versión estructurada de la técnica del cine de la PNL, aplicada al estrés postraumático y presentada como una forma de aprovechar la reconsolidación (capítulo 5). A diferencia de la mayoría de las técnicas de la PNL, se ha estudiado en ensayos aleatorizados:</p>
<ul>
<li>En un ensayo con 74 veteranos varones comparado con una lista de espera, 71 % de los tratados dejó de cumplir criterios de estrés postraumático (Gray, Budden-Potts y Bourke, 2019). Los autores son los desarrolladores del protocolo, y el control era una lista de espera, que no controla expectativa ni atención.</li>
<li>En un ensayo de 2026 con 94 militares activos o retirados, comparado con la exposición prolongada, un tratamiento de primera línea, ambos grupos mejoraron sin diferencias en la medida principal; dejaron de cumplir criterios 58 % con RTM y 52 % con exposición, una diferencia no significativa. RTM produjo respuestas más tempranas y menos abandonos, aunque esa diferencia tampoco fue significativa (Roy y otros, 2026). El investigador principal es independiente, pero uno de los desarrolladores fue coautor.</li>
</ul>
<div class="box evid"><p><span class="nivel n2">preliminar y prometedor</span>RTM tiene resultados alentadores, pero la evidencia viene sobre todo del grupo que lo desarrolló, con muestras modestas, y la comparación más rigurosa no encontró ventajas sobre el tratamiento estándar. Una revisión del Departamento de Defensa de Estados Unidos concluyó que se necesita más investigación antes de recomendarlo como primera línea. Que el protocolo «funcione por reconsolidación» tampoco está demostrado: puede funcionar por exposición imaginaria.</p></div>
</section>

<section>
<h2>EMDR: el caso de los movimientos oculares</h2>
<p>La desensibilización y reprocesamiento por movimientos oculares (EMDR) combina recordar el trauma con seguir con la vista un estímulo que se mueve de lado a lado. Su eficacia para el estrés postraumático está bien respaldada, y la Organización Mundial de la Salud la recomienda. Lo que se debatió durante años fue si los movimientos oculares aportan algo más allá de la exposición. Un metaanálisis encontró que sí aportan un efecto adicional moderado en los ensayos clínicos (d = 0,41) y grande en los estudios de laboratorio (d = 0,74), sobre todo reduciendo la viveza de los recuerdos (Lee y Cuijpers, 2013). La explicación más aceptada es que una tarea que ocupa la memoria de trabajo mientras se recuerda hace el recuerdo menos vívido.</p>
<div class="box evid"><p><span class="nivel n4">sólida</span>EMDR como tratamiento del estrés postraumático. <span class="nivel n3">moderada</span>El aporte específico de los movimientos oculares.</p></div>
</section>

<section>
<h2>Swish, submodalidades y línea del tiempo</h2>
<p>El patrón <i>swish</i> pide imaginar la señal de una conducta indeseada y reemplazarla rápidamente por una imagen de «uno mismo ideal»; las submodalidades consisten en cambiar el brillo, el tamaño o la distancia de las imágenes mentales; la terapia de la línea del tiempo reubica recuerdos en una línea imaginaria. Para ninguna de las tres hay ensayos controlados publicados en revistas revisadas por pares que demuestren su eficacia.</p>
<div class="box evid"><p><span class="nivel n1">sin probar</span>Swish, submodalidades y línea del tiempo como técnicas terapéuticas.</p></div>
</section>

<section>
<h2>Cómo elegir un tratamiento</h2>
<div class="tablewrap"><table>
<thead><tr><th>Problema</th><th>Primera elección con evidencia</th></tr></thead>
<tbody>
<tr><td>Fobia específica</td><td>Exposición (incluida la sesión única de Öst)</td></tr>
<tr><td>Trastorno de pánico</td><td>Terapia cognitivo-conductual con exposición a las sensaciones</td></tr>
<tr><td>Estrés postraumático</td><td>Terapias centradas en el trauma: exposición prolongada, terapia de procesamiento cognitivo, EMDR</td></tr>
<tr><td>Ansiedad social</td><td>Terapia cognitiva para la ansiedad social, terapia cognitivo-conductual</td></tr>
<tr><td>Depresión</td><td>Terapia cognitivo-conductual, activación conductual, antidepresivos según la gravedad (capítulo 30)</td></tr>
</tbody></table></div>
<div class="box do"><ul>
<li>Antes de iniciar una terapia, pregunte: «¿qué ensayos controlados respaldan este método para mi problema?». Un buen profesional sabe responder.</li>
<li>Desconfíe de quien garantiza resultados en una sesión para cualquier problema, cobra paquetes por adelantado o le pide que suspenda un tratamiento médico.</li>
</ul></div>
</section>

<section>
<h2>Resumen, problemas y autoevaluación</h2>
<div class="box keys"><ul>
<li>La cura rápida de fobias de la PNL no tiene ensayos controlados; cuando ayuda, probablemente es por la exposición imaginaria que contiene.</li>
<li>La exposición es el tratamiento con mejor evidencia para las fobias, a veces eficaz en una sola sesión intensa.</li>
<li>Según el aprendizaje inhibitorio, la exposición crea un recuerdo nuevo de seguridad: las conductas de seguridad lo impiden y el contexto y el tiempo pueden hacer volver el miedo.</li>
<li>RTM, derivado de la PNL, es preliminar y prometedor; la comparación más rigurosa no mostró ventajas sobre la exposición prolongada.</li>
<li>EMDR es eficaz para el estrés postraumático; swish, submodalidades y línea del tiempo no están probadas.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Por qué escapar de la situación temida en el momento de máximo miedo mantiene la fobia?
<details><summary>Respuesta</summary><p>Porque la persona no comprueba que lo temido no ocurre (no hay error de predicción negativo que aprender) y además el alivio del escape refuerza la conducta de evitar.</p></details></li>
<li><span class="lvl">Intermedio</span>Un ensayo compara una terapia nueva con una lista de espera y encuentra un efecto grande. ¿Qué falta para recomendarla como primera línea?
<details><summary>Respuesta</summary><p>Comparaciones con un control que iguale la expectativa y con el tratamiento estándar, replicación por grupos independientes, seguimiento a largo plazo y medidas ciegas.</p></details></li>
<li><span class="lvl">Intermedio</span>Con base en el aprendizaje inhibitorio, proponga dos formas de reducir el retorno del miedo después de una exposición exitosa.
<details><summary>Respuesta</summary><p>Practicar la exposición en contextos variados (casa, calle, solo, acompañado) y hacer sesiones de refuerzo espaciadas en el tiempo; también retirar las conductas de seguridad.</p></details></li>
</ol>
