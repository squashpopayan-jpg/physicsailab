<p class="lead">El curso empezó con una promesa: el cerebro cambia con la experiencia, y la evidencia permite saber qué experiencias lo cambian en la dirección que uno quiere. Este capítulo convierte esa promesa en un plan concreto, medible y revisable. No hay técnica secreta: hay principios, dosis razonables, medición y paciencia.</p>

<section>
<h2>Siete principios</h2>
<ol>
<li><b>Lo que se repite se refuerza.</b> La plasticidad depende del uso (capítulos 4, 6 y 27). Lo que haga todos los días pesa más que lo que haga con mucha intensidad una vez.</li>
<li><b>Las señales mandan.</b> Los hábitos se atan a contextos; diseñe el entorno para que la conducta deseada sea la más fácil (capítulos 15 y 16).</li>
<li><b>Lo difícil durante la práctica suele durar más.</b> Práctica espaciada, mezclada y en varios contextos (capítulos 5, 19 y 30).</li>
<li><b>Dosis moderadas y progresivas, con descanso.</b> En el entrenamiento, en el déficit calórico y en la exposición (capítulos 21, 23 y 30).</li>
<li><b>El cuerpo se defiende.</b> El gasto baja y el apetito sube cuando se pierde peso; planifique la meseta y el mantenimiento (capítulos 23 y 26).</li>
<li><b>Mida y mire la tendencia.</b> Un dato aislado engaña; la tendencia de varias semanas no (capítulos 1 y 18).</li>
<li><b>Desconfíe de lo milagroso.</b> Si algo promete mucho, rápido y sin esfuerzo, busque el ensayo controlado (capítulos 1, 9 y 14).</li>
</ol>
</section>

<section>
<h2>Construya su plan</h2>
<p>Elija su objetivo principal y escriba sus datos. El constructor estima su gasto de mantenimiento con la ecuación de Mifflin-St Jeor y su nivel de actividad, proyecta la pérdida con el modelo de Hall (capítulo 23), calcula la proteína y le propone hábitos iniciales. Con un clic, los hábitos que elija aparecen en «Mi progreso», donde podrá marcarlos cada día y ver su curva de automaticidad.</p>

<section>
<h2>Las primeras 12 semanas</h2>
<div class="tablewrap"><table>
<thead><tr><th>Semanas</th><th>Qué hacer</th><th>Qué medir en «Mi progreso»</th></tr></thead>
<tbody>
<tr><td>1–2</td><td>Línea de base: vivir como siempre, pero registrando. Elija dos hábitos y escriba su plan si-entonces.</td><td>Peso diario (o 3–4 veces por semana), sueño, sesiones con minutos y RPE</td></tr>
<tr><td>3–4</td><td>Empiece los hábitos. Si busca perder grasa, aplique el déficit del constructor. Fuerza dos veces por semana.</td><td>Marcas de hábito; tendencia del peso (filtro de Kalman)</td></tr>
<tr><td>5–8</td><td>Progrese de a poco: más carga o una sesión más, nunca todo a la vez. Añada un tercer hábito solo si los dos primeros ya salen casi solos.</td><td>Índice de automaticidad (SRBAI) semanal; carga y monotonía</td></tr>
<tr><td>9</td><td>Semana de descarga: menos volumen de entrenamiento; si hace dieta, puede comer en mantenimiento.</td><td>Ánimo, sueño, sensación de energía</td></tr>
<tr><td>10–12</td><td>Revise: ¿qué funcionó?, ¿qué costó demasiado? Ajuste metas y dosis para el siguiente bloque.</td><td>Comparar tendencias con la semana 2</td></tr>
</tbody></table></div>
</section>

<section>
<h2>La revisión semanal (15 minutos)</h2>
<div class="box do"><ol>
<li>Abra <a href="#progreso">Mi progreso</a> y mire la tendencia del peso, no los datos diarios. Si en tres semanas no bajó y ese era el objetivo, reduzca 100 a 200 kcal o añada pasos; no más.</li>
<li>Revise sus hábitos: ¿cuántos días los cumplió? Si un hábito falla más de la mitad de los días, hágalo más pequeño o cambie la señal.</li>
<li>Responda el índice de automaticidad de cada hábito.</li>
<li>Mire su carga de entrenamiento: monotonía por debajo de 2 y aumentos graduales.</li>
<li>Escriba una frase: qué aprendió esta semana y qué cambiará la próxima.</li>
</ol></div>
</section>

<section>
<h2>Cuándo pedir ayuda</h2>
<div class="box safe"><ul>
<li>Si tiene una enfermedad crónica, toma medicamentos, está embarazada o es menor de edad, consulte a un profesional antes de hacer una dieta o un cambio grande de entrenamiento.</li>
<li>Pérdida de la menstruación, fracturas por estrés, cansancio persistente o preocupación obsesiva por la comida o el peso son señales de alarma (capítulo 21).</li>
<li>Si un estado de ánimo bajo, la ansiedad o un trauma le impiden avanzar, una psicoterapia con evidencia puede ayudar más que cualquier técnica de este curso (capítulo 30).</li>
<li>Ante dolor persistente, busque un diagnóstico médico antes de cualquier terapia complementaria (capítulo 29).</li>
</ul></div>
</section>
