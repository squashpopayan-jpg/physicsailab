<p class="lead">En los momentos que deciden un partido, la diferencia entre dos deportistas de nivel parecido suele estar en la cabeza: cómo manejan la presión, dónde ponen la atención, qué se dicen. La psicología del deporte tiene herramientas con respaldo para esos momentos, y también un buen número de ideas repetidas que no lo tienen. Este capítulo usa ejemplos de squash, pero vale para cualquier deporte.</p>

<section>
<h2>Imaginería aplicada: un guion PETTLEP</h2>
<p>El capítulo 13 mostró que la práctica mental mejora el desempeño, con efecto pequeño a moderado, sobre todo cuando se parece a la ejecución real. Un guion basado en PETTLEP (Holmes y Collins, 2001) para practicar la devolución del saque en squash podría ser:</p>
<ol>
<li><b>Físico:</b> de pie, con la raqueta en la mano, en posición de espera.</li>
<li><b>Entorno:</b> en la cancha de siempre, o mirando un video de ella.</li>
<li><b>Tarea:</b> la devolución que usted juega, con su técnica real, no la de un profesional.</li>
<li><b>Tiempo:</b> a velocidad real, no en cámara lenta.</li>
<li><b>Aprendizaje:</b> ajuste el guion a medida que mejora.</li>
<li><b>Emoción:</b> incluya los nervios del partido y la decisión de jugar.</li>
<li><b>Perspectiva:</b> desde sus propios ojos.</li>
</ol>
<p>Diez minutos, tres o cuatro veces por semana, combinados con práctica real, es un formato razonable; sustituir la práctica real por imaginación, no.</p>
</section>

<section>
<h2>Rutinas previas y el «ojo quieto»</h2>
<p>Casi todos los deportistas de alto nivel tienen una <span class="term">rutina previa</span> antes de las acciones cerradas: el saque, el tiro libre, el putt. Pueden incluir respiración, una palabra clave y una forma fija de preparar el cuerpo. Su función es dejar la atención en lo relevante y llevar al cuerpo a un estado conocido. La evidencia sugiere que ayudan, con estudios en general pequeños.</p>
<p>Un componente estudiado con detalle es el <span class="term">ojo quieto</span>: la última fijación de la mirada sobre el objetivo antes de iniciar el movimiento. Joan Vickers observó que los expertos la hacen más larga y más estable. Un metaanálisis encontró diferencias grandes en la duración del ojo quieto entre expertos y novatos y entre intentos exitosos y fallidos, y que entrenarlo mejoró el rendimiento en los estudios disponibles (Lebeau y otros, 2016).</p>
<div class="sim" data-sim="ojoquieto" data-title="Ojo quieto: lo que encontró el metaanálisis de Lebeau y otros (2016)"></div>
<div class="sim-guide"><ul>
<li>Las dos primeras barras comparan grupos (expertos frente a novatos) e intentos (exitosos frente a fallidos): muestran asociación, no causa.</li>
<li>Las dos últimas vienen de estudios de entrenamiento: entrenar el ojo quieto alargó la fijación y mejoró el rendimiento. Eran solo nueve artículos, varios del mismo grupo; el efecto real probablemente es menor.</li>
</ul></div>
<div class="box evid"><p><span class="nivel n3">moderada</span>El ojo quieto se asocia con el rendimiento en tareas de puntería y su entrenamiento parece ayudar, con una base de estudios todavía pequeña.</p></div>
</section>

<section>
<h2>Ahogarse bajo presión</h2>
<p>¿Por qué un jugador experto falla un golpe fácil en el punto decisivo? Sian Beilock y Thomas Carr (2001) propusieron la <span class="term">hipótesis del monitoreo explícito</span>: la presión hace que el experto preste atención consciente a los pasos de un movimiento que ya era automático, y esa atención desarma la ejecución, como intentar pensar cada movimiento al bajar una escalera. En un experimento posterior, golfistas expertos pateaban mejor mientras hacían una tarea distractora que cuando debían atender a su técnica; con futbolistas, los expertos que conducían el balón con su pie dominante rendían mejor distraídos, mientras que los novatos rendían mejor atendiendo a la técnica (Beilock y otros, 2002).</p>
<div class="sim" data-sim="presion" data-title="Novatos y expertos bajo distintas condiciones de atención"></div>
<div class="sim-guide"><ul>
<li>El patrón es el de Beilock y otros (2002); las magnitudes son ilustrativas.</li>
<li>Para el experto, atender a la técnica perjudica y una tarea distractora casi no afecta. Para el novato es al revés: necesita pensar los pasos.</li>
<li>Aumente la presión: en el experto aumenta el monitoreo y el rendimiento cae. Active «Entrenó antes bajo presión»: el efecto de la presión se reduce.</li>
</ul></div>
<p>¿Qué hacer? Hay evidencia de que <b>entrenar bajo presión</b> moderada (apuestas, público, consecuencias) reduce el efecto de la presión en competencia (Oudejans y Pijpers, 2009). También ayudan una rutina previa que ocupe la atención con algo útil, y palabras clave que se refieran al objetivo y no a la mecánica.</p>
</section>

<section>
<h2>El mito de la U invertida</h2>
<p>Se repite que el rendimiento sigue una «U invertida» con la activación: poco nervio rinde poco, nervio intermedio rinde mucho y mucho nervio rinde poco, y que esa es la «ley de Yerkes-Dodson». El estudio original de 1908 trataba de otra cosa: ratones que aprendían a distinguir una caja clara de una oscura recibiendo descargas eléctricas de distinta intensidad, con muy pocos animales por condición. La versión popular de la U invertida aplicada a la ansiedad y al rendimiento es una reinterpretación posterior (Teigen, 1994).</p>
<div class="box evid"><p><span class="nivel n2">simplificación</span>La relación entre activación y rendimiento existe, pero depende de la persona, de la tarea y de cómo se interprete la activación; no hay una curva universal. Algunos estudios sugieren que interpretar la activación como energía útil, en lugar de como amenaza, mejora el rendimiento, con resultados todavía mixtos.</p></div>
<div class="box do"><ul>
<li>Antes de un partido importante, pruebe respirar lento (unas 6 respiraciones por minuto) durante 2 o 3 minutos y diga para sí «estoy listo», en lugar de «tengo que calmarme».</li>
<li>Escriba su rutina para el saque y la devolución: dos respiraciones, una palabra clave, la mirada fija en el punto de contacto.</li>
</ul></div>
</section>

<section>
<h2>Flujo</h2>
<p>Mihaly Csikszentmihalyi describió el <span class="term">flujo</span>: un estado de concentración total en el que la acción parece fluir sola, el tiempo se distorsiona y la tarea se disfruta por sí misma. Se asocia con un equilibrio entre el desafío y la habilidad, metas claras y retroalimentación inmediata. Es una descripción útil y muy estudiada con cuestionarios; no hay una técnica que lo produzca a voluntad, pero las condiciones que lo favorecen (rivales de nivel parecido, metas concretas por punto) son las mismas que favorecen el aprendizaje.</p>
</section>

<section>
<h2>Resumen, problemas y autoevaluación</h2>
<div class="box keys"><ul>
<li>La imaginería ayuda más cuando se parece a la ejecución real (PETTLEP) y se combina con práctica física.</li>
<li>Las rutinas previas y el ojo quieto se asocian con mejor rendimiento en acciones cerradas; entrenar el ojo quieto parece útil.</li>
<li>Bajo presión, los expertos pueden «ahogarse» al atender a la mecánica de un gesto automático; entrenar con presión y usar palabras clave de objetivo ayuda.</li>
<li>La U invertida es una simplificación de un estudio con ratones de 1908; la relación entre activación y rendimiento depende de la persona y la tarea.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Usted es principiante en squash. ¿Le conviene atender a la técnica de su drive durante los ejercicios?
<details><summary>Respuesta</summary><p>Sí: en el aprendizaje inicial, atender paso a paso ayuda (los novatos de Beilock rendían mejor así). A medida que el golpe se automatiza, conviene pasar a palabras clave de objetivo.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Por qué la correlación entre duración del ojo quieto y éxito no prueba que alargarlo cause el éxito?
<details><summary>Respuesta</summary><p>Porque ambos pueden depender de una tercera variable, como la habilidad o la confianza en ese intento. Para probar causa hacen falta estudios en los que se entrena el ojo quieto y se compara con un grupo de control.</p></details></li>
</ol>
