<p class="lead">Dos de las ideas más conocidas de la PNL son que cada persona piensa sobre todo en imágenes, en sonidos o en sensaciones, y que la dirección de los ojos delata qué está pensando, e incluso si miente. Son ideas atractivas, fáciles de enseñar y, sobre todo, comprobables. Este capítulo muestra cómo se comprobaron y qué pasó. Es también una lección práctica de cómo se pone a prueba una afirmación.</p>

<section>
<h2>La teoría</h2>
<p>Según Bandler y Grinder, cada persona tiene un <span class="term">sistema representacional preferido</span>: visual, auditivo o kinestésico (sensaciones corporales), que se puede reconocer por los predicados que usa: «lo veo claro», «me suena bien», «siento que encaja». Si el terapeuta, el vendedor o el jefe usa el mismo tipo de predicados, crearía rapport más rápido. Además, propusieron que la dirección de los ojos indica qué sistema se está usando en cada momento:</p>

<p>Si la teoría fuera correcta, tres medidas independientes deberían coincidir: lo que la persona dice preferir, los predicados que usa y hacia dónde mueve los ojos. Y adaptar la comunicación a ese sistema debería mejorar la sintonía o el aprendizaje.</p>
</section>

<section>
<h2>Cómo se puso a prueba</h2>
<p>En la década de 1980 se publicaron decenas de experimentos. Christopher Sharpley (1984, 1987) los revisó dos veces en el <i>Journal of Counseling Psychology</i>: las tres medidas del sistema preferido no coincidían entre sí, los movimientos oculares no seguían el patrón predicho y igualar los predicados no producía de forma consistente más confianza ni mejores resultados. Michael Heap (1988) llegó a la misma conclusión. Los defensores respondieron que los experimentos no reproducían bien las técnicas; Sharpley señaló que, si ningún experimento posible puede refutar la teoría, entonces no es una teoría comprobable.</p>
<div class="box evid"><p><span class="nivel n0">refutada</span>No hay evidencia de que las personas tengan un sistema representacional preferido estable que se pueda detectar por sus palabras o sus ojos, ni de que igualarlo mejore la comunicación o la terapia.</p></div>
</section>

<section>
<h2>Los ojos y las mentiras</h2>
<p>De las claves oculares salió una creencia muy difundida en cursos de ventas, recursos humanos e incluso de policía: quien mira arriba a su derecha estaría «construyendo» una imagen, es decir, mintiendo. Richard Wiseman y sus colegas (2012) la pusieron a prueba con tres estudios:</p>
<ol>
<li>Grabaron a voluntarios que mentían o decían la verdad sobre dónde habían escondido un objeto: sus movimientos oculares no siguieron el patrón de la PNL.</li>
<li>Explicaron la teoría a un grupo y no al otro, y ambos intentaron detectar mentiras en videos: no hubo diferencia entre los grupos.</li>
<li>Analizaron ruedas de prensa reales de personas que pedían ayuda para encontrar a un familiar desaparecido, algunas de las cuales resultaron culpables: tampoco hubo diferencia en la dirección de la mirada.</li>
</ol>
<p>El contexto general es aún más útil: un metaanálisis con más de 24.000 evaluadores encontró que las personas aciertan en promedio 54 % de las veces al juzgar si alguien miente, apenas por encima del azar (Bond y DePaulo, 2006). Ninguna señal corporal aislada delata la mentira de forma fiable.</p>
<div class="sim" data-sim="ojos" data-title="Treinta «detectores de mentiras» que miran los ojos: ¿alguno es experto?"></div>
<div class="sim-guide"><ul>
<li>Cada barra es una persona entrenada en las claves oculares que juzga una serie de declaraciones. Su acierto real lo fija usted; con el valor por defecto, 50 %, los ojos no dicen nada.</li>
<li>Aun así, por puro azar, algunas personas aciertan 65 % o más y parecen expertas. Si un curso muestra solo a esas personas como testimonio, el engaño es perfecto.</li>
<li>Suba el número de declaraciones por persona: los aciertos se concentran alrededor del valor real. Ponga 54 % (el promedio humano según Bond y DePaulo): note cuántas declaraciones hacen falta para distinguirlo del azar.</li>
</ul></div>
<div class="box safe"><p>Juzgar a alguien como mentiroso por sus gestos o su mirada no es un juego: en entrevistas policiales y laborales puede llevar a sospechar de inocentes. Los métodos con mejor apoyo para evaluar la veracidad se basan en el contenido de lo que se dice y en entrevistas que aumentan la carga cognitiva, no en lenguaje corporal.</p></div>
</section>

<section>
<h2>El primo famoso: los estilos de aprendizaje</h2>
<p>La idea de que cada estudiante aprende mejor si se le enseña en su estilo (visual, auditivo o kinestésico) se parece mucho a la de los sistemas representacionales, y es aún más popular: en encuestas a docentes de varios países, cerca de 9 de cada 10 la consideran cierta. Harold Pashler y sus colegas (2008) explicaron qué tendría que mostrar un experimento para apoyarla: dividir a los estudiantes por su estilo, asignar al azar cada tipo de enseñanza y encontrar una <span class="term">interacción cruzada</span>: que los «visuales» aprendan más con enseñanza visual y los «auditivos» con enseñanza auditiva. Encontraron muy pocos estudios con ese diseño, y los que había no lo mostraban.</p>
<div class="sim" data-sim="malla" data-title="Lo que tendría que verse si los estilos de aprendizaje fueran reales"></div>
<div class="sim-guide"><ul>
<li>Cada línea es un tipo de estudiante; el eje horizontal, el tipo de enseñanza. La hipótesis de los estilos exige que las líneas se crucen.</li>
<li>Con el efecto de ajuste en cero (lo que se encuentra en los experimentos), las líneas son paralelas: un tipo de material puede ser mejor para todos, y una persona puede ser mejor estudiante que otra, pero nadie gana por recibir «su» estilo.</li>
<li>Rogowsky, Calhoun y Tallal (2015) probaron exactamente esto con audiolibros y texto escrito en adultos: no encontraron relación entre el estilo preferido y el formato que les funcionaba.</li>
</ul></div>
<div class="box evid"><p><span class="nivel n0">refutada</span>Adaptar la enseñanza al estilo de aprendizaje preferido no mejora el aprendizaje. Lo que sí tiene respaldo es adaptar la forma al <i>contenido</i>: la geografía se enseña con mapas y la música con sonidos, para todos.</p></div>
</section>

<section>
<h2>Lo que sí es cierto</h2>
<ul>
<li><b>La mirada y el esfuerzo mental sí se relacionan, aunque no como dice la PNL.</b> Las personas tienden a apartar la mirada cuando piensan algo difícil, y hacerlo mejora el recuerdo, probablemente porque reduce la información visual que compite (Glenberg y otros, 1998). La dirección hacia la que se mira no codifica el tipo de pensamiento.</li>
<li><b>Las personas sí difieren en capacidades.</b> Algunas tienen mejor memoria visoespacial o verbal; eso es distinto de un «estilo» y no implica que deban aprender por un solo canal.</li>
<li><b>Combinar palabras e imágenes ayuda a casi todos.</b> Explicar con texto y con un buen diagrama a la vez mejora el aprendizaje en general, no solo el de los «visuales».</li>
<li><b>Adaptar el lenguaje al interlocutor sí ayuda,</b> pero en lo que importa: vocabulario conocido, ejemplos de su mundo, ritmo y escucha. Eso es simplemente buena comunicación.</li>
</ul>
</section>

<section>
<h2>Resumen, problemas y autoevaluación</h2>
<div class="box keys"><ul>
<li>La PNL afirma que cada persona tiene un sistema representacional preferido detectable por palabras y ojos; las revisiones de los años ochenta no encontraron apoyo.</li>
<li>La dirección de la mirada no indica mentira (Wiseman y otros, 2012); las personas aciertan solo 54 % al detectar mentiras (Bond y DePaulo, 2006).</li>
<li>Por azar, algunos «detectores» parecen expertos: seleccionar los aciertos es un engaño estadístico.</li>
<li>Los estilos de aprendizaje requieren una interacción cruzada que los experimentos no encuentran.</li>
<li>Apartar la mirada al pensar, las diferencias de capacidad y la ventaja de combinar palabras e imágenes sí tienen respaldo.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Un detective acierta 7 de 10 juicios mirando los ojos. ¿Es evidencia de que el método funciona?
<details><summary>Respuesta</summary><p>No: con 50 % de probabilidad de acertar al azar, sacar 7 o más de 10 ocurre con probabilidad de 17 %. La prueba binomial de dos colas da p ≈ 0,34.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Cuántos juicios necesitaría alguien que acierta realmente 54 % para que su resultado sea significativo con alta probabilidad?
<details><summary>Respuesta</summary><p>Del orden de mil: con \(p_0=0{,}5\) y \(p=0{,}54\), para potencia 80 % y α = 0,05 se necesitan unos \(n\approx\big(\frac{1{,}96\cdot0{,}5+0{,}84\cdot0{,}498}{0{,}04}\big)^2\approx1.200\) juicios.</p></details></li>
<li><span class="lvl">Intermedio</span>Dibuje el resultado que esperaría la hipótesis de los estilos de aprendizaje en un diseño 2 × 2 y el que se encuentra.
<details><summary>Respuesta</summary><p>Hipótesis: líneas cruzadas (cada grupo rinde más con su estilo). Hallazgo: líneas paralelas o una que domina en ambos formatos, sin cruce.</p></details></li>
</ol>
