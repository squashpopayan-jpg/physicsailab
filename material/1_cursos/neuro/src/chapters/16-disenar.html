<p class="lead">El capítulo anterior explicó qué es un hábito. Este explica cómo construir uno a propósito. Ninguna de estas técnicas es magia, y varias populares tienen menos respaldo del que aparentan; pero juntas cambian mucho las probabilidades. La idea central es una: no apostar a la fuerza de voluntad, sino diseñar el entorno y la rutina para que la conducta deseada sea la más fácil.</p>

<section>
<h2>Pequeño, concreto y anclado a algo que ya hace</h2>
<p>Las conductas simples se automatizan más rápido: en la revisión de Singh y otros (2024), usar seda dental cada día tuvo más éxito que mantener una dieta saludable. Por eso conviene empezar con una versión pequeña de la conducta («ponerme los tenis y salir cinco minutos») y crecer después. Además, la mejor señal es una rutina que ya existe. En un estudio con personas que no usaban seda dental, quienes la usaban <i>después</i> de cepillarse desarrollaron más automaticidad que quienes la usaban antes (Judah, Gardner y Aunger, 2013): la acción previa sirvió de disparador. Es la lógica de las intenciones de implementación del capítulo 13: «después de [rutina actual], haré [conducta nueva]».</p>
<div class="box do"><ul>
<li>Elija una rutina diaria que nunca falla (despertarse, café, almuerzo, llegar a casa) y pegue a ella la versión mínima del hábito que quiere.</li>
</ul></div>
</section>

<section>
<h2>Contexto estable y fricción</h2>
<p>Un hábito se forma más rápido si se repite en el mismo lugar, a la misma hora y después de la misma señal. Y la probabilidad de hacerlo depende mucho de lo fácil que sea: pequeñas barreras (buscar la ropa, ir lejos, decidir qué hacer) frenan una conducta poco automática; quitarlas la facilita. Al revés, para un hábito indeseado, poner fricción funciona: dejar el celular cargando fuera de la habitación, no tener dulces en casa.</p>
<div class="box evid"><p><span class="nivel n3">variable</span>Los «empujoncitos» (nudges) que cambian el entorno de decisión se popularizaron mucho. Un metaanálisis con 447 efectos encontró un efecto promedio moderado, pero un reanálisis que corrigió el sesgo de publicación no encontró evidencia de un efecto promedio, con mucha variación entre tipos de intervención (Mertens y otros, 2022; Maier y otros, 2022). Los cambios que reorganizan la decisión, como los valores por defecto, parecen más robustos que los que solo informan. Conclusión práctica: el diseño del entorno ayuda, pero cada cambio hay que probarlo en uno mismo y medirlo.</p></div>
</section>

<section>
<h2>Recompensas: que el premio llegue hoy</h2>
<p>El aprendizaje por refuerzo (capítulo 7) depende del momento: el beneficio de entrenar para la salud llega en meses, y el cerebro aprende poco de él. Por eso funcionan mejor las recompensas inmediatas:</p>
<ul>
<li><b>Disfrute durante la actividad.</b> Las personas que eligen un ejercicio que disfrutan persisten más que las que eligen el «más eficaz» (Woolley y Fishbach, 2017).</li>
<li><b>Agrupar tentaciones.</b> Reservar un placer (un audiolibro, una serie) solo para cuando se hace la conducta. En el estudio original, quienes solo podían escuchar sus audiolibros en el gimnasio fueron 51 % más al inicio que el grupo de control, aunque el efecto se desvaneció en semanas (Milkman, Minson y Volpp, 2014).</li>
<li><b>Incentivos pequeños.</b> Pagar a estudiantes por ir al gimnasio durante un mes aumentó su asistencia también después de que se dejó de pagar, sobre todo en quienes antes no iban (Charness y Gneezy, 2009). En un megaestudio con 61.293 socios de gimnasios y 54 programas diseñados por 30 científicos, la intervención más eficaz fue un premio diminuto por volver después de faltar a un entrenamiento, que aumentó las visitas semanales cerca de 27 %; pero solo 8 % de los programas mantuvo un efecto medible después de terminar (Milkman y otros, 2021).</li>
</ul>
<div class="box note"><p>¿Los premios externos matan la motivación interna? En tareas que ya son interesantes, recompensas materiales esperadas pueden reducir el interés (Deci, Koestner y Ryan, 1999). Para conductas que al principio no son placenteras, como el ejercicio para muchas personas, los incentivos ayudan a empezar; la idea es que el gusto propio y el hábito tomen el relevo.</p></div>
</section>

<section>
<h2>Nunca fallar dos veces</h2>
<p>Fallar un día no daña el hábito (Lally y otros, 2010). Lo que sí lo daña es el pensamiento «ya lo arruiné, qué más da», que convierte un desliz en una recaída. En dietas se conoce como el efecto «ya qué» (Polivy y Herman, 1985) y en adicciones como efecto de violación de la abstinencia (Marlatt y Gordon, 1985). La regla práctica, «nunca fallar dos veces seguidas», coincide con lo que funcionó en el megaestudio: premiar el regreso después de una falla.</p>
<div class="sim" data-sim="recaida" data-title="Un desliz o una recaída: el efecto «ya lo arruiné»"></div>
<div class="sim-guide"><ul>
<li>Cada día puede aparecer una tentación; resistirla es más fácil a medida que el hábito nuevo se automatiza. Las barras muestran los deslices por semana.</li>
<li>Active el pensamiento «ya lo arruiné»: después de cada desliz, durante unos días cuesta más resistir. Los deslices se encadenan y el hábito nuevo no termina de formarse.</li>
<li>Desactívelo (la persona retoma al día siguiente): los deslices quedan aislados y la automaticidad sigue creciendo.</li>
</ul></div>
</section>

<section>
<h2>Fechas de nuevo comienzo</h2>
<p>Las búsquedas en internet sobre dietas, las visitas al gimnasio y los compromisos de metas aumentan después de «hitos temporales»: el año nuevo, el comienzo de la semana o del mes, un cumpleaños (Dai, Milkman y Riis, 2014). Los autores lo llamaron el <span class="term">efecto del nuevo comienzo</span>: esos hitos separan al «yo de antes» del «yo de ahora». Úselos a su favor, pero sin esperar a enero: el próximo lunes también es un nuevo comienzo.</p>
</section>

<section>
<h2>Junte todo: diseñe su hábito</h2>
<div class="sim" data-sim="diseno" data-title="Qué tanto cambian las probabilidades según cómo diseñe el hábito"></div>
<div class="sim-guide"><ul>
<li>Modelo didáctico que combina lo visto: la probabilidad de hacer la conducta cada día depende de la intención, de la fricción y del hábito acumulado; el hábito crece más rápido con una señal estable y una conducta simple.</li>
<li>Compare el diseño típico (conducta grande, sin señal fija, sin premio) con el diseño completo. La diferencia a las 12 semanas suele ser enorme.</li>
<li>Los números son ilustrativos; el orden de los efectos es el que sugiere la investigación revisada.</li>
</ul></div>
</section>

<section>
<h2>Resumen, problemas y autoevaluación</h2>
<div class="box keys"><ul>
<li>Empiece con una versión pequeña y anclada a una rutina existente; las conductas simples se automatizan antes.</li>
<li>Un contexto estable acelera el hábito; quitar fricción a lo deseado y ponerla a lo indeseado ayuda. Los efectos de los nudges son variables: pruebe y mida.</li>
<li>Las recompensas inmediatas, el disfrute, agrupar tentaciones y los incentivos pequeños ayudan a empezar; pocos efectos duran sin el hábito.</li>
<li>Fallar un día no importa; encadenar fallas por el «ya lo arruiné» sí. Nunca falle dos veces.</li>
<li>Los hitos temporales son buenos momentos para empezar.</li>
</ul></div>
<div class="box do"><ul>
<li>Cree en <a href="#progreso">Mi progreso</a> un solo hábito con la forma «después de [rutina], [conducta mínima]». Márquelo cada día durante dos semanas, incluidos los días que falle.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Reformule «comer más sano» como un hábito pequeño anclado a una rutina.
<details><summary>Respuesta</summary><p>Por ejemplo: «Después de servir el almuerzo, lleno media porción del plato con verduras».</p></details></li>
<li><span class="lvl">Intermedio</span>¿Por qué un premio por <i>volver</i> después de faltar puede funcionar mejor que un premio por cada visita?
<details><summary>Respuesta</summary><p>Porque ataca justo el momento crítico, el desliz que se convierte en recaída: corta la cadena de fallas sin pagar por lo que la persona ya iba a hacer.</p></details></li>
</ol>
