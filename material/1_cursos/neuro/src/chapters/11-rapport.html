<p class="lead">El capítulo anterior mostró ideas de la PNL que no resistieron la prueba. Este hace lo contrario: toma tres técnicas que suelen ayudar a la gente, rapport, anclaje y reencuadre, y busca en la investigación por qué. La respuesta es interesante: funcionan cuando coinciden con fenómenos bien estudiados, y fallan justo donde la PNL promete más que esos fenómenos.</p>

<section>
<h2>Rapport: imitar, sincronizarse y escuchar</h2>
<p>La PNL enseña a «espejear» la postura, los gestos, el ritmo y las palabras del interlocutor para crear sintonía. La idea tiene una base real. Tanya Chartrand y John Bargh (1999) mostraron que las personas imitan sin darse cuenta los gestos de quien tienen enfrente, lo llamaron <span class="term">efecto camaleón</span>, y que quienes fueron imitados discretamente por un colaborador del experimento dijeron que la interacción fue más fluida y que el otro les cayó mejor. Moverse en sincronía con otros, al marchar, cantar o remar, también aumenta la cooperación, con efectos pequeños a moderados según los metaanálisis.</p>
<p>Pero el efecto de imitar <i>a propósito</i> es frágil. Joanna Hale y Antonia Hamilton (2016) hicieron que personajes de realidad virtual imitaran o no los movimientos de cabeza de los participantes: en un primer estudio la imitación aumentó el rapport; en una réplica preregistrada, no tuvo ningún efecto sobre el rapport ni sobre la confianza. Y si la otra persona nota que la imitan, el efecto puede invertirse.</p>
<div class="box evid"><p><span class="nivel n4">sólida</span>Lo que sí predice de forma robusta los buenos resultados en terapia es la <span class="term">alianza</span>: el acuerdo en las metas, en las tareas y el vínculo de confianza entre terapeuta y paciente. En un metaanálisis de 295 estudios con más de 30.000 pacientes, la correlación entre alianza y resultados fue r = 0,28 (Flückiger y otros, 2018). La alianza se construye escuchando, entendiendo y acordando, no copiando gestos.</p></div>
<div class="box do"><ul>
<li>En una conversación difícil, en vez de imitar posturas, resuma lo que entendió con las palabras del otro y pregunte si es correcto. Es la técnica de escucha reflexiva de la entrevista motivacional.</li>
</ul></div>
</section>

<section>
<h2>Anclaje: condicionamiento clásico con otro nombre</h2>
<p>En la PNL, «anclar» consiste en inducir un estado emocional intenso (por ejemplo, recordar un momento de confianza) y, en el pico, hacer un gesto o un toque. Repetido, el gesto quedaría asociado al estado y bastaría para evocarlo. Es exactamente el condicionamiento clásico de Pávlov (capítulo 7): un estímulo neutro adquiere el poder de otro que lo acompaña. Y el condicionamiento es uno de los fenómenos más sólidos de la psicología.</p>
<p>Lo que la investigación sobre condicionamiento añade, y la PNL suele omitir, es que una asociación que se usa sin el estímulo original <span class="term">se extingue</span>: si el gesto se repite muchas veces sin que el estado emocional lo acompañe, pierde su efecto. Además, lo aprendido en un contexto se expresa peor en otro (Bouton, 2004). Un «ancla» instalada en un taller entusiasta no funciona igual a solas en una oficina tensa.</p>
<div class="sim" data-sim="ancla" data-title="Instalar un ancla y usarla: adquisición y extinción"></div>
<div class="sim-guide"><ul>
<li>Primero se empareja el gesto con el estado emocional unas cuantas veces (adquisición). Después se usa el gesto solo, sin volver a evocar el estado.</li>
<li>Con pocas repeticiones de instalación, el ancla es débil desde el principio. Con muchos usos sin refuerzo, se apaga. Agregue sesiones de «recarga» (volver a evocar el estado de verdad) y vea cómo se mantiene.</li>
<li>El cambio de contexto reduce su efecto: es la razón de que las técnicas aprendidas en un taller fallen en la vida real si no se practican allí.</li>
</ul></div>
<div class="box evid"><p><span class="nivel n4">sólida</span>El condicionamiento clásico y su extinción. <span class="nivel n1">sin probar</span>Que un ancla instalada en una o pocas sesiones produzca cambios emocionales duraderos y fiables: no hay estudios controlados.</p></div>
</section>

<section>
<h2>Reencuadre: la reevaluación cognitiva</h2>
<p>«Reencuadrar» es cambiar el marco con el que se mira una situación: un despido como oportunidad, el nerviosismo antes de un partido como preparación del cuerpo. La psicología lo estudia como <span class="term">reevaluación cognitiva</span> (Gross, 1998), y es la base de la terapia cognitivo-conductual. Thomas Webb y sus colegas (2012) reunieron 306 comparaciones experimentales de estrategias para regular las emociones y encontraron diferencias claras entre ellas:</p>
<div class="sim" data-sim="regulacion" data-title="Qué tan bien funcionan las estrategias para regular las emociones (Webb, Miles y Sheeran, 2012)"></div>
<div class="sim-guide"><ul>
<li>Cada barra es el tamaño del efecto promedio de una estrategia sobre la emoción que se quería regular. Datos del metaanálisis.</li>
<li>Reinterpretar la situación o ponerse en la perspectiva de otro funciona mejor que intentar no sentir. Suprimir la emoción o los pensamientos no funciona; disimular la expresión ayuda un poco a lo que se muestra.</li>
<li>Concentrarse en la emoción (darle vueltas) la empeora.</li>
</ul></div>
<p>La PNL acertó al darle importancia al encuadre. La versión con evidencia agrega precisión: identificar el pensamiento automático, examinar la evidencia a favor y en contra, y formular una interpretación alternativa realista, no simplemente positiva.</p>
</section>

<section>
<h2>El lenguaje sí cambia decisiones y recuerdos</h2>
<p>Una intuición central de la PNL es correcta: cómo se dicen las cosas cambia cómo se entienden. Dos ejemplos clásicos con muy buena evidencia:</p>
<ul>
<li><b>Efecto de encuadre.</b> Tversky y Kahneman (1981) plantearon una epidemia que amenaza a 600 personas. Cuando las opciones se describían en vidas salvadas, 72 % eligió el programa seguro; cuando las mismas opciones se describían en muertes, solo 22 % lo eligió. El efecto se ha replicado en proyectos de muchos laboratorios.</li>
<li><b>Preguntas que sugieren.</b> El verbo de una pregunta cambia el recuerdo de un accidente (Loftus y Palmer, 1974; capítulo 5).</li>
</ul>
<div class="sim" data-sim="marco" data-title="Pruébelo usted: el problema de la epidemia"></div>
<p>El <span class="term">metamodelo</span> de la PNL es un conjunto de preguntas para recuperar información que el lenguaje borra o generaliza: ante «nadie me respeta», preguntar «¿nadie? ¿quién específicamente?». Tiene un pariente bien estudiado: las preguntas socráticas de la terapia cognitiva, que ayudan a examinar generalizaciones y pensamientos absolutos. La diferencia está en el marco: la terapia cognitiva las usa dentro de un tratamiento evaluado en ensayos; la PNL las presenta como técnica autónoma, sin evaluación.</p>
<div class="box warn"><p>Saber que el lenguaje influye no autoriza a usarlo para manipular. El «modelo Milton» de la PNL enseña lenguaje vago e indirecto inspirado en la hipnosis de Milton Erickson para «sortear la resistencia consciente». La hipnosis tiene usos clínicos con evidencia como complemento de otros tratamientos (capítulo 30), pero su eficacia depende sobre todo de la sugestionabilidad de cada persona y no existe una «persuasión encubierta» irresistible.</p></div>
</section>

<section>
<h2>Resumen, problemas y autoevaluación</h2>
<div class="box keys"><ul>
<li>La imitación espontánea y la sincronía existen y favorecen la afinidad, pero imitar a propósito tiene efectos frágiles; la alianza, construida escuchando, sí predice buenos resultados.</li>
<li>El anclaje es condicionamiento clásico: real, pero se extingue sin refuerzo y depende del contexto.</li>
<li>El reencuadre es reevaluación cognitiva, una de las estrategias de regulación emocional más eficaces; suprimir las emociones no funciona.</li>
<li>El lenguaje cambia decisiones (encuadre) y recuerdos (preguntas sugestivas). El metamodelo se parece a las preguntas socráticas de la terapia cognitiva.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Por qué un ancla que se dispara a diario sin volver a evocar el estado original pierde fuerza?
<details><summary>Respuesta</summary><p>Por extinción: cada presentación del estímulo condicionado sin el incondicionado genera un error de predicción negativo que reduce la asociación (capítulo 7).</p></details></li>
<li><span class="lvl">Intermedio</span>Según Webb y otros (2012), ¿qué conviene más ante la ansiedad antes de un partido: intentar no sentirla o reinterpretarla como activación útil?
<details><summary>Respuesta</summary><p>Reinterpretarla: la reevaluación tiene efectos positivos (d entre 0,23 y 0,45 según la variante) y suprimir la experiencia emocional no tiene efecto (d = −0,04).</p></details></li>
<li><span class="lvl">Intermedio</span>Explique por qué el efecto de encuadre es compatible con que las personas sean «racionales» en otros sentidos.
<details><summary>Respuesta</summary><p>Porque las opciones son matemáticamente iguales pero la descripción cambia el punto de referencia: ganancias frente a pérdidas. Las personas tienden a evitar riesgos con ganancias y a buscarlos con pérdidas (teoría prospectiva). No es falta de inteligencia, es cómo pesamos pérdidas y ganancias.</p></details></li>
</ol>
