<p class="lead">Medir el progreso no es un adorno: en un metaanálisis de 138 experimentos, las intervenciones que hacían que las personas registraran su avance mejoraron el logro de sus metas (Harkin y otros, 2016), y el efecto fue mayor cuando el registro quedaba anotado y cuando se compartía. Este apéndice es su cuaderno de registro. Usa las mismas herramientas que se explican en el curso: la curva de automaticidad de los hábitos (capítulo 15), el filtro de Kalman para ver la tendencia real del peso (capítulo 18), la carga de entrenamiento con el modelo de Banister (capítulo 21) y el modelo de peso de Hall (capítulo 23).</p>

<section>
<h2>Cómo usarlo bien</h2>
<ol>
<li><b>Empiece con uno o dos hábitos, no con diez.</b> Escríbalos como intención de implementación: «Después de <i>[señal]</i>, voy a <i>[conducta]</i>». Es la técnica con mejor respaldo para pasar de la intención a la acción (capítulo 16).</li>
<li><b>Registre a diario, a la misma hora.</b> Toma diez segundos. Marque también los días en que falló: el registro honesto es el que sirve.</li>
<li><b>Nunca falle dos veces seguidas.</b> Fallar un día no afecta de forma apreciable la formación del hábito (Lally y otros, 2010); el tablero cuenta las «dobles fallas» para que las evite.</li>
<li><b>Responda la escala de automaticidad una vez por semana.</b> Son cuatro preguntas (Gardner y otros, 2012). Con cuatro o más respuestas el tablero ajusta su curva y estima cuántos días le faltan.</li>
<li><b>Pésese en las mismas condiciones</b> (al levantarse, después de ir al baño, antes de comer) y no reaccione al dato de un día: mire la tendencia. El peso diario sube y baja uno o dos kilos por agua y glucógeno (capítulo 18).</li>
<li><b>Anote cada entrenamiento con minutos y esfuerzo percibido</b> (escala de 0 a 10, unos 30 minutos después de terminar). La carga de la sesión es minutos × esfuerzo (Foster y otros, 2001).</li>
</ol>
<div class="box safe"><p>Las cifras de este tablero son estimaciones para orientarse, no diagnósticos. Si tiene una enfermedad (diabetes, enfermedad cardiaca o renal, un trastorno de la conducta alimentaria), está en embarazo o toma medicamentos que afectan el peso o el apetito, consulte con su médico antes de cambiar su alimentación o su entrenamiento. Una pérdida de peso sin buscarla, o mayor de 1 % del peso por semana durante varias semanas, merece consulta.</p></div>
</section>

<section>
<h2>Qué calcula cada indicador</h2>
<div class="tablewrap"><table>
<thead><tr><th>Indicador</th><th>Cómo se calcula</th><th>Capítulo</th></tr></thead>
<tbody>
<tr><td>Racha actual y mejor racha</td><td>Días consecutivos cumplidos; un día sin registro corta la racha.</td><td>15</td></tr>
<tr><td>Dobles fallas</td><td>Veces que se fallaron dos días seguidos.</td><td>16</td></tr>
<tr><td>Automaticidad</td><td>Promedio de los cuatro ítems del SRBAI (1 a 7) y ajuste de \(A(t)=a-b\,\ee^{-ct}\) por mínimos cuadrados.</td><td>15</td></tr>
<tr><td>Tendencia del peso</td><td>Filtro de Kalman de nivel y pendiente; el intervalo de la pendiente sale de la incertidumbre del filtro.</td><td>18</td></tr>
<tr><td>Balance de energía estimado</td><td>Pendiente de la tendencia × densidad energética del tejido perdido (partición de Forbes, Hall 2007).</td><td>23</td></tr>
<tr><td>Proyección</td><td>Modelo dinámico de Hall y otros (2011) manteniendo el balance estimado.</td><td>23</td></tr>
<tr><td>Carga, monotonía y tensión</td><td>Carga = minutos × RPE; monotonía = media diaria / desviación de la semana; tensión = carga semanal × monotonía.</td><td>21</td></tr>
<tr><td>Estado físico, fatiga y forma</td><td>Modelo de impulso-respuesta de Banister con \(\tau_1=42\) y \(\tau_2=7\) días.</td><td>21</td></tr>
</tbody></table></div>
