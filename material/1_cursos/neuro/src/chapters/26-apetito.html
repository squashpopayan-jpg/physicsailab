<p class="lead">Si perder grasa fuera solo cuestión de calorías, bastaría con comer menos. Pero el cerebro defiende sus reservas: cuando bajan, aumenta el hambre. Entender ese sistema de control explica por qué casi todas las dietas se estancan y por qué los nuevos fármacos funcionan tan bien. Este capítulo une la neurociencia del curso con la Parte VI.</p>

<section>
<h2>El termostato del hipotálamo</h2>
<p>En el núcleo arqueado del hipotálamo hay dos poblaciones de neuronas con efectos opuestos: las que producen POMC reducen el apetito y las que producen AgRP y NPY lo aumentan. Ambas reciben señales del cuerpo:</p>
<ul>
<li><b>Leptina</b>, producida por el tejido graso en proporción a su cantidad: informa sobre las reservas a largo plazo. Su descubrimiento, en ratones que no la producían y comían sin parar, mostró que el peso tiene un control biológico (Zhang y otros, 1994).</li>
<li><b>Grelina</b>, del estómago, que sube antes de comer; y <b>GLP-1</b>, <b>PYY</b> y colecistoquinina, del intestino, que señalan saciedad durante y después de la comida.</li>
</ul>
<p>Cuando se pierde grasa, la leptina cae más que proporcionalmente y la grelina sube. En un estudio, esos cambios hormonales y el aumento del hambre persistían un año después de una dieta muy baja en calorías (Sumithran y otros, 2011). La leptina como tratamiento solo funciona en la deficiencia congénita, que es muy rara; en la obesidad común los niveles ya son altos y el cerebro responde poco a ellos.</p>
</section>

<section>
<h2>El apetito pesa más que el gasto</h2>
<p>¿Cuánto aumenta el apetito? Medir lo que come una persona libre es casi imposible (capítulo 23), así que David Polidori, Kevin Hall y sus colegas usaron un experimento natural: un fármaco para la diabetes (canagliflozina) que hace perder unas 360 kcal diarias por la orina, sin que el paciente lo note. Con el modelo de Hall y el peso medido, estimaron que la ingesta aumentó alrededor de 100 kcal/día por cada kilo perdido: más de tres veces lo que baja el gasto por kilo (Polidori y otros, 2016). Es una estimación indirecta en personas con diabetes, pero coincide con lo que se observa en las dietas: el peso baja durante unos meses, se estanca y luego empieza a subir.</p>
<div class="sim" data-sim="apetito" data-title="La meseta y la recuperación: el apetito dentro del modelo de Hall"></div>
<div class="sim-guide"><ul>
<li>Ambas curvas usan el modelo de Hall con un esfuerzo de dieta que se diluye con el tiempo (vida media de 8 meses), como se observa en los ensayos (Hall y Kahan, 2018).</li>
<li>Sin aumento del apetito (gris), el peso baja durante un año y luego sube despacio, a medida que el esfuerzo se diluye. Con el aumento del apetito (morado), la persona sigue «haciendo la dieta», pero come algo más a medida que pierde peso sin proponérselo: el peso toca un mínimo a los pocos meses y luego sube.</li>
<li>Lleve la vida media del esfuerzo a 60 meses: la meseta aparece igual, por el apetito, aunque la recuperación casi desaparece. Ponga el aumento del apetito en 0: las curvas coinciden.</li>
</ul></div>
<div class="box evid"><p><span class="nivel n3">moderada</span>El aumento del apetito tras perder peso es la principal razón de la meseta y la recuperación; su magnitud (unas 100 kcal/día por kilo) viene de una estimación indirecta. <span class="nivel n5">modelo</span>La curva de la simulación combina dos modelos publicados, no los datos de una persona.</p></div>
</section>

<section>
<h2>Sueño, estrés y entorno</h2>
<p>En estudios experimentales que restringieron el sueño a 3,5 a 5,5 horas durante días o pocas semanas, las personas comieron en promedio 385 kcal más al día, sin gastar más (metaanálisis de Al Khatib y otros, 2017). Los estudios son pequeños y cortos, pero el mecanismo es plausible: el cansancio aumenta la respuesta a la comida apetitosa y reduce el control.</p>
<p>El estrés crónico se asocia con comer más alimentos densos en energía, aunque la respuesta varía mucho: algunas personas comen más y otras menos. Y el entorno importa: porciones grandes, comida visible y siempre disponible, y productos diseñados para ser muy apetecibles aumentan la ingesta (capítulo 25). Por eso las estrategias de diseño del entorno del capítulo 16 sirven aquí: no tener a la vista lo que no se quiere comer, servir porciones definidas y planificar las comidas.</p>
<div class="box note"><p>¿Existe la «adicción a la comida»? Algunos alimentos activan circuitos de recompensa (capítulo 7) y ciertas personas describen una pérdida de control parecida a la de las adicciones. El concepto es útil para algunas personas, pero sigue en debate como diagnóstico y no está claro qué parte se explica por la palatabilidad, la restricción previa o la historia de dietas.</p></div>
</section>

<section>
<h2>Los fármacos GLP-1</h2>
<p>El GLP-1 es una hormona intestinal que reduce el apetito, retrasa el vaciamiento del estómago y aumenta la secreción de insulina después de comer. Los fármacos que imitan su acción (agonistas del receptor de GLP-1, como la semaglutida, o combinados con el receptor de GIP, como la tirzepatida) actúan sobre el tronco encefálico y el hipotálamo: las personas sienten menos hambre, se llenan antes y piensan menos en la comida.</p>
<div class="sim" data-sim="farmacos" data-title="Cambio medio de peso en los grandes ensayos"></div>
<div class="sim-guide"><ul>
<li>En STEP 1, 1 961 adultos con obesidad o sobrepeso recibieron semaglutida 2,4 mg semanal o placebo, ambos con consejo de estilo de vida, durante 68 semanas (Wilding y otros, 2021).</li>
<li>En SURMOUNT-1, la dosis más alta de tirzepatida produjo una pérdida media de 20,9 % a las 72 semanas (Jastreboff y otros, 2022).</li>
<li>La última barra es la extensión de STEP 1: un año después de suspender el fármaco, los participantes habían recuperado cerca de dos tercios de lo perdido (Wilding y otros, 2022).</li>
</ul></div>
<p>En personas con sobrepeso u obesidad y enfermedad cardiovascular, sin diabetes, la semaglutida redujo los eventos cardiovasculares graves en un 20 % (Lincoff y otros, 2023). Los efectos adversos más frecuentes son digestivos (náuseas, vómitos, diarrea, estreñimiento), sobre todo al aumentar la dosis. Una parte importante del peso perdido es masa magra, por lo que el entrenamiento de fuerza y una ingesta suficiente de proteína son especialmente importantes con estos fármacos (capítulo 25).</p>
<p>Los resultados de los fármacos confirman lo que dice el modelo: si se reduce la señal de hambre, el peso baja mucho más que con una dieta sola; si se retira el fármaco, el hambre vuelve y el peso también. La obesidad se comporta como una condición crónica.</p>
<div class="box evid"><p><span class="nivel n4">sólida</span>Los agonistas de GLP-1 y la tirzepatida producen pérdidas de peso grandes mientras se usan, y la semaglutida reduce eventos cardiovasculares en personas con enfermedad cardiovascular. Al suspenderlos, la mayor parte del peso se recupera en el primer año.</p></div>
<div class="box safe"><p>Estos fármacos requieren prescripción y seguimiento médico. Las versiones de origen dudoso (compuestos sin control, «microdosis» vendidas por internet) han causado intoxicaciones. Este curso no recomienda iniciar, cambiar ni suspender ningún medicamento.</p></div>
</section>

<section>
<h2>Resumen, problemas y autoevaluación</h2>
<div class="box keys"><ul>
<li>El hipotálamo integra la leptina, la grelina y las hormonas intestinales para regular el apetito.</li>
<li>Tras perder peso, el apetito aumenta unas 100 kcal/día por kilo, tres veces más que la caída del gasto: es la causa principal de la meseta y la recuperación.</li>
<li>Dormir poco aumenta la ingesta; el entorno y los alimentos muy apetecibles también.</li>
<li>Los fármacos GLP-1 reducen el hambre y producen pérdidas de 15 a 21 % en ensayos; al suspenderlos, el peso vuelve.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Una persona perdió 8 kg. Según Polidori y otros, ¿cuántas kcal diarias más tiende a comer, sin proponérselo, respecto de antes de la dieta?
<details><summary>Respuesta</summary><p>Alrededor de 800 kcal/día por encima de lo que comía durante la dieta si no se contrarresta, de las cuales solo una parte la compensa el menor gasto. Por eso mantener exige estrategias activas: proteína y fibra, entorno, sueño, actividad y, en algunos casos, tratamiento médico.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Por qué el aumento del apetito explica mejor la recuperación de peso que el «metabolismo lento»?
<details><summary>Respuesta</summary><p>Porque por cada kilo perdido el gasto baja unas 20 a 30 kcal/día, mientras que el apetito sube unas 100 kcal/día. Si la ingesta sigue al apetito, el balance se vuelve positivo antes de que el gasto baje mucho.</p></details></li>
</ol>
