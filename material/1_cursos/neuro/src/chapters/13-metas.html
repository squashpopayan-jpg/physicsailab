<p class="lead">«Visualice su meta como si ya la hubiera logrado» es quizá el consejo más repetido de la PNL y de la autoayuda. La investigación muestra algo más interesante: ciertas formas de imaginar y de hablarse sí mejoran el desempeño, pero imaginar el éxito con placer, sin pensar en los obstáculos, puede reducir el esfuerzo. Este capítulo separa unas de otras y cierra con una herramienta concreta, la hoja WOOP, conectada a su medidor de progreso.</p>

<section>
<h2>Práctica mental: imaginar el movimiento</h2>
<p>La <span class="term">práctica mental</span> consiste en ensayar una habilidad en la imaginación, sin moverse: el saque, el tiro libre, la secuencia de una rutina. Un metaanálisis clásico encontró que mejora el desempeño frente a no practicar, con un efecto moderado (d = 0,53), aunque menos que la práctica física (Driskell, Copper y Moran, 1994). Una réplica 24 años después, con 37 estudios y corrección por sesgo de publicación, confirmó un efecto positivo, más pequeño: r = 0,13, equivalente a d ≈ 0,26 (Toth y otros, 2020). Es un buen ejemplo de un efecto real que se encoge cuando se mide mejor.</p>
<p>La imaginación motora activa buena parte de las regiones que se usan al moverse, como la corteza premotora y el área motora suplementaria (Hétu y otros, 2013). Por eso funciona mejor cuando se parece a la ejecución real. El modelo <span class="term">PETTLEP</span> (Holmes y Collins, 2001) lo resume: imaginar con la postura física adecuada, en el entorno real, con la tarea y el ritmo verdaderos, ajustado al nivel de aprendizaje, con la emoción del momento y desde la propia perspectiva.</p>
<div class="sim" data-sim="mental" data-title="Práctica física, mental o combinada: modelo de aprendizaje"></div>
<div class="sim-guide"><ul>
<li>Modelo didáctico: cada sesión física acerca la habilidad a su máximo; cada sesión mental lo hace con una fracción de esa eficacia (por defecto, 40 %, coherente con que la práctica mental funciona pero menos que la física).</li>
<li>La práctica mental sola supera a no practicar; la física supera a la mental. Combinar reemplaza parte de las sesiones físicas sin perder mucho: útil cuando hay lesión, cansancio o poco tiempo de cancha.</li>
<li>Mueva la eficacia relativa al rango de los metaanálisis (de 20 a 50 %) y vea cuánto cambia la conclusión.</li>
</ul></div>
<div class="box evid"><p><span class="nivel n4">sólida</span>La práctica mental mejora el desempeño motor, con efecto pequeño a moderado y menor que el de la práctica física; combinada con práctica real es especialmente útil. <span class="nivel n0">refutada</span>Que «visualizar» sustituya la práctica o atraiga resultados por sí sola.</p></div>
</section>

<section>
<h2>Hablarse a sí mismo</h2>
<p>El <span class="term">autodiálogo</span> es lo que el deportista se dice antes y durante la acción. Un metaanálisis de 32 estudios encontró un efecto moderado sobre el rendimiento deportivo (d = 0,48), mayor en tareas de precisión y en tareas nuevas, y mayor cuando los deportistas entrenaban sus frases antes de competir (Hatzigeorgiadis y otros, 2011). Se distinguen dos tipos:</p>
<ul>
<li><b>Instruccional:</b> palabras clave de técnica, «codo alto», «mira la bola», «rodillas flexionadas». Mejor para tareas finas y de precisión.</li>
<li><b>Motivacional:</b> «vamos», «yo puedo», «aguanta». Mejor para fuerza y resistencia.</li>
</ul>
<div class="box do"><ul>
<li>Elija dos palabras clave técnicas para el gesto que está aprendiendo y una frase motivacional corta para el esfuerzo final. Practíquelas en el entrenamiento, no solo en competencia.</li>
</ul></div>
</section>

<section>
<h2>Metas que funcionan</h2>
<p>Después de cientos de estudios, Edwin Locke y Gary Latham (2002) concluyeron que las metas específicas y difíciles producen mejor desempeño que la instrucción vaga de «dar lo mejor», siempre que haya compromiso, retroalimentación y la capacidad necesaria. Pero tener una meta no basta: la brecha entre intención y acción es enorme. Dos técnicas cierran buena parte de ella:</p>
<ul>
<li><b>Intenciones de implementación:</b> planes «si… entonces…» que atan la conducta a una señal concreta: «si son las 6:30 de la mañana y suena la alarma, entonces me pongo la ropa de correr que dejé en la silla». En un metaanálisis de 94 pruebas independientes con más de 8.000 participantes, su efecto sobre el logro de metas fue de d = 0,65 (Gollwitzer y Sheeran, 2006).</li>
<li><b>Contraste mental (WOOP):</b> imaginar el resultado deseado y, enseguida, el obstáculo interno principal que lo impide, y luego formular el plan «si [obstáculo], entonces [acción]». Combinado con intenciones de implementación tiene un efecto pequeño a moderado (g = 0,34 en 21 estudios, Wang, Wang y Gai, 2021).</li>
</ul>
<div class="box evid"><p><span class="nivel n4">sólida</span>Las intenciones de implementación están entre las técnicas de cambio de conducta mejor estudiadas. Son la base del registro de hábitos de «Mi progreso» (apéndice A).</p></div>
</section>

<section>
<h2>Cuando fantasear resta</h2>
<p>Gabriele Oettingen dedicó su carrera a una pregunta incómoda: ¿ayuda imaginar con placer que uno ya logró su meta? En una serie de estudios con personas que buscaban empleo, estudiantes antes de un examen y pacientes que se recuperaban de una cirugía de cadera, quienes tenían <i>expectativas</i> positivas (creer que era probable lograrlo) se esforzaban más y les iba mejor; quienes tenían <i>fantasías</i> positivas (imaginarse disfrutando el éxito) se esforzaban menos y les iba peor (Oettingen y Mayer, 2002). En un estudio anterior con mujeres en un programa para bajar de peso, las que más fantaseaban con su figura delgada bajaron menos (Oettingen y Wadden, 1991). Las fantasías positivas incluso reducen la activación fisiológica: el cuerpo se relaja como si ya hubiera llegado (Kappes y Oettingen, 2011).</p>
<div class="box myth">
<p class="m"><b>Mito</b>«La ley de la atracción: si visualiza intensamente lo que desea, el universo se lo traerá».</p>
<p class="r"><b>Realidad</b>No hay ningún mecanismo conocido ni evidencia de que pensar en algo lo atraiga. Lo que sí existe es el efecto contrario: la fantasía placentera sin plan puede quitar energía. Lo que funciona es combinar el deseo con el obstáculo y con un plan concreto, y luego medir el avance.</p>
</div>
</section>

<section>
<h2>Su hoja WOOP</h2>
<p>WOOP son las iniciales en inglés de Deseo, Resultado, Obstáculo y Plan. Llénela para una meta de las próximas semanas, relacionada con hábitos, deporte o alimentación. Al final puede convertir el plan en un hábito de su medidor de progreso.</p>

<h2>Resumen, problemas y autoevaluación</h2>
<div class="box keys"><ul>
<li>La práctica mental mejora el desempeño motor, menos que la física; funciona mejor si se parece a la ejecución real (PETTLEP).</li>
<li>El autodiálogo entrenado mejora el rendimiento deportivo (d ≈ 0,48): instruccional para precisión, motivacional para esfuerzo.</li>
<li>Las metas específicas y difíciles superan al «haga lo mejor»; las intenciones de implementación «si… entonces…» cierran la brecha entre intención y acción (d ≈ 0,65).</li>
<li>Fantasear con el éxito sin pensar en obstáculos se asocia con menos esfuerzo; el contraste mental lo corrige.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Reescriba «voy a hacer más ejercicio» como intención de implementación.
<details><summary>Respuesta</summary><p>Por ejemplo: «Si es lunes, miércoles o viernes y salgo del trabajo, entonces camino 30 minutos por el parque antes de ir a casa».</p></details></li>
<li><span class="lvl">Intermedio</span>¿Qué NNT corresponde a d = 0,65?
<details><summary>Respuesta</summary><p>\(\Phi(0{,}65/\sqrt2)=\Phi(0{,}46)\approx0{,}677\); NNT \(=1/(2\cdot0{,}677-1)\approx2{,}8\).</p></details></li>
<li><span class="lvl">Intermedio</span>¿Por qué el efecto de la práctica mental bajó de 0,53 (1994) a 0,26 (2020)?
<details><summary>Respuesta</summary><p>Por la corrección del sesgo de publicación y por estudios más recientes y rigurosos; los metaanálisis antiguos tienden a sobrestimar los efectos (capítulo 1).</p></details></li>
</ol>
