<p class="lead">Estimular el cerebro con imanes, corrientes o electrodos implantados suena a ciencia ficción, y por eso mismo genera expectativas enormes. Algunas de estas técnicas tienen evidencia sólida para indicaciones concretas; otras se venden para mejorar la memoria, el ánimo o el rendimiento deportivo con muy poco respaldo. Este capítulo las ordena por su evidencia y explica el problema metodológico central: los tratamientos tecnológicos producen placebos muy potentes.</p>

<section>
<h2>Estimulación magnética transcraneal</h2>
<p>Una bobina sobre el cuero cabelludo produce un pulso magnético breve e intenso que induce una corriente eléctrica en la corteza subyacente (ley de Faraday), suficiente para hacer disparar neuronas: sobre la corteza motora produce una contracción de la mano. Con pulsos repetidos (rTMS) a alta frecuencia la excitabilidad de la región tiende a aumentar durante un tiempo, y a baja frecuencia, a disminuir: un fenómeno parecido a la potenciación y depresión de largo plazo del capítulo 4.</p>
<p>Su principal indicación es la depresión que no respondió a medicamentos, estimulando la corteza prefrontal dorsolateral izquierda. Un metaanálisis en red de ensayos controlados con estimulación simulada encontró que varias modalidades eran más eficaces que el simulado (Brunoni y otros, 2017). La estimulación con ráfagas theta intermitentes, de tres minutos por sesión, resultó no inferior a la rTMS clásica de 37 minutos (Blumberger y otros, 2018). Un protocolo acelerado, con diez sesiones diarias durante cinco días y guiado por resonancia, reportó remisión en cerca de 79 % de 29 participantes frente a 13 % con simulado (Cole y otros, 2022); un ensayo de réplica posterior con 48 participantes encontró un efecto menor.</p>
<div class="box evid"><p><span class="nivel n4">sólida</span>La rTMS es eficaz en la depresión resistente frente a estimulación simulada; la magnitud y la duración del beneficio varían mucho entre personas.</p></div>
</section>

<section>
<h2>Estimulación por corriente directa: cuánto llega al cerebro</h2>
<p>La estimulación transcraneal por corriente directa (tDCS) aplica 1 a 2 mA entre dos electrodos sobre el cuero cabelludo. Es barata, portátil y se vende para estudiar, meditar o entrenar. El problema físico es que el cuero cabelludo y el cráneo atenúan alrededor de 75 % de la corriente, y los campos que llegan a la corteza son menores que el que se necesitó para cambiar el disparo de neuronas en registros en ratas, de alrededor de 1 mV/mm (Vöröslakos y otros, 2018). Campos más débiles pueden modular la actividad de redes de manera sutil, pero no «encienden» neuronas.</p>
<p>Una revisión cuantitativa no encontró efectos cognitivos fiables de una sesión de tDCS en personas sanas (Horvath y otros, 2015). En la depresión, el ensayo ELECT-TDCS encontró que la tDCS era mejor que el placebo pero inferior al escitalopram (Brunoni y otros, 2017); los ensayos domiciliarios posteriores han dado resultados mixtos.</p>
<div class="box evid"><p><span class="nivel n2">preliminar</span>tDCS en depresión: efecto modesto y resultados mixtos. <span class="nivel n1">sin probar</span>Mejora cognitiva o deportiva en personas sanas: no hay efectos fiables.</p></div>
</section>

<section>
<h2>Electrodos implantados y electroconvulsiva</h2>
<ul>
<li><b>Estimulación cerebral profunda.</b> Electrodos implantados en estructuras como el núcleo subtalámico, conectados a un generador bajo la piel. En la enfermedad de Parkinson avanzada, mejoró la calidad de vida y los síntomas motores más que el tratamiento farmacológico solo (Deuschl y otros, 2006). En la depresión resistente, el ensayo BROADEN, con control simulado, no encontró diferencias (Holtzheimer y otros, 2017).</li>
<li><b>Estimulación de la médula espinal.</b> En personas con lesión medular, la estimulación eléctrica epidural sincronizada con la intención de caminar, junto con rehabilitación intensiva, permitió dar pasos y, en algunos casos, recuperar algo de control voluntario (Wagner y otros, 2018). Son pocos pacientes, pero un avance real. El ensayo de estimulación del nervio vago acoplada a la terapia está en el capítulo 27.</li>
<li><b>Terapia electroconvulsiva.</b> Provoca una convulsión breve bajo anestesia general. A pesar de su mala fama, es el tratamiento más eficaz para la depresión grave, en particular con síntomas psicóticos o riesgo vital (UK ECT Review Group, 2003). Su principal efecto adverso es la pérdida de memoria alrededor del periodo del tratamiento.</li>
</ul>
</section>

<section>
<h2>Neurofeedback</h2>
<p>En el neurofeedback, la persona ve en tiempo real una señal de su propia actividad cerebral (por lo general, el electroencefalograma) y aprende a modificarla, por ejemplo aumentando ciertas frecuencias mientras se concentra. Es un caso de aprendizaje por refuerzo (capítulo 7) aplicado a una señal cerebral, y es posible aprender a cambiar esas señales. La pregunta clínica es si eso mejora los síntomas.</p>
<p>La indicación más estudiada es el trastorno por déficit de atención e hiperactividad (TDAH). Un metaanálisis encontró que el neurofeedback mejoraba los síntomas según los padres, que sabían qué tratamiento recibía su hijo, pero no según evaluadores probablemente ciegos, como los maestros (Cortese y otros, 2016). En adultos con TDAH, un ensayo con tres grupos (neurofeedback, neurofeedback simulado y psicoterapia de grupo) encontró mejoras parecidas en los tres (Schönenberg y otros, 2017).</p>
<div class="sim" data-sim="evaluadores" data-title="El mismo ensayo calificado por padres y por maestros"></div>
<div class="sim-guide"><ul>
<li>Cada ensayo simulado tiene los mismos niños; solo cambia quién califica. Los padres saben qué recibió su hijo y tienen cierto sesgo; los maestros, no.</li>
<li>Con un efecto real casi nulo, el combinado de los padres sale claramente positivo y el de los maestros, mucho menor: el patrón de Cortese y otros (2016). Lo que queda en los maestros es el placebo, porque el control es una lista de espera.</li>
<li>Active el control con tratamiento simulado: el combinado de los maestros se acerca al efecto real, pero el de los padres sigue inflado por su sesgo. Hacen falta las dos cosas: simulado y evaluación ciega.</li>
</ul></div>
<div class="box evid"><p><span class="nivel n2">incierta</span>El neurofeedback no ha demostrado eficacia en el TDAH en ensayos con control simulado y evaluación ciega; su beneficio podría depender en gran parte de efectos inespecíficos.</p></div>
</section>

<div class="box safe"><p>Los dispositivos de estimulación que se venden directamente al consumidor no tienen la eficacia demostrada que suele anunciarse, y aplicar corriente en la cabeza sin supervisión puede causar quemaduras en la piel. Para depresión u otros trastornos, consulte con un psiquiatra, que puede valorar si una neuromodulación con evidencia es adecuada.</p></div>

<section>
<h2>Resumen, problemas y autoevaluación</h2>
<div class="box keys"><ul>
<li>La rTMS, la electroconvulsiva y la estimulación profunda tienen indicaciones concretas con evidencia sólida.</li>
<li>La tDCS aplica corrientes débiles que llegan muy atenuadas al cerebro; no mejora la cognición de personas sanas de forma fiable.</li>
<li>El neurofeedback funciona como aprendizaje, pero en el TDAH su efecto desaparece con evaluadores ciegos.</li>
<li>Los tratamientos tecnológicos producen placebos potentes: exigen control simulado y evaluación ciega.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Un anuncio de un casco de tDCS para deportistas cita un estudio con 12 personas, sin grupo simulado, en el que mejoró el salto. ¿Qué le falta para convencerlo?
<details><summary>Respuesta</summary><p>Un control con estimulación simulada, asignación al azar, evaluación ciega, un tamaño de muestra adecuado, registro previo y replicación independiente. Sin ellos, la mejora puede deberse a la práctica, la regresión a la media o la expectativa.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Por qué en el neurofeedback no basta con un grupo control de lista de espera?
<details><summary>Respuesta</summary><p>Porque el grupo tratado recibe atención, una tecnología impresionante y la expectativa de mejorar; la lista de espera no controla nada de eso. El neurofeedback simulado (señal que no corresponde a la propia actividad) iguala esas condiciones.</p></details></li>
</ol>
