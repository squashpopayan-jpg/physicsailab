<p class="lead">Las simulaciones del curso no usan bibliotecas científicas: todas las funciones (la neurona de Hodgkin-Huxley, el cable, las reglas de plasticidad, el aprendizaje por refuerzo, el metaanálisis, la curva de los hábitos, el modelo de Banister, el modelo de peso de Hall y los demás) están escritas desde cero en JavaScript. Para confiar en ellas, cada una se compara aquí con una implementación independiente, con un valor publicado o con una identidad matemática exacta. Las pruebas se pueden ejecutar en el navegador.</p>

<section>
<h2>Cómo se valida</h2>
<p>Un programa en Python (<code>tests/referencias.py</code>) calcula los mismos casos con herramientas independientes, y sus resultados se incrustan en el curso:</p>
<ul>
<li><strong>SciPy</strong>: integración de ecuaciones diferenciales con <code>solve_ivp</code> (neurona de Hodgkin-Huxley, modelo de peso de Hall), ajustes no lineales con <code>curve_fit</code> (curva de los hábitos de Lally, curvas de aprendizaje), distribuciones (normal truncada, \(t\) de Student, \(t\) no central para la potencia) y la prueba de Welch.</li>
<li><strong>NumPy</strong>: los potenciales de Nernst y Goldman-Hodgkin-Katz, la regla de Oja (vector propio principal), la red de Hopfield, el aprendizaje por diferencias temporales, el modelo de Banister por suma directa, la monotonía de Foster y el filtro de Kalman.</li>
<li><strong>Valores publicados</strong>: el metaanálisis de los 13 ensayos de la vacuna BCG, que el paquete <i>metafor</i> de R usa como ejemplo (efecto combinado, heterogeneidad y \(Q\) de Cochran); las ecuaciones originales de Mifflin-St Jeor, Deurenberg y Frayn; la regla de Hall de 100 kJ por kilo.</li>
<li><strong>Identidades exactas</strong>: la correlación espuria de 1/2 en el cociente agudo:crónico acoplado; la solución cerrada de la regla delta en la extinción; un bloqueo total de 1 cm de axón detiene el impulso.</li>
</ul>
<p>Además, los 16 programas en Python que aparecen en los capítulos se ejecutan de nuevo antes de cada versión y sus salidas se incrustan tal como salen.</p>
<div class="box note"><p>Fuera del navegador, <code>node tests/validar.js</code> ejecuta las mismas pruebas. Si se cambia un modelo, <code>python tests/referencias.py</code> regenera las referencias y <code>python tests/correr_py.py</code> vuelve a ejecutar los programas.</p></div>
</section>
