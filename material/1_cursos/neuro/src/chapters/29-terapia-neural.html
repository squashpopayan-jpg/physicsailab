<p class="lead">La terapia neural consiste en inyectar pequeñas dosis de anestésico local (procaína o lidocaína) en cicatrices, puntos dolorosos, alrededor de nervios y ganglios, y en otros lugares que la teoría considera «campos de interferencia». En Colombia es muy conocida: la practican médicos y se enseña en programas de posgrado de medicina alternativa. Este capítulo la examina con las mismas reglas que el resto del curso: separa la farmacología, que es sólida, de la teoría que la acompaña y de la evidencia clínica, que es escasa.</p>

<section>
<h2>Origen y teoría</h2>
<p>Los hermanos Ferdinand y Walter Huneke, médicos alemanes, observaron en la década de 1920 que una inyección intravenosa de procaína alivió de forma inmediata la migraña de su hermana. En 1940, Ferdinand Huneke inyectó procaína en la cicatriz de una antigua osteomielitis en la pierna de una paciente con dolor crónico de hombro, y el dolor del hombro desapareció en segundos. Lo llamó «fenómeno en segundos».</p>
<p>De ahí surgió la teoría central: cicatrices, dientes, amígdalas u otros tejidos alterados serían <span class="term">campos de interferencia</span> que, a través del sistema nervioso vegetativo, causarían enfermedades a distancia; el anestésico local «borraría» esa interferencia y el sistema se reorganizaría. Es una teoría coherente en su lenguaje, pero sus elementos centrales no se han demostrado: no hay un método fiable para identificar un campo de interferencia, ni ensayos controlados que muestren que inyectar en él produzca más beneficio que inyectar en otro lugar o que un procedimiento simulado.</p>
</section>

<section>
<h2>Lo que hace un anestésico local</h2>
<p>La procaína (un éster, de acción corta) y la lidocaína (una amida) se unen a los canales de sodio dependientes de voltaje desde el interior de la membrana y los bloquean. Sin la corriente de sodio no hay espiga (capítulo 2), y sin espigas el impulso no se conduce. Es farmacología establecida: sobre ella descansan la anestesia regional y buena parte del tratamiento del dolor agudo. El efecto es reversible y dura de minutos a pocas horas según el fármaco y la dosis.</p>
<p>La simulación usa el axón de Hodgkin-Huxley del capítulo 2 extendido como cable: 60 compartimentos de 1 mm. Un tramo del axón tiene parte de sus canales de sodio bloqueados.</p>
<div class="sim" data-sim="bloqueo" data-title="Un impulso que llega a un tramo con anestésico"></div>
<div class="sim-guide"><ul>
<li>El mapa muestra el voltaje en cada punto del axón (horizontal) a lo largo del tiempo (vertical). La franja diagonal es el impulso que avanza; su pendiente es la velocidad.</li>
<li>Con 100 % de bloqueo en 1 cm, el impulso se detiene. Reduzca el largo a 0,3 cm: la corriente que fluye dentro del axón salta el tramo y el impulso continúa.</li>
<li>Con 1 cm, baje el porcentaje bloqueado: por debajo de cierto nivel, el impulso pasa más lento. Un bloqueo parcial necesita ser profundo y extenso.</li>

<p>Un segundo rasgo de los anestésicos locales explica por qué alivian el dolor con dosis que no paralizan: el <span class="term">bloqueo dependiente del uso</span>. El fármaco se une con más afinidad a los canales abiertos o inactivados, que abundan en un axón que dispara a menudo. Las fibras que transmiten dolor intenso, que disparan en ráfagas, se bloquean más que las que están en reposo. También influye que las fibras finas se bloquean con un tramo expuesto más corto que las gruesas.</p>
<div class="sim" data-sim="uso-dependiente" data-title="Bloqueo dependiente del uso"></div>
<div class="sim-guide"><ul>
<li>Una neurona de Hodgkin-Huxley recibe un tren de estímulos durante un segundo. La curva naranja es la fracción de canales de sodio bloqueados (modelo de receptor modulado simplificado, con parámetros ilustrativos).</li>
<li>A 20 Hz casi todos los estímulos producen una espiga. A 50 Hz el bloqueo se acumula con cada espiga y empiezan a fallar.</li>
<li>Ponga la concentración en 0 y compare: las fallas a 100 Hz sin fármaco se deben al período refractario, no al anestésico.</li>
</ul></div>
</section>

<section>
<h2>Bloqueos con anestésico que sí se han estudiado</h2>
<ul>
<li><b>Anestesia regional y bloqueos de nervio:</b> eficacia indiscutida para el dolor de cirugía y procedimientos.</li>
<li><b>Lidocaína por vía intravenosa</b> en dolor neuropático: mejor que el placebo en ensayos pequeños, con efecto de duración limitada (Challapalli y otros, 2005).</li>
<li><b>Puntos gatillo miofasciales:</b> inyectar anestésico alivia, pero una revisión sistemática encontró que la punción seca, sin sustancia, daba resultados parecidos: la aguja parecía importar más que el fármaco (Cummings y White, 2001).</li>
<li><b>Bloqueo del ganglio estrellado</b> en el estrés postraumático: un ensayo con 113 militares y control con inyección de solución salina encontró una reducción mayor de los síntomas a las 8 semanas (Rae Olmsted y otros, 2020). Es un resultado interesante y todavía en estudio.</li>
<li><b>Bloqueo simpático en el síndrome de dolor regional complejo:</b> una revisión Cochrane no encontró que fuera mejor que el placebo, con estudios pequeños y de baja calidad (O'Connell y otros, 2016).</li>
<li><b>Inyecciones en el dolor lumbar crónico:</b> otra revisión Cochrane concluyó que la evidencia era insuficiente para recomendarlas en general (Staal y otros, 2008).</li>
</ul>
<p>En resumen, inyectar anestésico local cerca de un generador de dolor puede ayudar, a veces de forma notable. Eso no valida la teoría de los campos de interferencia, que afirma algo distinto: que inyectar en una cicatriz o un diente cura enfermedades a distancia.</p>
</section>

<section>
<h2>La evidencia de la terapia neural</h2>
<p>El estudio más citado es una serie de 280 pacientes con dolor crónico resistente, derivados a una consulta de terapia neural en Suiza. Al año, 41 no tenían dolor, 126 estaban considerablemente mejor, 52 algo mejor y 60 igual; no hubo efectos adversos (Egli y otros, 2015). Los autores reconocen que, sin grupo de comparación, no se puede saber cuánto de esa mejora se debe al tratamiento. Una revisión de alcance de 2023, firmada por autores vinculados a la terapia neural, reunió 129 estudios sobre anestésicos locales a dosis bajas: 55 % eran observacionales y la revisión no combinó los efectos (Vinyes y otros, 2023).</p>
<p>¿Por qué una serie de casos sin control engaña? Las personas consultan cuando su dolor está peor que de costumbre, y el dolor crónico fluctúa. Con el tiempo tiende a volver a su nivel habitual (regresión a la media e historia natural, capítulo 1), con o sin tratamiento.</p>
<div class="sim" data-sim="serie-casos" data-title="Una serie de 280 pacientes con un tratamiento que no hace nada"></div>
<div class="sim-guide"><ul>
<li>Cada paciente simulado tiene su nivel de dolor propio y semanas mejores y peores. Consulta cuando su dolor llega al umbral y se le mide de nuevo seis meses después.</li>
<li>Con efecto real 0, la «serie de casos» muestra una mejora media de varios puntos, y muchos pacientes mejoran 30 % o más. El grupo sin tratamiento, que la serie no tiene, mejora lo mismo.</li>
<li>Suba el efecto real a 1 punto: solo la comparación con el grupo sin tratamiento permite verlo.</li>
</ul></div>
<p>A eso se suman otros efectos inespecíficos que en la terapia neural son grandes: las inyecciones producen más efecto placebo que las pastillas, la consulta suele ser larga y atenta, y la aguja por sí misma puede modular el dolor. Nada de eso es despreciable para el paciente, pero no demuestra el mecanismo que se afirma.</p>
<div class="box verdict"><p><b>Veredicto.</b> <span class="nivel n4">sólida</span>Los anestésicos locales bloquean la conducción nerviosa: farmacología establecida. <span class="nivel n2">preliminar</span>Inyectarlos cerca de algunos generadores de dolor puede aliviar, con evidencia variable según la indicación. <span class="nivel n1">sin probar</span>La terapia neural como sistema (campos de interferencia, fenómeno en segundos, curación de enfermedades a distancia) no tiene ensayos controlados que la respalden; su evidencia son series de casos y opiniones de expertos.</p></div>
</section>

<section>
<h2>Seguridad y qué preguntar</h2>
<p>En manos entrenadas, con dosis bajas, las inyecciones de anestésico local tienen pocos efectos adversos. Los riesgos existen: inyección accidental en un vaso (toxicidad del anestésico, con convulsiones o arritmias), neumotórax en inyecciones cerca del tórax o del cuello, infecciones, lesión de un nervio y alergia a la procaína. El riesgo mayor suele ser otro: retrasar un diagnóstico o un tratamiento eficaz.</p>
<div class="box safe"><ul>
<li>Exija que lo atienda un médico con formación en la técnica, que revise su diagnóstico convencional y no le pida abandonar tratamientos indicados.</li>
<li>Pregunte qué espera lograr, en cuánto tiempo y cómo se medirá; si después de unas pocas sesiones no hay cambio, es razonable parar.</li>
<li>Desconfíe de promesas de curar enfermedades graves (cáncer, autoinmunes, infecciones) con inyecciones en cicatrices o dientes.</li>
</ul></div>
</section>

<section>
<h2>Resumen, problemas y autoevaluación</h2>
<div class="box keys"><ul>
<li>La terapia neural de Huneke inyecta anestésicos locales en cicatrices, puntos y ganglios según la teoría de los campos de interferencia.</li>
<li>La procaína y la lidocaína bloquean canales de sodio: hace falta un bloqueo profundo y extenso para detener el impulso, y los axones que disparan rápido se bloquean más.</li>
<li>Algunos bloqueos con anestésico tienen evidencia; la terapia neural como sistema no tiene ensayos controlados.</li>
<li>Las series de casos sin control muestran mejoras grandes aunque el tratamiento no haga nada.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Un paciente dice: «me inyectaron la cicatriz de la cesárea y se me quitó el dolor de espalda en segundos». ¿Qué explicaciones alternativas hay que descartar antes de aceptar la teoría de los campos de interferencia?
<details><summary>Respuesta</summary><p>El efecto placebo de un procedimiento con aguja, la expectativa, la atención del médico, la distracción por el pinchazo, la fluctuación natural del dolor y que el anestésico absorbido tenga un efecto general breve. Solo un ensayo que compare con una inyección simulada o en otro lugar, con evaluación ciega, puede separarlas.</p></details></li>
<li><span class="lvl">Intermedio</span>Según la simulación del cable, ¿por qué un anestésico aplicado en un punto muy pequeño de un nervio puede no bloquearlo?
<details><summary>Respuesta</summary><p>Porque la corriente que fluye por dentro del axón desde la zona activa despolariza la membrana más allá del tramo bloqueado. Si ese tramo es más corto que la distancia que la señal puede saltar electrotónicamente, el impulso se regenera del otro lado.</p></details></li>
</ol>
