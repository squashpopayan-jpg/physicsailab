    <div class="home-kicker">Curso interactivo · Para aprender, aplicar y enseñar</div>
    <h1 class="home-title"><em>Recablear</em><span>neuroplasticidad, PNL bajo la lupa, hábitos, deporte y grasa corporal con evidencia</span></h1>
    <p class="home-lead">Seguramente le han dicho que puede «reprogramar su mente» en un fin de semana, que los ojos delatan si alguien miente o que basta visualizar una meta para alcanzarla. Detrás de esas promesas hay algo verdadero y muy poderoso: el cerebro sí cambia con la experiencia, toda la vida. Este curso explica cómo lo hace, desde la neurona hasta los hábitos, con las teorías que la ciencia ha puesto a prueba, modelos que se pueden programar y simulaciones validadas. Separa lo que funciona de lo que no, y lo aplica a tres metas concretas: construir hábitos, rendir mejor en el deporte y perder grasa sin perder salud.</p>
    <div class="maxwell-strip" aria-label="Cuatro ecuaciones que recorren el curso">
      <div><small>Plasticidad de Hebb</small>\[\Delta w_{ij}=\eta\,x_i\,y_j\]</div>
      <div><small>Error de predicción (dopamina)</small>\[\delta_t=r_t+\gamma V_{t+1}-V_t\]</div>
      <div><small>Automaticidad de un hábito</small>\[A(t)=a-b\,\ee^{-ct}\]</div>
      <div><small>Balance de energía</small>\[\rho_F\dot F+\rho_L\dot L=\text{EI}-\text{EE}\]</div>
    </div>
    <p class="home-count ctrl-note" style="margin-top:14px;font-size:13px"></p>
    <p class="home-author"><small>Elaborado por</small><b>Mg. Manuel Alejandro Obando</b><span>Departamento de Física · Universidad del Cauca</span></p>
  </div>
  <div class="home-live">
    <div class="sim" data-sim="home-hero" data-num="En vivo" data-title="Neuronas que se activan juntas se conectan"></div>
    <p class="home-note"><b>Cómo leer la animación.</b> Cada punto es una neurona y cada línea, una sinapsis; el grosor es su fuerza. Primero se activan una y otra vez dos grupos de neuronas (dos «experiencias»). Las sinapsis entre neuronas que se activan juntas se fortalecen. Después basta estimular dos neuronas de un grupo para que se encienda el grupo completo: la red completó un recuerdo a partir de una pista. Eso es plasticidad sináptica, y es el tema del capítulo 4.</p>
  </div>

<div class="home-howto">
  <div><b>El semáforo de la evidencia</b><p>Cada afirmación importante lleva su nivel: <span class="nivel n4">sólida</span> (varios metaanálisis o ensayos grandes coinciden), <span class="nivel n3">moderada</span> (ensayos controlados con limitaciones), <span class="nivel n2">preliminar</span> (pocos estudios, pequeños o del mismo grupo), <span class="nivel n1">sin probar</span> (solo teoría o testimonios) y <span class="nivel n0">refutada</span> (se puso a prueba y no se sostuvo). Los modelos matemáticos llevan <span class="nivel n5">modelo</span>: son herramientas para pensar, no hallazgos.</p></div>
  <div><b>Modelos que se programan</b><p>La neurona de Hodgkin y Huxley, la plasticidad de Hebb, la dopamina como error de predicción o el modelo de peso corporal de los Institutos Nacionales de Salud de EE. UU. corren en su navegador. Cada uno se validó contra una implementación independiente en Python con SciPy (apéndice E), y varios capítulos traen el programa en Python para estudiarlo.</p></div>
  <div><b>De la teoría a la conducta</b><p>Cada capítulo termina con tareas para la semana, problemas con respuesta y una autoevaluación que queda registrada. El apéndice A, «Mi progreso», lleva sus hábitos, entrenamientos y medidas con las mismas herramientas estadísticas que se explican en el curso.</p></div>
  <div><b>Sin promesas falsas</b><p>Nada aquí reemplaza a un médico, un psicólogo o un nutricionista. Cuando una técnica no tiene respaldo se dice, se explica por qué parece funcionar y se ofrece la alternativa que sí lo tiene. Las fuentes son artículos revisados por pares, enlazados al final de cada capítulo.</p></div>
