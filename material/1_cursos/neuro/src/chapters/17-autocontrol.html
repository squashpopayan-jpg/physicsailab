<p class="lead">Casi todos creemos que nos falta fuerza de voluntad. La investigación sugiere otra cosa: las personas que parecen tener mucho autocontrol no son las que más resisten, sino las que menos necesitan resistir, porque organizan su vida para evitar las tentaciones. Este capítulo explica por qué la «voluntad» falla justo cuando más la necesitamos, qué tiene que ver el estrés, y qué hacer después de una recaída.</p>

<section>
<h2>El mito del tanque de fuerza de voluntad</h2>
<p>En 1998, Roy Baumeister y sus colegas propusieron que el autocontrol funciona como un músculo o un tanque de combustible: usarlo en una tarea lo agota para la siguiente. Lo llamaron <span class="term">agotamiento del yo</span>. Cientos de estudios parecieron confirmarlo y la idea pasó a la cultura popular. Pero en 2016, un proyecto de 23 laboratorios con más de 2.000 participantes encontró un efecto de d = 0,04, prácticamente nulo (Hagger y otros, 2016). Un segundo proyecto, diseñado con los propios defensores de la teoría, con 36 laboratorios y 3.531 participantes, encontró d = 0,06 en su análisis preregistrado (Vohs y otros, 2021).</p>
<div class="box evid"><p><span class="nivel n0">refutado o muy exagerado</span>El agotamiento del yo como recurso limitado que se gasta en minutos. La idea relacionada de que el autocontrol se «recarga» con glucosa tampoco resistió. Lo que sí está claro es que el cansancio, el sueño insuficiente y el estrés reducen el autocontrol, por mecanismos distintos.</p></div>
</section>

<section>
<h2>Qué hacen las personas con buen autocontrol</h2>
<p>Wilhelm Hofmann y sus colegas (2012) dieron teléfonos a 205 adultos que, varias veces al día, reportaban si sentían un deseo y si intentaban resistirlo. Sorpresa: quienes puntuaban alto en autocontrol no resistían más a menudo; reportaban <i>menos</i> tentaciones. Otros estudios muestran que el autocontrol se asocia a buenos resultados en la vida en buena parte porque esas personas tienen más hábitos beneficiosos (Galla y Duckworth, 2015). El autocontrol eficaz es, sobre todo, estratégico:</p>
<div class="tablewrap"><table>
<thead><tr><th>Estrategia (de más a menos temprana)</th><th>Ejemplo</th></tr></thead>
<tbody>
<tr><td>Elegir la situación</td><td>No ir al centro comercial a pasear; no comprar dulces.</td></tr>
<tr><td>Modificar la situación</td><td>Celular en otra habitación; frutas a la vista, galletas en lo alto.</td></tr>
<tr><td>Dirigir la atención</td><td>Mirar otra cosa, cambiar de tema cuando aparece la tentación.</td></tr>
<tr><td>Reinterpretar</td><td>Pensar en la galleta como «azúcar con harina» o en sus consecuencias.</td></tr>
<tr><td>Resistir la respuesta</td><td>Aguantar las ganas en el momento: la más costosa y la menos fiable.</td></tr>
</tbody></table></div>
<p>Duckworth, Gendler y Gross (2016) llamaron a las primeras <span class="term">estrategias situacionales</span> y mostraron que son las que más rinden: actúan antes de que el deseo se active.</p>
</section>

<section>
<h2>Por qué cambiamos de opinión: el descuento hiperbólico</h2>
<p>Hoy decido que mañana no me comeré el postre. Mañana, frente al postre, elijo comerlo. ¿Incoherente? George Ainslie (1975) mostró que es lo esperable si valoramos las recompensas futuras con una curva <i>hiperbólica</i>: el valor de una recompensa cae muy rápido cuando está cerca y despacio cuando está lejos.</p>
<div class="eq key" data-name="Descuento hiperbólico">\[V=\frac{A}{1+kD}\qquad\text{frente al exponencial}\qquad V=A\,\ee^{-rD}.\]</div>
<div class="sim" data-sim="descuento" data-title="Inversión de preferencias: el postre de hoy contra la meta de dentro de un tiempo"></div>
<div class="sim-guide"><ul>
<li>Dos recompensas: una pequeña y temprana (el postre, quedarse en la cama) y otra grande y tardía (la salud, la meta). Las curvas muestran cuánto vale cada una vista desde cada momento.</li>
<li>Con descuento hiperbólico, las curvas se cruzan: desde lejos se prefiere la grande; cuando la pequeña está al alcance, gana ella. Es la «debilidad de voluntad» en una gráfica.</li>
<li>Con descuento exponencial no hay cruce: la preferencia es la misma en todo momento. Pruebe a decidir antes del cruce: es lo que hace un compromiso previo.</li>
</ul></div>
<p>La consecuencia práctica es poderosa: las decisiones conviene tomarlas lejos de la tentación y dejarlas «amarradas». Ulises se ató al mástil para oír a las sirenas. Comprar solo comida saludable, inscribirse con un amigo, pagar por adelantado o acordar una cita de entrenamiento son ataduras modernas.</p>
</section>

<section>
<h2>El estrés empuja hacia los hábitos viejos</h2>
<p>Lars Schwabe y Oliver Wolf (2009) estresaron a un grupo de personas (con la mano en agua helada) antes de una tarea de aprendizaje con devaluación. Las personas estresadas siguieron haciendo la acción aunque su premio ya no les interesaba: el estrés desplazó el control de la conducta del sistema dirigido a metas al de hábitos. Es lo que vivimos cuando, después de un día terrible, terminamos haciendo exactamente lo que nos propusimos dejar.</p>
<div class="sim" data-sim="estres" data-title="Un hábito nuevo compite con uno viejo: qué pasa en los días de estrés"></div>
<div class="sim-guide"><ul>
<li>Modelo didáctico: la elección depende de una parte dirigida a metas (que prefiere la conducta nueva) y de la fuerza de los hábitos (el viejo empieza fuerte). El estrés reduce el peso de la parte dirigida a metas.</li>
<li>En días normales, la conducta nueva gana pronto. En días de estrés, el hábito viejo vuelve a ganar, hasta que el nuevo acumula suficiente fuerza propia.</li>
<li>Por eso conviene que el hábito nuevo esté bien automatizado antes de las épocas difíciles, y planificar de antemano qué hacer en los días malos.</li>
</ul></div>
</section>

<section>
<h2>Antojos, recaídas y autocompasión</h2>
<p>Un antojo es, en buena parte, una respuesta condicionada: las señales asociadas a la recompensa (el olor, la hora, el lugar, una emoción) disparan el deseo (capítulo 7). Las recaídas casi nunca ocurren al azar: suelen seguir a emociones negativas, a presión social o a la exposición a esas señales (Marlatt y Gordon, 1985). Tres herramientas con respaldo:</p>
<ul>
<li><b>Prevención de recaídas:</b> identificar las situaciones de alto riesgo y tener un plan «si… entonces…» para cada una.</li>
<li><b>Atención plena para las urgencias:</b> observar el deseo como una ola que sube, llega a un pico y baja, sin actuar sobre él. En un ensayo con 286 personas en tratamiento por consumo de sustancias, la prevención de recaídas basada en atención plena y la prevención de recaídas cognitivo-conductual redujeron las recaídas frente al tratamiento habitual; a los 12 meses, el grupo de atención plena tuvo menos días de consumo (Bowen y otros, 2014).</li>
<li><b>Autocompasión después del desliz:</b> tratarse con amabilidad en lugar de castigarse reduce el efecto «ya qué». En un experimento, personas que hacían dieta y comieron una dona comieron después menos dulces si se les animó a no juzgarse con dureza (Adams y Leary, 2007).</li>
</ul>
<div class="box safe"><p>Si un consumo de alcohol, drogas, juego o comida se siente fuera de control, o si se acompaña de tristeza persistente o ideas de hacerse daño, busque ayuda profesional. En Colombia, ante una emergencia, la línea 123 activa la atención urgente; ciudades como Bogotá y Cali tienen la línea 106 de apoyo psicológico gratuito, y su EPS debe ofrecerle atención en salud mental.</p></div>
</section>

<section>
<h2>Resumen, problemas y autoevaluación</h2>
<div class="box keys"><ul>
<li>El agotamiento del yo como tanque que se vacía no resistió las réplicas de muchos laboratorios.</li>
<li>Las personas con buen autocontrol se exponen a menos tentaciones y tienen buenos hábitos; las estrategias situacionales son las más eficaces.</li>
<li>El descuento hiperbólico explica las inversiones de preferencia; los compromisos previos las aprovechan.</li>
<li>El estrés desplaza la conducta hacia los hábitos; conviene automatizar antes de las épocas difíciles.</li>
<li>Las recaídas siguen a señales y emociones; planes si-entonces, atención plena y autocompasión ayudan a que un desliz no se vuelva recaída.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Con \(k=0{,}5\) por día, ¿cuánto vale hoy una recompensa de 100 dentro de 10 días y una de 60 dentro de 1 día? ¿Y si ambas se alejan 20 días más?
<details><summary>Respuesta</summary><p>Hoy: \(100/6\approx16{,}7\) frente a \(60/1{,}5=40\): gana la pequeña. Con 20 días más: \(100/16\approx6{,}25\) frente a \(60/11{,}5\approx5{,}22\): gana la grande. Inversión de preferencias.</p></details></li>
<li><span class="lvl">Intermedio</span>Proponga tres estrategias situacionales para no comer a deshoras viendo televisión.
<details><summary>Respuesta</summary><p>No comprar los snacks; si los hay, guardarlos fuera de la vista y lejos del sofá; dejar preparada una alternativa (fruta lavada, agua) y comer solo en la mesa.</p></details></li>
</ol>
