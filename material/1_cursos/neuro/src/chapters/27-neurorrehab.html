<p class="lead">El caso en que la neuroplasticidad tiene más consecuencias prácticas es la recuperación después de una lesión cerebral. Tras un ictus, el cerebro reorganiza sus mapas (capítulo 6), y lo que la persona hace en las semanas y meses siguientes influye en esa reorganización. Este capítulo resume lo que se sabe sobre cómo aprovecharla, con modelos que explican por qué la dosis y el momento importan, y con los resultados, a veces decepcionantes, de los ensayos.</p>

<section>
<h2>Lo que el uso hace al mapa</h2>
<p>Randolph Nudo y sus colegas produjeron pequeñas lesiones en la corteza motora de la mano de monos ardilla. Sin rehabilitación, el territorio cortical de la mano en la zona vecina a la lesión se reducía. Con entrenamiento diario de la mano, ese territorio se conservaba e incluso se expandía hacia zonas del codo y el hombro, y la mano recuperaba más destreza (Nudo y otros, 1996). La reorganización después de una lesión no es automática: depende del uso.</p>
<p>Edward Taub observó en monos un fenómeno complementario, el <span class="term">no uso aprendido</span>: después de la lesión, cada intento con el miembro afectado fracasa, el animal aprende a usar el sano y el afectado se deteriora por falta de uso, aunque podría funcionar mejor. De ahí nació la <span class="term">terapia de restricción del lado sano</span>: inmovilizar el brazo sano durante buena parte del día y practicar intensivamente con el afectado. El ensayo EXCITE, con 222 pacientes entre 3 y 9 meses después del ictus, encontró mejoras en la función del brazo y en su uso cotidiano frente a la atención habitual, que se mantenían al año (Wolf y otros, 2006).</p>
</section>

<section>
<h2>Un modelo del no uso aprendido: la dosis tiene umbral</h2>
<p>Cheol Han, Michael Arbib y Nicolas Schweighofer formalizaron la idea con un modelo que une el aprendizaje por refuerzo del capítulo 7 con la plasticidad dependiente del uso (Han y otros, 2008). Cada día la persona tiene muchas oportunidades de elegir un brazo. Elige el afectado según cuánto espera que funcione; si lo usa, su habilidad mejora un poco; si no, se deteriora. Ese sistema tiene dos equilibrios estables: uno en el que el brazo afectado casi no se usa y empeora, y otro en el que se usa tanto como el sano y sigue mejorando.</p>

<div class="sim-guide"><ul>
<li>Sin terapia (líneas grises), el paciente usa cada vez menos el brazo afectado y su habilidad cae.</li>
<li>Con 25 usos forzados diarios durante 14 días, la habilidad sube lo suficiente para que el paciente siga eligiendo ese brazo solo, y el uso espontáneo mantiene la mejora el resto del año.</li>

<section>
<h2>¿Cuánto y cuándo?</h2>
<p>Los ensayos sobre la dosis dan resultados menos limpios que el modelo. En personas con ictus de más de seis meses de evolución, multiplicar por tres el número de repeticiones de práctica de tareas no produjo más mejora funcional (Lang y otros, 2016). En los primeros días, más tampoco es siempre mejor: en el ensayo AVERT, con 2 104 pacientes, levantar y movilizar muy pronto y con mucha frecuencia (dentro de las primeras 24 horas) redujo la probabilidad de un buen resultado a los tres meses (AVERT Trial Collaboration Group, 2015).</p>
<p>En roedores, la rehabilitación iniciada en las primeras semanas después de un infarto cerebral es mucho más eficaz que la iniciada un mes después, lo que sugiere un <span class="term">periodo sensible</span> con más plasticidad. El ensayo CPASS lo puso a prueba en humanos: añadió 20 horas de terapia del brazo en distintos momentos y encontró el mayor beneficio cuando se aplicaba entre 60 y 90 días después del ictus, menor antes de los 30 días y ninguno a los seis meses o después (Dromerick y otros, 2021). Es un ensayo pequeño de fase II, pero coincide con lo observado en animales.</p>
</section>

<section>
<h2>La «regla del 70 %» y el techo de la escala</h2>
<p>Varios estudios observaron que, en los tres primeros meses, muchos pacientes recuperan alrededor de 70 % de la función que les falta en el brazo, medida con la escala de Fugl-Meyer, que tiene un máximo de 66 puntos (Prabhakaran y otros, 2008). La regla se interpretó como un proceso biológico fijo. Después, varios autores señalaron que la correlación entre la deficiencia inicial y el cambio puede aparecer en parte por razones matemáticas: el cambio contiene el valor inicial (acoplamiento, como en el capítulo 21) y la escala tiene techo, de modo que quien empieza cerca del máximo no puede mejorar mucho (Hope y otros, 2019). Otros grupos defienden que, analizada de forma correcta, la relación existe. El debate sigue abierto.</p>
<div class="sim" data-sim="proporcional" data-title="Una «recuperación proporcional» que sale del techo de la escala"></div>
<div class="sim-guide"><ul>
<li>A cada paciente simulado se le sortea una recuperación sin ninguna relación con su deficiencia inicial.</li>
<li>Con el techo activado, aparece una correlación positiva fuerte entre deficiencia y cambio, y la pendiente (la «fracción recuperada») queda entre 0,5 y 0,7 según el potencial que se elija.</li>
<li>Desactive el techo: la correlación casi desaparece. Que el patrón aparezca en los datos no basta para concluir que hay un mecanismo biológico detrás.</li>
</ul></div>
</section>

<section>
<h2>Espejos, robots y estimulación</h2>
<ul>
<li><b>Terapia en espejo.</b> El paciente mueve el brazo sano frente a un espejo que oculta el afectado y ve el reflejo como si este se moviera. Una revisión Cochrane encontró mejoras moderadas de la función motora (Thieme y otros, 2018). La idea vino del uso del espejo para el dolor del miembro fantasma (capítulo 6).</li>
<li><b>Robots.</b> Permiten muchas repeticiones con poco personal. En el ensayo RATULS, con 770 pacientes, el entrenamiento asistido por robot no mejoró la función del brazo más que la atención habitual (Rodgers y otros, 2019).</li>
<li><b>Estimulación del nervio vago acoplada a la rehabilitación.</b> Un estimulador implantado envía un breve pulso al nervio vago en el momento de cada movimiento de la terapia; la hipótesis es que libera neuromoduladores que amplifican la plasticidad. En un ensayo con estimulación simulada como control, con 108 pacientes con ictus crónico, el 47 % del grupo tratado tuvo una mejora clínicamente importante, frente al 24 % del grupo control (Dawson y otros, 2021). Es una de las pocas neuromodulaciones con ensayo pivotal positivo en este campo (capítulo 28).</li>
</ul>
<div class="box evid"><p><span class="nivel n3">moderada</span>La terapia orientada a tareas, intensiva y con el miembro afectado, es la base de la rehabilitación motora; el espejo y la estimulación del nervio vago acoplada tienen apoyo de ensayos. <span class="nivel n2">incierta</span>La dosis y el momento óptimos todavía no se conocen bien.</p></div>
<div class="box safe"><p>La rehabilitación después de un ictus o una lesión cerebral debe planificarla un equipo profesional. Si usted o un familiar está en esa situación, use este capítulo para hacer preguntas: qué dosis de práctica recibe, cuándo, y cómo se mide el progreso.</p></div>
</section>

<section>
<h2>Resumen, problemas y autoevaluación</h2>
<div class="box keys"><ul>
<li>Después de una lesión, la reorganización cortical depende del uso: el entrenamiento preserva y expande los mapas.</li>
<li>El no uso aprendido empeora la función; la terapia de restricción del lado sano lo contrarresta.</li>
<li>Los modelos predicen un umbral de dosis; los ensayos muestran que más no siempre es mejor, y que el momento importa (posible periodo sensible a los 2–3 meses).</li>
<li>La «regla del 70 %» puede deberse en parte al techo de la escala; su interpretación está en debate.</li>
<li>Espejo y estimulación vagal acoplada tienen apoyo; los robots no superaron a la atención habitual.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Por qué inmovilizar el brazo sano puede mejorar el afectado?
<details><summary>Respuesta</summary><p>Porque obliga a usar el afectado: cada uso exitoso aumenta la expectativa de éxito (refuerzo) y la habilidad (plasticidad), y rompe el círculo del no uso aprendido.</p></details></li>
<li><span class="lvl">Intermedio</span>Si en una escala de 0 a 66 un paciente empieza con 60 puntos, ¿qué cambio máximo puede mostrar? ¿Qué consecuencia tiene para la correlación entre deficiencia inicial y cambio?
<details><summary>Respuesta</summary><p>Como máximo 6 puntos. Los pacientes con poca deficiencia solo pueden mostrar cambios pequeños, y eso crea una correlación positiva entre deficiencia y cambio aunque la recuperación real no dependa de la deficiencia.</p></details></li>
</ol>
