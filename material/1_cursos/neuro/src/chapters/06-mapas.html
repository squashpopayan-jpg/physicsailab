<p class="lead">«Neuroplasticidad» es la palabra estrella de la autoayuda. Este capítulo muestra la evidencia real de que el cerebro adulto se reorganiza, que es abundante y fascinante, y también sus límites, que la publicidad suele callar: los cambios son graduales, dependen de práctica intensa, se miden con instrumentos imprecisos y no siempre son para bien.</p>

<section>
<h2>Mapas que crecen, se encogen y se invaden</h2>
<p>En los años cuarenta, el neurocirujano Wilder Penfield estimuló con electrodos la corteza de pacientes despiertos y dibujó el famoso «homúnculo»: la superficie del cuerpo representada en una franja de la corteza, con manos y labios enormes porque tienen muchos receptores. Durante décadas se creyó que ese mapa era fijo en el adulto. Los experimentos de Michael Merzenich y sus colegas lo desmintieron:</p>
<ul>
<li>Al amputar un dedo a monos adultos, la zona de la corteza que lo representaba pasó en semanas a responder a los dedos vecinos (Merzenich y otros, 1984).</li>
<li>Al entrenar a monos a usar intensamente las yemas de unos dedos, la representación de esas yemas se expandió (Jenkins y otros, 1990).</li>
<li>En músicos de cuerda, la representación cortical de los dedos de la mano izquierda, la que pisa las cuerdas, resultó mayor que en no músicos, más aún cuanto antes habían empezado a tocar (Elbert y otros, 1995).</li>
</ul>
<p>Un modelo computacional clásico reproduce estos cambios: el <span class="term">mapa autoorganizado</span> de Teuvo Kohonen (1982), en el que unidades vecinas aprenden a responder a estímulos parecidos usando solo reglas locales de tipo Hebb y competencia.</p>
<div class="sim" data-sim="som" data-title="Un mapa cortical de cinco dedos que se reorganiza con el uso y la amputación"></div>
<div class="sim-guide"><ul>
<li>Arriba, la piel de cinco dedos; abajo, 60 unidades de corteza coloreadas según el dedo al que responden. El mapa inicial se formó con estimulación uniforme.</li>
<li>Estimule más el dedo 2, como un músico o un lector de braille: su territorio cortical crece a costa de los vecinos.</li>
<li>«Ampute» el dedo 3: las unidades que le respondían no quedan mudas, pasan a responder a los dedos 2 y 4. Es el patrón de Merzenich y una de las explicaciones del dolor de miembro fantasma.</li>
<li>Es una analogía computacional: la corteza real usa otros mecanismos (desenmascaramiento de conexiones existentes, crecimiento de axones), pero el principio de competencia por territorio es el mismo.</li>
</ul></div>
<div class="box evid"><p><span class="nivel n3">moderada</span>Tras una amputación de brazo, el grado de reorganización del mapa somatosensorial se correlacionó con la intensidad del dolor fantasma (Flor y otros, 1995). La relación entre reorganización y dolor resultó más compleja de lo que se pensó al principio, y hoy se discute; pero el hallazgo de que el mapa cambia en adultos está bien establecido.</p></div>
</section>

<section>
<h2>Periodos críticos</h2>
<p>David Hubel y Torsten Wiesel taparon un ojo a gatitos durante sus primeras semanas de vida. Al destaparlo, las neuronas de la corteza visual casi no respondían a ese ojo, y el animal quedaba funcionalmente ciego de él aunque el ojo estuviera sano (Wiesel y Hubel, 1963). En gatos adultos, el mismo procedimiento casi no tenía efecto. Recibieron el Nobel en 1981. Así se descubrió el <span class="term">periodo crítico</span>: una ventana del desarrollo en la que la experiencia moldea los circuitos con una fuerza que después no se recupera del todo.</p>
<ul>
<li><b>Visión:</b> por eso el ojo perezoso (ambliopía) se trata en la infancia.</li>
<li><b>Lenguaje:</b> la capacidad de aprender la gramática de un idioma como un hablante nativo se mantiene alta durante la infancia y la adolescencia y empieza a declinar hacia los 17 años, según un estudio con cerca de 670.000 personas (Hartshorne, Tenenbaum y Pinker, 2018).</li>
</ul>
<p>Los adultos siguen aprendiendo, pero más despacio y con más esfuerzo: el freno lo ponen cambios en la inhibición, en la mielina y en la matriz que rodea a las neuronas. Que exista un periodo crítico no significa que «después ya no se pueda», sino que cuesta más.</p>
</section>

<section>
<h2>Cambios estructurales en adultos: taxistas y malabaristas</h2>
<p>Con la resonancia magnética se puede medir el volumen de regiones cerebrales en personas vivas. Algunos estudios se volvieron célebres:</p>
<ul>
<li>Los taxistas de Londres, que memorizan miles de calles, tenían el hipocampo posterior más grande que personas control, y la diferencia crecía con los años de oficio (Maguire y otros, 2000). En un seguimiento, los aprendices que aprobaron el difícil examen de calles mostraron aumento de sustancia gris en esa zona; los que no lo aprobaron, no (Woollett y Maguire, 2011).</li>
<li>Doce adultos que aprendieron malabares durante tres meses mostraron un aumento transitorio de sustancia gris en un área visual del movimiento, que se redujo al dejar de practicar (Draganski y otros, 2004). Seis semanas de malabares también cambiaron medidas de la sustancia blanca (Scholz y otros, 2009).</li>
</ul>
<div class="box warn"><p>Estos estudios son importantes, pero conviene leerlos con el capítulo 1 en mente. Tenían muestras pequeñas; los cambios fueron de pocos por ciento; la resonancia mide volumen, no neuronas, y un aumento de «sustancia gris» puede reflejar más glía, más vasos, más agua o cambios en las espinas dendríticas. Una revisión crítica (Thomas y Baker, 2013) encontró que muchos hallazgos de plasticidad estructural por entrenamiento en humanos no se han replicado de forma consistente. El cambio funcional, en la conducta, está mucho mejor establecido que el estructural.</p></div>
<div class="sim" data-sim="mri" data-title="¿Puede un estudio pequeño detectar un cambio de 2 % en el volumen de una región cerebral?"></div>
<div class="sim-guide"><ul>
<li>Cada punto es un estudio simulado que mide a las mismas personas antes y después de un entrenamiento. El ruido de medición de la resonancia y la variabilidad entre personas se suman al cambio real.</li>
<li>Con 12 participantes y un cambio real de 2 %, la mayoría de los estudios no lo detectan, y los que sí lo detectan exageran su tamaño.</li>
<li>Ponga el cambio real en cero y vea cuántos estudios encuentran algo por azar si además se miden muchas regiones a la vez.</li>
</ul></div>
</section>

<section>
<h2>¿Nacen neuronas nuevas en el adulto?</h2>
<p>Durante casi un siglo se enseñó que no. En 1998, Eriksson y sus colegas encontraron neuronas recién nacidas en el hipocampo de pacientes con cáncer que habían recibido un marcador de división celular. En 2013, Spalding y sus colegas aprovecharon el carbono 14 liberado por las pruebas nucleares de los años cincuenta y sesenta para fechar neuronas, y estimaron que en cada hipocampo humano nacen unas 700 neuronas por día. Pero en 2018 llegaron dos estudios casi simultáneos con conclusiones opuestas: Sorrells y otros no encontraron neuronas jóvenes en el hipocampo de adultos, y Boldrini y otros sí las encontraron hasta la vejez. En 2019, Moreno-Jiménez y otros, con tejido mejor conservado, hallaron miles de neuronas inmaduras hasta los 87 años, menos en personas con alzhéimer.</p>
<div class="box evid"><p><span class="nivel n2">en debate</span>La neurogénesis adulta en el hipocampo humano probablemente existe, pero su magnitud y su papel en la memoria siguen en discusión, en parte por problemas técnicos con el tejido postmortem. En roedores está bien establecido que el ejercicio aumenta la neurogénesis del hipocampo (van Praag y otros, 1999). En humanos, que el ejercicio «fabrique neuronas» no se ha demostrado directamente (capítulo 22).</p></div>
</section>

<section>
<h2>La plasticidad también enferma</h2>
<p>El cerebro no distingue entre lo que conviene aprender y lo que no. Los mismos mecanismos que permiten aprender un idioma participan en:</p>
<ul>
<li><b>Dolor crónico:</b> la médula y el cerebro se sensibilizan y siguen produciendo dolor después de que el tejido sanó.</li>
<li><b>Adicciones:</b> las señales asociadas a la droga adquieren un poder de atracción enorme (capítulo 7).</li>
<li><b>Distonía focal del músico:</b> la práctica excesiva y repetitiva puede fusionar las representaciones de dedos vecinos y producir pérdida de control.</li>
<li><b>Miedos y fobias:</b> un aprendizaje de miedo muy fuerte resiste la extinción (capítulo 12).</li>
</ul>
<div class="box myth">
<p class="m"><b>Mito</b>«Gracias a la neuroplasticidad, usted puede reprogramar cualquier cosa con la mente».</p>
<p class="r"><b>Realidad</b>La plasticidad es real, pero no es un poder de la voluntad sobre el cerebro: es el cerebro cambiando por lo que usted hace de forma repetida, con atención y durante semanas o meses. Tiene límites por la edad, por la genética y por el tipo de aprendizaje. Y como acaba de verse, puede jugar en contra.</p>
</div>
</section>

<section>
<h2>Resumen, problemas y autoevaluación</h2>
<div class="box keys"><ul>
<li>Los mapas corticales del adulto se reorganizan: se expanden con el uso intenso y son invadidos cuando pierden su entrada.</li>
<li>Los periodos críticos del desarrollo dan una plasticidad que luego disminuye, sin desaparecer.</li>
<li>Hay cambios estructurales medibles con el entrenamiento en adultos, pero son pequeños, los estudios suelen tener poca potencia y la resonancia no mide neuronas.</li>
<li>La neurogénesis adulta humana sigue en debate.</li>
<li>La plasticidad también produce dolor crónico, adicción y distonía: no es buena ni mala por sí misma.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Por qué el ojo perezoso se trata en la infancia?
<details><summary>Respuesta</summary><p>Porque durante el periodo crítico la corteza visual todavía puede redistribuir sus conexiones entre los dos ojos; después la recuperación es mucho más limitada.</p></details></li>
<li><span class="lvl">Intermedio</span>Un estudio con 10 personas encuentra que un curso de meditación de 8 semanas «aumentó 5 % la sustancia gris» de una región. ¿Qué le preguntaría?
<details><summary>Respuesta</summary><p>Si tuvo grupo de control activo, cuántas regiones se midieron y si se corrigió por comparaciones múltiples, cuál es el error de medición, si se preregistró y si se replicó. Un ensayo con 218 personas no encontró cambios estructurales con ese tipo de curso (Kral y otros, 2022; capítulo 30).</p></details></li>
<li><span class="lvl">Intermedio</span>En el modelo del mapa, ¿por qué las unidades del dedo amputado pasan a los vecinos y no a dedos lejanos?
<details><summary>Respuesta</summary><p>Porque el mapa conserva la topología: unidades vecinas aprenden estímulos parecidos, así que las unidades huérfanas quedan rodeadas por las de los dedos 2 y 4, que ganan la competencia por ellas.</p></details></li>
</ol>
