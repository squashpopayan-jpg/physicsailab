<p class="lead">Un revés de squash, un saque de tenis o una sentadilla bien hecha son, para el cerebro, problemas de control: llevar el cuerpo de un estado a otro con precisión, a pesar del ruido de los músculos y de un entorno que cambia. Este capítulo explica cómo se aprende un gesto, qué dice la evidencia sobre cómo practicar, y qué recomendaciones populares se encogieron al revisarlas con cuidado.</p>

<section>
<h2>Tres etapas y tres sistemas</h2>
<p>Paul Fitts y Michael Posner (1967) describieron tres etapas que siguen siendo útiles: una <b>cognitiva</b>, en la que el aprendiz piensa cada paso y comete muchos errores; una <b>asociativa</b>, en la que el gesto se vuelve consistente; y una <b>autónoma</b>, en la que sale solo y la atención queda libre para la táctica. Es el paso del conocimiento declarativo al procedimental del capítulo 5.</p>
<p>Tres sistemas cerebrales participan, cada uno con una forma de aprender distinta:</p>
<ul>
<li><b>Cerebelo: aprendizaje por error.</b> Compara el movimiento esperado con el que ocurrió y corrige el siguiente. Es lo que permite adaptarse a una raqueta nueva, a una bola más rápida o a unas gafas que desvían la visión.</li>
<li><b>Ganglios basales: aprendizaje por refuerzo.</b> Seleccionan las variantes del gesto que salieron bien (capítulo 7) y las automatizan como hábitos motores (capítulo 15).</li>
<li><b>Corteza motora: plasticidad por uso.</b> Lo que se repite gana territorio y conexiones (capítulos 4 y 6).</li>
</ul>
</section>

<section>
<h2>Adaptarse: un proceso rápido y uno lento</h2>
<p>Cuando a una persona se le aplica una fuerza inesperada mientras alcanza un objeto, sus movimientos se desvían; en pocas decenas de intentos se adapta y vuelve a ir derecho. Maurice Smith, Ali Ghazizadeh y Reza Shadmehr (2006) mostraron que esa adaptación se explica con dos procesos: uno <b>rápido</b>, que aprende mucho de cada error pero olvida pronto, y uno <b>lento</b>, que aprende poco pero retiene.</p>
<div class="eq key" data-name="Modelo de adaptación de dos estados">\[x=x_r+x_l,\quad e_n=f_n-x_n,\qquad x_r\leftarrow A_r\,x_r+B_r\,e_n,\qquad x_l\leftarrow A_l\,x_l+B_l\,e_n,\]</div>
<p>con \(A_r\lt A_l\) (el rápido olvida más) y \(B_r>B_l\) (el rápido aprende más de cada error). El modelo hizo una predicción sorprendente que se confirmó: si después de adaptarse se «desaprende» con una perturbación opuesta hasta volver a cero, y luego se eliminan los errores, el comportamiento <i>vuelve solo</i> hacia lo aprendido. El proceso rápido, que había compensado la vuelta a cero, se olvida, y reaparece lo que el lento guardaba.</p>
<div class="sim" data-sim="adaptacion" data-title="Adaptación, desadaptación y recuperación espontánea con dos procesos"></div>
<div class="sim-guide"><ul>
<li>Fase A: aparece la perturbación. Fase B: la perturbación contraria, hasta que la salida vuelve a cero. Fase C: sin errores (pinza de error).</li>
<li>En la fase C la salida sube sola: recuperación espontánea. Fíjese en las dos curvas internas: el proceso rápido estaba «tapando» al lento.</li>
<li>Alargue la fase A: el proceso lento acumula más y la recuperación es mayor. Es la razón de que lo bien entrenado durante mucho tiempo vuelva aunque se haya perdido un poco.</li>
</ul></div>
<div class="py" data-py="19-adaptacion"></div>
<div class="box read"><p>Tras 200 ensayos, la salida llega a 0,84 y el proceso lento aporta la mayor parte (0,63). Cinco ensayos con la perturbación contraria bastan para llevar la salida a 0,013, pero solo porque el proceso rápido se fue a −0,47 mientras el lento seguía en +0,48. En la fase sin errores el rápido se desvanece y la salida rebota hasta 0,37 en el ensayo 246. Además, reaprender es más rápido: 7 ensayos para llegar al 60 % frente a 13 la primera vez. Ese «ahorro» es la huella de lo que el proceso lento conservó.</p></div>
<div class="box evid"><p><span class="nivel n4">sólida</span>El modelo de dos procesos describe bien la adaptación motora de corto plazo en muchos experimentos de laboratorio. Es una descripción de cómo se corrigen errores en un gesto ya conocido; aprender una habilidad nueva y compleja involucra además los otros dos sistemas.</p></div>
</section>

<section>
<h2>Curvas de aprendizaje</h2>
<p>Desde los años veinte se sabe que la práctica mejora mucho al principio y cada vez menos después. Allen Newell y Paul Rosenbloom (1981) propusieron que el tiempo de ejecución sigue una <span class="term">ley potencial</span> del número de repeticiones. Andrew Heathcote y sus colegas (2000) mostraron un detalle importante: en cada persona la curva suele ser exponencial; la ley potencial aparece al <i>promediar</i> personas que aprenden a ritmos distintos.</p>
<div class="eq">\[T(N)=a+b\,N^{-c}\quad(\text{potencial})\qquad\qquad T(N)=a+b\,\ee^{-cN}\quad(\text{exponencial}).\]</div>
<div class="sim" data-sim="curvas" data-title="Muchas curvas exponenciales promediadas parecen una ley potencial"></div>
<div class="sim-guide"><ul>
<li>Las líneas finas son aprendices individuales, cada uno exponencial con su propia rapidez. La gruesa es el promedio del grupo.</li>
<li>Compare el ajuste potencial y el exponencial al promedio: con mucha variación entre personas, gana el potencial, aunque ninguna persona sea potencial. Reduzca la variación: los dos ajustes se parecen.</li>
<li>Lección práctica: no compare su curva con «la curva promedio»; compárese con usted mismo.</li>
</ul></div>
</section>

<section>
<h2>¿Diez mil horas? Práctica deliberada y sus límites</h2>
<p>K. Anders Ericsson y sus colegas (1993) estudiaron violinistas de una academia de Berlín: los mejores habían acumulado más horas de <span class="term">práctica deliberada</span>, entrenamiento enfocado en las debilidades, con metas claras y retroalimentación inmediata. La idea se popularizó como la «regla de las diez mil horas». Los metaanálisis posteriores muestran que la práctica importa, pero no lo explica todo: en el deporte, la práctica deliberada explicó en promedio 18 % de las diferencias de rendimiento, y entre deportistas de élite apenas 1 % (Macnamara, Moreau y Hambrick, 2016). Ericsson respondió que esos estudios usaban una definición demasiado amplia de práctica deliberada; el debate sigue.</p>
<div class="box evid"><p><span class="nivel n4">sólida</span>La práctica es necesaria para llegar a un buen nivel. <span class="nivel n0">refutada</span>Que un número fijo de horas garantice la excelencia, o que la práctica explique por sí sola las diferencias entre los mejores.</p></div>
</section>

<section>
<h2>Variar la práctica: la interferencia contextual</h2>
<p>John Shea y Robyn Morgan (1979) pidieron a estudiantes aprender tres secuencias de movimientos. Un grupo las practicó en bloques (todas las de la primera, luego las de la segunda…); otro, mezcladas al azar. Durante la práctica, el grupo en bloques fue mejor. En las pruebas de retención y transferencia, días después, fue mejor el grupo mezclado. A esto se llama <span class="term">efecto de interferencia contextual</span>: lo que dificulta la práctica puede mejorar el aprendizaje. Una explicación es que mezclar obliga a «reconstruir» el plan motor en cada intento, como una práctica de evocación espaciada (capítulo 5).</p>
<div class="sim" data-sim="interferencia" data-title="Práctica en bloques o mezclada: desempeño durante la práctica y retención días después"></div>
<div class="sim-guide"><ul>
<li>Modelo didáctico: cada intento es un «repaso» del plan motor de un golpe, con el modelo de activación del capítulo 5. Ejecutar con fluidez exige una activación alta; recordar después, una menor. Mezclar los golpes separa más los repasos del mismo golpe.</li>
<li>En bloques, la práctica se siente mejor; mezclada, retiene más al día siguiente y a la semana.</li>
<li>Aplicado al squash: alternar drive, cruzado y bolea en un mismo ejercicio en lugar de 30 drives seguidos.</li>
</ul></div>
<div class="box evid"><p><span class="nivel n3">moderada</span>El efecto es robusto en el laboratorio con tareas simples; en habilidades deportivas complejas y en principiantes absolutos es menor y menos consistente (Brady, 2004). Para un principiante, algo de práctica en bloques al comienzo y luego cada vez más mezcla es una pauta razonable.</p></div>
</section>

<section>
<h2>Foco de atención y elección: efectos que se encogieron</h2>
<p>Durante dos décadas se enseñó que dirigir la atención al efecto del movimiento («a la bola», «al blanco») en lugar de al cuerpo («al codo») mejora el aprendizaje, y que dejar al aprendiz elegir aspectos de su práctica también lo mejora (teoría OPTIMAL, Wulf y Lewthwaite, 2016). Los metaanálisis iniciales apoyaban ambas ideas. Pero cuando el grupo de Brad McKay y Michael Carter volvió a analizar esas literaturas corrigiendo el sesgo de publicación, la ventaja de la práctica autocontrolada quedó indistinguible de cero, con una potencia estadística promedio de los estudios originales cercana a 6 % (McKay y otros, 2022), y la del foco externo quedó en efectos pequeños o nulos, muy variables según la tarea (McKay y otros, 2024).</p>
<div class="box evid"><p><span class="nivel n2">incierta</span>El foco externo y la práctica autocontrolada pueden ayudar en algunas tareas, pero la ventaja general que se enseñaba estaba inflada. Es un ejemplo de manual del capítulo 1 dentro de la ciencia del deporte. Lo práctico: pruebe instrucciones externas («empuja el suelo», «manda la bola a la esquina») y quédese con lo que a usted le funcione, sin esperar milagros.</p></div>
</section>

<section>
<h2>¿Se consolida el gesto mientras duerme?</h2>
<p>Un estudio muy citado encontró que, después de una noche de sueño, las personas ejecutaban una secuencia de dedos más rápido que al terminar la práctica, sin practicar más (Walker y otros, 2002). Revisiones posteriores encontraron que buena parte de esa «ganancia offline» se explica por la fatiga acumulada al final de la práctica y por la hora del día, y que el sueño protege más de lo que mejora (Pan y Rickard, 2015). Dormir bien sigue siendo importante para entrenar y rendir (capítulo 21), pero la idea de que el sueño «mejora» por sí solo un gesto está en discusión.</p>
</section>

<section>
<h2>Resumen, problemas y autoevaluación</h2>
<div class="box keys"><ul>
<li>El aprendizaje motor pasa por etapas cognitiva, asociativa y autónoma, y combina aprendizaje por error (cerebelo), por refuerzo (ganglios basales) y por uso (corteza).</li>
<li>La adaptación se explica con dos procesos, rápido y lento; el modelo predice la recuperación espontánea y el ahorro al reaprender.</li>
<li>Las curvas individuales suelen ser exponenciales; la ley potencial aparece al promediar.</li>
<li>La práctica deliberada importa (18 % de la varianza en deporte), pero no explica las diferencias entre los mejores.</li>
<li>Mezclar la práctica mejora la retención en el laboratorio; el foco externo y la práctica autocontrolada tienen efectos mucho menores de lo que se creía.</li>
</ul></div>
<div class="box do"><ul>
<li>Para el gesto que esté aprendiendo, diseñe un ejercicio que alterne al menos tres variantes en lugar de repetir una sola, y compare cómo le sale al día siguiente.</li>
<li>Registre sus sesiones en <a href="#progreso">Mi progreso</a> con minutos y esfuerzo percibido.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Por qué la práctica mezclada «se siente peor» durante la sesión?
<details><summary>Respuesta</summary><p>Porque cada intento exige recuperar un plan motor distinto en lugar de repetir el que está fresco; el desempeño inmediato baja, pero esa recuperación fortalece la memoria a largo plazo.</p></details></li>
<li><span class="lvl">Intermedio</span>En el modelo de dos procesos, ¿qué fracción de su estado conserva el proceso lento después de 100 ensayos sin error, si \(A_l=0{,}996\)?
<details><summary>Respuesta</summary><p>\(0{,}996^{100}\approx0{,}67\): conserva dos tercios. El rápido, con \(A_r=0{,}92\), conserva \(0{,}92^{100}\approx2\times10^{-4}\).</p></details></li>
<li><span class="lvl">Intermedio</span>Si la práctica explica 18 % de la varianza del rendimiento, ¿cuál es la correlación entre horas de práctica y rendimiento?
<details><summary>Respuesta</summary><p>\(r=\sqrt{0{,}18}\approx0{,}42\): una relación clara pero lejos de ser determinante.</p></details></li>
</ol>
