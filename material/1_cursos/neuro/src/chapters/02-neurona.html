<p class="lead">Todo lo que el curso dice sobre aprender, recordar, formar hábitos o mejorar en un deporte ocurre, al final, en células que se comunican con pulsos eléctricos. Este capítulo explica de dónde sale esa electricidad y cómo un modelo de cuatro ecuaciones, publicado en 1952, la describe con tanta precisión que le valió el Premio Nobel a sus autores. Es física y química de la buena, y se puede simular.</p>

<section>
<h2>Ochenta y seis mil millones de neuronas</h2>
<p>El cerebro humano adulto tiene unos 86.000 millones de neuronas y una cantidad parecida de células no neuronales, sobre todo glía (Azevedo y otros, 2009). La cifra se obtuvo con un método ingenioso: disolver el tejido hasta dejar una «sopa» de núcleos celulares y contarlos. Sorprende la distribución: la corteza cerebral, sede del pensamiento consciente, tiene unos 16.000 millones; el cerebelo, que coordina el movimiento, unos 69.000 millones.</p>

<div class="box myth">
<p class="m"><b>Mito</b>«Hay diez células gliales por cada neurona» y «solo usamos el 10 % del cerebro».</p>
<p class="r"><b>Realidad</b>La proporción glía:neurona en el cerebro humano es cercana a uno a uno (von Bartheld y otros, 2016). Y el cerebro, con apenas 2 % del peso corporal, consume cerca de 20 % de la energía del cuerpo en reposo (Raichle y Gusnard, 2002): un órgano tan costoso no se mantendría ocioso. Las imágenes cerebrales muestran actividad en todas las regiones a lo largo del día, aunque no todas a la vez. El mito del 10 % se revisa en el capítulo 14.</p>
</div>
</section>

<section>
<h2>El potencial de reposo: una batería química</h2>
<p>Dentro de la neurona hay mucho potasio (K⁺) y poco sodio (Na⁺); fuera ocurre lo contrario. Una bomba de la membrana, la ATPasa de sodio y potasio, mantiene esas diferencias gastando energía. Si la membrana solo dejara pasar potasio, este saldría por difusión hasta que la carga negativa que deja atrás lo frenara. El voltaje de equilibrio lo da la <span class="term">ecuación de Nernst</span>:</p>
<div class="eq key" data-name="Ecuación de Nernst">\[E_{\text{ion}}=\frac{RT}{zF}\,\ln\frac{[\text{ion}]_{\text{fuera}}}{[\text{ion}]_{\text{dentro}}}.\]</div>
<p>A 37 °C, \(RT/F\approx26{,}7\) mV. Con 5 mM de potasio fuera y 140 mM dentro, \(E_K\approx-89\) mV; para el sodio, con 145 mM fuera y 12 mM dentro, \(E_{Na}\approx+67\) mV. La membrana en reposo es permeable sobre todo al potasio, pero un poco también al sodio y al cloro. El voltaje resultante lo da la <span class="term">ecuación de Goldman-Hodgkin-Katz</span>, un promedio de los equilibrios ponderado por las permeabilidades:</p>
<div class="eq">\[V_{\text{reposo}}=\frac{RT}{F}\ln\frac{p_K[K]_e+p_{Na}[Na]_e+p_{Cl}[Cl]_i}{p_K[K]_i+p_{Na}[Na]_i+p_{Cl}[Cl]_e}.\]</div>
<div class="sim" data-sim="reposo" data-title="De las concentraciones al voltaje de la membrana"></div>
<div class="sim-guide"><ul>
<li>Con los valores típicos, el reposo queda cerca de −67 mV: más cerca del equilibrio del potasio porque la membrana es mucho más permeable a él.</li>
<li>Suba el potasio externo de 5 a 10 mM: la neurona se despolariza. Por eso el potasio alto en sangre (hiperpotasemia) altera el ritmo del corazón.</li>
<li>Suba la permeabilidad al sodio: el voltaje se acerca a +67 mV. Eso es, en esencia, lo que pasa durante un potencial de acción.</li>
</ul></div>
</section>

<section>
<h2>El potencial de acción de Hodgkin y Huxley</h2>
<p>Alan Hodgkin y Andrew Huxley trabajaron con el axón gigante del calamar, de casi medio milímetro de diámetro, lo bastante grueso para meterle un electrodo. Con una técnica llamada fijación de voltaje midieron por separado las corrientes de sodio y de potasio, y las describieron con «compuertas» que se abren y se cierran según el voltaje. Su modelo de 1952 predijo la forma, la velocidad y el umbral del impulso nervioso sin ajustar nada a esas medidas; recibieron el Nobel de Fisiología o Medicina en 1963.</p>
<div class="eq key" data-name="Modelo de Hodgkin y Huxley">\[C\frac{\dd V}{\dd t}=I-\bar g_{Na}\,m^{3}h\,(V-E_{Na})-\bar g_{K}\,n^{4}(V-E_K)-g_L(V-E_L),\qquad \frac{\dd x}{\dd t}=\alpha_x(V)(1-x)-\beta_x(V)\,x .\]</div>
<p>Las variables \(m\), \(h\) y \(n\) (entre 0 y 1) son las fracciones de compuertas abiertas: \(m\) activa el sodio y es rápida; \(h\) lo inactiva y es lenta; \(n\) activa el potasio y también es lenta. La secuencia es siempre la misma:</p>
<ol>
<li>Un estímulo despolariza un poco la membrana. Se abren algunas compuertas \(m\), entra sodio, la membrana se despolariza más y se abren más compuertas: una retroalimentación positiva explosiva.</li>
<li>El voltaje sube hacia \(E_{Na}\) en menos de un milisegundo.</li>
<li>Con retraso, las compuertas \(h\) cierran el sodio y las \(n\) abren el potasio, que sale y devuelve el voltaje hacia el reposo, e incluso por debajo.</li>
<li>Mientras \(h\) sigue cerrada, la neurona no puede disparar otra vez: es el <span class="term">periodo refractario</span>.</li>
</ol>
<div class="sim" data-sim="hh" data-title="El modelo de Hodgkin y Huxley completo"></div>
<div class="sim-guide"><ul>
<li>Suba la amplitud del pulso poco a poco: por debajo de unos 6 µA/cm² no pasa nada; por encima, el pico es siempre de unos +40 mV. Es la ley del todo o nada.</li>
<li>Active el segundo pulso y acérquelo al primero: por debajo de unos 10 ms (a la temperatura del calamar) la neurona no responde. Es el periodo refractario.</li>
<li>Bloquee los canales de sodio (eso hace la tetrodotoxina del pez globo, y en menor medida los anestésicos locales del capítulo 29): no hay espiga. Bloquee el potasio (tetraetilamonio): la espiga se alarga.</li>
<li>Suba la temperatura: las compuertas se aceleran y la espiga se vuelve más breve.</li>
</ul></div>
</section>

<section>
<h2>Frecuencia: cómo se codifica la intensidad</h2>
<p>Como todas las espigas tienen la misma altura, la neurona no puede decir «más» con espigas más grandes. Lo dice con más espigas por segundo. Un tacto leve produce pocas espigas en un receptor de la piel; uno fuerte, muchas. La relación entre la corriente de entrada y la frecuencia de salida se llama <span class="term">curva f–I</span>.</p>
<p>Para entender redes de miles de neuronas no siempre hace falta todo el detalle de Hodgkin y Huxley. El modelo más simple que conserva lo esencial es el de <span class="term">integrar y disparar con fuga</span> (LIF): la membrana acumula carga como un condensador que se descarga lentamente, y cuando el voltaje alcanza un umbral se cuenta una espiga y el voltaje se reinicia.</p>
<div class="eq key" data-name="Integrar y disparar con fuga">\[\tau_m\frac{\dd V}{\dd t}=-(V-E_L)+R\,I,\qquad f(I)=\left[t_{\text{ref}}+\tau_m\ln\frac{RI+E_L-V_r}{RI+E_L-V_{\text{umbral}}}\right]^{-1}.\]</div>
<div class="sim" data-sim="fi" data-title="Curva frecuencia–corriente: Hodgkin-Huxley frente a integrar y disparar"></div>
<div class="sim-guide"><ul>
<li>El modelo de Hodgkin y Huxley salta de 0 a unas 50 espigas por segundo al cruzar el umbral (neurona de «tipo II»). El modelo LIF arranca desde cero y crece de forma continua (tipo I), como muchas neuronas de la corteza.</li>
<li>Alargue el periodo refractario del LIF: la frecuencia máxima queda limitada a \(1/t_{\text{ref}}\).</li>
</ul></div>
<div class="py" data-py="02-hodgkin-huxley"></div>
<div class="box read"><p>El programa resuelve las cuatro ecuaciones con el integrador de SciPy. Con pulsos de 1 ms, entre 2 y 6 µA/cm² el voltaje apenas sube unos milivoltios; desde 8 µA/cm² aparece una espiga de 38 a 41 mV, casi igual sin importar la intensidad: todo o nada. Con corriente constante, 6 µA/cm² no alcanza para disparar de forma sostenida, 6,5 producen 55 espigas por segundo y 10 producen 68,3, el mismo valor que calcula el simulador del navegador (apéndice E). Dos pulsos separados 8 ms o menos producen una sola espiga: el segundo cae en el periodo refractario, que en el calamar a 6,3 °C es largo; en neuronas de mamífero a 37 °C dura uno o dos milisegundos.</p></div>
</section>

<section>
<h2>Conducción y mielina</h2>
<p>El potencial de acción no viaja como la corriente en un cable de cobre, que se atenuaría en milímetros. Se regenera: la despolarización de un tramo abre los canales de sodio del tramo siguiente. En muchos axones, una vaina de <span class="term">mielina</span> formada por células gliales aísla el axón, y el impulso salta de un nodo de Ranvier al siguiente (conducción saltatoria), lo que lo hace mucho más rápido y gasta menos energía.</p>
<div class="tablewrap"><table>
<thead><tr><th>Tipo de fibra</th><th>Mielina</th><th>Velocidad aproximada</th><th>Qué transmite</th></tr></thead>
<tbody>
<tr><td>Aα</td><td>gruesa</td><td class="num">70–120 m/s</td><td>órdenes a los músculos, propiocepción</td></tr>
<tr><td>Aβ</td><td>gruesa</td><td class="num">30–70 m/s</td><td>tacto fino, vibración</td></tr>
<tr><td>Aδ</td><td>delgada</td><td class="num">5–30 m/s</td><td>dolor agudo y punzante, frío</td></tr>
<tr><td>C</td><td>sin mielina</td><td class="num">0,5–2 m/s</td><td>dolor sordo y quemante, calor</td></tr>
</tbody></table></div>
<p>La diferencia de velocidades explica una experiencia común: al golpearse un dedo se siente primero un dolor agudo y, un instante después, uno sordo que dura más. En la esclerosis múltiple el sistema inmune daña la mielina y la conducción se vuelve lenta o se bloquea. La mielina también cambia con el aprendizaje, como se verá en el capítulo 6. El capítulo 29 retoma la conducción para explicar cómo un anestésico local la detiene.</p>
</section>

<section>
<h2>Resumen, problemas y autoevaluación</h2>
<div class="box keys"><ul>
<li>El cerebro tiene unas 86.000 millones de neuronas y una cantidad parecida de glía, y consume cerca de una quinta parte de la energía del cuerpo en reposo.</li>
<li>Las diferencias de concentración de iones crean voltajes de equilibrio (Nernst); el potencial de reposo, cerca de −65 a −70 mV, es su promedio ponderado por las permeabilidades (Goldman-Hodgkin-Katz).</li>
<li>El potencial de acción es una explosión controlada: entra sodio por retroalimentación positiva y luego sale potasio. Es todo o nada y deja un periodo refractario.</li>
<li>La intensidad se codifica en la frecuencia de las espigas. El modelo de integrar y disparar captura esa idea con una sola ecuación.</li>
<li>La mielina acelera la conducción hasta más de 100 m/s.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule el potencial de Nernst del potasio a 37 °C si el potasio externo sube a 8 mM (interno 140 mM).
<details><summary>Respuesta</summary><p>\(E_K=26{,}7\ln(8/140)\approx26{,}7\times(-2{,}86)\approx-76{,}5\) mV: unos 12,5 mV menos negativo que con 5 mM.</p></details></li>
<li><span class="lvl">Básico</span>¿Por qué una espiga más intensa no es más alta?
<details><summary>Respuesta</summary><p>Porque el pico lo fija la cercanía a \(E_{Na}\) y la inactivación del sodio, no el estímulo: una vez que la retroalimentación positiva arranca, el proceso es el mismo. La intensidad se codifica en la frecuencia.</p></details></li>
<li><span class="lvl">Intermedio</span>En el modelo LIF con \(\tau_m=10\) ms, \(E_L=V_r=-65\) mV, umbral \(-50\) mV, \(R=10\) MΩ y \(t_{\text{ref}}=2\) ms, ¿qué frecuencia produce \(I=2\) nA?
<details><summary>Respuesta</summary><p>\(RI=20\) mV, así que \(RI+E_L-V_r=20\) y \(RI+E_L-V_{\text{umbral}}=5\). Intervalo \(=2+10\ln4\approx15{,}86\) ms; \(f\approx63\) espigas por segundo.</p></details></li>
<li><span class="lvl">Intermedio</span>Una fibra C conduce a 1 m/s y una Aδ a 20 m/s. Si el golpe es en un pie, a 1,2 m de la médula, ¿con cuánta diferencia llegan las dos señales?
<details><summary>Respuesta</summary><p>Fibra C: 1,2 s; Aδ: 0,06 s. Diferencia de unos 1,14 s, la razón del «primer» y el «segundo» dolor.</p></details></li>
<li><span class="lvl">Avanzado</span>¿Qué pasaría con el potencial de acción si las compuertas \(h\) fueran tan rápidas como las \(m\)?
<details><summary>Respuesta</summary><p>La inactivación cerraría el sodio casi al mismo tiempo que se abre, y no habría retroalimentación positiva sostenida: la espiga sería mucho más pequeña o no existiría. El retraso entre \(m\) y \(h\) (y \(n\)) es lo que permite la explosión seguida de la recuperación.</p></details></li>
</ol>
