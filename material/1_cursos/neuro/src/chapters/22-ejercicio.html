<p class="lead">«El ejercicio hace crecer el cerebro», «el BDNF es fertilizante para las neuronas», «caminar previene el alzhéimer». Hay ciencia sólida detrás de estas frases, pero casi toda en animales; en humanos los efectos son más pequeños y más específicos de lo que se repite. Este capítulo separa los niveles de evidencia y muestra con una simulación por qué los efectos publicados se encogen cuando se corrigen los sesgos.</p>

<section>
<h2>Lo que ocurre en el cerebro de un animal que corre</h2>
<p>En 1995 se observó que ratas con acceso a una rueda aumentaban el ARN mensajero del <span class="term">factor neurotrófico derivado del cerebro</span> (BDNF) en el hipocampo (Neeper y otros, 1995). El BDNF es una proteína que favorece la supervivencia de las neuronas, el crecimiento de sus ramificaciones y la potenciación de largo plazo (capítulo 4). Cuatro años después, Henriette van Praag y sus colegas mostraron que los ratones que corrían voluntariamente producían más neuronas nuevas en el giro dentado del hipocampo y aprendían mejor una tarea espacial (van Praag y otros, 1999). En roedores, estos hallazgos se han replicado muchas veces: el ejercicio aumenta la neurogénesis, los factores de crecimiento, la formación de vasos sanguíneos y la plasticidad sináptica del hipocampo.</p>
<div class="box evid"><p><span class="nivel n4">sólida</span>En roedores, el ejercicio aeróbico aumenta el BDNF, la neurogénesis y la plasticidad del hipocampo.</p></div>
</section>

<section>
<h2>En humanos: BDNF e hipocampo</h2>
<p>En personas no se puede medir el BDNF cerebral directamente. Lo que se mide es el BDNF en la sangre, que aumenta después de una sesión de ejercicio y algo más en personas entrenadas (metaanálisis de Szuhany y otros, 2015). El problema es que la mayor parte del BDNF de la sangre está almacenado en las plaquetas, y no está claro cuánto refleja lo que ocurre en el cerebro.</p>
<p>El ensayo más citado sobre el hipocampo asignó al azar a 120 adultos mayores sedentarios a caminar 40 minutos tres veces por semana o a hacer estiramientos durante un año. En el grupo de caminata, el hipocampo anterior aumentó un 2 %; en el de estiramientos disminuyó un 1,4 % (Erickson y otros, 2011). Un detalle menos difundido: la memoria espacial mejoró en los dos grupos, sin diferencia entre ellos. Un metaanálisis posterior de 14 ensayos no encontró efecto sobre el volumen total del hipocampo; sí uno positivo en el hipocampo izquierdo, que parecía deberse a que el ejercicio frena la pérdida de volumen con la edad más que a un crecimiento (Firth y otros, 2018).</p>
<div class="box evid"><p><span class="nivel n2">preliminar</span>El ejercicio aeróbico podría frenar la pérdida de volumen del hipocampo con la edad; los ensayos son pocos y sus resultados, mixtos. Que el ejercicio produzca neuronas nuevas en humanos no se ha demostrado (capítulo 6).</p></div>
</section>

<section>
<h2>¿Mejora la cognición en personas sanas?</h2>
<p>Una sola sesión de ejercicio produce, en promedio, una mejora muy pequeña en pruebas cognitivas realizadas durante o después del esfuerzo (Chang y otros, 2012). Para el ejercicio regular, una revisión de 24 metaanálisis de ensayos aleatorizados con personas sanas encontró que casi todos reportaban un beneficio, pero que los ensayos tenían poca potencia, había sesgo de publicación y muchas decisiones de análisis distintas. El efecto bruto, \(d = 0{,}22\), bajaba a 0,13 al considerar el tipo de grupo de control y las diferencias de partida entre grupos, y a 0,05 al corregir el sesgo de publicación, con un intervalo que incluye el cero (Ciria y otros, 2023).</p>
<p>¿Cómo puede encogerse tanto un efecto? La simulación siguiente construye una literatura con ese mecanismo. Muchos ensayos comparan el ejercicio con una lista de espera (control pasivo): el grupo que entrena sabe que recibe algo y espera mejorar, y ese efecto de expectativa se suma al real. Además, los ensayos pequeños con resultados nulos tienden a no publicarse.</p>
<div class="sim" data-sim="controles" data-title="Cómo se infla el efecto del ejercicio sobre la cognición"></div>
<div class="sim-guide"><ul>
<li>Los puntos llenos son ensayos publicados; los huecos, ensayos que quedaron en un cajón. Los naranjas tienen control pasivo y los morados, control activo (por ejemplo, estiramientos).</li>
<li>Con los valores iniciales, el efecto real es 0,05, pero el metaanálisis de todo lo publicado da cerca de 0,2: la expectativa de los controles pasivos y el sesgo de publicación se suman.</li>
<li>Quedarse solo con ensayos de control activo quita la expectativa. La corrección PET, que extrapola al ensayo de precisión infinita, intenta quitar el sesgo de publicación; pulse «Otra literatura» para ver lo inestable que es con pocos ensayos.</li>
<li>Ponga la expectativa en 0 y publique el 100 %: todas las estimaciones vuelven al valor real.</li>
</ul></div>
<p>El mismo cálculo, repetido sobre 2 000 literaturas simuladas, en Python:</p>
<div class="py" data-py="22-sesgo-ejercicio"></div>
<div class="box evid"><p><span class="nivel n2">incierta</span>En adultos sanos, el beneficio cognitivo del ejercicio regular es pequeño o nulo cuando se corrigen los sesgos. Esto no dice que el ejercicio sea inútil para el cerebro: dice que su efecto sobre las pruebas cognitivas de personas sanas es difícil de demostrar. En el envejecimiento, la inactividad física figura entre los factores de riesgo modificables de demencia según estudios observacionales (Livingston y otros, 2024).</p></div>
</section>

<section>
<h2>Ánimo, ansiedad y depresión</h2>
<p>Aquí la evidencia es más favorable. Un metaanálisis en red de ensayos con personas con depresión encontró reducciones moderadas de los síntomas frente a controles activos para caminar o trotar, yoga, entrenamiento de fuerza, ejercicio aeróbico mixto y taichí; los efectos eran mayores con mayor intensidad y comparables a los de la psicoterapia y los antidepresivos en esos ensayos (Noetel y otros, 2024). Los autores calificaron la certeza como baja o muy baja, porque casi todos los ensayos tenían riesgo de sesgo.</p>
<div class="sim" data-sim="ejercicio-evidencia" data-title="Cognición frente a ánimo: lo que dicen dos revisiones recientes"></div>
<div class="sim-guide"><ul>
<li>Las barras naranjas son el efecto sobre la cognición en personas sanas en tres pasos de corrección; la línea negra marca el límite superior del intervalo del efecto corregido (de −0,09 a 0,14).</li>
<li>Las barras verdes son reducciones de los síntomas de depresión frente a controles activos. Son mayores, pero con certeza baja.</li>
</ul></div>
<p>La sensación de bienestar después de correr, la «euforia del corredor», se atribuyó durante décadas a las endorfinas. Pero las endorfinas de la sangre cruzan poco al cerebro. En ratones, la reducción de la ansiedad y del dolor tras correr dependía de los receptores de cannabinoides (Fuss y otros, 2015). En un ensayo con 63 personas, bloquear los receptores opioides con naltrexona no impidió la euforia ni la disminución de la ansiedad después de 45 minutos de carrera, mientras que los endocannabinoides de la sangre aumentaron (Siebers y otros, 2021).</p>
<div class="box evid"><p><span class="nivel n3">moderada</span>El ejercicio reduce los síntomas de depresión y ansiedad, con certeza baja sobre la magnitud. <span class="nivel n2">preliminar</span>La euforia del corredor parece depender más del sistema endocannabinoide que de las endorfinas.</p></div>
<div class="box safe"><p>En una depresión moderada o grave, el ejercicio se suma al tratamiento indicado por un profesional, no lo reemplaza. Si hay ideas de muerte o de hacerse daño, busque ayuda de inmediato.</p></div>
</section>

<section>
<h2>Ejercicio y aprendizaje motor</h2>
<p>Algunos estudios sugieren que una sesión de ejercicio intenso justo antes o después de practicar una habilidad motora mejora su retención días después, quizá por el aumento de catecolaminas y factores de crecimiento durante la consolidación (Roig y otros, 2012). Son estudios pequeños, de laboratorio, con tareas simples. Para un deportista la consecuencia práctica es modesta: no hay razón para separar la técnica del acondicionamiento, y la técnica fina conviene practicarla antes de que la fatiga deteriore la ejecución.</p>
</section>

<section>
<h2>Cuánto moverse</h2>
<p>Las recomendaciones de la Organización Mundial de la Salud para adultos son 150 a 300 minutos semanales de actividad aeróbica moderada, o 75 a 150 de actividad vigorosa, más ejercicios de fortalecimiento muscular dos o más días por semana, y reducir el tiempo sentado (Bull y otros, 2020). Se basan sobre todo en sus beneficios cardiovasculares, metabólicos y de mortalidad, que son sólidos; el beneficio para el ánimo es una ganancia adicional.</p>
<div class="box do"><ul>
<li>Registre en <a href="#progreso">Mi progreso</a> sus sesiones con minutos y esfuerzo percibido; el tablero suma su carga semanal.</li>
<li>Si su objetivo principal es el ánimo, el tipo de ejercicio importa menos que hacerlo con regularidad: elija el que pueda sostener (capítulo 15).</li>
</ul></div>
</section>

<section>
<h2>Resumen, problemas y autoevaluación</h2>
<div class="box keys"><ul>
<li>En roedores, el ejercicio aumenta el BDNF, la neurogénesis y la plasticidad del hipocampo; en humanos no se ha demostrado la neurogénesis.</li>
<li>El ejercicio aeróbico podría frenar la pérdida de volumen del hipocampo con la edad; los resultados son mixtos.</li>
<li>En adultos sanos, el efecto del ejercicio sobre la cognición se reduce a casi cero al corregir controles pasivos, diferencias de base y sesgo de publicación.</li>
<li>Para los síntomas de depresión, el ejercicio tiene efectos moderados con certeza baja.</li>
<li>La euforia del corredor parece depender del sistema endocannabinoide más que de las endorfinas.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Un anuncio dice: «Caminar aumenta 2 % el tamaño de su cerebro». ¿Qué tres precisiones haría?
<details><summary>Respuesta</summary><p>Fue el hipocampo anterior, no el cerebro; fue en un ensayo con adultos mayores sedentarios durante un año; y la memoria mejoró igual en el grupo de control. Además, un metaanálisis posterior no encontró efecto sobre el volumen total del hipocampo.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Por qué un control de lista de espera infla el efecto del ejercicio sobre la cognición, pero no uno de estiramientos?
<details><summary>Respuesta</summary><p>Con lista de espera, solo el grupo de ejercicio recibe atención, contacto social y la expectativa de mejorar. Con estiramientos, ambos grupos reciben una intervención creíble y esos factores se igualan, de modo que la diferencia refleja mejor el efecto propio del ejercicio aeróbico.</p></details></li>
</ol>
