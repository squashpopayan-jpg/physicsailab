<p class="lead">La PNL no es la única idea sobre el cerebro que circula sin respaldo. Hay una familia entera de «neuromitos»: afirmaciones que suenan a neurociencia, se enseñan en colegios y empresas y se venden en productos, pero que la investigación ha desmentido. Este capítulo reúne los más comunes, explica por qué son tan persistentes y termina con una lista de señales para reconocer la pseudociencia antes de pagar por ella.</p>

<section>
<h2>Por qué creemos neuromitos</h2>
<p>En una encuesta a 242 docentes del Reino Unido y los Países Bajos, muy interesados en el cerebro, los participantes aceptaron en promedio 49 % de los neuromitos que se les presentaron, y los que más sabían de neurociencia general también creían más mitos (Dekker y otros, 2012). Saber un poco no protege; a veces da más confianza para creer.</p>
<p>Además, la palabra «neuro» persuade. En un experimento, explicaciones malas de fenómenos psicológicos resultaron mucho más convincentes para personas no expertas cuando se les añadía información neurocientífica irrelevante (Weisberg y otros, 2008). Es el <span class="term">atractivo seductor de la neurociencia</span>, y el mercadeo lo conoce bien: «neuroventas», «neuroliderazgo», «neuronutrición».</p>
</section>

<section>
<h2>Los mitos más comunes</h2>

<tr><td>Hay personas de «cerebro izquierdo» (lógicas) y de «cerebro derecho» (creativas).</td><td>Algunas funciones están lateralizadas (el lenguaje suele estar a la izquierda), pero en 1.011 personas no hubo evidencia de que unas usen globalmente más un hemisferio que otras (Nielsen y otros, 2013).</td><td><span class="nivel n0">refutado</span></td></tr>

<div class="sim" data-sim="mozart" data-title="¿Efecto Mozart o efecto de la música que anima? Una literatura simulada"></div>
<div class="sim-guide"><ul>
<li>Cada estudio compara una tarea espacial después de escuchar Mozart, otra música animada o silencio. Por defecto, la música anima un poco a quien la escucha (activación y ánimo), sin nada especial de Mozart.</li>
<li>Mozart frente a silencio sale «significativo» en muchos estudios: ese fue el titular de 1993. Mozart frente a otra música animada, casi nunca. La hipótesis de la activación y el ánimo (Thompson, Schellenberg y Husain, 2001) explica el efecto sin magia.</li>
<li>Ponga un efecto específico de Mozart y vea cuánto más grande tendría que ser para notarse.</li>

<section>
<h2>Diez señales de pseudociencia</h2>
<p>Scott Lilienfeld y sus colegas (2012) propusieron una lista de señales de alarma para distinguir ciencia de pseudociencia. Ninguna es concluyente por sí sola; varias juntas, sí deberían preocupar:</p>
<ol>
<li><b>Afirmaciones imposibles de refutar.</b> Si nunca puede fallar, «no se hizo bien», «no estaba listo».</li>
<li><b>Testimonios en lugar de experimentos.</b></li>
<li><b>No se corrige con el tiempo:</b> las mismas afirmaciones desde hace décadas, a pesar de la evidencia.</li>
<li><b>Evita la revisión por pares:</b> se publica en libros, cursos y videos, no en revistas científicas.</li>
<li><b>Busca solo confirmaciones</b> y descarta los resultados en contra.</li>
<li><b>Invierte la carga de la prueba:</b> «demuéstreme usted que no funciona».</li>
<li><b>No conecta con el resto de la ciencia:</b> inventa energías, campos o mecanismos que la física y la biología no conocen.</li>
<li><b>Promesas extraordinarias:</b> cambios enormes, rápidos, para cualquier problema.</li>
<li><b>Apelación a la antigüedad o a la novedad:</b> «sabiduría milenaria» o «lo último que la ciencia oculta».</li>
<li><b>Jerga técnica sin contenido:</b> «cuántico», «frecuencias», «reprogramación neuronal», «neuro-» para todo.</li>
</ol>
<div class="box do"><ul>
<li>Revise el último curso, suplemento o aplicación «para el cerebro» que vio anunciado y cuente cuántas de las diez señales cumple.</li>
<li>Busque en Google Académico el nombre de la técnica junto con «randomized controlled trial» o «meta-analysis». Si no aparece nada, ya tiene una respuesta.</li>
</ul></div>
</section>

<section>
<h2>Autoevaluación: ¿mito o realidad?</h2>
<div class="sim" data-sim="quiz-neuromitos" data-title="Autoevaluación del capítulo 14: mito o realidad"></div>
<div class="box keys"><ul>
<li>Los neuromitos son comunes incluso entre personas educadas e interesadas en el cerebro; la jerga neurocientífica los hace más creíbles.</li>
<li>El 10 %, cerebro izquierdo y derecho, estilos de aprendizaje, efecto Mozart, entrenamiento cerebral con transferencia general y azúcar-hiperactividad no resisten la evidencia.</li>
<li>Muchos «efectos» se explican por algo más simple: la música que anima, la práctica en la tarea misma, la expectativa de los padres.</li>
<li>Diez señales de alarma ayudan a reconocer la pseudociencia antes de invertir en ella.</li>
</ul></div>
