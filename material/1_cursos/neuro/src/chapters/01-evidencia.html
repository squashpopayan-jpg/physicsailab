<p class="lead">Antes de hablar de neuronas o de PNL hace falta una herramienta: saber cuándo una técnica funciona de verdad. Casi todas las terapias, métodos y cursos se venden con testimonios sinceros de personas que mejoraron. El problema es que la gente también mejora por razones que no tienen nada que ver con la técnica. Este capítulo explica esas razones, cómo las controla un buen experimento y cómo se resume la evidencia de muchos estudios. Con eso se puede juzgar el resto del curso.</p>

<section>
<h2>Por qué los testimonios engañan</h2>
<p>Imagine a una persona con dolor de espalda crónico. Su dolor sube y baja de una semana a otra. Va al terapeuta, por lo general, en su peor semana: nadie pide cita cuando se siente bien. Unas semanas después, el dolor ha bajado. La persona cree, con total sinceridad, que la terapia funcionó. Pero el dolor habría bajado de todas formas, porque después de un pico lo más probable es volver hacia el nivel habitual. Este fenómeno se llama <span class="term">regresión a la media</span>, y es la razón número uno de que los tratamientos inútiles parezcan útiles.</p>
<div class="box def"><p><b>Regresión a la media.</b> Cuando se selecciona a alguien por un valor extremo de una medida que fluctúa, la siguiente medición tiende a estar más cerca del promedio, aunque no se haga nada. Si \(X\) y \(Y\) son dos mediciones con la misma media \(\mu\) y correlación \(\rho\), la mejora esperada solo por seleccionar \(X>c\) es</p>
<div class="eq">\[\E[\,X-Y\mid X>c\,]=(1-\rho)\,\big(\E[X\mid X>c]-\mu\big).\]</div>
<p>Cuanto menor es la correlación entre una semana y la siguiente, mayor es la «mejora» que aparece sola.</p></div>
<div class="sim" data-sim="regresion" data-title="Una terapia que no hace nada… y parece funcionar"></div>
<div class="sim-guide"><ul>
<li>Cada punto es una persona con un síntoma crónico (escala de 0 a 10) que fluctúa. Pidió cita en una semana en que su síntoma superó el umbral. El tratamiento simulado no tiene ningún efecto.</li>
<li>Los puntos por debajo de la diagonal mejoraron. Fíjese cuántos son, y cuántos «mejoraron al menos 2 puntos»: esos serían los testimonios entusiastas.</li>
<li>Suba la autocorrelación (síntomas más estables de una semana a otra): la ilusión se reduce. Suba el umbral (solo consultan en semanas muy malas): la ilusión crece.</li>
</ul></div>
<p>A la regresión a la media se suman otros factores que también producen mejoras sin relación con la técnica:</p>
<ul>
<li><b>Historia natural.</b> Muchas dolencias se resuelven solas: un esguince, una gripa, un episodio de ansiedad.</li>
<li><b>Efecto placebo y expectativa.</b> Creer que algo va a funcionar cambia cómo se reportan los síntomas subjetivos, sobre todo el dolor y las náuseas.</li>
<li><b>Tratamientos simultáneos.</b> La persona que empieza una terapia alternativa suele, a la vez, dormir mejor, hacer ejercicio o tomar su medicamento.</li>
<li><b>Sesgo de confirmación y de supervivencia.</b> Recordamos los aciertos y olvidamos los fracasos. Quien no mejoró no da testimonio ni vuelve.</li>
</ul>
<div class="box evid"><p><span class="nivel n4">sólida</span>El placebo no es magia ni «la mente curando el cuerpo». En una revisión de 114 ensayos que comparaban placebo con ningún tratamiento, Hróbjartsson y Gøtzsche (2001) no encontraron efectos del placebo en desenlaces objetivos o binarios, y sí efectos pequeños en medidas subjetivas, especialmente el dolor. El placebo cambia sobre todo lo que la persona siente y reporta, no la enfermedad.</p></div>
</section>

<section>
<h2>El ensayo controlado: comparar con lo que habría pasado</h2>
<p>La pregunta correcta no es «¿mejoraron las personas tratadas?», sino «¿mejoraron <i>más</i> que personas idénticas que no recibieron la técnica?». Para responderla se diseñó el <span class="term">ensayo controlado aleatorizado</span>:</p>
<ol>
<li><b>Grupo de control.</b> Recibe todo lo mismo salvo el ingrediente que se quiere probar. Así la regresión a la media, la historia natural y el paso del tiempo afectan por igual a ambos grupos y se cancelan al restar.</li>
<li><b>Asignación al azar.</b> Evita que el investigador ponga, sin querer, a los pacientes con mejor pronóstico en el grupo tratado.</li>
<li><b>Control simulado (placebo).</b> Si el control no recibe nada, la expectativa solo actúa en el grupo tratado. Un procedimiento simulado que se vea igual iguala la expectativa.</li>
<li><b>Cegamiento.</b> Ni el paciente ni quien mide deben saber quién recibió el tratamiento real. Un evaluador que lo sabe tiende a ver más mejoría donde la espera.</li>
</ol>
<div class="sim" data-sim="ensayo" data-title="El mismo tratamiento, tres diseños, tres conclusiones"></div>
<div class="sim-guide"><ul>
<li>Fije el efecto real en cero. El diseño «antes y después» encuentra un efecto grande: suma la historia natural, el placebo y el sesgo del evaluador.</li>
<li>El control en lista de espera elimina la historia natural, pero no el placebo ni el sesgo. Solo el control simulado con evaluación ciega se acerca a la verdad.</li>
<li>Ponga un efecto real de 0,3: el diseño riguroso lo detecta, aunque con un intervalo ancho si hay pocos pacientes.</li>
</ul></div>
<div class="box warn"><p>Por eso un estudio «antes y después» sin grupo de control, por grande que sea, no demuestra que una técnica funciona. Muchas terapias alternativas y casi todos los cursos de desarrollo personal solo presentan este tipo de evidencia, cuando presentan alguna.</p></div>
</section>

<section>
<h2>Tamaño del efecto y potencia</h2>
<p>Que una diferencia sea «estadísticamente significativa» solo dice que es poco probable que sea puro azar. No dice si es grande. Para eso se usa el <span class="term">tamaño del efecto</span>. El más común es la \(d\) de Cohen: la diferencia de medias entre grupos dividida por la desviación estándar.</p>
<div class="eq key" data-name="Tamaño del efecto y número necesario a tratar">\[d=\frac{\bar x_T-\bar x_C}{s},\qquad \text{NNT}=\frac{1}{2\,\Phi\!\left(d/\sqrt2\right)-1}.\]</div>
<p>El número necesario a tratar (NNT) traduce \(d\) a algo concreto: a cuántas personas hay que tratar para que una más mejore gracias al tratamiento (fórmula de Kraemer y Kupfer, 2006). Con \(d=0{,}2\) (efecto pequeño) el NNT es casi 9; con \(d=0{,}5\) (mediano), unos 3,6; con \(d=0{,}8\) (grande), unos 2,3.</p>
<p>La <span class="term">potencia</span> es la probabilidad de que un estudio detecte un efecto que sí existe. Con pocos participantes la potencia es baja y aparece una trampa: cuando un estudio pequeño «sale significativo», lo hace porque el azar infló el efecto. Se llama la <span class="term">maldición del ganador</span>.</p>
<div class="sim" data-sim="potencia" data-title="Doscientos estudios del mismo efecto: cuántos lo encuentran y cuánto lo exageran"></div>
<div class="sim-guide"><ul>
<li>Cada punto es un estudio con \(n\) personas por grupo. Los rellenos son significativos (\(p\lt 0{,}05\)).</li>
<li>Con \(d=0{,}3\) y 20 por grupo, menos de uno de cada cinco estudios detecta el efecto, y los que lo detectan lo exageran más del doble.</li>
<li>Suba \(n\) hasta 200: casi todos lo encuentran y el promedio de los significativos se acerca al valor real.</li>
</ul></div>
<div class="box evid"><p><span class="nivel n4">sólida</span>Button y otros (2013) estimaron que la potencia mediana de los estudios de neurociencia incluidos en metaanálisis era de apenas 21 %. Con esa potencia, una buena parte de los hallazgos publicados son exagerados o falsos positivos. Esto importa en este curso: muchos estudios llamativos sobre «cambiar el cerebro» tienen entre 15 y 30 participantes.</p></div>
</section>

<section>
<h2>Metaanálisis y sesgo de publicación</h2>
<p>Un solo estudio puede engañar. Un <span class="term">metaanálisis</span> combina todos los estudios de una pregunta y da más peso a los más precisos. El modelo de efectos aleatorios de DerSimonian y Laird (1986) admite que el efecto verdadero varíe algo de un estudio a otro, con varianza \(\tau^2\):</p>
<div class="eq">\[\hat\mu=\frac{\sum_i w_i\,y_i}{\sum_i w_i},\qquad w_i=\frac{1}{v_i+\hat\tau^{2}},\qquad Q=\sum_i\frac{(y_i-\bar y_F)^2}{v_i}.\]</div>
<div class="sim" data-sim="bcg" data-title="Un metaanálisis real: los 13 ensayos de la vacuna BCG contra la tuberculosis"></div>
<div class="sim-guide"><ul>
<li>Datos reales (Colditz y otros, 1994), el ejemplo clásico de los libros de metaanálisis. Cada línea es un ensayo con su intervalo de confianza; el rombo es el resumen.</li>
<li>El resumen de efectos aleatorios, un riesgo relativo de 0,49, coincide al dígito con el del paquete metafor de R (apéndice E). La vacuna reduce el riesgo a la mitad, en promedio.</li>
<li>Note la heterogeneidad enorme (\(I^2\) de 92 %): el efecto varía según la latitud de cada ensayo. Un buen metaanálisis no solo promedia, también explica por qué los estudios difieren.</li>
</ul></div>
<p>Un metaanálisis es tan bueno como los estudios que reúne. Si los estudios con resultados nulos no se publican, el promedio de lo publicado sale inflado. Este <span class="term">sesgo de publicación</span> deja una huella: en el <span class="term">gráfico de embudo</span>, que pone el efecto de cada estudio contra su precisión, faltan los estudios pequeños con resultados negativos y el embudo queda torcido.</p>
<div class="sim" data-sim="embudo" data-title="El embudo torcido: cuando solo se publican los resultados positivos"></div>
<div class="sim-guide"><ul>
<li>Se simulan 80 estudios de un efecto real pequeño. Los significativos se publican siempre; los demás, solo con la probabilidad que usted elija.</li>
<li>Con 100 % de publicación el embudo es simétrico y el metaanálisis acierta. Baje la publicación de nulos al 10 %: el efecto combinado se duplica o triplica y la prueba de Egger detecta la asimetría.</li>
<li>Ponga el efecto real en cero: con sesgo de publicación, ¡el metaanálisis encuentra un efecto que no existe!</li>
</ul></div>
</section>

<section>
<h2>La crisis de replicación y la escalera de la evidencia</h2>
<p>En 2015, 270 investigadores repitieron 100 experimentos publicados en tres revistas de psicología de primer nivel. De los estudios originales, 97 % habían sido significativos; de las réplicas, solo 36 %, y el tamaño del efecto promedio se redujo a la mitad (Open Science Collaboration, 2015). Varios hallazgos famosos que aparecen en libros de autoayuda no se sostuvieron: el agotamiento de la fuerza de voluntad (capítulo 17) y las «posturas de poder» que supuestamente subían la testosterona (Ranehill y otros, 2015, no encontraron efectos hormonales con 200 participantes).</p>
<p>La lección no es «la ciencia no sirve», sino al contrario: la ciencia se corrige a sí misma, y hay que fijarse en qué tan sólida es cada afirmación. Este curso usa la siguiente escalera:</p>
<div class="tablewrap"><table class="semaforo">
<thead><tr><th>Nivel</th><th>Qué significa</th><th>Ejemplo del curso</th></tr></thead>
<tbody>
<tr><td><span class="nivel n4">sólida</span></td><td>Varios metaanálisis o ensayos grandes, preregistrados y replicados por grupos independientes coinciden.</td><td>La plasticidad sináptica; las intenciones de implementación; el balance energético.</td></tr>
<tr><td><span class="nivel n3">moderada</span></td><td>Ensayos controlados consistentes, pero pequeños, heterogéneos o con riesgo de sesgo.</td><td>El ejercicio como tratamiento de la depresión; el «ojo quieto» en el deporte.</td></tr>
<tr><td><span class="nivel n2">preliminar</span></td><td>Pocos estudios, del mismo grupo de autores, sin control adecuado, o resultados mixtos.</td><td>El protocolo RTM para trauma derivado de la PNL; la terapia neural en dolor lumbar.</td></tr>
<tr><td><span class="nivel n1">sin probar</span></td><td>Solo teoría, opinión de expertos o testimonios.</td><td>Los «campos de interferencia» de la terapia neural.</td></tr>
<tr><td><span class="nivel n0">refutada</span></td><td>Se puso a prueba con buenos diseños y no se sostuvo.</td><td>Los sistemas representacionales y los movimientos oculares de la PNL; los estilos de aprendizaje.</td></tr>
</tbody></table></div>
<div class="box do"><ul>
<li>Antes de comprar un curso, una terapia o un suplemento, pregunte: ¿hay un ensayo con grupo de control simulado y evaluación ciega? ¿Lo replicó un grupo que no gana dinero con la técnica?</li>
<li>Cuando lea «un estudio demuestra», busque cuántos participantes tuvo y si fue en personas o en ratones.</li>
<li>Desconfíe de los efectos enormes y rápidos: en conducta humana los efectos reales suelen ser pequeños o moderados (\(d\) entre 0,2 y 0,5).</li>
</ul></div>
</section>

<section>
<h2>Resumen, problemas y autoevaluación</h2>
<div class="box keys"><ul>
<li>Los testimonios no distinguen el efecto de una técnica de la regresión a la media, la historia natural, el placebo y el sesgo de confirmación.</li>
<li>El ensayo controlado aleatorizado, con control simulado y evaluación ciega, compara con lo que habría pasado sin la técnica.</li>
<li>El tamaño del efecto (\(d\), NNT) dice cuánto funciona algo; la significancia, solo si es improbable que sea azar.</li>
<li>Los estudios pequeños tienen poca potencia y, cuando aciertan, exageran el efecto.</li>
<li>Un metaanálisis resume la evidencia, pero el sesgo de publicación puede inflarlo; el gráfico de embudo y la prueba de Egger ayudan a detectarlo.</li>
</ul></div>
<div class="py" data-py="01-regresion-media"></div>
<div class="box read"><p>La primera parte reproduce la simulación del capítulo con 20.000 personas por brazo. Quienes recibieron un tratamiento sin ningún efecto mejoraron en promedio 2,12 puntos, y 53 % mejoró al menos 2 puntos: material de sobra para testimonios. Pero el control mejoró 2,09 puntos; la diferencia, +0,025, es puro azar (p = 0,19). La segunda parte comprueba la fórmula del recuadro: con \(\rho=0{,}6\) y umbral 7, la mejora simulada (1,166) y la calculada con la normal truncada de SciPy (1,163) coinciden. En el ensayo la mejora es mayor que la de la fórmula porque la correlación entre la semana de consulta y el seguimiento es menor que 0,6.</p></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Un curso de «reprogramación mental» presenta 300 testimonios de alumnos que dicen sentirse mejor. ¿Qué información falta para saber si el curso funciona?
<details><summary>Respuesta</summary><p>Un grupo de comparación de personas parecidas que no hicieron el curso (o hicieron uno simulado), asignadas al azar, y medidas de forma ciega. También cuántos alumnos no dieron testimonio.</p></details></li>
<li><span class="lvl">Básico</span>¿Cuál es el NNT de un tratamiento con \(d=0{,}8\)?
<details><summary>Respuesta</summary><p>\(\Phi(0{,}8/\sqrt2)=\Phi(0{,}566)\approx0{,}714\); NNT \(=1/(2\cdot0{,}714-1)\approx2{,}3\).</p></details></li>
<li><span class="lvl">Intermedio</span>El síntoma de una persona tiene media 5 y desviación 1,8, y la correlación entre semanas es 0,6. Consulta cuando supera 7. ¿Cuánto «mejora» en promedio sin hacer nada?
<details><summary>Respuesta</summary><p>\(\E[X\mid X>7]\approx7{,}91\) (normal truncada). Mejora esperada \(=(1-0{,}6)(7{,}91-5)\approx1{,}16\) puntos.</p></details></li>
<li><span class="lvl">Intermedio</span>Un estudio con 15 personas por grupo encontró \(d=0{,}9\), significativo. Un segundo estudio, con 150 por grupo, encontró \(d=0{,}25\). ¿En cuál confía más y por qué?
<details><summary>Respuesta</summary><p>En el segundo: su error estándar es mucho menor. El primero tenía poca potencia, y un resultado significativo en un estudio pequeño suele exagerar el efecto (maldición del ganador).</p></details></li>
<li><span class="lvl">Avanzado</span>Muestre que la mejora esperada por regresión a la media es \((1-\rho)(\E[X\mid X>c]-\mu)\) cuando \(X\) e \(Y\) tienen la misma media y varianza.
<details><summary>Respuesta</summary><p>Para la normal bivariada, \(\E[Y\mid X]=\mu+\rho(X-\mu)\). Tomando esperanza condicional a \(X>c\): \(\E[Y\mid X>c]=\mu+\rho(\E[X\mid X>c]-\mu)\). Restando de \(\E[X\mid X>c]\) se obtiene el resultado.</p></details></li>
</ol>
