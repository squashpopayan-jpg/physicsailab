<p class="lead">Cada década tiene su dieta milagrosa. Los ensayos que las comparan, sin embargo, llegan una y otra vez a la misma conclusión: con las mismas calorías, la proporción de grasas y carbohidratos cambia poco la pérdida de grasa; lo que más la determina es cuánto se sigue la dieta. Este capítulo revisa los experimentos más rigurosos, muchos hechos en unidades metabólicas donde se controla todo lo que se come, y saca de ellos reglas prácticas.</p>

<section>
<h2>Baja en grasa o baja en carbohidratos</h2>
<p>La hipótesis carbohidrato-insulina sostiene que los carbohidratos elevan la insulina, la insulina favorece el depósito de grasa y, por eso, reducir los carbohidratos haría perder más grasa con las mismas calorías. Se ha puesto a prueba de varias formas:</p>
<ul>
<li><b>En unidades metabólicas.</b> Con calorías iguales, una dieta cetogénica aumentó un poco el gasto (unas 57 kcal/día) pero hizo más lenta la pérdida de grasa corporal durante el primer mes, en comparación con una dieta alta en carbohidratos (Hall y otros, 2016). En otro experimento, reducir la grasa hizo perder más grasa corporal que reducir los carbohidratos en igual cantidad de calorías (Hall y otros, 2015; capítulo 24).</li>
<li><b>En la vida real.</b> El ensayo DIETFITS asignó al azar a 609 adultos a una dieta saludable baja en grasa o una saludable baja en carbohidratos durante un año. Las pérdidas medias fueron de 5,3 y 6,0 kg, sin diferencia significativa. Ni un perfil genético ni la secreción de insulina predijeron quién respondía mejor a cada dieta (Gardner y otros, 2018).</li>
</ul>
<p>La variación entre personas dentro de cada dieta fue enorme: algunas perdieron más de 25 kg y otras ganaron peso. Esa variación es mucho mayor que la diferencia entre las dietas.</p>
<div class="sim" data-sim="dos-dietas" data-title="La diferencia entre dietas frente a la diferencia entre personas"></div>
<div class="sim-guide"><ul>
<li>Cada punto es una persona. La dieta A y la B difieren en promedio en 0,7 kg, como en DIETFITS; la adherencia de cada persona varía mucho.</li>
<li>Con 300 personas por grupo, la diferencia de medias puede no ser significativa y, aunque lo fuera, sería pequeña frente al rango individual de más de 30 kg.</li>
<li>Reduzca la variación de la adherencia: el rango se estrecha. Lo que separa a quien pierde mucho de quien no pierde nada es, sobre todo, cuánto sigue el plan.</li>
</ul></div>
<p>Un ensayo anterior comparó cuatro dietas populares (Atkins, Ornish, Weight Watchers y la Zona) durante un año: todas produjeron pérdidas modestas y parecidas, y en cada una la pérdida se asociaba con el nivel de adherencia, no con el tipo de dieta (Dansinger y otros, 2005).</p>
<div class="box evid"><p><span class="nivel n4">sólida</span>Con las mismas calorías, las dietas bajas en grasa y bajas en carbohidratos producen pérdidas de grasa parecidas. <span class="nivel n0">refutada</span>La «ventaja metabólica» que haría perder mucha más grasa con dietas cetogénicas a igualdad de calorías no se confirmó en experimentos controlados.</p></div>
</section>

<section>
<h2>Ultraprocesados y saciedad</h2>
<p>Si las calorías son lo que cuenta, ¿importa la calidad de la comida? Sí, porque cambia cuánto se come. En un experimento de unidad metabólica, 20 adultos pasaron dos semanas con una dieta de ultraprocesados y dos semanas con una de alimentos mínimamente procesados, ambas ofrecidas a voluntad y con las mismas calorías, azúcar, grasa, fibra y sodio disponibles por comida. Con los ultraprocesados comieron unas 500 kcal diarias más y subieron alrededor de 1 kg; con la otra dieta bajaron una cantidad parecida (Hall y otros, 2019). En otro experimento, una dieta vegetal baja en grasa llevó a comer unas 700 kcal diarias menos que una dieta animal cetogénica, ambas a voluntad (Hall y otros, 2021).</p>
<p>Son estudios cortos y con pocas personas, pero muestran el mecanismo: alimentos con mucha densidad energética, poca fibra y que se comen rápido facilitan comer de más sin notarlo. Una dieta basada en alimentos poco procesados, con verduras, legumbres, frutas, proteína suficiente y fibra, hace más fácil sostener un déficit.</p>
<div class="box evid"><p><span class="nivel n3">moderada</span>Las dietas ricas en ultraprocesados facilitan comer más calorías; los experimentos controlados son pocos y cortos, y los estudios de observación apuntan en la misma dirección.</p></div>
</section>

<section>
<h2>Ayuno intermitente</h2>
<p>El ayuno intermitente limita las horas en que se come (por ejemplo, 8 horas de ventana y 16 de ayuno) o alterna días de ingesta normal con días de muy poca comida. Los ensayos que lo comparan con la misma restricción calórica sin horario encuentran resultados parecidos: en un ensayo de un año con 139 personas con obesidad, comer en una ventana de 8 horas más restricción calórica no hizo perder más que la restricción sola (Liu y otros, 2022). Sin restringir calorías, una ventana de 8 horas durante 12 semanas produjo una pérdida pequeña, no distinta de la del grupo control, y parte de lo perdido fue masa magra (Lowe y otros, 2020).</p>
<div class="box evid"><p><span class="nivel n4">sólida</span>El ayuno intermitente funciona tan bien como la restricción calórica continua, no mejor. Es una herramienta útil para quien le resulta más fácil de sostener.</p></div>
</section>

<section>
<h2>Proteína, fuerza y músculo</h2>
<p>Durante un déficit, una parte de lo que se pierde es tejido magro (capítulo 23). Dos medidas reducen esa pérdida: el entrenamiento de fuerza y una ingesta alta de proteína. En un ensayo de cuatro semanas con un déficit de 40 % y entrenamiento intenso, los hombres jóvenes que consumieron 2,4 g de proteína por kilo ganaron 1,2 kg de masa magra y perdieron 4,8 kg de grasa; los que consumieron 1,2 g/kg conservaron su masa magra y perdieron 3,5 kg de grasa (Longland y otros, 2016). Un metaanálisis encontró que, con entrenamiento de fuerza, el beneficio de la proteína adicional se aplana alrededor de 1,6 g por kilo y día (Morton y otros, 2018).</p>
<div class="sim" data-sim="proteina" data-title="¿Cuánta proteína?"></div>
<div class="sim-guide"><ul>
<li>Los rangos combinan el mínimo general (0,8 g/kg), la posición de la Sociedad Internacional de Nutrición Deportiva para quienes entrenan (1,4 a 2,0 g/kg) y los ensayos en déficit (hasta unos 2,4 g/kg).</li>
<li>Repartirla en varias comidas de 0,3 a 0,4 g/kg facilita alcanzar la cifra y estimula la síntesis muscular en cada una.</li>
<li>En personas con mucha grasa corporal, conviene calcular con el peso objetivo en lugar del peso actual.</li>
</ul></div>
<p>En adultos sanos, las dietas altas en proteína no deterioraron la función renal en un metaanálisis de ensayos (Devries y otros, 2018). Las personas con enfermedad renal deben seguir las indicaciones de su médico.</p>
<div class="box evid"><p><span class="nivel n4">sólida</span>El entrenamiento de fuerza y una ingesta de proteína de 1,6 g/kg o más ayudan a conservar la masa magra durante un déficit.</p></div>
</section>

<section>
<h2>Velocidad de la pérdida y mantenimiento</h2>
<p>Se dice que bajar rápido hace recuperar el peso más rápido. En un ensayo que comparó una pérdida rápida (12 semanas con dieta muy baja en calorías) con una gradual (36 semanas), más personas alcanzaron la meta con la rápida, y la recuperación a los tres años fue igual de alta en ambos grupos, alrededor de 70 % del peso perdido (Purcell y otros, 2014). El problema no es la velocidad: es que mantener es difícil con cualquier método.</p>
<p>El Registro Nacional de Control de Peso de Estados Unidos reúne a miles de personas que perdieron al menos 13,6 kg y los mantuvieron por al menos un año. Comparten hábitos: mucha actividad física (alrededor de una hora diaria), pesarse con regularidad, una alimentación bastante constante entre semana y fin de semana, y desayunar (Wing y Phelan, 2005). Es un grupo autoseleccionado y los datos son de observación, pero coinciden con lo que dicen los ensayos sobre hábitos (capítulos 15 y 16).</p>
<div class="box do"><ul>
<li>Elija un patrón de alimentación que pueda sostener durante años; el tipo exacto importa mucho menos.</li>
<li>Apunte a un déficit moderado (alrededor de 0,5 a 1 % del peso por semana), proteína alta y entrenamiento de fuerza dos o tres veces por semana.</li>
<li>Pésese varios días a la semana y mire la tendencia en <a href="#progreso">Mi progreso</a>, no el dato de un día.</li>
</ul></div>
</section>

<section>
<h2>Resumen, problemas y autoevaluación</h2>
<div class="box keys"><ul>
<li>Con las mismas calorías, bajo en grasa y bajo en carbohidratos producen pérdidas de grasa parecidas; la «ventaja metabólica» de la cetogénica no se confirmó.</li>
<li>La variación entre personas es mucho mayor que la diferencia entre dietas, y la adherencia es el mejor predictor.</li>
<li>Los ultraprocesados facilitan comer más; los alimentos poco procesados facilitan sostener el déficit.</li>
<li>El ayuno intermitente funciona igual que la restricción continua.</li>
<li>Proteína alta y fuerza conservan el músculo durante el déficit.</li>
<li>La recuperación del peso es frecuente con cualquier velocidad; los hábitos de mantenimiento son la clave.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Un amigo perdió 3 kg la primera semana de una dieta cetogénica y dice que «quema grasa mucho más rápido». ¿Qué le explicaría?
<details><summary>Respuesta</summary><p>Que la mayor parte de esa pérdida inicial es glucógeno y agua (capítulo 23), y que en experimentos controlados, con las mismas calorías, la cetogénica no hace perder más grasa.</p></details></li>
<li><span class="lvl">Intermedio</span>Si la diferencia media entre dos dietas es de 0,7 kg y la desviación estándar individual es de 6 kg, ¿cuál es el tamaño del efecto \(d\)? ¿Qué porcentaje de personas de la dieta peor pierde más que la media de la mejor?
<details><summary>Respuesta</summary><p>\(d \approx 0{,}7/6 \approx 0{,}12\). Con distribuciones normales, alrededor de \(\Phi(-0{,}12) \approx 45\,\%\): casi la mitad.</p></details></li>
</ol>
