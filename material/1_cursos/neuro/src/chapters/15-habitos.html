<p class="lead">Esta parte del curso es la más práctica. Si «reprogramar la mente» significa algo concreto y alcanzable, es esto: convertir conductas que hoy exigen decisión y esfuerzo en conductas que salen solas. La ciencia del hábito explica cómo ocurre, cuánto tarda y por qué el contexto importa más que la fuerza de voluntad.</p>

<section>
<h2>Qué es un hábito</h2>
<p>En psicología, un <span class="term">hábito</span> no es simplemente algo que se hace a menudo. Es una conducta que se dispara de forma automática ante una señal del contexto (un lugar, una hora, una acción previa), aprendida a fuerza de repetir esa conducta en ese contexto (Wood y Rünger, 2016). Lavarse los dientes al levantarse, revisar el celular al sentarse en el bus, pedir postre al terminar el almuerzo.</p>
<p>Son más comunes de lo que creemos: en estudios con diarios, cerca de 43 % de las conductas que las personas registraban se repetían casi a diario en el mismo lugar, a menudo mientras pensaban en otra cosa (Wood, Quinn y Kashy, 2002). Y cuando un hábito es fuerte, predice la conducta mejor que las intenciones: la gente hace lo que suele hacer aunque se proponga otra cosa (Ouellette y Wood, 1998).</p>
<div class="eq key" data-name="Ciclo del hábito">\[\text{señal del contexto}\;\longrightarrow\;\text{conducta}\;\longrightarrow\;\text{consecuencia}\qquad(\text{repetido en el mismo contexto})\]</div>
</section>

<section>
<h2>Metas frente a hábitos</h2>
<p>Los estudios con animales distinguen dos sistemas que controlan la conducta (Dickinson, 1985). El <b>sistema dirigido a metas</b> elige acciones según el valor actual de sus consecuencias: si el premio deja de interesar, la conducta se detiene. El <b>sistema de hábitos</b> repite lo que se hizo antes en esa situación, sin consultar el valor de la consecuencia. La prueba clásica es la <span class="term">devaluación</span>: se entrena a una rata a presionar una palanca para obtener comida; luego se le quita el interés por esa comida (dejándola comer hasta saciarse o asociándola con malestar). Con poco entrenamiento, la rata deja de presionar. Con mucho entrenamiento, sigue presionando por una comida que ya no quiere (Adams, 1982).</p>
<div class="sim" data-sim="devaluacion" data-title="Entrenamiento corto o largo: ¿se detiene la conducta cuando el premio pierde valor?"></div>
<div class="sim-guide"><ul>
<li>Modelo inspirado en Miller, Shenhav y Ludvig (2019): un sistema aprende el valor de las consecuencias; otro, la fuerza del hábito, que crece solo con repetir. Después del entrenamiento, el premio se devalúa.</li>
<li>Con entrenamiento corto, la conducta cae rápido tras la devaluación. Con entrenamiento largo, persiste: el hábito ya manda.</li>
<li>Ponga el peso del hábito en cero (un agente puramente dirigido a metas): la conducta se detiene siempre, sin importar cuánto se entrenó.</li>
</ul></div>
<p>En el cerebro, los dos sistemas dependen de circuitos distintos de los ganglios basales: el estriado dorsomedial para la conducta dirigida a metas y el dorsolateral para los hábitos (Yin y Knowlton, 2006). Con la práctica, la actividad del estriado se concentra al inicio y al final de una secuencia de acciones, como si la «empaquetara» en un solo bloque: Ann Graybiel lo llamó <span class="term">troceado</span> o <i>chunking</i> (Graybiel, 2008). Por eso un hábito se ejecuta completo una vez que arranca.</p>
<div class="box evid"><p><span class="nivel n4">sólida en animales</span><span class="nivel n2">más débil en humanos</span>En roedores, el paso de metas a hábitos con el entrenamiento está bien establecido. En personas ha sido difícil de reproducir en el laboratorio: un equipo intentó cinco veces inducir hábitos con sobreentrenamiento y no lo logró (de Wit y otros, 2018). Los hábitos humanos de la vida diaria son reales y medibles, pero los modelos de laboratorio son más limitados de lo que sugieren los libros populares.</p></div>
</section>

<section>
<h2>¿Cuánto tarda en formarse un hábito?</h2>
<p>La cifra de «21 días» no viene de ningún estudio sobre hábitos. El estudio de referencia es el de Phillippa Lally y sus colegas (2010) en el University College de Londres: 96 voluntarios eligieron una conducta saludable nueva (comer una fruta en el almuerzo, beber agua, caminar 15 minutos) y la repitieron cada día después de la misma señal durante 12 semanas, reportando a diario qué tan automática la sentían.</p>
<div class="eq key" data-name="Curva de automaticidad">\[A(t)=a-b\,\ee^{-ct},\qquad t_{95}=\frac1c\ln\frac{b}{0{,}05\,a}.\]</div>
<p>La automaticidad creció rápido al principio y luego se aplanó, como una curva de saturación. De los 82 participantes con datos suficientes, la curva se ajustó bien a 39; para ellos, la mediana de días hasta alcanzar el 95 % de su meseta fue de 66, con un rango de 18 a 254 días. Las conductas de ejercicio tardaron cerca de una vez y media más que las de comer o beber. Y fallar un día no alteró de forma apreciable el proceso. Una revisión sistemática de 2024 con 20 estudios encontró medianas de 59 a 66 días y tiempos individuales de 4 a 335 días; solo una minoría de participantes llegó al criterio de hábito formado (Singh y otros, 2024).</p>
<div class="sim" data-sim="lally" data-title="Su curva de automaticidad: ajuste y días hasta el 95 %"></div>
<div class="sim-guide"><ul>
<li>Los puntos simulan el autorreporte diario de una persona (escala de 1 a 7) durante 12 semanas. La curva se ajusta por mínimos cuadrados con el mismo método validado en el apéndice E.</li>
<li>Haga más lento el hábito: la estimación de \(t_{95}\) cae más allá del día 84 y se vuelve una extrapolación muy incierta. Así aparecieron los 254 días del estudio original.</li>
<li>Agregue días fallados: si se retoma al día siguiente, la curva casi no cambia. Si cada falla resta mucho, la meseta se retrasa.</li>
</ul></div>
<div class="py" data-py="15-curva-habito"></div>
<div class="box read"><p>Con 13 respuestas semanales, el ajuste recuperó una tasa de 0,048 ± 0,007 por día y estimó 59 días hasta el 95 % de la meseta, cerca de los 60 que daban los parámetros reales. Con cuarenta personas simuladas de tasas distintas, la mediana fue de 85 días y el rango de 23 a 1.156: la mitad de las estimaciones caen más allá de los 84 días observados y son extrapolaciones. Así se lee bien el «rango de 18 a 254 días» de Lally: mucha variación real, más la incertidumbre de extrapolar.</p></div>
</section>

<section>
<h2>Medir la automaticidad</h2>
<p>Como un hábito es una conducta automática, se mide preguntando qué tan automática se siente. El <span class="term">índice de automaticidad conductual autorreportada</span> (SRBAI) usa cuatro afirmaciones que se califican de 1 a 7 (Gardner y otros, 2012): «lo hago automáticamente», «lo hago sin tener que recordarlo conscientemente», «lo hago sin pensar» y «empiezo a hacerlo antes de darme cuenta». Es la escala que usa su medidor de progreso, una vez por semana para cada hábito.</p>
<div class="box warn"><p>La automaticidad autorreportada tiene límites: las personas no siempre perciben bien sus propios procesos automáticos. Por eso, además de la escala, conviene registrar si la conducta ocurrió (el registro diario) y fijarse en señales objetivas, como empezar la conducta sin haber tomado la decisión.</p></div>
</section>

<section>
<h2>El contexto es el interruptor</h2>
<p>Si el hábito lo dispara el contexto, cambiar el contexto lo desactiva. Bas Verplanken y Deborah Roy (2016) aprovecharon este hecho: en personas que acababan de mudarse, una intervención para promover conductas sostenibles tuvo más efecto que en quienes llevaban tiempo en su casa. Lo llamaron la <span class="term">hipótesis de la discontinuidad del hábito</span>: los cambios de vida (mudanza, nuevo trabajo, vacaciones, el inicio de un año) abren una ventana en la que los hábitos viejos están desconectados y es más fácil instalar otros.</p>
<div class="sim" data-sim="contexto" data-title="Un hábito atado al contexto: qué pasa en vacaciones o después de una mudanza"></div>
<div class="sim-guide"><ul>
<li>La persona tiene un hábito fuerte en su contexto habitual. Durante el periodo marcado cambia de contexto. Sin la señal de siempre, la conducta queda en manos de la intención.</li>
<li>Para un hábito deseado (entrenar), las vacaciones lo interrumpen, pero vuelve al regresar si la fuerza en casa se conservó. Para un hábito indeseado, una mudanza es la oportunidad de no reconstruirlo en el lugar nuevo.</li>
</ul></div>
</section>

<section>
<h2>Resumen, problemas y autoevaluación</h2>
<div class="box keys"><ul>
<li>Un hábito es una conducta disparada automáticamente por una señal del contexto, aprendida al repetirla en ese contexto. Cerca de 43 % de las conductas diarias se repiten casi a diario en el mismo lugar.</li>
<li>El sistema de hábitos actúa sin consultar el valor de la consecuencia; en animales, el sobreentrenamiento lo vuelve dominante. En humanos, el fenómeno de laboratorio es más difícil de reproducir.</li>
<li>Formar un hábito tarda en mediana unos dos meses, con enormes diferencias entre personas y conductas; fallar un día no importa mucho.</li>
<li>La automaticidad se mide con el SRBAI. El contexto es el interruptor del hábito: los cambios de vida abren ventanas para cambiarlo.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Con \(a=6\), \(b=4\) y \(c=0{,}05\) por día, ¿cuándo se alcanza el 95 % de la meseta?
<details><summary>Respuesta</summary><p>\(t_{95}=\ln(4/0{,}3)/0{,}05=\ln(13{,}33)/0{,}05\approx2{,}59/0{,}05\approx52\) días.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Por qué la prueba de devaluación distingue un hábito de una conducta dirigida a metas?
<details><summary>Respuesta</summary><p>Porque solo el sistema dirigido a metas consulta el valor actual de la consecuencia; si la conducta continúa cuando el premio ya no se desea, la controla el hábito.</p></details></li>
<li><span class="lvl">Intermedio</span>Proponga cómo aprovechar un viaje de dos semanas para dejar de mirar el celular en la cama.
<details><summary>Respuesta</summary><p>Durante el viaje el contexto es nuevo: dejar el celular fuera de la habitación desde la primera noche; al volver, cambiar el contexto de casa (cargador en otra habitación, despertador físico) para no reactivar la señal vieja.</p></details></li>
</ol>
