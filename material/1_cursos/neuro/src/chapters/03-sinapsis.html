<p class="lead">Una neurona sola no piensa. Lo que hace posible aprender es la forma en que las neuronas se conectan y, sobre todo, que esas conexiones pueden cambiar de fuerza. Este capítulo explica la sinapsis química, el lugar donde ocurre ese cambio, y desmonta de paso algunas de las ideas más repetidas sobre la «hormona del placer» o la «química de la felicidad».</p>

<section>
<h2>La sinapsis química</h2>
<p>A comienzos del siglo XX se discutía si las neuronas se comunicaban con chispas eléctricas o con sustancias químicas. En 1921 Otto Loewi zanjó la discusión con un experimento elegante: estimuló el nervio vago de un corazón de rana aislado, que se desaceleró, y pasó el líquido que lo bañaba a un segundo corazón sin estimular, que también se desaceleró. El nervio había liberado una sustancia, que resultó ser la acetilcolina. Loewi compartió el Nobel de 1936.</p>
<p>En una sinapsis química, el impulso que llega al terminal abre canales de calcio; el calcio hace que pequeñas vesículas cargadas de <span class="term">neurotransmisor</span> se fusionen con la membrana y lo liberen en una hendidura de unos 20 nanómetros. El neurotransmisor se une a receptores de la neurona siguiente y luego se retira: se recapta, se degrada o se difunde. Todo dura uno o pocos milisegundos.</p>
<div class="box def"><p><b>Dos clases de receptores.</b> Los <b>ionotrópicos</b> son canales que se abren al unirse el neurotransmisor: actúan en milisegundos (glutamato en receptores AMPA, GABA en receptores GABA-A). Los <b>metabotrópicos</b> activan cascadas químicas dentro de la célula: son más lentos, duran más y pueden cambiar la expresión de genes (la mayoría de los receptores de dopamina y serotonina).</p></div>
<p>La corteza humana tiene del orden de cien a ciento cincuenta billones de sinapsis (Pakkenberg y otros, 2003). Cada neurona recibe miles. Su fuerza no es fija: puede crecer o decrecer con la experiencia, y ese es el tema del capítulo 4.</p>
</section>

<section>
<h2>Excitación, inhibición y suma</h2>
<p>El <span class="term">glutamato</span> es el principal neurotransmisor excitador del cerebro: despolariza la neurona siguiente y produce un potencial postsináptico excitador (PPSE) de pocos milivoltios. El <span class="term">GABA</span> es el principal inhibidor: hiperpolariza o «cortocircuita» la membrana. Un solo PPSE casi nunca basta para disparar una espiga, porque el umbral está unos 15 mV por encima del reposo. La neurona dispara cuando suma muchas entradas:</p>
<ul>
<li><b>Suma temporal:</b> varias espigas de una misma sinapsis, muy seguidas, se apilan antes de que la anterior se desvanezca.</li>
<li><b>Suma espacial:</b> entradas simultáneas de sinapsis distintas se suman.</li>
<li><b>Inhibición:</b> una entrada inhibidora en el momento justo puede vetar el disparo.</li>
</ul>
<div class="sim" data-sim="suma" data-title="Suma temporal, suma espacial e inhibición en una neurona"></div>
<div class="sim-guide"><ul>
<li>La sinapsis A envía tres espigas seguidas. Acorte el intervalo entre ellas: por debajo de cierto valor los potenciales se apilan y la neurona dispara (suma temporal).</li>
<li>Las sinapsis B y C llegan juntas a los 60 ms. Con una sola no alcanza; con las dos sí (suma espacial). Suba el peso sináptico: una sinapsis más fuerte necesita menos ayuda. Así se ve, en pequeño, lo que significa «fortalecer una conexión».</li>
<li>Active la inhibición y muévala en el tiempo: si coincide con las entradas excitadoras, veta el disparo.</li>
</ul></div>
</section>

<section>
<h2>Neuromoduladores: lo que sí hacen y lo que no</h2>
<p>Además del glutamato y el GABA, que transmiten información punto a punto, hay sustancias que <i>modulan</i>: cambian cómo responden grandes regiones del cerebro. Las producen núcleos pequeños del tronco encefálico y del cerebro medio que envían axones muy ramificados a casi todo el cerebro.</p>
<div class="tablewrap"><table>
<thead><tr><th>Neuromodulador</th><th>Origen principal</th><th>Funciones mejor establecidas</th></tr></thead>
<tbody>
<tr><td>Dopamina</td><td>área tegmental ventral y sustancia negra</td><td>error de predicción de recompensa y aprendizaje (capítulo 7), motivación y vigor, control del movimiento (su pérdida produce el párkinson)</td></tr>
<tr><td>Noradrenalina</td><td>locus coeruleus</td><td>alerta, atención, respuesta al estrés</td></tr>
<tr><td>Serotonina</td><td>núcleos del rafe</td><td>regulación del ánimo, el sueño, el apetito y la impulsividad; papel complejo y aún discutido</td></tr>
<tr><td>Acetilcolina</td><td>prosencéfalo basal; también la unión neuromuscular</td><td>atención, plasticidad cortical; contracción muscular</td></tr>
</tbody></table></div>
<div class="box myth">
<p class="m"><b>Mito</b>«La dopamina es la molécula del placer» y por eso conviene hacer un «ayuno de dopamina».</p>
<p class="r"><b>Realidad</b>Los experimentos de Kent Berridge mostraron que ratas sin dopamina siguen disfrutando del sabor dulce (lo «gustan»), pero no se esfuerzan por conseguirlo (no lo «quieren»). La dopamina tiene más que ver con la motivación y con aprender qué predice una recompensa que con el placer en sí (Berridge y Robinson, 1998). Un «ayuno de dopamina» no vacía nada: lo que puede ayudar es reducir señales y tentaciones, que es otra cosa (capítulo 16).</p>
</div>
<div class="box myth">
<p class="m"><b>Mito</b>«La depresión es una falta de serotonina».</p>
<p class="r"><b>Realidad</b>Una revisión paraguas no encontró evidencia consistente de que la depresión se deba simplemente a niveles bajos de serotonina (Moncrieff y otros, 2022); la revisión fue debatida, pero la idea del «desequilibrio químico» simple ya no la sostienen la mayoría de los investigadores. Eso no significa que los antidepresivos no sirvan: un metaanálisis en red de 522 ensayos encontró que los 21 antidepresivos estudiados superan al placebo en la depresión mayor, con efectos modestos (Cipriani y otros, 2018). Cómo actúan es una pregunta distinta de si funcionan.</p>
</div>
<div class="box myth">
<p class="m"><b>Mito</b>«Un aerosol de oxitocina, la hormona del amor, aumenta la confianza».</p>
<p class="r"><b>Realidad</b>Los primeros estudios llamativos tenían muestras pequeñas. Un análisis de esa literatura estimó una potencia estadística media muy baja y concluyó que buena parte de los efectos conductuales reportados de la oxitocina por vía nasal probablemente son falsos positivos (Walum, Waldman y Young, 2016). Es un buen ejemplo de lo visto en el capítulo 1.</p>
</div>
</section>

<section>
<h2>Cómo actúan los fármacos en la sinapsis</h2>
<p>Casi todos los fármacos y drogas que afectan la mente lo hacen en la sinapsis. Pueden imitar al neurotransmisor (agonistas), bloquear su receptor (antagonistas), impedir su recaptación para que dure más en la hendidura, o alterar su liberación.</p>
<div class="tablewrap"><table>
<thead><tr><th>Sustancia</th><th>Mecanismo</th><th>Efecto</th></tr></thead>
<tbody>
<tr><td>Cafeína</td><td>antagonista de receptores de adenosina</td><td>bloquea una señal de cansancio acumulado</td></tr>
<tr><td>Alcohol, benzodiacepinas</td><td>potencian receptores GABA-A</td><td>más inhibición: sedación, menos ansiedad, menos coordinación</td></tr>
<tr><td>Nicotina</td><td>agonista de receptores nicotínicos de acetilcolina</td><td>alerta; libera dopamina, de ahí su poder adictivo</td></tr>
<tr><td>Cocaína</td><td>bloquea la recaptación de dopamina (y noradrenalina y serotonina)</td><td>la dopamina se acumula en la hendidura</td></tr>
<tr><td>Inhibidores selectivos de la recaptación de serotonina</td><td>bloquean el transportador de serotonina</td><td>antidepresivos y ansiolíticos; el efecto clínico tarda semanas</td></tr>
<tr><td>Toxina botulínica</td><td>impide la liberación de acetilcolina</td><td>parálisis muscular local</td></tr>
<tr><td>Anestésicos locales (lidocaína, procaína)</td><td>bloquean canales de sodio en el axón</td><td>el impulso no se conduce (capítulo 29)</td></tr>
</tbody></table></div>
<div class="sim" data-sim="hendidura" data-title="Qué pasa en la hendidura sináptica con un inhibidor de la recaptación o un antagonista"></div>
<div class="sim-guide"><ul>
<li>Cada espiga libera un pulso de neurotransmisor que la recaptación retira en pocos milisegundos. La respuesta postsináptica sigue a la fracción de receptores ocupados.</li>
<li>Reduzca la recaptación: el neurotransmisor permanece más tiempo y la respuesta se alarga y se suma entre espigas. Así actúan, en esencia, la cocaína sobre la dopamina y los antidepresivos sobre la serotonina.</li>
<li>Agregue un antagonista: ocupa receptores sin activarlos y la respuesta se achica aunque haya mucho neurotransmisor.</li>
</ul></div>
</section>

<section>
<h2>Resumen, problemas y autoevaluación</h2>
<div class="box keys"><ul>
<li>Las neuronas se comunican sobre todo por sinapsis químicas: el impulso libera neurotransmisor que actúa sobre receptores de la célula siguiente.</li>
<li>El glutamato excita y el GABA inhibe; una neurona dispara cuando la suma temporal y espacial de sus entradas supera el umbral.</li>
<li>La dopamina, la serotonina, la noradrenalina y la acetilcolina modulan la actividad de regiones enteras. La dopamina se relaciona con la motivación y el aprendizaje más que con el placer.</li>
<li>Los fármacos actúan imitando, bloqueando, prolongando o impidiendo la acción de los neurotransmisores.</li>
<li>Muchas ideas populares sobre la «química del cerebro» (ayuno de dopamina, depresión como falta de serotonina, oxitocina en aerosol) simplifican o contradicen la evidencia.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Por qué un solo potencial postsináptico excitador casi nunca dispara una espiga?
<details><summary>Respuesta</summary><p>Porque mide pocos milivoltios y el umbral está unos 15 mV por encima del reposo; hacen falta varias entradas sumadas en el tiempo o en el espacio.</p></details></li>
<li><span class="lvl">Básico</span>Clasifique: un fármaco que se une al receptor y lo activa; uno que se une y no lo activa; uno que bloquea el transportador de recaptación.
<details><summary>Respuesta</summary><p>Agonista; antagonista; inhibidor de la recaptación.</p></details></li>
<li><span class="lvl">Intermedio</span>En la simulación, si la constante de tiempo de la membrana fuera de 30 ms en lugar de 10, ¿sería más fácil o más difícil la suma temporal?
<details><summary>Respuesta</summary><p>Más fácil: cada potencial tarda más en desvanecerse, así que espigas más separadas todavía se apilan.</p></details></li>
<li><span class="lvl">Intermedio</span>Un estudio con 30 personas encuentra que un aerosol de oxitocina aumenta la confianza en un juego económico. ¿Qué preguntas haría antes de creerlo?
<details><summary>Respuesta</summary><p>¿Fue preregistrado? ¿Cuál era la potencia? ¿Hubo placebo y doble ciego? ¿Se replicó con muestras grandes en otros laboratorios? ¿Cuántos desenlaces se midieron? (Capítulo 1.)</p></details></li>
</ol>
