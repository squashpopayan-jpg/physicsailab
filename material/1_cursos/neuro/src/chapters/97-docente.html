<template class="chapter-src" data-id="docente" data-num="D" data-title="Guía para enseñar el curso" data-part="Apéndices" data-short="Qué dice la evidencia sobre cómo se aprende; principios didácticos y éticos para temas de salud y cuerpo; cinco secuencias (curso completo, PNL bajo la lupa, deportistas, grasa sin mitos y neurociencia computacional); actividades de aula; evaluación diagnóstica y rúbrica del plan">
<p class="lead">Este curso se escribió para aprender y también para enseñar: en una universidad, en un club deportivo, en un colegio o en un grupo comunitario. Este apéndice reúne lo necesario para llevarlo a un aula: lo que se sabe sobre cómo se aprende, cuidados éticos en temas de cuerpo y salud mental, cinco secuencias de sesiones con actividades y una evaluación diagnóstica que sirve antes y después.</p>

<section>
<h2>Enseñar con lo que el curso enseña</h2>
<p>Las técnicas de estudio con más respaldo son las mismas que explica el capítulo 5: la <b>práctica de recuperación</b> (responder preguntas en lugar de releer) y la <b>práctica espaciada</b> (volver sobre los temas a lo largo de semanas). Una revisión de diez técnicas de estudio las calificó como las de mayor utilidad, y el subrayado y la relectura, como de baja utilidad (Dunlosky y otros, 2013). En un experimento clásico, quienes respondieron preguntas sobre un texto recordaban más a la semana que quienes lo releyeron, aunque se sentían menos seguros (Roediger y Karpicke, 2006).</p>
<p>Los docentes no están libres de neuromitos: en una encuesta en el Reino Unido y los Países Bajos, los profesores interesados en el cerebro creían en promedio cerca de la mitad de los mitos presentados, como los estilos de aprendizaje (Dekker y otros, 2012). Por eso la evaluación diagnóstica de este apéndice empieza por ahí.</p>
<ul>
<li>Abra cada sesión con tres preguntas de recuperación de la sesión anterior. Las autoevaluaciones de cada capítulo sirven para eso.</li>
<li>Use las simulaciones antes de la explicación: pida una predicción, luego muévanlas y discutan la diferencia.</li>
<li>Pida que cada estudiante ejecute al menos un programa en Python y cambie un parámetro.</li>
</ul>
</section>

<section>
<h2>Principios éticos</h2>
<ul>
<li><b>Nunca pesar ni medir en clase.</b> Los datos del cuerpo son privados. El tablero «Mi progreso» guarda los datos de cada persona solo para ella.</li>
<li><b>Cuidado con la conducta alimentaria.</b> En cualquier grupo puede haber personas con trastornos de la conducta alimentaria. No promueva déficits grandes, no compare cuerpos y ofrezca la parte de grasa corporal como fisiología, no como meta obligatoria.</li>
<li><b>No diagnosticar.</b> Los capítulos de terapias informan; no reemplazan una consulta. Tenga a mano los contactos de salud mental de su institución.</li>
<li><b>Respeto a las creencias.</b> Algunos estudiantes o sus familias usan PNL o terapia neural. El objetivo es enseñar a evaluar la evidencia, no ridiculizar. Las preguntas del capítulo 1 sirven para cualquier afirmación, incluidas las del propio curso.</li>
</ul>
</section>

<section>
<h2>Cinco secuencias</h2>
<div class="tablewrap"><table>
<thead><tr><th>Secuencia</th><th>Sesiones</th><th>Capítulos</th><th>Producto final</th></tr></thead>
<tbody>
<tr><td><b>Curso completo</b> (electiva universitaria)</td><td>16 semanas, 2 sesiones de 2 h</td><td>Todos, en orden; 2 capítulos por semana</td><td>Plan personal de 12 semanas con datos de «Mi progreso» y análisis de una afirmación popular con las herramientas del capítulo 1</td></tr>
<tr><td><b>PNL bajo la lupa</b></td><td>3 sesiones de 2 h</td><td>1, 9, 10, 11, 12, 14</td><td>Ficha de evaluación de una técnica de PNL: qué afirma, qué se ha probado, qué rescatar</td></tr>
<tr><td><b>Cerebro y deporte</b> (entrenadores y deportistas)</td><td>4 sesiones de 2 h</td><td>13, 19, 20, 21, 22</td><td>Plan de un mesociclo con carga por RPE, puesta a punto y rutina mental</td></tr>
<tr><td><b>Grasa sin mitos</b></td><td>4 sesiones de 1,5 h</td><td>15, 18, 23, 24, 25, 26</td><td>Análisis crítico de una dieta popular con el modelo de Hall</td></tr>
<tr><td><b>Neurociencia computacional</b> (física, ingeniería)</td><td>8 semanas</td><td>2 a 8, 21, 23, 29, apéndices B y E</td><td>Un modelo propio en Python validado contra el curso o contra un resultado publicado</td></tr>
</tbody></table></div>
</section>

<section>
<h2>Actividades de aula</h2>
<ul>
<li><b>El efecto Forer</b> (capítulo 9): entregue a cada estudiante el «perfil personal» de la demostración y pida que califique cuánto lo describe antes de revelar que todos recibieron el mismo.</li>
<li><b>Ojos que no mienten</b> (capítulo 10): en parejas, uno recuerda o inventa y el otro intenta adivinar por los ojos; tabulen los aciertos y apliquen la prueba binomial.</li>
<li><b>Dibujo en espejo</b> (capítulo 19): practicar el trazo de una estrella mirando un espejo, en bloques o mezclado con otras figuras; medir el tiempo y repetir al día siguiente.</li>
<li><b>Ruido del peso</b> (capítulo 18): con datos simulados del tablero, discutir cuántas semanas hacen falta para detectar una tendencia.</li>
<li><b>Carga de la semana</b> (capítulo 21): cada deportista registra minutos y RPE durante dos semanas y calcula su monotonía.</li>
<li><b>Una serie de casos falsa</b> (capítulo 29): con la simulación de la serie de 280 pacientes, el grupo debe convencer a un «comité» de que el tratamiento funciona y otro grupo debe refutarlo.</li>
</ul>
</section>

<section>
<h2>Evaluación diagnóstica</h2>
<p>Aplíquela al empezar y al terminar el curso. Las respuestas se guardan en el navegador de cada estudiante y aparecen en la pestaña «Curso» de «Mi progreso».</p>

<h2>Rúbrica del plan personal</h2>

<thead><tr><th>Criterio</th><th>En desarrollo</th><th>Logrado</th><th>Destacado</th></tr></thead>
<tbody>
<tr><td>Meta</td><td>Vaga («estar en forma»)</td><td>Concreta y medible</td><td>Concreta, medible y con contraste mental (WOOP)</td></tr>
<tr><td>Hábitos</td><td>Muchos, sin señal</td><td>Dos o tres con señal si-entonces</td><td>Con diseño del entorno y plan para fallos</td></tr>
<tr><td>Dosis</td><td>Extrema o sin progresión</td><td>Moderada y progresiva</td><td>Con descarga y criterios para ajustar</td></tr>
<tr><td>Medición</td><td>Sin registro</td><td>Registro regular</td><td>Análisis de tendencia y de automaticidad con los datos propios</td></tr>
<tr><td>Evidencia</td><td>Sin fuentes</td><td>Cita capítulos del curso</td><td>Distingue niveles de evidencia y reconoce límites</td></tr>
