<section>
<h2>La neurona</h2>
<div class="tablewrap"><table>
<thead><tr><th>Concepto</th><th>Ecuación</th><th>Cap.</th></tr></thead>
<tbody>
<tr><td>Potencial de Nernst</td><td>\(E_X=\dfrac{RT}{zF}\ln\dfrac{[X]_{\text{fuera}}}{[X]_{\text{dentro}}}\)</td><td class="c">2</td></tr>
<tr><td>Goldman-Hodgkin-Katz</td><td>\(V=\dfrac{RT}{F}\ln\dfrac{p_K[\K]_o+p_{Na}[\Na]_o+p_{Cl}[\text{Cl}]_i}{p_K[\K]_i+p_{Na}[\Na]_i+p_{Cl}[\text{Cl}]_o}\)</td><td class="c">2</td></tr>
<tr><td>Hodgkin-Huxley</td><td>\(C\dfrac{dV}{dt}=I-\bar g_{Na}m^3h(V-E_{Na})-\bar g_K n^4(V-E_K)-g_L(V-E_L)\)</td><td class="c">2</td></tr>
<tr><td>Compuertas</td><td>\(\dfrac{dx}{dt}=\alpha_x(V)(1-x)-\beta_x(V)\,x,\quad x\in\{m,h,n\}\)</td><td class="c">2</td></tr>
<tr><td>Cable (axón)</td><td>\(C\dfrac{\partial V}{\partial t}=\dfrac{a}{2R_i}\dfrac{\partial^2V}{\partial x^2}-I_{\text{iónica}}\)</td><td class="c">2, 29</td></tr>
<tr><td>Integrar y disparar</td><td>\(\tau\dfrac{dV}{dt}=-(V-E_L)+RI\); espiga si \(V\ge V_{\text{umbral}}\)</td><td class="c">2</td></tr>
<tr><td>Frecuencia de integrar y disparar</td><td>\(f=\left[t_{\text{ref}}+\tau\ln\dfrac{RI+E_L-V_r}{RI+E_L-V_{\text{umbral}}}\right]^{-1}\)</td><td class="c">2</td></tr>
<tr><td>Corriente sináptica (función alfa)</td><td>\(I(t)=w\,\dfrac{t}{\tau_s}\,\ee^{1-t/\tau_s}\)</td><td class="c">3</td></tr>
<tr><td>Bloqueo dependiente del uso</td><td>\(\dfrac{db}{dt}=k_{\text{on}}\,c\,(1-h)^p(1-b)-k_{\text{off}}\,b,\quad \bar g_{Na}\to\bar g_{Na}(1-b)\)</td><td class="c">29</td></tr>
</tbody></table></div>
</section>

<section>
<h2>Plasticidad y memoria</h2>
<div class="tablewrap"><table>
<thead><tr><th>Concepto</th><th>Ecuación</th><th>Cap.</th></tr></thead>
<tbody>
<tr><td>Regla de Hebb</td><td>\(\Delta w=\eta\,x\,y\)</td><td class="c">4</td></tr>
<tr><td>Regla de Oja</td><td>\(\Delta w=\eta\,y\,(x-y\,w)\); \(w\) tiende al vector propio principal</td><td class="c">4</td></tr>
<tr><td>Regla BCM</td><td>\(\Delta w=\eta\,x\,y\,(y-\theta),\quad\theta=\langle y^2\rangle\)</td><td class="c">4</td></tr>
<tr><td>STDP</td><td>\(\Delta w=A_+\ee^{-\Delta t/\tau_+}\) si \(\Delta t&gt;0\); \(-A_-\ee^{\Delta t/\tau_-}\) si \(\Delta t&lt;0\)</td><td class="c">4</td></tr>
<tr><td>Hopfield: pesos</td><td>\(w_{ij}=\dfrac1N\sum_\mu \xi_i^\mu\xi_j^\mu\)</td><td class="c">5</td></tr>
<tr><td>Hopfield: bit inestable</td><td>\(P_{\text{error}}=\tfrac12\left[1-\operatorname{erf}\sqrt{N/(2P)}\right]\)</td><td class="c">5</td></tr>
</tbody></table></div>
</section>

<section>
<h2>Aprendizaje y decisión</h2>
<div class="tablewrap"><table>
<thead><tr><th>Concepto</th><th>Ecuación</th><th>Cap.</th></tr></thead>
<tbody>
<tr><td>Rescorla-Wagner</td><td>\(\Delta V=\alpha\beta\left(\lambda-\sum V\right)\)</td><td class="c">7</td></tr>
<tr><td>Error de predicción (diferencias temporales)</td><td>\(\delta=r+\gamma V(s')-V(s),\quad V(s)\leftarrow V(s)+\alpha\,\delta\)</td><td class="c">7</td></tr>
<tr><td>Perceptrón</td><td>\(w\leftarrow w+\eta\,(t-y)\,x,\quad y=[w\cdot x+b&gt;0]\)</td><td class="c">8</td></tr>
<tr><td>Integración óptima de señales</td><td>\(\hat s=\dfrac{w_V s_V+w_H s_H}{w_V+w_H},\ w=1/\sigma^2,\ \sigma^2_{\text{comb}}=\dfrac{\sigma_V^2\sigma_H^2}{\sigma_V^2+\sigma_H^2}\)</td><td class="c">8</td></tr>
<tr><td>Descuento hiperbólico</td><td>\(V=\dfrac{A}{1+kD}\)</td><td class="c">17</td></tr>
<tr><td>Extinción con contexto</td><td>\(p=V-I_g-I_c;\ I_g\leftarrow I_g+\alpha_g p;\ I_c\leftarrow I_c+\alpha_c p\)</td><td class="c">30</td></tr>
</tbody></table></div>
</section>

<section>
<h2>Evidencia</h2>
<div class="tablewrap"><table>
<thead><tr><th>Concepto</th><th>Ecuación</th><th>Cap.</th></tr></thead>
<tbody>
<tr><td>Tamaño del efecto</td><td>\(d=\dfrac{\bar x_1-\bar x_2}{s_{\text{combinada}}}\)</td><td class="c">1</td></tr>
<tr><td>Media de una normal truncada</td><td>\(E[X\mid X&gt;c]=\mu+\sigma\dfrac{\varphi(\alpha)}{1-\Phi(\alpha)},\ \alpha=\dfrac{c-\mu}{\sigma}\)</td><td class="c">1</td></tr>
<tr><td>Regresión a la media</td><td>\(E[X_2\mid X_1&gt;c]=\mu+\rho\,(E[X_1\mid X_1&gt;c]-\mu)\)</td><td class="c">1</td></tr>
<tr><td>Número necesario a tratar</td><td>\(\text{NNT}=1/\left[2\Phi(d/\sqrt2)-1\right]\)</td><td class="c">1</td></tr>
<tr><td>Metaanálisis de efectos aleatorios</td><td>\(\tau^2=\max\!\left(0,\dfrac{Q-(k-1)}{\sum w-\sum w^2/\sum w}\right),\ \hat\mu=\dfrac{\sum y_i/(v_i+\tau^2)}{\sum 1/(v_i+\tau^2)}\)</td><td class="c">1</td></tr>
<tr><td>Prueba de Egger y PET</td><td>\(y_i/se_i=a+b\,(1/se_i)\); \(a\ne0\) indica asimetría; \(b\) estima el efecto corregido</td><td class="c">1, 22</td></tr>
<tr><td>Sensibilidad (teoría de detección)</td><td>\(d'=\Phi^{-1}(\text{aciertos})-\Phi^{-1}(\text{falsas alarmas})\)</td><td class="c">1</td></tr>
<tr><td>Prueba binomial exacta</td><td>\(P(K\ge k)=\sum_{j\ge k}\binom{n}{j}p^j(1-p)^{n-j}\) (bilateral en el curso)</td><td class="c">1, 10</td></tr>
<tr><td>Correlación espuria por acoplamiento</td><td>\(r(W_4,\bar W)=1/\sqrt4=0{,}5\) con cargas independientes</td><td class="c">21</td></tr>
</tbody></table></div>
</section>
