<p class="lead">Una conversación puede cambiar el cerebro porque es aprendizaje, y todo aprendizaje cambia sinapsis. Las psicoterapias con mejor evidencia son, en el fondo, programas de aprendizaje bien diseñados: exponerse a lo temido, hacer actividades que dan sentido, revisar interpretaciones, practicar habilidades. Este capítulo explica sus mecanismos con los modelos del curso, mide su eficacia con honestidad y revisa la atención plena, la hipnosis y la promesa de «reescribir recuerdos».</p>

<section>
<h2>La exposición: un aprendizaje que compite con el miedo</h2>
<p>El tratamiento más eficaz para las fobias, el trastorno de pánico, el obsesivo-compulsivo y el estrés postraumático incluye <span class="term">exposición</span>: enfrentarse de forma gradual y repetida a lo que se teme, sin escapar, hasta que la expectativa de peligro se corrige. En términos del capítulo 7, es extinción: el estímulo deja de predecir la consecuencia temida.</p>
<p>Mark Bouton mostró que la extinción no borra la asociación original: crea un segundo aprendizaje, inhibitorio, que depende mucho del contexto en que ocurrió (Bouton, 2004). Por eso el miedo puede volver: al cambiar de lugar (<span class="term">renovación</span>), con el paso del tiempo (<span class="term">recuperación espontánea</span>) o tras un evento estresante. Michelle Craske y sus colegas propusieron diseñar la exposición para fortalecer ese aprendizaje inhibitorio: variar los contextos y los estímulos, buscar que la expectativa se viole y no solo que la ansiedad baje en la sesión (Craske y otros, 2014).</p>
<div class="sim" data-sim="extincion" data-title="Exposición, contexto y retorno del miedo"></div>
<div class="sim-guide"><ul>
<li>Doce ensayos de adquisición (el estímulo predice algo malo) y luego exposición. La asociación original \(V\) no se borra; se suma una inhibición general y otra propia de cada contexto.</li>
<li>Con un solo contexto, el miedo llega a cero en la sesión, pero al reencontrar el estímulo en otro lugar vuelve casi entero: la inhibición quedó atada al consultorio.</li>
<li>Suba los contextos a 4: el miedo baja más despacio durante la exposición, pero vuelve menos en otro lugar. Es la misma lógica de la práctica mezclada del capítulo 19.</li>
<li>Aumente los días hasta el reencuentro: la inhibición, más frágil que la asociación original, se debilita y el miedo regresa en parte.</li>
</ul></div>
<div class="py" data-py="30-extincion"></div>
<div class="box evid"><p><span class="nivel n4">sólida</span>La exposición es eficaz para fobias, pánico, obsesiones y estrés postraumático. <span class="nivel n5">modelo</span>El modelo de inhibición contextual reproduce la renovación y la recuperación espontánea; los parámetros son ilustrativos.</p></div>
</section>

<section>
<h2>Terapia cognitivo-conductual y activación conductual</h2>
<p>La terapia cognitivo-conductual combina técnicas conductuales (exposición, programación de actividades, resolución de problemas) con la revisión de interpretaciones y creencias. Una de sus piezas, la <span class="term">activación conductual</span>, se centra en aumentar actividades que dan placer o sentido y en reducir la evitación, con registros y metas pequeñas: lo mismo que los capítulos 15 y 16 proponen para los hábitos. En el ensayo COBRA, con 440 adultos con depresión, la activación conductual aplicada por personal sin formación profesional en psicoterapia no fue inferior a la terapia cognitivo-conductual y resultó más barata (Richards y otros, 2016).</p>
<p>¿Cuánto funcionan las psicoterapias para la depresión? Comparadas con grupos control, el efecto bruto en los metaanálisis es grande, alrededor de \(g = 0{,}7\). Pero muchos ensayos usan listas de espera, tienen riesgo de sesgo o no se publicaron si fueron negativos. Al ajustar por esos problemas, el efecto baja a valores entre 0,3 y 0,5 según los supuestos, y el debate sobre qué control es el adecuado sigue (Cuijpers y otros, 2019). Los antidepresivos, en un metaanálisis en red de 522 ensayos, fueron todos más eficaces que el placebo, también con efectos modestos en promedio (Cipriani y otros, 2018). En la depresión moderada o grave, combinar ambos suele ser mejor que cualquiera solo.</p>
<p>Un elemento común a casi todas las terapias es la <span class="term">alianza</span>: el acuerdo entre paciente y terapeuta sobre las metas y las tareas y el vínculo entre ambos. Su correlación con los resultados es de alrededor de 0,28 (Flückiger y otros, 2018). Es una correlación, no una prueba de causa, pero indica que la relación importa además de la técnica.</p>
<div class="box evid"><p><span class="nivel n4">sólida</span>La terapia cognitivo-conductual y la activación conductual son eficaces para la depresión y la ansiedad, con efectos moderados una vez corregidos los sesgos.</p></div>
</section>

<section>
<h2>Atención plena sin exageraciones</h2>
<p>Los programas de atención plena (mindfulness) entrenan la atención al momento presente y una actitud de aceptación. Un metaanálisis de ensayos con grupo control encontró efectos moderados sobre la ansiedad, la depresión y el dolor, del orden de 0,3 (Goyal y otros, 2014). Las afirmaciones de que la meditación «cambia la estructura del cerebro» en ocho semanas no se sostuvieron: en dos ensayos combinados con 218 personas, el programa de reducción del estrés basada en atención plena no produjo cambios estructurales frente a un control activo ni frente a una lista de espera (Kral y otros, 2022). Un grupo de investigadores del campo advirtió sobre la exageración en la difusión de estos resultados (Van Dam y otros, 2018).</p>
<div class="box evid"><p><span class="nivel n3">moderada</span>La atención plena reduce algo la ansiedad, el estrés y el dolor. <span class="nivel n0">no confirmado</span>Cambios estructurales en el cerebro tras programas cortos.</p></div>
</section>

<section>
<h2>Hipnosis</h2>
<p>La hipnosis es un procedimiento en el que, tras una inducción, se dan sugerencias para cambiar percepciones, sensaciones o conductas. La capacidad de responder a ellas, la <span class="term">sugestionabilidad hipnótica</span>, es un rasgo estable que varía mucho entre personas. Un metaanálisis de 85 experimentos controlados encontró que la hipnosis reduce el dolor de forma clínicamente importante, sobre todo en personas muy sugestionables (Thompson y otros, 2019). Se usa con evidencia como complemento en el dolor, en algunos procedimientos médicos y en el síndrome de intestino irritable.</p>
<p>Lo que no tiene respaldo es la idea, frecuente en la PNL (capítulo 11), de que el lenguaje hipnótico permite «reprogramar el inconsciente» de una persona sin que lo note o resistir lo que no desea. La hipnosis funciona con la colaboración de la persona y dentro de los límites de su sugestionabilidad.</p>
</section>

<section>
<h2>¿Se pueden reescribir los recuerdos?</h2>
<p>En 2000, Karim Nader y sus colegas mostraron en ratas que un recuerdo de miedo, al ser reactivado, se vuelve inestable durante unas horas y necesita síntesis de proteínas para volver a guardarse: si se bloquea esa síntesis, el recuerdo se debilita (Nader y otros, 2000). Es la <span class="term">reconsolidación</span>. En humanos, un estudio encontró que hacer la extinción dentro de esa ventana, después de recordar brevemente, evitaba el retorno del miedo (Schiller y otros, 2010). La idea entusiasmó porque prometía borrar recuerdos traumáticos, y muchas técnicas comerciales, incluida la «reconsolidación» de la PNL del capítulo 12, la invocan.</p>
<p>Las réplicas han sido decepcionantes. Una réplica registrada de antemano del procedimiento de Schiller, con más participantes, no encontró una atenuación persistente del miedo (Chalkia y otros, 2020). La reconsolidación existe como fenómeno de laboratorio, pero sus condiciones son estrechas y todavía no hay un tratamiento basado en ella con eficacia demostrada.</p>
<div class="box evid"><p><span class="nivel n3">moderada</span>La reconsolidación en animales. <span class="nivel n2">preliminar</span>Tratamientos humanos basados en ella: resultados inconsistentes.</p></div>
</section>

<section>
<h2>Resumen, problemas y autoevaluación</h2>
<div class="box keys"><ul>
<li>La exposición crea un aprendizaje inhibitorio dependiente del contexto; variar contextos fortalece la generalización.</li>
<li>La terapia cognitivo-conductual y la activación conductual son eficaces; corregidos los sesgos, sus efectos son moderados.</li>
<li>La alianza terapéutica se asocia con mejores resultados.</li>
<li>La atención plena ayuda algo con el estrés y la ansiedad; no cambia la estructura del cerebro en ocho semanas.</li>
<li>La hipnosis alivia el dolor en personas sugestionables; no «reprograma el inconsciente».</li>
<li>La reconsolidación es real en animales; sus aplicaciones humanas no se han replicado de forma consistente.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Una persona con miedo a conducir hace la exposición siempre en el mismo parqueadero con su terapeuta. ¿Qué cambiaría para reducir el riesgo de que el miedo vuelva?
<details><summary>Respuesta</summary><p>Variar lugares, horarios y condiciones (calles distintas, de noche, sola), dejar de depender de señales de seguridad (el terapeuta en el asiento) y espaciar las sesiones con práctica entre ellas.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Por qué un ensayo de psicoterapia contra lista de espera puede sobrestimar el efecto?
<details><summary>Respuesta</summary><p>Porque el grupo en espera sabe que no recibe tratamiento todavía y puede incluso posponer cambios; el grupo tratado recibe atención y expectativas. La diferencia mezcla el efecto específico con el de recibir algo. Un control activo creíble estima mejor el efecto propio de la técnica.</p></details></li>
</ol>
