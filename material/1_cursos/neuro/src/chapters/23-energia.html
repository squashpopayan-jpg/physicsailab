<p class="lead">La grasa corporal es energía almacenada, y la energía se conserva: si durante un tiempo se gasta más de lo que se come, la diferencia sale de las reservas. Esa ley no tiene excepciones. Lo que sí tiene son complicaciones: el gasto cambia cuando cambia el peso, el agua y el glucógeno enmascaran la grasa en las primeras semanas y medir lo que comemos es mucho más difícil de lo que parece. Este capítulo convierte la ley en un modelo dinámico validado y lo usa para entender qué se puede esperar de una dieta.</p>

<section>
<h2>Las partes del gasto</h2>
<p>El gasto diario de energía tiene tres componentes:</p>
<ul>
<li><b>Gasto en reposo</b>, la energía que mantiene vivos los órganos: en una persona sedentaria es entre 60 y 70 % del total. Depende sobre todo de la masa libre de grasa; los órganos (hígado, cerebro, corazón, riñones) gastan mucho más por kilo que el músculo en reposo, y el músculo mucho más que la grasa.</li>
<li><b>Efecto térmico de los alimentos</b>: digerir y almacenar cuesta alrededor de 10 % de lo ingerido; más para las proteínas que para las grasas.</li>
<li><b>Actividad física</b>: el ejercicio y toda la actividad que no es ejercicio (caminar, estar de pie, moverse). Es la parte que más varía entre personas.</li>
</ul>
<p>El gasto en reposo se estima con ecuaciones a partir del peso, la estatura, la edad y el sexo. La de Mifflin-St Jeor es una de las más precisas en adultos:</p>
<div class="box law"><p>\[ \text{gasto en reposo (kcal/día)} = 10\,P + 6{,}25\,T - 5\,E + \begin{cases} +5 & \text{hombres} \\ -161 & \text{mujeres} \end{cases} \]</p>
<p>con \(P\) el peso en kg, \(T\) la estatura en cm y \(E\) la edad en años (Mifflin y otros, 1990). Su error individual es de alrededor de 10 %.</p></div>
<p>Una creencia muy extendida es que el metabolismo se vuelve lento a partir de los 30 o 40 años. Un análisis de más de 6 000 mediciones con agua doblemente marcada, el método de referencia para medir el gasto en libertad, encontró que el gasto ajustado por la masa libre de grasa se mantiene estable entre los 20 y los 60 años y solo baja después (Pontzer y otros, 2021). Lo que cambia en la mediana edad es, sobre todo, la actividad y la composición corporal.</p>
</section>

<section>
<h2>Cuánto comemos de verdad</h2>
<p>Medir la ingesta es el punto débil de cualquier plan. En un estudio clásico, personas que decían no poder bajar de peso aunque comían muy poco resultaron tener un gasto normal: lo que ocurría es que subestimaban lo que comían en un 47 % y sobrestimaban su actividad en un 51 % (Lichtman y otros, 1992). No mentían; registrar la comida con exactitud es muy difícil. Por eso, en este curso, el peso medido con regularidad (capítulo 18) es mejor guía que la cuenta de calorías.</p>
</section>

<section>
<h2>La regla de 7 700 kcal por kilo y por qué falla</h2>
<p>La regla dice que un kilo de grasa corporal equivale a unas 7 700 kcal (3 500 por libra), así que un déficit de 500 kcal diarias haría perder medio kilo por semana, indefinidamente: 24 kg en un año y más de 70 en tres. Esa predicción es falsa a largo plazo, por tres razones:</p>
<ol>
<li>Al bajar de peso baja el gasto: un cuerpo más pequeño gasta menos en reposo y al moverse. El déficit se va cerrando solo.</li>
<li>Parte de lo que se pierde es tejido magro, con mucha menos energía por kilo que la grasa (unas 1 800 kcal frente a 9 400).</li>
<li>El cuerpo ahorra energía más allá de lo que explica el cambio de tamaño (termogénesis adaptativa).</li>
</ol>
<p>Kevin Hall y sus colegas construyeron un modelo matemático que incluye todo eso: cinco compartimentos (grasa, tejido magro, glucógeno, agua extracelular y adaptación) que cambian según ecuaciones diferenciales, con parámetros medidos en experimentos de balance en humanos (Hall y otros, 2011). El modelo se validó contra datos de ensayos controlados de alimentación.</p>
<div class="box law"><p>\[ \rho_F \frac{dF}{dt} + \rho_L \frac{dL}{dt} = \text{ingesta} - \text{gasto}(F, L, \ldots) \]</p>
<p>La energía que no se gasta se reparte entre grasa \(F\) y tejido magro \(L\) según la partición de Forbes: cuanta más grasa tiene la persona, mayor fracción del cambio es grasa. El gasto depende a su vez de \(F\) y \(L\), y eso hace que el sistema tienda a un nuevo equilibrio.</p></div>
<p>Una consecuencia práctica del modelo, resumida por sus autores: cada cambio sostenido de 100 kJ/día (unas 24 kcal) termina cambiando el peso en alrededor de 1 kg; la mitad del cambio se alcanza en cerca de un año y el 95 % en unos tres.</p>

<section>
<h2>Glucógeno y agua: la primera semana engaña</h2>
<p>El hígado y los músculos guardan unos 400 a 500 g de glucógeno, y cada gramo va acompañado de unos 3 g de agua. Al reducir mucho los carbohidratos, esas reservas bajan en pocos días y con ellas sale agua, además de algo de sodio. Resultado: 1 a 2 kg menos en la báscula la primera semana, casi sin cambio en la grasa. Al volver a comer carbohidratos, ese peso regresa en días. No es un fracaso ni un éxito; es agua.</p>
</section>

<section>
<h2>Adaptación metabólica</h2>
<p>Además del menor tamaño, el cuerpo reduce su gasto durante un déficit: baja la actividad espontánea, mejora la eficiencia del músculo y bajan algunas hormonas. El caso más estudiado es el de 14 participantes del programa de televisión <i>The Biggest Loser</i>: seis años después de perder mucho peso con dieta extrema y ejercicio, su gasto en reposo seguía unas 500 kcal/día por debajo de lo esperado para su tamaño y composición (Fothergill y otros, 2016). Es un caso extremo, pero ilustra que la adaptación existe y puede persistir.</p>
<p>Un segundo fenómeno es la <span class="term">compensación</span> del gasto por el ejercicio. En un estudio con 332 adultos de cinco países, el gasto total aumentaba con la actividad física en las personas poco activas, pero se aplanaba en las más activas: el organismo parece ahorrar en otros procesos cuando la actividad es alta (Pontzer y otros, 2016). Por eso, el ejercicio solo, sin cambiar la alimentación, suele producir pérdidas de peso menores de las que se calculan sumando las calorías de cada sesión.</p>

</section>

<section>
<h2>Resumen, problemas y autoevaluación</h2>
<div class="box keys"><ul>
<li>La grasa es energía: perderla exige un déficit sostenido. Pero el gasto baja con el peso, así que el déficit se cierra solo.</li>
<li>La regla de 7 700 kcal/kg sirve para el primer mes; a largo plazo sobrestima mucho la pérdida. El modelo de Hall es una herramienta mucho mejor.</li>
<li>La primera semana de una dieta baja en carbohidratos pierde sobre todo glucógeno y agua.</li>
<li>El cuerpo se adapta: reduce su gasto más de lo que explica el tamaño y compensa parte del ejercicio.</li>
<li>El metabolismo ajustado por masa magra es estable entre los 20 y los 60 años.</li>
<li>Registrar la comida es difícil; el peso medido con regularidad es mejor indicador.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule el gasto en reposo con Mifflin-St Jeor para una mujer de 33 años, 162 cm y 68 kg.
<details><summary>Respuesta</summary><p>\(10 \cdot 68 + 6{,}25 \cdot 162 - 5 \cdot 33 - 161 = 1\,366{,}5\) kcal/día.</p></details></li>
<li><span class="lvl">Intermedio</span>Según la regla aproximada de Hall, ¿cuánto peso perdería a la larga alguien que deja de tomar una gaseosa de 140 kcal diaria, sin otros cambios?
<details><summary>Respuesta</summary><p>140 kcal ≈ 586 kJ; a 1 kg por cada 100 kJ/día, unos 6 kg a la larga, la mitad en el primer año. La regla de 7 700 diría 6,6 kg al año y seguiría sumando.</p></details></li>
<li><span class="lvl">Avanzado</span>En el modelo, ¿por qué una persona con más grasa pierde una fracción mayor de grasa con el mismo déficit?
<details><summary>Respuesta</summary><p>Por la partición de Forbes: la fracción magra del cambio es \(p = C/(C + F)\), con \(C \approx 2\) kg. Si \(F\) es grande, \(p\) es pequeño y casi todo lo que se pierde es grasa; en una persona delgada, una fracción mayor sale del tejido magro.</p></details></li>
</ol>
