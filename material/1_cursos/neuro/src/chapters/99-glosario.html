<section>
<h2>F a O</h2>

<thead><tr><th>Término</th><th>Definición</th><th>Cap.</th></tr></thead>
<tbody>
<tr><td>Fatiga (Banister)</td><td>Componente rápido de la respuesta al entrenamiento, que se disipa en pocos días.</td><td>21</td></tr>
<tr><td>FatMax</td><td>Intensidad de ejercicio con la máxima oxidación de grasa por minuto.</td><td>24</td></tr>

<tr><td>Interferencia contextual</td><td>Ventaja para la retención de la práctica mezclada frente a la práctica en bloques.</td><td>19</td></tr>

<tr><td>Ley potencial de la práctica</td><td>Descripción del promedio de un grupo que mejora con el número de ensayos según una potencia; puede surgir al promediar curvas exponenciales.</td><td>19</td></tr>
<tr><td>Metaanálisis</td><td>Combinación estadística de los resultados de varios estudios.</td><td>1</td></tr>
<tr><td>Mielina</td><td>Envoltura de células gliales que acelera la conducción del impulso.</td><td>2, 6</td></tr>
<tr><td>Modelo de Hall</td><td>Modelo dinámico del peso corporal con grasa, tejido magro, glucógeno, agua y adaptación.</td><td>23</td></tr>
<tr><td>Monotonía</td><td>Carga media diaria dividida por su desviación estándar en una semana.</td><td>21</td></tr>
<tr><td>Neurofeedback</td><td>Entrenamiento para modificar una señal de la propia actividad cerebral vista en tiempo real.</td><td>28</td></tr>

<tr><td>Neuromito</td><td>Creencia falsa sobre el cerebro muy difundida, como usar solo el 10 % del cerebro.</td><td>14</td></tr>
<tr><td>NMDA (receptor)</td><td>Receptor de glutamato que deja entrar calcio solo con actividad pre y postsináptica a la vez; base de la potenciación de largo plazo.</td><td>4</td></tr>
<tr><td>No uso aprendido</td><td>Abandono progresivo del miembro afectado tras una lesión por los fracasos al usarlo.</td><td>27</td></tr>
<tr><td>Ojo quieto</td><td>Última fijación de la mirada antes de iniciar un movimiento de precisión.</td><td>20</td></tr>
</tbody></table></div>
</section>
