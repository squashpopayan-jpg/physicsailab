<p class="lead">«Quemar grasa» es una expresión química exacta: los ácidos grasos se oxidan en las mitocondrias y salen del cuerpo como dióxido de carbono y agua. Pero de ahí no se deduce que el ejercicio que más grasa oxida por minuto sea el que más grasa corporal hace perder. Este capítulo explica cómo se mide la oxidación, qué dice sobre la intensidad y qué no, y revisa las estrategias de ejercicio más promocionadas.</p>

<section>
<h2>Cómo se mide la grasa que se oxida</h2>
<p>La <span class="term">calorimetría indirecta</span> mide el oxígeno consumido (\(\dot V_{O_2}\)) y el dióxido de carbono producido (\(\dot V_{CO_2}\)). Oxidar grasa consume más oxígeno por cada molécula de CO₂ que oxidar glucosa, de modo que el <span class="term">cociente respiratorio</span> \(\dot V_{CO_2}/\dot V_{O_2}\) vale 0,70 con solo grasa y 1,00 con solo carbohidrato. A partir de los dos gases se calculan los gramos de cada sustrato y la energía:</p>
<div class="box law"><p>\[ \text{grasa (g/min)} = 1{,}67\,\dot V_{O_2} - 1{,}67\,\dot V_{CO_2} \qquad \text{carbohidrato (g/min)} = 4{,}55\,\dot V_{CO_2} - 3{,}21\,\dot V_{O_2} \]</p>
<p>(Frayn, 1983, con los gases en L/min y sin corregir por proteína). La energía es \(3{,}941\,\dot V_{O_2} + 1{,}106\,\dot V_{CO_2}\) kcal/min (Weir, 1949).</p></div>
<p>A medida que sube la intensidad, el músculo depende cada vez más del glucógeno y menos de la grasa: es el <span class="term">concepto de cruce</span> (Brooks y Mercier, 1994). La grasa oxidada por minuto sube al principio, porque aumenta el gasto total, y luego baja. El punto de máxima oxidación se llama <span class="term">FatMax</span>: en ciclistas entrenados estaba en torno a 64 % del VO₂máx (Achten y otros, 2002) y en una muestra de 300 personas de la población general, cerca de 48 % (Venables y otros, 2005), con grandes diferencias individuales.</p>

<div class="sim-guide"><ul>
<li>La curva del cociente respiratorio es ilustrativa, con la forma típica del cruce; los cálculos de gramos y kilocalorías usan las ecuaciones de Frayn y Weir.</li>

<section>
<h2>La «zona de quema de grasa» y el balance de 24 horas</h2>
<p>Las máquinas de gimnasio muestran una «zona de quema de grasa» a baja intensidad. Es cierto que ahí la grasa aporta una fracción mayor de la energía. Pero el cuerpo no lleva cuentas separadas por sesión: si el ejercicio intenso usa glucógeno, ese glucógeno se repone en las horas siguientes con los carbohidratos que se comen, y la grasa que no se oxidó en el ejercicio se oxida en reposo. A lo largo de días y semanas, lo que determina cuánta grasa se pierde es el balance de energía.</p>
<p>Un experimento de Kevin Hall lo mostró de manera llamativa con la dieta: con las mismas calorías, una dieta reducida en carbohidratos aumentó la oxidación de grasa, pero una reducida en grasa hizo perder <i>más</i> grasa corporal en seis días, medido en una unidad metabólica (Hall y otros, 2015). Oxidar más grasa no es lo mismo que perder más grasa si también se está comiendo más grasa.</p>
<div class="box evid"><p><span class="nivel n4">sólida</span>La oxidación de grasa durante una sesión no predice la pérdida de grasa corporal; la predice el balance de energía acumulado.</p></div>
</section>

<section>
<h2>Intervalos, ayuno y abdominales</h2>
<p><b>Intervalos de alta intensidad frente a ejercicio continuo moderado.</b> Dos metaanálisis de 2017 encontraron que ambos reducen la grasa corporal en personas con sobrepeso y que la diferencia entre ellos no es significativa; los intervalos lo logran en menos tiempo (Wewege y otros, 2017; Keating y otros, 2017). Un metaanálisis de 2019 que reportaba una ventaja grande para los intervalos fue retractado posteriormente, y no debe usarse como evidencia.</p>
<p><b>Cardio en ayunas.</b> En un ensayo con 20 mujeres jóvenes con la misma dieta hipocalórica durante cuatro semanas, hacer una hora de ejercicio aeróbico en ayunas o después de comer produjo los mismos cambios de peso y de grasa (Schoenfeld y otros, 2014). Entrenar en ayunas aumenta la oxidación de grasa durante la sesión, pero, de nuevo, eso no decide el balance.</p>
<p><b>Reducción localizada.</b> En un ensayo de seis semanas, hacer ejercicios abdominales no redujo la grasa del abdomen más que en el grupo de control (Vispute y otros, 2011). La grasa se moviliza de todo el cuerpo según patrones que dependen del sexo, la edad y la genética, no del músculo que se trabaja.</p>
<div class="box myth"><p><b>Mito:</b> «Hay que entrenar en la zona de quema de grasa y en ayunas para perder grasa». <b>Realidad:</b> con el mismo déficit, la intensidad y el momento del día cambian poco el resultado. Elija la forma de ejercicio que pueda sostener.</p></div>
</section>

<section>
<h2>Ejercicio sin dieta: la compensación</h2>
<p>Según la posición del Colegio Americano de Medicina del Deporte, 150 a 250 minutos semanales de actividad moderada producen solo una pérdida de peso modesta, y hacen falta más de 250 minutos para una pérdida clínicamente importante sin cambiar la dieta (Donnelly y otros, 2009). Parte de la razón está en el capítulo anterior (gasto restringido) y parte en la compensación: después de empezar a hacer ejercicio, muchas personas comen algo más o se mueven menos el resto del día, casi siempre sin darse cuenta.</p>
<div class="sim" data-sim="compensacion" data-title="Un año de ejercicio sin cambiar la dieta"></div>
<div class="sim-guide"><ul>
<li>El modelo de Hall (capítulo 23) con un hombre de 95 kg. La línea verde supone que no come nada más; la morada, que repone parte del gasto comiendo más.</li>
<li>Con 4 sesiones de 400 kcal y 30 % de compensación, la pérdida a un año es de pocos kilos, mucho menos de lo que diría la regla de 7 700.</li>
<li>El ejercicio sigue valiendo la pena: conserva el músculo durante una dieta, mejora la salud cardiovascular y metabólica, y las personas que mantienen la pérdida de peso suelen ser muy activas.</li>
</ul></div>
<p>La actividad que no es ejercicio (estar de pie, caminar, moverse) varía mucho entre personas. En un experimento en el que 16 adultos comieron 1 000 kcal diarias de más durante ocho semanas, la grasa ganada varió unas diez veces entre participantes, y lo que mejor la predecía era cuánto aumentaba cada uno su actividad espontánea (Levine y otros, 1999).</p>
<div class="box do"><ul>
<li>Sume pasos a su día (escaleras, caminar al hacer llamadas): es actividad que se compensa menos que una sesión aislada.</li>
<li>Si entrena para perder grasa, combine ejercicio de fuerza (conserva el músculo) con el aeróbico que disfrute, y un déficit moderado (capítulo 25).</li>
</ul></div>
</section>

<section>
<h2>Resumen, problemas y autoevaluación</h2>
<div class="box keys"><ul>
<li>La calorimetría indirecta calcula la grasa y el carbohidrato oxidados a partir del O₂ y el CO₂.</li>
<li>Al subir la intensidad crece el uso de carbohidrato; la grasa oxidada por minuto tiene un máximo (FatMax) a intensidad moderada.</li>
<li>La grasa oxidada en una sesión no decide la pérdida de grasa: decide el balance de días y semanas.</li>
<li>Intervalos y ejercicio continuo producen pérdidas de grasa parecidas; el cardio en ayunas no añade ventaja; no existe la reducción localizada.</li>
<li>El ejercicio solo adelgaza menos de lo calculado por la compensación, pero conserva músculo y mejora la salud.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Con \(\dot V_{O_2} = 2{,}0\) y \(\dot V_{CO_2} = 1{,}7\) L/min, calcule el cociente respiratorio y los gramos de grasa oxidados por minuto.
<details><summary>Respuesta</summary><p>Cociente: 0,85. Grasa: \(1{,}67 \cdot (2{,}0 - 1{,}7) = 0{,}50\) g/min.</p></details></li>
<li><span class="lvl">Intermedio</span>Una sesión de 30 minutos gasta 360 kcal y otra de 60 minutos gasta 400 kcal con más porcentaje de grasa. Si la dieta es la misma, ¿cuál hará perder más grasa a lo largo de un mes?
<details><summary>Respuesta</summary><p>Muy parecido, con ventaja ligera para la de 400 kcal porque gasta un poco más. El porcentaje de grasa durante la sesión no importa a largo plazo; importa la energía total y si se compensa.</p></details></li>
</ol>
