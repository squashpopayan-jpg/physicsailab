<p class="lead">La programación neurolingüística (PNL) promete entender cómo piensa cualquier persona, comunicarse con más influencia, eliminar fobias en minutos y copiar la excelencia de los mejores. Es probable que conozca a alguien que la practica con entusiasmo. Este capítulo la presenta con respeto y con rigor: de dónde viene, qué afirma, por qué tanta gente siente que funciona y qué ha encontrado la investigación en casi cinco décadas. Los capítulos 10 a 13 revisan sus técnicas una por una.</p>

<section>
<h2>Origen: modelar a tres terapeutas</h2>
<p>La PNL nació a comienzos de los años setenta en la Universidad de California en Santa Cruz. Richard Bandler, estudiante, y John Grinder, profesor de lingüística, se propusieron descubrir qué hacían de especial tres terapeutas famosos: Fritz Perls, creador de la terapia Gestalt; Virginia Satir, pionera de la terapia familiar; y Milton Erickson, conocido por su uso de la hipnosis. Observaron sus sesiones, buscaron patrones en su lenguaje y en su conducta, y los convirtieron en técnicas que, decían, cualquiera podía aprender. Sus libros <i>La estructura de la magia</i> (1975) y <i>De sapos a príncipes</i> (1979) lanzaron el movimiento.</p>
<p>El nombre resume la tesis: <b>neuro</b>, porque toda experiencia pasa por los sentidos y el sistema nervioso; <b>lingüística</b>, porque el lenguaje organiza y revela esa experiencia; <b>programación</b>, porque esos patrones serían «programas» que se pueden cambiar. Una de sus presuposiciones favoritas viene del filósofo Alfred Korzybski: «el mapa no es el territorio», es decir, reaccionamos a nuestra representación de la realidad, no a la realidad misma.</p>
<div class="box note"><p>Ni Bandler ni Grinder eran neurocientíficos, y la PNL no surgió de experimentos sobre el cerebro sino de observar terapeutas. La palabra «neuro» describe una intención, no un método de investigación. Hoy no hay una autoridad que regule los títulos de «Practitioner» o «Master Practitioner»: los emiten las propias escuelas.</p></div>
</section>

<section>
<h2>Las técnicas y lo que afirman</h2>
<div class="tablewrap"><table>
<thead><tr><th>Técnica</th><th>Qué afirma</th><th>¿Se puede poner a prueba?</th></tr></thead>
<tbody>
<tr><td>Sistemas representacionales</td><td>Cada persona prefiere pensar en imágenes, sonidos o sensaciones; se detecta por las palabras que usa.</td><td>Sí (capítulo 10)</td></tr>
<tr><td>Claves de acceso ocular</td><td>La dirección de los ojos revela si alguien recuerda o construye una imagen o un sonido, y si miente.</td><td>Sí (capítulo 10)</td></tr>
<tr><td>Rapport y espejeo</td><td>Imitar postura, gestos y palabras del otro crea sintonía e influencia.</td><td>Sí (capítulo 11)</td></tr>
<tr><td>Anclaje</td><td>Asociar un toque o gesto a un estado emocional permite recuperarlo a voluntad.</td><td>Sí (capítulo 11)</td></tr>
<tr><td>Reencuadre</td><td>Cambiar el marco de una situación cambia la emoción que produce.</td><td>Sí (capítulo 11)</td></tr>
<tr><td>Metamodelo y modelo Milton</td><td>Preguntas que deshacen generalizaciones; lenguaje vago e hipnótico que guía sin resistencia.</td><td>Parcialmente (capítulo 11)</td></tr>
<tr><td>Cura rápida de fobias</td><td>Ver el recuerdo traumático «desde fuera» y al revés elimina la fobia en una sesión.</td><td>Sí (capítulo 12)</td></tr>
<tr><td>Swish y submodalidades</td><td>Cambiar el brillo, el tamaño o la distancia de una imagen mental cambia la conducta asociada.</td><td>Sí, casi sin estudios (capítulo 12)</td></tr>
<tr><td>Línea del tiempo</td><td>Reubicar mentalmente los recuerdos en una línea temporal resuelve problemas emocionales.</td><td>Sí, sin estudios controlados (capítulo 12)</td></tr>
<tr><td>Modelado de la excelencia</td><td>Copiar las estrategias mentales de un experto transfiere su desempeño.</td><td>Difícil de definir con precisión</td></tr>
</tbody></table></div>
<p>Muchas de estas afirmaciones son concretas y comprobables, lo cual es una virtud: permitieron que, desde los años ochenta, psicólogos de varios países las pusieran a prueba.</p>
</section>

<section>
<h2>¿Por qué convence tanto?</h2>
<p>Quien sale entusiasmado de un taller de PNL no está mintiendo. Siente un cambio real. El punto es de dónde sale ese cambio. Varias razones bien documentadas explican la sensación de eficacia sin necesidad de que las técnicas funcionen como se dice:</p>
<ul>
<li><b>Expectativa y entusiasmo.</b> Un instructor carismático, un grupo motivado y la promesa de cambio producen mejoras subjetivas reales (capítulo 1).</li>
<li><b>Regresión a la media.</b> La gente busca ayuda en sus peores momentos.</li>
<li><b>Compromiso y disonancia.</b> Después de pagar e invertir días, cuesta concluir que no sirvió; tendemos a justificar nuestras decisiones.</li>
<li><b>Ingredientes prestados.</b> Algunas técnicas contienen elementos que sí funcionan (fijar metas concretas, exponerse a lo temido, reinterpretar una situación), aunque la explicación de la PNL sea otra.</li>
<li><b>Explicaciones a prueba de fallos.</b> Si la técnica no funciona, «no se calibró bien» o «hubo una objeción ecológica»; nunca se concluye que la técnica falla.</li>
<li><b>El efecto Barnum.</b> Las descripciones de personalidad vagas y halagadoras parecen hechas a la medida de cada uno.</li>
</ul>
<div class="sim" data-sim="forer" data-title="Descubra su sistema representacional dominante"></div>
<div class="sim-guide"><ul>
<li>Responda las seis preguntas, lea su perfil y califique qué tan bien lo describe antes de pulsar «Revelar».</li>
<li>El psicólogo Bertram Forer entregó a 39 estudiantes un «perfil personal» basado en un test. Calificaron su exactitud con un promedio de 4,26 sobre 5. Todos habían recibido el mismo texto, copiado en buena parte de un libro de astrología (Forer, 1949).</li>
</ul></div>
<div class="box warn"><p>Los cuestionarios de «estilo visual, auditivo o kinestésico» que circulan en cursos y colegios no tienen validez demostrada para predecir cómo aprende o se comunica mejor una persona (capítulos 10 y 14).</p></div>
</section>

<section>
<h2>Qué ha encontrado la investigación</h2>
<p>La evidencia sobre la PNL se ha revisado varias veces, con conclusiones consistentes:</p>
<ul>
<li><b>Sharpley (1984, 1987)</b>, en dos revisiones en el <i>Journal of Counseling Psychology</i>, encontró que la mayoría de los estudios no apoyaban la idea del sistema representacional preferido ni la eficacia de igualar predicados.</li>
<li><b>Heap (1988)</b> revisó la investigación disponible sobre los sistemas representacionales y las claves oculares y concluyó que sus afirmaciones no se sostenían.</li>
<li><b>Witkowski (2010)</b> partió de las 315 entradas de la base de datos de investigación sobre PNL, seleccionó 63 artículos publicados en revistas indexadas y analizó los 33 estudios empíricos: 18,2 % apoyaban los principios de la PNL, 54,5 % no los apoyaban y 27,3 % eran inconclusos; además, los estudios no favorables eran metodológicamente más sólidos.</li>
<li><b>Sturt y otros (2012)</b>, en una revisión sistemática de los efectos de la PNL sobre la salud, encontraron solo 10 estudios experimentales, de calidad pobre y con alto riesgo de sesgo; de los 5 ensayos aleatorizados, 4 no encontraron diferencias. Concluyeron que no hay evidencia suficiente para justificar su uso en salud pública.</li>
<li>En una encuesta Delphi a expertos en salud mental, la PNL aplicada a trastornos mentales y de conducta quedó entre las intervenciones posiblemente o probablemente desacreditadas (Norcross, Koocher y Garofalo, 2006).</li>
</ul>
<div class="box evid"><p><span class="nivel n2">baja calidad</span>Un metaanálisis de 2015 sobre «psicoterapia neurolingüística» reportó efectos favorables (Zaharia, Reiner y Schütz, 2015). Dos de sus tres autores pertenecen a centros de formación en PNL, y los estudios que reunió eran en su mayoría pequeños y sin control adecuado. Es un ejemplo de por qué importa quién evalúa y con qué estudios.</p></div>
<div class="box verdict"><table class="semaforo">
<tbody>
<tr><td>Sistemas representacionales preferidos</td><td><span class="nivel n0">refutada</span></td></tr>
<tr><td>Claves de acceso ocular (y detectar mentiras por los ojos)</td><td><span class="nivel n0">refutada</span></td></tr>
<tr><td>PNL como tratamiento de problemas de salud</td><td><span class="nivel n1">sin evidencia suficiente</span></td></tr>
<tr><td>Técnicas que reempaquetan métodos probados (metas concretas, exposición, reinterpretación, práctica mental)</td><td><span class="nivel n3">funcionan por sus ingredientes</span></td></tr>
</tbody></table></div>
</section>

<section>
<h2>¿Hay algo que rescatar?</h2>
<p>Sí, y es importante para no tirar todo a la basura. La PNL no inventó estos ingredientes, pero los popularizó, y donde funcionan es porque coinciden con métodos que la psicología sí ha probado:</p>
<div class="tablewrap"><table>
<thead><tr><th>Idea de la PNL</th><th>Pariente con evidencia</th><th>Capítulo</th></tr></thead>
<tbody>
<tr><td>Rapport</td><td>Alianza terapéutica, escucha activa, sincronía</td><td>11</td></tr>
<tr><td>Anclaje</td><td>Condicionamiento clásico</td><td>11</td></tr>
<tr><td>Reencuadre</td><td>Reevaluación cognitiva (terapia cognitivo-conductual)</td><td>11</td></tr>
<tr><td>Metamodelo</td><td>Preguntas socráticas, cuestionar generalizaciones</td><td>11</td></tr>
<tr><td>Cura rápida de fobias</td><td>Terapia de exposición, que sí funciona, a veces en una sesión</td><td>12</td></tr>
<tr><td>Visualizar el éxito</td><td>Práctica mental e imaginería motora (con matices)</td><td>13</td></tr>
<tr><td>Objetivos bien formulados</td><td>Fijación de metas específicas e intenciones de implementación</td><td>13</td></tr>
</tbody></table></div>
<p>La recomendación práctica es simple: cuando algo de la PNL le sirva, busque su versión probada. Suele ser más precisa, más barata y con instrucciones mejor definidas.</p>
</section>

<section>
<h2>Resumen, problemas y autoevaluación</h2>
<div class="box keys"><ul>
<li>La PNL nació en los años setenta modelando a tres terapeutas; no surgió de la investigación sobre el cerebro.</li>
<li>Sus afirmaciones principales son comprobables y se han puesto a prueba desde los años ochenta.</li>
<li>Las revisiones (Sharpley, Heap, Witkowski, Sturt) encuentran poca o ninguna evidencia a favor de sus principios centrales.</li>
<li>La sensación de eficacia se explica por expectativa, regresión a la media, compromiso, efecto Barnum e ingredientes prestados de métodos probados.</li>
<li>Lo útil de la PNL tiene equivalentes con mejor respaldo, que los capítulos siguientes presentan.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Un amigo le dice: «hice el curso de PNL y me cambió la vida». ¿Eso prueba que la PNL funciona?
<details><summary>Respuesta</summary><p>No. Puede ser cierto que su vida cambió, pero el testimonio no separa el efecto de las técnicas del de la expectativa, el grupo, el momento vital o los ingredientes prestados. Haría falta un grupo de comparación.</p></details></li>
<li><span class="lvl">Intermedio</span>Proponga un experimento para comprobar si «igualar los predicados sensoriales» del interlocutor aumenta la confianza.
<details><summary>Respuesta</summary><p>Asignar al azar a entrevistadores que igualen o no los predicados (o que usen predicados al azar), con un guion idéntico en lo demás; medir la confianza con una escala validada aplicada por alguien ciego a la condición; calcular el tamaño de muestra para detectar un efecto pequeño y preregistrar el análisis. Experimentos de este tipo son los que revisó Sharpley.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Por qué la frase «si no funcionó, no lo hizo bien» es una señal de alarma?
<details><summary>Respuesta</summary><p>Porque vuelve la afirmación imposible de refutar: cualquier fracaso se atribuye al usuario y nunca a la técnica.</p></details></li>
</ol>
