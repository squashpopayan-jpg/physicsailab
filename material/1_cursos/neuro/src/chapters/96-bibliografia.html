<p class="lead">Todas las fuentes del curso en una lista: artículos revisados por pares, metaanálisis, revisiones Cochrane, ensayos clínicos y declaraciones de consenso. La lista se construye a partir de las referencias de cada capítulo, de modo que siempre está completa. Cada entrada enlaza al artículo (casi siempre por su DOI) y a los capítulos donde se usa.</p>

<section>
<h2>Cómo leer las fuentes</h2>
<ul>
<li>Un <b>metaanálisis</b> combina muchos estudios; vale tanto como los estudios que reúne y su corrección por sesgos (capítulo 1).</li>
<li>Un <b>ensayo controlado aleatorizado</b> con control activo o simulado y evaluación ciega es la mejor prueba de que un tratamiento causa un efecto.</li>
<li>Una <b>serie de casos</b> o un estudio de observación sirven para generar hipótesis, no para probar eficacia.</li>
<li>Una <b>réplica registrada</b> que no encuentra el efecto original pesa más que el estudio original pequeño.</li>
</ul>
</section>
