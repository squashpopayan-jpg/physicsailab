<p class="lead">Un laboratorio de física escolar es un lugar de riesgo bajo si se diseña bien: casi todas sus prácticas usan pilas, hilos, agua y luz. Los accidentes llegan por lo que no se previó: una pila de litio en cortocircuito, un puntero láser mal etiquetado, un termómetro de mercurio olvidado en un cajón. Este capítulo ordena la seguridad con la misma metodología que usa cualquier empresa colombiana y la aterriza en el aula.</p>

<section>
<h2>Quién responde y con qué instrumentos</h2>
<p>Tres marcos normativos se cruzan en el laboratorio escolar:</p>
<ul>
<li><b>Seguridad y salud en el trabajo.</b> La institución es empleadora de docentes y personal; el Decreto 1072 de 2015 (Libro 2, Parte 2, Título 4, Capítulo 6) le exige un Sistema de Gestión de la Seguridad y Salud en el Trabajo con identificación de peligros, evaluación y valoración de los riesgos (art. 2.2.4.6.15) y medidas de prevención según una jerarquía (art. 2.2.4.6.24). La Resolución 0312 de 2019 fija los estándares mínimos. La metodología más usada en Colombia para la matriz de peligros es la <b>GTC 45:2012</b> de ICONTEC.</li>
<li><b>Gestión del riesgo de desastres.</b> La Ley 1523 de 2012 (art. 42) obliga a las entidades públicas y privadas a analizar sus riesgos y formular planes; el Decreto 2157 de 2017 da las directrices. Para el sector educativo, la Circular 19 de 2022 del MEN orienta los planes escolares de gestión del riesgo y pide un comité institucional, y la Resolución 006519 de 2025 del MEN adoptó los lineamientos de la política pública de gestión integral del riesgo escolar. El laboratorio debe aparecer en ese plan con sus peligros y sus rutas de evacuación.</li>
<li><b>Protección de los estudiantes.</b> Los estudiantes no son trabajadores, pero la institución tiene un deber de cuidado reforzado sobre niños, niñas y adolescentes (Constitución, art. 44; Ley 1098 de 2006). Por eso la matriz de riesgos del laboratorio se hace pensando en ellos, aunque la metodología venga del mundo laboral.</li>
</ul>
</section>

<section>
<h2>Valorar un riesgo con la GTC 45</h2>
<p>La GTC 45 separa dos ideas: el <span class="term">peligro</span> (la fuente de daño: una pila, un láser, un vidrio) y el <span class="term">riesgo</span> (la combinación de la probabilidad de que ocurra un evento peligroso y la severidad del daño). La probabilidad se estima con el nivel de deficiencia de los controles existentes (ND) y el nivel de exposición (NE); la severidad con el nivel de consecuencia (NC):</p>
<div class="eq key" data-name="GTC 45:2012">\[NP=ND\times NE,\qquad NR=NP\times NC.\]</div>
<div class="tablewrap"><table>
<tr><th>Escala</th><th>Valores</th></tr>
<tr><td>Nivel de deficiencia ND</td><td>10 muy alto · 6 alto · 2 medio · bajo (sin valor: el riesgo está controlado y pasa directamente al nivel IV)</td></tr>
<tr><td>Nivel de exposición NE</td><td>4 continua · 3 frecuente · 2 ocasional · 1 esporádica</td></tr>
<tr><td>Nivel de consecuencia NC</td><td>100 mortal o catastrófico · 60 muy grave · 25 grave · 10 leve</td></tr>
<tr><td>Nivel de riesgo NR</td><td>I: 600 a 4000, no aceptable · II: 150 a 500, no aceptable o aceptable con control específico · III: 40 a 120, mejorable · IV: 20, aceptable</td></tr>
</table></div>
<p>Cada ficha de práctica del cuaderno trae su tabla de peligros valorada <i>con los controles ya aplicados</i>. Ninguna práctica del cuaderno queda en nivel I o II: si al adaptarla a su institución algún riesgo sube a esos niveles, la práctica no se hace hasta corregirlo.</p>
<div class="sim" data-sim="gtc45" data-kind="Herramienta" data-title="Calculadora de nivel de riesgo (GTC 45:2012)"></div>
<div class="sim-guide"><ul>
<li>Pruebe un cortocircuito de una pila de litio sin protección en una práctica que se repite todo el año: ND 6, NE 3, NC 25 da NR 450, nivel II. Con portapilas con fusible y pilas alcalinas, ND baja a 2 y el NR a 150, todavía nivel II; como además la consecuencia pasa a ser leve (NC 10), queda en 60, nivel III.</li>
<li>La matriz muestra todas las combinaciones: el control más eficaz es el que baja el ND (mejores controles) o el NC (sustituir el peligro), no el que solo reduce la exposición.</li>
</ul></div>
</section>

<section>
<h2>La jerarquía de los controles</h2>
<p>El Decreto 1072 de 2015 (art. 2.2.4.6.24) y la GTC 45 ordenan los controles del más al menos eficaz. En el laboratorio escolar se traducen así:</p>
<div class="tablewrap"><table>
<tr><th>Nivel</th><th>Ejemplos en el laboratorio de física</th></tr>
<tr><td><b>1. Eliminación</b></td><td>Retirar los termómetros y barómetros de mercurio. No usar la red de 120 V en ninguna práctica de estudiantes.</td></tr>
<tr><td><b>2. Sustitución</b></td><td>Termómetro digital en vez de vidrio; pilas alcalinas en vez de celdas de litio sin protección; láser de clase 2 verificado en vez de punteros sin marca; recipientes plásticos en vez de vidrio; esferas de acero en vez de plomo.</td></tr>
<tr><td><b>3. Controles de ingeniería</b></td><td>Tomas con protección diferencial (NTC 4595); portapilas con fusible; soportes con prensa; topes al final de rieles; pantallas mate para el láser; tapas en los recipientes calientes.</td></tr>
<tr><td><b>4. Controles administrativos, señalización y advertencia</b></td><td>Reglamento del laboratorio, lista de chequeo antes de cada sesión, roles en el equipo, demostración previa del docente, señalización según la NTC 4596.</td></tr>
<tr><td><b>5. Elementos de protección personal</b></td><td>Gafas de seguridad con resortes, ligas, proyectiles, vidrio y alambres tensos; guantes térmicos con agua caliente.</td></tr>
</table></div>
</section>

<section>
<h2>Electricidad: trabajar en muy baja tensión</h2>
<p>El RETIE vigente (Resolución 40117 de 2024 del Ministerio de Minas y Energía, modificada por las Resoluciones 40304 de 2025 y 40284 de 2026) define la <b>muy baja tensión</b> como menos de 25 V en corriente alterna o menos de 50 V en corriente continua, y aplica a las instalaciones por encima de esos valores. La regla del cuaderno es más estricta: <b>todas las prácticas de estudiantes se hacen con pilas o con fuentes certificadas de 12 V o menos</b>. Los equipos que se conectan a la red (fuentes, cargadores, soldadores, sopladoras) deben tener el certificado de conformidad que exige el reglamento y se conectan a tomas con protección diferencial.</p>
<p>El daño eléctrico lo produce la corriente que atraviesa el cuerpo, y esta depende de la tensión y de la impedancia del cuerpo, que a su vez baja cuando la tensión sube y cuando la piel está húmeda. La norma IEC 60479-1 tabula esa impedancia; con ella se ve por qué 120 V es peligroso y 12 V no:</p>
<div class="sim" data-sim="cuerpo" data-kind="Simulación" data-title="Corriente por el cuerpo según la tensión de contacto"></div>
<div class="sim-guide"><ul>
<li>A 120 V la corriente mano a mano supera los 70 mA: un diferencial de 30 mA debe despejar la falla en menos de 40 ms para que el contacto no sea mortal.</li>
<li>Por debajo de 25 V la impedancia real de la piel seca es mucho mayor que la de la tabla, que se usa como cota superior: la corriente queda por debajo del umbral en que la persona no puede soltar el conductor.</li>
</ul></div>
<h3>Pilas y baterías: el peligro es la corriente de cortocircuito</h3>
<p>Una pila no electrocuta, pero en cortocircuito entrega toda su energía en un alambre o en sí misma. La corriente vale \(I=\varepsilon/(r+R)\), con \(r\) la resistencia interna; una celda de litio 18650 tiene \(r\) de unos pocos centésimos de ohmio y puede entregar decenas de amperios, suficientes para poner al rojo un alambre delgado o incendiar la propia celda. Las pilas de botón, además, causan quemaduras internas graves si un niño las traga.</p>
<div class="sim" data-sim="cortocircuito" data-kind="Simulación" data-title="Cortocircuito de una pila: corriente y calentamiento del alambre"></div>
<div class="box warn"><h4>Reglas eléctricas del cuaderno</h4><p>Pilas alcalinas en portapilas con fusible de 1 A a 2 A. Nunca celdas de litio sueltas ni baterías de moto o de carro. Cables con caimanes revisados y sin cobre expuesto. Se arma el circuito sin fuente y se conecta al final, después de la revisión del docente. Se desconecta antes de modificar.</p></div>
</section>

<section>
<h2>Otros peligros propios de la física</h2>
<h3>Láseres</h3>
<p>La norma IEC 60825-1 clasifica los láseres por su capacidad de dañar el ojo. Los de clase 1 son seguros en uso normal; los de <b>clase 2</b> emiten luz visible con una potencia de hasta 1 mW y la protección depende del reflejo de parpadeo (unos 0,25 s); desde la clase 3R (hasta 5 mW) el riesgo para el ojo es real y desde la 3B la exposición directa causa lesiones. Los estudios de seguridad de varias universidades encontraron punteros vendidos como clase 2 que emitían decenas de milivatios.</p>
<ul>
<li>Solo láseres de clase 1 o 2 comprados a proveedores que declaren la norma y la potencia; si no se puede verificar, el puntero no entra al laboratorio.</li>
<li>El haz se mantiene por debajo de la altura de los ojos de personas sentadas y termina en una pantalla mate; se retiran relojes, anillos y superficies espejadas del camino.</li>
<li>Nunca se mira el haz ni su reflejo en un espejo, en agua o en un CD; se trabaja con buena iluminación ambiente para que la pupila esté contraída.</li>
</ul>
<h3>Mercurio: eliminar, no guardar</h3>
<p>Colombia aprobó el Convenio de Minamata con la Ley 1892 de 2018; la Ley 1658 de 2013 ordena eliminar el mercurio de los procesos industriales y el Decreto 419 de 2021 prohíbe fabricar, importar y exportar productos con mercurio añadido, entre ellos termómetros y barómetros. El uso de los que ya existen no está prohibido por ese decreto, pero en un laboratorio escolar no tienen justificación: un termómetro digital mide mejor y no contamina.</p>
<div class="box warn"><h4>Si se rompe un termómetro de mercurio</h4><p>Saque a los estudiantes y ventile el salón. No use escoba ni aspiradora, que dispersan el mercurio. Con guantes, recoja las gotas empujándolas con una tarjeta y levante las pequeñas con cinta adhesiva. Guarde todo, incluido el vidrio, en un frasco hermético rotulado «residuo con mercurio». Es un residuo peligroso (Decreto 1076 de 2015, que compila el Decreto 4741 de 2005): se entrega a un gestor autorizado coordinado con la secretaría de educación, nunca a la basura común.</p></div>
<h3>Imanes de neodimio</h3>
<p>Dos imanes que se atraen pueden pellizcar con fuerza y astillarse; si un niño traga dos, pueden perforar el intestino al atraerse a través de las paredes. Se guardan contados en una caja, se separan deslizándolos y se mantienen lejos de marcapasos, tarjetas y celulares.</p>
<h3>Calor y vidrio</h3>
<p>El agua hierve a menos de 100 °C en las ciudades altas (94 °C en Popayán, 91 °C en Bogotá), pero quema igual: una escaldadura grave se produce en segundos por encima de 60 °C. Se trabaja con jarras eléctricas con tapa, sobre bandejas, con guantes térmicos y sin estudiantes de pie alrededor. El vidrio roto se recoge con escoba y recogedor y va en un recipiente rígido rotulado.</p>
<h3>Mecánica y ruido</h3>
<p>Resortes tensos, ligas, proyectiles y alambres pueden golpear los ojos: gafas con resortes, ligas y lanzamientos. Las masas colgadas no pasan de lo que el soporte y el hilo resisten con margen, y nadie se ubica debajo. Los parlantes de las prácticas de ondas se usan a volumen moderado y por periodos cortos.</p>
<h3>Productos químicos menores</h3>
<p>Algunas prácticas usan alcohol antiséptico, glicerina, vinagre o pegantes. El Decreto 1496 de 2018 adoptó en Colombia el Sistema Globalmente Armonizado (SGA) de clasificación y etiquetado, y la Resolución 0773 de 2021 de los Ministerios del Trabajo y de Salud fija lo que deben hacer los empleadores en los lugares de trabajo: etiquetas con pictogramas y fichas de datos de seguridad disponibles. En el laboratorio de física basta con comprar cantidades pequeñas, conservar las etiquetas originales, tener la ficha de datos de seguridad de cada producto y guardar el alcohol lejos de fuentes de calor.</p>
</section>

<section>
<h2>Emergencias, protección personal y reglamento</h2>
<p>Elementos mínimos del laboratorio de física, según la NTC 4595:2025 y las prácticas del cuaderno: extintor de las áreas de laboratorio (multipropósito ABC o de CO₂ para equipos eléctricos, según el estudio de la institución), ducha de emergencia y lavaojos en el cuarto de preparación, botiquín con elementos para quemaduras y heridas leves, gafas de seguridad para todos los estudiantes, guantes térmicos, recipiente rígido para vidrio y caja para pilas usadas. El área de primer respondiente de la institución y los teléfonos de emergencia se señalan en la puerta.</p>
<h3>Reglamento mínimo del laboratorio</h3>
<ol>
<li>Nadie entra ni trabaja sin el docente.</li>
<li>Se leen la guía y su tabla de seguridad antes de tocar los materiales.</li>
<li>Bolsos fuera de las mesas y de los pasillos; cabello recogido; sin comida ni bebida.</li>
<li>Cada integrante del equipo tiene un rol (coordinador, operador de montaje, medidor, registrador) y lo cumple.</li>
<li>Los circuitos se arman sin fuente; la conexión final la autoriza el docente.</li>
<li>Los láseres solo apuntan a la pantalla, por debajo de la altura de los ojos.</li>
<li>Gafas puestas cuando la guía lo indica.</li>
<li>Todo accidente o daño, por pequeño que sea, se informa de inmediato.</li>
<li>Los datos se registran tal como se miden; no se borran ni se inventan.</li>
<li>Al terminar, el equipo se desarma, se cuenta y se devuelve; las pilas usadas y el vidrio van a sus recipientes.</li>
</ol>
<h3>Lista de chequeo antes de cada sesión</h3>
<ul class="checklist" data-check="sesion">
<li>Tomas con GFCI probadas con su botón de prueba este mes.</li>
<li>Extintor cargado, señalizado y sin obstáculos.</li>
<li>Pasillos de al menos 1,4 m entre mesas, libres de bolsos y cables.</li>
<li>Guías impresas o digitales con la tabla de seguridad de la práctica.</li>
<li>Material contado por caja; portapilas con fusible; cables revisados.</li>
<li>Gafas de seguridad suficientes si la práctica las exige.</li>
<li>Botiquín completo y número de emergencias visible.</li>
<li>Recipientes para pilas usadas y para vidrio disponibles.</li>
</ul>
</section>

<section>
<h2>Residuos del laboratorio</h2>
<p>La <b>Resolución 851 de 2022</b> del Ministerio de Ambiente reorganizó los sistemas de recolección selectiva de residuos de aparatos eléctricos y electrónicos (RAEE), con las pilas y acumuladores (subcategoría 3.11) y los equipos de iluminación (3.4) incluidos. Desde el 1 de enero de 2023 derogó las Resoluciones 1297, 1511 y 1512 de 2010, que muchos manuales escolares todavía citan para pilas, bombillas y computadores. Para el laboratorio eso se traduce en:</p>
<ul>
<li>Las pilas usadas se guardan en una caja plástica con los bornes cubiertos con cinta (para evitar cortocircuitos) y se entregan a un punto de recolección de los sistemas posconsumo.</li>
<li>A los aparatos que se desechan se les retiran las pilas antes de entregarlos.</li>
<li>Las lámparas fluorescentes compactas y los tubos contienen mercurio: no se rompen y se entregan enteros a los puntos de recolección.</li>
<li>El vidrio limpio va en recipiente rígido rotulado; los residuos con mercurio, como residuo peligroso.</li>
</ul>
<p>Esta gestión es una oportunidad para el proyecto ambiental escolar (Decreto 1743 de 1994) y para el estándar de 10.° y 11.° «Diseño y aplico estrategias para el manejo de basuras en mi colegio».</p>
</section>

<section>
<h2>Imágenes y datos de los estudiantes</h2>
<p>Varias prácticas se analizan grabando video. Las imágenes de los estudiantes son datos personales y la Ley 1581 de 2012 (art. 7) prohíbe tratar datos de niños, niñas y adolescentes salvo los de naturaleza pública; el tratamiento solo procede con autorización previa, expresa e informada de su representante legal, respetando el interés superior del menor y teniendo en cuenta su opinión (Decreto 1074 de 2015, que reglamenta la ley). En el laboratorio:</p>
<ul>
<li>Se encuadra el video para que muestre el montaje y no los rostros; se usa una regla o un objeto de escala en el plano del movimiento.</li>
<li>Los videos se analizan y se borran; no se publican en redes ni se comparten fuera del curso.</li>
<li>Si se quiere publicar algo (una feria, un artículo, el proyecto Ondas), se pide la autorización escrita de los padres o acudientes con el formato del apéndice B.</li>
</ul>
