<p class="lead">El primer montaje elaborado convierte un tubo de PVC en el instrumento que hizo de la mecánica una ciencia de precisión en los laboratorios universitarios. Requiere una o dos tardes de construcción, idealmente como proyecto de un grupo de estudiantes, y luego sirve para varias prácticas: la primera ley sin fricción, la segunda con un error de pocas partes por ciento y los choques con conservación del momento medida, no supuesta.</p>

<section>
<h2>Fundamento físico</h2>
<p>El aire que sale por los agujeros forma una película de unas décimas de milímetro entre el riel y el deslizador. La fricción seca desaparece; queda una resistencia viscosa pequeña, proporcional a la velocidad, \(F=-bv\), que se mide como la pérdida de velocidad entre dos fotopuertas.</p>
<p>Con una bandera de ancho \(w\), cada fotopuerta da una velocidad media \(v=w/\Delta t\) en el intervalo de bloqueo. Con dos fotopuertas separadas \(d\) y aceleración constante,</p>
<div class="eq key" data-name="Aceleración con dos fotopuertas">\[a=\frac{v_2^2-v_1^2}{2d},\qquad a=\frac{mg}{M_t+I/r^2}\ \ \text{(masa total constante)}.\]</div>
<p>Como en la práctica F10-06, las arandelas se pasan del deslizador al portapesas para mantener constante la masa total. Ahora la fricción no oculta la relación: la recta \(a\)–\(mg\) pasa por el origen y su pendiente da la masa total con una incertidumbre del orden del uno por ciento.</p>
<p>En un choque de dos deslizadores, \(m_1v_1+m_2v_2=m_1v_1'+m_2v_2'\). Con velcro (perfectamente inelástico) se mueven juntos; con imanes que se repelen el choque es casi elástico, con un coeficiente de restitución cercano a 1.</p>
</section>

<section>
<h2>Materiales, cortes y construcción</h2>
<!--F:riel-aire:materiales-->
<h3>Construcción paso a paso</h3>
<!--F:riel-aire:montaje-->
<div class="box note"><h4>Sugerencias de construcción</h4><p>Perfore primero un tramo de 30 cm y pruebe: si el deslizador no flota, agregue agujeros o aumente el caudal del soplador. Los agujeros deben quedar donde se apoyan los bordes del deslizador, no en la cima del tubo. Un secador de pelo en modo frío suele bastar para un riel de 1,5 m; para 2 m conviene una aspiradora en modo soplado. Las fotopuertas se montan en soportes de madera con tornillo para ajustar su altura.</p></div>
</section>
