<p class="lead">El último estándar de indagación de 10.° y 11.° pide comunicar el proceso y los resultados «utilizando gráficas, tablas, ecuaciones aritméticas y algebraicas», y relacionar las conclusiones con las de otros autores. Comunicar no es copiar la guía con los datos llenos: es contar qué se preguntó, qué se hizo, qué se encontró y qué tan seguro se está.</p>

<section>
<h2>La bitácora: el registro que no se corrige</h2>
<p>Cada equipo lleva un cuaderno de laboratorio (o una carpeta digital con fecha) donde se anota todo en el momento: el montaje con sus medidas, la resolución de cada instrumento, los datos tal como salen, los imprevistos y las ideas. Las reglas son las de cualquier laboratorio profesional: tinta, fecha en cada página, nada se borra (lo que está mal se tacha con una línea y se explica al lado) y las hojas no se arrancan. El estándar «Registro mis resultados en forma organizada y sin alteración alguna» se evalúa mirando la bitácora, no el informe.</p>
</section>

<section>
<h2>La estructura del informe</h2>
<p>Los artículos científicos siguen la estructura introducción, métodos, resultados y discusión. Para la media basta una versión de dos a cuatro páginas:</p>
<div class="tablewrap"><table>
<tr><th>Sección</th><th>Contenido</th><th>Errores frecuentes</th></tr>
<tr><td>Resumen</td><td>Cinco renglones: qué se midió, cómo, resultado con incertidumbre y conclusión.</td><td>Escribir el objetivo en lugar del resultado.</td></tr>
<tr><td>Introducción</td><td>Pregunta, importancia y modelo físico con sus ecuaciones y fuentes.</td><td>Copiar páginas de teoría sin relación con lo medido.</td></tr>
<tr><td>Montaje y procedimiento</td><td>Esquema rotulado, instrumentos y resoluciones, qué se varió y qué se mantuvo fijo.</td><td>Copiar el procedimiento de la guía en imperativo.</td></tr>
<tr><td>Resultados</td><td>Tablas con unidades, gráfica, ajuste y resultado con incertidumbre.</td><td>Tablas sin unidades; demasiadas cifras; gráficas de Excel sin rótulos.</td></tr>
<tr><td>Discusión</td><td>Compatibilidad con la referencia, fuentes de error, límites del modelo.</td><td>«Hubo errores humanos» sin decir cuáles ni cuánto pesan.</td></tr>
<tr><td>Conclusiones</td><td>Respuesta a la pregunta con el número y nuevas preguntas.</td><td>Conclusiones que no se desprenden de los datos.</td></tr>
<tr><td>Referencias y anexos</td><td>Fuentes con el formato de la institución; datos originales.</td><td>Enlaces sin autor ni fecha.</td></tr>
</table></div>
<p>El generador del capítulo 7 entrega una plantilla de informe en Word con esta estructura. Las tablas y figuras se numeran y llevan título (las tablas arriba, las figuras abajo) y se citan en el texto.</p>
<h3>Normas de presentación</h3>
<p>Muchas instituciones colombianas piden los trabajos escritos con las «normas ICONTEC»: la <b>NTC 1486</b> (presentación de tesis, trabajos de grado y otros trabajos de investigación; la sexta actualización, de 2008, es la que más se cita), la <b>NTC 5613</b> (referencias bibliográficas) y la <b>NTC 4490</b> (referencias de fuentes electrónicas). Otras adoptan las normas APA. Lo importante en el laboratorio es la coherencia con el SIEE: la guía debe decir cuál se usa, y la rúbrica evalúa la comunicación científica antes que el formato.</p>
</section>

<section>
<h2>Integridad, derechos de autor e inteligencia artificial</h2>
<ul>
<li><b>Datos.</b> Inventar, «arreglar» o seleccionar datos para que coincidan con el libro es la falta más grave del trabajo experimental. La rúbrica premia explícitamente explicar un resultado inesperado.</li>
<li><b>Créditos.</b> El estándar pide buscar información en diferentes fuentes, escoger la pertinente y dar el crédito correspondiente. Las imágenes y los textos ajenos se citan; la Ley 23 de 1982 protege los derechos de autor también en los trabajos escolares, y las obras con licencias Creative Commons pueden reutilizarse respetando sus condiciones.</li>
<li><b>Inteligencia artificial generativa.</b> Puede ayudar a revisar la redacción, a entender un concepto o a depurar una hoja de cálculo, pero no puede producir los datos ni las conclusiones. Conviene acordar con el grupo qué usos se permiten y pedir que se declaren al final del informe (qué herramienta, para qué y cómo se verificó).</li>
</ul>
</section>

<section>
<h2>Gráficas que comunican</h2>
<p>Una gráfica de informe se lee en diez segundos o no se lee. La herramienta muestra los defectos más comunes en las gráficas que entregan los estudiantes y cómo corregirlos.</p>

<section>
<h2>Más allá del informe</h2>
<ul>
<li><b>Póster.</b> Una hoja con pregunta, montaje (foto o esquema), una gráfica, el resultado y la conclusión. Obliga a elegir lo esencial y sirve para ferias y para la socialización en el colegio.</li>
<li><b>Video corto.</b> Dos minutos que muestran el montaje y explican el resultado. Recuerde las precauciones con las imágenes de los estudiantes (capítulo 3).</li>
<li><b>Ferias de ciencia y programa Ondas.</b> Las prácticas abiertas (nivel 3) pueden convertirse en proyectos de investigación escolar con acompañamiento del programa Ondas de Minciencias o de universidades de la región.</li>
</ul>
