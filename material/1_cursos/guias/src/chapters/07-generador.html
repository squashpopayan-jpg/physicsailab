<p class="lead">Las fichas del cuaderno están escritas para el docente. Lo que llega al estudiante es una guía: más corta, en su lenguaje, con espacios para escribir y con la rúbrica a la vista. Esta herramienta la arma en formato Word con los datos de su institución, en el nivel de indagación que el grupo necesita, lista para editar, imprimir o compartir.</p>

<section>
<h2>Cómo se usa</h2>
<ol>
<li>Escriba los datos de la institución y del docente; se recuerdan en este navegador para las siguientes guías.</li>
<li>Elija la práctica y el nivel de indagación (capítulo 5). El nivel cambia qué partes se entregan resueltas y cuáles debe construir el equipo.</li>
<li>Decida si incluye los referentes curriculares, el esquema del montaje (tomado del banco virtual de la práctica), la pregunta tipo Saber 11.° y la rúbrica.</li>
<li>Revise la vista previa y descargue el archivo .docx. Ábralo en Word, LibreOffice Writer o Google Docs y ajústelo a su grupo: el documento usa estilos de título reales, de modo que el índice y la navegación funcionan.</li>
</ol>
<p>Con la opción «Práctica propia» el generador arma una guía con el mismo formato a partir de los textos que usted escriba: sirve para las prácticas que ya tiene en su plan de área.</p>
<div class="sim" data-sim="generador" data-kind="Herramienta" data-title="Generador de la guía del estudiante (.docx)"></div>
</section>

<section>
<h2>Plantillas y paquete completo</h2>
<p>Además de las guías de cada práctica, el cuaderno ofrece:</p>
<ul>
<li>una <b>plantilla de guía en blanco</b> con todas las secciones y sus instrucciones de llenado;</li>
<li>una <b>plantilla de informe de laboratorio</b> con la estructura del capítulo 10;</li>
<li>el <b>paquete de las 36 guías</b> en un archivo .zip, cada una en su nivel de indagación sugerido y con los datos de institución que haya escrito arriba.</li>
</ul>
<div class="sim" data-sim="plantillas-word" data-kind="Herramienta" data-title="Plantillas en Word y paquete de guías"></div>
<div class="box note"><h4>Sobre el formato</h4><p>Los documentos se generan en el navegador, sin enviar datos a ningún servidor. Usan papel carta con márgenes de 2 cm, letra Arial de 11 puntos, encabezado con la institución y el código de la práctica, y pie con el número de página y el crédito. Si su institución exige otro formato (por ejemplo, márgenes de la NTC 1486 para informes), basta con cambiar los estilos en el procesador de texto.</p></div>
</section>
