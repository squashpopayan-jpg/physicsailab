<p class="lead">Es la práctica que responde directamente al estándar «Explico la transformación de energía mecánica en energía térmica». Un tubo, unos balines de acero y un termómetro digital bastan para ver subir la temperatura un par de grados después de cien caídas. El resultado se predice antes de medir y no depende de la masa, lo que da pie a una buena discusión.</p>

<section>
<h2>Fundamento físico</h2>
<p>En cada inversión del tubo, los perdigones de masa \(m\) caen la altura efectiva \(L\) (la longitud interna menos el espesor del montón) y pierden la energía potencial \(mgL\). Al chocar con el fondo, esa energía se convierte casi toda en energía interna de los perdigones y una parte se va al tubo, al aire y en sonido. Si una fracción \(\eta\) queda en los perdigones, después de \(N\) caídas</p>
<div class="eq key" data-name="Tubo de perdigones">\[m\,c\,\Delta T=\eta\,N\,m\,g\,L\qquad\Longrightarrow\qquad \Delta T=\frac{\eta\,N\,g\,L}{c}.\]</div>
<p>La masa se cancela: lo que importa es el calor específico del material. Por eso el plomo (\(c=0{,}129\) J/g·°C) daría un efecto casi cuatro veces mayor que el acero (\(c\approx0{,}47\)), pero su toxicidad lo excluye del laboratorio escolar: la eliminación del peligro es el primer nivel de la jerarquía de controles (capítulo 3).</p>
<div class="tablewrap"><table>
<tr><th>Material</th><th class="c">c (J/g·°C)</th><th class="c">ΔT ideal con N = 100 y L = 0,95 m</th></tr>
<tr><td>Acero</td><td class="c">0,466</td><td class="c">1,99 °C</td></tr>
<tr><td>Cobre</td><td class="c">0,385</td><td class="c">2,41 °C</td></tr>
<tr><td>Arena seca</td><td class="c">≈ 0,83</td><td class="c">1,12 °C</td></tr>
<tr><td>Plomo (excluido)</td><td class="c">0,129</td><td class="c">7,20 °C</td></tr>
</table></div>
<p class="ctrl-note">Calculado con \(g=9{,}776\) m/s² (Popayán); en la costa el resultado es 0,06 % mayor.</p>
</section>
