<p class="lead">Un motorreductor de juguete, un hilo y unas bolsas de arena bastan para medir la conversión de energía eléctrica en energía potencial. La práctica une el DBA 2 de 10.° (transformaciones de energía en sistemas no conservativos) con el DBA 3 de 11.° (circuitos), y deja una idea útil en ingeniería: cada máquina tiene una carga en la que rinde más.</p>

<section>
<h2>Fundamento físico</h2>
<p>En un motor de imanes permanentes, el par es proporcional a la corriente y la fuerza contraelectromotriz a la velocidad angular, con la misma constante \(k\). Si \(R\) es la resistencia del bobinado, \(r\) el radio del carrete y \(\tau_f\) el par de rozamiento:</p>
<div class="eq key" data-name="Motor de corriente continua">\[V=IR+k\omega,\qquad kI=mgr+\tau_f,\qquad \eta=\frac{mgr\,\omega}{VI}.\]</div>
<p>La corriente crece linealmente con la masa, y la energía no aprovechada se reparte entre el calor del bobinado \(I^2R\) y el rozamiento \(\tau_f\omega\). Si \(I_0=\tau_f/k\) es la corriente sin carga y \(I_b=V/R\) la de bloqueo, el rendimiento máximo se alcanza con \(I^*=\sqrt{I_0 I_b}\) y vale \(\eta_{\max}=\left(1-\sqrt{I_0/I_b}\right)^2\).</p>
</section>
