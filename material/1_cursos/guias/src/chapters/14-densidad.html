<p class="lead">Es la práctica con la que conviene abrir el año de 10.°: no exige conceptos nuevos de física y en cambio enseña todo lo que se usará después, desde leer un calibrador hasta decidir con números si dos valores son iguales. La pregunta de identificar un material le da sentido a la incertidumbre: sin ella no se puede afirmar nada.</p>

<section>
<h2>Fundamento</h2>
<p>La densidad es el cociente entre la masa y el volumen, \(\rho=m/V\). Para un cilindro de diámetro \(d\) y altura \(h\),</p>
<div class="eq key" data-name="Densidad de un cilindro">\[\rho=\frac{4m}{\pi d^2h},\qquad \left(\frac{u_\rho}{\rho}\right)^2=\left(\frac{u_m}{m}\right)^2+\left(\frac{2u_d}{d}\right)^2+\left(\frac{u_h}{h}\right)^2 .\]</div>
<p>Para un sólido irregular se usa el principio de desplazamiento: al sumergirlo por completo en una probeta, el nivel sube en un volumen igual al del sólido, \(V=V_2-V_1\), y \(u_V=\sqrt{u_{V_1}^2+u_{V_2}^2}\).</p>

<div class="box note"><h4>De dónde sacar los cilindros</h4><p>Las ferreterías y los talleres de torno venden retales de barra redonda de aluminio, latón y nailon por centímetros. Un cilindro de 1 pulgada (25,4 mm) por 5 cm se corta con segueta y se lima; con cuatro o cinco materiales distintos se arma un juego que dura años.</p></div>

<section>
<h2>Banco virtual</h2>
<p>Cada pulsación de «Medir» simula una determinación completa de un grupo: masa, dimensiones o volúmenes con el ruido y la resolución de los instrumentos elegidos. La gráfica muestra cada densidad con su barra de incertidumbre frente al valor del material.</p>
<div class="sim" data-sim="densidad-banco" data-kind="Banco virtual" data-title="Densidad de un sólido: método, instrumentos e incertidumbre"></div>
<div class="sim-guide"><ul>
<li>Con el cilindro de aluminio, compare regla y calibrador: las barras se encogen unas veinte veces.</li>
<li>Con el cilindro de latón y la probeta, las barras son enormes: el volumen (5 cm³) es apenas cinco divisiones de la probeta.</li>
<li>Con la piedra solo funciona el desplazamiento: es el método para formas irregulares.</li>
</ul></div>
<div class="box ex"><h4>Resultados esperados (validados)</h4><p>El cilindro de aluminio de 25,4 mm × 50,0 mm tiene un volumen de 25,34 cm³ y una masa de 68,4 g. La incertidumbre relativa de su densidad es de 2,4 % con regla y balanza de cocina, de 0,1 % con calibrador de 0,05 mm y balanza de 0,01 g, y de 1,7 % por desplazamiento en una probeta de 1 mL. El apéndice D verifica la fórmula de propagación contra una simulación de Monte Carlo.</p></div>
