<p class="lead">En Colombia el laboratorio no es un adorno del currículo: la Ley General de Educación lo nombra como objetivo de la educación media. Este capítulo recorre la cadena normativa, desde la ley hasta la pregunta del examen de Estado, y ubica en ella las 36 prácticas del cuaderno para que cada guía declare con precisión qué aprendizaje desarrolla.</p>

<section>
<h2>La ley pide experimentar</h2>
<p>La Ley 115 de 1994 fija los objetivos de cada nivel. Para la básica secundaria (grados 6.° a 9.°), su artículo 22 incluye dos que describen exactamente el trabajo de laboratorio:</p>
<ul>
<li>literal d: «El avance en el conocimiento científico de los fenómenos físicos, químicos y biológicos, mediante la comprensión de las leyes, el planteamiento de problemas y la observación experimental»;</li>
<li>literal f: «La comprensión de la dimensión práctica de los conocimientos teóricos, así como la dimensión teórica del conocimiento práctico y la capacidad para utilizarla en la solución de problemas».</li>
</ul>
<p>Para la educación media académica (grados 10.° y 11.°), el artículo 30 es todavía más directo:</p>
<div class="box law"><h4>Ley 115 de 1994, artículo 30</h4><p>Son objetivos específicos de la educación media académica, entre otros: «b) La profundización en conocimientos avanzados de las ciencias naturales; c) La incorporación de la investigación al proceso cognoscitivo, tanto de laboratorio como de la realidad nacional, en sus aspectos natural, económico, político y social».</p></div>
<p>El artículo 23 hace de las «Ciencias naturales y educación ambiental» el primero de los nueve grupos de áreas obligatorias y fundamentales, que juntos ocupan al menos el 80 % del plan de estudios. El artículo 31 extiende esas áreas a la media «en un nivel más avanzado» y su parágrafo permite que cada institución organice la programación para que los estudiantes intensifiquen en ciencias naturales. La física de 10.° y 11.° es, por tanto, la profundización obligatoria de un área obligatoria, con el laboratorio como objetivo explícito.</p>
<div class="box note"><h4>Media técnica</h4><p>En la media técnica (artículos 32 y 33) las áreas de la académica se conservan y la formación debe incorporar «lo más avanzado de la ciencia y de la técnica». Las prácticas elaboradas de la parte VI, que piden construir instrumentos y adquirir datos con microcontroladores, encajan bien en especialidades de electricidad, electrónica, mecánica o informática.</p></div>
</section>

<section>
<h2>Del proyecto educativo institucional al aula</h2>
<p>La ley da autonomía a cada institución (artículo 77) para organizar su currículo dentro de los lineamientos del Ministerio. El Decreto 1075 de 2015, Único Reglamentario del Sector Educación, compila las reglas que convierten esa autonomía en documentos concretos:</p>
<div class="tablewrap"><table>
<tr><th>Documento institucional</th><th>Qué debe contener sobre el laboratorio</th><th>Fuente</th></tr>
<tr><td>Proyecto educativo institucional (PEI)</td><td>El énfasis (por ejemplo, ciencias), los recursos disponibles y los proyectos pedagógicos, entre ellos el proyecto ambiental escolar.</td><td>Ley 115, art. 73; Decreto 1075, sección 2.3.3.1.4</td></tr>
<tr><td>Plan de estudios del área</td><td>Objetivos por grado, metodología, distribución del tiempo, criterios de evaluación. Aquí se declaran las prácticas de cada periodo con sus DBA.</td><td>Decreto 1075, art. 2.3.3.1.6.1 (antes Decreto 1860 de 1994)</td></tr>
<tr><td>Sistema institucional de evaluación (SIEE)</td><td>Escala institucional y su equivalencia con la nacional; peso de los informes y de las rúbricas de laboratorio.</td><td>Decreto 1290 de 2009, compilado en el Decreto 1075</td></tr>
<tr><td>Calendario e intensidad</td><td>Cuarenta semanas de trabajo académico; en secundaria y media, treinta horas semanales y 1200 horas anuales como mínimo.</td><td>Decreto 1850 de 2002, compilado en el Decreto 1075</td></tr>
<tr><td>Plan escolar de gestión del riesgo y matriz de peligros</td><td>Riesgos del laboratorio y procedimientos de emergencia (capítulo 3).</td><td>Ley 1523 de 2012, art. 42; Decreto 1072 de 2015</td></tr>
</table></div>
<p>Una consecuencia práctica: si el plan de estudios declara que en el segundo periodo de 10.° se hacen las prácticas de péndulo y de resorte para el DBA 2, la rúbrica del informe pasa a ser un instrumento de evaluación del SIEE y la práctica deja de depender de la buena voluntad de cada año.</p>
</section>

<section>
<h2>Los tres referentes de calidad</h2>
<p>El Ministerio de Educación Nacional ha publicado tres documentos sucesivos que no se reemplazan sino que se complementan:</p>
<ol>
<li><b>Lineamientos curriculares de Ciencias Naturales y Educación Ambiental (1998).</b> Fijan la concepción del área: el conocimiento científico como construcción humana, la importancia de las preguntas de los estudiantes y del trabajo experimental para explicar el mundo.</li>
<li><b>Estándares Básicos de Competencias en Ciencias Naturales (2004, Guía 7 «Formar en ciencias: ¡el desafío!»).</b> Para el grupo de grados 10.° y 11.° se organizan en tres columnas: «me aproximo al conocimiento como científico(a) natural» (19 acciones de indagación), «manejo conocimientos propios de las ciencias naturales» (entorno vivo, entorno físico con procesos físicos y químicos separados, y ciencia, tecnología y sociedad) y «desarrollo compromisos personales y sociales».</li>
<li><b>Derechos Básicos de Aprendizaje de Ciencias Naturales, V.1 (2016).</b> Concretan por grado los aprendizajes estructurantes con evidencias y ejemplos. Colombia Aprende volvió a publicar el documento el 25 de mayo de 2026; al consultarlo en octubre de 2026 sigue siendo la versión V.1, sin cambios en los enunciados.</li>
</ol>
<h3>La física en los DBA de 9.° a 11.°</h3>
<div class="tablewrap"><table>
<tr><th class="c">Grado</th><th>Enunciado del DBA (textual)</th><th>Prácticas del cuaderno</th></tr>
<tr><td class="c">9.° · DBA 1</td><td>Comprende que el movimiento de un cuerpo, en un marco de referencia inercial dado, se puede describir con gráficos y predecir por medio de expresiones matemáticas.</td><td>Prerrequisito; se retoma en <a href="#movimiento">Movimiento rectilíneo</a> y <a href="#caida-libre">caída libre con fotopuerta</a>.</td></tr>
<tr><td class="c">10.° · DBA 1</td><td>Comprende, que el reposo o el movimiento rectilíneo uniforme, se presentan cuando las fuerzas aplicadas sobre el sistema se anulan entre ellas, y que en presencia de fuerzas resultantes no nulas se producen cambios de velocidad.</td><td>Fricción, segunda ley, equilibrio y centro de masa, movimiento circular, riel de aire.</td></tr>
<tr><td class="c">10.° · DBA 2</td><td>Comprende la conservación de la energía mecánica como un principio que permite cuantificar y explicar diferentes fenómenos mecánicos: choques entre cuerpos, movimiento pendular, caída libre, deformación de un sistema masa-resorte.</td><td>Péndulo, resorte, rampa y lanzamiento, choques, péndulo físico, tubo de perdigones.</td></tr>
<tr><td class="c">11.° · DBA 1</td><td>Comprende la naturaleza de la propagación del sonido y de la luz como fenómenos ondulatorios (ondas mecánicas y electromagnéticas, respectivamente).</td><td>Ondas en resorte, sonido, refracción, lentes, difracción, polarización, Melde, cubeta de ondas, espectroscopio.</td></tr>
<tr><td class="c">11.° · DBA 2</td><td>Comprende que la interacción de las cargas en reposo genera fuerzas eléctricas y que cuando las cargas están en movimiento genera fuerzas magnéticas.</td><td>Electrostática, electroimán y Oersted, inducción, brújula de tangentes, motor.</td></tr>
<tr><td class="c">11.° · DBA 3</td><td>Comprende las relaciones entre corriente y voltaje en circuitos resistivos sencillos en serie, en paralelo y mixtos.</td><td>Circuitos y ley de Ohm, circuito RC, LED y constante de Planck.</td></tr>
</table></div>
<p>Los otros DBA de 10.° y 11.° corresponden a química, biología y ambiente. Las prácticas térmicas y de fluidos no tienen un DBA de física propio, pero responden a estándares explícitos de 10.° y 11.° (F3: transformación de energía mecánica en térmica; F6: fluidos en reposo y en movimiento; T1: aplicaciones de la mecánica de fluidos) y a temas evaluados por el ICFES.</p>
<h3>La prueba Saber 11.°</h3>
<p>Según la descripción vigente del ICFES (infografía de 2025), la prueba de Ciencias Naturales evalúa tres competencias en cuatro componentes (biológico, químico, físico y ciencia, tecnología y sociedad):</p>
<div class="tablewrap"><table>
<tr><th>Competencia</th><th>Qué evalúa (ICFES)</th><th>Cómo la ejercita el laboratorio</th></tr>
<tr><td>Uso comprensivo del conocimiento científico</td><td>La capacidad para comprender y usar conceptos, teorías y modelos para solucionar problemas.</td><td>Predecir con un modelo antes de medir; calcular el valor esperado.</td></tr>
<tr><td>Explicación de fenómenos</td><td>La capacidad para analizar críticamente argumentos y modelos que explican fenómenos.</td><td>Explicar por qué los datos se apartan del modelo; discutir los límites de un modelo.</td></tr>
<tr><td>Indagación</td><td>La capacidad para reconocer preguntas y procedimientos adecuados, y buscar, seleccionar e interpretar información.</td><td>Formular la pregunta, controlar variables, escoger la gráfica, interpretar tablas y gráficas.</td></tr>
</table></div>
<p>El componente físico incluye cinemática, dinámica, energía mecánica, ondas, energía térmica, electromagnetismo, campo gravitacional, y transformación y conservación de la energía. Cada ficha del cuaderno trae una pregunta original con el formato de selección múltiple de la prueba, marcada con la competencia que evalúa.</p>
</section>

<section>
<h2>Lo que el laboratorio no cubre y cómo completarlo</h2>
<p>Dos estándares de procesos físicos de 10.° y 11.° no admiten un experimento escolar directo: <b>F7</b> («Relaciono masa, distancia y fuerza de atracción gravitacional entre objetos») y <b>F8</b> («Establezco relaciones entre el modelo del campo gravitacional y la ley de gravitación universal»). Medir la atracción entre dos masas de laboratorio exige una balanza de torsión de Cavendish, fuera del alcance de un colegio. Se cubren con actividades de análisis de datos reales:</p>
<ul>
<li>la variación de \(g\) entre municipios colombianos (apéndice A): latitud y altura, con la ley de gravitación como explicación;</li>
<li>la tercera ley de Kepler con los periodos y radios orbitales de las lunas de Júpiter o de los planetas, linealizando \(T^2\) contra \(r^3\) igual que se hace con el péndulo;</li>
<li>simulaciones como «Gravity Force Lab» del proyecto PhET de la Universidad de Colorado, con una guía de indagación del mismo formato que las demás.</li>
</ul>
<p>El estándar <b>T3</b> (recursos naturales y obtención de energía) se trabaja mejor como proyecto que como práctica; el motor y el generador de la práctica FE-09 son un buen punto de partida. El compromiso <b>S5</b> («Diseño y aplico estrategias para el manejo de basuras en mi colegio») encaja en la gestión de pilas, aparatos eléctricos y vidrio del propio laboratorio (capítulo 3).</p>
</section>

<section>
<h2>Plan anual de laboratorio</h2>
<p>Con el calendario de 40 semanas y la intensidad que la institución asigne a la física, el planeador propone una secuencia que cubre todos los DBA de física del grado con el tiempo disponible. Es un punto de partida para el plan de área, no un sustituto del criterio del docente.</p>
<div class="sim" data-sim="plan-anual" data-kind="Herramienta" data-title="Planeador del año: prácticas por periodo"></div>
<div class="sim-guide"><ul>
<li>Con dos horas semanales de física y un tercio del tiempo en laboratorio caben unas doce sesiones de dos horas: suficientes para seis a ocho prácticas con su análisis.</li>
<li>Marque «Incluir montajes elaborados» si la institución tiene horas de profundización o una media con énfasis.</li>
</ul></div>
