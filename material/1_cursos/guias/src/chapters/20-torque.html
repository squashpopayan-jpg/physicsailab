<p class="lead">Una regla, un clavo y unas tuercas bastan para trabajar el único estándar de procesos físicos de 10.° y 11.° que habla de estabilidad («Establezco relaciones entre estabilidad y centro de masa de un objeto»). La práctica convierte la regla en una balanza de brazos, mide la masa de la propia regla sin balanza y termina con una pregunta que sorprende: ¿dónde está el centro de masa de una L?</p>

<h2>Fundamento físico</h2>
<p>Un cuerpo rígido está en equilibrio si la fuerza neta y el momento neto respecto de cualquier punto son cero. Con la regla horizontal y fuerzas verticales, el momento de cada peso respecto del apoyo es \(m_ig\,d_i\), con signo según el sentido de giro. Para una masa desconocida \(m_x\) a la distancia \(d_x\) equilibrada por una masa conocida \(m_k\) a \(d_k\),</p>
<div class="eq key" data-name="Equilibrio rotacional">\[m_x\,d_x=m_k\,d_k\qquad\Longrightarrow\qquad d_k=(m_x d_x)\,\frac{1}{m_k}.\]</div>
<p>Si el apoyo está en la posición \(p\) y no en el centro de la regla de masa \(m_r\), el peso de la regla actúa en su centro, a \(0{,}50-p\) del apoyo, y aparece en la ecuación: \(m_r(0{,}50-p)=m_k(p-x_k)\). Así se mide la masa de la regla sin balanza.</p>
<h3>Centro de masa y estabilidad</h3>
<p>El centro de masa de una figura compuesta de partes uniformes es el promedio de los centros de cada parte ponderado por su área. Para una L de 20 cm × 20 cm con brazos de 5 cm, formada por un rectángulo de 20 × 5 cm y otro de 5 × 15 cm,</p>
<div class="eq">\[x_{cm}=y_{cm}=\frac{100\cdot10+75\cdot2{,}5}{175}=6{,}79\ \text{cm},\]</div>
<p>un punto fuera del material. Una figura suspendida de un punto cuelga con su centro de masa en la vertical del punto de suspensión: dos verticales se cruzan en él. Un objeto apoyado se vuelca cuando la vertical de su centro de masa sale de la base; para una caja de base \(b\) con el centro de masa a la altura \(h\), el ángulo de vuelco es \(\arctan\!\big(b/(2h)\big)\).</p>
</section>
