<p class="lead">La fricción es la fuerza más cotidiana y la peor descrita por los modelos escolares. Esta práctica obliga a medirla con cuidado y descubre dos cosas: que la ley de Amontons (la fricción no depende del área) funciona sorprendentemente bien, y que los coeficientes varían de una medida a otra mucho más que cualquier otra magnitud del curso, lo que hace indispensable repetir y comparar con incertidumbre.</p>

<section>
<h2>Fundamento físico</h2>
<p>Sobre un bloque en un plano de inclinación \(\theta\) actúan el peso, la normal \(N=mg\cos\theta\) y la fricción a lo largo del plano. Mientras el bloque está en reposo, la fricción estática iguala exactamente a \(mg\operatorname{sen}\theta\), hasta un máximo \(\mu_sN\). El deslizamiento empieza en el ángulo crítico</p>
<div class="eq key" data-name="Ángulo crítico">\[mg\operatorname{sen}\theta_c=\mu_s\,mg\cos\theta_c\quad\Longrightarrow\quad \mu_s=\tan\theta_c ,\]</div>
<p>independiente de la masa. Una vez en movimiento, la fricción cinética \(\mu_kN\) es en general menor, y el bloque acelera con</p>
<div class="eq">\[a=g(\operatorname{sen}\theta-\mu_k\cos\theta)\quad\Longrightarrow\quad\frac{a}{g\cos\theta}=\tan\theta-\mu_k .\]</div>
<p>La gráfica de \(a/(g\cos\theta)\) contra \(\tan\theta\) es una recta de pendiente 1 y corte \(-\mu_k\); que la pendiente salga cercana a 1 es una prueba del modelo. Como \(\mu_k&lt;\mu_s\), un bloque que arranca en \(\theta_c\) acelera con \(g\cos\theta_c(\mu_s-\mu_k)\): no se detiene aunque se baje un poco la tabla.</p>
<div class="box warn"><h4>Coeficientes que no están en los libros</h4><p>Las tablas de coeficientes de fricción dan rangos amplios porque el valor depende del acabado, la humedad, el polvo, el tiempo de contacto y hasta de la velocidad. Por eso esta práctica no «comprueba» un valor tabulado: mide el de sus materiales, con su dispersión. Los valores del banco virtual son ilustrativos.</p></div>
</section>
