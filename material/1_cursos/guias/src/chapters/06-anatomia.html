<p class="lead">Una guía de laboratorio es un texto instructivo que debe funcionar sin el docente al lado: un estudiante tiene que poder leerla, armar el montaje con seguridad, medir y saber qué hacer con los datos. Este capítulo descompone la guía en sus partes, da criterios para escribir cada una y termina con una lista de chequeo para revisar cualquier guía, propia o ajena.</p>

<section>
<h2>Las partes y su función</h2>
<div class="tablewrap"><table>
<tr><th>Parte</th><th>Función</th><th>Criterio de calidad</th></tr>
<tr><td>Encabezado</td><td>Identifica institución, área, grado, docente, fecha, código, duración e integrantes con sus roles.</td><td>Cabe en un recuadro; los roles quedan escritos.</td></tr>
<tr><td>Referentes curriculares</td><td>Declara el DBA, los estándares y las competencias de Saber 11.° que se desarrollan.</td><td>Enunciados textuales, no paráfrasis vagas; útil para el plan de área y para el estudiante.</td></tr>
<tr><td>Pregunta y contexto</td><td>Plantea el problema que da sentido a la práctica.</td><td>Una pregunta que se responde con los datos de la práctica, idealmente ligada a algo cercano.</td></tr>
<tr><td>Objetivos</td><td>Dicen qué podrá hacer el estudiante al terminar.</td><td>Verbos observables (medir, determinar, comparar, explicar) y no «conocer» o «entender».</td></tr>
<tr><td>Predicción</td><td>Hace explícitas las ideas previas antes de medir (POE).</td><td>Pide una razón, no solo un resultado.</td></tr>
<tr><td>Ideas clave</td><td>Resume el modelo físico mínimo.</td><td>Breve; remite al texto de clase en vez de copiarlo.</td></tr>
<tr><td>Materiales</td><td>Lista lo que recibe cada grupo.</td><td>Cantidades por grupo y alternativas si algo falta.</td></tr>
<tr><td>Seguridad</td><td>Identifica peligros y controles.</td><td>Específica de la práctica, valorada con la GTC 45; nunca se omite.</td></tr>
<tr><td>Montaje</td><td>Indica cómo construir el arreglo experimental.</td><td>Pasos numerados con medidas y un esquema rotulado.</td></tr>
<tr><td>Procedimiento</td><td>Ordena las mediciones.</td><td>Una acción por paso; dice cuántas repeticiones y qué valores de la variable independiente.</td></tr>
<tr><td>Registro de datos</td><td>Tabla para anotar.</td><td>Columnas con magnitud, símbolo y unidad; espacio para la resolución del instrumento.</td></tr>
<tr><td>Análisis</td><td>Transforma datos en un resultado.</td><td>Gráfica, linealización si hace falta, resultado con incertidumbre y comparación cuantitativa.</td></tr>
<tr><td>Discusión</td><td>Lleva a pensar con los datos.</td><td>Preguntas que no se responden copiando la teoría.</td></tr>
<tr><td>Conclusiones</td><td>Responde la pregunta inicial.</td><td>Con el resultado numérico y su incertidumbre.</td></tr>
<tr><td>Evaluación</td><td>Hace públicos los criterios.</td><td>Rúbrica con los niveles de la escala nacional; pregunta de transferencia.</td></tr>
<tr><td>Referencias</td><td>Da crédito a las fuentes.</td><td>Formato institucional (NTC 1486 o APA, capítulo 10).</td></tr>
</table></div>
</section>

<section>
<h2>Escribir para que se entienda</h2>
<p>La mayoría de las dudas en el laboratorio son dudas de lectura. Algunas reglas simples:</p>
<ul>
<li>Un paso, una acción, empezando con un verbo en imperativo: «Mida», «Suelte», «Anote».</li>
<li>Cantidades con unidad y, cuando importa, con tolerancia: «entre 0,30 m y 1,20 m, al menos seis valores».</li>
<li>Nada de «observe qué pasa»: diga qué observar y cómo registrarlo.</li>
<li>Las advertencias de seguridad van antes del paso al que se refieren, no al final de la guía.</li>
<li>Frases de menos de 25 palabras; términos técnicos definidos la primera vez.</li>
<li>Figuras rotuladas con las mismas letras que usa el texto (\(L\), \(\theta\), \(m\)).</li>
</ul>
<p>La legibilidad de un texto en español se puede estimar con fórmulas basadas en la longitud de las palabras (sílabas) y de las frases. La de <b>Fernández Huerta</b> (1959) es \(L=206{,}84-0{,}60\,P-1{,}02\,F\), con \(P\) las sílabas por cada cien palabras y \(F\) las frases por cada cien palabras; la de <b>Szigriszt-Pazos</b> (1993), interpretada con la escala INFLESZ de Barrio-Cantalejo y colaboradores (2008), es \(\mathcal P=206{,}835-62{,}3\,S/W-W/F\), con \(S\) sílabas, \(W\) palabras y \(F\) frases. Para estudiantes de la media conviene un INFLESZ por encima de 55 («normal»).</p>
<div class="sim" data-sim="legibilidad" data-kind="Herramienta" data-title="Medidor de legibilidad de una guía"></div>
<div class="sim-guide"><ul>
<li>Pegue el procedimiento de una guía. Las frases de más de 25 palabras aparecen resaltadas: divídalas.</li>
<li>Las fórmulas miden la forma, no el contenido: un texto corto lleno de términos sin definir puede puntuar bien y ser incomprensible.</li>
</ul></div>
</section>

<section>
<h2>Alineación: objetivo, actividad, evidencia, criterio</h2>
<p>Una guía está alineada cuando cada objetivo tiene una actividad que lo desarrolla, una evidencia que lo muestra y un criterio que lo evalúa (la «alineación constructiva» de Biggs, 1996). La tabla muestra la práctica del péndulo:</p>
<div class="tablewrap"><table>
<tr><th>Objetivo</th><th>Actividad</th><th>Evidencia</th><th>Criterio de la rúbrica</th></tr>
<tr><td>Identificar de qué variables depende el periodo</td><td>Cambiar masa, amplitud y longitud una a la vez</td><td>Tabla con los tres ensayos y su comparación</td><td>Planeación y montaje</td></tr>
<tr><td>Medir el periodo con incertidumbre menor que el tiempo de reacción</td><td>Cronometrar diez oscilaciones tres veces</td><td>Periodo con incertidumbre tipo A</td><td>Medición y registro</td></tr>
<tr><td>Obtener <i>g</i> por linealización</td><td>Graficar <i>T</i>² contra <i>L</i> y ajustar</td><td><i>g</i> con incertidumbre y valor z</td><td>Análisis de datos</td></tr>
</table></div>
<p>Si un objetivo no tiene evidencia ni criterio, sobra o falta una actividad. Si la rúbrica evalúa algo que ninguna actividad desarrolla, el estudiante lo descubrirá en la nota.</p>
</section>

<section>
<h2>Formatos alternativos</h2>
<h3>Hoja POE</h3>
<p>Tres columnas: «Predigo que… porque…», «Observé que…», «Explico la diferencia…». Ideal para experiencias y experimentos ilustrativos de una sola sesión (Oersted, empuje, polarización).</p>
<h3>V de Gowin</h3>
<p>Útil como informe breve. En el vértice, los acontecimientos (qué se hizo); en el centro, la pregunta; a la izquierda, el lado conceptual; a la derecha, el metodológico.</p>

<h3>Tríada ISLE</h3>
<p>Tres experimentos encadenados: uno de observación (sin teoría, buscando regularidades), uno de prueba (la hipótesis predice; si falla, se descarta) y uno de aplicación (resolver un problema práctico con el modelo). La guía pide explícitamente la predicción antes del experimento de prueba.</p>
<h3>Estaciones rotativas</h3>
<p>Cuando hay un solo equipo de cada tipo, se arman cuatro o cinco estaciones con prácticas cortas del mismo tema (por ejemplo, ondas: resorte, cubeta, CD, polarizadores) y los grupos rotan cada 20 minutos con una guía de una página por estación.</p>
<h3>Guía para la casa</h3>
<p>Prácticas que solo requieren objetos domésticos y el celular (péndulo, rebote, enfriamiento, sonido en una botella). La seguridad se redacta para la familia y se excluye todo lo que use calor intenso, láser o electricidad distinta de pilas AA.</p>
<h3>Guía con simulación</h3>
<p>Para fenómenos que el colegio no puede montar (gravitación, campos, átomos). Se escribe igual que una guía real, con predicción, control de variables y análisis de datos exportados de la simulación.</p>
</section>

<section>
<h2>De la receta a la indagación: un ejemplo</h2>
<div class="tablewrap"><table>
<tr><th>Guía tipo receta (nivel 0)</th><th>La misma práctica, guiada (nivel 2)</th></tr>
<tr><td><b>Objetivo:</b> comprobar la ley de Hooke.<br><b>Procedimiento:</b> 1. Cuelgue el resorte. 2. Agregue masas de 50 g en 50 g hasta 250 g. 3. Mida el alargamiento. 4. Grafique y verifique que es una recta. 5. Calcule <i>k</i>.<br><b>Conclusión esperada:</b> se comprobó la ley de Hooke.</td>
<td><b>Pregunta:</b> ¿hasta qué carga podemos usar este resorte como dinamómetro, y con qué precisión?<br><b>Preguntas orientadoras:</b> ¿qué medirán y con qué instrumento? ¿Cómo sabrán si la relación es lineal? ¿Cómo detectarán que el resorte se deformó de manera permanente? ¿Qué incertidumbre tendrá una fuerza medida con su dinamómetro?<br><b>Producto:</b> la curva de calibración del dinamómetro con su rango útil y su incertidumbre.</td></tr>
</table></div>
<p>La segunda versión usa los mismos materiales, pero obliga a decidir: cuántas masas, hasta dónde cargar, cómo detectar la deformación permanente. Y el resultado tiene un uso: el dinamómetro calibrado sirve en la práctica de hidrostática.</p>
</section>

<section>
<h2>Lista de chequeo de calidad</h2>
<p>Revise una guía antes de usarla; las casillas se recuerdan en este navegador.</p>
<ul class="checklist" data-check="calidad-guia">
<li>La pregunta se responde con los datos de la práctica.</li>
<li>Los objetivos usan verbos observables y cada uno tiene evidencia y criterio.</li>
<li>Declara DBA y estándares con sus enunciados.</li>
<li>Pide una predicción con justificación antes de medir.</li>
<li>Los materiales están por grupo y con alternativas.</li>
<li>La tabla de seguridad es específica y está valorada; las advertencias preceden a los pasos.</li>
<li>El montaje tiene esquema rotulado y medidas.</li>
<li>Cada paso del procedimiento es una sola acción con cantidades y unidades.</li>
<li>Dice cuántas repeticiones y qué valores de la variable independiente.</li>
<li>La tabla de datos tiene magnitudes, símbolos, unidades y espacio para la resolución.</li>
<li>El análisis llega a un resultado con incertidumbre y a una comparación cuantitativa.</li>
<li>Las preguntas de discusión no se responden copiando la teoría.</li>
<li>La rúbrica usa la escala nacional y se entrega con la guía.</li>
<li>El nivel de indagación es adecuado para el grupo en este momento del año.</li>
<li>La duración es realista, incluido el tiempo de armar y desarmar.</li>
<li>Su legibilidad INFLESZ es «normal» o más fácil.</li>
</ul>
