<p class="lead">La primera evidencia del DBA 1 de 11.° pide clasificar las ondas por la dirección de la oscilación; la segunda, aplicar la reflexión a casos prácticos. Un resorte largo de juguete muestra ambas cosas a escala humana, con pulsos que se ven y se pueden cronometrar. La medida esconde además una propiedad poco conocida que convierte la práctica en una pequeña investigación.</p>

<section>
<h2>Fundamento físico</h2>
<p>Un pulso transversal en una cuerda o resorte sometido a la tensión \(T\), con masa por unidad de longitud \(\mu\), viaja con rapidez</p>
<div class="eq key" data-name="Rapidez en un medio tenso">\[v=\sqrt{\frac{T}{\mu}} .\]</div>
<p>Los resortes largos de juguete tienen una longitud natural muy pequeña frente a la estirada (sus espiras están en contacto y precargadas). Entonces la tensión es casi proporcional a la longitud, \(T\approx kL\), y la masa por unidad de longitud es \(\mu=M/L\), donde \(k\) y \(M\) son la constante y la masa del resorte completo:</p>
<div class="eq">\[v=\sqrt{\frac{kL}{M/L}}=L\sqrt{\frac kM}\qquad\Longrightarrow\qquad t=\frac Lv=\sqrt{\frac Mk}.\]</div>
<p>El pulso tarda lo mismo en recorrer el resorte estirado a 2 m que a 5 m, porque al estirarlo aumentan en la misma proporción la distancia y la rapidez. Esta propiedad, la del «resorte de longitud cero», aparece en artículos de enseñanza de la física dedicados al resorte de juguete y es una excelente pregunta de indagación.</p>
<p>En un extremo fijo, el resorte ejerce sobre el soporte una fuerza y el soporte devuelve una igual y opuesta: el pulso reflejado se invierte. En un extremo libre (atado a un hilo largo y liviano) vuelve sin invertirse. Cuando dos pulsos se cruzan, sus desplazamientos se suman (superposición) y después cada uno sigue su camino intacto.</p>
