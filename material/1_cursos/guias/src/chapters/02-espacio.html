<p class="lead">Una buena guía fracasa en un salón sin tomas seguras, sin agua o con cuarenta estudiantes alrededor de una mesa. La norma técnica colombiana de instalaciones escolares fija lo que un laboratorio debe tener; el Ministerio de Educación publicó además la dotación de referencia. Este capítulo resume ambas y da herramientas para verificar un espacio real o adaptar uno que no fue diseñado para experimentar.</p>

<section>
<h2>El laboratorio es un ambiente tipo C</h2>
<p>La <b>NTC 4595:2025</b> (quinta edición, «Planeamiento y diseño para instalaciones y ambientes escolares», ratificada por el Consejo Directivo de ICONTEC el 19 de noviembre de 2025) clasifica los ambientes pedagógicos de la A a la F. Los laboratorios de ciencias pertenecen al <b>tipo C</b>: lugares de trabajo individual, en grupos pequeños de dos a seis personas y en grupos de hasta cuarenta, «con un empleo intensivo de equipos e instalaciones», con altas especificaciones de seguridad, alta demanda de aseo y áreas importantes para almacenar y exhibir materiales.</p>
<div class="tablewrap"><table>
<tr><th>Ambiente tipo C (Tabla 8 de la NTC 4595:2025)</th><th class="c">Área mínima por estudiante</th></tr>
<tr><td>Laboratorio de física</td><td class="c">2,2 m²</td></tr>
<tr><td>Laboratorio de ciencias naturales o biología</td><td class="c">2,2 m²</td></tr>
<tr><td>Laboratorio de química</td><td class="c">2,2 m²</td></tr>
<tr><td>Laboratorio integrado (física, química y biología en un mismo espacio)</td><td class="c">2,5 m²</td></tr>
<tr><td>Aula de TIC</td><td class="c">2,2 m²</td></tr>
</table></div>
<p>Los valores son para grupos de cuarenta. Los ambientes de menor capacidad deben aumentar el área por estudiante en 0,1 m² por cada diez estudiantes menos (numeral 5.3.3.2): un laboratorio de física para treinta estudiantes necesita 2,3 m² por estudiante, es decir, 69 m². El área incluye las mesas de trabajo, el puesto del docente, el tablero o monitor, un terminal con acceso a internet, el almacenamiento y la exhibición, y un cubículo para un grupo reducido; además debe permitir que una persona en silla de ruedas llegue a un puesto de trabajo en grupo.</p>
<div class="box warn"><h4>Alcance de la norma</h4><p>Según su numeral 1.1, la NTC 4595 establece los requisitos para el planeamiento y el diseño de <b>nuevas</b> instalaciones escolares, y puede usarse para evaluar y adaptar las existentes en el marco de la NTC 6705 (planes de infraestructura escolar). En un edificio antiguo es, por tanto, la referencia para diagnosticar y priorizar mejoras: el docente no puede ampliar el salón, pero sí ajustar el número de estudiantes por sesión, la distribución de las mesas y el tipo de práctica.</p></div>
</section>

<section>
<h2>Instalaciones y distribución</h2>
<p>La norma da requisitos precisos para los ambientes tipo C. Los que más afectan al laboratorio de física son:</p>
<div class="tablewrap"><table>
<tr><th>Aspecto</th><th>Requisito</th><th class="c">Numeral</th></tr>
<tr><td>Tomacorrientes</td><td>Tomas con protección diferencial de falla a tierra (GFCI) en los mesones y las áreas húmedas; su número equivale a la tercera parte de los estudiantes que caben en el recinto. Diseño eléctrico según RETIE y RETILAP vigentes.</td><td class="c">7.2, 7.2.1.1.2</td></tr>
<tr><td>Agua</td><td>Un punto hidráulico con poceta por cada grupo de trabajo (de dos a seis personas) y al menos una poceta adicional con ducha de emergencia, equidistante y cercana.</td><td class="c">7.6.3</td></tr>
<tr><td>Gas y aire</td><td>En los ambientes C de experimentación, al menos una salida de gas propano o natural y una de aire a presión, con evaluación de la ventilación según la NTC 3631.</td><td class="c">7.7.3</td></tr>
<tr><td>Ventilación</td><td>Ventilación natural con aberturas de entrada y de salida distribuidas en las superficies que delimitan el espacio; extractores si hay máquinas que producen polvo o vapores.</td><td class="c">8.3.2.4, 6.3.4.3</td></tr>
<tr><td>Iluminación</td><td>Salas de prácticas y laboratorios: iluminancia media de 500 lx, uniformidad 0,60, índice de reproducción cromática 80 y deslumbramiento UGR ≤ 19; controlable.</td><td class="c">Tabla 16</td></tr>
<tr><td>Distribución</td><td>Al menos 1,4 m entre bancos o mesas de trabajo y 1,2 m entre un banco y la pared.</td><td class="c">9.4.7</td></tr>
<tr><td>Almacenamiento</td><td>Distancia mínima entre trabajo y almacenamiento; sustancias altamente combustibles en almacenamientos exteriores; cuarto de preparación con ducha de emergencia y lavaojos.</td><td class="c">9.4.7</td></tr>
<tr><td>Protección contra incendio</td><td>Extintores en las áreas de laboratorio y taller, según el reglamento sismorresistente (NSR) vigente.</td><td class="c">9.4.7</td></tr>
<tr><td>Acabados</td><td>Muros lavables; pisos y paredes resistentes al agua en los ambientes C.</td><td class="c">9.6.1.2</td></tr>
<tr><td>Accesibilidad, señalización y alarma</td><td>Libre desplazamiento de estudiantes con movilidad reducida; timbres visuales y sonoros que sirvan de alarma; señalización según la NTC 4596.</td><td class="c">6.3.4.1</td></tr>
</table></div>
<p>El dimensionador aplica estas reglas a un salón concreto: calcula el área exigida, cuenta los mesones que caben respetando las distancias y dice cuántas tomas con GFCI y cuántas pocetas hacen falta.</p>
<div class="sim" data-sim="dimensionador" data-kind="Herramienta" data-title="Dimensionador de un laboratorio según la NTC 4595:2025"></div>
<div class="sim-guide"><ul>
<li>Un salón de 8 m × 9 m (72 m²) alcanza para 30 estudiantes (2,3 m² cada uno), pero no para 40 (88 m²).</li>
<li>Con mesones de 1,6 m × 0,8 m para cuatro estudiantes y las separaciones de la norma, compruebe si caben los grupos que necesita; gire los mesones para comparar.</li>
</ul></div>
<h3>Cuántas luminarias hacen falta</h3>
<p>El método de los lúmenes estima el número de luminarias que da una iluminancia media \(E\) sobre el plano de trabajo de área \(A\):</p>
<div class="eq">\[N=\frac{E\,A}{\Phi\;C_U\;F_M},\qquad K=\frac{L\,W}{h_m\,(L+W)},\]</div>
<p>donde \(\Phi\) es el flujo de cada luminaria, \(C_U\) el coeficiente de utilización (lo da el fabricante en función del índice del local \(K\) y de las reflectancias), \(F_M\) el factor de mantenimiento y \(h_m\) la altura de la luminaria sobre el plano de trabajo. Es una estimación; el diseño definitivo lo hace un profesional con el RETILAP.</p>

<h2>La dotación de referencia del Ministerio</h2>
<p>El <i>Manual de Dotaciones</i> del Ministerio de Educación (diciembre de 2015, Plan Nacional de Infraestructura Educativa) describe el <b>laboratorio integrado de física y química de secundaria para 40 usuarios</b>: diez mesones de cuatro estudiantes, cuarenta butacos, tres muebles móviles, dos muebles de almacenamiento, un tablero de marcador borrable y un tándem de canecas. Las fichas técnicas exigen, entre otras cosas, que la superficie del mesón resista hasta 120 °C sin deformarse, soporte 150 kg y no tenga filos ni puntas.</p>

<section>
<h2>Cuando no hay laboratorio</h2>
<p>Muchas sedes, sobre todo rurales, no tienen un ambiente tipo C. El trabajo experimental sigue siendo posible y exigible; cambian el formato y las precauciones:</p>
<ul>
<li><b>Cajas por equipo.</b> Cada grupo recibe una caja plástica rotulada con los materiales de la práctica y la lista de chequeo (apéndice B). Se arma y se devuelve en la misma clase; el inventario se verifica al recibirla.</li>
<li><b>Solo muy baja tensión.</b> En un aula común no hay tomas con GFCI en las mesas: todas las prácticas eléctricas se hacen con pilas o con fuentes de 12 V o menos, como recomienda el capítulo 3.</li>
<li><b>Agua afuera.</b> Las prácticas de fluidos (Torricelli, hidrostática, cubeta de ondas) se hacen en el patio o junto a un lavadero, con baldes y trapos.</li>
<li><b>El celular como laboratorio.</b> Un teléfono con la aplicación gratuita phyphox reemplaza cronómetros, sensores de aceleración, de campo magnético, de presión, de luz y de sonido (capítulo 12).</li>
<li><b>Multigrado.</b> En sedes de Escuela Nueva, la misma práctica sirve a varios grados cambiando el nivel de indagación: estructurada para los menores, guiada o abierta para 10.° y 11.°.</li>
</ul>
</section>

<section>
<h2>Financiación, inventario y mantenimiento</h2>
<p>Los establecimientos oficiales administran sus recursos a través de los <b>Fondos de Servicios Educativos</b>. El Decreto 1075 de 2015 (artículo 2.3.1.6.3.11) permite usarlos en dotaciones pedagógicas como mobiliario, textos, libros, material didáctico y audiovisual, y en el mantenimiento y la reparación de los bienes muebles, siempre que guarden relación estricta con el PEI. Por eso conviene que el plan de área declare las prácticas y que el docente entregue al consejo directivo una lista de compras con cantidades, costos y la práctica que justifica cada elemento; las fichas del cuaderno traen esa información.</p>
<p>Un laboratorio se mantiene con tres registros sencillos (formatos en el apéndice B):</p>
<ol>
<li><b>Inventario</b> con código, descripción, cantidad, estado y ubicación de cada elemento.</li>
<li><b>Hoja de vida</b> de los equipos de medida: fecha de compra, calibraciones o comparaciones, reparaciones y resolución.</li>
<li><b>Registro de préstamo</b> por sesión, firmado por el monitor de cada grupo.</li>
</ol>
