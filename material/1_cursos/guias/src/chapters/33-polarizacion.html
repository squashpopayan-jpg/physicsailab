<p class="lead">La polarización es el fenómeno ondulatorio que el DBA 1 de 11.° nombra y que casi nunca se mide en el colegio. Basta una pantalla de computador, que ya emite luz polarizada, una lámina polarizadora y el sensor de luz del celular. En una hora se comprueba la ley de Malus y se tiene un argumento directo de que la luz es una onda transversal.</p>

<section>
<h2>Fundamento físico</h2>
<p>En la luz polarizada linealmente, el campo eléctrico oscila en una dirección fija perpendicular a la propagación. Un polarizador ideal transmite solo la componente del campo paralela a su eje: si el eje forma un ángulo \(\theta\) con la polarización, el campo transmitido es \(E_0\cos\theta\) y, como la intensidad es proporcional al cuadrado del campo,</p>
<div class="eq key" data-name="Ley de Malus">\[I=I_0\cos^2\theta+I_f ,\]</div>
<p>donde se agregó la luz de fondo \(I_f\) que alcanza al sensor. La gráfica de \(I\) contra \(\cos^2\theta\) es una recta de pendiente \(I_0\). Un polarizador real no bloquea del todo la luz cruzada: su razón de extinción \(I_{mín}/I_{máx}\) es pequeña pero no nula.</p>
<p>Las pantallas de cristal líquido funcionan con dos polarizadores cruzados y una capa de cristal líquido que gira la polarización en cada píxel; la luz que sale ya pasó por el polarizador frontal. Si entre dos polarizadores cruzados se coloca un tercero a 45°, pasa luz: \(I=I_0\cos^2 45°\cos^2 45°=I_0/4\). Las ondas longitudinales, como el sonido en el aire, no se pueden polarizar.</p>
</section>
