<p class="lead">Un montaje casero bien hecho mide tan bien como uno comercial si se respetan tres principios: rigidez donde el instrumento lo exige, fricción baja donde el modelo la desprecia y escalas verificadas. Este capítulo reúne los materiales, las herramientas y seis piezas básicas que se reutilizan en casi todas las prácticas del cuaderno.</p>

<h2>Seis piezas básicas reutilizables</h2>
<h3>1. Soporte universal casero</h3>
<p>Base de pino de 30 cm × 20 cm × 2 cm con una varilla roscada de 3/8 pulgada y 60 cm de largo, fijada con dos tuercas y arandelas a través de un agujero central. El brazo es un listón de 25 cm con un agujero pasante y una tuerca de mariposa que permite subirlo, bajarlo y girarlo. Con una prensa en C se fija a la mesa.</p>

<tr><th>Pieza</th><th class="c">Medidas</th><th class="c">Cantidad</th><th>Notas</th></tr>
<tr><td>Base de pino</td><td class="c">300 × 200 × 20 mm</td><td class="c">1</td><td>Agujero central de 10 mm a 60 mm de un borde</td></tr>

<h3>2. Riel de rodadura</h3>
<p>Un perfil de aluminio en U de 1/2 pulgada y 1,5 m, o un riel de cortina, es un canal recto donde una canica o una esfera de acero rueda sin salirse. Se apoya en tacos de madera para fijar la inclinación, que se mide con el celular (inclinómetro de phyphox) o con la altura de los apoyos.</p>
<h3>3. Polea de baja fricción</h3>
<p>Un rodamiento de patineta (referencia 608: 8 mm de agujero, 22 mm de diámetro exterior) atornillado a un listón, con dos CD pegados a su anillo exterior, forma una polea de 6 cm de radio que gira libremente. Su momento de inercia equivale a unos 16 g en el movimiento del hilo; el banco de abajo muestra cuánto afecta eso a la segunda ley y cuánto peor es un carrete sobre un clavo.</p>
<h3>4. Escalas impresas</h3>
<p>Reglas, transportadores y cuadrículas se imprimen en cartulina. Las impresoras escalan sin avisar: imprima siempre una regla de control de 10 cm y mídala con un flexómetro; si mide 9,7 cm, la escala tiene un error de 3 % que se corrige o se informa.</p>
<h3>5. Plomada y nivel</h3>
<p>Una tuerca colgada de un hilo da la vertical; el inclinómetro del celular o un nivel de burbuja, la horizontal. Toda práctica de rodadura o de caída empieza nivelando la mesa.</p>
<h3>6. Banderas y pantallas</h3>
<p>Tarjetas rectangulares de ancho conocido (medido con calibrador) que interrumpen una fotopuerta, y pantallas de cartulina blanca mate para el láser y las lentes.</p>

<h2>Rigidez: ¿cuánto se dobla un soporte?</h2>
<p>Un brazo de longitud \(L\), sección rectangular de ancho \(b\) y altura \(h\), empotrado en un extremo y con una carga \(F\) en el otro, se flecha</p>
<div class="eq">\[\delta=\frac{FL^3}{3EI}=\frac{4FL^3}{E\,b\,h^3},\]</div>
<p>donde \(E\) es el módulo de elasticidad del material. La flecha crece con el cubo de la longitud y disminuye con el cubo del espesor: poner un listón «de canto» en vez de plano lo hace varias veces más rígido. En un péndulo, un soporte que se flecha absorbe energía y cambia el periodo; en una práctica de fuerzas, falsea la medida.</p>

<h3>El costo de una mala polea</h3>
<p>En la práctica de segunda ley, un carro de masa \(M\) es arrastrado por una masa colgante \(m\) a través de una polea de radio \(r\), momento de inercia \(I\) y torque de fricción \(\tau_f\):</p>
<div class="eq">\[a=\frac{mg-\tau_f/r}{M+m+I/r^2}.\]</div>

<section>
<h2>Inventario y hoja de vida</h2>
<p>Cada montaje construido recibe un código (por ejemplo, SOP-01 para el primer soporte) y una hoja de vida con fecha de construcción, materiales, medidas críticas verificadas (longitud de la regla, ancho de la bandera, radio de la polea), reparaciones y prácticas en las que se usa. Los formatos están en el apéndice B. Un montaje documentado sobrevive al cambio de docente; uno sin documentar se pierde en la primera mudanza de salón.</p>
