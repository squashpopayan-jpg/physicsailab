<p class="lead">El plano inclinado es la práctica fundacional de la física experimental. Retoma el DBA 1 de 9.° (describir el movimiento con gráficas y ecuaciones) y lo lleva al DBA 1 de 10.° (relacionar la aceleración con las fuerzas). Su sorpresa didáctica es que la esfera baja más despacio de lo que predice la fórmula del bloque: la diferencia es física y se puede calcular.</p>

<section>
<h2>Fundamento físico</h2>
<p>Un bloque que desliza sin fricción por un plano de inclinación \(\theta\) acelera con \(g\operatorname{sen}\theta\). Una esfera de masa \(m\) y radio \(r\) que rueda sin deslizar reparte la energía entre traslación y rotación: \(mgh=\tfrac12mv^2+\tfrac12I\omega^2\). Si rueda sobre un plano, \(\omega=v/r\) e \(I=\tfrac25mr^2\). Si rueda en un canal que la toca por dos bordes separados una distancia \(w\), el radio de rodadura es menor, \(r_e=\sqrt{r^2-w^2/4}\), y la esfera debe girar más rápido para avanzar lo mismo:</p>
<div class="eq key" data-name="Rodadura en un canal">\[a=\frac{g\operatorname{sen}\theta}{1+\beta},\qquad \beta=\frac{I}{mr_e^2}=\frac{2}{5}\,\frac{r^2}{r^2-w^2/4}.\]</div>
<p>Para una esfera de 19 mm en un canal de 11 mm, \(\beta=0{,}60\); para una canica de 16 mm en un riel de cortina de 8 mm, \(\beta=0{,}53\); sobre un plano, \(\beta=0{,}40\). Partiendo del reposo en \(t_0\),</p>
<div class="eq">\[x=\tfrac12a(t-t_0)^2\quad\Longrightarrow\quad\sqrt{x}=\sqrt{a/2}\;(t-t_0),\]</div>
<p>de modo que la gráfica de \(\sqrt x\) contra \(t\) es una recta cuya pendiente da \(a\) y cuyo corte con el eje da el instante de partida, que en el video nunca se conoce con exactitud. La fricción de rodadura, con un coeficiente \(c_r\) del orden de 0,001 para acero sobre aluminio, resta \(c_r\,g\cos\theta/(1+\beta)\) a la aceleración: unos pocos por ciento con inclinaciones de 2°.</p>
</section>

<h3>Construcción paso a paso</h3>
<!--F:movimiento:montaje-->
<div class="box note"><h4>El riel de cortina</h4><p>Los rieles de cortina de aluminio son baratos, rectos y tienen un canal donde una canica rueda sin salirse. Midan el ancho entre los bordes donde se apoya la canica con un calibrador: es el \(w\) de la fórmula y explica una parte grande de la diferencia con \(g\operatorname{sen}\theta\).</p></div>
</section>

<div class="sim-guide"><ul>
<li>Con «Serie completa» y la gráfica \(\sqrt x\)–\(t\), los puntos caen sobre una recta; la aceleración resultante coincide con \(g\operatorname{sen}\theta/(1+\beta)\) y no con \(g\operatorname{sen}\theta\).</li>
<li>Cambie el objeto: el bloque sin fricción no rueda (\(\beta=0\)) y baja más rápido; la esfera en el canal angosto es la más lenta.</li>
<li>Pase a 240 cuadros por segundo: la dispersión baja, pero el sesgo por la fricción de rodadura sigue ahí.</li>
</ul></div>
<div class="box ex"><h4>Resultados esperados (validados)</h4><p>Con un desnivel de 5 cm en 1,5 m (\(\operatorname{sen}\theta=0{,}0333\)) y \(g=9{,}776\) m/s²: \(g\operatorname{sen}\theta=0{,}326\) m/s²; esfera sobre plano, 0,233 m/s²; canica en riel de cortina, 0,213 m/s²; esfera de 19 mm en canal de 11 mm, 0,203 m/s², que recorre 1,4 m en 3,71 s. Con \(c_r=0{,}0008\) la última baja a 0,199 m/s².</p></div>
