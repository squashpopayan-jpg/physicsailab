<p class="lead">El DBA 3 de 11.° es el más concreto de los de física: pide determinar corrientes y voltajes con la ley de Ohm, identificar configuraciones y «predecir los cambios de iluminación en bombillos resistivos» al quitar o agregar componentes. La investigación educativa (McDermott y Shaffer, 1992) mostró que esa predicción es difícil incluso para universitarios; por eso la práctica empieza por predecirla y la verifica con potencias medidas.</p>

<section>
<h2>Fundamento físico</h2>
<p>Un conductor es óhmico si la corriente es proporcional al voltaje, \(V=IR\) con \(R\) constante. El filamento de tungsteno de un bombillo incandescente no lo es: su resistividad crece con la temperatura, que a su vez crece con la potencia. Para un bombillo de linterna de 2,5 V y 0,3 A la relación medida se describe bien con una ley de potencia empírica, \(I=I_n(V/V_n)^{0{,}55}\), que usa el banco virtual.</p>
<p>Las reglas de Kirchhoff resumen la conservación de la carga (la suma de corrientes que entran a un nodo es igual a la que sale) y de la energía (la suma de voltajes en un lazo cerrado es cero). De ellas salen las reglas de serie y paralelo. El brillo de un bombillo depende de la potencia que disipa, \(P=VI\).</p>
<h3>El circuito mixto del DBA</h3>
<p>Con el bombillo A en serie con el paralelo de B y C, toda la corriente pasa por A y se divide entre B y C: A disipa mucho más. Si se quita B, la resistencia del paralelo aumenta (solo queda C), la corriente total baja (A se atenúa) y el voltaje en C sube (C brilla más). La pila real tiene una fem \(\varepsilon\) y una resistencia interna \(r\):</p>
<div class="eq key" data-name="Pila real">\[V_{terminales}=\varepsilon-I\,r .\]</div>
</section>
