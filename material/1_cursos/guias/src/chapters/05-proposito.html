<p class="lead">Durante décadas se asumió que hacer experimentos enseña física por sí solo. La investigación educativa encontró algo más incómodo: muchas prácticas mantienen ocupadas las manos pero no la cabeza. Antes de escribir una guía conviene decidir qué debe aprender el estudiante con ella; de esa decisión dependen el tipo de práctica, el nivel de apertura y la forma de evaluar.</p>

<section>
<h2>Lo que dice la investigación</h2>
<ul>
<li><b>Hodson (1994)</b>, en un artículo muy citado en lengua española, sostuvo que el trabajo de laboratorio se usaba de forma poco reflexiva: se le atribuían a la vez la motivación, el aprendizaje de conceptos, de técnicas y de la naturaleza de la ciencia, sin diseñar las prácticas para ninguno de esos fines en particular.</li>
<li><b>Hofstein y Lunetta (2004)</b> revisaron veinte años de estudios y concluyeron que el laboratorio tiene un potencial único para el aprendizaje, siempre que las actividades se diseñen con objetivos claros y que los estudiantes tengan oportunidades de pensar, discutir y reflexionar sobre lo que hacen.</li>
<li><b>Abrahams y Millar (2008)</b> observaron 25 clases de ciencias en Inglaterra: el trabajo práctico era eficaz para que los estudiantes hicieran lo previsto con los objetos, pero mucho menos para que pensaran con las ideas científicas. La distinción entre «manos a la obra» y «mentes a la obra» resume el hallazgo.</li>
<li><b>López Rúa y Tamayo Alzate (2012)</b>, en un estudio en Colombia, caracterizaron las prácticas de laboratorio de un programa de formación de docentes de biología y química: predominaban las prácticas tipo receta, que llevan a un resultado predeterminado y transmiten una imagen distorsionada de la ciencia.</li>
<li><b>Holmes y Wieman (2018)</b> compararon cursos de laboratorio de física universitaria y encontraron que las prácticas que buscan confirmar teoría no mejoran el aprendizaje de los conceptos; las que se enfocan en tomar decisiones con datos (comparar, mejorar el experimento, volver a medir) sí desarrollan habilidades de experimentación.</li>
</ul>
<p>La conclusión práctica es clara: una guía debe declarar un propósito principal y diseñar la actividad para él. Repetir el procedimiento de un libro para «comprobar una ley» es el propósito más débil de todos.</p>
</section>

<section>
<h2>Siete propósitos posibles</h2>
<p>El informe <i>America's Lab Report</i> del Consejo Nacional de Investigación de Estados Unidos (2006) propuso siete metas para el laboratorio escolar, que coinciden con las columnas de los estándares colombianos:</p>
<div class="tablewrap"><table>
<tr><th>Meta</th><th>Relación con los estándares de 10.° y 11.°</th><th>Ejemplo en el cuaderno</th></tr>
<tr><td>Dominar el contenido disciplinar</td><td>Columna «manejo conocimientos»: F1 a F11</td><td>Predecir con el modelo del péndulo y comprobar</td></tr>
<tr><td>Desarrollar el razonamiento científico</td><td>C2, C3, C4, C12: hipótesis, variables, modelos</td><td>Diseñar el control de variables en la fricción</td></tr>
<tr><td>Comprender la complejidad y la ambigüedad del trabajo empírico</td><td>C14, C15: error experimental y conclusiones con resultados inesperados</td><td>Discrepancia del tubo de Torricelli por la contracción del chorro</td></tr>
<tr><td>Desarrollar destrezas prácticas</td><td>C5, C6, C7: medir, registrar sin alterar</td><td>Usar el calibrador, el multímetro y el video</td></tr>
<tr><td>Comprender la naturaleza de la ciencia</td><td>C8, C9 y S3: descripción, explicación, modelo, ley; los modelos cambian</td><td>Ley de Ohm frente a bombillos que no la cumplen</td></tr>
<tr><td>Cultivar el interés</td><td>Compromisos personales y sociales</td><td>Medir la gravedad del propio municipio</td></tr>
<tr><td>Trabajar en equipo</td><td>S1, S2, S4</td><td>Roles rotativos en todas las prácticas</td></tr>
</table></div>
</section>

<section>
<h2>Cuatro tipos de trabajo práctico</h2>
<p>Caamaño (2003) clasifica los trabajos prácticos por su finalidad. La clasificación ayuda a no pedirle a una práctica más de lo que puede dar:</p>
<div class="tablewrap"><table>
<tr><th>Tipo</th><th>Finalidad</th><th>Ejemplo</th></tr>
<tr><td><b>Experiencias</b></td><td>Familiarizarse perceptivamente con un fenómeno.</td><td>Sentir el empuje al sumergir una botella; ver las franjas de un CD.</td></tr>
<tr><td><b>Experimentos ilustrativos</b></td><td>Ejemplificar un principio o una relación, a menudo cualitativamente.</td><td>Oersted: la brújula se desvía junto al cable.</td></tr>
<tr><td><b>Ejercicios prácticos</b></td><td>Aprender un procedimiento o una destreza, o corroborar una teoría.</td><td>Medir densidades con su incertidumbre; usar el multímetro.</td></tr>
<tr><td><b>Investigaciones</b></td><td>Resolver un problema teórico o práctico, diseñando el procedimiento.</td><td>¿Cómo medir la gravedad del municipio con la mejor precisión posible?</td></tr>
</table></div>
<p>Un buen plan de laboratorio combina los cuatro: experiencias para despertar preguntas, ejercicios para dominar la medición e investigaciones para usar todo lo anterior.</p>
</section>

<section>
<h2>Niveles de indagación</h2>
<p>Schwab (1962) y Herron (1971) propusieron graduar la apertura de una práctica según quién aporta la pregunta, el procedimiento y la respuesta. Banchi y Bell (2008) popularizaron cuatro niveles que el cuaderno usa en todas las guías:</p>
<div class="tablewrap"><table>
<tr><th class="c">Nivel</th><th>Nombre</th><th class="c">Pregunta</th><th class="c">Procedimiento</th><th class="c">Resultado</th></tr>
<tr><td class="c">0</td><td>Confirmación</td><td class="c">Docente</td><td class="c">Docente</td><td class="c">Conocido</td></tr>
<tr><td class="c">1</td><td>Estructurada</td><td class="c">Docente</td><td class="c">Docente</td><td class="c">Estudiante</td></tr>
<tr><td class="c">2</td><td>Guiada</td><td class="c">Docente</td><td class="c">Estudiante</td><td class="c">Estudiante</td></tr>
<tr><td class="c">3</td><td>Abierta</td><td class="c">Estudiante</td><td class="c">Estudiante</td><td class="c">Estudiante</td></tr>
</table></div>
<p>Ningún nivel es mejor en abstracto. Un grupo que nunca ha medido con incertidumbre aprende más con una práctica estructurada que con una abierta que lo desborda; el mismo grupo, seis meses después, aprende más con una guiada. La progresión dentro del año es la estrategia más sólida: el cuaderno sugiere un nivel para cada práctica y el generador produce la guía en cualquiera de los cuatro.</p>
<div class="sim" data-sim="abrir-guia" data-kind="Herramienta" data-title="La misma práctica en los cuatro niveles de indagación"></div>
<div class="sim-guide"><ul>
<li>Compare los niveles 1 y 2: el montaje y el procedimiento se reemplazan por preguntas orientadoras y renglones para que el equipo escriba su plan. La seguridad nunca se abre: se entrega siempre.</li>
<li>En el nivel 3 desaparece incluso la pregunta: la guía plantea una situación y el equipo formula su propia investigación, que el docente aprueba antes de medir.</li>
</ul></div>
</section>

<section>
<h2>Enfoques didácticos que funcionan en el laboratorio</h2>
<h3>Predecir, observar, explicar (POE)</h3>
<p>White y Gunstone (1992) propusieron una secuencia simple: antes de la experiencia, el estudiante predice y justifica por escrito; luego observa; finalmente explica las diferencias entre lo que predijo y lo que vio. El conflicto entre predicción y observación hace visibles las ideas previas. Todas las guías del cuaderno incluyen una predicción antes de medir.</p>
<h3>Enseñanza de las ciencias basada en la indagación (ECBI)</h3>
<p>En Colombia la ECBI se difundió con el programa Pequeños Científicos, iniciativa de varias instituciones liderada por la Universidad de los Andes que durante más de una década formó docentes en el trabajo por indagación en el aula. Su secuencia (focalización, exploración, reflexión y aplicación) se adapta bien a la media con prácticas guiadas.</p>
<h3>Ambiente de aprendizaje ISLE</h3>
<p>Etkina y Van Heuvelen desarrollaron el <i>Investigative Science Learning Environment</i>, en el que los estudiantes construyen las ideas como lo hacen los científicos, con tres tipos de experimentos: de <b>observación</b> (buscar regularidades sin teoría previa), de <b>prueba</b> (predecir con una hipótesis y ver si falla) y de <b>aplicación</b> (usar lo aprendido para resolver un problema práctico). Una práctica del cuaderno se puede reorganizar así: observar cómo cambia el periodo del péndulo, poner a prueba la hipótesis de que no depende de la masa, aplicar el modelo para medir \(g\).</p>
<h3>El laboratorio como investigación</h3>
<p>Gil Pérez y Valdés Castro (1996) propusieron orientar las prácticas como pequeñas investigaciones: plantear situaciones problemáticas abiertas, emitir hipótesis, diseñar, analizar y comunicar, en lugar de seguir recetas. Es la base de los niveles 2 y 3.</p>
<h3>V de Gowin</h3>
<p>Novak y Gowin (1984) propusieron un diagrama en forma de V para conectar el lado conceptual (teorías, conceptos, principios) con el lado metodológico (registros, transformaciones, afirmaciones de conocimiento) alrededor de una pregunta central y de los acontecimientos observados. Es un buen formato de informe corto para 10.°; el capítulo siguiente trae una plantilla.</p>
</section>

<section>
<h2>Real, virtual y remoto</h2>
<p>Las simulaciones interactivas, como las del proyecto PhET de la Universidad de Colorado (Wieman, Adams y Perkins, 2008), permiten variar parámetros imposibles de controlar en el aula y ver lo invisible: el campo, las moléculas, la corriente. No reemplazan la medición real, que es la única que enseña a lidiar con el ruido, la resolución, los errores sistemáticos y los imprevistos. El cuaderno usa los bancos virtuales con tres fines: preparar la clase, mostrar el efecto de un error antes de cometerlo y ofrecer datos realistas cuando una práctica no se puede montar. En todos ellos los datos llevan ruido de instrumentos reales.</p>
<p>Para investigaciones abiertas que se extienden más allá del curso, el <b>Programa Ondas</b> de Minciencias acompaña desde 2001 a grupos de investigación escolares en todo el país.</p>
