<p class="lead">Este montaje enseña la lección más importante de la metrología: repetir reduce la dispersión, pero no corrige los errores sistemáticos. La fotopuerta y el reloj del Arduino son tan precisos que la incertidumbre aleatoria del promedio de varias caídas cae a centésimas de por ciento, y entonces aparece, dominante, la escala de una valla impresa. Corregirla permite plantear una pregunta ambiciosa: ¿se nota la diferencia de gravedad entre dos ciudades?</p>

<section>
<h2>Fundamento físico</h2>
<p>La valla cae libremente con \(x(t)=x_0+v_0t+\tfrac12gt^2\). Sus franjas, separadas \(s\), cruzan el haz en los instantes \(t_i\). La velocidad media en cada intervalo es la velocidad instantánea en el instante medio, exactamente para un movimiento uniformemente acelerado:</p>
<div class="eq key" data-name="Valla en caída libre">\[\bar v_i=\frac{s}{t_{i+1}-t_i}=v_0+g\,\frac{t_i+t_{i+1}}{2}.\]</div>
<p>La gráfica de \(\bar v_i\) contra el tiempo medio es una recta de pendiente \(g\). Sus incertidumbres provienen de: la resolución del reloj (4 µs en el Arduino Uno), la posición de cada borde impreso (décimas de milímetro), la escala global de la valla (que multiplica todas las distancias y por tanto \(g\)), la inclinación de la valla y la resistencia del aire. Esta última es despreciable para una tira de acrílico que cae 30 cm.</p>
<p>La gravedad de referencia del municipio se estima en el apéndice A con la fórmula WGS84 y una corrección por altura, con incertidumbre de modelo del orden de 1 mm/s² en las ciudades andinas. Entre Bogotá (9,774 m/s²) y Barranquilla (9,782 m/s²) la diferencia es de 0,08 %.</p>
</section>
