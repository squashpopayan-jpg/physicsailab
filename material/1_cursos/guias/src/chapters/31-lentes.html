<p class="lead">Una lupa de papelería y una linterna convierten la mesa en un banco óptico. La práctica pone a prueba la ecuación de las lentes delgadas, enseña que «la imagen nítida» no es un punto sino un intervalo (la profundidad de enfoque) y compara dos métodos de medir la distancia focal, uno de los cuales, el de Bessel, es mucho más preciso de lo que parece.</p>

<section>
<h2>Fundamento físico</h2>
<p>Una lente delgada convergente de distancia focal \(f\) forma, de un objeto a la distancia \(s_o&gt;f\), una imagen real e invertida a la distancia \(s_i\) dada por</p>
<div class="eq key" data-name="Lente delgada">\[\frac1{s_o}+\frac1{s_i}=\frac1f,\qquad M=-\frac{s_i}{s_o}.\]</div>
<p>La relación es lineal entre los inversos: \(1/s_i=-1/s_o+1/f\). La pendiente debe ser −1, una prueba del modelo, y el intercepto da \(1/f\).</p>
<h3>Método de Bessel</h3>
<p>Si el objeto y la pantalla se fijan a una distancia \(D&gt;4f\), hay dos posiciones de la lente que forman imagen nítida, simétricas respecto del punto medio y separadas una distancia \(d\). De \(s_o+s_i=D\) y la ecuación de la lente se obtiene</p>
<div class="eq">\[f=\frac{D^2-d^2}{4D}.\]</div>
<p>El método solo requiere medir dos distancias que no dependen de dónde está «el centro» de la lente, y por eso es menos sensible a su espesor.</p>
</section>
