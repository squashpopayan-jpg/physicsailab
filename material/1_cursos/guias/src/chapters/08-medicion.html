<p class="lead">El estándar de 10.° y 11.° pide al estudiante interpretar sus resultados «teniendo en cuenta el orden de magnitud del error experimental». Para eso no basta con calcular un porcentaje de error contra el libro: hay que estimar cuánto puede valer la incertidumbre de lo que se midió. Este capítulo resume, en el nivel adecuado para la media, el lenguaje y los métodos internacionales de la metrología.</p>

<section>
<h2>El Sistema Internacional, unidad legal en Colombia</h2>
<p>Colombia adoptó el sistema métrico decimal con la Ley 33 de 1905; el Decreto 1731 de 1967 declaró obligatorio el sistema de unidades y el Decreto 3464 de 1980 reiteró la obligatoriedad del Sistema Internacional (SI) y definió sus unidades básicas y derivadas. La norma técnica que lo desarrolla es la NTC 1000, y el Instituto Nacional de Metrología (INM) custodia los patrones nacionales. Desde 2019 las siete unidades básicas se definen fijando el valor exacto de siete constantes, entre ellas la velocidad de la luz, la constante de Planck y la carga elemental.</p>
<h3>Cómo se escriben las cantidades</h3>
<div class="tablewrap"><table>
<tr><th>Regla</th><th>Correcto</th><th>Incorrecto</th></tr>
<tr><td>Los símbolos no llevan punto ni plural</td><td>5 m, 20 s, 3 kg</td><td>5 mts., 20 seg, 3 kgs</td></tr>
<tr><td>Espacio entre el número y el símbolo (también con °C y %)</td><td>25 °C, 12 %</td><td>25°C, 12%</td></tr>
<tr><td>Mayúsculas y minúsculas tienen significado</td><td>km, kPa, mA, MΩ</td><td>Km, KPa, ma</td></tr>
<tr><td>Separador decimal: coma o punto (en Colombia es usual la coma); los miles se agrupan con espacio</td><td>9,776 m/s²; 101 325 Pa</td><td>101.325,0 Pa</td></tr>
<tr><td>Unidades compuestas con punto medio o barra única</td><td>N·m, m/s²</td><td>m/s/s</td></tr>
<tr><td>Ángulos en grados o radianes según el cálculo</td><td>sen 10° = sen 0,1745 rad</td><td>sen 10 (en modo radianes)</td></tr>
</table></div>
</section>

<section>
<h2>El vocabulario de la medición</h2>
<p>El <i>Vocabulario Internacional de Metrología</i> (VIM, JCGM 200:2012) fija el significado de las palabras que se usan sin cuidado en el aula:</p>
<ul>
<li><span class="term">Mensurando</span>: la magnitud que se quiere medir (el periodo de este péndulo, no «el tiempo»).</li>
<li><span class="term">Error de medida</span>: diferencia entre el valor medido y el valor de referencia. Casi nunca se conoce.</li>
<li><span class="term">Incertidumbre de medida</span>: parámetro que caracteriza la dispersión de los valores que pueden atribuirse razonablemente al mensurando. Siempre se puede estimar.</li>
<li><span class="term">Veracidad</span> (cercanía del promedio al valor de referencia) y <span class="term">precisión</span> (cercanía entre medidas repetidas). La <span class="term">exactitud</span> combina las dos.</li>
<li><span class="term">Resolución</span>: la menor variación que el instrumento indica (1 mm en un flexómetro, 0,01 s en un cronómetro).</li>
<li><span class="term">Error sistemático</span>: el que se repite igual en todas las medidas (un flexómetro estirado, el tiempo de reacción que siempre retrasa la parada). No se reduce repitiendo.</li>
<li><span class="term">Calibración</span> y <span class="term">trazabilidad</span>: comparar el instrumento con un patrón cuya relación con el SI está documentada.</li>
</ul>
</section>

<section>
<h2>Estimar la incertidumbre (GUM)</h2>
<p>La <i>Guía para la expresión de la incertidumbre de medida</i> (GUM, JCGM 100:2008) distingue dos maneras de evaluar cada componente:</p>
<div class="box def"><h4>Tipo A: con estadística</h4><p>Con \(n\) medidas repetidas \(x_i\), el mejor valor es el promedio \(\bar x\) y su incertidumbre estándar es la desviación estándar experimental dividida entre la raíz del número de medidas:</p>
<div class="eq">\[s=\sqrt{\frac{\sum (x_i-\bar x)^2}{n-1}},\qquad u_A=\frac{s}{\sqrt n}.\]</div></div>
<div class="box def"><h4>Tipo B: con otra información</h4><p>Resolución del instrumento, especificaciones del fabricante, certificados de calibración, experiencia. Si la lectura puede estar en cualquier punto de un intervalo de semiancho \(a\) con igual probabilidad (distribución rectangular), \(u_B=a/\sqrt3\). Para un instrumento digital de resolución \(r\), \(a=r/2\) y</p>
<div class="eq">\[u_B=\frac{r}{\sqrt{12}}\approx0{,}29\,r .\]</div>
<p>Un multímetro especificado como «± (0,5 % de la lectura + 2 dígitos)» da \(a=0{,}005\,|x|+2r\) y \(u_B=a/\sqrt3\).</p></div>
<p>Las componentes independientes se combinan en cuadratura y, para comunicar el resultado con un nivel de confianza cercano al 95 %, se multiplica por un factor de cobertura \(k=2\):</p>
<div class="eq key" data-name="Incertidumbre combinada y expandida">\[u_c=\sqrt{u_A^2+u_B^2+\cdots},\qquad U=k\,u_c,\quad k=2 .\]</div>
<p>El resultado se escribe con la incertidumbre redondeada a una o dos cifras significativas y el valor redondeado en la misma posición decimal: \(T=(1{,}801\pm0{,}013)\) s con \(u\) estándar, o \(T=(1{,}801\pm0{,}026)\) s con \(U\) para \(k=2\), diciendo cuál se usa.</p>
<div class="sim" data-sim="dispersion" data-kind="Simulación" data-title="Medidas repetidas: por qué el promedio es mejor que una medida"></div>
<div class="sim-guide"><ul>
<li>La desviación estándar \(s\) describe la dispersión de las medidas y casi no cambia con \(n\); la incertidumbre del promedio \(s/\sqrt n\) sí disminuye.</li>
<li>Pasar de 4 a 16 medidas reduce la incertidumbre a la mitad: repetir tiene rendimientos decrecientes y no corrige los errores sistemáticos.</li>
</ul></div>
</section>

<section>
<h2>Propagar la incertidumbre</h2>
<p>Si el resultado \(y=f(x_1,x_2,\dots)\) se calcula con magnitudes independientes, su incertidumbre combinada es</p>
<div class="eq">\[u_y^2=\sum_i\left(\frac{\partial f}{\partial x_i}\right)^2u_{x_i}^2 .\]</div>
<p>De aquí salen tres reglas que bastan para casi todas las prácticas de la media:</p>
<div class="tablewrap"><table>
<tr><th>Operación</th><th>Regla</th><th>Ejemplo</th></tr>
<tr><td>Suma o resta</td><td>\(u_y^2=u_a^2+u_b^2\)</td><td>Alargamiento \(x=\ell-\ell_0\)</td></tr>
<tr><td>Producto o cociente</td><td>\((u_y/y)^2=(u_a/a)^2+(u_b/b)^2\)</td><td>Velocidad \(v=d/t\)</td></tr>
<tr><td>Potencia \(y=a^n\)</td><td>\(u_y/y=|n|\,u_a/a\)</td><td>\(T^2\), área \(\pi d^2/4\)</td></tr>
</table></div>
<p>La densidad de un cilindro, \(\rho=4m/(\pi d^2h)\), combina las tres: \((u_\rho/\rho)^2=(u_m/m)^2+(2u_d/d)^2+(u_h/h)^2\). El diámetro pesa el doble porque aparece al cuadrado: es el que conviene medir con el mejor instrumento.</p>
<div class="sim" data-sim="propagacion" data-kind="Herramienta" data-title="Presupuesto de incertidumbre de la densidad de un cilindro"></div>
<div class="sim-guide"><ul>
<li>Con regla de 1 mm para el diámetro, esa contribución domina; con calibrador de 0,05 mm pasa a ser menor que la de la masa.</li>
<li>La simulación de Monte Carlo (10 000 cilindros virtuales) confirma la fórmula de propagación: los dos valores de \(u_\rho\) coinciden.</li>
</ul></div>
</section>

<section>
<h2>Cronometrar fenómenos rápidos</h2>
<p>El tiempo de reacción humano al iniciar y detener un cronómetro tiene una dispersión de unos 0,05 s a 0,1 s por pulsación, y un sesgo que se cancela en parte porque se comete al iniciar y al detener. Para un periodo de 1,5 s, una medida manual de un solo periodo tiene una incertidumbre del 8 %; cronometrar diez periodos la reduce diez veces. Las alternativas son el video, cuya resolución es el intervalo entre cuadros (33 ms a 30 cuadros por segundo, 4 ms a 240), y las fotopuertas, que llegan a microsegundos (capítulo 13).</p>

<section>
<h2>Comparar dos resultados</h2>
<p>El «porcentaje de error» respecto del valor del libro no dice si la diferencia es grande o pequeña frente a la incertidumbre. La comparación correcta usa la diferencia normalizada:</p>
<div class="eq key" data-name="Compatibilidad">\[z=\frac{|x_1-x_2|}{\sqrt{u_1^2+u_2^2}} .\]</div>
<p>Con incertidumbres estándar, \(z\le 2\) indica que los resultados son compatibles; entre 2 y 3 el resultado es dudoso y conviene revisar o medir más; por encima de 3 hay una diferencia real que pide explicación (un error sistemático, un modelo incompleto). Holmes, Wieman y Bonn (2015) usan esta misma comparación para que los estudiantes decidan cómo mejorar un experimento. Los bancos virtuales del cuaderno muestran \(z\) en cada resultado.</p>
<div class="box warn"><h4>Un resultado incompatible no es un fracaso</h4><p>El estándar pide sacar conclusiones «aunque no obtenga los resultados esperados». Si \(z>3\), el informe debe buscar la causa: casi siempre es un error sistemático identificable (amplitud grande, longitud mal medida, fricción no considerada) o una aproximación del modelo que no se cumple. Ese análisis vale más en la rúbrica que un resultado que coincide por casualidad.</p></div>
