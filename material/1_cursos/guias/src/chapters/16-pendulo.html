<p class="lead">Un hilo, una tuerca y un cronómetro bastan para medir la gravedad del municipio con un error del orden del uno por ciento. La práctica enseña además tres hábitos que sirven para todo el laboratorio: cambiar una variable a la vez, medir muchas repeticiones de un fenómeno rápido y convertir una relación curva en una recta.</p>

<section>
<h2>Fundamento físico</h2>
<p>Una masa puntual colgada de un hilo inextensible de longitud \(L\) y separada un ángulo \(\theta\) de la vertical siente una fuerza restauradora \(-mg\operatorname{sen}\theta\) a lo largo de su trayectoria. La segunda ley da</p>
<div class="eq">\[\ddt{\theta}{t}=-\frac{g}{L}\operatorname{sen}\theta .\]</div>
<p>Para ángulos pequeños \(\operatorname{sen}\theta\approx\theta\) (a 10° el error es de 0,5 %) y la ecuación es la de un oscilador armónico con periodo</p>
<div class="eq key" data-name="Péndulo simple">\[T_0=2\pi\sqrt{\frac{L}{g}}\qquad\Longrightarrow\qquad T_0^{2}=\frac{4\pi^{2}}{g}\,L .\]</div>
<p>El periodo no depende de la masa ni de la amplitud: es la propiedad que Galileo notó y Huygens aprovechó para construir el reloj de péndulo en 1656. La segunda forma es la clave del análisis: \(T^2\) es proporcional a \(L\), y la pendiente de la recta da \(g\).</p>
<h3>Dos correcciones que el docente debe conocer</h3>
<p><b>Amplitud.</b> Sin aproximar, el periodo vale \(T=\tfrac{2}{\pi}K(k^2)\,T_0\) con \(k=\operatorname{sen}(\theta_0/2)\) y \(K\) la integral elíptica completa de primera especie. Su desarrollo es \(T\approx T_0\,(1+\theta_0^{2}/16+11\theta_0^{4}/3072)\): 0,19 % a 10°, 0,77 % a 20° y 1,74 % a 30°.</p>
<p><b>Tamaño de la masa.</b> Una esfera de radio \(r\) cuyo centro está a \(L\) del punto de suspensión es un péndulo físico de momento de inercia \(m(L^2+\tfrac25r^2)\); su periodo equivale al de un péndulo simple de longitud \(L+\tfrac{2r^2}{5L}\). Para una tuerca de 1 cm de radio y \(L=0{,}5\) m la corrección del periodo es 0,008 %: despreciable frente al cronometraje manual.</p>
<div class="box note"><h4>Energía mecánica (DBA 10.2)</h4><p>Al soltar la masa desde la altura \(h=L(1-\cos\theta_0)\), la energía potencial \(mgh\) se convierte en cinética en el punto más bajo: \(v_{\max}=\sqrt{2gL(1-\cos\theta_0)}\). La amplitud decrece lentamente porque el rozamiento con el aire y la flexión del hilo disipan energía. Con estas dos ideas la práctica cubre los dos enunciados de evidencia del DBA: predecir el movimiento con la conservación de la energía e identificar las transformaciones en un sistema no conservativo.</p></div>
</section>

<h3>Construcción paso a paso</h3>

<div class="box note"><h4>Por qué la pinza de ropa</h4><p>Si el hilo se amarra a una varilla redonda, el punto de giro se desplaza al oscilar y la longitud efectiva cambia con el ángulo. Una arista firme (la boca de la pinza, dos tablitas apretadas o una cuchilla) fija el punto de suspensión. Es el mismo principio de los péndulos de reloj, que cuelgan de una lámina de acero delgada.</p></div>

<section>
<h2>Banco virtual: ensayo antes de la clase</h2>
<p>El banco reproduce la práctica con el modelo exacto (sin la aproximación de ángulos pequeños) y con los errores reales de cada forma de cronometrar. La gravedad de referencia es la del municipio elegido arriba, en la barra superior. Úselo para preparar la clase: elegir longitudes, prever cuánto se desvían los datos y mostrar el efecto de los errores típicos.</p>
<div class="sim" data-sim="pendulo-banco" data-kind="Banco virtual" data-title="Péndulo simple: periodo, linealización y gravedad local"></div>
<div class="sim-guide"><ul>
<li>Pulse «Serie completa» con cronómetro manual y 10 oscilaciones: el ajuste de \(T^2\) contra \(L\) da \(g\) con 1 % a 2 % de incertidumbre, compatible con la referencia.</li>
<li>Cambie a 1 oscilación: la dispersión crece unas diez veces. Con fotopuerta, una sola oscilación ya basta.</li>
<li>Suba la amplitud a 40° y repita la serie: la recta sigue siendo recta, pero su pendiente crece y \(g\) sale baja de forma sistemática; el indicador de compatibilidad lo delata.</li>
<li>Active «Medir L hasta el borde de la masa»: el valor de \(g\) casi no cambia, pero el intercepto se vuelve positivo. Es la huella de un error constante en \(L\).</li>
</ul></div>
<div class="box ex"><h4>Resultados esperados (validados)</h4><p>Con la gravedad de Popayán, \(g=9{,}776\) m/s², la pendiente teórica de \(T^2\) contra \(L\) es \(4\pi^2/g=4{,}038\) s²/m y un péndulo de 1,000 m tiene \(T_0=2{,}010\) s; a 10° el periodo real es 2,013 s. En Bogotá (\(g=9{,}774\)) el mismo péndulo oscila con 2,010 s y en Barranquilla (\(g=9{,}782\)) con 2,009 s: la diferencia entre ciudades es menor que la precisión del cronometraje manual. El apéndice D contrasta estos valores con la integral elíptica calculada en SciPy.</p></div>
</section>
