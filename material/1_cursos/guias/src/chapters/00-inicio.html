<div class="home-howto">
  <div><b>1 · Elija su municipio</b><p>El selector de la barra superior fija la gravedad, la presión, la temperatura de ebullición y el campo magnético que usan los bancos virtuales. Las 32 capitales vienen calculadas; cualquier otro municipio se agrega en el apéndice A.</p></div>
  <div><b>2 · Planee con la norma</b><p>Las partes I y II ubican cada práctica en los DBA, los estándares y la prueba Saber 11.°, verifican el espacio contra la NTC 4595:2025 y enseñan a escribir guías con el nivel de apertura que el grupo necesita.</p></div>
  <div><b>3 · Construya y ensaye</b><p>La parte III enseña a fabricar y calibrar equipos. Cada práctica trae materiales con costos de referencia, montaje paso a paso, matriz de riesgos con la GTC 45 y un banco virtual con los errores reales de medida.</p></div>
  <div><b>4 · Genere la guía</b><p>El generador arma la guía del estudiante en Word con los datos de su institución, en el nivel de indagación que elija, lista para editar, imprimir o compartir con los estudiantes.</p></div>
