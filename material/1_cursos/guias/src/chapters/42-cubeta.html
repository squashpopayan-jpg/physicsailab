<p class="lead">La cubeta de ondas es el instrumento que mejor muestra los cuatro fenómenos que el DBA 1 de 11.° nombra para la luz y el sonido. Se arma con una refractaria de cocina y una linterna, y su generador de ondas es el mismo parlante del experimento de Melde. Bien construida, permite además medir la relación entre longitud de onda y frecuencia y descubrir que el agua no es un medio sencillo.</p>

<section>
<h2>Fundamento físico</h2>
<p>Las ondas en la superficie del agua de profundidad \(h\) obedecen la relación de dispersión (Lamb, 1932):</p>
<div class="eq key" data-name="Ondas en agua">\[\omega^2=\left(gk+\frac{\sigma k^3}{\rho}\right)\tanh(kh),\qquad k=\frac{2\pi}{\lambda},\quad \omega=2\pi f ,\]</div>
<p>con \(\sigma=0{,}0728\) N/m la tensión superficial del agua. Cuando la longitud de onda es grande frente a la profundidad y a la longitud capilar (unos 2,7 mm para el agua), \(v=\omega/k\approx\sqrt{gh}\): las ondas son más lentas donde el agua es menos profunda. A frecuencias altas domina la tensión superficial y la rapidez vuelve a crecer.</p>
<p>Al desarrollar la relación para \(kh\) pequeño, \(v^2\approx gh\left[1+k^2h^2\left(\frac{\sigma}{\rho g h^2}-\frac13\right)\right]\): el término que deforma los pulsos se anula cuando \(h=\sqrt{3\sigma/(\rho g)}\approx 4{,}7\) mm. Por eso se recomienda trabajar con unos 5 mm de agua: todas las frecuencias viajan casi con la misma rapidez \(\sqrt{gh}\).</p>
<p>Si un frente de onda llega oblicuamente al borde de una zona menos profunda, la parte que entra primero se frena y el frente gira: es la refracción, con \(\operatorname{sen}\theta_1/\operatorname{sen}\theta_2=v_1/v_2=\lambda_1/\lambda_2\). Al pasar por una rendija de ancho comparable a \(\lambda\), el frente se curva (difracción); dos fuentes en fase producen líneas nodales donde las ondas llegan en oposición (interferencia).</p>
<p>La linterna proyecta la sombra de las crestas, que actúan como lentes convergentes: la imagen en la hoja está ampliada en un factor \(D/(D-d)\), con \(D\) la distancia de la linterna a la hoja y \(d\) la del agua a la hoja.</p>
</section>
