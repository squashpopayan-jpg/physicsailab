<p class="lead">La calorimetría escolar suele fallar por un detalle que en Colombia es enorme: se supone que el agua hierve a 100 °C. En la mayoría de las ciudades andinas hierve entre 91 °C y 95 °C, y ese error se traslada completo al calor específico. Esta práctica usa el dato local, mide la capacidad del calorímetro y corrige las pérdidas con la ley de enfriamiento de Newton.</p>

<section>
<h2>Fundamento físico</h2>
<p>Una muestra de masa \(m_1\) y calor específico \(c_1\) a la temperatura \(T_1\) se sumerge en \(m_2\) de agua (\(c_2=4{,}182\) J/g·°C) a \(T_2\) dentro de un calorímetro de capacidad calorífica \(C_{cal}\). Si no hay pérdidas, el calor cedido es igual al recibido:</p>
<div class="eq key" data-name="Método de las mezclas">\[m_1c_1(T_1-T_e)=(m_2c_2+C_{cal})(T_e-T_2)\quad\Longrightarrow\quad c_1=\frac{(m_2c_2+C_{cal})(T_e-T_2)}{m_1(T_1-T_e)} .\]</div>
<p>La temperatura inicial de la muestra es la del agua hirviendo, que depende de la presión atmosférica local. El cuaderno la calcula para cada municipio con la ecuación de Antoine, contrastada con la formulación IAPWS-95:</p>
<div class="tablewrap"><table>
<tr><th>Ciudad</th><th class="c">Altitud (m)</th><th class="c">Presión media (hPa)</th><th class="c">Ebullición del agua (°C)</th></tr>
<tr><td>Barranquilla</td><td class="c">18</td><td class="c">1010</td><td class="c">99,9</td></tr>
<tr><td>Cali</td><td class="c">1018</td><td class="c">900</td><td class="c">96,7</td></tr>
<tr><td>Medellín</td><td class="c">1495</td><td class="c">851</td><td class="c">95,2</td></tr>
<tr><td>Popayán</td><td class="c">1737</td><td class="c">827</td><td class="c">94,4</td></tr>
<tr><td>Pasto</td><td class="c">2527</td><td class="c">753</td><td class="c">91,9</td></tr>
<tr><td>Bogotá</td><td class="c">2640</td><td class="c">743</td><td class="c">91,5</td></tr>
</table></div>
<p>El calorímetro no es perfecto: la mezcla, más caliente que el ambiente, se enfría según la ley de Newton, \(\dd T/\dd t=-(T-T_a)/\tau\), con \(\tau\) de decenas de minutos para dos vasos de icopor con tapa. Como la mezcla tarda unos segundos en uniformizarse, la temperatura máxima leída es un poco menor que la que habría sin pérdidas; se corrige ajustando una recta al tramo final de la curva y extrapolándola al instante de la mezcla.</p>
</section>
