<p class="lead">La segunda ley de Newton es fácil de enunciar y difícil de poner a prueba: en un experimento real la fuerza neta incluye la fricción y la masa incluye la de la polea. La práctica usa un truco clásico (pasar masa del carro al portapesas) para variar la fuerza sin variar la masa, y convierte los efectos indeseados en información: la fricción aparece en el intercepto y la polea en la pendiente.</p>

<h2>Fundamento físico</h2>
<p>El sistema formado por el carro (con las arandelas que lleva) y la masa colgante \(m\) tiene masa total \(M_t\), constante si las arandelas solo cambian de lugar. La fuerza externa neta en la dirección del movimiento es el peso de la masa colgante menos las fricciones; la polea de radio \(r\) y momento de inercia \(I\) añade una masa efectiva \(I/r^2\) y un torque de fricción \(\tau_f\). Con un coeficiente de resistencia a la rodadura \(\mu_r\) para las ruedas del carro,</p>
<div class="eq key" data-name="Segunda ley con polea real">\[a=\frac{mg-\mu_r(M_t-m)g-\tau_f/r}{M_t+I/r^2}.\]</div>
<p>Como función de \(F=mg\), es una recta de pendiente \((1+\mu_r)/(M_t+I/r^2)\) que corta el eje de la fuerza en \(F_0=(\mu_rM_tg+\tau_f/r)/(1+\mu_r)\), la fuerza mínima para que el carro se mueva. La tercera ley aparece en el hilo: la tensión que tira del carro es menor que \(mg\) porque la masa colgante también acelera, \(T=m(g-a)\).</p>
<h3>Tres formas de medir la aceleración</h3>
<ul>
<li><b>Cronómetro:</b> \(a=2d/t^2\) desde el reposo. Con \(d=80\) cm y tiempos de 1 a 2 s, el tiempo de reacción produce errores del 10 % al 20 % por medida: se necesitan muchas repeticiones.</li>
<li><b>Video:</b> la posición cuadro a cuadro y el ajuste de \(\sqrt{x}\) contra \(t\) (práctica F10-02).</li>
<li><b>Acelerómetro del celular:</b> phyphox registra la aceleración del carro directamente. Hay que sumar la masa del celular al sistema y promediar la aceleración en el tramo de movimiento uniforme acelerado.</li>
</ul>
</section>
