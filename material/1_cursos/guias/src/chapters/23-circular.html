<p class="lead">Es uno de los experimentos clásicos del curso de física de bachillerato en muchos países, y sigue siendo de los mejores: el estudiante siente la tensión en la mano y ve que debe girar más rápido cuando cuelga más peso. Su análisis, además, tiene un detalle elegante: aunque la cuerda queda inclinada, la relación entre fuerza y periodo es exacta si se usa la longitud de la cuerda y no el radio.</p>

<section>
<h2>Fundamento físico</h2>
<p>El tapón de masa \(m\) gira con velocidad angular \(\omega=2\pi/P\) al extremo de una cuerda de longitud \(L\) que forma un ángulo \(\alpha\) con la horizontal. La tensión \(T\), igual al peso de la masa colgante \(Mg\) si el tubo no tiene fricción, tiene una componente vertical que sostiene el tapón y una horizontal que lo hace girar en un círculo de radio \(r=L\cos\alpha\):</p>
<div class="eq">\[T\operatorname{sen}\alpha=mg,\qquad T\cos\alpha=m\omega^2r=m\omega^2L\cos\alpha .\]</div>
<p>La segunda ecuación da \(T=m\omega^2L\) sin importar el ángulo. Con \(T=Mg\),</p>
<div class="eq key" data-name="Tapón que gira">\[P^2=\frac{4\pi^2 mL}{g}\,\frac{1}{M},\qquad \operatorname{sen}\alpha=\frac{m}{M}.\]</div>
<p>La cuerda nunca puede quedar horizontal porque algo debe sostener el peso del tapón; con \(M\) grande frente a \(m\) el ángulo es pequeño. El ángulo no entra en la relación entre periodo y masa colgante: por eso la práctica funciona aunque los estudiantes no logren un giro perfectamente horizontal.</p>
</section>
