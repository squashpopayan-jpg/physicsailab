<p class="lead">La segunda evidencia del DBA 1 de 11.° pide aplicar las leyes de reflexión y refracción «al incluir cambio de medio de propagación». Con un láser de baja potencia y un recipiente de agua se mide el índice de refracción con uno o dos por ciento de incertidumbre, y la reflexión total aparece como una consecuencia directa de la ley de Snell. Es también la práctica donde las reglas de seguridad del láser (capítulo 3) se aplican de verdad.</p>

<section>
<h2>Fundamento físico</h2>
<p>Cuando la luz llega a la frontera entre dos medios, parte se refleja con un ángulo igual al de incidencia y parte se transmite cambiando de dirección. La luz viaja más despacio en el medio de mayor índice, \(v=c/n\), y el principio de Huygens (o el de Fermat) conduce a la ley de Snell:</p>
<div class="eq key" data-name="Ley de Snell">\[n_1\operatorname{sen}\theta_1=n_2\operatorname{sen}\theta_2 .\]</div>
<p>Desde el aire (\(n_1\approx1\)), la gráfica de \(\operatorname{sen}\theta_1\) contra \(\operatorname{sen}\theta_2\) es una recta de pendiente \(n_2\). Si la luz va del medio de mayor índice al de menor, \(\operatorname{sen}\theta_2=(n_1/n_2)\operatorname{sen}\theta_1\) supera 1 cuando \(\theta_1&gt;\theta_c\) y no hay haz transmitido:</p>
<div class="eq">\[\theta_c=\arcsen\frac{n_2}{n_1}.\]</div>
<p>El índice depende un poco del color (dispersión): para el agua a 20 °C vale cerca de 1,331 con luz roja de 650 nm y 1,334 con verde de 532 nm (Daimon y Masumura, 2007). La reflexión parcial también depende del ángulo según las fórmulas de Fresnel: cerca del ángulo crítico el haz transmitido se debilita mucho antes de desaparecer, lo que dificulta la lectura exacta.</p>
</section>
