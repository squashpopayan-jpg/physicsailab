<p class="lead">Evaluar el laboratorio solo por el informe premia a quien escribe bien y castiga a quien midió bien. La norma colombiana da libertad a cada institución para definir cómo evalúa, siempre que lo haga de forma explícita, formativa y equivalente a la escala nacional; y exige que todos los estudiantes, con o sin discapacidad, participen de las mismas experiencias con los apoyos que necesiten. Este capítulo convierte esas dos exigencias en instrumentos concretos.</p>

<section>
<h2>La evaluación según el Decreto 1290 de 2009</h2>
<p>El Decreto 1290 de 2009, hoy compilado en el Decreto 1075 de 2015, reglamenta la evaluación del aprendizaje en la básica y la media. Sus ideas centrales para el laboratorio son:</p>
<ul>
<li><b>Propósitos formativos.</b> La evaluación sirve para identificar las características y los ritmos de aprendizaje, reorientar los procesos, diseñar estrategias de apoyo y determinar la promoción (art. 3). Una práctica bien evaluada informa qué debe repetirse o reforzarse.</li>
<li><b>Sistema institucional (SIEE).</b> Cada establecimiento define sus criterios, su escala, las estrategias de valoración integral, los procesos de autoevaluación de los estudiantes y las acciones de seguimiento (art. 4). Las rúbricas de laboratorio deben estar enmarcadas en el SIEE para tener peso real en la nota.</li>
<li><b>Escala nacional.</b> Cada institución adopta su propia escala, pero debe declarar su equivalencia con la nacional: desempeño <b>Superior</b>, <b>Alto</b>, <b>Básico</b> y <b>Bajo</b> (art. 5). El desempeño básico es la superación de los desempeños necesarios en relación con las áreas obligatorias, según los estándares, las orientaciones del Ministerio y el PEI; el bajo, su no superación.</li>
</ul>
<p>La escala numérica (por ejemplo, de 1,0 a 5,0) y los puntos de corte entre niveles los define cada SIEE; el calificador de este capítulo permite configurarlos.</p>
</section>

<section>
<h2>La rúbrica general del cuaderno</h2>
<p>Todas las guías generadas incluyen esta rúbrica de cinco criterios con los cuatro niveles de la escala nacional. Cada práctica puede añadir un criterio propio (el uso del modelo físico de esa práctica). Los criterios responden directamente a estándares de 10.° y 11.°: identificar variables (C3), medir con instrumentos adecuados (C5), registrar sin alterar (C7), modelar con matemáticas (C10), interpretar con el orden de magnitud del error (C14), sacar conclusiones aunque no se obtenga lo esperado (C15), comunicar (C18) y cumplir la función en el grupo (S4).</p>
<div class="tablewrap"><table class="rubrica" id="rubrica-general"><tr><th>Criterio</th><th>Bajo</th><th>Básico</th><th>Alto</th><th>Superior</th></tr>
<tr><th>Planeación y montaje</th><td>No identifica las variables; el montaje queda incompleto o inseguro.</td><td>Identifica con ayuda las variables independiente y dependiente; arma el montaje siguiendo instrucciones.</td><td>Identifica las variables y controla las que deben permanecer constantes; el montaje es correcto y seguro.</td><td>Justifica el diseño, anticipa fuentes de error y propone mejoras al montaje.</td></tr>
<tr><th>Medición y registro</th><td>Datos incompletos o sin unidades.</td><td>Tabla con unidades pero sin resolución ni incertidumbre.</td><td>Tabla completa con unidades y resolución; repite las medidas que lo requieren.</td><td>Estima incertidumbres tipo A y B y registra todo sin alterar los datos, incluidas las anomalías.</td></tr>
<tr><th>Análisis de datos</th><td>No grafica, o la gráfica no corresponde a los datos.</td><td>Gráfica con ejes rotulados y unidades; cálculo del resultado sin incertidumbre.</td><td>Linealiza cuando hace falta, ajusta la recta y obtiene el parámetro con su incertidumbre.</td><td>Evalúa el ajuste (residuos), compara con la referencia mediante la compatibilidad y explica la discrepancia.</td></tr>
<tr><th>Explicación y conclusión</th><td>Conclusión ausente o copiada.</td><td>Describe lo observado sin relacionarlo con el modelo.</td><td>Explica los resultados con el modelo físico y responde la pregunta de la práctica.</td><td>Argumenta con evidencia, reconoce los límites del modelo y formula nuevas preguntas.</td></tr>
<tr><th>Trabajo en equipo y seguridad</th><td>Incumple normas de seguridad o no participa.</td><td>Cumple las normas cuando se le recuerdan.</td><td>Cumple su rol y las normas sin recordatorios.</td><td>Cuida activamente al equipo, el espacio, los materiales y los residuos.</td></tr>
</table></div>
<div class="sim" data-sim="calificador" data-kind="Herramienta" data-title="De la rúbrica a la nota institucional y a la escala nacional"></div>
<div class="sim-guide"><ul>
<li>Ajuste la escala y los cortes de su SIEE. Los pesos permiten, por ejemplo, que el análisis valga el doble en 11.° que en 10.°.</li>
<li>La nota de cada criterio es el punto medio del intervalo de su nivel; así un estudiante con todos los criterios en «Básico» queda en el centro del desempeño básico, no en su borde.</li>
</ul></div>
<h3>Evaluar habilidades, no solo resultados</h3>
<p>La investigación en enseñanza de la física ha mostrado que las rúbricas de habilidades científicas, como las del grupo de Etkina y Van Heuvelen (2006), mejoran el trabajo de laboratorio cuando el estudiante las conoce desde el principio y recibe retroalimentación con ellas. Holmes, Wieman y Bonn (2015) mostraron además que pedir explícitamente comparar dos resultados con sus incertidumbres, decidir qué hacer y volver a medir desarrolla el pensamiento crítico mucho más que confirmar un valor conocido. Las guías del cuaderno incorporan ambas ideas: la rúbrica viaja dentro de la guía y el análisis termina siempre con una comparación cuantitativa.</p>
<h3>Instrumentos complementarios</h3>
<ul>
<li><b>Lista de chequeo de desempeño</b> durante la sesión: el docente marca, por equipo, montaje seguro, medidas repetidas, tabla con unidades.</li>
<li><b>Bitácora o cuaderno de laboratorio</b>: registro fechado y sin borrones de cada sesión; se revisa por muestreo.</li>
<li><b>Autoevaluación y coevaluación</b> del trabajo en equipo, previstas en el SIEE (art. 4 del Decreto 1290). El apéndice B trae un formato breve.</li>
<li><b>Pregunta tipo Saber 11.°</b> al cierre de cada práctica, que permite ver si el aprendizaje se transfiere a una situación escrita.</li>
</ul>
</section>

<section>
<h2>Roles en el equipo</h2>
<p>Los equipos de tres o cuatro estudiantes funcionan mejor con roles explícitos que rotan de una práctica a otra:</p>
<div class="tablewrap"><table>
<tr><th>Rol</th><th>Responsabilidades</th></tr>
<tr><td>Coordinación</td><td>Lee la guía en voz alta, controla el tiempo, consulta al docente en nombre del equipo.</td></tr>
<tr><td>Montaje y seguridad</td><td>Arma y desarma el montaje, verifica la lista de seguridad, cuida el material y los residuos.</td></tr>
<tr><td>Medición</td><td>Opera los instrumentos, anota la resolución, decide con el equipo cuántas repeticiones hacen falta.</td></tr>
<tr><td>Registro y análisis</td><td>Llena la tabla tal como se mide, hace la gráfica y lidera el análisis.</td></tr>
</table></div>
<p>En equipos de tres, coordinación y registro se fusionan. Los roles también son una herramienta de inclusión: permiten que cada estudiante aporte desde sus fortalezas y que los apoyos de un estudiante con discapacidad se integren a la dinámica del grupo.</p>
</section>

<section>
<h2>Inclusión: el Decreto 1421 de 2017</h2>
<p>El Decreto 1421 de 2017, compilado en el Decreto 1075 de 2015, reglamenta la atención educativa a la población con discapacidad en el marco de la educación inclusiva. Tres conceptos del decreto ordenan el trabajo del docente de laboratorio:</p>
<ul>
<li><b>Diseño Universal para el Aprendizaje (DUA).</b> Diseñar desde el principio actividades que todos puedan usar, sin adaptaciones posteriores: múltiples formas de presentar la información, de que el estudiante actúe y se exprese, y de comprometerlo con la tarea.</li>
<li><b>Ajustes razonables.</b> Acciones, adaptaciones, estrategias, apoyos, recursos o modificaciones necesarios y adecuados para que un estudiante concreto participe en igualdad de condiciones.</li>
<li><b>Plan Individual de Ajustes Razonables (PIAR).</b> Herramienta que registra los ajustes de cada estudiante con discapacidad, a partir de su valoración pedagógica y social. Cuando la planeación con DUA no basta, el PIAR precisa qué cambia en la práctica de laboratorio y cómo se evalúa.</li>
</ul>
<h3>Ajustes frecuentes en el laboratorio de física</h3>
<div class="tablewrap"><table>
<tr><th>Situación</th><th>Diseño universal (para todos)</th><th>Ajustes razonables posibles</th></tr>
<tr><td>Baja visión o ceguera</td><td>Guías digitales accesibles con lector de pantalla; tablas sencillas; descripciones verbales de gráficas.</td><td>Sonificación de datos (phyphox puede convertir una magnitud en tono); reglas con marcas táctiles; multímetro con voz; gráficas en relieve con hilo pegado sobre cartulina; un compañero que describe el montaje.</td></tr>
<tr><td>Sordera o hipoacusia</td><td>Instrucciones escritas y con imágenes; demostración visual antes de empezar.</td><td>Intérprete de lengua de señas colombiana; alarmas luminosas (la NTC 4595 exige timbres visuales); en prácticas de sonido, sensores que muestran la onda en pantalla y vibración del parlante.</td></tr>
<tr><td>Movilidad reducida</td><td>Pasillos de 1,4 m; materiales al alcance; un puesto accesible por laboratorio (NTC 4595, 5.3.3.2).</td><td>Mesón a la altura de la silla de ruedas; montajes fijados con prensa para que no requieran fuerza; rol de medición o de análisis.</td></tr>
<tr><td>Atención y funciones ejecutivas</td><td>Guías con pasos cortos numerados y casillas de verificación; tiempos visibles.</td><td>Lista de pasos individual; pausas; un rol con tareas concretas y cortas; retroalimentación inmediata.</td></tr>
<tr><td>Discapacidad intelectual</td><td>Nivel de indagación 0 o 1; lenguaje sencillo; ejemplos resueltos.</td><td>Objetivos ajustados en el PIAR (por ejemplo, medir y registrar con unidades); evaluación con la rúbrica adaptada.</td></tr>
<tr><td>Capacidades o talentos excepcionales</td><td>Extensiones en cada práctica.</td><td>Nivel de indagación 3; montajes elaborados de la parte VI; vinculación al programa Ondas o a ferias de ciencia.</td></tr>
</table></div>
<p>La diversidad no es solo discapacidad. En contextos étnicos y rurales conviene que la pregunta de la práctica parta de saberes y objetos locales (el péndulo del trapiche, el agua que sale de un tanque en la vereda, la radio del pueblo) y reconozca, como pide el estándar de compromisos personales, «los aportes de conocimientos diferentes al científico».</p>
