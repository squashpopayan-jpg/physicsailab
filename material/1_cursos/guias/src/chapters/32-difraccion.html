<p class="lead">La difracción es la prueba más directa de que la luz es una onda, y medirla no exige equipo de laboratorio: un CD viejo es una red con 625 pistas por milímetro. Con un láser y una regla se miden distancias de micrómetros, lo que impresiona a los estudiantes y desarrolla la tercera evidencia del DBA 1 de 11.° (explicar la interferencia y la difracción en casos prácticos).</p>

<section>
<h2>Fundamento físico</h2>
<p>Las pistas de un disco óptico son surcos en espiral separados una distancia \(d\) fija. La luz reflejada por cada pista interfiere con la de las demás, y solo en ciertas direcciones las ondas llegan en fase: las que difieren en un número entero de longitudes de onda. Con incidencia perpendicular,</p>
<div class="eq key" data-name="Ecuación de la red">\[d\operatorname{sen}\theta_m=m\lambda,\qquad \tan\theta_m=\frac{y_m}{D}.\]</div>
<p>Los órdenes existen mientras \(m\lambda/d\le1\). La especificación del CD (IEC 60908) fija \(d=1{,}6\) µm y la del DVD (ECMA-267), \(d=0{,}74\) µm. Con un láser rojo de 650 nm el CD muestra dos órdenes a cada lado y el DVD uno solo, muy desviado.</p>
<p>Un cabello de diámetro \(a\) produce, por el principio de Babinet, el mismo patrón que una rendija de igual ancho: mínimos de intensidad en \(a\operatorname{sen}\theta=m\lambda\). Para ángulos pequeños, las franjas oscuras en una pantalla a la distancia \(D\) quedan separadas</p>
<div class="eq">\[\Delta y=\frac{\lambda D}{a}.\]</div>
<p>Los punteros láser declaran una longitud de onda con tolerancia (a menudo ±10 nm): esa incertidumbre relativa se traslada directamente a \(d\) y a \(a\).</p>
</section>

<div class="sim-guide"><ul>
<li>Con el CD, los órdenes ±1 y ±2 aparecen en la pantalla; con el DVD, solo ±1 y mucho más afuera.</li>

<li>Con el cabello, la serie mide la posición de los mínimos hasta el orden 5; la pendiente de \(y\) contra el orden da \(\lambda D/a\).</li>
</ul></div>
