<p class="lead">Con un tubo de PVC, un balde con agua y el generador de tonos del celular se obtiene la velocidad del sonido con un error de uno o dos por ciento. La práctica desarrolla el DBA 1 de 11.° (el sonido como onda mecánica) y deja dos aprendizajes que suelen pasar inadvertidos: el antinodo no está exactamente en la boca del tubo, y la velocidad del sonido no depende de la altura sobre el nivel del mar sino de la temperatura.</p>

<section>
<h2>Fundamento físico</h2>
<p>En una columna de aire cerrada en un extremo (la superficie del agua) y abierta en el otro, las ondas estacionarias tienen un nodo de desplazamiento en el fondo y un antinodo cerca de la boca. Resuenan cuando la longitud efectiva es un número impar de cuartos de onda. El antinodo queda una distancia \(e\) por fuera de la boca; para un tubo sin pestaña de radio \(r\), Levine y Schwinger calcularon \(e=0{,}6133\,r\):</p>
<div class="eq key" data-name="Tubo de resonancia">\[L_n=(2n-1)\frac{\lambda}{4}-e,\qquad \lambda=2(L_2-L_1),\qquad L_1=\frac v4\,\frac1f-e .\]</div>
<p>Para un gas ideal la velocidad del sonido es \(v=\sqrt{\gamma RT/M}\): depende de la temperatura absoluta y no de la presión. Para aire seco (\(\gamma=1{,}4\), \(M=28{,}96\) g/mol) equivale a</p>
<div class="eq">\[v\approx331{,}3\sqrt{1+\frac{\theta}{273{,}15}}\ \text{m/s}\qquad(\theta\ \text{en °C}).\]</div>
<p>La humedad la aumenta ligeramente porque el vapor de agua es más liviano que el aire seco. En una ciudad fría y alta como Bogotá el sonido es más lento que en una costera, pero por la temperatura, no por la presión.</p>
