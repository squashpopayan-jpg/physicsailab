<p class="lead">La forma escolar habitual de medir el empuje, con un dinamómetro, depende de un instrumento poco preciso. Con el objeto colgado de un hilo dentro de un vaso puesto sobre una balanza de cocina, el empuje se lee directamente en gramos y con una resolución diez veces mejor. El montaje responde al estándar de fluidos en reposo (F6) y al de sus aplicaciones tecnológicas (T1).</p>

<h2>Fundamento físico</h2>
<p>En un líquido en reposo la presión crece con la profundidad, \(p=p_0+\rho_fgh\). Sobre un cuerpo sumergido, las presiones en su cara inferior superan a las de la superior y producen una fuerza neta hacia arriba igual al peso del líquido desalojado:</p>
<div class="eq key" data-name="Principio de Arquímedes">\[E=\rho_f\,V_{sum}\,g .\]</div>
<p>Si el cuerpo cuelga de un hilo dentro de un vaso que está sobre una balanza, el líquido recibe del cuerpo una fuerza hacia abajo igual al empuje (tercera ley), y la balanza marca un aumento \(\Delta m=E/g=\rho_fV_{sum}\). Para un cilindro de base \(A\) sumergido una profundidad \(y\),</p>
<div class="eq">\[\Delta m=\rho_f A\,y\quad(y\le h),\qquad \rho_{\text{sólido}}=\rho_f\,\frac{m}{\Delta m_{total}} .\]</div>
<p>La presión hidrostática se mide con un manómetro de tubo en U: la diferencia de nivel \(\Delta h\) del líquido manométrico de densidad \(\rho_m\) equilibra la presión a la profundidad \(h\): \(\rho_m g\,\Delta h=\rho_f g\,h\). Con agua en ambos lados, \(\Delta h=h\). Un dato local: la presión atmosférica no cambia esta diferencia, pero sí el valor absoluto, que en Popayán es de unos 827 hPa y en la costa de unos 1012 hPa (apéndice A).</p>
