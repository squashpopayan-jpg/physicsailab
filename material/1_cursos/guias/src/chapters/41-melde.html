<p class="lead">El experimento de Melde convierte una cuerda en un laboratorio de ondas: los armónicos aparecen uno tras otro al subir la frecuencia, cada uno con su número de vientres bien visible. El montaje elaborado usa un parlante pequeño con un amplificador de 5 V como vibrador, y el generador de tonos del celular como fuente de frecuencia conocida con décimas de hercio.</p>

<section>
<h2>Fundamento físico</h2>
<p>Una onda que viaja por la cuerda se refleja en la polea y vuelve; la superposición de la onda incidente y la reflejada forma una onda estacionaria si la longitud entre los extremos fijos contiene un número entero de medias longitudes de onda:</p>
<div class="eq key" data-name="Armónicos de una cuerda">\[L=n\frac{\lambda}{2}\qquad\Longrightarrow\qquad f_n=\frac{n}{2L}\sqrt{\frac{T}{\mu}},\qquad n=1,2,3,\dots\]</div>
<p>La tensión la fija la masa colgante, \(T=Mg\), y la densidad lineal \(\mu\) se mide pesando un tramo largo del mismo hilo. Dos linealizaciones ponen a prueba el modelo: \(f_n\) contra \(n\) (tensión fija) da una recta por el origen de pendiente \(v/(2L)\), y \(f\) contra \(\sqrt T\) (modo fijo) otra de pendiente \(n/(2L\sqrt\mu)\). El extremo del vibrador no es un nodo perfecto porque se mueve, pero su amplitud es muy pequeña frente a la de los vientres.</p>
