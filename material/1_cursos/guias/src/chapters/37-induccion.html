<p class="lead">La inducción completa el estándar que relaciona el campo eléctrico con el magnético y conecta con el de recursos energéticos: es el principio de todas las centrales del país. La primera parte no necesita instrumentos, solo un tubo de cobre y un imán, y siempre sorprende. La segunda mide los pulsos de fem con un Arduino y muestra una consecuencia elegante de la ley de Faraday.</p>

<section>
<h2>Fundamento físico</h2>
<p>Un imán pequeño se comporta como un dipolo de momento \(m\). El flujo de su campo a través de una espira de radio \(a\) cuyo eje pasa por el imán, a la distancia \(z\) de su plano, es</p>
<div class="eq">\[\Phi(z)=\frac{\mu_0\,m\,a^2}{2\,(a^2+z^2)^{3/2}} .\]</div>
<p>Si el imán se mueve con velocidad \(v\) a lo largo del eje, la ley de Faraday da la fem en una bobina de \(N\) vueltas:</p>
<div class="eq key" data-name="Imán que atraviesa una bobina">\[\varepsilon=-N\frac{\dd\Phi}{\dd t}=-N\frac{\dd\Phi}{\dd z}\,v,\qquad \int_{\text{pulso}}\varepsilon\,\dd t=N\,\Phi_{máx}=N\frac{\mu_0 m}{2a}.\]</div>
<p>La fem es máxima cuando el imán está a \(a/2\) del plano de la bobina, antes y después de cruzarla, con signos opuestos: al acercarse el flujo crece y al alejarse decrece (ley de Lenz). La altura del pulso crece con la rapidez, pero su área no, porque solo depende del cambio total de flujo. El momento de un imán de neodimio se estima con su remanencia \(B_r\) y su volumen: \(m=B_rV/\mu_0\).</p>
<p>En un tubo de cobre el flujo variable induce corrientes circulares en las paredes (corrientes de Foucault). Su campo se opone al movimiento y el imán alcanza enseguida una velocidad terminal pequeña: su energía potencial se disipa como calor en el cobre. MacLatchy, Backman y Bogan (1993) describen un experimento cuantitativo de este frenado.</p>
</section>
