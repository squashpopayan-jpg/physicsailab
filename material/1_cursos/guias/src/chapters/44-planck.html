<p class="lead">Medir la constante de Planck en un colegio parece imposible, pero un puñado de LED de colores lo permite con un error que va de unos pocos a algunas decenas por ciento, según los LED. La práctica vale tanto por el número como por la discusión: es un ejemplo excelente de un método con un error sistemático que los estudiantes pueden descubrir por sí mismos.</p>

<section>
<h2>Fundamento físico</h2>
<p>En un LED, los electrones que cruzan la unión entre dos semiconductores caen a estados de menor energía y emiten la diferencia como un fotón. La energía de la banda prohibida \(E_g\) fija el color, y la tensión que hay que aplicar para que la corriente sea apreciable es del orden de \(E_g/e\):</p>
<div class="eq key" data-name="Fotón y tensión del LED">\[E=hf=\frac{hc}{\lambda},\qquad eV\approx\frac{hc}{\lambda}\quad\Longrightarrow\quad V\approx\frac{hc}{e}\cdot\frac1\lambda .\]</div>
<p>La corriente de un diodo crece exponencialmente con la tensión, \(I\propto e^{eV/(\eta k_BT)}\), con un factor de idealidad \(\eta\) entre 1 y 2 o más. Por eso la «tensión de encendido» depende del criterio: aquí se usa la tensión a una corriente fija de 1 mA, igual para todos los LED. La relación \(eV\approx hc/\lambda\) es aproximada: cada material (AlGaInP para el rojo y el amarillo, InGaN para el verde, el azul y el violeta, GaAs para el infrarrojo) tiene su propio desfase, y la temperatura cambia la tensión unos milivoltios por grado.</p>
<div class="box law"><h4>Un valor exacto</h4><p>Desde el 20 de mayo de 2019, el SI fija \(h=6{,}626\,070\,15\times10^{-34}\) J·s exactamente, y con ese valor se define el kilogramo (BIPM, 9.ª edición del folleto del SI). Lo que el estudiante mide no es \(h\), sino la calidad de su método.</p></div>
</section>
