<p class="lead">Una práctica con una virtud rara: la predicción se pone a prueba sin cronómetro. Basta medir una altura y una distancia. El resultado, además, no depende de la gravedad ni de la masa, lo que la hace robusta en cualquier municipio. Y la primera predicción de los estudiantes (sin rotación) falla de forma clara y explicable, que es el mejor escenario para el DBA 2 de 10.°.</p>

<section>
<h2>Fundamento físico</h2>
<p>Una esfera que parte del reposo a una altura \(h\) sobre el extremo horizontal de la rampa llega a él con velocidad \(v\). Si rueda sin deslizar y no hay pérdidas,</p>
<div class="eq">\[mgh=\tfrac12mv^2+\tfrac12I\omega^2=\tfrac12mv^2(1+\beta)\qquad\Longrightarrow\qquad v=\sqrt{\frac{2gh}{1+\beta}},\]</div>
<p>con \(\beta=I/(mr_e^2)\) igual a 2/5 sobre un plano y mayor en un canal (práctica F10-02). Desde la mesa de altura \(H\) la esfera tarda \(t=\sqrt{2H/g}\) en caer y recorre horizontalmente \(D=vt\):</p>
<div class="eq key" data-name="Alcance tras una rampa">\[D=2\sqrt{\frac{hH}{1+\beta}}\qquad\Longrightarrow\qquad D^2=\frac{4H}{1+\beta}\,h .\]</div>
<p>La gravedad se cancela: el alcance depende solo de las alturas y de la forma del objeto. Una recta \(D^2\)–\(h\) que pase por el origen confirma el modelo; su pendiente da \(\beta\). Las pérdidas en la curva de la rampa y por rodadura se ven como un factor \(\eta&lt;1\) que multiplica \(h\).</p>
<div class="box note"><h4>Sistemas no conservativos (DBA 10.2)</h4><p>La segunda evidencia del DBA pide identificar las transformaciones de energía en sistemas con fricción y choques. Aquí la energía potencial se transforma en cinética de traslación, cinética de rotación, y una pequeña parte en energía térmica y sonora en la rampa; al caer, el choque con el piso disipa casi toda la energía restante.</p></div>
</section>
