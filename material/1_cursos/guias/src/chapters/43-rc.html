<section>
<h2>Fundamento físico</h2>
<p>En la descarga, la corriente que sale del condensador pasa por la resistencia: \(I=-C\,\mathrm dV/\mathrm dt=V/R\). La solución es una exponencial:</p>
<div class="eq key" data-name="Descarga RC">\[V(t)=V_0\,e^{-t/\tau},\qquad \tau=RC,\qquad \ln V=\ln V_0-\frac{t}{\tau},\qquad t_{1/2}=\tau\ln 2 .\]</div>
<p>En la carga desde una fuente de fuerza electromotriz \(\varepsilon\), \(V(t)=\varepsilon\left(1-e^{-t/\tau}\right)\). Un voltímetro de resistencia interna \(R_m\) conectado en paralelo con el condensador cambia el circuito: por el teorema de Thévenin, el condensador ve una fuente de \(\varepsilon\,R_m/(R+R_m)\) con resistencia \(R\parallel R_m\), de modo que</p>
<div class="eq">\[\tau'=\frac{R\,R_m}{R+R_m}\,C,\qquad V_\infty=\varepsilon\,\frac{R_m}{R+R_m}.\]</div>
<p>Con un multímetro digital (\(R_m=10\) MΩ) y \(R=47\) kΩ el efecto es de 0,5 %; con \(R=1\) MΩ ya es del 9 %. Los electrolíticos tienen además una corriente de fuga que las hojas de datos suelen limitar a \(0{,}01\,CV\) µA (C en µF y V en voltios) después de 2 minutos; actúa como otra resistencia en paralelo y es la razón para no usar resistencias mayores de 1 MΩ con ellos.</p>
<div class="box warn"><h4>Nunca condensadores recuperados</h4><p>Los condensadores de fuentes conmutadas, televisores, hornos microondas y flashes de cámara pueden conservar cientos de voltios durante horas. En el colegio solo se usan componentes nuevos de baja tensión, y cada condensador se descarga a través de una resistencia antes de guardarse.</p></div>
</section>

<div class="box ex"><h4>Resultados esperados (validados)</h4><p>9,0 V, 47 kΩ y 1000 µF con multímetro de 10 MΩ: \(\tau'=46{,}8\) s, \(V_\infty=8{,}96\) V, \(V(47\text{ s})=3{,}30\) V en la descarga y \(t_{1/2}=32{,}4\) s. Con voltímetro analógico de 200 kΩ: \(\tau'=38{,}1\) s y \(V_\infty=7{,}29\) V. Con 1 MΩ y 100 µF: \(\tau'=90{,}9\) s y \(V_\infty=8{,}18\) V.</p></div>
