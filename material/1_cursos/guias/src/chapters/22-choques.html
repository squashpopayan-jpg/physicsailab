<section>
<h2>Fundamento físico</h2>
<p>Una pelota soltada desde \(h_0\) llega al piso con rapidez \(v_0=\sqrt{2gh_0}\) y sale con \(e\,v_0\), donde \(e\) es el coeficiente de restitución. Sube y vuelve a caer en un tiempo \(2ev_0/g\). Después del \(n\)-ésimo golpe,</p>
<div class="eq key" data-name="Tiempos entre rebotes">\[\Delta t_n=2e^n\sqrt{\frac{2h_0}{g}},\qquad \ln\Delta t_n=n\ln e+\ln\!\Big(2\sqrt{2h_0/g}\Big),\qquad h_n=\frac{g\,\Delta t_n^2}{8}.\]</div>
<p>La gráfica de \(\ln\Delta t_n\) contra \(n\) es una recta de pendiente \(\ln e\). En cada rebote la energía mecánica se multiplica por \(e^2\): la fracción \(1-e^2\) se convierte en energía térmica, sonora y de deformación.</p>
<div class="tablewrap"><table>
<tr><th>Referencia reglamentaria</th><th>Ensayo</th><th class="c">e equivalente</th></tr>
<tr><td>Pelota de tenis (ITF, Reglas del Tenis, Apéndice I)</td><td>Soltada desde 254 cm sobre concreto, rebota entre 135 y 147 cm</td><td class="c">0,729 a 0,761</td></tr>
<tr><td>Mesa de tenis de mesa (ITTF, Ley 2.1)</td><td>Pelota estándar soltada desde 30 cm rebota unos 23 cm</td><td class="c">≈ 0,876</td></tr>
</table></div>
<p>En un choque entre dos cuerpos que se mueven sobre la misma recta, las fuerzas que cada uno ejerce sobre el otro son iguales y opuestas (tercera ley) y duran lo mismo: los impulsos se cancelan y el momento lineal total se conserva,</p>
<div class="eq">\[m_1v_1+m_2v_2=m_1v_1'+m_2v_2',\qquad e=\frac{v_2'-v_1'}{v_1-v_2}.\]</div>
<p>La energía cinética solo se conserva si \(e=1\).</p>
</section>
