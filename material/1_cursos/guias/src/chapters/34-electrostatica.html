<p class="lead">Las dos primeras evidencias del DBA 2 de 11.° piden identificar el signo de la carga que adquiere un material por frotamiento o contacto y reconocer que las fuerzas eléctricas atraen y repelen. Un frasco, un clip, papel aluminio y un tubo de PVC bastan. La práctica añade una estimación cuantitativa, la carga de dos esferas que se repelen, y un problema muy colombiano: la humedad.</p>

<section>
<h2>Fundamento físico</h2>
<p>Al frotar dos materiales distintos, los electrones pasan del que los retiene con menos fuerza al que los retiene con más. La <span class="term">serie triboeléctrica</span> ordena los materiales según esa tendencia; un orden típico, de los que tienden a quedar positivos a los que tienden a quedar negativos, es: piel humana y cabello seco, vidrio, nailon, lana, seda, papel, algodón, caucho, poliestireno, PVC, teflón. El orden exacto depende de la humedad, la limpieza y la presión del frotamiento: por eso se construye experimentalmente.</p>
<p>Dos esferas iguales de masa \(m\), colgadas del mismo punto con hilos de longitud \(L\) y con la misma carga \(q\), se separan hasta que la fuerza eléctrica, el peso y la tensión se equilibran. Si cada hilo forma un ángulo \(\theta\) con la vertical, la separación es \(d=2L\operatorname{sen}\theta\) y</p>
<div class="eq key" data-name="Péndulos cargados">\[k\frac{q^2}{d^2}=mg\tan\theta\qquad\Longrightarrow\qquad q=d\sqrt{\frac{mg\tan\theta}{k}} .\]</div>
<p>La carga se reparte entre las dos esferas al tocarlas a la vez; el modelo supone cargas iguales y puntuales, aceptable si \(d\) es varias veces el diámetro de las esferas.</p>
<div class="box warn"><h4>La humedad como variable</h4><p>El vapor de agua forma una película conductora sobre las superficies y descarga los objetos. En climas muy húmedos los efectos duran segundos. No es un fracaso: medir cuánto tarda en cerrarse el electroscopio en distintas horas del día es una excelente investigación de nivel 3.</p></div>
</section>
