<p class="lead">Medir bien no exige instrumentos caros: exige conocer la resolución y el error de cada uno y compararlo con una referencia. Este capítulo recorre las magnitudes de la física escolar con los instrumentos que una institución puede tener, y enseña a calibrarlos con referencias accesibles, empezando por las que dependen del lugar.</p>

<section>
<h2>Longitud</h2>
<div class="tablewrap"><table>
<tr><th>Instrumento</th><th class="c">Resolución</th><th>Cuidados</th></tr>
<tr><td>Regla de madera o plástico</td><td class="c">1 mm</td><td>Leer de frente (paralaje); no medir desde el borde gastado sino desde la marca de 1 cm y restar.</td></tr>
<tr><td>Flexómetro</td><td class="c">1 mm</td><td>El gancho del extremo se desliza a propósito el espesor del gancho; revisar que no esté doblado.</td></tr>
<tr><td>Calibrador o pie de rey</td><td class="c">0,05 mm o 0,02 mm</td><td>Verificar el cero cerrado; no apretar; leer el nonio en la coincidencia de líneas.</td></tr>
<tr><td>Tornillo micrométrico</td><td class="c">0,01 mm</td><td>Usar el trinquete para no apretar de más; verificar el cero.</td></tr>
</table></div>
<p>Para objetos más delgados que la resolución se mide un conjunto: el espesor de una hoja es el de un paquete de 500 hojas dividido entre 500; el diámetro de un alambre, la longitud de 20 vueltas apretadas en un lápiz dividida entre 20.</p>
</section>

<section>
<h2>Masa</h2>
<p>Una balanza digital de cocina (1 g de resolución, hasta 5 kg) y una de joyería (0,01 g, hasta 200 g) cubren casi todas las prácticas. Se verifican con pesas de calibración de clase OIML M1 o F2, que se consiguen a bajo costo; en su ausencia, con agua medida en una jeringa graduada (1 mL de agua a 20 °C tiene 0,998 g), con una incertidumbre del orden del 1 %. Las monedas no sirven de patrón: la resolución del Banco de la República de 2012 especifica, por ejemplo, la moneda de 200 pesos con 4,61 g ± 3 %.</p>
</section>

<section>
<h2>Fuerza</h2>
<p>Un dinamómetro comercial de resorte se puede reemplazar por un resorte calibrado con masas conocidas: se cuelgan masas, se mide el alargamiento y se ajusta una recta; la pendiente es la constante del resorte y la recta es la curva de calibración. Las bandas de caucho también sirven para mostrar fuerzas, pero no como instrumento: su respuesta no es lineal y presenta <span class="term">histéresis</span>, es decir, el alargamiento al descargar no coincide con el de la carga.</p>
<div class="sim" data-sim="calibracion-dinamometro" data-kind="Simulación" data-title="Calibrar un dinamómetro casero: resorte frente a banda de caucho"></div>
<div class="sim-guide"><ul>
<li>Con el resorte, los puntos de carga y descarga coinciden y los residuos son pequeños: es un buen instrumento hasta su límite elástico.</li>
<li>Con la banda de caucho, la curva se dobla y la descarga queda por encima de la carga: la misma fuerza da dos lecturas. Sirve para experiencias cualitativas, no para medir.</li>
</ul></div>
</section>

<section>
<h2>Tiempo y video</h2>
<p>El cronómetro manual sirve para fenómenos de varios segundos o para muchas repeticiones (capítulo 8). Para movimientos rápidos hay tres opciones accesibles:</p>
<ul>
<li><b>Cronómetro acústico de phyphox.</b> El celular inicia y detiene el conteo con dos sonidos que superan un umbral (un golpe, un aplauso); la resolución es del orden del milisegundo.</li>
<li><b>Video.</b> Grabar a 30, 60, 120 o 240 cuadros por segundo y analizar cuadro a cuadro con <i>Tracker</i>, el programa libre de análisis de video del proyecto Open Source Physics (D. Brown). El tiempo queda cuantizado por el intervalo entre cuadros y la posición depende de una escala de referencia que debe estar <b>en el mismo plano</b> del movimiento.</li>
<li><b>Fotopuertas</b> con un microcontrolador, que llegan a microsegundos (capítulo 13).</li>
</ul>
<div class="sim" data-sim="video-fps" data-kind="Simulación" data-title="Caída libre medida con video: cuadros por segundo y paralaje"></div>
<div class="sim-guide"><ul>
<li>A 30 cuadros por segundo una caída de 1 m dura unos 13 cuadros: el ajuste parabólico da \(g\) con algunos por ciento de dispersión. A 240 cuadros por segundo la dispersión cae a una fracción de por ciento.</li>
<li>Si la regla de escala está 10 cm más cerca de la cámara que el objeto, a 1,5 m de distancia, todas las longitudes salen 7 % menores y \(g\) también: un error sistemático que ninguna repetición corrige.</li>
</ul></div>
</section>

<section>
<h2>Temperatura</h2>
<p>Los termómetros de vidrio con mercurio deben retirarse (capítulo 3). Las opciones son el termómetro digital de punzón (resolución 0,1 °C, exactitud típica ±1 °C), el sensor digital DS18B20 (±0,5 °C entre −10 °C y 85 °C según su fabricante) y los termistores NTC para montajes con microcontrolador. Todos se verifican con dos puntos fijos:</p>
<ol>
<li><b>Agua con hielo</b> bien mezclada: 0,0 °C.</li>
<li><b>Agua en ebullición</b>: no a 100 °C, sino a la temperatura de ebullición de la presión local. En Popayán es de unos 94 °C, en Bogotá de unos 91,5 °C y en la costa cercana a 99,9 °C (apéndice A). Calibrar con 100 °C en Bogotá introduce un error de más de 8 °C.</li>
</ol>
</section>

<section>
<h2>Magnitudes eléctricas: el multímetro</h2>
<ul>
<li><b>Tensión:</b> en paralelo con el elemento, en la escala de corriente continua (V⎓) o alterna (V~).</li>
<li><b>Corriente:</b> en serie, abriendo el circuito, con la punta roja en el borne de corriente. Nunca se conecta el amperímetro directamente a una pila o a una fuente: es un cortocircuito.</li>
<li><b>Resistencia:</b> con el circuito sin alimentación y el elemento desconectado de lo demás.</li>
<li><b>Exactitud:</b> el manual la da como «± (porcentaje de la lectura + dígitos)»; con ella se calcula la incertidumbre tipo B (capítulo 8).</li>
<li><b>Seguridad:</b> los multímetros se clasifican por categorías de medición (CAT II, CAT III…) según la norma IEC 61010-1. En el laboratorio de física se mide solo en muy baja tensión, pero conviene comprar equipos con categoría declarada y fusible real en el borne de corriente.</li>
</ul>
</section>

<section>
<h2>El celular como laboratorio</h2>
<p>La aplicación gratuita <b>phyphox</b>, desarrollada en la Universidad RWTH de Aquisgrán (Staacks y colaboradores, 2018), da acceso a los sensores del teléfono con experimentos listos, exportación de datos a CSV y acceso remoto desde un computador en la misma red.</p>
<div class="tablewrap"><table>
<tr><th>Sensor</th><th>Mide</th><th>Prácticas del cuaderno</th></tr>
<tr><td>Acelerómetro</td><td>Aceleración en tres ejes (incluye la gravedad)</td><td>Péndulo, resorte, movimiento circular</td></tr>
<tr><td>Giroscopio</td><td>Velocidad angular</td><td>Movimiento circular, péndulo físico</td></tr>
<tr><td>Magnetómetro</td><td>Campo magnético en tres ejes (µT)</td><td>Electroimán, campo terrestre, inducción</td></tr>
<tr><td>Barómetro (no en todos los modelos)</td><td>Presión atmosférica</td><td>Hidrostática, gases</td></tr>
<tr><td>Sensor de luz</td><td>Iluminancia (lx)</td><td>Polarización, fotopuerta improvisada</td></tr>
<tr><td>Micrófono y altavoz</td><td>Sonido, frecuencia, cronómetro acústico; generador de tonos</td><td>Sonido, rebotes, Melde</td></tr>
</table></div>
<p>Antes de medir, conviene ubicar los sensores en el cuerpo del teléfono (el acelerómetro no está en el centro) y comparar sus lecturas con una referencia: el magnetómetro, por ejemplo, con el campo del IGRF del municipio (apéndice A).</p>

</section>
