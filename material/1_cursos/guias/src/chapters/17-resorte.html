<p class="lead">Medir lo mismo por dos caminos independientes es la mejor prueba de un modelo. Aquí la constante de un resorte se obtiene estirándolo y haciéndolo oscilar; si los dos valores coinciden dentro de su incertidumbre, el modelo de Hooke y el del oscilador armónico se sostienen mutuamente. Si no coinciden, aparece algo que el modelo simple olvida: la masa del propio resorte o su tensión inicial.</p>

<section>
<h2>Fundamento físico</h2>
<p>Un resorte ideal ejerce una fuerza proporcional a su alargamiento, \(F=kx\). En equilibrio con una masa colgada, \(mg=kx\). Si la masa se desplaza y se suelta, la segunda ley da un oscilador armónico de periodo \(T=2\pi\sqrt{m/k}\).</p>
<p>Un resorte real tiene masa \(m_r\). Su extremo superior está quieto y el inferior se mueve con la carga; si cada espira se desplaza en proporción a su distancia al extremo fijo, la energía cinética del resorte equivale a la de una masa \(m_r/3\) moviéndose con la carga:</p>
<div class="eq key" data-name="Oscilador con resorte masivo">\[T=2\pi\sqrt{\frac{m+m_r/3}{k}}\qquad\Longrightarrow\qquad T^2=\frac{4\pi^2}{k}\,m+\frac{4\pi^2}{k}\,\frac{m_r}{3}.\]</div>
<p>Los resortes de espiras juntas tienen además una <span class="term">tensión inicial</span> \(F_0\): no se estiran hasta que la carga la supera, de modo que \(F=F_0+kx\) para \(F&gt;F_0\). La tensión inicial no cambia el periodo, porque solo desplaza la posición de equilibrio: es una forma elegante de mostrar que el método dinámico y el estático miden cosas distintas.</p>
<div class="box note"><h4>Energía (DBA 10.2)</h4><p>Durante la oscilación, la energía mecánica se reparte entre cinética \(\tfrac12mv^2\), elástica \(\tfrac12kx^2\) y gravitacional. Medida desde el equilibrio, la suma de la elástica y la gravitacional se comporta como \(\tfrac12k y^2\), con \(y\) el desplazamiento desde el equilibrio. La amplitud decrece por la fricción con el aire y la fricción interna del resorte.</p></div>
</section>
