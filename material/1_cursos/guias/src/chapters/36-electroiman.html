<p class="lead">La tercera evidencia del DBA 2 de 11.° es inequívoca: «Construye y explica el funcionamiento de un electroimán». Esta práctica la cumple y la enmarca en el experimento que la hizo posible, el de Ørsted, convertido aquí en una medida: con una brújula, una pila y un cable se obtiene el campo magnético terrestre del propio municipio y se compara con el modelo geomagnético internacional.</p>

<section>
<h2>Fundamento físico</h2>
<p>Una corriente \(I\) en un cable recto largo produce un campo magnético que rodea al cable, con magnitud</p>
<div class="eq">\[B=\frac{\mu_0 I}{2\pi d}\]</div>
<p>a la distancia \(d\) y sentido dado por la regla de la mano derecha. Si el cable se tiende en la dirección norte–sur sobre una brújula, su campo en la aguja es horizontal y perpendicular a la componente horizontal del campo terrestre \(B_H\). La aguja se alinea con el campo total:</p>
<div class="eq key" data-name="Brújula bajo un cable">\[\tan\varphi=\frac{\mu_0}{2\pi d\,B_H}\,I .\]</div>
<p>El campo terrestre no es igual en todo el país. El modelo IGRF-14, que el cuaderno calcula para cada municipio (apéndice A), da en Popayán una intensidad total de 29,1 µT con una componente horizontal de 26,7 µT y una inclinación de 24°; en Barranquilla, 33,2 µT, con 27,0 µT horizontales y 36° de inclinación.</p>
<p>Una bobina de \(N\) vueltas y longitud \(\ell\) produce en su eje el campo de un solenoide finito; un núcleo de hierro se magnetiza y multiplica el campo cientos de veces cerca de sus extremos. Por eso una puntilla con 50 vueltas de alambre y dos pilas levanta clips: es un electroimán que se apaga al cortar la corriente.</p>
</section>
