<p class="lead">Una regla de madera con nueve agujeros es un instrumento sorprendentemente rico. Su periodo pasa por un mínimo que el modelo del péndulo simple no puede explicar, y la linealización correcta entrega a la vez \(g\) y la longitud de la regla. Requiere una fotopuerta o mucha paciencia con el cronómetro, y por eso está entre los montajes elaborados.</p>

<section>
<h2>Fundamento físico</h2>
<p>Un cuerpo rígido que oscila alrededor de un eje horizontal fijo, con su centro de masa a la distancia \(d\) del eje, cumple \(I\ddot\theta=-mgd\operatorname{sen}\theta\). Para ángulos pequeños, su periodo es</p>
<div class="eq">\[T=2\pi\sqrt{\frac{I}{mgd}},\qquad I=I_{cm}+md^2,\qquad I_{cm}=\frac{m(L^2+b^2)}{12}.\]</div>
<p>Elevando al cuadrado y multiplicando por \(d\):</p>
<div class="eq key" data-name="Péndulo físico linealizado">\[T^2d=\frac{4\pi^2}{g}\,d^2+\frac{4\pi^2}{g}\,\frac{L^2+b^2}{12} .\]</div>
<p>La recta \(T^2d\)–\(d^2\) tiene pendiente \(4\pi^2/g\), y el cociente intercepto/pendiente es \((L^2+b^2)/12\). El periodo como función de \(d\) tiene un mínimo donde \(\dd T/\dd d=0\):</p>
<div class="eq">\[d_{mín}=\sqrt{\frac{L^2+b^2}{12}}\approx0{,}289\,L .\]</div>
<p>Cerca del mínimo el periodo casi no cambia con \(d\): un error de posición del eje apenas afecta el periodo. Huygens usó esa propiedad para sus relojes. La regla oscila, además, con el mismo periodo que un péndulo simple de longitud equivalente \(I/(md)\).</p>
</section>
