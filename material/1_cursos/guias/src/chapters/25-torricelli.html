<p class="lead">Una botella con un agujero es un laboratorio de fluidos en movimiento (estándar F6) y de energía (DBA 2 de 10.°). El chorro confirma muy bien la ley de Torricelli; el tiempo de vaciado, en cambio, la contradice por un factor cercano a 0,6. Explicar esa diferencia, la vena contracta, es un ejercicio de los que pide el estándar: sacar conclusiones aunque el resultado no sea el esperado.</p>

<section>
<h2>Fundamento físico</h2>
<p>Para un fluido ideal, la ecuación de Bernoulli entre la superficie libre (rapidez casi nula) y la salida del orificio, ambas a presión atmosférica, da</p>
<div class="eq key" data-name="Ley de Torricelli">\[v=\sqrt{2gh}.\]</div>
<p>Si el orificio está a una altura \(y\) sobre el plano donde cae el chorro, este cae en un tiempo \(\sqrt{2y/g}\) y llega a \(x=v\sqrt{2y/g}=2\sqrt{hy}\), que no depende de \(g\). La rapidez real es algo menor por la fricción en el borde: \(v=C_v\sqrt{2gh}\) con \(C_v\approx0{,}97\) a \(0{,}99\).</p>
<p>El caudal es otra historia. Las líneas de corriente convergen al orificio y el chorro sigue contrayéndose después de salir, hasta un área mínima (la <span class="term">vena contracta</span>) de cerca del 62 % del orificio en uno de borde afilado. El caudal real es \(Q=C_d\,a\sqrt{2gh}\) con \(C_d=C_c\,C_v\approx0{,}61\). Igualando con la disminución del volumen, \(-A\,\dd h/\dd t=Q\):</p>
<div class="eq">\[\sqrt{h(t)}=\sqrt{h_0}-C_d\,\frac{a}{A}\sqrt{\frac g2}\;t,\qquad t_{vaciado}=\frac{A}{C_d\,a}\sqrt{\frac{2h_0}{g}} .\]</div>
<p>La gráfica de \(\sqrt h\) contra \(t\) es una recta cuya pendiente da \(C_d\); la de \(x^2\) contra \(h\), una recta de pendiente \(4C_v^2y\).</p>
