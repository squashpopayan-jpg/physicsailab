<p class="lead">La brújula de tangentes enlaza tres ideas del DBA 2 de 11.°: las corrientes producen campos magnéticos, los campos se suman como vectores y la Tierra es un imán. El resultado es un número propio del municipio, que se puede comparar con el modelo geomagnético internacional y con el sensor del celular.</p>

<section>
<h2>Fundamento físico</h2>
<p>En el centro de una bobina circular de \(N\) vueltas y radio \(R\), la corriente \(I\) produce un campo perpendicular al plano de la bobina (ley de Biot–Savart):</p>
<div class="eq key" data-name="Brújula de tangentes">\[B_c=\frac{\mu_0 N I}{2R},\qquad \tan\theta=\frac{B_c}{B_H}=\frac{\mu_0 N}{2R\,B_H}\,I .\]</div>
<p>Si el plano de la bobina coincide con el meridiano magnético, \(B_c\) es perpendicular a la componente horizontal del campo terrestre \(B_H\), y la aguja se orienta según su suma. Si la bobina está girada un ángulo pequeño \(\alpha\), las desviaciones con la corriente en un sentido y en el otro difieren, pero su promedio se aparta muy poco del valor ideal. Un par de bobinas de Helmholtz (dos bobinas iguales separadas una distancia igual a su radio) produce un campo más uniforme, \(B=(4/5)^{3/2}\mu_0NI/R\).</p>
<div class="box note"><h4>Su municipio según el IGRF-14</h4><p>Para <b><span data-loc="nombre">Popayán</span></b> (altitud <span data-loc="h">1737 m</span>), el modelo geomagnético IGRF-14 da hoy: componente horizontal \(B_H\) = <b><span data-loc="BH">26,7 µT</span></b>, campo total <span data-loc="BF">29,1 µT</span>, declinación <span data-loc="BD">6,8° al oeste</span> e inclinación <span data-loc="BI">23,8°</span>. Cambie el municipio en la barra superior; el apéndice A trae la tabla de las capitales.</p></div>
<p>El IGRF describe el campo del núcleo terrestre. En un salón, el acero de columnas y vigas, las tuberías y los equipos añaden campos locales de varios microteslas, por eso la medida en el patio, sobre una mesa de madera, es la que mejor se compara con el modelo.</p>
</section>
