<p class="lead">Una pila convierte directamente energía química en trabajo eléctrico, sin pasar por el calor. Alessandro Volta la inventó en 1800, y Faraday y Nernst la convirtieron en una herramienta de medida: el voltaje de una celda es una medida directa de la energía de Gibbs de la reacción que ocurre dentro, con una precisión que ningún calorímetro alcanza. De la ecuación de Nernst salen el pH-metro, los sensores de oxígeno y de glucosa, y los diagramas de Pourbaix que le dicen a un ingeniero si un metal se corroe en un medio dado.</p>

<section>
<h2>La celda galvánica y la energía de Gibbs</h2>
<p>En una <span class="term">celda galvánica</span> la reacción de oxidorreducción se separa en dos semirreacciones en electrodos distintos: en el <em>ánodo</em> la especie se oxida y cede electrones; en el <em>cátodo</em> se reduce y los recibe. Los electrones viajan por un circuito externo, y un puente salino o una membrana cierra el circuito con iones. La celda de Daniell (1836) es el ejemplo clásico: \(\mathrm{Zn(s)|Zn^{2+}(aq)||Cu^{2+}(aq)|Cu(s)}\), con la reacción global \(\mathrm{Zn+Cu^{2+}\to Zn^{2+}+Cu}\).</p>
<p>A \(T\) y \(P\) constantes, el trabajo eléctrico máximo que una reacción puede dar es la disminución de su energía de Gibbs. Si por la reacción pasan \(n\) electrones por unidad de reacción, la carga transportada es \(nF\) (con la constante de Faraday \(F=96\,485\) C/mol) y el trabajo es \(nFE\):</p>
<div class="eq key" data-name="Potencial y energía de Gibbs">\[\Delta_rG=-nFE,\qquad\Delta_rG^\circ=-nFE^\circ,\qquad E^\circ=\frac{RT}{nF}\ln K.\]</div>
<p>Un voltaje positivo es una reacción espontánea. El potencial de una celda es la diferencia entre los de dos electrodos, \(E=E_{cat}-E_{an}\); como solo se pueden medir diferencias, se elige un cero: el electrodo estándar de hidrógeno (ESH), \(\mathrm{2H^+(a=1)+2e^-\to H_2(1\ bar)}\), con \(E^\circ=0\) a toda temperatura. Los <span class="term">potenciales estándar de reducción</span> \(E^\circ\) de los demás electrodos son los de celdas con el ESH. La relación con las tablas del capítulo 3 es directa: para un metal, \(E^\circ(\mathrm{M^{z+}/M})=\Delta_fG^\circ(\mathrm{M^{z+}})/zF\). El Cu²⁺ (\(\Delta_fG^\circ=+65.5\) kJ/mol) da +0.339 V, el Zn²⁺ (−147.1 kJ/mol) da −0.762 V, el Ag⁺ (+77.1 kJ/mol) da +0.799 V: coinciden con los valores medidos dentro de unos milivoltios, salvo el Ni²⁺ (−0.236 V frente a −0.257 V).</p>
<div class="sim" data-sim="celda-nernst" data-title="Celdas galvánicas: potencial estándar, Nernst, constante de equilibrio y temperatura"></div>
<div class="sim-guide"><ul>
<li>La celda de Daniell (Zn/Cu) con concentraciones de 1 mol/L da \(E^\circ=1.102\) V (el valor aceptado es 1.10 V), \(\Delta_rG^\circ=-212.6\) kJ/mol y \(K=1.7\times10^{37}\): la reacción es prácticamente completa.</li>
<li>Con \([\mathrm{Cu^{2+}}]=10^{-3}\) y \([\mathrm{Zn^{2+}}]=1\) mol/L, el potencial baja a 1.013 V: la ecuación de Nernst lo da por \(E=E^\circ-\tfrac{RT}{2F}\ln Q\) con \(Q=[\mathrm{Zn^{2+}}]/[\mathrm{Cu^{2+}}]=10^3\), es decir, −88.8 mV, o 29.6 mV por cada factor 10.</li>
<li>Celdas con el par Ag/Cu (0.460 V) y Zn/Ag (1.561 V): cuanto más separados están los dos electrodos en la escala de potenciales, mayor es la fuerza electromotriz. Las pilas de litio (\(E^\circ(\mathrm{Li^+/Li})=-3.04\) V) llegan a 3.7 V en parte por esa razón (capítulo 15).</li>
<li>Mueva la temperatura: el coeficiente \(\mathrm{d}E/\mathrm{d}T=\Delta_rS^\circ/(nF)\) de la celda de Daniell es −0.11 mV/K, pequeño porque \(\Delta_rS^\circ=-21\) J/mol·K. En la celda de Daniell \(\Delta_rH^\circ\) y \(\Delta_rG^\circ\) casi coinciden: toda la energía de la reacción se convierte en trabajo eléctrico.</li>
</ul></div>
<h3>La temperatura: de G a H y S</h3>
<p>Como \((\partial G/\partial T)_P=-S\), el coeficiente de temperatura del potencial de una celda mide su entropía de reacción, y con \(\Delta G=\Delta H-T\Delta S\) se obtiene la entalpía sin calorímetro:</p>
<div class="eq key" data-name="Coeficiente de temperatura">\[\Delta_rS=nF\left(\pdv{E}{T}\right)_P,\qquad\Delta_rH=-nF\left[E-T\left(\pdv{E}{T}\right)_P\right].\]</div>
<p>El calor que una celda intercambia con el ambiente cuando trabaja reversiblemente es \(Q_{rev}=T\Delta_rS\): puede ser positivo o negativo según el signo de \(\mathrm{d}E/\mathrm{d}T\). Para la pila de combustible de hidrógeno (\(\mathrm{H_2+\tfrac12O_2\to H_2O(l)}\), \(\Delta_rG^\circ=-237.1\) kJ, \(\Delta_rH^\circ=-285.8\) kJ), el potencial reversible es \(E^\circ=1.229\) V; el «potencial termoneutro» \(\Delta H/nF=1.481\) V es el que obtendría la celda si convirtiera toda la entalpía en electricidad. La eficiencia máxima, \(\Delta G/\Delta H=83\,\%\), no la limita Carnot sino la entropía de la reacción.</p>
</section>

<section>
<h2>Celdas de concentración, electrodos selectivos y el pH-metro</h2>
<p>Una celda puede funcionar sin reacción neta de oxidorreducción, solo por una diferencia de concentración entre sus dos mitades: \(E=\tfrac{RT}{zF}\ln(a_2/a_1)\). Con ese principio, un electrodo cuyo potencial responde a la actividad de un solo ion mide esa actividad. El <b>electrodo de vidrio</b>, inventado por Cremer (1906) y perfeccionado por Haber y Klemensiewicz, tiene una membrana delgada de vidrio que intercambia H⁺ con la disolución, y su potencial sigue la ecuación de Nernst:</p>
<div class="eq">\[E=E_0-\frac{2.303\,RT}{F}\,\mathrm{pH}=E_0-(59.16\ \mathrm{mV})\,\mathrm{pH}\quad(25\,°\mathrm C).\]</div>
<p>La pendiente es proporcional a \(T\): 54.2 mV/pH a 0 °C, 59.16 a 25 °C, 64.1 a 50 °C, 66.1 a 60 °C, y por eso los medidores incluyen compensación de temperatura. Se calibran con dos tampones (por ejemplo, pH 4.01 y 7.00): la ordenada y la pendiente reales del electrodo se ajustan para que el instrumento marque el pH correcto.</p>
<div class="sim" data-sim="electrodo-ph" data-title="Electrodo de vidrio y medidor de pH: pendiente de Nernst y calibración"></div>
<div class="sim-guide"><ul>
<li>Con un electrodo de 97 % de eficiencia y 8 mV de asimetría, calibrado a 25 °C y usado a 25 °C, el medidor indica exactamente el pH de la muestra, porque la calibración corrige ambos defectos.</li>
<li>Suba la temperatura de la muestra a 60 °C sin compensación: la pendiente real (66.1 mV/pH) es 12 % mayor que la de la calibración, y el error es proporcional a la distancia al punto isopotencial (pH 7): 0.35 unidades de pH en pH 4 o en pH 10 (con signos contrarios). Active la compensación y el error desaparece.</li>
<li>Un electrodo con 90 % de eficiencia da la misma lectura exacta tras calibrar (la calibración de dos puntos corrige cero y pendiente), pero ese dato es el que dice cuándo reemplazarlo: se desecha cuando la pendiente cae por debajo de 92–95 %. Lo que la calibración no corrige son los errores no lineales (error alcalino por encima de pH 12 con sodio, o ácido a pH menor de 1) y el ensuciamiento.</li>
</ul></div>
</section>

<section>
<h2>Diagramas de Pourbaix: ¿se corroe este metal?</h2>
<p>Marcel Pourbaix (1938) propuso representar en un mapa de potencial frente a pH cuál es la especie termodinámicamente estable de un elemento. Se obtiene de los potenciales químicos del capítulo 1: para cada especie \(\mathrm{M}_x\mathrm O_o\mathrm H_h^q\), la energía de formación a partir del metal, agua, protones y electrones depende de \(E\) (a través del potencial químico del electrón, \(\mu_{e^-}=-FE\)) y de \(\mathrm{pH}\) (\(\mu_{H^+}=-RT\ln10\,\mathrm{pH}\)). En cada punto (pH, \(E\)) es estable la especie de menor energía. La cuenta de arriba, para especies disueltas, incluye \(RT\ln a\) con una actividad convencional (10⁻⁶ mol/L: por debajo se considera que no hay corrosión apreciable). Tres tipos de región:</p>
<ul>
<li><b>Inmunidad</b>: la especie estable es el metal; no se corroe.</li>
<li><b>Corrosión</b>: la especie estable es un ion disuelto; el metal se disuelve.</li>
<li><b>Pasivación</b>: la especie estable es un óxido o hidróxido sólido; si forma una película compacta, protege al metal.</li>
</ul>
<p>Las líneas discontinuas son los límites de estabilidad del agua: por debajo de la línea del hidrógeno, \(E=-0.0592\,\mathrm{pH}\), el agua se reduce a H₂; por encima de la del oxígeno, \(E=1.229-0.0592\,\mathrm{pH}\), se oxida a O₂. Fuera de esa franja, el agua no es estable y no puede sostener un electrodo sin descomponerse.</p>
<div class="sim" data-sim="pourbaix" data-title="Diagramas de Pourbaix del cobre y del hierro calculados con energías de Gibbs de formación"></div>
<div class="sim-guide"><ul>
<li><b>Cobre</b>. El cobre es un metal «noble»: el potencial \(E^\circ(\mathrm{Cu^{2+}/Cu})=0.339\) V está por encima de la línea del hidrógeno, de modo que no se disuelve con ácidos que no oxiden (como el clorhídrico diluido), pero sí con ácido nítrico, que lo oxida. Con \(a=10^{-6}\) mol/L, el límite Cu²⁺/Cu cae a 0.162 V; en agua neutra o alcalina, el cobre se cubre de Cu₂O (rojizo) y CuO (negro), la pátina que lo protege.</li>
<li>A pH 7 y 0.2 V (aire húmedo y cobre con potencial de oxígeno reducido): la especie estable es Cu₂O; a 0.5 V, CuO. La estatua de la Libertad es verde porque el cobre reacciona además con CO₂, sulfatos y cloruros del aire y forma carbonatos y sulfatos básicos, especies que este diagrama sencillo no incluye.</li>
<li><b>Hierro</b> (simplificado). El Fe se corroe a Fe²⁺ en medio ácido y a potenciales entre −0.5 y 0 V; con oxígeno disuelto sube el potencial y se forma Fe₂O₃ (óxido férrico, «herrumbre»), que en pH alcalino pasiva el acero (por eso el acero dentro del hormigón, de pH 12–13, se conserva hasta que los cloruros o el CO₂ rompen la película).</li>
<li>Protección catódica: si se baja el potencial del acero hasta la zona de inmunidad (el criterio práctico de la industria es −0.85 V frente al electrodo de Cu/CuSO₄ saturado, unos −0.53 V frente al ESH) deja de corroerse. Se logra con un metal más activo (Zn, Mg) como «ánodo de sacrificio», o aplicando una corriente: es lo que se hace con los cascos de barcos y los gasoductos.</li>
</ul></div>
<div class="box warn"><h4>Qué dice y qué no dice un diagrama de Pourbaix</h4><p>Es un diagrama de <em>equilibrio</em>: dice qué ocurriría con tiempo infinito, no qué tan rápido. Un metal en zona de corrosión puede durar décadas si su cinética es lenta o si lo cubre una película protectora; uno en zona de pasivación puede corroerse si la película es porosa. Además, las especies disueltas dependen de los ligandos del medio (cloruros, amoníaco) que este diagrama no incluye. La cinética de los electrodos, que decide la velocidad, es el tema del capítulo siguiente.</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Con \(\Delta_fG^\circ(\mathrm{Zn^{2+}})=-147.1\) y \(\Delta_fG^\circ(\mathrm{Cu^{2+}})=+65.5\) kJ/mol, calcule \(E^\circ\) de la celda de Daniell.
<details><summary>Respuesta</summary><p>\(\Delta_rG^\circ=-147.1-65.5=-212.6\) kJ/mol; \(E^\circ=212\,600/(2\times96\,485)=1.102\) V.</p></details></li>
<li><span class="lvl">Básico</span>En la celda de Daniell, \([\mathrm{Zn^{2+}}]=0.10\) y \([\mathrm{Cu^{2+}}]=1.0\) mol/L a 25 °C. ¿Cuánto vale \(E\)?
<details><summary>Respuesta</summary><p>\(E=1.102-\tfrac{0.05916}{2}\log(0.10/1.0)=1.102+0.0296=1.132\) V.</p></details></li>
<li><span class="lvl">Intermedio</span>Una celda de concentración de plata, \(\mathrm{Ag|Ag^+(0.001)||Ag^+(0.1)|Ag}\), ¿qué potencial da a 25 °C?
<details><summary>Respuesta</summary><p>\(E=\tfrac{0.05916}{1}\log(0.1/0.001)=0.118\) V (el lado concentrado es el cátodo).</p></details></li>
<li><span class="lvl">Intermedio</span>Una celda con \(n=2\) tiene \(E=0.800\) V a 298 K y \(\mathrm{d}E/\mathrm{d}T=-0.50\) mV/K. Halle \(\Delta G\), \(\Delta S\) y \(\Delta H\).
<details><summary>Respuesta</summary><p>\(\Delta G=-2(96\,485)(0.800)=-154.4\) kJ; \(\Delta S=nF\,\mathrm{d}E/\mathrm{d}T=2(96\,485)(-5.0\times10^{-4})=-96.5\) J/K; \(\Delta H=\Delta G+T\Delta S=-154.4-28.8=-183.2\) kJ. La celda libera calor cuando trabaja reversiblemente: \(Q=T\Delta S=-28.8\) kJ.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que la eficiencia máxima de una pila de combustible, \(\eta=\Delta G/\Delta H\), puede superar la de Carnot y que en una celda con \(\Delta S>0\) puede ser mayor que 1.
<details><summary>Respuesta</summary><p>\(\eta=\Delta G/\Delta H=1-T\Delta S/\Delta H\). Si \(\Delta S<0\) (H₂–O₂ líquido), \(\eta<1\); con \(\Delta S>0\) y \(\Delta H<0\), \(\eta>1\): la celda absorbe calor del ambiente y lo convierte en trabajo (permitido, porque el calor se toma de un depósito y la entropía total aumenta). El límite de Carnot no se aplica porque la conversión no pasa por un ciclo térmico entre dos temperaturas.</p></details></li>
</ol>
