<p class="lead">Una reacción química libera o absorbe calor porque los enlaces que se rompen y los que se forman almacenan energías distintas. La termoquímica mide y organiza esas energías: es la contabilidad energética de la química, y alimenta desde la tabla de poder calorífico de un combustible hasta el diseño de un reactor industrial. Su herramienta central es una propiedad de estado, la entalpía, y su regla de oro es que lo que importa son los estados inicial y final, no el camino.</p>

<section>
<h2>Entalpía de reacción y estados estándar</h2>
<p>A presión constante, el calor intercambiado por un sistema que solo realiza trabajo de expansión es el cambio de entalpía, \(q_P=\Delta H\). Para una reacción, \(\Delta_rH\) es la entalpía de los productos menos la de los reactivos, por <em>mol de reacción</em> tal como está escrita la ecuación. Si es negativa, la reacción es <span class="term">exotérmica</span>; si es positiva, <span class="term">endotérmica</span>.</p>
<p>Para comparar valores se definen <span class="term">estados estándar</span> (IUPAC): para un gas, el gas ideal puro a la presión estándar \(P^\circ=1\) bar; para un líquido o sólido, la sustancia pura a 1 bar; para un soluto, la disolución hipotética de concentración 1 mol/kg con las propiedades de dilución infinita. La temperatura no forma parte de la definición: se especifica aparte, y casi siempre es 298.15 K. Con esos estados se define la <span class="term">entalpía estándar de formación</span> \(\Delta_fH^\circ\) de un compuesto como la entalpía de la reacción que lo forma, a partir de sus elementos en su forma más estable a 1 bar. Por convención, \(\Delta_fH^\circ=0\) para los elementos (grafito para el carbono, \(\mathrm{O_2}\), \(\mathrm{H_2}\), \(\mathrm{N_2}\)…).</p>
<h3>La ley de Hess</h3>
<p>Como \(H\) es función de estado, la entalpía de una reacción es la misma sea cual sea el camino. Esto permite calcular entalpías que no pueden medirse directamente: el carbono no arde limpiamente a CO, pero se mide la combustión a \(\mathrm{CO_2}\) del grafito (−393.5 kJ/mol) y del CO (−283.0 kJ/mol), y la diferencia da la formación del CO, −110.5 kJ/mol. En general:</p>
<div class="eq key" data-name="Ley de Hess">\[\Delta_rH^\circ=\sum_{\text{productos}}\nu_j\,\Delta_fH^\circ(j)-\sum_{\text{reactivos}}\nu_i\,\Delta_fH^\circ(i).\]</div>
<p>Con las entalpías de formación a 298.15 K (curadas de las tablas NBS/CODATA y contrastadas con las Active Thermochemical Tables, apéndice B), la simulación calcula cualquier combinación de las que se muestran, y también \(\Delta_rS^\circ\), \(\Delta_rG^\circ\) y la constante de equilibrio, que se tratan en el capítulo 4.</p>
<div class="sim" data-sim="hess" data-title="Entalpías de reacción a partir de las entalpías de formación (ley de Hess)"></div>
<div class="sim-guide"><ul>
<li>El metano libera 890.6 kJ/mol al quemarse con formación de agua líquida: 55.5 kJ/g. El etanol, 1366.9 kJ/mol (29.7 kJ/g); la glucosa, 2802.7 kJ/mol (solo 15.6 kJ/g, porque ya está parcialmente oxidada); el benceno, 3267.6 kJ/mol (41.8 kJ/g); el hidrógeno, 141.8 kJ/g, el mayor por masa.</li>
<li>La termita (\(\mathrm{Fe_2O_3+2Al\to Al_2O_3+2Fe}\)) libera 851.5 kJ/mol: calienta el hierro producido por encima de su punto de fusión y por eso se usa para soldar rieles.</li>
<li>La disolución del NaCl es ligeramente endotérmica (+3.85 kJ/mol) y aun así espontánea (\(\Delta G^\circ=-8.96\) kJ/mol): el motor es la entropía. La neutralización de un ácido fuerte con una base fuerte, \(\mathrm{H^+ + OH^-\to H_2O}\), libera 55.8 kJ/mol y tiene \(K=1.0\times10^{14}\), el inverso de la constante de autoionización del agua.</li>
</ul></div>
<div class="box ex"><h4>Combustión de la glucosa: ley de Hess en tres líneas</h4>
<p>Halle \(\Delta_cH^\circ\) de la glucosa sólida, \(\mathrm{C_6H_{12}O_6+6O_2\to6CO_2+6H_2O(l)}\), con \(\Delta_fH^\circ\) = −1273.3 (glucosa), −393.51 (CO₂) y −285.83 (H₂O líquida) kJ/mol.</p>
<details><summary>Solución</summary><p>\(\Delta_cH^\circ=6(-393.51)+6(-285.83)-(-1273.3)-6(0)=-2361.06-1714.98+1273.3=-2802.7\) kJ/mol, que coincide con el valor calorimétrico de 2803 kJ/mol de las tablas. Por gramo: 15.6 kJ, es decir 3.7 kcal/g, el aporte calórico habitual de los carbohidratos en nutrición.</p></details>
</div>
</section>

<section>
<h2>Calorimetría: cómo se mide una entalpía</h2>
<p>El instrumento clásico para medir calores de combustión es el <span class="term">calorímetro de bomba</span>: la muestra arde en una cámara rígida con oxígeno a unos 30 bar, sumergida en agua dentro de una chaqueta. Como el volumen es constante, el calor medido es \(q_V=\Delta U\), la energía interna de combustión. La entalpía se recupera con \(\Delta H=\Delta U+\Delta n_gRT\), donde \(\Delta n_g\) es el cambio en moles de gas de la reacción: para el ácido benzoico, \(\mathrm{C_7H_6O_2(s)+7.5O_2\to7CO_2+3H_2O(l)}\), \(\Delta n_g=-0.5\) y \(\Delta H=\Delta U-1.2\) kJ/mol.</p>
<p>El calorímetro se calibra quemando una muestra patrón con \(\Delta_cU\) conocido (el ácido benzoico, certificado por el NIST) y se mide la elevación de temperatura, de modo que \(C_{cal}=-n\,\Delta_cU/\Delta T\). La dificultad experimental está en \(\Delta T\): el agua intercambia calor con la chaqueta durante y después de la combustión, y por eso se extrapolan las derivas lineales de antes y después de la ignición hasta el instante en que se alcanza el 63 % del ascenso (método de Dickinson).</p>
<div class="sim" data-sim="calorimetro" data-title="Calorímetro de bomba: calibración con ácido benzoico y medida de una muestra"></div>
<div class="sim-guide"><ul>
<li>La curva azul es la temperatura del agua. Las dos rectas de trazos son las derivas de antes y después de la combustión; el segmento acentuado es la \(\Delta T\) corregida.</li>
<li>Con los valores iniciales (deriva pequeña), la extrapolación recupera \(\Delta T\) con 1 % de error, y el valor de \(\Delta_cH^\circ\) del naftaleno sale en −5157 kJ/mol. El ruido del termómetro (hasta 2 mK) casi no importa, porque se ajustan rectas a cientos de lecturas.</li>
<li>Suba el intercambio con la chaqueta a \(1.0\times10^{-3}\) s⁻¹ con 1.0 g de naftaleno: el error en \(\Delta_cH^\circ\) pasa a −0.5 %. La corrección por derivas es el límite real de la técnica.</li>
<li>Con ese mismo intercambio, la chaqueta 0.5 K más fría y solo 0.4 g de glucosa (\(\Delta T\approx0.5\) K) el error sube a −5 %: el sesgo de la extrapolación es casi absoluto y pesa más cuando la elevación es pequeña. Por eso se prefieren muestras que den \(\Delta T\) de 2 a 3 K.</li>
</ul></div>
</section>

<section>
<h2>La dependencia con la temperatura: ley de Kirchhoff</h2>
<p>Las entalpías de formación se tabulan a 298.15 K, pero un horno trabaja a 1000 K. Derivando \(\Delta_rH=\sum\nu_jH_j\) respecto de \(T\) a presión constante, y como \((\partial H_j/\partial T)_P=C_{p,j}\),</p>
<div class="eq key" data-name="Ley de Kirchhoff">\[\left(\pdv{\Delta_rH^\circ}{T}\right)_P=\Delta_rC_p^\circ,\qquad\Delta_rH^\circ(T_2)=\Delta_rH^\circ(T_1)+\int_{T_1}^{T_2}\Delta_rC_p^\circ\,\dd T.\]</div>
<p>donde \(\Delta_rC_p^\circ=\sum\nu_jC_{p,j}^\circ\) es la diferencia de capacidades caloríficas de productos y reactivos. Si \(\Delta_rC_p\) es pequeño, la entalpía varía poco con \(T\). Lo mismo para la entropía: \(\Delta_rS^\circ(T)=\Delta_rS^\circ(T_1)+\int\Delta_rC_p^\circ\,\dd T/T\). Para obtener \(C_p^\circ(T)\) de cada gas se usan los polinomios de siete coeficientes del formato NASA, ajustados a datos espectroscópicos y calorimétricos (aquí, los de GRI-Mech 3.0, aplicados en 298–3000 K).</p>
<div class="sim" data-sim="kirchhoff" data-title="Δ_rH°, Δ_rS° y Δ_rG° de reacciones en fase gaseosa entre 300 y 3000 K"></div>
<div class="sim-guide"><ul>
<li>La reacción de desplazamiento del gas de agua, \(\mathrm{CO+H_2O\to CO_2+H_2}\), tiene \(\Delta_rC_p\) casi nulo (3.2 J/mol·K): su \(\Delta H^\circ\) pasa de −41.1 kJ a −34.8 kJ entre 298 y 1000 K. Mantiene \(\Delta G^\circ=0\) hacia 1096 K, donde \(K=1\).</li>
<li>La síntesis de amoníaco tiene \(\Delta_rC_p=-44\) J/mol·K: con \(\Delta C_p\) constante, \(\Delta H\) a 1000 K se aleja de −110.1 kJ (valor NASA) hasta −122.9 kJ. La aproximación de \(\Delta C_p\) constante solo vale cerca de 298 K.</li>
<li>El reformado de metano con vapor, \(\mathrm{CH_4+H_2O\to CO+3H_2}\), es fuertemente endotérmico (+206 kJ/mol) y su \(\Delta G^\circ\) cruza cero hacia 891 K: es la razón de que se haga a más de 1100 K.</li>
<li>La formación de NO (\(\mathrm{N_2+O_2\to2NO}\)) no cruza \(\Delta G^\circ=0\) en todo el intervalo: \(\Delta G^\circ\) sigue siendo positivo, pero \(K\) crece rápido con \(T\), de modo que el NO de los motores se forma solo en las zonas más calientes.</li>
</ul></div>
</section>

<section>
<h2>Entalpías de enlace</h2>
<p>Una reacción reorganiza enlaces: rompe unos (cuesta energía) y forma otros (la libera). Con <span class="term">entalpías medias de enlace</span> \(D\), promediadas sobre muchas moléculas, se estima</p>
<div class="eq key" data-name="Estimación por enlaces">\[\Delta_rH\approx\sum D(\text{enlaces rotos})-\sum D(\text{enlaces formados}),\]</div>
<p>donde todas las especies deben estar en fase gaseosa (si no, hay que añadir las entalpías de vaporización). Es una estimación: un enlace C–H del metano no vale lo mismo que el del etino, y por eso el error típico es de 2 a 8 %, y a veces mucho peor cuando hay resonancia o tensión en anillos.</p>
<div class="sim" data-sim="enlaces" data-title="Entalpía de reacción por enlaces frente al valor exacto de Hess"></div>
<div class="sim-guide"><ul>
<li>La combustión del metano en fase gaseosa sale en −804 kJ/mol por enlaces, frente a −802.6 de Hess: un error del 0.2 %, casi una coincidencia. La del etanol, 2.4 %; la síntesis de amoníaco, 1.3 %.</li>
<li>La hidrogenación del eteno falla en 7.6 % (−126 frente a −136 kJ/mol): los enlaces medios no capturan que el doble enlace C=C es más fuerte de lo que sugiere el valor medio. La del etino a eteno, 5.7 %.</li>
<li>Para reacciones donde los enlaces se conservan (isomerizaciones) o hay conjugación fuerte (benceno), la regla es inútil: las entalpías de formación son siempre la vía exacta.</li>
</ul></div>
</section>

<section>
<h2>Ciclo de Born–Haber y energía reticular</h2>
<p>La entalpía de formación de una sal iónica como el NaCl, \(\mathrm{Na(s)+\tfrac12Cl_2(g)\to NaCl(s)}\), se descompone en pasos medibles: sublimar el metal, ionizarlo, disociar el cloro, atrapar el electrón en el átomo de cloro y, finalmente, juntar los iones gaseosos en el cristal. La entalpía de este último paso es la <span class="term">energía reticular</span>, que no se mide directamente. Con la ley de Hess, el ciclo de Born y Haber (1919) la despeja:</p>
<div class="eq key" data-name="Ciclo de Born–Haber">\[\Delta_fH^\circ=\Delta_{sub}H(\mathrm{M})+\mathrm{IE}(\mathrm{M})+\tfrac12D(\mathrm{X_2})+\mathrm{EA}(\mathrm{X})+U_{ret}.\]</div>
<p>Aquí \(U_{ret}\) es negativa: es la energía liberada al formar el cristal. Por otro lado, la electrostática da una estimación independiente: la atracción entre iones en una red de estructura NaCl, con constante de Madelung \(A=1.7476\) y una repulsión de corto alcance de la forma de Born–Mayer (con \(\rho=34.5\) pm), es</p>
<div class="eq">\[U_{ret}\approx-\frac{N_AAz^2e^2}{4\pi\varepsilon_0r_0}\left(1-\frac{\rho}{r_0}\right),\qquad r_0=r_++r_-.\]</div>
<div class="sim" data-sim="born-haber" data-title="Ciclo de Born–Haber de los haluros alcalinos y comparación con la electrostática"></div>
<div class="sim-guide"><ul>
<li>Para el NaCl, el ciclo da −786.8 kJ/mol; la estimación de Born–Mayer con radios de Shannon (\(r_0=283\) pm), −753.4 kJ/mol: una diferencia del 4 %, atribuible a la polarización y a las fuerzas de dispersión que el modelo ignora.</li>
<li>El LiF, con iones pequeños, tiene la mayor energía reticular de la lista (−1046.9 kJ/mol); el KBr, con iones grandes, la menor (−688.9). La energía crece como \(1/r_0\).</li>
<li>La diferencia crece para el LiF (7 %): en cristales con iones muy pequeños aumenta el carácter covalente y el ajuste a una pura atracción electrostática empeora.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Con \(\Delta_fH^\circ\) de −74.6 (CH₄), −393.51 (CO₂) y −285.83 (H₂O, líquida) kJ/mol, halle el calor liberado al quemar 1 kg de metano.
<details><summary>Respuesta</summary><p>\(\Delta_cH^\circ=-393.51+2(-285.83)+74.6=-890.6\) kJ/mol. Un kilogramo son 62.33 mol: 55.5 MJ.</p></details></li>
<li><span class="lvl">Básico</span>En una bomba calorimétrica se quema 1.000 g de ácido benzoico (\(\Delta_cU=-3226\) kJ/mol, \(M=122.12\) g/mol) y la temperatura sube 2.52 K. ¿Cuál es la capacidad calorífica del calorímetro?
<details><summary>Respuesta</summary><p>\(n=8.189\) mmol, \(q=26.41\) kJ, \(C=26.41/2.52=10.48\) kJ/K.</p></details></li>
<li><span class="lvl">Intermedio</span>El benceno líquido tiene \(\Delta_cU=-3263.9\) kJ/mol a 298 K. Halle \(\Delta_cH\).
<details><summary>Respuesta</summary><p>\(\mathrm{C_6H_6(l)+7.5O_2\to6CO_2+3H_2O(l)}\): \(\Delta n_g=6-7.5=-1.5\). \(\Delta H=\Delta U+\Delta n_gRT=-3263.9-1.5(2.479)=-3267.6\) kJ/mol, coincidente con el valor de Hess.</p></details></li>
<li><span class="lvl">Intermedio</span>Estime \(\Delta_rH^\circ\) de la reacción \(\mathrm{H_2+Cl_2\to2HCl}\) con \(D(\mathrm{H–H})=436\), \(D(\mathrm{Cl–Cl})=242\) y \(D(\mathrm{H–Cl})=431\) kJ/mol, y compárelo con −184.6 kJ/mol.
<details><summary>Respuesta</summary><p>\(436+242-2(431)=-184\) kJ/mol: casi exacto, 0.3 %.</p></details></li>
<li><span class="lvl">Avanzado</span>Para \(\mathrm{N_2+3H_2\to2NH_3}\), \(\Delta_rH^\circ(298)=-91.8\) kJ y \(\Delta_rC_p=-44.3\) J/mol·K (casi constante). Estime \(\Delta_rH\) a 700 K y explique por qué la aproximación es solo cualitativa.
<details><summary>Respuesta</summary><p>\(\Delta H(700)=-91.8+(-0.0443)(402)=-109.6\) kJ. El cálculo exacto con polinomios NASA da −105.3 kJ a 700 K (4 % de diferencia), porque \(\Delta_rC_p\) no es constante: se hace más negativo al subir \(T\), conforme se excitan las vibraciones de los reactivos.</p></details></li>
</ol>
