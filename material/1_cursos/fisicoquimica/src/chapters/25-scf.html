<p class="lead">Este capítulo no usa un programa de química cuántica: lo construye. Las integrales de gaussianas, el campo autoconsistente y la aceleración DIIS están escritos en JavaScript dentro de esta misma página, y cada resultado se compara con valores publicados. Así se ve de dónde sale un número como −74.96590 hartree para el agua, qué aproxima el método de Hartree–Fock (la correlación electrónica) y por qué falla justo donde la química se pone interesante: cuando un enlace se rompe.</p>

<section>
<h2>De la ecuación de Schrödinger a Hartree–Fock</h2>
<p>Con los núcleos fijos (Born–Oppenheimer), el hamiltoniano electrónico de \(N\) electrones es \(\hat H=\sum_i\hat h_i+\sum_{i<j}1/r_{ij}\), con \(\hat h=-\tfrac12\nabla^2-\sum_AZ_A/r_A\). El término \(1/r_{ij}\) impide separarlo. Hartree–Fock propone la mejor función de onda que es un único <span class="term">determinante de Slater</span> de espín-orbitales ortonormales \(\chi_i\), que cumple por construcción el principio de Pauli (antisimetría). La energía, minimizada variacionalmente respecto de los orbitales, conduce a ecuaciones de un electrón en el campo medio de los demás:</p>
<div class="eq key" data-name="Ecuaciones de Hartree–Fock">\[\hat f\chi_i=\varepsilon_i\chi_i,\qquad\hat f=\hat h+\sum_j\bigl(\hat J_j-\hat K_j\bigr),\qquad E_\mathrm{HF}=\sum_i\langle i|\hat h|i\rangle+\tfrac12\sum_{ij}\bigl(\langle ij|ij\rangle-\langle ij|ji\rangle\bigr).\]</div>
<p>\(\hat J\) es la repulsión coulombiana clásica con la nube de los otros electrones; \(\hat K\) es el término de <em>intercambio</em>, que no tiene análogo clásico y que corrige que un electrón no se repele a sí mismo ni a los de su mismo espín. Como \(\hat f\) depende de los orbitales que busca, se resuelve por iteración: el <span class="term">campo autoconsistente</span> (SCF, Hartree, 1928; Fock, 1930).</p>
<p>Roothaan (1951) y Hall (1951) expandieron cada orbital molecular en una base de funciones atómicas \(\phi_\mu\) (LCAO, capítulo 24), \(\psi_i=\sum_\mu C_{\mu i}\phi_\mu\), y convirtieron las ecuaciones en un problema matricial para capas cerradas:</p>
<div class="eq key" data-name="Ecuaciones de Roothaan–Hall">\[\mathsf{FC}=\mathsf{SC}\boldsymbol\varepsilon,\quad F_{\mu\nu}=h_{\mu\nu}+\sum_{\lambda\sigma}P_{\lambda\sigma}\Bigl[(\mu\nu|\lambda\sigma)-\tfrac12(\mu\lambda|\nu\sigma)\Bigr],\quad P_{\lambda\sigma}=2\sum_i^\text{occ}C_{\lambda i}C_{\sigma i}.\]</div>
<p>Los pasos del algoritmo: (1) elegir la geometría y la base; (2) calcular las integrales de solapamiento \(S\), cinética \(T\), atracción nuclear \(V\) y las \(\sim n^4/8\) integrales de repulsión de dos electrones \((\mu\nu|\lambda\sigma)\); (3) ortogonalizar la base, \(\mathsf X=\mathsf S^{-1/2}\); (4) adivinar \(\mathsf P\); (5) formar \(\mathsf F\), diagonalizar \(\mathsf X^\dagger\mathsf{FX}\), obtener nuevos \(C\) y \(P\); (6) repetir hasta que la energía y \(\mathsf{FPS}-\mathsf{SPF}\) converjan. Para acelerar usa la extrapolación DIIS de Pulay (1980), que combina las matrices de Fock de las últimas iteraciones minimizando el error \(\mathsf{FPS}-\mathsf{SPF}\). La energía total es \(E=\tfrac12\sum P_{\mu\nu}(h_{\mu\nu}+F_{\mu\nu})+E_\mathrm{nuc}\).</p>
</section>

<section>
<h2>Funciones gaussianas y bases</h2>
<p>Los orbitales de Slater (\(e^{-\zeta r}\)) describen bien el núcleo y la cola, pero las integrales de tres y cuatro centros no tienen forma cerrada. Boys (1950) propuso usar gaussianas, \(e^{-\alpha r^2}\), cuyo producto es otra gaussiana: todas las integrales se reducen a fórmulas con la función de Boys \(F_n(x)=\int_0^1t^{2n}e^{-xt^2}\dd t\). Una gaussiana representa mal un orbital de Slater, así que se contraen varias: la base <strong>STO-3G</strong> (Hehre, Stewart y Pople, 1969) ajusta cada orbital de Slater con tres gaussianas; es «mínima» (una función por orbital atómico: 7 para el agua). La <strong>6-31G</strong> (Hehre, Ditchfield y Pople, 1972) usa una contracción de seis gaussianas para el core y divide cada orbital de valencia en dos (tres gaussianas y una): 13 funciones para el agua, con más flexibilidad para que el orbital se contraiga o expanda en la molécula.</p>
<p>Las integrales de este capítulo se calculan con el método de McMurchie y Davidson (1978): el producto de dos gaussianas cartesianas se expande en gaussianas de Hermite con coeficientes \(E_t^{ij}\) por recurrencia, y las integrales de atracción nuclear y de repulsión se reducen a integrales de Hermite \(R_{tuv}\) que se obtienen de \(F_n\) con otra recurrencia. Para comprobar el código se compararon 11 integrales (solapamiento, cinética, atracción nuclear y repulsión, con funciones \(s\) y \(p\)) con las fórmulas cerradas de Szabo y Ostlund para \(s\), y con su derivada numérica respecto del centro para las \(p\) (\(p_x=\tfrac1{2\alpha}\partial/\partial A_x\,s\)): coinciden a \(10^{-12}\) las \(s\) y a \(10^{-5}\) las \(p\) (el error de la derivada).</p>
</section>

<section>
<h2>El hidrógeno molecular y la disociación</h2>
<p>En H₂ hay dos electrones y, con una base mínima, dos orbitales moleculares: \(\sigma_g\) (ocupado) y \(\sigma_u^*\). A \(R=1.4\) bohr con STO-3G, el programa de este capítulo da \(E=-1.1167143\) Eh, \(\varepsilon_1=-0.5782\) y \(\varepsilon_2=+0.6703\) Eh, los valores del texto de Szabo y Ostlund. Pero lo interesante es qué pasa al separar los átomos. En el <strong>HF restringido</strong> (RHF), los dos electrones comparten el mismo orbital espacial, \(\sigma_g\)\(^2\), y esa función es una mezcla de la forma covalente \(\mathrm{H{\cdot}\,{\cdot}H}\) y de la iónica \(\mathrm{H^+H^-}\) al 50 % cada una: a distancia infinita, una energía enorme. En el <strong>HF no restringido</strong> (UHF) cada espín tiene su orbital y, si se les permite, uno se localiza en cada átomo: el límite es correcto, pero la función de onda ya no es un singlete puro.</p>
<div class="sim" data-sim="h2-hf" data-title="Curva de energía potencial del H₂ con RHF y UHF, y energías de los orbitales"></div>
<div class="sim-guide"><ul>
<li>Con STO-3G el mínimo RHF está en \(R_e=1.346\) bohr (0.712 Å), \(E=-1.11751\) Eh; con 6-31G, \(R_e=0.730\) Å, \(E=-1.12683\) Eh (el experimento: 0.7414 Å; la energía exacta, −1.17447 Eh). La diferencia con el exacto es la <span class="term">energía de correlación</span>, \(E_\mathrm{corr}=E_\mathrm{exacta}-E_\mathrm{HF}\): en el límite de base completa, \(E_\mathrm{HF}=-1.1336\) y la correlación es 0.041 Eh (1.1 eV), un tercio de la energía de enlace.</li>
<li>Hasta \(R\approx2.3\) bohr las curvas RHF y UHF coinciden (\(\langle S^2\rangle=0\)); luego se separan. A \(R=10\) bohr con STO-3G, el RHF da −0.5960 Eh; el UHF, −0.9332 Eh, igual a \(2E(\mathrm H)=-0.9332\) (H STO-3G: −0.46658), con \(\langle S^2\rangle=1.000\) (mitad singlete, mitad triplete). Con 6-31G: RHF −0.7481 y UHF −0.9965 (\(2E(\mathrm H)=-0.9965\)). El RHF queda 0.34 Eh (9 eV) por encima: una disociación que ninguna base arregla.</li>
<li>La energía de disociación respecto de los átomos (UHF a \(R\) grande) resulta de 5.0 eV con STO-3G y de 3.55 eV con 6-31G; el límite HF de base completa es 3.64 eV y el valor experimental 4.75 eV (\(D_e\)). Con la base pequeña el acuerdo es una casualidad, de errores que se compensan.</li>
</ul></div>
</section>

<section>
<h2>El agua</h2>
<p>El mismo código, con orbitales \(p\), calcula el agua. Con la geometría del proyecto de programación de T. D. Crawford (O–H de 2.08 bohr, nuclear \(E_\mathrm{nuc}=8.0023670618\) Eh) y STO-3G, se obtiene \(E_\mathrm{SCF}=-74.94207995\) Eh, frente a \(-74.94207993\) de la referencia de Crawford: igual hasta 8 cifras, tras 8 iteraciones DIIS. La optimización de la geometría con un símplex de Nelder–Mead sobre la energía da, con STO-3G, \(r_\mathrm{OH}=0.9894\) Å, \(\angle\mathrm{HOH}=100.03^\circ\) y \(E=-74.96590\) Eh (los valores de Hehre, Stewart y Pople), y con 6-31G, 0.9497 Å, 111.5° y \(-75.98536\) Eh.</p>
<div class="sim" data-sim="agua-hf" data-title="Hartree–Fock del agua: energía, geometría, momento dipolar, cargas y orbitales"></div>
<div class="sim-guide"><ul>
<li>Con la geometría experimental (0.9572 Å, 104.52°) la energía es \(-74.96294\) Eh con STO-3G y \(-75.98400\) con 6-31G: la base mayor baja la energía 1.02 Eh (27.8 eV), como exige el principio variacional. El límite HF de base completa es unos \(-76.0675\) Eh y la energía exacta no relativista, \(-76.438\): la correlación del agua es 0.37 Eh (10 eV).</li>
<li>Con STO-3G el momento dipolar es 1.73 D (a la geometría experimental; 1.71 D a la optimizada) y el O tiene carga de Mulliken \(-0.37\) (en la optimizada, \(-0.33\)); con 6-31G, 2.63 D y \(-0.79\): la carga de Mulliken depende mucho de la base y no es una magnitud física; el dipolo experimental es 1.85 D. Pulse «Calcular las curvas»: la curva de flexión tiene el mínimo en 100° (STO-3G) o 111.5° (6-31G) y la de tensión en 0.989 o 0.950 Å; la de flexión es mucho más plana, por eso el ángulo es el parámetro más sensible a la base (el experimental, 104.5°, queda entre los dos).</li>
<li>Los siete orbitales con STO-3G son \(1a_1\) (−20.2 Eh, el 1s del O), \(2a_1\), \(1b_2\), \(3a_1\), \(1b_1\) (el par libre, el HOMO) y los dos virtuales \(4a_1\), \(2b_2\) (\(\sigma^*\) de los O–H). El <span class="term">teorema de Koopmans</span> (1934) dice que \(-\varepsilon_i\) es la energía de ionización del electrón en el orbital \(i\) si los demás no se reordenan: con 6-31G, \(-\varepsilon_\mathrm{HOMO}=13.64\) eV frente a 12.62 eV experimentales; con STO-3G, 10.65 eV. El error combina dos efectos que se compensan en parte: el HF ignora la relajación de los orbitales tras la ionización (que baja la IE) y la correlación (que la sube).</li>
</ul></div>
<div class="box warn"><h4>Qué no hace Hartree–Fock</h4><p>Cada electrón siente a los demás como una nube promedio, no como partículas que se esquivan: se pierde la <em>correlación</em>. Los métodos post-HF la recuperan con una función de onda que mezcla excitaciones (interacción de configuraciones, Møller–Plesset MP2, coupled cluster CCSD(T), el «patrón oro» químico con errores de 1 kJ/mol); la teoría del funcional de la densidad (Hohenberg–Kohn, 1964; Kohn–Sham, 1965; Nobel 1998) la incluye con un funcional de la densidad aproximado y tiene un costo parecido al de HF. El procedimiento de este capítulo, con sus matrices \(\mathsf{S},\mathsf{F},\mathsf{C}\) y sus integrales, es el esqueleto de todos ellos.</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Para el agua con STO-3G, ¿cuántas funciones de base hay, cuántos orbitales ocupados y virtuales, y cuántas integrales de repulsión electrónica distintas?
<details><summary>Respuesta</summary><p>O: 1s, 2s, 2p<sub>x,y,z</sub> (5); cada H: 1s (2): 7 funciones. 10 electrones: 5 orbitales ocupados y 2 virtuales. Pares \(\mu\ge\nu\): \(7\cdot8/2=28\); integrales distintas: \(28\cdot29/2=406\) (de las \(7^4=2401\) posibles, por la simetría de ocho pliegues).</p></details></li>
<li><span class="lvl">Básico</span>En H₂ a \(R=1.4\) bohr, la energía electrónica SCF es −1.8310 Eh. Calcule la energía total y compárela con la exacta (−1.17447 Eh).
<details><summary>Respuesta</summary><p>\(E_\mathrm{nuc}=1/1.4=0.7143\) Eh; \(E=-1.8310+0.7143=-1.1167\) Eh. La diferencia con la exacta es 0.0578 Eh = 1.57 eV: correlación y limitación de la base mínima.</p></details></li>
<li><span class="lvl">Intermedio</span>El HOMO del agua con STO-3G a la geometría experimental tiene \(\varepsilon=-0.3912\) Eh. Aplique Koopmans y compare con 12.62 eV.
<details><summary>Respuesta</summary><p>\(IE\approx0.3912\times27.2114=10.65\) eV, 16 % por debajo del experimento. La base mínima no tiene la flexibilidad para describir el par libre (con 6-31G, 13.64 eV; el valor Hartree–Fock de base completa, unos 13.7 eV, queda por encima por la falta de correlación).</p></details></li>
<li><span class="lvl">Intermedio</span>¿Por qué el UHF da una energía más baja que el RHF a \(R\) grande pero igual a \(R=R_e\)? ¿Qué defecto tiene la función UHF?
<details><summary>Respuesta</summary><p>El UHF tiene más libertad (orbitales distintos para cada espín) y la energía no puede subir: cerca de \(R_e\) la solución con simetría rota no es un mínimo menor y coincide con la RHF; a distancias largas, localizar un electrón \(\alpha\) en un átomo y un \(\beta\) en el otro baja la energía hasta \(2E(\mathrm H)\). El defecto es la <em>contaminación de espín</em>: la función no es propia de \(\hat S^2\), y \(\langle S^2\rangle\) vale hasta 1 (mitad singlete, mitad triplete) en lugar de 0.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que para una capa cerrada la energía HF es \(E=\sum_i^{occ}2h_{ii}+\sum_{ij}^{occ}(2J_{ij}-K_{ij})+E_\mathrm{nuc}\) y que \(\varepsilon_i=h_{ii}+\sum_j(2J_{ij}-K_{ij})\). ¿Por qué \(E\ne\sum_i\varepsilon_i\)?
<details><summary>Respuesta</summary><p>Los espín-orbitales ocupados son \(\psi_i\alpha\) y \(\psi_i\beta\). Las integrales de dos electrones entre dos espín-orbitales dan \(J_{ij}\) para cualquier par de espines, y \(K_{ij}\) solo para espines iguales: entre los \(2n\) espín-orbitales hay, por cada par \(i,j\) de orbitales espaciales, 4 términos de Coulomb y 2 de intercambio, y la energía (con el factor \(\tfrac12\)) es \(2h_{ii}+\sum_{ij}(2J_{ij}-K_{ij})\). Derivando respecto de \(\psi_i\) con ortonormalidad se obtiene la expresión de \(\varepsilon_i\). La suma \(\sum_i\varepsilon_i\) cuenta cada repulsión \(J_{ij}\) dos veces (una desde \(i\) y otra desde \(j\)), de modo que \(E=\sum_i(h_{ii}+\varepsilon_i)+E_\mathrm{nuc}\), no \(\sum\varepsilon_i\).</p></details></li>
</ol>
