<p class="lead">Una reacción reversible no termina cuando se agotan los reactivos, sino cuando la energía de Gibbs del sistema deja de poder bajar. En ese punto las concentraciones dejan de cambiar: es el equilibrio químico. La condición se escribe con una sola cantidad, la constante de equilibrio, que se calcula de tablas termodinámicas sin hacer un solo experimento con la mezcla. Este capítulo deduce esa relación, aprende a moverla con la temperatura y la presión y la aplica a dos procesos industriales que alimentan a la humanidad: el amoníaco de los fertilizantes y el hidrógeno del reformado.</p>

<section>
<h2>El avance de reacción y la energía de Gibbs mínima</h2>
<p>Una reacción \(\sum_j\nu_jA_j=0\) (con \(\nu\) positivo para productos y negativo para reactivos) cambia las cantidades de todas las especies en proporciones fijas: \(n_j=n_j^0+\nu_j\xi\). La variable \(\xi\), en mol, es el <span class="term">avance de reacción</span>. A \(T\) y \(P\) constantes, \(\dd G=\sum_j\mu_j\,\dd n_j=\left(\sum_j\nu_j\mu_j\right)\dd\xi\), de modo que</p>
<div class="eq key" data-name="Pendiente de G(ξ)">\[\left(\pdv{G}{\xi}\right)_{T,P}=\Delta_rG=\sum_j\nu_j\mu_j=\Delta_rG^\circ+RT\ln Q,\qquad Q=\prod_ja_j^{\nu_j}.\]</div>
<p>Aquí \(a_j\) es la <span class="term">actividad</span> de la especie \(j\), que para un gas ideal es \(p_j/p^\circ\), para un soluto ideal \(c_j/c^\circ\), y para un sólido o líquido puro es 1. La reacción avanza en el sentido en que \(G\) baja, es decir, hacia productos si \(\Delta_rG<0\) (\(Q<K\)) y hacia reactivos si \(\Delta_rG>0\) (\(Q>K\)). El equilibrio está en el mínimo de \(G(\xi)\), donde la pendiente es cero:</p>
<div class="eq key" data-name="Constante de equilibrio">\[\Delta_rG^\circ=-RT\ln K,\qquad K=\prod_ja_j^{\nu_j}\Big|_{eq}.\]</div>
<p>La constante termodinámica \(K\) es adimensional y depende solo de la temperatura (\(\Delta_rG^\circ\) lo hace). Con el equilibrio de gases ideales, \(K=K_p=\prod(p_j/p^\circ)^{\nu_j}\); en términos de fracciones molares, \(K_p=K_x\,(P/p^\circ)^{\Delta\nu}\), con \(\Delta\nu=\sum\nu_j\). Por lo tanto, <b>\(K_x\) cambia con la presión pero \(K\) no</b>. En términos de concentraciones, \(K_p=K_c\,(c^\circ RT/p^\circ)^{\Delta\nu}\).</p>
<p>La forma de la curva \(G(\xi)\) tiene una razón: es la suma de una parte lineal en \(\xi\) (el término \(\xi\,\Delta_rG^\circ\), que premia al lado con menor \(G^\circ\)) y de la <em>energía de mezcla</em> \(-T\Delta S_{mez}\), que es cóncava hacia arriba y tiene su mínimo en una mezcla de composición intermedia. La suma siempre tiene mínimo interior: <b>ninguna reacción es completa</b>, aunque \(K\) sea enorme, porque en \(\xi\to\) máximo la derivada de \(x\ln x\) tiende a \(-\infty\).</p>
<div class="sim" data-sim="g-xi" data-title="N₂O₄ ⇌ 2 NO₂: la energía de Gibbs frente al avance y su mínimo"></div>
<div class="sim-guide"><ul>
<li>A 298 K y 1 bar, \(K=0.145\) y el equilibrio está en \(\xi=0.187\): el 18.7 % del N₂O₄ se disocia. La gráfica muestra la curva (negro) y la tangente (naranja) en la fotografía \(\xi\): su pendiente es \(\Delta_rG/RT=\ln(Q/K)\). Mueva la fotografía hasta que la pendiente sea cero.</li>
<li>Active «Separar»: la parte química (recta) y la de mezcla (parábola de entropía) se suman. Con \(\Delta_rG^\circ>0\) la recta sube y empuja el mínimo hacia reactivos, pero la entropía de mezcla siempre lo desplaza un poco hacia el centro.</li>
<li>Principio de Le Chatelier: suba la presión a 10 bar y el equilibrio retrocede a \(\xi=0.060\) (hay menos moles de gas del lado de los reactivos). Baje a 0.1 bar y avanza a 0.52.</li>
<li>Suba \(T\): la reacción es endotérmica (\(\Delta H^\circ=+57.2\) kJ/mol); a 350 K, \(K=4.4\) y \(\xi=0.73\); a 400 K, \(\xi=0.96\). Por eso el gas pardo es más intenso si se calienta el tubo.</li>
</ul></div>
<div class="box ex"><h4>Constante de equilibrio desde las tablas</h4>
<p>Halle \(K\) a 298 K de \(\mathrm{N_2O_4\rightleftharpoons2NO_2}\) con \(\Delta_fG^\circ\) = 97.89 kJ/mol (N₂O₄) y 51.31 kJ/mol (NO₂). ¿Qué fracción se disocia a 1 bar?</p>
<details><summary>Solución</summary><p>\(\Delta_rG^\circ=2(51.31)-97.89=4.73\) kJ/mol, \(K=\exp(-4730/2478.8)=0.148\). Con \(n_0=1\) mol de N₂O₄: \(K=\dfrac{4\xi^2}{(1-\xi)(1+\xi)}\dfrac{P}{p^\circ}\), luego \(\xi=\sqrt{K/(K+4P/p^\circ)}=0.189\), un 19 % de disociación.</p></details>
</div>
</section>

<section>
<h2>Temperatura: la ecuación de van't Hoff</h2>
<p>Como \(\ln K=-\Delta_rG^\circ/RT\), la ecuación de Gibbs–Helmholtz del capítulo 4 se traduce directamente en la dependencia de \(K\) con la temperatura (van't Hoff, 1884):</p>
<div class="eq key" data-name="Ecuación de van't Hoff">\[\frac{\dd\ln K}{\dd T}=\frac{\Delta_rH^\circ}{RT^2},\qquad \frac{\dd\ln K}{\dd(1/T)}=-\frac{\Delta_rH^\circ}{R},\qquad \ln\frac{K_2}{K_1}\approx-\frac{\Delta_rH^\circ}{R}\left(\frac1{T_2}-\frac1{T_1}\right).\]</div>
<p>Si la reacción es endotérmica, \(K\) crece con \(T\); si es exotérmica, decrece. Es el contenido cuantitativo del principio de Le Chatelier: al calentar, el sistema se desplaza en el sentido que absorbe calor. Una gráfica de \(\ln K\) frente a \(1/T\) es una recta cuando \(\Delta_rH^\circ\) es casi constante, con pendiente \(-\Delta_rH^\circ/R\); es la manera estándar de medir \(\Delta H^\circ\) de una reacción a partir de la composición de equilibrio a varias temperaturas.</p>
<div class="sim" data-sim="vant-hoff" data-title="Gráfica de van't Hoff: log K frente a 1/T para reacciones gaseosas"></div>
<div class="sim-guide"><ul>
<li>Las constantes salen de los polinomios NASA (los mismos que validan los capítulos anteriores). La reacción de desplazamiento del gas de agua, de \(\Delta_rC_p\approx0\), es casi una recta: \(K=137\) a 500 K, 9.4 a 700 K, 2.3 a 900 K y 0.99 a 1100 K. La reacción es exotérmica, por lo que el equilibrio favorece a los productos a baja \(T\); el reactor industrial usa dos etapas (alta y baja \(T\)) por esa razón.</li>
<li>El hidrógeno con oxígeno, \(\mathrm{H_2+\tfrac12O_2\to H_2O}\), tiene \(K=1.1\times10^{10}\) a 1000 K, y aun a 2500 K, \(K=e^{5.1}\approx167\) (con \(\sqrt{p_{O_2}}\) en el denominador): el vapor de agua solo se disocia apreciablemente a temperaturas de llama.</li>
<li>La tangente en cada punto, de pendiente \(-\Delta H^\circ(T)/R\), coincide con la entalpía exacta de la reacción: en la ventana «lecturas», el valor por pendiente numérica y el valor directo de los polinomios coinciden con tres cifras.</li>
<li>La recta de trazos supone \(\Delta H^\circ\) constante (el valor de 298 K): se aparta de la curva exacta cuando \(\Delta_rC_p\) es grande (reformado de metano, Haber), y no es una aproximación segura en rangos amplios.</li>
</ul></div>
</section>

<section>
<h2>Presión y composición: el principio de Le Chatelier</h2>
<p>Henri Le Chatelier (1884) resumió la respuesta de un sistema en equilibrio a una perturbación: <em>el sistema se desplaza en el sentido que contrarresta el cambio</em>. En términos termodinámicos, cada perturbación cambia \(Q\) o \(K\) y el sistema se ajusta hasta restablecer \(Q=K\):</p>
<ul>
<li><b>Añadir reactivo o retirar producto</b> baja \(Q\) por debajo de \(K\): la reacción avanza.</li>
<li><b>Aumentar la presión total</b> a \(T\) constante: \(K_x=K(P/p^\circ)^{-\Delta\nu}\) baja si \(\Delta\nu>0\) (el equilibrio retrocede) y sube si \(\Delta\nu<0\) (avanza). La presión no cambia \(K\).</li>
<li><b>Añadir un gas inerte a presión constante</b> diluye todas las especies: se favorece el lado con más moles de gas, como si bajara la presión. A volumen constante no cambia nada, porque las presiones parciales no varían.</li>
<li><b>Calentar</b> desplaza el equilibrio en el sentido endotérmico (ecuación de van't Hoff).</li>
<li>Un <b>catalizador</b> acelera ambos sentidos por igual y no cambia \(K\).</li>
</ul>
<h3>La síntesis de amoníaco</h3>
<p>La reacción \(\mathrm{N_2+3H_2\rightleftharpoons2NH_3}\) es exotérmica (\(\Delta H^\circ=-91.8\) kJ), reduce el número de moles de gas (\(\Delta\nu=-2\)) y por eso tiene su mejor rendimiento a baja temperatura y alta presión. El proceso Haber–Bosch (1909–1913) enfrenta una paradoja: el rendimiento es máximo en frío, pero a baja temperatura el N₂ casi no reacciona (la energía de activación para romper el triple enlace es enorme). Se llega a una solución de compromiso: catalizador de hierro, 400–500 °C y 150–300 bar, un 15–20 % de conversión por paso y reciclaje de los gases sin reaccionar. Alrededor del 1–2 % de la energía mundial se gasta en este proceso, que sostiene la producción de alimentos de cerca de la mitad de la humanidad (Smil, 2001).</p>
<div class="sim" data-sim="haber" data-title="Síntesis de amoníaco: composición de equilibrio frente a temperatura y presión"></div>
<div class="sim-guide"><ul>
<li>A 1 bar el rendimiento de equilibrio es de unos 0.3 % a 700 K; a 200 bar sube a 29.7 % con el gas ideal y a 32.1 % con Peng–Robinson (capítulo 2). Ponga la presión en 100 o 300 bar para ver los puntos experimentales. Mueva la presión: a baja presión, cada factor 10 multiplica el rendimiento de equilibrio por unos 8.</li>
<li>Con los datos de Larson y Dodge (1923) a 450 °C, el experimento da 16.35 % a 100 atm y 35.5 % a 300 atm; el cálculo con Peng–Robinson, 16.7 % y 35.2 %, y el gas ideal, 16.0 % y 31.8 %. La desviación del gas ideal pasa de 2 % a 100 atm a 10 % a 300 atm.</li>
<li>Entre 400 y 500 °C a 300 atm, el cálculo real da entre 47.8 % y 25.2 %: el rendimiento se parte por la mitad. Pero la velocidad con el catalizador sube casi 100 veces por cada 100 K: el equilibrio dice a dónde va el proceso, no con qué rapidez.</li>
<li>A 1000 bar, la diferencia entre gas ideal y real llega a 12 puntos porcentuales: el modelo real es necesario para diseñar reactores de alta presión.</li>
</ul></div>
</section>

<section>
<h2>Varias reacciones a la vez: minimizar G</h2>
<p>Cuando hay muchas especies y muchas reacciones posibles, plantear una constante de equilibrio por cada reacción independiente se vuelve incómodo. La alternativa, que usan todos los programas de simulación (CEA de la NASA, Cantera, ASPEN), es <b>minimizar directamente \(G=\sum n_j\mu_j\)</b> sujeto a la conservación de los átomos de cada elemento: \(\sum_ja_{ij}n_j=b_i\). Con multiplicadores de Lagrange \(\lambda_i\) para los elementos, el mínimo cumple \(\mu_j/RT=\sum_i\lambda_ia_{ij}\) para cada especie presente. Se resuelve con el método de Newton (Gordon y McBride, 1994): aquí se usa el mismo algoritmo, con los polinomios NASA de GRI-Mech 3.0.</p>
<p>La aplicación es el <span class="term">reformado de metano con vapor</span>, fuente de casi todo el hidrógeno industrial: \(\mathrm{CH_4+H_2O\rightleftharpoons CO+3H_2}\) (endotérmica, \(\Delta H^\circ=+206\) kJ), seguida de la reacción de desplazamiento \(\mathrm{CO+H_2O\rightleftharpoons CO_2+H_2}\) (exotérmica, \(-41\) kJ). Ambas ocurren a la vez; la primera aumenta el número de moles de gas (\(\Delta\nu=+2\)).</p>
<div class="sim" data-sim="reformado" data-title="Reformado de metano con vapor: composición de equilibrio por minimización de G"></div>
<div class="sim-guide"><ul>
<li>A 1100 K, 20 bar y vapor/carbono = 3 (condiciones típicas del reformador), la conversión de CH₄ en el equilibrio es 79.8 %, con 2.72 mol de H₂ por mol de metano. Subiendo a 1300 K, 98.9 %.</li>
<li>La presión juega en contra: a 1100 K y 1 bar, la conversión sube a 99.9 % (\(\Delta\nu>0\), Le Chatelier). Por eso los reformadores trabajan por encima de 1100 K, para compensar la alta presión que necesita el proceso posterior.</li>
<li>Más vapor ayuda (vapor/carbono = 5: conversión 91.7 %) pero cuesta energía de calentar el vapor sobrante; y desplaza la relación H₂/CO hacia valores altos, que el gas de síntesis de metanol (\(\mathrm{H_2/CO}=2\)) no quiere.</li>
<li>La curva de CO₂ pasa por un máximo hacia 1000 K: por debajo de esa temperatura el metano no reacciona y por encima el desplazamiento del gas de agua favorece al CO.</li>
</ul></div>
</section>

<section>
<h2>Equilibrios heterogéneos</h2>
<p>Los sólidos y los líquidos puros tienen actividad 1, así que no aparecen en \(K\). Para la descomposición de la caliza, \(\mathrm{CaCO_3(s)\rightleftharpoons CaO(s)+CO_2(g)}\), \(K=p_{CO_2}/p^\circ\): a cada temperatura, el equilibrio fija una única presión de \(\mathrm{CO_2}\), la <em>presión de disociación</em>. Con \(\Delta H^\circ=179.2\) kJ/mol y \(\Delta S^\circ=160.2\) J/mol·K se obtiene \(p_{CO_2}=0.10\) bar a 1000 K; la presión llega a 1 bar hacia 1120 K (las correlaciones empíricas publicadas dan cerca de 1170 K: la aproximación de \(\Delta H\), \(\Delta S\) constantes se aparta un 4 %). Por debajo de esa temperatura, el \(\mathrm{CO_2}\) del horno de cal debe retirarse para que la reacción avance.</p>
<div class="box ex"><h4>El óxido nítrico en un motor</h4>
<p>¿Cuánto NO hay en el aire (79 % N₂, 21 % O₂) en equilibrio a 1 bar y 2500 K, la temperatura de la llama de un motor?</p>
<details><summary>Solución</summary><p>\(\mathrm{\tfrac12N_2+\tfrac12O_2\rightleftharpoons NO}\) es endotérmica (+91 kJ/mol). La minimización de \(G\) con los polinomios NASA da una fracción molar de NO de 2.2 % a 2500 K (0.76 % a 2000 K y 4.5 % a 3000 K). El NO que sale del tubo de escape es mayor que el equilibrio a la temperatura de salida, pues se «congela» al enfriarse rápidamente: la cinética del enfriamiento manda (mecanismo de Zeldovich, capítulo 18).</p></details>
</div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Para \(\mathrm{N_2+3H_2\rightleftharpoons2NH_3}\) a 298 K, \(\Delta_rG^\circ=-32.8\) kJ/mol. Halle \(K\) y \(K_c\) (con \(c^\circ=1\) mol/L y \(p^\circ=1\) bar).
<details><summary>Respuesta</summary><p>\(K=\exp(32\,800/2478.8)=5.6\times10^5\). Con \(\Delta\nu=-2\) y \(c^\circ RT/p^\circ=24.79\): \(K_c=K\,(24.79)^{2}=3.4\times10^8\).</p></details></li>
<li><span class="lvl">Básico</span>Si se comprime una mezcla en equilibrio de \(\mathrm{N_2O_4\rightleftharpoons2NO_2}\) de 1 a 10 bar a 298 K, ¿qué ocurre con el grado de disociación?
<details><summary>Respuesta</summary><p>Con \(\Delta\nu=+1\), la compresión desplaza hacia los reactivos. \(\alpha\) pasa de 0.187 a 0.060, y \(K\) no cambia.</p></details></li>
<li><span class="lvl">Intermedio</span>Con \(\Delta_rH^\circ=-41.2\) kJ/mol (constante) y \(K=137\) a 500 K para la reacción del gas de agua, estime \(K\) a 700 K con van't Hoff y compárelo con 9.4.
<details><summary>Respuesta</summary><p>\(\ln(K_2/K_1)=-\dfrac{\Delta H}{R}\left(\dfrac1{T_2}-\dfrac1{T_1}\right)=4955\,(-5.714\times10^{-4})=-2.83\), luego \(K_2=137\,e^{-2.83}=8.1\), cerca de 9.4: el error de 14 % viene de suponer \(\Delta H\) constante (el valor real pasa de −39.8 kJ a 500 K a −37.9 kJ a 700 K).</p></details></li>
<li><span class="lvl">Intermedio</span>Para la calcinación del CaCO₃, halle la presión de CO₂ de equilibrio a 1000 K con \(\Delta H^\circ=179.2\) kJ y \(\Delta S^\circ=160.2\) J/K.
<details><summary>Respuesta</summary><p>\(\Delta G^\circ=179\,190-1000(160.19)=19\,000\) J; \(K=e^{-19000/8314}=0.102\); \(p_{CO_2}=0.10\) bar.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que, para una reacción entre gases ideales con \(\Delta\nu\neq0\), \(\left(\partial\ln K_x/\partial P\right)_T=-\Delta\nu/P\), y deduzca el sentido del desplazamiento.
<details><summary>Respuesta</summary><p>De \(K_x=K\,(P/p^\circ)^{-\Delta\nu}\), con \(K\) independiente de \(P\), se obtiene \(\ln K_x=\ln K-\Delta\nu\ln(P/p^\circ)\) y la derivada pedida. Si \(\Delta\nu<0\), \(K_x\) crece con \(P\): se favorecen los productos (menos moles de gas). Si \(\Delta\nu>0\), decrece.</p></details></li>
</ol>
