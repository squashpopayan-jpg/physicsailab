<p class="lead">Un catalizador acelera una reacción sin consumirse y sin cambiar su equilibrio. Parece poco y es casi todo: el amoníaco que fertiliza la mitad de los alimentos del mundo, los convertidores que limpian el escape de los automóviles y cada una de las reacciones de una célula dependen de catalizadores. Este capítulo parte de lo que un catalizador puede y no puede hacer, desarrolla la cinética de las enzimas con rigor (Michaelis–Menten, inhibición, cooperatividad) y termina con la catálisis sobre superficies, donde el principio de Sabatier explica por qué los mejores catalizadores no se unen ni muy fuerte ni muy débil.</p>

<section>
<h2>Qué hace un catalizador y qué no</h2>
<p>El término lo propuso Berzelius en 1835 y Wilhelm Ostwald lo definió con la claridad que le valió el Nobel de 1909: un catalizador es una sustancia que cambia la <em>velocidad</em> de una reacción sin aparecer en su ecuación global. La termodinámica del capítulo 5 impone dos consecuencias:</p>
<ul>
<li><strong>No cambia el equilibrio.</strong> Como \(K=k_\mathrm f/k_\mathrm b\) (capítulo 18), un catalizador que acelera la reacción directa acelera la inversa en la misma proporción, y \(\Delta_\mathrm rG^\circ\) no cambia. Para una enzima reversible esto se expresa en la <em>relación de Haldane</em>, \(K_\mathrm{eq}=\dfrac{V_\mathrm{max}^{\,\mathrm f}K_\mathrm M^{\,\mathrm P}}{V_\mathrm{max}^{\,\mathrm r}K_\mathrm M^{\,\mathrm S}}\): los parámetros cinéticos de la ida y de la vuelta no son independientes.</li>
<li><strong>Abre otro camino, con menor barrera.</strong> Por la ecuación de Eyring (capítulo 17), una disminución \(\Delta\Delta G^\ddagger\) de la energía libre de activación multiplica la velocidad por \(e^{\Delta\Delta G^\ddagger/RT}\): 10 kJ/mol dan un factor de 57 a 25 °C, 30 kJ/mol un factor \(1.8\times10^5\) y 100 kJ/mol un factor de \(3\times10^{17}\). El camino catalizado estabiliza el estado de transición (idea de Pauling, 1946) o lo reemplaza por una secuencia de intermediarios cuyas barreras son menores.</li>
</ul>
<p>Cuando el catalizador está en la misma fase que los reactivos la catálisis es <em>homogénea</em>; si está en otra (casi siempre un sólido), <em>heterogénea</em>; las enzimas son una tercera clase, de macromoléculas con un sitio activo que reconoce al sustrato. En la catálisis ácido–base el catalizador cede o recibe un protón en una etapa del mecanismo. Brønsted y Pedersen (1924) encontraron que la constante catalítica de una familia de ácidos débiles \(\mathrm{HA}\) obedece a \(\log k_\mathrm{HA}=\alpha\log K_a+\text{cte}\), con \(0<\alpha<1\): una relación lineal de energías libres, que es la misma de Brønsted–Evans–Polanyi que usaremos para superficies y que nace de que la barrera sigue, en parte, al cambio de energía de la etapa.</p>
<div class="box note"><h4>Catalizador no es lo mismo que «iniciador»</h4><p>El iniciador se consume (un peróxido que genera radicales y los pierde en la polimerización); el catalizador se regenera al terminar cada ciclo. La medida de su actividad es la <span class="term">frecuencia de recambio</span> (<em>turnover frequency</em>, TOF): moléculas de producto por sitio activo y por segundo. Para una enzima es el \(k_\mathrm{cat}\) de la siguiente sección; la TOF de un catalizador industrial va de \(10^{-2}\) a \(10^{3}\) s⁻¹.</p></div>
</section>

<section>
<h2>Enzimas: la cinética de Michaelis–Menten</h2>
<p>Henri (1902) y, con más detalle, Michaelis y Menten (1913), estudiaron la inversión de la sacarosa por la invertasa y propusieron el mecanismo de una sola etapa catalítica:</p>
<div class="eq" data-name="Mecanismo enzimático mínimo">\[\mathrm E+\mathrm S\ \underset{k_{-1}}{\overset{k_1}{\rightleftharpoons}}\ \mathrm{ES}\ \xrightarrow{\,k_\mathrm{cat}\,}\ \mathrm E+\mathrm P.\]</div>
<p>Con \([\mathrm E]_0=[\mathrm E]+[\mathrm{ES}]\) constante y el estado estacionario del capítulo 18 aplicado a \(\mathrm{ES}\) (Briggs y Haldane, 1925), la velocidad es una hipérbola en la concentración de sustrato:</p>
<div class="eq key" data-name="Ecuación de Michaelis–Menten">\[v=\frac{V_\mathrm{max}[\mathrm S]}{K_\mathrm M+[\mathrm S]},\qquad V_\mathrm{max}=k_\mathrm{cat}[\mathrm E]_0,\quad K_\mathrm M=\frac{k_{-1}+k_\mathrm{cat}}{k_1}.\]</div>
<p>\(K_\mathrm M\) es la concentración de sustrato a la que la velocidad es la mitad de la máxima. (Michaelis y Menten usaron el pre-equilibrio, \(k_\mathrm{cat}\ll k_{-1}\), y obtuvieron la constante de disociación \(K_\mathrm S=k_{-1}/k_1\); \(K_\mathrm M\) la generaliza.) Dos magnitudes resumen el comportamiento de una enzima:</p>
<ul>
<li>El <span class="term">número de recambio</span> \(k_\mathrm{cat}\) es la velocidad con la enzima saturada, por sitio activo. Una enzima típica tiene \(k_\mathrm{cat}\approx10\) s⁻¹ (mediana de unos dos mil pares enzima–sustrato medidos, Bar-Even et al., 2011); la anhidrasa carbónica II alcanza \(10^6\) s⁻¹ y la catalasa, \(4\times10^7\) s⁻¹.</li>
<li>La <span class="term">eficiencia catalítica</span> \(k_\mathrm{cat}/K_\mathrm M=k_1k_\mathrm{cat}/(k_{-1}+k_\mathrm{cat})\) es la constante de segundo orden a \([\mathrm S]\ll K_\mathrm M\), donde \(v=(k_\mathrm{cat}/K_\mathrm M)[\mathrm E][\mathrm S]\). Como \(k_\mathrm{cat}/K_\mathrm M\le k_1\) y \(k_1\) no puede superar la velocidad con que dos moléculas se encuentran por difusión (\(10^8\)–\(10^9\) M⁻¹s⁻¹, capítulo 21), existe un techo. La mediana de las enzimas es de \(10^5\) M⁻¹s⁻¹, tres órdenes de magnitud por debajo, y unas pocas lo tocan: la triosafosfato isomerasa (\(2.4\times10^8\) M⁻¹s⁻¹) es la «enzima perfecta» de Albery y Knowles (1976), limitada solo por la difusión.</li>
</ul>
<p>La ecuación de Michaelis–Menten se integra de modo exacto: como \(-\dd[\mathrm S]/\dd t=V_\mathrm{max}[\mathrm S]/(K_\mathrm M+[\mathrm S])\) separa variables, \(K_\mathrm M\ln([\mathrm S]_0/[\mathrm S])+([\mathrm S]_0-[\mathrm S])=V_\mathrm{max}t\), que se resuelve con la función \(W\) de Lambert (la inversa de \(we^w\)):</p>
<div class="eq" data-name="Curva de progreso (Schnell y Mendoza, 1997)">\[[\mathrm S](t)=K_\mathrm M\,W\!\left[\frac{[\mathrm S]_0}{K_\mathrm M}\exp\!\left(\frac{[\mathrm S]_0-V_\mathrm{max}t}{K_\mathrm M}\right)\right].\]</div>
<p>Esta ecuación supone que \(\mathrm{ES}\) está en estado estacionario y que casi no retiene sustrato. Segel y Slemrod (1989) mostraron que eso se cumple si \(\varepsilon=[\mathrm E]_0/(K_\mathrm M+[\mathrm S]_0)\ll1\). La simulación integra el mecanismo completo de cuatro especies y lo compara con la curva de progreso exacta.</p>
<div class="sim" data-sim="enz-mm" data-title="Mecanismo enzimático completo frente a la ecuación de Michaelis–Menten integrada"></div>
<div class="sim-guide"><ul>
<li>Con los valores iniciales (\([\mathrm S]_0=100\) µM, \([\mathrm E]_0=0.1\) µM, \(k_\mathrm{cat}=10\) s⁻¹, \(K_\mathrm M=50\) µM; \(k_1=10^6\) M⁻¹s⁻¹, \(k_{-1}=40\) s⁻¹) la velocidad máxima es \(V_\mathrm{max}=1\) µM/s, la eficiencia es \(2\times10^5\) M⁻¹s⁻¹, \(\varepsilon=6.7\times10^{-4}\) y las dos curvas coinciden a 0.02 % de \([\mathrm S]_0\). El 90 % del sustrato desaparece en 206 s, que coincide con \((0.9[\mathrm S]_0+K_\mathrm M\ln10)/V_\mathrm{max}\).</li>
<li>Suba la enzima a 10 µM: \(\varepsilon=0.067\) y el desvío es de 2.3 %. Con \([\mathrm S]_0\) = 10 µM, \(\varepsilon=0.17\) y el desvío es de 5.8 %. Con 100 µM de enzima y 10 µM de sustrato, \(\varepsilon=5\) y el desvío llega al 71 %: casi todo el sustrato está atrapado en \(\mathrm{ES}\) y la hipérbola ya no describe el experimento. Las medidas bien hechas usan enzima en concentración mucho menor que el sustrato.</li>
<li>El mínimo de \(K_\mathrm M\) que permite el control es \(k_\mathrm{cat}/k_1\) (cuando \(k_{-1}=0\)): ahí \(k_\mathrm{cat}/K_\mathrm M=k_1\) y la enzima es «perfecta». En el panel de la derecha, la velocidad inicial a \([\mathrm S]=K_\mathrm M\) es exactamente \(V_\mathrm{max}/2\).</li>
</ul></div>
<div class="box warn"><h4>Cómo se ajustan los datos</h4><p>Lineweaver y Burk (1934) enderezaron la hipérbola con \(1/v=1/V_\mathrm{max}+(K_\mathrm M/V_\mathrm{max})(1/[\mathrm S])\). Es útil para <em>ver</em> el tipo de inhibición, pero para <em>medir</em> \(V_\mathrm{max}\) y \(K_\mathrm M\) es mala: los puntos de sustrato bajo, los más ruidosos, pesan más en la recta. El estándar actual es el ajuste no lineal de \(v([\mathrm S])\), o mejor, de las curvas de progreso completas con la ecuación de arriba.</p></div>
</section>

<section>
<h2>Inhibición reversible</h2>
<p>Un inhibidor \(\mathrm I\) se une a la enzima de manera reversible: a \(\mathrm E\) con constante de disociación \(K_i\), a \(\mathrm{ES}\) con \(K_i'\). Con ambos casos se obtiene la ecuación general (inhibición <em>mixta</em>):</p>
<div class="eq key" data-name="Inhibición reversible">\[v=\frac{V_\mathrm{max}[\mathrm S]}{K_\mathrm M\left(1+\dfrac{[\mathrm I]}{K_i}\right)+[\mathrm S]\left(1+\dfrac{[\mathrm I]}{K_i'}\right)},\quad K_\mathrm M^\mathrm{ap}=K_\mathrm M\frac{1+[\mathrm I]/K_i}{1+[\mathrm I]/K_i'},\quad V_\mathrm{max}^\mathrm{ap}=\frac{V_\mathrm{max}}{1+[\mathrm I]/K_i'}.\]</div>
<ul>
<li><strong>Competitiva</strong> (\(K_i'\to\infty\)): \(\mathrm I\) compite con \(\mathrm S\) por el sitio activo, \(K_\mathrm M^\mathrm{ap}=K_\mathrm M(1+[\mathrm I]/K_i)\) y \(V_\mathrm{max}\) no cambia (se vence con mucho sustrato). Es la forma de casi todos los fármacos que imitan al sustrato, por ejemplo los inhibidores de la proteasa del VIH.</li>
<li><strong>No competitiva</strong> (\(K_i=K_i'\)): \(\mathrm I\) se une igual a \(\mathrm E\) y a \(\mathrm{ES}\), en otro sitio. \(V_\mathrm{max}\) baja y \(K_\mathrm M\) no cambia.</li>
<li><strong>Acompetitiva</strong> (\(K_i\to\infty\)): \(\mathrm I\) solo se une al complejo \(\mathrm{ES}\); \(V_\mathrm{max}\) y \(K_\mathrm M\) bajan en la misma proporción.</li>
</ul>
<p>La concentración que reduce a la mitad la velocidad, la <span class="term">CI₅₀</span>, no es una constante del inhibidor: depende del sustrato. Para la competitiva es \(\mathrm{IC}_{50}=K_i(1+[\mathrm S]/K_\mathrm M)\) (Cheng y Prusoff, 1973), de modo que un mismo inhibidor parece diez veces menos potente si se mide con sustrato a \(10K_\mathrm M\). Por eso los farmacólogos reportan \(K_i\).</p>
<div class="sim" data-sim="enz-inhib" data-title="Inhibición reversible: velocidad inicial y gráfica de Lineweaver–Burk"></div>
<div class="sim-guide"><ul>
<li>Con \(V_\mathrm{max}=100\) µM/min, \(K_\mathrm M=50\) µM, \(K_i=25\) µM y \([\mathrm I]=50\) µM, la inhibición competitiva da \(K_\mathrm M^\mathrm{ap}=150\) µM (triplicado) y \(V_\mathrm{max}\) intacta; la no competitiva, \(V_\mathrm{max}^\mathrm{ap}=33.3\) µM/min con \(K_\mathrm M\) igual; la acompetitiva, 16.7 µM y 33.3 µM/min.</li>
<li>La CI₅₀ cambia con el sustrato solo cuando el inhibidor compite o es acompetitivo: la competitiva da 50 µM a \([\mathrm S]=K_\mathrm M\) y 275 µM a \(10K_\mathrm M\); la acompetitiva, 50 y 27.5 µM; la no competitiva da 25 µM (\(=K_i\)) en ambos casos. La mixta (\(K_i'=5K_i\)) da \(K_\mathrm M^\mathrm{ap}=107\) µM y \(V_\mathrm{max}^\mathrm{ap}=71\) µM/min, y una CI₅₀ de 42 y 92 µM.</li>
<li>En el panel de Lineweaver–Burk, las rectas con y sin inhibidor se cortan en el eje vertical (competitiva), en el horizontal (no competitiva), son paralelas (acompetitiva) o se cortan en el segundo cuadrante (mixta): una forma gráfica de distinguir el mecanismo, y casi su única virtud.</li>
</ul></div>
</section>

<section>
<h2>Cooperatividad: la hemoglobina</h2>
<p>La mioglobina, una sola cadena con un grupo hemo, se une al oxígeno con una isoterma hiperbólica y una afinidad enorme (\(P_{50}=2.8\) Torr). Si la hemoglobina, que transporta el oxígeno en la sangre, fuera igual de afín, saldría de los pulmones saturada y llegaría al músculo igual de saturada: no entregaría nada. No lo hace. La hemoglobina es un tetrámero cuyos cuatro sitios <em>cooperan</em>: la unión del primer \(\mathrm O_2\) facilita la del segundo. A.&nbsp;V. Hill (1910) describió la curva con una ecuación empírica,</p>
<div class="eq" data-name="Ecuación de Hill">\[Y=\frac{[\mathrm L]^{n}}{K_{50}^{\,n}+[\mathrm L]^{n}},\qquad n_\mathrm H=\frac{\dd\ln[Y/(1-Y)]}{\dd\ln[\mathrm L]},\]</div>
<p>donde \(Y\) es la fracción de sitios ocupados y \(n_\mathrm H\) el coeficiente de Hill: 1 sin cooperatividad, hasta el número de sitios con cooperatividad máxima. La hemoglobina humana tiene \(n_\mathrm H\approx2.7\) y \(P_{50}\approx26\) Torr. Monod, Wyman y Changeux (1965) explicaron el origen con un modelo de dos estados en equilibrio: una forma tensa \(\mathrm T\) de baja afinidad (\(K_\mathrm T\)) y una relajada \(\mathrm R\) de alta afinidad (\(K_\mathrm R\)), con \(L=[\mathrm T]/[\mathrm R]\) en ausencia de ligando y \(c=K_\mathrm R/K_\mathrm T\):</p>
<div class="eq key" data-name="Modelo MWC (n sitios)">\[Y=\frac{\alpha(1+\alpha)^{n-1}+Lc\,\alpha(1+c\alpha)^{n-1}}{(1+\alpha)^n+L(1+c\alpha)^n},\qquad\alpha=\frac{[\mathrm L]}{K_\mathrm R}.\]</div>
<p>Sin ligando casi todo es \(\mathrm T\) (\(L\gg1\)); cada molécula que se une favorece (por conservación de la simetría del tetrámero) a la forma \(\mathrm R\), que se une mejor a las siguientes. Con \(L=1\) o con \(c=1\) la cooperatividad desaparece.</p>
<div class="sim" data-sim="hill-mwc" data-title="Mioglobina y hemoglobina: hipérbola, ecuación de Hill y modelo MWC"></div>
<div class="sim-guide"><ul>
<li>Con los controles iniciales (\(L=8\times10^5\), \(c=0.0063\), \(K_\mathrm R=0.8\) Torr, valores ilustrativos ajustados aquí para reproducir la hemoglobina), el modelo da \(P_{50}=25.6\) Torr y \(n_\mathrm H=2.87\). La sangre arterial (100 Torr) deja la hemoglobina saturada al 97.5 %; la venosa (40 Torr), al 79 %: se entrega el 19 % de los sitios (con la ecuación de Hill de \(n=2.7\): 76 % y 97 %, 21 %).</li>
<li>Con la mioglobina como transportadora (hipérbola de \(P_{50}=2.8\) Torr), la saturación sería del 97.3 % en el pulmón y 93.5 % en el tejido: apenas se entrega el 3.8 %. Esa diferencia la causa sobre todo la afinidad (\(P_{50}\)), no la cooperatividad: una hipérbola con \(P_{50}=26\) Torr entregaría el 18.7 % (problema 3). Lo que añade la cooperatividad es que el pulmón carga la proteína al 97 % en vez de al 79 % y que la curva es empinada, sensible a pequeños cambios de presión en el tejido.</li>
<li>Ponga \(c=1\): \(n_\mathrm H=1.00\) y la curva es una hipérbola; ponga \(L=1\): \(n_\mathrm H=1.15\) y la afinidad es alta (\(P_{50}=0.9\) Torr), sin entrega. La cooperatividad necesita que \(\mathrm T\) esté favorecido (\(L\) grande) y que \(\mathrm R\) se una mucho mejor (\(c\) pequeño).</li>
</ul></div>
<div class="box note"><h4>Efectores alostéricos</h4><p>El \(\mathrm{H^+}\) (efecto Bohr), el \(\mathrm{CO_2}\) y el 2,3-bisfosfoglicerato estabilizan la forma \(\mathrm T\): aumentan \(L\) y desplazan la curva a la derecha, de modo que la hemoglobina entrega más oxígeno justo donde más se necesita (músculo activo, ácido y caliente). En la lectura MWC es un cambio de \(L\), no de \(K_\mathrm R\). Koshland, Némethy y Filmer (1966) propusieron un modelo alternativo, secuencial (\(\mathrm{induced\ fit}\)); los datos de la hemoglobina caen entre los dos.</p></div>
</section>

<section>
<h2>Catálisis heterogénea y el principio de Sabatier</h2>
<p>En un catalizador sólido, la reacción ocurre entre moléculas adsorbidas (mecanismo de <em>Langmuir–Hinshelwood</em>) o entre una adsorbida y una de la fase gas (<em>Eley–Rideal</em>); el capítulo 33 estudia la adsorción y las isotermas de Langmuir. Aquí basta el balance de un ciclo mínimo, \(\mathrm A(\mathrm g)+*\rightleftharpoons\mathrm A^*\to\mathrm P(\mathrm g)+*\), donde \(*\) es un sitio libre. Si \(k_1,k_{-1},k_2\) son las constantes de adsorción, desorción y reacción, el estado estacionario da la cobertura \(\theta=k_1p/(k_1p+k_{-1}+k_2)\) y</p>
<div class="eq key" data-name="Frecuencia de recambio de un ciclo de dos etapas">\[\mathrm{TOF}=k_2\,\theta=\frac{k_1k_2\,p_\mathrm A}{k_1p_\mathrm A+k_{-1}+k_2}.\]</div>
<p>Sabatier (1913, Nobel 1912) observó que el mejor catalizador es el que une a los reactivos con una fuerza intermedia. Si los une demasiado poco, \(\theta\) es pequeña y la superficie está desocupada; si los une demasiado, la superficie se llena de especies que no se van (envenenamiento por el propio reactivo) y la etapa de reacción o de desorción es lenta. Entre ambos extremos hay un máximo, el <span class="term">volcán</span> (Balandin, 1969). El segundo ingrediente es la relación de Brønsted–Evans–Polanyi (Bell, 1936; Evans y Polanyi, 1938): las barreras de una familia de reacciones relacionadas crecen linealmente con el cambio de energía libre, \(\Delta G^\ddagger=G_0+\alpha\,\Delta G\) (con \(0<\alpha<1\)) y, al menos, \(\max(\Delta G,0)\). La simulación combina ambas: un ciclo de dos pasos cuya energía de unión \(E\) es el único descriptor, con la pérdida de la entropía del gas en el paso 1 (\(S_\mathrm g=130\) J/mol·K) y \(G_0=60\) kJ/mol.</p>
<div class="sim" data-sim="volcan" data-title="Ciclo catalítico de dos pasos: perfil de energía libre y volcán de Sabatier"></div>
<div class="sim-guide"><ul>
<li>Con \(-\Delta E=100\) kJ/mol, \(T=500\) K y \(\alpha=0.5\), el máximo está a \(E\approx115\) kJ/mol con TOF cercano a \(10^{9}\) s⁻¹. La predicción de Sabatier, igualar \(\Delta G_1=\Delta G_2\) (\(-E+TS_\mathrm g=E-(-\Delta E)-TS_\mathrm g\)), da \(E^*=(-\Delta E)/2+TS_\mathrm g=115\) kJ/mol y el barrido numérico da 116: coinciden dentro de la rejilla de 2 kJ/mol.</li>
<li>Con \(E=80\) kJ/mol, el adsorbato se une con dificultad (\(\Delta G_1=-15\), \(\Delta G_2=-85\) kJ/mol): la barrera del paso 1 es la limitante y la cobertura es de \(2\times10^{-4}\), con TOF \(3.4\times10^{7}\) s⁻¹. Con \(E=200\) kJ/mol sucede lo contrario (\(\Delta G_1=-135\), \(\Delta G_2=+35\)): la superficie se satura (\(\theta=1\)) y la TOF cae a \(8\times10^{4}\) s⁻¹. Los dos brazos tienen pendientes opuestas de \(\pm\alpha/(RT\ln10)=\pm0.052\) unidades de \(\log_{10}\mathrm{TOF}\) por kJ/mol (con \(\alpha=0.5\) a 500 K), porque en ambos la barrera del paso limitante crece como \(\alpha\) por cada kJ/mol de \(E\).</li>
<li>Al subir la temperatura a 700 K el óptimo se desplaza a 142 kJ/mol (la predicción da 141): la pérdida de entropía del gas, \(TS_\mathrm g\), exige una unión más fuerte para compensar. Cambiar \(-\Delta E\) mueve el óptimo a \(-\Delta E/2\) y el pico sube con la exotermicidad: una reacción más favorable permite un catalizador mejor.</li>
</ul></div>
<div class="box note"><h4>Del modelo a los catalizadores reales</h4><p>Con descriptores calculados con teoría del funcional de la densidad (la energía de unión del N o del O sobre el metal), Nørskov, Bligaard y colaboradores construyeron volcanes para la síntesis de amoníaco, la metanación del CO, la evolución del hidrógeno y la reducción del oxígeno; el de la síntesis de amoníaco (Haber–Bosch) tiene al hierro y al rutenio cerca de la cima, y llevó a Jacobsen y colaboradores (2001) a proponer que una aleación Co–Mo, con una energía de unión del N entre las de sus componentes, sería más activa que los dos metales puros, y lo fue. Gerhard Ertl recibió el Nobel de 2007 por aclarar con experimentos de superficie limpia los pasos elementales de esa reacción.</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una enzima a 0.02 µM da \(V_\mathrm{max}=0.5\) µM/s y alcanza la mitad de esa velocidad con 30 µM de sustrato. Halle \(k_\mathrm{cat}\), \(K_\mathrm M\), \(k_\mathrm{cat}/K_\mathrm M\) y la velocidad a \([\mathrm S]=10\) µM. ¿Qué tan cerca está del límite de difusión?
<details><summary>Respuesta</summary><p>\(k_\mathrm{cat}=0.5/0.02=25\) s⁻¹; \(K_\mathrm M=30\) µM; \(k_\mathrm{cat}/K_\mathrm M=25/(30\times10^{-6})=8.3\times10^5\) M⁻¹s⁻¹; \(v=0.5(10)/(30+10)=0.125\) µM/s. El techo es \(10^8\)–\(10^9\) M⁻¹s⁻¹: la enzima está a tres órdenes de magnitud por debajo, cerca de la mediana (\(10^5\)).</p></details></li>
<li><span class="lvl">Intermedio</span>Un inhibidor competitivo tiene \(K_i=2\) µM. A \([\mathrm S]=K_\mathrm M\) y \([\mathrm I]=10\) µM, ¿qué fracción de la velocidad sin inhibidor se conserva? ¿Cuánto vale la CI₅₀ a \([\mathrm S]=K_\mathrm M\) y a \(10K_\mathrm M\)?
<details><summary>Respuesta</summary><p>\(K_\mathrm M^\mathrm{ap}=K_\mathrm M(1+10/2)=6K_\mathrm M\). Con \([\mathrm S]=K_\mathrm M\), \(v=V_\mathrm{max}K_\mathrm M/(7K_\mathrm M)=V_\mathrm{max}/7\), frente a \(V_\mathrm{max}/2\) sin inhibidor: se conserva 2/7 = 29 % (inhibición del 71 %). \(\mathrm{IC}_{50}=K_i(1+[\mathrm S]/K_\mathrm M)\): 4 µM a \([\mathrm S]=K_\mathrm M\) y 22 µM a \(10K_\mathrm M\).</p></details></li>
<li><span class="lvl">Intermedio</span>Con la ecuación de Hill (\(n=2.7\), \(P_{50}=26\) Torr), calcule la saturación a 100 y a 40 Torr, y compárela con la de una proteína de \(n=1\) y \(P_{50}=26\) Torr.
<details><summary>Respuesta</summary><p>\(Y(100)=100^{2.7}/(26^{2.7}+100^{2.7})=0.974\); \(Y(40)=0.762\); se entrega 21.2 %. Con \(n=1\): \(Y(100)=0.793\), \(Y(40)=0.606\), 18.7 %: la cooperatividad aporta poco con el mismo \(P_{50}\); la cooperatividad mejora sobre todo la carga en el pulmón (97 % en vez de 79 %); para la entrega importa más que \(P_{50}\) caiga entre las presiones del pulmón y del tejido.</p></details></li>
<li><span class="lvl">Intermedio</span>En el modelo de volcán con \(\alpha=0.5\), reacción exotérmica de 120 kJ/mol, \(T=600\) K y \(S_\mathrm g=130\) J/mol·K, ¿cuál es la energía de unión óptima? ¿Cuánto valen entonces \(\Delta G_1\) y \(\Delta G_2\)?
<details><summary>Respuesta</summary><p>\(\Delta G_1=-E+TS_\mathrm g=-E+78\), \(\Delta G_2=E-120-78\). Igualarlos: \(-E+78=E-198\), \(E^*=138\) kJ/mol, y \(\Delta G_1=\Delta G_2=-60\) kJ/mol (la suma es \(-120\), la exotermicidad total).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que \(k_\mathrm{cat}/K_\mathrm M\le k_1\) y que en el pre-equilibrio (\(k_\mathrm{cat}\ll k_{-1}\)) \(K_\mathrm M\to K_\mathrm S\). ¿Qué dice la desigualdad sobre la evolución de las enzimas?
<details><summary>Respuesta</summary><p>\(k_\mathrm{cat}/K_\mathrm M=k_1k_\mathrm{cat}/(k_{-1}+k_\mathrm{cat})=k_1/(1+k_{-1}/k_\mathrm{cat})\le k_1\), con igualdad si \(k_{-1}=0\). Si \(k_\mathrm{cat}\ll k_{-1}\), \(K_\mathrm M\to k_{-1}/k_1=K_\mathrm S\). Como \(k_1\) no puede superar el límite de encuentro por difusión (\(\sim10^9\) M⁻¹s⁻¹), ninguna enzima de este mecanismo puede ser más eficiente que eso: una vez que una enzima alcanza ese techo (la triosafosfato isomerasa lo toca), mejorarla ya no ayuda a la célula.</p></details></li>
</ol>
