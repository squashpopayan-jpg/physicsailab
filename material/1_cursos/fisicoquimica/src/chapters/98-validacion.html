<p class="lead">Las simulaciones y los ejemplos resueltos usan una biblioteca de cálculo común (<code>src/core/</code>): propiedades termodinámicas, equilibrio de Gibbs, electroquímica, cinética con integradores de EDO, química cuántica (un programa propio de Hartree–Fock con integrales gaussianas), mecánica estadística, superficies, transporte y bioenergética. Un programa automático (<code>tests/validar.js</code>) compara esa biblioteca con referencias independientes calculadas por otros programas (<code>tests/referencias.py</code>) y con datos de la literatura. Este apéndice explica el método y lista cada comprobación con su resultado.</p>

<section>
<h2>Método</h2>
<ol>
<li><b>Programas científicos de referencia.</b> <i>Cantera</i> (mecanismo GRI-Mech 3.0 y el de hidrógeno–oxígeno de Li et al., 2004: polinomios NASA, equilibrio, velocidades de reacción, tiempos de ignición, calores de formación); <i>CoolProp</i> (propiedades de fluidos con ecuaciones de referencia: agua IAPWS-95, argón, nitrógeno y otros; viscosidad y conductividad térmica de los gases y del agua líquida); <i>thermo</i> y <i>chemicals</i> (presiones de vapor DIPPR, parámetros NRTL de ChemSep, termoquímica de formación); <i>PyCO2SYS</i> (el sistema del carbono del agua de mar); <i>pymatgen</i> (grupos puntuales y reducción de representaciones).</li>
<li><b>Referencias numéricas con SciPy, NumPy, SymPy y mpmath.</b> Cuadraturas (<code>quad</code>, <code>dblquad</code>) para las integrales de Maxwell–Boltzmann y los flujos a una pared; integración de EDO (<code>solve_ivp</code> con Radau y BDF, <code>solve_bvp</code>) para la cinética, la difusión con reacción, la permeación y el modelo de Hodgkin–Huxley; el exponencial de una matriz (<code>expm_multiply</code>) para la ecuación de difusión; raíces con <code>brentq</code> para el potencial de Goldman–Hodgkin–Katz; la función de Lambert (<code>lambertw</code>) para la cinética de Michaelis–Menten integrada; diagonalización tridiagonal (<code>eigh_tridiagonal</code>) para los espectros de los pozos cuánticos; SymPy para las derivadas simbólicas de la energía de exceso de Gibbs (coeficientes de actividad) y el álgebra de la cinética enzimática. Las tolerancias van de \(10^{-12}\) (identidades algebraicas) a \(10^{-3}\) (esquemas numéricos independientes).</li>
<li><b>Datos de la literatura</b>: NIST-JANAF y NBS para la termoquímica, CRC Handbook (conductividades iónicas, entalpías, constantes), CODATA 2018, energías Hartree–Fock de Szabo y Ostlund, de Crawford (agua, STO-3G) y de Hehre–Pople (geometrías optimizadas), parámetros de Lennard–Jones de Hirschfelder–Curtiss–Bird y valores del modelo de Hodgkin–Huxley (1952). La tolerancia refleja la incertidumbre del dato o del modelo.</li>
</ol>
<p>Todos los ejemplos resueltos y las respuestas de los problemas se calcularon con esa biblioteca antes de escribirlos. Cuando un número del borrador no coincidió con el cálculo, se corrigió el texto; así se corrigieron, por ejemplo, el flujo del escalón de Fick (\(c_0\sqrt{D/4\pi t}\), no \(c_0\sqrt{D/\pi t}\)), la energía por ciclo de la bomba Na⁺/K⁺ y la acumulación de glucosa por SGLT, que dependen del potencial de membrana elegido.</p>
<div class="box warn"><h4>Exactitud de los modelos</h4><p>Algunas comparaciones no buscan coincidencia exacta sino medir el error de un modelo: el rotor rígido y el oscilador armónico (RRHO) con anarmonicidad ignorada, la corrección de Eucken para la conductividad de gases poliatómicos (10–20 %), el potencial de Lennard–Jones a alta temperatura (7 % en viscosidad), Debye–Hückel fuera de la dilución, Hückel con un \(\beta\) único, Hartree–Fock con bases mínimas (errores de decenas de kJ/mol en energías de reacción) o la viscosidad del agua de la forma de Vogel (2.5 %). En esos casos la tolerancia es la que la teoría puede dar y el texto del capítulo la discute.</p></div>
<div class="box warn"><h4>Lo que es ilustrativo</h4><p>Algunas simulaciones usan modelos esquemáticos y así lo dicen: las curvas de energía en los diagramas de reacción, los valores típicos de concentración intracelular del capítulo 38, las ecuaciones de estado cúbicas fuera de su rango de ajuste, los espectros sintéticos de los capítulos 27 y 28 (posiciones calculadas, anchos de línea elegidos) y las simulaciones de Monte Carlo y de camino aleatorio, que tienen una incertidumbre estadística indicada en cada una.</p></div>
</section>
