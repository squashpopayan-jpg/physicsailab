<p class="lead">En el capítulo 5 la constante de equilibrio salió de \(\Delta_\mathrm rG^\circ\) y esta, de tablas. Aquí se calcula sin tablas: \(K\) es un cociente de funciones de partición. Es la conexión entre la estructura molecular y la química: de las constantes espectroscópicas y de la energía de disociación sale cuánto NO se forma en un motor, qué fracción del H₂ está disociada a 3000 K, y qué temperatura debe tener una estrella para que el hidrógeno ionizado deje de absorber luz de Balmer.</p>

<section>
<h2>La constante de equilibrio como cociente de funciones de partición</h2>
<p>En el equilibrio entre gases ideales, la distribución de las moléculas entre las especies es la que maximiza la entropía a energía fija: la de Boltzmann para el conjunto de todos los niveles de todas las especies, con un origen común de energías. Si \(\varepsilon_0\) es la energía del nivel fundamental de cada especie respecto de ese origen común (para las moléculas, de los átomos separados), la constante de equilibrio de \(\sum_i\nu_i\mathrm X_i=0\) es</p>
<div class="eq key" data-name="Constante de equilibrio desde las funciones de partición">\[K_p^\circ=\prod_i\left(\frac{q_i^\circ}{N_A}\right)^{\nu_i}e^{-\Delta E_0/RT},\quad q_i^\circ=\frac{k_BT}{P^\circ}\,\frac{q_\mathrm{tras}}{V}\,q_\mathrm{rot}q_\mathrm{vib}q_\mathrm{elec},\quad\Delta E_0=\sum_i\nu_iE_{0,i}.\]</div>
<p>(En la práctica \(q^\circ_i\) se evalúa por mol con \(q_\mathrm{tras}/V=\Lambda^{-3}\), y los niveles de cada especie se miden desde su nivel \(v=0\), \(J=0\); la energía \(\Delta E_0\) reúne las diferencias de energías de punto cero y los calores de reacción a 0 K, \(\Delta E_0=-\sum\nu_i D_0(i)\) con los \(D_0\) de disociación a átomos.) El factor \(e^{-\Delta E_0/RT}\) es la barrera energética; el resto es <em>entropía</em>: cuántos estados ofrece cada lado. Una reacción que aumenta el número de moléculas (\(\Delta n=+1\)) gana traslación, y por eso las disociaciones se favorecen al subir \(T\) y al bajar \(P\) (Le Châtelier).</p>
<div class="sim" data-sim="keq-q" data-title="Constante de equilibrio desde las funciones de partición, frente a la tabla NASA"></div>
<div class="sim-guide"><ul>
<li><strong>H₂ + D₂ ⇌ 2 HD</strong>: es la reacción de intercambio isotópico más sencilla. Clásicamente \(K=4\) (hay el doble de formas de ordenar H y D en HD que en H₂ y D₂, por el cociente de números de simetría: \(\sigma_{\mathrm H_2}\sigma_{\mathrm D_2}/\sigma_{\mathrm{HD}}^2=4\)). A 298 K el cálculo da \(K=3.26\) (3.27 a 300 K; experimento, 3.3): factores de traslación 1.19, de rotación 3.56, de vibración 1.00, y e\(^{-\Delta E_0/k_BT}=0.767\), con \(\Delta E_0=54.9\) cm⁻¹ \(=0.66\) kJ/mol, la diferencia de energías de punto cero (el HD tiene menor ZPE que la media de H₂ y D₂). Al subir la temperatura \(K\to4\) (6000 K: 3.97). Urey y Rittenberg (1933) calcularon estas constantes y las comprobaron: fue el primer uso estadístico a escala molecular de los espectros.</li>
<li><strong>N₂ + O₂ ⇌ 2 NO</strong> (\(\Delta E_0=181.7\) kJ/mol): \(K_p=3.64\times10^{-4}\) a 2000 K (tabla: \(3.57\times10^{-4}\)) y \(1.42\times10^{-2}\) a 3000 K (\(1.39\times10^{-2}\)): el cociente de partición reproduce la tabla con un 2 %. En aire (\(x_\mathrm{N_2}=0.79\), \(x_\mathrm{O_2}=0.21\)), \(x_\mathrm{NO}=\sqrt{K\,x_\mathrm{N_2}x_\mathrm{O_2}}\) vale 0.8 % a 2000 K y 4.9 % a 3000 K: ese NO térmico es el que producen los motores y los rayos (mecanismo de Zeldovich, capítulo 18). A 298 K, \(K\approx10^{-30}\): no hay NO en el aire en equilibrio, solo hay N₂ y O₂ porque la reacción es lenta.</li>
<li><strong>H₂ ⇌ 2 H</strong>: \(K=0.0272\) a 3000 K (tabla 0.0253); al 1 bar total, el grado de disociación \(\alpha=\sqrt{K/(4+K)}=8.2\) %. El RRHO se aparta 6–15 % por la anarmonicidad del enlace, que a esa temperatura ya no es despreciable. <strong>O₂ ⇌ 2 O</strong>: coincide con la tabla a 3 % (3000 K: \(1.34\times10^{-2}\) frente a \(1.30\times10^{-2}\)), con la multiplicidad 3 del O₂ y la degeneración 9 del átomo (\({}^3P_{2,1,0}\)) incluidas en \(q_\mathrm{elec}\).</li>
</ul></div>
</section>

<section>
<h2>Ionización térmica: la ecuación de Saha</h2>
<p>Un caso donde las especies son un átomo, su ion y un electrón: \(\mathrm A\rightleftharpoons\mathrm A^++e^-\). Con \(\Delta E_0=I\) (energía de ionización), \(q_\mathrm{tras}\) de cada especie y los factores de espín del electrón (\(g_e=2\)), la ley de acción de masas en forma de densidades numéricas es la ecuación de Saha (1920):</p>
<div class="eq key" data-name="Ecuación de Saha">\[\frac{n_en_i}{n_0}=\frac{2g_i}{g_0}\left(\frac{2\pi m_ek_BT}{h^2}\right)^{3/2}e^{-I/k_BT}.\]</div>
<p>La ionización crece muy deprisa con la temperatura por el factor exponencial, pero <em>disminuye</em> con la densidad: a igual \(T\), un gas diluido está más ionizado (el electrón libre gana volumen de traslación). Saha la aplicó a las atmósferas estelares y Cecilia Payne (1925) la usó para convertir la secuencia espectral de las estrellas en una secuencia de temperatura y, con ella, mostrar que las estrellas son sobre todo hidrógeno y helio, no de composición terrestre como se creía.</p>
<div class="sim" data-sim="saha" data-title="Ionización térmica por la ecuación de Saha y la intensidad de las líneas de Balmer"></div>
<div class="sim-guide"><ul>
<li>Hidrógeno a \(n=10^{20}\) m⁻³ (un gas diluido, como una atmósfera estelar) y 9500 K: \(S(T)=1.4\times10^{20}\) m⁻³ y el grado de ionización es 0.67; a 10 000 K, 0.81. En la fotosfera del Sol (5772 K) y con \(n=10^{23}\) m⁻³, solo \(1.2\times10^{-4}\) del hidrógeno está ionizado.</li>
<li>La línea de Balmer H\(\alpha\) absorbe desde el nivel \(n=2\) del <em>átomo neutro</em>. Su intensidad es proporcional a la fracción neutra por la población de \(n=2\) (Boltzmann con \(E_2=10.2\) eV): a baja \(T\) casi nada hay en \(n=2\); a alta, casi todo el hidrógeno está ionizado. El producto presenta un máximo cerca de 10 000 K con \(n=10^{20}\) m⁻³ (16 000 K con \(10^{23}\)): las estrellas de tipo A (Sirio, Vega) tienen las líneas de Balmer más intensas, y las estrellas más calientes y más frías las tienen más débiles <em>sin tener menos hidrógeno</em>. Esa es la observación de Payne.</li>
<li>El sodio (\(I=5.14\) eV) está ionizado al 98 % a 5000 K y \(10^{20}\) m⁻³; el helio (24.6 eV), al 99 % a 20 000 K. Con \(S(T)\) conocida de otra especie, la medida de \(n_e\) fija \(T\): así se mide la temperatura de plasmas de laboratorio y de llamas.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule el factor \(e^{-\Delta E_0/k_BT}\) de la reacción H₂ + D₂ ⇌ 2 HD a 298.15 K con \(\Delta E_0=54.86\) cm⁻¹ y \(k_BT/hc=207.2\) cm⁻¹.
<details><summary>Respuesta</summary><p>\(54.86/207.2=0.2648\), \(e^{-0.2648}=0.767\). El factor de punto cero reduce \(K\) 23 % respecto del valor con \(\Delta E_0=0\).</p></details></li>
<li><span class="lvl">Básico</span>Con \(K_p^\circ=3.6\times10^{-4}\) a 2000 K para N₂ + O₂ ⇌ 2 NO en aire, estime la fracción molar de NO en equilibrio (\(x_\mathrm{N_2}\approx0.79\), \(x_\mathrm{O_2}\approx0.21\)).
<details><summary>Respuesta</summary><p>\(x_\mathrm{NO}^2=K\,x_\mathrm{N_2}x_\mathrm{O_2}=3.6\times10^{-4}\times0.166\Rightarrow x_\mathrm{NO}=7.7\times10^{-3}\) (0.8 %, es decir, unos 7700 ppm).</p></details></li>
<li><span class="lvl">Intermedio</span>Con \(K_p^\circ=0.0272\) para H₂ ⇌ 2 H a 3000 K, halle el grado de disociación a \(P=1\) bar y a \(P=0.01\) bar.
<details><summary>Respuesta</summary><p>\(K_p=4\alpha^2P/[(1-\alpha^2)P^\circ]\Rightarrow\alpha=\sqrt{K/(4P/P^\circ+K)}\) (con \(P\) en bar). A 1 bar: \(\sqrt{0.0272/4.0272}=0.082\). A 0.01 bar: \(\sqrt{0.0272/0.0672}=0.636\): al bajar la presión se favorece la disociación (Le Châtelier).</p></details></li>
<li><span class="lvl">Intermedio</span>Para el sodio (\(I=5.139\) eV, \(g_0=2\), \(g_i=1\)) a 5000 K, \(S=5.64\times10^{21}\) m⁻³. ¿Cuál es el grado de ionización con \(n=10^{20}\) m⁻³ y con \(10^{24}\) m⁻³?
<details><summary>Respuesta</summary><p>\(x^2/(1-x)=S/n\). Con \(10^{20}\): \(S/n=56.4\), \(x=0.983\). Con \(10^{24}\): \(S/n=5.64\times10^{-3}\), \((x=0.072)\).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que, para una reacción A + B ⇌ C + D con todos los reactivos gases ideales, \(K_c=\dfrac{(q_C/V)(q_D/V)}{(q_A/V)(q_B/V)}e^{-\Delta E_0/k_BT}\) y que de ahí \(K_p=K_c(RT/P^\circ)^{\Delta n}\).
<details><summary>Respuesta</summary><p>En el equilibrio, el potencial químico de cada especie es \(\mu_i=-k_BT\ln(q_i/N_i)\). La condición \(\sum\nu_i\mu_i=0\) da \(\sum\nu_i\ln(N_i/q_i)=0\), es decir, \(\prod(N_i/V)^{\nu_i}=\prod(q_i/V)^{\nu_i}\), con los \(q_i\) referidos a un origen común de energía, de donde \(K_c=\prod(c_i)^{\nu_i}=\prod(q_i/V)^{\nu_i}\) (en moléculas por volumen). Con \(P_i=c_ik_BT\), \(K_p=K_c(k_BT)^{\Delta n}\).</p></details></li>
</ol>
<div class="box note"><h4>Para profundizar</h4><p>H. C. Urey y D. Rittenberg, <em>J. Chem. Phys.</em> 1, 137 (1933). M. N. Saha, <em>Phil. Mag.</em> 40, 472 (1920); <em>Proc. R. Soc. A</em> 99, 135 (1921). C. H. Payne, <em>Stellar Atmospheres</em>, Harvard Observatory Monographs, 1925. D. A. McQuarrie, <em>Statistical Mechanics</em>, 2000, cap. 8. B. Ruscic y D. H. Bross, Active Thermochemical Tables (atct.anl.gov). M. W. Chase, <em>NIST-JANAF Thermochemical Tables</em>, 1998. K. P. Huber y G. Herzberg, <em>Constants of Diatomic Molecules</em>, 1979. Ya. B. Zeldovich, <em>Acta Physicochim. URSS</em> 21, 577 (1946).</p></div>
</section>
