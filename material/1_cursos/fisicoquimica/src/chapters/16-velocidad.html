<p class="lead">La termodinámica dice qué reacciones pueden ocurrir; la cinética dice cuándo ocurren. El diamante es termodinámicamente inestable respecto del grafito y un diamante dura millones de años; una mezcla de hidrógeno y oxígeno es explosiva solo si alguien le acerca una chispa. Medir la rapidez con que cambia una concentración, y descubrir de qué depende, es el primer paso para entender cómo transcurre una reacción y para controlarla: en un reactor, en el cuerpo de un paciente o en la atmósfera.</p>

<section>
<h2>Velocidad de reacción y ley de velocidad</h2>
<p>Para una reacción \(a\mathrm A+b\mathrm B\to c\mathrm C+d\mathrm D\) en un volumen constante, la <span class="term">velocidad de reacción</span> se define con el avance \(\xi\) (capítulo 5): \(v=\dfrac1V\dfrac{\dd\xi}{\dd t}=-\dfrac1a\dfrac{\dd[\mathrm A]}{\dd t}=\dfrac1c\dfrac{\dd[\mathrm C]}{\dd t}\). No depende de qué especie se mida. Se descubre experimentalmente que casi siempre es una función simple de las concentraciones, la <span class="term">ley de velocidad</span>:</p>
<div class="eq key" data-name="Ley de velocidad">\[v=k\,[\mathrm A]^m[\mathrm B]^n\cdots,\qquad\text{orden total}=m+n+\cdots\]</div>
<p>Los exponentes \(m\), \(n\) son los <em>órdenes parciales</em> y se determinan experimentalmente: <b>no</b> son los coeficientes estequiométricos, salvo en las reacciones elementales (capítulo 18). La constante \(k\) tiene unidades que dependen del orden: s⁻¹ para el primero, L·mol⁻¹·s⁻¹ para el segundo, mol·L⁻¹·s⁻¹ para el cero. Dos métodos clásicos dan los órdenes: el de las <em>velocidades iniciales</em> (se mide \(v\) a tiempo cero con concentraciones iniciales distintas; si al duplicar \([\mathrm A]\) la velocidad se cuadruplica, \(m=2\)) y el del <em>aislamiento</em>, en el que un reactivo está en tan gran exceso que su concentración no cambia y la ley se reduce a un orden aparente (pseudo orden) en los demás.</p>
</section>

<section>
<h2>Leyes integradas: cero, uno y dos</h2>
<p>Integrando la ley de velocidad para una reacción \(\mathrm A\to\) productos se obtienen las <span class="term">leyes integradas</span>, que dan \([\mathrm A]\) en función del tiempo:</p>
<div class="tablewrap"><table>
<tr><th>Orden</th><th class="c">Ley de velocidad</th><th class="c">Ley integrada</th><th class="c">Gráfica lineal</th><th class="c">Vida media</th></tr>
<tr><td>0</td><td class="c">\(v=k\)</td><td class="c">\([\mathrm A]=[\mathrm A]_0-kt\)</td><td class="c">\([\mathrm A]\) frente a \(t\)</td><td class="c">\([\mathrm A]_0/2k\)</td></tr>
<tr><td>1</td><td class="c">\(v=k[\mathrm A]\)</td><td class="c">\([\mathrm A]=[\mathrm A]_0e^{-kt}\)</td><td class="c">\(\ln[\mathrm A]\) frente a \(t\)</td><td class="c">\(\ln2/k\)</td></tr>
<tr><td>2</td><td class="c">\(v=k[\mathrm A]^2\)</td><td class="c">\(\dfrac1{[\mathrm A]}=\dfrac1{[\mathrm A]_0}+kt\)</td><td class="c">\(1/[\mathrm A]\) frente a \(t\)</td><td class="c">\(1/(k[\mathrm A]_0)\)</td></tr>
</table></div>
<p>La <span class="term">vida media</span> \(t_{1/2}\), tiempo en que la concentración cae a la mitad, es una huella del orden: independiente de \([\mathrm A]_0\) en el primer orden (desintegración radiactiva, por eso el carbono-14 tiene \(t_{1/2}=5730\) años cualquiera sea la muestra), proporcional a \([\mathrm A]_0\) en el orden cero e inversamente proporcional en el segundo. Ejemplos reales: la descomposición del N₂O₅ en fase gaseosa es de primer orden con \(k=3.4\times10^{-5}\) s⁻¹ a 25 °C (\(t_{1/2}=5.7\) h); el etanol de la sangre se elimina a velocidad casi constante, de orden cero (la enzima alcohol deshidrogenasa está saturada), unos 0.15 g/L por hora; la saponificación del acetato de etilo con NaOH es de segundo orden con \(k\approx0.11\) L·mol⁻¹·s⁻¹ a 25 °C.</p>
<div class="sim" data-sim="ordenes" data-title="Determinar el orden de una reacción: tres linealizaciones de los mismos datos"></div>
<div class="sim-guide"><ul>
<li>Con orden verdadero 1 y ruido 1.5 %, la gráfica de \(\ln[\mathrm A]\) frente a \(t\) es la más recta (r² cercano a 1) y su pendiente da \(k\). Cambie a orden 2: la de \(1/[\mathrm A]\) es la recta. Y para el orden 0 lo es la de \([\mathrm A]\).</li>
<li>Con ruido alto (8 %) y pocos puntos, las tres rectas se parecen: los datos de un solo orden de magnitud de conversión no discriminan órdenes. Hay que cubrir al menos dos o tres vidas medias, y comparar vidas medias de experimentos con distinta concentración inicial.</li>
<li>Esta es la razón de que se desconfíe de un «r² = 0.98» como prueba de un orden: se necesitan datos con poco ruido y amplia conversión, o un método diferencial.</li>
</ul></div>
</section>

<section>
<h2>Reacciones complejas: reversibles, consecutivas y paralelas</h2>
<p>Una reacción \(\mathrm A\rightleftharpoons\mathrm B\) con \(k_f\) y \(k_b\) relaja hacia el equilibrio con un tiempo característico \(\tau=1/(k_f+k_b)\); en el equilibrio \(k_f[\mathrm A]_{eq}=k_b[\mathrm B]_{eq}\), de modo que \(K=k_f/k_b\): la constante de equilibrio es el cociente de las constantes cinéticas (principio del balance detallado). La cinética no puede contradecir a la termodinámica.</p>
<div class="sim" data-sim="relajacion" data-title="Reacción reversible: relajación hacia el equilibrio"></div>
<div class="sim-guide"><ul>
<li>Con \(k_f=2\) y \(k_b=0.5\): \(K=4\), \(\tau=0.4\) y el equilibrio tiene 20 % de A y 80 % de B. Si se parte de B puro, se llega al mismo equilibrio por el camino inverso con el mismo tiempo \(\tau\).</li>
<li>La velocidad de aproximación depende de la <em>suma</em> \(k_f+k_b\), no de la diferencia: un equilibrio con \(K\) enorme puede alcanzarse en microsegundos o en años, según las constantes.</li>
<li>Las técnicas de relajación (salto de temperatura, de presión) perturban el equilibrio y miden \(\tau\) para obtener \(k_f\) y \(k_b\): así se midieron las reacciones más rápidas en solución (Eigen, Premio Nobel 1967), como \(\mathrm{H^++OH^-\to H_2O}\) con \(k=1.4\times10^{11}\) L·mol⁻¹·s⁻¹.</li>
</ul></div>
<p>En una reacción <span class="term">consecutiva</span> \(\mathrm A\xrightarrow{k_1}\mathrm B\xrightarrow{k_2}\mathrm C\) el intermedio B se forma y se consume: su concentración sube hasta un máximo en \(t_{max}=\ln(k_1/k_2)/(k_1-k_2)\) y luego baja. Cuando una de las etapas es mucho más lenta que la otra, la global la sigue: es la <em>etapa limitante</em>. Si \(k_2\gg k_1\), el intermedio nunca se acumula y su concentración es casi estacionaria, \([\mathrm B]\approx(k_1/k_2)[\mathrm A]\): es la base de la aproximación del estado estacionario del capítulo 18.</p>
<div class="sim" data-sim="consecutivas" data-title="Reacciones consecutivas A → B → C: el intermedio y la etapa limitante"></div>
<div class="sim-guide"><ul>
<li>Con \(k_1=1\) y \(k_2=0.4\): B pasa por un máximo de 0.54 en \(t=1.53\). Con \(k_2\) más rápido (4), el máximo baja a 0.16 (en \(t=0.46\)) y B casi no se acumula: es el intermedio reactivo (un radical, un carbocatión).</li>
<li>Con \(k_1\ll k_2\) active la aproximación estacionaria: la curva de trazos \((k_1/k_2)e^{-k_1t}\) reproduce el intermedio salvo en el período de inducción inicial.</li>
<li>El integrador numérico de Dormand–Prince coincide con la solución analítica con error relativo de \(10^{-9}\) o menor: es el que se usa en este curso cuando no hay solución analítica (capítulos 18–21).</li>
</ul></div>
<h3>Pseudo primer orden</h3>
<p>Una reacción de segundo orden \(\mathrm A+\mathrm B\to\) productos, \(v=k_2[\mathrm A][\mathrm B]\), se reduce a un primer orden aparente si \([\mathrm B]_0\gg[\mathrm A]_0\): \([\mathrm B]\approx[\mathrm B]_0\) y \(v=k'[\mathrm A]\) con \(k'=k_2[\mathrm B]_0\). Midiendo \(k'\) a varias concentraciones de B, la pendiente de \(k'\) frente a \([\mathrm B]_0\) da \(k_2\), y la ordenada en el origen detecta un camino paralelo independiente de B.</p>
<div class="sim" data-sim="pseudoprimer" data-title="Aislamiento: pseudo primer orden y su error"></div>
<div class="sim-guide"><ul>
<li>Con un exceso de 50 veces (\([\mathrm B]_0=50[\mathrm A]_0\)) la aproximación comete un error de solo 0.4 % en la concentración al tiempo de vida media; con un exceso de 10, de 1.9 %; con exceso de 2, de 9 %. La regla práctica es un exceso de 10 a 20 veces.</li>
<li>La gráfica de la derecha, \(k'\) frente a \([\mathrm B]_0\), es una recta por el origen con pendiente \(k_2\): es el método para obtener la constante de segundo orden con reactivos baratos y un solo seguimiento espectrofotométrico.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>La descomposición del N₂O₅ es de primer orden con \(k=3.4\times10^{-5}\) s⁻¹. ¿Cuánto tarda en descomponerse el 90 %?
<details><summary>Respuesta</summary><p>\(t=\ln(10)/k=2.303/3.4\times10^{-5}=6.8\times10^4\) s = 18.8 h.</p></details></li>
<li><span class="lvl">Básico</span>El carbono-14 tiene \(t_{1/2}=5730\) años. ¿Qué fracción queda en un hueso de 17 190 años?
<details><summary>Respuesta</summary><p>17 190 años son tres vidas medias: \((1/2)^3=0.125\), un 12.5 %.</p></details></li>
<li><span class="lvl">Intermedio</span>La velocidad inicial de una reacción \(\mathrm A+\mathrm B\to\mathrm P\) es 2.0, 4.0 y 8.0 mmol/L·s para \(([\mathrm A],[\mathrm B])\) = (0.1, 0.1), (0.2, 0.1), (0.2, 0.2) mol/L. Halle los órdenes y \(k\).
<details><summary>Respuesta</summary><p>Al duplicar A, \(v\) se duplica: \(m=1\). Al duplicar B (con A fija), \(v\) se duplica: \(n=1\). \(k=v/([\mathrm A][\mathrm B])=2.0\times10^{-3}/(0.1\times0.1)=0.20\) L·mol⁻¹·s⁻¹.</p></details></li>
<li><span class="lvl">Intermedio</span>Para \(\mathrm A\to\mathrm B\to\mathrm C\) con \(k_1=0.5\) min⁻¹ y \(k_2=0.1\) min⁻¹, ¿cuándo es máxima la concentración de B y cuánto vale (fracción de \([\mathrm A]_0\))?
<details><summary>Respuesta</summary><p>\(t_{max}=\ln(0.5/0.1)/(0.5-0.1)=4.02\) min. \([\mathrm B]_{max}/[\mathrm A]_0=(k_1/(k_2-k_1))(e^{-k_1t}-e^{-k_2t})=(0.5/-0.4)(0.134-0.669)=0.669\).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que la vida media de una reacción de orden \(n\) es proporcional a \([\mathrm A]_0^{1-n}\) y úselo para identificar el orden si \(t_{1/2}\) se duplica al duplicar \([\mathrm A]_0\).
<details><summary>Respuesta</summary><p>Integrando \(-\dd[\mathrm A]/\dd t=k[\mathrm A]^n\) entre \([\mathrm A]_0\) y \([\mathrm A]_0/2\): \(t_{1/2}=\dfrac{2^{n-1}-1}{(n-1)k}[\mathrm A]_0^{1-n}\). Si al duplicar \([\mathrm A]_0\) la vida media se duplica, \(2^{1-n}=2\) y \(n=0\): reacción de orden cero.</p></details></li>
</ol>
