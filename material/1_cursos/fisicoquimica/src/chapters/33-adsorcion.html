<template class="chapter-src" data-id="adsorcion" data-num="33" data-title="Adsorción en superficies" data-part="Parte VII · Superficies, coloides y macromoléculas" data-short="Fisisorción y quimisorción, isoterma de Langmuir y sus variantes, Freundlich, BET y área superficial, calor isostérico, desorción térmica programada y fórmula de Redhead">
<p class="lead">Un gramo de carbón activado tiene más área que una cancha de fútbol, y esa área es lo que le sirve: adsorbe gases, olores, colorantes y fármacos en exceso. La <em>adsorción</em> (acumulación de moléculas en una superficie) es la primera etapa de toda catálisis heterogénea (capítulo 19), la base de la cromatografía y de los filtros, y la forma estándar de medir el área de un sólido poroso. Este capítulo trata las isotermas más usadas, el método de Brunauer–Emmett–Teller (BET) y la técnica de desorción térmica programada con que se mide la fuerza de la unión.</p>

<section>
<h2>Fisisorción y quimisorción</h2>
<p>Hay dos clases. En la <span class="term">fisisorción</span> la molécula se une por fuerzas de van der Waals (capítulo 7): calor de adsorción de 5 a 40 kJ/mol (cercano al de licuación), reversible, sin saturación a una sola capa (puede formar multicapas), y a temperaturas bajas. En la <span class="term">quimisorción</span> se forma un enlace químico con la superficie: 40–400 kJ/mol, a menudo activada e irreversible, en una sola capa. La H₂ sobre platino se quimisorbe disociándose; el N₂ sobre una superficie de carbón, a 77 K, se fisisorbe. El balance termodinámico es de entropía y entalpía: como la molécula pierde grados de libertad al adsorberse, \(\Delta S<0\), y la adsorción es espontánea solo si \(\Delta H\) es suficientemente negativo (\(\Delta G=\Delta H-T\Delta S<0\)): por eso la adsorción se favorece al enfriar y al subir la presión (Le Châtelier).</p>
</section>

<section>
<h2>La isoterma de Langmuir y otras</h2>
<p>Langmuir (1916; Nobel de Química 1932) supuso una superficie con \(N_s\) sitios equivalentes e independientes y adsorción en una sola capa. La velocidad de adsorción es \(k_aP(1-\theta)\) y la de desorción \(k_d\theta\); en equilibrio (balance detallado, capítulo 18):</p>
<div class="eq key" data-name="Isoterma de Langmuir">\[\theta=\frac{KP}{1+KP},\quad K=\frac{k_a}{k_d}=K_0e^{q/RT};\quad\frac P\theta=\frac1K+P;\qquad\text{disociativa: }\theta=\frac{\sqrt{KP}}{1+\sqrt{KP}};\quad\text{competitiva: }\theta_i=\frac{K_iP_i}{1+\sum_jK_jP_j}.\]</div>
<p>A presión baja \(\theta\approx KP\) (ley de Henry); a presión alta, \(\theta\to1\) (saturación de la monocapa). Si la molécula se disocia al adsorberse (H₂ en Pt, ocupa dos sitios), \(\theta\propto P^{1/2}\) a baja presión. Con dos gases que compiten, el de mayor \(K\) ocupa más sitios, que es la causa del envenenamiento de los catalizadores (el CO sobre Pt). La isoterma empírica de Freundlich, \(n=kP^{1/n}\), describe superficies con una distribución de energías de adsorción y no satura.</p>
<div class="sim" data-sim="isotermas" data-title="Isotermas de Langmuir, Langmuir disociativa, Freundlich y BET con sus linealizaciones"></div>
<div class="sim-guide"><ul>
<li>Langmuir con \(K=5\): la mitad de los sitios están ocupados a \(P=1/K=0.2\); la gráfica de \(P/\theta\) frente a \(P\) es una recta de pendiente 1 y ordenada \(1/K\), de donde se obtiene \(K\). La cobertura disociativa sube más despacio (\(P^{1/2}\)) y necesita presiones mayores para llenar la monocapa.</li>
<li>BET: con \(C=5\) la isoterma es casi lineal hasta \(x\approx0.4\) y se dispara cerca de \(P_0\) (condensación en multicapas); con \(C=100\) tiene un codo definido en \(x\approx1/(1+\sqrt C)=0.09\) que marca la monocapa completa (isoterma tipo II). La linealización \(x/[n(1-x)]\) frente a \(x\) da \(n_m\) y \(C\).</li>
</ul></div>
</section>

<section>
<h2>Área superficial: el método BET</h2>
<p>Brunauer, Emmett y Teller (1938) extendieron la idea de Langmuir a multicapas: la primera capa se une con un calor \(q_1\); las siguientes, con el calor de licuación \(q_L\). El resultado, con \(x=P/P_0\) y \(C\approx e^{(q_1-q_L)/RT}\):</p>
<div class="eq key" data-name="Isoterma BET">\[\frac n{n_m}=\frac{Cx}{(1-x)\bigl[1+(C-1)x\bigr]}\ \Longleftrightarrow\ \frac x{n(1-x)}=\frac1{n_mC}+\frac{C-1}{n_mC}\,x,\qquad S_\mathrm{BET}=\frac{n_m}{22\,414}N_A\sigma.\]</div>
<p>Una recta de \(x/[n(1-x)]\) frente a \(x\) en \(0.05<x<0.30\) da \(n_m\) (la cantidad de gas que forma una monocapa; \(1/(\mathrm{pendiente}+\mathrm{ordenada})\)) y \(C\) (\(1+\mathrm{pendiente}/\mathrm{ordenada}\)). El área se obtiene multiplicando el número de moléculas de la monocapa por el área que ocupa cada una (\(\sigma(\mathrm{N_2})=0.162\) nm² a 77 K). La norma ISO 9277 y las recomendaciones de Rouquerol (2007) piden verificar que \(n(1-x)\) aumente con \(x\) en el intervalo elegido y que la ordenada sea positiva; para materiales microporosos el método da áreas «aparentes».</p>
<div class="sim" data-sim="bet-area" data-title="Medida del área BET con datos de adsorción de N₂ y el efecto del intervalo de ajuste"></div>
<div class="sim-guide"><ul>
<li>Un sólido de 250 m²/g con \(C=90\): \(n_m=57.4\) cm³/g de N₂. Con el ajuste en \(0.05<x<0.30\), se obtiene \(n_m=57.6\), \(C=87\) y un área de 251 m²/g (0.3 % de error, con 1 % de ruido en los datos). Reducir el intervalo a 0.02–0.10 da 4.5 cm³ para un sólido de 20 m²/g y un error de −1.5 %: con intervalos muy estrechos el ruido se amplifica en la ordenada.</li>
<li>La constante \(C=90\) corresponde a una energía neta de adsorción de la primera capa de \(RT\ln C\approx2.9\) kJ/mol sobre el calor de licuación del N₂ (5.6 kJ/mol): típica de un óxido o carbón. \(C<20\) indica interacción débil con el sólido (el codo se desdibuja y el área es incierta); \(C>200\), microporos.</li>
<li>Los datos de este simulador son BET ideales más ruido. En materiales reales el ajuste solo es lineal en una región acotada y hay que aplicar los criterios de Rouquerol para elegirla.</li>
</ul></div>
</section>

<section>
<h2>Desorción térmica programada</h2>
<p>Para medir cuán fuerte se une una molécula a una superficie, se adsorbe en frío (en vacío) y se calienta la muestra con una rampa lineal \(T=T_0+\beta t\) mientras un espectrómetro de masas registra lo que se desprende. Para una desorción de primer orden (Polanyi–Wigner), \(-\dd\theta/\dd t=\nu\theta e^{-E_d/RT}\), la velocidad pasa por un máximo a \(T_p\), que crece con la energía de desorción y con la velocidad de calentamiento. Redhead (1962) dedujo la relación para primer orden con \(\nu\) independiente de la cobertura:</p>
<div class="eq key" data-name="Fórmula de Redhead">\[\frac{E_d}{RT_p^2}=\frac\nu\beta e^{-E_d/RT_p}\ \Rightarrow\ E_d\approx RT_p\left[\ln\frac{\nu T_p}\beta-3.46\right].\]</div>
<div class="sim" data-sim="tpd" data-title="Desorción térmica programada y análisis de Redhead"></div>
<div class="sim-guide"><ul>
<li>Con \(E_d=120\) kJ/mol, \(\nu=10^{13}\) s⁻¹ y \(\beta=2\) K/s: pico a \(T_p=452.6\) K (la fórmula de Redhead da 452.5 K); invertida, da \(E_d=120.01\) kJ/mol. Con \(E_d=60\) kJ/mol: 231 K. Subir \(\beta\) a 20 K/s mueve el pico a 248 K: el pico se desplaza con \(\ln\beta\) y la pendiente de \(\ln(T_p^2/\beta)\) frente a \(1/T_p\) da \(E_d\) sin conocer \(\nu\) (método de variación de \(\beta\)).</li>
<li>Con \(\nu=10^{10}\) s⁻¹ (una molécula con más pérdida de entropía al adsorberse), \(T_p=318\) K; usar por error \(10^{13}\) en el análisis da \(E_d\) con un error de 1.5 %; el error crece si \(\nu\) cambia más, por lo que el preexponencial es la fuente principal de incertidumbre.</li>
</ul></div>
<div class="box note"><h4>El calor isostérico</h4><p>Con isotermas a varias temperaturas, el calor de adsorción a cobertura constante es \(q_\mathrm{st}=-R\,[\partial\ln P/\partial(1/T)]_\theta\) (ecuación de Clausius–Clapeyron aplicada a la fase adsorbida). Para Langmuir, \(q_\mathrm{st}=q\) (constante). Con datos de \(\theta=0.4\) a 280–340 K generados con \(q=25\) kJ/mol, el ajuste lineal de \(\ln P\) frente a \(1/T\) devuelve 25.00 kJ/mol; si \(q_\mathrm{st}\) disminuye al aumentar \(\theta\), la superficie es heterogénea (primero se llenan los sitios más fuertes).</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un gas se adsorbe con \(K=0.20\) kPa⁻¹ (Langmuir). Calcule \(\theta\) a 1, 5 y 50 kPa, y la presión para \(\theta=0.9\).
<details><summary>Respuesta</summary><p>\(\theta=KP/(1+KP)\): 0.167, 0.500, 0.909. \(P=\theta/[(1-\theta)K]=0.9/(0.1\times0.20)=45\) kPa.</p></details></li>
<li><span class="lvl">Básico</span>Un sólido adsorbe monocapa de \(n_m=40\) cm³ (STP) de N₂ por gramo. Calcule el área BET con \(\sigma=0.162\) nm².
<details><summary>Respuesta</summary><p>\(S=(40/22414)(6.022\times10^{23})(0.162\times10^{-18})=174\) m²/g.</p></details></li>
<li><span class="lvl">Intermedio</span>Los datos BET de un sólido en \(0.05<x<0.30\) dan una recta con pendiente \(2.97\times10^{-2}\) g/cm³ y ordenada \(3.3\times10^{-4}\) g/cm³. Halle \(n_m\), \(C\) y el área.
<details><summary>Respuesta</summary><p>\(n_m=1/(m+b)=1/(0.0297+0.00033)=33.3\) cm³/g; \(C=m/b+1=90+1=91\); \(S=(33.3/22414)(6.022\times10^{23})(0.162\times10^{-18})=145\) m²/g.</p></details></li>
<li><span class="lvl">Intermedio</span>Un pico de desorción de CO sobre Pd aparece a 480 K con \(\beta=3\) K/s. Con \(\nu=10^{13}\) s⁻¹, estime \(E_d\) por Redhead.
<details><summary>Respuesta</summary><p>\(E_d=RT_p[\ln(\nu T_p/\beta)-3.46]=8.314(480)[\ln(10^{13}\times480/3)-3.46]=3991\,[35.0-3.46]\). Con \(\ln(10^{13}\times480/3)=\ln(1.6\times10^{15})=35.0\): \(E_d=3991\times31.5=126\) kJ/mol.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre la condición de máximo de Redhead derivando la velocidad \(r=\nu\theta e^{-E/RT}\) respecto del tiempo.
<details><summary>Respuesta</summary><p>\(\dd r/\dd t=\nu e^{-E/RT}\,[\dot\theta+\theta\,(E\dot T/RT^2)]\) con \(\dot\theta=-\nu\theta e^{-E/RT}\) y \(\dot T=\beta\). En el máximo \(\dd r/\dd t=0\): \(\nu e^{-E/RT_p}=E\beta/(RT_p^2)\), es decir, \(E/(RT_p^2)=(\nu/\beta)e^{-E/RT_p}\). Tomando logaritmos, \(E/RT_p=\ln(\nu T_p/\beta)-\ln(E/RT_p)\), y como \(\ln(E/RT_p)\) varía poco (≈ 3.46 para \(E/RT_p\) entre 25 y 40), resulta \(E=RT_p[\ln(\nu T_p/\beta)-3.46]\).</p></details></li>
</ol>
