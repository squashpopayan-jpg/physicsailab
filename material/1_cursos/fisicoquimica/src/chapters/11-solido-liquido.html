<p class="lead">Una soldadura de plomo y estaño funde a 183 °C, mucho menos que el plomo (327 °C) o el estaño (232 °C) por separado. La sal de las carreteras derrite el hielo hasta −21 °C, y un chocolate bien templado se solidifica en el punto exacto. En todos los casos, mezclar baja la temperatura de fusión: es el mismo fenómeno de las propiedades coligativas (capítulo 10) llevado hasta sus consecuencias en un diagrama completo, donde aparece el <em>eutéctico</em>, la mezcla de menor temperatura de fusión.</p>

<section>
<h2>Solubilidad ideal de un sólido</h2>
<p>Un sólido \(B\) en equilibrio con su disolución líquida cumple \(\mu_B^{sol}(T)=\mu_B^{liq}(T,x_B)\). Con \(\mu^{liq}_B=\mu^{*liq}_B+RT\ln x_B\) (disolución ideal) y la diferencia \(\mu_B^{*liq}-\mu_B^{*sol}=\Delta_{fus}H(1-T/T_m)\) (capítulo 4, ignorando \(\Delta C_p\)), resulta la ecuación de Schröder–van Laar (1893–1903):</p>
<div class="eq key" data-name="Solubilidad ideal de un sólido">\[\ln x_B=-\frac{\Delta_{fus}H}{R}\left(\frac1T-\frac1{T_m}\right).\]</div>
<p>Es la <span class="term">curva de liquidus</span>: a la temperatura \(T\), la fracción molar del soluto en la disolución saturada. Solo depende de las propiedades del soluto puro, \(T_m\) y \(\Delta_{fus}H\); no depende de cuál sea el disolvente, mientras la disolución sea ideal. Para el naftaleno (\(T_m=353.35\) K, \(\Delta_{fus}H=18.8\) kJ/mol) a 25 °C da \(x=0.306\), cerca de los valores experimentales en disolventes parecidos como el benceno (alrededor de 0.29). Un soluto con mayor punto de fusión y mayor entalpía de fusión es menos soluble: por eso el antraceno (\(T_m=489\) K) se disuelve mucho menos que el naftaleno.</p>
<p>Aplicada a las dos sustancias de una mezcla binaria que cristalizan por separado (sin solubilidad sólida), la ecuación da dos curvas de liquidus, una por cada componente, que se cortan en el <span class="term">punto eutéctico</span>, donde el líquido está saturado de ambos. Allí el sistema, a presión constante, tiene \(F=C-P+1=2-3+1=0\) grados de libertad: una temperatura y una composición únicas, que son las más bajas a las que la mezcla puede ser líquida.</p>
<div class="sim" data-sim="eutectico" data-title="Diagrama de fases binario con eutéctico: liquidus ideal y fases en cada punto"></div>
<div class="sim-guide"><ul>
<li>Bi–Cd: el modelo ideal predice un eutéctico a 408 K (135 °C) con 56.5 % molar de Cd; los diagramas publicados lo ubican en el entorno de 140 °C, con composición parecida. Es el caso clásico de aleación casi ideal en el estado líquido.</li>
<li>Pb–Sn: la teoría ideal falla. Predice un eutéctico a 353 K (80 °C) pero el experimento da 456 K (183 °C), con 73.9 % molar de estaño (61.9 % en masa). Lo explica la desviación positiva fuerte del plomo y el estaño líquidos y la solubilidad parcial en estado sólido.</li>
<li>Elija una composición \(z=0.3\) y baje la temperatura: aparecen los primeros cristales al cruzar el liquidus, el líquido se enriquece en el otro componente a lo largo de la curva y, en el eutéctico, todo el líquido restante cristaliza a la vez. La fracción de cada fase se lee con la regla de la palanca.</li>
<li>Por debajo de la temperatura del eutéctico no hay líquido: las dos fases sólidas puras (sin solubilidad mutua en este modelo) coexisten.</li>
</ul></div>
</section>

<section>
<h2>Análisis térmico: curvas de enfriamiento</h2>
<p>La forma experimental de construir un diagrama de fases sólido–líquido es registrar la temperatura de la muestra al enfriarla a velocidad constante: es el <span class="term">análisis térmico</span>. En un componente puro, la temperatura cae, se detiene en una meseta mientras funde o solidifica (\(F=0\)) y vuelve a caer. En una mezcla, el primer cristal aparece en la temperatura del liquidus y el enfriamiento continúa a menor ritmo, porque el calor latente de los cristales retiene la temperatura (\(F=1\)): hay un <em>quiebre</em>. En el eutéctico, el resto del líquido solidifica a temperatura constante: la <em>meseta eutéctica</em>, cuya duración es proporcional a la cantidad de líquido que quedaba, máxima para la composición eutéctica.</p>
<div class="sim" data-sim="enfriamiento" data-title="Curvas de enfriamiento de una aleación: quiebre del liquidus y meseta eutéctica"></div>
<div class="sim-guide"><ul>
<li>Con \(z=0.3\) (Bi–Cd): un quiebre hacia 476 K y una meseta en 408 K. Con la composición eutéctica (\(z=0.56\)) desaparece el primer quiebre y la meseta es lo único que se ve. Con \(z\) cercano a 0 o a 1, la meseta eutéctica se encoge hacia cero.</li>
<li>La longitud de la meseta, graficada frente a \(z\), vale cero en los componentes puros y es máxima en el eutéctico: la manera de ubicar su composición con precisión es el «triángulo de Tammann».</li>
<li>Es el principio del soldador: las aleaciones eutécticas (63 % Sn–37 % Pb) pasan de líquido a sólido en una sola temperatura, sin etapa pastosa, y por eso las uniones no se mueven al solidificar.</li>
</ul></div>
</section>

<section>
<h2>El agua y la sal: derretir hielo</h2>
<p>El hielo en contacto con salmuera está en equilibrio cuando la actividad del agua en la disolución iguala la del hielo a esa temperatura: es la curva de congelación del capítulo 10. La curva se extiende hasta el eutéctico, a −21.1 °C y 23.3 % en masa de NaCl, donde empieza a cristalizar el dihidrato NaCl·2H₂O; a mayor concentración, la curva de solubilidad de la sal sube hacia la derecha. Es el diagrama completo del sistema agua–sal, y con el modelo de Pitzer para el coeficiente osmótico (capítulo 10) se reproduce la curva del hielo hasta el eutéctico con un error menor de 0.5 °C.</p>
<div class="sim" data-sim="sal-hielo" data-title="El diagrama agua–NaCl: hielo, salmuera y sal sólida"></div>
<div class="sim-guide"><ul>
<li>Con 10 % de NaCl, la disolución congela a −6.8 °C; con 20 %, a −17.0 °C; con la composición eutéctica (23.3 %), a −21.5 °C en el modelo (−21.1 °C experimentales). Más sal no sirve: pasado el eutéctico, la sal sobrante precipita y la salmuera mantiene 23–26 %, y no congela por debajo de −21.1 °C.</li>
<li>A −8 °C con 10 % de sal, el sistema es salmuera y hielo: la regla de la palanca dice cuánta salmuera hay (en la práctica, cuánto hielo se funde con esa cantidad de sal). A −15 °C hay que añadir más del doble de sal para derretir la misma masa de hielo: por eso la sal es ineficaz bajo −10 °C y se usan cloruros de calcio o magnesio (el eutéctico del CaCl₂ está cerca de −50 °C).</li>
<li>Mezcla frigorífica de laboratorio: hielo triturado con sal en proporción 3:1 llega a −18 °C, cerca del eutéctico. Mientras el hielo se funde en la salmuera, absorbe su calor latente (6 kJ/mol) y enfría la mezcla: así se hacían los helados caseros antes de los refrigeradores.</li>
</ul></div>
<div class="box ex"><h4>¿Cuánta salmuera hay a −10 °C?</h4>
<p>Se mezclan 100 g de hielo con 15 g de NaCl y la mezcla se mantiene a −10 °C. ¿Cuánto hielo queda?</p>
<details><summary>Solución</summary><p>La composición global es \(15/115=13.0\) % de NaCl. La salmuera a −10 °C tiene unos 13.7 % de NaCl (curva del hielo del modelo; la tabla CRC da 14 %). Por la regla de la palanca, la fracción de salmuera es \(13.0/13.7=0.95\): quedan 109 g de salmuera y unos 6 g de hielo.</p></details>
</div>
</section>

<section>
<h2>Soluciones sólidas, compuestos y diagramas ternarios</h2>
<p>El modelo de eutéctico simple supone que los sólidos son puros e inmiscibles. Los diagramas de fases reales son más ricos. Cuando los dos componentes se parecen en tamaño, estructura y electronegatividad (reglas de Hume-Rothery), forman una <em>disolución sólida</em> continua: es el caso del cobre y el níquel (diagrama en forma de «huso»). Si la solubilidad sólida es parcial, aparecen fases terminales. Un <em>compuesto intermedio</em> (como el NaCl·2H₂O) aparece como una vertical en el diagrama que divide el sistema en dos subsistemas eutécticos, y la <em>reacción peritéctica</em> (un líquido y un sólido que reaccionan para dar otro sólido) lo hace en los compuestos que funden de manera incongruente.</p>
<p>Con tres componentes, la regla de las fases da \(F=C-P+1=4-P\) a presión constante, y el diagrama es un prisma triangular cuya sección isoterma se dibuja en el <span class="term">triángulo de Gibbs</span> (o de Roozeboom): cada vértice es un componente puro, y la composición de cualquier punto se lee con tres coordenadas que suman 1. Tres propiedades lo hacen indispensable: (i) los puntos sobre una recta paralela a un lado tienen la misma fracción del componente del vértice opuesto; (ii) los puntos sobre una recta que sale de un vértice tienen una relación constante entre los otros dos componentes; (iii) al mezclar dos mezclas, el resultado cae sobre el segmento que las une, y la regla de la palanca da su posición.</p>
<div class="sim" data-sim="triangulo" data-title="Triángulo de Gibbs: leer composiciones y mezclar dos muestras"></div>
<div class="sim-guide"><ul>
<li>Las tres coordenadas de la mezcla 1 (0.6, 0.2, 0.2) suman 1: dos sliders fijan el punto y el tercero resulta. Un punto sobre el lado BC no tiene A; un punto sobre la altura que sale de A tiene siempre B = C.</li>
<li>Mezcle 1 kg de la mezcla 1 con 1 kg de la 2: la resultante (0.35, 0.25, 0.40) está en el punto medio del segmento. Si la masa de la 1 es 3 veces la de la 2, el punto está tres cuartos del camino hacia la 1.</li>
<li>Se usa en extracción líquido–líquido (agua–ácido acético–éter), en metalurgia (Pb–Sn–Zn), en suelos (arena–limo–arcilla) y en mezclas de combustible: siempre que se trate de tres componentes que suman 100 %.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Estime la solubilidad ideal del naftaleno (\(T_m=353.35\) K, \(\Delta_{fus}H=18.8\) kJ/mol) a 40 °C.
<details><summary>Respuesta</summary><p>\(\ln x=-(18\,800/8.3145)(1/313.15-1/353.35)=-2261(3.633\times10^{-4})=-0.8215\), \(x=0.44\).</p></details></li>
<li><span class="lvl">Básico</span>Una aleación Pb–Sn con 61.9 % en masa de Sn se enfría desde 250 °C. ¿Qué se observa en la curva de enfriamiento?
<details><summary>Respuesta</summary><p>Es la composición eutéctica: la temperatura baja hasta 183 °C, se mantiene una meseta mientras todo el líquido solidifica a la vez (dos sólidos, Pb y Sn, en láminas finas) y luego sigue bajando.</p></details></li>
<li><span class="lvl">Intermedio</span>Una disolución con 20 % en masa de NaCl se enfría hasta −17 °C. ¿Cuánto hielo se forma por cada 100 g de disolución?
<details><summary>Respuesta</summary><p>A −17 °C la salmuera de equilibrio tiene 20 % de NaCl, así que apenas comienza a aparecer hielo. A −19 °C la salmuera tiene unos 21.5 %: \(f_{salmuera}=20/21.5=0.93\), es decir, 7 g de hielo por 100 g de disolución.</p></details></li>
<li><span class="lvl">Intermedio</span>Se mezclan 200 g de una mezcla ternaria (40 % A, 30 % B, 30 % C) con 100 g de otra (10 % A, 60 % B, 30 % C). ¿Cuál es la composición final?
<details><summary>Respuesta</summary><p>Masas: A = 80+10 = 90 g; B = 60+60 = 120 g; C = 60+30 = 90 g, en 300 g. Composición: 30 %, 40 %, 30 %. En el triángulo es el punto a un tercio del camino desde la primera mezcla hacia la segunda.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que las dos curvas de liquidus de un sistema ideal se cortan solo a una temperatura, y que esa temperatura es inferior a la menor de las dos temperaturas de fusión.
<details><summary>Respuesta</summary><p>Las dos curvas \(x_A(T)\) y \(x_B(T)\) son crecientes en \(T\), de modo que \(x_A+x_B\) es creciente. En la menor \(T_m\) (digamos la de A), \(x_A=1\) y \(x_B>0\): suma mayor que 1. A \(T\to0\), la suma tiende a 0. Por continuidad y monotonía, hay un único \(T_E\) con suma 1, y \(T_E<T_m\).</p></details></li>
</ol>
