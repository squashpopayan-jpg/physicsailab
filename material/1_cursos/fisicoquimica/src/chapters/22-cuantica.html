<p class="lead">Hasta aquí la fisicoquímica ha tratado la materia con la termodinámica y la cinética, que no preguntan por qué una molécula es como es. Esta parte responde. Se parte de la mecánica cuántica con los pocos problemas que tienen solución exacta (la caja, la barrera, el oscilador y el rotor) y se verá que son, además, los modelos con los que se interpretan los espectros de las moléculas reales: la vibración de un enlace es un oscilador, la rotación de una molécula es un rotor, y el paso de un protón por una barrera es un túnel.</p>

<section>
<h2>Los postulados en una página</h2>
<ul>
<li><strong>Estado.</strong> Un sistema se describe por una función de onda \(\Psi(\mathbf r,t)\); \(|\Psi|^2\,\dd V\) es la probabilidad de hallar la partícula en \(\dd V\) (Born, 1926), y exige \(\int|\Psi|^2\dd V=1\).</li>
<li><strong>Observables.</strong> A cada magnitud corresponde un operador hermítico: \(\hat x=x\), \(\hat p=-i\hbar\,\partial/\partial x\), \(\hat H=-\tfrac{\hbar^2}{2m}\nabla^2+V\). Los valores posibles de una medida son los valores propios del operador, y el promedio es \(\langle A\rangle=\int\Psi^*\hat A\Psi\,\dd V\).</li>
<li><strong>Dinámica.</strong> \(i\hbar\,\partial\Psi/\partial t=\hat H\Psi\). Para \(V\) independiente del tiempo hay <em>estados estacionarios</em> \(\Psi=\psi(\mathbf r)e^{-iEt/\hbar}\) con \(\hat H\psi=E\psi\): ecuación de Schrödinger independiente del tiempo, cuyas soluciones aceptables (normalizables y continuas) existen solo para ciertos \(E\): la cuantización es consecuencia de las condiciones de contorno.</li>
<li><strong>Incertidumbre.</strong> Dos observables que no conmutan, \([\hat A,\hat B]=i\hbar C\), no se miden a la vez con precisión arbitraria: \(\Delta A\,\Delta B\ge\tfrac12|\langle[\hat A,\hat B]\rangle|\); para posición y momento, \(\Delta x\Delta p\ge\hbar/2\) (Heisenberg, 1927; la forma con desviaciones típicas es de Kennard).</li>
</ul>
<p>En unidades atómicas (\(\hbar=m_e=e=4\pi\varepsilon_0=1\)) la energía se mide en hartree (1 Eh = 27.2114 eV = 2625.50 kJ/mol = 219 474.6 cm⁻¹) y la longitud en bohr (0.529177 Å). Todos los cálculos de los capítulos siguientes están en ellas.</p>
</section>

<section>
<h2>La partícula en una caja</h2>
<p>El problema más simple: una partícula de masa \(m\) con \(V=0\) dentro de \(0<x<L\) y \(V=\infty\) fuera. La función debe anularse en las paredes, lo que da ondas estacionarias:</p>
<div class="eq key" data-name="Partícula en una caja unidimensional">\[\psi_n(x)=\sqrt{\frac2L}\sin\frac{n\pi x}{L},\qquad E_n=\frac{n^2h^2}{8mL^2}=\frac{n^2\pi^2\hbar^2}{2mL^2},\quad n=1,2,\dots\]</div>
<p>Tres lecciones. (i) La energía mínima no es cero: \(E_1>0\) (energía de punto cero), como exige la incertidumbre, pues confinar la partícula en \(L\) obliga a \(\Delta p\sim\hbar/L\). Con \(\langle x^2\rangle\) y \(\langle p^2\rangle\) exactos, \(\Delta x\Delta p=\tfrac\hbar2\sqrt{n^2\pi^2/3-2}\): 1.136 veces el mínimo para \(n=1\). (ii) Los niveles se separan como \(n^2\) y como \(1/(mL^2)\): una molécula en un espacio pequeño tiene niveles muy espaciados; una pelota en una habitación, no. (iii) Para \(n\) grande la densidad de probabilidad se hace uniforme: el límite clásico.</p>
<div class="sim" data-sim="caja" data-title="Partícula en una caja: niveles, funciones de onda y escalas de energía"></div>
<div class="sim-guide"><ul>
<li>Un electrón en una caja de 1 nm (el tamaño de una molécula grande) tiene \(E_1=0.376\) eV (36 kJ/mol); la transición 1 → 2 cuesta 1.13 eV, que corresponde a 1099 nm, en el infrarrojo cercano. Con 0.2 nm (un enlace), \(E_1=9.4\) eV y la transición cae en 44 nm, en el ultravioleta lejano: la confinación a escala atómica da energías electrónicas de eV, que es lo observado.</li>
<li>La misma caja de 1 nm con un protón da \(E_1=2.0\times10^{-4}\) eV, 0.008 \(k_BT\) a 298 K: la cuantización no se ve. Esa es la razón de que el movimiento traslacional de los gases se trate clásicamente en la mecánica estadística (capítulo 29): sus niveles están separados por mucho menos que \(k_BT\).</li>
</ul></div>
<div class="box note"><h4>Sobre los colorantes</h4><p>Los electrones \(\pi\) de una cadena conjugada se comportan, groseramente, como partículas en una caja a lo largo de la cadena, y la diferencia HOMO–LUMO como una transición \(n\to n+1\); el modelo de electrones libres reproduce que la absorción se desplaza al visible al alargar la cadena. Para números concretos es mejor la teoría de Hückel del capítulo 24.</p></div>
</section>

<section>
<h2>El efecto túnel</h2>
<p>Una partícula de energía \(E<V_0\) que choca contra una barrera de altura \(V_0\) y espesor \(a\) tiene, en mecánica clásica, probabilidad cero de pasar. En la cuántica, dentro de la barrera \(\psi\) decae como \(e^{-\kappa x}\) con \(\kappa=\sqrt{2m(V_0-E)}/\hbar\), y como no se anula del todo, hay una cola al otro lado. La transmisión exacta de una barrera rectangular es</p>
<div class="eq key" data-name="Transmisión de una barrera rectangular (E < V₀)">\[T=\left[1+\frac{V_0^2\sinh^2\kappa a}{4E(V_0-E)}\right]^{-1}\approx\frac{16E(V_0-E)}{V_0^2}\,e^{-2\kappa a}\quad(\kappa a\gg1).\]</div>
<p>El factor \(e^{-2\kappa a}\) es exponencialmente sensible a la masa, al espesor y a la altura, y de ahí salen las aplicaciones: el microscopio de efecto túnel (corriente \(\propto e^{-2\kappa a}\), con cambio de un orden de magnitud por cada 0.1 nm de separación punta–muestra), la desintegración alfa, la inversión del amoníaco y los saltos de electrones en las proteínas.</p>
<div class="sim" data-sim="tunel" data-title="Efecto túnel a través de una barrera rectangular para el electrón y los isótopos del hidrógeno"></div>
<div class="sim-guide"><ul>
<li>Con \(V_0=1\) eV y \(a=0.1\) nm, y \(E=V_0/2\), el electrón atraviesa con \(T=0.88\); el protón, con \(1.3\times10^{-13}\) (\(\kappa a=15.5\)); el deuterón, \(3.5\times10^{-19}\); el tritón, \(1.9\times10^{-23}\). El cociente H/D es de \(3.8\times10^5\): un isótopo dos veces más pesado reduce el túnel en cinco órdenes de magnitud en esta barrera.</li>
<li>Con una barrera más fina y baja (\(V_0=0.5\) eV, \(a=0.05\) nm), el protón pasa con \(7\times10^{-5}\) y el cociente H/D baja a 94. Ensanche la barrera a 0.3 nm: el electrón aún pasa (\(T=0.37\)), el protón, con \(10^{-40}\). Por eso el túnel de electrones es común en química y el de núcleos solo aparece para H (y a veces D) en barreras estrechas.</li>
</ul></div>
<p>En cinética química importa la contribución de todas las energías \(E\) a una temperatura \(T\). Para una barrera parabólica invertida, \(V=V_0-\tfrac12m\omega^2x^2\), la transmisión es exacta (Kemble, 1935): \(T(E)=[1+e^{2\pi(V_0-E)/\hbar\omega}]^{-1}\). Promediar con Boltzmann da la corrección que multiplica la constante de velocidad clásica del capítulo 17:</p>
<div class="eq key" data-name="Corrección de túnel de una barrera parabólica">\[Q=\frac{k_\text{túnel}}{k_\text{clásica}}=\frac{u/2}{\sin(u/2)}\ \ (u<2\pi),\qquad u=\frac{h\nu^\ddagger}{k_BT},\qquad Q_\text{Wigner}\approx1+\frac{u^2}{24}.\]</div>
<p>La corrección de Wigner (1932) es el primer término del desarrollo de Bell y vale solo para \(u\lesssim2\); para barreras con \(u\) mayor hay que integrar. Con \(u\to2\pi\) \(Q\) diverge: el túnel domina y el modelo de barrera infinita deja de valer (la barrera real es finita).</p>
<div class="sim" data-sim="tunel-cin" data-title="Corrección de túnel de Wigner y de Bell y efecto isotópico cinético"></div>
<div class="sim-guide"><ul>
<li>Para una transferencia de H con \(\nu^\ddagger=1200\) cm⁻¹ a 298 K, \(u=5.79\) y \(Q=11.9\): la reacción es doce veces más rápida de lo que daría la teoría clásica. Wigner (2.4) subestima mucho: ya no vale. Bell y la integral numérica coinciden (11.96 y 11.88, la diferencia es de la cuadratura).</li>
<li>Para el deuterio la frecuencia imaginaria baja a \(1200/\sqrt2=849\) cm⁻¹, \(u=4.10\) y \(Q=2.3\): solo por el túnel, el cociente \(k_H/k_D\) crece en un factor de 5.2 sobre lo que da la energía de punto cero (capítulo 17). Los efectos isotópicos cinéticos anómalamente grandes (más de 7–10 a temperatura ambiente) son la huella experimental del túnel de H.</li>
<li>Con \(\nu^\ddagger=600\) cm⁻¹ (barrera ancha) \(Q=2.6\) para H y 1.5 para D, y Wigner (1.78) todavía subestima. Baje la temperatura a 200 K con \(\nu^\ddagger=1200\): \(u=8.6>2\pi\), y el simulador avisa que el modelo ya no es válido.</li>
</ul></div>
</section>

<section>
<h2>El oscilador armónico y el de Morse</h2>
<p>Un enlace se parece a un resorte para desplazamientos pequeños: \(V=\tfrac12k(r-r_e)^2\), con masa reducida \(\mu\). La ecuación de Schrödinger tiene solución exacta con funciones de Hermite:</p>
<div class="eq key" data-name="Oscilador armónico">\[E_v=\hbar\omega\left(v+\tfrac12\right),\quad\omega=\sqrt{k/\mu},\quad\psi_v\propto H_v(\xi)e^{-\xi^2/2},\ \xi=\sqrt{\mu\omega/\hbar}\,(r-r_e).\]</div>
<p>Niveles equiespaciados, energía de punto cero \(\tfrac12\hbar\omega\) y regla de selección \(\Delta v=\pm1\) para la absorción infrarroja: un solo pico por modo. Pero los enlaces reales se disocian, y el potencial no es una parábola. El de Morse (1929), \(V=D_e[1-e^{-a(r-r_e)}]^2\), también tiene solución exacta y capta la disociación y la anarmonicidad:</p>
<div class="eq key" data-name="Oscilador de Morse">\[E_v=\hbar\omega_e\left(v+\tfrac12\right)-\hbar\omega_ex_e\left(v+\tfrac12\right)^2,\quad\omega_ex_e=\frac{\omega_e^2}{4D_e},\quad a=\omega_e\sqrt{\frac{\mu}{2D_e}},\quad v_\text{máx}=\Big\lfloor\frac{2D_e}{\hbar\omega_e}-\tfrac12\Big\rfloor.\]</div>
<p>Los niveles se juntan al subir hacia el límite de disociación, de modo que las bandas de sobretonos \(0\to2,3,\dots\) (permitidas débilmente por la anarmonicidad) aparecen a menos del doble, triple... de la fundamental. Aquí se usan las constantes espectroscópicas (\(\omega_e\), \(\omega_ex_e\)) medidas, con \(D_e\) obtenida de la relación de Morse.</p>
<div class="sim" data-sim="morse" data-title="Potencial de Morse, niveles vibracionales y función de onda de moléculas diatómicas reales"></div>
<div class="sim-guide"><ul>
<li>H³⁵Cl (\(\omega_e=2990.95\), \(\omega_ex_e=52.82\) cm⁻¹, \(\mu=0.97959\) u): el Morse predice la fundamental en 2885.3 cm⁻¹ y el primer sobretono en 5665.0 (el armónico daría 5982): los valores medidos son 2885.98 y 5667.98 cm⁻¹. El potencial tiene 28 niveles ligados y \(D_e\) de Morse 42 341 cm⁻¹ (5.25 eV).</li>
<li>CO (\(\omega_e=2169.81\), \(\omega_ex_e=13.288\)): \(0\to1\) en 2143.2 cm⁻¹, el valor medido, 2143.27. \(D_e=10.98\) eV; el real es 11.2 eV: la relación de Morse da \(D_e\) con un error de pocos por ciento (con H₂ da 4.95 eV frente a 4.75 eV, y es un 4 % mayor). Un enlace fuerte (CO) tiene muchos niveles ligados (82); uno débil (I₂, 2.3 eV) tiene frecuencia baja (214.5 cm⁻¹) y un fundamental muy ligeramente rebajado (213.3).</li>
<li>Suba \(v\): la función de onda gana nodos (\(v\) de ellos), se ensancha y se asimetriza, penetrando más en la rama repulsiva a la izquierda. Es una prueba de que las integrales de solapamiento de Franck–Condon (capítulo 28) no son simétricas.</li>
</ul></div>
</section>

<section>
<h2>El rotor rígido</h2>
<p>Una molécula diatómica que gira como una mancuerna rígida de momento de inercia \(I=\mu r_e^2\) tiene energías y funciones de onda dadas por los armónicos esféricos \(Y_J^{M}(\theta,\phi)\):</p>
<div class="eq key" data-name="Rotor rígido">\[E_J=\frac{\hbar^2}{2I}J(J+1)=hcB\,J(J+1),\quad g_J=2J+1,\quad B=\frac{h}{8\pi^2cI},\qquad\nu_{J\to J+1}=2B(J+1).\]</div>
<p>Las líneas de absorción del espectro de microondas están equiespaciadas por \(2B\), y de su separación se obtiene \(r_e\) con una precisión mucho mayor que de cualquier difracción. Solo absorben las moléculas con momento dipolar permanente (\(\Delta J=\pm1\)): CO, HCl sí; N₂ y H₂, no. La población de cada nivel a temperatura \(T\) combina la degeneración \(2J+1\), que crece, con el factor de Boltzmann, que decrece:</p>
<div class="eq" data-name="Poblaciones rotacionales">\[\frac{N_J}{N}=\frac{(2J+1)e^{-hcBJ(J+1)/k_BT}}{q_\text{rot}},\qquad J_\text{máx}\approx\sqrt{\frac{k_BT}{2hcB}}-\frac12.\]</div>
<div class="sim" data-sim="rotor" data-title="Poblaciones rotacionales y líneas del espectro de microondas"></div>
<div class="sim-guide"><ul>
<li>CO a 298 K (\(B=1.931\) cm⁻¹, \(\theta_\text{rot}=hcB/k_B=2.78\) K): el nivel más poblado es \(J=7\) (la fórmula da 6.8); solo 0.93 % de las moléculas está en \(J=0\), y el 39 % tiene \(J\ge10\). La primera línea \(0\to1\) cae en 3.86 cm⁻¹ = 115.8 GHz, la famosa radiación del CO de la astronomía milimétrica.</li>
<li>HCl (\(B=10.59\) cm⁻¹): \(J_\text{máx}=3\), línea \(0\to1\) en 21.2 cm⁻¹ (635 GHz). H₂, con \(B=60.9\) cm⁻¹ (\(\theta_\text{rot}=87.6\) K), a 298 K tiene el máximo en \(J=1\) y solo el 27 % en \(J=0\). Cuando \(T\ll\theta_\text{rot}\) los niveles rotacionales se «congelan»: la capacidad calorífica del H₂ a baja temperatura tiene solo la parte traslacional (capítulos 1 y 29).</li>
<li>En el CO a 50 K la distribución se contrae a \(J_\text{máx}=3\): un espectro con pocas líneas fuertes. Con la temperatura de una nube interestelar fría (10–20 K) solo se observan las primeras líneas.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un electrón confinado en una caja de 0.5 nm. Calcule \(E_1\), la energía de la transición \(1\to2\) y la longitud de onda de la luz que absorbe.
<details><summary>Respuesta</summary><p>\(E_1=h^2/(8mL^2)=0.376\) eV \(\times(1/0.5)^2=1.504\) eV. \(\Delta E=E_2-E_1=3E_1=4.51\) eV, \(\lambda=1239.84/4.51=275\) nm (ultravioleta).</p></details></li>
<li><span class="lvl">Básico</span>Una molécula de CO a 298 K: calcule \(J_\text{máx}\) y la frecuencia de la línea \(J=0\to1\) en GHz con \(B=1.9313\) cm⁻¹.
<details><summary>Respuesta</summary><p>\(k_BT/hc=207.1\) cm⁻¹; \(J_\text{máx}=\sqrt{207.1/(2\times1.9313)}-0.5=6.8\), es decir, \(J=7\). \(\nu=2B=3.863\) cm⁻¹ \(\times29.979\) GHz/cm⁻¹ \(=115.8\) GHz.</p></details></li>
<li><span class="lvl">Intermedio</span>Con \(\omega_e=2169.81\) cm⁻¹ y \(\omega_ex_e=13.288\) cm⁻¹ para el CO, calcule la frecuencia de la fundamental y del primer sobretono, y \(D_e\) (eV) de Morse.
<details><summary>Respuesta</summary><p>\(\nu_{0\to1}=\omega_e-2\omega_ex_e=2143.2\) cm⁻¹; \(\nu_{0\to2}=2\omega_e-6\omega_ex_e=4259.9\) cm⁻¹ (armónico: 4339.6). \(D_e=\omega_e^2/(4\omega_ex_e)=88\,578\) cm⁻¹ \(=10.98\) eV.</p></details></li>
<li><span class="lvl">Intermedio</span>Una barrera parabólica tiene \(\nu^\ddagger=1000\) cm⁻¹ para H. Calcule \(u\) a 300 K y el factor de Bell; luego estime \(\nu^\ddagger\) y el factor para D.
<details><summary>Respuesta</summary><p>\(u=h c\nu/k_BT=1000/(0.6950\times300)=4.80\); \(Q=(u/2)/\sin(u/2)=2.40/\sin2.40=2.40/0.675=3.56\). Para D, \(\nu^\ddagger=1000/\sqrt2=707\) cm⁻¹, \(u=3.39\), \(Q=1.695/\sin1.695=1.695/0.992=1.71\); \(Q_H/Q_D=2.1\).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que, para una partícula en una caja, \(\Delta x\,\Delta p=\tfrac\hbar2\sqrt{n^2\pi^2/3-2}\) y que es siempre mayor que \(\hbar/2\).
<details><summary>Respuesta</summary><p>\(\langle x\rangle=L/2\), \(\langle x^2\rangle=L^2(1/3-1/(2n^2\pi^2))\), luego \(\Delta x^2=L^2(1/12-1/(2n^2\pi^2))\). \(\langle p\rangle=0\), \(\langle p^2\rangle=2mE_n=n^2\pi^2\hbar^2/L^2\). El producto cuadrado es \(\hbar^2(n^2\pi^2/12-1/2)=\tfrac{\hbar^2}4(n^2\pi^2/3-2)\). Para \(n=1\), \(\pi^2/3-2=1.29>1\), y crece con \(n\).</p></details></li>
</ol>
