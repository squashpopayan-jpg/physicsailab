<p class="lead">Una gota de tinta en un vaso de agua quieta se extiende sin que nadie la agite, pero tarda horas en llegar al borde; una proteína cruza una célula de 10 µm en una décima de segundo y le tomaría días recorrer un centímetro. Esas dos observaciones contienen toda la física de la difusión: un movimiento al azar de las moléculas que, promediado sobre miles de millones de ellas, se vuelve una corriente ordenada hacia donde hay menos, y cuya distancia crece solo como la raíz del tiempo. En este capítulo se pasa de la ley macroscópica de Fick al camino aleatorio de Einstein, de allí a la relación de Stokes–Einstein que liga el coeficiente de difusión con la viscosidad y el tamaño, a los iones y su conductividad, y se termina con dos problemas donde la difusión compite con otro proceso: el paso por una membrana y la reacción dentro de un catalizador poroso.</p>

<section>
<h2>Las leyes de Fick</h2>
<p>Fick (1855) propuso, por analogía con la conducción del calor de Fourier, que el flujo de materia es proporcional al gradiente de concentración y apunta hacia donde la concentración es menor. Con la ecuación de continuidad (la materia no se crea ni se destruye) resultan las dos leyes:</p>
<div class="eq key" data-name="Leyes de Fick">\[J=-D\frac{\partial c}{\partial x},\qquad\frac{\partial c}{\partial t}=-\frac{\partial J}{\partial x}=D\frac{\partial^2c}{\partial x^2},\qquad[D]=\mathrm{m^2\,s^{-1}}.\]</div>
<p>El flujo \(J\) se mide en mol/(m²·s). La segunda ley es una ecuación de calor: su solución para una condición inicial de «escalón» (concentración \(c_0\) en \(x<0\) y cero en \(x>0\)), de un «pulso» (\(n_0\) moléculas por unidad de área en \(x=0\)) y de una lámina de espesor \(L\) con paredes impermeables es, respectivamente,</p>
<div class="eq key" data-name="Soluciones de la segunda ley">\[c=\frac{c_0}2\operatorname{erfc}\frac x{2\sqrt{Dt}},\qquad c=\frac{n_0}{\sqrt{4\pi Dt}}\,e^{-x^2/4Dt},\qquad c=\frac{c_0}2+\sum_{n\ge1}\frac{2c_0}{n\pi}\sin\frac{n\pi}2\cos\frac{n\pi x}L\,e^{-n^2\pi^2Dt/L^2}.\]</div>
<p>Todas dependen de \(x\) y de \(t\) solo por la combinación \(x/\sqrt{Dt}\) (excepto la lámina, que tiene una escala propia \(L^2/\pi^2D\)). Eso lleva a la regla más útil de la difusión: <em>el tiempo que tarda una molécula en recorrer una distancia \(x\) es \(t\sim x^2/2D\)</em>, no \(x/v\). La varianza del pulso es \(\langle x^2\rangle=2Dt\). El potencial que impulsa la difusión es en realidad el químico, \(J=-(D/RT)\,c\,\partial\mu/\partial x\), de modo que la ley de Fick es la forma ideal de esa fuerza termodinámica (capítulo 1).</p>
<div class="sim" data-sim="fick-difusion" data-title="Segunda ley de Fick: escalón, pulso y lámina, solución analítica y Crank–Nicolson"></div>
<div class="sim-guide"><ul>
<li>Con \(D=100\) µm²/s (una proteína pequeña) y \(t=5\) s, el perfil de escalón tiene un ancho típico \(\sqrt{2Dt}=31.6\) µm; el flujo en \(x=0\) es \(c_0\sqrt{D/4\pi t}=1.26\,c_0\)·µm/s y para recorrer 100 µm se necesitan \(x^2/2D=50\) s. Con \(D=10^{-9}\) m²/s (una molécula pequeña en agua) esos 100 µm toman 5 s, 1 mm toma 500 s (8 min) y 1 cm toma casi 14 h; con \(D=10^{-10}\) m²/s, 1 cm toma casi seis días. Cruzar una célula de 10 µm toma 0.05 s: dentro de una célula la difusión es instantánea, entre órganos no existe.</li>
<li>El perfil de la lámina con \(L=400\) µm y \(D=100\) µm²/s tarda en uniformarse \(L^2/\pi^2D\approx160\) s: a \(t=100\) s todavía hay 0.84 en la pared izquierda y 0.74 a \(x=100\) µm, y el centro vale siempre 0.5. Pruebe \(t=0.01\) s: el perfil es el escalón original suavizado en una zona de 1.4 µm.</li>
<li>La solución numérica (Crank–Nicolson, 400 pasos, malla de 1200 puntos, comenzando desde la solución exacta en \(t/10\) para evitar las oscilaciones que este esquema produce sobre una discontinuidad) coincide con la analítica con error máximo de \(5\times10^{-6}\) (escalón), \(2.5\times10^{-5}\) (pulso) y \(2\times10^{-5}\) (lámina) del máximo del perfil, y conserva la masa a la precisión de la máquina.</li>
</ul></div>
</section>

<section>
<h2>El camino aleatorio y la relación de Einstein</h2>
<p>La ley de Fick no menciona moléculas. Einstein (1905) y Smoluchowski (1906) mostraron que sale de un modelo mínimo: partículas que dan saltos independientes, al azar, cada intervalo \(\tau\). Si cada paso tiene varianza \(\ell^2\) en una coordenada, después de \(n=t/\tau\) pasos la varianza es \(n\ell^2\), de modo que \(\langle x^2\rangle=2Dt\) con \(D=\ell^2/2\tau\) — exactamente la varianza del pulso de Fick. En \(d\) dimensiones, las coordenadas son independientes y los cuadrados se suman:</p>
<div class="eq key" data-name="Desplazamiento cuadrático medio">\[\langle r^2\rangle=2d\,D\,t,\qquad D=\frac{\ell^2}{2\tau},\qquad\text{caja reflectante de lado }L:\ \langle r^2\rangle\to\frac{d\,L^2}6.\]</div>
<p>El desplazamiento crece como \(\sqrt t\), no como \(t\): una trayectoria individual es irregular y fractal, pero el <em>promedio</em> sobre muchas es una recta en \(\langle r^2\rangle\) frente a \(t\), cuya pendiente \(2dD\) es lo que se mide. Con \(n\) partículas independientes, el MSD tiene una incertidumbre relativa \(\sqrt{2/dn}\), y la regla práctica para el seguimiento de partículas individuales (microscopía de una molécula) es que hacen falta cientos de trayectorias para estimar \(D\) con 10 %. Si las partículas están confinadas, el MSD satura en \(dL^2/6\) (para una caja uniformemente poblada), y la altura de esa meseta mide el tamaño del confinamiento.</p>
<div class="sim" data-sim="camino-aleatorio" data-title="Camino aleatorio en 1, 2 y 3 dimensiones: desplazamiento cuadrático medio y confinamiento"></div>
<div class="sim-guide"><ul>
<li>Con \(D=10\) µm²/s en 2D, después de 10 s el MSD teórico es \(2\cdot2\cdot10\cdot10=400\) µm² (desplazamiento rms 20 µm), aunque el recorrido total de cada partícula es mucho mayor. Con 400 partículas el MSD simulado fluctúa unos 5 % alrededor de la recta; con 2000, 2.2 %.</li>
<li>En 1D, 2D y 3D con el mismo \(D\) la pendiente del MSD es 2, 4 y 6 veces \(D\): lo que se mide en un experimento depende de cuántas coordenadas observa el microscopio. El camino aleatorio de las moléculas en 3D observadas solo en proyección 2D da \(4Dt\), no \(6Dt\).</li>
<li>Con el confinamiento activado (caja de 5 µm), el MSD sigue la recta hasta \(t\sim L^2/12D\approx0.2\) s y luego se aplana en \(dL^2/6\): 4.2, 8.3 y 12.5 µm² para 1, 2 y 3 dimensiones. Es el mismo razonamiento con que se estima el tamaño de dominios en membranas celulares a partir del seguimiento de lípidos.</li>
</ul></div>
<p>La conexión con la termodinámica la dio también Einstein. Una partícula que se mueve con velocidad \(v\) en un medio con coeficiente de fricción \(f\) alcanza una velocidad límite \(v=F/f\) bajo una fuerza \(F\) (movilidad mecánica \(u=1/f\)); en equilibrio con un campo, el flujo difusivo \(-D\,\partial c/\partial x\) tiene que cancelar el flujo de arrastre y se obtiene la <em>relación de Einstein</em> \(D=k_BT/f\), que es un teorema de fluctuación–disipación: las mismas colisiones que producen la fricción producen las fluctuaciones. Con ella, el movimiento browniano pasó de curiosidad botánica (Brown, 1827) a la prueba más directa de que existen las moléculas: midiendo \(\langle x^2\rangle\) de granos coloidales de radio conocido en un fluido de viscosidad conocida, Perrin (1908–1909) obtuvo el número de Avogadro con una precisión de 10–20 %, y ganó el premio Nobel de 1926.</p>
</section>

<section>
<h2>La relación de Stokes–Einstein</h2>
<p>Para una esfera de radio \(r\) que se mueve lentamente en un fluido continuo de viscosidad \(\eta\), Stokes (1851) calculó la fricción \(f=6\pi\eta r\) con la condición de adherencia en la superficie (\(4\pi\eta r\) si el fluido desliza). Junto con la relación de Einstein, resulta</p>
<div class="eq key" data-name="Stokes–Einstein">\[D=\frac{k_BT}{6\pi\eta r_H},\qquad r_H=\frac{k_BT}{6\pi\eta D},\qquad\frac{D\eta}T=\text{constante.}\]</div>
<p>\(r_H\) es el <em>radio hidrodinámico</em>: el de la esfera que difundiría igual que la molécula. Tiene consecuencias sencillas: \(D\) crece con la temperatura como \(T/\eta(T)\) y, como la viscosidad del agua baja de 0.890 mPa·s a 25 °C a 0.547 mPa·s a 50 °C, el coeficiente de difusión de un soluto aumenta 1.77 veces en ese intervalo, mucho más de lo que sugeriría el factor \(T\). Y \(D\) disminuye solo como \(1/r\) al agrandar la molécula: un factor 100 en masa molar da un factor 4.6 en \(r\) y por lo tanto \(D\) 4.6 veces menor.</p>
<div class="sim" data-sim="stokes-einstein" data-title="Coeficiente de difusión de Stokes–Einstein en agua frente al radio, con datos de glucosa, sacarosa y tres proteínas"></div>
<div class="sim-guide"><ul>
<li>Para la sacarosa a 25 °C, el volumen de la esfera seca (de \(M=342.3\) g/mol y el volumen específico parcial \(\bar v=0.617\) cm³/g) da \(r=0.437\) nm y \(D=5.6\times10^{-10}\) m²/s, un 8 % mayor que el medido \(5.2\times10^{-10}\); el radio hidrodinámico de ese \(D\) medido es 0.472 nm. Para la glucosa: 0.354 nm, \(6.9\times10^{-10}\) frente a \(6.7\times10^{-10}\) (3 %).</li>
<li>Para las proteínas la esfera seca predice un \(D\) mayor que el real, porque la proteína lleva agua de hidratación y no es esférica: lisozima (14.3 kDa, 1.58 nm), \(1.55\times10^{-10}\) frente a \(1.1\times10^{-10}\) m²/s (cociente 1.41); hemoglobina (64.5 kDa, 2.68 nm), \(9.2\times10^{-11}\) frente a \(6.9\times10^{-11}\) (1.33); albúmina sérica (66.4 kDa), \(9.1\times10^{-11}\) frente a \(6.0\times10^{-11}\) (1.52). El cociente \(f/f_0\) de 1.3–1.5 es lo que la ultracentrifugación y la dispersión dinámica de luz usan para inferir hidratación y forma. Con \(D=6.9\times10^{-11}\) m²/s, la hemoglobina tarda \(x^2/2D=0.46\) s en cruzar un glóbulo rojo de 8 µm.</li>
<li>Con un radio de 0.5 µm (una bacteria, una esfera de látex) a 20 °C, \(D=4.3\times10^{-13}\) m²/s: en 1 s se desplaza unos 0.9 µm por eje y tarda 13 días en recorrer 1 mm. La relación falla para moléculas del tamaño del disolvente: la autodifusión del agua, \(2.30\times10^{-9}\) m²/s, daría \(r_H=1.07\) Å con adherencia y 1.6 Å con deslizamiento (el radio molecular es 1.4 Å): el modelo de medio continuo solo es fiable cuando la partícula es varias veces mayor que las moléculas del disolvente.</li>
</ul></div>
</section>

<section>
<h2>Iones: la relación de Nernst–Einstein</h2>
<p>En una disolución electrolítica los iones difunden y, bajo un campo, migran. Las dos cosas son la misma fricción: la movilidad eléctrica es \(u=zeD/k_BT\) (por unidad de campo) y la conductividad molar iónica límite \(\lambda^\circ=z^2F^2D/RT\) (<em>Nernst–Einstein</em>). Medir \(\lambda^\circ\) (capítulo 12) es medir \(D\):</p>
<div class="eq key" data-name="Nernst–Einstein y difusión de sales">\[D_i=\frac{RT\,\lambda_i^\circ}{z_i^2F^2},\qquad D_\mathrm{sal}=\frac{(|z_+|+|z_-|)\,D_+D_-}{|z_+|D_++|z_-|D_-}.\]</div>
<p>La segunda expresión es la difusión de una sal a dilución infinita: como los dos iones no pueden separarse más que una distancia de Debye sin generar un campo, el campo ambipolar frena al rápido y acelera al lento, y el par difunde con un valor intermedio, más cercano al del ion más lento. Con \(\lambda^\circ\) a 25 °C:</p>
<div class="sim" data-sim="nernst-einstein" data-title="Coeficientes de difusión iónicos desde las conductividades molares límite, radios de Stokes y el efecto Grotthuss"></div>
<div class="sim-guide"><ul>
<li>\(D(\mathrm{Na^+})=1.334\times10^{-9}\), \(D(\mathrm{K^+})=1.957\), \(D(\mathrm{Cl^-})=2.033\), \(D(\mathrm{Li^+})=1.030\), \(D(\mathrm{Mg^{2+}})=0.706\), \(D(\mathrm{SO_4^{2-}})=1.065\) (todos en \(10^{-9}\) m²/s), coinciden con los valores tabulados del <em>CRC Handbook</em> con diferencias menores de 0.3 %. Para las sales: NaCl, \(1.611\times10^{-9}\); KCl, \(1.994\); HCl, \(3.338\); CaCl₂, \(1.336\), también iguales a lo medido (1.612, 1.993, 3.337, 1.335).</li>
<li>El radio de Stokes \(k_BT/6\pi\eta D\) da Li⁺ 2.38 Å, Na⁺ 1.84, K⁺ 1.25, Cl⁻ 1.21 Å. El orden de los radios es <em>opuesto</em> al cristalino (Li⁺ 0.76 Å, Na⁺ 1.02, K⁺ 1.38): el ion más pequeño tiene el campo más intenso en su superficie, retiene más agua y se arrastra con ella, por eso el litio difunde más lento que el potasio. Para K⁺ y Cl⁻ el radio de Stokes es menor que el cristalino: la hipótesis de adherencia sobreestima la fricción, y se necesita el deslizamiento (\(4\pi\eta r\)) para acercarse.</li>
<li>El H⁺ (\(9.31\times10^{-9}\), «radio» de 0.26 Å) y el OH⁻ (\(5.27\times10^{-9}\), 0.47 Å) son anómalos: no se desplazan arrastrando su capa de hidratación, sino que la carga salta de una molécula de agua a otra reorganizando los enlaces de hidrógeno (mecanismo de Grotthuss, 1806). Por eso el ácido y la base fuertes son los mejores conductores iónicos del agua, y el efecto desaparece en disolventes sin red de enlaces de hidrógeno.</li>
<li>A la temperatura elegida, el sim usa la regla de Walden \(\lambda^\circ\eta\approx\) const, es decir \(D\propto T/\eta\) (la misma de Stokes–Einstein): a 50 °C, \(D(\mathrm{Na^+})\) sube de 1.33 a \(2.36\times10^{-9}\) m²/s. En un nanómetro el ion tarda unos 0.4 ns; en una micra, 0.4 ms.</li>
</ul></div>
</section>

<section>
<h2>Membranas: permeación y tiempo de retardo</h2>
<p>Una membrana de espesor \(L\) separa dos disoluciones. El soluto se disuelve en ella con un coeficiente de reparto \(K\) (concentración dentro en equilibrio con la de fuera) y la atraviesa por difusión. En estado estacionario el perfil es lineal, el flujo es \(J=KD\,\Delta c/L\) y se define la <em>permeabilidad</em> \(P=KD/L\) (m/s). Pero antes de llegar al estacionario hay un régimen transitorio, que Daynes (1920) y Barrer (1939) convirtieron en un método de medida: con la membrana inicialmente vacía y concentración \(c_1=Kc\) constante en un lado y cero en el otro, la cantidad acumulada que ha pasado hasta \(t\) es</p>
<div class="eq key" data-name="Tiempo de retardo (Daynes–Barrer)">\[Q(t)=Lc_1\left[\frac{Dt}{L^2}-\frac16-\frac2{\pi^2}\sum_{n\ge1}\frac{(-1)^n}{n^2}e^{-n^2\pi^2Dt/L^2}\right]\xrightarrow{t\gg L^2/D}\frac{Dc_1}L\,(t-\theta),\quad\theta=\frac{L^2}{6D}.\]</div>
<p>A tiempos largos, \(Q\) es una recta de pendiente \(Dc_1/L\) (el flujo estacionario) que corta el eje del tiempo en \(\theta=L^2/6D\): midiendo la pendiente y la intersección se obtienen \(P\) y \(D\), y de ellos la solubilidad \(K=PL/D\), tres cantidades de una sola curva. El flujo llega al 95 % del estacionario en \(0.374\,L^2/D=2.24\,\theta\).</p>
<div class="sim" data-sim="permeacion" data-title="Permeación transitoria a través de una membrana: serie de Crank, tiempo de retardo y Crank–Nicolson con Dirichlet"></div>
<div class="sim-guide"><ul>
<li>Con \(L=50\) µm y \(D=1\) µm²/s (un polímero vítreo), el retardo es \(\theta=417\) s y el flujo llega al 95 % a los 934 s; con \(K=1\), \(P=KD/L=0.02\) µm/s. Una película de 100 µm con el mismo \(D\) tiene retardo \(1667\) s = 28 min: el retardo crece con \(L^2\). A \(t=4\theta\), \(Q(t)\) ya coincide con la asíntota dentro del 0.06 %.</li>
<li>La solución numérica (malla de 121 nodos, 400 pasos) reproduce la serie con \(5\times10^{-5}\) de error relativo en \(Q\). Cambie \(K\): solo escala \(Q\) y \(P\), no el retardo (\(\theta\) depende solo de \(D\) y \(L\)): por eso medir el retardo da \(D\) sin saber la solubilidad.</li>
<li>Una bicapa lipídica de 4 nm, aun con \(D\sim10^{-12}\) m²/s, tiene \(\theta=(4\,\mathrm{nm})^2/(6\times10^{-12}\,\mathrm{m^2/s})\approx3\) µs: el transitorio es irrelevante en la escala de tiempo de una célula y lo que limita el paso es el reparto \(K\) en la bicapa; el transporte de iones y agua lo aceleran las proteínas de canal y de transporte (capítulo 38).</li>
</ul></div>
</section>

<section>
<h2>Reacción y difusión: el módulo de Thiele</h2>
<p>Muchas veces la sustancia que difunde se consume al mismo tiempo: oxígeno en un tejido, reactivo en el interior de un pellet de catalizador, un morfógeno que se degrada. Para una reacción de primer orden con constante \(k\), en estado estacionario \(D\,c''=k\,c\) y con \(c(0)=c_0\) en la superficie, la solución decae sobre la <em>longitud de penetración</em> \(\lambda=\sqrt{D/k}\): \(c=c_0e^{-x/\lambda}\) en un medio semiinfinito. En una lámina de espesor \(L\) con la cara posterior impermeable (o, de forma equivalente, una lámina de espesor \(2L\) con reacción simétrica),</p>
<div class="eq key" data-name="Módulo de Thiele y factor de efectividad">\[\frac{c}{c_0}=\frac{\cosh\!\big[\varphi(1-x/L)\big]}{\cosh\varphi},\qquad\varphi=L\sqrt{\frac kD},\qquad\eta=\frac{\text{velocidad observada}}{\text{velocidad sin gradiente}}=\frac{\tanh\varphi}\varphi.\]</div>
<p>\(\varphi^2\) es el cociente entre el tiempo de difusión \(L^2/D\) y el de reacción \(1/k\) (un número de Damköhler). Para \(\varphi\lesssim0.3\), \(\eta\approx1\) y la reacción controla; para \(\varphi\gtrsim3\), \(\eta\approx1/\varphi\) y solo la capa exterior de espesor \(\lambda\) trabaja. En ese régimen la velocidad observada es proporcional a \(\sqrt k\), de modo que la <em>energía de activación aparente es la mitad de la verdadera</em>, y el orden aparente de una reacción de orden \(n\) pasa a ser \((n+1)/2\): dos huellas características que delatan un catalizador limitado por la difusión. El criterio de Weisz–Prater lo expresa con magnitudes observables: si \(\eta\varphi^2=L^2r_\mathrm{obs}/(Dc_s)<0.3\), el efecto es despreciable.</p>
<div class="sim" data-sim="reaccion-difusion" data-title="Perfil de concentración y factor de efectividad en un pellet de catalizador o en un tejido"></div>
<div class="sim-guide"><ul>
<li>\(\varphi=2\): \(\eta=\tanh2/2=0.482\) y la concentración en el centro es \(1/\cosh2=0.266\,c_0\). \(\varphi=0.3\): \(\eta=0.971\) (3 % de pérdida). \(\varphi=3\): \(\eta=0.332\); \(\varphi=10\): \(\eta=0.100\), con \(\lambda=0.1\,L\). El perfil de diferencias finitas coincide con el \(\cosh\) con error de \(10^{-4}\) con 401 nodos.</li>
<li>Pellet de 1 mm, \(D_\mathrm{ef}=10^{-6}\) m²/s (poros de gas) y \(k=10\) s⁻¹: \(\varphi=3.16\), \(\eta=0.315\) y el centro recibe solo el 8.5 % del reactivo: se desaprovecha el 68 % del catalizador. Si se tritura a un cuarto del tamaño, \(\varphi=0.79\) y \(\eta=0.83\).</li>
<li>Oxígeno en un tejido: con \(D=2\times10^{-9}\) m²/s y un consumo de primer orden \(k=0.1\) s⁻¹ (aproximación gruesa a la cinética de Michaelis–Menten del capítulo 19 a baja concentración), \(\lambda=\sqrt{D/k}=141\) µm: del orden de la distancia máxima a un capilar en casi todo el cuerpo (100–200 µm). Los tejidos sin vasos (cartílago, córnea) son delgados, o dependen de la difusión desde el fluido que los baña.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>La glucosa tiene \(D=6.7\times10^{-10}\) m²/s en agua a 25 °C. ¿Cuánto tarda, en promedio, en difundir 1 mm? ¿Y 1 cm?
<details><summary>Respuesta</summary><p>\(t=x^2/2D=(10^{-3})^2/(2\cdot6.7\times10^{-10})=746\) s \(=12.4\) min. A 1 cm, 100 veces más (el tiempo crece como \(x^2\)): \(7.5\times10^4\) s \(=20.7\) h. Por eso los organismos mayores de unos cientos de micras necesitan circulación y no pueden depender de la difusión.</p></details></li>
<li><span class="lvl">Básico</span>Una esfera de látex de 0.5 µm de radio está suspendida en agua a 20 °C (\(\eta=1.002\) mPa·s). Calcule \(D\) y el desplazamiento rms a lo largo de un eje en 60 s.
<details><summary>Respuesta</summary><p>\(D=k_BT/6\pi\eta r=1.381\times10^{-23}\cdot293.15/(6\pi\cdot1.002\times10^{-3}\cdot0.5\times10^{-6})=4.29\times10^{-13}\) m²/s. \(\sqrt{2Dt}=\sqrt{2\cdot4.29\times10^{-13}\cdot60}=7.2\) µm (en 2D, \(\sqrt{4Dt}=10.1\) µm).</p></details></li>
<li><span class="lvl">Intermedio</span>Siguiendo a Perrin, se mide para esas esferas un desplazamiento cuadrático medio por eje \(\langle x^2\rangle=49\) µm² en 60 s. ¿Qué valor da para el número de Avogadro? ¿Cuántas esferas hay que observar para que el estadístico solo tenga 10 % de error?
<details><summary>Respuesta</summary><p>De \(\langle x^2\rangle=2Dt=2\,\dfrac{RT}{N_A}\dfrac t{6\pi\eta r}\): \(N_A=\dfrac{RTt}{3\pi\eta r\langle x^2\rangle}=\dfrac{8.314\cdot293.15\cdot60}{3\pi\cdot1.002\times10^{-3}\cdot0.5\times10^{-6}\cdot49\times10^{-12}}=6.3\times10^{23}\) mol⁻¹ (el 5 % sobre 6.022). El cuadrado de un desplazamiento gaussiano tiene incertidumbre relativa \(\sqrt{2/N}\) para \(N\) observaciones independientes: \(\sqrt{2/N}=0.10\Rightarrow N=200\).</p></details></li>
<li><span class="lvl">Intermedio</span>El pellet de la simulación anterior tiene \(L=1\) mm, \(D_\mathrm{ef}=10^{-6}\) m²/s y \(k=10\) s⁻¹. Calcule el módulo, el factor de efectividad y la fracción de la concentración superficial que llega al centro; luego repita con un tamaño de un cuarto.
<details><summary>Respuesta</summary><p>\(\varphi=L\sqrt{k/D}=10^{-3}\sqrt{10/10^{-6}}=3.162\); \(\eta=\tanh\varphi/\varphi=0.9964/3.162=0.315\); \(c(L)/c_0=1/\cosh\varphi=0.0845\). Con \(L=0.25\) mm, \(\varphi=0.791\), \(\eta=0.833\). Triturar el pellet a un cuarto del tamaño multiplica la velocidad por unidad de catalizador por \(0.833/0.315=2.6\), pero aumenta la caída de presión del lecho: el tamaño industrial equilibra ambas cosas.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre el tiempo de retardo \(\theta=L^2/6D\) de la permeación: resuelva \(c_t=Dc_{xx}\) con \(c(0,t)=c_1\), \(c(L,t)=0\) y \(c(x,0)=0\), calcule el flujo en \(x=L\) e intégrelo.
<details><summary>Respuesta</summary><p>Se escribe \(c=c_1(1-x/L)+\sum_nb_n\sin(n\pi x/L)\,e^{-n^2\pi^2Dt/L^2}\) (estacionario más transitorio que se anula en ambos extremos). La condición inicial \(c(x,0)=0\) exige \(\sum b_n\sin(n\pi x/L)=-c_1(1-x/L)\), de donde \(b_n=-2c_1/n\pi\). El flujo en \(x=L\) es \(J=-D\,c_x(L,t)=\dfrac{Dc_1}L\Big[1+2\sum_n(-1)^ne^{-n^2\pi^2Dt/L^2}\Big]\). Integrando de 0 a \(t\): \(Q=\dfrac{Dc_1t}L+\dfrac{2c_1L}{\pi^2}\sum_n\dfrac{(-1)^n}{n^2}\big(1-e^{-n^2\pi^2Dt/L^2}\big)\). Con \(\sum_n(-1)^n/n^2=-\pi^2/12\) la suma sin exponencial es \(-c_1L/6\), y queda \(Q=\dfrac{Dc_1}L\big(t-\dfrac{L^2}{6D}\big)+\)términos exponenciales que decaen: la asíntota corta el eje \(t\) en \(\theta=L^2/6D\).</p></details></li>
</ol>
