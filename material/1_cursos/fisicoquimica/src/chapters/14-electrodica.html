<p class="lead">La termodinámica del capítulo anterior dice hacia dónde va una reacción de electrodo y cuánto trabajo da, pero no dice con qué rapidez. La corriente que circula por un electrodo es la velocidad de la reacción, expresada en amperios, y depende del potencial de una manera que se puede medir y calcular. Esa dependencia explica por qué el platino es un buen catalizador para el hidrógeno y el mercurio uno terrible, por qué una pila se desgasta más rápido bajo carga alta, y por qué el hierro se corroe a la velocidad a la que lo hace.</p>

<section>
<h2>La corriente como velocidad de reacción</h2>
<p>Una reacción de electrodo \(\mathrm{O}+ne^-\rightleftharpoons\mathrm{R}\) que consume \(v\) moles por segundo y por unidad de área genera una corriente \(i=nFv\) (leyes de Faraday). Se establece una convención de signo: la corriente <em>anódica</em> (oxidación) es positiva, la <em>catódica</em> negativa. En el equilibrio, las dos corrientes son iguales y opuestas y la neta es cero; su valor común es la <span class="term">densidad de corriente de intercambio</span> \(i_0\). El <span class="term">sobrepotencial</span> \(\eta=E-E_{eq}\) mide cuánto se aleja el electrodo del equilibrio.</p>
<p>La teoría del estado de transición aplicada a una reacción que transfiere carga a través de la interfase (capítulo 17) da la ecuación de Butler–Volmer (1924–1930):</p>
<div class="eq key" data-name="Ecuación de Butler–Volmer">\[i=i_0\left[\exp\!\left(\frac{(1-\alpha)F\eta}{RT}\right)-\exp\!\left(-\frac{\alpha F\eta}{RT}\right)\right].\]</div>
<p>El <span class="term">coeficiente de transferencia</span> \(\alpha\) (entre 0 y 1, casi siempre cerca de 0.5) mide qué fracción del cambio de potencial favorece la dirección catódica en el estado de transición. Para \(|\eta|\) pequeños (\(<10\) mV), la ecuación se linealiza, \(i\approx i_0F\eta/RT\), y define la <em>resistencia de transferencia de carga</em> \(R_{ct}=RT/(Fi_0)\): una reacción con \(i_0\) grande, como \(\mathrm{Fe^{3+}/Fe^{2+}}\) en platino, es casi reversible; una con \(i_0\) pequeño necesita un gran sobrepotencial. Para \(|\eta|\) grandes domina una sola exponencial y resulta la ley de Tafel (1905):</p>
<div class="eq key" data-name="Ley de Tafel">\[\eta=\pm b\log_{10}\frac{|i|}{i_0},\qquad b=\frac{2.303\,RT}{\alpha F}=118\ \mathrm{mV/década}\ (\alpha=0.5,\ 25\,°\mathrm C).\]</div>
<div class="sim" data-sim="butler-volmer" data-title="Butler–Volmer y Tafel: la corriente de un electrodo frente al sobrepotencial"></div>
<div class="sim-guide"><ul>
<li>La corriente de intercambio varía en <em>diez órdenes de magnitud</em> según el metal. Para el hidrógeno: 0.8 mA/cm² sobre platino, 6 µA/cm² sobre níquel y 0.5 pA/cm² sobre mercurio. Para sacar 10 mA/cm² de hidrógeno hace falta un sobrepotencial de unos 0.13 V sobre platino y de 1.2 V sobre mercurio: el mercurio es un mal catalizador del hidrógeno, y por eso puede usarse como electrodo en medio ácido (el polarógrafo) sin que el agua se descomponga.</li>
<li>En la gráfica de Tafel, las dos ramas son rectas que se cortan en \(\eta=0\), \(|i|=i_0\); la pendiente (118 mV/década con \(\alpha=0.5\)) da \(\alpha\) y la intersección da \(i_0\). Así se miden en el laboratorio.</li>
<li>Active el transporte de masa: la rama catódica se aplana en la corriente límite \(i_L\) y no puede superarla por mucho que se baje el potencial, porque el reactivo no llega más rápido. En la gráfica de Tafel aparece un codo.</li>
<li>La reducción del oxígeno sobre platino tiene un \(i_0\) del orden de 10⁻⁹ A/cm²: es la razón por la que las pilas de combustible necesitan mucho platino en el cátodo y pierden la mayor parte de su voltaje por esa reacción lenta (capítulo 15).</li>
</ul></div>
<h3>Transporte de masa</h3>
<p>La corriente de un electrodo puede estar limitada por el transporte del reactivo desde el seno de la disolución. Con una capa de difusión de espesor \(\delta\), la corriente máxima (corriente límite) es \(i_L=nFDc/\delta\), y la tasa de agotamiento de la concentración superficial añade un sobrepotencial de concentración \(\eta_c=(RT/nF)\ln(1-i/i_L)\). El electrodo de disco rotatorio fija \(\delta\) con la velocidad de giro \(\omega\) (ecuación de Levich): \(i_L=0.620\,nFD^{2/3}\nu^{-1/6}\omega^{1/2}c\), y es la herramienta que separa la cinética de la difusión en el laboratorio (gráfica de Koutecký–Levich).</p>
</section>

<section>
<h2>La doble capa eléctrica</h2>
<p>Cuando se aplica un potencial a un electrodo, los iones de la disolución se reorganizan en la interfase: una capa de carga en el metal y otra, de signo opuesto, en la disolución. Helmholtz (1853) imaginó un condensador de placas paralelas separadas por una capa de moléculas de agua; Gouy (1910) y Chapman (1913) sustituyeron una de las placas por una atmósfera difusa de iones, de espesor igual a la longitud de Debye del capítulo 12. Con la ecuación de Poisson–Boltzmann (no linealizada) se obtiene el potencial como función de la distancia para un electrolito 1:1:</p>
<div class="eq">\[\psi(x)=\frac{4k_BT}{e}\,\mathrm{atanh}\!\left[\tanh\!\left(\frac{e\psi_0}{4k_BT}\right)e^{-\kappa x}\right],\qquad C_d=\varepsilon_0\varepsilon_r\kappa\cosh\!\left(\frac{e\psi_0}{2k_BT}\right).\]</div>
<p>La capacidad diferencial mínima está en el potencial de carga cero y crece como \(\cosh\) al apartarse. En la práctica, los iones tienen tamaño y el valor crece solo hasta 10–40 µF/cm²: la capa compacta de Stern (1924) en serie con la difusa lo limita.</p>
<div class="sim" data-sim="doble-capa" data-title="Doble capa eléctrica de Gouy–Chapman: potencial, carga y capacidad"></div>
<div class="sim-guide"><ul>
<li>Con 0.01 mol/L y +100 mV, la longitud de Debye es 3.04 nm: el potencial decae casi a cero en 15 nm. Con 1 mol/L baja a 0.3 nm, menos de un diámetro iónico: la teoría de Gouy–Chapman deja de ser realista y se necesita la capa de Stern.</li>
<li>El potencial de Gouy–Chapman (curva sólida) cae más rápido que el de Debye–Hückel linealizado (trazos) cuando \(\psi_0\) es grande (más de 50 mV): la no linealidad apantalla más.</li>
<li>La capacidad en el punto de carga cero a 0.01 mol/L es 22.8 µF/cm², cercana a los valores experimentales; con 100 mV sube a 82 µF/cm² en la teoría, pero la medida da unos 20–40: los iones reales no pueden acercarse tanto a la superficie.</li>
<li>La carga almacenada en esa doble capa es lo que hace funcionar los supercondensadores: con carbón activado (1000–2000 m²/g) se logran 100–200 F/g.</li>
</ul></div>
</section>

<section>
<h2>Voltametría cíclica</h2>
<p>La técnica más usada para estudiar un par redox es la <span class="term">voltametría cíclica</span>: el potencial del electrodo se barre linealmente en el tiempo (\(E=E_i\pm vt\)) hasta un valor de inversión y luego de regreso, y se registra la corriente. Para una especie O que se reduce, la corriente sube al aproximarse al potencial de reducción, pasa por un máximo (el pico) y luego cae, porque la capa de difusión crece y el gradiente de concentración en la superficie disminuye. Al invertir el barrido, el producto R se reoxida y aparece un pico anódico. Para un par reversible (cinética rápida), con difusión semiinfinita, el pico catódico cumple la ecuación de Randles–Ševčík y los picos están separados:</p>
<div class="eq key" data-name="Randles–Ševčík y separación de picos">\[i_p=0.4463\,nFAc\sqrt{\frac{nFvD}{RT}},\qquad\Delta E_p=E_{pa}-E_{pc}=2.218\,\frac{RT}{nF}=\frac{57}{n}\ \mathrm{mV},\quad E_{1/2}\approx E^{\circ\prime}.\]</div>
<p>El pico crece con \(\sqrt v\): la proporcionalidad indica control por difusión. Si la transferencia de electrones es lenta (cuasirreversible), \(\Delta E_p\) crece al aumentar \(v\), porque el sistema no mantiene el equilibrio de Nernst en la superficie; Nicholson (1965) relacionó \(\Delta E_p\) con el parámetro adimensional \(\psi=k^0/\sqrt{\pi D\,(nF/RT)\,v}\) y de ahí se mide la constante heterogénea \(k^0\).</p>
<div class="sim" data-sim="cv" data-title="Voltametría cíclica simulada con difusión semiinfinita y cinética de Butler–Volmer"></div>
<div class="sim-guide"><ul>
<li>Con \(k^0\) grande (par reversible), 1 mM de especie, \(A=0.07\) cm², \(D=10^{-5}\) cm²/s y 0.1 V/s, el pico catódico es de 18.8 µA, idéntico a Randles–Ševčík (diferencia de 0.1 %), y \(\Delta E_p=57.7\) mV. \(E_{1/2}\) cae en el centro de los dos picos (0 mV, el potencial formal).</li>
<li>Baje \(k^0\) a \(10^{-3}\) cm/s: \(\psi\) pasa a 0.09 y los picos se separan más de 200 mV: sistema irreversible, que apenas se reoxida de regreso. Con \(k^0=0.01\) cm/s el sistema es cuasirreversible a 0.1 V/s (\(\psi=0.9\), \(\Delta E_p\approx88\) mV) pero se vuelve irreversible a 10 V/s: lo «lento» o «rápido» depende de la escala de tiempo.</li>
<li>La gráfica de \(i_p\) frente a \(\sqrt v\) es una recta por el origen para el par reversible, y se curva (desviación hacia abajo) cuando \(k^0\) es pequeño: es el criterio que se usa para decidir si un proceso está controlado por difusión.</li>
<li>Los valores de la simulación reproducen la tabla de Nicholson dentro de 3 mV para \(\psi\) entre 0.25 y 20; el método numérico es de diferencias finitas con condición de borde de Butler–Volmer.</li>
</ul></div>
</section>

<section>
<h2>Corrosión: dos reacciones en un mismo metal</h2>
<p>Un metal que se corroe es un electrodo en el que ocurren simultáneamente dos reacciones de electrodo: la oxidación del metal (\(\mathrm{Fe\to Fe^{2+}+2e^-}\)) y la reducción de algún oxidante de la disolución (\(\mathrm{2H^++2e^-\to H_2}\) en ácido; \(\mathrm{O_2+2H_2O+4e^-\to4OH^-}\) en agua neutra). Ninguna de las dos está en equilibrio: el metal adopta un <span class="term">potencial mixto</span> (de corrosión) \(E_{corr}\) en el que la corriente anódica y la catódica son iguales (Wagner y Traud, 1938), y esa corriente común es la <em>corriente de corrosión</em> \(i_{corr}\). El diagrama de Evans (1929) lo muestra con las dos rectas de Tafel en una gráfica de \(E\) frente a \(\log|i|\): se cortan en \((E_{corr},\,i_{corr})\).</p>
<p>La velocidad de corrosión sale de la ley de Faraday: \(CR=\dfrac{i_{corr}\,M}{nF\rho}\); para el hierro, 1 µA/cm² equivale a 0.0116 mm/año. Cerca del potencial de corrosión, la curva de polarización tiene pendiente \(\mathrm d i/\mathrm dE=1/R_p\) con \(R_p=\dfrac{b_ab_c}{2.303\,i_{corr}(b_a+b_c)}\) (Stern y Geary, 1957), y por eso se mide la velocidad de corrosión con una medida eléctrica no destructiva: la resistencia de polarización.</p>
<div class="sim" data-sim="evans" data-title="Diagrama de Evans: potencial y corriente de corrosión"></div>
<div class="sim-guide"><ul>
<li>El hierro en un ácido, controlado por el desprendimiento de hidrógeno, tiene \(E_{corr}\approx-0.36\) V y, con estos parámetros, \(i_{corr}=1\) mA/cm², unos 12 mm/año: una velocidad alta que corresponde a un ácido fuerte concentrado.</li>
<li>El hierro en agua neutra aireada: la reducción del oxígeno es controlada por difusión, \(i_L\approx40\) µA/cm², y esa corriente límite fija \(i_{corr}\) casi sin importar la cinética del metal: unos 0.46 mm/año. Para frenar la corrosión hay que quitar el oxígeno (desaireación, inhibidores secuestradores) o cubrir el metal.</li>
<li>El zinc en ácido tiene \(E_{corr}\) más negativo (−0.66 V) por su potencial de equilibrio (−0.76 V); como ánodo de sacrificio hace que el acero que está en contacto quede a un potencial por debajo de su \(E_{corr}\), donde la corriente neta es catódica sobre el acero: la protección catódica del capítulo 13.</li>
<li>El cobre en agua aireada está en el límite de su inmunidad (\(E^\circ=0.34\) V, apenas por debajo de la reducción del oxígeno): corrosión lenta (con estos parámetros, 10 µA/cm², unos 0.1 mm/año, una cota alta), como se ve en las tuberías de cobre y en los techos de las iglesias.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un electrodo tiene \(i_0=1.0\) mA/cm² y \(\alpha=0.5\). Estime el sobrepotencial catódico para \(i=-100\) mA/cm² con la ley de Tafel.
<details><summary>Respuesta</summary><p>\(\eta=-b\log(|i|/i_0)=-0.118\log(100)=-0.237\) V.</p></details></li>
<li><span class="lvl">Básico</span>Calcule \(R_{ct}\) del par Fe³⁺/Fe²⁺ sobre platino con \(i_0=2\) mA/cm² a 25 °C.
<details><summary>Respuesta</summary><p>\(R_{ct}=RT/(Fi_0)=0.02569/0.002=12.8\ \Omega\cdot\mathrm{cm^2}\).</p></details></li>
<li><span class="lvl">Intermedio</span>En una voltametría cíclica de 2.0 mM de ferrocianuro (\(D=7\times10^{-6}\) cm²/s, \(A=0.071\) cm²), a 50 mV/s, ¿qué corriente de pico se espera?
<details><summary>Respuesta</summary><p>\(nFvD/RT=96\,485(0.05)(7\times10^{-6})/(8.3145\times298.15)=1.362\times10^{-5}\), cuya raíz es \(3.69\times10^{-3}\). Con \(c=2.0\times10^{-6}\) mol/cm³: \(i_p=0.4463(96\,485)(0.071)(2.0\times10^{-6})(3.69\times10^{-3})=2.26\times10^{-5}\) A = 22.6 µA.</p></details></li>
<li><span class="lvl">Intermedio</span>El hierro se corroe a \(i_{corr}=5\) µA/cm². ¿Cuánto espesor pierde en un año?
<details><summary>Respuesta</summary><p>\(CR=0.0116\times5=0.058\) mm/año (con \(CR=i\,M/(nF\rho)\): \(5\times10^{-6}\times55.85/(2\times96\,485\times7.87)=1.84\times10^{-10}\) cm/s = 0.058 mm/año).</p></details></li>
<li><span class="lvl">Avanzado</span>Deduzca \(R_p=\dfrac{b_ab_c}{2.303\,i_{corr}(b_a+b_c)}\) linealizando la suma de las dos exponenciales alrededor de \(E_{corr}\).
<details><summary>Respuesta</summary><p>\(i=i_{corr}\left[e^{2.303\,\Delta E/b_a}-e^{-2.303\,\Delta E/b_c}\right]\approx i_{corr}\,2.303\,\Delta E\left(\dfrac1{b_a}+\dfrac1{b_c}\right)\). Entonces \(R_p=\mathrm dE/\mathrm di=\dfrac{b_ab_c}{2.303\,i_{corr}(b_a+b_c)}\).</p></details></li>
</ol>
