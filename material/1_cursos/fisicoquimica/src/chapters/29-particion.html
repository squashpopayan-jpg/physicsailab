<template class="chapter-src" data-id="particion" data-num="29" data-title="La función de partición y la termodinámica de los gases" data-part="Parte VI · Mecánica estadística" data-short="Distribución de Boltzmann, función de partición, relación con U, S, A, factorización en traslación, rotación, vibración y electrónica, ecuación de Sackur–Tetrode, entropías y capacidades caloríficas calculadas con constantes espectroscópicas, congelación de grados de libertad, anomalía de Schottky">
<p class="lead">La termodinámica de la Parte I se aplicó sin preguntar por qué una sustancia tiene la entropía o la capacidad calorífica que tiene; las tablas del capítulo 3 se tomaron del experimento. La mecánica estadística las deriva: si se conocen los niveles de energía de una molécula (que dan los espectros de la Parte V), una sola función, la <em>función de partición</em>, genera todas las propiedades termodinámicas del gas. Este capítulo calcula la entropía estándar del N₂, del H₂O o del CH₄ con constantes espectroscópicas y la compara con la tabla: un acuerdo de menos de 0.3 J/(mol·K) es la prueba de que la termodinámica es consecuencia de la estructura de las moléculas.</p>

<section>
<h2>Boltzmann y la función de partición</h2>
<p>Un sistema en contacto con un baño a temperatura \(T\) no tiene energía fija: la probabilidad de encontrarlo en un estado \(i\) de energía \(E_i\) es proporcional al factor de Boltzmann \(e^{-E_i/k_BT}\) (Boltzmann, 1868; Gibbs, 1902). La constante de normalización es la <span class="term">función de partición</span> canónica:</p>
<div class="eq key" data-name="Distribución canónica">\[p_i=\frac{e^{-E_i/k_BT}}{Q},\qquad Q=\sum_ie^{-E_i/k_BT},\qquad A=-k_BT\ln Q.\]</div>
<p>\(Q\) cuenta cuántos estados son accesibles a esa temperatura. Todas las funciones termodinámicas salen de ella por derivación:</p>
<div class="eq key" data-name="Termodinámica desde Q">\[U=k_BT^2\left(\frac{\partial\ln Q}{\partial T}\right)_V,\quad S=\frac{U}{T}+k_B\ln Q,\quad C_V=\left(\frac{\partial U}{\partial T}\right)_V,\quad p=k_BT\left(\frac{\partial\ln Q}{\partial V}\right)_T.\]</div>
<p>Para un gas ideal de \(N\) moléculas independientes, \(Q=q^N/N!\) (el factor \(N!\) corrige el hecho de que las partículas idénticas son indistinguibles: sin él, la entropía no es extensiva, la paradoja de Gibbs). Si los movimientos son independientes (aproximación de Born–Oppenheimer y de separación de grados de libertad), \(q\) se factoriza, y \(\ln q\) es una suma: cada movimiento aporta por separado a la entropía y a la capacidad calorífica.</p>
<div class="eq key" data-name="Factorización de la función de partición molecular">\[q=q_\mathrm{tras}\,q_\mathrm{rot}\,q_\mathrm{vib}\,q_\mathrm{elec},\quad q_\mathrm{tras}=\frac V{\Lambda^3},\ \Lambda=\frac h{\sqrt{2\pi mk_BT}};\quad q_\mathrm{rot}^\mathrm{lin}=\frac T{\sigma\theta_\mathrm{rot}},\ q_\mathrm{rot}^\mathrm{nl}=\frac{\sqrt\pi}\sigma\sqrt{\frac{T^3}{\theta_A\theta_B\theta_C}};\quad q_\mathrm{vib}=\prod_i\frac1{1-e^{-\theta_i/T}}.\]</div>
<p>Aquí \(\theta_\mathrm{rot}=hcB/k_B\) y \(\theta_\mathrm{vib}=hc\tilde\nu/k_B\) son las temperaturas características (capítulo 27), \(\sigma\) es el <em>número de simetría</em> (el número de rotaciones propias que llevan la molécula a sí misma: 2 para \(\mathrm{N_2}\) y \(\mathrm{H_2O}\), 3 para \(\mathrm{NH_3}\), 12 para \(\mathrm{CH_4}\); el capítulo 26 muestra cómo se obtiene del grupo puntual) y la parte electrónica es \(q_\mathrm{elec}=\sum g_ie^{-\varepsilon_i/k_BT}\), casi siempre solo el término fundamental (con degeneración \(g_0\)). La energía de traslación del gas da la <span class="term">ecuación de Sackur–Tetrode</span> (1912) para la entropía de un gas monoatómico: \(S=Nk_B[\ln(V/N\Lambda^3)+5/2]\).</p>
</section>

<section>
<h2>Entropías y capacidades caloríficas desde constantes espectroscópicas</h2>
<p>Con las constantes de los capítulos 22–28 (masa, \(B\) o \(A,B,C\), frecuencias \(\tilde\nu_i\), degeneración electrónica) se calcula la entropía estándar y el \(C_p\) de cualquier gas ideal en la aproximación de rotor rígido y oscilador armónico (RRHO). Las contribuciones a \(S^\circ\) tienen órdenes de magnitud muy distintos:</p>
<div class="sim" data-sim="entropia-mol" data-title="Entropía estándar y C_p de gases a partir de constantes moleculares, frente a las tablas termodinámicas"></div>
<div class="sim-guide"><ul>
<li>H₂O a 298.15 K: traslación 144.9, rotación 43.8, vibración 0.03 J/(mol·K): \(S^\circ=188.72\) frente a 188.94 de la tabla NASA (188.83, JANAF). La entropía de un gas es, casi toda, traslación (77 %) y rotación (23 %); a esta temperatura las vibraciones están congeladas (\(\theta_\mathrm{vib}\sim5000\) K), aportan unos centésimos. \(C_p=33.48\) frente a 33.59 J/(mol·K).</li>
<li>N₂: 191.56 (tabla: 191.62; JANAF 191.61); CH₄: 186.32 (186.48); NH₃: 192.69 (192.88); CO₂: 213.76 (213.90); CO: 197.61 (197.77); O₂: 205.08 (205.26) donde la degeneración electrónica 3 del estado fundamental triplete aporta \(R\ln3=9.13\) J/(mol·K). Todas están a menos de 0.3 J/(mol·K) de la tabla, sin parámetros ajustables.</li>
<li>Suba la temperatura: a 1000 K el CO₂ gana 23 J/(mol·K) en vibración (los modos de 667 cm⁻¹ están ya excitados) y el RRHO queda 0.4 J/(mol·K) por debajo de la tabla; a 1500 K las diferencias llegan a 0.5–1.9 J/(mol·K) por la anarmonicidad y el acoplamiento rotación–vibración, ignorados en este modelo. Los ajustes de las tablas modernas (Goos, Burcat y Ruscic, 2010; ATcT) los incluyen.</li>
</ul></div>
</section>

<section>
<h2>Congelación de grados de libertad</h2>
<p>El teorema de equipartición dice que cada grado de libertad cuadrático aporta \(\tfrac12k_BT\) a la energía, es decir, \(\tfrac12R\) a \(C_V\). Una diatómica tiene 3 de traslación, 2 de rotación y 2 de vibración (cinética y potencial): \(C_V=\tfrac72R\). Pero a temperatura ambiente el N₂ solo tiene \(\tfrac52R\). El motivo es cuántico: un movimiento solo contribuye cuando \(k_BT\gtrsim\) la separación de sus niveles, es decir, cuando \(T\gtrsim\theta\); por debajo, sus niveles están «congelados» y la capacidad calorífica de ese grado de libertad cae a cero. Fue una de las razones, junto con el cuerpo negro, para aceptar la cuantización (Einstein, 1907; Nernst, 1910).</p>
<div class="sim" data-sim="escalones" data-title="Escalones de la capacidad calorífica de una diatómica con la temperatura"></div>
<div class="sim-guide"><ul>
<li>N₂ (\(\theta_\mathrm{rot}=2.9\) K, \(\theta_\mathrm{vib}=3393\) K): \(C_V/R=2.500\) desde 25 K hasta 298 K (rotación completa, vibración congelada), 2.91 a 1000 K y 3.40 a 3000 K, acercándose al límite clásico 3.5. Por debajo de 3 K tendría el escalón de rotación, pero el N₂ ya es sólido.</li>
<li>H₂ (\(\theta_\mathrm{rot}=87.6\) K): la rotación se activa entre 30 y 300 K, justo en el intervalo accesible: a 25 K, \(C_V/R=1.89\); a 100 K, 2.42; a 298 K, 2.45. En el H₂ real la curva tiene además una joroba, que depende de si se deja que el orto y el para se equilibren (con un catalizador) o se mantengan en la proporción 3:1 (el «hidrógeno normal» que aquí se calcula), con el espín nuclear del capítulo 27.</li>
<li>NO (con el doblete electrónico \({}^2\Pi_{1/2},{}^2\Pi_{3/2}\) a 121 cm⁻¹): un exceso de \(C_V\) a baja temperatura (2.89 \(R\) a 100 K) y la vibración sumada después, de modo que la curva tiene un máximo antes del escalón vibracional: el mismo comportamiento que la anomalía de Schottky de abajo.</li>
</ul></div>
</section>

<section>
<h2>Sistemas de pocos niveles: la anomalía de Schottky</h2>
<p>Un sistema con solo dos niveles (por ejemplo, el desdoblamiento del estado fundamental por un campo magnético o por el acoplamiento espín–órbita) tiene una función de partición \(q=g_0+g_1e^{-\Delta/k_BT}\) y una capacidad calorífica con un <em>máximo</em> a una temperatura \(T\approx0.42\,\Delta/k_B\): a baja temperatura el nivel superior está vacío y no puede absorber energía; a alta, está tan poblado como el inferior y tampoco. Entre ambos extremos la absorción es máxima (Schottky, 1922; el mismo comportamiento es el de un espín en un campo magnético, que se usa para refrigerar en el límite de los milikelvin).</p>
<div class="eq key" data-name="Capacidad calorífica de un sistema de dos niveles">\[C_V=R\,x^2\,\frac{r}{(1+r)^2},\quad x=\frac\Delta{k_BT},\ r=\frac{g_1}{g_0}e^{-x};\qquad(g_0=g_1)\ \ C_V^\mathrm{máx}=0.4392\,R\ \text{en}\ x=2.399.\]</div>
<div class="sim" data-sim="schottky" data-title="Anomalía de Schottky de un sistema de dos niveles"></div>
<div class="sim-guide"><ul>
<li>Con \(\Delta=300\) cm⁻¹ (431.6 K) y \(g_0=g_1=1\), el máximo está en 179.8 K (0.417 \(\Delta/k_B\)) y vale \(0.439R\); a la temperatura marcada (300 K) el 19 % de los sistemas están en el nivel superior. Con \(g_1=3\) el máximo sube a \(1.02R\), se desplaza a 150 K (0.349 \(\Delta/k_B\)) y la entropía de alta temperatura vale \(R\ln4=11.5\) J/(mol·K).</li>
<li>Esta curva explica el exceso de \(C_V\) del NO a baja temperatura y la contribución electrónica del átomo de Cl (\({}^2P_{3/2}\)–\({}^2P_{1/2}\), 882 cm⁻¹), que es importante a 1000 K. Los máximos de \(C_V\) de sistemas con niveles espaciados (Schottky) son la huella termodinámica de los niveles de energía: de la posición del máximo se lee la separación sin necesidad de espectroscopía.</li>
<li>La entropía al llegar al límite de alta temperatura es \(R\ln(g_0+g_1)\): el número total de estados accesibles es lo que cuenta la entropía de Boltzmann \(S=k_B\ln W\) (capítulo 1).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule la longitud de onda térmica \(\Lambda\) del N₂ a 298.15 K y la función de partición traslacional por unidad de volumen \(1/\Lambda^3\).
<details><summary>Respuesta</summary><p>\(m=28.0134\) u \(=4.652\times10^{-26}\) kg; \(\Lambda=h/\sqrt{2\pi mk_BT}=6.626\times10^{-34}/\sqrt{2\pi(4.652\times10^{-26})(4.116\times10^{-21})}=1.91\times10^{-11}\) m (0.19 Å, mucho menor que la distancia entre moléculas, 3.4 nm a 1 bar, y por eso un gas es clásico en traslación). \(1/\Lambda^3=1.43\times10^{32}\) m⁻³. Para un volumen de 1 L (\(10^{-3}\) m³), \(q_\mathrm{tras}=1.4\times10^{29}\).</p></details></li>
<li><span class="lvl">Básico</span>Con la ecuación de Sackur–Tetrode, calcule la entropía molar estándar del Ar a 298.15 K y 1 bar (\(m=39.948\) u).
<details><summary>Respuesta</summary><p>\(S=R[\ln(k_BT/P^\circ\Lambda^3)+5/2]\). \(m=6.634\times10^{-26}\) kg; \(\Lambda=h/\sqrt{2\pi mk_BT}=1.600\times10^{-11}\) m, \(\Lambda^3=4.09\times10^{-33}\) m³; \(k_BT/P^\circ=4.116\times10^{-21}/10^5=4.116\times10^{-26}\) m³. El cociente vale \(1.006\times10^{7}\), \(\ln=16.12\), y \(S=8.3145\,(16.12+2.5)=154.8\) J/(mol·K), el valor de las tablas (154.84).</p></details></li>
<li><span class="lvl">Intermedio</span>Para el HCl (\(B=10.59\) cm⁻¹, \(\sigma=1\)) a 298.15 K, halle \(\theta_\mathrm{rot}\), \(q_\mathrm{rot}\) y la fracción de moléculas en \(J=0\).
<details><summary>Respuesta</summary><p>\(\theta_\mathrm{rot}=1.4388\times10.59=15.24\) K; \(q_\mathrm{rot}=T/\sigma\theta_\mathrm{rot}=19.6\) (aprox. de alta temperatura). Fracción en \(J=0\): \(1/q=5.1\) % (exacta: 5.0 %, de la simulación del capítulo 22).</p></details></li>
<li><span class="lvl">Intermedio</span>¿Qué fracción de moléculas de N₂ está en \(v=1\) a 1000 K y a 3000 K (\(\theta_\mathrm{vib}=3393\) K)?
<details><summary>Respuesta</summary><p>\(p_1=e^{-\theta/T}(1-e^{-\theta/T})\): a 1000 K, \(e^{-3.393}=0.0336\), \(p_1=0.0325\) (3 %); a 3000 K, \(e^{-1.131}=0.323\), \(p_1=0.219\) (22 %).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que el máximo de la capacidad calorífica de Schottky (\(g_0=g_1\)) está en \(x=2.399\) y vale \(0.4392R\).
<details><summary>Respuesta</summary><p>Con \(g_0=g_1\), \(C_V/R=x^2e^{-x}/(1+e^{-x})^2=x^2/(4\cosh^2(x/2))\). Derivando: \(\mathrm d/\mathrm dx[x^2/\cosh^2(x/2)]=0\Rightarrow2x\cosh(x/2)-x^2\sinh(x/2)=0\Rightarrow x=2\coth(x/2)\), cuya raíz es \(x=2.399\). Entonces \(C_V/R=2.399^2/(4\cosh^2(1.1997))=0.4392\).</p></details></li>
</ol>
