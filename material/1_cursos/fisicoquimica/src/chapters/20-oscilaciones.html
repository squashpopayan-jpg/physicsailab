<p class="lead">Una reacción química puede latir como un corazón. En 1951 Borís Belousov mezcló ácido cítrico, bromato y cerio en un matraz y vio que el color pasaba del amarillo al incoloro y volvía, una y otra vez. Los editores rechazaron el artículo con el argumento de que la termodinámica prohíbe tal cosa. No la prohíbe: prohíbe oscilaciones en un sistema cerrado que se aproxima al equilibrio, no en uno que se mantiene lejos de él. Este capítulo explica cuándo y por qué ocurre, con los modelos mínimos que lo muestran (Lotka, Brusselator, Oregonator), y termina con el mecanismo con el que Turing propuso que una mezcla uniforme puede generar sola manchas y rayas.</p>

<section>
<h2>Autocatálisis y lejanía del equilibrio</h2>
<p>El ingrediente de todo comportamiento complejo es la <span class="term">autocatálisis</span>: un producto que acelera su propia formación, \(\mathrm A+\mathrm X\to2\,\mathrm X\), con velocidad \(v=k[\mathrm A][\mathrm X]\). Si \([\mathrm A]+[\mathrm X]=c\) es constante, \(\dot x=k\,x(c-x)\) y la solución es la logística, \(x(t)=c\big/\big[1+\tfrac{c-x_0}{x_0}e^{-kct}\big]\): un periodo de inducción lento mientras hay poco \(\mathrm X\), un crecimiento exponencial (la retroalimentación positiva) y la saturación cuando se agota \(\mathrm A\). Las reacciones de reloj (la del yodo de Landolt, 1886) son autocatálisis: no pasa nada durante minutos y de golpe todo cambia de color.</p>
<p>Para que haya <em>oscilaciones</em> se necesita, además, una retroalimentación negativa con retraso y un sistema <em>abierto</em>. Cerca del equilibrio, la termodinámica de los procesos irreversibles (Onsager, Prigogine) dice que un sistema relaja monótonamente: el potencial termodinámico \(G\) decrece y no puede subir. En un reactor que se alimenta continuamente con reactivos y descarga productos (o en una solución con un gran exceso de bromato que se consume muy despacio), la composición se mantiene lejos del equilibrio y esa restricción desaparece. Prigogine llamó <em>estructuras disipativas</em> a las organizaciones espaciales y temporales que se sostienen así, y recibió el Nobel de Química de 1977.</p>
<p>La herramienta matemática es el análisis de estabilidad lineal. Si \(\dot{\mathbf c}=\mathbf f(\mathbf c)\) tiene un punto fijo \(\mathbf c^*\), las perturbaciones pequeñas evolucionan con el Jacobiano \(\mathsf J=\partial\mathbf f/\partial\mathbf c\) en \(\mathbf c^*\). Para dos variables, los valores propios cumplen \(\lambda^2-\mathrm{tr}\,\mathsf J\,\lambda+\det\mathsf J=0\). Cuando la traza cruza cero con determinante positivo, el par complejo conjugado \(\lambda=\mu\pm i\omega\) pasa de \(\mu<0\) (espiral hacia el punto fijo) a \(\mu>0\) (espiral hacia fuera): es la <span class="term">bifurcación de Hopf</span>, de la que nace un ciclo límite, una oscilación de amplitud y período fijos que no depende de las condiciones iniciales.</p>
</section>

<section>
<h2>Lotka: una oscilación sin amortiguamiento</h2>
<p>Alfred Lotka propuso en 1910 y 1920 el primer esquema químico con oscilaciones: \(\mathrm A+\mathrm X\xrightarrow{k_1}2\,\mathrm X\), \(\mathrm X+\mathrm Y\xrightarrow{k_2}2\,\mathrm Y\), \(\mathrm Y\xrightarrow{k_3}\mathrm B\). Con \([\mathrm A]\) constante es el sistema de presa y depredador de Lotka y Volterra:</p>
<div class="eq" data-name="Lotka químico">\[\dot x=k_1[\mathrm A]\,x-k_2xy,\qquad\dot y=k_2xy-k_3y,\qquad V=k_2(x+y)-k_3\ln x-k_1[\mathrm A]\ln y=\text{cte}.\]</div>
<p>El punto fijo \((k_3/k_2,\,k_1[\mathrm A]/k_2)\) es un <em>centro</em>: todas las órbitas cercanas son cerradas, y cada una es una curva de nivel de la cantidad conservada \(V\). Para oscilaciones pequeñas el período es \(2\pi/\sqrt{k_1[\mathrm A]k_3}\); las órbitas grandes oscilan más despacio. El sistema es conservativo y por eso <em>frágil</em>: cualquier perturbación pequeña cambia de órbita, y cualquier término disipativo pequeño destruye las órbitas cerradas (el centro pasa a ser un foco). No es lo que hacen los relojes químicos reales, que vuelven a su ciclo después de ser perturbados.</p>
<div class="sim" data-sim="lotka" data-title="Lotka químico: órbitas cerradas en el plano de fases y cantidad conservada"></div>
<div class="sim-guide"><ul>
<li>Con \(k_1[\mathrm A]=k_2=k_3=1\), el centro está en \((1,1)\) y el período lineal es \(2\pi=6.283\). La órbita que parte de \((0.6,\,1.2)\) tiene período 6.42 y X oscila entre 0.58 y 1.60; la de \((0.2,\,0.2)\), mucho mayor, tiene período 8.07 y X sube hasta 4.0. A mayor amplitud, período más largo: una oscilación no lineal.</li>
<li>La cantidad \(V\) permanece constante dentro de \(10^{-9}\) (error numérico del integrador): es lo que hace que el sistema «recuerde» su amplitud inicial. Los modelos siguientes, en cambio, olvidan la condición inicial y convergen al mismo ciclo.</li>
</ul></div>
</section>

<section>
<h2>El Brusselator y la bifurcación de Hopf</h2>
<p>Prigogine y Lefever (1968), en Bruselas, plantearon el modelo más sencillo con un ciclo límite estable: con los reactivos \(\mathrm A,\mathrm B\) mantenidos constantes,</p>
<div class="eq" data-name="Brusselator">\[\mathrm A\to\mathrm X,\quad\mathrm B+\mathrm X\to\mathrm Y+\mathrm D,\quad2\mathrm X+\mathrm Y\to3\mathrm X,\quad\mathrm X\to\mathrm E;\qquad\dot x=A-(B+1)x+x^2y,\quad\dot y=Bx-x^2y.\]</div>
<p>(Todas las constantes son 1 en unidades adimensionales.) El paso trimolecular \(2\mathrm X+\mathrm Y\to3\mathrm X\) es la autocatálisis, y la reacción \(\mathrm B+\mathrm X\to\mathrm Y+\mathrm D\) la retroalimentación negativa. El punto fijo es \((A,\,B/A)\) y su Jacobiano \(\begin{pmatrix}B-1&A^2\\-B&-A^2\end{pmatrix}\) tiene traza \(B-1-A^2\) y determinante \(A^2>0\): el punto fijo pierde estabilidad en</p>
<div class="eq key" data-name="Umbral de Hopf del Brusselator">\[B_c=1+A^2,\qquad\lambda=\frac{(B-1-A^2)\pm\sqrt{(B-1-A^2)^2-4A^2}}{2},\qquad\omega_c=A,\quad T_c=\frac{2\pi}{A}.\]</div>
<div class="sim" data-sim="brusselator" data-title="Brusselator: evolución, plano de fases, nulclinas y ciclo límite"></div>
<div class="sim-guide"><ul>
<li>Con \(A=1\), \(B_c=2\). A \(B=1.5\) los valores propios son \(-0.25\pm0.968\,i\): la solución espirala hacia el punto fijo. A \(B=3\) son \(0.5\pm0.866\,i\): espirala hacia fuera hasta un ciclo límite de período 7.16 (el lineal, \(2\pi=6.28\)) y amplitud de X de 3.38. A \(B=5\) los valores propios son reales (2.62 y 0.38), el período se alarga a 11.65 y la amplitud sube a 9.3: oscilación de relajación.</li>
<li>Cerca del umbral la amplitud es pequeña y crece como la raíz de la distancia al umbral, \(\approx2.3\sqrt{B-B_c}\) con \(A=1\) (0.33 a \(B=2.02\), 0.68 a \(B=2.08\)): es una bifurcación de Hopf <em>supercrítica</em>, con la que el ciclo nace suavemente. Con \(B=2.2\) el período es 6.37, casi el valor lineal.</li>
<li>Con \(A=2\), \(B_c=5\): \(B=4.5\) amortigua y \(B=5.5\) oscila con período 3.98 (\(\pi=3.14\) es el lineal). Cualquiera que sea el punto de partida la trayectoria llega al mismo ciclo: ese es el contraste con el modelo de Lotka.</li>
</ul></div>
</section>

<section>
<h2>La reacción de Belousov–Zhabotinsky y el Oregonator</h2>
<p>La reacción de Belousov (1951) oxida un ácido orgánico (primero cítrico, luego malónico) con bromato en medio ácido y con un catalizador metálico, \(\mathrm{Ce^{3+}/Ce^{4+}}\) o ferroína. Anatol Zhabotinsky (1964) la estudió con el malónico y la hizo reproducible; sus resultados llegaron a Occidente en la conferencia de Praga de 1968, y en 1970 Zaikin y Zhabotinsky observaron ondas químicas en capa fina. El mecanismo de Field, Körös y Noyes (FKN, 1972) tiene unas veinte etapas, pero su esencia son tres procesos: (A) el \(\mathrm{Br^-}\) reduce el bromato y mantiene baja la concentración de \(\mathrm{HBrO_2}\); (B) cuando el \(\mathrm{Br^-}\) cae por debajo de un valor crítico, el \(\mathrm{HBrO_2}\) se multiplica de modo autocatalítico y oxida el catalizador (\(\mathrm{Ce^{3+}\to Ce^{4+}}\)), con un brusco cambio de color; (C) el \(\mathrm{Ce^{4+}}\) oxida el ácido orgánico y regenera \(\mathrm{Br^-}\), que cierra el ciclo. El <em>Oregonator</em> (de Oregon, donde Field trabajaba) lo reduce a cinco pasos, y Tyson lo escaló a tres variables (\(x=[\mathrm{HBrO_2}]\), \(y=[\mathrm{Br^-}]\), \(z=[\mathrm{Ce^{4+}}]\)):</p>
<div class="eq key" data-name="Oregonator de Tyson">\[\varepsilon\dot x=qy-xy+x(1-x),\qquad\varepsilon'\dot y=-qy-xy+f\,z,\qquad\dot z=x-z,\]</div>
<p>con los valores habituales \(\varepsilon=0.04\), \(\varepsilon'=4\times10^{-4}\), \(q=8\times10^{-4}\) (reducción de Tyson y Fife, 1980) y \(f\) el parámetro estequiométrico que mide cuánto \(\mathrm{Br^-}\) produce cada \(\mathrm{Ce^{4+}}\) reducido. La separación de escalas (\(\varepsilon,\varepsilon'\ll1\)) hace que el sistema sea <em>rígido</em> y que la oscilación sea de relajación: tramos de variación lenta separados por saltos casi instantáneos. Se integra con el método de Rosenbrock del capítulo 18.</p>
<div class="sim" data-sim="oregonator" data-title="Oregonator de Tyson: oscilaciones de la reacción de Belousov–Zhabotinsky"></div>
<div class="sim-guide"><ul>
<li>Con \(f=1\) el período es 6.21 (unidades adimensionales), el catalizador oxidado \(z\) oscila entre 0.003 y 0.318, y la concentración de \(\mathrm{Br^-}\) cambia por un factor de más de 2000 entre un extremo y otro del ciclo. Eso es lo que produce el cambio de color de la reacción real.</li>
<li>Las oscilaciones existen solo en una ventana de \(f\): con estos parámetros, entre \(f\approx0.5\) y \(f\approx2.3\). A \(f=0.7\) el período es 6.32 con \(z\) hasta 0.41; a \(f=1.5\), 6.39; a \(f=2\), 6.81 con \(z\) hasta 0.19. Con \(f=0.3\) el catalizador queda mayormente oxidado y con \(f\ge2.4\), casi todo reducido: en ambos casos hay un estado estacionario estable.</li>
<li>Subir \(q\) (más \(\mathrm{Br^-}\) regenerado) acorta el ciclo: con \(f=1\) y \(q=3\times10^{-3}\), el período baja a 4.52 y el salto de \(\mathrm{Br^-}\) a un factor de 500. En la reacción real el período es de decenas de segundos a unos minutos y puede durar horas en un reactor cerrado, hasta que se agota el bromato.</li>
</ul></div>
</section>

<section>
<h2>Biestabilidad e histéresis: el modelo de Schlögl</h2>
<p>La autocatálisis no siempre produce oscilaciones: puede producir dos estados estacionarios estables. En el modelo de Schlögl (1972), \(\mathrm A+2\mathrm X\rightleftharpoons3\mathrm X\) y \(\mathrm B\rightleftharpoons\mathrm X\), la velocidad neta de \(\mathrm X\) es una cúbica,</p>
<div class="eq" data-name="Modelo de Schlögl">\[\dot x=k_1a\,x^2-k_2x^3+k_3b-k_4x.\]</div>
<p>Con \(k_1a=3\), \(k_2=1\) y \(k_4=2\) la cúbica es \(-(x^3-3x^2+2x)+k_3b\), cuyos extremos locales están en \(x=1\pm1/\sqrt3\) y valen \(\pm2/(3\sqrt3)=\pm0.385\). Para \(0<k_3b<0.385\) hay tres estados estacionarios: dos estables (con \(\dd\dot x/\dd x<0\)) y uno inestable entre ellos; fuera de esa ventana queda uno solo. Si se aumenta \(k_3b\) desde cero, el sistema sigue la rama baja hasta que desaparece en \(k_3b=0.385\) y salta a la rama alta; si se lo disminuye, la rama alta se mantiene hasta que desaparece en el otro extremo. Eso es una <span class="term">histéresis</span>: el estado depende de la historia. Es la misma matemática de la transición líquido–vapor de van der Waals (capítulos 2 y 7: tres raíces y bucle) y de la transición de primer orden de Ising, en un sistema fuera del equilibrio.</p>
<div class="sim" data-sim="schlogl" data-title="Modelo de Schlögl: tres estados estacionarios, estabilidad e histéresis"></div>
<div class="sim-guide"><ul>
<li>Con \(k_3b=0.05\) los estados son 0.026 (estable), 0.950 (inestable) y 2.024 (estable). Con \(k_3b=0.2\), 0.121, 0.791 y 2.088; con 0.35, 0.286, 0.571 y 2.143: las dos ramas estables se acercan al estado inestable y este se acerca a la rama baja, hasta que se funden en el extremo de la ventana, \(0.385\).</li>
<li>Con \(k_3b=0.5\), fuera de la ventana, queda un único estado (2.191). El panel derecho muestra la curva en forma de «S» con las ramas estables e inestables en colores distintos (véase la leyenda); la línea vertical es el valor del control.</li>
<li>Las reacciones biestables en reactores de mezcla continua (CSTR) aparecen en la combustión (ignición y extinción) y en las reacciones enzimáticas con inhibición por sustrato; se observa el mismo bucle de histéresis al subir y bajar la temperatura o el caudal.</li>
</ul></div>
</section>

<section>
<h2>Patrones de Turing: reacción y difusión</h2>
<p>Alan Turing publicó en 1952, dos años antes de morir, «The chemical basis of morphogenesis». Su idea es contraintuitiva: la difusión, que tiende a borrar las diferencias de concentración, puede <em>desestabilizar</em> un estado homogéneo que sin difusión es estable. Se necesita un activador \(\mathrm X\) (autocatalítico, que se difunde poco) y un inhibidor \(\mathrm Y\) (que se difunde mucho más). Una fluctuación local de \(\mathrm X\) crece, pero el inhibidor que produce se esparce rápido y frena a los vecinos: así se forman manchas separadas por una distancia característica. Con difusión el Jacobiano de cada modo de Fourier \(e^{ikx}\) es \(\mathsf J-k^2\,\mathrm{diag}(D_X,D_Y)\); el estado homogéneo es inestable si algún modo \(k\) tiene \(\mathrm{Re}\,\lambda(k)>0\) siendo estable para \(k=0\). Para el Brusselator con difusión resulta</p>
<div class="eq key" data-name="Inestabilidad de Turing del Brusselator">\[B_T=\Bigl(1+A\sqrt{D_X/D_Y}\Bigr)^2,\qquad k_c^2=\frac{A}{\sqrt{D_XD_Y}},\qquad\lambda_c=\frac{2\pi}{k_c},\]</div>
<p>de modo que hay patrón estacionario para \(B_T<B<B_c\): hace falta \(D_Y>D_X\): con \(D_Y=D_X\), \(B_T=(1+A)^2>B_c\), la inestabilidad de Hopf llega antes y no hay ventana de Turing. En la naturaleza, la reacción CIMA (cloro–yodo–ácido malónico) en un gel, con almidón que forma un complejo poco móvil con el yodo y frena la difusión del activador, dio los primeros patrones de Turing en el laboratorio (Castets, De Kepper et al., 1990; Ouyang y Swinney, 1991), 38 años después de la propuesta. En biología, Kondo y Asai (1995) mostraron que las rayas del pez ángel <em>Pomacanthus</em> se desplazan y se reorganizan como predice un modelo de este tipo. Las manchas del leopardo, la pigmentación de las conchas y la formación de los dedos son los candidatos más estudiados, con discusión viva sobre cuáles son realmente de Turing.</p>
<div class="sim" data-sim="turing1d" data-title="Brusselator con difusión en una dimensión: relación de dispersión y patrón en el espacio-tiempo"></div>
<div class="sim-guide"><ul>
<li>Con \(A=2\), \(D_Y/D_X=8\) y \(B=3.2\), entre los umbrales de Turing (\(B_T=2.91\)) y de Hopf (\(B_c=5\)), la relación de dispersión es positiva en una banda de \(k\) centrada en \(k_c=0.841\) (longitud de onda 7.47). La simulación explícita, desde ruido de 1 %, produce un patrón estacionario de 8 máximos en \(L=60\): longitud de onda 7.50, dentro del 0.5 % de la predicción lineal, y amplitud de 1.85.</li>
<li>Con \(B=2.5<B_T\) el estado homogéneo es estable y la perturbación se borra. Con \(D_Y/D_X=4\), \(B_T=4.0\): a \(B=3.2\) no hay patrón; con \(D_Y/D_X=16\), \(B_T=2.25\), \(\lambda_c=8.89\) y el patrón (7 máximos, 8.57) es de mayor amplitud (3.8).</li>
<li>Si \(B>B_c\) hay a la vez oscilaciones y modo de Turing: los patrones son oscilantes y de forma irregular. El botón de semilla cambia la perturbación inicial: la longitud de onda no cambia, la posición de las franjas sí.</li>
</ul></div>
<p>La reacción de Gray y Scott (1983) tiene un esquema todavía más simple: \(\mathrm U+2\mathrm V\to3\mathrm V\) (autocatálisis de V), \(\mathrm V\to\mathrm P\), con \(\mathrm U\) alimentado a la tasa \(F\) y \(\mathrm V\) retirado a \(F+k\):</p>
<div class="eq" data-name="Gray–Scott">\[\partial_tu=D_u\nabla^2u-uv^2+F(1-u),\qquad\partial_tv=D_v\nabla^2v+uv^2-(F+k)v.\]</div>
<p>Los estados homogéneos son \((1,0)\) y, si \(F\ge4(F+k)^2\), dos estados \(uv=F+k\) con \(v=F\bigl(1\pm\sqrt{1-4(F+k)^2/F}\bigr)/[2(F+k)]\); la frontera de existencia es \(k=\sqrt F/2-F\). John Pearson (1993) recorrió el plano \((F,k)\) y encontró una zoología de patrones que dependen de la receta y de la condición inicial: manchas estables, manchas que se dividen («mitosis»), rayas, laberintos y ondas. Muchos viven en la región donde el estado homogéneo trivial \((1,0)\) es estable y los patrones son estructuras localizadas, nacidas de una perturbación de amplitud finita.</p>
<div class="sim" data-sim="grayscott" data-title="Gray–Scott en dos dimensiones: manchas, mitosis, rayas y laberintos"></div>
<div class="sim-guide"><ul>
<li>Cada receta parte de un pequeño cuadrado perturbado en el centro. En «mitosis» (\(F=0.0367\), \(k=0.0649\)), la mancha central crece, se estrangula y se divide; tras unas 2500 unidades hay un anillo de ocho manchas que se dividen a su vez, y llenan el medio. En «manchas estables» (\(F=0.030\), \(k=0.062\)) se forma una red de manchas casi regulares tras unas 6000 unidades.</li>
<li>«Laberinto» (\(F=0.0545\), \(k=0.062\)) crece como un coral hasta cubrir el dominio, con un ancho de franja casi constante: la longitud de onda característica de la inestabilidad. Esa receta sí tiene estados homogéneos no triviales, (0.469, 0.248) y (0.531, 0.219), según el panel de salida. «Rayas» (\(F=0.040\), \(k=0.060\)) está justo en la frontera de existencia, \(k=\sqrt F/2-F\), y desde la semilla cuadrada da un tejido de franjas con la simetría del cuadro.</li>
<li>Mueva \(F\) o \(k\) con la simulación en marcha: el patrón se reorganiza y, según la zona del plano \((F,k)\), las manchas se disuelven, se dividen o se alargan en rayas. El tamaño de la franja lo fijan las difusividades y las constantes, no el tamaño del dominio.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Para el Brusselator con \(A=1.5\) y \(B=4\), calcule el punto fijo, los valores propios del Jacobiano y decida si hay oscilaciones. Estime el período inicial.
<details><summary>Respuesta</summary><p>Punto fijo \((1.5,\,2.667)\). Traza \(=B-1-A^2=0.75\), determinante \(A^2=2.25\); \(B_c=1+A^2=3.25<4\). Discriminante \(0.5625-9<0\): \(\lambda=0.375\pm1.452\,i\). El punto fijo es inestable y hay ciclo límite. Período inicial \(2\pi/1.452=4.33\) (el período del ciclo es mayor, como en el ejemplo de \(A=1\)).</p></details></li>
<li><span class="lvl">Básico</span>Demuestre que el modelo de Schlögl con \(k_1a=3\), \(k_2=1\), \(k_4=2\) es biestable para \(0<k_3b<2/(3\sqrt3)\).
<details><summary>Respuesta</summary><p>Los estados estacionarios cumplen \(g(x)\equiv x^3-3x^2+2x=k_3b\). \(g'(x)=3x^2-6x+2=0\) en \(x=1\pm1/\sqrt3\), con \(g(1-1/\sqrt3)=+2/(3\sqrt3)=0.385\) (máximo local) y \(g(1+1/\sqrt3)=-0.385\) (mínimo). La recta horizontal \(g=k_3b\) corta tres veces la curva si \(-0.385<k_3b<0.385\); como \(k_3b\ge0\), la ventana física es \(0\le k_3b<0.385\).</p></details></li>
<li><span class="lvl">Intermedio</span>Brusselator con difusión, \(A=1.5\), \(D_X=1\), \(D_Y=10\). Calcule \(B_T\), \(B_c\), \(k_c\) y la longitud de onda del patrón. ¿Aparece el patrón a \(B=2.5\)?
<details><summary>Respuesta</summary><p>\(B_T=(1+1.5/\sqrt{10})^2=(1.474)^2=2.17\); \(B_c=1+2.25=3.25\). \(k_c^2=A/\sqrt{D_XD_Y}=1.5/3.162=0.474\), \(k_c=0.689\), \(\lambda_c=2\pi/0.689=9.1\). Como \(2.17<2.5<3.25\), el estado homogéneo es estable frente a oscilaciones (Hopf) pero inestable frente a Turing: aparece un patrón estacionario de longitud de onda cercana a 9.1.</p></details></li>
<li><span class="lvl">Intermedio</span>En el Lotka químico con \(k_1[\mathrm A]=2\), \(k_2=1\), \(k_3=0.5\), halle el punto fijo y el período de oscilaciones pequeñas. ¿Cómo cambia el período si se cuadruplica \([\mathrm A]\)?
<details><summary>Respuesta</summary><p>\((x^*,y^*)=(k_3/k_2,\,k_1[\mathrm A]/k_2)=(0.5,\,2)\). \(T=2\pi/\sqrt{k_1[\mathrm A]k_3}=2\pi/\sqrt{1}=6.28\). Con \([\mathrm A]\) multiplicado por 4, el producto \(k_1[\mathrm A]k_3\) se multiplica por 4 y el período se divide por 2: 3.14.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que el sistema de Gray–Scott tiene estados homogéneos no triviales solo si \(F\ge4(F+k)^2\), y verifique para \(F=0.04\) que la frontera es \(k=0.06\).
<details><summary>Respuesta</summary><p>Con \(v\ne0\), el estado estacionario de \(v\) da \(uv=F+k\equiv s\); el de \(u\), \(F(1-u)=uv^2=sv\), es decir \(u=1-sv/F\). Sustituir en \(uv=s\): \(v-sv^2/F=s\), o \((s/F)v^2-v+s=0\). Hay raíces reales si el discriminante \(1-4s^2/F\ge0\), es decir, \(F\ge4(F+k)^2\). Para \(F=0.04\): \(F+k\le\sqrt F/2=0.1\), \(k\le0.06\).</p></details></li>
</ol>
