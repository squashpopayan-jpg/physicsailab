<p class="lead">Echar sal al hielo de una carretera lo derrite, la sal en el agua de la olla hace que hierva un poco más caliente, y las células se hinchan o se arrugan según el suero en que se sumerjan. Los tres fenómenos son consecuencia de un solo hecho: un soluto no volátil rebaja el potencial químico del disolvente. Las propiedades que dependen solo de <em>cuántas</em> partículas de soluto hay, y no de cuáles son, se llaman <span class="term">coligativas</span> (del latín <em>colligatus</em>, unidas). Este capítulo las deduce del criterio de equilibrio y las aplica a la desalinización del agua de mar y a la fisiología de la célula.</p>

<section>
<h2>El soluto baja el potencial químico del disolvente</h2>
<p>En una disolución, el potencial químico del disolvente es \(\mu_A=\mu_A^*+RT\ln a_A\). Como la actividad \(a_A\) del disolvente es menor que 1 al añadir soluto, su potencial químico baja. Las cuatro propiedades coligativas son manifestaciones de ese descenso:</p>
<ul>
<li><b>Descenso de la presión de vapor</b> (Raoult): \(P=x_AP_A^*\).</li>
<li><b>Descenso del punto de congelación</b>: el sólido puro (\(\mu^*_{A,s}\)) debe igualar al disolvente de la disolución.</li>
<li><b>Ascenso del punto de ebullición</b>: hace falta calentar más para igualar el potencial del vapor.</li>
<li><b>Presión osmótica</b>: la presión que hay que aplicar a la disolución para igualar \(\mu_A\) con el disolvente puro a través de una membrana semipermeable.</li>
</ul>
<p>Para el punto de congelación, la igualdad \(\mu_{A,s}^*(T)=\mu_{A,l}^*(T)+RT\ln a_A\) y la ecuación de Gibbs–Helmholtz (capítulo 4) dan, con \(\Delta_{fus}H\) constante, \(\ln a_A=-\dfrac{\Delta_{fus}H}{R}\left(\dfrac1T-\dfrac1{T_f^*}\right)\). Si la disolución es ideal y diluida, \(\ln a_A=\ln(1-x_B)\approx-x_B\) y resulta, con la molalidad \(m\) del soluto y la masa molar \(M_A\) del disolvente (\(x_B\approx mM_A\)):</p>
<div class="eq key" data-name="Descensos crioscópico y ebulloscópico">\[\Delta T_f=K_f\,i\,m,\quad K_f=\frac{RM_AT_f^{*2}}{\Delta_{fus}H};\qquad\Delta T_b=K_b\,i\,m,\quad K_b=\frac{RM_AT_b^{*2}}{\Delta_{vap}H}.\]</div>
<p>Para el agua, \(K_f=1.86\) K·kg/mol y \(K_b=0.513\) K·kg/mol. El <span class="term">factor de van't Hoff</span> \(i\) cuenta las partículas que se forman por cada unidad de soluto (1 para sacarosa, 2 para NaCl, 3 para CaCl₂ en el límite diluido). Las constantes \(K_f\) y \(K_b\) son propiedades del disolvente: por eso el benceno (\(K_f=5.12\)) o el alcanfor (\(K_f=40\)) sirven para medir masas molares con cantidades pequeñas.</p>
<div class="sim" data-sim="crioscopia" data-title="Descenso del punto de congelación y ascenso del de ebullición del agua con distintos solutos"></div>
<div class="sim-guide"><ul>
<li>NaCl 1 mol/kg: el modelo real (coeficiente osmótico de Pitzer, \(\phi=0.936\)) da \(\Delta T_f=3.44\) K frente a 3.72 K de la ley de primer orden con \(i=2\). A 4 mol/kg, el modelo real da 15.6 K, mayor que los 14.9 K de primer orden: a concentraciones altas el coeficiente osmótico supera 1.</li>
<li>La salmuera del agua de mar (35 g/kg, equivalente a 0.6 mol/kg de NaCl) congela en el modelo de NaCl a −2.1 °C, algo más que el valor real, −1.9 °C, porque el agua de mar contiene sales de mayor masa molar y un 10 % menos de partículas por kilogramo.</li>
<li>Etilenglicol al 50 % en masa (\(m=16.1\) mol/kg): el modelo ideal da −24 °C (y la ley de primer orden, −30 °C); el valor real del anticongelante al 50 % es cercano a −37 °C. Es un caso de desviación negativa fuerte (el glicol forma enlaces de hidrógeno con el agua) donde el modelo ideal queda corto.</li>
<li>El ascenso ebulloscópico es mucho menor: 0.5 K para 1 mol/kg de soluto no electrolito. Disolver 10 g de sal en un litro de agua para cocinar eleva la temperatura de ebullición solo 0.17 K: no acelera la cocción.</li>
</ul></div>
<div class="box ex"><h4>Medir la masa molar por crioscopía</h4>
<p>Se disuelven 2.50 g de un soluto no electrolito en 100.0 g de agua y la disolución congela a −0.465 °C. Halle la masa molar.</p>
<details><summary>Solución</summary><p>\(m=\Delta T_f/K_f=0.465/1.86=0.250\) mol/kg, que son 0.0250 mol en 0.1000 kg. \(M=2.50/0.0250=100\) g/mol. Con el benceno (\(K_f=5.12\)) el mismo experimento da un descenso 2.75 veces mayor, y es el motivo para elegir el disolvente de \(K_f\) mayor.</p></details>
</div>
</section>

<section>
<h2>Presión osmótica y ósmosis inversa</h2>
<p>Una membrana semipermeable deja pasar el agua y retiene el soluto. Si separa agua pura de una disolución, el agua fluye hacia la disolución (<em>ósmosis</em>) hasta que una sobrepresión \(\Pi\) en el lado de la disolución iguala el potencial químico del agua en ambos lados: \(\mu_A^*(P)=\mu_A^*(P+\Pi)+RT\ln a_A\), y como \((\partial\mu/\partial P)_T=V_A\),</p>
<div class="eq key" data-name="Presión osmótica">\[\Pi\,V_A=-RT\ln a_A\ \xrightarrow{\ \text{ideal, diluida}\ }\ \Pi=c_BRT\quad(\text{van't Hoff, 1887}).\]</div>
<p>La ecuación de van't Hoff, idéntica a la de los gases ideales, contribuyó al primer Premio Nobel de Química (1901). Con \(\Pi=-RT\ln a_A/V_A\) se puede calcular la presión osmótica de cualquier disolución a partir de la actividad del agua. Para el agua de mar (35 g/kg, equivalente a 0.6 mol/kg de NaCl) resulta \(\Pi=2.83\) MPa, 28 bar. Es la presión mínima que hay que aplicar para <em>invertir</em> el flujo del agua: \(\Delta P>\Pi\) fuerza el agua a pasar de la salmuera al lado limpio: la <span class="term">ósmosis inversa</span>.</p>
<p>La salmuera se concentra a medida que se extrae agua, y su presión osmótica sube. El trabajo mínimo para producir un metro cúbico de agua dulce a partir de agua de mar lo marca la termodinámica: \(w_{min}=\dfrac1r\displaystyle\int_0^r\dfrac{-RT\ln a_w}{V_w}\,\dd r'\), con \(r\) la fracción de agua recuperada. El resultado es de 0.79 kWh/m³ en el límite de recuperación nula y 1.1 kWh/m³ al 50 %.</p>
<div class="sim" data-sim="osmosis-inversa" data-title="Desalinización por ósmosis inversa: presión osmótica y trabajo mínimo"></div>
<div class="sim-guide"><ul>
<li>Agua de mar (35 g/kg) con 50 % de recuperación: la alimentación tiene 28 bar de presión osmótica y la salmuera 58 bar; la membrana debe operar por encima de este último valor, y los equipos de agua de mar trabajan entre 55 y 80 bar. El trabajo mínimo termodinámico es 1.10 kWh/m³.</li>
<li>Las plantas reales consumen entre 2.5 y 4 kWh/m³: se aprovecha menos de la mitad. Las pérdidas vienen de las bombas, la fricción en los módulos, la polarización de concentración y las diferencias de presión finitas; la termodinámica fija el piso, no el consumo real.</li>
<li>Con agua salobre (5 g/kg), el trabajo mínimo baja a 0.22 kWh/m³ al 80 % de recuperación: se desalinizan aguas subterráneas salobres con una quinta parte de la energía.</li>
<li>Recuperaciones superiores a 50 % con agua de mar exigen presiones cada vez mayores (al 60 %, la salmuera llega a 74 bar; al 70 %, más de 100 bar), por encima de lo que soportan los equipos: por eso se opera en el intervalo 35–50 %.</li>
</ul></div>
</section>

<section>
<h2>Células en soluciones: osmolalidad y tonicidad</h2>
<p>La membrana de una célula es casi impermeable a los iones y permeable al agua: es una membrana semipermeable natural. Si el medio tiene menor osmolalidad que el interior (soluciones <em>hipotónicas</em>), entra agua y la célula se hincha; si es mayor (<em>hipertónicas</em>), sale agua y se arruga (crenación). La osmolalidad de la sangre humana es de unos 290 mOsm/kg de agua. El suero fisiológico, 0.9 % en masa de NaCl (0.154 mol/L), es <em>isotónico</em>: tiene la misma osmolalidad, 288 mOsm/kg, y por eso se usa en inyecciones y soluciones de lavado. Un glóbulo rojo se comporta como un osmómetro casi ideal (ecuación de Boyle–van't Hoff): su volumen es \(V=V_b+(V_0-V_b)\,\Pi_0/\Pi\), con \(V_b\) el volumen sin agua osmóticamente activa, y estalla (hemólisis) cuando se hincha a 1.4–1.5 veces su volumen.</p>
<div class="sim" data-sim="globulo-rojo" data-title="Un glóbulo rojo en soluciones de NaCl: ecuación de Boyle–van't Hoff"></div>
<div class="sim-guide"><ul>
<li>En 0.9 % de NaCl el volumen relativo vale 1 (isotónico). En agua destilada, la célula se hincha sin límite hasta la lisis. La lisis comienza hacia 0.52 % (con \(V_b=0.3\)), compatible con el intervalo de 0.45–0.55 % NaCl donde empieza la hemólisis en las pruebas de fragilidad osmótica.</li>
<li>En 1.8 % la célula pierde más de un tercio de su volumen y se arruga. Por eso no se debe beber agua de mar: su osmolalidad (unos 1100 mOsm/kg) deshidrata las células.</li>
<li>Los líquidos intravenosos (suero salino 0.9 %, dextrosa 5 %, Ringer lactato) se preparan isotónicos con la sangre: una solución muy hipotónica provocaría hemólisis; una hipertónica, crenación.</li>
</ul></div>
<div class="box note"><h4>La actividad del agua en los alimentos</h4><p>La actividad del agua \(a_w=p/p^*\) es lo que hace que la miel, la mermelada o el jamón curado se conserven: casi ningún microorganismo crece con \(a_w<0.90\) (la mayoría de las bacterias necesitan \(a_w>0.91\)), y los hongos xerófilos son los últimos en rendirse, hacia 0.65. La sal y el azúcar actúan por la misma vía que los solutos coligativos: bajan \(a_w\) y, por lo tanto, el potencial químico del agua que los microbios podrían usar.</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿A qué temperatura congela una disolución 0.50 mol/kg de glucosa en agua? ¿Y de CaCl₂ (suponer \(i=3\))?
<details><summary>Respuesta</summary><p>Glucosa: \(\Delta T=1.86(0.50)=0.93\) K, a −0.93 °C. CaCl₂: \(1.86(3)(0.50)=2.79\) K, a −2.79 °C (en la práctica, algo menos, por el coeficiente osmótico).</p></details></li>
<li><span class="lvl">Básico</span>Calcule la presión osmótica de una disolución 0.10 mol/L a 25 °C.
<details><summary>Respuesta</summary><p>\(\Pi=cRT=100\ \mathrm{mol/m^3}\times8.3145\times298.15=2.48\times10^5\) Pa = 2.48 bar = 2.45 atm.</p></details></li>
<li><span class="lvl">Intermedio</span>Se disuelven 1.00 g de una proteína en 100 mL de agua a 25 °C, y la presión osmótica es de 0.254 kPa. Estime su masa molar.
<details><summary>Respuesta</summary><p>\(c=\Pi/RT=254/(8.3145\times298.15)=0.1025\) mol/m³ \(=1.025\times10^{-4}\) mol/L, que son \(1.025\times10^{-5}\) mol en 0.100 L. \(M=1.00\ \mathrm{g}/(1.025\times10^{-5}\ \mathrm{mol})=9.8\times10^4\) g/mol. La osmometría es el método natural para macromoléculas porque la crioscopia da descensos de microkelvin.</p></details></li>
<li><span class="lvl">Intermedio</span>Con \(\Delta_{vap}H=40.66\) kJ/mol, verifique \(K_b=0.513\) K·kg/mol para el agua.
<details><summary>Respuesta</summary><p>\(K_b=RM_AT_b^2/\Delta_{vap}H=8.3145(0.018015)(373.15)^2/40\,660=0.513\) K·kg/mol.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que, para una disolución diluida, \(\Pi=c_BRT\) partiendo de \(\Pi V_A=-RT\ln x_A\).
<details><summary>Respuesta</summary><p>\(\ln x_A=\ln(1-x_B)\approx-x_B\) y \(x_B\approx n_B/n_A\). Entonces \(\Pi V_A=RT\,n_B/n_A\) y, como \(n_AV_A\approx V\) (el volumen de la disolución), \(\Pi=n_BRT/V=c_BRT\).</p></details></li>
</ol>
