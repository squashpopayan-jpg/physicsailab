<p class="lead">El agua es el disolvente de la vida y de casi toda la química analítica, y en ella los iones H⁺ y OH⁻ gobiernan la forma de las moléculas: si una proteína se pliega, si un fármaco cruza una membrana, si una roca se disuelve o si un coral construye su esqueleto. Todo se reduce a equilibrios químicos del capítulo 5 aplicados a especies cargadas en agua. Este capítulo organiza esos equilibrios con unas pocas herramientas: el pH, las constantes de acidez, las fracciones de especiación y el balance de carga.</p>

<section>
<h2>El agua, el pH y la constante de autoionización</h2>
<p>El agua se autoioniza en una proporción minúscula: \(2\,\mathrm{H_2O\rightleftharpoons H_3O^++OH^-}\), con \(K_w=a_{H^+}a_{OH^-}\). Con los datos termodinámicos del capítulo 3, \(\Delta_rG^\circ=+79.93\) kJ/mol y \(K_w=e^{-79930/RT}=1.0\times10^{-14}\) a 25 °C. La reacción inversa, la neutralización, es la más exotérmica de las reacciones ácido–base fuertes (−55.8 kJ/mol), de modo que \(K_w\) crece con la temperatura: \(pK_w=14.94\) a 0 °C, 14.00 a 25 °C, 13.26 a 50 °C y 12.29 a 100 °C. A 100 °C el agua pura es neutra a pH 6.14, no a 7: neutro significa \([\mathrm{H^+}]=[\mathrm{OH^-}]\), no «pH = 7».</p>
<p>El <span class="term">pH</span> se define con la actividad, \(\mathrm{pH}=-\log_{10}a_{H^+}\) (IUPAC); en disoluciones diluidas la actividad se aproxima por la concentración dividida por 1 mol/L, y así se hace aquí. La corrección por fuerza iónica se desarrolla en el capítulo 12.</p>
<h3>Ácidos y bases débiles</h3>
<p>Un ácido \(\mathrm{HA}\) se ioniza según \(\mathrm{HA\rightleftharpoons H^++A^-}\), con \(K_a=[\mathrm H^+][\mathrm A^-]/[\mathrm{HA}]\) y \(pK_a=-\log K_a\). Una base débil \(\mathrm B\) se describe mejor con la constante de acidez de su ácido conjugado, \(\mathrm{BH^+}\), porque \(K_aK_b=K_w\). Para un ácido de concentración \(C\), el balance de carga \([\mathrm H^+]=[\mathrm A^-]+[\mathrm{OH^-}]\) da, si el agua es despreciable, \([\mathrm H^+]=\tfrac12\left(-K_a+\sqrt{K_a^2+4K_aC}\right)\). El ácido acético 0.1 M (\(pK_a=4.76\)) tiene pH 2.88 y se ioniza solo en 1.3 %; a 0.001 M el pH es 3.91 y el grado de ionización sube a 12.3 %: la ley de dilución de Ostwald, los ácidos débiles se ionizan más cuanto más diluidos.</p>
<p>La herramienta más útil para sistemas con varias especies es la fracción de cada una en función del pH. Para un ácido poliprótico \(\mathrm{H}_n\mathrm A\), la fracción de la especie que ha perdido \(k\) protones es</p>
<div class="eq key" data-name="Fracciones de especiación">\[\alpha_k=\frac{\prod_{i=1}^kK_i\,[\mathrm H^+]^{n-k}}{[\mathrm H^+]^n+K_1[\mathrm H^+]^{n-1}+K_1K_2[\mathrm H^+]^{n-2}+\cdots+K_1\cdots K_n},\qquad\sum_k\alpha_k=1,\]</div>
<p>(con el producto vacío igual a 1 para \(k=0\)), y la carga media por molécula es \(z_0-\sum k\,\alpha_k\). Dos especies adyacentes valen lo mismo cuando \(\mathrm{pH}=pK_a\). En una molécula con grupos ácidos y básicos, como los aminoácidos, el pH en que la carga media se anula es el <span class="term">punto isoeléctrico</span>, el pH al que migran menos en un campo eléctrico (electroforesis).</p>
<div class="sim" data-sim="especiacion" data-title="Diagrama de especiación de ácidos y bases: fracciones de cada especie frente al pH"></div>
<div class="sim-guide"><ul>
<li>Fosfato: a pH 7.2 (el de la sangre y el citoplasma), \(\mathrm{H_2PO_4^-}\) y \(\mathrm{HPO_4^{2-}}\) valen 50 % cada uno porque pH = \(pK_{a2}\); por eso el fosfato es un tampón celular.</li>
<li>Glicina: el punto isoeléctrico es 6.07, el promedio de los dos \(pK_a\) (2.35 y 9.78). A ese pH la especie dominante es el zwitterión, con carga neta cero.</li>
<li>Ácido cítrico a pH 7.4: 91 % está como \(\mathrm{Cit^{3-}}\) y 9 % como \(\mathrm{HCit^{2-}}\): el citrato fisiológico es casi todo tricarboxilato.</li>
<li>Ácido carbónico: a pH 7.4 el 92 % del carbono inorgánico es bicarbonato y el CO₂ disuelto, solo 8 %. Observe que el \(\mathrm{H_2CO_3}\) del modelo representa la suma de CO₂(aq) y H₂CO₃.</li>
</ul></div>
</section>

<section>
<h2>Tampones y curvas de valoración</h2>
<p>Una disolución de un ácido débil y de su base conjugada resiste los cambios de pH: es un <span class="term">tampón</span>. Despejando el pH de la constante de acidez se obtiene la ecuación de Henderson–Hasselbalch:</p>
<div class="eq key" data-name="Henderson–Hasselbalch">\[\mathrm{pH}=pK_a+\log_{10}\frac{[\mathrm A^-]}{[\mathrm{HA}]}.\]</div>
<p>Una mezcla 0.1 M de acético y 0.1 M de acetato tiene pH 4.76. Añadir 0.01 mol de HCl a 1 L de esa disolución lo baja a 4.67; la misma cantidad en agua pura lo baja de 7 a 2. La eficacia se mide con la <em>capacidad tampón</em> \(\beta=\dd n_{base}/\dd\mathrm{pH}\), máxima cuando pH = \(pK_a\), donde vale \(\beta_{max}=\tfrac{\ln10}{4}C\), y útil en el intervalo \(pK_a\pm1\).</p>
<p>La curva de valoración, el pH en función del volumen de titulante, se calcula resolviendo el balance de carga a cada volumen. Las zonas de pH casi constante son los tampones: la mitad del camino a cada equivalencia, el pH es el \(pK_a\), y esa es la manera de medir constantes de acidez. El salto de pH en el punto de equivalencia permite visualizarlo con un indicador cuya zona de viraje contenga el pH de equivalencia.</p>
<div class="sim" data-sim="titulacion" data-title="Curvas de valoración exactas de ácidos, bases y sales con indicadores"></div>
<div class="sim-guide"><ul>
<li>Ácido fuerte 0.1 M con NaOH 0.1 M: el pH salta de 3.70 a 10.30 entre 24.9 y 25.1 mL y vale exactamente 7.00 en el punto de equivalencia. Cualquier indicador sirve. Pero con 0.001 M el salto se reduce a 5.7 → 8.3: solo el azul de bromotimol funciona.</li>
<li>Ácido acético: pH 4.76 a 12.5 mL (semiequivalencia, punto verde en la curva) y 8.73 en la equivalencia: la base conjugada, el acetato, es una base débil. Se necesita la fenolftaleína, no el naranja de metilo. El cianhídrico (\(pK_a=9.21\)) tiene equivalencia en 10.95: se valora mal en agua.</li>
<li>Fosfórico: dos saltos útiles, con pH de equivalencia de 4.70 y 9.66 (el promedio \(\tfrac12(pK_{a1}+pK_{a2})\) y \(\tfrac12(pK_{a2}+pK_{a3})\) aproximados); el tercero (\(pK_{a3}=12.35\)) se confunde con el del agua.</li>
<li>Carbonato de sodio con HCl: equivalencias a pH 8.34 (bicarbonato) y 3.91 (ácido carbónico), de modo que se usan dos indicadores en una misma valoración. El pH de una disolución de NaHCO₃ es el promedio de los dos \(pK_a\) (8.34), independiente de su concentración.</li>
</ul></div>
</section>

<section>
<h2>El sistema del carbono: lluvia y océano</h2>
<p>El dióxido de carbono atmosférico es el ácido más importante del planeta. Se disuelve según la ley de Henry (\(\mathrm{[CO_2(aq)]}=K_H\,p_{CO_2}\), con \(K_H=0.0339\) mol/L·atm a 25 °C) y se ioniza en dos pasos, con \(pK_1=6.35\) y \(pK_2=10.33\) en agua pura. La lluvia, en equilibrio con 420 ppm, tiene pH 5.64: es la «lluvia ácida natural»; con los 280 ppm preindustriales tenía 5.73. Se considera lluvia ácida antropogénica la de pH inferior a unos 5, causada por óxidos de azufre y nitrógeno, no por el CO₂.</p>
<p>El agua de mar, en cambio, contiene una reserva de bases: bicarbonato, carbonato y borato. Lo que se mantiene casi constante al agregar CO₂ no es el pH sino la <span class="term">alcalinidad total</span> (los equivalentes de bases débiles menos los de ácidos fuertes, medida por valoración):</p>
<div class="eq key" data-name="Alcalinidad total del agua de mar">\[\mathrm{TA}=[\mathrm{HCO_3^-}]+2[\mathrm{CO_3^{2-}}]+[\mathrm{B(OH)_4^-}]+[\mathrm{OH^-}]-[\mathrm{H^+}].\]</div>
<p>Con la TA fija y el CO₂ que se disuelve (lo que añade carbono inorgánico disuelto, DIC), el equilibrio \(\mathrm{CO_2+CO_3^{2-}+H_2O\rightleftharpoons2HCO_3^-}\) consume carbonato: el pH baja, y también la saturación de la calcita \(\Omega=[\mathrm{Ca^{2+}}][\mathrm{CO_3^{2-}}]/K_{ps}^*\), que decide si las conchas de carbonato de calcio de los organismos marinos se forman o se disuelven (\(\Omega>1\) las favorece). Se llama <span class="term">acidificación del océano</span>.</p>
<div class="sim" data-sim="oceano" data-title="Acidificación del océano: pH, carbonato y saturación de la calcita frente al CO₂ atmosférico"></div>
<div class="sim-guide"><ul>
<li>A 25 °C, salinidad 35, alcalinidad 2300 µmol/kg y fCO₂ = 400 µatm, el cálculo da pH (escala total) 8.04, DIC 2001 µmol/kg y \(\Omega_{calcita}=5.1\); coincide con el programa de referencia CO2SYS (apéndice de validación).</li>
<li>Con \(\mathrm{fCO_2}=280\) µatm (1750), el pH habría sido 8.17; con 425 µatm (hoy), 8.02; con 900 µatm (escenario SSP5-8.5 a 2100), 7.74. La escala del pH es logarítmica: una caída de 0.145 es un aumento de 40 % en [H⁺].</li>
<li>El \(\mathrm{[CO_3^{2-}]}\) baja de 262 a 204 y a 120 µmol/kg; \(\Omega\) de 6.3 a 4.9 y 2.9. Las aguas frías y polares, que disuelven más CO₂ y tienen menos carbonato, alcanzan \(\Omega<1\) antes que las tropicales.</li>
<li>El factor de Revelle, 9.6, dice que el agua de mar tiene poco poder amortiguador frente al CO₂: para que la fugacidad suba 10 %, el carbono inorgánico total solo debe subir 1 %. Es la razón de que el océano absorba solo parte de las emisiones.</li>
</ul></div>
</section>

<section>
<h2>Solubilidad de sales poco solubles</h2>
<p>La disolución de un sólido iónico en equilibrio con sus iones, por ejemplo \(\mathrm{AgCl(s)\rightleftharpoons Ag^++Cl^-}\), se describe con el <span class="term">producto de solubilidad</span> \(K_{ps}=[\mathrm{Ag^+}][\mathrm{Cl^-}]\) (la actividad del sólido es 1). Con las energías de Gibbs de formación del capítulo 3, \(K_{ps}(\mathrm{AgCl})=1.75\times10^{-10}\), que coincide con el valor de las tablas (1.77×10⁻¹⁰). En agua pura la solubilidad molar es \(\sqrt{K_{ps}}=1.3\times10^{-5}\) M.</p>
<p>La solubilidad cambia con la composición del medio en tres maneras:</p>
<ul>
<li><b>Efecto del ion común.</b> En 0.1 M de NaCl, el \(\mathrm{[Ag^+]}\) cae a \(1.8\times10^{-9}\) M.</li>
<li><b>Efecto del pH.</b> Si el anión es una base (OH⁻, F⁻, CO₃²⁻), la solubilidad crece al bajar el pH, porque el ion se protona: \(\mathrm{CaF_2+2H^+\to Ca^{2+}+2HF}\). El \(\mathrm{Mg(OH)_2}\) cumple \(S=K_{ps}/[\mathrm{OH^-}]^2\): a pH 10 vale solo \(5.6\times10^{-4}\) mol/L.</li>
<li><b>Complejación.</b> El ion metálico forma complejos solubles con el ligando: el cloruro precipita la plata a \([\mathrm{Cl^-}]\) bajos pero la redisuelve a altos como \(\mathrm{AgCl_2^-}\).</li>
</ul>
<div class="sim" data-sim="solubilidad" data-title="Solubilidad de sales frente al ion común, la complejación y el pH"></div>
<div class="sim-guide"><ul>
<li>AgCl: la solubilidad total tiene un <em>mínimo</em> de \(3.1\times10^{-7}\) M hacia \([\mathrm{Cl^-}]=10^{-2.5}\) M, y sube de nuevo para cloruros altos (2.1×10⁻⁶ M con 0.1 M), por los complejos AgCl(aq) y AgCl₂⁻ (líneas de trazos). Es el mismo motivo por el que el agua de mar disuelve plata.</li>
<li>CaF₂: a pH 7 su solubilidad es \(2.1\times10^{-4}\) M; a pH 3 sube a \(3.8\times10^{-4}\) M, porque el HF (\(pK_a=3.17\)) retira fluoruro. Es parte de la razón por la que la fluorita y el esmalte (hidroxiapatita) se disuelven en medios ácidos.</li>
<li>CaCO₃ en sistema cerrado: la solubilidad a pH 7 es \(3.0\times10^{-3}\) M, y a pH 8.2 es \(6.8\times10^{-4}\) M. Los suelos y aguas ácidas disuelven la caliza.</li>
<li>\(\mathrm{Mg(OH)_2}\): pase el pH de 10 a 12: la solubilidad cae \(10^4\) veces (de \(5.6\times10^{-4}\) a \(5.6\times10^{-8}\) M), de modo que la leche de magnesia se disuelve en el estómago pero precipita en medio básico.</li>
</ul></div>
<div class="box warn"><h4>Un límite del modelo</h4><p>Todo este capítulo usa concentraciones en lugar de actividades. A fuerza iónica de 0.1 M, la actividad de un ion divalente es 0.4 de su concentración, y los productos de solubilidad aparentes crecen de 2 a 5 veces. En agua de mar (I = 0.7 M) se trabaja con constantes «estequiométricas» medidas en ese medio, como las de la simulación del océano. La teoría que lo justifica está en el capítulo 12.</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Halle el pH de una disolución 0.050 M de ácido fórmico (\(pK_a=3.75\)).
<details><summary>Respuesta</summary><p>\(K_a=1.78\times10^{-4}\); \([\mathrm H^+]=\tfrac12(-K_a+\sqrt{K_a^2+4K_aC})=2.89\times10^{-3}\), pH = 2.54 (grado de ionización 5.8 %).</p></details></li>
<li><span class="lvl">Básico</span>¿Qué relación \([\mathrm{acetato}]/[\mathrm{ácido}]\) da un tampón de pH 5.50?
<details><summary>Respuesta</summary><p>\(\log(\mathrm{A^-}/\mathrm{HA})=5.50-4.76=0.74\); la relación es 5.5. Está fuera del mejor intervalo (\(pK_a\pm1\)), pero cerca.</p></details></li>
<li><span class="lvl">Intermedio</span>Se valoran 25 mL de ácido acético 0.1 M con NaOH 0.1 M. Halle el pH a 12.5 mL y en la equivalencia.
<details><summary>Respuesta</summary><p>A 12.5 mL, \([\mathrm A^-]=[\mathrm{HA}]\), pH = 4.76. En la equivalencia hay 0.05 M de acetato: \(K_b=K_w/K_a=5.8\times10^{-10}\), \([\mathrm{OH^-}]=\sqrt{K_bC}=5.4\times10^{-6}\), pH = 8.73.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Cuál es la solubilidad del Mg(OH)₂ a pH 9 y a pH 11? (\(K_{ps}=5.61\times10^{-12}\))
<details><summary>Respuesta</summary><p>\([\mathrm{OH^-}]=10^{-5}\): \(S=5.61\times10^{-12}/10^{-10}=0.056\) M; a pH 11, \(S=5.6\times10^{-6}\) M. Cada dos unidades de pH cambia 10⁴ veces.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que el pH de una disolución de una sal anfótera como NaHCO₃ es \(\tfrac12(pK_{a1}+pK_{a2})\) cuando \(C\gg K_{a1}\) y \(K_{a2}C\gg K_w\).
<details><summary>Respuesta</summary><p>El balance de protones \([\mathrm{H^+}]+[\mathrm{H_2CO_3}]=[\mathrm{CO_3^{2-}}]+[\mathrm{OH^-}]\) se escribe \([\mathrm H^+]+[\mathrm{HCO_3^-}][\mathrm H^+]/K_1=K_2[\mathrm{HCO_3^-}]/[\mathrm H^+]\) (despreciando \(\mathrm{OH^-}\)). Con \([\mathrm{HCO_3^-}]\approx C\gg[\mathrm H^+]\) se obtiene \([\mathrm H^+]^2=K_1K_2\). El resultado es 8.34 e independiente de \(C\).</p></details></li>
</ol>
