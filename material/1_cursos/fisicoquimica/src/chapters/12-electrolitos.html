<p class="lead">Cuando una sal se disuelve en agua, los iones se separan y se rodean de moléculas de disolvente. Dos hechos gobiernan lo que sigue: cada ion está rodeado de agua orientada (solvatación), y cada ion está rodeado, a mayor escala, de otros iones de carga opuesta (la atmósfera iónica). Lo primero explica que las sales se disuelvan, lo segundo que la ley de Raoult y las constantes de equilibrio de los capítulos anteriores fallen incluso en disoluciones muy diluidas: las fuerzas de Coulomb son de largo alcance y no se cancelan. Este capítulo construye la teoría de Debye y Hückel (1923), que explica la actividad de los iones, y la conductividad, que mide cómo se mueven.</p>

<section>
<h2>Iones y moléculas de agua: la solvatación</h2>
<p>Un ion de carga \(ze\) y radio \(r\) en un medio de permitividad relativa \(\varepsilon_r\) tiene una energía electrostática de «carga» que Born (1920) calculó cargando una esfera conductora en un dieléctrico continuo. La diferencia entre el vacío y el disolvente es la energía de Gibbs de solvatación:</p>
<div class="eq key" data-name="Ecuación de Born">\[\Delta_{solv}G=-\frac{N_Az^2e^2}{8\pi\varepsilon_0\,r}\left(1-\frac1{\varepsilon_r}\right).\]</div>
<p>Es negativa y crece como \(z^2/r\): los iones pequeños y de carga alta se solvatan con más fuerza. Con el radio cristalino, el modelo sobreestima la energía por factor 1.5–2 (para el Na⁺, −722 kJ/mol frente a −365 experimental), porque el continuo no ve la estructura del agua. Latimer corrigió el radio sumando 0.85 Å a los cationes (el hidrógeno del agua se acerca más al anión que el oxígeno al catión) y 0.10 Å a los aniones; con eso el modelo acierta dentro de 10 %.</p>
<div class="sim" data-sim="born-solv" data-title="Energía de solvatación de iones: modelo de Born y datos de Marcus"></div>
<div class="sim-guide"><ul>
<li>Con el radio cristalino (puntos grises) el modelo sobreestima la energía de solvatación de los cationes en 60–140 % (Li⁺: −1143 frente a −475 kJ/mol) pero la de los aniones solo en 8–16 %: el radio cristalino de un anión es casi su radio efectivo. Con la corrección de Latimer (puntos azules) todos los iones caen dentro de ±10 %, y el modelo reproduce las tendencias (Li⁺ &gt; Na⁺ &gt; K⁺ &gt; Cs⁺; F⁻ &gt; Cl⁻ &gt; Br⁻ &gt; I⁻).</li>
<li>Cambie ε_r a 2 (disolvente no polar): el factor \(1-1/\varepsilon_r\) pasa de 0.99 a 0.5 y la energía de solvatación se reduce a la mitad. Como la energía reticular del NaCl (787 kJ/mol) solo la compensan los dos iones hidratados en agua (−365 y −340 kJ/mol), en un disolvente apolar la disolución no ocurre: es la razón de que el NaCl se disuelva en agua y no en hexano.</li>
<li>Suba ε_r hacia 100: la energía de solvatación casi no cambia por encima de 40: la mayor parte de la «polaridad» se logra con ε_r moderados.</li>
</ul></div>
</section>

<section>
<h2>Actividad de los iones: la teoría de Debye–Hückel</h2>
<p>Los iones de una sal no pueden estudiarse por separado, porque la electroneutralidad exige que haya iguales cargas positivas y negativas. Lo que se mide es el <span class="term">coeficiente de actividad medio</span> \(\gamma_\pm=(\gamma_+^{\nu_+}\gamma_-^{\nu_-})^{1/\nu}\), con \(\nu=\nu_++\nu_-\). La actividad de la sal en molalidad es \(a=(\gamma_\pm m_\pm)^\nu\). Lewis y Randall (1921) observaron que, a bajas concentraciones, \(\gamma_\pm\) depende de la concentración solo a través de la <span class="term">fuerza iónica</span></p>
<div class="eq key" data-name="Fuerza iónica">\[I=\tfrac12\sum_im_iz_i^2,\]</div>
<p>y que da lo mismo cuál sea la sal: una ley universal. Debye y Hückel la explicaron en 1923. Cada ion está rodeado de una «nube» con exceso de carga opuesta (la <em>atmósfera iónica</em>), que apantalla su campo. Resolviendo la ecuación de Poisson–Boltzmann linealizada, el potencial a distancia \(r\) del ion central es el de Coulomb multiplicado por un factor exponencial decreciente:</p>
<div class="eq">\[\psi(r)=\frac{ze}{4\pi\varepsilon_0\varepsilon_r r}\,e^{-\kappa r},\qquad\kappa^2=\frac{2N_Ae^2\rho_w}{\varepsilon_0\varepsilon_rk_BT}\,I.\]</div>
<p>La longitud \(1/\kappa\) es la <span class="term">longitud de Debye</span>, el radio característico de la atmósfera: vale 0.304/√\(I\) nm en agua a 25 °C (\(I\) en mol/L). La energía electrostática de interacción del ion con su atmósfera da la corrección al potencial químico y, de allí, la <b>ley límite de Debye–Hückel</b>:</p>
<div class="eq key" data-name="Ley límite de Debye–Hückel">\[\log_{10}\gamma_\pm=-A\,|z_+z_-|\sqrt I,\qquad A=\frac{(2\pi N_A\rho_w)^{1/2}}{\ln10}\left(\frac{e^2}{4\pi\varepsilon_0\varepsilon_rk_BT}\right)^{3/2}=0.511\ \ (25\,°\mathrm C).\]</div>
<p>\(A\) sale solo de constantes universales y de las propiedades del agua: no tiene parámetros ajustables. La ley es exacta cuando \(I\to0\) y falla a concentraciones de más de 0.01 mol/kg porque desprecia el tamaño de los iones. Las modificaciones más usadas son la <em>ley extendida</em> \(\log\gamma_\pm=-A|z_+z_-|\sqrt I/(1+Ba\sqrt I)\) (con \(a\) del orden de 3–6 Å y \(B=0.329\) Å⁻¹·(mol/kg)^−½) y la <em>ecuación de Davies</em>, \(\log\gamma_\pm=-A|z_+z_-|\left[\sqrt I/(1+\sqrt I)-0.3I\right]\), útil hasta \(I\approx0.5\). Para concentraciones mayores se usan las ecuaciones de Pitzer (1973), que añaden a la teoría de Debye–Hückel un desarrollo en potencias de la molalidad con parámetros de interacción binaria \(\beta^{(0)}\), \(\beta^{(1)}\), \(C^\phi\), ajustados a datos medidos, y llegan hasta 6 mol/kg.</p>
<div class="sim" data-sim="atmosfera" data-title="La atmósfera iónica: potencial apantallado y longitud de Debye"></div>
<div class="sim-guide"><ul>
<li>La longitud de Debye depende solo de la fuerza iónica: 960 nm en el agua pura (\(10^{-7}\) M), 9.6 nm con \(10^{-3}\) M, 0.96 nm con 0.1 M y 0.36 nm en el agua de mar (\(I=0.7\)). A 0.1 M, la nube iónica es del tamaño de unos pocos iones: la teoría continua empieza a fallar.</li>
<li>El potencial apantallado cae mucho más rápido que el de Coulomb: a 1 nm de un ion en 0.1 M, queda el 36 % del potencial desnudo; en 1 mM, 90 %.</li>
<li>La carga de la atmósfera es más probable a la distancia \(1/\kappa\), no pegada al ion: la densidad de carga \(\rho(r)\propto e^{-\kappa r}/r\) disminuye con \(r\), pero la carga en una capa esférica, \(4\pi r^2\rho\), pasa por un máximo en \(r=1/\kappa\).</li>
</ul></div>
<div class="sim" data-sim="debye-huckel" data-title="Coeficiente de actividad medio: ley límite, extendida, Davies y Pitzer"></div>
<div class="sim-guide"><ul>
<li>NaCl 0.01 mol/kg: la ley límite da \(\gamma_\pm=0.889\), la extendida y la de Davies 0.90, y Pitzer (que reproduce el experimento) 0.902. A 0.1 mol/kg, la ley límite falla en 11 % (0.689) mientras que Davies da 0.781 y el experimento 0.778.</li>
<li>CaCl₂ 0.1 mol/kg (\(I=0.3\), \(|z_+z_-|=2\)): la ley límite da 0.28, Davies 0.54, Pitzer 0.52 y el experimento 0.518: los electrolitos 2:1 se apartan del límite mucho antes porque el efecto crece con \(z^2\).</li>
<li>Para el MgSO₄ (2:2) \(\gamma_\pm\) cae a 0.17 en 0.1 mol/kg y 0.08 en 0.5 mol/kg: los iones se aparean (par iónico Mg²⁺·SO₄²⁻) y la fracción libre es menor.</li>
<li>A concentraciones altas, \(\gamma_\pm\) <em>vuelve a subir</em>: el NaCl pasa por un mínimo de 0.655 en 1 mol/kg y sube a 0.71 en 3 mol/kg y a 0.99 en 6 mol/kg (el agua disponible para solvatar disminuye, y los iones «escapan» más). La teoría de Debye–Hückel no puede predecirlo; la de Pitzer sí, porque tiene términos de interacción binaria.</li>
</ul></div>
</section>

<section>
<h2>Conductividad de los electrolitos</h2>
<p>Un campo eléctrico hace migrar los iones: los cationes hacia el cátodo y los aniones hacia el ánodo. La <span class="term">conductividad</span> \(\kappa\) (S/m) de la disolución es la suma de las contribuciones de cada ion, \(\kappa=\sum_ic_i|z_i|\lambda_i\); dividida por la concentración, es la <span class="term">conductividad molar</span> \(\Lambda_m=\kappa/c\). Para una sal fuerte, \(\Lambda_m\) disminuye con la raíz de la concentración, porque la atmósfera iónica frena a cada ion (<em>ley de Kohlrausch</em>, 1900):</p>
<div class="eq key" data-name="Kohlrausch y Onsager">\[\Lambda_m=\Lambda_m^\circ-K\sqrt c,\qquad K=A_O+B_O\Lambda_m^\circ\ \ (\text{Onsager, 1927}),\ \ \Lambda_m^\circ=\lambda_+^\circ+\lambda_-^\circ.\]</div>
<p>La segunda igualdad es la <b>ley de la migración independiente de los iones</b>: a dilución infinita, cada ion aporta lo suyo, sin influencia del otro. De allí se obtiene \(\Lambda^\circ\) de un ácido débil, que no se puede medir extrapolando (\(\Lambda_m\) de un ácido débil se dispara a bajas concentraciones), sumando los \(\lambda^\circ\) iónicos. En un electrolito débil, \(\Lambda_m\) cae por otra razón, la ionización parcial: \(\alpha=\Lambda_m/\Lambda_m^\circ\) y la <em>ley de dilución de Ostwald</em> \(K_a=\alpha^2c/(1-\alpha)\).</p>
<div class="sim" data-sim="conductividad" data-title="Conductividad molar de electrolitos fuertes (Onsager) y débiles (Ostwald)"></div>
<div class="sim-guide"><ul>
<li>KCl 0.01 mol/L: \(\Lambda_m=140.3\) S·cm²/mol con Onsager frente a 141.3 experimental, y la conductividad es \(\kappa=1.404\) mS/cm, a 0.3 % del valor patrón de la IUPAC para calibrar conductímetros (1.4087 mS/cm). A 0.1 mol/L la ecuación de Onsager (válida hasta unos 0.01 M) sobreestima el descenso: 120 frente a 129.</li>
<li>HCl: \(\Lambda^\circ=426\) S·cm²/mol, casi 3 veces el del KCl. El protón conduce 349.8, frente a 73.5 del K⁺: no se mueve como un ion que se arrastra por el agua, sino por el relevo de enlaces de hidrógeno (<em>mecanismo de Grotthuss</em>): un protón entra por un lado de una molécula de agua y sale otro por el opuesto. Lo mismo ocurre con el OH⁻ (198).</li>
<li>Ácido acético: \(\Lambda_m\) cae desde 390 hacia 5.2 a 0.1 mol/L porque solo se ioniza el 1.3 %; el grado de ionización sube a 12 % en 0.001 M. Es la prueba experimental de Ostwald (1888) de que la constante \(K_a\) es constante.</li>
<li>Los números de transporte límite \(t_\pm=\lambda_\pm/\Lambda^\circ\) dicen qué fracción de la corriente transporta cada ion: 0.49 y 0.51 en KCl (iones de igual movilidad, y por eso se usa en puentes salinos), 0.82 para el H⁺ en HCl.</li>
</ul></div>
<h3>Los radios hidrodinámicos y la paradoja de los iones pequeños</h3>
<p>Si el ion se mueve como una esfera de radio \(r_h\) en un fluido viscoso, la ley de Stokes da \(\lambda^\circ=|z|F^2/(6\pi\eta N_Ar_h)\). Con la viscosidad del agua a 25 °C (0.890 mPa·s), resulta \(r_h=2.38\) Å para el Li⁺, 1.84 Å para el Na⁺ y 1.25 Å para el K⁺: <b>el ion más pequeño (Li⁺) tiene el radio hidrodinámico mayor y es el que menos conduce</b>, porque arrastra una capa de hidratación más gruesa. Es el mismo orden que el de la energía de solvatación de Born.</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Halle la fuerza iónica de una disolución 0.020 mol/kg de CaCl₂ y 0.010 mol/kg de NaCl.
<details><summary>Respuesta</summary><p>\(I=\tfrac12[0.020(2^2)+2(0.020)(1)+0.010+0.010]=\tfrac12[0.080+0.040+0.020]=0.070\) mol/kg.</p></details></li>
<li><span class="lvl">Básico</span>Con la ley límite, estime \(\gamma_\pm\) del NaCl 0.001 mol/kg y del CaCl₂ 0.001 mol/kg a 25 °C.
<details><summary>Respuesta</summary><p>NaCl: \(\log\gamma=-0.511(1)\sqrt{0.001}=-0.0162\), \(\gamma=0.963\). CaCl₂: \(I=0.003\), \(\log\gamma=-0.511(2)\sqrt{0.003}=-0.0560\), \(\gamma=0.879\).</p></details></li>
<li><span class="lvl">Intermedio</span>Calcule la longitud de Debye de una disolución 0.050 mol/L de NaCl a 25 °C.
<details><summary>Respuesta</summary><p>\(1/\kappa=0.304/\sqrt{0.05}\ \mathrm{nm}=1.36\) nm.</p></details></li>
<li><span class="lvl">Intermedio</span>Con los \(\lambda^\circ\) del H⁺ (349.8) y del acetato (40.9), halle \(\Lambda^\circ\) del ácido acético y el grado de ionización cuando \(\Lambda_m=7.8\) S·cm²/mol.
<details><summary>Respuesta</summary><p>\(\Lambda^\circ=390.7\); \(\alpha=7.8/390.7=0.0200\). Con la ley de Ostwald, \(K_a=\alpha^2c/(1-\alpha)\) da \(1.75\times10^{-5}\) para \(c=0.044\) mol/L.</p></details></li>
<li><span class="lvl">Avanzado</span>Con la ecuación de Born, estime cuánto más favorable es la solvatación del Na⁺ (\(r_{ef}=1.80\) Å) en agua (\(\varepsilon_r=78\)) que en etanol (\(\varepsilon_r=24\)).
<details><summary>Respuesta</summary><p>Con \(N_Ae^2/(8\pi\varepsilon_0)=694.7\) kJ·Å/mol: \(\Delta G=-\dfrac{694.7}{1.80}\left(1-\dfrac1{\varepsilon_r}\right)=-386\left(1-\dfrac1{\varepsilon_r}\right)\) kJ/mol. La diferencia es \(386\left(\dfrac1{24}-\dfrac1{78}\right)=11.1\) kJ/mol más favorable en agua. Es el orden de magnitud de las energías de transferencia de iones entre disolventes, que explica por qué las sales son menos solubles en etanol.</p></details></li>
</ol>
