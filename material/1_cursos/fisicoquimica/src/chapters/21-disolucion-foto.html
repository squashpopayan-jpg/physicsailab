<p class="lead">En un gas, dos moléculas chocan en línea recta. En un líquido, cada una está atrapada en una jaula de moléculas de disolvente y solo encuentra a la otra tras una larga caminata al azar: la difusión puede ser, ella sola, la etapa lenta. Este capítulo pasa de las reacciones en fase gas a las que ocurren en disolución, para las que hay tres ideas nuevas: la velocidad máxima impuesta por la difusión, el efecto de las cargas y de la sal, y la teoría de Marcus, en la que el propio disolvente decide la barrera de una transferencia de electrones. En la segunda mitad la energía no la pone el calor sino la luz: fotoquímica, fluorescencia y el ciclo del ozono en el aire de una ciudad.</p>

<section>
<h2>Control por difusión</h2>
<p>Dos solutos A y B de radios \(r_\mathrm A\), \(r_\mathrm B\) reaccionan en cuanto se tocan, a la distancia \(R=r_\mathrm A+r_\mathrm B\). Smoluchowski (1917) calculó el flujo estacionario de moléculas de B hacia una molécula de A, que actúa como sumidero perfecto, resolviendo \(\nabla^2c=0\) con \(c(R)=0\) y \(c(\infty)=[\mathrm B]\). La constante de velocidad que resulta es</p>
<div class="eq key" data-name="Constante de Smoluchowski">\[k_D=4\pi\,(D_\mathrm A+D_\mathrm B)\,R\,N_\mathrm A,\qquad D_i=\frac{k_BT}{6\pi\eta r_i}\ \Rightarrow\ k_D=\frac{8RT}{3\eta}\ \ (r_\mathrm A=r_\mathrm B).\]</div>
<p>Con la relación de Stokes–Einstein para el coeficiente de difusión resulta casi independiente del tamaño de los reactivos: solo depende de la temperatura y de la viscosidad. En agua a 25 °C (\(\eta=0.890\) mPa·s) vale \(7.4\times10^9\) L/(mol·s): ninguna reacción bimolecular entre solutos neutros puede ir más rápido que eso, y es el techo de las reacciones de apagamiento de la fluorescencia y de muchas enzimas (capítulo 19). Un encuentro con \([\mathrm B]=1\) mM ocurre en \(1/(k_D[\mathrm B])=1.3\times10^{-7}\) s.</p>
<p>Si la reacción necesita, además, superar una barrera cuando A y B ya están juntos, la velocidad es la composición de ambos procesos. El par de encuentro \(\mathrm{AB}\) puede separarse (\(k_{-D}\)) o reaccionar (\(k_r\)), y el estado estacionario da \(k=k_Dk_r/(k_{-D}+k_r)\); si se llama \(k_\mathrm{act}=k_Dk_r/k_{-D}\) a la constante que tendría la reacción sin limitación de difusión,</p>
<div class="eq key" data-name="Control mixto (Collins–Kimball, Noyes)">\[\frac1k=\frac1{k_D}+\frac1{k_\mathrm{act}},\qquad k=\frac{k_Dk_\mathrm{act}}{k_D+k_\mathrm{act}}.\]</div>
<p>Las «resistencias» se suman como en un circuito: si \(k_\mathrm{act}\ll k_D\), la reacción está controlada por la activación y \(k\approx k_\mathrm{act}\); si \(k_\mathrm{act}\gg k_D\), por difusión y \(k\approx k_D\), dependiente de la viscosidad e independiente de la energía de activación. El experimento que lo distingue es variar la viscosidad (cambiando el disolvente o la temperatura): una reacción controlada por difusión es inversamente proporcional a \(\eta\).</p>
<div class="sim" data-sim="difusion-control" data-title="Del control por activación al control por difusión: constante observada, disolvente y cargas"></div>
<div class="sim-guide"><ul>
<li>En agua con \(k_\mathrm{act}=10^9\) L/(mol·s) y reactivos neutros, \(k_D=7.43\times10^9\) y la constante observada es \(8.8\times10^8\): el 12 % de la «resistencia» total \(1/k\) es de difusión (control mixto). A \(k_\mathrm{act}=10^{11}\), \(k\) es 93 % de \(k_D\), y la curva se aplana en la meseta de difusión.</li>
<li>El disolvente fija el techo con \(k_D\propto1/\eta\): hexano, \(2.2\times10^{10}\); acetonitrilo, \(1.8\times10^{10}\); metanol, \(1.2\times10^{10}\); etanol, \(6.2\times10^9\); glicerol (\(\eta\) casi 1000 veces mayor que el agua), solo \(7.1\times10^{6}\). Una reacción rápida en agua puede quedar limitada por difusión en un disolvente viscoso.</li>
<li>Con cargas, \(k_D\) se multiplica por el factor de Debye \(\delta/(e^\delta-1)\), \(\delta=z_Az_Be^2/(4\pi\varepsilon_0\varepsilon_rk_BTR)\). En agua con \(R=0.5\) nm: 1.88 para cargas opuestas (\(-1\)), 3.03 para \(-2\), 0.45 para cargas iguales (\(+1\)) y 0.17 para \(+2\). En un disolvente de baja constante dieléctrica el efecto se agranda: en hexano (\(\varepsilon_r=1.89\)) dos iones opuestos se encuentran 59 veces más que dos neutros, que es la razón de que los iones formen pares en medios apolares.</li>
</ul></div>
<div class="box note"><h4>El caso H⁺ + OH⁻</h4><p>La neutralización \(\mathrm{H^++OH^-\to H_2O}\) tiene \(k=1.4\times10^{11}\) L/(mol·s) (Eigen y De Maeyer, 1.3–1.4×10¹¹), la más rápida conocida en agua. La ecuación de Smoluchowski con los coeficientes de difusión de los iones (\(9.3\times10^{-9}\) y \(5.3\times10^{-9}\) m²/s, anómalamente altos por el mecanismo de saltos de protón de Grotthuss), \(R=0.5\) nm y el factor de Debye 1.88, da \(1.0\times10^{11}\): del orden correcto, sin parámetros ajustables.</p></div>
</section>

<section>
<h2>El efecto salino cinético</h2>
<p>Para reacciones entre iones, la sal añadida cambia la velocidad sin intervenir. Brønsted (1922) y Bjerrum (1924) lo explicaron con la teoría del estado de transición del capítulo 17 y los coeficientes de actividad del capítulo 12: \(k=k_0\,\gamma_\mathrm A\gamma_\mathrm B/\gamma_\ddagger\), donde el complejo activado tiene carga \(z_A+z_B\). Con la ley de Debye–Hückel,</p>
<div class="eq key" data-name="Efecto salino primario (Brønsted–Bjerrum)">\[\log\frac{k}{k_0}=2A\,z_Az_B\sqrt I\quad(\text{límite}),\qquad\log\frac{k}{k_0}=2A\,z_Az_B\left(\frac{\sqrt I}{1+\sqrt I}-0.3I\right)\quad(\text{Davies}),\]</div>
<p>con \(A=0.51\) en agua a 25 °C. El resultado es cualitativo y práctico: <em>iones de la misma carga reaccionan más rápido al aumentar la fuerza iónica</em> (la atmósfera iónica estabiliza el estado de transición, de carga mayor), <em>iones opuestos más despacio</em>, y los neutros no cambian. Un gráfico de \(\log k\) frente a \(\sqrt I\) permite leer el producto \(z_Az_B\) de las cargas de los reactivos, y así deducir qué especies participan en la etapa lenta.</p>
<div class="sim" data-sim="sal-cinetica" data-title="Efecto salino cinético primario: límite de Debye–Hückel y ecuación de Davies"></div>
<div class="sim-guide"><ul>
<li>Para \(\mathrm{S_2O_8^{2-}+I^-}\) (\(z_Az_B=+2\)) la pendiente limitante es \(2A\,z_Az_B=2.04\): a \(I=0.01\) mol/L, \(k/k_0=1.60\) (límite) o 1.51 (Davies); a \(I=0.1\) mol/L, 4.4 y 2.7. La sal más que duplica la velocidad en un solo orden de magnitud de fuerza iónica.</li>
<li>Para \([\mathrm{Co(NH_3)_5Br}]^{2+}+\mathrm{OH^-}\) (\(z_Az_B=-2\)), a \(I=0.01\): 0.625 y 0.661. Con \(z_Az_B=-3\), 0.49 y 0.54. Con \(z_Az_B=+4\) (dos aniones divalentes) y \(I=0.1\), la ecuación limitante da 19.6 y la de Davies 7.2: la ley limitante deja de valer cuando \(I\) supera \(\approx0.01\) y las correcciones se vuelven grandes.</li>
<li>Si uno de los reactivos es neutro (\(z_Az_B=0\)) no hay efecto en esta aproximación, como en la hidrólisis alcalina de un éster. Los efectos reales, mucho menores, son los «secundarios» de la sal sobre el disolvente.</li>
</ul></div>
</section>

<section>
<h2>Transferencia de electrones: la teoría de Marcus</h2>
<p>Una transferencia de electrones entre iones o moléculas en disolución, \(\mathrm D+\mathrm A\to\mathrm D^++\mathrm A^-\), ocurre sin que los núcleos se muevan durante el salto (Franck–Condon, capítulo 28). Para que el electrón pase, el disolvente y los ligandos deben reorganizarse hasta que reactivos y productos tengan la misma energía. Marcus (1956; Nobel de Química, 1992) representó la energía libre de ambos estados como parábolas en la coordenada colectiva del disolvente, con la misma curvatura determinada por la <span class="term">energía de reorganización</span> \(\lambda\):</p>
<div class="eq key" data-name="Teoría de Marcus">\[\Delta G^\ddagger=\frac{(\lambda+\Delta G^\circ)^2}{4\lambda},\qquad k=Z\,e^{-\Delta G^\ddagger/RT},\qquad k_{12}=\sqrt{k_{11}k_{22}K_{12}f},\quad\ln f=\frac{(\ln K_{12})^2}{4\ln(k_{11}k_{22}/Z^2)}.\]</div>
<p>La última es la <em>relación cruzada</em>: la constante de una reacción entre dos pares distintos sale de las de los intercambios de electrones de cada par (\(k_{11}\), \(k_{22}\)) y de la constante de equilibrio. Lo más sorprendente es la parábola misma: la velocidad aumenta cuando la reacción se hace más exergónica hasta \(-\Delta G^\circ=\lambda\), donde la barrera es nula, pero si la reacción sigue haciéndose <em>más</em> exergónica, la barrera reaparece y la velocidad <em>disminuye</em>: la <span class="term">región invertida</span>. Marcus la predijo en 1956; los químicos la recibieron con escepticismo hasta que Miller, Calcaterra y Closs (1984) la midieron en moléculas con donante y aceptor a distancia fija: la velocidad de transferencia caía en uno o dos órdenes de magnitud al aumentar la fuerza impulsora hasta unos 2 eV. Se ha propuesto que la región invertida ayuda a la fotosíntesis: la recombinación de cargas, muy exergónica, queda en esa región y es más lenta de lo que sería sin ella, lo que deja tiempo a la transferencia útil.</p>
<div class="sim" data-sim="marcus" data-title="Parábolas de Marcus y la región invertida"></div>
<div class="sim-guide"><ul>
<li>Con \(\lambda=100\) kJ/mol y \(\Delta G^\circ=-40\) kJ/mol, la barrera es \((100-40)^2/400=9.0\) kJ/mol y \(k\) es 0.026 de su máximo a 298 K. Con \(\Delta G^\circ=-100\) la barrera es nula y la velocidad es máxima (\(k/k_\mathrm{max}=1\)).</li>
<li>Con \(\Delta G^\circ=0\) la barrera es \(\lambda/4=25\) kJ/mol (\(k/k_\mathrm{max}=4\times10^{-5}\)), y con \(\Delta G^\circ=-200\) kJ/mol, el doble de \(\lambda\), vuelve a ser 25 kJ/mol y la misma velocidad: la curva es simétrica respecto de \(-\Delta G^\circ=\lambda\). Con \(\Delta G^\circ=-300\), la barrera sube a 100 kJ/mol y \(k/k_\mathrm{max}=3\times10^{-18}\).</li>
<li>Una \(\lambda\) pequeña (\(50\) kJ/mol, como en una reacción con poco cambio de la esfera de solvatación) hace que una reacción con \(\Delta G^\circ=-150\) kJ/mol esté ya en la región invertida, con barrera de 50 kJ/mol y \(k/k_\mathrm{max}=1.7\times10^{-9}\).</li>
</ul></div>
</section>

<section>
<h2>Fotoquímica: qué pasa con un fotón absorbido</h2>
<p>Una molécula que absorbe un fotón de energía \(h\nu\) sube de su estado fundamental \(\mathrm S_0\) a un estado electrónico excitado, casi siempre el singlete \(\mathrm S_1\) (Kasha, 1950: la emisión sale del estado excitado de menor energía de cada multiplicidad). Cada fotón absorbido excita una sola molécula (ley de Stark y Einstein), y la fracción de las excitadas que dan un proceso concreto es su <span class="term">rendimiento cuántico</span> \(\Phi_i=k_i/\sum_jk_j\). Desde \(\mathrm S_1\) hay cuatro caminos en competencia (diagrama de Jabłoński): emitir un fotón (fluorescencia, \(k_r\sim10^7\)–\(10^9\) s⁻¹), perder la energía como calor (conversión interna, \(k_{nr}\)), pasar a un triplete \(\mathrm T_1\) (cruce entre sistemas, \(k_\mathrm{isc}\)), de donde sale la fosforescencia, mucho más lenta (milisegundos a segundos) por estar prohibida por el espín, o <em>reaccionar</em>: la fotoquímica es la química de los estados excitados. El tiempo de vida del estado excitado y el rendimiento de fluorescencia son</p>
<div class="eq" data-name="Fotofísica del estado S₁">\[\tau=\frac1{k_r+k_{nr}+k_\mathrm{isc}+k_q[\mathrm Q]},\qquad\Phi_F=k_r\,\tau,\qquad\Phi_F+\Phi_\mathrm{isc}+\Phi_\mathrm{ic}+\Phi_\mathrm{q}=1.\]</div>
<p>Un <span class="term">apagador</span> \(\mathrm Q\) (oxígeno, yoduro, acrilamida, un aceptor de electrones) quita energía al estado excitado en cada colisión, con constante bimolecular \(k_q\). En el estado estacionario con iluminación constante, el cociente de las intensidades sin y con apagador es la ecuación de Stern–Volmer (1919):</p>
<div class="eq key" data-name="Ecuación de Stern–Volmer">\[\frac{F_0}{F}=\frac{\tau_0}{\tau}=1+k_q\tau_0[\mathrm Q]=1+K_\mathrm{SV}[\mathrm Q].\]</div>
<p>Una recta de \(F_0/F\) frente a \([\mathrm Q]\) da \(K_\mathrm{SV}\), y de ahí \(k_q=K_\mathrm{SV}/\tau_0\): si es del orden de \(k_D\) (\(10^9\)–\(10^{10}\) M⁻¹s⁻¹), cada colisión apaga. Hay un segundo mecanismo que da una recta de la misma forma, el apagamiento <em>estático</em>: el apagador forma con la molécula, en el estado fundamental, un complejo que no emite. La intensidad baja igual, \(F_0/F=1+K_S[\mathrm Q]\), pero el tiempo de vida de las moléculas que sí emiten <em>no cambia</em>. Medir \(\tau\) distingue los dos: \(\tau_0/\tau=F_0/F\) en el dinámico, \(\tau_0/\tau=1\) en el estático.</p>
<div class="sim" data-sim="fluor" data-title="Fluorescencia, rendimiento cuántico, tiempo de vida y apagamiento de Stern–Volmer"></div>
<div class="sim-guide"><ul>
<li>Los valores iniciales (\(k_r=2.9\times10^7\), \(k_{nr}=2.0\times10^7\), \(k_\mathrm{isc}=3.6\times10^6\) s⁻¹) reproducen el sulfato de quinina en ácido sulfúrico diluido, el patrón de fluorescencia (\(\Phi_F=0.55\), \(\tau_0=19\) ns); con \(\Phi_\mathrm{isc}=0.068\) y el resto, conversión interna. Con yoduro o cloruro como apagador, \(k_q=6\times10^9\) M⁻¹s⁻¹ es 0.81 veces el límite de difusión del agua: casi cada colisión apaga. \(K_\mathrm{SV}=114\) M⁻¹: con \([\mathrm Q]=0.01\) M, \(F_0/F=2.14\); con 0.04 M, 5.56. A 0.01 M el tiempo de vida baja de 19.0 a 8.9 ns.</li>
<li>Cambie a «Estático»: la intensidad cae igual, pero la curva de \(\tau_0/\tau\) se queda en 1 y en el decaimiento la pendiente (el tiempo de vida) no cambia, solo la amplitud.</li>
<li>Si sube \(k_q\) hasta \(2\times10^{10}\) M⁻¹s⁻¹ el simulador avisa: supera el límite de difusión (\(k_D=7.4\times10^9\)), de modo que un apagamiento puramente colisional no puede explicarlo y debe haber un componente estático (o de «esfera de acción»). Es la prueba rutinaria para interpretar las curvas de Stern–Volmer.</li>
</ul></div>
</section>

<section>
<h2>Fotoquímica atmosférica: el ciclo del ozono urbano</h2>
<p>La luz solar ultravioleta rompe moléculas en el aire. La frecuencia de fotólisis de una especie, \(J=\int\sigma(\lambda)\Phi(\lambda)F(\lambda)\,\dd\lambda\), integra su sección eficaz de absorción \(\sigma\), el rendimiento cuántico de disociación y el flujo actínico solar \(F\). Para el dióxido de nitrógeno, \(J(\mathrm{NO_2})\approx8\times10^{-3}\) s⁻¹ a mediodía despejado: una molécula dura, en promedio, dos minutos. El \(\mathrm{NO_2}\) fotolizado deja un átomo de oxígeno que se une al \(\mathrm O_2\) del aire y forma ozono (\(\mathrm O+\mathrm{O_2}+\mathrm M\to\mathrm{O_3}+\mathrm M\)); el ozono reacciona con el NO y lo devuelve a NO₂: el ciclo de Leighton (1961),</p>
<div class="eq key" data-name="Estado fotoestacionario (relación de Leighton)">\[\mathrm{NO_2}\xrightarrow{h\nu,\ J}\mathrm{NO}+\mathrm{O_3},\quad\mathrm{NO}+\mathrm{O_3}\xrightarrow{k_3}\mathrm{NO_2};\qquad[\mathrm{O_3}]_\mathrm{ss}=\frac{J\,[\mathrm{NO_2}]}{k_3[\mathrm{NO}]}.\]</div>
<p>con \(k_3=3.0\times10^{-12}e^{-1500/T}=1.95\times10^{-14}\) cm³/(molécula·s) a 298 K (JPL, 2019) o \(4.8\times10^{-4}\) ppb⁻¹s⁻¹ al nivel del mar. Este ciclo, solo, no produce ozono neto: \([\mathrm{O_3}]-[\mathrm{NO}]\) es constante. Lo que hace que el ozono se acumule en una ciudad es que los compuestos orgánicos volátiles producen radicales peroxilo (\(\mathrm{HO_2}\), \(\mathrm{RO_2}\)) que oxidan el NO a NO₂ <em>sin consumir ozono</em>, con tasa \(k_p=k[\mathrm{RO_2}]\): cada vuelta del ciclo \(\mathrm{NO_2\to NO\to NO_2}\) deja un \(\mathrm{O_3}\) neto, y un mismo átomo de nitrógeno actúa como catalizador de muchas moléculas de ozono.</p>
<div class="sim" data-sim="leighton" data-title="Ciclo fotoestacionario NO₂–NO–O₃ con y sin peróxidos"></div>
<div class="sim-guide"><ul>
<li>Con \(J=8\times10^{-3}\) s⁻¹, 30 ppb de NO₂ y 10 ppb de NO, sin peróxidos, la mezcla llega en 1–2 minutos al estado fotoestacionario con 17.3 ppb de NO₂, 22.7 de NO y 12.7 de O₃, y \(J[\mathrm{NO_2}]/(k_3[\mathrm{NO}])\) reproduce los 12.7 ppb de O₃. La cantidad \(\mathrm O_x=[\mathrm{NO_2}]+[\mathrm{O_3}]\) permanece en 30 ppb: el ciclo redistribuye, no crea.</li>
<li>Con nubes (\(J=8\times10^{-4}\) s⁻¹) y 10 ppb de NO₂ con 40 de NO, el ozono en el estado estacionario baja a 0.4 ppb: el NO lo destruye casi todo. Es el motivo de que el ozono caiga de noche y cerca de las carreteras con mucho tráfico.</li>
<li>Con \(k_p=0.004\) s⁻¹ (unos 20 ppt de radicales peroxilo, un valor de aire contaminado) el ozono crece de 0 a 111 ppb en una hora, y \(\mathrm O_x\) de 30 a 147 ppb: el resultado neto del smog fotoquímico. Con \(J\) diez veces menor, a los 60 minutos hay 33 ppb: la luz sigue siendo el motor.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule el límite de difusión \(k_D=8RT/3\eta\) en agua (0.890 mPa·s) y en glicerol (934 mPa·s) a 298 K. ¿Cuánto tarda en ocurrir un encuentro de una molécula con \([\mathrm B]=0.1\) M en cada uno?
<details><summary>Respuesta</summary><p>Agua: \(8(8.3145)(298.15)/(3\times0.890\times10^{-3})=7.43\times10^6\) m³/(mol·s) \(=7.43\times10^9\) L/(mol·s); glicerol: \(7.1\times10^6\) L/(mol·s), mil veces menos. Tiempos \(1/(k_D[\mathrm B])\): \(1.3\times10^{-9}\) s en agua y \(1.4\times10^{-6}\) s en glicerol.</p></details></li>
<li><span class="lvl">Básico</span>Una reacción entre iones con \(z_Az_B=+2\) tiene \(k_0=1.0\) M⁻¹s⁻¹ a dilución infinita. Estime \(k\) a \(I=0.01\) M con la ley limitante. ¿Y si fuese \(z_Az_B=-2\)?
<details><summary>Respuesta</summary><p>\(\log(k/k_0)=2(0.51)(\pm2)(0.1)=\pm0.204\): para \(+2\), \(k=1.60\) M⁻¹s⁻¹ (aumenta 60 %); para \(-2\), \(k=0.63\) M⁻¹s⁻¹ (disminuye 37 %).</p></details></li>
<li><span class="lvl">Intermedio</span>Con \(\lambda=100\) kJ/mol a 298 K, calcule la barrera de Marcus para \(\Delta G^\circ=-40\), 0, \(-100\) y \(-200\) kJ/mol y diga qué reacción es más rápida. ¿Cuál de ellas está en la región invertida?
<details><summary>Respuesta</summary><p>\((100+\Delta G^\circ)^2/400\): 9.0; 25.0; 0; 25.0 kJ/mol. La más rápida es la de \(-100\) kJ/mol (sin barrera). La de \(-200\) kJ/mol, con \(-\Delta G^\circ>\lambda\), está en la región invertida; su velocidad es la misma que la de \(\Delta G^\circ=0\), \(e^{-25/2.479}=4\times10^{-5}\) de la máxima.</p></details></li>
<li><span class="lvl">Intermedio</span>Un fluoróforo (\(\tau_0=10\) ns) se apaga con yoduro: \(F_0/F=3.5\) con \(0.020\) M. Halle \(K_\mathrm{SV}\), \(k_q\) y decida si el apagamiento puede ser solo colisional en agua a 298 K.
<details><summary>Respuesta</summary><p>\(K_\mathrm{SV}=(3.5-1)/0.020=125\) M⁻¹; \(k_q=K_\mathrm{SV}/\tau_0=125/(10^{-8})=1.25\times10^{10}\) M⁻¹s⁻¹. Supera \(k_D=7.4\times10^9\) M⁻¹s⁻¹ (aunque, con cargas opuestas, el factor de Debye lo eleva): sospéchese un componente estático. Medir \(\tau\) lo decide: si \(\tau_0/\tau<F_0/F\), hay parte estática.</p></details></li>
<li><span class="lvl">Avanzado</span>Para el mecanismo \(\mathrm A+\mathrm B\rightleftharpoons\mathrm{AB}\to\mathrm P\) (\(k_D\), \(k_{-D}\), \(k_r\)) demuestre que \(k=k_Dk_r/(k_{-D}+k_r)\) y que equivale a \(1/k=1/k_D+1/k_\mathrm{act}\) con \(k_\mathrm{act}=k_Dk_r/k_{-D}\).
<details><summary>Respuesta</summary><p>Estado estacionario de AB: \(k_D[\mathrm A][\mathrm B]=(k_{-D}+k_r)[\mathrm{AB}]\), luego \(v=k_r[\mathrm{AB}]=\dfrac{k_Dk_r}{k_{-D}+k_r}[\mathrm A][\mathrm B]\). Entonces \(1/k=(k_{-D}+k_r)/(k_Dk_r)=1/k_D+k_{-D}/(k_Dk_r)=1/k_D+1/k_\mathrm{act}\), con \(k_\mathrm{act}=k_Dk_r/k_{-D}\) (la constante de equilibrio de encuentro, \(k_D/k_{-D}\), por \(k_r\)).</p></details></li>
</ol>
