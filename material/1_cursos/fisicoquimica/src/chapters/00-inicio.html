    <h1 class="home-title">Fisicoquímica<span>de la energía libre a la célula viva</span></h1>
    <p class="home-lead">Un curso completo de fisicoquímica en ocho partes: termodinámica química y de disoluciones, electroquímica, cinética, estructura cuántica y espectroscopía, mecánica estadística, superficies y macromoléculas, y transporte y bioenergética. Cada capítulo deduce los resultados desde los principios, los aplica con ejemplos resueltos y los pone a prueba con simulaciones de parámetros ajustables, incluido un programa propio de Hartree–Fock, un mecanismo de combustión de 29 reacciones y el modelo de Hodgkin–Huxley. Los resultados se comparan con Cantera, CoolProp, SciPy, SymPy, pymatgen y datos publicados.</p>
    <div class="maxwell-strip" aria-label="Ecuaciones centrales del curso">

      <div><small>Cinética</small>\[k=Ae^{-E_a/RT}\]</div>
      <div><small>Estructura</small>\[\hat H\psi=E\psi\]</div>
    </div>

<div class="home-howto">
  <div><b>De la molécula a la propiedad</b><p>La constante de equilibrio, la velocidad de una reacción o la viscosidad de un gas se calculan desde la estructura y las funciones de partición, y se comparan con el experimento.</p></div>
  <div><b>Simulaciones con parámetros</b><p>Diagramas de fases y de Pourbaix, voltametría cíclica, mecanismos de reacción, orbitales moleculares, espectros, simulación Monte Carlo de un líquido, adsorción, DLVO, difusión y el potencial de acción.</p></div>
  <div><b>Datos reales y validados</b><p>Más de 1900 pruebas automáticas contrastan la biblioteca de cálculo con Cantera, CoolProp, SciPy, SymPy, pymatgen y valores de la literatura, y el apéndice B las lista una por una.</p></div>
  <div><b>Ejemplos con contexto</b><p>El pH de la lluvia y del océano, una batería de ion-litio, la catálisis de una enzima, un patrón de Turing, una proteína que se pliega, un nervio que dispara. Problemas con respuesta en tres niveles al final de cada capítulo.</p></div>
