<template class="chapter-src" data-id="noideal" data-num="9" data-title="Disoluciones no ideales" data-part="Parte II · Fases y disoluciones" data-short="Actividad y coeficiente de actividad, energía de Gibbs de exceso, modelos de Margules, van Laar, Wilson y NRTL, desviaciones positivas y negativas de la ley de Raoult, azeótropos y separación líquido–líquido">
<p class="lead">Casi ninguna mezcla real es ideal. El etanol y el agua se repelen, la acetona y el cloroformo se atraen, y el hexano con etanol casi no se soportan. Esas desviaciones de la ley de Raoult no son un defecto, sino información: dicen cómo se sienten las moléculas entre sí. Para tratarlas sin rehacer toda la termodinámica, G. N. Lewis conservó la forma del potencial químico de la disolución ideal y metió toda la complejidad en una sola cantidad, el <em>coeficiente de actividad</em>. Con él se explican los azeótropos, que impiden destilar el etanol hasta más de 95.6 % en masa, y la separación de un líquido en dos fases.</p>

<section>
<h2>Actividad y coeficiente de actividad</h2>
<p>El potencial químico de un componente de una disolución real se escribe como el de la ideal, con la fracción molar sustituida por la <span class="term">actividad</span> \(a_i=\gamma_ix_i\):</p>
<div class="eq key" data-name="Actividad">\[\mu_i=\mu_i^*+RT\ln a_i=\mu_i^*+RT\ln x_i+RT\ln\gamma_i,\qquad\gamma_i\to1\ \text{cuando}\ x_i\to1\ \ (\text{convención de Raoult}).\]</div>
<p>El coeficiente de actividad \(\gamma_i\) mide la desviación: si \(\gamma_i>1\), la molécula escapa más fácilmente a la fase vapor de lo que haría en la mezcla ideal (se «siente incómoda» entre vecinas distintas); si \(\gamma_i<1\), está más retenida. Con el vapor ideal, el equilibrio líquido–vapor se escribe en la forma «ley de Raoult modificada»:</p>
<div class="eq key" data-name="Raoult modificada">\[y_iP=x_i\gamma_iP_i^*,\qquad P=\sum_ix_i\gamma_iP_i^*.\]</div>
<p>Para solutos diluidos se usa otra convención, la de Henry, con \(\gamma_i\to1\) cuando \(x_i\to0\) (o en molalidad, \(m_i\to0\)); es la que rige las disoluciones de electrolitos (capítulo 12). La relación entre ambas es \(K_H=\gamma_i^\infty P_i^*\): la constante de Henry de un soluto es su presión de vapor corregida por el coeficiente de actividad a dilución infinita.</p>
</section>

<section>
<h2>La energía de Gibbs de exceso y sus modelos</h2>
<p>La <span class="term">energía de Gibbs de exceso</span> \(G^E\) es la diferencia entre la energía de mezcla real y la ideal: \(G^E=\Delta_{mez}G-\Delta_{mez}G^{id}\). Los coeficientes de actividad salen de ella por derivación respecto de los moles, y recíprocamente:</p>
<div class="eq key" data-name="Energía de exceso">\[\frac{G^E}{RT}=\sum_ix_i\ln\gamma_i,\qquad\ln\gamma_i=\left[\pdv{(nG^E/RT)}{n_i}\right]_{T,P,n_{j\ne i}}.\]</div>
<p>La relación de Gibbs–Duhem del capítulo 1 exige \(x_1\,\dd\ln\gamma_1+x_2\,\dd\ln\gamma_2=0\) a \(T\) y \(P\) constantes, y cualquier modelo que parta de una \(G^E\) la cumple automáticamente. Los modelos más usados para mezclas binarias son:</p>
<ul>
<li><b>Margules</b> (1895), un polinomio en \(x\): \(G^E/RTx_1x_2=A_{21}x_1+A_{12}x_2\), con \(\ln\gamma_1^\infty=A_{12}\) y \(\ln\gamma_2^\infty=A_{21}\). Si \(A_{12}=A_{21}\), es la disolución regular del capítulo 1.</li>
<li><b>Van Laar</b> (1910), derivada de la ecuación de van der Waals: \(\ln\gamma_1=A_{12}\left(\dfrac{A_{21}x_2}{A_{12}x_1+A_{21}x_2}\right)^2\).</li>
<li><b>Wilson</b> (1964), basada en composición local: \(\dfrac{G^E}{RT}=-x_1\ln(x_1+\Lambda_{12}x_2)-x_2\ln(x_2+\Lambda_{21}x_1)\). No predice separación de fases líquidas.</li>
<li><b>NRTL</b> (Renon y Prausnitz, 1968): con \(\tau_{ij}=(g_{ij}-g_{jj})/RT\), \(G_{ij}=e^{-\alpha\tau_{ij}}\), y el parámetro \(\alpha\) (0.2–0.5) de no aleatoriedad. Describe la mayoría de las mezclas líquidas, incluidas las que se separan en dos fases, con tres parámetros por par.</li>
</ul>
<p>Todos estos modelos son <em>empíricos</em>: los parámetros se ajustan a datos medidos (por ejemplo, de la presión de burbuja a varias composiciones) y valen dentro del intervalo medido. Los métodos de contribución de grupos, como UNIFAC, predicen \(\gamma\) a partir de la estructura molecular.</p>
<div class="sim" data-sim="modelos-exceso" data-title="Modelos de G^E: coeficientes de actividad a partir de dos o tres parámetros"></div>
<div class="sim-guide"><ul>
<li>Con Margules y \(A_{12}=A_{21}=1.2\) (mezcla regular simétrica), \(\ln\gamma_1\) y \(\ln\gamma_2\) son imágenes especulares y \(G^E/RT\) tiene su máximo en \(x=0.5\). Con \(A_{12}\neq A_{21}\), la curva se inclina hacia el componente de mayor \(\gamma^\infty\).</li>
<li>El residuo de Gibbs–Duhem es nulo (del orden de \(10^{-8}\) o menos, por derivación numérica) para los cuatro modelos: es una propiedad de la construcción a partir de \(G^E\), no un ajuste.</li>
<li>Con valores negativos de los parámetros (\(A<0\), \(\Lambda>1\)) se obtienen \(\gamma<1\): atracción entre moléculas distintas, como la acetona con el cloroformo (enlace de hidrógeno C–H···O).</li>
<li>Con NRTL, aumente \(\tau_{21}\) de 0.9 a 2.5: \(\gamma_1^\infty\) pasa de 3.2 a 16. Cuando \(G^E/RT\) deja de ser pequeña frente a la entropía de mezcla (\(\approx0.69\) a \(x=0.5\)), el modelo predice separación de fases, tema de la última sección.</li>
</ul></div>
</section>

<section>
<h2>Equilibrio líquido–vapor con desviaciones: los azeótropos</h2>
<p>Si \(G^E>0\) (\(\gamma>1\)), la presión de vapor de la mezcla es mayor que la ideal: es una <em>desviación positiva</em>. Si es suficiente, la presión total pasa por un máximo en alguna composición, donde \(y=x\): un <span class="term">azeótropo</span>, mezcla que se evapora sin cambiar de composición y que no puede separarse por destilación simple. El azeótropo de \(G^E>0\) tiene mínima temperatura de ebullición (hierve antes que los dos componentes: «de punto de ebullición mínimo»). Para \(G^E<0\) ocurre lo contrario: máxima temperatura de ebullición. La condición de azeótropo, de \(y_iP=x_i\gamma_iP_i^*\) con \(x=y\), es</p>
<div class="eq">\[\gamma_1P_1^*=\gamma_2P_2^*=P\qquad\text{(azeótropo)}.\]</div>
<p>El ejemplo clásico: el etanol y el agua forman un azeótropo a \(x_{etanol}=0.894\) (95.6 % en masa) y 78.15 °C, apenas debajo del punto de ebullición del etanol puro (78.4 °C). Por eso el alcohol destilado «de 96°» no se puede hacer más puro por destilación sencilla: se necesitan una destilación azeotrópica con un arrastrador (benceno, ciclohexano), una columna a otra presión (el azeótropo se desplaza), o tamices moleculares que adsorben el agua. Los azeótropos son muy comunes: se conocen miles de mezclas azeotrópicas, y ignorarlos es el error típico de quien aprende la ley de Raoult sin sus excepciones.</p>
<div class="sim" data-sim="vle-noideal" data-title="Equilibrio líquido–vapor de mezclas reales con NRTL frente a la ley de Raoult"></div>
<div class="sim-guide"><ul>
<li>Etanol–agua a 1 atm: con NRTL (parámetros de ChemSep) el azeótropo sale en \(x=0.875\) y 78.2 °C, frente a \(x=0.894\) y 78.15 °C experimentales. En el diagrama \(x\)–\(y\), la curva cruza la diagonal. Cambie a «Raoult (ideal)»: el azeótropo desaparece.</li>
<li>A 333 K con \(x=0.5\), la presión de burbuja ideal es 33.1 kPa y la real 44.1 kPa (33 % más), con \(\gamma_{etanol}=1.26\) y \(\gamma_{agua}=1.51\). A dilución infinita, \(\gamma_{etanol}^\infty=5.75\) (a 340 K): una molécula de etanol en agua escapa casi seis veces más que en etanol puro.</li>
<li>Acetona–cloroformo: \(\gamma^\infty\) de 0.43 y 0.56 (desviación negativa); el azeótropo es de <em>máxima</em> temperatura, 64.5 °C, por encima del punto de ebullición de ambos (56.1 y 61.2 °C), y la curva de burbuja en \(T\)–\(x\) tiene un máximo.</li>
<li>Hexano–etanol: \(\gamma^\infty\) de 6.9 y 11.8, azeótropo con 65 % de hexano a 58.7 °C. Con \(\gamma^\infty\) tan grandes, la mezcla está al borde de separarse en dos líquidos; el benceno con etanol, azeótropo a 68.4 °C, es la mezcla que usaba la industria para deshidratar el alcohol.</li>
</ul></div>
</section>

<section>
<h2>Separación de fases líquidas</h2>
<p>Cuando \(G^E\) es suficientemente positiva, la energía de Gibbs de mezcla \(\Delta_{mez}G/RT=\sum x_i\ln x_i+G^E/RT\) pierde su forma convexa y aparece una región de composiciones en la que la mezcla homogénea es inestable y se separa en dos líquidos que coexisten, la <span class="term">laguna de miscibilidad</span>. Para el modelo de disolución regular, visto en el capítulo 1, la condición crítica es \(\chi_c=2\); como \(\chi=\omega/RT\), la temperatura crítica superior es \(T_c=\omega/2R\). Por encima de ella el sistema es miscible en todas las proporciones; por debajo, hay un intervalo de separación.</p>
<p>Las dos fases en equilibrio tienen la misma actividad de cada componente: \(x_i^\alpha\gamma_i^\alpha=x_i^\beta\gamma_i^\beta\) (la <em>tangente común</em> de la curva de \(G\)). La región entre las composiciones de equilibrio (curva <em>binodal</em>) y la espinodal (\(\partial^2G/\partial x^2=0\)) es metaestable; dentro de la espinodal, la mezcla se descompone espontáneamente (descomposición espinodal, como en el aceite y vinagre que se separa al batirlos).</p>
<div class="sim" data-sim="lle" data-title="Laguna de miscibilidad: binodal, espinodal y temperatura crítica"></div>
<div class="sim-guide"><ul>
<li>1-Butanol–agua (van Laar ajustado a las solubilidades mutuas a 20 °C, \(x_{BuOH}=0.0197\) en la fase acuosa y 0.491 en la butanólica, con escala \(1/T\)): a 298 K, las composiciones de equilibrio son 0.021 y 0.478; a 370 K, 0.069 y 0.274; la temperatura crítica del modelo es cercana a 393 K, frente a 398 K del experimento (125 °C).</li>
<li>Con \(z=0.2\) a 298 K, la mezcla se divide en dos fases: 61 % de fase acuosa y 39 % de fase butanólica (regla de la palanca). Con \(z=0.01\) es homogénea (el butanol cabe en el agua hasta 2 %); con \(z=0.9\), también (fase butanólica).</li>
<li>Disolución regular simétrica: con \(\chi(298\text{ K})=2.4\), la temperatura crítica es \(T_c=\chi\cdot298/2=357.6\) K; las composiciones de equilibrio a 298 K son 0.17 y 0.83 (simétricas) y se acercan a 0.5 al subir \(T\).</li>
<li>Si baja la temperatura de un sistema con laguna de miscibilidad, las dos curvas se separan; es lo que ocurre al enfriar una mezcla de fenol y agua (temperatura crítica 66 °C) o de hexano y nitrobenceno (20 °C).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una mezcla binaria tiene \(x_1=0.4\), \(\gamma_1=1.5\), \(P_1^*=50\) kPa, \(\gamma_2=1.2\), \(P_2^*=30\) kPa. Halle la presión y la composición del vapor.
<details><summary>Respuesta</summary><p>\(p_1=0.4(1.5)(50)=30\) kPa; \(p_2=0.6(1.2)(30)=21.6\) kPa; \(P=51.6\) kPa; \(y_1=0.581\). La ideal daría 38 kPa.</p></details></li>
<li><span class="lvl">Básico</span>Con \(A_{12}=0.8\) y \(A_{21}=0.5\) en el modelo de Margules, ¿cuánto valen \(\gamma_1^\infty\) y \(\gamma_2^\infty\)?
<details><summary>Respuesta</summary><p>\(\gamma_1^\infty=e^{0.8}=2.23\); \(\gamma_2^\infty=e^{0.5}=1.65\).</p></details></li>
<li><span class="lvl">Intermedio</span>Para una disolución regular, \(\ln\gamma_1=\chi x_2^2\). A 300 K, el etanol y el hexano tienen \(\chi=2.8\). Halle \(\gamma\) a \(x=0.5\) y diga si habrá separación de fases.
<details><summary>Respuesta</summary><p>\(\gamma_1=e^{2.8(0.25)}=2.01\). Como \(\chi=2.8>2\), el sistema simétrico se separaría en dos fases a 300 K; \(T_c=\chi T/2=420\) K.</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre, con la fórmula de Margules, que \(x_1\,\dd\ln\gamma_1+x_2\,\dd\ln\gamma_2=0\) para el caso simétrico \(A_{12}=A_{21}=A\).
<details><summary>Respuesta</summary><p>\(\ln\gamma_1=Ax_2^2\), \(\ln\gamma_2=Ax_1^2\). \(\dd\ln\gamma_1=-2Ax_2\,\dd x_1\); \(\dd\ln\gamma_2=2Ax_1\,\dd x_1\). Entonces \(x_1(-2Ax_2)+x_2(2Ax_1)=0\).</p></details></li>
<li><span class="lvl">Avanzado</span>En el azeótropo, \(\gamma_1P_1^*=\gamma_2P_2^*\). Si el modelo de Margules simétrico (\(A_{12}=A_{21}=A\)) tiene \(P_1^*/P_2^*=\alpha\), halle la condición de existencia de un azeótropo.
<details><summary>Respuesta</summary><p>Con \(\ln\gamma_1=Ax_2^2\) y \(\ln\gamma_2=Ax_1^2\), la condición es \(\ln\alpha=\ln\gamma_2-\ln\gamma_1=A(x_1^2-x_2^2)=A(2x_1-1)\). Como \(|2x_1-1|<1\), hay solución en \(0<x_1<1\) si y solo si \(A>|\ln\alpha|\). Con \(\alpha=2\) hace falta \(A>0.69\): una mezcla de componentes con volatilidades parecidas forma azeótropo con poca desviación; si son muy distintas, hace falta mucha.</p></details></li>
</ol>
