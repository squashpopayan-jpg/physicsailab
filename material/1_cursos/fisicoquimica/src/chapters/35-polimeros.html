<p class="lead">Una proteína, el ADN, el nailon y el caucho son macromoléculas: cadenas de cientos a millones de unidades repetidas. Sus propiedades no se parecen a las de las moléculas pequeñas porque la mayoría vienen de la <em>configuración</em>, el número enorme de maneras en que la cadena se puede plegar. Con la estadística del capítulo 29 se explican aquí el tamaño de una cadena, por qué un caucho es un resorte entrópico, qué fuerza hace falta para estirar una molécula de ADN, cuándo un polímero se disuelve o se separa de su disolvente (la teoría de Flory–Huggins) y cómo una proteína pasa cooperativamente de hélice a ovillo.</p>

<section>
<h2>Masas molares y distribuciones</h2>
<p>Un polímero sintético es una mezcla de cadenas de largos distintos. Las masas molares promedio son el de <em>número</em> (\(M_n=\sum n_iM_i/\sum n_i\), lo que miden la presión osmótica y las propiedades coligativas del capítulo 10) y el de <em>peso</em> (\(M_w=\sum n_iM_i^2/\sum n_iM_i\), lo que mide la dispersión de luz); el cociente \(M_w/M_n\ge1\) es el <em>índice de polidispersidad</em>. En una policondensación por etapas, con \(p\) la fracción de grupos funcionales reaccionados (Carothers, 1936; Flory, 1936), la fracción en número de cadenas de largo \(n\) es \((1-p)p^{n-1}\), y</p>
<div class="eq key" data-name="Policondensación (Carothers y Flory)">\[X_n=\frac1{1-p},\qquad X_w=\frac{1+p}{1-p},\qquad\frac{M_w}{M_n}=1+p\to2.\]</div>
<p>Para \(X_n=100\) hace falta \(p=0.99\): por eso la reacción debe ser casi cuantitativa y de estequiometría exacta para dar un nailon utilizable. Las polimerizaciones «vivas» dan \(M_w/M_n\) casi 1 (Szwarc, 1956); las proteínas, exactamente 1 (todas las moléculas son idénticas).</p>
</section>

<section>
<h2>La cadena ideal</h2>
<p>El modelo más simple es una cadena de \(N\) segmentos rígidos de longitud \(b\) con direcciones independientes (cadena libremente articulada): un paseo al azar tridimensional. La distancia extremo a extremo promedia cero, pero su cuadrado no (Kuhn, 1934):</p>
<div class="eq key" data-name="Cadena ideal">\[\langle R^2\rangle=Nb^2,\quad\langle R_g^2\rangle=\frac{Nb^2}6,\quad P(R)=4\pi R^2\left(\frac3{2\pi Nb^2}\right)^{3/2}e^{-3R^2/2Nb^2}.\]</div>
<p>El tamaño crece como \(N^{1/2}\) (exponente de Flory \(\nu=\tfrac12\)): una cadena de 10⁴ segmentos mide solo 100 \(b\), no 10⁴. En un buen disolvente la exclusión de volumen la hincha (\(\nu\approx3/5\), Flory 1949); en un disolvente \(\theta\) (donde la atracción segmento–segmento compensa la repulsión de volumen excluido, \(\chi=\tfrac12\)) la cadena vuelve a ser ideal. Si los enlaces tienen un ángulo fijo con \(\cos\theta=c\) pero giran libremente, el resultado exacto es \(\langle R^2\rangle=Nb^2[(1+c)/(1-c)-2c(1-c^N)/N(1-c)^2]\): una cadena más rígida es más larga por un factor \((1+c)/(1-c)\), que equivale a una cadena libre de segmentos de Kuhn más largos. En el límite continuo es la cadena de Kratky–Porod (1949), con \(\langle R^2\rangle=2PL[1-(P/L)(1-e^{-L/P})]\) y <span class="term">longitud de persistencia</span> \(P\) (≈ 50 nm para el ADN de doble hebra, 0.4 nm para el polietileno).</p>
<div class="sim" data-sim="cadena" data-title="Cadenas ideales generadas por Monte Carlo: ⟨R²⟩, radio de giro y distribución de extremos"></div>
<div class="sim-guide"><ul>
<li>Con \(N=100\) segmentos libremente articulados: \(\langle R^2\rangle/N=0.990\) (teoría 1) y \(\langle R_g^2\rangle/(N/6)=1.001\) en 4000 cadenas; el histograma de \(R\) sigue la distribución gaussiana de Flory. Con 2000 cadenas el error estadístico es ≈ 3 %.</li>
<li>Con rigidez \(\cos\theta=0.5\) y \(N=200\): \(\langle R^2\rangle=606\) (exacto, 596); con \(\cos\theta=0.9\): 3631 (3620). La cadena rígida es 3 y 18 veces más grande que la libre, con el mismo número de enlaces. Para \(N\) grande la distribución de extremos sigue siendo gaussiana con el \(\langle R^2\rangle\) efectivo: la forma de \(P(R)\) es universal.</li>
</ul></div>
</section>

<section>
<h2>Elasticidad entrópica: del caucho al ADN</h2>
<p>Una cadena ideal tiene energía interna independiente de su extensión: la fuerza que resiste el estiramiento es entrópica. El número de configuraciones con extremos a distancia \(R\) es proporcional a \(P(R)\), de modo que \(S(R)=S_0-\tfrac{3k_BR^2}{2Nb^2}\) y la fuerza \(f=-T\,\partial S/\partial R=\tfrac{3k_BT}{Nb^2}R\): <em>un resorte de Hooke cuya constante es proporcional a \(T\)</em>. Un caucho estirado se calienta al estirarse y se contrae al calentarse: las dos observaciones de Gough (1805) y Joule (1859) que, 130 años después, Flory y otros explicaron con las cadenas. Para extensiones grandes la ley de Hooke falla, porque la cadena se acerca a su longitud de contorno \(L=Nb\). Para segmentos libremente articulados (Kuhn y Grün) es la función de Langevin, \(x/L=\coth\beta-1/\beta\) con \(\beta=fb/k_BT\); para una cadena semiflexible como el ADN, la interpolación de Marko y Siggia (1995) reproduce los experimentos con una sola molécula:</p>
<div class="eq key" data-name="Gusano (Marko–Siggia)">\[\frac{fP}{k_BT}=\frac1{4\,(1-x/L)^2}-\frac14+\frac xL.\]</div>
<div class="sim" data-sim="fuerza-ext" data-title="Fuerza frente a extensión de una cadena semiflexible (ADN) y de una cadena libremente articulada"></div>
<div class="sim-guide"><ul>
<li>ADN de doble hebra del fago \(\lambda\) (48.5 kpb, \(L=16.5\) µm, \(P=50\) nm) a 298 K: son necesarios 0.10 pN para estirarlo a la mitad de su longitud (Hooke: \(k=3k_BT/2PL=7.5\times10^{-3}\) fN/nm, tan blando que el movimiento browniano lo deforma); 8.3 pN para llegar al 95 %; y a 10 pN llega al 95.5 %, en acuerdo con las pinzas ópticas y magnéticas (Smith, Finzi y Bustamante, 1992; Bustamante et al., 1994). Con 65 pN la molécula se «sobreestira» (transición B–S, que el modelo no contiene).</li>
<li>La cadena libremente articulada de segmentos de Kuhn \(2P\) predice fuerzas algo menores (0.074 pN) a la mitad de extensión y no coincide a extensión alta. Con \(P=1\) nm y \(L=1\) µm (un polímero flexible), 5.1 pN a x/L = 0.5. El módulo de un caucho \(G=\nu k_BT\), con \(\nu\) la densidad de cadenas entre entrecruzamientos, se calcula de la misma teoría (\(G\approx0.3\) MPa).</li>
</ul></div>
</section>

<section>
<h2>Disoluciones de polímeros: Flory–Huggins</h2>
<p>Flory (1941) y Huggins (1941) trataron la mezcla de un polímero de \(N\) segmentos con un disolvente en una red: la entropía de combinación por sitio es \(\tfrac\phi N\ln\phi+(1-\phi)\ln(1-\phi)\) (el polímero aporta mucho menos entropía por unidad de volumen que las moléculas pequeñas, porque sus segmentos están ligados), y la entalpía se describe con un único parámetro \(\chi\):</p>
<div class="eq key" data-name="Energía de mezcla de Flory–Huggins">\[\frac{\Delta G_\mathrm{mez}}{RT}=\frac\phi N\ln\phi+(1-\phi)\ln(1-\phi)+\chi\,\phi(1-\phi),\qquad\chi_c=\tfrac12\Bigl(1+\tfrac1{\sqrt N}\Bigr)^2,\quad\phi_c=\frac1{1+\sqrt N}.\]</div>
<p>Para \(N=1\) (moléculas pequeñas) es el modelo de solución regular del capítulo 9, con \(\chi_c=2\). Para polímeros largos \(\chi_c\to\tfrac12\) (disolvente \(\theta\)) y la separación de fases ocurre con interacciones muy pequeñas: los polímeros apenas se mezclan entre sí, y \(\phi_c\) es muy baja (el polímero está disperso en una fase diluida y se separa una fase concentrada). La presión osmótica de la disolución (la que mide la masa molar \(M_n\)) es \(\Pi V_1/RT=-[\ln(1-\phi)+(1-1/N)\phi+\chi\phi^2]\approx\phi/N+(\tfrac12-\chi)\phi^2\): el primer término es el de van't Hoff, el segundo es la corrección del segundo coeficiente virial, que se anula en el punto \(\theta\) (\(\chi=\tfrac12\)).</p>
<div class="sim" data-sim="flory-huggins" data-title="Energía de mezcla, espinodal, binodal y presión osmótica de Flory–Huggins"></div>
<div class="sim-guide"><ul>
<li>Con \(N=100\): \(\phi_c=0.0909\) y \(\chi_c=0.605\). A \(\chi=0.7\) (binodal por la igualdad de los dos potenciales químicos, \(\mu_1\) y \(\mu_2\), resuelta con Newton) la disolución se separa en una fase con \(\phi=0.0015\) y otra con \(\phi=0.371\). Con \(N=1\) y \(\chi=2.5\): 0.145 y 0.855, simétricas (solución regular); con \(N=1000\) y \(\chi=0.6\): 2×10⁻⁷ y 0.236 (el polímero largo se separa casi totalmente del disolvente aun con \(\chi\) apenas sobre \(\tfrac12\)).</li>
<li>A \(\phi=0.05\), \(N=100\), \(\chi=0.7\) la presión osmótica es \(4\times10^{-5}\), diez veces menor que la ideal (\(5\times10^{-4}\)), porque \(\chi>\tfrac12\) reduce la osmosis por atracción entre segmentos. Con \(\chi<\tfrac12\) (buen disolvente), mayor que la ideal. La pendiente de \(\Pi/c\) frente a \(c\) mide \(\chi\), y su ordenada, \(RT/M_n\).</li>
<li>Como \(\chi\approx A+B/T\), \(\chi\) crece al enfriar: la separación de fases ocurre al <em>enfriar</em> por debajo de una temperatura crítica superior de solución (UCST; el poliestireno en ciclohexano separa por debajo de 35 °C). Otros polímeros (poli-N-isopropilacrilamida en agua) separan al <em>calentar</em> (LCST, 32 °C) por el efecto hidrófobo.</li>
</ul></div>
</section>

<section>
<h2>Hélice y ovillo: el modelo de Zimm–Bragg</h2>
<p>Un polipéptido puede estar en hélice \(\alpha\) o en ovillo estadístico. Zimm y Bragg (1959) describieron la transición con dos parámetros: \(s\), el peso estadístico de añadir un residuo a una hélice existente (\(s=e^{-\Delta G/RT}\); \(s=1\) a la temperatura de fusión del residuo), y \(\sigma\ll1\) (típicamente \(10^{-3}\)–\(10^{-4}\)), el costo de <em>nuclear</em> una hélice nueva: para comenzar una vuelta, tres residuos pierden entropía sin ganar aún los enlaces de hidrógeno. La función de partición es el producto de matrices de transferencia, y la fracción de hélice, su derivada logarítmica:</p>
<div class="eq key" data-name="Zimm–Bragg">\[Z=(1,0)\begin{pmatrix}1&\sigma s\\1&s\end{pmatrix}^{\!N}\binom11,\qquad\theta_H=\frac1N\frac{\partial\ln Z}{\partial\ln s}.\]</div>
<div class="sim" data-sim="zimm-bragg" data-title="Transición hélice–ovillo cooperativa de Zimm–Bragg"></div>
<div class="sim-guide"><ul>
<li>Con \(N=40\) residuos, \(\sigma=10^{-3}\) y \(\Delta H=4.2\) kJ/mol por residuo (valor de la poli-L-alanina), la transición ocupa 34 K entre \(\theta=0.8\) y 0.2, frente a más de 100 K para una transición no cooperativa (\(\sigma=1\), que es la curva de trazos \(\theta=s/(1+s)\)): la cooperatividad la afila. Cuanto menor \(\sigma\), más cooperativa: la longitud de un tramo de hélice que se funde de una vez es ≈ \(1/\sqrt\sigma\) (32 residuos para \(\sigma=10^{-3}\)).</li>
<li>Para cadenas largas (\(N\to\infty\)) la transición es continua pero muy aguda, y \(\theta\to\tfrac12\) en \(s=1\) (con \(\sigma=10^{-3}\): 0.17 para \(N=40\), 0.42 para \(N=200\), 0.48 para \(N=1000\)); para cadenas cortas la hélice es menos estable porque la nucleación no compensa. Por eso los péptidos de menos de unos 15 residuos casi nunca forman hélice aislados, mientras que la misma secuencia en una proteína sí.</li>
<li>Este modelo de una dimensión, resoluble exactamente, es un modelo de Ising unidimensional: no hay transición de fase verdadera en 1D, sino un cruce más o menos agudo según \(\sigma\); verificación: el resultado de la matriz de transferencia coincide con la suma explícita de las \(2^N\) configuraciones.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un polímero tiene \(M_n=50\,000\) g/mol. Calcule la presión osmótica (en Pa) de una disolución de 5 g/L a 298 K en el límite ideal.
<details><summary>Respuesta</summary><p>\(c=5/50000=1.0\times10^{-4}\) mol/L \(=0.10\) mol/m³; \(\Pi=cRT=0.10\times8.314\times298=248\) Pa (2.5 cm de agua): pequeña pero medible; por eso la osmometría funciona hasta \(M_n\sim10^6\).</p></details></li>
<li><span class="lvl">Básico</span>Para un nailon con \(p=0.995\), calcule \(X_n\), \(X_w\) y \(M_w/M_n\).
<details><summary>Respuesta</summary><p>\(X_n=1/0.005=200\); \(X_w=1.995/0.005=399\); \(M_w/M_n=1.995\).</p></details></li>
<li><span class="lvl">Intermedio</span>Para una cadena de ADN de 50 kpb (\(L=17\) µm) con \(P=50\) nm, calcule \(\langle R^2\rangle^{1/2}\) con la fórmula de Kratky–Porod y compárelo con \(L\).
<details><summary>Respuesta</summary><p>\(L/P=340\gg1\): \(\langle R^2\rangle\approx2PL(1-P/L)=2(50)(17000)(1-0.0029)=1.695\times10^6\) nm²; \(\langle R^2\rangle^{1/2}=1302\) nm (1.3 µm), 7.7 % de \(L\). Es un ovillo, no una varilla.</p></details></li>
<li><span class="lvl">Intermedio</span>Con Flory–Huggins, halle \(\chi_c\) y \(\phi_c\) para \(N=400\), y diga si una disolución con \(\chi=0.55\) separa fases.
<details><summary>Respuesta</summary><p>\(\sqrt N=20\): \(\chi_c=\tfrac12(1+1/20)^2=0.551\); \(\phi_c=1/21=0.0476\). \(\chi=0.55<0.551\): justo por debajo de crítico, una fase (miscible) pero casi inestable.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que para una cadena gaussiana la fuerza de restitución es \(f=3k_BTR/Nb^2\) y que la tensión de un caucho es proporcional a \(T\).
<details><summary>Respuesta</summary><p>La energía libre de Helmholtz de una cadena con extremos a \(R\): \(A(R)=-k_BT\ln P(R)=\tfrac{3k_BTR^2}{2Nb^2}+\text{cte}\) (la energía interna es independiente de \(R\) para una cadena ideal). La fuerza es \(f=\partial A/\partial R=3k_BTR/Nb^2\), proporcional a \(T\). Si una banda de caucho se estira a longitud fija y se calienta, la fuerza crece (la «anomalía» de Gough–Joule: la banda estirada se contrae al calentarla), y como \(S=-\partial A/\partial T<0\) al estirar, el trabajo del estiramiento se disipa como calor.</p></details></li>
</ol>
