<p class="lead">Una célula es una máquina química que funciona lejos del equilibrio: mantiene su ATP 10⁹ veces por encima de lo que la termodinámica permitiría, conserva una diferencia de potencial de decenas de milivoltios a través de una membrana de 4 nm y bombea protones hasta crear un campo eléctrico de 10⁷ V/m en el que una proteína del tamaño de una molécula grande produce ATP girando como una turbina. Este último capítulo reúne la termodinámica de los capítulos anteriores —energía de Gibbs, constantes de equilibrio, potenciales electroquímicos, ecuación de Nernst— con la difusión del capítulo 37 para entender cómo se captura, se almacena y se gasta la energía en los seres vivos, y termina con el ejemplo más famoso de física de membranas: el potencial de acción de Hodgkin y Huxley (1952).</p>

<section>
<h2>El ATP: energía de Gibbs, desequilibrio y acoplamiento</h2>
<p>El ATP no es un combustible de alta energía en el sentido de un enlace especial, sino un reactivo mantenido fuera del equilibrio. Para ATP + H₂O ⇌ ADP + Pi, con el estado estándar bioquímico (pH 7, concentraciones 1 M excepto H⁺ y H₂O), \(\Delta G^{\circ\prime}\approx-30.5\) kJ/mol a 25 °C, y la energía de Gibbs real depende de las concentraciones:</p>
<div class="eq key" data-name="Energía de Gibbs del ATP">\[\Delta G=\Delta G^{\circ\prime}+RT\ln\frac{[\mathrm{ADP}][\mathrm{P_i}]}{[\mathrm{ATP}]},\qquad K'=e^{-\Delta G^{\circ\prime}/RT}=2.2\times10^{5}\ \mathrm M\ (25\ °\mathrm C).\]</div>
<p>(\(\Delta G^{\circ\prime}\) no es una constante universal: depende también del pH, de la concentración de Mg²⁺ —que se une al ATP— y de la fuerza iónica; las tablas de Alberty dan entre −36 y −38 kJ/mol para pH 7 y fuerza iónica entre 0 y 0.25 M con magnesio libre. Aquí se usa el valor de los textos, −30.5 kJ/mol, que es el que incorporan las escalas de la bioquímica elemental.)</p>
<p>La utilidad del ATP es su <em>posición intermedia</em> en la escala de potencial de transferencia de grupo fosfato: puede recibir fosfato de los donadores de más alta energía (fosfoenolpiruvato, 1,3-bisfosfoglicerato, fosfocreatina) y cederlo a los aceptores (glucosa, glicerol) de forma que cada transferencia tenga \(\Delta G^{\circ\prime}<0\). Y la <em>suma</em> de energías de Gibbs permite acoplar una reacción desfavorable a la hidrólisis del ATP: glucosa + Pi → glucosa-6-fosfato (+13.8 kJ/mol) con ATP + H₂O → ADP + Pi (−30.5 kJ/mol) da glucosa + ATP → G6P + ADP con \(\Delta G^{\circ\prime}=-16.7\) kJ/mol, y la constante de equilibrio se multiplica por \(e^{30.5/RT}=2.2\times10^5\).</p>
<div class="sim" data-sim="acople-atp" data-title="Escala de potencial de transferencia de fosfato, ΔG del ATP frente a [ATP]/[ADP] y acoplamiento con la fosforilación de la glucosa"></div>
<div class="sim-guide"><ul>
<li>Con [ATP] = 3 mM, [ADP] libre = 0.1 mM y [Pi] = 5 mM a 37 °C, \(\Delta G=-52.9\) kJ/mol. Con 5, 0.25 y 5 mM a 25 °C se obtiene −51.1 kJ/mol. En una célula típica la hidrólisis del ATP libera 50–60 kJ/mol, casi el doble de \(\Delta G^{\circ\prime}\).</li>
<li>El cociente [ATP]/[ADP] en equilibrio con 5 mM de Pi sería \([\mathrm{P_i}]/K'=3.7\times10^{-8}\); el real, 30: la célula mantiene el sistema \(8\times10^8\) veces por encima del equilibrio, y esa es la energía almacenada. Con \(\Delta G=0\) el ATP sería inútil; las curvas de la derecha cruzan cero entre \(7\times10^{-9}\) y \(2\times10^{-7}\) según el Pi.</li>
<li>Para la fosforilación de la glucosa a 37 °C, sin acoplar, la relación [G6P]/[Glc] de equilibrio es \(2.4\times10^{-5}\) (con 5 mM de Pi: casi nada); acoplada al ATP, \(1.9\times10^{4}\). El factor de ganancia es, exactamente, el factor de desequilibrio del ATP (\(8\times10^8\)): el acoplamiento «presta» el desequilibrio del ATP a la reacción que lo necesita.</li>
</ul></div>
</section>

<section>
<h2>Potenciales redox biológicos y la cadena respiratoria</h2>
<p>La mayor parte del ATP se produce en la mitocondria, donde los electrones de NADH y succinato fluyen por cuatro complejos hasta el O₂. El potencial de reducción de una semirreacción Ox + \(m\)H⁺ + \(n\)e⁻ → Red depende del pH como \(E=E^\circ-\tfrac mn\tfrac{RT\ln10}F\,\mathrm{pH}\), de modo que el valor a pH 7, \(E^{\circ\prime}\), es el que se usa en bioquímica:</p>
<div class="eq key" data-name="Potenciales redox bioquímicos">\[E^{\circ\prime}=E^\circ-\frac mn\frac{RT\ln10}F\cdot7,\qquad\Delta G^{\circ\prime}=-nF\,\Delta E^{\circ\prime}.\]</div>
<p>Para el O₂/H₂O (\(E^\circ=1.229\) V, \(m=n=4\)): \(E^{\circ\prime}=0.815\) V. Para el H⁺/H₂: −0.414 V. NAD⁺/NADH: −0.320 V. El \(\Delta E^{\circ\prime}\) total de NADH a O₂ es 1.135 V y \(\Delta G^{\circ\prime}=-2F(1.135)=-219\) kJ por par de electrones (−438 kJ por mol de O₂): una combustión controlada en pasos de unos 70, 40 y 108 kJ en los complejos I, III y IV, cada uno con energía suficiente para bombear protones y ninguno tan grande que se pierda como calor.</p>
<div class="sim" data-sim="cadena-respiratoria" data-title="Escala de E°′ de los transportadores de electrones de la cadena respiratoria y energía de cada complejo"></div>
<div class="sim-guide"><ul>
<li>Con los valores estándar: complejo I (NADH → ubiquinona), \(\Delta E^{\circ\prime}=0.365\) V, \(-70.4\) kJ por par de electrones; complejo III (ubiquinol → citocromo \(c\)), \(-40.3\); complejo IV (citocromo \(c\) → O₂), \(-108.3\). La suma es −219.0. (Los textos dan valores un poco distintos porque asignan otros \(E^{\circ\prime}\) a los centros hierro–azufre y a los hemos.)</li>
<li>En la matriz mitocondrial el pH es alto (7.6) y el cociente [NADH]/[NAD⁺] es bajo (0.1): el \(\Delta E\) real sube y la energía por par de electrones pasa a −209.5 kJ (menor en valor absoluto: el cociente bajo de NADH/NAD⁺ y el pH alto reducen el \(\Delta E\)). Esos 10 H⁺ bombeados (4 en el complejo I, 4 en el III, 2 en el IV) cuestan \(10F\Delta p=187\) kJ a \(\Delta p=0.194\) V: se conserva el 89 % de la energía libre disponible en forma de gradiente protónico; el resto se disipa en calor. La conversión posterior a ATP (2.5 ATP × 55 kJ = 137 kJ) rinde 66 %.</li>
<li>Con un cociente NADH/NAD⁺ de 1 el \(\Delta G\) es −215.5 kJ y con 10 (matriz muy reducida), −221.4 kJ: el potencial del donador baja 30 mV por cada decena (\(RT\ln10/2F\)), de modo que el estado redox de la matriz fija cuánta energía hay disponible para sostener \(\Delta p\).</li>
</ul></div>
</section>

<section>
<h2>Quimiosmosis: la fuerza protón-motriz y la ATP sintasa</h2>
<p>Mitchell (1961) propuso que los complejos respiratorios no producen ATP directamente: bombean protones a través de la membrana interna y crean un gradiente electroquímico, la <em>fuerza protón-motriz</em>, cuya energía recupera la ATP sintasa cuando los protones vuelven. El potencial electroquímico del H⁺ tiene una parte eléctrica y una osmótica (de concentración):</p>
<div class="eq key" data-name="Fuerza protón-motriz">\[\Delta p=\Delta\psi+\frac{2.303\,RT}F\,\Delta\mathrm{pH}\ \ (=\Delta\psi+59\,\Delta\mathrm{pH}\ \text{mV a 25 °C}),\qquad n_\mathrm{min}=\frac{\Delta G_\mathrm{ATP}}{F\,\Delta p},\]</div>
<p>donde \(\Delta\psi=\psi_P-\psi_N\) es el potencial del lado positivo (espacio intermembrana) menos el del lado negativo (matriz) y \(\Delta\mathrm{pH}=\mathrm{pH}_N-\mathrm{pH}_P\). Con 150 mV y 0.75 unidades de pH, \(\Delta p=194\) mV: cada mol de protones libera \(F\Delta p=18.8\) kJ. La síntesis de ATP en la matriz requiere \(\Delta G\approx55\) kJ/mol, de modo que hacen falta al menos \(n_\mathrm{min}=2.9\) protones por ATP. Pero la ATP sintasa tiene un anillo de \(c\) subunidades que gira un paso por cada protón: 8 en el corazón bovino (\(8/3=2.67\) H⁺ por ATP, pues una vuelta de 360° produce 3 ATP), 10 en levadura y <em>E. coli</em>, 14 en el cloroplasto; y el transportador de fosfato aporta un protón más por ATP exportado.</p>
<div class="sim" data-sim="quimiosmosis" data-title="Fuerza protón-motriz, protones mínimos por ATP y eficiencia de la ATP sintasa según el tamaño del anillo c"></div>
<div class="sim-guide"><ul>
<li>Con 150 mV, 0.75 unidades de pH y 55 kJ/mol: \(\Delta p=194\) mV, \(F\Delta p=18.8\) kJ/mol, \(n_\mathrm{min}=2.93\). Con el anillo \(c_8\) se usan 3.67 H⁺/ATP: la eficiencia termodinámica es 80 % y el P/O (ATP por par de electrones del NADH con 10 H⁺ bombeados) es 2.73. Con \(c_{10}\): 4.33 H⁺, 68 %, P/O = 2.31. Con \(c_{14}\): 5.67 H⁺, 52 %. El valor experimental de P/O aceptado es unos 2.5.</li>
<li>Un anillo mayor consume más protones por ATP pero necesita menos \(\Delta p\): con \(c_{10}\) bastan 132 mV para \(\Delta G=55\) kJ/mol, con \(c_{14}\), 101 mV. Es una vía por la que los organismos con gradientes débiles (cloroplastos, bacterias alcalófilas) pueden seguir fabricando ATP: se interpreta como una adaptación entre eficiencia (pocos H⁺ por ATP) y \(\Delta p\) mínimo.</li>
<li>La parte eléctrica domina en la mitocondria (150 de 194 mV) y la química en el cloroplasto (el tilacoide tiene \(\Delta\psi\) casi nulo y \(\Delta\mathrm{pH}\) de 2–3 unidades: 118–177 mV). Un desacoplante como el 2,4-dinitrofenol disipa \(\Delta p\) sin ATP: la energía va toda a calor.</li>
</ul></div>
</section>

<section>
<h2>Potenciales de membrana, bombas y transporte secundario</h2>
<p>La membrana celular separa disoluciones de composición muy distinta: el interior es rico en K⁺ y el exterior en Na⁺ y Cl⁻. Para un ion de carga \(z\) permeable, el equilibrio electroquímico (\(\tilde\mu\) igual en ambos lados) da el <em>potencial de Nernst</em> \(E=\dfrac{RT}{zF}\ln\dfrac{c_\mathrm{ext}}{c_\mathrm{int}}\). A 37 °C con las concentraciones de una neurona de mamífero ([K]ᵢ 140, [K]ₒ 5; [Na]ᵢ 15, [Na]ₒ 145; [Cl]ᵢ 10, [Cl]ₒ 110 mM): \(E_\mathrm K=-89.1\), \(E_\mathrm{Na}=+60.6\), \(E_\mathrm{Cl}=-64.1\) mV. Cuando varios iones son permeables, el potencial de reposo es el que anula la corriente neta; con el supuesto de campo constante en la membrana (Goldman, 1943; Hodgkin y Katz, 1949), para iones monovalentes</p>
<div class="eq key" data-name="Goldman–Hodgkin–Katz">\[V=\frac{RT}F\ln\frac{P_\mathrm K[\mathrm K]_o+P_\mathrm{Na}[\mathrm{Na}]_o+P_\mathrm{Cl}[\mathrm{Cl}]_i}{P_\mathrm K[\mathrm K]_i+P_\mathrm{Na}[\mathrm{Na}]_i+P_\mathrm{Cl}[\mathrm{Cl}]_o},\qquad V=\psi_i-\psi_o.\]</div>
<p>(Es el potencial de Nernst de una «mezcla» de iones, con las permeabilidades como pesos de cada uno.) Pero un potencial de reposo no es un equilibrio: el Na⁺ entra y el K⁺ sale continuamente, y la <em>bomba Na⁺/K⁺-ATPasa</em> los devuelve —3 Na⁺ fuera y 2 K⁺ dentro por cada ATP—, a un costo que es una fracción grande del metabolismo basal. Esa misma energía alimenta el <em>transporte secundario</em>: un simporte como SGLT1 acopla la entrada de 2 Na⁺ (cuesta menos que lo que rinde el gradiente) a la de una glucosa, que se acumula hasta que el trabajo de entrada del soluto iguala el de los iones, \([\mathrm{Glc}]_i/[\mathrm{Glc}]_o=e^{-2\Delta G_\mathrm{Na}/RT}\).</p>
<div class="sim" data-sim="potencial-membrana" data-title="Potenciales de Nernst, potencial de reposo de Goldman–Hodgkin–Katz, coste de la bomba Na⁺/K⁺ y acumulación por simporte"></div>
<div class="sim-guide"><ul>
<li>Con \(P_\mathrm{Na}/P_\mathrm K=0.04\) y \(P_\mathrm{Cl}/P_\mathrm K=0.45\): \(V=-67.3\) mV, por encima de \(E_\mathrm K\) porque una pequeña permeabilidad al Na⁺ lo arrastra hacia +60 mV. Subir [K⁺] exterior a 20 mM (hiperpotasemia) depolariza a −49.1 mV, cerca del umbral. Si \(P_\mathrm{Na}=P_\mathrm K\), \(V=-7.5\) mV: la membrana casi se descarga, como en el pico del potencial de acción. A ese \(V\) la suma de las corrientes de K⁺, Na⁺ y Cl⁻ se anula (la simulación lo comprueba): ese es el criterio con que se define el reposo.</li>
<li>El potencial de reposo de un axón de calamar a 18 °C con las concentraciones del axón (400/20 de K⁺, 50/440 de Na⁺, 40/560 de Cl⁻) y las mismas permeabilidades es −61.8 mV, cercano a los −60 mV medidos en el axón en reposo.</li>
<li>Ciclo de la bomba: \(\Delta G=3\Delta G_\mathrm{Na}+2\Delta G_\mathrm K=41.2\) kJ/mol a −67 mV, el 75 % de lo que libera un ATP (−55 kJ/mol); el 90 % de esa energía la consumen los 3 Na⁺ (12.4 kJ por Na⁺, de los cuales 6.5 son eléctricos). Con 2 Na⁺, la glucosa del SGLT se acumula hasta \(1.4\times10^4\) veces la concentración exterior (cota termodinámica; el valor real es menor por las fugas).</li>
</ul></div>
</section>

<section>
<h2>El potencial de acción: Hodgkin y Huxley</h2>
<p>Los potenciales de la sección anterior son estáticos. Pero un potencial de membrana puede cambiar en milisegundos, porque las permeabilidades al Na⁺ y al K⁺ dependen del propio potencial: cuando la membrana se despolariza, canales de Na⁺ se abren y el Na⁺ que entra despolariza más (retroalimentación positiva); después los canales de Na⁺ se inactivan y los de K⁺, más lentos, se abren y devuelven el potencial al reposo. Hodgkin y Huxley midieron las corrientes en el axón gigante del calamar con la técnica de fijación de voltaje y las ajustaron con un modelo de cuatro ecuaciones diferenciales (Nobel de 1963):</p>
<div class="eq key" data-name="Modelo de Hodgkin–Huxley">\[C\frac{\mathrm dV}{\mathrm dt}=I-\bar g_\mathrm{Na}m^3h\,(V-E_\mathrm{Na})-\bar g_\mathrm Kn^4(V-E_\mathrm K)-g_L(V-E_L),\qquad\frac{\mathrm dx}{\mathrm dt}=\alpha_x(V)(1-x)-\beta_x(V)\,x\ \ (x=m,h,n).\]</div>
<p>Con \(C=1\) µF/cm², \(\bar g_\mathrm{Na}=120\), \(\bar g_\mathrm K=36\), \(g_L=0.3\) mS/cm², \(E_\mathrm{Na}=50\), \(E_\mathrm K=-77\), \(E_L=-54.4\) mV, y las funciones \(\alpha(V)\), \(\beta(V)\) de ajuste a 6.3 °C (las velocidades escalan como \(3^{(T-6.3)/10}\)). Las variables \(m\), \(h\) y \(n\) son las probabilidades de que una «compuerta» esté abierta: \(m\) activa el Na⁺ (rápida), \(h\) lo inactiva (lenta), \(n\) activa el K⁺ (lenta).</p>
<div class="sim" data-sim="hodgkin-huxley" data-title="Modelo de Hodgkin–Huxley: potencial de acción, compuertas m, h y n, bloqueo con tetrodotoxina y tetraetilamonio"></div>
<div class="sim-guide"><ul>
<li>Con 10 µA/cm² inyectados durante 80 ms a 6.3 °C: 6 potenciales de acción, el primero a +40 mV y los siguientes de unos +30 mV, frecuencia 68 Hz, hiperpolarización posterior hasta −75 mV (el potencial queda cerca de \(E_\mathrm K\) porque \(n\) tarda en cerrarse). En el pico del primero, \(g_\mathrm{Na}\approx28\) y \(g_\mathrm K\approx2\) mS/cm²: el Na⁺ domina la fase ascendente. La inyección mínima para disparo repetitivo es 6.17 µA/cm² (el modelo se integra con tolerancia de \(10^{-8}\) y coincide con la integración de SciPy en 0.03 ms y 0.3 mV).</li>
<li>Con 2 µA/cm² (bajo el umbral de 2.24) solo hay una despolarización que se estabiliza; entre 2.24 y 6.17 µA/cm² la membrana da un único potencial de acción; por encima, disparo repetitivo. Con 20 µA/cm² sostenidos hay 7 picos (86 Hz): el primero llega a +41 mV y los siguientes a +26, porque entre picos los canales de Na⁺ no recuperan toda su disponibilidad (período refractario). Un pulso de 20 µA/cm² que dure 0.5 ms da un pico, uno de 0.2 ms no, y uno de 10 µA/cm² de 0.5 ms tampoco: umbral de carga y ley del todo o nada. A 18.5 °C hay 15 picos en 80 ms (189 Hz) y el primero baja a +26 mV: a mayor temperatura todas las compuertas se aceleran por igual y la inactivación y el K⁺ cortan el pico antes de que el Na⁺ entre del todo.</li>
<li>Marque «bloquear Na⁺» (tetrodotoxina del pez globo): sin potencial de acción, solo una despolarización pasiva de unos 4 mV. Con «bloquear K⁺» (tetraetilamonio): un pico y después una meseta a unos +8 mV, sin repolarización completa: el K⁺ es el que devuelve la membrana al reposo.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule la energía de Gibbs de la hidrólisis del ATP en un músculo en reposo (310 K) con [ATP] = 8 mM, [ADP] = 0.04 mM y [Pi] = 3 mM, tomando \(\Delta G^{\circ\prime}=-30.5\) kJ/mol.
<details><summary>Respuesta</summary><p>\(\Delta G=-30.5+RT\ln\dfrac{(0.04\times10^{-3})(3\times10^{-3})}{8\times10^{-3}}=-30.5+2.577\ln(1.5\times10^{-5})=-30.5-28.6=-59.1\) kJ/mol (con \(RT=2.577\) kJ/mol a 310 K): el músculo en reposo tiene un ATP/ADP muy alto y una energía por ATP casi el doble de la estándar.</p></details></li>
<li><span class="lvl">Básico</span>Con \(E^{\circ\prime}(\mathrm{NAD^+/NADH})=-0.320\) V y \(E^{\circ\prime}(\mathrm{O_2/H_2O})=0.815\) V, calcule \(\Delta G^{\circ\prime}\) de la oxidación de un mol de NADH por ½O₂ y de la oxidación de un mol de glucosa si cada glucosa da 10 NADH y 2 FADH₂ (tome para los FADH₂ −152 kJ/mol).
<details><summary>Respuesta</summary><p>\(\Delta G^{\circ\prime}=-2F(0.815+0.320)=-2(96485)(1.135)=-219\) kJ/mol de NADH. 10 NADH: −2190 kJ; 2 FADH₂: −304; total −2494 kJ, frente a −2870 kJ/mol de la combustión de la glucosa (la diferencia, 376 kJ, se disipa como calor en las etapas de oxidación previas y se guarda en parte en los 4 ATP de fosforilación a nivel de sustrato).</p></details></li>
<li><span class="lvl">Intermedio</span>Una ATP sintasa con anillo \(c_{10}\) trabaja con \(\Delta G=55\) kJ/mol, \(\Delta\psi=150\) mV y \(\Delta\mathrm{pH}=0.75\). Calcule \(\Delta p\), los protones por ATP (con 1 H⁺ adicional del transportador de fosfato), la eficiencia y el \(\Delta p\) mínimo para que funcione.
<details><summary>Respuesta</summary><p>\(\Delta p=0.150+0.0592(0.75)=0.194\) V (a 25 °C: 0.0592). \(n=10/3+1=4.33\) H⁺/ATP. Energía de entrada \(nF\Delta p=4.33(96.485)(0.194)=81.2\) kJ/mol y eficiencia \(55/81.2=68\) %. El \(\Delta p\) mínimo con ese \(n\) es \(\Delta G/nF=55\,000/(4.33\cdot96\,485)=0.132\) V; con el \(n\) mínimo termodinámico (2.93) sería el mismo 0.194.</p></details></li>
<li><span class="lvl">Intermedio</span>Con las concentraciones de la sección de membranas ([K]ᵢ 140, [K]ₒ 5, [Na]ᵢ 15, [Na]ₒ 145, [Cl]ᵢ 10, [Cl]ₒ 110 mM, a 37 °C) y \(P_\mathrm K:P_\mathrm{Na}:P_\mathrm{Cl}=1:0.04:0.45\), calcule el potencial de reposo y cómo cambia si [K]ₒ sube a 20 mM.
<details><summary>Respuesta</summary><p>Numerador (con \(\mathrm{K}_o\)=5): \(5+0.04(145)+0.45(10)=15.3\); denominador: \(140+0.04(15)+0.45(110)=190.1\). \(V=26.7\ln(15.3/190.1)=26.7(-2.520)=-67.3\) mV (\(RT/F=26.7\) mV a 310 K). Con \(\mathrm{K}_o=20\): \(20+5.8+4.5=30.3\); \(V=26.7\ln(30.3/190.1)=-49.1\) mV: una depolarización de 18 mV, con riesgo de arritmia cardíaca (hiperpotasemia).</p></details></li>
<li><span class="lvl">Avanzado</span>Deduzca la ecuación GHK a partir del flujo de campo constante \(I=Pz^2F\,u\,\dfrac{c_i-c_oe^{-zu}}{1-e^{-zu}}\), \(u=FV/RT\), imponiendo corriente neta nula para K⁺, Na⁺ y Cl⁻.
<details><summary>Respuesta</summary><p>Para un catión monovalente (\(z=1\)): \(I=PFu\,(c_i-c_oe^{-u})/(1-e^{-u})\). Para un anión monovalente (\(z=-1\)): \(I=PFu\,(c_i-c_oe^{u})/(1-e^{u})=PFu\,(c_o-c_ie^{-u})/(1-e^{-u})\) (se multiplica numerador y denominador por \(e^{-u}\)). Al sumar, el factor común \(Fu/(1-e^{-u})\) sale y la condición \(\sum I=0\) queda \(\sum_{+}P(c_i-c_oe^{-u})+\sum_-P(c_o-c_ie^{-u})=0\). Agrupando, \(e^{-u}\big(\sum_+Pc_o+\sum_-Pc_i\big)=\sum_+Pc_i+\sum_-Pc_o\), es decir \(V=\dfrac{RT}F\ln\dfrac{\sum_+Pc_o+\sum_-Pc_i}{\sum_+Pc_i+\sum_-Pc_o}\).</p></details></li>
</ol>
