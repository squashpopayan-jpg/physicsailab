<p class="lead">Casi ninguna reacción ocurre tal como se escribe. La ecuación \(2\,\mathrm{H_2}+\mathrm{O_2}\to2\,\mathrm{H_2O}\) no describe ningún choque: lo que pasa en realidad son decenas de reacciones elementales entre átomos, radicales y moléculas, cuyo conjunto se llama <em>mecanismo</em>. Este capítulo enseña a pasar del mecanismo a la ley de velocidad con las dos aproximaciones clásicas, el pre-equilibrio y el estado estacionario, y las aplica a dos casos centrales: la reacción unimolecular que depende de la presión (Lindemann) y la cadena de ramificación del hidrógeno, cuyo mecanismo moderno de diez especies y veintinueve reacciones se integra aquí entero, en el navegador.</p>

<section>
<h2>Reacciones elementales y molecularidad</h2>
<p>Una <span class="term">reacción elemental</span> es la que ocurre en un solo acto, sin intermediarios detectables. Su <em>molecularidad</em> es el número de moléculas que intervienen en él: unimolecular (\(\mathrm A\to\) productos), bimolecular (\(\mathrm A+\mathrm B\to\)) o, rara vez, termolecular (la probabilidad de que tres moléculas coincidan es tan pequeña que casi siempre se trata de dos choques sucesivos). Solo en las reacciones elementales la ley de velocidad se escribe a partir de la ecuación química: la velocidad es proporcional al producto de las concentraciones de los reactivos, cada una elevada a su coeficiente,</p>
<div class="eq key" data-name="Ley de acción de masas (reacción elemental)">\[\mathrm A+\mathrm B\xrightarrow{k}\mathrm P:\quad v=k[\mathrm A][\mathrm B];\qquad 2\,\mathrm A\xrightarrow{k}\mathrm P:\quad -\tfrac12\tfrac{\dd[\mathrm A]}{\dd t}=k[\mathrm A]^2.\]</div>
<p>En una reacción global el orden no tiene por qué coincidir con los coeficientes, y su medida es lo que permite <em>descartar</em> mecanismos (nunca demostrarlos): un mecanismo es una hipótesis compatible con la ley de velocidad, con los intermediarios detectados, con los efectos isotópicos y con la estereoquímica. Dos reglas lo ordenan:</p>
<ul>
<li><strong>Reversibilidad microscópica.</strong> Cada reacción elemental puede ocurrir en ambos sentidos y por el mismo camino, de modo que \(k_\mathrm f/k_\mathrm b=K_c\), la constante de equilibrio de esa reacción (capítulo 5). Por eso el mecanismo de combustión de este capítulo calcula las constantes inversas a partir de la termodinámica NASA y no las tabula.</li>
<li><strong>Etapa limitante.</strong> Si una etapa es mucho más lenta que las demás, fija la velocidad global y las posteriores solo la «acompañan». La ley de velocidad contiene la composición del estado de transición de la etapa limitante más la de los equilibrios previos. Ejemplo clásico a baja temperatura: \(\mathrm{NO_2+CO\to NO+CO_2}\) obedece \(v=k[\mathrm{NO_2}]^2\), de orden cero en CO, porque la etapa lenta es \(2\,\mathrm{NO_2}\to\mathrm{NO_3}+\mathrm{NO}\) y la rápida \(\mathrm{NO_3+CO\to NO_2+CO_2}\) solo consume lo que la primera produce.</li>
</ul>
<p>Cuando no hay una etapa claramente más lenta —y en un mecanismo con ramificación nunca la hay— hace falta una aproximación sistemática.</p>
</section>

<section>
<h2>Pre-equilibrio y estado estacionario</h2>
<p>Sea el mecanismo más sencillo con un intermediario \(\mathrm I\) reactivo:</p>
<div class="eq" data-name="Mecanismo con intermediario">\[\mathrm A+\mathrm B\ \underset{k_{-1}}{\overset{k_1}{\rightleftharpoons}}\ \mathrm I\ \xrightarrow{\,k_2\,}\ \mathrm P.\]</div>
<p>Integrar el sistema completo exige un computador; las dos aproximaciones lo reducen a una ley de velocidad analítica.</p>
<p><strong>Estado estacionario</strong> (Bodenstein, 1913). Un intermediario muy reactivo nunca se acumula: su concentración es pequeña y casi constante después de un breve periodo de inducción, así que \(\dd[\mathrm I]/\dd t\approx0\):</p>
<div class="eq key" data-name="Aproximación del estado estacionario (SSA)">\[[\mathrm I]_{ss}=\frac{k_1[\mathrm A][\mathrm B]}{k_{-1}+k_2},\qquad v=k_2[\mathrm I]_{ss}=\frac{k_1k_2}{k_{-1}+k_2}[\mathrm A][\mathrm B].\]</div>
<p><strong>Pre-equilibrio.</strong> Si \(k_2\ll k_{-1}\), el intermediario casi no avanza hacia productos y se mantiene en equilibrio con los reactivos, \([\mathrm I]=K_1[\mathrm A][\mathrm B]\) con \(K_1=k_1/k_{-1}\), de donde \(v=K_1k_2[\mathrm A][\mathrm B]\). Es el límite de la fórmula del estado estacionario para \(k_2\ll k_{-1}\), de modo que la segunda es siempre la más general. Hay un tercer régimen: si \(k_2\gg k_{-1}\), cada intermediario formado va a productos y la etapa 1 es la limitante, \(v=k_1[\mathrm A][\mathrm B]\).</p>
<p>Una consecuencia útil para la temperatura: en el régimen de pre-equilibrio \(k=K_1k_2\) y la energía de activación efectiva es \(E_{a}=E_1-E_{-1}+E_2=\Delta H_1+E_2\). Si el complejo de encuentro es muy estable (\(\Delta H_1\) muy negativo) y la barrera \(E_2\) es pequeña, la suma es <em>negativa</em>: la reacción se hace más lenta al calentar. Así se explican las energías de activación negativas del capítulo 17 (\(\mathrm{NCO+NO}\), y también \(\mathrm{OH+}\) muchas moléculas de la atmósfera) sin violar nada.</p>
<div class="sim" data-sim="ssa-preeq" data-title="Estado estacionario y pre-equilibrio frente a la integración exacta del mecanismo"></div>
<div class="sim-guide"><ul>
<li>La curva negra es la integración numérica exacta del mecanismo de cuatro especies (método de Rosenbrock, tolerancia relativa \(10^{-9}\)); las dos de trazos son las aproximaciones. Con \(k_1=1\), \([\mathrm A]_0=[\mathrm B]_0=1\) y \(k_{-1}=100\), \(k_2=1\) (relación \(k_2/k_{-1}=0.01\)), los errores de \([\mathrm P]\) en \(t=3\) son 2.2 % para el estado estacionario y 3.2 % para el pre-equilibrio: las dos funcionan.</li>
<li>Con \(k_{-1}=k_2=10\) el pre-equilibrio ya no es válido (27 % de error) y el estado estacionario sigue bien (1.9 %). Con \(k_{-1}=20\), \(k_2=600\) —el intermediario va casi siempre a productos— el pre-equilibrio falla por 34 %, y el estado estacionario sigue dando 0.9 %.</li>
<li>Con \(k_{-1}=1000\), \(k_2=1\) (\(k_2/k_{-1}=10^{-3}\)) las tres curvas son indistinguibles (0.2 % y 0.3 %). Los errores que quedan en los demás casos vienen de la masa retenida en \(\mathrm I\) y del retraso de inducción, de duración \(1/(k_{-1}+k_2)\).</li>
</ul></div>
<div class="box warn"><h4>Cuándo falla el estado estacionario</h4><p>La aproximación pide que el intermediario sea <em>mucho</em> menos abundante que los reactivos y que se renueve rápido. Si \(\mathrm I\) se acumula (por ejemplo, un intermediario estable como el peróxido de hidrógeno en el sistema H₂–O₂), derivar con \(\dd[\mathrm I]/\dd t=0\) da una ley errónea; entonces hay que integrar el mecanismo completo.</p></div>
</section>

<section>
<h2>Reacciones unimoleculares: Lindemann, Hinshelwood y Troe</h2>
<p>Una molécula aislada se descompone sin ayuda de nadie, y sin embargo, a presión baja, su velocidad depende de la presión. Lindemann (1922) resolvió la paradoja: la molécula primero debe <em>activarse</em> por un choque con otra \(\mathrm M\) (cualquiera), y la activada \(\mathrm A^*\) puede desactivarse por un nuevo choque o descomponerse:</p>
<div class="eq" data-name="Mecanismo de Lindemann">\[\mathrm A+\mathrm M\ \underset{k_{-1}}{\overset{k_1}{\rightleftharpoons}}\ \mathrm A^*+\mathrm M,\qquad \mathrm A^*\xrightarrow{\,k_2\,}\mathrm P.\]</div>
<p>El estado estacionario para \(\mathrm A^*\) da la constante unimolecular efectiva \(k_\mathrm{uni}=v/[\mathrm A]\):</p>
<div class="eq key" data-name="Constante unimolecular de Lindemann">\[k_\mathrm{uni}=\frac{k_1k_2[\mathrm M]}{k_{-1}[\mathrm M]+k_2}\ \longrightarrow\ \begin{cases}k_1[\mathrm M]&\text{(presión baja: la activación limita; orden 2)}\\ k_\infty=\dfrac{k_1k_2}{k_{-1}}&\text{(presión alta: cinética de primer orden)}\end{cases}\]</div>
<p>La constante pasa de ser proporcional a la presión (\(v=k_1[\mathrm A][\mathrm M]\), de segundo orden global) a ser independiente de ella (primer orden), con una región de transición, la <span class="term">zona de caída de presión</span> (<em>fall-off</em>), centrada en \([\mathrm M]_{1/2}=k_2/k_{-1}\). Hinshelwood (1927) añadió que la molécula activada puede acumular energía en muchos modos de vibración; Rice, Ramsperger y Kassel (RRK) y luego Marcus (RRKM) dieron la forma de \(k_2(E)\). La teoría de Lindemann predice una transición demasiado abrupta: la real es más ancha. Troe (1979) lo corrige con un factor de ensanchamiento \(F\le1\):</p>
<div class="eq" data-name="Ajuste de Troe">\[k_\mathrm{uni}=k_\infty\frac{P_r}{1+P_r}\,F,\qquad P_r=\frac{k_0[\mathrm M]}{k_\infty},\quad \log F=\frac{\log F_c}{1+\left[\dfrac{\log P_r+c}{n-0.14(\log P_r+c)}\right]^2},\]</div>
<p>con \(c=-0.4-0.67\log F_c\), \(n=0.75-1.27\log F_c\) y \(F_c(T)=(1-a)e^{-T/T^{***}}+a\,e^{-T/T^{*}}+e^{-T^{**}/T}\): cuatro parámetros ajustados a los datos y a cálculos RRKM. Es la forma que usan los mecanismos de combustión modernos para cada reacción de caída de presión.</p>
<div class="sim" data-sim="lindemann" data-title="Caída de presión de H₂O₂ → 2 OH: Lindemann frente al ajuste de Troe del mecanismo real"></div>
<div class="sim-guide"><ul>
<li>La reacción \(\mathrm{H_2O_2(+M)\to2\,OH(+M)}\) es la única de caída de presión del mecanismo de hidrógeno de Li, Zhao, Kazakov y Dryer (2004). A 1000 K y 1 atm vale \(k_\mathrm{uni}=112\) s⁻¹ con Troe y 159 s⁻¹ con la fórmula de Lindemann (\(F=0.704\)): el ensanchamiento reduce 30 % la constante en medio de la zona de transición.</li>
<li>A 1000 K el límite de alta presión es \(k_\infty=7.1\times10^3\) s⁻¹ y la presión de media caída vale \(P_{1/2}=43.7\) atm: a 100 atm, \(k=2.1\times10^3\) s⁻¹ (\(F=0.43\)), todavía lejos del límite. A 0.01 atm, \(k=1.4\) s⁻¹: la reacción ya es proporcional a la presión.</li>
<li>El centro de la caída se desplaza con la temperatura: \(P_{1/2}=11\) atm a 500 K, 17.5 atm a 700 K y 43.7 atm a 1000 K. Las moléculas más calientes se descomponen más rápidamente (\(k_2\) crece más deprisa con \(T\) que \(k_{-1}\)): la desactivación tiene que ser más frecuente para competir con la descomposición, y hace falta más presión para llegar al límite de alta presión.</li>
</ul></div>
<div class="box note"><h4>Un asunto de unidades</h4><p>Las constantes de los mecanismos de combustión usan cm³, mol y s (o m³, kmol y s): una reacción de segundo orden se mide en cm³/mol·s, una termolecular en cm⁶/mol²·s. La caída de presión hace que la unidad de una misma reacción cambie con la presión; por eso se escribe como una constante unimolecular \(k_\mathrm{uni}\) en s⁻¹ en el límite de alta presión y como \(k_0\) en cm³/mol·s en el de baja.</p></div>
</section>

<section>
<h2>Cadenas de ramificación: el sistema H₂–O₂</h2>
<p>Las reacciones que hemos visto producen un intermediario y lo consumen. Una <span class="term">reacción en cadena</span> lo regenera: cada vez que un radical reacciona produce otro que continúa el proceso. En la combustión del hidrógeno aparecen los tres tipos de etapas:</p>
<ul>
<li><strong>Iniciación</strong> (lenta, crea los primeros radicales): \(\mathrm{H_2+O_2\to HO_2+H}\), o \(\mathrm{H_2+M\to2H+M}\) a temperaturas muy altas.</li>
<li><strong>Propagación</strong> (un radical entra, uno sale): \(\mathrm{OH+H_2\to H_2O+H}\).</li>
<li><strong>Ramificación</strong> (un radical entra, dos salen): \(\mathrm{H+O_2\to OH+O}\) y \(\mathrm{O+H_2\to OH+H}\).</li>
<li><strong>Terminación</strong> (los radicales desaparecen): \(\mathrm{H+O_2+M\to HO_2+M}\) (en fase gas) o en las paredes del recipiente.</li>
</ul>
<p>El ciclo de ramificación completo es \(\mathrm H+\mathrm{O_2}+3\,\mathrm{H_2}\to2\,\mathrm{H_2O}+3\,\mathrm H\): un átomo de H se convierte en tres. Llamemos \(n\) a la concentración de portadores de cadena, \(f\) a la rapidez de ramificación y \(g\) a la de terminación (ambas por portador); entonces</p>
<div class="eq key" data-name="Balance de portadores de cadena (Semenov)">\[\frac{\dd n}{\dd t}=n_0+(f-g)\,n\ \Rightarrow\ n=\frac{n_0}{\varphi}\left(e^{\varphi t}-1\right),\qquad \varphi=f-g.\]</div>
<p>Si \(\varphi<0\) (más terminación que ramificación) los portadores alcanzan un valor estacionario \(n_0/|\varphi|\) y la reacción avanza despacio; si \(\varphi>0\), crecen <em>exponencialmente</em> y la reacción se dispara en una fracción de segundo, una explosión. Nikolái Semenov (con Hinshelwood, Nobel de Química de 1956) comprendió que la frontera está en \(\varphi=0\). Para el hidrógeno, la ramificación \(\mathrm{H+O_2\to OH+O}\) aporta dos radicales netos por ciclo (el tercero es el átomo de H que continúa), mientras que la terminación compite por el mismo H con un tercer cuerpo. La condición \(\varphi=0\) queda como</p>
<div class="eq key" data-name="Segundo límite de explosión (criterio de la cadena)">\[2\,k_{\mathrm{H+O_2\to O+OH}}=k_{\mathrm{H+O_2+M\to HO_2+M}}\,[\mathrm M]_\mathrm{eficaz}.\]</div>
<p>La ramificación es bimolecular; la terminación, termolecular. Por tanto, a presión baja gana la ramificación (hay explosión) y a presión alta, la terminación (el radical \(\mathrm{HO_2}\) es poco reactivo y se pierde): sorprendentemente, <em>aumentar la presión apaga la explosión</em>. Esa frontera es el <span class="term">segundo límite de explosión</span>. A presión todavía mayor, el \(\mathrm{HO_2}\) reacciona (\(\mathrm{HO_2+H_2\to H_2O_2+H}\) y \(\mathrm{H_2O_2(+M)\to2\,OH}\)), devuelve radicales a la cadena y se vuelve a la explosión (<em>tercer límite</em>). Por debajo del primer límite, a presiones del orden de 1 Torr, los radicales difunden hasta la pared y se pierden antes de ramificar. Los tres límites forman en el plano \(P\)–\(T\) la «península de explosión» que dibujaron Lewis y von Elbe.</p>
<div class="sim" data-sim="h2o2-cadena" data-title="Evolución en el tiempo de las especies del mecanismo H₂–O₂ (isotérmico, volumen constante)"></div>
<div class="sim-guide"><ul>
<li>La simulación integra el mecanismo de Li y colaboradores (2004: 10 especies, 29 reacciones, constantes inversas calculadas con las funciones NASA) a temperatura y volumen constantes; el programa de comparación (Cantera, reactor de volumen constante con la energía desconectada) coincide con el integrador del capítulo en 0.1–1 %. H₂ + aire estequiométrico, a 1000 K y 1 atm, tiene un periodo de inducción (tiempo para que el \(\mathrm{H_2O}\) llegue a 1 % de fracción molar) de 0.37 ms y consume la mitad del H₂ en 0.48 ms; la reserva máxima de radicales (H + O + OH) alcanza una fracción molar de 0.0063.</li>
<li>A 1100 K el periodo de inducción cae a 0.10 ms y la reserva de radicales sube a 0.039: la ramificación crece como \(e^{\varphi t}\) con \(\varphi\) más grande. Compare la subida de las curvas de H, O y OH <em>antes</em> de que aparezca agua: las tres suben en paralelo a lo largo de varias décadas de tiempo, la huella de una cadena con \(\varphi>0\).</li>
<li>A 900 K y 1 atm la mezcla estequiométrica no se enciende en el tiempo de la gráfica: el periodo de inducción es de 0.45 s y la reserva de radicales no pasa de \(3\times10^{-7}\), porque el criterio de la cadena ya se invirtió (\(\varphi<0\)) y domina la terminación. A 0.3 atm y la misma temperatura el periodo de inducción es de 2.4 ms y los radicales llegan a 0.012: <em>bajar</em> la presión de 1 a 0.3 atm acelera la reacción por un factor de 190.</li>
<li>La composición mueve la frontera. A 900 K y 0.5 atm —justo por encima del criterio de H₂ + aire, 0.48 atm— el aire no se enciende (radicales \(7\times10^{-7}\), consumo de la mitad del H₂ en más de 1 s). La mezcla H₂ + O₂ diluida en argón (2 : 1 : 7), con la misma presión, sí explota: 2.4 ms y radicales de 0.006. La rica en H₂ (4 : 1, en N₂) es lenta (radicales \(3\times10^{-4}\)). El criterio de la cadena lo anticipa: a 900 K vale 0.71 atm para la mezcla con argón, 0.48 para H₂ + aire y 0.45 para la rica, y a 0.5 atm solo la primera queda por debajo.</li>
</ul></div>
</section>

<section>
<h2>El límite de explosión calculado</h2>
<p>Con el mecanismo completo es posible recorrer la presión a temperatura fija y ver el cambio de régimen. El criterio de la cadena \(2k_1=k_5[\mathrm M]\) puede resolverse sin integrar nada: con las constantes del mecanismo y las eficiencias de tercer cuerpo de la mezcla H₂ + aire, vale 0.022 atm a 700 K, 0.12 atm a 800 K, 0.25 atm a 850 K, 0.48 atm a 900 K, 1.4 atm a 1000 K y 3.6 atm a 1100 K (coinciden con los valores que da Cantera para las mismas constantes hasta seis cifras). La integración muestra que el segundo límite no es una frontera matemática exacta —hay un periodo de inducción que crece de modo continuo—, pero sí un salto brusco de las escalas de tiempo.</p>
<div class="sim" data-sim="limite-explosion" data-title="Tiempo de consumo de la mitad del H₂ frente a la presión inicial y criterio de la cadena"></div>
<div class="sim-guide"><ul>
<li>Pulse «Calcular la curva» (integra doce presiones, unos diez segundos en total). A 900 K el tiempo \(t_{50}\) pasa de 36 ms a 0.01 atm a 4.2 ms a 0.1 atm y 2.5 ms a 0.3 atm; a 1 atm sube a 3.2 s —un salto de 1300 veces entre 0.3 y 1 atm— y a presiones mayores decrece de nuevo (0.57 s a 10 atm y 0.26 s a 30 atm, este último fuera de la gráfica): el tercer límite.</li>
<li>La línea vertical de trazos es el criterio \(2k_1=k_5[\mathrm M]\) (0.48 atm a 900 K), que cae justamente entre las presiones donde \(t_{50}\) salta. A 800 K la reacción es lenta ya a 0.3 atm (sin consumo de la mitad del H₂ en los 5 s del tope de la gráfica) y el criterio da 0.12 atm; los puntos de la curva a 0.1 y 0.3 atm lo encierran.</li>
<li>Las mediciones clásicas de Lewis y von Elbe sitúan el segundo límite de la mezcla H₂–O₂ a 500–600 °C en el orden de las centenas de mmHg, es decir, décimas de atmósfera, del mismo orden que el cálculo. La comparación es solo de orden de magnitud: el modelo es isotérmico y no contiene paredes, por lo que no reproduce el primer límite ni los efectos térmicos del tercero, y las curvas experimentales dependen del material y del tamaño del recipiente.</li>
</ul></div>
<div class="box note"><h4>La misma química, otros usos</h4><p>Este mecanismo de diez especies es el núcleo de todos los de combustión de hidrocarburos: el \(\mathrm{H+O_2\to OH+O}\) es la reacción que más controla la velocidad de una llama (capítulo 17 y GRI-Mech 3.0, con 53 especies), y los límites de explosión del hidrógeno son los que condicionan la seguridad en su almacenamiento, en los motores de cohete y la acumulación de hidrógeno en las contenciones de los reactores nucleares.</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>El mecanismo \(2\,\mathrm{NO_2}\xrightarrow{k_1}\mathrm{NO_3}+\mathrm{NO}\) (lenta), \(\mathrm{NO_3}+\mathrm{CO}\xrightarrow{k_2}\mathrm{NO_2}+\mathrm{CO_2}\) (rápida) describe \(\mathrm{NO_2+CO\to NO+CO_2}\) a baja temperatura. Halle la ley de velocidad y diga qué pasa si se duplica la presión de CO.
<details><summary>Respuesta</summary><p>La etapa lenta es la limitante: \(v=k_1[\mathrm{NO_2}]^2\), de orden 2 en NO₂ y orden 0 en CO. Duplicar la presión de CO no cambia la velocidad (sí la cambiaría duplicar la de NO₂, que la cuadruplica).</p></details></li>
<li><span class="lvl">Intermedio</span>La descomposición del ozono, \(2\,\mathrm{O_3}\to3\,\mathrm{O_2}\), sigue el mecanismo \(\mathrm{O_3}\rightleftharpoons\mathrm{O_2}+\mathrm O\) (\(k_1\), \(k_{-1}\)), \(\mathrm{O+O_3}\to2\,\mathrm{O_2}\) (\(k_2\)). Obtenga la ley de velocidad con el estado estacionario para O y su límite de pre-equilibrio.
<details><summary>Respuesta</summary><p>\([\mathrm O]_{ss}=k_1[\mathrm{O_3}]/(k_{-1}[\mathrm{O_2}]+k_2[\mathrm{O_3}])\). La pérdida de ozono es \(-\dd[\mathrm{O_3}]/\dd t=k_1[\mathrm{O_3}]-k_{-1}[\mathrm O][\mathrm{O_2}]+k_2[\mathrm O][\mathrm{O_3}]=\dfrac{2k_1k_2[\mathrm{O_3}]^2}{k_{-1}[\mathrm{O_2}]+k_2[\mathrm{O_3}]}\). Si \(k_2[\mathrm{O_3}]\ll k_{-1}[\mathrm{O_2}]\) (pre-equilibrio): \(v=2(k_1k_2/k_{-1})[\mathrm{O_3}]^2/[\mathrm{O_2}]\): de segundo orden en O₃ y de orden \(-1\) en O₂ (el oxígeno frena la reacción).</p></details></li>
<li><span class="lvl">Intermedio</span>En el mecanismo de Lindemann de una molécula, \(k_2=2\times10^{6}\) s⁻¹ y \(k_{-1}=5\times10^{-11}\) cm³/s. ¿A qué presión (en torr) a 500 K la constante unimolecular vale la mitad de \(k_\infty\)?
<details><summary>Respuesta</summary><p>\(k_\mathrm{uni}=k_\infty/2\) cuando \([\mathrm M]=k_2/k_{-1}=2\times10^6/5\times10^{-11}=4\times10^{16}\) cm⁻³ \(=4\times10^{22}\) m⁻³. \(P=nk_BT=4\times10^{22}(1.381\times10^{-23})(500)=276\) Pa \(=2.07\) torr.</p></details></li>
<li><span class="lvl">Intermedio</span>En una cadena, \(n_0=10^{10}\) cm⁻³s⁻¹. Calcule la concentración estacionaria de portadores si \(\varphi=-2\) s⁻¹, y en cuánto tiempo crece un factor \(10^6\) si \(\varphi=+5\) s⁻¹.
<details><summary>Respuesta</summary><p>Con \(\varphi<0\): \(n_{ss}=n_0/|\varphi|=5\times10^9\) cm⁻³. Con \(\varphi>0\): \(n\approx(n_0/\varphi)e^{\varphi t}\) crece \(10^6\) veces en \(t=\ln(10^6)/\varphi=13.8/5=2.76\) s (la reacción se dispara: la velocidad es proporcional a \(n\)).</p></details></li>
<li><span class="lvl">Avanzado</span>Para el mecanismo \(\mathrm A+\mathrm B\rightleftharpoons\mathrm I\to\mathrm P\) en régimen de pre-equilibrio, demuestre que \(E_a=E_1-E_{-1}+E_2\). Si el complejo \(\mathrm I\) está 25 kJ/mol por debajo de los reactivos y la barrera \(E_2\) para convertirse en P es de 5 kJ/mol sobre \(\mathrm I\), ¿cuánto vale \(E_a\)? ¿Qué le pasa a \(k\) al calentar?
<details><summary>Respuesta</summary><p>\(k=(k_1/k_{-1})k_2=(A_1A_2/A_{-1})\exp[-(E_1-E_{-1}+E_2)/RT]\), por lo que \(E_a=-R\,\dd\ln k/\dd(1/T)=E_1-E_{-1}+E_2\). Con \(E_1-E_{-1}=\Delta H_1=-25\) kJ/mol y \(E_2=5\): \(E_a=-20\) kJ/mol. \(k\) <em>disminuye</em> al calentar: a 300 K, \(k(400\,\mathrm K)/k(300\,\mathrm K)=\exp[-(E_a/R)(1/400-1/300)]=\exp[(20\,000/8.3145)(-8.33\times10^{-4})]=e^{-2.00}=0.135\) (si los factores \(A\) no dependen de \(T\)): a 400 K la reacción es siete veces más lenta.</p></details></li>
</ol>
