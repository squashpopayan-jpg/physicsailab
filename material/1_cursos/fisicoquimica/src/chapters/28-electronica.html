<p class="lead">Las moléculas absorben luz visible y ultravioleta cuando un electrón pasa a un orbital de mayor energía, y absorben ondas de radio cuando un núcleo cambia de orientación en un campo magnético. Con las dos herramientas se mide la concentración de una proteína, se explica el color de una zanahoria y se deduce la estructura de una molécula orgánica átomo a átomo. Este capítulo cierra la parte de estructura cuántica: de la teoría de los orbitales (capítulos 23–25) a lo que se ve en el espectrómetro.</p>

<section>
<h2>Absorción y ley de Beer–Lambert</h2>
<p>Cuando la luz atraviesa una disolución, cada capa de espesor \(\dd x\) absorbe una fracción proporcional a la concentración del cromóforo: \(-\dd I/I=\varepsilon\,c\,\dd x\ln10\). Integrando (Bouguer, 1729; Lambert, 1760; Beer, 1852):</p>
<div class="eq key" data-name="Ley de Beer–Lambert">\[A=\log_{10}\frac{I_0}{I}=\varepsilon\,c\,l,\qquad T=\frac I{I_0}=10^{-A}.\]</div>
<p>\(\varepsilon\) es el <span class="term">coeficiente de extinción molar</span> (M⁻¹cm⁻¹), propio de la sustancia y de la longitud de onda: \(10^3\) a \(10^5\) para transiciones permitidas, \(10^0\)–\(10^2\) para las prohibidas (las bandas \(d\)–\(d\) de los iones de los metales de transición). La ley es lineal solo en un intervalo: a concentración alta, las moléculas interaccionan y cambian \(\varepsilon\); a absorbancia alta, la luz parásita del instrumento (la que llega al detector sin pasar por la muestra) hace que la lectura se sature. Por esto se trabaja con \(0.1<A<1.5\).</p>
<div class="sim" data-sim="beer" data-title="Ley de Beer–Lambert, intervalo lineal y efecto de la luz parásita"></div>
<div class="sim-guide"><ul>
<li>El NADH (\(\varepsilon_{340}=6220\) M⁻¹cm⁻¹, la constante que sustenta casi todos los ensayos enzimáticos con deshidrogenasas) a 50 µM y 1 cm da \(A=0.311\) (48.8 % de transmitancia): una reacción que produce NADH se sigue por el aumento de \(A_{340}\) con \(\Delta A=0.00622\) por µM. Para esa cubeta, el intervalo útil va de 16 µM (\(A=0.1\)) a 241 µM (\(A=1.5\)).</li>
<li>El \(\beta\)-caroteno (\(\varepsilon=1.4\times10^5\)) alcanza \(A=1\) con solo 7 µM: un ε tan grande es lo que hace que unos pocos miligramos en un litro de hexano den un color anaranjado intenso. Con 0.2 % de luz parásita, una muestra de absorbancia verdadera 3 se lee como 2.52: súbale la concentración hasta ver cómo la curva medida se aplana respecto de la recta de Beer.</li>
</ul></div>
</section>

<section>
<h2>Transiciones electrónicas y principio de Franck–Condon</h2>
<p>Una transición electrónica en una molécula ocurre en \(\sim10^{-15}\) s, muy por debajo del período de vibración (\(\sim10^{-14}\) s): durante el salto los núcleos no se mueven (Franck, 1925; Condon, 1926; es la aproximación de Born–Oppenheimer aplicada a la luz). La transición es «vertical» en el diagrama de energía potencial, y qué niveles vibracionales \(v'\) del estado excitado se alcanzan depende del solapamiento entre las funciones de onda vibracionales de los dos estados:</p>
<div class="eq key" data-name="Factores de Franck–Condon">\[I_{0\to v'}\propto\bigl|\langle\chi_{v'}'|\chi_0\rangle\bigr|^2,\qquad\text{osciladores desplazados: }\ \bigl|\langle v'|0\rangle\bigr|^2=\frac{e^{-S}S^{v'}}{v'!},\ \ S=\frac{\mu\omega\,\Delta^2}{2\hbar}.\]</div>
<p>\(\Delta\) es el desplazamiento de la geometría de equilibrio al excitar; \(S\) (factor de Huang–Rhys) es el número medio de cuantos de vibración que se excitan, y la distribución es la de Poisson. Si \(S\) es pequeño (el estado excitado tiene casi la misma geometría), domina la banda \(0\to0\); si es grande, la intensidad máxima se desplaza a \(v'\approx S\), y la <em>progresión vibrónica</em> se hace larga. La fluorescencia, que sale del nivel \(v'=0\) del estado excitado (regla de Kasha), sigue la misma ley hacia abajo: es la <em>imagen especular</em> de la absorción, desplazada a menor energía por \(2S\hbar\omega\) (el desplazamiento de Stokes), que es el doble de la energía de reorganización \(\lambda=S\hbar\omega\).</p>
<div class="sim" data-sim="franck-condon" data-title="Principio de Franck–Condon: progresión vibrónica y simetría especular absorción–fluorescencia"></div>
<div class="sim-guide"><ul>
<li>Con \(S=1.5\) y \(\hbar\omega=1400\) cm⁻¹ (una vibración C=C): los factores son 0.223, 0.335, 0.251 y 0.126 para \(v'=0,1,2,3\); la banda más intensa es \(0\to1\), y el desplazamiento de Stokes es \(2S\hbar\omega=4200\) cm⁻¹ (0.52 eV). Los factores suman 1 (completitud) y su media es \(S\).</li>
<li>Con \(S=0.1\) la banda \(0\to0\) concentra el 90 % de la intensidad y el espectro se parece al de una transición «atómica» (poco desplazamiento: moléculas rígidas como el antraceno); con \(S=4\), la banda \(0\to0\) cae a 1.8 % y casi no se ve: el máximo está en \(v'=3\)–4. Una anchura de 120 cm⁻¹ deja ver la estructura vibracional (como en el antraceno en un disolvente apolar); con 400 cm⁻¹ la banda es lisa (los disolventes polares y la temperatura la borran).</li>
<li>La verificación de las fórmulas es numérica: los factores \(e^{-S}S^{v}/v!\) coinciden con las integrales de solapamiento de las funciones de Hermite desplazadas hasta \(10^{-10}\).</li>
</ul></div>
</section>

<section>
<h2>El color de los polienos</h2>
<p>Los electrones \(\pi\) de una cadena conjugada están deslocalizados y la brecha HOMO–LUMO disminuye al alargarla. En la teoría de Hückel (capítulo 24) la brecha de una cadena de \(N=2n\) carbonos es \(2\cdot2\cos\bigl[n\pi/(2n+1)\bigr]\cdot|\beta|\): \(2|\beta|\) para el eteno, \(1.236|\beta|\) para el butadieno y así hasta cero. El resultado cualitativo es correcto (el \(\beta\)-caroteno, con 11 dobles enlaces, absorbe en el azul y por eso es naranja); el cuantitativo, solo si se calibra \(|\beta|\) con un miembro de la serie:</p>
<div class="sim" data-sim="polienos" data-title="Máximo de absorción de los polienos: Hückel frente al experimento"></div>
<div class="sim-guide"><ul>
<li>Con \(|\beta|=4.62\) eV (ajustada al butadieno, 217 nm), el modelo da 134 nm para el eteno (experimento: 165), 302 para el hexatrieno (258), 386 para el octatetraeno (290), 471 para \(n=5\) (334), 557 para \(n=6\) (364) y 983 para el \(\beta\)-caroteno (452). El modelo de Hückel exagera la tendencia porque supone enlaces iguales: en la molécula real los enlaces simples y dobles alternan (1.46 y 1.34 Å) y eso abre una brecha que persiste en la cadena larga.</li>
<li>El experimento muestra una saturación: \(\lambda_\text{máx}\) crece cada vez más despacio con \(n\) (la diferencia entre 2 y 3 dobles enlaces es 41 nm; entre 5 y 6, 30 nm; el límite del polímero, el poliacetileno, está en el visible y no en el infrarrojo). Eso lo capta el modelo de Su, Schrieffer y Heeger (1979), con la alternancia de enlaces como variable. Ajuste \(|\beta|\) para ver que ningún valor reproduce todo el intervalo.</li>
</ul></div>
</section>

<section>
<h2>Resonancia magnética nuclear</h2>
<p>Un núcleo con espín \(I=\tfrac12\) (¹H, ¹³C, ¹⁹F, ³¹P) tiene un momento magnético y, en un campo \(B_0\), dos niveles \(m_I=\pm\tfrac12\) separados por \(\Delta E=\gamma\hbar B_0\); la transición ocurre con ondas de radio de frecuencia de Larmor \(\nu_0=\gamma B_0/2\pi\): 42.577 MHz por tesla para el ¹H (400 MHz a 9.39 T) y 10.708 MHz/T para el ¹³C. La diferencia de población es minúscula, \(\Delta N/N=h\nu_0/2k_BT=3.2\times10^{-5}\) a 400 MHz y 298 K, de modo que la RMN es una espectroscopía de baja sensibilidad que necesita campos altos. Tres propiedades convierten la señal en información química:</p>
<ul>
<li>El <strong>desplazamiento químico</strong> \(\delta=(\nu-\nu_\text{ref})/\nu_\text{ref}\) (en ppm): los electrones apantallan el campo en el núcleo, de manera distinta según el entorno químico (un H de un CH₃ resuena cerca de 1 ppm, el de un aldehído cerca de 10 ppm). En ppm es independiente del campo.</li>
<li>El <strong>acoplamiento espín–espín</strong> \(J\) (en Hz): los espines de núcleos vecinos se comunican a través de los electrones del enlace y desdoblan la señal en un multiplete. A diferencia de \(\delta\), \(J\) no depende del campo (cuando se mide en Hz). Para \(n\) vecinos equivalentes de espín \(\tfrac12\), el multiplete tiene \(n+1\) líneas con intensidades dadas por el triángulo de Pascal: el CH₃ del etilo, vecino de dos H, es un triplete 1:2:1; el CH₂, vecino de tres, es un cuarteto 1:3:3:1.</li>
<li>La <strong>integración</strong>: el área de cada señal es proporcional al número de núcleos que la producen.</li>
</ul>
<p>La regla de \(n+1\) vale cuando la diferencia de desplazamientos \(\Delta\nu\) es mucho mayor que \(J\) (primer orden). En el caso general hay que diagonalizar el hamiltoniano de espín. Para dos espines \(\tfrac12\) (sistema AB), el hamiltoniano \(\hat H/h=\nu_A\hat I_{zA}+\nu_B\hat I_{zB}+J\,\hat{\mathbf I}_A\cdot\hat{\mathbf I}_B\) tiene una solución exacta: cuatro líneas centradas en \((\nu_A+\nu_B)/2\) en las posiciones \(\pm(D\pm J)/2\) con \(D=\sqrt{\Delta\nu^2+J^2}\) e intensidades relativas \(1\mp J/D\):</p>
<div class="eq key" data-name="Sistema AB">\[\nu=\frac{\nu_A+\nu_B}2\pm\frac{D\pm J}2,\qquad I\propto1\mp\frac JD,\qquad D=\sqrt{(\nu_A-\nu_B)^2+J^2}.\]</div>
<div class="sim" data-sim="rmn" data-title="RMN: multipletes de primer orden y sistema AB exacto con diagonalización del hamiltoniano de espín"></div>
<div class="sim-guide"><ul>
<li>Con 2 vecinos y \(J=7\) Hz (un etilo típico) el multiplete es un triplete 1:2:1 con líneas separadas 7 Hz; con 3 vecinos, un cuarteto 1:3:3:1; con 6 (un grupo isopropilo, el CH), un septete 1:6:15:20:15:6:1. Un espectrómetro de 400 MHz (9.4 T) equivale a 0.017 ppm por cada 7 Hz: los acoplamientos son pequeños frente a los desplazamientos (10 ppm = 4000 Hz).</li>
<li>En el sistema AB con \(\Delta\nu=40\) Hz y \(J=7\) Hz: líneas en ±16.8 y ±23.8 Hz del centro, con intensidades 1.00 : 1.42 : 1.42 : 1.00 (\(\Delta\nu\gg J\): dos dobletes, apenas inclinados). Con \(\Delta\nu=10\) Hz la proporción pasa a 1 : 3.7 : 3.7 : 1 y las líneas interiores casi se juntan: el «efecto de tejado» o de techo, que se ve en los espectros reales cuando \(\Delta\nu/J\lesssim5\) y es la razón de que se compre un imán más potente (\(\Delta\nu\) crece con \(B_0\), \(J\) no). Con \(\Delta\nu=0\) los dos espines son equivalentes y el acoplamiento desaparece: queda una sola línea.</li>
<li>Los cálculos de este panel se han comprobado contra la construcción independiente del hamiltoniano con matrices de Pauli y productos de Kronecker (frecuencias a \(10^{-9}\) Hz) y contra las fórmulas analíticas del AB.</li>
</ul></div>
<div class="box note"><h4>Del espectro a la molécula</h4><p>La RMN moderna (Bloch, Purcell, Ernst, Wüthrich) usa pulsos de radiofrecuencia y la transformada de Fourier del decaimiento libre; con experimentos bidimensionales (COSY, HSQC, NOESY) se correlacionan los núcleos acoplados y los próximos en el espacio, y se determinan estructuras de proteínas de hasta 30 kDa en disolución. La resonancia de espines electrónicos (EPR) y la imagen por resonancia magnética (IRM) usan los mismos principios.</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una disolución de NADH en cubeta de 1 cm da \(A_{340}=0.45\). Halle su concentración (\(\varepsilon=6220\) M⁻¹cm⁻¹) y el porcentaje de luz transmitida.
<details><summary>Respuesta</summary><p>\(c=A/\varepsilon l=0.45/6220=7.2\times10^{-5}\) M \(=72\) µM; \(T=10^{-0.45}=35.5\) %.</p></details></li>
<li><span class="lvl">Básico</span>¿A qué frecuencia de Larmor resuena el ¹H y el ¹³C en un imán de 14.1 T? ¿Qué diferencia de población hay a 298 K para el ¹H?
<details><summary>Respuesta</summary><p>¹H: \(42.577\times14.1=600.3\) MHz; ¹³C: \(10.708\times14.1=151.0\) MHz. \(\Delta N/N=h\nu/2k_BT=(6.626\times10^{-34})(6.003\times10^8)/(2\times1.381\times10^{-23}\times298.15)=4.8\times10^{-5}\).</p></details></li>
<li><span class="lvl">Intermedio</span>Con \(S=2\) (progresión de Poisson), calcule los factores de Franck–Condon de \(v'=0,1,2,3,4\) y la banda más intensa.
<details><summary>Respuesta</summary><p>\(e^{-2}=0.1353\); \(v'=0\): 0.135; 1: 0.271; 2: 0.271; 3: 0.180; 4: 0.090. Las bandas \(0\to1\) y \(0\to2\) empatan como las más intensas (el máximo de la Poisson está en \(\lfloor S\rfloor\) y \(S-1\) cuando \(S\) es entero).</p></details></li>
<li><span class="lvl">Intermedio</span>Para un AB con \(\nu_A-\nu_B=20\) Hz y \(J=10\) Hz, calcule las posiciones de las cuatro líneas respecto del centro y sus intensidades relativas.
<details><summary>Respuesta</summary><p>\(D=\sqrt{400+100}=22.36\) Hz. Posiciones: \(\pm(D+J)/2=\pm16.18\) Hz e \(\pm(D-J)/2=\pm6.18\) Hz. Intensidades: \(1-J/D=0.553\) (las exteriores) y \(1+J/D=1.447\) (las interiores): razón 0.553 : 1.447 : 1.447 : 0.553.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre la ley de Poisson de los factores de Franck–Condon, \(|\langle v|0\rangle|^2=e^{-S}S^v/v!\), con el operador de desplazamiento.
<details><summary>Respuesta</summary><p>El estado fundamental del oscilador desplazado es el estado coherente \(|\alpha\rangle=e^{-|\alpha|^2/2}\sum_v\alpha^v/\sqrt{v!}\,|v\rangle\) del oscilador sin desplazar, con \(\alpha=\Delta\sqrt{\mu\omega/2\hbar}\). La probabilidad del nivel \(v\) es \(e^{-|\alpha|^2}|\alpha|^{2v}/v!\), con \(S=|\alpha|^2=\mu\omega\Delta^2/2\hbar\): una distribución de Poisson de media \(S\).</p></details></li>
</ol>
