<p class="lead">Una molécula de amoníaco gira 120° y queda idéntica; una de agua se refleja en dos planos y no cambia. La simetría hace más que ordenar: decide qué orbitales se pueden mezclar, cuántos modos de vibración distintos tiene una molécula, cuáles absorben infrarrojo, qué moléculas pueden tener momento dipolar o ser quirales. Todo eso se obtiene sin resolver una ecuación de Schrödinger, con una tabla de signos. Este capítulo construye esa maquinaria (la teoría de grupos aplicada) y la usa con siete moléculas reales; el programa de esta página encuentra las operaciones de simetría de cada una, identifica su grupo puntual y reduce la representación de los desplazamientos atómicos.</p>

<section>
<h2>Operaciones y elementos de simetría</h2>
<p>Una <span class="term">operación de simetría</span> mueve la molécula a una posición indistinguible de la inicial; el <em>elemento</em> de simetría es el punto, la línea o el plano respecto del cual se hace. Hay cinco tipos, y todas dejan al menos un punto fijo (de ahí «grupo puntual»):</p>
<ul>
<li><strong>\(E\)</strong>, la identidad (no hacer nada). Toda molécula la tiene.</li>
<li><strong>\(C_n\)</strong>, rotación propia de \(2\pi/n\) alrededor de un eje. El agua tiene un \(C_2\); el amoníaco, un \(C_3\); el benceno, un \(C_6\) y seis \(C_2\) perpendiculares.</li>
<li><strong>\(\sigma\)</strong>, reflexión en un plano. Se llama \(\sigma_h\) si es perpendicular al eje principal, \(\sigma_v\) si lo contiene y \(\sigma_d\) si lo contiene y biseca dos ejes \(C_2\).</li>
<li><strong>\(i\)</strong>, inversión por un centro: \((x,y,z)\to(-x,-y,-z)\).</li>
<li><strong>\(S_n\)</strong>, rotación impropia: giro de \(2\pi/n\) seguido de reflexión en el plano perpendicular al eje. El metano tiene tres \(S_4\); \(S_1=\sigma\) y \(S_2=i\).</li>
</ul>
<p>Las operaciones de una molécula forman un <em>grupo</em>: el producto de dos es otra operación del conjunto, hay identidad y cada una tiene inversa. El número de operaciones es el <em>orden</em> \(h\). La clasificación sigue un diagrama de flujo: (1) ¿es lineal? (\(C_{\infty v}\) sin centro de inversión, \(D_{\infty h}\) con él); (2) ¿tiene varios ejes de orden \(\ge3\)? (grupos cúbicos: \(T_d\), \(O_h\), \(I_h\)); (3) si no, se busca el eje de mayor orden \(n\) y se pregunta por \(n\) ejes \(C_2\) perpendiculares (serie \(D_n\)) y por planos \(\sigma_h\), \(\sigma_v\), \(\sigma_d\) (sufijos \(h\), \(v\), \(d\)). El programa realiza esas pruebas: busca candidatos de ejes y planos (a lo largo de los átomos, de sus puntos medios y de los productos vectoriales de las posiciones), aplica cada operación y comprueba que cada átomo cae sobre otro del mismo elemento.</p>
<div class="sim" data-sim="simetria" data-title="Elementos de simetría y grupo puntual de siete moléculas"></div>
<div class="sim-guide"><ul>
<li>NH₃ (el valor inicial): \(E\), dos rotaciones \(C_3\) (±120° alrededor del eje N→base) y tres planos \(\sigma_v\) (cada uno con el N y un H): grupo \(C_{3v}\), de orden 6. H₂O: \(E\), \(C_2\) y dos planos (el molecular y el perpendicular que lo biseca): \(C_{2v}\), orden 4. Formaldehído, también \(C_{2v}\).</li>
<li>CH₄: 24 operaciones (\(E\), 8 \(C_3\), 3 \(C_2\), 6 \(S_4\), 6 \(\sigma_d\)): \(T_d\). BF₃ plano: \(D_{3h}\) (orden 12), con \(C_3\), tres \(C_2\) (a lo largo de los enlaces B–F), \(\sigma_h\) (el plano molecular), dos \(S_3\) y tres \(\sigma_v\). Eteno: \(D_{2h}\), orden 8, con centro de inversión. CO₂ es lineal con centro: \(D_{\infty h}\) (infinitas operaciones; en el cálculo se usa el subgrupo \(D_{2h}\)).</li>
<li>Las propiedades siguen del grupo: solo tienen momento dipolar permanente los grupos \(C_1\), \(C_s\), \(C_n\) y \(C_{nv}\) (el agua y el amoníaco, sí; el CO₂, el metano y el BF₃, no, porque una operación de simetría llevaría el dipolo a su opuesto). Solo pueden ser quirales (no superponibles con su imagen especular) las moléculas sin plano, sin centro y sin eje impropio \(S_n\): los grupos \(C_n\), \(D_n\), \(T\), \(O\), \(I\). Una molécula con centro de inversión tiene orbitales y vibraciones pares (\(g\)) o impares (\(u\)).</li>
</ul></div>
</section>

<section>
<h2>Representaciones y tablas de caracteres</h2>
<p>Cada operación actúa sobre un conjunto de funciones (orbitales, desplazamientos, vectores) como una matriz. Esas matrices forman una <span class="term">representación</span> del grupo. Una representación <em>irreducible</em> no se puede descomponer en bloques más pequeños; cualquier otra se escribe como suma directa de irreducibles. Lo único que hace falta de cada matriz es su traza, el <em>carácter</em> \(\chi(R)\), que depende solo de la clase de la operación (las que son conjugadas, como las tres reflexiones del NH₃). La <span class="term">tabla de caracteres</span> de un grupo lista \(\chi\) de cada irreducible para cada clase. Las filas cumplen la relación de ortogonalidad \(\sum_Rg_R\chi_i(R)\chi_j(R)=h\,\delta_{ij}\) y \(\sum_i\ell_i^2=h\) (aquí se verifican para las cinco tablas del programa). Los nombres de Mulliken indican la dimensión (\(A,B\) de 1; \(E\) de 2; \(T\) de 3), la simetría respecto del eje principal (\(A\) simétrica, \(B\) antisimétrica) y respecto del centro (\(g,u\)) o del plano \(\sigma_h\) (\(',''\)).</p>
<p>Para reducir una representación reducible \(\Gamma\) se usa la fórmula de la proyección:</p>
<div class="eq key" data-name="Reducción de una representación">\[n_i=\frac1h\sum_R\chi_\Gamma(R)\,\chi_i(R).\]</div>
</section>

<section>
<h2>Modos normales de vibración y reglas de selección</h2>
<p>Una molécula de \(N\) átomos tiene \(3N\) grados de libertad: 3 de traslación, 3 de rotación (2 si es lineal) y \(3N-6\) de vibración (\(3N-5\)). Los desplazamientos cartesianos de los átomos forman una representación \(\Gamma_{3N}\) cuyo carácter, para cada operación, es el número de átomos que <em>no se mueven</em> por el carácter del vector \((x,y,z)\) bajo esa operación (la traza de la matriz de rotación): \(\chi_{3N}(R)=N_\mathrm{fijos}\,\mathrm{tr}\,R\). Restando las traslaciones (que transforman como \(x,y,z\)) y las rotaciones (\(R_x,R_y,R_z\), cuyo carácter es \(\det R\cdot\mathrm{tr}\,R\)):</p>
<div class="eq key" data-name="Representación de las vibraciones">\[\Gamma_\text{vib}=\Gamma_{3N}-\Gamma_\text{trans}-\Gamma_\text{rot}.\]</div>
<p>Cada irreducible de \(\Gamma_\text{vib}\) es un conjunto de modos normales con la misma simetría; las vibraciones degeneradas (\(E\), \(T\)) comparten frecuencia. Una transición vibracional de \(v=0\) a \(v=1\) es observable en el <strong>infrarrojo</strong> si el modo cambia el momento dipolar, es decir, si transforma como \(x\), \(y\) o \(z\); y en <strong>Raman</strong> si cambia la polarizabilidad, o sea, si transforma como un producto cuadrático (\(x^2\), \(xy\),...). En una molécula con centro de inversión, los modos \(g\) son Raman y los \(u\) son infrarrojos, y ninguno es ambos: la <span class="term">regla de exclusión mutua</span>.</p>
<div class="sim" data-sim="vibsim" data-title="Tablas de caracteres y análisis vibracional de siete moléculas"></div>
<div class="sim-guide"><ul>
<li><strong>H₂O</strong> (\(C_{2v}\)): \(\Gamma_{3N}\) tiene caracteres \(9,-1,1,3\); se reduce a \(3A_1+A_2+2B_1+3B_2\); restar \(\Gamma_\text{trans}=A_1+B_1+B_2\) y \(\Gamma_\text{rot}=A_2+B_1+B_2\) da \(\Gamma_\text{vib}=2A_1+B_2\): tres modos (tensión simétrica 3657, flexión 1595, tensión asimétrica 3756 cm⁻¹), todos activos en IR y en Raman.</li>
<li><strong>NH₃</strong> (\(C_{3v}\)): \(2A_1+2E\): seis modos, cuatro frecuencias distintas (3337, 950, 3444, 1627 cm⁻¹), todas activas en IR y Raman. <strong>CH₄</strong> (\(T_d\)): \(A_1+E+2T_2\): nueve modos, cuatro frecuencias, de las que solo las dos \(T_2\) (3019 y 1306 cm⁻¹) son activas en el IR, mientras que las cuatro (\(A_1\): 2917; \(E\): 1534; y las \(T_2\)) lo son en Raman: por eso el metano tiene solo dos bandas infrarrojas fundamentales.</li>
<li><strong>BF₃</strong> (\(D_{3h}\)): \(A_1'+A_2''+2E'\): la \(A_1'\) (tensión simétrica, 888 cm⁻¹) es solo Raman, la \(A_2''\) (flexión fuera del plano, 691) solo IR, y las dos \(E'\) (1446 y 480) en ambos. <strong>CO₂</strong> (\(D_{\infty h}\)): \(\Sigma_g^++\Sigma_u^++\Pi_u\): la tensión simétrica (1388) es solo Raman; la asimétrica (2349) y la flexión doblemente degenerada (667) son solo IR, que es lo que hace del CO₂ un gas de efecto invernadero: absorbe justo por la flexión y la tensión asimétrica.</li>
<li><strong>Eteno</strong> (\(D_{2h}\)): 12 modos, \(3A_g+B_{2g}+2B_{3g}+A_u+2B_{1u}+2B_{2u}+B_{3u}\) (según los ejes elegidos: \(z\) a lo largo del C=C y la molécula en el plano \(yz\)). 5 son activos en IR (\(B_{1u},B_{2u},B_{3u}\)), 6 en Raman (\(A_g,B_{2g},B_{3g}\)) y uno, \(A_u\) (la torsión), es inactivo en ambos: esa es la «banda silenciosa» de las tablas de eteno.</li>
</ul></div>
<div class="box note"><h4>Más allá de la vibración</h4><p>La misma tabla de caracteres decide cuándo dos orbitales se pueden mezclar (solo si son de la misma irreducible), qué estados electrónicos conectan las transiciones (integral \(\langle\psi_f|\hat\mu|\psi_i\rangle\ne0\) solo si \(\Gamma_f\times\Gamma_\mu\times\Gamma_i\) contiene la totalmente simétrica) y qué desdoblamientos produce un campo cristalino, la teoría de los colores de los complejos. Wigner y Mulliken la desarrollaron en los años treinta; hoy los programas de cálculo la usan para reducir el cómputo (aprovechando la simetría) y para clasificar los resultados.</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Asigne el grupo puntual de: (a) cis-1,2-dicloroeteno, (b) trans-1,2-dicloroeteno, (c) el ion carbonato \(\mathrm{CO_3^{2-}}\), (d) el benceno, (e) HCl.
<details><summary>Respuesta</summary><p>(a) \(C_{2v}\) (un \(C_2\) y dos planos); (b) \(C_{2h}\) (\(C_2\) perpendicular al plano, \(\sigma_h\) e \(i\)); (c) \(D_{3h}\); (d) \(D_{6h}\); (e) \(C_{\infty v}\) (lineal sin centro).</p></details></li>
<li><span class="lvl">Básico</span>Decida cuáles de estas moléculas pueden tener momento dipolar permanente: \(\mathrm{H_2O}\), \(\mathrm{CO_2}\), \(\mathrm{NH_3}\), \(\mathrm{CH_4}\), \(\mathrm{BF_3}\), cis-C₂H₂Cl₂, trans-C₂H₂Cl₂.
<details><summary>Respuesta</summary><p>Tienen dipolo las de grupo \(C_n\), \(C_{nv}\), \(C_s\), \(C_1\): \(\mathrm{H_2O}\) (\(C_{2v}\)), \(\mathrm{NH_3}\) (\(C_{3v}\)) y el cis (\(C_{2v}\)). No lo tienen \(\mathrm{CO_2}\) (\(D_{\infty h}\)), \(\mathrm{CH_4}\) (\(T_d\)), \(\mathrm{BF_3}\) (\(D_{3h}\)) ni el trans (\(C_{2h}\), con centro de inversión).</p></details></li>
<li><span class="lvl">Intermedio</span>Con los caracteres \(\chi_{3N}=(9,-1,1,3)\) de \(\mathrm{H_2O}\) para \((E,C_2,\sigma_{xz},\sigma_{yz})\), reduzca \(\Gamma_{3N}\) con la tabla de \(C_{2v}\).
<details><summary>Respuesta</summary><p>\(n(A_1)=\tfrac14(9-1+1+3)=3\); \(n(A_2)=\tfrac14(9-1-1-3)=1\); \(n(B_1)=\tfrac14(9+1+1-3)=2\); \(n(B_2)=\tfrac14(9+1-1+3)=3\). \(\Gamma_{3N}=3A_1+A_2+2B_1+3B_2\), que suman \(3+1+2+3=9\) dimensiones.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Por qué la tensión simétrica del CO₂ no se ve en el infrarrojo y sí en Raman, y cuántas bandas IR fundamentales tiene el CO₂?
<details><summary>Respuesta</summary><p>En la tensión simétrica el dipolo del CO₂ es cero antes y después del desplazamiento (el modo es \(\Sigma_g^+\), par; el momento dipolar transforma como \(\Sigma_u^+\) o \(\Pi_u\)): no cambia, no absorbe IR. Sí cambia la polarizabilidad (el volumen de la molécula cambia): es activo en Raman. Hay 2 bandas IR fundamentales (667 cm⁻¹, que corresponde a dos modos degenerados, y 2349 cm⁻¹).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que, para una molécula con centro de inversión, ningún modo puede ser activo a la vez en IR y en Raman.
<details><summary>Respuesta</summary><p>Los desplazamientos \(x,y,z\) cambian de signo bajo \(i\) (son \(u\)); los productos cuadráticos \(x^2,xy,\dots\) no (son \(g\)). Una vibración activa en IR debe transformar como \(x,y\) o \(z\) y, por tanto, ser \(u\); una activa en Raman debe transformar como un cuadrático y ser \(g\). Ningún modo puede ser a la vez \(g\) y \(u\).</p></details></li>
</ol>
