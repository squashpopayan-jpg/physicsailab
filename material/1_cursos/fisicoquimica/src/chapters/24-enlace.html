<p class="lead">¿Por qué dos átomos de hidrógeno forman H₂ y dos de helio no forman He₂? La respuesta de la mecánica cuántica es que los electrones, al ocupar orbitales que abarcan a toda la molécula, reducen su energía total si esos orbitales concentran carga entre los núcleos. Este capítulo parte de la molécula más simple (H₂⁺), construye los orbitales moleculares como combinaciones de orbitales atómicos y los aplica a las diatómicas del segundo período y a los sistemas \(\pi\) de las moléculas orgánicas, donde el método de Hückel explica la aromaticidad con una matriz de unos y ceros.</p>

<section>
<h2>Born–Oppenheimer y el ion H₂⁺</h2>
<p>Los núcleos pesan miles de veces más que los electrones y se mueven mucho más despacio. Born y Oppenheimer (1927) separaron los dos movimientos: se resuelve la ecuación de Schrödinger de los electrones con los núcleos fijos a una distancia \(R\), y la energía electrónica más la repulsión nuclear, \(E(R)\), es la <span class="term">superficie de energía potencial</span> en la que se mueven los núcleos (la que se usó para las vibraciones y la teoría del estado de transición). El enlace químico es un mínimo de \(E(R)\).</p>
<p>El H₂⁺ (un electrón, dos protones) es el caso más simple y tiene solución exacta en coordenadas esferoidales prolatas (Burrau, 1927; Bates, Ledsham y Stewart, 1953): a \(R=2.00\) bohr, \(E=-0.6026\) Eh, y la energía de disociación es \(D_e=2.79\) eV. La solución exacta no se generaliza, pero el método aproximado sí: el <span class="term">LCAO</span> (combinación lineal de orbitales atómicos). Se propone \(\psi=c_a\phi_a+c_b\phi_b\), con \(\phi_{a,b}\) orbitales 1s centrados en cada protón. El principio variacional del capítulo 23 conduce a la ecuación secular \(\begin{vmatrix}H_{aa}-E&H_{ab}-ES\\H_{ab}-ES&H_{aa}-E\end{vmatrix}=0\), cuyas dos raíces son</p>
<div class="eq key" data-name="LCAO de H₂⁺">\[E_\pm=\frac{H_{aa}\pm H_{ab}}{1\pm S}+\frac1R,\qquad\psi_\pm=\frac{\phi_a\pm\phi_b}{\sqrt{2(1\pm S)}},\quad S=\langle\phi_a|\phi_b\rangle.\]</div>
<p>\(H_{aa}\) (integral de Coulomb) es la energía del electrón en \(\phi_a\) con el otro protón presente; \(H_{ab}\) (integral de resonancia o de intercambio, negativa) es la que da la estabilización; \(S\) es el solapamiento. El orbital con signo \(+\) (\(\sigma_g\)) acumula carga entre los núcleos y es <em>enlazante</em>; el de signo \(-\) (\(\sigma_u^*\)) tiene un plano nodal entre ellos y es <em>antienlazante</em>, y está más desestabilizado de lo que el enlazante se estabiliza (por el factor \(1/(1\pm S)\)). Todas las integrales tienen forma cerrada para orbitales 1s de Slater (Mulliken, Rieke, Orloff y Orloff, 1949); aquí se han verificado contra la cuadratura numérica.</p>
<div class="sim" data-sim="h2plus" data-title="H₂⁺ con LCAO: curvas de energía potencial y orbitales moleculares"></div>
<div class="sim-guide"><ul>
<li>Con orbitales 1s de exponente \(\zeta=1\) (los del átomo de hidrógeno), la curva de \(\sigma_g\) tiene un mínimo en \(R_e=2.49\) bohr con \(E=-0.5648\) Eh: \(D_e=1.76\) eV, el 63 % del valor exacto (2.79 eV), con distancia 25 % demasiado larga. La curva de \(\sigma_u^*\) es repulsiva en todo el intervalo. A \(R=2\) bohr: \(S=0.586\), \(E_g=-0.5538\) y \(E_u=-0.1609\) Eh.</li>
<li>Active la optimización de \(\zeta\): los orbitales se contraen en la molécula (\(\zeta=1.238\) en el mínimo), \(R_e=2.00\) bohr, \(E=-0.5865\) Eh, \(D_e=2.35\) eV (84 % del exacto). Es el resultado de Finkelstein y Horowitz (1928), y el punto exacto (marcado) queda debajo de la curva, como exige el principio variacional.</li>
<li>El panel derecho muestra \(\psi_g\) y \(\psi_u\) a lo largo del eje: la primera no tiene nodos y es grande entre los núcleos; la segunda se anula en el punto medio. Ensanche \(R\) y el solapamiento cae: la energía de \(\sigma_g\) tiende a \(-0.5\) Eh (H + H⁺).</li>
</ul></div>
<div class="box note"><h4>Enlace de valencia frente a orbitales moleculares</h4><p>Heitler y London (1927) resolvieron el H₂ de otra manera: función de onda de producto \(\phi_a(1)\phi_b(2)+\phi_b(1)\phi_a(2)\), un par de electrones compartido, el «enlace de valencia» de Lewis y Pauling. Obtuvieron \(D_e=3.14\) eV (experimento: 4.75 eV), el primer cálculo cuántico de un enlace. Los orbitales moleculares (Hund, Mulliken, Lennard-Jones) ponen los dos electrones en \(\sigma_g\) y mejoran con la base, pero no disocian bien (capítulo 25). Las dos teorías, completadas con la correlación, dan el mismo resultado exacto; el método de orbitales moleculares es el que se programa.</p></div>
</section>

<section>
<h2>Diatómicas homonucleares del segundo período</h2>
<p>Con orbitales 2s y 2p de cada átomo se forman diez orbitales moleculares: \(\sigma_{2s}\), \(\sigma^*_{2s}\), \(\sigma_{2p}\), dos \(\pi_{2p}\) degenerados, dos \(\pi^*_{2p}\) y \(\sigma^*_{2p}\). Se llenan con los electrones de valencia de menor a mayor energía (Aufbau), con las reglas de Pauli y de Hund. El orden de los niveles cambia en el medio del período: para Li₂–N₂, el \(\pi_{2p}\) está por debajo de \(\sigma_{2p}\) (la mezcla de \(2s\) y \(2p\) sube \(\sigma_{2p}\)); para O₂ y F₂ la separación \(2s\)–\(2p\) es mayor y \(\sigma_{2p}\) cae por debajo. La cuenta de electrones da</p>
<div class="eq key" data-name="Orden de enlace">\[b=\tfrac12\bigl(n_\text{enlazantes}-n_\text{antienlazantes}\bigr),\qquad\text{electrones desapareados}\Rightarrow\text{paramagnetismo}.\]</div>
<div class="sim" data-sim="diatomicas" data-title="Diagrama de orbitales moleculares de las diatómicas del segundo período y orden de enlace"></div>
<div class="sim-guide"><ul>
<li>N₂ (10 electrones): orden de enlace 3, diamagnética, la molécula más fuerte de la serie (\(D_0=9.76\) eV, \(r_e=1.098\) Å); explica la inercia del nitrógeno atmosférico. C₂ (8): orden 2, diamagnética (6.2 eV, 1.243 Å) con dos enlaces \(\pi\) y ninguno \(\sigma\) completo, un hecho que la regla de Lewis no predice.</li>
<li>O₂ (12 electrones): orden 2 y <em>dos electrones desapareados</em> en los \(\pi^*_{2p}\): es paramagnética (el oxígeno líquido es atraído por un imán), el éxito más famoso de la teoría de orbitales moleculares, que la estructura de Lewis \(\mathrm{O{=}O}\) no explica. B₂ (6 electrones): orden 1 y también paramagnética, por los \(\pi_{2p}\) semillenos.</li>
<li>F₂ (14): orden 1, \(D_0=1.60\) eV, un enlace débil por la repulsión de los pares libres. Li₂ (2): orden 1, 1.05 eV. Mueva el control a 11 (O₂⁺, orden 2.5, enlace más corto), a 13 (O₂⁻, el superóxido, orden 1.5) o a 4 (Be₂, orden cero: no es una molécula estable). El gráfico derecho une el orden de enlace con \(D_0\); no es lineal, pero es monótono entre N₂, C₂ y las de orden 1.</li>
</ul></div>
</section>

<section>
<h2>Teoría de Hückel de los sistemas π</h2>
<p>Hückel (1931) trató por separado los electrones \(\pi\) de una molécula plana conjugada, con tres simplificaciones: un orbital \(2p_z\) por átomo de C; \(H_{rr}=\alpha\) para todos; \(H_{rs}=\beta\) si los átomos \(r,s\) están enlazados y cero en otro caso; y \(S_{rs}=\delta_{rs}\). Entonces la ecuación secular es la de la matriz de adyacencia del grafo molecular:</p>
<div class="eq key" data-name="Teoría de Hückel">\[E_i=\alpha+x_i\beta,\quad x_i=\text{valores propios de la matriz de adyacencia}\ \mathsf A;\qquad E_\pi=n\alpha+\Bigl(\sum_in_ix_i\Bigr)\beta,\ \beta<0.\]</div>
<p>Los orbitales de energía más baja son los de mayor \(x\). Para una cadena de \(N\) átomos, \(x_k=2\cos[k\pi/(N+1)]\); para un anillo, \(x_k=2\cos(2\pi k/N)\). Las propiedades se calculan con los coeficientes \(c_{ri}\): la carga \(\pi\) del átomo \(r\) es \(q_r=\sum_in_ic_{ri}^2\) y el <em>orden de enlace de Coulson</em> es \(p_{rs}=\sum_in_ic_{ri}c_{si}\). La <span class="term">energía de deslocalización</span> es la diferencia entre \(E_\pi\) y la de los enlaces dobles localizados (\(2\beta\) por cada uno).</p>
<div class="sim" data-sim="huckel" data-title="Hückel: niveles π, ocupación, HOMO, órdenes de enlace y brecha HOMO–LUMO"></div>
<div class="sim-guide"><ul>
<li><strong>Benceno</strong>: \(x=2,1,1,-1,-1,-2\); los tres orbitales ocupados dan \(E_\pi=6\alpha+8\beta\); tres enlaces dobles aislados darían \(6\beta\), y la diferencia, \(2\beta\), es la energía de resonancia: la <em>aromaticidad</em>. Todos los enlaces C–C tienen orden 0.667 (iguales, como en la experiencia: 1.397 Å). Con \(|\beta|\approx3\) eV el modelo da 6 eV, el doble del valor termoquímico (unos 1.5 eV): la \(\beta\) de Hückel no es una constante transferible entre propiedades.</li>
<li><strong>Butadieno</strong>: \(x=1.618,0.618,-0.618,-1.618\), \(E_\pi=4\alpha+4.472\beta\) y deslocalización \(0.472\beta\) (menor que la del benceno). Con 4 electrones, el orden del enlace central (1–2: 0.894; 2–3: 0.447) muestra que el enlace «simple» central tiene carácter parcial doble. La brecha HOMO–LUMO es \(1.236|\beta|\): disminuye al crecer la cadena (hexatrieno \(0.890|\beta|\), octatetraeno \(0.70|\beta|\)), y por eso los polienos absorben a mayor longitud de onda cuanto más largos (217, 258, 290 nm), el caso del color del caroteno. Con un único \(|\beta|\) el modelo exagera la longitud de onda; se calibra \(\beta\) con cada familia.</li>
<li><strong>Ciclobutadieno</strong>: tiene dos orbitales degenerados no ligantes (\(x=0\)) con dos electrones: capa abierta, sin energía de deslocalización (la regla de \(4n\) electrones, antiaromaticidad). <strong>Naftaleno</strong>: \(E_\pi=10\alpha+13.683\beta\) y órdenes de enlace 0.725 (C1–C2), 0.603 (C2–C3) y 0.555 (enlace central), coherentes con las longitudes medidas (1.37, 1.42 y 1.42 Å). Añada o quite electrones del benceno (+2 → dianión): el sistema pierde la capa cerrada. La regla de Hückel: son aromáticos los anillos con \(4n+2\) electrones \(\pi\) (benceno 6, ciclopentadienilo anión 6, tropilio 6).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Obtenga el orden de enlace y el magnetismo de \(\mathrm{N_2^+}\) (9 electrones de valencia) y de \(\mathrm{O_2^-}\) (13). ¿Qué ion tiene el enlace más corto, \(\mathrm{N_2^+}\) o \(\mathrm{N_2}\)?
<details><summary>Respuesta</summary><p>\(\mathrm{N_2^+}\) (9 electrones): \(\sigma_{2s}^2\,\sigma_{2s}^{*2}\,\pi_{2p}^4\,\sigma_{2p}^1\), con 7 enlazantes y 2 antienlazantes: \(b=2.5\), un electrón desapareado (paramagnético). \(\mathrm{O_2^-}\): 13 electrones, \(b=(8-5)/2=1.5\), un electrón desapareado. \(\mathrm{N_2}\) (\(b=3\)) tiene el enlace más corto (1.098 Å frente a 1.116 Å de \(\mathrm{N_2^+}\)).</p></details></li>
<li><span class="lvl">Básico</span>Calcule la energía \(\pi\) del alilo (\(x=\sqrt2,0,-\sqrt2\)) como catión, radical y anión, y la energía de deslocalización.
<details><summary>Respuesta</summary><p>Catión (2 electrones): \(E_\pi=2\sqrt2\beta=2.83\beta\); radical (3): \(2.83\beta+0\); anión (4): \(2.83\beta\). Con 2 electrones en el alilo y un doble enlace localizado (\(2\beta\)): deslocalización \(0.83\beta\). El orbital no ligante (\(x=0\)) no aporta energía: la estabilidad del catión, el radical y el anión es la misma en Hückel.</p></details></li>
<li><span class="lvl">Intermedio</span>Con \(|\beta|=2.4\) eV, calcule la longitud de onda de la transición HOMO→LUMO del butadieno y compárela con 217 nm.
<details><summary>Respuesta</summary><p>\(\Delta E=1.236(2.4)=2.97\) eV, \(\lambda=1239.84/2.97=418\) nm, frente a 217 nm (5.7 eV): el modelo sub-estima la energía por un factor 2; con \(|\beta|=4.6\) eV el acuerdo es exacto, lo que muestra que \(\beta\) es un parámetro empírico.</p></details></li>
<li><span class="lvl">Intermedio</span>Para el H₂⁺ con \(\zeta=1\) a \(R=2\) bohr, \(S=0.586\), \(H_{aa}=-0.9725\), \(H_{ab}=-0.6992\) Eh. Calcule \(E_g\) y \(E_u\).
<details><summary>Respuesta</summary><p>\(E_g=(H_{aa}+H_{ab})/(1+S)+1/R=(-1.6717)/1.586+0.5=-0.5538\) Eh. \(E_u=(H_{aa}-H_{ab})/(1-S)+0.5=(-0.2733)/0.414+0.5=-0.1609\) Eh. El orbital antienlazante sube 0.34 Eh sobre el límite (H + H⁺), el enlazante baja 0.054 Eh.</p></details></li>
<li><span class="lvl">Avanzado</span>Para un anillo de \(N\) átomos, demuestre que \(x_k=2\cos(2\pi k/N)\) y que la energía \(\pi\) de \(N=4n+2\) electrones es la más estable.
<details><summary>Respuesta</summary><p>Con simetría de traslación, \(c_r=e^{2\pi ikr/N}/\sqrt N\) y \((\mathsf Ac)_r=c_{r+1}+c_{r-1}=2\cos(2\pi k/N)c_r\). Los niveles son no degenerados para \(k=0\) y degenerados por pares (\(\pm k\)) para \(k\ne0\) (y \(N/2\), si \(N\) es par, único). Con \(4n+2\) electrones se llenan \(k=0\) y cada par \(\pm k\) hasta \(|k|=n\): capa cerrada. Con \(4n\), el último par degenerado queda semillenado (capa abierta, antiaromático).</p></details></li>
</ol>
