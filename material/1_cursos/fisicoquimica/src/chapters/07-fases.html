<p class="lead">Hielo, agua y vapor son la misma sustancia en tres fases, y un diagrama de fases es el mapa que dice cuál es la estable a cada temperatura y presión. En el capítulo 1 se vio que el criterio es la igualdad del potencial químico; aquí se lee ese criterio en forma de curvas. Esos mapas explican por qué el hielo seco no se derrite, por qué la olla a presión cuece más rápido y por qué en Popayán el agua hierve a 94 °C.</p>

<section>
<h2>La regla de las fases</h2>
<p>En un sistema de \(C\) componentes con \(P\) fases en equilibrio, ¿cuántas variables intensivas pueden fijarse libremente? Las variables son \(T\), \(P\) y las \(C-1\) fracciones molares independientes de cada fase: \(2+P(C-1)\). Las condiciones de equilibrio son que el potencial químico de cada componente sea el mismo en todas las fases: \(C(P-1)\) ecuaciones. Los <span class="term">grados de libertad</span> son la diferencia:</p>
<div class="eq key" data-name="Regla de las fases de Gibbs">\[F=C-P+2.\]</div>
<p>Para una sustancia pura (\(C=1\)): con una fase, \(F=2\) (se pueden elegir \(T\) y \(P\) libremente: un área del diagrama); con dos fases, \(F=1\) (solo una variable libre: una curva, \(P\) queda fijada por \(T\)); con tres fases, \(F=0\) (un punto: el <em>punto triple</em>, una sola \(T\) y una sola \(P\)). Es la razón por la cual el punto triple del agua, 273.16 K y 611.66 Pa, sirvió para definir el kelvin hasta 2019.</p>
</section>

<section>
<h2>El diagrama de fases P–T</h2>
<p>En el diagrama \(P\)–\(T\) de una sustancia pura aparecen tres curvas: la de <em>vaporización</em> (líquido–gas), que termina en el <span class="term">punto crítico</span>; la de <em>fusión</em> (sólido–líquido); y la de <em>sublimación</em> (sólido–gas). Se cortan en el punto triple. Más allá del punto crítico no hay diferencia entre líquido y gas: el <span class="term">fluido supercrítico</span> tiene densidad parecida a la de un líquido y viscosidad y difusividad de un gas, y es un excelente disolvente. El CO₂ supercrítico (\(T_c=304.13\) K, \(P_c=7.377\) MPa) se usa para descafeinar el café y extraer aromas porque se alcanza con condiciones suaves y se elimina sin residuos al despresurizar.</p>
<p>Dos rarezas que se leen en el diagrama. La primera, el CO₂ no tiene fase líquida a 1 atm: su presión triple, 5.18 bar, está por encima de la atmosférica, y por eso el hielo seco <em>sublima</em> a 194.7 K (−78.5 °C). La segunda, la línea de fusión del agua tiene pendiente <em>negativa</em>: el hielo es menos denso que el agua líquida, y comprimirlo lo funde.</p>
<div class="sim" data-sim="fases-pt" data-title="Diagramas de fases P–T del agua y del dióxido de carbono"></div>
<div class="sim-guide"><ul>
<li>Ponga el agua a 298 K y 101 325 Pa: líquido. Suba \(T\) a 400 K: gas. Baje la presión a 100 Pa con 270 K: el hielo sublima, porque no hay líquido por debajo de 611.66 Pa.</li>
<li>Con el CO₂ a 250 K, 1 atm: gas. Suba la presión a 3 MPa: líquido. A 1 atm, entre 216.6 K y 194.7 K no hay líquido: el sólido pasa directo a gas.</li>
<li>Rodee el punto crítico del CO₂ (304 K, 7.38 MPa): se puede pasar de gas a «líquido» sin cruzar la curva de vaporización, es decir, sin transición de fase, por el camino supercrítico.</li>
<li>Coloque el punto sobre una curva (por ejemplo \(T=373.12\) K y \(P=101\,325\) Pa para el agua): aparece \(F=1\). En el punto triple, \(F=0\).</li>
<li>La curva de fusión del agua es casi vertical y se inclina hacia la izquierda: a 100 MPa funde a 264 K, y a unos 210 MPa llega a su mínimo, cerca de 251 K (punto triple hielo Ih–hielo III–líquido); más allá aparecen otros hielos (III, V, VI), más densos que el agua, y la pendiente cambia de signo.</li>
</ul></div>
</section>

<section>
<h2>La ecuación de Clapeyron</h2>
<p>A lo largo de una curva de coexistencia \(\mu^\alpha(T,P)=\mu^\beta(T,P)\), de modo que \(\dd\mu^\alpha=\dd\mu^\beta\). Como \(\dd\mu=-S_m\,\dd T+V_m\,\dd P\), se obtiene</p>
<div class="eq key" data-name="Ecuación de Clapeyron">\[\frac{\dd P}{\dd T}=\frac{\Delta S_m}{\Delta V_m}=\frac{\Delta H_m}{T\,\Delta V_m}.\]</div>
<p>Es una relación exacta entre una propiedad del diagrama (la pendiente de la curva) y dos magnitudes calorimétricas medibles (\(\Delta H\) y \(\Delta V\) del cambio de fase). En la fusión del agua, \(\Delta H=6.01\) kJ/mol y \(\Delta V=-1.63\) cm³/mol dan \(\dd P/\dd T=-13.5\) MPa/K, es decir, un descenso de 0.0074 K por bar. En la vaporización, \(\Delta V\approx V_{gas}\gg V_{liq}\); si el gas es ideal, \(V_{gas}=RT/P\) y resulta la ecuación de Clausius–Clapeyron:</p>
<div class="eq key" data-name="Clausius–Clapeyron">\[\frac{\dd\ln P}{\dd T}=\frac{\Delta_{vap}H}{RT^2},\qquad\ln\frac{P_2}{P_1}=-\frac{\Delta_{vap}H}{R}\left(\frac1{T_2}-\frac1{T_1}\right).\]</div>
<p>Una gráfica de \(\ln P\) frente a \(1/T\) es casi recta, con pendiente \(-\Delta H/R\) (compárese con van't Hoff, capítulo 5: es la misma estructura). La aproximación falla cerca del punto crítico, donde \(\Delta V\) no se parece a \(RT/P\).</p>
<div class="sim" data-sim="clapeyron" data-title="Clapeyron y Clausius–Clapeyron sobre curvas de equilibrio reales"></div>
<div class="sim-guide"><ul>
<li>Vaporización del agua: la pendiente exacta de la curva coincide con \(\Delta H/(T\Delta V)\) calculada con las tablas de IAPWS-95 (por ejemplo, 3.6 kPa/K a 373 K), y la entalpía aparente de Clausius–Clapeyron es 41.3 kJ/mol frente a 40.65 kJ/mol del calor latente a 373 K (1.6 %), y la diferencia crece con la temperatura (39.9 frente a 38.3 kJ/mol a 420 K): el vapor no es ideal y el volumen del líquido no es cero.</li>
<li>Fusión del agua: la pendiente es −13.5 MPa/K según Clapeyron y −13.1 MPa/K en la curva real (3 % de diferencia, por tomar ΔH y ΔV constantes). Con la presión de un patinador (unos 1–10 MPa) el punto de fusión solo baja entre 0.07 y 0.7 K: la lubricación del hielo la explican hoy otros mecanismos, como el calentamiento por fricción y una capa superficial de agua casi líquida.</li>
<li>CO₂: la sublimación (25.2 kJ/mol de referencia; 25.8 kJ/mol aparentes en la simulación) tiene en el diagrama de Clausius–Clapeyron una pendiente mucho más fuerte que su vaporización (16.6 kJ/mol aparentes a 233 K, que bajan a cero en el punto crítico).</li>
</ul></div>
<div class="box ex"><h4>El punto de ebullición en Popayán</h4>
<p>A 1760 m la presión atmosférica estándar es 81.9 kPa. Estime la temperatura de ebullición del agua con \(\Delta_{vap}H=40.66\) kJ/mol y compare con las tablas.</p>
<details><summary>Solución</summary><p>\(\dfrac1{T_2}=\dfrac1{373.15}-\dfrac R{\Delta H}\ln\dfrac{81.9}{101.325}=2.6799\times10^{-3}+4.35\times10^{-5}=2.7234\times10^{-3}\ \mathrm{K^{-1}}\), de modo que \(T_2=367.2\) K = 94.1 °C. Las tablas de IAPWS-95 dan 94.12 °C: coinciden.</p></details>
</div>
</section>

<section>
<h2>Isotermas y el punto crítico</h2>
<p>Una ecuación de estado cúbica como la de Peng–Robinson describe a la vez la fase líquida y la gaseosa. Por debajo de \(T_c\), la isoterma \(P(V_m)\) tiene una región con pendiente positiva, inestable, y se reemplaza por la <em>construcción de Maxwell</em>: la horizontal a la presión de saturación, donde las áreas por encima y por debajo de la horizontal se compensan (igualdad de energías de Gibbs). A \(T_c\) la horizontal se reduce a un punto de inflexión de pendiente nula, \((\partial P/\partial V)_T=(\partial^2P/\partial V^2)_T=0\); por encima, las isotermas son monótonas.</p>
<div class="sim" data-sim="isotermas-co2" data-title="Isotermas del CO₂ con Peng–Robinson y la presión de saturación"></div>
<div class="sim-guide"><ul>
<li>A 280 K el CO₂ tiene una presión de saturación de 4.160 MPa con Peng–Robinson y 4.161 MPa en la ecuación de referencia: entre 220 y 300 K la diferencia máxima es de 0.9 %, porque el factor acéntrico se define a partir de la presión de vapor.</li>
<li>La horizontal punteada une el líquido saturado (volumen pequeño) y el vapor saturado: la mezcla de las dos fases ocupa un volumen intermedio y se reparte con la regla de la palanca.</li>
<li>Suba \(T\) hacia 304.1 K: el tramo horizontal se acorta hasta desaparecer. Con 320 K ya no hay saturación y el fluido es supercrítico.</li>
<li>Peng–Robinson ubica el punto crítico en \(V_m=0.3074\,RT_c/P_c=105\) cm³/mol, mientras que el valor experimental es 94.1 cm³/mol (12 % más): los parámetros de la ecuación se fijan para reproducir \(T_c\) y \(P_c\), pero el volumen crítico no se ajusta (\(Z_c\) experimental 0.274 frente a 0.307 de Peng–Robinson), defecto común a todas las ecuaciones cúbicas.</li>
</ul></div>
</section>

<section>
<h2>Cocinar a gran altura y a presión</h2>
<p>La temperatura de ebullición es la que iguala la presión de vapor a la presión externa. Al subir en altitud, la presión atmosférica baja con la fórmula barométrica de la atmósfera estándar, \(P=P_0(1-2.2558\times10^{-5}h)^{5.2559}\), y el agua hierve a menos temperatura. La velocidad de cocción de los alimentos aumenta como \(e^{-E_a/RT}\) (ley de Arrhenius, capítulo 17), con energías de activación del orden de 60–120 kJ/mol para la gelatinización del almidón y la desnaturalización de proteínas.</p>
<div class="sim" data-sim="ebullicion-altitud" data-title="Temperatura de ebullición del agua frente a la altitud y la olla a presión"></div>
<div class="sim-guide"><ul>
<li>En Popayán (1760 m) el agua hierve a 94.1 °C; en Bogotá (2640 m), a 91.2 °C; en La Paz (3640 m), a 87.8 °C; en la cima del Everest, a 70.2 °C. Con \(E_a=80\) kJ/mol, cocinar en Popayán toma 1.5 veces el tiempo que a nivel del mar, y en Bogotá 1.9 veces.</li>
<li>Una olla a presión con 100 kPa manométricos en Popayán lleva el agua a 117 °C: cuece 3.1 veces más rápido que una olla abierta a nivel del mar y 4.7 veces más rápido que una olla abierta en Popayán (con \(E_a=80\) kJ/mol).</li>
<li>Con \(E_a\) bajo (40 kJ/mol), el efecto de la altitud es menos marcado (1.23 veces en Popayán): lo que más se alarga a gran altura son los procesos de energía de activación grande, como cocer legumbres duras.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Cuántos grados de libertad tiene una mezcla de agua líquida y vapor en un recipiente cerrado? ¿Y hielo, agua y vapor?
<details><summary>Respuesta</summary><p>\(C=1\); con dos fases \(F=1-2+2=1\); con tres, \(F=0\): el punto triple.</p></details></li>
<li><span class="lvl">Básico</span>Con \(\Delta_{vap}H=40.66\) kJ/mol, ¿a qué temperatura hierve el agua en La Paz, con 64.6 kPa?
<details><summary>Respuesta</summary><p>\(1/T=2.6799\times10^{-3}-(8.3145/40\,660)\ln(0.6375)=2.6799\times10^{-3}+9.20\times10^{-5}=2.7719\times10^{-3}\), \(T=360.8\) K = 87.6 °C (tablas: 87.8 °C).</p></details></li>
<li><span class="lvl">Intermedio</span>Con \(\Delta_{fus}H=6.01\) kJ/mol, \(\rho_{hielo}=0.917\) g/cm³ y \(\rho_{agua}=0.9998\) g/cm³, calcule \(\dd T/\dd P\) del punto de fusión a 273.15 K.
<details><summary>Respuesta</summary><p>\(V_{hielo}=19.65\) cm³/mol y \(V_{agua}=18.02\) cm³/mol: \(\Delta V=-1.63\) cm³/mol. \(\dd T/\dd P=T\Delta V/\Delta H=273.15(-1.63\times10^{-6})/6010=-7.4\times10^{-8}\) K/Pa = −0.0074 K/bar.</p></details></li>
<li><span class="lvl">Intermedio</span>La presión de vapor del CO₂ sólido es 101.3 kPa a 194.7 K y 517.8 kPa a 216.6 K. Estime la entalpía de sublimación.
<details><summary>Respuesta</summary><p>\(\Delta H=R\ln(517.8/101.3)/(1/194.7-1/216.6)=8.3145(1.6317)/(5.193\times10^{-4})=26.1\) kJ/mol (valor real: 25.2).</p></details></li>
<li><span class="lvl">Avanzado</span>Una sustancia sigue \(\ln(P/\mathrm{Pa})=A-B/T\) en su vaporización. Demuestre que \(\Delta_{vap}H\) es constante e igual a \(RB\) bajo las suposiciones de Clausius–Clapeyron.
<details><summary>Respuesta</summary><p>\(\dd\ln P/\dd T=B/T^2\). Igualando con \(\Delta H/RT^2\): \(\Delta H=RB\). Las tablas reales de ebullición muestran que \(\Delta H_{aparente}\) disminuye al subir la temperatura y se anula en el punto crítico.</p></details></li>
</ol>
