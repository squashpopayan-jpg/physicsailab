<template class="chapter-src" data-id="rotvib" data-num="27" data-title="Espectros de rotación y vibración" data-part="Parte V · Estructura cuántica y espectroscopía" data-short="Rotor rígido y no rígido, espectros de microondas, banda fundamental de vibración–rotación con ramas P y R, constantes espectroscópicas, isótopos, espectro Raman rotacional, estadística de espín nuclear (orto y para) y efecto isotópico cinético por energía de punto cero">
<p class="lead">Las moléculas absorben luz de microondas haciéndolas girar y de infrarrojo haciéndolas vibrar. Los espectros resultantes son tan nítidos que de un puñado de líneas se sacan distancias de enlace con milésimas de ángstrom, constantes de fuerza, composición isotópica y hasta el espín de los núcleos. Este capítulo toma los modelos del capítulo 22 (rotor y oscilador de Morse), los combina y los confronta con las líneas reales del HCl y del CO, que se calculan aquí con las constantes espectroscópicas publicadas.</p>

<section>
<h2>Niveles de energía de una diatómica</h2>
<p>Con el acoplamiento entre ambos movimientos, la energía (en cm⁻¹) de un nivel \((v,J)\) es el desarrollo de Dunham:</p>
<div class="eq key" data-name="Niveles de vibración–rotación">\[\frac{E(v,J)}{hc}=\omega_e\!\left(v+\tfrac12\right)-\omega_ex_e\!\left(v+\tfrac12\right)^2+\omega_ey_e\!\left(v+\tfrac12\right)^3+B_vJ(J+1)-D_vJ^2(J+1)^2,\quad B_v=B_e-\alpha_e\!\left(v+\tfrac12\right).\]</div>
<p>El primer grupo de términos es la vibración anarmónica (capítulo 22). \(B_v\) es la constante rotacional promediada sobre el nivel vibracional \(v\): como el potencial es asimétrico, el enlace se alarga al excitarse y \(\langle r^{-2}\rangle\) disminuye, así que \(B_v\) <em>decrece</em> con \(v\) (\(\alpha_e>0\)). El último término es la <em>distorsión centrífuga</em> (la molécula gira como un resorte que se estira, \(D\approx4B^3/\omega^2\), de orden \(10^{-3}\) \(B\)). Para el oscilador de Morse hay una expresión cerrada de Pekeris (1934), \(\alpha_e=\bigl(6\sqrt{\omega_ex_eB_e^3}-6B_e^2\bigr)/\omega_e\): para el HCl da 0.278 cm⁻¹, y la diagonalización numérica del hamiltoniano de Morse con el término \(J(J+1)/2\mu r^2\) da 0.280; el valor medido, 0.307, difiere un 10 % por las limitaciones de la forma de Morse.</p>
<p>Las reglas de selección del infrarrojo para una diatómica heteronuclear son \(\Delta v=\pm1\) (fundamental; \(\Delta v=\pm2,\pm3\) de los sobretonos, débiles, por la anarmonicidad) y \(\Delta J=\pm1\): la rama \(R\) (\(J\to J+1\), a número de onda mayor que \(\nu_0\)) y la rama \(P\) (\(J\to J-1\), a menor). No hay línea \(\Delta J=0\) (rama \(Q\)) en los casos sin momento angular electrónico: queda un hueco en el centro de la banda, de ancho \(\approx4B\). El NO, con un electrón desapareado en un orbital \(\pi\), sí tiene rama \(Q\). La posición de las líneas es</p>
<div class="eq key" data-name="Líneas de la banda fundamental">\[\tilde\nu_R(J)=\tilde\nu_0+(B_1+B_0)(J+1)+(B_1-B_0)(J+1)^2,\quad\tilde\nu_P(J)=\tilde\nu_0-(B_1+B_0)J+(B_1-B_0)J^2.\]</div>
<p>Al ser \(B_1<B_0\), las líneas \(R\) se acercan al aumentar \(J\) y las \(P\) se separan. La intensidad sigue la población de Boltzmann del nivel inferior (con degeneración \(2J+1\)) y el factor de Hönl–London: \(I_R\propto(J+1)e^{-E_J/kT}\), \(I_P\propto Je^{-E_J/kT}\). De dos ramas se obtiene el valor de \(B\) sin conocer \(\nu_0\) por las <span class="term">diferencias de combinación</span>: \(R(J-1)-P(J+1)=4B_0(J+\tfrac12)\) (\(B_0\), del nivel inferior) y \(R(J)-P(J)=4B_1(J+\tfrac12)\) (\(B_1\), del superior), que no dependen de la anarmonicidad.</p>
<div class="sim" data-sim="rovib" data-title="Banda fundamental de vibración–rotación de HCl, CO, HF y NO con isótopos y temperatura"></div>
<div class="sim-guide"><ul>
<li><strong>HCl</strong> a 298 K (\(\omega_e=2990.95\), \(\omega_ex_e=52.82\), \(\omega_ey_e=0.224\), \(B_e=10.593\), \(\alpha_e=0.307\) cm⁻¹): \(\tilde\nu_0=2886.04\) cm⁻¹ (medido: 2885.98), \(R(0)=2906.30\) (2906.25) y \(P(1)=2865.16\) (2865.10); el hueco central es de 41.1 cm⁻¹. La intensidad máxima está en \(J=2\) (rama \(R\)). Con \(B_0=10.440\) y \(B_1=10.133\) cm⁻¹, \(r_0=\sqrt{h/8\pi^2c\mu B_0}=1.284\) Å (la distancia de equilibrio \(r_e\) es 1.275).</li>
<li>La casilla de isótopos muestra cada línea del HCl duplicada: el \(\mathrm{H^{37}Cl}\) (24.2 %) tiene mayor masa reducida (0.98108 frente a 0.97959 u) y su banda está 2.1 cm⁻¹ por debajo (2883.2 frente a 2886.0), con \(\omega\propto\mu^{-1/2}\), \(B\propto\mu^{-1}\). Con la anchura inicial (0.3 cm⁻¹) los dobletes se resuelven bien; al ensanchar la línea hasta 2–4 cm⁻¹ (un espectrómetro de baja resolución) se funden en una sola banda. El deuterio produce un corrimiento mucho mayor: el DCl está en 2091 cm⁻¹ (el cociente \(\sqrt{\mu_\mathrm{HCl}/\mu_\mathrm{DCl}}=0.717\)).</li>
<li><strong>CO</strong>: \(\tilde\nu_0=2143.27\), \(R(0)=2147.08\), \(P(1)=2139.43\), \(R(5)=2165.60\), \(P(5)=2123.70\) cm⁻¹ (coinciden con HITRAN hasta unas centésimas); \(B_0=1.9225\) cm⁻¹ y \(r_0=1.131\) Å, con una máxima intensidad en \(J=7\) a 298 K. Suba la temperatura a 1000 K: el máximo se desplaza a \(J\approx13\) y la banda se ensancha como \(\sqrt T\); bajándola a 50 K, solo quedan unas pocas líneas con \(J\le4\).</li>
<li>Las cantidades derivadas son las que se miden: de \(B_0\) y \(\mu\) sale \(r_0\); de \(\omega_e\) y \(\mu\), la constante de fuerza \(k=4\pi^2c^2\mu\omega_e^2\) (516 N/m para HCl, 1902 N/m para CO, un enlace triple); de la diferencia entre \(\omega_e\) y la frecuencia fundamental, \(\omega_ex_e\), la energía de disociación aproximada \(D_e\approx\omega_e^2/4\omega_ex_e\).</li>
</ul></div>
</section>

<section>
<h2>Raman rotacional y espín nuclear</h2>
<p>Las diatómicas homonucleares (\(\mathrm{H_2}\), \(\mathrm{N_2}\), \(\mathrm{O_2}\)) no tienen momento dipolar, ni siquiera durante la rotación: no hay espectro de microondas ni de infrarrojo. Sí cambia la polarizabilidad al girar, de modo que tienen espectro <em>Raman rotacional</em> con la regla \(\Delta J=\pm2\). Las líneas de Stokes (rama \(S\), \(J\to J+2\)) están en \(\Delta\tilde\nu=B(4J+6)\): una serie con separación \(4B\) y primer valor \(6B\). Pero la intensidad de las líneas no es una curva suave de Boltzmann: <em>alterna</em>, y esa alternancia mostró el espín de los núcleos.</p>
<p>El principio de Pauli generalizado dice que la función de onda total debe ser simétrica ante el intercambio de dos núcleos idénticos si son bosones (espín entero) y antisimétrica si son fermiones (semientero). La parte rotacional de un estado \(\Sigma_g^+\) es simétrica para \(J\) par y antisimétrica para \(J\) impar; la parte de espín nuclear, de dos núcleos de espín \(I\), tiene \((I+1)(2I+1)\) estados simétricos e \(I(2I+1)\) antisimétricos. Por tanto, cada nivel rotacional recibe un peso estadístico de espín:</p>
<div class="eq key" data-name="Estadística de espín nuclear (homonucleares con estado electrónico Σg⁺)">\[g_J=\begin{cases}(I+1)(2I+1)\ (J\text{ par}),\ I(2I+1)\ (J\text{ impar})&\text{bosones}\\ I(2I+1)\ (J\text{ par}),\ (I+1)(2I+1)\ (J\text{ impar})&\text{fermiones}\end{cases}\]</div>
<div class="sim" data-sim="raman-rot" data-title="Espectro Raman rotacional con la alternancia de intensidades del espín nuclear"></div>
<div class="sim-guide"><ul>
<li>N₂ (¹⁴N, \(I=1\), bosón): pesos \(6:3=2:1\) entre \(J\) par e impar: las líneas del Raman rotacional alternan en intensidad 2:1. Las líneas están en 11.94 cm⁻¹ (\(S(0)=6B\)), 19.9, 27.9... con separación \(4B=7.96\) cm⁻¹. Esta alternancia, observada por Rasetti (1929) en N₂, demostró que el núcleo \({}^{14}\mathrm N\) es un bosón, lo que contradecía los modelos de entonces que ponían electrones dentro del núcleo (14 protones y 7 electrones darían un fermión) y condujo al descubrimiento del neutrón.</li>
<li>H₂ (\(I=\tfrac12\), fermión): pesos \(1:3\) (\(J\) par : impar): el hidrógeno ordinario es una mezcla 3:1 de <em>orto</em>-H₂ (espines paralelos, \(J\) impar) y <em>para</em>-H₂ (espines antiparalelos, \(J\) par). A baja temperatura solo \(J=0\) está poblado y el hidrógeno en equilibrio es casi todo para: la conversión orto → para libera calor y por eso al licuar el hidrógeno se usan catalizadores de conversión. D₂ (\(I=1\), bosón): 2:1 (orto \(J\) par).</li>
<li>\({}^{16}\mathrm O_2\) (\(I=0\), estado fundamental \(\Sigma_g^-\), antisimétrico en la parte electrónica): solo existen \(J\) impares (las líneas pares faltan por completo). Y el \({}^{12}\mathrm C{}^{16}\mathrm O_2\) (\(I=0\), \(\Sigma_g^+\)): solo \(J\) pares: en su espectro IR de vibración–rotación faltan las líneas alternas y la separación es 4B, el doble de la de un diatómico del mismo B.</li>
</ul></div>
</section>

<section>
<h2>Isótopos y efecto isotópico cinético</h2>
<p>La frecuencia de una vibración depende de la masa reducida y no de la carga nuclear: la constante de fuerza (la curvatura del potencial electrónico, capítulo 25) es la misma para \(\mathrm{H}\) y \(\mathrm{D}\), y entonces \(\nu\propto\mu^{-1/2}\). El cambio de energía de punto cero, \(\tfrac12h\nu\), explica que reemplazar H por D estabilice los enlaces en una cantidad que depende de la vibración: la energía de enlace de un C–H es menor por unos 4.6 kJ/mol que la de un C–D. Cuando el estado de transición de una reacción rompe ese enlace, la barrera de la reacción con D es mayor, y la teoría del estado de transición del capítulo 17 da el máximo del efecto isotópico cinético primario (si la vibración desaparece por completo en el estado de transición):</p>
<div class="eq key" data-name="Efecto isotópico cinético por energía de punto cero">\[\frac{k_\mathrm H}{k_\mathrm D}\le\exp\!\left[\frac{\tfrac12hc(\tilde\nu_\mathrm H-\tilde\nu_\mathrm D)}{k_BT}\right],\qquad\tilde\nu_\mathrm D=\tilde\nu_\mathrm H\sqrt{\mu_\mathrm H/\mu_\mathrm D}.\]</div>
<div class="sim" data-sim="kie" data-title="Efecto isotópico cinético máximo por la energía de punto cero frente a la temperatura"></div>
<div class="sim-guide"><ul>
<li>Para C–H (\(\tilde\nu_\mathrm H=2900\) cm⁻¹, \(\mu_\mathrm{CH}=0.930\) u, \(\mu_\mathrm{CD}=1.725\) u): \(\tilde\nu_\mathrm D=2129\) cm⁻¹ (cociente 0.734) y la diferencia de punto cero es \(385\) cm⁻¹ \(=4.6\) kJ/mol; a 298 K, \(k_\mathrm H/k_\mathrm D\le6.4\): es el «efecto isotópico clásico» de 6–8 en las reacciones de transferencia de H.</li>
<li>Para O–H (3400 cm⁻¹ → 2475 cm⁻¹ con D) la diferencia es de 5.5 kJ/mol y el máximo, 9.3 a 298 K. A menor temperatura el efecto crece: a 150 K, el de C–H es de 40. Si el valor medido es mayor que el máximo por punto cero (por ejemplo 15–50 para C–H a temperatura ambiente) hay túnel (capítulo 22); si es mucho menor, el estado de transición no rompe del todo el enlace (es temprano o tardío) o la etapa con ese enlace no es la limitante.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>En la banda fundamental del CO, \(R(0)=2147.08\) y \(P(1)=2139.43\) cm⁻¹. Halle el origen aproximado y la constante rotacional promedio.
<details><summary>Respuesta</summary><p>\(R(0)-P(1)=2(B_0+B_1)=7.65\) cm⁻¹, \(\bar B=1.91\) cm⁻¹ (con \(B_0=1.9225\) y \(B_1=1.905\)). El origen está al medio: \(\tilde\nu_0\approx\tfrac12[R(0)+P(1)]+\ldots=2143.26\) cm⁻¹ (corregido por \(B_1-B_0\): 2143.27).</p></details></li>
<li><span class="lvl">Básico</span>Calcule la distancia de enlace del HCl con \(B_0=10.4398\) cm⁻¹ y \(\mu=0.97959\) u.
<details><summary>Respuesta</summary><p>\(r=\sqrt{16.8576/(\mu B_0)}\) Å \(=\sqrt{16.8576/(0.97959\times10.4398)}=\sqrt{1.6484}=1.284\) Å.</p></details></li>
<li><span class="lvl">Intermedio</span>Prediga la frecuencia fundamental armónica del DCl a partir de la del HCl (2990.9 cm⁻¹) y compárela con 2145 cm⁻¹ (\(\omega_e\) del DCl).
<details><summary>Respuesta</summary><p>\(\mu_\mathrm{DCl}=2.01410\times34.96885/36.98295=1.9044\) u; \(\omega_e(\mathrm{DCl})=2990.9\sqrt{0.97959/1.9044}=2990.9\times0.7172=2145.2\) cm⁻¹: coincide con el valor medido, 2145.2 (la fundamental, 2091, es menor por la anarmonicidad).</p></details></li>
<li><span class="lvl">Intermedio</span>Estime el máximo de \(k_\mathrm H/k_\mathrm D\) de una reacción que rompe un enlace O–H (\(\tilde\nu=3400\) cm⁻¹) a 298 K.
<details><summary>Respuesta</summary><p>\(\mu_\mathrm{OH}/\mu_\mathrm{OD}=0.9481/1.7889\), raíz 0.7280; \(\tilde\nu_\mathrm D=2475\) cm⁻¹; \(\Delta\mathrm{ZPE}=\tfrac12(3400-2475)=462\) cm⁻¹ \(=5.53\) kJ/mol; \(k_\mathrm H/k_\mathrm D=e^{5.53/2.479}=9.3\).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que, para el \(\mathrm O_2\) (\(I=0\), \(\Sigma_g^-\)), faltan las líneas de \(J\) par, y que para el \(\mathrm H_2\) la razón orto/para de equilibrio a alta temperatura es 3.
<details><summary>Respuesta</summary><p>El estado \(\Sigma_g^-\) es antisimétrico ante el intercambio de los núcleos en su parte electrónica; con \(I=0\) la parte de espín es única y simétrica; los núcleos de \({}^{16}\mathrm O\) son bosones, así que la parte rotacional debe ser antisimétrica, es decir, \(J\) impar. Para \(\mathrm H_2\): \(I=\tfrac12\): 3 estados simétricos (orto, \(J\) impar) y 1 antisimétrico (para, \(J\) par); a \(T\gg\theta_\mathrm{rot}\), las poblaciones de \(J\) par e impar son iguales por nivel, de modo que la razón es 3:1.</p></details></li>
</ol>
