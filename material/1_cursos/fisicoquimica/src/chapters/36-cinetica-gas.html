<template class="chapter-src" data-id="cinetica-gas" data-num="36" data-title="Teoría cinética de los gases" data-part="Parte VIII · Transporte y bioenergética" data-short="Distribución de velocidades de Maxwell–Boltzmann, colisiones y camino libre medio, flujo a una pared y efusión, números de Knudsen, viscosidad, conductividad térmica y difusión de los gases desde la teoría de Chapman–Enskog con el potencial de Lennard–Jones">
<p class="lead">El aire que sentimos en la cara es el golpe de \(10^{27}\) moléculas por metro cuadrado y por segundo, cada una moviéndose a unos 500 m/s y recorriendo apenas 60 nm antes de chocar con otra. De esa imagen mecánica, la teoría cinética de los gases (Clausius, Maxwell, Boltzmann; 1857–1872) obtiene la presión, la temperatura, la viscosidad, la conductividad térmica y la difusión, sin parámetros ajustables salvo el tamaño de las moléculas. Este capítulo recorre esa teoría y la prueba contra los valores medidos de seis gases.</p>

<section>
<h2>La distribución de Maxwell–Boltzmann</h2>
<p>En un gas en equilibrio, la probabilidad de que una molécula tenga rapidez entre \(v\) y \(v+\dd v\) es el factor de Boltzmann de su energía cinética por el volumen del espacio de velocidades (Maxwell, 1860):</p>
<div class="eq key" data-name="Distribución de rapideces">\[f(v)=4\pi\left(\frac m{2\pi k_BT}\right)^{3/2}v^2e^{-mv^2/2k_BT},\quad v_\mathrm{mp}=\sqrt{\frac{2RT}M},\ \ \bar v=\sqrt{\frac{8RT}{\pi M}},\ \ v_\mathrm{rms}=\sqrt{\frac{3RT}M}.\]</div>
<p>Las tres rapideces característicamente difieren en el orden \(v_\mathrm{mp}:\bar v:v_\mathrm{rms}=1:1.128:1.225\). La cola de alta energía es la que importa en química: la fracción de moléculas que tienen, en la línea de centros, una energía relativa de traslación \(\ge E_0\) es \(e^{-E_0/RT}(1+E_0/RT)\) (dos grados de libertad), la base de la teoría de colisiones del capítulo 17.</p>
<div class="sim" data-sim="maxwell" data-title="Distribución de rapideces de Maxwell–Boltzmann: rapideces características y cola de alta energía"></div>
<div class="sim-guide"><ul>
<li>N₂ a 298 K: \(v_\mathrm{mp}=421\), \(\bar v=475\), \(v_\mathrm{rms}=515\) m/s. Solo el 1.0 % de las moléculas supera 1000 m/s; a 1000 K, con un umbral de 1500 m/s, el 5.6 %. El helio, 7 veces más ligero, tiene \(\bar v=1255\) m/s a 298 K; en la alta atmósfera (1000 K) una fracción apreciable de su cola de Maxwell supera la velocidad de escape de la Tierra (11.2 km/s), y la atmósfera pierde helio.</li>
<li>Para una colisión con barrera \(E_0=50\) kJ/mol a 298 K, la fracción de choques reactivos es \(3.7\times10^{-8}\); con \(E_0=100\) kJ/mol, \(1.2\times10^{-16}\). A 1000 K son 1.7 \(\times10^{-2}\) y \(7.8\times10^{-5}\): el aumento de ocho a once órdenes de magnitud es el origen exponencial de la ecuación de Arrhenius (capítulo 17).</li>
</ul></div>
</section>

<section>
<h2>Colisiones, camino libre medio y efusión</h2>
<p>Con moléculas esféricas de diámetro \(d\) y densidad \(n=P/k_BT\), una molécula barre un cilindro de sección \(\pi d^2\) a la velocidad relativa media \(\sqrt2\bar v\) (el \(\sqrt2\) viene de que las demás también se mueven). Entonces, la frecuencia de colisión de una molécula y el <span class="term">camino libre medio</span> son</p>
<div class="eq key" data-name="Colisiones y camino libre medio">\[z=\sqrt2\,\pi d^2\bar v\,n,\qquad\lambda=\frac{\bar v}z=\frac{k_BT}{\sqrt2\pi d^2P},\qquad\mathrm{Kn}=\frac\lambda L,\qquad Z_w=\frac14n\bar v=\frac P{\sqrt{2\pi mk_BT}}.\]</div>
<p>\(\lambda\) es inversamente proporcional a \(P\): en el N₂ a 1 atm y 298 K vale 63 nm (unos 170 diámetros), a \(10^{-3}\) Pa unos 6 km. El <em>número de Knudsen</em> \(\mathrm{Kn}=\lambda/L\) decide el régimen: \(\mathrm{Kn}<0.01\), medio continuo (hidrodinámica, las moléculas chocan entre sí mucho antes que con la pared); \(\mathrm{Kn}>10\), flujo molecular (cada molécula atraviesa el recipiente sin chocar con otra). El <span class="term">flujo sobre una pared</span> \(Z_w\) fija la velocidad de efusión por un orificio (Graham, 1846): \(\propto1/\sqrt M\), de modo que el \(\mathrm H_2\) efunde 3.73 veces más rápido que el \(\mathrm N_2\) (así se separó el \(^{235}\mathrm{UF_6}\) del \(^{238}\mathrm{UF_6}\) en el proyecto Manhattan, con un factor de separación por etapa de solo 1.0043).</p>
<div class="sim" data-sim="colisiones-gas" data-title="Camino libre medio, frecuencia de colisión, número de Knudsen y flujo sobre una pared"></div>
<div class="sim-guide"><ul>
<li>N₂ a 298 K y 1 atm (\(d=3.8\) Å): \(\lambda=63\) nm, \(z=7.5\times10^9\) s⁻¹ (una colisión cada 130 ps), \(Z=9.2\times10^{34}\) colisiones por m³ y por segundo y \(Z_w=2.9\times10^{27}\) moléculas/m²·s. En un recipiente de 10 cm, \(\mathrm{Kn}=6\times10^{-7}\): medio continuo.</li>
<li>A \(10^{-3}\) Pa (vacío de un tubo de rayos catódicos), \(\lambda\) pasa de metros a kilómetros: \(\mathrm{Kn}>10\) y el gas es molecular. A 100 atm (\(10^7\) Pa), \(\lambda=0.63\) nm, apenas 2 diámetros: la teoría de gas diluido pierde sentido (las moléculas están casi en contacto, capítulo 31).</li>
</ul></div>
</section>

<section>
<h2>Viscosidad, conductividad térmica y difusión</h2>
<p>Los tres transportes salen del mismo mecanismo: las moléculas llevan su momento, su energía o su identidad una distancia \(\lambda\) antes de ceder esa propiedad en un choque. Por un argumento de camino libre medio (Maxwell, 1860), \(\eta\sim\tfrac13\rho\bar v\lambda\), \(\kappa\sim\tfrac13c_v\rho\bar v\lambda\) y \(D\sim\tfrac13\bar v\lambda\). Como \(\lambda\propto1/\rho\), el producto \(\rho\lambda\) no depende de la presión: la <em>viscosidad de un gas es independiente de la presión</em> (predicción de Maxwell, que parecía absurda y que él mismo verificó con un péndulo de torsión en 1866), y crece con la temperatura como \(\sqrt T\) (en una esfera dura) — al revés de un líquido. La teoría rigurosa de Chapman y Enskog (1916–17) resuelve la ecuación de Boltzmann y da, para un gas con potencial de interacción \(u(r)\),</p>
<div class="eq key" data-name="Chapman–Enskog">\[\eta=\frac5{16}\frac{\sqrt{\pi mk_BT}}{\pi\sigma^2\,\Omega^{(2,2)\ast}(T^*)},\quad\kappa=\frac{15}4\frac R M\eta\ (\text{monoatómico}),\quad D=\frac3{8n\sigma^2\Omega^{(1,1)\ast}(T^*)}\sqrt{\frac{k_BT}{\pi m}},\quad T^*=\frac{k_BT}\varepsilon.\]</div>
<p>\(\Omega^{(l,s)\ast}\) son las <em>integrales de colisión reducidas</em>, funciones de \(T^*\) tabuladas para el potencial de Lennard–Jones (aquí con las correlaciones de Neufeld, Janzen y Aziz, 1972); para gases poliatómicos, la conductividad se corrige con el factor de Eucken, \(\kappa=\eta(c_v+\tfrac94R)/M\).</p>
<div class="sim" data-sim="transporte-gas" data-title="Viscosidad, conductividad térmica y autodifusión de seis gases comparadas con CoolProp"></div>
<div class="sim-guide"><ul>
<li>Viscosidad a 298 K y 1 atm con los parámetros de Lennard–Jones de Hirschfelder–Curtiss–Bird: Ar, 22.71 µPa·s (CoolProp, 22.62: 0.4 %); N₂, 17.62 (17.80); He, 20.15 (19.85); O₂, 20.47 (20.55); CO₂, 15.10 (14.91); CH₄, 11.13 (11.20): 1.5 % o mejor en todos, sin ajustar nada a los datos de transporte, y de 250 a 1000 K sigue la curva medida. (Las pruebas del programa comprueban 18 combinaciones de gas y temperatura con tolerancia de 4 %.)</li>
<li>Conductividad térmica: el argón monoatómico, 17.73 mW/(m·K) (17.75 medida); el N₂ con la corrección de Eucken, 24.84 (25.83, −3.8 %). La conductividad térmica del helio, 155 mW/(m·K), es nueve veces la del argón porque su masa pequeña le da una velocidad media alta: por eso el helio enfría mejor y se usa como gas portador.</li>
<li>Autodifusión a 1 atm y 298 K: Ar, 0.183 cm²/s; N₂, 0.202; CO₂, 0.110; He, 1.66. A 273 K el argón da 0.157 cm²/s (medida de Marrero y Mason: 0.157). \(D\) es inversamente proporcional a la presión (a 10 atm cae diez veces) y crece como \(T^{1.7}\): dos propiedades que las ecuaciones de transporte en la atmósfera y en los reactores usan constantemente.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule \(v_\mathrm{mp}\), \(\bar v\) y \(v_\mathrm{rms}\) del H₂ y del CO₂ a 300 K.
<details><summary>Respuesta</summary><p>H₂ (\(M=2.016\) g/mol): \(v_\mathrm{mp}=\sqrt{2\cdot8.314\cdot300/0.002016}=1573\) m/s; \(\bar v=1775\); \(v_\mathrm{rms}=1927\). CO₂ (44.01): 336, 379, 412 m/s. La relación es \(\sqrt{44.01/2.016}=4.67\).</p></details></li>
<li><span class="lvl">Básico</span>Con \(d=3.8\) Å para el N₂, halle el camino libre medio a 25 °C y 1 Pa (el vacío grueso de una bomba mecánica) y compárelo con un tubo de 5 cm.
<details><summary>Respuesta</summary><p>\(\lambda=k_BT/(\sqrt2\pi d^2P)=4.114\times10^{-21}/(\sqrt2\pi(3.8\times10^{-10})^2\times1)=6.4\) mm; \(\mathrm{Kn}=6.4/50=0.13\): régimen de transición (ni continuo ni molecular).</p></details></li>
<li><span class="lvl">Intermedio</span>Un orificio de 1 mm² deja escapar N₂ a 1 Torr y 300 K al vacío. ¿Cuántas moléculas por segundo, y cuántos mol/hora?
<details><summary>Respuesta</summary><p>\(Z_w=P/\sqrt{2\pi mk_BT}\) con \(P=133.3\) Pa, \(m=4.652\times10^{-26}\) kg: \(\sqrt{2\pi(4.652\times10^{-26})(4.14\times10^{-21})}=3.48\times10^{-23}\); \(Z_w=3.83\times10^{24}\) m⁻²s⁻¹; con \(10^{-6}\) m²: \(3.8\times10^{18}\) moléculas/s \(=6.4\times10^{-6}\) mol/s \(=0.023\) mol/h.</p></details></li>
<li><span class="lvl">Intermedio</span>Estime la viscosidad del argón a 298 K con el modelo de esfera dura (\(\eta=\tfrac5{16}\sqrt{\pi mk_BT}/\pi d^2\), con \(d=3.4\) Å) y compárela con 22.6 µPa·s.
<details><summary>Respuesta</summary><p>\(m=6.634\times10^{-26}\) kg y \(mk_BT=2.730\times10^{-46}\) kg·J. \(\sqrt{\pi mk_BT}=\sqrt{8.58\times10^{-46}}=2.93\times10^{-23}\); \(\pi d^2=3.63\times10^{-19}\) m². \(\eta=0.3125\times2.93\times10^{-23}/3.63\times10^{-19}=2.52\times10^{-5}\) Pa·s \(=25\) µPa·s, un 11 % mayor que 22.6 µPa·s: buen orden de magnitud sin el potencial de Lennard–Jones.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que el flujo sobre una pared es \(Z_w=\tfrac14n\bar v\) integrando \(v_z f\) en el semiespacio \(v_z>0\).
<details><summary>Respuesta</summary><p>En coordenadas esféricas, \(Z_w=n\int_0^\infty\!\int_0^{\pi/2}\!\int_0^{2\pi}(v\cos\theta)\,F(v)\,v^2\sin\theta\,\dd\phi\,\dd\theta\,\dd v\) con \(F\) la densidad de probabilidad de la velocidad vectorial. La integral angular \(2\pi\int_0^{\pi/2}\cos\theta\sin\theta\,\dd\theta=\pi\) y queda \(Z_w=n\pi\int v^3F\,\dd v=\tfrac14n\bar v\), pues \(\bar v=4\pi\int v^3F\,\dd v\).</p></details></li>
</ol>
