<p class="lead">Una pila es una máquina que convierte la energía de Gibbs de una reacción en trabajo eléctrico. El voltaje lo fija la termodinámica (capítulo 13) y la rapidez con que se entrega, la cinética (capítulo 14). De ese par de capítulos salen los números que deciden si un carro eléctrico llega a casa, si el hidrógeno es un buen almacén de energía y por qué la batería de plomo de un automóvil, inventada en 1859, sigue siendo la más fabricada del mundo.</p>

<section>
<h2>La energía de una batería: teoría y práctica</h2>
<p>El trabajo eléctrico máximo de una celda es \(nFE^\circ\) por mol de reacción. Dividido por la masa de los reactivos, da la <span class="term">energía específica teórica</span>, el techo que ninguna celda puede superar. Para la batería de plomo–ácido, \(\mathrm{Pb+PbO_2+2H_2SO_4\to2PbSO_4+2H_2O}\), las energías de Gibbs de formación del capítulo 3 dan \(\Delta_rG^\circ=-394.0\) kJ y \(E^\circ=2.04\) V (el valor de una celda es 2.05 V). Los reactivos suman 642.6 g por 2 mol de electrones: la energía específica teórica es 170 Wh/kg. La pila alcalina de zinc y dióxido de manganeso, \(\mathrm{Zn+2MnO_2\to ZnO+Mn_2O_3}\), da 1.41 V y 315 Wh/kg.</p>
<p>Las baterías reales entregan una fracción de eso: el electrolito, los colectores de corriente, la carcasa y los separadores pesan tanto como los materiales activos, la tensión de trabajo es menor que la reversible y la profundidad de descarga es limitada. Una batería de plomo comercial da 30–40 Wh/kg, el 20 % del techo teórico.</p>
<div class="sim" data-sim="baterias" data-title="Energía específica teórica (de la termodinámica) y real de las baterías"></div>
<div class="sim-guide"><ul>
<li>Plomo–ácido: 170 Wh/kg teóricos frente a unos 35 reales (20 %); alcalina de Zn–MnO₂: 315 frente a unos 120; Li-ion LCO/grafito: 390 Wh/kg de los materiales activos y unos 200 de la celda, la mitad: la proporción de materia inactiva ya es menor.</li>
<li>Los materiales con alta capacidad por gramo y alto voltaje son los candidatos a mejorar: el litio metálico entrega 3862 mAh/g, el silicio 3578 mAh/g (con \(\mathrm{Li_{15}Si_4}\)), frente a 372 mAh/g del grafito. Un ánodo de silicio duplicaría la capacidad del ánodo, pero se expande 300 % al cargarse y se agrieta.</li>
<li>Li–azufre y Li–aire tienen techos teóricos de 2500 y 3500 Wh/kg (casi diez veces los del Li-ion), pero solo existen como prototipos de laboratorio, por la disolución de los polisulfuros y la irreversibilidad del \(\mathrm{Li_2O_2}\).</li>
<li>La gasolina contiene unos 12 900 Wh/kg de combustible: un auto de gasolina lleva un depósito que pesa lo que una batería de 50 veces menos energía. Pero un motor eléctrico convierte 90 % de la energía en trabajo y uno de gasolina 25 %, de modo que la ventaja real en energía útil es de unas 15 veces, no de 50.</li>
</ul></div>
</section>

<section>
<h2>Baterías de ion litio: la intercalación</h2>
<p>El litio es el metal más ligero (6.94 g/mol) y de \(E^\circ=-3.04\) V (capítulo 13): el mejor ánodo posible. Pero un ánodo de litio metálico, al recargarse, deposita dendritas que perforan el separador y causan cortocircuitos. La solución comercial (Sony, 1991, a partir de los trabajos de Goodenough, Whittingham y Yoshino, Premio Nobel de Química 2019) es la <span class="term">intercalación</span>: los iones Li⁺ viajan entre dos electrodos sólidos con estructuras en capas (grafito y LiCoO₂) o en túneles (LiFePO₄), en las que se insertan sin romper la red. El litio nunca es metal: «batería de mecedora». Cada electrodo se comporta como un gas de red, y el potencial de equilibrio sigue de la termodinámica del capítulo 1:</p>
<div class="eq key" data-name="Potencial de un electrodo de intercalación">\[E(x)=E^\circ-\frac{1}{F}\left[RT\ln\frac{x}{1-x}+\Omega(1-2x)\right],\]</div>
<p>donde \(x\) es la fracción de sitios ocupados por litio y \(\Omega\) mide la interacción entre iones insertados (disolución regular). Si \(\Omega<2RT\) la curva es inclinada (disolución sólida: LiCoO₂, grafito en las etapas intermedias); si \(\Omega>2RT\), el sólido se separa en dos fases, una pobre y otra rica en litio, y el potencial se vuelve una meseta: es el LiFePO₄, de 3.43 V muy plano, que es una ventaja (tensión estable) y una desventaja (el estado de carga no se lee de la tensión).</p>
<div class="sim" data-sim="intercalacion" data-title="Electrodo de intercalación: potencial de equilibrio y curva de descarga bajo carga"></div>
<div class="sim-guide"><ul>
<li>Con \(\Omega=0\) (solución ideal), la curva es la de Nernst de una red de sitios: \(E=E^\circ-(RT/F)\ln[x/(1-x)]\), con pendiente de 25.7 mV por unidad de logaritmo: una curva inclinada que sube mucho en los extremos. Con \(\Omega\) = 6 kJ/mol (mayor que \(2RT=4.96\) kJ/mol) aparece una meseta central y la curva queda plana entre \(x\approx0.16\) y 0.84.</li>
<li>Suba el régimen de descarga: la caída óhmica y de activación baja toda la curva. La eficiencia de energía, \(E_{salida}/E_{equilibrio}\), es 99.9 % a C/20, 97.5 % a 1C y 92 % a unos 3C; a más de 4.8C la caída supera la diferencia entre la meseta (3.4 V) y la tensión de corte (3.0 V) y la celda no entrega nada: ese es el límite de potencia de la batería.</li>
<li>A baja temperatura, el efecto de \(T\) en el término \(RT\ln\) es leve, pero la resistencia interna real crece mucho: la batería entrega menos capacidad en frío, la razón de que el celular se apague a −10 °C.</li>
</ul></div>
</section>

<section>
<h2>Hidrógeno: electrólisis y celdas de combustible</h2>
<p>El agua se descompone en hidrógeno y oxígeno al pasar corriente: \(\mathrm{H_2O(l)\to H_2+\tfrac12O_2}\), con \(\Delta_rG^\circ=+237.1\) kJ/mol y \(E_{rev}=1.229\) V (capítulo 13). Como \(\Delta_rS^\circ>0\), el potencial <em>baja</em> con la temperatura: \(\mathrm dE/\mathrm dT=-\Delta S/(2F)=-0.85\) mV/K. El <span class="term">potencial termoneutro</span> de 1.481 V (ΔH/2F) es el que hace falta si todo el calor lo pone la electricidad; por debajo, la celda toma calor del ambiente. En la práctica, las pérdidas por sobrepotencial de los electrodos (la reacción de desprendimiento de oxígeno es la lenta: \(i_0\approx10^{-7}\) A/cm² sobre iridio) y la resistencia de la membrana elevan el voltaje de operación a 1.7–2.0 V.</p>
<p>La celda de combustible es el electrolizador al revés: oxida el hidrógeno con oxígeno y produce corriente. Su tensión reversible es la misma, 1.23 V, pero la reducción lenta del oxígeno (\(i_0\) de \(10^{-9}\) a \(10^{-7}\) A/cm²) hace caer el voltaje práctico a 0.6–0.7 V a la densidad de corriente de trabajo: la eficiencia de tensión es de 50–60 %. La eficiencia del ciclo completo hidrógeno (electrólisis, almacenamiento, celda) es de 30–40 %, mientras que una batería de ion litio devuelve el 85–90 % de lo que se le pone.</p>
<div class="sim" data-sim="pila-electrolisis" data-title="Curvas de polarización de un electrolizador y de una celda de combustible PEM"></div>
<div class="sim-guide"><ul>
<li>Electrolizador a 60 °C y 1 A/cm²: \(E_{rev}=1.20\) V y la tensión de operación sube a 1.81 V por los sobrepotenciales (0.46 V del oxígeno, 0.05 V del hidrógeno) y la caída óhmica (0.10 V con \(0.1\ \Omega\cdot\mathrm{cm}^2\)). La eficiencia respecto del poder calorífico superior es 82 %, y el consumo de energía 48 kWh por kg de H₂ (el mínimo teórico es 33–39 kWh/kg; los equipos comerciales dan 50–55).</li>
<li>La eficiencia mejora al bajar la corriente: con 0.1 A/cm² la tensión baja a 1.61 V (eficiencia 92 %), pero se necesita diez veces más área de electrodo (más platino e iridio, que son caros). El diseño es un compromiso entre inversión y energía.</li>
<li>Celda de combustible: a 0.1 A/cm² la tensión es de 0.79 V; a 1 A/cm² cae a 0.63 V, con 0.63 W/cm². La potencia pasa por un máximo de 1.0 W/cm² hacia 2.5 A/cm², donde el transporte de oxígeno empieza a limitar; las celdas PEM reales rinden 0.6–1.0 W/cm².</li>
<li>Al subir \(T\), el potencial reversible baja 0.85 mV/K, pero los sobrepotenciales mejoran más: por eso las celdas PEM trabajan a 60–80 °C, y las de óxido sólido (SOFC) a 700–900 °C, donde ya no necesitan platino.</li>
</ul></div>
<div class="box ex"><h4>La energía por kilogramo de hidrógeno</h4>
<p>¿Cuánta energía eléctrica mínima se necesita para producir 1 kg de H₂ a 25 °C, y cuánto con un electrolizador que opera a 1.8 V?</p>
<details><summary>Solución</summary><p>1 kg de H₂ son 496 mol, que requieren 2 mol de electrones cada uno: \(Q=2\times96\,485\times496=95.7\) MC (26.6 kAh). A 1.229 V (reversible): \(W=QE=117.6\) MJ = 32.7 kWh; a 1.481 V (termoneutro, PCS): 39.4 kWh; a 1.8 V: 47.9 kWh. El poder calorífico del hidrógeno es de 39.4 kWh/kg (PCS) y 33.3 kWh/kg (PCI): el electrolizador a 1.8 V gasta 21 % más energía de la que el hidrógeno devuelve al quemarse.</p></details>
</div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule la capacidad específica del litio metálico (6.94 g/mol, 1 electrón) en mAh/g.
<details><summary>Respuesta</summary><p>\(Q=F/(3.6\,M)=96\,485/(3.6\times6.94)=3862\) mAh/g.</p></details></li>
<li><span class="lvl">Básico</span>Una celda de ion litio de 3.7 V y 3.0 Ah, ¿cuánta energía almacena y cuánto pesa si es de 250 Wh/kg?
<details><summary>Respuesta</summary><p>\(E=3.7\times3.0=11.1\) Wh; masa = 11.1/250 = 44 g.</p></details></li>
<li><span class="lvl">Intermedio</span>Con \(\Delta_fG^\circ\) de −217.3 (PbO₂), −813.0 (PbSO₄), −744.5 (SO₄²⁻) y −237.1 kJ/mol (H₂O), halle \(E^\circ\) de la batería de plomo–ácido.
<details><summary>Respuesta</summary><p>\(\mathrm{Pb+PbO_2+4H^++2SO_4^{2-}\to2PbSO_4+2H_2O}\): \(\Delta G^\circ=2(-813.0)+2(-237.1)-(-217.3)-2(-744.5)=-394.0\) kJ. \(E^\circ=394\,000/(2\times96\,485)=2.04\) V.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Cuál es la eficiencia de ida y vuelta de un sistema que electroliza agua a 1.8 V (82 % del PCS) y la devuelve en una celda de combustible a 0.65 V?
<details><summary>Respuesta</summary><p>La energía de salida por mol es \(2F(0.65)\), la de entrada \(2F(1.8)\): \(\eta=0.65/1.8=36\) %. Es la eficiencia de ida y vuelta del hidrógeno almacenado como gas; con baterías de ion litio es 85–90 %.</p></details></li>
<li><span class="lvl">Avanzado</span>Para un electrodo de intercalación con \(\Omega\) y \(x\) la fracción de ocupación, demuestre que el potencial tiene una meseta si \(\Omega>2RT\), y halle las composiciones de las fases coexistentes si \(\Omega=3RT\).
<details><summary>Respuesta</summary><p>\(\mu(x)=RT\ln\frac{x}{1-x}+\Omega(1-2x)\) tiene \(\mu'(x)=RT/[x(1-x)]-2\Omega\), que cambia de signo si \(\Omega>2RT\) (el mínimo de \(1/[x(1-x)]\) es 4 en \(x=1/2\)): hay una región de pendiente negativa (inestable) y se reemplaza por una meseta con \(\mu=0\) (por simetría). Las composiciones son las raíces de \(\ln\frac{x}{1-x}=3(2x-1)\): \(x=0.07\) y \(0.93\).</p></details></li>
</ol>
