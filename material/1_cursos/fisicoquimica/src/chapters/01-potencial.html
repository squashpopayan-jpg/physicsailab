<p class="lead">La termodinámica de las máquinas describe sistemas de composición fija. La química cambia la composición: las moléculas se transforman, pasan de una fase a otra y se mezclan. Para describirlo, Josiah Willard Gibbs introdujo en 1876 una magnitud nueva, el <em>potencial químico</em>, que hace para la materia lo que la temperatura hace para el calor y la presión para el volumen: decide en qué dirección fluye. Todo lo que sigue en el curso, desde el equilibrio químico hasta las baterías, es una aplicación de esta idea.</p>

<section>
<h2>La ecuación fundamental de un sistema abierto</h2>
<p>En el curso de Termodinámica, la energía interna de un sistema cerrado dependía de \(S\) y \(V\): \(\dd U=T\,\dd S-P\,\dd V\). Si el sistema puede intercambiar materia, o si en su interior cambian las cantidades de las especies, \(U\) depende también del número de moles \(n_i\) de cada componente:</p>
<div class="eq key" data-name="Ecuación fundamental de Gibbs">\[\dd U=T\,\dd S-P\,\dd V+\sum_i\mu_i\,\dd n_i,\qquad \mu_i=\left(\pdv{U}{n_i}\right)_{S,V,n_{j\neq i}}.\]</div>
<p>El coeficiente \(\mu_i\) es el <span class="term">potencial químico</span> del componente \(i\), en J/mol. Como las demás variables naturales cambian con la transformación de Legendre, existen cuatro expresiones equivalentes para \(\mu_i\), una por cada potencial termodinámico:</p>
<div class="eq">\[\mu_i=\left(\pdv{U}{n_i}\right)_{S,V}=\left(\pdv{H}{n_i}\right)_{S,P}=\left(\pdv{A}{n_i}\right)_{T,V}=\left(\pdv{G}{n_i}\right)_{T,P,n_{j\neq i}}.\]</div>
<p>La última es la que usan los químicos, porque \(T\) y \(P\) son las variables que se controlan en el laboratorio. Con ella, la diferencial de la energía de Gibbs \(G=H-TS\) queda</p>
<div class="eq key" data-name="Diferencial de G">\[\dd G=-S\,\dd T+V\,\dd P+\sum_i\mu_i\,\dd n_i.\]</div>
<p>Las derivadas de \(G\) respecto de \(T\) y \(P\) dan \(-S\) y \(V\); respecto de \(n_i\), el potencial químico. Las relaciones de Maxwell que salen de la igualdad de las derivadas cruzadas, por ejemplo \(\left(\partial\mu_i/\partial P\right)_{T,n}=\left(\partial V/\partial n_i\right)_{T,P}\), conectan lo que ocurre con la composición con lo que se mide con \(T\) y \(P\).</p>
<h3>Integración de Euler y relación de Gibbs–Duhem</h3>
<p>\(G\) es una función <em>extensiva</em>: si se multiplican por \(\lambda\) todas las cantidades de materia a \(T\) y \(P\) fijas, \(G\) se multiplica por \(\lambda\). El teorema de Euler para funciones homogéneas de primer grado da entonces</p>
<div class="eq key" data-name="Integral de Euler">\[G=\sum_in_i\mu_i.\]</div>
<p>El potencial químico es la energía de Gibbs <em>molar parcial</em>. Si ahora se diferencia \(G=\sum n_i\mu_i\) y se compara con \(\dd G\) de arriba, resulta la ecuación de Gibbs–Duhem:</p>
<div class="eq key" data-name="Gibbs–Duhem">\[S\,\dd T-V\,\dd P+\sum_in_i\,\dd\mu_i=0.\]</div>
<p>A \(T\) y \(P\) constantes, \(\sum n_i\,\dd\mu_i=0\): los potenciales químicos de los componentes de una mezcla no pueden variar independientemente. En una mezcla binaria, si \(\mu_1\) sube al añadir el componente 1, \(\mu_2\) debe bajar en una cantidad determinada.</p>
</section>

<section>
<h2>El potencial químico como criterio de equilibrio</h2>
<p>Considere un sistema aislado dividido en dos fases \(\alpha\) y \(\beta\) en equilibrio térmico y mecánico, a \(T\) y \(P\) comunes, y suponga que pasa una cantidad \(\dd n\) del componente \(i\) de \(\alpha\) a \(\beta\). El cambio de \(G\) es \(\dd G=(\mu_i^\beta-\mu_i^\alpha)\,\dd n\). A \(T\) y \(P\) constantes un proceso espontáneo disminuye \(G\), de modo que la materia pasa de la fase de mayor potencial químico a la de menor:</p>
<div class="eq key" data-name="Equilibrio material">\[\dd G\le0\quad\Rightarrow\quad\text{la materia fluye hacia el menor }\mu;\qquad \text{equilibrio:}\ \ \mu_i^\alpha=\mu_i^\beta\ \ \text{para todo }i.\]</div>
<p>El potencial químico es a la materia lo que la temperatura al calor: dos regiones en contacto intercambian hasta que se igualan. Se aplica a transferencia entre fases, pero también a las reacciones químicas, que se tratan en el capítulo 5: una reacción avanza mientras la energía de Gibbs de los productos sea menor que la de los reactivos.</p>
<h3>El gas ideal</h3>
<p>Para un gas ideal puro, \(\left(\partial\mu/\partial P\right)_T=V_m=RT/P\). Integrando desde la presión estándar \(P^\circ=1\) bar se obtiene</p>
<div class="eq key" data-name="Potencial químico del gas ideal">\[\mu(T,P)=\mu^\circ(T)+RT\ln\frac{P}{P^\circ}.\]</div>
<p>A 298.15 K, comprimir un gas ideal de 1 a 10 bar sube su potencial químico en \(RT\ln10=5.71\) kJ/mol. Para un líquido o un sólido, de volumen molar casi constante, \(\mu\) varía mucho menos con la presión: \(\mu(P)\approx\mu(P_0)+V_m(P-P_0)\), unos 1.8 J/mol por bar en el agua.</p>
<h3>Cambios de fase vistos con \(\mu(T)\)</h3>
<p>Como \(\left(\partial\mu/\partial T\right)_P=-S_m\) y la entropía de un gas es mucho mayor que la de un líquido, y esta mayor que la de un sólido, la línea \(\mu(T)\) del vapor es la que más cae al subir la temperatura, y la del hielo la que menos. A cada presión, la fase estable es la de menor \(\mu\). Los cruces son los cambios de fase: fusión donde se cortan hielo y líquido, ebullición donde se cortan líquido y vapor.</p>
<div class="sim" data-sim="mu-fases" data-title="El potencial químico del agua frente a la temperatura a presión fija"></div>
<div class="sim-guide"><ul>
<li>Con 101.325 kPa la línea del líquido es el eje horizontal (se toma como referencia). El hielo está por debajo de él a 273.15 K hacia la izquierda; el vapor cruza a 373.12 K, la ebullición.</li>
<li>Baje la presión a 81.9 kPa, la de Popayán: la línea del vapor, \(RT\ln(P/P_{sat})\), baja y el cruce se desplaza a 94.1 °C. Por eso el arroz tarda más en cocinarse a 1760 m.</li>
<li>Por debajo de 0.6117 kPa (punto triple) no hay cruce entre líquido y vapor antes de que cruce el hielo: el hielo se sublima sin pasar por líquido.</li>
<li>La diferencia de pendientes en cada cruce es la entropía de cambio de fase: 22 J/mol·K para la fusión y 109 J/mol·K para la ebullición, que cumple la regla de Trouton (\(\Delta S_{vap}\approx 88\) J/mol·K) con la desviación esperada para un líquido con enlaces de hidrógeno.</li>
</ul></div>
<div class="box ex"><h4>¿Se evapora o se condensa?</h4>
<p>El aire de un cuarto a 25 °C contiene vapor de agua a 1.00 kPa. ¿Qué ocurre con un vaso de agua líquida?</p>
<details><summary>Solución</summary><p>La presión de saturación del agua a 25 °C es 3.1698 kPa. El potencial químico del vapor, relativo al del líquido (en equilibrio con el vapor saturado), es \(\mu_v-\mu_l=RT\ln(P/P_{sat})=8.3145(298.15)\ln(1.00/3.1698)=-2.86\) kJ/mol. Como el vapor tiene menor potencial químico, el agua líquida se evapora hasta que el aire se sature. La humedad relativa del aire es \(P/P_{sat}=31.5\,\%\).</p></details>
</div>

<section>
<h2>Propiedades molares parciales</h2>
<p>Al mezclar etanol y agua, los volúmenes no se suman: 50 mL de etanol con 50 mL de agua a 20 °C dan apenas 96.4 mL de disolución, no 100. La razón es que el volumen que una molécula de etanol aporta a la mezcla depende de qué moléculas la rodean. Se describe con la <span class="term">propiedad molar parcial</span>, definida para cualquier propiedad extensiva \(X\):</p>
<div class="eq key" data-name="Volumen molar parcial">\[\bar V_i=\left(\pdv{V}{n_i}\right)_{T,P,n_{j\neq i}}.\]</div>
<p>Es el cambio de volumen al añadir un mol del componente \(i\) a una cantidad tan grande de mezcla que su composición no cambia. Por el mismo teorema de Euler que se usó para \(G\),</p>
<div class="eq">\[V=\sum_in_i\bar V_i,\qquad V_m=\sum_ix_i\bar V_i,\]</div>
<p>donde \(x_i\) es la fracción molar y \(V_m=V/n\) el volumen molar de la mezcla. En una mezcla binaria, los volúmenes parciales se leen con la <em>construcción de la tangente</em>: la tangente a la curva \(V_m(x_1)\) en la composición \(x_1\) corta el eje \(x_1=0\) en \(\bar V_2\) y el eje \(x_1=1\) en \(\bar V_1\). Las propiedades parciales pueden ser sorprendentes, e incluso negativas: el volumen parcial del sulfato de magnesio en agua diluida es de −1.4 cm³/mol a 25 °C (Atkins), porque los iones contraen el agua que los rodea (electrostricción).</p>
<div class="sim" data-sim="vol-parcial" data-title="Etanol y agua a 20 °C: volumen molar de la mezcla y construcción de la tangente"></div>
<div class="sim-guide"><ul>
<li>Los puntos son datos reales de densidad (Lange, 1967) convertidos a volumen molar; la curva es un ajuste de Redlich–Kister de sexto grado al volumen de exceso, con error máximo de 0.005 cm³/mol.</li>
<li>El volumen molar parcial del etanol en agua muy diluida es 55.3 cm³/mol, menor que el del etanol puro (58.37). El mínimo de \(\bar V_1\) es 52.7 cm³/mol cerca de \(x=0.06\): el etanol se acomoda en los huecos de la estructura del agua.</li>
<li>Con \(x=0.2\) (39 % en masa) las moléculas de agua aportan 17.6 cm³/mol en lugar de 18.05: ahí se ve la contracción.</li>
<li>La separación entre la curva y la línea recta de trazos (mezcla ideal) es el volumen de exceso, máximo (−1.10 cm³/mol) cerca de \(x=0.43\), es decir 66 % en masa.</li>
</ul></div>
<h3>La relación de Gibbs–Duhem en las propiedades parciales</h3>
<p>Como \(V=\sum n_i\bar V_i\) y \(\dd V=\sum\bar V_i\,\dd n_i\) (a \(T\), \(P\) constantes), se cumple de nuevo \(\sum n_i\,\dd\bar V_i=0\); para una mezcla binaria,</p>
<div class="eq key" data-name="Gibbs–Duhem para V̄">\[x_1\,\dd\bar V_1+x_2\,\dd\bar V_2=0\quad\Longrightarrow\quad\left(\pdv{\bar V_2}{x_1}\right)=-\frac{x_1}{x_2}\left(\pdv{\bar V_1}{x_1}\right).\]</div>
<p>Es una restricción poderosa: si se mide el volumen parcial de un componente en todo el intervalo de composición, el del otro queda determinado salvo una constante. Y es una prueba de consistencia: los datos de un experimento mal hecho la violan.</p>
<div class="sim" data-sim="gibbs-duhem" data-title="Volúmenes parciales, Gibbs–Duhem y contracción de volumen"></div>
<div class="sim-guide"><ul>
<li>Las curvas \(\bar V_1(x)\) y \(\bar V_2(x)\) son imágenes especulares: cuando una sube, la otra baja, ponderadas por las fracciones molares. El residuo numérico de Gibbs–Duhem es cero dentro del error de derivación.</li>
<li>Con 50 mL de cada líquido, la disolución ocupa 96.4 mL: se contrae 3.6 mL (3.6 %).</li>
<li>Pruebe una disolución de bebida espirituosa (unos 40 mL de etanol y 60 mL de agua): la contracción es de 3.3 mL (3.3 %).</li>
</ul></div>
</section>

<section>
<h2>La energía de Gibbs de mezcla</h2>
<p>Cuando se mezclan los componentes puros a \(T\) y \(P\) constantes, \(G\) pasa de \(\sum n_i\mu_i^*\) a \(\sum n_i\mu_i\). Si el potencial químico de cada componente en la mezcla ideal es \(\mu_i=\mu_i^*+RT\ln x_i\) (se justifica en el capítulo 8 a partir de la ley de Raoult), resulta</p>
<div class="eq key" data-name="Mezcla ideal">\[\Delta_{mez}G=nRT\sum_ix_i\ln x_i,\qquad \Delta_{mez}S=-nR\sum_ix_i\ln x_i,\qquad \Delta_{mez}H=0.\]</div>
<p>Como las fracciones molares son menores que 1, \(\Delta_{mez}G\) es siempre negativa: <b>las mezclas ideales se forman espontáneamente en todas las proporciones</b>, impulsadas solo por la entropía. Mezclar 2 mol de A con 3 mol de B a 300 K baja \(G\) en 8.39 kJ.</p>
<p>Las moléculas reales se atraen distinto según la pareja. El modelo más simple que lo incluye es la <span class="term">disolución regular</span> de Hildebrand: la entropía sigue siendo ideal pero la entalpía de mezcla es \(\Delta_{mez}H=nRT\chi\,x_1x_2\), con \(\chi\) un parámetro adimensional de interacción. Así,</p>
<div class="eq key" data-name="Mezcla regular">\[\frac{\Delta_{mez}G}{nRT}=x\ln x+(1-x)\ln(1-x)+\chi\,x(1-x).\]</div>
<p>Si \(\chi\) es pequeño, la curva tiene un solo mínimo y la mezcla es estable en todas las composiciones. Si la repulsión entre A y B es suficiente, la curva desarrolla dos mínimos y una región central de curvatura negativa: ahí la mezcla homogénea es <em>inestable</em> y se separa en dos fases cuyas composiciones son las de la tangente común (la <em>binodal</em>). El límite de estabilidad local, donde \(\partial^2G/\partial x^2=0\), es la <em>espinodal</em>, \(1/[x(1-x)]=2\chi\). La condición crítica es \(\chi_c=2\), con \(x_c=1/2\).</p>
<div class="sim" data-sim="gibbs-mezcla" data-title="Energía de Gibbs de mezcla: de la ideal a la separación de fases"></div>
<div class="sim-guide"><ul>
<li>Con \(\chi=0\) la curva (mezcla ideal) tiene su mínimo en \(x=0.5\), de valor \(-\ln2=-0.693\) en unidades de \(RT\). La tangente corta los ejes en los potenciales químicos de los componentes, relativos a los puros.</li>
<li>Suba \(\chi\) hasta 2: el mínimo se aplana y se divide en dos. Con \(\chi=2.5\) las fases coexistentes tienen \(x=0.145\) y \(x=0.855\); con \(\chi=3\), \(x=0.071\) y \(0.929\).</li>
<li>Con \(\chi>2\) ponga \(x\) entre las dos espinodales (0.276 y 0.724 si \(\chi=2.5\)): la curvatura es negativa y el sistema es inestable. Entre la binodal y la espinodal la mezcla es metaestable.</li>
</ul></div>
<div class="box note"><h4>El potencial químico en la práctica</h4><p>Gibbs publicó estas ideas en 1876 y 1878 en las <em>Transactions of the Connecticut Academy</em>, una revista tan poco leída que Maxwell fue de los primeros en entenderlas y difundirlas. Hoy el potencial químico está detrás de la fuerza electromotriz de una pila (capítulo 13), del equilibrio de una reacción (capítulo 5), de la presión osmótica (capítulo 10) y del transporte de iones en una membrana celular (capítulo 38).</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Halle el cambio del potencial químico de un gas ideal a 298.15 K al comprimirlo de 1 bar a 10 bar.
<details><summary>Respuesta</summary><p>\(\Delta\mu=RT\ln10=8.3145(298.15)(2.3026)=5.71\) kJ/mol.</p></details></li>
<li><span class="lvl">Básico</span>Para 1 mol de etanol y 1 mol de agua a 20 °C (\(x=0.5\)), use el volumen de exceso de la mezcla, \(V^E=-1.086\) cm³/mol, y calcule el volumen de la disolución y la contracción.
<details><summary>Respuesta</summary><p>\(V_m=0.5(58.37)+0.5(18.05)+V^E=37.12\) cm³/mol, así que \(V=74.24\) cm³. La suma de volúmenes puros es 76.41 cm³: la contracción es 2.17 cm³ (2.8 %).</p></details></li>
<li><span class="lvl">Intermedio</span>Calcule \(\Delta_{mez}G\) y \(\Delta_{mez}S\) al mezclar 2 mol de A con 3 mol de B (ideales) a 300 K.
<details><summary>Respuesta</summary><p>\(x_A=0.4\), \(x_B=0.6\). \(\Delta G=5RT(0.4\ln0.4+0.6\ln0.6)=12.47(-0.6730)=-8.39\) kJ; \(\Delta S=-\Delta G/T=+27.98\) J/K; \(\Delta H=0\).</p></details></li>
<li><span class="lvl">Intermedio</span>Si el vapor de agua de un cuarto a 25 °C tiene presión parcial de 2.5 kPa, ¿cuánto vale \(\mu_v-\mu_l\) y cuál es la humedad relativa?
<details><summary>Respuesta</summary><p>\(RT\ln(2.5/3.1698)=-0.59\) kJ/mol; \(\phi=78.9\,\%\). El agua líquida sigue evaporándose, pero con tendencia mucho menor que a 1 kPa.</p></details></li>
<li><span class="lvl">Avanzado</span>En una mezcla binaria el volumen parcial del componente 1 es \(\bar V_1=V_1^*+a\,x_2^2\). Use la relación de Gibbs–Duhem para hallar \(\bar V_2\) y el volumen de exceso.
<details><summary>Respuesta</summary><p>De \(x_1\dd\bar V_1+x_2\dd\bar V_2=0\) con \(\dd\bar V_1=2a x_2\,\dd x_2\) resulta \(\dd\bar V_2=-2a(1-x_2)\,\dd x_2\), y con \(\bar V_2(x_2=1)=V_2^*\), \(\bar V_2=V_2^*+a\,x_1^2\). Entonces \(V^E=x_1\bar V_1+x_2\bar V_2-x_1V_1^*-x_2V_2^*=a\,x_1x_2\). Es el comportamiento de una disolución regular.</p></details></li>
</ol>
