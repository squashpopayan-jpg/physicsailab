<template class="chapter-src" data-id="gibbs" data-num="4" data-title="Entropía y energía de Gibbs" data-part="Parte I · Termodinámica química" data-short="Tercera ley y entropías absolutas, entropía residual, entropía de reacción, energía de Gibbs de reacción y su dependencia con la temperatura, plano entalpía–entropía y diagrama de Ellingham">
<p class="lead">La entalpía dice cuánto calor intercambia una reacción, pero no dice si ocurre. Para eso hace falta la energía de Gibbs, que combina entalpía y entropía en una sola cantidad con un criterio inequívoco: a \(T\) y \(P\) constantes, el sistema evoluciona hacia el menor \(G\). Este capítulo muestra cómo se obtienen las entropías absolutas gracias a la tercera ley, cómo se calcula \(\Delta_rG^\circ\) a cualquier temperatura y cómo la metalurgia lo organiza en un diagrama, el de Ellingham, que decide a qué temperatura se puede reducir un óxido con carbón.</p>

<section>
<h2>La tercera ley y las entropías absolutas</h2>
<p>La entalpía y la energía interna solo se conocen salvo una constante: lo que se mide son diferencias. Con la entropía ocurre algo distinto. Nernst (1906) observó que, al acercarse a 0 K, las entropías de reacción \(\Delta_rS\) de sustancias condensadas tienden a cero, y Planck (1911) lo reformuló como un postulado sobre la entropía misma:</p>
<div class="eq key" data-name="Tercera ley">\[\lim_{T\to0}S=0\quad\text{para un cristal perfecto en su estado de menor energía.}\]</div>
<p>Es lo que permite hablar de <span class="term">entropía absoluta</span>. Si se mide la capacidad calorífica desde temperaturas muy bajas, se calcula</p>
<div class="eq key" data-name="Entropía calorimétrica">\[S(T)=\int_0^{T_m}\frac{C_p^{(s)}}{T}\dd T+\frac{\Delta_{fus}H}{T_m}+\int_{T_m}^{T_b}\frac{C_p^{(l)}}{T}\dd T+\frac{\Delta_{vap}H}{T_b}+\int_{T_b}^{T}\frac{C_p^{(g)}}{T}\dd T,\]</div>
<p>con un término \(\Delta H_{trans}/T_{trans}\) por cada transición de fase (y por cada cambio de estructura cristalina). Como \(C_p\) se mide hasta unos 10 K y por debajo de eso se extrapola, la ley \(T^3\) de Debye, \(C_V=\tfrac{12\pi^4}{5}R\,(T/\theta_D)^3\), es esencial: en un aislante, la capacidad calorífica de la red cae con el cubo de la temperatura y su contribución a la entropía es pequeña.</p>
<div class="sim" data-sim="entropia-T" data-title="Entropía de un metal desde cero absoluto: red de Debye más electrones"></div>
<div class="sim-guide"><ul>
<li>La curva sube desde cero y se aplana en pendiente: la mayor parte de la entropía se acumula entre \(\theta/10\) y 300 K. A 10 K, la capacidad del cobre es 48 mJ/mol·K, idéntica a la fórmula de Debye.</li>
<li>Con la \(\theta_D\) calorimétrica de baja temperatura (Kittel), el modelo subestima la entropía de 298 K: 7 % en el cobre, 4 % en la plata, 9 % en el aluminio, 23 % en el zinc (muy anisótropo). Pruebe «Ajustar θ»: el cobre necesita \(\theta=310\) K en lugar de 343 K, el aluminio 384 K en lugar de 428 K. Los efectos anarmónicos y de dilatación hacen que la \(\theta\) efectiva disminuya con la temperatura.</li>
<li>La contribución electrónica \(\gamma T\) es 0.2 J/mol·K en el cobre y 2.1 J/mol·K en el níquel, una fracción pequeña que ayuda un poco.</li>
<li>La capacidad calorífica a 298 K, 23.4 J/mol·K para el cobre, está debajo del límite de Dulong–Petit (\(3R=24.94\)): la red clásica se alcanza solo a \(T\gg\theta_D\).</li>
</ul></div>
<h3>Entropía residual</h3>
<p>La tercera ley exige un cristal <em>perfecto</em>. Algunas sustancias quedan «congeladas» en un estado desordenado al enfriarse, y su entropía calorimétrica a 0 K no es cero. El caso clásico es el hielo: cada molécula de agua puede orientarse de varias maneras compatibles con las «reglas del hielo» (dos hidrógenos cerca y dos lejos de cada oxígeno). Pauling (1935) contó las configuraciones: \(W=(3/2)^N\), y</p>
<div class="eq">\[S_0=k_B\ln W=Nk_B\ln\tfrac32=R\ln1.5=3.37\ \mathrm{J/(mol\cdot K)},\]</div>
<p>muy cerca del valor medido por Giauque y Stout, \(3.41\pm0.2\) J/mol·K, que se obtiene comparando la entropía calorimétrica del vapor con la calculada por mecánica estadística. Para el CO, con orientaciones CO/OC casi equivalentes, el máximo es \(R\ln2=5.76\) J/mol·K; el valor medido es de unos 4.6 J/mol·K, porque el ordenamiento es parcial. Esta es la «prueba de Boltzmann» de la tercera ley: la entropía es el logaritmo de las configuraciones.</p>
</section>

<section>
<h2>Entropía de reacción</h2>
<p>Con entropías absolutas, la entropía estándar de reacción es simplemente \(\Delta_rS^\circ=\sum\nu_jS_j^\circ\), sin referirse a elementos. Su signo suele predecirse con una regla de dedo: <b>lo que domina es la variación del número de moles de gas</b>. Un mol de gas tiene una entropía de unos 150–200 J/mol·K, y un mol de sólido o líquido, de 30 a 150. Cada mol de gas que se forma aporta unos +130 J/mol·K, cada mol que se consume resta otro tanto.</p>
<div class="sim" data-sim="entropia-dn" data-title="Entropía de reacción frente al cambio en moles de gas, con datos NBS"></div>
<div class="sim-guide"><ul>
<li>Los 24 puntos se ordenan en una banda: a más moles de gas producidos, más positivo es \(\Delta_rS^\circ\). La recta de ajuste tiene una pendiente de +132 J/mol·K por mol de gas (\(r^2=0.94\)).</li>
<li>La síntesis de amoníaco (Δn = −2) tiene \(\Delta_rS^\circ=-198\) J/mol·K: es la razón de que el rendimiento caiga a alta temperatura (capítulo 5).</li>
<li>La excepción instructiva es la disolución del NaCl: Δn = 0 pero \(\Delta S^\circ=+43\) J/mol·K, por liberar iones de un cristal ordenado, aunque el agua se ordena en torno a ellos (se compensa en parte).</li>
<li>Las vaporizaciones (Δn = +1) a 298 K tienen \(\Delta S^\circ\) de 96 (benceno) a 121 J/mol·K (etanol), con 119 para el agua: superiores a la regla de Trouton (≈ 88 J/mol·K a la ebullición normal) porque el gas se toma a 1 bar y no a la presión de saturación.</li>
</ul></div>
</section>

<section>
<h2>La energía de Gibbs de reacción</h2>
<p>A \(T\) y \(P\) constantes, la energía de Gibbs \(G=H-TS\) disminuye en todo proceso espontáneo: \(\dd G\le0\). Para una reacción a temperatura \(T\),</p>
<div class="eq key" data-name="Energía de Gibbs de reacción">\[\Delta_rG^\circ=\Delta_rH^\circ-T\Delta_rS^\circ=\sum_j\nu_j\Delta_fG^\circ(j),\qquad \Delta_rG=\Delta_rG^\circ+RT\ln Q.\]</div>
<p>La primera igualdad vale para los estados estándar; la segunda es la forma general (con el cociente de reacción \(Q\), capítulo 5). Una reacción es <em>espontánea</em> si \(\Delta_rG<0\), pero esto solo dice que puede ocurrir: no dice qué tan rápido. El diamante tiene \(\Delta_fG^\circ=+2.9\) kJ/mol: se transforma lentamente en grafito, pero la barrera es enorme.</p>
<p>Derivando \(G/T\) respecto de \(T\) a presión constante se obtiene la <span class="term">ecuación de Gibbs–Helmholtz</span>, que da la dependencia con la temperatura sin tener que calcular \(\Delta S\):</p>
<div class="eq key" data-name="Gibbs–Helmholtz">\[\left(\pdv{(\Delta_rG^\circ/T)}{T}\right)_P=-\frac{\Delta_rH^\circ}{T^2}\qquad\Longleftrightarrow\qquad\left(\pdv{(\Delta_rG^\circ/T)}{(1/T)}\right)_P=\Delta_rH^\circ.\]</div>
<p>La pendiente de \(\Delta G^\circ/T\) frente a \(1/T\) es la entalpía de reacción. Si \(\Delta_rH^\circ\) y \(\Delta_rS^\circ\) son casi constantes, \(\Delta_rG^\circ(T)\) es una recta: con pendiente \(-\Delta_rS^\circ\) y ordenada \(\Delta_rH^\circ\).</p>
<h3>La competencia entre entalpía y entropía</h3>
<p>Hay cuatro casos según los signos de \(\Delta H\) y \(\Delta S\). Si \(\Delta H<0\) y \(\Delta S>0\), la reacción es espontánea siempre. Si \(\Delta H>0\) y \(\Delta S<0\), no lo es nunca. En los dos casos restantes hay una <em>temperatura de inversión</em> \(T=\Delta H/\Delta S\): las reacciones exotérmicas con \(\Delta S<0\) (síntesis de amoníaco) son espontáneas a baja temperatura, y las endotérmicas con \(\Delta S>0\) (calcinación de la caliza, descomposición térmica) lo son a alta.</p>
<div class="sim" data-sim="hs-plano" data-title="El plano ΔH – TΔS: dónde es espontánea una reacción a cada temperatura"></div>
<div class="sim-guide"><ul>
<li>El punto de cada reacción es \((\Delta H^\circ,\,T\Delta S^\circ)\). La reacción es espontánea si queda por encima de la diagonal \(\Delta G^\circ=0\) (zona verde). A 298 K son espontáneas 13 de las 24 reacciones; a 1000 K, 19.</li>
<li>Suba \(T\): los puntos con \(\Delta S>0\) suben (se hacen espontáneos) y los de \(\Delta S<0\) bajan. La síntesis de amoníaco cruza la diagonal a unos 460 K; la calcinación de la caliza, \(\Delta H=+179\) kJ/mol y \(\Delta S=+160\) J/mol·K, a 1120 K, por eso el horno de cal trabaja a más de 1100 K.</li>
<li>Los puntos de la zona inferior izquierda, como \(\mathrm{H_2+Cl_2\to2HCl}\) o la combustión del metano, tienen \(\Delta G^\circ\) muy negativo a cualquier \(T\): son prácticamente irreversibles.</li>
<li>La descomposición del agua líquida (\(2\mathrm{H_2O}\to2\mathrm{H_2}+\mathrm{O_2}\)) tiene \(\Delta H^\circ=+571.7\) kJ y \(\Delta G^\circ=+474.3\) kJ a 298 K: el trabajo mínimo de electrólisis, 237.1 kJ por mol de agua, equivale a 1.229 V (capítulo 13). Con datos a 298 K supuestos constantes, \(\Delta G^\circ\) se anula hacia 1750 K.</li>
</ul></div>
</section>

<section>
<h2>El diagrama de Ellingham</h2>
<p>Los metales se obtienen de sus óxidos reduciéndolos. H. J. T. Ellingham (1944) notó que, si se escribe la formación de cada óxido <b>por mol de \(\mathrm{O_2}\)</b>, \(\;2M+\mathrm{O_2}\to2M\mathrm O\), la reacción siempre consume un mol de gas y su \(\Delta S\) es casi la misma (unos −200 J/mol·K, la pérdida de la entropía del \(\mathrm{O_2}\)). Todas las rectas \(\Delta_fG^\circ(T)\) tienen casi la misma pendiente positiva y se distinguen por su ordenada, que mide lo estable que es el óxido. Cambian de pendiente cuando el metal funde o hierve, porque cambia su entropía.</p>
<p>Un óxido \(MO\) puede reducirse con carbono si la línea del \(\mathrm{C\to CO}\), de pendiente negativa (porque produce un mol de gas por cada mol de carbono), cae por debajo de la del óxido: \(MO+C\to M+CO\) tiene \(\Delta G^\circ<0\). El punto donde se cruzan es la temperatura mínima de reducción. Además, las líneas rectas que parten del origen del diagrama son líneas de <em>presión de oxígeno constante</em>, \(\Delta G^\circ=RT\ln p_{O_2}\): un óxido está en equilibrio con la presión de oxígeno que corresponde al punto de su línea.</p>
<div class="sim" data-sim="ellingham" data-title="Diagrama de Ellingham de los óxidos metálicos y del carbono"></div>
<div class="sim-guide"><ul>
<li>El óxido de hierro (FeO) se reduce con carbono a unos 1019 K (746 °C): es el orden de magnitud de la temperatura a la que, en el alto horno, el carbono y el CO reducen el último óxido a hierro metálico. El óxido de zinc se reduce a unos 1217 K, justo por encima del punto de ebullición del zinc (1180 K), de modo que el zinc sale como vapor y se condensa.</li>
<li>El SiO₂ (1892 K), el TiO₂ (1986 K), el MgO (2088 K) y el Al₂O₃ (2259 K) exigen temperaturas casi inalcanzables y por eso el aluminio se produce por electrólisis y el titanio mediante cloruros (proceso Kroll).</li>
<li>El Cu₂O se reduce con carbono desde unos 350 K y el NiO desde unos 700 K: son óxidos de metales «nobles». A 1000 K, el Cu₂O está en equilibrio con \(p_{O_2}=2.0\times10^{-10}\) bar, y por debajo de esa presión se descompone en cobre.</li>
<li>Los cambios de pendiente son visibles en el Mg (fusión a 923 K, ebullición a 1363 K) y en el Zn (693 K y 1180 K): al hervir el metal, el reactivo que desaparece ya es un gas de entropía alta, y la reacción pierde menos entropía: la pendiente de la línea del óxido disminuye.</li>
</ul></div>
<div class="box warn"><h4>Qué ignora el diagrama</h4><p>Aquí cada línea usa \(\Delta H^\circ\) y \(\Delta S^\circ\) a 298 K con correcciones por fusión y ebullición del metal, y no incluye las capacidades caloríficas ni la fusión de los óxidos ni los cambios de fase sólidos. El error en \(\Delta G^\circ\) es de unos pocos kJ por mol de \(\mathrm{O_2}\) (inferior a 2 % a 1000 K frente a las ecuaciones tabuladas de Gaskell para Mg, Al, Si y Fe), suficiente para ubicar las temperaturas de reducción dentro de 50 K. Un diagrama de trabajo usa tablas JANAF completas.</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Para \(\mathrm{CaCO_3(s)\to CaO(s)+CO_2(g)}\), \(\Delta H^\circ=+179.2\) kJ/mol y \(\Delta S^\circ=+160.2\) J/mol·K. ¿A qué temperatura se vuelve espontánea (con las aproximaciones habituales)?
<details><summary>Respuesta</summary><p>\(T=\Delta H/\Delta S=179\,200/160.2=1119\) K (846 °C). Es el punto en que \(K_p=1\) con \(p_{CO_2}=1\) bar; con \(p_{CO_2}=0.0004\) bar (aire) ocurre mucho antes.</p></details></li>
<li><span class="lvl">Básico</span>Con \(\Delta_fG^\circ\) de −394.36 (CO₂), −137.17 (CO) kJ/mol, halle \(\Delta G^\circ\) de \(\mathrm{CO_2+C(gr)\to2CO}\) y la \(T\) a la cual pasa a ser favorable.
<details><summary>Respuesta</summary><p>\(\Delta G^\circ=2(-137.17)+394.36=+120.0\) kJ/mol; \(\Delta H^\circ=+172.5\) kJ y \(\Delta S^\circ=+175.7\) J/mol·K, así que se vuelve favorable a \(T>172\,500/175.7=982\) K (equilibrio de Boudouard).</p></details></li>
<li><span class="lvl">Intermedio</span>El benceno líquido tiene \(S^\circ=173.4\) J/mol·K y el gas 269.2 J/mol·K. Con \(\Delta_{vap}H^\circ=+33.9\) kJ/mol a 298 K, halle \(\Delta_{vap}G^\circ\) y comente.
<details><summary>Respuesta</summary><p>\(\Delta S=95.8\) J/mol·K, \(\Delta G=33.9-298.15(0.0958)=+5.3\) kJ/mol. Es positivo: el benceno líquido no se evapora de forma espontánea <em>si la presión parcial del vapor es de 1 bar</em>; en el aire se evapora porque su presión parcial es mucho menor (\(\Delta G=\Delta G^\circ+RT\ln(p/p^\circ)\)). El equilibrio se da en \(p=p^\circ e^{-5300/2479}=0.12\) bar, la presión de vapor del benceno a 25 °C.</p></details></li>
<li><span class="lvl">Intermedio</span>Con \(\Delta H\) y \(\Delta S\) de la tabla NBS, \(2\mathrm{Fe}+\mathrm{O_2}\to2\mathrm{FeO}\) tiene \(\Delta G^\circ=-544.0+0.1382\,T\) kJ y \(2\mathrm{C}+\mathrm{O_2}\to2\mathrm{CO}\) tiene \(-221.1-0.1787\,T\) kJ. Halle la temperatura de reducción del FeO con carbono.
<details><summary>Respuesta</summary><p>Se igualan: \(-544.0+0.1382T=-221.1-0.1787T\), \(T=322.9/0.3169=1019\) K (746 °C). Con las ecuaciones de las tablas JANAF el valor es unos 1000 K.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre la ecuación de Gibbs–Helmholtz a partir de \(G=H-TS\) y \((\partial G/\partial T)_P=-S\).
<details><summary>Respuesta</summary><p>\(\dfrac{\partial(G/T)}{\partial T}=\dfrac1T\dfrac{\partial G}{\partial T}-\dfrac{G}{T^2}=-\dfrac{S}{T}-\dfrac{H-TS}{T^2}=-\dfrac{H}{T^2}\). Aplicada a la diferencia entre productos y reactivos da \(\partial(\Delta G^\circ/T)/\partial T=-\Delta H^\circ/T^2\).</p></details></li>
</ol>
