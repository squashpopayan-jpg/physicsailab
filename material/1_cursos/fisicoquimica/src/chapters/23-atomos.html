<p class="lead">El átomo de hidrógeno es el único sistema químico con solución exacta de la ecuación de Schrödinger, y de él salen el lenguaje de la química: los números cuánticos, los orbitales \(s,p,d,f\) y la tabla periódica. Todo lo demás es aproximación. Este capítulo resuelve el hidrógeno, plantea el primer problema de varios electrones (el helio) con el método variacional, y de ahí pasa a los átomos pesados con el apantallamiento y los términos espectroscópicos.</p>

<section>
<h2>El átomo de hidrógeno</h2>
<p>Con un electrón de carga \(-e\) y un núcleo de carga \(+Ze\), el hamiltoniano es \(\hat H=-\tfrac12\nabla^2-Z/r\) (u.a.). El potencial es central, así que la parte angular son los armónicos esféricos \(Y_l^m\) del capítulo 22 y \(\psi_{nlm}=R_{nl}(r)Y_l^m(\theta,\phi)\), con</p>
<div class="eq key" data-name="Hidrogenoides">\[E_n=-\frac{Z^2}{2n^2}\ \text{(Eh)},\quad R_{nl}\propto\rho^{\,l}e^{-\rho/2}L_{n-l-1}^{2l+1}(\rho),\ \rho=\frac{2Zr}{n},\quad\langle r\rangle=\frac{3n^2-l(l+1)}{2Z}a_0.\]</div>
<p>Los números cuánticos son enteros con \(n\ge1\), \(0\le l\le n-1\), \(-l\le m\le l\), más el espín \(m_s=\pm\tfrac12\). La energía solo depende de \(n\), de modo que cada nivel tiene \(n^2\) orbitales (\(2n^2\) con espín): degeneración accidental del potencial coulombiano que desaparece en los átomos con varios electrones. Cada función radial tiene \(n-l-1\) nodos. Con \(E_1=-0.5\) Eh \(=-13.606\) eV, las transiciones entre niveles reproducen la fórmula empírica de Rydberg (1888): \(\tilde\nu=R_\mathrm H(1/n_1^2-1/n_2^2)\) con \(R_\mathrm H=109\,677.6\) cm⁻¹ (que incluye la masa reducida del electrón); la línea H\(\alpha\) de Balmer (\(3\to2\)) cae en \(1/(109677.6\times5/36)=656.5\) nm (en el vacío; 656.3 en aire), la línea roja del hidrógeno de las nebulosas.</p>
<div class="sim" data-sim="hidrogeno" data-title="Átomo hidrogenoide: densidad radial y orbitales en el plano xz"></div>
<div class="sim-guide"><ul>
<li>Con \(n=3\), \(l=1\) (el orbital 3p) la densidad radial tiene un nodo y dos máximos, el principal a 12 bohr; \(\langle r\rangle=12.5\) bohr, 8 veces el tamaño del 1s (\(\langle r\rangle=1.5\)). \(E=-0.0556\) Eh \(=-1.51\) eV. El mapa muestra el orbital p con dos lóbulos de signo opuesto y un plano nodal; hay un anillo nodal adicional por el nodo radial.</li>
<li>Con \(l=0\) los orbitales \(s\) tienen densidad finita en el núcleo (los únicos); \(2s\) tiene \(\langle r\rangle=6\) bohr y un nodo. Suba \(Z\) a 2 (He⁺): todas las distancias se reducen a la mitad y las energías se multiplican por 4: \(E_{1s}=-2\) Eh \(=-54.4\) eV.</li>
<li>Cambie \(m\) entre \(0\) y \(\pm l\): se obtienen los \(2l+1\) orbitales reales de la subcapa (\(p_z\), \(p_x\); \(d_{z^2}\), \(d_{xz}\), \(d_{x^2-y^2}\)...). Todos tienen la misma energía y la misma función radial.</li>
</ul></div>
</section>

<section>
<h2>Helio: el primer problema de muchos cuerpos</h2>
<p>Con dos electrones aparece la repulsión \(1/r_{12}\), que impide separar el problema en variables: ya no hay solución exacta, y es el momento del <span class="term">principio variacional</span>: para cualquier función de prueba normalizada \(\tilde\psi\), \(\langle\tilde\psi|\hat H|\tilde\psi\rangle\ge E_0\), de modo que cuanto más baja la energía, mejor la función. Se propone una función simple (producto de dos orbitales 1s con una carga \(\zeta\) a determinar, que representa la carga efectiva vista por cada electrón):</p>
<div class="eq key" data-name="Helio variacional (Z = 2)">\[\tilde\psi=\tfrac{\zeta^3}{\pi}e^{-\zeta(r_1+r_2)},\quad E(\zeta)=\zeta^2-2Z\zeta+\tfrac58\zeta\ \Rightarrow\ \zeta=Z-\tfrac5{16}=1.6875,\ E=-\left(Z-\tfrac5{16}\right)^2.\]</div>
<p>El primer término es la energía cinética, el segundo la atracción nuclear, el tercero la repulsión entre electrones (\(\langle1/r_{12}\rangle=5\zeta/8\)). El resultado, \(-2.8477\) Eh, difiere del valor exacto no relativista (Pekeris, \(-2.9037\) Eh) en 1.9 %: el error de la energía total es pequeño, pero equivale a 1.5 eV en una energía de ionización de 24.6 eV. Que \(\zeta=1.6875<2\) expresa el <span class="term">apantallamiento</span>: cada electrón ve el núcleo parcialmente tapado por el otro (\(\sigma=0.3125\)). Para mejorarla hace falta incluir la correlación electrónica (Hylleraas, 1929; capítulo 25).</p>
<div class="sim" data-sim="helio" data-title="Helio y sus isoelectrónicos: energía variacional frente al exponente de prueba"></div>
<div class="sim-guide"><ul>
<li>Para He (\(Z=2\)) el mínimo está en \(\zeta=1.6875\) con \(E=-2.8477\) Eh; sin repulsión sería \(-4\) Eh y la exacta es \(-2.9037\). La energía de ionización variacional es 23.1 eV frente a 24.59 eV experimentales. Para Li⁺ (\(Z=3\)): \(\zeta=2.6875\), \(E=-7.2227\) Eh frente a \(-7.2799\) (error de 0.8 %); el error relativo baja al subir \(Z\), porque la repulsión pesa cada vez menos frente a la atracción nuclear.</li>
<li>Para el ion hidruro H⁻ (\(Z=1\)) la función da \(E=-0.4727\) Eh, <em>por encima</em> de \(-0.5\) (el H más un electrón infinitamente alejado): predice que H⁻ no está ligado, y está ligado (afinidad electrónica 0.754 eV, \(E=-0.5278\) Eh). La función de un solo parámetro es demasiado rígida para un electrón que debe quedar lejos del otro: es la manifestación de la correlación.</li>
</ul></div>
<div class="box note"><h4>Espín y Pauli</h4><p>La función de onda total de dos electrones debe ser <em>antisimétrica</em> ante el intercambio de ambos (principio de exclusión de Pauli, 1925). En el estado fundamental del helio la parte espacial es simétrica y la de espín, el singlete \((\alpha\beta-\beta\alpha)/\sqrt2\), antisimétrica. En el primer estado excitado hay dos opciones: singlete (parahelio) o triplete (ortohelio); el triplete tiene menor energía (0.8 eV) porque la parte espacial antisimétrica mantiene a los electrones más separados: la <em>energía de intercambio</em> es el origen de la regla de Hund.</p></div>
</section>

<section>
<h2>Átomos con muchos electrones: apantallamiento y periodicidad</h2>
<p>En la aproximación orbital cada electrón ocupa un orbital hidrogenoide con una carga nuclear efectiva \(Z^*=Z-\sigma\), donde \(\sigma\) mide cuánto lo tapan los demás. La energía de un electrón en un orbital con número cuántico principal efectivo \(n\) es \(-Z^{*2}/2n^2\). Las <em>reglas de Slater</em> (1930) dan \(\sigma\) por receta: para un electrón en el grupo \((ns,np)\), cada otro electrón del mismo grupo apantalla 0.35 (0.30 si es 1s), cada electrón de la capa \(n-1\) apantalla 0.85 y los más internos, 1.00. La energía total del átomo es la suma de las energías de los electrones, y la energía de ionización, la diferencia entre el catión y el neutro.</p>
<p>La tabla periódica es esa regla en acción. Al recorrer un período de izquierda a derecha, \(Z^*\) crece 0.65 por electrón (los electrones de la misma capa se apantallan mal entre sí, 0.35 en lugar de 1): el átomo se contrae y la energía de ionización aumenta. Al pasar al siguiente período entra una capa nueva y \(Z^*\) cae (de 5.85 en Ne a 2.20 en Na): ahí está la causa del salto entre gas noble y alcalino.</p>
<div class="sim" data-sim="ie-periodo" data-title="Primera energía de ionización de los elementos H–Ar: reglas de Slater y NIST"></div>
<div class="sim-guide"><ul>
<li>Las reglas de Slater reproducen la tendencia general y los saltos entre períodos: Li (\(Z^*=1.30\)), 5.75 eV (experimento, 5.39); Na (\(Z^*=2.20\)), 7.3 eV (5.14). También el orden de magnitud: C, 11.5 eV (11.26); O, 14.2 eV (13.62).</li>
<li>No captan lo que el experimento muestra con claridad: las energías de ionización <em>caen</em> de Be a B (9.32 → 8.30 eV) y de N a O (14.53 → 13.62 eV). Slater da el mismo \(Z^*\) a 2s y a 2p y, por tanto, Be (7.9) por debajo de B (9.8). El B tiene un electrón en un orbital 2p, que penetra menos hacia el núcleo que el 2s y está más apantallado; el O tiene un par apareado en un 2p, con repulsión extra, y el N, con subcapa semillena (\(\mathrm{2p^3}\), exceso de intercambio), es particularmente estable. Los cálculos Hartree–Fock del capítulo 25 recuperan estas variaciones.</li>
<li>El error de las reglas de Slater crece de izquierda a derecha en cada período (Ne: 16.0 frente a 21.6 eV) porque no distinguen entre \(s\) y \(p\) ni incluyen intercambio.</li>
</ul></div>
</section>

<section>
<h2>Términos de Russell–Saunders y reglas de Hund</h2>
<p>Una configuración como \(\mathrm{p^2}\) no corresponde a una sola energía: los dos electrones pueden acoplarse de varias maneras, con repulsiones diferentes. Si el acoplamiento espín–órbita es débil (átomos ligeros, esquema de Russell–Saunders), los momentos angulares orbitales se suman en \(L\) y los de espín en \(S\), y cada pareja \((L,S)\) es un <span class="term">término</span> \({}^{2S+1}L\) con degeneración \((2L+1)(2S+1)\). Los términos permitidos se obtienen contando los <em>microestados</em> (\(M_L\), \(M_S\)) compatibles con el principio de Pauli: la configuración \(l^n\) tiene \(\binom{2(2l+1)}{n}\) de ellos. Las reglas de Hund (1925) ordenan los términos de una configuración: (1) menor energía el de mayor \(S\); (2) con igual \(S\), el de mayor \(L\); (3) el nivel \(J\) menor si la subcapa está menos que semillena, el mayor si está más que semillena.</p>
<div class="sim" data-sim="terminos" data-title="Términos permitidos de las configuraciones pⁿ y dⁿ, y término fundamental de Hund"></div>
<div class="sim-guide"><ul>
<li>\(\mathrm p^2\) (C, Si): \({}^3\mathrm P\), \({}^1\mathrm D\), \({}^1\mathrm S\), con degeneraciones 9, 5 y 1 que suman los 15 microestados \(\binom62\). El fundamental es \({}^3\mathrm P\) (Hund). \(\mathrm p^3\) (N, P): \({}^4\mathrm S\), \({}^2\mathrm D\), \({}^2\mathrm P\), suman \(\binom63=20\), con \({}^4\mathrm S\) fundamental. \(\mathrm p^4\) tiene los mismos términos que \(\mathrm p^2\) (huecos).</li>
<li>\(\mathrm d^2\) (Ti, Zr): \({}^3\mathrm F\), \({}^3\mathrm P\), \({}^1\mathrm G\), \({}^1\mathrm D\), \({}^1\mathrm S\) (45 microestados); el fundamental es \({}^3\mathrm F\). \(\mathrm d^3\) tiene 8 términos y 120 microestados (\({}^4\mathrm F\) fundamental, y \({}^2\mathrm D\) aparece dos veces). \(\mathrm d^5\) (Mn²⁺, Fe³⁺): 16 términos y 252 microestados, con \({}^6\mathrm S\) como fundamental (la subcapa semillena, de máximo espín).</li>
<li>Estos términos son los que etiquetan los espectros atómicos y, con el campo cristalino, los colores de los complejos de los metales de transición: el rubí, el esmeralda, el Fe(III) amarillo pálido (por el \({}^6\mathrm S\), sin transiciones permitidas por espín) son consecuencias de ellos.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule la longitud de onda de la línea de Balmer H\(\beta\) (\(4\to2\)) con \(R_\mathrm H=109\,677.6\) cm⁻¹, y la energía de ionización del He⁺ (\(Z=2\)) en eV.
<details><summary>Respuesta</summary><p>\(\tilde\nu=109677.6(1/4-1/16)=20\,564.5\) cm⁻¹, \(\lambda=486.3\) nm (azul-verdosa). He⁺: \(IE=Z^2\times13.606=54.42\) eV.</p></details></li>
<li><span class="lvl">Básico</span>Calcule \(Z^*\) del electrón de valencia del cloro (\(1s^22s^22p^63s^23p^5\)) con las reglas de Slater.
<details><summary>Respuesta</summary><p>Mismo grupo (3s, 3p): 6 electrones × 0.35 = 2.10; capa \(n-1\) (8 electrones) × 0.85 = 6.80; internas (2) × 1.00 = 2.00. \(\sigma=10.90\), \(Z^*=17-10.90=6.10\).</p></details></li>
<li><span class="lvl">Intermedio</span>Con la función variacional del helio, calcule \(\zeta\) y \(E\) para Li⁺ y el error frente a \(-7.2799\) Eh. ¿Y su energía de ionización (a Li²⁺, \(E=-4.5\) Eh)?
<details><summary>Respuesta</summary><p>\(\zeta=3-5/16=2.6875\), \(E=-2.6875^2=-7.2227\) Eh; error de 0.057 Eh (0.8 %). \(IE=-4.5-(-7.2227)=2.7227\) Eh \(=74.09\) eV (experimento: 75.64 eV).</p></details></li>
<li><span class="lvl">Intermedio</span>Obtenga los términos de \(\mathrm p^2\) a partir de los microestados y verifique que suman 15.
<details><summary>Respuesta</summary><p>El máximo \(M_L=2\) (ambos en \(m_l=+1\)) solo ocurre con \(M_S=0\): hay un término \({}^1\mathrm D\) (\(L=2\), \(S=0\); 5 microestados). El máximo \(M_S=1\) con \(M_L=1\) (\(m_l=1,0\) con espines paralelos) da \({}^3\mathrm P\) (9). Queda un microestado con \(M_L=0\), \(M_S=0\): \({}^1\mathrm S\). Suma: \(5+9+1=15=\binom62\).</p></details></li>
<li><span class="lvl">Avanzado</span>Deduzca \(E(\zeta)=\zeta^2-2Z\zeta+5\zeta/8\) para dos electrones en orbitales 1s de exponente \(\zeta\), dado que \(\langle1/r_{12}\rangle=5\zeta/8\), y minimice.
<details><summary>Respuesta</summary><p>Para un 1s de exponente \(\zeta\): \(\langle T\rangle=\zeta^2/2\), \(\langle1/r\rangle=\zeta\). Por electrón, \(\langle-\tfrac12\nabla^2-Z/r\rangle=\zeta^2/2-Z\zeta\); para dos, \(\zeta^2-2Z\zeta\). Con la repulsión: \(E=\zeta^2-2Z\zeta+\tfrac58\zeta\). \(\mathrm dE/\mathrm d\zeta=2\zeta-2Z+\tfrac58=0\Rightarrow\zeta=Z-\tfrac5{16}\), y \(E=-\zeta^2\) (la energía en el mínimo es \(-\zeta^2\) por el teorema del virial).</p></details></li>
</ol>
