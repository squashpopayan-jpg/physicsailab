<p class="lead">Una reacción se acelera cuando se calienta, y lo hace de manera muy desigual: algunas apenas notan diez grados y otras se multiplican por diez. Svante Arrhenius dio en 1889 la ley empírica que describe ese comportamiento con una sola energía, la energía de activación. Un siglo de teoría después, la teoría de colisiones y la del estado de transición explican qué significa esa energía y de dónde sale el factor que la acompaña. Este capítulo recorre ambas con las constantes de velocidad de reacciones elementales reales, las de la combustión de GRI-Mech.</p>

<section>
<h2>La ecuación de Arrhenius</h2>
<p>La constante de velocidad de casi todas las reacciones elementales crece exponencialmente con la temperatura. Arrhenius (1889), a partir de los datos de van't Hoff sobre la inversión de la sacarosa, propuso</p>
<div class="eq key" data-name="Ecuación de Arrhenius">\[k=A\,e^{-E_a/RT},\qquad\ln k=\ln A-\frac{E_a}{R}\frac1T.\]</div>
<p>Una gráfica de \(\ln k\) frente a \(1/T\) es una recta de pendiente \(-E_a/R\) y ordenada \(\ln A\). La <span class="term">energía de activación</span> \(E_a\) es la barrera que las moléculas deben superar; \(A\), el <em>factor preexponencial</em>, mide con qué frecuencia lo intentan. Con dos temperaturas, \(\ln(k_2/k_1)=-\tfrac{E_a}R\left(\tfrac1{T_2}-\tfrac1{T_1}\right)\): una barrera de 50 kJ/mol multiplica \(k\) por 2.2 al pasar de 25 a 37 °C, la razón de que las enzimas trabajen más rápido en el cuerpo humano que en la mesa; una de 100 kJ/mol multiplica la velocidad por 4.8.</p>
<p>Con la dependencia de \(A\) con la temperatura, los químicos de la combustión escriben la ecuación de Arrhenius modificada, \(k=AT^b\exp(-E_0/RT)\), de la que \(E_a=E_0+bRT\) y la gráfica deja de ser recta: es la forma que usan GRI-Mech y los mecanismos de combustión.</p>
<div class="sim" data-sim="arrhenius-gri" data-title="Constantes de velocidad de reacciones elementales reales frente a la temperatura"></div>
<div class="sim-guide"><ul>
<li>\(\mathrm{H+O_2\to OH+O}\), la reacción más importante de la combustión del hidrógeno y de los hidrocarburos («ramificación de la cadena»): \(E_0=71.3\) kJ/mol, y a 1000 K su \(E_a\) aparente, \(E_0+bRT\), es 65.7 kJ/mol; \(k=4.9\times10^{10}\) cm³/mol·s a 1000 K y se duplica (×2.05) al llegar a 1100 K.</li>
<li>\(\mathrm{CO+OH\to CO_2+H}\) tiene \(E_0=0.3\) kJ/mol: la barrera casi no existe y la velocidad depende poco de la temperatura. Es la reacción que convierte el CO en CO₂ en las llamas y en la atmósfera.</li>
<li>\(\mathrm{NCO+NO\to CO+N_2O}\) tiene una energía de activación aparente <em>negativa</em>: \(E_0=3.1\) kJ/mol y \(b=-1.52\), de modo que \(E_a=E_0+bRT=-3.2\) kJ/mol a 500 K y \(k\) es más pequeña al calentar. No viola nada: la reacción pasa por un complejo de encuentro de vida corta cuya formación se desfavorece con la temperatura (capítulo 18).</li>
<li>\(\mathrm{CH_4+OH\to CH_3+H_2O}\), de \(E_0=13\) kJ/mol, es el sumidero del metano en la atmósfera: a 300 K su constante es de \(5\times10^{9}\) cm³/mol·s (la medida atmosférica es \(3.9\times10^{9}\)) y es lo que limita la vida del metano a unos diez años.</li>
</ul></div>
</section>

<section>
<h2>Teoría de colisiones</h2>
<p>La primera explicación molecular de la ecuación de Arrhenius (Trautz, 1916; Lewis, 1918) supone que dos moléculas reaccionan si chocan y si la energía relativa a lo largo de la línea de centros supera una energía umbral \(E_0\). El número de colisiones por unidad de volumen y tiempo entre moléculas de dos clases viene de la teoría cinética de los gases (Maxwell–Boltzmann), con sección eficaz \(\sigma\) y velocidad relativa media \(\bar c_{rel}=\sqrt{8k_BT/\pi\mu}\). La fracción de ellas con energía suficiente es \(e^{-E_0/RT}\):</p>
<div class="eq key" data-name="Teoría de colisiones">\[k=P\,\sigma\sqrt{\frac{8k_BT}{\pi\mu}}\,N_A\,e^{-E_0/RT},\qquad E_a=E_0+\tfrac12RT.\]</div>
<p>El <span class="term">factor estérico</span> \(P\) (entre 1 y \(10^{-6}\)) mide la fracción de colisiones con la orientación adecuada. La teoría explica la exponencial: aunque la temperatura sube solo un poco, la fracción de moléculas en la cola de alta energía de la distribución crece mucho, porque \(e^{-E_0/RT}\) cambia de manera rapidísima. Para \(E_0=70\) kJ/mol a 1000 K, la fracción es de solo 2.2×10⁻⁴.</p>
<div class="sim" data-sim="colisiones" data-title="Distribución de energías de colisión, cola de alta energía y teoría de colisiones"></div>
<div class="sim-guide"><ul>
<li>La fracción sombreada es \(e^{-E_0/RT}\). Con \(E_0=71\) kJ/mol y \(T\) de 1000 K, la fracción vale \(2\times10^{-4}\); si la temperatura sube solo 10 K, crece 8.8 %. A 300 K con el mismo \(E_0\), la fracción se multiplica por 2.5 al subir 10 K. La regla de «duplicar cada diez grados» corresponde a \(E_0\approx50\)–55 kJ/mol cerca de 300 K y falla a altas temperaturas.</li>
<li>El resultado de la teoría para \(\mathrm{H+O_2}\) a 1000 K, con \(\sigma=0.21\) nm² (del tamaño de las moléculas), es \(1.1\times10^{11}\) cm³/mol·s, frente a \(4.9\times10^{10}\) del mecanismo: un factor estérico \(P=0.44\) (a 500 K, \(P=0.99\); a 2000 K, 0.19). Para reacciones entre átomos y moléculas pequeñas, \(P\) es del orden de 0.1–1; para reacciones entre moléculas grandes puede ser \(10^{-3}\) o menos.</li>
<li>Para barreras muy pequeñas (\(E_0\to0\)) la teoría da el límite de la reacción controlada por el encuentro (\(k\sim10^{14}\)–\(10^{15}\) cm³/mol·s en gases): es el techo de las reacciones bimoleculares.</li>
</ul></div>
</section>

<section>
<h2>Teoría del estado de transición</h2>
<p>La teoría de colisiones trata las moléculas como esferas duras y no sabe nada de enlaces. Eyring (1935) y Evans y Polanyi propusieron mirar la reacción sobre su <em>superficie de energía potencial</em>: los reactivos están en un valle, los productos en otro, y el camino de menor energía entre ellos pasa por un punto de silla, el <span class="term">estado de transición</span> (‡). Se supone que los reactivos están en cuasiequilibrio con ese complejo, y que cada complejo que cruza la silla se convierte en productos con la frecuencia \(k_BT/h\) (la de un modo de vibración blando, \(h\nu\approx k_BT\)). El resultado es</p>
<div class="eq key" data-name="Ecuación de Eyring">\[k=\kappa\,\frac{k_BT}{h}\,K^\ddagger=\kappa\,\frac{k_BT}{h}\,e^{-\Delta^\ddagger G^\circ/RT}=\kappa\,\frac{k_BT}{h}\,e^{\Delta^\ddagger S^\circ/R}\,e^{-\Delta^\ddagger H^\circ/RT}.\]</div>
<p>donde \(\kappa\) (casi 1) es el coeficiente de transmisión y \(\Delta^\ddagger G\), \(\Delta^\ddagger H\), \(\Delta^\ddagger S\) son las energía de Gibbs, entalpía y entropía de activación (el estado estándar es el de 1 mol/L). Comparada con Arrhenius, \(E_a=\Delta^\ddagger H+RT\) para una reacción unimolecular, y \(A=e\,(k_BT/h)\,e^{\Delta^\ddagger S/R}\). El factor \(k_BT/h=6.2\times10^{12}\) s⁻¹ a 298 K es una «frecuencia universal»: el máximo de una reacción unimolecular sin barrera. La entropía de activación da información que \(E_a\) no tiene: es <em>negativa</em> cuando el estado de transición es más ordenado que los reactivos (dos moléculas que se unen), y <em>positiva</em> cuando está más suelto (un enlace que se estira).</p>
<p>Con \(\Delta^\ddagger G\) a 298 K se estima la vida media de una reacción: 60 kJ/mol da \(t_{1/2}=3.6\) ms; 80 kJ/mol, 12 s; 100 kJ/mol, 10 horas; 120 kJ/mol, 3.7 años. Cada 5.7 kJ/mol de \(\Delta^\ddagger G\) multiplican la velocidad por 10: es la regla que usa un químico para decidir si una reacción ocurre a temperatura ambiente, y por qué una rotación de un enlace C–C (\(\Delta G^\ddagger\approx12\) kJ/mol) es instantánea y la racemización de un compuesto quiral (\(\Delta G^\ddagger\approx100\) kJ/mol) toma horas.</p>
<div class="sim" data-sim="eyring" data-title="Estado de transición: la gráfica de Eyring y la velocidad en función de ΔG‡"></div>
<div class="sim-guide"><ul>
<li>Con \(\Delta H^\ddagger=80\) kJ/mol y \(\Delta S^\ddagger=-40\) J/mol·K a 298 K, \(\Delta G^\ddagger=91.9\) kJ/mol, \(k=4.8\times10^{-4}\) s⁻¹ y \(t_{1/2}=24\) min. La gráfica de Eyring de \(\ln(k/T)\) frente a \(1/T\) es una recta de pendiente \(-\Delta H^\ddagger/R\) y ordenada \(\ln(k_B/h)+\Delta S^\ddagger/R\): así se miden entalpía y entropía de activación.</li>
<li>Con \(\Delta S^\ddagger\) positivo (un enlace que se rompe) la reacción es más rápida de lo que sugiere \(\Delta H^\ddagger\): un cambio de +100 J/mol·K multiplica \(k\) por \(e^{12}=1.7\times10^5\). Con \(\Delta S^\ddagger\) negativo (por ejemplo, −100 J/mol·K de una reacción que une dos moléculas) la frena por un factor igual.</li>
<li>La curva de \(\log k\) frente a \(\Delta G^\ddagger\) (derecha) es una recta de pendiente \(-1/(RT\ln10)=-0.175\) por kJ/mol: cada 5.7 kJ/mol de barrera cambia la velocidad por un factor 10.</li>
</ul></div>
<div class="box note"><h4>Compensación entalpía–entropía</h4><p>En una serie de reacciones parecidas, los valores medidos de \(\Delta^\ddagger H\) y \(\Delta^\ddagger S\) suelen alinearse en una recta (la «temperatura isocinética»): parte de esa correlación es física (cambios del disolvente) y parte, un artefacto estadístico porque ambos se calculan de la misma gráfica con errores correlacionados. Conviene mirar siempre la \(\Delta G^\ddagger\), que se mide mucho mejor.</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una reacción tiene \(k=2.0\times10^{-3}\) s⁻¹ a 300 K y \(8.0\times10^{-3}\) s⁻¹ a 310 K. Halle \(E_a\).
<details><summary>Respuesta</summary><p>\(E_a=R\ln(4)/(1/300-1/310)=8.3145(1.386)/(1.075\times10^{-4})=107\) kJ/mol.</p></details></li>
<li><span class="lvl">Básico</span>¿Por qué factor se acelera una reacción con \(E_a=60\) kJ/mol al pasar de 25 °C a 35 °C?
<details><summary>Respuesta</summary><p>\(\ln(k_2/k_1)=\dfrac{60\,000}{8.3145}\left(\dfrac1{298.15}-\dfrac1{308.15}\right)=0.786\); factor 2.19.</p></details></li>
<li><span class="lvl">Intermedio</span>Con \(\Delta^\ddagger H=50\) kJ/mol y \(\Delta^\ddagger S=-100\) J/mol·K, calcule \(k\) a 298 K y la vida media.
<details><summary>Respuesta</summary><p>\(\Delta^\ddagger G=50-298.15(-0.100)=79.8\) kJ/mol. \(k=(k_BT/h)e^{-\Delta G^\ddagger/RT}=6.21\times10^{12}e^{-32.2}=6.2\times10^{12}\times1.0\times10^{-14}=0.063\) s⁻¹, \(t_{1/2}=11\) s.</p></details></li>
<li><span class="lvl">Intermedio</span>Con la teoría de colisiones, estime \(k\) de \(\mathrm A+\mathrm B\) a 400 K si \(\sigma=0.5\) nm², \(\mu=20\) u, \(E_0=40\) kJ/mol y \(P=1\).
<details><summary>Respuesta</summary><p>\(\bar c=\sqrt{8(1.381\times10^{-23})(400)/(\pi\,20\times1.661\times10^{-27})}=652\) m/s. \(\sigma\bar cN_A=0.5\times10^{-18}(652)(6.022\times10^{23})=1.96\times10^{8}\) m³/mol·s. \(e^{-40000/(8.3145\times400)}=6.0\times10^{-6}\). \(k=1.2\times10^{3}\) m³/mol·s = \(1.2\times10^{6}\) L/mol·s.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que, para una reacción unimolecular, \(E_a=\Delta^\ddagger H+RT\) y \(A=e\,(k_BT/h)\,e^{\Delta^\ddagger S/R}\).
<details><summary>Respuesta</summary><p>\(\ln k=\ln(k_B/h)+\ln T+\Delta S/R-\Delta H/RT\). \(E_a=-R\,\dd\ln k/\dd(1/T)=RT^2\,\dd\ln k/\dd T=RT^2(1/T+\Delta H/RT^2)=RT+\Delta H\). Entonces \(k=A\,e^{-E_a/RT}\) con \(A=k\,e^{E_a/RT}=(k_BT/h)e^{\Delta S/R}e^{-\Delta H/RT}e^{(\Delta H+RT)/RT}=e\,(k_BT/h)e^{\Delta S/R}\).</p></details></li>
</ol>
