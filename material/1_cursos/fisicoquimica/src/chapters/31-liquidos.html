<template class="chapter-src" data-id="liquidos" data-num="31" data-title="Líquidos y gases densos" data-part="Parte VI · Mecánica estadística" data-short="Interacción de Lennard–Jones, función de distribución radial g(r), relación de g(r) con las propiedades termodinámicas, simulación Monte Carlo de Metropolis, coordinación de los líquidos, desarrollo del virial, segundo coeficiente virial y temperatura de Boyle">
<p class="lead">Un gas ideal no tiene estructura y un cristal la tiene a largo alcance; un líquido está en medio: sus moléculas se tocan, pero sin orden duradero. La estadística de los líquidos se resume en una función, la distribución radial \(g(r)\), que dice cuántos vecinos hay a una distancia \(r\) respecto de lo que habría en un gas ideal. En este capítulo se simula un fluido de Lennard–Jones con el método de Monte Carlo (en el navegador, con 108 partículas), se lee en \(g(r)\) la estructura de un líquido, y se calcula con la misma interacción el segundo coeficiente virial que corrige la ley de los gases del capítulo 2.</p>

<section>
<h2>La interacción de Lennard–Jones</h2>
<p>La energía de dos átomos de gas noble (o de dos moléculas pequeñas casi esféricas) se describe bien con el potencial de Lennard–Jones (1924):</p>
<div class="eq key" data-name="Potencial de Lennard–Jones 12-6">\[u(r)=4\varepsilon\left[\left(\frac\sigma r\right)^{12}-\left(\frac\sigma r\right)^6\right],\qquad r_\mathrm{min}=2^{1/6}\sigma,\quad u(r_\mathrm{min})=-\varepsilon.\]</div>
<p>El término \(r^{-6}\) es la atracción de dispersión de London (dipolos instantáneos inducidos, capítulo 7); el \(r^{-12}\) es una repulsión de corto alcance elegida por conveniencia matemática (la real es exponencial). Con dos parámetros (\(\varepsilon\), \(\sigma\)) se reproducen las propiedades de los gases nobles: argón, \(\varepsilon/k_B=119.8\) K y \(\sigma=3.405\) Å. Las propiedades de un fluido de LJ en unidades reducidas (\(T^*=k_BT/\varepsilon\), \(\rho^*=\rho\sigma^3\), \(P^*=P\sigma^3/\varepsilon\)) son <em>universales</em>: es el principio de los estados correspondientes (van der Waals, 1873). Su punto crítico es \(T_c^*\approx1.31\), \(\rho_c^*\approx0.31\), y el triple, \(T^*\approx0.69\).</p>
</section>

<section>
<h2>La función de distribución radial</h2>
<p>Sea \(\rho\) la densidad numérica media. El número medio de partículas en una capa esférica \([r,r+\dd r]\) alrededor de una partícula dada es \(\rho\,g(r)\,4\pi r^2\dd r\): \(g(r)\to1\) cuando no hay correlación (gas ideal o \(r\to\infty\)). En un gas diluido, \(g(r)=e^{-u(r)/k_BT}\); en un cristal, picos agudos; en un líquido, un primer pico a \(r\approx\sigma\) (las partículas empaquetadas), un segundo pico más suave a \(\approx2\sigma\) y un decaimiento a 1 en pocos diámetros. La integral hasta el primer mínimo es el <em>número de coordinación</em>. Si las fuerzas son de pares, \(g(r)\) determina toda la termodinámica:</p>
<div class="eq key" data-name="Ecuaciones de la energía, de la presión y de la compresibilidad">\[\frac UN=\frac32k_BT+2\pi\rho\int_0^\infty u(r)g(r)r^2\dd r,\quad\frac P{\rho k_BT}=1-\frac{2\pi\rho}{3k_BT}\int_0^\infty\frac{\dd u}{\dd r}\,g(r)\,r^3\dd r,\quad\rho k_BT\kappa_T=1+4\pi\rho\int_0^\infty\bigl[g(r)-1\bigr]r^2\dd r.\]</div>
<p>Y \(g(r)\) se mide: la difracción de rayos X o de neutrones da el factor de estructura \(S(k)=1+\rho\int[g-1]e^{i\mathbf k\cdot\mathbf r}\dd\mathbf r\), cuya transformada de Fourier es \(g(r)\) (Debye, Zernike, Prins, 1930; la estructura del agua líquida, 1930s–hoy).</p>
</section>

<section>
<h2>Simulación Monte Carlo</h2>
<p>Con \(N\) partículas y la integral configuracional en \(3N\) dimensiones, la estadística exacta es inabordable: se muestrea. El algoritmo de Metropolis (Metropolis, Rosenbluth, Rosenbluth, Teller y Teller, 1953; uno de los diez algoritmos que más influyeron en la ciencia del siglo XX) genera configuraciones con probabilidad proporcional al factor de Boltzmann: (1) se elige una partícula al azar y se la desplaza una cantidad aleatoria; (2) se calcula el cambio de energía \(\Delta U\); (3) si \(\Delta U\le0\), se acepta; si no, se acepta con probabilidad \(e^{-\Delta U/k_BT}\); (4) se repite; se promedian las magnitudes sobre la cadena. Se usa una celda cúbica con condiciones periódicas (convención de imagen mínima), un radio de corte con corrección de cola (\(g=1\) más allá), y un paso de desplazamiento ajustado para ~50 % de aceptación. La presión se obtiene de la <em>ecuación del virial</em> del enunciado anterior.</p>
<div class="sim" data-sim="lj-mc" data-title="Simulación Monte Carlo de un fluido de Lennard–Jones: g(r), energía, presión y coordinación"></div>
<div class="sim-guide"><ul>
<li><strong>Líquido</strong> (\(\rho^*=0.8\), \(T^*=1.0\); argón a 120 K y 1.34 g/cm³): \(U/N=-5.55\,\varepsilon\), \(P^*=0.95\) (≈ 400 bar) y \(Z=1.19\). El primer pico de \(g(r)\) está en \(1.09\sigma\) con altura 2.6, y el número de coordinación hasta el primer mínimo (1.58\(\sigma\)) es 12.8, cerca del empaquetado compacto (12): la estructura local de un líquido simple es la de un sólido desordenado. Un segundo máximo suave a \(\approx2.1\sigma\) y \(g\to1\) hacia \(3\sigma\).</li>
<li><strong>Fluido supercrítico denso</strong> (\(T^*=2.5\), mismo \(\rho^*\)): el pico baja a 2.2, la coordinación sigue siendo 12.7, pero la presión sube a \(P^*=7.0\) (≈ 2900 bar a 300 K de argón): \(Z=3.5\), dominado por la repulsión. <strong>Gas denso</strong> (\(\rho^*=0.3\), \(T^*=1.5\)): 7 vecinos, \(Z=0.50\), por debajo de 1 porque las atracciones dominan.</li>
<li>La validación contra una implementación independiente en numpy (otro generador aleatorio, otra programación) a \(\rho^*=0.8\), \(T^*=1.5\) da \(U/N=-5.14\), \(P^*=3.16\) frente a \(-5.14\) y \(3.17\) del programa de esta página; y a densidad baja el programa reproduce la ley del virial \(P=\rho T(1+B_2\rho)\) con el \(B_2\) de la sección siguiente.</li>
</ul></div>
</section>

<section>
<h2>El segundo coeficiente virial</h2>
<p>A baja densidad, el factor de compresión se desarrolla en potencias de la densidad (Kamerlingh Onnes, 1901): \(Z=1+B_2(T)\rho+B_3(T)\rho^2+\dots\). La estadística da \(B_2\) en forma exacta a partir del potencial de <em>dos</em> cuerpos (\(B_3\) pide tres, y así sucesivamente):</p>
<div class="eq key" data-name="Segundo coeficiente virial">\[B_2(T)=-2\pi\int_0^\infty\left(e^{-u(r)/k_BT}-1\right)r^2\dd r\ \ \xrightarrow{\ \mathrm{LJ}\ }\ \ B_2^*=\frac{B_2}{\sigma^3}=f(T^*).\]</div>
<p>Es negativo a baja temperatura (domina la atracción: \(Z<1\)) y positivo a alta (domina la repulsión: \(Z>1\)); se anula en la <span class="term">temperatura de Boyle</span> \(T_B\), donde el gas real se comporta como ideal a baja presión (capítulo 2). Con el potencial LJ, \(T_B^*=3.418\), y con los parámetros del argón, \(T_B=409\) K (experimento: 411 K). Comparar este resultado con la ecuación de van der Waals, \(B_2=b-a/RT\) (capítulo 2): la forma cualitativa es la misma, pero la estadística da la dependencia exacta con \(T\) y los parámetros \(a,b\) salen de \(\varepsilon\) y \(\sigma\).</p>
<div class="sim" data-sim="b2-lj" data-title="Segundo coeficiente virial del fluido de Lennard–Jones y temperatura de Boyle"></div>
<div class="sim-guide"><ul>
<li>\(B_2^*(1.0)=-5.316\), \(B_2^*(2.0)=-1.314\), \(B_2^*(5.0)=+0.510\) y \(T_B^*=3.418\) (cuadratura numérica frente a scipy.integrate.quad, a 4 cifras). Con \(\varepsilon/k=119.8\) K, \(\sigma=3.405\) Å (argón), \(B_2(300\,\mathrm K)=-15.5\) cm³/mol (experimento: −15.5), \(B_2(200\,\mathrm K)=-47.8\), \(B_2(150\,\mathrm K)=-84.6\), \(B_2(500\,\mathrm K)=+7.1\).</li>
<li>Cambie \(\varepsilon/k\) y \(\sigma\) a valores de otras moléculas (Kr: 164 K, 3.65 Å; Xe: 229 K, 4.10 Å; CH₄: 148 K, 3.73 Å; N₂: 95 K, 3.70 Å): la curva reducida es la misma y solo cambian las escalas: la <em>ley de estados correspondientes</em>. El \(T_B\) de cada gas es 3.42 veces su \(\varepsilon/k\): 561 K para Kr, 783 K para Xe.</li>
<li>A \(\rho^*=0.1\) el desarrollo \(Z=1+B_2\rho\) da \(Z=0.93\) con \(T^*=2.5\) y \(Z=0.47\) con \(T^*=1\); el segundo término explica casi toda la desviación a densidades bajas (el terminal con \(B_3\) importa por encima de \(\rho^*\approx0.2\)).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Con \(\varepsilon/k=119.8\) K y \(\sigma=3.405\) Å para el argón, ¿a qué temperatura y presión corresponde \(T^*=1\), \(P^*=0.95\)? ¿Cuál es el valor de la distancia del mínimo del potencial en ángstroms?
<details><summary>Respuesta</summary><p>\(T=1.0\times119.8=119.8\) K. \(P=P^*\varepsilon/\sigma^3=0.95\times(1.6538\times10^{-21}\text{ J})/(3.947\times10^{-29}\text{ m}^3)=3.98\times10^7\) Pa \(=398\) bar. \(r_\mathrm{min}=2^{1/6}\sigma=1.122\times3.405=3.82\) Å.</p></details></li>
<li><span class="lvl">Básico</span>En una celda de 108 partículas con \(\rho^*=0.8\) y radio de corte \(r_c=2.57\sigma\), calcule la corrección de cola de la energía por partícula, \(\tfrac83\pi\rho[\tfrac13r_c^{-9}-r_c^{-3}]\).
<details><summary>Respuesta</summary><p>\(\tfrac83\pi(0.8)=6.702\); \(r_c^{-3}=0.0589\); \(r_c^{-9}=2.0\times10^{-4}\): \([\ldots]=6.7\times10^{-5}-0.0589=-0.0588\); corrección \(=-0.394\,\varepsilon\), el 7 % de la energía total \(-5.55\,\varepsilon\): no es despreciable.</p></details></li>
<li><span class="lvl">Intermedio</span>Con \(B_2(300\,\mathrm K)=-15.5\) cm³/mol para el argón, estime el factor de compresión a 300 K y 10 bar (\(\rho=P/RT\) en primera aproximación).
<details><summary>Respuesta</summary><p>\(Z\approx1+B_2P/RT=1-15.5\times10^{-6}\cdot10^6/(8.314\times300)=1-0.0062=0.9938\) (con \(P=10^6\) Pa y \(B_2=-1.55\times10^{-5}\) m³/mol). Una corrección de 0.6 %.</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que a baja densidad \(g(r)=e^{-u(r)/k_BT}\) y obtenga \(B_2\) de la ecuación de la presión.
<details><summary>Respuesta</summary><p>A baja densidad solo cuenta el par aislado: la probabilidad relativa de separación \(r\) es el factor de Boltzmann, \(g=e^{-u/k_BT}\). En la ecuación de la presión, \(u'\,e^{-u/k_BT}=-k_BT\,\dd g/\dd r\), de modo que \(P/\rho k_BT=1+\tfrac{2\pi\rho}3\int g'\,r^3\dd r\). Integrando por partes (el término de contorno de \((g-1)r^3\) se anula), \(\int g'r^3\dd r=-3\int(g-1)r^2\dd r\), y resulta \(P/\rho k_BT=1-2\pi\rho\int(e^{-u/k_BT}-1)r^2\dd r=1+\rho B_2\).</p></details></li>
<li><span class="lvl">Avanzado</span>¿Por qué el algoritmo de Metropolis cumple el balance detallado, y qué pasaría si el paso de desplazamiento fuera demasiado grande o demasiado pequeño?
<details><summary>Respuesta</summary><p>Con la regla \(\min(1,e^{-\Delta U/k_BT})\) y desplazamientos simétricos (la probabilidad de proponer \(a\to b\) es igual a la de \(b\to a\)), \(\pi_a\,p(a\to b)=\pi_b\,p(b\to a)\) con \(\pi\propto e^{-U/k_BT}\): la cadena de Markov tiene como distribución estacionaria la de Boltzmann. Un paso muy grande casi siempre produce solapamientos y se rechaza (aceptación \(\to0\), la cadena no avanza); uno muy pequeño se acepta casi siempre pero explora lentamente el espacio de configuraciones (correlación alta). El equilibrio práctico es una aceptación de 30–50 %.</p></details></li>
</ol>
