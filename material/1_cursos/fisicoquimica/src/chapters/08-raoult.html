<p class="lead">Mezclar líquidos parecidos, como benceno y tolueno, es la situación más simple posible: las moléculas no distinguen vecinos. El modelo que lo describe, la disolución ideal de Raoult, es a la vez una buena aproximación en muchos casos y el punto de referencia contra el cual se mide toda desviación. De él salen dos aplicaciones centrales de la ingeniería química y de la vida diaria: la destilación, que separa mezclas por la diferencia de volatilidad, y la ley de Henry, que dice cuánto gas se disuelve en el agua de un río o en la sangre de un buzo.</p>

<section>
<h2>Ley de Raoult y disolución ideal</h2>
<p>François-Marie Raoult observó en 1887 que, en muchas mezclas líquidas, la presión parcial de cada componente en el vapor es proporcional a su fracción molar en el líquido: \(p_i=x_iP_i^*\), con \(P_i^*\) la presión de vapor del componente puro a la misma temperatura. El vapor es un gas ideal, de modo que la ley de Dalton da \(y_i=p_i/P\) y la presión total es \(P=\sum x_iP_i^*\). Una <span class="term">disolución ideal</span> es la que cumple la ley de Raoult en todo el intervalo de composición.</p>
<p>La condición de equilibrio \(\mu_i^{liq}=\mu_i^{vap}\) con el vapor ideal, \(\mu_i^{vap}=\mu_i^\circ+RT\ln(p_i/P^\circ)\), conduce al potencial químico del componente en el líquido:</p>
<div class="eq key" data-name="Disolución ideal">\[\mu_i=\mu_i^*+RT\ln x_i,\qquad\Delta_{mez}G=nRT\sum_ix_i\ln x_i,\ \ \Delta_{mez}H=0,\ \ \Delta_{mez}V=0.\]</div>
<p>Es la expresión que se usó sin demostrar en el capítulo 1: toda la fuerza que impulsa la mezcla es la entropía. Se cumple cuando las interacciones entre moléculas distintas son iguales que entre las iguales, es decir, para moléculas de tamaño y química parecidos (isómeros, homólogos vecinos, benceno y tolueno, hexano y heptano). Las presiones de vapor puras se describen bien con la <span class="term">ecuación de Antoine</span>, \(\log_{10}P^*=A-B/(T+C)\): aquí se ajustaron a las correlaciones de DIPPR (errores menores de 1 %).</p>
<h3>Diagramas P–x–y y T–x–y</h3>
<p>Con la ley de Raoult, la presión de burbuja (la presión a la que aparece la primera burbuja de vapor sobre un líquido de composición \(x\)) es una <em>recta</em> en \(x\): \(P=P_2^*+x_1(P_1^*-P_2^*)\). El vapor está más enriquecido en el componente más volátil: \(y_1>x_1\). El <span class="term">diagrama de fases</span> tiene dos curvas, la de burbuja (líquido) y la de rocío (vapor), y entre ellas coexisten líquido y vapor. Un punto en esa región se descompone con la <b>regla de la palanca</b>: la fracción de vapor es \(\dfrac{z-x}{y-x}\), con \(z\) la composición global, \(x\) la del líquido y \(y\) la del vapor.</p>
<div class="sim" data-sim="vle-ideal" data-title="Equilibrio líquido–vapor de mezclas ideales: curvas de burbuja y de rocío"></div>
<div class="sim-guide"><ul>
<li>Benceno–tolueno a 60 °C (333.15 K): \(P^*\) son 52.2 kPa y 18.5 kPa; una mezcla equimolar tiene una presión de burbuja de 35.4 kPa y su vapor contiene 73.8 % de benceno. A 1 atm, el benceno hierve a 80.1 °C y el tolueno a 110.6 °C; una mezcla con 40 % de benceno comienza a hervir a 95.1 °C y se evapora por completo a 101.5 °C.</li>
<li>En el diagrama \(T\)–\(x\)–\(y\) a 98 °C (371 K) y \(z=0.4\): líquido con 31.7 % de benceno y vapor con 53.1 %, y una fracción de vapor de 0.39 por la regla de la palanca.</li>
<li>La volatilidad relativa \(\alpha=P_1^*/P_2^*\) mide cuánto se enriquece el vapor: 2.5 para benceno–tolueno (365 K), 2.5 para hexano–heptano, 2.1 para etanol–propanol y solo 1.8 para metanol–etanol, donde separar es más difícil.</li>
<li>En el diagrama de presión, la curva de burbuja es una recta (ley de Raoult) y la de rocío es curva; en el de temperatura ambas son curvas.</li>
</ul></div>
</section>

<section>
<h2>Destilación</h2>
<p>Una sola evaporación enriquece el vapor, pero no separa. Si ese vapor se condensa y se evapora de nuevo, se enriquece otra vez: el aparato que repite esa operación una y otra vez es la columna de destilación, y cada <span class="term">etapa teórica</span> es un par de evaporación y condensación en equilibrio. En una columna continua, la mezcla se alimenta a la mitad, el destilado (rico en el volátil) sale por arriba y el fondo por abajo; parte del destilado, el <em>reflujo</em>, vuelve a la columna. La relación de reflujo \(R=L/D\) y el número de etapas son los parámetros de diseño.</p>
<p>El método de McCabe y Thiele (1925) lo resuelve gráficamente. Con volatilidad relativa constante, la curva de equilibrio es \(y=\dfrac{\alpha x}{1+(\alpha-1)x}\). Se trazan: la recta de rectificación \(y=\tfrac{R}{R+1}x+\tfrac{x_D}{R+1}\) sobre la alimentación, la de agotamiento por debajo de ella, y entre ellas la recta \(q\) de la alimentación (\(q=1\) para líquido saturado). Las etapas se cuentan con escalones entre la curva de equilibrio y las rectas de operación. Dos límites son notables: el <b>reflujo mínimo</b> \(R_{min}\), para el cual el número de etapas es infinito, y el <b>reflujo total</b>, con un mínimo de etapas dado por la ecuación de Fenske:</p>
<div class="eq key" data-name="Ecuación de Fenske">\[N_{min}=\frac{\ln\!\left[\dfrac{x_D}{1-x_D}\,\dfrac{1-x_B}{x_B}\right]}{\ln\alpha}.\]</div>
<div class="sim" data-sim="mccabe" data-title="Columna de destilación: construcción de McCabe–Thiele"></div>
<div class="sim-guide"><ul>
<li>Benceno–tolueno (\(\alpha=2.4\)), alimentación 50 %, destilado 95 %, fondo 5 %: con \(R=2\) hacen falta 12 etapas (incluido el calderín), con la alimentación en la sexta; el mínimo de etapas a reflujo total es 6.7 y \(R_{min}=1.19\).</li>
<li>Reduzca \(R\) hacia \(R_{min}\): el número de etapas diverge (R = 1.5, 15 etapas; R = 1.2, 27). Súbalo: el número de etapas cae hacia el mínimo (R = 3, 10; R = 5, 9). El costo total de una columna se minimiza en un \(R\) típico de 1.2 a 1.5 veces \(R_{min}\): más reflujo gasta energía, menos reflujo exige columnas más altas.</li>
<li>Con \(\alpha=1.2\), una mezcla casi inseparable: pruebe y compruebe cuántas etapas hacen falta. Es el motivo por el que los isótopos o las mezclas de isómeros se separan con columnas de cientos de platos.</li>
<li>Cambie \(q\) a 0 (alimentación de vapor saturado): la recta \(q\) pasa a ser horizontal y cambian la posición de la alimentación y el reflujo mínimo.</li>
</ul></div>
</section>

<section>
<h2>La ley de Henry: gases disueltos</h2>
<p>Si el soluto es muy diluido, rodeado casi siempre de moléculas de disolvente, ya no cumple Raoult, sino una ley lineal con otra pendiente: la ley de Henry (1803), \(p_B=K_Hx_B\), donde la constante \(K_H\) depende del par soluto–disolvente y de la temperatura, y no es la presión de vapor del soluto puro. Se cumple cuando \(x_B\to0\) y es la razón por la que la solubilidad de un gas es proporcional a su presión parcial. Se encuentra en tres formas: \(p=Hx\) (constante en bar o Pa), \(c=k_Hp\) (solubilidad en mol/L·atm) y la de Bunsen.</p>
<p>Disolver un gas es casi siempre exotérmico: las moléculas pasan de un estado de gran entropía a uno de menor entropía, y \(\Delta_{sol}H<0\); por eso la solubilidad disminuye al calentar (ecuación de van't Hoff, capítulo 5). Con las constantes de Sander (2015) se ve en el siguiente simulador: es el motivo por el que los peces se ahogan en un lago caliente y por el que un refresco tibio pierde el gas.</p>
<div class="sim" data-sim="henry" data-title="Solubilidad de gases en agua: dependencia con la temperatura y la presión parcial"></div>
<div class="sim-guide"><ul>
<li>El oxígeno del aire (\(p_{O_2}=0.2095\) atm, aire seco) se disuelve a 25 °C en una concentración de 8.7 mg/L (el valor medido en agua saturada de aire húmedo es 8.26 mg/L); a 5 °C sube a 12.7 mg/L y a 30 °C baja a 7.9 mg/L. En Popayán, con 81.9 kPa, la presión parcial de O₂ es 80 % de la del nivel del mar y el agua a 25 °C contiene 6.9 mg/L.</li>
<li>La entalpía de disolución sale de la pendiente de \(\ln H\) frente a \(1/T\): −13.3 kJ/mol para el O₂, −19.6 kJ/mol para el CO₂. El CO₂ es 27 veces más soluble que el O₂ (0.035 mol/L·atm frente a 0.0013) por ser una molécula más polarizable y de interacción más fuerte con el agua; su ionización a bicarbonato (capítulo 6) añade solubilidad aparente en aguas alcalinas.</li>
<li>Un refresco embotellado a 5 °C con 4 atm de CO₂ contiene 0.245 mol/L, 10.8 g/L; al destaparlo la presión parcial baja a 0.0004 atm y el gas sale de la disolución como burbujas. Mantenerlo frío retiene el gas.</li>
<li>Buceo: a 30 m la presión absoluta es 4 atm, y el nitrógeno disuelto en la sangre (37 °C) pasa de 0.42 a 1.68 mmol/L. Si el buzo asciende rápido, la disolución queda sobresaturada y el nitrógeno forma burbujas en los tejidos: el mal de descompresión. Las paradas de descompresión dejan que se elimine despacio, siguiendo la ley de Henry.</li>
</ul></div>
<div class="box ex"><h4>Un gas en la sangre del buzo</h4>
<p>El nitrógeno tiene \(H=1.04\times10^5\) bar a 37 °C (constante de Sander). ¿Qué fracción molar de N₂ disuelve la sangre (tratada como agua) con aire a 1 atm y a 4 atm?</p>
<details><summary>Solución</summary><p>Con \(p_{N_2}=0.78\) atm, \(x=p/H=0.790/(1.04\times10^5)=7.6\times10^{-6}\), o 0.42 mmol/L (multiplicando por 55.3 mol de agua por litro). A 4 atm de aire, \(p_{N_2}=3.12\) atm y la solubilidad se cuadruplica: 1.68 mmol/L. La diferencia, 1.26 mmol/L, es lo que debe eliminarse en la ascensión, unos 32 mL de N₂ gaseoso por litro de sangre a 37 °C.</p></details>
</div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>A 333.15 K, \(P^*\) del benceno es 52.2 kPa y del tolueno 18.5 kPa. Para \(x_{benceno}=0.5\), halle la presión de burbuja y la composición del vapor.
<details><summary>Respuesta</summary><p>\(P=0.5(52.2)+0.5(18.5)=35.4\) kPa; \(y_{benceno}=0.5(52.2)/35.4=0.738\).</p></details></li>
<li><span class="lvl">Básico</span>¿Cuántas etapas mínimas hacen falta para separar una mezcla con \(\alpha=2.5\) en destilado de 98 % y fondo de 2 %?
<details><summary>Respuesta</summary><p>\(N_{min}=\ln[(0.98/0.02)(0.98/0.02)]/\ln2.5=\ln(2401)/0.9163=8.5\) etapas.</p></details></li>
<li><span class="lvl">Intermedio</span>Una mezcla ideal de benceno y tolueno con \(z=0.5\) está a 333.15 K. ¿Entre qué presiones coexisten líquido y vapor?
<details><summary>Respuesta</summary><p>Burbuja: 35.4 kPa. Rocío: \(1/P=0.5/52.2+0.5/18.5\), \(P=27.4\) kPa. Entre 27.4 y 35.4 kPa hay dos fases.</p></details></li>
<li><span class="lvl">Intermedio</span>Con \(k_H=1.3\times10^{-3}\) mol/L·atm para el O₂ a 25 °C, calcule la concentración de saturación en un lago a 2800 m de altitud (\(P=71.9\) kPa), con \(x_{O_2}=0.2095\) en el aire seco.
<details><summary>Respuesta</summary><p>\(p_{O_2}=0.2095(71.9-3.17)/101.325=0.1421\) atm (descontando el vapor de agua); \(c=1.3\times10^{-3}(0.1421)=1.85\times10^{-4}\) mol/L = 5.9 mg/L.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que, para una disolución ideal, la fracción molar del vapor \(y_1\) satisface \(y_1=\dfrac{\alpha x_1}{1+(\alpha-1)x_1}\), con \(\alpha=P_1^*/P_2^*\).
<details><summary>Respuesta</summary><p>\(y_1=x_1P_1^*/P\), \(y_2=x_2P_2^*/P\). El cociente \(\frac{y_1}{y_2}=\alpha\frac{x_1}{x_2}\) y con \(y_2=1-y_1\), \(x_2=1-x_1\) se despeja \(y_1\).</p></details></li>
</ol>
