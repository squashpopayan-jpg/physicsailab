.main{padding:12px;max-width:900px;margin:0 auto;width:100%;flex:1}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:10px}
.ct{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:2px;color:var(--ac);margin-bottom:10px}

.side-tap{cursor:pointer;padding:6px 9px;border-radius:6px;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:background .15s,transform .1s}

.pdf-btn{border:1px solid var(--gn);color:var(--gn);background:rgba(0,230,118,.08)}
.ko-scroll{overflow-x:auto;padding:2px 2px 12px;-webkit-overflow-scrolling:touch}
.ko-stage{position:relative;display:flex;gap:56px;min-width:max-content;padding:0 22px 8px}
.ko-lines{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:visible}
.ko-round{width:190px;flex:0 0 190px;position:relative;z-index:1;height:100%}
.ko-round-title{height:30px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:2px;color:var(--gd);border-bottom:1px solid var(--bd);margin-bottom:4px}
.ko-round-body{height:calc(100% - 34px);display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.ko-match{background:linear-gradient(145deg,var(--s2),#111b29);border:1px solid var(--bd);border-radius:8px;overflow:hidden;min-height:64px;cursor:pointer;box-shadow:0 5px 14px rgba(0,0,0,.2);position:relative}
.ko-match.ready:hover{border-color:var(--gd)}
.ko-match.done{border-color:rgba(0,230,118,.42)}
.ko-match.waiting{opacity:.68;cursor:default}
.ko-player{padding:6px 8px;display:flex;align-items:center;gap:6px;justify-content:space-between;border-bottom:1px solid rgba(30,48,80,.8);font-size:11px;font-weight:600;min-height:29px}

.ko-pname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ko-mark{font-size:10px;color:var(--mu);flex-shrink:0}

function balanceGroups(players,n){
  n=Math.max(1,Math.min(Number(n)||1,players.length||1));
  var sorted=players.slice().sort(function(a,b){return (b.level||0)-(a.level||0)||String(a.name).localeCompare(String(b.name));});
  var base=Math.floor(sorted.length/n),extra=sorted.length%n;
  var groups=[];
  for(var i=0;i<n;i++)groups.push({id:i+1,players:[],target:base+(i<extra?1:0),levelSum:0});
  // Greedy constrained balancing: equal sizes first, then lowest accumulated level.
  sorted.forEach(function(p){
    var eligible=groups.filter(function(g){return g.players.length<g.target;});
    eligible.sort(function(a,b){return a.levelSum-b.levelSum||a.players.length-b.players.length||a.id-b.id;});
    var g=eligible[0];g.players.push(p);g.levelSum+=(Number(p.level)||0);
  });
  return groups.map(function(g){return{id:g.id,players:g.players};});
}
function uniqueMatchId(prefix,catId,i){return prefix+"-"+catId+"-"+Date.now()+"-"+i+"-"+Math.random().toString(36).slice(2,7);}
function roundRobin(groups,catId){
  var m=[];var seq=0;
  groups.forEach(function(g){var ps=g.players;
    for(var i=0;i<ps.length;i++)for(var j=i+1;j<ps.length;j++)
      m.push({id:uniqueMatchId("g",catId,seq++),catId:catId,groupId:g.id,phase:"group",p1:ps[i].id,p2:ps[j].id,p1Name:ps[i].name,p2Name:ps[j].name,games:[],winner:null,startTime:"",court:1,status:"pending",slog:[],scoreMeta:null});
  });
  var byG=groups.map(function(g){return m.filter(function(x){return x.groupId===g.id;});});
  var out=[];var mx=0;byG.forEach(function(g){if(g.length>mx)mx=g.length;});
  for(var r=0;r<mx;r++)byG.forEach(function(gm){if(gm[r])out.push(gm[r]);});
  return out;
}
function timeToMin(t){var p=String(t||"08:00").split(":");return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0);}
function minToTime(v){v=((v%1440)+1440)%1440;return String(Math.floor(v/60)).padStart(2,"0")+":"+String(v%60).padStart(2,"0");}
function scheduleAllCategories(state){
  var courts=Math.max(1,Number(state.courts)||1),slotLen=15;
  var courtBusy={},playerBusy={},timeMap={};
  function reserve(m){
    if(!m.startTime)return;
    var tm=timeToMin(m.startTime),ck=tm+"|"+(m.court||1);courtBusy[ck]=true;
    playerBusy[tm+"|"+m.p1]=true;playerBusy[tm+"|"+m.p2]=true;
  }
  // Preserve already played/active matches; only pending group matches are reprogrammed.
  (state.categories||[]).forEach(function(cat2){(cat2.matches||[]).forEach(function(m){
    if(m.phase==="group"&&(m.status==="done"||m.status==="wo"||m.status==="playing"))reserve(m);
  });});
  var pools=(state.categories||[]).map(function(cat2,ci){return{ci:ci,start:timeToMin(cat2.startTime||"08:00"),items:(cat2.matches||[]).filter(function(m){return m.phase==="group"&&!(m.status==="done"||m.status==="wo"||m.status==="playing");})};});
  var interleaved=[],more=true,idx=0;
  while(more){more=false;pools.forEach(function(pool){if(idx<pool.items.length){interleaved.push({m:pool.items[idx],start:pool.start});more=true;}});idx++;}
  interleaved.forEach(function(item){
    var m=item.m,tm=Math.ceil(item.start/slotLen)*slotLen,placed=false,guard=0;
    while(!placed&&guard++<1000){
      if(playerBusy[tm+"|"+m.p1]||playerBusy[tm+"|"+m.p2]){tm+=slotLen;continue;}
      for(var cno=1;cno<=courts;cno++){
        var ck=tm+"|"+cno;
        if(!courtBusy[ck]){timeMap[m.id]={startTime:minToTime(tm),court:cno};courtBusy[ck]=true;playerBusy[tm+"|"+m.p1]=true;playerBusy[tm+"|"+m.p2]=true;placed=true;break;}
      }
      if(!placed)tm+=slotLen;
    }
  });
  var newCats=(state.categories||[]).map(function(cat2){
    var newMatches=(cat2.matches||[]).map(function(m){return m.phase==="group"&&timeMap[m.id]?Object.assign({},m,timeMap[m.id]):m;});
    return Object.assign({},cat2,{matches:newMatches});
  });
  return Object.assign({},state,{categories:newCats});
}
function gwinner(s1,s2){if(s1>=11&&s1-s2>=2)return 1;if(s2>=11&&s2-s1>=2)return 2;return null;}
function groupStandings(gPlayers,matches){
  var st={};
  gPlayers.forEach(function(p){st[p.id]={id:p.id,name:p.name,w:0,l:0,sw:0,sl:0,pf:0,pa:0};});
  matches.forEach(function(m){
    if(!m.winner||m.phase!=="group")return;
    var wId=m.winner,lId=wId===m.p1?m.p2:m.p1;

        var catBadge=el("div",{style:"font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;border:1px solid "+catColor+";color:"+catColor+";flex-shrink:0;white-space:nowrap;"});
        catBadge.textContent=catName;mr.appendChild(catBadge);

        // Group badge
        var gtag2=el("div",{cls:"gtg",style:"border-color:"+catColor+";color:"+catColor});
        gtag2.textContent="G"+(m.groupId||"");mr.appendChild(gtag2);

        var mts=el("div",{cls:"mts"});
        var mname=el("div",{style:"font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"});
        mname.innerHTML='<span style="color:'+(m.winner===m.p1?"var(--gn)":"inherit")+'">'+escH(m.p1Name)+'</span>'
          +'<span style="color:var(--mu);margin:0 4px;font-size:10px">vs</span>'
          +'<span style="color:'+(m.winner===m.p2?"var(--gn)":"inherit")+'">'+escH(m.p2Name)+'</span>';
        mts.appendChild(mname);
        if(done){
          var mscore2=el("div",{style:"font-size:10px;color:var(--mu);margin-top:1px"});
          mscore2.textContent=m.status==="wo"?"W.O. (11-0 / 11-0)":gs;
          mts.appendChild(mscore2);
        }
        mr.appendChild(mts);
        var a2=el("div",{cls:"match-actions"}),mact2=el("span");
        if(done){mact2.style.color="var(--gn)";mact2.style.fontSize="15px";mact2.textContent="✓";}
        else{mact2.className="fbc";mact2.style.cssText="font-size:10px;color:var(--ac);letter-spacing:1px";mact2.textContent=canScore()?"JUGAR ▶":"VER ▶";}
        a2.appendChild(mact2);if(canScore())a2.appendChild(makeManualResultButton(m.id));mr.appendChild(a2);
        gencard.appendChild(mr);
      });
    }
    main.appendChild(gencard);
  }

    var footer=el("div",{cls:"fbc",style:"text-align:center;padding:12px 0;font-size:9px;color:var(--mu);letter-spacing:2px;"});
  footer.innerHTML="TORNEOS SQUASH POPAYÁN · BY MANUSQUASH · <span class='syncl'>🟢 EN VIVO</span>";
  main.appendChild(footer);
  app.appendChild(main);
  root.appendChild(app);
}

// ── ACTION HANDLERS ───────────────────────────────────────────
function doTryAdmin(){
  var pin=document.getElementById("admin-pin");if(!pin)return;
  if(ph(pin.value)===AHASH){ADMIN=true;JUDGE=false;UI_STATE.showAdmin=false;UI_STATE.adminErr="";VIEW="register";render();}
  else{UI_STATE.adminErr="PIN incorrecto";render();}
}
function doTryJudge(){
  var pin=document.getElementById("judge-pin");if(!pin)return;
  if(!ST.judgePinHash){UI_STATE.judgeErr="El administrador aún no ha configurado un PIN de juez.";render();return;}
  if(ph(pin.value)===ST.judgePinHash){JUDGE=true;ADMIN=false;UI_STATE.showJudge=false;UI_STATE.judgeErr="";VIEW="schedule";render();}
  else{UI_STATE.judgeErr="PIN de juez incorrecto";render();}
}
function doSaveSetup(){
  var ns=Object.assign({},ST);
  var cs=document.getElementById("courts-sel");if(cs)ns.courts=Number(cs.value);
  var ms=document.getElementById("mode-sel");if(ms)ns.scoringMode=ms.value;
  var jnew=document.getElementById("judge-pin-new"),jdis=document.getElementById("judge-disable");if(jdis&&jdis.checked)ns.judgePinHash="";else if(jnew&&jnew.value.trim())ns.judgePinHash=ph(jnew.value.trim());
  ns.appVersion="v14-pro";
  ns.categories=(ST.categories||[]).map(function(cat2,i){
    var inp=document.getElementById("cat-name-"+i);
    return inp&&inp.value.trim()?Object.assign({},cat2,{name:inp.value.trim()}):cat2;
  });
  // Reschedule if any category has matches
  var hasMatches=(ns.categories||[]).some(function(cat2){return(cat2.matches||[]).length>0;});
  if(hasMatches)ns=scheduleAllCategories(ns);
  UI_STATE.showSetup=false;saveState(ns);
}
function doAddPlayer(){
  if((cat().groups||[]).length||(cat().matches||[]).length)return;
  var pname=document.getElementById("pname-inp");
  var name=pname?pname.value.trim():UI_STATE.pName;
  if(!name)return;
  var updated=Object.assign({},cat());
  updated.players=(updated.players||[]).concat([{id:String(Date.now()),name:name,level:UI_STATE.pLevel}]);
  UI_STATE.pName="";savecat(updated);
}
function doRemovePlayer(id){
  if((cat().groups||[]).length||(cat().matches||[]).length)return;
  var updated=Object.assign({},cat());
  updated.players=(updated.players||[]).filter(function(p){return p.id!==id;});
  savecat(updated);
}
function doSaveCatTime(val){
  var updated=Object.assign({},cat(),{startTime:val});
  var ns=Object.assign({},ST);
  ns.categories=ST.categories.map(function(cat3,i){return i===ACTIVEC?updated:cat3;});
  var hasMatches=(ns.categories||[]).some(function(cat2){return(cat2.matches||[]).length>0;});
  if(hasMatches)ns=scheduleAllCategories(ns);
  saveState(ns);
}
function doCreateGroups(){
  var c2=cat();var players=c2.players||[];if(players.length<2||(c2.groups||[]).length||(c2.matches||[]).length)return;
  UI_STATE.nGroups=Math.max(1,Math.min(UI_STATE.nGroups,players.length));
  var g=balanceGroups(players,UI_STATE.nGroups);
  var m=roundRobin(g,ACTIVEC);
  // First save matches without times, then reschedule globally
  var updatedCat=Object.assign({},c2,{groups:g,matches:m,knockout:null});
  var ns=Object.assign({},ST);
  ns.categories=ST.categories.map(function(cat3,i){return i===ACTIVEC?updatedCat:cat3;});
  // Global reschedule across all categories
  ns=scheduleAllCategories(ns);
  VIEW="groups";
  saveState(ns);
}
function doBuildKO(){
  if(!ADMIN)return;var c2=cat();var gm=(c2.matches||[]).filter(function(m){return m.phase==="group";});
  var finished=gm.filter(function(m){return m.status==="done"||m.status==="wo";}).length;if(!gm.length||finished!==gm.length){UI_STATE.koErr="Primero deben finalizar todos los partidos de grupos.";render();return;}
  var minGroup=(c2.groups||[]).length?Math.min.apply(null,(c2.groups||[]).map(function(g){return(g.players||[]).length;})):0;if(minGroup<1){UI_STATE.koErr="No hay suficientes jugadores clasificados.";render();return;}
  UI_STATE.nAdv=Math.max(1,Math.min(UI_STATE.nAdv,minGroup,3));var ko=buildKO(c2.groups||[],gm,UI_STATE.nAdv,ACTIVEC);if(!ko){UI_STATE.koErr="Se necesitan al menos dos clasificados para generar playoffs.";render();return;}
  var km=ko.rounds.reduce(function(a,r){return a.concat(r);},[]);var base=(c2.matches||[]).filter(function(m){return m.phase!=="knockout";});
  savecat(Object.assign({},c2,{knockout:ko,matches:base.concat(km)}));VIEW="knockout";UI_STATE.showKO=false;UI_STATE.koErr="";
}
function doResetCat(){
  if(!ADMIN)return;if(!window.confirm("¿Reiniciar esta categoría? Se borrarán jugadores, grupos, partidos y resultados de esta categoría."))return;
  savecat({id:ACTIVEC,name:cat().name,color:ACTIVEC,players:[],groups:[],matches:[],knockout:null,startTime:"08:00"});VIEW="schedule";
}
function doResetAll(){if(!ADMIN)return;if(!window.confirm("¿Reiniciar TODO el torneo? Esta acción borra categorías, jugadores, programación y resultados."))return;var ns=initState();ns.judgePinHash=ST.judgePinHash||"";saveState(ns);VIEW="schedule";}

window.onload=function(){
  if(typeof firebase!=="undefined"){startApp();}
  else{ST=initState();render();}
};
</script>
