function normalizeCategory(c,i){

    var names=toArr(ko.roundNames).filter(function(x){return typeof x==="string";});

    toArr(ko.rounds).forEach(function(r,ri){toArr(r).forEach(function(rm,mi){
      if(!rm)return;var id=isObj(rm)?String(rm.id):String(rm),f=null;

      if(f&&f.phase==="knockout"&&f.koRound===null){f.koRound=ri;f.koSlot=mi;}
      if(f&&!f.roundName)f.roundName=names[ri]||null;

    if(kms.length){var R=0;kms.forEach(function(m){R=Math.max(R,m.koRound+1);});if(names.length!==R)names=roundNamesFor(Math.pow(2,R));kout={roundNames:names,nAdv:ko.nAdv||null,direct:!!ko.direct};}

// v14 creaba los partidos de playoffs en orden (ronda 1, ronda 2…) y la secuencia quedó en el id.
function inferKOSlots(ms){

function normalizeState(raw,fromDb){

// ── PERSISTENCIA: solo se envían las rutas que cambiaron ──────
function computeUpdates(a,b){
  var up={};
  Object.keys(b).forEach(function(k){if(k!=="categories"&&!same(a[k],b[k]))up[k]=b[k]===undefined?null:b[k];});
  Object.keys(a).forEach(function(k){if(k!=="categories"&&!(k in b))up[k]=null;});
  var oc=a.categories||[],nc=b.categories||[];
  var prefixOk=nc.length>=oc.length&&oc.every(function(c,i){return nc[i]&&nc[i].id===c.id;});
  if(!prefixOk){up.categories=nc;return up;}
  nc.forEach(function(c,i){
    var o=oc[i],base="categories/"+i;
    if(!o){up[base]=c;return;}
    Object.keys(c).forEach(function(k){if(k!=="matches"&&!same(o[k],c[k]))up[base+"/"+k]=c[k]===undefined?null:c[k];});
    Object.keys(o).forEach(function(k){if(k!=="matches"&&!(k in c))up[base+"/"+k]=null;});
    var om=o.matches||[],nm=c.matches||[];
    if(om.length!==nm.length||nm.some(function(m,j){return om[j].id!==m.id;}))up[base+"/matches"]=nm;
    else nm.forEach(function(m,j){if(!same(om[j],m))up[base+"/matches/"+j]=m;});
    if(LEGACY_KO[i]&&!((base+"/knockout") in up)&&!((base+"/matches") in up)&&Object.keys(up).some(function(k){return k.indexOf(base+"/")===0;})){
      up[base+"/knockout"]=c.knockout;nm.forEach(function(m,j){if(m.phase==="knockout")up[base+"/matches/"+j]=m;});
    }
  });
  return up;
}
function cleanMap(up){var o={};Object.keys(up).forEach(function(k){o[k]=clean(up[k]);});return o;}
var LAST_OFFLINE_TOAST=0;
function trackWrite(p,okMsg){
  PENDING++;updateSyncUI();
  if(!CONNECTED&&Date.now()-LAST_OFFLINE_TOAST>20000){LAST_OFFLINE_TOAST=Date.now();toast("Sin conexión: los cambios se enviarán al reconectar. No cierres esta página.","warn");}
  p.then(function(){PENDING=Math.max(0,PENDING-1);updateSyncUI();if(okMsg)toast(okMsg,"ok");},function(e){PENDING=Math.max(0,PENDING-1);updateSyncUI();console.error(e);toast("No se pudo guardar: "+((e&&e.message)||e),"err");});
}
function canWrite(){
  if(!DB||!FB_OK){toast("Sin servidor en línea: no es posible guardar cambios.","err");return false;}
  if(!LOADED||FROM_CACHE){toast("Todavía se están cargando los datos en línea. Intenta de nuevo en unos segundos.","warn");return false;}
  return true;
}
function persist(ns,okMsg){
  if(!canWrite())return false;
  ns=normalizeState(clean(ns),false);
  var full=DB_EMPTY||NEED_FULL,up=full?null:computeUpdates(ST,ns),old=ST,p=null;
  ST=ns;
  try{if(full)p=DB.set(clean(ns));else if(Object.keys(up).length)p=DB.update(cleanMap(up));}
  catch(e){console.error(e);ST=old;rerender();toast("No se pudo guardar: "+((e&&e.message)||e),"err");return false;}
  if(full){DB_EMPTY=false;NEED_FULL=false;}
  cacheState();rerender();
  if(p)trackWrite(p,okMsg);else if(okMsg)toast(okMsg,"ok");
  return true;
}
function replaceAll(raw,okMsg){
  if(!canWrite())return;
  var ns=normalizeState(clean(raw),false),old=ST,p;ST=ns;
  try{p=DB.set(clean(ns));}catch(e){console.error(e);ST=old;rerender();toast("No se pudo guardar: "+((e&&e.message)||e),"err");return;}
  DB_EMPTY=false;NEED_FULL=false;cacheState();
  if(ACTIVEC>=ST.categories.length)ACTIVEC=0;rerender();
  trackWrite(p,okMsg);
}

// Game válido en sistema PAR: se gana con `pts` y 2 de ventaja; desde (pts-1)-(pts-1) se sigue hasta sacar 2.
function gameWinner(s1,s2,pts){var hi=Math.max(s1,s2),lo=Math.min(s1,s2);if(hi<pts||s1===s2)return null;if(hi===pts&&lo<=pts-2)return s1>s2?1:2;if(hi>pts&&hi-lo===2)return s1>s2?1:2;return null;}

function matchScoreText(m){if(!m)return"";var t=(m.games||[]).filter(function(g){return g.winner;}).map(function(g){return g.s1+"-"+g.s2;}).join(" / ");if(m.status==="wo")return"W.O."+(t?" ("+t+")":"");return t;}

// ── GRUPOS Y TODOS CONTRA TODOS ───────────────────────────────
function maxGroupsFor(n){return Math.max(1,Math.min(MAX_GROUPS,Math.floor(n/2)));}
function balanceGroups(players,n){
  n=Math.max(1,Math.min(Number(n)||1,players.length||1));
  var sorted=players.slice().sort(function(a,b){return(b.level||0)-(a.level||0)||String(a.name).localeCompare(String(b.name));});
  var base=Math.floor(sorted.length/n),extra=sorted.length%n,groups=[];
  for(var i=0;i<n;i++)groups.push({id:i+1,players:[],target:base+(i<extra?1:0),levelSum:0});
  sorted.forEach(function(p){
    var el2=groups.filter(function(g){return g.players.length<g.target;});
    el2.sort(function(a,b){return a.levelSum-b.levelSum||a.players.length-b.players.length||a.id-b.id;});
    el2[0].players.push(p);el2[0].levelSum+=(Number(p.level)||0);
  });
  return groups.map(function(g){return{id:g.id,players:g.players};});
}
// Método del círculo: cada ronda tiene parejas sin jugadores repetidos (mejor descanso y rotación).
function rrRounds(ps){var a=ps.slice();if(a.length%2)a.push(null);var n=a.length,rounds=[];for(var r=0;r<n-1;r++){var pr=[];for(var i=0;i<n/2;i++){var x=a[i],y=a[n-1-i];if(x&&y)pr.push(r%2?[y,x]:[x,y]);}rounds.push(pr);a.splice(1,0,a.pop());}return rounds;}
function roundRobin(groups,catId){
  var per=groups.map(function(g){return rrRounds(g.players);}),mx=0,out=[];
  per.forEach(function(r){mx=Math.max(mx,r.length);});
  for(var r=0;r<mx;r++)groups.forEach(function(g,gi){(per[gi][r]||[]).forEach(function(pr){out.push(newMatch({catId:catId,groupId:g.id,p1:pr[0].id,p2:pr[1].id,p1Name:pr[0].name,p2Name:pr[1].name}));});});
  return out;
}
function addStats(st,m){
  var a=st[m.p1],b=st[m.p2];if(!a||!b)return;
  if(m.winner===m.p1){a.w++;b.l++;}else{b.w++;a.l++;}
  (m.games||[]).forEach(function(g){a.sw+=g.winner===1?1:0;a.sl+=g.winner===2?1:0;a.pf+=g.s1;a.pa+=g.s2;b.sw+=g.winner===2?1:0;b.sl+=g.winner===1?1:0;b.pf+=g.s2;b.pa+=g.s1;});
}
function cmpGen(a,b){return((b.sw-b.sl)-(a.sw-a.sl))||((b.pf-b.pa)-(a.pf-a.pa))||(b.pf-a.pf)||String(a.name).localeCompare(String(b.name));}
// Desempate: 2 empatados → enfrentamiento directo; 3+ → mini-tabla entre ellos y luego diferencia general.
function breakTie(tied,gm){
  if(tied.length<2)return tied;
  if(tied.length===2){var x=tied[0].id,y=tied[1].id,h=gm.filter(function(m){return(m.p1===x&&m.p2===y)||(m.p1===y&&m.p2===x);});if(h.length===1)return h[0].winner===x?tied:[tied[1],tied[0]];return tied.slice().sort(cmpGen);}

  gm.forEach(function(m){if(ids[m.p1]&&ids[m.p2])addStats(mini,m);});
  return tied.slice().sort(function(a,b){var ma=mini[a.id],mb=mini[b.id];return(mb.w-ma.w)||((mb.sw-mb.sl)-(ma.sw-ma.sl))||((mb.pf-mb.pa)-(ma.pf-ma.pa))||cmpGen(a,b);});
}
function groupStandings(gPlayers,matches){
  var st={},order=[];
  gPlayers.forEach(function(p){st[p.id]={id:p.id,name:p.name,withdrawn:!!p.withdrawn,w:0,l:0,sw:0,sl:0,pf:0,pa:0};order.push(p.id);});
  var gm=matches.filter(function(m){return m.phase==="group"&&isDone(m)&&m.winner&&st[m.p1]&&st[m.p2];});
  gm.forEach(function(m){addStats(st,m);});

// ── PLAYOFFS (fuente única: los partidos guardan koRound / koSlot) ──
function roundNamesFor(size){var R=Math.max(1,Math.round(Math.log(size)/Math.log(2))),tail=["Final","Semifinal","Cuartos de final","Octavos de final","Dieciseisavos","Treintaidosavos"],out=[];for(var r=0;r<R;r++){out.push(tail[R-1-r]||("Ronda "+(r+1)));}return out;}

function seedOrder(n){var o=[1];while(o.length<n){var m=o.length*2,nx=[];o.forEach(function(s){nx.push(s);nx.push(m+1-s);});o=nx;}return o;}

}
function koGridFrom(ms){
  var kms=ms.filter(function(m){return m.phase==="knockout"&&m.koRound!==null&&m.koRound!==undefined;});if(!kms.length)return null;
  var R=0;kms.forEach(function(m){R=Math.max(R,m.koRound+1);});var g=[];for(var r=0;r<R;r++)g.push([]);
  kms.forEach(function(m){g[m.koRound][m.koSlot]=m;});return g;
}
// Recalcula el cuadro: avanza ganadores, resuelve pases directos y reinicia partidos cuyos rivales cambiaron.
function progressKO(ms,info){
  info=info||{};info.reset=info.reset||0;
  var out=ms.map(function(m){return m.phase==="knockout"?Object.assign({},m):m;}),g=koGridFrom(out);if(!g)return out;
  function clearRes(m){if(isDone(m)||m.status==="playing")info.reset++;m.games=[];m.winner=null;m.slog=[];m.scoreMeta=null;m.ref=null;}
  for(var r=0;r<g.length;r++)for(var i=0;i<g[r].length;i++){

      m.p1Name=np1?winnerName(a):null;m.p2Name=np2?winnerName(b):null;
      if(!(ra&&rb)){if(m.status!=="waiting"){clearRes(m);m.status="waiting";}m.winner=null;continue;}
    }
    if(m.p1&&m.p2){if(m.status==="bye"||m.status==="empty"||m.status==="waiting"){m.status="pending";m.winner=null;}}
    else if(m.p1||m.p2){if(m.status!=="bye"){clearRes(m);m.status="bye";}m.winner=m.p1||m.p2;}

function createKOMatches(c,seeds){

  var names=roundNamesFor(size),ms=[];

    var m=newMatch({id:uid("ko"),catId:c.id,phase:"knockout",koRound:r,koSlot:i,roundName:names[r],status:"waiting"});
    if(r===0){var a=slots[2*i],b=slots[2*i+1];if(a){m.p1=a.id;m.p1Name=a.name;}if(b){m.p2=b.id;m.p2Name=b.name;}m.status="pending";}

// ── PROGRAMACIÓN DE HORARIOS (todas las categorías, canchas, descanso y jugadores en dos categorías) ──
function alignUp(t,base,step){if(t<=base)return base;return base+Math.ceil((t-base)/step)*step;}
function scheduleAll(state,opts){
  opts=opts||{};
  var courts=state.courts,slot=state.slotMinutes,rest=state.restMinutes,from=typeof opts.fromMin==="number"?opts.fromMin:null;
  var cOcc={},pOcc={},times={};
  function pkey(m,w){var n=w===1?m.p1Name:m.p2Name,id=w===1?m.p1:m.p2;if(!id)return null;return n?("n:"+normName(n)):("i:"+id);}

  function occupy(m,t,c){(cOcc[c]=cOcc[c]||[]).push([t,t+slot]);[1,2].forEach(function(w){var k=pkey(m,w);if(k)(pOcc[k]=pOcc[k]||[]).push([t,t+slot]);});}
  function playersFree(m,t){for(var w=1;w<=2;w++){var k=pkey(m,w);if(k&&overlaps(pOcc[k]||[],t-rest,t+slot+rest))return false;}return true;}
  function place(m,earliest,base){

    return null;
  }
  function movable(m){return!m.fixed&&(m.status==="pending"||m.status==="waiting");}
  state.categories.forEach(function(c){c.matches.forEach(function(m){if(m.status==="bye"||m.status==="empty")return;if(!movable(m)&&m.startTime)occupy(m,timeToMin(m.startTime),Math.min(m.court||1,courts));});});
  var pools=state.categories.map(function(c){return{start:timeToMin(c.startTime),items:c.matches.filter(function(m){return m.phase==="group"&&movable(m);})};});
  var idx=0,more=true;
  while(more){more=false;pools.forEach(function(p){if(idx<p.items.length){more=true;place(p.items[idx],from===null?p.start:Math.max(p.start,from),p.start);}});idx++;}
  var infos=state.categories.map(function(c){
    var end=null;c.matches.forEach(function(m){if(m.phase!=="group")return;var st=times[m.id]?times[m.id].startTime:m.startTime;if(st)end=Math.max(end===null?0:end,timeToMin(st)+slot);});
    return{start:timeToMin(c.startTime),groupEnd:end,grid:koGridFrom(c.matches)};
  });
  var maxR=0;infos.forEach(function(x){if(x.grid)maxR=Math.max(maxR,x.grid.length);});
  for(var r=0;r<maxR;r++)infos.forEach(function(x){

    if(times[m.id])return Object.assign({},m,times[m.id]);
    if((m.status==="bye"||m.status==="empty")&&m.startTime)return Object.assign({},m,{startTime:""});
    return m;})});})});
}

  askConfirm({title:"Eliminar playoffs",danger:true,typed:played?"BORRAR":null,okText:"Eliminar",text:"Se borrará el cuadro de "+c.name+(played?" con "+played+" partido(s) ya jugados":"")+". La fase de grupos se conserva y podrás generarlo de nuevo.",onOk:function(){

}
function doResetCat(){
  if(!ADMIN)return;var c=cur();
  askConfirm({title:"Reiniciar categoría",danger:true,typed:"BORRAR",okText:"Reiniciar",text:"Se borrarán TODOS los jugadores, grupos, partidos y resultados de "+c.name+".\nSe guardará una copia automática en este dispositivo.",onOk:function(){

function doResetAll(){

function doSaveSetup(){
  if(!ADMIN)return;
  function v(id){var e=document.getElementById(id);return e?e.value:null;}
  var code=String(v("cfg-jcode")||"").trim();
  if(code.length<4||code.length>20||/\s/.test(code)){toast("El código de jueces debe tener entre 4 y 20 caracteres, sin espacios.","warn");return;}
  if(normCode(code)==="anto"){toast("El código de jueces no puede ser igual al PIN de administrador.","warn");return;}
  var ns=Object.assign({},ST);
  ns.courts=clampInt(v("cfg-courts"),1,12,ST.courts);ns.scoringMode=v("cfg-mode")==="bo5"?"bo5":"bo3";ns.pointsPerGame=Number(v("cfg-pts"))===15?15:11;
  ns.slotMinutes=clampInt(v("cfg-slot"),10,180,ST.slotMinutes);ns.restMinutes=clampInt(v("cfg-rest"),0,180,ST.restMinutes);
  var codeChanged=normCode(code)!==normCode(ST.judgeCode);ns.judgeCode=code;
  var jon=document.getElementById("cfg-jon");ns.judgesEnabled=jon?!!jon.checked:ST.judgesEnabled;
  if(ST.judgePinHash)ns.judgePinHash=null;
  ns.appVersion=APP_VERSION;
  ns.categories=ST.categories.map(function(c){var e=document.getElementById("cfg-cat-"+c.id),n=e?e.value.trim().slice(0,28):"";return n&&n!==c.name?Object.assign({},c,{name:n}):c;});
  var schedChanged=ns.courts!==ST.courts||ns.slotMinutes!==ST.slotMinutes||ns.restMinutes!==ST.restMinutes;
  UI_STATE.showSetup=false;
  if(persist(ns,"Configuración guardada"+(codeChanged?" · código de jueces: "+code:""))&&schedChanged&&hasAnyMatches()){UI_STATE.showResched=true;render();}
}
function doAddCategory(){
  if(!ADMIN)return;if(ST.categories.length>=MAX_CATS){toast("Máximo "+MAX_CATS+" categorías.","warn");return;}
  var id=nextCatIdIn(ST.categories),d=defaultCategory(id,"Categoría "+String.fromCharCode(65+ST.categories.length));d.color=ST.categories.length%CAT_COLORS.length;
  persist(Object.assign({},ST,{categories:ST.categories.concat([d])}),"Categoría añadida");
}
function doDeleteCategory(id){
  if(!ADMIN)return;var i=catIndexById(id),c=ST.categories[i];if(!c||c.players.length||c.matches.length||ST.categories.length<=1)return;
  askConfirm({title:"Eliminar categoría",danger:true,okText:"Eliminar",text:"Se eliminará «"+c.name+"» (está vacía).",onOk:function(){
    var j=catIndexById(id);if(j<0)return;var cats=ST.categories.filter(function(x){return x.id!==id;});if(ACTIVEC>=j&&ACTIVEC>0)ACTIVEC--;
    persist(Object.assign({},ST,{categories:cats}),"Categoría eliminada");}});
}

// ══════════════════════════════════════════════════════════════
// PDF E IMPRESIÓN
// ══════════════════════════════════════════════════════════════
function pdfSafe(s){return String(s==null?"":s).replace(/[–—]/g,"-").replace(/…/g,"...").replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[^\x00-\xFF]/g,"");}
function collectScheduleRows(){
  var rows=[];ST.categories.forEach(function(c){c.matches.forEach(function(m){if(m.status==="bye"||m.status==="empty")return;
    rows.push({time:m.startTime||"",court:m.court||1,cat:c.name,phase:m.phase==="knockout"?(m.roundName||"Playoffs"):"Grupo "+m.groupId,match:(m.p1Name||"Por definir")+" vs "+(m.p2Name||"Por definir"),score:isDone(m)?matchScoreText(m):"",ko:m.phase==="knockout"?m.koRound:-1});});});
  rows.sort(function(a,b){var ta=a.time||"99:99",tb=b.time||"99:99";return ta<tb?-1:ta>tb?1:(a.court-b.court||a.ko-b.ko);});return rows;
}
function scheduleReport(){
  var rows=collectScheduleRows();if(!rows.length){toast("Aún no hay partidos programados.","warn");return null;}
  return{title:"TORNEOS SQUASH POPAYÁN",sub:"Cronograma oficial de partidos · "+new Date().toLocaleString("es-CO"),orient:"landscape",file:"cronograma-torneos-squash-popayan.pdf",
    sections:[{cols:[{t:"HORA",w:16},{t:"CANCHA",w:16},{t:"CATEGORÍA",w:40},{t:"FASE",w:32},{t:"PARTIDO",w:118},{t:"MARCADOR",w:51}],rows:rows.map(function(r){return{cells:[r.time||"--","C"+r.court,r.cat,r.phase,r.match,r.score||null]};})}]};
}
function resultsReport(){
  var sections=[];
  ST.categories.forEach(function(c){
    if(!c.matches.length)return;var first=true;
    c.groups.forEach(function(g){var st=groupStandings(g.players,c.matches);
      sections.push({heading:first?c.name:null,sub:"Grupo "+g.id,cols:[{t:"#",w:8},{t:"JUGADOR",w:62},{t:"PJ",w:13},{t:"PG",w:13},{t:"PP",w:13},{t:"GG",w:13},{t:"GP",w:13},{t:"PR",w:17},{t:"PC",w:17},{t:"DIF",w:17}],
        rows:st.map(function(r,i){var d=r.pf-r.pa;return{cells:[i+1,r.name+(r.withdrawn?" (retirado)":""),r.w+r.l,r.w,r.l,r.sw,r.sl,r.pf,r.pa,(d>0?"+":"")+d],bold:i===0};})});first=false;});
    var g=koGridFrom(c.matches);
    if(g){var rows=[];g.forEach(function(round){round.forEach(function(m){if(!m||m.status==="empty")return;rows.push({cells:[m.roundName||"",(m.p1Name||"Por definir")+" vs "+(m.p2Name||(m.status==="bye"?"-":"Por definir")),m.status==="bye"?"Pase directo":(isDone(m)?matchScoreText(m):(m.startTime?"Pendiente "+m.startTime:"Pendiente")),isResolved(m)?(winnerName(m)||""):""]});});});
      var ch=champion(c);sections.push({heading:first?c.name:null,sub:"Playoffs",note:ch?"Campeón: "+ch.name+(ch.runner?" · Subcampeón: "+ch.runner:""):null,cols:[{t:"RONDA",w:34},{t:"PARTIDO",w:80},{t:"RESULTADO",w:42},{t:"GANADOR",w:30}],rows:rows});first=false;}
  });
  if(!sections.length){toast("Aún no hay resultados para exportar.","warn");return null;}
  return{title:"TORNEOS SQUASH POPAYÁN",sub:"Clasificación y resultados · "+new Date().toLocaleString("es-CO"),orient:"portrait",file:"resultados-torneos-squash-popayan.pdf",sections:sections};
}
function exportReport(kind){
  var rep=kind==="results"?resultsReport():scheduleReport();if(!rep)return;
  if(window.jspdf&&window.jspdf.jsPDF){try{makePdf(rep);toast("PDF descargado","ok");return;}catch(e){console.error(e);}}
  printReport(rep);
}
function makePdf(rep){
  var J=window.jspdf.jsPDF,doc=new J({orientation:rep.orient,unit:"mm",format:"a4"}),W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(),m=12,y=15;
  function header(){doc.setTextColor(0,60,85);doc.setFont("helvetica","bold");doc.setFontSize(16);doc.text(pdfSafe(rep.title),m,y);doc.setTextColor(90);doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.text(pdfSafe(rep.sub),m,y+5.5);doc.setDrawColor(0,160,200);doc.setLineWidth(.6);doc.line(m,y+8,W-m,y+8);y+=14;}
  function footer(){doc.setFontSize(7);doc.setTextColor(130);doc.text(pdfSafe("Torneos Squash Popayán · by ManuSquash · Página "+doc.getNumberOfPages()),m,H-6);}
  function newPage(){footer();doc.addPage();y=15;header();}
  function fit(s,w){s=pdfSafe(s);if(doc.getTextWidth(s)<=w)return s;while(s.length>1&&doc.getTextWidth(s+"...")>w)s=s.slice(0,-1);return s+"...";}
  header();
  rep.sections.forEach(function(sec){
    var rh=7.5,tw=0;sec.cols.forEach(function(c){tw+=c.w;});
    if(y+(sec.heading?10:0)+(sec.sub?7:0)+rh*3>H-12)newPage();
    if(sec.heading){doc.setFont("helvetica","bold");doc.setFontSize(12);doc.setTextColor(0,90,120);doc.text(pdfSafe(sec.heading),m,y+4);y+=8;}
    if(sec.sub){doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.setTextColor(60);doc.text(pdfSafe(sec.sub),m,y+3.5);y+=6;}
    function head(){doc.setLineWidth(.2);doc.setFillColor(232,242,247);doc.rect(m,y,tw,rh,"F");doc.setDrawColor(170);doc.rect(m,y,tw,rh);doc.setFont("helvetica","bold");doc.setFontSize(7.5);doc.setTextColor(40);var x=m;sec.cols.forEach(function(c){doc.text(pdfSafe(c.t),x+1.6,y+rh-2.4);x+=c.w;});y+=rh;}
    head();
    sec.rows.forEach(function(r){
      if(y+rh>H-12){newPage();head();}
      doc.setDrawColor(205);doc.rect(m,y,tw,rh);doc.setFont("helvetica",r.bold?"bold":"normal");doc.setFontSize(8);doc.setTextColor(25);var x=m;
      sec.cols.forEach(function(c,i){var val=r.cells[i];if(val===null||val===undefined){doc.setDrawColor(110);doc.line(x+2,y+rh-2,x+c.w-2,y+rh-2);doc.setDrawColor(205);}else doc.text(fit(val,c.w-3),x+1.6,y+rh-2.4);x+=c.w;});
      y+=rh;});
    if(sec.note){doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(150,110,0);doc.text(pdfSafe(sec.note),m,y+5);y+=7;}
    y+=5;
  });
  footer();doc.save(rep.file);
}
function printReport(rep){
  var win=window.open("","_blank");if(!win){toast("El navegador bloqueó la ventana de impresión. Permite ventanas emergentes.","err");return;}
  var h='<!doctype html><html><head><meta charset="utf-8"><title>'+escH(rep.title)+'</title><style>body{font-family:Arial,sans-serif;color:#111;margin:24px}h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:18px 0 4px;color:#035a78}h3{font-size:12px;margin:10px 0 4px}.sub{font-size:11px;color:#555;margin-bottom:14px}table{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:8px}th,td{border:1px solid #aaa;padding:5px}th{background:#eee;text-align:left}.note{font-weight:bold;color:#8a6400}@media print{body{margin:10mm}}</style></head><body><h1>'+escH(rep.title)+'</h1><div class="sub">'+escH(rep.sub)+'</div>';
  rep.sections.forEach(function(s){if(s.heading)h+='<h2>'+escH(s.heading)+'</h2>';if(s.sub)h+='<h3>'+escH(s.sub)+'</h3>';h+='<table><thead><tr>'+s.cols.map(function(c){return'<th>'+escH(c.t)+'</th>';}).join("")+'</tr></thead><tbody>';
    s.rows.forEach(function(r){h+='<tr>'+r.cells.map(function(v){return'<td>'+(v===null||v===undefined?'&nbsp;':escH(v))+'</td>';}).join("")+'</tr>';});h+='</tbody></table>';if(s.note)h+='<div class="note">'+escH(s.note)+'</div>';});
  h+='<script>setTimeout(function(){window.print()},300)<\/script></body></html>';win.document.write(h);win.document.close();
}

// ══════════════════════════════════════════════════════════════
// ARRANQUE Y SINCRONIZACIÓN
// ══════════════════════════════════════════════════════════════
function onDbValue(snap){
  var raw=snap.val();
  DB_EMPTY=!raw||!toArr(raw.categories).some(isObj);
  LOADED=true;FROM_CACHE=false;
  ST=normalizeState(raw,true);
  validateRoles();
  if(SC.match)syncScoreFromRemote();
  if(ACTIVEC>=ST.categories.length)ACTIVEC=0;
  cacheState();rerender();updateSyncUI();
}
function startApp(){
  restoreRole();
  var cache=loadCache();if(cache){ST=normalizeState(cache.st,false);FROM_CACHE=true;}
  if(typeof firebase==="undefined"){FB_OK=false;if(!ST)ST=initState();LOADED=true;render();toast("No se pudo cargar el servicio en línea. Revisa tu conexión.","err");return;}
  try{
    var app;try{app=firebase.app("tsq");}catch(e){app=firebase.initializeApp(FB,"tsq");}
    var db=firebase.database(app);DB=db.ref(DB_PATH);FB_OK=true;
    DB.on("value",onDbValue,function(e){console.error(e);toast("Error leyendo el torneo: "+((e&&e.message)||e),"err");});
    db.ref(".info/connected").on("value",function(snap){var was=CONNECTED;CONNECTED=!!snap.val();updateSyncUI();if(CONNECTED&&!was&&EVER_CONNECTED)toast("Conexión restablecida","ok");if(CONNECTED)EVER_CONNECTED=true;if(was!==CONNECTED&&LOADED)rerender();});
  }catch(e){console.error(e);FB_OK=false;DB=null;if(!ST)ST=initState();LOADED=true;}
  render();
  setTimeout(function(){if(!LOADED||FROM_CACHE){LOAD_SLOW=true;rerender();}},9000);
}
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){
    if(UI_STATE.confirm){closeConfirm();return;}
    if(UI_STATE.prompt){UI_STATE.prompt=null;rerender();return;}
    var keys=["manualMatchId","schedMatchId"],flags=["showKO","showResched","showBackup","showSetup","showAdmin","showJudge"],hit=false;
    keys.forEach(function(k){if(!hit&&UI_STATE[k]){UI_STATE[k]=null;hit=true;}});flags.forEach(function(k){if(!hit&&UI_STATE[k]){UI_STATE[k]=false;hit=true;}});
    if(hit){render();return;}
  }
  if(!SC.match||!scEditable()||SC.phase!=="playing"||UI_STATE.confirm)return;
  var tg=e.target&&e.target.tagName;if(tg==="INPUT"||tg==="TEXTAREA"||tg==="SELECT"||e.repeat)return;
  if(e.key==="1"||e.key==="ArrowLeft"){e.preventDefault();scRally(1,"point");}
  else if(e.key==="2"||e.key==="ArrowRight"){e.preventDefault();scRally(2,"point");}
  else if(e.key==="l"||e.key==="L"){e.preventDefault();scRally(null,"let");}
  else if(e.key==="Backspace"||((e.ctrlKey||e.metaKey)&&(e.key==="z"||e.key==="Z"))){e.preventDefault();scUndo();}
});
document.addEventListener("visibilitychange",function(){if(!SC.match)return;if(document.visibilityState==="hidden")scFlush();else if(SC.editing&&!isDone(SC.match))startWake();});
window.addEventListener("pagehide",function(){if(SC.match)scFlush();});
window.addEventListener("beforeunload",function(e){if(PENDING>0||(SC.match&&SC.dirty)){scFlush();e.preventDefault();e.returnValue="";}});
var rsT=null;window.addEventListener("resize",function(){clearTimeout(rsT);rsT=setTimeout(function(){document.querySelectorAll(".ko-stage").forEach(drawBracketConnections);},150);});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){document.querySelectorAll(".ko-stage").forEach(drawBracketConnections);});
window.onload=startApp;
</script>
