<template class="chapter-src" data-id="hidrostatica" data-num="3" data-title="Hidrostática" data-part="Parte I · Fluidos en reposo" data-short="La ecuación fundamental de la hidrostática, el principio de Pascal y la prensa hidráulica, manómetros y barómetros, la atmósfera estándar y Popayán, el océano compresible y los fluidos en equilibrio relativo">
<p class="lead">En un fluido en reposo no hay esfuerzos cortantes; la única fuerza de superficie es la presión, y debe equilibrar al peso. De ese balance sale una ecuación de una línea que explica los barómetros, los gatos hidráulicos, la presión arterial, el aire enrarecido de la montaña y la forma de la superficie del café que se revuelve.</p>

<section>
<h2>La ecuación fundamental</h2>
<p>Considere un cubo de fluido de lados \(\dd x,\dd y,\dd z\). La presión en la cara inferior empuja hacia arriba con \(p\,\dd x\dd y\); la de la cara superior, hacia abajo con \((p+\partial p/\partial z\,\dd z)\dd x\dd y\). El balance con el peso \(\rho g\,\dd x\dd y\dd z\), y el mismo razonamiento en las otras direcciones, dan</p>
<div class="eq key" data-name="Ecuación de la hidrostática">\[\grad p=\rho\vb g\qquad\Longrightarrow\qquad \odv{p}{z}=-\rho g.\]</div>
<p>La presión cambia solo en la dirección de la gravedad: las superficies de igual presión (isobaras) son horizontales. Para un líquido de densidad constante, con \(h\) medida hacia abajo desde la superficie libre a presión \(p_0\),</p>
<div class="eq">\[p=p_0+\rho gh.\]</div>
<p>Cada 10 m de agua añaden 97.9 kPa, casi una atmósfera. La presión depende solo de la profundidad, no de la forma del recipiente: es la <span class="term">paradoja hidrostática</span>. En vasos comunicantes de formas distintas el líquido alcanza el mismo nivel, y un tubo delgado de 10 m lleno de agua produce en su base la misma presión que una piscina de 10 m de profundidad. Pascal la demostró, según la tradición, reventando un barril con un tubo largo y unas pocas jarras de agua.</p>
<div class="box law"><h4>Principio de Pascal</h4><p>Un cambio de presión aplicado a un fluido encerrado en reposo se transmite sin disminución a todos sus puntos y a las paredes del recipiente. Es consecuencia directa de \(p=p_0+\rho gh\): si \(p_0\) aumenta, la presión aumenta lo mismo en todas partes.</p></div>
</section>

<section>
<h2>Manómetros y barómetros</h2>
<p>Torricelli llenó en 1643 un tubo de vidrio con mercurio y lo invirtió en una cubeta: la columna bajó hasta unos 76 cm, dejando vacío arriba. La presión atmosférica sostiene la columna: \(p_{atm}=\rho_{Hg}gh\). Con la densidad del mercurio a 0 °C, 13 595 kg/m³, la atmósfera estándar equivale a 760.0 mm. En Popayán la columna mide 614 mm; un barómetro de agua necesitaría 8.37 m en vez de 10.35 m.</p>
<p>Un <span class="term">manómetro de tubo en U</span> compara dos presiones a través de columnas de líquido. Recorriendo el tubo desde un extremo, sumando \(\rho gh\) al bajar y restándolo al subir:</p>
<div class="eq">\[p_A+\rho_A g h_A-\rho_m g h_m=p_{atm}\qquad\Longrightarrow\qquad p_A-p_{atm}=\rho_mgh_m-\rho_Agh_A.\]</div>
<p>El líquido manométrico se elige según el rango: mercurio para presiones grandes, agua o aceite para pequeñas. Inclinar la rama de lectura un ángulo \(\theta\) amplifica la lectura en \(1/\sin\theta\): un manómetro inclinado a 10° alarga la columna 5.8 veces y permite medir diferencias de pocos pascales en ductos de ventilación.</p>
<div class="sim" data-sim="manometro" data-title="Manómetro de tubo en U y manómetro inclinado"></div>
<div class="sim-guide"><ul>
<li>Fije la presión manométrica del tanque y cambie el líquido del manómetro: con mercurio la columna es 13.6 veces más corta que con agua.</li>
<li>Incline la rama derecha: el desnivel vertical no cambia, pero la longitud que se lee a lo largo del tubo crece como \(1/\sin\theta\).</li>
</ul></div>
<p>La presión arterial se mide aún en milímetros de mercurio: 120/80 mmHg significa una presión sistólica de 16.0 kPa por encima de la atmosférica. En una persona de pie, la presión en los pies supera a la del corazón en \(\rho_{sangre}g\Delta h\approx1060\times9.81\times1.3=13.5\) kPa, unos 100 mmHg: por eso se mide a la altura del corazón.</p>
</section>

<section>
<h2>La prensa hidráulica</h2>
<p>Dos pistones de áreas \(A_1\) y \(A_2\) conectados por un líquido soportan la misma presión (despreciando la diferencia de altura). La fuerza se multiplica por el cociente de áreas:</p>
<div class="eq">\[F_2=F_1\frac{A_2}{A_1},\qquad \frac{d_1}{d_2}=\frac{A_2}{A_1}.\]</div>
<p>El trabajo se conserva: lo que se gana en fuerza se pierde en recorrido. Un elevador de taller con pistones de 2 cm y 30 cm de diámetro (cociente de áreas 225) levanta un automóvil de 1500 kg con 65 N, el peso de 6.7 kg; pero para subirlo 10 cm el pistón pequeño debe recorrer 22.5 m, y por eso se bombea en muchas carreras con válvulas de retención. Los frenos de los automóviles, las excavadoras y las prensas de forja usan el mismo principio.</p>
<div class="sim" data-sim="prensa-hidraulica" data-title="Prensa hidráulica: multiplicación de fuerza y conservación del trabajo"></div>
<div class="sim-guide"><ul>
<li>Arrastre el pistón pequeño hacia abajo o use la animación. El volumen desplazado es el mismo en ambos lados.</li>
<li>Las barras de trabajo de entrada y de salida son iguales: la prensa no crea energía.</li>
</ul></div>
</section>

<section>
<h2>La atmósfera</h2>
<p>En un gas la densidad depende de la presión, \(\rho=p/R_gT\), y la ecuación de la hidrostática se convierte en \(\dd p/p=-g\,\dd z/(R_gT)\). Si la temperatura fuera uniforme, la presión caería exponencialmente:</p>
<div class="eq">\[p=p_0\,\ee^{-z/H},\qquad H=\frac{R_gT}{g}=8.43\un{km}\ \ (T=288\un{K}).\]</div>
<p>En la troposfera la temperatura baja casi linealmente, \(T=T_0-Lz\) con \(L=6.5\) K/km, porque el aire que asciende se expande y se enfría. Integrando,</p>
<div class="eq key" data-name="Atmósfera estándar (troposfera)">\[p=p_0\left(1-\frac{Lz}{T_0}\right)^{gM/RL},\qquad \frac{gM}{RL}=5.256.\]</div>
<p>La <span class="term">atmósfera estándar</span> de 1976, usada en aviación y en este curso, fija \(T_0=288.15\) K y \(p_0=101.325\) kPa al nivel del mar y define capas con gradientes distintos hasta 86 km. A 1760 m da 81.9 kPa para Popayán; a 2640 m, 73.4 kPa para Bogotá; en la cima del Everest, 31.5 kPa, menos de un tercio de la del mar. Los altímetros de los aviones son barómetros calibrados con esta atmósfera.</p>
<div class="sim" data-sim="barometro-atm" data-title="La atmósfera estándar: presión, temperatura y columnas barométricas"></div>
<div class="sim-guide"><ul>
<li>Compare la atmósfera estándar con la isotérmica: hasta unos 3 km apenas difieren; en el Everest la isotérmica sobrestima la presión en 13 %.</li>
<li>A la derecha, las columnas de mercurio y de agua que sostiene la atmósfera a la altitud elegida.</li>
</ul></div>
</section>

<section>
<h2>El océano</h2>
<p>En el agua de mar (\(\rho\approx1025\) kg/m³) la presión aumenta una atmósfera cada 10.1 m. En la fosa de las Marianas, a casi 11 km de profundidad, supera los 1000 bar: unos 110 MPa. A esas presiones la compresibilidad deja de ser despreciable. Si el módulo volumétrico \(K\) se toma constante, \(\rho=\rho_0\ee^{p/K}\), y la integración da</p>
<div class="eq">\[p=-K\ln\left(1-\frac{\rho_0gh}{K}\right)\approx\rho_0gh\left(1+\frac{\rho_0gh}{2K}\right).\]</div>
<p>Con \(K=2.34\) GPa, a 10 935 m el modelo da 112.6 MPa frente a 109.9 MPa del líquido incompresible: la compresión añade un 2.4 %. En el océano real también influyen la temperatura, la salinidad y el aumento de \(K\) con la presión.</p>
</section>

<section>
<h2>Equilibrio relativo: fluidos acelerados y en rotación</h2>
<p>Si un recipiente se mueve como un cuerpo rígido, el fluido dentro de él no tiene deformación y sigue sin esfuerzos cortantes. En el sistema que acompaña al recipiente basta sumar a la gravedad la fuerza ficticia \(-\vb a\): \(\grad p=\rho(\vb g-\vb a)\). Las isobaras, y la superficie libre entre ellas, son perpendiculares a la gravedad efectiva.</p>
<p>Un tanque con aceleración horizontal \(a\) inclina su superficie un ángulo \(\tan\theta=a/g\): un camión cisterna que frena derrama hacia adelante. En un recipiente que gira con velocidad angular \(\omega\), la aceleración centrípeta \(-\omega^2r\,\uv r\) hace que la superficie sea un paraboloide:</p>
<div class="eq key" data-name="Paraboloide de rotación">\[z_s(r)=z_0+\frac{\omega^2r^2}{2g},\qquad p=p_0+\rho g(z_s-z).\]</div>
<p>Los telescopios de espejo líquido aprovechan esta forma: un plato de mercurio que gira produce un espejo parabólico perfecto, de distancia focal \(f=g/(2\omega^2)\), 4.5 m a 10 rpm.</p>
<div class="sim" data-sim="tanque-rotante" data-title="Tanque acelerado y recipiente en rotación: superficie libre e isobaras"></div>
<div class="sim-guide"><ul>
<li>En rotación, el volumen se conserva: el centro baja lo mismo que sube el borde respecto al nivel en reposo, \(\omega^2R^2/4g\). Si gira demasiado rápido, el fondo queda seco en el centro.</li>
<li>Las isobaras (líneas finas) son paraboloides paralelos a la superficie: la presión en el fondo es mayor en el borde.</li>
</ul></div>
<div class="box ex"><h4>Café que se revuelve</h4><p>Una taza de 8 cm de diámetro con café que gira a 2 vueltas por segundo (\(\omega=12.6\) rad/s) forma un paraboloide con desnivel \(\omega^2R^2/2g=12.6^2\times0.04^2/19.6=1.3\) cm entre el centro y el borde. El centro baja 0.64 cm y el borde sube lo mismo respecto al nivel en reposo.</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Qué presión absoluta soporta un buzo a 25 m de profundidad en el mar, cerca de Buenaventura?
<details><summary>Respuesta</summary><p>\(p=101.3+1025\times9.807\times25/1000=101.3+251.3=352.6\) kPa, unas 3.5 atm.</p></details></li>
<li><span class="lvl">Básico</span>Un manómetro de mercurio conectado a un tanque de gas marca 25 cm de desnivel. ¿Cuál es la presión manométrica del gas?
<details><summary>Respuesta</summary><p>\(13\,546\times9.807\times0.25=33.2\) kPa (densidad del mercurio a 20 °C; la del gas es despreciable).</p></details></li>
<li><span class="lvl">Intermedio</span>Con la atmósfera estándar, ¿a qué altitud la presión es la mitad de la del nivel del mar? Compare con el modelo isotérmico a 288 K.
<details><summary>Respuesta</summary><p>Troposfera: \(1-Lz/T_0=0.5^{1/5.256}=0.8762\) → \(z=5.48\) km. Isotérmico: \(z=H\ln2=5.85\) km.</p></details></li>
<li><span class="lvl">Intermedio</span>Un tanque abierto de 2 m de largo con 1 m de agua acelera horizontalmente a 3 m/s². ¿Cuánto sube el agua en la pared trasera? ¿Qué altura mínima debe tener para no derramar?
<details><summary>Respuesta</summary><p>\(\tan\theta=3/9.807=0.306\); la superficie sube \(0.306\times1=0.306\) m en la pared trasera y baja lo mismo en la delantera. Altura mínima 1.31 m.</p></details></li>
<li><span class="lvl">Avanzado</span>Un cilindro de 30 cm de diámetro con 40 cm de agua gira alrededor de su eje. ¿A qué velocidad angular el centro del fondo queda justo seco? ¿Qué altura alcanza entonces el agua en la pared?
<details><summary>Respuesta</summary><p>Con volumen constante, el centro está \(\omega^2R^2/4g\) por debajo del nivel inicial: \(\omega^2R^2/4g=0.40\) → \(\omega=\sqrt{4\times9.807\times0.40}/0.15=26.4\) rad/s (252 rpm). El borde queda a \(0.40+0.40=0.80\) m.</p></details></li>
</ol>
