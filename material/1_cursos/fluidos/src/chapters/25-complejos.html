<p class="lead">La salsa de tomate no sale del frasco hasta que se agita, la pintura no chorrea de la brocha pero se extiende con facilidad, la mezcla de maicena y agua se vuelve dura al golpearla y la pasta de dientes se queda sobre el cepillo. Son fluidos cuya viscosidad depende de cómo se los deforma. La sangre es uno de ellos, y su flujo pulsátil por un árbol de vasos ramificados es uno de los problemas más bellos de la mecánica de fluidos.</p>

<section>
<h2>Más allá de Newton</h2>
<p>En un fluido newtoniano el esfuerzo cortante es proporcional a la rapidez de deformación, \(\tau=\mu\dot\gamma\). Muchos fluidos con microestructura (polímeros, partículas en suspensión, gotas, células) se apartan de esa ley:</p>
<ul>
<li><b>Adelgazantes por cizalla</b> (pseudoplásticos): la viscosidad aparente \(\eta=\tau/\dot\gamma\) baja al aumentar \(\dot\gamma\), porque las moléculas o partículas se alinean con el flujo. Salsas, pinturas, champú, sangre.</li>
<li><b>Espesantes por cizalla</b> (dilatantes): la viscosidad sube con \(\dot\gamma\). La mezcla concentrada de maicena y agua permite correr sobre ella pero hunde a quien se queda quieto.</li>
<li><b>Plásticos con esfuerzo de fluencia</b>: no fluyen hasta que el esfuerzo supera un umbral \(\tau_y\). Pasta de dientes, mayonesa, barro, concreto fresco.</li>
<li><b>Tixotrópicos</b>: la viscosidad baja con el tiempo de agitación y se recupera en reposo. Yogur, pinturas antigoteo, lodos de perforación.</li>
<li><b>Viscoelásticos</b>: tienen memoria elástica. Un fluido polimérico sube por una varilla que gira (efecto Weissenberg) en vez de formar un remolino, y un chorro que sale de un tubo se hincha. El número de Deborah (capítulo 1) decide si dominan la viscosidad o la elasticidad.</li>
</ul>
</section>

<section>
<h2>Modelos reológicos</h2>
<div class="tablewrap"><table>
<tr><th>Modelo</th><th class="c">Esfuerzo \(\tau(\dot\gamma)\)</th><th>Uso típico</th></tr>
<tr><td>Ley de potencia (Ostwald–de Waele)</td><td class="c">\(K\dot\gamma^{\,n}\)</td><td>\(n&lt;1\) adelgazante, \(n&gt;1\) espesante</td></tr>
<tr><td>Plástico de Bingham</td><td class="c">\(\tau_y+\mu_p\dot\gamma\)</td><td>pastas, lodos, concreto</td></tr>
<tr><td>Herschel–Bulkley</td><td class="c">\(\tau_y+K\dot\gamma^{\,n}\)</td><td>alimentos, cosméticos</td></tr>
<tr><td>Casson</td><td class="c">\(\left(\sqrt{\tau_y}+\sqrt{\mu_\infty\dot\gamma}\right)^2\)</td><td>sangre, chocolate fundido</td></tr>
</table></div>
<div class="sim" data-sim="reograma" data-title="Reogramas: esfuerzo y viscosidad aparente de distintos modelos"></div>
<div class="sim-guide"><ul>
<li>En escala logarítmica la ley de potencia es una recta de pendiente \(n\). El modelo de Bingham tiene ordenada en el origen \(\tau_y\): por debajo de ese esfuerzo el material se comporta como sólido.</li>
<li>La viscosidad aparente de un plástico diverge a cizalla baja: por eso la pasta de dientes no se escurre del cepillo.</li>

<section>
<h2>Flujo en tubos</h2>
<p>Con el balance de fuerzas de un tubo, \(\tau(r)=Gr/2\), válido para cualquier fluido, y la ley constitutiva, se integra el perfil de velocidad. Para la ley de potencia,</p>
<div class="eq">\[u(r)=\frac{n}{n+1}\left(\frac{G}{2K}\right)^{1/n}\left(R^{(n+1)/n}-r^{(n+1)/n}\right),\qquad Q=\frac{\pi n}{3n+1}\left(\frac{G}{2K}\right)^{1/n}R^{(3n+1)/n}.\]</div>
<p>Con \(n&lt;1\) el perfil es más plano que la parábola; con \(n\to0\), un tapón. Un plástico de Bingham fluye como un tapón rígido en el centro, donde \(\tau&lt;\tau_y\), de radio \(r_p=2\tau_y/G\), rodeado de una zona que se cizalla. Su caudal es la fórmula de Buckingham–Reiner,</p>
<div class="eq">\[Q=\frac{\pi R^4G}{8\mu_p}\left[1-\frac43\frac{\tau_y}{\tau_w}+\frac13\left(\frac{\tau_y}{\tau_w}\right)^4\right],\qquad\tau_w=\frac{GR}{2},\]</div>
<p>y si \(\tau_w&lt;\tau_y\) no hay flujo: un gradiente de presión pequeño no basta para mover el barro por una tubería.</p>
<div class="sim" data-sim="ley-potencia-tubo" data-title="Perfiles de velocidad de fluidos no newtonianos en un tubo"></div>
<div class="sim-guide"><ul>
<li>Todos los perfiles se normalizan con su velocidad media. Baje \(n\): el perfil se aplana y el esfuerzo en la pared, para un mismo caudal, cambia.</li>
<li>Con Bingham, aumente \(\tau_y\) hasta que el tapón llene el tubo: el flujo se detiene.</li>
</ul></div>
</section>

<section>
<h2>La sangre</h2>
<p>La sangre es una suspensión de glóbulos rojos (alrededor del 45 % del volumen, el hematocrito) en plasma, un líquido newtoniano. A cizallas bajas los glóbulos se apilan en rouleaux y la viscosidad aparente sube; a cizallas altas se deforman y se alinean, y la viscosidad tiende a unos 3.5 mPa·s. El modelo de Casson la describe bien, con un pequeño esfuerzo de fluencia. En tubos de menos de unos 300 µm aparece el <span class="term">efecto Fåhræus–Lindqvist</span>: la viscosidad aparente <em>disminuye</em> con el diámetro, porque los glóbulos migran hacia el eje y dejan junto a la pared una capa de plasma que lubrica el flujo.</p>
<p>El flujo arterial es pulsátil. Para un gradiente de presión oscilante, Womersley (1955) resolvió las ecuaciones de Navier–Stokes en un tubo con funciones de Bessel de argumento complejo:</p>
<div class="eq key" data-name="Flujo de Womersley">\[u(r,t)=\Re\left\{\frac{A}{\ii\rho\omega}\left[1-\frac{J_0\!\left(\ii^{3/2}\alpha\,r/R\right)}{J_0\!\left(\ii^{3/2}\alpha\right)}\right]\ee^{\ii\omega t}\right\},\qquad\alpha=R\sqrt{\frac{\omega}{\nu}}.\]</div>
<p>El <span class="term">número de Womersley</span> \(\alpha\) compara la frecuencia del pulso con el tiempo de difusión viscosa a través del vaso. Con \(\alpha&lt;1\) el flujo es casi estacionario: un Poiseuille que sube y baja en fase con la presión. Con \(\alpha\gg1\) el centro se mueve como un tapón dominado por la inercia, retrasado 90° respecto al gradiente, y la viscosidad solo actúa en una capa de Stokes junto a la pared. Con 70 latidos por minuto, en la aorta \(\alpha\approx19\); en la carótida, 4.5; en una arteriola, 0.08.</p>
<div class="sim" data-sim="womersley" data-title="Flujo pulsátil de Womersley: solución de Bessel y diferencias finitas"></div>
<div class="sim-guide"><ul>
<li>Los perfiles se calculan con la función de Bessel compleja \(J_0\) y se comparan con una integración numérica (Crank–Nicolson en coordenadas cilíndricas) una vez que pasa el transitorio inicial.</li>
<li>Con \(\alpha\) grande aparece flujo inverso cerca de la pared mientras el centro aún avanza: lo que muestran los ecógrafos Doppler en las arterias grandes.</li>
</ul></div>
</section>

<section>
<h2>La ley de Murray</h2>
<p>¿Qué radio debe tener un vaso que transporta un caudal \(Q\)? Un vaso estrecho exige mucha potencia de bombeo, \(8\mu Q^2L/\pi r^4\) por Poiseuille; uno ancho contiene mucha sangre, que hay que producir y mantener, con un costo proporcional a su volumen \(b\pi r^2L\). Murray (1926) minimizó la suma y encontró</p>
<div class="eq key" data-name="Ley de Murray">\[Q\propto r^3,\qquad r_0^3=r_1^3+r_2^3\ \text{en cada bifurcación}.\]</div>
<p>En una bifurcación simétrica cada rama tiene \(2^{-1/3}=0.794\) veces el radio del tronco. Una consecuencia elegante es que el esfuerzo en la pared, \(4\mu Q/\pi r^3\), es el mismo en todos los vasos del árbol: las células del endotelio lo perciben y regulan el diámetro para mantenerlo. La ley se cumple bien en arterias pequeñas y en el xilema de muchas plantas, y peor en la aorta, donde el flujo es pulsátil y turbulento.</p>
<div class="sim" data-sim="murray" data-title="Ley de Murray: costo mínimo y ramificaciones"></div>
<div class="sim-guide"><ul>
<li>La curva de costo total tiene un mínimo; el radio óptimo crece como \(Q^{1/3}\).</li>
<li>El árbol dibujado sigue \(r_0^3=r_1^3+r_2^3\) con la fracción de caudal elegida; la lectura muestra que el esfuerzo en la pared es igual en todas las generaciones.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un fluido de ley de potencia tiene \(K=10\) Pa·sⁿ y \(n=0.4\). ¿Cuál es su viscosidad aparente a 1 s⁻¹ y a 100 s⁻¹?
<details><summary>Respuesta</summary><p>\(\eta=K\dot\gamma^{n-1}\): 10 Pa·s y \(10\times100^{-0.6}=0.63\) Pa·s.</p></details></li>
<li><span class="lvl">Básico</span>¿Qué número de Womersley tiene la aorta de un perro (radio 0.8 cm, 120 latidos por minuto, \(\nu=3.3\times10^{-6}\) m²/s)?
<details><summary>Respuesta</summary><p>\(\omega=12.6\) rad/s; \(\alpha=0.008\sqrt{12.6/3.3\times10^{-6}}=15.6\).</p></details></li>
<li><span class="lvl">Intermedio</span>Un lodo de perforación con \(\tau_y=10\) Pa y \(\mu_p=0.03\) Pa·s está en un tubo de 10 cm. ¿Qué gradiente de presión mínimo lo pone en movimiento?
<details><summary>Respuesta</summary><p>\(\tau_w=GR/2&gt;\tau_y\) → \(G&gt;2\tau_y/R=400\) Pa/m.</p></details></li>
<li><span class="lvl">Intermedio</span>Una arteria de 4 mm de diámetro se bifurca en dos ramas iguales. Según Murray, ¿qué diámetro tienen? ¿Y si la rama mayor lleva el 70 % del caudal?
<details><summary>Respuesta</summary><p>Simétrica: \(4\times0.794=3.17\) mm. Con 70/30: \(d_1=4\times0.7^{1/3}=3.55\) mm y \(d_2=4\times0.3^{1/3}=2.68\) mm.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre la ley de Murray minimizando \(P(r)=8\mu Q^2/\pi r^4+b\pi r^2\) por unidad de longitud, y que en el óptimo el esfuerzo en la pared no depende de \(Q\).
<details><summary>Respuesta</summary><p>\(\dd P/\dd r=-32\mu Q^2/\pi r^5+2b\pi r=0\) → \(Q^2=b\pi^2r^6/16\mu\), es decir \(Q=(\pi/4)\sqrt{b/\mu}\,r^3\). Entonces \(\tau_w=4\mu Q/\pi r^3=\sqrt{b\mu}\), igual en todo el árbol.</p></details></li>
</ol>
