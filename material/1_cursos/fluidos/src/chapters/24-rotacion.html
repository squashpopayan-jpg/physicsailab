<p class="lead">La atmósfera y el océano se mueven sobre un planeta que gira. A escalas de cientos de kilómetros y de días, la rotación domina: los vientos soplan a lo largo de las isobaras en vez de cruzarlas, los ciclones giran en sentidos opuestos en cada hemisferio y el viento empuja el agua del mar hacia un costado. Popayán, a 2.44° de latitud norte, está casi sobre el ecuador, donde la rotación horizontal efectiva se anula: un lugar privilegiado para entender qué cambia cuando falta.</p>

<section>
<h2>Las fuerzas de la rotación</h2>
<p>En un sistema que gira con velocidad angular \(\boldsymbol\Omega\), las ecuaciones de Navier–Stokes adquieren dos términos ficticios:</p>
<div class="eq key" data-name="Navier–Stokes en un sistema en rotación">\[\frac{D\vb u}{Dt}+2\boldsymbol\Omega\times\vb u+\boldsymbol\Omega\times(\boldsymbol\Omega\times\vb r)=-\frac{1}{\rho}\grad p+\nu\lap\vb u+\vb g.\]</div>
<p>La fuerza centrífuga se combina con la gravedad en la gravedad efectiva, que define la «vertical» local. La <span class="term">fuerza de Coriolis</span> \(-2\boldsymbol\Omega\times\vb u\) desvía los movimientos sin hacer trabajo. Para movimientos horizontales en la Tierra solo importa la componente vertical de \(\boldsymbol\Omega\), y la desviación la mide el <span class="term">parámetro de Coriolis</span></p>
<div class="eq">\[f=2\Omega\sin\phi,\qquad\Omega=7.292\times10^{-5}\un{rad/s}.\]</div>
<p>A 45° de latitud \(f=1.03\times10^{-4}\) s⁻¹; en Popayán, 17 veces menos, \(6.2\times10^{-6}\) s⁻¹. La importancia de la rotación la da el <span class="term">número de Rossby</span> \(\mathrm{Ro}=U/fL\), cociente entre la inercia y Coriolis. En una bañera, \(\mathrm{Ro}\sim2000\): la rotación de la Tierra es irrelevante y el sentido del remolino lo deciden las corrientes residuales del llenado, no el hemisferio. Shapiro (1962) solo pudo verla tras dejar reposar el agua un día en un tanque de 2 m. En un huracán, \(\mathrm{Ro}\sim1\); en las corrientes oceánicas de gran escala, \(\mathrm{Ro}\ll1\).</p>
</section>

<section>
<h2>Oscilaciones inerciales</h2>
<p>Una parcela de fluido que se mueve horizontalmente sin otras fuerzas que Coriolis describe un círculo de radio \(U/f\) con periodo \(2\pi/f\), en sentido horario en el hemisferio norte. Son las <span class="term">oscilaciones inerciales</span>, que se observan en el océano tras el paso de una tormenta. A 45° el periodo es de 16.9 horas y una corriente de 20 cm/s describe círculos de 2 km; en Popayán el periodo sería de casi 12 días, más largo que la vida de cualquier perturbación: cerca del ecuador la rotación casi no organiza el movimiento horizontal.</p>
<div class="sim" data-sim="coriolis-proyectil" data-title="Oscilaciones inerciales: una parcela libre en la Tierra que gira"></div>
<div class="sim-guide"><ul>
<li>La trayectoria es un círculo recorrido en sentido horario en el hemisferio norte y antihorario en el sur. En el ecuador, \(f=0\) y la parcela sigue en línea recta.</li>
<li>Añada un rozamiento lineal: el círculo se convierte en una espiral hacia el centro.</li>
</ul></div>
</section>

<section>
<h2>El equilibrio geostrófico</h2>
<p>A gran escala (\(\mathrm{Ro}\ll1\)) y lejos de la superficie, la fuerza de Coriolis equilibra al gradiente de presión: es el <span class="term">equilibrio geostrófico</span>,</p>
<div class="eq key" data-name="Viento geostrófico">\[f\uv z\times\vb u_g=-\frac{1}{\rho}\grad p\qquad\Longrightarrow\qquad|\vb u_g|=\frac{1}{\rho f}\left|\grad p\right|.\]</div>
<p>El viento no va de las altas a las bajas presiones sino a lo largo de las isobaras: en el hemisferio norte deja la baja presión a la izquierda y gira en sentido antihorario alrededor de ella (ley de Buys-Ballot); en el sur, al revés. Un gradiente de 4 hPa en 200 km produce a 45° un viento de 16 m/s. Si se aplicara la misma fórmula en Popayán daría 270 m/s: absurdo. Cerca del ecuador el equilibrio geostrófico no puede sostener gradientes de presión importantes, y por eso los ciclones tropicales no se forman a menos de unos 5° de latitud y nunca cruzan el ecuador. La costa caribe de Colombia, a 11–12° N, está en el borde sur de su zona; el Pacífico colombiano, fuera de ella.</p>
<div class="sim" data-sim="geostrofico" data-title="Viento geostrófico y de gradiente alrededor de un centro de baja presión"></div>
<div class="sim-guide"><ul>
<li>Cambie la latitud: en el hemisferio sur el giro se invierte; cerca del ecuador el viento geostrófico necesario se dispara y el balance deja de ser posible.</li>
<li>El viento de gradiente incluye la fuerza centrífuga de la trayectoria curva: alrededor de una baja es menor que el geostrófico.</li>
</ul></div>
<h3>El teorema de Taylor–Proudman</h3>
<p>Si la rotación es muy rápida y el flujo lento y no viscoso, el equilibrio geostrófico implica \((\boldsymbol\Omega\cdot\grad)\vb u=0\): la velocidad no cambia a lo largo del eje de rotación. Un obstáculo en el fondo de un tanque que gira arrastra toda la columna de fluido que está sobre él: una <span class="term">columna de Taylor</span>, observada por G. I. Taylor en 1923. La rotación vuelve rígido al fluido en la dirección del eje.</p>
</section>

<section>
<h2>La capa de Ekman</h2>
<p>Cerca de la superficie del mar o del suelo, la fricción rompe el equilibrio geostrófico en una capa de espesor \(\delta_E=\sqrt{2\nu/f}\), donde \(\nu\) es la viscosidad turbulenta. Ekman (1905), a partir de las observaciones de Nansen de que el hielo a la deriva no seguía al viento sino que se desviaba 20–40° a la derecha, encontró la solución: en una capa de superficie impulsada por el viento, la corriente superficial va 45° a la derecha del viento (hemisferio norte) y gira y se debilita con la profundidad formando una espiral,</p>
<div class="eq">\[u+\ii v=V_0\,\ee^{-\ii\pi/4}\,\ee^{(1+\ii)z/\delta_E}\qquad(z\le0).\]</div>
<p>El transporte neto de agua en la capa es perpendicular al viento, a la derecha en el norte. Donde el viento sopla paralelo a una costa con ella a su izquierda (en el norte), el transporte de Ekman aleja el agua superficial y la reemplaza agua profunda, fría y rica en nutrientes: es el <span class="term">surgimiento costero</span> que hace de la costa de Perú una de las pesquerías más ricas del mundo. En el océano, con \(\nu\approx0.01\) m²/s a 45°, \(\delta_E\approx14\) m; en la atmósfera, cientos de metros.</p>
<div class="sim" data-sim="ekman" data-title="La espiral de Ekman en el océano y en la atmósfera"></div>
<div class="sim-guide"><ul>
<li>La hodógrafa (izquierda) une las puntas de las flechas de velocidad a distintas profundidades: es la espiral. El transporte integrado (flecha roja) forma 90° con el viento.</li>
<li>Cerca del ecuador \(\delta_E\) crece sin límite: la teoría de Ekman deja de valer, y aparecen corrientes ecuatoriales propias.</li>
</ul></div>
<div class="box ex"><h4>La paradoja de las hojas de té</h4><p>Al revolver el té y dejarlo girar, las hojas se juntan en el centro del fondo, no en el borde como sugiere la fuerza centrífuga. Einstein lo explicó en 1926: en el fondo, la fricción frena el giro y la presión radial, que equilibra el giro del fluido de arriba, empuja el agua lenta del fondo hacia el centro; allí sube y vuelve por arriba hacia afuera. Es una capa de Ekman en miniatura, de espesor \(\sqrt{\nu/\Omega}\approx0.7\) mm, y el mismo mecanismo hace que los ríos erosionen la orilla exterior de sus curvas.</p></div>
</section>

<section>
<h2>El péndulo de Foucault</h2>
<p>En 1851 Foucault colgó un péndulo de 67 m en el Panteón de París y mostró que su plano de oscilación giraba respecto al suelo: la Tierra gira bajo el péndulo. El plano da una vuelta completa en un tiempo</p>
<div class="eq">\[T_F=\frac{T_{sideral}}{\sin\phi}=\frac{23.93\un{h}}{\sin\phi}.\]</div>
<p>En los polos, un día sideral; en París, 31.8 horas; en Popayán, 562 horas: 23.4 días. En el ecuador no gira. Un péndulo de Foucault en Popayán es un experimento difícil, porque cualquier asimetría del montaje produce una precesión mayor que la de la Tierra.</p>
<div class="sim" data-sim="foucault" data-title="El péndulo de Foucault y la latitud"></div>
<div class="sim-guide"><ul>
<li>Vista desde arriba, acelerada: el plano de oscilación gira en sentido horario en el hemisferio norte con velocidad angular \(\Omega\sin\phi\).</li>
<li>La gráfica muestra el periodo de precesión contra la latitud; en Popayán es 23 veces más largo que en los polos.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Halle el parámetro de Coriolis y el periodo inercial en Bogotá (4.7° N).
<details><summary>Respuesta</summary><p>\(f=2\Omega\sin4.7°=1.195\times10^{-5}\) s⁻¹; \(T=2\pi/f=146\) h, unos 6.1 días.</p></details></li>
<li><span class="lvl">Básico</span>¿Cuál es el número de Rossby de un tornado de 100 m de radio con vientos de 80 m/s a 35° de latitud?
<details><summary>Respuesta</summary><p>\(f=8.4\times10^{-5}\); \(\mathrm{Ro}=80/(8.4\times10^{-5}\times100)=9.5\times10^{3}\): Coriolis no influye en su sentido de giro, que lo hereda de la tormenta madre.</p></details></li>
<li><span class="lvl">Intermedio</span>Las isobaras de un mapa a 40° S están separadas 4 hPa cada 300 km. Halle el viento geostrófico con \(\rho=1.2\) kg/m³ y su sentido alrededor de una baja.
<details><summary>Respuesta</summary><p>\(|f|=9.37\times10^{-5}\); \(V=400/(3\times10^{5}\times1.2\times9.37\times10^{-5})=11.9\) m/s, girando en sentido horario alrededor de la baja.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Qué espesor tiene la capa de Ekman de una taza de té que gira a 1 vuelta por segundo?
<details><summary>Respuesta</summary><p>\(\sqrt{\nu/\Omega}=\sqrt{10^{-6}/6.28}=0.4\) mm.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que el transporte de volumen integrado en una capa de Ekman superficial es \(\tau/(\rho f)\), perpendicular al esfuerzo del viento \(\tau\).
<details><summary>Respuesta</summary><p>Integrando \(f\uv z\times\vb u=\partial\boldsymbol\tau/\partial z/\rho\) desde el fondo de la capa (esfuerzo nulo) hasta la superficie (esfuerzo del viento): \(f\uv z\times\vb M=\boldsymbol\tau_s/\rho\), así que \(\vb M=-\uv z\times\boldsymbol\tau_s/(\rho f)\): a 90° a la derecha del viento en el norte, sin depender de \(\nu\).</p></details></li>
</ol>
