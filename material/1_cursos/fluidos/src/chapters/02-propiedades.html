<p class="lead">Para resolver un problema de fluidos hacen falta unos pocos números que describen el material: cuánto pesa por unidad de volumen, cuánto se comprime, cuánto se resiste a ser deformado y a qué presión hierve. Este capítulo presenta esas propiedades, explica de dónde vienen a escala molecular y muestra cómo cambian con la temperatura, usando los datos de referencia del agua (IAPWS) y del aire.</p>

<section>
<h2>Densidad y compresibilidad</h2>
<p>La densidad de un fluido depende de la presión y la temperatura a través de su ecuación de estado. Dos coeficientes resumen esa dependencia: el <span class="term">módulo volumétrico</span> \(K\), que mide la resistencia a la compresión, y el <span class="term">coeficiente de expansión térmica</span> \(\beta\):</p>
<div class="eq key" data-name="Compresibilidad y expansión">\[K=\rho\left(\pdv{p}{\rho}\right),\qquad \beta=-\frac{1}{\rho}\left(\pdv{\rho}{T}\right)_p,\qquad c=\sqrt{\frac{K_s}{\rho}}.\]</div>
<p>La última expresión, con el módulo a entropía constante \(K_s\), es la velocidad del sonido. Para el agua a 20 °C, \(K_s=2.19\) GPa y \(c=1482\) m/s: comprimir el agua un 1 % exige 22 MPa, unas 220 atmósferas. Por eso, salvo en el golpe de ariete y la acústica, el agua se trata como incompresible. Un gas ideal tiene \(K=p\) si se comprime lentamente a temperatura constante y \(K=kp\) si se comprime rápido sin intercambio de calor; con \(k=1.4\) para el aire, \(c=\sqrt{kR_gT}=343\) m/s a 20 °C. En Popayán, con 81.9 kPa, el aire es 19 % más fácil de comprimir que al nivel del mar, pero la velocidad del sonido no cambia porque solo depende de la temperatura.</p>
<p>El agua tiene una anomalía famosa: su densidad máxima, 999.975 kg/m³, ocurre a 3.97 °C. Por debajo de esa temperatura el agua se expande al enfriarse (\(\beta&lt;0\)). En un lago que se enfría en invierno, el agua a 4 °C se hunde y la más fría queda arriba, donde se congela; el hielo flota y aísla el fondo, que permanece líquido. La vida acuática de las regiones frías depende de esa rareza.</p>
<div class="sim" data-sim="densidad-agua" data-title="Densidad, expansión térmica, módulo volumétrico y sonido en el agua"></div>
<div class="sim-guide"><ul>
<li>Los datos vienen de la formulación IAPWS-95. Active el acercamiento a 0–10 °C para ver el máximo de densidad.</li>
<li>El módulo volumétrico del agua crece con la temperatura hasta unos 60 °C y luego baja; la velocidad del sonido sigue la misma tendencia, con un máximo de 1555 m/s cerca de 74 °C.</li>
</ul></div>
<div class="box ex"><h4>El agua del fondo del mar</h4><p>A 4000 m de profundidad la presión manométrica es de unos 40 MPa. Con \(K\approx2.3\) GPa, el agua se comprime \(\Delta\rho/\rho\approx40/2300=1.7\,\%\). Si el agua fuera rigurosamente incompresible, el nivel del mar estaría unos 30 m más alto: la compresión de la columna oceánica, pequeña en cada punto, suma decenas de metros.</p></div>
</section>

<section>
<h2>Viscosidad</h2>
<p>La viscosidad es la resistencia de un fluido a deformarse. En el experimento de Newton, una placa se desliza con velocidad \(U\) sobre una película de fluido de espesor \(h\). El fluido se adhiere a ambas placas (condición de no deslizamiento) y su velocidad varía linealmente entre 0 y \(U\). La fuerza por unidad de área necesaria para mantener el movimiento es</p>
<div class="eq">\[\tau=\mu\frac{U}{h}.\]</div>
<p>La <span class="term">viscosidad cinemática</span> \(\nu=\mu/\rho\) (m²/s) es la difusividad de la cantidad de movimiento: mide cuán rápido se propaga un cambio de velocidad por el fluido. El aire tiene una viscosidad dinámica 55 veces menor que la del agua, pero una viscosidad cinemática 15 veces mayor: en el aire la cantidad de movimiento se difunde más rápido.</p>
<div class="sim" data-sim="couette-placas" data-title="Flujo de Couette entre dos placas: perfil de velocidad y esfuerzo cortante"></div>
<div class="sim-guide"><ul>
<li>Una placa de 0.5 m² que se desliza a 1 m/s sobre 0.5 mm de aceite SAE 30 necesita 290 N; sobre agua, apenas 1 N.</li>
<li>Las partículas teñidas muestran el perfil lineal: cada capa arrastra a la de abajo y frena a la de arriba.</li>
<li>La potencia disipada, \(\tau UA\), se convierte en calor dentro de la película: es el principio de la lubricación y de su calentamiento.</li>
</ul></div>
<h3>Origen molecular</h3>
<p>En un <b>gas</b>, la viscosidad la transportan las moléculas que cruzan de una capa rápida a una lenta llevando su cantidad de movimiento. La teoría cinética da \(\mu\approx\tfrac13\rho\bar v\lambda\); como \(\lambda\propto1/\rho\), la viscosidad no depende de la presión, y como \(\bar v\propto\sqrt T\), crece con la temperatura. Maxwell predijo en 1860 esta independencia de la presión, contraria a la intuición, y la confirmó experimentalmente en 1866. Una fórmula práctica es la de <span class="term">Sutherland</span>:</p>
<div class="eq">\[\mu=\mu_0\left(\frac{T}{T_0}\right)^{3/2}\frac{T_0+S}{T+S},\qquad \mu_0=1.716\times10^{-5}\un{Pa\cdot s},\ T_0=273.15\un{K},\ S=110.4\un{K}.\]</div>
<p>En un <b>líquido</b>, las moléculas están en contacto y deben superar barreras de energía para deslizarse unas sobre otras. La agitación térmica facilita los saltos y la viscosidad <em>disminuye</em> con la temperatura, aproximadamente como \(\mu=A\,\ee^{B/(T-C)}\) (ecuación de Vogel). El agua es 6.4 veces menos viscosa a 100 °C que a 0 °C; la glicerina, más de 800 veces. Por eso el aceite del motor frío fluye mal y la miel tibia corre.</p>
<div class="sim" data-sim="viscosidad-T" data-title="Viscosidad de líquidos y gases en función de la temperatura"></div>
<div class="sim-guide"><ul>
<li>Escala logarítmica: los líquidos bajan; el aire sube. La línea discontinua es la ley de Sutherland: se aparta menos de 1 % de la formulación de referencia del aire hasta unos 120 °C y un 2.4 % a 400 °C.</li>
<li>Elija un fluido y una temperatura para leer \(\mu\) y \(\nu\). Los datos del agua, el aire, el etanol, el metanol, el tolueno y el heptano vienen de CoolProp; los de la glicerina, de Segur y Oberstar (1951).</li>
</ul></div>
</section>

<section>
<h2>Cómo se mide la viscosidad</h2>
<p>Los <span class="term">viscosímetros rotacionales</span> giran un cilindro dentro de otro y miden el par: con un espacio pequeño, el flujo es el de Couette de la sección anterior. Los <span class="term">viscosímetros capilares</span> (Ostwald, Ubbelohde) miden el tiempo que tarda un volumen en drenar por un tubo fino; el flujo de Hagen–Poiseuille (capítulo 10) da \(\nu\) proporcional a ese tiempo. El <span class="term">viscosímetro de bola</span> mide la velocidad terminal de una esfera que cae: para números de Reynolds pequeños, la ley de Stokes (capítulo 12) da</p>
<div class="eq">\[\mu=\frac{2(\rho_s-\rho)ga^2}{9V_t}.\]</div>
<div class="box ex"><h4>Una bola de acero en glicerina</h4><p>Una esfera de acero (\(\rho_s=7800\) kg/m³) de 2 mm de diámetro cae en glicerina a 20 °C (\(\rho=1261\) kg/m³, \(\mu=1.41\) Pa·s). Su velocidad terminal es \(V_t=2(6539)(9.807)(10^{-3})^2/(9\times1.41)=1.01\) cm/s, y el número de Reynolds \(\rho V_td/\mu=0.018\) confirma que la ley de Stokes es válida. Midiendo el tiempo de caída entre dos marcas, se obtiene la viscosidad sin más instrumentos que un cronómetro.</p></div>
</section>

<section>
<h2>Presión de vapor y cavitación</h2>
<p>La <span class="term">presión de vapor</span> \(p_v(T)\) es la presión a la cual el líquido y su vapor coexisten en equilibrio. Un líquido hierve cuando la presión que lo rodea baja hasta \(p_v\): al nivel del mar el agua hierve a 99.97 °C; en Popayán, a 94.1 °C, y en la cima del Everest, a unos 70 °C. Por eso los fríjoles tardan más en cocinarse en la montaña y se usan ollas a presión.</p>
<p>Si en un flujo la presión local cae por debajo de \(p_v\), el líquido se vaporiza aunque esté frío: es la <span class="term">cavitación</span>. Se forman burbujas en las zonas de baja presión (los álabes de una bomba, la cara de succión de una hélice, la garganta de un Venturi) que colapsan violentamente al llegar a zonas de mayor presión, con microchorros que erosionan el metal. El parámetro de control es el <span class="term">número de cavitación</span></p>
<div class="eq">\[\sigma_c=\frac{p-p_v}{\tfrac12\rho V^2}.\]</div>
<div class="sim" data-sim="presion-vapor" data-title="Presión de vapor del agua, ebullición en altura y cavitación"></div>
<div class="sim-guide"><ul>
<li>Mueva la altitud: la línea de presión atmosférica corta la curva de vapor a la temperatura de ebullición. En Popayán (1760 m) es 94.1 °C; en Bogotá (2640 m), 91.2 °C.</li>
<li>En el panel de cavitación, aumente la velocidad del agua: cuando la presión dinámica supera \(p-p_v\), el número de cavitación baja de 1 y una hélice o una bomba empieza a cavitar.</li>
</ul></div>
</section>

<section>
<h2>Otras propiedades</h2>
<p>La <span class="term">tensión superficial</span> \(\gamma\) (N/m) es la energía por unidad de área de una interfaz; gobierna gotas, burbujas y capilares y se estudia en el capítulo 5. La <span class="term">conductividad térmica</span> \(k\) y el <span class="term">calor específico</span> \(c_p\) controlan el transporte de calor; su cociente con la viscosidad da el número de Prandtl \(\mathrm{Pr}=\mu c_p/k\), que vale 7 para el agua y 0.71 para el aire. Las tablas del apéndice A reúnen las propiedades del agua y del aire en función de la temperatura.</p>
<div class="box warn"><h4>Unidades de viscosidad</h4><p>En la literatura técnica aparecen el poise (P = 0.1 Pa·s) y el centipoise (cP = mPa·s), y para la viscosidad cinemática el stokes (St = cm²/s) y el centistokes (cSt = mm²/s). El agua a 20 °C tiene 1.00 cP y 1.00 cSt: una coincidencia útil para recordar órdenes de magnitud.</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Qué presión hay que aplicar al agua a 20 °C para reducir su volumen un 0.5 %?
<details><summary>Respuesta</summary><p>\(\Delta p=K\,\Delta V/V=2.19\times10^{9}\times0.005=11\) MPa.</p></details></li>
<li><span class="lvl">Básico</span>Halle la viscosidad cinemática del agua a 40 °C y del aire a 40 °C y 1 atm.
<details><summary>Respuesta</summary><p>Agua: \(6.53\times10^{-4}/992.2=6.58\times10^{-7}\) m²/s. Aire: \(1.91\times10^{-5}/1.127=1.70\times10^{-5}\) m²/s.</p></details></li>
<li><span class="lvl">Intermedio</span>Un eje de 5 cm de diámetro gira a 1800 rpm dentro de un cojinete de 10 cm de largo con una holgura radial de 0.1 mm llena de aceite SAE 30. Suponiendo un perfil lineal, halle el par y la potencia disipada.
<details><summary>Respuesta</summary><p>\(U=\omega R=188.5\times0.025=4.71\) m/s; \(\tau=\mu U/h=0.29\times4.71/10^{-4}=1.37\times10^{4}\) Pa; área \(2\pi RL=0.0157\) m²; par \(\tau AR=5.36\) N·m; potencia \(1.01\) kW.</p></details></li>
<li><span class="lvl">Intermedio</span>Con la ley de Sutherland, ¿cuánto aumenta la viscosidad del aire al pasar de 20 °C a 300 °C?
<details><summary>Respuesta</summary><p>\(\mu(293.15)=1.813\times10^{-5}\) y \(\mu(573.15)=2.93\times10^{-5}\) Pa·s: un 61 % más.</p></details></li>
<li><span class="lvl">Avanzado</span>Una bomba aspira agua a 30 °C en Popayán. En la entrada del rodete la velocidad relativa es 12 m/s y la presión estática absoluta 45 kPa. ¿Cavitará? ¿Y si el agua estuviera a 80 °C?
<details><summary>Respuesta</summary><p>A 30 °C, \(p_v=4.25\) kPa y \(\sigma_c=(45-4.25)\times10^{3}/(0.5\times995.6\times144)=0.57\); la presión está por encima de \(p_v\), pero la caída local sobre el álabe, de orden \(\tfrac12\rho V^2\), la llevaría por debajo: hay riesgo. A 80 °C, \(p_v=47.4\) kPa &gt; 45 kPa: el agua hierve en la entrada y la bomba cavita con certeza.</p></details></li>
</ol>
