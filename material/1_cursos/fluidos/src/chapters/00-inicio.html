    <h1 class="home-title">Física de Fluidos<span>del medio continuo a la turbulencia</span></h1>
    <p class="home-lead">Un curso completo de mecánica de fluidos: hidrostática, capilaridad, leyes de conservación, flujo viscoso, capa límite, turbulencia, flujo potencial, ondas, canales, flujo compresible, inestabilidades y métodos numéricos. Cada capítulo deduce los resultados desde los principios, los aplica con ejemplos resueltos y los pone a prueba con simulaciones de parámetros ajustables. Las propiedades del agua y del aire vienen de las formulaciones de referencia internacionales, y los cálculos se contrastan con CoolProp, la biblioteca <i>fluids</i>, SciPy, soluciones exactas y datos publicados.</p>

  <div><b>De la molécula al continuo</b><p>La presión, la viscosidad y la tensión superficial se ven nacer de las moléculas; después el fluido se describe como un campo continuo gobernado por leyes de conservación.</p></div>
  <div><b>Simulaciones con parámetros</b><p>Manómetros, barcos que escoran, gotas sésiles, chorros, bombas, capas límite, el diagrama de Moody, perfiles de Joukowski, vórtices que bailan, estelas de Kelvin, resaltos hidráulicos, toberas supersónicas y un túnel de viento numérico.</p></div>
  <div><b>Datos reales y validados</b><p>Agua y aire de las formulaciones IAPWS y de Lemmon, atmósfera estándar de 1976, correlaciones de fricción y arrastre, soluciones exactas y la cavidad de Ghia: más de doscientas pruebas automáticas.</p></div>
