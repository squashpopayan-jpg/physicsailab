<p class="lead">Un chorro de bombero empuja hacia atrás a quien sostiene la manguera, un codo de tubería necesita anclajes de concreto, un cohete acelera en el vacío y una turbina eólica no puede extraer más del 59 % de la energía del viento. Todos estos hechos salen de una sola ecuación: la segunda ley de Newton escrita para un volumen de control. Su ventaja es que no exige conocer el detalle del flujo adentro, solo lo que cruza la frontera.</p>

<section>
<h2>La ecuación integral de cantidad de movimiento</h2>
<p>Con el teorema del transporte de Reynolds y \(b=\vb u\), la segunda ley de Newton para un volumen de control fijo es</p>
<div class="eq key" data-name="Cantidad de movimiento en un volumen de control">\[\sum\vb F=\frac{\dd}{\dd t}\int_{VC}\rho\vb u\,\dd V+\oint_{SC}\rho\vb u\,(\vb u\cdot\vb n)\,\dd A.\]</div>
<p>Las fuerzas incluyen las de cuerpo (el peso), las de presión sobre la superficie de control y las que ejercen los sólidos que el volumen de control corta (soportes, anclajes, paredes). En flujo estacionario con entradas y salidas de velocidad uniforme:</p>
<div class="eq">\[\sum\vb F=\sum_{sal}\dot m\vb V-\sum_{ent}\dot m\vb V.\]</div>
<p>La fuerza neta es igual al flujo de cantidad de movimiento que sale menos el que entra. Si la velocidad no es uniforme en una sección, se corrige con el factor \(\beta=\frac{1}{AV^2}\int u^2\,\dd A\): vale 4/3 para el flujo laminar en un tubo y entre 1.01 y 1.04 para el turbulento.</p>
<div class="box warn"><h4>Una receta que evita errores</h4><p>Dibuje el volumen de control y marque cada fuerza que lo cruza; use presiones manométricas, porque la atmosférica actúa en todo el contorno y se cancela; escriba la ecuación por componentes con signos; y recuerde que la fuerza que se calcula es la que actúa <em>sobre el fluido</em>: la que el fluido hace sobre el soporte es la opuesta.</p></div>
</section>

<section>
<h2>Chorros sobre placas y álabes</h2>
<p>Un chorro libre está a presión atmosférica, y si la fricción es despreciable conserva su rapidez al deslizar sobre una superficie. Un chorro de área \(A\) y velocidad \(V\) que choca con una placa plana perpendicular se reparte en una lámina radial: la componente de cantidad de movimiento en la dirección del chorro desaparece y la placa recibe</p>
<div class="eq">\[F=\rho QV=\rho AV^2.\]</div>
<p>Un chorro de 5 cm a 20 m/s empuja con 784 N. Un álabe curvo que desvía el chorro un ángulo \(\theta\) recibe \(F_x=\rho QV(1-\cos\theta)\): con \(\theta=180°\) la fuerza se duplica, porque el chorro sale con la cantidad de movimiento invertida. Si el álabe se mueve con velocidad \(u\) en la dirección del chorro, se trabaja en el sistema del álabe con la velocidad relativa \(V-u\); para un solo álabe que se aleja, \(F=\rho A(V-u)^2(1-\cos\theta)\).</p>
<div class="sim" data-sim="chorro-placa" data-title="Chorro sobre un álabe fijo o móvil: fuerza y potencia"></div>
<div class="sim-guide"><ul>
<li>Con el álabe fijo la fuerza crece de \(\rho QV\) (placa plana, 90°) a \(2\rho QV\) (cazoleta, 180°).</li>
<li>Al mover el álabe la fuerza baja, pero la potencia \(Fu\) tiene un máximo: para un álabe aislado en \(u=V/3\); para una rueda con muchos álabes que reciben todo el caudal, en \(u=V/2\) (sección 8.4).</li>
</ul></div>
</section>

<section>
<h2>Fuerzas sobre codos y reducciones</h2>
<p>Un codo cambia la dirección del flujo y la tubería debe ejercer la fuerza necesaria; esa fuerza la reciben los anclajes. Para un codo en el plano horizontal entre las secciones 1 y 2, con presiones manométricas \(p_1\) y \(p_2\):</p>
<div class="eq">\[R_x=\dot m(V_{2x}-V_{1x})-p_1A_1n_{1x}-p_2A_2n_{2x},\qquad R_y=\dots\]</div>
<p>con \(\vb n\) la normal exterior. En las tuberías de agua a presión el término de presión suele dominar: en un codo de 90° de 30 cm con agua a 3 m/s y 200 kPa, la presión aporta 14.1 kN por rama y el cambio de cantidad de movimiento solo 0.6 kN; el anclaje debe resistir 20.9 kN a 45°. Los bloques de concreto de los acueductos en los codos y las tes cumplen esa función; sin ellos, la tubería se desacopla en las juntas.</p>
<div class="sim" data-sim="codo" data-title="Fuerza de anclaje en un codo con reducción"></div>
<div class="sim-guide"><ul>
<li>Las flechas muestran las fuerzas de presión sobre el volumen de control, los flujos de cantidad de movimiento y la fuerza que debe aplicar el anclaje.</li>
<li>Con el ángulo de 180° (codo de retorno) la fuerza es máxima; con 0° solo queda la de la reducción.</li>
</ul></div>
</section>

<section>
<h2>La turbina Pelton</h2>
<p>En una rueda Pelton, uno o varios chorros golpean cazoletas que los desvían casi 180°. Como la rueda tiene muchas cazoletas, todo el caudal del chorro las alcanza, y la potencia transmitida, con cazoletas que se mueven a \(u\) y desvían el chorro relativo un ángulo \(\beta\), es</p>
<div class="eq key" data-name="Potencia de una rueda Pelton">\[P=\rho Qu(V-u)(1-\cos\beta),\qquad u_{opt}=\frac{V}{2},\qquad \eta_{max}=\frac{1-\cos\beta}{2}.\]</div>
<p>Con \(\beta=165°\) la eficiencia ideal es 98.3 %. Para un salto de 300 m y una tobera con coeficiente de velocidad 0.98, el chorro sale a 75 m/s; con 0.5 m³/s la rueda entrega idealmente 1.39 MW de los 1.47 MW disponibles. Las Pelton se usan en saltos grandes con caudales pequeños, típicos de las centrales de montaña de los Andes.</p>
<div class="sim" data-sim="pelton" data-title="Rueda Pelton: potencia contra velocidad de la cazoleta"></div>
<div class="sim-guide"><ul>
<li>La potencia es una parábola en \(u/V\) con máximo en 0.5. Una rueda de 1.5 m de diámetro con un chorro de 75 m/s debe girar a unas 480 rpm.</li>
<li>En las ruedas reales el máximo ocurre hacia \(u/V\approx0.46\) por la fricción en las cazoletas.</li>
</ul></div>
</section>

<section>
<h2>Propulsión: chorros, cohetes y hélices</h2>
<p>Un motor a reacción toma aire a la velocidad de vuelo \(V_0\) y lo expulsa más rápido; su empuje es \(F=\dot m(V_e-V_0)+(p_e-p_0)A_e\). Un cohete no toma aire: lleva su propio propelente y lo expulsa a \(v_e\) relativa al vehículo. Aplicando la ecuación de cantidad de movimiento a un volumen de control que lo acompaña se obtiene \(m\,\dd V/\dd t=\dot mv_e\), cuya integración es la <span class="term">ecuación de Tsiolkovsky</span>, \(\Delta V=v_e\ln(m_0/m_f)\): con \(v_e=3\) km/s y una relación de masas de 10, el cohete gana 6.9 km/s.</p>
<p>Una hélice o el rotor de una turbina eólica se modelan como un <span class="term">disco actuador</span>, una superficie que produce un salto de presión sin perturbar el flujo de otra forma. Con la ecuación de cantidad de movimiento en el tubo de corriente que atraviesa el disco y Bernoulli a cada lado, Rankine y Froude demostraron que la velocidad en el disco es el promedio de la de aguas arriba y la de la estela. Con el factor de inducción axial \(a\), \(V_{disco}=V_0(1-a)\) y \(V_{estela}=V_0(1-2a)\), y para una turbina:</p>
<div class="eq key" data-name="Disco actuador y límite de Betz">\[C_P=\frac{P}{\tfrac12\rho AV_0^3}=4a(1-a)^2,\qquad C_{P,max}=\frac{16}{27}=0.593\ \ \text{en}\ a=\tfrac13.\]</div>
<p>Ninguna turbina puede extraer más del 59.3 % de la energía cinética del viento que atraviesa su área: si frenara el aire por completo, este se acumularía detrás y bloquearía el paso del resto. Las turbinas modernas alcanzan \(C_P\approx0.45\)–0.50. La potencia disponible es proporcional a la densidad: un rotor de 80 m con viento de 10 m/s dispone de 3.08 MW al nivel del mar y de 2.45 MW en Popayán.</p>
<div class="sim" data-sim="betz" data-title="Disco actuador: tubo de corriente, coeficientes de potencia y empuje"></div>
<div class="sim-guide"><ul>
<li>El tubo de corriente se ensancha al atravesar el rotor, porque el aire se frena. Con \(a=1/3\) la estela va a un tercio de la velocidad del viento y \(C_P\) es máximo.</li>
<li>Para \(a&gt;1/2\) la teoría predice una estela que retrocede: el modelo deja de valer y el rotor entra en régimen turbulento.</li>
</ul></div>
</section>

<section>
<h2>Momento angular</h2>
<p>Con \(b=\vb r\times\vb u\) se obtiene la ecuación de momento angular: el par neto sobre el volumen de control es igual al flujo neto de momento angular que sale. En una turbomáquina con flujo estacionario, entrando a radio \(r_1\) y saliendo a \(r_2\) con componentes tangenciales \(V_{t1}\) y \(V_{t2}\),</p>
<div class="eq key" data-name="Ecuación de Euler de las turbomáquinas">\[T=\dot m(r_2V_{t2}-r_1V_{t1}),\qquad P=T\omega=\dot m(u_2V_{t2}-u_1V_{t1}).\]</div>
<p>Es la base del diseño de bombas, ventiladores y turbinas (capítulo 9). Un aspersor de jardín la ilustra al revés: los chorros que salen tangentes producen un par que lo hace girar, hasta que la fricción lo equilibra.</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un bombero sostiene una manguera cuya boquilla de 3 cm lanza 10 L/s. ¿Qué fuerza debe hacer?
<details><summary>Respuesta</summary><p>\(V=Q/A=14.1\) m/s; \(F=\rho QV=998\times0.01\times14.1=141\) N.</p></details></li>
<li><span class="lvl">Básico</span>Un chorro de 2 cm a 25 m/s choca con un álabe fijo que lo desvía 120°. Halle la fuerza en la dirección del chorro.
<details><summary>Respuesta</summary><p>\(Q=7.85\times10^{-3}\) m³/s; \(F_x=\rho QV(1-\cos120°)=998\times7.85\times10^{-3}\times25\times1.5=294\) N.</p></details></li>
<li><span class="lvl">Intermedio</span>Por un codo de 60° de 20 cm pasan 80 L/s de agua a 150 kPa (manométricos). Desprecie las pérdidas y halle la fuerza sobre el anclaje.
<details><summary>Respuesta</summary><p>\(A=0.0314\), \(V=2.55\) m/s, \(pA+\dot mV=4712+204=4916\) N en cada rama; la resultante es \(2(4916)\sin30°=4916\) N, dirigida hacia afuera del codo, a lo largo de su bisectriz.</p></details></li>
<li><span class="lvl">Intermedio</span>Una turbina eólica de 50 m de diámetro opera con \(C_P=0.45\) en viento de 8 m/s en Popayán (\(\rho=0.977\)). ¿Qué potencia entrega? ¿Y al nivel del mar?
<details><summary>Respuesta</summary><p>\(P=0.45\times\tfrac12\times0.977\times1963\times512=221\) kW; con 1.225 kg/m³, 277 kW.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que la potencia de un álabe aislado que se aleja con velocidad \(u\) de un chorro fijo es máxima en \(u=V/3\), y la de una rueda de muchos álabes, en \(u=V/2\).
<details><summary>Respuesta</summary><p>Álabe aislado: solo recibe el caudal \(A(V-u)\), así que \(P\propto u(V-u)^2\), máximo en \(u=V/3\). Rueda: todo el caudal \(AV\) llega a alguna cazoleta, \(P\propto u(V-u)\), máximo en \(u=V/2\).</p></details></li>
</ol>
