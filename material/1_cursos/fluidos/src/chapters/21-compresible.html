<p class="lead">Mientras un gas se mueve despacio comparado con el sonido, su densidad casi no cambia y todo lo visto hasta ahora vale. Cuando se acerca a esa velocidad, la compresibilidad cambia las reglas: una tobera que se estrecha deja de acelerar el flujo, un tubo puede «ahogarse» y aparecen ondas de choque. Esta física gobierna los motores a reacción, los cohetes, las válvulas de seguridad, los gasoductos y los vuelos supersónicos.</p>

<section>
<h2>La velocidad del sonido</h2>
<p>Un pistón que empuja de pronto el gas de un tubo con una velocidad pequeña \(\dd V\) genera un frente de compresión que avanza con velocidad \(c\). Aplicando la conservación de la masa y la cantidad de movimiento a un volumen de control que acompaña al frente se obtiene \(c^2=\dd p/\dd\rho\). Como la onda es rápida y débil, no hay tiempo para intercambiar calor ni hay disipación: el proceso es isentrópico. Para un gas ideal, \(p\propto\rho^\gamma\) y</p>
<div class="eq key" data-name="Velocidad del sonido">\[c=\sqrt{\left(\pdv{p}{\rho}\right)_s}=\sqrt{\gamma R_gT}.\]</div>
<p>En el aire a 20 °C, \(c=343\) m/s; en el helio, 1007 m/s, por eso la voz se agudiza al respirarlo; en el agua, 1482 m/s. Newton había calculado la velocidad del sonido suponiendo compresión isotérmica y obtuvo un valor 15 % bajo; Laplace corrigió el error en 1816 con el factor \(\sqrt\gamma\).</p>
<p>El <span class="term">número de Mach</span> \(M=V/c\) mide la importancia de la compresibilidad. Como \(\rho_0/\rho=(1+\tfrac{\gamma-1}{2}M^2)^{1/(\gamma-1)}\), la densidad cambia menos del 5 % si \(M&lt;0.3\): por eso el aire alrededor de un automóvil se trata como incompresible y el de un avión de línea no. Una fuente que se mueve más rápido que el sonido deja atrás sus ondas, que se acumulan en un <span class="term">cono de Mach</span> de semiángulo</p>
<div class="eq">\[\mu=\arcsin\frac1M.\]</div>
<p>Fuera del cono no se oye nada; al pasar el cono por un observador en tierra se oye el estampido sónico.</p>
<div class="sim" data-sim="cono-mach" data-title="Frentes de onda de una fuente en movimiento y el cono de Mach"></div>
<div class="sim-guide"><ul>
<li>Con \(M&lt;1\) los frentes se apiñan delante de la fuente (efecto Doppler) pero nunca se cruzan. Con \(M=1\) se acumulan en un frente plano: la «barrera del sonido». Con \(M&gt;1\) forman el cono.</li>
<li>El ángulo del cono medido sobre la figura coincide con \(\arcsin(1/M)\).</li>
</ul></div>
</section>

<section>
<h2>Propiedades de estancamiento y flujo isentrópico</h2>
<p>La ecuación de la energía para un gas ideal sin calor ni trabajo, \(c_pT+V^2/2=c_pT_0\), define la <span class="term">temperatura de estancamiento</span> \(T_0\), la que alcanza el gas si se detiene adiabáticamente. Expresada con el número de Mach, y combinada con la relación isentrópica, da</p>
<div class="eq key" data-name="Relaciones isentrópicas">\[\frac{T_0}{T}=1+\frac{\gamma-1}{2}M^2,\qquad\frac{p_0}{p}=\left(\frac{T_0}{T}\right)^{\gamma/(\gamma-1)},\qquad\frac{\rho_0}{\rho}=\left(\frac{T_0}{T}\right)^{1/(\gamma-1)}.\]</div>
<p>Para \(M\ll1\) la segunda se reduce a Bernoulli, \(p_0\approx p+\tfrac12\rho V^2\). El Concorde volaba a Mach 2 a 18 km de altura, donde el aire está a −57 °C: el aire que se detenía sobre su nariz llegaba a 117 °C, y el fuselaje se dilataba unos 20 cm en vuelo. En el estado sónico (\(M=1\)), con \(\gamma=1.4\), \(T^*/T_0=0.833\), \(p^*/p_0=0.528\) y \(\rho^*/\rho_0=0.634\).</p>
<div class="sim" data-sim="isentropico" data-title="Tabla isentrópica interactiva"></div>
<div class="sim-guide"><ul>
<li>Las curvas muestran \(T/T_0\), \(p/p_0\), \(\rho/\rho_0\) y la relación de áreas \(A/A^*\) contra el número de Mach. Cambie \(\gamma\) para el helio (5/3) o el vapor (1.3).</li>
<li>Para cada \(A/A^*&gt;1\) hay dos números de Mach posibles, uno subsónico y uno supersónico.</li>
</ul></div>
</section>

<section>
<h2>Área y velocidad: la tobera de De Laval</h2>
<p>Combinando la continuidad \(\rho VA=\text{cte}\), la ecuación de Euler y \(\dd p=c^2\dd\rho\) se obtiene una relación sorprendente:</p>
<div class="eq key" data-name="Relación área–velocidad">\[\frac{\dd A}{A}=\left(M^2-1\right)\frac{\dd V}{V}.\]</div>
<p>En flujo subsónico, reducir el área acelera el gas, como en una manguera. En flujo supersónico ocurre lo contrario: para acelerar hay que <em>ensanchar</em> el conducto, porque la densidad cae más rápido de lo que crece la velocidad. Para pasar de subsónico a supersónico hace falta una tobera convergente–divergente, y \(M=1\) solo puede ocurrir en la garganta. Gustaf de Laval la inventó en 1888 para sus turbinas de vapor; hoy está en todo motor cohete. El área relativa a la garganta sónica es</p>
<div class="eq">\[\frac{A}{A^*}=\frac1M\left[\frac{2}{\gamma+1}\left(1+\frac{\gamma-1}{2}M^2\right)\right]^{\frac{\gamma+1}{2(\gamma-1)}}.\]</div>
<p>Cuando la garganta alcanza \(M=1\), el caudal ya no puede aumentar bajando la presión de salida: la tobera está <span class="term">ahogada</span>, y su caudal depende solo de las condiciones del depósito,</p>
<div class="eq">\[\dot m_{max}=A^*\frac{p_0}{\sqrt{R_gT_0}}\sqrt\gamma\left(\frac{2}{\gamma+1}\right)^{\frac{\gamma+1}{2(\gamma-1)}}.\]</div>
<p>Un tanque de aire a 500 kPa y 300 K que descarga por un orificio de 1 cm² pierde 0.117 kg/s, sin importar si afuera hay 100 kPa o vacío. Las válvulas de seguridad y los medidores de caudal de gas por toberas críticas aprovechan este hecho.</p>
</section>

<section>
<h2>Una tobera con contrapresión</h2>
<p>Una tobera convergente–divergente con relación de áreas \(A_e/A_t\) fija, alimentada desde un depósito, se comporta según la presión que hay a la salida \(p_b\):</p>
<ul>
<li>Si \(p_b\) es alta, el flujo es subsónico en toda la tobera, como un Venturi.</li>
<li>Al bajar \(p_b\), la garganta alcanza \(M=1\) y el caudal se congela. Para un rango de presiones aparece una <b>onda de choque normal</b> en la parte divergente, después de la cual el flujo vuelve a ser subsónico (capítulo 22).</li>
<li>Si \(p_b\) baja más, el choque sale de la tobera: el chorro está <b>sobreexpandido</b> y se ajusta a la presión exterior con choques oblicuos.</li>
<li>En la presión de diseño, el chorro sale exactamente a \(p_b\). Por debajo, el chorro está <b>subexpandido</b> y se abre con abanicos de expansión: los «diamantes» que se ven en el escape de un cohete.</li>
</ul>
<div class="sim" data-sim="laval" data-title="Tobera de De Laval: Mach y presión a lo largo de la tobera"></div>
<div class="sim-guide"><ul>
<li>Con \(A_e/A_t=2\) la tobera trabaja subsónica hasta \(p_b/p_0=0.937\), tiene un choque dentro hasta 0.513, y su presión de diseño es 0.094. El programa resuelve la posición del choque por bisección.</li>
<li>Una tobera de cohete con \(A_e/A_t=16\) expande los gases a Mach 4.46 y a 0.36 % de la presión de la cámara.</li>
</ul></div>
</section>

<section>
<h2>Fricción y calor: flujos de Fanno y Rayleigh</h2>
<p>En un tubo de área constante con fricción y sin calor (<span class="term">flujo de Fanno</span>), la fricción empuja el número de Mach hacia 1: acelera un flujo subsónico y frena uno supersónico. Hay una longitud máxima de tubo, \(fL^*/D\), para la que la salida llega a \(M=1\); un tubo más largo reduce el caudal. Con \(M=0.3\) a la entrada, \(fL^*/D=5.30\): un gasoducto de 1 m de diámetro con \(f=0.01\) se ahogaría a 530 m si no se redujera la velocidad. En un tubo sin fricción con calor (<span class="term">flujo de Rayleigh</span>), calentar también lleva el flujo hacia \(M=1\): es la física de las cámaras de combustión de los estatorreactores.</p>
<div class="sim" data-sim="fanno-rayleigh" data-title="Flujos de Fanno y Rayleigh: el número de Mach tiende a 1"></div>
<div class="sim-guide"><ul>
<li>Elija el Mach de entrada y el parámetro de fricción \(fL/D\): el programa halla el Mach de salida con la función de Fanno. Si \(fL/D\) supera \(fL^*/D\), el tubo se ahoga.</li>
<li>La curva de Rayleigh muestra que calentar un flujo subsónico lo acelera y uno supersónico lo frena, hasta \(M=1\), donde ya no se puede añadir calor.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿A qué velocidad vuela un avión a Mach 0.85 a 11 km de altura (216.8 K)? ¿Y al nivel del mar a 15 °C?
<details><summary>Respuesta</summary><p>\(c=\sqrt{1.4\times287\times216.8}=295\) m/s → 251 m/s (903 km/h). Al nivel del mar \(c=340\) m/s → 289 m/s.</p></details></li>
<li><span class="lvl">Básico</span>Halle la temperatura de estancamiento del aire a 300 K que se mueve a 300 m/s.
<details><summary>Respuesta</summary><p>\(T_0=T+V^2/2c_p=300+90\,000/2010=344.8\) K.</p></details></li>
<li><span class="lvl">Intermedio</span>Una tobera debe acelerar aire desde un depósito a 1 MPa y 500 K hasta Mach 2.5. Halle la relación de áreas, la presión y la temperatura de salida.
<details><summary>Respuesta</summary><p>\(A_e/A^*=2.637\); \(p_e=1\,\text{MPa}/17.09=58.5\) kPa; \(T_e=500/2.25=222\) K.</p></details></li>
<li><span class="lvl">Intermedio</span>Un neumático a 300 kPa absolutos y 20 °C se pincha con un orificio de 1 mm². ¿Qué caudal escapa al principio en Popayán (81.9 kPa)?
<details><summary>Respuesta</summary><p>\(81.9/300=0.27&lt;0.528\): flujo ahogado. \(\dot m=A^*p_0\sqrt\gamma(0.5787)/\sqrt{R_gT_0}=10^{-6}\times300\,000\times0.6847/290.0=7.1\times10^{-4}\) kg/s.</p></details></li>
<li><span class="lvl">Avanzado</span>Deduzca la relación área–velocidad a partir de \(\dd\rho/\rho+\dd V/V+\dd A/A=0\), \(\dd p=-\rho V\,\dd V\) y \(\dd p=c^2\dd\rho\).
<details><summary>Respuesta</summary><p>\(\dd\rho/\rho=\dd p/(\rho c^2)=-V\,\dd V/c^2=-M^2\dd V/V\). Sustituyendo, \(\dd A/A=-\dd V/V+M^2\dd V/V=(M^2-1)\dd V/V\).</p></details></li>
</ol>
