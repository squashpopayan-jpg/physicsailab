<template class="chapter-src" data-id="ondas-agua" data-num="19" data-title="Ondas en el agua" data-part="Parte V · Superficie libre" data-short="La teoría lineal de ondas de superficie, la relación de dispersión gravito-capilar, aguas profundas y someras, velocidad de grupo y paquetes de ondas, las órbitas de las partículas, la estela de Kelvin, los tsunamis y la ley de Green, los seiches y las ondas no lineales">
<p class="lead">Las olas del Pacífico que llegan a Buenaventura nacieron en tormentas a miles de kilómetros; las ondas que deja un pato se abren siempre con el mismo ángulo; un tsunami cruza el océano a la velocidad de un avión y crece al llegar a la costa. Todas son ondas de superficie, en las que la gravedad, y en las más pequeñas la tensión superficial, devuelve el agua a su posición de equilibrio. Su teoría es una aplicación espléndida del flujo potencial.</p>

<section>
<h2>La teoría lineal</h2>
<p>Bajo una ola el flujo es irrotacional: \(\vb u=\grad\phi\) con \(\lap\phi=0\) en el agua, de profundidad \(h\). En el fondo, \(\partial\phi/\partial z=0\). En la superficie \(z=\eta(x,t)\) hay dos condiciones: la cinemática, que la superficie se mueve con el fluido, y la dinámica, que la presión iguala a la atmosférica más el salto de Laplace. Si la amplitud es pequeña frente a la longitud de onda, ambas se aplican en \(z=0\) y se linealizan:</p>
<div class="eq">\[\pdv{\eta}{t}=\pdv{\phi}{z},\qquad\pdv{\phi}{t}+g\eta-\frac{\gamma}{\rho}\pdv{^2\eta}{x^2}=0\qquad(z=0).\]</div>
<p>Una onda \(\eta=A\cos(kx-\omega t)\) tiene potencial \(\phi\propto\cosh k(z+h)\sin(kx-\omega t)\), y las condiciones de superficie dan la <span class="term">relación de dispersión</span>:</p>
<div class="eq key" data-name="Relación de dispersión de las ondas de superficie">\[\omega^2=\left(gk+\frac{\gamma}{\rho}k^3\right)\tanh kh.\]</div>
</section>

<section>
<h2>Aguas profundas, aguas someras y ondas capilares</h2>
<p>En <b>aguas profundas</b> (\(kh&gt;\pi\), profundidad mayor que media longitud de onda) \(\tanh kh\to1\) y, sin tensión superficial, \(c=\omega/k=\sqrt{g/k}\): las ondas largas viajan más rápido. Con el periodo \(T\): \(\lambda=gT^2/2\pi=1.56\,T^2\) m. Una ola de mar de fondo de 10 s mide 156 m y avanza a 15.6 m/s. En <b>aguas someras</b> (\(kh&lt;\pi/10\)) \(\tanh kh\approx kh\) y</p>
<div class="eq key" data-name="Ondas largas en aguas someras">\[c=\sqrt{gh},\]</div>
<p>independiente de la longitud de onda: no hay dispersión. Las ondas muy cortas son <b>capilares</b>: las domina la tensión superficial y \(c=\sqrt{\gamma k/\rho}\) crece al acortarse. Entre ambas hay un mínimo de la velocidad de fase, \(c_{min}=(4g\gamma/\rho)^{1/4}=23.1\) cm/s con \(\lambda=1.71\) cm. Un objeto que se mueve más despacio no genera ondas; por eso un viento muy suave no riza el agua, y un insecto lento no deja estela.</p>
<div class="sim" data-sim="dispersion-ondas" data-title="Velocidad de fase y de grupo de las ondas de superficie"></div>
<div class="sim-guide"><ul>
<li>Cambie la profundidad: las ondas más largas que unas veinte veces la profundidad viajan todas a \(\sqrt{gh}\).</li>
<li>La velocidad de grupo es la mitad de la de fase en aguas profundas, igual en aguas someras y 1.5 veces la de fase para las capilares.</li>
</ul></div>
</section>

<section>
<h2>Velocidad de grupo y paquetes de ondas</h2>
<p>Una onda real es un paquete: una envolvente que contiene ondas de longitudes parecidas. Las crestas viajan con la velocidad de fase, pero la envolvente, y con ella la energía, viaja con la <span class="term">velocidad de grupo</span>:</p>
<div class="eq">\[c_g=\odv{\omega}{k},\qquad c_g=\tfrac12c\ \text{(aguas profundas)}.\]</div>
<p>En aguas profundas las crestas aparecen en la parte trasera del paquete, lo atraviesan y desaparecen por delante. Como cada componente viaja a su propia velocidad de grupo, las olas de una tormenta lejana llegan a la costa ordenadas: primero los periodos largos, luego los cortos. Midiendo cómo cambia el periodo de la llegada, Munk y Snodgrass siguieron en 1963 olas generadas en el océano Austral hasta Alaska.</p>
<div class="sim" data-sim="paquete-ondas" data-title="Un paquete de ondas en aguas profundas: crestas y envolvente"></div>
<div class="sim-guide"><ul>
<li>El paquete se calcula sumando ondas con la relación de dispersión exacta. Siga una cresta (punto rojo) y la envolvente (punto azul): la cresta avanza el doble de rápido.</li>
<li>En aguas someras ambas velocidades se igualan y el paquete viaja sin deformarse.</li>
</ul></div>
</section>

<section>
<h2>El movimiento de las partículas</h2>
<p>Bajo una ola el agua no viaja con ella: cada partícula describe una órbita cerrada. En aguas profundas las órbitas son círculos de radio \(A\ee^{kz}\) que decaen con la profundidad: a media longitud de onda bajo la superficie el movimiento es apenas el 4 % del de la superficie, y los submarinos no sienten las tormentas. En aguas intermedias las órbitas son elipses que se aplastan hacia el fondo, donde el agua solo va y viene. A segundo orden las órbitas no se cierran del todo y el agua avanza lentamente en la dirección de la onda: la <i>deriva de Stokes</i>.</p>
<div class="sim" data-sim="orbitas" data-title="Órbitas de las partículas bajo un tren de ondas"></div>
<div class="sim-guide"><ul>
<li>Pase de aguas profundas a someras con la profundidad relativa \(h/\lambda\): los círculos se convierten en elipses cada vez más planas.</li>
<li>Active la deriva de Stokes (amplitud grande) y observe el avance neto de las partículas superficiales.</li>
</ul></div>
</section>

<section>
<h2>La estela de Kelvin</h2>
<p>Un barco en aguas profundas genera ondas que viajan con él, es decir, cuya velocidad de fase en su dirección de propagación es \(U\cos\theta\). Como la energía viaja a la mitad de esa velocidad, se acumula en una cuña detrás del barco. Kelvin demostró en 1887, con el método de la fase estacionaria, que el semiángulo de esa cuña es</p>
<div class="eq key" data-name="Ángulo de la estela de Kelvin">\[\theta_K=\arcsin\frac13=19.47°,\]</div>
<p>independiente de la velocidad del barco: un pato y un trasatlántico dejan estelas con el mismo ángulo. Dentro de la cuña hay dos familias de crestas: las <i>transversales</i>, perpendiculares a la trayectoria, con longitud de onda \(2\pi U^2/g\) (64 m a 10 m/s), y las <i>divergentes</i>, que forman las líneas en V. A velocidades muy altas la estela visible se estrecha, porque el casco ya no excita las ondas largas.</p>
<div class="sim" data-sim="kelvin-estela" data-title="La estela de Kelvin: crestas transversales y divergentes"></div>
<div class="sim-guide"><ul>
<li>Las crestas son las curvas paramétricas que resultan de la fase estacionaria. Cambie la velocidad: el patrón se escala como \(U^2/g\) pero el ángulo no cambia.</li>
<li>Las cúspides, donde las dos familias se encuentran, caen exactamente sobre las rectas de 19.47°.</li>
</ul></div>
</section>

<section>
<h2>Tsunamis y la ley de Green</h2>
<p>Un sismo submarino que levanta el fondo genera ondas de cientos de kilómetros de longitud: aun en el océano profundo son ondas de aguas someras. A 4000 m de profundidad viajan a \(\sqrt{gh}=198\) m/s, 713 km/h, con amplitudes de menos de un metro, imperceptibles para un barco. Al llegar a la plataforma continental se frenan, su longitud se acorta y, como su flujo de energía \(\tfrac12\rho gA^2c_g\) se conserva, su amplitud crece según la <span class="term">ley de Green</span> (1838):</p>
<div class="eq">\[\frac{A_2}{A_1}=\left(\frac{h_1}{h_2}\right)^{1/4}.\]</div>
<p>De 4000 m a 10 m la amplitud se multiplica por 4.5, sin contar la concentración en bahías ni el remonte final. La costa pacífica colombiana es una zona de subducción: el sismo de 1906 frente a Esmeraldas y Tumaco y el de Tumaco de 1979 generaron tsunamis destructivos en la costa nariñense.</p>
<div class="sim" data-sim="tsunami" data-title="Propagación de un tsunami sobre la plataforma continental"></div>
<div class="sim-guide"><ul>
<li>Ecuaciones lineales de aguas someras sobre un perfil de fondo, resueltas en una malla escalonada. La onda se frena, se acorta y crece al subir el talud.</li>
<li>La lectura compara la amplitud medida con la ley de Green: coinciden mientras el fondo cambia lentamente frente a la longitud de onda.</li>
</ul></div>
<div class="box ex"><h4>Un seiche en un lago</h4><p>Un lago de 10 km de largo y 20 m de profundidad media puede oscilar como el agua en una bañera: una onda estacionaria cuyo modo fundamental tiene periodo \(T=2L/\sqrt{gh}=2(10\,000)/\sqrt{9.81\times20}=1428\) s, unos 24 minutos (fórmula de Merian). Los seiches los excitan los cambios de presión atmosférica o el viento, y en los puertos pueden romper amarras.</p></div>
</section>

<section>
<h2>Ondas no lineales</h2>
<p>Cuando la amplitud deja de ser pequeña, las crestas se afilan y los valles se aplanan (ondas de Stokes), y una ola rompe cuando su peralte \(H/\lambda\) se acerca a 1/7 o, en aguas someras, cuando su altura llega a unas 0.8 veces la profundidad. En aguas someras, la no linealidad, que empina el frente, puede equilibrar exactamente la dispersión, que lo suaviza: el resultado es la <span class="term">onda solitaria</span> que John Scott Russell persiguió a caballo por un canal de Escocia en 1834, una sola joroba que viaja sin deformarse. La ecuación de Korteweg y de Vries (1895) la describe y es el origen de la teoría de solitones.</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Olas de 8 s llegan desde mar adentro. Halle su longitud, su velocidad y su velocidad de grupo en aguas profundas.
<details><summary>Respuesta</summary><p>\(\lambda=1.56\times64=99.9\) m; \(c=12.5\) m/s; \(c_g=6.2\) m/s.</p></details></li>
<li><span class="lvl">Básico</span>¿Cuánto tarda un tsunami en cruzar 1000 km de océano de 4000 m de profundidad?
<details><summary>Respuesta</summary><p>\(t=10^{6}/198=5050\) s ≈ 1.4 h.</p></details></li>
<li><span class="lvl">Intermedio</span>Una ola de 10 s llega a una playa donde la profundidad es 10 m. Halle su longitud y su velocidad con la relación de dispersión completa, y compare con \(\sqrt{gh}\).
<details><summary>Respuesta</summary><p>Resolviendo \(\omega^2=gk\tanh kh\): \(\lambda=92.4\) m, \(c=9.24\) m/s, \(c_g=8.07\) m/s; \(\sqrt{gh}=9.90\) m/s: ya es casi una onda somera.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Qué longitud tienen las ondas transversales de la estela de una lancha a 15 m/s?
<details><summary>Respuesta</summary><p>\(\lambda=2\pi U^2/g=2\pi(225)/9.807=144\) m.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que la velocidad de grupo de las ondas capilares en aguas profundas es \(\tfrac32c\) y que la de fase es mínima donde \(c=c_g\).
<details><summary>Respuesta</summary><p>Capilares: \(\omega=\sqrt{\gamma k^3/\rho}\) → \(\dd\omega/\dd k=\tfrac32\omega/k\). En general \(c_g=c+k\,\dd c/\dd k\): en el mínimo de \(c\), \(\dd c/\dd k=0\) y \(c_g=c\).</p></details></li>
</ol>
