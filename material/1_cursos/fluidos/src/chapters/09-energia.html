<p class="lead">Bernoulli ignora dos cosas que en ingeniería son inevitables: la fricción, que convierte energía mecánica en calor, y las máquinas, que añaden o quitan energía al fluido. La ecuación de la energía las incorpora. Con ella se diseñan acueductos, se escogen bombas y se calcula cuánta electricidad puede dar un río. Este capítulo la deduce de la primera ley de la termodinámica y la aplica a bombas y turbinas.</p>

<section>
<h2>La ecuación de la energía con pérdidas</h2>
<p>La primera ley para un volumen de control con una entrada y una salida, en flujo estacionario, dice que el calor añadido menos el trabajo de eje es igual al aumento de \(h+V^2/2+gz\) del fluido. Para un líquido incompresible conviene separar la energía mecánica de la térmica: la fricción convierte una parte de la primera en la segunda, de modo irreversible. Expresando todo por unidad de peso:</p>
<div class="eq key" data-name="Ecuación de la energía (cargas)">\[\frac{p_1}{\rho g}+\alpha_1\frac{V_1^2}{2g}+z_1+h_b=\frac{p_2}{\rho g}+\alpha_2\frac{V_2^2}{2g}+z_2+h_t+h_L.\]</div>
<p>\(h_b\) es la carga que entrega una bomba, \(h_t\) la que extrae una turbina y \(h_L\) la pérdida de carga por fricción y accesorios, siempre positiva (capítulo 15). El factor \(\alpha=\frac{1}{AV^3}\int u^3\,\dd A\) corrige la energía cinética cuando la velocidad no es uniforme: vale 2 en flujo laminar en un tubo y 1.03–1.08 en flujo turbulento. La potencia hidráulica que recibe el fluido de una bomba es \(\rho gQh_b\); la que consume el motor, \(\rho gQh_b/\eta_b\). La pérdida \(h_L\) eleva la temperatura del agua: 100 m de pérdida la calientan apenas \(gh_L/c_p=0.23\) K.</p>
</section>

<section>
<h2>Líneas de energía y piezométrica</h2>
<p>La <span class="term">línea de energía</span> (LE) une los puntos de altura \(H=p/\rho g+V^2/2g+z\) a lo largo de una tubería; la <span class="term">línea piezométrica</span> (LP) está una carga de velocidad por debajo, en \(p/\rho g+z\): es la altura a la que subiría el agua en un piezómetro conectado a la tubería. Sin bombas, la LE solo baja; una bomba la levanta de golpe y una turbina la hace caer. Donde la tubería pasa por encima de la LP, la presión es menor que la atmosférica; si baja hasta la presión de vapor, el agua cavita y la columna se rompe. Dibujar ambas líneas sobre el perfil del terreno es el primer paso del diseño de una conducción.</p>
<div class="sim" data-sim="egl-hgl" data-title="Líneas de energía y piezométrica de una conducción con bomba"></div>
<div class="sim-guide"><ul>
<li>La tubería une dos depósitos y cruza una colina. Aumente el caudal: la pendiente de las líneas crece con \(V^2\) y la LP puede quedar por debajo de la tubería en la cima (zona roja: presión manométrica negativa).</li>
<li>Active la bomba: la LE sube en el punto de la bomba en la carga \(h_b\) que esta entrega.</li>
</ul></div>
</section>

<section>
<h2>Bombas centrífugas y punto de operación</h2>
<p>Una bomba centrífuga acelera el líquido en un rodete giratorio; la ecuación de Euler de las turbomáquinas (capítulo 8) da su carga ideal, \(h=(u_2V_{t2}-u_1V_{t1})/g\). Las pérdidas internas la reducen, y la curva característica real se aproxima por \(h_b=H_0-aQ^2\). Una bomba no impone ni el caudal ni la carga: los fija el sistema. La <span class="term">curva del sistema</span> es la carga que se necesita para mover el caudal \(Q\),</p>
<div class="eq">\[h_{sis}(Q)=\Delta z+\Delta\frac{p}{\rho g}+\left(f\frac{L}{D}+\sum K\right)\frac{Q^2}{2gA^2},\]</div>
<p>y el <span class="term">punto de operación</span> es su intersección con la curva de la bomba. Conviene que caiga cerca del punto de máxima eficiencia. Dos bombas en serie suman cargas y convienen cuando la curva del sistema es empinada (gran altura o mucha fricción); en paralelo suman caudales y convienen cuando la curva del sistema es plana, dominada por la altura estática.</p>
<p>Las <span class="term">leyes de afinidad</span>, consecuencia de la semejanza dinámica (capítulo 11), relacionan bombas geométricamente semejantes o una misma bomba a distintas velocidades:</p>
<div class="eq key" data-name="Leyes de afinidad">\[\frac{Q_2}{Q_1}=\frac{N_2}{N_1}\left(\frac{D_2}{D_1}\right)^3,\qquad\frac{h_2}{h_1}=\left(\frac{N_2}{N_1}\right)^2\left(\frac{D_2}{D_1}\right)^2,\qquad\frac{P_2}{P_1}=\left(\frac{N_2}{N_1}\right)^3\left(\frac{D_2}{D_1}\right)^5.\]</div>
<p>Bajar 15 % la velocidad de un ventilador con un variador reduce su consumo un 39 %: la principal estrategia de ahorro en bombeo. La <span class="term">velocidad específica</span> \(N_s=\omega Q^{1/2}/(gh)^{3/4}\), evaluada en el punto de máxima eficiencia, clasifica las máquinas: menos de 1 para bombas radiales, de alta carga y poco caudal; de 1 a 3 para las de flujo mixto; más de 3 para las axiales, de mucho caudal y poca carga.</p>
<div class="sim" data-sim="bomba-sistema" data-title="Curva de la bomba, curva del sistema y punto de operación"></div>
<div class="sim-guide"><ul>
<li>Bomba modelo: \(H_0=40\) m a 1750 rpm; el sistema sube el agua 15 m por 200 m de tubería de acero de 15 cm. El punto de operación es de 54.6 L/s con 28.1 m, y la bomba consume 20.2 kW.</li>
<li>Baje la velocidad o cierre la válvula (aumente \(K\)): el caudal disminuye. Compare el gasto de energía de ambas maneras de regular.</li>
<li>Con dos bombas en paralelo el caudal sube solo a 68.5 L/s, porque la fricción crece con \(Q^2\); en serie, a 72.7 L/s.</li>
</ul></div>
</section>

<section>
<h2>NPSH: la cavitación en la succión</h2>
<p>La presión mínima dentro de una bomba ocurre en la entrada del rodete, un poco por debajo de la presión en la brida de succión. Para evitar la cavitación, la carga disponible por encima de la presión de vapor en la succión, la <span class="term">carga neta de succión positiva disponible</span>, debe superar la que exige el fabricante para esa bomba y ese caudal (\(\mathrm{NPSH}_r\)):</p>
<div class="eq key" data-name="NPSH disponible">\[\mathrm{NPSH}_a=\frac{p_{atm}-p_v}{\rho g}+z_s-h_{L,s}\ \ge\ \mathrm{NPSH}_r,\]</div>
<p>con \(z_s\) la altura del nivel del agua sobre la bomba (negativa si la bomba está más alta) y \(h_{L,s}\) las pérdidas en la tubería de succión. La altitud es determinante: con agua a 20 °C, el primer término vale 10.1 m al nivel del mar y solo 8.1 m en Popayán. Una bomba instalada 3 m por encima del agua, con 1 m de pérdidas en la succión, tiene 6.1 m de NPSH disponible en la costa y 4.1 m en Popayán: una bomba que funciona bien en Cali puede cavitar en Popayán.</p>
<div class="sim" data-sim="npsh" data-title="NPSH disponible y requerido: caudal máximo sin cavitación"></div>
<div class="sim-guide"><ul>
<li>La curva roja es el NPSH requerido de la bomba modelo, que crece con el caudal. La intersección con el disponible da el caudal máximo antes de cavitar.</li>
<li>Suba la temperatura del agua: su presión de vapor crece rápidamente y el margen desaparece. Por eso las bombas de agua caliente se instalan por debajo del tanque (succión positiva).</li>
</ul></div>
</section>

<section>
<h2>Turbinas y centrales hidroeléctricas</h2>
<p>Una central toma agua de un embalse con salto bruto \(H_g\) y la conduce por una tubería de presión hasta la turbina. La potencia eléctrica es</p>
<div class="eq">\[P=\eta_t\eta_g\rho gQ\,(H_g-h_L),\qquad h_L=kQ^2.\]</div>
<p>Turbinar más caudal da más potencia, pero también más pérdida en la tubería. Si \(k\) es constante, la potencia es máxima cuando la pérdida es un tercio del salto: \(\dd[Q(H_g-kQ^2)]/\dd Q=0\) da \(kQ^2=H_g/3\). En la práctica se diseña con pérdidas mucho menores, del 5 al 10 %, porque el agua desperdiciada tiene valor. Según el salto y el caudal se elige el tipo de turbina: Pelton para saltos grandes (más de 300 m) y poco caudal; Francis, la más común, para saltos intermedios; Kaplan o de hélice para saltos bajos y mucho caudal, como en los ríos de llanura.</p>
<div class="sim" data-sim="hidroelectrica" data-title="Central hidroeléctrica: salto neto, pérdidas y potencia"></div>
<div class="sim-guide"><ul>
<li>Con 200 m de salto bruto, 1 km de tubería de 1 m de diámetro y eficiencias de 0.90 y 0.97, la potencia máxima es de 9.3 MW con 8.2 m³/s, y en ese punto se pierde un tercio del salto.</li>
<li>Agrande la tubería: el máximo se desplaza a caudales mayores. La elección del diámetro es un balance económico entre el costo de la tubería y el de la energía perdida.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una bomba eleva 30 L/s de agua a un tanque 25 m más alto, con 5 m de pérdidas. Si su eficiencia es 75 %, ¿qué potencia consume?
<details><summary>Respuesta</summary><p>\(h_b=30\) m; \(P=998\times9.807\times0.03\times30/0.75=11.7\) kW.</p></details></li>
<li><span class="lvl">Básico</span>Una bomba da 40 L/s con 30 m a 1750 rpm. ¿Qué caudal y carga dará a 1450 rpm (en puntos homólogos)?
<details><summary>Respuesta</summary><p>\(Q=40\times1450/1750=33.1\) L/s; \(h=30(1450/1750)^2=20.6\) m.</p></details></li>
<li><span class="lvl">Intermedio</span>Para la bomba modelo (\(h_b=40-4000Q^2\)) y un sistema \(h_{sis}=15+5000Q^2\), halle el punto de operación.
<details><summary>Respuesta</summary><p>\(40-4000Q^2=15+5000Q^2\) → \(Q=\sqrt{25/9000}=52.7\) L/s, \(h=28.9\) m.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Cuál es la máxima altura a la que puede instalarse una bomba sobre un pozo en Popayán, con agua a 25 °C, \(\mathrm{NPSH}_r=3\) m y 0.8 m de pérdidas en la succión?
<details><summary>Respuesta</summary><p>\(p_v=3.17\) kPa; \((81\,898-3170)/(997\times9.807)=8.05\) m. \(z_s=-(8.05-0.8-3)=-4.25\): la bomba puede estar como máximo 4.25 m por encima del agua.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que la potencia de una central con \(h_L=kQ^2\) es máxima cuando \(h_L=H_g/3\) y que entonces la eficiencia hidráulica de la conducción es 2/3.
<details><summary>Respuesta</summary><p>\(P\propto QH_g-kQ^3\); \(\dd P/\dd Q=H_g-3kQ^2=0\). Entonces \(H_n=2H_g/3\). Operar ahí desperdicia un tercio del recurso: solo conviene si el agua sobra.</p></details></li>
</ol>
