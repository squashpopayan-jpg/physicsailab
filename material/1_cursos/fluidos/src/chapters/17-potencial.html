<template class="chapter-src" data-id="potencial" data-num="17" data-title="Flujo potencial" data-part="Parte IV · Flujo ideal y vorticidad" data-short="Flujo irrotacional y potencial de velocidad, el potencial complejo, flujos elementales y superposición, el semicuerpo y el óvalo de Rankine, el cilindro con circulación, la paradoja de d'Alembert, el teorema de Kutta–Joukowski y el perfil de Joukowski">
<p class="lead">Fuera de las capas límite y las estelas, muchos flujos son irrotacionales: las partículas de fluido no giran. Entonces la velocidad deriva de un potencial que cumple la ecuación de Laplace, y en dos dimensiones toda la potencia de las funciones de variable compleja se pone a disposición de la mecánica de fluidos. Con ella se calcula la presión sobre un ala, se explica la sustentación y se entiende también qué falta: la viscosidad.</p>

<section>
<h2>Flujo irrotacional y potencial de velocidad</h2>
<p>Si la vorticidad es nula, \(\curl\vb u=0\), la velocidad es el gradiente de una función escalar, el <span class="term">potencial de velocidad</span>: \(\vb u=\grad\phi\). Si además el flujo es incompresible, \(\divg\vb u=0\) da</p>
<div class="eq key" data-name="Flujo potencial">\[\lap\phi=0.\]</div>
<p>Una ecuación lineal, la misma de la electrostática y de la conducción estacionaria del calor: las soluciones se superponen. La presión se obtiene después con Bernoulli, que en flujo irrotacional vale entre dos puntos cualesquiera. ¿Por qué tantos flujos son irrotacionales? Por el teorema de Kelvin (capítulo 18): en un fluido sin viscosidad, la circulación alrededor de un circuito material se conserva, y un flujo que parte del reposo o de una corriente uniforme no adquiere vorticidad. Esta solo se genera en las paredes, por la viscosidad, y queda confinada en las capas límite y las estelas.</p>
</section>

<section>
<h2>El potencial complejo</h2>
<p>En un flujo plano, el potencial \(\phi\) y la función de corriente \(\psi\) cumplen las ecuaciones de Cauchy–Riemann, \(u=\partial\phi/\partial x=\partial\psi/\partial y\), \(v=\partial\phi/\partial y=-\partial\psi/\partial x\). Por lo tanto \(W(z)=\phi+\ii\psi\) es una función analítica de \(z=x+\ii y\), el <span class="term">potencial complejo</span>, y su derivada es la velocidad conjugada:</p>
<div class="eq key" data-name="Potencial complejo">\[W(z)=\phi+\ii\psi,\qquad\odv{W}{z}=u-\ii v.\]</div>
<p>Toda función analítica describe un flujo posible. Los <span class="term">flujos elementales</span> son:</p>
<div class="tablewrap"><table>
<tr><th>Flujo</th><th class="c">\(W(z)\)</th><th>Descripción</th></tr>
<tr><td>Uniforme</td><td class="c">\(U\ee^{-\ii\alpha}z\)</td><td>velocidad \(U\) con ángulo \(\alpha\)</td></tr>
<tr><td>Fuente (sumidero si \(m&lt;0\))</td><td class="c">\(\dfrac{m}{2\pi}\ln z\)</td><td>caudal \(m\) por unidad de profundidad, radial</td></tr>
<tr><td>Vórtice irrotacional</td><td class="c">\(-\dfrac{\ii\Gamma}{2\pi}\ln z\)</td><td>circulación \(\Gamma\), \(v_\theta=\Gamma/2\pi r\)</td></tr>
<tr><td>Doblete</td><td class="c">\(\dfrac{\kappa}{2\pi z}\)</td><td>fuente y sumidero que se juntan</td></tr>
<tr><td>Esquina</td><td class="c">\(Az^n\)</td><td>flujo en un ángulo \(\pi/n\)</td></tr>
</table></div>
<p>Una corriente uniforme más una fuente da el <span class="term">semicuerpo de Rankine</span>: la línea de corriente que pasa por el punto de estancamiento, en \(x=-m/2\pi U\), se puede reemplazar por una pared sólida; el cuerpo tiene un ancho asintótico \(m/U\). Con una fuente y un sumidero se obtiene un <b>óvalo de Rankine</b>; con un doblete, un cilindro. Así se diseñaron las primeras formas de dirigibles y de proas.</p>
<div class="sim" data-sim="superposicion" data-title="Superposición de flujos elementales"></div>
<div class="sim-guide"><ul>
<li>Arrastre los elementos con el ratón. Las líneas de corriente se trazan desde el borde izquierdo y alrededor de las fuentes; el color indica la rapidez.</li>
<li>Una fuente junto a una pared equivale a la fuente y su imagen especular: el preajuste «fuente y pared» muestra el método de las imágenes.</li>
</ul></div>
</section>

<section>
<h2>El cilindro y la paradoja de d'Alembert</h2>
<p>Una corriente uniforme más un doblete de intensidad \(2\pi Ua^2\) da el flujo alrededor de un cilindro de radio \(a\): \(W=U(z+a^2/z)\). En la superficie la velocidad es \(2U\sin\theta\) y el coeficiente de presión</p>
<div class="eq">\[C_p=\frac{p-p_\infty}{\tfrac12\rho U^2}=1-4\sin^2\theta.\]</div>
<p>La distribución es simétrica entre la parte delantera y la trasera: la presión empuja igual hacia atrás que hacia adelante y la fuerza neta es cero. Es la <span class="term">paradoja de d'Alembert</span> (1752): en un fluido ideal, ningún cuerpo tiene arrastre. La realidad la resuelve la capa límite: se separa del lado trasero, la presión allí no se recupera y aparece el arrastre de presión.</p>
<p>Si al flujo del cilindro se suma un vórtice de circulación \(\Gamma\), la simetría arriba–abajo se rompe: de un lado la velocidad aumenta y del otro disminuye, los puntos de estancamiento se desplazan y aparece una fuerza perpendicular al flujo. Para cualquier cuerpo bidimensional, Kutta (1902) y Joukowski (1906) demostraron que</p>
<div class="eq key" data-name="Teorema de Kutta–Joukowski">\[L'=\rho U\Gamma.\]</div>
<p>La sustentación por unidad de envergadura depende solo de la circulación, no de la forma. Un cilindro que gira genera circulación por arrastre viscoso: es el efecto Magnus (capítulo 16). El rotor de Flettner, un cilindro vertical giratorio, ha propulsado barcos desde la década de 1920.</p>
<div class="sim" data-sim="cilindro-circulacion" data-title="Cilindro con circulación: líneas de corriente, presión y sustentación"></div>
<div class="sim-guide"><ul>
<li>Sin circulación, la distribución de \(C_p\) es simétrica y la fuerza es nula. Con circulación horaria, la velocidad crece arriba, la presión baja y la integral de la presión sobre la superficie da exactamente \(\rho U\Gamma\).</li>
<li>Con \(\Gamma=4\pi Ua\) los dos puntos de estancamiento se juntan abajo; con más circulación, el punto de estancamiento se separa del cilindro.</li>
</ul></div>
</section>

<section>
<h2>Transformación conforme y el perfil de Joukowski</h2>
<p>Una función analítica \(\zeta=f(z)\) transforma un flujo potencial en otro, conservando los ángulos. La <span class="term">transformación de Joukowski</span></p>
<div class="eq">\[\zeta=z+\frac{c^2}{z}\]</div>
<p>convierte un círculo que pasa por \(z=c\) en un perfil alar con borde de salida agudo. Desplazando el centro del círculo a la izquierda se da espesor; hacia arriba, curvatura. El flujo alrededor del círculo, conocido, se traslada al perfil. Pero queda una incógnita: la circulación. En el borde de salida la derivada de la transformación se anula y la velocidad sería infinita, salvo para un único valor de \(\Gamma\) que hace que el flujo abandone el borde de salida suavemente. Es la <span class="term">condición de Kutta</span>, el rastro de la viscosidad en la teoría ideal:</p>
<div class="eq">\[\Gamma=4\pi Ua\sin(\alpha+\beta),\qquad C_L=\frac{2\Gamma}{Uc_{perfil}}\to2\pi\sin(\alpha+\beta).\]</div>
<p>Para un perfil delgado y simétrico, \(C_L\to2\pi\alpha\): el resultado de la teoría del perfil delgado que usa el capítulo 16. El espesor aumenta un poco la pendiente y la curvatura desplaza la curva, de modo que el perfil sustenta aun con \(\alpha=0\). La física es la de una corriente que se curva: para que el aire abandone el borde de salida, el ala debe imprimirle circulación, y con ella aparece la sustentación. Al arrancar, el ala deja atrás un <i>vórtice de arranque</i> con la circulación opuesta, como exige el teorema de Kelvin.</p>
<div class="sim" data-sim="joukowski" data-title="Perfil de Joukowski: transformación, líneas de corriente y presión"></div>
<div class="sim-guide"><ul>
<li>Las líneas de corriente se calculan en el plano del círculo y se transforman. El coeficiente de sustentación crece casi linealmente con el ángulo de ataque, con pendiente cercana a \(2\pi\).</li>
<li>Sin la condición de Kutta (circulación nula) el flujo rodea el borde de salida con velocidad infinita: imposible en un fluido real.</li>
</ul></div>
</section>

<section>
<h2>Alcance y límites del flujo potencial</h2>
<p>El flujo potencial predice bien la presión sobre cuerpos fuselados y alas a ángulos moderados, el flujo aguas arriba de casi cualquier obstáculo, las ondas de superficie (capítulo 19) y el flujo en medios porosos (ley de Darcy). No predice el arrastre ni la separación, y falla en las estelas de los cuerpos romos. Combinado con la teoría de capa límite, que usa su distribución de presión como dato, fue la base del diseño aerodinámico durante la primera mitad del siglo XX y sigue en los métodos de paneles que usa la industria aeronáutica.</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un semicuerpo de Rankine en una corriente de 5 m/s tiene 2 m de ancho asintótico. ¿Cuál es la intensidad de la fuente y dónde está el punto de estancamiento?
<details><summary>Respuesta</summary><p>Ancho \(m/U=2\) → \(m=10\) m²/s. Punto de estancamiento a \(m/2\pi U=0.318\) m delante de la fuente.</p></details></li>
<li><span class="lvl">Básico</span>¿Cuál es la presión mínima sobre un cilindro en una corriente de aire de 20 m/s a nivel del mar, según el flujo potencial?
<details><summary>Respuesta</summary><p>\(C_{p,min}=-3\) a 90°: \(p-p_\infty=-3\times\tfrac12(1.225)(400)=-735\) Pa.</p></details></li>
<li><span class="lvl">Intermedio</span>Un rotor de Flettner de 3 m de diámetro y 20 m de alto gira con su superficie a 30 m/s en un viento de 10 m/s. Suponiendo que el aire adherido gira con la superficie, estime la fuerza.
<details><summary>Respuesta</summary><p>\(\Gamma=2\pi a v_s=2\pi(1.5)(30)=283\) m²/s; \(L=\rho U\Gamma h=1.225(10)(283)(20)=69\) kN. Los rotores reales dan bastante menos, porque el aire no gira solidario con la superficie.</p></details></li>
<li><span class="lvl">Intermedio</span>Para un cilindro con circulación, ¿qué \(\Gamma\) hace coincidir los dos puntos de estancamiento?
<details><summary>Respuesta</summary><p>\(\sin\theta_s=\Gamma/4\pi Ua=\pm1\): \(|\Gamma|=4\pi Ua\).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que el flujo \(W=Az^n\) describe un flujo en una esquina de ángulo \(\pi/n\) y que, para \(n&lt;1\), la velocidad es infinita en el vértice.
<details><summary>Respuesta</summary><p>\(\psi=Ar^n\sin n\theta=0\) en \(\theta=0\) y \(\theta=\pi/n\): ambas son paredes. \(|\dd W/\dd z|=nAr^{n-1}\), que diverge en \(r\to0\) si \(n&lt;1\) (esquinas convexas, por ejemplo una arista de 270° con \(n=2/3\)).</p></details></li>
</ol>
