<template class="chapter-src" data-id="choques" data-num="22" data-title="Ondas de choque y expansiones" data-part="Parte VI · Flujo compresible" data-short="Las relaciones de Rankine–Hugoniot del choque normal, la segunda ley y la pérdida de presión de estancamiento, choques oblicuos y la relación θ–β–M, expansiones de Prandtl–Meyer, perfiles supersónicos y el tubo de choque con su solución exacta">
<p class="lead">En un flujo supersónico el gas no puede «enterarse» con anticipación de un obstáculo, y se ajusta de golpe en una capa de pocos recorridos libres medios: la onda de choque. A través de ella la presión, la densidad y la temperatura saltan y la entropía crece. Este capítulo deduce esos saltos, los aplica a cuñas, esquinas y perfiles supersónicos, y resuelve el problema del tubo de choque, la prueba clásica de los métodos numéricos de dinámica de gases.</p>

<section>
<h2>La onda de choque normal</h2>
<p>Un choque normal es una discontinuidad perpendicular al flujo. Aplicando la conservación de la masa, de la cantidad de movimiento y de la energía a un volumen de control delgado que lo contiene,</p>
<div class="eq">\[\rho_1V_1=\rho_2V_2,\qquad p_1+\rho_1V_1^2=p_2+\rho_2V_2^2,\qquad h_1+\tfrac12V_1^2=h_2+\tfrac12V_2^2,\]</div>
<p>y con la ecuación de estado del gas ideal se obtienen las <span class="term">relaciones de Rankine–Hugoniot</span> en función del Mach de llegada:</p>
<div class="eq key" data-name="Choque normal">\[M_2^2=\frac{1+\frac{\gamma-1}{2}M_1^2}{\gamma M_1^2-\frac{\gamma-1}{2}},\qquad\frac{p_2}{p_1}=1+\frac{2\gamma}{\gamma+1}(M_1^2-1),\qquad\frac{\rho_2}{\rho_1}=\frac{(\gamma+1)M_1^2}{(\gamma-1)M_1^2+2}.\]</div>
<p>Con \(M_1=2\) en aire: el flujo sale a \(M_2=0.577\), la presión se multiplica por 4.5, la densidad por 2.67 y la temperatura por 1.69. Por fuerte que sea el choque, la densidad no puede crecer más de \((\gamma+1)/(\gamma-1)=6\) veces, mientras que la presión y la temperatura crecen sin límite. La temperatura de estancamiento se conserva, pero la presión de estancamiento cae: con \(M_1=2\) se pierde el 28 %, y con \(M_1=3\), dos tercios. Esa pérdida es la entropía generada, \(\Delta s=-R_g\ln(p_{02}/p_{01})\).</p>
<div class="box law"><h4>Solo existen choques de compresión</h4><p>Las ecuaciones de conservación admiten también una solución con \(M_1&lt;1\) que daría un «choque de expansión». Pero en ella la entropía disminuiría, lo que prohíbe la segunda ley de la termodinámica. Por eso los choques solo comprimen y siempre pasan el flujo de supersónico a subsónico (en la dirección normal).</p></div>
<div class="sim" data-sim="choque-normal" data-title="Relaciones de Rankine–Hugoniot para el choque normal"></div>
<div class="sim-guide"><ul>
<li>Las curvas muestran los saltos contra \(M_1\). El cociente de densidades se satura en 6; el de presiones crece como \(M_1^2\).</li>
<li>La lectura incluye la fórmula de Rayleigh para el tubo de Pitot supersónico: delante de la sonda se forma un choque y lo que mide es \(p_{02}\).</li>
</ul></div>
</section>

<section>
<h2>Choques oblicuos</h2>
<p>Cuando una pared supersónica gira hacia el flujo un ángulo \(\theta\), como en una cuña, se forma un choque <span class="term">oblicuo</span> inclinado un ángulo \(\beta\). Solo la componente normal de la velocidad, \(M_1\sin\beta\), pasa por un choque normal; la tangencial se conserva. La geometría da la relación entre la deflexión, el ángulo del choque y el Mach:</p>
<div class="eq key" data-name="Relación θ–β–M">\[\tan\theta=2\cot\beta\,\frac{M_1^2\sin^2\beta-1}{M_1^2(\gamma+\cos2\beta)+2}.\]</div>
<p>Para cada \(M_1\) y \(\theta\) hay dos soluciones: la <b>débil</b>, que es la que suele ocurrir, con flujo supersónico detrás, y la <b>fuerte</b>, casi normal. Con \(M_1=2\) y una cuña de 10°, el choque débil está a 39.3° y el flujo sigue a Mach 1.64 con 1.71 veces la presión. Hay una deflexión máxima, 23° para Mach 2: con una cuña más gruesa o un cuerpo romo el choque se despega y se curva delante del cuerpo (choque de proa), como frente a una cápsula que regresa a la atmósfera.</p>
<div class="sim" data-sim="choque-oblicuo" data-title="Choque oblicuo sobre una cuña: diagrama θ–β–M"></div>
<div class="sim-guide"><ul>
<li>Las curvas \(\theta(\beta)\) para varios números de Mach tienen un máximo: a la izquierda de él están las soluciones débiles, a la derecha las fuertes.</li>
<li>Aumente el ángulo de la cuña por encima del máximo: el programa indica que el choque se despega.</li>
</ul></div>
</section>

<section>
<h2>Expansiones de Prandtl–Meyer</h2>
<p>Si la pared gira alejándose del flujo, el gas se expande a través de un abanico continuo de ondas de Mach, sin pérdidas: es una <span class="term">expansión de Prandtl–Meyer</span>, isentrópica. El ángulo que gira el flujo se relaciona con el Mach por la función</p>
<div class="eq">\[\nu(M)=\sqrt{\frac{\gamma+1}{\gamma-1}}\arctan\sqrt{\frac{\gamma-1}{\gamma+1}(M^2-1)}-\arctan\sqrt{M^2-1},\qquad\theta=\nu(M_2)-\nu(M_1).\]</div>
<p>\(\nu(2)=26.38°\): un flujo a Mach 2 que gira 10° alrededor de una esquina convexa acelera hasta el Mach cuyo \(\nu\) es 36.38°, Mach 2.38. En principio el flujo puede girar hasta 130.45° expandiéndose hasta el vacío.</p>
</section>

<section>
<h2>Perfiles supersónicos</h2>
<p>Una placa plana con ángulo de ataque \(\alpha\) en flujo supersónico tiene un choque oblicuo en el borde de ataque inferior y una expansión en el superior; la diferencia de presión da sustentación y, como la fuerza es perpendicular a la placa, también un <span class="term">arrastre de onda</span> que no existe en flujo subsónico. La teoría de choques y expansiones lo calcula exactamente; para ángulos pequeños, la teoría lineal de Ackeret (1925) da</p>
<div class="eq">\[C_L=\frac{4\alpha}{\sqrt{M^2-1}},\qquad C_{D,onda}=\frac{4\alpha^2}{\sqrt{M^2-1}}.\]</div>
<p>Con \(M=2\) y \(\alpha=5°\), ambas teorías dan \(C_L\approx0.202\) y \(C_D\approx0.018\). Por eso los aviones supersónicos usan perfiles delgados y afilados, alas en flecha que «esconden» el borde de ataque dentro del cono de Mach, y fuselajes que siguen la regla de las áreas.</p>
<div class="sim" data-sim="prandtl-meyer" data-title="Placa plana supersónica: choque, expansión y sustentación"></div>
<div class="sim-guide"><ul>
<li>El abanico de expansión del extradós se dibuja con sus ondas de Mach extremas; el choque del intradós con su ángulo \(\beta\).</li>
<li>Compare la teoría de choques y expansiones con la lineal de Ackeret: coinciden para ángulos pequeños y se separan cuando el ángulo crece o el Mach se acerca a 1.</li>
</ul></div>
</section>

<section>
<h2>El tubo de choque</h2>
<p>Un tubo dividido por un diafragma tiene gas a alta presión de un lado y a baja del otro. Al romperse el diafragma se forman tres ondas: un <b>choque</b> que avanza hacia el gas de baja presión, una <b>discontinuidad de contacto</b> que separa los dos gases (con igual presión y velocidad pero distinta densidad) y un <b>abanico de expansión</b> que retrocede hacia el de alta presión. Es el <span class="term">problema de Riemann</span>, y tiene solución exacta: la presión y la velocidad entre las ondas se obtienen resolviendo una ecuación algebraica no lineal con el método de Newton (Toro, 2009). Con los datos de Sod (1978), \(p_L/p_R=10\) y \(\rho_L/\rho_R=8\), la región central tiene \(p^*=0.30313\,p_L\) y \(u^*=0.92745\sqrt{p_L/\rho_L}\).</p>
<p>El problema de Sod es la prueba estándar de los métodos numéricos para flujos con choques. Un método de volúmenes finitos con un resolvedor aproximado de Riemann (HLLC) y reconstrucción de segundo orden captura el choque en dos o tres celdas sin oscilaciones; los métodos centrados ingenuos producen oscilaciones espurias detrás de él.</p>
<div class="sim" data-sim="tubo-choque" data-title="Tubo de choque de Sod: solución exacta y volúmenes finitos"></div>
<div class="sim-guide"><ul>
<li>Las líneas son la solución exacta; los puntos, el método HLLC con limitador minmod en 200 celdas. Pase a primer orden y observe cuánto se difunden las discontinuidades.</li>
<li>Aumente la relación de presiones: el choque se fortalece y el contacto se separa más de él.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Aire a 100 kPa y 250 K llega a Mach 3 a un choque normal. Halle \(p_2\), \(T_2\) y \(M_2\).
<details><summary>Respuesta</summary><p>\(p_2=1033\) kPa, \(T_2=670\) K, \(M_2=0.475\).</p></details></li>
<li><span class="lvl">Básico</span>Un tubo de Pitot en un avión a Mach 2 mide \(p_{02}=5.64\,p_1\). ¿Qué marcaría si se usara la fórmula isentrópica sin choque?
<details><summary>Respuesta</summary><p>Sin choque, \(p_0/p=7.82\) para Mach 2; la fórmula isentrópica aplicada a 5.64 daría Mach 1.79: un error grave. Por eso los velocímetros supersónicos usan la fórmula de Rayleigh.</p></details></li>
<li><span class="lvl">Intermedio</span>Una cuña de 15° está en un flujo a Mach 3. Halle el ángulo del choque débil y la presión detrás.
<details><summary>Respuesta</summary><p>\(\beta=32.2°\); \(M_{1n}=1.60\), \(p_2/p_1=2.82\), \(M_2=2.25\).</p></details></li>
<li><span class="lvl">Intermedio</span>Un flujo a Mach 1.5 gira 20° alrededor de una esquina convexa. ¿A qué Mach sale y cuánto cae la presión?
<details><summary>Respuesta</summary><p>\(\nu(1.5)=11.91°\); \(\nu_2=31.91°\) → \(M_2=2.207\); \(p_2/p_1=p_0/p(1.5)\,/\,p_0/p(2.207)=3.671/10.80=0.340\).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que la entropía generada en un choque débil crece como \((M_1^2-1)^3\).
<details><summary>Respuesta</summary><p>Desarrollando \(\Delta s/c_v=\ln[(p_2/p_1)(\rho_1/\rho_2)^\gamma]\) en potencias de \(\varepsilon=M_1^2-1\), los términos de orden 1 y 2 se cancelan y queda \(\Delta s/R_g\approx\frac{2\gamma}{3(\gamma+1)^2}\varepsilon^3\). Por eso los choques débiles son casi isentrópicos y las ondas de sonido no generan entropía apreciable.</p></details></li>
</ol>
