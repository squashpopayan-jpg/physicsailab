<template class="chapter-src" data-id="canales" data-num="20" data-title="Flujo en canales abiertos" data-part="Parte V · Superficie libre" data-short="El número de Froude y los regímenes subcrítico y supercrítico, la energía específica y la profundidad crítica, flujo sobre escalones y bajo compuertas, la ecuación de Manning, el resalto hidráulico, los perfiles de flujo gradualmente variado, los vertederos y la rotura de una presa">
<p class="lead">Ríos, acequias, canales de riego, alcantarillas parcialmente llenas y vertederos de presas comparten una característica: el agua tiene una superficie libre que se acomoda al flujo. Eso añade una incógnita, la profundidad, y un fenómeno nuevo: las ondas de superficie que llevan información aguas arriba o no pueden hacerlo. El número de Froude, cociente entre la velocidad del agua y la de esas ondas, ordena todo el capítulo.</p>

<section>
<h2>El número de Froude</h2>
<p>En un canal de profundidad \(y\), una perturbación pequeña viaja con la velocidad de las ondas largas, \(c=\sqrt{gy}\) (capítulo 19). Si el agua avanza con velocidad \(V\), las perturbaciones se mueven a \(V\pm c\). El <span class="term">número de Froude</span></p>
<div class="eq key" data-name="Número de Froude">\[\mathrm{Fr}=\frac{V}{\sqrt{gy_h}},\qquad y_h=\frac{A}{T},\]</div>
<p>con \(y_h\) la profundidad hidráulica (área sobre ancho superficial), clasifica el flujo. Con \(\mathrm{Fr}&lt;1\) el flujo es <b>subcrítico</b> o tranquilo: las ondas remontan la corriente y lo que pasa aguas abajo (una compuerta, una presa) se siente aguas arriba. Con \(\mathrm{Fr}&gt;1\) es <b>supercrítico</b> o torrencial: las ondas son arrastradas y el flujo solo depende de lo que hay aguas arriba. Es el análogo exacto de los números de Mach subsónico y supersónico (capítulo 21). Una piedra en un arroyo rápido produce un frente en V, como un avión supersónico.</p>
</section>

<section>
<h2>Energía específica y profundidad crítica</h2>
<p>Medida desde el fondo del canal, la energía por unidad de peso es la <span class="term">energía específica</span>. Para un canal rectangular con caudal por unidad de ancho \(q=Vy\):</p>
<div class="eq key" data-name="Energía específica">\[E=y+\frac{q^2}{2gy^2}.\]</div>
<p>Para un \(E\) dado hay dos profundidades posibles, una subcrítica (profunda y lenta) y una supercrítica (somera y rápida): las <span class="term">profundidades alternas</span>. Se juntan en el mínimo de \(E\), que ocurre en la <span class="term">profundidad crítica</span>, donde \(\mathrm{Fr}=1\):</p>
<div class="eq">\[y_c=\left(\frac{q^2}{g}\right)^{1/3},\qquad E_{min}=\tfrac32y_c.\]</div>
<p>Con 2 m³/s por metro de ancho, \(y_c=0.742\) m y \(E_{min}=1.11\) m. Sobre un escalón del fondo de altura \(\Delta z\), la energía específica disminuye en \(\Delta z\): un flujo subcrítico <b>baja</b> su superficie al pasar sobre el escalón y uno supercrítico la <b>sube</b>, al revés de lo que dicta la intuición. Si el escalón es mayor que \(E_1-E_{min}\), el flujo no puede pasar con ese caudal y se remansa aguas arriba: el canal se <i>ahoga</i>.</p>
<div class="sim" data-sim="energia-especifica" data-title="Energía específica y flujo sobre un escalón"></div>
<div class="sim-guide"><ul>
<li>Con 2 m²/s y 1.5 m de profundidad aguas arriba, un escalón de 20 cm baja la superficie del agua, que pasa a 1.26 m sobre el escalón. El escalón máximo antes del ahogamiento es de 48 cm.</li>
<li>Cambie a régimen supercrítico: ahora el agua se levanta sobre el escalón.</li>
</ul></div>
</section>

<section>
<h2>Flujo uniforme: la ecuación de Manning</h2>
<p>En un canal largo de pendiente \(S_0\) constante, el agua alcanza una profundidad en la que la componente del peso a lo largo del fondo equilibra la fricción: el <span class="term">flujo uniforme</span>, a la <span class="term">profundidad normal</span> \(y_n\). La fórmula empírica de Manning (1889), en unidades SI, es</p>
<div class="eq key" data-name="Ecuación de Manning">\[V=\frac{1}{n}R_h^{2/3}S_0^{1/2},\qquad Q=\frac{1}{n}AR_h^{2/3}S_0^{1/2},\]</div>
<p>con \(R_h=A/P\) el radio hidráulico (área sobre perímetro mojado) y \(n\) el coeficiente de rugosidad: 0.010–0.013 para concreto liso, 0.022 para tierra limpia, 0.03–0.05 para ríos naturales con piedras y vegetación. Un canal trapezoidal de concreto de 2 m de fondo con taludes 1.5:1, pendiente de 1 por mil y 10 m³/s fluye con 1.27 m de profundidad y \(\mathrm{Fr}=0.70\): subcrítico. Para un área dada, la sección de menor perímetro, y por tanto la que conduce más caudal, es el semihexágono; para un canal rectangular, el que tiene el ancho igual al doble de la profundidad.</p>
<div class="sim" data-sim="manning" data-title="Canal trapezoidal: profundidad normal, crítica y número de Froude"></div>
<div class="sim-guide"><ul>
<li>Aumente la pendiente: la profundidad normal baja por debajo de la crítica y el flujo uniforme se vuelve supercrítico (pendiente <i>fuerte</i>).</li>
<li>Elija el preajuste de río: un cauce de 80 m con 300 m³/s y \(n=0.035\) corre a unos 2.9 m de profundidad con \(\mathrm{Fr}\approx0.24\).</li>
</ul></div>
</section>

<section>
<h2>El resalto hidráulico</h2>
<p>Cuando un flujo supercrítico debe pasar a subcrítico, como al pie del vertedero de una presa, lo hace bruscamente en un <span class="term">resalto hidráulico</span>: una pared turbulenta donde la profundidad aumenta y se disipa mucha energía. Bernoulli no sirve a través del resalto, pero la cantidad de movimiento se conserva. Para un canal rectangular, la ecuación de Bélanger da</p>
<div class="eq key" data-name="Resalto hidráulico">\[\frac{y_2}{y_1}=\frac12\left(\sqrt{1+8\,\mathrm{Fr}_1^2}-1\right),\qquad\Delta E=\frac{(y_2-y_1)^3}{4y_1y_2}.\]</div>
<p>Un chorro de 30 cm a 8 m/s (\(\mathrm{Fr}_1=4.66\)) salta a 1.83 m y disipa 1.64 m de carga, el 46 % de su energía. Los <i>tanques amortiguadores</i> al pie de las presas fuerzan un resalto estable para que el agua no socave el lecho. El resalto aparece también en el fregadero, alrededor del chorro del grifo que cae sobre el fondo plano.</p>
<div class="sim" data-sim="resalto" data-title="Resalto hidráulico: profundidades conjugadas y pérdida de energía"></div>
<div class="sim-guide"><ul>
<li>Con \(\mathrm{Fr}_1\) entre 1 y 1.7 el resalto es una ondulación; de 4.5 a 9, un resalto estable, ideal para disipar energía; por encima de 9, un resalto fuerte e irregular.</li>
<li>La pérdida relativa de energía crece con \(\mathrm{Fr}_1\): pasa del 9 % con \(\mathrm{Fr}_1=2\) al 70 % con \(\mathrm{Fr}_1=9\).</li>
</ul></div>
</section>

<section>
<h2>Flujo gradualmente variado</h2>
<p>Cuando la profundidad cambia lentamente, por ejemplo aguas arriba de una presa, la ecuación de la energía con la pendiente de fricción \(S_f\) evaluada con Manning da la ecuación del <span class="term">flujo gradualmente variado</span>:</p>
<div class="eq">\[\odv{y}{x}=\frac{S_0-S_f}{1-\mathrm{Fr}^2}.\]</div>
<p>Según la relación entre \(y\), \(y_n\) y \(y_c\) se obtienen doce familias de perfiles. En un canal de pendiente suave (\(y_n&gt;y_c\)), el agua remansada por una presa forma el perfil <b>M1</b>, que se eleva sobre la profundidad normal y se extiende kilómetros aguas arriba; antes de una caída libre el agua forma el perfil <b>M2</b>, que desciende hacia la profundidad crítica. En pendientes fuertes aparecen los perfiles <b>S</b>.</p>
<div class="sim" data-sim="perfiles-gvf" data-title="Perfiles de flujo gradualmente variado: remanso detrás de una presa"></div>
<div class="sim-guide"><ul>
<li>La ecuación se integra hacia aguas arriba con Runge–Kutta desde el nivel impuesto por la presa. Lejos de ella, el perfil se acerca asintóticamente a la profundidad normal.</li>
<li>Baje el nivel de la presa por debajo de la profundidad normal: el perfil se vuelve M2 y el agua se acelera hacia la descarga.</li>
</ul></div>
</section>

<section>
<h2>Vertederos y la rotura de una presa</h2>
<p>Un vertedero de cresta ancha fuerza el flujo crítico sobre su cresta; como \(y_c=\tfrac23H\), el caudal depende solo de la carga \(H\) sobre la cresta: \(q=\sqrt g(\tfrac23H)^{3/2}=1.705H^{3/2}\). Por eso los vertederos sirven para medir caudales en ríos y acequias.</p>
<p>Si una presa se rompe de golpe sobre un lecho seco, las ecuaciones de aguas someras tienen una solución exacta encontrada por Ritter en 1892: una onda de rarefacción en la que la profundidad es \(h=(2c_0-x/t)^2/9g\), con \(c_0=\sqrt{gh_0}\). El frente avanza a \(2c_0\): con un embalse de 10 m, a 19.8 m/s (71 km/h). En el sitio de la presa la profundidad se estabiliza en \(\tfrac49h_0\) y la velocidad en \(\tfrac23c_0\).</p>
<div class="sim" data-sim="rotura-presa" data-title="Rotura de una presa: solución de Ritter y volúmenes finitos"></div>
<div class="sim-guide"><ul>
<li>Los puntos son la solución numérica con el método de volúmenes finitos HLL; la línea, la solución exacta de Ritter. La lectura da el error medio.</li>
<li>Con agua aguas abajo (lecho mojado) el frente se convierte en un resalto móvil, una <i>ola de inundación</i>, que la solución de Ritter ya no describe.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un canal rectangular de 4 m de ancho lleva 12 m³/s. Halle la profundidad crítica y la energía específica mínima.
<details><summary>Respuesta</summary><p>\(q=3\) m²/s; \(y_c=(9/9.807)^{1/3}=0.972\) m; \(E_{min}=1.458\) m.</p></details></li>
<li><span class="lvl">Básico</span>¿Es subcrítico un río de 2 m de profundidad que corre a 1.5 m/s?
<details><summary>Respuesta</summary><p>\(\mathrm{Fr}=1.5/\sqrt{9.807\times2}=0.34\): sí.</p></details></li>
<li><span class="lvl">Intermedio</span>Al pie de un vertedero el agua corre a 12 m/s con 0.5 m de profundidad. ¿Qué profundidad tendrá tras el resalto y cuánta potencia disipa por metro de ancho?
<details><summary>Respuesta</summary><p>\(\mathrm{Fr}_1=5.42\); \(y_2=0.25(\sqrt{1+8\times29.4}-1)=3.59\) m; \(\Delta E=(3.09)^3/(4\times0.5\times3.59)=4.11\) m; \(P=\rho gq\Delta E=998\times9.807\times6\times4.11=241\) kW/m.</p></details></li>
<li><span class="lvl">Intermedio</span>Con Manning, halle el caudal de un canal rectangular de concreto (\(n=0.013\)) de 3 m de ancho, 1 m de agua y pendiente 0.002.
<details><summary>Respuesta</summary><p>\(A=3\), \(P=5\), \(R_h=0.6\); \(Q=(1/0.013)(3)(0.6)^{2/3}(0.002)^{1/2}=7.33\) m³/s.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que en la solución de Ritter la profundidad en el sitio de la presa (\(x=0\)) es \(\tfrac49h_0\) y el caudal por unidad de ancho \(\tfrac{8}{27}h_0\sqrt{gh_0}\).
<details><summary>Respuesta</summary><p>En \(x=0\): \(h=(2c_0)^2/9g=\tfrac49h_0\) y \(u=\tfrac23c_0\). Entonces \(q=hu=\tfrac49h_0\times\tfrac23\sqrt{gh_0}=\tfrac{8}{27}h_0\sqrt{gh_0}\), el máximo posible: es la condición crítica.</p></details></li>
</ol>
