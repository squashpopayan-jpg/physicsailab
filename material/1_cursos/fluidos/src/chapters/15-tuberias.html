<p class="lead">El agua potable, el gas natural, el petróleo, el aire acondicionado y la sangre viajan por tubos. Diseñar una conducción es responder siempre las mismas preguntas: cuánta presión se pierde, cuánto caudal pasa, qué diámetro hace falta. Este capítulo reúne la teoría y las correlaciones que permiten responderlas, con la precisión que la ingeniería exige y que el diagrama de Moody resume en una sola figura.</p>

<section>
<h2>La ecuación de Darcy–Weisbach</h2>
<p>En un tubo recto con flujo desarrollado, el esfuerzo en la pared equilibra la caída de presión: \(\Delta p\,\pi D^2/4=\tau_w\pi DL\). El análisis dimensional (capítulo 11) dice que \(\tau_w/\rho V^2\) depende solo de \(\mathrm{Re}\) y de la rugosidad relativa \(\varepsilon/D\). Con el <span class="term">factor de fricción de Darcy</span> \(f=8\tau_w/\rho V^2\):</p>
<div class="eq key" data-name="Ecuación de Darcy–Weisbach">\[h_f=\frac{\Delta p}{\rho g}=f\frac{L}{D}\frac{V^2}{2g},\qquad f=\phi\left(\mathrm{Re},\frac{\varepsilon}{D}\right).\]</div>
<p>En flujo laminar la solución de Hagen–Poiseuille da exactamente \(f=64/\mathrm{Re}\), independiente de la rugosidad. Cerca de la entrada el perfil todavía se está formando y la caída de presión es mayor; la <span class="term">longitud de entrada</span> es \(L_e\approx0.06\,\mathrm{Re}\,D\) en flujo laminar (60 diámetros con \(\mathrm{Re}=1000\)) y \(L_e\approx4.4\,\mathrm{Re}^{1/6}D\) en flujo turbulento (30 diámetros con \(\mathrm{Re}=10^{5}\)).</p>
</section>

<section>
<h2>Rugosidad, Colebrook y el diagrama de Moody</h2>
<p>En 1933 Nikuradse pegó granos de arena de tamaño controlado en el interior de tubos y midió \(f\) en un rango enorme de números de Reynolds. En flujo turbulento encontró tres regímenes. En tubos <b>hidráulicamente lisos</b>, la rugosidad queda escondida dentro de la subcapa viscosa y \(f\) depende solo de Re; integrar la ley logarítmica de la pared (capítulo 14) sobre la sección da la ley de Prandtl–Kármán, \(1/\sqrt f=2\log_{10}(\mathrm{Re}\sqrt f)-0.8\). En régimen <b>completamente rugoso</b> los granos atraviesan la subcapa, la viscosidad deja de importar y \(1/\sqrt f=-2\log_{10}(\varepsilon/3.7D)\). Entre ambos hay una transición.</p>
<p>Los tubos comerciales no tienen arena uniforme, y su transición es más gradual. Colebrook y White (1939) propusieron una fórmula que interpola los dos extremos y describe bien los tubos reales:</p>
<div class="eq key" data-name="Ecuación de Colebrook–White">\[\frac{1}{\sqrt f}=-2\log_{10}\left(\frac{\varepsilon/D}{3.7}+\frac{2.51}{\mathrm{Re}\sqrt f}\right).\]</div>
<p>Es implícita en \(f\), pero converge en pocas iteraciones de Newton. Moody (1944) la graficó junto con la recta laminar: el <span class="term">diagrama de Moody</span>, quizás la figura más usada de toda la ingeniería. Hay fórmulas explícitas que la aproximan con errores de 1–2 %: Haaland (1983), \(1/\sqrt f=-1.8\log_{10}[(\varepsilon/3.7D)^{1.11}+6.9/\mathrm{Re}]\), y Swamee–Jain (1976); la de Churchill (1977) cubre incluso el régimen laminar y la transición. Las rugosidades típicas van de 0.0015 mm (PVC, cobre) a 0.045 mm (acero comercial), 0.15 mm (hierro galvanizado), 0.26 mm (hierro fundido) y 0.3–3 mm (concreto).</p>
<div class="sim" data-sim="moody" data-title="Diagrama de Moody interactivo"></div>
<div class="sim-guide"><ul>
<li>Mueva el punto: la lectura compara Colebrook (resuelta por Newton) con Haaland, Swamee–Jain y Churchill. La biblioteca <i>fluids</i> se usa en el apéndice B para validar estas implementaciones.</li>
<li>La zona sombreada entre \(\mathrm{Re}=2300\) y 4000 es la transición, donde el factor de fricción es incierto: conviene diseñar fuera de ella.</li>
</ul></div>
<div class="box warn"><h4>La ecuación de Hazen–Williams</h4><p>En acueductos aún se usa la fórmula empírica de Hazen–Williams, \(V=0.849\,C\,R_h^{0.63}S^{0.54}\). Es cómoda, pero solo vale para agua a temperatura ambiente en un rango limitado de diámetros y velocidades, y su coeficiente \(C\) no es una propiedad física. Darcy–Weisbach con Colebrook vale para cualquier fluido newtoniano.</p></div>
</section>

<section>
<h2>Los tres problemas de tuberías</h2>
<p>Con Darcy–Weisbach y Colebrook se resuelven tres tipos de problema. <b>Tipo 1</b>: dados el caudal, el diámetro y la longitud, hallar la pérdida; es directo. <b>Tipo 2</b>: dada la pérdida disponible, hallar el caudal; \(f\) depende del caudal, y se itera. <b>Tipo 3</b>: dados el caudal y la pérdida admisible, hallar el diámetro; también iterativo, y el resultado se redondea al diámetro comercial superior.</p>
<div class="box ex"><h4>Una conducción de hierro galvanizado</h4><p>Por 200 m de tubo galvanizado de 4 pulgadas (102.3 mm, \(\varepsilon=0.15\) mm) pasan 10 L/s de agua a 20 °C. Entonces \(V=1.22\) m/s, \(\mathrm{Re}=1.24\times10^{5}\), \(\varepsilon/D=0.0015\) y Colebrook da \(f=0.0233\). La pérdida es \(h_f=0.0233(200/0.1023)(1.22^2/19.6)=3.44\) m, es decir 33.6 kPa. Haaland da \(f=0.0231\) y Swamee–Jain 0.0235: diferencias menores al 1 %.</p></div>
<div class="sim" data-sim="problema-tuberia" data-title="Los tres problemas: pérdida, caudal o diámetro"></div>
<div class="sim-guide"><ul>
<li>Elija el tipo de problema. Para el tipo 2 y el tipo 3 el programa resuelve por bisección la ecuación de la energía con Colebrook.</li>

</section>

<section>
<h2>Pérdidas menores</h2>
<p>Codos, válvulas, entradas, salidas, expansiones y contracciones disipan energía por separación y mezcla. Se expresan con un coeficiente \(K\): \(h_m=K\,V^2/2g\). En tuberías largas pesan poco; en las instalaciones de un edificio pueden dominar. Para una <b>expansión brusca</b> de \(A_1\) a \(A_2\), las ecuaciones de continuidad, cantidad de movimiento y energía dan el resultado exacto de Borda y Carnot:</p>
<div class="eq">\[h_m=\frac{(V_1-V_2)^2}{2g}=\left(1-\frac{A_1}{A_2}\right)^2\frac{V_1^2}{2g}.\]</div>
<p>La salida a un tanque grande es el caso límite \(A_2\to\infty\), \(K=1\): toda la energía cinética se pierde. Valores típicos: entrada de borde vivo 0.5, entrada redondeada 0.04, codo de 90° roscado 0.9, válvula de compuerta abierta 0.2, válvula de globo abierta 10. Los fabricantes los dan para cada accesorio; también se usa la <i>longitud equivalente</i> \(L_e=KD/f\).</p>
</section>

<section>
<h2>Redes de tuberías: el método de Hardy Cross</h2>
<p>En una red se cumplen dos leyes, análogas a las de Kirchhoff para circuitos: en cada nudo, el caudal que entra es igual al que sale; y en cada circuito cerrado, la suma de pérdidas con signo es cero. Como las pérdidas son no lineales (\(h=rQ|Q|\)), el sistema se resuelve iterando. Hardy Cross (1936) propuso corregir los caudales de cada circuito con</p>
<div class="eq">\[\Delta Q=-\frac{\sum rQ|Q|}{\sum2r|Q|},\]</div>
<p>a partir de una distribución inicial que cumpla la continuidad. Cada corrección conserva la continuidad en los nudos y reduce el desequilibrio de pérdidas; en pocas iteraciones la red converge. Fue el método estándar de diseño de acueductos hasta la llegada de los programas de cómputo, que hoy usan el método del gradiente (EPANET).</p>
<div class="sim" data-sim="hardy-cross" data-title="Red de dos circuitos resuelta por Hardy Cross"></div>
<div class="sim-guide"><ul>
<li>Cada clic en «Iterar» aplica una corrección a cada circuito. La gráfica muestra el desequilibrio de pérdidas, que decrece rápidamente.</li>
<li>Cambie el diámetro de un tubo y observe cómo se redistribuye el caudal: el agua prefiere los caminos de menor resistencia, pero no los toma todos.</li>
</ul></div>
</section>

<section>
<h2>El golpe de ariete</h2>
<p>Si una válvula se cierra de golpe al final de una tubería, el agua que llega se detiene contra ella y su energía cinética se convierte en compresión del agua y dilatación del tubo. Se forma una onda de presión que viaja aguas arriba a la <span class="term">celeridad</span></p>
<div class="eq">\[a=\frac{\sqrt{K/\rho}}{\sqrt{1+KD/(Ee)}},\]</div>
<p>donde \(E\) y \(e\) son el módulo de Young y el espesor de la pared (Korteweg, 1878). La sobrepresión, deducida por Joukowsky en 1898 con un balance de cantidad de movimiento a través del frente de la onda, es</p>
<div class="eq key" data-name="Ecuación de Joukowsky">\[\Delta p=\rho a\,\Delta V,\qquad\Delta H=\frac{a\,\Delta V}{g}.\]</div>
<p>En un tubo de acero de 50 cm con pared de 1 cm, \(a=1190\) m/s, y detener agua que viaja a 2 m/s produce 243 m de sobrepresión: 2.4 MPa, capaz de reventar la tubería. En PVC la celeridad es de unos 375 m/s y la sobrepresión, tres veces menor. La onda se refleja en el depósito y regresa con signo opuesto en un tiempo \(2L/a\); si la válvula se cierra en menos de ese tiempo, la sobrepresión es la de Joukowsky completa. Por eso las válvulas grandes se cierran lentamente y las centrales hidroeléctricas tienen chimeneas de equilibrio.</p>
<div class="sim" data-sim="golpe-ariete" data-title="Golpe de ariete por el método de las características"></div>
<div class="sim-guide"><ul>
<li>Con cierre instantáneo y sin fricción, la presión en la válvula salta exactamente la sobrepresión de Joukowsky y oscila con periodo \(4L/a\).</li>
<li>Alargue el tiempo de cierre por encima de \(2L/a\): la sobrepresión máxima cae, porque las ondas de alivio reflejadas en el depósito llegan antes de que termine el cierre.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Aceite (\(\nu=10^{-4}\) m²/s, \(\rho=880\) kg/m³) fluye a 1 m/s por un tubo de 5 cm. Halle la caída de presión en 100 m.
<details><summary>Respuesta</summary><p>\(\mathrm{Re}=500\), laminar: \(f=0.128\); \(\Delta p=0.128(100/0.05)(880)(1/2)=112.6\) kPa.</p></details></li>
<li><span class="lvl">Básico</span>¿Qué factor de fricción tiene un tubo de PVC (liso) con \(\mathrm{Re}=10^{5}\)? Compare con la fórmula de Blasius, \(f=0.316\mathrm{Re}^{-1/4}\).
<details><summary>Respuesta</summary><p>Colebrook con \(\varepsilon=0\): 0.0180. Blasius: 0.0178. Coinciden hasta \(\mathrm{Re}\approx10^{5}\); por encima Blasius subestima.</p></details></li>
<li><span class="lvl">Intermedio</span>Un tanque elevado alimenta una casa por 60 m de tubo de PVC de 1 pulgada (26.6 mm) con una entrada, cuatro codos, una válvula de compuerta, una de globo y la salida (\(\sum K=15.3\)). ¿Qué carga se pierde con 0.5 L/s?
<details><summary>Respuesta</summary><p>\(V=0.90\) m/s, \(\mathrm{Re}=23\,900\), \(f=0.0249\); \(h_f=2.32\) m, \(h_m=0.63\) m; total 2.95 m. La válvula de globo sola equivale a \(KD/f=11\) m de tubo.</p></details></li>
<li><span class="lvl">Intermedio</span>Halle la pérdida en una expansión brusca de 5 cm a 10 cm con 6 L/s de agua.
<details><summary>Respuesta</summary><p>\(V_1=3.06\) m/s; \(K=(1-0.25)^2=0.5625\); \(h_m=0.5625\times3.06^2/19.6=0.27\) m.</p></details></li>
<li><span class="lvl">Avanzado</span>Una tubería de acero de 1 km, 50 cm y pared de 1 cm transporta agua a 2 m/s. ¿Cuál es el tiempo crítico de cierre? Si la válvula se cierra en 10 s, estime la sobrepresión con la fórmula de Michaud, \(\Delta H\approx2LV/(gt_c)\).
<details><summary>Respuesta</summary><p>\(2L/a=2000/1191=1.68\) s. Con \(t_c=10\) s, \(\Delta H\approx2(1000)(2)/(9.807\times10)=40.8\) m, frente a 243 m del cierre brusco.</p></details></li>
</ol>
