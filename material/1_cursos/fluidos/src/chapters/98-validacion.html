<p class="lead">Todos los cálculos de las simulaciones salen de dos bibliotecas únicas: <code>src/core/30-fluid.js</code> (propiedades, fórmulas y soluciones analíticas) y <code>src/core/31-num.js</code> (solucionadores numéricos), más unas tablas de propiedades generadas una sola vez con CoolProp (<code>src/core/29-props.js</code>). Un programa automático compara esas bibliotecas con referencias independientes. Este apéndice explica el método y lista cada comprobación con su resultado.</p>

<section>
<h2>Método</h2>
<ol>
<li><b>Propiedades con CoolProp 8</b>. Las tablas del agua (IAPWS-95, viscosidad IAPWS 2008, conductividad IAPWS 2011), del aire (Lemmon et al.) y de cuatro líquidos orgánicos se generaron con CoolProp; el curso las interpola con splines cúbicos (en \(\ln\mu\) para la viscosidad). Las pruebas comparan estados <b>fuera</b> de los nodos de las tablas. La tensión superficial del agua usa la fórmula de IAPWS (1994) y la presión de vapor la ecuación de Wagner y Pruß; ambas se contrastan con la tabla oficial de IAPWS y con la formulación IAPWS-95 completa.</li>
<li><b>La biblioteca <i>fluids</i></b> de C. Bell, independiente del curso, aporta las ecuaciones de fricción (Colebrook, Haaland, Swamee–Jain, Churchill), las correlaciones de arrastre de la esfera (Morrison, Clift–Gauvin), la velocidad terminal, la atmósfera estándar de 1976, Manning y la pérdida por ensanchamiento brusco.</li>
<li><b>SciPy</b> resuelve de forma independiente las ecuaciones de Blasius y de Falkner–Skan (<code>solve_bvp</code>), las funciones de Bessel reales y complejas, la serie de Szymanski, el perfil de Womersley, las relaciones de choque oblicuo y de Prandtl–Meyer (<code>brentq</code>), la relación de dispersión, el problema de Sod, el sistema de Lorenz (<code>solve_ivp</code>) y los caudales de fluidos no newtonianos (<code>quad</code>).</li>
<li><b>Soluciones numéricas contra soluciones exactas</b>: la cavidad contra Ghia et al.; Lattice Boltzmann contra Taylor–Green y Poiseuille; el golpe de ariete contra Joukowsky; los volúmenes finitos contra el problema de Riemann exacto y la rotura de presa de Ritter; Crank–Nicolson contra los problemas de Stokes, Szymanski y Womersley; la lubricación, la gota sésil, la estabilidad de un casco, Kutta–Joukowski, la advección, Hardy Cross, el ducto cuadrado y otras.</li>
<li><b>Datos de la literatura</b>: Schlichting, Hartree, Chandrasekhar, Rayleigh, NACA 1135, Toro, IAPWS, Gunn y Kinzer, Taylor, las simulaciones directas de Kim, Moin y Moser y Moser, Kim y Mansour, Shah y London. La tolerancia refleja la incertidumbre del dato o del modelo.</li>
</ol>
<p>Todos los ejemplos resueltos y las respuestas de los problemas se calcularon con la misma biblioteca antes de escribirlos. Cuando un número del borrador no coincidió con el cálculo, se corrigió el texto: así se ajustaron, entre otros, la exactitud de la fórmula de Sutherland, varias respuestas de los capítulos 2, 3, 7, 15, 16, 20 y 22, los factores de seguridad de la presa, la energía de la explosión Trinity (16 kt con ρ = 1.25 kg/m³), el calentamiento del cojinete y la convención de signos de la circulación del cilindro. Algunas comprobaciones obligaron a cambiar el modelo y no solo el texto: la longitud de mezcla de \(\kappa y\) sobreestimaba la fricción del canal y se sustituyó por la de Nikuradse; el número de Strouhal del túnel numérico se mide sobre la sustentación suavizada porque las ondas acústicas de la red daban frecuencias falsas.</p>
<p>Otras pruebas fallaron al principio por estar mal planteadas, y se corrigió la prueba, no la tolerancia: la función de Bessel del curso solo está definida para \(J_0\) y \(J_1\); Crank–Nicolson con pasos de tiempo enormes produce oscilaciones conocidas, así que la prueba usa la malla y el paso de la simulación; el perfil de Poiseuille de Lattice Boltzmann se comparaba con el máximo continuo y no con los nodos, y la precisión simple de las poblaciones exigía una fuerza mayor; el exponente de Taylor se ajusta con los 25 radios, como en la simulación. Tres tolerancias se fijaron después de identificar la causa de la diferencia: la ecuación auxiliar de Wagner–Pruß difiere de IAPWS-95 hasta en \(7\times10^{-5}\); las tablas del aire, con nodos cada 10 K, interpolan con error de \(7\times10^{-5}\) cerca de su extremo inferior; y <i>fluids</i> escribe la constante de Swamee–Jain como \(6.97^{0.9}=5.7397\) donde los textos redondean a 5.74.</p>
<div class="box warn"><h4>Exactitud de los modelos</h4><p>Algunas comparaciones no buscan coincidencia exacta sino medir el error de un modelo: el aire como gas ideal tiene un error de densidad de 0.19 % a −60 °C; la velocidad terminal de una esfera rígida difiere un 2 % de la medida en gotas de lluvia de 1 y 2 mm, que no son esferas rígidas; la longitud de mezcla reproduce la velocidad media del canal de las simulaciones directas con errores de 1 a 4 %; el método de Lattice Boltzmann con rebote a mitad de enlace solo es exacto para Poiseuille con \(\tau=\tfrac12+\sqrt{3/16}\), y con otros \(\tau\) tiene errores del orden de 0.1 %; la cavidad de 41 × 41 se aparta de Ghia hasta 0.16 con Re = 1000, como dice el capítulo 26. El arrastre del túnel numérico incluye el bloqueo del 13 % del canal y es bidimensional.</p></div>
<div class="box warn"><h4>Lo que es ilustrativo</h4><p>Algunas simulaciones usan modelos simplificados y así lo dicen: la transición en el experimento de Reynolds y la señal turbulenta (sintéticas, con las estadísticas correctas), la pérdida del perfil después del ángulo crítico (ajuste empírico), el coeficiente de Magnus (ajuste de Sawicki, Hubbard y Stronge), el coeficiente de resistencia residual del modelo de barco, las curvas de bomba (típicas), el costo metabólico de la ley de Murray y los parámetros reológicos de la sangre, la pasta de dientes, la salsa de tomate y la maicena (valores representativos). Reproducen la física y los órdenes de magnitud, no un equipo o un fluido específico.</p></div>
