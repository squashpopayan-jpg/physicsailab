<template class="chapter-src" data-id="flotacion" data-num="4" data-title="Fuerzas sobre superficies y flotación" data-part="Parte I · Fluidos en reposo" data-short="Fuerza y centro de presión sobre compuertas planas y curvas, estabilidad de presas de gravedad, el principio de Arquímedes, icebergs y globos, y la estabilidad de los barcos: metacentro y curva de brazos adrizantes">
<p class="lead">La presión que crece con la profundidad empuja compuertas, presas, cascos de barcos y paredes de tanques. Integrar esa presión sobre una superficie da una fuerza y un punto de aplicación; integrarla sobre un cuerpo sumergido da el empuje de Arquímedes. Con esas dos ideas se diseñan presas y se decide si un barco se endereza o vuelca.</p>

<section>
<h2>Fuerza sobre una superficie plana</h2>
<p>Sea una superficie plana de área \(A\) inclinada un ángulo \(\theta\) respecto a la horizontal y sumergida en un líquido de superficie libre a presión atmosférica. Midiendo la coordenada \(y\) a lo largo de la placa desde la línea de la superficie libre, la profundidad es \(h=y\sin\theta\) y la fuerza manométrica es</p>
<div class="eq key" data-name="Fuerza hidrostática sobre una superficie plana">\[F=\int_A\rho gy\sin\theta\,\dd A=\rho g h_cA=p_cA,\]</div>
<p>donde \(h_c\) es la profundidad del centroide: la fuerza es la presión en el centroide por el área. Como la presión crece con la profundidad, la fuerza no actúa en el centroide sino más abajo, en el <span class="term">centro de presión</span>. Igualando momentos respecto a la línea de la superficie,</p>
<div class="eq key" data-name="Centro de presión">\[y_{cp}=y_c+\frac{I_{xc}}{y_cA},\]</div>
<p>con \(I_{xc}\) el segundo momento del área respecto a un eje horizontal por el centroide: \(bL^3/12\) para un rectángulo, \(\pi D^4/64\) para un círculo. El desplazamiento \(I_{xc}/(y_cA)\) disminuye con la profundidad: una compuerta muy sumergida tiene el centro de presión casi en el centroide.</p>
<div class="sim" data-sim="compuerta" data-title="Compuerta plana inclinada: prisma de presiones y centro de presión"></div>
<div class="sim-guide"><ul>
<li>Una compuerta vertical rectangular de 2 m × 3 m con su borde superior a 1 m de profundidad recibe 146.8 kN aplicados 0.30 m por debajo del centroide.</li>
<li>Hunda la compuerta: la fuerza crece linealmente con la profundidad del centroide, pero el centro de presión se acerca al centroide.</li>
<li>Con la bisagra en el borde superior, la lectura muestra la fuerza que hay que aplicar en el borde inferior para mantenerla cerrada.</li>
</ul></div>
</section>

<section>
<h2>Superficies curvas</h2>
<p>Sobre una superficie curva la presión cambia de dirección punto a punto y conviene calcular las componentes por separado. La <b>componente horizontal</b> es la fuerza sobre la proyección vertical de la superficie, calculada como para una superficie plana. La <b>componente vertical</b> es el peso del líquido, real o imaginario, que hay entre la superficie y la superficie libre. Para una superficie que es un arco de círculo, cada fuerza elemental \(p\,\dd A\) es normal a la superficie y pasa por el centro, de modo que la resultante también pasa por el centro: las <span class="term">compuertas radiales</span> (o de Tainter) de los vertederos se apoyan en un eje en ese centro y se abren con un esfuerzo pequeño, porque la presión no hace momento sobre el eje.</p>
<div class="box ex"><h4>Compuerta de cuarto de círculo</h4><p>Una compuerta con forma de cuarto de cilindro de radio 2 m y 5 m de ancho, cóncava hacia arriba como el fondo de un canal, sostiene el agua que tiene encima; la superficie libre está al nivel de su borde superior. Horizontal: \(F_H=\rho g(R/2)(R\times5)=9.79\times1\times10=97.9\) kN. Vertical: peso del agua del cuarto de cilindro, \(\rho g(\pi R^2/4)\times5=9.79\times15.71=153.8\) kN. Resultante: 182.3 kN, inclinada 57.5° respecto a la horizontal y dirigida hacia el eje del cilindro.</p></div>
</section>

<section>
<h2>Presas de gravedad</h2>
<p>Una presa de gravedad resiste el empuje del agua con su propio peso. Sobre una sección de 1 m de ancho actúan el empuje horizontal \(F_H=\rho gH^2/2\), aplicado a \(H/3\) del fondo; el peso del concreto \(W\); y la <span class="term">subpresión</span> \(U\), el agua que se filtra bajo la base y empuja hacia arriba, desde \(\rho gH\) en el talón hasta cero en el pie si no hay drenaje. Dos factores de seguridad la califican:</p>
<div class="eq">\[\mathrm{FS}_{desl}=\frac{\mu_f(W-U)}{F_H},\qquad \mathrm{FS}_{volc}=\frac{\text{momentos estabilizadores}}{\text{momentos de volcamiento}}\ \text{respecto al pie}.\]</div>
<p>La resultante debe cortar la base en su tercio central para que toda la base quede comprimida. Las galerías de drenaje reducen la subpresión a una fracción de su valor y son decisivas: muchas fallas históricas de presas se debieron a subpresiones no previstas.</p>
<div class="sim" data-sim="presa" data-title="Estabilidad de una presa de gravedad"></div>
<div class="sim-guide"><ul>
<li>Con 30 m de agua, una sección triangular de concreto de 32 m de alto y 24 m de base tiene \(\mathrm{FS}_{volc}=3.3\) sin subpresión, pero solo 1.44 con subpresión completa, y la resultante queda en el borde del tercio central. El deslizamiento es aún más crítico: \(\mathrm{FS}_{desl}\) cae de 1.44 a 0.88.</li>
<li>Active el drenaje (subpresión reducida a un tercio en la línea de drenes): \(\mathrm{FS}_{volc}\) sube a 2.0 y la resultante se aleja del borde del tercio central. Para el deslizamiento hace falta además una base más ancha o la cohesión de la roca.</li>
</ul></div>
</section>

<section>
<h2>El principio de Arquímedes</h2>
<p>Sumando las fuerzas de presión sobre la superficie de un cuerpo sumergido, las componentes horizontales se cancelan y la vertical es la diferencia entre la presión de abajo y la de arriba. Con el teorema de la divergencia, \(\oint p\,\vb n\,\dd A=\int\grad p\,\dd V=\int\rho_f\vb g\,\dd V\):</p>
<div class="eq key" data-name="Principio de Arquímedes">\[\vb F_E=-\rho_fV_{sum}\vb g.\]</div>
<p>El empuje es igual al peso del fluido desalojado y actúa en el centroide del volumen sumergido, el <span class="term">centro de carena</span> \(B\). Un cuerpo flota si su densidad media es menor que la del fluido, y la fracción sumergida es \(\rho_c/\rho_f\). El hielo (917 kg/m³) flota en el mar con el 89.5 % de su volumen bajo el agua; en agua dulce, con el 91.9 %. Un densímetro es un flotador calibrado: se hunde más en los líquidos menos densos.</p>
<div class="sim" data-sim="arquimedes" data-title="Flotación: fracción sumergida, empuje y peso aparente"></div>
<div class="sim-guide"><ul>
<li>Elija un cuerpo y un fluido. Si la densidad del cuerpo supera la del fluido, la lectura muestra el peso aparente: el peso menos el empuje.</li>
<li>El acero flota en el mercurio con el 58 % sumergido. Una persona flota en el agua con la cabeza afuera solo si inhala: su densidad media ronda la del agua.</li>
</ul></div>
<div class="box ex"><h4>Un globo de aire caliente en Popayán</h4><p>Un globo de 2500 m³ calienta el aire a 100 °C. Al nivel del mar con aire a 15 °C, el aire exterior pesa 1.225 kg/m³ y el interior 0.946 kg/m³: la sustentación neta es \((1.225-0.946)\times2500=698\) kg. En Popayán, con 81.9 kPa y 19 °C, las densidades son 0.977 y 0.765 kg/m³ y la sustentación cae a 530 kg, un 24 % menos. Para levantar la misma carga hay que calentar más el aire o usar un globo más grande.</p></div>
</section>

<section>
<h2>Estabilidad de los cuerpos flotantes</h2>
<p>Un cuerpo totalmente sumergido es estable si su centro de gravedad \(G\) está por debajo del centro de carena \(B\), como en un submarino o un globo. Un barco tiene casi siempre \(G\) por encima de \(B\) y aun así es estable, porque al escorarse la forma del volumen sumergido cambia y \(B\) se desplaza hacia el costado que se hunde. Para escoras pequeñas, la vertical que pasa por el nuevo \(B\) corta el eje del barco en el <span class="term">metacentro</span> \(M\), a una altura sobre \(B\)</p>
<div class="eq key" data-name="Altura metacéntrica">\[\overline{BM}=\frac{I_{wl}}{V},\qquad \overline{GM}=\overline{KB}+\overline{BM}-\overline{KG},\]</div>
<p>donde \(I_{wl}\) es el segundo momento del área de flotación respecto al eje longitudinal y \(V\) el volumen sumergido. El barco es estable si \(\overline{GM}&gt;0\). Para una barcaza rectangular de manga \(b\) y calado \(T\), \(\overline{BM}=b^2/(12T)\). El momento que endereza al barco es \(\Delta\cdot\overline{GZ}\), donde \(\overline{GZ}\approx\overline{GM}\sin\phi\) es el <span class="term">brazo adrizante</span>. Para escoras grandes hay que calcular \(\overline{GZ}(\phi)\) completo: cuando la cubierta se moja o la obra viva emerge, la curva se dobla y llega a cero en el ángulo de pérdida de estabilidad.</p>
<div class="sim" data-sim="metacentro" data-title="Escora de un casco: centro de carena, metacentro y curva GZ"></div>
<div class="sim-guide"><ul>
<li>La curva \(\overline{GZ}(\phi)\) se calcula recortando el polígono del casco por la línea de flotación de igual desplazamiento en cada ángulo. Su pendiente en el origen coincide con \(\overline{GM}\).</li>
<li>Una barcaza de 10 m de manga, 2 m de calado y \(\overline{KG}=3\) m tiene \(\overline{GM}=2.17\) m; su brazo adrizante máximo ocurre hacia 30° y se anula cerca de 66°.</li>
<li>Suba el centro de gravedad (carga en cubierta, agua embarcada): \(\overline{GM}\) se vuelve negativo y el barco se acuesta sobre un costado.</li>
</ul></div>
<p>Una \(\overline{GM}\) grande da un barco muy estable pero «duro», con balanceos bruscos: el periodo de balance es \(T=2\pi k/\sqrt{g\overline{GM}}\), con \(k\) el radio de giro. Los buques de pasajeros eligen \(\overline{GM}\) moderadas para balancearse con suavidad.</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una compuerta circular de 1 m de diámetro, vertical, tiene su centro a 4 m de profundidad. Halle la fuerza y la posición del centro de presión.
<details><summary>Respuesta</summary><p>\(F=998.2\times9.807\times4\times0.7854=30.75\) kN; \(y_{cp}=4+(\pi/64)/(4\times0.7854)=4.0156\) m.</p></details></li>
<li><span class="lvl">Básico</span>¿Qué fracción de un tronco de madera de densidad 650 kg/m³ queda sumergida en el río?
<details><summary>Respuesta</summary><p>\(650/998.2=0.651\): el 65 %.</p></details></li>
<li><span class="lvl">Intermedio</span>Una corona de 1.0 kg pesa 0.94 kg sumergida en agua (peso aparente). ¿Es de oro puro (19 300 kg/m³)?
<details><summary>Respuesta</summary><p>Empuje 0.06 kg·g → \(V=60\) cm³, densidad 16 700 kg/m³: no es oro puro. Así resolvió Arquímedes el problema de la corona de Hierón, según Vitruvio.</p></details></li>
<li><span class="lvl">Intermedio</span>Una barcaza rectangular de 12 m de manga y 3 m de calado tiene \(\overline{KG}=4.5\) m. ¿Es estable?
<details><summary>Respuesta</summary><p>\(\overline{KB}=1.5\), \(\overline{BM}=144/36=4.0\), \(\overline{GM}=1.5+4.0-4.5=1.0\) m &gt; 0: estable.</p></details></li>
<li><span class="lvl">Avanzado</span>Un cilindro macizo de madera (\(\rho=600\) kg/m³) de radio \(R\) y longitud \(L\) flota con el eje vertical. ¿Para qué valores de \(L/R\) flota así de manera estable?
<details><summary>Respuesta</summary><p>Calado \(T=0.6L\), \(\overline{KB}=0.3L\), \(\overline{KG}=0.5L\), \(\overline{BM}=(\pi R^4/4)/(\pi R^2\,0.6L)=R^2/(2.4L)\). Estable si \(R^2/(2.4L)&gt;0.2L\), es decir \(L/R&lt;1.44\). Un cilindro más largo se acuesta.</p></details></li>
</ol>
