<p class="lead">Los remolinos son los «músculos» de los flujos, según una expresión de Küchemann. La vorticidad nace en las paredes, se transporta con el fluido, se estira, se difunde y se organiza en estructuras que viven mucho más que el movimiento que las creó: tornados, anillos de humo, los vórtices de punta de ala que obligan a separar los aviones en los aeropuertos, la mancha roja de Júpiter. Este capítulo presenta las leyes de la vorticidad y la dinámica sorprendente de los vórtices.</p>

<section>
<h2>Vorticidad y circulación</h2>
<p>La vorticidad \(\boldsymbol\omega=\curl\vb u\) es el doble de la velocidad angular local de las partículas de fluido (capítulo 6). La <span class="term">circulación</span> alrededor de una curva cerrada \(C\) es, por el teorema de Stokes, el flujo de vorticidad a través de cualquier superficie que la tenga como borde:</p>
<div class="eq key" data-name="Circulación">\[\Gamma=\oint_C\vb u\cdot\dd\vb l=\int_S\boldsymbol\omega\cdot\vb n\,\dd A.\]</div>
<p>Las <span class="term">líneas de vorticidad</span> son tangentes a \(\boldsymbol\omega\); un haz de ellas forma un <span class="term">tubo de vórtice</span>. Como \(\divg\boldsymbol\omega=0\), la circulación es la misma en cualquier sección de un tubo de vórtice: un vórtice no puede terminar dentro del fluido. Termina en una pared o en una superficie libre, como un tornado entre el suelo y la nube, o se cierra sobre sí mismo, como un anillo de humo.</p>
</section>

<section>
<h2>La ecuación de la vorticidad</h2>
<p>Tomando el rotacional de las ecuaciones de Navier–Stokes, para un fluido incompresible de densidad uniforme la presión desaparece:</p>
<div class="eq key" data-name="Ecuación de la vorticidad">\[\frac{D\boldsymbol\omega}{Dt}=(\boldsymbol\omega\cdot\grad)\vb u+\nu\lap\boldsymbol\omega.\]</div>
<p>El primer término es el <b>estiramiento y la inclinación</b> de los tubos de vórtice. Cuando un tubo se estira en la dirección de su eje, su sección disminuye y, como su circulación se conserva, su vorticidad aumenta: es el patinador que acerca los brazos al cuerpo. Así se intensifican los tornados bajo las corrientes ascendentes de una tormenta y así la turbulencia tridimensional transfiere energía a escalas pequeñas. El segundo término es la <b>difusión viscosa</b> de la vorticidad. En un flujo plano no hay estiramiento: la vorticidad de cada partícula solo cambia por difusión, y por eso la turbulencia bidimensional se comporta de manera tan distinta.</p>
</section>

<section>
<h2>Los teoremas de Kelvin y Helmholtz</h2>
<div class="box law"><h4>Teorema de Kelvin (1869)</h4><p>En un fluido sin viscosidad, barotrópico y sometido a fuerzas conservativas, la circulación alrededor de cualquier circuito que se mueve con el fluido es constante: \(D\Gamma/Dt=0\).</p></div>
<p>Consecuencias, enunciadas antes por Helmholtz (1858): las líneas de vorticidad se mueven con el fluido; la intensidad de un tubo de vórtice es constante en el tiempo; y un flujo irrotacional permanece irrotacional. Por eso los flujos que arrancan del reposo son potenciales fuera de las capas límite (capítulo 17). Y también por eso, cuando un ala empieza a moverse y genera circulación \(\Gamma\) a su alrededor, debe dejar atrás un <span class="term">vórtice de arranque</span> de circulación \(-\Gamma\): un circuito grande que encierra ambos sigue teniendo circulación nula. El vórtice ligado al ala y el de arranque se conectan por los dos vórtices de punta, formando un anillo que se cierra sobre sí mismo.</p>
</section>

<section>
<h2>Vórtices modelo</h2>
<p>El <span class="term">vórtice de Rankine</span> combina un núcleo de radio \(a\) que gira como un sólido, \(v_\theta=\Gamma r/2\pi a^2\), con un vórtice irrotacional fuera, \(v_\theta=\Gamma/2\pi r\). La velocidad es máxima en el borde del núcleo, \(v_{max}=\Gamma/2\pi a\), y la presión cae hacia el centro; integrando \(\dd p/\dd r=\rho v_\theta^2/r\):</p>
<div class="eq">\[p_\infty-p_0=\rho v_{max}^2.\]</div>
<p>Un tornado con vientos de 80 m/s tiene en su centro unos 7.7 kPa menos que el ambiente: suficiente para que el aire que entra se expanda, se enfríe y condense formando el embudo visible. En un remolino de bañera la depresión se ve en la superficie libre, que baja \(v_{max}^2/g\) en el centro: un remolino con \(\Gamma=0.01\) m²/s y núcleo de 5 mm tiene un hoyuelo de 1 cm.</p>
<p>La viscosidad suaviza el núcleo. El <span class="term">vórtice de Lamb–Oseen</span> es la solución exacta de un vórtice lineal que se difunde:</p>
<div class="eq key" data-name="Vórtice de Lamb–Oseen">\[v_\theta=\frac{\Gamma}{2\pi r}\left[1-\ee^{-r^2/4\nu t}\right],\qquad\omega=\frac{\Gamma}{4\pi\nu t}\ee^{-r^2/4\nu t},\qquad r_{max}=2.242\sqrt{\nu t}.\]</div>
<p>El núcleo crece con \(\sqrt{\nu t}\) y la velocidad máxima decae como \(1/\sqrt t\), pero la circulación total se conserva. Si además hay un flujo que estira el vórtice a lo largo de su eje, la difusión y el estiramiento se equilibran en un núcleo de tamaño fijo: es el <span class="term">vórtice de Burgers</span>, un buen modelo de los filamentos de vorticidad de la turbulencia y de los tornados.</p>
<div class="sim" data-sim="lamb-oseen" data-title="Vórtices de Rankine y de Lamb–Oseen: velocidad, vorticidad y presión"></div>
<div class="sim-guide"><ul>
<li>Avance el tiempo: el núcleo del vórtice de Lamb–Oseen se ensancha y su pico de velocidad baja, mientras la circulación lejana se mantiene.</li>
<li>Las curvas de presión muestran la depresión central. Para el vórtice de Rankine vale exactamente \(\rho v_{max}^2\).</li>
</ul></div>
<div class="sim" data-sim="tornado" data-title="Remolino de bañera y tornado: la depresión del núcleo"></div>
<div class="sim-guide"><ul>
<li>En el modo «bañera» la superficie libre sigue la presión: hundimiento \(v_\theta^2/2g\) fuera del núcleo y parabólico dentro.</li>
<li>En el modo «tornado», la caída de presión y la temperatura a la que el aire que entra se enfría al expandirse (adiabáticamente) muestran por qué se forma el embudo de condensación.</li>
</ul></div>
</section>

<section>
<h2>Dinámica de vórtices puntuales</h2>
<p>En un flujo plano, la vorticidad concentrada en puntos de circulación \(\Gamma_k\) induce en el resto del fluido la velocidad de un vórtice irrotacional. Cada vórtice se mueve con la velocidad que le inducen los demás (la ley de Biot–Savart, como en magnetostática):</p>
<div class="eq">\[\odv{x_k}{t}-\ii\odv{y_k}{t}=\frac{1}{2\pi\ii}\sum_{j\ne k}\frac{\Gamma_j}{z_k-z_j}\qquad\Longleftrightarrow\qquad\dot{\vb x}_k=\sum_{j\ne k}\frac{\Gamma_j}{2\pi}\,\frac{\uv z\times(\vb x_k-\vb x_j)}{|\vb x_k-\vb x_j|^2}.\]</div>
<p>Dos vórtices de igual signo giran uno alrededor del otro; dos de signo opuesto avanzan juntos en línea recta con velocidad \(\Gamma/2\pi d\), como la sección de un anillo de humo o el par de vórtices de punta de un avión, que desciende detrás de él. Dos pares alineados juegan al «salto de rana»: el de atrás se contrae, se acelera, pasa por dentro del de adelante, y así sucesivamente, como dos anillos de humo coaxiales. El sistema conserva exactamente la energía de interacción y el impulso, cantidades que la simulación vigila.</p>
<p>Von Kármán demostró en 1911 que una calle de vórtices de dos filas escalonadas solo es estable si el cociente entre la separación de las filas \(b\) y el espaciado \(a\) vale \(b/a=\operatorname{arccosh}(\sqrt2)/\pi=0.281\); en la naturaleza las calles observadas tienen cocientes cercanos.</p>
<div class="sim" data-sim="vortices-puntuales" data-title="Vórtices puntuales: pares, salto de rana y calle de Kármán"></div>
<div class="sim-guide"><ul>
<li>Las trayectorias se integran con Runge–Kutta de cuarto orden. La lectura de la deriva relativa de los invariantes mide la precisión numérica: menos de una millonésima.</li>
<li>En la calle de Kármán, cambie \(b/a\): lejos de 0.281 la calle se desordena pronto; cerca, persiste mucho más (la estabilidad es neutra y la amplificación de errores, mínima).</li>
</ul></div>
<p>Un <b>anillo de vórtice</b> de radio \(R\) y núcleo \(a\) avanza por su propia inducción con la velocidad que calculó Kelvin, \(U=\frac{\Gamma}{4\pi R}\left[\ln\frac{8R}{a}-\frac14\right]\). Un anillo de humo de 5 cm de radio, núcleo de 5 mm y \(\Gamma=0.05\) m²/s avanza a 33 cm/s. Los delfines juegan con anillos de burbujas, y el corazón expulsa la sangre en el ventrículo formando un anillo de vórtice.</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un vórtice de Rankine tiene un núcleo de 50 m y vientos máximos de 60 m/s. Halle la circulación y la caída de presión en el centro.
<details><summary>Respuesta</summary><p>\(\Gamma=2\pi av_{max}=1.88\times10^{4}\) m²/s; \(\Delta p=\rho v_{max}^2=1.2\times3600=4.3\) kPa.</p></details></li>
<li><span class="lvl">Básico</span>¿Con qué velocidad baja el par de vórtices de punta de un avión con \(\Gamma=500\) m²/s y separación de 50 m?
<details><summary>Respuesta</summary><p>\(V=\Gamma/2\pi d=500/(2\pi\times50)=1.6\) m/s.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Cuánto tarda en duplicarse el radio del núcleo de un vórtice de Lamb–Oseen en agua si hoy mide 1 cm? ¿Y en aire?
<details><summary>Respuesta</summary><p>\(r_{max}=2.242\sqrt{\nu t}\): \(t=(r/2.242)^2/\nu\). Para 1 cm, \(t_1=19.9\) s en agua; para 2 cm, \(t_2=79.6\) s: tarda 60 s más. En aire (\(\nu=1.5\times10^{-5}\)), 4 s.</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que dos vórtices de igual circulación separados \(d\) giran alrededor de su punto medio con periodo \(T=2\pi^2d^2/\Gamma\).
<details><summary>Respuesta</summary><p>Cada uno se mueve con \(\Gamma/2\pi d\) sobre un círculo de radio \(d/2\): \(T=\pi d/(\Gamma/2\pi d)=2\pi^2d^2/\Gamma\).</p></details></li>
<li><span class="lvl">Avanzado</span>Una patinadora gira a 1 vuelta por segundo con los brazos extendidos. Relacione el aumento de su velocidad al recogerlos con el estiramiento de un tubo de vórtice cuyo radio se reduce a la mitad.
<details><summary>Respuesta</summary><p>La circulación \(\Gamma=\omega\pi r^2\) se conserva (Kelvin): al reducir el radio a la mitad, \(\omega\) se multiplica por 4. La patinadora conserva su momento angular \(I\Omega\); si su momento de inercia baja a un cuarto, también gira 4 veces más rápido. En ambos casos la energía de rotación aumenta a costa del trabajo de estiramiento.</p></details></li>
</ol>
