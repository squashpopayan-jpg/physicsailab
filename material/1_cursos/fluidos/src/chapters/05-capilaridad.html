<template class="chapter-src" data-id="capilaridad" data-num="5" data-title="Tensión superficial y capilaridad" data-part="Parte I · Fluidos en reposo" data-short="El origen molecular de la tensión superficial, la ecuación de Young–Laplace, burbujas que se vacían, el ángulo de contacto y el mojado, la ley de Jurin, la longitud capilar, meniscos y la forma de las gotas sésiles">
<p class="lead">Una gota de rocío es redonda, un insecto camina sobre el agua, el café sube por un terrón de azúcar y una burbuja de jabón pequeña se vacía en una grande. Todo se debe a que crear superficie cuesta energía. En las escalas de milímetros y menores, esa energía compite con la gravedad y la vence; este capítulo explica cómo.</p>

<section>
<h2>Energía de superficie</h2>
<p>Una molécula en el interior de un líquido está rodeada de vecinas que la atraen en todas direcciones. Una molécula en la superficie tiene vecinas solo de un lado y le falta parte de esa energía de cohesión: llevar moléculas del interior a la superficie cuesta trabajo. La <span class="term">tensión superficial</span> \(\gamma\) es ese trabajo por unidad de área nueva, o de manera equivalente, la fuerza por unidad de longitud que la superficie ejerce sobre cualquier línea trazada en ella:</p>
<div class="eq key" data-name="Tensión superficial">\[\gamma=\left(\pdv{G}{A}\right)_{T,p}\quad[\mathrm{J/m^2}=\mathrm{N/m}].\]</div>
<p>Un marco de alambre con una película de jabón y un lado deslizante de longitud \(L\) se cierra con una fuerza \(2\gamma L\): la película tiene dos caras. Con \(\gamma=0.025\) N/m y \(L=10\) cm la fuerza es de 5 mN. El agua tiene una tensión superficial alta, 72.7 mN/m a 20 °C, por sus puentes de hidrógeno; el mercurio, 485 mN/m, por su enlace metálico; el etanol, 22.4 mN/m. La tensión superficial disminuye con la temperatura y se anula en el punto crítico; para el agua, la IAPWS recomienda</p>
<div class="eq">\[\gamma=0.2358\,\tau^{1.256}(1-0.625\,\tau)\un{N/m},\qquad \tau=1-\frac{T}{647.096\un{K}},\]</div>
<p>que da 75.65 mN/m a 0.01 °C y 58.91 mN/m a 100 °C. Los <span class="term">tensoactivos</span> (jabones, detergentes) se concentran en la superficie y bajan \(\gamma\) a 25–35 mN/m: por eso el agua jabonosa moja mejor y forma burbujas estables.</p>
</section>

<section>
<h2>La ecuación de Young–Laplace</h2>
<p>Una superficie curva ejerce una fuerza neta hacia su centro de curvatura, y en equilibrio la presión del lado cóncavo debe ser mayor. Para una superficie con radios de curvatura principales \(R_1\) y \(R_2\),</p>
<div class="eq key" data-name="Ecuación de Young–Laplace">\[\Delta p=\gamma\left(\frac{1}{R_1}+\frac{1}{R_2}\right).\]</div>
<p>Una gota esférica de radio \(R\) tiene \(\Delta p=2\gamma/R\): una gota de agua de 1 µm de diámetro soporta 291 kPa de sobrepresión, casi tres atmósferas, y por eso las gotas muy pequeñas se evaporan más rápido (ecuación de Kelvin). Una burbuja de jabón tiene dos superficies y \(\Delta p=4\gamma/R\): una de 5 cm de radio tiene apenas 2 Pa por encima de la atmósfera.</p>
<p>Una consecuencia sorprendente: si se conectan dos burbujas de jabón de distinto tamaño, la pequeña, con mayor presión, se vacía en la grande. Pero no desaparece: cuando queda como un casquete menor que una semiesfera sobre el tubo, su radio de curvatura vuelve a crecer y el proceso se detiene cuando ambos casquetes tienen la misma curvatura.</p>
<div class="sim" data-sim="burbujas" data-title="Dos burbujas de jabón conectadas: la pequeña se vacía en la grande"></div>
<div class="sim-guide"><ul>
<li>Las burbujas son casquetes esféricos sobre anillos de 1 cm de radio unidos por un tubo; el aire fluye por el tubo según la ley de Poiseuille.</li>
<li>La gráfica de la derecha muestra la sobrepresión \(4\gamma/R\) contra el volumen: tiene un máximo en la semiesfera. A la derecha del máximo, una burbuja que pierde aire aumenta su presión y sigue perdiéndolo: es la inestabilidad.</li>
</ul></div>
</section>

<section>
<h2>Mojado y ángulo de contacto</h2>
<p>Donde se encuentran un líquido, un sólido y un gas, la línea de contacto está en equilibrio entre tres tensiones. La componente horizontal del balance es la <span class="term">ecuación de Young</span> (1805):</p>
<div class="eq key" data-name="Ecuación de Young">\[\gamma_{SG}=\gamma_{SL}+\gamma\cos\theta.\]</div>
<p>El <span class="term">ángulo de contacto</span> \(\theta\) mide la afinidad del líquido por el sólido. Con \(\theta&lt;90°\) el líquido moja la superficie (agua sobre vidrio limpio, casi 0°); con \(\theta&gt;90°\) no la moja (agua sobre teflón, unos 110°; mercurio sobre vidrio, unos 140°). Las hojas de loto y algunos tratamientos textiles combinan química hidrófoba con rugosidad microscópica: la gota se apoya sobre crestas con aire atrapado y el ángulo aparente supera 150°. Las gotas ruedan y arrastran el polvo: es el <span class="term">efecto loto</span>.</p>
</section>

<section>
<h2>Capilaridad y la longitud capilar</h2>
<p>En un tubo de radio \(r\), el menisco de un líquido que moja es un casquete cóncavo de radio \(r/\cos\theta\). La presión bajo el menisco es menor que la atmosférica en \(2\gamma\cos\theta/r\), y el líquido sube hasta que la columna compensa esa diferencia:</p>
<div class="eq key" data-name="Ley de Jurin">\[h=\frac{2\gamma\cos\theta}{\rho gr}.\]</div>
<p>En un tubo de vidrio de 1 mm de diámetro el agua sube 29.7 mm; el mercurio, con \(\theta=140°\), baja 11.2 mm. En los vasos del xilema de un árbol, con radios de unos 20 µm, la capilaridad levanta apenas 74 cm: el agua llega a la copa de un árbol de 100 m por otro mecanismo, la tensión que crea la evaporación en las hojas sobre columnas de agua cohesionadas.</p>
<div class="sim" data-sim="jurin" data-title="Ascenso y descenso capilar: la ley de Jurin"></div>
<div class="sim-guide"><ul>
<li>La altura es inversamente proporcional al radio del tubo. Con \(\theta&gt;90°\) el menisco es convexo y el líquido desciende.</li>
<li>El agua jabonosa sube menos: su tensión superficial es un tercio de la del agua pura.</li>
</ul></div>
<p>La comparación entre capilaridad y gravedad define una escala natural, la <span class="term">longitud capilar</span>, y un número adimensional, el <span class="term">número de Bond</span>:</p>
<div class="eq">\[\ell_c=\sqrt{\frac{\gamma}{\rho g}},\qquad \mathrm{Bo}=\frac{\rho gL^2}{\gamma}=\left(\frac{L}{\ell_c}\right)^2.\]</div>
<p>Para el agua, \(\ell_c=2.73\) mm. Los objetos y gotas más pequeños que \(\ell_c\) obedecen a la tensión superficial; los más grandes, a la gravedad. Junto a una pared vertical el agua forma un menisco que se extiende unos \(\ell_c\) y sube, con ángulo de contacto \(\theta\),</p>
<div class="eq">\[h=\ell_c\sqrt{2(1-\sin\theta)},\]</div>
<p>3.85 mm sobre vidrio limpio. El perfil exacto, solución de la ecuación de Young–Laplace en dos dimensiones, es \(x/\ell_c=\operatorname{arccosh}(2\ell_c/z)-\sqrt{4-z^2/\ell_c^2}+C\).</p>
<div class="sim" data-sim="menisco-pared" data-title="Menisco junto a una pared vertical: perfil exacto"></div>
<div class="sim-guide"><ul>
<li>El perfil exacto decae como \(\ee^{-x/\ell_c}\) lejos de la pared (línea discontinua): la longitud capilar fija el alcance del menisco.</li>
<li>Con \(\theta=90°\) no hay menisco; con \(\theta&gt;90°\) el líquido baja junto a la pared.</li>
</ul></div>
</section>

<section>
<h2>Gotas sésiles y charcos</h2>
<p>Una gota apoyada sobre una superficie horizontal toma la forma que minimiza su energía de superficie más su energía potencial. En coordenadas de longitud de arco, con \(\phi\) el ángulo de la tangente, \(z\) medida hacia abajo desde el ápice y longitudes en unidades de \(\ell_c\), la ecuación de Young–Laplace es</p>
<div class="eq">\[\odv{\phi}{s}=\frac{2}{b}+z-\frac{\sin\phi}{x},\qquad \odv{x}{s}=\cos\phi,\qquad \odv{z}{s}=\sin\phi,\]</div>
<p>donde \(b\) es el radio de curvatura en el ápice. Se integra desde el ápice hasta que \(\phi\) alcanza el ángulo de contacto. Las gotas pequeñas (\(\mathrm{Bo}\ll1\)) son casquetes esféricos; las grandes se aplastan en charcos cuya altura tiende a</p>
<div class="eq">\[h_\infty=2\ell_c\sin\frac{\theta}{2}.\]</div>
<p>Para gotas de pocos milímetros de radio la curvatura del borde aumenta la altura algunos por ciento por encima de \(h_\infty\); la diferencia decrece lentamente, como \(\ell_c/R\). Un charco de agua sobre teflón (\(\theta\approx110°\)) mide unos 4.5 mm de alto; uno de mercurio sobre vidrio, unos 3.6 mm.</p>
<div class="sim" data-sim="gota-sesil" data-title="Forma de una gota sésil: de casquete esférico a charco"></div>
<div class="sim-guide"><ul>
<li>El perfil se obtiene integrando la ecuación de Young–Laplace con Runge–Kutta y ajustando \(b\) para el volumen pedido. La línea discontinua es el casquete esférico con el mismo volumen y ángulo.</li>
<li>Aumente el volumen: la gota se aparta del casquete cuando su radio se acerca a la longitud capilar, y su altura se estanca.</li>
</ul></div>
</section>

<section>
<h2>La tensión superficial en acción</h2>
<p>Un zapatero de agua (<i>Gerris</i>) se sostiene sobre la superficie porque sus patas, cubiertas de pelos hidrófobos, deforman la superficie sin romperla; la fuerza máxima que puede aportar la tensión superficial es del orden de \(\gamma\) por la longitud de contacto, varias veces su peso. Cuando la tensión superficial varía de un punto a otro aparecen flujos de <span class="term">Marangoni</span>, del lado de baja tensión hacia el de alta: las «lágrimas» del vino que suben por la copa, el barco de jabón que se impulsa solo y los patrones de secado de una gota de café. Las impresoras de inyección, la pulverización de combustible y la ruptura de un chorro en gotas (capítulo 23) son problemas de tensión superficial.</p>
<div class="box ex"><h4>¿Por qué el agua forma gotas en el grifo?</h4><p>Una gota cuelga de la boca de un grifo de radio \(r\) mientras la tensión superficial en el perímetro sostiene su peso: \(mg\lesssim2\pi r\gamma\) (ley de Tate). Con \(r=4\) mm el límite es \(2\pi\times0.004\times0.0727=1.83\) mN, unos 0.19 g. En la práctica cae un poco menos, porque parte del líquido queda colgando; el factor de corrección de Harkins y Brown se usa para medir \(\gamma\) pesando gotas.</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Cuánto sube el agua a 20 °C en un capilar de vidrio de 0.2 mm de diámetro?
<details><summary>Respuesta</summary><p>\(h=2(0.0727)/(998.2\times9.807\times10^{-4})=0.149\) m = 14.9 cm.</p></details></li>
<li><span class="lvl">Básico</span>Halle la sobrepresión dentro de una gota de lluvia de 2 mm de diámetro.
<details><summary>Respuesta</summary><p>\(2\gamma/R=2(0.0727)/0.001=145\) Pa.</p></details></li>
<li><span class="lvl">Intermedio</span>Calcule la longitud capilar del mercurio y la altura de un charco de mercurio sobre vidrio (\(\theta=140°\)).
<details><summary>Respuesta</summary><p>\(\ell_c=\sqrt{0.485/(13\,546\times9.807)}=1.91\) mm; \(h_\infty=2\ell_c\sin70°=3.59\) mm.</p></details></li>
<li><span class="lvl">Intermedio</span>Dos placas de vidrio paralelas separadas 0.5 mm se sumergen verticalmente en agua. ¿Cuánto sube el agua entre ellas?
<details><summary>Respuesta</summary><p>El menisco es cilíndrico, con un solo radio de curvatura \(d/2\): \(h=2\gamma\cos\theta/(\rho gd)=2(0.0727)/(998.2\times9.807\times5\times10^{-4})=29.7\) mm, la mitad que en un tubo de diámetro \(d\).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que, para una gota sésil, el balance vertical de fuerzas da \((2\gamma/b+\rho gH)\pi R^2=\rho gV+2\pi R\gamma\sin\theta\), donde \(R\) es el radio de la base y \(H\) la altura.
<details><summary>Respuesta</summary><p>Sobre la gota actúan su peso \(\rho gV\), la tensión superficial en la línea de contacto, \(2\pi R\gamma\) dirigida a lo largo de la superficie con componente vertical \(\gamma\sin\theta\) hacia abajo, y la reacción del sólido, igual a la presión manométrica del líquido en la base, \(2\gamma/b+\rho gH\), por el área \(\pi R^2\). La simulación de la sección 5.5 cumple esta identidad con error relativo menor que \(10^{-6}\).</p></details></li>
</ol>
