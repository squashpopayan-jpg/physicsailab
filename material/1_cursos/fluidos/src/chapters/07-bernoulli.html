<template class="chapter-src" data-id="bernoulli" data-num="7" data-title="La ecuación de Bernoulli" data-part="Parte II · Leyes de conservación" data-short="La ecuación de Euler a lo largo de una línea de corriente, presiones estática, dinámica y de estancamiento, el tubo de Pitot, Torricelli y el vaciado de tanques, medidores Venturi y de orificio, el sifón y la presión en flujos curvos">
<p class="lead">La ecuación de Bernoulli es la segunda ley de Newton aplicada a una partícula de fluido sin fricción que se mueve a lo largo de una línea de corriente. Relaciona presión, velocidad y altura con una sencillez que la hace, a la vez, la herramienta más útil y la más mal usada de la mecánica de fluidos. Este capítulo la deduce, la aplica a medidores, tanques y sifones, y marca con cuidado sus límites.</p>

<section>
<h2>Deducción a lo largo de una línea de corriente</h2>
<p>Tome una partícula de fluido con forma de cilindro pequeño orientado a lo largo de una línea de corriente, de longitud \(\dd s\) y sección \(\dd A\). Si no hay viscosidad, sobre ella actúan la diferencia de presión entre sus extremos y la componente de su peso a lo largo de \(s\). La segunda ley de Newton en esa dirección es la <span class="term">ecuación de Euler</span>:</p>
<div class="eq">\[\rho\left(\pdv{V}{t}+V\pdv{V}{s}\right)=-\pdv{p}{s}-\rho g\pdv{z}{s}.\]</div>
<p>Para flujo estacionario y densidad constante, \(V\,\partial V/\partial s=\partial(V^2/2)/\partial s\) y todos los términos son derivadas de algo: se integra a lo largo de la línea.</p>
<div class="eq key" data-name="Ecuación de Bernoulli">\[p+\tfrac12\rho V^2+\rho gz=\text{cte a lo largo de una línea de corriente}.\]</div>
<p>Dividiendo por \(\rho g\) cada término es una altura o <span class="term">carga</span>: la carga de presión \(p/\rho g\), la carga de velocidad \(V^2/2g\) y la elevación \(z\). Su suma es la carga total \(H\), constante si no hay fricción ni máquinas. Las cuatro hipótesis son esenciales: flujo <b>estacionario</b>, <b>incompresible</b>, <b>sin fricción</b> y <b>a lo largo de una línea de corriente</b>. Si además el flujo es irrotacional, la constante es la misma para todas las líneas (capítulo 17).</p>
<div class="box warn"><h4>Cuándo no usar Bernoulli</h4><p>No vale a través de bombas, turbinas o ventiladores, que añaden o quitan energía; ni en regiones con fricción importante, como capas límite, tuberías largas o estelas; ni a través de un resalto hidráulico o un choque. Tampoco para gases a velocidades mayores de un tercio de la del sonido sin la corrección compresible del capítulo 21.</p></div>
</section>

<section>
<h2>Presiones estática, dinámica y de estancamiento: el tubo de Pitot</h2>
<p>En un punto donde un obstáculo detiene el flujo (\(V=0\)), la presión sube a la <span class="term">presión de estancamiento</span>:</p>
<div class="eq">\[p_0=p+\tfrac12\rho V^2.\]</div>
<p>\(p\) es la presión <b>estática</b>, la que mediría un sensor que viaja con el fluido, y \(\tfrac12\rho V^2\) la presión <b>dinámica</b>. Un viento de 30 m/s (108 km/h) ejerce sobre una pared una presión dinámica de 551 Pa al nivel del mar y de 439 Pa en Popayán, donde el aire es 20 % menos denso. El <span class="term">tubo de Pitot estático</span> mide a la vez la presión de estancamiento en su punta y la estática en orificios laterales; su diferencia da la velocidad:</p>
<div class="eq key" data-name="Tubo de Pitot">\[V=\sqrt{\frac{2(p_0-p)}{\rho}}.\]</div>
<p>Los aviones lo usan como velocímetro. Como el instrumento se calibra con la densidad del nivel del mar, en altura marca una <span class="term">velocidad indicada</span> menor que la verdadera: con la misma lectura de 600 Pa, un avión al nivel del mar va a 31.3 m/s y uno en la pista de Popayán, a 35.1 m/s. Por eso los aviones necesitan pistas más largas en los aeropuertos altos.</p>
<div class="sim" data-sim="pitot" data-title="Tubo de Pitot: velocidad indicada y verdadera en altura"></div>
<div class="sim-guide"><ul>
<li>Fije la velocidad verdadera y suba la altitud: la presión dinámica que mide el Pitot cae con la densidad y el indicador, calibrado al nivel del mar, marca menos.</li>
<li>A velocidades altas, la fórmula incompresible subestima la presión de estancamiento: a Mach 0.5 el error de \(\tfrac12\rho V^2\) ya es del 6 %.</li>
</ul></div>
</section>

<section>
<h2>Torricelli y el vaciado de tanques</h2>
<p>Entre la superficie de un tanque grande y un chorro que sale por un orificio a una profundidad \(h\), ambos a presión atmosférica y con velocidad despreciable en la superficie, Bernoulli da la <span class="term">ley de Torricelli</span> (1643):</p>
<div class="eq">\[V=\sqrt{2gh}.\]</div>
<p>Es la velocidad de caída libre desde la altura de la superficie. El caudal real es menor porque el chorro se contrae después del orificio (la <span class="term">vena contracta</span>) y hay pequeñas pérdidas: \(Q=C_da\sqrt{2gh}\), con \(C_d\approx0.61\) para un orificio de borde vivo. Combinando con la continuidad, \(A\,\dd h/\dd t=-C_da\sqrt{2gh}\), y el tiempo de vaciado de un tanque cilíndrico es</p>
<div class="eq">\[t_v=\frac{A}{C_da}\sqrt{\frac{2h_0}{g}}.\]</div>
<p>Un tanque de 1 m de diámetro con 2 m de agua se vacía por un orificio de 2 cm en 44 minutos. El nivel baja cada vez más despacio porque la presión que impulsa el chorro disminuye. Una <span class="term">clepsidra</span> (reloj de agua) bien diseñada compensa ese efecto con un recipiente cuyo radio crece como \(h^{1/4}\): así el nivel baja a ritmo constante.</p>
<div class="sim" data-sim="torricelli" data-title="Vaciado de un tanque y alcance del chorro"></div>
<div class="sim-guide"><ul>
<li>El chorro sale horizontalmente y describe una parábola; su alcance desde un orificio a la altura \(y\) sobre el suelo es \(2\sqrt{hy}\).</li>
<li>Cambie a la clepsidra: el nivel baja en línea recta con el tiempo.</li>
</ul></div>
</section>

<section>
<h2>Medidores de caudal: Venturi y orificio</h2>
<p>En un tubo de Venturi el flujo se acelera en una garganta de diámetro \(d\) y la presión cae. Con la continuidad \(V_1A_1=V_2A_2\) y Bernoulli entre la entrada y la garganta:</p>
<div class="eq key" data-name="Medidor de Venturi">\[Q=C_dA_2\sqrt{\frac{2(p_1-p_2)}{\rho(1-\beta^4)}},\qquad\beta=\frac{d}{D}.\]</div>
<p>Un Venturi bien construido tiene \(C_d\approx0.98\) y recupera casi toda la presión en su cono divergente. Una <span class="term">placa de orificio</span> es más barata y compacta, pero su chorro se separa y la energía cinética se disipa en turbulencia: \(C_d\approx0.6\) y una pérdida permanente de presión grande. Las normas ISO 5167 tabulan los coeficientes de descarga.</p>
<div class="sim" data-sim="venturi" data-title="Tubo de Venturi con tubos piezométricos"></div>
<div class="sim-guide"><ul>
<li>Los tubos piezométricos muestran la carga de presión en cada sección: baja en la garganta y se recupera en el difusor. La línea discontinua es la carga total.</li>
<li>Con agua a 20 °C, 12.6 L/s por un Venturi de 10 cm con garganta de 5 cm producen una caída de 20 kPa. Aumente el caudal: si la presión en la garganta baja hasta la de vapor, aparece cavitación.</li>
</ul></div>
</section>

<section>
<h2>El sifón</h2>
<p>Un sifón traslada líquido por encima de un obstáculo sin bomba, siempre que la salida esté por debajo de la superficie del depósito. Entre la superficie (1) y la salida (3), a una distancia \(h_3\) por debajo, \(V=\sqrt{2gh_3}\). En la cresta (2), a una altura \(h_2\) sobre la superficie,</p>
<div class="eq">\[p_2=p_{atm}-\rho gh_2-\tfrac12\rho V^2.\]</div>
<p>La presión en la cresta no puede bajar de la presión de vapor sin que el agua hierva y el sifón se corte. Aun con velocidad nula, la altura máxima de la cresta es \((p_{atm}-p_v)/\rho g\): 10.1 m al nivel del mar y solo 8.1 m en Popayán, para agua a 20 °C. Es el mismo límite que impide a una bomba aspirar agua de un pozo de más de unos 10 m de profundidad.</p>
<div class="sim" data-sim="sifon" data-title="Sifón: velocidad, presión en la cresta y cavitación"></div>
<div class="sim-guide"><ul>
<li>El color del tubo indica la presión absoluta. Suba la cresta o baje la salida: la presión en la cresta cae.</li>
<li>En Popayán el sifón se corta antes que al nivel del mar; con agua caliente, aún antes, porque su presión de vapor es mayor.</li>
</ul></div>
</section>

<section>
<h2>Presión a través de las líneas de corriente</h2>
<p>La ecuación de Euler en la dirección normal a una línea de corriente curva, con radio de curvatura \(R\), dice que la presión aumenta hacia afuera de la curva:</p>
<div class="eq">\[\pdv{p}{n}=\frac{\rho V^2}{R}+\rho g\pdv{z}{n}.\]</div>
<p>Es la fuerza centrípeta que mantiene a la partícula en su trayectoria curva. Explica por qué la presión es mínima en el centro de un remolino o de un tornado, por qué un chorro que sigue una superficie convexa la «chupa» hacia sí, y es la manera correcta de entender la sustentación de un ala: el ala curva el flujo hacia abajo, y la curvatura exige una presión menor sobre el extradós. La explicación popular de que el aire de arriba «debe recorrer más camino en el mismo tiempo» es falsa: el aire del extradós llega al borde de salida bastante antes que el del intradós.</p>
<div class="box ex"><h4>Un chorro de manguera hacia arriba</h4><p>Una manguera lanza agua verticalmente a 12 m/s. Por Bernoulli entre la boquilla y el punto más alto, ambos a presión atmosférica, \(z_{max}=V^2/2g=7.3\) m. En la realidad el chorro llega un poco más bajo, por el arrastre del aire y porque se rompe en gotas.</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿A qué velocidad sale el agua por un orificio situado 5 m por debajo de la superficie de un tanque? ¿Qué caudal da un orificio de 3 cm con \(C_d=0.61\)?
<details><summary>Respuesta</summary><p>\(V=\sqrt{2\times9.807\times5}=9.90\) m/s; \(Q=0.61\times7.07\times10^{-4}\times9.90=4.27\) L/s.</p></details></li>
<li><span class="lvl">Básico</span>Un Pitot en una tubería de agua marca 3 cm de diferencia entre las columnas de presión total y estática. Halle la velocidad.
<details><summary>Respuesta</summary><p>\(V=\sqrt{2gh}=\sqrt{2\times9.807\times0.03}=0.767\) m/s.</p></details></li>
<li><span class="lvl">Intermedio</span>Por un Venturi de 15 cm × 7.5 cm pasa agua y un manómetro de mercurio entre la entrada y la garganta marca 20 cm. Con \(C_d=0.98\), halle el caudal.
<details><summary>Respuesta</summary><p>\(\Delta p=(13\,546-998)\times9.807\times0.20=24.6\) kPa; \(\beta=0.5\); \(Q=0.98\times4.418\times10^{-3}\sqrt{2\times24\,610/(998.2\times0.9375)}=31.4\) L/s.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Cuánto tarda en vaciarse por completo un tanque cilíndrico de 2 m de diámetro con 1.5 m de agua por un orificio de 5 cm (\(C_d=0.61\))?
<details><summary>Respuesta</summary><p>\(t=(A/C_da)\sqrt{2h_0/g}=(3.1416/(0.61\times1.963\times10^{-3}))\sqrt{3/9.807}=1451\) s ≈ 24 min.</p></details></li>
<li><span class="lvl">Avanzado</span>Un sifón de 3 cm de diámetro descarga agua a 20 °C 2 m por debajo de la superficie del depósito. ¿Cuál es la máxima altura de la cresta sobre la superficie antes de que cavite, al nivel del mar y en Popayán?
<details><summary>Respuesta</summary><p>\(V^2/2=g\times2\). La condición \(p_2=p_v\) da \(h_2=(p_{atm}-p_v)/\rho g-2\): 8.11 m al nivel del mar y 6.13 m en Popayán.</p></details></li>
</ol>
