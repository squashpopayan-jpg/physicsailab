<template class="chapter-src" data-id="inestabilidades" data-num="23" data-title="Inestabilidades y convección" data-part="Parte VII · Fronteras" data-short="Análisis lineal de estabilidad, la inestabilidad de Rayleigh–Taylor, la de Kelvin–Helmholtz y el enrollamiento de una lámina de vórtices, la ruptura de un chorro en gotas (Plateau–Rayleigh), la convección de Rayleigh–Bénard y el caos del modelo de Lorenz">
<p class="lead">Muchos flujos que las ecuaciones permiten nunca se ven, porque son inestables: la menor perturbación crece y los transforma. El agua de un vaso invertido cae aunque la presión atmosférica podría sostenerla; el chorro del grifo se rompe en gotas; el viento riza el mar; una capa de aceite calentada desde abajo se organiza en celdas hexagonales. La teoría de la estabilidad hidrodinámica explica cuándo y cómo ocurre, y abre la puerta al caos y la turbulencia.</p>

<section>
<h2>Análisis lineal de estabilidad</h2>
<p>Se parte de una solución básica (un fluido en reposo, una interfaz plana, un chorro cilíndrico) y se le suma una perturbación pequeña. Linealizando las ecuaciones, cada perturbación se descompone en modos de Fourier \(\propto\ee^{\sigma t+\ii kx}\). La <span class="term">relación de dispersión</span> \(\sigma(k)\) decide: si para algún \(k\) la parte real de \(\sigma\) es positiva, ese modo crece exponencialmente y el flujo básico es inestable. El modo de crecimiento máximo suele ser el que se observa, y fija la escala del patrón resultante.</p>
</section>

<section>
<h2>La inestabilidad de Rayleigh–Taylor</h2>
<p>Un fluido pesado de densidad \(\rho_2\) sobre uno liviano \(\rho_1\), en un campo gravitatorio, está en equilibrio pero es inestable. Para una interfaz con tensión superficial \(\gamma\), la teoría de flujo potencial de cada lado da</p>
<div class="eq key" data-name="Inestabilidad de Rayleigh–Taylor">\[\sigma^2=\frac{(\rho_2-\rho_1)gk-\gamma k^3}{\rho_1+\rho_2}.\]</div>
<p>Las ondas largas crecen, y la tensión superficial estabiliza las cortas, con \(\lambda&lt;\lambda_c=2\pi\sqrt{\gamma/g\Delta\rho}\). Para agua sobre aire, \(\lambda_c=17\) mm. Por eso un vaso de agua invertido se vacía, pero un tubo de menos de un centímetro de diámetro lleno de agua no gotea al invertirlo, y una malla fina sobre la boca de una botella invertida retiene el agua. La misma inestabilidad, sin tensión superficial, forma los dedos de los restos de supernovas y amenaza la compresión de las cápsulas de fusión por láser.</p>
<div class="sim" data-sim="rayleigh-taylor" data-title="Rayleigh–Taylor: tasa de crecimiento y longitud de onda de corte"></div>
<div class="sim-guide"><ul>
<li>La curva \(\sigma(k)\) se anula en \(k_c\): las perturbaciones más cortas oscilan como ondas capilares en vez de crecer.</li>
<li>La interfaz dibujada crece con el modo más rápido; cambie el par de fluidos y la longitud de onda dominante.</li>
</ul></div>
</section>

<section>
<h2>La inestabilidad de Kelvin–Helmholtz</h2>
<p>Dos capas de fluido que se deslizan una sobre otra con velocidades \(U_1\) y \(U_2\) forman una lámina de vorticidad. Sin gravedad ni tensión superficial es inestable para todas las longitudes de onda, con \(\sigma=\tfrac12k|U_1-U_2|\) cuando las densidades son iguales. Con un fluido denso abajo, la gravedad y la tensión superficial estabilizan; para aire sobre agua,</p>
<div class="eq">\[\sigma^2=\frac{\rho_1\rho_2k^2(U_1-U_2)^2}{(\rho_1+\rho_2)^2}-\frac{gk(\rho_1-\rho_2)+\gamma k^3}{\rho_1+\rho_2},\]</div>
<p>y la teoría predice que el viento solo levanta ondas por encima de 6.7 m/s. En realidad aparecen ondas con vientos menores, por mecanismos de resonancia y por el perfil de velocidad de la capa límite del aire (Phillips, Miles). La lámina inestable se enrolla en una hilera de remolinos: las nubes <i>fluctus</i>, las bandas de Saturno y Júpiter y las ondulaciones del humo de un cigarrillo.</p>
<div class="sim" data-sim="kelvin-helmholtz" data-title="Enrollamiento de una lámina de vórtices (Kelvin–Helmholtz)"></div>
<div class="sim-guide"><ul>
<li>La lámina se representa con 160 vórtices puntuales periódicos con el suavizado de Krasny (1986). Una perturbación sinusoidal pequeña crece y se enrolla en espirales.</li>
<li>Aumente el número de longitudes de onda iniciales: cada una produce un remolino; con el tiempo, los remolinos vecinos tienden a fusionarse.</li>
</ul></div>
</section>

<section>
<h2>La ruptura de un chorro en gotas</h2>
<p>Un cilindro de líquido tiene más superficie que un collar de gotas del mismo volumen, y la tensión superficial lo rompe: es la <span class="term">inestabilidad de Plateau–Rayleigh</span>. Plateau (1873) observó que solo crecen las perturbaciones con longitud de onda mayor que el perímetro del chorro, \(\lambda&gt;2\pi R\). Rayleigh (1878) calculó la tasa de crecimiento para un chorro sin viscosidad:</p>
<div class="eq key" data-name="Inestabilidad de Plateau–Rayleigh">\[\sigma^2=\frac{\gamma}{\rho R^3}\,x\frac{I_1(x)}{I_0(x)}(1-x^2),\qquad x=kR,\]</div>
<p>con \(I_0\) e \(I_1\) las funciones de Bessel modificadas. El máximo ocurre en \(x=0.697\), \(\lambda=9.02R\), y produce gotas de diámetro \(3.78R\). Un chorro de agua de 2 mm de diámetro crece con \(\sigma_{max}=93\) s⁻¹: se rompe en unas pocas décimas de segundo. Las impresoras de inyección, la pulverización de combustible y la fabricación de cápsulas usan esta inestabilidad, excitándola a la frecuencia adecuada para obtener gotas uniformes.</p>
<div class="sim" data-sim="plateau-rayleigh" data-title="Un chorro se rompe en gotas: Plateau–Rayleigh"></div>
<div class="sim-guide"><ul>
<li>La tasa de crecimiento se calcula con las funciones de Bessel \(I_0\) e \(I_1\). Elija la longitud de onda de la perturbación: con \(\lambda&lt;2\pi R\) el chorro es estable.</li>
<li>La animación muestra el crecimiento lineal hasta la ruptura; el tamaño de las gotas sale de conservar el volumen de cada longitud de onda.</li>
</ul></div>
</section>

<section>
<h2>Convección de Rayleigh–Bénard</h2>
<p>Una capa de fluido de espesor \(d\) calentada desde abajo tiene el fluido caliente, menos denso, debajo del frío: una situación de tipo Rayleigh–Taylor, pero la viscosidad y la difusión del calor la estabilizan. Con la aproximación de Boussinesq, el parámetro de control es el <span class="term">número de Rayleigh</span></p>
<div class="eq key" data-name="Número de Rayleigh">\[\mathrm{Ra}=\frac{g\beta\Delta Td^3}{\nu\kappa},\]</div>
<p>cociente entre el empuje y la disipación por viscosidad y por conducción térmica. Rayleigh (1916) mostró que la conducción pura se vuelve inestable por encima de un valor crítico. Para fronteras libres el problema tiene solución analítica, \(\mathrm{Ra}(k)=(k^2+\pi^2)^3/k^2\), con mínimo \(27\pi^4/4=657.5\); para paredes rígidas hay que resolver numéricamente un problema de valores propios de sexto orden, y el resultado es \(\mathrm{Ra}_c=1707.76\) con \(k_c=3.117\): rollos de ancho casi igual al espesor de la capa. Con agua a 20 °C en una capa de 5 mm basta una diferencia de temperatura de 1 K; con aire en 1 cm, de 16 K.</p>
<div class="sim" data-sim="rayleigh-benard" data-title="Convección de Rayleigh–Bénard: curvas neutras y rollos"></div>
<div class="sim-guide"><ul>
<li>La curva de fronteras rígidas se calcula aquí mismo por disparo: se integra la ecuación de sexto orden y se busca el Ra que anula el determinante de las condiciones de frontera. El mínimo reproduce 1707.76.</li>
<li>Elija el fluido, el espesor y la diferencia de temperatura: si Ra supera el valor crítico aparecen los rollos, cuyo esquema muestra las líneas de corriente del modo crítico.</li>
</ul></div>
</section>

<section>
<h2>Del orden al caos: el modelo de Lorenz</h2>
<p>En 1963 el meteorólogo Edward Lorenz redujo las ecuaciones de la convección a tres modos de Fourier y obtuvo un sistema de tres ecuaciones diferenciales,</p>
<div class="eq">\[\dot x=\sigma(y-x),\qquad\dot y=x(r-z)-y,\qquad\dot z=xy-bz,\]</div>
<p>donde \(x\) mide la intensidad de la circulación, \(y\) y \(z\) la distribución de temperatura, y \(r=\mathrm{Ra}/\mathrm{Ra}_c\). Con \(r&lt;1\) el fluido está quieto; entre 1 y 24.74, convección estacionaria; más allá, con los valores de Lorenz (\(\sigma=10\), \(b=8/3\), \(r=28\)), la solución nunca se repite y dibuja un <span class="term">atractor extraño</span> con forma de alas de mariposa. Dos estados iniciales que difieren en una millonésima se separan exponencialmente: la sensibilidad a las condiciones iniciales que limita la predicción del tiempo atmosférico a unas dos semanas.</p>
<div class="sim" data-sim="lorenz" data-title="El atractor de Lorenz y la sensibilidad a las condiciones iniciales"></div>
<div class="sim-guide"><ul>
<li>Dos trayectorias que empiezan separadas \(10^{-6}\) se integran con Runge–Kutta. La gráfica inferior muestra cómo crece su distancia: en escala logarítmica, una recta cuya pendiente es el exponente de Lyapunov (≈ 0.9).</li>
<li>Baje \(r\) por debajo de 24.74: las trayectorias caen a uno de los dos puntos fijos de convección estacionaria.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Cuál es el diámetro máximo de un tubo que, lleno de agua e invertido, no se vacía?
<details><summary>Respuesta</summary><p>Aproximadamente \(\lambda_c/2\), del orden de 1 cm. Una estimación más precisa para un tubo circular da que la interfaz se mantiene si el radio es menor que unas 1.84 longitudes capilares, 5 mm.</p></details></li>
<li><span class="lvl">Básico</span>¿Cuántas gotas por segundo produce un chorro de agua de 1 mm de radio que sale a 2 m/s, si se rompe con la longitud de onda óptima?
<details><summary>Respuesta</summary><p>\(\lambda=9.02\) mm; \(f=V/\lambda=222\) gotas por segundo, de 3.8 mm de diámetro.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Convecciona una capa de agua de 2 cm calentada 0.1 K desde abajo?
<details><summary>Respuesta</summary><p>\(\mathrm{Ra}=1.41\times10^{10}\times0.1\times(0.02)^3=1.13\times10^{4}&gt;1708\): sí. El \(\Delta T\) crítico es 0.015 K.</p></details></li>
<li><span class="lvl">Intermedio</span>Para la inestabilidad de Rayleigh–Taylor sin tensión superficial, ¿cuánto tarda en multiplicarse por \(\ee\) una perturbación de 1 m de longitud de onda en una interfaz agua–aire?
<details><summary>Respuesta</summary><p>\(\sigma=\sqrt{Agk}\) con \(A\approx1\): \(\sqrt{9.81\times6.28}=7.85\) s⁻¹; \(1/\sigma=0.13\) s.</p></details></li>
<li><span class="lvl">Avanzado</span>Para fronteras libres, minimice \(\mathrm{Ra}(k)=(k^2+\pi^2)^3/k^2\) y halle \(k_c\) y \(\mathrm{Ra}_c\).
<details><summary>Respuesta</summary><p>Con \(u=k^2\): \(\dd/\dd u[(u+\pi^2)^3/u]=0\) → \(3u=u+\pi^2\) → \(u=\pi^2/2\), \(k_c=\pi/\sqrt2=2.221\), \(\mathrm{Ra}_c=(3\pi^2/2)^3/(\pi^2/2)=27\pi^4/4=657.5\).</p></details></li>
</ol>
