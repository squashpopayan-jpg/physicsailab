    <h1 class="home-title">Circuitos Vivos<span>Arduino y ESP32 para el colegio</span></h1>
    <p class="home-lead">Un curso para aprender electrónica haciendo, desde la primera pregunta («¿qué es esa pieza?») hasta proyectos completos con sensores, pantallas y WiFi. Cada circuito se arma sobre una <b>protoboard virtual</b> y se resuelve con un simulador de verdad: se puede medir con el multímetro, ver la corriente en cada cable, cargar un programa de Arduino y observar qué pasa cuando algo falla, porque también se simulan los cortocircuitos, los LED quemados, los cables sueltos y los errores típicos de principiante.</p>

<div class="home-howto">
  <div><b>De conocer las piezas a construir proyectos</b><p>Seis partes: los elementos (electricidad, componentes, protoboard, multímetro y fallos), las placas Arduino y ESP32 con su programación, sensores y actuadores, la comunicación entre módulos y, al final, proyectos de física y de aplicaciones con el paso a paso.</p></div>
  <div><b>Fallos a propósito</b><p>Un LED al revés, una resistencia de menos, un cable de tierra suelto, un cortocircuito: se activan con una casilla, se ve el síntoma (humo, calor, corriente de más) y se localiza con el multímetro, como en un banco de trabajo real.</p></div>
  <div><b>Instrumentos virtuales</b><p>Multímetro con fusible (que también se puede quemar), osciloscopio, monitor serie, navegador del teléfono y terminal Bluetooth; todo trabajando sobre el circuito que usted arma.</p></div>
  <div><b>Programas que se ejecutan</b><p>Se escribe código de Arduino (C++) y se «sube» a una placa UNO, Nano o ESP32 virtual: parpadeos, PWM, interrupciones, sensores, pantalla LCD, servidor web. Cada número de los problemas se comprueba con un cálculo independiente.</p></div>
