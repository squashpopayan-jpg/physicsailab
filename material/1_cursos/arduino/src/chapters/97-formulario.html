<section>
<h2>Electricidad básica (capítulos 1, 4, 5, 6)</h2>
<div class="tablewrap"><table class="tbl"><tr><th>Concepto</th><th>Fórmula</th><th>Nota</th></tr>
<tr><td>Ley de Ohm (1)</td><td>\(V=IR\)</td><td>Solo para resistencias; un LED o un diodo no la cumplen.</td></tr>
<tr><td>Potencia (1)</td><td>\(P=VI=I^2R=V^2/R\)</td><td>Resistencia de ¼ W: no pasar de 0.25 W (conviene la mitad).</td></tr>
<tr><td>Resistencias en serie (5)</td><td>\(R=R_1+R_2+\dots\)</td><td>Misma corriente en todas.</td></tr>
<tr><td>Resistencias en paralelo (5)</td><td>\(1/R=1/R_1+1/R_2+\dots\)</td><td>Misma tensión; el total es menor que la menor.</td></tr>
<tr><td>Divisor de tensión (5)</td><td>\(V_\text{out}=V_\text{in}\,R_2/(R_1+R_2)\)</td><td>Con carga conectada, \(R_2\) pasa a \(R_2\parallel R_\text{carga}\).</td></tr>
<tr><td>Divisor de corriente (5)</td><td>\(I_1=I\,R_2/(R_1+R_2)\)</td><td>Dos ramas en paralelo.</td></tr>
<tr><td>Resistencia para un LED (1, 6)</td><td>\(R=(V_\text{fuente}-V_\text{LED})/I_\text{LED}\)</td><td>LED rojo ≈ 1.9–2.0 V, verde ≈ 2.1 V, azul/blanco ≈ 3 V.</td></tr>
<tr><td>Duración de una batería (1)</td><td>\(t=\text{capacidad (mAh)}/I\ \text{(mA)}\)</td><td>Teórica; en la práctica 70–80 %.</td></tr>
<tr><td>Cortocircuito de una pila (6)</td><td>\(I=V/(r_\text{int}+R_\text{cable})\)</td><td>Una pila de 9 V puede dar más de 5 A: se calienta.</td></tr></table></div>
</section>

<section>
<h2>Condensadores, diodos y transistores (capítulo 7)</h2>
<div class="tablewrap"><table class="tbl"><tr><th>Concepto</th><th>Fórmula</th></tr>
<tr><td>Constante de tiempo RC</td><td>\(\tau=RC\)</td></tr>
<tr><td>Carga y descarga</td><td>\(V=V_0\left(1-e^{-t/\tau}\right)\) (carga); \(V=V_0\,e^{-t/\tau}\) (descarga)</td></tr>
<tr><td>Energía en un condensador</td><td>\(E=\tfrac12 CV^2\)</td></tr>
<tr><td>Rizado de un rectificador con filtro</td><td>\(\Delta V\approx I/(fC)\) con \(f\) = 60 Hz (media onda) o 120 Hz (onda completa)</td></tr>
<tr><td>Transistor como interruptor</td><td>\(I_B\approx I_C/10\); \(R_B=(V_\text{señal}-0.7)/I_B\)</td></tr>
<tr><td>Regulación con Zener</td><td>\(I_R=(V_\text{in}-V_Z)/R\); \(I_Z=I_R-I_\text{carga}\)</td></tr>
<tr><td>Energía en una bobina</td><td>\(E=\tfrac12LI^2\)</td></tr></table></div>
</section>

<div class="tablewrap"><table class="tbl"><tr><th>Concepto</th><th>Fórmula o dato</th></tr>

<section>
<h2>Proyectos de física (capítulos 22–25)</h2>
<div class="tablewrap"><table class="tbl"><tr><th>Proyecto</th><th>Relación</th></tr>
<tr><td>Caída libre</td><td>\(g=2d/t^2\); \(\Delta g/g=\Delta d/d+2\,\Delta t/t\)</td></tr>
<tr><td>Péndulo simple</td><td>\(T=2\pi\sqrt{L/g}\); \(T\approx T_0(1+\theta_0^2/16)\); exacto: \(T=2\pi\sqrt{L/g}\big/\text{AGM}(1,\cos(\theta_0/2))\)</td></tr>
<tr><td>Enfriamiento de Newton</td><td>\(T=T_a+(T_0-T_a)e^{-kt}\); \(\ln(T-T_a)\) es lineal en \(t\) con pendiente \(-k\); vida media \(\ln2/k\)</td></tr>
<tr><td>Valor local de \(g\)</td><td>9.777 m/s² en Popayán (valor de trabajo; la fórmula internacional con corrección de altura de 1760 m da 9.775 m/s², diferencia del 0.02 %)</td></tr></table></div>
</section>
