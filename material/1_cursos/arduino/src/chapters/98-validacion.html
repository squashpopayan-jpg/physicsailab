<p class="lead">Las simulaciones de este curso no son dibujos animados: cada circuito se resuelve con un <b>motor de análisis nodal modificado</b> (el mismo método que usan los simuladores tipo SPICE) y cada programa de Arduino se ejecuta con un intérprete propio de un subconjunto de C/C++. Este apéndice recoge las pruebas automáticas que contrastan el motor con SciPy y NumPy, con soluciones analíticas y con datos de la literatura, y las cifras de las soluciones de los problemas con cálculos independientes.</p>
<section><h2>Qué se comprueba</h2>
<ul>
<li><b>Circuitos lineales:</b> puentes de Wheatstone desequilibrados y redes resistivas, contra la solución con <code>numpy.linalg</code>.</li>
<li><b>Transitorios:</b> carga de un condensador, circuito RLC serie y rectificador de media onda con filtro, contra las soluciones analíticas y la integración numérica de SciPy.</li>
<li><b>Elementos no lineales:</b> diodos y LED de cuatro colores a varias tensiones, regulador Zener, transistor NPN y MOSFET, contra la solución de las ecuaciones del componente con <code>scipy.optimize</code>.</li>
<li><b>Sensores y componentes:</b> NTC con la ecuación β (y su inversa) y el código de colores de las resistencias en ida y vuelta (16 casos más 5 bandas).</li>
<li><b>Programas:</b> el traductor de C a JavaScript con 411 comprobaciones: aritmética de enteros del UNO (16 bits) y del ESP32 (32 bits), desbordamientos, <code>map</code>, recursión, <code>String</code>, <code>switch</code>, ordenamiento de un arreglo, primos y Fibonacci.</li>
<li><b>Problemas:</b> cada cifra de las soluciones de los capítulos 1 a 28 se recalcula aparte con Python y se compara con la impresa (se exige que sea el redondeo correcto).</li>
</ul>
<p>Nota: el simulador ejecuta un <i>modelo</i> del hardware (por ejemplo, un LED con parámetros típicos). Un componente real puede apartarse de estos valores unos pocos por ciento: por eso el curso insiste en medir con el multímetro.</p>
