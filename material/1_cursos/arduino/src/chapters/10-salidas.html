<template class="chapter-src" data-id="salidas" data-num="10" data-title="Salidas digitales: LED, secuencias y semáforo" data-part="Parte II · Arduino y ESP32" data-short="Variables y constantes, bucles for, arreglos y funciones aplicados a varios LED: un semáforo, un efecto de luces que va y viene y el código Morse; cuánta corriente aguantan varios LED a la vez">
<p class="lead">Un solo LED ya enseñó lo básico. Con varios, el programa empieza a necesitar herramientas para no repetirse: <b>constantes</b> con nombre, <b>bucles</b> que repiten, <b>arreglos</b> que agrupan valores y <b>funciones</b> que encierran una tarea. Con ellas se arman un semáforo, un efecto de luces y una señal de socorro en código Morse.</p>

<section>
<h2>Constantes y variables</h2>
<p>En lugar de escribir «8» por todas partes, se le da un nombre al pin: <code class="k">const int ROJO = 10;</code>. Una <b>constante</b> no cambia durante el programa; si algún día el LED se mueve a otro pin, solo se corrige una línea. Una <b>variable</b> sí cambia (<code class="k">int contador = 0;</code>). Los tipos más usados: <code class="k">int</code> (entero; en el UNO va de −32768 a 32767, en el ESP32 llega a ±2 mil millones), <code class="k">long</code> (entero grande), <code class="k">float</code> (con decimales), <code class="k">bool</code> (verdadero o falso) y <code class="k">byte</code> (0 a 255).</p>
<div class="box warn"><p>En el UNO, un <code class="k">int</code> se desborda: <code class="k">int x = 32767; x = x + 1;</code> da −32768. Y <code class="k">delay(60 * 1000)</code> también falla, porque el compilador hace la cuenta con enteros de 16 bits y obtiene −5536. Para tiempos largos use <code class="k">delay(60000L)</code> o <code class="k">unsigned long</code>. En el simulador pasa exactamente igual que en la placa real.</p></div>
</section>

<section>
<h2>Un semáforo con tres LED</h2>
<p>Tres LED (rojo, amarillo y verde) con sus resistencias en los pines 10, 9 y 8. Cada fase enciende un LED durante un tiempo y lo apaga. Observe cómo las constantes y los comentarios hacen el programa legible.</p>
<div class="sim" data-sim="semaforo" data-title="Semáforo: tres LED y tres tiempos"></div>
<div class="sim-guide"><ul>
<li>Un ciclo completo dura 5 + 3 + 1 = 9 s. Con la velocidad ×5 se ve en menos de 2 s reales.</li>
<li>Mire la columna «Corriente»: solo un LED conduce a la vez, 11.6 mA; si encendiera los tres a la vez serían 35 mA en total, aún lejos de los 200 mA del chip.</li>
<li>Añada una fase: un parpadeo del amarillo de 3 veces antes de pasar a rojo, usando un bucle <code class="k">for (int i = 0; i &lt; 3; i++)</code>.</li>
</ul></div>
</section>

<section>
<h2>Bucles y arreglos: luces que van y vienen</h2>
<p>Un <b>arreglo</b> guarda varios valores bajo un nombre: <code class="k">int leds[] = {2, 3, 4, 5, 6};</code>; el primero es <code class="k">leds[0]</code> (se cuenta desde 0). El bucle <code class="k">for (int i = 0; i &lt; 5; i++) { ... }</code> repite su cuerpo con <code class="k">i</code> valiendo 0, 1, 2, 3 y 4. Combinados, recorren todos los LED con pocas líneas. El efecto «auto fantástico» enciende uno a uno y regresa.</p>
<div class="sim" data-sim="secuencia" data-title="Cinco LED: recorrido de ida y vuelta"></div>
<div class="sim-guide"><ul>
<li>El bucle de ida recorre i = 0…4; el de vuelta, i = 3…1 (para no repetir los extremos). Un ciclo completo dura 8 pasos × 100 ms = 800 ms.</li>
<li>Cambie <code class="k">delay(100)</code> a <code class="k">delay(40)</code> para un efecto veloz. Cambie el arreglo <code class="k">{2,3,4,5,6}</code> por <code class="k">{6,4,2,3,5}</code> y vea cómo cambia el orden sin tocar el resto.</li>
<li>Para agregar un LED solo hay que cambiar el valor de <code class="k">N</code> y el arreglo; el resto del programa sirve igual.</li>
</ul></div>
</section>

<section>
<h2>Funciones: darle nombre a una tarea</h2>
<p>Una <b>función</b> agrupa instrucciones que se usan varias veces. <code class="k">void pulso(int ms)</code> enciende el LED durante <code class="k">ms</code> milisegundos y lo apaga; se usa con <code class="k">pulso(200)</code>. El código Morse de socorro, SOS, son tres pulsos cortos (punto), tres largos (raya) y otros tres cortos. Con la función, el programa es corto y se lee casi como una frase.</p>
<div class="sim" data-sim="sos" data-title="SOS en código Morse con una función"></div>
<div class="box tip"><p>Regla práctica: si copia y pega las mismas tres líneas más de dos veces, es hora de escribir una función o un bucle.</p></div>
</section>

<section>
<h2>¿Cuántos LED soporta una placa?</h2>
<p>Cada pin del UNO da hasta 20 mA cómodamente (40 mA absolutos) y el chip entero, 200 mA. Con LED de 11.6 mA (220 Ω): 17 LED sumarían 197 mA. Para más luces se multiplexan (se encienden por turnos, rápido) o se usan transistores y una fuente adicional (capítulo 18).</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Cuánto dura un ciclo del semáforo si el rojo dura 6 s, el verde 4 s y el amarillo 2 s? ¿Cuántos ciclos completos hay en un minuto?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Ciclo.</b> 6 + 4 + 2 = 12 s.</li>
<li><b>Por minuto.</b> 60/12 = 5.</li>
<li><b>Resultado.</b> <span class="ans">12 s por ciclo y 5 ciclos por minuto.</span></li></ol></details></li>
<li><span class="lvl">Básico</span>En <code class="k">int leds[] = {2, 3, 4, 5, 6};</code>, ¿cuánto vale <code class="k">leds[3]</code> y cuántos elementos tiene?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Índices.</b> Se cuenta desde 0: leds[0]=2, leds[1]=3, leds[2]=4, leds[3]=5.</li>
<li><b>Tamaño.</b> Cinco valores.</li>
<li><b>Resultado.</b> <span class="ans"><code class="k">leds[3]</code> vale 5; tiene 5 elementos (índices 0 a 4).</span></li></ol></details></li>
<li><span class="lvl">Intermedio</span>En un UNO, ¿qué imprime <code class="k">int x = 30000; x = x + 5000; Serial.println(x);</code>?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Suma.</b> 30000 + 5000 = 35000, que no cabe en un entero de 16 bits (máximo 32767).</li>
<li><b>Desbordamiento.</b> 35000 − 65536 = −30536.</li>
<li><b>Resultado.</b> <span class="ans">−30536 en el UNO; 35000 en un ESP32, cuyo <code class="k">int</code> es de 32 bits.</span></li></ol></details></li>
<li><span class="lvl">Avanzado</span>El código SOS usa pulsos de 200 ms y de 600 ms con pausas de 200 ms entre pulsos. Calcule la duración de la parte «S O S» (sin contar las pausas entre letras ni la final).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Letra S.</b> Tres pulsos de 200 ms, cada uno con 200 ms de pausa: 3 × 400 = 1200 ms.</li>
<li><b>Letra O.</b> Tres pulsos de 600 ms con 200 ms de pausa: 3 × 800 = 2400 ms.</li>
<li><b>Total.</b> 1200 + 2400 + 1200 = 4800 ms.</li>
<li><b>Resultado.</b> <span class="ans">4.8 s (más las pausas de 400 ms entre letras: 5.6 s).</span></li></ol></details></li>
</ol>
</section>
