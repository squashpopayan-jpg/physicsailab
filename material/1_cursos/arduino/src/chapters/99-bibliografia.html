<p class="lead">Fuentes principales del curso. Las hojas de datos de los fabricantes son la referencia definitiva de cada componente: conviene leerlas con el hábito de buscar primero los «valores máximos absolutos» y las tablas de características eléctricas.</p>

<section>
<h2>Libros de electrónica y Arduino</h2>
<ul>
<li>P. Horowitz y W. Hill, <em>The Art of Electronics</em>, 3.ª ed., Cambridge University Press, 2015.</li>
<li>M. Banzi y M. Shiloh, <em>Getting Started with Arduino</em>, 4.ª ed., Make Community, 2022.</li>
<li>J. Boxall, <em>Arduino Workshop</em>, 2.ª ed., No Starch Press, 2021.</li>
<li>S. Monk, <em>Programming Arduino: Getting Started with Sketches</em>, 2.ª ed., McGraw-Hill, 2016.</li>
</ul>
</section>

<section>
<h2>Hojas de datos y especificaciones</h2>
<ul>
<li>Microchip, <em>ATmega328P Datasheet</em> (DS40002061): valores máximos, ADC, temporizadores y PWM del Arduino UNO.</li>
<li>Espressif Systems, <em>ESP32 Series Datasheet</em> y <em>ESP32 Technical Reference Manual</em>: pines, ADC, WiFi y Bluetooth.</li>
<li>Texas Instruments, <em>LM35 Precision Centigrade Temperature Sensors</em>.</li>
<li>Aosong, <em>DHT11 Humidity and Temperature Sensor</em>.</li>
<li>Hojas de los módulos HC-SR04 (ultrasonido) y HC-SR501 (PIR), de varios fabricantes.</li>
<li>NXP, <em>UM10204: I²C-bus specification and user manual</em>.</li>
<li>Referencia del lenguaje de Arduino (<code>arduino.cc/reference</code>) y documentación del núcleo Arduino-ESP32.</li>
</ul>
</section>

<section>
<h2>Física de los proyectos</h2>
<ul>
<li>D. Halliday, R. Resnick y J. Walker, <em>Fundamentals of Physics</em>, Wiley: caída libre, péndulo, calor y ondas sonoras.</li>
<li>M. Abramowitz e I. A. Stegun, <em>Handbook of Mathematical Functions</em>, NBS, 1964: integral elíptica completa y media aritmético-geométrica (periodo exacto del péndulo).</li>
<li>I. Newton, «Scala graduum caloris», <em>Philosophical Transactions</em> 22, 1701: origen de la ley de enfriamiento.</li>
<li>O. Cramer, «The variation of the specific heat ratio and the speed of sound in air with temperature, pressure, humidity, and CO₂ concentration», <em>J. Acoust. Soc. Am.</em> 93, 2510, 1993.</li>
</ul>
</section>

<section>
<h2>Simulación de circuitos</h2>
<ul>
<li>C.-W. Ho, A. E. Ruehli y P. A. Brennan, «The modified nodal approach to network analysis», <em>IEEE Trans. Circuits and Systems</em> 22, 504–509, 1975.</li>
<li>L. W. Nagel, <em>SPICE2: A Computer Program to Simulate Semiconductor Circuits</em>, ERL-M520, Univ. of California, Berkeley, 1975.</li>
<li>A. Vladimirescu, <em>The SPICE Book</em>, Wiley, 1994.</li>
</ul>
</section>

<section>
<h2>Programas usados para validar</h2>
<ul>
<li>Python con NumPy y SciPy (álgebra lineal y optimización), SymPy y mpmath (cálculo simbólico y de precisión arbitraria).</li>
<li>Node.js (ejecución de las pruebas del núcleo) y Chrome sin ventana (recorrido de todos los capítulos y simulaciones).</li>
</ul>
</section>
