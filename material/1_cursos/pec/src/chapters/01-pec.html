<header class="chapter-head">
  <span class="kicker">Parte I · Lección 1</span>
  <h1>¿Qué es el PEC?</h1>
  <p class="lead">PEC quiere decir <b>Proceso Educativo Comunitario</b>. No es un documento para guardar: es la manera en que una comunidad Nasa decide cómo enseñar y cómo aprender para seguir viviendo como pueblo.</p>
</header>

<div class="ave">
  <div class="av" role="img" aria-label="Dxi'jan, el ave guía"></div>
  <div><p><b class="nom">Dxi'jan te invita:</b> «No leas con prisa: piensa que cada página es como una semilla.» Esta primera lección tiene tres ideas: qué es el PEC, qué es ser Nasa y por qué el PEC también conversa con otras culturas.</p></div>
</div>

<section>
<h2>Una cartilla hecha en comunidad</h2>
<p>La cartilla reúne las palabras que se compartieron en <span class="term">mingas</span>, encuentros y asambleas. Su propósito es <b>fortalecer el PEC</b>: afianzar el derecho a la <span class="term">educación propia</span>, reconociendo la interculturalidad y las particularidades del territorio.</p>
<figure class="fig"><img src="img:fogon" alt="Un fogón encendido del que salen colibríes y paisajes de montaña. Ilustración de la presentación de la cartilla."><figcaption>El fuego de la tulpa: lugar donde se comparte la palabra. Ilustración de la cartilla, página 4.</figcaption></figure>
<h3>Lo que se hizo durante 2025</h3>
<ol class="steps leaf">
  <li>Un <b>Diplomado en Fundamentación del PEC</b> con la <b>Universidad del Valle</b>. Participaron maestros, autoridades y el programa Raíz y Retoño.</li>
  <li>Se <b>actualizó el Pacto de Convivencia</b>.</li>
  <li>Se hizo un <b>autodiagnóstico educativo</b>.</li>
  <li>Se hizo un <b>censo comunitario</b> y un <b>diagnóstico psicosocial</b>.</li>
</ol>

</section>

<section>
<h2>Qué significa «PEC»</h2>
<figure class="fig"><img src="img:quepec" alt="Un colibrí grande verde y amarillo sobre un paisaje de montaña con una casa roja. Ilustración de la cartilla."><figcaption>Ilustración de la sección «¿Qué es el PEC?», página 5.</figcaption></figure>
<p>El PEC nace en el resguardo Nasa de Novirao <b>de la necesidad de trazar un camino educativo</b> que responda a cuatro cosas:</p>
<div class="cards">
  <div class="card"><h3>La historia</h3><p>Una historia de resistencias.</p></div>
  <div class="card"><h3>El territorio</h3><p>Las realidades del lugar donde se vive.</p></div>
  <div class="card"><h3>El presente</h3><p>Los desafíos de hoy.</p></div>
  <div class="card"><h3>Los sueños</h3><p>Los sueños de largo aliento como comunidad.</p></div>
</div>
<p>Es un proceso de <b>construcción participativa y colectiva</b>. Allí está la voz y el sentir de niños, niñas, jóvenes, padres y madres, autoridades, líderes, lideresas, mayores y mayoras. Entre todos conversan sobre los saberes, conocimientos, aprendizajes, habilidades, valores y principios que deben orientar la vida <b>en familia, en comunidad, en el territorio y en el cosmos</b>.</p>
<div class="box palabra">
  <p class="bt">Palabra Nasa: Uma Kiwe</p>
  <p><span class="nasa">Uma Kiwe</span> es la <b>madre tierra</b>. El PEC busca que el pueblo siga <b>perviviendo</b> (seguir vivo como pueblo) <b>en armonía con Uma Kiwe</b> y como parte de la humanidad diversa.</p>
</div>
<div class="box cita">
  <p>«El PEC no es un papel guardado en un cajón. Es el modo en que enseñamos y aprendemos siendo Nasa: trabajando en la minga, escuchando a los mayores, cuidando el tul, compartiendo la palabra en la tulpa…»</p>
  <p class="quien">Cartilla PEC, página 6</p>
</div>
<div class="check" data-check="c01b"></div>
</section>

<section>
<h2>Ser Nasa: mucho más que una identidad</h2>
<p>El PEC recuerda que ser Nasa <b>no es solo una identidad étnica</b>. Es una <b>forma de vida</b>, una manera de ser en el mundo, que se convive con todos los seres de la madre tierra.</p>

  <p>«Nasa» significa <b>Ser en general</b>. No se limita a las personas: las plantas, los animales, los minerales y los elementos del cosmos también son Nasa.</p>

<section>
<h2>Más allá de lo propio: el diálogo intercultural</h2>
<p>El PEC no se reduce a las formas propias de aprender, enseñar o generar conocimiento. También es <b>diálogo intercultural</b>: un intercambio de saberes y vivencias con otras culturas y pueblos, incluida la <b>sociedad mayoritaria</b> y la <b>ciencia</b>.</p>
<div class="box recordar">
  <p class="bt">Para recordar</p>
  <ul>
    <li>PEC = <b>Proceso Educativo Comunitario</b>.</li>
    <li>Se construye entre todos: niñez, juventud, familias, autoridades, mayores y mayoras.</li>
    <li>Busca <b>pervivir</b> como pueblo, en armonía con <span class="nasa">Uma Kiwe</span>.</li>
    <li>Ser Nasa es una manera de ser en el mundo, con todos los seres.</li>
    <li>Además de lo propio, dialoga con otras culturas y con la ciencia.</li>
  </ul>
</div>
