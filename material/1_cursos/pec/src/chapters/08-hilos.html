<header class="chapter-head">
  <span class="kicker">Parte III · Lección 6</span>
  <h1>Los cinco hilos dinamizadores</h1>
  <p class="lead">Los dos tejidos se mueven gracias a <b>cinco hilos</b>. Cada hilo es un enfoque del PEC con un color propio, el de su ovillo. Aprenderlos bien es la base de todo lo que sigue.</p>
</header>

<figure class="fig"><img src="img:colibri" alt="Un colibrí azul y verde vuela sobre un valle con un río y campos de colores; un gorrión lo mira desde una rama. Ilustración de la cartilla."><figcaption>«¡Qué bonito! Lo que abajo parece distinto, desde arriba se ve entrelazado.» Cartilla, página 20.</figcaption></figure>
<div class="box cita">
  <p>«Hoy que escucho hablar de los hilos dinamizadores, me pregunto: ¿serán ustedes capaces de tejerlos como tejemos nosotros los nidos, firmes y abiertos al viento?»</p>
  <p class="quien">Una mayora, en la cartilla (página 15)</p>
</div>

<section>
<h2>Conoce los cinco hilos</h2>
<div class="cards">
  <div class="card hilo h1c"><div class="ico"><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M18 31V17M18 19c0-6 4-9 10-9 0 6-4 9-10 9zM18 23c0-5-3-8-9-8 0 5 3 8 9 8z" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h3>Hilo Agroambiental</h3>
    <p>Cuidado de <span class="nasa">Uma Kiwe</span>, búsqueda de la <b>soberanía alimentaria</b>, fomento y fortalecimiento de los procesos productivos.</p>
    <p><b>Se articula con:</b> el programa de Territorio, Ambiente y Producción del cabildo.</p></div>
  <div class="card hilo h2c"><div class="ico"><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M18 6v22M9 29h18M8 11h20M8 11l-4 9h8zM28 11l-4 9h8z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h3>Hilo de Derecho Mayor y Gobernanza</h3>
    <p>Formación política y organización comunitaria desde la <b>Ley de Origen</b>, la autoridad y el gobierno propio; también comprensión crítica de la realidad local, regional, nacional y mundial.</p>
    <p><b>Se articula con:</b> el cabildo, la guardia escolar, la guardia y la autoridad del cabildo, y otras formas organizativas del territorio.</p></div>
  <div class="card hilo h3c"><div class="ico"><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M18 19a2.5 2.5 0 1 1 2.5 2.5A5 5 0 1 1 15.5 16 7.5 7.5 0 1 1 23 26.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></div>
    <h3>Hilo de Artes y Culturas</h3>
    <p>Fortalece la <b>identidad, la memoria y la cultura</b> comunitaria, las expresiones estéticas y artísticas, y la espiritualidad.</p>
    <p><b>Se articula con:</b> el programa de familia y los jóvenes.</p></div>
  <div class="card hilo h4c"><div class="ico"><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M18 30S6 22.5 6 14a6.5 6.5 0 0 1 12-3.4A6.5 6.5 0 0 1 30 14c0 8.500-12 16-12 16z" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/></svg></div>
    <h3>Hilo de Bienestar y Deporte</h3>
    <p>Cuidado del <b>cuerpo, la salud y la armonía</b>, con deportes, hábitos saludables y nutrición sana.</p>
    <p><b>Se articula con:</b> el programa de salud.</p></div>
  <div class="card hilo h5c"><div class="ico"><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M6 8h24v16H17l-7 6v-6H6z" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/></svg></div>
    <h3>Hilo de Comunicación y Lenguajes</h3>
    <p>Revitaliza el <b>Nasa Yuwe</b>, la lectura y las escrituras, la comunicación comunitaria y el diálogo con otros idiomas.</p>
    <p><b>Se articula con:</b> la emisora comunitaria.</p></div>
</div>

</section>

<section>
<h2>Cada hilo cruza todos los lugares</h2>
<figure class="fig card"><div class="gen" data-gen="tejido"></div><figcaption>Cada hilo (ovillo de la izquierda) se cruza con los cinco sectores (derecha). Todo está atravesado por la <b>espiritualidad</b>. Esquema rehecho para el curso a partir del diagrama de la página 16.</figcaption></figure>
<p>La cartilla lo dice así: cada hilo está <b>atravesado por la espiritualidad</b> y se conecta con los programas del cabildo, los colectivos comunitarios, los estudiantes, las familias y las autoridades espirituales. De esa manera <b>los aprendizajes de la escuela se irradian hacia todos los sectores</b>.</p>
<div class="box ojo">
  <p class="bt">No es «un hilo, un programa»</p>
  <p>Cada hilo <b>no se articula rígidamente</b> con un solo programa del cabildo. De lo que se trata es de propiciar <b>un diálogo permanente entre todos los hilos y programas</b>.</p>
</div>
<div class="check" data-check="c06c"></div>
</section>
