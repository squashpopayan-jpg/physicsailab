  <span class="kicker">Parte II · Lección 3</span>
  <h1>La lucha por la tierra</h1>
  <p class="lead">La historia de Novirao está marcada por la lucha por la tierra. Para entender por qué la escuela es tan importante, primero hay que oír la palabra de los mayores.</p>
</header>

<div class="ave">
  <div class="av" role="img" aria-label="Dxi'jan, el ave guía"></div>
  <div><p><b class="nom">Dxi'jan cuenta:</b> «Ven, escuchemos la palabra de nuestros mayores. Quiero contarte cómo resistimos al terraje y al monocultivo, y cómo con unidad fuimos recuperando nuestra Yat Wala, casa grande.»</p></div>
</div>

<figure class="fig"><img src="img:mayores" alt="Un mayor con bastón y poncho y varias personas sembrando entre la niebla, con un pájaro en una rama. Ilustración de la cartilla."><figcaption>Un mayor y las familias que recuperaron la tierra con su trabajo. Cartilla, página 10.</figcaption></figure>

<section>
<h2>Llegar y vivir bajo el terraje</h2>
<p>Los mayores cuentan que hace unos <b>300 años</b> las familias llegaron desde <b>Tierradentro</b> buscando un lugar para vivir y sembrar. Al llegar tuvieron que sufrir el <span class="term">terraje</span>.</p>
<div class="box palabra">
  <p class="bt">Palabra: terraje</p>
  <p>El terraje era, en palabras de la cartilla, «una <b>esclavitud disfrazada</b>». Los patrones dejaban cultivar un pedacito de tierra, pero la familia debía <b>pagar con trabajo gratuito</b> varias lunas al año en las haciendas. Si no iban, las sacaban.</p>
</div>
<div class="box cita">
  <p>«El patrón decía: tenga un lotecito. Pero había que descontarlo con trabajo, porque la tierra no estaba regalada, era como arrendada. Uno trabajaba la luna entera en el monte o criando los hijos de los patrones, y si no iba, nos sacaban.»</p>
  <p class="quien">Mayor Rosalino Vainas</p>
</div>
<p>Las familias <b>Mosquera y Angulo</b> son recordadas como terratenientes que mandaban con violencia: imponían la religión católica y prohibían la espiritualidad y las costumbres.</p>
<div class="check" data-check="c03a"></div>
</section>

<section>
<h2>Línea del tiempo de la tierra</h2>
<ol class="timeline">
  <li><span class="yr">Hace unos 300 años</span><p>Las familias llegan desde Tierradentro. Después sufren el terraje.</p></li>
  <li><span class="yr">Década de 1970</span><p>Llega la empresa <b>Reforestadora S.A.</b> con cultivos de pino en El Carmen, El Molino y La Aurora. Daña las tierras de siembra y obliga a muchas familias a irse.</p></li>
  <li><span class="yr">1974 a 1976</span><p>La comunidad se organiza en <b>mingas nocturnas</b> y arranca las pineras para defender el territorio.</p></li>
  <li class="dark"><span class="yr">1980</span><p>La lucha se hace más fuerte y la empresa empieza a pensar en vender tierras. Pero la violencia no para: el comunero <b>Wenceslao León</b> es asesinado en El Molino, luego de ser retenido y torturado. Su muerte duele, y también da más fuerza para resistir.</p></li>
  <li><span class="yr">1991</span><p>Se conforma el <b>Cabildo Indígena de Novirao</b>, con el mayor <b>Julio Cucuñame</b> como primer gobernador.</p></li>
  <li><span class="yr">1995 y 1996</span><p>Por la presión organizada, el <b>INCODER</b> entrega oficialmente las primeras tierras del resguardo: <b>El Molino, El Carmen y La Canoa</b>.</p></li>
</ol>
<div class="check" data-check="c03b"></div>
</section>

<section>
<h2>Una lucha acompañada</h2>
<p>Las luchas de Novirao <b>no fueron solas</b>. Se unieron a tres caminos más grandes:</p>
<div class="cards">
  <div class="card"><h3>Pueblo Misak</h3><p>Sus recuperaciones de tierra.</p></div>
  <div class="card"><h3>Manuel Quintín Lame</h3><p>Su legado.</p></div>
  <div class="card"><h3>CRIC</h3><p>El proceso regional que dio origen al <b>Consejo Regional Indígena del Cauca</b>.</p></div>
</div>
<div class="box cita">
  <p>«La fuerza de la unidad es lo que siempre nos ha permitido resistir.»</p>
  <p class="quien">Lo que dicen los mayores, según la cartilla</p>
</div>
<div class="check" data-check="c03c"></div>

<section>
<h2>Por qué la escuela no puede estar lejos de esta historia</h2>
<div class="box cita">
  <p>«Cada tierra que pisamos en Novirao fue recuperada con trabajo, con sudor y sangre. Educar es también recordar a los que lucharon.»</p>
  <p class="quien">Mayor Julio Cucuñame</p>
</div>
<div class="box recordar">
  <p class="bt">Para recordar</p>
  <ul>
    <li>Las familias llegaron desde <b>Tierradentro</b> hace unos 300 años y sufrieron el <b>terraje</b>.</li>
    <li>En los años 70 la <b>Reforestadora S.A.</b> sembró pinos; entre 1974 y 1976 se arrancaron con mingas nocturnas.</li>
    <li>En <b>1991</b> nace el Cabildo; en <b>1995-1996</b> el INCODER entrega las primeras tierras.</li>
    <li>La lucha se unió a los Misak, a Quintín Lame y al CRIC.</li>
    <li>Educar es también <b>recordar a los que lucharon</b>.</li>
  </ul>
</div>
