<header class="chapter-head">
  <span class="kicker">Parte II · Lección 4</span>
  <h1>La historia de la escuela</h1>
  <p class="lead">«A vuelo de pájaro»: así recorre la cartilla la historia de la educación en Novirao. Es la misma historia de la lucha por el territorio, vista desde la escuela.</p>
</header>

<figure class="fig"><img src="img:arbol" alt="Una golondrina vuela sobre un árbol grande y una casa donde se reúnen niños y niñas, con un gorrión en una rama. Ilustración de la cartilla."><figcaption>Cartilla, página 12.</figcaption></figure>

<div class="box idea">
  <p class="bt">La idea central</p>
  <p>«Nuestra lucha por la tierra nos enseña que <b>no hay autonomía educativa sin autonomía política y territorial</b>.»</p>
</div>
<div class="box palabra">
  <p class="bt">Dos palabras Nasa del horizonte del PEC</p>
  <p><span class="nasa">Kxaw dxi</span> = el <b>sueño a caminar</b>: defender la tierra, revitalizar la lengua y garantizar la vida colectiva.</p>
  <p><span class="nasa">Wët wët fxi'zenxi</span> = el <b>Buen vivir</b>, hacia donde apunta ese sueño.</p>
</div>

<section>
<h2>Cuatro escuelas, cuatro épocas</h2>
<p>Los modelos escolares que llegaron al territorio querían <b>fragmentar la vida, borrar la memoria y explotar la fuerza de trabajo</b>. La comunidad resistió y fue construyendo otra escuela.</p>
<ol class="timeline">
  <li class="dark"><span class="yr">1727</span><p class="t">La primera «escuela» fue una iglesia, en Belén.</p><p>No era un aula. Enseñaban religión católica y castellano, y prohibían las prácticas espirituales y culturales. Muchos mayores dejaron de compartir sus conocimientos por miedo a ser señalados de brujos o hechiceros.</p></li>
  <li><span class="yr">Hacia 1940</span><p class="t">Primera escuela oficial, en Belén.</p><p>Estaba bajo el control de la familia Mosquera, antiguos terratenientes.</p></li>
  <li><span class="yr">1948</span><p class="t">Una ordenanza municipal nombra al primer director.</p><p>Era una escuela reconocida, pero <b>solo llegaba hasta cuarto grado</b> y se centraba en el castellano y la doctrina católica. A muchos niños se les prohibía participar en danzas o prácticas artísticas.</p></li>
  <li><span class="yr">2004 y 2005</span><p class="t">Se funda la Institución Educativa Indígena de Novirao.</p><p>Por gestión del mayor <b>Julio Cucuñame</b> y de <b>Faustino Cometa</b>. Empezó con la profesora <b>Magnolia Mosquera</b> como primera docente y <b>23 estudiantes de sexto grado</b>.</p></li>
</ol>
<figure class="fig"><img src="img:tulpa" alt="Una casa circular de paja con un fogón en el centro y un gorrión a la izquierda. Ilustración de la cartilla."><figcaption>Un gorrión recuerda el 2005: «Cuando se fundó el colegio… me posé en el techo nuevo y pensé: ¿será este el lugar donde sus sueños volverán a florecer?» Cartilla, página 13.</figcaption></figure>

</section>

<section>
<h2>Colegio propio, pero con currículo ajeno</h2>
<ol class="timeline">
  <li><span class="yr">2013</span><p>Se amplía la cobertura hasta la <b>media vocacional</b>. Ya hay un colegio propio en el territorio, aunque todavía bajo los lineamientos del MEN.</p></li>
  <li><span class="yr">El problema</span><p>El currículo seguía siendo el que el Banco Mundial y el Fondo Monetario Internacional impusieron: un <b>currículo por competencias</b>, desconectado de la cosmovisión y de la vida comunitaria.</p></li>
</ol>
<div class="box cita">
  <p>«La escuela fue un espacio de olvido, nos enseñaron a desconocernos a nosotros mismos. Pero también fue el lugar donde empezamos a entender que era necesario cambiarla, hacerla nuestra.»</p>
  <p class="quien">Palabra y Memoria Nasa (2014), citada en la cartilla</p>
</div>
<div class="check" data-check="c04c"></div>
</section>

<section>
<h2>2024 y 2025: la escuela pasa a manos del Cabildo</h2>
<p>Gracias al diálogo entre el nuevo <b>rector</b>, el <b>cabildo</b> y la <b>Junta de Padres de Familia</b>, la administración de la escuela pasó oficialmente a manos del cabildo. Fue «un paso decisivo hacia la autonomía educativa».</p>
<div class="cards">
  <div class="card"><h3>Más equipo humano</h3><p>Llegaron una dinamizadora psicosocial, un secretario, una encargada de servicios generales y un dinamizador sabedor para los proyectos pedagógico-productivos.</p></div>
  <div class="card"><h3>Más espacios</h3><p>Se construyó la cafetería, se adecuó la rectoría, se mejoró el aula múltiple y se levantaron las bases de la cancha sintética.</p></div>
  <div class="card"><h3>Otra pedagogía</h3><p>Se empezó a dejar atrás la fragmentación del currículo oficial para organizar la educación desde el <b>tejido de sabidurías y conocimientos</b>, sostenido por los <b>hilos dinamizadores</b>.</p></div>
</div>
<div class="box ojo">
  <p class="bt">Una advertencia sobre un dato</p>

</div>
