<header class="chapter-head">
  <span class="kicker">Parte IV · Lección 11</span>
  <h1>Unificar la planeación</h1>
  <p class="lead">El tercer cambio llega hasta la clase de cada día. La comunidad unificó sus instrumentos para que planear no sea un trámite, sino «un verdadero tejido de vida».</p>
</header>

<section>
<h2>Tres instrumentos unificados</h2>
<p>«Dicen los que saben que un dinamizador que no planea pierde fuerza en su palabra y en su acción educativa.» Por eso se unificaron <b>tres instrumentos</b>:</p>
<div class="cards">
  <div class="card" style="border-top:14px solid var(--accent)"><span class="big">1</span><h3>Plan de formación unificado</h3><p>Organiza la formación de <b>cada grado</b>. La cartilla aclara que la discusión sigue abierta, porque hay que repensar la estructura misma de los grados.</p></div>
  <div class="card" style="border-top:14px solid var(--leaf)"><span class="big">2</span><h3>Planeador diario unificado</h3><p>La planeación de la clase del maestro o la maestra.</p></div>
  <div class="card" style="border-top:14px solid var(--earth)"><span class="big">3</span><h3>Observador unificado</h3><p>Instrumento común de seguimiento.</p></div>
</div>
<div class="check" data-check="c11a"></div>
</section>

<section>
<h2>El punto de partida: la semilla</h2>
<p>El plan de área parte de una <span class="term">unificación de capacidades</span>. Lo central <b>no son los contenidos ni las exigencias externas</b>, sino <b>el estudiante como semilla</b>.</p>
<div class="box idea">
  <p class="bt">Por qué la semilla</p>
  <p>Se reconocen sus <b>dones, habilidades y capacidades</b> como el verdadero punto de partida, «porque cuidar una semilla —un estudiante— es cuidar nuestro plan de vida». Alrededor de la semilla se entrelazan los <b>hilos dinamizadores</b> (que orientan el sentido del aprendizaje) y los <b>periodos</b> (que organizan los temas y procesos de cada área).</p>
</div>
<div class="check" data-check="c11b"></div>
</section>

<section>
<h2>El planeador diario: sembrar un don</h2>
<p>La planeación de clase debe fundamentarse en la <b>capacidad o don</b> que se quiere <b>sembrar o fortalecer</b>. Esa capacidad tiene tres dimensiones:</p>
<div class="cards">
  <div class="card" style="border-top:14px solid var(--h4)"><h3>El Ser</h3><p>Todo lo <b>actitudinal</b>, lo estético, ético, espiritual y emocional.</p></div>
  <div class="card" style="border-top:14px solid var(--accent)"><h3>El Saber</h3><p>Lo <b>comprensivo</b>, el pensamiento, la memoria y la reflexión crítica.</p></div>
  <div class="card" style="border-top:14px solid var(--leaf)"><h3>El Hacer</h3><p>Lo <b>práctico</b>, la habilidad, el trabajo y el servicio en comunidad y el territorio.</p></div>
</div>
<div class="check" data-check="c11c"></div>
</section>

<section>
<h2>Cuatro preguntas orientadoras</h2>
<p>Según las capacidades identificadas en los <b>momentos de maduración de las semillas</b>, cada maestro prioriza las estrategias, experiencias y actividades más pertinentes para su grupo. Las capacidades se convierten en <b>hilos de formación</b> que se concretan con <b>cuatro preguntas</b>:</p>
<div class="tablewrap"><table>
  <thead><tr><th>Pregunta</th><th>Elemento</th><th>Qué responde</th></tr></thead>
  <tbody>
    <tr><td><b>¿Para qué?</b></td><td>Intención pedagógica</td><td>El horizonte <b>político, espiritual y comunitario</b> del aprendizaje.</td></tr>
    <tr><td><b>¿Cómo?</b></td><td>Actividades y estrategias</td><td>Prácticas vivenciales: <b>tulpa, minga, chagra, rituales, deporte, danza, asambleas</b>.</td></tr>
    <tr><td><b>¿Qué?</b></td><td>Saberes o contenidos</td><td>Conocimientos <b>propios y universales</b> que se transmiten en cada actividad.</td></tr>
    <tr><td><b>¿Con qué?</b></td><td>Instrumentos de evaluación</td><td>Formas de valorar el aprendizaje desde la <b>palabra, la práctica, la participación y la reflexión comunitaria</b>.</td></tr>
  </tbody>
</table></div>
<div class="box ojo">
  <p class="bt">Ejemplo inventado para el curso (no está en la cartilla)</p>
  <p>Imagina una clase sobre el maíz en el primer periodo (la familia). <b>¿Para qué?</b> Para cuidar la semilla y la alimentación de la familia. <b>¿Cómo?</b> Con una minga en la huerta. <b>¿Qué?</b> Cómo crece la planta y cómo se mide el terreno. <b>¿Con qué?</b> Con la palabra de los mayores, el trabajo en la huerta y una conversación final. Es solo una forma de practicar las cuatro preguntas.</p>
</div>
<div class="check" data-check="c11d"></div>
</section>

<section>
<h2>Las clases no son islas: son parte de un río mayor</h2>
<p>De esta manera las clases no se piensan como <b>islas</b>, sino como <b>parte de un río mayor</b>, en el que cada actividad se conecta con los <b>hilos dinamizadores del SEIP</b>: gobernabilidad, arte y culturas, bienestar y deporte, comunicación y lenguajes, y agroecología. Así, la planeación pedagógica <b>deja de ser un requisito burocrático</b> y se convierte en un verdadero tejido de vida.</p>
<div class="ave">
  <div class="av" role="img" aria-label="Dxi'jan, el ave guía"></div>

</div>
