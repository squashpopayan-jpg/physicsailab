<header class="chapter-head">
  <span class="kicker">Apéndice A</span>
  <h1>Glosario</h1>
  <p class="lead">Las palabras Nasa y los términos del PEC, en orden alfabético. Escribe en el cuadro para encontrar una palabra.</p>
</header>
<div class="gl-filter"><input type="search" placeholder="Buscar en el glosario…" aria-label="Buscar en el glosario"></div>
<dl class="gl">
  <div class="it"><dt>Asamblea general</dt><dd>La reunión de la comunidad. Es la <b>máxima autoridad</b> en el territorio; el Cabildo trabaja bajo su tutela. <a href="#novirao">Lección 2</a>.</dd></div>
  <div class="it"><dt>Cabildo Indígena</dt><dd>La estructura de gobierno propio que ejerce competencias <b>administrativas, legislativas y judiciales</b>. En Novirao se conformó en 1991. <a href="#novirao">Lección 2</a>.</dd></div>
  <div class="it"><dt>Chagra</dt><dd>La cartilla la nombra entre las prácticas vivenciales (tulpa, minga, chagra, rituales…). Es la huerta o espacio de cultivo de la familia. <a href="#planeacion">Lección 11</a>.</dd></div>
  <div class="it"><dt>CRIC</dt><dd><b>Consejo Regional Indígena del Cauca</b>: el proceso regional al que se unió la lucha de Novirao. <a href="#tierra">Lección 3</a>.</dd></div>
  <div class="it"><dt>Dimensiones del Ser Nasa</dt><dd>Maneras de construir y expresar la experiencia de ser en el mundo. No son fragmentos. <a href="#pedagogia">Lección 8</a>.</dd></div>
  <div class="it"><dt>Dinamizador / dinamizadora</dt><dd>Nombre que usa la cartilla para quienes acompañan la educación en la escuela y en Raíz y Retoño (los docentes y sabedores del equipo). <a href="#novirao">Lección 2</a>.</dd></div>
  <div class="it"><dt>Educación propia</dt><dd>La educación que está «en la minga, la tulpa, la palabra compartida, el trabajo comunitario y el territorio», no solo en los escritos. <a href="#pec">Lección 1</a>.</dd></div>
  <div class="it"><dt>Espiral de maduración de la semilla</dt><dd>Siembra, germinación, crecimiento, floración, fructificación y nueva semilla. <a href="#practicas">Lección 7</a>.</dd></div>
  <div class="it"><dt>Hilos dinamizadores</dt><dd>Los cinco enfoques del PEC: Agroambiental, Derecho Mayor y Gobernanza, Artes y Culturas, Bienestar y Deporte, Comunicación y Lenguajes. <a href="#hilos">Lección 6</a>.</dd></div>
  <div class="it"><dt>ICFES</dt><dd>La entidad de las pruebas de Estado. La cartilla señala que muchas familias esperan un modelo centrado en su requerimiento. <a href="#tiempo">Lección 9</a>.</dd></div>
  <div class="it"><dt>INCODER</dt><dd>Entidad que entregó oficialmente las primeras tierras del resguardo en 1995-1996. <a href="#tierra">Lección 3</a>.</dd></div>
  <div class="it"><dt>Intraculturalidad e interculturalidad</dt><dd>Primero se parte del propio territorio y cultura (intra), luego se dialoga con otras culturas (inter), y lo aprendido se pone al servicio de la comunidad (intra). <a href="#pedagogia">Lección 8</a>.</dd></div>
  <div class="it"><dt>Jueves de escuela comunitaria</dt><dd>Los jueves, día en que la institución trabaja por los hilos dinamizadores. <a href="#tiempo">Lección 9</a>.</dd></div>
  <div class="it"><dt>Kxaw dxi</dt><dd>«Sueño a caminar»: defender la tierra, revitalizar la lengua y garantizar la vida colectiva. <a href="#escuela">Lección 4</a>.</dd></div>
  <div class="it"><dt>Ley de Origen</dt><dd>Principio que guía la formación política y la autoridad propia; los mayores y mayoras son sus guardianes. <a href="#hilos">Lección 6</a>.</dd></div>
  <div class="it"><dt>Mayor / mayora</dt><dd>Persona mayor, guardiana de la palabra y del pensamiento. <a href="#tierra">Lección 3</a>.</dd></div>
  <div class="it"><dt>Mediaciones</dt><dd>Señales que no fragmentan al ser, sino que orientan nuestras relaciones con el mundo y con los otros. <a href="#pedagogia">Lección 8</a>.</dd></div>
  <div class="it"><dt>MEN</dt><dd>Ministerio de Educación Nacional. <a href="#novirao">Lección 2</a>.</dd></div>
  <div class="it"><dt>Minga</dt><dd>Trabajo comunitario. En la historia de Novirao hubo <b>mingas nocturnas</b> para arrancar las pineras. <a href="#tierra">Lección 3</a>.</dd></div>
  <div class="it"><dt>Nasa</dt><dd>«Ser en general»: las personas y todos los demás seres (plantas, animales, minerales y elementos del cosmos). <a href="#pec">Lección 1</a>.</dd></div>
  <div class="it"><dt>Nasa Yuwe</dt><dd>La lengua Nasa. El hilo de Comunicación y Lenguajes busca revitalizarla. <a href="#hilos">Lección 6</a>.</dd></div>
  <div class="it"><dt>PEC</dt><dd><b>Proceso Educativo Comunitario</b>: construcción participativa y colectiva del camino educativo. <a href="#pec">Lección 1</a>.</dd></div>
  <div class="it"><dt>Pervivencia</dt><dd>Seguir viviendo y permaneciendo como pueblo a través del tiempo. <a href="#pec">Lección 1</a>.</dd></div>
  <div class="it"><dt>Práctica</dt><dd>Actividad o ejercicio planificado para adquirir habilidades o conocimientos específicos. <a href="#practicas">Lección 7</a>.</dd></div>
  <div class="it"><dt>Raíz y Retoño de Vida</dt><dd>Proceso que acompaña la formación de las semillas, niños y niñas de 0 a 5 años. <a href="#novirao">Lección 2</a>.</dd></div>
  <div class="it"><dt>Semilla</dt><dd>Cada persona Nasa, en relación con Uma Kiwe; también los niños y niñas que se acompañan en su maduración. <a href="#practicas">Lección 7</a>.</dd></div>
  <div class="it"><dt>SEIP</dt><dd>Sistema Educativo Indígena Propio (sigla que la cartilla usa sin desarrollar). <a href="#novirao">Lección 2</a>.</dd></div>
  <div class="it"><dt>Sentido y significado</dt><dd><b>Sentido</b> = lo íntimo y personal. <b>Significado</b> = lo colectivo y comunitario. <a href="#pedagogia">Lección 8</a>.</dd></div>
  <div class="it"><dt>Tejido de sabidurías y conocimientos</dt><dd>La forma como se construye, transmite y recrea la educación; busca formar para la pervivencia, la identidad y la autonomía. <a href="#tejidos">Lección 5</a>.</dd></div>
  <div class="it"><dt>Tejido de vida</dt><dd>La red de relaciones que vincula a los ancestros, las personas, las familias, la comunidad, el territorio y el universo. <a href="#tejidos">Lección 5</a>.</dd></div>
  <div class="it"><dt>Terraje</dt><dd>«Esclavitud disfrazada»: trabajo gratuito en las haciendas a cambio de un pedazo de tierra. <a href="#tierra">Lección 3</a>.</dd></div>
  <div class="it"><dt>Tierradentro</dt><dd>La región de donde, según los mayores, llegaron las familias hace unos 300 años. <a href="#tierra">Lección 3</a>.</dd></div>
  <div class="it"><dt>Tul</dt><dd>La huerta o jardín de la familia Nasa. La cartilla habla de «cuidar el tul» y de un «sabedor del Tul». <a href="#pec">Lección 1</a>.</dd></div>
  <div class="it"><dt>Tulpa</dt><dd>El fogón alrededor del cual se comparte la palabra; en los dibujos, una casa de paja con fuego en el centro. <a href="#escuela">Lección 4</a>.</dd></div>
  <div class="it"><dt>Uma Kiwe</dt><dd>La madre tierra. <a href="#pec">Lección 1</a>.</dd></div>
  <div class="it"><dt>Vivencia</dt><dd>Expresión ancestral fundamental ya incorporada en las personas, de carácter más permanente y colectivo. <a href="#practicas">Lección 7</a>.</dd></div>
  <div class="it"><dt>Wët wët fxi'zenxi</dt><dd>El <b>Buen vivir</b>, horizonte del PEC. <a href="#escuela">Lección 4</a>.</dd></div>
  <div class="it"><dt>Yat Wala</dt><dd>La <b>Casa grande</b>: el territorio de Novirao. <a href="#novirao">Lección 2</a>.</dd></div>
</dl>
