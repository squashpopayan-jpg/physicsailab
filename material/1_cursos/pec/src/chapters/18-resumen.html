  <h1>El curso en una página</h1>
  <p class="lead">Un repaso rápido de las cuatro partes, para leer antes del examen. Toca el título de cada lección para volver a ella.</p>

<section>
<h2>Las cuatro partes en cuatro tarjetas</h2>
<div class="cards">
  <div class="card" style="border-top:14px solid var(--accent)"><h3>I · Quiénes somos</h3>
    <p><a href="#pec"><b>PEC</b></a> = Proceso Educativo Comunitario, hecho entre todos, para <b>pervivir</b> en armonía con <span class="nasa">Uma Kiwe</span>.</p>
    <p><a href="#novirao"><b>Novirao</b></a> (Yat Wala, Casa grande) está en Totoró, Cauca. Asamblea → Cabildo → 5 juntas → 17 sectores. 2.229 personas; 48,4 % menores de 19.</p></div>
  <div class="card" style="border-top:14px solid var(--earth)"><h3>II · La historia</h3>
    <p><a href="#tierra"><b>Tierra:</b></a> terraje → Reforestadora S.A. (años 70) → mingas nocturnas (1974-76) → Cabildo (1991) → INCODER entrega tierras (1995-96).</p>
    <p><a href="#escuela"><b>Escuela:</b></a> iglesia de Belén (1727) → escuela oficial (≈1940, 1948) → colegio indígena (2004-05) → media (2013) → administración al cabildo (2024-25).</p></div>
  <div class="card" style="border-top:14px solid var(--h2)"><h3>III · Tejidos y semillas</h3>
    <p><a href="#tejidos"><b>Dos tejidos:</b></a> de vida, y de sabidurías y conocimientos.</p>
    <p><a href="#hilos"><b>Cinco hilos:</b></a> Agroambiental · Derecho Mayor y Gobernanza · Artes y Culturas · Bienestar y Deporte · Comunicación y Lenguajes.</p>
    <p><a href="#practicas"><b>Prácticas y vivencias;</b></a> espiral: siembra, germinación, crecimiento, floración, fructificación, nueva semilla.</p></div>
  <div class="card" style="border-top:14px solid var(--leaf)"><h3>IV · Vivir el PEC</h3>
    <p><a href="#pedagogia"><b>Pedagogía:</b></a> camino, no solo método. Sentido (íntimo) y significado (colectivo). Movimiento.</p>
    <p><a href="#tiempo"><b>Tiempo:</b></a> jueves de escuela comunitaria.</p>
    <p><a href="#estructura"><b>Estructura:</b></a> familia → comunidad → territorio; 4 proyectos transversales.</p>
    <p><a href="#planeacion"><b>Planeación:</b></a> semilla; Ser, Saber, Hacer; ¿para qué? ¿cómo? ¿qué? ¿con qué?</p></div>
</div>
</section>

<p>La cartilla agradece, «con respeto y cariño», a <b>mayores y mayoras</b>, a las <b>mujeres</b>, a los <b>niños, niñas y jóvenes</b>, a los dinamizadores y al equipo pedagógico y directivo, al Cabildo y a las familias; y también al <b>Ministerio de Educación Nacional</b>, a la <b>Universidad del Valle</b> y a los participantes del Diplomado en Fundamentación del PEC.</p>
