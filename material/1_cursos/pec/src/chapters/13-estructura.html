<header class="chapter-head">
  <span class="kicker">Parte IV · Lección 10</span>
  <h1>Armonizar la estructura</h1>
  <p class="lead">El segundo cambio es cómo se organiza el año escolar. La comunidad lo ordena en tres periodos, cada uno dedicado a un espacio que sostiene la educación propia: la <b>familia</b>, la <b>comunidad</b> y el <b>territorio</b>.</p>
</header>

<section>
<h2>Los hilos no son simples actividades de la escuela</h2>
<p>La cartilla lo dice con claridad: los hilos «no son simples actividades internas de la institución, sino la posibilidad de <b>armonizar la relación entre el tejido de vida</b> expresado en la sabiduría propia y los <b>campos de conocimiento</b> que han estado presentes en el sistema educativo». Ambos son <b>indispensables para la vida actual y futura</b> de las nuevas generaciones.</p>
<figure class="fig card" aria-label="Armonizar tejido de vida y campos de conocimiento">
  <div class="trio flow">
    <div style="background:var(--leaf-soft);border:3px solid var(--leaf);border-radius:16px;padding:14px 8px;font-family:var(--font-head);font-weight:800;color:var(--leaf-ink)">Tejido de vida<br><span style="font-family:var(--font-ui);font-weight:400;font-size:.8em;color:var(--ink)">sabiduría propia</span></div>
    <div style="font-size:2em;color:var(--maroon);font-weight:800">⇄</div>
    <div style="background:var(--accent-soft);border:3px solid var(--accent);border-radius:16px;padding:14px 8px;font-family:var(--font-head);font-weight:800;color:var(--accent)">Campos de conocimiento<br><span style="font-family:var(--font-ui);font-weight:400;font-size:.8em;color:var(--ink)">del sistema educativo</span></div>
  </div>
  <figcaption>La armonización pone a conversar los dos lados. Esquema hecho para el curso con la página 33.</figcaption>
</figure>
<p>Esa armonización parte de <b>tres dimensiones o espacios</b> que sostienen la educación propia: <b>la familia, la comunidad y el territorio</b>. Su propósito no es solo organizar la formación de los estudiantes, sino también <b>dinamizar en la comunidad procesos que fortalezcan el tejido de vida del pueblo Nasa</b>.</p>
<div class="check" data-check="c10a"></div>
</section>

<section>
<h2>El año escolar en tres periodos</h2>
<p>Reconociendo que esos tres espacios son las bases, la comunidad estableció una <b>planeación anual</b> que organiza el trabajo educativo en <b>tres periodos</b>, cada uno orientado hacia una dimensión:</p>
<div class="cards">
  <div class="card" style="border-top:14px solid var(--earth)"><span class="pill" style="--hc:var(--earth)">Primer periodo</span><h3>La familia</h3><p>La <b>primera escuela</b>, núcleo del cuidado y de la transmisión de saberes.</p></div>
  <div class="card" style="border-top:14px solid var(--h2)"><span class="pill" style="--hc:var(--h2)">Segundo periodo</span><h3>La comunidad</h3><p>Espacio colectivo de <b>aprendizaje, participación y trabajo compartido</b>.</p></div>
  <div class="card" style="border-top:14px solid var(--leaf)"><span class="pill" style="--hc:var(--leaf)">Tercer periodo</span><h3>El territorio</h3><p>Fuente de vida, <b>horizonte político y espiritual</b> que integra todos los saberes.</p></div>
</div>
<div class="box idea">
  <p class="bt">Una forma de recordarlo</p>
  <p>Va de lo más cercano a lo más amplio: <b>familia → comunidad → territorio</b>. Como una espiral que se abre.</p>
</div>
<div class="check" data-check="c10b"></div>
</section>

<section>
<h2>Cuatro proyectos transversales</h2>
<figure class="fig"><img src="img:huerta" alt="Hombres y mujeres trabajan la huerta entre matas de maíz, con montañas y casas al fondo, y un gorrión en primer plano. Ilustración de la cartilla."><figcaption>La agricultura y la espiritualidad son el primer proyecto transversal. Ilustración de la cartilla, página 6.</figcaption></figure>
<p>En sintonía con los hilos y con este enfoque, la comunidad organizó <b>cuatro proyectos transversales</b> que orientan vivencias colectivas durante cada periodo:</p>
<div class="tablewrap"><table>
  <thead><tr><th>Proyecto transversal</th><th>Vivencias colectivas</th></tr></thead>
  <tbody>
    <tr><td><b>Agricultura y Espiritualidad</b></td><td>El <b>Trueque</b> y la <b>Feria Agroindustrial</b></td></tr>
    <tr><td><b>Convivencia y Cultura de Paz</b></td><td>El <b>Carnaval de la Paz</b></td></tr>
    <tr><td><b>Identidad y Racismo</b></td><td>El <b>Día de la Mujer Indígena</b> y el <b>Día de la Identidad y la Diversidad</b></td></tr>
    <tr><td><b>Sexualidad y Género</b></td><td>En <b>proceso de construcción colectiva</b></td></tr>
  </tbody>
</table></div>
<p>Cada vivencia se nutre de actividades que fortalecen la relación educativa entre la institución y <b>la familia, la comunidad y el territorio</b>, reconociendo el valor del conocimiento en los espacios donde nace. Por eso la educación propia «no se encierra en los muros de la institución, sino que camina junto a la gente, <b>al ritmo de la vida misma</b>».</p>
<div class="check" data-check="c10c"></div>

    <li>La educación propia camina junto a la gente, no solo dentro de los muros.</li>
  </ul>
</div>
<div class="check" data-check="c10d"></div>
</section>
