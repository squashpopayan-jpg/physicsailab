  <h1>Novirao, la Casa grande</h1>
  <p class="lead">Para entender el PEC hay que conocer el lugar donde nace. Novirao es el territorio, el gobierno, la gente y las dos escuelas que sostienen la educación propia.</p>
</header>

<section>
<h2>Yat Wala: la Casa grande</h2>
<div class="box palabra">
  <p class="bt">Palabra Nasa: Yat Wala</p>
  <p>Así llama la comunidad a Novirao: <span class="nasa">Yat Wala</span>, la <b>Casa grande</b>. La cartilla dice: «Aquí hemos levantado juntas y nuestro Cabildo.»</p>
</div>

<section>
<h2>Cómo se gobierna: de la asamblea a las juntas</h2>
<p>La comunidad está organizada políticamente en <b>cinco juntas</b>, que agrupan los <b>17 sectores</b> del territorio. Las juntas son la base de la vida comunitaria y del gobierno propio, y las orienta el <span class="term">Cabildo Indígena</span>.</p>

<section>
<h2>¿Quiénes viven en Novirao?</h2>
<p>Según el <b>autocenso comunitario de 2024</b>, en Novirao viven <b>703 familias</b> que suman <b>2.229 personas</b>.</p>

<section>
<h2>Dos procesos educativos</h2>
<p>La vida comunitaria se organiza alrededor del <b>Cabildo</b>, conformado en <b>1991</b>. Desde allí se orientan los programas de territorio, salud, educación, ambiente y productividad, y familia, que incluyen procesos de jóvenes, mujeres y adultos mayores. En lo educativo hay <b>dos grandes procesos</b>:</p>
<div class="cards">
  <div class="card"><span class="pill" style="--hc:var(--accent)">Colegio</span><h3>Institución Educativa Novirao</h3><div class="big">208</div><p><b>estudiantes</b>, con 15 dinamizadores pedagógicos, 3 ecónomas, un rector, un coordinador pedagógico y equipo de apoyo (psicosocial, sabedor local en lo productivo, secretario y servicios generales).</p></div>
  <div class="card"><span class="pill" style="--hc:var(--h4)">Primera infancia</span><h3>Raíz y Retoño de Vida</h3><div class="big">0–5</div><p><b>años:</b> acompaña la formación de las <b>semillas</b>, los niños y niñas más pequeños. Su equipo incluye 8 dinamizadores culturales: político organizativo, músico, tejedor o tejedora, tallador de madera, hablante Nasa, sabedor del Tul, médico tradicional, partera y sobandero.</p></div>
</div>
<p>Ambos procesos, «en el marco del SEIP y el proyecto con el MEN», van sentando las bases para articularse y convertirse en <b>el corazón de la educación propia en Novirao</b>.</p>
<div class="box palabra">
  <p class="bt">Siglas que aparecen</p>
  <p><b>SEIP</b>: en Colombia significa <i>Sistema Educativo Indígena Propio</i> (la cartilla usa la sigla sin desarrollarla). <b>MEN</b>: Ministerio de Educación Nacional.</p>
</div>
<div class="check" data-check="c02c"></div>
</section>

<section>
<h2>Cómo se vive: la economía</h2>
<p>Las familias mantienen viva la <b>agricultura tradicional</b>. El <b>café</b> es el producto principal para el mercado. Se acompaña de yuca, plátano, maíz, fríjol y frutales, y de la cría de gallinas y cerdos para el consumo. Muchas familias <b>completan sus ingresos con trabajos en Popayán</b>: construcción, jardinería, oficios domésticos, domicilios y otros.</p>
<div class="box ojo">
  <p class="bt">Una tensión que la cartilla nombra</p>
  <p>Esta realidad muestra la tensión entre la <b>economía propia</b> y la <b>dependencia externa</b>, herencia de un proceso histórico de <b>despojo, desfinanciación del campo y debilitamiento de las identidades culturales</b>. La próxima parte cuenta esa historia.</p>
</div>
