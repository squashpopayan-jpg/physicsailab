<section>
<h2>Cómo funciona el curso</h2>
<ol class="steps">
  <li><b>Lee una lección.</b> Cada una es corta y tiene dibujos y esquemas. Con los botones <b>A−</b> y <b>A+</b> de arriba cambias el tamaño de la letra.</li>
  <li><b>Haz las pausas de repaso.</b> En medio de la lección hay una pregunta con cuatro respuestas. Si fallas, la lección te explica por qué.</li>
  <li><b>Haz el quiz de la parte.</b> Al final de cada una de las cuatro partes hay 10 preguntas, de a una por pantalla.</li>
  <li><b>Presenta el examen final.</b> Son 40 preguntas de todo el curso. Al final ves tu nota por parte y qué lecciones repasar.</li>
</ol>
<div class="box idea">
  <p class="bt">Para moverte fácil</p>
  <ul>
    <li>En el computador, el <b>índice</b> está a la izquierda. En el celular, toca el botón <b>Índice</b> arriba.</li>
    <li>Abajo de cada lección hay botones grandes para ir a la <b>anterior</b> o a la <b>siguiente</b>.</li>
    <li>En los quizzes puedes responder con el teclado: letras <b>A, B, C, D</b> y <b>Enter</b> para seguir.</li>
    <li>El curso recuerda lo que ya leíste y tus mejores notas en este mismo navegador.</li>
  </ul>
</div>
</section>

<section>
<h2>Sobre la cartilla que estudiamos</h2>
<p>La <span class="term">Cartilla PEC</span> recoge las palabras y reflexiones de mingas, encuentros y asambleas en el resguardo Nasa de Novirao, municipio de Totoró, Cauca. Participaron autoridades, dinamizadores, estudiantes, docentes, líderes y lideresas, con el acompañamiento del Ministerio de Educación Nacional.</p>
<div class="box ojo">
  <p class="bt">Qué páginas cubre este curso</p>
  <p>La copia que se usó para armar el curso incluye las páginas de presentación, contexto, historia, tejidos, hilos, prácticas y vivencias, y el capítulo «¿Cómo vivenciamos el PEC?» hasta la planeación de clase (páginas 3 a 37), más los agradecimientos (páginas 60 y 61). Las páginas de fotografías de prácticas y vivencias no estaban en esa copia, así que el curso no las cubre.</p>
</div>
<p>El curso no cambia lo que dice la cartilla: la explica con palabras sencillas, la ordena en esquemas y te pregunta para que compruebes qué entendiste. Cuando algo es un ejemplo inventado para aprender, se dice claramente.</p>
