<header class="chapter-head">
  <span class="kicker">Parte IV · Lección 8</span>
  <h1>La pedagogía como camino</h1>
  <p class="lead">Ahora la cartilla pregunta: <b>¿cómo vivenciamos el PEC?</b> Antes de hablar de horarios y planeadores, la comunidad se detuvo a pensar qué es enseñar. Esta lección explica las ideas de fondo.</p>
</header>

<section>
<h2>Una tensión permanente</h2>
<p>Uno de los temas que más ha dialogado la comunidad es el <b>sentido de la educación propia</b>. Reconocen que existe una <span class="term">tensión permanente</span>: necesitan una educación…</p>
<div class="cols2">
  <div style="border-color:var(--leaf)"><h3>…profundamente pertinente</h3><p>para la <b>vida en el resguardo</b>.</p></div>
  <div style="border-color:var(--accent)"><h3>…que también permita responder</h3><p>a los <b>retos del mundo actual</b>.</p></div>
</div>
<div class="check" data-check="c08a"></div>
</section>

<section>
<h2>Primero el territorio, luego el diálogo, luego el servicio</h2>
<p>Los mayores orientaron que el Ser Nasa <b>no es solo una identidad étnica ni una referencia cultural</b>: es una <b>manera de ser</b>. El sol, la luna, las montañas, las aguas, las plantas, los animales, los seres espirituales y las personas comparten esa condición, porque todos participan de la vida, del equilibrio y de la fuerza de <span class="nasa">Uma Kiwe</span>.</p>
<p>De ahí se concluyó que los saberes <b>no están separados de la vida</b>: cada conocimiento tiene <b>una raíz territorial</b>. Entonces el camino de aprender tiene tres pasos:</p>
<figure class="fig card"><div class="gen" data-gen="intrainter"></div><figcaption>Intraculturalidad, interculturalidad, intraculturalidad: dos espirales unidas por una curva. Esquema rehecho para el curso a partir de la página 27.</figcaption></figure>
<ol class="steps">
  <li><b>Primero, el territorio.</b> Se parte del conocimiento que se produce en la relación directa del cuerpo y el espíritu con el territorio. (<i>Intraculturalidad</i>: mirar hacia la propia cultura.)</li>
  <li><b>Después, el diálogo.</b> Se dialoga con los saberes que nacen en otros lugares, porque «como Nasa somos seres de relación». (<i>Interculturalidad</i>.)</li>
  <li><b>Por último, el servicio.</b> Lo aprendido a lo largo de la vida se pone al servicio de la comunidad, «pues ningún conocimiento florece en soledad». (De nuevo <i>intraculturalidad</i>.)</li>
</ol>
<div class="check" data-check="c08b"></div>
</section>

<section>
<h2>La pedagogía no es solo un método</h2>
<div class="box idea">
  <p class="bt">Qué es la pedagogía, según la cartilla</p>
  <p>La pedagogía <b>no se reduce a un método ni a una técnica de enseñanza</b>. Es «el modo en que <b>caminamos, cuidamos, transmitimos y recreamos</b>» la condición y manera de ser Nasa en la familia, la comunidad y el territorio. Es <b>continuidad de la vida en movimiento</b>.</p>
</div>
<h3>Mediaciones, dimensiones y sentido</h3>
<p>La formación no ocurre en el vacío: la atraviesan las <span class="term">mediaciones</span>. Son señales que <b>no fragmentan al ser</b>, sino que orientan nuestras relaciones con el mundo y con los otros. Algunas se sienten más en lo político, otras en lo espiritual, lo intelectual o lo emocional, pero todas conviven en la <b>integralidad del ser</b>.</p>
<p>La comunidad les da un lugar en el proceso educativo comprendiéndolas en clave de las <span class="term">dimensiones del Ser Nasa</span>. Las dimensiones no son fragmentos: son <b>maneras de construir y expresar la experiencia de ser en el mundo</b>. Cada una abre la posibilidad de crear <b>sentidos y significados</b>.</p>

<div class="box idea">
  <p class="bt">El sentido pedagógico</p>
  <p>En la educación propia, el <b>sentido pedagógico</b> surge del entrelazamiento de las dimensiones, los sentidos y los significados. No se trata solo de enseñar: se trata de <b>dar sentido a la vida en comunidad</b> y construir un horizonte hacia el <span class="nasa">wët wët fxi'zenxi</span> (buen vivir). Es la posibilidad de <b>articular lo que cada quien siente y piensa con lo que como pueblo decidimos significar y proyectar</b>.</p>
</div>

<section>
<h2>El movimiento: la semilla que avanza en espiral</h2>
<figure class="fig"><img src="img:paisaje" alt="Un gorrión con las alas abiertas junto a un paisaje de montañas, un río y personas sembrando maíz. Ilustración de la cartilla."><figcaption>«La raíz del conocimiento está en el territorio que pisamos y en el aire que respiramos.» Cartilla, página 29.</figcaption></figure>
<p>De esta discusión salió un elemento fundamental para hacer educación propia: <b>el movimiento</b>. Es el principio que recuerda que <b>todo conocimiento, toda práctica y toda vivencia están en transformación</b>. Nada permanece quieto: así como la semilla germina, crece y se convierte en fruto, la educación propia también <b>avanza en espiral</b>, renovando su fuerza en cada ciclo.</p>
<div class="box cita">
  <p>«La raíz del conocimiento está en el territorio que pisamos y en el aire que respiramos. Con eso claro extendemos nuestras alas hacia otros territorios, porque sabemos que el vuelo se sostiene tanto en la raíz como en el horizonte. Educar no es acumular métodos: es aprender a vivir en equilibrio con lo que somos y con lo que compartimos.»</p>
  <p class="quien">Cartilla PEC, página 29</p>
</div>
<div class="box recordar">
  <p class="bt">Para recordar</p>
  <ul>
    <li>Tensión: educación <b>pertinente para el resguardo</b> y que responda a los <b>retos del mundo actual</b>.</li>
    <li>Orden de aprender: <b>territorio → diálogo con otros → servicio a la comunidad</b>.</li>
    <li>Pedagogía = el modo de caminar, cuidar, transmitir y recrear el Ser Nasa, no solo un método.</li>
    <li><b>Sentido</b> = lo íntimo. <b>Significado</b> = lo compartido.</li>
    <li>Principio del <b>movimiento</b>: todo se transforma, en espiral.</li>
  </ul>
</div>
