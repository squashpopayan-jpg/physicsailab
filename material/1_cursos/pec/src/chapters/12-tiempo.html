<header class="chapter-head">
  <span class="kicker">Parte IV · Lección 9</span>
  <h1>Resignificar el tiempo escolar</h1>
  <p class="lead">Para vivir el PEC en la escuela, la comunidad propone tres cambios. El primero es cambiar cómo se usa el tiempo: así nacieron los <b>jueves de escuela comunitaria</b>.</p>
</header>

<section>
<h2>Los tres elementos para fortalecer el PEC</h2>
<ol class="steps">
  <li><b>La resignificación del tiempo escolar</b> (esta lección).</li>
  <li><b>La armonización de la estructura</b> para el tejido de formación (lección 10).</li>
  <li><b>La unificación de los instrumentos de planeación y seguimiento</b> (lección 11).</li>
</ol>
<p>Con ellos buscan que la práctica educativa sea coherente con el PEC y que el trabajo docente sea <b>reflejo del movimiento y la integralidad</b> de la educación propia.</p>
</section>

<section>
<h2>«El tiempo es como el vuelo»</h2>
<div class="box cita">
  <p>«El tiempo es como el vuelo: se abre, se acomoda, se ajusta al viento. De manera que caminar desde el andar del tiempo es aprender a volar distinto, para que cada semilla encuentre su propio aire y cada hilo pueda sostener el vuelo colectivo.»</p>
  <p class="quien">Cartilla PEC, página 31</p>
</div>
<p>Lo primero que hicieron en la institución fue <b>resignificar la jornada escolar</b>. Entendieron que el tiempo no podía seguir siendo un espacio <b>rígido, fragmentado y desconectado</b> de la vida de la comunidad.</p>
</section>

<section>
<h2>Primera versión: cinco grupos que rotan</h2>
<p>Los <b>jueves</b> se transformaron en <span class="term">jueves de escuela comunitaria</span>.</p>
<div class="cards">
  <div class="card"><div class="big">200</div><p>estudiantes en total</p></div>
  <div class="card"><div class="big">5</div><p>grupos heterogéneos: desde niños de <b>transición</b> hasta jóvenes de <b>grado once</b></p></div>
  <div class="card"><div class="big">≈40</div><p>estudiantes por grupo</p></div>
  <div class="card"><div class="big">3</div><p>dinamizadores acompañan a cada grupo</p></div>
</div>
<p>Durante toda la jornada, <b>un hilo trabajaba con un grupo</b>. Cada jueves los estudiantes rotaban, hasta que <b>todos pasaran por todos los hilos</b>.</p>
<div class="check" data-check="c09a"></div>
</section>

<section>
<h2>Cuatro miradas que hay que armonizar</h2>
<p>Con ese caminar se vio que en el tejer de los hilos se encontraban y debían <b>armonizarse cuatro perspectivas</b>:</p>
<figure class="fig card" aria-label="Las cuatro perspectivas">
  <div class="cards" style="margin:0">
    <div class="card" style="border-top:12px solid var(--leaf)"><h3>1 · Las semillas</h3><p>Los intereses de niños, niñas, adolescentes y jóvenes, <b>llenos de curiosidad y creatividad</b>.</p></div>
    <div class="card" style="border-top:12px solid var(--earth)"><h3>2 · Madres y padres</h3><p>Sus expectativas, muchas veces inclinadas a un <b>modelo tradicional</b> centrado en el requerimiento del <b>ICFES</b>.</p></div>
    <div class="card" style="border-top:12px solid var(--maroon)"><h3>3 · El cabildo y los mayores</h3><p>La visión política y organizativa de mayores y mayoras, <b>guardianes de la Ley de Origen</b> y de la autoridad propia.</p></div>
    <div class="card" style="border-top:12px solid var(--accent)"><h3>4 · Maestros y maestras</h3><p>Tensionados entre esas tres miradas y a la vez respondiendo a la <b>institucionalidad educativa oficial</b>.</p></div>
  </div>
  <figcaption>Las cuatro perspectivas de la página 32 de la cartilla.</figcaption>
</figure>
<div class="check" data-check="c09b"></div>
</section>

<section>
<h2>Segunda versión: el acuerdo con las voces de los estudiantes</h2>
<figure class="fig small"><img src="img:joven" alt="Un joven con sombrero de paja y pañuelo verde. Ilustración de la cartilla."></figure>
<p>Ante esta realidad hicieron un <b>diagnóstico con los estudiantes</b> para conocer sus intereses y resignificar la jornada a partir de sus voces. De ese diálogo nació un <b>acuerdo nuevo</b>: mantener los jueves como día de escuela comunitaria, pero con una estructura en la que <b>toda la institución pasa por todos los hilos al mismo tiempo</b>.</p>
<figure class="fig card" aria-label="Cómo se organiza el jueves de escuela comunitaria">
  <div style="display:grid;gap:10px">
    <div class="sched"><div style="background:var(--surface-2);border-radius:12px;padding:10px;font-weight:700;display:grid;place-items:center;text-align:center">Primeras 2 horas</div><div style="background:var(--h1);color:var(--on-h1);border-radius:12px;padding:14px;font-family:var(--font-head);font-weight:800;font-size:1.15em">Hilo Agroambiental<br><span style="font-family:var(--font-ui);font-weight:400;font-size:.8em">Proyectos productivos escolares</span></div></div>
    <div class="sched"><div style="background:var(--surface-2);border-radius:12px;padding:10px;font-weight:700;display:grid;place-items:center;text-align:center">Siguientes 2 horas</div><div style="background:var(--h3);color:var(--on-h3);border-radius:12px;padding:14px;font-family:var(--font-head);font-weight:800;font-size:1.15em">Hilo de Artes y Culturas<br><span style="font-family:var(--font-ui);font-weight:400;font-size:.8em">Expresión artística y cultural</span></div></div>
    <div class="sched"><div style="background:var(--surface-2);border-radius:12px;padding:10px;font-weight:700;display:grid;place-items:center;text-align:center">Últimas 2 horas</div><div style="background:var(--h4);color:var(--on-h4);border-radius:12px;padding:14px;font-family:var(--font-head);font-weight:800;font-size:1.15em">Hilo de Bienestar y Deporte<br><span style="font-family:var(--font-ui);font-weight:400;font-size:.8em">Una de las actividades más queridas</span></div></div>
    <div style="background:var(--h2);color:var(--on-h2);border-radius:12px;padding:12px 14px"><b style="font-family:var(--font-head);font-size:1.1em">Hilo de Derecho Mayor y Gobernanza</b><br><span style="font-size:.85em">Trabajo específico con la <b>Guardia Escolar</b> y el <b>Cabildo Escolar</b></span></div>
    <div style="background:var(--h5);color:var(--on-h5);border-radius:12px;padding:12px 14px"><b style="font-family:var(--font-head);font-size:1.1em">Hilo de Comunicación y Lenguajes</b><br><span style="font-size:.85em"><b>Eje transversal</b>: acompaña a todos los hilos y promueve la lengua materna y el acercamiento a otros idiomas</span></div>
  </div>
