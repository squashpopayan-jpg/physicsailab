<header class="chapter-head">
  <span class="kicker">Parte III · Lección 7</span>
  <h1>Prácticas, vivencias y la semilla</h1>
  <p class="lead">Hay dos palabras que parecen iguales y no lo son: <b>prácticas</b> y <b>vivencias</b>. Y hay una imagen que las une: cada persona es una <b>semilla</b> que madura en espiral.</p>
</header>

<figure class="fig"><img src="img:siembra" alt="Una mayora, un niño y una joven siembran plantas pequeñas en la huerta, con un gorrión en una rama. Ilustración de la cartilla."><figcaption>«Las vivencias de nuestras familias, las prácticas de la comunidad son expresiones de nuestra lucha.» Cartilla, página 23.</figcaption></figure>

<section>
<h2>Prácticas y vivencias: la diferencia</h2>
<div class="tablewrap"><table>
  <thead><tr><th></th><th>Prácticas</th><th>Vivencias</th></tr></thead>
  <tbody>
    <tr><td><b>¿Qué son?</b></td><td>Actividades o ejercicios hechos para <b>adquirir habilidades o conocimientos específicos</b>.</td><td>Expresiones ancestrales fundamentales que han garantizado la <b>pervivencia de los pueblos</b>.</td></tr>
    <tr><td><b>¿Cómo son?</b></td><td>Exigen participación activa, constancia y esfuerzo. Se <b>planifican y se hacen de manera organizada</b>.</td><td>Ya están <b>incorporadas en las personas</b> (las semillas) y se realizan en la vida cotidiana individual, familiar y colectiva.</td></tr>
    <tr><td><b>¿Cuánto duran?</b></td><td>Acompañan a las semillas en sus momentos de maduración.</td><td>Tienen un carácter <b>más permanente y colectivo</b>: se interiorizan y se manifiestan a largo plazo.</td></tr>
    <tr><td><b>¿Para qué?</b></td><td>Para generar aprendizajes, saberes, habilidades y valores, y que <b>se enraícen las vivencias</b>.</td><td>Generan una <b>identidad diferenciada</b> y vitalizan la cultura; sirven para afrontar los desafíos de toda la vida.</td></tr>
  </tbody>
</table></div>
<div class="box idea">
  <p class="bt">La relación entre las dos</p>
  <p>Las <b>prácticas</b> se planifican en la escuela para que, con el tiempo, las <b>vivencias echen raíz</b>. Para eso es importante enfatizar el <b>enraizamiento de los saberes propios ancestrales</b> y también los <b>diálogos de saberes</b> en el marco de la interculturalidad.</p>
</div>
<p>Tanto las prácticas como las vivencias pueden ser <b>individuales o colectivas</b>. Para que sean colectivas, deben conectarse con la <b>identidad</b> y con la <b>memoria del pueblo</b>.</p>

<div class="check" data-check="c07b"></div>
</section>

<section>
<h2>La espiral de maduración de la semilla</h2>
<p>Para desarrollar prácticas y vivencias, la comunidad definió los <b>momentos de maduración de la semilla</b>. Representan «el caminar de la vida del ser Nasa, porque cada uno de nosotros somos semilla en relación con <span class="nasa">Uma Kiwe</span>».</p>
<figure class="fig card"><div class="gen" data-gen="espiral"></div><figcaption>Espiral de maduración de la semilla, de adentro hacia afuera. Esquema rehecho para el curso a partir de la página 25 de la cartilla.</figcaption></figure>
<ol class="steps leaf">
  <li><b>Siembra.</b> El comienzo.</li>
  <li><b>Germinación.</b> La semilla despierta.</li>
  <li><b>Crecimiento.</b> Sigue creciendo.</li>
  <li><b>Floración.</b> Florece en comunidad.</li>
  <li><b>Fructificación.</b> Da fruto en lo colectivo.</li>
  <li><b>Nueva semilla.</b> Se proyecta en nuevas semillas que transforman el territorio.</li>
</ol>
<div class="box cita">
  <p>«Cada Nasa es semilla que germina, florece en comunidad, fructifica en lo colectivo y se proyecta en nuevas semillas que transforman el territorio y sanan la memoria de quienes estuvieron antes y de quienes vendrán después.»</p>
  <p class="quien">Cartilla PEC, página 25</p>
</div>
<div class="box palabra">
  <p class="bt">¿Por qué espiral y no círculo?</p>
  <p>La espiral recuerda el <b>movimiento del sol y de la tierra</b>. La vida «nunca se cierra en un círculo, sino que siempre se abre a nuevas oportunidades de florecer y pervivir».</p>
</div>
<div class="check" data-check="c07c"></div>
<div class="check" data-check="c07d"></div>
</section>

<section>
<h2>El calendario propio</h2>
<figure class="fig small"><img src="img:fogon" alt="Un fogón encendido del que salen colibríes y paisajes de montaña. Ilustración de la cartilla."></figure>
<p>El <span class="term">calendario propio</span> es una herramienta para <b>ordenar el proceso educativo</b> según los ciclos de la naturaleza, los ciclos productivos, la dinámica social y comunitaria, el territorio y la espiritualidad.</p>
<div class="box ojo">
  <p class="bt">Todavía pendiente</p>
  <p>La cartilla dice que su elaboración <b>aún está pendiente</b> y está <b>proyectada para el año 2026</b>.</p>
</div>
<div class="ave">
  <div class="av" role="img" aria-label="Dxi'jan, el ave guía"></div>
  <div><p><b class="nom">Dxi'jan:</b> «Yo sé que todavía nos falta mucho por tejer… Nosotros no hacemos los nidos de la noche a la mañana: los construimos <b>pajita por pajita</b>, con paciencia, con cuidado y con lo que nos da el territorio. Así mismo vamos levantando nuestra escuela: práctica por práctica, vivencia por vivencia, hasta que el tejido quede firme y nos sostenga a todos.»</p></div>
</div>
<div class="box recordar">
  <p class="bt">Para recordar</p>
  <ul>
    <li><b>Práctica</b> = ejercicio planificado para aprender algo específico. <b>Vivencia</b> = expresión ancestral ya incorporada en las personas, más permanente y colectiva.</li>
    <li>Las prácticas ayudan a que las vivencias <b>se enraícen</b>.</li>
    <li>Espiral de la semilla: <b>siembra → germinación → crecimiento → floración → fructificación → nueva semilla</b>.</li>
    <li>El calendario propio está pendiente, proyectado para 2026.</li>
  </ul>
</div>
