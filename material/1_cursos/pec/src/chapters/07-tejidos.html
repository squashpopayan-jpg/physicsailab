  <h1>Los dos tejidos</h1>
  <p class="lead">¿Cómo resignificar (darle un nuevo sentido a) el PEC? La comunidad lo hizo con una imagen del tejido. De ahí salen dos grandes ideas: el <b>tejido de vida</b> y el <b>tejido de sabidurías y conocimientos</b>.</p>

<section>
<h2>Del trabajo suelto al tejido</h2>
<p>La comunidad ya trabajaba con proyectos productivos y transversales. Pero sentía que «todo estaba un poco <b>suelto</b>, como si fueran actividades aisladas, sin relación con lo que soñábamos como comunidad».</p>
<p>Por eso, al pensar el Proyecto Educativo Comunitario en el marco del SEIP, decidieron <b>detenerse, conversar y ponerse de acuerdo</b> sobre lo que significa educar en el territorio. Así nacieron dos comprensiones que hoy los orientan:</p>

<section>
<h2>El tejido de vida</h2>
<figure class="fig"><img src="img:tejedora" alt="Una mujer con sombrero teje cintas de colores junto a un gorrión que abre las alas. Ilustración de la cartilla."><figcaption>Cartilla, página 15.</figcaption></figure>
<div class="box idea">
  <p class="bt">Definición, en palabras sencillas</p>
  <p>El <span class="term">tejido de vida</span> es el conjunto de cosas fundamentales que <b>sostienen la vida de un pueblo</b> y garantizan que <b>permanezca en el tiempo</b>, manteniéndose culturalmente diferente aunque haya cambios, intercambios y adaptaciones.</p>
</div>
<p>Incluye formas de ser, conocimientos, saberes y vivencias que se ven en la <b>cultura, la lengua, los sistemas de saber, la simbología, el sentido estético y la espiritualidad</b>.</p>
<p>Para el pueblo Nasa, el tejido de vida se manifiesta en estas dimensiones:</p>
<div class="cards">
  <div class="card"><h3>Espiritual</h3></div><div class="card"><h3>Histórica</h3></div><div class="card"><h3>Política</h3></div><div class="card"><h3>Cultural</h3></div>
  <div class="card"><h3>Económica</h3></div><div class="card"><h3>Material</h3></div><div class="card"><h3>Expresiones artísticas</h3></div><div class="card"><h3>La lengua</h3></div>
</div>
<div class="box recordar">
  <p class="bt">Otra forma de decirlo</p>
  <p>El tejido de vida es la <b>red de relaciones</b> que une a los ancestros con las personas, las familias, la comunidad, el territorio y el universo. Se ve en el día a día: la tulpa, los rituales, la comunicación, el trabajo y la memoria, en busca del <span class="nasa">wët wët fxi'zenxi</span> (buen vivir).</p>
</div>
<figure class="fig"><img src="img:mural" alt="Un mural de lana y materiales: sol, luna, estrella, espirales, una familia alrededor de un fogón, el territorio y una planta, con palabras en Nasa Yuwe en el borde."><figcaption>Una representación del tejido de vida hecha por la comunidad, con palabras en <i>Nasa Yuwe</i> (cartilla, página 18).</figcaption></figure>
<div class="check" data-check="c05b"></div>
</section>

<section>
<h2>El tejido de sabidurías y conocimientos</h2>
<p>Este tejido <b>nace de la necesidad de fortalecer el tejido de vida</b>. Habla de cómo la comunidad ha <b>construido, transmitido y recreado</b> su educación. Tiene dos tareas a la vez:</p>
<div class="cols2">
  <div><h3>Hacia adentro</h3><p>Establecer los elementos <b>políticos, filosóficos y vivenciales</b> de la educación propia.</p></div>
  <div><h3>Hacia afuera</h3><p>Ser un espacio de <b>diálogo intercultural</b>, donde los saberes propios se encuentran con los conocimientos de la humanidad.</p></div>
</div>
<p>Se concreta <b>organizando los saberes, conocimientos, vivencias y prácticas</b> que las nuevas generaciones deben aprender, incorporar y apropiar. Une el tejido de vida con el tejido de sabidurías «en procesos educativos concretos», para <b>formar para la pervivencia, la identidad y la autonomía</b>.</p>
<div class="box recordar">
  <p class="bt">Para recordar</p>
  <ul>
    <li>Antes los proyectos estaban <b>sueltos</b>; ahora se ponen de acuerdo para <b>tejerlos</b>.</li>
    <li><b>Tejido de vida</b> = red de relaciones que sostiene la vida del pueblo.</li>
    <li><b>Tejido de sabidurías y conocimientos</b> = cómo se enseña, se aprende y se dialoga con otros.</li>
    <li>Su meta: formar para la <b>pervivencia, la identidad y la autonomía</b>.</li>
  </ul>
</div>
<div class="check" data-check="c05c"></div>
