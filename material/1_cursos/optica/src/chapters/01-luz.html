<p class="lead">¿Qué es la luz? La pregunta ocupó a Newton y a Huygens, tuvo una respuesta aparentemente definitiva con Maxwell y se reabrió con Planck y Einstein. Hoy sabemos que la luz es una onda electromagnética cuya energía se intercambia en paquetes, los fotones. Este capítulo recorre esa historia, mide la velocidad de la luz con los métodos que la hicieron posible, ordena el espectro y presenta los cuatro modelos con los que trabaja la óptica.</p>

<section>
<h2>Partículas y ondas: una discusión de tres siglos</h2>
<p>En 1704 Isaac Newton publicó su <em>Opticks</em>, donde describía la luz como una corriente de corpúsculos. El modelo explicaba la propagación rectilínea y la reflexión, y atribuía la refracción a una atracción del vidrio sobre las partículas, que por eso debían ir <b>más rápido</b> en el vidrio que en el aire. Christiaan Huygens había propuesto en 1690 lo contrario: la luz sería una perturbación que se propaga como una onda, y cada punto del frente de onda actúa como fuente de ondas secundarias. Su construcción explica la refracción si la luz va <b>más despacio</b> en el vidrio.</p>
<p>El prestigio de Newton mantuvo el modelo corpuscular durante un siglo. Lo derribaron tres experimentos: las franjas de interferencia de Thomas Young (1801), que solo se entienden si dos haces de luz pueden anularse; la teoría de la difracción de Augustin Fresnel (1818), que predijo con exactitud los patrones de sombras; y la medida de Léon Foucault (1850), que mostró que la luz es más lenta en el agua que en el aire.</p>
<p>En 1865 James Clerk Maxwell unificó la electricidad y el magnetismo y encontró que sus ecuaciones admitían ondas que viajan a \(1/\sqrt{\eo\mo}\), un número que coincidía con la velocidad medida de la luz. Concluyó que la luz es una onda electromagnética; Heinrich Hertz produjo esas ondas con circuitos en 1887. Pero en 1900 Max Planck solo pudo explicar el espectro de un cuerpo caliente suponiendo que la energía se intercambia en cuantos \(h\nu\), y en 1905 Albert Einstein explicó el efecto fotoeléctrico con cuantos de luz: los <span class="term">fotones</span>.</p>
<div class="box hist"><h4>La onda y el fotón no compiten</h4><p>La electrodinámica cuántica, terminada hacia 1950, describe la luz como un campo cuántico: sus estados se propagan e interfieren como ondas, y se detectan en eventos discretos de energía \(h\nu\). Cuando muchos fotones ocupan el mismo modo, el campo se comporta como la onda clásica de Maxwell. Por eso la mayor parte de la óptica se hace con ondas, y el fotón aparece cuando la luz es muy débil o cuando interesa cómo se emite y se absorbe (capítulos 24 y 28).</p></div>
</section>

<section>
<h2>La velocidad de la luz</h2>
<p>Galileo intentó medirla con linternas entre dos colinas y concluyó que era demasiado grande para sus métodos. La primera estimación llegó de la astronomía. En 1676 Ole Rømer notó que los eclipses de Ío, la luna de Júpiter, se adelantaban cuando la Tierra se acercaba a Júpiter y se atrasaban cuando se alejaba: la luz tardaba más en cruzar la distancia mayor. La diferencia máxima es el tiempo que la luz tarda en atravesar el diámetro de la órbita terrestre, \(2\,\text{UA}/c=998\) s. Rømer estimó unos 22 minutos; con el tamaño de la órbita que se conocía entonces, Huygens dedujo \(c\approx2.2\times10^8\) m/s.</p>
<div class="sim" data-sim="romer" data-title="Rømer y los eclipses de Ío"></div>
<div class="sim-guide"><ul>
<li>Mueva el tiempo a lo largo de un año: cuando la Tierra se aleja de Júpiter, cada eclipse llega con un retraso que se acumula hasta casi 17 minutos.</li>
<li>Cambie la velocidad de la luz supuesta: el retraso máximo es \(2\,\text{UA}/c\). Con el valor de Rømer (22 min), \(c\) sale un 25 % menor.</li>
</ul></div>
<p>En 1729 James Bradley descubrió la <span class="term">aberración estelar</span>: las estrellas describen pequeñas elipses de 20.5″ porque la Tierra se mueve a 29.8 km/s y la dirección aparente de la luz se inclina en un ángulo \(v/c\). El primer método terrestre fue el de Hippolyte Fizeau (1849): un haz pasaba entre los dientes de una rueda, recorría 8633 m hasta un espejo y volvía. Si en ese tiempo la rueda giraba medio diente, el diente siguiente bloqueaba el regreso.</p>
<div class="eq key" data-name="Rueda de Fizeau">\[\frac{2L}{c}=\frac{1}{2N\nu}\quad\Longrightarrow\quad c=4NL\nu.\]</div>
<p>Con \(N=720\) dientes y la primera extinción a 12.6 vueltas por segundo, Fizeau obtuvo 313 000 km/s. Foucault reemplazó la rueda por un espejo giratorio y en 1862 midió 298 000 km/s. Albert Michelson perfeccionó el método durante cincuenta años: en 1926, con un recorrido de 35 km entre dos montañas de California, obtuvo \(299\,796\pm4\) km/s.</p>
<div class="sim" data-sim="fizeau" data-title="La rueda dentada de Fizeau"></div>
<div class="sim-guide"><ul>
<li>Aumente la velocidad de la rueda y observe la intensidad que regresa: se anula en \(\nu=c/4NL\) y en sus múltiplos impares.</li>
<li>Con los datos reales de Fizeau, la primera extinción ocurre a 12.06 vueltas/s. El valor que él leyó, 12.6, explica su error del 4 %.</li>
</ul></div>
<div class="box def"><h4>El metro se define con la luz</h4><p>Desde 1983 la velocidad de la luz en el vacío vale exactamente \(c=299\,792\,458\) m/s, y el metro es la distancia que recorre la luz en \(1/299\,792\,458\) s. Medir la velocidad de la luz ya no tiene sentido en unidades del SI: lo que se mide son longitudes, con interferómetros y relojes atómicos.</p></div>
</section>

<section>
<h2>El espectro electromagnético</h2>
<p>Toda onda electromagnética en el vacío cumple \(c=\lambda\nu\). Lo que llamamos luz visible es la estrecha franja que detecta el ojo humano, de unos 380 a 780 nm. A cada frecuencia le corresponde una energía del fotón</p>
<div class="eq key" data-name="Energía del fotón">\[E=h\nu=\frac{hc}{\lambda},\qquad E\,[\text{eV}]\approx\frac{1239.84}{\lambda\,[\text{nm}]}.\]</div>
<p>Un fotón verde de 550 nm tiene una frecuencia de \(5.45\times10^{14}\) Hz y una energía de 2.25 eV, del orden de las energías de los enlaces químicos: por eso la luz visible produce reacciones en la retina y en las hojas. Los fotones ultravioleta de 254 nm de una lámpara germicida (4.88 eV) rompen enlaces del ADN; los de rayos X de 0.1 nm (12.4 keV) atraviesan los tejidos blandos. En el otro extremo, una emisora de FM de 100 MHz emite ondas de 3 m con fotones de \(4\times10^{-7}\) eV, que ningún detector registra uno a uno.</p>
<div class="sim" data-sim="espectro" data-title="Recorrido por el espectro electromagnético"></div>
<div class="sim-guide"><ul>
<li>Desplace la longitud de onda en escala logarítmica, de los rayos gamma a las ondas de radio, y lea la frecuencia, la energía del fotón y una fuente típica de cada región.</li>
<li>Dentro del visible aparece el color que corresponde a esa luz monocromática, calculado con las funciones de color de la CIE.</li>
</ul></div>

<section>
<h2>La luz en un medio: el índice de refracción</h2>
<p>En un medio transparente la luz avanza más despacio. El cociente entre la velocidad en el vacío y la velocidad de fase en el medio es el <span class="term">índice de refracción</span>:</p>
<div class="eq key" data-name="Índice de refracción">\[n=\frac{c}{v}.\]</div>
<p>Al entrar en el medio la frecuencia no cambia, porque la impone la fuente y las cargas del medio oscilan a esa frecuencia. Lo que cambia es la longitud de onda: \(\lambda=\lambda_0/n\). La luz roja de un láser de He–Ne, de 632.8 nm en el vacío, tiene 475 nm dentro del agua, pero sigue viéndose roja: el ojo responde a la frecuencia, que no ha cambiado. El índice depende de la longitud de onda (dispersión, capítulo 5): a 550 nm vale 1.0003 en el aire, 1.335 en el agua, 1.519 en el vidrio N-BK7 y 2.423 en el diamante.</p>
<div class="sim" data-sim="luz-medio" data-title="Una onda que entra en un vidrio"></div>
<div class="sim-guide"><ul>
<li>Las crestas se acercan dentro del medio: la longitud de onda se reduce en el factor \(n\) mientras el número de crestas que pasa por segundo es el mismo a ambos lados.</li>
<li>Los dos marcadores salen juntos del borde izquierdo: el que viaja por el medio llega tarde en proporción a \(n\).</li>
</ul></div>
<div class="box warn"><h4>Índices respecto del vacío y respecto del aire</h4><p>Los catálogos de vidrios y muchas tablas de líquidos dan el índice relativo al <b>aire</b>, \(n_{rel}=n/n_{aire}\). La diferencia, 0.03 %, importa en óptica de precisión: el agua a 20 °C tiene \(n=1.33335\) respecto del vacío en 589.3 nm y \(1.33299\) respecto del aire, que es la cifra de las tablas clásicas.</p></div>
</section>

<section>
<h2>Cuatro modelos de la luz</h2>
<p>La óptica usa cuatro descripciones, cada una válida en un dominio:</p>
<ul>
<li><b>Óptica geométrica</b> (capítulos 4 a 11). La luz viaja en rayos que obedecen las leyes de la reflexión y de la refracción. Es exacta cuando las aberturas y los objetos son mucho mayores que la longitud de onda; ignora la difracción.</li>
<li><b>Óptica ondulatoria escalar</b> (capítulos 12 a 19). La luz es una onda con fase y amplitud; explica la interferencia, la difracción y el límite de resolución de cualquier instrumento.</li>
<li><b>Óptica electromagnética</b> (capítulos 2 y 20 a 23). La luz es un campo vectorial: aparecen la polarización, las fórmulas de Fresnel y la interacción con los electrones de la materia.</li>
<li><b>Óptica cuántica</b> (capítulos 24 y 28). La energía de la luz llega en fotones: explica el láser, el ruido de detección y los estados de luz sin análogo clásico.</li>
</ul>
<p>Cada modelo es un límite del siguiente. El rayo es la normal al frente de onda cuando \(\lambda\to0\); la onda escalar es una componente del campo electromagnético cuando la polarización no importa; la onda clásica es el promedio de muchos fotones en el mismo modo.</p>
<div class="box ex"><h4>La luz entre Popayán y Bogotá</h4><p>Las dos ciudades están a unos 378 km en línea recta. La luz tarda 1.26 ms en recorrer esa distancia en el vacío y, por una fibra óptica de índice de grupo 1.468 que siguiera el mismo trazado, 1.85 ms. Un mensaje real tarda más porque la fibra sigue las carreteras y atraviesa equipos de conmutación.</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule la frecuencia y la energía del fotón de la luz roja de 650 nm de un puntero láser.
<details><summary>Respuesta</summary><p>\(\nu=c/\lambda=4.61\times10^{14}\) Hz; \(E=1239.84/650=1.91\) eV \(=3.06\times10^{-19}\) J.</p></details></li>
<li><span class="lvl">Básico</span>¿Cuál es la longitud de onda de la luz de 589 nm (vacío) dentro de un vidrio de índice 1.52? ¿Y su velocidad?
<details><summary>Respuesta</summary><p>\(\lambda=589/1.52=387\) nm; \(v=c/1.52=1.97\times10^8\) m/s.</p></details></li>
<li><span class="lvl">Intermedio</span>Con la rueda de Fizeau (720 dientes, 8633 m), ¿a qué velocidad de giro aparece la segunda extinción?
<details><summary>Respuesta</summary><p>Las extinciones ocurren en \(\nu=(2k-1)c/4NL\); la segunda, \(k=2\): \(\nu=3\times12.06=36.2\) vueltas/s.</p></details></li>
<li><span class="lvl">Intermedio</span>La Tierra se mueve a 29.78 km/s en su órbita. Calcule el ángulo de aberración máximo en segundos de arco.
<details><summary>Respuesta</summary><p>\(\alpha=v/c=9.93\times10^{-5}\) rad \(=20.5''\).</p></details></li>
<li><span class="lvl">Avanzado</span>Un pulso de luz tarda 2.51 s en ir a la Luna y volver, rebotando en los retrorreflectores del Apolo. ¿A qué distancia está la Luna? ¿Qué precisión en el tiempo hace falta para medir esa distancia con un error de 1 cm?
<details><summary>Respuesta</summary><p>\(d=ct/2=3.76\times10^8\) m; \(\Delta t=2\Delta d/c=67\) ps.</p></details></li>
</ol>
