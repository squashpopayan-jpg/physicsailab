<template class="chapter-src" data-id="dispersion-prismas" data-num="5" data-title="Dispersión, prismas y arcoíris" data-part="Parte II · Óptica geométrica" data-short="El índice de refracción depende del color: fórmulas de Cauchy y Sellmeier, número de Abbe y vidrios crown y flint; la desviación del prisma y su mínimo; el arcoíris de Descartes, el secundario y la banda de Alejandro; los halos de hielo">
<p class="lead">En 1666 Newton hizo pasar un rayo de sol por un prisma y vio en la pared una banda de colores. Probó con un segundo prisma que cada color ya no se descomponía más: la luz blanca es una mezcla, y el vidrio desvía cada componente en un ángulo distinto porque su índice depende de la longitud de onda. Esta <span class="term">dispersión</span> separa los colores en los espectroscopios, colorea las aristas de las imágenes de una lente simple y pinta el arcoíris en el cielo.</p>

<section>
<h2>El índice depende de la longitud de onda</h2>
<p>En los materiales transparentes el índice disminuye al aumentar la longitud de onda: es la <span class="term">dispersión normal</span>. El vidrio N-BK7 tiene \(n=1.5224\) en la línea azul F del hidrógeno (486.1 nm) y \(n=1.5143\) en la roja C (656.3 nm). Augustin Cauchy propuso en 1836 la fórmula empírica</p>
<div class="eq">\[n(\lambda)=A+\frac{B}{\lambda^2},\]</div>
<p>que basta en un intervalo estrecho: ajustada a N-BK7 en F y C da \(A=1.5045\), \(B=4.22\times10^{-3}\) µm² y reproduce el índice en la línea d con un error de \(5\times10^{-5}\). La fórmula que usan hoy los fabricantes es la de <span class="term">Sellmeier</span> (1871), que sale del modelo de osciladores de los electrones y de los iones de la red (capítulo 23):</p>
<div class="eq key" data-name="Fórmula de Sellmeier">\[n^2(\lambda)-1=\sum_i\frac{B_i\lambda^2}{\lambda^2-C_i}.\]</div>
<p>Los términos con \(C_i\) pequeño representan las resonancias ultravioletas y explican la subida del índice hacia el azul; el término con \(C_i\) grande, la absorción infrarroja. Con tres términos y los coeficientes del catálogo de Schott el índice de un vidrio se reproduce con un error de \(10^{-5}\) en todo el visible: este curso usa esos coeficientes para N-BK7, N-K5, N-F2 y N-SF11, y los de Malitson para la sílice, la fluorita y el zafiro.</p>
<p>La dispersión de un vidrio se resume con el <span class="term">número de Abbe</span>:</p>
<div class="eq key" data-name="Número de Abbe">\[\nu_d=\frac{n_d-1}{n_F-n_C},\]</div>
<p>donde \(d\) es la línea amarilla del helio (587.56 nm). Un número de Abbe alto significa poca dispersión. Los vidrios se clasifican en <span class="term">crown</span> (\(\nu_d&gt;50\), como N-BK7 con 64.2) y <span class="term">flint</span> (\(\nu_d&lt;50\), como N-F2 con 36.4 y N-SF11 con 25.7). Los flint contienen óxido de plomo o de titanio, que suben a la vez el índice y la dispersión. La combinación de un crown y un flint permite corregir el color de una lente (capítulo 9).</p>
<div class="sim" data-sim="sellmeier" data-title="Índice de refracción de vidrios y cristales reales"></div>
<div class="sim-guide"><ul>
<li>Las curvas salen de las fórmulas de Sellmeier de catálogo. Mueva el cursor de longitud de onda y compare los índices; las líneas verticales son las de Fraunhofer F, d y C.</li>
<li>El diagrama de Abbe a la derecha ubica cada vidrio por su índice y su número de Abbe: abajo a la izquierda los crown, arriba a la derecha los flint.</li>
</ul></div>
</section>

<section>
<h2>La desviación del prisma</h2>
<p>Un rayo que atraviesa un prisma de ángulo \(A\) se refracta dos veces y sale desviado un ángulo \(\delta\) respecto de su dirección original. Si \(\theta_1\) es el ángulo de incidencia en la primera cara y \(\theta_2'\) el de salida en la segunda, la geometría da</p>
<div class="eq">\[\delta=\theta_1+\theta_2'-A,\qquad\sen\theta_2'=n\,\sen\!\left(A-\arcsen\frac{\sen\theta_1}{n}\right).\]</div>
<p>Al girar el prisma la desviación pasa por un <span class="term">mínimo</span>, que se alcanza cuando el rayo atraviesa el prisma simétricamente (por reversibilidad, si no fuera simétrico habría dos mínimos). En ese caso</p>
<div class="eq key" data-name="Desviación mínima">\[n=\frac{\sen\frac{A+\delta_{min}}{2}}{\sen\frac{A}{2}}.\]</div>
<p>Medir \(\delta_{min}\) con un goniómetro es el método clásico para determinar el índice de un vidrio con cinco o seis cifras. Un prisma de 60° de N-BK7 tiene una desviación mínima de 38.6° en la luz amarilla y separa las líneas F y C en 0.71°; uno de N-SF11, 66.3° y 3.9°: por eso los espectroscopios de prisma usan vidrios flint. Cerca del mínimo la desviación casi no cambia con la orientación, lo que hace la medida robusta y las líneas espectrales nítidas.</p>
<div class="sim" data-sim="prisma" data-title="Prisma: desviación, mínimo y dispersión"></div>
<div class="sim-guide"><ul>
<li>Gire el prisma (ángulo de incidencia) y observe la curva \(\delta(\theta_1)\) para el rojo, el verde y el violeta. El mínimo ocurre cuando el rayo interior es paralelo a la base.</li>
<li>Con incidencias pequeñas aparece reflexión total en la segunda cara. Cambie el vidrio y el ángulo del prisma.</li>
</ul></div>
<div class="box note"><h4>Prismas que no dispersan</h4><p>Los binoculares usan prismas de Porro y las cámaras réflex un pentaprisma, en los que la luz entra y sale perpendicular a las caras y se desvía por reflexión total: no hay dispersión. El prisma de Amici combina un crown y un flint para dispersar sin desviar la luz amarilla, y se usa en los espectroscopios de visión directa.</p></div>
</section>

<section>
<h2>El arcoíris</h2>
<p>René Descartes explicó el arcoíris en 1637 trazando a mano miles de rayos a través de una gota esférica. Un rayo que entra en una gota a una distancia \(b\) del eje, con ángulo de incidencia \(\theta\) (\(\sen\theta=b/R\)) y ángulo de refracción \(\theta'\), sufre después \(k\) reflexiones internas y sale. Su desviación total es</p>
<div class="eq key" data-name="Desviación en una gota">\[D_k(\theta)=2(\theta-\theta')+k(\pi-2\theta').\]</div>
<p>Para \(k=1\) la desviación es mínima en el ángulo de incidencia que cumple</p>
<div class="eq">\[\cos^2\theta=\frac{n^2-1}{k(k+2)},\]</div>
<p>y alrededor de ese mínimo se acumulan muchos rayos: la luz que sale de las gotas se concentra en un cono de \(180°-D_{min}=42.1°\) alrededor del punto antisolar (la sombra de la cabeza del observador). Como el agua desvía más el violeta, el arco violeta está a 40.6° y el rojo a 42.5°: el rojo queda por fuera. El <span class="term">arco secundario</span>, con dos reflexiones, está a 50.1° (rojo) y 53.5° (violeta), con los colores invertidos y más tenue porque cada reflexión interna pierde luz. Entre los dos arcos ningún rayo de una o dos reflexiones llega al observador, y el cielo se ve más oscuro: es la <span class="term">banda de Alejandro</span> (Alejandro de Afrodisias, hacia el año 200).</p>
<div class="sim" data-sim="arcoiris" data-title="Rayos en una gota: el ángulo de Descartes"></div>
<div class="sim-guide"><ul>
<li>Cada rayo entra a una altura distinta. La curva de la derecha es la desviación: tiene un mínimo y los rayos vecinos al mínimo salen casi paralelos, concentrando la luz.</li>
<li>Elija una o dos reflexiones internas y cambie la longitud de onda: el ángulo del arco cambia con el índice del agua.</li>
</ul></div>
<p>Como el arco es un cono alrededor del punto antisolar, solo se ve cuando el Sol está a menos de 42° sobre el horizonte. En Popayán, a 2.4° de latitud norte, el Sol del mediodía está siempre a más de 64° de altura: los arcoíris aparecen en la mañana hacia el occidente y en la tarde hacia el oriente, cuando la lluvia de la tarde encuentra el Sol bajo. Cada observador ve su propio arcoíris, formado por gotas distintas. La teoría de Descartes no explica los <span class="term">arcos supernumerarios</span>, franjas pálidas por dentro del arco primario: son interferencia entre los dos rayos que salen con la misma desviación, y su espaciado depende del tamaño de las gotas (teoría de Airy de 1838 y la teoría exacta de Mie, capítulo 23).</p>
<div class="sim" data-sim="cielo-arcoiris" data-title="El arcoíris visto desde el suelo"></div>
<div class="sim-guide"><ul>
<li>Baje el Sol: el arco crece sobre el horizonte. Con el Sol a más de 42° el arco primario queda bajo el horizonte; a más de 53°, también el secundario.</li>
<li>Los colores se calculan con el índice del agua para cada longitud de onda y el diámetro angular del Sol (0.53°), que ensancha y mezcla los colores.</li>
</ul></div>
</section>

<section>
<h2>Halos de hielo</h2>
<p>En las nubes altas de cristales de hielo hexagonales la luz atraviesa caras que forman prismas de 60° y de 90°. Con \(n=1.31\), la desviación mínima de un prisma de 60° es 21.8° y la de uno de 90°, 45.7°. Los cristales orientados al azar envían luz con todas las desviaciones mayores que el mínimo, pero se acumula cerca del mínimo: se ven anillos brillantes de 22° y 46° alrededor del Sol, con el borde interior rojizo y un cielo más oscuro por dentro. Si los cristales son placas que caen horizontales, la luz se concentra a ambos lados del Sol en dos manchas, los <span class="term">parhelios</span>.</p>
<div class="sim" data-sim="halo" data-title="El halo de 22°: un prisma de hielo"></div>
<div class="sim-guide"><ul>
<li>El histograma muestra cuánta luz sale con cada desviación cuando los cristales se orientan al azar: hay un borde agudo en el mínimo y nada por debajo.</li>
<li>Cambie entre el prisma de 60° (halo de 22°) y el de 90° (halo de 46°).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un prisma de 60° tiene una desviación mínima de 48.2° para la luz amarilla. ¿Cuál es su índice?
<details><summary>Respuesta</summary><p>\(n=\sen54.1°/\sen30°=1.620\) (es un flint N-F2).</p></details></li>
<li><span class="lvl">Básico</span>Calcule el número de Abbe de un vidrio con \(n_d=1.5168\), \(n_F=1.5224\) y \(n_C=1.5143\).
<details><summary>Respuesta</summary><p>\(\nu_d=0.5168/0.0081=63.8\) (con más cifras, 64.17 para N-BK7).</p></details></li>
<li><span class="lvl">Intermedio</span>Para un prisma delgado de ángulo \(A\) pequeño, demuestre que \(\delta\approx(n-1)A\). ¿Qué ángulo separa el azul F del rojo C en un prisma delgado de 5° de N-BK7?
<details><summary>Respuesta</summary><p>Con senos ≈ ángulos, \(\theta_2'\approx nA-\theta_1\) y \(\delta=(n-1)A\). \(\Delta\delta=(n_F-n_C)A=0.00806\times5°=0.040°\).</p></details></li>
<li><span class="lvl">Intermedio</span>¿A qué ángulo del punto antisolar aparecería el arco primario en gotas de un líquido de índice 1.47?
<details><summary>Respuesta</summary><p>\(\cos^2\theta=(1.47^2-1)/3\Rightarrow\theta=51.5°\), \(\theta'=32.2°\); \(D=2(51.5-32.2)+180-64.4=154.3°\): el arco estaría a 25.7°.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre la condición del ángulo de Descartes derivando \(D_k(\theta)\) y usando la ley de Snell. Muestre que no hay arcoíris de primer orden si \(n&gt;2\).
<details><summary>Respuesta</summary><p>\(\dd D/\dd\theta=2-2(k+1)\,\dd\theta'/\dd\theta=0\) y \(\dd\theta'/\dd\theta=\cos\theta/(n\cos\theta')\). Elevando al cuadrado y usando \(n^2\sen^2\theta'=\sen^2\theta\) sale \(\cos^2\theta=(n^2-1)/(k(k+2))\). Para \(k=1\), si \(n&gt;2\) el segundo miembro supera 1 y no hay solución.</p></details></li>
</ol>
