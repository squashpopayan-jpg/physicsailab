<p class="lead">En 1669 Rasmus Bartholin miró a través de un cristal de espato de Islandia y vio cada letra dos veces. La calcita, como muchos cristales, tiene un índice de refracción que depende de la polarización y de la dirección de la luz: es birrefringente. Este capítulo explica la doble refracción y la aprovecha para fabricar polarizadores y láminas de onda, para ver tensiones en el vidrio con colores, y para medir el azúcar disuelto en un jarabe con la actividad óptica.</p>

<section>
<h2>Medios anisótropos</h2>
<p>En un cristal los electrones están ligados a la red con resortes de distinta rigidez según la dirección, y la polarización inducida no es paralela al campo. La permitividad es un tensor; en sus ejes principales es diagonal, con tres <span class="term">índices principales</span> \(n_x\), \(n_y\), \(n_z\). En los cristales cúbicos y en el vidrio los tres son iguales. En los cristales <span class="term">uniaxiales</span> (trigonales, tetragonales, hexagonales), dos son iguales y el tercero distinto: hay una dirección privilegiada, el <span class="term">eje óptico</span>. En los <span class="term">biaxiales</span>, como la mica, los tres son distintos.</p>
<p>En un cristal uniaxial una onda que avanza formando un ángulo \(\theta\) con el eje óptico se descompone en dos ondas con polarizaciones perpendiculares. La <span class="term">ordinaria</span>, polarizada perpendicular al plano que contiene el eje y la dirección de propagación, ve siempre el índice \(n_o\). La <span class="term">extraordinaria</span> ve un índice que depende de la dirección:</p>
<div class="eq key" data-name="Índice extraordinario">\[\frac{1}{n^2(\theta)}=\frac{\cos^2\theta}{n_o^2}+\frac{\sen^2\theta}{n_e^2}.\]</div>
<p>A lo largo del eje óptico las dos ondas viajan igual; perpendicular a él la diferencia es máxima, \(\Delta n=n_e-n_o\), la <span class="term">birrefringencia</span>. Es negativa en la calcita (\(n_o=1.6583\), \(n_e=1.4861\) a 589 nm, \(\Delta n=-0.172\)) y positiva en el cuarzo (\(n_o=1.5443\), \(n_e=1.5534\), \(\Delta n=+0.0091\)).</p>
</section>

<section>
<h2>La doble refracción</h2>
<p>En la onda extraordinaria el vector de Poynting no es paralelo al vector de onda: la energía viaja desviada un ángulo \(\rho\), el <span class="term">ángulo de desplazamiento</span> (walk-off),</p>
<div class="eq">\[\tan(\theta+\rho)=\frac{n_o^2}{n_e^2}\tan\theta.\]</div>
<p>Por eso un rayo que entra perpendicular a la cara de un cristal de calcita se divide: el ordinario sigue recto y el extraordinario se desvía, aunque ambos tienen el vector de onda perpendicular a la cara. El desplazamiento es máximo, 6.27°, para una dirección a 41.9° del eje. En un romboedro de exfoliación, con el eje a 44.6° de la normal a la cara, el desplazamiento es de 6.23° y dos imágenes de un punto se separan 1.09 mm por cada centímetro de espesor. Al girar el cristal, la imagen extraordinaria gira alrededor de la ordinaria.</p>
<p>La doble refracción permite fabricar polarizadores excelentes. En un prisma de <span class="term">Glan–Thompson</span> dos prismas de calcita pegados están cortados de modo que el rayo ordinario se refleja totalmente en la unión y solo pasa el extraordinario, con un contraste de un millón a uno. Un prisma de <span class="term">Wollaston</span> separa las dos polarizaciones en ángulos distintos.</p>
<div class="sim" data-sim="calcita" data-title="Doble refracción en un cristal de calcita"></div>
<div class="sim-guide"><ul>
<li>Un rayo entra perpendicular: el ordinario sigue recto y el extraordinario se desplaza el ángulo \(\rho\), que depende de la orientación del eje óptico.</li>
<li>A la derecha, un punto visto a través del cristal: gire el cristal y la imagen extraordinaria da vueltas alrededor de la ordinaria. Con el analizador, cada imagen se apaga en una orientación.</li>
</ul></div>
</section>

<section>
<h2>Láminas de onda</h2>
<p>Una lámina cortada con el eje óptico en su plano no separa los rayos a incidencia normal, pero retrasa una polarización respecto de la otra. Tras un espesor \(d\) el desfase es</p>
<div class="eq key" data-name="Retardo de una lámina">\[\Gamma=\frac{2\pi\,\Delta n\,d}{\lambda}.\]</div>
<p>Con \(\Gamma=\pi/2\) la lámina es de <span class="term">cuarto de onda</span>: con su eje a 45° de una polarización lineal produce luz circular. Con \(\Gamma=\pi\) es de <span class="term">media onda</span>: refleja la polarización lineal respecto de su eje y la gira el doble del ángulo entre ambas. Una lámina de cuarto de onda de cuarzo «de orden cero» para 589 nm mide solo 16.2 µm; las comerciales suelen ser de orden múltiplo (\(\Gamma=2\pi m+\pi/2\)), más gruesas y robustas pero más sensibles a la longitud de onda y a la temperatura.</p>
<div class="sim" data-sim="laminas" data-title="Lámina de onda: retardo y polarización de salida"></div>
<div class="sim-guide"><ul>
<li>Cambie el espesor de la lámina de cuarzo y la longitud de onda: el retardo y la elipse de salida cambian. Con luz lineal a 45° del eje se recorren todos los estados.</li>
<li>Compare una lámina de orden cero con una de orden 10: la segunda solo es de cuarto de onda en una banda estrecha.</li>
</ul></div>
</section>

<section>
<h2>Colores de interferencia y la tabla de Michel-Lévy</h2>
<p>Una lámina birrefringente entre dos polarizadores cruzados, con su eje a 45°, transmite</p>
<div class="eq">\[T=\sen^2\!\left(\frac{\Gamma}{2}\right)=\sen^2\!\left(\frac{\pi\,\Delta n\,d}{\lambda}\right).\]</div>
<p>Con luz blanca, cada longitud de onda pasa en distinta proporción y la lámina se ve coloreada: es la <span class="term">polarización cromática</span>, descubierta por Arago en 1811. El color depende solo del retardo \(\Delta n\,d\), y la sucesión de colores es la misma que la de las películas delgadas: gris, blanco, amarillo, naranja y el «rojo de primer orden» hacia 550 nm; luego azul, verde, amarillo y rojo de segundo orden, y así siguiendo, cada vez más pálidos. Los geólogos identifican los minerales de una lámina de roca de 30 µm con esa escala, la <span class="term">tabla de Michel-Lévy</span> (1888): el cuarzo da gris de primer orden y la calcita, un blanco de orden alto.</p>
<div class="sim" data-sim="michel-levy" data-title="Colores de interferencia entre polarizadores"></div>
<div class="sim-guide"><ul>
<li>La banda es la tabla de Michel-Lévy calculada con las funciones de color de la CIE bajo luz de día. Mueva el retardo para ver un color; cambie a polarizadores paralelos para ver los complementarios.</li>
<li>Con el mineral y el espesor, el retardo es \(\Delta n\,d\): 30 µm de cuarzo dan 273 nm (blanco amarillento de primer orden).</li>
</ul></div>
</section>

<section>
<h2>Fotoelasticidad</h2>
<p>Muchos materiales transparentes isótropos se vuelven birrefringentes bajo tensión, con \(\Delta n=C(\sigma_1-\sigma_2)\), donde \(\sigma_1-\sigma_2\) es la diferencia de esfuerzos principales y \(C\) el coeficiente fotoelástico (del orden de \(10^{-12}\) a \(10^{-10}\) Pa⁻¹). Entre polarizadores, un modelo de plástico cargado se cubre de franjas de color, las <span class="term">isocromáticas</span>, que son curvas de igual \(\sigma_1-\sigma_2\). Antes de las computadoras los ingenieros diseñaban así piezas, presas y arcos de catedrales. Hoy se usa para controlar el templado del vidrio: el parabrisas de un carro, visto con gafas polarizadas, muestra manchas del templado.</p>
<div class="sim" data-sim="fotoelasticidad" data-title="Disco comprimido entre polarizadores"></div>
<div class="sim-guide"><ul>
<li>Los esfuerzos de un disco comprimido por dos fuerzas opuestas tienen solución exacta (Hertz, Frocht). Las franjas se concentran cerca de los puntos de carga.</li>
<li>Aumente la fuerza: aparecen más órdenes de franjas. Con luz monocromática las isocromáticas son franjas negras.</li>
</ul></div>
</section>

<section>
<h2>Actividad óptica y efecto Faraday</h2>
<p>Algunas sustancias giran el plano de polarización de la luz que las atraviesa: son <span class="term">ópticamente activas</span>. El cuarzo, a lo largo de su eje óptico, gira 21.7° por milímetro en la luz amarilla, y más en el azul (32.8°/mm en 486 nm): entre polarizadores, una lámina de cuarzo se ve de colores que cambian al girar el analizador (Biot, 1812). La causa es la quiralidad: la estructura helicoidal del cristal o de la molécula trata de forma distinta las polarizaciones circulares de uno y otro sentido, que viajan con índices ligeramente distintos; la polarización lineal, suma de las dos, gira. Louis Pasteur separó en 1848 los cristales de las dos formas del ácido tartárico, que giraban la luz en sentidos opuestos, y descubrió así la quiralidad molecular.</p>
<p>La sacarosa disuelta gira la polarización \(66.5°\) por decímetro de solución y por gramo por mililitro: un tubo de 20 cm de un jarabe de 0.1 g/mL la gira 13.3°. Los <span class="term">sacarímetros</span> de los ingenios azucareros, como los del valle del Cauca, miden así la concentración de azúcar del jugo de caña. Un campo magnético a lo largo de la luz también gira la polarización en cualquier material, \(\beta=VBL\) (efecto Faraday, 1845, la primera prueba de que la luz y el magnetismo están relacionados). A diferencia de la actividad natural, el giro de Faraday no se deshace al devolver la luz: los <span class="term">aisladores ópticos</span> lo usan para proteger los láseres de sus propias reflexiones.</p>
<div class="sim" data-sim="actividad" data-title="Actividad óptica del cuarzo y del azúcar"></div>
<div class="sim-guide"><ul>
<li>Con el cuarzo, cada color gira un ángulo distinto (dispersión rotatoria) y el color transmitido cambia al girar el analizador.</li>
<li>Con el azúcar, ajuste la concentración y gire el analizador hasta la extinción: ese ángulo mide la concentración.</li>
</ul></div>
<div class="box note"><h4>Las pantallas de cristal líquido</h4><p>Un píxel de una pantalla LCD es una capa de cristal líquido nemático de pocas micras entre dos polarizadores cruzados. Las moléculas, alargadas, forman una hélice de 90° que guía la polarización y la hace girar: el píxel deja pasar la luz. Con unos voltios las moléculas se alinean con el campo, la hélice desaparece y el píxel se oscurece. Detrás hay una lámpara de LED y delante, filtros de color.</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Qué espesor tiene una lámina de media onda de orden cero de cuarzo para 633 nm (\(\Delta n=0.0090\))?
<details><summary>Respuesta</summary><p>\(d=\lambda/(2\Delta n)=35.2\) µm.</p></details></li>
<li><span class="lvl">Básico</span>Luz lineal a 30° del eje rápido de una lámina de media onda. ¿Qué polarización sale?
<details><summary>Respuesta</summary><p>Lineal a −30° del eje: girada 60°.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Qué color de interferencia da una lámina de mica de 25 µm con \(\Delta n=0.036\) entre polarizadores cruzados?
<details><summary>Respuesta</summary><p>Retardo de 900 nm: azul verdoso de segundo orden (la simulación da el color exacto).</p></details></li>
<li><span class="lvl">Intermedio</span>Un tubo de 2 dm de una solución de sacarosa gira la polarización 20°. ¿Qué concentración tiene?
<details><summary>Respuesta</summary><p>\(c=20/(66.5\times2)=0.150\) g/mL.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que en un cristal uniaxial negativo el máximo de \(\rho\) ocurre para \(\tan\theta=n_e/n_o\) y que vale \(\tan\rho_{max}=(n_o^2-n_e^2)/(2n_on_e)\). Compruébelo con la calcita.
<details><summary>Respuesta</summary><p>De \(\tan\rho=\frac{(n_o^2/n_e^2-1)\tan\theta}{1+(n_o^2/n_e^2)\tan^2\theta}\), derivando respecto de \(\tan\theta\). Para la calcita: \(\theta=41.9°\) y \(\rho_{max}=6.27°\).</p></details></li>
</ol>
