<p class="lead">Un puntero láser verde es en realidad un láser infrarrojo de 1064 nm cuya luz atraviesa un cristal que duplica su frecuencia. Ese cristal hace algo imposible en la óptica de los capítulos anteriores: crear luz de un color que no entró. Con campos suficientemente intensos la respuesta de la materia deja de ser proporcional al campo, y las ondas se mezclan. Este capítulo presenta los fenómenos básicos de la óptica no lineal y el problema que hay que resolver para aprovecharlos: el ajuste de fases.</p>

<section>
<h2>La polarización no lineal</h2>
<p>En el modelo de Lorentz el electrón está ligado por un resorte ideal. Si el campo es intenso el resorte deja de ser lineal, y la polarización inducida tiene términos con potencias del campo:</p>
<div class="eq key" data-name="Polarización no lineal">\[P=\eo\left[\chi^{(1)}E+\chi^{(2)}E^2+\chi^{(3)}E^3+\cdots\right].\]</div>
<p>Los términos sucesivos son del orden de \((E/E_{at})\) respecto del anterior, donde \(E_{at}\approx5\times10^{11}\) V/m es el campo que liga al electrón en el átomo. La luz del Sol tiene 1000 V/m y los efectos no lineales son invisibles; un pulso láser enfocado llega a \(10^{8}\)–\(10^{10}\) V/m y los hace evidentes. Por eso la óptica no lineal nació en 1961, un año después del láser, cuando Peter Franken enfocó un láser de rubí en un cuarzo y detectó luz ultravioleta de 347 nm. El término \(\chi^{(2)}\) solo existe en cristales sin centro de simetría (en un medio centrosimétrico, invertir el campo debe invertir la polarización, y \(E^2\) no cambia de signo).</p>
</section>

<section>
<h2>Segundo armónico y ajuste de fases</h2>
<p>Si \(E=E_0\cos\omega t\), el término \(\chi^{(2)}E^2=\tfrac12\chi^{(2)}E_0^2(1+\cos2\omega t)\) contiene una oscilación al doble de frecuencia, que radia luz de \(2\omega\): la <span class="term">generación de segundo armónico</span>. Pero la polarización a \(2\omega\) avanza con el vector de onda \(2k(\omega)\), y la luz que radia avanza con \(k(2\omega)\). Como el índice depende de la frecuencia, en general no coinciden. Con \(\Delta k=k(2\omega)-2k(\omega)\) la intensidad del segundo armónico tras un cristal de longitud \(L\) es</p>
<div class="eq key" data-name="Segundo armónico">\[I_{2\omega}\propto I_\omega^2\,L^2\,\frac{\sen^2(\Delta kL/2)}{(\Delta kL/2)^2}.\]</div>
<p>Sin ajuste, la luz generada en distintos puntos del cristal interfiere destructivamente y la intensidad oscila con un período \(2L_c\), donde la <span class="term">longitud de coherencia</span> \(L_c=\pi/\Delta k\) es de unas micras: en el borato de bario (BBO) a lo largo del eje óptico, 13.5 µm. La solución, propuesta en 1962 por Giordmaine y por Maker y colaboradores, es usar la birrefringencia: si la onda fundamental viaja como ordinaria y el armónico como extraordinaria, se puede elegir una dirección del cristal en la que \(n_e(2\omega,\theta)=n_o(\omega)\) y \(\Delta k=0\). Es el <span class="term">ajuste de fases tipo I</span>:</p>
<div class="eq">\[\sen^2\theta_m=\frac{n_o^{-2}(\omega)-n_o^{-2}(2\omega)}{n_e^{-2}(2\omega)-n_o^{-2}(2\omega)}.\]</div>
<p>Para el BBO con las fórmulas de Eimerl et al., el ángulo de ajuste para doblar 1064 nm es 22.8°, el valor que dan los fabricantes. El ajuste es muy crítico: en un cristal de 1 cm, la eficiencia cae a la mitad si el ángulo se desvía unas 0.25 mrad. El otro método, el <span class="term">cuasiajuste de fases</span>, invierte periódicamente el signo de \(\chi^{(2)}\) cada longitud de coherencia (niobato de litio periódicamente polarizado), y se usa en casi todos los dispositivos modernos.</p>
<div class="sim" data-sim="shg" data-title="Segundo armónico: longitud de coherencia y ajuste de fases"></div>
<div class="sim-guide"><ul>
<li>La intensidad del armónico a lo largo del cristal oscila con período \(2L_c\) cuando \(\Delta k\ne0\) y crece como \(L^2\) cuando \(\Delta k=0\). Gire el cristal hacia el ángulo de ajuste.</li>
<li>Con cuasiajuste, cada inversión del dominio recupera el crecimiento.</li>
</ul></div>
<div class="sim" data-sim="ajuste-fase" data-title="Ajuste de fases tipo I en BBO"></div>
<div class="sim-guide"><ul>
<li>Las curvas son \(n_o(\omega)\) y \(n_e(2\omega,\theta)\) con las fórmulas de Sellmeier del BBO. El ajuste ocurre donde se cruzan.</li>
<li>Cambie la longitud de onda fundamental: el ángulo de ajuste cambia, y por debajo de unos 410 nm ya no hay solución.</li>
</ul></div>
</section>

<section>
<h2>Mezcla de frecuencias y osciladores paramétricos</h2>
<p>Con dos ondas de frecuencias \(\omega_1\) y \(\omega_2\), el término \(E^2\) contiene \(\omega_1+\omega_2\) (suma de frecuencias) y \(\omega_1-\omega_2\) (diferencia de frecuencias). En el proceso inverso, un fotón de bombeo \(\omega_p\) se divide en dos, la señal y el ocioso, con \(\omega_p=\omega_s+\omega_i\) y \(\vb k_p=\vb k_s+\vb k_i\): conservación de la energía y del momento de los fotones. Dentro de una cavidad se obtiene un <span class="term">oscilador paramétrico óptico</span>, una fuente coherente sintonizable en todo el infrarrojo con solo girar el cristal. La división espontánea de un fotón en dos (conversión paramétrica descendente) produce pares de fotones entrelazados, la materia prima de la óptica cuántica (capítulo 28).</p>
</section>

<section>
<h2>El efecto Kerr óptico</h2>
<p>En cualquier material, aun centrosimétrico, el término \(\chi^{(3)}\) cambia el índice en proporción a la intensidad:</p>
<div class="eq key" data-name="Efecto Kerr óptico">\[n=n_0+n_2I.\]</div>
<p>En la sílice \(n_2=2.6\times10^{-20}\) m²/W: un cambio diminuto, pero que se acumula a lo largo de kilómetros de fibra. Un haz intenso con perfil gaussiano ve un índice mayor en el centro y se enfoca a sí mismo como una lente (<span class="term">autoenfoque</span>); por encima de una potencia crítica de unos 4.5 MW en la sílice a 1064 nm, el autoenfoque vence a la difracción y el haz colapsa hasta dañar el material. En el tiempo, la intensidad variable de un pulso le imprime una fase \(\phi_{NL}(t)=\gamma P(t)L\) que ensancha su espectro: la <span class="term">automodulación de fase</span>. Combinada con la dispersión anómala de la fibra, puede equilibrarla exactamente y producir <span class="term">solitones</span>, pulsos que viajan miles de kilómetros sin deformarse. Llevada al extremo en fibras de cristal fotónico, genera un «supercontinuo», luz blanca de láser.</p>
<div class="sim" data-sim="automodulacion" data-title="Automodulación de fase de un pulso"></div>
<div class="sim-guide"><ul>
<li>La fase no lineal sigue la forma del pulso; su derivada cambia la frecuencia instantánea: rojo en el frente, azul en la cola.</li>
<li>Aumente la fase máxima: el espectro, calculado con la FFT, se ensancha y se llena de oscilaciones, con unos \(\phi_{max}/\pi+1\) picos.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Qué longitud de onda resulta al sumar las frecuencias de 1064 nm y 532 nm?
<details><summary>Respuesta</summary><p>\(1/\lambda=1/1064+1/532\Rightarrow\lambda=354.7\) nm (tercer armónico del Nd:YAG).</p></details></li>
<li><span class="lvl">Básico</span>¿Qué campo eléctrico tiene un pulso de \(10^{13}\) W/cm² en el aire? Compárelo con el campo atómico.
<details><summary>Respuesta</summary><p>\(E_0=\sqrt{2I/c\eo}=8.7\times10^{9}\) V/m, unas 60 veces menor que \(5\times10^{11}\) V/m.</p></details></li>
<li><span class="lvl">Intermedio</span>Con \(\Delta k=2.33\times10^5\) m⁻¹, ¿cuál es la longitud de coherencia? ¿A qué espesor el segundo armónico vuelve a cero por primera vez?
<details><summary>Respuesta</summary><p>\(L_c=\pi/\Delta k=13.5\) µm; vuelve a cero en \(2L_c=27\) µm.</p></details></li>
<li><span class="lvl">Intermedio</span>En un oscilador paramétrico bombeado a 532 nm, la señal sale a 800 nm. ¿Dónde está el ocioso?
<details><summary>Respuesta</summary><p>\(1/\lambda_i=1/532-1/800\Rightarrow\lambda_i=1588\) nm.</p></details></li>
<li><span class="lvl">Avanzado</span>Muestre que en la automodulación de fase el corrimiento máximo de frecuencia de un pulso gaussiano \(P(t)=P_0\ee^{-t^2/T^2}\) es \(\delta\omega_{max}=\sqrt{2/\ee}\,\phi_{max}/T\).
<details><summary>Respuesta</summary><p>\(\delta\omega=-\dd\phi_{NL}/\dd t=\phi_{max}(2t/T^2)\ee^{-t^2/T^2}\), máximo en \(t=T/\sqrt2\): \(\delta\omega_{max}=\phi_{max}\sqrt2\ee^{-1/2}/T\).</p></details></li>
</ol>
