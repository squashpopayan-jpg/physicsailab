<template class="chapter-src" data-id="ojo-color" data-num="10" data-title="El ojo y el color" data-part="Parte II · Óptica geométrica" data-short="El ojo como sistema óptico y el ojo reducido, acomodación, miopía, hipermetropía, presbicia y su corrección en dioptrías, agudeza visual y tamaño óptimo de la pupila, conos y visión tricromática, el sistema colorimétrico CIE 1931, mezcla aditiva y metamerismo">
<p class="lead">El ojo es una cámara: una lente de potencia variable, un diafragma automático y un sensor curvo con unos cien millones de detectores. Pero también es el instrumento que define la fotometría y el color. Este capítulo estudia el ojo como sistema óptico, calcula las gafas que corrigen sus defectos, encuentra el límite de su resolución y construye, a partir de los experimentos de igualación de colores, el diagrama de cromaticidad de la CIE con el que se especifica cualquier color.</p>

<section>
<h2>El ojo como sistema óptico</h2>
<p>La luz entra por la <span class="term">córnea</span>, una superficie de 7.8 mm de radio que separa el aire del humor acuoso y aporta unas 43 dioptrías. El <span class="term">iris</span> forma la pupila, de 2 mm con luz intensa a 8 mm en la oscuridad. El <span class="term">cristalino</span>, una lente flexible de índice gradual, aporta otras 20 dioptrías cuando está relajado. La imagen se forma, invertida, sobre la <span class="term">retina</span>, a unos 24 mm de la córnea. La potencia total del ojo relajado es de unas 60 dioptrías.</p>
<p>Para muchos cálculos basta el <span class="term">ojo reducido</span>: una sola superficie refractora de potencia \(P=60\) D que separa el aire de un medio de índice \(n=1.336\). Un objeto lejano forma su imagen a \(n/P=22.3\) mm detrás de la superficie, donde se coloca la retina. Para enfocar un objeto cercano el músculo ciliar se contrae, el cristalino se abomba y la potencia aumenta: es la <span class="term">acomodación</span>. Su amplitud disminuye con la edad, de unas 10 D a los 20 años (punto próximo a 10 cm) a 1 D a los 60.</p>
<div class="box def"><h4>Punto remoto y punto próximo</h4><p>El <b>punto remoto</b> es el más lejano que el ojo enfoca relajado; el <b>punto próximo</b>, el más cercano con la acomodación máxima. En un ojo normal (emétrope) el remoto está en el infinito, y por convención el próximo se toma a 25 cm.</p></div>
</section>

<section>
<h2>Defectos de refracción y su corrección</h2>
<p>En el ojo <span class="term">miope</span> la imagen de un objeto lejano se forma delante de la retina, porque el ojo es demasiado largo o demasiado potente; su punto remoto está a una distancia finita \(d_R\). Se corrige con una lente divergente que forme, de los objetos lejanos, una imagen virtual en el punto remoto:</p>
<div class="eq key" data-name="Corrección de la miopía">\[P_{gafa}=-\frac1{d_R}\qquad(\text{lente en contacto con el ojo}).\]</div>
<p>Un miope con el punto remoto a 50 cm necesita −2 D. En el <span class="term">hipermétrope</span> la imagen cae detrás de la retina; puede enfocar acomodando, pero gasta acomodación aun para mirar lejos, y se corrige con lentes convergentes. La <span class="term">presbicia</span> es la pérdida de acomodación con la edad: quien tiene el punto próximo a 1 m necesita, para leer a 25 cm, una lente de \(1/0.25-1/1=+3\) D. El <span class="term">astigmatismo</span>, una córnea con curvaturas distintas en dos direcciones, se corrige con lentes cilíndricas. Las gafas se colocan a unos 12 mm de la córnea, y para potencias altas esa distancia cambia la potencia necesaria: una lente de contacto de un miope fuerte es algo menos potente que su gafa.</p>
<div class="sim" data-sim="ojo" data-title="El ojo reducido: acomodación, miopía, hipermetropía y gafas"></div>
<div class="sim-guide"><ul>
<li>Cambie la distancia del objeto: el ojo acomoda hasta su amplitud máxima. Más cerca del punto próximo la imagen cae detrás de la retina y la mancha de desenfoque crece.</li>
<li>Elija un defecto y busque la potencia de la lente que lleva la imagen a la retina; compare con la fórmula del punto remoto.</li>
</ul></div>
</section>

<section>
<h2>Agudeza visual</h2>
<p>¿Qué detalle más pequeño ve el ojo? Tres efectos lo limitan. La difracción en la pupila produce un disco de Airy de radio angular \(1.22\lambda/D\): 0.77′ con una pupila de 3 mm en luz verde. Las aberraciones del ojo, sobre todo la esférica, crecen rápidamente con la pupila. Y la retina muestrea la imagen con conos separados unos 2.5 µm en la fóvea, que a 17 mm del punto nodal equivalen a 0.5′. Los tres límites son parecidos: el ojo está bien diseñado. La mejor resolución se alcanza con pupilas de 2 a 3 mm, como midieron Campbell y Gubisch (1966).</p>
<p>La agudeza «normal» (20/20 o 6/6) corresponde a distinguir detalles de 1′: las letras de la línea correspondiente de la tabla de Snellen subtienden 5′, es decir 8.7 mm a 6 m. Muchos jóvenes ven mejor que eso, hasta 0.6′.</p>
<div class="sim" data-sim="agudeza" data-title="Tamaño de la pupila, difracción y aberración"></div>
<div class="sim-guide"><ul>
<li>El desenfoque angular total combina el disco de Airy, que se achica con la pupila, y la aberración esférica, que crece como \(D^3\). El mínimo está hacia 2.4 mm.</li>
<li>La aberración se modela con una ley de potencias calibrada para reproducir ese óptimo: es una ilustración, no un modelo de un ojo particular.</li>
</ul></div>
</section>

<section>
<h2>Visión del color y el sistema CIE</h2>
<p>La retina tiene un tipo de <span class="term">bastones</span>, para la visión nocturna (máximo hacia 498 nm), y tres tipos de <span class="term">conos</span>, S, M y L, con máximos hacia 420, 534 y 564 nm. Cada cono solo cuenta fotones: no sabe de qué longitud de onda venían. El color que percibimos depende únicamente de las tres respuestas, de modo que la luz se describe con tres números. Es la <span class="term">tricromacía</span>, propuesta por Young en 1802 y medida por Maxwell y Helmholtz.</p>
<p>En los experimentos de igualación de colores de Wright y Guild (1928–1931) un observador ajustaba la mezcla de tres luces primarias hasta igualar una luz monocromática. De sus resultados la CIE definió en 1931 las funciones de igualación \(\bar x(\lambda)\), \(\bar y(\lambda)\), \(\bar z(\lambda)\), elegidas para que fueran positivas y para que \(\bar y=V(\lambda)\). Los <span class="term">valores triestímulo</span> de un espectro \(S(\lambda)\) son</p>
<div class="eq key" data-name="Valores triestímulo CIE">\[X=\int S\bar x\,\dd\lambda,\quad Y=\int S\bar y\,\dd\lambda,\quad Z=\int S\bar z\,\dd\lambda,\qquad x=\frac{X}{X+Y+Z},\ \ y=\frac{Y}{X+Y+Z}.\]</div>
<p>\(Y\) es la luminancia; \(x\) e \(y\), las <span class="term">coordenadas de cromaticidad</span>, ubican el color en un plano. Las luces monocromáticas recorren una curva en forma de herradura, el <span class="term">lugar espectral</span>; la recta que une sus extremos es la línea de los púrpuras, que no son colores del espectro. Todos los colores reales están dentro. El blanco equienergético está en (1/3, 1/3) y el iluminante D65 en (0.3127, 0.3290).</p>
<div class="sim" data-sim="cie" data-title="Diagrama de cromaticidad CIE 1931"></div>
<div class="sim-guide"><ul>
<li>Mezcle dos luces monocromáticas: el color resultante cae sobre el segmento que las une, más cerca de la más luminosa. Con 480 y 580 nm en la proporción adecuada se obtiene blanco: son <span class="term">complementarios</span>.</li>
<li>El triángulo es la gama de colores de una pantalla sRGB; la curva interior, el lugar de Planck de los cuerpos negros (capítulo 3).</li>
</ul></div>
</section>

<section>
<h2>Mezcla aditiva y metamerismo</h2>
<p>Una pantalla forma los colores sumando la luz de subpíxeles rojos, verdes y azules: <span class="term">mezcla aditiva</span>. Solo puede mostrar los colores dentro del triángulo de sus primarios; ninguna pantalla de tres primarios cubre toda la herradura. Las tintas y los filtros, en cambio, restan luz: la <span class="term">mezcla sustractiva</span> de cian, magenta y amarillo.</p>
<p>Como el color depende solo de tres números, espectros muy distintos pueden verse idénticos: son <span class="term">metámeros</span>. La luz blanca de un LED (un pico azul más una banda amarilla), la de un cuerpo negro de la misma temperatura de color y la de tres láseres bien dosificados son indistinguibles para el ojo, pero iluminan los objetos de forma diferente: una tela que combina bajo la luz del almacén puede no combinar bajo el sol. Alrededor del 8 % de los hombres y el 0.5 % de las mujeres tienen una forma de daltonismo, casi siempre por un cono M o L desplazado, y para ellos los metámeros son otros.</p>
<div class="sim" data-sim="mezcla" data-title="Mezcla aditiva de tres LED y metamerismo"></div>
<div class="sim-guide"><ul>
<li>Ajuste las potencias de los LED rojo, verde y azul y compare el color resultante con el de un cuerpo negro: cuando las coordenadas coinciden, los dos espectros son metámeros.</li>
<li>El botón «Igualar» busca la mezcla que reproduce el color del cuerpo negro elegido.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una persona no ve con nitidez más allá de 40 cm. ¿Qué lentes de contacto necesita?
<details><summary>Respuesta</summary><p>\(P=-1/0.40=-2.5\) D.</p></details></li>
<li><span class="lvl">Básico</span>¿Qué potencia tienen unas gafas de lectura para alguien cuyo punto próximo está a 75 cm, si quiere leer a 25 cm?
<details><summary>Respuesta</summary><p>\(P=1/0.25-1/0.75=+2.67\) D.</p></details></li>
<li><span class="lvl">Intermedio</span>Con una pupila de 4 mm, ¿cuál es el límite de difracción del ojo para luz de 550 nm? ¿A qué distancia se distinguirían los faros de un carro separados 1.5 m?
<details><summary>Respuesta</summary><p>\(\theta=1.22\lambda/D=1.68\times10^{-4}\) rad \(=0.58'\); distancia \(=1.5/1.68\times10^{-4}=8.9\) km (en la práctica menos, por las aberraciones y la retina).</p></details></li>
<li><span class="lvl">Intermedio</span>Un miope de −8 D usa gafas a 12 mm de la córnea. ¿Qué potencia deben tener sus lentes de contacto?
<details><summary>Respuesta</summary><p>La gafa forma la imagen en su foco, a 125 mm delante de ella, es decir a 137 mm de la córnea: \(P_{contacto}=-1/0.137=-7.30\) D.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que, si se mezclan dos luces de cromaticidades \((x_1,y_1)\) y \((x_2,y_2)\) y luminancias \(Y_1\), \(Y_2\), el resultado está sobre el segmento que las une, en la posición que da la «regla de la palanca» con pesos \(Y_i/y_i\).
<details><summary>Respuesta</summary><p>Los valores triestímulo se suman. Con \(X_i=x_iY_i/y_i\) y \(X_i+Y_i+Z_i=Y_i/y_i\equiv w_i\): \(x=(x_1w_1+x_2w_2)/(w_1+w_2)\), igual para \(y\): un promedio ponderado, sobre el segmento.</p></details></li>
</ol>
