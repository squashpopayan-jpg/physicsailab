<p class="lead">Los colores de una pompa de jabón, de una mancha de aceite en el asfalto mojado o de las alas de algunas mariposas no vienen de pigmentos: son interferencia entre la luz reflejada en las dos caras de una película más delgada que una micra. El mismo principio, dividir un haz en dos por reflexión parcial y volver a juntarlos, es la base de los interferómetros, que miden distancias con fracciones de longitud de onda y detectaron en 2015 las ondas gravitacionales.</p>

<section>
<h2>Interferencia en una lámina delgada</h2>
<p>Un haz que llega a una lámina de índice \(n\) y espesor \(d\) se refleja en parte en la cara superior; el resto entra, se refleja en la cara inferior y vuelve a salir. Los dos haces reflejados recorren caminos ópticos que difieren en</p>
<div class="eq key" data-name="Diferencia de camino en una lámina">\[\Delta=2nd\cos\theta_t,\]</div>
<p>donde \(\theta_t\) es el ángulo de refracción dentro de la lámina. A eso hay que sumar los <span class="term">cambios de fase en la reflexión</span>: al reflejarse en un medio de mayor índice la onda se invierte (desfase \(\pi\)); al reflejarse en uno de menor índice, no. En una película de jabón en el aire (\(n=1.33\)) solo una de las dos reflexiones cambia de fase, y la reflexión es máxima cuando</p>
<div class="eq">\[2nd\cos\theta_t=\left(m+\tfrac12\right)\lambda,\]</div>
<p>y mínima cuando \(2nd\cos\theta_t=m\lambda\). Una película mucho más delgada que la longitud de onda no refleja nada, porque los dos haces llegan en oposición: es la <span class="term">película negra</span> que aparece en la parte alta de una pompa justo antes de romperse, de unos 10 nm. Para luz verde de 550 nm, el primer máximo de reflexión corresponde a \(d=\lambda/4n=103\) nm.</p>
</section>

<section>
<h2>Los colores de las películas</h2>
<p>Con luz blanca, cada espesor refuerza unos colores y apaga otros, y la película se ve del color complementario de lo que apaga. La secuencia de colores al crecer el espesor fue estudiada por Newton: negro, gris y blanco hasta unos 100 nm; amarillo, naranja y un rojo púrpura hacia 200 nm; luego azul, verde, amarillo y magenta en órdenes sucesivos, cada vez más pálidos, hasta que por encima de una micra los colores se mezclan en blanco. Una película vertical se adelgaza por arriba al escurrir, y muestra todas las bandas a la vez.</p>
<p>En una mancha de aceite (\(n\approx1.47\)) sobre agua (\(n=1.33\)) también hay un solo cambio de fase, en la cara superior, y la secuencia es la misma. En una lámina de óxido sobre un metal o en los recubrimientos de las gafas las condiciones cambian según los índices; el capítulo 15 trata estos casos con matrices.</p>
<div class="sim" data-sim="pelicula" data-title="Colores de una película de jabón"></div>
<div class="sim-guide"><ul>
<li>La reflectancia se calcula con las fórmulas de Fresnel y todas las reflexiones múltiples, y el color integrando bajo el iluminante D65 con las funciones de la CIE.</li>
<li>La columna de la derecha es una película vertical que escurre: arriba muy delgada (negra) y abajo cada vez más gruesa.</li>
</ul></div>
</section>

<section>
<h2>La cuña de aire y los anillos de Newton</h2>
<p>Si dos láminas de vidrio se tocan por un borde y se separan por el otro con un cabello, entre ellas queda una <span class="term">cuña de aire</span> de ángulo \(\alpha\). Con luz monocromática se ven franjas paralelas a la arista, separadas</p>
<div class="eq">\[\Delta x=\frac{\lambda}{2\alpha}.\]</div>
<p>Cada franja corresponde a un aumento de espesor de \(\lambda/2\): contando franjas se mide el grosor del cabello. Con láminas de 10 cm y un cabello de 50 µm, la luz de sodio da franjas cada 0.59 mm, unas 170 en total. Los ópticos comprueban la planitud de una superficie colocándola sobre un <span class="term">plano patrón</span>: las franjas rectas indican planitud y cada franja curva, una desviación de media longitud de onda.</p>
<p>Si se apoya una lente convexa de radio \(R\) sobre un vidrio plano, el espesor del aire crece como \(r^2/2R\) y las franjas son anillos, los <span class="term">anillos de Newton</span>. En reflexión, con el cambio de fase en la superficie inferior, el centro es oscuro y los anillos oscuros tienen radios</p>
<div class="eq key" data-name="Anillos de Newton">\[r_m=\sqrt{m\lambda R}.\]</div>
<p>Con \(R=1\) m y luz de 589 nm el primer anillo oscuro mide 0.77 mm y el décimo, 2.43 mm. Newton los describió con detalle en su <em>Opticks</em> sin aceptar la explicación ondulatoria, que dio Young un siglo después.</p>
<div class="sim" data-sim="newton" data-title="Anillos de Newton en reflexión y en transmisión"></div>
<div class="sim-guide"><ul>
<li>Cambie el radio de la lente y la longitud de onda. Los radios medidos de los anillos oscuros siguen \(\sqrt{m\lambda R}\).</li>
<li>En transmisión el patrón es el complementario, con poco contraste porque la reflexión en el vidrio es débil.</li>
</ul></div>
<div class="sim" data-sim="cuna" data-title="Cuña de aire: medir un cabello"></div>
<div class="sim-guide"><ul>
<li>Las franjas se ven desde arriba con luz de sodio. Cambie el grosor del objeto que separa las láminas y cuente las franjas.</li>
<li>Con un plano defectuoso las franjas se curvan: cada franja de desviación equivale a 295 nm.</li>
</ul></div>
</section>

<section>
<h2>El interferómetro de Michelson</h2>
<p>En el interferómetro que Albert Michelson construyó en 1881, un divisor de haz semirreflectante envía la luz a dos espejos perpendiculares; los haces vuelven, se recombinan en el divisor y llegan al observador. Si los brazos difieren en \(\Delta L\), la diferencia de camino es \(2\Delta L\). Al mover un espejo media longitud de onda, el patrón avanza una franja: desplazar un espejo 0.1 mm con un láser de He–Ne hace pasar 316 franjas. Con los espejos inclinados se ven franjas rectas; con los espejos perpendiculares y una fuente extensa, anillos de igual inclinación.</p>
<p>Con este instrumento Michelson y Morley buscaron en 1887 el movimiento de la Tierra a través del éter: esperaban un desplazamiento de 0.4 franjas al girar el aparato y no vieron nada, uno de los hechos que llevaron a la relatividad. Michelson midió el metro patrón en longitudes de onda de la luz del cadmio y analizó espectros con el interferómetro (capítulo 12). Hoy los detectores de ondas gravitacionales LIGO y Virgo son interferómetros de Michelson con brazos de 4 y 3 km y cavidades que multiplican el camino: detectan cambios de longitud de \(4\times10^{-18}\) m, una milésima del diámetro de un protón. En septiembre de 2015 registraron la fusión de dos agujeros negros a 1300 millones de años luz.</p>
<div class="sim" data-sim="michelson" data-title="Interferómetro de Michelson"></div>
<div class="sim-guide"><ul>
<li>Desplace el espejo móvil: los anillos nacen o desaparecen en el centro, uno por cada \(\lambda/2\). Incline el espejo para ver franjas rectas.</li>
<li>Con luz blanca solo hay franjas cerca de la diferencia de camino cero: así se igualan los brazos.</li>
</ul></div>
<div class="box note"><h4>Otros interferómetros</h4><p>En el <b>Mach–Zehnder</b> los dos haces recorren caminos separados y se recombinan en un segundo divisor; se usa para estudiar flujos y plasmas y en óptica cuántica. En el <b>Sagnac</b> los dos haces recorren el mismo anillo en sentidos opuestos; si el anillo gira, uno tarda más que el otro, y los giróscopos de fibra óptica de los aviones miden así la rotación.</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Qué espesor mínimo (distinto de cero) debe tener una película de jabón para reflejar con máxima intensidad la luz de 600 nm a incidencia normal?
<details><summary>Respuesta</summary><p>\(d=\lambda/4n=600/(4\times1.33)=113\) nm.</p></details></li>
<li><span class="lvl">Básico</span>Al mover el espejo de un Michelson pasan 1000 franjas con luz de 633 nm. ¿Cuánto se movió el espejo?
<details><summary>Respuesta</summary><p>\(1000\times\lambda/2=0.316\) mm.</p></details></li>
<li><span class="lvl">Intermedio</span>El décimo anillo oscuro de Newton mide 3.0 mm con luz de 550 nm. ¿Cuál es el radio de la lente?
<details><summary>Respuesta</summary><p>\(R=r^2/(m\lambda)=9\times10^{-6}/(10\times550\times10^{-9})=1.64\) m.</p></details></li>
<li><span class="lvl">Intermedio</span>Una mancha de aceite (\(n=1.47\)) sobre agua se ve verde (550 nm) donde se mira perpendicularmente. ¿Qué espesores son posibles?
<details><summary>Respuesta</summary><p>Un solo cambio de fase: \(2nd=(m+\tfrac12)\lambda\Rightarrow d=93.5\) nm, 281 nm, 468 nm…</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que, en un Michelson con espejos perpendiculares y una diferencia de brazos \(\Delta L\), los anillos brillantes cumplen \(2\Delta L\cos\theta=m\lambda\), y que el radio angular del anillo de orden \(m_0-k\), contado desde el centro, es \(\theta_k\approx\sqrt{k\lambda/\Delta L}\).
<details><summary>Respuesta</summary><p>Un rayo que se inclina \(\theta\) ve una diferencia de camino \(2\Delta L\cos\theta\approx2\Delta L(1-\theta^2/2)\). Si el centro es el orden \(m_0\), el anillo \(k\)-ésimo cumple \(\Delta L\theta^2=k\lambda\).</p></details></li>
</ol>
