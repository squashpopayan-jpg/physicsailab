<template class="chapter-src" data-id="aberraciones" data-num="9" data-title="Aberraciones" data-part="Parte II · Óptica geométrica" data-short="Los límites de la aproximación paraxial: aberración esférica y forma óptima de una lente, coma, astigmatismo, curvatura de campo y distorsión, diagramas de manchas, aberración cromática y el doblete acromático">
<p class="lead">Las fórmulas de los capítulos anteriores suponen rayos casi paralelos al eje. Los rayos reales de una lente con abertura grande o de un objeto fuera del eje no convergen en un punto: la imagen de una estrella se vuelve una mancha. Esas desviaciones, las <span class="term">aberraciones</span>, son el problema central del diseño óptico. Este capítulo las clasifica, las mide con trazado exacto de rayos y muestra cómo se corrigen combinando superficies y vidrios.</p>

<section>
<h2>Más allá de la aproximación paraxial</h2>
<p>La aproximación paraxial reemplaza \(\sen\theta\) por \(\theta\). Si se conserva el siguiente término, \(\sen\theta\approx\theta-\theta^3/6\), aparecen correcciones proporcionales al cubo de las alturas y los ángulos: la <span class="term">teoría de tercer orden</span>, desarrollada por Ludwig von Seidel en 1856. Para luz monocromática hay cinco aberraciones de tercer orden:</p>
<ul>
<li><b>Aberración esférica</b>: los rayos que pasan lejos del eje enfocan a otra distancia; afecta a todo el campo.</li>
<li><b>Coma</b>: un punto fuera del eje se convierte en una mancha con forma de cometa.</li>
<li><b>Astigmatismo</b>: para un punto fuera del eje, los rayos de dos planos perpendiculares enfocan a distancias distintas.</li>
<li><b>Curvatura de campo</b>: la superficie de mejor imagen es curva, no plana.</li>
<li><b>Distorsión</b>: la imagen es nítida pero el aumento cambia con la distancia al eje, y las rectas se curvan.</li>
</ul>
<p>A ellas se suman las <b>aberraciones cromáticas</b>, que existen aun en la aproximación paraxial porque el índice depende de la longitud de onda.</p>
</section>

<section>
<h2>Aberración esférica</h2>
<p>En una lente convergente simple los rayos marginales cruzan el eje antes que los paraxiales. La distancia entre ambos cruces es la <span class="term">aberración esférica longitudinal</span> (LSA). En tercer orden crece como el cuadrado de la altura \(h\) del rayo y depende de la forma de la lente a través de su factor de forma \(q\) y de la posición del objeto a través de \(p=(s_i-s_o)/(s_i+s_o)\) (\(p=-1\) para un objeto en el infinito):</p>
<div class="eq key" data-name="Aberración esférica de una lente delgada">\[\frac1{s'_h}-\frac1{s'_p}=\frac{h^2}{8f^3n(n-1)}\left[\frac{n+2}{n-1}q^2+4(n+1)pq+(3n+2)(n-1)p^2+\frac{n^3}{n-1}\right].\]</div>
<p>La aberración nunca se anula para una lente simple de vidrio con objeto real, pero es mínima con \(q=-2(n^2-1)p/(n+2)\): para N-BK7 y objeto lejano, \(q=0.74\), una forma casi planoconvexa con la cara curva hacia el objeto. Con \(f=100\) mm y un rayo a 10 mm, el trazado exacto da una LSA de 1.10 mm para la planoconvexa bien orientada (la teoría de tercer orden predice 1.096 mm), 1.02 mm para la forma óptima, y 4.38 mm si la misma lente se coloca al revés. La regla práctica: la cara curva mira hacia el haz más paralelo, para repartir la desviación entre las dos superficies.</p>
<div class="sim" data-sim="aberracion-esferica" data-title="Aberración esférica de un singlete y su forma"></div>
<div class="sim-guide"><ul>
<li>Cambie el factor de forma \(q\) manteniendo la focal paraxial en 100 mm. La curva compara la LSA del trazado exacto (continua) con la de tercer orden (discontinua).</li>
<li>Busque el mínimo cerca de \(q=0.74\) y compare con la lente invertida (\(q=-1\)).</li>
</ul></div>
<p>Fuera del foco paraxial hay un plano donde la mancha es más pequeña: el <span class="term">círculo de menor confusión</span>, a unos tres cuartos de la LSA desde el foco paraxial hacia la lente. Las superficies asféricas, hoy moldeadas en vidrio o plástico, permiten eliminar la aberración esférica con una sola lente, como en los lectores de discos y las cámaras de los celulares.</p>
</section>

<section>
<h2>Coma, astigmatismo, curvatura de campo y distorsión</h2>
<p>Para un punto fuera del eje la simetría se rompe. El <span class="term">coma</span> aparece porque las distintas zonas anulares de la lente forman imágenes de tamaño distinto: cada zona da un círculo desplazado y su envolvente es una mancha de cometa de 60°. El <span class="term">astigmatismo</span> aparece porque un haz oblicuo «ve» la lente con curvaturas distintas en el plano meridional (tangencial) y en el perpendicular (sagital): hay dos líneas focales separadas, y entre ellas un círculo de menor confusión. Aun sin astigmatismo, la imagen de un objeto plano cae sobre una superficie curva, la <span class="term">superficie de Petzval</span>, de radio \(R_P\) con</p>
<div class="eq">\[\frac1{R_P}=-\sum_i\frac1{n_if_i},\]</div>
<p>que para una lente simple de N-BK7 de 100 mm es −152 mm. No depende de las formas ni de las posiciones de las lentes, solo de sus potencias e índices, y para aplanarla hacen falta lentes negativas: por eso los objetivos de campo plano incluyen elementos divergentes.</p>
<div class="sim" data-sim="spot" data-title="Diagramas de manchas: aberración esférica, coma y astigmatismo"></div>
<div class="sim-guide"><ul>
<li>Cada punto es el impacto de un rayo exacto, trazado en tres dimensiones a través de la lente, en el plano de la imagen. El círculo gris es el disco de Airy, el límite que impone la difracción.</li>
<li>En el eje, la mancha es simétrica (aberración esférica); al inclinar el haz aparece la cola del coma y, con más campo, la forma alargada del astigmatismo. Mueva el plano de enfoque y compare la lente simple con el doblete.</li>
</ul></div>
<p>La <span class="term">distorsión</span> no borra la imagen: cambia el aumento con la altura. Depende de la posición del diafragma. Con el diafragma delante de una lente convergente, los rayos principales de los bordes cruzan la lente más cerca del centro de lo que corresponde y el aumento disminuye hacia los bordes: <span class="term">distorsión de barril</span>. Con el diafragma detrás aparece la de <span class="term">cojín</span>. Un sistema simétrico con el diafragma en el centro no tiene distorsión, y por eso muchos objetivos son casi simétricos.</p>
<div class="sim" data-sim="distorsion" data-title="Distorsión de barril y de cojín según el diafragma"></div>
<div class="sim-guide"><ul>
<li>El aumento se mide trazando el rayo principal exacto por el centro del diafragma para cada ángulo de campo. Mueva el diafragma delante y detrás de la lente.</li>
<li>La cuadrícula de la derecha muestra cómo se vería un objeto cuadriculado.</li>
</ul></div>
</section>

<section>
<h2>Aberración cromática y el doblete acromático</h2>
<p>Como el índice crece hacia el azul, una lente convergente enfoca el azul más cerca que el rojo. En una lente delgada la diferencia de focales entre las líneas F y C es</p>
<div class="eq">\[f_C-f_F\approx\frac{f}{\nu_d}:\]</div>
<p>una lente de N-BK7 de 100 mm tiene 1.55 mm de <span class="term">aberración cromática longitudinal</span>, y la imagen de un punto blanco queda rodeada de halos de color. Newton creyó que era imposible de corregir y construyó por eso su telescopio de espejo. Chester Moor Hall (1733) y John Dollond (1758) mostraron lo contrario: una lente convergente de crown en contacto con una divergente de flint, con potencias</p>
<div class="eq key" data-name="Doblete acromático">\[\varphi_1=\varphi\,\frac{\nu_1}{\nu_1-\nu_2},\qquad\varphi_2=-\varphi\,\frac{\nu_2}{\nu_1-\nu_2},\]</div>
<p>tienen la misma focal en F y en C. Para un acromático de 100 mm con N-BK7 y N-F2 hacen falta un crown de \(f_1=43.2\) mm y un flint de \(f_2=-76.1\) mm. El color no desaparece del todo: queda el <span class="term">espectro secundario</span>, porque la dispersión de los dos vidrios no es proporcional en todo el espectro; el verde enfoca más cerca que el rojo y el azul, unas seis diezmilésimas de la focal (0.06 mm en el acromático de 100 mm). Los objetivos <span class="term">apocromáticos</span> lo reducen con fluorita o vidrios de dispersión parcial anómala.</p>
<div class="sim" data-sim="cromatica" data-title="Focal frente a longitud de onda: singlete y acromático"></div>
<div class="sim-guide"><ul>
<li>La curva da el desplazamiento del foco respecto del de la línea d, calculado con los índices de Sellmeier. El singlete varía monótonamente; el acromático tiene la forma de U del espectro secundario, con focales iguales en F y C.</li>
<li>Pruebe otras parejas de vidrios: cuanto mayor la diferencia de números de Abbe, más débiles salen los dos elementos.</li>
</ul></div>
</section>

<section>
<h2>El límite: la difracción</h2>
<p>Corregir las aberraciones tiene un límite natural. Aun sin ninguna aberración, la imagen de un punto es el <span class="term">disco de Airy</span> (capítulo 16), de radio \(1.22\lambda N\): 2.7 µm para f/4 en luz verde. Un sistema se llama <span class="term">limitado por difracción</span> cuando sus aberraciones son menores que eso; el criterio de Rayleigh pide que el frente de onda no se aparte de la esfera ideal en más de \(\lambda/4\). Los diseñadores actuales optimizan decenas de radios, espesores y vidrios con programas de trazado de rayos que hacen exactamente lo que hacen las simulaciones de este capítulo, millones de veces.</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Cuánto vale la aberración cromática longitudinal de una lente de 200 mm de N-SF11 (\(\nu_d=25.7\))?
<details><summary>Respuesta</summary><p>\(f/\nu_d=7.8\) mm.</p></details></li>
<li><span class="lvl">Básico</span>¿Por qué una lente planoconvexa usada para enfocar un haz láser colimado debe tener la cara curva hacia el láser?
<details><summary>Respuesta</summary><p>Así las dos superficies reparten la desviación y la aberración esférica es unas cuatro veces menor (1.1 frente a 4.4 mm en el ejemplo del texto).</p></details></li>
<li><span class="lvl">Intermedio</span>Diseñe un acromático delgado de 200 mm con N-BK7 (\(\nu=64.17\)) y N-SF11 (\(\nu=25.68\)).
<details><summary>Respuesta</summary><p>\(f_1=200(64.17-25.68)/64.17=120.0\) mm; \(f_2=-200(38.49)/25.68=-299.8\) mm.</p></details></li>
<li><span class="lvl">Intermedio</span>Con la fórmula de tercer orden, ¿cuánto cambia la aberración esférica de una lente si se duplica el diámetro del haz manteniendo la focal?
<details><summary>Respuesta</summary><p>La longitudinal crece como \(h^2\): cuatro veces. La transversal (\(\propto h^3\)) ocho veces.</p></details></li>
<li><span class="lvl">Avanzado</span>Calcule el radio de Petzval de un doblete acromático de 100 mm formado por N-BK7 (\(f_1=43.2\) mm) y N-F2 (\(f_2=-76.1\) mm). ¿Es más plano que el de un singlete de N-BK7 de la misma focal?
<details><summary>Respuesta</summary><p>\(1/R_P=-[1/(1.5168\times43.2)+1/(1.6200\times(-76.1))]=-(0.01526-0.00811)\Rightarrow R_P=-140\) mm. No: es algo más curvo que el del singlete (−152 mm), porque el flint es débil y de índice alto. Para aplanar el campo hacen falta elementos negativos de índice bajo y separados.</p></details></li>
</ol>
