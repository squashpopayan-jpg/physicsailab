<template class="chapter-src" data-id="young" data-num="13" data-title="El experimento de Young" data-part="Parte III · Interferencia" data-short="Interferencia por división del frente de onda: las dos rendijas de Young, posición e intensidad de las franjas, medida de la longitud de onda, franjas en luz blanca, el espejo de Lloyd y el cambio de fase en la reflexión, el biprisma de Fresnel y la interferencia de fotones uno a uno">
<p class="lead">En 1801 Thomas Young hizo pasar luz del Sol por dos aberturas próximas y vio sobre una pantalla franjas brillantes y oscuras. Con ellas midió la longitud de onda de cada color y demostró que la luz es una onda. Dos siglos después el mismo experimento, hecho con fotones o electrones que llegan de uno en uno, sigue siendo la puerta de entrada a la mecánica cuántica. Este capítulo lo analiza con detalle y estudia otros montajes que dividen un frente de onda en dos.</p>

<section>
<h2>Dos rendijas</h2>
<p>Una onda plana de longitud \(\lambda\) ilumina dos rendijas estrechas separadas una distancia \(d\). Cada una actúa como una fuente secundaria y, como ambas están iluminadas por el mismo frente de onda, sus fases están ligadas: son coherentes. En un punto de una pantalla lejana, a un ángulo \(\theta\), la diferencia de camino entre las dos ondas es \(d\sen\theta\), y la intensidad es</p>
<div class="eq key" data-name="Franjas de Young">\[I(\theta)=4I_0\cos^2\!\left(\frac{\pi d\sen\theta}{\lambda}\right).\]</div>
<p>Hay máximos donde \(d\sen\theta=m\lambda\) (\(m\) entero, el <span class="term">orden</span> de la franja) y mínimos a medio camino. Sobre una pantalla a la distancia \(L\gg d\), con \(y=L\tan\theta\approx L\theta\), las franjas brillantes están igualmente espaciadas:</p>
<div class="eq key" data-name="Interfranja">\[\Delta y=\frac{\lambda L}{d}.\]</div>
<p>Con un láser de He–Ne (632.8 nm), rendijas a 0.25 mm y una pantalla a 1 m, las franjas están separadas 2.53 mm: se miden con una regla. Young midió así 676 nm para el extremo rojo del espectro y 424 nm para el violeta, valores excelentes para 1802. La energía no se crea ni se destruye: los máximos tienen el doble de la intensidad que darían las dos rendijas sin interferir, y los mínimos, nada. En un experimento real cada rendija tiene un ancho finito y el patrón de interferencia queda modulado por el de difracción de una rendija (capítulo 16).</p>
<div class="sim" data-sim="young" data-title="Dos fuentes coherentes: el campo y las franjas"></div>
<div class="sim-guide"><ul>
<li>El mapa muestra la intensidad promediada en el tiempo detrás de las rendijas: las franjas son hipérbolas sobre las que la diferencia de camino es constante.</li>
<li>Cambie la separación y la longitud de onda; la lectura compara la interfranja medida en la pantalla con \(\lambda L/d\).</li>
</ul></div>
</section>

<section>
<h2>Franjas en luz blanca</h2>
<p>Con luz blanca cada longitud de onda forma su propio sistema de franjas con su interfranja. En el centro (\(m=0\)) todas coinciden y la franja es blanca; a los lados las franjas de colores se desplazan unas respecto de otras, el borde interior de cada franja brillante queda azulado y el exterior rojizo, y después de unos pocos órdenes los colores se mezclan en un blanco uniforme. Es una manifestación de la coherencia temporal del capítulo 12: la luz blanca tiene una longitud de coherencia de una micra, unas dos longitudes de onda. La franja blanca central es muy útil: marca exactamente la diferencia de camino cero, y así se igualan los brazos de los interferómetros.</p>
<div class="sim" data-sim="young-blanca" data-title="Franjas de Young en luz blanca"></div>
<div class="sim-guide"><ul>
<li>Los colores de la pantalla se calculan sumando las franjas de cada longitud de onda, pesadas con el espectro de la fuente, e integrando con las funciones de color de la CIE.</li>
<li>Estreche el espectro: aparecen más franjas visibles. Con luz blanca solo se distinguen tres o cuatro órdenes.</li>
</ul></div>
</section>

<section>
<h2>El espejo de Lloyd y el biprisma de Fresnel</h2>
<p>Hay otras formas de dividir un frente de onda. En el <span class="term">espejo de Lloyd</span> (1834), una rendija ilumina un espejo a incidencia rasante; en la pantalla se superponen la luz directa y la reflejada, que parece venir de la imagen virtual de la rendija. Es un experimento de Young con dos fuentes separadas \(2h\), si la rendija está a una altura \(h\) sobre el espejo. Pero en el borde del espejo, donde los caminos son iguales, la franja es <b>oscura</b>: la reflexión en un medio de mayor índice añade un desfase de \(\pi\) (capítulo 21). Lloyd demostró así el cambio de fase en la reflexión.</p>
<p>En el <span class="term">biprisma de Fresnel</span> dos prismas delgados de ángulo \(\alpha\), unidos por la base, desvían la luz de una rendija hacia arriba y hacia abajo en \((n-1)\alpha\). Las dos mitades del haz parecen venir de dos imágenes virtuales de la rendija separadas \(d=2a(n-1)\alpha\), si la rendija está a una distancia \(a\). Con \(n=1.5\), \(\alpha=0.5°\) y \(a=10\) cm, las fuentes virtuales quedan a 0.87 mm y la luz de sodio da franjas de 0.74 mm sobre una pantalla a 1.1 m de las fuentes.</p>
<div class="sim" data-sim="lloyd" data-title="Espejo de Lloyd y biprisma de Fresnel"></div>
<div class="sim-guide"><ul>
<li>En el espejo de Lloyd la franja en la superficie del espejo es oscura por el desfase de \(\pi\). Desactívelo para ver qué pasaría sin él.</li>
<li>En el biprisma, las dos fuentes virtuales están en el plano de la rendija; su separación crece con el ángulo de los prismas.</li>
</ul></div>
</section>

<section>
<h2>Interferencia de fotones uno a uno</h2>
<p>En 1909 Geoffrey Ingram Taylor fotografió franjas de difracción con una luz tan débil que la exposición duró tres meses: en promedio había menos de un fotón a la vez dentro del aparato, y las franjas eran tan nítidas como con luz intensa. Hoy el experimento se hace con detectores que registran cada fotón: los impactos aparecen en lugares aleatorios, uno a uno, pero su densidad sigue el patrón de franjas. Akira Tonomura repitió en 1989 el experimento con electrones, y en 1999 Markus Arndt lo hizo con moléculas de fulereno C₆₀.</p>
<p>La mecánica cuántica lo describe así: cada fotón tiene una amplitud de probabilidad de pasar por cada rendija; las amplitudes se suman como los campos de la onda clásica, y la probabilidad de detectarlo en un punto es el cuadrado del módulo de la suma. Si se averigua por qué rendija pasó cada fotón, las amplitudes ya no se suman y las franjas desaparecen (capítulo 28).</p>
<div class="sim" data-sim="fotones-young" data-title="Fotones que llegan uno a uno"></div>
<div class="sim-guide"><ul>
<li>Cada punto es un fotón detectado, sorteado con la probabilidad \(\propto I(y)\). Con pocos fotones el patrón no se ve; con miles aparecen las franjas.</li>
<li>Active el detector de rendija: las probabilidades se suman sin interferencia y queda una sola campana.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Dos rendijas separadas 0.15 mm se iluminan con 532 nm. ¿A qué distancia de la franja central está la tercera franja brillante sobre una pantalla a 2 m?
<details><summary>Respuesta</summary><p>\(y_3=3\lambda L/d=21.3\) mm.</p></details></li>
<li><span class="lvl">Básico</span>En un experimento de Young con luz de 600 nm las franjas están a 1.2 mm. ¿Cuánto miden con 450 nm?
<details><summary>Respuesta</summary><p>Proporcional a \(\lambda\): 0.9 mm.</p></details></li>
<li><span class="lvl">Intermedio</span>Se cubre una de las rendijas con una lámina de vidrio de índice 1.5 y 10 µm de espesor. ¿Cuántas franjas se desplaza el patrón con luz de 600 nm, y hacia dónde?
<details><summary>Respuesta</summary><p>La lámina añade \((n-1)t=5\) µm de camino: \(5/0.6=8.3\) franjas, hacia el lado de la rendija cubierta.</p></details></li>
<li><span class="lvl">Intermedio</span>En un espejo de Lloyd la rendija está a 0.4 mm sobre el plano del espejo y la pantalla a 1.5 m. ¿Qué interfranja da la luz de 633 nm y qué hay en el borde del espejo?
<details><summary>Respuesta</summary><p>\(d=0.8\) mm: \(\Delta y=1.19\) mm. En el borde, una franja oscura.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que las superficies de máximo de interferencia de dos fuentes puntuales son hiperboloides de revolución con focos en las fuentes, y que lejos de ellas se vuelven conos de semiángulo \(\arccos(m\lambda/d)\) alrededor del eje que las une.
<details><summary>Respuesta</summary><p>Los máximos cumplen \(r_1-r_2=m\lambda\), la definición de hipérbola con focos en las fuentes; al girar alrededor del eje, hiperboloides. Lejos, \(r_1-r_2\to d\cos\phi\), con \(\phi\) el ángulo con el eje.</p></details></li>
</ol>

</section>
