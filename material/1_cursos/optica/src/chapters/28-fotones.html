<p class="lead">La óptica de los capítulos anteriores se hizo con ondas, y funciona porque la luz cotidiana contiene trillones de fotones. Cuando la luz es muy débil, o cuando lo que interesa es cómo se emite y se detecta, aparece su naturaleza cuántica: llega en paquetes indivisibles, sus fluctuaciones dependen de cómo se produjo, y un solo fotón interfiere consigo mismo. Este capítulo cierra el curso con esos fenómenos, que hoy sostienen la criptografía cuántica y las tecnologías de la información cuántica.</p>

<section>
<h2>El efecto fotoeléctrico</h2>
<p>Al iluminar un metal se desprenden electrones. Philipp Lenard observó en 1902 que su energía no depende de la intensidad de la luz sino de su frecuencia, y que por debajo de cierta frecuencia no sale ninguno, por intensa que sea la luz. Einstein lo explicó en 1905: la luz llega en cuantos de energía \(h\nu\), y cada electrón absorbe un cuanto entero. Si \(W\) es la <span class="term">función de trabajo</span> del metal,</p>
<div class="eq key" data-name="Efecto fotoeléctrico">\[K_{max}=h\nu-W,\qquad eV_0=K_{max}.\]</div>
<p>El potencial de frenado \(V_0\) crece linealmente con la frecuencia, con pendiente \(h/e\). Robert Millikan, que esperaba refutar a Einstein, midió esa pendiente en 1916 y obtuvo \(h\) con un 0.5 % de error. Con cesio (\(W=2.14\) eV) la luz de 400 nm arranca electrones de 0.96 eV y el umbral está en 579 nm; con cobre (4.65 eV) hace falta ultravioleta de menos de 267 nm. La intensidad solo cambia el número de electrones. Los fotomultiplicadores, las cámaras CCD y las celdas solares cuentan fotones con este principio.</p>
<div class="sim" data-sim="fotoelectrico" data-title="Efecto fotoeléctrico: potencial de frenado y corriente"></div>
<div class="sim-guide"><ul>
<li>Elija el metal y la longitud de onda: la energía máxima de los electrones no depende de la intensidad. Por debajo del umbral no hay corriente.</li>
<li>La curva de la derecha es la corriente en función del voltaje del colector: se anula en \(-V_0\) y satura con voltajes positivos, en un valor proporcional a la intensidad.</li>
</ul></div>
</section>

<section>
<h2>Energía, momento y número de fotones</h2>
<p>Cada fotón lleva una energía \(h\nu\) y un momento \(p=h/\lambda\). Un láser de 1 W a 1064 nm emite \(5.4\times10^{18}\) fotones por segundo; un fotón verde de 500 nm tiene un momento de \(1.3\times10^{-27}\) kg·m/s, y la suma de muchos de ellos es la presión de radiación del capítulo 2. El ojo adaptado a la oscuridad detecta destellos de unos pocos fotones, y un bastón responde a uno solo. Las <span class="term">pinzas ópticas</span> de Arthur Ashkin (Nobel 2018) usan el momento de la luz de un haz muy enfocado para atrapar bacterias y moléculas individuales con fuerzas de piconewtons.</p>
</section>

<section>
<h2>Estadística de fotones</h2>
<p>Si se cuentan los fotones que llegan a un detector en intervalos iguales, el número fluctúa. La forma de las fluctuaciones revela la fuente. Un láser ideal produce un <span class="term">estado coherente</span>: los fotones llegan al azar e independientes, y el número en cada intervalo sigue la distribución de Poisson, con varianza igual a la media, \(\langle\Delta n^2\rangle=\bar n\). Ese es el <span class="term">ruido de disparo</span>: con un millón de fotones, una incertidumbre relativa de una milésima. La luz térmica (una lámpara, una estrella) observada en tiempos menores que su tiempo de coherencia sigue la distribución de Bose–Einstein, con varianza \(\bar n+\bar n^2\): sus fotones llegan agrupados.</p>
<div class="eq key" data-name="Distribuciones de fotones">\[P_{coh}(n)=\ee^{-\bar n}\frac{\bar n^n}{n!},\qquad P_{term}(n)=\frac{\bar n^n}{(1+\bar n)^{n+1}}.\]</div>
<p>Robert Hanbury Brown y Richard Twiss midieron en 1956 la correlación entre las intensidades de dos detectores que miraban la misma estrella. La función \(g^{(2)}(0)=\langle I^2\rangle/\langle I\rangle^2\) vale 2 para la luz térmica (agrupamiento), 1 para la coherente y es menor que 1 solo para luz sin análogo clásico: un átomo aislado no puede emitir dos fotones a la vez, y su luz tiene \(g^{(2)}(0)=0\). Jeff Kimble observó ese <span class="term">antiagrupamiento</span> en 1977, la primera prueba directa de que los fotones existen como entidades individuales.</p>
<div class="sim" data-sim="estadistica" data-title="Conteo de fotones: luz coherente frente a luz térmica"></div>
<div class="sim-guide"><ul>
<li>Cada barra cuenta cuántos intervalos tuvieron \(n\) fotones, en miles de intervalos sorteados. Las curvas son Poisson y Bose–Einstein.</li>
<li>La luz térmica tiene más intervalos vacíos y más intervalos muy llenos: \(g^{(2)}(0)=2\).</li>
</ul></div>
</section>

<section>
<h2>Interferencia de un solo fotón</h2>
<p>En un interferómetro de Mach–Zehnder, un primer divisor de haz separa la luz en dos caminos y un segundo los recombina. Si la luz es tan débil que en el aparato hay en promedio mucho menos de un fotón, cada fotón llega a uno de los dos detectores de salida, nunca a ambos, pero las probabilidades siguen el patrón de interferencia: \(P_1=\cos^2(\varphi/2)\) y \(P_2=\sen^2(\varphi/2)\), donde \(\varphi\) es la diferencia de fase entre los caminos. Philippe Grangier, Gérard Roger y Alain Aspect lo demostraron en 1986 con fotones individuales emitidos de uno en uno por átomos de calcio. Si se coloca en un camino cualquier dispositivo que registre por dónde pasó el fotón, la interferencia desaparece: los detectores reciben la mitad de los fotones cada uno sea cual sea la fase. La información de camino y la interferencia son complementarias, como había anticipado Bohr.</p>
<div class="sim" data-sim="mz-foton" data-title="Mach–Zehnder con fotones de uno en uno"></div>
<div class="sim-guide"><ul>
<li>Los fotones se envían de a uno. Cambie la fase de un brazo: la fracción en cada detector sigue \(\cos^2\) y \(\sen^2\) de \(\varphi/2\).</li>
<li>Active el marcador de camino: las cuentas se igualan, sin importar la fase.</li>
</ul></div>
</section>

<section>
<h2>Criptografía cuántica</h2>
<p>Un fotón polarizado no puede medirse sin alterarlo si no se conoce de antemano la base en que se preparó. Charles Bennett y Gilles Brassard propusieron en 1984 el protocolo <span class="term">BB84</span>: Alicia envía fotones polarizados al azar en la base rectilínea (0°, 90°) o en la diagonal (45°, 135°); Bernardo mide cada uno en una base elegida al azar; luego comparan públicamente las bases, sin revelar los resultados, y conservan los bits en que coincidieron. Si una espía intercepta y reenvía los fotones, elige mal la base la mitad de las veces y produce un 25 % de errores en la clave, que Alicia y Bernardo detectan comparando una muestra. La seguridad no depende de la dificultad de un cálculo sino de las leyes de la física. Los enlaces de distribución cuántica de claves por fibra y por satélite ya funcionan; el Nobel de Física de 2022 premió los experimentos de entrelazamiento que fundamentan estas tecnologías.</p>
<div class="sim" data-sim="bb84" data-title="Distribución cuántica de claves con el protocolo BB84"></div>
<div class="sim-guide"><ul>
<li>Cada fila es un fotón: base y bit de Alicia, base de Bernardo, resultado. Se conservan los que tienen la misma base (la mitad).</li>
<li>Active la espía: la tasa de error de la clave conservada sube al 25 %.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Cuál es la longitud de onda umbral del potasio (\(W=2.30\) eV)? ¿Qué potencial de frenado da con luz de 400 nm?
<details><summary>Respuesta</summary><p>\(\lambda_0=1239.84/2.30=539\) nm; \(V_0=3.10-2.30=0.80\) V.</p></details></li>
<li><span class="lvl">Básico</span>¿Cuántos fotones por segundo emite un LED de 10 mW a 450 nm?
<details><summary>Respuesta</summary><p>\(N=P\lambda/hc=2.27\times10^{16}\) por segundo.</p></details></li>
<li><span class="lvl">Intermedio</span>Un detector cuenta en promedio 100 fotones de un láser por intervalo. ¿Cuál es la desviación típica? ¿Y si fueran de luz térmica?
<details><summary>Respuesta</summary><p>Coherente: \(\sqrt{100}=10\). Térmica: \(\sqrt{100+10^4}=100.5\).</p></details></li>
<li><span class="lvl">Intermedio</span>En un Mach–Zehnder con \(\varphi=60°\), ¿qué fracción de fotones llega a cada detector?
<details><summary>Respuesta</summary><p>\(\cos^230°=0.75\) y \(\sen^230°=0.25\).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que en BB84 una espía que intercepta todos los fotones, mide en una base al azar y reenvía lo que midió produce una tasa de error del 25 % en los bits conservados.
<details><summary>Respuesta</summary><p>En los bits conservados Alicia y Bernardo usaron la misma base. La espía acierta la base con probabilidad 1/2 (sin error); con la base equivocada (1/2) reenvía un estado de la otra base, que Bernardo lee al azar: error 1/2. Total \(\tfrac12\times\tfrac12=\tfrac14\).</p></details></li>
</ol>
