<p class="lead">Todos los cálculos de las simulaciones salen de dos bibliotecas únicas: <code>src/core/30-optics.js</code> (constantes, materiales, fórmulas y soluciones analíticas) y <code>src/core/31-num.js</code> (FFT, propagación por espectro angular, trazado exacto de rayos, Kramers–Kronig, ecuaciones de tasa), más dos tablas generadas una sola vez: las funciones de color de la CIE y el iluminante D65 (con colour-science) y los índices complejos de los metales (de la base de datos de refractiveindex.info). Un programa automático compara esas bibliotecas con referencias independientes. Este apéndice explica el método y lista cada comprobación con su resultado.</p>

<section>
<h2>Método</h2>
<ol>
<li><b>SciPy, NumPy y mpmath</b> calculan de forma independiente las funciones de Bessel \(J_n\) y \(K_n\) y sus ceros, las integrales de Fresnel, los polinomios de Hermite y Laguerre, la FFT, las integrales de la ley de Planck, el ángulo de Descartes del arcoíris y la desviación mínima del prisma (<code>minimize_scalar</code>), los modos de la guía plana y de la fibra (<code>brentq</code>), la dispersión de la sílice (derivadas con 40 cifras en mpmath) y el ajuste de fases del BBO.</li>
<li><b>SymPy</b> (<code>sympy.physics.optics</code>) aporta los coeficientes de Fresnel, los ángulos de Brewster y crítico, la fórmula del fabricante de lentes, la distancia hiperfocal, las matrices ABCD, los haces gaussianos, los vectores de Jones, los parámetros de Stokes y las matrices de Mueller.</li>
<li><b>tmm</b> (S. Byrnes) calcula la reflexión y la transmisión de ocho pilas de capas (interfaz simple, antirreflejantes, espejo de Bragg, películas de plata y oro, reflexión total frustrada, étalon) en las dos polarizaciones, tres ángulos y tres longitudes de onda.</li>
<li><b>miepython</b> (S. Prahl) da las eficiencias de extinción, esparcimiento y retroesparcimiento, el factor de asimetría y las amplitudes de esparcimiento de esferas dieléctricas y absorbentes de parámetro de tamaño 0.1 a 80.</li>
<li><b>colour-science</b> integra las cromaticidades de cuerpos negros y del iluminante D65, las temperaturas de McCamy, la conversión a sRGB y el color de películas de jabón.</li>
<li><b>Soluciones numéricas contra exactas</b>: Kramers–Kronig contra el oscilador de Lorentz; la MTF por autocorrelación y por FFT contra la fórmula; la integral de Fresnel en el eje; la mancha de Poisson; el trazado exacto de rayos contra la teoría de Seidel y el foco paraxial; el doblete acromático; el invariante del espejismo; el principio de Fermat; el borde recto por espectro angular; el efecto Talbot; la función de Airy y la pila de Bragg por matrices; las ecuaciones de tasa del láser; el modo propio de la cavidad; Mie contra Rayleigh y la estadística de fotones simulada.</li>
<li><b>Catálogo y literatura</b>: índices y números de Abbe de Schott y de Malitson, el agua contra la formulación IAPWS R9-97, el aire de Peck y Reeder contra Edlén, la calcita, el cuarzo y el hielo, el ángulo de ajuste del BBO, los arcos del arcoíris, el halo de 22°, la dispersión nula de la sílice, las constantes CODATA, el iluminante A de la CIE, la eficacia luminosa, la rotación del cuarzo, la fibra estándar y los metales de Johnson y Christy y de Rakić.</li>
</ol>
<p>Los ejemplos resueltos y las respuestas de los problemas se calcularon con la misma biblioteca antes de escribirlos, y varios se corrigieron al no coincidir con el cálculo (por ejemplo, la lente gruesa del capítulo 7, la profundidad de campo del 8, el arcoíris en un líquido de 1.47 del 5, la onda evanescente del 21).</p>
<div class="box note"><h4>Lo que enseñó la validación</h4><p>Algunas diferencias no eran errores del curso sino de convención o de las referencias. El agua tiene \(n=1.33335\) a 589.3 nm según dos fórmulas independientes (Daimon–Masumura e IAPWS), mientras que la cifra de las tablas, 1.33299, es relativa al aire. En SymPy 1.14 la función <code>gaussian_conj</code> calcula mal la longitud de Rayleigh de salida (usa \(1-(s/f)^2\) en vez de \((1-s/f)^2\)), así que se compara solo la posición y la cintura se valida con la fórmula de Self; y la misma biblioteca usa signos opuestos de \(S_3\) en <code>jones_2_stokes</code> y en <code>mueller_matrix</code>. La normalización de las amplitudes de Mie de miepython que coincide con Bohren y Huffman es la de Wiscombe. Otras pruebas obligaron a mejorar el curso: la serie de Mie con partículas grandes necesitó la recurrencia descendente de \(\psi_n\) y un arranque más alto de la derivada logarítmica; Kramers–Kronig necesitó tratar el punto singular de la integral; el modelo de Drude sobreestimaba la reflexión de los metales y se reemplazó por datos medidos.</p></div>
<div class="box warn"><h4>Lo que es ilustrativo</h4><p>Algunas simulaciones usan modelos simplificados y lo dicen: el LED blanco (dos gaussianas), el espectro solar como cuerpo negro de 5772 K y el cielo con esparcimiento simple sin aerosoles ni ozono, la atenuación de la fibra (parámetros típicos), la eficiencia escalar de la red de blaze, la aberración del ojo en la simulación de la pupila óptima, el coeficiente fotoelástico del disco, la curva de ganancia del láser y la corriente del efecto fotoeléctrico. Reproducen la física y los órdenes de magnitud, no un dispositivo concreto.</p></div>
