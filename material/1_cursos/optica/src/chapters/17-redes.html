<template class="chapter-src" data-id="redes" data-num="17" data-title="Redes de difracción y espectroscopía" data-part="Parte IV · Difracción" data-short="N rendijas: máximos principales, secundarios y órdenes ausentes, la ecuación de la red, dispersión angular, solapamiento de órdenes, poder resolutivo mN, redes de reflexión y de blaze, espectrómetros, líneas espectrales, CD y DVD, y la ley de Bragg de los rayos X">
<p class="lead">Una red de difracción es una superficie con miles de rendijas o surcos paralelos e igualmente espaciados. Cada longitud de onda sale en direcciones muy precisas que dependen solo del período de la red, y por eso las redes son el corazón de casi todos los espectrómetros: separan la luz de una estrella, de una lámpara o de una llama en sus colores y permiten leer en ellos la composición química de la fuente.</p>

<section>
<h2>N rendijas</h2>
<p>Con \(N\) rendijas de ancho \(a\) separadas una distancia \(d\), la luz de rendijas vecinas tiene un desfase \(2\alpha\), con \(\alpha=\pi d\sen\theta/\lambda\). Sumando \(N\) fasores (capítulo 12) y multiplicando por el patrón de cada rendija:</p>
<div class="eq key" data-name="N rendijas">\[I(\theta)=I_0\left(\frac{\sen\beta}{\beta}\right)^2\left(\frac{\sen N\alpha}{\sen\alpha}\right)^2,\qquad\beta=\frac{\pi a\sen\theta}{\lambda},\quad\alpha=\frac{\pi d\sen\theta}{\lambda}.\]</div>
<p>Cuando \(d\sen\theta=m\lambda\), todos los fasores están en fase y la intensidad crece como \(N^2\): son los <span class="term">máximos principales</span> de orden \(m\). Entre dos de ellos hay \(N-1\) ceros y \(N-2\) máximos secundarios débiles. El ancho angular de cada máximo principal es inversamente proporcional a \(N\): con muchas rendijas los máximos son líneas finísimas. El patrón de una rendija actúa como envolvente; si un máximo principal cae en un cero de la envolvente (por ejemplo \(d=3a\) suprime los órdenes 3, 6, …), ese orden <span class="term">falta</span>.</p>
<div class="sim" data-sim="n-rendijas" data-title="De dos rendijas a una red"></div>
<div class="sim-guide"><ul>
<li>Aumente \(N\): los máximos principales se afinan y entre ellos aparecen \(N-2\) máximos secundarios.</li>
<li>Con \(d/a\) entero faltan los órdenes que coinciden con los ceros de la envolvente (línea discontinua).</li>
</ul></div>
</section>

<section>
<h2>La ecuación de la red y la dispersión</h2>
<p>Una red de transmisión con \(1/d\) líneas por milímetro, iluminada con un ángulo \(\theta_i\), envía la luz de longitud de onda \(\lambda\) en las direcciones \(\theta_m\) que cumplen la <span class="term">ecuación de la red</span>:</p>
<div class="eq key" data-name="Ecuación de la red">\[d\,(\sen\theta_m-\sen\theta_i)=m\lambda.\]</div>
<p>El orden cero no separa colores: es la luz que pasa sin desviarse. En los demás órdenes, cada longitud de onda sale en un ángulo distinto, con una <span class="term">dispersión angular</span> \(\dd\theta/\dd\lambda=m/(d\cos\theta_m)\). Una red de 600 líneas/mm envía el doblete amarillo del sodio a 20.70° y 20.72° en primer orden, y puede llegar al tercer orden. A diferencia del prisma, la red desvía más el rojo que el azul, y la dispersión es casi lineal. Los órdenes altos de una longitud de onda se superponen con los bajos de otra (el segundo orden de 400 nm cae junto al primero de 800 nm), y por eso los espectrómetros usan filtros para limitar el intervalo.</p>
<p>Un CD es una red de reflexión: sus pistas están separadas 1.6 µm, y un láser rojo de 650 nm sale en primer orden a 24°; en un DVD, con 0.74 µm, a 61°. En un Blu-ray, con pistas de 0.32 µm, la luz visible no tiene ningún orden difractado a incidencia normal: solo se ven colores mirándolo muy de lado.</p>
<div class="sim" data-sim="cd" data-title="Un láser y luz blanca sobre un CD, un DVD y un Blu-ray"></div>
<div class="sim-guide"><ul>
<li>Con el láser, los órdenes salen a los ángulos que da la ecuación de la red; con luz blanca, cada orden se abre en un arcoíris.</li>
<li>Incline la luz: en el Blu-ray aparecen órdenes cuando la incidencia es rasante.</li>
</ul></div>
</section>

<section>
<h2>Poder resolutivo</h2>
<p>Dos longitudes de onda muy próximas se distinguen si el máximo de una cae sobre el primer cero de la otra (criterio de Rayleigh). Como el primer cero está a una fracción \(1/N\) del espaciado entre órdenes, el <span class="term">poder resolutivo</span> de una red es</p>
<div class="eq key" data-name="Poder resolutivo de una red">\[\frac{\lambda}{\Delta\lambda}=mN.\]</div>
<p>No depende del período ni del tamaño de los surcos: solo del número de surcos iluminados y del orden. Para separar el doblete del sodio (589.0 y 589.6 nm) en primer orden bastan 987 líneas: un milímetro y medio de una red de 600 líneas/mm. Una red astronómica de 10 cm con 1200 líneas/mm tiene un poder resolutivo de 120 000 en primer orden, suficiente para medir el corrimiento Doppler de una estrella de 2.5 km/s.</p>
<div class="sim" data-sim="espectrometro" data-title="Espectrómetro de red: lámparas de hidrógeno, sodio y mercurio"></div>
<div class="sim-guide"><ul>
<li>Elija la lámpara y el número de líneas iluminadas. El detector muestra el espectro en el orden elegido; cada línea tiene el ancho que da la difracción de la red.</li>
<li>Con la lámpara de sodio, reduzca el número de líneas hasta que el doblete deje de resolverse: ocurre hacia \(N\approx1000/m\).</li>
</ul></div>
</section>

<section>
<h2>Redes de reflexión y de blaze</h2>
<p>Las redes reales son casi siempre de reflexión: surcos grabados sobre una superficie metalizada. En una red de surcos rectangulares la mayor parte de la luz se queda en el orden cero, que no sirve para nada. Si los surcos tienen un perfil de diente de sierra inclinado un ángulo \(\theta_B\), cada faceta es un pequeño espejo que dirige la luz hacia la dirección de reflexión especular sobre la faceta: la envolvente de difracción de una faceta se centra en un orden elegido, y la red concentra en él hasta el 70–90 % de la luz. Es una <span class="term">red de blaze</span>. Se diseña para una longitud de onda de máxima eficiencia, \(2d\sen\theta_B=m\lambda_B\) en montaje de Littrow; 8.6° para el primer orden en 500 nm con 600 líneas/mm. Las redes <i>echelle</i>, con surcos grandes y ángulos de blaze altos, trabajan en órdenes de 50 a 100 y alcanzan poderes resolutivos de cientos de miles.</p>
<div class="sim" data-sim="blaze" data-title="Eficiencia de una red de blaze"></div>
<div class="sim-guide"><ul>
<li>La envolvente de cada faceta (modelo escalar) se desplaza con el ángulo de blaze. La eficiencia de cada orden es la fracción de luz que cae en él.</li>
<li>Busque el ángulo que lleva al primer orden casi toda la luz de 500 nm.</li>
</ul></div>
</section>

<section>
<h2>Espectroscopía y la ley de Bragg</h2>
<p>Cada elemento químico emite y absorbe en longitudes de onda propias. Joseph von Fraunhofer catalogó en 1814 cientos de líneas oscuras en el espectro solar, que Kirchhoff y Bunsen identificaron en 1859 como absorción de elementos de la atmósfera solar; así se descubrió el helio en el Sol antes que en la Tierra. Las líneas de Balmer del hidrógeno (656.3, 486.1, 434.0 y 410.2 nm) fueron la clave del modelo de Bohr. Hoy los espectrómetros de red miden la composición de los gases, la temperatura de las estrellas y la expansión del universo.</p>
<p>Un cristal es una red tridimensional con períodos de décimas de nanómetro, comparables a la longitud de onda de los rayos X. Los planos atómicos separados \(d\) reflejan en fase cuando</p>
<div class="eq key" data-name="Ley de Bragg">\[2d\sen\theta=m\lambda.\]</div>
<p>Con la radiación Kα del cobre (0.154 nm) y los planos de la sal común (0.282 nm), el primer orden aparece a 15.8°. William Henry y William Lawrence Bragg determinaron así en 1913 la estructura del NaCl, y la misma técnica reveló la doble hélice del ADN.</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿A qué ángulo sale la línea roja del hidrógeno (656.3 nm) en el primer y en el segundo orden de una red de 300 líneas/mm?
<details><summary>Respuesta</summary><p>\(d=3.33\) µm: \(\theta_1=11.4°\), \(\theta_2=23.2°\).</p></details></li>
<li><span class="lvl">Básico</span>¿Cuál es el orden máximo de una red de 1200 líneas/mm para luz de 550 nm a incidencia normal?
<details><summary>Respuesta</summary><p>\(m\le d/\lambda=1.52\): solo el primer orden.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Cuántas líneas debe tener una red para separar en segundo orden dos líneas del mercurio, 577.0 y 579.1 nm?
<details><summary>Respuesta</summary><p>\(\lambda/\Delta\lambda=578/2.1=275\Rightarrow N\ge138\).</p></details></li>
<li><span class="lvl">Intermedio</span>¿Se superpone el segundo orden del violeta (400 nm) con el primero del rojo (750 nm)?
<details><summary>Respuesta</summary><p>El segundo orden de 400 nm cae donde el primero de 800 nm, más allá del rojo de 750 nm: no se superponen. El segundo orden del visible (800–1500 nm equivalentes) sí se superpone con el tercero (1200–2250).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que el poder resolutivo de cualquier espectrómetro de red puede escribirse \(\lambda/\Delta\lambda=W(\sen\theta_m-\sen\theta_i)/\lambda\), donde \(W\) es el ancho iluminado de la red, y concluya que no puede superar \(2W/\lambda\).
<details><summary>Respuesta</summary><p>\(mN=Nd(\sen\theta_m-\sen\theta_i)/\lambda\) y \(Nd=W\). Como cada seno vale como máximo 1 en módulo, \(\abs{\sen\theta_m-\sen\theta_i}\le2\).</p></details></li>
</ol>
