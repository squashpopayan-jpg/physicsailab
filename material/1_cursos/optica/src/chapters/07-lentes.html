<p class="lead">Una lente es un trozo de vidrio limitado por dos superficies curvas. Cada una forma una imagen; la segunda toma como objeto la imagen de la primera. Cuando el vidrio es delgado comparado con las distancias en juego, las dos superficies se combinan en una sola fórmula, y una lente queda descrita por un único número: su distancia focal. Este capítulo deduce esa fórmula, construye imágenes con rayos principales, combina lentes y muestra qué cambia cuando el espesor no es despreciable.</p>

<section>
<h2>La ecuación del fabricante de lentes</h2>
<p>Una lente de índice \(n_l\) en un medio de índice \(n_m\) tiene una primera superficie de radio \(R_1\) y una segunda de radio \(R_2\), con el convenio de signos del capítulo 6 (\(R&gt;0\) si el centro está a la derecha). Aplicando dos veces la ecuación de la superficie refractora y haciendo tender el espesor a cero:</p>
<div class="eq key" data-name="Fabricante de lentes">\[\frac1f=\left(\frac{n_l}{n_m}-1\right)\left(\frac1{R_1}-\frac1{R_2}\right).\]</div>
<p>La inversa de la distancia focal en metros es la <span class="term">potencia</span> en dioptrías: una lente de \(f=50\) cm tiene +2 D; una de \(f=-25\) cm, −4 D. Las lentes más gruesas en el centro que en el borde (biconvexa, planoconvexa, menisco convergente) tienen \(f&gt;0\) en el aire y hacen converger la luz; las más delgadas en el centro, \(f&lt;0\). Una lente biconvexa de N-BK7 con radios de 50 cm tiene \(f=48.4\) cm en el aire, pero 181 cm dentro del agua, porque el contraste de índices es mucho menor. Por eso bajo el agua vemos borroso: la córnea, que aporta dos tercios de la potencia del ojo, pierde casi toda su refracción. Las gafas de buceo devuelven el aire frente al ojo.</p>
<p>Muchas lentes distintas tienen la misma focal: solo importa la diferencia de curvaturas \(1/R_1-1/R_2\). La forma se describe con el <span class="term">factor de forma</span> \(q=(R_2+R_1)/(R_2-R_1)\) (\(q=0\) biconvexa simétrica, \(q=\pm1\) planoconvexa). La focal no cambia al «doblar» la lente, pero sí sus aberraciones (capítulo 9).</p>
<div class="sim" data-sim="fabricante" data-title="Forma de una lente y su distancia focal"></div>
<div class="sim-guide"><ul>
<li>Cambie los radios y el vidrio: la forma real de la lente y su focal se recalculan. Los rayos paralelos se trazan con la ley de Snell exacta.</li>
<li>Use el botón de doblar para recorrer formas con la misma focal paraxial: el foco de los rayos altos se mueve, pero el paraxial no.</li>
</ul></div>
</section>

<section>
<h2>Las ecuaciones de las lentes delgadas</h2>
<p>Con la focal definida, la posición del objeto y la de la imagen cumplen la <span class="term">ecuación de Gauss</span>, idéntica en forma a la de los espejos:</p>
<div class="eq key" data-name="Lente delgada">\[\frac1{s_o}+\frac1{s_i}=\frac1f,\qquad m=-\frac{s_i}{s_o}.\]</div>
<p>Si las distancias se miden desde los focos, \(x_o=s_o-f\) y \(x_i=s_i-f\), la relación toma la forma de <span class="term">Newton</span>, \(x_ox_i=f^2\), cómoda cuando el objeto o la imagen están lejos. Para una lente convergente de \(f=10\) cm: un objeto a 30 cm da una imagen real e invertida a 15 cm; a 15 cm, una imagen real a 30 cm de doble tamaño (el proyector); a 5 cm, dentro del foco, una imagen virtual y derecha a 10 cm del mismo lado, aumentada al doble (la lupa). Una lente divergente siempre da imágenes virtuales, derechas y reducidas de los objetos reales.</p>
<p>Para construir la imagen bastan dos de los tres <span class="term">rayos principales</span>: el que llega paralelo al eje sale hacia el foco imagen \(F'\); el que pasa por el centro de la lente no se desvía; el que pasa por el foco objeto \(F\) sale paralelo.</p>
<div class="sim" data-sim="lente-delgada" data-title="Lente delgada: rayos principales e imagen"></div>
<div class="sim-guide"><ul>
<li>Arrastre el objeto sobre el eje o use los deslizadores. Las líneas discontinuas son prolongaciones de los rayos hacia una imagen virtual.</li>
<li>Busque las posiciones notables: \(s_o=2f\) da una imagen del mismo tamaño; \(s_o=f\) la manda al infinito.</li>
</ul></div>
<table>
<tr><th>Objeto (lente convergente)</th><th>Imagen</th><th>Ejemplo</th></tr>
<tr><td>\(s_o&gt;2f\)</td><td>real, invertida, reducida, entre \(f\) y \(2f\)</td><td>cámara, ojo</td></tr>
<tr><td>\(s_o=2f\)</td><td>real, invertida, del mismo tamaño, en \(2f\)</td><td>fotocopiadora</td></tr>
<tr><td>\(f&lt;s_o&lt;2f\)</td><td>real, invertida, aumentada, más allá de \(2f\)</td><td>proyector</td></tr>
<tr><td>\(s_o&lt;f\)</td><td>virtual, derecha, aumentada</td><td>lupa</td></tr>
</table>
</section>

<section>
<h2>Combinaciones de lentes</h2>
<p>En un sistema de varias lentes, la imagen que forma la primera es el objeto de la segunda, aunque esa imagen quede detrás de la segunda lente (objeto virtual, \(s_o&lt;0\)). El aumento total es el producto de los aumentos. Dos lentes delgadas de focales \(f_1\) y \(f_2\) separadas una distancia \(d\) equivalen a una lente de focal</p>
<div class="eq key" data-name="Dos lentes separadas">\[\frac1f=\frac1{f_1}+\frac1{f_2}-\frac{d}{f_1f_2},\]</div>
<p>medida desde un plano principal que ya no coincide con ninguna de las dos (capítulo 8). En contacto (\(d=0\)) las potencias se suman: una lente de +10 D y otra de +6.7 D juntas dan +16.7 D. Así suman su potencia la córnea y el cristalino, y así se combinan un crown y un flint en un acromático.</p>
<div class="sim" data-sim="dos-lentes" data-title="Dos lentes: la imagen intermedia"></div>
<div class="sim-guide"><ul>
<li>La primera lente forma una imagen intermedia (en gris) que sirve de objeto a la segunda. Mueva la segunda lente hasta que la imagen intermedia quede detrás de ella: el objeto de la segunda lente se vuelve virtual.</li>
<li>Las lecturas comparan el aumento total con el producto de los aumentos y dan la focal equivalente.</li>
</ul></div>
</section>

<section>
<h2>Lentes gruesas y planos principales</h2>
<p>Cuando el espesor \(t\) no es despreciable, la focal efectiva es</p>
<div class="eq">\[\frac1f=(n-1)\left[\frac1{R_1}-\frac1{R_2}+\frac{(n-1)t}{nR_1R_2}\right],\]</div>
<p>y ya no se mide desde la lente sino desde los <span class="term">planos principales</span> \(H\) y \(H'\): los planos donde se cruzan las prolongaciones de los rayos que entran paralelos con las de los que salen hacia el foco. La ecuación de Gauss sigue valiendo si \(s_o\) se mide desde \(H\) y \(s_i\) desde \(H'\). Una lente biconvexa de N-BK7 con radios de 50 mm y 8 mm de espesor tiene \(f=49.73\) mm, sus planos principales están 2.71 mm hacia adentro de cada vértice y el foco queda a 47.02 mm de la cara de salida: la <span class="term">distancia focal posterior</span> que se mide en el laboratorio. En un teleobjetivo el plano principal imagen queda delante de la primera lente y el sistema es más corto que su focal (capítulo 8).</p>
<div class="sim" data-sim="lente-gruesa" data-title="Lente gruesa: focos y planos principales"></div>
<div class="sim-guide"><ul>
<li>Los rayos paralelos se trazan exactamente; las prolongaciones discontinuas de entrada y de salida se cruzan sobre el plano principal \(H'\).</li>
<li>Aumente el espesor o use una lente de menisco: los planos principales pueden salir de la lente.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una lente planoconvexa de N-BK7 (\(n=1.5168\)) debe tener \(f=10\) cm. ¿Qué radio necesita?
<details><summary>Respuesta</summary><p>\(R=(n-1)f=5.17\) cm.</p></details></li>
<li><span class="lvl">Básico</span>Un objeto de 4 cm está a 12 cm de una lente divergente de \(f=-6\) cm. Halle la imagen.
<details><summary>Respuesta</summary><p>\(s_i=12(-6)/18=-4\) cm (virtual, del lado del objeto); \(m=1/3\): imagen derecha de 1.33 cm.</p></details></li>
<li><span class="lvl">Intermedio</span>Dos lentes de \(f_1=10\) cm y \(f_2=15\) cm están separadas 40 cm. Un objeto está a 20 cm de la primera. ¿Dónde queda la imagen final y cuál es el aumento total?
<details><summary>Respuesta</summary><p>La primera forma la imagen a 20 cm (\(m_1=-1\)); para la segunda \(s_o=20\) cm y \(s_i=60\) cm (\(m_2=-3\)). Imagen real a 60 cm de la segunda lente, \(m=3\) (derecha).</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre la forma de Newton \(x_ox_i=f^2\) a partir de la ecuación de Gauss y verifíquela con \(f=10\) cm y \(s_o=30\) cm.
<details><summary>Respuesta</summary><p>Sustituyendo \(s_o=f+x_o\), \(s_i=f+x_i\) y simplificando. Con \(x_o=20\), \(x_i=5\): \(20\times5=100=f^2\).</p></details></li>
<li><span class="lvl">Avanzado</span>Una lente biconvexa simétrica de vidrio de índice 1.6, radios de 30 mm y espesor 10 mm. Calcule su focal, la posición de sus planos principales y la distancia focal posterior.
<details><summary>Respuesta</summary><p>Con \(R_1R_2=-900\) mm²: \(1/f=0.6[2/30-0.6\times10/(1.6\times900)]\Rightarrow f=26.67\) mm. \(H'\) está a \(-ft(n-1)/(nR_1)=-3.33\) mm del vértice de salida (hacia adentro), \(H\) simétrico; distancia focal posterior \(=26.67-3.33=23.33\) mm.</p></details></li>
</ol>
