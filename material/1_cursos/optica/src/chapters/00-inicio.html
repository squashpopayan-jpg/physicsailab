    <h1 class="home-title">Óptica<span>del rayo al fotón</span></h1>
    <p class="home-lead">Un curso completo de óptica: la naturaleza de la luz, la óptica geométrica y los instrumentos, la interferencia, la difracción y la óptica de Fourier, la polarización y la luz en la materia, los láseres, los haces gaussianos, las fibras, la óptica no lineal y los fotones. Cada capítulo deduce los resultados desde los principios, los aplica con ejemplos resueltos y los pone a prueba con simulaciones de parámetros ajustables. Los índices de refracción vienen de los catálogos y de las fórmulas de referencia, el color de las tablas de la CIE, y los cálculos se contrastan con SciPy, SymPy, tmm, miepython, colour-science, soluciones exactas y datos publicados.</p>

<div class="home-howto">
  <div><b>Rayos, ondas y fotones</b><p>Cada modelo de la luz tiene su dominio de validez: el rayo explica lentes y espejos; la onda, la interferencia, la difracción y la polarización; el fotón, el láser y la detección de la luz débil.</p></div>
  <div><b>Simulaciones con parámetros</b><p>Trazado exacto de rayos, arcoíris, cámaras y telescopios, franjas de Young en luz blanca, películas de jabón, espejos dieléctricos, discos de Airy, óptica de Fourier, esfera de Poincaré, cristales birrefringentes, cielo azul, láseres, fibras y fotones uno a uno.</p></div>
  <div><b>Datos reales y validados</b><p>Vidrios del catálogo Schott, sílice, agua y cristales con sus fórmulas de Sellmeier; colorimetría con las tablas oficiales de la CIE; más de ochocientas pruebas automáticas contra bibliotecas independientes.</p></div>
  <div><b>Ejemplos con contexto local</b><p>El cielo de Popayán a 1760 m, los arcoíris de la temporada de lluvias, la fibra que llega a la universidad, el ojo, la cámara del celular y el telescopio. Problemas con respuesta en tres niveles al final de cada capítulo.</p></div>
