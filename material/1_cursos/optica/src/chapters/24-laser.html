<p class="lead">En mayo de 1960 Theodore Maiman encendió una lámpara de destello alrededor de un cristal de rubí con los extremos plateados y obtuvo un destello rojo de 694 nm, estrecho, intenso y coherente. Era el primer láser: «amplificación de luz por emisión estimulada de radiación». Hoy hay láseres en los lectores de códigos, las fibras ópticas, los quirófanos y las fábricas. Este capítulo explica cómo un medio puede amplificar la luz, por qué hace falta una cavidad y de dónde salen la monocromaticidad y los pulsos ultracortos.</p>

<section>
<h2>Absorción, emisión espontánea y emisión estimulada</h2>
<p>Un átomo con dos niveles de energía separados \(h\nu\) interactúa con la luz de tres maneras: puede <span class="term">absorber</span> un fotón y subir, puede bajar <span class="term">espontáneamente</span> emitiendo un fotón en dirección y fase aleatorias, o un fotón que pasa puede inducirlo a bajar: <span class="term">emisión estimulada</span>, que produce un segundo fotón idéntico al primero, con la misma frecuencia, dirección, fase y polarización. Albert Einstein dedujo en 1917 la emisión estimulada exigiendo que los átomos en equilibrio con la radiación de cuerpo negro reprodujeran la ley de Planck. Las tasas se escriben con sus coeficientes \(A_{21}\), \(B_{12}\) y \(B_{21}\), que cumplen</p>
<div class="eq key" data-name="Relaciones de Einstein">\[g_1B_{12}=g_2B_{21},\qquad\frac{A_{21}}{B_{21}}=\frac{8\pi h\nu^3}{c^3}.\]</div>
<p>En equilibrio térmico el cociente entre emisión estimulada y espontánea es \(1/(\ee^{h\nu/k_BT}-1)\): para luz visible a temperatura ambiente, \(2\times10^{-42}\); aun en la superficie del Sol, menos del 1 %. Por eso la luz térmica es casi toda espontánea e incoherente, y en el infrarrojo lejano (10.6 µm del láser de CO₂) la emisión estimulada ya es apreciable a 300 K.</p>
<div class="sim" data-sim="einstein" data-title="Emisión estimulada frente a espontánea en equilibrio térmico"></div>
<div class="sim-guide"><ul>
<li>El cociente entre poblaciones \(N_2/N_1=\ee^{-h\nu/k_BT}\) es diminuto en el visible: en equilibrio siempre hay más átomos abajo y el medio absorbe.</li>
<li>Compare las microondas, el infrarrojo y el visible a temperatura ambiente y en el Sol.</li>
</ul></div>
</section>

<section>
<h2>Inversión de población y ganancia</h2>
<p>Un haz que atraviesa un medio gana intensidad por emisión estimulada y la pierde por absorción. Su variación por unidad de longitud es</p>
<div class="eq key" data-name="Coeficiente de ganancia">\[\frac{\dd I}{\dd z}=g\,I,\qquad g=\sigma\left(N_2-\frac{g_2}{g_1}N_1\right),\]</div>
<p>donde \(\sigma\) es la sección eficaz de la transición. Para amplificar hace falta \(N_2&gt;N_1\): una <span class="term">inversión de población</span>, imposible en equilibrio térmico. Se logra bombeando energía. En un sistema de dos niveles el bombeo óptico iguala las poblaciones pero no las invierte. En el de <span class="term">tres niveles</span> del rubí, el bombeo lleva los átomos a una banda que decae rápidamente al nivel láser superior, y hay que vaciar más de la mitad del nivel fundamental: hace falta un bombeo enorme. En el de <span class="term">cuatro niveles</span>, como el Nd:YAG (1064 nm) o el He–Ne (632.8 nm), el nivel láser inferior está vacío porque decae muy rápido, y basta con poner unos pocos átomos arriba.</p>
</section>

<section>
<h2>La cavidad, el umbral y las ecuaciones de tasa</h2>
<p>Un amplificador se vuelve oscilador con realimentación: dos espejos de reflectancias \(R_1\) y \(R_2\) a una distancia \(L\) devuelven la luz al medio. La oscilación empieza cuando la ganancia de una ida y vuelta compensa las pérdidas,</p>
<div class="eq key" data-name="Condición de umbral">\[R_1R_2\,\ee^{2(g-\alpha)L}=1,\qquad g_{um}=\alpha+\frac{1}{2L}\ln\frac{1}{R_1R_2},\]</div>
<p>donde \(\alpha\) son las pérdidas internas. Con un espejo total y otro del 98 % en una cavidad de 30 cm, basta una ganancia de 0.034 m⁻¹. Por encima del umbral la ganancia queda fija en ese valor: todo bombeo adicional se convierte en fotones, y la potencia de salida crece linealmente con el bombeo. Las <span class="term">ecuaciones de tasa</span> para la inversión \(n\) y el número de fotones \(s\) de un láser de cuatro niveles, en unidades adimensionales (tiempo en vidas del nivel superior, inversión en unidades de la de umbral), son</p>
<div class="eq">\[\odv{n}{t}=r-n-ns,\qquad\tau\odv{s}{t}=s(n-1)+\beta n,\]</div>
<p>donde \(r\) es el bombeo relativo al umbral, \(\tau\) la vida de los fotones en la cavidad respecto de la del nivel superior y \(\beta\) la pequeña fracción de emisión espontánea que cae en el modo. En estado estacionario, \(n=1\) y \(s=r-1\). Al encender el láser, la inversión sobrepasa el umbral, se dispara un pulso de fotones que la vacía y el sistema llega al equilibrio con <span class="term">oscilaciones de relajación</span> de frecuencia \(\omega_R\approx\sqrt{(r-1)/\tau}\), como se ve en los láseres de estado sólido y de semiconductor.</p>
<div class="sim" data-sim="tasas" data-title="Ecuaciones de tasa de un láser de cuatro niveles"></div>
<div class="sim-guide"><ul>
<li>Las ecuaciones se integran con Runge–Kutta. Encienda el bombeo: la inversión crece, sobrepasa el umbral, y los fotones aparecen en un pulso seguido de oscilaciones amortiguadas.</li>
<li>La gráfica de la derecha es la potencia de salida en estado estacionario frente al bombeo: cero por debajo del umbral y lineal por encima.</li>
</ul></div>
<p>Si se impide la oscilación (con un obturador rápido dentro de la cavidad) mientras se bombea, la inversión crece muy por encima del umbral; al abrir el obturador sale toda la energía en un pulso de nanosegundos con megavatios de potencia: es el <span class="term">Q-switching</span>, usado para marcar metales y en cirugía.</p>
</section>

<section>
<h2>Modos longitudinales y amarre de modos</h2>
<p>Solo oscilan las frecuencias para las que un número entero de medias longitudes de onda cabe en la cavidad: los <span class="term">modos longitudinales</span>, separados \(\Delta\nu=c/2L\). En un He–Ne de 30 cm están separados 500 MHz y la curva de ganancia, ensanchada por el efecto Doppler de los átomos de neón a unos 1.5 GHz, deja oscilar dos o tres modos a la vez. Con una cavidad más corta, o un étalon dentro, se obtiene un solo modo, y anchos de línea de kilohercios.</p>
<p>Si muchos modos oscilan con fases fijas entre sí, sus campos se suman como los fasores de una red de difracción (capítulo 17), pero en el tiempo: la intensidad se concentra en pulsos de duración del orden de \(1/(N\Delta\nu)\), separados \(2L/c\). Es el <span class="term">amarre de modos</span>. Un láser de titanio–zafiro con 100 nm de ancho de banda alrededor de 800 nm produce pulsos de menos de 10 fs; con una cavidad de 1.5 m, cien millones de pulsos por segundo. Los peines de frecuencias que forman esos modos (Nobel de Física 2005, Hall y Hänsch) son hoy la regla para medir frecuencias ópticas.</p>
<div class="sim" data-sim="modos-long" data-title="Curva de ganancia y modos de la cavidad"></div>
<div class="sim-guide"><ul>
<li>Solo oscilan los modos cuya ganancia supera las pérdidas (línea discontinua). Alargue la cavidad: los modos se acercan y oscilan más.</li>
</ul></div>
<div class="sim" data-sim="amarre" data-title="Amarre de modos: de fases al azar a pulsos"></div>
<div class="sim-guide"><ul>
<li>Con fases al azar la intensidad fluctúa como ruido; con las fases amarradas se forma un tren de pulsos de duración \(\approx1/(N\Delta\nu)\).</li>
<li>Aumente el número de modos: los pulsos se acortan y se hacen más intensos (\(\propto N^2\)).</li>
</ul></div>
</section>

<section>
<h2>Propiedades de la luz láser</h2>
<p>La luz láser es <b>monocromática</b> (un He–Ne estabilizado tiene un ancho relativo de \(10^{-9}\)), <b>coherente</b> (longitudes de coherencia de metros a kilómetros), <b>direccional</b> (un haz gaussiano diverge el mínimo que permite la difracción, capítulo 25) y de <b>radiancia</b> enorme: un puntero de 1 mW es más brillante, por unidad de ángulo sólido, que el Sol. Por eso un láser de clase 3B o 4 puede dañar la retina en una fracción de segundo, aun por reflexión. Los punteros legales en Colombia y en la mayoría de los países no deben superar 1 a 5 mW.</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Cuál es la separación entre modos longitudinales de un láser de diodo con una cavidad de 0.3 mm e índice 3.5?
<details><summary>Respuesta</summary><p>\(\Delta\nu=c/(2nL)=143\) GHz.</p></details></li>
<li><span class="lvl">Básico</span>¿Qué fracción de átomos está en el nivel superior de una transición de 1 µm a 300 K, en equilibrio?
<details><summary>Respuesta</summary><p>\(\ee^{-h\nu/k_BT}=\ee^{-48}\approx1.5\times10^{-21}\).</p></details></li>
<li><span class="lvl">Intermedio</span>Una cavidad de 50 cm tiene espejos de 99.9 % y 95 % y pérdidas internas de 0.5 % por pasada. ¿Qué ganancia umbral necesita?
<details><summary>Respuesta</summary><p>\(\alpha L=-\ln(0.995)\); \(g_{um}=[-\ln(0.999\times0.95)-2\ln0.995]/(2\times0.5)=0.0624\) m⁻¹.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Qué duración aproximada tienen los pulsos de un láser con 30 nm de ancho de banda en 1030 nm?
<details><summary>Respuesta</summary><p>\(\Delta\nu=c\Delta\lambda/\lambda^2=8.5\) THz; \(\tau\approx0.44/\Delta\nu=52\) fs (pulso gaussiano limitado por transformada).</p></details></li>
<li><span class="lvl">Avanzado</span>Linealice las ecuaciones de tasa alrededor del estado estacionario (\(n=1+\delta n\), \(s=r-1+\delta s\), \(\beta=0\)) y demuestre que las perturbaciones oscilan con \(\omega^2=(r-1)/\tau-r^2/4\) y se amortiguan con tasa \(r/2\).
<details><summary>Respuesta</summary><p>\(\dot{\delta n}=-r\,\delta n-\delta s\), \(\tau\dot{\delta s}=(r-1)\delta n\). La ecuación característica \(\lambda^2+r\lambda+(r-1)/\tau=0\) tiene raíces \(-r/2\pm\ii\sqrt{(r-1)/\tau-r^2/4}\).</p></details></li>
</ol>
