<p class="lead">La luz es un campo eléctrico y un campo magnético que se sostienen mutuamente mientras viajan. Este capítulo deduce la ecuación de onda a partir de las ecuaciones de Maxwell, describe las ondas planas armónicas que serán el lenguaje de todo el curso y calcula cuánta energía y cuánto momento transportan: la irradiancia que mide un fotómetro y la presión que empuja una vela solar.</p>

<section>
<h2>De las ecuaciones de Maxwell a la ecuación de onda</h2>
<p>En el vacío, sin cargas ni corrientes, las ecuaciones de Maxwell son</p>
<div class="eq">\[\divg\vb E=0,\qquad\divg\vb B=0,\qquad\curl\vb E=-\pdv{\vb B}{t},\qquad\curl\vb B=\mo\eo\pdv{\vb E}{t}.\]</div>
<p>Tomando el rotacional de la tercera y usando \(\curl(\curl\vb E)=\grad(\divg\vb E)-\lap\vb E=-\lap\vb E\), se obtiene para cada componente del campo la <span class="term">ecuación de onda</span>:</p>
<div class="eq key" data-name="Ecuación de onda">\[\lap\vb E=\frac1{c^2}\pddv{\vb E}{t},\qquad c=\frac1{\sqrt{\eo\mo}}=299\,792\,458\ \text{m/s}.\]</div>
<p>El campo magnético cumple la misma ecuación. Maxwell calculó \(1/\sqrt{\eo\mo}\) con los valores medidos en experimentos de electricidad y magnetismo, sin ninguna luz de por medio, y encontró la velocidad de la luz. En un medio lineal, homogéneo e isótropo, \(\eo\mo\) se reemplaza por \(\varepsilon\mu\) y la velocidad es \(v=c/n\), con</p>
<div class="eq">\[n=\sqrt{\varepsilon_r\mu_r}\approx\sqrt{\varepsilon_r(\omega)}.\]</div>
<p>A frecuencias ópticas casi todos los materiales tienen \(\mu_r\approx1\). La permitividad que importa es la del campo que oscila a \(10^{15}\) Hz, no la estática: el agua tiene \(\varepsilon_r=80\) en un condensador, pero a esas frecuencias sus moléculas no alcanzan a orientarse y \(\sqrt{\varepsilon_r(\omega)}=1.33\). El capítulo 23 explica esta dependencia con la frecuencia.</p>
</section>

<section>
<h2>Ondas planas armónicas</h2>
<p>La solución más simple de la ecuación de onda es una <span class="term">onda plana armónica</span> que viaja en la dirección del vector de onda \(\vb k\):</p>
<div class="eq key" data-name="Onda plana">\[\vb E(\vb r,t)=\vb E_0\cos(\vb k\cdot\vb r-\omega t+\varphi),\qquad k=\abs{\vb k}=\frac{2\pi}{\lambda},\qquad\omega=2\pi\nu=ck.\]</div>
<p>Los frentes de onda, las superficies de fase constante, son planos perpendiculares a \(\vb k\). Es cómodo escribir la onda como la parte real de una exponencial compleja, \(\vb E=\Rea\{\tl{\vb E}_0\,\ee^{\ii(\vb k\cdot\vb r-\omega t)}\}\), con la amplitud compleja \(\tl{\vb E}_0\) que guarda la fase. Las derivadas se vuelven multiplicaciones: \(\grad\to\ii\vb k\) y \(\partial_t\to-\ii\omega\). Las ecuaciones de Maxwell imponen entonces</p>
<div class="eq">\[\vb k\cdot\vb E_0=0,\qquad\vb k\cdot\vb B_0=0,\qquad\vb B_0=\frac1\omega\,\vb k\times\vb E_0,\qquad B_0=\frac{E_0}{c}.\]</div>
<p>La onda es <b>transversal</b>: \(\vb E\), \(\vb B\) y \(\vb k\) forman un triedro a derechas, los dos campos oscilan en fase y la dirección de \(\vb E\) define la <span class="term">polarización</span> (capítulo 20).</p>
<div class="sim" data-sim="onda-em3d" data-title="Campos eléctrico y magnético de una onda plana"></div>
<div class="sim-guide"><ul>
<li>Los campos \(\vb E\) (rojo) y \(\vb B\) (azul) oscilan en fase, perpendiculares entre sí y a la dirección de avance.</li>
<li>Cambie la polarización: en la circular, la punta de \(\vb E\) describe una hélice y su módulo es constante.</li>
</ul></div>
</section>

<section>
<h2>Energía, vector de Poynting e irradiancia</h2>
<p>La densidad de energía del campo es \(u=\tfrac12\eo E^2+\tfrac1{2\mo}B^2\); en una onda las dos partes son iguales y \(u=\eo E^2\). El flujo de energía por unidad de área y de tiempo es el <span class="term">vector de Poynting</span>,</p>
<div class="eq">\[\vb S=\frac1\mo\,\vb E\times\vb B,\]</div>
<p>que apunta en la dirección de \(\vb k\). Ningún detector sigue oscilaciones de \(10^{15}\) Hz: lo que se mide es el promedio temporal, la <span class="term">irradiancia</span> (o intensidad, en el lenguaje de la óptica):</p>
<div class="eq key" data-name="Irradiancia">\[I=\langle S\rangle=\tfrac12\,c\,n\,\eo E_0^2=\frac{nE_0^2}{2Z_0},\qquad Z_0=\sqrt{\frac\mo\eo}=376.73\ \Omega.\]</div>
<p>La luz del Sol fuera de la atmósfera tiene \(I=1361\) W/m², la constante solar; le corresponde un campo eléctrico de amplitud 1013 V/m y un campo magnético de 3.4 µT, unas diez veces menor que el de la Tierra. Un puntero láser de 1 mW concentrado en un haz de 1 mm de diámetro produce 1273 W/m², casi la irradiancia solar, y por eso no debe mirarse nunca: el ojo lo enfoca en un punto de pocas micras de la retina.</p>
<div class="sim" data-sim="poynting" data-title="Irradiancia y amplitud del campo de fuentes reales"></div>
<div class="sim-guide"><ul>
<li>Elija una fuente y una distancia: la irradiancia cae como \(1/r^2\) para las fuentes que irradian en todas las direcciones y casi no cambia para un haz láser colimado.</li>
<li>Las lecturas dan la amplitud del campo eléctrico, la del magnético, la presión de radiación y el número de fotones por segundo y por milímetro cuadrado.</li>
</ul></div>
</section>

<section>
<h2>Momento y presión de radiación</h2>
<p>Una onda que transporta energía \(U\) transporta también momento \(p=U/c\). Al ser absorbida por una superficie perpendicular le transfiere una presión \(I/c\); si se refleja por completo, el cambio de momento se duplica:</p>
<div class="eq key" data-name="Presión de radiación">\[P_{rad}=\frac{I}{c}\ \text{(absorción)},\qquad P_{rad}=\frac{2I}{c}\ \text{(reflexión total)}.\]</div>
<p>La luz solar ejerce 4.5 µPa sobre una superficie negra a 1 UA del Sol. Es poco, pero no hay rozamiento en el espacio: una vela perfectamente reflectora necesita 110 m² por cada kilogramo para acelerarse a 1 mm/s², y esa aceleración sostenida durante un año da 31.6 km/s. La sonda japonesa IKAROS (2010) navegó así hacia Venus con una vela de 14 m de lado. La presión de radiación empuja el polvo de los cometas para formar sus colas y, a escala microscópica, permite atrapar células con haces láser enfocados (pinzas ópticas, capítulo 28).</p>
<div class="sim" data-sim="vela-solar" data-title="Vela solar: radiación contra gravedad"></div>
<div class="sim-guide"><ul>
<li>La presión de radiación y la gravedad del Sol caen ambas como \(1/r^2\): su cociente, el número de ligereza \(\beta\), no depende de la distancia.</li>
<li>Busque la densidad superficial (masa por área) con la que \(\beta=1\): una vela así flotaría en reposo frente al Sol. Ronda los 1.5 g/m², la masa de un mylar de 1 µm.</li>
</ul></div>
</section>

<section>
<h2>Ondas esféricas y radiación de un dipolo</h2>
<p>Una fuente pequeña emite <span class="term">ondas esféricas</span>, \(E\propto\cos(kr-\omega t)/r\). La energía que atraviesa una esfera debe ser la misma a cualquier radio, de modo que la irradiancia cae como el inverso del cuadrado de la distancia: \(I=P/4\pi r^2\) si la fuente emite por igual en todas las direcciones. A gran distancia, un trozo de frente esférico es casi plano; esa es la justificación de usar ondas planas para la luz de las estrellas o de una lámpara lejana.</p>
<p>La fuente más simple de radiación es un <span class="term">dipolo oscilante</span> \(p(t)=p_0\cos\omega t\): un electrón que vibra en un átomo o la corriente de una antena corta. En la zona lejana su campo es transversal y su intensidad depende de la dirección,</p>
<div class="eq">\[I(r,\theta)=\frac{p_0^2\omega^4}{32\pi^2\eo c^3}\,\frac{\sen^2\theta}{r^2},\qquad P=\frac{p_0^2\omega^4}{12\pi\eo c^3}.\]</div>
<p>No hay radiación a lo largo del eje del dipolo y es máxima en el plano perpendicular. La dependencia en \(\omega^4\) explica el color azul del cielo (capítulo 23), y la ausencia de emisión a lo largo del eje explica por qué la luz dispersada a 90° del Sol está polarizada (capítulo 20).</p>
<div class="sim" data-sim="dipolo" data-title="Ondas que emite un dipolo oscilante"></div>
<div class="sim-guide"><ul>
<li>El mapa muestra el campo eléctrico en un plano que contiene al dipolo (vertical). Los frentes de onda se alejan y su amplitud cae como \(1/r\).</li>
<li>El diagrama polar de la derecha es \(\sen^2\theta\): no hay emisión hacia arriba ni hacia abajo.</li>
</ul></div>
<div class="box ex"><h4>Un bombillo a dos metros</h4><p>Si un bombillo convirtiera sus 100 W en luz emitida por igual en todas direcciones, a 2 m la irradiancia sería \(100/(4\pi\cdot2^2)=1.99\) W/m² y la amplitud del campo, \(\sqrt{2I/c\eo}=38.7\) V/m. En realidad un bombillo incandescente emite en el visible apenas entre el 2 y el 5 % de su potencia: el resto es infrarrojo.</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>El campo eléctrico de una onda en el vacío es \(E_y=30\cos(1.2\times10^7x-\omega t)\) V/m. Halle \(\lambda\), \(\omega\) y la amplitud y dirección de \(\vb B\).
<details><summary>Respuesta</summary><p>\(\lambda=2\pi/k=524\) nm; \(\omega=ck=3.60\times10^{15}\) rad/s; \(B_0=E_0/c=1.0\times10^{-7}\) T, a lo largo de \(\uv z\) (porque \(\vb k\times\vb E\) va según \(\uv x\times\uv y=\uv z\)).</p></details></li>
<li><span class="lvl">Básico</span>¿Qué irradiancia tiene una onda con \(E_0=100\) V/m en el vacío? ¿Y en un vidrio de índice 1.5 con la misma amplitud?
<details><summary>Respuesta</summary><p>\(I=\tfrac12c\eo E_0^2=13.3\) W/m²; en el vidrio, 1.5 veces más: 19.9 W/m².</p></details></li>
<li><span class="lvl">Intermedio</span>¿Cuántos fotones por segundo emite un láser de He–Ne de 1 mW (632.8 nm)?
<details><summary>Respuesta</summary><p>\(N=P\lambda/hc=3.19\times10^{15}\) fotones/s.</p></details></li>
<li><span class="lvl">Intermedio</span>Un láser de 1 W se refleja por completo en un espejo de 1 g suspendido. ¿Qué fuerza y qué aceleración le produce?
<details><summary>Respuesta</summary><p>\(F=2P/c=6.67\times10^{-9}\) N; \(a=6.67\times10^{-6}\) m/s².</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que el cociente entre la presión de radiación solar sobre una esfera negra de radio \(a\) y densidad \(\rho\) y su atracción gravitatoria hacia el Sol no depende de la distancia, y halle el radio con el que ambas se igualan para \(\rho=1000\) kg/m³ (\(L_\odot=3.828\times10^{26}\) W, \(GM_\odot=1.327\times10^{20}\) m³/s²).
<details><summary>Respuesta</summary><p>\(\beta=\dfrac{L\pi a^2/(4\pi r^2c)}{GM\,\tfrac43\pi a^3\rho/r^2}=\dfrac{3L}{16\pi GMc\rho a}\). Con \(\beta=1\): \(a=0.57\) µm. Los granos más pequeños son expulsados del sistema solar.</p></details></li>
</ol>
