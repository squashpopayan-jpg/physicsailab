<p class="lead">Los instrumentos ópticos amplían lo que el ojo puede ver: lo pequeño, lo lejano, lo tenue. Todos se construyen con las lentes y los espejos de los capítulos anteriores, y todos tienen dos límites que ningún diseño supera: la difracción, que fija el detalle más fino, y la conservación de la radiancia, que fija cuánta luz llega al ojo o al sensor. Este capítulo estudia la lupa, el microscopio, el telescopio y la cámara.</p>

<section>
<h2>La lupa y el aumento angular</h2>
<p>El tamaño con el que vemos un objeto lo da el ángulo que subtiende en el ojo. Para ver más detalle lo acercamos, pero no más que el punto próximo, a 25 cm. Una lente convergente colocada cerca del ojo permite poner el objeto mucho más cerca y verlo con una imagen virtual cómoda. Su <span class="term">aumento angular</span> es el cociente entre el ángulo con la lupa y el ángulo a simple vista a 25 cm:</p>
<div class="eq key" data-name="Lupa">\[M=\frac{25\ \text{cm}}{f}\quad(\text{imagen en el infinito}),\qquad M=1+\frac{25\ \text{cm}}{f}\quad(\text{imagen a 25 cm}).\]</div>
<p>Una lupa de 5 cm aumenta 5× con el ojo relajado y 6× si se acomoda al máximo. Las lupas de joyero llegan a 10× o 20×; más allá las aberraciones de una lente simple y la poca distancia de trabajo obligan a usar un microscopio.</p>
<div class="sim" data-sim="lupa" data-title="La lupa: el objeto se acerca y la imagen se aleja"></div>
<div class="sim-guide"><ul>
<li>Mueva el objeto dentro del foco de la lupa: la imagen virtual se aleja hacia el infinito cuando el objeto llega al foco. El ángulo que subtiende es lo que importa.</li>
<li>Compare con el mismo objeto visto a simple vista a 25 cm (línea gris).</li>
</ul></div>
</section>

<section>
<h2>El microscopio compuesto</h2>
<p>Un microscopio combina un <span class="term">objetivo</span> de focal corta, que forma una imagen real e invertida muy aumentada a la distancia del tubo \(L\) (160 mm en los microscopios clásicos), y un <span class="term">ocular</span> que la observa como una lupa. El aumento total es el producto:</p>
<div class="eq key" data-name="Microscopio">\[M=-\frac{L}{f_{ob}}\cdot\frac{25\ \text{cm}}{f_{oc}}.\]</div>
<p>Un objetivo de 4 mm (40×) con un ocular de 25 mm (10×) da 400×. Pero el aumento no basta: lo que decide el detalle visible es la <span class="term">apertura numérica</span> del objetivo, \(\text{AN}=n\sen\alpha\), donde \(\alpha\) es la mitad del ángulo del cono de luz que acepta y \(n\) el índice entre el objeto y la lente. Según el criterio de Rayleigh, dos puntos se distinguen si están separados al menos</p>
<div class="eq key" data-name="Resolución del microscopio">\[d=\frac{0.61\,\lambda}{\text{AN}}.\]</div>
<p>Con luz verde, un objetivo seco de AN 0.65 resuelve 0.52 µm, y uno de inmersión en aceite (\(n=1.515\)) con AN 1.4 llega a 0.24 µm. Aumentar más allá de unas 1000 veces la AN es <span class="term">aumento vacío</span>: la imagen crece pero no aparece detalle nuevo. Las técnicas de superresolución (STED, PALM), premiadas con el Nobel de Química de 2014, esquivan este límite usando moléculas fluorescentes que se encienden por turnos.</p>
<div class="sim" data-sim="microscopio" data-title="Microscopio: objetivo, imagen intermedia y ocular"></div>
<div class="sim-guide"><ul>
<li>El objetivo forma la imagen intermedia real (en gris) dentro del tubo; el ocular la observa con el ojo relajado si la imagen cae en su foco.</li>
<li>Cambie la apertura numérica: el aumento no cambia, pero la resolución sí.</li>
</ul></div>
</section>

<section>
<h2>Telescopios</h2>
<p>Un telescopio astronómico es un sistema <span class="term">afocal</span>: el objetivo de focal larga \(f_{ob}\) forma la imagen de un objeto lejano en su foco, y el ocular, con su foco en el mismo punto, devuelve rayos paralelos al ojo. El aumento angular es</p>
<div class="eq key" data-name="Telescopio">\[M=-\frac{f_{ob}}{f_{oc}}.\]</div>
<p>En el telescopio de Kepler el ocular es convergente y la imagen sale invertida, lo que no importa en astronomía; Galileo usó un ocular divergente colocado antes del foco, que da una imagen derecha en un tubo más corto, a cambio de un campo muy pequeño. Newton, convencido de que la aberración cromática no tenía remedio, reemplazó el objetivo por un espejo cóncavo; los grandes telescopios actuales son todos de espejo: el Hubble (2.4 m), el James Webb (6.5 m) y el Telescopio Extremadamente Grande, de 39 m.</p>
<p>El aumento es lo menos importante de un telescopio. Su abertura \(D\) decide dos cosas: cuánta luz recoge, proporcional a \(D^2\) (un telescopio de 114 mm capta 265 veces más que una pupila de 7 mm), y qué detalle resuelve, \(1.22\lambda/D\): 0.058″ para el Hubble en luz visible, contra 20″ del ojo. La imagen del objetivo formada por el ocular es la <span class="term">pupila de salida</span>, de diámetro \(D/M\); para aprovechar toda la luz debe ser menor que la pupila del ojo. Unos binoculares 7×50 aumentan 7 veces con objetivos de 50 mm y dan una pupila de salida de 7.1 mm, ideal para la noche.</p>
<div class="sim" data-sim="telescopio" data-title="Telescopios de Kepler y de Galileo"></div>
<div class="sim-guide"><ul>
<li>Un haz paralelo llega inclinado; sale paralelo pero con un ángulo \(M\) veces mayor. En el de Kepler sale invertido (el ángulo cambia de signo).</li>
<li>La pupila de salida es el lugar por donde pasan todos los rayos al salir: ahí debe ponerse el ojo.</li>
</ul></div>
</section>

<section>
<h2>La cámara</h2>
<p>Una cámara es un objetivo que forma una imagen real sobre un sensor. Su <span class="term">campo de visión</span> depende de la focal y del tamaño del sensor: con una diagonal \(d\),</p>
<div class="eq">\[\text{FOV}=2\arctan\frac{d}{2f}.\]</div>
<p>En el formato de 35 mm (diagonal de 43.3 mm), un objetivo de 50 mm abarca 47°, parecido a la visión central humana; uno de 24 mm, 84° (gran angular); uno de 200 mm, 12° (teleobjetivo). La cámara principal de un celular tiene focales de unos 7 mm y un sensor de 12 mm de diagonal: el mismo campo que un gran angular de 24 mm. La exposición la deciden el número f, el tiempo de obturación y la sensibilidad del sensor.</p>
<p>Cerrar el diafragma aumenta la profundidad de campo y reduce las aberraciones, pero agranda el disco de Airy: su diámetro \(2.44\lambda N\) es de 3.8 µm a f/2.8 y de 10.7 µm a f/8. Cuando supera dos o tres píxeles la imagen pierde nitidez por difracción; por eso las cámaras de celular, con píxeles de 1 µm, trabajan siempre a f/1.5–f/2.</p>
<div class="sim" data-sim="camara" data-title="Campo de visión y límite de difracción de una cámara"></div>
<div class="sim-guide"><ul>
<li>Cambie la focal y el sensor: el recuadro muestra cuánto de la escena entra en la foto.</li>
<li>Compare el disco de Airy con el píxel: la línea marca el número f a partir del cual la difracción domina.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Qué focal debe tener una lupa de 8× (imagen en el infinito)?
<details><summary>Respuesta</summary><p>\(f=25/8=3.1\) cm.</p></details></li>
<li><span class="lvl">Básico</span>Un telescopio tiene un objetivo de 900 mm y 114 mm de diámetro. ¿Qué aumento y qué pupila de salida da con un ocular de 25 mm?
<details><summary>Respuesta</summary><p>\(M=36\); pupila de salida \(114/36=3.2\) mm.</p></details></li>
<li><span class="lvl">Intermedio</span>Un objetivo de microscopio de AN 0.25 se usa con luz de 500 nm. ¿Qué resuelve? ¿Qué aumento total basta para que el ojo (1′) vea ese detalle a 25 cm?
<details><summary>Respuesta</summary><p>\(d=0.61\times0.5/0.25=1.22\) µm. A 25 cm, 1′ son 73 µm: hace falta \(73/1.22\approx60\)×; con 250× (1000 AN) se ve cómodamente.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Puede el Hubble separar los faros de un carro (1.5 m) en la Luna (384 000 km)?
<details><summary>Respuesta</summary><p>Hace falta \(1.5/3.84\times10^8=3.9\times10^{-9}\) rad; el Hubble resuelve \(1.22\times550\times10^{-9}/2.4=2.8\times10^{-7}\) rad. No: necesitaría un espejo de 170 m.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que la pupila de salida de un telescopio de Kepler está a una distancia \(f_{oc}(f_{ob}+f_{oc})/f_{ob}\) detrás del ocular y que su diámetro es \(D/M\).
<details><summary>Respuesta</summary><p>El ocular forma la imagen del objetivo, que está a \(f_{ob}+f_{oc}\): \(s_i=f_{oc}(f_{ob}+f_{oc})/f_{ob}\) y el aumento es \(f_{oc}/f_{ob}=1/M\).</p></details></li>
</ol>
