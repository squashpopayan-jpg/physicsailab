<template class="chapter-src" data-id="reflexion-refraccion" data-num="4" data-title="Reflexión y refracción" data-part="Parte II · Óptica geométrica" data-short="El principio de Huygens, el principio de Fermat y el camino óptico, las leyes de la reflexión y de Snell, la reflexión total interna y las guías de luz, la profundidad aparente, los medios de índice gradual y los espejismos">
<p class="lead">Cuando la luz llega a la frontera entre dos medios, una parte se refleja y otra cambia de dirección al entrar en el segundo medio. Las dos leyes que gobiernan ese cambio se pueden deducir de dos principios muy distintos: el de Huygens, que piensa en frentes de onda, y el de Fermat, que piensa en caminos. Este capítulo deduce las leyes, explora la reflexión total interna que hace funcionar las fibras ópticas y sigue la luz por el aire caliente de una carretera hasta el espejismo.</p>

<section>
<h2>Rayos y frentes de onda</h2>
<p>En la óptica geométrica la luz viaja a lo largo de <span class="term">rayos</span>: líneas perpendiculares a los frentes de onda que indican la dirección en que fluye la energía. En un medio homogéneo los rayos son rectas. El modelo es válido cuando todo lo que encuentra la luz (lentes, aberturas, gotas) es mucho mayor que la longitud de onda; si no, la difracción (Parte IV) dobla los rayos alrededor de los bordes.</p>
<p>El <span class="term">principio de Huygens</span> (1690) construye la evolución de un frente de onda: cada punto del frente actúa como fuente de ondas secundarias esféricas que avanzan a la velocidad local de la luz, y el nuevo frente es la envolvente de esas ondas. Cuando un frente plano llega oblicuo a una superficie, sus puntos la alcanzan en instantes distintos. Las ondas secundarias que nacen en el segundo medio avanzan más despacio, y la envolvente sale girada: la luz se refracta. Fresnel completó el principio en 1818 dando a las ondas secundarias amplitud y fase, y así nació la teoría de la difracción.</p>
</section>

<section>
<h2>El principio de Fermat</h2>
<p>En un medio de índice \(n\), la luz recorre una distancia \(\dd s\) en un tiempo \(n\,\dd s/c\). El <span class="term">camino óptico</span> entre dos puntos es</p>
<div class="eq key" data-name="Camino óptico">\[\text{OPL}=\int_A^B n(\vb r)\,\dd s=c\,t_{AB}.\]</div>
<p>Pierre de Fermat enunció en 1662 que la luz sigue, entre dos puntos, el camino que hace estacionario el camino óptico (en la mayoría de los casos, el mínimo). La formulación moderna, con «estacionario», incluye los casos en que el camino es un máximo o un punto de silla, como la reflexión dentro de un espejo elíptico.</p>
<p>Para la refracción, sea A a una altura \(a\) sobre la superficie y B a una profundidad \(b\) bajo ella, separados horizontalmente por \(d\). Si la luz cruza la superficie a una distancia \(x\) de A,</p>
<div class="eq">\[\text{OPL}(x)=n_1\sqrt{a^2+x^2}+n_2\sqrt{b^2+(d-x)^2},\qquad\odv{\,\text{OPL}}{x}=n_1\frac{x}{\sqrt{a^2+x^2}}-n_2\frac{d-x}{\sqrt{b^2+(d-x)^2}}=0,\]</div>
<p>y los dos cocientes son los senos de los ángulos de incidencia y de refracción. El mismo argumento, con los dos puntos del mismo lado, da la ley de la reflexión.</p>
<div class="sim" data-sim="fermat" data-title="El salvavidas y el principio de Fermat"></div>
<div class="sim-guide"><ul>
<li>Un salvavidas corre por la arena a 7 m/s y nada a 1.5 m/s. Mueva el punto donde entra al agua: el tiempo mínimo no está en la línea recta, sino donde \(\sen\theta_1/\sen\theta_2=v_1/v_2\).</li>
<li>La luz hace lo mismo con \(v=c/n\): el cociente de los senos es el cociente de los índices.</li>
</ul></div>
</section>

<section>
<h2>Las leyes de la reflexión y de la refracción</h2>
<p>Cuando un rayo llega a una superficie lisa que separa dos medios, el rayo incidente, la normal, el rayo reflejado y el refractado están en el mismo plano, el <span class="term">plano de incidencia</span>, y los ángulos medidos desde la normal cumplen</p>
<div class="eq key" data-name="Reflexión y ley de Snell">\[\theta_r=\theta_i,\qquad n_1\sen\theta_1=n_2\sen\theta_2.\]</div>
<p>La ley de la refracción se conoce por Willebrord Snell (1621), aunque Ibn Sahl la había escrito en Bagdad hacia 984. Al pasar a un medio de mayor índice el rayo se acerca a la normal. Las trayectorias son reversibles: un rayo que recorre el camino al revés sigue la misma línea. Las leyes no dicen cuánta luz se refleja; eso lo calculan las fórmulas de Fresnel (capítulo 21): a incidencia normal se refleja \(\left(\frac{n_2-n_1}{n_2+n_1}\right)^2\), el 4 % en el vidrio, el 2 % en el agua y el 17 % en el diamante.</p>
<div class="sim" data-sim="snell" data-title="Ley de Snell con frentes de onda de Huygens"></div>
<div class="sim-guide"><ul>
<li>Arrastre el ángulo de incidencia y cambie los índices. El grosor de los rayos es proporcional a la potencia que reflejan y transmiten (Fresnel, luz no polarizada).</li>
<li>Active los frentes de onda: la longitud de onda se acorta en el medio más denso y los frentes deben empalmar en la superficie; de ahí sale la ley de Snell.</li>
<li>Si la luz va del medio denso al menos denso, por encima del ángulo crítico desaparece el rayo refractado.</li>
</ul></div>
</section>

<section>
<h2>Reflexión total interna</h2>
<p>Si la luz pasa de un medio de índice \(n_1\) a otro de índice menor \(n_2\), el ángulo de refracción es mayor que el de incidencia y alcanza 90° para el <span class="term">ángulo crítico</span></p>
<div class="eq key" data-name="Ángulo crítico">\[\sen\theta_c=\frac{n_2}{n_1}.\]</div>
<p>Más allá, toda la luz se refleja: es la <span class="term">reflexión total interna</span>, sin pérdidas, mejor que cualquier espejo metálico. El ángulo crítico vale 48.6° del agua al aire, 41.2° para el vidrio N-BK7 y solo 24.4° para el diamante. Un brillante está tallado para que casi toda la luz que entra por la cara superior se refleje totalmente en las facetas inferiores y salga de nuevo por arriba. Los prismas de los binoculares y de las cámaras réflex desvían la luz por reflexión total, y un pez que mira hacia arriba ve todo el cielo comprimido en un círculo de 97° de apertura, la <span class="term">ventana de Snell</span>.</p>
<p>Una varilla de vidrio rodeada de un material de índice menor guía la luz por reflexiones totales sucesivas. Para que un rayo que entra por la cara frontal desde el aire quede atrapado, su ángulo con el eje no puede superar el que define la <span class="term">apertura numérica</span>:</p>
<div class="eq key" data-name="Apertura numérica">\[\text{AN}=\sen\theta_{max}=\sqrt{n_1^2-n_2^2}.\]</div>
<p>Una guía de vidrio de 1.62 con revestimiento de 1.52 acepta rayos de hasta 34°; la fibra de telecomunicaciones, con 1.4504 y 1.4447, solo hasta 7.4°. El capítulo 26 trata las fibras con el modelo ondulatorio.</p>
<div class="sim" data-sim="fibra-rti" data-title="Guía de luz por reflexión total"></div>
<div class="sim-guide"><ul>
<li>Cambie el ángulo de entrada: por debajo del ángulo de aceptación el rayo rebota sin pérdidas; por encima, en cada rebote escapa una parte (la que dan las fórmulas de Fresnel) y el rayo se apaga.</li>
<li>Reduzca el contraste de índices: la apertura numérica y el ángulo de aceptación disminuyen.</li>
</ul></div>
</section>

<section>
<h2>Profundidad aparente</h2>
<p>Un objeto bajo el agua parece estar más cerca de la superficie de lo que está. Los rayos que salen de él se abren más al pasar al aire, y el ojo los prolonga hacia atrás hasta un punto más alto. Mirando en dirección vertical, la profundidad aparente es</p>
<div class="eq">\[d'=\frac{d}{n}.\]</div>
<p>Una piscina de 2 m parece tener 1.5 m. Si se mira oblicuamente, la imagen sube todavía más, y el fondo de la piscina parece curvarse hacia arriba en los bordes. Por eso un pescador que lanza un arpón hacia donde ve el pez falla por arriba.</p>
<div class="sim" data-sim="profundidad" data-title="Una moneda en el fondo del agua"></div>
<div class="sim-guide"><ul>
<li>Mueva el ojo: un haz estrecho de rayos sale de la moneda, se refracta y el ojo lo prolonga en línea recta hasta la imagen.</li>
<li>A incidencia casi vertical la imagen está a \(d/n\); mirando de lado sube hacia la superficie.</li>
</ul></div>
</section>

<section>
<h2>Medios de índice gradual y espejismos</h2>
<p>Si el índice cambia de punto a punto, los rayos se curvan hacia la región de mayor índice. En un medio estratificado, con \(n=n(y)\), la ley de Snell aplicada a capas delgadas da un invariante a lo largo del rayo:</p>
<div class="eq key" data-name="Invariante de un medio estratificado">\[n(y)\cos\alpha=\text{cte},\]</div>
<p>donde \(\alpha\) es el ángulo con la horizontal. En un día de sol el asfalto calienta el aire que lo toca: el índice es menor junto al suelo y los rayos que bajan casi rasantes se curvan hacia arriba. El ojo recibe luz del cielo que parece venir del suelo: un charco brillante que se aleja cuando uno se acerca, el <span class="term">espejismo inferior</span>. Como \(n-1\) es proporcional a la densidad del aire, con 30 °C en el aire y 50 °C sobre el asfalto el índice cambia apenas \(1.6\times10^{-5}\), y el invariante solo permite curvar rayos que bajan con menos de \(\sqrt{2\Delta n}=5.7\) mrad (0.33°). Con los ojos a 1.5 m, el espejismo empieza a unos 260 m.</p>
<p>Sobre el mar frío ocurre lo contrario: el aire más denso abajo curva los rayos hacia abajo y los barcos lejanos parecen flotar sobre el horizonte (<span class="term">espejismo superior</span>). La atmósfera entera, más densa abajo, eleva la imagen del Sol 0.57° en el horizonte: cuando lo vemos tocar el mar, ya se ha puesto.</p>
<div class="sim" data-sim="espejismo" data-title="Espejismo sobre una carretera caliente"></div>
<div class="sim-guide"><ul>
<li>Los rayos se trazan hacia atrás desde el ojo resolviendo la ecuación del rayo con Runge–Kutta. Los que rozan la capa caliente suben de nuevo: el ojo ve el cielo en el suelo.</li>
<li>La escala vertical está exagerada unas cien veces. Suba la temperatura del asfalto o baje el ojo y vea dónde empieza el espejismo.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un rayo pasa del aire al agua (\(n=1.333\)) con 40° de incidencia. Halle el ángulo de refracción y el de reflexión.
<details><summary>Respuesta</summary><p>\(\theta_2=\arcsen(\sen40°/1.333)=28.8°\); \(\theta_r=40°\).</p></details></li>
<li><span class="lvl">Básico</span>¿Cuál es el ángulo crítico entre un vidrio de 1.52 y el agua?
<details><summary>Respuesta</summary><p>\(\arcsen(1.333/1.52)=61.3°\).</p></details></li>
<li><span class="lvl">Intermedio</span>Una lámina de vidrio de 1 cm de espesor (\(n=1.5\)) recibe un rayo a 60°. ¿Cuánto se desplaza lateralmente el rayo que sale?
<details><summary>Respuesta</summary><p>\(\theta_2=35.26°\); \(\Delta=t\,\sen(\theta_1-\theta_2)/\cos\theta_2=5.12\) mm.</p></details></li>
<li><span class="lvl">Intermedio</span>Un pez a 1 m de profundidad mira hacia arriba. ¿Qué radio tiene en la superficie el círculo a través del cual ve el exterior?
<details><summary>Respuesta</summary><p>\(r=1\,\text{m}\times\tan48.6°=1.13\) m.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre con el invariante \(n\cos\alpha\) que un rayo horizontal en una atmósfera con \(n(y)\) decreciente con la altura se curva con un radio \(R=n/\abs{\dd n/\dd y}\). Con \(\dd n/\dd y=-2.6\times10^{-8}\) m⁻¹, ¿cómo se compara ese radio con el de la Tierra?
<details><summary>Respuesta</summary><p>Derivando el invariante a lo largo del rayo, la curvatura es \(\kappa=\abs{\dd n/\dd y}\cos\alpha/n\), que en un rayo horizontal vale \(\abs{\dd n/\dd y}/n\). \(R=1/(2.6\times10^{-8})=3.8\times10^4\) km, unas seis veces el radio terrestre: por eso se ve un poco más allá del horizonte geométrico.</p></details></li>
</ol>
