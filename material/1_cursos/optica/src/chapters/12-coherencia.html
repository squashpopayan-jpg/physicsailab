<template class="chapter-src" data-id="coherencia" data-num="12" data-title="Superposición y coherencia" data-part="Parte III · Interferencia" data-short="El principio de superposición y la suma de fasores, la fórmula de la interferencia de dos ondas y la visibilidad, batidos, paquetes de onda, velocidades de fase y de grupo, coherencia temporal y longitud de coherencia, coherencia espacial, el teorema de van Cittert–Zernike y el interferómetro estelar de Michelson">
<p class="lead">Dos haces de luz que se cruzan no chocan: sus campos se suman. Si sus fases mantienen una relación fija, la suma produce zonas brillantes y oscuras, la interferencia; si la relación cambia al azar, solo se suman las intensidades. Este capítulo da las herramientas para calcular sumas de ondas y precisa cuándo dos haces «se acuerdan» de su fase: la coherencia, que decide qué fuentes pueden producir franjas y que permitió medir el tamaño de las estrellas.</p>

<section>
<h2>Superposición y fasores</h2>
<p>Las ecuaciones de Maxwell en el vacío son lineales: si \(\vb E_1\) y \(\vb E_2\) son soluciones, su suma también lo es. Para ondas de la misma frecuencia y la misma polarización basta trabajar con la amplitud compleja de un escalar, \(E=\Rea\{\tl E\,\ee^{-\ii\omega t}\}\), con \(\tl E=E_0\ee^{\ii\varphi}\). Cada onda es un <span class="term">fasor</span>, un vector en el plano complejo de longitud \(E_0\) y ángulo \(\varphi\), y la superposición es la suma de vectores. La irradiancia es proporcional al cuadrado del módulo de la suma. Para dos ondas con un desfase \(\delta\):</p>
<div class="eq key" data-name="Interferencia de dos ondas">\[I=I_1+I_2+2\sqrt{I_1I_2}\cos\delta.\]</div>
<p>El tercer término, el <span class="term">término de interferencia</span>, redistribuye la energía: donde \(\delta\) es múltiplo par de \(\pi\) la intensidad llega a \((\sqrt{I_1}+\sqrt{I_2})^2\); donde es múltiplo impar, baja a \((\sqrt{I_1}-\sqrt{I_2})^2\). El contraste de las franjas se mide con la <span class="term">visibilidad</span>:</p>
<div class="eq key" data-name="Visibilidad">\[V=\frac{I_{max}-I_{min}}{I_{max}+I_{min}}=\frac{2\sqrt{I_1I_2}}{I_1+I_2}.\]</div>
<p>Con haces iguales, \(V=1\) y los mínimos son negros. Si un haz tiene el 10 % de la intensidad del otro, la visibilidad sigue siendo 0.57: la interferencia es muy sensible aun a haces débiles, y por eso se usa para detectar señales pequeñas.</p>
<div class="sim" data-sim="fasores" data-title="Suma de fasores"></div>
<div class="sim-guide"><ul>
<li>Con dos fasores, cambie el desfase y la razón de amplitudes: la intensidad sigue la fórmula de arriba.</li>
<li>Con muchos fasores iguales y un desfase constante entre vecinos, la suma se enrolla en un polígono: este es el cálculo de la red de difracción (capítulo 17).</li>
</ul></div>
</section>

<section>
<h2>Batidos, paquetes y velocidad de grupo</h2>
<p>Dos ondas de frecuencias \(\omega_1\) y \(\omega_2\) próximas producen <span class="term">batidos</span>: una portadora a la frecuencia media modulada por una envolvente que oscila a \((\omega_1-\omega_2)/2\). La intensidad sube y baja a la frecuencia diferencia. Un detector rápido registra esos batidos cuando se mezclan dos láseres: así se miden diferencias de frecuencia de megahercios entre ondas de \(5\times10^{14}\) Hz.</p>
<p>Un pulso real es la suma de un continuo de frecuencias: un <span class="term">paquete de ondas</span>. En un medio dispersivo cada componente viaja con su propia velocidad de fase \(v_p=\omega/k=c/n\), y la envolvente, que transporta la energía y la información, avanza con la <span class="term">velocidad de grupo</span>:</p>
<div class="eq key" data-name="Velocidad de grupo">\[v_g=\frac{\dd\omega}{\dd k}=\frac{c}{n_g},\qquad n_g=n-\lambda\odv{n}{\lambda}.\]</div>
<p>En el vidrio N-BK7 a 550 nm, \(n=1.519\) pero \(n_g=1.546\): los pulsos van 1.8 % más despacio que las crestas. Como \(n_g\) también depende de \(\lambda\), un pulso corto se ensancha al propagarse (dispersión de la velocidad de grupo, capítulo 26).</p>
<div class="sim" data-sim="grupo" data-title="Velocidad de fase y velocidad de grupo"></div>
<div class="sim-guide"><ul>
<li>El punto rojo sigue una cresta (velocidad de fase); el azul, el máximo de la envolvente (velocidad de grupo). Con \(n_g&gt;n\), las crestas nacen en la cola del paquete y lo atraviesan hacia adelante.</li>
<li>Con la opción de dos ondas se ven batidos puros.</li>
</ul></div>
</section>

<section>
<h2>Coherencia temporal</h2>
<p>Ninguna fuente real es perfectamente monocromática. Un átomo emite trenes de onda de duración finita, y un conjunto de átomos emite trenes con fases sin relación entre sí. La fase de la luz se mantiene previsible solo durante un <span class="term">tiempo de coherencia</span> \(\tau_c\approx1/\Delta\nu\), en el que la luz recorre la <span class="term">longitud de coherencia</span></p>
<div class="eq key" data-name="Longitud de coherencia">\[l_c=c\tau_c\approx\frac{\lambda^2}{\Delta\lambda}.\]</div>
<p>Si en un interferómetro los dos caminos difieren en más de \(l_c\), las franjas desaparecen. La luz blanca (\(\Delta\lambda\approx300\) nm) tiene \(l_c\approx1\) µm: solo da franjas con caminos casi iguales, como en las películas de jabón muy delgadas. Un LED rojo con 20 nm de ancho llega a 20 µm; una línea de una lámpara de baja presión, a centímetros; un láser de He–Ne de varios modos, unos 20 cm, y un láser de una sola frecuencia de 1 MHz de ancho, 300 m.</p>
<p>El <span class="term">teorema de Wiener–Khinchin</span> lo precisa: la visibilidad de las franjas en función de la diferencia de camino es el módulo de la transformada de Fourier del espectro. Un espectro gaussiano da una visibilidad que cae como una gaussiana; el doblete del sodio (589.0 y 589.6 nm) da una visibilidad que se anula y reaparece cada 0.58 mm, con la que Michelson midió en 1891 la separación de las dos líneas. Es el principio de la espectroscopía de transformada de Fourier.</p>
<div class="sim" data-sim="coherencia-temporal" data-title="Visibilidad de las franjas y espectro de la fuente"></div>
<div class="sim-guide"><ul>
<li>Desplace la diferencia de camino del interferómetro: la visibilidad de las franjas sigue la transformada de Fourier del espectro elegido.</li>
<li>Con el doblete del sodio la visibilidad oscila con período \(\lambda^2/\Delta\lambda=0.58\) mm.</li>
</ul></div>
</section>

<section>
<h2>Coherencia espacial y el tamaño de las estrellas</h2>
<p>Si una fuente es extensa, cada uno de sus puntos produce su propio sistema de franjas, desplazado respecto de los demás. Si la fuente subtiende un ángulo \(\theta\) visto desde dos aberturas separadas \(d\), los sistemas de franjas se desplazan entre sí una fracción \(d\theta/\lambda\) de franja, y las franjas se borran cuando ese desplazamiento se acerca a una franja. El <span class="term">teorema de van Cittert–Zernike</span> (1934, 1938) da el resultado exacto: el grado de coherencia entre dos puntos es la transformada de Fourier de la distribución de brillo de la fuente. Para un disco uniforme de diámetro angular \(\theta\):</p>
<div class="eq key" data-name="Coherencia de un disco uniforme">\[\abs{\mu_{12}}=\abs{\frac{2J_1(v)}{v}},\qquad v=\frac{\pi d\theta}{\lambda},\]</div>
<p>que se anula por primera vez para \(d=1.22\lambda/\theta\). El Sol, de 0.53°, produce luz coherente en áreas de unos 70 µm: Young tuvo que hacer pasar la luz del Sol por un agujero muy pequeño antes de llegar a sus rendijas. En 1920 Michelson y Pease montaron dos espejos sobre una viga en el telescopio de 2.5 m de Monte Wilson y encontraron que las franjas de Betelgeuse se borraban con los espejos a 3.07 m: un diámetro angular de 0.047″, la primera medida del tamaño de una estrella distinta del Sol. Los interferómetros actuales, como el VLTI o CHARA, combinan telescopios separados cientos de metros y fotografían las superficies de las estrellas.</p>
<div class="sim" data-sim="coherencia-espacial" data-title="Franjas con una fuente extensa: el interferómetro estelar"></div>
<div class="sim-guide"><ul>
<li>Aumente la separación de las aberturas: la visibilidad de las franjas sigue \(\abs{2J_1(v)/v}\) y se anula en \(d=1.22\lambda/\theta\).</li>
<li>Con los datos de Betelgeuse, el primer cero cae en 3.08 m, como observaron Michelson y Pease.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Dos haces de intensidades 4 y 1 (unidades arbitrarias) interfieren. Halle \(I_{max}\), \(I_{min}\) y la visibilidad.
<details><summary>Respuesta</summary><p>\(I_{max}=(2+1)^2=9\), \(I_{min}=(2-1)^2=1\), \(V=0.8\).</p></details></li>
<li><span class="lvl">Básico</span>¿Qué longitud de coherencia tiene un LED azul de 460 nm con 25 nm de ancho espectral?
<details><summary>Respuesta</summary><p>\(l_c=460^2/25\) nm \(=8.5\) µm.</p></details></li>
<li><span class="lvl">Intermedio</span>Un láser de diodo de 650 nm tiene \(l_c=1\) mm. ¿Qué ancho tiene su espectro en nanómetros y en gigahercios?
<details><summary>Respuesta</summary><p>\(\Delta\lambda=\lambda^2/l_c=0.42\) nm; \(\Delta\nu=c/l_c=300\) GHz.</p></details></li>
<li><span class="lvl">Intermedio</span>¿A qué separación de aberturas se borran las franjas de la luz de la Luna llena (0.52°) con \(\lambda=550\) nm?
<details><summary>Respuesta</summary><p>\(d=1.22\times550\times10^{-9}/(9.08\times10^{-3})=74\) µm.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que, para un espectro rectangular de ancho \(\Delta\nu\) centrado en \(\nu_0\), la visibilidad en función del retraso \(\tau\) es \(\abs{\sen(\pi\Delta\nu\tau)/(\pi\Delta\nu\tau)}\), y que se anula por primera vez en \(\tau=1/\Delta\nu\).
<details><summary>Respuesta</summary><p>La función de coherencia es \(\int S(\nu)\ee^{-2\pi\ii\nu\tau}\dd\nu/\int S\) \(=\ee^{-2\pi\ii\nu_0\tau}\,\mathrm{sinc}(\pi\Delta\nu\tau)\). Su módulo se anula cuando \(\pi\Delta\nu\tau=\pi\).</p></details></li>
</ol>
