<section>
<h2>La luz y la radiación</h2>
<ul>
<li>Ondas: \(c=\lambda\nu\), \(n=c/v=\sqrt{\varepsilon_r\mu_r}\), \(\lambda_{medio}=\lambda_0/n\) (1, 2).</li>
<li>Irradiancia: \(I=\tfrac12cn\eo E_0^2\); presión de radiación \(I/c\) o \(2I/c\) (2).</li>
<li>Dipolo: \(I\propto\sen^2\theta/r^2\), \(P=p_0^2\omega^4/12\pi\eo c^3\) (2).</li>
<li>Planck: \(B_\lambda=\frac{2hc^2}{\lambda^5}\frac{1}{\ee^{hc/\lambda k_BT}-1}\); \(\lambda_{max}T=b\); \(M=\sigma T^4\) (3).</li>
<li>Fotometría: \(\Phi_v=683\int\Phi_\lambda V\,\dd\lambda\); iluminancia \(E=I\cos\theta/r^2\) (3).</li>
</ul>
</section>

<section>
<h2>Óptica geométrica</h2>
<ul>
<li>Snell: \(n_1\sen\theta_1=n_2\sen\theta_2\); crítico \(\sen\theta_c=n_2/n_1\); AN \(=\sqrt{n_1^2-n_2^2}\) (4).</li>
<li>Medio estratificado: \(n(y)\cos\alpha=\text{cte}\) (4).</li>
<li>Prisma: \(n=\sen\frac{A+\delta_{min}}2/\sen\frac A2\); Abbe \(\nu_d=(n_d-1)/(n_F-n_C)\) (5).</li>
<li>Arcoíris: \(\cos^2\theta=(n^2-1)/k(k+2)\), \(D_k=2(\theta-\theta')+k(\pi-2\theta')\) (5).</li>
<li>Espejo: \(1/s_o+1/s_i=1/f\), \(f=R/2\); superficie: \(n_1/s_o+n_2/s_i=(n_2-n_1)/R\) (6).</li>
<li>Lente: \(1/f=(n-1)(1/R_1-1/R_2)\); \(1/s_o+1/s_i=1/f\); \(m=-s_i/s_o\); Newton \(x_ox_i=f^2\) (7).</li>
<li>Dos lentes: \(1/f=1/f_1+1/f_2-d/f_1f_2\) (7).</li>
<li>Matrices: \(T(d)\), \(\mathcal R\), \(L(f)\); \(f'=-1/C\), BFD \(=-A/C\) (8).</li>
<li>Número f \(N=f/D\); hiperfocal \(H=f^2/Nc+f\) (8).</li>
<li>Acromático: \(\varphi_1=\varphi\nu_1/(\nu_1-\nu_2)\), \(\varphi_2=-\varphi\nu_2/(\nu_1-\nu_2)\); Petzval \(1/R_P=-\sum1/n_if_i\) (9).</li>
<li>Lupa \(M=25/f\); microscopio \(M=-(L/f_{ob})(25/f_{oc})\); telescopio \(M=-f_{ob}/f_{oc}\) (11).</li>
</ul>
</section>

<section>
<h2>Interferencia y coherencia</h2>
<ul>
<li>Dos ondas: \(I=I_1+I_2+2\sqrt{I_1I_2}\cos\delta\); \(V=2\sqrt{I_1I_2}/(I_1+I_2)\) (12).</li>
<li>Velocidad de grupo \(v_g=c/n_g\), \(n_g=n-\lambda\,\dd n/\dd\lambda\); coherencia \(l_c\approx\lambda^2/\Delta\lambda\) (12).</li>
<li>Van Cittert–Zernike (disco): \(\abs{\mu}=\abs{2J_1(v)/v}\), \(v=\pi d\theta/\lambda\) (12).</li>
<li>Young: \(\Delta y=\lambda L/d\) (13).</li>
<li>Lámina: \(\Delta=2nd\cos\theta_t\) más los desfases de reflexión; Newton \(r_m=\sqrt{m\lambda R}\) (14).</li>
<li>Airy (Fabry–Pérot): \(T=1/[1+F\sen^2(\delta/2)]\), \(F=4R/(1-R)^2\), \(\mathcal F=\pi\sqrt R/(1-R)\) (15).</li>
<li>Antirreflejante: \(R=[(n_0n_s-n_1^2)/(n_0n_s+n_1^2)]^2\); Bragg \(Y=(n_H/n_L)^{2N}n_H^2/n_s\) (15).</li>
</ul>
</section>

<section>
<h2>Difracción y óptica de Fourier</h2>
<ul>
<li>Número de Fresnel \(N_F=a^2/\lambda z\) (16).</li>
<li>Rendija: \(I=I_0(\sen\beta/\beta)^2\), \(\beta=\pi a\sen\theta/\lambda\) (16).</li>
<li>Airy: \(I=I_0[2J_1(x)/x]^2\); Rayleigh \(\theta=1.22\lambda/D\); radio \(1.22\lambda N\) (16).</li>
<li>Red: \(d(\sen\theta_m-\sen\theta_i)=m\lambda\); \(\lambda/\Delta\lambda=mN\); Bragg \(2d\sen\theta=m\lambda\) (17).</li>
<li>Zonas \(r_m=\sqrt{m\lambda z}\); eje de una abertura \(4I_0\sen^2(\pi N_F/2)\); placa zonal \(f=r_1^2/\lambda\) (18).</li>
<li>Talbot \(z_T=2d^2/\lambda\); MTF \(\frac2\pi[\arccos\nu-\nu\sqrt{1-\nu^2}]\), \(f_c=1/\lambda N\) (19).</li>
</ul>
</section>

<section>
<h2>Polarización y materia</h2>
<ul>
<li>Malus: \(I=I_0\cos^2\theta\); Stokes \(S_0..S_3\); \(P=\sqrt{S_1^2+S_2^2+S_3^2}/S_0\) (20).</li>
<li>Fresnel: \(r_s=\frac{n_1\cos\theta_1-n_2\cos\theta_2}{n_1\cos\theta_1+n_2\cos\theta_2}\), \(r_p=\frac{n_2\cos\theta_1-n_1\cos\theta_2}{n_2\cos\theta_1+n_1\cos\theta_2}\) (21).</li>
<li>Brewster \(\tan\theta_B=n_2/n_1\); evanescente \(\delta=\lambda/2\pi\sqrt{n_1^2\sen^2\theta-n_2^2}\) (21).</li>
<li>Uniaxial: \(1/n^2(\theta)=\cos^2\theta/n_o^2+\sen^2\theta/n_e^2\); lámina \(\Gamma=2\pi\Delta n\,d/\lambda\) (22).</li>
<li>Lorentz: \(\varepsilon=1+\omega_p^2/(\omega_0^2-\omega^2-\ii\gamma\omega)\); Drude con \(\omega_0=0\); \(\omega_p^2=Ne^2/\eo m\) (23).</li>
<li>Beer–Lambert \(I=I_0\ee^{-\alpha z}\), \(\alpha=4\pi\kappa/\lambda\); Rayleigh \(\sigma\propto\lambda^{-4}\) (23).</li>
</ul>
</section>

<section>
<h2>Óptica moderna</h2>
<ul>
<li>Einstein: \(A_{21}/B_{21}=8\pi h\nu^3/c^3\); umbral \(R_1R_2\ee^{2(g-\alpha)L}=1\); modos \(\Delta\nu=c/2L\) (24).</li>
<li>Haz gaussiano: \(w(z)=w_0\sqrt{1+(z/z_R)^2}\), \(z_R=\pi w_0^2/\lambda\), \(\theta=\lambda/\pi w_0\); \(q'=(Aq+B)/(Cq+D)\); estabilidad \(0\le g_1g_2\le1\) (25).</li>
<li>Fibras: \(V=(2\pi a/\lambda)\text{AN}\); monomodo \(V&lt;2.405\); \(D=-(\lambda/c)\,\dd^2n/\dd\lambda^2\), \(\Delta\tau=\abs DL\Delta\lambda\) (26).</li>
<li>No lineal: \(I_{2\omega}\propto L^2\mathrm{sinc}^2(\Delta kL/2)\); \(L_c=\pi/\Delta k\); Kerr \(n=n_0+n_2I\) (27).</li>
<li>Fotones: \(K_{max}=h\nu-W\); Poisson \(\sigma^2=\bar n\); térmica \(\sigma^2=\bar n+\bar n^2\) (28).</li>
</ul>
</section>
