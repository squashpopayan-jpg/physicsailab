<template class="chapter-src" data-id="espejos" data-num="6" data-title="Espejos y superficies refractoras" data-part="Parte II · Óptica geométrica" data-short="Imágenes en espejos planos y en espejos angulares, el retrorreflector, espejos esféricos en la aproximación paraxial, rayos principales y aumento, la aberración esférica y el espejo parabólico, la superficie refractora esférica y el convenio de signos">
<p class="lead">Una imagen óptica es un punto por donde pasan, o parecen pasar, todos los rayos que salieron de un mismo punto del objeto. Los espejos y las superficies refractoras curvas forman imágenes porque cambian la dirección de cada rayo en una cantidad que depende de dónde llega. Este capítulo construye las imágenes de espejos planos y esféricos, encuentra el límite de la aproximación paraxial y prepara las fórmulas de las superficies refractoras con las que el capítulo siguiente arma las lentes.</p>

<section>
<h2>Espejos planos</h2>
<p>Los rayos que salen de un punto y se reflejan en un espejo plano parecen venir de un punto situado detrás del espejo, a la misma distancia: la <span class="term">imagen virtual</span>. Es del mismo tamaño y derecha, pero invierte la dirección perpendicular al espejo: la mano derecha del reflejo es una mano izquierda. Para verse de cuerpo entero basta un espejo de la mitad de la estatura, a cualquier distancia.</p>
<p>Dos espejos que forman un ángulo \(\alpha\) producen imágenes de imágenes. Si \(360°/\alpha\) es entero, el número de imágenes es</p>
<div class="eq">\[N=\frac{360°}{\alpha}-1:\]</div>
<p>tres con espejos en ángulo recto, cinco a 60° (el caleidoscopio) e infinitas con espejos paralelos. Tres espejos perpendiculares entre sí forman un <span class="term">retrorreflector</span> de esquina, que devuelve cualquier rayo en la dirección exactamente opuesta. Los astronautas del Apolo dejaron en la Luna paneles de estos prismas; los laboratorios los usan para medir la distancia a la Luna con láseres pulsados, con precisión de milímetros.</p>
<div class="sim" data-sim="espejo-plano" data-title="Imágenes múltiples entre dos espejos"></div>
<div class="sim-guide"><ul>
<li>Cambie el ángulo entre los espejos y mueva el objeto. Cada imagen se obtiene reflejando la anterior en el otro espejo, mientras quede delante de su cara reflectora.</li>
<li>Con 90° hay tres imágenes; con 60°, cinco; con 45°, siete.</li>
</ul></div>
</section>

<section>
<h2>Espejos esféricos</h2>
<p>Un espejo esférico es un casquete de una esfera de radio \(R\). Si su cara reflectora mira hacia el centro de curvatura es <span class="term">cóncavo</span>; si mira hacia afuera, <span class="term">convexo</span>. Un rayo paralelo al eje, a una altura \(h\) pequeña, se refleja y cruza el eje a una distancia \(R/2\) del vértice: el <span class="term">foco</span>. La aproximación que permite decir «pequeña» es la <span class="term">aproximación paraxial</span>: los rayos forman ángulos chicos con el eje, de modo que \(\sen\theta\approx\tan\theta\approx\theta\). En ella todos los rayos que salen de un punto del objeto convergen en un punto imagen, y la distancia al objeto \(s_o\) y a la imagen \(s_i\) cumplen la <span class="term">ecuación de los espejos</span>:</p>
<div class="eq key" data-name="Espejo esférico">\[\frac1{s_o}+\frac1{s_i}=\frac1f,\qquad f=\frac R2,\qquad m=-\frac{s_i}{s_o}.\]</div>
<div class="box def"><h4>Convenio de signos de este curso</h4><p>Se usa el convenio de Hecht. La luz viaja de izquierda a derecha. Para lentes y superficies refractoras: \(s_o&gt;0\) si el objeto está a la izquierda (real), \(s_i&gt;0\) si la imagen está a la derecha (real), \(R&gt;0\) si el centro de curvatura está a la derecha. Para espejos, la luz se devuelve: \(s_i&gt;0\) si la imagen está delante del espejo (real), y \(f&gt;0\) para el espejo cóncavo, \(f&lt;0\) para el convexo. Un aumento \(m\) negativo indica imagen invertida. En las matrices del capítulo 8 se usan coordenadas cartesianas con \(z\) creciente hacia la derecha, como en los programas de diseño.</p></div>
<p>Con un espejo cóncavo de \(f=10\) cm, un objeto a 30 cm forma una imagen real e invertida a 15 cm, de la mitad del tamaño; un objeto a 15 cm, una imagen real a 30 cm y el doble de grande (así funcionan los proyectores de espejo); un objeto a 5 cm, dentro del foco, una imagen virtual derecha y aumentada al doble: el espejo de maquillaje. Un espejo convexo siempre da imágenes virtuales, derechas y reducidas, y abarca un campo amplio: el retrovisor de un carro con \(f=-50\) cm muestra un camión a 10 m como si estuviera a 48 cm del espejo y 21 veces más pequeño.</p>
<div class="sim" data-sim="espejo-esferico" data-title="Espejo esférico: rayos principales e imagen"></div>
<div class="sim-guide"><ul>
<li>Arrastre el objeto. Los tres rayos principales son: paralelo al eje que se refleja por el foco, el que va al vértice y se refleja simétrico, y el que pasa por el foco y se refleja paralelo.</li>
<li>Cuando el objeto cruza el foco, la imagen salta del infinito de un lado al otro y pasa de real a virtual.</li>
</ul></div>
</section>

<section>
<h2>Aberración esférica y espejos parabólicos</h2>
<p>Fuera de la aproximación paraxial, un rayo paralelo a la altura \(h=R\sen\theta\) cruza el eje a una distancia del vértice</p>
<div class="eq">\[z(h)=R-\frac{R}{2\cos\theta},\]</div>
<p>tanto más cerca del espejo cuanto más alto llega. Para un espejo de \(R=1\) m, un rayo a 10 cm del eje cruza 2.5 mm antes del foco paraxial y uno a 30 cm, 2.4 cm antes. Esta <span class="term">aberración esférica</span> borra la imagen de un espejo de gran abertura. Los rayos reflejados envuelven una curva brillante, la <span class="term">cáustica</span>, que se ve en el fondo de una taza al sol.</p>
<p>Un paraboloide refleja todos los rayos paralelos a su eje exactamente hacia el foco, a cualquier altura: es la definición geométrica de la parábola. Por eso los telescopios reflectores, las antenas de satélite y los faros de los carros usan espejos parabólicos. Pero el paraboloide solo es perfecto en el eje: para estrellas fuera de él aparece el coma (capítulo 9), y por eso los telescopios de campo amplio usan correctores.</p>
<div class="sim" data-sim="espejo-aberracion" data-title="Espejo esférico frente a parabólico"></div>
<div class="sim-guide"><ul>
<li>Los rayos se reflejan exactamente con la ley de la reflexión. En el espejo esférico los rayos altos cruzan antes; en el parabólico todos llegan al foco.</li>
<li>Abra la abertura: la mancha en el plano focal paraxial del espejo esférico crece como \(h^3\).</li>
</ul></div>
</section>

<section>
<h2>La superficie refractora esférica</h2>
<p>Una superficie esférica de radio \(R\) que separa un medio de índice \(n_1\) de otro de índice \(n_2\) también forma imágenes. Aplicando la ley de Snell en la aproximación paraxial a un rayo que sale de un punto del eje se obtiene</p>
<div class="eq key" data-name="Superficie refractora esférica">\[\frac{n_1}{s_o}+\frac{n_2}{s_i}=\frac{n_2-n_1}{R},\qquad m=-\frac{n_1s_i}{n_2s_o}.\]</div>
<p>El cociente \((n_2-n_1)/R\) es la <span class="term">potencia</span> de la superficie, medida en dioptrías (m⁻¹) si \(R\) está en metros. La córnea, con \(R=7.8\) mm entre el aire y el humor acuoso (\(n=1.336\)), tiene 43 dioptrías: dos tercios de la potencia del ojo (capítulo 10). Un pez en el centro de una pecera esférica se ve en su lugar, pero 1.33 veces más grande: los rayos que salen del centro cruzan la superficie sin desviarse y el aumento es \(n_1/n_2\).</p>
<div class="sim" data-sim="dioptrio" data-title="Imagen formada por una superficie esférica"></div>
<div class="sim-guide"><ul>
<li>Los rayos que salen de un punto del eje se trazan con la ley de Snell exacta. La marca vertical es la imagen paraxial que da la fórmula.</li>
<li>Con rayos poco inclinados todos convergen en la imagen paraxial; los más abiertos cruzan antes (aberración esférica). Cambie el signo de \(R\) o los índices para obtener imágenes virtuales.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un objeto de 2 cm está a 25 cm de un espejo cóncavo de radio 30 cm. Halle la posición, el tamaño y el carácter de la imagen.
<details><summary>Respuesta</summary><p>\(f=15\) cm; \(s_i=25\times15/10=37.5\) cm (real); \(m=-1.5\): imagen invertida de 3 cm.</p></details></li>
<li><span class="lvl">Básico</span>¿Dónde está la imagen de un objeto a 40 cm de un espejo convexo de \(f=-20\) cm?
<details><summary>Respuesta</summary><p>\(s_i=40(-20)/(60)=-13.3\) cm: virtual, detrás del espejo, con \(m=0.33\).</p></details></li>
<li><span class="lvl">Intermedio</span>Una esfera de vidrio de índice 1.5 y radio 2 cm se usa como lente. ¿Dónde forma, la primera superficie, la imagen de un objeto lejano? ¿Y dónde queda el foco después de la segunda superficie?
<details><summary>Respuesta</summary><p>Primera superficie: \(1.5/s_i=0.5/2\Rightarrow s_i=6\) cm, más allá de la esfera. Para la segunda, \(s_o=-2\) cm (objeto virtual), \(R=-2\): \(1.5/(-2)+1/s_i=(1-1.5)/(-2)\Rightarrow s_i=1\) cm después de la esfera.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Cuántas imágenes se forman entre dos espejos a 40°? ¿Y a 50°?
<details><summary>Respuesta</summary><p>A 40°, \(360/40-1=8\). A 50° la razón no es entera: el número depende de la posición del objeto (6 o 7).</p></details></li>
<li><span class="lvl">Avanzado</span>Deduzca la ecuación de la superficie refractora a partir del principio de Fermat, exigiendo que el camino óptico sea estacionario para los rayos paraxiales.
<details><summary>Respuesta</summary><p>Para un rayo que cruza la superficie a una altura \(h\), con sagita \(h^2/2R\): \(\text{OPL}\approx n_1(s_o+h^2/2s_o+h^2/2R)+n_2(s_i+h^2/2s_i-h^2/2R)\). Igualar a cero el término en \(h^2\) da \(n_1/s_o+n_2/s_i=(n_2-n_1)/R\).</p></details></li>
</ol>
