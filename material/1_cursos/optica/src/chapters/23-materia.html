<template class="chapter-src" data-id="materia" data-num="23" data-title="Dispersión, absorción y esparcimiento" data-part="Parte V · Polarización y materia" data-short="El oscilador de Lorentz y el origen del índice de refracción, dispersión normal y anómala, el modelo de Drude de los metales y los plasmas, la ionosfera, la ley de Beer–Lambert, las relaciones de Kramers–Kronig, el esparcimiento de Rayleigh, el cielo azul y los atardeceres, y el esparcimiento de Mie de las nubes">
<p class="lead">¿Por qué la luz va más despacio en el vidrio, por qué el vidrio es transparente y los metales brillan, por qué el cielo es azul y las nubes blancas? Todas estas preguntas tienen la misma respuesta: los electrones de la materia oscilan con el campo de la luz y reemiten. Este capítulo construye el modelo más simple de esa respuesta, el oscilador de Lorentz, y lo aplica a los dieléctricos, los metales, la ionosfera y las partículas de la atmósfera.</p>

<section>
<h2>El oscilador de Lorentz</h2>
<p>Hendrik Lorentz imaginó en 1878 cada electrón ligado a su átomo por un resorte de frecuencia propia \(\omega_0\), con un amortiguamiento \(\gamma\). Bajo un campo \(E\ee^{-\ii\omega t}\) se desplaza \(x=(e/m)E/(\omega_0^2-\omega^2-\ii\gamma\omega)\) y crea un dipolo. Con \(N\) electrones por unidad de volumen la polarización es \(P=Nex\) y la permitividad,</p>
<div class="eq key" data-name="Modelo de Lorentz">\[\varepsilon(\omega)=1+\frac{\omega_p^2}{\omega_0^2-\omega^2-\ii\gamma\omega},\qquad\omega_p^2=\frac{Ne^2}{\eo m}.\]</div>
<p>El índice complejo es \(\tilde n=n+\ii\kappa=\sqrt{\varepsilon}\): \(n\) fija la velocidad de fase y \(\kappa\), la absorción. Lejos de la resonancia y por debajo de ella, \(n&gt;1\) y crece con la frecuencia: es la <span class="term">dispersión normal</span> de los vidrios en el visible, porque sus resonancias electrónicas están en el ultravioleta. Cerca de la resonancia la luz se absorbe y \(n\) disminuye con la frecuencia: <span class="term">dispersión anómala</span>. Sumando varias resonancias lejanas y despreciando el amortiguamiento sale la fórmula de Sellmeier del capítulo 5, con \(C_i=\lambda_i^2\) en las longitudes de onda de resonancia. Que \(n\) pueda ser menor que 1 por encima de una resonancia no viola la relatividad: la velocidad de fase no transporta información.</p>
<div class="sim" data-sim="lorentz" data-title="Índice complejo de un oscilador de Lorentz"></div>
<div class="sim-guide"><ul>
<li>Mueva la frecuencia de plasma (densidad de osciladores) y el amortiguamiento: la absorción \(\kappa\) tiene un pico en \(\omega_0\) y \(n\) muestra la forma de dispersión anómala.</li>
<li>La curva discontinua es la parte real calculada con las relaciones de Kramers–Kronig a partir de la absorción.</li>
</ul></div>
</section>

<section>
<h2>Metales y plasmas: el modelo de Drude</h2>
<p>En un metal los electrones de conducción no están ligados: \(\omega_0=0\), y se obtiene el <span class="term">modelo de Drude</span> (1900),</p>
<div class="eq key" data-name="Modelo de Drude">\[\varepsilon(\omega)=1-\frac{\omega_p^2}{\omega^2+\ii\gamma\omega}.\]</div>
<p>Por debajo de la <span class="term">frecuencia de plasma</span> \(\omega_p\), \(\varepsilon\) es negativa, \(\tilde n\) es casi imaginario y la onda no penetra: el metal refleja casi todo. Por encima, el metal se vuelve transparente. En el sodio, con \(2.65\times10^{28}\) electrones por metro cúbico, \(\hbar\omega_p=6.0\) eV y la transparencia empieza hacia 205 nm, como observó Wood en 1933 con los metales alcalinos. En la plata y el aluminio \(\omega_p\) está en el ultravioleta lejano y reflejan todo el visible; en el oro y el cobre, las transiciones de los electrones d añaden absorción en el azul (capítulo 21).</p>
<p>La ionosfera es un plasma tenue: con \(10^{12}\) electrones por metro cúbico, su frecuencia de plasma es de 9 MHz. Las ondas de radio de AM (0.5–1.7 MHz) y de onda corta se reflejan en ella y dan la vuelta al mundo de noche; las de FM (88–108 MHz), la televisión y el GPS la atraviesan. Por eso para comunicarse con satélites se usan frecuencias altas.</p>
<div class="sim" data-sim="drude" data-title="Reflectancia de un plasma: metales y la ionosfera"></div>
<div class="sim-guide"><ul>
<li>La reflectancia cae bruscamente al pasar \(\omega_p\): el «borde de plasma». Cambie la densidad electrónica y la escala salta de los metales (ultravioleta) a la ionosfera (radio).</li>
<li>En la ionosfera, compare la frecuencia de una emisora de AM y una de FM con la de plasma.</li>
</ul></div>
</section>

<section>
<h2>Absorción y la ley de Beer–Lambert</h2>
<p>Una onda en un medio absorbente decae como \(\ee^{-\kappa k_0z}\) en amplitud, y su intensidad como</p>
<div class="eq key" data-name="Beer–Lambert">\[I(z)=I_0\,\ee^{-\alpha z},\qquad\alpha=\frac{4\pi\kappa}{\lambda}.\]</div>
<p>En química se escribe con la concentración: la <span class="term">absorbancia</span> \(A=\log_{10}(I_0/I)=\varepsilon cl\), proporcional a la concentración \(c\) y al camino \(l\). Así funcionan los espectrofotómetros de los laboratorios clínicos. El color de una sustancia es el complementario de lo que absorbe: el agua absorbe débilmente el rojo (unas 0.6 m⁻¹ a 700 nm) y casi nada el azul, y por eso una piscina profunda o el mar se ven azules aun sin reflejo del cielo; la clorofila absorbe el azul y el rojo, y las hojas son verdes.</p>
<div class="sim" data-sim="beer" data-title="Absorción en una solución coloreada"></div>
<div class="sim-guide"><ul>
<li>Una banda de absorción gaussiana se refuerza con la concentración y con el camino óptico. El color transmitido es el complementario.</li>
<li>Duplicar la concentración equivale a duplicar el espesor: es la ley de Beer–Lambert.</li>
</ul></div>
</section>

<section>
<h2>Las relaciones de Kramers–Kronig</h2>
<p>La respuesta de un material no puede preceder a la causa: la polarización en un instante solo depende del campo anterior. Esa <span class="term">causalidad</span> obliga a que la parte real y la imaginaria de la susceptibilidad estén ligadas (Kramers y Kronig, 1926–1927):</p>
<div class="eq key" data-name="Kramers–Kronig">\[\Rea\chi(\omega)=\frac2\pi\,\mathcal P\!\int_0^\infty\frac{\omega'\,\Ima\chi(\omega')}{\omega'^2-\omega^2}\dd\omega'.\]</div>
<p>Conociendo la absorción en todas las frecuencias se conoce el índice, y viceversa. Un material transparente en el visible tiene \(n&gt;1\) porque absorbe en el ultravioleta y en el infrarrojo. La simulación del oscilador de Lorentz comprueba la relación numéricamente, y el apéndice B lo valida con una precisión de tres diezmilésimas.</p>
</section>

<section>
<h2>El esparcimiento de Rayleigh: el cielo azul</h2>
<p>Las moléculas del aire son mucho más pequeñas que la longitud de onda. Cada una es un dipolo de Lorentz excitado muy por debajo de su resonancia, y radia con una potencia proporcional a \(\omega^4\) (capítulo 2). Lord Rayleigh mostró en 1871 que la sección eficaz de una partícula de radio \(a\ll\lambda\) e índice relativo \(m\) es</p>
<div class="eq key" data-name="Esparcimiento de Rayleigh">\[\sigma=\frac{8\pi}{3}k^4a^6\abs{\frac{m^2-1}{m^2+2}}^2\ \propto\frac{1}{\lambda^4}.\]</div>
<p>La luz azul de 450 nm se dispersa 5.9 veces más que la roja de 700 nm: el cielo es azul. No es violeta porque el Sol emite menos violeta, la atmósfera lo absorbe en parte (ozono) y el ojo es poco sensible a él. La atenuación de la luz directa del Sol la da el <span class="term">espesor óptico</span> de Rayleigh, 0.097 a 550 nm al nivel del mar según Bodhaine et al. (1999), multiplicado por la masa de aire atravesada, que crece de 1 en el cenit a 10 con el Sol a 5° y a 38 en el horizonte. Al atardecer el azul se ha dispersado por el camino y el Sol se ve naranja o rojo. En Popayán, con 82 kPa de presión, el aire encima es un 19 % menor y el cielo un poco más oscuro. La luz del cielo a 90° del Sol está casi totalmente polarizada.</p>
<div class="sim" data-sim="cielo" data-title="El color del Sol y del cielo según la altura del Sol"></div>
<div class="sim-guide"><ul>
<li>El color del Sol se calcula con el espectro solar (cuerpo negro de 5772 K) atenuado por el espesor óptico de Rayleigh y la masa de aire; el del cielo, con un modelo de esparcimiento simple. No incluye aerosoles ni ozono.</li>
<li>Baje el Sol hacia el horizonte y compare el nivel del mar con Popayán.</li>
</ul></div>
</section>

<section>
<h2>El esparcimiento de Mie: las nubes blancas</h2>
<p>Si la partícula es comparable o mayor que la longitud de onda, hay que resolver exactamente las ecuaciones de Maxwell para una esfera. Gustav Mie lo hizo en 1908: el campo esparcido es una serie de ondas multipolares con coeficientes \(a_n\), \(b_n\) que dependen del <span class="term">parámetro de tamaño</span> \(x=2\pi a/\lambda\) y del índice. Para \(x\ll1\) se recupera Rayleigh; para \(x\gg1\) la eficiencia de extinción \(Q_{ext}=\sigma_{ext}/\pi a^2\) oscila y tiende a 2, el doble del área geométrica (la «paradoja de la extinción»: la mitad es la difracción que acompaña a la sombra). Una gota de nube de 10 µm (\(x=114\)) extingue casi igual todos los colores: las nubes son blancas, y grises cuando son tan gruesas que la luz no las atraviesa. La luz esparcida por partículas grandes va sobre todo hacia adelante (factor de asimetría \(g\) cercano a 1): por eso el halo blanco alrededor del Sol en un día con bruma. Este curso implementa el algoritmo de Bohren y Huffman y lo valida con <code>miepython</code> en 120 comprobaciones.</p>
<div class="sim" data-sim="mie" data-title="Esparcimiento de Mie: eficiencias y diagrama angular"></div>
<div class="sim-guide"><ul>
<li>La curva de \(Q_{ext}\) en función del tamaño muestra el régimen de Rayleigh (\(\propto x^4\)), las oscilaciones de interferencia y el límite de 2.</li>
<li>El diagrama polar (escala logarítmica) muestra cómo se concentra la luz hacia adelante al crecer la partícula.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Cuántas veces más se dispersa la luz de 400 nm que la de 600 nm por esparcimiento de Rayleigh?
<details><summary>Respuesta</summary><p>\((600/400)^4=5.06\).</p></details></li>
<li><span class="lvl">Básico</span>Una solución tiene absorbancia 0.30 en una cubeta de 1 cm. ¿Qué fracción de la luz pasa? ¿Y con 3 cm?
<details><summary>Respuesta</summary><p>\(10^{-0.3}=50\) %; con 3 cm, \(10^{-0.9}=12.6\) %.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Qué densidad electrónica debe tener la ionosfera para reflejar ondas de 30 MHz a incidencia vertical?
<details><summary>Respuesta</summary><p>\(N=\eo m(2\pi f)^2/e^2=1.1\times10^{13}\) m⁻³.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Qué fracción de la luz de 450 nm del Sol llega al suelo, por esparcimiento de Rayleigh, cuando el Sol está a 10° de altura, al nivel del mar y en Popayán?
<details><summary>Respuesta</summary><p>Masa de aire 5.59; \(\tau=0.221\) y \(0.179\): \(\ee^{-1.235}=29\) % y \(\ee^{-1.000}=37\) %.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que en el modelo de Lorentz sin amortiguamiento \(n^2-1=\frac{\omega_p^2}{\omega_0^2-\omega^2}\) se escribe como un término de Sellmeier \(B\lambda^2/(\lambda^2-C)\) e identifique \(B\) y \(C\).
<details><summary>Respuesta</summary><p>Con \(\omega=2\pi c/\lambda\): \(\frac{\omega_p^2}{\omega_0^2-\omega^2}=\frac{(\omega_p/\omega_0)^2\lambda^2}{\lambda^2-\lambda_0^2}\), con \(B=\omega_p^2/\omega_0^2\) y \(C=\lambda_0^2=(2\pi c/\omega_0)^2\).</p></details></li>
</ol>
