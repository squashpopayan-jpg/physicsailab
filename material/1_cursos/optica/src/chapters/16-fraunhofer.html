<p class="lead">Cuando la luz pasa por una abertura no proyecta una sombra nítida: se abre en ángulos del orden de \(\lambda/a\) y dibuja franjas. Esta difracción es la consecuencia más directa de que la luz sea una onda, y fija un límite a todo instrumento óptico: ninguna lente puede enfocar un punto en un punto. Este capítulo trata la difracción a gran distancia, la de Fraunhofer, que es la que aparece en el plano focal de cualquier lente.</p>

<section>
<h2>El principio de Huygens–Fresnel</h2>
<p>Fresnel dio forma cuantitativa al principio de Huygens en 1818: cada punto de una abertura iluminada emite una onda esférica secundaria con la amplitud y la fase de la onda que llega, y el campo en un punto lejano es la suma (la integral) de todas ellas. Kirchhoff la dedujo en 1882 de la ecuación de onda. Para una abertura de tamaño \(a\) iluminada por una onda plana y una pantalla a la distancia \(L\), el comportamiento depende del <span class="term">número de Fresnel</span></p>
<div class="eq key" data-name="Número de Fresnel">\[N_F=\frac{a^2}{\lambda L}.\]</div>
<p>Si \(N_F\gtrsim1\), la pantalla está cerca: el patrón se parece a la sombra geométrica con bordes ondulados (difracción de Fresnel, capítulo 18). Si \(N_F\ll1\), la pantalla está lejos y el patrón solo depende del ángulo: es la <span class="term">difracción de Fraunhofer</span>. Para una rendija de 0.1 mm iluminada con luz roja, «lejos» significa más de unos 2 cm. Una lente lleva el infinito a su plano focal: el patrón de Fraunhofer de cualquier abertura aparece en el foco de la lente que hay detrás, a la distancia \(f\theta\) del eje.</p>
</section>

<section>
<h2>La rendija simple</h2>
<p>Una rendija de ancho \(a\) se divide en franjas elementales. En la dirección \(\theta\), las ondas de los dos bordes difieren en un camino \(a\sen\theta\). Sumando los fasores de todas las franjas elementales, que forman un arco de circunferencia de ángulo total \(2\beta\), se obtiene</p>
<div class="eq key" data-name="Rendija simple">\[I(\theta)=I_0\left(\frac{\sen\beta}{\beta}\right)^2,\qquad\beta=\frac{\pi a\sen\theta}{\lambda}.\]</div>
<p>Los ceros están en \(a\sen\theta=m\lambda\) (\(m=\pm1,\pm2,\dots\)): la rendija se divide en dos mitades cuyas contribuciones se cancelan por pares. El máximo central es el doble de ancho que los laterales y contiene el 90 % de la energía; los siguientes máximos tienen el 4.7 % y el 1.6 % de la intensidad central. Cuanto más estrecha la rendija, más se abre el patrón: con 0.1 mm y luz de 633 nm el máximo central mide 12.7 mm sobre una pantalla a 1 m. Si la rendija es mucho más ancha que \(\lambda\), el haz casi no se abre y vale la óptica geométrica.</p>
<div class="sim" data-sim="rendija" data-title="Rendija simple: patrón y espiral de fasores"></div>
<div class="sim-guide"><ul>
<li>A la izquierda, la suma de los fasores de la rendija para la dirección elegida: se enrolla en un arco y la resultante es la cuerda. Se anula cuando el arco da una vuelta completa.</li>
<li>Cambie el ancho y la longitud de onda: la anchura angular del máximo central es \(2\lambda/a\).</li>
</ul></div>
</section>

<section>
<h2>Aberturas rectangulares y circulares</h2>
<p>Para una abertura rectangular de lados \(a\) y \(b\) la integral se separa y el patrón es el producto de dos patrones de rendija, \(I=I_0\,\mathrm{sinc}^2\beta_x\,\mathrm{sinc}^2\beta_y\): una cruz de manchas, más estirada en la dirección del lado más corto. Es una regla general de la difracción de Fraunhofer: el patrón es la transformada de Fourier de la abertura, y lo que es estrecho en la abertura es ancho en el patrón (capítulo 19).</p>
<p>La abertura más importante es la circular, porque lo son las lentes y los espejos. George Airy calculó en 1835 su patrón:</p>
<div class="eq key" data-name="Patrón de Airy">\[I(\theta)=I_0\left[\frac{2J_1(x)}{x}\right]^2,\qquad x=\frac{\pi D\sen\theta}{\lambda},\]</div>
<p>donde \(J_1\) es la función de Bessel de orden 1 y \(D\) el diámetro. El primer cero, en \(x=3.8317\), da el radio angular del <span class="term">disco de Airy</span>:</p>
<div class="eq key" data-name="Disco de Airy">\[\sen\theta_1=1.22\,\frac{\lambda}{D},\qquad r_1=1.22\,\lambda N\ \text{(en el plano focal)}.\]</div>
<p>El disco contiene el 83.8 % de la luz; el primer anillo, el 7.2 %, con un máximo del 1.75 % de la intensidad central. Un objetivo a f/2 en luz verde forma discos de 1.3 µm de radio, del orden del píxel de un celular.</p>
<div class="sim" data-sim="rectangular" data-title="Abertura rectangular"></div>
<div class="sim-guide"><ul>
<li>El patrón es el producto de dos patrones de rendija. Estreche un lado: el patrón se ensancha en esa dirección.</li>
<li>La escala logarítmica permite ver los máximos secundarios débiles.</li>
</ul></div>
<div class="sim" data-sim="airy" data-title="Abertura circular: el disco de Airy"></div>
<div class="sim-guide"><ul>
<li>El perfil radial es \([2J_1(x)/x]^2\), calculado con funciones de Bessel validadas con SciPy. La curva discontinua es la energía encerrada.</li>
<li>Con una obstrucción central, como el espejo secundario de un telescopio, la luz pasa del disco a los anillos.</li>
</ul></div>
</section>

<section>
<h2>El criterio de Rayleigh</h2>
<p>Dos estrellas de igual brillo forman dos discos de Airy. Lord Rayleigh propuso en 1879 considerarlas resueltas cuando el máximo de un disco cae sobre el primer mínimo del otro:</p>
<div class="eq key" data-name="Criterio de Rayleigh">\[\theta_{min}=1.22\,\frac{\lambda}{D}.\]</div>
<p>Entonces la intensidad entre los dos picos baja al 73.5 % del máximo, lo que el ojo distingue. El criterio es convencional (el de Sparrow pide que la depresión apenas desaparezca, y es un 20 % más exigente), pero fija el orden de magnitud: la pupila de 3 mm resuelve 0.77′; un telescopio de 10 cm, 1.4″; el Hubble, 0.058″. Ese límite solo se alcanza si las aberraciones son menores que la difracción y si la atmósfera no lo impide: la turbulencia limita los telescopios terrestres a 0.5–1″, salvo que usen óptica adaptativa.</p>
<div class="sim" data-sim="rayleigh" data-title="Dos estrellas y el criterio de Rayleigh"></div>
<div class="sim-guide"><ul>
<li>Acerque las dos fuentes: en la separación de Rayleigh la depresión central es del 73.5 %; en la de Sparrow, desaparece.</li>
<li>Cambie la razón de brillos: con estrellas desiguales es más difícil separarlas.</li>
</ul></div>
</section>

<section>
<h2>El principio de Babinet</h2>
<p>Dos pantallas complementarias, como una rendija y un alambre del mismo ancho, producen campos que sumados dan el campo sin pantalla. Fuera de la dirección del haz directo, donde el campo libre es nulo, los dos patrones de Fraunhofer son idénticos: es el <span class="term">principio de Babinet</span> (1837). Por eso un cabello iluminado con un puntero láser produce el patrón de una rendija de su mismo ancho, y midiendo la separación de los mínimos se mide su diámetro: un cabello de 70 µm con luz de 650 nm da mínimos cada 18.6 mm sobre una pared a 2 m. Así se controla en línea el diámetro de los alambres en las fábricas.</p>
<div class="sim" data-sim="babinet" data-title="Medir un cabello con un puntero láser"></div>
<div class="sim-guide"><ul>
<li>Compare el patrón de una rendija y el de un alambre del mismo ancho: fuera del centro son idénticos.</li>
<li>Mida la separación de los mínimos en la pantalla y deduzca el diámetro con \(d=\lambda L/\Delta y\).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una rendija de 50 µm se ilumina con 532 nm. ¿A qué ángulo está el primer mínimo y qué ancho tiene el máximo central en una pantalla a 2 m?
<details><summary>Respuesta</summary><p>\(\sen\theta=\lambda/a=0.0106\Rightarrow\theta=0.61°\); ancho \(2L\lambda/a=42.6\) mm.</p></details></li>
<li><span class="lvl">Básico</span>¿Qué separación angular mínima resuelve un telescopio de 20 cm en luz de 550 nm?
<details><summary>Respuesta</summary><p>\(1.22\times550\times10^{-9}/0.2=3.36\times10^{-6}\) rad \(=0.69''\).</p></details></li>
<li><span class="lvl">Intermedio</span>Un objetivo de 50 mm a f/8 enfoca luz de 600 nm. ¿Qué diámetro tiene el disco de Airy? ¿Cuántos píxeles de 4 µm ocupa?
<details><summary>Respuesta</summary><p>\(2\times1.22\times0.6\times8=11.7\) µm: casi tres píxeles.</p></details></li>
<li><span class="lvl">Intermedio</span>Los faros de un carro están separados 1.4 m. ¿A qué distancia máxima los distingue un ojo con pupila de 5 mm en luz de 550 nm, según Rayleigh?
<details><summary>Respuesta</summary><p>\(\theta=1.22\lambda/D=1.34\times10^{-4}\) rad; \(L=1.4/1.34\times10^{-4}=10.4\) km.</p></details></li>
<li><span class="lvl">Avanzado</span>Deduzca el patrón de la rendija integrando \(E(\theta)\propto\int_{-a/2}^{a/2}\ee^{\ii kx\sen\theta}\dd x\) y demuestre que el 90.3 % de la potencia está en el máximo central.
<details><summary>Respuesta</summary><p>La integral da \(a\,\sen\beta/\beta\). La fracción en el máximo central es \(\frac1\pi\int_{-\pi}^{\pi}\mathrm{sinc}^2\beta\,\dd\beta=0.903\) (normalizando con \(\int_{-\infty}^{\infty}\mathrm{sinc}^2=\pi\)).</p></details></li>
</ol>
