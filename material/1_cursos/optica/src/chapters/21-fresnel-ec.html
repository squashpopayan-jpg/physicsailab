<template class="chapter-src" data-id="fresnel-ec" data-num="21" data-title="Las ecuaciones de Fresnel" data-part="Parte V · Polarización y materia" data-short="Condiciones de frontera, coeficientes de Fresnel para las polarizaciones s y p, reflectancia y transmitancia en función del ángulo, el ángulo de Brewster y la pila de placas, la reflexión total interna, sus desfases y el rombo de Fresnel, la onda evanescente, la reflexión total frustrada y la reflexión en metales">
<p class="lead">Las leyes de la reflexión y de Snell dicen hacia dónde va la luz en una interfaz, pero no cuánta. La respuesta sale de las ecuaciones de Maxwell y depende de la polarización: las fórmulas que Augustin Fresnel encontró en 1823, antes de que existieran esas ecuaciones. Explican por qué el agua refleja más al atardecer, por qué los reflejos están polarizados, cómo una onda «atraviesa» una reflexión total y por qué el oro es dorado.</p>

<section>
<h2>Los coeficientes de Fresnel</h2>
<p>En una interfaz entre dos medios sin cargas ni corrientes libres, las componentes tangenciales de \(\vb E\) y de \(\vb H\) son continuas. Una onda que llega con ángulo \(\theta_1\) se descompone en dos polarizaciones: <span class="term">s</span> (o TE), con el campo eléctrico perpendicular al plano de incidencia, y <span class="term">p</span> (o TM), con el campo eléctrico en ese plano. Para cada una, las condiciones de frontera dan los cocientes entre las amplitudes reflejada y transmitida y la incidente:</p>
<div class="eq key" data-name="Coeficientes de Fresnel">\[r_s=\frac{n_1\cos\theta_1-n_2\cos\theta_2}{n_1\cos\theta_1+n_2\cos\theta_2},\qquad r_p=\frac{n_2\cos\theta_1-n_1\cos\theta_2}{n_2\cos\theta_1+n_1\cos\theta_2},\]</div>
<div class="eq">\[t_s=\frac{2n_1\cos\theta_1}{n_1\cos\theta_1+n_2\cos\theta_2},\qquad t_p=\frac{2n_1\cos\theta_1}{n_2\cos\theta_1+n_1\cos\theta_2}.\]</div>
<p>Los signos de \(r_p\) dependen del sentido elegido para los campos; este curso usa el convenio de Hecht y de la biblioteca <code>tmm</code>, con el que a incidencia normal \(r_p=-r_s=(n_2-n_1)/(n_2+n_1)\). Las fracciones de potencia son \(R=\abs r^2\) y \(T=\frac{n_2\cos\theta_2}{n_1\cos\theta_1}\abs t^2\), con \(R+T=1\): el factor de \(T\) tiene en cuenta que el haz transmitido cambia de sección y de velocidad.</p>
</section>

<section>
<h2>Reflectancia en función del ángulo</h2>
<p>Para el vidrio (\(n=1.5\)) desde el aire, a incidencia normal se refleja el 4 %. Al inclinar la luz, \(R_s\) crece de forma monótona (9.2 % a 45°, 30 % a 70°) mientras \(R_p\) disminuye hasta anularse y luego crece; a incidencia rasante ambas tienden a 1. Por eso un lago refleja poco cuando se mira hacia abajo y es un espejo cuando se mira hacia el horizonte, y por eso las ventanas reflejan más al atardecer.</p>
<div class="sim" data-sim="fresnel" data-title="Reflectancia y fase de las polarizaciones s y p"></div>
<div class="sim-guide"><ul>
<li>Las curvas son \(R_s\), \(R_p\) y su promedio (luz natural). Marque el ángulo de Brewster, donde \(R_p=0\), y, si la luz va del medio denso al menos denso, el ángulo crítico.</li>
<li>Active las fases: en la reflexión externa \(r_s\) es negativo (desfase \(\pi\)); en la reflexión total, las fases varían de forma continua.</li>
</ul></div>
</section>

<section>
<h2>El ángulo de Brewster</h2>
<p>La reflexión de la polarización p se anula cuando el rayo reflejado y el refractado forman 90°. Entonces los dipolos del segundo medio, que oscilan en la dirección del campo transmitido, apuntan justo en la dirección en que debería salir la luz reflejada, y un dipolo no radia a lo largo de su eje. David Brewster lo encontró en 1815:</p>
<div class="eq key" data-name="Ángulo de Brewster">\[\tan\theta_B=\frac{n_2}{n_1}.\]</div>
<p>Vale 56.6° para el vidrio N-BK7 y 53.1° para el agua. La luz reflejada a ese ángulo está totalmente polarizada en la dirección s, paralela a la superficie: es el brillo que eliminan las gafas polarizadas. Los láseres de gas tienen ventanas inclinadas al ángulo de Brewster, que no reflejan la polarización p y fuerzan así al láser a emitirla. Una <span class="term">pila de placas</span> de vidrio a ese ángulo refleja en cada superficie una parte de la luz s y nada de la p: la luz transmitida se polariza progresivamente. Con las reflexiones múltiples entre placas (sumadas sin coherencia), diez placas dan un grado de polarización de 0.64.</p>
<div class="sim" data-sim="pila-placas" data-title="Polarizador de pila de placas"></div>
<div class="sim-guide"><ul>
<li>A la incidencia de Brewster la componente p pasa entera; la s pierde en cada superficie. Aumente el número de placas y lea el grado de polarización.</li>
<li>Aléjese del ángulo de Brewster: la componente p también se refleja y el polarizador empeora.</li>
</ul></div>
</section>

<section>
<h2>Reflexión total interna y la onda evanescente</h2>
<p>Más allá del ángulo crítico, \(\sen\theta_2=n_1\sen\theta_1/n_2&gt;1\) y \(\cos\theta_2\) se vuelve imaginario. Los coeficientes de Fresnel siguen valiendo: \(\abs{r_s}=\abs{r_p}=1\), y la reflexión es total, pero cada polarización adquiere un desfase distinto. Fresnel aprovechó esa diferencia: en su <span class="term">rombo</span>, un prisma de vidrio en el que la luz se refleja dos veces a 54.6° (con \(n=1.51\)), cada reflexión desfasa 45° la componente p respecto de la s, y la luz lineal a 45° sale circular. Es un retardador de cuarto de onda casi independiente de la longitud de onda.</p>
<p>Al otro lado de la interfaz el campo no es nulo. Las condiciones de frontera exigen una <span class="term">onda evanescente</span> que viaja a lo largo de la superficie y decae exponencialmente hacia el segundo medio, sin transportar energía hacia él:</p>
<div class="eq key" data-name="Onda evanescente">\[E\propto\ee^{-z/\delta}\,\ee^{\ii(k_xx-\omega t)},\qquad\delta=\frac{\lambda}{2\pi\sqrt{n_1^2\sen^2\theta_1-n_2^2}}.\]</div>
<p>Del vidrio al aire con luz de 633 nm, la profundidad \(\delta\) es de 285 nm a 45° y de 122 nm a 60°. La onda evanescente se usa en la microscopía de fluorescencia por reflexión total (TIRF), que ilumina solo las moléculas pegadas a la superficie, y en los sensores de resonancia de plasmones. El haz reflejado sale además ligeramente desplazado a lo largo de la superficie, una fracción de la longitud de onda: el desplazamiento de Goos–Hänchen (1947).</p>
<div class="sim" data-sim="evanescente" data-title="La onda evanescente en la reflexión total"></div>
<div class="sim-guide"><ul>
<li>El mapa muestra el campo instantáneo: ondas incidente y reflejada arriba, onda evanescente abajo. Acerque el ángulo al crítico: la onda penetra más.</li>
<li>La gráfica da la profundidad de penetración en función del ángulo.</li>
</ul></div>
<p>Si un segundo medio denso se acerca a menos de unas pocas profundidades \(\delta\), la onda evanescente se acopla a él y parte de la luz pasa: es la <span class="term">reflexión total frustrada</span>, el análogo óptico del efecto túnel. Con dos prismas de vidrio separados 100 nm de aire, a 45° y 633 nm, pasa el 79 % de la luz; con 400 nm, el 12 %. Los cubos divisores de haz y algunos acopladores de fibra funcionan así.</p>
<div class="sim" data-sim="ftir" data-title="Reflexión total frustrada"></div>
<div class="sim-guide"><ul>
<li>La transmisión a través del hueco de aire se calcula con matrices de transferencia (el capítulo 15). Cae casi exponencialmente con el ancho del hueco, como la probabilidad de túnel de un electrón.</li>
</ul></div>
</section>

<section>
<h2>Reflexión en metales</h2>
<p>En un metal el índice de refracción es complejo, \(\tilde n=n+\ii\kappa\), con \(\kappa\) grande: los electrones libres responden al campo y lo apantallan en unas decenas de nanómetros (capítulo 23). Las fórmulas de Fresnel siguen valiendo con \(\tilde n\), y a incidencia normal</p>
<div class="eq">\[R=\frac{(n-1)^2+\kappa^2}{(n+1)^2+\kappa^2},\]</div>
<p>que es cercano a 1 cuando \(\kappa\gg n\). Según las medidas de Johnson y Christy (1972), la plata refleja más del 96 % en todo el visible y el aluminio, según Rakić (1995), alrededor del 92 %, también en el ultravioleta: por eso los espejos de los telescopios son de aluminio. En el oro y el cobre los electrones de las capas d absorben la luz azul y verde (transiciones interbanda): el oro refleja el 41 % a 450 nm y el 91 % a 600 nm, y por eso es amarillo; el cobre, algo más absorbente en el naranja, es rojizo.</p>
<div class="sim" data-sim="metales" data-title="Reflectancia y color de los metales"></div>
<div class="sim-guide"><ul>
<li>Las curvas usan los índices complejos medidos (refractiveindex.info). El color de cada metal se calcula integrando su reflectancia bajo el iluminante D65.</li>
<li>Cambie el ángulo de incidencia: la polarización p de un metal tiene un mínimo de reflexión, el «ángulo de Brewster principal».</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Qué fracción de la luz se refleja a incidencia normal en la superficie de un diamante (\(n=2.42\))?
<details><summary>Respuesta</summary><p>\(R=(1.42/3.42)^2=0.172\).</p></details></li>
<li><span class="lvl">Básico</span>¿A qué altura sobre el horizonte debe estar el Sol para que su reflejo en un lago esté totalmente polarizado?
<details><summary>Respuesta</summary><p>El ángulo de incidencia es 53.1°: el Sol a \(90°-53.1°=36.9°\) de altura.</p></details></li>
<li><span class="lvl">Intermedio</span>¿A qué profundidad penetra la onda evanescente en el agua (\(n=1.333\)) cuando luz de 488 nm se refleja totalmente desde un vidrio de 1.52 a 70°?
<details><summary>Respuesta</summary><p>\(\delta=\lambda/(2\pi\sqrt{1.52^2\sen^270°-1.333^2})=0.488/(2\pi\times0.513)=151\) nm.</p></details></li>
<li><span class="lvl">Intermedio</span>Use \(n=0.43\), \(\kappa=2.45\) para el oro a 550 nm y calcule su reflectancia a incidencia normal.
<details><summary>Respuesta</summary><p>\(R=(0.57^2+2.45^2)/(1.43^2+2.45^2)=6.33/8.05=0.79\).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que en la reflexión total el desfase entre las componentes p y s es \(\tan\frac{\delta_p-\delta_s}{2}=\frac{\cos\theta\sqrt{\sen^2\theta-n^2}}{\sen^2\theta}\), con \(n=n_2/n_1\), y que su valor máximo para \(n=1/1.51\) es de unos 46°.
<details><summary>Respuesta</summary><p>Escribiendo \(r=\ee^{\ii\delta}\) con \(\cos\theta_2=\ii\sqrt{\sen^2\theta-n^2}/n\) y dividiendo las fases. El máximo, derivando respecto de \(\theta\), ocurre en \(\sen^2\theta=2n^2/(1+n^2)\) (51.3° para \(n=1/1.51\)) y vale \(2\arctan\frac{1-n^2}{2n}=45.9°\). Por eso el rombo usa dos reflexiones de 45°.</p></details></li>
</ol>
<div class="box note"><h4>Para profundizar</h4><p>A. Fresnel, «Mémoire sur la loi des modifications que la réflexion imprime à la lumière polarisée», 1823. D. Brewster, «On the laws which regulate the polarisation of light by reflexion from transparent bodies», <em>Phil. Trans.</em> 105, 125 (1815). P. B. Johnson y R. W. Christy, «Optical constants of the noble metals», <em>Phys. Rev. B</em> 6, 4370 (1972). A. D. Rakić, «Algorithm for the determination of intrinsic optical constants of metal films: application to aluminum», <em>Appl. Opt.</em> 34, 4755 (1995). F. Goos y H. Hänchen, <em>Ann. Phys.</em> 436, 333 (1947).</p></div>
</section>
