<p class="lead">Cerca de una abertura, la luz ni sigue la sombra geométrica ni se ha abierto todavía en el patrón de Fraunhofer. En esa región intermedia ocurren algunos de los fenómenos más sorprendentes de la óptica: el centro de la sombra de un disco es brillante, una abertura circular puede tener el eje oscuro y un patrón de anillos alternados enfoca la luz como una lente. Este capítulo los explica con una idea geométrica simple, las zonas de Fresnel.</p>

<section>
<h2>La aproximación de Fresnel</h2>
<p>En la integral de Huygens–Fresnel la distancia \(r\) desde un punto \((\xi,\eta)\) de la abertura hasta un punto \((x,y)\) de una pantalla a la distancia \(z\) se desarrolla hasta el término cuadrático:</p>
<div class="eq">\[r\approx z+\frac{(x-\xi)^2+(y-\eta)^2}{2z}.\]</div>
<p>Con ello el campo en la pantalla es</p>
<div class="eq key" data-name="Integral de Fresnel">\[U(x,y)=\frac{\ee^{\ii kz}}{\ii\lambda z}\iint U_0(\xi,\eta)\exp\!\left\{\frac{\ii k}{2z}\left[(x-\xi)^2+(y-\eta)^2\right]\right\}\dd\xi\,\dd\eta.\]</div>
<p>Si además \(z\gg a^2/\lambda\), el término cuadrático en \(\xi,\eta\) es despreciable y se recupera la difracción de Fraunhofer. Cuando el número de Fresnel \(N_F=a^2/\lambda z\) es del orden de 1 o mayor, el término cuadrático importa y el patrón depende de la distancia: es la <span class="term">difracción de Fresnel</span>.</p>
</section>

<section>
<h2>Zonas de Fresnel</h2>
<p>Visto desde un punto P del eje a la distancia \(z\), un frente de onda plano se divide en anillos cuyos bordes están a distancias \(z+\lambda/2\), \(z+\lambda\), \(z+3\lambda/2\)… de P. Son las <span class="term">zonas de Fresnel</span>, de radios</p>
<div class="eq key" data-name="Zonas de Fresnel">\[r_m=\sqrt{m\lambda z}.\]</div>
<p>Todas tienen la misma área, \(\pi\lambda z\), y la luz de zonas vecinas llega a P con fases opuestas. La suma de los fasores de las zonas forma una espiral que se enrolla hacia el centro, y la contribución total del frente libre es la mitad de la primera zona. Si una abertura circular de radio \(a\) deja pasar exactamente una zona, la amplitud en P es el doble de la del frente libre y la intensidad, cuatro veces mayor; si deja pasar dos zonas, se cancelan y el eje queda oscuro. La intensidad en el eje es</p>
<div class="eq key" data-name="Intensidad en el eje de una abertura circular">\[I(z)=4I_0\sen^2\!\left(\frac{\pi a^2}{2\lambda z}\right)=4I_0\sen^2\!\left(\frac{\pi N_F}{2}\right).\]</div>
<p>Una abertura de 1 mm de radio con luz de 500 nm deja pasar dos zonas a 1 m (centro oscuro) y una zona a 2 m (centro cuatro veces más brillante que sin abertura). Más allá de 2 m las zonas son más grandes que la abertura y el patrón tiende al de Fraunhofer.</p>
<div class="sim" data-sim="zonas" data-title="Abertura circular: zonas de Fresnel e intensidad en el eje"></div>
<div class="sim-guide"><ul>
<li>Mueva la pantalla: la intensidad en el eje oscila entre 0 y 4 según el número de zonas que deja pasar la abertura. La curva continua es la fórmula; los puntos, la integral numérica.</li>
<li>El perfil radial se calcula con la integral de Fresnel con simetría circular (funciones de Bessel).</li>
</ul></div>
</section>

<section>
<h2>La mancha de Arago–Poisson</h2>
<p>Cuando Fresnel presentó su teoría a la Academia de Ciencias de París en 1818, Siméon Denis Poisson, partidario de las partículas, dedujo de ella una consecuencia que le parecía absurda: en el centro de la sombra de un disco opaco debía haber un punto brillante, tan intenso como sin disco. François Arago hizo el experimento y encontró la mancha. Con las zonas de Fresnel la explicación es inmediata: el disco tapa las primeras zonas, pero las que quedan alrededor suman, como el frente libre, la mitad de la primera zona libre, y en el eje la intensidad es exactamente la incidente. Por el principio de Babinet el campo detrás del disco es el del frente libre menos el de la abertura del mismo tamaño. La mancha tiene un radio de unos \(0.38\lambda z/a\): 160 µm para un disco de 3 mm a 1 m con luz roja. Exige un disco muy redondo y liso, porque una irregularidad del orden del tamaño de una zona la borra.</p>
<div class="sim" data-sim="arago" data-title="La mancha brillante en la sombra de un disco"></div>
<div class="sim-guide"><ul>
<li>El patrón se calcula con el principio de Babinet: campo libre menos campo de la abertura. En el centro la intensidad es 1 a cualquier distancia.</li>
<li>Acerque la pantalla: la mancha se achica y los anillos de borde se multiplican.</li>
</ul></div>
</section>

<section>
<h2>La placa zonal</h2>
<p>Si se tapan las zonas pares y se dejan libres las impares, todas las contribuciones que llegan a P están en fase: el punto se vuelve muy brillante. Una <span class="term">placa zonal</span> con anillos de radios \(r_m=\sqrt{m\lambda f}\) enfoca la luz paralela a la distancia</p>
<div class="eq key" data-name="Placa zonal">\[f=\frac{r_1^2}{\lambda}.\]</div>
<p>A diferencia de una lente, tiene también focos más débiles en \(f/3\), \(f/5\)…, donde cada zona de la placa contiene tres, cinco… zonas de Fresnel, y su focal es inversamente proporcional a la longitud de onda: una dispersión fortísima. Una placa con \(r_1=0.5\) mm enfoca la luz de 633 nm a 39.5 cm. Su eficiencia es baja (un 10 % en el foco principal), pero no necesita material transparente: las placas zonales de oro o níquel son las lentes de los microscopios de rayos X, donde ningún material refracta lo suficiente. La <span class="term">lente de Fresnel</span> de los faros es otra cosa: una lente refractiva cortada en escalones para ahorrar vidrio.</p>
<div class="sim" data-sim="placa-zonal" data-title="Placa zonal: focos múltiples"></div>
<div class="sim-guide"><ul>
<li>La intensidad en el eje se calcula sumando exactamente el campo de cada anillo abierto. Aparecen picos en \(f\), \(f/3\), \(f/5\). En el eje los focos secundarios son tan intensos como el principal, pero su mancha es 3 y 5 veces más estrecha: llevan 1/9 y 1/25 de la potencia.</li>
<li>Cambie la longitud de onda: el foco se mueve como \(1/\lambda\).</li>
</ul></div>
</section>

<section>
<h2>La espiral de Cornu: borde recto y rendija</h2>
<p>Para aberturas rectas (un borde, una rendija) la integral de Fresnel se reduce a las <span class="term">integrales de Fresnel</span></p>
<div class="eq">\[C(v)=\int_0^v\cos\frac{\pi t^2}{2}\dd t,\qquad S(v)=\int_0^v\sen\frac{\pi t^2}{2}\dd t,\]</div>
<p>con la variable adimensional \(v=y\sqrt{2/\lambda z}\). El punto \((C(v),S(v))\) recorre la <span class="term">espiral de Cornu</span>, que se enrolla hacia \((\pm\tfrac12,\pm\tfrac12)\). La amplitud en cada punto de la pantalla es la longitud de la cuerda entre dos puntos de la espiral que corresponden a los bordes de la abertura. Detrás de un borde recto, en el límite de la sombra geométrica, la intensidad es \(1/4\) de la incidente; dentro de la sombra decae suavemente, y fuera oscila con un primer máximo de 1.37 en \(v=1.22\). En una rendija, al alejar la pantalla, el patrón pasa de una sombra nítida con bordes ondulados al patrón de Fraunhofer.</p>
<div class="sim" data-sim="cornu" data-title="Espiral de Cornu: borde recto y rendija"></div>
<div class="sim-guide"><ul>
<li>Mueva el punto de observación: la cuerda roja une los puntos de la espiral que corresponden a los bordes, y su longitud al cuadrado es la intensidad.</li>
<li>Con la rendija, cambie el número de Fresnel: con \(N_F\ll1\) el patrón es el de Fraunhofer; con \(N_F\gg1\), una sombra nítida.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Cuántas zonas de Fresnel deja pasar una abertura de 2 mm de diámetro para un punto a 50 cm, con luz de 500 nm?
<details><summary>Respuesta</summary><p>\(N_F=a^2/\lambda z=(10^{-3})^2/(5\times10^{-7}\times0.5)=4\): cuatro zonas, centro oscuro.</p></details></li>
<li><span class="lvl">Básico</span>Una placa zonal tiene su primer anillo de 0.3 mm de radio. ¿Cuál es su focal para 550 nm? ¿Dónde están los focos secundarios?
<details><summary>Respuesta</summary><p>\(f=r_1^2/\lambda=16.4\) cm; secundarios a 5.5 cm, 3.3 cm…</p></details></li>
<li><span class="lvl">Intermedio</span>¿A qué distancia de un borde recto, dentro de la zona iluminada, está el primer máximo de intensidad sobre una pantalla a 2 m con luz de 633 nm?
<details><summary>Respuesta</summary><p>\(v=1.22\Rightarrow y=v\sqrt{\lambda z/2}=1.22\sqrt{633\times10^{-9}}=0.97\) mm.</p></details></li>
<li><span class="lvl">Intermedio</span>Para observar la mancha de Poisson de una moneda de 2 cm con luz de 633 nm, ¿a qué distancia mínima conviene poner la pantalla para que la mancha tenga al menos 0.5 mm de radio?
<details><summary>Respuesta</summary><p>\(0.38\lambda z/a\ge0.5\) mm \(\Rightarrow z\ge0.5\times10^{-3}\times0.01/(0.38\times633\times10^{-9})=21\) m.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que el campo en el eje detrás de un anillo abierto entre los radios \(r_1\) y \(r_2\) es \(U=\ee^{\ii kz}\left[\ee^{\ii\pi r_1^2/\lambda z}-\ee^{\ii\pi r_2^2/\lambda z}\right]\) y deduzca de ahí la fórmula de la intensidad en el eje de una abertura circular.
<details><summary>Respuesta</summary><p>En el eje, \(U=\frac{\ee^{\ii kz}}{\ii\lambda z}\int_{r_1}^{r_2}\ee^{\ii k\rho^2/2z}2\pi\rho\,\dd\rho\); con \(u=\rho^2\) la integral es elemental. Con \(r_1=0\), \(\abs{U}^2=\abs{1-\ee^{\ii\pi a^2/\lambda z}}^2=4\sen^2(\pi a^2/2\lambda z)\).</p></details></li>
</ol>
