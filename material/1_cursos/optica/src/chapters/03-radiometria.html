<p class="lead">¿Cuánta luz hay? La pregunta tiene dos respuestas. La radiometría mide energía: vatios, sin importar quién mire. La fotometría mide la luz tal como la percibe el ojo humano, que es ciego al infrarrojo y muy sensible al verde. Este capítulo define las magnitudes de ambas, presenta la radiación del cuerpo negro, que fue el origen de la física cuántica, y explica por qué un LED ilumina diez veces más que un bombillo con la misma potencia.</p>

<section>
<h2>Magnitudes radiométricas</h2>
<p>Una fuente emite un <span class="term">flujo radiante</span> \(\Phi\) (W). Sobre una superficie que recibe luz, el flujo por unidad de área es la <span class="term">irradiancia</span> \(E=\dd\Phi/\dd A\) (W/m²); el mismo cociente para una superficie que emite se llama <span class="term">exitancia</span> \(M\). Para describir cómo se reparte la emisión en direcciones se usa el ángulo sólido \(\Omega\), medido en estereorradianes: un área \(A\) vista a la distancia \(r\) subtiende \(\Omega=A/r^2\), y la esfera completa \(4\pi\) sr. La <span class="term">intensidad radiante</span> de una fuente pequeña es el flujo por unidad de ángulo sólido, \(I=\dd\Phi/\dd\Omega\) (W/sr), y la <span class="term">radiancia</span> de una superficie extensa es el flujo por unidad de área proyectada y de ángulo sólido:</p>
<div class="eq key" data-name="Radiancia">\[L=\frac{\dd^2\Phi}{\dd A\cos\theta\,\dd\Omega}\qquad[\text{W m}^{-2}\,\text{sr}^{-1}].\]</div>
<p>La radiancia es la magnitud que el ojo y una cámara perciben como «brillo»: un sistema óptico sin pérdidas la conserva, de modo que ninguna lente puede formar una imagen más brillante que el objeto. Por eso una lupa puede encender papel con la luz del Sol (concentra el flujo en un área pequeña) pero no puede calentarlo más allá de la temperatura de la superficie solar.</p>
<div class="box def"><h4>Superficie lambertiana</h4><p>Una superficie es <b>lambertiana</b> si su radiancia es la misma en todas las direcciones. Su intensidad cae como \(I(\theta)=I_0\cos\theta\), justo lo que el área aparente, de modo que se ve igual de brillante desde cualquier ángulo. Su exitancia es \(M=\pi L\). El papel mate, la nieve, la luna llena y una pared pintada son aproximadamente lambertianos.</p></div>
<div class="sim" data-sim="lambert" data-title="Por qué una pared mate se ve igual desde cualquier ángulo"></div>
<div class="sim-guide"><ul>
<li>Compare las tres superficies: la lambertiana emite \(I_0\cos\theta\) y su radiancia es constante; la isótropa emite igual intensidad en toda dirección y se ve más brillante de canto; la especular solo devuelve luz en la dirección del reflejo.</li>
<li>Gire el observador y lea la radiancia aparente \(L=I/(A\cos\theta)\).</li>
</ul></div>
</section>

<section>
<h2>El ojo como detector: la fotometría</h2>
<p>La sensibilidad del ojo adaptado a la luz diurna depende de la longitud de onda según la <span class="term">función de eficiencia luminosa</span> \(V(\lambda)\), definida por la CIE en 1924: vale 1 en 555 nm, 0.5 hacia 510 y 610 nm, y menos de 0.01 por debajo de 420 nm y por encima de 690 nm. Las magnitudes fotométricas pesan el espectro con ella. El <span class="term">flujo luminoso</span>, en lúmenes, es</p>
<div class="eq key" data-name="Flujo luminoso">\[\Phi_v=K_m\int\Phi_\lambda(\lambda)\,V(\lambda)\,\dd\lambda,\qquad K_m=683\ \text{lm/W}.\]</div>
<p>La constante 683 lm/W es la definición de la candela en el SI: una fuente monocromática de 540 THz (555 nm) que emite 1/683 W/sr tiene una intensidad luminosa de 1 cd. Las demás unidades se derivan: el lumen es la candela por estereorradián, el <span class="term">lux</span> es un lumen por metro cuadrado (iluminancia) y el nit, una candela por metro cuadrado (luminancia).</p>
<table>
<tr><th>Situación</th><th class="c">Iluminancia</th></tr>
<tr><td>Sol directo al mediodía</td><td class="c">~100 000 lx</td></tr>
<tr><td>Día nublado</td><td class="c">1 000 – 10 000 lx</td></tr>
<tr><td>Oficina, aula (recomendado)</td><td class="c">300 – 500 lx</td></tr>
<tr><td>Calle iluminada de noche</td><td class="c">10 – 30 lx</td></tr>
<tr><td>Luna llena</td><td class="c">~0.25 lx</td></tr>
</table>
<p>El cociente \(\Phi_v/\Phi\) es la <span class="term">eficacia luminosa de la radiación</span>. Su máximo, 683 lm/W, solo lo alcanza la luz verde de 555 nm. Una lámpara de sodio de baja presión, que emite casi todo en 589 nm, llega a 525 lm/W de radiación, pero su luz amarilla no deja distinguir colores. Una luz blanca necesita radiar en todo el visible y su eficacia está entre 250 y 400 lm/W; un LED blanco real convierte además solo una fracción de la electricidad en luz y entrega entre 100 y 200 lm/W eléctricos.</p>
<div class="sim" data-sim="eficacia" data-title="Eficacia luminosa de distintas luces"></div>
<div class="sim-guide"><ul>
<li>El área sombreada es el producto del espectro por \(V(\lambda)\): lo que el ojo aprovecha. Compare el cuerpo negro de 2700 K (un bombillo), el de 5772 K (el Sol), un LED blanco y una línea monocromática.</li>
<li>Un cuerpo negro alcanza su eficacia máxima, unos 95 lm/W, hacia 6600 K. A 2700 K solo el 8 % de su potencia cae en el visible.</li>
</ul></div>
</section>

<section>
<h2>La radiación del cuerpo negro</h2>
<p>Un <span class="term">cuerpo negro</span> absorbe toda la radiación que le llega y, en equilibrio térmico, emite un espectro que solo depende de su temperatura. Se realiza con una cavidad con un agujero pequeño. En 1900 Max Planck encontró la forma de ese espectro suponiendo que los osciladores de las paredes intercambian energía en múltiplos de \(h\nu\):</p>
<div class="eq key" data-name="Ley de Planck">\[B_\lambda(T)=\frac{2hc^2}{\lambda^5}\,\frac{1}{\ee^{hc/\lambda k_BT}-1}\qquad[\text{W m}^{-2}\,\text{sr}^{-1}\,\text{m}^{-1}].\]</div>
<p>La superficie de un cuerpo negro es lambertiana y su exitancia espectral es \(\pi B_\lambda\). De la ley de Planck salen dos resultados que se conocían antes empíricamente. El máximo del espectro está en</p>
<div class="eq">\[\lambda_{max}T=b=2.897\,772\times10^{-3}\ \text{m·K}\qquad\text{(Wien)},\]</div>
<p>y la potencia total emitida por unidad de área es</p>
<div class="eq key" data-name="Stefan–Boltzmann">\[M=\sigma T^4,\qquad\sigma=\frac{2\pi^5k_B^4}{15h^3c^2}=5.670\,374\times10^{-8}\ \text{W m}^{-2}\text{K}^{-4}.\]</div>
<p>El Sol, con una temperatura efectiva de 5772 K, tiene su máximo en 502 nm y emite el 46 % de su potencia en el visible: el ojo evolucionó para aprovechar esa luz. El cuerpo humano, a 310 K, emite unos 524 W/m² con el máximo en 9.3 µm, en el infrarrojo térmico que registran las cámaras de los termómetros sin contacto. El filamento de un bombillo de 2700 K tiene su máximo en 1.07 µm.</p>
<div class="sim" data-sim="planck" data-title="Espectro de Planck, ley de Wien y color de un cuerpo caliente"></div>
<div class="sim-guide"><ul>
<li>Al subir la temperatura el máximo se corre hacia el azul y el área bajo la curva crece como \(T^4\).</li>
<li>La muestra de color se calcula integrando el espectro con las funciones de color de la CIE: rojo oscuro a 1000 K, naranja a 2000 K, blanco cálido a 3000 K, blanco a 5500 K y azulado por encima de 8000 K.</li>
</ul></div>
<div class="box hist"><h4>La catástrofe ultravioleta</h4><p>La física clásica asigna a cada modo de la cavidad una energía \(k_BT\) y obtiene la ley de Rayleigh–Jeans, \(B_\lambda=2ck_BT/\lambda^4\), que coincide con Planck a longitudes de onda largas pero diverge en el ultravioleta: un horno emitiría energía infinita. El factor \(1/(\ee^{x}-1)\) de Planck, con \(x=hc/\lambda k_BT\), suprime los modos de alta frecuencia porque no alcanzan a excitarse ni un cuanto. Fue la primera señal de que la energía está cuantizada.</p></div>
</section>

<section>
<h2>La temperatura de color</h2>
<p>El color de un cuerpo negro recorre en el diagrama de cromaticidad de la CIE una curva, el <span class="term">lugar de Planck</span> (capítulo 10). La <span class="term">temperatura de color correlacionada</span> de una fuente es la del cuerpo negro cuyo color se le parece más. La CIE definió con ella sus iluminantes patrón: el A, de 2856 K, representa la luz de un bombillo incandescente; el D65, de unos 6504 K, la luz media del día. Una lámpara «cálida» se anuncia con 2700 a 3000 K y una «fría», con 5000 a 6500 K. La aproximación de McCamy calcula la temperatura correlacionada a partir de las coordenadas \(x,y\):</p>
<div class="eq">\[T_{cc}\approx449n^3+3525n^2+6823.3n+5520.33,\qquad n=\frac{x-0.3320}{0.1858-y}.\]</div>
</section>

<section>
<h2>Iluminación: el inverso del cuadrado y el coseno</h2>
<p>Una fuente pequeña de intensidad \(I\) produce sobre una superficie a la distancia \(r\), inclinada un ángulo \(\theta\) respecto de la dirección de la luz, una iluminancia</p>
<div class="eq key" data-name="Iluminancia">\[E=\frac{I\cos\theta}{r^2}.\]</div>
<p>Un bombillo de 800 lm que emite por igual en todas las direcciones tiene una intensidad de \(800/4\pi=63.7\) cd. A 1.5 m por debajo da 28.3 lx; a 1 m del punto que está debajo, solo 16.3 lx, porque la distancia crece y la luz llega inclinada. Para iluminar un escritorio a 500 lx con una lámpara a 0.6 m se necesitan 180 cd en la dirección del escritorio: por eso las lámparas de estudio concentran la luz con reflectores.</p>
<div class="sim" data-sim="iluminancia" data-title="Una lámpara sobre una mesa"></div>
<div class="sim-guide"><ul>
<li>Mueva la lámpara y lea la iluminancia en cada punto de la mesa. Con una fuente lambertiana (un panel que mira hacia abajo) la luz se concentra más debajo de la lámpara: \(E\propto\cos^4\theta\) en lugar de \(\cos^3\theta\).</li>
<li>La línea discontinua marca 500 lx, lo recomendado para leer.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿En qué longitud de onda emite más un cuerpo negro a 1000 °C? ¿Qué potencia emite por metro cuadrado?
<details><summary>Respuesta</summary><p>\(T=1273\) K: \(\lambda_{max}=2.28\) µm; \(M=\sigma T^4=1.49\times10^5\) W/m².</p></details></li>
<li><span class="lvl">Básico</span>Una fuente monocromática de 555 nm emite 2 W de luz. ¿Cuántos lúmenes son? ¿Y si fuera de 650 nm, con \(V=0.107\)?
<details><summary>Respuesta</summary><p>\(683\times2=1366\) lm; a 650 nm, \(683\times0.107\times2=146\) lm.</p></details></li>
<li><span class="lvl">Intermedio</span>Una lámpara de 1200 cd en la dirección vertical cuelga 2.5 m sobre el piso. ¿Qué iluminancia da justo debajo y a 2 m de ese punto, si su intensidad no depende del ángulo?
<details><summary>Respuesta</summary><p>Debajo, \(1200/2.5^2=192\) lx. A 2 m: \(r=3.20\) m, \(\cos\theta=0.781\), \(E=1200\times0.781/10.25=91.4\) lx.</p></details></li>
<li><span class="lvl">Intermedio</span>El Sol tiene un radio de \(6.957\times10^8\) m y una temperatura efectiva de 5772 K. Calcule su luminosidad y la irradiancia a 1 UA.
<details><summary>Respuesta</summary><p>\(L=4\pi R^2\sigma T^4=3.83\times10^{26}\) W; \(I=L/4\pi r^2=1361\) W/m².</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que en el límite \(hc\gg\lambda k_BT\) la ley de Planck se reduce a la de Wien, \(B_\lambda\approx(2hc^2/\lambda^5)\ee^{-hc/\lambda k_BT}\), y en el límite opuesto a la de Rayleigh–Jeans. ¿Para qué longitud de onda difiere Rayleigh–Jeans un 10 % de Planck a 300 K?
<details><summary>Respuesta</summary><p>Con \(x=hc/\lambda k_BT\): si \(x\gg1\), \(\ee^x-1\approx\ee^x\); si \(x\ll1\), \(\ee^x-1\approx x\). El cociente RJ/Planck es \((\ee^x-1)/x\approx1+x/2\); vale 1.1 para \(x=0.188\), es decir \(\lambda=hc/(0.188k_BT)=0.26\) mm.</p></details></li>
</ol>
