(function () {
  'use strict';
  const EM = window.EM, M = EM.M;
  const f2 = (v) => EM.fix(v, 2);

  /* Dibuja ejes del plano complejo centrados en (cx, cy) */
  function complexAxes(ctx, cx, cy, R, labels) {
    const lb = labels || ['Re', 'Im'];
    ctx.save();
    ctx.strokeStyle = EM.col('--grid-2');
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy);
    ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy + R);
    ctx.stroke();
    ctx.restore();
    EM.text(ctx, lb[0], cx + R - 4, cy + 14, { size: 11, color: '--ink-3', align: 'right' });
    EM.text(ctx, lb[1], cx + 6, cy - R + 12, { size: 11, color: '--ink-3' });
  }
  EM.complexAxes = complexAxes;

  /* ======================================================================
     1.2 Fórmula de Euler
     ====================================================================== */
  EM.defineSim('euler-circle', function (sim) {
    const cv = sim.canvas({ aspect: 2.2 });
    sim.group('Exponente');
    sim.slider('w', { label: 'Frecuencia angular <i>ω</i>', min: 0.2, max: 4, step: 0.05, value: 1, unit: 'rad/s', fmt: f2 });
    sim.slider('s', { label: 'Parte real <i>σ</i>', min: -0.5, max: 0.2, step: 0.01, value: 0, unit: 's⁻¹', fmt: f2 });
    sim.check('der', { label: 'Mostrar la derivada <i>dz/dt</i>', value: false });
    sim.check('sin', { label: 'Mostrar también la parte imaginaria', value: true });
    sim.resetButton(() => { t = 0; });
    sim.out('t', 'Tiempo <i>t</i>');
    sim.out('z', '<i>z</i> = e<sup>(σ+iω)t</sup>', { hl: true });
    sim.out('r', 'Módulo |<i>z</i>|');
    sim.out('th', 'Argumento <i>ωt</i> (mód 2π)');
    let t = 0;
    sim.animate((dt) => { t += dt; if (Math.exp(sim.p.s * t) < 0.02 || Math.exp(sim.p.s * t) > 3) t = 0; });
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, w = cv.w, h = cv.h;
      EM.draw.clear(cv);
      const R = Math.min(h * 0.36, w * 0.17), cx = R * 1.35, cy = h / 2;
      complexAxes(ctx, cx, cy, R * 1.3);
      ctx.strokeStyle = EM.col('--grid-2');
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, 2 * Math.PI); ctx.stroke();
      const z = (tt) => { const r = Math.exp(p.s * tt); return [r * Math.cos(p.w * tt), r * Math.sin(p.w * tt)]; };
      /* trayectoria pasada */
      const tr = [];
      for (let k = 0; k <= 200; k++) { const tt = (t * k) / 200; const q = z(tt); tr.push([cx + q[0] * R, cy - q[1] * R]); }
      EM.draw.poly(ctx, tr, { color: '--c5', width: 1.3, alpha: 0.5 });
      const q = z(t), P = [cx + q[0] * R, cy - q[1] * R];
      EM.draw.arrow(ctx, cx, cy, P[0], P[1], { color: '--accent', width: 2.6 });
      /* proyecciones */
      ctx.save(); ctx.setLineDash([4, 4]); ctx.strokeStyle = EM.col('--ink-3');
      ctx.beginPath(); ctx.moveTo(P[0], P[1]); ctx.lineTo(P[0], cy); ctx.stroke();
      ctx.restore();
      if (p.der) {
        const d = [p.s * q[0] - p.w * q[1], p.s * q[1] + p.w * q[0]];
        const sc = R * 0.45;
        EM.draw.arrow(ctx, P[0], P[1], P[0] + d[0] * sc, P[1] - d[1] * sc, { color: '--c3', width: 2 });
        EM.text(ctx, 'dz/dt', P[0] + d[0] * sc + 4, P[1] - d[1] * sc - 4, { size: 12, color: '--c3', halo: true });
      }
      /* gráfica temporal */
      const x0 = cx + R * 1.5;
      const pl = new EM.Plot(ctx, { x: x0, y: 0, w: w - x0, h, xmin: 0, xmax: 4 * Math.PI, ymin: -1.3, ymax: 1.3, xpi: true, xlabel: 'fase ωt (rad)', ml: 40 });
      pl.frame();
      const ph = p.w * t;
      const off = Math.max(0, ph - 4 * Math.PI);
      const fx = (u) => Math.exp((p.s * (u + off)) / p.w) * Math.cos(u + off);
      const fy = (u) => Math.exp((p.s * (u + off)) / p.w) * Math.sin(u + off);
      pl.fn(fx, { color: '--accent', width: 2, to: ph - off });
      if (p.sin) pl.fn(fy, { color: '--c1', width: 1.6, dash: [5, 3], to: ph - off });
      pl.dot(ph - off, q[0], { color: '--accent' });
      if (p.sin) pl.dot(ph - off, q[1], { color: '--c1' });
      pl.legend([{ label: 'Re z = e^{σt} cos ωt', color: '--accent' }].concat(p.sin ? [{ label: 'Im z = e^{σt} sen ωt', color: '--c1', dash: [5, 3] }] : []), 'tr');
      sim.set('t', EM.fix(t, 2) + ' s');
      sim.set('z', EM.fix(q[0], 3) + (q[1] < 0 ? ' − ' : ' + ') + EM.fix(Math.abs(q[1]), 3) + ' i');
      sim.set('r', EM.fix(Math.hypot(q[0], q[1]), 3));
      sim.set('th', EM.fix(M.wrap2pi(ph), 3) + ' rad = ' + EM.fix(M.deg(M.wrap2pi(ph)), 1) + '°');
    });
  });

  /* ======================================================================
     1.3 Suma de fasores
     ====================================================================== */
  EM.defineSim('phasor-sum', function (sim) {
    const cv = sim.canvas({ aspect: 2.2 });
    sim.group('Fasor 1');
    sim.slider('A1', { label: '<i>A</i><sub>1</sub>', min: 0, max: 2, step: 0.05, value: 1, fmt: f2 });
    sim.slider('p1', { label: '<i>φ</i><sub>1</sub>', min: -180, max: 180, step: 1, value: 0, unit: '°', fmt: (v) => v.toFixed(0) });
    sim.group('Fasor 2');
    sim.slider('A2', { label: '<i>A</i><sub>2</sub>', min: 0, max: 2, step: 0.05, value: 0.8, fmt: f2 });
    sim.slider('p2', { label: '<i>φ</i><sub>2</sub>', min: -180, max: 180, step: 1, value: 60, unit: '°', fmt: (v) => v.toFixed(0) });
    sim.group('Fasor 3');
    sim.check('on3', { label: 'Incluir un tercer fasor', value: false });
    sim.slider('A3', { label: '<i>A</i><sub>3</sub>', min: 0, max: 2, step: 0.05, value: 1, fmt: f2 });
    sim.slider('p3', { label: '<i>φ</i><sub>3</sub>', min: -180, max: 180, step: 1, value: -120, unit: '°', fmt: (v) => v.toFixed(0) });
    sim.out('A', 'Amplitud resultante <i>A</i>', { hl: true });
    sim.out('phi', 'Fase resultante <i>φ</i>');
    sim.out('frm', '<i>A</i>² por la fórmula de dos fasores');
    let t = 0;
    sim.animate((dt) => { t += dt * 1.2; });
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, w = cv.w, h = cv.h;
      EM.draw.clear(cv);
      const list = [[p.A1, p.p1, '--c1'], [p.A2, p.p2, '--c2']];
      if (p.on3) list.push([p.A3, p.p3, '--c3']);
      const R = Math.min(h * 0.2, w * 0.09), cx = w * 0.2, cy = h / 2;
      complexAxes(ctx, cx, cy, R * 3.2);
      let x = 0, y = 0;
      const pts = [];
      list.forEach(([A, ph, col]) => {
        const a = M.rad(ph) + t;
        const nx = x + A * Math.cos(a), ny = y + A * Math.sin(a);
        EM.draw.arrow(ctx, cx + x * R, cy - y * R, cx + nx * R, cy - ny * R, { color: col, width: 2.2 });
        x = nx; y = ny;
        pts.push(A * Math.cos(a));
      });
      EM.draw.arrow(ctx, cx, cy, cx + x * R, cy - y * R, { color: '--accent', width: 3 });
      ctx.save(); ctx.setLineDash([3, 3]); ctx.strokeStyle = EM.col('--ink-3');
      ctx.beginPath(); ctx.moveTo(cx + x * R, cy - y * R); ctx.lineTo(cx + x * R, cy); ctx.stroke(); ctx.restore();
      /* señales en el tiempo */
      const x0 = w * 0.42;
      const pl = new EM.Plot(ctx, { x: x0, y: 0, w: w - x0, h, xmin: 0, xmax: 4 * Math.PI, ymin: -4.2, ymax: 4.2, xpi: true, xlabel: 'ωt (rad)', ml: 40 });
      pl.frame();
      list.forEach(([A, ph, col]) => pl.fn((u) => A * Math.cos(u + M.rad(ph)), { color: col, width: 1.4, alpha: 0.8 }));
      const tot = (u) => list.reduce((s, [A, ph]) => s + A * Math.cos(u + M.rad(ph)), 0);
      pl.fn(tot, { color: '--accent', width: 2.6 });
      const u0 = M.wrap2pi(t);
      pl.vline(u0, { color: '--ink-3' });
      let X = 0, Y = 0;
      list.forEach(([A, ph]) => { X += A * Math.cos(M.rad(ph)); Y += A * Math.sin(M.rad(ph)); });
      sim.set('A', EM.fix(Math.hypot(X, Y), 3));
      sim.set('phi', Math.hypot(X, Y) < 1e-9 ? '— (amplitud nula)' : EM.fix(M.deg(Math.atan2(Y, X)), 1) + '°');
      const f2s = p.A1 * p.A1 + p.A2 * p.A2 + 2 * p.A1 * p.A2 * Math.cos(M.rad(p.p2 - p.p1));
      sim.set('frm', p.on3 ? '— (hay tres fasores)' : EM.fix(f2s, 3));
      sim.ctl.A3.show(p.on3); sim.ctl.p3.show(p.on3);
    });
  });

  /* ======================================================================
     1.4 Raíces de la ecuación característica
     ====================================================================== */
  EM.defineSim('char-roots', function (sim) {
    sim.cols2();
    const cr = sim.canvas({ aspect: 1.1 });
    const cs = sim.canvas({ aspect: 1.1 });
    sim.group('Coeficientes');
    sim.slider('g', { label: 'Coeficiente <i>γ</i>', min: -0.6, max: 6, step: 0.02, value: 0.4, unit: 's⁻¹', fmt: f2 });
    sim.slider('w2', { label: '<i>ω</i><sub>0</sub>²', min: -2, max: 4, step: 0.02, value: 1, unit: 's⁻²', fmt: f2 });
    sim.group('Condiciones iniciales');
    sim.slider('x0', { label: '<i>x</i>(0)', min: -1, max: 1, step: 0.05, value: 1, fmt: f2 });
    sim.slider('v0', { label: '<i>ẋ</i>(0)', min: -2, max: 2, step: 0.05, value: 0, fmt: f2 });
    sim.out('s1', 'Raíz <i>s</i><sub>+</sub>', { hl: true });
    sim.out('s2', 'Raíz <i>s</i><sub>−</sub>');
    sim.out('kind', 'Comportamiento');
    sim.onDraw(() => {
      const p = sim.p;
      const disc = (p.g * p.g) / 4 - p.w2;
      let r1, r2;
      if (disc >= 0) { r1 = [-p.g / 2 + Math.sqrt(disc), 0]; r2 = [-p.g / 2 - Math.sqrt(disc), 0]; }
      else { r1 = [-p.g / 2, Math.sqrt(-disc)]; r2 = [-p.g / 2, -Math.sqrt(-disc)]; }
      /* plano s */
      EM.draw.clear(cr);
      const pl = new EM.Plot(cr.ctx, { x: 0, y: 0, w: cr.w, h: cr.h, xmin: -4, xmax: 2, ymin: -2.5, ymax: 2.5, xlabel: 'Re s (s⁻¹)', ylabel: 'Im s (s⁻¹)', ml: 52 });
      pl.frame();
      pl.band(0, 2, { color: '--warn-ink', alpha: 0.07 });
      pl.label(0.15, 2.2, 'inestable', { color: '--warn-ink', size: 11 });
      if (p.w2 > 0) { const R = Math.sqrt(p.w2); pl.fn((x) => Math.sqrt(Math.max(0, R * R - x * x)), { from: -R, to: 0, color: '--grid-2', width: 1, dash: [3, 3] }); pl.fn((x) => -Math.sqrt(Math.max(0, R * R - x * x)), { from: -R, to: 0, color: '--grid-2', width: 1, dash: [3, 3] }); }
      pl.dot(r1[0], r1[1], { color: '--accent', r: 6, label: 's₊' });
      pl.dot(r2[0], r2[1], { color: '--c1', r: 6, label: 's₋', dy: 14 });
      /* solución */
      let x;
      if (Math.abs(disc) < 1e-9) { const a = -p.g / 2; x = (t) => (p.x0 + (p.v0 - a * p.x0) * t) * Math.exp(a * t); }
      else if (disc > 0) { const a = r1[0], b = r2[0]; const c2 = (p.v0 - a * p.x0) / (b - a), c1 = p.x0 - c2; x = (t) => c1 * Math.exp(a * t) + c2 * Math.exp(b * t); }
      else { const a = r1[0], wd = r1[1]; x = (t) => Math.exp(a * t) * (p.x0 * Math.cos(wd * t) + ((p.v0 - a * p.x0) / wd) * Math.sin(wd * t)); }
      EM.draw.clear(cs);
      const ps = new EM.Plot(cs.ctx, { x: 0, y: 0, w: cs.w, h: cs.h, xmin: 0, xmax: 20, ymin: -2, ymax: 2, xlabel: 't (s)', ylabel: 'x(t)', ml: 52 });
      ps.frame();
      ps.fn(x, { color: '--accent', width: 2.2 });
      if (disc < 0 && p.g > 0) { ps.fn((t) => Math.hypot(p.x0, (p.v0 - r1[0] * p.x0) / r1[1]) * Math.exp(r1[0] * t), { color: '--ink-3', width: 1, dash: [4, 4] }); }
      const fmt = (r) => EM.fix(r[0], 3) + (Math.abs(r[1]) < 1e-12 ? '' : (r[1] < 0 ? ' − ' : ' + ') + EM.fix(Math.abs(r[1]), 3) + ' i');
      sim.set('s1', fmt(r1) + ' s⁻¹');
      sim.set('s2', fmt(r2) + ' s⁻¹');
      let kind;
      if (Math.max(r1[0], r2[0]) > 1e-9) kind = 'crece sin límite (inestable)';
      else if (disc < 0 && Math.abs(p.g) < 1e-9) kind = 'oscila sin perder amplitud';
      else if (disc < 0) kind = 'oscilación amortiguada (subamortiguado)';
      else if (Math.abs(disc) < 1e-9) kind = 'amortiguamiento crítico';
      else kind = 'decae sin oscilar (sobreamortiguado)';
      sim.set('kind', kind);
    });
  });
})();

/* ==== chapters/02-mas.js ==== */
/* Capítulo 2 — Movimiento armónico simple */
(function () {
  'use strict';
  const EM = window.EM, M = EM.M;
  const f2 = (v) => EM.fix(v, 2);

  /* ======================================================================
     2.1 Masa y resorte
     ====================================================================== */
  EM.defineSim('mass-spring', function (sim) {
    const cv = sim.canvas({ aspect: 3.2, cls: 'fixed' });
    const cp = sim.canvas({ aspect: 2.1 });
    sim.group('Oscilador');
    sim.slider('m', { label: 'Masa <i>m</i>', min: 0.1, max: 4, step: 0.05, value: 1, unit: 'kg', fmt: f2 });
    sim.slider('k', { label: 'Constante <i>k</i>', min: 5, max: 200, step: 1, value: 40, unit: 'N/m', fmt: (v) => v.toFixed(0) });
    sim.seg('ori', { label: 'Montaje', options: [['h', 'Horizontal'], ['v', 'Vertical']], value: 'h' });
    sim.group('Condiciones iniciales');
    sim.slider('x0', { label: 'Posición <i>x</i><sub>0</sub>', min: -0.2, max: 0.2, step: 0.005, value: 0.15, unit: 'm', fmt: (v) => EM.fix(v, 3) });
    sim.slider('v0', { label: 'Velocidad <i>v</i><sub>0</sub>', min: -2, max: 2, step: 0.02, value: 0, unit: 'm/s', fmt: f2 });
    sim.resetButton(() => { t = 0; });
    sim.out('w', 'Frecuencia angular <i>ω</i><sub>0</sub>');
    sim.out('T', 'Período <i>T</i>', { hl: true });
    sim.out('A', 'Amplitud <i>A</i>');
    sim.out('phi', 'Fase inicial <i>φ</i>');
    sim.out('eq', 'Estiramiento de equilibrio <i>mg</i>/<i>k</i>');
    sim.out('vm', 'Velocidad máxima <i>ω</i><sub>0</sub><i>A</i>');
    let t = 0;
    sim.onChange = (id) => { if (id !== 'ori') t = 0; };
    sim.animate((dt) => { t += dt; });
    sim.onDraw(() => {
      const p = sim.p, w = Math.sqrt(p.k / p.m);
      const A = Math.hypot(p.x0, p.v0 / w), phi = Math.atan2(-p.v0 / w, p.x0);
      const x = (tt) => A * Math.cos(w * tt + phi);
      const xs = x(t);
      /* esquema */
      EM.draw.clear(cv);
      const ctx = cv.ctx, W = cv.w, H = cv.h;
      const sc = (W * 0.32) / 0.25;
      if (p.ori === 'h') {
        const xw = 30, xe = W * 0.5, y = H * 0.55;
        EM.draw.support(ctx, xw, y, H * 0.6, 'right');
        ctx.strokeStyle = EM.col('--ink-3'); ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(xw, y + 22); ctx.lineTo(W - 20, y + 22); ctx.stroke();
        const bx = xe + xs * sc;
        EM.draw.spring(ctx, xw, y, bx - 22, y, { coils: 12, r: 9 });
        EM.draw.block(ctx, bx, y, 44, 44, { label: 'm', italic: true });
        ctx.save(); ctx.setLineDash([4, 4]); ctx.strokeStyle = EM.col('--ink-3');
        ctx.beginPath(); ctx.moveTo(xe, 10); ctx.lineTo(xe, y + 30); ctx.stroke(); ctx.restore();
        EM.text(ctx, 'x = 0', xe, 14, { size: 11, color: '--ink-3', align: 'center' });
        for (const s of [-1, 1]) { const xa = xe + s * A * sc; ctx.fillStyle = EM.alpha('--accent', 0.5); ctx.fillRect(xa - 1, y + 24, 2, 10); }
        EM.text(ctx, '−A', xe - A * sc, y + 46, { size: 11, color: '--accent', align: 'center' });
        EM.text(ctx, '+A', xe + A * sc, y + 46, { size: 11, color: '--accent', align: 'center' });
      } else {
        /* vertical: girado, resorte cuelga del techo a la izquierda del dibujo */
        const cx = W * 0.5, top = 8;
        const g = 9.81, d = (p.m * g) / p.k;
        const scv = (H * 0.45) / 0.35;
        const y0 = top + H * 0.38 + Math.min(d, 0.25) * scv * 0.4;
        const by = y0 - xs * scv * 0.55;
        EM.draw.support(ctx, cx, top + 4, 70, 'down');
        EM.draw.spring(ctx, cx, top + 4, cx, by - 16, { coils: 10, r: 8 });
        EM.draw.block(ctx, cx, by, 40, 32, { label: 'm', italic: true });
        ctx.save(); ctx.setLineDash([4, 4]); ctx.strokeStyle = EM.col('--ink-3');
        ctx.beginPath(); ctx.moveTo(cx + 30, y0); ctx.lineTo(cx + 110, y0); ctx.stroke(); ctx.restore();
        EM.text(ctx, 'equilibrio (estirado mg/k)', cx + 114, y0 + 4, { size: 11, color: '--ink-3' });
        EM.text(ctx, 'x positivo hacia arriba', 16, H - 10, { size: 11, color: '--ink-3' });
      }
      /* gráficas */
      EM.draw.clear(cp);
      const c2 = cp.ctx, hh = cp.h / 3;
      const span = Math.max(3 * (2 * Math.PI) / w, 2);
      const t0 = Math.max(0, t - span * 0.75);
      const vmax = w * A || 1, amax = w * w * A || 1;
      const rows = [['x (m)', (tt) => x(tt), Math.max(A, 0.01) * 1.25, '--accent'], ['v (m/s)', (tt) => -w * A * Math.sin(w * tt + phi), vmax * 1.25, '--c1'], ['a (m/s²)', (tt) => -w * w * x(tt), amax * 1.25, '--c3']];
      rows.forEach(([lab, f, ym, col], i) => {
        const pl = new EM.Plot(c2, { x: 0, y: i * hh, w: cp.w, h: hh, xmin: t0, xmax: t0 + span, ymin: -ym, ymax: ym, ylabel: lab, xlabel: i === 2 ? 't (s)' : '', mb: i === 2 ? 34 : 8, mt: 8, ml: 58 });
        pl.frame();
        pl.fn(f, { color: col, width: 2, to: t });
        pl.dot(t, f(t), { color: col });
      });
      sim.set('w', EM.fix(w, 3) + ' rad/s');
      sim.set('T', EM.fix((2 * Math.PI) / w, 3) + ' s');
      sim.set('A', EM.si(A, 'm'));
      sim.set('phi', EM.fix(phi, 3) + ' rad = ' + EM.fix(M.deg(phi), 1) + '°');
      sim.set('eq', p.ori === 'v' ? EM.si((p.m * 9.81) / p.k, 'm') : '— (horizontal)');
      sim.set('vm', EM.fix(w * A, 3) + ' m/s');
    });
  });

     2.2 Círculo de referencia

  EM.defineSim('shm-circle', function (sim) {
    const cv = sim.canvas({ aspect: 2.3 });
    sim.slider('w', { label: 'Frecuencia angular <i>ω</i><sub>0</sub>', min: 0.3, max: 4, step: 0.05, value: 1.2, unit: 'rad/s', fmt: f2 });
    sim.slider('phi', { label: 'Fase inicial <i>φ</i>', min: -180, max: 180, step: 5, value: 0, unit: '°', fmt: (v) => v.toFixed(0) });
    sim.check('vel', { label: 'Velocidad del punto (tangente)', value: true });
    sim.check('acc', { label: 'Aceleración centrípeta', value: false });
    sim.out('x', '<i>x</i> = <i>A</i> cos(<i>ω</i><sub>0</sub><i>t</i> + <i>φ</i>)', { hl: true });
    sim.out('v', '<i>v<sub>x</sub></i>');
    sim.out('a', '<i>a<sub>x</sub></i> = −<i>ω</i><sub>0</sub>²<i>x</i>');
    let t = 0;
    sim.onChange = () => { t = 0; };
    sim.animate((dt) => { t += dt; });
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, W = cv.w, H = cv.h;
      EM.draw.clear(cv);
      const R = H * 0.32, cx = W * 0.3, cy = H * 0.42;
      const th = p.w * t + M.rad(p.phi);
      ctx.strokeStyle = EM.col('--grid-2'); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, 2 * Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx - R * 1.3, cy); ctx.lineTo(cx + R * 1.3, cy); ctx.stroke();
      const Px = cx + R * Math.cos(th), Py = cy - R * Math.sin(th);
      ctx.strokeStyle = EM.col('--ink-3'); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(Px, Py); ctx.stroke();
      ctx.save(); ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(Px, Py); ctx.lineTo(Px, H * 0.88); ctx.stroke(); ctx.restore();
      if (p.vel) {
        const s = R * 0.6;
        EM.draw.arrow(ctx, Px, Py, Px - s * Math.sin(th), Py - s * Math.cos(th), { color: '--c1', width: 2 });
        EM.draw.arrow(ctx, Px, H * 0.88, Px - s * Math.sin(th), H * 0.88, { color: '--c1', width: 2.4 });
      }
      if (p.acc) {
        const s = R * 0.5;
        EM.draw.arrow(ctx, Px, Py, Px - s * Math.cos(th), Py + s * Math.sin(th), { color: '--c3', width: 2 });
        EM.draw.arrow(ctx, Px, H * 0.88 + 8, Px - s * Math.cos(th), H * 0.88 + 8, { color: '--c3', width: 2.4 });
      }
      EM.draw.bob(ctx, Px, Py, 7, { color: '--c5' });
      /* eje del oscilador */
      ctx.strokeStyle = EM.col('--ink-2'); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(cx - R * 1.2, H * 0.88); ctx.lineTo(cx + R * 1.2, H * 0.88); ctx.stroke();
      EM.draw.block(ctx, Px, H * 0.88, 18, 14, { fill: '--accent' });
      /* gráfica x(t) vertical a la derecha */
      const x0 = W * 0.56;
      const pl = new EM.Plot(ctx, { x: x0, y: 0, w: W - x0, h: H, xmin: 0, xmax: 4 * Math.PI, ymin: -1.3, ymax: 1.3, xpi: true, xlabel: 'fase ω₀t + φ', ylabel: 'x/A', ml: 52 });
      pl.frame();
      const ph = th - M.rad(p.phi);
      const off = Math.max(0, ph - 4 * Math.PI);
      pl.fn((u) => Math.cos(u + off + M.rad(p.phi)), { color: '--accent', width: 2.2, to: ph - off });
      if (p.vel) pl.fn((u) => -Math.sin(u + off + M.rad(p.phi)), { color: '--c1', width: 1.4, dash: [5, 3], to: ph - off });
      if (p.acc) pl.fn((u) => -Math.cos(u + off + M.rad(p.phi)), { color: '--c3', width: 1.4, dash: [2, 3], to: ph - off });
      pl.dot(ph - off, Math.cos(th), { color: '--accent' });
      sim.set('x', EM.fix(Math.cos(th), 3) + ' <i>A</i>');
      sim.set('v', EM.fix(-Math.sin(th), 3) + ' <i>ω</i><sub>0</sub><i>A</i>');
      sim.set('a', EM.fix(-Math.cos(th), 3) + ' <i>ω</i><sub>0</sub>²<i>A</i>');
    });
  });

  /* ======================================================================
     2.3 Energía
     ====================================================================== */
  EM.defineSim('shm-energy', function (sim) {
    const cv = sim.canvas({ aspect: 2.2 });
    sim.slider('k', { label: 'Constante <i>k</i>', min: 5, max: 100, step: 1, value: 20, unit: 'N/m', fmt: (v) => v.toFixed(0) });
    sim.slider('m', { label: 'Masa <i>m</i>', min: 0.2, max: 3, step: 0.05, value: 0.5, unit: 'kg', fmt: f2 });
    sim.slider('A', { label: 'Amplitud <i>A</i>', min: 0.02, max: 0.3, step: 0.005, value: 0.2, unit: 'm', fmt: (v) => EM.fix(v, 3) });
    sim.check('hist', { label: 'Histograma de posiciones', value: true });
    sim.resetButton(() => { t = 0; hist.fill(0); });
    sim.out('E', 'Energía total ½<i>kA</i>²', { hl: true });
    sim.out('K', 'Cinética <i>K</i>');
    sim.out('U', 'Potencial <i>U</i>');
    sim.out('avg', '⟨<i>K</i>⟩ / ⟨<i>U</i>⟩ acumulados');
    const NB = 40, hist = new Float64Array(NB);
    let t = 0, sK = 0, sU = 0;
    sim.onChange = () => { hist.fill(0); sK = 0; sU = 0; };
    sim.animate((dt) => {
      const p = sim.p, w = Math.sqrt(p.k / p.m);
      const n = 20;
      for (let i = 0; i < n; i++) {
        t += dt / n;
        const x = p.A * Math.cos(w * t), v = -w * p.A * Math.sin(w * t);
        const b = Math.min(NB - 1, Math.floor(((x / p.A + 1) / 2) * NB));
        hist[b] += 1;
        sK += 0.5 * p.m * v * v; sU += 0.5 * p.k * x * x;
      }
    });
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, W = cv.w, H = cv.h, w = Math.sqrt(p.k / p.m);
      const x = p.A * Math.cos(w * t), v = -w * p.A * Math.sin(w * t);
      const E = 0.5 * p.k * p.A * p.A, U = 0.5 * p.k * x * x, K = E - U;
      EM.draw.clear(cv);
      const pw = W * 0.7;
      const Emax = 0.5 * 100 * 0.09;
      const ymax = Math.max(E * 1.4, 0.05);
      const pl = new EM.Plot(ctx, { x: 0, y: 0, w: pw, h: H, xmin: -0.32, xmax: 0.32, ymin: 0, ymax, xlabel: 'x (m)', ylabel: 'energía (J)', ml: 56 });
      pl.frame();
      if (p.hist) {
        const mx = Math.max(1, ...hist);
        for (let b = 0; b < NB; b++) {
          const xa = -p.A + (2 * p.A * b) / NB, xb = xa + (2 * p.A) / NB;
          const hgt = (hist[b] / mx) * ymax * 0.55;
          ctx.fillStyle = EM.alpha('--c5', 0.18);
          ctx.fillRect(pl.X(xa), pl.Y(hgt), pl.X(xb) - pl.X(xa) - 1, pl.Y(0) - pl.Y(hgt));
        }
      }
      pl.fn((xx) => 0.5 * p.k * xx * xx, { color: '--ink-2', width: 2 });
      pl.hline(E, { color: '--accent', dash: [], width: 1.6, label: 'E', labelRight: true });
      ctx.strokeStyle = EM.col('--c1'); ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(pl.X(x), pl.Y(U)); ctx.lineTo(pl.X(x), pl.Y(E)); ctx.stroke();
      ctx.strokeStyle = EM.col('--c3');
      ctx.beginPath(); ctx.moveTo(pl.X(x), pl.Y(0)); ctx.lineTo(pl.X(x), pl.Y(U)); ctx.stroke();
      pl.dot(x, U, { color: '--accent', r: 6 });
      pl.vline(-p.A, { color: '--accent', alpha: 0.5 });
      pl.vline(p.A, { color: '--accent', alpha: 0.5 });
      /* barras */
      const bx = pw + 30, bw = (W - pw - 60) / 2, by = H - 40, bh = H - 80;
      const bars = [['K', K, '--c1'], ['U', U, '--c3']];
      bars.forEach(([n, val, col], i) => {
        const h = (val / E) * bh;
        ctx.fillStyle = EM.alpha(col, 0.85);
        ctx.fillRect(bx + i * (bw + 10), by - h, bw, h);
        ctx.strokeStyle = EM.col('--rule-strong'); ctx.strokeRect(bx + i * (bw + 10) + 0.5, by - bh + 0.5, bw, bh);
        EM.text(ctx, n, bx + i * (bw + 10) + bw / 2, by + 18, { size: 13, italic: true, family: EM.FONT_MATH, align: 'center', color: col });
      });
      EM.text(ctx, 'fracción de E', bx + bw + 5, 22, { size: 11, color: '--ink-3', align: 'center' });
      void Emax; void v;
      sim.set('E', EM.si(E, 'J'));
      sim.set('K', EM.si(K, 'J') + ' (' + EM.fix((100 * K) / E, 0) + ' %)');
      sim.set('U', EM.si(U, 'J') + ' (' + EM.fix((100 * U) / E, 0) + ' %)');
      sim.set('avg', sU > 0 ? EM.fix(sK / sU, 3) : '—');
    });
  });

  /* ======================================================================
     2.4 Espacio de fases
     ====================================================================== */
  EM.defineSim('phase-space', function (sim) {
    sim.cols2();
    const cv = sim.canvas({ aspect: 1.05 });
    const cx = sim.canvas({ aspect: 1.05 });
    sim.slider('w', { label: 'Frecuencia <i>ω</i><sub>0</sub>', min: 0.3, max: 2, step: 0.05, value: 1, unit: 'rad/s', fmt: f2 });
    sim.check('cloud', { label: 'Lanzar una nube de estados', value: false, onInput: () => seed() });
    sim.button('Borrar osciladores', () => { pts.length = 0; });
    sim.out('n', 'Osciladores');
    sim.out('area', 'Área de la nube (relativa)', { hl: true });
    sim.hint('Haz clic en el plano para añadir un oscilador', cv);
    const pts = [];
    let cloud = [];
    const L = 2.2;
    const seed = () => {
      cloud = [];
      if (sim.p.cloud) for (let i = 0; i < 16; i++) for (let j = 0; j < 8; j++) cloud.push([1.0 + 0.4 * (i / 15), 0.2 + 0.4 * (j / 7)]);
    };
    const pl = () => new EM.Plot(cv.ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: -L, xmax: L, ymin: -L, ymax: L, xlabel: 'x', ylabel: 'v / ω₀', ml: 52 });
    EM.pointer(cv, {
      down: (x, y) => { const P = pl(); if (!P.inside(x, y)) return null; pts.push([P.invX(x), P.invY(y)]); if (pts.length > 12) pts.shift(); sim.redraw(); return null; },
      hover: () => 'crosshair'
    });
    pts.push([1.5, 0], [0.6, 0.6]);
    sim.animate((dt) => {
      const a = sim.p.w * dt, c = Math.cos(a), s = Math.sin(a);
      /* rotación horaria en (x, v/ω) */
      const rot = (q) => { const x = q[0] * c + q[1] * s, y = -q[0] * s + q[1] * c; q[0] = x; q[1] = y; };
      pts.forEach(rot); cloud.forEach(rot);
    });
    const cols = ['--c1', '--c2', '--c3', '--c4', '--c5', '--accent'];
    sim.onDraw(() => {
      EM.draw.clear(cv);
      const P = pl();
      P.frame();
      for (const r of [0.5, 1, 1.5, 2]) P.path(EM.M.linspace(0, 2 * Math.PI, 120).map((a) => [r * Math.cos(a), r * Math.sin(a)]), { color: '--grid-2', width: 1 });
      pts.forEach((q, i) => {
        const r = Math.hypot(q[0], q[1]);
        P.path(EM.M.linspace(0, 2 * Math.PI, 160).map((a) => [r * Math.cos(a), r * Math.sin(a)]), { color: cols[i % cols.length], width: 1.4, alpha: 0.7 });
        P.dot(q[0], q[1], { color: cols[i % cols.length], r: 5.5 });
      });
      cloud.forEach((q) => P.dot(q[0], q[1], { color: '--accent', r: 2.4 }));
      /* gráfica x(t) de cada oscilador */
      EM.draw.clear(cx);
      const pp = new EM.Plot(cx.ctx, { x: 0, y: 0, w: cx.w, h: cx.h, xmin: 0, xmax: 4 * Math.PI, ymin: -L, ymax: L, xpi: true, xlabel: 'ω₀ × (tiempo futuro)', ylabel: 'x', ml: 52 });
      pp.frame();
      pts.forEach((q, i) => {
        const r = Math.hypot(q[0], q[1]), ph = Math.atan2(q[1], q[0]);
        pp.fn((u) => r * Math.cos(u + ph), { color: cols[i % cols.length], width: 1.8 });
      });
      sim.set('n', String(pts.length) + (cloud.length ? ' + nube de ' + cloud.length : ''));
      if (cloud.length) {
        /* área por el método del jacobiano: la rotación conserva distancias, así que el área es la inicial */
        const a = Math.abs((cloud[cloud.length - 1][0] - cloud[0][0]) * (cloud[7][1] - cloud[0][1]) - (cloud[cloud.length - 1][1] - cloud[0][1]) * (cloud[7][0] - cloud[0][0]));
        sim.set('area', EM.fix(a / 0.16, 4));
      } else sim.set('area', '— (active la nube)');
    });
  });

  /* ======================================================================
     2.5 Zoológico de osciladores
     ====================================================================== */
  EM.defineSim('oscillator-zoo', function (sim) {
    const cv = sim.canvas({ aspect: 2.4, cls: 'fixed' });
    const SYS = {
      par: { n: 'Resortes en paralelo', p: [['a', 'k₁ (N/m)', 10, 500, 100], ['b', 'k₂ (N/m)', 10, 500, 50], ['c', 'm (kg)', 0.1, 5, 1]], w: (a, b, c) => Math.sqrt((a + b) / c) },
      ser: { n: 'Resortes en serie', p: [['a', 'k₁ (N/m)', 10, 500, 100], ['b', 'k₂ (N/m)', 10, 500, 50], ['c', 'm (kg)', 0.1, 5, 1]], w: (a, b, c) => Math.sqrt((a * b) / ((a + b) * c)) },
      pend: { n: 'Péndulo simple', p: [['a', 'ℓ (m)', 0.05, 5, 1], ['b', 'g (m/s²)', 1, 25, 9.81]], w: (a, b) => Math.sqrt(b / a) },
      utube: { n: 'Líquido en tubo en U', p: [['a', 'L total (m)', 0.1, 3, 0.6], ['b', 'g (m/s²)', 1, 25, 9.81]], w: (a, b) => Math.sqrt((2 * b) / a) },
      float: { n: 'Flotador cilíndrico', p: [['a', 'ρ cuerpo (kg/m³)', 50, 990, 600], ['b', 'altura h (m)', 0.02, 1, 0.2], ['c', 'ρ líquido (kg/m³)', 600, 13600, 1000]], w: (a, b, c) => Math.sqrt((c * 9.81) / (a * b)) },
      lc: { n: 'Circuito LC', p: [['a', 'L (mH)', 0.01, 1000, 10], ['b', 'C (µF)', 0.001, 1000, 1]], w: (a, b) => 1 / Math.sqrt(a * 1e-3 * b * 1e-6), log: true },
      tors: { n: 'Péndulo de torsión (disco)', p: [['a', 'κ (mN·m/rad)', 0.1, 100, 5], ['b', 'masa del disco (kg)', 0.05, 5, 0.5], ['c', 'radio (cm)', 1, 30, 10]], w: (a, b, c) => Math.sqrt((a * 1e-3) / (0.5 * b * (c / 100) ** 2)) },
      wire: { n: 'Masa en el centro de un hilo tenso', p: [['a', 'tensión T (N)', 1, 500, 50], ['b', 'longitud L (m)', 0.1, 3, 1], ['c', 'm (kg)', 0.01, 2, 0.1]], w: (a, b, c) => Math.sqrt((4 * a) / (b * c)) }
    };
    sim.group('Sistema');
    sim.select('sys', { options: Object.keys(SYS).map((k) => [k, SYS[k].n]), value: 'par', onInput: () => config() });
    sim.group('Parámetros');
    const ctl = {};
    ['a', 'b', 'c'].forEach((id) => { ctl[id] = sim.slider(id, { label: id, min: 0, max: 1, value: 0.5, log: true, step: 0.0001, fmt: (v) => EM.sci(v, 3) }); });
    function config() {
      const S = SYS[sim.p.sys];
      ['a', 'b', 'c'].forEach((id, i) => {
        const q = S.p[i];
        if (!q) { ctl[id].show(false); return; }
        ctl[id].show(true);
        ctl[id].label(q[1]);
        ctl[id].input.min = 0; ctl[id].input.max = 1000;
        ctl[id].range(q[2], q[3]);
        ctl[id].set(q[4], true);
      });
    }
    /* el deslizador logarítmico usa o.min/o.max del objeto original: se reemplazan en range() */
    config();
    sim.out('w', '<i>ω</i><sub>0</sub>', { hl: true });
    sim.out('f', 'Frecuencia <i>f</i>');
    sim.out('T', 'Período <i>T</i>');
    let t = 0;
    sim.animate((dt) => { t += dt; });
    sim.onDraw(() => {
      const S = SYS[sim.p.sys];
      const args = ['a', 'b', 'c'].map((id) => sim.p[id]);
      const w = S.w(...args);
      const ctx = cv.ctx, W = cv.w, H = cv.h;
      EM.draw.clear(cv);
      /* animación a velocidad visible: si ω es muy grande, se ralentiza */
      const wv = Math.min(w, 8), slow = w > 8 ? w / 8 : 1;
      const q = Math.cos(wv * t);
      const k = sim.p.sys;
      const cx = W * 0.5, cy = H * 0.5;
      if (k === 'par' || k === 'ser') {
        const bx = cx + 60 * q;
        EM.draw.support(ctx, 40, cy, H * 0.7, 'right');
        if (k === 'par') { EM.draw.spring(ctx, 40, cy - 20, bx - 25, cy - 20, { coils: 10, r: 7 }); EM.draw.spring(ctx, 40, cy + 20, bx - 25, cy + 20, { coils: 6, r: 7, color: '--c3' }); }
        else { const mid = 40 + (bx - 25 - 40) * 0.5; EM.draw.spring(ctx, 40, cy, mid, cy, { coils: 8, r: 7 }); EM.draw.spring(ctx, mid, cy, bx - 25, cy, { coils: 5, r: 7, color: '--c3' }); }
        EM.draw.block(ctx, bx, cy, 50, 60, { label: 'm', italic: true });
      } else if (k === 'pend') {
        const L = H * 0.75, th = 0.35 * q;
        EM.draw.support(ctx, cx, 10, 80, 'down');
        const bx = cx + L * Math.sin(th), by = 10 + L * Math.cos(th);
        ctx.strokeStyle = EM.col('--ink-2'); ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(cx, 10); ctx.lineTo(bx, by); ctx.stroke();
        EM.draw.bob(ctx, bx, by, 13);
      } else if (k === 'utube') {
        const w2 = 26, d = 26 * q, base = H * 0.82, left = cx - 70, right = cx + 70;
        ctx.fillStyle = EM.alpha('--c1', 0.55);
        ctx.fillRect(left - w2 / 2, base - 90 - d, w2, 90 + d);
        ctx.fillRect(right - w2 / 2, base - 90 + d, w2, 90 - d);
        ctx.fillRect(left - w2 / 2, base - 4, right - left + w2, w2 - 4);
        ctx.strokeStyle = EM.col('--ink-2'); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(left - w2 / 2, base - 150); ctx.lineTo(left - w2 / 2, base + w2 - 8); ctx.lineTo(right + w2 / 2, base + w2 - 8); ctx.lineTo(right + w2 / 2, base - 150);
        ctx.moveTo(left + w2 / 2, base - 150); ctx.lineTo(left + w2 / 2, base - 4); ctx.lineTo(right - w2 / 2, base - 4); ctx.lineTo(right - w2 / 2, base - 150); ctx.stroke();
      } else if (k === 'float') {
        const wl = cy;
        ctx.fillStyle = EM.alpha('--c1', 0.25); ctx.fillRect(0, wl, W, H - wl);
        const sub = (args[0] / args[2]) * 100;

/* Capítulo 3 — Péndulos y pozos de potencial */
(function () {

  /* ======================================================================
     3.1 Péndulo real frente a lineal

  EM.defineSim('pendulum-exact', function (sim) {

    sim.resetButton(() => reset());

    sim.out('T', 'Período real', { hl: true });

  /* ======================================================================
     3.3 Péndulo físico
     ====================================================================== */
  EM.defineSim('physical-pendulum', function (sim) {
    sim.cols2();
    const cv = sim.canvas({ aspect: 0.9 });

    sim.group('Cuerpo');

    sim.slider('L', { label: 'Tamaño (longitud o diámetro)', min: 0.2, max: 2, step: 0.01, value: 1, unit: 'm', fmt: f2 });

    sim.slider('g', { label: 'Gravedad <i>g</i>', min: 1.6, max: 25, step: 0.01, value: 9.81, unit: 'm/s²', fmt: f2 });

    sim.out('d2', 'Otro eje con igual período');

    const half = () => sim.p.L / 2;

    sim.onChange();

    sim.onDraw(() => {

      else { ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, cmY, (p.L / 2) * sc, 0, 2 * Math.PI); ctx.stroke(); }

      EM.text(ctx, '● centro de masa', 10, H - 30, { size: 11.5, color: '--ink' });

  /* ======================================================================
     3.4 Partícula en un pozo de potencial
     ====================================================================== */
  EM.defineSim('potential-well', function (sim) {
    sim.cols2();
    const cv = sim.canvas({ aspect: 1.15 });
    const cp = sim.canvas({ aspect: 1.15 });
    /* potenciales adimensionales con mínimo en x0 y U''(x0) indicado */
    const POT = {
      harm: { n: 'Parabólico ½x²', U: (x) => 0.5 * x * x, x0: 0, U2: 1, xr: [-2.5, 2.5], Emax: 2.5 },
      pend: { n: 'Péndulo 1 − cos x', U: (x) => 1 - Math.cos(x), x0: 0, U2: 1, xr: [-Math.PI, Math.PI], Emax: 1.99 },
      quart: { n: 'Cuártico x⁴/4', U: (x) => (x ** 4) / 4, x0: 0, U2: 0, xr: [-2.2, 2.2], Emax: 3 },
      morse: { n: 'Morse (1 − e^{−x})²', U: (x) => (1 - Math.exp(-x)) ** 2, x0: 0, U2: 2, xr: [-1, 5], Emax: 0.99 },
      dbl: { n: 'Doble pozo (x² − 1)²/4', U: (x) => ((x * x - 1) ** 2) / 4, x0: 1, U2: 2, xr: [-2, 2], Emax: 1.5 },
      asym: { n: 'Asimétrico ½x² − x³/6', U: (x) => 0.5 * x * x - (x ** 3) / 6, x0: 0, U2: 1, xr: [-2.5, 2.4], Emax: 0.66 }
    };
    sim.select('pot', { label: 'Potencial', options: Object.keys(POT).map((k) => [k, POT[k].n]), value: 'pend', onInput: () => { sim.ctl.E.range(0.005, POT[sim.p.pot].Emax); sim.ctl.E.set(Math.min(sim.p.E, POT[sim.p.pot].Emax * 0.6)); } });
    sim.slider('E', { label: 'Energía <i>E</i>', min: 0.005, max: 1.99, step: 0.005, value: 0.6, fmt: (v) => EM.fix(v, 3) });
    sim.out('T', 'Período exacto <i>T</i>(<i>E</i>)', { hl: true });
    sim.out('Th', 'Armónico 2π/√<i>U</i>″(<i>x</i><sub>0</sub>)');
    sim.out('tp', 'Puntos de retorno');
    sim.note('Unidades adimensionales con <i>m</i> = 1. La partícula parte del punto de retorno derecho.');
    let st = null, t = 0, cache = null;
    const turning = () => {
      const P = POT[sim.p.pot], E = sim.p.E;
      const x0 = P.x0;
      const f = (x) => P.U(x) - E;
      let a = x0, b = x0;
      const dx = 0.002;
      while (f(b) < 0 && b < P.xr[1] + 3) b += dx;
      while (f(a) < 0 && a > P.xr[0] - 3) a -= dx;
      const x2 = M.bisect(f, b - dx, b), x1 = M.bisect(f, a, a + dx);
      return [x1, x2];
    };
    const period = () => {
      const P = POT[sim.p.pot], E = sim.p.E;
      const [x1, x2] = turning();
      /* sustitución x = c + h sen u elimina las singularidades integrables de los extremos */
      const c = (x1 + x2) / 2, h = (x2 - x1) / 2;
      const g = (u) => { const x = c + h * Math.sin(u); const k = E - P.U(x); return k > 1e-14 ? (h * Math.cos(u)) / Math.sqrt(2 * k) : 0; };
      return 2 * M.simpson(g, -Math.PI / 2 + 1e-7, Math.PI / 2 - 1e-7, 4000);
    };
    const reset = () => { st = [turning()[1] - 1e-9, 0]; t = 0; };
    reset();
    sim.onChange = () => reset();
    const dU = (x) => { const P = POT[sim.p.pot], h = 1e-5; return (P.U(x + h) - P.U(x - h)) / (2 * h); };
    sim.animate((dt) => { st = EM.integrate((tt, s) => [s[1], -dU(s[0])], t, st, t + dt * 2, 20); t += dt * 2; });
    sim.onDraw(() => {
      const P = POT[sim.p.pot], E = sim.p.E;
      const [x1, x2] = turning();
      EM.draw.clear(cv);
      const ym = P.Emax * 1.25;
      const pl = new EM.Plot(cv.ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: P.xr[0], xmax: P.xr[1], ymin: -0.05 * ym, ymax: ym, xlabel: 'x', ylabel: 'U(x)', ml: 52 });
      pl.frame();
      if (P.U2 > 0) pl.fn((x) => P.U(P.x0) + 0.5 * P.U2 * (x - P.x0) ** 2, { color: '--ink-3', width: 1.2, dash: [5, 4] });
      pl.fn(P.U, { color: '--ink', width: 2.2 });
      pl.hline(E, { color: '--accent', dash: [], width: 1.5 });
      pl.dot(x1, E, { color: '--c2', r: 4 }); pl.dot(x2, E, { color: '--c2', r: 4 });
      pl.dot(st[0], P.U(st[0]), { color: '--accent', r: 7 });
      EM.draw.clear(cp);
      if (!cache || cache.pot !== sim.p.pot) {
        const save = sim.p.E;
        const Es0 = EM.M.linspace(P.Emax * 0.01, P.Emax * 0.995, 70);
        cache = { pot: sim.p.pot, Es: Es0, Ts: Es0.map((e) => { sim.p.E = e; return period(); }) };
        sim.p.E = save;
      }
      const Es = cache.Es, Ts = cache.Ts;
      const T = period();
      const Th = P.U2 > 0 ? 2 * Math.PI / Math.sqrt(P.U2) : NaN;
      const tmax = Math.min(Math.max(...Ts.filter(isFinite)) * 1.1, 40);
      const pp = new EM.Plot(cp.ctx, { x: 0, y: 0, w: cp.w, h: cp.h, xmin: 0, xmax: P.Emax, ymin: 0, ymax: tmax, xlabel: 'energía E', ylabel: 'período T', ml: 52 });
      pp.frame();
      if (isFinite(Th)) pp.hline(Th, { color: '--ink-3', label: 'armónico', labelRight: true });
      pp.xy(Es, Ts, { color: '--c1', width: 2.2 });
      pp.dot(E, T, { color: '--accent', r: 6 });
      sim.set('T', EM.fix(T, 4));
      sim.set('Th', isFinite(Th) ? EM.fix(Th, 4) : '— (U″ = 0: no hay límite armónico)');
      sim.set('tp', EM.fix(x1, 3) + ' y ' + EM.fix(x2, 3));
    });
  });
})();

/* Capítulo 4 — Oscilaciones amortiguadas */
(function () {
  'use strict';
  const EM = window.EM, M = EM.M;
  const f2 = (v) => EM.fix(v, 2), f3 = (v) => EM.fix(v, 3);

  /* Solución analítica de ẍ + γẋ + ω0²x = 0 con x(0)=x0, ẋ(0)=v0 → {x(t), v(t)} */
  function dampedSol(w0, g, x0, v0) {
    const a = -g / 2, disc = (g * g) / 4 - w0 * w0;
    if (Math.abs(disc) < 1e-10) {
      const c2 = v0 - a * x0;
      return { x: (t) => (x0 + c2 * t) * Math.exp(a * t), v: (t) => (c2 + a * (x0 + c2 * t)) * Math.exp(a * t) };
    }
    if (disc > 0) {
      const r = Math.sqrt(disc), s1 = a + r, s2 = a - r;
      const c2 = (v0 - s1 * x0) / (s2 - s1), c1 = x0 - c2;
      return { x: (t) => c1 * Math.exp(s1 * t) + c2 * Math.exp(s2 * t), v: (t) => c1 * s1 * Math.exp(s1 * t) + c2 * s2 * Math.exp(s2 * t) };
    }
    const wd = Math.sqrt(-disc), B = (v0 - a * x0) / wd;
    return {
      x: (t) => Math.exp(a * t) * (x0 * Math.cos(wd * t) + B * Math.sin(wd * t)),
      v: (t) => Math.exp(a * t) * (a * (x0 * Math.cos(wd * t) + B * Math.sin(wd * t)) + wd * (-x0 * Math.sin(wd * t) + B * Math.cos(wd * t))),
      env: Math.hypot(x0, B), wd
    };
  }
  EM.dampedSol = dampedSol;

  /* Dibujo de bloque con resorte y amortiguador */
  function drawMSD(ctx, W, H, x, sc, o = {}) {
    const xw = 30, xe = W * 0.5, y = H * 0.5;
    EM.draw.support(ctx, xw, y, H * 0.8, 'right');
    const bx = xe + x * sc;
    if (o.damper === false) {
      EM.draw.spring(ctx, xw, y, bx - 24, y, { coils: 10, r: 7 });
      ctx.fillStyle = EM.alpha('--c4', 0.25);
      ctx.fillRect(xw, y + 26, W - xw - 10, 8);
    } else {
      EM.draw.spring(ctx, xw, y - 14, bx - 24, y - 14, { coils: 10, r: 7 });
      EM.draw.damper(ctx, xw, y + 16, bx - 24, y + 16, { w: 8 });
    }
    EM.draw.block(ctx, bx, y, 48, 52, { label: 'm', italic: true, fill: o.fill });
    ctx.save(); ctx.setLineDash([4, 4]); ctx.strokeStyle = EM.col('--ink-3');
    ctx.beginPath(); ctx.moveTo(xe, 6); ctx.lineTo(xe, H - 6); ctx.stroke(); ctx.restore();
  }
  EM.drawMSD = drawMSD;

  /* ======================================================================
     4.1 Los tres regímenes
     ====================================================================== */
  EM.defineSim('damped-regimes', function (sim) {
    sim.cols2();
    const cs = sim.canvas({ aspect: 4, cls: 'full fixed' });
    const cv = sim.canvas({ aspect: 1.25 });
    const cp = sim.canvas({ aspect: 1.25 });
    sim.group('Oscilador');
    sim.slider('w0', { label: 'Frecuencia natural <i>ω</i><sub>0</sub>', min: 0.5, max: 6, step: 0.05, value: 3, unit: 'rad/s', fmt: f2 });
    sim.slider('z', { label: 'Razón de amortiguamiento <i>ζ</i> = <i>γ</i>/2<i>ω</i><sub>0</sub>', min: 0, max: 3, step: 0.01, value: 0.15, fmt: f2 });
    sim.button('ζ = 0.1', () => sim.ctl.z.set(0.1));
    sim.button('Crítico', () => sim.ctl.z.set(1));
    sim.button('ζ = 2.5', () => sim.ctl.z.set(2.5));
    sim.group('Condiciones iniciales');
    sim.slider('x0', { label: '<i>x</i><sub>0</sub>', min: -1, max: 1, step: 0.02, value: 1, fmt: f2 });
    sim.slider('v0', { label: '<i>v</i><sub>0</sub>', min: -10, max: 10, step: 0.1, value: 0, fmt: (v) => EM.fix(v, 1) });
    sim.resetButton(() => { t = 0; });
    sim.out('g', '<i>γ</i>');
    sim.out('reg', 'Régimen', { hl: true });
    sim.out('wd', '<i>ω<sub>d</sub></i>');
    sim.out('Q', '<i>Q</i> = <i>ω</i><sub>0</sub>/<i>γ</i>');
    sim.out('roots', 'Raíces características');
    let t = 0;
    sim.onChange = () => { t = 0; };
    sim.animate((dt) => { t += dt; if (t > 14) t = 0; });
    sim.onDraw(() => {
      const p = sim.p, g = 2 * p.z * p.w0;
      const S = dampedSol(p.w0, g, p.x0, p.v0);
      EM.draw.clear(cs);
      drawMSD(cs.ctx, cs.w, cs.h, S.x(t), cs.w * 0.25);
      EM.draw.clear(cv);
      const pl = new EM.Plot(cv.ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: 0, xmax: 14, ymin: -1.4, ymax: 1.4, xlabel: 't (s)', ylabel: 'x', ml: 52 });
      pl.frame();
      if (S.env) { pl.fn((tt) => S.env * Math.exp(-g * tt / 2), { color: '--ink-3', width: 1, dash: [4, 4] }); pl.fn((tt) => -S.env * Math.exp(-g * tt / 2), { color: '--ink-3', width: 1, dash: [4, 4] }); }
      pl.fn(S.x, { color: '--grid-2', width: 1.5 });
      pl.fn(S.x, { color: '--accent', width: 2.2, to: t });
      pl.dot(t, S.x(t), { color: '--accent' });
      EM.draw.clear(cp);
      const vm = Math.max(1.5, p.w0 * 1.4);
      const pp = new EM.Plot(cp.ctx, { x: 0, y: 0, w: cp.w, h: cp.h, xmin: -1.4, xmax: 1.4, ymin: -vm, ymax: vm, xlabel: 'x', ylabel: 'v', ml: 52 });
      pp.frame();
      const ts = EM.M.linspace(0, 14, 700);
      pp.xy(ts.map(S.x), ts.map(S.v), { color: '--grid-2', width: 1.5 });
      const ts2 = ts.filter((u) => u <= t);
      pp.xy(ts2.map(S.x), ts2.map(S.v), { color: '--c1', width: 2 });
      pp.dot(S.x(t), S.v(t), { color: '--accent', r: 5 });
      const disc = (g * g) / 4 - p.w0 * p.w0;
      sim.set('g', EM.fix(g, 3) + ' s⁻¹');
      sim.set('reg', p.z === 0 ? 'sin amortiguamiento' : Math.abs(p.z - 1) < 1e-9 ? 'crítico' : p.z < 1 ? 'subamortiguado' : 'sobreamortiguado');
      sim.set('wd', disc < 0 ? EM.fix(Math.sqrt(-disc), 3) + ' rad/s (' + EM.fix((100 * Math.sqrt(-disc)) / p.w0, 2) + ' % de ω₀)' : '— (no oscila)');
      sim.set('Q', p.z > 0 ? EM.fix(1 / (2 * p.z), 3) : '∞');
      sim.set('roots', disc < 0 ? EM.fix(-g / 2, 3) + ' ± ' + EM.fix(Math.sqrt(-disc), 3) + ' i' : EM.fix(-g / 2 + Math.sqrt(disc), 3) + ' y ' + EM.fix(-g / 2 - Math.sqrt(disc), 3));
    });
  });

  /* ======================================================================
     4.3 Energía y Q
     ====================================================================== */
  EM.defineSim('damped-energy', function (sim) {
    const cv = sim.canvas({ aspect: 2.3 });
    sim.slider('f', { label: 'Frecuencia <i>f</i><sub>0</sub>', min: 100, max: 1000, step: 1, value: 440, unit: 'Hz', fmt: (v) => v.toFixed(0) });
    sim.slider('Q', { label: 'Factor de calidad <i>Q</i>', min: 1, max: 3000, value: 30, log: true, step: 0.1, fmt: (v) => EM.sci(v, 3) });
    sim.seg('scale', { label: 'Escala vertical', options: [['lin', 'Lineal'], ['log', 'Logarítmica']], value: 'log' });
    EM.listenButton(sim, () => { const w = 2 * Math.PI * sim.p.f, g = w / sim.p.Q; return { fn: (t) => Math.exp((-g * t) / 2) * Math.sin(w * t), dur: Math.min(6, Math.max(0.5, (2 * 6.9) / g)) }; });
    sim.out('g', '<i>γ</i> = <i>ω</i><sub>0</sub>/<i>Q</i>');
    sim.out('tauE', 'Tiempo de vida de la energía 1/<i>γ</i>', { hl: true });
    sim.out('ncyc', 'Oscilaciones hasta <i>A</i>/e');
    sim.out('loss', 'Energía perdida por ciclo');
    sim.onDraw(() => {
      const p = sim.p, w = 2 * Math.PI * p.f, g = w / p.Q;
      EM.draw.clear(cv);
      /* se grafica en unidades de ciclos para que se vea la oscilación */
      const ncyc = Math.min(60, Math.max(6, (3 * p.Q) / Math.PI));
      const E = (c) => { const tt = c / p.f; const wd = Math.sqrt(Math.max(0, w * w - (g * g) / 4)); const x = Math.exp((-g * tt) / 2) * Math.cos(wd * tt); const v = Math.exp((-g * tt) / 2) * (-(g / 2) * Math.cos(wd * tt) - wd * Math.sin(wd * tt)); return 0.5 * (v * v) / (w * w) + 0.5 * x * x; };
      const log = p.scale === 'log';
      const pl = new EM.Plot(cv.ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: 0, xmax: ncyc, ymin: log ? 1e-4 : 0, ymax: log ? 1.2 : 1.05, ylog: log, xlabel: 'número de ciclos', ylabel: 'E / E₀', ml: 56 });
      pl.frame();
      pl.fn((c) => E(c) / 0.5, { color: '--c1', width: 1.8, n: 2400 });
      pl.fn((c) => Math.exp(-g * (c / p.f)), { color: '--accent', width: 1.6, dash: [6, 4] });
      pl.vline(p.Q / (2 * Math.PI), { color: '--c3', label: 'E₀/e' });
      pl.legend([{ label: 'energía total', color: '--c1' }, { label: 'e^{−γt}', color: '--accent', dash: [6, 4] }], 'tr');
      sim.set('g', EM.si(g, 's⁻¹'));
      sim.set('tauE', EM.si(1 / g, 's'));
      sim.set('ncyc', EM.fix(p.Q / Math.PI, 2));
      sim.set('loss', EM.fix(100 * (1 - Math.exp((-2 * Math.PI) / p.Q)), 3) + ' % ≈ 2π/Q');
    });
  });

  /* ======================================================================
     4.4 Tiempo de asentamiento
     ====================================================================== */
  EM.defineSim('settling-time', function (sim) {
    sim.cols2();
    const cv = sim.canvas({ aspect: 1.2 });
    const cp = sim.canvas({ aspect: 1.2 });
    sim.slider('z', { label: 'Razón de amortiguamiento <i>ζ</i>', min: 0.05, max: 3, step: 0.01, value: 0.7, fmt: f2 });
    sim.slider('tol', { label: 'Banda de tolerancia', min: 1, max: 20, step: 0.5, value: 5, unit: '%', fmt: (v) => EM.fix(v, 1) });
    sim.out('ts', 'Tiempo de asentamiento ω₀<i>t<sub>s</sub></i>', { hl: true });
    sim.out('os', 'Sobrepaso máximo');
    sim.out('opt', 'ζ óptimo para esta tolerancia');
    sim.note('El oscilador parte de <i>x</i> = 1 en reposo (ω₀ = 1). El tiempo de asentamiento es el último instante en que |<i>x</i>| sale de la banda.');
    const settle = (z, tol) => {
      const S = dampedSol(1, 2 * z, 1, 0);
      let last = 0;
      for (let t = 0; t < 80; t += 0.005) if (Math.abs(S.x(t)) > tol) last = t;
      return last;
    };
    let cacheTol = null, curve = null;
    sim.onDraw(() => {
      const p = sim.p, tol = p.tol / 100;
      const S = dampedSol(1, 2 * p.z, 1, 0);
      const ts = settle(p.z, tol);
      EM.draw.clear(cv);
      const pl = new EM.Plot(cv.ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: 0, xmax: 20, ymin: -1, ymax: 1.1, xlabel: 'ω₀ t', ylabel: 'x', ml: 52 });
      pl.frame();
      cv.ctx.fillStyle = EM.alpha('--c3', 0.12);
      cv.ctx.fillRect(pl.ix, pl.Y(tol), pl.iw, pl.Y(-tol) - pl.Y(tol));
      pl.fn(S.x, { color: '--accent', width: 2.2, n: 600 });
      pl.vline(ts, { color: '--c3', label: 't_s' });
      if (cacheTol !== p.tol) {
        cacheTol = p.tol;
        const zs = EM.M.linspace(0.05, 3, 150);
        curve = [zs, zs.map((z) => settle(z, tol))];
      }
      EM.draw.clear(cp);
      const pp = new EM.Plot(cp.ctx, { x: 0, y: 0, w: cp.w, h: cp.h, xmin: 0, xmax: 3, ymin: 0, ymax: 30, xlabel: 'ζ', ylabel: 'ω₀ t_s', ml: 52 });
      pp.frame();
      pp.xy(curve[0], curve[1], { color: '--c1', width: 2 });
      pp.vline(1, { color: '--ink-3', label: 'crítico' });
      pp.dot(p.z, ts, { color: '--accent', r: 6 });
      let best = 0;
      curve[1].forEach((v, i) => { if (v < curve[1][best]) best = i; });
      pp.dot(curve[0][best], curve[1][best], { color: '--c3', r: 4 });
      let mn = 0;
      for (let t = 0; t < 40; t += 0.01) mn = Math.min(mn, S.x(t));
      sim.set('ts', EM.fix(ts, 2));
      sim.set('os', EM.fix(-100 * mn, 2) + ' %');
      sim.set('opt', 'ζ ≈ ' + EM.fix(curve[0][best], 2) + ' (ω₀t_s = ' + EM.fix(curve[1][best], 2) + ')');
    });
  });

  /* ======================================================================
     4.5 Fricción seca
     ====================================================================== */
  EM.defineSim('coulomb-friction', function (sim) {
    const cs = sim.canvas({ aspect: 4, cls: 'fixed' });
    const cv = sim.canvas({ aspect: 2.4 });
    sim.slider('w0', { label: '<i>ω</i><sub>0</sub>', min: 2, max: 20, step: 0.1, value: 6, unit: 'rad/s', fmt: (v) => EM.fix(v, 1) });
    sim.slider('mu', { label: 'Coeficiente <i>μ</i> (estático = cinético)', min: 0, max: 0.3, step: 0.005, value: 0.08, fmt: (v) => EM.fix(v, 3) });
    sim.slider('A0', { label: 'Elongación inicial', min: 0.05, max: 0.5, step: 0.01, value: 0.4, unit: 'm', fmt: f2 });
    sim.check('visc', { label: 'Comparar con viscoso de igual pérdida inicial', value: true });
    sim.resetButton(() => restart());
    sim.out('dA', 'Pérdida de amplitud por ciclo 4<i>μg</i>/<i>ω</i><sub>0</sub>²', { hl: true });
    sim.out('band', 'Zona muerta ±<i>μg</i>/<i>ω</i><sub>0</sub>²');
    sim.out('xf', 'Posición final');
    sim.out('nh', 'Medios ciclos hasta detenerse');
    let st, t, tr;
    const g = 9.81;
    const restart = () => { st = [sim.p.A0, 0]; t = 0; tr = new EM.Trace(4000); stuck = false; };
    let stuck = false;
    restart();
    sim.onChange = () => restart();
    const step = (dt) => {
      const p = sim.p, w2 = p.w0 * p.w0, f = p.mu * g;
      const n = 40, h = dt / n;
      for (let i = 0; i < n; i++) {
        if (stuck) break;
        let [x, v] = st;
        const spring = -w2 * x;
        if (Math.abs(v) < 1e-6 && Math.abs(spring) <= f) { stuck = true; st = [x, 0]; break; }
        const dir = Math.abs(v) < 1e-6 ? -Math.sign(spring) : Math.sign(v);
        let a = spring - f * dir;
        let vn = v + a * h;
        if (v !== 0 && Math.sign(vn) !== Math.sign(v)) vn = 0;
        x += 0.5 * (v + vn) * h;
        st = [x, vn];
      }
    };
    sim.animate((dt) => { step(dt); t += dt; if (t < 30) tr.push(t, st[0]); });
    sim.onDraw(() => {
      const p = sim.p, band = (p.mu * g) / (p.w0 * p.w0), dA = 4 * band;
      EM.draw.clear(cs);
      drawMSD(cs.ctx, cs.w, cs.h, st[0], cs.w * 0.3 / 0.5, { fill: '--c4', damper: false });
      EM.draw.clear(cv);
      const T = (2 * Math.PI) / p.w0, span = Math.max(T * 8, 6);
      const pl = new EM.Plot(cv.ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: 0, xmax: span, ymin: -p.A0 * 1.15, ymax: p.A0 * 1.15, xlabel: 't (s)', ylabel: 'x (m)', ml: 56 });
      pl.frame();
      cv.ctx.fillStyle = EM.alpha('--c2', 0.1);
      cv.ctx.fillRect(pl.ix, pl.Y(band), pl.iw, pl.Y(-band) - pl.Y(band));
      /* envolvente lineal */
      const tz = dA > 0 ? (p.A0 * T) / dA : span;
      pl.fn((tt) => p.A0 - (dA * tt) / T, { color: '--c2', width: 1, dash: [4, 4], to: tz });
      pl.fn((tt) => -(p.A0 - (dA * tt) / T), { color: '--c2', width: 1, dash: [4, 4], to: tz });
      if (p.visc && p.mu > 0) {
        /* viscoso con igual pérdida relativa en el primer ciclo */
        const r = Math.max(1e-3, (p.A0 - dA) / p.A0), gam = (-2 * Math.log(r)) / T;
        const S = dampedSol(p.w0, Math.min(gam, 2 * p.w0 * 0.999), p.A0, 0);
        pl.fn(S.x, { color: '--c1', width: 1.4, alpha: 0.7, n: 900 });
      }
      pl.xy(tr.t, tr.col(0), { color: '--accent', width: 2.2 });
      if (p.visc && p.mu > 0) pl.legend([{ label: 'fricción seca', color: '--accent' }, { label: 'viscosa equivalente', color: '--c1' }], 'tr');
      sim.set('dA', EM.si(dA, 'm'));
      sim.set('band', EM.si(band, 'm'));
      sim.set('xf', stuck ? EM.si(st[0], 'm') : 'en movimiento…');
      sim.set('nh', p.mu > 0 ? String(Math.max(0, Math.ceil((p.A0 - band) / (2 * band)))) : '∞');
    });
  });
})();

/* ==== chapters/05-forzadas.js ==== */
/* Capítulo 5 — Oscilaciones forzadas y resonancia */
(function () {
  'use strict';
  const EM = window.EM, M = EM.M;
  const f2 = (v) => EM.fix(v, 2), f3 = (v) => EM.fix(v, 3);
  /* amplitud (por unidad de F0/m) y fase del régimen estacionario */
  const resp = (w0, g, w) => { const re = w0 * w0 - w * w, im = g * w; return [1 / Math.hypot(re, im), Math.atan2(im, re)]; };
  EM.resp = resp;

  /* ======================================================================
     5.1 Transitorio y régimen estacionario
     ====================================================================== */
  EM.defineSim('forced-transient', function (sim) {
    sim.cols2();
    const cs = sim.canvas({ aspect: 4.2, cls: 'full fixed' });
    const cv = sim.canvas({ aspect: 2.6, cls: 'full' });
    sim.group('Oscilador');
    sim.note('Frecuencia natural fija: <i>ω</i><sub>0</sub> = 2π rad/s (<i>f</i><sub>0</sub> = 1 Hz).');
    sim.slider('Q', { label: 'Factor de calidad <i>Q</i>', min: 0.5, max: 200, value: 20, log: true, step: 0.1, fmt: (v) => EM.fix(v, 1), onInput: () => restart() });
    sim.group('Fuerza');
    sim.slider('r', { label: 'Frecuencia relativa <i>ω</i>/<i>ω</i><sub>0</sub>', min: 0.2, max: 3, step: 0.005, value: 0.9, fmt: f3, onInput: () => restart() });
    sim.slider('F', { label: 'Amplitud <i>F</i><sub>0</sub>/<i>m</i>', min: 0, max: 10, step: 0.1, value: 4, unit: 'm/s²', fmt: (v) => EM.fix(v, 1), onInput: () => restart() });
    sim.group('Condiciones iniciales');
    sim.slider('x0', { label: '<i>x</i><sub>0</sub>', min: -0.5, max: 0.5, step: 0.01, value: 0, unit: 'm', fmt: f2, onInput: () => restart() });
    sim.check('steady', { label: 'Mostrar sólo la solución estacionaria (punteada)', value: true });
    sim.resetButton(() => restart());
    sim.out('A', 'Amplitud estacionaria <i>A</i>(<i>ω</i>)', { hl: true });
    sim.out('d', 'Desfase <i>δ</i>');
    sim.out('tr', 'Duración del transitorio 2/<i>γ</i>');
    const w0 = 2 * Math.PI;
    let y, t, tr;
    const restart = () => { y = [sim.p.x0, 0]; t = 0; tr = new EM.Trace(3000); };
    restart();
    sim.animate((dt) => {
      const p = sim.p, g = w0 / p.Q, w = p.r * w0;
      const f = (tt, s) => [s[1], p.F * Math.cos(w * tt) - g * s[1] - w0 * w0 * s[0]];
      y = EM.integrate(f, t, y, t + dt, 20);
      t += dt;
      tr.push(t, y[0]);
    });
    sim.onDraw(() => {
      const p = sim.p, g = w0 / p.Q, w = p.r * w0;
      const [a, d] = resp(w0, g, w);
      const A = p.F * a;
      const Amax = p.F / (g * w0) * 1.05;
      const ym = Math.max(0.05, Math.min(Amax * 1.3, Math.max(A * 2.2, Math.abs(p.x0) * 1.2, 0.1)));
      EM.draw.clear(cs);
      const ctx = cs.ctx, W = cs.w, H = cs.h;
      const sc = (W * 0.32) / ym;
      EM.drawMSD(ctx, W, H, y[0], sc);
      /* flecha de fuerza */
      const Fx = Math.cos(w * t);
      EM.draw.arrow(ctx, W * 0.5 + y[0] * sc, H * 0.12, W * 0.5 + y[0] * sc + Fx * 50, H * 0.12, { color: '--c2', width: 2.4 });
      EM.text(ctx, 'F(t)', W * 0.5 + y[0] * sc + Fx * 50 + (Fx > 0 ? 6 : -30), H * 0.12 + 4, { size: 12, color: '--c2', italic: true });
      EM.draw.clear(cv);
      const span = 12;
      const t0 = Math.max(0, t - span);
      const pl = new EM.Plot(cv.ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: t0, xmax: t0 + span, ymin: -ym, ymax: ym, xlabel: 't (s)', ylabel: 'x (m)', ml: 58 });
      pl.frame();
      if (p.steady) pl.fn((tt) => A * Math.cos(w * tt - d), { color: '--ink-3', width: 1.2, dash: [5, 4] });
      pl.xy(tr.t, tr.col(0), { color: '--accent', width: 2 });
      sim.set('A', EM.si(A, 'm') + ' (' + EM.fix(A / (p.F / (w0 * w0)), 2) + ' × estática)');
      sim.set('d', EM.fix(M.deg(d), 1) + '°');
      sim.set('tr', EM.si(2 / g, 's'));
    });
  });

  /* ======================================================================
     5.2 Curvas de resonancia
     ====================================================================== */
  EM.defineSim('resonance-curves', function (sim) {

      pl.band(Math.SQRT2, 5, { color: '--c3', alpha: 0.08 });
      pl.hline(1, { color: '--ink-3' });
      pl.vline(Math.SQRT2, { color: '--c3', label: '√2' });

      pl.dot(p.r, T, { color: '--accent', r: 6 });
      sim.set('Tr', EM.fix(T, 3));
      sim.set('dB', EM.fix(20 * Math.log10(T), 1) + ' dB');
      sim.set('state', T > 1 ? 'amplifica la vibración' : 'aísla (atenúa) la vibración');

(function () {

  /* Dibuja un circuito serie rectangular con elementos en los lados; devuelve nada */
  function drawLoop(ctx, x0, y0, w, h, parts, o = {}) {
    ctx.save();
    ctx.strokeStyle = EM.col('--ink-2');
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.rect(x0, y0, w, h);
    ctx.stroke();
    /* elementos: {side: 'top'|'right'|'bottom'|'left', t: 0..1, kind: 'C'|'L'|'R'|'S', label} */
    for (const p of parts) {
      let cx, cy, horiz;
      if (p.side === 'top') { cx = x0 + w * p.t; cy = y0; horiz = true; }
      else if (p.side === 'bottom') { cx = x0 + w * p.t; cy = y0 + h; horiz = true; }
      else if (p.side === 'left') { cx = x0; cy = y0 + h * p.t; horiz = false; }
      else { cx = x0 + w; cy = y0 + h * p.t; horiz = false; }
      const L = 44;
      ctx.fillStyle = EM.col('--canvas');
      if (horiz) ctx.fillRect(cx - L / 2, cy - 12, L, 24); else ctx.fillRect(cx - 12, cy - L / 2, 24, L);
      ctx.strokeStyle = EM.col('--ink');
      ctx.lineWidth = 2;
      const a = horiz ? [cx - L / 2, cy] : [cx, cy - L / 2], b = horiz ? [cx + L / 2, cy] : [cx, cy + L / 2];
      if (p.kind === 'C') {
        const g = 5;
        ctx.beginPath();
        if (horiz) { ctx.moveTo(a[0], cy); ctx.lineTo(cx - g, cy); ctx.moveTo(cx + g, cy); ctx.lineTo(b[0], cy); ctx.moveTo(cx - g, cy - 13); ctx.lineTo(cx - g, cy + 13); ctx.moveTo(cx + g, cy - 13); ctx.lineTo(cx + g, cy + 13); }
        else { ctx.moveTo(cx, a[1]); ctx.lineTo(cx, cy - g); ctx.moveTo(cx, cy + g); ctx.lineTo(cx, b[1]); ctx.moveTo(cx - 13, cy - g); ctx.lineTo(cx + 13, cy - g); ctx.moveTo(cx - 13, cy + g); ctx.lineTo(cx + 13, cy + g); }
        ctx.stroke();
        if (p.q !== undefined) {
          const s = Math.min(1, Math.abs(p.q));
          const top = p.q > 0 ? '--pos' : '--neg', bot = p.q > 0 ? '--neg' : '--pos';
          ctx.fillStyle = EM.alpha(top, 0.25 + 0.6 * s);
          if (horiz) ctx.fillRect(cx - g - 4, cy - 13, 3, 26); else ctx.fillRect(cx - 13, cy - g - 4, 26, 3);
          ctx.fillStyle = EM.alpha(bot, 0.25 + 0.6 * s);
          if (horiz) ctx.fillRect(cx + g + 1, cy - 13, 3, 26); else ctx.fillRect(cx - 13, cy + g + 1, 26, 3);
        }
      } else if (p.kind === 'L') {
        ctx.beginPath();
        const n = 4, r = L / (2 * n);
        for (let i = 0; i < n; i++) {
          if (horiz) ctx.arc(a[0] + r + 2 * r * i, cy, r, Math.PI, 0);
          else ctx.arc(cx, a[1] + r + 2 * r * i, r, -Math.PI / 2, Math.PI / 2);
        }
        ctx.stroke();
      } else if (p.kind === 'R') {
        EM.draw.zigzag(ctx, a[0], a[1], b[0], b[1], { n: 4, amp: 6, lead: 6, color: '--ink' });
      } else if (p.kind === 'S') {
        ctx.beginPath(); ctx.arc(cx, cy, 13, 0, 2 * Math.PI);
        ctx.fillStyle = EM.col('--canvas'); ctx.fill(); ctx.stroke();
        ctx.beginPath();
        for (let i = 0; i <= 20; i++) { const u = -8 + (16 * i) / 20; const v = -5 * Math.sin((Math.PI * i) / 10); if (i) ctx.lineTo(cx + u, cy + v); else ctx.moveTo(cx + u, cy + v); }
        ctx.stroke();

    }
    ctx.restore();
  }

      pl.frame();
      pl.fn((f) => { const ww = 2 * Math.PI * f; return p.E0 / Math.hypot(p.R, ww * p.L - 1 / (ww * p.C)); }, { color: '--c1', width: 2.2, n: 800 });
      pl.vline(w0 / (2 * Math.PI), { color: '--ink-3', label: 'f₀' });
      pl.dot(p.f, I0, { color: '--accent', r: 6 });

      sim.set('Z', EM.si(Z, 'Ω') + ' · ' + EM.fix(M.deg(phi), 1) + '°' + (phi > 0.01 ? ' (inductivo)' : phi < -0.01 ? ' (capacitivo)' : ''));

      sim.set('V', EM.si(VR, 'V') + ', ' + EM.si(VL, 'V') + ', ' + EM.si(VC, 'V'));

  });

  /* ======================================================================
     6.3 Analogía electromecánica
     ====================================================================== */
  EM.defineSim('em-analogy', function (sim) {
    sim.cols2();

    sim.slider('k', { label: 'Constante <i>k</i>', min: 5, max: 100, step: 1, value: 50, unit: 'N/m', fmt: (v) => v.toFixed(0) });
    sim.slider('b', { label: 'Fricción <i>b</i>', min: 0, max: 5, step: 0.05, value: 0.4, unit: 'kg/s', fmt: f2 });
    sim.group('Escala del circuito');
    sim.slider('s', { label: 'Factor <i>L</i>/<i>m</i>', min: 1e-3, max: 10, value: 0.1, log: true, step: 1e-4, unit: 'H/kg', fmt: (v) => EM.sci(v, 2) });
    sim.resetButton(() => { t = 0; });
    sim.out('L', '<i>L</i> = <i>s m</i>');
    sim.out('C', '<i>C</i> = 1/(<i>s k</i>)');
    sim.out('R', '<i>R</i> = <i>s b</i>');

    sim.animate((dt) => { t += dt; if (t > 12) t = 0; });
    sim.onDraw(() => {
      const p = sim.p, w0 = Math.sqrt(p.k / p.m), g = p.b / p.m;

      const x = S.x(t), v = S.v(t);
      EM.draw.clear(cm);
      EM.drawMSD(cm.ctx, cm.w, cm.h, x, cm.w * 0.22);
      EM.text(cm.ctx, 'x(t)', 10, 16, { size: 12, italic: true, color: '--ink-3' });
      EM.draw.clear(ce);
      const ctx = ce.ctx, W = ce.w, H = ce.h;
      drawLoop(ctx, W * 0.2, H * 0.2, W * 0.6, H * 0.6, [{ side: 'left', t: 0.5, kind: 'C', label: 'C', q: x }, { side: 'top', t: 0.5, kind: 'R', label: 'R' }, { side: 'right', t: 0.5, kind: 'L', label: 'L' }]);
      if (Math.abs(v) > 0.05 * w0) EM.draw.arrow(ctx, W * 0.5 + (v > 0 ? -14 : 14), H * 0.8, W * 0.5 + (v > 0 ? 14 : -14), H * 0.8, { color: '--cur', width: 3 });

      sim.set('R', EM.si(R, 'Ω'));

  /* ======================================================================
     6.4 Filtros RLC
     ====================================================================== */
  EM.defineSim('rlc-filter', function (sim) {
    sim.cols2();
    const cb = sim.canvas({ aspect: 1.15 });
    const cs = sim.canvas({ aspect: 1.15 });
    sim.slider('f0', { label: 'Frecuencia de resonancia <i>f</i><sub>0</sub>', min: 100, max: 5000, value: 800, log: true, step: 1, unit: 'Hz', fmt: (v) => v.toFixed(0) });
    sim.slider('Q', { label: 'Factor de calidad <i>Q</i>', min: 0.3, max: 20, value: 0.707, log: true, step: 0.001, fmt: (v) => EM.fix(v, 3) });
    sim.seg('out', { label: 'Salida en', options: [['C', 'C (pasa bajos)'], ['R', 'R (pasa banda)'], ['L', 'L (pasa altos)']], value: 'C' });
    sim.slider('fin', { label: 'Fundamental de la señal de prueba', min: 50, max: 1000, step: 1, value: 220, unit: 'Hz', fmt: (v) => v.toFixed(0) });
    const H = (f) => {
      const p = sim.p, r = f / p.f0;
      /* denominador normalizado: 1 − r² + i r/Q */
      const re = 1 - r * r, im = r / p.Q;
      let nr, ni;
      if (p.out === 'C') { nr = 1; ni = 0; } else if (p.out === 'R') { nr = 0; ni = r / p.Q; } else { nr = -r * r; ni = 0; }
      const d = re * re + im * im;
      return [(nr * re + ni * im) / d, (ni * re - nr * im) / d];
    };
    /* señal de prueba: diente de sierra con 30 armónicos */
    const harmonics = (fin) => { const out = []; for (let n = 1; n <= 30 && n * fin < 20000; n++) out.push([n * fin, 1 / n]); return out; };
    EM.listenButton(sim, () => { const hs = harmonics(sim.p.fin); return { fn: (t) => hs.reduce((s, [f, a]) => s + a * Math.sin(2 * Math.PI * f * t), 0), dur: 1.4 }; }, { label: '♪ Señal original' });
    EM.listenButton(sim, () => { const hs = harmonics(sim.p.fin).map(([f, a]) => { const h = H(f); return [f, a * Math.hypot(h[0], h[1]), Math.atan2(h[1], h[0])]; }); return { fn: (t) => hs.reduce((s, [f, a, ph]) => s + a * Math.sin(2 * Math.PI * f * t + ph), 0), dur: 1.4 }; }, { label: '♪ Señal filtrada' });
    sim.out('g', 'Ganancia en la fundamental', { hl: true });
    sim.out('fc', 'Ganancia en <i>f</i><sub>0</sub>');
    sim.onDraw(() => {
      const p = sim.p;
      EM.draw.clear(cb);
      const pl = new EM.Plot(cb.ctx, { x: 0, y: 0, w: cb.w, h: cb.h, xmin: 20, xmax: 20000, xlog: true, ymin: -60, ymax: 30, xlabel: 'f (Hz)', ylabel: 'ganancia (dB)', ml: 52, yticks: [-60, -40, -20, 0, 20] });
      pl.frame();
      pl.hline(-3, { color: '--ink-3', label: '−3 dB', labelRight: true });
      pl.fn((f) => { const h = H(f); return 20 * Math.log10(Math.hypot(h[0], h[1])); }, { color: '--c1', width: 2.3, n: 600 });
      pl.vline(p.f0, { color: '--ink-3', label: 'f₀' });
      harmonics(p.fin).forEach(([f]) => { const h = H(f); pl.dot(f, 20 * Math.log10(Math.hypot(h[0], h[1])), { color: '--accent', r: 3 }); });
      /* señal en el tiempo */
      EM.draw.clear(cs);
      const hs = harmonics(p.fin);
      const T = 2 / p.fin;
      const ps = new EM.Plot(cs.ctx, { x: 0, y: 0, w: cs.w, h: cs.h, xmin: 0, xmax: T * 1000, ymin: -2.2, ymax: 2.2, xlabel: 't (ms)', ylabel: 'señal', ml: 52 });
      ps.frame();
      ps.fn((tm) => hs.reduce((s, [f, a]) => s + a * Math.sin(2 * Math.PI * f * tm / 1000), 0), { color: '--grid-2', width: 1.6, n: 800 });
      ps.fn((tm) => hs.reduce((s, [f, a]) => { const h = H(f); return s + a * Math.hypot(h[0], h[1]) * Math.sin(2 * Math.PI * f * tm / 1000 + Math.atan2(h[1], h[0])); }, 0), { color: '--accent', width: 2, n: 800 });
      ps.legend([{ label: 'entrada (diente de sierra)', color: '--grid-2' }, { label: 'salida', color: '--accent' }], 'tr');
      const h1 = H(p.fin), h0 = H(p.f0);
      sim.set('g', EM.fix(20 * Math.log10(Math.hypot(h1[0], h1[1])), 1) + ' dB');
      sim.set('fc', EM.fix(20 * Math.log10(Math.hypot(h0[0], h0[1])), 1) + ' dB');
    });
  });
})();

/* ==== chapters/07-superposicion.js ==== */

      EM.draw.arrow(ctx, a[0], a[1], b[0], b[1], { color: '--c2', width: 2.4 });

      EM.text(ctx, 'marco que gira con f₁' + (slow < 1 ? ' (ralentizado)' : ''), 10, H - 10, { size: 11, color: '--ink-3' });

      pl.frame();

      const xs = pts.map((q) => q[0]), ys = pts.map((q) => q[1]);

      const S = (q) => [W / 2 + (q[0] - mx) * R, H / 2 - (q[1] - my) * R];
      for (let n = 0; n < N; n++) { const a = S(pts[n]), b = S(pts[n + 1]); EM.draw.arrow(ctx, a[0], a[1], b[0], b[1], { color: EM.mix('--c1', '--c5', n / Math.max(1, N - 1)), width: 2, head: Math.min(10, R * 0.35) }); }
      const a = S(pts[0]), b = S(pts[N]);
