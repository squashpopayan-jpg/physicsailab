      const span = closed ? 8 * Math.PI : 20 * Math.PI;
      const t0 = t - span;
      for (let i = 0; i <= 2000; i++) { const u = t0 + (span * i) / 2000; pts.push([cx + R * Math.cos(p.wx * u), cy - R * p.Ay * Math.cos(p.wy * u + ph)]); }
      EM.draw.poly(ctx, pts, { color: '--c1', width: 1.6, alpha: 0.85 });
      EM.draw.bob(ctx, cx + R * Math.cos(p.wx * t), cy - R * p.Ay * Math.cos(p.wy * t + ph), 6, { color: '--accent' });
      void tt;
      EM.draw.clear(cs);
      const ps = new EM.Plot(cs.ctx, { x: 0, y: 0, w: cs.w, h: cs.h, xmin: 0, xmax: 4 * Math.PI, ymin: -2.6, ymax: 2.6, xpi: true, xlabel: 'ω t', ylabel: 'señales', ml: 52 });
      ps.frame();
      ps.fn((u) => 1.2 + Math.cos(p.wx * u), { color: '--c3', width: 1.8 });
      ps.fn((u) => -1.2 + p.Ay * Math.cos(p.wy * u + ph), { color: '--c5', width: 1.8 });
      ps.label(0.2, 2.35, 'x(t)', { color: '--c3' });
      ps.label(0.2, -0.05, 'y(t)', { color: '--c5' });
      const r = p.wy / p.wx;
      sim.set('r', EM.fix(r, 4));
      sim.set('cl', closed ? 'cerrada (razón racional sencilla)' : 'no se cierra: la figura gira lentamente');
    });
  });

  /* ======================================================================
     7.5 Armonógrafo
     ====================================================================== */
  EM.defineSim('harmonograph', function (sim) {
    const cv = sim.canvas({ aspect: 1.5 });
    sim.group('Péndulo x');
    sim.slider('f1', { label: 'Frecuencia', min: 1, max: 4, step: 0.001, value: 2, fmt: (v) => EM.fix(v, 3) });
    sim.slider('p1', { label: 'Fase', min: 0, max: 360, step: 1, value: 0, unit: '°', fmt: (v) => v.toFixed(0) });
    sim.group('Péndulo y');
    sim.slider('f2', { label: 'Frecuencia', min: 1, max: 4, step: 0.001, value: 3.006, fmt: (v) => EM.fix(v, 3) });
    sim.slider('p2', { label: 'Fase', min: 0, max: 360, step: 1, value: 90, unit: '°', fmt: (v) => v.toFixed(0) });
    sim.group('Péndulo rotatorio');
    sim.slider('f3', { label: 'Frecuencia', min: 0, max: 4, step: 0.001, value: 1.002, fmt: (v) => EM.fix(v, 3) });
    sim.slider('a3', { label: 'Amplitud', min: 0, max: 1, step: 0.01, value: 0.35, fmt: f2 });
    sim.group('Amortiguamiento');
    sim.slider('g', { label: 'γ', min: 0.0005, max: 0.02, step: 0.0005, value: 0.004, fmt: (v) => EM.fix(v, 4) });
    sim.button('Aleatorio', () => {
      const r = (a, b) => a + Math.random() * (b - a);
      const base = [1, 2, 3, 4][Math.floor(Math.random() * 4)];
      sim.ctl.f1.set(base, true);
      sim.ctl.f2.set([1, 2, 3, 4][Math.floor(Math.random() * 4)] + r(-0.01, 0.01), true);
      sim.ctl.f3.set(r(0, 1) < 0.5 ? 0 : base + r(-0.01, 0.01), true);
      sim.ctl.p1.set(Math.round(r(0, 360)), true); sim.ctl.p2.set(Math.round(r(0, 360)), true);
      sim.ctl.a3.set(r(0, 0.6), true); sim.ctl.g.set(r(0.002, 0.008));
    });
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, W = cv.w, H = cv.h;
      EM.draw.clear(cv);
      const R = Math.min(W, H) * 0.32, cx = W / 2, cy = H / 2;
      const pts = [];
      const n = 9000, T = 600;
      for (let i = 0; i <= n; i++) {
        const t = (T * i) / n, e = Math.exp(-p.g * t), w = 2 * Math.PI * 0.05;
        const x = e * (Math.sin(w * p.f1 * t + M.rad(p.p1)) + p.a3 * Math.sin(w * p.f3 * t));
        const y = e * (Math.sin(w * p.f2 * t + M.rad(p.p2)) + p.a3 * Math.cos(w * p.f3 * t));
        pts.push([cx + R * x, cy - R * y]);
      }
      EM.draw.poly(ctx, pts, { color: '--accent', width: 0.7, alpha: 0.75 });
    });
  });
})();

/* ==== chapters/08-nolineales.js ==== */
/* Capítulo 8 — Oscilaciones no lineales y caos */
(function () {
  'use strict';
  const EM = window.EM, M = EM.M;
  const f2 = (v) => EM.fix(v, 2), f3 = (v) => EM.fix(v, 3);
  const wrapPi = (a) => { a = (a + Math.PI) % (2 * Math.PI); if (a < 0) a += 2 * Math.PI; return a - Math.PI; };

  /* Paso RK4 rápido para sistemas de 2 variables con forzamiento dependiente del tiempo */
  function rk2d(f, t, x, v, h) {
    const a1 = f(t, x, v), k1x = v;
    const a2 = f(t + h / 2, x + (h / 2) * k1x, v + (h / 2) * a1), k2x = v + (h / 2) * a1;
    const a3 = f(t + h / 2, x + (h / 2) * k2x, v + (h / 2) * a2), k3x = v + (h / 2) * a2;
    const a4 = f(t + h, x + h * k3x, v + h * a3), k4x = v + h * a3;
    return [x + (h / 6) * (k1x + 2 * k2x + 2 * k3x + k4x), v + (h / 6) * (a1 + 2 * a2 + 2 * a3 + a4)];
  }
  EM.rk2d = rk2d;

  /* ======================================================================
     8.1 Oscilador anarmónico
     ====================================================================== */
  EM.defineSim('anharmonic', function (sim) {
    sim.cols2();
    const ct = sim.canvas({ aspect: 1.2 });
    const cs = sim.canvas({ aspect: 1.2 });
    sim.slider('al', { label: 'Coeficiente cuadrático <i>α</i>', min: -1, max: 1, step: 0.01, value: 0, unit: 's⁻²m⁻¹', fmt: f2 });
    sim.slider('be', { label: 'Coeficiente cúbico <i>β</i>', min: -1, max: 3, step: 0.01, value: 1, unit: 's⁻²m⁻²', fmt: f2 });
    sim.slider('A', { label: 'Amplitud inicial <i>A</i>', min: 0.05, max: 1.5, step: 0.01, value: 0.8, unit: 'm', fmt: f2 });
    sim.note('<i>ω</i><sub>0</sub> = 1 rad/s. La masa parte del reposo en <i>x</i> = <i>A</i>.');
    sim.out('w', 'Frecuencia medida', { hl: true });
    sim.out('wl', 'Predicción de Lindstedt');
    sim.out('mean', 'Posición media');
    sim.out('h', 'Armónicos (amplitud relativa)');
    let cache = null;
    sim.onDraw(() => {
      const p = sim.p;
      const key = p.al + ',' + p.be + ',' + p.A;
      if (!cache || cache.key !== key) {
        const N = 4096, Tt = 40 * 2 * Math.PI, h = Tt / N;
        const xs = new Float64Array(N);
        let x = p.A, v = 0, esc = false;
        const f = (t, x, v) => -x - p.al * x * x - p.be * x * x * x;
        for (let i = 0; i < N; i++) {
          xs[i] = x;
          for (let s = 0; s < 4; s++) [x, v] = rk2d(f, 0, x, v, h / 4);
          if (!isFinite(x) || Math.abs(x) > 50) { esc = true; break; }
        }
        /* frecuencia por cruces de la media */
        let mean = 0;
        for (let i = 0; i < N; i++) mean += xs[i];
        mean /= N;
        const cr = [];
        for (let i = 1; i < N; i++) if (xs[i - 1] < mean && xs[i] >= mean) cr.push(i - 1 + (mean - xs[i - 1]) / (xs[i] - xs[i - 1]));
        const w = cr.length > 2 ? (2 * Math.PI * (cr.length - 1)) / ((cr[cr.length - 1] - cr[0]) * h) : NaN;
        /* espectro por FFT con ventana de Hann */
        const re = new Float64Array(N), im = new Float64Array(N);
        for (let i = 0; i < N; i++) re[i] = (xs[i] - mean) * (0.5 - 0.5 * Math.cos((2 * Math.PI * i) / N));
        EM.fft(re, im);
        const spec = [];
        for (let k = 0; k < N / 2; k++) spec.push(Math.hypot(re[k], im[k]));
        cache = { key, xs, h, w, mean, spec, esc, dw: (2 * Math.PI) / (N * h) };
      }
      const C = cache;
      EM.draw.clear(ct);
      const pt = new EM.Plot(ct.ctx, { x: 0, y: 0, w: ct.w, h: ct.h, xmin: 0, xmax: 4 * 2 * Math.PI, ymin: -1.8, ymax: 1.8, xlabel: 't (s)', ylabel: 'x (m)', ml: 52 });
      pt.frame();
      pt.fn((t) => p.A * Math.cos(t), { color: '--ink-3', width: 1.2, dash: [5, 4] });
      const n4 = Math.floor((8 * Math.PI) / C.h);
      pt.xy(Array.from({ length: n4 }, (_, i) => i * C.h), Array.from(C.xs.slice(0, n4)), { color: '--accent', width: 2.2 });
      pt.legend([{ label: 'oscilador real', color: '--accent' }, { label: 'MAS de igual amplitud', color: '--ink-3', dash: [5, 4] }], 'br');
      EM.draw.clear(cs);
      const ps = new EM.Plot(cs.ctx, { x: 0, y: 0, w: cs.w, h: cs.h, xmin: 0, xmax: 6, ymin: 1e-5, ymax: 2, ylog: true, xlabel: 'ω (rad/s)', ylabel: 'espectro (relativo)', ml: 52 });
      ps.frame();
      const mx = Math.max(...C.spec);
      const ks = C.spec.map((_, k) => k * C.dw), vs = C.spec.map((s) => Math.max(1e-6, s / mx));
      ps.xy(ks, vs, { color: '--c1', width: 1.6, fill: '--c1', fillAlpha: 0.12, base: 1e-5 });
      if (isFinite(C.w)) for (let n = 1; n <= 5; n++) ps.vline(n * C.w, { color: '--ink-3', alpha: 0.5, label: n + 'ω' });
      const hs = [];
      if (isFinite(C.w)) for (let n = 2; n <= 4; n++) { const k = Math.round((n * C.w) / C.dw); let m = 0; for (let j = k - 3; j <= k + 3; j++) if (C.spec[j]) m = Math.max(m, C.spec[j]); hs.push(n + 'ω: ' + EM.sci(m / mx, 2)); }
      sim.set('w', C.esc ? 'la partícula escapa del pozo' : EM.fix(C.w, 4) + ' rad/s');
      sim.set('wl', EM.fix(1 + (3 * p.be * p.A * p.A) / 8, 4) + ' rad/s (sólo β)');
      sim.set('mean', EM.fix(C.mean, 4) + ' m');
      sim.set('h', hs.join(' · '));
    });
  });

  /* ======================================================================
     8.2 Barrido de frecuencia en Duffing
     ====================================================================== */
  EM.defineSim('duffing-sweep', function (sim) {
    sim.cols2();
    const cv = sim.canvas({ aspect: 1.5, cls: 'full' });
    sim.slider('be', { label: 'No linealidad <i>β</i>', min: -0.3, max: 1, step: 0.01, value: 0.4, fmt: f2, onInput: () => reset() });
    sim.slider('g', { label: 'Amortiguamiento <i>γ</i>', min: 0.02, max: 0.5, step: 0.005, value: 0.08, fmt: f3, onInput: () => reset() });
    sim.slider('F', { label: 'Fuerza <i>F</i><sub>0</sub>/<i>m</i>', min: 0.02, max: 0.5, step: 0.005, value: 0.25, fmt: f3, onInput: () => reset() });
    sim.seg('dir', { label: 'Barrido', options: [[1, 'Subiendo ω'], [-1, 'Bajando ω']], value: 1, onInput: () => { sweeping = true; } });
    sim.button('Barrer', () => { sweeping = true; }, { primary: true });
    sim.button('Borrar puntos', () => { pts.length = 0; });
    sim.note('<i>ω</i><sub>0</sub> = 1. Cada punto se mide tras dejar que el sistema se acomode a la nueva frecuencia, sin reiniciarlo.');
    sim.out('w', 'Frecuencia actual <i>ω</i>', { hl: true });
    sim.out('A', 'Amplitud medida');
    let x = 0, v = 0, t = 0, w = 0.5, sweeping = false;
    const pts = [];
    const reset = () => { x = 0; v = 0; t = 0; pts.length = 0; w = sim.p.dir > 0 ? 0.5 : 2.2; sweeping = false; };
    reset();
    sweeping = true;
    sim.animate(() => {
      if (!sweeping) return;
      const p = sim.p;
      const f = (tt, x, v) => p.F * Math.cos(w * tt) - p.g * v - x - p.be * x * x * x;
      const T = (2 * Math.PI) / w, nper = 30, steps = 60;
      let amp = 0;
      for (let k = 0; k < nper; k++) for (let s = 0; s < steps; s++) { [x, v] = rk2d(f, t, x, v, T / steps); t += T / steps; if (k >= nper - 4) amp = Math.max(amp, Math.abs(x)); }
      pts.push([w, amp, p.dir]);
      w += 0.01 * p.dir;
      if (w > 2.2 || w < 0.5) { sweeping = false; w = M.clamp(w, 0.5, 2.2); }
    }, { autoplay: true });
    sim.onDraw(() => {
      const p = sim.p;
      EM.draw.clear(cv);
      const Amax = Math.min(8, Math.max(1, p.F / (p.g * 1) * 1.15));
      const pl = new EM.Plot(cv.ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: 0.5, xmax: 2.2, ymin: 0, ymax: Amax, xlabel: 'ω / ω₀', ylabel: 'amplitud A', ml: 52 });
      pl.frame();
      /* curva teórica: para cada A, raíces en u = ω² */
      const br1 = [], br2 = [];
      for (let i = 1; i <= 600; i++) {
        const A = (Amax * i) / 600, c = 1 + 0.75 * p.be * A * A, g2 = p.g * p.g;
        const B = 2 * c - g2, Cq = c * c - (p.F * p.F) / (A * A), D = B * B - 4 * Cq;
        if (D < 0) continue;
        const u1 = (B + Math.sqrt(D)) / 2, u2 = (B - Math.sqrt(D)) / 2;
        if (u1 > 0) br1.push([Math.sqrt(u1), A]);
        if (u2 > 0) br2.push([Math.sqrt(u2), A]);
      }
      pl.path(br1, { color: '--ink-3', width: 1.4, dash: [5, 4] });
      pl.path(br2, { color: '--ink-3', width: 1.4, dash: [5, 4] });
      pl.fn((ww) => p.F / Math.hypot(1 - ww * ww, p.g * ww), { color: '--grid-2', width: 1.2 });
      pts.forEach(([ww, a, d]) => pl.dot(ww, a, { color: d > 0 ? '--c2' : '--c1', r: 3 }));
      pl.vline(w, { color: '--accent' });
      pl.legend([{ label: 'balance armónico', color: '--ink-3', dash: [5, 4] }, { label: 'lineal (β = 0)', color: '--grid-2' }, { label: 'medido subiendo', color: '--c2', kind: 'dot' }, { label: 'medido bajando', color: '--c1', kind: 'dot' }], 'tr');
      sim.set('w', EM.fix(w, 3) + (sweeping ? ' (barriendo…)' : ''));
      sim.set('A', pts.length ? EM.fix(pts[pts.length - 1][1], 3) : '—');
    });
  });

  /* ======================================================================
     8.3 Resonancia paramétrica y péndulo de Kapitza
     ====================================================================== */
  EM.defineSim('parametric', function (sim) {
    sim.cols2();
    const cv = sim.canvas({ aspect: 0.95 });
    const cm = sim.canvas({ aspect: 0.95 });
    const ct = sim.canvas({ aspect: 3.2, cls: 'full' });
    sim.group('Suspensión');
    sim.slider('W', { label: 'Frecuencia <i>Ω</i>/<i>ω</i><sub>0</sub>', min: 0.5, max: 50, value: 2, log: true, step: 0.01, fmt: f2, onInput: () => restart() });
    sim.slider('a', { label: 'Amplitud <i>a</i>/<i>ℓ</i>', min: 0, max: 0.3, step: 0.001, value: 0.075, fmt: f3, onInput: () => restart() });
    sim.slider('g', { label: 'Amortiguamiento <i>γ</i>/<i>ω</i><sub>0</sub>', min: 0, max: 0.3, step: 0.005, value: 0.05, fmt: f3, onInput: () => { chart = null; restart(); } });
    sim.seg('mode', { label: 'Posición inicial', options: [['down', 'Colgando'], ['up', 'Invertido']], value: 'down', onInput: () => restart() });
    sim.resetButton(() => restart());
    sim.out('h', '<i>h</i> = <i>a</i>Ω²/<i>g</i>', { hl: true });
    sim.out('st', 'Reposo');
    sim.out('kap', 'Kapitza: (<i>a</i>/<i>ℓ</i>)²(<i>Ω</i>/<i>ω</i><sub>0</sub>)²');
    /* unidades: ℓ = 1, ω0 = 1 (g = 1) */
    let th, om, t, tr, chart = null;
    const restart = () => { th = sim.p.mode === 'up' ? Math.PI - 0.05 : 0.02; om = 0; t = 0; tr = new EM.Trace(1600); };
    restart();
    const acc = (tt, x, v) => { const p = sim.p, W = p.W, ys = -p.a * W * W * Math.cos(W * tt); return -(1 + ys) * Math.sin(x) - p.g * v; };
    sim.animate((dt) => {
      const p = sim.p, T = (2 * Math.PI) / p.W;
      const n = Math.max(20, Math.ceil((dt * 2.5) / (T / 40)));
      const h = (dt * 2.5) / n;
      for (let i = 0; i < n; i++) { [th, om] = rk2d(acc, t, th, om, h); t += h; }
      tr.push(t, th);
    });
    /* mapa de estabilidad de la ecuación de Mathieu linealizada (Floquet) */
    const buildChart = () => {
      const g = sim.p.g, NX = 70, NY = 44;
      const data = new Float32Array(NX * NY);
      for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) {
        const W = 0.5 + (4 * (i + 0.5)) / NX, hh = (1.2 * (j + 0.5)) / NY;
        const f = (tt, x, v) => -(1 - hh * Math.cos(W * tt)) * x - g * v;
        const T = (2 * Math.PI) / W, n = 120;
        let a = [1, 0], b = [0, 1], tt = 0;
        for (let k = 0; k < n; k++) { a = rk2d(f, tt, a[0], a[1], T / n); b = rk2d(f, tt, b[0], b[1], T / n); tt += T / n; }
        const tr2 = a[0] + b[1], det = a[0] * b[1] - a[1] * b[0];
        const disc = tr2 * tr2 - 4 * det;
        let lam;
        if (disc >= 0) lam = Math.max(Math.abs((tr2 + Math.sqrt(disc)) / 2), Math.abs((tr2 - Math.sqrt(disc)) / 2));
        else lam = Math.sqrt(Math.abs(det));
        data[j * NX + i] = lam;
      }
      chart = { NX, NY, data };
    };
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, W = cv.w, H = cv.h;
      EM.draw.clear(cv);
      const L = Math.min(W, H) * 0.32, cx = W / 2;
      const ys = p.a * Math.cos(p.W * t);
      const py = H * 0.5 - ys * L;
      ctx.fillStyle = EM.alpha('--ink-3', 0.5); ctx.fillRect(cx - 30, py - 6, 60, 6);
      const bx = cx + L * Math.sin(th), by = py + L * Math.cos(th);
      ctx.strokeStyle = EM.col('--ink-2'); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cx, py); ctx.lineTo(bx, by); ctx.stroke();
      EM.draw.bob(ctx, bx, by, 11, { color: '--accent' });
      ctx.fillStyle = EM.col('--ink'); ctx.beginPath(); ctx.arc(cx, py, 4, 0, 7); ctx.fill();
      EM.draw.clear(cm);
      const pm = new EM.Plot(cm.ctx, { x: 0, y: 0, w: cm.w, h: cm.h, xmin: 0.5, xmax: 4.5, ymin: 0, ymax: 1.2, xlabel: 'Ω / ω₀', ylabel: 'h', ml: 52 });
      pm.frame();
      if (!chart) buildChart();
      const cw = pm.iw / chart.NX, chh = pm.ih / chart.NY;
      for (let j = 0; j < chart.NY; j++) for (let i = 0; i < chart.NX; i++) {
        const l = chart.data[j * chart.NX + i];
        if (l > 1.0005) { cm.ctx.fillStyle = EM.alpha('--c2', Math.min(0.55, 0.15 + 0.4 * Math.log(l))); cm.ctx.fillRect(pm.ix + i * cw, pm.iy + pm.ih - (j + 1) * chh, cw + 0.5, chh + 0.5); }
      }
      pm.label(2.05, 1.1, 'inestable', { color: '--c2', size: 11 });
      const hcur = p.a * p.W * p.W;
      if (p.W <= 4.5) pm.dot(p.W, Math.min(hcur, 1.19), { color: '--accent', r: 6 });
      else pm.label(3.2, 0.1, 'Ω fuera del mapa', { color: '--ink-3', size: 11 });
      EM.draw.clear(ct);
      const span = 60, t0 = Math.max(0, t - span);
      const pt = new EM.Plot(ct.ctx, { x: 0, y: 0, w: ct.w, h: ct.h, xmin: t0, xmax: t0 + span, ymin: -200, ymax: 200, xlabel: 't (1/ω₀)', ylabel: 'θ (°)', ml: 52, yticks: [-180, 0, 180] });
      pt.frame();
      pt.xy(tr.t, tr.col(0).map((a) => M.deg(wrapPi(a))), { color: '--accent', width: 1.6, breakJumps: true });
      sim.set('h', EM.fix(hcur, 3));
      let stable = '—';
      if (p.mode === 'down' && p.W <= 4.5 && chart) {
        const i = Math.floor(((p.W - 0.5) / 4) * chart.NX), j = Math.floor((hcur / 1.2) * chart.NY);
        stable = j >= chart.NY ? 'fuera del mapa' : chart.data[j * chart.NX + M.clamp(i, 0, chart.NX - 1)] > 1.0005 ? 'inestable: la oscilación crece' : 'estable';
      }
      sim.set('st', stable);
      const kap = (p.a * p.W) ** 2;
      sim.set('kap', EM.fix(kap, 3) + (kap > 2 ? ' > 2: invertido estable' : ' < 2: invertido inestable'));
    });
  });

  /* ======================================================================
     8.4 Van der Pol
     ====================================================================== */
  EM.defineSim('van-der-pol', function (sim) {
    sim.cols2();
    const cp = sim.canvas({ aspect: 1 });
    const ct = sim.canvas({ aspect: 1 });
    sim.slider('mu', { label: 'Parámetro <i>μ</i>', min: 0.05, max: 8, step: 0.05, value: 1, fmt: f2, onInput: () => { trajs.forEach((q) => { q.tr = []; }); } });
    sim.button('Borrar trayectorias', () => { trajs.length = 0; });
    sim.hint('Haz clic en el plano de fases para lanzar trayectorias', cp);
    sim.out('A', 'Amplitud del ciclo límite', { hl: true });
    sim.out('T', 'Período');
    const L = 4, VL = 12;
    const trajs = [];
    const add = (x, v) => { trajs.push({ x, v, tr: [[x, v]], t: 0, xt: [] }); if (trajs.length > 6) trajs.shift(); };
    add(0.1, 0); add(3.5, 3);
    let gp = null;
    EM.pointer(cp, { down: (px, py) => { if (!gp || !gp.inside(px, py)) return null; add(gp.invX(px), gp.invY(py)); sim.redraw(); return null; }, hover: () => 'crosshair' });
    let amp = NaN, per = NaN, lastCross = null;
    sim.animate((dt) => {
      const mu = sim.p.mu;
      const f = (t, x, v) => mu * (1 - x * x) * v - x;
      const n = Math.ceil(30 * (1 + mu / 2));
      trajs.forEach((q, k) => {
        for (let i = 0; i < n; i++) {
          const ox = q.x;
          [q.x, q.v] = rk2d(f, 0, q.x, q.v, (dt * 2.5) / n);
          q.t += (dt * 2.5) / n;
          if (k === trajs.length - 1 && ox < 0 && q.x >= 0) { if (lastCross !== null) per = q.t - lastCross; lastCross = q.t; }
        }
        q.tr.push([q.x, q.v]); if (q.tr.length > 900) q.tr.shift();
        q.xt.push([q.t, q.x]); if (q.xt.length > 900) q.xt.shift();
      });
      const last = trajs[trajs.length - 1];
      if (last) amp = Math.max(...last.tr.slice(-300).map((q) => Math.abs(q[0])));
    });
    const cols = ['--c1', '--c2', '--c3', '--c4', '--c5', '--accent'];
    sim.onDraw(() => {
      EM.draw.clear(cp);
      const vl = Math.min(VL, 3 + sim.p.mu * 1.5);
      gp = new EM.Plot(cp.ctx, { x: 0, y: 0, w: cp.w, h: cp.h, xmin: -L, xmax: L, ymin: -vl, ymax: vl, xlabel: 'x', ylabel: 'ẋ', ml: 52 });
      gp.frame();
      gp.band(-1, 1, { color: '--c3', alpha: 0.07 });
      trajs.forEach((q, i) => { gp.path(q.tr, { color: cols[i % 6], width: 1.6 }); gp.dot(q.x, q.v, { color: cols[i % 6], r: 4.5 }); });
      EM.draw.clear(ct);
      const last = trajs[trajs.length - 1];
      const t1 = last ? last.t : 0;
      const pt = new EM.Plot(ct.ctx, { x: 0, y: 0, w: ct.w, h: ct.h, xmin: Math.max(0, t1 - 30), xmax: Math.max(30, t1), ymin: -L, ymax: L, xlabel: 't', ylabel: 'x', ml: 52 });
      pt.frame();
      trajs.forEach((q, i) => pt.path(q.xt, { color: cols[i % 6], width: 1.6 }));
      sim.set('A', isFinite(amp) ? EM.fix(amp, 3) : '—');
      sim.set('T', isFinite(per) ? EM.fix(per, 3) + ' (2π = 6.283 si μ → 0)' : '—');
    });
  });

  /* ======================================================================
     8.5 Péndulo caótico
     ====================================================================== */
  const WD = 2 / 3, GAM = 0.5;
  const pendF = (F) => (t, x, v) => -GAM * v - Math.sin(x) + F * Math.cos(WD * t);
  EM.defineSim('chaotic-pendulum', function (sim) {
    sim.cols2();
    const cv = sim.canvas({ aspect: 1 });
    const cq = sim.canvas({ aspect: 1 });
    const cd = sim.canvas({ aspect: 3.2, cls: 'full' });
    sim.slider('F', { label: 'Fuerza <i>F</i> (unidades de <i>mLω</i><sub>0</sub>²)', min: 0.5, max: 1.6, step: 0.005, value: 1.15, fmt: f3, onInput: () => restart() });
    sim.slider('d0', { label: 'Diferencia inicial Δ<i>θ</i><sub>0</sub>', min: 1e-9, max: 1e-2, value: 1e-6, log: true, step: 1e-10, unit: 'rad', fmt: (v) => EM.sci(v, 1) });
    sim.slider('sp', { label: 'Velocidad de simulación', min: 1, max: 20, step: 1, value: 6, fmt: (v) => v.toFixed(0) + '×' });
    sim.resetButton(() => restart());
    sim.note('<i>γ</i> = 0.5 <i>ω</i><sub>0</sub>, <i>ω</i> = (2/3) <i>ω</i><sub>0</sub>. Parten del reposo.');
    sim.out('n', 'Períodos de la fuerza');
    sim.out('d', 'Separación |Δ<i>θ</i>|', { hl: true });
    sim.out('lam', 'Exponente de Lyapunov estimado');
    let A, B, t, pc, dl, nextP, lamv;
    const restart = () => { A = [0, 0]; B = [sim.p.d0, 0]; t = 0; pc = []; dl = new EM.Trace(2000); nextP = (2 * Math.PI) / WD * 1; lamv = null; };
    restart();
    sim.animate((dt) => {
      const f = pendF(sim.p.F), h = 0.03;
      const n = Math.round((dt * sim.p.sp) / h) || 1;
      for (let i = 0; i < n; i++) {
        A = rk2d(f, t, A[0], A[1], h); B = rk2d(f, t, B[0], B[1], h); t += h;
        if (t >= nextP) { pc.push([wrapPi(A[0]), A[1]]); nextP += (2 * Math.PI) / WD; if (pc.length > 6000) pc.shift(); }
      }
      const dd = Math.max(1e-16, Math.hypot(B[0] - A[0], B[1] - A[1]));
      dl.push(t, dd);
      if (lamv === null && dd > 0.1 && t > 20) lamv = Math.log(dd / sim.p.d0) / t;
    });
    sim.onDraw(() => {
      const ctx = cv.ctx, W = cv.w, H = cv.h;
      EM.draw.clear(cv);
      const cx = W / 2, cy = H / 2, L = Math.min(W, H) * 0.36;
      ctx.strokeStyle = EM.col('--grid-2'); ctx.beginPath(); ctx.arc(cx, cy, L, 0, 7); ctx.stroke();
      const dp = (th, c, a) => { const bx = cx + L * Math.sin(th), by = cy + L * Math.cos(th); ctx.globalAlpha = a; ctx.strokeStyle = EM.col('--ink-2'); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(bx, by); ctx.stroke(); EM.draw.bob(ctx, bx, by, 10, { color: c }); ctx.globalAlpha = 1; };
      dp(B[0], '--c1', 0.8); dp(A[0], '--accent', 1);
      EM.text(ctx, 'dos péndulos con Δθ₀ = ' + EM.sci(sim.p.d0, 1) + ' rad', 10, H - 10, { size: 11, color: '--ink-3' });
      EM.draw.clear(cq);
      const pq = new EM.Plot(cq.ctx, { x: 0, y: 0, w: cq.w, h: cq.h, xmin: -Math.PI, xmax: Math.PI, ymin: -3, ymax: 3, xpi: true, xlabel: 'θ', ylabel: 'θ̇ / ω₀', title: 'Sección de Poincaré', ml: 52 });
      pq.frame();
      cq.ctx.fillStyle = EM.col('--c5');
      pc.forEach(([x, v], i) => { if (i < 30) return; cq.ctx.fillRect(pq.X(x) - 0.8, pq.Y(v) - 0.8, 1.6, 1.6); });
      EM.draw.clear(cd);
      const pd = new EM.Plot(cd.ctx, { x: 0, y: 0, w: cd.w, h: cd.h, xmin: 0, xmax: Math.max(100, t), ymin: 1e-12, ymax: 100, ylog: true, xlabel: 't (1/ω₀)', ylabel: '|Δ|', ml: 58 });
      pd.frame();
      pd.xy(dl.t, dl.col(0), { color: '--c2', width: 1.6 });
      sim.set('n', EM.fix(t / ((2 * Math.PI) / WD), 0));
      const d = dl.v.length ? dl.v[dl.v.length - 1][0] : 0;
      sim.set('d', EM.sci(d, 2));
      sim.set('lam', lamv !== null ? EM.fix(lamv, 3) + ' ω₀' : t > 60 ? 'separación aún pequeña: no caótico (o lento)' : '—');
    });
  });

  /* ======================================================================
     8.6 Diagrama de bifurcaciones
     ====================================================================== */
  EM.defineSim('bifurcation', function (sim) {
    const cv = sim.canvas({ aspect: 2 });
    sim.slider('F0', { label: 'Fuerza mínima', min: 0.8, max: 1.4, step: 0.01, value: 1.0, fmt: f2, onInput: () => restart() });
    sim.slider('F1', { label: 'Fuerza máxima', min: 1.05, max: 1.6, step: 0.01, value: 1.5, fmt: f2, onInput: () => restart() });
    sim.resetButton(() => restart());
    sim.out('p', 'Progreso', { hl: true });
    sim.note('Para cada valor de <i>F</i> se descartan 120 períodos de transitorio y se marcan 60 puntos de la sección de Poincaré (<i>θ̇</i>). Cada valor de <i>F</i> continúa desde el estado final del anterior.');
    const NF = 360;
    let cols, i, st;
    const restart = () => { cols = []; i = 0; st = [0, 0]; };
    restart();
    sim.animate(() => {
      const p = sim.p;
      for (let rep = 0; rep < 3 && i < NF; rep++, i++) {
        const F = p.F0 + ((p.F1 - p.F0) * i) / (NF - 1);
        const f = pendF(F), T = (2 * Math.PI) / WD, n = 100, h = T / n;
        let x = st[0], v = st[1], t = 0;
        const pts = [];
        for (let k = 0; k < 180; k++) {
          for (let s = 0; s < n; s++) { [x, v] = rk2d(f, t, x, v, h); t += h; }
          if (k >= 120) pts.push(v);
        }
        st = [wrapPi(x), v];
        cols.push([F, pts]);
      }
    });
    sim.onDraw(() => {
      const p = sim.p;
      EM.draw.clear(cv);
      const pl = new EM.Plot(cv.ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: p.F0, xmax: p.F1, ymin: -3, ymax: 3, xlabel: 'amplitud de la fuerza F', ylabel: 'θ̇ en la sección de Poincaré', ml: 58 });
      pl.frame();
      cv.ctx.fillStyle = EM.col('--c1');
      cols.forEach(([F, pts]) => pts.forEach((v) => { const y = pl.Y(v); if (y > pl.iy && y < pl.iy + pl.ih) cv.ctx.fillRect(pl.X(F) - 0.6, y - 0.6, 1.3, 1.3); }));
      sim.set('p', EM.fix((100 * i) / NF, 0) + ' %');
    });
  });
})();

/* ==== chapters/09-acoplados.js ==== */
/* Capítulo 9 — Osciladores acoplados */
(function () {
  'use strict';
  const EM = window.EM, M = EM.M;
  const f2 = (v) => EM.fix(v, 2), f3 = (v) => EM.fix(v, 3);

  /* Autovalores generalizados 2×2: K a = ω² M a con M diagonal */
  function modes2(m1, m2, k11, k12, k22) {
    /* det(K − λM) = m1 m2 λ² − (k11 m2 + k22 m1) λ + (k11 k22 − k12²) = 0 */
    const a = m1 * m2, b = -(k11 * m2 + k22 * m1), c = k11 * k22 - k12 * k12;
    const D = Math.sqrt(Math.max(0, b * b - 4 * a * c));
    const l1 = (-b - D) / (2 * a), l2 = (-b + D) / (2 * a);
    /* vector: (k11 − λ m1) a1 + k12 a2 = 0 → a2/a1 = −(k11 − λ m1)/k12 */
    const r = (l) => (Math.abs(k12) < 1e-12 ? (Math.abs(k11 - l * m1) < 1e-9 ? 0 : 1e9) : -(k11 - l * m1) / k12);
    return [[Math.sqrt(Math.max(0, l1)), r(l1)], [Math.sqrt(Math.max(0, l2)), r(l2)]];
  }
  EM.modes2 = modes2;

  /* Dibuja una fila de masas y resortes entre paredes; xs: posiciones de equilibrio (px), ds: desplazamientos (px) */
  function drawChain(ctx, xL, xR, y, xs, ds, o = {}) {
    EM.draw.support(ctx, xL, y, 70, 'right');
    EM.draw.support(ctx, xR, y, 70, 'left');
    const w = o.w || 40;
    const pos = xs.map((x, i) => x + ds[i]);
    const ends = [xL].concat(pos).concat([xR]);
    for (let i = 0; i < ends.length - 1; i++) {
      const a = i === 0 ? ends[i] : ends[i] + w / 2, b = i === ends.length - 2 ? ends[i + 1] : ends[i + 1] - w / 2;
      const col = o.springCols ? o.springCols[i] : '--ink-2';
      if ((o.walls === false) && (i === 0 || i === ends.length - 2)) continue;
      EM.draw.spring(ctx, a, y, b, y, { coils: o.coils || 8, r: 7, color: col, lead: 6 });
    }
    pos.forEach((x, i) => EM.draw.block(ctx, x, y, o.ws ? o.ws[i] : w, o.hs ? o.hs[i] : 40, { fill: o.fills ? o.fills[i] : '--c1', label: o.labels ? o.labels[i] : null, italic: true }));
  }
  EM.drawChain = drawChain;

  /* ======================================================================
     9.1 Dos masas acopladas
     ====================================================================== */
  EM.defineSim('two-masses', function (sim) {
    sim.cols2();
    const cs = sim.canvas({ aspect: 4.4, cls: 'full fixed' });
    const cx = sim.canvas({ aspect: 1.25 });
    const cq = sim.canvas({ aspect: 1.25 });
    sim.group('Resortes y masa');
    sim.slider('k', { label: 'Resortes externos <i>k</i>', min: 5, max: 100, step: 1, value: 40, unit: 'N/m', fmt: (v) => v.toFixed(0) });
    sim.slider('kc', { label: 'Acoplamiento <i>κ</i>', min: 0, max: 100, step: 0.5, value: 10, unit: 'N/m', fmt: (v) => EM.fix(v, 1) });
    sim.slider('m', { label: 'Masa <i>m</i>', min: 0.2, max: 3, step: 0.05, value: 1, unit: 'kg', fmt: f2 });
    sim.group('Estado inicial');
    sim.seg('ic', { options: [['m1', 'Modo 1'], ['m2', 'Modo 2'], ['one', 'Sólo masa 1'], ['mix', 'Mezcla']], value: 'one', onInput: () => { t = 0; } });
    sim.resetButton(() => { t = 0; });
    sim.out('w1', '<i>ω</i><sub>1</sub> (en fase)', { hl: true });
    sim.out('w2', '<i>ω</i><sub>2</sub> (en oposición)');
    sim.out('tt', 'Tiempo de transferencia <i>π</i>/(<i>ω</i><sub>2</sub> − <i>ω</i><sub>1</sub>)');
    let t = 0;
    sim.onChange = (id) => { if (id !== 'ic') t = 0; };
    sim.animate((dt) => { t += dt; });
    sim.onDraw(() => {
      const p = sim.p, w1 = Math.sqrt(p.k / p.m), w2 = Math.sqrt((p.k + 2 * p.kc) / p.m);
      const IC = { m1: [1, 0], m2: [0, 1], one: [1, 1], mix: [1, 0.4] }[p.ic];
      const A = 0.5;
      const q1 = (tt) => A * IC[0] * Math.cos(w1 * tt), q2 = (tt) => A * IC[1] * Math.cos(w2 * tt);
      const x1 = (tt) => 0.5 * (q1(tt) + q2(tt)), x2 = (tt) => 0.5 * (q1(tt) - q2(tt));
      EM.draw.clear(cs);
      const W = cs.w, H = cs.h, sc = W * 0.16;
      drawChain(cs.ctx, 20, W - 20, H * 0.55, [W * 0.36, W * 0.64], [x1(t) * sc, x2(t) * sc], { labels: ['1', '2'], springCols: ['--ink-2', '--c3', '--ink-2'] });
      const span = Math.max(16, (4 * Math.PI) / Math.max(1e-3, w2 - w1));
      const t0 = Math.max(0, t - Math.min(span, 30));
      const S = Math.min(span, 30);
      EM.draw.clear(cx);
      const px = new EM.Plot(cx.ctx, { x: 0, y: 0, w: cx.w, h: cx.h, xmin: t0, xmax: t0 + S, ymin: -0.6, ymax: 0.6, xlabel: 't (s)', ylabel: 'x₁, x₂ (m)', ml: 52 });
      px.frame();
      px.fn(x1, { color: '--c1', width: 1.8, to: t, n: 1500 });
      px.fn(x2, { color: '--c2', width: 1.8, to: t, n: 1500 });
      px.legend([{ label: 'x₁', color: '--c1' }, { label: 'x₂', color: '--c2' }], 'tr');
      EM.draw.clear(cq);
      const pq = new EM.Plot(cq.ctx, { x: 0, y: 0, w: cq.w, h: cq.h, xmin: t0, xmax: t0 + S, ymin: -0.6, ymax: 0.6, xlabel: 't (s)', ylabel: 'coordenadas normales', ml: 52 });
      pq.frame();
      pq.fn((tt) => 0.5 * q1(tt), { color: '--c3', width: 1.8, to: t, n: 1500 });
      pq.fn((tt) => 0.5 * q2(tt), { color: '--c5', width: 1.8, to: t, n: 1500 });
      pq.legend([{ label: '(x₁ + x₂)/2', color: '--c3' }, { label: '(x₁ − x₂)/2', color: '--c5' }], 'tr');
      sim.set('w1', EM.fix(w1, 3) + ' rad/s');
      sim.set('w2', EM.fix(w2, 3) + ' rad/s');
      sim.set('tt', p.kc > 0 ? EM.fix(Math.PI / (w2 - w1), 3) + ' s' : '∞ (sin acoplamiento)');
    });
  });

  /* ======================================================================
     9.2 Péndulos acoplados
     ====================================================================== */
  EM.defineSim('coupled-pendulums', function (sim) {
    sim.cols2();
    const cv = sim.canvas({ aspect: 1.1 });
    const ce = sim.canvas({ aspect: 1.1 });
    sim.slider('L1', { label: 'Longitud del péndulo 1', min: 0.5, max: 1.5, step: 0.01, value: 1, unit: 'm', fmt: f2, onInput: () => restart() });
    sim.slider('L2', { label: 'Longitud del péndulo 2', min: 0.5, max: 1.5, step: 0.01, value: 1, unit: 'm', fmt: f2, onInput: () => restart() });
    sim.slider('kc', { label: 'Acoplamiento <i>κ</i>/<i>m</i>', min: 0, max: 3, step: 0.01, value: 0.3, unit: 's⁻²', fmt: f2, onInput: () => restart() });
    sim.slider('sp', { label: 'Velocidad', min: 1, max: 6, step: 1, value: 2, fmt: (v) => v + '×' });
    sim.resetButton(() => restart());
    sim.note('El péndulo 1 se suelta desde 10°; el 2 parte en reposo. El resorte está a la mitad de la altura.');
    sim.out('tt', 'Tiempo de transferencia', { hl: true });
    sim.out('max', 'Fracción máxima de energía transferida');
    const g = 9.81;
    let y, t, tr, maxE2;
    const restart = () => { y = [M.rad(10), 0, 0, 0]; t = 0; tr = new EM.Trace(3000); maxE2 = 0; };
    restart();
    /* coordenadas: θ1, ω1, θ2, ω2 con lineal; resorte a mitad de longitud del más corto */
    const f = (tt, s) => {
      const p = sim.p, h = 0.5 * Math.min(p.L1, p.L2);
      const d = h * (s[2] - s[0]);
      return [s[1], -(g / p.L1) * s[0] + (p.kc * h * d) / (p.L1 * p.L1), s[3], -(g / p.L2) * s[2] - (p.kc * h * d) / (p.L2 * p.L2)];
    };
    const energies = (s) => { const p = sim.p, h = 0.5 * Math.min(p.L1, p.L2); const E1 = 0.5 * p.L1 * p.L1 * s[1] * s[1] + 0.5 * g * p.L1 * s[0] * s[0]; const E2 = 0.5 * p.L2 * p.L2 * s[3] * s[3] + 0.5 * g * p.L2 * s[2] * s[2]; const Ec = 0.5 * p.kc * (h * (s[2] - s[0])) ** 2; return [E1, E2, Ec]; };
    sim.animate((dt) => {
      const T = dt * sim.p.sp;
      y = EM.integrate(f, t, y, t + T, 12);
      t += T;
      const [E1, E2] = energies(y);
      tr.push(t, E1, E2);
      const E0 = 0.5 * g * sim.p.L1 * M.rad(10) ** 2;
      maxE2 = Math.max(maxE2, E2 / E0);
    });
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, W = cv.w, H = cv.h;
      EM.draw.clear(cv);
      const sc = (H * 0.75) / 1.5, x1 = W * 0.33, x2 = W * 0.67, top = 14;
      EM.draw.support(ctx, W / 2, top, W * 0.7, 'down');
      const b1 = [x1 + p.L1 * sc * Math.sin(y[0]), top + p.L1 * sc * Math.cos(y[0])];
      const b2 = [x2 + p.L2 * sc * Math.sin(y[2]), top + p.L2 * sc * Math.cos(y[2])];
      const h = 0.5 * Math.min(p.L1, p.L2);
      const s1 = [x1 + h * sc * Math.sin(y[0]), top + h * sc * Math.cos(y[0])], s2 = [x2 + h * sc * Math.sin(y[2]), top + h * sc * Math.cos(y[2])];
      ctx.strokeStyle = EM.col('--ink-2'); ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(x1, top); ctx.lineTo(b1[0], b1[1]); ctx.moveTo(x2, top); ctx.lineTo(b2[0], b2[1]); ctx.stroke();
      if (p.kc > 0) EM.draw.spring(ctx, s1[0], s1[1], s2[0], s2[1], { coils: 9, r: 5, color: '--c3', lead: 4 });
      EM.draw.bob(ctx, b1[0], b1[1], 12, { color: '--c1' });
      EM.draw.bob(ctx, b2[0], b2[1], 12, { color: '--c2' });
      EM.draw.clear(ce);
      const E0 = 0.5 * g * p.L1 * M.rad(10) ** 2;
      const span = 40, t0 = Math.max(0, t - span);
      const pe = new EM.Plot(ce.ctx, { x: 0, y: 0, w: ce.w, h: ce.h, xmin: t0, xmax: t0 + span, ymin: 0, ymax: 1.1, xlabel: 't (s)', ylabel: 'energía / E₀', ml: 52 });
      pe.frame();
      pe.xy(tr.t, tr.col(0).map((e) => e / E0), { color: '--c1', width: 1.8 });
      pe.xy(tr.t, tr.col(1).map((e) => e / E0), { color: '--c2', width: 1.8 });
      pe.legend([{ label: 'péndulo 1', color: '--c1' }, { label: 'péndulo 2', color: '--c2' }], 'tr');
      /* frecuencias normales del sistema linealizado */
      const kk = p.kc * h * h;
      const md = modes2(p.L1 * p.L1, p.L2 * p.L2, g * p.L1 + kk, -kk, g * p.L2 + kk);
      sim.set('tt', p.kc > 0 ? EM.fix(Math.PI / (md[1][0] - md[0][0]), 2) + ' s' : '∞');
      sim.set('max', EM.fix(100 * Math.min(1, maxE2), 1) + ' %');
    });
  });

  /* ======================================================================
     9.3 Calculadora de modos normales
     ====================================================================== */
  EM.defineSim('normal-modes', function (sim) {
    sim.cols2();
    const c1 = sim.canvas({ aspect: 3, cls: 'full fixed' });
    const c2 = sim.canvas({ aspect: 3, cls: 'full fixed' });
    sim.group('Masas');

  /* ======================================================================
     9.4 Absorbedor dinámico
     ====================================================================== */
  EM.defineSim('vibration-absorber', function (sim) {
    sim.cols2();
    const cs = sim.canvas({ aspect: 0.85 });
    const cp = sim.canvas({ aspect: 0.85 });
    sim.group('Máquina');
    sim.note('<i>M</i> = 1, <i>K</i> = 1 (frecuencia propia 1), amortiguamiento propio 0.02.');
    sim.slider('w', { label: 'Frecuencia de excitación <i>ω</i>', min: 0.3, max: 2, step: 0.002, value: 1, fmt: f3 });
    sim.group('Absorbedor');
    sim.check('on', { label: 'Instalar absorbedor', value: true });
    sim.slider('mu', { label: 'Razón de masas <i>m</i><sub>a</sub>/<i>M</i>', min: 0.01, max: 0.5, step: 0.01, value: 0.1, fmt: f2 });
    sim.slider('wa', { label: 'Sintonía √(<i>k<sub>a</sub></i>/<i>m<sub>a</sub></i>)', min: 0.5, max: 1.5, step: 0.005, value: 1, fmt: f3 });
    sim.slider('za', { label: 'Amortiguamiento del absorbedor <i>ζ<sub>a</sub></i>', min: 0, max: 0.3, step: 0.005, value: 0.01, fmt: f3 });
    sim.out('X', 'Amplitud de la máquina / (<i>F</i><sub>0</sub>/<i>K</i>)', { hl: true });
    sim.out('Xa', 'Amplitud del absorbedor');
    /* respuesta compleja del sistema 2 GDL */
    const solve = (w) => {
      const p = sim.p;
      const c1 = 0.04; /* 2ζω₀ con ζ = 0.02 */
      if (!p.on) { const d = [1 - w * w, c1 * w]; const m = d[0] * d[0] + d[1] * d[1]; return [[d[0] / m, -d[1] / m], [0, 0]]; }
      const ma = p.mu, ka = ma * p.wa * p.wa, ca = 2 * p.za * ma * p.wa;
      /* [K1+ka − w² + i w(c1+ca), −(ka + i w ca); −(ka + i w ca), ka − ma w² + i w ca] [X;Xa] = [1;0] */
      const A = [1 + ka - w * w, w * (c1 + ca)], B = [-ka, -w * ca], D = [ka - ma * w * w, w * ca];
      const mul = (a, b) => [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]];
      const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
      const div = (a, b) => { const m = b[0] * b[0] + b[1] * b[1]; return [(a[0] * b[0] + a[1] * b[1]) / m, (a[1] * b[0] - a[0] * b[1]) / m]; };
      const det = sub(mul(A, D), mul(B, B));
      const X = div(D, det), Xa = div([-B[0], -B[1]], det);
      return [X, Xa];
    };
    let t = 0;
    sim.animate((dt) => { t += dt; });
    sim.onDraw(() => {
      const p = sim.p;
      const [X, Xa] = solve(p.w);
      const ctx = cs.ctx, W = cs.w, H = cs.h;
      EM.draw.clear(cs);
      const ph = 2 * Math.PI * 0.7 * t;
      const sc = 7;
      const xm = sc * Math.min(4, Math.hypot(X[0], X[1])) * Math.cos(ph + Math.atan2(X[1], X[0]));
      const xa = sc * Math.min(6, Math.hypot(Xa[0], Xa[1])) * Math.cos(ph + Math.atan2(Xa[1], Xa[0]));
      const yM = H * 0.38 - xm, yA = H * 0.74 - xa;
      ctx.fillStyle = EM.alpha('--ink-3', 0.4); ctx.fillRect(W * 0.15, 8, W * 0.7, 8);
      EM.draw.spring(ctx, W * 0.5, 16, W * 0.5, yM - 30, { coils: 7, r: 9 });
      EM.draw.block(ctx, W * 0.5, yM, W * 0.5, 56, { label: 'máquina', fill: '--c1' });
      EM.draw.arrow(ctx, W * 0.82, yM, W * 0.82, yM - 26 * Math.cos(ph), { color: '--c2', width: 2.4 });
      if (p.on) {
        EM.draw.spring(ctx, W * 0.5, yM + 28, W * 0.5, yA - 16, { coils: 6, r: 7, color: '--c3' });
        EM.draw.block(ctx, W * 0.5, yA, 60 + 80 * p.mu, 30, { label: 'absorbedor', fill: '--c3', size: 11 });
      }
      EM.draw.clear(cp);
      const pl = new EM.Plot(cp.ctx, { x: 0, y: 0, w: cp.w, h: cp.h, xmin: 0.3, xmax: 2, ymin: 0.01, ymax: 40, ylog: true, xlabel: 'ω / ω₀', ylabel: 'X / (F₀/K)', ml: 52 });
      pl.frame();
      const on = p.on;
      p.on = false; pl.fn((w) => { const r = solve(w)[0]; return Math.hypot(r[0], r[1]); }, { color: '--grid-2', width: 1.4, n: 600 }); p.on = on;
      pl.fn((w) => { const r = solve(w)[0]; return Math.hypot(r[0], r[1]); }, { color: '--c1', width: 2.2, n: 900 });
      if (p.on) pl.vline(p.wa, { color: '--c3', label: 'sintonía' });
      pl.dot(p.w, Math.hypot(X[0], X[1]), { color: '--accent', r: 6 });
      sim.set('X', EM.fix(Math.hypot(X[0], X[1]), 4));
      sim.set('Xa', p.on ? EM.fix(Math.hypot(Xa[0], Xa[1]), 3) : '—');
    });
  });

  /* ======================================================================

  EM.defineSim('triatomic', function (sim) {
    const cv = sim.canvas({ aspect: 3, cls: 'fixed' });
    sim.slider('mo', { label: 'Masa de los extremos', min: 1, max: 40, step: 1, value: 16, unit: 'u', fmt: (v) => v.toFixed(0) });
    sim.slider('mc', { label: 'Masa central', min: 1, max: 40, step: 1, value: 12, unit: 'u', fmt: (v) => v.toFixed(0) });
    sim.seg('mode', { label: 'Modo', options: [['tr', 'Traslación'], ['s', 'Simétrico'], ['a', 'Asimétrico'], ['mix', 'Mezcla']], value: 'a' });
    sim.out('r', '<i>ω<sub>a</sub></i>/<i>ω<sub>s</sub></i>', { hl: true });
    sim.out('ir', 'Momento dipolar oscilante');
    let t = 0;
    sim.animate((dt) => { t += dt; });
    sim.onDraw(() => {
      const p = sim.p, ws = 1, wa = Math.sqrt(1 + (2 * p.mo) / p.mc);
      const ctx = cv.ctx, W = cv.w, H = cv.h, y = H / 2;
      EM.draw.clear(cv);
      const A = 18;
      let d;
      const cs = Math.cos(2.4 * ws * t), ca = Math.cos(2.4 * wa * t);
      if (p.mode === 'tr') d = [1, 1, 1].map((v) => v * 0.8 * A * Math.sin(1.5 * t));
      else if (p.mode === 's') d = [-A * cs, 0, A * cs];
      else if (p.mode === 'a') { const r = (-2 * p.mo) / p.mc; d = [A * ca, A * r * ca, A * ca]; }
      else { const r = (-2 * p.mo) / p.mc; d = [-A * cs + A * 0.6 * ca, A * 0.6 * r * ca, A * cs + A * 0.6 * ca]; }
      const xs = [W * 0.3, W * 0.5, W * 0.7];
      const pos = xs.map((x, i) => x + d[i]);
      EM.draw.spring(ctx, pos[0] + 16, y, pos[1] - 18, y, { coils: 6, r: 6, lead: 3 });
      EM.draw.spring(ctx, pos[1] + 18, y, pos[2] - 16, y, { coils: 6, r: 6, lead: 3 });
      const rad = (m) => 10 + 2.2 * Math.sqrt(m);
      EM.draw.bob(ctx, pos[0], y, rad(p.mo), { color: '--c2', label: 'O' });
      EM.draw.bob(ctx, pos[1], y, rad(p.mc), { color: '--ink-2', label: 'C' });
      EM.draw.bob(ctx, pos[2], y, rad(p.mo), { color: '--c2', label: 'O' });
      xs.forEach((x) => { ctx.strokeStyle = EM.col('--grid-2'); ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(x, y - 50); ctx.lineTo(x, y + 50); ctx.stroke(); ctx.setLineDash([]); });
      sim.set('r', EM.fix(wa, 4) + (p.mo === 16 && p.mc === 12 ? ' (medido en CO₂: 1.69)' : ''));
      sim.set('ir', p.mode === 'a' || p.mode === 'mix' ? 'sí: absorbe infrarrojo' : p.mode === 's' ? 'no (simétrico)' : 'no');
    });
  });
})();

/* Capítulo 10 — La cadena de osciladores */
(function () {
  'use strict';
  const EM = window.EM, M = EM.M;
  const f2 = (v) => EM.fix(v, 2), f3 = (v) => EM.fix(v, 3);

  /* Dibuja cuentas sobre un hilo: ys en unidades de amplitud (±1 → ±A píxeles) */
  function drawBeads(ctx, x0, x1, y0, A, ys, o = {}) {
    const N = ys.length, dx = (x1 - x0) / (N + 1);
    const pts = [[x0, y0]];
    ys.forEach((y, i) => pts.push([x0 + dx * (i + 1), y0 - y * A]));
    pts.push([x1, y0]);
    if (o.ends !== false) { ctx.fillStyle = EM.col('--ink-2'); ctx.fillRect(x0 - 6, y0 - 14, 6, 28); ctx.fillRect(x1, y0 - 14, 6, 28); }
    EM.draw.poly(ctx, pts, { color: '--ink-3', width: 1.3 });
    const r = Math.max(3, Math.min(9, dx * 0.28));
    pts.slice(1, -1).forEach(([x, y]) => EM.draw.bob(ctx, x, y, r, { color: o.color || '--c1' }));
    return dx;
  }
  EM.drawBeads = drawBeads;

  /* ======================================================================
     10.1 Modos de N cuentas
     ====================================================================== */
  EM.defineSim('bead-modes', function (sim) {
    const cv = sim.canvas({ aspect: 2.3 });
    sim.slider('N', { label: 'Número de cuentas <i>N</i>', min: 1, max: 30, step: 1, value: 5, fmt: (v) => v.toFixed(0), onInput: () => { sim.ctl.p.range(1, sim.p.N, 1); if (sim.p.p > sim.p.N) sim.ctl.p.set(sim.p.N, true); t = 0; } });
    sim.slider('p', { label: 'Modo <i>p</i>', min: 1, max: 5, step: 1, value: 1, fmt: (v) => v.toFixed(0), onInput: () => { t = 0; } });
    sim.seg('ic', { label: 'Movimiento', options: [['mode', 'Un modo'], ['two', 'Modos 1 + p'], ['pluck', 'Pulsar']], value: 'mode', onInput: () => { t = 0; } });
    sim.check('env', { label: 'Mostrar la sinusoide del modo', value: true });
    sim.out('w', '<i>ω<sub>p</sub></i>/<i>ω</i><sub>0</sub>', { hl: true });
    sim.out('lam', 'Longitud de onda / <i>a</i>');
    sim.out('r', '<i>ω<sub>p</sub></i>/<i>ω</i><sub>1</sub> (cuerda continua: <i>p</i>)');
    let t = 0;
    sim.animate((dt) => { t += dt; });
    sim.onDraw(() => {
      const p = sim.p, N = p.N, P = p.p;
      const w = (q) => 2 * Math.sin((q * Math.PI) / (2 * (N + 1)));
      const shape = (q, n) => Math.sin((n * q * Math.PI) / (N + 1));
      const sp = 2.2;
      let amps;
      if (p.ic === 'mode') { amps = new Array(N).fill(0); amps[P - 1] = 0.9; }
      else if (p.ic === 'two') { amps = new Array(N).fill(0); amps[0] = 0.55; if (P > 1) amps[P - 1] += 0.35; }
      else {
        /* triángulo con vértice en la cuenta más cercana a 1/4: proyección modal */
        const j = Math.max(1, Math.round((N + 1) / 4));
        const y0 = []; for (let n = 1; n <= N; n++) y0.push(n <= j ? n / j : (N + 1 - n) / (N + 1 - j));
        amps = []; for (let q = 1; q <= N; q++) { let s = 0; for (let n = 1; n <= N; n++) s += y0[n - 1] * shape(q, n); amps.push((0.9 * 2 * s) / (N + 1)); }
      }
      const ys = [];
      for (let n = 1; n <= N; n++) { let y = 0; for (let q = 1; q <= N; q++) if (amps[q - 1]) y += amps[q - 1] * shape(q, n) * Math.cos(w(q) * sp * t); ys.push(y); }
      EM.draw.clear(cv);
      const ctx = cv.ctx, W = cv.w, H = cv.h, A = H * 0.36;
      const x0 = 30, x1 = W - 30;
      if (p.env && p.ic === 'mode') {
        const c = Math.cos(w(P) * sp * t);
        const pts = [];
        for (let i = 0; i <= 300; i++) { const u = i / 300; pts.push([x0 + (x1 - x0) * u, H / 2 - 0.9 * A * Math.sin(u * (N + 1) * (P * Math.PI) / (N + 1)) * c]); }
        EM.draw.poly(ctx, pts, { color: '--accent', width: 1.4, dash: [5, 4], alpha: 0.8 });
      }
      drawBeads(ctx, x0, x1, H / 2, A, ys);
      sim.set('w', EM.fix(w(P), 4));
      sim.set('lam', EM.fix((2 * (N + 1)) / P, 3));
      sim.set('r', EM.fix(w(P) / w(1), 4) + ' (vs ' + P + ')');
    });
  });

  /* ======================================================================
     10.2 Relación de dispersión y aliasing
     ====================================================================== */
  EM.defineSim('chain-dispersion', function (sim) {
    sim.cols2();
    const cd = sim.canvas({ aspect: 1.2 });
    const cw = sim.canvas({ aspect: 1.2 });
    sim.slider('k', { label: 'Número de onda <i>ka</i>', min: -9.4, max: 9.4, step: 0.01, value: 1.2, unit: 'rad', fmt: f2 });
    sim.check('alias', { label: 'Mostrar la onda equivalente de la primera zona', value: true });
    sim.out('w', '<i>ω</i>/<i>ω</i><sub>0</sub>', { hl: true });
    sim.out('kr', '<i>ka</i> reducido a (−π, π]');
    sim.out('vp', 'Velocidad de fase / (<i>ω</i><sub>0</sub><i>a</i>)');
    sim.out('vg', 'Velocidad de grupo / (<i>ω</i><sub>0</sub><i>a</i>)');
    let t = 0;
    sim.animate((dt) => { t += dt; });
    sim.onDraw(() => {
      const p = sim.p, ka = p.k;
      const w = 2 * Math.abs(Math.sin(ka / 2));
      const kr = ka - 2 * Math.PI * Math.round(ka / (2 * Math.PI));
      EM.draw.clear(cd);
      const pd = new EM.Plot(cd.ctx, { x: 0, y: 0, w: cd.w, h: cd.h, xmin: -3 * Math.PI, xmax: 3 * Math.PI, ymin: 0, ymax: 2.4, xpi: true, xlabel: 'ka', ylabel: 'ω / ω₀', ml: 52 });
      pd.frame();
      pd.band(-Math.PI, Math.PI, { color: '--c3', alpha: 0.08 });
      pd.fn((x) => Math.abs(x), { color: '--ink-3', width: 1.2, dash: [5, 4] });
      pd.fn((x) => 2 * Math.abs(Math.sin(x / 2)), { color: '--c1', width: 2.2, n: 900 });
      pd.hline(2, { color: '--c2', label: 'corte 2ω₀', labelRight: true });
      pd.dot(ka, w, { color: '--accent', r: 6 });
      if (p.alias && Math.abs(kr - ka) > 1e-6) pd.dot(kr, w, { color: '--c3', r: 5 });
      EM.draw.clear(cw);
      const ctx = cw.ctx, W = cw.w, H = cw.h;
      const N = 12, x0 = 20, x1 = W - 20, dx = (x1 - x0) / N, A = H * 0.3;
      const sgn = Math.sin(ka / 2) >= 0 ? 1 : -1;
      const ph = sgn * w * 1.6 * t;
      /* onda continua con k original */
      const pts = [], pr = [];
      for (let i = 0; i <= 600; i++) { const xn = (N * i) / 600; pts.push([x0 + xn * dx, H / 2 - A * Math.cos(ka * xn - ph)]); pr.push([x0 + xn * dx, H / 2 - A * Math.cos(kr * xn - ph)]); }
      EM.draw.poly(ctx, pts, { color: '--accent', width: 1.4, alpha: 0.7 });
      if (p.alias) EM.draw.poly(ctx, pr, { color: '--c3', width: 1.4, dash: [5, 4] });
      for (let n = 0; n <= N; n++) EM.draw.bob(ctx, x0 + n * dx, H / 2 - A * Math.cos(ka * n - ph), 6, { color: '--c1' });
      EM.text(ctx, 'las cuentas sólo «ven» la onda en x = na', 10, H - 10, { size: 11, color: '--ink-3' });
      sim.set('w', EM.fix(w, 4));
      sim.set('kr', EM.fix(kr, 3));
      sim.set('vp', Math.abs(ka) > 1e-6 ? EM.fix(w / Math.abs(ka), 4) : '1');
      sim.set('vg', EM.fix(Math.cos(ka / 2) * Math.sign(Math.sin(ka / 2) || 1), 4));
    });
  });

  /* ======================================================================
     10.3 Cadena excitada en un extremo
     ====================================================================== */
  EM.defineSim('chain-driven', function (sim) {
    const cv = sim.canvas({ aspect: 2.6 });
    sim.slider('w', { label: 'Frecuencia de excitación <i>ω</i>/<i>ω</i><sub>0</sub>', min: 0.1, max: 3, step: 0.01, value: 0.8, fmt: f2, onInput: () => restart() });
    sim.resetButton(() => restart());
    sim.note('70 cuentas; las últimas 25 tienen un amortiguamiento creciente que imita una cadena infinita.');
    sim.out('kind', 'Régimen', { hl: true });
    sim.out('k', 'Número de onda <i>ka</i> o decaimiento <i>κa</i>');
    sim.out('lam', 'Longitud de onda (en cuentas)');
    const N = 70;
    let y, v, t;
    const gam = new Float64Array(N + 2);
    for (let n = 0; n < N + 2; n++) gam[n] = n > N - 25 ? 0.6 * ((n - (N - 25)) / 25) ** 2 : 0;
    const restart = () => { y = new Float64Array(N + 2); v = new Float64Array(N + 2); t = 0; };
    restart();
    sim.animate((dt) => {
      const W = sim.p.w, steps = 60, h = (dt * 8) / steps;
      for (let s = 0; s < steps; s++) {
        t += h;
        y[0] = Math.sin(W * t) * Math.min(1, t / 6);
        for (let n = 1; n <= N; n++) v[n] += h * ((y[n + 1] - 2 * y[n] + y[n - 1]) - gam[n] * v[n]);
        for (let n = 1; n <= N; n++) y[n] += h * v[n];
      }
    });
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, W = cv.w, H = cv.h;
      EM.draw.clear(cv);
      const x0 = 26, x1 = W - 10, dx = (x1 - x0) / (N + 1), A = H * 0.28;
      ctx.fillStyle = EM.alpha('--c2', 0.08);
      ctx.fillRect(x0 + dx * (N - 25), 0, dx * 26, H);
      EM.text(ctx, 'zona absorbente', x0 + dx * (N - 12), 16, { size: 11, color: '--c2', align: 'center' });
      const pts = [];
      for (let n = 0; n <= N; n++) pts.push([x0 + n * dx, H / 2 - y[n] * A]);
      EM.draw.poly(ctx, pts, { color: '--ink-3', width: 1 });
      pts.forEach(([x, yy], i) => EM.draw.bob(ctx, x, yy, i === 0 ? 6 : 3.4, { color: i === 0 ? '--accent' : '--c1' }));
      if (p.w > 2) {
        const ka = Math.acosh((p.w * p.w) / 2 - 1);
        const env = [];
        for (let n = 0; n <= 20; n++) env.push([x0 + n * dx, H / 2 - A * Math.exp(-n * ka)]);
        EM.draw.poly(ctx, env, { color: '--c2', width: 1.2, dash: [4, 4] });
      }
      if (p.w <= 2) {
        const ka = 2 * Math.asin(p.w / 2);
        sim.set('kind', 'propagación');

  EM.defineSim('diatomic', function (sim) {
    sim.cols2();

    sim.slider('r', { label: 'Razón de masas <i>m</i><sub>2</sub>/<i>m</i><sub>1</sub>', min: 1, max: 6, step: 0.05, value: 2.5, fmt: f2 });
    sim.slider('k', { label: 'Número de onda <i>ka</i>', min: -Math.PI, max: Math.PI, step: 0.01, value: 0.6, fmt: f2 });
    sim.seg('br', { label: 'Rama', options: [['ac', 'Acústica'], ['op', 'Óptica']], value: 'ac' });
    sim.out('w', '<i>ω</i> / √(<i>κ</i>/<i>m</i><sub>1</sub>)', { hl: true });
    sim.out('gap', 'Banda prohibida');
    sim.out('ratio', 'Amplitud masa 2 / masa 1');
    sim.note('El movimiento real es longitudinal; aquí se dibuja hacia arriba para que se vea mejor.');
    let t = 0;
    sim.animate((dt) => { t += dt; });
    const disp = (ka, r, s) => { const S = 1 + 1 / r; const D = Math.sqrt(Math.max(0, S * S - (4 * Math.sin(ka / 2) ** 2) / r)); return Math.sqrt(Math.max(0, S + s * D)); };
    sim.onDraw(() => {
      const p = sim.p, r = p.r, s = p.br === 'op' ? 1 : -1;
      const w = disp(p.k, r, s);
      EM.draw.clear(cd);
      const ymax = Math.sqrt(2 * (1 + 1 / r)) * 1.1;
      const pd = new EM.Plot(cd.ctx, { x: 0, y: 0, w: cd.w, h: cd.h, xmin: -Math.PI, xmax: Math.PI, ymin: 0, ymax: Math.max(ymax, 1.6), xpi: true, xlabel: 'ka (a = longitud de la celda)', ylabel: 'ω / √(κ/m₁)', ml: 52 });
      pd.frame();
      const wa = Math.sqrt(2 / r), wo = Math.sqrt(2);
      if (r > 1.0001) cd.ctx.fillStyle = EM.alpha('--c2', 0.08), cd.ctx.fillRect(pd.ix, pd.Y(Math.max(wa, wo)), pd.iw, pd.Y(Math.min(wa, wo)) - pd.Y(Math.max(wa, wo)));
      pd.fn((x) => disp(x, r, -1), { color: '--c1', width: 2.2, n: 600 });
      pd.fn((x) => disp(x, r, 1), { color: '--c2', width: 2.2, n: 600 });
      pd.dot(p.k, w, { color: '--accent', r: 6 });
      pd.label(-2.9, disp(-2.9, r, -1) * 0.5, 'acústica', { color: '--c1' });
      pd.label(-2.9, disp(-2.9, r, 1) + 0.12, 'óptica', { color: '--c2' });
      /* amplitudes: −m1 ω² u = κ(v(1 + e^{−ika}) − 2u) → v/u = (2 − ω²)/(1 + e^{−ika}) (m1 = κ = 1) */
      const den = [1 + Math.cos(p.k), -Math.sin(p.k)], num = 2 - w * w;
      const dm = den[0] * den[0] + den[1] * den[1];
      const vr = dm > 1e-12 ? [(num * den[0]) / dm, (-num * den[1]) / dm] : [0, 0];
      EM.draw.clear(cw);
      const ctx = cw.ctx, W = cw.w, H = cw.h;
      const cells = 6, x0 = 20, x1 = W - 20, dx = (x1 - x0) / (2 * cells), A = H * 0.16;
      const nrm = Math.max(1, Math.hypot(vr[0], vr[1]));
      const pts = [];
      for (let n = 0; n < cells; n++) {
        const ph = p.k * n - w * 1.5 * t;
        const u = Math.cos(ph) / nrm;
        const v = (vr[0] * Math.cos(ph) - vr[1] * Math.sin(ph)) / nrm;
        pts.push([x0 + 2 * n * dx, H / 2 - u * A, 1], [x0 + (2 * n + 1) * dx, H / 2 - v * A, 2]);
      }
      EM.draw.poly(ctx, pts.map((q) => [q[0], q[1]]), { color: '--ink-3', width: 1 });
      pts.forEach(([x, y, k]) => EM.draw.bob(ctx, x, y, k === 1 ? 7 : 7 + 2 * Math.sqrt(r), { color: k === 1 ? '--c4' : '--c5' }));
      sim.set('w', EM.fix(w, 4));
      sim.set('gap', r > 1.0001 ? 'entre ' + EM.fix(Math.min(wa, wo), 3) + ' y ' + EM.fix(Math.max(wa, wo), 3) : 'no hay (masas iguales)');
      sim.set('ratio', dm > 1e-12 ? EM.fix(Math.hypot(vr[0], vr[1]), 3) + (num * den[0] < 0 ? ' (en oposición)' : ' (en fase)') : '—');
    });
  });
})();

  EM.defineSim('dalembert', function (sim) {

      let fR, fL;

      const h = 0.02, e = 1e-3;
      for (let x = -6; x <= 6; x += h) {
        const y = (xx, tt) => f(xx, tt) + g(xx, tt);
        const vy = (y(x, t + e) - y(x, t - e)) / (2 * e), sl = (y(x + e, t) - y(x - e, t)) / (2 * e);
        K += 0.5 * vy * vy * h; U += 0.5 * sl * sl * h;
      }
      EM.draw.clear(ce);
      const ctx = ce.ctx, W = ce.w, H = ce.h, tot = K + U || 1;
      ctx.fillStyle = EM.alpha('--c1', 0.8); ctx.fillRect(60, H * 0.25, (W - 80) * (K / tot), H * 0.22);
      ctx.fillStyle = EM.alpha('--c3', 0.8); ctx.fillRect(60, H * 0.55, (W - 80) * (U / tot), H * 0.22);
      EM.text(ctx, 'cinética', 54, H * 0.36, { size: 11.5, color: '--c1', align: 'right', baseline: 'middle' });
      EM.text(ctx, 'potencial', 54, H * 0.66, { size: 11.5, color: '--c3', align: 'right', baseline: 'middle' });
      sim.set('K', EM.fix((100 * K) / tot, 1) + ' %');
    });
  });
})();

/* ==== chapters/12-armonicas.js ==== */
/* Capítulo 12 — Ondas armónicas, energía e impedancia */
(function () {

/* ==== chapters/13-reflexion.js ==== */
/* Capítulo 13 — Reflexión y transmisión */
(function () {
  'use strict';
  const EM = window.EM, M = EM.M;
  const f2 = (v) => EM.fix(v, 2), f3 = (v) => EM.fix(v, 3);

  /* Lanza en una cuerda un pulso gaussiano centrado en x0 que viaja hacia +x con velocidad local c(x0) */
  function launch(S, x0, w, A = 1) {
    const N = S.n, dt = S.dt(), c = Math.sqrt(S.c2[Math.round(x0 * (N - 1))]);
    for (let i = 0; i < N; i++) {
      const x = i / (N - 1);
      S.y[i] = A * Math.exp(-(((x - x0) / w) ** 2));
      S.yp[i] = A * Math.exp(-(((x + c * dt - x0) / w) ** 2));
    }
    S.t = 0;
  }
  EM.launchPulse = launch;

  /* Dibuja el estado de una cuerda; segs: [[x0, x1, color]] para colorear tramos */
  function drawString(pl, S, segs, o = {}) {
    const N = S.n;
    for (const [a, b, col, w] of segs) {
      const xs = [], ys = [];
      for (let i = Math.round(a * (N - 1)); i <= Math.round(b * (N - 1)); i++) { xs.push(i / (N - 1)); ys.push(S.y[i]); }
      pl.xy(xs, ys, { color: col, width: w || 2.4 });
    }
  }

  /* ======================================================================
     13.1 Reflexión en extremos
     ====================================================================== */
  EM.defineSim('pulse-reflection', function (sim) {
    const cv = sim.canvas({ aspect: 2.6 });
    sim.seg('end', { label: 'Extremo derecho', options: [['fixed', 'Fijo'], ['free', 'Libre'], ['open', 'Absorbente']], value: 'fixed', onInput: () => restart() });
    sim.slider('w', { label: 'Ancho del pulso', min: 0.02, max: 0.12, step: 0.005, value: 0.05, fmt: f3, onInput: () => restart() });
    sim.check('img', { label: 'Mostrar el pulso imagen', value: true });
    sim.resetButton(() => restart());
    sim.out('y', 'Desplazamiento del extremo', { hl: true });
    const S = new EM.String1D(500, { left: 'open', right: 'fixed', courant: 0.98 });
    let ymax = 0;
    const restart = () => { S.right = sim.p.end; launch(S, 0.3, sim.p.w); ymax = 0; };
    restart();
    sim.animate((dt) => { for (let i = 0; i < 5; i++) S.step(); if (S.t > 2) restart(); });
    sim.onDraw(() => {
      const p = sim.p;
      EM.draw.clear(cv);
      const pl = new EM.Plot(cv.ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: 0, xmax: 1.5, ymin: -1.3, ymax: 2.3, xlabel: 'x (la cuerda termina en x = 1)', ylabel: 'y', ml: 52 });
      pl.frame();
      pl.band(1, 1.5, { color: '--ink-3', alpha: 0.08 });
      if (p.img && p.end !== 'open') {
        const sgn = p.end === 'fixed' ? -1 : 1, xc = 2 - (0.3 + S.t);
        pl.fn((x) => sgn * Math.exp(-(((x - xc) / p.w) ** 2)), { color: '--c5', width: 1.5, dash: [5, 4], n: 900 });
        pl.fn((x) => Math.exp(-(((x - 0.3 - S.t) / p.w) ** 2)), { from: 1, color: '--c1', width: 1.2, dash: [2, 3], n: 600 });
      }
      drawString(pl, S, [[0, 1, '--accent']]);
      const ye = S.y[S.n - 1];
      ymax = Math.max(ymax, Math.abs(ye));
      if (p.end === 'free') { pl.dot(1, ye, { color: '--c3', r: 6 }); }
      cv.ctx.fillStyle = EM.col('--ink-2');
      if (p.end === 'fixed') cv.ctx.fillRect(pl.X(1), pl.Y(0.3), 6, pl.Y(-0.3) - pl.Y(0.3));
      if (p.end === 'free') { cv.ctx.fillRect(pl.X(1) + 2, pl.Y(2.2), 3, pl.Y(-1.2) - pl.Y(2.2)); }
      sim.set('y', EM.fix(ye, 3) + ' (máx. ' + EM.fix(ymax, 2) + ')');
    });
  });

  /* ======================================================================
     13.2 Unión de dos cuerdas
     ====================================================================== */
  EM.defineSim('string-junction', function (sim) {
    const cv = sim.canvas({ aspect: 2.4 });
    const ce = sim.canvas({ aspect: 4.2 });
    sim.slider('r', { label: 'Razón de densidades <i>μ</i><sub>2</sub>/<i>μ</i><sub>1</sub>', min: 0.1, max: 25, value: 4, log: true, step: 0.01, fmt: f2, onInput: () => restart() });
    sim.button('μ₂ = 4μ₁', () => sim.ctl.r.set(4));
    sim.button('μ₂ = μ₁/4', () => sim.ctl.r.set(0.25));
    sim.button('Iguales', () => sim.ctl.r.set(1));
    sim.resetButton(() => restart());
    sim.out('Z', '<i>Z</i><sub>2</sub>/<i>Z</i><sub>1</sub>');
    sim.out('r', 'Coeficiente <i>r</i> (teórico / medido)', { hl: true });
    sim.out('t', 'Coeficiente <i>τ</i> (teórico / medido)');
    sim.out('E', '<i>R</i> + 𝒯');
    const N = 800;
    const S = new EM.String1D(N, { left: 'open', right: 'open', courant: 0.95 });
    let peakR = 0, peakT = 0, frozen = null;
    const restart = () => {
      const c2 = 1 / Math.sqrt(sim.p.r);
      S.setSpeed((x) => (x < 0.4 ? 1 : c2));
      launch(S, 0.15, 0.035);
      peakR = 0; peakT = 0;
    };
    restart();
    sim.animate(() => {
      for (let i = 0; i < 4; i++) S.step();
      if (S.t > 0.34) {
        const J = Math.round(0.4 * (N - 1));
        for (let i = 0; i < J - 10; i++) if (Math.abs(S.y[i]) > Math.abs(peakR)) peakR = S.y[i];
        for (let i = J + 10; i < N; i++) if (Math.abs(S.y[i]) > Math.abs(peakT)) peakT = S.y[i];
      }
      if (S.t > 1.4) restart();
    });
    sim.onDraw(() => {
      const p = sim.p, zr = Math.sqrt(p.r), rt = (1 - zr) / (1 + zr), tt = 2 / (1 + zr);
      EM.draw.clear(cv);
      const pl = new EM.Plot(cv.ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: 0, xmax: 1, ymin: -1.2, ymax: 2.1, xlabel: 'x', ylabel: 'y', ml: 52 });
      pl.frame();
      pl.vline(0.4, { color: '--ink-3', label: 'unión' });
      drawString(pl, S, [[0, 0.4, '--c1', 2.2], [0.4, 1, '--c2', 1.4 + Math.min(4, Math.sqrt(p.r))]]);
      pl.label(0.03, 1.9, 'cuerda 1', { color: '--c1' });
      pl.label(0.7, 1.9, 'cuerda 2', { color: '--c2' });
      /* energía a cada lado (T = 1, μ = 1/c²) */
      let E1 = 0, E2 = 0;
      const dx = 1 / (N - 1), dt = S.dt();
      for (let i = 0; i < N - 1; i++) {
        const v = (S.y[i] - S.yp[i]) / dt, s = (S.y[i + 1] - S.y[i]) / dx;
        const e = (0.5 * v * v) / S.c2[i] * dx + 0.5 * s * s * dx;
        if (i < 0.4 * (N - 1)) E1 += e; else E2 += e;
      }
      if (S.t > 0.36 && !frozen) frozen = [E1, E2];
      if (S.t < 0.05) frozen = null;
      if (frozen) [E1, E2] = frozen;
      EM.draw.clear(ce);
      const ctx = ce.ctx, W = ce.w, H = ce.h, tot = E1 + E2 || 1;
      ctx.fillStyle = EM.alpha('--c1', 0.8); ctx.fillRect(90, H * 0.22, (W - 110) * (E1 / tot), H * 0.24);
      ctx.fillStyle = EM.alpha('--c2', 0.8); ctx.fillRect(90, H * 0.56, (W - 110) * (E2 / tot), H * 0.24);
      EM.text(ctx, frozen ? 'reflejada' : 'energía en 1', 84, H * 0.34, { size: 11.5, color: '--c1', align: 'right', baseline: 'middle' });
      EM.text(ctx, frozen ? 'transmitida' : 'energía en 2', 84, H * 0.68, { size: 11.5, color: '--c2', align: 'right', baseline: 'middle' });
      sim.set('Z', EM.fix(zr, 3));
      sim.set('r', EM.fix(rt, 3) + ' / ' + (S.t > 0.45 ? EM.fix(peakR, 3) : '…'));
      sim.set('t', EM.fix(tt, 3) + ' / ' + (S.t > 0.45 ? EM.fix(peakT, 3) : '…'));
      sim.set('E', EM.fix(rt * rt, 3) + ' + ' + EM.fix(zr * tt * tt, 3) + ' = ' + EM.fix(rt * rt + zr * tt * tt, 3));
    });
  });

  /* ======================================================================
     13.3 Terminación en un amortiguador
     ====================================================================== */
  EM.defineSim('impedance-end', function (sim) {
    const cv = sim.canvas({ aspect: 2.6 });
    sim.slider('b', { label: 'Amortiguador <i>b</i>/<i>Z</i>', min: 0.02, max: 50, value: 1, log: true, step: 0.01, fmt: (v) => EM.fix(v, 2), onInput: () => restart() });
    sim.button('b = Z (acoplado)', () => sim.ctl.b.set(1));
    sim.button('b = Z/3', () => sim.ctl.b.set(1 / 3));
    sim.button('b = 3Z', () => sim.ctl.b.set(3));
    sim.resetButton(() => restart());
    sim.out('r', 'Reflexión teórica (<i>Z</i> − <i>b</i>)/(<i>Z</i> + <i>b</i>)', { hl: true });
    sim.out('m', 'Reflexión medida');
    sim.out('R', 'Potencia reflejada');
    const S = new EM.String1D(500, { left: 'open', right: 'damper', courant: 0.98 });
    let peak = 0;
    const restart = () => { S.rb = sim.p.b; launch(S, 0.3, 0.05); peak = 0; };
    restart();
    sim.animate(() => {
      for (let i = 0; i < 5; i++) S.step();
      if (S.t > 0.95) for (let i = 0; i < S.n - 20; i++) if (Math.abs(S.y[i]) > Math.abs(peak)) peak = S.y[i];
      if (S.t > 1.8) restart();
    });
    sim.onDraw(() => {
      const p = sim.p, r = (1 - p.b) / (1 + p.b);
      EM.draw.clear(cv);
      const pl = new EM.Plot(cv.ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: 0, xmax: 1.1, ymin: -1.2, ymax: 1.3, xlabel: 'x', ylabel: 'y', ml: 52 });
      pl.frame();
      drawString(pl, S, [[0, 1, '--accent']]);
      const ctx = cv.ctx, ye = S.y[S.n - 1];
      EM.draw.damper(ctx, pl.X(1.06), pl.Y(-1.1), pl.X(1.06), pl.Y(ye) + 8, { w: 7 });
      ctx.fillStyle = EM.col('--c3'); ctx.fillRect(pl.X(1) - 2, pl.Y(ye) - 6, pl.X(1.06) - pl.X(1) + 8, 12);
      sim.set('r', EM.fix(r, 3));
      sim.set('m', S.t > 1.05 ? EM.fix(peak, 3) : '…');
      sim.set('R', EM.fix(100 * r * r, 1) + ' %');
    });
  });

  /* ======================================================================
     13.4 Acoplador de cuarto de onda
     ====================================================================== */
  EM.defineSim('quarter-wave', function (sim) {
    sim.cols2();
    const cs = sim.canvas({ aspect: 1.15 });
    const cp = sim.canvas({ aspect: 1.15 });
    sim.slider('z2', { label: '<i>Z</i><sub>2</sub>/<i>Z</i><sub>1</sub>', min: 1, max: 100, value: 9, log: true, step: 0.01, fmt: f2 });
    sim.slider('zm', { label: '<i>Z<sub>m</sub></i>/<i>Z</i><sub>1</sub> (capa)', min: 1, max: 100, value: 3, log: true, step: 0.01, fmt: f2 });
    sim.button('Z_m = √(Z₁Z₂)', () => sim.ctl.zm.set(Math.sqrt(sim.p.z2)));
    sim.slider('d', { label: 'Espesor <i>d</i>/<i>λ<sub>m</sub></i>', min: 0, max: 1, step: 0.005, value: 0.25, fmt: f3 });
    sim.out('T0', 'Transmisión sin capa');
    sim.out('T', 'Transmisión con capa', { hl: true });
    sim.out('Tbest', 'Máximo posible (<i>d</i> = <i>λ<sub>m</sub></i>/4)');
    const Tr = (z2, zm, d) => { const de = 2 * Math.PI * d; return (4 * z2) / ((1 + z2) ** 2 * Math.cos(de) ** 2 + (zm + z2 / zm) ** 2 * Math.sin(de) ** 2); };
    sim.onDraw(() => {
      const p = sim.p;
      const T = Tr(p.z2, p.zm, p.d), T0 = (4 * p.z2) / (1 + p.z2) ** 2;
      EM.draw.clear(cs);
      const ctx = cs.ctx, W = cs.w, H = cs.h;
      const xa = W * 0.4, xb = xa + Math.max(6, W * 0.3 * p.d);
      ctx.fillStyle = EM.alpha('--c1', 0.08); ctx.fillRect(0, 0, xa, H);
      ctx.fillStyle = EM.alpha('--c5', 0.08 + 0.08 * Math.log10(p.zm)); ctx.fillRect(xa, 0, xb - xa, H);
      ctx.fillStyle = EM.alpha('--c2', 0.08 + 0.1 * Math.log10(p.z2)); ctx.fillRect(xb, 0, W - xb, H);
      EM.text(ctx, 'Z₁', 14, 22, { size: 13, color: '--c1' });
      EM.text(ctx, 'capa', xa + 3, 22, { size: 11, color: '--c5' });
      EM.text(ctx, 'Z₂', W - 30, 22, { size: 13, color: '--c2' });
      const y = H * 0.45;
      EM.draw.arrow(ctx, 20, y, xa - 8, y, { color: '--accent', width: 5 });
      EM.draw.arrow(ctx, xa - 8, y + 34, xa - 8 - (xa - 40) * Math.sqrt(1 - T), y + 34, { color: '--c1', width: Math.max(1, 5 * (1 - T)) });
      EM.draw.arrow(ctx, xb + 8, y, xb + 8 + (W - xb - 30) * Math.sqrt(T), y, { color: '--c2', width: Math.max(1, 5 * T) });
      EM.text(ctx, 'incidente', 20, y - 12, { size: 11, color: '--accent' });
      EM.text(ctx, 'reflejada ' + EM.fix(100 * (1 - T), 1) + ' %', 20, y + 54, { size: 11, color: '--c1' });
      EM.text(ctx, 'transmitida ' + EM.fix(100 * T, 1) + ' %', xb + 8, y - 12, { size: 11, color: '--c2' });
      EM.draw.clear(cp);
      const pl = new EM.Plot(cp.ctx, { x: 0, y: 0, w: cp.w, h: cp.h, xmin: 0, xmax: 1, ymin: 0, ymax: 1.05, xlabel: 'd / λ_m', ylabel: 'transmisión de potencia', ml: 52 });
      pl.frame();
      pl.hline(T0, { color: '--ink-3', label: 'sin capa' });
      pl.fn((d) => Tr(p.z2, Math.sqrt(p.z2), d), { color: '--grid-2', width: 1.3 });
      pl.fn((d) => Tr(p.z2, p.zm, d), { color: '--c1', width: 2.3 });
      pl.vline(0.25, { color: '--c3' }); pl.vline(0.75, { color: '--c3' });
      pl.dot(p.d, T, { color: '--accent', r: 6 });
      sim.set('T0', EM.fix(100 * T0, 2) + ' %');
      sim.set('T', EM.fix(100 * T, 2) + ' %');
      sim.set('Tbest', EM.fix(100 * Tr(p.z2, p.zm, 0.25), 2) + ' %');
    });
  });
})();
