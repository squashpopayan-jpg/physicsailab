<details><summary>Respuesta</summary><p>\(\Delta f\sim1/\tau=1\) MHz; \(\Delta x=c\tau/2=150\) m.</p></details></li>
<li><span class="lvl">Avanzado</span>Calcule la transformada de Fourier de \(f(t)=\ee^{-\gamma t/2}\cos\omega_0t\) para \(t\ge0\) (cero antes) y muestre que, cerca de \(\omega_0\), \(|F|^2\) es una lorentziana de ancho \(\gamma\).
<details><summary>Respuesta</summary><p>\(F\approx\dfrac{1/2}{\gamma/2+\ii(\omega-\omega_0)}\Rightarrow|F|^2=\dfrac{1/4}{(\omega-\omega_0)^2+\gamma^2/4}\): el espectro de un oscilador amortiguado es la curva de resonancia del capítulo 5.</p></details></li>
</ol>
</section>

<!-- 16-dispersion.html -->
<template class="chapter-src" data-id="dispersion" data-num="16" data-title="Dispersión, paquetes de onda y velocidad de grupo" data-part="Parte IV · Ondas mecánicas" data-short="Relación de dispersión, velocidad de fase y de grupo, paquetes que se ensanchan, olas en el agua y cuerdas rígidas">
<p class="lead">En una cuerda ideal todas las frecuencias viajan con la misma velocidad y un pulso conserva su forma. En la mayoría de los medios no es así: las olas largas del mar viajan más rápido que las cortas, la luz azul más lenta que la roja en el vidrio. Esa dependencia, la dispersión, deforma los pulsos y obliga a distinguir dos velocidades: la de las crestas y la de la energía.</p>

<section>
<h2>Relación de dispersión</h2>
<p>En un medio lineal y homogéneo, las soluciones armónicas \(\ee^{\ii(kx-\omega t)}\) existen sólo si \(\omega\) y \(k\) cumplen una relación \(\omega=\omega(k)\) que depende del medio: su <span class="term">relación de dispersión</span>. Si es lineal, \(\omega=vk\), el medio es <em>no dispersivo</em>. Ejemplos:</p>
<div class="tablewrap"><table>
<tr><th>Medio</th><th class="c">Relación de dispersión</th><th class="c">Comportamiento</th></tr>
<tr><td>Cuerda ideal, sonido, luz en el vacío</td><td class="c">\(\omega=vk\)</td><td class="c">no dispersivo</td></tr>
<tr><td>Cadena de cuentas (capítulo 10)</td><td class="c">\(\omega=2\omega_0\sen(ka/2)\)</td><td class="c">dispersión normal, corte</td></tr>
<tr><td>Olas en aguas profundas</td><td class="c">\(\omega=\sqrt{gk}\)</td><td class="c">las ondas largas son más rápidas</td></tr>
<tr><td>Ondas capilares</td><td class="c">\(\omega=\sqrt{\sigma k^3/\rho}\)</td><td class="c">las cortas son más rápidas</td></tr>
<tr><td>Cuerda rígida (piano)</td><td class="c">\(\omega^2=v^2k^2+\alpha^2k^4\)</td><td class="c">armónicos desafinados hacia arriba</td></tr>
<tr><td>Luz en un plasma o en una guía de ondas</td><td class="c">\(\omega^2=\omega_p^2+c^2k^2\)</td><td class="c">frecuencia de corte \(\omega_p\)</td></tr>
<tr><td>Partícula cuántica libre</td><td class="c">\(\omega=\hbar k^2/2m\)</td><td class="c">el paquete se ensancha</td></tr>
</table></div>
</section>

<section>
<h2>Velocidad de fase y velocidad de grupo</h2>
<p>Sumemos dos ondas de igual amplitud y frecuencias próximas, \((k_1,\omega_1)\) y \((k_2,\omega_2)\). Como en los batimientos:</p>
<div class="eq">\[y=2A\cos\!\left(\frac{\Delta k}2x-\frac{\Delta\omega}2t\right)\cos\!\left(\bar kx-\bar\omega t\right).\]</div>
<p>La onda portadora, de número de onda medio \(\bar k\), avanza con la <span class="term">velocidad de fase</span> \(v_f=\bar\omega/\bar k\). La envolvente avanza con \(\Delta\omega/\Delta k\). En el límite de frecuencias muy próximas, ésa es la <span class="term">velocidad de grupo</span>:</p>
<div class="eq key" data-name="Velocidades de fase y de grupo">\[v_f=\frac\omega k,\qquad v_g=\frac{\dd\omega}{\dd k}=v_f+k\frac{\dd v_f}{\dd k}=v_f-\lambda\frac{\dd v_f}{\dd\lambda}.\]</div>
<p>En un medio no dispersivo son iguales. Si las ondas largas son más rápidas (\(\dd v_f/\dd\lambda\gt0\), dispersión <em>normal</em>), \(v_g\lt v_f\): las crestas nacen en la parte trasera del grupo, lo atraviesan y mueren en el frente. Con dispersión <em>anómala</em> ocurre al revés.</p>
<p>La energía y la información viajan con la velocidad de grupo. La velocidad de fase puede ser mayor que \(c\) (por ejemplo, en una guía de ondas) sin violar la relatividad, porque las crestas de una onda infinita no transportan ninguna señal.</p>
<div class="sim" data-sim="group-two-waves" data-title="Dos ondas: la cresta y la envolvente viajan a velocidades distintas"></div>
<div class="sim-guide"><ul>
<li>Siga el punto rojo (una cresta) y el azul (el máximo de la envolvente). En aguas profundas la cresta avanza al doble de velocidad que el grupo.</li>
<li>Con ondas capilares, la cresta va más lenta que el grupo: aparece por el frente y desaparece por detrás.</li>
</ul></div>
</section>

<section>
<h2>Paquetes de onda que se ensanchan</h2>
<p>Un pulso localizado contiene una banda de números de onda alrededor de \(k_0\). Desarrollando \(\omega(k)\) en serie,</p>
<div class="eq">\[\omega(k)\approx\omega_0+v_g(k-k_0)+\tfrac12\omega''(k-k_0)^2 .\]</div>
<p>El término lineal hace que la envolvente se traslade rígidamente con \(v_g\). El término cuadrático (la <em>dispersión de la velocidad de grupo</em>) hace que las distintas componentes del paquete viajen a velocidades de grupo diferentes: el paquete se ensancha y se vuelve <em>chirpeado</em> (su frecuencia local varía de un extremo al otro). Para un paquete gaussiano cuya intensidad \(|y|^2\) tiene inicialmente una desviación estándar \(\sigma_0\):</p>
<div class="eq key" data-name="Ensanchamiento de un paquete gaussiano">\[\sigma(t)=\sigma_0\sqrt{1+\left(\frac{\omega''t}{2\sigma_0^2}\right)^2}.\]</div>
<p>Cuanto más angosto es el paquete inicial, más rápido se ensancha: contiene una banda de \(k\) más amplia. En las fibras ópticas, este ensanchamiento limita la cantidad de pulsos por segundo que se pueden enviar; en mecánica cuántica, describe cómo se dispersa la función de onda de una partícula libre.</p>
<div class="sim" data-sim="wave-packet" data-title="Evolución de un paquete de ondas en distintos medios"></div>
<div class="sim-guide"><ul>
<li>En el medio no dispersivo el paquete viaja sin deformarse. En los demás, la envolvente se ensancha y la amplitud baja (la energía se conserva).</li>
<li>Observe el «chirp» en aguas profundas: las ondas largas, más rápidas, se adelantan al frente del paquete. Así llegan a la playa las olas de una tormenta lejana: primero las de período largo.</li>
</ul></div>
</section>

<section>
<h2>Las olas en el agua</h2>
<p>Para ondas en la superficie de un líquido de profundidad \(h\), densidad \(\rho\) y tensión superficial \(\sigma\), la relación de dispersión es</p>
<div class="eq key" data-name="Olas en el agua">\[\omega^2=\left(gk+\frac{\sigma}{\rho}k^3\right)\tanh(kh).\]</div>
<ul>
<li><strong>Aguas profundas, ondas de gravedad</strong> (\(kh\gg1\), \(\lambda\gg1.7\) cm): \(v_f=\sqrt{g/k}=\sqrt{g\lambda/2\pi}\) y \(v_g=v_f/2\). Una ola de 100 m de longitud viaja a 12.5 m/s.</li>
<li><strong>Aguas someras</strong> (\(kh\ll1\)): \(v=\sqrt{gh}\), sin dispersión. Un tsunami, con longitudes de onda de cientos de kilómetros, ve siempre el océano como «poco profundo»: en 4000 m de agua viaja a 200 m/s (720 km/h), y se frena y crece al llegar a la costa.</li>
<li><strong>Ondas capilares</strong> (\(\lambda\lesssim1\) cm): domina la tensión superficial, \(v_g=\tfrac32v_f\).</li>
</ul>
<p>Entre ambos regímenes, la velocidad de fase tiene un mínimo de 23 cm/s en \(\lambda=1.7\) cm: ninguna onda en el agua puede ser más lenta. Por eso un obstáculo en una corriente más lenta que ese valor no produce ondas estacionarias delante de él.</p>
<div class="sim" data-sim="water-dispersion" data-title="Velocidades de las olas en función de la longitud de onda"></div>
</section>

<section>
<h2>La cuerda rígida y la inarmonicidad del piano</h2>
<p>Una cuerda real de acero resiste la flexión. Su ecuación incluye un término de cuarta derivada, y la relación de dispersión es \(\omega^2=v^2k^2+\alpha^2k^4\). Con extremos fijos, las frecuencias de los modos dejan de ser múltiplos exactos de la fundamental:</p>
<div class="eq key" data-name="Inarmonicidad">\[f_n=nf_0\sqrt{1+Bn^2},\qquad B=\frac{\pi^2\alpha^2}{v^2L^2}=\frac{\pi^3Er^4}{4TL^2} .\]</div>
<p>(\(r\) es el radio y \(E\) el módulo de Young.) En las cuerdas graves del piano, cortas y gruesas, \(B\) puede llegar a \(10^{-3}\): el armónico 10 queda casi un 5 % más alto. Los afinadores compensan «estirando» la afinación: las octavas agudas se afinan un poco altas y las graves un poco bajas. Las cuerdas graves se fabrican entorchadas (un alma delgada envuelta en alambre de cobre) para aumentar la masa sin aumentar la rigidez.</p>
<div class="sim" data-sim="stiff-string" data-title="Cuerda rígida: armónicos desafinados"></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una ola de aguas profundas tiene período de 10 s. Halle su longitud de onda, su velocidad de fase y su velocidad de grupo.
<details><summary>Respuesta</summary><p>\(\omega=0.628\) rad/s; \(k=\omega^2/g=0.0402\) m⁻¹; \(\lambda=156\) m; \(v_f=15.6\) m/s; \(v_g=7.8\) m/s.</p></details></li>
<li><span class="lvl">Básico</span>¿A qué velocidad viaja un tsunami en el Pacífico (profundidad media 4300 m)? ¿Cuánto tarda en cruzar 10 000 km?
<details><summary>Respuesta</summary><p>\(v=\sqrt{gh}=205\) m/s; unas 13.5 h.</p></details></li>
<li><span class="lvl">Intermedio</span>Para \(\omega^2=\omega_p^2+c^2k^2\), demuestre que \(v_fv_g=c^2\) y que \(v_g\lt c\).
<details><summary>Respuesta</summary><p>\(2\omega\,\dd\omega=2c^2k\,\dd k\Rightarrow v_g=c^2k/\omega=c^2/v_f\). Como \(v_f=\sqrt{c^2+\omega_p^2/k^2}\gt c\), \(v_g\lt c\).</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que, para ondas capilares, \(v_g=\tfrac32v_f\).
<details><summary>Respuesta</summary><p>\(\omega=Ck^{3/2}\Rightarrow v_g=\tfrac32Ck^{1/2}=\tfrac32\omega/k\).</p></details></li>
<li><span class="lvl">Avanzado</span>Una cuerda de piano tiene \(B=4\times10^{-4}\) y fundamental de 110 Hz. ¿Cuál es la frecuencia de su octavo armónico? ¿Con qué armónico de una cuerda ideal produce batimientos y a qué ritmo?
<details><summary>Respuesta</summary><p>La fundamental ideal es \(f_0=f_1/\sqrt{1+B}\); \(f_8=8f_0\sqrt{1+64B}pprox880(1+31.5B)=891\) Hz: unos 11 batimientos por segundo con un la de 880 Hz.</p></details></li>
</ol>
</section>
</template>

<!-- 17-sonido.html -->
<template class="chapter-src" data-id="sonido" data-num="17" data-title="Ondas sonoras" data-part="Parte V · Sonido" data-short="Desplazamiento y presión, velocidad del sonido en gases, líquidos y sólidos, intensidad, decibeles, ondas esféricas y audición">
<p class="lead">El sonido es una onda longitudinal de presión que se propaga en un medio elástico. En el aire, la presión oscila apenas unas millonésimas de la atmosférica alrededor de su valor medio, y aun así el oído percibe variaciones de \(20\ \mu\)Pa y tolera las de 20 Pa: un rango de un millón en amplitud, de un billón en intensidad.</p>

<section>
<h2>Desplazamiento y presión</h2>
<p>Sea \(s(x,t)\) el desplazamiento longitudinal de una capa de aire. Una capa de espesor \(\dd x\) cambia su volumen en \(\dd V/V=\partial s/\partial x\). Con el <span class="term">módulo de compresibilidad</span> \(B=-V\,\dd p/\dd V\), la presión acústica (la variación respecto a la presión media) es</p>
<div class="eq key" data-name="Presión acústica">\[p(x,t)=-B\pdv sx .\]</div>
<p>La fuerza neta sobre la capa es \(-\partial p/\partial x\,\dd x\cdot S\), y la segunda ley de Newton aplicada a su masa \(\rho S\,\dd x\) da la ecuación de onda con</p>
<div class="eq key" data-name="Velocidad del sonido">\[\pddv st=\frac B\rho\pddv sx,\qquad v=\sqrt{\frac B\rho}.\]</div>
<p>Para una onda armónica \(s=s_0\cos(kx-\omega t)\), la presión es \(p=Bks_0\sen(kx-\omega t)\): la amplitud de presión es \(p_0=Bks_0=\rho v\omega s_0\), y la presión está desfasada \(90^\circ\) respecto al desplazamiento. Donde el aire está más comprimido, el desplazamiento es nulo; donde el desplazamiento es máximo, la presión es la normal. Lo mismo ocurre con la velocidad de las partículas, \(u=\partial s/\partial t\), que está en fase con la presión: \(p=\rho v\,u\). La cantidad \(Z=\rho v\) es la <span class="term">impedancia acústica</span> del medio.</p>
<div class="sim" data-sim="sound-wave" data-title="Onda sonora: moléculas, desplazamiento y presión"></div>
<div class="sim-guide"><ul>
<li>Las regiones oscuras (comprimidas) coinciden con los máximos de presión y con los ceros del desplazamiento.</li>
<li>Calcule el desplazamiento para una conversación (60 dB, 1 kHz): unos 10 nm, menos que el tamaño de un virus.</li>
</ul></div>
</section>

<section>
<h2>La velocidad del sonido</h2>
<p>Newton calculó en 1687 la velocidad del sonido en el aire suponiendo que la compresión es isotérmica (\(B=p_0\)), y obtuvo unos 290 m/s, un 15 % menos que la medida. Laplace resolvió la discrepancia en 1816: las compresiones son tan rápidas que no hay tiempo para que el calor fluya; el proceso es <em>adiabático</em>, \(pV^\gamma=\text{cte}\), y \(B=\gamma p_0\). Para un gas ideal,</p>
<div class="eq key" data-name="Velocidad del sonido en un gas ideal">\[v=\sqrt{\frac{\gamma p_0}{\rho}}=\sqrt{\frac{\gamma RT}{M}},\qquad v_{\text{aire}}\approx331.3\sqrt{1+\frac{T_C}{273.15}}\ \text{m/s}\approx(331+0.6\,T_C)\ \text{m/s}.\]</div>
<p>La velocidad depende de la temperatura, no de la presión. En Popayán (1760 m de altitud, unos 19 °C) es la misma que al nivel del mar a 19 °C: 343 m/s. En el helio (\(M=4\) g/mol) es casi tres veces mayor, lo que sube las resonancias del tracto vocal y da la famosa voz aguda.</p>
<div class="tablewrap narrow"><table>
<tr><th>Medio</th><th class="c">\(v\) (m/s)</th><th class="c">\(Z=\rho v\) (Pa·s/m)</th></tr>
<tr><td>Aire (20 °C)</td><td class="c">343</td><td class="c">413</td></tr>
<tr><td>Helio (20 °C)</td><td class="c">1007</td><td class="c">167</td></tr>
<tr><td>Agua (20 °C)</td><td class="c">1482</td><td class="c">\(1.48\times10^6\)</td></tr>
<tr><td>Tejido blando</td><td class="c">1540</td><td class="c">\(1.63\times10^6\)</td></tr>
<tr><td>Hueso</td><td class="c">4080</td><td class="c">\(7.8\times10^6\)</td></tr>
<tr><td>Acero (barra delgada)</td><td class="c">5100</td><td class="c">\(4.0\times10^7\)</td></tr>
<tr><td>Vidrio</td><td class="c">5600</td><td class="c">\(1.4\times10^7\)</td></tr>
</table></div>
<div class="sim" data-sim="sound-speed" data-title="Velocidad del sonido en gases"></div>
</section>

<section>
<h2>Intensidad y decibeles</h2>
<p>La intensidad de una onda sonora (potencia por unidad de área) es el promedio de \(p\,u\):</p>
<div class="eq key" data-name="Intensidad acústica">\[I=\frac{p_0^2}{2\rho v}=\frac{p_{\text{ef}}^2}{Z}=\frac12\rho v\omega^2s_0^2 .\]</div>
<p>Como el oído responde aproximadamente al logaritmo de la intensidad, se usa el <span class="term">nivel de intensidad sonora</span> en decibeles, referido al umbral de audición a 1 kHz:</p>
<div class="eq key" data-name="Nivel sonoro">\[\beta=10\log_{10}\frac I{I_0}\ \text{dB},\qquad I_0=10^{-12}\ \text{W/m}^2;\qquad L_p=20\log_{10}\frac{p_{\text{ef}}}{20\ \mu\text{Pa}}.\]</div>
<p>Duplicar la intensidad suma 3 dB; multiplicarla por 10, 10 dB. El oído percibe como «el doble de fuerte» un aumento de unos 10 dB. Dos fuentes incoherentes (sin relación de fase) suman intensidades, no amplitudes: dos máquinas de 80 dB producen 83 dB, no 160.</p>
<div class="tablewrap narrow"><table>
<tr><th>Fuente</th><th class="c">Nivel (dB)</th></tr>
<tr><td>Umbral de audición</td><td class="c">0</td></tr>
<tr><td>Hojas movidas por la brisa</td><td class="c">20</td></tr>
<tr><td>Biblioteca</td><td class="c">40</td></tr>
<tr><td>Conversación a 1 m</td><td class="c">60</td></tr>
<tr><td>Tráfico intenso</td><td class="c">85</td></tr>
<tr><td>Concierto de rock</td><td class="c">110</td></tr>
<tr><td>Umbral de dolor</td><td class="c">120 – 130</td></tr>
<tr><td>Avión a reacción a 30 m</td><td class="c">140</td></tr>
</table></div>
<div class="box warn">
<h4>Salud auditiva</h4>
<p>La exposición prolongada a más de 85 dB causa daño auditivo permanente. Por cada 3 dB adicionales, el tiempo seguro se reduce a la mitad: 8 h a 85 dB, 1 h a 94 dB, 15 min a 100 dB. Los auriculares a volumen máximo superan con facilidad los 100 dB.</p>
</div>
<h3>Ondas esféricas</h3>
<p>Una fuente pequeña que emite una potencia \(P\) en todas direcciones reparte la energía sobre esferas de área \(4\pi r^2\). Sin absorción,</p>
<div class="eq key" data-name="Ley del inverso del cuadrado">\[I(r)=\frac{P}{4\pi r^2},\qquad p_0\propto\frac1r,\qquad \beta(r_2)=\beta(r_1)-20\log_{10}\frac{r_2}{r_1}.\]</div>
<p>Cada vez que se duplica la distancia, el nivel baja 6 dB.</p>
<div class="sim" data-sim="decibels" data-title="Fuentes, distancia y nivel sonoro"></div>
<div class="sim-guide"><ul>
<li>Coloque dos fuentes iguales: el nivel aumenta 3 dB. Con diez, 10 dB.</li>
<li>Aleje el micrófono al doble de distancia de una fuente: el nivel baja 6 dB.</li>
</ul></div>
</section>

<section>
<h2>La audición humana</h2>
<p>El oído humano joven percibe frecuencias entre unos 20 Hz y 20 kHz; con la edad, el límite superior baja (presbiacusia): a los 50 años suele estar en 12–14 kHz. La sensibilidad no es uniforme: es máxima entre 2 y 5 kHz (la resonancia del canal auditivo, un tubo de unos 2.5 cm cerrado por el tímpano) y cae mucho en los graves. Las <span class="term">curvas de igual sonoridad</span> muestran qué nivel necesita cada frecuencia para parecer igual de fuerte que un tono de 1 kHz; su unidad es el fonio. Los sonómetros aplican la ponderación «A» (dBA) para imitar esa sensibilidad.</p>
<div class="sim" data-sim="hearing" data-title="Generador de tonos y umbral de audición"></div>
<div class="box warn">
<h4>Cuidado con el volumen</h4>
<p>Antes de usar el generador, baje el volumen del equipo. Los tonos puros agudos pueden resultar molestos aun a niveles moderados.</p>
</div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Halle la velocidad del sonido en el aire a −20 °C, 0 °C y 35 °C.
<details><summary>Respuesta</summary><p>319, 331 y 352 m/s.</p></details></li>
<li><span class="lvl">Básico</span>Un sonido de 1 kHz tiene 80 dB. Halle su intensidad, su amplitud de presión y su amplitud de desplazamiento en el aire.
<details><summary>Respuesta</summary><p>\(I=10^{-4}\) W/m²; \(p_0=\sqrt{2ZI}=0.29\) Pa; \(s_0=p_0/(Z\omega)=0.11\ \mu\)m.</p></details></li>
<li><span class="lvl">Intermedio</span>Un parlante emite 1 W uniformemente. ¿A qué distancia el nivel es de 85 dB? ¿Y de 60 dB?
<details><summary>Respuesta</summary><p>\(I=P/4\pi r^2\): 85 dB → \(r=15.9\) m; 60 dB → \(r=282\) m.</p></details></li>
<li><span class="lvl">Intermedio</span>En una fábrica hay 6 máquinas de 82 dB cada una. ¿Cuál es el nivel total? ¿Cuántas hay que apagar para bajar a 85 dB?
<details><summary>Respuesta</summary><p>\(82+10\log6=89.8\) dB. Con 3 máquinas: 86.8 dB; con 2: 85.0 dB. Hay que apagar 4.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que, para un gas ideal, la razón entre las velocidades adiabática e isotérmica del sonido es \(\sqrt\gamma\) y estime el error de Newton para el aire.
<details><summary>Respuesta</summary><p>\(B_{ad}=\gamma p\), \(B_{iso}=p\); \(\sqrt{1.4}=1.18\): Newton obtenía un 15 % menos (unos 290 m/s a 20 °C).</p></details></li>
</ol>
</section>
</template>

<!-- 18-acustica.html -->
<template class="chapter-src" data-id="acustica" data-num="18" data-title="Tubos, instrumentos y escalas musicales" data-part="Parte V · Sonido" data-short="Modos de tubos abiertos y cerrados, tubo de resonancia, resonador de Helmholtz, timbre, consonancia y temperamento">
<p class="lead">Los instrumentos de viento son columnas de aire con modos normales, como las cuerdas. La diferencia está en las condiciones de borde: un extremo abierto obliga a la presión a ser la atmosférica, uno cerrado impide el movimiento del aire. De esas condiciones dependen las notas que un tubo puede dar y, en buena medida, el carácter de su sonido.</p>

<section>
<h2>Ondas estacionarias en tubos</h2>
<p>En un tubo largo y angosto el sonido viaja como onda plana. Las condiciones en los extremos son:</p>
<ul>
<li><strong>Extremo cerrado:</strong> el aire no puede moverse; nodo de desplazamiento y vientre de presión.</li>
<li><strong>Extremo abierto:</strong> la presión es (casi) la atmosférica; nodo de presión y vientre de desplazamiento.</li>
</ul>
<p>Como en la cuerda, los modos quedan determinados por cuántas fracciones de longitud de onda caben:</p>
<div class="eq key" data-name="Modos de tubos">\[\text{abierto–abierto: }f_n=\frac{nv}{2L},\quad n=1,2,3,\dots\qquad\text{cerrado–abierto: }f_n=\frac{(2n-1)v}{4L},\quad n=1,2,3,\dots\]</div>
<p>Un tubo cerrado en un extremo suena una octava más grave que uno abierto de igual longitud y sólo tiene armónicos impares. La flauta se comporta como un tubo abierto; el clarinete, como uno cerrado (la boquilla con la caña actúa como extremo cerrado), por eso su registro grave tiene un timbre hueco, pobre en armónicos pares, y al «sobresoplar» salta una duodécima (al tercer armónico) en lugar de una octava.</p>
<p>La onda no se refleja exactamente en el borde de un extremo abierto: la presión se iguala un poco afuera. La <span class="term">corrección de extremo</span> es \(\Delta L\approx0.6a\) para un tubo de radio \(a\) sin pestaña, y la longitud efectiva es \(L+0.6a\) por cada extremo abierto.</p>
<div class="sim" data-sim="pipe-modes" data-title="Modos de una columna de aire: desplazamiento y presión"></div>
<div class="sim-guide"><ul>
<li>Compare las gráficas: donde el desplazamiento tiene un vientre, la presión tiene un nodo, y viceversa.</li>
<li>Cierre un extremo: el modo fundamental pasa a ser un cuarto de onda y su frecuencia baja a la mitad.</li>
</ul></div>
</section>

<section>
<h2>El tubo de resonancia</h2>
<p>Un experimento clásico para medir la velocidad del sonido: un diapasón vibra sobre un tubo vertical parcialmente lleno de agua. Al bajar el nivel del agua, la columna de aire (cerrada abajo, abierta arriba) entra en resonancia cuando su longitud es \(\lambda/4\), \(3\lambda/4\), \(5\lambda/4\)… La distancia entre dos resonancias consecutivas es \(\lambda/2\), independiente de la corrección de extremo: \(v=2f\,\Delta L\).</p>
<div class="sim" data-sim="resonance-tube" data-title="Tubo de resonancia: medir la velocidad del sonido"></div>
</section>

<section>
<h2>El resonador de Helmholtz</h2>
<p>Al soplar sobre el cuello de una botella se oye una nota mucho más grave de lo que correspondería a un tubo de su tamaño. El aire del cuello (sección \(S\), longitud efectiva \(L'\)) se mueve como un pistón de masa \(\rho SL'\), y el aire del interior (volumen \(V\)) actúa como un resorte: al comprimirlo adiabáticamente, su presión cambia en \(\Delta p=-\rho v^2\,\Delta V/V\). La frecuencia del oscilador resultante es</p>
<div class="eq key" data-name="Resonador de Helmholtz">\[f_H=\frac{v}{2\pi}\sqrt{\frac{S}{V\,L'}} .\]</div>
<p>Es un oscilador de un solo grado de libertad: las dimensiones son pequeñas frente a la longitud de onda. Explica el sonido de las botellas, la resonancia del cuerpo de una guitarra (unos 100 Hz, por la boca) y el «retumbe» de un automóvil con una ventana abierta. Se usan resonadores de Helmholtz para absorber ruido de baja frecuencia en salas y en tubos de escape.</p>
<div class="sim" data-sim="helmholtz" data-title="Resonador de Helmholtz: la botella que suena"></div>
</section>

<section>
<h2>Timbre</h2>
<p>Dos instrumentos que tocan la misma nota con la misma intensidad suenan distinto porque sus espectros son distintos: el <span class="term">timbre</span> depende de la proporción entre los armónicos y de cómo evolucionan en el tiempo (el ataque y la extinción de la nota). Algunos rasgos característicos:</p>
<ul>
<li><strong>Flauta:</strong> casi sinusoidal, con pocos armónicos débiles.</li>
<li><strong>Clarinete (registro grave):</strong> predominan los armónicos impares.</li>
<li><strong>Violín y voz:</strong> el arco o las cuerdas vocales producen una onda en diente de sierra (todos los armónicos, decayendo como \(1/n\)); la caja del instrumento o el tracto vocal refuerzan ciertas bandas de frecuencia, los <span class="term">formantes</span>. En la voz, los formantes distinguen las vocales.</li>
<li><strong>Campanas y platillos:</strong> sus modos no son armónicos (no son múltiplos de una fundamental), y la altura percibida es ambigua.</li>
</ul>
<div class="sim" data-sim="timbre" data-title="Timbre: espectros de instrumentos y vocales"></div>
<div class="sim-guide"><ul>
<li>Escuche la «a» y la «i» con la misma fundamental: sólo cambian los formantes.</li>
<li>Quite la fundamental de un sonido con muchos armónicos: el oído sigue percibiendo la misma altura (la «fundamental ausente»). Por eso se oye el bajo en un teléfono que no transmite frecuencias menores que 300 Hz.</li>
</ul></div>
</section>

<section>
<h2>Consonancia y escalas</h2>
<p>Dos notas suenan consonantes cuando sus armónicos coinciden. Si las frecuencias están en razón \(p/q\) con enteros pequeños, muchos armónicos coinciden exactamente, y los que no coinciden están lejos entre sí; si la razón es complicada, hay pares de armónicos muy próximos que producen batimientos ásperos.</p>
<div class="tablewrap narrow"><table>
<tr><th>Intervalo</th><th class="c">Razón justa</th><th class="c">Temperado \(2^{n/12}\)</th><th class="c">Diferencia (cents)</th></tr>
<tr><td>Octava</td><td class="c">2/1</td><td class="c">2.0000</td><td class="c">0</td></tr>
<tr><td>Quinta</td><td class="c">3/2 = 1.5000</td><td class="c">1.4983</td><td class="c">−2.0</td></tr>
<tr><td>Cuarta</td><td class="c">4/3 = 1.3333</td><td class="c">1.3348</td><td class="c">+2.0</td></tr>
<tr><td>Tercera mayor</td><td class="c">5/4 = 1.2500</td><td class="c">1.2599</td><td class="c">+13.7</td></tr>
<tr><td>Tercera menor</td><td class="c">6/5 = 1.2000</td><td class="c">1.1892</td><td class="c">−15.6</td></tr>
</table></div>
<p>Una escala construida sólo con intervalos justos no permite cambiar de tonalidad: doce quintas justas no completan exactamente siete octavas (\((3/2)^{12}/2^7=1.0136\), la <em>coma pitagórica</em>). El <span class="term">temperamento igual</span>, generalizado desde el siglo XVIII, divide la octava en doce semitonos iguales de razón \(2^{1/12}\), y reparte el error entre todos los intervalos. El <span class="term">cent</span> es la centésima parte de un semitono temperado: un intervalo de razón \(r\) mide \(1200\log_2r\) cents.</p>
<div class="sim" data-sim="intervals" data-title="Intervalos: armónicos que coinciden y batimientos"></div>
<div class="sim-guide"><ul>
<li>Con la quinta justa (3/2) los armónicos 3 de la nota grave y 2 de la aguda coinciden. Con la temperada, quedan separados unos 0.7 Hz a 220 Hz: un batimiento lento.</li>
<li>Escuche la tercera mayor justa y la temperada: la diferencia de 14 cents es audible como un leve batimiento.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un tubo de órgano abierto mide 2.0 m. Halle sus tres primeras frecuencias a 20 °C. ¿Y si está cerrado en un extremo?
<details><summary>Respuesta</summary><p>Abierto: 85.8, 172 y 257 Hz. Cerrado: 42.9, 129 y 214 Hz.</p></details></li>
<li><span class="lvl">Básico</span>Con un diapasón de 512 Hz, se hallan resonancias con columnas de aire de 15.9 cm y 49.3 cm. Halle la velocidad del sonido y la corrección de extremo.
<details><summary>Respuesta</summary><p>\(\lambda/2=33.4\) cm, \(v=342\) m/s; \(\lambda/4=16.7\) cm, corrección 0.8 cm.</p></details></li>
<li><span class="lvl">Intermedio</span>Una botella de 750 mL tiene un cuello de 2.0 cm de diámetro y 8.0 cm de largo. Estime la frecuencia de Helmholtz (corrección del cuello: \(L'=L+1.5a\)).
<details><summary>Respuesta</summary><p>\(S=3.14\) cm², \(L'=9.5\) cm: \(f=\dfrac{343}{2\pi}\sqrt{\dfrac{3.14\times10^{-4}}{7.5\times10^{-4}\cdot0.095}}=114\) Hz.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Cuántos cents mide una quinta justa? ¿Y la coma pitagórica?
<details><summary>Respuesta</summary><p>\(1200\log_2(1.5)=702.0\) cents; coma: \(1200\log_2(1.0136)=23.5\) cents.</p></details></li>
<li><span class="lvl">Avanzado</span>Un tubo abierto de 60 cm toca su fundamental a 20 °C. Si la temperatura del aire sube a 30 °C durante el concierto, ¿cuántos cents sube la nota? ¿Qué pasa con las cuerdas?
<details><summary>Respuesta</summary><p>\(f\propto v\propto\sqrt T\): \(1200\log_2\sqrt{303/293}=29\) cents (más de un cuarto de semitono). Las cuerdas tienden a bajar, al dilatarse y perder tensión: los instrumentos se desafinan en sentidos opuestos.</p></details></li>
</ol>
</section>
</template>

<!-- 19-doppler.html -->
<template class="chapter-src" data-id="doppler" data-num="19" data-title="Efecto Doppler y ondas de choque" data-part="Parte V · Sonido" data-short="Fuente y observador en movimiento, paso de una sirena, ecos Doppler, efecto Doppler de la luz, cono de Mach y estampido sónico">
<p class="lead">La sirena de una ambulancia suena más aguda cuando se acerca y más grave cuando se aleja. Christian Doppler explicó en 1842 que la frecuencia percibida depende del movimiento de la fuente y del observador respecto al medio. El mismo efecto permite medir la velocidad de la sangre con ultrasonido, la de los automóviles con radar y la expansión del universo con la luz de las galaxias.</p>

<section>
<h2>Fuente y observador en movimiento</h2>
<h3>Fuente en movimiento</h3>
<p>Una fuente que emite con frecuencia \(f\) se mueve con velocidad \(v_s\) hacia un observador en reposo. Cada frente de onda se emite desde un punto más adelantado que el anterior: delante de la fuente, los frentes quedan separados \(\lambda'=(v-v_s)/f\) en lugar de \(v/f\). Como las ondas siguen viajando con la velocidad \(v\) del medio, el observador recibe</p>
<div class="eq key" data-name="Doppler: fuente en movimiento">\[f'=\frac{v}{\lambda'}=f\,\frac{v}{v-v_s}\quad(\text{acercándose}),\qquad f'=f\,\frac{v}{v+v_s}\quad(\text{alejándose}).\]</div>
<h3>Observador en movimiento</h3>
<p>Si es el observador quien se mueve con \(v_o\) hacia una fuente en reposo, la longitud de onda no cambia, pero el observador encuentra las crestas con mayor frecuencia, porque se acerca a ellas con velocidad relativa \(v+v_o\):</p>
<div class="eq key" data-name="Doppler: observador en movimiento">\[f'=f\,\frac{v+v_o}{v}\quad(\text{acercándose}).\]</div>
<p>Ambos casos se resumen, para movimientos a lo largo de la línea que une fuente y observador, en</p>
<div class="eq key" data-name="Fórmula general del efecto Doppler">\[f'=f\,\frac{v+v_o}{v-v_s},\]</div>
<p>con \(v_o\) y \(v_s\) positivas cuando cada uno se mueve hacia el otro. Las dos situaciones no son simétricas: para el sonido importa quién se mueve respecto al aire. Si los movimientos no son colineales, sólo cuentan las componentes de las velocidades a lo largo de la línea de visión.</p>
<div class="sim" data-sim="doppler-fronts" data-title="Frentes de onda de una fuente y un observador en movimiento"></div>
<div class="sim-guide"><ul>
<li>Con la fuente a \(v_s=0.5v\) la frecuencia delante se duplica, pero un observador que se acerca a \(0.5v\) a una fuente quieta sólo la multiplica por 1.5.</li>
<li>Lleve la fuente a \(v_s=v\): todos los frentes delanteros se apilan en un mismo punto. Es la «barrera del sonido».</li>
</ul></div>
</section>

<section>
<h2>El paso de una fuente</h2>
<p>Cuando una fuente pasa a una distancia \(d\) de un observador, el ángulo \(\theta\) entre su velocidad y la línea de visión cambia continuamente, y la frecuencia percibida baja de manera gradual, no abrupta:</p>
<div class="eq">\[f'(t)=\frac{f}{1-\dfrac{v_s}{v}\cos\theta(t_e)},\]</div>
<p>donde \(\theta\) se evalúa en el instante de emisión \(t_e\) (el sonido tarda en llegar). Cuanto más cerca pasa la fuente, más brusco es el cambio. La razón entre la frecuencia de acercamiento y la de alejamiento, \((v+v_s)/(v-v_s)\), permite estimar la velocidad del vehículo: para 2 semitonos (razón 1.122), \(v_s\approx0.058v\approx70\) km/h.</p>
<div class="sim" data-sim="doppler-passby" data-title="Una sirena que pasa: frecuencia percibida y sonido"></div>
<div class="sim-guide"><ul>
<li>Escuche el paso a 100 km/h y a distancias de 3 m y 50 m: el descenso de tono es el mismo en total, pero más brusco si la fuente pasa cerca.</li>
<li>El volumen también cambia: la intensidad decae como \(1/r^2\).</li>
</ul></div>
</section>

<section>
<h2>Ecos Doppler: radar y ultrasonido</h2>
<p>Si una onda se refleja en un objeto que se acerca con velocidad \(u\), el objeto actúa primero como observador en movimiento y luego como fuente en movimiento. Para \(u\ll v\):</p>
<div class="eq key" data-name="Desplazamiento Doppler de un eco">\[\Delta f=f'-f\approx\frac{2u\cos\theta}{v}\,f .\]</div>
<p>Un ecógrafo Doppler emite a unos 5 MHz; la sangre que se mueve a 50 cm/s produce un desplazamiento de unos 3 kHz, audible, que se escucha y se representa en colores. Un radar de tránsito a 24 GHz detecta un automóvil a 100 km/h por un desplazamiento de 4.4 kHz.</p>
<div class="sim" data-sim="doppler-echo" data-title="Eco Doppler: medir velocidades con ondas"></div>
</section>

<section>
<h2>El efecto Doppler de la luz</h2>
<p>La luz no necesita un medio, y sólo importa la velocidad relativa \(u\) entre fuente y observador. La relatividad especial da</p>
<div class="eq">\[f'=f\sqrt{\frac{1+u/c}{1-u/c}}\quad(\text{acercamiento}),\qquad \frac{\Delta\lambda}{\lambda}\approx\frac uc\quad(u\ll c).\]</div>
<p>Las líneas espectrales de las galaxias lejanas aparecen desplazadas hacia el rojo en proporción a su distancia: es la ley de Hubble, evidencia de la expansión del universo. El mismo principio, aplicado a la luz de las estrellas, ha revelado miles de planetas extrasolares por el pequeño vaivén que producen en su estrella (unos m/s).</p>
</section>

<section>
<h2>Ondas de choque</h2>
<p>Si la fuente va más rápido que las ondas (\(v_s\gt v\)), los frentes de onda quedan detrás de ella y se superponen sobre la superficie de un cono, el <span class="term">cono de Mach</span>, cuyo semiángulo cumple</p>
<div class="eq key" data-name="Cono de Mach">\[\sen\alpha=\frac{v}{v_s}=\frac1{\mathrm{Ma}},\qquad \mathrm{Ma}=\frac{v_s}{v}\ \ (\text{número de Mach}).\]</div>
<p>Sobre el cono, la energía de muchos frentes llega a la vez: es una <span class="term">onda de choque</span>, un salto brusco de presión. Un avión supersónico arrastra su cono a lo largo de todo su recorrido, y cada observador en tierra oye el <em>estampido sónico</em> cuando el cono pasa sobre él (no sólo cuando el avión «rompe la barrera»). La estela en V de un barco, el chasquido de un látigo (cuya punta supera la velocidad del sonido) y la radiación de Cherenkov (la luz azul de los reactores nucleares, emitida por electrones más rápidos que la luz en el agua) son ondas de choque.</p>
<div class="sim" data-sim="mach-cone" data-title="Cono de Mach y estampido sónico"></div>
<div class="sim-guide"><ul>
<li>Con \(\mathrm{Ma}=2\) el semiángulo es \(30^\circ\). Observe cuánto después del paso del avión llega el estampido al observador en tierra.</li>
<li>La estela de un barco en aguas profundas forma siempre un ángulo de unos \(19.5^\circ\), sin importar su velocidad (ángulo de Kelvin): se debe a la dispersión de las olas, que hace que la energía viaje a la velocidad de grupo.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una ambulancia con sirena de 700 Hz se acerca a 25 m/s. ¿Qué frecuencia oye un peatón? ¿Y cuando se aleja?
<details><summary>Respuesta</summary><p>755 Hz y 652 Hz (con \(v=343\) m/s).</p></details></li>
<li><span class="lvl">Básico</span>Un ciclista viaja a 10 m/s hacia una sirena de fábrica de 500 Hz. ¿Qué frecuencia oye?
<details><summary>Respuesta</summary><p>\(500\cdot353/343=515\) Hz.</p></details></li>
<li><span class="lvl">Intermedio</span>El tono de un automóvil que pasa baja de 480 Hz a 400 Hz. ¿Con qué velocidad viaja?
<details><summary>Respuesta</summary><p>\((v+v_s)/(v-v_s)=1.2\Rightarrow v_s=v\cdot0.2/2.2=31\) m/s (112 km/h).</p></details></li>
<li><span class="lvl">Intermedio</span>Un ecógrafo de 4 MHz mide un desplazamiento de 2.6 kHz en la sangre de una arteria, con un ángulo de \(60^\circ\) entre el haz y el flujo. Halle la velocidad de la sangre (\(v=1540\) m/s).
<details><summary>Respuesta</summary><p>\(u=\dfrac{v\,\Delta f}{2f\cos\theta}=1.0\) m/s.</p></details></li>
<li><span class="lvl">Avanzado</span>Un avión vuela a Mach 1.8 a 9000 m de altura. ¿Cuánto tiempo después de pasar sobre un observador oye éste el estampido? (Suponga \(v=300\) m/s constante.)
<details><summary>Respuesta</summary><p>\(\sen\alpha=1/1.8\), \(\alpha=33.7^\circ\). El cono alcanza al observador cuando el avión ha avanzado \(h/\tg\alpha=13.5\) km: \(t=13.5\ \text{km}/(540\ \text{m/s})=25\) s.</p></details></li>
</ol>
</section>
</template>

<!-- 20-ondas-2d.html -->
<template class="chapter-src" data-id="ondas-2d" data-num="20" data-title="Ondas en dos y tres dimensiones" data-part="Parte VI · Ondas en el plano y en el espacio" data-short="Cubeta de ondas, ondas planas, circulares y esféricas, principio de Huygens, refracción, membranas, tambores y figuras de Chladni">
<p class="lead">En una superficie o en el espacio, las ondas pueden viajar en cualquier dirección. Aparecen fenómenos sin análogo en una dimensión: los frentes se curvan al pasar de un medio a otro, la amplitud disminuye al alejarse de la fuente y las superficies vibrantes desarrollan patrones de líneas nodales de gran belleza.</p>

<section>
<h2>La ecuación de onda en varias dimensiones</h2>
<p>Una membrana tensa (tensión por unidad de longitud \(\mathcal T\), densidad superficial \(\sigma\)) o la superficie de una cubeta poco profunda cumplen</p>
<div class="eq key" data-name="Ecuación de onda en 2D y 3D">\[\pddv ut=v^2\nabla^2u,\qquad \nabla^2=\pddv{}x+\pddv{}y\ \left(+\pddv{}z\right),\qquad v_{\text{membrana}}=\sqrt{\frac{\mathcal T}{\sigma}} .\]</div>
<p>Las soluciones elementales son:</p>
<ul>
<li><strong>Ondas planas</strong> \(u=A\cos(\vb k\cdot\vb r-\omega t)\), con \(|\vb k|=\omega/v\). El vector de onda \(\vb k\) apunta en la dirección de propagación, perpendicular a los frentes.</li>
<li><strong>Ondas circulares</strong> (en 2D) que salen de una fuente puntual: lejos de ella, \(u\approx\dfrac{A}{\sqrt r}\cos(kr-\omega t)\). La energía se reparte sobre circunferencias de longitud \(2\pi r\), y la intensidad cae como \(1/r\).</li>
<li><strong>Ondas esféricas</strong> (en 3D): \(u=\dfrac Ar\cos(kr-\omega t)\) es solución exacta. La intensidad cae como \(1/r^2\).</li>
</ul>
<p>La simulación siguiente resuelve numéricamente la ecuación de onda en 2D: es una cubeta de ondas virtual.</p>
<div class="sim" data-sim="ripple-tank" data-title="Cubeta de ondas"></div>
<div class="sim-guide"><ul>
<li>Haga clic en la cubeta para dejar caer gotas: cada una produce un anillo, y los anillos se atraviesan sin perturbarse.</li>
<li>Con la barrera con dos rendijas, la onda plana se convierte en dos fuentes circulares coherentes: aparecen franjas de interferencia (capítulo 21).</li>
<li>Con el reflector parabólico, una onda plana converge en el foco.</li>
</ul></div>
</section>

<section>
<h2>Principio de Huygens, reflexión y refracción</h2>
<p>Christiaan Huygens propuso en 1678 que cada punto de un frente de onda actúa como fuente de ondas secundarias, y que el nuevo frente es la envolvente de todas ellas. El principio explica de manera geométrica la propagación rectilínea, la reflexión y la refracción.</p>
<p>Si una onda plana pasa oblicuamente a un medio donde es más lenta (por ejemplo, de agua profunda a agua somera, donde \(v=\sqrt{gh}\)), las ondas secundarias del lado lento avanzan menos, y el frente gira. La frecuencia no cambia en la frontera, de modo que \(\lambda\) cambia en proporción a \(v\), y la continuidad de los frentes a lo largo de la frontera da la <span class="term">ley de Snell</span>:</p>
<div class="eq key" data-name="Ley de Snell">\[\frac{\sen\theta_1}{v_1}=\frac{\sen\theta_2}{v_2}\qquad\Longleftrightarrow\qquad n_1\sen\theta_1=n_2\sen\theta_2\ \ (n=c/v).\]</div>
<p>Si la onda pasa a un medio más rápido, existe un ángulo crítico \(\sen\theta_c=v_1/v_2\) a partir del cual no hay onda transmitida: es la <span class="term">reflexión total</span>. Por la refracción, las olas llegan a la playa casi paralelas a la orilla, sin importar su dirección mar adentro, y el sonido se escucha más lejos en las noches frías (el aire caliente arriba curva el sonido hacia el suelo).</p>
<div class="sim" data-sim="refraction-tank" data-title="Refracción de olas al cambiar la profundidad"></div>
<div class="sim-guide"><ul>
<li>Mida en la simulación los ángulos de los frentes a cada lado y compruebe la ley de Snell con la razón de velocidades indicada.</li>
<li>Invierta los medios (de lento a rápido) y aumente el ángulo de incidencia hasta superar el ángulo crítico: la onda se refleja completamente.</li>
</ul></div>
</section>

<section>
<h2>Modos de una membrana rectangular</h2>
<p>Una membrana rectangular de lados \(a\) y \(b\), fija en sus bordes, tiene modos que son productos de senos (separación de variables):</p>
<div class="eq key" data-name="Modos de la membrana rectangular">\[u_{mn}=A\sen\frac{m\pi x}a\,\sen\frac{n\pi y}b\,\cos\omega_{mn}t,\qquad f_{mn}=\frac v2\sqrt{\left(\frac ma\right)^2+\left(\frac nb\right)^2} .\]</div>
<p>El modo \((m,n)\) tiene \(m-1\) líneas nodales paralelas al eje \(y\) y \(n-1\) paralelas al eje \(x\). Las frecuencias ya no son múltiplos de la fundamental: una membrana no produce un tono musical definido. En una membrana cuadrada, los modos \((m,n)\) y \((n,m)\) tienen la misma frecuencia (están <em>degenerados</em>), y cualquier combinación de ellos también es un modo, con líneas nodales que pueden ser diagonales o curvas.</p>
<div class="sim" data-sim="membrane-rect" data-title="Modos de una membrana rectangular"></div>
</section>

<section>
<h2>El tambor circular</h2>
<p>En una membrana circular de radio \(a\), la separación de variables en coordenadas polares lleva a las funciones de Bessel \(J_m\):</p>
<div class="eq key" data-name="Modos del tambor circular">\[u_{mn}=A\,J_m\!\left(\frac{j_{mn}r}{a}\right)\cos(m\phi)\cos\omega_{mn}t,\qquad f_{mn}=\frac{j_{mn}}{2\pi a}\,v ,\]</div>
<p>donde \(j_{mn}\) es el \(n\)-ésimo cero de \(J_m\). El modo \((m,n)\) tiene \(m\) diámetros nodales y \(n-1\) círculos nodales. Las razones de frecuencias son \(1:1.594:2.136:2.296:2.653:\dots\), muy lejos de la serie armónica: por eso un tambor suena más a «golpe» que a nota. Los timbales logran una altura definida porque el aire encerrado y la rigidez acercan varios modos a razones casi armónicas (2:3:4…).</p>
<div class="sim" data-sim="drum-modes" data-title="Modos de un tambor circular"></div>
<div class="sim-guide"><ul>
<li>Recorra los modos y compare sus frecuencias con las de una cuerda: no son múltiplos enteros.</li>
<li>Escuche el golpe en el centro y cerca del borde: en el centro sólo se excitan los modos con \(m=0\).</li>
</ul></div>
</section>

<section>
<h2>Figuras de Chladni</h2>
<p>En 1787 Ernst Chladni espolvoreó arena sobre placas metálicas y las hizo vibrar con un arco de violín: la arena se acumulaba en las líneas nodales y dibujaba figuras sorprendentes. Las placas obedecen una ecuación de cuarto orden (la rigidez a la flexión) y sus modos son más complejos que los de una membrana. Una buena aproximación para una placa cuadrada libre combina dos modos degenerados:</p>
<div class="eq">\[u\approx\cos\frac{m\pi x}{L}\cos\frac{n\pi y}{L}\pm\cos\frac{n\pi x}{L}\cos\frac{m\pi y}{L}.\]</div>
<p>Las figuras de Chladni se usan todavía en la construcción de violines y guitarras: los luthiers observan los patrones nodales de las tapas para ajustar su espesor.</p>
<div class="sim" data-sim="chladni" data-title="Figuras de Chladni: la arena busca las líneas nodales"></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una ola llega a la costa con un ángulo de \(40^\circ\) en aguas de 10 m de profundidad. ¿Con qué ángulo viaja en aguas de 2 m?
<details><summary>Respuesta</summary><p>\(\sen\theta_2=\sen40^\circ\sqrt{2/10}=0.287\Rightarrow\theta_2=16.7^\circ\).</p></details></li>
<li><span class="lvl">Básico</span>Una membrana cuadrada de 30 cm tiene fundamental de 100 Hz. Halle las frecuencias de los modos (1,2), (2,2) y (1,3).
<details><summary>Respuesta</summary><p>\(f_{mn}=100\sqrt{(m^2+n^2)/2}\): 158, 200 y 224 Hz.</p></details></li>
<li><span class="lvl">Intermedio</span>Un parche de tambor de 18 cm de radio tiene \(\sigma=0.26\) kg/m² y tensión \(\mathcal T=3000\) N/m. Halle la frecuencia de su modo fundamental y la del modo (1,1).
<details><summary>Respuesta</summary><p>\(v=107\) m/s; \(f_{01}=2.405\cdot107/(2\pi\cdot0.18)=228\) Hz; \(f_{11}=1.594f_{01}=363\) Hz.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Cuál es el ángulo crítico para el sonido que pasa del aire (343 m/s) al agua (1480 m/s)? ¿Qué fracción de la energía entra al agua en incidencia normal?
<details><summary>Respuesta</summary><p>\(\theta_c=13.4^\circ\). \(\mathcal T=4Z_1Z_2/(Z_1+Z_2)^2=1.1\times10^{-3}\).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que \(u=f(r-vt)/r\) satisface la ecuación de onda en 3D con simetría esférica, \(\nabla^2u=\frac1{r^2}\partial_r(r^2\partial_ru)=\frac1r\partial_r^2(ru)\).
<details><summary>Respuesta</summary><p>\(ru=f(r-vt)\) cumple la ecuación de onda 1D en \(r\); dividiendo por \(r\) se obtiene el resultado.</p></details></li>
</ol>
</section>
</template>

<!-- 21-interferencia.html -->
<template class="chapter-src" data-id="interferencia" data-num="21" data-title="Interferencia" data-part="Parte VI · Ondas en el plano y en el espacio" data-short="Dos fuentes coherentes, experimento de Young, parlantes, láminas delgadas, anillos de Newton, interferómetro de Michelson y coherencia">
<p class="lead">Cuando dos ondas de la misma frecuencia se superponen, la intensidad resultante no es la suma de las intensidades: en unos puntos se refuerzan y en otros se anulan. La interferencia es la prueba más directa de la naturaleza ondulatoria de un fenómeno; con ella Thomas Young demostró en 1801 que la luz es una onda, y con ella se midieron las ondas gravitacionales en 2015.</p>

<section>
<h2>Dos fuentes coherentes</h2>
<p>Dos fuentes puntuales oscilan con la misma frecuencia y una diferencia de fase constante \(\delta_0\): son <span class="term">coherentes</span>. En un punto a distancias \(r_1\) y \(r_2\) de ellas, las dos ondas llegan con una diferencia de fase</p>
<div class="eq key" data-name="Diferencia de fase por camino">\[\delta=k(r_2-r_1)+\delta_0=\frac{2\pi}{\lambda}\Delta r+\delta_0 .\]</div>
<p>Sumando con fasores (capítulo 1), con amplitudes iguales \(A\), la amplitud resultante es \(2A|\cos(\delta/2)|\) y la intensidad</p>
<div class="eq key" data-name="Intensidad de dos ondas coherentes">\[I=4I_1\cos^2\frac\delta2=2I_1(1+\cos\delta).\]</div>
<p>Con \(\delta_0=0\), hay interferencia <em>constructiva</em> (\(I=4I_1\)) donde \(\Delta r=m\lambda\) y <em>destructiva</em> (\(I=0\)) donde \(\Delta r=(m+\tfrac12)\lambda\). Los lugares de \(\Delta r\) constante son hipérbolas con focos en las fuentes. La energía no se crea ni se destruye: se redistribuye, y el promedio espacial de \(I\) es \(2I_1\).</p>
<p>Si las fuentes son <em>incoherentes</em> (su fase relativa cambia al azar, como en dos bombillas), el término \(\cos\delta\) promedia cero y simplemente se suman las intensidades.</p>
<div class="sim" data-sim="two-source" data-title="Interferencia de dos fuentes: franjas hiperbólicas"></div>
<div class="sim-guide"><ul>
<li>Aumente la separación \(d\) de las fuentes: aparecen más líneas nodales, una por cada media longitud de onda que cabe en \(d\).</li>
<li>Cambie el desfase \(\delta_0\) a \(180^\circ\): la línea central pasa a ser nodal. Así se orienta el haz de una antena de arreglo en fase.</li>
</ul></div>
</section>

<section>
<h2>El experimento de Young</h2>
<p>Young iluminó dos rendijas muy próximas con la luz de una sola fuente, lo que garantiza la coherencia. Sobre una pantalla a distancia \(L\gg d\), un punto a altura \(y\) ve una diferencia de caminos \(\Delta r\approx d\sen\theta\approx d\,y/L\). Los máximos están en</p>
<div class="eq key" data-name="Franjas de Young">\[d\sen\theta_m=m\lambda,\qquad y_m=\frac{m\lambda L}{d},\qquad \Delta y=\frac{\lambda L}{d},\qquad I(y)=4I_1\cos^2\!\left(\frac{\pi d\,y}{\lambda L}\right).\]</div>
<p>Midiendo la separación de las franjas, Young obtuvo las longitudes de onda de los colores: unos 0.4 µm para el violeta y 0.7 µm para el rojo. Con luz blanca, la franja central es blanca y las demás se tiñen de colores, porque cada longitud de onda tiene su propio espaciado.</p>
<div class="sim" data-sim="young" data-title="Experimento de Young con luz de cualquier color"></div>
<div class="sim-guide"><ul>
<li>Con luz blanca sólo se distinguen unas pocas franjas: los máximos de los distintos colores se desfasan rápidamente. Es un efecto de la baja coherencia temporal de la luz blanca.</li>
<li>Reduzca la separación entre rendijas: las franjas se separan. Las rendijas deben estar a menos de un milímetro para que las franjas se vean a simple vista.</li>
</ul></div>
</section>

<section>
<h2>Interferencia de sonido</h2>
<p>Dos parlantes alimentados con la misma señal forman un patrón de interferencia en la sala. Si se invierte la polaridad de uno, los mínimos y máximos se intercambian, y en la línea central el sonido grave casi desaparece: por eso es importante conectar los parlantes con la misma polaridad. La <span class="term">cancelación activa de ruido</span> de los audífonos aprovecha la interferencia destructiva: un micrófono capta el ruido y el audífono emite la onda invertida.</p>
<div class="sim" data-sim="speakers" data-title="Dos parlantes: escuche la interferencia"></div>
<div class="sim-guide"><ul>
<li>Mueva al oyente a lo largo de la línea horizontal y escuche cómo cambia el volumen.</li>
<li>Invierta la polaridad de un parlante: en la línea central, el sonido casi desaparece.</li>
</ul></div>
</section>

<section>
<h2>Láminas delgadas</h2>
<p>Los colores de las burbujas de jabón y de las manchas de aceite se deben a la interferencia entre la luz reflejada en las dos caras de una película delgada. Hay dos fuentes de diferencia de fase:</p>
<ul>
<li>El camino adicional dentro de la película, \(2nt\cos\theta_t\) (con \(n\) el índice de refracción y \(t\) el espesor).</li>
<li>Un cambio de fase de \(\pi\) en cada reflexión desde un medio de índice menor hacia uno mayor (el equivalente óptico de la reflexión en una cuerda más pesada, capítulo 13).</li>
</ul>
<p>Para una película de jabón en aire (una reflexión con cambio de fase y otra sin él), en incidencia normal:</p>
<div class="eq key" data-name="Película delgada en aire">\[2nt=\left(m+\tfrac12\right)\lambda\ \ (\text{máximo de reflexión}),\qquad 2nt=m\lambda\ \ (\text{mínimo}).\]</div>
<p>Cuando la película es mucho más delgada que \(\lambda\), las dos reflexiones se cancelan: la parte superior de una burbuja a punto de romperse se ve negra. Si la película está entre dos medios de índices crecientes (como el recubrimiento antirreflejo sobre un vidrio), ambas reflexiones cambian de fase y las condiciones se invierten: \(2nt=\lambda/2\) da reflexión mínima, el acoplador de cuarto de onda del capítulo 13.</p>
<div class="sim" data-sim="thin-film" data-title="Colores de una película delgada"></div>
<h3>Anillos de Newton</h3>
<p>Una lente convexa de radio \(R\) apoyada sobre un vidrio plano deja entre ambos una capa de aire de espesor \(t\approx r^2/2R\). La luz reflejada forma anillos concéntricos oscuros donde \(2t=m\lambda\), es decir \(r_m=\sqrt{m\lambda R}\), con un punto oscuro en el centro. Los ópticos usan estos anillos para comprobar la forma de las superficies con precisión de una fracción de longitud de onda.</p>
<div class="sim" data-sim="newton-rings" data-title="Anillos de Newton"></div>
</section>

<section>
<h2>El interferómetro de Michelson</h2>
<p>Un divisor de haz separa la luz en dos brazos perpendiculares; cada haz se refleja en un espejo y ambos se recombinan. Si uno de los espejos se desplaza una distancia \(\Delta x\), el camino de ese brazo cambia en \(2\Delta x\), y por el detector pasan</p>
<div class="eq key" data-name="Franjas en el interferómetro de Michelson">\[N=\frac{2\Delta x}{\lambda}\]</div>
<p>franjas. Contando franjas se miden desplazamientos de una fracción de micrómetro, o se mide \(\lambda\) con un desplazamiento conocido. Michelson y Morley lo usaron en 1887 para buscar el movimiento de la Tierra respecto al «éter», sin encontrarlo, un resultado clave para la relatividad. LIGO, con brazos de 4 km y la luz recorriéndolos cientos de veces, detecta cambios de longitud de \(10^{-18}\) m: la milésima parte del diámetro de un protón.</p>
<div class="sim" data-sim="michelson" data-title="Interferómetro de Michelson: contar franjas"></div>
</section>

<section>
<h2>Coherencia</h2>
<p>Ninguna fuente real es perfectamente monocromática. Si su espectro tiene un ancho \(\Delta f\), su fase se mantiene predecible sólo durante un <span class="term">tiempo de coherencia</span> \(\tau_c\sim1/\Delta f\) (capítulo 15), y dos haces de la misma fuente sólo interfieren si sus caminos difieren en menos que la <span class="term">longitud de coherencia</span> \(\ell_c=c\tau_c\approx\lambda^2/\Delta\lambda\). La luz blanca tiene \(\ell_c\approx1\ \mu\)m (por eso sólo las películas muy delgadas muestran colores); una lámpara de sodio, unos milímetros; un láser estabilizado, kilómetros.</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>En un experimento de Young con \(d=0.25\) mm y \(L=1.5\) m, la separación entre franjas es de 3.5 mm. Halle \(\lambda\).
<details><summary>Respuesta</summary><p>\(\lambda=d\,\Delta y/L=583\) nm (amarillo).</p></details></li>
<li><span class="lvl">Básico</span>Dos parlantes separados 2.0 m emiten en fase a 343 Hz. Un oyente está a 4.0 m de uno y 5.5 m del otro. ¿Interferencia constructiva o destructiva?
<details><summary>Respuesta</summary><p>\(\lambda=1\) m, \(\Delta r=1.5\lambda\): destructiva.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Qué espesor mínimo debe tener una película de jabón (\(n=1.33\)) para reflejar con máxima intensidad la luz de 600 nm?
<details><summary>Respuesta</summary><p>\(2nt=\lambda/2\Rightarrow t=113\) nm.</p></details></li>
<li><span class="lvl">Intermedio</span>En un interferómetro de Michelson con luz de 633 nm, se cuentan 1000 franjas al mover el espejo. ¿Cuánto se movió?
<details><summary>Respuesta</summary><p>\(\Delta x=N\lambda/2=0.317\) mm.</p></details></li>
<li><span class="lvl">Avanzado</span>El décimo anillo oscuro de Newton tiene un radio de 4.2 mm con luz de 589 nm. Halle el radio de curvatura de la lente. ¿Cómo cambian los anillos si el espacio se llena de agua?
<details><summary>Respuesta</summary><p>\(R=r^2/(m\lambda)=3.0\) m. Con agua, el espesor óptico es \(2nt\): los radios se reducen en \(1/\sqrt{1.33}\).</p></details></li>
</ol>
</section>

<!-- 22-difraccion.html -->
<template class="chapter-src" data-id="difraccion" data-num="22" data-title="Difracción" data-part="Parte VI · Ondas en el plano y en el espacio" data-short="Rendija simple, de Fresnel a Fraunhofer, redes de difracción y resolución espectral, abertura circular, criterio de Rayleigh y ley de Bragg">
<p class="lead">Las ondas se curvan al pasar por aberturas y alrededor de obstáculos. Por eso se oye a alguien que habla detrás de una esquina, aunque no se le vea: las ondas sonoras miden metros y se difractan mucho; las de la luz miden menos de un micrómetro y su difracción sólo se nota con aberturas pequeñas. La difracción limita lo que pueden ver los telescopios y los microscopios, y es la herramienta con que se descubrió la estructura del ADN.</p>

<section>
<h2>Difracción por una rendija</h2>
<p>Según el principio de Huygens–Fresnel, cada punto de una abertura iluminada emite ondas secundarias que interfieren entre sí. Lejos de una rendija de ancho \(a\) (régimen de <span class="term">Fraunhofer</span>), las ondas que llegan a un punto en la dirección \(\theta\) desde los dos bordes difieren en un camino \(a\sen\theta\). Dividiendo la rendija en franjas y sumando sus fasores, éstos forman un arco de circunferencia cuya cuerda es la amplitud resultante:</p>
<div class="eq key" data-name="Difracción por una rendija">\[I(\theta)=I_0\left(\frac{\sen\beta}{\beta}\right)^2,\qquad \beta=\frac{\pi a\sen\theta}{\lambda}.\]</div>
<p>Los mínimos están donde el arco se cierra en circunferencias completas:</p>
<div class="eq key" data-name="Mínimos de una rendija">\[a\sen\theta_m=m\lambda,\qquad m=\pm1,\pm2,\dots\]</div>
<p>El máximo central tiene un ancho angular de \(2\lambda/a\): cuanto más estrecha es la rendija, más se abre el haz. Los máximos secundarios son mucho más débiles: el primero tiene el 4.7 % de la intensidad central. Si \(a\lt\lambda\), no hay ningún mínimo: la rendija se comporta como una fuente puntual que emite en todas direcciones.</p>
<div class="sim" data-sim="single-slit" data-title="Difracción por una rendija y el arco de fasores"></div>
<div class="sim-guide"><ul>
<li>Mueva el ángulo de observación hasta el primer mínimo: el arco de fasores se cierra en una circunferencia completa.</li>
<li>Reduzca el ancho de la rendija: el patrón se ensancha. Con \(a=\lambda\) el primer mínimo está a \(90^\circ\).</li>
</ul></div>
</section>

<section>
<h2>De Fresnel a Fraunhofer</h2>
<p>Cerca de la abertura, la difracción es distinta: la pantalla ve casi la sombra geométrica de la rendija, con franjas en sus bordes (difracción de <span class="term">Fresnel</span>). El parámetro que separa ambos regímenes es el <span class="term">número de Fresnel</span>,</p>
<div class="eq">\[N_F=\frac{a^2}{\lambda z},\]</div>
<p>donde \(z\) es la distancia a la pantalla. Si \(N_F\gg1\), domina la óptica geométrica; si \(N_F\ll1\), el patrón de Fraunhofer. Para un rayo de sol que pasa por una ventana de 1 m, la distancia de Fraunhofer \(a^2/\lambda\) es de 2000 km; para una rendija de 0.1 mm, de 2 cm.</p>
<div class="sim" data-sim="fresnel-slit" data-title="Difracción de Fresnel: del campo cercano al lejano"></div>
</section>

<section>
<h2>Varias rendijas y redes de difracción</h2>
<p>Con \(N\) rendijas de ancho \(a\) y separación \(d\), cada rendija produce el mismo patrón de difracción, y las \(N\) contribuciones interfieren como los \(N\) fasores del capítulo 7:</p>
<div class="eq key" data-name="Red de N rendijas">\[I(\theta)=I_0\left(\frac{\sen\beta}{\beta}\right)^2\left(\frac{\sen N\alpha}{N\sen\alpha}\right)^2,\qquad \alpha=\frac{\pi d\sen\theta}{\lambda}.\]</div>
<p>Los <span class="term">máximos principales</span>, \(N^2\) veces más intensos que los de una sola rendija, están en</p>
<div class="eq key" data-name="Ecuación de la red">\[d\sen\theta=m\lambda,\qquad m=0,\pm1,\pm2,\dots\]</div>
<p>y entre cada par hay \(N-1\) mínimos y \(N-2\) máximos secundarios débiles. Con muchas rendijas los máximos principales se vuelven líneas finas cuya posición depende de \(\lambda\): la red separa los colores, como un prisma, pero con mucha más precisión. Una red de 600 líneas por milímetro desvía la luz roja de 650 nm unos \(23^\circ\) en primer orden.</p>
<p>Dos longitudes de onda próximas se distinguen si el máximo de una cae en el primer mínimo de la otra. El <span class="term">poder de resolución</span> de la red es</p>
<div class="eq key" data-name="Poder de resolución de una red">\[R=\frac{\lambda}{\Delta\lambda_{\min}}=mN .\]</div>
<p>Para separar el doblete amarillo del sodio (589.0 y 589.6 nm, \(R=982\)) en primer orden se necesitan al menos 982 rendijas iluminadas. Los surcos de un CD (separados 1.6 µm) forman una red: por eso se ven los colores del arcoíris.</p>
<div class="sim" data-sim="grating" data-title="De dos rendijas a una red de difracción"></div>
<div class="sim-guide"><ul>
<li>Pase de \(N=2\) a \(N=10\): los máximos principales quedan en el mismo lugar pero se estrechan, y aparecen \(N-2\) máximos secundarios entre ellos.</li>
<li>Active el doblete del sodio y aumente \(N\) hasta resolver las dos líneas en el primer orden; luego pase al segundo orden: se necesita la mitad de rendijas.</li>
<li>Haga \(d\) igual a \(2a\): faltan los órdenes pares, porque coinciden con los mínimos de la difracción de cada rendija.</li>
</ul></div>
</section>

<section>
<h2>Abertura circular y criterio de Rayleigh</h2>
<p>La luz que atraviesa una abertura circular de diámetro \(D\) (una lente, la pupila, el espejo de un telescopio) no se concentra en un punto, sino en el <span class="term">disco de Airy</span>, rodeado de anillos débiles. El primer mínimo está en</p>
<div class="eq key" data-name="Disco de Airy">\[\sen\theta_1=1.22\,\frac{\lambda}D,\qquad I(\theta)=I_0\left[\frac{2J_1(x)}{x}\right]^2,\quad x=\frac{\pi D\sen\theta}{\lambda}.\]</div>
<p>(El factor 1.22 es el primer cero de \(J_1\) dividido por \(\pi\).) Dos fuentes puntuales, como dos estrellas, se distinguen apenas cuando el centro de una imagen cae en el primer mínimo de la otra: es el <span class="term">criterio de Rayleigh</span>, \(\theta_{\min}=1.22\lambda/D\). El ojo humano (pupila de 3 mm) separa unos \(2\times10^{-4}\) rad: dos faros de un automóvil a unos 7 km. El telescopio espacial Hubble (2.4 m) resuelve 0.05 segundos de arco. Para ver más detalle hay que aumentar \(D\) o reducir \(\lambda\): de ahí los radiotelescopios de cientos de metros, los interferómetros de miles de kilómetros y los microscopios electrónicos.</p>
<div class="sim" data-sim="rayleigh" data-title="Criterio de Rayleigh: ¿una estrella o dos?"></div>
</section>

<section>
<h2>Difracción de rayos X: la ley de Bragg</h2>
<p>Los átomos de un cristal forman una red tridimensional con separaciones de décimas de nanómetro, comparables a la longitud de onda de los rayos X. Cada plano de átomos refleja una pequeña parte del haz; las reflexiones en planos sucesivos, separados \(d\), interfieren constructivamente si</p>
<div class="eq key" data-name="Ley de Bragg">\[2d\sen\theta=m\lambda,\]</div>
<p>con \(\theta\) medido desde los planos. Midiendo los ángulos de los haces difractados se reconstruye la estructura del cristal. Con esta técnica William y Lawrence Bragg determinaron en 1913 la estructura de la sal, y Rosalind Franklin obtuvo en 1952 la «fotografía 51», cuyo patrón en forma de X reveló la estructura helicoidal del ADN.</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Luz de 633 nm pasa por una rendija de 0.10 mm. ¿Qué ancho tiene el máximo central en una pantalla a 2.0 m?

<!-- 23-luz.html -->
<template class="chapter-src" data-id="luz" data-num="23" data-title="La luz como onda: ondas electromagnéticas y polarización" data-part="Parte VI · Ondas en el plano y en el espacio" data-short="Ondas electromagnéticas, espectro, polarización, ley de Malus, ángulo de Brewster, reflexión de Fresnel, birrefringencia y dispersión de la luz">
<p class="lead">Las ecuaciones de Maxwell predicen ondas de campos eléctricos y magnéticos que viajan a \(3\times10^8\) m/s: la luz. Todo lo estudiado en el curso (superposición, interferencia, difracción, dispersión, impedancia) se aplica a ellas. Este capítulo cierra el recorrido con lo que es propio de las ondas transversales en el espacio: la polarización.</p>

<section>
<h2>Ondas electromagnéticas</h2>
<p>En el vacío, los campos \(\vb E\) y \(\vb B\) cumplen la ecuación de onda con velocidad \(c=1/\sqrt{\mu_0\varepsilon_0}\). Una onda plana que viaja según \(+z\):</p>
<div class="eq key" data-name="Onda electromagnética plana">\[\vb E=E_0\cos(kz-\omega t)\,\uv x,\qquad \vb B=\frac{E_0}c\cos(kz-\omega t)\,\uv y,\qquad \omega=ck .\]</div>
<p>Los campos son transversales, perpendiculares entre sí y están en fase. La intensidad es \(I=\tfrac12c\varepsilon_0E_0^2=E_0^2/(2\eta_0)\), donde \(\eta_0=\sqrt{\mu_0/\varepsilon_0}\approx377\ \Omega\) es la impedancia del vacío, el análogo exacto de la impedancia de una cuerda. En un medio transparente la velocidad es \(c/n\), con \(n\) el índice de refracción, y la impedancia es \(\eta_0/n\).</p>
<p>Para un estudio detallado de las ondas electromagnéticas (deducción desde las ecuaciones de Maxwell, energía, presión de radiación, radiación de antenas), véase el <em>Atlas de Electromagnetismo</em>, el curso hermano de éste.</p>
<div class="sim" data-sim="em-wave" data-title="Onda electromagnética plana"></div>
</section>

<section>
<h2>Polarización</h2>
<p>Como \(\vb E\) es perpendicular a la propagación, puede oscilar en cualquier dirección del plano \(xy\). La superposición de dos componentes perpendiculares con desfase \(\delta\),</p>
<div class="eq">\[\vb E=E_{0x}\cos(kz-\omega t)\,\uv x+E_{0y}\cos(kz-\omega t+\delta)\,\uv y,\]</div>
<p>hace que el extremo de \(\vb E\) recorra una elipse: es exactamente la figura de Lissajous de igual frecuencia del capítulo 7. Con \(\delta=0\) o \(\pi\) la polarización es <em>lineal</em>; con \(E_{0x}=E_{0y}\) y \(\delta=\pm\pi/2\), <em>circular</em>; en general, <em>elíptica</em>. Una cuerda puede polarizarse igual: sacudiéndola en círculos, cada punto describe una circunferencia. Las ondas longitudinales, como el sonido, no tienen polarización.</p>
<p>La luz del Sol o de una bombilla es <em>no polarizada</em>: emitida por muchos átomos independientes, su dirección de oscilación cambia al azar en tiempos del orden de \(10^{-14}\) s.</p>
<div class="sim" data-sim="polarization-states" data-title="Estados de polarización"></div>
</section>

<section>
<h2>Polarizadores y ley de Malus</h2>
<p>Un polarizador (un filtro Polaroid, una rejilla de alambres para microondas) transmite sólo la componente de \(\vb E\) paralela a su eje. Si incide luz polarizada linealmente a un ángulo \(\theta\) del eje, pasa la amplitud \(E_0\cos\theta\), y la intensidad</p>
<div class="eq key" data-name="Ley de Malus">\[I=I_0\cos^2\theta .\]</div>
<p>Con luz no polarizada, el primer polarizador transmite la mitad. Dos polarizadores cruzados bloquean todo, pero si entre ellos se pone un tercero a \(45^\circ\), pasa la octava parte: un polarizador no sólo absorbe, también «gira» la luz que deja pasar.</p>
<div class="sim" data-sim="malus-chain" data-title="Cadena de polarizadores"></div>
</section>

<section>
<h2>Reflexión, ángulo de Brewster y ecuaciones de Fresnel</h2>
<p>Cuando la luz incide sobre una superficie de vidrio o de agua, la fracción reflejada depende de la polarización. Las <span class="term">ecuaciones de Fresnel</span>, que se obtienen de las condiciones de continuidad de los campos en la frontera (como las de la unión de dos cuerdas, capítulo 13), dan los coeficientes de amplitud para la polarización perpendicular (s) y paralela (p) al plano de incidencia:</p>
<div class="eq key" data-name="Ecuaciones de Fresnel">\[r_s=\frac{n_1\cos\theta_i-n_2\cos\theta_t}{n_1\cos\theta_i+n_2\cos\theta_t},\qquad r_p=\frac{n_2\cos\theta_i-n_1\cos\theta_t}{n_2\cos\theta_i+n_1\cos\theta_t}.\]</div>
<p>En incidencia normal ambas dan \(r=(n_1-n_2)/(n_1+n_2)\), la fórmula de impedancias: el vidrio refleja el 4 %. Para la polarización p existe un ángulo en el que no hay reflexión, el <span class="term">ángulo de Brewster</span>:</p>
<div class="eq key" data-name="Ángulo de Brewster">\[\tg\theta_B=\frac{n_2}{n_1}.\]</div>
<p>La luz reflejada a ese ángulo está totalmente polarizada (s). Por eso los reflejos en el agua o en el asfalto están parcialmente polarizados horizontalmente, y las gafas de sol polarizadas, con eje vertical, los eliminan. Los fotógrafos usan filtros polarizadores con el mismo propósito.</p>
<div class="sim" data-sim="fresnel-brewster" data-title="Reflectancia en función del ángulo: Fresnel y Brewster"></div>
<div class="sim-guide"><ul>
<li>Busque el ángulo en que se anula la reflexión p: es \(56.3^\circ\) para el vidrio (\(n=1.5\)) y \(53.1^\circ\) para el agua.</li>
<li>Haga que la luz vaya del vidrio al aire: por encima del ángulo crítico la reflexión es total para ambas polarizaciones.</li>
</ul></div>
</section>

<section>
<h2>Birrefringencia y láminas de onda</h2>
<p>En algunos cristales (calcita, cuarzo) y en plásticos sometidos a tensión, el índice de refracción depende de la dirección de polarización: son <span class="term">birrefringentes</span>. Una lámina de espesor \(t\) introduce entre sus dos ejes un desfase</p>
<div class="eq">\[\delta=\frac{2\pi}{\lambda}(n_e-n_o)\,t .\]</div>
<p>Una <em>lámina de cuarto de onda</em> (\(\delta=\pi/2\)) convierte la luz lineal a \(45^\circ\) de sus ejes en circular; una de <em>media onda</em> (\(\delta=\pi\)) gira la polarización lineal. Entre polarizadores cruzados, un plástico tensionado muestra franjas de colores que revelan dónde se concentran los esfuerzos: es la <em>fotoelasticidad</em>, usada para estudiar piezas mecánicas. Las pantallas de cristal líquido funcionan girando la polarización con un campo eléctrico.</p>
<div class="sim" data-sim="waveplate" data-title="Lámina birrefringente entre polarizadores"></div>
</section>

<section>
<h2>Dispersión de la luz: prismas y arcoíris</h2>
<p>El índice de refracción del vidrio y del agua disminuye con la longitud de onda (dispersión normal, capítulo 16); una aproximación es la ley de Cauchy, \(n(\lambda)\approx A+B/\lambda^2\). Un prisma desvía más el violeta que el rojo y separa los colores. En una gota de agua, la luz que sufre una reflexión interna sale con una desviación mínima de unos \(138^\circ\), y se concentra en un cono de \(42^\circ\) alrededor del punto antisolar: el arcoíris, con el rojo por fuera. El secundario, con dos reflexiones, está a \(51^\circ\) con los colores invertidos.</p>
<div class="sim" data-sim="prism" data-title="Dispersión en un prisma"></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un láser de 5 mW tiene un haz de 2 mm de diámetro. Halle la intensidad y la amplitud del campo eléctrico.
<details><summary>Respuesta</summary><p>\(I=1.59\) kW/m²; \(E_0=\sqrt{2\eta_0I}=1.1\) kV/m.</p></details></li>
<li><span class="lvl">Básico</span>Luz no polarizada de 60 W/m² atraviesa dos polarizadores con ejes a \(30^\circ\). ¿Qué intensidad sale?
<details><summary>Respuesta</summary><p>\(30\cos^230^\circ=22.5\) W/m².</p></details></li>
<li><span class="lvl">Intermedio</span>Halle el ángulo de Brewster para luz que se refleja en un diamante (\(n=2.42\)) y la reflectancia en incidencia normal.
<details><summary>Respuesta</summary><p>\(\theta_B=67.5^\circ\); \(R=(1.42/3.42)^2=17\) %: por eso brilla tanto.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Qué espesor mínimo debe tener una lámina de cuarto de onda de cuarzo (\(n_e-n_o=0.0092\)) para 589 nm?
<details><summary>Respuesta</summary><p>\(t=\lambda/(4\Delta n)=16\ \mu\)m.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que en el ángulo de Brewster los rayos reflejado y refractado son perpendiculares.
<details><summary>Respuesta</summary><p>Con \(\tg\theta_B=n_2/n_1\) y Snell, \(\sen\theta_t=\cos\theta_B\), es decir \(\theta_t=90^\circ-\theta_B\): el ángulo entre ambos rayos es \(180^\circ-\theta_B-\theta_t=90^\circ\). Los dipolos del medio oscilan en la dirección del rayo reflejado y no radian en esa dirección.</p></details></li>
</ol>
</section>
</template>

        const a = (qx[0] - q[0]) / h, b = (qy[0] - q[0]) / h, c = (qx[1] - q[1]) / h, d = (qy[1] - q[1]) / h;
        const det = a * d - b * c;
        if (Math.abs(det) < 1e-9) break;
        p = [p[0] + (d * ex - b * ey) / det, p[1] + (-c * ex + a * ey) / det, z0];
      }
      return p;
    }
  }
  EM.View3D = View3D;
})();

/* Portada: cuerda que se puede pulsar con el puntero */
(function () {
  'use strict';
  const EM = window.EM;
  EM.defineSim('home-hero', function (sim) {
    const cv = sim.canvas({ aspect: 1.25 });
    const N = 241;
    const S = new EM.String1D(N, { gamma: 0.15, courant: 0.95 });
    let drag = null;
    const geo = () => ({ x0: 30, x1: cv.w - 30, y0: cv.h * 0.42, A: cv.h * 0.3 });
    const pluck = (xp, yp) => {
      /* forma triangular con vértice en (xp, yp) */
      for (let i = 0; i < N; i++) { const x = i / (N - 1); S.y[i] = x < xp ? (yp * x) / xp : (yp * (1 - x)) / (1 - xp); S.yp[i] = S.y[i]; }
    };
    pluck(0.22, 0.6);
    EM.pointer(cv, {
      down: (x, y) => { const g = geo(); if (x < g.x0 || x > g.x1) return null; drag = 1; return 1; },
      move: (_, x, y) => {
        const g = geo();
        const xp = EM.M.clamp((x - g.x0) / (g.x1 - g.x0), 0.03, 0.97);
        const yp = EM.M.clamp(-(y - g.y0) / g.A, -1, 1);
        pluck(xp, yp);
        sim.redraw();
      },
      up: () => { drag = null; },
      hover: () => true
    });
    sim.hint('Arrastra la cuerda y suéltala', cv);
    const spec = new Float64Array(12);
    sim.animate((dt) => {
      if (drag) return;
      const n = Math.max(1, Math.round(dt / 0.0028));
      for (let k = 0; k < n * 2; k++) S.step();
      const [Kc, Uc] = S.energy();
      if (Kc + Uc < 0.01) pluck(0.08 + 0.4 * Math.random(), (Math.random() < 0.5 ? -1 : 1) * (0.45 + 0.35 * Math.random()));
    });
    sim.onDraw(() => {
      const g = geo(), ctx = cv.ctx;
      EM.draw.clear(cv);
      /* clavijas */
      ctx.fillStyle = EM.col('--ink-2');
      ctx.fillRect(g.x0 - 8, g.y0 - 16, 8, 32);
      ctx.fillRect(g.x1, g.y0 - 16, 8, 32);
      const pts = [];
      for (let i = 0; i < N; i++) pts.push([g.x0 + ((g.x1 - g.x0) * i) / (N - 1), g.y0 - S.y[i] * g.A]);
      EM.draw.poly(ctx, pts, { color: '--accent', width: 2.6 });
      /* espectro de modos: proyección sobre sen(nπx) */
      for (let n = 1; n <= spec.length; n++) {
        let s = 0;
        for (let i = 0; i < N; i++) s += S.y[i] * Math.sin((n * Math.PI * i) / (N - 1));
        spec[n - 1] = Math.abs((2 * s) / (N - 1));
      }
      const bx = g.x0, by = cv.h - 26, bw = (g.x1 - g.x0) / spec.length, H = cv.h * 0.2;
      const mx = Math.max(0.05, ...spec);
      EM.text(ctx, 'amplitud de cada armónico', bx, by - H - 10, { size: 11.5, color: '--ink-3' });
      for (let n = 0; n < spec.length; n++) {
        const h = (spec[n] / mx) * H;
        ctx.fillStyle = EM.alpha('--c1', 0.75);
        ctx.fillRect(bx + n * bw + 3, by - h, bw - 6, h);
        EM.text(ctx, String(n + 1), bx + n * bw + bw / 2, by + 14, { size: 10.5, mono: true, color: '--ink-3', align: 'center' });
      }
    });
  });
})();
