<p>En el plano complejo, los dos fasores giran a ritmos distintos: la diferencia de fase entre ellos crece como \((\omega_1-\omega_2)t\), y su suma pasa periódicamente de \(2A\) (en fase) a cero (en oposición).</p>
<div class="sim" data-sim="beats" data-title="Batimientos: dos tonos de frecuencias próximas"></div>
<div class="sim-guide"><ul>
<li>Escuche 440 Hz y 443 Hz: tres «golpes» por segundo. Con 440 y 470 Hz los batimientos son tan rápidos que se perciben como una aspereza; con diferencias mayores, como dos notas.</li>
<li>Con amplitudes distintas la envolvente no llega a cero: los batimientos son menos marcados.</li>
</ul></div>
</section>

<section>
<h2>Modulación de amplitud</h2>
<p>Los batimientos son un caso particular de modulación. Una señal portadora de alta frecuencia \(\omega_c\) cuya amplitud se varía lentamente con una señal \(m(t)=\mu\cos\omega_mt\):</p>
<div class="eq">\[x=A\left[1+\mu\cos\omega_mt\right]\cos\omega_ct=A\cos\omega_ct+\frac{\mu A}{2}\cos(\omega_c+\omega_m)t+\frac{\mu A}2\cos(\omega_c-\omega_m)t .\]</div>
<p>La señal modulada contiene tres frecuencias: la portadora y dos <span class="term">bandas laterales</span>. Una emisora de AM que transmite audio de hasta 5 kHz ocupa 10 kHz de espectro. Es el primer ejemplo de una idea central del curso: una señal que cambia en el tiempo contiene una banda de frecuencias.</p>
<div class="sim" data-sim="am-modulation" data-title="Modulación de amplitud y bandas laterales"></div>
</section>

<section>
<h2>Suma de N oscilaciones con desfase progresivo</h2>
<p>Un caso que reaparecerá en las redes de difracción (capítulo 22) y en las antenas: \(N\) oscilaciones de igual amplitud, cada una desfasada \(\delta\) respecto a la anterior. Los fasores forman un arco de polígono regular; sumando la serie geométrica,</p>
<div class="eq key" data-name="Suma de N fasores">\[\sum_{n=0}^{N-1}A\,\ee^{\ii n\delta}=A\,\ee^{\ii(N-1)\delta/2}\,\frac{\sen(N\delta/2)}{\sen(\delta/2)},\qquad |A_{\text{tot}}|=A\left|\frac{\sen(N\delta/2)}{\sen(\delta/2)}\right| .\]</div>
<p>Si \(\delta=0\) (o un múltiplo de \(2\pi\)) todos están en fase y la amplitud es \(NA\): la intensidad es \(N^2\) veces la de uno solo. Basta un pequeño desfase \(\delta=2\pi/N\) para que el polígono se cierre y la suma se anule. Cuanto mayor es \(N\), más estrecho es el pico.</p>
<div class="sim" data-sim="n-phasors" data-title="Suma de N fasores: el polígono que se cierra"></div>
<div class="sim-guide"><ul>
<li>Con \(N=8\), lleve \(\delta\) a \(45^\circ\): el polígono es un octógono cerrado y la amplitud es cero.</li>
<li>Entre ceros hay máximos secundarios mucho menores que el principal; con \(N\) grande, el primero vale aproximadamente el 4.5 % de la intensidad del principal.</li>
</ul></div>
</section>

<section>
<h2>Oscilaciones perpendiculares: figuras de Lissajous</h2>
<p>Un punto que oscila a la vez en \(x\) y en \(y\), por ejemplo un péndulo que puede moverse en dos direcciones o el haz de un osciloscopio con señales en ambas entradas:</p>
<div class="eq">\[x=A_x\cos(\omega_xt),\qquad y=A_y\cos(\omega_yt+\phi).\]</div>
<ul>
<li><strong>Igual frecuencia:</strong> la trayectoria es una elipse. Con \(\phi=0\) o \(\pi\), un segmento; con \(\phi=\pm\pi/2\) y amplitudes iguales, una circunferencia. Es la misma geometría que la polarización de la luz (capítulo 23).</li>
<li><strong>Frecuencias en razón racional \(p/q\):</strong> la curva se cierra; el número de veces que toca los lados verticales y horizontales da la razón de frecuencias. Se usaron para comparar frecuencias con el osciloscopio.</li>
<li><strong>Razón irracional:</strong> la curva nunca se cierra y llena densamente el rectángulo.</li>
</ul>
<div class="sim" data-sim="lissajous" data-title="Figuras de Lissajous"></div>
<div class="sim-guide"><ul>
<li>Con \(\omega_y/\omega_x=2\) y \(\phi=90^\circ\) aparece un «ocho»; con \(\phi=0\), una parábola.</li>
<li>Desafine ligeramente la razón (por ejemplo, 2.01): la figura gira lentamente porque el desfase efectivo cambia con el tiempo. Es el análogo visual de los batimientos.</li>
</ul></div>
</section>

<section>
<h2>El armonógrafo</h2>
<p>En el siglo XIX se construían <span class="term">armonógrafos</span>: dos o más péndulos amortiguados que mueven una pluma sobre un papel. Las curvas resultantes son figuras de Lissajous cuya amplitud decae exponencialmente:</p>
<div class="eq">\[x=A_1\ee^{-\gamma t}\sen(\omega_1t+\phi_1)+A_2\ee^{-\gamma t}\sen(\omega_2t+\phi_2),\quad y=A_3\ee^{-\gamma t}\sen(\omega_3t+\phi_3)+\cdots\]</div>
<div class="sim" data-sim="harmonograph" data-title="Armonógrafo: figuras de Lissajous amortiguadas"></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Dos diapasones de 256 Hz y 260 Hz suenan juntos. ¿Cuántos batimientos por segundo se oyen y cuál es la frecuencia del tono percibido?
<details><summary>Respuesta</summary><p>4 batimientos/s; tono de 258 Hz.</p></details></li>
<li><span class="lvl">Básico</span>Una emisora de AM transmite a 1 MHz con audio de hasta 4.5 kHz. ¿Qué banda de frecuencias ocupa?
<details><summary>Respuesta</summary><p>De 995.5 kHz a 1004.5 kHz (9 kHz de ancho).</p></details></li>
<li><span class="lvl">Intermedio</span>Un afinador oye 3 batimientos/s entre una cuerda y un diapasón de 440 Hz. Al tensar la cuerda los batimientos pasan a 5/s. ¿Cuál era la frecuencia de la cuerda?
<details><summary>Respuesta</summary><p>Tensar sube la frecuencia; si los batimientos aumentan, la cuerda ya estaba por encima: 443 Hz.</p></details></li>
<li><span class="lvl">Intermedio</span>Para \(N=6\) fasores de igual amplitud, halle los desfases \(\delta\) (entre 0 y \(2\pi\)) en que la suma se anula.
<details><summary>Respuesta</summary><p>\(\delta=2\pi m/6\) con \(m=1,\dots,5\): 60°, 120°, 180°, 240°, 300°.</p></details></li>
<li><span class="lvl">Avanzado</span>En una figura de Lissajous cerrada, la curva toca 3 veces el borde superior y 2 veces el borde lateral derecho. ¿Cuál es la razón \(\omega_y/\omega_x\)?
<details><summary>Respuesta</summary><p>Cada toque del borde superior es un máximo de \(y\), y cada toque del borde derecho, un máximo de \(x\). En el período común hay tantos máximos como ciclos de cada coordenada: \(\omega_y/\omega_x=3/2\).</p></details></li>
</ol>
</section>
</template>

<!-- 08-nolineales.html -->
<template class="chapter-src" data-id="nolineales" data-num="8" data-title="Oscilaciones no lineales y caos" data-part="Parte II · Oscilaciones de un grado de libertad" data-short="Anarmonicidad, oscilador de Duffing y sus saltos, resonancia paramétrica, ciclos límite y péndulo caótico">
<p class="lead">La aproximación lineal es excelente para oscilaciones pequeñas, pero muchos fenómenos sólo existen fuera de ella: la frecuencia que cambia con la amplitud, la respuesta que salta bruscamente al variar la frecuencia, el columpio que se impulsa sin que nadie lo empuje, los relojes que mantienen su amplitud por sí solos y el movimiento caótico, determinista pero impredecible.</p>

<section>
<h2>Más allá de la aproximación lineal</h2>
<p>Si en el desarrollo del potencial se conservan los términos siguientes al cuadrático, la fuerza restauradora deja de ser lineal. Un modelo general para un oscilador ligeramente anarmónico es</p>
<div class="eq">\[\ddot x+\omega_0^2x+\alpha x^2+\beta x^3=0 .\]</div>
<p>Dos efectos aparecen de inmediato:</p>
<ul>
<li><strong>Generación de armónicos:</strong> si \(x\approx A\cos\omega t\), el término \(x^2\) produce \(\tfrac12A^2(1+\cos2\omega t)\) y el término \(x^3\), componentes en \(3\omega\). La oscilación deja de ser sinusoidal: su espectro contiene múltiplos de la frecuencia fundamental. (El término cuadrático, además, desplaza el centro de la oscilación: es la causa de la dilatación térmica de los sólidos.)</li>
<li><strong>Frecuencia dependiente de la amplitud:</strong> para el término cúbico (oscilador de Duffing) un cálculo perturbativo (método de Lindstedt–Poincaré) da</li>
</ul>
<div class="eq key" data-name="Corrección de frecuencia de Duffing">\[\omega\approx\omega_0\left(1+\frac{3\beta A^2}{8\omega_0^2}\right).\]</div>
<p>Si \(\beta\gt0\) el resorte se <em>endurece</em> y la frecuencia sube con la amplitud; si \(\beta\lt0\) se <em>ablanda</em>. El péndulo es un resorte blando: \(\sen\theta\approx\theta-\theta^3/6\) da \(\beta=-\omega_0^2/6\) y \(\omega\approx\omega_0(1-\theta_0^2/16)\), de acuerdo con el resultado exacto del capítulo 3.</p>
<div class="sim" data-sim="anharmonic" data-title="Oscilador anarmónico: forma de la onda y armónicos"></div>
<div class="sim-guide"><ul>
<li>Con sólo el término cúbico, el espectro tiene armónicos impares (3, 5, …); con el cuadrático aparecen también los pares y un desplazamiento medio.</li>
<li>Aumente la amplitud con \(\beta\gt0\): la frecuencia medida sube como predice la fórmula, mientras \(\beta A^2\) sea pequeño frente a \(\omega_0^2\).</li>
</ul></div>
</section>

<section>
<h2>El oscilador de Duffing forzado: histéresis y saltos</h2>
<p>Al forzar el oscilador de Duffing, \(\ddot x+\gamma\dot x+\omega_0^2x+\beta x^3=(F_0/m)\cos\omega t\), y suponer \(x\approx A\cos(\omega t-\delta)\) (balance armónico), se obtiene la relación entre amplitud y frecuencia:</p>
<div class="eq key" data-name="Respuesta de Duffing">\[\left[\left(\omega_0^2+\tfrac34\beta A^2-\omega^2\right)^2+\gamma^2\omega^2\right]A^2=\left(\frac{F_0}{m}\right)^2 .\]</div>
<p>La curva de resonancia se inclina hacia frecuencias altas (resorte duro) o bajas (blando). Si la inclinación es suficiente, para ciertas frecuencias hay <em>tres</em> amplitudes posibles: la intermedia es inestable, y el sistema elige una de las otras dos según su historia. Al barrer la frecuencia hacia arriba, la amplitud sigue la rama alta hasta que ésta termina y <em>salta</em> abajo; al barrer hacia abajo, salta arriba en otra frecuencia. Es un ciclo de <span class="term">histéresis</span>.</p>
<div class="sim" data-sim="duffing-sweep" data-title="Barrido de frecuencia en el oscilador de Duffing"></div>
<div class="sim-guide"><ul>
<li>Barra hacia arriba y luego hacia abajo: los puntos medidos (integrando la ecuación) siguen ramas distintas de la curva teórica.</li>
<li>Con \(\beta=0\) desaparece la histéresis y se recupera la lorentziana del capítulo 5.</li>
</ul></div>
</section>

<section>
<h2>Resonancia paramétrica</h2>
<p>Un niño en un columpio no recibe empujones: sube y baja su centro de masa, es decir, modifica periódicamente un <em>parámetro</em> del oscilador (la longitud efectiva del péndulo). Un péndulo cuyo punto de suspensión oscila verticalmente con \(a\cos\Omega t\) obedece la <span class="term">ecuación de Mathieu</span>:</p>
<div class="eq key" data-name="Ecuación de Mathieu">\[\ddot\theta+\gamma\dot\theta+\omega_0^2\left[1+h\cos\Omega t\right]\theta=0,\qquad h=\frac{a\Omega^2}{g}.\]</div>
<p>El reposo se vuelve inestable, y la oscilación crece exponencialmente, cuando \(\Omega\) está cerca de \(2\omega_0/n\) (\(n=1,2,\dots\)); la zona más ancha es \(\Omega\approx2\omega_0\): se bombea dos veces por ciclo. Para que haya crecimiento, la modulación debe superar al amortiguamiento: \(h\gt2\gamma/\omega_0\) en la resonancia principal. A diferencia de la resonancia ordinaria, si el sistema está exactamente en reposo, no se excita nada: hace falta una pequeña perturbación inicial.</p>
<p>Con la suspensión vibrando muy rápido (\(\Omega\gg\omega_0\)) y con amplitud suficiente ocurre algo sorprendente: el péndulo invertido se vuelve estable (el <em>péndulo de Kapitza</em>), condición \(a^2\Omega^2\gt2g\ell\).</p>
<div class="sim" data-sim="parametric" data-title="Péndulo con suspensión oscilante: resonancia paramétrica"></div>
<div class="sim-guide"><ul>
<li>Con \(\Omega=2\omega_0\) y \(h=0.3\), una perturbación mínima crece hasta oscilaciones grandes, limitadas sólo por la no linealidad.</li>
<li>Elija «invertido», \(\Omega=40\,\omega_0\) y aumente la amplitud de la suspensión hasta superar la condición de Kapitza: el péndulo se sostiene cabeza abajo.</li>
</ul></div>
</section>

<section>
<h2>Autooscilaciones y ciclos límite</h2>
<p>Un reloj, un violín o el corazón oscilan con una amplitud que no depende de cómo empezaron: la fuente de energía (la cuerda del reloj, el arco, el metabolismo) compensa exactamente las pérdidas en una amplitud determinada. El modelo clásico es el <span class="term">oscilador de van der Pol</span>, propuesto en 1926 para circuitos con válvulas de vacío:</p>
<div class="eq key" data-name="Oscilador de van der Pol">\[\ddot x-\mu\left(1-x^2\right)\dot x+\omega_0^2x=0 .\]</div>
<p>Para \(|x|\lt1\) el «amortiguamiento» es negativo y la oscilación crece; para \(|x|\gt1\) es positivo y decrece. Todas las trayectorias del espacio de fases convergen a una curva cerrada aislada, el <span class="term">ciclo límite</span>, de amplitud cercana a 2. Con \(\mu\) grande las oscilaciones se vuelven de <em>relajación</em>: lentas acumulaciones seguidas de descargas bruscas, como el latido cardíaco o el goteo de una llave.</p>
<div class="sim" data-sim="van-der-pol" data-title="Oscilador de van der Pol: el ciclo límite"></div>
</section>

<section>
<h2>El péndulo forzado y el caos</h2>
<p>Un péndulo amortiguado y forzado, sin aproximación de ángulo pequeño, cumple</p>
<div class="eq">\[\ddot\theta+\gamma\dot\theta+\omega_0^2\sen\theta=\frac{F_0}{mL}\cos\omega t .\]</div>
<p>Sólo tiene un grado de libertad, pero el forzamiento agrega el tiempo como tercera variable del espacio de fases, y eso basta para que aparezca el <span class="term">caos</span>: para ciertos valores de la fuerza el movimiento nunca se repite, y dos condiciones iniciales que difieren en \(10^{-6}\) rad divergen exponencialmente hasta volverse completamente distintas. El sistema es determinista, pero la predicción a largo plazo es imposible en la práctica.</p>
<p>Una herramienta para ver orden en el caos es la <span class="term">sección de Poincaré</span>: se marca el estado \((\theta,\dot\theta)\) una vez por período de la fuerza. Un movimiento periódico deja un solo punto (o \(n\) puntos si su período es \(n\) veces el de la fuerza); uno caótico dibuja una figura fractal, el <em>atractor extraño</em>.</p>
<div class="sim" data-sim="chaotic-pendulum" data-title="Péndulo forzado: sensibilidad a las condiciones iniciales y sección de Poincaré"></div>
<div class="sim-guide"><ul>
<li>Con \(F=0.9\) (en unidades de \(mL\omega_0^2\)) el movimiento se vuelve periódico tras un transitorio, y los dos péndulos coinciden.</li>
<li>Con \(F=1.15\) los dos péndulos, que empiezan separados una millonésima de radián, se separan visiblemente tras unas pocas decenas de oscilaciones; la sección de Poincaré dibuja el atractor extraño.</li>
</ul></div>
<p>Barriendo la amplitud de la fuerza y registrando los puntos de la sección de Poincaré se obtiene el <span class="term">diagrama de bifurcaciones</span>: un período, luego dos, cuatro, ocho… y caos. Esta cascada de duplicaciones de período tiene propiedades universales (las constantes de Feigenbaum) compartidas por sistemas tan distintos como fluidos, láseres y poblaciones de animales.</p>
<div class="sim" data-sim="bifurcation" data-title="Diagrama de bifurcaciones del péndulo forzado"></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un oscilador de Duffing con \(\omega_0=10\) rad/s y \(\beta=200\) m⁻²s⁻² oscila con amplitud 0.2 m. Estime su frecuencia.
<details><summary>Respuesta</summary><p>\(\omega\approx10\left(1+\frac{3\cdot200\cdot0.04}{800}\right)=10.3\) rad/s.</p></details></li>
<li><span class="lvl">Básico</span>Un columpio de 2.5 m de longitud efectiva. ¿Con qué frecuencia debe el niño subir y bajar su centro de masa para bombearlo de manera más eficaz?
<details><summary>Respuesta</summary><p>\(f_0=\tfrac1{2\pi}\sqrt{g/\ell}=0.315\) Hz; bombeo a \(2f_0=0.63\) Hz: dos veces por oscilación.</p></details></li>
<li><span class="lvl">Intermedio</span>Muestre que para \(x=A\cos\omega t\), \(x^3=\tfrac34A^3\cos\omega t+\tfrac14A^3\cos3\omega t\), y use el resultado para deducir la ecuación de balance armónico de Duffing sin amortiguamiento.
<details><summary>Respuesta</summary><p>Sustituyendo y conservando sólo la componente en \(\cos\omega t\): \((\omega_0^2-\omega^2)A+\tfrac34\beta A^3=F_0/m\).</p></details></li>
<li><span class="lvl">Intermedio</span>Para el péndulo de Kapitza, ¿qué amplitud mínima de vibración a 50 Hz estabiliza en posición invertida una varilla equivalente de 20 cm?
<details><summary>Respuesta</summary><p>\(a\gt\sqrt{2g\ell}/\Omega=\sqrt{2\cdot9.8\cdot0.2}/314=6.3\) mm.</p></details></li>
<li><span class="lvl">Avanzado</span>Si dos trayectorias caóticas se separan como \(\delta(t)=\delta_0\ee^{\lambda t}\) con \(\lambda=0.15\) s⁻¹, y la condición inicial se conoce con precisión \(10^{-6}\), ¿hasta qué tiempo se puede predecir el estado con un error menor que 0.1? ¿Y si la precisión mejora a \(10^{-12}\)?
<details><summary>Respuesta</summary><p>\(t=\ln(10^5)/0.15=77\) s; con \(10^{-12}\), \(t=\ln(10^{11})/0.15=169\) s. Mejorar un millón de veces la precisión sólo duplica el horizonte de predicción.</p></details></li>
</ol>
</section>
</template>

<!-- 09-acoplados.html -->
<template class="chapter-src" data-id="acoplados" data-num="9" data-title="Osciladores acoplados y modos normales" data-part="Parte III · Sistemas con varios grados de libertad" data-short="Dos masas acopladas, modos normales, transferencia de energía, método matricial, absorbedor dinámico y moléculas">
<p class="lead">Cuando dos osciladores se influyen mutuamente, el movimiento de cada uno deja de ser armónico: la energía va y viene entre ellos. Sin embargo, existen movimientos especiales, los modos normales, en los que todo el sistema oscila con una sola frecuencia. Encontrarlos convierte un problema acoplado en varios osciladores independientes, y es la idea que lleva directamente a las ondas.</p>

<section>
<h2>Dos masas y tres resortes</h2>
<p>Dos masas iguales \(m\) están unidas a paredes por resortes de constante \(k\), y entre sí por un resorte de acoplamiento \(\kappa\). Con \(x_1\), \(x_2\) los desplazamientos desde el equilibrio:</p>
<div class="eq">\[m\ddot x_1=-kx_1-\kappa(x_1-x_2),\qquad m\ddot x_2=-kx_2-\kappa(x_2-x_1).\]</div>
<p>Las ecuaciones están acopladas, pero se separan con las combinaciones \(q_1=x_1+x_2\) y \(q_2=x_1-x_2\). Sumándolas y restándolas:</p>
<div class="eq key" data-name="Modos normales de dos osciladores iguales">\[\ddot q_1+\omega_1^2q_1=0,\quad \omega_1=\sqrt{\frac km};\qquad \ddot q_2+\omega_2^2q_2=0,\quad \omega_2=\sqrt{\frac{k+2\kappa}{m}}.\]</div>
<p>Las \(q_i\) son las <span class="term">coordenadas normales</span>. En el <span class="term">modo</span> 1 las masas se mueven juntas (\(x_1=x_2\)) y el resorte central no se deforma; en el modo 2 se mueven en oposición (\(x_1=-x_2\)) y el resorte central trabaja doble, por eso su frecuencia es mayor. El movimiento más general es una superposición:</p>
<div class="eq">\[x_1=\tfrac12\left[A_1\cos(\omega_1t+\varphi_1)+A_2\cos(\omega_2t+\varphi_2)\right],\qquad x_2=\tfrac12\left[A_1\cos(\omega_1t+\varphi_1)-A_2\cos(\omega_2t+\varphi_2)\right].\]</div>
<div class="sim" data-sim="two-masses" data-title="Dos masas acopladas: modos normales y superposición"></div>
<div class="sim-guide"><ul>
<li>Elija el modo 1 o el modo 2: cada masa oscila armónicamente y el movimiento se repite indefinidamente.</li>
<li>Desplace sólo la masa 1: el movimiento parece complicado, pero las coordenadas normales (gráfica inferior) siguen siendo sinusoides puras.</li>
</ul></div>
</section>

<section>
<h2>Acoplamiento débil: transferencia de energía</h2>
<p>Si se desplaza sólo la primera masa (\(x_1=A\), \(x_2=0\), en reposo), se excitan ambos modos con igual amplitud. Usando la identidad de suma de cosenos:</p>
<div class="eq key" data-name="Batimientos entre modos">\[x_1=A\cos\!\left(\frac{\omega_2-\omega_1}{2}t\right)\cos\!\left(\frac{\omega_1+\omega_2}{2}t\right),\qquad x_2=A\sen\!\left(\frac{\omega_2-\omega_1}{2}t\right)\sen\!\left(\frac{\omega_1+\omega_2}{2}t\right).\]</div>
<p>Con acoplamiento débil (\(\kappa\ll k\)) las dos frecuencias son próximas y se obtienen <em>batimientos</em>: la energía pasa completamente de una masa a la otra y regresa. El tiempo de transferencia es</p>
<div class="eq">\[T_{\text{transf}}=\frac{\pi}{\omega_2-\omega_1}\approx\frac{\pi}{\omega_1}\,\frac{k}{\kappa}\qquad(\kappa\ll k).\]</div>
<p>Cuanto más débil el acoplamiento, más lenta la transferencia, pero siempre es total si los osciladores son idénticos. Si están desafinados, la transferencia es parcial: así funcionan los acopladores direccionales de fibra óptica y la transferencia de energía entre moléculas.</p>
<div class="sim" data-sim="coupled-pendulums" data-title="Péndulos acoplados por un resorte: la energía va y viene"></div>
<div class="sim-guide"><ul>
<li>Con acoplamiento débil, cuente cuántas oscilaciones tarda la energía en pasar al otro péndulo; compárelo con \(\omega_1/(\omega_2-\omega_1)\cdot\tfrac12\).</li>
<li>Haga un péndulo más largo que el otro: la transferencia deja de ser completa.</li>
</ul></div>
</section>

<section>
<h2>El método general: autovalores</h2>
<p>Para \(n\) grados de libertad con energías \(T=\tfrac12\dot{\vb{x}}^{\mathsf T}\mathsf M\dot{\vb{x}}\) y \(U=\tfrac12\vb{x}^{\mathsf T}\mathsf K\vb{x}\), las ecuaciones de movimiento son \(\mathsf M\ddot{\vb{x}}=-\mathsf K\vb{x}\). Probando \(\vb{x}=\vb{a}\cos(\omega t+\varphi)\):</p>
<div class="eq key" data-name="Problema de autovalores">\[\left(\mathsf K-\omega^2\mathsf M\right)\vb{a}=\vb 0\quad\Longrightarrow\quad\det\left(\mathsf K-\omega^2\mathsf M\right)=0 .\]</div>
<p>La ecuación secular da \(n\) frecuencias normales \(\omega_j\), y para cada una el vector \(\vb a_j\) da la forma del modo (las amplitudes relativas). Como \(\mathsf M\) y \(\mathsf K\) son simétricas y definidas positivas, todas las \(\omega_j^2\) son reales y positivas, y los modos son ortogonales en el sentido \(\vb a_i^{\mathsf T}\mathsf M\vb a_j=0\) si \(i\neq j\).</p>
<div class="box ex">
<h4>Masas distintas</h4>
<p>Dos masas \(m\) y \(2m\) entre paredes, con tres resortes iguales \(k\). Halle las frecuencias y los modos.</p>
<details><summary>Solución</summary>
<p>\(\mathsf K=k\begin{pmatrix}2&-1\\-1&2\end{pmatrix}\), \(\mathsf M=m\begin{pmatrix}1&0\\0&2\end{pmatrix}\). Con \(\lambda=m\omega^2/k\): \((2-\lambda)(2-2\lambda)-1=0\Rightarrow2\lambda^2-6\lambda+3=0\), \(\lambda=(3\mp\sqrt3)/2=0.634,\ 2.366\). Modos: \(a_2/a_1=2-\lambda=1.366\) (en fase) y \(-0.366\) (en oposición, con la masa grande casi quieta).</p>
</details>
</div>
<div class="sim" data-sim="normal-modes" data-title="Calculadora de modos normales para dos masas"></div>
</section>

<section>
<h2>Sistemas acoplados forzados y absorbedor dinámico</h2>
<p>Si se aplica una fuerza \(F_0\cos\omega t\) a la masa 1, la respuesta estacionaria tiene <em>dos</em> picos de resonancia, en \(\omega_1\) y \(\omega_2\): un sistema con \(n\) grados de libertad tiene \(n\) resonancias. Entre ellas aparece algo nuevo, una <span class="term">antirresonancia</span>, una frecuencia en la que la masa forzada queda quieta.</p>
<p>Este efecto se aprovecha en el <span class="term">absorbedor dinámico de vibraciones</span> (Frahm, 1909): a una máquina \(M\) que vibra con una frecuencia molesta \(\omega\) se le cuelga un oscilador pequeño \(m_a\), \(k_a\) sintonizado a esa frecuencia, \(\sqrt{k_a/m_a}=\omega\). La masa auxiliar oscila de modo que su resorte ejerce sobre la máquina una fuerza igual y opuesta a la excitación, y la máquina se detiene. Los rascacielos como el Taipei 101 usan versiones gigantes de este dispositivo (un péndulo de 660 toneladas) para reducir las oscilaciones por viento.</p>
<div class="sim" data-sim="vibration-absorber" data-title="Absorbedor dinámico de vibraciones"></div>
<div class="sim-guide"><ul>
<li>Sin absorbedor hay una sola resonancia. Al agregarlo aparecen dos, separadas, y entre ellas la máquina queda quieta justo en la frecuencia de sintonía.</li>
<li>Agregue amortiguamiento al absorbedor: los picos bajan, a cambio de que la antirresonancia deje de ser perfecta. Así se diseñan absorbedores que funcionan en una banda de frecuencias.</li>
</ul></div>
</section>

<section>
<h2>Vibraciones de moléculas</h2>
<p>Una molécula lineal simétrica como el CO<sub>2</sub> (O=C=O) se modela con tres masas \(m_O\), \(m_C\), \(m_O\) unidas por dos resortes \(k\). Para el movimiento a lo largo del eje hay tres soluciones de \(\det(\mathsf K-\omega^2\mathsf M)=0\):</p>
<ul>
<li>\(\omega=0\): traslación de toda la molécula (no es una vibración).</li>
<li>\(\omega_s=\sqrt{k/m_O}\): estiramiento simétrico; el carbono queda quieto.</li>
<li>\(\omega_a=\sqrt{\dfrac km_O\left(1+\dfrac{2m_O}{m_C}\right)}\): estiramiento asimétrico; el carbono se mueve contra los oxígenos.</li>
</ul>
<p>La razón predicha \(\omega_a/\omega_s=\sqrt{1+2\cdot16/12}=1.915\) se compara bien con las medidas, 2349 cm⁻¹ y 1388 cm⁻¹ (razón 1.69): la diferencia revela que el modelo de resortes independientes es demasiado simple. El modo asimétrico hace oscilar el momento dipolar de la molécula y absorbe radiación infrarroja: es una de las razones por las que el CO<sub>2</sub> es un gas de efecto invernadero. El modo simétrico no absorbe.</p>
<div class="sim" data-sim="triatomic" data-title="Modos de vibración de una molécula lineal triatómica"></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Dos masas de 0.5 kg con \(k=50\) N/m y \(\kappa=5\) N/m. Halle las frecuencias normales y el tiempo de transferencia de energía.
<details><summary>Respuesta</summary><p>\(\omega_1=10\) rad/s; \(\omega_2=\sqrt{60/0.5}=10.95\) rad/s; \(T=\pi/0.954=3.29\) s.</p></details></li>
<li><span class="lvl">Básico</span>Dos péndulos de 1 m acoplados débilmente intercambian su energía cada 30 s. ¿Cuál es la diferencia de frecuencias de los modos?
<details><summary>Respuesta</summary><p>\(\omega_2-\omega_1=\pi/30=0.105\) rad/s (\(\Delta f=0.0167\) Hz).</p></details></li>
<li><span class="lvl">Intermedio</span>Para dos masas iguales con \(k\) y \(\kappa\), si en \(t=0\) \(x_1=0\), \(x_2=0\), \(\dot x_1=v_0\), \(\dot x_2=0\), escriba \(x_1(t)\) y \(x_2(t)\).
<details><summary>Respuesta</summary><p>\(x_{1,2}=\dfrac{v_0}2\left[\dfrac{\sen\omega_1t}{\omega_1}\pm\dfrac{\sen\omega_2t}{\omega_2}\right]\).</p></details></li>
<li><span class="lvl">Intermedio</span>Una máquina de 200 kg vibra excesivamente a 1500 rpm. Diseñe un absorbedor de 10 kg: ¿qué constante de resorte necesita?
<details><summary>Respuesta</summary><p>\(\omega=157\) rad/s; \(k_a=m_a\omega^2=2.47\times10^5\) N/m.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre las frecuencias del CO<sub>2</sub> planteando \(\mathsf K\) y \(\mathsf M\) para tres masas \(m,M,m\) y dos resortes \(k\).
<details><summary>Respuesta</summary><p>\(\det\begin{pmatrix}k-m\omega^2&-k&0\\-k&2k-M\omega^2&-k\\0&-k&k-m\omega^2\end{pmatrix}=0\) da \(\omega^2(k-m\omega^2)\left[k(2m+M)-mM\omega^2\right]=0\).</p></details></li>
</ol>
</section>
</template>

<!-- 10-cadena.html -->
<template class="chapter-src" data-id="cadena" data-num="10" data-title="La cadena de osciladores: del discreto al continuo" data-part="Parte III · Sistemas con varios grados de libertad" data-short="Cuentas en un hilo tenso, modos sinusoidales, relación de dispersión, frecuencia de corte, límite continuo y cadena diatómica">
<p class="lead">Al encadenar muchos osciladores idénticos, los modos normales adquieren forma de seno y las frecuencias obedecen una ley sencilla, la relación de dispersión. En el límite de muchas masas muy próximas, la cadena se convierte en una cuerda continua y su ecuación de movimiento, en la ecuación de onda. Es el camino más directo de las vibraciones a las ondas, y también el modelo de las vibraciones de los cristales.</p>

<section>
<h2>Cuentas en un hilo tenso</h2>
<p>Un hilo sin masa, con tensión \(T\), sostiene \(N\) cuentas de masa \(m\) separadas una distancia \(a\); los extremos están fijos. Para desplazamientos transversales pequeños \(y_n\), la fuerza neta sobre la cuenta \(n\) es la diferencia de las componentes transversales de la tensión a cada lado:</p>
<div class="eq key" data-name="Ecuación de la cadena">\[m\ddot y_n=\frac Ta\left(y_{n+1}-2y_n+y_{n-1}\right),\qquad n=1,\dots,N,\qquad y_0=y_{N+1}=0 .\]</div>
<p>(La misma ecuación describe masas unidas por resortes en movimiento longitudinal, con \(T/a\to\kappa\).) Por la simetría de traslación, los modos tienen forma sinusoidal. Probando \(y_n=A\sen(nka)\cos\omega t\):</p>
<div class="eq">\[-m\omega^2\sen(nka)=\frac Ta\left[\sen((n+1)ka)-2\sen(nka)+\sen((n-1)ka)\right]=\frac Ta\,\sen(nka)\left[2\cos ka-2\right].\]</div>
<p>Las condiciones de borde (\(y_{N+1}=0\)) cuantizan el número de onda: \(k_p=\dfrac{p\pi}{(N+1)a}\), \(p=1,\dots,N\). Hay exactamente \(N\) modos, tantos como grados de libertad:</p>
<div class="eq key" data-name="Modos de la cadena">\[y_n^{(p)}=A_p\sen\!\left(\frac{np\pi}{N+1}\right)\cos(\omega_pt+\varphi_p),\qquad \omega_p=2\omega_0\sen\!\left(\frac{p\pi}{2(N+1)}\right),\qquad\omega_0=\sqrt{\frac{T}{ma}} .\]</div>
<div class="sim" data-sim="bead-modes" data-title="Modos normales de N cuentas en un hilo"></div>
<div class="sim-guide"><ul>
<li>Las cuentas del modo \(p\) siguen siempre una sinusoide de longitud de onda \(2(N+1)a/p\), aunque la cadena sea discreta.</li>
<li>En el modo más alto (\(p=N\)) las cuentas vecinas se mueven casi en oposición: la longitud de onda más corta posible es \(\approx2a\).</li>
<li>Con «pulsar», la cadena empieza con forma de triángulo: el movimiento es una suma de todos los modos, y nunca se repite exactamente porque las frecuencias no son múltiplos enteros.</li>
</ul></div>
</section>

<section>
<h2>La relación de dispersión</h2>
<p>La relación entre la frecuencia y el número de onda de los modos sinusoidales,</p>
<div class="eq key" data-name="Relación de dispersión de la cadena">\[\omega(k)=2\omega_0\left|\sen\frac{ka}{2}\right|,\]</div>
<p>no depende de \(N\) ni de las condiciones de borde: es una propiedad del medio. Tres consecuencias:</p>
<ul>
<li><strong>Límite de onda larga:</strong> si \(ka\ll1\), \(\omega\approx\omega_0ak=\sqrt{T/\mu}\,k\), con \(\mu=m/a\) la densidad lineal. La frecuencia es proporcional al número de onda: todas las ondas largas viajan con la misma velocidad \(v=\sqrt{T/\mu}\).</li>
<li><strong>Frecuencia de corte:</strong> ninguna onda sinusoidal tiene frecuencia mayor que \(\omega_c=2\omega_0\). Si se excita la cadena por encima de \(\omega_c\), la perturbación no se propaga: decae exponencialmente (onda <em>evanescente</em>) y las cuentas vecinas se mueven en oposición.</li>
<li><strong>Periodicidad en \(k\):</strong> \(k\) y \(k+2\pi/a\) dan exactamente los mismos desplazamientos de las cuentas. Basta considerar \(-\pi/a\lt k\le\pi/a\) (la <em>primera zona de Brillouin</em> de la física del estado sólido). Es el mismo fenómeno que el <em>aliasing</em> al muestrear una señal.</li>
</ul>
<div class="sim" data-sim="chain-dispersion" data-title="Relación de dispersión y aliasing en la cadena"></div>
<div class="sim-guide"><ul>
<li>Lleve \(k\) más allá de \(\pi/a\): la onda continua que pasa por las cuentas cambia, pero las cuentas hacen exactamente lo mismo que con \(k-2\pi/a\).</li>
<li>Compare las velocidades de fase \(\omega/k\) y de grupo \(\dd\omega/\dd k\): coinciden para \(k\to0\) y la de grupo se anula en el borde de la zona (capítulo 16).</li>
</ul></div>
</section>

<section>
<h2>Ondas viajeras y frecuencia de corte</h2>
<p>Si se mueve el primer extremo de una cadena muy larga con \(y_0=A\cos\omega t\), se genera una onda que viaja \(y_n=A\cos(\omega t-nka)\) con \(k\) dado por la relación de dispersión. Para \(\omega\gt\omega_c\) no existe \(k\) real; con \(ka=\pi+\ii\kappa a\) se obtiene</p>
<div class="eq">\[y_n=A(-1)^n\ee^{-n\kappa a}\cos\omega t,\qquad \cosh(\kappa a)=\frac{\omega^2}{2\omega_0^2}-1 .\]</div>
<p>La cadena actúa como un filtro pasa bajos mecánico. Los cristales hacen lo mismo con las vibraciones atómicas: no pueden transmitir sonido de frecuencia mayor que unos \(10^{13}\) Hz.</p>
<div class="sim" data-sim="chain-driven" data-title="Cadena excitada en un extremo: propagación y corte"></div>
</section>

<section>
<h2>El límite continuo: la ecuación de onda</h2>
<p>Si las cuentas son muchas y muy próximas, \(y_n(t)\to y(x,t)\) con \(x=na\), y la diferencia segunda se aproxima por la derivada segunda:</p>
<div class="eq">\[y_{n+1}-2y_n+y_{n-1}\approx a^2\pddv{y}{x}.\]</div>
<p>Con \(m=\mu a\), la ecuación de la cadena se convierte en</p>
<div class="eq key" data-name="Ecuación de onda de la cuerda">\[\pddv{y}{t}=v^2\pddv{y}{x},\qquad v=\sqrt{\frac{T}{\mu}} .\]</div>
<p>Es la ecuación de onda que estudiaremos en la Parte IV. La cuerda continua tiene infinitos modos con \(\omega_p=v\,p\pi/L\), exactamente proporcionales a \(p\): los armónicos de una cuerda ideal son múltiplos enteros de la fundamental. En la cadena discreta los modos altos quedan por debajo de esa recta; la diferencia es una forma de <em>dispersión</em>.</p>
<div class="sim" data-sim="discrete-continuum" data-title="Frecuencias de la cadena frente a las de la cuerda continua"></div>
</section>

<section>
<h2>La cadena diatómica</h2>
<p>Si las masas alternan entre \(m_1\) y \(m_2\) (como los iones Na⁺ y Cl⁻ de la sal), unidas por resortes \(\kappa\), la celda que se repite tiene dos masas y la relación de dispersión tiene dos ramas:</p>
<div class="eq key" data-name="Cadena diatómica">\[\omega_\pm^2=\kappa\left(\frac1{m_1}+\frac1{m_2}\right)\pm\kappa\sqrt{\left(\frac1{m_1}+\frac1{m_2}\right)^2-\frac{4\sen^2(ka/2)}{m_1m_2}},\]</div>
<p>donde \(a\) es la longitud de la celda. La rama <span class="term">acústica</span> (\(\omega_-\)) empieza en cero: en ondas largas las dos masas de cada celda se mueven juntas, como en el sonido. La rama <span class="term">óptica</span> (\(\omega_+\)) empieza en \(\sqrt{2\kappa(1/m_1+1/m_2)}\): las dos masas se mueven en oposición. Si son iones de carga opuesta, este movimiento crea un dipolo oscilante que interactúa con la luz infrarroja. Entre ambas ramas hay una <span class="term">banda prohibida</span>: frecuencias que no se pueden propagar por el cristal.</p>
<div class="sim" data-sim="diatomic" data-title="Ramas acústica y óptica de la cadena diatómica"></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Tres cuentas de 10 g en un hilo de 0.40 m (separaciones de 0.10 m) con tensión de 20 N. Halle las tres frecuencias normales.
<details><summary>Respuesta</summary><p>\(\omega_0=\sqrt{20/(0.01\cdot0.1)}=141\) rad/s; \(\omega_p=2\omega_0\sen(p\pi/8)\): 108, 200 y 261 rad/s.</p></details></li>
<li><span class="lvl">Básico</span>Escriba las formas de los tres modos del problema anterior.
<details><summary>Respuesta</summary><p>\(p=1\): \((1,\sqrt2,1)/\sqrt2\); \(p=2\): \((1,0,-1)\); \(p=3\): \((1,-\sqrt2,1)/\sqrt2\).</p></details></li>
<li><span class="lvl">Intermedio</span>En un cristal unidimensional con átomos de \(4.5\times10^{-26}\) kg separados 0.3 nm y constante de enlace 15 N/m, halle la velocidad del sonido y la frecuencia de corte.
<details><summary>Respuesta</summary><p>\(\omega_0=\sqrt{\kappa/m}=1.83\times10^{13}\) rad/s; \(v=\omega_0a=5.5\) km/s; \(f_c=2\omega_0/2\pi=5.8\) THz.</p></details></li>
<li><span class="lvl">Intermedio</span>Si una cadena se excita a \(\omega=2.5\,\omega_0\), ¿en cuántas cuentas la amplitud cae a la décima parte?
<details><summary>Respuesta</summary><p>\(\cosh\kappa a=3.125-1=2.125\Rightarrow\kappa a=1.39\); \(n=\ln10/1.39=1.7\): menos de dos cuentas.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que en la cadena diatómica con \(m_1=m_2\) la banda prohibida desaparece y las dos ramas se unen para dar la relación de la cadena monoatómica (con celda de longitud \(a/2\)).
<details><summary>Respuesta</summary><p>Con \(m_1=m_2=m\): \(\omega_\pm^2=\tfrac{2\kappa}{m}\left(1\pm\cos\tfrac{ka}2\right)\), es decir \(\omega_-=2\sqrt{\kappa/m}\,|\sen(ka/4)|\) y \(\omega_+=2\sqrt{\kappa/m}\,|\cos(ka/4)|\): la rama óptica es la acústica «plegada».</p></details></li>
</ol>
</section>
</template>

<!-- 11-ecuacion-onda.html -->
<template class="chapter-src" data-id="ecuacion-onda" data-num="11" data-title="La ecuación de onda" data-part="Parte IV · Ondas mecánicas" data-short="Pulsos viajeros, la cuerda tensa, velocidad de propagación, solución de d'Alembert y superposición">
<p class="lead">Una onda es una perturbación que viaja transportando energía y momento, pero no materia: cada porción del medio oscila alrededor de su posición y vuelve a ella. En este capítulo deducimos la ecuación que gobierna las ondas en una cuerda, encontramos su solución general y vemos por qué las ondas pueden atravesarse unas a otras sin alterarse.</p>

<section>
<h2>Ondas viajeras</h2>
<p>Una perturbación \(y=f(x)\) que se desplaza sin deformarse con velocidad \(v\) hacia \(+x\) tiene, en el instante \(t\), la misma forma desplazada \(vt\):</p>
<div class="eq key" data-name="Onda viajera">\[y(x,t)=f(x-vt)\quad(\text{hacia }+x),\qquad y(x,t)=g(x+vt)\quad(\text{hacia }-x).\]</div>
<p>La combinación \(x-vt\) es la «fase»: un punto de fase constante se mueve con \(\dd x/\dd t=v\). Hay dos maneras de mirar la misma onda: una <em>fotografía</em> (\(y\) en función de \(x\) a \(t\) fijo) y un <em>registro</em> (\(y\) en función de \(t\) en un punto fijo, como lo vería un sismógrafo). Para un pulso que viaja hacia \(+x\), el registro es la fotografía invertida de izquierda a derecha: lo que llega primero es el frente.</p>
<p>Según la dirección del movimiento del medio respecto a la de propagación, las ondas son <span class="term">transversales</span> (cuerda, ondas S de los sismos, luz) o <span class="term">longitudinales</span> (sonido, ondas P, resortes comprimidos). Las ondas en la superficie del agua combinan ambos movimientos.</p>
<div class="sim" data-sim="traveling-pulse" data-title="Pulso viajero: fotografía y registro en un punto"></div>
<div class="sim-guide"><ul>
<li>Use un pulso asimétrico (diente de sierra): en el registro del punto fijo aparece con la forma invertida.</li>
<li>Observe la velocidad del <em>medio</em> (flechas): no es la velocidad de la onda, y cambia de signo dentro del pulso. En una onda viajera hacia \(+x\), \(\partial y/\partial t=-v\,\partial y/\partial x\).</li>
</ul></div>
</section>

<section>
<h2>La cuerda tensa</h2>
<p>Consideremos un elemento de cuerda entre \(x\) y \(x+\dd x\), con densidad lineal \(\mu\) y tensión \(T\), y supongamos que las pendientes son pequeñas (\(|\partial y/\partial x|\ll1\)), de modo que la tensión es prácticamente la misma en todo punto y los ángulos cumplen \(\sen\theta\approx\tg\theta=\partial y/\partial x\). La fuerza vertical neta es la diferencia de las componentes de la tensión en los dos extremos:</p>
<div class="eq">\[F_y=T\left.\pdv yx\right|_{x+\dd x}-T\left.\pdv yx\right|_{x}=T\pddv yx\,\dd x .\]</div>
<p>Aplicando la segunda ley de Newton a la masa \(\mu\,\dd x\):</p>
<div class="eq key" data-name="Ecuación de onda">\[\pddv yt=v^2\pddv yx,\qquad v=\sqrt{\frac T\mu}.\]</div>
<p>La aceleración de cada punto es proporcional a la <em>curvatura</em> de la cuerda en ese punto: donde la cuerda es cóncava hacia arriba, acelera hacia arriba. La velocidad crece con la tensión (más fuerza restauradora) y disminuye con la densidad (más inercia), exactamente como \(\omega_0=\sqrt{k/m}\) en un oscilador. Es el mismo resultado que obtuvimos en el capítulo 10 como límite continuo de la cadena de cuentas.</p>
<div class="sim" data-sim="string-forces" data-title="La aceleración de cada punto es proporcional a la curvatura"></div>
<div class="sim-guide"><ul>
<li>Congele la animación: las flechas de aceleración son máximas donde la cuerda se curva más, no donde está más desplazada.</li>
<li>En un tramo recto (aunque esté inclinado) la aceleración es nula: las tensiones de los dos lados se compensan.</li>
</ul></div>
<h3>Velocidades típicas</h3>
<p>Una cuerda de acero de guitarra (mi agudo, diámetro 0.25 mm, \(\mu=0.39\) g/m) afinada a 330 Hz con 65 cm de longitud vibrante tiene \(v=2Lf=429\) m/s y soporta una tensión \(T=\mu v^2\approx72\) N, el peso de unos 7 kg.</p>
<div class="sim" data-sim="string-speed" data-title="Velocidad de onda en cuerdas reales"></div>
</section>

<section>
<h2>La solución de d'Alembert</h2>
<p>Cualquier función de la forma \(f(x-vt)\) o \(g(x+vt)\) satisface la ecuación de onda (basta derivar con la regla de la cadena). En 1747 Jean le Rond d'Alembert demostró que la solución más general es su suma:</p>
<div class="eq key" data-name="Solución general de d'Alembert">\[y(x,t)=f(x-vt)+g(x+vt).\]</div>
<p>Se demuestra con las variables \(\xi=x-vt\), \(\eta=x+vt\), en las que la ecuación se convierte en \(\partial^2y/\partial\xi\partial\eta=0\). Las funciones \(f\) y \(g\) se determinan a partir de la posición inicial \(y_0(x)\) y la velocidad inicial \(u_0(x)\) de la cuerda:</p>
<div class="eq key" data-name="Problema de valores iniciales">\[y(x,t)=\frac{y_0(x-vt)+y_0(x+vt)}{2}+\frac1{2v}\int_{x-vt}^{x+vt}u_0(s)\,\dd s .\]</div>
<p>Una cuerda que se suelta desde el reposo con una deformación se divide en dos pulsos idénticos de la mitad de altura, que viajan en sentidos opuestos. Si en cambio se golpea (velocidad inicial sin deformación, como en un piano), los dos pulsos tienen forma de meseta.</p>
<div class="sim" data-sim="dalembert" data-title="D'Alembert: una deformación inicial se divide en dos pulsos"></div>
<div class="sim-guide"><ul>
<li>Con «Deformación», las dos mitades viajan sin deformarse y se separan.</li>
<li>Con «Golpe» (velocidad inicial, como un martillo de piano), la cuerda se eleva gradualmente: cada punto recibe la integral de la velocidad inicial dentro de su «cono» \([x-vt,\,x+vt]\).</li>
</ul></div>
</section>

<section>
<h2>Superposición</h2>
<p>La ecuación de onda es lineal: la suma de dos soluciones es solución. Dos pulsos que se encuentran se suman punto a punto mientras se superponen, y después continúan como si nada hubiera ocurrido. Si son de signo opuesto e igual forma, en el instante del cruce la cuerda queda completamente recta... pero no en reposo: toda la energía es cinética en ese instante, y los pulsos reaparecen.</p>
<div class="sim" data-sim="pulse-collision" data-title="Choque de dos pulsos: se atraviesan sin alterarse"></div>
<div class="box warn">
<h4>Los límites de la linealidad</h4>
<p>La superposición falla cuando las pendientes dejan de ser pequeñas: la tensión cambia al estirarse la cuerda, y aparecen términos no lineales. Las olas que rompen en la playa, las ondas de choque y los solitones son fenómenos no lineales.</p>
</div>
</section>

<section>
<h2>Otras ondas con la misma ecuación</h2>
<p>La ecuación de onda aparece cada vez que una magnitud tiene «inercia» y una «fuerza restauradora» proporcional a su curvatura. La velocidad siempre es \(\sqrt{\text{rigidez}/\text{inercia}}\):</p>
<div class="tablewrap"><table>
<tr><th>Onda</th><th class="c">Magnitud que oscila</th><th class="c">Velocidad</th><th class="c">Valor típico</th></tr>
<tr><td>Cuerda tensa</td><td class="c">desplazamiento transversal</td><td class="c">\(\sqrt{T/\mu}\)</td><td class="c">100 – 1500 m/s</td></tr>
<tr><td>Longitudinal en una barra</td><td class="c">desplazamiento axial</td><td class="c">\(\sqrt{Y/\rho}\)</td><td class="c">acero: 5100 m/s</td></tr>
<tr><td>Torsional en una barra</td><td class="c">ángulo de giro</td><td class="c">\(\sqrt{G/\rho}\)</td><td class="c">acero: 3200 m/s</td></tr>
<tr><td>Sonido en un fluido</td><td class="c">presión</td><td class="c">\(\sqrt{B/\rho}\)</td><td class="c">aire: 343 m/s; agua: 1480 m/s</td></tr>
<tr><td>Línea de transmisión</td><td class="c">tensión eléctrica</td><td class="c">\(1/\sqrt{L'C'}\)</td><td class="c">coaxial: \(\approx0.66c\)</td></tr>
<tr><td>Luz en el vacío</td><td class="c">campos \(\vb E\), \(\vb B\)</td><td class="c">\(1/\sqrt{\mu_0\varepsilon_0}\)</td><td class="c">\(3.00\times10^8\) m/s</td></tr>
</table></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una cuerda de 2.0 m y 30 g está sometida a 120 N. ¿Cuánto tarda un pulso en recorrerla?
<details><summary>Respuesta</summary><p>\(\mu=0.015\) kg/m; \(v=89.4\) m/s; \(t=22\) ms.</p></details></li>
<li><span class="lvl">Básico</span>Verifique que \(y=\dfrac{A}{1+(x-3t)^2}\) es una onda viajera. ¿Con qué velocidad y en qué sentido se mueve?
<details><summary>Respuesta</summary><p>Es función de \(x-3t\): viaja a 3 m/s hacia \(+x\).</p></details></li>
<li><span class="lvl">Intermedio</span>Una cuerda de piano de acero (\(\rho=7800\) kg/m³, diámetro 1.0 mm) soporta 800 N. Halle la velocidad de las ondas transversales y compárela con la de las longitudinales (\(Y=200\) GPa).
<details><summary>Respuesta</summary><p>\(\mu=6.13\) g/m; \(v_T=361\) m/s; \(v_L=\sqrt{Y/\rho}=5060\) m/s, unas 14 veces mayor.</p></details></li>
<li><span class="lvl">Intermedio</span>Una cuerda en reposo recibe en \(t=0\) un golpe que da velocidad \(u_0\) a un tramo de longitud \(b\). Describa la forma de la cuerda para \(t\gt b/(2v)\).
<details><summary>Respuesta</summary><p>Un trapecio: meseta de altura \(u_0b/(2v)\) cuyo ancho crece como \(2vt-b\), con rampas de ancho \(b\) a cada lado.</p></details></li>
<li><span class="lvl">Avanzado</span>Una cuerda que cuelga verticalmente bajo su propio peso tiene tensión variable \(T=\mu gz\) (con \(z\) medido desde el extremo libre). Halle el tiempo que tarda un pulso en subir una cuerda de longitud \(L\).
<details><summary>Respuesta</summary><p>\(v=\sqrt{gz}\); \(t=\int_0^L\dd z/\sqrt{gz}=2\sqrt{L/g}\).</p></details></li>
</ol>
</section>
</template>

<!-- 12-armonicas.html -->
<template class="chapter-src" data-id="armonicas" data-num="12" data-title="Ondas armónicas, energía e impedancia" data-part="Parte IV · Ondas mecánicas" data-short="Longitud de onda y número de onda, movimiento del medio, energía, potencia transmitida, impedancia y ondas longitudinales">
<p class="lead">Si el extremo de una cuerda se mueve con un MAS, la onda que se genera es armónica: una sinusoide que avanza. Las ondas armónicas son las más importantes porque, gracias al análisis de Fourier, cualquier onda es una suma de ellas. En este capítulo establecemos su vocabulario y calculamos cuánta energía transportan.</p>

<section>
<h2>La onda armónica</h2>
<p>Una onda sinusoidal que viaja hacia \(+x\) se escribe</p>
<div class="eq key" data-name="Onda armónica">\[y(x,t)=A\cos(kx-\omega t+\varphi)=\Rea\!\left[\tl A\,\ee^{\ii(kx-\omega t)}\right],\qquad \tl A=A\ee^{\ii\varphi}.\]</div>
<p>Es doblemente periódica: en el espacio, con la <span class="term">longitud de onda</span> \(\lambda\); en el tiempo, con el período \(T\). Sus parámetros se relacionan así:</p>
<div class="eq key" data-name="Relaciones de la onda armónica">\[k=\frac{2\pi}{\lambda},\qquad \omega=\frac{2\pi}{T}=2\pi f,\qquad v=\frac\omega k=\lambda f .\]</div>
<p>El <span class="term">número de onda</span> \(k\) (en rad/m) es al espacio lo que \(\omega\) es al tiempo. La velocidad \(v=\omega/k\), con la que avanzan las crestas, se llama <span class="term">velocidad de fase</span>. En una cuerda, \(v\) está fijada por el medio (\(\sqrt{T/\mu}\)) y \(f\) por la fuente; la longitud de onda se acomoda: \(\lambda=v/f\).</p>
<div class="box warn">
<h4>Dos velocidades distintas</h4>
<p>La velocidad de la onda \(v\) es constante; la velocidad de cada punto del medio, \(\partial y/\partial t=\omega A\sen(kx-\omega t+\varphi)\), oscila entre \(\pm\omega A\). Una cuerda de guitarra con \(v=400\) m/s, \(f=330\) Hz y \(A=1\) mm tiene puntos que se mueven a 2 m/s como máximo.</p>
</div>
<div class="sim" data-sim="harmonic-wave" data-title="Onda armónica: parámetros, fotografía y movimiento de un punto"></div>
<div class="sim-guide"><ul>
<li>Siga el punto marcado: sube y baja con MAS de período \(T\), sin avanzar. Lo que avanza es la forma.</li>
<li>Duplique la frecuencia con \(v\) fija: la longitud de onda se reduce a la mitad.</li>
<li>Compare las flechas de velocidad con la pendiente: \(\partial y/\partial t=-v\,\partial y/\partial x\). En las crestas el medio está quieto; donde la cuerda cruza el eje se mueve más rápido.</li>
</ul></div>
</section>

<section>
<h2>Energía en una onda</h2>
<p>Un elemento \(\dd x\) de cuerda tiene energía cinética \(\tfrac12\mu\,\dd x\,(\partial y/\partial t)^2\) y energía potencial elástica igual al trabajo hecho para estirarlo: su longitud es \(\sqrt{\dd x^2+\dd y^2}\approx\dd x\left[1+\tfrac12(\partial y/\partial x)^2\right]\), así que la tensión hace un trabajo \(\tfrac12T(\partial y/\partial x)^2\dd x\). Las densidades lineales de energía son</p>
<div class="eq key" data-name="Densidad de energía en la cuerda">\[u_K=\frac12\mu\left(\pdv yt\right)^2,\qquad u_U=\frac12T\left(\pdv yx\right)^2 .\]</div>
<p>Para una onda viajera, \(\partial y/\partial t=\mp v\,\partial y/\partial x\) y \(T=\mu v^2\), de modo que \(u_K=u_U\) en todo punto y todo instante: a diferencia del oscilador, donde las energías se alternan, en una onda viajera las dos son máximas juntas (donde la cuerda cruza el eje) y nulas juntas (en las crestas). Para la onda armónica,</p>
<div class="eq">\[u=u_K+u_U=\mu\omega^2A^2\sen^2(kx-\omega t),\qquad \langle u\rangle=\tfrac12\mu\omega^2A^2 .\]</div>
<div class="sim" data-sim="wave-energy" data-title="Densidad de energía en una onda viajera y en un oscilador"></div>
<div class="sim-guide"><ul>
<li>En la onda viajera, la energía avanza en «paquetes» con la velocidad de la onda; las crestas no llevan energía.</li>
<li>Compare con la onda estacionaria (capítulo 14): allí la energía sí se alterna entre cinética y potencial, como en un oscilador, y no avanza.</li>
</ul></div>
</section>

<section>
<h2>Potencia e impedancia</h2>
<p>La parte izquierda de la cuerda hace sobre la derecha una fuerza transversal \(F_y=-T\,\partial y/\partial x\). La potencia que atraviesa un punto es</p>
<div class="eq">\[P=F_y\,\pdv yt=-T\pdv yx\pdv yt .\]</div>
<p>Para una onda que viaja hacia \(+x\), \(\partial y/\partial x=-\tfrac1v\partial y/\partial t\), y queda</p>
<div class="eq key" data-name="Potencia e impedancia de la cuerda">\[P=Z\left(\pdv yt\right)^2,\qquad Z=\frac Tv=\sqrt{T\mu}=\mu v,\qquad \langle P\rangle=\frac12Z\omega^2A^2=\langle u\rangle\,v .\]</div>
<p>\(Z\) es la <span class="term">impedancia característica</span> de la cuerda, en kg/s. Su significado es directo: para mover el extremo de una cuerda semiinfinita con velocidad \(\dot y\) hay que hacer una fuerza \(F=Z\dot y\). Una cuerda infinita se comporta, para quien la sacude, exactamente como un amortiguador viscoso de constante \(b=Z\): absorbe toda la energía que se le entrega y se la lleva. Esta idea conecta el capítulo 4 con la reflexión de ondas (capítulo 13).</p>
<div class="sim" data-sim="wave-power" data-title="Potencia transmitida por una cuerda"></div>
<div class="box ex">
<h4>Potencia de una onda en una cuerda</h4>
<p>Una cuerda con \(\mu=5\) g/m y \(T=80\) N se sacude con amplitud de 1 cm a 60 Hz. Halle la velocidad, la impedancia, la longitud de onda y la potencia media transmitida.</p>
<details><summary>Solución</summary>
<p>\(v=\sqrt{80/0.005}=126.5\) m/s; \(Z=\sqrt{80\cdot0.005}=0.632\) kg/s; \(\lambda=2.11\) m; \(\langle P\rangle=\tfrac12(0.632)(377)^2(0.01)^2=4.49\) W.</p>
</details>
</div>
</section>

<section>
<h2>Ondas longitudinales</h2>
<p>En un resorte largo, en una barra o en una columna de aire, las partículas se mueven en la dirección de propagación. Si \(\xi(x,t)\) es el desplazamiento longitudinal del material que en reposo estaba en \(x\), un razonamiento como el de la cuerda (con la ley de Hooke para el estiramiento \(\partial\xi/\partial x\)) lleva a la misma ecuación de onda. En una barra de módulo de Young \(Y\) y densidad \(\rho\):</p>
<div class="eq key" data-name="Ondas longitudinales en una barra">\[\pddv\xi t=\frac Y\rho\pddv\xi x,\qquad v=\sqrt{\frac Y\rho}.\]</div>
<p>Una onda longitudinal armónica produce regiones de <span class="term">compresión</span> (las partículas se acercan, \(\partial\xi/\partial x\lt0\)) y de <span class="term">rarefacción</span>. Ojo: los máximos de desplazamiento no coinciden con los de compresión; están desfasados un cuarto de longitud de onda. Este hecho será esencial para entender el sonido: los nodos de desplazamiento son vientres de presión.</p>
<div class="sim" data-sim="longitudinal-wave" data-title="Onda longitudinal: desplazamiento y compresión"></div>
<div class="sim-guide"><ul>
<li>Siga una partícula marcada: oscila de izquierda a derecha alrededor de su posición de equilibrio.</li>
<li>Compare la gráfica de desplazamiento con la de densidad: la compresión máxima ocurre donde el desplazamiento cruza por cero con pendiente negativa.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una onda se describe por \(y=0.02\cos(4.0x-300t)\) (SI). Halle la amplitud, \(\lambda\), \(f\), \(v\) y la velocidad máxima del medio.
<details><summary>Respuesta</summary><p>\(A=2\) cm; \(\lambda=1.57\) m; \(f=47.7\) Hz; \(v=75\) m/s; \(\dot y_{\max}=6\) m/s.</p></details></li>
<li><span class="lvl">Básico</span>Escriba la ecuación de una onda de 5 mm de amplitud, 0.40 m de longitud de onda y 250 Hz, que viaja hacia \(-x\) y tiene \(y=0\) con \(\dot y\gt0\) en \(x=0\), \(t=0\).
<details><summary>Respuesta</summary><p>\(y=0.005\sen(15.7x+1571t)\) m.</p></details></li>
<li><span class="lvl">Intermedio</span>Si se duplica la frecuencia y se reduce la amplitud a la mitad, ¿qué pasa con la potencia transmitida?
<details><summary>Respuesta</summary><p>\(P\propto\omega^2A^2\): no cambia.</p></details></li>
<li><span class="lvl">Intermedio</span>Una cuerda transmite 2.0 W con una onda de 4 mm a 100 Hz. ¿Qué amplitud se necesita para transmitir 8.0 W a 50 Hz?
<details><summary>Respuesta</summary><p>\(A_2=A_1\sqrt{P_2/P_1}\,(\omega_1/\omega_2)=4\cdot2\cdot2=16\) mm.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que la densidad de energía \(u\) y el flujo \(P\) cumplen la ley de conservación \(\partial u/\partial t+\partial P/\partial x=0\) para cualquier solución de la ecuación de onda.
<details><summary>Respuesta</summary><p>\(\partial_tu=\mu y_ty_{tt}+Ty_xy_{xt}\) y \(\partial_xP=-T(y_{xx}y_t+y_xy_{tx})\). Sumando y usando \(\mu y_{tt}=Ty_{xx}\) se anulan.</p></details></li>
</ol>
</section>
</template>

<!-- 13-reflexion.html -->
<template class="chapter-src" data-id="reflexion" data-num="13" data-title="Reflexión y transmisión" data-part="Parte IV · Ondas mecánicas" data-short="Extremos fijo y libre, unión de dos medios, coeficientes de reflexión y transmisión, terminaciones e impedancia y capas de acople">
<p class="lead">Cuando una onda llega a un cambio del medio, parte de ella sigue adelante y parte regresa. Cuánto se refleja depende de una sola propiedad: la diferencia de impedancias. Este principio explica por qué se usa gel en una ecografía, por qué las gafas tienen recubrimientos antirreflejo y por qué los cables de antena llevan conectores de 50 Ω.</p>

<section>
<h2>Extremos fijo y libre</h2>
<p>En un <strong>extremo fijo</strong> la cuerda no puede moverse: \(y(0,t)=0\). La onda reflejada debe cancelar a la incidente en ese punto en todo instante, de modo que el pulso regresa <em>invertido</em>. Matemáticamente, es como si desde el otro lado llegara un pulso «imagen» de signo opuesto.</p>
<p>En un <strong>extremo libre</strong> (un anillo sin masa que desliza sin fricción por una varilla), la cuerda no puede ejercer fuerza transversal: \(\partial y/\partial x=0\). La imagen tiene el mismo signo, y el pulso regresa <em>sin invertirse</em>; durante la reflexión el extremo alcanza el doble de la altura del pulso.</p>
<div class="sim" data-sim="pulse-reflection" data-title="Reflexión en un extremo fijo, libre o absorbente"></div>
<div class="sim-guide"><ul>
<li>Active «mostrar la imagen»: la reflexión es exactamente la continuación de un pulso imagen que viene del otro lado del extremo.</li>
<li>En el extremo libre, observe el instante en que el anillo sube al doble de la altura del pulso.</li>
</ul></div>
</section>

<section>
<h2>La unión de dos cuerdas</h2>
<p>Dos cuerdas de impedancias \(Z_1=\sqrt{T\mu_1}\) y \(Z_2=\sqrt{T\mu_2}\) están unidas en \(x=0\). Una onda incidente \(y_i=A_i\cos(\omega t-k_1x)\) produce una reflejada \(A_r\cos(\omega t+k_1x)\) y una transmitida \(A_t\cos(\omega t-k_2x)\). En la unión deben cumplirse dos condiciones:</p>
<ul>
<li>La cuerda no se rompe: \(y\) es continua, \(A_i+A_r=A_t\).</li>
<li>La unión no tiene masa, así que la fuerza neta sobre ella es nula: \(T\,\partial y/\partial x\) es continua, \(k_1(A_i-A_r)=k_2A_t\).</li>
</ul>
<p>Como \(Tk=Z\omega\), la segunda condición es \(Z_1(A_i-A_r)=Z_2A_t\). Resolviendo:</p>
<div class="eq key" data-name="Coeficientes de reflexión y transmisión">\[r=\frac{A_r}{A_i}=\frac{Z_1-Z_2}{Z_1+Z_2},\qquad \tau=\frac{A_t}{A_i}=\frac{2Z_1}{Z_1+Z_2}.\]</div>
<p>Si la segunda cuerda es más pesada (\(Z_2\gt Z_1\)), \(r\lt0\): la reflexión se invierte, como en un extremo fijo (que es el límite \(Z_2\to\infty\)). Si es más liviana, \(r\gt0\), como en un extremo libre (\(Z_2\to0\)). La onda transmitida nunca se invierte.</p>
<p>La energía se conserva. Con \(P=\tfrac12Z\omega^2A^2\), los coeficientes de potencia son</p>
<div class="eq key" data-name="Reflectancia y transmitancia">\[R=r^2=\left(\frac{Z_1-Z_2}{Z_1+Z_2}\right)^2,\qquad \mathcal T=\frac{Z_2}{Z_1}\tau^2=\frac{4Z_1Z_2}{(Z_1+Z_2)^2},\qquad R+\mathcal T=1 .\]</div>
<div class="sim" data-sim="string-junction" data-title="Pulso en la unión de dos cuerdas"></div>
<div class="sim-guide"><ul>
<li>Con \(\mu_2=4\mu_1\) (\(Z_2=2Z_1\)): \(r=-1/3\), \(\tau=2/3\). El pulso transmitido es más angosto, porque viaja a la mitad de velocidad.</li>
<li>Con \(\mu_2=\mu_1/4\): \(\tau=4/3\). La amplitud transmitida <em>supera</em> a la incidente, pero la energía no: \(\mathcal T=8/9\).</li>
</ul></div>
<div class="box ex">
<h4>Ecografía</h4>
<p>La impedancia acústica (\(Z=\rho v\)) del aire es 413 Pa·s/m y la del tejido blando, \(1.63\times10^6\) Pa·s/m. ¿Qué fracción de la potencia de ultrasonido pasa del aire al tejido? ¿Y del gel (\(1.5\times10^6\)) al tejido?</p>
<details><summary>Solución</summary>
<p>Aire–tejido: \(\mathcal T=4Z_1Z_2/(Z_1+Z_2)^2\approx4Z_1/Z_2=1.0\times10^{-3}\): pasa el 0.1 %. Gel–tejido: \(\mathcal T=0.998\). Sin gel, una capa de aire de micrones bastaría para reflejar casi todo el ultrasonido.</p>
</details>
</div>
</section>

<section>
<h2>Terminaciones e impedancia</h2>
<p>Si el extremo de la cuerda se une a un amortiguador de constante \(b\) (un anillo que desliza con fricción viscosa), la condición de borde es \(-T\,\partial y/\partial x=b\,\partial y/\partial t\), y la reflexión es</p>
<div class="eq">\[r=\frac{Z-b}{Z+b}.\]</div>
<p>Si \(b=Z\), no hay ninguna reflexión: el amortiguador absorbe toda la energía como si la cuerda continuara infinitamente. Se dice que la terminación está <span class="term">acoplada</span> (o adaptada) a la línea. Por eso un cable coaxial de 50 Ω debe terminar en una carga de 50 Ω: si no, parte de la señal regresa y produce ecos o, en una antena transmisora, calienta el amplificador.</p>
<div class="sim" data-sim="impedance-end" data-title="Cuerda terminada en un amortiguador: acople de impedancias"></div>
</section>

<section>
<h2>Transmisión a través de una capa: el acoplador de cuarto de onda</h2>
<p>Entre dos medios de impedancias muy distintas casi todo se refleja. Una capa intermedia puede resolverlo. Si la capa tiene espesor \(\lambda_m/4\) (medido en la capa), la onda reflejada en su cara posterior regresa con un retraso de media longitud de onda y puede cancelar a la reflejada en la cara anterior. La cancelación es completa si las dos reflexiones tienen la misma amplitud, lo que ocurre cuando</p>
<div class="eq key" data-name="Acoplador de cuarto de onda">\[Z_m=\sqrt{Z_1Z_2},\qquad d=\frac{\lambda_m}{4}=\frac{v_m}{4f}.\]</div>
<p>El acople es perfecto sólo a una frecuencia (y sus múltiplos impares); en el resto, la transmisión es intermedia. Los recubrimientos antirreflejo de las lentes (fluoruro de magnesio sobre vidrio), las capas de acople de los transductores de ultrasonido y los transformadores de cuarto de onda de las líneas de microondas aplican esta misma idea.</p>
<div class="sim" data-sim="quarter-wave" data-title="Transmisión a través de una capa intermedia"></div>
<div class="sim-guide"><ul>
<li>Con \(Z_m=\sqrt{Z_1Z_2}\), la transmisión llega al 100 % en \(d=\lambda_m/4\) y vuelve a su valor sin capa en \(d=\lambda_m/2\) (la capa se vuelve «invisible»).</li>
<li>Con una impedancia de capa distinta, el máximo no alcanza el 100 %.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una cuerda de 2 g/m se une a otra de 18 g/m con la misma tensión. Halle \(r\), \(\tau\), \(R\) y \(\mathcal T\) para una onda que viene por la cuerda liviana.
<details><summary>Respuesta</summary><p>\(Z_2=3Z_1\): \(r=-0.5\), \(\tau=0.5\), \(R=0.25\), \(\mathcal T=0.75\).</p></details></li>
<li><span class="lvl">Básico</span>Repita el problema anterior para una onda que viene por la cuerda pesada.
<details><summary>Respuesta</summary><p>\(r=+0.5\), \(\tau=1.5\), \(R=0.25\), \(\mathcal T=0.75\).</p></details></li>
<li><span class="lvl">Intermedio</span>Un cable coaxial de 75 Ω se conecta a una entrada de 50 Ω. ¿Qué fracción de la potencia se refleja?
<details><summary>Respuesta</summary><p>\(R=(25/125)^2=4\) %.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Qué índice de refracción y espesor debe tener un recubrimiento antirreflejo sobre vidrio (\(n=1.52\)) para luz de 550 nm? (Para la luz, \(Z\propto1/n\).)
<details><summary>Respuesta</summary><p>\(n_m=\sqrt{1.52}=1.23\); \(d=550/(4\cdot1.23)=112\) nm. En la práctica se usa MgF<sub>2</sub>, \(n=1.38\).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que una cuerda terminada en una masa \(m\) (sin resorte) refleja una onda armónica con \(|r|=1\) y un desfase que depende de \(m\omega/Z\).
<details><summary>Respuesta</summary><p>Con incidente \(A\ee^{\ii(kx-\omega t)}\) y reflejada \(B\ee^{\ii(-kx-\omega t)}\), la condición \(-T\partial_xy=m\partial_t^2y\) en \(x=0\) da \(r=\dfrac{B}{A}=\dfrac{\ii Z-m\omega}{\ii Z+m\omega}\), de módulo 1: la masa no disipa, sólo retrasa la reflexión. Con \(m=0\), \(r=1\) (extremo libre); con \(m\to\infty\), \(r=-1\) (extremo fijo).</p></details></li>
</ol>
</section>
</template>

<!-- 14-estacionarias.html -->
<template class="chapter-src" data-id="estacionarias" data-num="14" data-title="Ondas estacionarias y modos normales" data-part="Parte IV · Ondas mecánicas" data-short="Nodos y vientres, modos de una cuerda, armónicos, cuerda pulsada y golpeada, resonancia de Melde">
<p class="lead">Una cuerda de guitarra no tiene espacio para que una onda viaje lejos: la onda se refleja en los dos extremos, una y otra vez. La superposición de las ondas que van y vienen produce ondas estacionarias, patrones que no avanzan. Sólo ciertas frecuencias caben en la cuerda: son sus modos normales, la versión continua de los modos de la cadena del capítulo 10, y el origen de las notas musicales.</p>

<section>
<h2>Superposición de dos ondas opuestas</h2>
<p>Sumemos dos ondas armónicas de igual amplitud y frecuencia que viajan en sentidos opuestos:</p>
<div class="eq key" data-name="Onda estacionaria">\[y=A\sen(kx-\omega t)+A\sen(kx+\omega t)=2A\sen(kx)\cos(\omega t).\]</div>
<p>El resultado ya no es función de \(x\pm vt\): cada punto oscila con MAS, en fase con todos los demás (o en oposición), y con una amplitud \(2A|\sen kx|\) que depende de su posición. Los puntos donde \(\sen kx=0\), separados \(\lambda/2\), no se mueven nunca: son los <span class="term">nodos</span>. A medio camino entre ellos están los <span class="term">vientres</span> (o antinodos), de amplitud \(2A\).</p>
<p>La energía no viaja: la potencia promedio a través de cualquier punto es cero, porque las dos ondas llevan la misma potencia en sentidos opuestos. En cambio, como en un oscilador, la energía se alterna entre cinética (cuando la cuerda está recta) y potencial (cuando está en su máxima deformación).</p>
<div class="sim" data-sim="standing-from-two" data-title="Dos ondas viajeras forman una onda estacionaria"></div>
<div class="sim-guide"><ul>
<li>Con amplitudes distintas, la onda resultante es en parte estacionaria y en parte viajera: no hay nodos verdaderos, sólo mínimos. La razón entre el máximo y el mínimo de la envolvente se llama razón de onda estacionaria (ROE o SWR), y mide la reflexión en una línea de transmisión.</li>
</ul></div>
</section>

<section>
<h2>Los modos de una cuerda fija en los extremos</h2>
<p>Una cuerda de longitud \(L\) fija en \(x=0\) y \(x=L\) debe tener nodos en ambos extremos: \(\sen kL=0\), es decir, \(kL=n\pi\). Caben en la cuerda un número entero de medias longitudes de onda:</p>
<div class="eq key" data-name="Modos de la cuerda fija">\[\lambda_n=\frac{2L}{n},\qquad f_n=\frac{nv}{2L}=\frac{n}{2L}\sqrt{\frac T\mu},\qquad y_n(x,t)=A_n\sen\!\left(\frac{n\pi x}{L}\right)\cos(\omega_nt+\varphi_n).\]</div>
<p>La frecuencia más baja, \(f_1=v/2L\), es la <span class="term">fundamental</span>; las demás son sus múltiplos enteros: la serie de <span class="term">armónicos</span>. Que las frecuencias de los modos sean múltiplos exactos de la fundamental es lo que hace que una cuerda produzca un sonido con altura definida. La ecuación de \(f_1\) resume las tres maneras de afinar: acortar la cuerda (trastes), tensarla (clavijas) o hacerla más liviana (cuerdas más delgadas para las notas agudas). Es la <em>ley de Mersenne</em> (1636).</p>
<p>Si un extremo es libre (o la cuerda se reemplaza por una barra libre en un extremo), allí debe haber un vientre: \(\cos kL=0\), y sólo caben números impares de cuartos de onda, \(f_n=(2n-1)v/4L\).</p>
<div class="sim" data-sim="string-modes" data-title="Modos normales de una cuerda"></div>
<div class="sim-guide"><ul>
<li>Cuente los nodos del modo \(n\): hay \(n-1\) además de los extremos.</li>
<li>Escuche el modo 1 y el modo 2: el segundo suena una octava más agudo; el tercero, una quinta por encima de éste.</li>
<li>Cambie a «un extremo libre»: desaparecen los armónicos pares.</li>
</ul></div>
</section>

<section>
<h2>El movimiento general: superposición de modos</h2>
<p>Como la ecuación es lineal, la solución más general con extremos fijos es la suma de todos los modos:</p>
<div class="eq key" data-name="Solución general con extremos fijos">\[y(x,t)=\sum_{n=1}^{\infty}\sen\!\left(\frac{n\pi x}{L}\right)\left[a_n\cos\omega_nt+b_n\sen\omega_nt\right],\qquad \omega_n=\frac{n\pi v}{L}.\]</div>
<p>Los coeficientes se obtienen de la posición y la velocidad iniciales usando la ortogonalidad de los senos, \(\int_0^L\sen\frac{n\pi x}L\sen\frac{m\pi x}L\dd x=\frac L2\delta_{nm}\):</p>
<div class="eq">\[a_n=\frac2L\int_0^Ly_0(x)\sen\frac{n\pi x}L\,\dd x,\qquad b_n=\frac{2}{\omega_nL}\int_0^Lu_0(x)\sen\frac{n\pi x}L\,\dd x .\]</div>
<p>Es el desarrollo en serie de Fourier que estudiaremos a fondo en el capítulo 15.</p>
<h3>Cuerda pulsada</h3>
<p>Si la cuerda se suelta desde el reposo con forma de triángulo de altura \(h\) y vértice en \(x=d\):</p>
<div class="eq key" data-name="Amplitudes de la cuerda pulsada">\[a_n=\frac{2hL^2}{\pi^2n^2d(L-d)}\sen\frac{n\pi d}{L},\qquad b_n=0 .\]</div>
<p>Las amplitudes caen como \(1/n^2\), y todos los armónicos que tienen un nodo en el punto de pulsación faltan: pulsando en el centro desaparecen todos los pares. Por eso una guitarra suena más «dulce» pulsada cerca del centro (dominan los armónicos bajos) y más «metálica» cerca del puente.</p>
<h3>Cuerda golpeada</h3>
<p>En el piano, un martillo da a un tramo de la cuerda una velocidad inicial sin deformarla. Entonces \(a_n=0\) y, para un martillo angosto, \(b_n\propto\sen(n\pi d/L)/n\): las amplitudes de desplazamiento decaen sólo como \(1/n\), en lugar de \(1/n^2\), y los armónicos altos son más intensos que en la cuerda pulsada. En la práctica, el fieltro del martillo, de ancho finito y blando, recorta los armónicos más altos.</p>
<div class="sim" data-sim="plucked-string" data-title="Cuerda pulsada o golpeada: modos, espectro y sonido"></div>
<div class="sim-guide"><ul>
<li>Pulse exactamente en el centro: en el espectro desaparecen todos los armónicos pares. A un tercio de la longitud, faltan los múltiplos de 3.</li>
<li>Escuche la cuerda pulsada en el centro y cerca del extremo: la misma nota, distinto timbre.</li>
<li>Observe la forma de la cuerda pulsada durante el movimiento: es siempre un polígono de dos o tres tramos rectos (los dos pulsos de d'Alembert que van y vienen).</li>
</ul></div>
</section>

<section>
<h2>Resonancia de una cuerda forzada</h2>
<p>Si un extremo de la cuerda se hace vibrar con frecuencia \(f\) (por ejemplo, con un vibrador eléctrico, como en el experimento de Melde de 1859), en el régimen estacionario la cuerda adopta la forma</p>
<div class="eq">\[y(x,t)=a\,\frac{\sen k(L-x)}{\sen kL}\cos\omega t,\qquad k=\frac\omega v .\]</div>
<p>Cuando \(kL=n\pi\) el denominador se anula: la amplitud crece hasta que la limitan las pérdidas. Las resonancias de la cuerda ocurren exactamente en las frecuencias de sus modos. La cuerda es un sistema con infinitos grados de libertad y, por tanto, con infinitas resonancias, una por modo. El extremo forzado, que se mueve muy poco, es casi un nodo.</p>
<div class="sim" data-sim="melde" data-title="Experimento de Melde: resonancias de una cuerda forzada"></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>La cuerda la (110 Hz) de una guitarra mide 65 cm. Halle la velocidad de las ondas y las frecuencias de los tres primeros armónicos.
<details><summary>Respuesta</summary><p>\(v=2Lf_1=143\) m/s; 110, 220 y 330 Hz.</p></details></li>
<li><span class="lvl">Básico</span>¿Dónde hay que pisar la cuerda anterior para obtener la nota mi (165 Hz)?
<details><summary>Respuesta</summary><p>Longitud vibrante \(L'=L\cdot110/165=43.3\) cm: a 21.7 cm de la cejuela.</p></details></li>
<li><span class="lvl">Intermedio</span>¿En qué porcentaje hay que aumentar la tensión para subir la frecuencia un semitono (factor \(2^{1/12}\))?
<details><summary>Respuesta</summary><p>\(T\propto f^2\): factor \(2^{1/6}=1.122\), un 12.2 %.</p></details></li>
<li><span class="lvl">Intermedio</span>Una cuerda se pulsa a \(L/5\) de un extremo. ¿Qué armónicos faltan? ¿Cuál es la razón entre las amplitudes del segundo y el primer armónico?
<details><summary>Respuesta</summary><p>Faltan los múltiplos de 5. \(a_2/a_1=\dfrac{\sen(2\pi/5)}{4\sen(\pi/5)}=0.405\).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre la fórmula de \(a_n\) de la cuerda pulsada calculando la integral de Fourier del triángulo.
<details><summary>Respuesta</summary><p>Integre por partes en \([0,d]\) y \([d,L]\); los términos de borde se cancelan y queda \(\dfrac2L\cdot\dfrac{hL^2}{n^2\pi^2}\left(\dfrac1d+\dfrac1{L-d}\right)\sen\dfrac{n\pi d}{L}\).</p></details></li>
</ol>
</section>
</template>

<!-- 15-fourier.html -->
<template class="chapter-src" data-id="fourier" data-num="15" data-title="Análisis de Fourier" data-part="Parte IV · Ondas mecánicas" data-short="Series de Fourier, fenómeno de Gibbs, espectro y teorema de Parseval, transformada de Fourier y relación entre duración y ancho de banda">
<p class="lead">En 1807 Joseph Fourier afirmó algo que sus contemporáneos consideraron exagerado: cualquier función periódica, incluso una con saltos, es una suma de senos y cosenos. Tenía razón, y la idea transformó la física. Como las ecuaciones lineales tratan cada frecuencia por separado, basta conocer la respuesta a una onda sinusoidal para conocer la respuesta a cualquier onda.</p>

<section>
<h2>Series de Fourier</h2>
<p>Una función \(f(t)\) de período \(T\) (frecuencia fundamental \(\omega_1=2\pi/T\)) se puede escribir como</p>
<div class="eq key" data-name="Serie de Fourier">\[f(t)=\frac{a_0}2+\sum_{n=1}^\infty\left[a_n\cos(n\omega_1t)+b_n\sen(n\omega_1t)\right],\]</div>
<div class="eq key" data-name="Coeficientes de Fourier">\[a_n=\frac2T\int_0^Tf(t)\cos(n\omega_1t)\,\dd t,\qquad b_n=\frac2T\int_0^Tf(t)\sen(n\omega_1t)\,\dd t .\]</div>
<p>Las fórmulas de los coeficientes se obtienen multiplicando la serie por \(\cos m\omega_1t\) o \(\sen m\omega_1t\) e integrando sobre un período: por la ortogonalidad de los senos y cosenos, sólo sobrevive el término con \(n=m\). Cada coeficiente mide «cuánto se parece» la función a cada armónico.</p>
<p>Algunas series clásicas (amplitud 1, período \(2\pi\)):</p>
<div class="tablewrap"><table>
<tr><th>Onda</th><th class="c">Serie</th><th class="c">Decaimiento</th></tr>
<tr><td>Cuadrada</td><td class="c">\(\dfrac4\pi\left(\sen t+\tfrac13\sen3t+\tfrac15\sen5t+\cdots\right)\)</td><td class="c">\(1/n\), impares</td></tr>
<tr><td>Diente de sierra</td><td class="c">\(\dfrac2\pi\left(\sen t-\tfrac12\sen2t+\tfrac13\sen3t-\cdots\right)\)</td><td class="c">\(1/n\), todos</td></tr>
<tr><td>Triangular</td><td class="c">\(\dfrac8{\pi^2}\left(\sen t-\tfrac19\sen3t+\tfrac1{25}\sen5t-\cdots\right)\)</td><td class="c">\(1/n^2\), impares</td></tr>
<tr><td>Rectificada de onda completa \(|\sen t|\)</td><td class="c">\(\dfrac2\pi-\dfrac4\pi\left(\tfrac13\cos2t+\tfrac1{15}\cos4t+\cdots\right)\)</td><td class="c">\(1/n^2\), pares</td></tr>
</table></div>
<p>La rapidez con que decaen los coeficientes refleja la suavidad de la función: una función con saltos decae como \(1/n\); una continua con picos, como \(1/n^2\); una muy suave, más rápido. Las simetrías también dejan su huella: una función impar sólo tiene senos; una con «simetría de media onda», \(f(t+T/2)=-f(t)\), sólo armónicos impares.</p>
<div class="sim" data-sim="fourier-synthesis" data-title="Síntesis de Fourier: sumando armónicos"></div>
<div class="sim-guide"><ul>
<li>Agregue armónicos uno a uno a la onda cuadrada: cerca de los saltos queda siempre un sobrepaso.</li>
<li>Escuche la cuadrada con 1, 3 y 15 armónicos: la altura (la nota) no cambia, el timbre sí.</li>
</ul></div>
</section>

<section>
<h2>El fenómeno de Gibbs</h2>
<p>En un salto de la función, la serie truncada sobrepasa el valor verdadero en un 9 % del salto, por muchos términos que se tomen: el sobrepaso se estrecha pero no disminuye. Este <span class="term">fenómeno de Gibbs</span> no contradice la convergencia: en cada punto fijo la serie converge (al promedio de los límites laterales en el salto), pero no lo hace uniformemente. En el procesamiento de señales aparece como «anillos» alrededor de los bordes nítidos, por ejemplo en las imágenes JPEG muy comprimidas.</p>
</section>

<section>
<h2>Forma compleja, espectro y Parseval</h2>
<p>Con la fórmula de Euler, la serie toma una forma más compacta:</p>
<div class="eq key" data-name="Serie de Fourier compleja">\[f(t)=\sum_{n=-\infty}^{\infty}c_n\,\ee^{\ii n\omega_1t},\qquad c_n=\frac1T\int_0^Tf(t)\,\ee^{-\ii n\omega_1t}\,\dd t,\qquad c_{-n}=c_n^*\ \ (f\text{ real}).\]</div>
<p>La lista de los \(|c_n|\) (o de las amplitudes \(A_n=\sqrt{a_n^2+b_n^2}\)) en función de la frecuencia es el <span class="term">espectro</span> de la señal. La potencia media se reparte entre los armónicos sin interferencia: es el <span class="term">teorema de Parseval</span>,</p>
<div class="eq key" data-name="Teorema de Parseval">\[\frac1T\int_0^T f^2\,\dd t=\sum_{n=-\infty}^\infty|c_n|^2=\frac{a_0^2}4+\frac12\sum_{n=1}^\infty\left(a_n^2+b_n^2\right).\]</div>
<p>Aplicado a la onda cuadrada (cuyo valor cuadrático medio es 1) da \(\tfrac12\cdot\tfrac{16}{\pi^2}\sum\tfrac1{n^2}=1\) sobre los impares, es decir \(1+\tfrac19+\tfrac1{25}+\cdots=\pi^2/8\).</p>
<div class="sim" data-sim="fourier-draw" data-title="Dibuje una onda: espectro y sonido"></div>
<div class="sim-guide"><ul>
<li>Dibuje una onda con un salto brusco y otra suave: compare cómo caen los armónicos altos.</li>
<li>Dibuje cualquier forma y escúchela: el oído es un analizador de Fourier. Formas muy distintas con el mismo espectro de amplitudes (sólo cambian las fases) suenan casi igual.</li>
</ul></div>
</section>

<section>
<h2>La transformada de Fourier</h2>
<p>Una señal que no se repite (un pulso, una palabra, un golpe) puede verse como periódica con período infinito. Al crecer \(T\), los armónicos se acercan (\(\Delta\omega=2\pi/T\to0\)) y la suma se convierte en una integral:</p>
<div class="eq key" data-name="Transformada de Fourier">\[f(t)=\frac1{2\pi}\int_{-\infty}^\infty F(\omega)\,\ee^{\ii\omega t}\,\dd\omega,\qquad F(\omega)=\int_{-\infty}^\infty f(t)\,\ee^{-\ii\omega t}\,\dd t .\]</div>
<p>El espectro deja de ser una lista de líneas y se vuelve una función continua. Dos pares importantes:</p>
<ul>
<li><strong>Pulso rectangular</strong> de duración \(\tau\): \(F(\omega)=\tau\,\dfrac{\sen(\omega\tau/2)}{\omega\tau/2}\) (una función sinc). Su primer cero está en \(\omega=2\pi/\tau\).</li>
<li><strong>Pulso gaussiano</strong> \(\ee^{-t^2/2\sigma_t^2}\): su transformada es otra gaussiana, de ancho \(\sigma_\omega=1/\sigma_t\).</li>
</ul>
<h3>Duración y ancho de banda</h3>
<p>En ambos casos, cuanto más corto es el pulso, más ancho es su espectro. Definiendo los anchos como desviaciones estándar de \(|f|^2\) y \(|F|^2\), se demuestra que</p>
<div class="eq key" data-name="Relación de incertidumbre de las ondas">\[\Delta t\,\Delta\omega\ge\frac12,\]</div>
<p>con igualdad sólo para el pulso gaussiano. Es una propiedad matemática de las ondas, no una limitación de los instrumentos: una nota que dura 10 ms no puede tener una frecuencia definida mejor que unos 15 Hz. Multiplicada por \(\hbar\), esta relación es el principio de incertidumbre de Heisenberg, \(\Delta t\,\Delta E\ge\hbar/2\).</p>
<div class="sim" data-sim="fourier-transform" data-title="Pulsos y sus transformadas: duración frente a ancho de banda"></div>
<div class="sim-guide"><ul>
<li>Reduzca la duración del pulso a la mitad: el espectro se ensancha al doble. El producto de anchos permanece constante.</li>
<li>Con un tren de \(N\) ciclos de una sinusoide, el espectro es un pico centrado en la frecuencia de la portadora, de ancho \(\sim f/N\). Escuche un tren de 2 ciclos y uno de 200: el primero suena como un clic sin altura definida.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule los coeficientes de Fourier de la onda cuadrada que vale \(+1\) en \((0,\pi)\) y \(-1\) en \((\pi,2\pi)\).
<details><summary>Respuesta</summary><p>\(a_n=0\); \(b_n=\dfrac{2}{n\pi}(1-\cos n\pi)\): \(4/n\pi\) para \(n\) impar y 0 para par.</p></details></li>
<li><span class="lvl">Básico</span>¿Qué fracción de la potencia de una onda cuadrada está en su fundamental?
<details><summary>Respuesta</summary><p>\(\tfrac12(4/\pi)^2=8/\pi^2=81\) %.</p></details></li>
<li><span class="lvl">Intermedio</span>Use Parseval con la onda diente de sierra para demostrar que \(\sum1/n^2=\pi^2/6\).
<details><summary>Respuesta</summary><p>La sierra \(f=t/\pi\) en \((-\pi,\pi)\) tiene \(\langle f^2\rangle=1/3\) y \(b_n=2(-1)^{n+1}/(n\pi)\): \(\tfrac12\sum4/(n^2\pi^2)=1/3\).</p></details></li>
<li><span class="lvl">Intermedio</span>Un radar emite pulsos de 1 µs. ¿Qué ancho de banda necesita el receptor? ¿Cuál es la mínima separación entre dos blancos que puede distinguir?
