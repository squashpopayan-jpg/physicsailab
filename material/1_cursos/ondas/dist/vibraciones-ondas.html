/* Capítulo 17 — Ondas sonoras */
(function () {
  'use strict';
  const EM = window.EM, M = EM.M;
  const f2 = (v) => EM.fix(v, 2);

  /* ======================================================================
     17.1 Onda sonora: moléculas, desplazamiento y presión
     ====================================================================== */
  EM.defineSim('sound-wave', function (sim) {
    const cv = sim.canvas({ aspect: 3, cls: 'fixed' });
    const cg = sim.canvas({ aspect: 2.6 });
    sim.slider('f', { label: 'Frecuencia', min: 20, max: 5000, value: 1000, log: true, step: 1, unit: 'Hz', fmt: (v) => v.toFixed(0) });
    sim.slider('L', { label: 'Nivel sonoro', min: 0, max: 130, step: 1, value: 60, unit: 'dB', fmt: (v) => v.toFixed(0) });
    sim.check('vel', { label: 'Mostrar la velocidad de las partículas', value: false });
    sim.out('lam', 'Longitud de onda', { hl: true });
    sim.out('p0', 'Amplitud de presión <i>p</i><sub>0</sub>');
    sim.out('s0', 'Amplitud de desplazamiento <i>s</i><sub>0</sub>');
    sim.out('u0', 'Velocidad máxima de las partículas');
    sim.note('El dibujo exagera el desplazamiento enormemente para que se vea; la escala horizontal es de dos longitudes de onda.');
    let t = 0;
    sim.animate((dt) => { t += dt; });
    sim.onDraw(() => {
      const p = sim.p, Z = 413, v = 343, w = 2 * Math.PI * p.f;
      const I = 1e-12 * Math.pow(10, p.L / 10), p0 = Math.sqrt(2 * Z * I), s0 = p0 / (Z * w);
      const ph = 2 * Math.PI * 0.5 * t;
      const k = 2 * Math.PI / 1; /* dibujo en unidades de λ */
      const sd = (x) => 0.12 * Math.cos(k * x - ph);
      const ctx = cv.ctx, W = cv.w, H = cv.h, Lx = 2;
      EM.draw.clear(cv);
      /* fondo de presión */
      for (let i = 0; i < W; i += 2) { const x = (i / W) * Lx, pr = Math.sin(k * x - ph); ctx.fillStyle = EM.alpha(pr > 0 ? '--c2' : '--c1', 0.18 * Math.abs(pr)); ctx.fillRect(i, 0, 2, H); }
      for (let j = 0; j < 10; j++) for (let i = 0; i < 90; i++) {
        const x0 = (i / 90) * Lx + ((j * 37) % 10) * 0.002;
        const xx = ((x0 + sd(x0)) / Lx) * W, yy = 10 + (j * (H - 20)) / 9;
        ctx.fillStyle = EM.alpha('--ink-2', 0.75); ctx.beginPath(); ctx.arc(xx, yy, 2, 0, 7); ctx.fill();
      }
      EM.draw.clear(cg);
      const pl = new EM.Plot(cg.ctx, { x: 0, y: 0, w: cg.w, h: cg.h, xmin: 0, xmax: 2, ymin: -1.3, ymax: 1.3, xlabel: 'x / λ', ylabel: 'relativo', ml: 52 });
      pl.frame();
      pl.fn((x) => Math.cos(k * x - ph), { color: '--accent', width: 2.2 });
      pl.fn((x) => Math.sin(k * x - ph), { color: '--c2', width: 2, dash: [6, 4] });
      if (p.vel) pl.fn((x) => Math.sin(k * x - ph), { color: '--c3', width: 1.2, dash: [2, 3] });
      pl.legend([{ label: 'desplazamiento s', color: '--accent' }, { label: 'presión p', color: '--c2', dash: [6, 4] }].concat(p.vel ? [{ label: 'velocidad u (∝ p)', color: '--c3', dash: [2, 3] }] : []), 'tr');
      sim.set('lam', EM.si(v / p.f, 'm'));
      sim.set('p0', EM.si(p0, 'Pa') + ' (' + EM.sci(p0 / 101325, 2) + ' atm)');
      sim.set('s0', EM.si(s0, 'm'));
      sim.set('u0', EM.si(w * s0, 'm/s'));
    });
  });

  /* ======================================================================
     17.2 Velocidad del sonido en gases
     ====================================================================== */
  EM.defineSim('sound-speed', function (sim) {
    const cv = sim.canvas({ aspect: 2.3 });
    const GAS = { air: ['Aire', 28.97, 1.4], he: ['Helio', 4.003, 1.667], co2: ['Dióxido de carbono', 44.01, 1.29], h2: ['Hidrógeno', 2.016, 1.41], ar: ['Argón', 39.95, 1.667], sf6: ['Hexafluoruro de azufre', 146.06, 1.09] };
    sim.select('gas', { label: 'Gas', options: Object.keys(GAS).map((k) => [k, GAS[k][0]]), value: 'air' });
    sim.slider('T', { label: 'Temperatura', min: -50, max: 200, step: 1, value: 20, unit: '°C', fmt: (v) => v.toFixed(0) });
    sim.check('iso', { label: 'Mostrar la predicción isotérmica (Newton)', value: true });
    EM.listenButton(sim, () => { const r = vel() / 343; return { fn: (t) => { let s = 0; [700, 1220, 2600].forEach((F, i) => { s += Math.sin(2 * Math.PI * F * r * t) * [1, 0.6, 0.3][i]; }); return s * (0.6 + 0.4 * Math.sin(2 * Math.PI * 140 * t)); }, dur: 1.3 }; }, { label: '♪ Resonancias de la voz en este gas' });
    sim.out('v', 'Velocidad adiabática √(<i>γRT</i>/<i>M</i>)', { hl: true });
    sim.out('vi', 'Isotérmica √(<i>RT</i>/<i>M</i>)');
    sim.out('r', 'Respecto al aire a la misma temperatura');
    const R = 8.314462618;
    const vel = () => { const g = GAS[sim.p.gas]; return Math.sqrt((g[2] * R * (sim.p.T + 273.15)) / (g[1] / 1000)); };
    sim.onDraw(() => {
      const p = sim.p, g = GAS[p.gas];
      EM.draw.clear(cv);
      const pl = new EM.Plot(cv.ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: -50, xmax: 200, ymin: 0, ymax: 1700, xlabel: 'temperatura (°C)', ylabel: 'v (m/s)', ml: 56 });
      pl.frame();
      Object.keys(GAS).forEach((k) => { const q = GAS[k]; pl.fn((T) => Math.sqrt((q[2] * R * (T + 273.15)) / (q[1] / 1000)), { color: k === p.gas ? '--c1' : '--grid-2', width: k === p.gas ? 2.4 : 1.2 }); });
      if (p.iso) pl.fn((T) => Math.sqrt((R * (T + 273.15)) / (g[1] / 1000)), { color: '--c2', width: 1.6, dash: [5, 4] });
      const v = vel();
      pl.dot(p.T, v, { color: '--accent', r: 6 });
      sim.set('v', EM.fix(v, 1) + ' m/s');
      sim.set('vi', EM.fix(v / Math.sqrt(g[2]), 1) + ' m/s');
      sim.set('r', EM.fix(v / Math.sqrt((1.4 * R * (p.T + 273.15)) / 0.02897), 3) + ' × (las resonancias de la voz se escalan igual)');
    });
  });

  /* ======================================================================
     17.3 Decibeles y distancia
     ====================================================================== */
  EM.defineSim('decibels', function (sim) {
    const cv = sim.canvas({ aspect: 1.9 });
    sim.slider('P', { label: 'Potencia acústica de cada fuente', min: 1e-6, max: 10, value: 0.01, log: true, step: 1e-7, fmt: (v) => EM.si(v, 'W') });
    sim.slider('n', { label: 'Número de fuentes (incoherentes)', min: 1, max: 10, step: 1, value: 1, fmt: (v) => v.toFixed(0) });
    sim.hint('Arrastra el micrófono', cv);
    sim.out('L', 'Nivel en el micrófono', { hl: true });
    sim.out('I', 'Intensidad');
    sim.out('ref', 'Comparable a');
    const mic = { x: 6, y: 0 };
    const Lx = 20;
    const src = (i, n) => ({ x: -6, y: (i - (n - 1) / 2) * 0.6 });
    let view = null;
    EM.pointer(cv, {
      down: (x, y) => { if (!view) return null; const px = view.X(mic.x), py = view.Y(mic.y); return Math.hypot(px - x, py - y) < 20 ? 1 : null; },
      move: (_, x, y) => { mic.x = M.clamp(view.ix(x), -9.5, 9.5); mic.y = M.clamp(view.iy(y), -5, 5); sim.redraw(); },
      hover: (x, y) => view && Math.hypot(view.X(mic.x) - x, view.Y(mic.y) - y) < 20
    });
    const refs = [[0, 'umbral de audición'], [20, 'hojas al viento'], [40, 'biblioteca'], [60, 'conversación'], [70, 'aspiradora'], [85, 'tráfico intenso (límite laboral)'], [100, 'motocicleta'], [110, 'concierto de rock'], [120, 'umbral de dolor'], [140, 'avión a reacción']];
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, W = cv.w, H = cv.h;
      EM.draw.clear(cv);
      const sc = W / Lx, cx = W / 2, cy = H / 2;
      view = { X: (x) => cx + x * sc, Y: (y) => cy - y * sc, ix: (px) => (px - cx) / sc, iy: (py) => (cy - py) / sc };
      /* mapa de nivel */
      const step = 6;
      for (let py = 0; py < H; py += step) for (let px = 0; px < W; px += step) {
        const x = view.ix(px + step / 2), y = view.iy(py + step / 2);
        let I = 0;
        for (let i = 0; i < p.n; i++) { const s = src(i, p.n); I += p.P / (4 * Math.PI * Math.max(0.05, (x - s.x) ** 2 + (y - s.y) ** 2)); }
        const L = 10 * Math.log10(I / 1e-12);
        const c = EM.cmap.inferno(M.clamp((L - 20) / 120, 0, 1));
        ctx.fillStyle = EM.rgbStr(c, 0.55); ctx.fillRect(px, py, step, step);
      }
      for (let i = 0; i < p.n; i++) { const s = src(i, p.n); EM.draw.bob(ctx, view.X(s.x), view.Y(s.y), 7, { color: '--c2' }); }
      let I = 0;
      for (let i = 0; i < p.n; i++) { const s = src(i, p.n); I += p.P / (4 * Math.PI * Math.max(0.05, (mic.x - s.x) ** 2 + (mic.y - s.y) ** 2)); }
      const L = 10 * Math.log10(I / 1e-12);
      const mx = view.X(mic.x), my = view.Y(mic.y);
      ctx.fillStyle = EM.col('--ink'); ctx.beginPath(); ctx.arc(mx, my, 9, 0, 7); ctx.fill();
      ctx.fillStyle = EM.col('--canvas'); ctx.beginPath(); ctx.arc(mx, my, 4, 0, 7); ctx.fill();
      EM.text(ctx, EM.fix(L, 1) + ' dB', mx + 12, my - 10, { size: 13, weight: 700, halo: true, color: '--ink' });
      /* escala */
      for (let d = 1; d <= 16; d *= 2) { ctx.strokeStyle = EM.alpha('#ffffff', 0.25); ctx.beginPath(); ctx.arc(view.X(-6), view.Y(0), d * sc, 0, 7); ctx.stroke(); }
      EM.text(ctx, 'círculos: 1, 2, 4, 8 y 16 m de la fuente central', 10, H - 8, { size: 11, color: '--ink-2', halo: true });
      let ref = refs[0][1];
      refs.forEach(([v, n]) => { if (L >= v - 5) ref = n; });
      sim.set('L', EM.fix(L, 1) + ' dB');
      sim.set('I', EM.si(I, 'W/m²'));
      sim.set('ref', ref);
    });
  });

  /* ======================================================================
     17.4 Generador de tonos
     ====================================================================== */
  EM.defineSim('hearing', function (sim) {
    const cv = sim.canvas({ aspect: 2.4 });
    sim.slider('f', { label: 'Frecuencia del tono', min: 20, max: 20000, value: 1000, log: true, step: 1, unit: 'Hz', fmt: (v) => v.toFixed(0) });
    sim.slider('g', { label: 'Volumen relativo', min: -60, max: 0, step: 1, value: -20, unit: 'dB', fmt: (v) => v.toFixed(0) });
    const amp = () => Math.pow(10, sim.p.g / 20);
    if (EM.audio.ok()) {
      sim.button('♪ Reproducir tono', () => EM.audio.play((t) => amp() * Math.sin(2 * Math.PI * sim.p.f * t), 1.5, 0.3, false));
      sim.button('Barrido 20 Hz → 20 kHz', () => { const T = 10, a = Math.log(1000) / T; EM.audio.play((t) => amp() * Math.sin((2 * Math.PI * 20 * (Math.exp(a * t) - 1)) / a), T, 0.3, false); });
      sim.button('Detener', () => EM.audio.stop());
    }
    sim.out('lam', 'Longitud de onda en el aire', { hl: true });
    sim.out('th', 'Umbral típico de audición a esta frecuencia');
    sim.note('El sonido no se normaliza: un volumen de −20 dB suena 20 dB más bajo que 0 dB. Ajuste primero el volumen de su equipo.');
    /* umbral aproximado (ISO 226, curva de 0 fon) en dB SPL */
    const thr = (f) => { const k = f / 1000; return 3.64 * Math.pow(k, -0.8) - 6.5 * Math.exp(-0.6 * (k - 3.3) ** 2) + 1e-3 * k ** 4; };
    sim.onDraw(() => {
      const p = sim.p;
      EM.draw.clear(cv);
      const pl = new EM.Plot(cv.ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: 20, xmax: 20000, xlog: true, ymin: -10, ymax: 130, xlabel: 'frecuencia (Hz)', ylabel: 'nivel (dB)', ml: 52 });
      pl.frame();
      pl.fn(thr, { color: '--c1', width: 2.2, n: 400 });
      pl.fn((f) => Math.min(130, thr(f) + 120 - 10 * Math.log10(1 + (f / 15000) ** 4)), { color: '--c2', width: 1.6, dash: [5, 4], n: 400 });
      pl.label(25, thr(25) + 6, 'umbral de audición', { color: '--c1', size: 11 });
      pl.label(25, 125, 'umbral de dolor', { color: '--c2', size: 11 });
      pl.band(2000, 5000, { color: '--c3', alpha: 0.08 });
      pl.vline(p.f, { color: '--accent' });
      pl.dot(p.f, thr(p.f), { color: '--accent', r: 6 });
      sim.set('lam', EM.si(343 / p.f, 'm'));
      sim.set('th', EM.fix(thr(p.f), 1) + ' dB SPL');
    });
  });
})();

/* ==== chapters/18-acustica.js ==== */
/* Capítulo 18 — Tubos, instrumentos y escalas */
(function () {
  'use strict';
  const EM = window.EM, M = EM.M;
  const f2 = (v) => EM.fix(v, 2);
  const vS = (T) => 331.3 * Math.sqrt(1 + T / 273.15);

  /* Nota con envolvente ADSR simple a partir de una lista [frecuencia, amplitud] */
  const note = (parts, o = {}) => (t) => {
    const at = o.attack || 0.03, dec = o.decay || 0;
    const env = Math.min(1, t / at) * (dec ? Math.exp(-t * dec) : 1);
    let s = 0;
    for (const [f, a] of parts) if (f < 16000) s += a * Math.sin(2 * Math.PI * f * t + (o.ph ? o.ph * f : 0));
    return s * env * (o.vib ? 1 + 0.02 * Math.sin(2 * Math.PI * 5 * t) : 1);
  };
  EM.note = note;

  /* ======================================================================
     18.1 Modos de una columna de aire
     ====================================================================== */
  EM.defineSim('pipe-modes', function (sim) {
    const cv = sim.canvas({ aspect: 3.4, cls: 'fixed' });
    const cg = sim.canvas({ aspect: 2.6 });
    sim.slider('L', { label: 'Longitud del tubo <i>L</i>', min: 0.1, max: 3, step: 0.01, value: 0.6, unit: 'm', fmt: f2 });
    sim.slider('T', { label: 'Temperatura del aire', min: -10, max: 40, step: 1, value: 20, unit: '°C', fmt: (v) => v.toFixed(0) });
    sim.seg('bc', { label: 'Extremos', options: [['oo', 'Abierto–abierto'], ['co', 'Cerrado–abierto']], value: 'oo' });
    sim.slider('n', { label: 'Modo <i>n</i>', min: 1, max: 6, step: 1, value: 1, fmt: (v) => v.toFixed(0) });
    EM.listenButton(sim, () => ({ fn: note([[freq(), 1]], { decay: 0.4 }), dur: 1.8 }), { label: '♪ Modo n' });
    EM.listenButton(sim, () => { const p = sim.p, f1 = freq(1); const parts = []; for (let m = 1; m <= 12; m++) { const f = p.bc === 'oo' ? m * f1 : (2 * m - 1) * f1; parts.push([f, 1 / m]); } return { fn: note(parts, { decay: 0.3, vib: true }), dur: 2 }; }, { label: '♪ Todos los modos' });
    sim.out('f', 'Frecuencia <i>f<sub>n</sub></i>', { hl: true });
    sim.out('lam', 'Longitud de onda');
    sim.out('ratio', '<i>f<sub>n</sub></i>/<i>f</i><sub>1</sub>');
    const freq = (nn) => { const p = sim.p, n = nn || p.n, v = vS(p.T); return p.bc === 'oo' ? (n * v) / (2 * p.L) : ((2 * n - 1) * v) / (4 * p.L); };
    let t = 0;
    sim.animate((dt) => { t += dt; });
    sim.onDraw(() => {
      const p = sim.p, kL = p.bc === 'oo' ? p.n * Math.PI : ((2 * p.n - 1) * Math.PI) / 2;
      /* desplazamiento: oo → cos(kx); co (cerrado en x = 0) → sen(kx) */
      const disp = (u) => (p.bc === 'oo' ? Math.cos(kL * u) : Math.sin(kL * u));
      const pres = (u) => (p.bc === 'oo' ? Math.sin(kL * u) : -Math.cos(kL * u));
      const c = Math.cos(2 * Math.PI * 0.5 * t);
      const ctx = cv.ctx, W = cv.w, H = cv.h, x0 = 30, x1 = W - 30;
      EM.draw.clear(cv);
      ctx.fillStyle = EM.alpha('--c1', 0.06); ctx.fillRect(x0, 14, x1 - x0, H - 28);
      ctx.strokeStyle = EM.col('--ink-2'); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x0, 14); ctx.lineTo(x1, 14); ctx.moveTo(x0, H - 14); ctx.lineTo(x1, H - 14); ctx.stroke();
      if (p.bc === 'co') { ctx.beginPath(); ctx.moveTo(x0, 14); ctx.lineTo(x0, H - 14); ctx.stroke(); }
      for (let j = 0; j < 6; j++) for (let i = 0; i <= 70; i++) {
        const u = i / 70, xx = x0 + (x1 - x0) * u + 9 * disp(u) * c, yy = 22 + (j * (H - 44)) / 5;
        ctx.fillStyle = EM.alpha('--ink-2', 0.7); ctx.beginPath(); ctx.arc(xx, yy, 2, 0, 7); ctx.fill();
      }
      EM.draw.clear(cg);
      const pl = new EM.Plot(cg.ctx, { x: 0, y: 0, w: cg.w, h: cg.h, xmin: 0, xmax: 1, ymin: -1.3, ymax: 1.3, xlabel: 'x / L', ylabel: 'amplitud', ml: 52 });
      pl.frame();
      pl.fn(disp, { color: '--accent', width: 2.2 });
      pl.fn(pres, { color: '--c2', width: 2, dash: [6, 4] });
      pl.legend([{ label: 'desplazamiento', color: '--accent' }, { label: 'presión', color: '--c2', dash: [6, 4] }], 'br');
      const f = freq();
      sim.set('f', EM.fix(f, 1) + ' Hz');
      sim.set('lam', EM.si(vS(p.T) / f, 'm'));
      sim.set('ratio', EM.fix(f / freq(1), 0));
    });
  });

  /* ======================================================================
     18.2 Tubo de resonancia
     ====================================================================== */
  EM.defineSim('resonance-tube', function (sim) {
    sim.cols2();
    const cv = sim.canvas({ aspect: 0.75 });
    const cp = sim.canvas({ aspect: 0.75 });
    sim.slider('f', { label: 'Frecuencia del diapasón', min: 256, max: 1024, step: 1, value: 512, unit: 'Hz', fmt: (v) => v.toFixed(0) });
    sim.slider('h', { label: 'Columna de aire', min: 0.02, max: 1, step: 0.001, value: 0.12, fmt: (v) => EM.fix(100 * v, 1) + ' cm' });
    sim.slider('T', { label: 'Temperatura', min: 0, max: 35, step: 1, value: 20, unit: '°C', fmt: (v) => v.toFixed(0) });
    sim.slider('a', { label: 'Radio del tubo', min: 0.5, max: 3, step: 0.1, value: 1.5, unit: 'cm', fmt: (v) => EM.fix(v, 1) });
    sim.button('Bajar el agua lentamente', () => { lowering = true; sim.ctl.h.set(0.02); });
    sim.out('A', 'Intensidad del sonido (relativa)', { hl: true });
    sim.out('res', 'Resonancias esperadas');
    let lowering = false, t = 0;
    const amp = (h) => { const p = sim.p, v = vS(p.T), k = (2 * Math.PI * p.f) / v, Le = h + 0.006 * p.a; const s = Math.cos(k * Le); return 1 / Math.sqrt(s * s + 0.004); };
    sim.animate((dt) => { t += dt; if (lowering) { const nh = sim.p.h + dt * 0.04; if (nh >= 1) lowering = false; sim.ctl.h.set(Math.min(1, nh), true); } });
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, W = cv.w, H = cv.h;
      EM.draw.clear(cv);
      const top = 40, bot = H - 14, sc = (bot - top) / 1.05, tx = W * 0.5, tw = 34;
      const wl = top + p.h * sc;
      ctx.fillStyle = EM.alpha('--c1', 0.35); ctx.fillRect(tx - tw / 2, wl, tw, bot - wl);
      ctx.strokeStyle = EM.col('--ink-2'); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(tx - tw / 2, top); ctx.lineTo(tx - tw / 2, bot); ctx.lineTo(tx + tw / 2, bot); ctx.lineTo(tx + tw / 2, top); ctx.stroke();
      /* diapasón */
      const vib = 2 * Math.sin(t * 40);
      ctx.fillStyle = EM.col('--ink-3');
      ctx.fillRect(tx - 14 + vib, top - 34, 5, 26); ctx.fillRect(tx + 9 - vib, top - 34, 5, 26); ctx.fillRect(tx - 14, top - 10, 28, 4);
      /* patrón de desplazamiento en la columna */
      const v = vS(p.T), k = (2 * Math.PI * p.f) / v, A = Math.min(1, amp(p.h) / 15);
      const pts = [];
      for (let i = 0; i <= 100; i++) { const z = (p.h * i) / 100; pts.push([tx + 13 * A * Math.sin(k * (p.h - z)) * Math.cos(t * 6), top + z * sc]); }
      EM.draw.poly(ctx, pts, { color: '--accent', width: 2 });
      EM.draw.clear(cp);
      const pl = new EM.Plot(cp.ctx, { x: 0, y: 0, w: cp.w, h: cp.h, xmin: 0, xmax: 1, ymin: 0, ymax: 17, xlabel: 'columna de aire (m)', ylabel: 'intensidad', ml: 52 });
      pl.frame();
      pl.fn(amp, { color: '--c1', width: 2, n: 800 });
      pl.dot(p.h, amp(p.h), { color: '--accent', r: 6 });
      const res = [];
      for (let m = 1; m <= 6; m++) { const L = ((2 * m - 1) * v) / (4 * p.f) - 0.006 * p.a; if (L < 1) res.push(EM.fix(100 * L, 1)); }
      sim.set('A', EM.fix(amp(p.h), 1));
      sim.set('res', res.join(', ') + ' cm (separadas λ/2 = ' + EM.fix((100 * v) / (2 * p.f), 1) + ' cm)');
    });
  });

  /* ======================================================================
     18.3 Resonador de Helmholtz
     ====================================================================== */
  EM.defineSim('helmholtz', function (sim) {
    const cv = sim.canvas({ aspect: 2.2 });
    sim.slider('V', { label: 'Volumen de aire <i>V</i>', min: 50, max: 3000, step: 10, value: 750, unit: 'mL', fmt: (v) => v.toFixed(0) });
    sim.slider('d', { label: 'Diámetro del cuello', min: 0.5, max: 6, step: 0.1, value: 2, unit: 'cm', fmt: (v) => EM.fix(v, 1) });
    sim.slider('L', { label: 'Longitud del cuello', min: 0.5, max: 15, step: 0.1, value: 8, unit: 'cm', fmt: (v) => EM.fix(v, 1) });
    EM.listenButton(sim, () => { const f = fH(); return { fn: (t) => { let s = Math.sin(2 * Math.PI * f * t) * (0.6 + 0.4 * Math.sin(2 * Math.PI * 3 * t)); s += 0.15 * (Math.random() - 0.5); return s; }, dur: 2 }; }, { label: '♪ Soplar' });
    sim.out('f', 'Frecuencia de Helmholtz', { hl: true });
    sim.out('lam', 'Longitud de onda (≫ tamaño de la botella)');
    sim.out('Le', 'Longitud efectiva del cuello');
    const fH = () => { const p = sim.p, a = p.d / 200, S = Math.PI * a * a, Le = p.L / 100 + 1.5 * a; return (343 / (2 * Math.PI)) * Math.sqrt(S / ((p.V * 1e-6) * Le)); };
    let t = 0;
    sim.animate((dt) => { t += dt; });
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, W = cv.w, H = cv.h;
      EM.draw.clear(cv);
      const sz = Math.cbrt(p.V / 750);
      const nw = Math.max(5, p.d * 9), nl = p.L * 7;
      const cx = W * 0.3, by = H - 16;
      const bh = Math.min(H * 0.62 - nl * 0.3, H * 0.5 * sz), bw = Math.min(W * 0.45, W * 0.28 * sz);
      ctx.fillStyle = EM.alpha('--c3', 0.15); ctx.strokeStyle = EM.col('--c3'); ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(cx - nw / 2, by - bh - nl); ctx.lineTo(cx - nw / 2, by - bh); ctx.quadraticCurveTo(cx - bw / 2, by - bh, cx - bw / 2, by - bh * 0.6);
      ctx.lineTo(cx - bw / 2, by); ctx.lineTo(cx + bw / 2, by); ctx.lineTo(cx + bw / 2, by - bh * 0.6); ctx.quadraticCurveTo(cx + bw / 2, by - bh, cx + nw / 2, by - bh); ctx.lineTo(cx + nw / 2, by - bh - nl);
      ctx.fill(); ctx.stroke();
      /* pistón de aire en el cuello */
      const z = 6 * Math.sin(t * 8);
      ctx.fillStyle = EM.alpha('--accent', 0.6); ctx.fillRect(cx - nw / 2 + 2, by - bh - nl * 0.75 + z, nw - 4, nl * 0.5);
      EM.text(ctx, 'masa: aire del cuello', cx + nw / 2 + 8, by - bh - nl * 0.5, { size: 11, color: '--accent' });
      EM.text(ctx, 'resorte: aire del interior', cx + bw / 2 + 8, by - bh * 0.3, { size: 11, color: '--c3' });
      const f = fH();
      /* curva f vs V */
      const x0 = W * 0.62;
      const pl = new EM.Plot(ctx, { x: x0, y: 0, w: W - x0, h: H, xmin: 50, xmax: 3000, xlog: true, ymin: 10, ymax: 2000, ylog: true, xlabel: 'V (mL)', ylabel: 'f (Hz)', ml: 52 });
      pl.frame();
      const save = p.V;
      pl.fn((V) => { p.V = V; const r = fH(); return r; }, { color: '--c1', width: 2 });
      p.V = save;
      pl.dot(p.V, f, { color: '--accent', r: 6 });
      const a = p.d / 200;
      sim.set('f', EM.fix(f, 1) + ' Hz');
      sim.set('lam', EM.si(343 / f, 'm'));
      sim.set('Le', EM.fix(p.L + 150 * a, 1) + ' cm');
    });
  });

  /* ======================================================================
     18.4 Timbre
     ====================================================================== */
  EM.defineSim('timbre', function (sim) {
    sim.cols2();
    const cw = sim.canvas({ aspect: 1.15 });
    const cs = sim.canvas({ aspect: 1.15 });
    /* formantes de vocales (Hz) */
    const VOW = { a: [800, 1200, 2500], e: [500, 1800, 2500], i: [300, 2300, 3000], o: [500, 900, 2400], u: [320, 800, 2300] };
    const formant = (f, F) => F.reduce((s, Fi, i) => s + [1, 0.6, 0.3][i] / (1 + ((f - Fi) / (60 + 0.06 * Fi)) ** 2), 0);
    const INS = {
      sine: { n: 'Sinusoide pura', a: (n) => (n === 1 ? 1 : 0) },
      flute: { n: 'Flauta', a: (n) => [1, 0.3, 0.12, 0.05, 0.03][n - 1] || 0 },
      clar: { n: 'Clarinete (grave)', a: (n) => (n % 2 ? 1 / n : 0.04 / n) },
      violin: { n: 'Violín (diente de sierra)', a: (n) => 1 / n },
      oboe: { n: 'Oboe', a: (n) => [0.4, 0.8, 1, 0.7, 0.5, 0.3, 0.2, 0.15][n - 1] || 0.1 / n },
      vow: { n: 'Voz cantada (vocal)', a: (n, f1, v) => (1 / n) * formant(n * f1, VOW[v]) }
    };
    sim.select('ins', { label: 'Fuente', options: Object.keys(INS).map((k) => [k, INS[k].n]), value: 'violin' });
    sim.seg('v', { label: 'Vocal', options: [['a', 'a'], ['e', 'e'], ['i', 'i'], ['o', 'o'], ['u', 'u']], value: 'a' });
    sim.slider('f1', { label: 'Fundamental', min: 80, max: 500, step: 1, value: 196, unit: 'Hz', fmt: (v) => v.toFixed(0) });
    sim.check('miss', { label: 'Quitar la fundamental', value: false });
    const parts = () => { const p = sim.p, I = INS[p.ins], out = []; for (let n = 1; n <= 40; n++) { let a = I.a(n, p.f1, p.v); if (n === 1 && p.miss) a = 0; if (n * p.f1 < 12000) out.push([n * p.f1, a]); } return out; };
    EM.listenButton(sim, () => ({ fn: note(parts(), { attack: 0.06, vib: sim.p.ins === 'vow' || sim.p.ins === 'violin' }), dur: 1.8 }));
    sim.onDraw(() => {
      const p = sim.p, P = parts();
      sim.ctl.v.show(p.ins === 'vow');
      EM.draw.clear(cw);
      const T = 2 / p.f1;
      const pw = new EM.Plot(cw.ctx, { x: 0, y: 0, w: cw.w, h: cw.h, xmin: 0, xmax: T * 1000, ymin: -1.2, ymax: 1.2, xlabel: 't (ms)', ylabel: 'presión', ml: 52 });
      pw.frame();
      let mx = 1e-9;
      const xs = [], ys = [];
      for (let i = 0; i <= 600; i++) { const t = (T * i) / 600; let s = 0; for (const [f, a] of P) s += a * Math.sin(2 * Math.PI * f * t); xs.push(t * 1000); ys.push(s); mx = Math.max(mx, Math.abs(s)); }
      pw.xy(xs, ys.map((v) => v / mx), { color: '--accent', width: 2 });
      EM.draw.clear(cs);
      const am = Math.max(1e-9, ...P.map((q) => q[1]));
      const ps = new EM.Plot(cs.ctx, { x: 0, y: 0, w: cs.w, h: cs.h, xmin: 0, xmax: 4000, ymin: 0, ymax: 1.1, xlabel: 'frecuencia (Hz)', ylabel: 'amplitud relativa', ml: 52 });
      ps.frame();
      if (p.ins === 'vow') ps.fn((f) => formant(f, VOW[p.v]) / 1.2, { color: '--c3', width: 1.2, dash: [4, 4] });
      P.forEach(([f, a]) => { if (f > 4000) return; cs.ctx.fillStyle = EM.alpha('--c1', 0.85); cs.ctx.fillRect(ps.X(f) - 2.5, ps.Y(a / am), 5, ps.Y(0) - ps.Y(a / am)); });
    });
  });

  /* ======================================================================
     18.5 Intervalos
     ====================================================================== */
  EM.defineSim('intervals', function (sim) {
    const cv = sim.canvas({ aspect: 2.5 });
    const IV = { oct: ['Octava', 2, 12], fifth: ['Quinta', 1.5, 7], fourth: ['Cuarta', 4 / 3, 5], M3: ['Tercera mayor', 1.25, 4], m3: ['Tercera menor', 1.2, 3], M6: ['Sexta mayor', 5 / 3, 9], tri: ['Tritono', 45 / 32, 6], m2: ['Segunda menor', 16 / 15, 1] };
    sim.select('iv', { label: 'Intervalo', options: Object.keys(IV).map((k) => [k, IV[k][0]]), value: 'fifth' });
    sim.seg('tune', { label: 'Afinación', options: [['just', 'Justa'], ['eq', 'Temperada']], value: 'just' });
    sim.slider('f1', { label: 'Nota grave', min: 110, max: 440, step: 1, value: 220, unit: 'Hz', fmt: (v) => v.toFixed(0) });
    const ratio = () => { const I = IV[sim.p.iv]; return sim.p.tune === 'just' ? I[1] : Math.pow(2, I[2] / 12); };
    const tone = (f) => { const P = []; for (let n = 1; n <= 8; n++) P.push([n * f, 1 / n]); return P; };
    EM.listenButton(sim, () => ({ fn: note(tone(sim.p.f1).concat(tone(sim.p.f1 * ratio())), { attack: 0.05 }), dur: 3 }), { label: '♪ Escuchar el intervalo' });
    sim.out('r', 'Razón de frecuencias', { hl: true });
    sim.out('c', 'Tamaño en cents');
    sim.out('b', 'Batimiento más lento entre armónicos próximos');
    sim.onDraw(() => {
      const p = sim.p, r = ratio(), f2v = p.f1 * r;
      EM.draw.clear(cv);
      const pl = new EM.Plot(cv.ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: 0, xmax: 8.5 * p.f1, ymin: 0, ymax: 2.6, xlabel: 'frecuencia (Hz)', ylabel: '', ml: 20, yticks: [] });
      pl.frame();
      const ctx = cv.ctx;
      let minBeat = Infinity;
      for (let n = 1; n <= 8; n++) {
        const a = n * p.f1;
        ctx.fillStyle = EM.alpha('--c1', 0.85); ctx.fillRect(pl.X(a) - 2, pl.Y(1 + 0.8 / n), 4, pl.Y(1) - pl.Y(1 + 0.8 / n));
        for (let m = 1; m <= 8; m++) { const b = m * f2v; if (b > 8.5 * p.f1) continue; const d = Math.abs(a - b); if (d > 1e-6 && d < 40) { minBeat = Math.min(minBeat, d); pl.vline((a + b) / 2, { color: '--c2', alpha: 0.6 }); } if (d < 1e-6) pl.dot(a, 1.05, { color: '--c3', r: 6 }); }
      }
      for (let m = 1; m * f2v <= 8.5 * p.f1; m++) { const b = m * f2v; ctx.fillStyle = EM.alpha('--accent', 0.85); ctx.fillRect(pl.X(b) - 2, pl.Y(1), 4, pl.Y(1 - 0.8 / m) - pl.Y(1)); }
      pl.label(p.f1 * 0.2, 2.35, 'armónicos de la nota grave ↑', { color: '--c1' });
      pl.label(p.f1 * 0.2, 0.12, 'armónicos de la nota aguda ↓', { color: '--accent' });
      sim.set('r', EM.fix(r, 5));
      sim.set('c', EM.fix(1200 * Math.log2(r), 1) + ' cents');
      sim.set('b', isFinite(minBeat) ? EM.fix(minBeat, 2) + ' Hz' : 'coincidencias exactas (sin batimientos)');
    });
  });
})();

/* ==== chapters/19-doppler.js ==== */
/* Capítulo 19 — Efecto Doppler y ondas de choque */
(function () {
  'use strict';
  const EM = window.EM, M = EM.M;
  const f2 = (v) => EM.fix(v, 2);
  const VS = 343;

  /* ======================================================================
     19.1 Frentes de onda con fuente y observador en movimiento
     ====================================================================== */
  EM.defineSim('doppler-fronts', function (sim) {
    const cv = sim.canvas({ aspect: 1.9 });
    sim.slider('vs', { label: 'Velocidad de la fuente <i>v<sub>s</sub></i>/<i>v</i>', min: 0, max: 1.6, step: 0.01, value: 0.5, fmt: f2, onInput: () => restart() });
    sim.slider('vo', { label: 'Velocidad del observador <i>v<sub>o</sub></i>/<i>v</i> (hacia la fuente)', min: -0.8, max: 0.8, step: 0.01, value: 0, fmt: f2, onInput: () => restart() });
    sim.slider('f', { label: 'Frecuencia emitida', min: 100, max: 2000, step: 10, value: 440, unit: 'Hz', fmt: (v) => v.toFixed(0) });
    sim.resetButton(() => restart());
    sim.out('fa', 'Observador delante (fórmula)', { hl: true });
    sim.out('fb', 'Observador detrás, en reposo');
    sim.out('la', 'Longitud de onda delante / detrás');
    /* unidades visuales: v = 1, frecuencia de emisión visual 1.6 Hz */
    let fronts, t, xs, xo;
    const W0 = 16;
    const restart = () => { fronts = []; t = 0; xs = -6; xo = 7; };
    restart();
    sim.animate((dt) => {
      const p = sim.p, T = 1 / 1.6, s = 1.4;
      const tn = t + dt * s;
      for (let k = Math.ceil(t / T); k * T < tn; k++) fronts.push([xs + p.vs * (k * T - t), k * T]);
      t = tn;
      xs += p.vs * dt * s;
      xo -= p.vo * dt * s;
      fronts = fronts.filter((q) => t - q[1] < 14);
      if (xs > 9 || xo < xs + 0.5 || xo < -8 || xo > 9) restart();
    });
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, W = cv.w, H = cv.h, sc = W / W0, cx = W / 2, cy = H / 2;
      EM.draw.clear(cv);
      ctx.lineWidth = 1.4;
      fronts.forEach(([x0, te]) => {
        const r = (t - te) * sc;
        ctx.strokeStyle = EM.alpha('--c1', Math.max(0.1, 0.8 - (t - te) * 0.06));
        ctx.beginPath(); ctx.arc(cx + x0 * sc, cy, r, 0, 2 * Math.PI); ctx.stroke();
      });
      if (p.vs > 1) {
        const a = Math.asin(1 / p.vs), L = W;
        ctx.strokeStyle = EM.col('--c2'); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cx + xs * sc, cy); ctx.lineTo(cx + xs * sc - L * Math.cos(a), cy - L * Math.sin(a)); ctx.moveTo(cx + xs * sc, cy); ctx.lineTo(cx + xs * sc - L * Math.cos(a), cy + L * Math.sin(a)); ctx.stroke();
      }
      EM.draw.bob(ctx, cx + xs * sc, cy, 8, { color: '--accent' });
      if (p.vs > 0) EM.draw.arrow(ctx, cx + xs * sc, cy - 16, cx + xs * sc + 30, cy - 16, { color: '--accent', width: 2 });
      /* observador */
      ctx.fillStyle = EM.col('--c3'); ctx.beginPath(); ctx.arc(cx + xo * sc, cy, 7, 0, 7); ctx.fill();
      EM.text(ctx, 'observador', cx + xo * sc, cy + 24, { size: 11, color: '--c3', align: 'center' });
      if (p.vo !== 0) EM.draw.arrow(ctx, cx + xo * sc, cy - 16, cx + xo * sc - 26 * Math.sign(p.vo), cy - 16, { color: '--c3', width: 2 });
      const fa = p.vs < 1 ? (p.f * (1 + p.vo)) / (1 - p.vs) : NaN, fb = p.f / (1 + p.vs);
      sim.set('fa', p.vs < 1 ? EM.fix(fa, 1) + ' Hz' : '— (la fuente llega antes que su sonido)');
      sim.set('fb', EM.fix(fb, 1) + ' Hz');
      sim.set('la', EM.si((VS * (1 - p.vs)) / p.f, 'm') + ' / ' + EM.si((VS * (1 + p.vs)) / p.f, 'm'));
    });
  });

  /* ======================================================================
     19.2 Una sirena que pasa
     ====================================================================== */
  EM.defineSim('doppler-passby', function (sim) {
    const cv = sim.canvas({ aspect: 3.4, cls: 'fixed' });
    const cp = sim.canvas({ aspect: 2.6 });
    sim.slider('u', { label: 'Velocidad del vehículo', min: 10, max: 300, step: 1, value: 100, unit: 'km/h', fmt: (v) => v.toFixed(0) });
    sim.slider('d', { label: 'Distancia mínima al observador', min: 1, max: 100, value: 10, log: true, step: 0.1, unit: 'm', fmt: (v) => EM.fix(v, 1) });
    sim.slider('f', { label: 'Frecuencia de la sirena', min: 200, max: 1500, step: 10, value: 700, unit: 'Hz', fmt: (v) => v.toFixed(0) });
    EM.listenButton(sim, () => {
      const p = sim.p, u = p.u / 3.6, d = p.d, dur = 7;
      /* señal recibida: se busca el instante de emisión t_e con t = t_e + r(t_e)/v */
      return {
        fn: (t) => {
          const tr = t - dur / 2;
          let te = tr - d / VS;
          for (let i = 0; i < 6; i++) te = tr - Math.hypot(u * te, d) / VS;
          const r = Math.hypot(u * te, d);
          const ph = 2 * Math.PI * p.f * te, ph2 = 2 * Math.PI * p.f * 1.5 * te;
          return ((Math.sin(ph) + 0.4 * Math.sin(ph2)) * Math.min(1, 3 / r));
        }, dur
      };
    }, { label: '♪ Escuchar el paso' });
    sim.out('fa', 'Frecuencia al acercarse', { hl: true });
    sim.out('fb', 'Frecuencia al alejarse');
    sim.out('st', 'Caída de tono');
    let t = -4;
    sim.animate((dt) => { t += dt; if (t > 4) t = -4; });
    sim.onDraw(() => {
      const p = sim.p, u = p.u / 3.6;
      const fRec = (tr) => { let te = tr - p.d / VS; for (let i = 0; i < 8; i++) te = tr - Math.hypot(u * te, p.d) / VS; const x = u * te, r = Math.hypot(x, p.d), cos = -x / r; return p.f / (1 - (u / VS) * cos); };
      const ctx = cv.ctx, W = cv.w, H = cv.h;
      EM.draw.clear(cv);
      const span = Math.max(u * 4, 40), sc = W / (2 * span);
      ctx.fillStyle = EM.alpha('--ink-3', 0.2); ctx.fillRect(0, H * 0.25, W, H * 0.25);
      const xv = W / 2 + u * t * sc;
      ctx.fillStyle = EM.col('--c2'); ctx.fillRect(xv - 18, H * 0.3, 36, H * 0.15);
      ctx.fillStyle = EM.col('--c1'); ctx.fillRect(xv - 6, H * 0.25, 12, 5);
      const oy = Math.min(H - 12, H * 0.375 + p.d * sc);
      ctx.fillStyle = EM.col('--c3'); ctx.beginPath(); ctx.arc(W / 2, oy, 7, 0, 7); ctx.fill();
      EM.text(ctx, 'observador (d = ' + EM.fix(p.d, 1) + ' m)', W / 2 + 12, oy + 4, { size: 11, color: '--c3' });
      EM.draw.clear(cp);
      const fa = p.f / (1 - u / VS), fb = p.f / (1 + u / VS);
      const pl = new EM.Plot(cp.ctx, { x: 0, y: 0, w: cp.w, h: cp.h, xmin: -4, xmax: 4, ymin: fb * 0.97, ymax: fa * 1.03, xlabel: 't (s) respecto al paso más cercano', ylabel: 'f percibida (Hz)', ml: 58 });
      pl.frame();
      pl.hline(p.f, { color: '--ink-3', label: 'f emitida' });
      pl.fn(fRec, { color: '--c1', width: 2.2, n: 600 });
      pl.dot(t, fRec(t), { color: '--accent', r: 6 });
      sim.set('fa', EM.fix(fa, 1) + ' Hz');
      sim.set('fb', EM.fix(fb, 1) + ' Hz');
      sim.set('st', EM.fix(12 * Math.log2(fa / fb), 2) + ' semitonos');
    });
  });

  /* ======================================================================
     19.3 Eco Doppler
     ====================================================================== */
  EM.defineSim('doppler-echo', function (sim) {
    const cv = sim.canvas({ aspect: 2.6 });
    const APP = {
      eco: { n: 'Ecografía Doppler (sangre)', f: 5e6, v: 1540, u: [0.01, 2, 0.5], unit: 'm/s' },
      radar: { n: 'Radar de tránsito (24 GHz)', f: 24e9, v: 3e8, u: [1, 80, 27.8], unit: 'm/s' },
      sonar: { n: 'Sonar de un barco (50 kHz)', f: 5e4, v: 1500, u: [0.1, 15, 5], unit: 'm/s' },
      bat: { n: 'Murciélago (45 kHz)', f: 4.5e4, v: 343, u: [0.5, 15, 5], unit: 'm/s' }
    };
    sim.select('app', { label: 'Aplicación', options: Object.keys(APP).map((k) => [k, APP[k].n]), value: 'eco', onInput: () => { const A = APP[sim.p.app]; sim.ctl.u.range(A.u[0], A.u[1]); sim.ctl.u.set(A.u[2]); } });
    sim.slider('u', { label: 'Velocidad del blanco', min: 0.01, max: 2, step: 0.01, value: 0.5, unit: 'm/s', fmt: (v) => EM.fix(v, 2) });
    sim.slider('th', { label: 'Ángulo entre el haz y el movimiento', min: 0, max: 89, step: 1, value: 60, unit: '°', fmt: (v) => v.toFixed(0) });
    sim.out('df', 'Desplazamiento Δ<i>f</i>', { hl: true });
    sim.out('rel', 'Δ<i>f</i>/<i>f</i>');
    sim.out('kmh', 'Velocidad');
    let t = 0;
    sim.animate((dt) => { t += dt; });
    sim.onDraw(() => {
      const p = sim.p, A = APP[p.app];
      const df = (2 * p.u * Math.cos(M.rad(p.th)) * A.f) / A.v;
      const ctx = cv.ctx, W = cv.w, H = cv.h;
      EM.draw.clear(cv);
      const sx = 40, sy = H * 0.5;
      ctx.fillStyle = EM.col('--ink-2'); ctx.fillRect(sx - 20, sy - 14, 20, 28);
      const tx = W * 0.65, ty = H * 0.5;
      const a = M.rad(p.th);
      /* haz */
      ctx.strokeStyle = EM.alpha('--c1', 0.5); ctx.lineWidth = 1.4;
      for (let k = 0; k < 10; k++) { const s = ((t * 0.8 + k / 10) % 1) * (tx - sx); ctx.beginPath(); ctx.arc(sx + s, sy, 10, -0.5, 0.5); ctx.stroke(); }
      /* blanco que se mueve formando el ángulo θ con el haz (hacia el emisor) */
      const ph = (t * 0.4) % 1;
      const bx = tx + 90 * Math.cos(a) * (0.5 - ph), by = ty + 90 * Math.sin(a) * (0.5 - ph);
      ctx.strokeStyle = EM.col('--grid-2'); ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(tx + 60 * Math.cos(a), ty + 60 * Math.sin(a)); ctx.lineTo(tx - 60 * Math.cos(a), ty - 60 * Math.sin(a)); ctx.stroke(); ctx.setLineDash([]);
      EM.draw.bob(ctx, bx, by, 10, { color: '--c2' });
      EM.draw.arrow(ctx, bx, by, bx - 34 * Math.cos(a), by - 34 * Math.sin(a), { color: '--c2', width: 2 });
      EM.text(ctx, 'θ = ' + p.th + '°', tx + 16, ty - 18, { size: 12, color: '--ink-2' });
      sim.set('df', EM.si(df, 'Hz'));
      sim.set('rel', EM.sci(df / A.f, 3));
      sim.set('kmh', EM.fix(p.u * 3.6, 2) + ' km/h');
    });
  });

  /* ======================================================================
     19.4 Cono de Mach
     ====================================================================== */
  EM.defineSim('mach-cone', function (sim) {
    const cv = sim.canvas({ aspect: 2.2 });
    sim.slider('Ma', { label: 'Número de Mach', min: 0.5, max: 4, step: 0.01, value: 2, fmt: f2, onInput: () => restart() });
    sim.slider('h', { label: 'Altura de vuelo', min: 1, max: 15, step: 0.5, value: 9, unit: 'km', fmt: (v) => EM.fix(v, 1) });
    sim.resetButton(() => restart());
    sim.out('a', 'Semiángulo del cono <i>α</i>', { hl: true });
    sim.out('dt', 'Estampido tras pasar sobre el observador');
    sim.out('dx', 'Distancia recorrida en ese tiempo');
    let fronts, t, x;
    const restart = () => { fronts = []; t = 0; x = -10; };
    restart();
    sim.animate((dt) => {
      const s = 1.2, T = 0.35;
      const tn = t + dt * s;
      for (let k = Math.ceil(t / T); k * T < tn; k++) fronts.push([x + sim.p.Ma * (k * T - t), k * T]);
      x += sim.p.Ma * dt * s;
      t = tn;
      fronts = fronts.filter((q) => t - q[1] < 25);
      if (x > 14) restart();
    });
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, W = cv.w, H = cv.h;
      EM.draw.clear(cv);
      const sc = W / 26, cx = W / 2, cy = H * 0.35, gy = H - 18;
      ctx.fillStyle = EM.alpha('--c3', 0.15); ctx.fillRect(0, gy, W, 18);
      ctx.lineWidth = 1.2;
      fronts.forEach(([x0, te]) => { ctx.strokeStyle = EM.alpha('--c1', 0.45); ctx.beginPath(); ctx.arc(cx + x0 * sc, cy, (t - te) * sc, 0, 2 * Math.PI); ctx.stroke(); });
      if (p.Ma > 1) {
        const a = Math.asin(1 / p.Ma), L = W * 1.5;
        ctx.strokeStyle = EM.col('--c2'); ctx.lineWidth = 2.6;
        ctx.beginPath(); ctx.moveTo(cx + x * sc, cy); ctx.lineTo(cx + x * sc - L * Math.cos(a), cy - L * Math.sin(a)); ctx.moveTo(cx + x * sc, cy); ctx.lineTo(cx + x * sc - L * Math.cos(a), cy + L * Math.sin(a)); ctx.stroke();
        /* punto del suelo alcanzado por el choque */
        const gx = cx + x * sc - (gy - cy) / Math.tan(a);
        ctx.fillStyle = EM.col('--c2'); ctx.beginPath(); ctx.arc(gx, gy, 6, 0, 7); ctx.fill();
        EM.text(ctx, '¡bum!', gx, gy - 10, { size: 12, color: '--c2', align: 'center', weight: 700, halo: true });
      }
      ctx.save(); ctx.translate(cx + x * sc, cy);
      ctx.fillStyle = EM.col('--ink'); ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-12, -5); ctx.lineTo(-12, 5); ctx.closePath(); ctx.fill();
      ctx.restore();
      const v = 300;
      if (p.Ma > 1) {
        const a = Math.asin(1 / p.Ma), d = (p.h * 1000) / Math.tan(a);
        sim.set('a', EM.fix(M.deg(a), 1) + '°');
        sim.set('dt', EM.fix(d / (p.Ma * v), 1) + ' s (con v = 300 m/s)');
        sim.set('dx', EM.fix(d / 1000, 2) + ' km');
      } else { sim.set('a', '— (subsónico)'); sim.set('dt', 'no hay estampido'); sim.set('dx', '—'); }
    });
  });
})();

/* ==== chapters/20-ondas-2d.js ==== */
/* Capítulo 20 — Ondas en dos y tres dimensiones */
(function () {
  'use strict';
  const EM = window.EM, M = EM.M;
  const f2 = (v) => EM.fix(v, 2);

  /* ======================================================================
     20.1 Cubeta de ondas
     ====================================================================== */
  EM.defineSim('ripple-tank', function (sim) {
    const cv = sim.canvas({ aspect: 1.55 });
    const B = 18, NXi = 220, NYi = 142, NX = NXi + 2 * B, NY = NYi + 2 * B;
    sim.select('mode', { label: 'Experimento', options: [['drops', 'Gotas (clic)'], ['point', 'Fuente puntual'], ['two', 'Dos fuentes en fase'], ['plane', 'Onda plana'], ['slit', 'Onda plana y rendija'], ['double', 'Onda plana y doble rendija'], ['parab', 'Reflector parabólico'], ['wall', 'Reflexión en una pared']], value: 'two', onInput: () => build() });
    sim.slider('lam', { label: 'Longitud de onda (celdas)', min: 8, max: 40, step: 1, value: 16, fmt: (v) => v.toFixed(0), onInput: () => build() });
    sim.slider('sep', { label: 'Separación de fuentes o rendijas (en λ)', min: 0.5, max: 5, step: 0.1, value: 2.5, fmt: (v) => EM.fix(v, 1), onInput: () => build() });
    sim.slider('spf', { label: 'Pasos por cuadro', min: 1, max: 6, step: 1, value: 3, fmt: (v) => v.toFixed(0) });
    sim.check('en', { label: 'Mostrar intensidad promedio', value: false });
    sim.resetButton(() => build());
    sim.hint('Clic: dejar caer una gota', cv);
    let F, avg, t;
    const build = () => {
      F = new EM.Wave2D(NX, NY, { border: B, courant: 0.5 });
      avg = new Float32Array(NX * NY);
      t = 0;
      const p = sim.p, lam = p.lam, mid = NY >> 1;
      if (p.mode === 'slit' || p.mode === 'double') {
        const ix = B + Math.round(NXi * 0.3), gap = Math.round(lam * (p.mode === 'slit' ? 1.5 : 0.5)), sep = Math.round(lam * p.sep);
        for (let j = 0; j < NY; j++) for (let d = 0; d < 3; d++) {
          const y = j - mid;
          const open = p.mode === 'slit' ? Math.abs(y) <= gap / 2 : Math.abs(y - sep / 2) <= gap / 2 || Math.abs(y + sep / 2) <= gap / 2;
          if (!open) F.mask[j * NX + ix + d] = 1;
        }
      } else if (p.mode === 'parab') {
        const fx = B + NXi * 0.45, xv = B + NXi * 0.85, f = xv - fx;
        for (let j = B; j < NY - B; j++) { const y = j - mid, x = Math.round(xv - (y * y) / (4 * f)); for (let d = 0; d < 3; d++) if (x + d < NX - B) F.mask[j * NX + x + d] = 1; }
      } else if (p.mode === 'wall') {
        for (let j = 0; j < NY; j++) for (let d = 0; d < 3; d++) { const x = Math.round(B + NXi * 0.75 + (j - mid) * 0.5) + d; if (x > 0 && x < NX) F.mask[j * NX + x] = 1; }
      }
    };
    build();
    let view = null;
    EM.pointer(cv, {
      down: (x, y) => { const i = Math.round(B + (x / cv.w) * NXi), j = Math.round(B + (y / cv.h) * NYi); for (let a = -2; a <= 2; a++) for (let b = -2; b <= 2; b++) F.add(i + a, j + b, 2.5 * Math.exp(-(a * a + b * b) / 2)); return null; },
      hover: () => 'crosshair'
    });
    void view;
    sim.animate(() => {
      const p = sim.p, w = (2 * Math.PI * 0.5) / p.lam, mid = NY >> 1;
      for (let s = 0; s < p.spf; s++) {
        const ramp = Math.min(1, t / 60), src = Math.sin(w * t) * ramp;
        if (p.mode === 'point') F.add(B + Math.round(NXi * 0.3), mid, src);
        else if (p.mode === 'two' || p.mode === 'wall') {
          if (p.mode === 'wall') F.add(B + Math.round(NXi * 0.35), mid, src);
          else { const d = Math.round((p.lam * p.sep) / 2); F.add(B + Math.round(NXi * 0.25), mid - d, src); F.add(B + Math.round(NXi * 0.25), mid + d, src); }
        } else if (p.mode !== 'drops') for (let j = 1; j < NY - 1; j++) F.u[j * NX + B + 3] = 0.35 * src;
        F.step();
        t += 1;
        if (p.en) for (let k = 0; k < avg.length; k++) avg[k] += 0.004 * (F.u[k] * F.u[k] - avg[k]);
      }
    });
    sim.onDraw(() => {
      const p = sim.p;
      EM.draw.clear(cv);
      if (p.en) F.render(cv, { data: avg, energy: true, scale: p.mode === 'point' || p.mode === 'two' || p.mode === 'wall' ? 2.2 : 6 });
      else F.render(cv, { scale: p.mode === 'drops' ? 2.2 : p.mode === 'point' || p.mode === 'two' || p.mode === 'wall' ? 1.6 : 2.6 });
    });
  });

  /* ======================================================================
     20.2 Refracción de olas

  /* Pinta un campo escalar sobre un lienzo con el mapa divergente (resolución n × m) */
  function paintField(cv, n, m, f, o = {}) {
    if (!cv._off || cv._off.width !== n || cv._off.height !== m) { cv._off = document.createElement('canvas'); cv._off.width = n; cv._off.height = m; cv._img = cv._off.getContext('2d').createImageData(n, m); }
    const d = cv._img.data, bg = EM.rgb('--canvas');
    for (let j = 0; j < m; j++) for (let i = 0; i < n; i++) {
      const v = f(i / (n - 1), j / (m - 1));
      const c = v === null ? bg : EM.cmap.diverging(v);
      const k = 4 * (j * n + i);
      d[k] = c[0]; d[k + 1] = c[1]; d[k + 2] = c[2]; d[k + 3] = 255;
    }
    cv._off.getContext('2d').putImageData(cv._img, 0, 0);
    const ctx = cv.ctx;
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(cv._off, o.x || 0, o.y || 0, o.w || cv.w, o.h || cv.h);
  }
  EM.paintField = paintField;

(function () {

  /* Color percibido de un espectro de reflectancia R(λ) bajo luz blanca */
  function whiteColor(R) {
    let r = 0, g = 0, b = 0, n = 0;
    for (let nm = 400; nm <= 700; nm += 5) {
      const c = EM.wavelengthRGB(nm), w = R(nm);
      r += c[0] * w; g += c[1] * w; b += c[2] * w; n++;

    if (!whiteColor.ref) { let a = 0, bb = 0, cc = 0; for (let nm = 400; nm <= 700; nm += 5) { const c = EM.wavelengthRGB(nm); a += c[0]; bb += c[1]; cc += c[2]; } whiteColor.ref = [a, bb, cc]; }
    const ref = whiteColor.ref;
    return [M.clamp((255 * r) / ref[0], 0, 255), M.clamp((255 * g) / ref[1], 0, 255), M.clamp((255 * b) / ref[2], 0, 255)];
  }
  EM.whiteColor = whiteColor;

  /* ======================================================================
     21.1 Dos fuentes
     ====================================================================== */
  EM.defineSim('two-source', function (sim) {
    const cv = sim.canvas({ aspect: 1.6 });

    sim.slider('ph', { label: 'Desfase entre fuentes <i>δ</i><sub>0</sub>', min: 0, max: 360, step: 5, value: 0, unit: '°', fmt: (v) => v.toFixed(0) });
    sim.seg('view', { label: 'Mostrar', options: [['inst', 'Onda instantánea'], ['I', 'Intensidad promedio']], value: 'inst' });
    sim.check('lines', { label: 'Líneas nodales teóricas', value: true });
    sim.out('n', 'Líneas nodales', { hl: true });
    sim.out('dir', 'Direcciones de máximos (lejos)');
    let t = 0;
    sim.animate((dt) => { t += dt; });
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, W = cv.w, H = cv.h;
      EM.draw.clear(cv);
      const lamPx = Math.min(W, H) / 9, k = (2 * Math.PI) / lamPx, d0 = M.rad(p.ph);
      const s1 = [W * 0.15, H / 2 - (p.d * lamPx) / 2], s2 = [W * 0.15, H / 2 + (p.d * lamPx) / 2];
      const wt = 2 * Math.PI * 0.8 * t;
      EM.paintField(cv, 200, 125, (u, v) => {
        const x = u * W, y = v * H;
        const r1 = Math.max(4, Math.hypot(x - s1[0], y - s1[1])), r2 = Math.max(4, Math.hypot(x - s2[0], y - s2[1]));
        if (p.view === 'I') { const dd = k * (r2 - r1) + d0; return 2 * Math.cos(dd / 2) ** 2 - 1; }
        return 0.5 * (Math.cos(k * r1 - wt) + Math.cos(k * r2 - wt + d0)) * Math.min(1, 6 / Math.sqrt(Math.min(r1, r2) / lamPx + 0.5));
      });
      if (p.lines) {
        ctx.strokeStyle = EM.alpha('--ink', 0.55); ctx.lineWidth = 1;
        for (let m = -12; m <= 12; m++) {
          const D = ((m + 0.5) * 2 * Math.PI - d0) / k; /* r2 − r1 = D */
          if (Math.abs(D) >= p.d * lamPx) continue;
          ctx.beginPath();
          let pen = false;
          for (let yy = -H; yy <= 2 * H; yy += 3) {
            /* resolver x a lo largo de la hipérbola: r2 − r1 = D */
            const f = (x) => Math.hypot(x - s2[0], yy - s2[1]) - Math.hypot(x - s1[0], yy - s1[1]) - D;
            const xa = s1[0], xb = s1[0] + 3 * W;
            if (f(xa) * f(xb) > 0) { pen = false; continue; }
            const x = M.bisect(f, xa, xb, 0.3, 40);
            if (!pen) { ctx.moveTo(x, yy); pen = true; } else ctx.lineTo(x, yy);
          }
          ctx.stroke();
        }
      }
      EM.draw.bob(ctx, s1[0], s1[1], 6, { color: '--ink' });
      EM.draw.bob(ctx, s2[0], s2[1], 6, { color: '--ink' });
      let n = 0;
      for (let m = -20; m <= 20; m++) { const D = (m + 0.5) * 2 * Math.PI - d0; if (Math.abs(D / (2 * Math.PI)) < p.d) n++; }
      const dirs = [];
      for (let m = -6; m <= 6; m++) { const s = (m - p.ph / 360) / p.d; if (Math.abs(s) <= 1) dirs.push(EM.fix(M.deg(Math.asin(s)), 1) + '°'); }

      sim.set('dir', dirs.join(', '));
    });
  });

    const cr = sim.canvas({ aspect: 0.8 });
    sim.seg('sys', { label: 'Sistema', options: [['soap', 'Jabón en aire'], ['coat', 'Recubrimiento sobre vidrio'], ['oil', 'Aceite sobre agua']], value: 'soap' });
    sim.slider('n', { label: 'Índice de la película <i>n</i>', min: 1.2, max: 1.6, step: 0.01, value: 1.33, fmt: f2 });
    sim.slider('t', { label: 'Espesor <i>t</i>', min: 0, max: 1500, step: 1, value: 300, unit: 'nm', fmt: (v) => v.toFixed(0) });
    sim.out('col', 'Color reflejado', { hl: true });
    sim.out('max', 'Longitudes de onda reforzadas (visible)');
    const nOut = () => ({ soap: [1, 1], coat: [1, 1.52], oil: [1, 1.33] }[sim.p.sys]);
    const R = (nm, t) => {
      const p = sim.p, [n0, n2] = nOut(), n = p.n;
      const r1 = (n0 - n) / (n0 + n), r2 = (n - n2) / (n + n2);
      const d = (4 * Math.PI * n * t) / nm;
      const re = r1 + r2 * Math.cos(d), im = r2 * Math.sin(d);
      return re * re + im * im;
    };
    sim.onDraw(() => {
      const p = sim.p;
      /* cuña de espesor creciente hacia abajo (película que drena) */
      EM.draw.clear(cw);
      const ctx = cw.ctx, W = cw.w, H = cw.h;
      const [n0, n2] = nOut(), r1 = Math.abs((n0 - p.n) / (n0 + p.n)), r2 = Math.abs((p.n - n2) / (p.n + n2));
      const norm = 1 / Math.max(1e-4, (r1 + r2) ** 2);
      for (let j = 0; j < H; j++) {
        const t = (1500 * j) / H;
        const c = whiteColor((nm) => Math.min(1, R(nm, t) * norm));
        ctx.fillStyle = EM.rgbStr(c); ctx.fillRect(10, j, W - 20, 1.5);
      }
      const yt = (p.t / 1500) * H;
      ctx.strokeStyle = EM.col('--ink'); ctx.lineWidth = 2; ctx.strokeRect(6, yt - 3, W - 12, 6);
      EM.text(ctx, 'espesor 0', 14, 14, { size: 11, color: '#fff', halo: '#000' });
      EM.text(ctx, '1500 nm', 14, H - 8, { size: 11, color: '#fff', halo: '#000' });
      EM.draw.clear(cr);
      const pl = new EM.Plot(cr.ctx, { x: 0, y: 0, w: cr.w, h: cr.h, xmin: 400, xmax: 700, ymin: 0, ymax: Math.max(0.02, 1.1 / norm), xlabel: 'λ (nm)', ylabel: 'reflectancia', ml: 52 });
      pl.frame();
      for (let nm = 400; nm < 700; nm += 3) { const c = EM.wavelengthRGB(nm); cr.ctx.fillStyle = EM.rgbStr(c, 0.25); cr.ctx.fillRect(pl.X(nm), pl.iy, pl.X(nm + 3) - pl.X(nm), pl.ih); }
      pl.fn((nm) => R(nm, p.t), { color: '--ink', width: 2.2 });
      const c = whiteColor((nm) => Math.min(1, R(nm, p.t) * norm));
      cr.ctx.fillStyle = EM.rgbStr(c); cr.ctx.fillRect(pl.ix + pl.iw - 50, pl.iy + 6, 44, 30);
      cr.ctx.strokeStyle = EM.col('--ink'); cr.ctx.strokeRect(pl.ix + pl.iw - 50, pl.iy + 6, 44, 30);
      const mx = [];
      for (let nm = 401; nm < 700; nm++) if (R(nm, p.t) > R(nm - 1, p.t) && R(nm, p.t) >= R(nm + 1, p.t)) mx.push(nm);
      sim.set('col', '<span style="color:' + EM.rgbStr(c) + ';font-size:18px">■</span> ' + (p.t < 60 && p.sys === 'soap' ? 'negro (película muy delgada)' : ''));
      sim.set('max', mx.length ? mx.join(', ') + ' nm' : 'ninguna');
    });
  });

  /* ======================================================================
     21.5 Anillos de Newton
     ====================================================================== */
  EM.defineSim('newton-rings', function (sim) {
    sim.cols2();
    const cv = sim.canvas({ aspect: 1 });
    const cp = sim.canvas({ aspect: 1 });
    sim.slider('R', { label: 'Radio de curvatura de la lente <i>R</i>', min: 0.5, max: 10, step: 0.1, value: 3, unit: 'm', fmt: (v) => EM.fix(v, 1) });
    sim.slider('lam', { label: 'Longitud de onda', min: 400, max: 700, step: 1, value: 589, unit: 'nm', fmt: (v) => v.toFixed(0) });
    sim.slider('n', { label: 'Índice del medio entre lente y vidrio', min: 1, max: 1.6, step: 0.01, value: 1, fmt: f2 });
    sim.check('white', { label: 'Luz blanca', value: false });
    sim.out('r', 'Radios de los anillos oscuros 1–5', { hl: true });
    const rmax = () => Math.sqrt((12 * 589e-9 * sim.p.R) / sim.p.n);
    const Iref = (r, nm) => { const t = (r * r) / (2 * sim.p.R); return Math.sin((2 * Math.PI * sim.p.n * t) / (nm * 1e-9)) ** 2; };
    sim.onDraw(() => {
      const p = sim.p, rm = rmax();
      EM.draw.clear(cv);
      const W = cv.w, H = cv.h, Rp = Math.min(W, H) / 2 - 4;
      const ctx = cv.ctx, img = ctx.createImageData(Math.round(2 * Rp), Math.round(2 * Rp));
      const N = img.width;
      const cache = new Map();
      for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
        const x = (i / N - 0.5) * 2, y = (j / N - 0.5) * 2, rr = Math.hypot(x, y);
        const k = 4 * (j * N + i);
        if (rr > 1) { img.data[k + 3] = 0; continue; }
        const key = Math.round(rr * 400);
        let c = cache.get(key);
        if (!c) { const r = (key / 400) * rm; if (p.white) c = whiteColor((nm) => Iref(r, nm)); else { const v = Iref(r, p.lam), q = EM.wavelengthRGB(p.lam); c = [q[0] * v, q[1] * v, q[2] * v]; } cache.set(key, c); }
        img.data[k] = c[0]; img.data[k + 1] = c[1]; img.data[k + 2] = c[2]; img.data[k + 3] = 255;
      }
      const sx = Math.round(W / 2 - Rp), sy = Math.round(H / 2 - Rp);
      ctx.putImageData(img, sx, sy);
      EM.draw.clear(cp);
      const pl = new EM.Plot(cp.ctx, { x: 0, y: 0, w: cp.w, h: cp.h, xmin: 0, xmax: rm * 1000, ymin: 0, ymax: 1.1, xlabel: 'r (mm)', ylabel: 'intensidad reflejada', ml: 52 });
      pl.frame();
      pl.fn((rmm) => Iref(rmm / 1000, p.lam), { color: p.white ? '--ink' : EM.rgbStr(EM.wavelengthRGB(p.lam)), width: 2, n: 800 });
      const rs = [];
      for (let m = 1; m <= 5; m++) rs.push(EM.fix(1000 * Math.sqrt((m * p.lam * 1e-9 * p.R) / p.n), 2));
      sim.set('r', rs.join(', ') + ' mm');
    });
  });

  /* ======================================================================
     21.6 Interferómetro de Michelson
     ====================================================================== */
  EM.defineSim('michelson', function (sim) {
    sim.cols2();
    const cs = sim.canvas({ aspect: 1 });
    const cf = sim.canvas({ aspect: 1 });
    sim.slider('lam', { label: 'Longitud de onda', min: 400, max: 700, step: 1, value: 633, unit: 'nm', fmt: (v) => v.toFixed(0) });
    sim.slider('x', { label: 'Desplazamiento del espejo móvil', min: 0, max: 5, step: 0.001, value: 0, unit: 'µm', fmt: (v) => EM.fix(v, 3) });
    sim.slider('d0', { label: 'Diferencia de brazos inicial', min: 0.02, max: 1, step: 0.01, value: 0.3, unit: 'mm', fmt: f2 });
    sim.button('Mover el espejo', () => { moving = !moving; });
    sim.out('N', 'Franjas que pasaron 2Δ<i>x</i>/<i>λ</i>', { hl: true });
    sim.out('c', 'Intensidad en el centro');
    let moving = false;
    sim.animate((dt) => { if (moving) { let v = sim.p.x + dt * 0.25; if (v > 5) { v = 0; } sim.ctl.x.set(v, true); } });
    sim.onDraw(() => {
      const p = sim.p, lam = p.lam * 1e-9, d = p.d0 * 1e-3 + p.x * 1e-6;
      const ctx = cs.ctx, W = cs.w, H = cs.h;
      EM.draw.clear(cs);
      const cx = W * 0.45, cy = H * 0.55, col = EM.rgbStr(EM.wavelengthRGB(p.lam));
      /* esquema */
      ctx.strokeStyle = col; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(14, cy); ctx.lineTo(cx, cy); ctx.lineTo(W - 30 + p.x * 4, cy); ctx.moveTo(cx, cy); ctx.lineTo(cx, 26); ctx.moveTo(cx, cy); ctx.lineTo(cx, H - 20); ctx.stroke();
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.PI / 4); ctx.fillStyle = EM.alpha('--c1', 0.5); ctx.fillRect(-26, -3, 52, 6); ctx.restore();
      ctx.fillStyle = EM.col('--ink-2'); ctx.fillRect(cx - 24, 18, 48, 7);
      ctx.fillStyle = EM.col('--accent'); ctx.fillRect(W - 30 + p.x * 4, cy - 24, 7, 48);
      ctx.fillStyle = EM.col('--ink'); ctx.fillRect(cx - 14, H - 18, 28, 10);
      EM.text(ctx, 'láser', 14, cy - 10, { size: 11, color: '--ink-2' });
      EM.text(ctx, 'espejo móvil', W - 40, cy + 40, { size: 11, color: '--accent', align: 'center' });
      EM.text(ctx, 'espejo fijo', cx + 30, 26, { size: 11, color: '--ink-2' });
      EM.text(ctx, 'pantalla', cx + 20, H - 10, { size: 11, color: '--ink-2' });
      /* franjas circulares: I ∝ cos²(2π d cos θ / λ) */
      EM.draw.clear(cf);
      const W2 = cf.w, H2 = cf.h, R = Math.min(W2, H2) / 2 - 4, img = cf.ctx.createImageData(Math.round(2 * R), Math.round(2 * R)), N = img.width;
      const thMax = 0.1, q = EM.wavelengthRGB(p.lam);
      for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
        const x = (i / N - 0.5) * 2, y = (j / N - 0.5) * 2, rr = Math.hypot(x, y), k = 4 * (j * N + i);
        if (rr > 1) continue;
        const th = rr * thMax, v = Math.cos((2 * Math.PI * d * Math.cos(th)) / lam) ** 2;
        img.data[k] = q[0] * v; img.data[k + 1] = q[1] * v; img.data[k + 2] = q[2] * v; img.data[k + 3] = 255;
      }
      cf.ctx.putImageData(img, Math.round(W2 / 2 - R), Math.round(H2 / 2 - R));
      sim.set('N', EM.fix((2 * p.x * 1e-6) / lam, 2));
      sim.set('c', EM.fix(Math.cos((2 * Math.PI * d) / lam) ** 2, 3));
    });
  });
})();

/* ==== chapters/22-difraccion.js ==== */
/* Capítulo 22 — Difracción */
(function () {
  'use strict';
  const EM = window.EM, M = EM.M;
  const f2 = (v) => EM.fix(v, 2);
  const colorOf = (nm) => EM.rgbStr(EM.wavelengthRGB(nm));

  /* Franja de pantalla coloreada con intensidad I(x), x ∈ [−1, 1] */
  function screenStrip(cv, nm, I, o = {}) {
    const ctx = cv.ctx, W = cv.w, H = o.h || cv.h, y0 = o.y || 0;
    const q = EM.wavelengthRGB(nm);
    for (let i = 0; i < W; i++) { const v = Math.min(1, I((2 * i) / W - 1) * (o.gain || 1)); ctx.fillStyle = `rgb(${q[0] * v},${q[1] * v},${q[2] * v})`; ctx.fillRect(i, y0, 1.5, H); }
  }
  EM.screenStrip = screenStrip;

  /* ======================================================================
     22.1 Rendija simple y arco de fasores
     ====================================================================== */
  EM.defineSim('single-slit', function (sim) {
    sim.cols2();
    const cs = sim.canvas({ aspect: 5, cls: 'full fixed' });
    const cp = sim.canvas({ aspect: 1.1 });
    const cf = sim.canvas({ aspect: 1.1 });
    sim.slider('a', { label: 'Ancho de la rendija <i>a</i>/<i>λ</i>', min: 0.5, max: 12, step: 0.05, value: 4, fmt: f2 });
    sim.slider('th', { label: 'Ángulo de observación <i>θ</i>', min: -60, max: 60, step: 0.1, value: 10, unit: '°', fmt: (v) => EM.fix(v, 1) });
    sim.slider('lam', { label: 'Color (para la pantalla)', min: 400, max: 700, step: 1, value: 532, unit: 'nm', fmt: (v) => v.toFixed(0) });
    sim.seg('scale', { label: 'Escala', options: [['lin', 'Lineal'], ['log', 'Log']], value: 'lin' });
    sim.out('b', '<i>β</i> = <i>πa</i> sen<i>θ</i>/<i>λ</i>', { hl: true });
    sim.out('I', '<i>I</i>/<i>I</i><sub>0</sub>');
    sim.out('m1', 'Primer mínimo');
    const I = (thd) => { const b = Math.PI * sim.p.a * Math.sin(M.rad(thd)); return EM.sinc(b) ** 2; };
    sim.onDraw(() => {
      const p = sim.p;
      EM.draw.clear(cs);
      screenStrip(cs, p.lam, (u) => I(u * 60), { gain: 1.4 });
      cs.ctx.strokeStyle = '#fff'; cs.ctx.lineWidth = 2; const xm = ((p.th / 60 + 1) / 2) * cs.w;
      cs.ctx.beginPath(); cs.ctx.moveTo(xm, 0); cs.ctx.lineTo(xm, 8); cs.ctx.moveTo(xm, cs.h - 8); cs.ctx.lineTo(xm, cs.h); cs.ctx.stroke();
      EM.draw.clear(cp);
      const log = p.scale === 'log';
      const pl = new EM.Plot(cp.ctx, { x: 0, y: 0, w: cp.w, h: cp.h, xmin: -60, xmax: 60, ymin: log ? 1e-4 : 0, ymax: log ? 1.5 : 1.08, ylog: log, xlabel: 'θ (°)', ylabel: 'I / I₀', ml: 52 });
      pl.frame();
      pl.fn(I, { color: colorOf(p.lam), width: 2.2, n: 1200 });
      pl.dot(p.th, Math.max(I(p.th), log ? 1.2e-4 : 0), { color: '--accent', r: 6 });
      /* arco de fasores: N fasores cuyo desfase total es 2β */
      EM.draw.clear(cf);
      const ctx = cf.ctx, W = cf.w, H = cf.h, N = 40;
      const b = Math.PI * p.a * Math.sin(M.rad(p.th));
      const L = (Math.min(W, H) * 0.7) / N;
      let x = 0, y = 0;
      const pts = [[0, 0]];
      for (let n = 0; n < N; n++) { const ph = -b + (2 * b * (n + 0.5)) / N; x += L * Math.cos(ph); y += L * Math.sin(ph); pts.push([x, y]); }
      const xs = pts.map((q) => q[0]), ys = pts.map((q) => q[1]);
      const ox = W / 2 - (Math.min(...xs) + Math.max(...xs)) / 2, oy = H / 2 + (Math.min(...ys) + Math.max(...ys)) / 2;
      for (let n = 0; n < N; n++) EM.draw.arrow(ctx, ox + pts[n][0], oy - pts[n][1], ox + pts[n + 1][0], oy - pts[n + 1][1], { color: EM.mix('--c1', '--c5', n / N), width: 1.4, head: 4 });
      EM.draw.arrow(ctx, ox, oy, ox + x, oy - y, { color: '--accent', width: 3 });
      EM.text(ctx, 'fasores de 40 franjas de la rendija', 10, H - 10, { size: 11, color: '--ink-3' });
      sim.set('b', EM.fix(b, 3) + ' rad');
      sim.set('I', EM.fix(I(p.th), 4));
      sim.set('m1', p.a >= 1 ? '±' + EM.fix(M.deg(Math.asin(1 / p.a)), 2) + '°' : 'no hay (a < λ)');
    });
  });

  /* ======================================================================
     22.2 Fresnel → Fraunhofer
     ====================================================================== */
  EM.defineSim('fresnel-slit', function (sim) {
    const cs = sim.canvas({ aspect: 5, cls: 'fixed' });
    const cp = sim.canvas({ aspect: 2.5 });
    sim.slider('NF', { label: 'Número de Fresnel <i>a</i>²/<i>λz</i>', min: 0.05, max: 60, value: 6, log: true, step: 0.01, fmt: f2 });
    sim.slider('lam', { label: 'Color', min: 400, max: 700, step: 1, value: 633, unit: 'nm', fmt: (v) => v.toFixed(0) });
    sim.out('reg', 'Régimen', { hl: true });
    sim.out('z', 'Distancia para <i>a</i> = 0.5 mm');
    let cache = null;
    /* campo en x (en unidades de a) a distancia z: ∫ e^{iπ(x − x′)²/(λz)} dx′, con a = 1 → fase π NF (x − x′)² */
    const field = (NF) => {
      const n = 500, xs = [], Is = [];
      const span = Math.max(1.5, 3 / Math.sqrt(NF) + 0.8, 2.5 / NF);
      for (let i = 0; i <= n; i++) {
        const x = -span + (2 * span * i) / n;
        let re = 0, im = 0;
        const K = 600;
        for (let k = 0; k < K; k++) { const xp = -0.5 + (k + 0.5) / K, ph = Math.PI * NF * (x - xp) ** 2; re += Math.cos(ph); im += Math.sin(ph); }
        re /= K; im /= K;
        xs.push(x); Is.push((re * re + im * im) * 2 * NF);
      }
      return { xs, Is, span };
    };
    sim.onDraw(() => {
      const p = sim.p;
      if (!cache || cache.NF !== p.NF) cache = Object.assign({ NF: p.NF }, field(p.NF));
      const C = cache, mx = Math.max(...C.Is);
      EM.draw.clear(cs);
      screenStrip(cs, p.lam, (u) => { const x = u * C.span, i = Math.round(((x + C.span) / (2 * C.span)) * (C.xs.length - 1)); return C.Is[M.clamp(i, 0, C.Is.length - 1)] / mx; }, { gain: 1.2 });
      EM.draw.clear(cp);
      const pl = new EM.Plot(cp.ctx, { x: 0, y: 0, w: cp.w, h: cp.h, xmin: -C.span, xmax: C.span, ymin: 0, ymax: 1.1, xlabel: 'posición en la pantalla / a', ylabel: 'I (normalizada)', ml: 52 });
      pl.frame();
      pl.band(-0.5, 0.5, { color: '--ink-3', alpha: 0.08 });
      pl.xy(C.xs, C.Is.map((v) => v / mx), { color: colorOf(p.lam), width: 2 });
      pl.label(-0.45, 1.03, 'sombra geométrica', { size: 11, color: '--ink-3' });
      sim.set('reg', p.NF > 5 ? 'Fresnel: casi la sombra geométrica, con franjas en los bordes' : p.NF < 0.3 ? 'Fraunhofer: patrón sinc² del campo lejano' : 'transición');
      sim.set('z', EM.si((0.5e-3) ** 2 / (p.lam * 1e-9 * p.NF), 'm'));
    });
  });

  /* ======================================================================
     22.3 Red de difracción
     ====================================================================== */
  EM.defineSim('grating', function (sim) {
    const cs = sim.canvas({ aspect: 5, cls: 'fixed' });
    const cp = sim.canvas({ aspect: 2.4 });
    sim.slider('N', { label: 'Número de rendijas <i>N</i>', min: 1, max: 2000, value: 6, log: true, step: 1, fmt: (v) => v.toFixed(0) });
    sim.slider('d', { label: 'Separación <i>d</i>', min: 1, max: 10, step: 0.05, value: 2, unit: 'µm', fmt: f2 });
    sim.slider('a', { label: 'Ancho de cada rendija <i>a</i>', min: 0.2, max: 5, step: 0.05, value: 0.6, unit: 'µm', fmt: f2 });
    sim.slider('lam', { label: 'Longitud de onda', min: 400, max: 700, step: 0.1, value: 589, unit: 'nm', fmt: (v) => EM.fix(v, 1) });
    sim.check('na', { label: 'Doblete del sodio (589.0 y 589.6 nm)', value: false });
    sim.seg('zoom', { label: 'Vista', options: [['all', 'Todos los órdenes'], [1, 'Zoom orden 1'], [2, 'Zoom orden 2']], value: 'all' });
    sim.out('R', 'Poder de resolución <i>mN</i>', { hl: true });
    sim.out('th', 'Ángulos de los órdenes');
    sim.out('res', 'Doblete del sodio');
    const I = (s, nm) => { const p = sim.p, lam = nm * 1e-3; const b = (Math.PI * p.a * s) / lam, al = (Math.PI * p.d * s) / lam; const sn = Math.sin(al); const g = Math.abs(sn) < 1e-9 ? 1 : Math.sin(p.N * al) / (p.N * sn); return EM.sinc(b) ** 2 * g * g; };
    sim.onDraw(() => {
      const p = sim.p;
      const lams = p.na ? [589.0, 589.6] : [p.lam];
      let s0 = -1, s1 = 1;
      if (p.zoom !== 'all') { const m = +p.zoom, sc = (m * 589.3e-3) / p.d; if (sc < 1) { const w = Math.max(2.5e-4 * m, (4 * m * 589.3e-3) / (p.d * Math.max(p.N, 1) * m) * 1.2); s0 = sc - w; s1 = sc + w; } }
      const Itot = (s) => lams.reduce((acc, nm) => acc + I(s, nm), 0) / lams.length;
      EM.draw.clear(cs);
      const ctx = cs.ctx, W = cs.w, H = cs.h;
      lams.forEach((nm, k) => screenStrip(cs, nm, (u) => I(s0 + ((u + 1) / 2) * (s1 - s0), nm), { gain: 1.2, y: (k * H) / lams.length, h: H / lams.length }));
      void ctx; void W;
      EM.draw.clear(cp);
      const pl = new EM.Plot(cp.ctx, { x: 0, y: 0, w: cp.w, h: cp.h, xmin: s0, xmax: s1, ymin: 0, ymax: 1.08, xlabel: 'sen θ', ylabel: 'I / I_{máx}', ml: 52 });
      pl.frame();
      if (p.zoom === 'all') pl.fn((s) => EM.sinc((Math.PI * p.a * s) / (p.lam * 1e-3)) ** 2, { color: '--ink-3', width: 1.2, dash: [5, 4], n: 800 });
      pl.fn(Itot, { color: p.na ? '--accent' : colorOf(p.lam), width: 1.8, n: 4000 });
      const ths = [];
      for (let m = 1; m <= 5; m++) { const s = (m * p.lam * 1e-3) / p.d; if (s <= 1) ths.push('m=' + m + ': ' + EM.fix(M.deg(Math.asin(s)), 2) + '°'); }
      const m = p.zoom === 'all' ? 1 : +p.zoom;
      sim.set('R', String(Math.round(m * p.N)) + ' (orden ' + m + ')');
      sim.set('th', ths.join(' · ') || 'sólo el orden 0');
      sim.set('res', m * p.N >= 982 ? 'resuelto en el orden ' + m : 'no resuelto (se necesita mN ≥ 982)');
    });
  });

  /* ======================================================================
     22.4 Criterio de Rayleigh
     ====================================================================== */
  EM.defineSim('rayleigh', function (sim) {
    sim.cols2();
    const ci = sim.canvas({ aspect: 1 });
    const cp = sim.canvas({ aspect: 1 });
    sim.slider('sep', { label: 'Separación angular / <i>θ</i><sub>Rayleigh</sub>', min: 0.2, max: 3, step: 0.01, value: 1, fmt: f2 });
    sim.slider('D', { label: 'Diámetro de la abertura <i>D</i>', min: 1, max: 10000, value: 3, log: true, step: 0.1, fmt: (v) => EM.si(v / 1000, 'm') });
    sim.slider('lam', { label: 'Longitud de onda', min: 400, max: 700, step: 1, value: 550, unit: 'nm', fmt: (v) => v.toFixed(0) });
    sim.slider('ratio', { label: 'Brillo de la segunda fuente', min: 0.1, max: 1, step: 0.05, value: 1, fmt: f2 });

      pl.frame();

      pl.fn((u) => p.ratio * airy(u * X1 - s / 2), { color: '--c2', width: 1.2, dash: [4, 4], n: 600 });

    });

/* Capítulo 23 — La luz como onda y la polarización */
(function () {
  'use strict';

  const f2 = (v) => EM.fix(v, 2);
  /* física (x, y, z) → vista: z_fís hacia la derecha, x_fís hacia arriba, y_fís hacia el observador */
  const PV = (x, y, z) => [z, -y, x];

  /* ======================================================================
     23.1 Onda electromagnética plana
     ====================================================================== */
  EM.defineSim('em-wave', function (sim) {

    sim.slider('lam', { label: 'Longitud de onda', min: 380, max: 750, step: 1, value: 550, unit: 'nm', fmt: (v) => v.toFixed(0) });
    sim.slider('I', { label: 'Intensidad', min: 1, max: 1e6, value: 1000, log: true, step: 1, unit: 'W/m²', fmt: (v) => EM.sci(v, 3) });
    sim.slider('n', { label: 'Índice del medio <i>n</i>', min: 1, max: 2.4, step: 0.01, value: 1, fmt: f2 });

    sim.out('f', 'Frecuencia <i>f</i>', { hl: true });
    sim.out('E0', 'Amplitud <i>E</i><sub>0</sub>');
    sim.out('B0', 'Amplitud <i>B</i><sub>0</sub>');
    sim.out('v', 'Velocidad y longitud de onda en el medio');
    sim.hint('Arrastra para girar', cv);
    sim.legend([{ color: '--efield', label: '<b>E</b>' }, { color: '--bfield', label: '<b>B</b>' }]);
    let ph = 0;
    sim.animate((dt) => { ph += dt * 2.2; });
    sim.onDraw(() => {
      const p = sim.p;
      v3.begin();
      const ax = [[[0, 0, 1], 'z'], [[1, 0, 0], 'x'], [[0, 1, 0], 'y']];
      ax.forEach(([d, nme]) => { const e = PV(...V.scale(d, 1.25)); v3.arrow([0, 0, 0], e, { color: '--axis', width: 1.4, head: 9 }); v3.text(V.scale(e, 1.08), nme, { size: 14, italic: true, family: EM.FONT_MATH, color: '--ink' }); });

  EM.defineSim('malus-chain', function (sim) {

        ctx.beginPath(); ctx.moveTo(-6 * Math.cos(r), 38 * Math.sin(r)); ctx.lineTo(6 * Math.cos(r), -38 * Math.sin(r)); ctx.stroke();

  /* ======================================================================
     23.4 Fresnel y Brewster
     ====================================================================== */
  EM.defineSim('fresnel-brewster', function (sim) {
    sim.cols2();
    const cr = sim.canvas({ aspect: 1.05 });
    const cp = sim.canvas({ aspect: 1.05 });
    sim.slider('n1', { label: 'Índice del medio incidente <i>n</i><sub>1</sub>', min: 1, max: 2.5, step: 0.01, value: 1, fmt: f2 });
    sim.slider('n2', { label: 'Índice del segundo medio <i>n</i><sub>2</sub>', min: 1, max: 2.5, step: 0.01, value: 1.5, fmt: f2 });

      EM.draw.clear(cp);
      const pl = new EM.Plot(cp.ctx, { x: 0, y: 0, w: cp.w, h: cp.h, xmin: 0, xmax: 90, ymin: 0, ymax: 1.02, xlabel: 'ángulo de incidencia (°)', ylabel: 'reflectancia', ml: 52, xticks: [0, 15, 30, 45, 60, 75, 90] });
      pl.frame();

      pl.fn((d) => coefs(M.rad(d))[1], { color: '--c2', width: 2.2, dash: [6, 4], n: 900 });
      const thB = M.deg(Math.atan(p.n2 / p.n1));

      sim.set('B', EM.fix(thB, 2) + '°');
