  /* ======================================================================
     23.5 Lámina birrefringente
     ====================================================================== */
  EM.defineSim('waveplate', function (sim) {
    sim.cols2();
    const ce = sim.canvas({ aspect: 1.05 });
    const cc = sim.canvas({ aspect: 1.05 });
    sim.slider('ret', { label: 'Retardo de la lámina (en longitudes de onda)', min: 0, max: 3, step: 0.01, value: 0.25, fmt: (v) => EM.fix(v, 2) + ' λ' });
    sim.slider('phi', { label: 'Eje rápido de la lámina', min: 0, max: 90, step: 1, value: 45, unit: '°', fmt: (v) => v.toFixed(0) });
    sim.slider('an', { label: 'Eje del analizador', min: 0, max: 180, step: 1, value: 90, unit: '°', fmt: (v) => v.toFixed(0) });
    sim.button('Cuarto de onda', () => sim.ctl.ret.set(0.25));
    sim.button('Media onda', () => sim.ctl.ret.set(0.5));
    sim.out('I', 'Intensidad tras el analizador (550 nm)', { hl: true });
    sim.out('st', 'Polarización tras la lámina');
    sim.note('El primer polarizador está a 0°. El color de la derecha es el que se vería con luz blanca, suponiendo el retardo dado a 550 nm (fotoelasticidad).');
    /* Jones: entrada [1, 0]; lámina con ejes rotados φ y desfase Γ; analizador a θ */
    const out = (Gam, phi, an) => {
      const c = Math.cos(phi), s = Math.sin(phi);
      /* componentes en la base de la lámina */
      const a = c, b = -s;
      /* tras la lámina: a·1, b·e^{iΓ} */
      const bx = [b * Math.cos(Gam), b * Math.sin(Gam)];
      /* de vuelta a xy */
      const Ex = [a * c - bx[0] * s, -bx[1] * s], Ey = [a * s + bx[0] * c, bx[1] * c];
      const ca = Math.cos(an), sa = Math.sin(an);
      const re = Ex[0] * ca + Ey[0] * sa, im = Ex[1] * ca + Ey[1] * sa;
      return { I: re * re + im * im, Ex, Ey };
    };
    sim.onDraw(() => {
      const p = sim.p, Gam = 2 * Math.PI * p.ret, phi = M.rad(p.phi), an = M.rad(p.an);
      const o = out(Gam, phi, an);
      EM.draw.clear(ce);
      const ctx = ce.ctx, W = ce.w, H = ce.h, cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.36;
      EM.complexAxes(ctx, cx, cy, R * 1.25, ['Eₓ', 'E_y']);
      const pts = []; for (let i = 0; i <= 120; i++) { const t = (2 * Math.PI * i) / 120; pts.push([cx + R * (o.Ex[0] * Math.cos(t) + o.Ex[1] * Math.sin(t)), cy - R * (o.Ey[0] * Math.cos(t) + o.Ey[1] * Math.sin(t))]); }
      EM.draw.poly(ctx, pts, { color: '--efield', width: 2.2 });
      ctx.strokeStyle = EM.col('--c3'); ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.moveTo(cx - R * 1.2 * Math.cos(phi), cy + R * 1.2 * Math.sin(phi)); ctx.lineTo(cx + R * 1.2 * Math.cos(phi), cy - R * 1.2 * Math.sin(phi)); ctx.stroke();
      ctx.strokeStyle = EM.col('--accent');
      ctx.beginPath(); ctx.moveTo(cx - R * 1.2 * Math.cos(an), cy + R * 1.2 * Math.sin(an)); ctx.lineTo(cx + R * 1.2 * Math.cos(an), cy - R * 1.2 * Math.sin(an)); ctx.stroke(); ctx.setLineDash([]);
      EM.text(ctx, 'eje rápido', cx + R * 1.2 * Math.cos(phi), cy - R * 1.2 * Math.sin(phi) - 6, { size: 11, color: '--c3', halo: true });
      EM.text(ctx, 'analizador', cx + R * 1.2 * Math.cos(an), cy - R * 1.2 * Math.sin(an) + 14, { size: 11, color: '--accent', halo: true });
      EM.draw.clear(cc);
      const col = EM.whiteColor((nm) => out((2 * Math.PI * p.ret * 550) / nm, phi, an).I);
      const c2 = cc.ctx;
      c2.fillStyle = EM.rgbStr(col); c2.fillRect(20, 20, cc.w - 40, cc.h - 70);
      c2.strokeStyle = EM.col('--ink-2'); c2.strokeRect(20, 20, cc.w - 40, cc.h - 70);
      EM.text(c2, 'color con luz blanca', cc.w / 2, cc.h - 28, { size: 12, color: '--ink-2', align: 'center' });
      const g = ((p.ret % 1) + 1) % 1;
      const st = Math.abs(Math.sin(Gam)) < 1e-6 || Math.abs(Math.sin(2 * phi)) < 1e-6 ? 'lineal' : Math.abs(Math.abs(Math.sin(Gam)) - 1) < 1e-6 && Math.abs(Math.abs(Math.sin(2 * phi)) - 1) < 1e-6 ? 'circular' : 'elíptica';
      void g;
      sim.set('I', EM.fix(100 * o.I, 1) + ' %');
      sim.set('st', st);
    });
  });

  /* ======================================================================
     23.6 Prisma
     ====================================================================== */
  EM.defineSim('prism', function (sim) {
    const cv = sim.canvas({ aspect: 1.8 });
    sim.slider('A', { label: 'Ángulo del prisma', min: 20, max: 70, step: 1, value: 60, unit: '°', fmt: (v) => v.toFixed(0) });
    sim.slider('th', { label: 'Ángulo de incidencia', min: 20, max: 85, step: 0.5, value: 48, unit: '°', fmt: (v) => EM.fix(v, 1) });
    sim.select('mat', { label: 'Material', options: [['bk7', 'Vidrio crown (BK7)'], ['flint', 'Vidrio flint (F2)'], ['water', 'Agua'], ['diam', 'Diamante']], value: 'flint' });
    sim.out('n', 'Índices (rojo, violeta)', { hl: true });
    sim.out('dev', 'Desviación del rojo y del violeta');
    sim.out('sp', 'Separación angular');
    /* coeficientes de Cauchy n = A + B/λ² (λ en µm) */
    const MAT = { bk7: [1.5046, 0.0042], flint: [1.5994, 0.0105], water: [1.3199, 0.0031], diam: [2.3796, 0.0137] };
    const nOf = (nm) => { const c = MAT[sim.p.mat]; return c[0] + c[1] / (nm / 1000) ** 2; };
    sim.onDraw(() => {
      const p = sim.p, A = M.rad(p.A), th = M.rad(p.th);
      const ctx = cv.ctx, W = cv.w, H = cv.h;
      EM.draw.clear(cv, EM.isDark() ? '#0b0f14' : '#151a20');
      /* prisma con vértice arriba */
      const cx = W * 0.45, base = H * 0.82, side = H * 0.75;
      const top = [cx, base - side * Math.cos(A / 2)], left = [cx - side * Math.sin(A / 2), base], right = [cx + side * Math.sin(A / 2), base];
      ctx.fillStyle = 'rgba(160,190,220,0.18)'; ctx.strokeStyle = 'rgba(200,220,240,0.7)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(...top); ctx.lineTo(...left); ctx.lineTo(...right); ctx.closePath(); ctx.fill(); ctx.stroke();
      /* punto de entrada a media altura de la cara izquierda */
      const P = [(top[0] + left[0]) / 2, (top[1] + left[1]) / 2];
      const nL = [-(Math.cos(A / 2)), -Math.sin(A / 2)]; /* normal exterior de la cara izquierda */
      /* dirección incidente: forma ángulo th con la normal, viniendo desde abajo a la izquierda */
      const rot = (v, a) => [v[0] * Math.cos(a) - v[1] * Math.sin(a), v[0] * Math.sin(a) + v[1] * Math.cos(a)];
      const din = rot([-nL[0], -nL[1]], -th);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(P[0] - din[0] * 300, P[1] - din[1] * 300); ctx.lineTo(P[0], P[1]); ctx.stroke();
      const res = {};
      for (const nm of [700, 650, 600, 570, 530, 480, 440, 400]) {
        const n = nOf(nm);
        const t1 = Math.asin(Math.sin(th) / n);
        const d1 = rot([-nL[0], -nL[1]], -t1);
        /* intersección con la cara derecha */
        const R0 = top, Rd = [right[0] - top[0], right[1] - top[1]];
        const den = d1[0] * Rd[1] - d1[1] * Rd[0];
        const s = ((R0[0] - P[0]) * Rd[1] - (R0[1] - P[1]) * Rd[0]) / den;
        const Q = [P[0] + s * d1[0], P[1] + s * d1[1]];
        const col = EM.rgbStr(EM.wavelengthRGB(nm));
        ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(...P); ctx.lineTo(...Q); ctx.stroke();
        const nR = [Math.cos(A / 2), -Math.sin(A / 2)];
        const ci = d1[0] * nR[0] + d1[1] * nR[1], ang = Math.acos(M.clamp(ci, -1, 1));
        const so = n * Math.sin(ang);
        if (so >= 1) { res[nm] = null; continue; }
        const tout = Math.asin(so);
        const sign = d1[0] * nR[1] - d1[1] * nR[0] > 0 ? 1 : -1;
        const dOut = rot(nR, -sign * tout);
        ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(...Q); ctx.lineTo(Q[0] + dOut[0] * 400, Q[1] + dOut[1] * 400); ctx.stroke();
        res[nm] = [n, M.deg(th + tout - A)];
      }
      if (res[700] && res[400]) {
        sim.set('n', EM.fix(res[700][0], 4) + ', ' + EM.fix(res[400][0], 4));
        sim.set('dev', EM.fix(res[700][1], 2) + '°, ' + EM.fix(res[400][1], 2) + '°');
        sim.set('sp', EM.fix(res[400][1] - res[700][1], 2) + '°');
      } else { sim.set('n', EM.fix(nOf(700), 4) + ', ' + EM.fix(nOf(400), 4)); sim.set('dev', 'reflexión total interna en la segunda cara'); sim.set('sp', '—'); }
    });
  });
})();

/* ==== core/90-app.js ==== */
/* ===================================================================
   90-app.js — Aplicación: índice, navegación, búsqueda, MathJax, montaje de simulaciones
   =================================================================== */
(function () {
  'use strict';
  const EM = window.EM;
  const el = EM.el;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

  const state = {
    chapters: [],
    byId: {},
    built: {},
    sims: {},
    current: null,
    mathReady: false,
    pendingMath: []
  };
  EM.app = state;

  const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const stripMath = (s) => s.replace(/\\\(([\s\S]*?)\\\)/g, ' ').replace(/\\\[([\s\S]*?)\\\]/g, ' ').replace(/\s+/g, ' ').trim();
  const kids = (node, tag) => Array.from(node.children).filter((e) => e.tagName === tag);
  const pad = (n) => (typeof n === 'number' && n < 10 ? '0' + n : String(n));

  /* ---------- MathJax ---------- */
  EM.mathReady = function () {
    state.mathReady = true;
    const list = state.pendingMath.splice(0);
    list.forEach(typeset);
  };
  function typeset(node) {
    if (!state.mathReady || !window.MathJax || !MathJax.typesetPromise) { state.pendingMath.push(node); return Promise.resolve(); }
    node.classList.add('loading-math');
    return MathJax.typesetPromise([node]).catch((e) => console.warn('MathJax', e)).then(() => node.classList.remove('loading-math'));
  }
  EM.typeset = typeset;

  /* ---------- Lectura de capítulos ---------- */
  function readChapters() {
    $$('template.chapter-src').forEach((t) => {
      const d = t.dataset;
      const ch = {
        id: d.id, num: isNaN(+d.num) ? d.num : +d.num, title: d.title, part: d.part || '', short: d.short || '',
        tpl: t, home: d.id === 'inicio'
      };
      const frag = t.content;
      ch.sections = kids(frag, 'SECTION').map((s, i) => {
        const h = s.querySelector('h2');
        return { idx: i + 1, title: h ? stripMath(h.textContent) : 'Sección ' + (i + 1), id: s.id || d.id + '-s' + (i + 1) };
      });
      ch.simCount = $$('.sim[data-sim]', frag).length;
      state.chapters.push(ch);
      state.byId[ch.id] = ch;
    });
    state.list = state.chapters.filter((c) => !c.home);
  }

  /* ---------- Índice lateral ---------- */
  function buildToc() {
    const nav = $('#toc');
    nav.innerHTML = '';
    const home = el('a', null, '<span class="n">·</span><span>Portada</span>');
    home.href = '#inicio';
    home.dataset.id = 'inicio';
    nav.append(home);
    let part = null;
    for (const ch of state.list) {
      if (ch.part !== part) {
        part = ch.part;
        nav.append(el('div', 'toc-part', part));
      }
      const a = el('a', null, `<span class="n">${pad(ch.num)}</span><span>${ch.title}</span>`);
      a.href = '#' + ch.id;
      a.dataset.id = ch.id;
      nav.append(a);
      const secs = el('div', 'toc-secs');
      secs.hidden = true;
      secs.dataset.for = ch.id;
      ch.sections.forEach((s) => {
        const sa = el('a', null, `<span class="n">${ch.num}.${s.idx}</span><span>${s.title}</span>`);
        sa.href = '#' + ch.id + '.' + s.idx;
        sa.dataset.sec = s.idx;
        secs.append(sa);
      });
      nav.append(secs);
    }
  }
  function markToc(id) {
    $$('#toc > a').forEach((a) => a.classList.toggle('active', a.dataset.id === id));
    $$('#toc .toc-secs').forEach((s) => { s.hidden = s.dataset.for !== id; });
    const act = $('#toc > a.active');
    if (act && act.scrollIntoView) {
      const sb = $('#sidebar');
      const r = act.getBoundingClientRect(), rs = sb.getBoundingClientRect();
      if (r.top < rs.top + 60 || r.bottom > rs.bottom - 60) sb.scrollTop += r.top - rs.top - 120;
    }
  }

  /* ---------- Construcción de un capítulo ---------- */
  function build(ch) {
    if (state.built[ch.id]) return state.built[ch.id];
    const art = el('article', 'chapter');
    art.id = 'cap-' + ch.id;
    art.dataset.id = ch.id;
    art.setAttribute('lang', 'es');
    const frag = ch.tpl.content.cloneNode(true);
    if (!ch.home) {
      const head = el('header', 'ch-head');
      head.innerHTML = `<div class="ch-num" aria-hidden="true">${pad(ch.num)}</div><div><div class="ch-part">${ch.part}</div><h1 class="ch-title">${ch.title}</h1></div>`;
      const lead = frag.querySelector('.lead');
      if (lead) { lead.classList.add('ch-lead'); head.append(lead); }
      const chips = el('nav', 'ch-contents');
      chips.setAttribute('aria-label', 'Contenido del capítulo');
      head.append(chips);
      art.append(head);
      art.append(frag);
      /* Numeración de secciones */
      $$(':scope > section', art).forEach((s, i) => {
        if (!s.id) s.id = ch.id + '-s' + (i + 1);
        const h2 = s.querySelector('h2');
        const t = h2 ? stripMath(h2.textContent) : '';
        if (h2) h2.insertAdjacentHTML('afterbegin', `<span class="n">${ch.num}.${i + 1}</span>`);
        const a = el('a', null, `<span class="n">${ch.num}.${i + 1}</span>${t}`);
        a.href = '#' + ch.id + '.' + (i + 1);
        chips.append(a);
      });
      /* Simulaciones y ejemplos */
      $$('.sim[data-sim]', art).forEach((s, i) => { s.dataset.num = `Simulación ${ch.num}.${i + 1}`; s.id = ch.id + '-sim' + (i + 1); });
      $$('.box.ex', art).forEach((b, i) => { b.dataset.label = `Ejemplo ${ch.num}.${i + 1}`; });
      /* Navegación anterior/siguiente */
      const i = state.list.indexOf(ch);
      const nav = el('nav', 'ch-nav');
      nav.setAttribute('aria-label', 'Capítulos vecinos');
      const prev = state.list[i - 1], next = state.list[i + 1];
      if (prev) { const a = el('a', 'prev', `<small>← Anterior · ${pad(prev.num)}</small><span>${prev.title}</span>`); a.href = '#' + prev.id; nav.append(a); }
      if (next) { const a = el('a', 'next', `<small>Siguiente · ${pad(next.num)} →</small><span>${next.title}</span>`); a.href = '#' + next.id; nav.append(a); }
      art.append(nav);
    } else {
      art.append(frag);
      fillHome(art);
    }
    $('#chapters').append(art);
    /* Montaje de simulaciones */
    const sims = [];
    $$('.sim[data-sim]', art).forEach((host) => {
      const name = host.dataset.sim;
      const f = EM.sims[name];
      const sim = new EM.Sim(host, name);
      if (!f) { sim.fail(new Error('simulación no encontrada: ' + name)); return; }
      try { f(sim, host.dataset); } catch (e) { sim.fail(e); }
      sims.push(sim);
    });
    state.sims[ch.id] = sims;
    state.built[ch.id] = art;
    typeset(art);
    return art;
  }

  /* ---------- Portada ---------- */
  function fillHome(art) {
    const box = $('.home-parts', art);
    if (!box) return;
    let part = null, grid = null;
    for (const ch of state.list) {
      if (ch.part !== part) {
        part = ch.part;
        const sec = el('div', 'home-part');
        sec.append(el('h3', null, part));
        grid = el('div', 'home-grid');
        sec.append(grid);
        box.append(sec);
      }
      const a = el('a', 'home-card', `<span class="n">${pad(ch.num)}</span><b>${ch.title}</b><small>${ch.short}</small>` + (ch.simCount ? `<span class="sims">${ch.simCount} simulacion${ch.simCount === 1 ? '' : 'es'} · ${ch.sections.length} secciones</span>` : `<span class="sims">${ch.sections.length} secciones</span>`));
      a.href = '#' + ch.id;
      grid.append(a);
    }
    const tot = state.list.reduce((s, c) => s + c.simCount, 0);
    const cnt = $('.home-count', art);
    const nCh = state.list.filter((c) => typeof c.num === 'number').length, nAp = state.list.length - nCh;
    if (cnt) cnt.textContent = `${nCh} capítulos` + (nAp ? ` · ${nAp} apéndice${nAp > 1 ? 's' : ''}` : '') + ` · ${tot} simulaciones interactivas`;
  }

  /* ---------- Navegación ---------- */
  function parseHash() {
    const h = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (!h) return { id: 'inicio' };
    const [id, sec] = h.split('.');
    if (!state.byId[id]) {
      /* ¿es un id de sección o simulación? */
      const target = document.getElementById(h);
      if (target) return { id: null, el: target };
      return { id: 'inicio' };
    }
    return { id, sec: sec ? +sec : null };
  }
  function show(id, sec) {
    const ch = state.byId[id] || state.byId.inicio;
    const art = build(ch);
    for (const k in state.built) {
      const on = k === ch.id;
      state.built[k].hidden = !on;
      (state.sims[k] || []).forEach((s) => s.setActive(on));
    }
    const changed = state.current !== ch.id;
    state.current = ch.id;
    markToc(ch.id);
    const crumb = $('#crumb');
    crumb.innerHTML = ch.home ? '<b>Vibraciones y Ondas</b> · curso interactivo' : `<span>${ch.part}</span> · <b>${pad(ch.num)} ${ch.title}</b>`;
    document.title = ch.home ? 'Vibraciones y Ondas' : `${ch.title} · Vibraciones y Ondas`;
    closeNav();
    requestAnimationFrame(() => {
      if (sec) {
        const s = $$(':scope > section', art)[sec - 1];
        if (s) { s.scrollIntoView({ block: 'start' }); return; }
      }
      if (changed) window.scrollTo(0, 0);
    });
    observeSections(art, ch);
    EM.store.set('last', ch.id);
  }
  function route() {
    const r = parseHash();
    if (r.el) {
      const art = r.el.closest('.chapter');
      if (art) show(art.dataset.id);
      r.el.scrollIntoView({ block: 'start' });
      return;
    }
    show(r.id, r.sec);
  }

  /* Resaltado de sección actual y barra de progreso */
  let secObs = null;
  function observeSections(art, ch) {
    if (secObs) secObs.disconnect();
    if (ch.home) return;
    const secs = $$(':scope > section', art);
    const links = $$(`#toc .toc-secs[data-for="${ch.id}"] a`);
    const vis = new Map();
    secObs = new IntersectionObserver((es) => {
      es.forEach((e) => vis.set(e.target, e.isIntersecting ? e.intersectionRatio : 0));
      let best = -1;
      secs.forEach((s, i) => { if ((vis.get(s) || 0) > 0 && best < 0) best = i; });
      links.forEach((a, i) => a.classList.toggle('here', i === best));
    }, { rootMargin: '-60px 0px -55% 0px', threshold: [0, 0.01] });
    secs.forEach((s) => secObs.observe(s));
  }
  function onScroll() {
    const bar = $('#progress');
    if (!bar) return;
    const h = document.documentElement;
    const max = h.scrollHeight - h.clientHeight;
    bar.style.width = (max > 0 ? (100 * h.scrollTop) / max : 0).toFixed(1) + '%';
  }

  /* ---------- Menú móvil ---------- */
  function openNav() {
    $('#app').classList.add('nav-open');
    if (!$('.scrim')) {
      const s = el('div', 'scrim');
      s.addEventListener('click', closeNav);
      $('#app').append(s);
    }
  }
  function closeNav() {
    $('#app').classList.remove('nav-open');
    const s = $('.scrim');
    if (s) s.remove();
  }

  /* ---------- Tema ---------- */
  function applyTheme(t) {
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
    const b = $('#themeBtn');
    if (b) {
      const lab = t === 'dark' ? 'Oscuro' : t === 'light' ? 'Claro' : 'Sistema';
      b.querySelector('span').textContent = lab;
      b.title = 'Tema: ' + lab + ' (clic para cambiar)';
    }
  }
  function cycleTheme() {
    const cur = document.documentElement.getAttribute('data-theme');
    const order = [null, 'light', 'dark'];
    const next = order[(order.indexOf(cur) + 1) % 3];
    EM.store.set('theme', next);
    applyTheme(next);
  }

  /* ---------- Búsqueda ---------- */
  let index = null;
  function buildIndex() {
    index = [];
    for (const ch of state.list) {
      const frag = ch.tpl.content;
      index.push({ ch, sec: null, title: ch.title, text: ch.short, n: norm(ch.title + ' ' + ch.short), w: 3 });
      kids(frag, 'SECTION').forEach((s, i) => {
        const h = s.querySelector('h2');
        const title = h ? stripMath(h.textContent) : '';
        index.push({ ch, sec: i + 1, title, text: '', n: norm(title), w: 2 });
        $$('h3, h4, .sim[data-title]', s).forEach((x) => {
          const t = x.dataset && x.dataset.title ? 'Simulación: ' + x.dataset.title : stripMath(x.textContent);
          index.push({ ch, sec: i + 1, title: t, text: title, n: norm(t), w: 1.5 });
        });
        $$('p, li', s).forEach((p) => {
          const t = stripMath(p.textContent);
          if (t.length > 20) index.push({ ch, sec: i + 1, title, text: t, n: norm(t), w: 1 });
        });
      });
    }
  }
  function search(q) {
    if (!index) buildIndex();
    const terms = norm(q).split(/\s+/).filter((t) => t.length > 1);
    if (!terms.length) return [];
    const res = [];
    const seen = new Set();
    for (const it of index) {
      if (!terms.every((t) => it.n.includes(t))) continue;
      const key = it.ch.id + '|' + it.sec + '|' + it.title + '|' + (it.w === 1 ? it.text.slice(0, 40) : '');
      if (seen.has(key)) continue;
      seen.add(key);
      res.push(it);
    }
    res.sort((a, b) => b.w - a.w);
    return res.slice(0, 14);
  }
  function highlight(text, q) {
    const terms = norm(q).split(/\s+/).filter((t) => t.length > 1);
    let s = text;
    if (s.length > 140) {
      const i = norm(s).indexOf(terms[0] || '');
      const st = Math.max(0, i - 50);
      s = (st > 0 ? '…' : '') + s.slice(st, st + 140) + '…';
    }
    const esc = s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    let out = esc;
    for (const t of terms) {
      const ns = norm(out);
      const i = ns.indexOf(t);
      if (i >= 0) out = out.slice(0, i) + '<mark>' + out.slice(i, i + t.length) + '</mark>' + out.slice(i + t.length);
    }
    return out;
  }
  function setupSearch() {
    const inp = $('#searchIn'), box = $('#searchRes');
    let sel = -1, items = [];
    const render = () => {
      const q = inp.value.trim();
      if (q.length < 2) { box.hidden = true; return; }
      items = search(q);
      box.innerHTML = '';
      if (!items.length) { box.append(el('div', 'sr-none', 'Sin resultados para “' + q.replace(/</g, '&lt;') + '”.')); box.hidden = false; return; }
      items.forEach((it, i) => {
        const b = el('button', i === sel ? 'sel' : '');
        b.type = 'button';
        b.innerHTML = `<div class="sr-ch">${pad(it.ch.num)} · ${it.ch.title}</div><div class="sr-t">${highlight(it.title, q)}</div>` + (it.w === 1 ? `<div class="sr-s">${highlight(it.text, q)}</div>` : '');
        b.addEventListener('click', () => go(it));
        box.append(b);
      });
      box.hidden = false;
    };
    const go = (it) => {
      box.hidden = true;
      inp.value = '';
      location.hash = it.ch.id + (it.sec ? '.' + it.sec : '');
    };
    inp.addEventListener('input', () => { sel = -1; render(); });
    inp.addEventListener('keydown', (e) => {
      if (box.hidden) return;
      if (e.key === 'ArrowDown') { sel = Math.min(items.length - 1, sel + 1); render(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); render(); e.preventDefault(); }
      else if (e.key === 'Enter') { const it = items[Math.max(0, sel)]; if (it) go(it); }
      else if (e.key === 'Escape') { box.hidden = true; }
    });
    document.addEventListener('click', (e) => { if (!e.target.closest('.search')) box.hidden = true; });
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT') { e.preventDefault(); inp.focus(); }
    });
  }

  /* ---------- Arranque ---------- */
  function init() {
    readChapters();
    buildToc();
    setupSearch();
    applyTheme(EM.store.get('theme', null));
    $('#themeBtn').addEventListener('click', cycleTheme);
    $('#menuBtn').addEventListener('click', () => ($('#app').classList.contains('nav-open') ? closeNav() : openNav()));
    window.addEventListener('hashchange', route);
    window.addEventListener('scroll', onScroll, { passive: true });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeNav(); });
    route();
    if (window.__mjReady && !state.mathReady) EM.mathReady();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
