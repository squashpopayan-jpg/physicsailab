   =================================================================== */
:root {
  --bg: #EEF1F5;
  --surface: #FFFFFF;
  --surface-2: #E6EBF1;
  --surface-3: #D9E0E8;

  --accent-2: #A8478A;

  --accent-soft: #F3E2EE;
  --focus: #1D5FD1;
  --shadow: 0 1px 2px rgba(19, 29, 42, .06), 0 8px 24px -12px rgba(19, 29, 42, .18);

  /* Colores físicos (convención de libro de texto) */
  --pos: #D0342C;
  --neg: #1D5FD1;
  --fline: #22303F;
  --bline: #0A7C70;
  --equip: #2A9255;
  --cur: #7A44C9;
  --efield: #C2561A;
  --bfield: #0A7C70;
  --c1: #1D5FD1;
  --c2: #D0342C;
  --c3: #0A8A67;
  --c4: #B0601F;
  --c5: #7A44C9;
  --c6: #5F6B7A;
  --gold: #B8860B;

  /* Lienzo (papel milimetrado) */
  --canvas: #FBFCFD;
  --grid: #E7ECF2;
  --grid-2: #D0D9E4;
  --axis: #56657A;
  --surf-a: #4F83D9;
  --surf-b: #D98A4F;
  --surf-c: #43A37A;

  /* Recuadros */
  --def-bg: #EAF0FA;
  --def-ink: #1B4FA8;
  --law-bg: #F7EBE1;
  --law-ink: #8E4312;
  --ex-bg: #E8F4EE;
  --ex-ink: #0B6E53;
  --warn-bg: #FBEBEA;
  --warn-ink: #A8281F;
  --note-bg: #EDF0F4;
  --note-ink: #4E5D70;

  --font-ui: "Archivo", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-text: "Source Serif 4", "Iowan Old Style", Georgia, Cambria, serif;
  --font-mono: "JetBrains Mono", "Cascadia Mono", Consolas, Menlo, monospace;

  --sidebar-w: 300px;
  --topbar-h: 56px;
  --prose: 46rem;
  --wide: 72rem;
}

    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px -14px rgba(0, 0, 0, .6);
    --pos: #FF6A5C;
    --neg: #5C9DFF;
    --fline: #CBD5E1;
    --bline: #3FD0C0;
    --equip: #5ED08E;
    --cur: #B28CFF;
    --efield: #FF9A5C;
    --bfield: #3FD0C0;
    --c1: #5C9DFF;
    --c2: #FF6A5C;
    --c3: #3ED3A0;
    --c4: #F0A36B;
    --c5: #B28CFF;
    --c6: #9AA7B8;
    --gold: #E6C35C;
    --canvas: #0F151D;
    --grid: #18212B;
    --grid-2: #243140;
    --axis: #8C9AAD;
    --surf-a: #4C7FD6;
    --surf-b: #D6884D;
    --surf-c: #3E9E76;
    --def-bg: #142034;
    --def-ink: #8DB6FF;
    --law-bg: #2A1C12;
    --law-ink: #F2AE7C;
    --ex-bg: #10271F;
    --ex-ink: #6FE0B5;
    --warn-bg: #2E1614;
    --warn-ink: #FF8F84;
    --note-bg: #19212B;
    --note-ink: #A8B5C5;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0C1117;
  --surface: #131A23;
  --surface-2: #1A232E;
  --surface-3: #243040;
  --ink: #E4EAF2;
  --ink-2: #A8B5C5;
  --ink-3: #758499;
  --rule: #26313E;
  --rule-strong: #3A4757;
  --accent: #E584C4;
  --accent-2: #F0A2D6;
  --accent-ink: #1E0716;
  --accent-soft: #3A1830;
  --focus: #6FA3FF;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px -14px rgba(0, 0, 0, .6);
  --pos: #FF6A5C;
  --neg: #5C9DFF;
  --fline: #CBD5E1;
  --bline: #3FD0C0;
  --equip: #5ED08E;
  --cur: #B28CFF;
  --efield: #FF9A5C;
  --bfield: #3FD0C0;
  --c1: #5C9DFF;
  --c2: #FF6A5C;
  --c3: #3ED3A0;
  --c4: #F0A36B;
  --c5: #B28CFF;
  --c6: #9AA7B8;
  --gold: #E6C35C;
  --canvas: #0F151D;
  --grid: #18212B;
  --grid-2: #243140;
  --axis: #8C9AAD;
  --surf-a: #4C7FD6;
  --surf-b: #D6884D;
  --surf-c: #3E9E76;
  --def-bg: #142034;
  --def-ink: #8DB6FF;
  --law-bg: #2A1C12;
  --law-ink: #F2AE7C;
  --ex-bg: #10271F;
  --ex-ink: #6FE0B5;
  --warn-bg: #2E1614;
  --warn-ink: #FF8F84;
  --note-bg: #19212B;
  --note-ink: #A8B5C5;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: var(--accent); text-underline-offset: 2px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
::selection { background: var(--accent-soft); }

/* ---------- Estructura ---------- */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  min-height: 100%;
}
.sidebar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  height: 100vh;
  height: 100dvh;
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--surface);
  border-right: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
  z-index: 30;
}
.brand {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 18px 18px 14px;
  text-decoration: none;
  color: var(--ink);
}
.brand-mark { width: 38px; height: 38px; flex: none; }
.brand-name {
  font-weight: 800;
  font-stretch: 80%;
  font-size: 19px;
  line-height: 1.05;
  letter-spacing: .005em;
}
.brand-name small {
  display: block;
  font-weight: 500;
  font-stretch: 100%;
  font-size: 11.5px;
  color: var(--ink-3);
  letter-spacing: .02em;
  margin-top: 3px;
}
.search {
  position: relative;
  margin: 0 14px 10px;
}
.search input {
  width: 100%;
  padding: 8px 10px 8px 32px;
  border: 1px solid var(--rule);
  border-radius: 6px;
  background: var(--bg);
  font-size: 13.5px;
}
.search svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 15px;
  height: 15px;
  color: var(--ink-3);
  pointer-events: none;
}
.search-results {
  position: absolute;
  left: 0;
  right: 0;
  top: calc(100% + 4px);
  background: var(--surface);
  border: 1px solid var(--rule-strong);
  border-radius: 6px;
  box-shadow: var(--shadow);
  max-height: 60vh;
  overflow: auto;
  z-index: 50;
}
.search-results button {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  background: none;
  padding: 8px 12px;
  border-bottom: 1px solid var(--rule);
  cursor: pointer;
}
.search-results button:hover, .search-results button.sel { background: var(--surface-2); }
.search-results .sr-ch { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
.search-results .sr-t { font-weight: 600; font-size: 13.5px; }
.search-results .sr-s { font-size: 12.5px; color: var(--ink-2); font-family: var(--font-text); }
.search-results mark { background: var(--accent-soft); color: inherit; padding: 0 1px; }
.search-results .sr-none { padding: 12px; color: var(--ink-3); }

.toc { padding: 4px 0 24px; flex: 1; }
.toc-part {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
  padding: 16px 18px 6px;
}
.toc a {
  display: grid;
  grid-template-columns: 30px 1fr;
  align-items: baseline;
  padding: 5px 14px 5px 18px;
  color: var(--ink-2);
  text-decoration: none;
  font-size: 13.5px;
  line-height: 1.3;
  border-left: 3px solid transparent;
}
.toc a:hover { background: var(--surface-2); color: var(--ink); }
.toc a .n {
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.toc a.active {
  color: var(--ink);
  font-weight: 650;
  background: var(--surface-2);
  border-left-color: var(--accent);
}
.toc a.active .n { color: var(--accent); }
.toc .toc-secs { margin: 2px 0 6px; }
.toc .toc-secs a {
  font-size: 12.5px;
  padding: 3px 14px 3px 48px;
  grid-template-columns: 34px 1fr;
  border-left: 3px solid transparent;
  color: var(--ink-3);
  background: none;
  font-weight: 450;
}
.toc .toc-secs a:hover { color: var(--ink); }
.toc .toc-secs a.here { color: var(--accent); }
.toc .toc-secs a .n { font-size: 11px; }

.sidebar-foot {
  padding: 12px 18px 18px;
  border-top: 1px solid var(--rule);
  color: var(--ink-3);
  font-size: 12px;
}
.sidebar-foot .credit { color: var(--ink-2); margin-bottom: 8px; line-height: 1.45; }
.sidebar-foot .credit b { color: var(--ink); font-weight: 600; }
.site-foot { max-width: var(--wide); margin: 10px auto 0; padding: 18px 16px 28px; border-top: 1px solid var(--rule); color: var(--ink-3); font-size: 12.5px; text-align: center; line-height: 1.6; text-wrap: balance; }
.site-foot b { color: var(--ink-2); font-weight: 600; }
.chapter p.home-author, .home-author { margin: 18px 0 0; padding: 8px 0 8px 14px; border-left: 3px solid var(--accent); font-family: var(--font-ui); color: var(--ink-2); line-height: 1.35; }
.home-author small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 3px; }
.home-author b { display: block; font-size: 18px; font-weight: 700; color: var(--ink); }
.home-author span { display: block; font-size: 13.5px; color: var(--ink-3); margin-top: 2px; }

.mainwrap { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  gap: 12px;
  padding-inline: clamp(16px, 3vw, 36px);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule);
}
.topbar .crumb {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 13.5px;
  color: var(--ink-2);
}
.topbar .crumb b { color: var(--ink); font-weight: 650; }
.iconbtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 34px;
  min-width: 34px;
  padding: 0 10px;
  border: 1px solid var(--rule);
  background: var(--surface);
  border-radius: 6px;
  cursor: pointer;
  color: var(--ink-2);
  font-size: 13px;
}
.iconbtn:hover { color: var(--ink); border-color: var(--rule-strong); }
.iconbtn svg { width: 16px; height: 16px; }
.menu-btn { display: none; }
.progress {
  position: absolute;
  left: 0;
  bottom: -1px;
  height: 2px;
  background: var(--accent);
  width: 0;
  transition: width .15s linear;
}

main#main {
  padding-inline: clamp(16px, 4vw, 56px);
  padding-block: 28px 80px;
  min-width: 0;
}

/* ---------- Capítulo ---------- */
.chapter { max-width: var(--wide); margin: 0 auto; }
.chapter[hidden] { display: none !important; }
.ch-head {
  padding-block: 18px 26px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 26px;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  column-gap: 28px;
  align-items: end;
}
.ch-num {
  font-family: var(--font-ui);
  font-weight: 800;
  font-stretch: 62%;
  font-size: clamp(64px, 9vw, 116px);
  line-height: .8;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.02em;
}
.ch-part {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 8px;
}
.ch-title {
  font-weight: 750;
  font-stretch: 85%;
  font-size: clamp(30px, 4.2vw, 50px);
  line-height: 1.02;
  margin: 0;
  text-wrap: balance;
  letter-spacing: -.01em;
}
.ch-lead {
  grid-column: 1 / -1;
  font-family: var(--font-text);
  font-size: 19px;
  line-height: 1.55;
  color: var(--ink-2);
  max-width: var(--prose);
  margin: 22px 0 0;
}
.ch-contents {
  grid-column: 1 / -1;
  margin-top: 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 8px;
}
.ch-contents a {
  font-size: 12.5px;
  text-decoration: none;
  color: var(--ink-2);
  border: 1px solid var(--rule);
  background: var(--surface);
  border-radius: 999px;
  padding: 3px 11px;
}
.ch-contents a:hover { border-color: var(--accent); color: var(--accent); }
.ch-contents a .n { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); margin-right: 5px; }
.ch-contents a.simlink { border-style: dashed; }

/* Prosa (teoría) */
.chapter section { margin-bottom: 44px; scroll-margin-top: calc(var(--topbar-h) + 12px); }
.chapter h2 {
  font-weight: 720;
  font-stretch: 88%;
  font-size: 28px;
  line-height: 1.12;
  margin: 8px 0 14px;
  text-wrap: balance;
  max-width: var(--prose);
  scroll-margin-top: calc(var(--topbar-h) + 12px);
}
.chapter h2 .n {
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: 15px;
  color: var(--accent);
  margin-right: 12px;
  vertical-align: 4px;
  font-stretch: 100%;
}
.chapter h3 {
  font-weight: 680;
  font-stretch: 92%;
  font-size: 20px;
  margin: 28px 0 8px;
  max-width: var(--prose);
  scroll-margin-top: calc(var(--topbar-h) + 12px);
}
.chapter h4 { font-size: 15.5px; font-weight: 680; margin: 18px 0 6px; }
.chapter p, .chapter li, .chapter dd, .chapter td, .chapter th, .chapter figcaption, .chapter summary {
  font-family: var(--font-text);
}
.chapter p, .chapter > section > ul, .chapter > section > ol, .chapter section > .box, .chapter section > details, .chapter section > .eq, .chapter section > .tablewrap.narrow, .chapter section > dl {
  max-width: var(--prose);
}
.chapter p, .chapter li { font-size: 17.5px; line-height: 1.62; }
.chapter p { margin: 0 0 14px; }
.chapter ul, .chapter ol { padding-left: 1.4em; margin: 0 0 14px; }
.chapter li { margin-bottom: 5px; }
.chapter li::marker { color: var(--ink-3); }
.chapter strong { font-weight: 650; }
.chapter em { font-style: italic; }
.chapter .term { font-style: italic; color: var(--ink); background: linear-gradient(transparent 62%, var(--accent-soft) 62%); }
.chapter code { font-family: var(--font-mono); font-size: .86em; background: var(--surface-2); padding: 1px 4px; border-radius: 3px; }

/* Ecuaciones */
mjx-container { color: inherit; }
mjx-container[display="true"] {
  overflow-x: auto;
  overflow-y: hidden;
  max-width: 100%;
  padding: 3px 0;
  margin: 12px 0 !important;
}
mjx-container[jax="SVG"] > svg { overflow: visible; }
.eq {
  position: relative;
  margin: 14px 0 18px;
}
.eq.key {
  border: 1px solid var(--rule-strong);
  background: var(--surface);
  padding: 4px 18px;
  border-radius: 4px;
}
.eq.key::after {
  content: attr(data-name);
  position: absolute;
  top: -9px;
  left: 14px;
  background: var(--bg);
  padding: 0 6px;
  font-family: var(--font-ui);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--accent);
}
.eq.key:not([data-name])::after { display: none; }

/* Recuadros */
.box {
  position: relative;
  margin: 22px 0 22px;
  padding: 16px 20px 6px;
  border-radius: 3px;
  border: 1px solid transparent;
}
.box::before {
  display: inline-block;
  font-family: var(--font-ui);
  font-size: 10.5px;
  font-weight: 750;
  letter-spacing: .13em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.box > h4 {
  margin: 0 0 8px;
  font-size: 16px;
  font-weight: 700;
  font-family: var(--font-ui);
}
.box p, .box li { font-size: 16.5px; }
.box.def { background: var(--def-bg); border-color: color-mix(in srgb, var(--def-ink) 30%, transparent); }
.box.def::before { content: "Definición"; color: var(--def-ink); }
.box.law { background: var(--law-bg); border-color: color-mix(in srgb, var(--law-ink) 30%, transparent); }
.box.law::before { content: "Resultado clave"; color: var(--law-ink); }
.box.ex { background: var(--ex-bg); border-color: color-mix(in srgb, var(--ex-ink) 30%, transparent); }
.box.ex::before { content: attr(data-label); color: var(--ex-ink); }
.box.warn { background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn-ink) 30%, transparent); }
.box.warn::before { content: "Cuidado"; color: var(--warn-ink); }
.box.note { background: var(--note-bg); border-color: var(--rule); }
.box.note::before { content: "Nota"; color: var(--note-ink); }
.box.hist { background: var(--note-bg); border-color: var(--rule); }
.box.hist::before { content: "Contexto histórico"; color: var(--note-ink); }
.box > h4 + * { margin-top: 0; }
.box details { margin: 4px 0 12px; }
.box summary, .problems summary {
  cursor: pointer;
  font-family: var(--font-ui);
  font-weight: 650;
  font-size: 13.5px;
  color: var(--ex-ink);
  list-style: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border: 1px solid color-mix(in srgb, var(--ex-ink) 40%, transparent);
  border-radius: 999px;
  background: var(--surface);
}
.box summary::-webkit-details-marker, .problems summary::-webkit-details-marker { display: none; }
.box summary::before, .problems summary::before { content: "▸"; transition: transform .15s; }
details[open] > summary::before { transform: rotate(90deg); }
.box details[open] > summary { margin-bottom: 10px; }

/* Tablas */
.tablewrap { overflow-x: auto; margin: 16px 0 22px; }
.chapter table {
  border-collapse: collapse;
  width: 100%;
  font-size: 15px;
  background: var(--surface);
}
.chapter th, .chapter td {
  border: 1px solid var(--rule);
  padding: 7px 10px;
  text-align: left;
  vertical-align: middle;
}
.chapter th {
  font-family: var(--font-ui);
  font-weight: 650;
  font-size: 13px;
  background: var(--surface-2);
  color: var(--ink);
}
.chapter td.c, .chapter th.c { text-align: center; }

<template class="chapter-src" data-id="inicio" data-num="0" data-title="Portada">
<div class="home-hero">
  <div>
    <div class="home-kicker">Curso interactivo · Física de las oscilaciones</div>
    <h1 class="home-title">Vibraciones y Ondas<span>del oscilador armónico a la interferencia de la luz</span></h1>
    <p class="home-lead">Un curso completo de vibraciones y ondas: cada capítulo desarrolla la teoría con sus deducciones, ejemplos resueltos y problemas, y la acompaña de simulaciones con todos sus parámetros ajustables. Varias de ellas, además, se pueden escuchar.</p>
    <div class="maxwell-strip" aria-label="Ecuaciones centrales del curso">
      <div><small>Oscilador armónico</small>\[\ddot x+\omega_0^2x=0\]</div>
      <div><small>Oscilador amortiguado y forzado</small>\[\ddot x+\gamma\dot x+\omega_0^2x=\tfrac{F_0}{m}\cos\omega t\]</div>
      <div><small>Ecuación de onda</small>\[\pddv{y}{t}=v^2\pddv{y}{x}\]</div>

<template class="chapter-src" data-id="herramientas" data-num="1" data-title="Herramientas: complejos, fasores y ecuaciones lineales" data-part="Parte I · Fundamentos" data-short="Por qué todo oscila, fórmula de Euler, fasores, ecuaciones diferenciales lineales y aproximaciones">
<p class="lead">Casi todo sistema físico que se aparta un poco de su equilibrio estable oscila. Para describir esas oscilaciones con economía, el curso usa tres herramientas: la expansión de Taylor alrededor del equilibrio, los números complejos (con la fórmula de Euler) y la teoría de ecuaciones diferenciales lineales con coeficientes constantes.</p>

<section>
<h2>¿Por qué todo oscila?</h2>
<p>Sea \(U(x)\) la energía potencial de un sistema con un grado de libertad y \(x_0\) un mínimo, es decir, \(U'(x_0)=0\) y \(U''(x_0)\gt0\). Expandiendo en serie de Taylor alrededor del mínimo,</p>
<div class="eq">\[U(x)=U(x_0)+\underbrace{U'(x_0)}_{0}(x-x_0)+\tfrac12U''(x_0)(x-x_0)^2+\tfrac16U'''(x_0)(x-x_0)^3+\cdots\]</div>
<p>Para desplazamientos pequeños dominan los dos primeros términos no nulos: el potencial es una parábola, la fuerza \(F=-\dd U/\dd x\approx-U''(x_0)(x-x_0)\) es lineal y restauradora, y el movimiento es armónico con</p>
<div class="eq key" data-name="Frecuencia de pequeñas oscilaciones">\[\omega_0=\sqrt{\frac{U''(x_0)}{m}} .\]</div>
<p>Por eso el oscilador armónico aparece en todas partes: átomos en una red cristalina, moléculas, circuitos eléctricos, edificios, el aire de una flauta. Los términos cúbicos y superiores producen las correcciones <em>no lineales</em> que estudiaremos en el capítulo 8.</p>
<div class="box ex">
<h4>Potencial de Lennard-Jones</h4>
<p>La interacción entre dos átomos de argón se modela con \(U(r)=4\varepsilon\left[(\sigma/r)^{12}-(\sigma/r)^6\right]\). Halle la posición del mínimo y la constante elástica efectiva.</p>
<details><summary>Solución</summary>
<p>\(U'(r)=0\Rightarrow r_0=2^{1/6}\sigma\). Derivando dos veces y evaluando, \(U''(r_0)=\dfrac{72\varepsilon}{2^{1/3}\sigma^2}\approx57.1\,\varepsilon/\sigma^2\). Para el argón (\(\varepsilon=1.65\times10^{-21}\) J, \(\sigma=0.34\) nm) resulta \(k\approx0.82\) N/m y, con la masa reducida \(\mu=m/2=3.3\times10^{-26}\) kg, \(\omega_0=\sqrt{k/\mu}\approx5\times10^{12}\) rad/s, en el infrarrojo lejano.</p>
</details>
</div>
</section>

<section>
<h2>Números complejos y fórmula de Euler</h2>
<p>Un número complejo \(z=a+\ii b\) (con \(\ii^2=-1\)) se representa como un punto del plano. En forma polar, \(z=r(\cos\theta+\ii\sen\theta)\), con módulo \(r=|z|=\sqrt{a^2+b^2}\) y argumento \(\theta=\arg z\). La identidad central de este curso es la <span class="term">fórmula de Euler</span>:</p>
<div class="eq key" data-name="Fórmula de Euler">\[\ee^{\ii\theta}=\cos\theta+\ii\sen\theta,\qquad \cos\theta=\frac{\ee^{\ii\theta}+\ee^{-\ii\theta}}{2},\qquad \sen\theta=\frac{\ee^{\ii\theta}-\ee^{-\ii\theta}}{2\ii}.\]</div>
<p>Se demuestra comparando las series de Taylor de las tres funciones. Sus consecuencias prácticas son enormes: multiplicar complejos equivale a multiplicar módulos y sumar argumentos, \(r_1\ee^{\ii\theta_1}\cdot r_2\ee^{\ii\theta_2}=r_1r_2\ee^{\ii(\theta_1+\theta_2)}\); derivar \(\ee^{\ii\omega t}\) respecto al tiempo equivale a multiplicar por \(\ii\omega\), es decir, a girar \(90^\circ\) y escalar por \(\omega\).</p>
<p>Si \(\theta=\omega t\), el punto \(\ee^{\ii\omega t}\) recorre la circunferencia unidad con velocidad angular \(\omega\); su parte real es una oscilación armónica. Esta es la conexión entre el movimiento circular uniforme y el movimiento armónico simple.</p>
<div class="sim" data-sim="euler-circle" data-title="Fórmula de Euler: un punto que gira y sus proyecciones"></div>
<div class="sim-guide"><ul>
<li>Observe que \(\cos\omega t\) y \(\sen\omega t\) son la misma curva desplazada un cuarto de período: \(\sen\omega t=\cos(\omega t-\pi/2)\).</li>
<li>Active la derivada: el vector \(\ii\omega\,\ee^{\ii\omega t}\) es siempre tangente a la circunferencia y va adelantado \(90^\circ\).</li>
<li>Con \(\sigma\lt0\) el punto describe una espiral hacia el origen: \(\ee^{(\sigma+\ii\omega)t}\) es una oscilación amortiguada.</li>
</ul></div>
</section>

<section>
<h2>Fasores</h2>
<p>Una oscilación armónica \(x(t)=A\cos(\omega t+\varphi)\) es la parte real de \(\tl{x}(t)=\tl{A}\,\ee^{\ii\omega t}\), donde \(\tl{A}=A\ee^{\ii\varphi}\) es la <span class="term">amplitud compleja</span> o <span class="term">fasor</span>. Toda la información (amplitud y fase) está en un solo número complejo.</p>
<div class="eq key" data-name="Representación fasorial">\[x(t)=A\cos(\omega t+\varphi)=\Rea\!\left[\tl{A}\,\ee^{\ii\omega t}\right],\qquad \tl{A}=A\,\ee^{\ii\varphi}.\]</div>
<p>Como la parte real es lineal, la suma de oscilaciones de la misma frecuencia es la suma de sus fasores: \(A_1\cos(\omega t+\varphi_1)+A_2\cos(\omega t+\varphi_2)=\Rea[(\tl A_1+\tl A_2)\ee^{\ii\omega t}]\). Sumando vectores en el plano complejo se obtiene</p>
<div class="eq">\[A^2=A_1^2+A_2^2+2A_1A_2\cos(\varphi_2-\varphi_1),\qquad \tg\varphi=\frac{A_1\sen\varphi_1+A_2\sen\varphi_2}{A_1\cos\varphi_1+A_2\cos\varphi_2}.\]</div>
<p>Este resultado es la base de la interferencia (capítulo 21): dos oscilaciones en fase suman sus amplitudes; en oposición, las restan.</p>
<div class="sim" data-sim="phasor-sum" data-title="Suma de fasores de la misma frecuencia"></div>
<div class="sim-guide"><ul>
<li>Con \(A_1=A_2\) y desfase \(180^\circ\) la suma se anula en todo instante: interferencia destructiva total.</li>
<li>Agregue un tercer fasor y busque una combinación de fases que dé suma nula (por ejemplo, tres fasores iguales a \(120^\circ\)): así funciona la red trifásica.</li>
</ul></div>
<div class="box warn">
<h4>Cuidado con los productos</h4>
<p>La parte real de un producto no es el producto de las partes reales. Para calcular energías o potencias (cuadráticas en \(x\)), hay que tomar la parte real <em>antes</em> de multiplicar, o usar el promedio temporal \(\langle\Rea(\tl a\ee^{\ii\omega t})\,\Rea(\tl b\ee^{\ii\omega t})\rangle=\tfrac12\Rea(\tl a\,\tl b^{*})\).</p>
</div>
</section>

<section>
<h2>Ecuaciones diferenciales lineales</h2>
<p>Las ecuaciones de movimiento de los osciladores de este curso tienen la forma</p>
<div class="eq key" data-name="Ecuación lineal de segundo orden">\[\ddot x+\gamma\dot x+\omega_0^2x=f(t),\]</div>
<p>con coeficientes constantes. Dos propiedades la vuelven tratable:</p>
<ul>
<li><strong>Superposición:</strong> si \(x_1\) y \(x_2\) resuelven la ecuación homogénea (\(f=0\)), también la resuelve \(c_1x_1+c_2x_2\). Si \(x_p\) es una solución particular con \(f\neq0\), la solución general es \(x=x_p+c_1x_1+c_2x_2\).</li>
<li><strong>Exponenciales como soluciones:</strong> probando \(x=\ee^{st}\) en la ecuación homogénea se obtiene la <span class="term">ecuación característica</span> \(s^2+\gamma s+\omega_0^2=0\), con raíces</li>
</ul>
<div class="eq">\[s_\pm=-\frac{\gamma}{2}\pm\sqrt{\frac{\gamma^2}{4}-\omega_0^2}.\]</div>
<p>La ubicación de las raíces en el plano complejo determina el comportamiento: raíces imaginarias puras (\(\gamma=0\)) dan oscilación sin pérdida; complejas con parte real negativa, oscilación amortiguada; reales negativas, decaimiento sin oscilar. Si alguna raíz tuviera parte real positiva, la solución crecería sin límite: el equilibrio sería inestable.</p>
<div class="sim" data-sim="char-roots" data-title="Raíces de la ecuación característica y forma de la solución"></div>
<div class="sim-guide"><ul>
<li>Aumente \(\gamma\) desde cero: las dos raíces se acercan al eje real por un arco de circunferencia de radio \(\omega_0\) y se juntan cuando \(\gamma=2\omega_0\) (amortiguamiento crítico).</li>
<li>Haga \(\omega_0^2\) negativo (un equilibrio en un máximo del potencial): una raíz se vuelve positiva y la solución diverge.</li>
</ul></div>
</section>

<section>
<h2>Aproximaciones de uso constante</h2>
<p>En física de oscilaciones se trabaja casi siempre con desplazamientos pequeños. Conviene tener a mano los primeros términos de algunas series (válidas para \(|x|\ll1\)):</p>
<div class="tablewrap narrow"><table>
<tr><th>Función</th><th class="c">Aproximación</th><th class="c">Primer término omitido</th></tr>
<tr><td>\(\sen x\)</td><td class="c">\(x\)</td><td class="c">\(-x^3/6\)</td></tr>
<tr><td>\(\cos x\)</td><td class="c">\(1-x^2/2\)</td><td class="c">\(x^4/24\)</td></tr>
<tr><td>\(\tg x\)</td><td class="c">\(x\)</td><td class="c">\(x^3/3\)</td></tr>
<tr><td>\((1+x)^n\)</td><td class="c">\(1+nx\)</td><td class="c">\(n(n-1)x^2/2\)</td></tr>
<tr><td>\(\ee^{x}\)</td><td class="c">\(1+x\)</td><td class="c">\(x^2/2\)</td></tr>
<tr><td>\(\ln(1+x)\)</td><td class="c">\(x\)</td><td class="c">\(-x^2/2\)</td></tr>
</table></div>
<p>Por ejemplo, para un ángulo de \(10^\circ=0.1745\) rad, \(\sen\theta=0.1736\): el error de la aproximación \(\sen\theta\approx\theta\) es apenas del 0.5 %.</p>
<div class="box ex">
<h4>Péndulo con hilo elástico en reposo</h4>
<p>Un resorte de constante \(k\) cuelga una masa \(m\). Muestre que la gravedad sólo desplaza el punto de equilibrio y no cambia la frecuencia.</p>
<details><summary>Solución</summary>
<p>\(m\ddot y=-ky+mg\). Con \(y=y_0+\xi\), \(y_0=mg/k\), queda \(m\ddot\xi=-k\xi\): la misma ecuación del resorte horizontal. La fuerza constante sólo cambia el equilibrio; el potencial total sigue siendo una parábola con la misma curvatura.</p>
</details>
</div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Escriba \(z=-1+\ii\sqrt3\) en forma polar y calcule \(z^6\).
<details><summary>Respuesta</summary><p>\(z=2\ee^{\ii2\pi/3}\); \(z^6=64\ee^{\ii4\pi}=64\).</p></details></li>
<li><span class="lvl">Básico</span>Exprese \(x(t)=3\cos\omega t+4\sen\omega t\) como \(A\cos(\omega t+\varphi)\).
<details><summary>Respuesta</summary><p>\(A=5\), \(\varphi=-\arctan(4/3)=-53.1^\circ\).</p></details></li>
<li><span class="lvl">Intermedio</span>Sume \(2\cos(\omega t)+2\cos(\omega t+2\pi/3)+2\cos(\omega t+4\pi/3)\) con fasores.
<details><summary>Respuesta</summary><p>Cero: los tres fasores forman un triángulo equilátero cerrado.</p></details></li>
<li><span class="lvl">Intermedio</span>Una partícula de masa \(m\) se mueve en \(U(x)=U_0\left(x^4/a^4-2x^2/a^2\right)\). Halle los equilibrios estables y la frecuencia de pequeñas oscilaciones alrededor de ellos.
<details><summary>Respuesta</summary><p>Mínimos en \(x=\pm a\) con \(U''=8U_0/a^2\): \(\omega_0=\sqrt{8U_0/(ma^2)}\). En \(x=0\) hay un máximo (inestable).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que \(\langle\Rea(\tl a\ee^{\ii\omega t})\,\Rea(\tl b\ee^{\ii\omega t})\rangle=\tfrac12\Rea(\tl a\tl b^*)\), donde \(\langle\cdot\rangle\) es el promedio sobre un período.
<details><summary>Respuesta</summary><p>Use \(\Rea w=(w+w^*)/2\); los términos con \(\ee^{\pm2\ii\omega t}\) promedian cero y quedan \((\tl a\tl b^*+\tl a^*\tl b)/4\).</p></details></li>
<li><span class="lvl">Avanzado</span>Resuelva \(\ddot x+4\dot x+13x=0\) con \(x(0)=1\), \(\dot x(0)=0\).
<details><summary>Respuesta</summary><p>\(s=-2\pm3\ii\); \(x=\ee^{-2t}\left(\cos3t+\tfrac23\sen3t\right)\).</p></details></li>
</ol>
</section>
</template>

<!-- 02-mas.html -->
<template class="chapter-src" data-id="mas" data-num="2" data-title="Movimiento armónico simple" data-part="Parte II · Oscilaciones de un grado de libertad" data-short="Masa y resorte, amplitud y fase, círculo de referencia, energía, espacio de fases y un zoológico de osciladores">
<p class="lead">El movimiento armónico simple (MAS) es la oscilación de un sistema con una fuerza restauradora proporcional al desplazamiento. Es el modelo exacto de un resorte ideal y la primera aproximación de cualquier sistema cerca de un equilibrio estable. Todo lo que sigue en el curso se construye sobre él.</p>

<section>
<h2>El sistema masa–resorte</h2>
<p>Un bloque de masa \(m\) sobre una superficie sin fricción está unido a un resorte ideal de constante \(k\). Si \(x\) mide el desplazamiento desde la posición de equilibrio, la ley de Hooke da \(F=-kx\) y la segunda ley de Newton:</p>
<div class="eq key" data-name="Ecuación del oscilador armónico">\[m\ddot x=-kx\quad\Longleftrightarrow\quad \ddot x+\omega_0^2x=0,\qquad \omega_0=\sqrt{\frac km}.\]</div>
<p>Las raíces características son \(s=\pm\ii\omega_0\), y la solución general real puede escribirse de tres formas equivalentes:</p>
<div class="eq key" data-name="Solución del MAS">\[x(t)=A\cos(\omega_0t+\varphi)=B\cos\omega_0t+C\sen\omega_0t=\Rea\!\left[\tl A\,\ee^{\ii\omega_0t}\right].\]</div>
<p>\(A\) es la <span class="term">amplitud</span>, \(\omega_0t+\varphi\) la <span class="term">fase</span> y \(\varphi\) la <span class="term">fase inicial</span>. El movimiento se repite con <span class="term">período</span> \(T=2\pi/\omega_0=2\pi\sqrt{m/k}\) y <span class="term">frecuencia</span> \(f=1/T\). El período <em>no depende de la amplitud</em>: esta propiedad, el <span class="term">isocronismo</span>, es exclusiva del potencial parabólico.</p>
<h3>Condiciones iniciales</h3>
<p>Dadas la posición \(x_0\) y la velocidad \(v_0\) en \(t=0\): \(B=x_0\), \(C=v_0/\omega_0\), y</p>
<div class="eq">\[A=\sqrt{x_0^2+\left(\frac{v_0}{\omega_0}\right)^2},\qquad \tg\varphi=-\frac{v_0}{\omega_0x_0}.\]</div>
<p>Derivando, la velocidad y la aceleración son también armónicas, adelantadas \(\pi/2\) y \(\pi\) respecto a la posición:</p>
<div class="eq">\[v=-\omega_0A\sen(\omega_0t+\varphi)=\omega_0A\cos\!\left(\omega_0t+\varphi+\tfrac\pi2\right),\qquad a=-\omega_0^2x.\]</div>
<div class="sim" data-sim="mass-spring" data-title="Masa y resorte: posición, velocidad y aceleración"></div>
<div class="sim-guide"><ul>
<li>Cuadruplique la masa: el período se duplica. Cambie la amplitud: el período no cambia.</li>
<li>Compare las tres gráficas: la velocidad es máxima donde la posición pasa por cero; la aceleración siempre tiene signo opuesto a la posición.</li>
<li>Pase al resorte vertical: la gravedad desplaza el equilibrio \(mg/k\) hacia abajo, pero el período es el mismo.</li>
</ul></div>
</section>

<section>
<h2>El círculo de referencia</h2>
<p>Un punto que recorre una circunferencia de radio \(A\) con velocidad angular constante \(\omega_0\) tiene coordenada \(x=A\cos(\omega_0t+\varphi)\). El MAS es la sombra de un movimiento circular uniforme. Este cuadro geométrico explica de inmediato por qué la velocidad máxima es \(\omega_0A\) (la rapidez del punto que gira) y la aceleración máxima \(\omega_0^2A\) (la aceleración centrípeta).</p>
<div class="sim" data-sim="shm-circle" data-title="El MAS como proyección de un movimiento circular uniforme"></div>
<div class="sim-guide"><ul>
<li>Active las flechas de velocidad y aceleración: sus proyecciones sobre el eje son exactamente \(v\) y \(a\) del oscilador.</li>
<li>Cambie la fase inicial: equivale a girar el punto de partida sobre la circunferencia.</li>
</ul></div>
</section>

<section>
<h2>Energía</h2>
<p>La energía mecánica del oscilador es la suma de la cinética y la potencial elástica:</p>
<div class="eq key" data-name="Energía del oscilador">\[E=\tfrac12m\dot x^2+\tfrac12kx^2=\tfrac12kA^2=\tfrac12m\omega_0^2A^2 .\]</div>
<p>Sustituyendo la solución, \(K=\tfrac12kA^2\sen^2(\omega_0t+\varphi)\) y \(U=\tfrac12kA^2\cos^2(\omega_0t+\varphi)\): la energía pasa de una forma a otra dos veces por período, y sus promedios temporales son iguales, \(\langle K\rangle=\langle U\rangle=E/2\). La conservación de la energía permite hallar la velocidad en cualquier posición sin conocer el tiempo:</p>
<div class="eq">\[v(x)=\pm\omega_0\sqrt{A^2-x^2}.\]</div>
<div class="sim" data-sim="shm-energy" data-title="Energía cinética y potencial en el pozo parabólico"></div>
<div class="sim-guide"><ul>
<li>Los puntos de retorno \(x=\pm A\) son donde la recta de energía total corta la parábola.</li>
<li>Observe el histograma de posiciones: el oscilador pasa más tiempo cerca de los extremos, donde se mueve despacio. Esa densidad, \(1/(\pi\sqrt{A^2-x^2})\), reaparece en mecánica cuántica como el límite clásico.</li>
</ul></div>
</section>

<section>
<h2>El espacio de fases</h2>
<p>El estado de un oscilador queda determinado por dos números: posición y velocidad (o momento \(p=m\dot x\)). En el plano \((x,p)\), la conservación de la energía obliga a la trayectoria a ser una elipse:</p>
<div class="eq">\[\frac{x^2}{2E/k}+\frac{p^2}{2mE}=1,\qquad \text{área}=\pi\sqrt{\frac{2E}{k}}\sqrt{2mE}=\frac{2\pi E}{\omega_0}=ET .\]</div>
<p>Todas las elipses se recorren en el mismo tiempo \(T\) y en sentido horario. Dos trayectorias nunca se cruzan, porque el estado actual determina el futuro de manera única. El espacio de fases será la herramienta principal para entender el amortiguamiento y el caos.</p>
<div class="sim" data-sim="phase-space" data-title="Retrato de fases del oscilador armónico"></div>
<div class="sim-guide"><ul>
<li>Haga clic en el plano para lanzar osciladores desde distintos estados: todos dan la vuelta al mismo tiempo, como un disco rígido que gira (en las variables \(x\) y \(p/m\omega_0\)).</li>
<li>Una nube de estados iniciales conserva su área al moverse (teorema de Liouville).</li>
</ul></div>
</section>

<section>
<h2>Un zoológico de osciladores</h2>
<p>Muchos sistemas físicos se reducen a la ecuación \(\ddot q+\omega_0^2q=0\) para alguna coordenada \(q\). La receta es siempre la misma: escribir la energía como \(\tfrac12\,m_{\text{ef}}\dot q^2+\tfrac12\,k_{\text{ef}}q^2\) y leer \(\omega_0=\sqrt{k_{\text{ef}}/m_{\text{ef}}}\).</p>
<div class="tablewrap"><table>
<tr><th>Sistema</th><th class="c">Coordenada</th><th class="c">\(\omega_0\)</th></tr>
<tr><td>Resortes en paralelo</td><td class="c">\(x\)</td><td class="c">\(\sqrt{(k_1+k_2)/m}\)</td></tr>
<tr><td>Resortes en serie</td><td class="c">\(x\)</td><td class="c">\(\sqrt{k_1k_2/[(k_1+k_2)m]}\)</td></tr>
<tr><td>Péndulo simple (pequeña amplitud)</td><td class="c">\(\theta\)</td><td class="c">\(\sqrt{g/\ell}\)</td></tr>
<tr><td>Líquido en un tubo en U</td><td class="c">desnivel</td><td class="c">\(\sqrt{2g/L}\)</td></tr>
<tr><td>Flotador cilíndrico</td><td class="c">hundimiento</td><td class="c">\(\sqrt{\rho_\ell gS/m}\)</td></tr>
<tr><td>Circuito LC</td><td class="c">carga \(q\)</td><td class="c">\(1/\sqrt{LC}\)</td></tr>
<tr><td>Péndulo de torsión</td><td class="c">ángulo</td><td class="c">\(\sqrt{\kappa/I}\)</td></tr>
<tr><td>Masa en el centro de un hilo tenso</td><td class="c">desplazamiento transversal</td><td class="c">\(\sqrt{4T/(mL)}\)</td></tr>
</table></div>
<div class="sim" data-sim="oscillator-zoo" data-title="Calculadora de osciladores con sus parámetros"></div>
<div class="box ex">
<h4>Masa del resorte</h4>
<p>Un resorte de masa \(m_s\) no es ideal. Suponiendo que cada elemento del resorte se desplaza proporcionalmente a su distancia al punto fijo, halle la frecuencia corregida.</p>
<details><summary>Solución</summary>
<p>Un elemento a distancia \(s\) del extremo fijo (longitud \(L\)) tiene velocidad \(\dot x\,s/L\). Su energía cinética total es \(\int_0^L\tfrac12\frac{m_s}{L}\left(\dot x\frac sL\right)^2\dd s=\tfrac12\frac{m_s}{3}\dot x^2\). La masa efectiva es \(m+m_s/3\), y \(\omega_0=\sqrt{k/(m+m_s/3)}\).</p>
</details>
</div>
<div class="box ex">
<h4>Un túnel a través de la Tierra</h4>
<p>Si se perforara un túnel recto que atravesara una Tierra homogénea, ¿cuánto tardaría un objeto en cruzarla partiendo del reposo?</p>
<details><summary>Solución</summary>
<p>Dentro de una esfera homogénea, \(g(r)=g\,r/R\). La componente a lo largo del túnel es \(-g\,x/R\), así que \(\omega_0=\sqrt{g/R}\) para cualquier túnel recto. El cruce es medio período: \(\pi\sqrt{R/g}=\pi\sqrt{6.37\times10^6/9.81}\approx2530\) s \(\approx42\) min.</p>
</details>
</div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una masa de 0.50 kg en un resorte de 200 N/m se suelta desde 4.0 cm. Halle \(\omega_0\), \(T\), la velocidad máxima y la aceleración máxima.
<details><summary>Respuesta</summary><p>\(\omega_0=20\) rad/s; \(T=0.314\) s; \(v_{\max}=0.80\) m/s; \(a_{\max}=16\) m/s².</p></details></li>
<li><span class="lvl">Básico</span>Un oscilador tiene \(x(0)=3\) cm y \(v(0)=-40\) cm/s con \(\omega_0=10\) rad/s. Halle la amplitud y la fase inicial.
<details><summary>Respuesta</summary><p>\(A=5\) cm; \(\varphi=+53.1^\circ\) (\(\tg\varphi=4/3\) con \(\cos\varphi\gt0\)).</p></details></li>
<li><span class="lvl">Intermedio</span>¿En qué posición la energía cinética es igual a la potencial? ¿Y en qué fracción del período se pasa de \(x=0\) a esa posición?
<details><summary>Respuesta</summary><p>\(x=\pm A/\sqrt2\); se tarda \(T/8\).</p></details></li>
<li><span class="lvl">Intermedio</span>Un cilindro de madera (\(\rho=600\) kg/m³, altura 20 cm) flota vertical en agua. Halle el período de sus oscilaciones verticales.
<details><summary>Respuesta</summary><p>\(\omega_0=\sqrt{\rho_\ell g/(\rho h)}=\sqrt{g/0.12\text{ m}}=9.04\) rad/s; \(T=0.69\) s.</p></details></li>
<li><span class="lvl">Intermedio</span>Una columna de mercurio de 40 cm de longitud total oscila en un tubo en U. Halle el período.
<details><summary>Respuesta</summary><p>\(T=2\pi\sqrt{L/2g}=0.90\) s.</p></details></li>
<li><span class="lvl">Avanzado</span>Una masa \(m\) está en el centro de un hilo de longitud \(L\) con tensión \(T_0\). Demuestre que las oscilaciones transversales pequeñas tienen \(\omega_0=\sqrt{4T_0/(mL)}\) y explique por qué esta aproximación falla para amplitudes comparables a \(L\).
<details><summary>Respuesta</summary><p>Cada mitad tira con componente transversal \(T_0\,y/(L/2)\); la suma es \(-4T_0y/L\). Para grandes amplitudes, el hilo se estira y la tensión aumenta: aparece un término cúbico en \(y\).</p></details></li>
</ol>
</section>

<!-- 03-pendulos.html -->
<template class="chapter-src" data-id="pendulos" data-num="3" data-title="Péndulos y oscilaciones en un pozo de potencial" data-part="Parte II · Oscilaciones de un grado de libertad" data-short="Péndulo simple, período exacto, péndulo físico y reversible, isocronismo de Huygens y potenciales arbitrarios">
<p class="lead">El péndulo fue el primer reloj de precisión y el primer instrumento para medir la gravedad. Su ecuación de movimiento no es lineal: sólo para ángulos pequeños se convierte en un oscilador armónico. Estudiarlo con cuidado enseña a reconocer cuándo funciona la aproximación armónica y qué ocurre cuando falla.</p>

<section>
<h2>El péndulo simple</h2>
<p>Una masa puntual \(m\) cuelga de un hilo inextensible de longitud \(\ell\) y masa despreciable. La única coordenada es el ángulo \(\theta\) con la vertical. Tomando momentos respecto al punto de suspensión, o derivando la energía \(E=\tfrac12m\ell^2\dot\theta^2+mg\ell(1-\cos\theta)\):</p>
<div class="eq key" data-name="Ecuación del péndulo">\[\ddot\theta+\frac g\ell\sen\theta=0 .\]</div>
<p>La ecuación es no lineal por el seno. Para \(|\theta|\ll1\), \(\sen\theta\approx\theta\) y se recupera el MAS:</p>
<div class="eq key" data-name="Péndulo de pequeña amplitud">\[\ddot\theta+\omega_0^2\theta=0,\qquad \omega_0=\sqrt{\frac g\ell},\qquad T_0=2\pi\sqrt{\frac\ell g}.\]</div>
<p>El período no depende de la masa (consecuencia de la equivalencia entre masa inercial y gravitatoria) ni, en esta aproximación, de la amplitud. Un péndulo de 1 m tiene \(T_0\approx2.006\) s: es casi un «péndulo que bate segundos».</p>
<div class="sim" data-sim="pendulum-exact" data-title="Péndulo real frente a su aproximación lineal"></div>
<div class="sim-guide"><ul>
<li>Con \(\theta_0=10^\circ\) los dos péndulos siguen juntos durante muchas oscilaciones; con \(60^\circ\) el real se retrasa visiblemente.</li>
<li>Suelte el péndulo desde \(179^\circ\): tarda muchísimo en «decidir» hacia dónde caer, porque arranca cerca del equilibrio inestable.</li>
<li>Dé una velocidad inicial suficiente y el péndulo da vueltas completas: el movimiento deja de ser oscilatorio.</li>
</ul></div>
</section>

<section>
<h2>El período exacto</h2>
<p>La conservación de la energía con amplitud \(\theta_0\) da \(\dot\theta^2=2\omega_0^2(\cos\theta-\cos\theta_0)\). El período es cuatro veces el tiempo de ir de \(0\) a \(\theta_0\):</p>
<div class="eq">\[T=4\int_0^{\theta_0}\frac{\dd\theta}{\omega_0\sqrt{2(\cos\theta-\cos\theta_0)}} .\]</div>
<p>Con el cambio \(\sen(\theta/2)=k\sen u\), \(k=\sen(\theta_0/2)\), la integral se convierte en la <span class="term">integral elíptica completa de primera especie</span>:</p>
<div class="eq key" data-name="Período del péndulo de amplitud finita">\[T=\frac{4}{\omega_0}K(k)=T_0\,\frac{2}{\pi}\int_0^{\pi/2}\frac{\dd u}{\sqrt{1-k^2\sen^2u}}\approx T_0\left(1+\frac{\theta_0^2}{16}+\frac{11\,\theta_0^4}{3072}+\cdots\right).\]</div>
<p>A \(15^\circ\) el período es apenas un 0.43 % mayor que \(T_0\); a \(90^\circ\), un 18 %; y tiende a infinito cuando \(\theta_0\to180^\circ\). Los relojes de péndulo se diseñaban con amplitudes pequeñas y constantes por esta razón.</p>
<div class="sim" data-sim="pendulum-period" data-title="Período en función de la amplitud"></div>
<div class="box hist">
<h4>Huygens y el péndulo cicloidal</h4>
<p>En 1673 Christiaan Huygens demostró que una partícula que desliza sin fricción por una cicloide invertida tarda lo mismo en llegar al fondo desde cualquier altura: la cicloide es la curva <em>tautócrona</em>. Colocando «mejillas» cicloidales a los lados del hilo, el péndulo describe una cicloide y su período es exactamente independiente de la amplitud. En la práctica, la fricción de las mejillas resultó peor que la falta de isocronismo.</p>
</div>
</section>

<section>
<h2>El péndulo físico</h2>
<p>Un cuerpo rígido de masa \(m\) que oscila alrededor de un eje horizontal fijo, con su centro de masa a distancia \(d\) del eje y momento de inercia \(I\) respecto al eje, cumple \(I\ddot\theta=-mgd\sen\theta\). Para ángulos pequeños:</p>
<div class="eq key" data-name="Péndulo físico">\[\omega_0=\sqrt{\frac{mgd}{I}},\qquad T_0=2\pi\sqrt{\frac{I}{mgd}}=2\pi\sqrt{\frac{\ell_{\text{eq}}}{g}},\qquad \ell_{\text{eq}}=\frac{I}{md}=d+\frac{I_{cm}}{md}.\]</div>
<p>La <span class="term">longitud equivalente</span> \(\ell_{\text{eq}}\) es la del péndulo simple con el mismo período. El punto situado a esa distancia del eje, en la recta que pasa por el centro de masa, es el <span class="term">centro de oscilación</span>. Usando el teorema de Steiner (\(I=I_{cm}+md^2\)) se ve que el período, en función de \(d\), tiene un mínimo cuando \(d\) es igual al radio de giro \(\kappa=\sqrt{I_{cm}/m}\).</p>
<h3>El péndulo reversible de Kater</h3>
<p>Si el cuerpo se cuelga del centro de oscilación, el período es el mismo: el eje y el centro de oscilación son intercambiables. Henry Kater (1817) aprovechó esta propiedad: un péndulo con dos cuchillas ajustables hasta que los períodos coinciden permite medir \(g=4\pi^2\ell_{\text{eq}}/T^2\) midiendo sólo la distancia entre cuchillas y el período, sin conocer \(I\) ni la posición del centro de masa.</p>
<div class="sim" data-sim="physical-pendulum" data-title="Péndulo físico: período en función de la posición del eje"></div>
<div class="sim-guide"><ul>
<li>Recorra la posición del eje: el período es mínimo cuando \(d=\kappa\), y tiende a infinito cuando el eje pasa por el centro de masa.</li>
<li>Para cada período por encima del mínimo hay dos valores de \(d\) a cada lado; su suma es \(\ell_{\text{eq}}\).</li>
</ul></div>
<div class="box ex">
<h4>Varilla colgada de un extremo</h4>
<p>Una varilla uniforme de longitud \(L=1.00\) m oscila alrededor de un extremo. Halle el período y la longitud equivalente.</p>
<details><summary>Solución</summary>
<p>\(I=mL^2/3\), \(d=L/2\): \(\ell_{\text{eq}}=\dfrac{mL^2/3}{mL/2}=\dfrac23L=0.667\) m y \(T_0=2\pi\sqrt{0.667/9.81}=1.64\) s. El centro de oscilación está a \(2L/3\) del extremo; si la varilla se cuelga de ese punto, su período también es 1.64 s.</p>
</details>
</div>
</section>

<section>
<h2>Oscilaciones en un potencial arbitrario</h2>
<p>Para una partícula en un pozo \(U(x)\) con energía \(E\), la conservación de la energía da la velocidad \(v(x)=\sqrt{2[E-U(x)]/m}\). El período es el tiempo de ida y vuelta entre los puntos de retorno \(x_1\), \(x_2\) (donde \(U=E\)):</p>
<div class="eq key" data-name="Período en un pozo arbitrario">\[T(E)=2\int_{x_1}^{x_2}\frac{\dd x}{\sqrt{\dfrac2m\left[E-U(x)\right]}} .\]</div>
<p>Sólo en el pozo parabólico \(T\) es independiente de \(E\). En un pozo que se abre más rápido que la parábola (como el del péndulo o el de Morse) el período crece con la energía; en uno que se cierra más rápido (como \(x^4\)) disminuye. En todos los casos, para \(E\) cercana al mínimo, \(T\to2\pi\sqrt{m/U''(x_0)}\).</p>
<div class="sim" data-sim="potential-well" data-title="Partícula en un pozo de potencial: período exacto y aproximación armónica"></div>
<div class="sim-guide"><ul>
<li>En el pozo cuártico \(U\propto x^4\), el período es inversamente proporcional a la amplitud: no existe una frecuencia «natural».</li>
<li>En el potencial de Morse (enlace químico), al acercarse a la energía de disociación el período crece sin límite y la partícula termina escapando.</li>
<li>En el doble pozo, si \(E\) supera la barrera central la partícula pasa de un pozo al otro y el período salta.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Qué longitud debe tener un péndulo simple para que su período sea exactamente 1 s en Popayán (\(g=9.776\) m/s²)?
<details><summary>Respuesta</summary><p>\(\ell=gT^2/4\pi^2=0.2476\) m.</p></details></li>
<li><span class="lvl">Básico</span>Un péndulo de 2.00 m se suelta desde \(30^\circ\). Halle el período exacto y compárelo con \(T_0\).
<details><summary>Respuesta</summary><p>\(T_0=2.837\) s; \(T=T_0\cdot1.0174=2.886\) s (1.7 % mayor).</p></details></li>
<li><span class="lvl">Intermedio</span>Un aro de radio \(R\) cuelga de un clavo y oscila en su plano. Halle el período.
<details><summary>Respuesta</summary><p>\(I=2mR^2\), \(d=R\): \(T=2\pi\sqrt{2R/g}\); \(\ell_{\text{eq}}=2R\).</p></details></li>
<li><span class="lvl">Intermedio</span>¿Cuánto se atrasa por día un reloj de péndulo ajustado a \(5^\circ\) de amplitud si la amplitud aumenta a \(6^\circ\)?
<details><summary>Respuesta</summary><p>\(\Delta T/T\approx(\theta_2^2-\theta_1^2)/16=(0.1047^2-0.0873^2)/16=2.1\times10^{-4}\); unos 18 s por día.</p></details></li>
<li><span class="lvl">Avanzado</span>Una partícula de masa \(m\) se mueve en \(U=\alpha x^4\). Demuestre que \(T\propto1/A\) y halle la constante usando la integral del período.
<details><summary>Respuesta</summary><p>Con \(x=Au\): \(T=\dfrac{4}{A}\sqrt{\dfrac{m}{2\alpha}}\displaystyle\int_0^1\frac{\dd u}{\sqrt{1-u^4}}=\dfrac{5.244}{A}\sqrt{\dfrac m{2\alpha}}\), porque la integral vale 1.311.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que un disco de radio \(R\) colgado de un punto a distancia \(d\) de su centro tiene período mínimo para \(d=R/\sqrt2\) y halle ese período.
<details><summary>Respuesta</summary><p>\(\ell_{\text{eq}}=d+R^2/(2d)\), mínimo en \(d=R/\sqrt2\) con \(\ell_{\text{eq}}=\sqrt2R\): \(T_{\min}=2\pi\sqrt{\sqrt2R/g}\).</p></details></li>
</ol>
</section>
</template>

<!-- 04-amortiguadas.html -->
<template class="chapter-src" data-id="amortiguadas" data-num="4" data-title="Oscilaciones amortiguadas" data-part="Parte II · Oscilaciones de un grado de libertad" data-short="Fricción viscosa, tres regímenes, decremento logarítmico, factor de calidad y fricción seca">
<p class="lead">Ningún oscilador real oscila para siempre: la fricción con el aire, la deformación interna de los materiales o la resistencia eléctrica disipan su energía. El modelo más útil, y el único que conserva la linealidad, es una fuerza disipativa proporcional a la velocidad.</p>

<section>
<h2>La ecuación del oscilador amortiguado</h2>
<p>A la fuerza del resorte se agrega una fuerza de fricción viscosa \(F_f=-b\dot x\), típica de un objeto que se mueve lentamente en un fluido o de un amortiguador hidráulico. La segunda ley de Newton da</p>
<div class="eq key" data-name="Oscilador amortiguado">\[m\ddot x+b\dot x+kx=0\quad\Longleftrightarrow\quad\ddot x+\gamma\dot x+\omega_0^2x=0,\qquad \gamma=\frac bm,\ \ \omega_0=\sqrt{\frac km}.\]</div>
<p>La constante \(\gamma\) (en s⁻¹) mide la intensidad del amortiguamiento. Las raíces características son \(s=-\gamma/2\pm\sqrt{\gamma^2/4-\omega_0^2}\), y el signo del discriminante separa tres regímenes:</p>
<div class="tablewrap"><table>
<tr><th>Régimen</th><th class="c">Condición</th><th class="c">Solución</th></tr>
<tr><td>Subamortiguado</td><td class="c">\(\gamma\lt2\omega_0\)</td><td class="c">\(x=A\ee^{-\gamma t/2}\cos(\omega_dt+\varphi)\)</td></tr>
<tr><td>Crítico</td><td class="c">\(\gamma=2\omega_0\)</td><td class="c">\(x=(C_1+C_2t)\ee^{-\omega_0t}\)</td></tr>
<tr><td>Sobreamortiguado</td><td class="c">\(\gamma\gt2\omega_0\)</td><td class="c">\(x=C_1\ee^{-\beta_1t}+C_2\ee^{-\beta_2t}\)</td></tr>
</table></div>
<p>donde \(\omega_d=\sqrt{\omega_0^2-\gamma^2/4}\) es la <span class="term">frecuencia amortiguada</span> y \(\beta_{1,2}=\gamma/2\mp\sqrt{\gamma^2/4-\omega_0^2}\). Con frecuencia se usa la <span class="term">razón de amortiguamiento</span> \(\zeta=\gamma/(2\omega_0)\): el régimen crítico corresponde a \(\zeta=1\).</p>
<div class="sim" data-sim="damped-regimes" data-title="Los tres regímenes del oscilador amortiguado"></div>
<div class="sim-guide"><ul>
<li>Con \(\zeta=0.1\) la masa oscila muchas veces dentro de la envolvente \(\pm A\ee^{-\gamma t/2}\); en el espacio de fases la trayectoria es una espiral hacia el origen.</li>
<li>En el régimen sobreamortiguado, según la velocidad inicial, la masa puede cruzar el equilibrio <em>una vez</em>, pero nunca oscila.</li>
<li>Observe que \(\omega_d\) apenas difiere de \(\omega_0\) cuando el amortiguamiento es débil: con \(\zeta=0.1\), sólo un 0.5 %.</li>
</ul></div>
</section>

<section>
<h2>Amortiguamiento débil: decremento logarítmico</h2>
<p>En el régimen subamortiguado los máximos sucesivos, separados un período \(T_d=2\pi/\omega_d\), están en razón constante:</p>
<div class="eq key" data-name="Decremento logarítmico">\[\frac{x_n}{x_{n+1}}=\ee^{\gamma T_d/2},\qquad \delta\equiv\ln\frac{x_n}{x_{n+1}}=\frac{\gamma T_d}{2}=\frac{\pi\gamma}{\omega_d}.\]</div>
<p>Midiendo dos máximos separados \(N\) ciclos, \(\delta=\tfrac1N\ln(x_0/x_N)\). Así se determina experimentalmente \(\gamma\) sin conocer \(b\) ni \(m\). La amplitud decae a \(1/\ee\) en el <span class="term">tiempo de relajación</span> \(\tau_A=2/\gamma\).</p>
<div class="box ex">
<h4>Medida del amortiguamiento de un péndulo</h4>
<p>Un péndulo de período 2.0 s se suelta con 10° de amplitud. Después de 50 oscilaciones la amplitud es 6°. Halle \(\delta\), \(\gamma\) y el tiempo en que la amplitud cae a 1°.</p>
<details><summary>Solución</summary>
<p>\(\delta=\tfrac1{50}\ln(10/6)=0.0102\); \(\gamma=2\delta/T=0.0102\) s⁻¹. La amplitud cae a 1° cuando \(\ee^{-\gamma t/2}=0.1\): \(t=2\ln10/\gamma=450\) s, unas 225 oscilaciones.</p>
</details>
</div>
</section>

<section>
<h2>Energía y factor de calidad</h2>
<p>La potencia disipada por la fricción es \(\dd E/\dd t=-b\dot x^2\). Para amortiguamiento débil, promediando sobre un ciclo (\(\langle\dot x^2\rangle=E/m\)):</p>
<div class="eq">\[\frac{\dd E}{\dd t}=-\gamma E\quad\Rightarrow\quad E(t)=E_0\,\ee^{-\gamma t}.\]</div>
<p>La energía decae al doble de ritmo que la amplitud. La calidad de un oscilador se resume en un número adimensional, el <span class="term">factor de calidad</span>:</p>
<div class="eq key" data-name="Factor de calidad">\[Q=\frac{\omega_0}{\gamma}=2\pi\,\frac{\text{energía almacenada}}{\text{energía perdida por ciclo}}=\frac{1}{2\zeta}.\]</div>
<p>La amplitud cae a \(1/\ee\) en \(Q/\pi\) oscilaciones, y la energía, en \(Q\) radianes de fase. Valores típicos:</p>
<div class="tablewrap narrow"><table>
<tr><th>Oscilador</th><th class="c">\(Q\) aproximado</th></tr>
<tr><td>Amortiguador de automóvil</td><td class="c">0.5</td></tr>
<tr><td>Cuerda de guitarra</td><td class="c">\(10^3\)</td></tr>
<tr><td>Péndulo de reloj</td><td class="c">\(10^4\)</td></tr>
<tr><td>Diapasón</td><td class="c">\(10^3\) – \(10^4\)</td></tr>
<tr><td>Cristal de cuarzo de reloj</td><td class="c">\(10^5\) – \(10^6\)</td></tr>
<tr><td>Cavidad superconductora de microondas</td><td class="c">\(10^{10}\)</td></tr>
<tr><td>Transición atómica de un reloj óptico</td><td class="c">\(10^{17}\)</td></tr>
</table></div>
<div class="sim" data-sim="damped-energy" data-title="Decaimiento de la energía y factor de calidad"></div>
<div class="sim-guide"><ul>
<li>En escala logarítmica, la energía cae en línea recta con pendiente \(-\gamma\). Los escalones visibles se deben al intercambio entre energía cinética y potencial: la pérdida es mayor cuando la velocidad es máxima.</li>
<li>Escuche el oscilador con \(Q=10\) y con \(Q=1000\): un golpe en madera frente a una campana.</li>
</ul></div>
</section>

<section>
<h2>Amortiguamiento crítico y diseño</h2>
<p>En muchos dispositivos se quiere que el sistema vuelva al equilibrio lo antes posible sin oscilar: la aguja de un instrumento analógico, la suspensión de un vehículo, una puerta con cierre automático. El régimen crítico es el que regresa más rápido sin sobrepasar el equilibrio. En la práctica se elige \(\zeta\approx0.6\)–\(0.7\): se acepta un sobrepaso pequeño (del 5 % o menos) a cambio de una respuesta todavía más rápida.</p>
<div class="sim" data-sim="settling-time" data-title="Tiempo de asentamiento en función del amortiguamiento"></div>
<div class="sim-guide"><ul>
<li>Busque el valor de \(\zeta\) que minimiza el tiempo en que la masa queda dentro de la banda de tolerancia. Cambie la tolerancia y observe cómo se mueve el óptimo.</li>
<li>Con amortiguamiento muy grande la respuesta vuelve a ser lenta: el amortiguador «frena» el regreso. El tiempo característico es entonces \(\gamma/\omega_0^2\).</li>
</ul></div>
</section>

<section>
<h2>Fricción seca</h2>
<p>Cuando el bloque roza sobre una superficie, la fuerza de fricción cinética tiene magnitud constante \(\mu_kmg\) y se opone a la velocidad. En cada medio ciclo la ecuación es la de un MAS con el equilibrio desplazado a \(\pm\mu_kmg/k\). El resultado es muy distinto al del amortiguamiento viscoso:</p>
<div class="eq key" data-name="Decaimiento con fricción seca">\[A_{n+1}=A_n-\frac{4\mu_kg}{\omega_0^2}\qquad\text{(por ciclo completo)}.\]</div>
<p>La amplitud decrece <em>linealmente</em> (no exponencialmente), el período no cambia, y el movimiento se detiene en un número finito de ciclos, cuando el resorte ya no logra vencer la fricción estática: \(|x|\le\mu_smg/k\). El bloque puede quedar detenido fuera del equilibrio.</p>
<div class="sim" data-sim="coulomb-friction" data-title="Fricción seca frente a fricción viscosa"></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un oscilador con \(m=0.2\) kg, \(k=80\) N/m y \(b=0.4\) kg/s. Halle \(\omega_0\), \(\gamma\), \(\omega_d\), \(Q\) y el régimen.
<details><summary>Respuesta</summary><p>\(\omega_0=20\) rad/s; \(\gamma=2\) s⁻¹; \(\omega_d=19.97\) rad/s; \(Q=10\); subamortiguado.</p></details></li>
<li><span class="lvl">Básico</span>¿Qué valor de \(b\) produce amortiguamiento crítico en el problema anterior?
<details><summary>Respuesta</summary><p>\(b=2\sqrt{km}=8\) kg/s.</p></details></li>
<li><span class="lvl">Intermedio</span>Un diapasón de 440 Hz tarda 20 s en reducir su energía sonora a la mitad. Halle \(\gamma\) y \(Q\).
<details><summary>Respuesta</summary><p>\(\gamma=\ln2/20=0.0347\) s⁻¹; \(Q=2\pi\cdot440/0.0347=8.0\times10^4\).</p></details></li>
<li><span class="lvl">Intermedio</span>Un automóvil de 1200 kg baja 3.0 cm cuando suben cuatro personas de 75 kg. Halle la constante de la suspensión y la constante de amortiguamiento para \(\zeta=0.7\) (con las personas).
<details><summary>Respuesta</summary><p>\(k=300\cdot9.8/0.03=9.8\times10^4\) N/m; \(b=2\zeta\sqrt{km}=2(0.7)\sqrt{9.8\times10^4\cdot1500}=1.70\times10^4\) kg/s.</p></details></li>
<li><span class="lvl">Intermedio</span>Un bloque en un resorte (\(\omega_0=10\) rad/s) con \(\mu_k=0.1\) se suelta desde 20 cm. ¿Cuántos medios ciclos completa?
<details><summary>Respuesta</summary><p>Pérdida por medio ciclo \(2\mu_kg/\omega_0^2=1.96\) cm; tras 10 medios ciclos la amplitud es 0.4 cm, menor que \(\mu g/\omega_0^2=0.98\) cm (si \(\mu_s=\mu_k\)): se detiene tras 10 medios ciclos.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que, en el régimen crítico con \(x(0)=x_0\) y \(\dot x(0)=0\), la solución es \(x=x_0(1+\omega_0t)\ee^{-\omega_0t}\) y que nunca cruza el equilibrio. ¿Qué velocidad inicial negativa mínima hace que sí lo cruce?
<details><summary>Respuesta</summary><p>Con \(\dot x(0)=v_0\): \(x=[x_0+(v_0+\omega_0x_0)t]\ee^{-\omega_0t}\). Cruza cero si \(v_0\lt-\omega_0x_0\).</p></details></li>
</ol>
</section>

<!-- 05-forzadas.html -->
<template class="chapter-src" data-id="forzadas" data-num="5" data-title="Oscilaciones forzadas y resonancia" data-part="Parte II · Oscilaciones de un grado de libertad" data-short="Transitorio y régimen estacionario, curvas de resonancia, potencia absorbida, ancho de banda y aislamiento de vibraciones">
<p class="lead">Cuando una fuerza periódica actúa sobre un oscilador, éste termina vibrando a la frecuencia de la fuerza, no a la suya. Pero la amplitud de esa respuesta depende dramáticamente de qué tan cerca esté la frecuencia impuesta de la natural: es la resonancia, responsable de que una copa se rompa con la voz, de que una radio sintonice una sola emisora y de que un columpio suba empujándolo poco a poco.</p>

<section>
<h2>La ecuación del oscilador forzado</h2>
<p>Agregando una fuerza externa \(F_0\cos\omega t\) al oscilador amortiguado:</p>
<div class="eq key" data-name="Oscilador forzado">\[\ddot x+\gamma\dot x+\omega_0^2x=\frac{F_0}{m}\cos\omega t .\]</div>
<p>Por la linealidad, la solución general es la suma de una solución particular y la solución general de la ecuación homogénea:</p>
<div class="eq">\[x(t)=\underbrace{A(\omega)\cos(\omega t-\delta)}_{\text{estacionaria}}+\underbrace{C\ee^{-\gamma t/2}\cos(\omega_dt+\varphi)}_{\text{transitorio}} .\]</div>
<p>El transitorio depende de las condiciones iniciales y se extingue en un tiempo del orden de \(2/\gamma\). Lo que queda, el <span class="term">régimen estacionario</span>, oscila a la frecuencia de la fuerza \(\omega\) con una amplitud y un desfase que sólo dependen de \(\omega\) y de los parámetros del oscilador.</p>
<div class="sim" data-sim="forced-transient" data-title="Transitorio y régimen estacionario"></div>
<div class="sim-guide"><ul>
<li>Con \(Q\) alto y \(\omega\) cercana a \(\omega_0\), al principio aparecen batimientos entre la frecuencia natural (el transitorio) y la de la fuerza; desaparecen en un tiempo \(\sim2Q/\omega_0\).</li>
<li>Exactamente en resonancia y sin amortiguamiento, la amplitud crece linealmente con el tiempo: \(x=\dfrac{F_0}{2m\omega_0}\,t\,\sen\omega_0t\).</li>
</ul></div>
</section>

<section>
<h2>Amplitud y fase en el régimen estacionario</h2>
<p>Con fasores: se busca \(x=\Rea[\tl A\ee^{\ii\omega t}]\) para la fuerza \(\Rea[(F_0/m)\ee^{\ii\omega t}]\). Sustituyendo, \((-\omega^2+\ii\gamma\omega+\omega_0^2)\tl A=F_0/m\), es decir,</p>
<div class="eq key" data-name="Respuesta estacionaria">\[\tl A=\frac{F_0/m}{\omega_0^2-\omega^2+\ii\gamma\omega},\qquad A(\omega)=\frac{F_0/m}{\sqrt{(\omega_0^2-\omega^2)^2+\gamma^2\omega^2}},\qquad \tg\delta=\frac{\gamma\omega}{\omega_0^2-\omega^2}.\]</div>
<p>El desfase \(\delta\) (el retraso de la respuesta respecto a la fuerza) va de 0 a \(\pi\). Hay tres zonas:</p>
<ul>
<li><strong>\(\omega\ll\omega_0\) (zona elástica):</strong> \(A\approx F_0/k\), \(\delta\approx0\). El resorte domina; la masa sigue a la fuerza como si el sistema fuera estático.</li>
<li><strong>\(\omega\approx\omega_0\) (resonancia):</strong> \(A\approx F_0/(m\gamma\omega_0)=Q\,F_0/k\), \(\delta=\pi/2\). La fricción es lo único que limita la amplitud; la respuesta es \(Q\) veces la estática.</li>
<li><strong>\(\omega\gg\omega_0\) (zona inercial):</strong> \(A\approx F_0/(m\omega^2)\), \(\delta\approx\pi\). La inercia domina; la masa se mueve en oposición a la fuerza.</li>
</ul>
<p>El máximo de amplitud ocurre en \(\omega_r=\sqrt{\omega_0^2-\gamma^2/2}\), ligeramente por debajo de \(\omega_0\); existe sólo si \(Q\gt1/\sqrt2\).</p>
<div class="sim" data-sim="resonance-curves" data-title="Curvas de resonancia: amplitud y desfase"></div>
<div class="sim-guide"><ul>
<li>Pase \(\omega\) por la resonancia y mire la animación: el bloque pasa de moverse con la fuerza a moverse contra ella. En resonancia la fuerza va adelantada un cuarto de ciclo: empuja siempre a favor de la velocidad.</li>
<li>Aumente \(Q\): el pico se vuelve más alto y más estrecho, y el salto de fase, más brusco.</li>
</ul></div>
</section>

<section>
<h2>Potencia absorbida y ancho de banda</h2>
<p>La potencia que la fuerza entrega en promedio es igual a la que disipa la fricción:</p>
<div class="eq">\[\langle P\rangle=\langle F\dot x\rangle=\tfrac12F_0\,\omega A\sen\delta=\frac{F_0^2}{2m}\,\frac{\gamma\omega^2}{(\omega_0^2-\omega^2)^2+\gamma^2\omega^2}.\]</div>
<p>Su máximo está exactamente en \(\omega=\omega_0\) y vale \(F_0^2/(2m\gamma)\). Cerca de la resonancia, con \(\omega_0^2-\omega^2\approx2\omega_0(\omega_0-\omega)\), la curva es una <span class="term">lorentziana</span>:</p>
<div class="eq key" data-name="Lorentziana y ancho de banda">\[\langle P\rangle\approx P_{\max}\,\frac{(\gamma/2)^2}{(\omega-\omega_0)^2+(\gamma/2)^2},\qquad \Delta\omega_{1/2}=\gamma,\qquad Q=\frac{\omega_0}{\Delta\omega_{1/2}}.\]</div>
<p>El ancho de la curva a media potencia es \(\gamma\). Esto da una segunda lectura del factor de calidad: \(Q\) mide la <em>selectividad</em> del oscilador. Un circuito sintonizado de radio con \(Q=100\) a 1 MHz tiene un ancho de banda de 10 kHz, suficiente para separar emisoras vecinas.</p>
<div class="box note">
<h4>Dos caras del mismo número</h4>
<p>Un oscilador muy selectivo (\(Q\) alto) necesita mucho tiempo para responder: su transitorio dura \(\sim Q\) períodos. La relación \(\Delta\omega\cdot\tau_E=1\), entre ancho de banda y tiempo de vida de la energía, es un primer encuentro con el principio de incertidumbre de las ondas (capítulo 15).</p>
</div>
<div class="sim" data-sim="power-resonance" data-title="Potencia absorbida, lorentziana y ancho de banda"></div>
</section>

<section>
<h2>Aislamiento de vibraciones y sismógrafos</h2>
<p>Con frecuencia la excitación no es una fuerza sino un movimiento de la base: una máquina sobre un piso que vibra, un edificio durante un sismo, un automóvil sobre un camino ondulado. Si la base se mueve como \(y=Y\cos\omega t\) y la masa está unida a ella por un resorte y un amortiguador, la ecuación para \(x\) es \(\ddot x+\gamma(\dot x-\dot y)+\omega_0^2(x-y)=0\). La razón de amplitudes, o <span class="term">transmisibilidad</span>, es</p>
<div class="eq key" data-name="Transmisibilidad">\[\frac{X}{Y}=\sqrt{\frac{\omega_0^4+\gamma^2\omega^2}{(\omega_0^2-\omega^2)^2+\gamma^2\omega^2}} .\]</div>
<p>Para \(\omega\lt\sqrt2\,\omega_0\) la vibración se <em>amplifica</em>; para \(\omega\gt\sqrt2\,\omega_0\) se atenúa. Por eso los soportes antivibratorios son blandos (\(\omega_0\) baja). Curiosamente, en la zona de aislamiento el amortiguamiento empeora el resultado: hay que elegir entre limitar el pico de resonancia y aislar bien a alta frecuencia.</p>
<p>Un <span class="term">sismógrafo</span> usa el mismo sistema al revés: con \(\omega\gg\omega_0\) la masa queda casi quieta en el espacio y el movimiento relativo \(x-y\) reproduce el del suelo.</p>
<div class="sim" data-sim="vibration-isolation" data-title="Masa sobre una base que vibra: transmisibilidad"></div>
<div class="sim-guide"><ul>
<li>Ubique \(\omega=\sqrt2\,\omega_0\): todas las curvas de transmisibilidad pasan por 1, sin importar el amortiguamiento.</li>
<li>Con \(\omega=4\omega_0\), compare \(\zeta=0.05\) y \(\zeta=0.5\): el sistema menos amortiguado aísla mejor.</li>
</ul></div>
</section>

<section>
<h2>Resonancia en el mundo real</h2>
<ul>
<li><strong>Copas que se rompen:</strong> una copa de cristal fino tiene \(Q\sim10^3\); una nota sostenida a su frecuencia propia (unos 500–1000 Hz) acumula energía durante cientos de ciclos.</li>
<li><strong>Puentes peatonales:</strong> el Millennium Bridge de Londres (2000) oscilaba lateralmente porque los peatones, al balancearse, se sincronizaban con el puente: una retroalimentación entre fuerza y respuesta. El famoso colapso de Tacoma Narrows (1940) no fue una resonancia simple con el viento, sino una inestabilidad aeroelástica (<em>flameo</em>), un fenómeno autoexcitado.</li>
<li><strong>Edificios y sismos:</strong> en Ciudad de México (1985), los edificios de 6 a 15 pisos, con períodos cercanos a 2 s, coincidieron con el período del suelo lacustre amplificado y sufrieron la mayor parte del daño.</li>
<li><strong>Resonancia magnética y espectroscopía:</strong> las moléculas absorben radiación sólo en las frecuencias de sus modos de vibración: la curva de absorción es una lorentziana cuyo ancho revela su tiempo de vida.</li>
</ul>
<div class="box ex">
<h4>Amplitud de un motor sobre una viga</h4>
<p>Un motor de 50 kg montado sobre una viga (que se comporta como un resorte de \(k=2\times10^6\) N/m, \(\zeta=0.05\)) tiene un rotor desbalanceado que produce una fuerza de 200 N a 1800 rpm. Halle la amplitud de vibración. ¿Qué pasaría a 1910 rpm?</p>
<details><summary>Solución</summary>
<p>\(\omega_0=\sqrt{k/m}=200\) rad/s; \(\omega=1800\cdot2\pi/60=188.5\) rad/s; \(r=\omega/\omega_0=0.942\). \(A=\dfrac{F_0/k}{\sqrt{(1-r^2)^2+(2\zeta r)^2}}=\dfrac{10^{-4}\text{ m}}{\sqrt{0.0125+0.0089}}=0.68\) mm. A 1910 rpm (\(\omega=200\) rad/s) la amplitud es \(Q\,F_0/k=10\times0.1\) mm \(=1.0\) mm.</p>
</details>
</div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un oscilador con \(m=1\) kg, \(k=100\) N/m, \(b=2\) kg/s es forzado con \(F_0=5\) N. Halle la amplitud a \(\omega=5\), 10 y 20 rad/s.
<details><summary>Respuesta</summary><p>\(A=\dfrac{5}{\sqrt{(100-\omega^2)^2+4\omega^2}}\): 66.1 mm, 250 mm, 16.5 mm.</p></details></li>
<li><span class="lvl">Básico</span>Para el oscilador anterior, halle \(Q\), el ancho de banda y la potencia máxima absorbida.
<details><summary>Respuesta</summary><p>\(Q=5\); \(\Delta\omega=2\) rad/s; \(P_{\max}=F_0^2/(2b)=6.25\) W.</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que el máximo de amplitud está en \(\omega_r=\sqrt{\omega_0^2-\gamma^2/2}\) y que el máximo de velocidad está exactamente en \(\omega_0\).
<details><summary>Respuesta</summary><p>Minimice \((\omega_0^2-\omega^2)^2+\gamma^2\omega^2\) respecto a \(\omega^2\). Para la velocidad, \(\omega A=\dfrac{F_0/m}{\sqrt{(\omega_0^2/\omega-\omega)^2+\gamma^2}}\), máxima cuando \(\omega=\omega_0\).</p></details></li>
<li><span class="lvl">Intermedio</span>Una máquina de 100 kg que gira a 3000 rpm debe montarse sobre soportes que transmitan al piso sólo el 10 % de la vibración. Sin amortiguamiento, ¿qué constante total deben tener?
<details><summary>Respuesta</summary><p>\(1/(r^2-1)=0.1\Rightarrow r=\sqrt{11}\); \(\omega_0=314/3.317=94.7\) rad/s; \(k=m\omega_0^2=9.0\times10^5\) N/m.</p></details></li>
<li><span class="lvl">Avanzado</span>Resuelva \(\ddot x+\omega_0^2x=(F_0/m)\cos\omega_0t\) con \(x(0)=\dot x(0)=0\) y muestre que la amplitud crece linealmente.
<details><summary>Respuesta</summary><p>\(x=\dfrac{F_0}{2m\omega_0}\,t\sen\omega_0t\) (límite de la solución no resonante cuando \(\omega\to\omega_0\)).</p></details></li>
<li><span class="lvl">Avanzado</span>Muestre que la energía media almacenada en el régimen estacionario es máxima ligeramente por debajo de \(\omega_0\), y que en \(\omega_0\) se cumple \(\langle P\rangle=\gamma\langle E\rangle\).
<details><summary>Respuesta</summary><p>\(\langle E\rangle=\tfrac14mA^2(\omega^2+\omega_0^2)\). En \(\omega_0\): \(\langle E\rangle=\tfrac12m\omega_0^2A^2\) y \(\langle P\rangle=\tfrac12m\gamma\omega_0^2A^2=\gamma\langle E\rangle\).</p></details></li>
</ol>
</section>
</template>

<!-- 06-electricas.html -->
<template class="chapter-src" data-id="electricas" data-num="6" data-title="Oscilaciones eléctricas" data-part="Parte II · Oscilaciones de un grado de libertad" data-short="Circuito LC, RLC libre y forzado, impedancia, analogía electromecánica y filtros">
<p class="lead">Un condensador y una bobina conectados entre sí forman un oscilador perfecto: la energía pasa del campo eléctrico al magnético y de vuelta. Las ecuaciones son idénticas a las del bloque y el resorte, de modo que todo lo aprendido se traslada sin cambios a la electrónica, donde las oscilaciones se pueden medir, sintonizar y escuchar con enorme precisión.</p>

<section>
<h2>El circuito LC</h2>
<p>Un condensador de capacitancia \(C\), cargado inicialmente con \(q_0\), se conecta a una bobina de inductancia \(L\). La ley de las mallas de Kirchhoff (la suma de caídas de tensión es cero) con \(i=\dot q\):</p>
<div class="eq key" data-name="Circuito LC">\[L\frac{\dd i}{\dd t}+\frac qC=0\quad\Longleftrightarrow\quad\ddot q+\omega_0^2q=0,\qquad \omega_0=\frac1{\sqrt{LC}} .\]</div>
<p>La carga oscila armónicamente, \(q=q_0\cos\omega_0t\), y la corriente \(i=-\omega_0q_0\sen\omega_0t\) va adelantada un cuarto de ciclo. La energía total se conserva:</p>
<div class="eq">\[E=\frac{q^2}{2C}+\frac12Li^2=\frac{q_0^2}{2C}.\]</div>
<p>Cuando el condensador está descargado, toda la energía está en el campo magnético de la bobina, y la corriente es máxima; la inercia de la bobina (su fem inducida) recarga el condensador con la polaridad opuesta.</p>
<div class="sim" data-sim="lc-circuit" data-title="Circuito LC: intercambio de energía eléctrica y magnética"></div>
<div class="sim-guide"><ul>
<li>Compare con el sistema masa–resorte: la carga hace el papel de la posición; la corriente, el de la velocidad; la bobina, el de la masa.</li>
<li>Con \(L=10\) mH y \(C=1\) nF la frecuencia es de 50 kHz: los circuitos LC permiten oscilaciones mucho más rápidas que las mecánicas.</li>
</ul></div>
</section>

<section>
<h2>El circuito RLC</h2>
<p>Toda bobina real tiene resistencia. Agregando la caída \(Ri\):</p>
<div class="eq key" data-name="Circuito RLC serie">\[L\ddot q+R\dot q+\frac qC=\mathcal{E}(t)\quad\Longleftrightarrow\quad\ddot q+\gamma\dot q+\omega_0^2q=\frac{\mathcal{E}(t)}{L},\qquad \gamma=\frac RL,\quad Q=\frac{\omega_0L}{R}=\frac1R\sqrt{\frac LC}.\]</div>
<p>La resistencia crítica es \(R_c=2\sqrt{L/C}\). Por debajo, la descarga del condensador es oscilante; por encima, monótona.</p>
<h3>Régimen sinusoidal e impedancia</h3>
<p>Con una fuente \(\mathcal{E}=\mathcal{E}_0\cos\omega t\), en fasores cada elemento tiene una <span class="term">impedancia</span> compleja (la razón entre los fasores de tensión y corriente): \(Z_R=R\), \(Z_L=\ii\omega L\), \(Z_C=1/(\ii\omega C)\). En serie se suman:</p>
<div class="eq key" data-name="Impedancia del RLC serie">\[Z=R+\ii\left(\omega L-\frac1{\omega C}\right),\qquad |Z|=\sqrt{R^2+\left(\omega L-\frac1{\omega C}\right)^2},\qquad I_0=\frac{\mathcal{E}_0}{|Z|}.\]</div>
<p>En resonancia (\(\omega=\omega_0\)) las reactancias se cancelan, la impedancia es mínima e igual a \(R\), y la corriente está en fase con la fuente. Las tensiones en la bobina y el condensador, en cambio, son \(Q\) veces la de la fuente y están en oposición entre sí: un RLC con \(Q=50\) alimentado con 1 V tiene 50 V en el condensador.</p>
<div class="sim" data-sim="rlc-forced" data-title="Circuito RLC forzado: corriente, fase y tensiones"></div>
<div class="sim-guide"><ul>
<li>Barra la frecuencia y observe el diagrama de fasores: en resonancia los fasores de \(V_L\) y \(V_C\) son iguales y opuestos, y la fuente sólo «ve» la resistencia.</li>
<li>Reduzca \(R\): la curva de corriente se estrecha y las tensiones parciales crecen. Por eso los condensadores de los circuitos resonantes deben soportar tensiones mucho mayores que la de la fuente.</li>
</ul></div>
</section>

<section>
<h2>La analogía electromecánica</h2>
<p>Las ecuaciones \(m\ddot x+b\dot x+kx=F(t)\) y \(L\ddot q+R\dot q+q/C=\mathcal{E}(t)\) son la misma. El diccionario es:</p>
<div class="tablewrap"><table>
<tr><th>Mecánico</th><th class="c">Eléctrico</th><th>Papel</th></tr>
<tr><td>Posición \(x\)</td><td class="c">Carga \(q\)</td><td>Coordenada</td></tr>
<tr><td>Velocidad \(\dot x\)</td><td class="c">Corriente \(i\)</td><td>Flujo</td></tr>
<tr><td>Masa \(m\)</td><td class="c">Inductancia \(L\)</td><td>Inercia; almacena energía «cinética»</td></tr>
<tr><td>Constante \(k\)</td><td class="c">Elastancia \(1/C\)</td><td>Rigidez; almacena energía «potencial»</td></tr>
<tr><td>Fricción \(b\)</td><td class="c">Resistencia \(R\)</td><td>Disipación</td></tr>
<tr><td>Fuerza \(F\)</td><td class="c">Fem \(\mathcal E\)</td><td>Excitación</td></tr>
<tr><td>Potencia \(F\dot x\)</td><td class="c">Potencia \(\mathcal{E}i\)</td><td>Flujo de energía</td></tr>
</table></div>
<p>La analogía es más que una curiosidad: antes de las computadoras digitales, los ingenieros estudiaban vibraciones de puentes, aviones y máquinas construyendo el circuito eléctrico equivalente (computadoras analógicas). Hoy la usamos en sentido inverso: los altavoces, los micrófonos y los sensores piezoeléctricos se describen como circuitos con elementos mecánicos.</p>
<div class="sim" data-sim="em-analogy" data-title="Un mismo oscilador, mecánico y eléctrico"></div>
</section>

<section>
<h2>Filtros</h2>
<p>Tomando la salida en distintos elementos del RLC serie se obtienen filtros. La <span class="term">función de transferencia</span> \(H(\omega)=V_{\text{sal}}/V_{\text{ent}}\) es la razón entre la impedancia del elemento de salida y la total:</p>
<div class="eq">\[H_R=\frac{R}{Z}\ \ (\text{pasa banda}),\qquad H_C=\frac{1/\ii\omega C}{Z}\ \ (\text{pasa bajos}),\qquad H_L=\frac{\ii\omega L}{Z}\ \ (\text{pasa altos}).\]</div>
<p>Fuera de la resonancia, \(|H_C|\) cae como \(1/\omega^2\) (\(-40\) dB por década) y \(|H_L|\) sube como \(\omega^2\). Los filtros de los ecualizadores de audio, los separadores de vías de los parlantes (<em>crossovers</em>) y los sintonizadores de radio son variaciones de este circuito.</p>
<div class="sim" data-sim="rlc-filter" data-title="Filtros RLC: diagrama de Bode"></div>
<div class="sim-guide"><ul>
<li>Con \(Q\) alto, el pasa bajos tiene un pico de resonancia antes de caer: la señal se <em>amplifica</em> cerca de \(f_0\).</li>
<li>Escuche una señal con muchos armónicos antes y después del filtro: el pasa bajos la vuelve opaca; el pasa altos, metálica.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un condensador de 2.0 µF cargado a 12 V se conecta a una bobina de 50 mH. Halle la frecuencia, la carga máxima y la corriente máxima.
<details><summary>Respuesta</summary><p>\(\omega_0=3162\) rad/s (\(f=503\) Hz); \(q_0=24\ \mu\)C; \(I_{\max}=\omega_0q_0=75.9\) mA.</p></details></li>
<li><span class="lvl">Básico</span>¿Qué capacitancia se necesita con una bobina de 250 µH para sintonizar una emisora de AM de 1100 kHz?
<details><summary>Respuesta</summary><p>\(C=1/(\omega^2L)=83.7\) pF.</p></details></li>
<li><span class="lvl">Intermedio</span>Un RLC serie tiene \(R=10\ \Omega\), \(L=0.10\) H, \(C=10\ \mu\)F, con una fuente de 5.0 V de amplitud. Halle \(f_0\), \(Q\), la corriente en resonancia y la tensión en el condensador en resonancia.
<details><summary>Respuesta</summary><p>\(f_0=159\) Hz; \(Q=10\); \(I_0=0.50\) A; \(V_C=Q\mathcal{E}_0=50\) V.</p></details></li>
<li><span class="lvl">Intermedio</span>Un bloque de 0.25 kg con un resorte de 100 N/m y \(b=0.5\) kg/s. Proponga un circuito equivalente con \(L=25\) mH.
<details><summary>Respuesta</summary><p>Factor de escala \(L/m=0.1\) H/kg: \(1/C=0.1\,k\Rightarrow C=0.1\) F y \(R=0.1\,b=0.05\ \Omega\). Ambos oscilan a \(\omega_0=20\) rad/s con \(Q=10\).</p></details></li>
<li><span class="lvl">Avanzado</span>Muestre que, en un RLC serie, la tensión del condensador es máxima en \(\omega=\omega_0\sqrt{1-1/(2Q^2)}\) y la de la bobina en \(\omega=\omega_0/\sqrt{1-1/(2Q^2)}\).
<details><summary>Respuesta</summary><p>\(|V_C|=\mathcal E_0/(\omega C|Z|)\) es la amplitud del oscilador mecánico (máximo en \(\omega_r\)); \(|V_L|=\omega L\mathcal E_0/|Z|\) se maximiza minimizando \((\omega_0^2/\omega^2-1)^2+\gamma^2/\omega^2\) en la variable \(1/\omega^2\).</p></details></li>
</ol>
</section>
</template>

<!-- 07-superposicion.html -->
<template class="chapter-src" data-id="superposicion" data-num="7" data-title="Superposición de oscilaciones" data-part="Parte II · Oscilaciones de un grado de libertad" data-short="Batimientos, modulación, suma de N fasores, figuras de Lissajous y armonógrafo">
<p class="lead">Cuando un sistema lineal recibe dos excitaciones, su respuesta es la suma de las respuestas. Sumar oscilaciones de frecuencias distintas o en direcciones distintas produce fenómenos nuevos y visibles (o audibles): batimientos, modulación, figuras de Lissajous. Son el puente entre las oscilaciones y las ondas.</p>

<section>
<h2>Dos oscilaciones de frecuencias próximas: batimientos</h2>
<p>Sumemos dos oscilaciones de igual amplitud y frecuencias \(\omega_1\) y \(\omega_2\). Con la identidad \(\cos a+\cos b=2\cos\frac{a-b}2\cos\frac{a+b}2\):</p>
<div class="eq key" data-name="Batimientos">\[x=A\cos\omega_1t+A\cos\omega_2t=\underbrace{2A\cos\!\left(\frac{\omega_1-\omega_2}{2}t\right)}_{\text{envolvente lenta}}\ \cos\!\left(\frac{\omega_1+\omega_2}{2}t\right).\]</div>
<p>Si las frecuencias son próximas, el resultado es una oscilación rápida a la frecuencia media, cuya amplitud varía lentamente. El oído percibe los máximos de intensidad: suceden con la <span class="term">frecuencia de batimiento</span></p>
<div class="eq key" data-name="Frecuencia de batimiento">\[f_{\text{bat}}=|f_1-f_2| .\]</div>
<p>(La envolvente tiene frecuencia \(|f_1-f_2|/2\), pero su valor absoluto se repite al doble.) Los afinadores de pianos y de guitarras usan los batimientos: al acercar una cuerda a la frecuencia de referencia, los batimientos se hacen más lentos hasta desaparecer.</p>
