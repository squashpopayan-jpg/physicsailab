<template class="chapter-src" data-id="luz" data-num="23" data-title="La luz como onda: ondas electromagnéticas y polarización" data-part="Parte VI · Ondas en el plano y en el espacio" data-short="Ondas electromagnéticas, espectro, polarización, ley de Malus, ángulo de Brewster, reflexión de Fresnel, birrefringencia y dispersión de la luz">
<p class="lead">Las ecuaciones de Maxwell predicen ondas de campos eléctricos y magnéticos que viajan a \(3\times10^8\) m/s: la luz. Todo lo estudiado en el curso (superposición, interferencia, difracción, dispersión, impedancia) se aplica a ellas. Este capítulo cierra el recorrido con lo que es propio de las ondas transversales en el espacio: la polarización.</p>

<section>
<h2>Ondas electromagnéticas</h2>
<p>En el vacío, los campos \(\vb E\) y \(\vb B\) cumplen la ecuación de onda con velocidad \(c=1/\sqrt{\mu_0\varepsilon_0}\). Una onda plana que viaja según \(+z\):</p>
<div class="eq key" data-name="Onda electromagnética plana">\[\vb E=E_0\cos(kz-\omega t)\,\uv x,\qquad \vb B=\frac{E_0}c\cos(kz-\omega t)\,\uv y,\qquad \omega=ck .\]</div>
<p>Los campos son transversales, perpendiculares entre sí y están en fase. La intensidad es \(I=\tfrac12c\varepsilon_0E_0^2=E_0^2/(2\eta_0)\), donde \(\eta_0=\sqrt{\mu_0/\varepsilon_0}\approx377\ \Omega\) es la impedancia del vacío, el análogo exacto de la impedancia de una cuerda. En un medio transparente la velocidad es \(c/n\), con \(n\) el índice de refracción, y la impedancia es \(\eta_0/n\).</p>
<p>Para un estudio detallado de las ondas electromagnéticas (deducción desde las ecuaciones de Maxwell, energía, presión de radiación, radiación de antenas), véase el <em>Atlas de Electromagnetismo</em>, el curso hermano de éste.</p>
<div class="sim" data-sim="em-wave" data-title="Onda electromagnética plana"></div>
</section>

<section>
<h2>Polarización</h2>
<p>Como \(\vb E\) es perpendicular a la propagación, puede oscilar en cualquier dirección del plano \(xy\). La superposición de dos componentes perpendiculares con desfase \(\delta\),</p>
<div class="eq">\[\vb E=E_{0x}\cos(kz-\omega t)\,\uv x+E_{0y}\cos(kz-\omega t+\delta)\,\uv y,\]</div>
<p>hace que el extremo de \(\vb E\) recorra una elipse: es exactamente la figura de Lissajous de igual frecuencia del capítulo 7. Con \(\delta=0\) o \(\pi\) la polarización es <em>lineal</em>; con \(E_{0x}=E_{0y}\) y \(\delta=\pm\pi/2\), <em>circular</em>; en general, <em>elíptica</em>. Una cuerda puede polarizarse igual: sacudiéndola en círculos, cada punto describe una circunferencia. Las ondas longitudinales, como el sonido, no tienen polarización.</p>
<p>La luz del Sol o de una bombilla es <em>no polarizada</em>: emitida por muchos átomos independientes, su dirección de oscilación cambia al azar en tiempos del orden de \(10^{-14}\) s.</p>
<div class="sim" data-sim="polarization-states" data-title="Estados de polarización"></div>
</section>

<section>
<h2>Polarizadores y ley de Malus</h2>
<p>Un polarizador (un filtro Polaroid, una rejilla de alambres para microondas) transmite sólo la componente de \(\vb E\) paralela a su eje. Si incide luz polarizada linealmente a un ángulo \(\theta\) del eje, pasa la amplitud \(E_0\cos\theta\), y la intensidad</p>
<div class="eq key" data-name="Ley de Malus">\[I=I_0\cos^2\theta .\]</div>
<p>Con luz no polarizada, el primer polarizador transmite la mitad. Dos polarizadores cruzados bloquean todo, pero si entre ellos se pone un tercero a \(45^\circ\), pasa la octava parte: un polarizador no sólo absorbe, también «gira» la luz que deja pasar.</p>
<div class="sim" data-sim="malus-chain" data-title="Cadena de polarizadores"></div>
</section>

<section>
<h2>Reflexión, ángulo de Brewster y ecuaciones de Fresnel</h2>
<p>Cuando la luz incide sobre una superficie de vidrio o de agua, la fracción reflejada depende de la polarización. Las <span class="term">ecuaciones de Fresnel</span>, que se obtienen de las condiciones de continuidad de los campos en la frontera (como las de la unión de dos cuerdas, capítulo 13), dan los coeficientes de amplitud para la polarización perpendicular (s) y paralela (p) al plano de incidencia:</p>
<div class="eq key" data-name="Ecuaciones de Fresnel">\[r_s=\frac{n_1\cos\theta_i-n_2\cos\theta_t}{n_1\cos\theta_i+n_2\cos\theta_t},\qquad r_p=\frac{n_2\cos\theta_i-n_1\cos\theta_t}{n_2\cos\theta_i+n_1\cos\theta_t}.\]</div>
<p>En incidencia normal ambas dan \(r=(n_1-n_2)/(n_1+n_2)\), la fórmula de impedancias: el vidrio refleja el 4 %. Para la polarización p existe un ángulo en el que no hay reflexión, el <span class="term">ángulo de Brewster</span>:</p>
<div class="eq key" data-name="Ángulo de Brewster">\[\tg\theta_B=\frac{n_2}{n_1}.\]</div>
<p>La luz reflejada a ese ángulo está totalmente polarizada (s). Por eso los reflejos en el agua o en el asfalto están parcialmente polarizados horizontalmente, y las gafas de sol polarizadas, con eje vertical, los eliminan. Los fotógrafos usan filtros polarizadores con el mismo propósito.</p>
<div class="sim" data-sim="fresnel-brewster" data-title="Reflectancia en función del ángulo: Fresnel y Brewster"></div>
<div class="sim-guide"><ul>
<li>Busque el ángulo en que se anula la reflexión p: es \(56.3^\circ\) para el vidrio (\(n=1.5\)) y \(53.1^\circ\) para el agua.</li>
<li>Haga que la luz vaya del vidrio al aire: por encima del ángulo crítico la reflexión es total para ambas polarizaciones.</li>
</ul></div>
</section>

<section>
<h2>Birrefringencia y láminas de onda</h2>
<p>En algunos cristales (calcita, cuarzo) y en plásticos sometidos a tensión, el índice de refracción depende de la dirección de polarización: son <span class="term">birrefringentes</span>. Una lámina de espesor \(t\) introduce entre sus dos ejes un desfase</p>
<div class="eq">\[\delta=\frac{2\pi}{\lambda}(n_e-n_o)\,t .\]</div>
<p>Una <em>lámina de cuarto de onda</em> (\(\delta=\pi/2\)) convierte la luz lineal a \(45^\circ\) de sus ejes en circular; una de <em>media onda</em> (\(\delta=\pi\)) gira la polarización lineal. Entre polarizadores cruzados, un plástico tensionado muestra franjas de colores que revelan dónde se concentran los esfuerzos: es la <em>fotoelasticidad</em>, usada para estudiar piezas mecánicas. Las pantallas de cristal líquido funcionan girando la polarización con un campo eléctrico.</p>
<div class="sim" data-sim="waveplate" data-title="Lámina birrefringente entre polarizadores"></div>
</section>

<section>
<h2>Dispersión de la luz: prismas y arcoíris</h2>
<p>El índice de refracción del vidrio y del agua disminuye con la longitud de onda (dispersión normal, capítulo 16); una aproximación es la ley de Cauchy, \(n(\lambda)\approx A+B/\lambda^2\). Un prisma desvía más el violeta que el rojo y separa los colores. En una gota de agua, la luz que sufre una reflexión interna sale con una desviación mínima de unos \(138^\circ\), y se concentra en un cono de \(42^\circ\) alrededor del punto antisolar: el arcoíris, con el rojo por fuera. El secundario, con dos reflexiones, está a \(51^\circ\) con los colores invertidos.</p>
<div class="sim" data-sim="prism" data-title="Dispersión en un prisma"></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un láser de 5 mW tiene un haz de 2 mm de diámetro. Halle la intensidad y la amplitud del campo eléctrico.
<details><summary>Respuesta</summary><p>\(I=1.59\) kW/m²; \(E_0=\sqrt{2\eta_0I}=1.1\) kV/m.</p></details></li>
<li><span class="lvl">Básico</span>Luz no polarizada de 60 W/m² atraviesa dos polarizadores con ejes a \(30^\circ\). ¿Qué intensidad sale?
<details><summary>Respuesta</summary><p>\(30\cos^230^\circ=22.5\) W/m².</p></details></li>
<li><span class="lvl">Intermedio</span>Halle el ángulo de Brewster para luz que se refleja en un diamante (\(n=2.42\)) y la reflectancia en incidencia normal.
<details><summary>Respuesta</summary><p>\(\theta_B=67.5^\circ\); \(R=(1.42/3.42)^2=17\) %: por eso brilla tanto.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Qué espesor mínimo debe tener una lámina de cuarto de onda de cuarzo (\(n_e-n_o=0.0092\)) para 589 nm?
<details><summary>Respuesta</summary><p>\(t=\lambda/(4\Delta n)=16\ \mu\)m.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que en el ángulo de Brewster los rayos reflejado y refractado son perpendiculares.
<details><summary>Respuesta</summary><p>Con \(\tg\theta_B=n_2/n_1\) y Snell, \(\sen\theta_t=\cos\theta_B\), es decir \(\theta_t=90^\circ-\theta_B\): el ángulo entre ambos rayos es \(180^\circ-\theta_B-\theta_t=90^\circ\). Los dipolos del medio oscilan en la dirección del rayo reflejado y no radian en esa dirección.</p></details></li>
</ol>
</section>
