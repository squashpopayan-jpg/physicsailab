<template class="chapter-src" data-id="interferencia" data-num="21" data-title="Interferencia" data-part="Parte VI · Ondas en el plano y en el espacio" data-short="Dos fuentes coherentes, experimento de Young, parlantes, láminas delgadas, anillos de Newton, interferómetro de Michelson y coherencia">
<p class="lead">Cuando dos ondas de la misma frecuencia se superponen, la intensidad resultante no es la suma de las intensidades: en unos puntos se refuerzan y en otros se anulan. La interferencia es la prueba más directa de la naturaleza ondulatoria de un fenómeno; con ella Thomas Young demostró en 1801 que la luz es una onda, y con ella se midieron las ondas gravitacionales en 2015.</p>

<section>
<h2>Dos fuentes coherentes</h2>
<p>Dos fuentes puntuales oscilan con la misma frecuencia y una diferencia de fase constante \(\delta_0\): son <span class="term">coherentes</span>. En un punto a distancias \(r_1\) y \(r_2\) de ellas, las dos ondas llegan con una diferencia de fase</p>
<div class="eq key" data-name="Diferencia de fase por camino">\[\delta=k(r_2-r_1)+\delta_0=\frac{2\pi}{\lambda}\Delta r+\delta_0 .\]</div>
<p>Sumando con fasores (capítulo 1), con amplitudes iguales \(A\), la amplitud resultante es \(2A|\cos(\delta/2)|\) y la intensidad</p>
<div class="eq key" data-name="Intensidad de dos ondas coherentes">\[I=4I_1\cos^2\frac\delta2=2I_1(1+\cos\delta).\]</div>
<p>Con \(\delta_0=0\), hay interferencia <em>constructiva</em> (\(I=4I_1\)) donde \(\Delta r=m\lambda\) y <em>destructiva</em> (\(I=0\)) donde \(\Delta r=(m+\tfrac12)\lambda\). Los lugares de \(\Delta r\) constante son hipérbolas con focos en las fuentes. La energía no se crea ni se destruye: se redistribuye, y el promedio espacial de \(I\) es \(2I_1\).</p>
<p>Si las fuentes son <em>incoherentes</em> (su fase relativa cambia al azar, como en dos bombillas), el término \(\cos\delta\) promedia cero y simplemente se suman las intensidades.</p>
<div class="sim" data-sim="two-source" data-title="Interferencia de dos fuentes: franjas hiperbólicas"></div>
<div class="sim-guide"><ul>
<li>Aumente la separación \(d\) de las fuentes: aparecen más líneas nodales, una por cada media longitud de onda que cabe en \(d\).</li>
<li>Cambie el desfase \(\delta_0\) a \(180^\circ\): la línea central pasa a ser nodal. Así se orienta el haz de una antena de arreglo en fase.</li>
</ul></div>
</section>

<section>
<h2>El experimento de Young</h2>
<p>Young iluminó dos rendijas muy próximas con la luz de una sola fuente, lo que garantiza la coherencia. Sobre una pantalla a distancia \(L\gg d\), un punto a altura \(y\) ve una diferencia de caminos \(\Delta r\approx d\sen\theta\approx d\,y/L\). Los máximos están en</p>
<div class="eq key" data-name="Franjas de Young">\[d\sen\theta_m=m\lambda,\qquad y_m=\frac{m\lambda L}{d},\qquad \Delta y=\frac{\lambda L}{d},\qquad I(y)=4I_1\cos^2\!\left(\frac{\pi d\,y}{\lambda L}\right).\]</div>
<p>Midiendo la separación de las franjas, Young obtuvo las longitudes de onda de los colores: unos 0.4 µm para el violeta y 0.7 µm para el rojo. Con luz blanca, la franja central es blanca y las demás se tiñen de colores, porque cada longitud de onda tiene su propio espaciado.</p>
<div class="sim" data-sim="young" data-title="Experimento de Young con luz de cualquier color"></div>
<div class="sim-guide"><ul>
<li>Con luz blanca sólo se distinguen unas pocas franjas: los máximos de los distintos colores se desfasan rápidamente. Es un efecto de la baja coherencia temporal de la luz blanca.</li>
<li>Reduzca la separación entre rendijas: las franjas se separan. Las rendijas deben estar a menos de un milímetro para que las franjas se vean a simple vista.</li>
</ul></div>
</section>

<section>
<h2>Interferencia de sonido</h2>
<p>Dos parlantes alimentados con la misma señal forman un patrón de interferencia en la sala. Si se invierte la polaridad de uno, los mínimos y máximos se intercambian, y en la línea central el sonido grave casi desaparece: por eso es importante conectar los parlantes con la misma polaridad. La <span class="term">cancelación activa de ruido</span> de los audífonos aprovecha la interferencia destructiva: un micrófono capta el ruido y el audífono emite la onda invertida.</p>
<div class="sim" data-sim="speakers" data-title="Dos parlantes: escuche la interferencia"></div>
<div class="sim-guide"><ul>
<li>Mueva al oyente a lo largo de la línea horizontal y escuche cómo cambia el volumen.</li>
<li>Invierta la polaridad de un parlante: en la línea central, el sonido casi desaparece.</li>
</ul></div>
</section>

<section>
<h2>Láminas delgadas</h2>
<p>Los colores de las burbujas de jabón y de las manchas de aceite se deben a la interferencia entre la luz reflejada en las dos caras de una película delgada. Hay dos fuentes de diferencia de fase:</p>
<ul>
<li>El camino adicional dentro de la película, \(2nt\cos\theta_t\) (con \(n\) el índice de refracción y \(t\) el espesor).</li>
<li>Un cambio de fase de \(\pi\) en cada reflexión desde un medio de índice menor hacia uno mayor (el equivalente óptico de la reflexión en una cuerda más pesada, capítulo 13).</li>
</ul>
<p>Para una película de jabón en aire (una reflexión con cambio de fase y otra sin él), en incidencia normal:</p>
<div class="eq key" data-name="Película delgada en aire">\[2nt=\left(m+\tfrac12\right)\lambda\ \ (\text{máximo de reflexión}),\qquad 2nt=m\lambda\ \ (\text{mínimo}).\]</div>
<p>Cuando la película es mucho más delgada que \(\lambda\), las dos reflexiones se cancelan: la parte superior de una burbuja a punto de romperse se ve negra. Si la película está entre dos medios de índices crecientes (como el recubrimiento antirreflejo sobre un vidrio), ambas reflexiones cambian de fase y las condiciones se invierten: \(2nt=\lambda/2\) da reflexión mínima, el acoplador de cuarto de onda del capítulo 13.</p>
<div class="sim" data-sim="thin-film" data-title="Colores de una película delgada"></div>
<h3>Anillos de Newton</h3>
<p>Una lente convexa de radio \(R\) apoyada sobre un vidrio plano deja entre ambos una capa de aire de espesor \(t\approx r^2/2R\). La luz reflejada forma anillos concéntricos oscuros donde \(2t=m\lambda\), es decir \(r_m=\sqrt{m\lambda R}\), con un punto oscuro en el centro. Los ópticos usan estos anillos para comprobar la forma de las superficies con precisión de una fracción de longitud de onda.</p>
<div class="sim" data-sim="newton-rings" data-title="Anillos de Newton"></div>
</section>

<section>
<h2>El interferómetro de Michelson</h2>
<p>Un divisor de haz separa la luz en dos brazos perpendiculares; cada haz se refleja en un espejo y ambos se recombinan. Si uno de los espejos se desplaza una distancia \(\Delta x\), el camino de ese brazo cambia en \(2\Delta x\), y por el detector pasan</p>
<div class="eq key" data-name="Franjas en el interferómetro de Michelson">\[N=\frac{2\Delta x}{\lambda}\]</div>
<p>franjas. Contando franjas se miden desplazamientos de una fracción de micrómetro, o se mide \(\lambda\) con un desplazamiento conocido. Michelson y Morley lo usaron en 1887 para buscar el movimiento de la Tierra respecto al «éter», sin encontrarlo, un resultado clave para la relatividad. LIGO, con brazos de 4 km y la luz recorriéndolos cientos de veces, detecta cambios de longitud de \(10^{-18}\) m: la milésima parte del diámetro de un protón.</p>
<div class="sim" data-sim="michelson" data-title="Interferómetro de Michelson: contar franjas"></div>
</section>

<section>
<h2>Coherencia</h2>
<p>Ninguna fuente real es perfectamente monocromática. Si su espectro tiene un ancho \(\Delta f\), su fase se mantiene predecible sólo durante un <span class="term">tiempo de coherencia</span> \(\tau_c\sim1/\Delta f\) (capítulo 15), y dos haces de la misma fuente sólo interfieren si sus caminos difieren en menos que la <span class="term">longitud de coherencia</span> \(\ell_c=c\tau_c\approx\lambda^2/\Delta\lambda\). La luz blanca tiene \(\ell_c\approx1\ \mu\)m (por eso sólo las películas muy delgadas muestran colores); una lámpara de sodio, unos milímetros; un láser estabilizado, kilómetros.</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>En un experimento de Young con \(d=0.25\) mm y \(L=1.5\) m, la separación entre franjas es de 3.5 mm. Halle \(\lambda\).
<details><summary>Respuesta</summary><p>\(\lambda=d\,\Delta y/L=583\) nm (amarillo).</p></details></li>
<li><span class="lvl">Básico</span>Dos parlantes separados 2.0 m emiten en fase a 343 Hz. Un oyente está a 4.0 m de uno y 5.5 m del otro. ¿Interferencia constructiva o destructiva?
<details><summary>Respuesta</summary><p>\(\lambda=1\) m, \(\Delta r=1.5\lambda\): destructiva.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Qué espesor mínimo debe tener una película de jabón (\(n=1.33\)) para reflejar con máxima intensidad la luz de 600 nm?
<details><summary>Respuesta</summary><p>\(2nt=\lambda/2\Rightarrow t=113\) nm.</p></details></li>
<li><span class="lvl">Intermedio</span>En un interferómetro de Michelson con luz de 633 nm, se cuentan 1000 franjas al mover el espejo. ¿Cuánto se movió?
<details><summary>Respuesta</summary><p>\(\Delta x=N\lambda/2=0.317\) mm.</p></details></li>
<li><span class="lvl">Avanzado</span>El décimo anillo oscuro de Newton tiene un radio de 4.2 mm con luz de 589 nm. Halle el radio de curvatura de la lente. ¿Cómo cambian los anillos si el espacio se llena de agua?
<details><summary>Respuesta</summary><p>\(R=r^2/(m\lambda)=3.0\) m. Con agua, el espesor óptico es \(2nt\): los radios se reducen en \(1/\sqrt{1.33}\).</p></details></li>
</ol>
</section>
