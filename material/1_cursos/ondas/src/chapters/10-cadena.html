<template class="chapter-src" data-id="cadena" data-num="10" data-title="La cadena de osciladores: del discreto al continuo" data-part="Parte III · Sistemas con varios grados de libertad" data-short="Cuentas en un hilo tenso, modos sinusoidales, relación de dispersión, frecuencia de corte, límite continuo y cadena diatómica">
<p class="lead">Al encadenar muchos osciladores idénticos, los modos normales adquieren forma de seno y las frecuencias obedecen una ley sencilla, la relación de dispersión. En el límite de muchas masas muy próximas, la cadena se convierte en una cuerda continua y su ecuación de movimiento, en la ecuación de onda. Es el camino más directo de las vibraciones a las ondas, y también el modelo de las vibraciones de los cristales.</p>

<section>
<h2>Cuentas en un hilo tenso</h2>
<p>Un hilo sin masa, con tensión \(T\), sostiene \(N\) cuentas de masa \(m\) separadas una distancia \(a\); los extremos están fijos. Para desplazamientos transversales pequeños \(y_n\), la fuerza neta sobre la cuenta \(n\) es la diferencia de las componentes transversales de la tensión a cada lado:</p>
<div class="eq key" data-name="Ecuación de la cadena">\[m\ddot y_n=\frac Ta\left(y_{n+1}-2y_n+y_{n-1}\right),\qquad n=1,\dots,N,\qquad y_0=y_{N+1}=0 .\]</div>
<p>(La misma ecuación describe masas unidas por resortes en movimiento longitudinal, con \(T/a\to\kappa\).) Por la simetría de traslación, los modos tienen forma sinusoidal. Probando \(y_n=A\sen(nka)\cos\omega t\):</p>
<div class="eq">\[-m\omega^2\sen(nka)=\frac Ta\left[\sen((n+1)ka)-2\sen(nka)+\sen((n-1)ka)\right]=\frac Ta\,\sen(nka)\left[2\cos ka-2\right].\]</div>
<p>Las condiciones de borde (\(y_{N+1}=0\)) cuantizan el número de onda: \(k_p=\dfrac{p\pi}{(N+1)a}\), \(p=1,\dots,N\). Hay exactamente \(N\) modos, tantos como grados de libertad:</p>
<div class="eq key" data-name="Modos de la cadena">\[y_n^{(p)}=A_p\sen\!\left(\frac{np\pi}{N+1}\right)\cos(\omega_pt+\varphi_p),\qquad \omega_p=2\omega_0\sen\!\left(\frac{p\pi}{2(N+1)}\right),\qquad\omega_0=\sqrt{\frac{T}{ma}} .\]</div>
<div class="sim" data-sim="bead-modes" data-title="Modos normales de N cuentas en un hilo"></div>
<div class="sim-guide"><ul>
<li>Las cuentas del modo \(p\) siguen siempre una sinusoide de longitud de onda \(2(N+1)a/p\), aunque la cadena sea discreta.</li>
<li>En el modo más alto (\(p=N\)) las cuentas vecinas se mueven casi en oposición: la longitud de onda más corta posible es \(\approx2a\).</li>
<li>Con «pulsar», la cadena empieza con forma de triángulo: el movimiento es una suma de todos los modos, y nunca se repite exactamente porque las frecuencias no son múltiplos enteros.</li>
</ul></div>
</section>

<section>
<h2>La relación de dispersión</h2>
<p>La relación entre la frecuencia y el número de onda de los modos sinusoidales,</p>
<div class="eq key" data-name="Relación de dispersión de la cadena">\[\omega(k)=2\omega_0\left|\sen\frac{ka}{2}\right|,\]</div>
<p>no depende de \(N\) ni de las condiciones de borde: es una propiedad del medio. Tres consecuencias:</p>
<ul>
<li><strong>Límite de onda larga:</strong> si \(ka\ll1\), \(\omega\approx\omega_0ak=\sqrt{T/\mu}\,k\), con \(\mu=m/a\) la densidad lineal. La frecuencia es proporcional al número de onda: todas las ondas largas viajan con la misma velocidad \(v=\sqrt{T/\mu}\).</li>
<li><strong>Frecuencia de corte:</strong> ninguna onda sinusoidal tiene frecuencia mayor que \(\omega_c=2\omega_0\). Si se excita la cadena por encima de \(\omega_c\), la perturbación no se propaga: decae exponencialmente (onda <em>evanescente</em>) y las cuentas vecinas se mueven en oposición.</li>
<li><strong>Periodicidad en \(k\):</strong> \(k\) y \(k+2\pi/a\) dan exactamente los mismos desplazamientos de las cuentas. Basta considerar \(-\pi/a\lt k\le\pi/a\) (la <em>primera zona de Brillouin</em> de la física del estado sólido). Es el mismo fenómeno que el <em>aliasing</em> al muestrear una señal.</li>
</ul>
<div class="sim" data-sim="chain-dispersion" data-title="Relación de dispersión y aliasing en la cadena"></div>
<div class="sim-guide"><ul>
<li>Lleve \(k\) más allá de \(\pi/a\): la onda continua que pasa por las cuentas cambia, pero las cuentas hacen exactamente lo mismo que con \(k-2\pi/a\).</li>
<li>Compare las velocidades de fase \(\omega/k\) y de grupo \(\dd\omega/\dd k\): coinciden para \(k\to0\) y la de grupo se anula en el borde de la zona (capítulo 16).</li>
</ul></div>
</section>

<section>
<h2>Ondas viajeras y frecuencia de corte</h2>
<p>Si se mueve el primer extremo de una cadena muy larga con \(y_0=A\cos\omega t\), se genera una onda que viaja \(y_n=A\cos(\omega t-nka)\) con \(k\) dado por la relación de dispersión. Para \(\omega\gt\omega_c\) no existe \(k\) real; con \(ka=\pi+\ii\kappa a\) se obtiene</p>
<div class="eq">\[y_n=A(-1)^n\ee^{-n\kappa a}\cos\omega t,\qquad \cosh(\kappa a)=\frac{\omega^2}{2\omega_0^2}-1 .\]</div>
<p>La cadena actúa como un filtro pasa bajos mecánico. Los cristales hacen lo mismo con las vibraciones atómicas: no pueden transmitir sonido de frecuencia mayor que unos \(10^{13}\) Hz.</p>
<div class="sim" data-sim="chain-driven" data-title="Cadena excitada en un extremo: propagación y corte"></div>
</section>

<section>
<h2>El límite continuo: la ecuación de onda</h2>
<p>Si las cuentas son muchas y muy próximas, \(y_n(t)\to y(x,t)\) con \(x=na\), y la diferencia segunda se aproxima por la derivada segunda:</p>
<div class="eq">\[y_{n+1}-2y_n+y_{n-1}\approx a^2\pddv{y}{x}.\]</div>
<p>Con \(m=\mu a\), la ecuación de la cadena se convierte en</p>
<div class="eq key" data-name="Ecuación de onda de la cuerda">\[\pddv{y}{t}=v^2\pddv{y}{x},\qquad v=\sqrt{\frac{T}{\mu}} .\]</div>
<p>Es la ecuación de onda que estudiaremos en la Parte IV. La cuerda continua tiene infinitos modos con \(\omega_p=v\,p\pi/L\), exactamente proporcionales a \(p\): los armónicos de una cuerda ideal son múltiplos enteros de la fundamental. En la cadena discreta los modos altos quedan por debajo de esa recta; la diferencia es una forma de <em>dispersión</em>.</p>
<div class="sim" data-sim="discrete-continuum" data-title="Frecuencias de la cadena frente a las de la cuerda continua"></div>
</section>

<section>
<h2>La cadena diatómica</h2>
<p>Si las masas alternan entre \(m_1\) y \(m_2\) (como los iones Na⁺ y Cl⁻ de la sal), unidas por resortes \(\kappa\), la celda que se repite tiene dos masas y la relación de dispersión tiene dos ramas:</p>
<div class="eq key" data-name="Cadena diatómica">\[\omega_\pm^2=\kappa\left(\frac1{m_1}+\frac1{m_2}\right)\pm\kappa\sqrt{\left(\frac1{m_1}+\frac1{m_2}\right)^2-\frac{4\sen^2(ka/2)}{m_1m_2}},\]</div>
<p>donde \(a\) es la longitud de la celda. La rama <span class="term">acústica</span> (\(\omega_-\)) empieza en cero: en ondas largas las dos masas de cada celda se mueven juntas, como en el sonido. La rama <span class="term">óptica</span> (\(\omega_+\)) empieza en \(\sqrt{2\kappa(1/m_1+1/m_2)}\): las dos masas se mueven en oposición. Si son iones de carga opuesta, este movimiento crea un dipolo oscilante que interactúa con la luz infrarroja. Entre ambas ramas hay una <span class="term">banda prohibida</span>: frecuencias que no se pueden propagar por el cristal.</p>
<div class="sim" data-sim="diatomic" data-title="Ramas acústica y óptica de la cadena diatómica"></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Tres cuentas de 10 g en un hilo de 0.40 m (separaciones de 0.10 m) con tensión de 20 N. Halle las tres frecuencias normales.
<details><summary>Respuesta</summary><p>\(\omega_0=\sqrt{20/(0.01\cdot0.1)}=141\) rad/s; \(\omega_p=2\omega_0\sen(p\pi/8)\): 108, 200 y 261 rad/s.</p></details></li>
<li><span class="lvl">Básico</span>Escriba las formas de los tres modos del problema anterior.
<details><summary>Respuesta</summary><p>\(p=1\): \((1,\sqrt2,1)/\sqrt2\); \(p=2\): \((1,0,-1)\); \(p=3\): \((1,-\sqrt2,1)/\sqrt2\).</p></details></li>
<li><span class="lvl">Intermedio</span>En un cristal unidimensional con átomos de \(4.5\times10^{-26}\) kg separados 0.3 nm y constante de enlace 15 N/m, halle la velocidad del sonido y la frecuencia de corte.
<details><summary>Respuesta</summary><p>\(\omega_0=\sqrt{\kappa/m}=1.83\times10^{13}\) rad/s; \(v=\omega_0a=5.5\) km/s; \(f_c=2\omega_0/2\pi=5.8\) THz.</p></details></li>
<li><span class="lvl">Intermedio</span>Si una cadena se excita a \(\omega=2.5\,\omega_0\), ¿en cuántas cuentas la amplitud cae a la décima parte?
<details><summary>Respuesta</summary><p>\(\cosh\kappa a=3.125-1=2.125\Rightarrow\kappa a=1.39\); \(n=\ln10/1.39=1.7\): menos de dos cuentas.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que en la cadena diatómica con \(m_1=m_2\) la banda prohibida desaparece y las dos ramas se unen para dar la relación de la cadena monoatómica (con celda de longitud \(a/2\)).
<details><summary>Respuesta</summary><p>Con \(m_1=m_2=m\): \(\omega_\pm^2=\tfrac{2\kappa}{m}\left(1\pm\cos\tfrac{ka}2\right)\), es decir \(\omega_-=2\sqrt{\kappa/m}\,|\sen(ka/4)|\) y \(\omega_+=2\sqrt{\kappa/m}\,|\cos(ka/4)|\): la rama óptica es la acústica «plegada».</p></details></li>
</ol>
</section>
