<template class="chapter-src" data-id="pendulos" data-num="3" data-title="Péndulos y oscilaciones en un pozo de potencial" data-part="Parte II · Oscilaciones de un grado de libertad" data-short="Péndulo simple, período exacto, péndulo físico y reversible, isocronismo de Huygens y potenciales arbitrarios">
<p class="lead">El péndulo fue el primer reloj de precisión y el primer instrumento para medir la gravedad. Su ecuación de movimiento no es lineal: sólo para ángulos pequeños se convierte en un oscilador armónico. Estudiarlo con cuidado enseña a reconocer cuándo funciona la aproximación armónica y qué ocurre cuando falla.</p>

<section>
<h2>El péndulo simple</h2>
<p>Una masa puntual \(m\) cuelga de un hilo inextensible de longitud \(\ell\) y masa despreciable. La única coordenada es el ángulo \(\theta\) con la vertical. Tomando momentos respecto al punto de suspensión, o derivando la energía \(E=\tfrac12m\ell^2\dot\theta^2+mg\ell(1-\cos\theta)\):</p>
<div class="eq key" data-name="Ecuación del péndulo">\[\ddot\theta+\frac g\ell\sen\theta=0 .\]</div>
<p>La ecuación es no lineal por el seno. Para \(|\theta|\ll1\), \(\sen\theta\approx\theta\) y se recupera el MAS:</p>
<div class="eq key" data-name="Péndulo de pequeña amplitud">\[\ddot\theta+\omega_0^2\theta=0,\qquad \omega_0=\sqrt{\frac g\ell},\qquad T_0=2\pi\sqrt{\frac\ell g}.\]</div>
<p>El período no depende de la masa (consecuencia de la equivalencia entre masa inercial y gravitatoria) ni, en esta aproximación, de la amplitud. Un péndulo de 1 m tiene \(T_0\approx2.006\) s: es casi un «péndulo que bate segundos».</p>
<div class="sim" data-sim="pendulum-exact" data-title="Péndulo real frente a su aproximación lineal"></div>
<div class="sim-guide"><ul>
<li>Con \(\theta_0=10^\circ\) los dos péndulos siguen juntos durante muchas oscilaciones; con \(60^\circ\) el real se retrasa visiblemente.</li>
<li>Suelte el péndulo desde \(179^\circ\): tarda muchísimo en «decidir» hacia dónde caer, porque arranca cerca del equilibrio inestable.</li>
<li>Dé una velocidad inicial suficiente y el péndulo da vueltas completas: el movimiento deja de ser oscilatorio.</li>
</ul></div>
</section>

<section>
<h2>El período exacto</h2>
<p>La conservación de la energía con amplitud \(\theta_0\) da \(\dot\theta^2=2\omega_0^2(\cos\theta-\cos\theta_0)\). El período es cuatro veces el tiempo de ir de \(0\) a \(\theta_0\):</p>
<div class="eq">\[T=4\int_0^{\theta_0}\frac{\dd\theta}{\omega_0\sqrt{2(\cos\theta-\cos\theta_0)}} .\]</div>
<p>Con el cambio \(\sen(\theta/2)=k\sen u\), \(k=\sen(\theta_0/2)\), la integral se convierte en la <span class="term">integral elíptica completa de primera especie</span>:</p>
<div class="eq key" data-name="Período del péndulo de amplitud finita">\[T=\frac{4}{\omega_0}K(k)=T_0\,\frac{2}{\pi}\int_0^{\pi/2}\frac{\dd u}{\sqrt{1-k^2\sen^2u}}\approx T_0\left(1+\frac{\theta_0^2}{16}+\frac{11\,\theta_0^4}{3072}+\cdots\right).\]</div>
<p>A \(15^\circ\) el período es apenas un 0.43 % mayor que \(T_0\); a \(90^\circ\), un 18 %; y tiende a infinito cuando \(\theta_0\to180^\circ\). Los relojes de péndulo se diseñaban con amplitudes pequeñas y constantes por esta razón.</p>
<div class="sim" data-sim="pendulum-period" data-title="Período en función de la amplitud"></div>
<div class="box hist">
<h4>Huygens y el péndulo cicloidal</h4>
<p>En 1673 Christiaan Huygens demostró que una partícula que desliza sin fricción por una cicloide invertida tarda lo mismo en llegar al fondo desde cualquier altura: la cicloide es la curva <em>tautócrona</em>. Colocando «mejillas» cicloidales a los lados del hilo, el péndulo describe una cicloide y su período es exactamente independiente de la amplitud. En la práctica, la fricción de las mejillas resultó peor que la falta de isocronismo.</p>
</div>
</section>

<section>
<h2>El péndulo físico</h2>
<p>Un cuerpo rígido de masa \(m\) que oscila alrededor de un eje horizontal fijo, con su centro de masa a distancia \(d\) del eje y momento de inercia \(I\) respecto al eje, cumple \(I\ddot\theta=-mgd\sen\theta\). Para ángulos pequeños:</p>
<div class="eq key" data-name="Péndulo físico">\[\omega_0=\sqrt{\frac{mgd}{I}},\qquad T_0=2\pi\sqrt{\frac{I}{mgd}}=2\pi\sqrt{\frac{\ell_{\text{eq}}}{g}},\qquad \ell_{\text{eq}}=\frac{I}{md}=d+\frac{I_{cm}}{md}.\]</div>
<p>La <span class="term">longitud equivalente</span> \(\ell_{\text{eq}}\) es la del péndulo simple con el mismo período. El punto situado a esa distancia del eje, en la recta que pasa por el centro de masa, es el <span class="term">centro de oscilación</span>. Usando el teorema de Steiner (\(I=I_{cm}+md^2\)) se ve que el período, en función de \(d\), tiene un mínimo cuando \(d\) es igual al radio de giro \(\kappa=\sqrt{I_{cm}/m}\).</p>
<h3>El péndulo reversible de Kater</h3>
<p>Si el cuerpo se cuelga del centro de oscilación, el período es el mismo: el eje y el centro de oscilación son intercambiables. Henry Kater (1817) aprovechó esta propiedad: un péndulo con dos cuchillas ajustables hasta que los períodos coinciden permite medir \(g=4\pi^2\ell_{\text{eq}}/T^2\) midiendo sólo la distancia entre cuchillas y el período, sin conocer \(I\) ni la posición del centro de masa.</p>
<div class="sim" data-sim="physical-pendulum" data-title="Péndulo físico: período en función de la posición del eje"></div>
<div class="sim-guide"><ul>
<li>Recorra la posición del eje: el período es mínimo cuando \(d=\kappa\), y tiende a infinito cuando el eje pasa por el centro de masa.</li>
<li>Para cada período por encima del mínimo hay dos valores de \(d\) a cada lado; su suma es \(\ell_{\text{eq}}\).</li>
</ul></div>
<div class="box ex">
<h4>Varilla colgada de un extremo</h4>
<p>Una varilla uniforme de longitud \(L=1.00\) m oscila alrededor de un extremo. Halle el período y la longitud equivalente.</p>
<details><summary>Solución</summary>
<p>\(I=mL^2/3\), \(d=L/2\): \(\ell_{\text{eq}}=\dfrac{mL^2/3}{mL/2}=\dfrac23L=0.667\) m y \(T_0=2\pi\sqrt{0.667/9.81}=1.64\) s. El centro de oscilación está a \(2L/3\) del extremo; si la varilla se cuelga de ese punto, su período también es 1.64 s.</p>
</details>
</div>
</section>

<section>
<h2>Oscilaciones en un potencial arbitrario</h2>
<p>Para una partícula en un pozo \(U(x)\) con energía \(E\), la conservación de la energía da la velocidad \(v(x)=\sqrt{2[E-U(x)]/m}\). El período es el tiempo de ida y vuelta entre los puntos de retorno \(x_1\), \(x_2\) (donde \(U=E\)):</p>
<div class="eq key" data-name="Período en un pozo arbitrario">\[T(E)=2\int_{x_1}^{x_2}\frac{\dd x}{\sqrt{\dfrac2m\left[E-U(x)\right]}} .\]</div>
<p>Sólo en el pozo parabólico \(T\) es independiente de \(E\). En un pozo que se abre más rápido que la parábola (como el del péndulo o el de Morse) el período crece con la energía; en uno que se cierra más rápido (como \(x^4\)) disminuye. En todos los casos, para \(E\) cercana al mínimo, \(T\to2\pi\sqrt{m/U''(x_0)}\).</p>
<div class="sim" data-sim="potential-well" data-title="Partícula en un pozo de potencial: período exacto y aproximación armónica"></div>
<div class="sim-guide"><ul>
<li>En el pozo cuártico \(U\propto x^4\), el período es inversamente proporcional a la amplitud: no existe una frecuencia «natural».</li>
<li>En el potencial de Morse (enlace químico), al acercarse a la energía de disociación el período crece sin límite y la partícula termina escapando.</li>
<li>En el doble pozo, si \(E\) supera la barrera central la partícula pasa de un pozo al otro y el período salta.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Qué longitud debe tener un péndulo simple para que su período sea exactamente 1 s en Popayán (\(g=9.776\) m/s²)?
<details><summary>Respuesta</summary><p>\(\ell=gT^2/4\pi^2=0.2476\) m.</p></details></li>
<li><span class="lvl">Básico</span>Un péndulo de 2.00 m se suelta desde \(30^\circ\). Halle el período exacto y compárelo con \(T_0\).
<details><summary>Respuesta</summary><p>\(T_0=2.837\) s; \(T=T_0\cdot1.0174=2.886\) s (1.7 % mayor).</p></details></li>
<li><span class="lvl">Intermedio</span>Un aro de radio \(R\) cuelga de un clavo y oscila en su plano. Halle el período.
<details><summary>Respuesta</summary><p>\(I=2mR^2\), \(d=R\): \(T=2\pi\sqrt{2R/g}\); \(\ell_{\text{eq}}=2R\).</p></details></li>
<li><span class="lvl">Intermedio</span>¿Cuánto se atrasa por día un reloj de péndulo ajustado a \(5^\circ\) de amplitud si la amplitud aumenta a \(6^\circ\)?
<details><summary>Respuesta</summary><p>\(\Delta T/T\approx(\theta_2^2-\theta_1^2)/16=(0.1047^2-0.0873^2)/16=2.1\times10^{-4}\); unos 18 s por día.</p></details></li>
<li><span class="lvl">Avanzado</span>Una partícula de masa \(m\) se mueve en \(U=\alpha x^4\). Demuestre que \(T\propto1/A\) y halle la constante usando la integral del período.
<details><summary>Respuesta</summary><p>Con \(x=Au\): \(T=\dfrac{4}{A}\sqrt{\dfrac{m}{2\alpha}}\displaystyle\int_0^1\frac{\dd u}{\sqrt{1-u^4}}=\dfrac{5.244}{A}\sqrt{\dfrac m{2\alpha}}\), porque la integral vale 1.311.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que un disco de radio \(R\) colgado de un punto a distancia \(d\) de su centro tiene período mínimo para \(d=R/\sqrt2\) y halle ese período.
<details><summary>Respuesta</summary><p>\(\ell_{\text{eq}}=d+R^2/(2d)\), mínimo en \(d=R/\sqrt2\) con \(\ell_{\text{eq}}=\sqrt2R\): \(T_{\min}=2\pi\sqrt{\sqrt2R/g}\).</p></details></li>
</ol>
</section>
