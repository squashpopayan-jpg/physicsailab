<template class="chapter-src" data-id="superposicion" data-num="7" data-title="Superposición de oscilaciones" data-part="Parte II · Oscilaciones de un grado de libertad" data-short="Batimientos, modulación, suma de N fasores, figuras de Lissajous y armonógrafo">
<p class="lead">Cuando un sistema lineal recibe dos excitaciones, su respuesta es la suma de las respuestas. Sumar oscilaciones de frecuencias distintas o en direcciones distintas produce fenómenos nuevos y visibles (o audibles): batimientos, modulación, figuras de Lissajous. Son el puente entre las oscilaciones y las ondas.</p>

<section>
<h2>Dos oscilaciones de frecuencias próximas: batimientos</h2>
<p>Sumemos dos oscilaciones de igual amplitud y frecuencias \(\omega_1\) y \(\omega_2\). Con la identidad \(\cos a+\cos b=2\cos\frac{a-b}2\cos\frac{a+b}2\):</p>
<div class="eq key" data-name="Batimientos">\[x=A\cos\omega_1t+A\cos\omega_2t=\underbrace{2A\cos\!\left(\frac{\omega_1-\omega_2}{2}t\right)}_{\text{envolvente lenta}}\ \cos\!\left(\frac{\omega_1+\omega_2}{2}t\right).\]</div>
<p>Si las frecuencias son próximas, el resultado es una oscilación rápida a la frecuencia media, cuya amplitud varía lentamente. El oído percibe los máximos de intensidad: suceden con la <span class="term">frecuencia de batimiento</span></p>
<div class="eq key" data-name="Frecuencia de batimiento">\[f_{\text{bat}}=|f_1-f_2| .\]</div>
<p>(La envolvente tiene frecuencia \(|f_1-f_2|/2\), pero su valor absoluto se repite al doble.) Los afinadores de pianos y de guitarras usan los batimientos: al acercar una cuerda a la frecuencia de referencia, los batimientos se hacen más lentos hasta desaparecer.</p>
<p>En el plano complejo, los dos fasores giran a ritmos distintos: la diferencia de fase entre ellos crece como \((\omega_1-\omega_2)t\), y su suma pasa periódicamente de \(2A\) (en fase) a cero (en oposición).</p>
<div class="sim" data-sim="beats" data-title="Batimientos: dos tonos de frecuencias próximas"></div>
<div class="sim-guide"><ul>
<li>Escuche 440 Hz y 443 Hz: tres «golpes» por segundo. Con 440 y 470 Hz los batimientos son tan rápidos que se perciben como una aspereza; con diferencias mayores, como dos notas.</li>
<li>Con amplitudes distintas la envolvente no llega a cero: los batimientos son menos marcados.</li>
</ul></div>
</section>

<section>
<h2>Modulación de amplitud</h2>
<p>Los batimientos son un caso particular de modulación. Una señal portadora de alta frecuencia \(\omega_c\) cuya amplitud se varía lentamente con una señal \(m(t)=\mu\cos\omega_mt\):</p>
<div class="eq">\[x=A\left[1+\mu\cos\omega_mt\right]\cos\omega_ct=A\cos\omega_ct+\frac{\mu A}{2}\cos(\omega_c+\omega_m)t+\frac{\mu A}2\cos(\omega_c-\omega_m)t .\]</div>
<p>La señal modulada contiene tres frecuencias: la portadora y dos <span class="term">bandas laterales</span>. Una emisora de AM que transmite audio de hasta 5 kHz ocupa 10 kHz de espectro. Es el primer ejemplo de una idea central del curso: una señal que cambia en el tiempo contiene una banda de frecuencias.</p>
<div class="sim" data-sim="am-modulation" data-title="Modulación de amplitud y bandas laterales"></div>
</section>

<section>
<h2>Suma de N oscilaciones con desfase progresivo</h2>
<p>Un caso que reaparecerá en las redes de difracción (capítulo 22) y en las antenas: \(N\) oscilaciones de igual amplitud, cada una desfasada \(\delta\) respecto a la anterior. Los fasores forman un arco de polígono regular; sumando la serie geométrica,</p>
<div class="eq key" data-name="Suma de N fasores">\[\sum_{n=0}^{N-1}A\,\ee^{\ii n\delta}=A\,\ee^{\ii(N-1)\delta/2}\,\frac{\sen(N\delta/2)}{\sen(\delta/2)},\qquad |A_{\text{tot}}|=A\left|\frac{\sen(N\delta/2)}{\sen(\delta/2)}\right| .\]</div>
<p>Si \(\delta=0\) (o un múltiplo de \(2\pi\)) todos están en fase y la amplitud es \(NA\): la intensidad es \(N^2\) veces la de uno solo. Basta un pequeño desfase \(\delta=2\pi/N\) para que el polígono se cierre y la suma se anule. Cuanto mayor es \(N\), más estrecho es el pico.</p>
<div class="sim" data-sim="n-phasors" data-title="Suma de N fasores: el polígono que se cierra"></div>
<div class="sim-guide"><ul>
<li>Con \(N=8\), lleve \(\delta\) a \(45^\circ\): el polígono es un octógono cerrado y la amplitud es cero.</li>
<li>Entre ceros hay máximos secundarios mucho menores que el principal; con \(N\) grande, el primero vale aproximadamente el 4.5 % de la intensidad del principal.</li>
</ul></div>
</section>

<section>
<h2>Oscilaciones perpendiculares: figuras de Lissajous</h2>
<p>Un punto que oscila a la vez en \(x\) y en \(y\), por ejemplo un péndulo que puede moverse en dos direcciones o el haz de un osciloscopio con señales en ambas entradas:</p>
<div class="eq">\[x=A_x\cos(\omega_xt),\qquad y=A_y\cos(\omega_yt+\phi).\]</div>
<ul>
<li><strong>Igual frecuencia:</strong> la trayectoria es una elipse. Con \(\phi=0\) o \(\pi\), un segmento; con \(\phi=\pm\pi/2\) y amplitudes iguales, una circunferencia. Es la misma geometría que la polarización de la luz (capítulo 23).</li>
<li><strong>Frecuencias en razón racional \(p/q\):</strong> la curva se cierra; el número de veces que toca los lados verticales y horizontales da la razón de frecuencias. Se usaron para comparar frecuencias con el osciloscopio.</li>
<li><strong>Razón irracional:</strong> la curva nunca se cierra y llena densamente el rectángulo.</li>
</ul>
<div class="sim" data-sim="lissajous" data-title="Figuras de Lissajous"></div>
<div class="sim-guide"><ul>
<li>Con \(\omega_y/\omega_x=2\) y \(\phi=90^\circ\) aparece un «ocho»; con \(\phi=0\), una parábola.</li>
<li>Desafine ligeramente la razón (por ejemplo, 2.01): la figura gira lentamente porque el desfase efectivo cambia con el tiempo. Es el análogo visual de los batimientos.</li>
</ul></div>
</section>

<section>
<h2>El armonógrafo</h2>
<p>En el siglo XIX se construían <span class="term">armonógrafos</span>: dos o más péndulos amortiguados que mueven una pluma sobre un papel. Las curvas resultantes son figuras de Lissajous cuya amplitud decae exponencialmente:</p>
<div class="eq">\[x=A_1\ee^{-\gamma t}\sen(\omega_1t+\phi_1)+A_2\ee^{-\gamma t}\sen(\omega_2t+\phi_2),\quad y=A_3\ee^{-\gamma t}\sen(\omega_3t+\phi_3)+\cdots\]</div>

</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Dos diapasones de 256 Hz y 260 Hz suenan juntos. ¿Cuántos batimientos por segundo se oyen y cuál es la frecuencia del tono percibido?
<details><summary>Respuesta</summary><p>4 batimientos/s; tono de 258 Hz.</p></details></li>
<li><span class="lvl">Básico</span>Una emisora de AM transmite a 1 MHz con audio de hasta 4.5 kHz. ¿Qué banda de frecuencias ocupa?
<details><summary>Respuesta</summary><p>De 995.5 kHz a 1004.5 kHz (9 kHz de ancho).</p></details></li>
<li><span class="lvl">Intermedio</span>Un afinador oye 3 batimientos/s entre una cuerda y un diapasón de 440 Hz. Al tensar la cuerda los batimientos pasan a 5/s. ¿Cuál era la frecuencia de la cuerda?
<details><summary>Respuesta</summary><p>Tensar sube la frecuencia; si los batimientos aumentan, la cuerda ya estaba por encima: 443 Hz.</p></details></li>
<li><span class="lvl">Intermedio</span>Para \(N=6\) fasores de igual amplitud, halle los desfases \(\delta\) (entre 0 y \(2\pi\)) en que la suma se anula.
<details><summary>Respuesta</summary><p>\(\delta=2\pi m/6\) con \(m=1,\dots,5\): 60°, 120°, 180°, 240°, 300°.</p></details></li>
<li><span class="lvl">Avanzado</span>En una figura de Lissajous cerrada, la curva toca 3 veces el borde superior y 2 veces el borde lateral derecho. ¿Cuál es la razón \(\omega_y/\omega_x\)?
<details><summary>Respuesta</summary><p>Cada toque del borde superior es un máximo de \(y\), y cada toque del borde derecho, un máximo de \(x\). En el período común hay tantos máximos como ciclos de cada coordenada: \(\omega_y/\omega_x=3/2\).</p></details></li>
</ol>
</section>
