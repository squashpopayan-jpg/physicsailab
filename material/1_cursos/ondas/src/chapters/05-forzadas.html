<template class="chapter-src" data-id="forzadas" data-num="5" data-title="Oscilaciones forzadas y resonancia" data-part="Parte II · Oscilaciones de un grado de libertad" data-short="Transitorio y régimen estacionario, curvas de resonancia, potencia absorbida, ancho de banda y aislamiento de vibraciones">
<p class="lead">Cuando una fuerza periódica actúa sobre un oscilador, éste termina vibrando a la frecuencia de la fuerza, no a la suya. Pero la amplitud de esa respuesta depende dramáticamente de qué tan cerca esté la frecuencia impuesta de la natural: es la resonancia, responsable de que una copa se rompa con la voz, de que una radio sintonice una sola emisora y de que un columpio suba empujándolo poco a poco.</p>

<section>
<h2>La ecuación del oscilador forzado</h2>
<p>Agregando una fuerza externa \(F_0\cos\omega t\) al oscilador amortiguado:</p>
<div class="eq key" data-name="Oscilador forzado">\[\ddot x+\gamma\dot x+\omega_0^2x=\frac{F_0}{m}\cos\omega t .\]</div>
<p>Por la linealidad, la solución general es la suma de una solución particular y la solución general de la ecuación homogénea:</p>
<div class="eq">\[x(t)=\underbrace{A(\omega)\cos(\omega t-\delta)}_{\text{estacionaria}}+\underbrace{C\ee^{-\gamma t/2}\cos(\omega_dt+\varphi)}_{\text{transitorio}} .\]</div>
<p>El transitorio depende de las condiciones iniciales y se extingue en un tiempo del orden de \(2/\gamma\). Lo que queda, el <span class="term">régimen estacionario</span>, oscila a la frecuencia de la fuerza \(\omega\) con una amplitud y un desfase que sólo dependen de \(\omega\) y de los parámetros del oscilador.</p>
<div class="sim" data-sim="forced-transient" data-title="Transitorio y régimen estacionario"></div>
<div class="sim-guide"><ul>
<li>Con \(Q\) alto y \(\omega\) cercana a \(\omega_0\), al principio aparecen batimientos entre la frecuencia natural (el transitorio) y la de la fuerza; desaparecen en un tiempo \(\sim2Q/\omega_0\).</li>
<li>Exactamente en resonancia y sin amortiguamiento, la amplitud crece linealmente con el tiempo: \(x=\dfrac{F_0}{2m\omega_0}\,t\,\sen\omega_0t\).</li>
</ul></div>
</section>

<section>
<h2>Amplitud y fase en el régimen estacionario</h2>
<p>Con fasores: se busca \(x=\Rea[\tl A\ee^{\ii\omega t}]\) para la fuerza \(\Rea[(F_0/m)\ee^{\ii\omega t}]\). Sustituyendo, \((-\omega^2+\ii\gamma\omega+\omega_0^2)\tl A=F_0/m\), es decir,</p>
<div class="eq key" data-name="Respuesta estacionaria">\[\tl A=\frac{F_0/m}{\omega_0^2-\omega^2+\ii\gamma\omega},\qquad A(\omega)=\frac{F_0/m}{\sqrt{(\omega_0^2-\omega^2)^2+\gamma^2\omega^2}},\qquad \tg\delta=\frac{\gamma\omega}{\omega_0^2-\omega^2}.\]</div>
<p>El desfase \(\delta\) (el retraso de la respuesta respecto a la fuerza) va de 0 a \(\pi\). Hay tres zonas:</p>
<ul>
<li><strong>\(\omega\ll\omega_0\) (zona elástica):</strong> \(A\approx F_0/k\), \(\delta\approx0\). El resorte domina; la masa sigue a la fuerza como si el sistema fuera estático.</li>
<li><strong>\(\omega\approx\omega_0\) (resonancia):</strong> \(A\approx F_0/(m\gamma\omega_0)=Q\,F_0/k\), \(\delta=\pi/2\). La fricción es lo único que limita la amplitud; la respuesta es \(Q\) veces la estática.</li>
<li><strong>\(\omega\gg\omega_0\) (zona inercial):</strong> \(A\approx F_0/(m\omega^2)\), \(\delta\approx\pi\). La inercia domina; la masa se mueve en oposición a la fuerza.</li>
</ul>
<p>El máximo de amplitud ocurre en \(\omega_r=\sqrt{\omega_0^2-\gamma^2/2}\), ligeramente por debajo de \(\omega_0\); existe sólo si \(Q\gt1/\sqrt2\).</p>
<div class="sim" data-sim="resonance-curves" data-title="Curvas de resonancia: amplitud y desfase"></div>
<div class="sim-guide"><ul>
<li>Pase \(\omega\) por la resonancia y mire la animación: el bloque pasa de moverse con la fuerza a moverse contra ella. En resonancia la fuerza va adelantada un cuarto de ciclo: empuja siempre a favor de la velocidad.</li>
<li>Aumente \(Q\): el pico se vuelve más alto y más estrecho, y el salto de fase, más brusco.</li>
</ul></div>
</section>

<section>
<h2>Potencia absorbida y ancho de banda</h2>
<p>La potencia que la fuerza entrega en promedio es igual a la que disipa la fricción:</p>
<div class="eq">\[\langle P\rangle=\langle F\dot x\rangle=\tfrac12F_0\,\omega A\sen\delta=\frac{F_0^2}{2m}\,\frac{\gamma\omega^2}{(\omega_0^2-\omega^2)^2+\gamma^2\omega^2}.\]</div>
<p>Su máximo está exactamente en \(\omega=\omega_0\) y vale \(F_0^2/(2m\gamma)\). Cerca de la resonancia, con \(\omega_0^2-\omega^2\approx2\omega_0(\omega_0-\omega)\), la curva es una <span class="term">lorentziana</span>:</p>
<div class="eq key" data-name="Lorentziana y ancho de banda">\[\langle P\rangle\approx P_{\max}\,\frac{(\gamma/2)^2}{(\omega-\omega_0)^2+(\gamma/2)^2},\qquad \Delta\omega_{1/2}=\gamma,\qquad Q=\frac{\omega_0}{\Delta\omega_{1/2}}.\]</div>
<p>El ancho de la curva a media potencia es \(\gamma\). Esto da una segunda lectura del factor de calidad: \(Q\) mide la <em>selectividad</em> del oscilador. Un circuito sintonizado de radio con \(Q=100\) a 1 MHz tiene un ancho de banda de 10 kHz, suficiente para separar emisoras vecinas.</p>
<div class="box note">
<h4>Dos caras del mismo número</h4>
<p>Un oscilador muy selectivo (\(Q\) alto) necesita mucho tiempo para responder: su transitorio dura \(\sim Q\) períodos. La relación \(\Delta\omega\cdot\tau_E=1\), entre ancho de banda y tiempo de vida de la energía, es un primer encuentro con el principio de incertidumbre de las ondas (capítulo 15).</p>
</div>
<div class="sim" data-sim="power-resonance" data-title="Potencia absorbida, lorentziana y ancho de banda"></div>
</section>

<section>
<h2>Aislamiento de vibraciones y sismógrafos</h2>
<p>Con frecuencia la excitación no es una fuerza sino un movimiento de la base: una máquina sobre un piso que vibra, un edificio durante un sismo, un automóvil sobre un camino ondulado. Si la base se mueve como \(y=Y\cos\omega t\) y la masa está unida a ella por un resorte y un amortiguador, la ecuación para \(x\) es \(\ddot x+\gamma(\dot x-\dot y)+\omega_0^2(x-y)=0\). La razón de amplitudes, o <span class="term">transmisibilidad</span>, es</p>
<div class="eq key" data-name="Transmisibilidad">\[\frac{X}{Y}=\sqrt{\frac{\omega_0^4+\gamma^2\omega^2}{(\omega_0^2-\omega^2)^2+\gamma^2\omega^2}} .\]</div>
<p>Para \(\omega\lt\sqrt2\,\omega_0\) la vibración se <em>amplifica</em>; para \(\omega\gt\sqrt2\,\omega_0\) se atenúa. Por eso los soportes antivibratorios son blandos (\(\omega_0\) baja). Curiosamente, en la zona de aislamiento el amortiguamiento empeora el resultado: hay que elegir entre limitar el pico de resonancia y aislar bien a alta frecuencia.</p>
<p>Un <span class="term">sismógrafo</span> usa el mismo sistema al revés: con \(\omega\gg\omega_0\) la masa queda casi quieta en el espacio y el movimiento relativo \(x-y\) reproduce el del suelo.</p>
<div class="sim" data-sim="vibration-isolation" data-title="Masa sobre una base que vibra: transmisibilidad"></div>
<div class="sim-guide"><ul>
<li>Ubique \(\omega=\sqrt2\,\omega_0\): todas las curvas de transmisibilidad pasan por 1, sin importar el amortiguamiento.</li>
<li>Con \(\omega=4\omega_0\), compare \(\zeta=0.05\) y \(\zeta=0.5\): el sistema menos amortiguado aísla mejor.</li>
</ul></div>
</section>

<section>
<h2>Resonancia en el mundo real</h2>
<ul>
<li><strong>Copas que se rompen:</strong> una copa de cristal fino tiene \(Q\sim10^3\); una nota sostenida a su frecuencia propia (unos 500–1000 Hz) acumula energía durante cientos de ciclos.</li>
<li><strong>Puentes peatonales:</strong> el Millennium Bridge de Londres (2000) oscilaba lateralmente porque los peatones, al balancearse, se sincronizaban con el puente: una retroalimentación entre fuerza y respuesta. El famoso colapso de Tacoma Narrows (1940) no fue una resonancia simple con el viento, sino una inestabilidad aeroelástica (<em>flameo</em>), un fenómeno autoexcitado.</li>
<li><strong>Edificios y sismos:</strong> en Ciudad de México (1985), los edificios de 6 a 15 pisos, con períodos cercanos a 2 s, coincidieron con el período del suelo lacustre amplificado y sufrieron la mayor parte del daño.</li>
<li><strong>Resonancia magnética y espectroscopía:</strong> las moléculas absorben radiación sólo en las frecuencias de sus modos de vibración: la curva de absorción es una lorentziana cuyo ancho revela su tiempo de vida.</li>
</ul>
<div class="box ex">
<h4>Amplitud de un motor sobre una viga</h4>
<p>Un motor de 50 kg montado sobre una viga (que se comporta como un resorte de \(k=2\times10^6\) N/m, \(\zeta=0.05\)) tiene un rotor desbalanceado que produce una fuerza de 200 N a 1800 rpm. Halle la amplitud de vibración. ¿Qué pasaría a 1910 rpm?</p>
<details><summary>Solución</summary>
<p>\(\omega_0=\sqrt{k/m}=200\) rad/s; \(\omega=1800\cdot2\pi/60=188.5\) rad/s; \(r=\omega/\omega_0=0.942\). \(A=\dfrac{F_0/k}{\sqrt{(1-r^2)^2+(2\zeta r)^2}}=\dfrac{10^{-4}\text{ m}}{\sqrt{0.0125+0.0089}}=0.68\) mm. A 1910 rpm (\(\omega=200\) rad/s) la amplitud es \(Q\,F_0/k=10\times0.1\) mm \(=1.0\) mm.</p>
</details>
</div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un oscilador con \(m=1\) kg, \(k=100\) N/m, \(b=2\) kg/s es forzado con \(F_0=5\) N. Halle la amplitud a \(\omega=5\), 10 y 20 rad/s.
<details><summary>Respuesta</summary><p>\(A=\dfrac{5}{\sqrt{(100-\omega^2)^2+4\omega^2}}\): 66.1 mm, 250 mm, 16.5 mm.</p></details></li>
<li><span class="lvl">Básico</span>Para el oscilador anterior, halle \(Q\), el ancho de banda y la potencia máxima absorbida.
<details><summary>Respuesta</summary><p>\(Q=5\); \(\Delta\omega=2\) rad/s; \(P_{\max}=F_0^2/(2b)=6.25\) W.</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que el máximo de amplitud está en \(\omega_r=\sqrt{\omega_0^2-\gamma^2/2}\) y que el máximo de velocidad está exactamente en \(\omega_0\).
<details><summary>Respuesta</summary><p>Minimice \((\omega_0^2-\omega^2)^2+\gamma^2\omega^2\) respecto a \(\omega^2\). Para la velocidad, \(\omega A=\dfrac{F_0/m}{\sqrt{(\omega_0^2/\omega-\omega)^2+\gamma^2}}\), máxima cuando \(\omega=\omega_0\).</p></details></li>
<li><span class="lvl">Intermedio</span>Una máquina de 100 kg que gira a 3000 rpm debe montarse sobre soportes que transmitan al piso sólo el 10 % de la vibración. Sin amortiguamiento, ¿qué constante total deben tener?
<details><summary>Respuesta</summary><p>\(1/(r^2-1)=0.1\Rightarrow r=\sqrt{11}\); \(\omega_0=314/3.317=94.7\) rad/s; \(k=m\omega_0^2=9.0\times10^5\) N/m.</p></details></li>
<li><span class="lvl">Avanzado</span>Resuelva \(\ddot x+\omega_0^2x=(F_0/m)\cos\omega_0t\) con \(x(0)=\dot x(0)=0\) y muestre que la amplitud crece linealmente.
<details><summary>Respuesta</summary><p>\(x=\dfrac{F_0}{2m\omega_0}\,t\sen\omega_0t\) (límite de la solución no resonante cuando \(\omega\to\omega_0\)).</p></details></li>
<li><span class="lvl">Avanzado</span>Muestre que la energía media almacenada en el régimen estacionario es máxima ligeramente por debajo de \(\omega_0\), y que en \(\omega_0\) se cumple \(\langle P\rangle=\gamma\langle E\rangle\).
<details><summary>Respuesta</summary><p>\(\langle E\rangle=\tfrac14mA^2(\omega^2+\omega_0^2)\). En \(\omega_0\): \(\langle E\rangle=\tfrac12m\omega_0^2A^2\) y \(\langle P\rangle=\tfrac12m\gamma\omega_0^2A^2=\gamma\langle E\rangle\).</p></details></li>
</ol>
</section>
