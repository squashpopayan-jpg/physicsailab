<section>
<h2>Oscilaciones de un grado de libertad</h2>
<div class="tablewrap"><table>
<tr><th>Concepto</th><th class="c">Fórmula</th></tr>
<tr><td>MAS</td><td class="c">\(\ddot x+\omega_0^2x=0,\quad x=A\cos(\omega_0t+\varphi),\quad \omega_0=\sqrt{k/m}\)</td></tr>
<tr><td>Amplitud y fase desde condiciones iniciales</td><td class="c">\(A=\sqrt{x_0^2+(v_0/\omega_0)^2},\quad \tg\varphi=-v_0/(\omega_0x_0)\)</td></tr>
<tr><td>Energía</td><td class="c">\(E=\tfrac12kA^2=\tfrac12m\omega_0^2A^2\)</td></tr>
<tr><td>Pequeñas oscilaciones en un potencial</td><td class="c">\(\omega_0=\sqrt{U''(x_0)/m}\)</td></tr>
<tr><td>Péndulo simple</td><td class="c">\(T_0=2\pi\sqrt{\ell/g},\quad T\approx T_0(1+\theta_0^2/16)\)</td></tr>
<tr><td>Péndulo físico</td><td class="c">\(T=2\pi\sqrt{I/(mgd)},\quad \ell_{eq}=I/(md)\)</td></tr>
<tr><td>Amortiguado</td><td class="c">\(\ddot x+\gamma\dot x+\omega_0^2x=0,\quad \omega_d=\sqrt{\omega_0^2-\gamma^2/4},\quad x=A\ee^{-\gamma t/2}\cos(\omega_dt+\varphi)\)</td></tr>
<tr><td>Factor de calidad</td><td class="c">\(Q=\omega_0/\gamma=1/(2\zeta),\quad E=E_0\ee^{-\gamma t}\)</td></tr>
<tr><td>Decremento logarítmico</td><td class="c">\(\delta=\ln(x_n/x_{n+1})=\pi\gamma/\omega_d\)</td></tr>
<tr><td>Forzado (estacionario)</td><td class="c">\(A=\dfrac{F_0/m}{\sqrt{(\omega_0^2-\omega^2)^2+\gamma^2\omega^2}},\quad \tg\delta=\dfrac{\gamma\omega}{\omega_0^2-\omega^2}\)</td></tr>
<tr><td>Potencia absorbida y ancho de banda</td><td class="c">\(P_{\max}=F_0^2/(2m\gamma),\quad \Delta\omega_{1/2}=\gamma=\omega_0/Q\)</td></tr>
<tr><td>Transmisibilidad</td><td class="c">\(X/Y=\sqrt{\dfrac{\omega_0^4+\gamma^2\omega^2}{(\omega_0^2-\omega^2)^2+\gamma^2\omega^2}}\)</td></tr>
<tr><td>Circuito RLC</td><td class="c">\(\omega_0=1/\sqrt{LC},\quad Q=\dfrac1R\sqrt{\dfrac LC},\quad Z=R+\ii(\omega L-1/\omega C)\)</td></tr>
<tr><td>Batimientos</td><td class="c">\(f_{\text{bat}}=|f_1-f_2|\)</td></tr>
<tr><td>Suma de N fasores</td><td class="c">\(|A_{tot}|=A\,|\sen(N\delta/2)/\sen(\delta/2)|\)</td></tr>
<tr><td>Duffing</td><td class="c">\(\omega\approx\omega_0\left(1+3\beta A^2/8\omega_0^2\right)\)</td></tr>
</table></div>
</section>

<section>
<h2>Sistemas acoplados y cadenas</h2>
<div class="tablewrap"><table>
<tr><th>Concepto</th><th class="c">Fórmula</th></tr>
<tr><td>Dos masas iguales acopladas</td><td class="c">\(\omega_1=\sqrt{k/m},\quad\omega_2=\sqrt{(k+2\kappa)/m}\)</td></tr>
<tr><td>Ecuación secular</td><td class="c">\(\det(\mathsf K-\omega^2\mathsf M)=0\)</td></tr>
<tr><td>Cadena de N cuentas</td><td class="c">\(\omega_p=2\omega_0\sen\dfrac{p\pi}{2(N+1)},\quad \omega_0=\sqrt{T/ma}\)</td></tr>
<tr><td>Relación de dispersión de la cadena</td><td class="c">\(\omega=2\omega_0|\sen(ka/2)|\)</td></tr>
<tr><td>Cadena diatómica</td><td class="c">\(\omega_\pm^2=\kappa\left(\tfrac1{m_1}+\tfrac1{m_2}\right)\pm\kappa\sqrt{\left(\tfrac1{m_1}+\tfrac1{m_2}\right)^2-\tfrac{4\sen^2(ka/2)}{m_1m_2}}\)</td></tr>
</table></div>
</section>

<section>
<h2>Ondas mecánicas</h2>
<div class="tablewrap"><table>
<tr><th>Concepto</th><th class="c">Fórmula</th></tr>
<tr><td>Ecuación de onda y d'Alembert</td><td class="c">\(\partial_t^2y=v^2\partial_x^2y,\quad y=f(x-vt)+g(x+vt)\)</td></tr>
<tr><td>Onda armónica</td><td class="c">\(y=A\cos(kx-\omega t),\quad k=2\pi/\lambda,\quad v=\omega/k=\lambda f\)</td></tr>
<tr><td>Cuerda: velocidad e impedancia</td><td class="c">\(v=\sqrt{T/\mu},\quad Z=\sqrt{T\mu}=\mu v\)</td></tr>
<tr><td>Energía y potencia</td><td class="c">\(\langle u\rangle=\tfrac12\mu\omega^2A^2,\quad \langle P\rangle=\tfrac12Z\omega^2A^2\)</td></tr>
<tr><td>Reflexión y transmisión</td><td class="c">\(r=\dfrac{Z_1-Z_2}{Z_1+Z_2},\quad\tau=\dfrac{2Z_1}{Z_1+Z_2},\quad R+\mathcal T=1\)</td></tr>
<tr><td>Acoplador de cuarto de onda</td><td class="c">\(Z_m=\sqrt{Z_1Z_2},\quad d=\lambda_m/4\)</td></tr>
<tr><td>Modos de cuerda fija</td><td class="c">\(f_n=nv/2L\)</td></tr>
<tr><td>Cuerda pulsada</td><td class="c">\(a_n=\dfrac{2hL^2}{\pi^2n^2d(L-d)}\sen\dfrac{n\pi d}L\)</td></tr>
<tr><td>Serie de Fourier</td><td class="c">\(c_n=\dfrac1T\displaystyle\int_0^Tf\,\ee^{-\ii n\omega_1t}\dd t,\quad \langle f^2\rangle=\sum|c_n|^2\)</td></tr>
<tr><td>Incertidumbre de las ondas</td><td class="c">\(\Delta t\,\Delta\omega\ge\tfrac12\)</td></tr>
<tr><td>Velocidades de fase y de grupo</td><td class="c">\(v_f=\omega/k,\quad v_g=\dd\omega/\dd k\)</td></tr>
<tr><td>Olas en el agua</td><td class="c">\(\omega^2=(gk+\sigma k^3/\rho)\tanh kh\)</td></tr>
</table></div>
</section>

<section>
<h2>Sonido</h2>
<div class="tablewrap"><table>
<tr><th>Concepto</th><th class="c">Fórmula</th></tr>
<tr><td>Presión acústica</td><td class="c">\(p=-B\,\partial s/\partial x,\quad p_0=\rho v\omega s_0\)</td></tr>
<tr><td>Velocidad del sonido</td><td class="c">\(v=\sqrt{B/\rho}=\sqrt{\gamma RT/M},\quad v_{\text{aire}}\approx331+0.6\,T_C\) m/s</td></tr>
<tr><td>Intensidad</td><td class="c">\(I=p_0^2/(2\rho v)\)</td></tr>
<tr><td>Nivel sonoro</td><td class="c">\(\beta=10\log_{10}(I/10^{-12}\ \text{W/m}^2)\) dB</td></tr>
<tr><td>Onda esférica</td><td class="c">\(I=P/4\pi r^2\) (−6 dB al duplicar la distancia)</td></tr>
<tr><td>Tubos</td><td class="c">abierto: \(f_n=nv/2L\); cerrado: \(f_n=(2n-1)v/4L\)</td></tr>
<tr><td>Resonador de Helmholtz</td><td class="c">\(f=\dfrac{v}{2\pi}\sqrt{\dfrac S{VL'}}\)</td></tr>
<tr><td>Cents</td><td class="c">\(1200\log_2(f_2/f_1)\)</td></tr>
<tr><td>Efecto Doppler</td><td class="c">\(f'=f\,\dfrac{v+v_o}{v-v_s}\)</td></tr>
<tr><td>Eco Doppler</td><td class="c">\(\Delta f\approx2u\cos\theta\,f/v\)</td></tr>
<tr><td>Cono de Mach</td><td class="c">\(\sen\alpha=v/v_s\)</td></tr>
</table></div>
</section>
