<template class="chapter-src" data-id="nolineales" data-num="8" data-title="Oscilaciones no lineales y caos" data-part="Parte II · Oscilaciones de un grado de libertad" data-short="Anarmonicidad, oscilador de Duffing y sus saltos, resonancia paramétrica, ciclos límite y péndulo caótico">
<p class="lead">La aproximación lineal es excelente para oscilaciones pequeñas, pero muchos fenómenos sólo existen fuera de ella: la frecuencia que cambia con la amplitud, la respuesta que salta bruscamente al variar la frecuencia, el columpio que se impulsa sin que nadie lo empuje, los relojes que mantienen su amplitud por sí solos y el movimiento caótico, determinista pero impredecible.</p>

<section>
<h2>Más allá de la aproximación lineal</h2>
<p>Si en el desarrollo del potencial se conservan los términos siguientes al cuadrático, la fuerza restauradora deja de ser lineal. Un modelo general para un oscilador ligeramente anarmónico es</p>
<div class="eq">\[\ddot x+\omega_0^2x+\alpha x^2+\beta x^3=0 .\]</div>
<p>Dos efectos aparecen de inmediato:</p>
<ul>
<li><strong>Generación de armónicos:</strong> si \(x\approx A\cos\omega t\), el término \(x^2\) produce \(\tfrac12A^2(1+\cos2\omega t)\) y el término \(x^3\), componentes en \(3\omega\). La oscilación deja de ser sinusoidal: su espectro contiene múltiplos de la frecuencia fundamental. (El término cuadrático, además, desplaza el centro de la oscilación: es la causa de la dilatación térmica de los sólidos.)</li>
<li><strong>Frecuencia dependiente de la amplitud:</strong> para el término cúbico (oscilador de Duffing) un cálculo perturbativo (método de Lindstedt–Poincaré) da</li>
</ul>
<div class="eq key" data-name="Corrección de frecuencia de Duffing">\[\omega\approx\omega_0\left(1+\frac{3\beta A^2}{8\omega_0^2}\right).\]</div>
<p>Si \(\beta\gt0\) el resorte se <em>endurece</em> y la frecuencia sube con la amplitud; si \(\beta\lt0\) se <em>ablanda</em>. El péndulo es un resorte blando: \(\sen\theta\approx\theta-\theta^3/6\) da \(\beta=-\omega_0^2/6\) y \(\omega\approx\omega_0(1-\theta_0^2/16)\), de acuerdo con el resultado exacto del capítulo 3.</p>
<div class="sim" data-sim="anharmonic" data-title="Oscilador anarmónico: forma de la onda y armónicos"></div>
<div class="sim-guide"><ul>
<li>Con sólo el término cúbico, el espectro tiene armónicos impares (3, 5, …); con el cuadrático aparecen también los pares y un desplazamiento medio.</li>
<li>Aumente la amplitud con \(\beta\gt0\): la frecuencia medida sube como predice la fórmula, mientras \(\beta A^2\) sea pequeño frente a \(\omega_0^2\).</li>
</ul></div>
</section>

<section>
<h2>El oscilador de Duffing forzado: histéresis y saltos</h2>
<p>Al forzar el oscilador de Duffing, \(\ddot x+\gamma\dot x+\omega_0^2x+\beta x^3=(F_0/m)\cos\omega t\), y suponer \(x\approx A\cos(\omega t-\delta)\) (balance armónico), se obtiene la relación entre amplitud y frecuencia:</p>
<div class="eq key" data-name="Respuesta de Duffing">\[\left[\left(\omega_0^2+\tfrac34\beta A^2-\omega^2\right)^2+\gamma^2\omega^2\right]A^2=\left(\frac{F_0}{m}\right)^2 .\]</div>
<p>La curva de resonancia se inclina hacia frecuencias altas (resorte duro) o bajas (blando). Si la inclinación es suficiente, para ciertas frecuencias hay <em>tres</em> amplitudes posibles: la intermedia es inestable, y el sistema elige una de las otras dos según su historia. Al barrer la frecuencia hacia arriba, la amplitud sigue la rama alta hasta que ésta termina y <em>salta</em> abajo; al barrer hacia abajo, salta arriba en otra frecuencia. Es un ciclo de <span class="term">histéresis</span>.</p>
<div class="sim" data-sim="duffing-sweep" data-title="Barrido de frecuencia en el oscilador de Duffing"></div>
<div class="sim-guide"><ul>
<li>Barra hacia arriba y luego hacia abajo: los puntos medidos (integrando la ecuación) siguen ramas distintas de la curva teórica.</li>
<li>Con \(\beta=0\) desaparece la histéresis y se recupera la lorentziana del capítulo 5.</li>
</ul></div>
</section>

<section>
<h2>Resonancia paramétrica</h2>
<p>Un niño en un columpio no recibe empujones: sube y baja su centro de masa, es decir, modifica periódicamente un <em>parámetro</em> del oscilador (la longitud efectiva del péndulo). Un péndulo cuyo punto de suspensión oscila verticalmente con \(a\cos\Omega t\) obedece la <span class="term">ecuación de Mathieu</span>:</p>
<div class="eq key" data-name="Ecuación de Mathieu">\[\ddot\theta+\gamma\dot\theta+\omega_0^2\left[1+h\cos\Omega t\right]\theta=0,\qquad h=\frac{a\Omega^2}{g}.\]</div>
<p>El reposo se vuelve inestable, y la oscilación crece exponencialmente, cuando \(\Omega\) está cerca de \(2\omega_0/n\) (\(n=1,2,\dots\)); la zona más ancha es \(\Omega\approx2\omega_0\): se bombea dos veces por ciclo. Para que haya crecimiento, la modulación debe superar al amortiguamiento: \(h\gt2\gamma/\omega_0\) en la resonancia principal. A diferencia de la resonancia ordinaria, si el sistema está exactamente en reposo, no se excita nada: hace falta una pequeña perturbación inicial.</p>
<p>Con la suspensión vibrando muy rápido (\(\Omega\gg\omega_0\)) y con amplitud suficiente ocurre algo sorprendente: el péndulo invertido se vuelve estable (el <em>péndulo de Kapitza</em>), condición \(a^2\Omega^2\gt2g\ell\).</p>
<div class="sim" data-sim="parametric" data-title="Péndulo con suspensión oscilante: resonancia paramétrica"></div>
<div class="sim-guide"><ul>
<li>Con \(\Omega=2\omega_0\) y \(h=0.3\), una perturbación mínima crece hasta oscilaciones grandes, limitadas sólo por la no linealidad.</li>
<li>Elija «invertido», \(\Omega=40\,\omega_0\) y aumente la amplitud de la suspensión hasta superar la condición de Kapitza: el péndulo se sostiene cabeza abajo.</li>
</ul></div>
</section>

<section>
<h2>Autooscilaciones y ciclos límite</h2>
<p>Un reloj, un violín o el corazón oscilan con una amplitud que no depende de cómo empezaron: la fuente de energía (la cuerda del reloj, el arco, el metabolismo) compensa exactamente las pérdidas en una amplitud determinada. El modelo clásico es el <span class="term">oscilador de van der Pol</span>, propuesto en 1926 para circuitos con válvulas de vacío:</p>
<div class="eq key" data-name="Oscilador de van der Pol">\[\ddot x-\mu\left(1-x^2\right)\dot x+\omega_0^2x=0 .\]</div>
<p>Para \(|x|\lt1\) el «amortiguamiento» es negativo y la oscilación crece; para \(|x|\gt1\) es positivo y decrece. Todas las trayectorias del espacio de fases convergen a una curva cerrada aislada, el <span class="term">ciclo límite</span>, de amplitud cercana a 2. Con \(\mu\) grande las oscilaciones se vuelven de <em>relajación</em>: lentas acumulaciones seguidas de descargas bruscas, como el latido cardíaco o el goteo de una llave.</p>
<div class="sim" data-sim="van-der-pol" data-title="Oscilador de van der Pol: el ciclo límite"></div>
</section>

<section>
<h2>El péndulo forzado y el caos</h2>
<p>Un péndulo amortiguado y forzado, sin aproximación de ángulo pequeño, cumple</p>
<div class="eq">\[\ddot\theta+\gamma\dot\theta+\omega_0^2\sen\theta=\frac{F_0}{mL}\cos\omega t .\]</div>
<p>Sólo tiene un grado de libertad, pero el forzamiento agrega el tiempo como tercera variable del espacio de fases, y eso basta para que aparezca el <span class="term">caos</span>: para ciertos valores de la fuerza el movimiento nunca se repite, y dos condiciones iniciales que difieren en \(10^{-6}\) rad divergen exponencialmente hasta volverse completamente distintas. El sistema es determinista, pero la predicción a largo plazo es imposible en la práctica.</p>
<p>Una herramienta para ver orden en el caos es la <span class="term">sección de Poincaré</span>: se marca el estado \((\theta,\dot\theta)\) una vez por período de la fuerza. Un movimiento periódico deja un solo punto (o \(n\) puntos si su período es \(n\) veces el de la fuerza); uno caótico dibuja una figura fractal, el <em>atractor extraño</em>.</p>
<div class="sim" data-sim="chaotic-pendulum" data-title="Péndulo forzado: sensibilidad a las condiciones iniciales y sección de Poincaré"></div>
<div class="sim-guide"><ul>
<li>Con \(F=0.9\) (en unidades de \(mL\omega_0^2\)) el movimiento se vuelve periódico tras un transitorio, y los dos péndulos coinciden.</li>
<li>Con \(F=1.15\) los dos péndulos, que empiezan separados una millonésima de radián, se separan visiblemente tras unas pocas decenas de oscilaciones; la sección de Poincaré dibuja el atractor extraño.</li>
</ul></div>
<p>Barriendo la amplitud de la fuerza y registrando los puntos de la sección de Poincaré se obtiene el <span class="term">diagrama de bifurcaciones</span>: un período, luego dos, cuatro, ocho… y caos. Esta cascada de duplicaciones de período tiene propiedades universales (las constantes de Feigenbaum) compartidas por sistemas tan distintos como fluidos, láseres y poblaciones de animales.</p>
<div class="sim" data-sim="bifurcation" data-title="Diagrama de bifurcaciones del péndulo forzado"></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un oscilador de Duffing con \(\omega_0=10\) rad/s y \(\beta=200\) m⁻²s⁻² oscila con amplitud 0.2 m. Estime su frecuencia.
<details><summary>Respuesta</summary><p>\(\omega\approx10\left(1+\frac{3\cdot200\cdot0.04}{800}\right)=10.3\) rad/s.</p></details></li>
<li><span class="lvl">Básico</span>Un columpio de 2.5 m de longitud efectiva. ¿Con qué frecuencia debe el niño subir y bajar su centro de masa para bombearlo de manera más eficaz?
<details><summary>Respuesta</summary><p>\(f_0=\tfrac1{2\pi}\sqrt{g/\ell}=0.315\) Hz; bombeo a \(2f_0=0.63\) Hz: dos veces por oscilación.</p></details></li>
<li><span class="lvl">Intermedio</span>Muestre que para \(x=A\cos\omega t\), \(x^3=\tfrac34A^3\cos\omega t+\tfrac14A^3\cos3\omega t\), y use el resultado para deducir la ecuación de balance armónico de Duffing sin amortiguamiento.
<details><summary>Respuesta</summary><p>Sustituyendo y conservando sólo la componente en \(\cos\omega t\): \((\omega_0^2-\omega^2)A+\tfrac34\beta A^3=F_0/m\).</p></details></li>
<li><span class="lvl">Intermedio</span>Para el péndulo de Kapitza, ¿qué amplitud mínima de vibración a 50 Hz estabiliza en posición invertida una varilla equivalente de 20 cm?
<details><summary>Respuesta</summary><p>\(a\gt\sqrt{2g\ell}/\Omega=\sqrt{2\cdot9.8\cdot0.2}/314=6.3\) mm.</p></details></li>
<li><span class="lvl">Avanzado</span>Si dos trayectorias caóticas se separan como \(\delta(t)=\delta_0\ee^{\lambda t}\) con \(\lambda=0.15\) s⁻¹, y la condición inicial se conoce con precisión \(10^{-6}\), ¿hasta qué tiempo se puede predecir el estado con un error menor que 0.1? ¿Y si la precisión mejora a \(10^{-12}\)?
<details><summary>Respuesta</summary><p>\(t=\ln(10^5)/0.15=77\) s; con \(10^{-12}\), \(t=\ln(10^{11})/0.15=169\) s. Mejorar un millón de veces la precisión sólo duplica el horizonte de predicción.</p></details></li>
</ol>
