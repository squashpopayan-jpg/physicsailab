<template class="chapter-src" data-id="estacionarias" data-num="14" data-title="Ondas estacionarias y modos normales" data-part="Parte IV · Ondas mecánicas" data-short="Nodos y vientres, modos de una cuerda, armónicos, cuerda pulsada y golpeada, resonancia de Melde">
<p class="lead">Una cuerda de guitarra no tiene espacio para que una onda viaje lejos: la onda se refleja en los dos extremos, una y otra vez. La superposición de las ondas que van y vienen produce ondas estacionarias, patrones que no avanzan. Sólo ciertas frecuencias caben en la cuerda: son sus modos normales, la versión continua de los modos de la cadena del capítulo 10, y el origen de las notas musicales.</p>

<section>
<h2>Superposición de dos ondas opuestas</h2>
<p>Sumemos dos ondas armónicas de igual amplitud y frecuencia que viajan en sentidos opuestos:</p>
<div class="eq key" data-name="Onda estacionaria">\[y=A\sen(kx-\omega t)+A\sen(kx+\omega t)=2A\sen(kx)\cos(\omega t).\]</div>
<p>El resultado ya no es función de \(x\pm vt\): cada punto oscila con MAS, en fase con todos los demás (o en oposición), y con una amplitud \(2A|\sen kx|\) que depende de su posición. Los puntos donde \(\sen kx=0\), separados \(\lambda/2\), no se mueven nunca: son los <span class="term">nodos</span>. A medio camino entre ellos están los <span class="term">vientres</span> (o antinodos), de amplitud \(2A\).</p>
<p>La energía no viaja: la potencia promedio a través de cualquier punto es cero, porque las dos ondas llevan la misma potencia en sentidos opuestos. En cambio, como en un oscilador, la energía se alterna entre cinética (cuando la cuerda está recta) y potencial (cuando está en su máxima deformación).</p>
<div class="sim" data-sim="standing-from-two" data-title="Dos ondas viajeras forman una onda estacionaria"></div>
<div class="sim-guide"><ul>
<li>Con amplitudes distintas, la onda resultante es en parte estacionaria y en parte viajera: no hay nodos verdaderos, sólo mínimos. La razón entre el máximo y el mínimo de la envolvente se llama razón de onda estacionaria (ROE o SWR), y mide la reflexión en una línea de transmisión.</li>
</ul></div>
</section>

<section>
<h2>Los modos de una cuerda fija en los extremos</h2>
<p>Una cuerda de longitud \(L\) fija en \(x=0\) y \(x=L\) debe tener nodos en ambos extremos: \(\sen kL=0\), es decir, \(kL=n\pi\). Caben en la cuerda un número entero de medias longitudes de onda:</p>
<div class="eq key" data-name="Modos de la cuerda fija">\[\lambda_n=\frac{2L}{n},\qquad f_n=\frac{nv}{2L}=\frac{n}{2L}\sqrt{\frac T\mu},\qquad y_n(x,t)=A_n\sen\!\left(\frac{n\pi x}{L}\right)\cos(\omega_nt+\varphi_n).\]</div>
<p>La frecuencia más baja, \(f_1=v/2L\), es la <span class="term">fundamental</span>; las demás son sus múltiplos enteros: la serie de <span class="term">armónicos</span>. Que las frecuencias de los modos sean múltiplos exactos de la fundamental es lo que hace que una cuerda produzca un sonido con altura definida. La ecuación de \(f_1\) resume las tres maneras de afinar: acortar la cuerda (trastes), tensarla (clavijas) o hacerla más liviana (cuerdas más delgadas para las notas agudas). Es la <em>ley de Mersenne</em> (1636).</p>
<p>Si un extremo es libre (o la cuerda se reemplaza por una barra libre en un extremo), allí debe haber un vientre: \(\cos kL=0\), y sólo caben números impares de cuartos de onda, \(f_n=(2n-1)v/4L\).</p>
<div class="sim" data-sim="string-modes" data-title="Modos normales de una cuerda"></div>
<div class="sim-guide"><ul>
<li>Cuente los nodos del modo \(n\): hay \(n-1\) además de los extremos.</li>
<li>Escuche el modo 1 y el modo 2: el segundo suena una octava más agudo; el tercero, una quinta por encima de éste.</li>
<li>Cambie a «un extremo libre»: desaparecen los armónicos pares.</li>
</ul></div>
</section>

<section>
<h2>El movimiento general: superposición de modos</h2>
<p>Como la ecuación es lineal, la solución más general con extremos fijos es la suma de todos los modos:</p>
<div class="eq key" data-name="Solución general con extremos fijos">\[y(x,t)=\sum_{n=1}^{\infty}\sen\!\left(\frac{n\pi x}{L}\right)\left[a_n\cos\omega_nt+b_n\sen\omega_nt\right],\qquad \omega_n=\frac{n\pi v}{L}.\]</div>
<p>Los coeficientes se obtienen de la posición y la velocidad iniciales usando la ortogonalidad de los senos, \(\int_0^L\sen\frac{n\pi x}L\sen\frac{m\pi x}L\dd x=\frac L2\delta_{nm}\):</p>
<div class="eq">\[a_n=\frac2L\int_0^Ly_0(x)\sen\frac{n\pi x}L\,\dd x,\qquad b_n=\frac{2}{\omega_nL}\int_0^Lu_0(x)\sen\frac{n\pi x}L\,\dd x .\]</div>
<p>Es el desarrollo en serie de Fourier que estudiaremos a fondo en el capítulo 15.</p>
<h3>Cuerda pulsada</h3>
<p>Si la cuerda se suelta desde el reposo con forma de triángulo de altura \(h\) y vértice en \(x=d\):</p>
<div class="eq key" data-name="Amplitudes de la cuerda pulsada">\[a_n=\frac{2hL^2}{\pi^2n^2d(L-d)}\sen\frac{n\pi d}{L},\qquad b_n=0 .\]</div>
<p>Las amplitudes caen como \(1/n^2\), y todos los armónicos que tienen un nodo en el punto de pulsación faltan: pulsando en el centro desaparecen todos los pares. Por eso una guitarra suena más «dulce» pulsada cerca del centro (dominan los armónicos bajos) y más «metálica» cerca del puente.</p>
<h3>Cuerda golpeada</h3>
<p>En el piano, un martillo da a un tramo de la cuerda una velocidad inicial sin deformarla. Entonces \(a_n=0\) y, para un martillo angosto, \(b_n\propto\sen(n\pi d/L)/n\): las amplitudes de desplazamiento decaen sólo como \(1/n\), en lugar de \(1/n^2\), y los armónicos altos son más intensos que en la cuerda pulsada. En la práctica, el fieltro del martillo, de ancho finito y blando, recorta los armónicos más altos.</p>
<div class="sim" data-sim="plucked-string" data-title="Cuerda pulsada o golpeada: modos, espectro y sonido"></div>
<div class="sim-guide"><ul>
<li>Pulse exactamente en el centro: en el espectro desaparecen todos los armónicos pares. A un tercio de la longitud, faltan los múltiplos de 3.</li>
<li>Escuche la cuerda pulsada en el centro y cerca del extremo: la misma nota, distinto timbre.</li>
<li>Observe la forma de la cuerda pulsada durante el movimiento: es siempre un polígono de dos o tres tramos rectos (los dos pulsos de d'Alembert que van y vienen).</li>
</ul></div>
</section>

<section>
<h2>Resonancia de una cuerda forzada</h2>
<p>Si un extremo de la cuerda se hace vibrar con frecuencia \(f\) (por ejemplo, con un vibrador eléctrico, como en el experimento de Melde de 1859), en el régimen estacionario la cuerda adopta la forma</p>
<div class="eq">\[y(x,t)=a\,\frac{\sen k(L-x)}{\sen kL}\cos\omega t,\qquad k=\frac\omega v .\]</div>
<p>Cuando \(kL=n\pi\) el denominador se anula: la amplitud crece hasta que la limitan las pérdidas. Las resonancias de la cuerda ocurren exactamente en las frecuencias de sus modos. La cuerda es un sistema con infinitos grados de libertad y, por tanto, con infinitas resonancias, una por modo. El extremo forzado, que se mueve muy poco, es casi un nodo.</p>
<div class="sim" data-sim="melde" data-title="Experimento de Melde: resonancias de una cuerda forzada"></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>La cuerda la (110 Hz) de una guitarra mide 65 cm. Halle la velocidad de las ondas y las frecuencias de los tres primeros armónicos.
<details><summary>Respuesta</summary><p>\(v=2Lf_1=143\) m/s; 110, 220 y 330 Hz.</p></details></li>
<li><span class="lvl">Básico</span>¿Dónde hay que pisar la cuerda anterior para obtener la nota mi (165 Hz)?
<details><summary>Respuesta</summary><p>Longitud vibrante \(L'=L\cdot110/165=43.3\) cm: a 21.7 cm de la cejuela.</p></details></li>
<li><span class="lvl">Intermedio</span>¿En qué porcentaje hay que aumentar la tensión para subir la frecuencia un semitono (factor \(2^{1/12}\))?
<details><summary>Respuesta</summary><p>\(T\propto f^2\): factor \(2^{1/6}=1.122\), un 12.2 %.</p></details></li>
<li><span class="lvl">Intermedio</span>Una cuerda se pulsa a \(L/5\) de un extremo. ¿Qué armónicos faltan? ¿Cuál es la razón entre las amplitudes del segundo y el primer armónico?
<details><summary>Respuesta</summary><p>Faltan los múltiplos de 5. \(a_2/a_1=\dfrac{\sen(2\pi/5)}{4\sen(\pi/5)}=0.405\).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre la fórmula de \(a_n\) de la cuerda pulsada calculando la integral de Fourier del triángulo.
<details><summary>Respuesta</summary><p>Integre por partes en \([0,d]\) y \([d,L]\); los términos de borde se cancelan y queda \(\dfrac2L\cdot\dfrac{hL^2}{n^2\pi^2}\left(\dfrac1d+\dfrac1{L-d}\right)\sen\dfrac{n\pi d}{L}\).</p></details></li>
</ol>
</section>
