<template class="chapter-src" data-id="ecuacion-onda" data-num="11" data-title="La ecuación de onda" data-part="Parte IV · Ondas mecánicas" data-short="Pulsos viajeros, la cuerda tensa, velocidad de propagación, solución de d'Alembert y superposición">
<p class="lead">Una onda es una perturbación que viaja transportando energía y momento, pero no materia: cada porción del medio oscila alrededor de su posición y vuelve a ella. En este capítulo deducimos la ecuación que gobierna las ondas en una cuerda, encontramos su solución general y vemos por qué las ondas pueden atravesarse unas a otras sin alterarse.</p>

<section>
<h2>Ondas viajeras</h2>
<p>Una perturbación \(y=f(x)\) que se desplaza sin deformarse con velocidad \(v\) hacia \(+x\) tiene, en el instante \(t\), la misma forma desplazada \(vt\):</p>
<div class="eq key" data-name="Onda viajera">\[y(x,t)=f(x-vt)\quad(\text{hacia }+x),\qquad y(x,t)=g(x+vt)\quad(\text{hacia }-x).\]</div>
<p>La combinación \(x-vt\) es la «fase»: un punto de fase constante se mueve con \(\dd x/\dd t=v\). Hay dos maneras de mirar la misma onda: una <em>fotografía</em> (\(y\) en función de \(x\) a \(t\) fijo) y un <em>registro</em> (\(y\) en función de \(t\) en un punto fijo, como lo vería un sismógrafo). Para un pulso que viaja hacia \(+x\), el registro es la fotografía invertida de izquierda a derecha: lo que llega primero es el frente.</p>
<p>Según la dirección del movimiento del medio respecto a la de propagación, las ondas son <span class="term">transversales</span> (cuerda, ondas S de los sismos, luz) o <span class="term">longitudinales</span> (sonido, ondas P, resortes comprimidos). Las ondas en la superficie del agua combinan ambos movimientos.</p>
<div class="sim" data-sim="traveling-pulse" data-title="Pulso viajero: fotografía y registro en un punto"></div>
<div class="sim-guide"><ul>
<li>Use un pulso asimétrico (diente de sierra): en el registro del punto fijo aparece con la forma invertida.</li>
<li>Observe la velocidad del <em>medio</em> (flechas): no es la velocidad de la onda, y cambia de signo dentro del pulso. En una onda viajera hacia \(+x\), \(\partial y/\partial t=-v\,\partial y/\partial x\).</li>
</ul></div>
</section>

<section>
<h2>La cuerda tensa</h2>
<p>Consideremos un elemento de cuerda entre \(x\) y \(x+\dd x\), con densidad lineal \(\mu\) y tensión \(T\), y supongamos que las pendientes son pequeñas (\(|\partial y/\partial x|\ll1\)), de modo que la tensión es prácticamente la misma en todo punto y los ángulos cumplen \(\sen\theta\approx\tg\theta=\partial y/\partial x\). La fuerza vertical neta es la diferencia de las componentes de la tensión en los dos extremos:</p>
<div class="eq">\[F_y=T\left.\pdv yx\right|_{x+\dd x}-T\left.\pdv yx\right|_{x}=T\pddv yx\,\dd x .\]</div>
<p>Aplicando la segunda ley de Newton a la masa \(\mu\,\dd x\):</p>
<div class="eq key" data-name="Ecuación de onda">\[\pddv yt=v^2\pddv yx,\qquad v=\sqrt{\frac T\mu}.\]</div>
<p>La aceleración de cada punto es proporcional a la <em>curvatura</em> de la cuerda en ese punto: donde la cuerda es cóncava hacia arriba, acelera hacia arriba. La velocidad crece con la tensión (más fuerza restauradora) y disminuye con la densidad (más inercia), exactamente como \(\omega_0=\sqrt{k/m}\) en un oscilador. Es el mismo resultado que obtuvimos en el capítulo 10 como límite continuo de la cadena de cuentas.</p>
<div class="sim" data-sim="string-forces" data-title="La aceleración de cada punto es proporcional a la curvatura"></div>
<div class="sim-guide"><ul>
<li>Congele la animación: las flechas de aceleración son máximas donde la cuerda se curva más, no donde está más desplazada.</li>
<li>En un tramo recto (aunque esté inclinado) la aceleración es nula: las tensiones de los dos lados se compensan.</li>
</ul></div>
<h3>Velocidades típicas</h3>
<p>Una cuerda de acero de guitarra (mi agudo, diámetro 0.25 mm, \(\mu=0.39\) g/m) afinada a 330 Hz con 65 cm de longitud vibrante tiene \(v=2Lf=429\) m/s y soporta una tensión \(T=\mu v^2\approx72\) N, el peso de unos 7 kg.</p>
<div class="sim" data-sim="string-speed" data-title="Velocidad de onda en cuerdas reales"></div>
</section>

<section>
<h2>La solución de d'Alembert</h2>
<p>Cualquier función de la forma \(f(x-vt)\) o \(g(x+vt)\) satisface la ecuación de onda (basta derivar con la regla de la cadena). En 1747 Jean le Rond d'Alembert demostró que la solución más general es su suma:</p>
<div class="eq key" data-name="Solución general de d'Alembert">\[y(x,t)=f(x-vt)+g(x+vt).\]</div>
<p>Se demuestra con las variables \(\xi=x-vt\), \(\eta=x+vt\), en las que la ecuación se convierte en \(\partial^2y/\partial\xi\partial\eta=0\). Las funciones \(f\) y \(g\) se determinan a partir de la posición inicial \(y_0(x)\) y la velocidad inicial \(u_0(x)\) de la cuerda:</p>
<div class="eq key" data-name="Problema de valores iniciales">\[y(x,t)=\frac{y_0(x-vt)+y_0(x+vt)}{2}+\frac1{2v}\int_{x-vt}^{x+vt}u_0(s)\,\dd s .\]</div>
<p>Una cuerda que se suelta desde el reposo con una deformación se divide en dos pulsos idénticos de la mitad de altura, que viajan en sentidos opuestos. Si en cambio se golpea (velocidad inicial sin deformación, como en un piano), los dos pulsos tienen forma de meseta.</p>
<div class="sim" data-sim="dalembert" data-title="D'Alembert: una deformación inicial se divide en dos pulsos"></div>
<div class="sim-guide"><ul>
<li>Con «Deformación», las dos mitades viajan sin deformarse y se separan.</li>
<li>Con «Golpe» (velocidad inicial, como un martillo de piano), la cuerda se eleva gradualmente: cada punto recibe la integral de la velocidad inicial dentro de su «cono» \([x-vt,\,x+vt]\).</li>
</ul></div>
</section>

<section>
<h2>Superposición</h2>
<p>La ecuación de onda es lineal: la suma de dos soluciones es solución. Dos pulsos que se encuentran se suman punto a punto mientras se superponen, y después continúan como si nada hubiera ocurrido. Si son de signo opuesto e igual forma, en el instante del cruce la cuerda queda completamente recta... pero no en reposo: toda la energía es cinética en ese instante, y los pulsos reaparecen.</p>
<div class="sim" data-sim="pulse-collision" data-title="Choque de dos pulsos: se atraviesan sin alterarse"></div>
<div class="box warn">
<h4>Los límites de la linealidad</h4>
<p>La superposición falla cuando las pendientes dejan de ser pequeñas: la tensión cambia al estirarse la cuerda, y aparecen términos no lineales. Las olas que rompen en la playa, las ondas de choque y los solitones son fenómenos no lineales.</p>
</div>
</section>

<section>
<h2>Otras ondas con la misma ecuación</h2>
<p>La ecuación de onda aparece cada vez que una magnitud tiene «inercia» y una «fuerza restauradora» proporcional a su curvatura. La velocidad siempre es \(\sqrt{\text{rigidez}/\text{inercia}}\):</p>
<div class="tablewrap"><table>
<tr><th>Onda</th><th class="c">Magnitud que oscila</th><th class="c">Velocidad</th><th class="c">Valor típico</th></tr>
<tr><td>Cuerda tensa</td><td class="c">desplazamiento transversal</td><td class="c">\(\sqrt{T/\mu}\)</td><td class="c">100 – 1500 m/s</td></tr>
<tr><td>Longitudinal en una barra</td><td class="c">desplazamiento axial</td><td class="c">\(\sqrt{Y/\rho}\)</td><td class="c">acero: 5100 m/s</td></tr>
<tr><td>Torsional en una barra</td><td class="c">ángulo de giro</td><td class="c">\(\sqrt{G/\rho}\)</td><td class="c">acero: 3200 m/s</td></tr>
<tr><td>Sonido en un fluido</td><td class="c">presión</td><td class="c">\(\sqrt{B/\rho}\)</td><td class="c">aire: 343 m/s; agua: 1480 m/s</td></tr>
<tr><td>Línea de transmisión</td><td class="c">tensión eléctrica</td><td class="c">\(1/\sqrt{L'C'}\)</td><td class="c">coaxial: \(\approx0.66c\)</td></tr>
<tr><td>Luz en el vacío</td><td class="c">campos \(\vb E\), \(\vb B\)</td><td class="c">\(1/\sqrt{\mu_0\varepsilon_0}\)</td><td class="c">\(3.00\times10^8\) m/s</td></tr>
</table></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una cuerda de 2.0 m y 30 g está sometida a 120 N. ¿Cuánto tarda un pulso en recorrerla?
<details><summary>Respuesta</summary><p>\(\mu=0.015\) kg/m; \(v=89.4\) m/s; \(t=22\) ms.</p></details></li>
<li><span class="lvl">Básico</span>Verifique que \(y=\dfrac{A}{1+(x-3t)^2}\) es una onda viajera. ¿Con qué velocidad y en qué sentido se mueve?
<details><summary>Respuesta</summary><p>Es función de \(x-3t\): viaja a 3 m/s hacia \(+x\).</p></details></li>
<li><span class="lvl">Intermedio</span>Una cuerda de piano de acero (\(\rho=7800\) kg/m³, diámetro 1.0 mm) soporta 800 N. Halle la velocidad de las ondas transversales y compárela con la de las longitudinales (\(Y=200\) GPa).
<details><summary>Respuesta</summary><p>\(\mu=6.13\) g/m; \(v_T=361\) m/s; \(v_L=\sqrt{Y/\rho}=5060\) m/s, unas 14 veces mayor.</p></details></li>
<li><span class="lvl">Intermedio</span>Una cuerda en reposo recibe en \(t=0\) un golpe que da velocidad \(u_0\) a un tramo de longitud \(b\). Describa la forma de la cuerda para \(t\gt b/(2v)\).
<details><summary>Respuesta</summary><p>Un trapecio: meseta de altura \(u_0b/(2v)\) cuyo ancho crece como \(2vt-b\), con rampas de ancho \(b\) a cada lado.</p></details></li>
<li><span class="lvl">Avanzado</span>Una cuerda que cuelga verticalmente bajo su propio peso tiene tensión variable \(T=\mu gz\) (con \(z\) medido desde el extremo libre). Halle el tiempo que tarda un pulso en subir una cuerda de longitud \(L\).
<details><summary>Respuesta</summary><p>\(v=\sqrt{gz}\); \(t=\int_0^L\dd z/\sqrt{gz}=2\sqrt{L/g}\).</p></details></li>
</ol>
</section>
