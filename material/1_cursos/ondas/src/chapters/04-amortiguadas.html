<template class="chapter-src" data-id="amortiguadas" data-num="4" data-title="Oscilaciones amortiguadas" data-part="Parte II · Oscilaciones de un grado de libertad" data-short="Fricción viscosa, tres regímenes, decremento logarítmico, factor de calidad y fricción seca">
<p class="lead">Ningún oscilador real oscila para siempre: la fricción con el aire, la deformación interna de los materiales o la resistencia eléctrica disipan su energía. El modelo más útil, y el único que conserva la linealidad, es una fuerza disipativa proporcional a la velocidad.</p>

<section>
<h2>La ecuación del oscilador amortiguado</h2>
<p>A la fuerza del resorte se agrega una fuerza de fricción viscosa \(F_f=-b\dot x\), típica de un objeto que se mueve lentamente en un fluido o de un amortiguador hidráulico. La segunda ley de Newton da</p>
<div class="eq key" data-name="Oscilador amortiguado">\[m\ddot x+b\dot x+kx=0\quad\Longleftrightarrow\quad\ddot x+\gamma\dot x+\omega_0^2x=0,\qquad \gamma=\frac bm,\ \ \omega_0=\sqrt{\frac km}.\]</div>
<p>La constante \(\gamma\) (en s⁻¹) mide la intensidad del amortiguamiento. Las raíces características son \(s=-\gamma/2\pm\sqrt{\gamma^2/4-\omega_0^2}\), y el signo del discriminante separa tres regímenes:</p>
<div class="tablewrap"><table>
<tr><th>Régimen</th><th class="c">Condición</th><th class="c">Solución</th></tr>
<tr><td>Subamortiguado</td><td class="c">\(\gamma\lt2\omega_0\)</td><td class="c">\(x=A\ee^{-\gamma t/2}\cos(\omega_dt+\varphi)\)</td></tr>
<tr><td>Crítico</td><td class="c">\(\gamma=2\omega_0\)</td><td class="c">\(x=(C_1+C_2t)\ee^{-\omega_0t}\)</td></tr>
<tr><td>Sobreamortiguado</td><td class="c">\(\gamma\gt2\omega_0\)</td><td class="c">\(x=C_1\ee^{-\beta_1t}+C_2\ee^{-\beta_2t}\)</td></tr>
</table></div>
<p>donde \(\omega_d=\sqrt{\omega_0^2-\gamma^2/4}\) es la <span class="term">frecuencia amortiguada</span> y \(\beta_{1,2}=\gamma/2\mp\sqrt{\gamma^2/4-\omega_0^2}\). Con frecuencia se usa la <span class="term">razón de amortiguamiento</span> \(\zeta=\gamma/(2\omega_0)\): el régimen crítico corresponde a \(\zeta=1\).</p>
<div class="sim" data-sim="damped-regimes" data-title="Los tres regímenes del oscilador amortiguado"></div>
<div class="sim-guide"><ul>
<li>Con \(\zeta=0.1\) la masa oscila muchas veces dentro de la envolvente \(\pm A\ee^{-\gamma t/2}\); en el espacio de fases la trayectoria es una espiral hacia el origen.</li>
<li>En el régimen sobreamortiguado, según la velocidad inicial, la masa puede cruzar el equilibrio <em>una vez</em>, pero nunca oscila.</li>
<li>Observe que \(\omega_d\) apenas difiere de \(\omega_0\) cuando el amortiguamiento es débil: con \(\zeta=0.1\), sólo un 0.5 %.</li>
</ul></div>
</section>

<section>
<h2>Amortiguamiento débil: decremento logarítmico</h2>
<p>En el régimen subamortiguado los máximos sucesivos, separados un período \(T_d=2\pi/\omega_d\), están en razón constante:</p>
<div class="eq key" data-name="Decremento logarítmico">\[\frac{x_n}{x_{n+1}}=\ee^{\gamma T_d/2},\qquad \delta\equiv\ln\frac{x_n}{x_{n+1}}=\frac{\gamma T_d}{2}=\frac{\pi\gamma}{\omega_d}.\]</div>
<p>Midiendo dos máximos separados \(N\) ciclos, \(\delta=\tfrac1N\ln(x_0/x_N)\). Así se determina experimentalmente \(\gamma\) sin conocer \(b\) ni \(m\). La amplitud decae a \(1/\ee\) en el <span class="term">tiempo de relajación</span> \(\tau_A=2/\gamma\).</p>
<div class="box ex">
<h4>Medida del amortiguamiento de un péndulo</h4>
<p>Un péndulo de período 2.0 s se suelta con 10° de amplitud. Después de 50 oscilaciones la amplitud es 6°. Halle \(\delta\), \(\gamma\) y el tiempo en que la amplitud cae a 1°.</p>
<details><summary>Solución</summary>
<p>\(\delta=\tfrac1{50}\ln(10/6)=0.0102\); \(\gamma=2\delta/T=0.0102\) s⁻¹. La amplitud cae a 1° cuando \(\ee^{-\gamma t/2}=0.1\): \(t=2\ln10/\gamma=450\) s, unas 225 oscilaciones.</p>
</details>
</div>
</section>

<section>
<h2>Energía y factor de calidad</h2>
<p>La potencia disipada por la fricción es \(\dd E/\dd t=-b\dot x^2\). Para amortiguamiento débil, promediando sobre un ciclo (\(\langle\dot x^2\rangle=E/m\)):</p>
<div class="eq">\[\frac{\dd E}{\dd t}=-\gamma E\quad\Rightarrow\quad E(t)=E_0\,\ee^{-\gamma t}.\]</div>
<p>La energía decae al doble de ritmo que la amplitud. La calidad de un oscilador se resume en un número adimensional, el <span class="term">factor de calidad</span>:</p>
<div class="eq key" data-name="Factor de calidad">\[Q=\frac{\omega_0}{\gamma}=2\pi\,\frac{\text{energía almacenada}}{\text{energía perdida por ciclo}}=\frac{1}{2\zeta}.\]</div>
<p>La amplitud cae a \(1/\ee\) en \(Q/\pi\) oscilaciones, y la energía, en \(Q\) radianes de fase. Valores típicos:</p>
<div class="tablewrap narrow"><table>
<tr><th>Oscilador</th><th class="c">\(Q\) aproximado</th></tr>
<tr><td>Amortiguador de automóvil</td><td class="c">0.5</td></tr>
<tr><td>Cuerda de guitarra</td><td class="c">\(10^3\)</td></tr>
<tr><td>Péndulo de reloj</td><td class="c">\(10^4\)</td></tr>
<tr><td>Diapasón</td><td class="c">\(10^3\) – \(10^4\)</td></tr>
<tr><td>Cristal de cuarzo de reloj</td><td class="c">\(10^5\) – \(10^6\)</td></tr>
<tr><td>Cavidad superconductora de microondas</td><td class="c">\(10^{10}\)</td></tr>
<tr><td>Transición atómica de un reloj óptico</td><td class="c">\(10^{17}\)</td></tr>
</table></div>
<div class="sim" data-sim="damped-energy" data-title="Decaimiento de la energía y factor de calidad"></div>
<div class="sim-guide"><ul>
<li>En escala logarítmica, la energía cae en línea recta con pendiente \(-\gamma\). Los escalones visibles se deben al intercambio entre energía cinética y potencial: la pérdida es mayor cuando la velocidad es máxima.</li>
<li>Escuche el oscilador con \(Q=10\) y con \(Q=1000\): un golpe en madera frente a una campana.</li>
</ul></div>
</section>

<section>
<h2>Amortiguamiento crítico y diseño</h2>
<p>En muchos dispositivos se quiere que el sistema vuelva al equilibrio lo antes posible sin oscilar: la aguja de un instrumento analógico, la suspensión de un vehículo, una puerta con cierre automático. El régimen crítico es el que regresa más rápido sin sobrepasar el equilibrio. En la práctica se elige \(\zeta\approx0.6\)–\(0.7\): se acepta un sobrepaso pequeño (del 5 % o menos) a cambio de una respuesta todavía más rápida.</p>
<div class="sim" data-sim="settling-time" data-title="Tiempo de asentamiento en función del amortiguamiento"></div>
<div class="sim-guide"><ul>
<li>Busque el valor de \(\zeta\) que minimiza el tiempo en que la masa queda dentro de la banda de tolerancia. Cambie la tolerancia y observe cómo se mueve el óptimo.</li>
<li>Con amortiguamiento muy grande la respuesta vuelve a ser lenta: el amortiguador «frena» el regreso. El tiempo característico es entonces \(\gamma/\omega_0^2\).</li>
</ul></div>
</section>

<section>
<h2>Fricción seca</h2>
<p>Cuando el bloque roza sobre una superficie, la fuerza de fricción cinética tiene magnitud constante \(\mu_kmg\) y se opone a la velocidad. En cada medio ciclo la ecuación es la de un MAS con el equilibrio desplazado a \(\pm\mu_kmg/k\). El resultado es muy distinto al del amortiguamiento viscoso:</p>
<div class="eq key" data-name="Decaimiento con fricción seca">\[A_{n+1}=A_n-\frac{4\mu_kg}{\omega_0^2}\qquad\text{(por ciclo completo)}.\]</div>
<p>La amplitud decrece <em>linealmente</em> (no exponencialmente), el período no cambia, y el movimiento se detiene en un número finito de ciclos, cuando el resorte ya no logra vencer la fricción estática: \(|x|\le\mu_smg/k\). El bloque puede quedar detenido fuera del equilibrio.</p>
<div class="sim" data-sim="coulomb-friction" data-title="Fricción seca frente a fricción viscosa"></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un oscilador con \(m=0.2\) kg, \(k=80\) N/m y \(b=0.4\) kg/s. Halle \(\omega_0\), \(\gamma\), \(\omega_d\), \(Q\) y el régimen.
<details><summary>Respuesta</summary><p>\(\omega_0=20\) rad/s; \(\gamma=2\) s⁻¹; \(\omega_d=19.97\) rad/s; \(Q=10\); subamortiguado.</p></details></li>
<li><span class="lvl">Básico</span>¿Qué valor de \(b\) produce amortiguamiento crítico en el problema anterior?
<details><summary>Respuesta</summary><p>\(b=2\sqrt{km}=8\) kg/s.</p></details></li>
<li><span class="lvl">Intermedio</span>Un diapasón de 440 Hz tarda 20 s en reducir su energía sonora a la mitad. Halle \(\gamma\) y \(Q\).
<details><summary>Respuesta</summary><p>\(\gamma=\ln2/20=0.0347\) s⁻¹; \(Q=2\pi\cdot440/0.0347=8.0\times10^4\).</p></details></li>
<li><span class="lvl">Intermedio</span>Un automóvil de 1200 kg baja 3.0 cm cuando suben cuatro personas de 75 kg. Halle la constante de la suspensión y la constante de amortiguamiento para \(\zeta=0.7\) (con las personas).
<details><summary>Respuesta</summary><p>\(k=300\cdot9.8/0.03=9.8\times10^4\) N/m; \(b=2\zeta\sqrt{km}=2(0.7)\sqrt{9.8\times10^4\cdot1500}=1.70\times10^4\) kg/s.</p></details></li>
<li><span class="lvl">Intermedio</span>Un bloque en un resorte (\(\omega_0=10\) rad/s) con \(\mu_k=0.1\) se suelta desde 20 cm. ¿Cuántos medios ciclos completa?
<details><summary>Respuesta</summary><p>Pérdida por medio ciclo \(2\mu_kg/\omega_0^2=1.96\) cm; tras 10 medios ciclos la amplitud es 0.4 cm, menor que \(\mu g/\omega_0^2=0.98\) cm (si \(\mu_s=\mu_k\)): se detiene tras 10 medios ciclos.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que, en el régimen crítico con \(x(0)=x_0\) y \(\dot x(0)=0\), la solución es \(x=x_0(1+\omega_0t)\ee^{-\omega_0t}\) y que nunca cruza el equilibrio. ¿Qué velocidad inicial negativa mínima hace que sí lo cruce?
<details><summary>Respuesta</summary><p>Con \(\dot x(0)=v_0\): \(x=[x_0+(v_0+\omega_0x_0)t]\ee^{-\omega_0t}\). Cruza cero si \(v_0\lt-\omega_0x_0\).</p></details></li>
</ol>
</section>
