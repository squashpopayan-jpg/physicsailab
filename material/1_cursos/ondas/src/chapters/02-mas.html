<template class="chapter-src" data-id="mas" data-num="2" data-title="Movimiento armónico simple" data-part="Parte II · Oscilaciones de un grado de libertad" data-short="Masa y resorte, amplitud y fase, círculo de referencia, energía, espacio de fases y un zoológico de osciladores">
<p class="lead">El movimiento armónico simple (MAS) es la oscilación de un sistema con una fuerza restauradora proporcional al desplazamiento. Es el modelo exacto de un resorte ideal y la primera aproximación de cualquier sistema cerca de un equilibrio estable. Todo lo que sigue en el curso se construye sobre él.</p>

<section>
<h2>El sistema masa–resorte</h2>
<p>Un bloque de masa \(m\) sobre una superficie sin fricción está unido a un resorte ideal de constante \(k\). Si \(x\) mide el desplazamiento desde la posición de equilibrio, la ley de Hooke da \(F=-kx\) y la segunda ley de Newton:</p>
<div class="eq key" data-name="Ecuación del oscilador armónico">\[m\ddot x=-kx\quad\Longleftrightarrow\quad \ddot x+\omega_0^2x=0,\qquad \omega_0=\sqrt{\frac km}.\]</div>
<p>Las raíces características son \(s=\pm\ii\omega_0\), y la solución general real puede escribirse de tres formas equivalentes:</p>
<div class="eq key" data-name="Solución del MAS">\[x(t)=A\cos(\omega_0t+\varphi)=B\cos\omega_0t+C\sen\omega_0t=\Rea\!\left[\tl A\,\ee^{\ii\omega_0t}\right].\]</div>
<p>\(A\) es la <span class="term">amplitud</span>, \(\omega_0t+\varphi\) la <span class="term">fase</span> y \(\varphi\) la <span class="term">fase inicial</span>. El movimiento se repite con <span class="term">período</span> \(T=2\pi/\omega_0=2\pi\sqrt{m/k}\) y <span class="term">frecuencia</span> \(f=1/T\). El período <em>no depende de la amplitud</em>: esta propiedad, el <span class="term">isocronismo</span>, es exclusiva del potencial parabólico.</p>
<h3>Condiciones iniciales</h3>
<p>Dadas la posición \(x_0\) y la velocidad \(v_0\) en \(t=0\): \(B=x_0\), \(C=v_0/\omega_0\), y</p>
<div class="eq">\[A=\sqrt{x_0^2+\left(\frac{v_0}{\omega_0}\right)^2},\qquad \tg\varphi=-\frac{v_0}{\omega_0x_0}.\]</div>
<p>Derivando, la velocidad y la aceleración son también armónicas, adelantadas \(\pi/2\) y \(\pi\) respecto a la posición:</p>
<div class="eq">\[v=-\omega_0A\sen(\omega_0t+\varphi)=\omega_0A\cos\!\left(\omega_0t+\varphi+\tfrac\pi2\right),\qquad a=-\omega_0^2x.\]</div>
<div class="sim" data-sim="mass-spring" data-title="Masa y resorte: posición, velocidad y aceleración"></div>
<div class="sim-guide"><ul>
<li>Cuadruplique la masa: el período se duplica. Cambie la amplitud: el período no cambia.</li>
<li>Compare las tres gráficas: la velocidad es máxima donde la posición pasa por cero; la aceleración siempre tiene signo opuesto a la posición.</li>
<li>Pase al resorte vertical: la gravedad desplaza el equilibrio \(mg/k\) hacia abajo, pero el período es el mismo.</li>
</ul></div>
</section>

<section>
<h2>El círculo de referencia</h2>
<p>Un punto que recorre una circunferencia de radio \(A\) con velocidad angular constante \(\omega_0\) tiene coordenada \(x=A\cos(\omega_0t+\varphi)\). El MAS es la sombra de un movimiento circular uniforme. Este cuadro geométrico explica de inmediato por qué la velocidad máxima es \(\omega_0A\) (la rapidez del punto que gira) y la aceleración máxima \(\omega_0^2A\) (la aceleración centrípeta).</p>
<div class="sim" data-sim="shm-circle" data-title="El MAS como proyección de un movimiento circular uniforme"></div>
<div class="sim-guide"><ul>
<li>Active las flechas de velocidad y aceleración: sus proyecciones sobre el eje son exactamente \(v\) y \(a\) del oscilador.</li>
<li>Cambie la fase inicial: equivale a girar el punto de partida sobre la circunferencia.</li>
</ul></div>
</section>

<section>
<h2>Energía</h2>
<p>La energía mecánica del oscilador es la suma de la cinética y la potencial elástica:</p>
<div class="eq key" data-name="Energía del oscilador">\[E=\tfrac12m\dot x^2+\tfrac12kx^2=\tfrac12kA^2=\tfrac12m\omega_0^2A^2 .\]</div>
<p>Sustituyendo la solución, \(K=\tfrac12kA^2\sen^2(\omega_0t+\varphi)\) y \(U=\tfrac12kA^2\cos^2(\omega_0t+\varphi)\): la energía pasa de una forma a otra dos veces por período, y sus promedios temporales son iguales, \(\langle K\rangle=\langle U\rangle=E/2\). La conservación de la energía permite hallar la velocidad en cualquier posición sin conocer el tiempo:</p>
<div class="eq">\[v(x)=\pm\omega_0\sqrt{A^2-x^2}.\]</div>
<div class="sim" data-sim="shm-energy" data-title="Energía cinética y potencial en el pozo parabólico"></div>
<div class="sim-guide"><ul>
<li>Los puntos de retorno \(x=\pm A\) son donde la recta de energía total corta la parábola.</li>
<li>Observe el histograma de posiciones: el oscilador pasa más tiempo cerca de los extremos, donde se mueve despacio. Esa densidad, \(1/(\pi\sqrt{A^2-x^2})\), reaparece en mecánica cuántica como el límite clásico.</li>
</ul></div>
</section>

<section>
<h2>El espacio de fases</h2>
<p>El estado de un oscilador queda determinado por dos números: posición y velocidad (o momento \(p=m\dot x\)). En el plano \((x,p)\), la conservación de la energía obliga a la trayectoria a ser una elipse:</p>
<div class="eq">\[\frac{x^2}{2E/k}+\frac{p^2}{2mE}=1,\qquad \text{área}=\pi\sqrt{\frac{2E}{k}}\sqrt{2mE}=\frac{2\pi E}{\omega_0}=ET .\]</div>
<p>Todas las elipses se recorren en el mismo tiempo \(T\) y en sentido horario. Dos trayectorias nunca se cruzan, porque el estado actual determina el futuro de manera única. El espacio de fases será la herramienta principal para entender el amortiguamiento y el caos.</p>
<div class="sim" data-sim="phase-space" data-title="Retrato de fases del oscilador armónico"></div>
<div class="sim-guide"><ul>
<li>Haga clic en el plano para lanzar osciladores desde distintos estados: todos dan la vuelta al mismo tiempo, como un disco rígido que gira (en las variables \(x\) y \(p/m\omega_0\)).</li>
<li>Una nube de estados iniciales conserva su área al moverse (teorema de Liouville).</li>
</ul></div>
</section>

<section>
<h2>Un zoológico de osciladores</h2>
<p>Muchos sistemas físicos se reducen a la ecuación \(\ddot q+\omega_0^2q=0\) para alguna coordenada \(q\). La receta es siempre la misma: escribir la energía como \(\tfrac12\,m_{\text{ef}}\dot q^2+\tfrac12\,k_{\text{ef}}q^2\) y leer \(\omega_0=\sqrt{k_{\text{ef}}/m_{\text{ef}}}\).</p>
<div class="tablewrap"><table>
<tr><th>Sistema</th><th class="c">Coordenada</th><th class="c">\(\omega_0\)</th></tr>
<tr><td>Resortes en paralelo</td><td class="c">\(x\)</td><td class="c">\(\sqrt{(k_1+k_2)/m}\)</td></tr>
<tr><td>Resortes en serie</td><td class="c">\(x\)</td><td class="c">\(\sqrt{k_1k_2/[(k_1+k_2)m]}\)</td></tr>
<tr><td>Péndulo simple (pequeña amplitud)</td><td class="c">\(\theta\)</td><td class="c">\(\sqrt{g/\ell}\)</td></tr>
<tr><td>Líquido en un tubo en U</td><td class="c">desnivel</td><td class="c">\(\sqrt{2g/L}\)</td></tr>
<tr><td>Flotador cilíndrico</td><td class="c">hundimiento</td><td class="c">\(\sqrt{\rho_\ell gS/m}\)</td></tr>
<tr><td>Circuito LC</td><td class="c">carga \(q\)</td><td class="c">\(1/\sqrt{LC}\)</td></tr>
<tr><td>Péndulo de torsión</td><td class="c">ángulo</td><td class="c">\(\sqrt{\kappa/I}\)</td></tr>
<tr><td>Masa en el centro de un hilo tenso</td><td class="c">desplazamiento transversal</td><td class="c">\(\sqrt{4T/(mL)}\)</td></tr>
</table></div>
<div class="sim" data-sim="oscillator-zoo" data-title="Calculadora de osciladores con sus parámetros"></div>
<div class="box ex">
<h4>Masa del resorte</h4>
<p>Un resorte de masa \(m_s\) no es ideal. Suponiendo que cada elemento del resorte se desplaza proporcionalmente a su distancia al punto fijo, halle la frecuencia corregida.</p>
<details><summary>Solución</summary>
<p>Un elemento a distancia \(s\) del extremo fijo (longitud \(L\)) tiene velocidad \(\dot x\,s/L\). Su energía cinética total es \(\int_0^L\tfrac12\frac{m_s}{L}\left(\dot x\frac sL\right)^2\dd s=\tfrac12\frac{m_s}{3}\dot x^2\). La masa efectiva es \(m+m_s/3\), y \(\omega_0=\sqrt{k/(m+m_s/3)}\).</p>
</details>
</div>
<div class="box ex">
<h4>Un túnel a través de la Tierra</h4>
<p>Si se perforara un túnel recto que atravesara una Tierra homogénea, ¿cuánto tardaría un objeto en cruzarla partiendo del reposo?</p>
<details><summary>Solución</summary>
<p>Dentro de una esfera homogénea, \(g(r)=g\,r/R\). La componente a lo largo del túnel es \(-g\,x/R\), así que \(\omega_0=\sqrt{g/R}\) para cualquier túnel recto. El cruce es medio período: \(\pi\sqrt{R/g}=\pi\sqrt{6.37\times10^6/9.81}\approx2530\) s \(\approx42\) min.</p>
</details>
</div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una masa de 0.50 kg en un resorte de 200 N/m se suelta desde 4.0 cm. Halle \(\omega_0\), \(T\), la velocidad máxima y la aceleración máxima.
<details><summary>Respuesta</summary><p>\(\omega_0=20\) rad/s; \(T=0.314\) s; \(v_{\max}=0.80\) m/s; \(a_{\max}=16\) m/s².</p></details></li>
<li><span class="lvl">Básico</span>Un oscilador tiene \(x(0)=3\) cm y \(v(0)=-40\) cm/s con \(\omega_0=10\) rad/s. Halle la amplitud y la fase inicial.
<details><summary>Respuesta</summary><p>\(A=5\) cm; \(\varphi=+53.1^\circ\) (\(\tg\varphi=4/3\) con \(\cos\varphi\gt0\)).</p></details></li>
<li><span class="lvl">Intermedio</span>¿En qué posición la energía cinética es igual a la potencial? ¿Y en qué fracción del período se pasa de \(x=0\) a esa posición?
<details><summary>Respuesta</summary><p>\(x=\pm A/\sqrt2\); se tarda \(T/8\).</p></details></li>
<li><span class="lvl">Intermedio</span>Un cilindro de madera (\(\rho=600\) kg/m³, altura 20 cm) flota vertical en agua. Halle el período de sus oscilaciones verticales.
<details><summary>Respuesta</summary><p>\(\omega_0=\sqrt{\rho_\ell g/(\rho h)}=\sqrt{g/0.12\text{ m}}=9.04\) rad/s; \(T=0.69\) s.</p></details></li>
<li><span class="lvl">Intermedio</span>Una columna de mercurio de 40 cm de longitud total oscila en un tubo en U. Halle el período.
<details><summary>Respuesta</summary><p>\(T=2\pi\sqrt{L/2g}=0.90\) s.</p></details></li>
<li><span class="lvl">Avanzado</span>Una masa \(m\) está en el centro de un hilo de longitud \(L\) con tensión \(T_0\). Demuestre que las oscilaciones transversales pequeñas tienen \(\omega_0=\sqrt{4T_0/(mL)}\) y explique por qué esta aproximación falla para amplitudes comparables a \(L\).
<details><summary>Respuesta</summary><p>Cada mitad tira con componente transversal \(T_0\,y/(L/2)\); la suma es \(-4T_0y/L\). Para grandes amplitudes, el hilo se estira y la tensión aumenta: aparece un término cúbico en \(y\).</p></details></li>
</ol>
</section>
