<p class="lead">Los instrumentos de viento son columnas de aire con modos normales, como las cuerdas. La diferencia está en las condiciones de borde: un extremo abierto obliga a la presión a ser la atmosférica, uno cerrado impide el movimiento del aire. De esas condiciones dependen las notas que un tubo puede dar y, en buena medida, el carácter de su sonido.</p>

<section>
<h2>Ondas estacionarias en tubos</h2>
<p>En un tubo largo y angosto el sonido viaja como onda plana. Las condiciones en los extremos son:</p>
<ul>
<li><strong>Extremo cerrado:</strong> el aire no puede moverse; nodo de desplazamiento y vientre de presión.</li>
<li><strong>Extremo abierto:</strong> la presión es (casi) la atmosférica; nodo de presión y vientre de desplazamiento.</li>
</ul>
<p>Como en la cuerda, los modos quedan determinados por cuántas fracciones de longitud de onda caben:</p>
<div class="eq key" data-name="Modos de tubos">\[\text{abierto–abierto: }f_n=\frac{nv}{2L},\quad n=1,2,3,\dots\qquad\text{cerrado–abierto: }f_n=\frac{(2n-1)v}{4L},\quad n=1,2,3,\dots\]</div>
<p>Un tubo cerrado en un extremo suena una octava más grave que uno abierto de igual longitud y sólo tiene armónicos impares. La flauta se comporta como un tubo abierto; el clarinete, como uno cerrado (la boquilla con la caña actúa como extremo cerrado), por eso su registro grave tiene un timbre hueco, pobre en armónicos pares, y al «sobresoplar» salta una duodécima (al tercer armónico) en lugar de una octava.</p>
<p>La onda no se refleja exactamente en el borde de un extremo abierto: la presión se iguala un poco afuera. La <span class="term">corrección de extremo</span> es \(\Delta L\approx0.6a\) para un tubo de radio \(a\) sin pestaña, y la longitud efectiva es \(L+0.6a\) por cada extremo abierto.</p>
<div class="sim" data-sim="pipe-modes" data-title="Modos de una columna de aire: desplazamiento y presión"></div>
<div class="sim-guide"><ul>
<li>Compare las gráficas: donde el desplazamiento tiene un vientre, la presión tiene un nodo, y viceversa.</li>
<li>Cierre un extremo: el modo fundamental pasa a ser un cuarto de onda y su frecuencia baja a la mitad.</li>
</ul></div>
</section>

<section>
<h2>El tubo de resonancia</h2>
<p>Un experimento clásico para medir la velocidad del sonido: un diapasón vibra sobre un tubo vertical parcialmente lleno de agua. Al bajar el nivel del agua, la columna de aire (cerrada abajo, abierta arriba) entra en resonancia cuando su longitud es \(\lambda/4\), \(3\lambda/4\), \(5\lambda/4\)… La distancia entre dos resonancias consecutivas es \(\lambda/2\), independiente de la corrección de extremo: \(v=2f\,\Delta L\).</p>

</section>

<section>
<h2>El resonador de Helmholtz</h2>
<p>Al soplar sobre el cuello de una botella se oye una nota mucho más grave de lo que correspondería a un tubo de su tamaño. El aire del cuello (sección \(S\), longitud efectiva \(L'\)) se mueve como un pistón de masa \(\rho SL'\), y el aire del interior (volumen \(V\)) actúa como un resorte: al comprimirlo adiabáticamente, su presión cambia en \(\Delta p=-\rho v^2\,\Delta V/V\). La frecuencia del oscilador resultante es</p>
<div class="eq key" data-name="Resonador de Helmholtz">\[f_H=\frac{v}{2\pi}\sqrt{\frac{S}{V\,L'}} .\]</div>
<p>Es un oscilador de un solo grado de libertad: las dimensiones son pequeñas frente a la longitud de onda. Explica el sonido de las botellas, la resonancia del cuerpo de una guitarra (unos 100 Hz, por la boca) y el «retumbe» de un automóvil con una ventana abierta. Se usan resonadores de Helmholtz para absorber ruido de baja frecuencia en salas y en tubos de escape.</p>

<section>
<h2>Timbre</h2>
<p>Dos instrumentos que tocan la misma nota con la misma intensidad suenan distinto porque sus espectros son distintos: el <span class="term">timbre</span> depende de la proporción entre los armónicos y de cómo evolucionan en el tiempo (el ataque y la extinción de la nota). Algunos rasgos característicos:</p>
<ul>
<li><strong>Flauta:</strong> casi sinusoidal, con pocos armónicos débiles.</li>
<li><strong>Clarinete (registro grave):</strong> predominan los armónicos impares.</li>
<li><strong>Violín y voz:</strong> el arco o las cuerdas vocales producen una onda en diente de sierra (todos los armónicos, decayendo como \(1/n\)); la caja del instrumento o el tracto vocal refuerzan ciertas bandas de frecuencia, los <span class="term">formantes</span>. En la voz, los formantes distinguen las vocales.</li>
<li><strong>Campanas y platillos:</strong> sus modos no son armónicos (no son múltiplos de una fundamental), y la altura percibida es ambigua.</li>
</ul>
<div class="sim" data-sim="timbre" data-title="Timbre: espectros de instrumentos y vocales"></div>
<div class="sim-guide"><ul>
<li>Escuche la «a» y la «i» con la misma fundamental: sólo cambian los formantes.</li>
<li>Quite la fundamental de un sonido con muchos armónicos: el oído sigue percibiendo la misma altura (la «fundamental ausente»). Por eso se oye el bajo en un teléfono que no transmite frecuencias menores que 300 Hz.</li>
</ul></div>
</section>

<section>
<h2>Consonancia y escalas</h2>
<p>Dos notas suenan consonantes cuando sus armónicos coinciden. Si las frecuencias están en razón \(p/q\) con enteros pequeños, muchos armónicos coinciden exactamente, y los que no coinciden están lejos entre sí; si la razón es complicada, hay pares de armónicos muy próximos que producen batimientos ásperos.</p>
<div class="tablewrap narrow"><table>
<tr><th>Intervalo</th><th class="c">Razón justa</th><th class="c">Temperado \(2^{n/12}\)</th><th class="c">Diferencia (cents)</th></tr>
<tr><td>Octava</td><td class="c">2/1</td><td class="c">2.0000</td><td class="c">0</td></tr>
<tr><td>Quinta</td><td class="c">3/2 = 1.5000</td><td class="c">1.4983</td><td class="c">−2.0</td></tr>
<tr><td>Cuarta</td><td class="c">4/3 = 1.3333</td><td class="c">1.3348</td><td class="c">+2.0</td></tr>
<tr><td>Tercera mayor</td><td class="c">5/4 = 1.2500</td><td class="c">1.2599</td><td class="c">+13.7</td></tr>
<tr><td>Tercera menor</td><td class="c">6/5 = 1.2000</td><td class="c">1.1892</td><td class="c">−15.6</td></tr>
</table></div>
<p>Una escala construida sólo con intervalos justos no permite cambiar de tonalidad: doce quintas justas no completan exactamente siete octavas (\((3/2)^{12}/2^7=1.0136\), la <em>coma pitagórica</em>). El <span class="term">temperamento igual</span>, generalizado desde el siglo XVIII, divide la octava en doce semitonos iguales de razón \(2^{1/12}\), y reparte el error entre todos los intervalos. El <span class="term">cent</span> es la centésima parte de un semitono temperado: un intervalo de razón \(r\) mide \(1200\log_2r\) cents.</p>
<div class="sim" data-sim="intervals" data-title="Intervalos: armónicos que coinciden y batimientos"></div>
<div class="sim-guide"><ul>
<li>Con la quinta justa (3/2) los armónicos 3 de la nota grave y 2 de la aguda coinciden. Con la temperada, quedan separados unos 0.7 Hz a 220 Hz: un batimiento lento.</li>
<li>Escuche la tercera mayor justa y la temperada: la diferencia de 14 cents es audible como un leve batimiento.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un tubo de órgano abierto mide 2.0 m. Halle sus tres primeras frecuencias a 20 °C. ¿Y si está cerrado en un extremo?
<details><summary>Respuesta</summary><p>Abierto: 85.8, 172 y 257 Hz. Cerrado: 42.9, 129 y 214 Hz.</p></details></li>
<li><span class="lvl">Básico</span>Con un diapasón de 512 Hz, se hallan resonancias con columnas de aire de 15.9 cm y 49.3 cm. Halle la velocidad del sonido y la corrección de extremo.
<details><summary>Respuesta</summary><p>\(\lambda/2=33.4\) cm, \(v=342\) m/s; \(\lambda/4=16.7\) cm, corrección 0.8 cm.</p></details></li>
<li><span class="lvl">Intermedio</span>Una botella de 750 mL tiene un cuello de 2.0 cm de diámetro y 8.0 cm de largo. Estime la frecuencia de Helmholtz (corrección del cuello: \(L'=L+1.5a\)).
<details><summary>Respuesta</summary><p>\(S=3.14\) cm², \(L'=9.5\) cm: \(f=\dfrac{343}{2\pi}\sqrt{\dfrac{3.14\times10^{-4}}{7.5\times10^{-4}\cdot0.095}}=114\) Hz.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Cuántos cents mide una quinta justa? ¿Y la coma pitagórica?
<details><summary>Respuesta</summary><p>\(1200\log_2(1.5)=702.0\) cents; coma: \(1200\log_2(1.0136)=23.5\) cents.</p></details></li>
<li><span class="lvl">Avanzado</span>Un tubo abierto de 60 cm toca su fundamental a 20 °C. Si la temperatura del aire sube a 30 °C durante el concierto, ¿cuántos cents sube la nota? ¿Qué pasa con las cuerdas?
<details><summary>Respuesta</summary><p>\(f\propto v\propto\sqrt T\): \(1200\log_2\sqrt{303/293}=29\) cents (más de un cuarto de semitono). Las cuerdas tienden a bajar, al dilatarse y perder tensión: los instrumentos se desafinan en sentidos opuestos.</p></details></li>
</ol>
</section>
