<template class="chapter-src" data-id="acoplados" data-num="9" data-title="Osciladores acoplados y modos normales" data-part="Parte III · Sistemas con varios grados de libertad" data-short="Dos masas acopladas, modos normales, transferencia de energía, método matricial, absorbedor dinámico y moléculas">
<p class="lead">Cuando dos osciladores se influyen mutuamente, el movimiento de cada uno deja de ser armónico: la energía va y viene entre ellos. Sin embargo, existen movimientos especiales, los modos normales, en los que todo el sistema oscila con una sola frecuencia. Encontrarlos convierte un problema acoplado en varios osciladores independientes, y es la idea que lleva directamente a las ondas.</p>

<section>
<h2>Dos masas y tres resortes</h2>
<p>Dos masas iguales \(m\) están unidas a paredes por resortes de constante \(k\), y entre sí por un resorte de acoplamiento \(\kappa\). Con \(x_1\), \(x_2\) los desplazamientos desde el equilibrio:</p>
<div class="eq">\[m\ddot x_1=-kx_1-\kappa(x_1-x_2),\qquad m\ddot x_2=-kx_2-\kappa(x_2-x_1).\]</div>
<p>Las ecuaciones están acopladas, pero se separan con las combinaciones \(q_1=x_1+x_2\) y \(q_2=x_1-x_2\). Sumándolas y restándolas:</p>
<div class="eq key" data-name="Modos normales de dos osciladores iguales">\[\ddot q_1+\omega_1^2q_1=0,\quad \omega_1=\sqrt{\frac km};\qquad \ddot q_2+\omega_2^2q_2=0,\quad \omega_2=\sqrt{\frac{k+2\kappa}{m}}.\]</div>
<p>Las \(q_i\) son las <span class="term">coordenadas normales</span>. En el <span class="term">modo</span> 1 las masas se mueven juntas (\(x_1=x_2\)) y el resorte central no se deforma; en el modo 2 se mueven en oposición (\(x_1=-x_2\)) y el resorte central trabaja doble, por eso su frecuencia es mayor. El movimiento más general es una superposición:</p>
<div class="eq">\[x_1=\tfrac12\left[A_1\cos(\omega_1t+\varphi_1)+A_2\cos(\omega_2t+\varphi_2)\right],\qquad x_2=\tfrac12\left[A_1\cos(\omega_1t+\varphi_1)-A_2\cos(\omega_2t+\varphi_2)\right].\]</div>
<div class="sim" data-sim="two-masses" data-title="Dos masas acopladas: modos normales y superposición"></div>
<div class="sim-guide"><ul>
<li>Elija el modo 1 o el modo 2: cada masa oscila armónicamente y el movimiento se repite indefinidamente.</li>
<li>Desplace sólo la masa 1: el movimiento parece complicado, pero las coordenadas normales (gráfica inferior) siguen siendo sinusoides puras.</li>
</ul></div>
</section>

<section>
<h2>Acoplamiento débil: transferencia de energía</h2>
<p>Si se desplaza sólo la primera masa (\(x_1=A\), \(x_2=0\), en reposo), se excitan ambos modos con igual amplitud. Usando la identidad de suma de cosenos:</p>
<div class="eq key" data-name="Batimientos entre modos">\[x_1=A\cos\!\left(\frac{\omega_2-\omega_1}{2}t\right)\cos\!\left(\frac{\omega_1+\omega_2}{2}t\right),\qquad x_2=A\sen\!\left(\frac{\omega_2-\omega_1}{2}t\right)\sen\!\left(\frac{\omega_1+\omega_2}{2}t\right).\]</div>
<p>Con acoplamiento débil (\(\kappa\ll k\)) las dos frecuencias son próximas y se obtienen <em>batimientos</em>: la energía pasa completamente de una masa a la otra y regresa. El tiempo de transferencia es</p>
<div class="eq">\[T_{\text{transf}}=\frac{\pi}{\omega_2-\omega_1}\approx\frac{\pi}{\omega_1}\,\frac{k}{\kappa}\qquad(\kappa\ll k).\]</div>
<p>Cuanto más débil el acoplamiento, más lenta la transferencia, pero siempre es total si los osciladores son idénticos. Si están desafinados, la transferencia es parcial: así funcionan los acopladores direccionales de fibra óptica y la transferencia de energía entre moléculas.</p>
<div class="sim" data-sim="coupled-pendulums" data-title="Péndulos acoplados por un resorte: la energía va y viene"></div>
<div class="sim-guide"><ul>
<li>Con acoplamiento débil, cuente cuántas oscilaciones tarda la energía en pasar al otro péndulo; compárelo con \(\omega_1/(\omega_2-\omega_1)\cdot\tfrac12\).</li>
<li>Haga un péndulo más largo que el otro: la transferencia deja de ser completa.</li>
</ul></div>
</section>

<section>
<h2>El método general: autovalores</h2>
<p>Para \(n\) grados de libertad con energías \(T=\tfrac12\dot{\vb{x}}^{\mathsf T}\mathsf M\dot{\vb{x}}\) y \(U=\tfrac12\vb{x}^{\mathsf T}\mathsf K\vb{x}\), las ecuaciones de movimiento son \(\mathsf M\ddot{\vb{x}}=-\mathsf K\vb{x}\). Probando \(\vb{x}=\vb{a}\cos(\omega t+\varphi)\):</p>
<div class="eq key" data-name="Problema de autovalores">\[\left(\mathsf K-\omega^2\mathsf M\right)\vb{a}=\vb 0\quad\Longrightarrow\quad\det\left(\mathsf K-\omega^2\mathsf M\right)=0 .\]</div>
<p>La ecuación secular da \(n\) frecuencias normales \(\omega_j\), y para cada una el vector \(\vb a_j\) da la forma del modo (las amplitudes relativas). Como \(\mathsf M\) y \(\mathsf K\) son simétricas y definidas positivas, todas las \(\omega_j^2\) son reales y positivas, y los modos son ortogonales en el sentido \(\vb a_i^{\mathsf T}\mathsf M\vb a_j=0\) si \(i\neq j\).</p>
<div class="box ex">
<h4>Masas distintas</h4>
<p>Dos masas \(m\) y \(2m\) entre paredes, con tres resortes iguales \(k\). Halle las frecuencias y los modos.</p>
<details><summary>Solución</summary>
<p>\(\mathsf K=k\begin{pmatrix}2&-1\\-1&2\end{pmatrix}\), \(\mathsf M=m\begin{pmatrix}1&0\\0&2\end{pmatrix}\). Con \(\lambda=m\omega^2/k\): \((2-\lambda)(2-2\lambda)-1=0\Rightarrow2\lambda^2-6\lambda+3=0\), \(\lambda=(3\mp\sqrt3)/2=0.634,\ 2.366\). Modos: \(a_2/a_1=2-\lambda=1.366\) (en fase) y \(-0.366\) (en oposición, con la masa grande casi quieta).</p>
</details>
</div>
<div class="sim" data-sim="normal-modes" data-title="Calculadora de modos normales para dos masas"></div>
</section>

<section>
<h2>Sistemas acoplados forzados y absorbedor dinámico</h2>
<p>Si se aplica una fuerza \(F_0\cos\omega t\) a la masa 1, la respuesta estacionaria tiene <em>dos</em> picos de resonancia, en \(\omega_1\) y \(\omega_2\): un sistema con \(n\) grados de libertad tiene \(n\) resonancias. Entre ellas aparece algo nuevo, una <span class="term">antirresonancia</span>, una frecuencia en la que la masa forzada queda quieta.</p>
<p>Este efecto se aprovecha en el <span class="term">absorbedor dinámico de vibraciones</span> (Frahm, 1909): a una máquina \(M\) que vibra con una frecuencia molesta \(\omega\) se le cuelga un oscilador pequeño \(m_a\), \(k_a\) sintonizado a esa frecuencia, \(\sqrt{k_a/m_a}=\omega\). La masa auxiliar oscila de modo que su resorte ejerce sobre la máquina una fuerza igual y opuesta a la excitación, y la máquina se detiene. Los rascacielos como el Taipei 101 usan versiones gigantes de este dispositivo (un péndulo de 660 toneladas) para reducir las oscilaciones por viento.</p>
<div class="sim" data-sim="vibration-absorber" data-title="Absorbedor dinámico de vibraciones"></div>
<div class="sim-guide"><ul>
<li>Sin absorbedor hay una sola resonancia. Al agregarlo aparecen dos, separadas, y entre ellas la máquina queda quieta justo en la frecuencia de sintonía.</li>
<li>Agregue amortiguamiento al absorbedor: los picos bajan, a cambio de que la antirresonancia deje de ser perfecta. Así se diseñan absorbedores que funcionan en una banda de frecuencias.</li>
</ul></div>
</section>

<section>
<h2>Vibraciones de moléculas</h2>
<p>Una molécula lineal simétrica como el CO<sub>2</sub> (O=C=O) se modela con tres masas \(m_O\), \(m_C\), \(m_O\) unidas por dos resortes \(k\). Para el movimiento a lo largo del eje hay tres soluciones de \(\det(\mathsf K-\omega^2\mathsf M)=0\):</p>
<ul>
<li>\(\omega=0\): traslación de toda la molécula (no es una vibración).</li>
<li>\(\omega_s=\sqrt{k/m_O}\): estiramiento simétrico; el carbono queda quieto.</li>
<li>\(\omega_a=\sqrt{\dfrac km_O\left(1+\dfrac{2m_O}{m_C}\right)}\): estiramiento asimétrico; el carbono se mueve contra los oxígenos.</li>
</ul>
<p>La razón predicha \(\omega_a/\omega_s=\sqrt{1+2\cdot16/12}=1.915\) se compara bien con las medidas, 2349 cm⁻¹ y 1388 cm⁻¹ (razón 1.69): la diferencia revela que el modelo de resortes independientes es demasiado simple. El modo asimétrico hace oscilar el momento dipolar de la molécula y absorbe radiación infrarroja: es una de las razones por las que el CO<sub>2</sub> es un gas de efecto invernadero. El modo simétrico no absorbe.</p>
<div class="sim" data-sim="triatomic" data-title="Modos de vibración de una molécula lineal triatómica"></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Dos masas de 0.5 kg con \(k=50\) N/m y \(\kappa=5\) N/m. Halle las frecuencias normales y el tiempo de transferencia de energía.
<details><summary>Respuesta</summary><p>\(\omega_1=10\) rad/s; \(\omega_2=\sqrt{60/0.5}=10.95\) rad/s; \(T=\pi/0.954=3.29\) s.</p></details></li>
<li><span class="lvl">Básico</span>Dos péndulos de 1 m acoplados débilmente intercambian su energía cada 30 s. ¿Cuál es la diferencia de frecuencias de los modos?
<details><summary>Respuesta</summary><p>\(\omega_2-\omega_1=\pi/30=0.105\) rad/s (\(\Delta f=0.0167\) Hz).</p></details></li>
<li><span class="lvl">Intermedio</span>Para dos masas iguales con \(k\) y \(\kappa\), si en \(t=0\) \(x_1=0\), \(x_2=0\), \(\dot x_1=v_0\), \(\dot x_2=0\), escriba \(x_1(t)\) y \(x_2(t)\).
<details><summary>Respuesta</summary><p>\(x_{1,2}=\dfrac{v_0}2\left[\dfrac{\sen\omega_1t}{\omega_1}\pm\dfrac{\sen\omega_2t}{\omega_2}\right]\).</p></details></li>
<li><span class="lvl">Intermedio</span>Una máquina de 200 kg vibra excesivamente a 1500 rpm. Diseñe un absorbedor de 10 kg: ¿qué constante de resorte necesita?
<details><summary>Respuesta</summary><p>\(\omega=157\) rad/s; \(k_a=m_a\omega^2=2.47\times10^5\) N/m.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre las frecuencias del CO<sub>2</sub> planteando \(\mathsf K\) y \(\mathsf M\) para tres masas \(m,M,m\) y dos resortes \(k\).
<details><summary>Respuesta</summary><p>\(\det\begin{pmatrix}k-m\omega^2&-k&0\\-k&2k-M\omega^2&-k\\0&-k&k-m\omega^2\end{pmatrix}=0\) da \(\omega^2(k-m\omega^2)\left[k(2m+M)-mM\omega^2\right]=0\).</p></details></li>
</ol>
</section>
