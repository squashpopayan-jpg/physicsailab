<template class="chapter-src" data-id="doppler" data-num="19" data-title="Efecto Doppler y ondas de choque" data-part="Parte V · Sonido" data-short="Fuente y observador en movimiento, paso de una sirena, ecos Doppler, efecto Doppler de la luz, cono de Mach y estampido sónico">
<p class="lead">La sirena de una ambulancia suena más aguda cuando se acerca y más grave cuando se aleja. Christian Doppler explicó en 1842 que la frecuencia percibida depende del movimiento de la fuente y del observador respecto al medio. El mismo efecto permite medir la velocidad de la sangre con ultrasonido, la de los automóviles con radar y la expansión del universo con la luz de las galaxias.</p>

<section>
<h2>Fuente y observador en movimiento</h2>
<h3>Fuente en movimiento</h3>
<p>Una fuente que emite con frecuencia \(f\) se mueve con velocidad \(v_s\) hacia un observador en reposo. Cada frente de onda se emite desde un punto más adelantado que el anterior: delante de la fuente, los frentes quedan separados \(\lambda'=(v-v_s)/f\) en lugar de \(v/f\). Como las ondas siguen viajando con la velocidad \(v\) del medio, el observador recibe</p>
<div class="eq key" data-name="Doppler: fuente en movimiento">\[f'=\frac{v}{\lambda'}=f\,\frac{v}{v-v_s}\quad(\text{acercándose}),\qquad f'=f\,\frac{v}{v+v_s}\quad(\text{alejándose}).\]</div>
<h3>Observador en movimiento</h3>
<p>Si es el observador quien se mueve con \(v_o\) hacia una fuente en reposo, la longitud de onda no cambia, pero el observador encuentra las crestas con mayor frecuencia, porque se acerca a ellas con velocidad relativa \(v+v_o\):</p>
<div class="eq key" data-name="Doppler: observador en movimiento">\[f'=f\,\frac{v+v_o}{v}\quad(\text{acercándose}).\]</div>
<p>Ambos casos se resumen, para movimientos a lo largo de la línea que une fuente y observador, en</p>
<div class="eq key" data-name="Fórmula general del efecto Doppler">\[f'=f\,\frac{v+v_o}{v-v_s},\]</div>
<p>con \(v_o\) y \(v_s\) positivas cuando cada uno se mueve hacia el otro. Las dos situaciones no son simétricas: para el sonido importa quién se mueve respecto al aire. Si los movimientos no son colineales, sólo cuentan las componentes de las velocidades a lo largo de la línea de visión.</p>
<div class="sim" data-sim="doppler-fronts" data-title="Frentes de onda de una fuente y un observador en movimiento"></div>
<div class="sim-guide"><ul>
<li>Con la fuente a \(v_s=0.5v\) la frecuencia delante se duplica, pero un observador que se acerca a \(0.5v\) a una fuente quieta sólo la multiplica por 1.5.</li>
<li>Lleve la fuente a \(v_s=v\): todos los frentes delanteros se apilan en un mismo punto. Es la «barrera del sonido».</li>
</ul></div>
</section>

<section>
<h2>El paso de una fuente</h2>
<p>Cuando una fuente pasa a una distancia \(d\) de un observador, el ángulo \(\theta\) entre su velocidad y la línea de visión cambia continuamente, y la frecuencia percibida baja de manera gradual, no abrupta:</p>
<div class="eq">\[f'(t)=\frac{f}{1-\dfrac{v_s}{v}\cos\theta(t_e)},\]</div>
<p>donde \(\theta\) se evalúa en el instante de emisión \(t_e\) (el sonido tarda en llegar). Cuanto más cerca pasa la fuente, más brusco es el cambio. La razón entre la frecuencia de acercamiento y la de alejamiento, \((v+v_s)/(v-v_s)\), permite estimar la velocidad del vehículo: para 2 semitonos (razón 1.122), \(v_s\approx0.058v\approx70\) km/h.</p>
<div class="sim" data-sim="doppler-passby" data-title="Una sirena que pasa: frecuencia percibida y sonido"></div>
<div class="sim-guide"><ul>
<li>Escuche el paso a 100 km/h y a distancias de 3 m y 50 m: el descenso de tono es el mismo en total, pero más brusco si la fuente pasa cerca.</li>
<li>El volumen también cambia: la intensidad decae como \(1/r^2\).</li>
</ul></div>
</section>

<section>
<h2>Ecos Doppler: radar y ultrasonido</h2>
<p>Si una onda se refleja en un objeto que se acerca con velocidad \(u\), el objeto actúa primero como observador en movimiento y luego como fuente en movimiento. Para \(u\ll v\):</p>
<div class="eq key" data-name="Desplazamiento Doppler de un eco">\[\Delta f=f'-f\approx\frac{2u\cos\theta}{v}\,f .\]</div>
<p>Un ecógrafo Doppler emite a unos 5 MHz; la sangre que se mueve a 50 cm/s produce un desplazamiento de unos 3 kHz, audible, que se escucha y se representa en colores. Un radar de tránsito a 24 GHz detecta un automóvil a 100 km/h por un desplazamiento de 4.4 kHz.</p>
<div class="sim" data-sim="doppler-echo" data-title="Eco Doppler: medir velocidades con ondas"></div>
</section>

<section>
<h2>El efecto Doppler de la luz</h2>
<p>La luz no necesita un medio, y sólo importa la velocidad relativa \(u\) entre fuente y observador. La relatividad especial da</p>
<div class="eq">\[f'=f\sqrt{\frac{1+u/c}{1-u/c}}\quad(\text{acercamiento}),\qquad \frac{\Delta\lambda}{\lambda}\approx\frac uc\quad(u\ll c).\]</div>
<p>Las líneas espectrales de las galaxias lejanas aparecen desplazadas hacia el rojo en proporción a su distancia: es la ley de Hubble, evidencia de la expansión del universo. El mismo principio, aplicado a la luz de las estrellas, ha revelado miles de planetas extrasolares por el pequeño vaivén que producen en su estrella (unos m/s).</p>
</section>

<section>
<h2>Ondas de choque</h2>
<p>Si la fuente va más rápido que las ondas (\(v_s\gt v\)), los frentes de onda quedan detrás de ella y se superponen sobre la superficie de un cono, el <span class="term">cono de Mach</span>, cuyo semiángulo cumple</p>
<div class="eq key" data-name="Cono de Mach">\[\sen\alpha=\frac{v}{v_s}=\frac1{\mathrm{Ma}},\qquad \mathrm{Ma}=\frac{v_s}{v}\ \ (\text{número de Mach}).\]</div>
<p>Sobre el cono, la energía de muchos frentes llega a la vez: es una <span class="term">onda de choque</span>, un salto brusco de presión. Un avión supersónico arrastra su cono a lo largo de todo su recorrido, y cada observador en tierra oye el <em>estampido sónico</em> cuando el cono pasa sobre él (no sólo cuando el avión «rompe la barrera»). La estela en V de un barco, el chasquido de un látigo (cuya punta supera la velocidad del sonido) y la radiación de Cherenkov (la luz azul de los reactores nucleares, emitida por electrones más rápidos que la luz en el agua) son ondas de choque.</p>
<div class="sim" data-sim="mach-cone" data-title="Cono de Mach y estampido sónico"></div>
<div class="sim-guide"><ul>
<li>Con \(\mathrm{Ma}=2\) el semiángulo es \(30^\circ\). Observe cuánto después del paso del avión llega el estampido al observador en tierra.</li>
<li>La estela de un barco en aguas profundas forma siempre un ángulo de unos \(19.5^\circ\), sin importar su velocidad (ángulo de Kelvin): se debe a la dispersión de las olas, que hace que la energía viaje a la velocidad de grupo.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una ambulancia con sirena de 700 Hz se acerca a 25 m/s. ¿Qué frecuencia oye un peatón? ¿Y cuando se aleja?
<details><summary>Respuesta</summary><p>755 Hz y 652 Hz (con \(v=343\) m/s).</p></details></li>
<li><span class="lvl">Básico</span>Un ciclista viaja a 10 m/s hacia una sirena de fábrica de 500 Hz. ¿Qué frecuencia oye?
<details><summary>Respuesta</summary><p>\(500\cdot353/343=515\) Hz.</p></details></li>
<li><span class="lvl">Intermedio</span>El tono de un automóvil que pasa baja de 480 Hz a 400 Hz. ¿Con qué velocidad viaja?
<details><summary>Respuesta</summary><p>\((v+v_s)/(v-v_s)=1.2\Rightarrow v_s=v\cdot0.2/2.2=31\) m/s (112 km/h).</p></details></li>
<li><span class="lvl">Intermedio</span>Un ecógrafo de 4 MHz mide un desplazamiento de 2.6 kHz en la sangre de una arteria, con un ángulo de \(60^\circ\) entre el haz y el flujo. Halle la velocidad de la sangre (\(v=1540\) m/s).
<details><summary>Respuesta</summary><p>\(u=\dfrac{v\,\Delta f}{2f\cos\theta}=1.0\) m/s.</p></details></li>
<li><span class="lvl">Avanzado</span>Un avión vuela a Mach 1.8 a 9000 m de altura. ¿Cuánto tiempo después de pasar sobre un observador oye éste el estampido? (Suponga \(v=300\) m/s constante.)
<details><summary>Respuesta</summary><p>\(\sen\alpha=1/1.8\), \(\alpha=33.7^\circ\). El cono alcanza al observador cuando el avión ha avanzado \(h/\tg\alpha=13.5\) km: \(t=13.5\ \text{km}/(540\ \text{m/s})=25\) s.</p></details></li>
</ol>
</section>
