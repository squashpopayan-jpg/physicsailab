    <h1 class="home-title"><em>Máquinas que leen</em><span>procesamiento del lenguaje natural, de las palabras a los modelos de lenguaje</span></h1>
    <p class="home-lead">Un buscador completa su frase, un traductor la pasa al inglés, un asistente le responde con otra frase. Detrás hay una pregunta antigua: ¿qué hay que saber para entender un texto? Este curso la recorre en el orden en que la ciencia la fue resolviendo. Empieza por las palabras y su forma, sigue con las categorías gramaticales, la estructura de las oraciones y el significado, y llega a los vectores, las redes neuronales y los grandes modelos de lenguaje. Cada algoritmo se puede ejecutar en la página, se validó contra una implementación independiente y viene con su programa en Python. Cada capítulo cierra con una prueba, y un banco de preguntas con repaso espaciado le dice qué le falta.</p>
    <div class="maxwell-strip" aria-label="Cuatro ecuaciones que recorren el curso">
      <div><small>Etiquetado (modelo oculto de Markov)</small>\[\hat t_{1:n}=\argmax_{t_{1:n}}\prod_i P(w_i\mid t_i)\,P(t_i\mid t_{i-1})\]</div>
      <div><small>Distancia de edición</small>\[D_{i,j}=\min\{D_{i-1,j}+1,\;D_{i,j-1}+1,\;D_{i-1,j-1}+\ind{a_i\ne b_j}\}\]</div>
      <div><small>Importancia de un término</small>\[\tf\idf(t,d)=\tf(t,d)\,\log\frac{N}{\mathrm{df}(t)}\]</div>
      <div><small>Atención (Transformer)</small>\[\softmax\!\Big(\frac{QK^{\T}}{\sqrt{d_k}}\Big)V\]</div>
    </div>

    <p class="home-note"><b>Cómo leer la animación.</b> Una oración atraviesa las capas de un sistema clásico de PLN. Primero se separa en <i>tokens</i>; después cada token recibe su categoría gramatical (sustantivo, verbo, determinante…); por último se dibujan las relaciones de dependencia entre palabras (el verbo gobierna a su sujeto y a su complemento). Los capítulos 3 a 17 explican cómo se construye cada capa; los capítulos 24 a 33 muestran cómo los modelos actuales aprenden varias de ellas a la vez.</p>

<div class="home-howto">
  <div><b>Teoría con fuentes</b><p>Cada capítulo explica el porqué de cada técnica con ejemplos en español, ecuaciones y casos resueltos. El material base es la asignatura de la especialización (diez temas), el libro de Zong, Zhao y Ma sobre PLN y modelos de lenguaje, y los seis laboratorios de Colab. Al final de cada capítulo hay lecturas para ampliar con enlaces a las fuentes originales.</p></div>
  <div><b>Algoritmos que se ejecutan</b><p>Distancia de edición, autómatas, Viterbi, analizadores sintácticos, WordNet y Lesk, TF-IDF, modelos de n-gramas, Word2Vec, atención y BPE corren en su navegador. Cada uno se comparó con NLTK, scikit-learn, SciPy o Gensim (apéndice de validación), y los programas en Python del curso muestran su salida real.</p></div>
  <div><b>Pruebas para aprender</b><p>Toda respuesta, correcta o no, se explica. Las preguntas que falla vuelven más pronto y las que domina, más tarde (repaso espaciado de Leitner). El <a href="#pruebas">Centro de pruebas</a> arma exámenes por capítulo, por parte, de todo el curso o solo con sus errores, y le dice qué capítulos repasar.</p></div>
  <div><b>Qué es y qué no es</b><p>Es un curso para entender cómo funciona el lenguaje en la máquina y para poder implementarlo. Los modelos de lenguaje grandes cambian rápido: se explican sus principios (que no cambian) y se indican las fuentes para seguir su evolución. Los ejemplos de código usan corpus pequeños y didácticos; sus cifras no se deben extrapolar a datos reales.</p></div>
