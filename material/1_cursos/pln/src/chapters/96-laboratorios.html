<h2>Cómo sacar partido</h2>
<ol>
<li>Lea el capítulo y use las simulaciones para ver el algoritmo funcionar con datos pequeños.</li>
<li>Ejecute el programa de Python del capítulo (<code>py/NN-nombre.py</code>) y compare su salida con la «Cómo leer el resultado» del capítulo.</li>
<li>Cambie un parámetro (tamaño del vocabulario, suavizado, número de épocas) y anticipe qué ocurrirá antes de ejecutar.</li>
<li>Haga la autoevaluación y repase con el Centro de pruebas (apéndice A).</li>
</ol>
<h2>Propuestas de trabajo</h2>
<ul>
<li><b>Mini-proyecto de clasificación</b>: reúna 300 opiniones o titulares reales, etiquételos, entrene Bayes ingenuo y regresión logística y compare con la validación cruzada (cap. 27). Analice los errores.</li>
<li><b>Buscador de preguntas frecuentes</b>: indexe 50 preguntas con TF-IDF y con embeddings, y mida el acierto en 30 consultas parafraseadas (caps. 24, 26, 32).</li>
<li><b>Etiquetador de entidades de un dominio</b>: anote 200 oraciones de su ámbito y entrene el perceptrón del cap. 33; mida el F1 por tipo.</li>
<li><b>Chatbot de su facultad</b>: diseñe 5 intenciones, recoja 20 frases por intención, entrene el clasificador con umbral y pruebe con 10 personas (cap. 37).</li>
<li><b>Informe de sesgos</b>: pruebe un clasificador con frases que cambian solo un nombre o un género y documente las diferencias (caps. 26–27, 34).</li>
</ul>
