<p class="lead">Una hoja de consulta con lo que conviene recordar. Cada fórmula indica el capítulo donde se deduce o se usa; si alguna no le resulta familiar, vaya allí.</p>

<section>
<h2>Palabras y texto (caps. 3–8)</h2>
<ul>
<li><b>Ley de Zipf</b> (3): \(f(r)\approx C/r^{\alpha}\), con \(\alpha\approx1\). En escala log–log, una recta de pendiente \(-\alpha\).</li>
<li><b>Distancia de edición de Levenshtein</b> (8): \(D(i,j)=\min\{D(i-1,j)+1,\ D(i,j-1)+1,\ D(i-1,j-1)+[a_i\neq b_j]\}\).</li>
<li><b>Entropía</b> (2): \(H=-\sum_x p(x)\log_2p(x)\). Perplejidad \(=2^{H}\).</li>
</ul>
<h2>Etiquetado (caps. 9–12)</h2>
<ul>
<li><b>HMM</b> (11): \(P(t,w)=\prod_iP(t_i\mid t_{i-1})P(w_i\mid t_i)\). Viterbi: \(\delta_t(j)=\max_i\delta_{t-1}(i)\,a_{ij}\,b_j(w_t)\).</li>
<li><b>Exactitud, precisión, cobertura, F1</b> (27): \(P=\tfrac{TP}{TP+FP}\), \(R=\tfrac{TP}{TP+FN}\), \(F_1=\tfrac{2PR}{P+R}\).</li>
</ul>
<h2>Sintaxis (caps. 13–17)</h2>
<ul>
<li><b>Árboles de análisis posibles</b> (1, 14): números de Catalan, \(C_n=\tfrac{1}{n+1}\binom{2n}{n}\).</li>
<li><b>CKY</b> (14): \(T[i,j]\ni A\) si \(A\to BC\), \(B\in T[i,k]\), \(C\in T[k,j]\). Coste \(O(n^3|G|)\).</li>
<li><b>PCFG</b> (17): \(P(T)=\prod P(A\to\beta)\); estimación \(P(A\to\beta)=C(A\to\beta)/C(A)\).</li>
</ul>
<h2>Significado (caps. 18–23)</h2>
<ul>
<li><b>Patrones de traducción a lógica</b> (18): «todo A es B» \(\forall x(A\to B)\); «algún A es B» \(\exists x(A\wedge B)\).</li>
<li><b>β-reducción</b> (20): \((\lambda x.\varphi)(a)\Rightarrow\varphi[x:=a]\).</li>
<li><b>Subsunción en ALC</b> (19): \(C\sqsubseteq D\iff C\sqcap\neg D\) insatisfacible.</li>
<li><b>Wu-Palmer</b> (23): \(\dfrac{2\,\mathrm{prof}(LCS)}{\mathrm{prof}(a)+\mathrm{prof}(b)}\). <b>PMI</b>: \(\log_2\dfrac{P(w,c)}{P(w)P(c)}\). <b>Coseno</b>: \(\dfrac{\mathbf a\cdot\mathbf b}{\lVert\mathbf a\rVert\lVert\mathbf b\rVert}\).</li>
</ul>
<h2>Texto como números (caps. 24–27)</h2>
<ul>
<li><b>TF-IDF</b> (24): \(\mathrm{tf}\cdot\ln\frac{1+N}{1+\mathrm{df}}+\mathrm{tf}\) con normalización L2 (versión de scikit-learn: \(\mathrm{idf}=\ln\frac{1+N}{1+\mathrm{df}}+1\)).</li>
<li><b>Modelo de n-gramas</b> (25): \(\hat P(w_i\mid h)=C(hw_i)/C(h)\). Laplace: \((C+k)/(C(h)+k|V|)\). Perplejidad: \(P(W)^{-1/m}\).</li>
<li><b>Kneser–Ney</b> (25): \(\dfrac{\max(C(hw)-D,0)}{C(h)}+\dfrac{D\,N_{1+}(h\bullet)}{C(h)}P_{\text{cont}}(w)\).</li>
<li><b>Skip-gram</b> (26): \(\mathcal L=-\log\sigma(\mathbf w\cdot\mathbf c)-\sum_i\log\sigma(-\mathbf w\cdot\mathbf n_i)\).</li>
<li><b>Bayes ingenuo</b> (27): \(\arg\max_c\log P(c)+\sum_i\log P(w_i\mid c)\). <b>Regresión logística</b>: \(\sigma(\mathbf w\cdot\mathbf x+b)\).</li>
</ul>
<h2>Redes y modelos grandes (caps. 28–33)</h2>
<ul>
<li><b>Retropropagación</b> (28): \(\delta^{(l)}=(W^{(l+1)\top}\delta^{(l+1)})\odot f'(z^{(l)})\); \(\partial\mathcal L/\partial W^{(l)}=\delta^{(l)}h^{(l-1)\top}\).</li>
<li><b>LSTM</b> (28): \(c_t=f_t\odot c_{t-1}+i_t\odot g_t\), \(h_t=o_t\odot\tanh c_t\).</li>
<li><b>Atención</b> (29–30): \(\mathrm{softmax}\bigl(QK^\top/\sqrt{d_k}\bigr)V\). Multicabeza: concatenar \(h\) cabezas y proyectar con \(W_O\).</li>
<li><b>Posición sinusoidal</b> (30): \(\mathrm{PE}(p,2i)=\sin(p/10000^{2i/d})\), \(\mathrm{PE}(p,2i+1)=\cos(\cdot)\).</li>
<li><b>Parámetros de un bloque</b> (30): \(4d^2+4d+2d\,d_{ff}+d_{ff}+d+4d\).</li>
<li><b>Temperatura</b> (32): \(P_T(w)\propto P(w)^{1/T}\). <b>BLEU</b>: \(\mathrm{BP}\cdot\exp(\tfrac14\sum\log p_n)\), \(\mathrm{BP}=\min(1,e^{1-r/c})\).</li>
<li><b>F1 por entidades</b> (33): coinciden el tipo y los límites exactos.</li>
</ul>
</section>
