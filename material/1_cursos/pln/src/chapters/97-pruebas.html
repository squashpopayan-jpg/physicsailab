<p class="lead">Estudiar no es releer: es intentar recordar y comprobar. Este centro reúne todas las preguntas del curso en un banco y le deja armar la prueba que necesita. Cada respuesta se guarda en su navegador (y en su cuenta, si abrió el curso como Artifact), de modo que las preguntas que falla vuelven pronto y las que domina, cada vez más tarde.</p>

<section>
<h2>Cómo usar las pruebas para aprender</h2>
<ul>
<li><b>Antes de estudiar un capítulo</b>, intente su autoevaluación o un examen de ese capítulo. Equivocarse al principio no cuenta en su contra: es la forma más eficiente de enterarse de qué va a leer. Se llama <i>efecto de la prueba previa</i>.</li>
<li><b>Después de estudiarlo</b>, repita la prueba al día siguiente y de nuevo a la semana. Recordar con esfuerzo fortalece la memoria más que releer; es el <i>efecto de la práctica de evocación</i> (Roediger y Karpicke, 2006).</li>
<li><b>Espacie.</b> El modo «Repaso» le muestra primero las preguntas que falló y las que ya tocan según su caja de Leitner: 0 (vuelve hoy), 1 (1 día), 2 (3 días), 3 (7 días), 4 (21 días).</li>
<li><b>Mezcle temas</b> con los modos «Parte» y «Examen del curso»: obliga a decidir qué técnica aplica, que es lo difícil en el trabajo real.</li>
<li>Una pregunta numérica tiene tolerancia; si su resultado difiere por redondeo, revise la explicación.</li>
</ul>
</section>

<section>
<h2>Centro de pruebas</h2>
<p>Elija el modo, ajuste el número de preguntas y pulse «Comenzar prueba». Al terminar verá el resultado por capítulo y los capítulos que conviene repasar.</p>
<div class="sim" data-sim="centro-pruebas" data-title="Armar y resolver una prueba"></div>
<div class="sim-guide"><ul>
<li><b>Capítulo</b>: todas las preguntas de ese capítulo, mezcladas.</li>
<li><b>Parte</b>: preguntas de varios capítulos de la misma parte, para integrar.</li>
<li><b>Examen del curso</b>: una muestra repartida entre todos los capítulos; sirve de diagnóstico general.</li>
<li><b>Repaso</b>: sus errores y las preguntas que ya toca repetir; si no tiene ninguna, lo avisa.</li>
</ul></div>
</section>
