<template class="chapter-src" data-id="momento" data-num="9" data-title="Cantidad de movimiento y colisiones" data-part="Parte IV · Energía y momento" data-short="Momento lineal, impulso, conservación del momento, colisiones en una y dos dimensiones, centro de masa y cohetes">
<p class="lead">¿Por qué una bolsa de aire salva vidas? ¿Por qué retrocede un cañón al disparar? ¿Cómo avanza un cohete en el vacío, donde no hay nada contra qué empujar? Las respuestas giran alrededor de una cantidad que combina masa y velocidad, la cantidad de movimiento, y de una ley tan fundamental como la conservación de la energía: en un sistema aislado, la cantidad de movimiento total no cambia.</p>

<div class="keyideas"><ul>
<li>La cantidad de movimiento (momento lineal) es \(\vb{p}=m\vb{v}\); la fuerza neta es su rapidez de cambio.</li>
<li>El impulso \(\vb{J}=\int\vb{F}\,\dd t=\Delta\vb{p}\): la misma variación de momento con más tiempo exige menos fuerza.</li>
<li>Si la fuerza externa neta es cero, el momento total del sistema se conserva, también en choques y explosiones.</li>
<li>En un choque elástico se conserva además la energía cinética; en uno perfectamente inelástico los cuerpos quedan unidos.</li>
<li>El centro de masa de un sistema se mueve como si toda la masa estuviera allí y actuara la fuerza externa neta.</li>
</ul></div>

<section>
<h2>Cantidad de movimiento e impulso</h2>
<p>Un camión y una bicicleta a la misma velocidad son muy distintos de detener: el camión tiene mucha más “cantidad de movimiento”. Se define el <strong>momento lineal</strong> de una partícula como</p>
<div class="eq key" data-name="Cantidad de movimiento">\[\vb{p}=m\,\vb{v}\qquad [\text{kg·m/s}].\]</div>
<p>Es un vector con la dirección de la velocidad. Newton escribió su segunda ley en términos del momento: la fuerza neta es la rapidez con que cambia,</p>
<div class="eq">\[\sum\vb{F}=\frac{\dd\vb{p}}{\dd t},\]</div>
<p>que para masa constante equivale a \(\sum\vb{F}=m\vb{a}\). Integrando en el tiempo se obtiene el <strong>teorema del impulso</strong>:</p>
<div class="eq key" data-name="Impulso">\[\vb{J}=\int_{t_i}^{t_f}\sum\vb{F}\,\dd t=\Delta\vb{p}=\vb{p}_f-\vb{p}_i,\qquad \vb{J}=\vb{F}_{\text{prom}}\,\Delta t .\]</div>
<p>El impulso es el área bajo la gráfica fuerza–tiempo. Para producir un cambio de momento dado, se puede aplicar una fuerza grande durante poco tiempo o una fuerza pequeña durante más tiempo. Esa es la física detrás de casi todos los dispositivos de seguridad.</p>
<div class="sim" data-sim="impulso" data-title="Un huevo que cae sobre distintas superficies: mismo impulso, distinta fuerza"></div>
<div class="sim-guide"><ul>
<li>Suelte el huevo sobre concreto y luego sobre un cojín: el área bajo las dos curvas \(F(t)\) es casi la misma (el mismo \(\Delta p\)), pero la fuerza máxima es muy distinta.</li>
<li>Aumente la altura: crece la velocidad de impacto y, con ella, el impulso y la fuerza.</li>
<li>La línea horizontal marca la fuerza que rompe el cascarón.</li>
</ul></div>
<div class="box ex">
<h4>La bolsa de aire</h4>
<p>En un choque a 50 km/h, la cabeza de un conductor (5 kg) debe detenerse. Compare la fuerza media si se detiene en 5 ms contra el volante y en 60 ms contra una bolsa de aire.</p>
<details><summary>Solución</summary>
<p>\(\Delta p=5(13.9)=69.4\) kg·m/s. Contra el volante: \(F=69.4/0.005=1.4\times10^4\) N. Con bolsa de aire: \(F=69.4/0.060=1.2\times10^3\) N, doce veces menos. El impulso es el mismo; lo que cambia es el tiempo.</p>
</details>
</div>

<section>
<h2>Conservación de la cantidad de movimiento</h2>
<p>Considere dos cuerpos que interactúan (chocan, se empujan, se atraen). Por la tercera ley, la fuerza de 1 sobre 2 es igual y opuesta a la de 2 sobre 1, y actúan durante el mismo tiempo: sus impulsos son opuestos. Por tanto el cambio de momento de uno cancela el del otro. Si no hay fuerzas externas netas:</p>
<div class="box law">
<h4>Conservación del momento lineal</h4>
<p>Si la fuerza externa neta sobre un sistema es cero, su cantidad de movimiento total permanece constante:</p>
<div class="eq">\[\vb{P}=\vb{p}_1+\vb{p}_2+\cdots=\text{constante}\qquad\Longleftrightarrow\qquad \sum\vb{p}_{\text{antes}}=\sum\vb{p}_{\text{después}} .\]</div>
</div>
<p>Las fuerzas internas, por intensas que sean, no cambian el momento total: sólo lo redistribuyen. La ley se cumple por componentes y es válida aunque la energía cinética no se conserve.</p>
<div class="box ex">
<h4>El retroceso de un rifle</h4>
<p>Un rifle de 4.0 kg dispara una bala de 10 g a 600 m/s. ¿Con qué velocidad retrocede el rifle?</p>
<details><summary>Solución</summary>
<p>Antes del disparo el momento total es cero. Después: \(0=(0.010)(600)+(4.0)v_R\), \(v_R=-1.5\) m/s. El rifle retrocede a 1.5 m/s; la energía cinética de la bala (1800 J) es 400 veces la del rifle (4.5 J).</p>
</details>
</div>
</section>

<section>
<h2>Colisiones en una dimensión</h2>
<p>En un choque las fuerzas de contacto son tan grandes y breves que las externas (peso, fricción) son despreciables durante el impacto: el momento total se conserva. La energía cinética, en cambio, puede o no conservarse:</p>
<ul>
<li><strong>Elástico:</strong> se conservan el momento y la energía cinética (bolas de billar, choques entre átomos).</li>
<li><strong>Inelástico:</strong> se conserva el momento pero parte de la energía cinética se convierte en calor, sonido o deformación.</li>
<li><strong>Perfectamente inelástico:</strong> los cuerpos quedan unidos; es el caso de máxima pérdida de energía compatible con la conservación del momento.</li>
</ul>
<p>El <strong>coeficiente de restitución</strong> \(e=-\dfrac{v_2'-v_1'}{v_2-v_1}\) compara la rapidez con que se separan y con que se acercan: \(e=1\) elástico, \(e=0\) perfectamente inelástico. Con él, las velocidades después del choque son</p>
<div class="eq key" data-name="Choque en una dimensión">\[v_1'=\frac{m_1v_1+m_2v_2-m_2e\,(v_1-v_2)}{m_1+m_2},\qquad v_2'=\frac{m_1v_1+m_2v_2+m_1e\,(v_1-v_2)}{m_1+m_2}.\]</div>
<p>Casos notables de choque elástico con \(m_2\) en reposo: si las masas son iguales, intercambian velocidades (el primero queda quieto); si \(m_2\gg m_1\), el primero rebota con la misma rapidez; si \(m_1\gg m_2\), el segundo sale con casi el doble de la velocidad del primero.</p>
<div class="sim" data-sim="colision-1d" data-title="Choques en un riel de aire: elásticos, inelásticos y explosiones"></div>
<div class="sim-guide"><ul>
<li>En todos los casos la gráfica del momento total es una recta horizontal: no cambia en el choque.</li>
<li>La energía cinética total sólo se conserva con \(e=1\). Con \(e=0\) los carros quedan unidos y se pierde la máxima energía posible.</li>
<li>Vea el choque desde el marco del centro de masa: los carros se acercan y se alejan simétricamente, y el momento total es cero.</li>
</ul></div>
<div class="box ex">
<h4>Un choque de autos que quedan enganchados</h4>
<p>Un auto de 1200 kg a 20 m/s choca por detrás a otro de 800 kg que va a 10 m/s en el mismo sentido, y quedan enganchados. ¿Con qué velocidad siguen? ¿Cuánta energía se disipa?</p>
<details><summary>Solución</summary>
<p>\(v'=\dfrac{1200(20)+800(10)}{2000}=16\) m/s. Energía antes: \(240\,000+40\,000=280\,000\) J; después: \(\tfrac12(2000)(16)^2=256\,000\) J. Se disipan 24 kJ en deformación, calor y sonido.</p>
<p><button class="try" type="button" data-try="colision-1d:autos">Probar en la simulación</button></p>
</details>
</div>

<section>
<h2>Colisiones en dos dimensiones</h2>
<p>Si el choque no es frontal, los cuerpos salen en direcciones distintas. El momento se conserva como vector, es decir, componente por componente:</p>
<div class="eq">\[m_1v_{1x}+m_2v_{2x}=m_1v_{1x}'+m_2v_{2x}',\qquad m_1v_{1y}+m_2v_{2y}=m_1v_{1y}'+m_2v_{2y}'.\]</div>
<p>Para esferas lisas, la fuerza del impacto actúa a lo largo de la línea que une los centros: la componente de la velocidad perpendicular a esa línea no cambia. Un resultado famoso: en un choque elástico entre masas iguales con una en reposo, las dos salen formando un ángulo recto.</p>
<div class="sim" data-sim="colision-2d" data-title="Choque de bolas de billar: el momento se suma como vector"></div>
<div class="sim-guide"><ul>
<li>El recuadro dibuja \(\vb{p}_1\) antes del choque y \(\vb{p}_1'+\vb{p}_2'\) después, punta con cola: siempre cierran el mismo vector.</li>
<li>Con masas iguales y choque elástico, las trayectorias de salida forman 90° para cualquier parámetro de impacto.</li>
</ul></div>

<h4>En la vida cotidiana</h4>
<div class="daily-grid">

<section>
<h2>Centro de masa</h2>
<p>El <strong>centro de masa</strong> de un sistema es el promedio de las posiciones ponderado por las masas:</p>
<div class="eq key" data-name="Centro de masa">\[\vb{r}_{\text{cm}}=\frac{\sum m_i\vb{r}_i}{\sum m_i}=\frac{m_1\vb{r}_1+m_2\vb{r}_2+\cdots}{M}.\]</div>
<p>Su importancia está en que el momento total del sistema es \(\vb{P}=M\vb{v}_{\text{cm}}\) y</p>
<div class="eq">\[\sum\vb{F}_{\text{ext}}=M\,\vb{a}_{\text{cm}} .\]</div>
<p>El centro de masa se mueve como una partícula de masa \(M\) sometida a la fuerza externa neta, sin importar lo que hagan las partes. Una llave lanzada girando describe un movimiento complicado, pero su centro de masa sigue una parábola perfecta; si un proyectil explota en el aire, el centro de masa de los fragmentos continúa la parábola original.</p>
<div class="sim" data-sim="centro-masa" data-title="Centro de masa: partículas, una llave que gira y fuegos artificiales"></div>
<div class="sim-guide"><ul>
<li>Arrastre las masas y cambie sus valores: el centro de masa se acerca a la masa mayor.</li>
<li>Con la llave, los extremos dibujan rizos, pero el centro de masa describe una parábola.</li>
<li>En los fuegos artificiales, después de la explosión el centro de masa de los fragmentos sigue exactamente la parábola que traía el cohete.</li>
</ul></div>

<section>
<h2>Propulsión de cohetes</h2>
<p>Un cohete avanza expulsando gases hacia atrás a gran velocidad \(u\) respecto a él. No necesita “apoyarse” en el aire: el momento que lleva el gas hacia atrás lo gana el cohete hacia adelante. Aplicando la conservación del momento a una pequeña masa expulsada se obtiene el <strong>empuje</strong> y la <strong>ecuación de Tsiolkovsky</strong> para el cambio de velocidad sin gravedad:</p>
<div class="eq key" data-name="Cohete">\[F_{\text{empuje}}=u\left|\frac{\dd m}{\dd t}\right|,\qquad \Delta v=u\,\ln\frac{m_i}{m_f}.\]</div>
<p>El cambio de velocidad depende del logaritmo de la razón de masas: para ir muy rápido hace falta que casi toda la masa inicial sea combustible. Por eso los cohetes reales tienen varias etapas que se desprenden al vaciarse.</p>
<div class="sim" data-sim="cohete" data-title="Cohete: empuje, masa variable y ecuación de Tsiolkovsky"></div>
<div class="sim-guide"><ul>
<li>En el espacio (sin gravedad), la velocidad final coincide con \(u\ln(m_i/m_f)\). La aceleración crece a medida que el cohete se aligera.</li>
<li>En el despegue, si el empuje no supera el peso, el cohete no se levanta. La gravedad “consume” parte del cambio de velocidad.</li>
</ul></div>

<section>
<h2>Preguntas y problemas</h2>
<ol class="problems">
<li><span class="lvl">Concepto</span>¿Puede un sistema tener energía cinética sin tener momento total? ¿Y momento total sin energía cinética?
<details><summary>Respuesta</summary><p>Sí a lo primero: dos patinadores que se alejan en sentidos opuestos tienen momento total cero y energía cinética positiva. No a lo segundo: si hay momento, algo se mueve y hay energía cinética.</p></details></li>
<li><span class="lvl">Concepto</span>Al saltar de un bote hacia el muelle, ¿por qué es fácil caer al agua?
<details><summary>Respuesta</summary><p>Al impulsarnos hacia adelante el bote se mueve hacia atrás (conservación del momento): parte del impulso se “gasta” en mover el bote y nos alejamos menos.</p></details></li>
<li><span class="lvl">Problema</span>Una pelota de 0.15 kg llega a 30 m/s y sale del bate a 45 m/s en sentido contrario. El contacto dura 1.5 ms. Halle el impulso y la fuerza media.
<details><summary>Respuesta</summary><p>\(J=0.15(45+30)=11.3\) N·s; \(F=J/\Delta t=7.5\times10^3\) N.</p></details></li>
<li><span class="lvl">Problema</span>Un bloque de 2 kg a 6 m/s choca elásticamente con otro de 4 kg en reposo. Halle las velocidades finales.
<details><summary>Respuesta</summary><p>\(v_1'=\dfrac{2-4}{6}(6)=-2\) m/s; \(v_2'=\dfrac{2(2)}{6}(6)=4\) m/s. Comprobación: \(K\) antes 36 J, después \(4+32=36\) J.</p></details></li>
<li><span class="lvl">Problema</span>Un cohete en el espacio tiene masa inicial de 5000 kg, de los cuales 4000 kg son combustible, y sus gases salen a 2500 m/s. ¿Qué velocidad gana al quemar todo el combustible?
<details><summary>Respuesta</summary><p>\(\Delta v=2500\ln(5000/1000)=4.0\) km/s.</p></details></li>
</ol>
</section>
