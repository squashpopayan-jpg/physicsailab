<p class="lead">Cuando se lanza una piedra a un estanque, el agua no viaja hasta la orilla: lo que viaja es la perturbación. Una onda transporta energía y movimiento de un lugar a otro sin transportar materia. Así nos llega el sonido, así sacude un sismo una ciudad lejana y así vibra la cuerda de una guitarra.</p>

<div class="keyideas"><ul>
<li>Una onda mecánica es una perturbación que se propaga en un medio; las partículas del medio sólo oscilan alrededor de su posición.</li>
<li>En una onda transversal las partículas se mueven perpendicularmente a la dirección de propagación; en una longitudinal, a lo largo de ella.</li>
<li>Para una onda periódica \(v=\lambda f\). La rapidez depende del medio: en una cuerda, \(v=\sqrt{F/\mu}\).</li>
<li>Las ondas se superponen: el desplazamiento resultante es la suma de los desplazamientos (interferencia constructiva o destructiva).</li>
<li>Dos ondas iguales que viajan en sentidos opuestos forman una onda estacionaria; en una cuerda fija en sus extremos sólo existen las frecuencias \(f_n=nv/2L\).</li>
</ul></div>

<section>
<h2>¿Qué es una onda?</h2>
<p>Una <strong>onda mecánica</strong> es una perturbación que se propaga a través de un medio material (una cuerda, el aire, el agua, la roca). Cada porción del medio se mueve un poco y empuja a la siguiente; la perturbación avanza, pero el medio, en promedio, se queda donde estaba. Las ondas electromagnéticas (la luz) no necesitan medio; aquí sólo estudiamos las mecánicas.</p>
<ul>
<li><strong>Ondas transversales:</strong> las partículas oscilan perpendicularmente a la dirección de propagación. Ejemplos: una cuerda sacudida, la “ola” de un estadio, las ondas S de un sismo.</li>
<li><strong>Ondas longitudinales:</strong> las partículas oscilan en la misma dirección en que avanza la onda, formando compresiones y rarefacciones. Ejemplos: el sonido, un resorte empujado por un extremo, las ondas P de un sismo.</li>
</ul>
<p>Las olas del mar combinan ambos movimientos: las partículas de agua describen círculos.</p>

<section>
<h2>Ondas viajeras periódicas</h2>
<p>Si el extremo de una cuerda se mueve con un MAS, cada punto de la cuerda repite ese movimiento con un retraso: se forma una <strong>onda sinusoidal</strong>. Su forma se repite en el espacio cada <strong>longitud de onda</strong> λ y en el tiempo cada periodo \(T\). En un periodo la onda avanza una longitud de onda, así que su rapidez es</p>
<div class="eq key" data-name="Rapidez de una onda periódica">\[v=\frac{\lambda}{T}=\lambda f .\]</div>
<p>La onda que viaja hacia \(+x\) se describe con la <strong>función de onda</strong></p>
<div class="eq key" data-name="Onda sinusoidal viajera">\[y(x,t)=A\,\sen(kx-\omega t),\qquad k=\frac{2\pi}{\lambda},\quad \omega=2\pi f,\quad v=\frac{\omega}{k}.\]</div>
<p>El <strong>número de onda</strong> \(k\) (rad/m) cuenta cuántos radianes de fase caben en un metro. Para una onda hacia \(-x\) se usa \(kx+\omega t\). No hay que confundir la rapidez de la onda, \(v\), con la de las partículas de la cuerda, que suben y bajan con un MAS y rapidez máxima \(A\omega\).</p>
<h3>La rapidez depende del medio</h3>
<p>En una cuerda de tensión \(F\) y masa por unidad de longitud \(\mu\) (kg/m), un análisis con la segunda ley de Newton da</p>
<div class="eq key" data-name="Rapidez de una onda en una cuerda">\[v=\sqrt{\frac{F}{\mu}} .\]</div>
<p>Una cuerda más tensa transmite la perturbación más rápido; una más pesada, más despacio. La rapidez <em>no</em> depende de la frecuencia ni de la amplitud: si se agita la cuerda más rápido, las ondas no van más rápido, sino que salen más cortas (λ menor).</p>
<div class="sim" data-sim="onda-viajera" data-title="Una onda viajera en una cuerda"></div>
<div class="sim-guide"><ul>
<li>Siga la partícula roja: sólo sube y baja, mientras las crestas avanzan hacia la derecha.</li>
<li>Duplique la frecuencia: λ se reduce a la mitad y \(v\) no cambia. Cuadruplique la tensión: \(v\) y λ se duplican.</li>
<li>Cambie a onda longitudinal: los puntos se mueven a lo largo de la cuerda y se forman compresiones y rarefacciones.</li>
</ul></div>
<div class="box ex">
<h4>La cuerda de una guitarra</h4>
<p>Una cuerda de guitarra tiene \(\mu=7.0\) g/m y una tensión de 150 N. ¿Con qué rapidez viajan las ondas en ella? Si se pulsa y vibra a 110 Hz, ¿cuál es la longitud de onda?</p>
<details><summary>Solución</summary>
<p>\(v=\sqrt{150/0.0070}=146\) m/s. \(\lambda=v/f=146/110=1.33\) m, el doble de la longitud vibrante de la cuerda (0.65 m): vibra en su modo fundamental.</p>
</details>
</div>
<div class="box ex">
<h4>Leer la función de onda</h4>
<p>Una onda en una cuerda es \(y=0.020\,\sen(3.0x-60t)\) (SI). Halle la amplitud, λ, \(f\), \(v\) y la rapidez máxima de un punto de la cuerda.</p>
<details><summary>Solución</summary>
<p>\(A=2.0\) cm; \(\lambda=2\pi/3.0=2.09\) m; \(f=60/2\pi=9.55\) Hz; \(v=\omega/k=20\) m/s hacia \(+x\); \(v_{\text{part,máx}}=A\omega=1.2\) m/s.</p>
<p><button class="try" type="button" data-try="onda-viajera:basica">Probar en la simulación</button></p>
</details>
</div>
<h3>Energía que transporta una onda</h3>
<p>Cada tramo de cuerda que oscila tiene energía cinética y potencial, y la va entregando al tramo siguiente. La potencia media transportada por una onda sinusoidal en una cuerda es</p>
<div class="eq">\[P=\tfrac12\,\mu\,v\,\omega^2A^2 .\]</div>
<p>Depende del <em>cuadrado</em> de la amplitud y de la frecuencia: una onda del doble de amplitud transporta cuatro veces más energía. Lo mismo ocurre con el sonido, las olas y los sismos: la escala de magnitud de los terremotos es logarítmica justamente porque la energía varía en órdenes de magnitud.</p>
</section>

<section>
<h2>Superposición, interferencia y reflexión</h2>
<div class="box law">
<h4>Principio de superposición</h4>
<p>Cuando dos o más ondas coinciden en un punto, el desplazamiento resultante es la suma algebraica de los desplazamientos de cada onda: \(y=y_1+y_2\). Después de cruzarse, cada onda sigue su camino sin alterarse.</p>
</div>
<p>Si dos crestas coinciden, se suman (<strong>interferencia constructiva</strong>); si una cresta coincide con un valle, se restan (<strong>interferencia destructiva</strong>). Dos ondas de igual frecuencia que viajan en el mismo sentido con una diferencia de fase φ producen otra onda de amplitud</p>
<div class="eq">\[A_R=2A\cos\frac{\phi}{2}\quad(\text{amplitudes iguales}):\qquad \phi=0\Rightarrow A_R=2A,\quad \phi=\pi\Rightarrow A_R=0 .\]</div>
<p>Cuando una onda llega al extremo de la cuerda se <strong>refleja</strong>. Si el extremo está fijo, el pulso regresa invertido (la pared ejerce una fuerza opuesta); si está libre (un anillo que desliza sin fricción por una varilla), regresa derecho. En la unión de dos cuerdas distintas, parte de la onda se transmite y parte se refleja.</p>
<div class="sim" data-sim="superposicion" data-title="Superposición: pulsos que se cruzan, reflexiones e interferencia"></div>
<div class="sim-guide"><ul>
<li>Con dos pulsos iguales y opuestos hay un instante en que la cuerda queda completamente recta… pero no quieta: la energía está en forma cinética y los pulsos reaparecen.</li>
<li>En «Extremo», compare la reflexión en un extremo fijo (el pulso vuelve invertido) y en uno libre (vuelve derecho).</li>
<li>En «Dos ondas», varíe la diferencia de fase de 0° a 180°: la onda resultante pasa de amplitud doble a desaparecer.</li>
</ul></div>

<section>
<h2>Ondas estacionarias</h2>
<p>Una cuerda fija en ambos extremos refleja una y otra vez las ondas. La superposición de dos ondas iguales que viajan en sentidos opuestos es</p>
<div class="eq key" data-name="Onda estacionaria">\[y=A\,\sen(kx-\omega t)+A\,\sen(kx+\omega t)=2A\,\sen(kx)\cos(\omega t).\]</div>
<p>La forma ya no viaja: cada punto oscila con una amplitud \(2A\,\sen(kx)\) que depende de su posición. Hay puntos que nunca se mueven, los <strong>nodos</strong> (separados λ/2), y puntos de amplitud máxima, los <strong>antinodos</strong>. Como los extremos fijos deben ser nodos, en una cuerda de longitud \(L\) sólo caben un número entero de medias longitudes de onda:</p>
<div class="eq key" data-name="Armónicos de una cuerda fija en sus extremos">\[L=n\,\frac{\lambda_n}{2}\quad\Rightarrow\quad f_n=n\,\frac{v}{2L}=n\,f_1=\frac{n}{2L}\sqrt{\frac{F}{\mu}},\qquad n=1,2,3,\dots\]</div>
<p>La frecuencia más baja, \(f_1\), es la <strong>fundamental</strong>; las demás son los <strong>armónicos</strong>. Si se hace vibrar la cuerda con otra frecuencia, casi no responde: las ondas estacionarias son resonancias de la cuerda.</p>
<div class="sim" data-sim="estacionarias" data-title="Ondas estacionarias en una cuerda: armónicos y resonancia"></div>
<div class="sim-guide"><ul>
<li>Elija el armónico \(n\): hay \(n\) antinodos y \(n+1\) nodos, contando los extremos.</li>
<li>En «Barrido de frecuencia», mueva la frecuencia del vibrador: la cuerda sólo vibra con fuerza cerca de \(f_1,2f_1,3f_1,\dots\), como muestra la curva de respuesta.</li>
<li>Aumente la masa que cuelga (la tensión): todas las frecuencias suben en proporción a \(\sqrt F\).</li>
</ul></div>
<div class="box ex">
<h4>Afinar una guitarra</h4>
<p>La cuerda La de una guitarra (0.65 m) suena a 110 Hz. ¿Cuánto hay que aumentar la tensión para que suene a 116.5 Hz (un semitono más agudo)? Si se pisa la cuerda en el traste 12 (a la mitad), ¿qué frecuencia suena?</p>
<details><summary>Solución</summary>
<p>\(f\propto\sqrt F\): \(F_2/F_1=(116.5/110)^2=1.12\), un 12 % más de tensión. Pisando en la mitad, \(L\) se reduce a la mitad y la frecuencia se duplica: 220 Hz, una octava más alta.</p>
<p><button class="try" type="button" data-try="estacionarias:guitarra">Probar en la simulación</button></p>
</details>
</div>
<div class="box hist">
<p>En 1859 Franz Melde ató una cuerda a una de las ramas de un diapasón eléctrico y la pasó por una polea con una pesa colgando. Cambiando la pesa aparecían ondas estacionarias con 1, 2, 3… husos: fue una de las primeras comprobaciones cuidadosas de \(f=\frac{n}{2L}\sqrt{F/\mu}\).</p>

</div>

<div class="dcard"><b>Instrumentos de cuerda</b><p>Las cuerdas graves son más gruesas y pesadas (mayor μ) o más largas; al girar las clavijas se ajusta la tensión. Pisar los trastes acorta la longitud vibrante.</p></div>

<div class="dcard"><b>Puentes y cables</b><p>Los cables de los puentes colgantes también tienen modos estacionarios; el viento o la lluvia pueden excitarlos y por eso llevan amortiguadores.</p></div>

<section>
<h2>Preguntas y problemas</h2>
<ol class="problems">
<li><span class="lvl">Concepto</span>Si se agita el extremo de una cuerda con el doble de frecuencia, ¿qué pasa con la rapidez de la onda y con su longitud de onda?
<details><summary>Respuesta</summary><p>La rapidez no cambia (depende sólo de \(F\) y μ); la longitud de onda se reduce a la mitad.</p></details></li>
<li><span class="lvl">Concepto</span>Dos pulsos iguales y opuestos se cancelan por un instante. ¿Adónde fue la energía?
<details><summary>Respuesta</summary><p>En ese instante la cuerda está recta (sin energía potencial), pero sus puntos se mueven con rapidez máxima: toda la energía es cinética.</p></details></li>
<li><span class="lvl">Problema</span>Una cuerda de 2.0 m y 40 g se tensa a 80 N. ¿Con qué rapidez viajan las ondas? ¿Cuál es su frecuencia fundamental si está fija en ambos extremos?
<details><summary>Respuesta</summary><p>\(\mu=0.020\) kg/m; \(v=\sqrt{80/0.020}=63\) m/s; \(f_1=v/2L=15.8\) Hz.</p></details></li>
<li><span class="lvl">Problema</span>Una onda viaja con \(y=0.05\,\sen(\pi x-4\pi t)\) (SI). ¿Cuánto valen λ, \(f\) y \(v\)? ¿Hacia dónde viaja?
<details><summary>Respuesta</summary><p>\(\lambda=2\) m, \(f=2\) Hz, \(v=4\) m/s, hacia \(+x\).</p></details></li>
<li><span class="lvl">Problema</span>Una cuerda vibra en su tercer armónico a 240 Hz. ¿Cuál es la fundamental? ¿Cuántos nodos tiene la onda estacionaria (contando los extremos)?
<details><summary>Respuesta</summary><p>\(f_1=80\) Hz; en el tercer armónico hay 4 nodos y 3 antinodos.</p></details></li>
</ol>
