<template class="chapter-src" data-id="rotacion" data-num="10" data-title="Rotación de cuerpos rígidos" data-part="Parte V · Rotación y equilibrio" data-short="Variables angulares, rotación con α constante, energía cinética de rotación, momento de inercia y rodadura">
<p class="lead">Hasta ahora los cuerpos eran partículas. Pero una rueda, un ventilador o un planeta giran, y cada uno de sus puntos se mueve distinto. Un <em>cuerpo rígido</em> que gira alrededor de un eje se describe con variables angulares, que obedecen ecuaciones idénticas a las del movimiento rectilíneo. La “masa” de la rotación es el momento de inercia, que depende de cómo está distribuida la masa.</p>

<div class="keyideas"><ul>
<li>Todos los puntos de un cuerpo rígido giran el mismo ángulo θ con la misma rapidez angular ω y la misma aceleración angular α.</li>
<li>Un punto a distancia \(r\) del eje tiene \(v=\omega r\), \(a_t=\alpha r\) y \(a_c=\omega^2r\).</li>
<li>Con α constante valen las mismas cuatro ecuaciones del MRUA, cambiando \(x\to\theta\), \(v\to\omega\), \(a\to\alpha\).</li>
<li>La energía cinética de rotación es \(\tfrac12I\omega^2\), con \(I=\sum m_ir_i^2\): masa lejos del eje cuesta más de hacer girar.</li>
<li>Un objeto que rueda reparte su energía entre traslación y rotación; los de menor \(I/MR^2\) ganan la carrera cuesta abajo.</li>
</ul></div>

<section>
<h2>Variables angulares</h2>
<p>Para describir la rotación de un cuerpo rígido alrededor de un eje fijo basta un ángulo: la <strong>posición angular</strong> \(\theta\) de una línea marcada en el cuerpo. En física se mide en <strong>radianes</strong>: el ángulo que abarca un arco de longitud igual al radio. Así, la longitud de arco recorrida por un punto a distancia \(r\) del eje es</p>
<div class="eq">\[s=r\,\theta\qquad(\theta\text{ en radianes}),\qquad 1\un{vuelta}=2\pi\un{rad}=360^\circ .\]</div>
<p>Por analogía con el movimiento en línea recta se definen la <strong>velocidad angular</strong> y la <strong>aceleración angular</strong>:</p>
<div class="eq key" data-name="Cinemática angular">\[\omega=\frac{\dd\theta}{\dd t}\ \ [\text{rad/s}],\qquad \alpha=\frac{\dd\omega}{\dd t}\ \ [\text{rad/s}^2].\]</div>
<p>Por convención ω es positiva en sentido antihorario. Una velocidad angular de 60 rpm (revoluciones por minuto) es 1 vuelta por segundo, es decir \(2\pi\) rad/s.</p>
<h3>Relación entre variables angulares y lineales</h3>
<p>Todos los puntos de un cuerpo rígido comparten θ, ω y α, pero su movimiento lineal depende de su distancia \(r\) al eje:</p>
<div class="eq key" data-name="De lo angular a lo lineal">\[v=\omega\,r,\qquad a_t=\alpha\,r,\qquad a_c=\frac{v^2}{r}=\omega^2r .\]</div>
<p>En una rueda que gira, el borde va mucho más rápido que el centro. Por eso el disco de una amoladora corta con el borde y los extremos de las aspas de un aerogenerador pueden superar los 300 km/h.</p>
</section>

<section>
<h2>Rotación con aceleración angular constante</h2>
<p>Si α es constante, las ecuaciones son idénticas a las del MRUA del capítulo 3:</p>
<div class="eq key" data-name="Rotación con α constante">\[\begin{aligned}
\omega&=\omega_0+\alpha t & \qquad \theta&=\theta_0+\omega_0t+\tfrac12\alpha t^2\\
\omega^2&=\omega_0^2+2\alpha(\theta-\theta_0) & \qquad \theta-\theta_0&=\tfrac12(\omega_0+\omega)\,t
\end{aligned}\]</div>
<div class="sim" data-sim="cinematica-rot" data-title="Una rueda que acelera o frena: θ(t), ω(t) y los vectores de un punto"></div>
<div class="sim-guide"><ul>
<li>Mueva el punto P hacia el borde: θ, ω y α no cambian, pero \(v\), \(a_t\) y \(a_c\) crecen en proporción a \(r\).</li>
<li>En el ventilador que se apaga, la gráfica θ(t) es una parábola que termina horizontal y ω(t) una recta que baja hasta cero.</li>
<li>Con ω constante sólo queda la aceleración centrípeta; al acelerar aparece además la tangencial.</li>
</ul></div>
<div class="box ex">
<h4>Un ventilador que se apaga</h4>
<p>Un ventilador gira a 1200 rpm y al apagarlo se detiene en 12 s con desaceleración constante. ¿Cuántas vueltas da mientras frena?</p>
<details><summary>Solución</summary>
<p>\(\omega_0=1200(2\pi)/60=125.7\) rad/s. \(\alpha=-125.7/12=-10.5\) rad/s². Ángulo: \(\theta=\tfrac12(\omega_0+0)t=\tfrac12(125.7)(12)=754\) rad \(=120\) vueltas.</p>
<p><button class="try" type="button" data-try="cinematica-rot:ventilador">Probar en la simulación</button></p>
</details>
</div>

<section>
<h2>Energía cinética de rotación y momento de inercia</h2>
<p>Un cuerpo que gira tiene energía cinética aunque su centro no se desplace: cada partícula de masa \(m_i\) se mueve con rapidez \(v_i=\omega r_i\). Sumando,</p>
<div class="eq key" data-name="Energía cinética de rotación">\[K_{\text{rot}}=\sum\tfrac12m_iv_i^2=\tfrac12\Big(\sum m_ir_i^2\Big)\omega^2=\tfrac12\,I\,\omega^2,\qquad I=\sum m_ir_i^2=\int r^2\,\dd m .\]</div>
<p>El <strong>momento de inercia</strong> \(I\) (kg·m²) cumple en la rotación el papel de la masa en la traslación: mide la resistencia a cambiar la rotación. Depende de la masa y, sobre todo, de <em>cómo está distribuida</em> respecto al eje, porque cada masa cuenta con el cuadrado de su distancia.</p>
<div class="tablewrap narrow"><table>
<thead><tr><th>Cuerpo (eje por el centro de masa)</th><th class="c">\(I\)</th><th class="c">\(I/MR^2\)</th></tr></thead>
<tbody>
<tr><td>Aro delgado o cilindro hueco de pared delgada</td><td class="c">\(MR^2\)</td><td class="num c">1</td></tr>
<tr><td>Esfera hueca de pared delgada</td><td class="c">\(\tfrac23MR^2\)</td><td class="num c">0.667</td></tr>
<tr><td>Disco o cilindro sólido</td><td class="c">\(\tfrac12MR^2\)</td><td class="num c">0.5</td></tr>
<tr><td>Esfera sólida</td><td class="c">\(\tfrac25MR^2\)</td><td class="num c">0.4</td></tr>
<tr><td>Varilla delgada de longitud \(L\), eje por el centro</td><td class="c">\(\tfrac1{12}ML^2\)</td><td class="c">—</td></tr>
<tr><td>Varilla delgada, eje por un extremo</td><td class="c">\(\tfrac13ML^2\)</td><td class="c">—</td></tr>
<tr><td>Placa rectangular \(a\times b\), eje perpendicular por el centro</td><td class="c">\(\tfrac1{12}M(a^2+b^2)\)</td><td class="c">—</td></tr>
</tbody></table></div>
<h3>Teorema de los ejes paralelos</h3>
<p>Si se conoce \(I_{\text{cm}}\) respecto a un eje que pasa por el centro de masa, el momento de inercia respecto a cualquier eje paralelo a una distancia \(d\) es</p>
<div class="eq key" data-name="Ejes paralelos (Steiner)">\[I=I_{\text{cm}}+M\,d^2 .\]</div>
<p>Por ejemplo, para una varilla alrededor de un extremo: \(\tfrac1{12}ML^2+M(L/2)^2=\tfrac13ML^2\). El eje que pasa por el centro de masa es siempre el de menor momento de inercia.</p>
<div class="sim" data-sim="momento-inercia" data-title="Momento de inercia: formas, ejes paralelos y pesas en una varilla"></div>
<div class="sim-guide"><ul>
<li>Compare un aro y un disco de igual masa y radio: el aro tiene el doble de momento de inercia porque toda su masa está en el borde.</li>
<li>Desplace el eje: el momento de inercia crece como \(Md^2\) y es mínimo cuando el eje pasa por el centro de masa.</li>
<li>Con las pesas en la varilla, alejarlas del centro al doble cuadruplica su contribución.</li>
</ul></div>

<div class="daily-grid">
<div class="dcard"><b>El bate de béisbol</b><p>Tomarlo más cerca del extremo grueso (“recortar el bate”) reduce el momento de inercia respecto a las manos: se gira más rápido, aunque con menos alcance.</p></div>

</section>

<section>
<h2>Rodadura: la carrera cuesta abajo</h2>
<p>Un objeto que rueda sin deslizar combina traslación y rotación, con la condición \(v_{\text{cm}}=\omega R\). Su energía cinética total es</p>
<div class="eq key" data-name="Energía de un objeto que rueda">\[K=\tfrac12Mv_{\text{cm}}^2+\tfrac12I_{\text{cm}}\,\omega^2=\tfrac12Mv_{\text{cm}}^2\left(1+\frac{I_{\text{cm}}}{MR^2}\right).\]</div>
<p>Si baja rodando una altura \(h\) partiendo del reposo, la conservación de la energía da \(Mgh=\tfrac12Mv^2(1+\beta)\), con \(\beta=I_{\text{cm}}/(MR^2)\):</p>
<div class="eq">\[v=\sqrt{\frac{2gh}{1+\beta}},\qquad a=\frac{g\sen\theta}{1+\beta}.\]</div>
<p>El resultado no depende ni de la masa ni del radio, sólo de la <em>forma</em> (β). Una esfera sólida (β = 0.4) le gana a un disco (0.5), que le gana a una esfera hueca (0.67), que le gana a un aro (1). Un bloque que desliza sin fricción (sin rotación, β = 0) les gana a todos: no “gasta” energía en girar.</p>
<div class="sim" data-sim="rodadura-carrera" data-title="Carrera de objetos que ruedan por un plano inclinado"></div>
<div class="sim-guide"><ul>
<li>Cambie la masa o el radio: el orden y los tiempos de llegada no cambian.</li>
<li>Las barras muestran qué fracción de la energía se va en rotación: la mitad para el aro, 2/7 para la esfera sólida.</li>
</ul></div>
<div class="box ex">
<h4>Esfera y aro por la misma rampa</h4>
<p>Una esfera sólida y un aro ruedan sin deslizar desde el reposo por una rampa de 1.0 m de altura. ¿Con qué rapidez llega cada uno?</p>
<details><summary>Solución</summary>
<p>Esfera: \(v=\sqrt{2(9.8)(1.0)/1.4}=3.74\) m/s. Aro: \(v=\sqrt{2(9.8)(1.0)/2}=3.13\) m/s. Un bloque sin fricción llegaría a \(\sqrt{2gh}=4.43\) m/s.</p>
<p><button class="try" type="button" data-try="rodadura-carrera:clasica">Probar en la simulación</button></p>
</details>
</div>

<section>
<h2>Preguntas y problemas</h2>
<ol class="problems">
<li><span class="lvl">Concepto</span>Dos niños están sobre un carrusel, uno cerca del centro y otro en el borde. ¿Cuál tiene mayor rapidez angular? ¿Y mayor rapidez lineal?
<details><summary>Respuesta</summary><p>La misma rapidez angular. El del borde tiene mayor rapidez lineal, \(v=\omega r\).</p></details></li>
<li><span class="lvl">Concepto</span>¿Por qué es más fácil hacer girar un lápiz alrededor de su eje largo que alrededor de un eje perpendicular por su centro?
<details><summary>Respuesta</summary><p>Porque respecto al eje largo toda la masa está muy cerca del eje (radio de unos milímetros): el momento de inercia es muchísimo menor.</p></details></li>
<li><span class="lvl">Problema</span>Una rueda parte del reposo con α = 2.0 rad/s². ¿Qué rapidez angular tiene a los 5 s y cuántas vueltas dio?
<details><summary>Respuesta</summary><p>ω = 10 rad/s; θ = ½(2)(25) = 25 rad = 3.98 vueltas.</p></details></li>
<li><span class="lvl">Problema</span>Halle el momento de inercia de dos masas de 2 kg unidas por una varilla liviana de 1 m, respecto a un eje perpendicular por el centro y por un extremo.
<details><summary>Respuesta</summary><p>Centro: \(2(2)(0.5)^2=1.0\) kg·m². Extremo: \(2(1)^2=2.0\) kg·m² (ejes paralelos: \(1.0+4(0.5)^2=2.0\)).</p></details></li>
<li><span class="lvl">Problema</span>Un disco de 2 kg y 10 cm de radio gira a 300 rpm. ¿Qué energía cinética de rotación tiene?
<details><summary>Respuesta</summary><p>\(I=0.01\) kg·m², \(\omega=31.4\) rad/s, \(K=\tfrac12I\omega^2=4.9\) J.</p></details></li>
</ol>
</section>
