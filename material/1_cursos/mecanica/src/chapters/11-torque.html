<template class="chapter-src" data-id="torque" data-num="12" data-title="Dinámica de la rotación" data-part="Parte V · Rotación y equilibrio" data-short="Torque, segunda ley para la rotación, trabajo y potencia rotacional, rodar con y sin deslizar">
<p class="lead">Para abrir una puerta no basta empujar fuerte: importa dónde y en qué dirección se empuja. El efecto de giro de una fuerza se llama torque, y cumple en la rotación el papel que la fuerza cumple en la traslación. Con él se entiende por qué una llave larga afloja tornillos, cómo baja una cubeta a un pozo y por qué una bola de boliche empieza deslizando y termina rodando.</p>

<div class="keyideas"><ul>
<li>El torque de una fuerza respecto a un eje es \(\tau=rF\sen\phi=r_\perp F\): fuerza por brazo de palanca.</li>
<li>Segunda ley para la rotación: \(\sum\tau=I\alpha\). A mayor momento de inercia, menor aceleración angular con el mismo torque.</li>
<li>Una fuerza que actúa a lo largo de una línea que pasa por el eje no produce torque.</li>
<li>El trabajo de un torque es \(\tau\,\Delta\theta\) y su potencia \(P=\tau\omega\).</li>
<li>Al rodar sin deslizar, el punto de contacto está instantáneamente en reposo y la parte superior va al doble de la velocidad del centro.</li>
</ul></div>

<section>
<h2>Torque o momento de una fuerza</h2>
<p>Una fuerza \(\vb{F}\) aplicada en un punto situado a una distancia \(r\) del eje de giro tiende a hacer girar el cuerpo. Ese efecto, el <strong>torque</strong> (o momento de la fuerza), depende de tres cosas: la magnitud de la fuerza, la distancia al eje y el ángulo \(\phi\) entre \(\vb{r}\) y \(\vb{F}\):</p>
<div class="eq key" data-name="Torque">\[\tau=r\,F\sen\phi=r_\perp F=r\,F_\perp,\qquad \vb{\tau}=\vb{r}\times\vb{F}\quad[\text{N·m}].\]</div>
<p>El <strong>brazo de palanca</strong> \(r_\perp=r\sen\phi\) es la distancia perpendicular del eje a la línea de acción de la fuerza. Sólo la componente de la fuerza perpendicular a \(\vb{r}\) hace girar; la componente a lo largo de \(\vb{r}\) sólo empuja contra el eje. Por convención, el torque es positivo si tiende a producir giro antihorario. Vectorialmente, \(\vb{\tau}=\vb{r}\times\vb{F}\) apunta a lo largo del eje, según la regla de la mano derecha (capítulo 2).</p>
<div class="box warn">
<p><strong>Torque y energía no son lo mismo, aunque ambos se midan en N·m.</strong> Para el torque se escribe N·m y nunca joules: no es un trabajo, sino una fuerza por una distancia perpendicular.</p>
</div>
<div class="sim" data-sim="torque-llave" data-title="Torque: la llave, la puerta y el pedal"></div>
<div class="sim-guide"><ul>
<li>Con la llave, duplique la distancia al tornillo: el torque se duplica con la misma fuerza. Por eso los mecánicos usan un tubo para “alargar” la llave.</li>
<li>Incline la fuerza: sólo cuenta su componente perpendicular. A 0° el torque es nulo aunque la fuerza sea enorme.</li>
<li>En el pedal, el torque es máximo con la biela horizontal y nulo cuando está vertical (“punto muerto”).</li>
</ul></div>

<section>
<h2>Segunda ley de Newton para la rotación</h2>
<p>Una fuerza tangencial \(F_t\) sobre una partícula de masa \(m\) a distancia \(r\) le produce \(F_t=ma_t=m r\alpha\); multiplicando por \(r\), \(\tau=mr^2\alpha\). Sumando sobre todas las partículas de un cuerpo rígido se obtiene</p>
<div class="eq key" data-name="Segunda ley para la rotación">\[\sum\tau_{\text{ext}}=I\,\alpha .\]</div>
<p>Es la versión rotacional de \(\sum F=ma\): el torque neto produce aceleración angular, y el momento de inercia es la resistencia a esa aceleración. Los torques internos se cancelan por pares (tercera ley).</p>
<h3>Cuerpos que cuelgan de una polea con masa</h3>
<p>Si una cubeta de masa \(m\) cuelga de una cuerda enrollada en un cilindro de radio \(R\) y momento de inercia \(I\), se escriben dos ecuaciones: \(mg-T=ma\) para la cubeta y \(TR=I\alpha\) para el cilindro, con \(a=\alpha R\) (la cuerda no desliza). Resolviendo,</p>
<div class="eq">\[a=\frac{g}{1+\dfrac{I}{mR^2}},\qquad T=\frac{mg}{1+\dfrac{mR^2}{I}} .\]</div>
<p>Si el cilindro no tuviera masa, la cubeta caería libremente (\(a=g\), \(T=0\)). La inercia del cilindro frena la caída y la cuerda queda tensa.</p>
<div class="sim" data-sim="polea-masa" data-title="Polea con masa: la cubeta del pozo, Atwood y el yoyo"></div>
<div class="sim-guide"><ul>
<li>Aumente la masa del cilindro: la cubeta cae con menor aceleración y la tensión crece.</li>
<li>Las barras de energía muestran que parte de la energía potencial se va en hacer girar la polea.</li>
<li>En el yoyo, un eje interior delgado (\(r\) pequeño) hace que baje lentamente: casi toda la energía se va en rotación.</li>
</ul></div>
<div class="box ex">
<h4>La cubeta del pozo</h4>
<p>Una cubeta de 5.0 kg cuelga de una cuerda enrollada en un cilindro macizo de 10 kg y 15 cm de radio que gira sin fricción. Halle la aceleración de la cubeta y la tensión.</p>
<details><summary>Solución</summary>
<p>\(I=\tfrac12(10)(0.15)^2=0.1125\) kg·m² y \(I/R^2=5.0\) kg. Entonces \(a=\dfrac{5.0(9.8)}{5.0+5.0}=4.9\) m/s² y \(T=m(g-a)=24.5\) N.</p>
<p><button class="try" type="button" data-try="polea-masa:pozo">Probar en la simulación</button></p>
</details>
</div>
</section>

<section>
<h2>Trabajo y potencia en la rotación</h2>
<p>Una fuerza tangencial que empuja el borde de una rueda a lo largo de un arco \(\dd s=R\,\dd\theta\) realiza un trabajo \(F\,\dd s=(FR)\,\dd\theta\). Por tanto:</p>
<div class="eq key" data-name="Trabajo y potencia rotacionales">\[W=\int\tau\,\dd\theta,\qquad P=\tau\,\omega,\qquad W_{\text{neto}}=\Delta\left(\tfrac12I\omega^2\right).\]</div>
<p>La expresión \(P=\tau\omega\) explica las cajas de cambios: un motor entrega potencia a cierta rapidez angular; con una relación de engranajes se puede reducir ω para aumentar el torque en las ruedas (para arrancar o subir una pendiente) o al revés (para ir rápido en plano).</p>

<section>
<h2>Rodar y deslizar: la bola de boliche</h2>
<p>Un objeto rueda sin deslizar cuando su punto de contacto no se desliza sobre el piso: \(v_{\text{cm}}=\omega R\). Si se lanza una bola deslizando y sin girar, el punto de contacto patina hacia adelante y la fricción cinética actúa hacia atrás. Esa misma fuerza hace dos cosas a la vez:</p>
<ul>
<li>frena el centro de masa: \(m\,a=-\mu_kmg\);</li>
<li>produce un torque que hace girar la bola cada vez más rápido: \(I\alpha=\mu_kmg\,R\).</li>
</ul>
<p>Cuando \(v=\omega R\) cesa el deslizamiento y la bola sigue rodando sin fricción cinética. Para una esfera sólida que parte con \(v_0\) y sin giro, la velocidad final es</p>
<div class="eq">\[v_f=\frac{5}{7}\,v_0,\qquad t=\frac{2v_0}{7\mu_kg},\]</div>
<p>y durante el deslizamiento se disipan 2/7 de la energía cinética inicial.</p>
<div class="sim" data-sim="bola-boliche" data-title="Una bola que desliza hasta rodar: fricción, torque y energía"></div>
<div class="sim-guide"><ul>
<li>Las gráficas de \(v\) y \(\omega R\) se acercan hasta coincidir: en ese momento la bola empieza a rodar sin deslizar.</li>
<li>Con “efecto” hacia atrás (retroceso del billar), la bola se detiene y regresa.</li>
<li>Con efecto hacia adelante mayor que la velocidad, la fricción acelera la bola.</li>
</ul></div>
<h3>¿Qué tan rápido se mueve cada punto de una rueda?</h3>
<p>En una rueda que rueda sin deslizar, la velocidad de cada punto es la suma de la velocidad del centro y la debida a la rotación. El punto de contacto tiene velocidad cero en ese instante; el centro va a \(v\) y el punto más alto a \(2v\). Todo ocurre como si la rueda girara alrededor del punto de contacto, el <strong>centro instantáneo de rotación</strong>. Un punto del borde describe una curva llamada <strong>cicloide</strong>.</p>
<div class="sim" data-sim="cicloide" data-title="La rueda que rueda: velocidades de sus puntos y la cicloide"></div>
<div class="sim-guide"><ul>
<li>Observe que la flecha del punto de contacto desaparece: está en reposo instantáneo. La del punto más alto es el doble que la del centro.</li>
<li>Con \(r\gt R\) (la pestaña de la rueda de un tren), la parte baja del punto se mueve hacia atrás.</li>
</ul></div>

<section>
<h2>Preguntas y problemas</h2>
<ol class="problems">
<li><span class="lvl">Concepto</span>¿Puede una fuerza grande producir un torque nulo? ¿Puede una fuerza pequeña producir un torque grande?
<details><summary>Respuesta</summary><p>Sí a ambas: si la línea de acción pasa por el eje el torque es cero; con un brazo de palanca muy largo, una fuerza pequeña produce un torque grande.</p></details></li>
<li><span class="lvl">Concepto</span>¿Por qué los bailarines y patinadores giran con los brazos pegados al cuerpo para dar muchas vueltas?
<details><summary>Respuesta</summary><p>Con los brazos recogidos su momento de inercia es menor; se verá en el capítulo 13 que, al conservarse el momento angular, su ω aumenta.</p></details></li>
<li><span class="lvl">Problema</span>Se aplica una fuerza de 80 N en el extremo de una llave de 25 cm, formando 60° con la llave. ¿Cuál es el torque?
<details><summary>Respuesta</summary><p>\(\tau=0.25(80)\sen60^\circ=17.3\) N·m.</p></details></li>
<li><span class="lvl">Problema</span>Un disco de 2 kg y 20 cm de radio recibe un torque constante de 0.8 N·m partiendo del reposo. ¿Qué rapidez angular tiene a los 3 s? ¿Qué trabajo se hizo?
<details><summary>Respuesta</summary><p>\(I=0.04\) kg·m², \(\alpha=20\) rad/s², \(\omega=60\) rad/s, \(W=\tfrac12I\omega^2=72\) J.</p></details></li>
<li><span class="lvl">Problema</span>Una esfera sólida baja rodando sin deslizar una rampa de 30°. ¿Qué aceleración tiene? ¿Qué fuerza de fricción la hace girar si su masa es 2 kg?
<details><summary>Respuesta</summary><p>\(a=g\sen30^\circ/1.4=3.5\) m/s². Fricción: \(f=mg\sen\theta-ma=9.8-7.0=2.8\) N, hacia arriba del plano.</p></details></li>
</ol>
