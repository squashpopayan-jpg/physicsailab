<template class="chapter-src" data-id="fluidos" data-num="15" data-title="Mecánica de fluidos" data-part="Parte VI · Gravitación y fluidos" data-short="Densidad y presión, hidrostática, principio de Pascal, flotación de Arquímedes, continuidad, Bernoulli y Torricelli">
<p class="lead">Respiramos aire, nadamos en agua y la sangre circula por nuestras venas: vivimos rodeados de fluidos. Con sólo dos ideas, que la presión aumenta con la profundidad y que la energía se conserva, se explica por qué flotan los barcos de acero, cómo un gato hidráulico levanta un automóvil y por qué sale más rápido el agua de una manguera cuando se tapa la boquilla con el dedo.</p>

<div class="keyideas"><ul>
<li>La presión es fuerza por unidad de área, \(P=F/A\); en un fluido actúa en todas las direcciones y siempre perpendicular a las superficies.</li>
<li>En un fluido en reposo la presión aumenta con la profundidad: \(P=P_0+\rho g h\). No depende de la forma del recipiente.</li>
<li>Una presión aplicada a un fluido encerrado se transmite igual a todos sus puntos (Pascal): así funcionan las prensas y los frenos hidráulicos.</li>
<li>Todo cuerpo sumergido recibe un empuje hacia arriba igual al peso del fluido que desaloja (Arquímedes).</li>
<li>En un fluido que fluye, \(Av\) es constante (continuidad) y \(P+\tfrac12\rho v^2+\rho g y\) también (Bernoulli): donde el fluido va más rápido, la presión es menor.</li>
</ul></div>

<section>
<h2>Densidad y presión</h2>
<p>Un <strong>fluido</strong> es una sustancia que fluye: no resiste los esfuerzos de corte y toma la forma del recipiente. Los líquidos son casi incompresibles; los gases se comprimen con facilidad. Para describirlos se usan cantidades “por unidad”: la densidad y la presión.</p>
<div class="eq key" data-name="Densidad y presión">\[\rho=\frac{m}{V}\quad[\text{kg/m}^3],\qquad P=\frac{F_\perp}{A}\quad[\text{Pa}=\text{N/m}^2].\]</div>
<div class="tablewrap narrow"><table>
<thead><tr><th>Sustancia</th><th class="c">Densidad (kg/m³)</th><th>Sustancia</th><th class="c">Densidad (kg/m³)</th></tr></thead>
<tbody>
<tr><td>Aire (20 °C, nivel del mar)</td><td class="num c">1.20</td><td>Hielo</td><td class="num c">917</td></tr>
<tr><td>Helio</td><td class="num c">0.18</td><td>Sangre</td><td class="num c">1060</td></tr>
<tr><td>Gasolina</td><td class="num c">≈ 720</td><td>Aluminio</td><td class="num c">2700</td></tr>
<tr><td>Aceite de cocina</td><td class="num c">≈ 920</td><td>Hierro y acero</td><td class="num c">7870</td></tr>
<tr><td>Agua</td><td class="num c">1000</td><td>Mercurio</td><td class="num c">13 600</td></tr>
<tr><td>Agua de mar</td><td class="num c">1025</td><td>Oro</td><td class="num c">19 300</td></tr>
</tbody></table></div>
<p>La presión de la atmósfera al nivel del mar es \(P_0=1\un{atm}=1.013\times10^5\) Pa \(=760\) mmHg \(\approx14.7\) lb/in². Los manómetros de las llantas o de la tensión arterial miden la <strong>presión manométrica</strong>, la diferencia respecto a la atmosférica: \(P_{\text{man}}=P-P_0\).</p>
<div class="box ex">
<h4>El tacón y el elefante</h4>
<p>Una persona de 60 kg se apoya un instante sobre el tacón de un zapato (área 1.0 cm²). Un elefante de 5000 kg se apoya en sus cuatro patas (0.12 m² cada una). ¿Quién presiona más el piso?</p>
<details><summary>Solución</summary>
<p>Tacón: \(P=\dfrac{588}{1.0\times10^{-4}}=5.9\times10^6\) Pa. Elefante: \(P=\dfrac{49\,000}{0.48}=1.0\times10^5\) Pa. El tacón ejerce casi 60 veces más presión: por eso marca los pisos de madera y un elefante no.</p>
</details>
</div>
<div class="daily">
<h4>En la vida cotidiana</h4>
<div class="daily-grid">
<div class="dcard"><b>Cuchillos afilados</b><p>El filo tiene un área minúscula: la misma fuerza produce una presión enorme que corta. Un cuchillo romo reparte la fuerza en más área.</p></div>
<div class="dcard"><b>Raquetas de nieve</b><p>Reparten el peso en un área grande; la presión sobre la nieve baja y uno no se hunde.</p></div>
<div class="dcard"><b>La tensión arterial</b><p>“120 sobre 80” significa una presión manométrica máxima de 120 mmHg (16 kPa) y mínima de 80 mmHg (11 kPa) en la arteria del brazo.</p></div>
</div>
</div>

<section>
<h2>Presión en un fluido en reposo</h2>
<p>Considere una columna de fluido de altura \(h\) y base \(A\). Para que esté en equilibrio, la fuerza de abajo hacia arriba debe sostener la fuerza de arriba más el peso de la columna: \(PA=P_0A+\rho(Ah)g\). Por tanto,</p>
<div class="eq key" data-name="Presión hidrostática">\[P=P_0+\rho\,g\,h .\]</div>
<p>La presión crece linealmente con la profundidad y es la misma en todos los puntos a la misma profundidad de un fluido en reposo y conectado, <em>sin importar la forma del recipiente</em> (paradoja hidrostática). En el agua, cada 10.3 m de profundidad añaden una atmósfera. En un punto dado, la presión empuja por igual en todas las direcciones.</p>
<div class="sim" data-sim="presion-hidrostatica" data-title="La presión aumenta con la profundidad"></div>
<div class="sim-guide"><ul>
<li>Arrastre el sensor: la presión sólo depende de la profundidad, no de la posición horizontal.</li>
<li>En «Vasos comunicantes», recipientes de formas distintas llenos hasta el mismo nivel tienen la misma presión en el fondo.</li>
<li>Con dos líquidos (aceite sobre agua) la recta de la gráfica cambia de pendiente en la interfaz: la pendiente es \(\rho g\).</li>
</ul></div>
<div class="box ex">
<h4>Buceo a 30 m</h4>
<p>¿Qué presión soporta un buzo a 30 m de profundidad en el mar? ¿Cuántas veces la atmosférica?</p>
<details><summary>Solución</summary>
<p>\(P=1.013\times10^5+(1025)(9.8)(30)=1.013\times10^5+3.01\times10^5=4.0\times10^5\) Pa: unas 4 atmósferas. El aire de sus pulmones se comprime a la cuarta parte; por eso el buzo nunca debe subir conteniendo la respiración.</p>
<p><button class="try" type="button" data-try="presion-hidrostatica:buzo">Probar en la simulación</button></p>
</details>
</div>
<h3>Medir la presión: barómetros y manómetros</h3>
<p>En 1643 Evangelista Torricelli llenó de mercurio un tubo cerrado por un extremo y lo invirtió en una cubeta: el mercurio bajó hasta quedar a 760 mm sobre la superficie, dejando vacío arriba. La atmósfera sostiene esa columna: \(P_0=\rho_{\text{Hg}}\,g\,h=(13\,600)(9.8)(0.760)=1.01\times10^5\) Pa. Con agua, la columna mediría 10.3 m. La presión atmosférica disminuye con la altura: en ciudades de montaña como Bogotá (2600 m) vale unos 75 kPa, y el agua hierve cerca de 92 °C.</p>
<div class="daily">
<h4>En la vida cotidiana</h4>
<div class="daily-grid">
<div class="dcard"><b>Las represas</b><p>Son mucho más gruesas abajo que arriba: la presión del agua sobre el muro crece con la profundidad.</p></div>
<div class="dcard"><b>El suero en el hospital</b><p>La bolsa se cuelga alto para que la presión \(\rho gh\) supere la presión de la vena; si se baja demasiado, la sangre sube por el tubo.</p></div>
<div class="dcard"><b>Oídos que “se tapan”</b><p>Al bajar en avión o al bucear, la presión exterior aumenta y empuja el tímpano hacia adentro; tragar abre la trompa de Eustaquio e iguala las presiones.</p></div>
<div class="dcard"><b>El nivel del agua</b><p>Los albañiles usan una manguera transparente con agua: en sus dos extremos el agua queda a la misma altura, lo que permite marcar puntos a nivel en paredes lejanas.</p></div>
</div>
</div>

<section>
<h2>El principio de Pascal</h2>
<div class="box law">
<h4>Principio de Pascal</h4>
<p>Un cambio de presión aplicado a un fluido encerrado se transmite sin disminuir a todos los puntos del fluido y a las paredes del recipiente.</p>
</div>
<p>En una <strong>prensa hidráulica</strong>, una fuerza pequeña \(F_1\) sobre un pistón de área \(A_1\) produce la presión \(P=F_1/A_1\), que actúa también sobre un pistón grande de área \(A_2\):</p>
<div class="eq key" data-name="Prensa hidráulica">\[F_2=P\,A_2=F_1\,\frac{A_2}{A_1},\qquad d_2=d_1\,\frac{A_1}{A_2}.\]</div>
<p>La fuerza se multiplica por \(A_2/A_1\), pero no se obtiene energía gratis: como el volumen de líquido que sale de un cilindro entra al otro, el pistón grande sube una distancia \(A_1/A_2\) veces menor. El trabajo de entrada \(F_1d_1\) es igual al de salida \(F_2d_2\).</p>
<div class="sim" data-sim="pascal" data-title="La prensa hidráulica: un gato que levanta un automóvil"></div>
<div class="sim-guide"><ul>
<li>Con la fuerza justa \(F_1=mg\,A_1/A_2\), cada bombeo levanta la carga una altura pequeña.</li>
<li>Compare el trabajo hecho en el pistón pequeño con la energía potencial que gana la carga: son iguales.</li>
<li>Si la fuerza aplicada es menor que la necesaria, el pistón pequeño no baja y la carga no sube.</li>
</ul></div>
<div class="box ex">
<h4>El elevador del taller</h4>
<p>En un elevador de automóviles, el pistón pequeño tiene 5.0 cm de diámetro y el grande 30 cm. ¿Qué fuerza hay que aplicar para levantar un auto de 1500 kg? ¿Cuánto sube el auto si el pistón pequeño baja 20 cm?</p>
<details><summary>Solución</summary>
<p>\(A_2/A_1=(30/5.0)^2=36\). \(F_1=(1500)(9.8)/36=408\) N. El auto sube \(20/36=0.56\) cm por cada embolada: hacen falta unas 180 emboladas para levantarlo 1 m.</p>
<p><button class="try" type="button" data-try="pascal:elevador">Probar en la simulación</button></p>
</details>
</div>
<div class="daily">
<h4>En la vida cotidiana</h4>
<div class="daily-grid">
<div class="dcard"><b>Los frenos del automóvil</b><p>El pedal empuja un pistón pequeño en la bomba de freno; el líquido transmite la presión a pistones más grandes en las ruedas, que aprietan las pastillas contra los discos.</p></div>
<div class="dcard"><b>Retroexcavadoras y grúas</b><p>Sus brazos se mueven con cilindros hidráulicos alimentados por una bomba: fuerzas de decenas de toneladas controladas con palancas.</p></div>
<div class="dcard"><b>La silla del barbero</b><p>Cada vez que se bombea el pedal, el sillón sube un poco: es una prensa hidráulica con válvulas que impiden que el líquido regrese.</p></div>
</div>
</div>
</section>

<section>
<h2>El principio de Arquímedes: flotación</h2>
<p>La presión en la cara inferior de un cuerpo sumergido es mayor que en la superior, así que el fluido lo empuja hacia arriba. La fuerza neta, el <strong>empuje</strong>, no depende del material del cuerpo sino sólo del volumen sumergido:</p>
<div class="box law">
<h4>Principio de Arquímedes</h4>
<p>Todo cuerpo sumergido total o parcialmente en un fluido recibe una fuerza vertical hacia arriba igual al peso del fluido desalojado:</p>
<div class="eq">\[B=\rho_{\text{fluido}}\,V_{\text{sum}}\,g .\]</div>
</div>
<p>Si el cuerpo es más denso que el fluido, se hunde; si es menos denso, sube y flota con sólo una parte sumergida, de modo que el empuje iguale su peso:</p>
<div class="eq key" data-name="Fracción sumergida de un cuerpo que flota">\[\rho_{\text{fluido}}\,V_{\text{sum}}\,g=\rho_{\text{cuerpo}}\,V\,g\quad\Rightarrow\quad\frac{V_{\text{sum}}}{V}=\frac{\rho_{\text{cuerpo}}}{\rho_{\text{fluido}}}.\]</div>
<p>Un cuerpo sumergido colgado de un dinamómetro parece pesar menos: su <strong>peso aparente</strong> es \(w-B\).</p>
<div class="sim" data-sim="arquimedes" data-title="El empuje de Arquímedes: peso aparente y flotación"></div>
<div class="sim-guide"><ul>
<li>Sumerja el bloque poco a poco: el dinamómetro marca menos a medida que aumenta el volumen sumergido; una vez sumergido del todo, la lectura ya no cambia con la profundidad.</li>
<li>Corte el hilo: si el cuerpo es menos denso que el líquido, flota con la fracción \(\rho_c/\rho_f\) bajo la superficie.</li>
<li>Cambie el líquido: ¡un bloque de hierro flota en mercurio!</li>
</ul></div>
<div class="box ex">
<h4>La punta del iceberg</h4>
<p>¿Qué fracción de un iceberg (\(\rho=917\) kg/m³) queda bajo el agua de mar (\(\rho=1025\) kg/m³)?</p>
<details><summary>Solución</summary>
<p>\(V_{\text{sum}}/V=917/1025=0.895\): casi el 90 % está sumergido y sólo se ve la “punta”, alrededor del 10 %.</p>
<p><button class="try" type="button" data-try="arquimedes:iceberg">Probar en la simulación</button></p>
</details>
</div>
<div class="box hist">
<p>Cuenta la tradición que el rey Hierón de Siracusa encargó una corona de oro y sospechó que el orfebre la había mezclado con plata. Arquímedes la comparó con una masa igual de oro puro: si la corona tenía plata, ocuparía más volumen, desalojaría más agua y en ella “pesaría” menos que el oro. Según la leyenda, la idea se le ocurrió en el baño y salió gritando <em>¡eureka!</em></p>
<p><button class="try" type="button" data-try="arquimedes:corona">Pesar la corona en la simulación</button></p>
</div>
<div class="daily">
<h4>En la vida cotidiana</h4>
<div class="daily-grid">
<div class="dcard"><b>Barcos de acero</b><p>El casco hueco desaloja un volumen enorme de agua: el barco se hunde hasta que el peso del agua desalojada iguala su propio peso. Cargado, se hunde más: la línea de flotación lo indica.</p></div>
<div class="dcard"><b>Flotar en el mar Muerto</b><p>Su agua es tan salada (unos 1240 kg/m³) que un cuerpo humano (≈ 1000 kg/m³) flota con casi la quinta parte de su volumen fuera del agua.</p></div>
<div class="dcard"><b>Globos aerostáticos</b><p>El aire caliente es menos denso que el frío: el empuje del aire exterior sobre el globo supera su peso total.</p></div>
<div class="dcard"><b>Submarinos y peces</b><p>El submarino llena o vacía tanques de lastre; muchos peces inflan o desinflan una vejiga natatoria para ajustar su densidad media.</p></div>
</div>
</div>

<section>
<h2>Fluidos en movimiento: continuidad y Bernoulli</h2>
<p>Consideremos un <strong>fluido ideal</strong>: incompresible, sin viscosidad y con flujo estacionario (la velocidad en cada punto no cambia con el tiempo). Como el fluido no se acumula, el volumen que entra por una sección en cada segundo es el mismo que sale por cualquier otra. El <strong>caudal</strong> \(Q\) (m³/s) se conserva:</p>
<div class="eq key" data-name="Ecuación de continuidad">\[Q=A_1v_1=A_2v_2 .\]</div>
<p>Donde el tubo se estrecha, el fluido va más rápido. Al acelerarse, algo tiene que empujarlo: la presión detrás debe ser mayor que la de adelante. Aplicando el teorema del trabajo y la energía a una porción de fluido, Daniel Bernoulli obtuvo (1738)</p>
<div class="eq key" data-name="Ecuación de Bernoulli">\[P+\tfrac12\rho v^2+\rho g y=\text{constante a lo largo de una línea de corriente}.\]</div>
<p>Cada término es una energía por unidad de volumen: \(P\) (trabajo de la presión), \(\tfrac12\rho v^2\) (energía cinética) y \(\rho gy\) (energía potencial). Si el tubo es horizontal, <strong>donde la rapidez es mayor, la presión es menor</strong>.</p>
<div class="sim" data-sim="bernoulli" data-title="Tubo de Venturi: continuidad y Bernoulli"></div>
<div class="sim-guide"><ul>
<li>Los tubitos verticales funcionan como manómetros: la columna es más baja en el estrechamiento, donde el agua va más rápido.</li>
<li>En la gráfica, las tres energías por volumen cambian a lo largo del tubo, pero su suma se mantiene constante.</li>
<li>Aumente mucho el caudal: la presión en el estrechamiento puede bajar hasta cero y aparece la cavitación (el agua hierve en frío).</li>
</ul></div>
<div class="box ex">
<h4>El medidor de Venturi</h4>
<p>Por un tubo horizontal de 10 cm de diámetro fluye agua a 2.0 m/s. En un estrechamiento de 5.0 cm de diámetro, ¿cuál es la rapidez? ¿Cuánto baja la presión?</p>
<details><summary>Solución</summary>
<p>\(v_2=v_1(D_1/D_2)^2=2.0(4)=8.0\) m/s. \(P_1-P_2=\tfrac12\rho(v_2^2-v_1^2)=\tfrac12(1000)(64-4)=3.0\times10^4\) Pa: las columnas de los manómetros difieren en \(3.0\times10^4/(1000\cdot9.8)=3.1\) m.</p>
<p><button class="try" type="button" data-try="bernoulli:venturi">Probar en la simulación</button></p>
</details>
</div>
<div class="box warn">
<p><strong>¿Por qué vuela un avión?</strong> Un ala desvía hacia abajo el aire que pasa a su alrededor; por la tercera ley, el aire empuja el ala hacia arriba. Al mismo tiempo, el aire se acelera sobre la cara superior y su presión baja, como predice Bernoulli: son dos descripciones del mismo fenómeno. En cambio, es <em>falsa</em> la explicación de que el aire de arriba “debe llegar al mismo tiempo” que el de abajo: en realidad llega antes.</p>
</div>
<div class="daily">
<h4>En la vida cotidiana</h4>
<div class="daily-grid">
<div class="dcard"><b>El dedo en la manguera</b><p>Al tapar parcialmente la salida se reduce el área; como el caudal casi no cambia, el chorro sale más rápido y llega más lejos.</p></div>
<div class="dcard"><b>Techos que se levantan</b><p>Con vientos fuertes el aire pasa muy rápido sobre el techo y la presión afuera baja; la presión normal del interior empuja el techo hacia arriba.</p></div>
<div class="dcard"><b>El atomizador y el aerógrafo</b><p>Un chorro rápido de aire pasa sobre un tubito sumergido en el líquido; la baja presión hace subir el líquido, que se pulveriza.</p></div>
<div class="dcard"><b>Camiones que “jalan”</b><p>Cuando un camión rebasa a un ciclista, el aire entre ambos va más rápido y su presión baja: el ciclista siente un tirón hacia el camión.</p></div>
</div>
</div>
</section>

<section>
<h2>El teorema de Torricelli y la viscosidad</h2>
<p>Un tanque abierto tiene un orificio pequeño a una profundidad \(h\) bajo la superficie. Aplicando Bernoulli entre la superficie (presión \(P_0\), rapidez casi nula) y el chorro (presión \(P_0\)), la rapidez de salida es la misma que la de un objeto que cae desde una altura \(h\):</p>
<div class="eq key" data-name="Teorema de Torricelli">\[v=\sqrt{2\,g\,h}.\]</div>
<p>A medida que el tanque se vacía, \(h\) disminuye y el chorro se debilita. Si el orificio está a una altura \(y\) sobre el suelo, el chorro horizontal describe una parábola y llega a una distancia \(x=v\sqrt{2y/g}=2\sqrt{hy}\).</p>
<div class="sim" data-sim="torricelli" data-title="Un tanque que se vacía: el teorema de Torricelli"></div>
<div class="sim-guide"><ul>
<li>El chorro del agujero más profundo sale más rápido; pero el que llega más lejos es el del agujero a media altura, si el tanque está sobre el suelo.</li>
<li>Observe que el nivel baja cada vez más despacio: la rapidez de salida depende de \(\sqrt h\).</li>
</ul></div>
<div class="box ex">
<h4>Una botella agujereada</h4>
<p>Una botella con agua hasta 30 cm tiene un agujero a 10 cm del fondo y está sobre una mesa de 80 cm. ¿Con qué rapidez sale el agua? ¿A qué distancia horizontal cae al piso?</p>
<details><summary>Solución</summary>
<p>\(h=0.20\) m: \(v=\sqrt{2(9.8)(0.20)}=1.98\) m/s. El agujero está a \(y=0.90\) m del piso: \(x=2\sqrt{(0.20)(0.90)}=0.85\) m.</p>
<p><button class="try" type="button" data-try="torricelli:botella">Probar en la simulación</button></p>
</details>
</div>
<h3>Viscosidad</h3>
<p>Los fluidos reales tienen <strong>viscosidad</strong>: un rozamiento interno entre capas que se mueven a distinta rapidez. La miel es unas 10 000 veces más viscosa que el agua. En un tubo, la capa junto a la pared está quieta y la del centro va más rápido. Para mantener el flujo hace falta una diferencia de presión, y según la ley de Poiseuille el caudal es proporcional a la cuarta potencia del radio del tubo: si una arteria se estrecha un 10 %, el caudal de sangre cae un 34 % con la misma presión. Por eso las obstrucciones arteriales son tan graves y el corazón debe trabajar más.</p>
</section>

<section>
<h2>Preguntas y problemas</h2>
<ol class="problems">
<li><span class="lvl">Concepto</span>Tres recipientes de formas distintas se llenan de agua hasta la misma altura. ¿En cuál es mayor la presión en el fondo? ¿Y la fuerza sobre el fondo?
<details><summary>Respuesta</summary><p>La presión es la misma en los tres (\(P_0+\rho gh\)). La fuerza sobre el fondo es \(PA\): es mayor en el que tiene el fondo de mayor área, aunque contenga menos agua.</p></details></li>
<li><span class="lvl">Concepto</span>Un vaso con agua tiene un cubo de hielo flotando. Cuando el hielo se derrite, ¿sube, baja o se mantiene el nivel del agua?
<details><summary>Respuesta</summary><p>Se mantiene: el hielo flotante desaloja exactamente su peso en agua, que es el volumen de agua que produce al derretirse.</p></details></li>
<li><span class="lvl">Problema</span>¿Qué presión manométrica hay en el fondo de una piscina de 3.0 m de profundidad? ¿Qué fuerza ejerce el agua sobre una ventana circular de 30 cm de diámetro en el fondo?
<details><summary>Respuesta</summary><p>\(P_{\text{man}}=(1000)(9.8)(3.0)=2.94\times10^4\) Pa. \(F=P_{\text{man}}\,\pi(0.15)^2=2.1\times10^3\) N (el aire del otro lado equilibra la atmosférica).</p></details></li>
<li><span class="lvl">Problema</span>Un bloque de madera de 20 cm de lado flota en agua con 12 cm sumergidos. ¿Cuál es su densidad?
<details><summary>Respuesta</summary><p>\(\rho=1000(12/20)=600\) kg/m³.</p></details></li>
<li><span class="lvl">Problema</span>Una manguera de 2.0 cm de diámetro llena un balde de 10 L en 40 s. ¿Con qué rapidez sale el agua? Si se le pone una boquilla de 0.8 cm, ¿cuál es la nueva rapidez?
<details><summary>Respuesta</summary><p>\(Q=0.25\) L/s \(=2.5\times10^{-4}\) m³/s; \(v=Q/A=2.5\times10^{-4}/3.14\times10^{-4}=0.80\) m/s. Con la boquilla, \(v=0.80(2.0/0.8)^2=5.0\) m/s.</p></details></li>
<li><span class="lvl">Problema</span>Un tanque tiene agua hasta 2.0 m sobre un grifo. ¿Con qué rapidez sale el agua al abrirlo? ¿Cuánta agua sale por minuto si el orificio tiene 1.0 cm²?
<details><summary>Respuesta</summary><p>\(v=\sqrt{2(9.8)(2.0)}=6.3\) m/s; \(Q=(1.0\times10^{-4})(6.3)=6.3\times10^{-4}\) m³/s \(=38\) L/min (menos en la práctica, por la contracción del chorro y la viscosidad).</p></details></li>
