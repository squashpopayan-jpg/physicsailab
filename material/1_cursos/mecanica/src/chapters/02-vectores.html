<template class="chapter-src" data-id="vectores" data-num="2" data-title="Vectores" data-part="Parte I · Fundamentos" data-short="Escalares y vectores, componentes, suma y resta, productos escalar y vectorial">
<p class="lead">Muchas magnitudes de la mecánica no quedan bien descritas con un solo número: para saber a dónde llegó un excursionista, cómo empuja el viento a un avión o qué tan fuerte tiramos de una cuerda, hay que decir también <em>hacia dónde</em>. Los vectores son la herramienta matemática para manejar magnitud y dirección al mismo tiempo, y se usarán en todo el curso.</p>

<div class="keyideas"><ul>
<li>Un escalar tiene sólo magnitud (masa, tiempo, energía); un vector tiene magnitud y dirección (desplazamiento, velocidad, fuerza).</li>
<li>Todo vector del plano se describe con dos componentes: \(\vb{A}=A_x\ii+A_y\jj\).</li>
<li>Los vectores se suman punta con cola, o sumando componente a componente.</li>
<li>El producto escalar mide cuánto “se alinean” dos vectores; el vectorial, cuánto “se cruzan”.</li>
</ul></div>

<section>
<h2>Escalares y vectores</h2>
<p>Una <strong>cantidad escalar</strong> queda completamente especificada con un número y su unidad: la temperatura de hoy (18 °C), la masa de una maleta (23 kg), la duración de una clase (90 min). Una <strong>cantidad vectorial</strong> necesita además una dirección: no basta decir que un avión vuela a 800 km/h, hay que decir hacia dónde.</p>
<p>El ejemplo más sencillo es el <strong>desplazamiento</strong>. Si una persona camina 3 km hacia el este y luego 4 km hacia el norte, recorrió 7 km, pero terminó a sólo 5 km del punto de partida, en dirección noreste. El desplazamiento es la flecha que une el punto inicial con el final, sin importar el camino.</p>
<div class="box def">
<h4>Vector</h4>
<p>Un vector es una cantidad con magnitud y dirección que se suma según la regla del paralelogramo. Se representa con una flecha: su longitud es proporcional a la magnitud y su orientación indica la dirección. Se escribe con una flecha encima, \(\vb{A}\), y su magnitud como \(A=\abs{\vb{A}}\), que es siempre positiva.</p>
</div>
<p>Dos vectores son iguales si tienen la misma magnitud y la misma dirección, aunque estén dibujados en lugares distintos: un vector puede trasladarse paralelamente a sí mismo sin cambiar. El vector \(-\vb{A}\) tiene la misma magnitud que \(\vb{A}\) y dirección opuesta.</p>
<h3>Sistemas de coordenadas</h3>
<p>Para trabajar con números se usa un sistema de coordenadas. En el plano, un punto se ubica con coordenadas <strong>cartesianas</strong> \((x,y)\) o <strong>polares</strong> \((r,\theta)\), donde \(r\) es la distancia al origen y \(\theta\) el ángulo medido desde el eje \(+x\) en sentido antihorario:</p>
<div class="eq">\[x=r\cos\theta,\quad y=r\sen\theta\qquad\Longleftrightarrow\qquad r=\sqrt{x^2+y^2},\quad \tan\theta=\frac{y}{x}.\]</div>
</section>

<section>
<h2>Componentes y vectores unitarios</h2>
<p>Todo vector del plano se puede escribir como la suma de dos vectores paralelos a los ejes: sus <strong>componentes</strong>. Si \(\vb{A}\) forma un ángulo \(\theta\) con el eje \(+x\),</p>
<div class="eq key" data-name="Componentes de un vector">\[A_x=A\cos\theta,\qquad A_y=A\sen\theta,\qquad A=\sqrt{A_x^2+A_y^2},\qquad \theta=\tan^{-1}\!\frac{A_y}{A_x}\ (\text{revisando el cuadrante}).\]</div>
<p>Las componentes son números con signo: \(A_x\lt0\) si el vector apunta hacia la izquierda y \(A_y\lt0\) si apunta hacia abajo. Los <strong>vectores unitarios</strong> \(\ii\) y \(\jj\) tienen magnitud 1 y apuntan en los sentidos \(+x\) y \(+y\); con ellos</p>
<div class="eq">\[\vb{A}=A_x\,\ii+A_y\,\jj .\]</div>
<p>En tres dimensiones se agrega \(\kk\) en el sentido \(+z\). El vector unitario en la dirección de \(\vb{A}\) es \(\uv{A}=\vb{A}/A\).</p>
<div class="sim" data-sim="vector-comp" data-title="Componentes, magnitud y ángulo de un vector"></div>
<div class="sim-guide"><ul>
<li>Arrastre la punta del vector al segundo cuadrante: la calculadora da \(\tan^{-1}(A_y/A_x)\) negativo, pero el ángulo verdadero es ese valor más 180°.</li>
<li>Con el vector sobre un eje, una de las componentes es cero y la magnitud coincide con el valor absoluto de la otra.</li>
<li>El vector unitario (en gris) conserva la dirección pero siempre mide 1.</li>
</ul></div>
<div class="box warn">
<p><strong>La calculadora no conoce el cuadrante.</strong> Para \(\vb{A}=(-3,\,4)\), \(\tan^{-1}(4/-3)=-53.1^\circ\), que apunta al cuarto cuadrante. El vector está en el segundo: \(\theta=180^\circ-53.1^\circ=126.9^\circ\). Siempre dibuje el vector antes de calcular el ángulo.</p>
</div>
<div class="box ex">
<h4>Un dron que vuela al noroeste</h4>
<p>Un dron se desplaza 250 m en una dirección que forma 30° al norte del oeste. Halle las componentes de su desplazamiento (\(x\) hacia el este, \(y\) hacia el norte).</p>
<details><summary>Solución</summary>
<p>Medido desde \(+x\), el ángulo es \(\theta=180^\circ-30^\circ=150^\circ\). Entonces \(d_x=250\cos150^\circ=-217\) m y \(d_y=250\sen150^\circ=+125\) m: 217 m hacia el oeste y 125 m hacia el norte.</p>
<p><button class="try" type="button" data-try="vector-comp:dron">Probar en la simulación</button></p>
</details>
</div>
</section>

<section>
<h2>Suma y resta de vectores</h2>
<p>Los vectores no se suman como números: 3 km al este más 4 km al norte no dan 7 km, sino 5 km en dirección noreste. Hay dos formas equivalentes de sumarlos.</p>
<h3>Método gráfico</h3>
<ul>
<li><strong>Punta con cola:</strong> se dibuja \(\vb{A}\); en su punta se coloca la cola de \(\vb{B}\). La resultante \(\vb{R}=\vb{A}+\vb{B}\) va desde la cola de \(\vb{A}\) hasta la punta de \(\vb{B}\). Con más vectores se siguen encadenando.</li>
<li><strong>Paralelogramo:</strong> se dibujan \(\vb{A}\) y \(\vb{B}\) desde el mismo punto; la resultante es la diagonal del paralelogramo que forman.</li>
</ul>
<p>La suma es conmutativa (\(\vb{A}+\vb{B}=\vb{B}+\vb{A}\)) y asociativa. Para restar se suma el opuesto: \(\vb{A}-\vb{B}=\vb{A}+(-\vb{B})\).</p>
<h3>Método de componentes</h3>
<p>El método gráfico da intuición; el de componentes da precisión. Las componentes de la suma son las sumas de las componentes:</p>
<div class="eq key" data-name="Suma por componentes">\[\vb{R}=\vb{A}+\vb{B}\quad\Longleftrightarrow\quad R_x=A_x+B_x,\qquad R_y=A_y+B_y .\]</div>
<p>Luego se obtienen \(R=\sqrt{R_x^2+R_y^2}\) y su dirección. El procedimiento: (1) descomponer cada vector, (2) sumar las \(x\) por un lado y las \(y\) por otro, (3) reconstruir magnitud y ángulo.</p>
<div class="sim" data-sim="vector-suma" data-title="Suma y resta de vectores: tres métodos"></div>
<div class="sim-guide"><ul>
<li>Arrastre las puntas de \(\vb{A}\) y \(\vb{B}\). Cambie entre los tres métodos: la resultante es siempre la misma.</li>
<li>Con “Tira y afloja”, los vectores son opuestos: la resultante es la diferencia de magnitudes. ¿Cuándo es máxima la magnitud de \(\vb{A}+\vb{B}\)? ¿Cuándo es mínima?</li>
<li>Pruebe la resta: \(\vb{A}-\vb{B}\) es el vector que va de la punta de \(\vb{B}\) a la punta de \(\vb{A}\).</li>
</ul></div>
<div class="box ex">
<h4>El avión y el viento</h4>
<p>Un avión mantiene una velocidad de 220 km/h hacia el norte respecto al aire, y el viento sopla a 60 km/h hacia el este. ¿Cuál es la velocidad del avión respecto al suelo?</p>
<details><summary>Solución</summary>
<p>\(\vb{v}=60\,\ii+220\,\jj\) km/h. Magnitud: \(\sqrt{60^2+220^2}=228\) km/h. Dirección: \(\tan^{-1}(60/220)=15.3^\circ\) al este del norte. El piloto que quiera llegar a un punto exactamente al norte debe apuntar un poco hacia el oeste (capítulo 4).</p>
<p><button class="try" type="button" data-try="vector-suma:avion">Probar en la simulación</button></p>
</details>
</div>

<section>
<h2>Producto escalar y producto vectorial</h2>
<p>Hay dos maneras útiles de “multiplicar” dos vectores. Ambas aparecerán más adelante: el producto escalar en el trabajo de una fuerza (capítulo 8) y el vectorial en el torque y el momento angular (capítulos 12 y 13).</p>
<h3>Producto escalar (o producto punto)</h3>
<div class="eq key" data-name="Producto escalar">\[\vb{A}\cdot\vb{B}=AB\cos\theta=A_xB_x+A_yB_y+A_zB_z .\]</div>
<p>El resultado es un <em>número</em>. Geométricamente es la magnitud de \(\vb{A}\) multiplicada por la proyección de \(\vb{B}\) sobre \(\vb{A}\). Es positivo si el ángulo entre los vectores es agudo, cero si son perpendiculares y negativo si el ángulo es obtuso. En particular \(\ii\cdot\ii=1\) e \(\ii\cdot\jj=0\).</p>
<h3>Producto vectorial (o producto cruz)</h3>
<div class="eq key" data-name="Producto vectorial">\[\abs{\vb{A}\times\vb{B}}=AB\sen\theta,\qquad \vb{A}\times\vb{B}=(A_yB_z-A_zB_y)\,\ii+(A_zB_x-A_xB_z)\,\jj+(A_xB_y-A_yB_x)\,\kk .\]</div>
<p>El resultado es un <em>vector</em> perpendicular al plano de \(\vb{A}\) y \(\vb{B}\). Su magnitud es el área del paralelogramo que forman, y su sentido se obtiene con la <strong>regla de la mano derecha</strong>: los dedos van de \(\vb{A}\) hacia \(\vb{B}\) por el ángulo menor y el pulgar indica el sentido de \(\vb{A}\times\vb{B}\). No es conmutativo: \(\vb{B}\times\vb{A}=-\vb{A}\times\vb{B}\). Para vectores del plano \(xy\), el producto apunta a lo largo de \(\pm\kk\): hacia afuera de la pantalla (⊙) o hacia adentro (⊗).</p>
<div class="sim" data-sim="vector-productos" data-title="Producto escalar (proyección) y producto vectorial (área)"></div>
<div class="sim-guide"><ul>
<li>Haga perpendiculares los vectores: el producto escalar se anula y el vectorial es máximo.</li>
<li>Hágalos paralelos: el producto vectorial se anula (el paralelogramo se aplasta).</li>
<li>Lleve \(\vb{B}\) al otro lado de \(\vb{A}\): el producto vectorial cambia de ⊙ a ⊗.</li>
</ul></div>

<section>
<h2>Preguntas y problemas</h2>
<ol class="problems">
<li><span class="lvl">Concepto</span>¿Puede la magnitud de la suma de dos vectores ser menor que la magnitud de cada uno?
<details><summary>Respuesta</summary><p>Sí, si apuntan en direcciones casi opuestas. La magnitud de \(\vb{A}+\vb{B}\) está siempre entre \(\abs{A-B}\) y \(A+B\).</p></details></li>
<li><span class="lvl">Concepto</span>Si \(\vb{A}\cdot\vb{B}=0\) y ninguno de los dos vectores es nulo, ¿qué puede afirmarse?
<details><summary>Respuesta</summary><p>Que son perpendiculares.</p></details></li>
<li><span class="lvl">Problema</span>Un excursionista camina 12 km a 40° al norte del este y luego 8 km hacia el sur. ¿Dónde termina respecto al punto de partida?
<details><summary>Respuesta</summary><p>\(R_x=12\cos40^\circ=9.19\) km, \(R_y=12\sen40^\circ-8=-0.29\) km. Termina a 9.2 km, prácticamente hacia el este (1.8° al sur del este).</p></details></li>
<li><span class="lvl">Problema</span>Dados \(\vb{A}=3\ii-2\jj\) y \(\vb{B}=-\ii+4\jj\), calcule \(\vb{A}+\vb{B}\), \(\vb{A}-\vb{B}\), \(\vb{A}\cdot\vb{B}\), \(\vb{A}\times\vb{B}\) y el ángulo entre ellos.
<details><summary>Respuesta</summary><p>\(2\ii+2\jj\); \(4\ii-6\jj\); \(\vb{A}\cdot\vb{B}=-3-8=-11\); \(\vb{A}\times\vb{B}=(12-2)\kk=10\,\kk\); \(\cos\theta=-11/(\sqrt{13}\sqrt{17})\), \(\theta=137.7^\circ\).</p></details></li>
<li><span class="lvl">Problema</span>Tres fuerzas actúan sobre un anillo: 30 N hacia el este, 40 N hacia el norte y una tercera desconocida. Si el anillo está en equilibrio, ¿cuál es la tercera fuerza?
<details><summary>Respuesta</summary><p>Debe anular la suma de las otras dos: 50 N dirigida a 53.1° al sur del oeste (es decir, \(-30\ii-40\jj\) N).</p></details></li>
</ol>
</section>
