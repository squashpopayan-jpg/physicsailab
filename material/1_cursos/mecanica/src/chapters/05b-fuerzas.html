<template class="chapter-src" data-id="fuerzas" data-num="6" data-title="Las fuerzas y el diagrama de cuerpo libre" data-part="Parte III · Dinámica de la partícula" data-short="Peso, normal, tensión, fricción, fuerza elástica, arrastre y empuje; cómo dibujar el diagrama de cuerpo libre; sistemas en equilibrio y en movimiento">
<p class="lead">Las leyes de Newton sólo sirven si sabemos qué fuerzas actúan sobre un cuerpo. En este capítulo conocemos una por una las fuerzas de la mecánica: quién las ejerce, hacia dónde apuntan y cuánto valen. Luego aprendemos a dibujar el diagrama de cuerpo libre, la herramienta más importante para resolver problemas de dinámica, y la usamos en sistemas en equilibrio y en sistemas en movimiento.</p>

<div class="keyideas"><ul>
<li>Toda fuerza es la acción de un cuerpo sobre otro: si no se puede decir quién la ejerce, esa fuerza no existe.</li>
<li>El peso actúa a distancia; la normal, la fricción, la tensión, la fuerza elástica, el arrastre y el empuje sólo aparecen donde el cuerpo toca algo.</li>
<li>La normal y la fricción estática no tienen un valor fijo: toman el valor necesario, hasta un límite.</li>
<li>El diagrama de cuerpo libre muestra un solo cuerpo con todas las fuerzas que actúan sobre él, y sólo esas.</li>
<li>En equilibrio \(\sum\vb F=0\); en movimiento, \(\sum\vb F=m\vb a\) para cada cuerpo, junto con las condiciones que unen los cuerpos entre sí.</li>
</ul></div>

<section>
<h2>¿Cómo reconocer una fuerza?</h2>
<p>Una fuerza siempre tiene un <strong>autor</strong> y un <strong>receptor</strong>: la mesa empuja al libro, la cuerda tira del balde, la Tierra atrae a la pelota. Antes de dibujar una fuerza conviene completar la frase «<em>___ ejerce una fuerza sobre ___</em>». Si el espacio del autor queda vacío, la fuerza es imaginaria.</p>
<p>Las fuerzas de la mecánica se dividen en dos grupos:</p>
<div class="tablewrap narrow"><table>
<thead><tr><th>Fuerzas a distancia</th><th>Fuerzas de contacto</th></tr></thead>
<tbody>
<tr><td>Actúan aunque los cuerpos no se toquen.</td><td>Sólo actúan donde el cuerpo toca a otro.</td></tr>
<tr><td>El peso (gravedad); también las fuerzas eléctricas y magnéticas.</td><td>Normal, fricción, tensión, fuerza elástica, fuerza aplicada, arrastre y empuje de un fluido.</td></tr>
</tbody></table></div>
<p>De ahí sale una regla práctica para no olvidar ninguna fuerza: <strong>el peso, más una o dos fuerzas por cada cosa que toca al cuerpo</strong>. Una superficie puede empujar (normal) y rozar (fricción); una cuerda sólo puede tirar (tensión); un resorte tira o empuja; un fluido empuja hacia arriba (empuje) y frena el movimiento (arrastre).</p>
<div class="box warn">
<p><strong>Fuerzas que no existen.</strong> Ninguna de estas tiene autor, así que no se dibujan:</p>
<ul>
<li>«La fuerza del lanzamiento» en una pelota que ya salió de la mano: en el aire sólo actúan el peso (y el aire).</li>
<li>«La fuerza del movimiento» que empuja a un cuerpo que se desliza: por inercia, no hace falta ninguna fuerza para seguir moviéndose.</li>
<li>\(m\vb a\): es el <em>resultado</em> de las fuerzas, no una fuerza más.</li>
<li>«La fuerza centrípeta» como fuerza adicional, o «la centrífuga» en un marco inercial: centrípeta es el nombre de la fuerza neta en un movimiento circular, que siempre la hace alguna de las fuerzas reales (tensión, fricción, normal o peso).</li>
</ul>
</div>
</section>

<section>
<h2>Las fuerzas, una por una</h2>
<h3>El peso</h3>
<p>Es la fuerza con que la Tierra (o el planeta en el que estemos) atrae al cuerpo. Actúa sobre todo el cuerpo y se dibuja desde su centro de gravedad, siempre <strong>vertical y hacia abajo</strong>:</p>
<div class="eq key" data-name="Peso">\[w=m\,g\qquad(g=9.8\un{m/s^2}\text{ en la Tierra}).\]</div>
<p>El peso no depende de cómo se mueva el cuerpo ni de lo que lo sostenga: una pelota pesa lo mismo en reposo, al subir o al caer. Lo que cambia de un planeta a otro es \(g\): en la Luna una persona de 60 kg pesa 97 N en lugar de 588 N, pero su masa sigue siendo 60 kg.</p>

<h3>La fuerza normal</h3>
<p>Es el empujón de una superficie sobre un cuerpo apoyado en ella. Es <strong>perpendicular a la superficie</strong> («normal» significa perpendicular) y siempre <strong>empuja</strong>, alejándose de la superficie. Su valor no está dado por ninguna fórmula: la superficie se deforma muy poco y empuja justo lo necesario para que el cuerpo no la atraviese.</p>
<ul>
<li>Un libro sobre una mesa: \(n=mg\).</li>
<li>Un bloque sobre una rampa de ángulo θ: \(n=mg\cos\theta\), menor que el peso.</li>
<li>Si además se aprieta el cuerpo contra la superficie, \(n\) aumenta; si se tira de él hacia afuera, disminuye, y cuando llega a cero el cuerpo pierde el contacto.</li>
</ul>

<h3>La tensión</h3>
<p>Es la fuerza que ejerce una cuerda, un cable o una cadena. Actúa <strong>a lo largo de la cuerda</strong> y siempre <strong>tira</strong> del cuerpo hacia la cuerda: una cuerda no puede empujar. En una <em>cuerda ideal</em> (de masa despreciable y que no se estira) la tensión tiene el mismo valor en toda su longitud, y una <em>polea ideal</em> (sin masa ni fricción) sólo cambia la dirección de la cuerda, no la tensión.</p>

<h3>La fricción estática</h3>
<p>Es la fuerza que ejerce una superficie, paralela a ella, cuando el cuerpo <em>tiende</em> a deslizar pero no desliza. Apunta en contra de la dirección en que el cuerpo deslizaría si no hubiera fricción, y vale lo necesario para impedirlo, hasta un máximo:</p>
<div class="eq key" data-name="Fricción estática">\[0\le f_s\le\mu_s\,n .\]</div>
<p>La fricción estática puede apuntar <em>en el sentido del movimiento</em>: al caminar, el piso nos empuja hacia adelante; en un auto que acelera, la carretera empuja las llantas hacia adelante; una caja sobre un camión que arranca es arrastrada hacia adelante por la plataforma.</p>

<h3>La fricción cinética</h3>
<p>Aparece cuando el cuerpo ya desliza sobre la superficie. Es paralela a la superficie, <strong>opuesta a la velocidad de deslizamiento</strong>, y su magnitud es casi constante:</p>
<div class="eq key" data-name="Fricción cinética">\[f_k=\mu_k\,n,\qquad \mu_k\lt\mu_s .\]</div>
<p>No depende de la rapidez ni del área de contacto. El capítulo 7 estudia ambas fricciones con detalle; los coeficientes típicos están en el apéndice.</p>

<h3>La fuerza elástica</h3>
<p>Es la fuerza de un resorte, una banda de caucho o cualquier cuerpo elástico deformado. Apunta hacia la posición natural del resorte y es proporcional a la deformación \(x\) (ley de Hooke):</p>
<div class="eq key" data-name="Fuerza elástica">\[F_e=-k\,x .\]</div>
<p>Un resorte estirado tira del cuerpo; uno comprimido lo empuja. Los dinamómetros miden fuerzas con esta ley: la deformación del resorte indica la fuerza.</p>

<h3>Las fuerzas aplicadas</h3>
<p>Son los empujones y tirones de personas, animales o máquinas, en cualquier dirección. En el diagrama se dibujan con su ángulo real, porque su componente perpendicular a la superficie cambia la normal. Ojo: el motor de un auto no empuja al auto desde afuera; hace girar las ruedas, y la fuerza externa que lo impulsa es la fricción estática del piso.</p>

<h3>La resistencia de un fluido (arrastre)</h3>
<p>El aire o el agua frenan a un cuerpo que se mueve en ellos con una fuerza <strong>opuesta a la velocidad relativa</strong> al fluido. A rapideces altas vale aproximadamente</p>
<div class="eq key" data-name="Arrastre">\[F_D=\tfrac12\,C\,\rho\,A\,v^2 ,\]</div>
<p>donde \(C\) depende de la forma, ρ es la densidad del fluido y \(A\) el área frontal. Crece con la rapidez, y cuando iguala al peso se alcanza la velocidad terminal (capítulo 7).</p>

<h3>El empuje</h3>
<p>Es la fuerza de un fluido sobre un cuerpo sumergido: vertical, <strong>hacia arriba</strong>, igual al peso del fluido desalojado (principio de Arquímedes, capítulo 16):</p>
<div class="eq key" data-name="Empuje">\[B=\rho_{\text{fluido}}\,V_{\text{sum}}\,g .\]</div>

<div class="box ex">
<h4>La normal no siempre es el peso</h4>
<p>Una caja de 20 kg se empuja con 100 N dirigidos 30° por debajo de la horizontal. ¿Cuánto vale la normal? ¿Y si en lugar de empujarla se tira de ella con 100 N a 30° por encima de la horizontal?</p>
<details><summary>Solución</summary>
<p>En la vertical la caja no acelera. Empujando: \(n-mg-F\sen30^\circ=0\Rightarrow n=196+50=246\) N. Tirando hacia arriba: \(n+F\sen30^\circ-mg=0\Rightarrow n=196-50=146\) N. Por eso cuesta menos arrastrar un objeto tirando de él hacia arriba: con menos normal, hay menos fricción.</p>
<p><button class="try" type="button" data-try="explorador-fuerzas:podadora">Probar en la simulación</button></p>
</details>

<section>
<h2>El diagrama de cuerpo libre</h2>
<p>Un <strong>diagrama de cuerpo libre</strong> (DCL) es un dibujo de un solo cuerpo, separado de todo lo que lo rodea, con todas las fuerzas que actúan <em>sobre</em> él. Es el paso que decide si un problema de dinámica sale bien o mal: casi todos los errores vienen de una fuerza olvidada, una fuerza inventada o una dirección equivocada.</p>
<h3>El método, paso a paso</h3>
<ol>
<li><strong>Elija el cuerpo.</strong> Si hay varios cuerpos, haga un diagrama para cada uno.</li>
<li><strong>Aíslelo.</strong> Dibújelo como un punto o un bloque, sin el piso, las cuerdas ni las demás cosas.</li>
<li><strong>Dibuje el peso</strong>, vertical hacia abajo.</li>
<li><strong>Recorra el contorno del cuerpo.</strong> En cada sitio donde toca algo, agregue la fuerza que ese algo ejerce. Una superficie da una normal y, si hay roce, una fricción; una cuerda da una tensión; un resorte, una fuerza elástica; un fluido, empuje y arrastre. Agregue también las fuerzas aplicadas.</li>
<li><strong>Revise cada fuerza:</strong> ¿quién la ejerce? No incluya fuerzas que el cuerpo ejerce sobre otros, ni \(m\vb a\), ni la «fuerza centrípeta».</li>
<li><strong>Elija los ejes.</strong> Ponga uno en la dirección de la aceleración. En una rampa, use ejes paralelo y perpendicular a la rampa.</li>
<li><strong>Descomponga las fuerzas y escriba</strong> \(\sum F_x=ma_x\) y \(\sum F_y=ma_y\).</li>
</ol>
<p>Las flechas se dibujan saliendo del cuerpo, con la dirección correcta y una longitud aproximadamente proporcional a su magnitud. En este curso cada fuerza tiene siempre el mismo color: peso rojo, normal violeta, fricción café, tensión verde azulado, fuerza aplicada azul, fuerza elástica fucsia, arrastre gris y empuje azul claro.</p>
<div class="box warn">
<p><strong>Errores frecuentes al dibujar un DCL</strong></p>
<ul>
<li>Dibujar la normal siempre vertical: es perpendicular a la superficie, inclinada en una rampa y horizontal contra una pared.</li>
<li>Suponer que la fricción siempre va contra el movimiento: la estática va contra la <em>tendencia</em> a deslizar, y puede apuntar hacia adelante.</li>
<li>Poner el par de acción y reacción en el mismo diagrama: cada fuerza del par actúa sobre un cuerpo distinto.</li>
<li>Dibujar tensiones que empujan o que no siguen la dirección de la cuerda.</li>
<li>Agregar la «fuerza del lanzamiento» o la «fuerza de la inercia».</li>
</ul>
</div>
<div class="sim" data-sim="constructor-dcl" data-title="Arme el diagrama de cuerpo libre: 14 situaciones para practicar"></div>
<div class="sim-guide"><ul>
<li>Elija una situación, agregue las fuerzas con los botones y oriéntelas arrastrando la punta de la flecha (o con el control de dirección).</li>
<li>Pulse «Revisar»: la simulación marca las fuerzas correctas, las que faltan, las que sobran y las que tienen la dirección equivocada, y explica por qué.</li>
<li>Las situaciones más traicioneras son la pelota que sube, la caja sobre el camión que arranca y el auto en una curva.</li>
</ul></div>
<div class="box ex">
<h4>El trineo</h4>
<p>Un niño jala un trineo de 20 kg con una cuerda que forma 30° con la horizontal, con una tensión de 80 N. El trineo avanza sobre la nieve (\(\mu_k=0.15\)). Dibuje el DCL y halle la normal y la aceleración.</p>
<details><summary>Solución</summary>
<p>Fuerzas: peso \(196\) N hacia abajo, normal hacia arriba, tensión de 80 N a 30° y fricción cinética hacia atrás. En la vertical no hay aceleración: \(n+80\sen30^\circ-196=0\Rightarrow n=156\) N. Entonces \(f_k=0.15(156)=23.4\) N y en la horizontal \(a=\dfrac{80\cos30^\circ-23.4}{20}=2.29\) m/s².</p>

<section>
<h2>Sistemas en equilibrio</h2>
<p>Un cuerpo está en <strong>equilibrio</strong> si su aceleración es cero: está en reposo o se mueve en línea recta con rapidez constante. Por la segunda ley, la suma de las fuerzas es cero:</p>
<div class="eq key" data-name="Condición de equilibrio">\[\sum F_x=0,\qquad \sum F_y=0 .\]</div>
<p>Gráficamente, si se colocan las fuerzas una tras otra (punta con cola) forman un <strong>polígono cerrado</strong>. Para resolver un problema de equilibrio:</p>
<ol>
<li>Dibuje el DCL de cada cuerpo; en un sistema con cuerdas y poleas, la tensión de una misma cuerda ideal es igual en ambos extremos.</li>
<li>Elija ejes que dejen muchas fuerzas sobre un eje, y escriba las dos ecuaciones por cuerpo.</li>
<li>Si no sabe hacia dónde apunta la fricción estática, suponga una dirección: si el resultado sale negativo, apunta al revés. Si sale mayor que \(\mu_sn\), no hay equilibrio y el sistema se mueve.</li>
</ol>
<div class="sim" data-sim="sistemas-equilibrio" data-title="Laboratorio de sistemas en equilibrio"></div>
<div class="sim-guide"><ul>
<li>Cada montaje muestra el DCL de cada cuerpo, las ecuaciones con números y, cuando hay equilibrio, el polígono cerrado de fuerzas.</li>
<li>En «Contrapeso», cambie la masa colgante: la fricción estática apunta hacia arriba, desaparece o apunta hacia abajo según lo que haga falta. Fuera de un rango de masas, el sistema se mueve.</li>
<li>En «Poleas», compare la fuerza necesaria con una polea fija, una móvil y un aparejo de cuatro tramos.</li>
</ul></div>
<div class="box ex">
<h4>Un bloque sostenido en una rampa</h4>
<p>Un bloque de 10 kg está en una rampa lisa de 30°, sostenido por una cuerda paralela a la rampa. Halle la tensión y la normal.</p>
<details><summary>Solución</summary>
<p>Con ejes paralelo y perpendicular a la rampa: \(T-mg\sen30^\circ=0\Rightarrow T=49\) N; \(n-mg\cos30^\circ=0\Rightarrow n=84.9\) N. La cuerda sólo sostiene la mitad del peso; la rampa sostiene el resto.</p>
<p><button class="try" type="button" data-try="sistemas-equilibrio:rampa">Probar en la simulación</button></p>
</details>
</div>
<div class="box ex">
<h4>Un libro apretado contra la pared</h4>
<p>Se sostiene un libro de 1.5 kg apretándolo contra una pared vertical con la mano (\(\mu_s=0.40\)). ¿Con qué fuerza horizontal mínima hay que apretarlo?</p>
<details><summary>Solución</summary>
<p>La normal la da la pared y vale lo que aprieta la mano: \(n=F\). La fricción estática debe sostener el peso: \(f_s=mg=14.7\) N, y como \(f_s\le\mu_sF\), hace falta \(F\ge mg/\mu_s=36.8\) N. Apretar no cambia el peso: aumenta la fricción <em>máxima</em> disponible.</p>
<p><button class="try" type="button" data-try="sistemas-equilibrio:pared">Probar en la simulación</button></p>
</details>
</div>

<h4>Equilibrio en la vida cotidiana</h4>
<div class="daily-grid">

<section>
<h2>Sistemas en movimiento</h2>
<p>Cuando la fuerza neta no es cero, el cuerpo acelera y \(\sum\vb F=m\vb a\). En un sistema de varios cuerpos unidos (por cuerdas, por contacto o apilados) se procede así:</p>
<ol>
<li>Dibuje un DCL para <strong>cada</strong> cuerpo. Las fuerzas entre dos cuerpos del sistema aparecen en ambos diagramas con sentidos opuestos (tercera ley).</li>
<li>Escriba las <strong>ligaduras</strong>: dos cuerpos unidos por una cuerda tensa, o que se empujan, tienen la misma aceleración.</li>
<li>Escriba \(\sum F=ma\) para cada cuerpo y resuelva el sistema de ecuaciones. Debe haber tantas ecuaciones como incógnitas.</li>
</ol>
<p>Un atajo útil: tratar todo el sistema como un solo cuerpo de masa \(M\) da la aceleración, porque las fuerzas internas se cancelan por pares. Después se aísla un cuerpo para hallar las fuerzas internas (tensiones o fuerzas de contacto).</p>
<div class="eq">\[\text{Sistema completo: } a=\frac{\sum F_{\text{externas}}}{M}\qquad\text{luego, cada cuerpo: } \sum F_i=m_i\,a .\]</div>
<div class="sim" data-sim="sistemas-movimiento" data-title="Laboratorio de sistemas en movimiento"></div>
<div class="sim-guide"><ul>
<li>Los DCL de cada cuerpo se actualizan mientras el sistema se mueve; junto a cada uno se comprueba que \(\sum F=ma\).</li>
<li>En «Tren», las tensiones disminuyen hacia atrás: cada enganche sólo arrastra los vagones que van detrás de él. En este montaje y en «Apilados», los diagramas usan escalas distintas en horizontal y en vertical, porque los pesos son mucho mayores que las demás fuerzas.</li>
<li>En «Apilados», aumente la fuerza: mientras alcanza la fricción estática, se mueven juntos; si la fuerza la supera, el bloque de arriba desliza y se queda atrás.</li>
</ul></div>
<div class="box ex">
<h4>Dos cajas en contacto</h4>
<p>Se empujan dos cajas en contacto sobre un piso liso: la de 4 kg recibe directamente una fuerza de 30 N y empuja a la de 2 kg. ¿Cuál es la aceleración y con qué fuerza se empujan las cajas entre sí? ¿Cambia si se empuja desde el otro lado?</p>
<details><summary>Solución</summary>
<p>Sistema completo: \(a=30/6=5.0\) m/s². Caja de 2 kg: la única fuerza horizontal es la de contacto, \(P=2(5.0)=10\) N. Si se empuja desde el lado de la caja de 2 kg, la de 4 kg es la que debe ser empujada: \(P=4(5.0)=20\) N. La aceleración es la misma, pero la fuerza entre las cajas no.</p>
<p><button class="try" type="button" data-try="sistemas-movimiento:contacto">Probar en la simulación</button></p>
</details>
</div>
<div class="box ex">
<h4>Un tren de tres vagones</h4>
<p>Una locomotora jala tres vagones de 2000 kg cada uno con 3000 N (despreciando la fricción). Halle la aceleración y la tensión en cada enganche.</p>
<details><summary>Solución</summary>
<p>\(a=3000/6000=0.50\) m/s². El enganche entre el primer y el segundo vagón arrastra 4000 kg: \(T_1=4000(0.50)=2000\) N; el siguiente arrastra sólo el último vagón: \(T_2=1000\) N.</p>
<p><button class="try" type="button" data-try="sistemas-movimiento:tren">Probar en la simulación</button></p>
</details>

<div class="daily-grid">
<div class="dcard"><b>La carga suelta en la camioneta</b><p>Si la camioneta acelera más de lo que la fricción estática puede transmitir (\(a\gt\mu_sg\)), la carga desliza hacia atrás respecto a la plataforma.</p></div>
<div class="dcard"><b>Los enganches de un tren</b><p>El primer enganche soporta la mayor tensión: arrastra a todos los vagones. Por eso los trenes de carga muy largos usan locomotoras en medio.</p></div>

<section>
<h2>Preguntas y problemas</h2>
<ol class="problems">
<li><span class="lvl">Concepto</span>Un libro descansa sobre una mesa. ¿Qué fuerzas actúan sobre el libro? ¿Cuál es la reacción de cada una?
<details><summary>Respuesta</summary><p>El peso (la Tierra sobre el libro), cuya reacción es la atracción del libro sobre la Tierra; y la normal (la mesa sobre el libro), cuya reacción es el empujón del libro sobre la mesa. Peso y normal no son un par de acción y reacción.</p></details></li>
<li><span class="lvl">Concepto</span>Una pelota lanzada hacia arriba está en el punto más alto. ¿Qué fuerzas actúan sobre ella? ¿Cuál es su aceleración?
<details><summary>Respuesta</summary><p>Sólo el peso (sin aire). Su velocidad es cero en ese instante, pero su aceleración es \(g\) hacia abajo.</p></details></li>
<li><span class="lvl">Concepto</span>¿Puede la fricción estática apuntar en el mismo sentido que el movimiento? Dé un ejemplo.
<details><summary>Respuesta</summary><p>Sí: al caminar, el piso empuja el pie hacia adelante; una caja sobre un camión que acelera recibe de la plataforma una fricción hacia adelante.</p></details></li>
<li><span class="lvl">Problema</span>Un bloque de 5 kg está en reposo sobre una rampa lisa de 37°, sostenido por una cuerda paralela a la rampa. Halle la tensión y la normal (\(\sen37^\circ=0.6\)).
<details><summary>Respuesta</summary><p>\(T=mg\sen37^\circ=29.4\) N; \(n=mg\cos37^\circ=39.2\) N.</p></details></li>
<li><span class="lvl">Problema</span>Un trineo de 15 kg se jala con 60 N a 25° sobre la horizontal; \(\mu_k=0.10\). Halle la normal y la aceleración.
<details><summary>Respuesta</summary><p>\(n=147-60\sen25^\circ=122\) N; \(a=\dfrac{60\cos25^\circ-0.10(122)}{15}=2.81\) m/s².</p></details></li>
<li><span class="lvl">Problema</span>Un bloque de 1 kg está sobre otro de 4 kg que descansa en un piso liso; entre ellos \(\mu_s=0.40\). ¿Qué fuerza horizontal máxima se puede aplicar al bloque de abajo sin que el de arriba deslice?
<details><summary>Respuesta</summary><p>El de arriba sólo puede acelerar con \(a\le\mu_sg=3.92\) m/s², así que \(F\le(5\un{kg})(3.92)=19.6\) N.</p></details></li>
<li><span class="lvl">Problema</span>Con una polea móvil se levanta a velocidad constante una carga de 400 N (polea de peso despreciable). ¿Con qué fuerza hay que tirar? Si la carga sube 1 m, ¿cuánta cuerda se recoge?
<details><summary>Respuesta</summary><p>\(T=200\) N; se recogen 2 m de cuerda. El trabajo hecho es el mismo: \(200(2)=400(1)\) J.</p></details></li>
</ol>
