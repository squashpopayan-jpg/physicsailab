<template class="chapter-src" data-id="newton" data-num="5" data-title="Las leyes de Newton" data-part="Parte III · Dinámica de la partícula" data-short="Fuerza, inercia, F = ma, peso y fuerza normal, acción y reacción, diagramas de cuerpo libre">
<p class="lead">¿Por qué se mueven las cosas y por qué se detienen? Durante dos mil años se creyó que un cuerpo necesita una fuerza para seguir moviéndose. Newton mostró que ocurre lo contrario: la fuerza no mantiene el movimiento, lo <em>cambia</em>. Sus tres leyes, publicadas en 1687, son la base de toda la mecánica.</p>

<div class="keyideas"><ul>
<li>Una fuerza es una interacción entre dos cuerpos; es un vector y se mide en newtons.</li>
<li>Primera ley: si la fuerza neta es cero, la velocidad no cambia (reposo o movimiento rectilíneo uniforme).</li>
<li>Segunda ley: \(\sum\vb{F}=m\vb{a}\). La masa mide la inercia de un cuerpo.</li>
<li>Tercera ley: las fuerzas aparecen en pares iguales y opuestos que actúan sobre cuerpos distintos.</li>
<li>El peso es \(mg\); una báscula no mide el peso sino la fuerza normal, que puede ser mayor o menor.</li>
</ul></div>

<section>
<h2>Fuerzas e interacciones</h2>
<p>Una <strong>fuerza</strong> es un empujón o un tirón: la acción de un cuerpo sobre otro. Siempre hay dos cuerpos involucrados, el que ejerce la fuerza y el que la recibe. Algunas fuerzas requieren contacto (la fuerza de una mano, la tensión de una cuerda, la fricción del piso) y otras actúan a distancia (la gravedad, la fuerza entre imanes).</p>
<p>Las fuerzas son vectores: importan su magnitud y su dirección. Cuando varias fuerzas actúan sobre un cuerpo, su efecto es el de una sola fuerza igual a la suma vectorial, la <strong>fuerza neta</strong> \(\sum\vb{F}\). La unidad de fuerza en el SI es el <strong>newton</strong> (N); una manzana mediana pesa aproximadamente 1 N. Las fuerzas se miden con un <em>dinamómetro</em>: un resorte cuya deformación es proporcional a la fuerza.</p>
<div class="box note">
<p>En la naturaleza hay sólo cuatro interacciones fundamentales: gravitacional, electromagnética, nuclear fuerte y nuclear débil. Casi todas las fuerzas cotidianas (normal, fricción, tensión, la fuerza de un resorte, la de un músculo) son, en el fondo, fuerzas eléctricas entre los átomos de las superficies en contacto.</p>
</div>
<p>Este capítulo presenta las tres leyes de Newton. El siguiente, <a href="#fuerzas">«Las fuerzas y el diagrama de cuerpo libre»</a>, describe una por una las fuerzas de la mecánica (quién las ejerce, hacia dónde apuntan y cuánto valen) y aplica las leyes a sistemas en equilibrio y en movimiento.</p>
</section>

<section>
<h2>Primera ley: la inercia</h2>
<div class="box law">
<h4>Primera ley de Newton</h4>
<p>Todo cuerpo permanece en reposo o en movimiento rectilíneo uniforme a menos que una fuerza neta actúe sobre él.</p>
</div>
<p>La tendencia de los cuerpos a mantener su velocidad se llama <strong>inercia</strong>. Aristóteles pensaba que el estado natural de los cuerpos era el reposo, porque en la vida diaria todo lo que se desliza termina por detenerse. Galileo notó que eso se debe a la fricción: sobre una superficie cada vez más lisa, un cuerpo recorre distancias cada vez mayores. Sin fricción seguiría para siempre.</p>
<p>La primera ley también define los <span class="term">marcos de referencia inerciales</span>: aquellos en los que la ley se cumple. Un salón de clase es, con muy buena aproximación, un marco inercial; un bus que frena no lo es, porque en él los objetos “salen disparados” hacia adelante sin que nada los empuje (capítulo 7).</p>
<div class="sim" data-sim="inercia" data-title="El disco que no se detiene: fricción e inercia"></div>
<div class="sim-guide"><ul>
<li>Sin fricción, una vez que termina el empujón el disco sigue con velocidad constante: la gráfica \(v(t)\) queda horizontal. No hace falta ninguna fuerza para mantener el movimiento.</li>
<li>Con fricción, el disco se detiene. Cambie la masa: la distancia de frenado no cambia, porque la fricción y la inercia crecen en la misma proporción.</li>
</ul></div>
<div class="box warn">
<p><strong>“Si se mueve, algo lo está empujando.”</strong> Falso. Un disco de hockey que se desliza sobre el hielo no necesita una fuerza hacia adelante. Si una fuerza actúa, lo que cambia es la <em>velocidad</em>, no la posición.</p>
</div>
<div class="daily">
<h4>La inercia en la vida cotidiana</h4>
<div class="daily-grid">
<div class="dcard"><b>El cinturón de seguridad</b><p>En un choque el auto se detiene en décimas de segundo, pero el cuerpo sigue hacia adelante a la misma velocidad. El cinturón aplica la fuerza que lo frena junto con el auto.</p></div>
<div class="dcard"><b>El truco del mantel</b><p>Si se tira del mantel con rapidez, la fricción actúa muy poco tiempo y los platos, por su inercia, casi no se mueven.</p></div>
<div class="dcard"><b>Sacudir la salsa de tomate</b><p>Se mueve el frasco con fuerza hacia abajo y se detiene de golpe: el frasco para, pero la salsa sigue bajando y sale.</p></div>
<div class="dcard"><b>El bus que arranca</b><p>Cuando el bus acelera, los pasajeros de pie “se van hacia atrás”: en realidad sus cuerpos tienden a quedarse donde estaban mientras el bus avanza.</p></div>
</div>
</div>
</section>

<section>
<h2>Segunda ley: fuerza, masa y aceleración</h2>
<p>Si la fuerza neta no es cero, el cuerpo acelera en la dirección de la fuerza neta. La aceleración es proporcional a la fuerza e inversamente proporcional a la masa:</p>
<div class="eq key" data-name="Segunda ley de Newton">\[\sum\vb{F}=m\,\vb{a}\qquad\Longleftrightarrow\qquad \sum F_x=m\,a_x,\quad \sum F_y=m\,a_y .\]</div>
<p>De aquí sale la definición del newton: la fuerza que le da a 1 kg una aceleración de 1 m/s², \(1\un{N}=1\un{kg\cdot m/s^2}\). La <strong>masa</strong> aparece como la medida de la inercia: con la misma fuerza, un cuerpo de doble masa adquiere la mitad de aceleración. Es una propiedad del cuerpo que no depende de dónde esté.</p>
<p>Tres observaciones importantes:</p>
<ul>
<li>La ley relaciona la fuerza <em>neta</em> con la aceleración: si dos fuerzas iguales y opuestas actúan sobre un cuerpo, su aceleración es cero aunque haya fuerzas.</li>
<li>Es una ecuación vectorial: la aceleración tiene la dirección de la fuerza neta, que no tiene por qué coincidir con la de la velocidad.</li>
<li>La primera ley es el caso particular \(\sum\vb{F}=0\Rightarrow\vb{a}=0\).</li>
</ul>
<div class="sim" data-sim="segunda-ley" data-title="Segunda ley: un carrito, una fuerza y un experimento"></div>
<div class="sim-guide"><ul>
<li>Registre varios puntos \((F_{\text{neta}},a)\) con distintas fuerzas y la misma masa: quedan sobre una recta que pasa por el origen, de pendiente \(1/m\).</li>
<li>Duplique la masa y repita: la nueva recta tiene la mitad de pendiente.</li>
<li>Con el carrito en movimiento, ponga la fuerza en cero: sigue moviéndose con velocidad constante (sin fricción).</li>
</ul></div>
<div class="box ex">
<h4>Empujar una caja</h4>
<p>Se empuja horizontalmente una caja de 25 kg con una fuerza de 100 N; la fricción del piso vale 60 N. ¿Cuál es su aceleración? ¿Qué velocidad tiene después de 3 s si parte del reposo?</p>
<details><summary>Solución</summary>
<p>\(\sum F_x=100-60=40\) N, así que \(a=40/25=1.6\) m/s². Después de 3 s, \(v=at=4.8\) m/s.</p>
<p><button class="try" type="button" data-try="segunda-ley:caja">Probar en la simulación</button></p>
</details>
</div>
<div class="box ex">
<h4>La fuerza para frenar un auto</h4>
<p>Un auto de 1200 kg que va a 72 km/h se detiene en 4.0 s con aceleración constante. ¿Qué fuerza neta actuó sobre él?</p>
<details><summary>Solución</summary>
<p>\(a=(0-20)/4.0=-5.0\) m/s² y \(F=ma=1200(-5.0)=-6000\) N: 6 kN en sentido contrario al movimiento. Esa fuerza la hace el piso sobre las llantas (fricción).</p>
</details>
</div>
</section>

<section>
<h2>Peso, fuerza normal y peso aparente</h2>
<p>El <strong>peso</strong> de un cuerpo es la fuerza con que la Tierra lo atrae. Por la segunda ley, como un cuerpo en caída libre tiene aceleración \(g\),</p>
<div class="eq key" data-name="Peso">\[\vb{w}=m\,\vb{g},\qquad w=mg\approx(9.8\un{N/kg})\,m .\]</div>
<p>Masa y peso son distintos: la masa de un astronauta es la misma en la Tierra y en la Luna, pero en la Luna pesa seis veces menos. Decir “peso 60 kilos” es un uso cotidiano; en física, su masa es 60 kg y su peso 588 N.</p>
<p>Cuando un cuerpo se apoya en una superficie, esta lo empuja con una fuerza perpendicular a ella, la <strong>fuerza normal</strong> \(\vb{n}\). La normal no tiene un valor fijo: se ajusta para impedir que el cuerpo atraviese la superficie. Si un libro descansa sobre una mesa, \(n=mg\); si además se aprieta el libro hacia abajo con la mano, \(n\) aumenta.</p>
<h3>El ascensor y el peso aparente</h3>
<p>Una báscula de baño no mide el peso: mide la fuerza con que la persona la comprime, que es igual (por la tercera ley) a la normal que la báscula ejerce sobre la persona. En un ascensor que acelera con \(a_y\) (positiva hacia arriba), la segunda ley para la persona da</p>
<div class="eq key" data-name="Peso aparente">\[n-mg=ma_y\qquad\Longrightarrow\qquad n=m\,(g+a_y).\]</div>
<p>Al arrancar hacia arriba o al frenar mientras baja (\(a_y\gt0\)) la báscula marca más; al arrancar hacia abajo o al frenar mientras sube (\(a_y\lt0\)) marca menos; a velocidad constante marca el peso real. Si el cable se rompiera, persona y báscula caerían con \(a_y=-g\) y la báscula marcaría cero: <em>ingravidez aparente</em>.</p>
<div class="sim" data-sim="ascensor" data-title="La báscula en el ascensor: peso aparente"></div>
<div class="sim-guide"><ul>
<li>Observe la gráfica \(n(t)\): sólo difiere de \(mg\) mientras hay aceleración, no mientras hay velocidad.</li>
<li>Pruebe la caída libre: la lectura cae a cero. Los astronautas de la Estación Espacial flotan por la misma razón: la estación y ellos caen juntos alrededor de la Tierra.</li>
</ul></div>
<div class="box ex">
<h4>¿Cuánto marca la báscula?</h4>
<p>Una persona de 60 kg está sobre una báscula en un ascensor que arranca hacia arriba con 1.5 m/s². ¿Qué fuerza indica la báscula? ¿Y qué “masa” muestra en pantalla?</p>
<details><summary>Solución</summary>
<p>\(n=60(9.8+1.5)=678\) N. Como la báscula está calibrada dividiendo entre \(g\), muestra \(678/9.8=69.2\) kg, más de nueve “kilos” adicionales.</p>
<p><button class="try" type="button" data-try="ascensor:sube">Probar en la simulación</button></p>
</details>
</div>

<h4>En la vida cotidiana</h4>
<div class="daily-grid">
<div class="dcard"><b>Montaña rusa</b><p>En el fondo de una caída, la pista empuja con una normal de hasta 3 o 4 veces el peso; en la cima de una loma, uno se levanta del asiento.</p></div>

</section>

<section>
<h2>Tercera ley: acción y reacción</h2>
<div class="box law">
<h4>Tercera ley de Newton</h4>
<p>Si el cuerpo A ejerce una fuerza sobre el cuerpo B, entonces B ejerce sobre A una fuerza de igual magnitud y dirección opuesta: \(\vb{F}_{A\text{ sobre }B}=-\vb{F}_{B\text{ sobre }A}\).</p>
</div>
<p>Las dos fuerzas del par son del mismo tipo (ambas gravitacionales, ambas de contacto…), actúan al mismo tiempo y <strong>sobre cuerpos distintos</strong>. Por eso nunca se cancelan entre sí: cada una produce su efecto sobre el cuerpo que la recibe, y ese efecto depende de la masa de cada cuerpo.</p>
<div class="sim" data-sim="tercera-ley" data-title="Dos patinadores se empujan: fuerzas iguales, efectos distintos"></div>
<div class="sim-guide"><ul>
<li>Durante el empujón las dos fuerzas son idénticas en magnitud. El patinador más liviano sale más rápido porque su aceleración es mayor.</li>
<li>La suma de las cantidades \(m v\) de ambos es cero antes y después: es la conservación del momento del capítulo 10.</li>
</ul></div>
<div class="box warn">
<p><strong>El peso y la normal no son un par de acción y reacción.</strong> Ambas actúan sobre el mismo cuerpo y son de distinto tipo. La reacción al peso de un libro es la fuerza gravitacional con que el libro atrae a la Tierra; la reacción a la normal es la fuerza con que el libro empuja la mesa.</p>
</div>
<div class="daily">
<h4>Acción y reacción en la vida cotidiana</h4>
<div class="daily-grid">
<div class="dcard"><b>Caminar</b><p>Con el pie empujamos el suelo hacia atrás; el suelo nos empuja hacia adelante. Sobre hielo, sin fricción, no podemos hacer esa fuerza y resbalamos.</p></div>
<div class="dcard"><b>Remar y nadar</b><p>El remo empuja el agua hacia atrás y el agua empuja el bote hacia adelante.</p></div>
<div class="dcard"><b>El retroceso de un arma</b><p>La pólvora empuja la bala hacia adelante y el arma hacia atrás con la misma fuerza; el arma, más pesada, retrocede más despacio.</p></div>
<div class="dcard"><b>El caballo y la carreta</b><p>Si la carreta tira del caballo con la misma fuerza, ¿cómo avanzan? Porque sobre el caballo también actúa el suelo, empujándolo hacia adelante con más fuerza que la carreta hacia atrás.</p></div>
</div>
</div>
</section>

<section>
<h2>Diagramas de cuerpo libre y equilibrio</h2>
<p>El paso más importante para resolver un problema de dinámica es dibujar el <strong>diagrama de cuerpo libre</strong> (DCL) de cada cuerpo:</p>
<ol>
<li>Aislar el cuerpo y representarlo como un punto o un bloque.</li>
<li>Dibujar todas las fuerzas que actúan <em>sobre</em> él (no las que él ejerce): peso, normales, tensiones, fricciones, fuerzas aplicadas. Cada fuerza debe tener un “autor”.</li>
<li>Elegir ejes convenientes (por ejemplo, uno a lo largo de la aceleración) y descomponer las fuerzas.</li>
<li>Escribir \(\sum F_x=ma_x\) y \(\sum F_y=ma_y\) y resolver.</li>
</ol>
<p>El método completo, con los errores más frecuentes y 14 situaciones para practicar, está en el <a href="#fuerzas">capítulo 6</a>.</p>
<p>Si el cuerpo está en reposo o se mueve con velocidad constante, está en <strong>equilibrio</strong> y la suma de fuerzas es cero: \(\sum F_x=0\), \(\sum F_y=0\). Gráficamente, los vectores de las fuerzas puestos punta con cola forman un polígono cerrado.</p>
<div class="sim" data-sim="equilibrio-cuerdas" data-title="Un semáforo colgado de dos cables: tensiones en equilibrio"></div>
<div class="sim-guide"><ul>
<li>Acerque los cables a la horizontal: las tensiones crecen sin límite. Por eso ninguna cuerda con peso puede quedar perfectamente horizontal.</li>
<li>El triángulo de fuerzas del recuadro siempre se cierra: \(\vb{T}_1+\vb{T}_2+\vb{w}=0\).</li>
</ul></div>
<div class="box ex">
<h4>Dos cables a 37° y 53°</h4>
<p>Un letrero de 100 N cuelga de dos cables que forman 37° y 53° con la horizontal. Halle las tensiones.</p>
<details><summary>Solución</summary>
<p>En \(x\): \(T_1\cos37^\circ=T_2\cos53^\circ\). En \(y\): \(T_1\sen37^\circ+T_2\sen53^\circ=100\). Con \(\cos37^\circ=\sen53^\circ=0.8\) y \(\sen37^\circ=\cos53^\circ=0.6\): \(T_1=w\cos53^\circ/\sen90^\circ=60\) N y \(T_2=w\cos37^\circ=80\) N. El cable más inclinado (más cercano a la vertical) soporta más.</p>
<p><button class="try" type="button" data-try="equilibrio-cuerdas:letrero">Probar en la simulación</button></p>
</details>
</div>
</section>

<section>
<h2>Preguntas y problemas</h2>
<ol class="problems">
<li><span class="lvl">Concepto</span>Un auto se mueve por una carretera recta con velocidad constante. ¿Cuál es la fuerza neta sobre él?
<details><summary>Respuesta</summary><p>Cero. La fuerza del motor (a través de la fricción con el piso) equilibra exactamente la resistencia del aire y la de rodadura.</p></details></li>
<li><span class="lvl">Concepto</span>Un camión choca de frente con un carro pequeño. ¿Cuál de los dos recibe mayor fuerza? ¿Cuál sufre mayor aceleración?
<details><summary>Respuesta</summary><p>Ambos reciben fuerzas de igual magnitud (tercera ley). El carro pequeño, con menos masa, sufre una aceleración mucho mayor, y por eso sus ocupantes corren más peligro.</p></details></li>
<li><span class="lvl">Problema</span>Una fuerza neta de 12 N le da a un objeto una aceleración de 4 m/s². ¿Qué aceleración le daría a un objeto con el triple de masa?
<details><summary>Respuesta</summary><p>\(m=3\) kg; con 9 kg, \(a=12/9=1.33\) m/s².</p></details></li>
<li><span class="lvl">Problema</span>Un ascensor de 800 kg (con pasajeros) sube frenando con una aceleración de magnitud 1.2 m/s². ¿Cuál es la tensión del cable?
<details><summary>Respuesta</summary><p>Si sube frenando, \(a_y=-1.2\) m/s²: \(T=m(g+a_y)=800(8.6)=6.9\times10^3\) N.</p></details></li>
<li><span class="lvl">Problema</span>Una cuerda de tender sostiene en su punto medio una camisa mojada de 2 kg. Cada mitad forma 5° con la horizontal. ¿Cuál es la tensión?
<details><summary>Respuesta</summary><p>\(2T\sen5^\circ=19.6\) N, \(T=112\) N: casi seis veces el peso de la camisa.</p></details></li>
</ol>
</section>
