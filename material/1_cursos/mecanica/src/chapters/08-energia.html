<template class="chapter-src" data-id="energia" data-num="8" data-title="Energía potencial y conservación de la energía" data-part="Parte IV · Energía y momento" data-short="Energía potencial gravitacional y elástica, fuerzas conservativas, conservación de la energía, fricción y diagramas de energía">
<p class="lead">Un columpio sube y baja, una montaña rusa trepa y se lanza cuesta abajo, el agua de una represa mueve turbinas. En todos esos casos la energía cambia de forma pero no desaparece. La conservación de la energía es una de las leyes más poderosas de la física: permite predecir rapideces y alturas sin conocer los detalles del camino.</p>

<div class="keyideas"><ul>
<li>La energía potencial es energía almacenada en la configuración de un sistema: \(U_g=mgy\) y \(U_e=\tfrac12kx^2\).</li>
<li>Una fuerza es conservativa si su trabajo no depende del camino; para ella \(W=-\Delta U\).</li>
<li>Si sólo trabajan fuerzas conservativas, la energía mecánica \(E=K+U\) se conserva.</li>
<li>La fricción convierte energía mecánica en energía térmica: \(\Delta E_{\text{mec}}=-f_kd\).</li>
<li>La fuerza es la pendiente negativa de la energía potencial: \(F_x=-\dd U/\dd x\).</li>
</ul></div>

<section>
<h2>Energía potencial gravitacional y fuerzas conservativas</h2>
<p>Cuando se levanta un libro desde el piso hasta un estante, el peso hace un trabajo negativo \(W_g=-mg\,\Delta y\). Ese trabajo no depende del camino: es el mismo si se sube en línea recta, en zigzag o por una escalera. Sólo importan las alturas inicial y final. Esto permite definir la <strong>energía potencial gravitacional</strong></p>
<div class="eq key" data-name="Energía potencial gravitacional">\[U_g=m\,g\,y,\qquad W_g=-\Delta U_g .\]</div>
<p>El origen de \(y\) se elige libremente: sólo tienen significado físico los <em>cambios</em> de energía potencial. Un libro de 1 kg en un estante de 2 m tiene 19.6 J respecto al piso y 0 J respecto al estante.</p>
<div class="box def">
<h4>Fuerza conservativa</h4>
<p>Una fuerza es conservativa si el trabajo que hace sobre una partícula que va de A a B no depende de la trayectoria, o, lo que es equivalente, si su trabajo en cualquier camino cerrado es cero. Para ellas puede definirse una energía potencial con \(W=-\Delta U\). La gravedad y la fuerza de un resorte son conservativas; la fricción no lo es: su trabajo es siempre negativo y crece con la longitud del recorrido.</p>
</div>
<div class="sim" data-sim="trayectorias" data-title="¿Depende el trabajo del camino? Gravedad y fricción"></div>
<div class="sim-guide"><ul>
<li>Compare los caminos: el trabajo del peso es idéntico en todos. El de la fricción cambia, porque depende de la distancia recorrida sobre la superficie.</li>
<li>Con \(\mu_k=0\) el trabajo total necesario para subir la caja es el mismo por cualquier camino: \(mgH\).</li>
</ul></div>
<div class="daily">
<h4>En la vida cotidiana</h4>
<div class="daily-grid">
<div class="dcard"><b>Centrales hidroeléctricas</b><p>El agua almacenada detrás de una represa tiene energía potencial. Cada metro cúbico que cae 100 m libera casi 1 MJ, que las turbinas convierten en electricidad.</p></div>
<div class="dcard"><b>Subir por la escalera o el ascensor</b><p>Llegar al quinto piso cuesta la misma energía potencial por cualquier camino: \(mgh\). Lo que cambia es la rapidez con que se entrega (la potencia).</p></div>
<div class="dcard"><b>Un relojero con pesas</b><p>Los relojes de péndulo antiguos funcionan con una pesa que baja lentamente: su energía potencial alimenta el mecanismo durante días.</p></div>
</div>
</div>
</section>

<section>
<h2>Energía potencial elástica</h2>
<p>El trabajo que hace un resorte tampoco depende del camino, sólo de la deformación inicial y final. Un resorte estirado o comprimido una distancia \(x\) almacena la <strong>energía potencial elástica</strong></p>
<div class="eq key" data-name="Energía potencial elástica">\[U_e=\tfrac12\,k\,x^2 .\]</div>
<p>Es siempre positiva (con el resorte relajado como referencia) y crece con el cuadrado de la deformación: comprimir el doble almacena cuatro veces más energía. Es la energía que devuelven un arco al disparar una flecha, una cama elástica al impulsar a un gimnasta o la garrocha de un saltador.</p>
</section>

<section>
<h2>Conservación de la energía mecánica</h2>
<p>Si sobre un cuerpo sólo hacen trabajo fuerzas conservativas, el teorema trabajo–energía \(W=\Delta K\) y la relación \(W=-\Delta U\) dan \(\Delta K+\Delta U=0\). La suma \(E=K+U\), la <strong>energía mecánica</strong>, permanece constante:</p>
<div class="eq key" data-name="Conservación de la energía mecánica">\[K_i+U_i=K_f+U_f\qquad\Longleftrightarrow\qquad \tfrac12mv_i^2+mgy_i\,(+\tfrac12kx_i^2)=\tfrac12mv_f^2+mgy_f\,(+\tfrac12kx_f^2).\]</div>
<p>La energía pasa de potencial a cinética y viceversa, pero el total no cambia. Un resultado inmediato: un objeto que parte del reposo y baja una altura \(h\) sin fricción llega con rapidez</p>
<div class="eq">\[v=\sqrt{2gh},\]</div>
<p>sin importar la forma del camino ni su masa. Una montaña rusa, un tobogán sin fricción y una piedra en caída libre desde la misma altura llegan abajo con la misma rapidez (aunque en tiempos distintos).</p>
<div class="sim" data-sim="pista-patinaje" data-title="Pista de patinaje: energía cinética, potencial y térmica"></div>
<div class="sim-guide"><ul>
<li>Arrastre al patinador hasta un punto de la pista y suéltelo: sin fricción, sube exactamente hasta la misma altura del otro lado. La barra de energía total no cambia.</li>
<li>En la gráfica de energía contra posición, la distancia vertical entre la línea de \(E\) y la curva de \(U\) es la energía cinética: donde se tocan, el patinador se detiene y regresa.</li>
<li>Agregue fricción: aparece energía térmica y el patinador sube cada vez menos, hasta quedar en el fondo.</li>
<li>Cambie la masa: todas las energías cambian en proporción, pero la rapidez en cada punto no.</li>
</ul></div>
<div class="box ex">
<h4>La primera caída de una montaña rusa</h4>
<p>Un carro sale casi del reposo desde la cima de una colina de 40 m y baja hasta el nivel del suelo. Sin fricción, ¿con qué rapidez llega abajo? ¿Qué rapidez tiene al pasar por una segunda cima de 25 m?</p>
<details><summary>Solución</summary>
<p>Abajo: \(v=\sqrt{2(9.8)(40)}=28.0\) m/s \(\approx101\) km/h. En la segunda cima: \(\tfrac12v^2=g(40-25)\), \(v=\sqrt{2(9.8)(15)}=17.1\) m/s. Nunca podrá pasar una cima de más de 40 m.</p>
<p><button class="try" type="button" data-try="pista-patinaje:montana">Probar en la simulación</button></p>
</details>
</div>
<div class="box ex">
<h4>El columpio</h4>
<p>Un niño en un columpio de 2.5 m se suelta desde el reposo con las cadenas formando 40° con la vertical. ¿Qué rapidez tiene al pasar por el punto más bajo?</p>
<details><summary>Solución</summary>
<p>Baja una altura \(h=L(1-\cos40^\circ)=2.5(0.234)=0.585\) m. Entonces \(v=\sqrt{2gh}=3.39\) m/s. La tensión de las cadenas no hace trabajo porque es perpendicular a la velocidad.</p>
</details>
</div>
<div class="daily">
<h4>En la vida cotidiana</h4>
<div class="daily-grid">
<div class="dcard"><b>Salto con garrocha</b><p>El atleta corre a unos 10 m/s: su energía cinética se almacena en la garrocha doblada y luego se convierte en altura. \(v^2/(2g)\approx5\) m, más la altura de su centro de masa: por eso el récord ronda los 6 m.</p></div>
<div class="dcard"><b>Patinetas en un medio tubo</b><p>El patinador “bombea” doblando las piernas para agregar energía; si se queda quieto, la fricción lo va deteniendo.</p><button class="try" type="button" data-try="pista-patinaje:friccion">Probar en la simulación</button></div>
<div class="dcard"><b>Rampas de frenado</b><p>En las carreteras de montaña hay rampas de escape en subida para camiones sin frenos: la energía cinética se convierte en potencial (y en calor en la grava).</p></div>
</div>
</div>
</section>

<section>
<h2>Fuerzas no conservativas y energía térmica</h2>
<p>Cuando actúa la fricción, la energía mecánica disminuye. No se pierde: se convierte en <strong>energía térmica</strong> (las superficies se calientan) y en sonido. Para un bloque que desliza una distancia \(d\) con fricción cinética \(f_k\),</p>
<div class="eq key" data-name="Energía y fricción">\[\Delta K+\Delta U=-f_k\,d\qquad\Longleftrightarrow\qquad \Delta K+\Delta U+\Delta E_{\text{térmica}}=0,\quad \Delta E_{\text{térmica}}=f_kd .\]</div>
<p>Si además actúan otras fuerzas externas (una persona que empuja, un motor), su trabajo se suma: \(\Delta K+\Delta U+\Delta E_{\text{térmica}}=W_{\text{otras}}\). Esta es la forma general del principio de conservación de la energía: la energía total de un sistema aislado es constante.</p>
<div class="sim" data-sim="resorte-bloque" data-title="Un bloque lanzado por un resorte: elástica, cinética, potencial y térmica"></div>
<div class="sim-guide"><ul>
<li>Observe el orden de las transformaciones: primero la energía elástica se convierte en cinética; luego la cinética en térmica (y en potencial si hay rampa).</li>
<li>La barra de energía total no cambia: la suma de todas las formas es constante.</li>
<li>Duplique la compresión: el bloque llega cuatro veces más lejos.</li>
</ul></div>
<div class="box ex">
<h4>¿Hasta dónde llega el bloque?</h4>
<p>Un resorte de \(k=200\) N/m comprimido 10 cm lanza un bloque de 0.10 kg sobre una mesa con \(\mu_k=0.30\) (sin fricción mientras el resorte lo empuja). ¿Qué distancia recorre sobre la zona rugosa?</p>
<details><summary>Solución</summary>
<p>Toda la energía elástica, \(\tfrac12(200)(0.10)^2=1.0\) J, termina como energía térmica: \(\mu_kmg\,d=1.0\) J, \(d=1.0/(0.30\cdot0.10\cdot9.8)=3.4\) m.</p>
<p><button class="try" type="button" data-try="resorte-bloque:juguete">Probar en la simulación</button></p>
</details>
</div>
<div class="daily">
<h4>En la vida cotidiana</h4>
<div class="daily-grid">
<div class="dcard"><b>Frenos calientes</b><p>Al frenar, la energía cinética del auto se convierte en energía térmica en los discos de freno: en una bajada larga pueden superar los 300 °C.</p></div>
<div class="dcard"><b>Frenado regenerativo</b><p>Los autos eléctricos usan el motor como generador al frenar y recuperan parte de la energía cinética en la batería en lugar de convertirla en calor.</p></div>

</section>

<section>
<h2>Fuerza y energía potencial: diagramas de energía</h2>
<p>Como \(W=-\Delta U\) y, para un desplazamiento pequeño, \(W=F_x\,\dd x\), la fuerza se obtiene de la energía potencial derivando:</p>
<div class="eq key" data-name="Fuerza a partir de la energía potencial">\[F_x=-\frac{\dd U}{\dd x}.\]</div>
<p>La fuerza apunta “cuesta abajo” en la gráfica de \(U(x)\), como una pelota en un paisaje de colinas. Esto permite leer mucha física en un <strong>diagrama de energía</strong>:</p>
<ul>
<li><strong>Puntos de equilibrio:</strong> donde la pendiente es cero, \(F=0\). En un mínimo de \(U\) el equilibrio es <em>estable</em> (una pequeña perturbación produce una fuerza de regreso); en un máximo es <em>inestable</em>.</li>
<li><strong>Puntos de retorno:</strong> con energía total \(E\), la partícula sólo puede estar donde \(U(x)\le E\), porque \(K=E-U\ge0\). Donde \(U=E\) se detiene y regresa.</li>
<li><strong>Regiones prohibidas:</strong> donde \(U\gt E\) la partícula no puede entrar (en física clásica).</li>
</ul>
<div class="sim" data-sim="diagrama-energia" data-title="Diagrama de energía potencial: equilibrio y puntos de retorno"></div>
<div class="sim-guide"><ul>
<li>En el doble pozo, con poca energía la partícula oscila en un solo valle; con más energía que la colina central, recorre ambos.</li>
<li>Coloque la energía justo en el máximo central: la partícula se acerca cada vez más despacio al equilibrio inestable.</li>
<li>En la molécula diatómica, la separación de equilibrio es el mínimo de \(U\); con energía positiva los átomos se separan (la molécula se disocia).</li>
</ul></div>
<div class="daily">
<h4>Equilibrio en la vida cotidiana</h4>
<div class="daily-grid">
<div class="dcard"><b>Una canica en un tazón</b><p>Equilibrio estable: si se empuja un poco, vuelve al fondo. Es un mínimo de energía potencial.</p></div>
<div class="dcard"><b>Un lápiz sobre su punta</b><p>Equilibrio inestable: la menor perturbación lo hace caer. Está en un máximo de energía potencial.</p></div>
<div class="dcard"><b>Enlaces químicos</b><p>Dos átomos de una molécula se mantienen a la distancia donde su energía potencial es mínima, y vibran alrededor de ella.</p><button class="try" type="button" data-try="diagrama-energia:molecula">Probar en la simulación</button></div>
</div>
</div>
</section>

<section>
<h2>Preguntas y problemas</h2>
<ol class="problems">
<li><span class="lvl">Concepto</span>Dos niños bajan desde la misma altura por toboganes sin fricción, uno recto y otro curvo. ¿Cuál llega con mayor rapidez? ¿Cuál llega primero?
<details><summary>Respuesta</summary><p>Llegan con la misma rapidez, \(\sqrt{2gh}\). Puede llegar primero el del tobogán curvo si es más empinado al principio, porque gana rapidez antes.</p></details></li>
<li><span class="lvl">Concepto</span>¿Puede ser negativa la energía cinética? ¿Y la potencial?
<details><summary>Respuesta</summary><p>La cinética nunca (\(\tfrac12mv^2\ge0\)). La potencial sí: depende de la referencia elegida (por ejemplo, un objeto por debajo del nivel \(y=0\)).</p></details></li>
<li><span class="lvl">Problema</span>Un clavadista de 60 kg salta desde una plataforma de 10 m con rapidez inicial de 2 m/s hacia arriba. ¿Con qué rapidez entra al agua?
<details><summary>Respuesta</summary><p>\(v=\sqrt{v_0^2+2gh}=\sqrt{4+196}=14.1\) m/s, independiente de la dirección inicial y de la masa.</p></details></li>
<li><span class="lvl">Problema</span>Un bloque de 2 kg comprime 20 cm un resorte de \(k=500\) N/m y se suelta sobre una rampa sin fricción. ¿Qué altura alcanza?
<details><summary>Respuesta</summary><p>\(\tfrac12(500)(0.2)^2=10\) J \(=mgh\), \(h=0.51\) m.</p></details></li>
<li><span class="lvl">Problema</span>Un esquiador de 70 kg baja 40 m de desnivel y llega abajo a 20 m/s. ¿Cuánta energía se transformó en térmica (fricción y aire)?
<details><summary>Respuesta</summary><p>\(mgh=27.4\) kJ; \(K=14.0\) kJ. La diferencia, 13.4 kJ, se disipó.</p></details></li>
</ol>
</section>
