<template class="chapter-src" data-id="angular" data-num="12" data-title="Momento angular" data-part="Parte V · Rotación y equilibrio" data-short="Momento angular de una partícula y de un cuerpo rígido, conservación, colisiones rotacionales, giroscopios y precesión">
<p class="lead">Una patinadora que recoge los brazos gira cada vez más rápido; un gato que cae siempre aterriza de pie; un trompo no se cae mientras gira. Todos estos fenómenos se explican con una cantidad que es a la rotación lo que el momento lineal es a la traslación: el momento angular, que también se conserva cuando no hay torques externos.</p>

<div class="keyideas"><ul>
<li>El momento angular de una partícula respecto a un punto es \(\vb{L}=\vb{r}\times\vb{p}\); para un cuerpo rígido que gira alrededor de un eje, \(L=I\omega\).</li>
<li>El torque neto es la rapidez de cambio del momento angular: \(\sum\vb{\tau}=\dd\vb{L}/\dd t\).</li>
<li>Si el torque externo neto es cero, el momento angular se conserva: \(I_i\omega_i=I_f\omega_f\).</li>
<li>Al cambiar su momento de inercia, un cuerpo cambia su rapidez angular; su energía cinética puede aumentar o disminuir.</li>
<li>Un torque perpendicular a \(\vb{L}\) no cambia su magnitud sino su dirección: es la precesión de un trompo o un giroscopio.</li>
</ul></div>

<section>
<h2>Momento angular de una partícula</h2>
<p>El <strong>momento angular</strong> de una partícula con momento lineal \(\vb{p}=m\vb{v}\), situada en la posición \(\vb{r}\) respecto a un origen O, es</p>
<div class="eq key" data-name="Momento angular de una partícula">\[\vb{L}=\vb{r}\times\vb{p},\qquad L=r\,p\,\sen\phi=m\,v\,r_\perp\qquad[\text{kg·m²/s}].\]</div>
<p>Depende del origen elegido. \(r_\perp\) es la distancia perpendicular de O a la línea del movimiento. Aunque una partícula se mueva en línea recta, tiene momento angular respecto a cualquier punto que no esté sobre esa recta. Derivando se obtiene el análogo rotacional de la segunda ley:</p>
<div class="eq key" data-name="Torque y momento angular">\[\sum\vb{\tau}=\frac{\dd\vb{L}}{\dd t}.\]</div>
<p>Si la fuerza sobre la partícula siempre apunta hacia O (una <strong>fuerza central</strong>, como la gravedad del Sol sobre un planeta), su torque respecto a O es nulo y \(\vb{L}\) se conserva. Una consecuencia geométrica: el vector posición barre áreas iguales en tiempos iguales, \(\dd A/\dd t=L/(2m)\). Es la segunda ley de Kepler (capítulo 14).</p>
<div class="sim" data-sim="L-particula" data-title="Momento angular de una partícula: áreas iguales en tiempos iguales"></div>
<div class="sim-guide"><ul>
<li>Una partícula libre en línea recta barre triángulos de igual área cada intervalo: su momento angular es constante aunque \(r\) cambie.</li>
<li>Arrastre el origen O: \(L\) cambia de valor (depende del origen) pero sigue siendo constante en el tiempo.</li>
<li>Con una fuerza central (resorte) la trayectoria se curva y \(L\) se conserva; con la gravedad uniforme, la fuerza no apunta a O y \(L\) cambia.</li>
</ul></div>
</section>

<section>
<h2>Momento angular de un cuerpo rígido</h2>
<p>Para un cuerpo rígido que gira alrededor de un eje fijo con rapidez angular ω, cada partícula tiene \(L_i=m_ir_i^2\omega\). Sumando, la componente a lo largo del eje es</p>
<div class="eq key" data-name="Momento angular de un cuerpo rígido">\[L=I\,\omega,\qquad \sum\tau=\frac{\dd L}{\dd t}=I\alpha\ \ (\text{si } I \text{ es constante}).\]</div>
<p>Es la versión rotacional de \(p=mv\). La dirección de \(\vb{L}\) se obtiene con la regla de la mano derecha: si los dedos siguen el giro, el pulgar apunta en la dirección de \(\vb{L}\).</p>
</section>

<section>
<h2>Conservación del momento angular</h2>
<div class="box law">
<h4>Conservación del momento angular</h4>
<p>Si el torque externo neto sobre un sistema es cero, su momento angular total permanece constante:</p>
<div class="eq">\[I_i\,\omega_i=I_f\,\omega_f .\]</div>
</div>
<p>A diferencia del momento lineal, aquí la inercia <em>puede cambiar</em> sin que el cuerpo pierda o gane masa: basta con redistribuirla. Una patinadora que acerca los brazos al cuerpo reduce su momento de inercia y, como \(L\) no cambia, su rapidez angular aumenta. Su energía cinética \(K=L^2/(2I)\) también aumenta: la energía extra sale del trabajo de sus músculos al tirar de los brazos hacia adentro.</p>
<div class="sim" data-sim="patinadora" data-title="La patinadora y la silla giratoria con pesas"></div>
<div class="sim-guide"><ul>
<li>Recoja los brazos: el momento de inercia baja, ω sube y la línea de \(L\) en la gráfica se mantiene plana.</li>
<li>Compare la energía cinética antes y después: aumenta aunque nada externo haya empujado la rotación.</li>
</ul></div>
<div class="box ex">
<h4>La patinadora</h4>
<p>Una patinadora gira a 1.5 vueltas por segundo con los brazos extendidos (\(I=4.0\) kg·m²). Al recogerlos su momento de inercia baja a 1.6 kg·m². ¿Con qué rapidez gira ahora? ¿Qué pasa con su energía cinética?</p>
<details><summary>Solución</summary>
<p>\(\omega_f=\omega_i\,I_i/I_f=1.5(4.0/1.6)=3.75\) vueltas/s. La energía \(K=\tfrac12I\omega^2\) pasa de \(\tfrac12(4.0)(9.42)^2=178\) J a \(\tfrac12(1.6)(23.6)^2=444\) J: aumenta en un factor \(I_i/I_f=2.5\).</p>
<p><button class="try" type="button" data-try="patinadora:patinadora">Probar en la simulación</button></p>
</details>
</div>
<h3>Colisiones rotacionales</h3>
<p>En un choque entre un cuerpo que se traslada y otro que puede girar alrededor de un eje fijo, el momento lineal no se conserva (el eje ejerce una fuerza), pero el momento angular respecto al eje sí, porque esa fuerza no produce torque. Si una bola de plastilina de masa \(m\) y rapidez \(v\) golpea una puerta a una distancia \(d\) de las bisagras y queda pegada,</p>
<div class="eq">\[m\,v\,d=\left(I_{\text{puerta}}+m\,d^2\right)\omega_f .\]</div>
<div class="sim" data-sim="colision-rotacional" data-title="Choques rotacionales: una bola contra una puerta y dos discos que se acoplan"></div>
<div class="sim-guide"><ul>
<li>Golpee la puerta cerca de las bisagras y luego lejos: con el mismo proyectil, la puerta gira mucho más rápido si el golpe es lejos del eje.</li>
<li>En los discos, el momento angular total se conserva al acoplarse, pero parte de la energía se pierde en la fricción entre ellos.</li>
</ul></div>
<div class="daily">
<h4>En la vida cotidiana</h4>
<div class="daily-grid">
<div class="dcard"><b>Clavadistas y gimnastas</b><p>Salen del trampolín con un momento angular fijo. Al encogerse (posición “bolita”) reducen \(I\) hasta cuatro veces y dan varias vueltas; al estirarse antes de entrar al agua, casi dejan de girar.</p></div>
<div class="dcard"><b>El gato que cae</b><p>Un gato que cae de espaldas logra girar sin momento angular total: tuerce una mitad del cuerpo con las patas recogidas (poca inercia) y la otra con las patas extendidas.</p></div>
<div class="dcard"><b>Estrellas de neutrones</b><p>Cuando una estrella de radio 10⁶ km colapsa a unos 10 km, su momento de inercia cae en un factor enorme: los púlsares giran cientos de veces por segundo.</p></div>
<div class="dcard"><b>El helicóptero</b><p>El rotor principal haría girar el cuerpo en sentido contrario; el rotor de cola produce el torque que lo impide.</p></div>
</div>
</div>
</section>

<section>
<h2>Giroscopios y precesión</h2>
<p>Un torque no siempre hace girar más rápido. Si el torque es perpendicular a \(\vb{L}\), el cambio \(\dd\vb{L}=\vb{\tau}\,\dd t\) también es perpendicular: la magnitud de \(\vb{L}\) no cambia, pero su dirección gira. Es lo que ocurre con un trompo inclinado o con una rueda que gira sostenida de un solo extremo de su eje: en lugar de caer, el eje gira lentamente en un plano horizontal. Ese movimiento es la <strong>precesión</strong>, con rapidez angular</p>
<div class="eq key" data-name="Precesión de un giroscopio">\[\Omega=\frac{\tau}{L}=\frac{M\,g\,r}{I\,\omega}.\]</div>
<p>Cuanto más rápido gira la rueda (mayor \(L\)), más lenta es la precesión. La fórmula es válida mientras \(\Omega\ll\omega\); si la rueda gira muy despacio, simplemente cae.</p>
<div class="sim" data-sim="giroscopio" data-title="Precesión de un giroscopio: la rueda que no se cae"></div>
<div class="sim-guide"><ul>
<li>El vector \(\vb{\tau}\) (azul) es siempre perpendicular a \(\vb{L}\) (magenta), y \(\vb{L}\) gira en su dirección.</li>
<li>Reduzca la rapidez de giro: la precesión se acelera. Por debajo de cierto valor aparece la advertencia de que la aproximación giroscópica deja de valer.</li>
</ul></div>
<div class="daily">
<h4>En la vida cotidiana</h4>
<div class="daily-grid">
<div class="dcard"><b>Trompos y peonzas</b><p>Mientras gira rápido, el trompo inclinado precesa en lugar de caer. Al frenarse, la precesión se acelera, se tambalea y cae.</p></div>
<div class="dcard"><b>La bicicleta</b><p>Las ruedas en movimiento tienen momento angular; cuando la bicicleta se inclina, el torque del peso hace girar el manubrio hacia el lado de la caída, lo que ayuda a enderezarla.</p></div>
<div class="dcard"><b>La precesión de la Tierra</b><p>El Sol y la Luna ejercen un torque sobre el abultamiento ecuatorial terrestre: el eje de la Tierra precesa con un periodo de unos 26 000 años. Dentro de 12 000 años la “estrella polar” será Vega.</p></div>
<div class="dcard"><b>Giroscopios de navegación</b><p>Un giroscopio que gira muy rápido mantiene su orientación en el espacio: se usa en aviones, satélites y en los celulares (en versión microscópica).</p></div>
</div>
</div>
</section>

<section>
<h2>Preguntas y problemas</h2>
<ol class="problems">
<li><span class="lvl">Concepto</span>¿Puede tener momento angular una partícula que se mueve en línea recta?
<details><summary>Respuesta</summary><p>Sí, respecto a cualquier punto que no esté sobre su trayectoria: \(L=mvr_\perp\). Es constante si no hay fuerzas.</p></details></li>
<li><span class="lvl">Concepto</span>Si el casquete polar se derritiera y el agua se repartiera por los océanos, ¿se alargaría o se acortaría el día?
<details><summary>Respuesta</summary><p>Se alargaría: la masa se alejaría del eje, el momento de inercia de la Tierra aumentaría y, al conservarse \(L\), ω disminuiría.</p></details></li>
<li><span class="lvl">Problema</span>Un disco de 2 kg y 0.1 m de radio gira a 30 rad/s. Se deja caer sobre él, coaxialmente, otro disco idéntico en reposo, y ambos terminan girando juntos. Halle la rapidez final y la energía perdida.
<details><summary>Respuesta</summary><p>\(\omega_f=15\) rad/s. \(K_i=\tfrac12(0.01)(900)=4.5\) J; \(K_f=\tfrac12(0.02)(225)=2.25\) J: se pierde la mitad.</p></details></li>
<li><span class="lvl">Problema</span>Una bola de plastilina de 50 g a 10 m/s golpea perpendicularmente una puerta de 15 kg y 0.8 m de ancho a 0.7 m de las bisagras y queda pegada. ¿Con qué rapidez angular gira la puerta?
<details><summary>Respuesta</summary><p>\(I=\tfrac13(15)(0.8)^2+0.05(0.7)^2=3.2+0.0245=3.22\) kg·m². \(\omega=0.05(10)(0.7)/3.22=0.109\) rad/s.</p></details></li>
</ol>
</section>
