<template class="chapter-src" data-id="equilibrio" data-num="14" data-title="Equilibrio estático y elasticidad" data-part="Parte V · Rotación y equilibrio" data-short="Condiciones de equilibrio, centro de gravedad, palancas, escaleras y vigas, estabilidad, esfuerzo, deformación y módulos elásticos">
<p class="lead">Puentes, edificios, grúas, estanterías y el propio esqueleto humano se diseñan para <em>no</em> moverse. La estática estudia los cuerpos en equilibrio: qué fuerzas y torques deben equilibrarse para que nada acelere ni gire, y qué tanto se deforman los materiales bajo carga antes de romperse.</p>

<div class="keyideas"><ul>
<li>Un cuerpo rígido está en equilibrio si la fuerza neta y el torque neto son cero: \(\sum\vb{F}=0\) y \(\sum\vb{\tau}=0\).</li>
<li>Si \(\sum\vb{F}=0\), el torque neto es el mismo respecto a cualquier punto: conviene elegir uno por donde pasen fuerzas desconocidas.</li>
<li>El peso actúa en el centro de gravedad; un cuerpo apoyado es estable mientras la vertical que pasa por él caiga dentro de la base.</li>
<li>Los materiales se deforman en proporción al esfuerzo (ley de Hooke): \(\sigma=Y\varepsilon\), hasta el límite elástico.</li>
<li>Más allá del límite elástico queda una deformación permanente; al superar la resistencia última el material se rompe.</li>
</ul></div>

<section>
<h2>Condiciones de equilibrio</h2>
<p>Para una partícula bastaba \(\sum\vb{F}=0\). Un cuerpo extenso puede tener fuerza neta cero y aun así empezar a girar: dos fuerzas iguales y opuestas aplicadas en puntos distintos (un <em>par</em>) producen torque. Por eso un cuerpo rígido en <strong>equilibrio estático</strong> debe cumplir dos condiciones:</p>
<div class="eq key" data-name="Condiciones de equilibrio">\[\sum\vb{F}=0\quad\Longleftrightarrow\quad \sum F_x=0,\ \ \sum F_y=0;\qquad\qquad \sum\tau=0\ \ (\text{respecto a cualquier punto}).\]</div>
<p>La primera garantiza que el centro de masa no acelere; la segunda, que el cuerpo no adquiera aceleración angular. En problemas planos se tienen tres ecuaciones, así que pueden hallarse hasta tres incógnitas.</p>
<div class="box note">
<p><strong>Estrategia.</strong> Dibuje el diagrama de cuerpo libre con cada fuerza en su punto de aplicación. Elija como pivote para los torques un punto por donde pasen una o más fuerzas desconocidas (sus torques son cero) y resuelva primero esa ecuación. Luego use \(\sum F_x=0\) y \(\sum F_y=0\).</p>
</div>
</section>

<section>
<h2>Centro de gravedad y palancas</h2>
<p>El peso de un cuerpo extenso se reparte entre todas sus partículas, pero para calcular torques puede reemplazarse por una sola fuerza \(Mg\) aplicada en el <strong>centro de gravedad</strong>, que en un campo gravitacional uniforme coincide con el centro de masa. En una varilla uniforme está en su punto medio.</p>
<p>Una <strong>palanca</strong> es una barra rígida que gira alrededor de un punto de apoyo. En equilibrio, los torques de las fuerzas a cada lado se compensan: \(F_1d_1=F_2d_2\). Una fuerza pequeña con un brazo largo equilibra una fuerza grande con un brazo corto. Arquímedes lo resumió en su famosa frase: “Denme un punto de apoyo y moveré el mundo”.</p>
<div class="sim" data-sim="balancin" data-title="El balancín: equilibrio de torques"></div>
<div class="sim-guide"><ul>
<li>Arrastre a las personas sobre la tabla y observe las barras de torque: la tabla se nivela cuando la suma es cero.</li>
<li>Un adulto puede equilibrar a un niño si se sienta más cerca del apoyo: \(m_1d_1=m_2d_2\).</li>
<li>Mueva el punto de apoyo: el peso de la propia tabla también produce torque si su centro no está sobre el apoyo.</li>
</ul></div>
<div class="box ex">
<h4>Papá e hijo en el balancín</h4>
<p>Un niño de 25 kg se sienta a 2.0 m del apoyo de un balancín. ¿A qué distancia del apoyo, del otro lado, debe sentarse su papá de 80 kg para equilibrarlo? ¿Qué fuerza hace el apoyo si la tabla pesa 200 N?</p>
<details><summary>Solución</summary>
<p>Con la tabla centrada en el apoyo: \(25(2.0)=80\,d\), \(d=0.625\) m. El apoyo sostiene todo: \(n=(25+80)(9.8)+200=1229\) N.</p>
<p><button class="try" type="button" data-try="balancin:papa">Probar en la simulación</button></p>
</details>
</div>
<div class="daily">
<h4>Palancas en la vida cotidiana</h4>
<div class="daily-grid">
<div class="dcard"><b>Tijeras y alicates</b><p>El apoyo está entre la mano y el objeto: cuanto más lejos del eje se agarran y más cerca se corta, mayor es la fuerza de corte.</p></div>

<section>
<h2>Aplicaciones: escaleras, vigas y el cuerpo humano</h2>
<h3>La escalera apoyada en la pared</h3>
<p>Una escalera de longitud \(L\) y peso \(Mg\) se apoya en una pared lisa formando un ángulo \(\theta\) con el suelo. La pared sólo empuja horizontalmente (\(n_p\)); el suelo empuja hacia arriba (\(n_s\)) y la fricción del suelo impide que la base resbale. Tomando torques respecto a la base:</p>
<div class="eq">\[n_p\,L\sen\theta=Mg\,\frac{L}{2}\cos\theta+m g\,d\cos\theta,\qquad f=n_p,\qquad n_s=(M+m)g .\]</div>
<p>La escalera no resbala mientras \(f\le\mu_sn_s\). Cuanto más alto sube la persona (mayor \(d\)) o más acostada está la escalera (menor θ), mayor es la fricción necesaria: por eso los accidentes suelen ocurrir cerca de la parte alta.</p>
<h3>El letrero y el cable</h3>
<p>Una viga horizontal articulada en la pared y sostenida por un cable inclinado es otro caso clásico: los torques respecto a la bisagra dan la tensión del cable, y las fuerzas en \(x\) e \(y\) dan la reacción de la bisagra.</p>
<div class="sim" data-sim="escalera" data-title="Equilibrio en la práctica: la escalera, el letrero y el brazo"></div>
<div class="sim-guide"><ul>
<li>Suba a la persona por la escalera y observe cuándo la fricción necesaria supera la disponible.</li>
<li>En el letrero, un cable casi horizontal necesita una tensión enorme; a 45° o más la tensión se mantiene moderada.</li>
<li>En el brazo, compare el peso en la mano con la fuerza del bíceps: la ventaja mecánica es menor que 1.</li>
</ul></div>
<div class="box ex">
<h4>¿Resbala la escalera?</h4>
<p>Una escalera de 5.0 m y 12 kg forma 60° con el suelo (\(\mu_s=0.40\)). Una persona de 70 kg sube hasta 4.0 m a lo largo de la escalera. ¿Resbala?</p>
<details><summary>Solución</summary>
<p>\(n_p=\dfrac{9.8\cos60^\circ\,[12(2.5)+70(4.0)]}{5.0\sen60^\circ}=\dfrac{4.9(310)}{4.33}=351\) N. Fricción disponible: \(0.40(82)(9.8)=321\) N. Como 351 N &gt; 321 N, la escalera resbala antes de que la persona llegue a 4 m.</p>
<p><button class="try" type="button" data-try="escalera:escalera">Probar en la simulación</button></p>
</details>
</div>
</section>

<section>
<h2>Estabilidad: ¿desliza o se vuelca?</h2>
<p>Un cuerpo apoyado sobre una base está en equilibrio estable mientras la línea vertical que pasa por su centro de gravedad cae dentro de la base de apoyo. Si se inclina más allá, el peso produce un torque que lo vuelca. Por eso los objetos con base ancha y centro de gravedad bajo son más estables.</p>
<p>Sobre un plano que se inclina poco a poco, una caja de base \(b\) y altura \(h\) (con el centro de gravedad en la mitad) empieza a deslizar cuando \(\tan\theta=\mu_s\) y a volcarse cuando \(\tan\theta=b/h\). Lo que ocurra primero depende de cuál de los dos números es menor.</p>
<div class="sim" data-sim="volcar" data-title="Una caja en un plano que se inclina: ¿desliza o se vuelca?"></div>
<div class="sim-guide"><ul>
<li>Con una caja alta y angosta, la vertical del centro de gravedad sale de la base antes de que deslice: se vuelca.</li>
<li>Con una caja baja y ancha, desliza primero.</li>
</ul></div>
<div class="daily">
<h4>En la vida cotidiana</h4>
<div class="daily-grid">
<div class="dcard"><b>Buses y camiones</b><p>Un camión cargado en lo alto tiene el centro de gravedad elevado: en una curva cerrada puede volcarse antes de derrapar.</p></div>
<div class="dcard"><b>La torre de Pisa</b><p>Está inclinada unos 4°, pero la vertical de su centro de gravedad aún cae dentro de la base. Las obras de 1990–2001 redujeron su inclinación desde 5.5°.</p></div>
<div class="dcard"><b>Llevar una carga</b><p>Al cargar un balde con una mano, inclinamos el cuerpo hacia el otro lado para mantener el centro de gravedad sobre los pies.</p></div>
</div>
</div>
</section>

<section>
<h2>Elasticidad: esfuerzo, deformación y módulos</h2>
<p>Ningún cuerpo es perfectamente rígido: una varilla de acero se estira, una columna se acorta, una goma se deforma mucho. Para comparar materiales sin depender del tamaño del objeto se definen el <strong>esfuerzo</strong> (fuerza por unidad de área) y la <strong>deformación unitaria</strong> (cambio relativo de longitud):</p>
<div class="eq key" data-name="Esfuerzo y deformación">\[\sigma=\frac{F}{A}\quad[\text{Pa}],\qquad \varepsilon=\frac{\Delta L}{L_0}\quad[\text{adimensional}],\qquad \sigma=Y\,\varepsilon .\]</div>
<p>La última relación es la ley de Hooke para materiales; la constante \(Y\) es el <strong>módulo de Young</strong>. Equivale a \(\Delta L=\dfrac{F\,L_0}{A\,Y}\): un alambre se estira más si es largo y delgado.</p>
<h3>Más allá del régimen elástico</h3>
<ul>
<li><strong>Límite de proporcionalidad y límite elástico:</strong> hasta aquí la deformación desaparece al retirar la carga.</li>
<li><strong>Fluencia:</strong> el material se deforma plásticamente; al descargarlo queda una <em>deformación permanente</em> (la descarga sigue una recta paralela a la zona elástica).</li>
<li><strong>Resistencia última:</strong> el máximo esfuerzo que soporta; después aparece un “cuello” y se rompe.</li>
<li><strong>Materiales frágiles</strong> (vidrio, cerámica) se rompen casi sin deformación plástica; los <strong>dúctiles</strong> (acero, cobre) se estiran mucho antes de romper.</li>
</ul>

<thead><tr><th>Material</th><th class="c">Módulo de Young \(Y\) (GPa)</th><th class="c">Resistencia a la tensión (MPa)</th></tr></thead>

<tr><td>Aluminio (aleación 6061)</td><td class="num c">70</td><td class="num c">310</td></tr>

<p>Hay módulos análogos para otras deformaciones: el <strong>módulo de corte</strong> \(S\) (fuerzas paralelas a una cara, como al cortar un papel) y el <strong>módulo volumétrico</strong> \(B=-\Delta P/(\Delta V/V)\) (compresión uniforme, como en el fondo del mar).</p>
<div class="sim" data-sim="elasticidad" data-title="Ensayo de tracción: curva esfuerzo–deformación"></div>
<div class="sim-guide"><ul>
<li>Cargue el alambre de acero dentro de la zona recta y descárguelo: vuelve a su longitud original.</li>
<li>Pase la fluencia y descargue: la descarga es una recta paralela a la zona elástica y queda una deformación permanente.</li>
<li>Compare el vidrio (frágil) con el cobre (dúctil) y con el caucho, cuya curva no es una recta aunque sea elástico.</li>
</ul></div>
<div class="box ex">
<h4>El cable de un ascensor</h4>
<p>Un cable de acero de 20 m y 1.0 cm de diámetro sostiene una cabina de 800 kg. ¿Cuánto se estira? ¿Qué fracción de su resistencia utiliza?</p>
<details><summary>Solución</summary>
<p>\(A=\pi(0.005)^2=7.85\times10^{-5}\) m². \(\sigma=\dfrac{7840}{7.85\times10^{-5}}=1.0\times10^8\) Pa = 100 MPa. \(\Delta L=\dfrac{\sigma L_0}{Y}=\dfrac{10^8(20)}{2\times10^{11}}=1.0\) cm. Usa la cuarta parte de la resistencia de 400 MPa: un factor de seguridad de 4 (en la práctica se exige más de 10 y se usan varios cables).</p>
</details>
</div>
<div class="daily">
<h4>En la vida cotidiana</h4>
<div class="daily-grid">
<div class="dcard"><b>Las cuerdas de una guitarra</b><p>Se tensan a unos cientos de newtons y se estiran pocos milímetros; al afinar se ajusta esa tensión, que determina la frecuencia (capítulo 18).</p></div>
<div class="dcard"><b>Varillas de construcción</b><p>El concreto resiste muy bien la compresión pero poco la tracción; por eso se refuerza con varillas de acero en las zonas que se estiran.</p></div>
<div class="dcard"><b>Huesos</b><p>Un fémur resiste compresiones de varios miles de newtons, pero se fractura con torsiones o golpes laterales mucho menores.</p></div>

<section>
<h2>Preguntas y problemas</h2>
<ol class="problems">
<li><span class="lvl">Concepto</span>¿Puede un cuerpo estar en equilibrio si sobre él actúa una sola fuerza? ¿Y con dos?
<details><summary>Respuesta</summary><p>Con una sola fuerza no (la fuerza neta no sería cero). Con dos, sólo si son iguales, opuestas y actúan a lo largo de la misma línea (si no, forman un par que produce torque).</p></details></li>
<li><span class="lvl">Concepto</span>¿Por qué es más fácil volcar una botella vacía de pie que una llena hasta la mitad?
<details><summary>Respuesta</summary><p>La llena tiene el centro de gravedad más bajo (y más masa): hace falta inclinarla más para que la vertical salga de la base.</p></details></li>
<li><span class="lvl">Problema</span>Una tabla uniforme de 4 m y 20 kg se apoya en dos caballetes en sus extremos. Una persona de 60 kg se para a 1 m del extremo izquierdo. ¿Qué fuerza hace cada caballete?
<details><summary>Respuesta</summary><p>Torques en el izquierdo: \(4F_D=20(9.8)(2)+60(9.8)(1)\), \(F_D=245\) N; \(F_I=784-245=539\) N.</p></details></li>
<li><span class="lvl">Problema</span>Un alambre de cobre de 2 m y 1 mm de diámetro sostiene 5 kg. ¿Cuánto se estira?
<details><summary>Respuesta</summary><p>\(\sigma=49/7.85\times10^{-7}=62\) MPa (aún elástico); \(\Delta L=\sigma L_0/Y=1.1\) mm.</p></details></li>
</ol>
