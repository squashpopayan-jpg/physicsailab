    <p class="home-lead">Todo el curso de mecánica newtoniana en un solo lugar. Cada capítulo explica los conceptos con palabras simples y con sus ecuaciones, los conecta con situaciones cotidianas y los pone a prueba en simulaciones donde se puede cambiar cada parámetro y leer las gráficas con detalle.</p>

<div class="home-howto">
  <div><b>Conceptos claros</b><p>Cada tema empieza por la idea física, sigue con las ecuaciones y termina con los errores más comunes que conviene evitar.</p></div>
  <div><b>Simulaciones con todos los parámetros</b><p>Deslizadores, selectores y objetos arrastrables. Haz clic en cualquier valor numérico para escribirlo con exactitud.</p></div>
