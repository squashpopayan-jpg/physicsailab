<section>
<h2>Ecuaciones clave por capítulo</h2>
<h3>Cinemática (capítulos 3 y 4)</h3>
<div class="eq">\[v=\frac{\dd x}{\dd t},\quad a=\frac{\dd v}{\dd t};\qquad \text{MRUA: } v=v_0+at,\quad x=x_0+v_0t+\tfrac12at^2,\quad v^2=v_0^2+2a\,\Delta x\]</div>
<div class="eq">\[\text{Proyectil: } x=v_0\cos\theta\,t,\quad y=v_0\sen\theta\,t-\tfrac12gt^2,\quad R=\frac{v_0^2\sen2\theta}{g};\qquad a_c=\frac{v^2}{r}=\omega^2r\]</div>
<h3>Dinámica (capítulos 5, 6 y 7)</h3>
<div class="eq">\[\sum\vb F=m\vb a,\qquad \vb F_{AB}=-\vb F_{BA},\qquad \sum F_r=m\frac{v^2}{r}\]</div>
<div class="eq">\[\text{Fuerzas: } w=mg,\quad f_s\le\mu_sn,\quad f_k=\mu_kn,\quad F_e=-kx,\quad F_D=\tfrac12C\rho Av^2,\quad B=\rho_fV_{\text{sum}}\,g\]</div>
<div class="eq">\[\text{Equilibrio: } \sum F_x=0,\ \sum F_y=0;\qquad \text{cuerpos unidos: } a=\frac{\sum F_{\text{ext}}}{M}\]</div>
<h3>Trabajo, energía y potencia (capítulos 8 y 9)</h3>
<div class="eq">\[W=\int\vb F\cdot\dd\vb r=Fd\cos\phi,\quad K=\tfrac12mv^2,\quad W_{\text{neto}}=\Delta K,\quad U_g=mgy,\quad U_e=\tfrac12kx^2,\quad P=\frac{\dd W}{\dd t}=\vb F\cdot\vb v\]</div>
<div class="eq">\[K_i+U_i+W_{\text{otras}}=K_f+U_f,\qquad F_x=-\frac{\dd U}{\dd x}\]</div>
<h3>Momento lineal y colisiones (capítulo 10)</h3>
<div class="eq">\[\vb p=m\vb v,\quad \vb J=\int\vb F\,\dd t=\Delta\vb p,\quad \sum\vb p_i=\sum\vb p_f\ (\text{sistema aislado}),\quad \vb r_{cm}=\frac{\sum m_i\vb r_i}{M}\]</div>
<div class="eq">\[\text{Elástica 1D (2 en reposo): } v_{1f}=\frac{m_1-m_2}{m_1+m_2}v_{1i},\quad v_{2f}=\frac{2m_1}{m_1+m_2}v_{1i};\qquad \text{cohete: } v=v_0+v_e\ln\frac{m_0}{m}\]</div>
<h3>Rotación (capítulos 11, 12 y 13)</h3>
<div class="eq">\[s=r\theta,\ v=r\omega,\ a_t=r\alpha;\quad I=\sum m_ir_i^2,\quad I=I_{cm}+Md^2;\quad K=\tfrac12I\omega^2;\quad \vb\tau=\vb r\times\vb F,\ \sum\tau=I\alpha\]</div>
<div class="eq">\[\text{Rodadura: } v_{cm}=R\omega,\quad K=\tfrac12Mv_{cm}^2+\tfrac12I_{cm}\omega^2;\qquad \vb L=\vb r\times\vb p=I\vb\omega,\quad \sum\vb\tau=\frac{\dd\vb L}{\dd t},\quad \Omega=\frac{Mgr}{I\omega}\]</div>
<h3>Equilibrio y elasticidad (capítulo 14)</h3>
<div class="eq">\[\sum\vb F=0,\quad \sum\vb\tau=0;\qquad \sigma=\frac{F}{A},\quad \varepsilon=\frac{\Delta L}{L_0},\quad \sigma=Y\varepsilon,\quad \Delta L=\frac{FL_0}{AY}\]</div>
<h3>Gravitación (capítulo 15)</h3>
<div class="eq">\[F=\frac{Gm_1m_2}{r^2},\quad g=\frac{GM}{r^2},\quad U=-\frac{GMm}{r},\quad v_{\text{esc}}=\sqrt{\frac{2GM}{R}},\quad v_{\text{orb}}=\sqrt{\frac{GM}{r}},\quad T^2=\frac{4\pi^2}{GM}a^3\]</div>
<h3>Fluidos (capítulo 16)</h3>
<div class="eq">\[\rho=\frac mV,\quad P=P_0+\rho gh,\quad F_2=F_1\frac{A_2}{A_1},\quad B=\rho_fV_{\text{sum}}g,\quad A_1v_1=A_2v_2,\quad P+\tfrac12\rho v^2+\rho gy=\text{cte},\quad v=\sqrt{2gh}\]</div>
<h3>Oscilaciones (capítulo 17)</h3>
<div class="eq">\[x=A\cos(\omega t+\phi),\quad \omega=\sqrt{\frac km},\quad T=2\pi\sqrt{\frac mk},\quad E=\tfrac12kA^2,\quad T_{\text{péndulo}}=2\pi\sqrt{\frac Lg},\quad T_{\text{físico}}=2\pi\sqrt{\frac{I}{mgd}}\]</div>
<div class="eq">\[\gamma=\frac{b}{2m},\quad \omega'=\sqrt{\omega_0^2-\gamma^2},\quad A(\omega)=\frac{F_0/m}{\sqrt{(\omega_0^2-\omega^2)^2+(2\gamma\omega)^2}}\]</div>
<h3>Ondas y sonido (capítulos 18 y 19)</h3>
<div class="eq">\[v=\lambda f,\quad y=A\sen(kx-\omega t),\quad k=\frac{2\pi}{\lambda},\quad v=\sqrt{\frac F\mu},\quad P=\tfrac12\mu v\omega^2A^2,\quad f_n=\frac{nv}{2L}\ (\text{cuerda})\]</div>
<div class="eq">\[\beta=10\log\frac{I}{I_0},\quad I=\frac{P}{4\pi r^2},\quad f'=f\,\frac{v+v_o}{v-v_s},\quad f_{\text{puls}}=\abs{f_1-f_2},\quad f_n=\frac{nv}{2L}\ \text{(abierto)},\ \ f_n=\frac{nv}{4L}\ (n\text{ impar, cerrado})\]</div>
</section>

<section>
<h2>Matemáticas útiles</h2>
<div class="eq">\[\sen^2\theta+\cos^2\theta=1,\quad \sen2\theta=2\sen\theta\cos\theta,\quad \cos2\theta=\cos^2\theta-\sen^2\theta,\quad \sen(a\pm b)=\sen a\cos b\pm\cos a\sen b\]</div>
<div class="eq">\[\sen a+\sen b=2\sen\frac{a+b}{2}\cos\frac{a-b}{2},\qquad \text{ángulos pequeños: } \sen\theta\approx\tg\theta\approx\theta,\ \ \cos\theta\approx1-\tfrac{\theta^2}{2}\]</div>
<div class="eq">\[ax^2+bx+c=0\ \Rightarrow\ x=\frac{-b\pm\sqrt{b^2-4ac}}{2a};\qquad (1+x)^n\approx1+nx\ \ (\abs x\ll1)\]</div>
<div class="eq">\[\vb A\cdot\vb B=AB\cos\phi=A_xB_x+A_yB_y+A_zB_z,\qquad \abs{\vb A\times\vb B}=AB\sen\phi\]</div>
<div class="eq">\[\frac{\dd}{\dd x}x^n=nx^{n-1},\quad \frac{\dd}{\dd x}\sen kx=k\cos kx,\quad \frac{\dd}{\dd x}e^{kx}=ke^{kx},\quad \int x^n\dd x=\frac{x^{n+1}}{n+1},\quad \int\frac{\dd x}{x}=\ln x\]</div>
<div class="eq">\[\log(ab)=\log a+\log b,\quad \log a^n=n\log a,\quad 10\log2\approx3,\quad 20\log2\approx6\]</div>
