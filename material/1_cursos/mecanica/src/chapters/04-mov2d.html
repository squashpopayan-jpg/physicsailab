<template class="chapter-src" data-id="mov2d" data-num="4" data-title="Movimiento en dos dimensiones" data-part="Parte II · Cinemática" data-short="Vectores posición, velocidad y aceleración; proyectiles; movimiento circular; movimiento relativo">
<p class="lead">Cuando un balón vuela hacia el arco o un auto toma una curva, la velocidad cambia de dirección además de magnitud. Con vectores, el movimiento en el plano se descompone en dos movimientos rectilíneos que ocurren al mismo tiempo pero no se afectan entre sí. Esa idea, que ya usaba Galileo, basta para entender proyectiles, curvas y corrientes.</p>

<div class="keyideas"><ul>
<li>Posición, velocidad y aceleración son vectores; la velocidad siempre es tangente a la trayectoria.</li>
<li>En un proyectil sin aire, el movimiento horizontal es uniforme y el vertical es caída libre: son independientes.</li>
<li>La trayectoria de un proyectil es una parábola; en terreno plano el alcance máximo se logra a 45°.</li>
<li>En el movimiento circular uniforme la rapidez es constante, pero hay una aceleración \(v^2/r\) dirigida al centro.</li>
<li>La velocidad depende del observador: \(\vb{v}_{P/A}=\vb{v}_{P/B}+\vb{v}_{B/A}\).</li>
</ul></div>

<section>
<h2>Posición, velocidad y aceleración en el plano</h2>
<p>En dos dimensiones la posición de una partícula es un vector que va del origen hasta ella, \(\vb{r}(t)=x(t)\,\ii+y(t)\,\jj\). A medida que la partícula se mueve, la punta de \(\vb{r}\) dibuja la <strong>trayectoria</strong>. Las definiciones del capítulo 3 se generalizan componente a componente:</p>
<div class="eq key" data-name="Cinemática vectorial">\[\vb{v}=\frac{\dd\vb{r}}{\dd t}=v_x\,\ii+v_y\,\jj,\qquad \vb{a}=\frac{\dd\vb{v}}{\dd t}=a_x\,\ii+a_y\,\jj,\qquad v_x=\frac{\dd x}{\dd t},\ \ a_x=\frac{\dd v_x}{\dd t},\ \ldots\]</div>
<p>La velocidad instantánea es <strong>tangente a la trayectoria</strong> en cada punto. La aceleración, en cambio, puede apuntar en cualquier dirección. Conviene descomponerla en dos partes:</p>
<ul>
<li>la componente <strong>tangencial</strong>, paralela a \(\vb{v}\), cambia la rapidez;</li>
<li>la componente <strong>normal</strong> (o centrípeta), perpendicular a \(\vb{v}\), cambia la dirección del movimiento y apunta hacia el lado cóncavo de la curva.</li>
</ul>
<div class="box warn">
<p><strong>Un cuerpo puede acelerar sin cambiar su rapidez.</strong> Un auto que da vueltas a una glorieta con el velocímetro fijo en 30 km/h está acelerando, porque su velocidad cambia de dirección. En física “acelerar” significa cambiar la velocidad, no sólo ir más rápido.</p>
</div>
</section>

<section>
<h2>Movimiento de proyectiles</h2>
<p>Un <strong>proyectil</strong> es un objeto lanzado que se mueve sólo bajo la acción de la gravedad. Si se desprecia la resistencia del aire, su aceleración es constante: \(a_x=0\) y \(a_y=-g\). El movimiento horizontal es uniforme y el vertical es una caída libre, y ambos comparten el mismo reloj.</p>
<p>Si se lanza desde \((x_0,y_0)\) con rapidez \(v_0\) y ángulo \(\theta\) sobre la horizontal, las componentes iniciales de la velocidad son \(v_{0x}=v_0\cos\theta\) y \(v_{0y}=v_0\sen\theta\), y</p>
<div class="eq key" data-name="Ecuaciones del proyectil">\[\begin{aligned}
x&=x_0+v_0\cos\theta\;t, & v_x&=v_0\cos\theta\ \ (\text{constante}),\\
y&=y_0+v_0\sen\theta\;t-\tfrac12 g\,t^2, & v_y&=v_0\sen\theta-g\,t .
\end{aligned}\]</div>
<p>Eliminando \(t\) se obtiene la ecuación de la trayectoria, una <strong>parábola</strong>: \(y-y_0=(x-x_0)\tan\theta-\dfrac{g\,(x-x_0)^2}{2v_0^2\cos^2\theta}\).</p>
<h3>Altura máxima, tiempo de vuelo y alcance</h3>
<p>En el punto más alto \(v_y=0\) (pero \(v_x\) no). Si el proyectil aterriza a la misma altura desde la que salió:</p>
<div class="eq key" data-name="Lanzamiento en terreno plano">\[H=\frac{v_0^2\sen^2\theta}{2g},\qquad T=\frac{2v_0\sen\theta}{g},\qquad R=\frac{v_0^2\sen2\theta}{g}.\]</div>
<p>Como \(\sen2\theta\) es máximo cuando \(2\theta=90^\circ\), el alcance máximo se logra a <strong>45°</strong>. Además, los ángulos complementarios (por ejemplo 30° y 60°) dan el mismo alcance: el más alto tarda más y sube más, pero avanza más despacio.</p>
<div class="sim" data-sim="proyectil" data-title="Movimiento de proyectiles con y sin resistencia del aire"></div>
<div class="sim-guide"><ul>
<li>Lance a 30° y luego use “Ángulo complementario”: las dos parábolas caen en el mismo punto.</li>
<li>Active los vectores: la componente horizontal de la velocidad no cambia en todo el vuelo; la vertical disminuye 9.8 m/s cada segundo, se anula arriba y crece hacia abajo.</li>
<li>Con “Familia de parábolas” compare alcances y alturas para 15°, 30°, 45°, 60° y 75°.</li>
<li>Active la resistencia del aire con una pelota de béisbol: el alcance se reduce casi a la mitad y la trayectoria deja de ser simétrica (baja más empinada de lo que sube).</li>
</ul></div>
<div class="box ex">
<h4>Un saque de arco</h4>
<p>Un portero patea el balón desde el suelo a 20 m/s con un ángulo de 36.9° (de modo que \(v_{0x}=16\) m/s y \(v_{0y}=12\) m/s). Sin considerar el aire, ¿cuánto tiempo vuela, qué altura alcanza y a qué distancia cae?</p>
<details><summary>Solución</summary>
<p>Tiempo de subida: \(12/9.8=1.22\) s; tiempo de vuelo \(T=2.45\) s. Altura: \(H=12^2/(2\times9.8)=7.35\) m. Alcance: \(R=16\times2.45=39.2\) m. Con la fórmula: \(R=20^2\sen(73.7^\circ)/9.8=39.2\) m.</p>
<p><button class="try" type="button" data-try="proyectil:saque">Probar en la simulación</button></p>
</details>
</div>
<div class="box ex">
<h4>Ayuda humanitaria desde un avión</h4>
<p>Un avión vuela horizontalmente a 50 m/s y a 100 m de altura. ¿A qué distancia horizontal antes del blanco debe soltar un paquete (sin aire)?</p>
<details><summary>Solución</summary>
<p>Verticalmente el paquete cae desde el reposo: \(100=4.9t^2\), \(t=4.52\) s. Horizontalmente conserva los 50 m/s del avión: \(x=50\times4.52=226\) m. Mientras cae, el paquete permanece justo debajo del avión.</p>
</details>
</div>

<h3>El mono y el cazador</h3>
<p>Un experimento clásico muestra la independencia de los movimientos: un cazador apunta directamente a un mono que cuelga de una rama. Justo cuando dispara, el mono se suelta. ¿Dónde debió apuntar para acertar? La respuesta sorprendente es: <em>directamente al mono</em>. Sin gravedad, el dardo iría en línea recta hasta el mono. Con gravedad, el dardo cae \(\tfrac12gt^2\) por debajo de esa recta… exactamente lo mismo que cae el mono en ese tiempo.</p>
<div class="sim" data-sim="mono-cazador" data-title="El mono y el cazador: todo cae igual"></div>
<div class="sim-guide"><ul>
<li>Cambie la rapidez del dardo: mientras alcance el árbol antes de tocar el suelo, siempre acierta.</li>
<li>Desactive “El mono se suelta”: ahora el dardo pasa por debajo, una distancia igual a \(\tfrac12gt^2\).</li>
</ul></div>
</section>

<section>
<h2>Movimiento circular</h2>
<p>En el <strong>movimiento circular uniforme</strong> (MCU) una partícula recorre una circunferencia de radio \(r\) con rapidez constante \(v\). Aunque la rapidez no cambia, la dirección de la velocidad sí, así que hay aceleración. Se demuestra con triángulos semejantes (entre la posición y la velocidad) que esta aceleración apunta siempre hacia el centro y vale</p>
<div class="eq key" data-name="Aceleración centrípeta">\[a_c=\frac{v^2}{r}=\omega^2r,\qquad v=\frac{2\pi r}{T}=\omega r,\qquad \omega=\frac{2\pi}{T}=2\pi f .\]</div>
<p>El <strong>periodo</strong> \(T\) es el tiempo de una vuelta; la <strong>frecuencia</strong> \(f=1/T\) se mide en hertz (vueltas por segundo) o en revoluciones por minuto (rpm); la <strong>rapidez angular</strong> \(\omega\) se mide en rad/s.</p>
<p>Si además la rapidez cambia, aparece una aceleración <strong>tangencial</strong> \(a_t=\dd v/\dd t\). La aceleración total es la suma vectorial de ambas, de magnitud \(a=\sqrt{a_c^2+a_t^2}\), y ya no apunta al centro.</p>
<div class="sim" data-sim="circular" data-title="Movimiento circular: velocidad tangente y aceleración centrípeta"></div>
<div class="sim-guide"><ul>
<li>En el MCU, la velocidad (verde) y la aceleración (naranja) forman siempre 90°. Duplique la rapidez: la aceleración se multiplica por cuatro.</li>
<li>Active las proyecciones: la sombra de la partícula sobre cada eje oscila de un lado a otro. Ese es el movimiento armónico simple del capítulo 16.</li>
<li>Con aceleración tangencial, la aceleración total se inclina hacia adelante (si acelera) o hacia atrás (si frena).</li>
</ul></div>
<div class="box ex">
<h4>El centrifugado de una lavadora</h4>
<p>El tambor de una lavadora tiene 25 cm de radio y gira a 1200 rpm. ¿Qué aceleración experimenta la ropa pegada a la pared?</p>
<details><summary>Solución</summary>
<p>\(f=1200/60=20\) Hz, \(\omega=2\pi f=126\) rad/s, \(v=\omega r=31.4\) m/s. Entonces \(a_c=v^2/r=3.9\times10^3\) m/s², unas 400 veces \(g\). El agua atraviesa los agujeros del tambor porque nada la obliga a seguir la curva.</p>
<p><button class="try" type="button" data-try="circular:lavadora">Probar en la simulación</button></p>
</details>
</div>
<div class="box hist">
<p>Newton calculó la aceleración centrípeta de la Luna: su órbita tiene radio \(3.84\times10^8\) m y periodo 27.3 días, lo que da \(a_c=2.7\times10^{-3}\) m/s². Es \(g/3600\), y \(3600=60^2\), porque la Luna está 60 radios terrestres más lejos que una manzana en la superficie. Así comprobó que la gravedad disminuye como el inverso del cuadrado de la distancia (capítulo 14).</p>

<section>
<h2>Movimiento relativo</h2>
<p>La velocidad de un objeto depende de quién lo observe. Un pasajero sentado en un bus está en reposo para el conductor y se mueve a 60 km/h para un peatón en la acera. Si \(P\) es la partícula y \(A\) y \(B\) son dos observadores (o sistemas de referencia), las posiciones y velocidades se relacionan así:</p>
<div class="eq key" data-name="Velocidad relativa (transformación de Galileo)">\[\vb{r}_{P/A}=\vb{r}_{P/B}+\vb{r}_{B/A},\qquad \vb{v}_{P/A}=\vb{v}_{P/B}+\vb{v}_{B/A}.\]</div>
<p>Se lee “la velocidad de \(P\) respecto a \(A\) es la velocidad de \(P\) respecto a \(B\) más la de \(B\) respecto a \(A\)”: los subíndices interiores se “cancelan”. Además \(\vb{v}_{A/B}=-\vb{v}_{B/A}\). Si \(B\) se mueve con velocidad constante respecto a \(A\), ambos miden la misma aceleración de \(P\).</p>
<div class="sim" data-sim="relativo" data-title="Movimiento relativo: el bote en el río y la lluvia vista desde un auto"></div>
<div class="sim-guide"><ul>
<li>Apunte el bote perpendicular a la orilla: cruza en el menor tiempo, pero la corriente lo arrastra río abajo.</li>
<li>Use “Rumbo para llegar enfrente”: el bote apunta aguas arriba con \(\sen\varphi=u/v\) y cruza en línea recta, aunque más lento.</li>
<li>En la lluvia, cambie al punto de vista del conductor: las gotas caen inclinadas hacia él, aunque en el suelo caigan verticales.</li>
</ul></div>
<div class="box ex">
<h4>Cruzar un río de 60 m</h4>
<p>Un bote navega a 3.0 m/s respecto al agua en un río de 60 m de ancho cuya corriente es de 1.5 m/s. (a) Si apunta perpendicular a la orilla, ¿cuánto tarda en cruzar y cuánto lo arrastra la corriente? (b) ¿Hacia dónde debe apuntar para llegar justo enfrente, y cuánto tarda?</p>
<details><summary>Solución</summary>
<p>(a) \(t=60/3.0=20\) s; en ese tiempo la corriente lo lleva \(1.5\times20=30\) m río abajo. Su rapidez respecto a la orilla es \(\sqrt{3^2+1.5^2}=3.35\) m/s.</p>
<p>(b) La componente de su velocidad aguas arriba debe cancelar la corriente: \(3.0\sen\varphi=1.5\), \(\varphi=30^\circ\) aguas arriba. Cruza a \(3.0\cos30^\circ=2.60\) m/s y tarda \(60/2.60=23.1\) s.</p>
<p><button class="try" type="button" data-try="relativo:enfrente">Probar en la simulación</button></p>
</details>
</div>

<section>
<h2>Preguntas y problemas</h2>
<ol class="problems">
<li><span class="lvl">Concepto</span>En el punto más alto de la trayectoria de un proyectil, ¿cuánto valen la velocidad y la aceleración?
<details><summary>Respuesta</summary><p>La velocidad es horizontal y vale \(v_0\cos\theta\) (no es cero salvo en un lanzamiento vertical). La aceleración sigue siendo \(g\) hacia abajo.</p></details></li>
<li><span class="lvl">Concepto</span>Se deja caer una bola desde una mesa y, al mismo tiempo, otra sale disparada horizontalmente desde la misma altura. ¿Cuál llega primero al suelo?
<details><summary>Respuesta</summary><p>Llegan al mismo tiempo: el movimiento vertical de ambas es idéntico. La horizontal no afecta la caída.</p></details></li>
<li><span class="lvl">Problema</span>Un basquetbolista lanza desde 2.1 m de altura a 8.5 m/s y 50°. El aro está a 3.05 m de altura. ¿A qué distancia horizontal debe estar para encestar en la bajada?
<details><summary>Respuesta</summary><p>\(0.95=6.51t-4.9t^2\Rightarrow t=1.16\) s (raíz mayor). \(x=8.5\cos50^\circ\times1.16=6.3\) m, más o menos la distancia de un triple.</p></details></li>
<li><span class="lvl">Problema</span>Un satélite en órbita baja da una vuelta a la Tierra cada 90 min a 6 700 km del centro. Calcule su rapidez y su aceleración centrípeta.
<details><summary>Respuesta</summary><p>\(v=2\pi(6.7\times10^6)/5400=7.8\) km/s; \(a_c=v^2/r=9.1\) m/s², casi el valor de \(g\) en la superficie. Los astronautas no “flotan” por falta de gravedad: caen continuamente.</p></details></li>
<li><span class="lvl">Problema</span>Llueve verticalmente a 8 m/s. ¿A qué rapidez debe ir un auto para que el conductor vea las gotas caer formando 60° con la vertical?
<details><summary>Respuesta</summary><p>\(\tan60^\circ=v_{\text{auto}}/8\Rightarrow v_{\text{auto}}=13.9\) m/s \(\approx50\) km/h.</p></details></li>
</ol>
