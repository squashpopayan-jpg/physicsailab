<template class="chapter-src" data-id="oscilaciones" data-num="17" data-title="Oscilaciones" data-part="Parte VII · Oscilaciones y ondas" data-short="Movimiento armónico simple, energía, péndulo simple y físico, oscilaciones amortiguadas, forzadas y resonancia">
<p class="lead">Un columpio, las cuerdas de una guitarra, la suspensión de un automóvil, el latido del corazón y el cristal de cuarzo de un reloj repiten su movimiento una y otra vez. Casi cualquier sistema que se aparta un poco de su equilibrio estable oscila, y la mayoría lo hace de la misma manera: con un movimiento armónico simple.</p>

<div class="keyideas"><ul>
<li>Una fuerza de restitución proporcional al desplazamiento, \(F=-kx\), produce un movimiento armónico simple: \(x=A\cos(\omega t+\phi)\) con \(\omega=\sqrt{k/m}\).</li>
<li>El periodo del MAS no depende de la amplitud: \(T=2\pi\sqrt{m/k}\).</li>
<li>La energía total \(E=\tfrac12kA^2\) se reparte entre cinética y potencial; la rapidez es máxima en el equilibrio.</li>
<li>Un péndulo simple con oscilaciones pequeñas tiene \(T=2\pi\sqrt{L/g}\), sin importar la masa ni (casi) la amplitud.</li>
<li>La fricción amortigua las oscilaciones; una fuerza periódica con la frecuencia natural produce resonancia: amplitudes muy grandes.</li>
</ul></div>

<section>
<h2>Movimiento periódico y armónico simple</h2>
<p>Un movimiento es <strong>periódico</strong> si se repite en intervalos iguales. El <strong>periodo</strong> \(T\) es la duración de un ciclo; la <strong>frecuencia</strong> \(f=1/T\) es el número de ciclos por segundo (hertz, Hz), y la <strong>frecuencia angular</strong> es \(\omega=2\pi f\) (rad/s).</p>
<p>Un bloque unido a un resorte sobre una superficie sin fricción siente la fuerza de Hooke, \(F=-kx\): siempre apunta hacia el equilibrio y crece con el desplazamiento. La segunda ley da \(a=-\dfrac{k}{m}\,x\). La solución de esta ecuación es una función sinusoidal:</p>
<div class="eq key" data-name="Movimiento armónico simple">\[x(t)=A\cos(\omega t+\phi),\qquad \omega=\sqrt{\frac{k}{m}},\qquad T=2\pi\sqrt{\frac{m}{k}} .\]</div>
<p>La <strong>amplitud</strong> \(A\) es el desplazamiento máximo y la <strong>fase inicial</strong> \(\phi\) indica dónde empieza el movimiento; ambas dependen de cómo se pone a oscilar el sistema. En cambio, ω sólo depende de \(k\) y \(m\): un resorte más rígido oscila más rápido y una masa mayor, más despacio. Derivando se obtienen la velocidad y la aceleración:</p>
<div class="eq">\[v(t)=-A\omega\,\sen(\omega t+\phi),\qquad a(t)=-A\omega^2\cos(\omega t+\phi)=-\omega^2x .\]</div>
<p>La rapidez es máxima (\(A\omega\)) al pasar por el equilibrio y nula en los extremos; la aceleración es máxima (\(A\omega^2\)) en los extremos y nula en el equilibrio. El MAS es la proyección de un movimiento circular uniforme: un punto que gira con rapidez angular ω en un círculo de radio \(A\) tiene una sombra que se mueve exactamente así.</p>
<div class="sim" data-sim="mas-resorte" data-title="Movimiento armónico simple: masa y resorte"></div>
<div class="sim-guide"><ul>
<li>Compare las tres gráficas: \(v\) está adelantada un cuarto de ciclo respecto de \(x\), y \(a\) es siempre opuesta a \(x\).</li>
<li>Cambie la amplitud: el periodo no cambia. Cambie \(m\) o \(k\): el periodo sí cambia.</li>
<li>Active el círculo de referencia para ver el MAS como la sombra de un movimiento circular uniforme.</li>
</ul></div>
<div class="box ex">
<h4>Un bloque en un resorte</h4>
<p>Un bloque de 0.50 kg unido a un resorte de 20 N/m se separa 10 cm del equilibrio y se suelta. Halle ω, el periodo, la rapidez máxima y la aceleración máxima.</p>
<details><summary>Solución</summary>
<p>\(\omega=\sqrt{20/0.50}=6.32\) rad/s; \(T=2\pi/\omega=0.99\) s. \(v_{\max}=A\omega=0.632\) m/s; \(a_{\max}=A\omega^2=4.0\) m/s².</p>

<section>
<h2>Energía en el movimiento armónico simple</h2>
<p>Sin fricción, la energía mecánica se conserva. En cada instante se reparte entre la energía cinética del bloque y la energía potencial elástica del resorte:</p>
<div class="eq key" data-name="Energía del MAS">\[E=\tfrac12mv^2+\tfrac12kx^2=\tfrac12kA^2,\qquad v=\pm\,\omega\sqrt{A^2-x^2}.\]</div>
<p>En los extremos toda la energía es potencial; en el equilibrio, toda es cinética. Como \(K\) y \(U\) dependen del cuadrado de funciones sinusoidales, oscilan con el <em>doble</em> de frecuencia que \(x\). En un diagrama de energía, la curva \(U(x)=\tfrac12kx^2\) es una parábola: el cuerpo se mueve entre los puntos de retorno donde la recta de energía total corta la parábola.</p>
<p>Cualquier sistema cerca de un mínimo de energía potencial se comporta como un oscilador armónico, porque cerca del fondo casi cualquier curva se parece a una parábola. Por eso el MAS aparece en moléculas, cristales, puentes y circuitos. Si las oscilaciones son grandes, la curva deja de ser parabólica y el periodo empieza a depender de la amplitud.</p>
<div class="sim" data-sim="mas-energia" data-title="La energía del oscilador: el pozo parabólico"></div>
<div class="sim-guide"><ul>
<li>Observe cómo la bola sube y baja en el pozo mientras las barras de \(K\) y \(U\) se intercambian; la suma no cambia.</li>
<li>En la gráfica, \(K\) y \(U\) oscilan dos veces por cada oscilación de \(x\).</li>
<li>Elija un pozo que no es parabólico: con amplitudes grandes el periodo cambia.</li>
</ul></div>
<div class="box ex">
<h4>Energía y rapidez</h4>
<p>Con el oscilador del ejemplo anterior (\(k=20\) N/m, \(m=0.50\) kg, \(A=0.10\) m), ¿cuál es su energía? ¿Qué rapidez tiene cuando \(x=5.0\) cm?</p>
<details><summary>Solución</summary>
<p>\(E=\tfrac12(20)(0.10)^2=0.10\) J. En \(x=0.05\) m, \(U=0.025\) J, así que \(K=0.075\) J y \(v=\sqrt{2(0.075)/0.50}=0.55\) m/s (el 87 % de la rapidez máxima, aunque está a mitad de camino).</p>

</details>
</div>

<section>
<h2>El péndulo simple</h2>
<p>Un péndulo simple es una masa puntual colgada de un hilo de longitud \(L\) y masa despreciable. Si el hilo forma un ángulo θ con la vertical, la componente del peso a lo largo de la trayectoria es \(-mg\,\sen\theta\). Para ángulos pequeños, \(\sen\theta\approx\theta\) (en radianes) y la fuerza es proporcional al desplazamiento \(s=L\theta\): el movimiento es armónico simple con</p>
<div class="eq key" data-name="Péndulo simple">\[\omega=\sqrt{\frac{g}{L}},\qquad T=2\pi\sqrt{\frac{L}{g}} .\]</div>
<p>El periodo no depende de la masa (la masa gravitacional y la inercial se cancelan) y, para oscilaciones pequeñas, tampoco de la amplitud: es el <em>isocronismo</em> que según la tradición observó Galileo mirando oscilar una lámpara en la catedral de Pisa. Con amplitudes grandes el periodo aumenta: a 30° es un 1.7 % mayor, a 90° un 18 % mayor.</p>
<p>Un cuerpo rígido que oscila alrededor de un eje es un <strong>péndulo físico</strong>: \(T=2\pi\sqrt{I/(mgd)}\), donde \(I\) es su momento de inercia respecto al eje y \(d\) la distancia del eje al centro de masa.</p>
<div class="sim" data-sim="pendulo" data-title="El péndulo simple y la aproximación de ángulos pequeños"></div>
<div class="sim-guide"><ul>
<li>El péndulo gris sigue la aproximación de ángulos pequeños; el de color, el movimiento exacto. Con 10° van juntos; con 60° o más se separan poco a poco.</li>
<li>Cambie la masa: nada cambia. Cambie de planeta: en la Luna el péndulo oscila 2.5 veces más lento.</li>
<li>Agregue amortiguamiento para ver cómo la amplitud decae, igual que en un columpio que nadie empuja.</li>
</ul></div>
<div class="box ex">
<h4>El péndulo que bate segundos</h4>
<p>¿Qué longitud debe tener un péndulo para que cada oscilación de ida (medio periodo) dure exactamente 1 s?</p>
<details><summary>Solución</summary>
<p>\(T=2.0\) s: \(L=gT^2/(4\pi^2)=9.8(4.0)/39.5=0.993\) m. Es el péndulo de los relojes de pie.</p>
<p><button class="try" type="button" data-try="pendulo:reloj">Probar en la simulación</button></p>
</details>
</div>
<div class="box hist">
<p>Christiaan Huygens construyó en 1656 el primer reloj de péndulo, que atrasaba sólo unos segundos al día en lugar de varios minutos. En 1672 Jean Richer llevó un reloj de péndulo de París a Cayena, cerca del ecuador, y descubrió que allí atrasaba 2.5 minutos diarios: fue la primera prueba de que \(g\) es menor en el ecuador.</p>
</div>

<section>
<h2>Oscilaciones amortiguadas</h2>
<p>En la realidad la fricción y la resistencia del aire quitan energía y la amplitud disminuye. Si la fuerza de amortiguamiento es proporcional a la velocidad, \(F=-bv\) (un amortiguador de aceite, por ejemplo), la ecuación de movimiento es</p>
<div class="eq key" data-name="Oscilador amortiguado">\[m\ddot x+b\dot x+kx=0,\qquad x(t)=A\,e^{-\gamma t}\cos(\omega' t+\phi),\quad \gamma=\frac{b}{2m},\ \ \omega'=\sqrt{\omega_0^2-\gamma^2}.\]</div>
<p>Según el valor de γ frente a la frecuencia natural \(\omega_0=\sqrt{k/m}\) hay tres regímenes:</p>
<ul>
<li><strong>Subamortiguado</strong> (\(\gamma\lt\omega_0\)): oscila con amplitud que decae exponencialmente.</li>
<li><strong>Críticamente amortiguado</strong> (\(\gamma=\omega_0\)): vuelve al equilibrio lo más rápido posible sin oscilar.</li>
<li><strong>Sobreamortiguado</strong> (\(\gamma\gt\omega_0\)): vuelve sin oscilar, pero más despacio.</li>
</ul>
<p>El <strong>factor de calidad</strong> \(Q=\omega_0/(2\gamma)\) mide cuántas oscilaciones sobrevive el sistema: una campana o un diapasón tienen \(Q\) de miles; una puerta con cierrapuertas, menor que 1.</p>
<div class="sim" data-sim="amortiguado" data-title="Oscilaciones amortiguadas: sub, crítico y sobreamortiguado"></div>
<div class="sim-guide"><ul>
<li>Las curvas punteadas son la envolvente \(\pm Ae^{-\gamma t}\): la amplitud cae el mismo porcentaje en cada ciclo.</li>
<li>Compare los tres regímenes con los botones de situación: el crítico llega al equilibrio antes que el sobreamortiguado y sin pasarse.</li>
</ul></div>

<section>
<h2>Oscilaciones forzadas y resonancia</h2>
<p>Si una fuerza periódica \(F_0\cos\omega t\) actúa sobre un oscilador amortiguado, después de un transitorio el sistema oscila con la frecuencia <em>de la fuerza</em>, ω, y no con la suya. La amplitud estacionaria depende de lo cerca que esté ω de la frecuencia natural:</p>
<div class="eq key" data-name="Amplitud de un oscilador forzado">\[A(\omega)=\frac{F_0/m}{\sqrt{(\omega_0^2-\omega^2)^2+(2\gamma\omega)^2}} .\]</div>
<p>Cuando \(\omega\approx\omega_0\) la amplitud es máxima: es la <strong>resonancia</strong>. Con poco amortiguamiento el pico es alto y estrecho; con mucho, bajo y ancho. En resonancia la fuerza empuja siempre en el sentido de la velocidad y le entrega energía en cada ciclo, como quien empuja un columpio justo cuando empieza a alejarse.</p>
<div class="sim" data-sim="forzado" data-title="Oscilaciones forzadas: la curva de resonancia"></div>
<div class="sim-guide"><ul>
<li>Empiece lejos de la resonancia: tras el transitorio, la amplitud es pequeña. Acérquese a \(\omega_0\): la amplitud crece mucho.</li>
<li>Con poco amortiguamiento el pico de la curva es altísimo y el transitorio dura mucho; cerca de \(\omega_0\) se ven pulsaciones al principio.</li>
<li>Por debajo de la resonancia el bloque se mueve junto con la fuerza; muy por encima, al revés (desfase de 180°).</li>
</ul></div>
<div class="box warn">
<p><strong>Resonancias famosas.</strong> En el terremoto de México de 1985, el suelo blando del antiguo lago vibró con periodos de unos 2 s; los edificios de 6 a 15 pisos, con periodos naturales parecidos, fueron los más dañados. En cambio, el colapso del puente de Tacoma Narrows (1940), citado a menudo como ejemplo de resonancia, se debió a una inestabilidad aerodinámica (flameo): el viento constante le entregaba energía a la torsión del puente.</p>
</div>

<section>
<h2>Preguntas y problemas</h2>
<ol class="problems">
<li><span class="lvl">Concepto</span>Si se duplica la amplitud de un MAS, ¿qué pasa con el periodo, la rapidez máxima y la energía?
<details><summary>Respuesta</summary><p>El periodo no cambia; la rapidez máxima se duplica (\(A\omega\)) y la energía se cuadruplica (\(\tfrac12kA^2\)).</p></details></li>
<li><span class="lvl">Concepto</span>Un reloj de péndulo que funciona bien en la costa se lleva a lo alto de una montaña. ¿Adelanta o atrasa?
<details><summary>Respuesta</summary><p>Atrasa: \(g\) es un poco menor, el periodo es un poco mayor y el péndulo cuenta menos oscilaciones por hora.</p></details></li>
<li><span class="lvl">Problema</span>Un automóvil de 1200 kg se apoya en cuatro resortes de 30 000 N/m cada uno. ¿Con qué frecuencia oscila al pasar un bache (sin amortiguadores)?
<details><summary>Respuesta</summary><p>\(k_{\text{total}}=1.2\times10^5\) N/m; \(f=\dfrac{1}{2\pi}\sqrt{1.2\times10^5/1200}=1.6\) Hz.</p></details></li>
<li><span class="lvl">Problema</span>Un péndulo de 1.50 m realiza 20 oscilaciones completas en 49.2 s. ¿Cuánto vale \(g\) en ese lugar?
<details><summary>Respuesta</summary><p>\(T=2.46\) s; \(g=4\pi^2L/T^2=4\pi^2(1.50)/2.46^2=9.79\) m/s².</p></details></li>
<li><span class="lvl">Problema</span>La amplitud de un oscilador amortiguado se reduce a la mitad en 10 s. ¿Cuánto vale γ? ¿En cuánto tiempo la energía se reduce a la cuarta parte?
<details><summary>Respuesta</summary><p>\(e^{-10\gamma}=0.5\Rightarrow\gamma=0.069\) s⁻¹. La energía es proporcional a \(A^2\): cae a la cuarta parte cuando la amplitud cae a la mitad, es decir, también en 10 s.</p></details></li>
</ol>
