<template class="chapter-src" data-id="trabajo" data-num="8" data-title="Trabajo y energía cinética" data-part="Parte IV · Energía y momento" data-short="Trabajo de fuerzas constantes y variables, ley de Hooke, teorema trabajo–energía, distancia de frenado y potencia">
<p class="lead">Las leyes de Newton dicen cómo cambia la velocidad en cada instante, pero a veces sólo interesa saber cuánto cambió al final de un recorrido. El concepto de trabajo y su relación con la energía cinética permiten responder esa pregunta sin seguir el movimiento paso a paso, y explican por qué frenar desde 100 km/h cuesta cuatro veces más distancia que desde 50 km/h.</p>

<div class="keyideas"><ul>
<li>Una fuerza hace trabajo cuando el punto donde actúa se desplaza: \(W=Fd\cos\theta=\vb{F}\cdot\vb{d}\).</li>
<li>El trabajo puede ser positivo, negativo o nulo; una fuerza perpendicular al movimiento no hace trabajo.</li>
<li>Para una fuerza variable, el trabajo es el área bajo la gráfica \(F(x)\); para un resorte, \(\tfrac12kx^2\).</li>
<li>Teorema trabajo–energía: el trabajo neto es igual al cambio de la energía cinética \(K=\tfrac12mv^2\).</li>
<li>La potencia es la rapidez con que se hace trabajo: \(P=W/t=Fv\).</li>
</ul></div>

<section>
<h2>Trabajo de una fuerza constante</h2>
<p>En física, “trabajo” tiene un significado preciso: una fuerza constante \(\vb{F}\) cuyo punto de aplicación se desplaza \(\vb{d}\) realiza un trabajo</p>
<div class="eq key" data-name="Trabajo de una fuerza constante">\[W=\vb{F}\cdot\vb{d}=F\,d\cos\theta ,\]</div>
<p>donde \(\theta\) es el ángulo entre la fuerza y el desplazamiento. El trabajo es un escalar y su unidad es el <strong>joule</strong>: \(1\un{J}=1\un{N\cdot m}\). Levantar una manzana (1 N) un metro requiere aproximadamente 1 J.</p>
<ul>
<li>Si \(0^\circ\le\theta\lt90^\circ\), el trabajo es <strong>positivo</strong>: la fuerza ayuda al movimiento.</li>
<li>Si \(\theta=90^\circ\), el trabajo es <strong>cero</strong>: la fuerza no ayuda ni se opone (la normal sobre un bloque que se desliza, el peso de una mochila que se lleva caminando en un piso plano).</li>
<li>Si \(90^\circ\lt\theta\le180^\circ\), el trabajo es <strong>negativo</strong>: la fuerza se opone al movimiento (la fricción, los frenos).</li>
</ul>
<p>Cuando varias fuerzas actúan, el <strong>trabajo neto</strong> es la suma de sus trabajos, que coincide con el trabajo de la fuerza neta.</p>
<div class="sim" data-sim="trabajo-fuerza" data-title="El trabajo de cada fuerza al arrastrar un trineo"></div>
<div class="sim-guide"><ul>
<li>Compare las barras: el peso y la normal no hacen trabajo porque son perpendiculares al movimiento.</li>
<li>Cambie el ángulo de la cuerda. Tirar un poco hacia arriba reduce la normal y la fricción; tirar demasiado hacia arriba desperdicia fuerza en la componente vertical. Busque el ángulo con mayor trabajo neto.</li>
<li>Con un ángulo negativo (empujando hacia abajo) aumentan la normal y la fricción.</li>
</ul></div>
<div class="box ex">
<h4>El trineo</h4>
<p>Un niño tira de un trineo de 20 kg con una fuerza de 80 N a 25° sobre la horizontal, a lo largo de 10 m de nieve (\(\mu_k=0.10\)). Halle el trabajo de cada fuerza y la rapidez final si parte del reposo.</p>
<details><summary>Solución</summary>
<p>Normal: \(n=mg-F\sen25^\circ=196-33.8=162\) N; fricción \(f=\mu_kn=16.2\) N.</p>
<p>\(W_F=80(10)\cos25^\circ=725\) J; \(W_f=-16.2(10)=-162\) J; \(W_{mg}=W_n=0\). Trabajo neto: 563 J. Como \(W_{\text{neto}}=\tfrac12mv^2\), \(v=\sqrt{2(563)/20}=7.5\) m/s.</p>
<p><button class="try" type="button" data-try="trabajo-fuerza:trineo">Probar en la simulación</button></p>
</details>
</div>
<div class="box warn">
<p><strong>Cansarse no es hacer trabajo.</strong> Sostener una maleta pesada sin moverla cansa los músculos, pero no hace trabajo sobre la maleta: su desplazamiento es cero. La energía que gastamos se va en las contracciones internas de las fibras musculares.</p>
</div>

<section>
<h2>Trabajo de una fuerza variable: el resorte</h2>
<p>Si la fuerza cambia a lo largo del recorrido, se divide el camino en tramos pequeños donde la fuerza es casi constante y se suman los trabajos. En el límite, el trabajo es la integral de la fuerza, que se interpreta como el <strong>área bajo la gráfica</strong> \(F_x(x)\):</p>
<div class="eq key" data-name="Trabajo de una fuerza variable">\[W=\int_{x_1}^{x_2}F_x(x)\,\dd x=\text{área bajo }F_x(x).\]</div>
<p>El ejemplo más importante es un <strong>resorte</strong>. Para deformaciones no muy grandes, la fuerza que ejerce es proporcional a su estiramiento o compresión \(x\) y opuesta a él (<strong>ley de Hooke</strong>):</p>
<div class="eq key" data-name="Ley de Hooke">\[F_{\text{resorte}}=-k\,x ,\]</div>
<p>donde \(k\) es la <strong>constante elástica</strong> (N/m): un resorte duro tiene \(k\) grande. Para estirarlo lentamente hay que aplicar \(F=+kx\), cuya gráfica es una recta; el área del triángulo da el trabajo necesario:</p>
<div class="eq">\[W=\tfrac12\,k\,x^2\qquad\text{(desde }x=0),\qquad W=\tfrac12k\left(x_2^2-x_1^2\right)\qquad\text{(de }x_1\text{ a }x_2).\]</div>
<p>Por eso los segundos 10 cm de estiramiento cuestan el triple que los primeros 10 cm.</p>
<div class="sim" data-sim="hooke-trabajo" data-title="Ley de Hooke: el trabajo es el área bajo F(x)"></div>
<div class="sim-guide"><ul>
<li>Arrastre la mano para estirar o comprimir el resorte: la fuerza del resorte (verde azulado) siempre apunta hacia la posición de equilibrio.</li>
<li>Fije el inicio en 10 cm y lleve el extremo a 20 cm: el área sombreada es el triple que de 0 a 10 cm.</li>
<li>Active el resorte no lineal (como una banda elástica muy estirada): la gráfica se curva y el área ya no es un triángulo.</li>
</ul></div>

<section>
<h2>Energía cinética y el teorema trabajo–energía</h2>
<p>Se define la <strong>energía cinética</strong> de una partícula de masa \(m\) y rapidez \(v\) como</p>
<div class="eq key" data-name="Energía cinética">\[K=\tfrac12\,m\,v^2 .\]</div>
<p>Es un escalar positivo (no depende de la dirección de la velocidad) y se mide en joules. Si una fuerza neta constante actúa a lo largo de un desplazamiento \(d\), la ecuación \(v^2=v_0^2+2ad\) multiplicada por \(m/2\) da \(\tfrac12mv^2-\tfrac12mv_0^2=(ma)d=F_{\text{neta}}\,d\). El resultado vale en general, también para fuerzas variables y trayectorias curvas:</p>
<div class="box law">
<h4>Teorema trabajo–energía</h4>
<p>El trabajo neto realizado sobre una partícula es igual al cambio de su energía cinética:</p>
<div class="eq">\[W_{\text{neto}}=\Delta K=K_f-K_i .\]</div>
</div>
<p>Si el trabajo neto es positivo, la partícula acelera; si es negativo, frena; si es cero, su rapidez no cambia. La energía cinética mide cuánto trabajo puede hacer un cuerpo en movimiento al detenerse: un martillo que golpea un clavo le transfiere su energía cinética.</p>
<h3>La distancia de frenado</h3>
<p>Al frenar a fondo, la fricción \(f=\mu mg\) hace un trabajo negativo que elimina la energía cinética: \(-\mu mg\,d=0-\tfrac12mv^2\). Entonces</p>
<div class="eq key" data-name="Distancia de frenado">\[d_{\text{frenado}}=\frac{v^2}{2\mu g}.\]</div>
<p>Depende del <em>cuadrado</em> de la rapidez: al duplicar la rapidez, la distancia de frenado se cuadruplica. A ella se suma la distancia recorrida durante el tiempo de reacción del conductor, \(v\,t_r\), que es proporcional a \(v\).</p>
<div class="sim" data-sim="frenado" data-title="Distancia de detención de un auto: reacción más frenado"></div>
<div class="sim-guide"><ul>
<li>A 50 km/h en seco el auto se detiene en unos 26 m; a 100 km/h necesita casi 77 m. ¿Por qué no el doble?</li>
<li>Aumente el tiempo de reacción a 2 s (conductor mirando el celular): la distancia de reacción puede superar a la de frenado.</li>
<li>Con el obstáculo cerca, observe la velocidad de impacto: una pequeña diferencia de rapidez inicial produce una gran diferencia en el choque.</li>
</ul></div>
<div class="box ex">
<h4>A 50 y a 60 km/h</h4>
<p>Un conductor con tiempo de reacción de 1.0 s frena sobre pavimento seco (\(\mu=0.8\)). Compare la distancia de detención a 50 km/h y a 60 km/h.</p>
<details><summary>Solución</summary>
<p>A 50 km/h (13.9 m/s): reacción 13.9 m; frenado \(13.9^2/(2\cdot0.8\cdot9.8)=12.3\) m; total 26.2 m.</p>
<p>A 60 km/h (16.7 m/s): reacción 16.7 m; frenado 17.7 m; total 34.4 m. Justo donde el primer auto ya se detuvo, el segundo todavía va a unos 40 km/h: por eso los límites de velocidad urbanos son de 50 km/h o menos.</p>
<p><button class="try" type="button" data-try="frenado:ciudad50">Probar en la simulación</button></p>
</details>
</div>
</section>

<section>
<h2>Potencia</h2>
<p>Dos grúas pueden levantar la misma carga a la misma altura (el mismo trabajo), pero una lo hace en menos tiempo. La <strong>potencia</strong> mide la rapidez con que se realiza trabajo:</p>
<div class="eq key" data-name="Potencia">\[P_{\text{prom}}=\frac{W}{\Delta t},\qquad P=\frac{\dd W}{\dd t}=\vb{F}\cdot\vb{v}.\]</div>
<p>Su unidad es el <strong>watt</strong>: \(1\un{W}=1\un{J/s}\). También se usa el caballo de fuerza, \(1\un{hp}=746\un{W}\). El kilowatt-hora es una unidad de <em>energía</em>, no de potencia: \(1\un{kWh}=(1000\un{W})(3600\un{s})=3.6\times10^6\un{J}\); es lo que cobra la empresa de energía en la factura.</p>
<p>La expresión \(P=Fv\) explica por qué un auto tiene una rapidez máxima: con potencia fija, la fuerza que puede hacer el motor disminuye al aumentar la rapidez, mientras que la resistencia del aire crece como \(v^2\).</p>
<div class="sim" data-sim="potencia" data-title="Potencia: una grúa que eleva una carga y un auto que acelera"></div>
<div class="sim-guide"><ul>
<li>En la grúa, la rapidez se estabiliza en \(v=P/(mg)\): duplique la potencia y la carga sube el doble de rápido.</li>
<li>El trabajo del motor (área bajo \(P(t)\)) se reparte entre energía cinética y el aumento de altura.</li>
<li>En el auto, compare un modelo compacto y uno deportivo: la rapidez máxima crece mucho más despacio que la potencia, porque la potencia contra el aire crece como \(v^3\).</li>
</ul></div>
<div class="box ex">
<h4>Subir escaleras corriendo</h4>
<p>Una persona de 70 kg sube corriendo un piso de 3.0 m en 4.0 s. ¿Qué potencia desarrolla (sin contar su energía cinética)?</p>
<details><summary>Solución</summary>
<p>\(W=mgh=70(9.8)(3.0)=2.06\times10^3\) J. \(P=W/t=515\) W, casi 0.7 hp. Un atleta entrenado puede mantener unos 400 W durante una hora; en un esfuerzo de pocos segundos supera los 1500 W.</p>
<p><button class="try" type="button" data-try="potencia:escalera">Probar en la simulación</button></p>
</details>
</div>

<section>
<h2>Preguntas y problemas</h2>
<ol class="problems">
<li><span class="lvl">Concepto</span>¿Qué trabajo hace la fuerza centrípeta sobre una piedra que gira atada a una cuerda con rapidez constante?
<details><summary>Respuesta</summary><p>Cero: la tensión es siempre perpendicular a la velocidad. Por eso la rapidez (y la energía cinética) no cambia.</p></details></li>
<li><span class="lvl">Concepto</span>Si la rapidez de un auto se triplica, ¿cuánto cambia su energía cinética? ¿Y su distancia de frenado?
<details><summary>Respuesta</summary><p>Ambas se multiplican por 9.</p></details></li>
<li><span class="lvl">Problema</span>Un resorte con \(k=400\) N/m se estira 10 cm. ¿Qué trabajo se necesita? ¿Y para estirarlo de 10 a 20 cm?
<details><summary>Respuesta</summary><p>\(\tfrac12(400)(0.10)^2=2.0\) J; de 10 a 20 cm: \(\tfrac12(400)(0.04-0.01)=6.0\) J.</p></details></li>
<li><span class="lvl">Problema</span>Una bala de 10 g sale del cañón a 400 m/s tras recorrer 60 cm. ¿Qué fuerza media ejercieron los gases sobre ella?
<details><summary>Respuesta</summary><p>\(K=\tfrac12(0.010)(400)^2=800\) J; \(F=K/d=1.3\times10^3\) N.</p></details></li>
<li><span class="lvl">Problema</span>Una bomba eleva 500 L de agua por minuto hasta un tanque a 12 m de altura. ¿Qué potencia mínima necesita?
<details><summary>Respuesta</summary><p>\(P=\dfrac{mgh}{t}=\dfrac{500(9.8)(12)}{60}=980\) W, algo más de 1.3 hp.</p></details></li>
</ol>
