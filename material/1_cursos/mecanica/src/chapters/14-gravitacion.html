<template class="chapter-src" data-id="gravitacion" data-num="14" data-title="Gravitación universal" data-part="Parte VI · Gravitación y fluidos" data-short="Ley de Newton de la gravitación, el campo g, energía potencial, velocidad de escape, satélites y leyes de Kepler">
<p class="lead">La fuerza que hace caer una manzana es la misma que mantiene a la Luna en su órbita y a la Tierra girando alrededor del Sol. Newton unificó así la física del cielo y la de la Tierra con una sola ley, capaz de predecir la posición de los planetas, el movimiento de los satélites y la rapidez necesaria para escapar de un planeta.</p>

<div class="keyideas"><ul>
<li>Dos masas se atraen con una fuerza proporcional al producto de las masas e inversamente proporcional al cuadrado de la distancia: \(F=Gm_1m_2/r^2\).</li>
<li>La aceleración de la gravedad de un planeta es \(g=GM/r^2\): disminuye con la altura y no depende de la masa del cuerpo que cae.</li>
<li>La energía potencial gravitacional es \(U=-GMm/r\). Si la energía total es negativa el cuerpo queda ligado; si es cero o positiva, escapa.</li>
<li>Un satélite en órbita circular está en caída libre permanente: \(v=\sqrt{GM/r}\) y \(T=2\pi\sqrt{r^3/GM}\).</li>
<li>Los planetas describen elipses (1.ª ley de Kepler), barren áreas iguales en tiempos iguales (2.ª ley) y cumplen \(T^2\propto a^3\) (3.ª ley).</li>
</ul></div>

<section>
<h2>La ley de la gravitación universal</h2>
<p>Newton propuso que <em>toda</em> partícula del universo atrae a cualquier otra con una fuerza dirigida a lo largo de la recta que las une, cuya magnitud es</p>
<div class="eq key" data-name="Ley de la gravitación universal">\[F=G\,\frac{m_1\,m_2}{r^2},\qquad G=6.674\times10^{-11}\un{N\cdot m^2/kg^2}.\]</div>
<p>Tres propiedades importan mucho:</p>
<ul>
<li><strong>Es mutua.</strong> La fuerza de 1 sobre 2 y la de 2 sobre 1 son iguales y opuestas (tercera ley de Newton), aunque las masas sean muy distintas. La Tierra lo atrae a usted con su peso, unos 700 N, y usted atrae a la Tierra con 700 N; la diferencia está en las <em>aceleraciones</em>: \(a=F/m\).</li>
<li><strong>Es de cuadrado inverso.</strong> Al duplicar la distancia la fuerza se reduce a la cuarta parte; al triplicarla, a la novena parte.</li>
<li><strong>Se suma.</strong> La fuerza sobre un cuerpo es la suma vectorial de las atracciones de todos los demás. Newton demostró que una esfera con su masa repartida simétricamente atrae hacia afuera de ella como si toda su masa estuviera en el centro; por eso \(r\) se mide entre centros.</li>
</ul>
<p>\(G\) es tan pequeña que la atracción entre objetos comunes es imperceptible: sólo se nota cuando al menos uno de los cuerpos tiene una masa astronómica.</p>
<div class="sim" data-sim="gravitacion-ley" data-title="La ley de la gravitación: fuerza, masas y distancia"></div>
<div class="sim-guide"><ul>
<li>Las dos flechas siempre tienen el mismo tamaño aunque una masa sea millones de veces mayor: acción y reacción. Compare en cambio las aceleraciones.</li>
<li>Duplique la distancia y observe que la fuerza baja a la cuarta parte; en la gráfica, los puntos \(2r\) y \(3r\) marcan \(F/4\) y \(F/9\).</li>
<li>En «Una persona y la Tierra» la fuerza gravitacional es exactamente el peso \(mg\).</li>
</ul></div>
<div class="box ex">
<h4>¿Cuánto se atraen dos estudiantes?</h4>
<p>Dos estudiantes de 60 kg y 70 kg están sentados a 1.0 m de distancia. ¿Con qué fuerza se atraen? Compárela con el peso de uno de ellos.</p>
<details><summary>Solución</summary>
<p>\(F=\dfrac{(6.674\times10^{-11})(60)(70)}{1.0^2}=2.8\times10^{-7}\) N. El peso de un estudiante de 60 kg es 588 N: la atracción mutua es unas \(2\times10^{9}\) veces menor, como el peso de una partícula de polvo.</p>

</details>
</div>
<div class="box ex">
<h4>La Tierra y la Luna</h4>
<p>Calcule la fuerza entre la Tierra (\(5.97\times10^{24}\) kg) y la Luna (\(7.35\times10^{22}\) kg), separadas \(3.84\times10^8\) m. ¿Qué aceleración le produce a cada una?</p>
<details><summary>Solución</summary>
<p>\(F=\dfrac{(6.674\times10^{-11})(5.97\times10^{24})(7.35\times10^{22})}{(3.84\times10^{8})^2}=1.98\times10^{20}\) N. La Luna acelera \(F/m_L=2.7\times10^{-3}\) m/s² hacia la Tierra; la Tierra, \(3.3\times10^{-5}\) m/s² hacia la Luna: ambas giran alrededor del centro de masa común, que está dentro de la Tierra, a unos 4700 km de su centro.</p>
<p><button class="try" type="button" data-try="gravitacion-ley:tierra-luna">Probar en la simulación</button></p>
</details>
</div>
<div class="box hist">
<p><strong>Pesar la Tierra.</strong> Newton no pudo medir \(G\). Lo hizo Henry Cavendish en 1798 con una balanza de torsión: dos esferas pequeñas de plomo (0.73 kg) colgadas de una varilla eran atraídas por dos esferas grandes (158 kg), y la varilla giraba un ángulo diminuto. Conociendo \(G\) y el valor de \(g\), Cavendish calculó la masa y la densidad de la Tierra: \(5.5\) veces la del agua. Antes, en 1738, Pierre Bouguer había intentado detectar cuánto desviaba el volcán Chimborazo (Ecuador) una plomada: la desviación fue de apenas unos segundos de arco.</p>
<p><button class="try" type="button" data-try="gravitacion-ley:cavendish">Ver la balanza de Cavendish en la simulación</button></p>
</div>

<h4>En la vida cotidiana</h4>
<div class="daily-grid">
<div class="dcard"><b>¿Por qué no nos atraen los edificios?</b><p>Sí nos atraen, pero con fuerzas de milésimas de newton o menos, completamente enmascaradas por la fricción y por nuestro peso (la atracción de toda la Tierra).</p></div>
<div class="dcard"><b>Las mareas</b><p>La Luna atrae más al agua del lado cercano que al centro de la Tierra, y a éste más que al agua del lado opuesto: se forman dos abultamientos y hay dos mareas altas al día. El Sol produce un efecto menos de la mitad de intenso.</p></div>
<div class="dcard"><b>Mapas de gravedad</b><p>Los gravímetros detectan variaciones de \(g\) de una parte en cien millones. Con ellos se buscan minerales, petróleo y cavidades subterráneas, y los satélites GRACE miden cómo cambia la masa de hielo y de agua subterránea.</p></div>

<section>
<h2>La gravedad de un planeta</h2>
<p>Sobre un cuerpo de masa \(m\) a una distancia \(r\) del centro de un planeta de masa \(M\), la fuerza gravitacional es su peso: \(mg=GMm/r^2\). La masa \(m\) se cancela y queda la aceleración de la gravedad, igual para todos los cuerpos:</p>
<div class="eq key" data-name="Gravedad de un planeta">\[g(r)=\frac{G\,M}{r^2}\quad(r\ge R),\qquad g_0=\frac{G\,M}{R^2}\ \text{en la superficie}.\]</div>
<p>Con los datos de la Tierra, \(g_0=(6.674\times10^{-11})(5.97\times10^{24})/(6.37\times10^6)^2=9.8\) m/s². Al subir una altura \(h\), \(g=g_0\,R^2/(R+h)^2\): en la cima del Everest (8.8 km) vale 9.77 m/s²; a la altura de la Estación Espacial Internacional (400 km), 8.7 m/s². En la superficie, \(g\) también varía con la latitud (9.78 m/s² en el ecuador y 9.83 m/s² en los polos) por la rotación y el achatamiento de la Tierra.</p>
<p><strong>Dentro del planeta</strong> sólo atrae la masa que queda más cerca del centro que el cuerpo; la capa exterior no produce fuerza neta. Si la densidad fuera uniforme, \(g\) crecería linealmente desde cero en el centro: \(g=g_0\,r/R\).</p>

<p><strong>Los astronautas no flotan por falta de gravedad.</strong> En la Estación Espacial la gravedad es el 89 % de la de la superficie. Flotan porque ellos y la estación caen juntos, en caída libre permanente alrededor de la Tierra: nada los empuja contra el piso. Es la misma ingravidez que se siente por un instante en la bajada de una montaña rusa.</p>
</div>
<div class="box ex">
<h4>¿A qué altura la gravedad es la mitad?</h4>
<p>¿A qué altura sobre la superficie terrestre \(g\) vale la mitad de \(g_0\)?</p>
<details><summary>Solución</summary>
<p>\(g_0R^2/r^2=g_0/2\Rightarrow r=\sqrt2\,R=9010\) km, es decir, a \(h=r-R=0.414R\approx2640\) km de altura.</p>
</details>
</div>
</section>

<section>
<h2>Energía potencial gravitacional y velocidad de escape</h2>
<p>La expresión \(U=mgh\) sólo vale cerca de la superficie, donde \(g\) es casi constante. En general, tomando \(U=0\) cuando los cuerpos están infinitamente separados,</p>
<div class="eq key" data-name="Energía potencial gravitacional">\[U(r)=-\frac{G\,M\,m}{r},\qquad E=\tfrac12mv^2-\frac{G\,M\,m}{r}.\]</div>
<p>\(U\) es negativa y aumenta (se acerca a cero) al alejarse. Para una diferencia pequeña de altura, \(\Delta U\approx mg_0\,\Delta h\), y se recupera la expresión conocida. La energía total decide el destino de un proyectil:</p>
<ul>
<li>\(E\lt 0\): el cuerpo está <strong>ligado</strong>; cae de vuelta o queda en órbita elíptica.</li>
<li>\(E\ge 0\): el cuerpo <strong>escapa</strong> y nunca regresa.</li>
</ul>
<p>La rapidez mínima para escapar desde la superficie se obtiene con \(E=0\):</p>
<div class="eq key" data-name="Velocidad de escape">\[v_{\text{esc}}=\sqrt{\frac{2\,G\,M}{R}}=\sqrt{2\,g_0\,R}.\]</div>
<p>Para la Tierra \(v_{\text{esc}}=11.2\) km/s; para la Luna, sólo 2.4 km/s. No depende de la masa del proyectil ni de la dirección de lanzamiento (si no hay atmósfera que lo frene).</p>
<div class="sim" data-sim="canon-newton" data-title="El cañón de Newton: de la caída a la órbita y al escape"></div>
<div class="sim-guide"><ul>
<li>Con poca rapidez la bala cae; al aumentarla, cae cada vez más lejos hasta que la superficie «se curva» tan rápido como ella cae: es una órbita circular.</li>
<li>Entre la rapidez circular y la de escape las órbitas son elipses; en la barra de energía, \(E\) sigue siendo negativa.</li>
<li>Con \(v\ge v_{\text{esc}}\) la energía total es positiva o cero y la bala no regresa.</li>
</ul></div>
<div class="box hist">
<p>En su <em>Tratado del sistema del mundo</em> (1728), Newton imaginó un cañón en la cima de una montaña altísima: a mayor rapidez, la bala cae más lejos, hasta que da la vuelta completa a la Tierra sin tocarla. Así explicó que la Luna está cayendo continuamente hacia la Tierra, igual que una manzana, sólo que se mueve de lado tan rápido que nunca llega.</p>
</div>
<div class="box ex">
<h4>Escapar de la Tierra y de la Luna</h4>
<p>Calcule la velocidad de escape desde la superficie de la Tierra y desde la de la Luna (\(M_L=7.35\times10^{22}\) kg, \(R_L=1737\) km).</p>
<details><summary>Solución</summary>
<p>Tierra: \(\sqrt{2(6.674\times10^{-11})(5.97\times10^{24})/6.37\times10^{6}}=1.12\times10^4\) m/s. Luna: \(\sqrt{2(6.674\times10^{-11})(7.35\times10^{22})/1.737\times10^{6}}=2.38\times10^3\) m/s. Muchas moléculas de gas alcanzan esas rapideces por agitación térmica en la Luna, pero no en la Tierra: por eso la Luna no tiene atmósfera.</p>
<p><button class="try" type="button" data-try="canon-newton:escape">Probar en la simulación</button></p>
</details>
</div>
</section>

<section>
<h2>Satélites y órbitas circulares</h2>
<p>En una órbita circular la gravedad es la fuerza centrípeta: \(GMm/r^2=mv^2/r\). De ahí la rapidez y el periodo orbital, que no dependen de la masa del satélite:</p>
<div class="eq key" data-name="Órbita circular">\[v=\sqrt{\frac{G\,M}{r}},\qquad T=\frac{2\pi r}{v}=2\pi\sqrt{\frac{r^3}{G\,M}},\qquad E=-\frac{G\,M\,m}{2r}.\]</div>
<p>Cuanto más alta la órbita, más lento se mueve el satélite y más tarda en dar la vuelta. Curiosamente, un satélite que pierde energía por el roce con la atmósfera baja a una órbita menor… y se mueve <em>más rápido</em>.</p>

<section>
<h2>Las leyes de Kepler</h2>
<p>Johannes Kepler, analizando las precisas observaciones de Tycho Brahe, encontró tres leyes empíricas del movimiento planetario (1609–1619). Newton demostró que son consecuencias de su ley de gravitación:</p>
<ol>
<li><strong>Ley de las órbitas.</strong> Cada planeta describe una elipse con el Sol en uno de sus focos.</li>
<li><strong>Ley de las áreas.</strong> La recta Sol–planeta barre áreas iguales en tiempos iguales: el planeta va más rápido cerca del Sol (perihelio) y más despacio lejos (afelio). Es la conservación del momento angular, porque la fuerza es central (capítulo 12): \(r_pv_p=r_av_a\).</li>
<li><strong>Ley de los periodos.</strong> El cuadrado del periodo es proporcional al cubo del semieje mayor \(a\):</li>
</ol>
<div class="eq key" data-name="Tercera ley de Kepler">\[T^2=\frac{4\pi^2}{G\,M}\,a^3 .\]</div>
<p>Midiendo \(T\) y \(a\) de cualquier satélite se obtiene la masa del cuerpo central: así se “pesan” el Sol, los planetas con lunas y hasta el agujero negro del centro de la galaxia. Si \(T\) se mide en años y \(a\) en unidades astronómicas (1 UA = distancia media Tierra–Sol = \(1.496\times10^{11}\) m), para los planetas queda simplemente \(T^2=a^3\).</p>

<h4>El cometa Halley</h4>
<p>El cometa Halley regresa cada 75.3 años y en el perihelio pasa a 0.586 UA del Sol. Halle el semieje mayor de su órbita, su distancia en el afelio y la excentricidad.</p>

<p>\(a=T^{2/3}=75.3^{2/3}=17.8\) UA. Afelio: \(r_a=2a-r_p=35.0\) UA (más allá de Neptuno). Excentricidad: \(e=(r_a-r_p)/(r_a+r_p)=0.967\).</p>

<div class="box ex">
<h4>La masa del Sol</h4>
<p>Con el periodo de la Tierra (1 año \(=3.156\times10^7\) s) y el radio de su órbita (\(1.496\times10^{11}\) m), calcule la masa del Sol.</p>
<details><summary>Solución</summary>
<p>\(M=\dfrac{4\pi^2a^3}{GT^2}=\dfrac{39.48\,(1.496\times10^{11})^3}{(6.674\times10^{-11})(3.156\times10^{7})^2}=1.99\times10^{30}\) kg, unas 333 000 veces la masa de la Tierra.</p>
</details>

<div class="dcard"><b>El verano no es por la distancia</b><p>La Tierra pasa por el perihelio a comienzos de enero, cuando es invierno en el hemisferio norte. Las estaciones se deben a la inclinación del eje, no a la excentricidad de la órbita, que es muy pequeña (0.017).</p></div>

<section>
<h2>Preguntas y problemas</h2>
<ol class="problems">
<li><span class="lvl">Concepto</span>Si la Tierra atrae a la Luna, ¿por qué la Luna no cae sobre la Tierra?
<details><summary>Respuesta</summary><p>Sí cae, continuamente: en cada segundo se desvía unos 1.4 mm de la recta que seguiría sin gravedad. Pero se mueve de lado a 1 km/s, y la superficie de la Tierra “se aleja” tan rápido como ella cae: es una órbita.</p></details></li>
<li><span class="lvl">Concepto</span>Un astronauta en la Estación Espacial suelta una llave. ¿Qué le pasa a la llave? ¿Actúa la gravedad sobre ella?
<details><summary>Respuesta</summary><p>La llave flota junto al astronauta porque ambos caen con la misma aceleración (8.7 m/s²) alrededor de la Tierra. La gravedad actúa sobre ella; lo que desaparece es el peso aparente.</p></details></li>
<li><span class="lvl">Problema</span>¿Cuánto pesaría en Marte una persona que en la Tierra pesa 686 N?
<details><summary>Respuesta</summary><p>Su masa es 70 kg; en Marte \(w=70(3.71)=260\) N.</p></details></li>
<li><span class="lvl">Problema</span>Halle el periodo de un satélite que orbita a 1000 km de altura.
<details><summary>Respuesta</summary><p>\(r=7.37\times10^6\) m. \(T=2\pi\sqrt{r^3/GM}=2\pi\sqrt{(7.37\times10^6)^3/3.99\times10^{14}}=6.30\times10^3\) s \(\approx105\) min.</p></details></li>
<li><span class="lvl">Problema</span>Júpiter está a 5.20 UA del Sol. Sin usar \(G\), calcule su periodo orbital.
<details><summary>Respuesta</summary><p>\(T=a^{3/2}=5.20^{1.5}=11.9\) años.</p></details></li>
<li><span class="lvl">Problema</span>Calcule la velocidad de escape de Marte (\(M=6.42\times10^{23}\) kg, \(R=3390\) km).
<details><summary>Respuesta</summary><p>\(v=\sqrt{2GM/R}=\sqrt{2(6.674\times10^{-11})(6.42\times10^{23})/3.39\times10^6}=5.0\times10^3\) m/s.</p></details></li>
</ol>
