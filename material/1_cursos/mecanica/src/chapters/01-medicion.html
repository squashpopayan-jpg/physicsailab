<template class="chapter-src" data-id="medicion" data-num="1" data-title="Física y medición" data-part="Parte I · Fundamentos" data-short="Sistema Internacional, conversión de unidades, análisis dimensional, incertidumbre y estimaciones">
<p class="lead">La física es una ciencia experimental: sus leyes relacionan cantidades que se pueden medir. Antes de estudiar el movimiento conviene dominar el idioma de la medición: unidades, órdenes de magnitud, dimensiones e incertidumbre. Es el mismo idioma que usa un ingeniero para dimensionar un puente o una enfermera para dosificar un medicamento.</p>

<div class="keyideas"><ul>
<li>Toda magnitud física es un número multiplicado por una unidad; sin unidad, el número no dice nada.</li>
<li>El Sistema Internacional (SI) define siete unidades base a partir de constantes de la naturaleza.</li>
<li>Para convertir unidades se multiplica por factores que valen exactamente uno.</li>
<li>Una ecuación física es dimensionalmente homogénea: ambos lados tienen las mismas dimensiones.</li>
<li>Toda medición tiene incertidumbre, y el resultado se informa con las cifras significativas justas.</li>
</ul></div>

<section>
<h2>La física, sus modelos y la mecánica</h2>
<p>La física busca las leyes más generales de la naturaleza y las expresa en lenguaje matemático. La <strong>mecánica</strong> es su rama más antigua: estudia el movimiento de los cuerpos y las causas que lo producen. Se divide en tres partes que recorreremos en el curso:</p>
<ul>
<li><strong>Cinemática:</strong> describe el movimiento (posición, velocidad, aceleración) sin preguntar sus causas.</li>
<li><strong>Dinámica:</strong> relaciona el movimiento con las fuerzas que lo producen (leyes de Newton, energía, momento).</li>
<li><strong>Estática:</strong> estudia los cuerpos en equilibrio, como puentes, edificios o una escalera apoyada en la pared.</li>
</ul>
<p>Para estudiar un fenómeno se construye un <span class="term">modelo</span>: una versión simplificada que conserva lo esencial. Una pelota puede tratarse como una <em>partícula</em> (un punto con masa), una rueda como un <em>cuerpo rígido</em> que no se deforma, el agua de una tubería como un <em>fluido ideal</em>. El arte de la física consiste en elegir el modelo más sencillo que responda la pregunta con la precisión necesaria.</p>
<div class="box note">
<p>La mecánica de Newton describe con enorme precisión el mundo cotidiano. Deja de ser válida a velocidades cercanas a la de la luz (se necesita la relatividad) y a escala atómica (se necesita la mecánica cuántica). Aun así, con ella se diseñan puentes, se lanzan satélites y se predicen eclipses con siglos de anticipación.</p>
</div>
</section>

<section>
<h2>Magnitudes y el Sistema Internacional</h2>
<p>Una <strong>magnitud física</strong> es una propiedad que se puede medir: longitud, masa, tiempo, temperatura. Medir es comparar con un patrón llamado <strong>unidad</strong>. El resultado se escribe como un número seguido de la unidad: \(1.75\un{m}\), \(68\un{kg}\), \(9.58\un{s}\).</p>
<p>Desde 2019 las siete unidades base del SI se definen fijando el valor exacto de constantes de la naturaleza, de modo que cualquier laboratorio del mundo puede reproducirlas sin depender de un objeto guardado en París.</p>

<tr><td>Masa</td><td>kilogramo</td><td class="c">kg</td><td>la constante de Planck \(h\)</td></tr>

</tbody></table></div>
<p>En mecánica bastan las tres primeras. Las demás unidades son <strong>derivadas</strong>: se obtienen combinando las base. Por ejemplo, la unidad de fuerza es el newton, \(1\un{N}=1\un{kg\cdot m/s^2}\); la de energía, el joule, \(1\un{J}=1\un{N\cdot m}\); la de potencia, el watt, \(1\un{W}=1\un{J/s}\); la de presión, el pascal, \(1\un{Pa}=1\un{N/m^2}\).</p>

</div>

<section>
<h2>Conversión de unidades</h2>
<p>Una misma cantidad puede expresarse en unidades distintas: 1 km = 1000 m. Dividiendo ambos lados se obtiene un <span class="term">factor de conversión</span> que vale exactamente uno:</p>
<div class="eq">\[\frac{1000\un{m}}{1\un{km}}=1\qquad\text{y también}\qquad\frac{1\un{km}}{1000\un{m}}=1.\]</div>
<p>Multiplicar por uno no cambia la cantidad, sólo su expresión. Se elige la versión del factor que deja la unidad que se quiere eliminar en el lado opuesto de la fracción, para que se <em>cancele</em>. Por ejemplo, para pasar 72 km/h a m/s:</p>
<div class="eq">\[72\,\frac{\text{km}}{\text{h}}\times\frac{1000\un{m}}{1\un{km}}\times\frac{1\un{h}}{3600\un{s}}=20\,\frac{\text{m}}{\text{s}}.\]</div>
<p>De aquí sale la regla práctica: para pasar de km/h a m/s se divide entre 3.6. Con áreas y volúmenes el factor se eleva al cuadrado o al cubo: \(1\un{m^2}=(100\un{cm})^2=10^4\un{cm^2}\) y \(1\un{m^3}=10^6\un{cm^3}=1000\un{L}\).</p>
<div class="sim" data-sim="conversor" data-title="Conversor con factores unitarios: las unidades se cancelan"></div>
<div class="box ex">
<h4>Una piscina y un tanque de agua</h4>
<p>Una piscina mide 25 m × 10 m × 1.8 m. ¿Cuántos litros de agua contiene? Si se llena con una manguera que entrega 20 L/min, ¿cuántos días tarda?</p>
<details><summary>Solución</summary>
<p>Volumen: \(V=25\times10\times1.8=450\un{m^3}\). Como \(1\un{m^3}=1000\un{L}\), \(V=4.5\times10^5\un{L}\).</p>
<p>Tiempo: \(t=\dfrac{4.5\times10^5\un{L}}{20\un{L/min}}=2.25\times10^4\un{min}\times\dfrac{1\un{h}}{60\un{min}}\times\dfrac{1\un{día}}{24\un{h}}=15.6\) días.</p>
</details>
</div>
<div class="box hist">
<p>En 1999 la sonda <em>Mars Climate Orbiter</em> de la NASA se destruyó al entrar demasiado bajo en la atmósfera de Marte. Un equipo entregó los impulsos de los propulsores en libras-fuerza·segundo y el otro los interpretó como newton·segundo: un factor de 4.45 que costó una misión de 125 millones de dólares. En 1983 un avión de Air Canada se quedó sin combustible en pleno vuelo porque la carga se calculó en libras en lugar de kilogramos.</p>
</div>
<div class="box warn">
<p><strong>\(1\un{m^2}\) no es igual a \(100\un{cm^2}\).</strong> Un cuadrado de 1 m de lado tiene 100 cm por lado, así que su área es \(100\times100=10\,000\un{cm^2}\).</p>
</div>
</section>

<section>
<h2>Análisis dimensional</h2>
<p>La <strong>dimensión</strong> de una magnitud indica de qué magnitudes base está hecha, sin importar la unidad. Se escribe entre corchetes: \([L]\) longitud, \([M]\) masa, \([T]\) tiempo. Así,</p>
<div class="eq">\[[v]=\frac{L}{T},\qquad[a]=\frac{L}{T^2},\qquad[F]=\frac{ML}{T^2},\qquad[E]=\frac{ML^2}{T^2}.\]</div>
<div class="box law">
<h4>Principio de homogeneidad dimensional</h4>
<p>Sólo se pueden sumar, restar o igualar cantidades con las mismas dimensiones. Los argumentos de funciones como seno, coseno, exponencial o logaritmo deben ser adimensionales.</p>
</div>
<p>Este principio sirve para dos cosas. Primero, para <em>detectar errores</em>: si al despejar obtiene \(x=v\,t^2\), algo falló, porque \([v\,t^2]=LT\ne L\). Segundo, para <em>deducir</em> la forma de una ley. Suponga que el periodo \(T\) de un péndulo puede depender de su longitud \(L\), de la masa \(m\) y de \(g\). Si \(T=C\,L^a m^b g^c\) con \(C\) adimensional, entonces</p>
<div class="eq">\[T^1=L^{a}\,M^{b}\left(\frac{L}{T^2}\right)^{c}=L^{a+c}\,M^{b}\,T^{-2c}\quad\Longrightarrow\quad a+c=0,\ \ b=0,\ \ -2c=1.\]</div>
<p>Luego \(c=-\tfrac12\), \(a=\tfrac12\) y \(b=0\): \(T=C\sqrt{L/g}\). ¡La masa no interviene! El análisis dimensional no da el valor de \(C\); el experimento (o la teoría del capítulo 17) muestra que \(C=2\pi\).</p>
<div class="sim" data-sim="dimensional" data-title="Deducir el periodo del péndulo con análisis dimensional"></div>
<div class="sim-guide"><ul>
<li>Busque los exponentes que igualan las dimensiones: las tres barras deben coincidir con la meta.</li>
<li>Con exponentes equivocados, ningún valor de \(C\) hace que la curva pase por los datos medidos. Con los correctos, el ajuste da \(C\approx6.28=2\pi\).</li>
</ul></div>
</section>

<section>
<h2>Incertidumbre, cifras significativas y errores</h2>
<p>Ninguna medición es perfecta. Un metro de carpintero con divisiones de 1 mm permite leer, como mucho, hasta medio milímetro; un cronómetro manual depende del tiempo de reacción de quien lo opera. Por eso todo resultado experimental se informa como un valor más una <strong>incertidumbre</strong>: \(L=(24.3\pm0.1)\un{cm}\).</p>
<h3>Exactitud y precisión</h3>
<p>Son dos cualidades distintas. Una medición es <strong>exacta</strong> si está cerca del valor verdadero y es <strong>precisa</strong> si, al repetirla, los resultados son parecidos entre sí.</p>

<h3>Errores aleatorios y sistemáticos</h3>
<ul>
<li><strong>Errores aleatorios:</strong> varían al azar de una medición a otra (tiempo de reacción, pequeñas vibraciones, lectura de una escala). Se reducen repitiendo la medición y promediando.</li>
<li><strong>Errores sistemáticos:</strong> desplazan todas las mediciones en el mismo sentido (una balanza mal calibrada, una regla dilatada, detener siempre el cronómetro tarde). Promediar <em>no</em> los elimina: hay que calibrar el instrumento o corregir el método.</li>
</ul>
<p>Si se repite \(N\) veces una medición con resultados \(x_i\), la mejor estimación es el promedio \(\bar{x}\); la dispersión de los datos se mide con la desviación estándar \(s\), y la incertidumbre del promedio con el <strong>error estándar</strong>:</p>
<div class="eq key" data-name="Estadística de mediciones repetidas">\[\bar{x}=\frac1N\sum_{i=1}^{N}x_i,\qquad s=\sqrt{\frac{\sum(x_i-\bar{x})^2}{N-1}},\qquad \sigma_{\bar x}=\frac{s}{\sqrt N}.\]</div>
<p>El error estándar disminuye como \(1/\sqrt N\): para reducir la incertidumbre a la mitad hay que hacer cuatro veces más mediciones.</p>
<div class="sim" data-sim="mediciones" data-title="Midiendo el periodo de un péndulo con cronómetro"></div>
<div class="sim-guide"><ul>
<li>Haga 10 mediciones y luego 100: el histograma se parece cada vez más a una campana y el error estándar baja.</li>
<li>Agregue un error sistemático de 0.15 s (detener tarde el cronómetro): el promedio se aleja del valor verdadero aunque la incertidumbre sea pequeña. Muy preciso, poco exacto.</li>
<li>Active “cronometrar 10 oscilaciones”: el error de reacción se reparte entre 10 periodos y la dispersión cae diez veces.</li>
</ul></div>
<h3>Cifras significativas</h3>
<p>Las <strong>cifras significativas</strong> de un número son los dígitos que se conocen con confianza más el primero incierto. En \(0.00250\) m hay tres: los ceros de la izquierda sólo ubican la coma, pero el cero final indica que se midió hasta esa posición. Para evitar ambigüedades se usa notación científica: \(2.50\times10^{-3}\) m.</p>
<ul>
<li><strong>Al multiplicar o dividir,</strong> el resultado lleva tantas cifras significativas como el dato que menos tenga: \(1.25\un{m}\times0.82\un{m}=1.025\un{m^2}\to1.0\un{m^2}\).</li>
<li><strong>Al sumar o restar,</strong> el resultado lleva tantos decimales como el dato con menos decimales: \(12.3\un{cm}+0.456\un{cm}=12.756\to12.8\un{cm}\).</li>
<li>La incertidumbre se redondea a una o dos cifras y el valor se redondea en la misma posición: \((9.7864\pm0.0371)\un{m/s^2}\to(9.79\pm0.04)\un{m/s^2}\).</li>
</ul>
<div class="box warn">
<p><strong>La calculadora no sabe física.</strong> Si divide 10 m entre 3 s, la pantalla muestra 3.333333333, pero el resultado sólo merece dos cifras: 3.3 m/s. Informar más cifras aparenta una precisión que la medición no tiene.</p>
</div>
</section>

<section>
<h2>Estimaciones y problemas de Fermi</h2>
<p>El físico Enrico Fermi era famoso por estimar en minutos cantidades que parecían imposibles de calcular, con sólo razonamiento y órdenes de magnitud. La técnica consiste en descomponer la pregunta en factores que se pueden estimar y multiplicarlos, sin preocuparse por más de una cifra significativa.</p>
<div class="box ex">
<h4>¿Cuántas veces late el corazón en una vida?</h4>
<p>Estime el número de latidos de una persona que vive 75 años.</p>
<details><summary>Solución</summary>
<p>Unos 70 latidos por minuto. Un año tiene \(60\times24\times365\approx5\times10^5\) minutos. Entonces \(70\times5\times10^5\times75\approx3\times10^9\) latidos: del orden de tres mil millones.</p>
</details>
</div>
<div class="box ex">
<h4>El agua que usa una ciudad</h4>
<p>Una persona usa en su casa unos 150 L de agua al día. Estime el volumen diario que consume una ciudad de 8 millones de habitantes y compárelo con una piscina olímpica (2500 m³).</p>
<details><summary>Solución</summary>
<p>\(8\times10^6\times150\un{L}=1.2\times10^9\un{L}=1.2\times10^6\un{m^3}\). Equivale a unas 500 piscinas olímpicas cada día.</p>
</details>
</div>
<div class="daily">
<h4>Estimaciones cotidianas</h4>
<div class="daily-grid">
<div class="dcard"><b>¿Cuánto respiramos?</b><p>Unas 15 respiraciones por minuto con medio litro cada una: más de 10 000 litros de aire al día.</p></div>
<div class="dcard"><b>Arroz en un paquete</b><p>Un grano pesa unos 0.02 g, así que un paquete de 1 kg tiene del orden de 50 000 granos.</p></div>
<div class="dcard"><b>Pasos hasta la luna</b><p>Con pasos de 0.7 m, los 384 000 km hasta la Luna son unos \(5\times10^8\) pasos: caminando 10 000 pasos diarios, 150 años.</p></div>
</div>
</div>
</section>

<section>
<h2>Preguntas y problemas</h2>
<ol class="problems">
<li><span class="lvl">Concepto</span>¿Por qué no se puede sumar 3 m + 2 s? ¿Y por qué sí se puede multiplicar 3 m × 2 s?
<details><summary>Respuesta</summary><p>Sumar exige cantidades de la misma dimensión: el resultado debe tener una sola dimensión. Al multiplicar se forma una nueva magnitud con dimensión \(LT\) (6 m·s), que es perfectamente válida.</p></details></li>
<li><span class="lvl">Concepto</span>Un estudiante mide diez veces el ancho de una mesa con una regla a la que le falta el primer centímetro. ¿Qué tipo de error comete? ¿Lo reduce promediando?
<details><summary>Respuesta</summary><p>Un error sistemático de 1 cm (todas las mediciones salen 1 cm más largas). Promediar no lo elimina; hay que corregir restando 1 cm.</p></details></li>
<li><span class="lvl">Problema</span>La rapidez de la luz es \(3.00\times10^8\) m/s. Exprésela en km/h y calcule cuánto tarda la luz en recorrer los 384 000 km hasta la Luna.
<details><summary>Respuesta</summary><p>\(1.08\times10^9\) km/h. Tarda \(3.84\times10^8/3.00\times10^8=1.28\) s.</p></details></li>
<li><span class="lvl">Problema</span>¿Es dimensionalmente correcta la ecuación \(x=v_0t+\tfrac12at^2\)? ¿Y \(v^2=v_0^2+2at\)?
<details><summary>Respuesta</summary><p>La primera sí: los tres términos tienen dimensión \(L\). La segunda no: \([v^2]=L^2/T^2\) pero \([at]=L/T\). La correcta es \(v^2=v_0^2+2a\Delta x\).</p></details></li>
<li><span class="lvl">Problema</span>Una hoja de papel tiene 0.1 mm de espesor. Si se pudiera doblar por la mitad 42 veces, ¿qué altura tendría el paquete? Compare con la distancia a la Luna.
<details><summary>Respuesta</summary><p>\(0.1\un{mm}\times2^{42}=4.4\times10^{11}\un{mm}=4.4\times10^5\) km: más que la distancia a la Luna. El crecimiento exponencial es engañoso.</p></details></li>
<li><span class="lvl">Problema</span>Cinco mediciones del periodo de un péndulo dan 2.03, 1.98, 2.06, 1.95 y 2.01 s. Informe el resultado con su incertidumbre.
<details><summary>Respuesta</summary><p>\(\bar T=2.006\) s, \(s=0.043\) s, error estándar \(0.043/\sqrt5=0.019\) s. Resultado: \(T=(2.01\pm0.02)\) s.</p></details></li>
</ol>
