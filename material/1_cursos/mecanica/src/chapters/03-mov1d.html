<template class="chapter-src" data-id="mov1d" data-num="3" data-title="Movimiento en una dimensión" data-part="Parte II · Cinemática" data-short="Posición, velocidad, aceleración, MRU, MRUA, caída libre y persecuciones">
<p class="lead">La cinemática describe cómo se mueven los cuerpos sin preguntar todavía por qué se mueven. En una línea recta basta un número con signo para dar la posición, y tres funciones del tiempo, \(x(t)\), \(v(t)\) y \(a(t)\), cuentan toda la historia del movimiento. Aprender a leer y dibujar esas tres gráficas es la habilidad central de este capítulo.</p>

<div class="keyideas"><ul>
<li>La posición depende del origen que se elija; el desplazamiento \(\Delta x\) no depende de él.</li>
<li>La velocidad es la pendiente de la gráfica \(x(t)\) y la aceleración es la pendiente de \(v(t)\).</li>
<li>El área bajo \(v(t)\) es el desplazamiento; el área bajo \(a(t)\) es el cambio de velocidad.</li>
<li>Con aceleración constante valen cuatro ecuaciones cinemáticas que resuelven casi cualquier problema.</li>
<li>Sin aire, todos los cuerpos caen con la misma aceleración \(g\approx9.8\) m/s², sin importar su masa.</li>
</ul></div>

<section>
<h2>Posición, desplazamiento y velocidad media</h2>
<p>Para describir un movimiento se usa el <span class="term">modelo de partícula</span>: el cuerpo se trata como un punto, sin importar su tamaño ni su forma. Es una buena aproximación cuando sólo interesa dónde está el objeto y no cómo gira o se deforma: un auto en una carretera, un atleta en la pista, un tren entre dos estaciones.</p>
<p>Además se necesita un <span class="term">sistema de referencia</span>: un origen, un eje con sentido positivo elegido y un reloj. La <strong>posición</strong> \(x\) es la coordenada de la partícula sobre ese eje (en metros); su signo indica de qué lado del origen está.</p>
<div class="box def">
<h4>Desplazamiento y distancia recorrida</h4>
<p>El <strong>desplazamiento</strong> es el cambio de posición entre dos instantes: \(\Delta x=x_f-x_i\). Tiene signo: positivo si el cuerpo terminó más adelante en el sentido del eje, negativo si terminó más atrás. La <strong>distancia recorrida</strong> es la longitud total del camino, siempre positiva, y nunca es menor que \(\abs{\Delta x}\).</p>
</div>
<p>Si caminas 300 m hasta la tienda y regresas a casa, recorriste 600 m pero tu desplazamiento es cero. El desplazamiento sólo “mira” el punto de partida y el de llegada.</p>
<h3>Velocidad media y rapidez media</h3>
<p>La <strong>velocidad media</strong> es el desplazamiento dividido entre el intervalo de tiempo; la <strong>rapidez media</strong> es la distancia recorrida dividida entre el mismo intervalo:</p>
<div class="eq key" data-name="Velocidad media">\[v_{\text{prom}}=\frac{\Delta x}{\Delta t}=\frac{x_f-x_i}{t_f-t_i},\qquad \text{rapidez media}=\frac{d}{\Delta t}.\]</div>
<p>La velocidad media tiene signo (indica el sentido neto del movimiento); la rapidez media es siempre positiva. En la gráfica de posición contra tiempo, la velocidad media entre dos instantes es la <strong>pendiente de la recta secante</strong> que une los dos puntos de la curva.</p>
<div class="box ex">
<h4>Un paseo en bicicleta</h4>
<p>Una ciclista recorre 12 km hacia el norte en 30 min, descansa 10 min y luego regresa 4 km hacia el sur en 20 min. Halle su velocidad media y su rapidez media en todo el paseo.</p>
<details><summary>Solución</summary>
<p>Tome el norte como sentido positivo. El desplazamiento es \(\Delta x=+12-4=+8\) km y el tiempo total es \(30+10+20=60\) min \(=1\) h. La velocidad media es \(v_{\text{prom}}=8\) km/h hacia el norte. La distancia recorrida es \(12+4=16\) km, así que la rapidez media es \(16\) km/h. Las dos cantidades son distintas porque hubo un tramo de regreso; el descanso cuenta en el tiempo total aunque no haya movimiento.</p>
</details>
</div>
<div class="daily">
<h4>En la vida cotidiana</h4>
<div class="daily-grid">
<div class="dcard"><b>Un viaje por carretera</b><p>Entre Popayán y Cali hay unos 140 km de carretera pero sólo unos 112 km en línea recta. Si el viaje dura 2.5 h, la rapidez media es 56 km/h y la velocidad media, 45 km/h hacia el norte.</p></div>

</div>
</section>

<section>
<h2>Velocidad instantánea</h2>
<p>El velocímetro de un auto no muestra un promedio: indica qué tan rápido se mueve el auto <em>en ese instante</em>. Para definir esa velocidad instantánea se toma la velocidad media en intervalos cada vez más cortos alrededor del instante \(t\). Cuando \(\Delta t\to0\), la recta secante de la gráfica \(x(t)\) gira hasta coincidir con la <strong>recta tangente</strong>, y su pendiente es la velocidad instantánea:</p>
<div class="eq key" data-name="Velocidad instantánea">\[v=\lim_{\Delta t\to0}\frac{\Delta x}{\Delta t}=\frac{\dd x}{\dd t}.\]</div>
<p>La <strong>rapidez</strong> instantánea es el valor absoluto \(\abs{v}\). Leída sobre la gráfica \(x(t)\):</p>
<ul>
<li>pendiente positiva → el cuerpo avanza en el sentido del eje (\(v\gt0\));</li>
<li>pendiente negativa → se mueve en sentido contrario (\(v\lt0\));</li>
<li>tangente horizontal → está instantáneamente en reposo (\(v=0\)), como en el punto más alto de un lanzamiento o donde un auto da reversa;</li>
<li>curva más empinada → mayor rapidez.</li>
</ul>
<div class="box ex">
<h4>La secante se convierte en tangente</h4>
<p>La posición de un carrito es \(x(t)=3t^2-2t+1\) (en metros, con \(t\) en segundos). Calcule la velocidad media entre \(t=2\) s y \(t=2+\Delta t\) para \(\Delta t=1\), \(0.1\) y \(0.01\) s, y compárela con la velocidad instantánea en \(t=2\) s.</p>
<details><summary>Solución</summary>
<p>\(x(2)=9\) m. Con \(\Delta t=1\) s: \(x(3)=22\) m y \(v_{\text{prom}}=13\) m/s. Con \(\Delta t=0.1\) s: \(x(2.1)=10.03\) m y \(v_{\text{prom}}=10.3\) m/s. Con \(\Delta t=0.01\) s: \(x(2.01)=9.1003\) m y \(v_{\text{prom}}=10.03\) m/s.</p>
<p>Derivando, \(v(t)=6t-2\), de modo que \(v(2)=10\) m/s: la velocidad media se acerca a este valor a medida que el intervalo se achica. En general, \(v_{\text{prom}}=6t+3\Delta t-2\to6t-2\).</p>
</details>
</div>
<div class="sim" data-sim="v-inst" data-title="De la velocidad media a la instantánea: secante y tangente"></div>
<div class="sim-guide"><ul>
<li>Fije \(t_1\) y presione <em>Δt → 0</em>: la recta secante (morada) gira hasta confundirse con la tangente (verde) y la velocidad media converge a la instantánea.</li>
<li>En “Ida y vuelta”, ubique \(t_1\) donde la curva tiene su máximo: la tangente es horizontal y \(v=0\), aunque el carro no esté quieto un instante antes ni un instante después.</li>
<li>Pase el cursor sobre la gráfica para leer \(x\) en cualquier instante.</li>
</ul></div>
<div class="box warn">
<p><strong>“Velocidad negativa” no significa “frenar”.</strong> El signo de la velocidad sólo indica el sentido del movimiento respecto al eje elegido. Un auto que va en reversa cada vez más rápido tiene velocidad negativa y su rapidez está aumentando.</p>
</div>
</section>

<section>
<h2>Aceleración</h2>
<p>La aceleración mide qué tan rápido cambia la velocidad. Se define de la misma forma que la velocidad, pero a partir de \(v(t)\):</p>
<div class="eq key" data-name="Aceleración">\[a_{\text{prom}}=\frac{\Delta v}{\Delta t},\qquad a=\frac{\dd v}{\dd t}=\frac{\dd^2x}{\dd t^2}.\]</div>
<p>Su unidad es (m/s)/s = m/s²: una aceleración de 3 m/s² significa que la velocidad cambia 3 m/s cada segundo. Gráficamente, la aceleración es la pendiente de la curva \(v(t)\) y se manifiesta como la <em>curvatura</em> de \(x(t)\): la curva se abre hacia arriba si \(a\gt0\) y hacia abajo si \(a\lt0\).</p>
<h3>¿Acelera o frena?</h3>
<p>Lo que decide si un cuerpo gana o pierde rapidez no es el signo de \(a\) por sí solo, sino su signo <em>comparado</em> con el de \(v\):</p>
<div class="tablewrap narrow"><table>
<thead><tr><th>Velocidad</th><th>Aceleración</th><th>La rapidez…</th><th>Ejemplo</th></tr></thead>
<tbody>
<tr><td class="c">\(+\)</td><td class="c">\(+\)</td><td>aumenta</td><td>Auto que arranca hacia adelante</td></tr>
<tr><td class="c">\(+\)</td><td class="c">\(-\)</td><td>disminuye</td><td>Auto que frena ante un semáforo</td></tr>
<tr><td class="c">\(-\)</td><td class="c">\(-\)</td><td>aumenta</td><td>Auto que acelera en reversa</td></tr>
<tr><td class="c">\(-\)</td><td class="c">\(+\)</td><td>disminuye</td><td>Pelota que cae y es frenada por un colchón</td></tr>
</tbody></table></div>
<div class="daily">
<h4>Aceleraciones típicas</h4>
<div class="daily-grid">
<div class="dcard"><b>Auto familiar arrancando</b><p>De 0 a 100 km/h (27.8 m/s) en unos 10 s: \(a\approx2.8\) m/s². Un auto deportivo lo logra en 3 s, más de 9 m/s².</p></div>
<div class="dcard"><b>Frenado de emergencia</b><p>Sobre asfalto seco un auto moderno frena con cerca de \(-8\) m/s²; sobre asfalto mojado, alrededor de \(-5\) m/s².</p></div>
<div class="dcard"><b>Ascensor</b><p>Los ascensores arrancan y frenan con unos 1 m/s²; por eso sentimos que “pesamos” más o menos por un momento (capítulo 5).</p></div>
<div class="dcard"><b>Despegue de un avión</b><p>Un avión comercial alcanza unos 75 m/s en la pista en 30–35 s: una aceleración media de 2 a 2.5 m/s².</p></div>
</div>
</div>
<div class="box warn">
<p><strong>“Aceleración negativa” no significa “frenar”.</strong> Una pelota que cae (eje hacia arriba) tiene \(a=-g\) y su rapidez aumenta. Frena sólo cuando \(a\) y \(v\) tienen signos opuestos.</p>
</div>
</section>

<section>
<h2>Movimiento con aceleración constante</h2>
<p>Muchos movimientos reales tienen, al menos por tramos, aceleración constante: un auto que frena con los frenos a fondo, un objeto que cae cerca de la superficie terrestre, un tren que sale de la estación. Si \(a\) es constante, la gráfica \(v(t)\) es una recta y todo se puede calcular con geometría elemental.</p>
<h3>Movimiento rectilíneo uniforme (MRU)</h3>
<p>Si \(a=0\), la velocidad no cambia y la posición crece linealmente: \(x=x_0+vt\). La gráfica \(x(t)\) es una recta cuya pendiente es la velocidad.</p>
<h3>Movimiento rectilíneo uniformemente acelerado (MRUA)</h3>
<p>Con \(a\) constante, la velocidad cambia linealmente: \(v=v_0+at\). El desplazamiento es el área bajo la recta \(v(t)\), un trapecio de bases \(v_0\) y \(v\) y altura \(t\): \(\Delta x=\tfrac12(v_0+v)t\). Sustituyendo \(v\) se obtiene la posición, y eliminando \(t\) entre las dos primeras se obtiene una relación sin tiempo:</p>
<div class="eq key" data-name="Ecuaciones del MRUA">\[\begin{aligned}
v&=v_0+a\,t\\
x&=x_0+v_0\,t+\tfrac12\,a\,t^2\\
v^2&=v_0^2+2a\,(x-x_0)\\
x-x_0&=\tfrac12\,(v_0+v)\,t
\end{aligned}\]</div>
<p>Cada ecuación omite una de las cinco variables \((x-x_0,\ v_0,\ v,\ a,\ t)\). Para resolver un problema se identifica cuál de ellas no se conoce ni se pide, y se usa la ecuación que no la contiene.</p>
<h3>Del área a la pendiente: leer las tres gráficas juntas</h3>
<ul>
<li><strong>De arriba hacia abajo (pendientes):</strong> la pendiente de \(x(t)\) da \(v\); la pendiente de \(v(t)\) da \(a\).</li>
<li><strong>De abajo hacia arriba (áreas):</strong> el área bajo \(a(t)\) entre dos instantes es \(\Delta v\); el área bajo \(v(t)\) es \(\Delta x\). Las áreas por debajo del eje horizontal cuentan como negativas.</li>
</ul>
<div class="sim" data-sim="mrua" data-title="El carro y sus tres gráficas: x(t), v(t) y a(t)"></div>
<div class="sim-guide"><ul>
<li>Elija “Pelota lanzada cuesta arriba”: observe que cuando \(v(t)\) cruza el eje, \(x(t)\) tiene su máximo, y que \(a\) nunca cambia.</li>
<li>Active “Área bajo v(t)” y compare el número que aparece con \(\Delta x\) en las lecturas.</li>
<li>Durante la animación, mueva el deslizador de \(a\): la gráfica \(a(t)\) da un salto, \(v(t)\) cambia de pendiente y \(x(t)\) cambia de curvatura, pero ninguna de las dos últimas salta.</li>
<li>En el diagrama de movimiento (una imagen cada 0.5 s), los puntos se separan cuando el carro acelera y se juntan cuando frena.</li>
</ul></div>
<div class="box ex">
<h4>Frenar ante un semáforo</h4>
<p>Un auto va a 54 km/h cuando el conductor ve un semáforo en rojo y frena con aceleración constante de \(-3.0\) m/s². ¿Cuánto tarda en detenerse y qué distancia recorre frenando?</p>
<details><summary>Solución</summary>
<p>\(v_0=54\) km/h \(=15\) m/s y \(v=0\). De \(v=v_0+at\): \(t=(0-15)/(-3.0)=5.0\) s. De \(v^2=v_0^2+2a\Delta x\): \(\Delta x=-v_0^2/(2a)=225/6.0=37.5\) m.</p>
<p>Si antes de frenar el conductor tarda 0.8 s en reaccionar, en ese tiempo avanza otros \(15\times0.8=12\) m a velocidad constante: la distancia total de detención es casi 50 m.</p>
<p><button class="try" type="button" data-try="mrua:semaforo">Probar en la simulación</button></p>
</details>
</div>
<div class="box note">
<p>La distancia de frenado crece con el <em>cuadrado</em> de la rapidez: a 108 km/h (el doble de 54 km/h) el mismo auto necesita 150 m, cuatro veces más. Por eso los límites de velocidad cerca de escuelas y hospitales son bajos.</p>
</div>
</section>

<section>
<h2>Caída libre y lanzamiento vertical</h2>
<p>Cerca de la superficie terrestre, y si la resistencia del aire es despreciable, todo cuerpo en caída libre tiene la misma aceleración, dirigida hacia abajo:</p>
<div class="eq key" data-name="Aceleración de caída libre">\[g=9.8\un{m/s^2}\ \text{(hacia abajo)}.\]</div>
<p>“Caída libre” significa que la única fuerza que actúa es el peso; incluye los cuerpos que suben después de ser lanzados. Con el eje \(y\) hacia arriba, \(a=-g\) y las ecuaciones del MRUA quedan</p>
<div class="eq">\[v=v_0-g\,t,\qquad y=y_0+v_0\,t-\tfrac12 g\,t^2,\qquad v^2=v_0^2-2g\,(y-y_0).\]</div>
<p>Para un lanzamiento vertical hacia arriba con rapidez \(v_0\): el tiempo de subida es \(t_s=v_0/g\), la altura máxima sobre el punto de lanzamiento es \(h=v_0^2/(2g)\) y, si vuelve al mismo nivel, lo hace con la misma rapidez \(v_0\) tras un tiempo \(2t_s\). El movimiento de subida es la película del de bajada proyectada al revés.</p>
<div class="box warn">
<p><strong>En el punto más alto la velocidad es cero, pero la aceleración no.</strong> Sigue valiendo \(-g\). Si la aceleración fuera cero allí, la pelota se quedaría flotando.</p>
</div>
<div class="box hist">
<p>Aristóteles enseñaba que los cuerpos pesados caen más rápido que los livianos. Galileo (hacia 1600) mostró con planos inclinados que todos aceleran igual si el aire no interviene. En 1971 el astronauta David Scott soltó un martillo y una pluma en la Luna, sin atmósfera: llegaron al suelo al mismo tiempo.</p>
</div>
<div class="sim" data-sim="caida-libre" data-title="Caída libre y lanzamiento vertical con imagen estroboscópica"></div>
<div class="sim-guide"><ul>
<li>Active la segunda bola (soltada desde el reposo): aunque tengan masas distintas, sin aire caen juntas.</li>
<li>Con el estroboscopio cada 0.2 s, la separación entre imágenes crece en progresión aritmética: 1, 3, 5, 7… veces la primera (regla de Galileo).</li>
<li>Cambie el planeta: en la Luna todo ocurre más despacio pero con la misma forma de las gráficas.</li>
</ul></div>
<div class="box ex">
<h4>Una pelota lanzada hacia arriba</h4>
<p>Desde 1.5 m sobre el suelo se lanza una pelota verticalmente hacia arriba a 15 m/s. Halle la altura máxima, el tiempo que tarda en llegar al suelo y la velocidad con que llega.</p>
<details><summary>Solución</summary>
<p>Tiempo de subida: \(t_s=15/9.8=1.53\) s. Altura máxima: \(y_{\max}=1.5+\dfrac{15^2}{2(9.8)}=1.5+11.5=13.0\) m.</p>
<p>Al llegar al suelo \(y=0\): \(0=1.5+15t-4.9t^2\), cuya raíz positiva es \(t=3.16\) s. Entonces \(v=15-9.8(3.16)=-16.0\) m/s: baja a 16 m/s, un poco más rápido que la rapidez de lanzamiento porque cae 1.5 m más de lo que subió.</p>
<p><button class="try" type="button" data-try="caida-libre:arriba">Probar en la simulación</button></p>
</details>
</div>
<h3>Tu tiempo de reacción</h3>
<p>La caída libre permite medir el tiempo de reacción con una regla: alguien la suelta sin avisar y tú la atrapas. Si la regla cayó una distancia \(d\) antes de que cerraras los dedos, tu tiempo de reacción fue \(t=\sqrt{2d/g}\). Atrapar a 20 cm corresponde a 0.20 s, un valor típico.</p>

<section>
<h2>Encuentros y persecuciones</h2>
<p>Cuando dos cuerpos se mueven sobre la misma recta, se escribe la posición de cada uno en función del tiempo <em>con el mismo origen y el mismo reloj</em>. Se encuentran cuando ocupan la misma posición al mismo tiempo:</p>
<div class="eq">\[x_A(t_e)=x_B(t_e).\]</div>
<p>En una gráfica \(x(t)\) el encuentro es el punto donde se cortan las dos curvas. Si una de ellas es una parábola (MRUA) y la otra una recta (MRU), la ecuación es cuadrática y puede tener dos soluciones (se cruzan dos veces), una (apenas se alcanzan) o ninguna (nunca se encuentran).</p>
<div class="box ex">
<h4>La patrulla y el infractor</h4>
<p>Un auto pasa a 20 m/s (72 km/h) junto a una patrulla detenida. Un segundo después la patrulla arranca con aceleración constante de 2.5 m/s². ¿Cuándo y dónde lo alcanza?</p>
<details><summary>Solución</summary>
<p>Con el origen en la patrulla y \(t=0\) cuando pasa el auto: \(x_A=20t\) y, para \(t\ge1\) s, \(x_B=1.25\,(t-1)^2\). Igualando: \(1.25t^2-22.5t+1.25=0\), es decir \(t^2-18t+1=0\), con raíz útil \(t_e=17.9\) s. La posición de encuentro es \(x_e=20(17.9)=359\) m, y en ese momento la patrulla va a \(2.5(16.9)=42\) m/s, más del doble que el auto.</p>
<p><button class="try" type="button" data-try="encuentro:patrulla">Probar en la simulación</button></p>
</details>
</div>
<div class="sim" data-sim="encuentro" data-title="Dos móviles en la misma recta: ¿dónde y cuándo se encuentran?"></div>
<div class="sim-guide"><ul>
<li>En la persecución, observe en la gráfica \(v(t)\) que cuando la patrulla iguala la velocidad del auto (las rectas se cruzan) la distancia entre ellos es máxima, no mínima.</li>
<li>Pruebe los buses que viajan en sentidos opuestos: la gráfica \(x(t)\) muestra una recta que sube y otra que baja.</li>

</section>

<section>
<h2>Preguntas y problemas</h2>
<ol class="problems">
<li><span class="lvl">Concepto</span>¿Puede un cuerpo tener velocidad cero y aceleración distinta de cero? Dé un ejemplo.
<details><summary>Respuesta</summary><p>Sí. Una pelota lanzada hacia arriba tiene \(v=0\) en el punto más alto y \(a=-g\). También un auto en el instante en que cambia de marcha adelante a reversa.</p></details></li>
<li><span class="lvl">Concepto</span>En una gráfica \(x(t)\), ¿qué significa que la curva sea una recta horizontal? ¿Y en una gráfica \(v(t)\)?
<details><summary>Respuesta</summary><p>En \(x(t)\), el cuerpo está en reposo. En \(v(t)\), se mueve con velocidad constante (MRU), y la aceleración es cero.</p></details></li>
<li><span class="lvl">Concepto</span>Dos pelotas se sueltan desde la misma altura, una un segundo después que la otra. Mientras ambas caen, ¿la distancia entre ellas aumenta, disminuye o permanece igual?
<details><summary>Respuesta</summary><p>Aumenta. La primera siempre va 9.8 m/s más rápido que la segunda, así que la separación crece linealmente con el tiempo.</p></details></li>
<li><span class="lvl">Problema</span>Un tren parte del reposo y acelera a 0.60 m/s² durante 30 s, viaja 2 min a velocidad constante y frena con \(-0.90\) m/s² hasta detenerse. ¿Qué distancia recorre?
<details><summary>Respuesta</summary><p>Velocidad máxima: 18 m/s. Tramos: 270 m + 2160 m + 180 m \(=2610\) m \(\approx2.6\) km.</p></details></li>
<li><span class="lvl">Problema</span>Se deja caer una piedra en un pozo y el sonido del golpe se oye 2.0 s después. Si la rapidez del sonido es 343 m/s, ¿qué profundidad tiene el pozo?
<details><summary>Respuesta</summary><p>El tiempo de caída \(t\) cumple \(t+4.9t^2/343=2.0\). Resolviendo, \(t=1.946\) s y \(h=4.9t^2=18.6\) m.</p></details></li>
<li><span class="lvl">Problema</span>Un conductor a 90 km/h ve un obstáculo a 60 m. Su tiempo de reacción es 0.75 s y su auto frena a \(-7.0\) m/s². ¿Choca?
<details><summary>Respuesta</summary><p>En la reacción avanza \(25\times0.75=18.8\) m; frenando, \(25^2/14=44.6\) m. Total 63.4 m &gt; 60 m: choca, a unos 7 m/s. A 80 km/h se detendría a tiempo (51.9 m).</p></details></li>
</ol>
