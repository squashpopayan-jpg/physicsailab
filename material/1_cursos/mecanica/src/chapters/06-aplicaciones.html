<template class="chapter-src" data-id="aplicaciones" data-num="6" data-title="Aplicaciones de las leyes de Newton" data-part="Parte III · Dinámica de la partícula" data-short="Fricción, plano inclinado, poleas, curvas y peralte, rizos, arrastre y velocidad terminal, marcos no inerciales">
<p class="lead">Con las tres leyes de Newton y un buen diagrama de cuerpo libre se pueden resolver problemas muy variados: por qué cuesta más arrancar un mueble que mantenerlo en movimiento, a qué velocidad puede tomarse una curva, cuánto tarda en abrirse un paracaídas o por qué un péndulo se inclina dentro de un bus que acelera. Este capítulo aplica el mismo método a todas esas situaciones.</p>

<div class="keyideas"><ul>
<li>La fricción estática se ajusta hasta un máximo \(\mu_sn\); la cinética vale \(\mu_kn\) y suele ser menor.</li>
<li>En un plano inclinado conviene usar ejes paralelo y perpendicular al plano: \(mg\sen\theta\) tira hacia abajo y \(n=mg\cos\theta\).</li>
<li>En el movimiento circular, la suma de fuerzas hacia el centro debe valer \(mv^2/r\): la “fuerza centrípeta” no es una fuerza nueva.</li>
<li>La resistencia del aire crece con la rapidez; al igualar el peso, el cuerpo cae con velocidad terminal constante.</li>
<li>En un marco acelerado aparecen fuerzas ficticias \(-m\vb{a}\) que no tienen autor.</li>
</ul></div>

<section>
<h2>Fricción estática y cinética</h2>
<p>La <strong>fricción</strong> es la fuerza que una superficie ejerce sobre otra, paralela al contacto, y que se opone al deslizamiento. Se origina en las pequeñas rugosidades y en las uniones entre los átomos de las superficies que se tocan.</p>
<ul>
<li><strong>Fricción estática \(f_s\):</strong> actúa cuando no hay deslizamiento. Se ajusta al valor necesario para impedirlo, hasta un máximo: \(f_s\le\mu_s\,n\).</li>
<li><strong>Fricción cinética \(f_k\):</strong> actúa cuando hay deslizamiento. Es casi constante y vale \(f_k=\mu_k\,n\), en sentido opuesto a la velocidad relativa.</li>
</ul>
<div class="eq key" data-name="Leyes de la fricción">\[f_s\le\mu_s\,n,\qquad f_k=\mu_k\,n,\qquad \text{normalmente }\ \mu_k\lt\mu_s .\]</div>
<p>Los coeficientes \(\mu_s\) y \(\mu_k\) son adimensionales y dependen de los dos materiales en contacto, no del área de contacto ni (en buena aproximación) de la rapidez.</p>

<section>
<h2>El plano inclinado</h2>
<p>Sobre un bloque en una rampa de ángulo \(\theta\) actúan el peso, la normal y la fricción. Conviene elegir el eje \(x\) paralelo al plano y el \(y\) perpendicular: así la aceleración tiene una sola componente. El peso se descompone en</p>
<div class="eq key" data-name="Plano inclinado">\[w_\parallel=mg\sen\theta\ \ (\text{hacia abajo del plano}),\qquad w_\perp=mg\cos\theta,\qquad n=mg\cos\theta .\]</div>
<p>Sin fricción, el bloque baja con \(a=g\sen\theta\). Con fricción, el bloque en reposo permanece quieto mientras \(mg\sen\theta\le\mu_s\,mg\cos\theta\), es decir, mientras</p>
<div class="eq">\[\tan\theta\le\mu_s .\]</div>
<p>El <strong>ángulo crítico</strong> \(\theta_c=\tan^{-1}\mu_s\) no depende de la masa: es la base de un método sencillo para medir \(\mu_s\), inclinando poco a poco una tabla hasta que el objeto empieza a resbalar. Una vez que desliza, baja con \(a=g(\sen\theta-\mu_k\cos\theta)\).</p>
<div class="sim" data-sim="plano-inclinado" data-title="Bloque en un plano inclinado con fricción"></div>
<div class="sim-guide"><ul>
<li>Presione “Inclinar lentamente”: el bloque empieza a deslizar cuando \(\tan\theta\) supera \(\mu_s\). Compare el ángulo medido con \(\tan^{-1}\mu_s\).</li>
<li>Con una fuerza hacia arriba, observe cómo cambia el sentido de la fricción según el bloque tienda a subir o a bajar.</li>
</ul></div>
<div class="box ex">
<h4>Un tobogán</h4>
<p>Un niño baja por un tobogán inclinado 35° con \(\mu_k=0.20\). ¿Cuál es su aceleración? Si el tobogán mide 4.0 m, ¿con qué rapidez llega abajo partiendo del reposo?</p>
<details><summary>Solución</summary>
<p>\(a=g(\sen35^\circ-0.20\cos35^\circ)=9.8(0.574-0.164)=4.02\) m/s². Con \(v^2=2aL\): \(v=\sqrt{2(4.02)(4.0)}=5.7\) m/s. La masa del niño no interviene.</p>
<p><button class="try" type="button" data-try="plano-inclinado:tobogan">Probar en la simulación</button></p>
</details>
</div>

<section>
<h2>Cuerpos conectados: cuerdas y poleas</h2>
<p>Cuando dos cuerpos están unidos por una cuerda tensa, se mueven con la misma rapidez y aceleración (en magnitud). Si la cuerda y la polea son de masa despreciable y la polea no tiene fricción, la tensión es la misma en toda la cuerda. Se escribe la segunda ley para <em>cada</em> cuerpo por separado y se resuelve el sistema.</p>
<h3>La máquina de Atwood</h3>
<p>Dos masas \(m_1\lt m_2\) cuelgan de una polea. Para \(m_2\) (que baja) y \(m_1\) (que sube):</p>
<div class="eq">\[m_2g-T=m_2a,\qquad T-m_1g=m_1a\quad\Longrightarrow\quad a=\frac{m_2-m_1}{m_1+m_2}\,g,\qquad T=\frac{2m_1m_2}{m_1+m_2}\,g .\]</div>
<p>La tensión queda entre los dos pesos: menor que \(m_2g\) (por eso \(m_2\) baja) y mayor que \(m_1g\) (por eso \(m_1\) sube).</p>
<h3>Bloque sobre una mesa y bloque colgante</h3>
<p>Si \(m_1\) está sobre una mesa con fricción cinética y \(m_2\) cuelga del borde: \(a=\dfrac{m_2-\mu_km_1}{m_1+m_2}\,g\) (siempre que \(m_2g\) supere la fricción estática máxima).</p>
<div class="sim" data-sim="poleas" data-title="Poleas: Atwood, bloque en una mesa y bloque en una rampa"></div>
<div class="sim-guide"><ul>
<li>En la máquina de Atwood, con masas casi iguales la aceleración es muy pequeña: así midió Atwood \(g\) en 1784 con un reloj de péndulo.</li>
<li>En la mesa, aumente \(m_1\) o \(\mu_s\) hasta que el sistema no arranque: la tensión se iguala al peso de \(m_2\).</li>
</ul></div>
<div class="box ex">
<h4>Un bloque tirado por una pesa</h4>
<p>Un bloque de 5.0 kg sobre una mesa (\(\mu_k=0.20\)) está unido por una cuerda que pasa por una polea a una pesa de 2.0 kg que cuelga. Halle la aceleración y la tensión.</p>
<details><summary>Solución</summary>
<p>\(a=\dfrac{2.0-0.20(5.0)}{7.0}(9.8)=1.40\) m/s². Para la pesa: \(T=m_2(g-a)=2.0(8.4)=16.8\) N. Comprobación en el bloque: \(T-\mu_km_1g=16.8-9.8=7.0=5.0(1.40)\). ✔</p>
<p><button class="try" type="button" data-try="poleas:mesa">Probar en la simulación</button></p>
</details>
</div>

<section>
<h2>Dinámica del movimiento circular: curvas y peralte</h2>
<p>En el capítulo 4 vimos que un cuerpo en movimiento circular uniforme tiene aceleración \(v^2/r\) hacia el centro. Por la segunda ley, la <strong>fuerza neta</strong> sobre él debe apuntar al centro y valer</p>
<div class="eq key" data-name="Dinámica del movimiento circular">\[\sum F_{\text{hacia el centro}}=m\,\frac{v^2}{r}.\]</div>
<p>Esta “fuerza centrípeta” no es un tipo nuevo de fuerza: es el nombre que recibe la fuerza neta (o la parte de ella) que apunta al centro. Puede ser una tensión (una piedra girando en una honda), la gravedad (la Luna), la fricción (un auto en una curva plana) o una componente de la normal (una curva peraltada).</p>
<h3>Curva plana</h3>
<p>En una curva horizontal, sólo la fricción estática entre llantas y pavimento empuja el auto hacia el centro: \(f_s=mv^2/r\le\mu_smg\). La rapidez máxima es</p>
<div class="eq">\[v_{\max}=\sqrt{\mu_s\,g\,r},\]</div>
<p>que tampoco depende de la masa: un camión y una moto derrapan a la misma rapidez si sus llantas tienen el mismo \(\mu_s\).</p>
<h3>Curva peraltada</h3>
<p>Si la carretera está inclinada un ángulo \(\theta\) hacia el centro, la normal también tiene una componente hacia el centro. Sin necesidad de fricción, el auto toma la curva a la <strong>rapidez de diseño</strong></p>
<div class="eq key" data-name="Peralte ideal">\[\tan\theta=\frac{v^2}{r\,g}\qquad\Longleftrightarrow\qquad v_{\text{diseño}}=\sqrt{r\,g\tan\theta}.\]</div>
<p>Más rápido, la fricción apunta hacia abajo del peralte; más despacio, hacia arriba. Con fricción hay un intervalo de rapideces seguras entre \(v_{\min}\) y \(v_{\max}\).</p>
<div class="sim" data-sim="curvas" data-title="Un auto en una curva: plana o peraltada, seca o mojada"></div>
<div class="sim-guide"><ul>
<li>En la curva plana seca, a 60 km/h y \(r=50\) m el auto no derrapa; con el pavimento mojado, sí. Busque la rapidez límite en cada caso.</li>
<li>En la curva peraltada sin fricción (hielo), sólo hay una rapidez posible: la de diseño. Más rápido se sale hacia afuera; más despacio resbala hacia adentro.</li>
</ul></div>
<div class="box ex">
<h4>¿Qué tan rápido en una curva mojada?</h4>
<p>Una curva plana tiene 50 m de radio. ¿Cuál es la rapidez máxima con pavimento seco (\(\mu_s=0.8\)) y mojado (\(\mu_s=0.5\))?</p>
<details><summary>Solución</summary>
<p>Seco: \(v=\sqrt{0.8(9.8)(50)}=19.8\) m/s \(=71\) km/h. Mojado: \(v=\sqrt{0.5(9.8)(50)}=15.7\) m/s \(=56\) km/h. La lluvia reduce la rapidez segura en 15 km/h.</p>
<p><button class="try" type="button" data-try="curvas:mojada">Probar en la simulación</button></p>
</details>
</div>
</section>

<section>
<h2>Movimiento circular vertical y péndulo cónico</h2>
<p>En un rizo de montaña rusa (o al girar una cubeta con agua en un plano vertical), la rapidez cambia a lo largo del círculo porque el peso tiene componente a lo largo de la trayectoria. En la parte más alta, el peso y la normal apuntan ambos hacia el centro:</p>
<div class="eq">\[n+mg=m\frac{v^2}{r}\qquad\Longrightarrow\qquad n=m\left(\frac{v^2}{r}-g\right).\]</div>
<p>Como la normal no puede ser negativa (la pista sólo empuja), el carro se mantiene sobre la pista únicamente si \(v_{\text{arriba}}\ge\sqrt{gr}\). En el punto más bajo, en cambio, la normal debe vencer el peso: \(n=m(g+v^2/r)\), y los pasajeros se sienten varias veces más pesados.</p>
<h3>Péndulo cónico</h3>
<p>Una masa que gira en un círculo horizontal colgada de una cuerda de longitud \(L\) que forma un ángulo \(\theta\) con la vertical cumple \(T\cos\theta=mg\) y \(T\sen\theta=mv^2/r\), con \(r=L\sen\theta\). Su periodo es</p>
<div class="eq">\[T_{\text{vuelta}}=2\pi\sqrt{\frac{L\cos\theta}{g}} .\]</div>
<div class="sim" data-sim="rizo" data-title="El rizo de la montaña rusa y el péndulo cónico"></div>
<div class="sim-guide"><ul>
<li>Con la rapidez justa en la base (\(\sqrt{5gr}\)), la normal en la cima es exactamente cero. Un poco menos y el carro se despega antes de llegar arriba.</li>
<li>La gráfica de \(n/mg\) muestra cuántas “g” siente el pasajero en cada punto del rizo: el máximo está abajo.</li>
<li>En el péndulo cónico, al girar más rápido el ángulo aumenta, pero nunca llega a 90°: la cuerda nunca queda horizontal.</li>
</ul></div>
<div class="daily">
<h4>En la vida cotidiana</h4>
<div class="daily-grid">
<div class="dcard"><b>La cubeta que no se derrama</b><p>Si se gira una cubeta con agua en un círculo vertical lo bastante rápido, el agua no cae en la parte alta: necesita \(v\ge\sqrt{gr}\), unos 3 m/s para un brazo de 1 m.</p></div>
<div class="dcard"><b>Las sillas voladoras</b><p>En las ferias, las sillas colgadas de cadenas se inclinan hacia afuera al girar: son péndulos cónicos.</p><button class="try" type="button" data-try="rizo:sillas">Probar en la simulación</button></div>
<div class="dcard"><b>Rizos en forma de lágrima</b><p>Las montañas rusas modernas no usan círculos sino curvas de radio variable (clotoides), para que las fuerzas en la base no sean excesivas.</p></div>
</div>
</div>
</section>

<section>
<h2>Fuerzas de arrastre y velocidad terminal</h2>
<p>Un cuerpo que se mueve en un fluido (aire o agua) recibe una fuerza de <strong>arrastre</strong> opuesta a su velocidad. A velocidades bajas y para cuerpos muy pequeños es proporcional a \(v\) (\(F_D=bv\)); para la mayoría de objetos cotidianos en el aire es proporcional a \(v^2\):</p>
<div class="eq key" data-name="Arrastre cuadrático">\[F_D=\tfrac12\,C_D\,\rho\,A\,v^2,\]</div>
<p>donde \(\rho\) es la densidad del aire (1.2 kg/m³), \(A\) el área frontal y \(C_D\) el coeficiente de arrastre (0.2–0.5 para una esfera, cerca de 1 para una persona, 1.3 para un paracaídas). Un cuerpo que cae acelera cada vez menos, hasta que el arrastre iguala al peso. Desde entonces cae a velocidad constante, la <strong>velocidad terminal</strong>:</p>
<div class="eq key" data-name="Velocidad terminal">\[mg=\tfrac12C_D\rho A v_T^2\qquad\Longrightarrow\qquad v_T=\sqrt{\frac{2mg}{C_D\,\rho\,A}} .\]</div>
<div class="sim" data-sim="arrastre" data-title="Caída con resistencia del aire: velocidad terminal y paracaídas"></div>
<div class="sim-guide"><ul>
<li>Compare una gota de lluvia, un granizo y una bola de boliche: los objetos grandes y densos tienen velocidades terminales mayores.</li>
<li>Con el paracaidista, observe el pico de aceleración al abrir el paracaídas: la rapidez baja de unos 200 km/h a unos 20 km/h.</li>
<li>La curva punteada es la caída sin aire: la diferencia crece con el tiempo.</li>
</ul></div>

<section>
<h2>Marcos de referencia no inerciales</h2>
<p>Las leyes de Newton valen en marcos inerciales. En un bus que acelera, un pasajero observa cosas “extrañas”: un péndulo colgado del techo se inclina hacia atrás sin que nada lo empuje. Para usar \(\sum\vb{F}=m\vb{a}'\) dentro de un marco con aceleración \(\vb{A}\) hay que agregar una <strong>fuerza ficticia</strong> (o inercial):</p>
<div class="eq key" data-name="Fuerza ficticia en un marco acelerado">\[\vb{F}_{\text{ficticia}}=-m\,\vb{A}.\]</div>
<p>No tiene autor ni par de reacción: es el efecto de la inercia visto desde un marco que acelera. Desde el suelo (marco inercial), el péndulo se inclina porque la tensión debe tener una componente horizontal para acelerarlo junto con el bus: \(\tan\theta=A/g\). En un marco que gira aparecen la fuerza centrífuga y la de Coriolis.</p>
<div class="sim" data-sim="no-inercial" data-title="El péndulo en el bus y la pelota en el carrusel: dos puntos de vista"></div>
<div class="sim-guide"><ul>
<li>Desde el suelo, sobre el péndulo sólo actúan la tensión y el peso, y su suma es \(m\vb{A}\). Desde el bus, el péndulo está en equilibrio gracias a la fuerza ficticia.</li>
<li>En el carrusel, la pelota va en línea recta vista desde afuera, pero desde el carrusel su trayectoria se curva: es el efecto Coriolis.</li>
</ul></div>
<div class="daily">
<h4>En la vida cotidiana</h4>
<div class="daily-grid">
<div class="dcard"><b>El acelerómetro de agua</b><p>La superficie del agua en un vaso se inclina al acelerar el auto con el mismo ángulo \(\tan\theta=A/g\) que un péndulo.</p><button class="try" type="button" data-try="no-inercial:arranca">Probar en la simulación</button></div>

</div>

<section>
<h2>Preguntas y problemas</h2>
<ol class="problems">
<li><span class="lvl">Concepto</span>¿Por qué los autos de carreras usan alerones que empujan el auto hacia abajo?
<details><summary>Respuesta</summary><p>Aumentan la fuerza normal sin aumentar la masa. Como la fricción máxima es \(\mu_sn\), el auto puede tomar las curvas y frenar con más fuerza.</p></details></li>
<li><span class="lvl">Concepto</span>Un paracaidista cae a velocidad terminal. ¿Cuánto vale la fuerza neta sobre él?
<details><summary>Respuesta</summary><p>Cero: el arrastre iguala al peso. Por eso su velocidad ya no cambia.</p></details></li>
<li><span class="lvl">Problema</span>Una caja de 20 kg está sobre un piso con \(\mu_s=0.5\) y \(\mu_k=0.3\). ¿Qué fuerza horizontal mínima la pone en movimiento? Si se mantiene esa fuerza, ¿con qué aceleración se mueve?
<details><summary>Respuesta</summary><p>\(F=\mu_smg=98\) N. Luego \(a=(98-\mu_kmg)/m=(98-58.8)/20=1.96\) m/s².</p></details></li>
<li><span class="lvl">Problema</span>Una curva de 120 m de radio se diseña para 80 km/h sin depender de la fricción. ¿Qué peralte debe tener?
<details><summary>Respuesta</summary><p>\(v=22.2\) m/s; \(\tan\theta=v^2/(rg)=0.420\), \(\theta=22.8^\circ\).</p></details></li>
<li><span class="lvl">Problema</span>Estime la velocidad terminal de un granizo de 1.0 cm de diámetro (densidad del hielo 917 kg/m³, \(C_D=0.5\)).
<details><summary>Respuesta</summary><p>\(m=\rho_h\tfrac{\pi}{6}d^3=4.8\times10^{-4}\) kg, \(A=7.85\times10^{-5}\) m². \(v_T=\sqrt{2mg/(C_D\rho A)}=14\) m/s \(\approx50\) km/h.</p></details></li>
</ol>
