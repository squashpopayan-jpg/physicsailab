<template class="chapter-src" data-id="sonido" data-num="18" data-title="Sonido" data-part="Parte VII · Oscilaciones y ondas" data-short="Ondas sonoras, rapidez del sonido, intensidad y decibeles, efecto Doppler, pulsaciones, tubos sonoros e instrumentos">
<p class="lead">La voz, la música y el ruido de la calle son ondas de presión que viajan por el aire. Al oído llegan como pequeñísimas variaciones de presión, a veces de sólo una milmillonésima de atmósfera, y el cerebro las convierte en palabras, notas y timbres. Con lo aprendido sobre ondas se entiende por qué cambia el tono de una ambulancia que pasa, cómo se afina una guitarra y por qué una flauta y un clarinete del mismo tamaño no suenan igual.</p>

<div class="keyideas"><ul>
<li>El sonido es una onda longitudinal de presión; en el aire a 20 °C viaja a 343 m/s y su rapidez aumenta con la temperatura.</li>
<li>El oído humano percibe frecuencias entre 20 Hz y 20 kHz; la sensación de sonoridad sigue una escala logarítmica: \(\beta=10\log(I/I_0)\) dB.</li>
<li>Cuando la fuente o el observador se mueven, la frecuencia percibida cambia (efecto Doppler): \(f'=f\,\frac{v+v_o}{v-v_s}\).</li>
<li>Dos sonidos de frecuencias parecidas producen pulsaciones de frecuencia \(\abs{f_1-f_2}\).</li>
<li>En un tubo abierto en ambos extremos \(f_n=nv/2L\); en uno cerrado por un extremo sólo hay armónicos impares, \(f_n=nv/4L\).</li>
</ul></div>

<section>
<h2>Ondas sonoras</h2>
<p>Un parlante empuja y jala el aire a su frente: forma compresiones (presión un poco mayor que la atmosférica) y rarefacciones (presión un poco menor) que se propagan como una <strong>onda longitudinal</strong>. Cada capa de aire oscila de un lado a otro con un desplazamiento \(s\), y la presión varía en una cantidad \(p\) alrededor de la atmosférica:</p>
<div class="eq key" data-name="Onda sonora">\[s(x,t)=s_{\max}\cos(kx-\omega t),\qquad p(x,t)=p_{\max}\sen(kx-\omega t),\qquad p_{\max}=\rho\,v\,\omega\,s_{\max}.\]</div>
<p>La presión está desfasada un cuarto de onda respecto del desplazamiento: es máxima donde el aire se amontona (desplazamiento nulo), no donde se desplaza más. Las amplitudes son diminutas: en una conversación, \(p_{\max}\approx0.03\) Pa y \(s_{\max}\approx10\) nm.</p>
<h3>Rapidez del sonido</h3>
<p>En un fluido la rapidez depende de su rigidez (el módulo volumétrico \(B\)) y de su densidad: \(v=\sqrt{B/\rho}\). En el aire aumenta con la temperatura:</p>
<div class="eq key" data-name="Rapidez del sonido en el aire">\[v\approx331+0.6\,T\ \ \text{m/s}\qquad(T\text{ en °C}),\qquad v=343\text{ m/s a }20\,°\text{C}.\]</div>
<div class="tablewrap narrow"><table>
<thead><tr><th>Medio</th><th class="c">Rapidez del sonido (m/s)</th></tr></thead>
<tbody>
<tr><td>Aire a 0 °C</td><td class="num c">331</td></tr>
<tr><td>Aire a 20 °C</td><td class="num c">343</td></tr>
<tr><td>Helio</td><td class="num c">≈ 1000</td></tr>
<tr><td>Agua</td><td class="num c">≈ 1480</td></tr>
<tr><td>Madera (a lo largo de la fibra)</td><td class="num c">≈ 3800</td></tr>
<tr><td>Acero</td><td class="num c">≈ 5900</td></tr>
</tbody></table></div>
<p>El oído humano percibe frecuencias entre unos 20 Hz y 20 000 Hz, que en el aire corresponden a longitudes de onda de 17 m a 1.7 cm. Por debajo está el <strong>infrasonido</strong> (sismos, elefantes, ballenas) y por encima el <strong>ultrasonido</strong> (murciélagos, delfines, ecografías).</p>

<div class="sim-guide"><ul>
<li>Las zonas oscuras son compresiones. Compare las dos gráficas: la presión es máxima donde el desplazamiento vale cero.</li>
<li>Suba la frecuencia: la longitud de onda se acorta. Cambie de medio: en el agua o el acero la onda es mucho más larga para la misma frecuencia.</li>
<li>Pulse «Escuchar» para oír la frecuencia elegida (use un volumen moderado).</li>
</ul></div>
<div class="daily">
<h4>En la vida cotidiana</h4>
<div class="daily-grid">
<div class="dcard"><b>¿A qué distancia cayó el rayo?</b><p>La luz llega casi al instante; el trueno tarda unos 3 s por kilómetro. Cuente los segundos entre el relámpago y el trueno y divida entre 3.</p></div>
<div class="dcard"><b>La voz con helio</b><p>En el helio el sonido viaja casi tres veces más rápido: las resonancias de la garganta y la boca suben de frecuencia y la voz suena aguda.</p></div>
<div class="dcard"><b>Ecografías</b><p>Usan ultrasonido de 2 a 15 MHz: su longitud de onda en el cuerpo es de menos de un milímetro, suficiente para ver detalles pequeños.</p></div>
<div class="dcard"><b>Murciélagos y delfines</b><p>Emiten chasquidos ultrasónicos y escuchan el eco: con el retraso calculan la distancia a los objetos (ecolocalización), como un sonar.</p></div>
</div>
</div>
</section>

<section>
<h2>Intensidad y nivel sonoro</h2>
<p>La <strong>intensidad</strong> de una onda es la potencia que atraviesa cada metro cuadrado perpendicular a la propagación: \(I=P/A\) (W/m²). Para una onda sonora, \(I=p_{\max}^2/(2\rho v)\). Una fuente puntual que emite igual en todas direcciones reparte su potencia en esferas cada vez mayores:</p>
<div class="eq key" data-name="Intensidad de una fuente puntual">\[I=\frac{P}{4\pi r^2}\qquad(\text{al duplicar la distancia, la intensidad se reduce a la cuarta parte}).\]</div>
<p>El oído responde a intensidades desde \(10^{-12}\) W/m² (umbral de audición) hasta cerca de 1 W/m² (umbral de dolor): un rango de un billón. Nuestra sensación de sonoridad es aproximadamente logarítmica, por eso se usa el <strong>nivel de intensidad sonora</strong> en decibeles:</p>
<div class="eq key" data-name="Nivel sonoro">\[\beta=10\log_{10}\frac{I}{I_0}\ \ \text{dB},\qquad I_0=10^{-12}\ \text{W/m}^2 .\]</div>
<p>Multiplicar la intensidad por 10 suma 10 dB; duplicarla suma unos 3 dB. Al duplicar la distancia a una fuente puntual, el nivel baja 6 dB.</p>

<thead><tr><th>Sonido</th><th class="c">Nivel (dB)</th></tr></thead>
<tbody>
<tr><td>Umbral de audición</td><td class="num c">0</td></tr>
<tr><td>Hojas que se mueven, susurro</td><td class="num c">20–30</td></tr>
<tr><td>Biblioteca</td><td class="num c">40</td></tr>
<tr><td>Conversación normal</td><td class="num c">60</td></tr>
<tr><td>Tráfico intenso</td><td class="num c">80</td></tr>
<tr><td>Motocicleta, podadora</td><td class="num c">90–100</td></tr>
<tr><td>Concierto de rock, discoteca</td><td class="num c">110</td></tr>
<tr><td>Umbral de dolor</td><td class="num c">120–130</td></tr>
<tr><td>Motor de avión a 30 m</td><td class="num c">140</td></tr>
</tbody></table></div>

<div class="sim-guide"><ul>
<li>Arrastre al oyente: cada vez que duplica la distancia, el nivel baja 6 dB.</li>
<li>Agregue fuentes iguales: dos fuentes suben el nivel sólo 3 dB; diez fuentes, 10 dB.</li>
</ul></div>
<div class="box ex">
<h4>Dos parlantes</h4>
<p>Un parlante produce 70 dB en cierto punto. ¿Qué nivel se mide si se enciende otro parlante idéntico junto a él? ¿Y si en lugar de eso uno se aleja al doble de distancia?</p>
<details><summary>Solución</summary>
<p>Con dos parlantes la intensidad se duplica: \(\beta=70+10\log2=73\) dB (no 140 dB). Al doble de distancia la intensidad es la cuarta parte: \(\beta=70-10\log4=64\) dB.</p>
<p><button class="try" type="button" data-try="decibeles:dos">Probar en la simulación</button></p>
</details>
</div>
<div class="box warn">
<p><strong>Cuide sus oídos.</strong> La exposición prolongada a más de 85 dB daña las células ciliadas del oído interno, que no se regeneran. Se recomienda no pasar de 8 horas diarias a 85 dB; cada 3 dB más, el tiempo seguro se reduce a la mitad: a 100 dB, apenas 15 minutos. Unos audífonos al máximo pueden superar los 100 dB.</p>
</div>
</section>

<section>
<h2>El efecto Doppler</h2>
<p>Cuando una ambulancia se acerca, su sirena suena más aguda; cuando se aleja, más grave. Si la fuente se mueve hacia el observador, los frentes de onda que emite quedan más juntos adelante (λ menor) y más separados detrás. Si es el observador el que se mueve hacia la fuente, encuentra los frentes más seguido. En ambos casos la frecuencia percibida es</p>
<div class="eq key" data-name="Efecto Doppler">\[f'=f\,\frac{v+v_o}{v-v_s},\]</div>
<p>donde \(v\) es la rapidez del sonido, \(v_o\) la rapidez del observador (positiva si se acerca a la fuente) y \(v_s\) la de la fuente (positiva si se acerca al observador). Si se alejan, se cambian los signos.</p>
<p>Si la fuente va más rápido que el sonido (\(v_s\gt v\)), los frentes se acumulan en un cono, la <strong>onda de choque</strong>, cuyo semiángulo cumple \(\sen\theta=v/v_s\). Al pasar el cono sobre un observador se oye un <strong>estampido sónico</strong>. El cociente \(v_s/v\) es el número de Mach.</p>
<div class="sim" data-sim="doppler" data-title="El efecto Doppler y la barrera del sonido"></div>
<div class="sim-guide"><ul>
<li>Observe cómo se juntan los frentes de onda delante de la fuente y se separan detrás.</li>
<li>Pulse «Escuchar» para oír la frecuencia emitida, la que oye quien está adelante y la que oye quien está atrás.</li>
<li>Supere Mach 1: los frentes forman un cono y ninguno llega adelante antes que la fuente.</li>
</ul></div>
<div class="box ex">
<h4>La ambulancia</h4>
<p>Una ambulancia viaja a 30 m/s (108 km/h) con una sirena de 800 Hz. ¿Qué frecuencia oye un peatón cuando se acerca y cuando se aleja? (\(v=343\) m/s)</p>
<details><summary>Solución</summary>
<p>Acercándose: \(f'=800\cdot\dfrac{343}{343-30}=877\) Hz. Alejándose: \(f'=800\cdot\dfrac{343}{343+30}=736\) Hz. El salto de tono al pasar es de unos 140 Hz, más de dos semitonos.</p>
<p><button class="try" type="button" data-try="doppler:ambulancia">Probar en la simulación</button></p>
</details>
</div>
<div class="daily">
<h4>En la vida cotidiana</h4>
<div class="daily-grid">
<div class="dcard"><b>Radares de velocidad</b><p>Emiten microondas que se reflejan en el auto; el cambio de frecuencia del eco (efecto Doppler, en este caso de ondas electromagnéticas) da la rapidez.</p></div>
<div class="dcard"><b>Ecografía Doppler</b><p>El ultrasonido reflejado en los glóbulos rojos cambia de frecuencia según la rapidez de la sangre: así se miden obstrucciones en las arterias.</p></div>
<div class="dcard"><b>El chasquido de un látigo y las balas</b><p>La punta del látigo y muchas balas superan la rapidez del sonido: el “crack” es un pequeño estampido sónico.</p></div>
</div>
</div>
</section>

<section>
<h2>Pulsaciones</h2>
<p>Si suenan a la vez dos tonos de frecuencias muy parecidas, \(f_1\) y \(f_2\), sus ondas se refuerzan y se cancelan alternadamente. Se oye un tono de frecuencia intermedia cuya intensidad sube y baja periódicamente:</p>
<div class="eq key" data-name="Pulsaciones">\[y=2A\cos\!\left(2\pi\,\frac{f_1-f_2}{2}\,t\right)\sen\!\left(2\pi\,\frac{f_1+f_2}{2}\,t\right),\qquad f_{\text{puls}}=\abs{f_1-f_2}.\]</div>
<p>Los afinadores de pianos y los guitarristas aprovechan este efecto: tocan la nota junto con una de referencia y ajustan la tensión hasta que las pulsaciones se hacen cada vez más lentas y desaparecen.</p>
<div class="sim" data-sim="pulsaciones" data-title="Pulsaciones: dos tonos casi iguales"></div>
<div class="sim-guide"><ul>
<li>Acerque las dos frecuencias: las pulsaciones se hacen más lentas; cuando son iguales, desaparecen.</li>
<li>Escuche ambos tonos a la vez para oír el vaivén de la intensidad.</li>
</ul></div>
<div class="box ex">
<h4>Afinar con un diapasón</h4>
<p>Un diapasón de 440 Hz y una cuerda de guitarra producen 3 pulsaciones por segundo. Al tensar un poco la cuerda, las pulsaciones se hacen más lentas. ¿Qué frecuencia tenía la cuerda?</p>
<details><summary>Solución</summary>
<p>Podía ser 437 Hz o 443 Hz. Tensar la cuerda sube su frecuencia; como las pulsaciones disminuyen, la cuerda se acerca a 440 Hz desde abajo: tenía 437 Hz.</p>
<p><button class="try" type="button" data-try="pulsaciones:diapason">Probar en la simulación</button></p>
</details>
</div>
</section>

<section>
<h2>Tubos sonoros e instrumentos</h2>
<p>En un tubo de aire también se forman ondas estacionarias. En un extremo abierto el aire se mueve libremente (antinodo de desplazamiento, nodo de presión); en un extremo cerrado no se puede mover (nodo de desplazamiento, antinodo de presión). Por eso:</p>
<div class="eq key" data-name="Tubos sonoros">\[\text{abierto–abierto: }f_n=n\,\frac{v}{2L}\ \ (n=1,2,3,\dots),\qquad \text{cerrado–abierto: }f_n=n\,\frac{v}{4L}\ \ (n=1,3,5,\dots).\]</div>
<p>Un tubo cerrado por un extremo suena una octava más grave que uno abierto de la misma longitud y sólo produce armónicos impares, lo que le da un timbre distinto. En la práctica, la onda sale un poco del tubo y la longitud efectiva es algo mayor (unos 0.6 veces el radio en cada extremo abierto).</p>
<div class="sim" data-sim="tubos" data-title="Ondas estacionarias en tubos sonoros"></div>
<div class="sim-guide"><ul>
<li>Compare el tubo abierto y el cerrado de la misma longitud: el cerrado tiene la mitad de frecuencia fundamental.</li>
<li>Las curvas muestran el desplazamiento del aire y la presión: donde uno tiene nodo, la otra tiene antinodo.</li>
<li>En el tubo cerrado sólo se permiten armónicos impares.</li>
</ul></div>
<div class="box ex">
<h4>Flauta y clarinete</h4>
<p>Una flauta (tubo abierto) y un clarinete (se comporta como un tubo cerrado por la boquilla) miden unos 0.66 m. Estime la nota más grave de cada uno a 20 °C.</p>
<details><summary>Solución</summary>
<p>Flauta: \(f_1=343/(2\cdot0.66)=260\) Hz (un Do central). Clarinete: \(f_1=343/(4\cdot0.66)=130\) Hz, una octava más grave, aunque ambos tienen casi el mismo tamaño.</p>
<p><button class="try" type="button" data-try="tubos:clarinete">Probar en la simulación</button></p>
</details>
</div>
<div class="daily">
<h4>En la vida cotidiana</h4>
<div class="daily-grid">
<div class="dcard"><b>Soplar una botella</b><p>Al soplar sobre la boca de una botella suena una nota; si se le echa agua, la columna de aire se acorta y la nota sube.</p></div>
<div class="dcard"><b>La voz humana</b><p>El tracto vocal (unos 17 cm, cerrado en la glotis) resuena cerca de 500, 1500 y 2500 Hz. Al mover la lengua y los labios cambiamos esas resonancias: así distinguimos las vocales.</p></div>
<div class="dcard"><b>Órganos de tubos</b><p>Cada tubo da una sola nota. Un tubo abierto de 2.4 m da unos 70 Hz; los más grandes, de 10 m, llegan a 16 Hz, casi infrasonido.</p></div>
</div>
</div>
</section>

<section>
<h2>Preguntas y problemas</h2>
<ol class="problems">
<li><span class="lvl">Concepto</span>¿Por qué se ve el relámpago antes de oír el trueno si ambos se producen al mismo tiempo?
<details><summary>Respuesta</summary><p>La luz viaja a \(3\times10^8\) m/s y el sonido a 343 m/s: el sonido tarda unos 3 s en recorrer cada kilómetro.</p></details></li>
<li><span class="lvl">Concepto</span>Si un músico toca una flauta en un día caluroso, ¿suena más aguda o más grave que en un día frío?
<details><summary>Respuesta</summary><p>Más aguda: con más temperatura el sonido viaja más rápido y \(f=v/2L\) aumenta (la longitud del tubo casi no cambia).</p></details></li>
<li><span class="lvl">Problema</span>Una fuente produce 80 dB a 10 m. ¿Qué nivel habrá a 40 m? ¿A qué distancia bajará a 60 dB?
<details><summary>Respuesta</summary><p>A 40 m (dos duplicaciones): 80 − 12 = 68 dB. Para bajar 20 dB la intensidad debe caer 100 veces: \(r=10\sqrt{100}=100\) m.</p></details></li>
<li><span class="lvl">Problema</span>Un tren se acerca a 25 m/s tocando una bocina de 400 Hz. ¿Qué frecuencia oye una persona en el andén?
<details><summary>Respuesta</summary><p>\(f'=400\cdot343/(343-25)=431\) Hz.</p></details></li>
<li><span class="lvl">Problema</span>La frecuencia fundamental de un tubo cerrado por un extremo es 130 Hz. ¿Cuánto mide el tubo? ¿Cuáles son las dos frecuencias siguientes?
<details><summary>Respuesta</summary><p>\(L=v/4f_1=343/520=0.66\) m. Las siguientes son \(3f_1=390\) Hz y \(5f_1=650\) Hz.</p></details></li>
</ol>
