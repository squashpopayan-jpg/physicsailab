<template class="chapter-src" data-id="dinamica" data-num="6" data-title="Dinámica de la partícula" data-part="Parte II · Mecánica clásica" data-short="Las leyes de Newton aplicadas al plano inclinado con rozamiento, la máquina de Atwood con polea de masa, el arrastre lineal y cuadrático con sus velocidades terminales, la ecuación del cohete de Tsiolkovsky y la ecuación del cabestrante">
<p class="lead">La dinámica responde a la pregunta que la cinemática deja abierta: qué determina la aceleración. La respuesta de Newton es una ecuación de movimiento, \(m\ddot{\mathbf r}=\mathbf F\), que combinada con una ley de fuerza y las condiciones iniciales fija toda la trayectoria. Este capítulo muestra el método en seis problemas cuyos resultados se usan constantemente: el plano inclinado con rozamiento, la máquina de Atwood (con y sin masa en la polea), la caída con arrastre lineal y cuadrático, el cohete y el cabestrante, donde una ecuación diferencial de primer orden en el ángulo da una exponencial sorprendente. En cada uno se ve cómo cambia el resultado al variar cada parámetro.</p>

<section>
<h2>Leyes de Newton y el método del diagrama de cuerpo libre</h2>
<p>Las tres leyes, en su forma moderna: (1) existen sistemas de referencia, los <span class="term">inerciales</span>, en los que un cuerpo sin fuerzas netas conserva su velocidad; (2) en ellos, \(\mathbf F=\mathrm d\mathbf p/\mathrm dt\), que para masa constante es \(m\mathbf a=\mathbf F\); (3) si \(A\) ejerce una fuerza sobre \(B\), \(B\) ejerce sobre \(A\) otra igual y opuesta, sobre la misma recta. La ley 2 es una <em>ecuación diferencial de segundo orden</em>: dada \(\mathbf F(\mathbf r,\dot{\mathbf r},t)\) y las condiciones iniciales \(\mathbf r_0,\mathbf v_0\), la solución es única.</p>
<p>El método para resolver cualquier problema tiene cuatro pasos: (i) elegir el cuerpo; (ii) dibujar el <span class="term">diagrama de cuerpo libre</span> con todas las fuerzas que <em>actúan sobre él</em> (no las que él ejerce); (iii) escoger ejes que simplifiquen (uno a lo largo de la aceleración); (iv) escribir \(\sum F_i=ma_i\) por eje y resolver. Los resultados se verifican con las tres pruebas de siempre: dimensiones, casos límite y que la masa aparezca solo donde debe.</p>
</section>

<deriv id="plano-inclinado" title="El plano inclinado con rozamiento" tags="Newton, Rozamiento">
<goal>La aceleración de un bloque que desliza por un plano inclinado un ángulo \(\theta\) con coeficiente de rozamiento cinético \(\mu\), el tiempo de bajada y el ángulo a partir del cual desliza.</goal>
<given>
<g>Leyes de Newton y ley empírica de rozamiento de Coulomb–Amontons: \(f_k=\mu_kN\), opuesto al movimiento y proporcional a la normal; \(f_s\le\mu_sN\) en reposo.</g>
<g>Ejes: \(x\) a lo largo del plano (hacia abajo) e \(y\) perpendicular a él.</g>
</given>
<step op="Dibujar las fuerzas y descomponer el peso">
\[P_x=mg\sin\theta,\qquad P_y=-mg\cos\theta.\]
<why>El ángulo entre el peso y la normal al plano es \(\theta\); las componentes se obtienen proyectando. Las otras fuerzas, \(N\) (perpendicular) y \(f\) (a lo largo del plano, hacia arriba), ya están en los ejes.</why>
</step>
<step op="Ecuación del eje perpendicular (sin aceleración)">
\[N-mg\cos\theta=0\ \Longrightarrow\ N=mg\cos\theta.\]
<why>El bloque no se despega ni se hunde: \(a_y=0\).</why>
</step>
<step op="Aplicar la ley del rozamiento">
\[f=\mu N=\mu\,mg\cos\theta.\]
</step>
<step op="Ecuación del eje del plano">
\[ma=mg\sin\theta-\mu\,mg\cos\theta\ \Longrightarrow\ a=g(\sin\theta-\mu\cos\theta).\]
<why>La masa se cancela: \(a\) no depende de \(m\) (el peso y el rozamiento son ambos proporcionales a ella).</why>
</step>
<step op="Condición para que empiece a deslizar">
\[a\gt0\ \Longleftrightarrow\ \tan\theta\gt\mu\ \ \Longrightarrow\ \theta_c=\arctan\mu_s.\]
<why>En el umbral, el rozamiento estático alcanza su máximo \(\mu_sN\) y la componente del peso lo iguala. Medir \(\theta_c\) es una forma de medir \(\mu_s\).</why>
</step>
<step op="Aplicar la cinemática de aceleración constante">
\[t=\sqrt{\frac{2L}a},\qquad v=\sqrt{2aL}=at.\]
</step>
<result name="Plano inclinado con rozamiento">\[a=g(\sin\theta-\mu\cos\theta),\qquad t=\sqrt{\frac{2L}{g(\sin\theta-\mu\cos\theta)}},\qquad \theta_c=\arctan\mu_s.\]</result>
<vars>
<v s="a" n="aceleración a lo largo del plano" u="m s^-2"/>
<v s="\theta" n="inclinación" u="rad"/>
<v s="\mu" n="coeficiente de rozamiento" u="1"/>
<v s="g" n="aceleración de la gravedad" u="m s^-2"/>
<v s="m" n="masa del bloque" u="kg"/>
<v s="N" n="fuerza normal" u="N"/>
<v s="L" n="distancia recorrida" u="m"/>
<v s="v" n="rapidez al final del recorrido" u="m s^-1"/>
<v s="t" n="tiempo" u="s"/>
</vars>
<effects>
<e>Con \(\theta=30^\circ\), \(\mu=0.2\), \(L=2\) m: \(a=3.206\) m/s², \(t=1.117\) s y \(v=3.581\) m/s. Sin rozamiento, \(a=g/2=4.905\) m/s² y \(t=0.903\) s; con \(\mu=0.35\), \(a=1.932\) m/s² y \(t=1.439\) s.</e>
<e>\(a\) baja linealmente con \(\mu\): \(\mathrm da/\mathrm d\mu=-g\cos\theta=-8.50\) m/s² por unidad de \(\mu\) (a 30°). A 45°, \(a=5.549\) y \(t=0.849\) s; a 60°, \(a=7.515\) y \(t=0.730\) s.</e>
<e>Ángulo crítico: 11.31° para \(\mu_s=0.2\) y 26.57° para \(\mu_s=0.5\). La masa no aparece: dos bloques de masas distintas bajan juntos.</e>
</effects>
<limits>
<l>Dimensiones: \([g\sin\theta]=\mathsf L\mathsf T^{-2}\) y \(\mu\) es un número. ✓ \([mg\cos\theta]=\mathsf M\mathsf L\mathsf T^{-2}=[N]\).</l>
<l>Límites: \(\theta\to90^\circ\) da \(a=g\) (caída libre); \(\theta=0\) da \(a=-\mu g\) (frenado por rozamiento, con \(L=v_0^2/2\mu g\)).</l>
</limits>
<explore sim="inclinado" title="Plano inclinado con rozamiento: aceleración, tiempo y rapidez"/>
<div class="sim-guide"><ul>
<li>Valores iniciales: \(a=3.2059\) m/s², \(t=1.1170\) s, \(v=3.5810\) m/s, \(N/mg=0.86603\) y \(\theta_c=11.310^\circ\).</li>
<li>Ponga \(\mu=0\): \(a=4.905=g/2\). Suba θ a 60° con \(\mu=0.2\): \(a=7.5147\), \(t=0.7296\) s.</li>
</ul></div>
</deriv>

<deriv id="atwood" title="La máquina de Atwood con polea de masa" tags="Newton, Rotación">
<goal>La aceleración de dos masas unidas por una cuerda que pasa por una polea, y las tensiones, incluyendo la inercia rotacional de la polea.</goal>
<given>
<g>Cuerda inextensible y sin masa que no desliza sobre la polea: ambas masas tienen el mismo módulo de aceleración \(a\), y el borde de la polea gira con \(\alpha=a/r\).</g>
<g>Polea: disco homogéneo de masa \(M\) y radio \(r\), de momento de inercia \(I=\tfrac12Mr^2\) y sin rozamiento en el eje. Ecuación de rotación \(\tau=I\alpha\) (capítulo 10).</g>
</given>
<step op="Ecuación de cada masa (\(m_1\) baja, \(m_2\) sube)">
\[m_1g-T_1=m_1a,\qquad T_2-m_2g=m_2a.\]
<why>Las tensiones a ambos lados son distintas si la polea tiene masa.</why>
</step>
<step op="Ecuación de rotación de la polea">
\[(T_1-T_2)\,r=I\alpha=\tfrac12Mr^2\cdot\frac ar\ \Longrightarrow\ T_1-T_2=\tfrac12Ma.\]
</step>
<step op="Restar las dos ecuaciones de las masas y usar la polea">
\[(m_1-m_2)g-(T_1-T_2)=(m_1+m_2)a\ \Longrightarrow\ (m_1-m_2)g=\Big(m_1+m_2+\tfrac M2\Big)a.\]
</step>
<step op="Despejar \(a\) y las tensiones">
\[a=\frac{(m_1-m_2)\,g}{m_1+m_2+M/2},\qquad T_1=m_1(g-a),\qquad T_2=m_2(g+a).\]
</step>
<step op="Caso de polea ideal (\(M\to0\))">
\[a=\frac{m_1-m_2}{m_1+m_2}\,g,\qquad T=\frac{2m_1m_2}{m_1+m_2}\,g.\]
<why>Sin masa en la polea, \(T_1=T_2=T\): se obtienen sumando las ecuaciones de las masas o sustituyendo \(a\).</why>
</step>
<result name="Máquina de Atwood">\[a=\frac{(m_1-m_2)\,g}{m_1+m_2+M/2},\qquad T_1=m_1(g-a),\quad T_2=m_2(g+a).\]</result>
<vars>
<v s="m_1,\,m_2" n="masas" u="kg"/>
<v s="M" n="masa de la polea" u="kg"/>
<v s="a" n="aceleración" u="m s^-2"/>
<v s="g" n="aceleración de la gravedad" u="m s^-2"/>
<v s="T_1,\,T_2" n="tensiones de la cuerda" u="N"/>
</vars>
<effects>
<e>\(m_1=2\), \(m_2=1\) kg, polea ideal: \(a=3.27\) m/s² y \(T=13.08\) N. Con una polea de 1 kg: \(a=2.803\) m/s², \(T_1=14.014\) N y \(T_2=12.613\) N (la polea frena la caída un 14 %).</e>
<e>Masas casi iguales (1.1 y 1 kg): \(a=0.467\) m/s² y \(T=10.277\) N; por eso Atwood la usó para «frenar» la caída libre y medirla. \(m_2\to0\): \(a\to g\).</e>
<e>La tensión es siempre mayor que el peso de la masa más ligera y menor que el de la más pesada (\(m_2g\lt T\lt m_1g\)); con \(m_1=5\), \(m_2=1\): \(a=6.54\) y \(T=16.35\) N (entre 9.81 y 49.05).</e>
</effects>
<limits>
<l>Dimensiones: \([Ma]=[M\,g]\), una fuerza; todos los términos del denominador son masas. ✓</l>
<l>Límite \(m_1=m_2\): \(a=0\) y \(T=mg\) (equilibrio). Con una polea muy pesada (\(M\gg m\)) \(a\to0\) y la cuerda desliza si el rozamiento es insuficiente.</l>
</limits>
<explore sim="atwood" title="Máquina de Atwood: aceleración y tensiones con polea de masa"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(m_1=2\), \(m_2=1\), \(M=0\)): \(a=3.27\), \(T_1=T_2=13.08\). Suba \(M\) a 1 kg: \(a=2.8029\), \(T_1=14.014\), \(T_2=12.613\).</li>
<li>Seleccione \(m_1\) en el eje: con \(m_1=m_2=1\) la aceleración cambia de signo (la masa 1 sube).</li>
</ul></div>
</deriv>

<deriv id="arrastre-lineal" title="Caída con arrastre lineal: velocidad terminal exponencial" tags="Newton, Fluidos">
<goal>La velocidad y la distancia de un cuerpo que cae con una fuerza de resistencia proporcional a la velocidad, \(F=-bv\) (régimen de Stokes).</goal>
<given>
<g>\(m\,\mathrm dv/\mathrm dt=mg-bv\) con \(v\) positiva hacia abajo y \(v(0)=0\).</g>
<g>Solución de la ecuación de relajación de primer orden (capítulo 4).</g>
</given>
<step op="Escribir como relajación hacia una velocidad límite">
\[\frac{\mathrm dv}{\mathrm dt}=-\frac{v-v_t}\tau,\qquad v_t=\frac{mg}b,\qquad \tau=\frac mb.\]
<why>Se saca \(b/m\) como factor: \(g-\tfrac bmv=-\tfrac bm(v-mg/b)\).</why>
</step>
<step op="Usar la solución de la relajación con \(v(0)=0\)">
\[v(t)=v_t\left(1-\mathrm e^{-t/\tau}\right).\]
</step>
<step op="Integrar la velocidad para la distancia">
\[y(t)=\int_0^tv\,\mathrm dt'=v_t\left[t-\tau\left(1-\mathrm e^{-t/\tau}\right)\right].\]
<why>\(\int_0^t\mathrm e^{-t'/\tau}\mathrm dt'=\tau(1-\mathrm e^{-t/\tau})\).</why>
</step>
<step op="Estudiar los dos límites">
\[t\ll\tau:\ v\simeq gt,\ y\simeq\tfrac12gt^2;\qquad t\gg\tau:\ v\to v_t,\ y\simeq v_t(t-\tau).\]
<why>Con \(\mathrm e^{-x}\simeq1-x+x^2/2\) se recupera la caída libre. Para tiempos largos, el cuerpo avanza con velocidad constante, con un retraso \(\tau\).</why>
</step>
<step op="Estimar \(b\) para una esfera pequeña">
\[b=6\pi\eta r\ (\text{Stokes, capítulo 15}),\qquad m=\tfrac43\pi r^3\rho.\]
<why>Para \(\mathrm{Re}\ll1\) (capítulo 1): una gota de agua de 0.1 mm de radio en aire da \(v_t=1.20\) m/s y \(\tau=0.123\) s.</why>
</step>
<result name="Arrastre lineal">\[v(t)=\frac{mg}b\left(1-\mathrm e^{-bt/m}\right),\qquad y(t)=v_t\left[t-\tau(1-\mathrm e^{-t/\tau})\right],\qquad v_t=\frac{mg}b,\ \tau=\frac mb.\]</result>
<vars>
<v s="m" n="masa" u="kg"/>
<v s="b" n="coeficiente de arrastre lineal" u="kg s^-1"/>
<v s="g" n="aceleración de la gravedad" u="m s^-2"/>
<v s="v_t" n="velocidad terminal" u="m s^-1"/>
<v s="\tau" n="tiempo característico" u="s"/>
<v s="t" n="tiempo" u="s"/>
<v s="y" n="distancia caída" u="m"/>
</vars>
<effects>
<e>\(m=80\) kg, \(b=20\) kg/s: \(v_t=39.24\) m/s, \(\tau=4\) s; a los 5 s, \(v=27.998\) m/s (71 % de \(v_t\)) y \(y=84.21\) m; a 1 s, \(v=8.680\) m/s y \(y=4.521\) m (casi caída libre: 9.81 y 4.905).</e>
<e>\(v_t\propto m/b\) (\(n_m=1\), \(n_b=-1\)); \(\tau\) tiene los mismos exponentes: un cuerpo más pesado cae más rápido y tarda más en alcanzar su límite. A los \(3\tau\) se llega al 95 % de \(v_t\) y a los \(5\tau\), al 99.3 %.</e>
<e>Gota de niebla de 0.1 mm: \(v_t=1.204\) m/s y \(\tau=0.1228\) s.</e>
</effects>
<limits>
<l>Dimensiones: \([mg/b]=\mathsf M\mathsf L\mathsf T^{-2}/(\mathsf M\mathsf T^{-1})=\mathsf L\mathsf T^{-1}\); \([m/b]=\mathsf T\). ✓</l>
<l>Solo vale para Re ≪ 1; a velocidades mayores el arrastre pasa a ser cuadrático (siguiente deducción).</l>
</limits>
<explore sim="lineal" title="Caída con arrastre lineal: velocidad, distancia y velocidad terminal"/>
<div class="sim-guide"><ul>
<li>Valores iniciales: \(v_t=39.24\), \(\tau=4\) s, \(v(5\ \text{s})=27.998\) m/s, \(y(5\ \text{s})=84.210\) m.</li>
<li>Seleccione <em>t</em> en el eje: la curva \(v(t)\) en escala lineal sube y se aplana en 39.24 m/s; en log–log la pendiente local pasa de 1 (caída libre) a 0.</li>
</ul></div>
</deriv>

<deriv id="arrastre-cuadratico" title="Caída con arrastre cuadrático: tangente hiperbólica" tags="Newton, Fluidos">
<goal>La velocidad y la distancia de un cuerpo que cae con una resistencia \(kv^2\), con \(k=\tfrac12\rho C_DA\), y su velocidad terminal.</goal>
<given>
<g>\(m\,\mathrm dv/\mathrm dt=mg-kv^2\), con \(v(0)=0\), \(v\) hacia abajo. (Régimen de número de Reynolds grande, capítulo 1.)</g>
</given>
<step op="Hallar la velocidad terminal (aceleración nula)">
\[mg-kv_t^2=0\ \Longrightarrow\ v_t=\sqrt{\frac{mg}k}=\sqrt{\frac{2mg}{\rho C_DA}}.\]
</step>
<step op="Separar variables">
\[\frac{\mathrm dv}{g\,(1-v^2/v_t^2)}=\mathrm dt.\]
<why>\(mg-kv^2=mg(1-v^2/v_t^2)\) porque \(k=mg/v_t^2\).</why>
</step>
<step op="Integrar con el cambio \(u=v/v_t\)">
\[\frac{v_t}g\int_0^{v/v_t}\frac{\mathrm du}{1-u^2}=t\ \Longrightarrow\ \frac{v_t}g\,\operatorname{artanh}\frac v{v_t}=t.\]
<why>\(\int\mathrm du/(1-u^2)=\operatorname{artanh}u\) para \(|u|\lt1\).</why>
</step>
<step op="Despejar la velocidad">
\[v(t)=v_t\tanh\frac{gt}{v_t}.\]
</step>
<step op="Integrar para la distancia">
\[y(t)=\int_0^tv_t\tanh\frac{gt'}{v_t}\,\mathrm dt'=\frac{v_t^2}g\ln\cosh\frac{gt}{v_t}.\]
<why>\(\int\tanh x\,\mathrm dx=\ln\cosh x\).</why>
</step>
<step op="Límites">
\[t\ll\frac{v_t}g:\ v\simeq gt,\ y\simeq\tfrac12gt^2;\qquad t\gg\frac{v_t}g:\ v\to v_t,\ y\simeq v_tt-\frac{v_t^2}g\ln2.\]
<why>\(\tanh x\simeq x\) y \(\ln\cosh x\simeq x^2/2\) para \(x\) pequeño; para \(x\) grande, \(\ln\cosh x\simeq x-\ln2\).</why>
</step>
<result name="Arrastre cuadrático">\[v_t=\sqrt{\frac{2mg}{\rho C_DA}},\qquad v(t)=v_t\tanh\frac{gt}{v_t},\qquad y(t)=\frac{v_t^2}g\ln\cosh\frac{gt}{v_t}.\]</result>
<vars>
<v s="m" n="masa" u="kg"/>
<v s="\rho" n="densidad del fluido" u="kg m^-3"/>
<v s="C_DA" n="coeficiente de arrastre por área frontal" u="m^2"/>
<v s="g" n="aceleración de la gravedad" u="m s^-2"/>
<v s="v_t" n="velocidad terminal" u="m s^-1"/>
<v s="v" n="velocidad" u="m s^-1"/>
<v s="t" n="tiempo" u="s"/>
<v s="y" n="distancia caída" u="m"/>
</vars>
<effects>
<e>Persona de 80 kg con \(C_DA=0.7\) m² en aire (\(\rho=1.225\)): \(v_t=42.78\) m/s (154 km/h), \(v_t/g=4.361\) s. \(v(5)=34.94\) m/s y \(y(5)=102.5\) m; a 10 s, \(v=41.92\) y \(y=300.4\) m; a 3\(\,v_t/g\) ya se alcanza el 99.5 % de \(v_t\).</e>
<e>\(v_t\propto m^{1/2}\rho^{-1/2}(C_DA)^{-1/2}\): hacerse más compacto (\(C_DA=0.2\), cabeza abajo) da \(v_t=80.04\) m/s (288 km/h); duplicar la masa aumenta \(v_t\) un 41 %; y en un aire cuatro veces menos denso (altura) la terminal es el doble.</e>
<e>Al contrario que en el caso lineal, \(v_t\) crece solo como \(\sqrt m\): los cuerpos grandes caen más rápido que los pequeños en el aire, pero la diferencia es moderada.</e>
</effects>
<limits>
<l>Dimensiones: \([\rho C_DA]=\mathsf M\mathsf L^{-1}\), luego \([2mg/(\rho C_DA)]=\mathsf L^2\mathsf T^{-2}\). ✓ \(gt/v_t\) es adimensional.</l>
<l>Para \(t\to0\) se recupera la caída libre; la solución con \(v_0\ne0\) da \(v=v_t\tanh(\cdot)\) con un desplazamiento en el tiempo, o \(\coth\) si \(v_0\gt v_t\).</l>
</limits>
<explore sim="cuadratico" title="Caída con arrastre cuadrático: velocidad terminal y tanh"/>
<div class="sim-guide"><ul>
<li>Valores iniciales: \(v_t=42.784\) m/s, \(v(5\ \text{s})=34.936\), \(y(5\ \text{s})=102.53\) m y \(v_t/g=4.3612\) s. Con \(C_DA=0.2\): \(v_t=80.041\) m/s.</li>
<li>Pase \(\rho\) a 1000 (agua): \(v_t\) baja a 1.497 m/s y el tiempo característico \(v_t/g\) a 0.153 s: por eso la caída en agua es lenta.</li>
</ul></div>
</deriv>

<deriv id="cohete" title="La ecuación del cohete de Tsiolkovsky" tags="Newton, Masa variable">
<goal>El incremento de velocidad de un cohete que expulsa gases a velocidad \(v_e\) respecto de él, en función de la razón de masas inicial y final.</goal>
<given>
<g>Conservación del momento lineal en un sistema aislado (ley 3 de Newton): fuera de la gravedad y del aire, el momento total de cohete y gases no cambia.</g>
<g>La velocidad relativa de los gases \(v_e\) es constante.</g>
</given>
<step op="Momento en \(t\) y en \(t+\mathrm dt\)">
\[mv=(m+\mathrm dm)(v+\mathrm dv)+(-\mathrm dm)(v-v_e).\]
<why>\(\mathrm dm\lt0\) es el cambio de masa del cohete; la masa expulsada, \(-\mathrm dm\), sale con velocidad \(v-v_e\) en el sistema inercial.</why>
</step>
<step op="Desarrollar y despreciar el término de segundo orden">
\[0=m\,\mathrm dv+v_e\,\mathrm dm+\mathrm dm\,\mathrm dv\ \Longrightarrow\ m\,\mathrm dv=-v_e\,\mathrm dm.\]
<why>\(\mathrm dm\,\mathrm dv\) es el producto de dos infinitésimos.</why>
</step>
<step op="Separar variables e integrar de la masa inicial \(m_0\) a la final \(m_f\)">
\[\int_0^{\Delta v}\mathrm dv=-v_e\int_{m_0}^{m_f}\frac{\mathrm dm}m\ \Longrightarrow\ \Delta v=v_e\ln\frac{m_0}{m_f}.\]
</step>
<step op="Añadir la gravedad uniforme (ascenso vertical, tiempo de combustión \(t_b\))">
\[m\frac{\mathrm dv}{\mathrm dt}=-v_e\frac{\mathrm dm}{\mathrm dt}-mg\ \Longrightarrow\ \Delta v=v_e\ln\frac{m_0}{m_f}-g\,t_b.\]
<why>Se divide por \(m\) y se integra término a término: la gravedad resta \(g\) por cada segundo que dura la combustión, que es la «pérdida por gravedad».</why>
</step>
<step op="Relacionar con el impulso específico y la fracción de propelente">
\[v_e=I_{sp}\,g_0,\qquad \frac{m_0}{m_f}=\frac1{1-f},\quad f=\text{fracción de propelente}.\]
<why>\(I_{sp}\) (segundos) es el empuje por unidad de peso de propelente consumido por segundo; \(g_0=9.80665\) m/s².</why>
</step>
<result name="Ecuación de Tsiolkovsky">\[\Delta v=v_e\ln\frac{m_0}{m_f}=I_{sp}\,g_0\ln\frac{m_0}{m_f}\qquad(\text{con gravedad: }-g\,t_b).\]</result>
<vars>
<v s="\Delta v" n="incremento de velocidad" u="m s^-1"/>
<v s="v_e" n="velocidad de escape de los gases" u="m s^-1"/>
<v s="m_0,\,m_f" n="masas inicial y final" u="kg"/>
<v s="I_{sp}" n="impulso específico" u="s"/>
<v s="g_0" n="gravedad estándar" u="m s^-2"/>
<v s="t_b" n="tiempo de combustión" u="s"/>
</vars>
<effects>
<e>Con \(I_{sp}=300\) s (\(v_e=2942\) m/s): \(\Delta v=2039\) m/s si \(m_0/m_f=2\); 4735 m/s para 5; 6774 m/s para 10 (90 % de propelente); 8813 m/s para 20 (95 %). Con 120 s de combustión se pierden \(gt_b=1177\) m/s: para razón 10, \(\Delta v=5597\) m/s.</e>
<e>La dependencia con la razón de masas es logarítmica: pasar de razón 10 a 20 (el doble) añade solo \(v_e\ln2=2039\) m/s. En cambio, \(\Delta v\) es proporcional a \(v_e\) (\(n_{I_{sp}}=1\)): motores de 450 s con razón 10 dan 10 161 m/s.</e>
<e>Alcanzar órbita baja exige unos 9.4 km/s (con pérdidas): con \(I_{sp}=300\) s en una sola etapa haría falta \(m_0/m_f=\mathrm e^{9400/2942}=24.4\), un 96 % de propelente, inviable; de ahí los cohetes de varias etapas, que reinician la razón de masas al soltar la estructura vacía.</e>
</effects>
<limits>
<l>Dimensiones: \(\ln(m_0/m_f)\) es adimensional y \([v_e]=\mathsf L\mathsf T^{-1}\). ✓ \([gt_b]=\mathsf L\mathsf T^{-1}\).</l>
<l>Límites: \(m_0/m_f\to1\) da \(\Delta v\to v_e(m_0-m_f)/m_f\), proporcional al propelente gastado. Se ignoran el arrastre atmosférico, la variación de \(g\) con la altura y el empuje que depende de la presión.</l>
</limits>
<explore sim="cohete" title="Ecuación de Tsiolkovsky: Δv según I_sp, razón de masas y gravedad"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(I_{sp}=300\), razón 10, \(t_b=120\), \(g=9.81\)): \(v_e=2941.995\) m/s, \(\Delta v=6774.2\) m/s, \(\Delta v_g=5597.0\) m/s y fracción de propelente 0.9.</li>
<li>Seleccione \(R\) en el eje (log): \(\Delta v\) crece como \(\ln R\); en la tabla, \(n_R=1/\ln R=0.434\) a razón 10.</li>
</ul></div>
</deriv>

<deriv id="cabestrante" title="La ecuación del cabestrante: rozamiento sobre un cilindro" tags="Newton, Rozamiento">
<goal>Cuánta fuerza hay que hacer para sostener una carga \(T_2\) con una cuerda enrollada \(\varphi\) radianes alrededor de un cilindro rugoso.</goal>
<given>
<g>Cuerda sin masa en el límite de deslizamiento: el rozamiento es \(\mu\) por la normal.</g>
<g>Se considera un elemento de cuerda que abarca el ángulo \(\mathrm d\varphi\), con tensiones \(T\) y \(T+\mathrm dT\) en sus extremos.</g>
</given>
<step op="Equilibrio en la dirección radial">
\[\mathrm dN=T\sin\tfrac{\mathrm d\varphi}2+(T+\mathrm dT)\sin\tfrac{\mathrm d\varphi}2\simeq T\,\mathrm d\varphi.\]
<why>Para ángulos pequeños \(\sin x\simeq x\) y se desprecia el producto \(\mathrm dT\,\mathrm d\varphi\) (de segundo orden).</why>
</step>
<step op="Equilibrio en la dirección tangencial">
\[\mathrm dT=\mu\,\mathrm dN=\mu\,T\,\mathrm d\varphi.\]
<why>La diferencia de tensiones solo puede ser sostenida por el rozamiento, que en el límite de deslizar es \(\mu\,\mathrm dN\).</why>
</step>
<step op="Separar variables e integrar">
\[\int_{T_1}^{T_2}\frac{\mathrm dT}T=\mu\int_0^{\varphi}\mathrm d\varphi\ \Longrightarrow\ \ln\frac{T_2}{T_1}=\mu\varphi.\]
</step>
<step op="Resultado y lectura">
\[T_2=T_1\,\mathrm e^{\mu\varphi},\qquad \varphi=2\pi n.\]
<why>Cada vuelta multiplica la tensión por \(\mathrm e^{2\pi\mu}\). El resultado no depende del radio del cilindro ni de la forma en que se tira.</why>
</step>
<result name="Ecuación del cabestrante (Euler–Eytelwein)">\[\frac{T_2}{T_1}=\mathrm e^{\mu\varphi},\qquad T_1=T_2\,\mathrm e^{-\mu\varphi}.\]</result>
<vars>
<v s="T_1,\,T_2" n="tensiones en los extremos (T₂ es la mayor)" u="N"/>
<v s="\mu" n="coeficiente de rozamiento" u="1"/>
<v s="\varphi" n="ángulo de contacto" u="rad"/>
<v s="n" n="número de vueltas" u="1"/>
</vars>
<effects>
<e>Con \(\mu=0.3\): media vuelta (\(\varphi=\pi\)) da \(T_2/T_1=2.566\); una vuelta, 6.586; tres vueltas, 285.7; \(\mu=0.5\) con dos vueltas, 535.5; \(\mu=0.1\) con una, 1.874.</e>
<e>Para sostener una carga de 1000 N (unos 100 kg) con \(\mu=0.3\) y 3 vueltas basta \(T_1=3.50\) N: la fuerza de unos dos dedos. La razón crece exponencialmente con el ángulo: \(n_\mu=\mu\varphi=5.65\) en este caso (un 1 % más de \(\mu\) da un 5.7 % más de razón).</e>
<e>Un nudo y las cuerdas de los barcos (bolardos) explotan este efecto: 2 o 3 vueltas bastan para amarrar un barco con una fuerza insignificante.</e>
</effects>
<limits>
<l>Dimensiones: \(\mu\varphi\) es adimensional (\(\varphi\) en radianes); \(T_1\) y \(T_2\) son fuerzas. ✓</l>
<l>Vale solo en el instante de deslizar; con menos fuerza la cuerda se mantiene por rozamiento estático. En un cilindro que gira, \(T_2/T_1\) es el máximo que puede transmitir una correa de transmisión.</l>
</limits>
<explore sim="cabestrante" title="Ecuación del cabestrante: razón de tensiones y fuerza para sostener una carga"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(\mu=0.3\), 3 vueltas, 1000 N): \(T_2/T_1=285.68\) y \(T_1=3.5004\) N.</li>
<li>Con \(n=0.5\) (media vuelta): razón 2.566. Seleccione \(n\) en el eje (log–log): la curva es una exponencial, con pendiente local creciente.</li>
</ul></div>
</deriv>
