<template class="chapter-src" data-id="nuclear" data-num="36" data-title="Física nuclear: energía de enlace, desintegración, dispersión y fusión" data-part="Parte X · Núcleos y partículas" data-short="La fórmula semiempírica de masa, la ley de desintegración radiactiva, la dispersión de Rutherford, la teoría de Gamow de la desintegración alfa y la energía y el pico de Gamow de la fusión">
<p class="lead">El núcleo atómico mide unos femtómetros, concentra más del 99.9 % de la masa del átomo y se mantiene unido por una fuerza que no se deduce de una fórmula única. Aun así, con argumentos físicos sencillos —volumen, superficie, repulsión eléctrica, principio de exclusión— se obtiene la energía de enlace de casi todos los núcleos, y con el túnel cuántico se explican las vidas medias de la desintegración alfa a lo largo de 24 órdenes de magnitud y la posibilidad de la fusión en las estrellas.</p>

<deriv id="semf" title="La fórmula semiempírica de masa (gota líquida)" tags="Nuclear, Energía de enlace">
<goal>La energía de enlace \(B(A,Z)\) de un núcleo con \(A\) nucleones y \(Z\) protones, y la carga más estable para cada \(A\).</goal>
<given>
<g>La fuerza nuclear es de corto alcance y saturada: cada nucleón interactúa solo con sus vecinos inmediatos; el radio nuclear es \(R=r_0A^{1/3}\) con \(r_0\approx1.2\) fm (densidad constante).</g>
<g>Los protones y los neutrones son fermiones que llenan niveles de energía (gas de Fermi); los protones se repelen eléctricamente.</g>
</given>
<step op="Término de volumen: cada nucleón aporta la misma energía de enlace (saturación)">
\[B_V=a_VA.\]
</step>
<step op="Término de superficie: los nucleones de la superficie tienen menos vecinos; su número es proporcional al área \(4\pi R^2\propto A^{2/3}\)">
\[B_S=-a_SA^{2/3}.\]
</step>
<step op="Término de Coulomb: energía electrostática de una esfera uniforme de carga \(Ze\) (con \(Z(Z-1)\) para quitar la autointeracción)">
\[B_C=-\frac35\,\frac{e^2}{4\pi\varepsilon_0r_0}\,\frac{Z(Z-1)}{A^{1/3}}=-a_C\frac{Z(Z-1)}{A^{1/3}},\qquad a_C=\frac{3}{5}\frac{e^2}{4\pi\varepsilon_0r_0}=0.720\ \text{MeV}.\]
<why>Es el único coeficiente que sale de primeros principios: con \(r_0=1.2\) fm da 0.720 MeV, muy cerca del valor ajustado 0.711 MeV.</why>
</step>
<step op="Término de asimetría: gas de Fermi, energía cinética \(\propto N^{5/3}+Z^{5/3}\); desarrollar en torno a \(N=Z\) con \(x=(N-Z)/A\)">
\[(1+x)^{5/3}+(1-x)^{5/3}=2+\tfrac{10}9x^2+\cdots\ \Longrightarrow\ B_A=-a_A\frac{(A-2Z)^2}A,\qquad a_A\approx\frac{\varepsilon_F}3\ \text{(solo cinética)}.\]
<why>Un exceso de neutrones sobre protones obliga a ocupar niveles más altos: el mínimo de energía es \(N=Z\). La parte cinética da \(\varepsilon_F/3\approx12\) MeV, la mitad del valor ajustado (23.7 MeV), el resto es la dependencia isospín de la fuerza nuclear.</why>
</step>
<step op="Apareamiento (empírico): los pares de nucleones idénticos con espines opuestos están más ligados">
\[\delta=+a_PA^{-1/2}\ (\text{par–par}),\quad0\ (A\ \text{impar}),\quad-a_PA^{-1/2}\ (\text{impar–impar}).\]
</step>
<step op="Mínimo de masa a \(A\) fijo: derivar \(B\) respecto a \(Z\) e igualar a cero">
\[Z_\text{est}=\frac{4a_A+a_CA^{-1/3}}{8a_A/A+2a_CA^{-1/3}}.\]
</step>
<result name="Fórmula de Weizsäcker">\[B=a_VA-a_SA^{2/3}-a_C\frac{Z(Z-1)}{A^{1/3}}-a_A\frac{(A-2Z)^2}A+\delta,\]
con \(a_V=15.75,\ a_S=17.8,\ a_C=0.711,\ a_A=23.7,\ a_P=11.18\) MeV.</result>
<vars>
<v s="B" n="energía de enlace" u="J"/>
<v s="a_V,\,a_S,\,a_A,\,a_P" n="coeficientes de volumen, superficie, asimetría y apareamiento" u="J"/>
<v s="a_C" n="coeficiente de Coulomb" u="J"/>
<v s="A" n="número másico" u="1"/>
<v s="Z" n="número atómico" u="1"/>
<v s="r_0" n="radio nuclear unidad" u="m"/>
<v s="e" n="carga elemental" u="C"/>
<v s="\varepsilon_0" n="permitividad del vacío" u="F m^-1"/>
<v s="\varepsilon_F" n="energía de Fermi nuclear" u="J"/>
</vars>
<effects>
<e>¹²⁰Sn: la fórmula da \(B=1025.80\) MeV y el valor medido es 1020.55 MeV (+0.51 %); ⁵⁶Fe: 495.38 frente a 492.25 MeV (+0.64 %); ²⁰⁸Pb: 1634.26 frente a 1636.43 MeV (−0.13 %); ²³⁸U: 1814.73 frente a 1801.69 MeV (+0.72 %); ¹⁶O: 125.97 frente a 127.62 MeV (−1.3 %). Para el ⁴He falla (22.84 frente a 28.30 MeV, −19 %): la gota líquida no sirve para núcleos muy ligeros.</e>
<e>La energía por nucleón sube hasta un máximo (8.85 MeV para ⁵⁶Fe; el modelo da su máximo en \(A=58\), 8.865 MeV) y baja luego por el término de Coulomb: por eso la fusión libera energía en los núcleos ligeros y la fisión en los pesados. La fisión simétrica del ²³⁸U en dos núcleos de \(A=119\) libera 183.7 MeV según el modelo (el valor real ronda 200 MeV).</e>
<e>Carga estable: \(A=56\) → \(Z=25.28\) (Fe: 26); \(A=120\) → 50.82 (Sn: 50); \(A=208\) → 82.43 (Pb: 82); \(A=238\) → 92.50 (U: 92). El cociente \(Z/A\) baja de 0.5 a 0.39 al crecer \(A\) porque la repulsión de Coulomb favorece neutrones.</e>
</effects>
<limits>
<l>Dimensiones: \(e^2/(4\pi\varepsilon_0r_0)\) es una energía. ✓</l>
<l>No incluye las capas nucleares (números mágicos 2, 8, 20, 28, 50, 82, 126), que producen desviaciones de unos MeV; los coeficientes son un ajuste a masas medidas, no una teoría exacta.</l>
</limits>
<explore sim="nuc-semf" title="Energía de enlace de un núcleo según la fórmula semiempírica de masa"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(A=56\), \(Z=26\)): \(B=495.384\) MeV, \(B/A=8.84614\) MeV, \(Z_\text{est}=25.2797\) y término de Coulomb 120.80 MeV.</li>
<li>Con \(A\) en el eje (log–log): \(B\propto A\) con corrección negativa por superficie y Coulomb, que crece con \(Z\).</li>
</ul></div>
</deriv>

<deriv id="desintegracion" title="La ley de desintegración radiactiva y la datación con carbono 14" tags="Nuclear, Desintegración">
<goal>Cuántos núcleos quedan al cabo de un tiempo \(t\), su vida media y la edad de una muestra, incluida una cadena de dos desintegraciones.</goal>
<given>
<g>Cada núcleo tiene una probabilidad constante \(\lambda\,\mathrm dt\) de desintegrarse en el intervalo \(\mathrm dt\), independiente de su edad (experimentalmente comprobado).</g>
</given>
<step op="Variación del número de núcleos">
\[\frac{\mathrm dN}{\mathrm dt}=-\lambda N.\]
</step>
<step op="Integrar con \(N(0)=N_0\)">
\[N(t)=N_0\,e^{-\lambda t}.\]
</step>
<step op="Semivida (\(N=N_0/2\)) y vida media">
\[t_{1/2}=\frac{\ln2}\lambda,\qquad\tau=\frac1\lambda=\frac{t_{1/2}}{\ln2},\qquad N(t)=N_02^{-t/t_{1/2}}.\]
</step>
<step op="Actividad (desintegraciones por segundo) y edad de una muestra con actividad \(A\)">
\[A=\lambda N=A_0e^{-\lambda t},\qquad t=\tau\ln\frac{A_0}A.\]
</step>
<step op="Cadena padre → hijo: \(\dot N_2=\lambda_1N_1-\lambda_2N_2\) con \(N_2(0)=0\)">
\[N_2(t)=N_1(0)\,\frac{\lambda_1}{\lambda_2-\lambda_1}\left(e^{-\lambda_1t}-e^{-\lambda_2t}\right).\]
<why>Si \(\lambda_1\ll\lambda_2\) (padre longevo), para \(t\gg1/\lambda_2\) se alcanza el equilibrio secular \(\lambda_2N_2=\lambda_1N_1\): ambas actividades se igualan.</why>
</step>
<result name="Ley de desintegración">\[N(t)=N_0e^{-\lambda t},\qquad t_{1/2}=\frac{\ln2}\lambda,\qquad t=\tau\ln\frac{A_0}{A}.\]</result>
<vars>
<v s="N" n="número de núcleos sin desintegrar" u="1"/>
<v s="\lambda" n="constante de desintegración" u="s^-1"/>
<v s="t_{1/2}" n="semivida" u="s"/>
<v s="\tau" n="vida media" u="s"/>
<v s="t" n="tiempo" u="s"/>
<v s="A" n="actividad" u="s^-1"/>
</vars>
<effects>
<e>¹⁴C (\(t_{1/2}=5730\) años): \(\lambda=3.8332\times10^{-12}\ \text{s}^{-1}\), \(\tau=8266.6\) años. Tras 10 000 años queda el 29.83 % (\(2^{-10\,000/5730}=0.2983\)); con una relación ¹⁴C/C de \(1.176\times10^{-12}\) en el carbono moderno, la actividad es 0.2260 Bq por gramo de carbono. A los 50 000 años la fracción es \(2.4\times10^{-3}\), el límite práctico de la técnica.</e>
<e>Dos semividas dejan el 25 %, siete el 0.78 %. Equilibrio secular ²²⁶Ra → ²²²Rn (1600 años y 3.82 días): tras siete semividas del radón (26.7 días) la actividad del hijo es el 99.2 % de la del padre.</e>
</effects>
<limits>
<l>Dimensiones: \(\lambda t\) es adimensional y \(A=\lambda N\) está en Bq. ✓</l>
<l>Para pocos núcleos hay fluctuaciones de Poisson (\(\sqrt N\)); en la datación se supone constante la proporción de ¹⁴C atmosférico (se calibra con anillos de árboles) y sistema cerrado desde la muerte.</l>
</limits>
<explore sim="nuc-decaimiento" title="Desintegración radiactiva: fracción restante, constante y vida media"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (¹⁴C, 10 000 años): \(N/N_0=0.298292\), \(\lambda=3.83325\times10^{-12}\ \text{s}^{-1}\), \(\tau=8266.64\) años y \(A/A_0=29.8292\ \%\).</li>
<li>Con \(t\) en el eje (log–log): la pendiente local \(-\lambda t\) es pequeña para \(t\ll t_{1/2}\) y crece después.</li>
</ul></div>
</deriv>

<deriv id="rutherford" title="La dispersión de Rutherford" tags="Nuclear, Dispersión">
<goal>La distribución angular de partículas cargadas desviadas por el campo de Coulomb de un núcleo, que reveló que la carga positiva está concentrada en un núcleo diminuto.</goal>
<given>
<g>Fuerza central \(F=K/r^2\) con \(K=Z_1Z_2e^2/4\pi\varepsilon_0\); proyectil de energía \(E\) y parámetro de impacto \(b\); núcleo pesado en reposo.</g>
<g>Se conservan la energía \(E\) y el momento angular \(L=mvb\).</g>
</given>
<step op="Ecuación de la trayectoria en \(u=1/r\) (de la conservación de \(L\) y \(E\))">
\[\frac{\mathrm d^2u}{\mathrm d\varphi^2}+u=-\frac K{2Eb^2}.\]
<why>La repulsión da el signo menos: la órbita es una hipérbola.</why>
</step>
<step op="Hipérbola con asíntotas separadas por el ángulo de desviación \(\theta\)">
\[\tan\frac\theta2=\frac K{2Eb}\ \Longrightarrow\ b=\frac K{2E}\cot\frac\theta2.\]
</step>
<step op="Las partículas con parámetro de impacto en \([b,b+\mathrm db]\) se dispersan en \([\theta,\theta+\mathrm d\theta]\): \(2\pi b|\mathrm db|=\sigma'\,2\pi\sin\theta\,|\mathrm d\theta|\)">
\[\frac{\mathrm d\sigma}{\mathrm d\Omega}=\frac b{\sin\theta}\left|\frac{\mathrm db}{\mathrm d\theta}\right|,\qquad\frac{\mathrm db}{\mathrm d\theta}=-\frac K{4E\sin^2(\theta/2)}.\]
</step>
<step op="Sustituir y usar \(\sin\theta=2\sin\frac\theta2\cos\frac\theta2\)">
\[\frac{\mathrm d\sigma}{\mathrm d\Omega}=\left(\frac K{4E}\right)^2\frac1{\sin^4(\theta/2)}.\]
</step>
<result name="Fórmula de Rutherford">\[\frac{\mathrm d\sigma}{\mathrm d\Omega}=\left(\frac{Z_1Z_2e^2}{16\pi\varepsilon_0E}\right)^2\frac1{\sin^4(\theta/2)},\qquad d_\text{mín}=\frac{Z_1Z_2e^2}{4\pi\varepsilon_0E}.\]</result>
<vars>
<v s="\mathrm d\sigma/\mathrm d\Omega" n="sección eficaz diferencial" u="m^2"/>
<v s="K" n="constante de Coulomb del par \(Z_1Z_2e^2/4\pi\varepsilon_0\)" u="J m"/>
<v s="E" n="energía cinética del proyectil" u="J"/>
<v s="b" n="parámetro de impacto" u="m"/>
<v s="\theta" n="ángulo de dispersión" u="rad"/>
<v s="d_\text{mín}" n="distancia de máximo acercamiento (frontal)" u="m"/>
<v s="L" n="momento angular" u="kg m^2 s^-1"/>
<v s="m" n="masa del proyectil" u="kg"/>
<v s="v" n="velocidad inicial del proyectil" u="m s^-1"/>
</vars>
<effects>
<e>Partículas α de 5.5 MeV sobre oro (\(Z_1=2\), \(Z_2=79\); \(K=227.5\) MeV·fm): distancia de máximo acercamiento \(d=41.37\) fm, mucho mayor que el radio del núcleo (≈ 7 fm), de modo que la fórmula vale; \(b(90^\circ)=20.68\) fm; \(\mathrm d\sigma/\mathrm d\Omega=427.8\ \text{fm}^2/\text{sr}\) a 90° y \(23\,833\ \text{fm}^2/\text{sr}\) a 30°.</e>
<e>La sección eficaz es proporcional a \(Z_1^2Z_2^2/E^2\): duplicar la energía la divide por cuatro. Entre 5° y 175° la razón es \(2.75\times10^{5}\) (efecto de \(\sin^{-4}\)): casi todas las partículas se desvían poco y unas pocas rebotan hacia atrás.</e>
</effects>
<limits>
<l>Dimensiones: \((K/E)^2\) tiene unidades de \(\mathrm m^2\) (el factor \(\sin^{-4}\) es adimensional). ✓</l>
<l>Mecánica clásica con núcleo puntual y masivo; si \(E\) es tan grande que \(d<R_\text{nuclear}\) la desviación respecto a Rutherford mide el tamaño del núcleo, y para blancos ligeros hay que usar el sistema del centro de masa. La divergencia en \(\theta\to0\) refleja el alcance infinito del potencial de Coulomb (apantallado por los electrones).</l>
</limits>
<explore sim="nuc-rutherford" title="Dispersión de Rutherford: distancia de acercamiento, parámetro de impacto y sección eficaz"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (α de 5.5 MeV sobre Au, 90°): \(d=41.3663\) fm, \(b=20.6831\) fm y \(\mathrm d\sigma/\mathrm d\Omega=427.792\ \text{fm}^2/\text{sr}\).</li>
<li>Con θ en el eje: la pendiente local de \(\mathrm d\sigma/\mathrm d\Omega\) en escala logarítmica cae de −4 (ángulos pequeños) a un valor mucho menor.</li>
</ul></div>
</deriv>

<deriv id="gamow-alfa" title="La teoría de Gamow de la desintegración alfa" tags="Nuclear, Túnel">
<goal>La semivida de un núcleo emisor alfa a partir de su energía de desintegración \(Q\): el túnel cuántico de la partícula α a través de la barrera de Coulomb.</goal>
<given>
<g>La partícula α (masa reducida \(\mu\)) está dentro del núcleo hijo de radio \(R\), con energía \(Q\); fuera, el potencial es de Coulomb \(V(r)=K/r\) con \(K=2Ze^2/4\pi\varepsilon_0\) (\(Z\): carga del hijo).</g>
<g>Aproximación WKB (capítulo 32): transmisión \(T\simeq e^{-2G}\); la α golpea la barrera con frecuencia \(\nu=v/2R\).</g>
</given>
<step op="Punto de salida: \(V(b)=Q\)">
\[b=\frac KQ=\frac{2Ze^2}{4\pi\varepsilon_0Q}.\]
</step>
<step op="Exponente de Gamow">
\[G=\frac1\hbar\int_R^b\sqrt{2\mu\left(\frac Kr-Q\right)}\,\mathrm dr.\]
</step>
<step op="Sustitución \(r=b\cos^2u\): la integral es elemental">
\[G=\frac{\sqrt{2\mu Q}}\hbar\,b\left[\arccos\sqrt x-\sqrt{x(1-x)}\right],\qquad x=\frac Rb.\]
</step>
<step op="Barrera ancha (\(x\ll1\)): \(\arccos\sqrt x\simeq\pi/2-\sqrt x\) y \(\sqrt{x(1-x)}\simeq\sqrt x\)">
\[2G\simeq2\pi\eta-\frac{4\sqrt{2\mu KR}}\hbar,\qquad\eta=\frac K{\hbar v},\ v=\sqrt{2Q/\mu}.\]
<why>El primer término domina y crece como \(Z/\sqrt Q\): ley empírica de Geiger–Nuttall, \(\ln t_{1/2}\simeq aZ/\sqrt Q+b\).</why>
</step>
<step op="Constante de desintegración y semivida">
\[\lambda=\nu\,e^{-2G},\qquad t_{1/2}=\frac{\ln2}\lambda,\qquad\nu=\frac v{2R},\ v=\sqrt{2Q/\mu}.\]
</step>
<result name="Desintegración alfa">\[t_{1/2}=\frac{2R\ln2}{v}\,e^{2G},\qquad G=\frac{\sqrt{2\mu Q}}\hbar\,b\left[\arccos\sqrt{\frac Rb}-\sqrt{\frac Rb\left(1-\frac Rb\right)}\right].\]</result>
<vars>
<v s="t_{1/2}" n="semivida" u="s"/>
<v s="R" n="radio nuclear" u="m"/>
<v s="b" n="radio de salida de la barrera" u="m"/>
<v s="v" n="velocidad de la partícula α dentro del núcleo" u="m s^-1"/>
<v s="\mu" n="masa reducida α–núcleo hijo" u="kg"/>
<v s="Q" n="energía liberada" u="J"/>
<v s="K" n="constante de Coulomb del par α–hijo" u="J m"/>
<v s="\hbar" n="constante de Planck reducida" u="J s"/>
<v s="G" n="exponente de Gamow" u="1"/>
<v s="\eta" n="parámetro de Sommerfeld" u="1"/>
</vars>
<effects>
<e>²¹²Po → ²⁰⁸Pb (\(Q=8.954\) MeV, \(R=1.2(208^{1/3}+4^{1/3})=9.01\) fm): \(2G=32.29\), \(t_{1/2}=6.3\times10^{-8}\) s frente a \(2.99\times10^{-7}\) s medido (factor 4.7). ²³⁸U → ²³⁴Th (\(Q=4.270\) MeV): \(2G=87.99\), \(t_{1/2}=1.46\times10^{17}\) s frente a \(1.41\times10^{17}\) s medido. ²³²Th (\(Q=4.082\) MeV): \(4.6\times10^{17}\) s frente a \(4.4\times10^{17}\) s; ²²⁶Ra (4.871 MeV): \(3.3\times10^{10}\) s frente a \(5.0\times10^{10}\) s.</e>
<e>Un modelo sin parámetros ajustables reproduce 24 órdenes de magnitud (de \(10^{-7}\) a \(10^{17}\) s) con errores de factor menor que 5: casi toda la variación está en el exponente \(2G\), que depende de \(Q^{-1/2}\); un cambio del 1 % en \(Q\) en el ²³⁸U cambia la semivida en un factor 2.3.</e>
</effects>
<limits>
<l>Dimensiones: \(\sqrt{2\mu Q}\,b/\hbar\) es adimensional. ✓</l>
<l>Supone una α preformada con probabilidad 1 y un núcleo hijo esférico y con momento angular orbital nulo; las diferencias de factor 3–5 vienen de la probabilidad de preformación, el barrido del radio \(R\) y la barrera centrífuga para \(\ell>0\). El resultado depende del radio solo con la raíz.</l>
</limits>
<explore sim="nuc-gamow" title="Desintegración alfa de Gamow: exponente, frecuencia de intentos y semivida"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (Po-212, \(Q=8.954\) MeV): \(2G=32.2916\), \(\nu=1.16\times10^{21}\ \text{s}^{-1}\), \(\log_{10}t_{1/2}=-7.2009\) y \(b=26.3\) fm.</li>
<li>Con \(Q\) en el eje: \(\log_{10}t_{1/2}\) decrece al aumentar \(Q\) (barrera más delgada).</li>
</ul></div>
</deriv>

<deriv id="fusion-gamow" title="Reacciones nucleares: valor Q, barrera de Coulomb y el pico de Gamow de la fusión" tags="Nuclear, Fusión">
<goal>La energía que libera una reacción nuclear, por qué los núcleos de un plasma fusionan a temperaturas mucho menores que la que daría la barrera de Coulomb, y a qué energía ocurre la mayoría de las fusiones.</goal>
<given>
<g>Equivalencia masa–energía \(E=mc^2\); núcleos como esferas de radio \(R=1.2\,A^{1/3}\) fm.</g>
<g>La probabilidad de atravesar la barrera de Coulomb a baja energía es la de Gamow, \(P(E)\simeq e^{-2G}\), y las energías de las partículas del plasma siguen la distribución de Maxwell–Boltzmann \(\propto e^{-E/kT}\).</g>
</given>
<step op="Valor Q de una reacción: diferencia de masas atómicas (en unidades de masa atómica)">
\[Q=\left(\sum m_\text{iniciales}-\sum m_\text{finales}\right)c^2,\qquad1\ \text{u}=931.494\ \text{MeV}/c^2.\]
</step>
<step op="Barrera de Coulomb en el contacto \(R=R_1+R_2\)">
\[V_C=\frac{Z_1Z_2e^2}{4\pi\varepsilon_0R}.\]
</step>
<step op="Probabilidad de túnel a energía \(E\ll V_C\): \(x\to0\) en el exponente de Gamow del capítulo anterior">
\[P(E)=\exp\left(-\sqrt{E_G/E}\right),\qquad E_G=2\mu c^2\left(\pi\alpha Z_1Z_2\right)^2.\]
</step>
<step op="Integrando de la tasa de reacción: el producto \(e^{-E/kT}\,e^{-\sqrt{E_G/E}}\) tiene un máximo (pico de Gamow)">
\[\frac{\mathrm d}{\mathrm dE}\left(-\frac E{kT}-\sqrt{\frac{E_G}E}\right)=0\ \Longrightarrow\ E_0=\left(\frac{E_G(kT)^2}4\right)^{1/3}.\]
</step>
<step op="Anchura del pico (aproximación gaussiana alrededor de \(E_0\))">
\[\Delta=4\sqrt{\frac{E_0\,kT}3}.\]
</step>
<result name="Pico de Gamow">\[E_0=\left(\frac{E_G(kT)^2}4\right)^{1/3},\qquad E_G=2\mu c^2(\pi\alpha Z_1Z_2)^2.\]</result>
<vars>
<v s="Q" n="energía liberada" u="J"/>
<v s="E_G" n="energía de Gamow" u="J"/>
<v s="E_0" n="energía del pico de Gamow" u="J"/>
<v s="kT" n="energía térmica del plasma" u="J"/>
<v s="V_C" n="barrera de Coulomb" u="J"/>
<v s="\mu" n="masa reducida de los núcleos" u="kg"/>
<v s="\alpha" n="constante de estructura fina" u="1"/>
<v s="Z_1,\,Z_2" n="números atómicos" u="1"/>
<v s="c" n="velocidad de la luz" u="m s^-1"/>
<v s="\Delta" n="anchura del pico" u="J"/>
</vars>
<effects>
<e>Valores Q a partir de masas atómicas: D + T → ⁴He + n libera 17.589 MeV; 4 ¹H → ⁴He (cadena p–p y CNO, con el calor de los positrones) 26.731 MeV; D + D → T + p, 4.033 MeV.</e>
