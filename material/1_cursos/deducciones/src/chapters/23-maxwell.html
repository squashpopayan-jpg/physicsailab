<template class="chapter-src" data-id="maxwell" data-num="23" data-title="Ecuaciones de Maxwell, ondas electromagnéticas y radiación" data-part="Parte V · Electromagnetismo" data-short="La onda plana con el vector de Poynting y la presión de radiación, el efecto pelicular, las fórmulas de Fresnel con las capas antirreflejantes, la fórmula de Larmor para la radiación de una carga acelerada y la dispersión de Rayleigh">
<p class="lead">Las cuatro ecuaciones de Maxwell resumen la electricidad y el magnetismo. Con la corrección de la corriente de desplazamiento, \(\nabla\times\mathbf B=\mu_0\mathbf J+\mu_0\varepsilon_0\,\partial_t\mathbf E\), dan una ecuación de ondas cuya velocidad es \(1/\sqrt{\mu_0\varepsilon_0}=c\): la luz es una onda electromagnética. Se deducen aquí la onda plana, su energía y su cantidad de movimiento, la penetración en un conductor, la reflexión en una interfaz y el recubrimiento antirreflejante, la potencia radiada por una carga acelerada (fórmula de Larmor, que revela la inestabilidad clásica del átomo) y la dispersión de Rayleigh, que explica el azul del cielo.</p>

<deriv id="onda-plana" title="La onda electromagnética plana, el vector de Poynting y la presión de radiación" tags="Maxwell, Ondas">
<goal>La velocidad, la relación entre \(E\) y \(B\), el flujo de energía y la presión de radiación de una onda plana en el vacío.</goal>
<given>
<g>Ecuaciones de Maxwell en el vacío sin fuentes: \(\nabla\times\mathbf E=-\partial_t\mathbf B\), \(\nabla\times\mathbf B=\mu_0\varepsilon_0\,\partial_t\mathbf E\), \(\nabla\cdot\mathbf E=\nabla\cdot\mathbf B=0\).</g>
<g>Densidad de energía \(u=\tfrac12\varepsilon_0E^2+B^2/2\mu_0\) y teorema de Poynting: el flujo de energía es \(\mathbf S=\mathbf E\times\mathbf B/\mu_0\); la densidad de momento es \(\mathbf S/c^2\).</g>
</given>
<step op="Ecuación de ondas: tomar el rotacional de la primera ecuación y usar la segunda">
\[\nabla\times(\nabla\times\mathbf E)=-\nabla^2\mathbf E=-\partial_t(\nabla\times\mathbf B)\ \Longrightarrow\ \nabla^2\mathbf E=\mu_0\varepsilon_0\,\partial_t^2\mathbf E,\quad c=\frac1{\sqrt{\mu_0\varepsilon_0}}.\]
<why>Se usa \(\nabla\times(\nabla\times\mathbf E)=\nabla(\nabla\cdot\mathbf E)-\nabla^2\mathbf E\) con \(\nabla\cdot\mathbf E=0\). La corriente de desplazamiento \(\mu_0\varepsilon_0\partial_t\mathbf E\) es la corrección de Maxwell, imprescindible para obtener ondas.</why>
</step>
<step op="Onda plana polarizada que viaja en \(+z\)">
\[E_x=E_0\cos(kz-\omega t),\qquad\omega=ck.\]
</step>
<step op="Campo magnético de la ley de Faraday (\(\partial_zE_x=-\partial_tB_y\))">
\[B_y=\frac{E_0}c\cos(kz-\omega t)\ \Longrightarrow\ B_0=\frac{E_0}c.\]
</step>
<step op="Vector de Poynting medio e intensidad">
\[S=\frac{E_xB_y}{\mu_0}=\frac{E_0^2}{\mu_0c}\cos^2(\cdot)\ \Longrightarrow\ I=\langle S\rangle=\frac{E_0^2}{2\mu_0c}=\tfrac12c\varepsilon_0E_0^2.\]
</step>
<step op="Cantidad de movimiento y presión de radiación">
\[u=\frac Ic,\qquad p_\text{rad}=\frac{\langle S\rangle}c=\frac Ic\ (\text{absorción}),\qquad\frac{2I}c\ (\text{reflexión total}).\]
<why>La onda lleva \(\mathbf S/c^2\) de cantidad de movimiento por unidad de volumen; al absorberla la superficie recibe \(I/c\) de impulso por unidad de tiempo y área, y el doble si la refleja.</why>
</step>
<result name="Onda plana">\[c=\frac1{\sqrt{\mu_0\varepsilon_0}},\qquad B_0=\frac{E_0}c,\qquad I=\tfrac12c\varepsilon_0E_0^2,\qquad p_\text{rad}=\frac Ic.\]</result>
<vars>
<v s="E_0" n="amplitud del campo eléctrico" u="V m^-1"/>
<v s="B_0" n="amplitud del campo magnético" u="T"/>
<v s="c" n="velocidad de la luz" u="m s^-1"/>
<v s="\mu_0" n="permeabilidad del vacío" u="H m^-1"/>
<v s="\varepsilon_0" n="permitividad del vacío" u="F m^-1"/>
<v s="I" n="intensidad (potencia por unidad de área)" u="W m^-2"/>
<v s="p_\text{rad}" n="presión de radiación" u="Pa"/>
<v s="u" n="densidad de energía" u="J m^-3"/>
<v s="k" n="número de onda" u="m^-1"/>
<v s="\omega" n="frecuencia angular" u="rad s^-1"/>
</vars>
<effects>
<e>La luz del Sol sobre la atmósfera (\(I=1361\) W/m²): \(E_0=1012.6\) V/m, \(B_0=3.378\) µT, \(u=4.540\) µJ/m³ y presión de radiación 4.540 µPa (9.080 µPa si fuera un espejo): una vela solar de 1 km² recibe unos 4.5 N. Un láser de 1 mW concentrado en 1 mm² (\(I=1000\) W/m²): \(E_0=868\) V/m.</e>
<e>\(E_0\propto\sqrt I\): una intensidad 10⁶ veces mayor (1.361×10⁹ W/m²) da \(E_0=1.013\times10^6\) V/m, un tercio del campo de ruptura del aire (3×10⁶ V/m); con 10¹² W/m² (láser de pulsos), \(E_0=2.74\times10^7\) V/m, que ioniza el aire. Un haz de 1 W/m² tiene \(E_0=27.4\) V/m, comparable con el de una emisora de radio cercana.</e>
<e>La relación \(E_0/B_0=c=3\times10^8\) m/s indica que en una onda el campo magnético es muy pequeño en unidades SI (3.38 µT para 1012.6 V/m), aunque aporta la misma energía que el eléctrico (\(\tfrac12\varepsilon_0E^2=B^2/2\mu_0\)).</e>
</effects>
<limits>
<l>Dimensiones: \([E/B]=\mathrm{V\,m^{-1}\,T^{-1}}=\mathrm{m\,s^{-1}}\); \([\varepsilon_0E^2]=\mathrm{J\,m^{-3}}\). ✓</l>
<l>Onda plana monocromática en el vacío; para ondas reales, acotadas en el espacio (haces), \(\mathbf E\), \(\mathbf B\) y \(\mathbf k\) no son exactamente perpendiculares. En un medio la velocidad pasa a \(c/n\) y la impedancia a \(Z_0/n\) con \(Z_0=\sqrt{\mu_0/\varepsilon_0}=376.73\) Ω.</l>
</limits>
<explore sim="onda-plana" title="Onda plana: campos, densidad de energía y presión de radiación según la intensidad"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(I=1361\) W/m²): \(E_0=1012.65\) V/m, \(B_0=3.37784\) µT, \(u=4.53981\) µJ/m³, \(p=4.53981\) µPa y 9.07961 µPa para un espejo.</li>
<li>Seleccione \(I\) en el eje (log–log): \(E_0\) y \(B_0\) suben con pendiente 0.5; \(u\) y las presiones con pendiente 1.</li>
</ul></div>
</deriv>

<deriv id="efecto-pelicular" title="El efecto pelicular: ondas en un buen conductor" tags="Maxwell, Conductores">
<goal>La profundidad hasta la que penetra una onda electromagnética en un metal y la resistencia superficial resultante.</goal>
<given>
<g>Ley de Ohm \(\mathbf J=\sigma\mathbf E\) en las ecuaciones de Maxwell; en un buen conductor la corriente de conducción domina sobre la de desplazamiento (\(\sigma\gg\omega\varepsilon_0\)).</g>
</given>
<step op="Ecuación de difusión para el campo">
\[\nabla^2\mathbf E=\mu_0\sigma\,\partial_t\mathbf E\qquad(\text{ec. del capítulo 19, con }D=1/\mu_0\sigma).\]
</step>
<step op="Solución armónica \(E=E_0e^{i(kz-\omega t)}\)">
\[-k^2=-i\omega\mu_0\sigma\ \Longrightarrow\ k^2=i\omega\mu_0\sigma\ \Longrightarrow\ k=\frac{1+i}\delta,\quad\delta=\sqrt{\frac2{\mu_0\sigma\omega}}.\]
<why>\(\sqrt i=(1+i)/\sqrt2\). La parte imaginaria de \(k\) es una atenuación \(e^{-z/\delta}\).</why>
</step>
<step op="Campo atenuado y fase">
\[E(z,t)=E_0\,e^{-z/\delta}\cos\!\left(\frac z\delta-\omega t\right).\]
</step>
<step op="Resistencia superficial: la corriente se concentra en una lámina efectiva de espesor \(\delta\)">
\[R_s=\frac1{\sigma\delta}=\sqrt{\frac{\omega\mu_0}{2\sigma}}.\]
</step>
<result name="Profundidad de penetración">\[\delta=\sqrt{\frac{2}{\mu_0\sigma\omega}}=\frac1{\sqrt{\pi f\mu_0\sigma}},\qquad R_s=\frac1{\sigma\delta}.\]</result>
<vars>
<v s="\delta" n="profundidad de penetración" u="m"/>
<v s="\mu_0" n="permeabilidad del vacío" u="H m^-1"/>
<v s="\sigma" n="conductividad" u="S m^-1"/>
<v s="\omega" n="frecuencia angular" u="rad s^-1"/>
<v s="f" n="frecuencia" u="Hz"/>
<v s="R_s" n="resistencia superficial" u="Ohm"/>
<v s="k" n="número de onda complejo" u="m^-1"/>
<v s="z" n="profundidad" u="m"/>
</vars>
<effects>
<e>Cobre (\(\sigma=59.6\) MS/m): \(\delta=8.42\) mm a 60 Hz (casi el radio de un cable grueso), 2.06 mm a 1 kHz, 0.206 mm a 100 kHz, 65.2 µm a 1 MHz y 0.652 µm a 10 GHz. A 1 MHz la resistencia superficial es 0.257 mΩ y a 10 GHz, 25.7 mΩ (\(\propto\sqrt f\)). La atenuación es 133 dB/mm a 1 MHz: una lámina de cobre de 0.1 mm atenúa 13 dB a 1 MHz y más de 1000 dB a 10 GHz.</e>
<e>\(\delta\propto1/\sqrt{\sigma f}\): el aluminio (37.7 MS/m, 37 % menos conductivo) tiene \(\delta\) un 26 % mayor; un metal mal conductor (3.5 MS/m) a 1 MHz: 0.269 mm. El agua de mar (\(\sigma=4\) S/m) a 1 kHz: \(\delta=7.96\) m y a 100 Hz, 25.2 m, la razón por la que las comunicaciones con submarinos usan frecuencias extremadamente bajas.</e>
<e>Por eso los conductores de alta frecuencia se hacen huecos o con hilos trenzados (Litz): a 1 MHz, un cable de 1 mm de radio usa solo la capa externa de 65 µm y su resistencia es unas 7.7 veces la de corriente continua.</e>
</effects>
<limits>
<l>Dimensiones: \([2/(\mu_0\sigma\omega)]=\mathrm{m^2}\). ✓</l>
<l>Vale si \(\sigma\gg\omega\varepsilon_0\) (hasta \(\sim10^{13}\) Hz en los metales), con conductividad constante y en un semiespacio plano; para frecuencias ópticas y el efecto pelicular anómalo (cuando \(\delta<\ell\), el camino libre medio) es necesaria una teoría no local.</l>
</limits>
<explore sim="piel" title="Efecto pelicular: profundidad de penetración y resistencia superficial"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (Cu, 59.6 MS/m, 60 Hz): \(\delta=8.41630\) mm, \(R_s=1.99357\)×10⁻³ mΩ, atenuación 1.03203 dB/mm y \(\lambda=52.8812\) mm.</li>
<li>Seleccione \(f\) en el eje (log–log): \(\delta\) cae con pendiente −0.5 y \(R_s\) sube con pendiente +0.5.</li>
</ul></div>
</deriv>

<deriv id="fresnel-capas" title="Las fórmulas de Fresnel y la capa antirreflejante" tags="Maxwell, Óptica">
<goal>La fracción de luz reflejada en una interfaz entre dos medios, y el espesor e índice de una capa que la anula.</goal>
<given>
<g>Condiciones de contorno de Maxwell en una interfaz (incidencia normal): \(E\) tangencial y \(H\) tangencial son continuos. En un medio de índice \(n\), \(H=nE/Z_0\).</g>
</given>
<step op="Amplitudes incidente, reflejada y transmitida: continuidad de \(E\) y de \(H\)">
\[1+r=t,\qquad n_1(1-r)=n_2\,t.\]
</step>
<step op="Resolver">
\[r=\frac{n_1-n_2}{n_1+n_2},\qquad t=\frac{2n_1}{n_1+n_2}.\]
</step>
<step op="Reflectancia y transmitancia en potencia (conservación de la energía)">
\[R=r^2=\left(\frac{n_1-n_2}{n_1+n_2}\right)^2,\qquad T=\frac{n_2}{n_1}t^2=\frac{4n_1n_2}{(n_1+n_2)^2},\qquad R+T=1.\]
</step>
<step op="Capa de índice \(n_c\) y espesor \(\lambda/4n_c\): invierte la admitancia del sustrato, \(Y=n_c^2/n_2\)">
\[r_c=\frac{n_1-Y}{n_1+Y}=\frac{n_1n_2-n_c^2}{n_1n_2+n_c^2}.\]
</step>
<step op="Anulación de la reflexión">
\[r_c=0\ \Longleftrightarrow\ n_c=\sqrt{n_1n_2},\qquad d=\frac\lambda{4n_c}.\]
<why>Con ese espesor, la onda reflejada en la cara superior y la de la cara inferior difieren en \(\lambda/2\) de camino y se anulan por interferencia; con ese índice, además tienen igual amplitud.</why>
</step>
<result name="Fresnel y antirreflejo">\[R=\left(\frac{n_1-n_2}{n_1+n_2}\right)^2,\qquad n_c=\sqrt{n_1n_2},\quad d=\frac\lambda{4n_c}.\]</result>
<vars>
<v s="n_1,\,n_2" n="índices de refracción de los medios" u="1"/>
<v s="n_c" n="índice de la capa" u="1"/>
<v s="r,\,t" n="coeficientes de amplitud" u="1"/>
<v s="R,\,T" n="reflectancia y transmitancia" u="1"/>
<v s="d" n="espesor de la capa" u="m"/>
<v s="\lambda" n="longitud de onda en el vacío" u="m"/>
<v s="Y" n="admitancia efectiva del sustrato" u="1"/>
</vars>
<effects>
<e>Aire–vidrio (\(n_2=1.5\)): \(R=4\) % y \(T=96\) % por superficie; una lente con dos caras pierde 7.8 %, y un objetivo con 20 superficies, el 56 %. Con una capa de MgF₂ (\(n_c=1.38\)) de 99.6 nm para 550 nm, \(R\) baja a 1.41 %. El índice ideal sería 1.2247 (\(R=10^{-9}\), con espesor 112.3 nm), que no existe en sólidos.</e>
<e>Aire–diamante/alto índice (\(n_2=2.4\)): \(R=17.0\) % sin capa y 1.33 % con MgF₂. Agua–vidrio (\(n_1=1.33\), 1.5): \(R=0.36\) %: por eso el vidrio sumergido casi desaparece. Con el sustrato de silicio (\(n_2=3.5\)) a 1550 nm y \(n_c=1.87\) (Si₃N₄), \(R=2\times10^{-7}\) con 207 nm.</e>
<e>El anulamiento depende de la longitud de onda: la capa es perfecta a 550 nm (verde), pero con 450 nm la fase cambia y el vidrio con capa refleja un poco de rojo y azul (el color violáceo de las lentes tratadas).</e>
</effects>
<limits>
<l>Dimensiones: \(r\), \(R\) y \(n_c\) son adimensionales; \(\lambda/4n_c\) es una longitud. ✓</l>
<l>Incidencia normal y medios no magnéticos, sin pérdidas (dieléctricos). Para otros ángulos y polarizaciones las fórmulas de Fresnel difieren (aparece el ángulo de Brewster). Las capas múltiples se calculan con el método de matrices de transferencia.</l>
</limits>
<explore sim="fresnel" title="Reflexión de Fresnel y capa antirreflejante de un cuarto de onda"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (aire–vidrio 1.5, \(n_c=1.38\), 550 nm): \(R=0.04\), \(T=0.96\), \(R_c=0.0141105\), \(n_\text{ideal}=1.22474\) y \(d=99.6377\) nm.</li>
<li>Seleccione \(n_c\) en el eje: la reflectancia con capa tiene un mínimo nulo en \(n_c=\sqrt{n_1n_2}=1.2247\).</li>
</ul></div>
</deriv>

<deriv id="larmor" title="La fórmula de Larmor: potencia radiada por una carga acelerada" tags="Radiación, Larmor">
<goal>La potencia electromagnética que emite una carga puntual con aceleración \(a\) (no relativista), y lo que implica para un electrón en un átomo clásico.</goal>
<given>
<g>Campo de radiación de una carga acelerada (de los potenciales retardados): a gran distancia \(r\), con \(\theta\) el ángulo entre la aceleración y la línea de visión, \(E_\theta=\dfrac{q\,a\sin\theta}{4\pi\varepsilon_0c^2r}\), \(B=E_\theta/c\), perpendiculares a \(\hat{\mathbf r}\).</g>
<g>Vector de Poynting \(S=E^2/\mu_0c=\varepsilon_0cE^2\).</g>
</given>
<step op="Flujo de energía por unidad de área">
\[S=\varepsilon_0c\,E_\theta^2=\frac{q^2a^2\sin^2\theta}{16\pi^2\varepsilon_0c^3r^2}.\]
</step>
<step op="Integrar sobre una esfera de radio \(r\) (\(\mathrm dA=r^2\sin\theta\,\mathrm d\theta\,\mathrm d\varphi\))">
\[P=\int S\,r^2\mathrm d\Omega=\frac{q^2a^2}{16\pi^2\varepsilon_0c^3}\cdot2\pi\int_0^\pi\sin^3\theta\,\mathrm d\theta=\frac{q^2a^2}{16\pi^2\varepsilon_0c^3}\cdot\frac{8\pi}3.\]
</step>
<step op="Resultado">
\[P=\frac{q^2a^2}{6\pi\varepsilon_0c^3}.\]
</step>
<step op="Dipolo oscilante \(x=x_0\cos\omega t\): \(\langle a^2\rangle=\omega^4x_0^2/2\)">
\[\langle P\rangle=\frac{q^2x_0^2\omega^4}{12\pi\varepsilon_0c^3}=\frac{p_0^2\omega^4}{12\pi\varepsilon_0c^3}.\]
</step>
<step op="Átomo de Bohr clásico: órbita de radio \(r\), energía \(E=-ke^2/2r\) y \(a=ke^2/(mr^2)\)">
\[\frac{\mathrm dr}{\mathrm dt}=-\frac43\frac{r_e^2c}{r^2}\ \Longrightarrow\ t_\text{caída}=\frac{a_0^3}{4r_e^2c},\qquad r_e=\frac{ke^2}{mc^2}.\]
<why>Se iguala \(\mathrm dE/\mathrm dt=-P\) y se integra \(r^2\mathrm dr\) desde \(a_0\) hasta 0.</why>
</step>
<result name="Fórmula de Larmor">\[P=\frac{q^2a^2}{6\pi\varepsilon_0c^3},\qquad\langle P\rangle_\text{dipolo}=\frac{p_0^2\omega^4}{12\pi\varepsilon_0c^3}.\]</result>
<vars>
<v s="P" n="potencia radiada" u="W"/>
<v s="q" n="carga" u="C"/>
<v s="a" n="aceleración" u="m s^-2"/>
<v s="\varepsilon_0" n="permitividad del vacío" u="F m^-1"/>
<v s="c" n="velocidad de la luz" u="m s^-1"/>
<v s="S" n="vector de Poynting" u="W m^-2"/>
<v s="E_\theta" n="campo de radiación" u="V m^-1"/>
<v s="\theta" n="ángulo entre la aceleración y la línea de visión" u="rad"/>
<v s="r" n="distancia" u="m"/>
<v s="p_0" n="amplitud del momento dipolar" u="C m"/>
<v s="\omega" n="frecuencia angular" u="rad s^-1"/>
<v s="x_0" n="amplitud" u="m"/>
</vars>
<effects>
<e>Un electrón en la órbita de Bohr (\(a=9.044\times10^{22}\) m/s²) radiaría \(P=4.67\times10^{-8}\) W, es decir, \(2.9\times10^{11}\) eV por segundo: la energía de ionización (13.6 eV) en \(4.7\times10^{-11}\) s. La caída en espiral hasta el núcleo duraría \(1.56\times10^{-11}\) s: el átomo clásico sería inestable, el problema que resuelve la mecánica cuántica (capítulos 29 y 31).</e>
<e>\(P\propto q^2a^2\): para \(a=10^{22}\) m/s², \(P=5.7\times10^{-10}\) W; con un factor 10 menos, 100 veces menos; con carga doble (\(2e\)) y la misma aceleración, 4 veces más. A \(a=10^{15}\) m/s², \(5.7\times10^{-24}\) W y 3.6×10⁻⁵ eV/s.</e>
<e>Una antena de emisora corresponde al dipolo oscilante: la potencia crece como \(\omega^4\) (una frecuencia doble radia 16 veces más con el mismo \(p_0\)); la misma dependencia da el azul del cielo (siguiente deducción).</e>
</effects>
<limits>
<l>Dimensiones: \([q^2a^2/(\varepsilon_0c^3)]=\mathrm{C^2m^2s^{-4}/(F\,m^{-1}\,m^3s^{-3})}=\mathrm W\). ✓</l>
<l>Solo para velocidades pequeñas frente a \(c\); en el caso relativista la potencia crece con \(\gamma^4\) (radiación sincrotrón, capítulo 27). No incluye la reacción de la radiación sobre la carga (fuerza de Abraham–Lorentz).</l>
</limits>
<explore sim="larmor" title="Radiación de una carga acelerada: potencia de Larmor"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (carga \(e\), \(a=9.044216\times10^{22}\) m/s²): \(P=4.66929\times10^{-8}\) W, \(2.91434\times10^{11}\) eV/s y 4.66658×10⁻¹¹ s para radiar 13.6 eV.</li>
<li>Seleccione \(a\) en el eje (log–log): \(P\) y la tasa en eV/s suben con pendiente +2; el tiempo baja con pendiente −2.</li>
</ul></div>
</deriv>

<deriv id="rayleigh" title="La dispersión de Rayleigh: por qué el cielo es azul" tags="Radiación, Dispersión">
<goal>La sección eficaz con que una molécula dispersa la luz de longitud de onda \(\lambda\) mucho mayor que su tamaño, y su efecto sobre la luz del Sol.</goal>
<given>
<g>La molécula se polariza en el campo de la onda: \(p=\alpha E_0\cos\omega t\), con \(\alpha=4\pi\varepsilon_0\alpha'\) (\(\alpha'\) es la polarizabilidad en unidades de volumen).</g>
<g>Un dipolo oscilante radia \(\langle P\rangle=p_0^2\omega^4/(12\pi\varepsilon_0c^3)\) (deducción anterior) y la onda incidente tiene intensidad \(I=\tfrac12c\varepsilon_0E_0^2\).</g>
</given>
<step op="Potencia dispersada por la molécula">
\[P=\frac{\alpha^2E_0^2\omega^4}{12\pi\varepsilon_0c^3}.\]
</step>
<step op="Sección eficaz: potencia dispersada por unidad de intensidad incidente">
\[\sigma=\frac PI=\frac{\alpha^2\omega^4}{6\pi\varepsilon_0^2c^4}.\]
</step>
<step op="Con \(\alpha=4\pi\varepsilon_0\alpha'\) y \(k=\omega/c=2\pi/\lambda\)">
\[\sigma=\frac{8\pi}3\,k^4\alpha'^2=\frac{128\pi^5}{3}\frac{\alpha'^2}{\lambda^4}.\]
</step>
<step op="Atenuación de un haz que atraviesa un espesor con \(N_\text{col}\) moléculas por unidad de área">
\[I=I_0\,e^{-\sigma N_\text{col}},\qquad\tau=\sigma N_\text{col}.\]
</step>
<result name="Dispersión de Rayleigh">\[\sigma=\frac{8\pi}3k^4\alpha'^2\propto\lambda^{-4}.\]</result>
<vars>
<v s="\sigma" n="sección eficaz de dispersión" u="m^2"/>
<v s="\alpha'" n="polarizabilidad en unidades de volumen" u="m^3"/>
<v s="\alpha" n="polarizabilidad" u="C m^2 V^-1"/>
<v s="k" n="número de onda" u="m^-1"/>
<v s="\lambda" n="longitud de onda" u="m"/>
<v s="N_\text{col}" n="moléculas por unidad de área en la columna" u="m^-2"/>
<v s="\tau" n="profundidad óptica" u="1"/>
<v s="\omega" n="frecuencia angular" u="rad s^-1"/>
<v s="E_0" n="amplitud del campo" u="V m^-1"/>
<v s="c" n="velocidad de la luz" u="m s^-1"/>
<v s="\varepsilon_0" n="permitividad del vacío" u="F m^-1"/>
</vars>
<effects>
<e>N₂ (\(\alpha'=1.74\) Å³) a 550 nm: \(\sigma=4.32\times10^{-31}\) m². La columna de aire es \(N_\text{col}=p_0/(m_\text{aire}g)=2.149\times10^{29}\) m⁻², de modo que la profundidad óptica de toda la atmósfera en el cenit es \(\tau=0.0928\): transmite el 91.1 % de la luz verde directamente y dispersa el 8.9 %.</e>
<e>El azul (450 nm) se dispersa \((650/450)^4=4.35\) veces más que el rojo (650 nm); a 400 nm, 6.97 veces. La profundidad óptica a 450 nm es 0.207 (transmite 81.3 %) y a 650 nm solo 0.0476 (95.4 %). La luz dispersada llega desde todo el cielo, que se ve azul-violeta, y la luz directa del Sol, empobrecida en azul, se ve amarilla (y roja al atardecer, cuando atraviesa una columna mucho mayor).</e>
<e>\(\sigma\propto\alpha'^2\): con el doble de polarizabilidad, la sección es 4 veces mayor (17.3×10⁻³¹ m²). Las gotas grandes (nubes) con tamaño comparable a \(\lambda\) siguen la teoría de Mie y dispersan todos los colores por igual (nubes blancas).</e>
</effects>
