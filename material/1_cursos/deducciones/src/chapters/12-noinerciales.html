<template class="chapter-src" data-id="noinerciales" data-num="12" data-title="Sistemas no inerciales y elasticidad" data-part="Parte II · Mecánica clásica" data-short="Las fuerzas ficticias en un sistema que gira, la desviación hacia el este de un cuerpo que cae, el péndulo de Foucault, la superficie de un líquido que gira y, para los sólidos deformables, la flexión de una viga empotrada y el pandeo de Euler">
<p class="lead">Las leyes de Newton valen en sistemas inerciales. La Tierra, un carrusel y un coche que frena no lo son, y en ellos aparecen fuerzas que nadie ejerce: la centrífuga, la de Coriolis. Se deducen aquí de una sola identidad sobre la derivada de un vector en un sistema que gira, y se aplican a la caída libre, al péndulo de Foucault y a la superficie de un líquido en rotación. La segunda mitad del capítulo pasa a los sólidos deformables: la ley de Hooke llevada a una viga empotrada (la flecha crece como \(L^3\)) y al pandeo de Euler, donde una columna esbelta falla sin romperse por una inestabilidad de la ecuación diferencial, no del material.</p>

<deriv id="fuerzas-ficticias" title="Fuerzas ficticias y la desviación hacia el este de un cuerpo que cae" tags="Sistemas no inerciales, Coriolis">
<goal>La ley de movimiento en un sistema que gira con velocidad angular \(\boldsymbol\omega\), y con ella la desviación lateral de una piedra que cae desde una altura \(h\) a latitud \(\lambda\).</goal>
<given>
<g>Un vector \(\mathbf A\) con componentes \(A_i\) en una base rotante \(\hat e_i\), cuyos vectores unitarios cumplen \(\mathrm d\hat e_i/\mathrm dt=\boldsymbol\omega\times\hat e_i\).</g>
<g>\(\boldsymbol\omega\) constante (la Tierra gira con \(\omega=2\pi/86\,164.1\,\mathrm s=7.2921\times10^{-5}\) rad/s).</g>
</given>
<step op="Derivar un vector en el sistema que gira">
\[\left(\frac{\mathrm d\mathbf A}{\mathrm dt}\right)_\text{in}=\left(\frac{\mathrm d\mathbf A}{\mathrm dt}\right)_\text{rot}+\boldsymbol\omega\times\mathbf A.\]
<why>Con \(\mathbf A=\sum A_i\hat e_i\): \(\dot{\mathbf A}=\sum\dot A_i\hat e_i+\sum A_i\,\boldsymbol\omega\times\hat e_i\). El primer término es la derivada vista desde el sistema que gira; el segundo, el giro de la base.</why>
</step>
<step op="Aplicar a la posición y a la velocidad">
\[\mathbf v=\mathbf v'+\boldsymbol\omega\times\mathbf r',\qquad \mathbf a=\mathbf a'+2\,\boldsymbol\omega\times\mathbf v'+\boldsymbol\omega\times(\boldsymbol\omega\times\mathbf r').\]
<why>Se aplica la regla dos veces con \(\dot{\boldsymbol\omega}=0\). Los términos \(\mathbf v'\) y \(\mathbf r'\) son los que mide un observador que gira con el sistema.</why>
</step>
<step op="Escribir la segunda ley en el sistema que gira">
\[m\mathbf a'=\mathbf F-2m\,\boldsymbol\omega\times\mathbf v'-m\,\boldsymbol\omega\times(\boldsymbol\omega\times\mathbf r').\]
<why>Los dos últimos términos son las fuerzas ficticias: la de <span class="term">Coriolis</span> (perpendicular a \(\mathbf v'\)) y la <span class="term">centrífuga</span> (hacia afuera del eje, de módulo \(m\omega^2r_\perp\)).</why>
</step>
<step op="Caída desde el reposo en la Tierra">
\[\boldsymbol\omega=\omega(0,\cos\lambda,\sin\lambda),\ \ \mathbf v'\simeq(0,0,-gt)\ \Longrightarrow\ -2\boldsymbol\omega\times\mathbf v'=(2\omega gt\cos\lambda,\,0,\,0).\]
<why>Ejes: este, norte, vertical. A primer orden en \(\omega\), la velocidad es la de caída libre; \(\boldsymbol\omega\times\mathbf v'=(\omega\cos\lambda\cdot(-gt),0,0)\).</why>
</step>
<step op="Integrar hacia el este">
\[\ddot x=2\omega g\cos\lambda\,t\ \Longrightarrow\ x=\tfrac13\omega g\cos\lambda\,t^3,\qquad t=\sqrt{\frac{2h}g}.\]
</step>
<step op="Resultado en función de la altura">
\[\delta=\frac{2\sqrt2}3\,\omega\cos\lambda\,\sqrt{\frac{h^3}g}.\]
</step>
<result name="Desviación por la fuerza de Coriolis">\[\mathbf a'=\frac{\mathbf F}m-2\,\boldsymbol\omega\times\mathbf v'-\boldsymbol\omega\times(\boldsymbol\omega\times\mathbf r'),\qquad \delta=\frac{2\sqrt2}3\,\omega\cos\lambda\,\sqrt{\frac{h^3}g}.\]</result>
<vars>
<v s="\omega" n="velocidad angular de la Tierra" u="rad s^-1"/>
<v s="\lambda" n="latitud" u="rad"/>
<v s="h" n="altura de caída" u="m"/>
<v s="g" n="aceleración de la gravedad" u="m s^-2"/>
<v s="t" n="tiempo de caída" u="s"/>
<v s="\delta" n="desviación hacia el este" u="m"/>
</vars>
<effects>
<e>Caída desde 100 m a 45° de latitud: \(t=4.516\) s y \(\delta=1.552\) cm hacia el este, con velocidad lateral final de 1.03 cm/s. En el ecuador, 2.195 cm; a 60°, 1.098 cm; a 89°, 0.038 cm (en el polo no hay desviación, porque la caída es paralela al eje).</e>
<e>\(\delta\propto h^{3/2}\): desde 300 m son 8.07 cm (5.2 veces más). \(\delta\propto\cos\lambda\) y \(\delta\propto\omega\). Una piedra siempre se desvía hacia el este (en la misma dirección de la rotación, porque conserva su momento angular y cae a un radio donde la Tierra gira más despacio).</e>
<e>La fuerza centrífuga terrestre, \(\omega^2R\cos\lambda=0.0339\cos\lambda\) m/s², reduce el peso aparente en un 0.35 % en el ecuador.</e>
</effects>
<limits>
<l>Dimensiones: \([\omega g t^3]=\mathsf T^{-1}\mathsf L\mathsf T^{-2}\mathsf T^3=\mathsf L\). ✓</l>
<l>Vale a primer orden en \(\omega\); en caídas muy largas, la corrección de segundo orden (hacia el sur) es del orden de \(\omega^2\) y es mucho menor. La desviación se mide con respecto de la vertical del lugar (la dirección de la plomada).</l>
</limits>
<explore sim="coriolis-caida" title="Caída libre en la Tierra: desviación hacia el este según altura y latitud"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (100 m, 45°): \(\delta=1.5524\times10^{-2}\) m, \(t=4.5160\) s y velocidad lateral \(1.0313\times10^{-2}\) m/s.</li>
<li>Seleccione la latitud en el eje: la curva sigue \(\cos\lambda\), con valor máximo 2.195 cm en el ecuador.</li>
</ul></div>
</deriv>

<deriv id="foucault" title="El péndulo de Foucault" tags="Sistemas no inerciales, Coriolis">
<goal>La velocidad con que gira el plano de oscilación de un péndulo largo, a una latitud \(\lambda\), y el tiempo de una vuelta completa.</goal>
<given>
<g>Péndulo simple de longitud \(L\) con oscilaciones horizontales pequeñas \((x,y)\), y la fuerza de Coriolis \(-2m\boldsymbol\omega\times\mathbf v'\) en el sistema de la Tierra (deducción anterior).</g>
<g>Solo importa la componente vertical de la velocidad angular, \(\Omega=\omega\sin\lambda\), porque el movimiento es horizontal (la otra componente produce una fuerza vertical, absorbida por el peso).</g>
</given>
<step op="Ecuaciones del movimiento horizontal">
\[\ddot x=-\frac gLx+2\Omega\dot y,\qquad \ddot y=-\frac gLy-2\Omega\dot x.\]
<why>De \(-2\boldsymbol\omega\times\mathbf v'\) con \(\boldsymbol\omega\to\Omega\hat z\): \((-2\Omega(-\dot y),\,-2\Omega\dot x)\).</why>
</step>
<step op="Combinar en una variable compleja \(\zeta=x+\mathrm iy\)">
\[\ddot\zeta+\frac gL\zeta=-2\mathrm i\Omega\,\dot\zeta.\]
<why>\(\ddot x+\mathrm i\ddot y=-\tfrac gL(x+\mathrm iy)+2\Omega(\dot y-\mathrm i\dot x)\) y \(\dot y-\mathrm i\dot x=-\mathrm i(\dot x+\mathrm i\dot y)\).</why>
</step>
<step op="Cambio a un sistema que gira con \(-\Omega\): \(\zeta=\xi\,\mathrm e^{-\mathrm i\Omega t}\)">
\[\ddot\xi+\left(\frac gL+\Omega^2\right)\xi=0.\]
<why>\(\dot\zeta=(\dot\xi-\mathrm i\Omega\xi)\mathrm e^{-\mathrm i\Omega t}\) y \(\ddot\zeta=(\ddot\xi-2\mathrm i\Omega\dot\xi-\Omega^2\xi)\mathrm e^{-\mathrm i\Omega t}\); al sustituir, los términos en \(\dot\xi\) se cancelan.</why>
</step>
<step op="Leer el resultado">
\[\xi=\xi_0\cos\omega't,\ \ \omega'=\sqrt{g/L+\Omega^2}\simeq\sqrt{g/L}\ \Longrightarrow\ \zeta=\xi\,\mathrm e^{-\mathrm i\Omega t}.\]
<why>\(\xi\) es una oscilación en un plano fijo (en el sistema inercial); la rotación \(\mathrm e^{-\mathrm i\Omega t}\) hace girar ese plano, visto desde la Tierra, con velocidad angular \(-\Omega\) (en el sentido horario en el hemisferio norte).</why>
</step>
<step op="Periodo de una vuelta">
\[\Omega_F=\omega\sin\lambda,\qquad T_F=\frac{2\pi}{\omega\sin\lambda}=\frac{T_\text{sid}}{\sin\lambda}.\]
</step>
<result name="Precesión de Foucault">\[\Omega_F=\omega\sin\lambda,\qquad T_F=\frac{86\,164\ \mathrm s}{\sin\lambda}.\]</result>
<vars>
<v s="\Omega_F" n="velocidad de giro del plano de oscilación" u="rad s^-1"/>
<v s="\omega" n="velocidad angular de la Tierra" u="rad s^-1"/>
<v s="\lambda" n="latitud" u="rad"/>
<v s="T_F" n="periodo de giro del plano" u="s"/>
<v s="L" n="longitud del péndulo" u="m"/>
<v s="g" n="aceleración de la gravedad" u="m s^-2"/>
<v s="g/L" n="cuadrado de la frecuencia del péndulo" u="s^-2"/>
</vars>
<effects>
<e>París (48.857° N): 11.33°/h, una vuelta en 31.78 h; a 45°, 10.64°/h y 33.85 h; en el polo, 15.04°/h y 23.93 h (un día sideral). A 2.44° N (Popayán): \(\Omega_F=0.64\) °/h y 561.8 h \(=23.4\) días por vuelta; en el ecuador no hay precesión.</e>
<e>La precesión no depende de \(L\), de la masa ni de la amplitud: solo de \(\omega\sin\lambda\). Los péndulos largos (decenas de metros) se usan para que la oscilación dure horas sin amortiguarse y se vea el giro.</e>
<e>Es una prueba mecánica de que la Tierra gira: Foucault la presentó en 1851 con un péndulo de 67 m en el Panteón de París.</e>
</effects>
<limits>
<l>Dimensiones: \(\omega\sin\lambda\) es s⁻¹; \(\Omega^2\) y \(g/L\) tienen la misma dimensión. ✓</l>
<l>La corrección \(\Omega^2/(g/L)\sim10^{-9}\) es despreciable. Efectos reales que perturban la precesión: la anisotropía del soporte y la elipticidad de la oscilación (por eso se «arranca» el péndulo soltándolo de un hilo quemado).</l>
</limits>
<explore sim="foucault" title="Precesión del péndulo de Foucault según la latitud"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (París): \(\Omega_F=5.4914\times10^{-5}\) rad/s, 11.327 °/h y una vuelta cada 31.783 h.</li>
<li>Seleccione la latitud en el eje (log–log): la pendiente local tiende a 1 cerca del ecuador, y a 0 en el polo. Con \(\lambda=2.4419^\circ\): 561.76 h.</li>
</ul></div>
</deriv>

<deriv id="cubeta" title="La superficie de un líquido que gira y el espejo líquido" tags="Sistemas no inerciales, Fluidos">
<goal>La forma de la superficie libre de un líquido en un recipiente que gira con velocidad angular \(\omega\), y su distancia focal como espejo.</goal>
<given>
<g>En el sistema que gira con el líquido, éste está en reposo: la fuerza efectiva por unidad de masa es \(\mathbf g_\text{ef}=-g\hat z+\omega^2r\hat r\) (peso más centrífuga), y la superficie libre es perpendicular a ella.</g>
</given>
<step op="Escribir la pendiente de la superficie">
\[\tan\alpha=\frac{\mathrm dz}{\mathrm dr}=\frac{\omega^2r}{g}.\]
<why>La superficie es perpendicular a \(\mathbf g_\text{ef}\): su inclinación respecto de la horizontal cumple \(\tan\alpha=g_r/g_z\).</why>
</step>
<step op="Integrar con \(z(0)=0\)">
\[z(r)=\frac{\omega^2}{2g}\,r^2.\]
<why>Es un paraboloide de revolución. Equivale a la superficie equipotencial \(\Phi=gz-\tfrac12\omega^2r^2=\text{constante}\).</why>
</step>
<step op="Comparar con un espejo parabólico \(z=r^2/(4f)\)">
\[\frac1{4f}=\frac{\omega^2}{2g}\ \Longrightarrow\ f=\frac g{2\omega^2}.\]
<why>Un paraboloide enfoca los rayos paralelos al eje en un único punto: el foco, a distancia \(f\) (capítulo 25).</why>
</step>
<step op="Calcular las revoluciones por minuto">
\[\text{rpm}=\frac{30\,\omega}{\pi}=\frac{30}\pi\sqrt{\frac g{2f}}.\]
</step>
<result name="Superficie del líquido que gira">\[z=\frac{\omega^2r^2}{2g},\qquad f=\frac g{2\omega^2}.\]</result>
<vars>
<v s="z" n="altura de la superficie sobre el centro" u="m"/>
<v s="r" n="distancia al eje" u="m"/>
<v s="\omega" n="velocidad angular" u="rad s^-1"/>
<v s="g" n="aceleración de la gravedad" u="m s^-2"/>
<v s="f" n="distancia focal" u="m"/>
</vars>
<effects>
<e>Con \(\omega=0.7\) rad/s (6.685 rpm): \(f=10.01\) m, la superficie sube 2.50 cm a 1 m del eje y 22.5 cm a 3 m (pendiente 0.04997 a 1 m). Para \(f=9.9\) m hay que girar a 0.7038 rad/s (6.72 rpm, periodo 8.93 s).</e>
<e>\(f\propto\omega^{-2}\) (\(n_\omega=-2\)): duplicar la velocidad de giro reduce el foco a la cuarta parte. A \(\omega=2\) rad/s, \(f=1.226\) m y a 5 rad/s con \(r=0.1\) m, la superficie sube 1.27 cm.</e>
<e>Los telescopios de espejo líquido (mercurio) usan este principio: el espejo parabólico perfecto se forma solo, sin pulir, mientras gire con velocidad constante y el telescopio apunte al cenit.</e>
</effects>
<limits>
<l>Dimensiones: \([\omega^2r^2/g]=\mathsf L\). ✓</l>
<l>Vale con rotación rígida estacionaria y sin tensión superficial; la altura del paraboloide es relevante respecto del espesor de la capa. En un líquido viscoso, tras ponerlo en marcha, hace falta esperar a que el líquido alcance la rotación rígida (tiempo viscoso).</l>
</limits>
<explore sim="cubeta" title="Líquido en rotación: forma parabólica y distancia focal"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (ω = 0.7 rad/s, \(r=1\) m): \(z=0.024983\) m, \(f=10.007\) m, 6.6845 rpm y pendiente 0.049966.</li>
<li>Seleccione ω en el eje (log–log): \(f\) cae con pendiente −2, y \(z\) crece con pendiente 2.</li>
</ul></div>
</deriv>

<deriv id="viga" title="Flexión de una viga empotrada: la ecuación de Euler–Bernoulli" tags="Elasticidad, EDO">
<goal>La flecha en el extremo libre de una viga empotrada con carga \(F\) en el extremo, la rigidez efectiva y la tensión máxima.</goal>
<given>
<g>Hipótesis de Euler–Bernoulli: las secciones planas permanecen planas y perpendiculares al eje; la curvatura es \(\kappa\simeq y''\).</g>
<g>Ley de Hooke: \(\sigma=E\varepsilon\).</g>
</given>
<step op="Relacionar la deformación con la curvatura">
\[\varepsilon(z)=-\kappa z=-z\,y'',\qquad \sigma=-Ezy''.\]
<why>Al flexionar, las fibras a una distancia \(z\) de la fibra neutra se alargan o acortan en proporción a \(z\kappa\).</why>
</step>
<step op="Calcular el momento flector interno">
\[M=-\int\sigma\,z\,\mathrm dA=E\,y''\int z^2\,\mathrm dA=EI\,y'',\qquad I=\int z^2\,\mathrm dA=\frac{bh^3}{12}.\]
<why>La resultante de las tensiones es nula (flexión pura) y su momento es \(M\). Para un rectángulo de ancho \(b\) y altura \(h\), \(I=\int_{-h/2}^{h/2}z^2b\,\mathrm dz\).</why>
</step>
<step op="Momento producido por la carga \(F\) en el extremo">
\[M(x)=F\,(L-x)\ \Longrightarrow\ EI\,y''=F\,(L-x).\]
</step>
<step op="Integrar con \(y(0)=y'(0)=0\) (empotramiento)">
\[y'=\frac F{EI}\left(Lx-\frac{x^2}2\right),\qquad y=\frac F{EI}\left(\frac{Lx^2}2-\frac{x^3}6\right).\]
</step>
<step op="Flecha del extremo y rigidez">
\[\delta=y(L)=\frac{FL^3}{3EI},\qquad k=\frac F\delta=\frac{3EI}{L^3}.\]
</step>
<step op="Tensión máxima en el empotramiento">
\[\sigma_\max=\frac{M_\max\,(h/2)}I=\frac{6FL}{bh^2}.\]
</step>
<result name="Viga en voladizo">\[\delta=\frac{FL^3}{3EI},\quad I=\frac{bh^3}{12},\quad \sigma_\max=\frac{6FL}{bh^2},\quad k=\frac{3EI}{L^3}.\]</result>
<vars>
<v s="F" n="carga en el extremo" u="N"/>
<v s="L" n="longitud" u="m"/>
<v s="E" n="módulo de Young" u="Pa"/>
<v s="I" n="momento de área de la sección" u="m^4"/>
<v s="b" n="ancho de la sección" u="m"/>
<v s="h" n="altura de la sección" u="m"/>
<v s="\delta" n="flecha en el extremo" u="m"/>
<v s="k" n="rigidez" u="kg s^-2"/>
<v s="\sigma_\max" n="tensión máxima" u="Pa"/>
</vars>
<effects>
<e>Acero (\(E=200\) GPa), \(F=20\) N, \(L=0.5\) m, sección \(20\times5\) mm: \(I=2.083\times10^{-10}\) m⁴, \(\delta=2.00\) cm, \(k=1000\) N/m y \(\sigma_\max=120\) MPa.</e>
<e>\(\delta\propto L^3\): con \(L=1\) m, 16.0 cm (8 veces más). \(\delta\propto h^{-3}\): con una altura de 10 mm, 0.25 cm (8 veces menos): una viga es mucho más rígida cuando se carga en su dirección de mayor altura. Con \(b=40\) mm, 1.0 cm; con aluminio (70 GPa), 5.71 cm.</e>
<e>La tensión máxima baja solo como \(h^{-2}\) (\(n_h=-2\)), mientras la flecha lo hace como \(h^{-3}\): duplicar la altura reduce la flecha 8 veces y la tensión 4.</e>
</effects>
<limits>
<l>Dimensiones: \([FL^3/EI]=\mathsf M\mathsf L\mathsf T^{-2}\mathsf L^3/(\mathsf M\mathsf L^{-1}\mathsf T^{-2}\mathsf L^4)=\mathsf L\). ✓</l>
<l>Vale para flechas pequeñas frente a \(L\) (aquí \(2\) cm frente a 50 cm) y tensiones por debajo del límite elástico; con deformaciones grandes la curvatura exacta \(y''/(1+y'^2)^{3/2}\) reemplaza a \(y''\). Se desprecia la deformación por cortante.</l>
</limits>
<explore sim="viga" title="Viga empotrada: flecha, rigidez y tensión máxima"/>
<div class="sim-guide"><ul>
<li>Valores iniciales: flecha 0.02 m, rigidez 1000 N/m y \(\sigma_\max=1.2\times10^{8}\) Pa.</li>
<li>Seleccione \(h\) en el eje (log–log): la flecha cae con pendiente −3; con \(L\), sube con pendiente 3.</li>
</ul></div>
</deriv>

<deriv id="pandeo" title="Pandeo de Euler: la columna que falla sin romperse" tags="Elasticidad, Estabilidad">
<goal>La carga axial crítica a la que una columna esbelta deja de ser recta y se dobla lateralmente.</goal>
<given>
<g>Ecuación de flexión \(EIy''=M\) (deducción anterior) para una columna de longitud \(L\), articulada en ambos extremos, con carga axial \(P\).</g>
<g>Si la columna se desvía lateralmente \(y(x)\), la carga produce un momento \(M=-Py\) que tiende a aumentar la desviación.</g>
</given>
<step op="Escribir la ecuación de equilibrio con la columna ligeramente desviada">
\[EI\,y''=-P\,y\ \Longrightarrow\ y''+k^2y=0,\qquad k^2=\frac P{EI}.\]
</step>
<step op="Resolver">
\[y=A\sin kx+B\cos kx.\]
<why>Es la ecuación del oscilador armónico, en la variable \(x\).</why>
</step>
<step op="Aplicar las condiciones de borde \(y(0)=y(L)=0\)">
\[y(0)=0\Rightarrow B=0;\qquad y(L)=0\Rightarrow A\sin kL=0.\]
</step>
<step op="Buscar soluciones no triviales (\(A\ne0\))">
\[\sin kL=0\ \Longrightarrow\ kL=n\pi\ \Longrightarrow\ P_n=\frac{n^2\pi^2EI}{L^2}.\]
<why>Solo para estos valores discretos de \(P\) existe una configuración doblada de equilibrio, además de la recta: es un problema de valores propios.</why>
</step>
<step op="Cargas críticas">
\[P_\text{cr}=\frac{\pi^2EI}{L^2}\quad(n=1,\ \text{una media onda}).\]
<why>Al alcanzar \(P_1\) la columna recta se vuelve inestable: cualquier perturbación crece. Los modos \(n\ge2\) (más ondas) requieren cargas \(n^2\) veces mayores y se ven solo si se coacciona el modo fundamental.</why>
</step>
<step op="Otras condiciones de borde y tensión crítica">
\[P_\text{cr}=\frac{\pi^2EI}{(KL)^2},\quad K=\begin{cases}1&\text{articulada}\\2&\text{empotrada-libre}\\0.7&\text{empotrada-articulada}\\0.5&\text{empotrada-empotrada}\end{cases}\qquad \sigma_\text{cr}=\frac{\pi^2E}{(KL/r)^2},\ \ r=\sqrt{I/A}.\]
<why>\(KL\) es la longitud de una columna articulada equivalente. La tensión crítica depende solo de la <em>esbeltez</em> \(KL/r\).</why>
</step>
<result name="Carga crítica de Euler">\[P_\text{cr}=\frac{\pi^2EI}{(KL)^2},\qquad \sigma_\text{cr}=\frac{\pi^2E}{(KL/r)^2}.\]</result>
<vars>
<v s="P_\text{cr}" n="carga crítica" u="N"/>
<v s="E" n="módulo de Young" u="Pa"/>
<v s="I" n="momento de área mínimo de la sección" u="m^4"/>
<v s="L" n="longitud" u="m"/>
<v s="K" n="factor de longitud efectiva" u="1"/>
<v s="\sigma_\text{cr}" n="tensión crítica" u="Pa"/>
<v s="r" n="radio de giro" u="m"/>
</vars>
<effects>
<e>Regla de acero (\(E=200\) GPa, sección \(20\times5\) mm, \(L=0.5\) m, articulada): \(P_\text{cr}=1645\) N (unos 168 kgf), \(\sigma_\text{cr}=16.45\) MPa (mucho menor que la tensión de fluencia, ≈ 250 MPa) y esbeltez 346. Empotrada–libre (\(K=2\)): 411 N; empotrada–articulada (\(K=0.7\)): 3357 N; empotrada–empotrada (\(K=0.5\)): 6580 N.</e>
<e>\(P_\text{cr}\propto L^{-2}\): con \(L=1\) m, 411 N (4 veces menos). \(P_\text{cr}\propto h^3\): con \(h=10\) mm, 13 159 N (8 veces más). La carga crítica depende de la rigidez \(EI\), no de la resistencia del material: dos aceros de distinta resistencia pandean igual.</e>
<e>La columna pandea hacia el lado de menor \(I\): una regla se dobla por su lado más delgado.</e>
</effects>
<limits>
<l>Dimensiones: \([\pi^2EI/L^2]=\mathsf M\mathsf L^{-1}\mathsf T^{-2}\mathsf L^4/\mathsf L^2=\mathsf M\mathsf L\mathsf T^{-2}\). ✓</l>
