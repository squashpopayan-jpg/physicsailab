<template class="chapter-src" data-id="gravitacion" data-num="9" data-title="Gravitación, órbitas y dispersión" data-part="Parte II · Mecánica clásica" data-short="La ecuación de Binet y las órbitas cónicas, la energía de una órbita y la tercera ley de Kepler, la transferencia de Hohmann, la dispersión de Rutherford y las mareas">
<p class="lead">El problema de Kepler (una partícula en un campo central \(1/r^2\)) es el único problema mecánico de la historia que cierra todas las preguntas con una sola ecuación: las órbitas son cónicas, el periodo depende solo del tamaño, y la misma matemática describe a un planeta, a un satélite artificial y a una partícula alfa que se acerca a un núcleo. Se deduce aquí a partir de dos leyes de conservación, la del momento angular y la de la energía, con la ecuación de Binet; se obtienen las leyes de Kepler, la velocidad de escape y la trayectoria de transferencia más eficiente entre dos órbitas; se cambia el signo de la fuerza para obtener la dispersión de Rutherford que descubrió el núcleo atómico; y se calcula por qué la Luna, y no el Sol, domina las mareas.</p>

<section>
<h2>Fuerzas centrales: momento angular y segunda ley de Kepler</h2>
<p>Una fuerza central \(\mathbf F=F(r)\hat r\) no ejerce torque respecto del centro: \(\boldsymbol\tau=\mathbf r\times\mathbf F=0\). Como \(\mathrm d\mathbf L/\mathrm dt=\boldsymbol\tau\), el momento angular \(\mathbf L=m\,\mathbf r\times\mathbf v\) es constante. Dos consecuencias: el movimiento es plano (perpendicular a \(\mathbf L\)), y en polares \(L=mr^2\dot\theta\) es constante. El área barrida por el radio vector en un tiempo \(\mathrm dt\) es \(\mathrm dA=\tfrac12r\cdot r\,\mathrm d\theta\), de modo que</p>
\[\frac{\mathrm dA}{\mathrm dt}=\frac12r^2\dot\theta=\frac L{2m}=\text{constante}\]
<p>es la <span class="term">segunda ley de Kepler</span> (áreas iguales en tiempos iguales), válida para cualquier fuerza central, no solo la de la gravitación.</p>
</section>

<deriv id="orbita-conica" title="La ecuación de Binet y las órbitas cónicas" tags="Mecánica celeste, EDO">
<goal>La forma de la órbita \(r(\theta)\) de una partícula atraída por una fuerza \(F=-k/r^2\), con \(k=GMm\).</goal>
<given>
<g>Momento angular constante \(L=mr^2\dot\theta\) y la ecuación radial \(m(\ddot r-r\dot\theta^2)=F(r)\) (aceleración en polares, capítulo 5).</g>
<g>Solución de la ecuación del oscilador con fuente constante (capítulo 4).</g>
</given>
<step op="Cambiar a la variable \(u=1/r\) y usar \(\theta\) como parámetro">
\[\dot\theta=\frac{Lu^2}m,\qquad \dot r=-\frac{\dot\theta}{u^2}\frac{\mathrm du}{\mathrm d\theta}=-\frac Lm\frac{\mathrm du}{\mathrm d\theta},\qquad \ddot r=-\frac{L\dot\theta}m\frac{\mathrm d^2u}{\mathrm d\theta^2}=-\frac{L^2u^2}{m^2}\frac{\mathrm d^2u}{\mathrm d\theta^2}.\]
<why>Regla de la cadena: \(\mathrm d/\mathrm dt=\dot\theta\,\mathrm d/\mathrm d\theta\). El objetivo es eliminar el tiempo: solo importa la forma \(u(\theta)\).</why>
</step>
<step op="Sustituir en la ecuación radial">
\[-\frac{L^2u^2}m\left(\frac{\mathrm d^2u}{\mathrm d\theta^2}+u\right)=F\!\left(\tfrac1u\right).\]
<why>\(r\dot\theta^2=\dfrac1u\cdot\dfrac{L^2u^4}{m^2}=\dfrac{L^2u^3}{m^2}\), de modo que \(m(\ddot r-r\dot\theta^2)=-\dfrac{L^2u^2}m(u''+u)\).</why>
</step>
<step op="Ecuación de Binet">
\[\frac{\mathrm d^2u}{\mathrm d\theta^2}+u=-\frac m{L^2u^2}\,F\!\left(\tfrac1u\right).\]
</step>
<step op="Particularizar a la atracción \(1/r^2\)">
\[F=-ku^2\ \Longrightarrow\ \frac{\mathrm d^2u}{\mathrm d\theta^2}+u=\frac{mk}{L^2}.\]
<why>El miembro derecho es una constante: \(u^2\) se cancela. Es el oscilador armónico con una fuerza constante.</why>
</step>
<step op="Resolver: solución particular más homogénea">
\[u=\frac{mk}{L^2}\big[1+e\cos(\theta-\theta_0)\big].\]
<why>La solución particular es \(u=mk/L^2\) y la homogénea, \(C\cos(\theta-\theta_0)\); se escribe \(C=e\,mk/L^2\). Se elige \(\theta_0=0\) girando el eje.</why>
</step>
<step op="Volver a \(r\) e identificar la cónica">
\[r=\frac p{1+e\cos\theta},\qquad p=\frac{L^2}{mk}.\]
<why>Es la ecuación polar de una cónica con foco en el origen: elipse si \(e\lt1\), parábola si \(e=1\) e hipérbola si \(e\gt1\). La excentricidad queda fijada por la energía (siguiente deducción).</why>
</step>
<step op="Calcular las magnitudes de la elipse y usar la ley de las áreas">
\[r_p=\frac p{1+e},\quad r_a=\frac p{1-e},\quad a=\frac p{1-e^2},\quad b=\frac p{\sqrt{1-e^2}},\quad \frac{v_p}{v_a}=\frac{r_a}{r_p}=\frac{1+e}{1-e}.\]
<why>\(a=(r_p+r_a)/2\) y \(b=\sqrt{r_pr_a}\). En el perihelio y el afelio, la velocidad es perpendicular al radio y \(L=mr_pv_p=mr_av_a\).</why>
</step>
<result name="Órbitas de Kepler">\[r(\theta)=\frac{p}{1+e\cos\theta},\qquad p=\frac{L^2}{mk},\qquad \frac{v_p}{v_a}=\frac{1+e}{1-e}.\]</result>
<vars>
<v s="r" n="distancia al foco" u="m"/>
<v s="\theta" n="ángulo medido desde el perihelio" u="rad"/>
<v s="p" n="semilatus rectum" u="m"/>
<v s="e" n="excentricidad" u="1"/>
<v s="L" n="momento angular" u="kg m^2 s^-1"/>
<v s="m" n="masa" u="kg"/>
<v s="k" n="constante \(GMm\) de la fuerza" u="kg m^3 s^-2"/>
</vars>
<effects>
<e>Con \(e=0.5\) y \(p=1\): \(r_p=0.6667\), \(r_a=2\), \(a=1.3333\), \(b=1.1547\) y \(v_p/v_a=3\). Con \(e=0\): órbita circular de radio \(p\). Con \(p\) fijo, \(r_p\) disminuye al crecer \(e\) y \(r_a\) crece: a \(e=0.9\), \(r_p=0.526\,p\) y \(r_a=10\,p\).</e>
<e>La Tierra (\(e=0.0167\)): \(v_p/v_a=1.034\), solo 3.4 % más rápida en el perihelio. Mercurio (\(e=0.2056\)): 1.518. El cometa Halley (\(e=0.967\)): \(r_a/r_p=59.6\) y su velocidad cambia casi 60 veces entre perihelio y afelio.</e>
<e>\(p=L^2/(mk)\): a \(k\) fijo, duplicar el momento angular cuadruplica \(p\) (\(n_L=2\)).</e>
</effects>
<limits>
<l>Dimensiones: \([L^2/(mk)]=\mathsf M^2\mathsf L^4\mathsf T^{-2}/(\mathsf M\cdot\mathsf M\mathsf L^3\mathsf T^{-2})=\mathsf L\). ✓</l>
<l>Límite \(e\to1\): \(r_a\to\infty\) y la órbita se abre (parabólica); para \(e\gt1\) la hipérbola tiene un ángulo máximo \(\cos\theta_\infty=-1/e\). Una fuerza distinta de \(1/r^2\) (por ejemplo \(1/r^3\)) da órbitas que no se cierran.</l>
</limits>

</deriv>

<deriv id="vis-viva" title="La energía de una órbita, vis-viva y la tercera ley de Kepler" tags="Mecánica celeste, Energía">
<goal>La rapidez en cualquier punto de una órbita elíptica, la energía total en función del semieje mayor, el periodo y la velocidad de escape.</goal>
<given>
<g>Energía \(E=\tfrac12mv^2-GMm/r\) y momento angular \(L\) constantes; órbita \(r=p/(1+e\cos\theta)\) con \(p=L^2/(m^2GM)\) (deducción anterior con \(k=GMm\)).</g>
<g>Área de la elipse \(\pi ab\) y ley de las áreas \(\mathrm dA/\mathrm dt=L/2m\).</g>
</given>
<step op="Calcular la rapidez en el perihelio con \(L=mr_pv_p\)">
\[v_p^2=\frac{L^2}{m^2r_p^2}=\frac{GM\,p}{r_p^2}=\frac{GM(1+e)}{r_p}.\]
<why>De \(p=L^2/(m^2GM)\) y \(p=r_p(1+e)\).</why>
</step>
<step op="Evaluar la energía en el perihelio">
\[\frac Em=\tfrac12v_p^2-\frac{GM}{r_p}=\frac{GM}{r_p}\left(\frac{1+e}2-1\right)=-\frac{GM(1-e)}{2r_p}=-\frac{GM}{2a}.\]
<why>Con \(r_p=a(1-e)\). La energía solo depende del semieje mayor, no de la excentricidad.</why>
</step>
<step op="Despejar la rapidez en cualquier punto (vis-viva)">
\[\tfrac12v^2-\frac{GM}r=-\frac{GM}{2a}\ \Longrightarrow\ v^2=GM\left(\frac2r-\frac1a\right).\]
</step>
<step op="Usar la ley de las áreas para obtener el periodo">
\[\pi ab=\frac L{2m}\,T\ \Longrightarrow\ T=\frac{2\pi ab\,m}L=\frac{2\pi ab}{\sqrt{GM\,p}}.\]
<why>\(L/m=\sqrt{GM\,p}\) porque \(p=L^2/(m^2GM)\).</why>
</step>
<step op="Sustituir \(b=a\sqrt{1-e^2}\) y \(p=a(1-e^2)\)">
\[T=\frac{2\pi a\cdot a\sqrt{1-e^2}}{\sqrt{GM\,a(1-e^2)}}=2\pi\sqrt{\frac{a^3}{GM}}.\]
<why>Todo lo que depende de \(e\) se cancela: es la tercera ley de Kepler.</why>
</step>
<step op="Casos circular y de escape">
\[v_c=\sqrt{\frac{GM}r}\ (a=r),\qquad v_\text{esc}=\sqrt{\frac{2GM}r}\ (a\to\infty,\ E=0)=\sqrt2\,v_c.\]
</step>
<result name="Vis-viva y tercera ley de Kepler">\[v^2=GM\left(\frac2r-\frac1a\right),\qquad E=-\frac{GMm}{2a},\qquad T=2\pi\sqrt{\frac{a^3}{GM}}.\]</result>
<vars>
<v s="v" n="rapidez orbital" u="m s^-1"/>
<v s="G" n="constante de gravitación" u="kg^-1 m^3 s^-2"/>
<v s="M" n="masa del cuerpo central" u="kg"/>
<v s="r" n="distancia al centro" u="m"/>
<v s="a" n="semieje mayor" u="m"/>
<v s="T" n="periodo" u="s"/>
<v s="E" n="energía total de la partícula" u="kg m^2 s^-2"/>
<v s="GM" n="parámetro gravitatorio" u="m^3 s^-2"/>
<v s="E/m" n="energía por unidad de masa" u="m^2 s^-2"/>
<v s="m" n="masa de la partícula" u="kg"/>
</vars>
<effects>
<e>Satélite en órbita baja a 6778 km del centro de la Tierra (\(a=r\), 400 km de altura): \(v=7.6685\) km/s, \(T=5553.5\) s (92.56 min) y \(v_\text{esc}=10.845\) km/s. A 42 164 km (geoestacionaria): \(v=3.0746\) km/s y \(T=86\,164.8\) s (un día sideral).</e>
<e>La Luna (\(a=3.844\times10^8\) m): \(T=27.45\) d (el valor real es 27.32; la diferencia es la masa de la Luna). La Tierra alrededor del Sol: \(v=29.79\) km/s y \(T=365.21\) d; Júpiter (5.2044 UA): 11.87 años. \(T\propto a^{3/2}\) (\(n_a=1.5\)) y \(T\propto M^{-1/2}\).</e>
<e>Órbita tipo Molniya (\(a=26\,600\) km, \(e=0.7\)): \(T=11.99\) h, \(r_p=7980\) km con \(v_p=9.215\) km/s y \(r_a=45\,220\) km con \(v_a=1.626\) km/s, cociente 5.667 \(=(1+e)/(1-e)\).</e>
</effects>
<limits>
<l>Dimensiones: \([GM(2/r-1/a)]=\mathsf L^3\mathsf T^{-2}\mathsf L^{-1}=\mathsf L^2\mathsf T^{-2}\); \([a^3/GM]=\mathsf T^2\). ✓</l>
<l>Límites: \(a=r\) (circular) da \(v_c\); \(a\to\infty\), \(v_\text{esc}\). La tercera ley supone que la masa orbitante es despreciable; si no, \(M\to M+m\) (y para el sistema Tierra–Luna esa corrección explica la diferencia de 0.5 %).</l>
</limits>

<deriv id="hohmann" title="La transferencia de Hohmann entre órbitas circulares" tags="Mecánica celeste, Astronáutica">
<goal>Los dos impulsos mínimos de velocidad y el tiempo para pasar de una órbita circular de radio \(r_1\) a otra de radio \(r_2\) con una elipse tangente a ambas.</goal>
<given>
<g>Vis-viva \(v^2=\mu(2/r-1/a)\) con \(\mu=GM\) (deducción anterior) y velocidad circular \(v_i=\sqrt{\mu/r_i}\).</g>
<g>Impulsos instantáneos tangentes (el cambio de velocidad es \(\Delta v\) y la posición no cambia durante el impulso).</g>
</given>
<step op="Definir la elipse de transferencia">
\[a_t=\frac{r_1+r_2}2,\qquad \text{perigeo }r_1,\ \text{apogeo }r_2.\]
<why>La elipse que toca ambos círculos con tangente común tiene \(2a_t=r_1+r_2\).</why>
</step>
<step op="Velocidades de la elipse en los dos extremos (vis-viva)">
\[v_p=\sqrt{\mu\Big(\frac2{r_1}-\frac1{a_t}\Big)}=v_1\sqrt{\frac{2r_2}{r_1+r_2}},\qquad v_a=v_2\sqrt{\frac{2r_1}{r_1+r_2}}.\]
</step>
<step op="Calcular los dos impulsos">
\[\Delta v_1=v_p-v_1=v_1\left(\sqrt{\frac{2r_2}{r_1+r_2}}-1\right),\qquad \Delta v_2=v_2-v_a=v_2\left(1-\sqrt{\frac{2r_1}{r_1+r_2}}\right).\]
</step>
<step op="Tiempo de transferencia: media órbita elíptica">
\[t=\frac{T_t}2=\pi\sqrt{\frac{a_t^3}\mu}.\]
</step>
<step op="Comparar con el escape y analizar el total">
\[\Delta v_\text{tot}=\Delta v_1+\Delta v_2;\qquad v_\text{esc}=\sqrt2\,v_1.\]
<why>El total crece con \(r_2/r_1\) hasta 15.58 y decrece después: para \(r_2/r_1\gt11.94\) una transferencia bielíptica (tres impulsos, vía un apogeo lejano) ahorra combustible, y para razones muy grandes el total tiende a \((\sqrt2-1)\,v_1\) (3.20 km/s desde la órbita baja terrestre).</why>
</step>
<result name="Transferencia de Hohmann">\[\Delta v_1=\sqrt{\frac\mu{r_1}}\Big(\sqrt{\tfrac{2r_2}{r_1+r_2}}-1\Big),\quad \Delta v_2=\sqrt{\frac\mu{r_2}}\Big(1-\sqrt{\tfrac{2r_1}{r_1+r_2}}\Big),\quad t=\pi\sqrt{\frac{(r_1+r_2)^3}{8\mu}}.\]</result>
<vars>
<v s="\mu" n="parámetro gravitatorio \(GM\)" u="m^3 s^-2"/>
<v s="r_1,\,r_2" n="radios inicial y final" u="m"/>
<v s="a_t" n="semieje de la elipse de transferencia" u="m"/>
<v s="\Delta v_1,\,\Delta v_2" n="impulsos de velocidad" u="m s^-1"/>
<v s="t" n="tiempo de transferencia" u="s"/>
</vars>
<effects>
<e>De una órbita baja (6678 km, 300 km de altura) a la geoestacionaria (42 164 km): \(\Delta v_1=2425.7\) m/s, \(\Delta v_2=1466.8\) m/s, total 3892.6 m/s y 5.275 h de viaje; la velocidad de escape desde la órbita baja es 10.926 km/s.</e>
<e>De la órbita de la Tierra a la de Marte (1 UA a 1.523 UA, alrededor del Sol): \(\Delta v_1=2.944\) km/s, \(\Delta v_2=2.648\) km/s (respecto de las órbitas planetarias), total 5.592 km/s y 258.8 días (8.5 meses): una ventana de lanzamiento cada 26 meses.</e>
<e>Con \(r_2/r_1=11.94\) el total es 4126 m/s (a partir de la órbita baja terrestre), máximo 4143 m/s en 15.58; \(r_2/r_1=2\) cuesta 2198 m/s por \(v_1=7.73\) km/s (28 %).</e>
</effects>
<limits>
<l>Dimensiones: \([\sqrt{\mu/r}]=\mathsf L\mathsf T^{-1}\) y \([\pi\sqrt{a^3/\mu}]=\mathsf T\). ✓</l>
<l>Supone impulsos instantáneos (motores de alto empuje), órbitas coplanares y circulares, y un solo cuerpo atractor; las misiones reales combinan asistencias gravitatorias y maniobras de fase.</l>
</limits>
<explore sim="hohmann" title="Transferencia de Hohmann: impulsos, total y tiempo de viaje"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (Tierra, \(r_1=6678\) km, \(r_2=42\,164\) km): \(\Delta v_1=2425.73\), \(\Delta v_2=1466.82\), total 3892.55 m/s, \(t=18\,990\) s y \(v_\text{esc}=10\,925.8\) m/s.</li>
<li>Seleccione \(r_2\) en el eje (log): el total sube y se aplana cerca de \(r_2/r_1=15.6\), y luego baja.</li>
</ul></div>
</deriv>

<deriv id="rutherford" title="La dispersión de Rutherford" tags="Dispersión, Física nuclear">
<goal>La distribución angular de las partículas dispersadas por un núcleo puntual con fuerza de Coulomb repulsiva, y la distancia de máximo acercamiento.</goal>
<given>
<g>Fuerza de Coulomb \(F=+k/r^2\), con \(k=Z_1Z_2e^2/4\pi\varepsilon_0\) (repulsiva); el blanco es muy pesado y está en reposo.</g>
<g>Partícula con energía \(E=\tfrac12mv_\infty^2\) y parámetro de impacto \(b\), de momento angular \(L=mv_\infty b\).</g>
</given>
<step op="Aplicar la ecuación de Binet con fuerza repulsiva">
\[u''+u=-\frac{mk}{L^2}\ \Longrightarrow\ u=\frac{mk}{L^2}\big(-1+\varepsilon\cos\varphi\big),\qquad \varepsilon=\sqrt{1+\Big(\frac{2Eb}k\Big)^2}.\]
<why>Es la misma ecuación con \(k\to-k\): la solución es una rama de hipérbola. La excentricidad sale de \(E=\tfrac12mv_\infty^2\) y de \(L^2=2mEb^2\): \(\varepsilon^2=1+2EL^2/(mk^2)\).</why>
</step>
<step op="Hallar las direcciones de las asíntotas (\(u=0\))">
\[\cos\varphi_\infty=\frac1\varepsilon.\]
<why>La partícula llega y se va desde \(r\to\infty\) en los dos ángulos \(\pm\varphi_\infty\).</why>
</step>
<step op="Relacionar el ángulo de dispersión con las asíntotas">
\[\theta=2\varphi_\infty-\pi\ \Longrightarrow\ \sin\frac\theta2=\frac1\varepsilon\ \Longrightarrow\ \cot\frac\theta2=\frac{2Eb}k.\]
<why>De \(\varepsilon^2=1/\sin^2(\theta/2)\) y \(\cot^2=\varepsilon^2-1=(2Eb/k)^2\).</why>
</step>
<step op="Despejar el parámetro de impacto">
\[b(\theta)=\frac k{2E}\cot\frac\theta2.\]
</step>
<step op="Calcular la sección eficaz diferencial">
\[\mathrm d\sigma=2\pi b\,|\mathrm db|=\frac b{\sin\theta}\left|\frac{\mathrm db}{\mathrm d\theta}\right|\mathrm d\Omega\ \Longrightarrow\ \frac{\mathrm d\sigma}{\mathrm d\Omega}=\left(\frac k{4E}\right)^2\frac1{\sin^4(\theta/2)}.\]
<why>Las partículas con parámetro de impacto entre \(b\) y \(b+\mathrm db\) salen entre \(\theta\) y \(\theta+\mathrm d\theta\) (\(\mathrm d\Omega=2\pi\sin\theta\,\mathrm d\theta\)). Con \(|\mathrm db/\mathrm d\theta|=\tfrac k{4E}\csc^2\tfrac\theta2\) y \(\sin\theta=2\sin\tfrac\theta2\cos\tfrac\theta2\) queda \(\tfrac{k^2}{16E^2}\csc^4\tfrac\theta2\).</why>
</step>
<step op="Distancia de máximo acercamiento en choque frontal">
\[E=\frac k{d_\min}\ \Longrightarrow\ d_\min=\frac kE.\]
<why>En el punto de retorno la energía cinética es nula y toda es potencial.</why>
</step>
<result name="Fórmula de Rutherford">\[\frac{\mathrm d\sigma}{\mathrm d\Omega}=\left(\frac{Z_1Z_2e^2}{16\pi\varepsilon_0E}\right)^2\frac1{\sin^4(\theta/2)},\qquad d_\min=\frac{Z_1Z_2e^2}{4\pi\varepsilon_0E}.\]</result>
<vars>
<v s="k" n="producto \(Z_1Z_2e^2/4\pi\varepsilon_0\)" u="J m"/>
<v s="E" n="energía cinética del proyectil" u="J"/>
<v s="b" n="parámetro de impacto" u="m"/>
<v s="\theta" n="ángulo de dispersión" u="rad"/>
<v s="d\sigma/d\Omega" n="sección eficaz diferencial" u="m^2"/>
<v s="d_\min" n="distancia de máximo acercamiento" u="m"/>
</vars>
<effects>
<e>Partículas alfa de 5 MeV contra oro (\(k=227.5\) MeV·fm): \(d_\min=45.50\) fm, mucho mayor que el radio del núcleo de oro (≈ 7 fm): las alfas no lo tocan. \(b(90^\circ)=22.75\) fm, \(b(30^\circ)=84.91\) fm y \(\mathrm d\sigma/\mathrm d\Omega(90^\circ)=517.6\) fm²/sr (5.176 barn/sr).</e>
<e>\(\mathrm d\sigma/\mathrm d\Omega\propto E^{-2}\) (\(n_E=-2\)): doblar la energía divide por 4. Crece con \((Z_1Z_2)^2\) y como \(\sin^{-4}(\theta/2)\): de 90° a 10° sube un factor \((\sin45^\circ/\sin5^\circ)^4=4333\); para \(\theta\to0\) diverge porque el potencial de Coulomb tiene alcance infinito.</e>
<e>Geiger y Marsden (1909) encontraron partículas alfa devueltas hacia atrás, un resultado imposible con el modelo de «pudín de pasas» de Thomson, y Rutherford (1911) lo explicó con un núcleo diminuto y cargado.</e>
</effects>
<limits>
<l>Dimensiones: \([(k/4E)^2]=\mathsf L^2\). ✓</l>
<l>Vale para un blanco pesado y un proyectil que no penetra el núcleo (\(d_\min\gt R_\text{núcleo}\)); si el proyectil llega a la superficie nuclear aparecen desviaciones: el método con el que se midieron los radios nucleares. Con efectos cuánticos, la fórmula coincide exactamente con la de Coulomb (coincidencia notable).</l>
</limits>

<deriv id="marea" title="Las mareas: el gradiente del campo gravitatorio" tags="Gravitación, Geofísica">
<goal>La aceleración de marea que un cuerpo de masa \(M\) a distancia \(r\) produce sobre un cuerpo de radio \(R\), y por qué la Luna domina sobre el Sol.</goal>
<given>
<g>Campo gravitatorio \(g(r)=GM/r^2\) dirigido hacia \(M\); el cuerpo afectado cae libremente hacia \(M\) con la aceleración de su centro, de modo que lo que se siente es la <em>diferencia</em> respecto del centro.</g>
<g>Desarrollo de Taylor de primer orden (capítulo 2) con \(R\ll r\).</g>
</given>
<step op="Aceleración en el punto más cercano menos la del centro">
\[a_\text{eje}=\frac{GM}{(r-R)^2}-\frac{GM}{r^2}.\]
</step>
<step op="Desarrollar para \(R\ll r\)">
\[\frac{GM}{(r-R)^2}\simeq\frac{GM}{r^2}\Big(1+\frac{2R}r\Big)\ \Longrightarrow\ a_\text{eje}\simeq\frac{2GMR}{r^3}.\]
<why>\((1-x)^{-2}\simeq1+2x\) con \(x=R/r\) (serie binomial).</why>
</step>
<step op="Punto lateral: componente hacia el centro">
\[a_\perp\simeq-\frac{GM}{r^2}\cdot\frac Rr=-\frac{GMR}{r^3}.\]
<why>El campo en ese punto apunta a \(M\) formando un ángulo \(R/r\) con la dirección al centro; su componente perpendicular es \(g\,R/r\) y comprime.</why>
</step>
<step op="Escribir el tensor de marea">
\[\Big(a_x,a_y,a_z\Big)=\frac{GM}{r^3}\,\big(2x,\,-y,\,-z\big),\qquad \mathbf a_\text{marea}=-\nabla\Phi_\text{marea}.\]
<why>Alarga el cuerpo en la dirección de \(M\) y lo comprime en las otras dos; su traza es nula (\(\nabla\cdot\mathbf g=0\) fuera de la fuente).</why>
</step>
<step op="Comparar dos cuerpos: Luna y Sol">
\[\frac{a_L}{a_S}=\frac{M_L}{M_S}\left(\frac{r_S}{r_L}\right)^3.\]
<why>La marea decae como \(r^{-3}\), no como \(r^{-2}\): el cuerpo cercano gana.</why>
</step>
<result name="Aceleración de marea">\[a_\text{marea}=\frac{2GMR}{r^3}\ \text{(eje)},\qquad \frac{GMR}{r^3}\ \text{(compresión lateral)}.\]</result>
<vars>
<v s="G" n="constante de gravitación" u="kg^-1 m^3 s^-2"/>
<v s="M" n="masa del cuerpo que causa la marea" u="kg"/>
<v s="R" n="radio del cuerpo afectado" u="m"/>
<v s="r" n="distancia entre los centros" u="m"/>
<v s="a_\text{marea}" n="aceleración de marea" u="m s^-2"/>
</vars>
<effects>
<e>La Luna sobre la Tierra: \(a=1.099\times10^{-6}\) m/s² (\(1.12\times10^{-7}g\)) y compresión lateral \(5.50\times10^{-7}\); el Sol: \(5.05\times10^{-7}\) m/s² (\(5.15\times10^{-8}g\)). La Luna es 2.18 veces más eficaz, aunque su atracción sobre la Tierra es 179 veces menor (la fuerza decae como \(r^{-2}\); la marea, como \(r^{-3}\)).</e>
<e>Doblar la distancia divide la marea por 8 (\(n_r=-3\)); doblar el radio del cuerpo, la duplica (\(n_R=1\)): los cuerpos extensos sufren más. Cuando el Sol y la Luna se alinean (luna nueva y llena) se suman: mareas vivas; en cuadratura se restan: mareas muertas.</e>
<e>La marea de un agujero negro (\(r^{-3}\)) y de un planeta que se acerca a su estrella explica la «espaguetización» y el límite de Roche: un satélite fluido se desintegra dentro de \(\approx2.44\,R_\text{planeta}(\rho_p/\rho_s)^{1/3}\).</e>
</effects>
<limits>
<l>Dimensiones: \([GMR/r^3]=\mathsf L^3\mathsf T^{-2}\mathsf L/\mathsf L^3=\mathsf L\mathsf T^{-2}\). ✓</l>
<l>El primer orden da un error relativo de \(\tfrac32R/r\): 2.5 % para la Luna, 0.006 % para el Sol. La marea real en el océano depende además de la forma de las cuencas, de la resonancia y del rozamiento (que frena la rotación de la Tierra unos 2 ms por siglo).</l>
</limits>
<explore sim="marea" title="Aceleración de marea: masa, distancia y radio del cuerpo afectado"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (Luna sobre la Tierra): \(a=1.0993\times10^{-6}\) m/s², compresión \(5.4964\times10^{-7}\) y \(a/g=1.1210\times10^{-7}\).</li>
<li>Seleccione \(r\) en el eje (log–log): recta de pendiente −3. Con \(M=1.989\times10^{30}\) kg y \(r=1.496\times10^{11}\) m (Sol): \(5.052\times10^{-7}\) m/s².</li>
</ul></div>
