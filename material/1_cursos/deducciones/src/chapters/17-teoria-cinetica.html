<template class="chapter-src" data-id="teoria-cinetica" data-num="17" data-title="Teoría cinética de los gases" data-part="Parte IV · Física térmica" data-short="La presión como choques de moléculas, la distribución de Maxwell de las velocidades, el teorema de equipartición y los calores específicos, el camino libre medio y la viscosidad, y la efusión de Graham">
<p class="lead">Si el gas es un conjunto enorme de moléculas que se mueven al azar y chocan, la presión, la temperatura, el calor específico y la viscosidad deben salir de la mecánica de las moléculas. Aquí se parte de la segunda ley de Newton aplicada a una molécula que rebota contra una pared y de un argumento de simetría de Maxwell: el resultado es que la temperatura mide la energía cinética media de traslación, que la distribución de velocidades es una gaussiana y que la viscosidad de un gas no depende de la presión. Las propiedades termodinámicas del capítulo 16 quedan explicadas, y el capítulo 18 las vinculará con la entropía.</p>

<deriv id="presion-cinetica" title="La presión de un gas y el significado cinético de la temperatura" tags="Teoría cinética, Gas ideal">
<goal>La presión que ejercen \(N\) moléculas que rebotan elásticamente en las paredes, y su relación con la energía cinética media y la temperatura.</goal>
<given>
<g>Segunda ley de Newton: la fuerza media sobre la pared es la variación de cantidad de movimiento por unidad de tiempo. Choques elásticos con una pared lisa; las moléculas no se atraen y solo chocan entre sí de forma que mantienen un estado estacionario.</g>
<g>Ecuación empírica del gas ideal: \(pV=NkT\), con la constante de Boltzmann \(k=R/N_A\).</g>
</given>
<step op="Cambio de momento en un choque (pared normal al eje \(x\))">
\[\Delta p_x=m(-v_x)-m(v_x)=-2mv_x\ \Rightarrow\ \text{impulso sobre la pared }=2mv_x.\]
</step>
<step op="Moléculas que golpean el área \(A\) en \(\mathrm dt\)">
\[\mathrm dN=\tfrac12\,n\,v_x\,A\,\mathrm dt\qquad(v_x>0).\]
<why>Solo llegan las que están a una distancia \(v_x\,\mathrm dt\) y se dirigen hacia la pared: la mitad de las moléculas con esa \(|v_x|\).</why>
</step>
<step op="Presión como fuerza por unidad de área">
\[p=\frac{F}{A}=\frac1{A\,\mathrm dt}\sum 2mv_x\,\mathrm dN=n\,m\,\langle v_x^2\rangle.\]
</step>
<step op="Isotropía del movimiento: \(\langle v_x^2\rangle=\langle v_y^2\rangle=\langle v_z^2\rangle=\langle v^2\rangle/3\)">
\[p=\frac13\,n\,m\langle v^2\rangle=\frac23\,n\,\langle E_c\rangle,\qquad\langle E_c\rangle=\tfrac12m\langle v^2\rangle.\]
</step>
<step op="Comparar con \(pV=NkT\), \(n=N/V\)">
\[\tfrac23 n\langle E_c\rangle=nkT\ \Longrightarrow\ \langle E_c\rangle=\tfrac32kT,\qquad v_\text{rms}=\sqrt{\langle v^2\rangle}=\sqrt{\frac{3kT}m}.\]
</step>
<result name="Presión y temperatura cinéticas">\[p=\tfrac13nm\langle v^2\rangle,\qquad\tfrac12m\langle v^2\rangle=\tfrac32kT,\qquad v_\text{rms}=\sqrt{3kT/m}.\]</result>
<vars>
<v s="p" n="presión" u="Pa"/>
<v s="n" n="densidad numérica \(N/V\)" u="m^-3"/>
<v s="m" n="masa de una molécula" u="kg"/>
<v s="v" n="velocidad de una molécula" u="m s^-1"/>
<v s="k" n="constante de Boltzmann" u="J K^-1"/>
<v s="T" n="temperatura absoluta" u="K"/>
<v s="E_c" n="energía cinética de traslación" u="J"/>
<v s="v_\text{rms}" n="velocidad cuadrática media" u="m s^-1"/>
</vars>
<effects>
<e>Nitrógeno (28.0134 g/mol) a 300 K y 1 atm: \(v_\text{rms}=516.8\) m/s, \(\langle E_c\rangle=6.213\times10^{-21}\) J (0.03878 eV), \(n=2.446\times10^{25}\) m⁻³ y \(\rho=1.138\) kg/m³. A igual temperatura, el hidrógeno (2.016 g/mol) tiene la misma energía cinética pero \(v_\text{rms}=1927\) m/s y el argón (39.95 g/mol), 432.8 m/s: \(v\propto M^{-1/2}\).</e>
<e>Cuadruplicar la temperatura duplica la velocidad: a 1200 K el N₂ tendría 1033.7 m/s. A 600 K, \(v_\text{rms}=730.9\) m/s y a 1000 K, 943.6 m/s, con \(\langle E_c\rangle=0.12926\) eV; la energía crece linealmente con \(T\).</e>
<e>La densidad numérica solo depende de \(p/T\): a 10 kPa (0.1 atm) \(n=2.414\times10^{24}\) m⁻³ y \(\rho=0.1123\) kg/m³; la energía cinética y la velocidad no cambian con la presión.</e>
</effects>
<limits>
<l>Dimensiones: \([nm\langle v^2\rangle]=\mathrm{m^{-3}\,kg\,m^2s^{-2}}=\mathrm{Pa}\); \(kT\) es una energía. ✓</l>
<l>La relación \(\langle E_c\rangle=\frac32kT\) vale para la traslación en el régimen clásico (\(\lambda_\text{dB}\ll\) distancia media entre moléculas); a temperaturas muy bajas o densidades altas hay efectos cuánticos (capítulo 18). La rotación y la vibración añaden energía (equipartición).</l>
</limits>
<explore sim="presion-cinetica" title="Velocidad cuadrática media, energía cinética, densidad numérica y másica"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (N₂, 300 K, 101.325 kPa): \(v_\text{rms}=516.839\) m/s, \(\langle E_c\rangle=0.038778\) eV, \(n=2.44631\times10^{25}\) m⁻³ y \(\rho=1.13796\) kg/m³.</li>
<li>Seleccione \(M\) en el eje (log–log): \(v_\text{rms}\) cae con pendiente −0.5 y \(\rho\) sube con pendiente +1; \(\langle E_c\rangle\) no depende de \(M\).</li>
</ul></div>
</deriv>

<deriv id="maxwell-velocidades" title="La distribución de velocidades de Maxwell" tags="Teoría cinética, Probabilidad">
<goal>La fracción de moléculas de un gas en equilibrio con velocidad entre \(v\) y \(v+\mathrm dv\), y las velocidades características.</goal>
<given>
<g>Hipótesis de Maxwell (1860): las tres componentes de la velocidad son independientes, \(f(\mathbf v)=\varphi(v_x)\varphi(v_y)\varphi(v_z)\), y el gas es isótropo, de modo que \(f\) solo depende del módulo.</g>
<g>La energía cinética media por componente es \(\langle\tfrac12mv_x^2\rangle=\tfrac12kT\) (deducción anterior).</g>
</given>
<step op="Escribir la isotropía como una ecuación funcional, con \(s=v_x^2+v_y^2+v_z^2\)">
\[\varphi(v_x)\varphi(v_y)\varphi(v_z)=F(s)\ \Longrightarrow\ \frac{\varphi'(v_x)}{v_x\varphi(v_x)}=\frac{2F'(s)}{F(s)}.\]
<why>Se toma el logaritmo y se deriva respecto de \(v_x\). El lado izquierdo solo depende de \(v_x\); el derecho, de \(s\): ambos son una misma constante \(-2\alpha\).</why>
</step>
<step op="Resolver">
\[\varphi'=-2\alpha v_x\varphi\ \Longrightarrow\ \varphi(v_x)=A\,e^{-\alpha v_x^2},\qquad A=\sqrt{\alpha/\pi}.\]
<why>La normalización \(\int\varphi\,\mathrm dv_x=A\sqrt{\pi/\alpha}=1\) fija \(A\).</why>
</step>
<step op="Determinar \(\alpha\) con la energía media">
\[\langle v_x^2\rangle=\int v_x^2\varphi\,\mathrm dv_x=\frac1{2\alpha}=\frac{kT}m\ \Longrightarrow\ \alpha=\frac m{2kT}.\]
</step>
<step op="Distribución del módulo: sumar sobre la corteza esférica de volumen \(4\pi v^2\mathrm dv\)">
\[f(v)=4\pi\left(\frac m{2\pi kT}\right)^{3/2}v^2\,e^{-mv^2/2kT}.\]
</step>
<step op="Velocidad más probable: \(\mathrm df/\mathrm dv=0\)">
\[2v-\frac{m v^3}{kT}=0\ \Longrightarrow\ v_p=\sqrt{\frac{2kT}m}.\]
</step>
<step op="Valor medio y valor cuadrático medio">
\[\bar v=\int_0^\infty v f\,\mathrm dv=\sqrt{\frac{8kT}{\pi m}},\qquad\langle v^2\rangle=\int_0^\infty v^2f\,\mathrm dv=\frac{3kT}m.\]
</step>
<result name="Distribución de Maxwell">\[f(v)=4\pi\left(\frac m{2\pi kT}\right)^{3/2}v^2e^{-mv^2/2kT},\quad v_p:\bar v:v_\text{rms}=\sqrt2:\sqrt{8/\pi}:\sqrt3.\]</result>
<vars>
<v s="f(v)" n="densidad de probabilidad de la rapidez" u="s m^-1"/>
<v s="m" n="masa molecular" u="kg"/>
<v s="k" n="constante de Boltzmann" u="J K^-1"/>
<v s="T" n="temperatura" u="K"/>
<v s="v_p,\,\bar v,\,v_\text{rms}" n="velocidades características" u="m s^-1"/>
<v s="\alpha" n="parámetro de la gaussiana" u="s^2 m^-2"/>
<v s="v_0" n="velocidad umbral" u="m s^-1"/>
</vars>
<effects>
<e>N₂ a 300 K: \(v_p=422.0\) m/s, \(\bar v=476.2\) m/s y \(v_\text{rms}=516.8\) m/s. La fracción de moléculas con \(v>500\) m/s es 42.22 % y con \(v>1000\) m/s, solo 1.054 %; duplicar la temperatura (600 K) la multiplica por 12.5 (13.19 %): la cola de alta energía es muy sensible a \(T\).</e>
<e>Hidrógeno a 300 K: \(v_p=1573\) m/s y 84.75 % de las moléculas supera 1 km/s; el argón (39.95 g/mol) solo 0.1126 %. Por eso el H₂ se escapa de las atmósferas ligeras.</e>
<e>La fuga atmosférica: a 300 K la fracción de H₂ con \(v>11.2\) km/s (escape terrestre) es \(7.9\times10^{-22}\), pero en la exosfera (≈ 1000 K, \(v_\text{esc}\approx10.8\) km/s) el H supera esa velocidad en 0.272 % de los casos, lo que basta para perderlo en la escala geológica.</e>
</effects>
<limits>
<l>Dimensiones: \([f]=\mathrm{s\,m^{-1}}\) (de modo que \(\int f\,\mathrm dv\) sea adimensional); el exponente \(mv^2/(2kT)\) es adimensional. ✓</l>
<l>Vale en equilibrio y en el régimen clásico (sin degeneración cuántica; para fermiones o bosones a baja temperatura, capítulo 18). En un gas fuera de equilibrio (haz, plasma con campos) la distribución puede ser diferente; la de Maxwell es la única estacionaria con colisiones elásticas (teorema H de Boltzmann).</l>
</limits>
<explore sim="maxwell" title="Distribución de Maxwell: velocidades características y cola de alta velocidad"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (N₂, 300 K, \(v_0=1000\) m/s): \(v_p=421.997\) m/s, \(\bar v=476.173\) m/s, \(v_\text{rms}=516.839\) m/s y fracción 0.010541.</li>
<li>Seleccione \(v_0\) en el eje: la fracción cae casi exponencialmente (\(\propto e^{-x^2}\)); con \(v_0=500\) m/s es 0.4222.</li>
</ul></div>
</deriv>

<deriv id="equiparticion" title="El teorema de equipartición y los calores específicos" tags="Teoría cinética, Calor específico">
<goal>La energía media de un grado de libertad cuadrático en equilibrio a temperatura \(T\), y de ahí el calor específico molar de gases y sólidos.</goal>
<given>
<g>Factor de Boltzmann: la probabilidad de un estado de energía \(E\) es proporcional a \(e^{-E/kT}\) (se deduce en el capítulo 18).</g>
<g>Un grado de libertad «cuadrático» contribuye a la energía con \(E=a\,q^2\) (\(q\) es una coordenada o un momento: \(\tfrac12mv^2\), \(\tfrac12I\omega^2\), \(\tfrac12\kappa x^2\)…).</g>
</given>
<step op="Valor medio con el factor de Boltzmann, con \(\beta=1/kT\)">
\[\langle aq^2\rangle=\frac{\int aq^2e^{-\beta aq^2}\,\mathrm dq}{\int e^{-\beta aq^2}\,\mathrm dq}.\]
</step>
<step op="Integrales gaussianas">
\[\int_{-\infty}^\infty e^{-\beta aq^2}\mathrm dq=\sqrt{\frac\pi{\beta a}},\qquad\int_{-\infty}^\infty q^2e^{-\beta aq^2}\mathrm dq=\frac{\sqrt\pi}{2(\beta a)^{3/2}}.\]
</step>
<step op="Cociente">
\[\langle aq^2\rangle=a\cdot\frac{1}{2\beta a}=\frac{kT}2.\]
<why>No depende de \(a\): cualquier término cuadrático tiene la misma energía media.</why>
</step>
<step op="Energía interna con \(f\) términos cuadráticos por partícula y calor específico">
\[U=\frac f2NkT=\frac f2nRT,\qquad C_v=\frac1n\frac{\partial U}{\partial T}=\frac f2R,\qquad\gamma=\frac{C_p}{C_v}=\frac{f+2}f.\]
<why>Con \(C_p=C_v+R\) (capítulo 16).</why>
</step>
<result name="Equipartición">\[\langle aq^2\rangle=\tfrac12kT,\qquad C_v=\tfrac f2R,\qquad\gamma=1+\tfrac2f.\]</result>
<vars>
<v s="a" n="coeficiente del término cuadrático" u="J"/>
<v s="q" n="coordenada o momento (normalizado)" u="1"/>
<v s="\beta" n="inverso de \(kT\)" u="J^-1"/>
<v s="f" n="grados de libertad cuadráticos" u="1"/>
<v s="U" n="energía interna molar" u="J mol^-1"/>
<v s="C_v" n="calor molar a volumen constante" u="J mol^-1 K^-1"/>
<v s="\gamma" n="índice adiabático" u="1"/>
<v s="c" n="velocidad del sonido" u="m s^-1"/>
<v s="M" n="masa molar" u="kg mol^-1"/>
<v s="R" n="constante de los gases" u="J mol^-1 K^-1"/>
<v s="T" n="temperatura" u="K"/>
</vars>
<effects>
<e>Gas monoatómico (\(f=3\)): \(C_v=12.472\) J/(mol·K) y \(\gamma=5/3\); gas diatómico a temperatura ambiente (traslación y rotación, \(f=5\)): \(C_v=20.786\), \(\gamma=1.4\); con vibración excitada (\(f=7\)): \(C_v=29.101\) y \(\gamma=1.286\). Un sólido (6 términos: 3 de energía cinética y 3 de potencial por átomo) tiene \(C=3R=24.94\) J/(mol·K) (ley de Dulong–Petit; Cu medido a 300 K: 24.4).</e>
<e>La velocidad del sonido \(c=\sqrt{\gamma RT/M}\) del capítulo 13: argón a 300 K, 322.6 m/s; N₂, 353.1 m/s; He, 1019.1 m/s (valores medidos 323, 353 y 1019 m/s). Con \(T=600\) K en N₂, 499.3 m/s.</e>
<e>La energía interna molar de un diatómico a 300 K es \(U=6.236\) kJ/mol y se duplica a 600 K (12.472 kJ/mol): lineal en \(T\) mientras \(f\) no cambie.</e>
</effects>
<limits>
<l>Dimensiones: \(a\,q^2\) es una energía; \(\tfrac f2RT\) tiene unidades de J/mol. ✓</l>
<l>Es un resultado clásico: los modos cuyo cuanto \(h\nu\gg kT\) están «congelados» y no contribuyen (por eso el H₂ pasa de \(C_v=\frac52R\) a \(\frac32R\) por debajo de 100 K, y el calor específico de los sólidos tiende a cero a baja temperatura). La explicación cuantitativa se da en los capítulos 18 y 34.</l>
</limits>
<explore sim="equiparticion" title="Equipartición: calor específico, γ, energía interna y velocidad del sonido"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(f=5\), 300 K, N₂): \(C_v=20.7862\) J/(mol·K), \(\gamma=1.4\), \(U=6235.85\) J/mol y \(c=353.068\) m/s.</li>
<li>Seleccione \(f\) en el eje: \(C_v\) crece linealmente; \(\gamma\) baja a 1.2857 con \(f=7\) y tiende a 1 para muchos grados de libertad.</li>
</ul></div>
</deriv>

<deriv id="camino-libre" title="El camino libre medio y la viscosidad de un gas" tags="Teoría cinética, Transporte">
<goal>La distancia media entre colisiones y el coeficiente de viscosidad de un gas diluido en función de \(T\), \(p\) y del tamaño molecular.</goal>
<given>
<g>Moléculas esféricas de diámetro \(d\): chocan cuando sus centros se acercan a menos de \(d\), con sección eficaz \(\sigma=\pi d^2\).</g>
<g>Distribución de Maxwell: velocidad media \(\bar v=\sqrt{8kT/\pi m}\); la velocidad relativa de dos moléculas tiene masa reducida \(m/2\).</g>
</given>
<step op="Velocidad relativa media">
\[\bar v_\text{rel}=\sqrt{\frac{8kT}{\pi(m/2)}}=\sqrt2\,\bar v.\]
</step>
<step op="Frecuencia de colisión de una molécula (volumen barrido \(\sigma\bar v_\text{rel}\,\mathrm dt\))">
\[\nu=n\,\sigma\,\bar v_\text{rel}=\sqrt2\,n\pi d^2\bar v.\]
</step>
<step op="Camino libre medio">
\[\lambda=\frac{\bar v}\nu=\frac1{\sqrt2\,n\pi d^2}=\frac{kT}{\sqrt2\,\pi d^2\,p}.\]
</step>
<step op="Transporte de cantidad de movimiento: capas de gas con gradiente de velocidad \(u(y)\)">
\[F/A=\tau=\tfrac13nm\bar v\lambda\,\frac{\mathrm du}{\mathrm dy}\ \Longrightarrow\ \eta=\tfrac13nm\bar v\lambda.\]
<why>Se supone que una sexta parte de las moléculas se mueve en cada uno de los sentidos \(\pm x,\pm y,\pm z\); el flujo a través de un plano en cada sentido es \(\tfrac16n\bar v\) y cada molécula llega con la velocidad de arrastre de la capa situada a una distancia \(\lambda\). La diferencia de cantidad de movimiento transportada es \(\tfrac16n\bar v\cdot m\,(2\lambda\,\mathrm du/\mathrm dy)=\tfrac13nm\bar v\lambda\,\mathrm du/\mathrm dy\).</why>
</step>
<step op="Sustituir \(\lambda\)">
\[\eta=\frac13\frac{m\bar v}{\sqrt2\,\pi d^2}=\frac{2}{3\pi^{3/2}}\,\frac{\sqrt{mkT}}{d^2}.\]
<why>La densidad \(n\) se cancela: la viscosidad no depende de la presión y crece con \(\sqrt T\).</why>
</step>
<result name="Camino libre medio y viscosidad">\[\lambda=\frac{kT}{\sqrt2\pi d^2p},\qquad\eta=\frac{2}{3\pi^{3/2}}\frac{\sqrt{mkT}}{d^2}.\]</result>
<vars>
<v s="\lambda" n="camino libre medio" u="m"/>
<v s="\nu" n="frecuencia de colisión" u="s^-1"/>
<v s="d" n="diámetro molecular" u="m"/>
<v s="n" n="densidad numérica" u="m^-3"/>
<v s="\bar v" n="velocidad media" u="m s^-1"/>
<v s="\eta" n="viscosidad dinámica" u="Pa s"/>
<v s="m" n="masa molecular" u="kg"/>
<v s="p" n="presión" u="Pa"/>
<v s="k" n="constante de Boltzmann" u="J K^-1"/>
<v s="T" n="temperatura" u="K"/>
</vars>
<effects>
<e>N₂ (\(d=3.7\) Å) a 300 K y 1 atm: \(\lambda=67.2\) nm (≈ 180 diámetros moleculares), \(\nu=7.085\times10^{9}\) s⁻¹ y \(\bar v=476.2\) m/s. La viscosidad del modelo elemental es 12.14 µPa·s, frente a 17.9 µPa·s medidos: la teoría exacta de Chapman–Enskog para esferas rígidas da \(\frac5{16}\sqrt{mkT/\pi}/d^2=17.88\) µPa·s (el modelo elemental acierta las dependencias, pero el coeficiente numérico es un 32 % menor).</e>
<e>Con presión mil veces menor (101.3 Pa) \(\lambda\) es mil veces mayor (67.2 µm) pero \(\eta\) no cambia (12.14 µPa·s): resultado verificado por Maxwell en 1866 y que sorprendió a sus contemporáneos. En alto vacío (\(10^{-6}\) Torr), \(\lambda=51\) m y cada molécula casi nunca choca con otra.</e>
<e>A 600 K: \(\lambda\) se duplica (134.4 nm) y \(\eta\) crece un 41 % (17.17 µPa·s, \(\propto\sqrt T\)); las moléculas más pequeñas (He, \(d=2.2\) Å) tienen \(\lambda=190.1\) nm. A diferencia de los líquidos, la viscosidad de un gas aumenta con la temperatura.</e>
</effects>
<limits>
<l>Dimensiones: \([\lambda]=\mathrm{J\,K^{-1}\cdot K\,/\,(m^2\,Pa)}=\mathrm m\); \([\eta]=\mathrm{kg\,m^{-1}\,s^{-1}}\). ✓</l>
<l>Vale si \(\lambda\ll\) el tamaño del recipiente y \(\lambda\gg d\) (gas diluido); para \(\lambda\gtrsim\) tamaño de la geometría (régimen de Knudsen) la viscosidad efectiva sí depende de la presión. El «diámetro» efectivo disminuye con la temperatura (las moléculas son blandas), fórmula de Sutherland.</l>
</limits>
<explore sim="camino-libre" title="Camino libre medio, frecuencia de colisión y viscosidad de un gas"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (N₂, 300 K, 3.7 Å, 101.325 kPa): \(\lambda=67.2078\) nm, \(\nu=7.08509\times10^{9}\) s⁻¹, \(\bar v=476.173\) m/s y \(\eta=12.1392\) µPa·s.</li>
<li>Seleccione \(p\) en el eje (log–log): \(\lambda\) cae con pendiente −1 y \(\eta\) permanece plana.</li>
</ul></div>
</deriv>

<deriv id="efusion-graham" title="La efusión de un gas y la ley de Graham" tags="Teoría cinética, Efusión">
<goal>El número de moléculas que atraviesan por unidad de tiempo un orificio pequeño en la pared de un recipiente, y cómo depende de la masa molar.</goal>
<given>
<g>Distribución isótropa de velocidades con densidad \(n\) y velocidad media \(\bar v\); el orificio es mucho menor que el camino libre medio, de modo que no perturba la distribución (efusión de Knudsen).</g>
</given>
<step op="Moléculas que llegan al área \(A\) con rapidez \(v\) y ángulo \(\theta\) respecto de la normal">
\[\mathrm dN=\underbrace{n\,f(v)\mathrm dv}_{\text{densidad con }v}\ \frac{\sin\theta\,\mathrm d\theta\,\mathrm d\varphi}{4\pi}\ v\cos\theta\,A\,\mathrm dt.\]
<why>La fracción con dirección en \(\mathrm d\Omega=\sin\theta\,\mathrm d\theta\,\mathrm d\varphi\) es \(\mathrm d\Omega/4\pi\); las de rapidez \(v\) y ángulo \(\theta\) que están a una distancia menor que \(v\cos\theta\,\mathrm dt\) de la pared la alcanzan en \(\mathrm dt\).</why>
</step>
<step op="Integrar sobre el semiespacio \(\theta\in[0,\pi/2]\), \(\varphi\in[0,2\pi]\)">
\[\int_0^{\pi/2}\cos\theta\sin\theta\,\mathrm d\theta\int_0^{2\pi}\frac{\mathrm d\varphi}{4\pi}=\frac14\ \Longrightarrow\ \Phi=\frac14\,n\,\bar v.\]
</step>
<step op="Escribir con \(p=nkT\) y \(\bar v=\sqrt{8kT/\pi m}\)">
\[\Phi=\frac{p}{\sqrt{2\pi mkT}}.\]
</step>
<step op="Ley de Graham: a igual \(p\) y \(T\), la tasa es proporcional a \(m^{-1/2}\)">
\[\frac{\Phi_1}{\Phi_2}=\sqrt{\frac{m_2}{m_1}}=\sqrt{\frac{M_2}{M_1}}.\]
</step>
<step op="Vaciado de un recipiente de volumen \(V\) por un orificio \(A\)">
\[\frac{\mathrm dN}{\mathrm dt}=-\Phi A=-\frac{\bar vA}{4V}N\ \Longrightarrow\ N=N_0e^{-t/\tau},\quad\tau=\frac{4V}{A\,\bar v}.\]
</step>
<result name="Efusión">\[\Phi=\tfrac14n\bar v=\frac{p}{\sqrt{2\pi mkT}},\qquad\tau=\frac{4V}{A\bar v}.\]</result>
<vars>
<v s="\Phi" n="flujo de moléculas por unidad de área y de tiempo" u="m^-2 s^-1"/>
<v s="n" n="densidad numérica" u="m^-3"/>
<v s="\bar v" n="velocidad media" u="m s^-1"/>
<v s="p" n="presión" u="Pa"/>

<effects>
<e>Un recipiente de 1 L con N₂ a 300 K y 1 Pa, con un orificio de 1 mm²: \(\Phi=2.874\times10^{22}\) m⁻²s⁻¹, escapan \(2.874\times10^{16}\) moléculas por segundo y \(\tau=8.400\) s. Con helio (4.003 g/mol): \(\Phi\) es \(\sqrt{28.0134/4.0026}=2.645\) veces mayor y \(\tau=3.175\) s.</e>
<e>\(\tau\propto V/A\): un orificio diez veces mayor da 0.840 s, y un recipiente diez veces mayor, 84.0 s; \(\tau\propto T^{-1/2}\): a 600 K, \(\tau=5.940\) s. La presión no influye en \(\tau\), solo en el flujo.</e>
<e>Graham: el H₂ escapa 3.984 veces más rápido que el O₂. El \(^{235}\)UF₆ (349.03 g/mol) escapa solo 1.0043 veces más rápido que el \(^{238}\)UF₆ (352.04 g/mol): por eso el enriquecimiento por difusión gaseosa necesitaba cientos de etapas en cascada.</e>
</effects>
<limits>
<l>Dimensiones: \([p/\sqrt{mkT}]=\mathrm{Pa}/\sqrt{\mathrm{kg\,J}}=\mathrm{m^{-2}\,s^{-1}}\). ✓ \(\tau=4V/(A\bar v)\) es un tiempo.</l>
<l>Exige un número de Knudsen \(\mathrm{Kn}=\lambda/d_\text{orificio}\gtrsim1\): con 1 mm² (d ≈ 1.1 mm), \(\lambda=6.8\) mm a 1 Pa; a presión atmosférica (λ = 67 nm) el gas fluye por el orificio como un fluido (Bernoulli del capítulo 15), no por efusión. Los gases que escapan además se enfrían, así que la distribución saliente no es la de Maxwell: más rápida, con \(2kT\) por molécula.</l>
</limits>
