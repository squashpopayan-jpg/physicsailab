<template class="chapter-src" data-id="atomo" data-num="31" data-title="El átomo de hidrógeno, el momento angular y el espín" data-part="Parte VIII · Física cuántica" data-short="La ecuación radial del hidrógeno, el momento angular y el efecto Zeeman, la estructura fina, la ley de Moseley para los rayos X y los átomos exóticos con masa reducida">
<p class="lead">Con la ecuación de Schrödinger en tres dimensiones y el potencial de Coulomb se obtienen los niveles del hidrógeno (los mismos de Bohr) y, a diferencia de Bohr, se explica la forma de los orbitales, el momento angular \(\sqrt{l(l+1)}\hbar\) y su cuantización espacial. El espín y la relatividad añaden la estructura fina; la repulsión entre electrones y el principio de exclusión organizan la tabla periódica, y la energía de los rayos X característicos da el número atómico (Moseley). Los mismos cálculos, con la masa reducida, valen para el positronio y los átomos muónicos.</p>

<deriv id="hidrogeno-radial" title="La ecuación radial del hidrógeno: niveles y tamaño de los orbitales" tags="Átomo, Schrödinger">
<goal>Las energías permitidas y el tamaño medio de los orbitales de un electrón en el campo de Coulomb de un núcleo con carga \(Ze\).</goal>
<given>
<g>Ecuación de Schrödinger estacionaria \(\left[-\dfrac{\hbar^2}{2m}\nabla^2-\dfrac{Ze^2}{4\pi\varepsilon_0r}\right]\psi=E\psi\), con \(\psi=\dfrac{u(r)}rY_l^m(\theta,\varphi)\) (\(Y_l^m\) autofunción de \(\mathbf L^2\) con autovalor \(l(l+1)\hbar^2\)).</g>
</given>
<step op="Ecuación radial (\(u=rR\))">
\[-\frac{\hbar^2}{2m}u''+\left[\frac{l(l+1)\hbar^2}{2mr^2}-\frac{Ze^2}{4\pi\varepsilon_0r}\right]u=Eu.\]
<why>El término \(l(l+1)\hbar^2/2mr^2\) es la barrera centrífuga que aparece al separar la parte angular.</why>
</step>
<step op="Estado fundamental: probar \(u=re^{-r/a}\) con \(l=0\)">
\[u''=\left(\frac{r}{a^2}-\frac2a\right)e^{-r/a}\ \Longrightarrow\ \left(\frac{\hbar^2}{ma}-\frac{Ze^2}{4\pi\varepsilon_0}\right)\frac1r+\left(E+\frac{\hbar^2}{2ma^2}\right)=0.\]
</step>
<step op="Anular ambos términos">
\[a=\frac{4\pi\varepsilon_0\hbar^2}{mZe^2}=\frac{a_0}Z,\qquad E_1=-\frac{\hbar^2}{2ma^2}=-13.6057\ Z^2\ \mathrm{eV}.\]
</step>
<step op="Estados excitados: \(u\propto r^{l+1}e^{-Zr/na_0}\times\) polinomio de grado \(n-l-1\)">
\[E_n=-\frac{13.6057\ \mathrm{eV}\ Z^2}{n^2},\qquad n=1,2,\dots,\quad l=0,\dots,n-1.\]
</step>
<step op="Radio medio (valores medios con las funciones radiales)">
\[\langle r\rangle_{nl}=\frac{a_0}{2Z}\left[3n^2-l(l+1)\right],\qquad r_\text{circular}=\frac{n^2a_0}Z\ (l=n-1).\]
</step>
<result name="Átomo hidrogenoide">\[E_n=-\frac{13.6057\,Z^2}{n^2}\ \mathrm{eV},\qquad\psi_{100}=\frac{e^{-r/a_0}}{\sqrt{\pi a_0^3}},\qquad\langle r\rangle=\frac{a_0}{2Z}\left[3n^2-l(l+1)\right].\]</result>
<vars>
<v s="E_n" n="energía" u="J"/>
<v s="n" n="número cuántico principal" u="1"/>
<v s="l" n="número cuántico orbital" u="1"/>
<v s="Z" n="número atómico" u="1"/>
<v s="a_0" n="radio de Bohr" u="m"/>
<v s="r" n="distancia al núcleo" u="m"/>
<v s="u" n="función radial reducida" u="1"/>
<v s="m" n="masa del electrón" u="kg"/>
<v s="\hbar" n="constante de Planck reducida" u="J s"/>
<v s="e" n="carga elemental" u="C"/>
<v s="\varepsilon_0" n="permitividad del vacío" u="F m^-1"/>
</vars>
<effects>
<e>Estado fundamental del H: \(E=-13.606\) eV, radio medio \(\langle r\rangle=79.38\) pm (1.5 \(a_0\)) y radio más probable \(a_0=52.92\) pm. Para \(n=2\): \(E=-3.4014\) eV; el orbital 2s tiene \(\langle r\rangle=317.5\) pm (6 \(a_0\)) y el 2p, 264.6 pm (5 \(a_0\)), con radio circular de 211.7 pm; la degeneración con espín es \(2n^2=8\).</e>
<e>Los orbitales con menor \(l\) penetran más cerca del núcleo (más \(\langle r\rangle\) pero con lóbulos internos): 3s, 714.4 pm; 3p, 661.5 pm; 3d, 555.6 pm. El ion He⁺ (\(Z=2\)): \(E_1=-54.42\) eV y \(\langle r\rangle=39.69\) pm. Un estado de Rydberg \(n=10\), \(l=9\): \(\langle r\rangle=5.556\) nm y \(E=-0.136\) eV.</e>
<e>La energía depende solo de \(n\) (degeneración «accidental» propia del potencial \(1/r\)); al añadir otros electrones o correcciones relativistas, los niveles con distinto \(l\) se separan.</e>
</effects>
<limits>
<l>Dimensiones: \(\hbar^2/(ma^2)\) es una energía. ✓</l>
<l>Núcleo puntual e infinitamente pesado, sin espín ni relatividad (las correcciones siguientes). La masa reducida corrige el 0.054 % (hidrógeno). Para átomos con varios electrones, la interacción entre ellos impide la solución exacta.</l>
</limits>
<explore sim="hidrogeno" title="Átomo hidrogenoide: energía, radio medio y degeneración"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(Z=1\), \(n=2\), \(l=1\)): \(E=-3.40142\) eV, \(\langle r\rangle=264.589\) pm, radio circular 211.671 pm y degeneración 8.</li>
<li>Seleccione \(n\) en el eje: \(E\propto n^{-2}\) y \(\langle r\rangle\) crece casi como \(n^2\); con \(Z\), \(E\propto Z^2\) y \(r\propto1/Z\).</li>
</ul></div>
</deriv>

<deriv id="momento-angular" title="El momento angular cuántico y el efecto Zeeman" tags="Átomo, Momento angular">
<goal>Los valores permitidos del momento angular orbital y de su proyección, y el desdoblamiento de los niveles en un campo magnético.</goal>
<given>
<g>Operadores \(\mathbf L=\mathbf r\times\mathbf p\) con \(\mathbf p=-i\hbar\nabla\); relaciones de conmutación \([L_x,L_y]=i\hbar L_z\) (y cíclicas); armónicos esféricos \(Y_l^m(\theta,\varphi)\).</g>
<g>Energía de un momento magnético orbital \(\boldsymbol\mu=-(\mu_B/\hbar)\mathbf L\) en un campo \(\mathbf B=B\hat z\): \(H'=(\mu_B/\hbar)BL_z\).</g>
</given>
<step op="Operadores de escalera \(L_\pm=L_x\pm iL_y\) y autovalores">
\[\mathbf L^2Y_l^m=l(l+1)\hbar^2Y_l^m,\qquad L_zY_l^m=m\hbar\,Y_l^m,\quad m=-l,\dots,l.\]
<why>De \([L_z,L_\pm]=\pm\hbar L_\pm\) y de que \(L_x^2+L_y^2\ge0\), la escalera se detiene en \(|m|\le l\) con \(l\) entero (o semientero para el espín).</why>
</step>
<step op="Módulo y orientación (el vector \(\mathbf L\) no puede apuntar exactamente según \(z\))">
\[|\mathbf L|=\sqrt{l(l+1)}\,\hbar,\qquad\cos\theta_\min=\frac l{\sqrt{l(l+1)}}.\]
</step>
<step op="Efecto Zeeman normal: cada nivel \(l\) se desdobla en \(2l+1\) subniveles equiespaciados">
\[\Delta E_m=m\,\mu_BB,\qquad\mu_B=\frac{e\hbar}{2m_e}.\]
</step>
<step op="Una transición \(\Delta m=0,\pm1\) tiene tres componentes (triplete de Lorentz) separadas en frecuencia por">
\[\Delta\nu=\frac{\mu_BB}h=14.0\ \mathrm{GHz/T}\ \times B,\qquad\Delta\lambda=\frac{\lambda^2\mu_BB}{hc}.\]
</step>
<result name="Momento angular y Zeeman">\[|\mathbf L|=\sqrt{l(l+1)}\hbar,\qquad L_z=m\hbar,\qquad\Delta E=\mu_BBm.\]</result>
<vars>
<v s="\mathbf L" n="momento angular orbital" u="J s"/>
<v s="l" n="número cuántico orbital" u="1"/>
<v s="m" n="número cuántico magnético" u="1"/>
<v s="\hbar" n="constante de Planck reducida" u="J s"/>
<v s="\mu_B" n="magnetón de Bohr" u="J T^-1"/>
<v s="B" n="campo magnético" u="T"/>
<v s="\Delta E" n="desdoblamiento Zeeman" u="J"/>
<v s="\theta_\min" n="ángulo mínimo con el eje" u="rad"/>
<v s="h" n="constante de Planck" u="J s"/>
<v s="\nu" n="frecuencia" u="Hz"/>
<v s="\lambda" n="longitud de onda de la línea" u="m"/>
<v s="c" n="velocidad de la luz" u="m s^-1"/>
</vars>
<effects>
<e>Para \(l=1\): \(|\mathbf L|=1.4142\hbar\), proyecciones \(0,\pm\hbar\) y ángulo mínimo con el eje de 45°; para \(l=2\): 2.4495\(\hbar\) y 35.26°; \(l=3\): 3.4641\(\hbar\) y 30°; \(l=10\): 10.488\(\hbar\) y 17.55° (se acerca al límite clásico en que \(\mathbf L\) puede apuntar a cualquier dirección). Hay \(2l+1\) subniveles.</e>
<e>En un campo de 1 T los subniveles se separan 57.88 µeV (frecuencia de Larmor 13.996 GHz); a 10 T, 578.8 µeV y 139.96 GHz; a 0.1 T, 5.79 µeV. La línea roja del cadmio (643.8 nm) se desdobla en un triplete separado Δλ = 0.0194 nm por tesla (Zeeman, 1896; premio Nobel 1902).</e>
<e>El efecto Zeeman permite medir campos magnéticos en el Sol (a distancia, por el desdoblamiento de las líneas), y es la base de la resonancia magnética y de los relojes atómicos con campos de referencia.</e>
</effects>
<limits>
<l>Dimensiones: \(\mu_BB\) es una energía y \(\sqrt{l(l+1)}\hbar\) un momento angular. ✓</l>
<l>Esta forma sin espín (Zeeman «normal») vale para átomos con espín total nulo; en general el espín da el efecto Zeeman anómalo, con factores de Landé \(g_J\). A campos muy intensos (Paschen–Back) los acoplamientos se desligan y aparece el triplete normal.</l>
</limits>
<explore sim="zeeman" title="Momento angular cuántico y desdoblamiento Zeeman"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(l=1\), 1 T): \(|\mathbf L|/\hbar=1.414214\), ángulo mínimo 45°, \(\Delta E=57.8838\) µeV, \(f=13.9962\) GHz y 3 subniveles.</li>
<li>Seleccione \(B\) en el eje (log–log): la separación y la frecuencia crecen con pendiente 1; el ángulo mínimo disminuye al aumentar \(l\).</li>
</ul></div>
</deriv>

<deriv id="estructura-fina" title="La estructura fina del hidrógeno" tags="Átomo, Relatividad">
<goal>La corrección de orden \(\alpha^2\) a las energías de Bohr por la relatividad, la interacción espín–órbita y el término de Darwin.</goal>
<given>
<g>Espín \(s=\tfrac12\) del electrón, con \(g=2\); momento angular total \(\mathbf J=\mathbf L+\mathbf S\), \(j=l\pm\tfrac12\). Energía relativista \(E=\sqrt{p^2c^2+m^2c^4}\) y campo \(\mathbf B=\mathbf E\times\mathbf v/c^2\) que ve el electrón en su propio sistema (con la corrección de Thomas de factor ½).</g>
</given>
<step op="Energía cinética relativista: desarrollo a segundo orden">
\[T=\frac{p^2}{2m}-\frac{p^4}{8m^3c^2}\ \Longrightarrow\ H'_\text{rel}=-\frac{p^4}{8m^3c^2},\quad\langle H'_\text{rel}\rangle=-\frac{E_n^2}{2mc^2}\left[\frac{4n}{l+\tfrac12}-3\right].\]
</step>
<step op="Acoplamiento espín–órbita (con la corrección de Thomas) y término de Darwin">
\[H'_\text{so}=\frac{1}{2m^2c^2}\frac1r\frac{\mathrm dV}{\mathrm dr}\,\mathbf L\cdot\mathbf S,\qquad\mathbf L\cdot\mathbf S=\tfrac12\hbar^2\left[j(j+1)-l(l+1)-\tfrac34\right].\]
</step>
<step op="Suma de las tres correcciones: solo depende de \(n\) y \(j\)">
\[\delta E_{nj}=-\frac{13.6057\ \mathrm{eV}\ \alpha^2}{n^3}\left[\frac1{j+\tfrac12}-\frac3{4n}\right].\]
</step>
<step op="Comprobación con la ecuación de Dirac (desarrollo en \(\alpha\) de la energía exacta)">
\[E_{nj}=mc^2\left[1+\frac{\alpha^2}{(n-\delta_j)^2}\right]^{-1/2},\quad\delta_j=j+\tfrac12-\sqrt{(j+\tfrac12)^2-\alpha^2}.\]
</step>
<result name="Estructura fina">\[E_{nj}=-\frac{13.6057}{n^2}\,\mathrm{eV}-\frac{13.6057\,\alpha^2}{n^3}\left[\frac1{j+\tfrac12}-\frac3{4n}\right]\mathrm{eV}.\]</result>
<vars>
<v s="\delta E_{nj}" n="corrección de estructura fina" u="J"/>
<v s="n" n="número cuántico principal" u="1"/>
<v s="j" n="momento angular total" u="1"/>
<v s="\alpha" n="constante de estructura fina" u="1"/>
<v s="E_n" n="energía de Bohr" u="J"/>
<v s="m" n="masa del electrón" u="kg"/>
<v s="c" n="velocidad de la luz" u="m s^-1"/>
<v s="p" n="cantidad de movimiento" u="kg m s^-1"/>
<v s="V" n="energía potencial" u="J"/>
<v s="\hbar" n="constante de Planck reducida" u="J s"/>
<v s="h" n="constante de Planck" u="J s"/>
<v s="f" n="frecuencia equivalente" u="Hz"/>
</vars>
<effects>
<e>Para \(n=2\): el nivel \(j=\tfrac12\) (2S₁⁄₂ y 2P₁⁄₂, degenerados) se desplaza −56.60 µeV (−13.69 GHz) y el \(j=\tfrac32\) (2P₃⁄₂), −11.32 µeV (−2.737 GHz). La diferencia 2P₃⁄₂ − 2P₁⁄₂ es 45.28 µeV = 10.949 GHz (medido 10.969 GHz); en \(n=1\), 1S₁⁄₂ baja 181.1 µeV (43.80 GHz).</e>
<e>El tamaño de la corrección es \(\alpha^2\approx5.3\times10^{-5}\) veces la energía de Bohr: 1/18 779. Decrece como \(n^{-3}\): para \(n=3\), \(j=\tfrac12\): −20.13 µeV; \(j=\tfrac52\): −2.236 µeV. Con \(Z\) aumenta como \(Z^4\), por lo que en átomos pesados el espín–órbita es grande.</e>
<e>Los niveles 2S₁⁄₂ y 2P₁⁄₂ resultan degenerados en la teoría de Dirac, pero se separan 1058 MHz por el corrimiento de Lamb, efecto de la electrodinámica cuántica (1947).</e>
</effects>
<limits>
<l>Dimensiones: \(\alpha^2E_n\) es una energía. ✓</l>
<l>Primer orden en \(\alpha^2\); faltan la estructura hiperfina (interacción con el espín nuclear, ≈ 10⁻³ de la fina), el corrimiento de Lamb y las correcciones de orden \(\alpha^4\). La suma de los tres términos del segundo paso coincide con el desarrollo de Dirac (verificado simbólicamente).</l>
</limits>
<explore sim="estructura-fina" title="Estructura fina del hidrógeno: corrección δE según n y j"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(n=2\), \(j=\tfrac12\)): \(\delta E=-56.6032\) µeV, \(E_{nj}=-3.40148\) eV y \(\delta E/h=-13.6866\) GHz.</li>
<li>Seleccione \(n\) en el eje: la corrección decae como \(n^{-3}\) (pendiente −3, con el segundo término de \(3/4n\)).</li>
</ul></div>
</deriv>

<deriv id="moseley" title="La ley de Moseley: los rayos X característicos y el número atómico" tags="Átomo, Rayos X">
<goal>La energía de la línea \(K_\alpha\) emitida por un elemento de número atómico \(Z\).</goal>
<given>
<g>Un electrón de la capa K (n = 1) es arrancado por un impacto; un electrón de la capa L (n = 2) cae a ese hueco. El electrón que sobrevive en la capa K apantalla parcialmente el núcleo: carga efectiva \(Z-\sigma\) con \(\sigma\approx1\).</g>
<g>Niveles hidrogenoides con carga efectiva: \(E_n=-13.6057\,(Z-\sigma)^2/n^2\) eV.</g>
</given>
<step op="Energía de la transición L → K">
\[E(K_\alpha)=13.6057\ (Z-\sigma)^2\left(\frac1{1^2}-\frac1{2^2}\right)\mathrm{eV}=\frac34\,13.6057\,(Z-\sigma)^2\ \mathrm{eV}.\]
</step>
<step op="Frecuencia: la raíz cuadrada es lineal en \(Z\) (ley de Moseley, 1913)">
\[\sqrt\nu=\sqrt{\frac{3Ry}{4}}\,(Z-\sigma),\qquad Ry=\frac{13.6057\ \mathrm{eV}}h.\]
</step>
<step op="Longitud de onda">
\[\lambda=\frac{hc}{E}.\]
</step>
<result name="Ley de Moseley">\[E(K_\alpha)=\tfrac34\,(13.6057\ \mathrm{eV})\,(Z-1)^2,\qquad\sqrt\nu\propto Z-1.\]</result>
<vars>
<v s="E(K_\alpha)" n="energía de la línea K-alfa" u="J"/>
<v s="Z" n="número atómico" u="1"/>
<v s="\sigma" n="constante de apantallamiento" u="1"/>
<v s="\nu" n="frecuencia" u="Hz"/>
<v s="Ry" n="frecuencia de Rydberg" u="Hz"/>
<v s="\lambda" n="longitud de onda" u="m"/>
<v s="h" n="constante de Planck" u="J s"/>
<v s="c" n="velocidad de la luz" u="m s^-1"/>
</vars>
<effects>
<e>Hierro (Z = 26): 6.378 keV, λ = 194.4 pm (medido: 6.404 keV); cobre (29): 8.000 keV, λ = 155.0 pm (medido 8.048 keV, el ánodo más común en difractometría); molibdeno (42): 17.15 keV, 72.28 pm (17.48 keV); plata (47): 21.59 keV (22.16 keV); aluminio (13): 1.469 keV (1.487 keV). Errores de 0.4 % a 2.6 %.</e>
<e>El error aumenta en los elementos pesados por la relatividad (tungsteno, Z = 74: 54.4 keV calculado frente a 59.3 keV medido, 8 %). Moseley, midiendo los espectros de 38 elementos, comprobó que \(Z\) y no la masa atómica ordena la tabla periódica y predijo los elementos faltantes (43, 61, 72, 75).</e>
<e>\(E\propto(Z-1)^2\): al pasar de Z = 26 a Z = 52 la energía se multiplica por 4.2 en lugar de 4; \(\sqrt\nu\) crece linealmente, con una pendiente de \(4.967\times10^{7}\) Hz^{1/2} por unidad de Z.</e>
</effects>
<limits>
<l>Dimensiones: \(\sqrt\nu\) en Hz^{1/2}; \(E\) en J. ✓</l>
<l>Modelo hidrogenoide con apantallamiento constante: no incluye la estructura fina de la capa L (Kα₁, Kα₂), la relatividad ni el apantallamiento por los electrones externos. Es la base de la fluorescencia de rayos X en análisis elemental.</l>
</limits>
<explore sim="moseley" title="Ley de Moseley: energía, longitud de onda y raíz de la frecuencia de Kα"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (Z = 29, σ = 1): \(E(K_\alpha)=8.00015\) keV, \(\lambda=154.977\) pm y \(\sqrt\nu=1390.84\) (en unidades de 10⁶ Hz^{1/2}).</li>
<li>Seleccione \(Z\) en el eje (log–log): \(E\) crece con pendiente casi 2; \(\sqrt\nu\) con pendiente casi 1.</li>
</ul></div>
</deriv>

<deriv id="atomos-exoticos" title="Átomos exóticos: la masa reducida (positronio, muónico)" tags="Átomo, Masa reducida">
<goal>Las energías y los tamaños de átomos hidrogenoides cuyas partículas tienen masas \(m_1\) y \(m_2\) cualesquiera (positronio, hidrógeno muónico).</goal>
<given>
<g>El problema de dos cuerpos con fuerza central se reduce a una partícula de masa reducida \(\mu=m_1m_2/(m_1+m_2)\) en el potencial de Coulomb (movimiento relativo); las fórmulas del hidrógeno valen con \(m\to\mu\).</g>
</given>
<step op="Radio y energía con la masa reducida">
\[a=\frac{4\pi\varepsilon_0\hbar^2}{\mu e^2}=a_0\frac{m_e}\mu,\qquad E_n=-\frac{13.6057\ \mathrm{eV}}{n^2}\frac\mu{m_e}.\]
</step>
<step op="Constante de Rydberg y línea Lyman α del sistema">
\[R=R_\infty\frac\mu{m_e},\qquad\frac1\lambda=R\,\frac34.\]
</step>
<result name="Átomos con masa reducida">\[E_n=-13.6057\frac{\mu}{m_en^2}\ \mathrm{eV},\qquad a=a_0\frac{m_e}\mu.\]</result>
<vars>
<v s="\mu" n="masa reducida" u="kg"/>
<v s="m_1,\,m_2" n="masas de las partículas" u="kg"/>
<v s="a" n="radio de Bohr del sistema" u="m"/>
<v s="a_0" n="radio de Bohr del hidrógeno" u="m"/>
<v s="E_n" n="energía" u="J"/>
<v s="R" n="constante de Rydberg del sistema" u="m^-1"/>
<v s="R_\infty" n="constante de Rydberg" u="m^-1"/>
<v s="\lambda" n="longitud de onda" u="m"/>
<v s="n" n="número cuántico" u="1"/>
</vars>
<effects>
<e>Positronio (e⁺e⁻, \(\mu=m_e/2\)): \(E_1=-6.803\) eV, radio 105.8 pm (el doble del H) y Lyman α en 243.0 nm. Hidrógeno muónico (μ⁻p, \(\mu=185.84\,m_e\)): \(E_1=-2528.5\) eV, \(a=0.2847\) pm (284.7 fm, unas 340 veces el radio del protón, 0.84 fm) y Lyman α a 0.6538 nm (1.90 keV, rayos X).</e>
<e>Muonio (μ⁺e⁻, \(\mu=0.99519\,m_e\)): \(E_1=-13.540\) eV, \(a=53.17\) pm, Lyman α en 122.09 nm; para el hidrógeno ordinario (\(\mu=0.99946\,m_e\)): −13.598 eV y 121.568 nm. La masa reducida corrige el hidrógeno en 0.054 % y distingue el deuterio del protio.</e>
<e>Como el muón orbita tan cerca del protón (a 285 fm), su energía es sensible al radio del protón: la medida de la espectroscopía muónica (2010) dio un radio de protón 4 % menor que la de los átomos de hidrógeno electrónicos («el enigma del radio del protón»).</e>
</effects>
<limits>
<l>Dimensiones: \(\mu e^2/\hbar^2\) es una inversa de longitud. ✓</l>
<l>Coulomb puntual no relativista; en el positronio la aniquilación y la estructura hiperfina (espines paralelos u opuestos: orto y parapositronio) son grandes, y en el muónico el tamaño finito del núcleo desplaza los niveles apreciablemente.</l>
</limits>
<explore sim="exoticos" title="Átomos exóticos: masa reducida, energía, radio y línea Lyman α"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (positronio, \(n=1\)): \(\mu=0.5\,m_e\), \(E_1=-6.80285\) eV, \(a=105.835\) pm y \(\lambda_{L\alpha}=243.005\) nm.</li>
<li>Seleccione \(m_2\) en el eje (log–log): al crecer la masa central se tiende al hidrógeno (\(\mu\to m_e\)).</li>
</ul></div>
</deriv>

<section>
