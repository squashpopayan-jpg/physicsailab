<template class="chapter-src" data-id="particulas" data-num="37" data-title="Partículas elementales: umbrales, desintegraciones, resonancias, quarks y neutrinos" data-part="Parte X · Núcleos y partículas" data-short="La energía umbral de producción, la cinemática de la desintegración en dos cuerpos, la resonancia de Breit–Wigner, la razón R que mide los tres colores de los quarks y las oscilaciones de neutrinos">
<p class="lead">La física de partículas es, ante todo, cinemática relativista y mecánica cuántica. Con la conservación del cuadrivector energía–momento se obtiene cuánta energía hace falta para crear una partícula y con qué velocidad salen los productos de una desintegración; con la amplitud de un estado inestable se obtiene la forma de las resonancias; contando cargas se «ven» los tres colores de los quarks; y con un sistema de dos niveles se explica por qué los neutrinos cambian de sabor al viajar.</p>

<deriv id="umbral-produccion" title="Energía umbral de producción de partículas" tags="Partículas, Cinemática">
<goal>La energía cinética mínima que debe tener un proyectil que incide sobre un blanco en reposo para producir un conjunto de partículas de masa total \(\sum M_f\).</goal>
<given>
<g>Conservación del cuadrivector energía–momento (unidades \(c=1\)); invariante relativista \(s=(E_\text{tot})^2-|\mathbf p_\text{tot}|^2\), igual en todos los sistemas inerciales.</g>
<g>Proyectil de masa \(m_1\) y energía \(E_1\); blanco en reposo de masa \(m_2\).</g>
</given>
<step op="Invariante en el sistema del laboratorio (el blanco tiene \(E=m_2\), \(\mathbf p=0\))">
\[s=(E_1+m_2)^2-p_1^2=m_1^2+m_2^2+2E_1m_2.\]
</step>
<step op="En el umbral, en el centro de masa todos los productos quedan en reposo: toda la energía es masa">
\[\sqrt s=\sum M_f.\]
<why>Con cualquier energía menor no hay forma de que el sistema tenga tanta energía en reposo; con más, el exceso se convierte en energía cinética de los productos.</why>
</step>
<step op="Igualar los dos valores de \(s\) y despejar \(E_1\)">
\[E_1=\frac{\left(\sum M_f\right)^2-m_1^2-m_2^2}{2m_2}.\]
</step>
<step op="Energía cinética umbral \(T=E_1-m_1\)">
\[T_\text{umbral}=\frac{\left(\sum M_f\right)^2-(m_1+m_2)^2}{2m_2}.\]
</step>
<step op="Comparación con un colisionador simétrico (haces iguales de energía \(E\), \(\mathbf p_\text{tot}=0\))">
\[s=(2E)^2\ \Longrightarrow\ E_\text{umbral}=\frac{\sum M_f}2.\]
<why>El colisionador aprovecha toda la energía; en el blanco fijo, la mayor parte se «pierde» en el movimiento del centro de masa.</why>
</step>
<result name="Energía umbral">\[T_\text{umbral}=\frac{\left(\sum M_f\right)^2-(m_1+m_2)^2}{2m_2}\qquad(\text{blanco fijo}).\]</result>
<vars>
<v s="T_\text{umbral}" n="energía cinética umbral del proyectil" u="J"/>
<v s="m_1,\,m_2" n="energías en reposo del proyectil y del blanco" u="J"/>
<v s="\sum M_f" n="energía en reposo total de los productos" u="J"/>
<v s="E_1" n="energía total del proyectil" u="J"/>
<v s="s" n="invariante de Mandelstam" u="J^2"/>
<v s="p_1" n="cantidad de movimiento del proyectil (por \(c\))" u="J"/>
</vars>
<effects>
<e>Producción de antiprotones, \(pp\to ppp\bar p\) (\(\sum M_f=4m_p\)): \(T=6m_p=5.6296\) GeV con blanco fijo (el Bevatron se diseñó para 6.2 GeV); solo la tercera parte de la energía cinética (\(1.877\) de \(5.630\) GeV) se convierte en masa. En un colisionador bastaría \(T=m_p=0.938\) GeV por haz.</e>
<e>Piones: \(pp\to pp\pi^0\) exige \(T=279.66\) MeV, y la fotoproducción \(\gamma p\to p\pi^0\), \(E_\gamma=144.69\) MeV. Corte GZK: un protón cósmico que choca de frente con un fotón del fondo de microondas (\(6.34\times10^{-4}\) eV) crea piones si \(E\gtrsim m_\pi(2m_p+m_\pi)/4\varepsilon=1.07\times10^{20}\) eV.</e>
<e>Crear un \(Z^0\) (91.19 GeV) con electrones sobre un blanco de positrones en reposo exigiría \(T=8.1\times10^{6}\) GeV, es decir 8.1 PeV, frente a 45.6 GeV por haz en un colisionador (el LEP): por eso la física de altas energías es de colisionadores.</e>
</effects>
<limits>
<l>Dimensiones: todas las masas se toman como energías en reposo (\(mc^2\)) y \(s\) en J². ✓</l>
<l>El umbral es una condición necesaria, no suficiente: además hay que conservar carga, número bariónico, número leptónico y otros números cuánticos (por eso hace falta crear un par \(p\bar p\), no un antiprotón solo), y la sección eficaz crece desde cero justo por encima del umbral.</l>
</limits>
<explore sim="part-umbral" title="Energía umbral de producción con blanco fijo"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(pp\to ppp\bar p\)): \(T=5.62963\) GeV, \(p=6.50\) GeV/c, \(\sqrt s=3.75309\) GeV y aprovechamiento \(1/3\).</li>
<li>Con \(\sum M_f\) en el eje (log–log): \(T\) crece como \((\sum M_f)^2\) para masas grandes frente a \(m_1+m_2\).</li>
</ul></div>
</deriv>

<deriv id="dos-cuerpos" title="Desintegración en dos cuerpos" tags="Partículas, Cinemática">
<goal>Las energías y la cantidad de movimiento de los dos productos en que se desintegra una partícula de masa \(M\) en reposo.</goal>
<given>
<g>Conservación de energía y de cantidad de movimiento (\(c=1\)); la partícula madre en reposo: \(\mathbf p_1+\mathbf p_2=0\) y \(E_1+E_2=M\).</g>
</given>
<step op="Los dos productos tienen cantidades de movimiento iguales y opuestas, \(|\mathbf p_1|=|\mathbf p_2|=p^*\)">
\[E_1^2=p^{*2}+m_1^2,\qquad E_2^2=p^{*2}+m_2^2.\]
</step>
<step op="Restar: \(E_2^2-E_1^2=m_2^2-m_1^2\) con \(E_2=M-E_1\)">
\[(M-E_1)^2-E_1^2=m_2^2-m_1^2\ \Longrightarrow\ M^2-2ME_1=m_2^2-m_1^2.\]
</step>
<step op="Energía de cada producto">
\[E_1=\frac{M^2+m_1^2-m_2^2}{2M},\qquad E_2=\frac{M^2+m_2^2-m_1^2}{2M}.\]
</step>
<step op="Cantidad de movimiento común: \(p^*=\sqrt{E_1^2-m_1^2}\)">
\[p^*=\frac{\sqrt{\left[M^2-(m_1+m_2)^2\right]\left[M^2-(m_1-m_2)^2\right]}}{2M}.\]
</step>
<step op="Energía cinética de cada producto">
\[T_1=E_1-m_1,\qquad\beta_1=\frac{p^*}{E_1}.\]
</step>
<result name="Desintegración de dos cuerpos">\[p^*=\frac{\sqrt{\left[M^2-(m_1+m_2)^2\right]\left[M^2-(m_1-m_2)^2\right]}}{2M},\qquad E_1=\frac{M^2+m_1^2-m_2^2}{2M}.\]</result>
<vars>
<v s="M" n="energía en reposo de la partícula madre" u="J"/>
<v s="m_1,\,m_2" n="energías en reposo de los productos" u="J"/>
<v s="p^*" n="cantidad de movimiento por \(c\) en el sistema de reposo de la madre" u="J"/>
<v s="E_1,\,E_2" n="energías de los productos" u="J"/>
<v s="T_1" n="energía cinética del primer producto" u="J"/>
<v s="\beta_1" n="velocidad del primer producto en unidades de \(c\)" u="1"/>
</vars>
<effects>
<e>\(\pi^+\to\mu^+\nu\) (\(M=139.570\) MeV, \(m_\mu=105.658\) MeV, \(m_\nu\simeq0\)): \(p^*=29.792\) MeV/c, \(E_\mu=109.778\) MeV, \(T_\mu=4.1199\) MeV y \(\beta_\mu=0.2714\); todos los muones de un pión en reposo tienen la misma energía (desintegración «monocromática»).</e>
<e>\(K^+\to\mu^+\nu\): \(p^*=235.53\) MeV/c y \(T_\mu=152.49\) MeV; \(K^+\to\pi^+\pi^0\): \(p^*=205.14\) MeV/c; \(\Lambda\to p\pi^-\): \(p^*=100.58\) MeV/c y \(T_p=5.376\) MeV (el protón sale lento y el pión se lleva casi toda la energía cinética); \(Z^0\to e^+e^-\): \(p^*=45.594\) GeV, \(\beta=0.99999999994\).</e>
<e>Si las masas de los productos son iguales, cada uno lleva \(E=M/2\); si un producto no tiene masa, \(p^*=(M^2-m^2)/2M\).</e>
</effects>
<limits>
<l>Dimensiones: \(p^*\) por \(c\) es una energía. ✓</l>
<l>Requiere \(M>m_1+m_2\) (si no, no hay desintegración). En el sistema del laboratorio, las energías de los productos se obtienen con la transformación de Lorentz con el factor \(\gamma\) de la madre; la distribución angular depende del espín.</l>
</limits>
<explore sim="part-dos-cuerpos" title="Desintegración en dos cuerpos: momento, energía y velocidad de los productos"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(\pi^+\to\mu^+\nu\)): \(p^*=29.7921\) MeV/c, \(E_1=109.778\) MeV, \(T_1=4.11987\) MeV y \(\beta_1=0.271385\).</li>
<li>Con \(M\) en el eje (log–log): cerca del umbral \(M\to m_1+m_2\) la pendiente es grande (\(p^*\propto\sqrt{M-m_1-m_2}\)).</li>
</ul></div>
</deriv>

<deriv id="breit-wigner" title="La resonancia de Breit–Wigner y la anchura de una partícula inestable" tags="Partículas, Resonancias">
<goal>La forma de la curva de producción de una partícula inestable en función de la energía, su relación con la vida media y el valor de la sección eficaz en el pico.</goal>
<given>
<g>Estado inestable de masa \(M\) cuya probabilidad decae como \(e^{-\Gamma t}\) (constante de desintegración \(\Gamma/\hbar\)); unidades \(\hbar=c=1\).</g>
<g>Sección eficaz a partir de la unitaridad de onda parcial: \(\sigma=\dfrac\pi{k^2}\,g\,\dfrac{\Gamma_i\Gamma_f}{(E-M)^2+\Gamma^2/4}\), con \(g=\dfrac{2J+1}{(2s_1+1)(2s_2+1)}\).</g>
</given>
<step op="Evolución temporal de la amplitud (probabilidad \(|\psi|^2=e^{-\Gamma t}\))">
\[\psi(t)=\psi_0\,e^{-iMt-\Gamma t/2},\qquad\tau=\frac1\Gamma.\]
</step>
<step op="Amplitud de encontrar el estado con energía \(E\): transformada de Fourier">
\[a(E)=\int_0^\infty\psi(t)\,e^{iEt}\,\mathrm dt=\frac{i\,\psi_0}{E-M+i\Gamma/2}.\]
</step>
<step op="Densidad de probabilidad en energía: lorentziana, de anchura a mitad de altura \(\Gamma\)">
\[|a(E)|^2=\frac{|\psi_0|^2}{(E-M)^2+\Gamma^2/4}.\]
<why>Es el principio de incertidumbre tiempo–energía: \(\Delta E\,\tau\sim\hbar\). Una partícula de vida media corta tiene una masa «borrosa».</why>
</step>
<step op="Producción \(e^+e^-\to Z\to f\): \(k=E/2\) (haces sin masa), \(J=1\), espines \(\tfrac12\): \(g=\tfrac34\)">
\[\sigma(E)=\frac{3\pi}{E^2}\,\frac{\Gamma_{ee}\Gamma_f}{(E-M)^2+\Gamma^2/4}\,(\hbar c)^2.\]
</step>
<step op="Valor en el pico (\(E=M\))">
\[\sigma_0=\frac{12\pi}{M^2}\,\frac{\Gamma_{ee}\Gamma_f}{\Gamma^2}\,(\hbar c)^2.\]
</step>
<result name="Fórmula de Breit–Wigner">\[\sigma(E)=\frac{3\pi(\hbar c)^2}{E^2}\,\frac{\Gamma_{ee}\Gamma_f}{(E-M)^2+\Gamma^2/4},\qquad\tau=\frac\hbar\Gamma.\]</result>
<vars>
<v s="\sigma" n="sección eficaz" u="m^2"/>
<v s="E" n="energía en el centro de masa" u="J"/>
<v s="M" n="masa (energía en reposo) de la resonancia" u="J"/>
<v s="\Gamma" n="anchura total" u="J"/>
<v s="\Gamma_{ee},\,\Gamma_f" n="anchuras parciales de entrada y salida" u="J"/>
<v s="\tau" n="vida media" u="s"/>
<v s="\hbar" n="constante de Planck reducida" u="J s"/>
<v s="\hbar c" n="constante de conversión" u="J m"/>
</vars>
<effects>
<e>\(Z^0\) (\(M=91.1876\) GeV, \(\Gamma=2.4952\) GeV, \(\Gamma_{ee}=83.98\) MeV, \(\Gamma_\text{had}=1744.4\) MeV): \(\tau=\hbar/\Gamma=2.638\times10^{-25}\) s, \(\Gamma/M=2.74\%\) y \(\sigma_0=41.54\) nb a hadrones, el valor medido en LEP (41.54 nb). A \(E=M\pm\Gamma/2\) la sección eficaz cae a la mitad.</e>
<e>Resonancias hadrónicas: \(\Delta(1232)\) con \(\Gamma=117\) MeV: \(\tau=5.63\times10^{-24}\) s; \(\rho(775)\) con \(\Gamma=149\) MeV: \(4.42\times10^{-24}\) s, el tiempo que tarda la luz en recorrer ≈ 1.3 fm: vive lo mismo que dura la interacción fuerte.</e>
<e>Cuanto más estrecha es la resonancia, más alto es el pico: \(\sigma_0\propto1/\Gamma^2\) para \(\Gamma_{ee}\), \(\Gamma_f\) fijas; pero en la naturaleza \(\Gamma_i,\Gamma_f\le\Gamma\), de modo que \(\sigma_0\le12\pi(\hbar c)^2/M^2\) (límite de unitaridad).</e>
</effects>
<limits>
<l>Dimensiones: \(\Gamma_{ee}\Gamma_f/\Gamma^2\) es adimensional y \((\hbar c)^2/E^2\) es un área. ✓</l>
<l>La lorentziana es una buena descripción cerca del pico; lejos, la radiación en el estado inicial (e⁺e⁻ emiten fotones) y la interferencia con el fondo la deforman. La anchura puede depender de la energía (resonancias anchas como la \(\rho\)).</l>
</limits>
<explore sim="part-bw" title="Resonancia de Breit–Wigner: sección eficaz, pico y vida media"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (Z⁰ en el pico): \(\sigma=\sigma_0=41.5378\) nb, \(\tau=2.63791\times10^{-25}\) s y \(\Gamma/M=0.0273634\).</li>
<li>Con \(E\) en el eje (log–log): la curva es máxima en \(E=M\) y la pendiente local cambia de signo a ambos lados.</li>
</ul></div>
</deriv>

<deriv id="razon-R" title="La razón R y los tres colores de los quarks" tags="Partículas, Quarks">
<goal>Cuántos hadrones se producen en la aniquilación \(e^+e^-\) en comparación con pares de muones, y qué dice ese cociente sobre la carga y el número de colores de los quarks.</goal>
<given>
<g>Resultado de la electrodinámica cuántica al orden más bajo: \(\sigma(e^+e^-\to\mu^+\mu^-)=\dfrac{4\pi\alpha^2}{3s}(\hbar c)^2\) (partículas puntuales de carga \(\pm e\)).</g>
<g>Los quarks son puntuales con carga \(Q_fe\) (\(+\tfrac23\) para u, c, t; \(-\tfrac13\) para d, s, b) y cada sabor existe en \(N_c\) colores; los hadrones se forman con probabilidad 1 a partir de los quarks producidos.</g>
</given>
<step op="La sección eficaz es proporcional al cuadrado de la carga: para un par \(q\bar q\) de sabor \(f\) y un color dado">
\[\sigma(e^+e^-\to q_f\bar q_f)=Q_f^2\;\sigma(\mu^+\mu^-).\]
</step>
<step op="Sumar los \(N_c\) colores">
\[\sigma=N_cQ_f^2\,\sigma(\mu^+\mu^-).\]
</step>
<step op="Sumar los sabores cuyo umbral \(\sqrt s>2m_f\) está abierto">
\[R=\frac{\sigma(e^+e^-\to\text{hadrones})}{\sigma(e^+e^-\to\mu^+\mu^-)}=N_c\sum_fQ_f^2.\]
</step>
<step op="Valores para \(N_c=3\)">
\[R(u,d,s)=3\left(\tfrac49+\tfrac19+\tfrac19\right)=2,\quad R(+c)=\tfrac{10}3,\quad R(+b)=\tfrac{11}3.\]
</step>
<step op="Corrección de QCD por la radiación de gluones">
\[R=R_0\left(1+\frac{\alpha_s}\pi\right).\]
</step>
<result name="Razón R">\[R=N_c\sum_fQ_f^2\;\Big(1+\frac{\alpha_s}\pi\Big),\qquad\sigma(\mu\mu)=\frac{4\pi\alpha^2}{3s}.\]</result>
<vars>
<v s="R" n="razón hadrones/muones" u="1"/>
<v s="N_c" n="número de colores" u="1"/>
<v s="Q_f" n="carga del quark de sabor \(f\) en unidades de \(e\)" u="1"/>
<v s="\alpha" n="constante de estructura fina" u="1"/>
<v s="\alpha_s" n="constante de acoplamiento fuerte" u="1"/>
<v s="s" n="cuadrado de la energía en el centro de masa" u="J^2"/>
<v s="\sigma" n="sección eficaz" u="m^2"/>
<v s="\hbar c" n="constante de conversión" u="J m"/>
</vars>
<effects>
<e>\(\sigma(\mu\mu)=86.854\ \text{nb}/s[\text{GeV}^2]\): a \(\sqrt s=12\) GeV vale 0.6032 nb. Con \(N_c=3\) y \(\alpha_s=0.2\): \(R=2.127\) con u, d, s; \(3.545\) tras abrir el charm (\(\sqrt s>2.54\) GeV); \(3.900\) con el bottom (\(\sqrt s>8.36\) GeV). Las medidas dan ≈ 2.2, ≈ 3.6 y ≈ 3.9.</e>
<e>Sin colores (\(N_c=1\)) saldría \(R=\tfrac23\), \(\tfrac{10}9\) y \(\tfrac{11}9\), tres veces menor que lo observado: la medida de \(R\) fue una de las pruebas de que los quarks tienen tres colores. A \(\sqrt s=12\) GeV la sección eficaz a hadrones es \(2.35\) nb.</e>
</effects>
<limits>
<l>Dimensiones: \(R\) es adimensional; \(\sigma=4\pi\alpha^2(\hbar c)^2/3s\) es un área. ✓</l>
<l>Cerca de los umbrales hay resonancias (\(J/\psi\), \(\Upsilon\)) donde el cociente se dispara, y a \(\sqrt s\sim M_Z\) domina el intercambio del \(Z^0\); los quarks pesados se abren gradualmente, no con un escalón.</l>
</limits>
<explore sim="part-R" title="Razón R de la aniquilación e⁺e⁻: colores, sabores y sección eficaz a hadrones"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(\sqrt s=12\) GeV, \(N_c=3\), \(\alpha_s=0.2\)): \(\sigma(\mu\mu)=0.603156\) nb, \(n_f=5\), \(R_0=3.66667\), \(R=3.90009\) y \(\sigma(\text{hadrones})=2.35237\) nb.</li>
<li>Con \(\sqrt s\) en el eje: \(\sigma(\mu\mu)\propto1/s\) (pendiente −2) y \(R\) en escalones.</li>
</ul></div>
</deriv>

<deriv id="oscilacion-neutrinos" title="Oscilaciones de neutrinos" tags="Partículas, Neutrinos">
<goal>La probabilidad de que un neutrino producido con un sabor se detecte con otro después de recorrer una distancia \(L\).</goal>
<given>
<g>Los estados de sabor \(\nu_a,\nu_b\) son combinaciones de estados de masa definida \(\nu_1,\nu_2\): \(|\nu_a\rangle=\cos\theta|\nu_1\rangle+\sin\theta|\nu_2\rangle\) y \(|\nu_b\rangle=-\sin\theta|\nu_1\rangle+\cos\theta|\nu_2\rangle\).</g>
<g>Neutrino ultrarrelativista con la misma cantidad de movimiento \(p\) en ambos estados de masa; \(\hbar=c=1\) y \(L\simeq t\).</g>
</given>
<step op="Energía de cada estado de masa">
\[E_i=\sqrt{p^2+m_i^2}\simeq p+\frac{m_i^2}{2p},\qquad p\simeq E.\]
</step>
<step op="Evolución del estado inicial \(|\nu_a\rangle\): cada componente gana su fase">
\[|\nu_a(t)\rangle=\cos\theta\,e^{-iE_1t}|\nu_1\rangle+\sin\theta\,e^{-iE_2t}|\nu_2\rangle.\]
</step>
<step op="Amplitud de detectar \(\nu_b\)">
\[A(a\to b)=\langle\nu_b|\nu_a(t)\rangle=\sin\theta\cos\theta\left(e^{-iE_2t}-e^{-iE_1t}\right).\]
</step>
<step op="Módulo al cuadrado, con \(|e^{-i\phi_2}-e^{-i\phi_1}|^2=4\sin^2[(\phi_2-\phi_1)/2]\) y \(E_2-E_1=\Delta m^2/2E\)">
\[P(\nu_a\to\nu_b)=\sin^22\theta\,\sin^2\!\left(\frac{\Delta m^2L}{4E}\right).\]
</step>
<step op="Unidades prácticas (\(\Delta m^2\) en eV², \(L\) en km, \(E\) en GeV): \(1/(4\hbar c)\) en esas unidades">
\[\frac{\Delta m^2L}{4E}=1.26693\,\frac{\Delta m^2[\text{eV}^2]\,L[\text{km}]}{E[\text{GeV}]}.\]
</step>
<result name="Oscilación de dos sabores">\[P(\nu_a\to\nu_b)=\sin^22\theta\,\sin^2\!\Big(1.26693\,\frac{\Delta m^2[\text{eV}^2]\,L[\text{km}]}{E[\text{GeV}]}\Big).\]</result>
<vars>
<v s="P" n="probabilidad de transición" u="1"/>
<v s="\theta" n="ángulo de mezcla" u="rad"/>
<v s="\Delta m^2" n="diferencia de masas al cuadrado" u="J^2"/>
<v s="L" n="distancia recorrida" u="m"/>
<v s="E" n="energía del neutrino" u="J"/>
<v s="\hbar c" n="constante de conversión" u="J m"/>
</vars>
<effects>
<e>Neutrinos atmosféricos (\(\Delta m^2=2.5\times10^{-3}\ \text{eV}^2\), \(\sin^22\theta\simeq1\)): a \(L/E=500\) km/GeV la fase vale \(1.5837\) rad y \(P=0.99983\); el primer máximo está en \(L=495.9\ \text{km}\,(E/\text{GeV})\) y la longitud de oscilación es 991.9 km por GeV: los neutrinos que cruzan la Tierra (hasta 12 700 km) oscilan varias veces.</e>
<e>Neutrinos de reactor (\(\Delta m^2=7.5\times10^{-5}\ \text{eV}^2\), \(\sin^22\theta=0.85\), \(E=4\) MeV): a 180 km, \(P=0.698\) (se «pierde» el 70 % de los \(\bar\nu_e\) originales); \(L_\text{osc}=132.2\) km. Si \(\Delta m^2=0\) o \(\sin2\theta=0\) no hay oscilación: la observación de oscilaciones implica que los neutrinos tienen masa.</e>
</effects>
<limits>
<l>Dimensiones: \(\Delta m^2L/(4E\hbar c)\) es adimensional. ✓</l>
<l>Dos sabores en el vacío; en la materia (efecto MSW) la mezcla cambia y en el Sol domina; con tres sabores aparecen tres ángulos, una fase de violación de CP y un orden de masas aún sin determinar. La coherencia se pierde si los paquetes de onda se separan (distancias enormes).</l>
</limits>
<explore sim="part-neutrino" title="Oscilaciones de neutrinos de dos sabores"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(\sin^22\theta=1\), \(\Delta m^2=2.5\times10^{-3}\ \text{eV}^2\), 500 km, 1 GeV): \(P=0.999834\), fase \(1.58367\) rad, \(L_\text{osc}=991.87\) km y primer máximo en 495.94 km.</li>
<li>Con \(L\) en el eje (log–log): \(P\propto L^2\) para \(L\ll L_\text{osc}\) y oscila después.</li>
</ul></div>
</deriv>

<section>
