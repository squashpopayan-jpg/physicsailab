<template class="chapter-src" data-id="origenes-cuanticos" data-num="29" data-title="Los orígenes de la física cuántica" data-part="Parte VIII · Física cuántica" data-short="La ley de Planck del cuerpo negro, el efecto fotoeléctrico de Einstein, la dispersión Compton, el átomo de Bohr y la longitud de onda de De Broglie con la difracción de electrones">
<p class="lead">Entre 1900 y 1927 una serie de resultados que la física clásica no podía explicar (la radiación del cuerpo negro, la emisión de electrones por la luz, la dispersión de rayos X, los espectros atómicos y la difracción de electrones) llevó a cuantizar la energía, a asignar partículas a la luz y ondas a la materia. Cada fórmula de este capítulo se deduce con la matemática más sencilla posible a partir de una hipótesis cuántica explícita: \(E=h\nu\), \(p=h/\lambda\) y \(L=n\hbar\). Preparan la ecuación de Schrödinger del capítulo 30.</p>

<deriv id="planck-cuerpo-negro" title="La ley de Planck de la radiación del cuerpo negro" tags="Cuántica, Radiación">
<goal>La distribución espectral de la radiación en equilibrio con una cavidad a temperatura \(T\), y sus consecuencias (ley de Wien y de Stefan–Boltzmann).</goal>
<given>
<g>Modos estacionarios del campo electromagnético en una caja de volumen \(V\): el número con frecuencia entre \(\nu\) y \(\nu+\mathrm d\nu\) es \(2\cdot\dfrac{4\pi\nu^2\mathrm d\nu}{c^3}V\) (dos polarizaciones).</g>
<g>Hipótesis de Planck: la energía de un modo de frecuencia \(\nu\) solo toma valores \(nh\nu\) (\(n=0,1,2,\dots\)). Distribución de Boltzmann (capítulo 18).</g>
</given>
<step op="Energía media de un modo con la distribución de Boltzmann (serie geométrica; \(x=h\nu/kT\))">
\[\langle E\rangle=\frac{\sum_nnh\nu\,e^{-nx}}{\sum_ne^{-nx}}=\frac{h\nu}{e^{x}-1}.\]
<why>Clásicamente (energía continua) \(\langle E\rangle=kT\) para todo \(\nu\), lo que lleva a la catástrofe ultravioleta (densidad infinita); aquí \(\langle E\rangle\to kT\) solo para \(x\ll1\) y se anula exponencialmente para \(x\gg1\).</why>
</step>
<step op="Densidad de energía espectral">
\[u(\nu)\,\mathrm d\nu=\frac{8\pi\nu^2}{c^3}\langle E\rangle\,\mathrm d\nu=\frac{8\pi h\nu^3}{c^3}\frac{\mathrm d\nu}{e^{h\nu/kT}-1}.\]
</step>
<step op="Radiancia por unidad de longitud de onda (\(B_\nu=cu/4\pi\) y \(\nu=c/\lambda\))">
\[B_\lambda(T)=\frac{2hc^2}{\lambda^5}\,\frac1{e^{hc/\lambda kT}-1}.\]
</step>
<step op="Ley del desplazamiento de Wien: máximo de \(x^5/(e^x-1)\) con \(x=hc/\lambda kT\)">
\[x=5\left(1-e^{-x}\right)\ \Longrightarrow\ x=4.9651,\qquad\lambda_\text{máx}T=\frac{hc}{4.9651\,k}=2.8978\ \mathrm{mm\,K}.\]
</step>
<step op="Potencia total emitida (integral \(\int_0^\infty x^3/(e^x-1)\mathrm dx=\pi^4/15\))">
\[M=\sigma T^4,\qquad\sigma=\frac{2\pi^5k^4}{15h^3c^2}=5.6704\times10^{-8}\ \mathrm{W\,m^{-2}K^{-4}}.\]
</step>
<result name="Ley de Planck">\[B_\lambda=\frac{2hc^2}{\lambda^5}\frac1{e^{hc/\lambda kT}-1},\qquad\lambda_\text{máx}T=2.898\ \mathrm{mm\,K},\qquad M=\sigma T^4.\]</result>
<vars>
<v s="B_\lambda" n="radiancia espectral" u="W m^-3"/>
<v s="h" n="constante de Planck" u="J s"/>
<v s="c" n="velocidad de la luz" u="m s^-1"/>
<v s="\lambda" n="longitud de onda" u="m"/>
<v s="k" n="constante de Boltzmann" u="J K^-1"/>
<v s="T" n="temperatura" u="K"/>
<v s="\nu" n="frecuencia" u="Hz"/>
<v s="u" n="densidad de energía espectral" u="J m^-3 s"/>
<v s="x" n="parámetro \(h\nu/kT\)" u="1"/>
<v s="\sigma" n="constante de Stefan–Boltzmann" u="W m^-2 K^-4"/>
</vars>
<effects>
<e>El Sol (5772 K) tiene su máximo en 502.04 nm (fotones de 2.47 eV) con \(B_\lambda=2.624\times10^7\) W/(sr·m²·µm); a la mitad de esa longitud de onda (251 nm) la radiancia es 5.82×10⁶ y a tres veces (1506 nm), 3.63×10⁶. La exitancia total es \(6.294\times10^7\) W/m². Un cuerpo a 3000 K (lámpara incandescente) tiene el máximo en 966 nm, en el infrarrojo: solo una pequeña parte se emite como luz visible.</e>
<e>El cuerpo humano (310 K) tiene su pico en 9.35 µm y emite 524 W/m² (la cámara térmica); el fondo cósmico de microondas (2.725 K), en 1.063 mm. Duplicar \(T\) multiplica por 32 el pico (\(\propto T^5\)) y por 16 la potencia total, y acorta el máximo a la mitad.</e>
<e>La ley clásica de Rayleigh–Jeans (\(2ckT/\lambda^4\)) daría a 500 nm y 5772 K 7.65×10⁸ W/(sr·m²·µm), 29 veces más que Planck, y diverge para \(\lambda\to0\): la catástrofe ultravioleta que obligó a introducir \(h\).</e>
</effects>
<limits>
<l>Dimensiones: \([2hc^2/\lambda^5]=\mathrm{J\,s\,m^2s^{-2}\,m^{-5}}=\mathrm{W\,m^{-3}}\) (potencia por área y por longitud de onda, por estereorradián). ✓</l>
<l>Cuerpo negro ideal en equilibrio; los cuerpos reales tienen emisividad menor que 1 y dependiente de λ. La demostración de Planck (1900) era una hipótesis ad hoc; fue Einstein (1905, 1917) quien le dio sentido con los fotones y la emisión estimulada.</l>
</limits>
<explore sim="planck-bb" title="Cuerpo negro de Planck: radiancia espectral, Wien y comparación con Rayleigh–Jeans"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (5772 K, λ = λ<sub>máx</sub>): λ = 502.039 nm, \(x=4.96511\), \(B_\lambda=2.62396\times10^7\) W/(sr·m²·µm), cociente con Rayleigh–Jeans 0.0348858 y exitancia \(6.29386\times10^7\) W/m².</li>
<li>Seleccione λ/λ<sub>máx</sub> en el eje (log–log): a la izquierda \(B\) cae exponencialmente; a la derecha, con pendiente −4 (Rayleigh–Jeans).</li>
</ul></div>
</deriv>

<deriv id="efecto-fotoelectrico" title="El efecto fotoeléctrico de Einstein" tags="Cuántica, Luz">
<goal>La energía cinética máxima de los electrones que emite un metal iluminado, y el potencial de frenado.</goal>
<given>
<g>Hipótesis de Einstein (1905): la luz de frecuencia \(\nu\) se compone de cuantos de energía \(h\nu\), absorbidos de uno en uno por un electrón. Función de trabajo \(\phi\): la energía mínima para extraer un electrón.</g>
</given>
<step op="Conservación de la energía en un fotón absorbido por un electrón en la superficie">
\[h\nu=\phi+K_\max.\]
</step>
<step op="Potencial de frenado que detiene a los electrones más rápidos">
\[eV_0=K_\max\ \Longrightarrow\ V_0=\frac he\,\nu-\frac\phi e.\]
</step>
<step op="Frecuencia y longitud de onda umbral (\(K_\max=0\))">
\[\nu_0=\frac\phi h,\qquad\lambda_0=\frac{hc}\phi.\]
</step>
<step op="Velocidad máxima de los fotoelectrones">
\[v_\max=\sqrt{\frac{2K_\max}{m}}.\]
</step>
<result name="Ecuación de Einstein">\[K_\max=h\nu-\phi,\qquad V_0=\frac he\nu-\frac\phi e.\]</result>
<vars>
<v s="h" n="constante de Planck" u="J s"/>
<v s="\nu" n="frecuencia de la luz" u="Hz"/>
<v s="\phi" n="función de trabajo" u="J"/>
<v s="K_\max" n="energía cinética máxima" u="J"/>
<v s="V_0" n="potencial de frenado" u="V"/>
<v s="e" n="carga del electrón" u="C"/>
<v s="\lambda_0" n="longitud de onda umbral" u="m"/>
<v s="m" n="masa del electrón" u="kg"/>
<v s="c" n="velocidad de la luz" u="m s^-1"/>
</vars>
<effects>
<e>Sodio (\(\phi=2.28\) eV): umbral 543.79 nm. Con luz de 400 nm (3.0996 eV) \(K_\max=0.8196\) eV y \(v_\max=5.37\times10^5\) m/s; con 500 nm, 0.1997 eV; con 300 nm, 1.853 eV (8.07×10⁵ m/s). Una luz más intensa de 600 nm no arranca ningún electrón, por mucha intensidad que tenga: la clave que la teoría ondulatoria no explicaba.</e>
<e>Cinc (\(\phi=4.3\) eV, umbral 288.3 nm): con 400 nm no hay emisión; con 250 nm \(K_\max=0.659\) eV. Platino (5.65 eV) con 200 nm: 0.549 eV. Cesio (2.1 eV) con luz verde de 550 nm: 0.154 eV. La pendiente de \(V_0(\nu)\) es \(h/e=4.1357\times10^{-15}\) V·s, independiente del metal: Millikan (1916) midió así \(h\) con 0.5 %.</e>
<e>La intensidad solo cambia el número de electrones (la corriente), no su energía; por debajo de \(\nu_0\) no hay corriente ni con retraso de tiempo apreciable (<10⁻⁹ s).</e>
</effects>
<limits>
<l>Dimensiones: \(h\nu\), \(\phi\) y \(K\) son energías. ✓</l>
<l>El valor de \(\phi\) depende de la superficie (óxidos, impurezas); a temperatura finita el máximo de energía se ensancha ligeramente (distribución de Fermi, capítulo 18). Para intensidades altísimas puede haber absorción de varios fotones (multifotónica).</l>
</limits>
<explore sim="fotoelectrico" title="Efecto fotoeléctrico: energía de los fotoelectrones y umbral"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (Na, 400 nm): \(E_\gamma=3.09960\) eV, \(K_\max=0.819605\) eV, \(\lambda_0=543.790\) nm y \(v_\max=5.36943\times10^5\) m/s.</li>
<li>Seleccione λ en el eje: \(K_\max\) cae linealmente en \(1/\lambda\) y se anula en el umbral λ₀; por encima de λ₀ (valores negativos) no hay emisión.</li>
</ul></div>
</deriv>

<deriv id="compton" title="La dispersión Compton" tags="Cuántica, Rayos X">
<goal>El cambio de longitud de onda de un fotón dispersado por un electrón libre en reposo, en función del ángulo.</goal>
<given>
<g>El fotón se comporta como una partícula con energía \(E=pc=hc/\lambda\) y momento \(p=h/\lambda\). Conservación de la energía y del momento relativistas (capítulo 27).</g>
</given>
<step op="Conservación (fotón \(E,\mathbf p\) → \(E',\mathbf p'\) a ángulo \(\theta\); electrón inicialmente en reposo)">
\[E+mc^2=E'+E_e,\qquad\mathbf p=\mathbf p'+\mathbf p_e.\]
</step>
<step op="Momento del electrón al cuadrado">
\[p_e^2c^2=E^2+E'^2-2EE'\cos\theta.\]
</step>
<step op="Relación relativista del electrón \(E_e^2=p_e^2c^2+m^2c^4\) con \(E_e=E-E'+mc^2\)">
\[(E-E'+mc^2)^2=E^2+E'^2-2EE'\cos\theta+m^2c^4\ \Longrightarrow\ EE'(1-\cos\theta)=mc^2(E-E').\]
</step>
<step op="Pasar a longitudes de onda (\(E=hc/\lambda\))">
\[\lambda'-\lambda=\frac h{mc}\,(1-\cos\theta)=\lambda_C(1-\cos\theta),\qquad\lambda_C=2.4263\ \mathrm{pm}.\]
</step>
<result name="Fórmula de Compton">\[\Delta\lambda=\frac h{m_ec}(1-\cos\theta).\]</result>
<vars>
<v s="E,\,E'" n="energías del fotón incidente y dispersado" u="J"/>
<v s="\mathbf p,\,\mathbf p'" n="momentos del fotón" u="kg m s^-1"/>
<v s="\theta" n="ángulo de dispersión" u="rad"/>
<v s="m" n="masa del electrón" u="kg"/>
<v s="c" n="velocidad de la luz" u="m s^-1"/>
<v s="h" n="constante de Planck" u="J s"/>
<v s="\lambda,\,\lambda'" n="longitudes de onda inicial y final" u="m"/>
<v s="\lambda_C" n="longitud de onda de Compton" u="m"/>
<v s="p_e" n="momento del electrón de retroceso" u="kg m s^-1"/>
</vars>
<effects>
<e>Rayos X del molibdeno (\(\lambda=71.07\) pm, 17.445 keV) a 90°: \(\Delta\lambda=2.4263\) pm (\(\lambda'=73.496\) pm, 16.869 keV) y el electrón se lleva 0.576 keV. A 180° (retrodispersión), el corrimiento es máximo, \(2\lambda_C=4.8526\) pm y el electrón 1.115 keV; a 45°, 0.7106 pm; a 0°, ninguno.</e>
<e>\(\Delta\lambda\) es independiente de \(\lambda\) incidente: con luz visible (500 nm) el cambio es de 5×10⁻⁶ relativo y nadie lo ve; con rayos gamma de 100 MeV (\(\lambda=0.0124\) pm), un fotón dispersado a 90° sale con \(\lambda'=2.4387\) pm, es decir, solo 508 keV, casi independientemente de su energía inicial. Con rayos X de 2 pm (620 keV), el electrón recibe 340 keV a 90°.</e>
<e>Compton (1923) descubrió la línea desplazada en el espectro de rayos X dispersados por grafito, evidencia directa de que el fotón tiene momento. La línea sin desplazar se debe a la dispersión por el átomo completo (Δλ ~ \(h/Mc\) ≈ 0).</e>
</effects>
<limits>
<l>Dimensiones: \(h/mc\) es una longitud. ✓</l>
<l>Electrón libre y en reposo (válido para rayos X sobre electrones débilmente ligados); el movimiento de los electrones atómicos ensancha la línea desplazada (perfil Compton). A bajas energías se tiene la dispersión de Thomson (sin cambio de \(\lambda\)); para altas energías hay que usar la fórmula de Klein–Nishina (sección eficaz).</l>
</limits>
<explore sim="compton" title="Dispersión Compton: corrimiento de longitud de onda y energía del electrón"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (71.07 pm, 90°): \(\Delta\lambda=2.42631\) pm, \(\lambda'=73.4963\) pm, \(K_e=0.575918\) keV y \(E=17.4454\) keV.</li>
<li>Seleccione θ en el eje: \(\Delta\lambda\) crece como \(1-\cos\theta\), de 0 a 4.85 pm.</li>
</ul></div>
</deriv>

<deriv id="bohr" title="El átomo de Bohr y las series espectrales del hidrógeno" tags="Cuántica, Espectros">
<goal>Los radios y energías de las órbitas del átomo de hidrógeno (y de iones hidrogenoides) y las longitudes de onda de las líneas espectrales.</goal>
<given>
<g>Órbita circular bajo la fuerza de Coulomb (\(m v^2/r=Ze^2/4\pi\varepsilon_0r^2\)). Postulado de Bohr: \(L=mvr=n\hbar\). Emisión de un fotón en la transición: \(h\nu=E_i-E_f\).</g>
</given>
<step op="Radio de las órbitas permitidas">
\[r_n=\frac{4\pi\varepsilon_0\hbar^2}{me^2}\frac{n^2}Z=\frac{n^2}Za_0,\qquad a_0=52.918\ \mathrm{pm}.\]
</step>
<step op="Energía total \(E=\tfrac12mv^2-\dfrac{Ze^2}{4\pi\varepsilon_0r}=-\dfrac{Ze^2}{8\pi\varepsilon_0r}\)">
\[E_n=-\frac{mZ^2e^4}{2(4\pi\varepsilon_0)^2\hbar^2}\frac1{n^2}=-13.6057\ \mathrm{eV}\ \frac{Z^2}{n^2}.\]
</step>
<step op="Velocidad orbital">
\[v_n=\frac{Ze^2}{4\pi\varepsilon_0\hbar}\frac1n=\frac{Z\alpha c}n.\]
</step>
<step op="Longitud de onda de la línea (fórmula de Rydberg) con la masa reducida del núcleo de masa \(M\)">
\[\frac1\lambda=R_M\,Z^2\left(\frac1{n_f^2}-\frac1{n_i^2}\right),\qquad R_M=\frac{R_\infty}{1+m_e/M},\quad R_\infty=\frac{m_ee^4}{8\varepsilon_0^2h^3c}.\]
</step>
<result name="Átomo de Bohr">\[r_n=\frac{n^2a_0}Z,\qquad E_n=-\frac{13.6057\,Z^2}{n^2}\,\mathrm{eV},\qquad\frac1\lambda=R_MZ^2\left(\frac1{n_f^2}-\frac1{n_i^2}\right).\]</result>
<vars>
<v s="r_n" n="radio de la órbita" u="m"/>
<v s="a_0" n="radio de Bohr" u="m"/>
<v s="E_n" n="energía del nivel" u="J"/>
<v s="n" n="número cuántico principal" u="1"/>
<v s="Z" n="número atómico" u="1"/>
<v s="v_n" n="velocidad orbital" u="m s^-1"/>
<v s="\alpha" n="constante de estructura fina" u="1"/>
<v s="\lambda" n="longitud de onda de la línea" u="m"/>
<v s="R_M" n="constante de Rydberg con masa reducida" u="m^-1"/>
<v s="R_\infty" n="constante de Rydberg" u="m^-1"/>
<v s="e" n="carga elemental" u="C"/>
<v s="m_e" n="masa del electrón" u="kg"/>
<v s="\hbar" n="constante de Planck reducida" u="J s"/>
<v s="\varepsilon_0" n="permitividad del vacío" u="F m^-1"/>
</vars>
<effects>
<e>Hidrógeno (núcleo de 1.00728 u): la línea Hα (3 → 2) en 656.470 nm (vacío; 656.28 nm en el aire), Hβ (4 → 2) en 486.274 nm, Lα (2 → 1) en 121.568 nm y Pα (4 → 3) en 1875.63 nm. El límite de la serie de Balmer está en 364.71 nm (\(4/R_H\); con \(n_i=102\), 364.85 nm). Los radios de las órbitas son 52.95, 211.79 y 476.52 pm (\(n=1,2,3\)) con energías −13.598, −3.3996 y −1.5109 eV; el electrón se mueve a 2187.7 km/s en \(n=1\) (0.73 % de \(c\)).</e>
<e>La masa reducida da el corrimiento isotópico: el deuterio (2.01355 u) emite Hα en 656.291 nm, 0.179 nm menos que el hidrógeno; así descubrió Urey el deuterio (1932). El ion He⁺ (\(Z=2\)) tiene la línea 4 → 3 en 468.716 nm (observada en las estrellas como línea He II); sus niveles son \(Z^2=4\) veces más profundos que los del H: \(E_1=-54.4\) eV.</e>
<e>El radio de Bohr es la escala atómica (0.53 Å) y la energía de ionización del hidrógeno, 13.6 eV. La velocidad \(\alpha c\) del electrón justifica el tratamiento no relativista del átomo, y \(\alpha^2\) es el tamaño de las correcciones de estructura fina.</e>
</effects>
<limits>
<l>Dimensiones: \(R_\infty\) en m⁻¹; \(E_n\) en J. ✓</l>
<l>Modelo semiclásico: reproduce las energías del hidrógeno (resultado que coincide con el de la mecánica cuántica), pero no el momento angular real (\(\ell=n-1,\dots,0\) y no \(n\)), la estructura fina ni los átomos con varios electrones. La deducción rigurosa se da con la ecuación de Schrödinger en el capítulo 31.</l>
</limits>
<explore sim="bohr" title="Átomo de Bohr: longitudes de onda de las series, radios y energías"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (H, \(n_f=2\), línea α): λ = 656.470 nm, 1.88865 eV, \(r_2=211.786\) pm, \(E_2=-3.39957\) eV y 1093.85 km/s.</li>
<li>Seleccione \(n_f\) en el eje: con \(n_f=1\) se obtiene la serie de Lyman (ultravioleta), con 3 la de Paschen (infrarroja); con el salto grande se aproxima al límite de la serie.</li>
</ul></div>
</deriv>

<deriv id="de-broglie" title="La longitud de onda de De Broglie y la difracción de electrones" tags="Cuántica, Ondas de materia">
<goal>La longitud de onda asociada a una partícula de energía cinética \(T\) y masa \(m\), y el tamaño del átomo a partir de la incertidumbre.</goal>
<given>
<g>Hipótesis de De Broglie (1924): una partícula con cantidad de movimiento \(p\) se comporta como una onda de longitud \(\lambda=h/p\). Relación relativista \(pc=\sqrt{T(T+2mc^2)}\) (capítulo 27).</g>
</given>
<step op="Longitud de onda con la energía cinética">
\[\lambda=\frac hp=\frac{hc}{\sqrt{T\,(T+2mc^2)}}\ \xrightarrow{T\ll mc^2}\ \frac h{\sqrt{2mT}}.\]
</step>
<step op="Estados estacionarios del átomo: la onda debe cerrarse sobre la órbita, \(2\pi r=n\lambda\)">
\[2\pi r=n\frac h{mv}\ \Longrightarrow\ mvr=n\hbar\qquad(\text{postulado de Bohr}).\]
</step>
<step op="Difracción: electrones que inciden sobre una red cristalina (separación \(d\)) se refuerzan en la dirección \(\varphi\) con">
\[d\sin\varphi=n\lambda.\]
</step>
<step op="Principio de incertidumbre y tamaño del átomo: confinamiento en un tamaño \(a\) obliga a \(\Delta p\gtrsim\hbar/a\); la energía total mínima es">
\[E(a)=\frac{\hbar^2}{2ma^2}-\frac{e^2}{4\pi\varepsilon_0a},\qquad\frac{\mathrm dE}{\mathrm da}=0\ \Longrightarrow\ a=\frac{4\pi\varepsilon_0\hbar^2}{me^2}=a_0,\quad E=-13.6057\ \mathrm{eV}.\]
</step>
<result name="De Broglie">\[\lambda=\frac hp=\frac{hc}{\sqrt{T(T+2mc^2)}},\qquad d\sin\varphi=n\lambda.\]</result>
<vars>
<v s="\lambda" n="longitud de onda de De Broglie" u="m"/>
<v s="h" n="constante de Planck" u="J s"/>
<v s="p" n="cantidad de movimiento" u="kg m s^-1"/>
<v s="T" n="energía cinética" u="J"/>
<v s="m" n="masa de la partícula" u="kg"/>
<v s="c" n="velocidad de la luz" u="m s^-1"/>
<v s="d" n="separación de la red" u="m"/>
<v s="\varphi" n="ángulo de difracción" u="rad"/>
<v s="a" n="tamaño de confinamiento" u="m"/>
<v s="\hbar" n="constante de Planck reducida" u="J s"/>
<v s="e" n="carga elemental" u="C"/>
<v s="\varepsilon_0" n="permitividad del vacío" u="F m^-1"/>
</vars>
<effects>
<e>Electrones de 54 eV (Davisson y Germer, 1927): \(\lambda=166.89\) pm. Sobre un cristal de níquel (\(d=0.215\) nm) reforzaron la reflexión a 50°, donde \(d\sin50^\circ=164.7\) pm: coincidencia al 1 %. Con 100 eV, 122.64 pm; con 100 keV (microscopio electrónico), 3.701 pm (la fórmula no relativista daría 3.878 pm, 4.8 % más); con 1 MeV, 0.872 pm.</e>
<e>Neutrones térmicos (0.025 eV): 180.9 pm, comparable con el espaciado interatómico, la base de la difracción de neutrones. Átomos de helio (0.04 eV): 71.8 pm y moléculas de C₆₀ de 1 eV, solo 1.07 pm; la interferencia se ha observado con moléculas de miles de átomos. Una pelota de tenis de 60 g a 30 m/s tendría λ = 3.7×10⁻³⁴ m: sin efectos cuánticos observables.</e>
<e>La minimización de \(E(a)\) da el tamaño y la energía del hidrógeno con solo la relación de incertidumbre: \(a=52.918\) pm y \(E=-13.6057\) eV, exactamente el estado fundamental de Bohr y de Schrödinger. La estabilidad del átomo y su tamaño son consecuencia de la incertidumbre.</e>
</effects>
<limits>
<l>Dimensiones: \(hc/\sqrt{T(T+2mc^2)}\) es una longitud. ✓</l>
