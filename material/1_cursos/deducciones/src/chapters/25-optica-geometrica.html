<template class="chapter-src" data-id="optica-geometrica" data-num="25" data-title="Óptica geométrica" data-part="Parte VI · Óptica" data-short="La ley de Snell a partir del principio de Fermat, la ecuación de las lentes delgadas, el prisma y su desviación mínima, el ángulo del arcoíris y la apertura numérica de una fibra óptica">
<p class="lead">Cuando los objetos son mucho mayores que la longitud de onda, la luz se propaga en rayos. Un solo principio, el de Fermat (la luz sigue el camino de tiempo estacionario), da la reflexión y la refracción; con la aproximación paraxial se deduce la ecuación de las lentes y con ella los instrumentos ópticos; y las mismas leyes explican el prisma, el arcoíris y las fibras ópticas. La óptica ondulatoria (capítulo 26) establecerá hasta dónde vale esta aproximación.</p>

<deriv id="fermat-snell" title="El principio de Fermat y la ley de Snell" tags="Óptica, Fermat">
<goal>La relación entre los ángulos de incidencia y refracción en una interfaz, y los ángulos crítico y de Brewster.</goal>
<given>
<g>Principio de Fermat: entre dos puntos la luz recorre el camino de tiempo mínimo (estacionario). En un medio de índice \(n\) la velocidad es \(v=c/n\).</g>
</given>
<step op="Tiempo de viaje de \(A\) (a altura \(a\) sobre la interfaz) a \(B\) (a profundidad \(b\)), con separación horizontal \(d\) y punto de cruce en \(x\)">
\[t(x)=\frac{\sqrt{a^2+x^2}}{v_1}+\frac{\sqrt{b^2+(d-x)^2}}{v_2}.\]
</step>
<step op="Condición de tiempo estacionario">
\[\frac{\mathrm dt}{\mathrm dx}=\frac1{v_1}\frac x{\sqrt{a^2+x^2}}-\frac1{v_2}\frac{d-x}{\sqrt{b^2+(d-x)^2}}=0\ \Longrightarrow\ \frac{\sin\theta_1}{v_1}=\frac{\sin\theta_2}{v_2}.\]
</step>
<step op="Con \(v=c/n\): ley de Snell">
\[n_1\sin\theta_1=n_2\sin\theta_2.\]
</step>
<step op="Ángulo crítico (de \(n_2>n_1\) hacia \(n_1\)): \(\theta_1=90^\circ\) en el medio ligero">
\[\sin\theta_c=\frac{n_1}{n_2}.\]
</step>
<step op="Ángulo de Brewster: la reflexión de la polarización paralela al plano se anula cuando los rayos reflejado y refractado son perpendiculares">
\[\theta_1+\theta_2=90^\circ\ \Longrightarrow\ \tan\theta_B=\frac{n_2}{n_1}.\]
<why>El campo en el medio 2 oscila en la dirección del rayo refractado; un dipolo no radia en la dirección de su eje, de modo que no hay luz reflejada si esa dirección coincide con la del rayo reflejado.</why>
</step>
<result name="Ley de Snell">\[n_1\sin\theta_1=n_2\sin\theta_2,\qquad\sin\theta_c=\frac{n_1}{n_2},\qquad\tan\theta_B=\frac{n_2}{n_1}.\]</result>
<vars>
<v s="n_1,\,n_2" n="índices de refracción" u="1"/>
<v s="\theta_1,\,\theta_2" n="ángulos de incidencia y refracción" u="rad"/>
<v s="v" n="velocidad de la luz en el medio" u="m s^-1"/>
<v s="t" n="tiempo de viaje" u="s"/>
<v s="a,\,b,\,d,\,x" n="distancias geométricas" u="m"/>
<v s="\theta_c" n="ángulo crítico" u="rad"/>
<v s="\theta_B" n="ángulo de Brewster" u="rad"/>
<v s="c" n="velocidad de la luz en el vacío" u="m s^-1"/>
</vars>
<effects>
<e>Aire–vidrio (\(n_2=1.5\)): un rayo a 30° se refracta a 19.47° (desviación 10.53°) y a 60°, a 35.26°. El ángulo crítico del vidrio hacia el aire es 41.81° y el de Brewster 56.31°. Para ángulos pequeños, \(\theta_2\simeq\theta_1/n_2\) (0.1° → 0.0667°).</e>
<e>Agua (1.33), 45°: 32.12°; crítico 48.75° y Brewster 53.06°. Diamante (2.42), 45°: 16.99°; el crítico es de solo 24.41°, lo que atrapa la luz dentro del diamante y explica su brillo. Entre agua (1.33) y vidrio (1.5) a 30°: 26.32°.</e>
<e>La refracción dobla el rayo hacia la normal en el medio denso; a mayor contraste de índices, mayor desviación: para una incidencia de 45° es 12.9° con agua (1.33), 16.9° con vidrio (1.5) y 28.0° con diamante (2.42).</e>
</effects>
<limits>
<l>Dimensiones: \(\sin\theta\) y \(n\) son adimensionales; \(t(x)\) es un tiempo. ✓</l>
<l>Medios homogéneos e isótropos con interfaces lisas mayores que \(\lambda\); en medios con \(n\) variable los rayos se curvan (espejismos, fibras de índice gradual). El tiempo es mínimo, máximo o estacionario según la geometría (en un espejo elíptico, constante).</l>
</limits>
<explore sim="snell" title="Refracción de Snell: ángulo refractado, ángulo crítico y de Brewster"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (aire–vidrio 1.5, 30°): \(\theta_2=19.4712^\circ\), \(\theta_c=41.8103^\circ\), \(\theta_B=56.3099^\circ\) y desviación 10.5288°.</li>
<li>Seleccione θ₁ en el eje: para ángulos pequeños \(\theta_2\) crece con pendiente 1, y luego más deprisa cerca de 90° (máximo θ₂ = θ_c).</li>
</ul></div>
</deriv>

<deriv id="lente-delgada" title="La ecuación de la lente delgada y la fórmula del fabricante" tags="Óptica, Lentes">
<goal>La distancia focal de una lente de caras esféricas y la posición y aumento de la imagen.</goal>
<given>
<g>Ley de Snell en el límite paraxial (ángulos pequeños, \(\sin\theta\simeq\theta\)). Convención: distancias positivas hacia donde viaja la luz, \(R>0\) si el centro está a la derecha.</g>
</given>
<step op="Refracción en una superficie esférica de radio \(R\): un rayo a altura \(h\) del eje; \(\alpha=h/s\), \(\beta=h/s'\), \(\varphi=h/R\)">
\[\theta_1=\alpha+\varphi,\quad\theta_2=\varphi-\beta,\quad n_1\theta_1=n_2\theta_2\ \Longrightarrow\ \frac{n_1}s+\frac{n_2}{s'}=\frac{n_2-n_1}R.\]
</step>
<step op="Dos superficies cercanas (lente delgada, vidrio \(n\) en aire) con la imagen de la primera como objeto de la segunda">
\[\frac1s+\frac1{s'}=(n-1)\left(\frac1{R_1}-\frac1{R_2}\right)\equiv\frac1f.\]
</step>
<step op="Lente biconvexa (\(R_1>0\), \(R_2<0\)): usando radios positivos">
\[\frac1f=(n-1)\left(\frac1{R_1}+\frac1{|R_2|}\right),\qquad s'=\frac{sf}{s-f},\qquad M=-\frac{s'}s.\]
</step>
<step op="Aumento lateral por semejanza de triángulos (rayo por el centro)">
\[M=\frac{h'}{h}=-\frac{s'}s=\frac f{f-s}.\]
</step>
<result name="Lente delgada">\[\frac1f=(n-1)\left(\frac1{R_1}+\frac1{R_2}\right),\qquad\frac1s+\frac1{s'}=\frac1f,\qquad M=-\frac{s'}s.\]</result>
<vars>
<v s="f" n="distancia focal" u="m"/>
<v s="n" n="índice de refracción del vidrio" u="1"/>
<v s="R_1,\,R_2" n="radios de curvatura" u="m"/>
<v s="s" n="distancia del objeto" u="m"/>
<v s="s'" n="distancia de la imagen" u="m"/>
<v s="M" n="aumento lateral" u="1"/>
<v s="h" n="altura del rayo" u="m"/>
<v s="\alpha,\,\beta,\,\varphi" n="ángulos paraxiales" u="rad"/>
</vars>
<effects>
<e>Lente biconvexa de vidrio (\(n=1.5\), \(R_1=R_2=10\) cm): \(f=10\) cm (10 dioptrías). Objeto a 30 cm: imagen real invertida a 15 cm con \(M=-0.5\); a 15 cm: imagen a 30 cm, \(M=-2\); a 10 cm (en el foco), la imagen se va al infinito; a 5 cm, imagen virtual a −10 cm con \(M=+2\): es la lupa.</e>
<e>Con \(n=1.7\), \(f=7.143\) cm (14 D) y la imagen del objeto a 30 cm queda a 9.375 cm; con \(R_1=5\) cm, \(f=6.667\) cm (15 D). Un objeto lejano (100 cm) forma su imagen casi en el foco (11.11 cm).</e>
<e>Un microscopio compuesto con objetivo de 0.5 cm, ocular de 2.5 cm y tubo de 16 cm aumenta \(M=-(L/f_o)(25\ \mathrm{cm}/f_e)=-320\): cada lente sigue la misma ecuación y los aumentos se multiplican.</e>
</effects>
<limits>
<l>Dimensiones: \([(n-1)/R]=\mathrm{m^{-1}}\) y las dioptrías se miden en \(\mathrm{m^{-1}}\). ✓</l>
<l>Aproximación paraxial y lente delgada; los rayos más alejados del eje producen aberración esférica, y la dependencia de \(n\) con \(\lambda\) produce aberración cromática (el mismo vidrio tiene \(f\) distinta para cada color). Las lentes gruesas necesitan los planos principales.</l>
</limits>
<explore sim="lente" title="Lente delgada: distancia focal, posición de la imagen y aumento"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(n=1.5\), 10 cm y 10 cm, objeto a 30 cm): \(f=10\) cm, \(s'=15\) cm, \(M=-0.5\) y 10 dioptrías.</li>
<li>Seleccione \(s\) en el eje (log–log): la imagen diverge en \(s=f=10\) cm; para \(s\gg f\), \(s'\to f\).</li>
</ul></div>
</deriv>

<deriv id="prisma" title="El prisma: desviación mínima y dispersión" tags="Óptica, Prismas">
<goal>La desviación de un rayo por un prisma de ángulo \(A\) e índice \(n\), la condición de desviación mínima y la separación de colores.</goal>
<given>
<g>Ley de Snell en las dos caras. Geometría del prisma: los ángulos internos cumplen \(r_1+r_2=A\).</g>
</given>
<step op="Desviación total">
\[\delta=(\theta_1-r_1)+(\theta_2-r_2)=\theta_1+\theta_2-A.\]
</step>
<step op="Mínimo: \(\mathrm d\delta/\mathrm d\theta_1=0\) se da por simetría con \(\theta_1=\theta_2\), \(r_1=r_2=A/2\)">
\[\theta_1=\frac{A+\delta_\min}2,\qquad\sin\theta_1=n\sin\frac A2.\]
</step>
<step op="Índice de refracción a partir de la desviación mínima">
\[n=\frac{\sin\frac{A+\delta_\min}2}{\sin\frac A2},\qquad\delta_\min=2\arcsin\!\left(n\sin\frac A2\right)-A.\]
</step>
<step op="Dispersión angular: derivar \(\sin\frac{A+\delta}2=n\sin\frac A2\) respecto de \(n\)">
\[\tfrac12\cos\frac{A+\delta}2\,\mathrm d\delta=\sin\frac A2\,\mathrm dn\ \Longrightarrow\ \frac{\mathrm d\delta}{\mathrm dn}=\frac{2\sin(A/2)}{\cos\frac{A+\delta}2}.\]
</step>
<result name="Prisma">\[n=\frac{\sin\frac{A+\delta_\min}2}{\sin\frac A2},\qquad\frac{\mathrm d\delta}{\mathrm dn}=\frac{2\sin(A/2)}{\cos\frac{A+\delta}2}.\]</result>
<vars>
<v s="A" n="ángulo del prisma" u="rad"/>
<v s="\delta" n="desviación" u="rad"/>
<v s="\delta_\min" n="desviación mínima" u="rad"/>
<v s="n" n="índice de refracción" u="1"/>
<v s="\theta_1,\,\theta_2" n="ángulos de incidencia y de salida" u="rad"/>
<v s="r_1,\,r_2" n="ángulos internos" u="rad"/>
</vars>
<effects>
<e>Prisma de 60° de vidrio (\(n=1.5\)): \(\delta_\min=37.18^\circ\) con incidencia de 48.59°; \(\mathrm d\delta/\mathrm dn=86.62^\circ\) por unidad de índice, de modo que la diferencia crown entre rojo y azul (\(\Delta n=0.008\)) separa los colores 41.6′ (0.69°). Con \(n=1.7\) (flint) la desviación sube a 56.42° y la dispersión a 108.8°/unidad.</e>
<e>Para \(A=30^\circ\) y \(n=1.5\), \(\delta_\min=15.69^\circ\); el prisma delgado desvía \((n-1)A=15^\circ\). Un prisma de agua (\(n=1.33\), 60°): 23.36°. Cerca del límite \(n\sin(A/2)\to1\) (para \(n=1.9\), \(A=60^\circ\)) la desviación crece mucho (83.6°) y la dispersión también (183°/unidad).</e>
<e>El método de la desviación mínima fue el usado para medir índices de refracción con exactitud de 10⁻⁵ en los espectrómetros clásicos; el prisma separa los colores por la dependencia \(n(\lambda)\) (en vidrio, \(n\) es mayor para el azul).</e>
</effects>
<limits>
<l>Dimensiones: los ángulos y \(n\) son adimensionales; \(\mathrm d\delta/\mathrm dn\) es un ángulo por unidad de índice. ✓</l>
<l>Rayo en el plano de la sección principal y prisma sin pérdidas; si \(n\sin(A/2)>1\) el rayo sufre reflexión total interna y no sale por la segunda cara. La resolución de un espectrómetro de prisma viene dada por la teoría ondulatoria (capítulo 26).</l>
</limits>
<explore sim="prisma" title="Prisma: desviación mínima, ángulo de incidencia y dispersión"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(A=60^\circ\), \(n=1.5\)): \(\delta_\min=37.1808^\circ\), \(\theta_1=48.5904^\circ\), \(\mathrm d\delta/\mathrm dn=86.6231^\circ\) y separación 41.5791′.</li>
<li>Seleccione \(n\) en el eje: \(\delta_\min\) crece y se acelera cuando \(n\sin(A/2)\to1\).</li>
</ul></div>
</deriv>

<deriv id="arcoiris" title="El arcoíris: el ángulo de desviación mínima en una gota" tags="Óptica, Atmósfera">
<goal>El ángulo con que se ven los arcos primario y secundario del arcoíris y su dependencia del color.</goal>
<given>
<g>Un rayo entra en una gota esférica con ángulo \(\theta_i\), se refracta (\(\sin\theta_i=n\sin\theta_t\)), se refleja \(k\) veces dentro y sale; cada refracción desvía \(\theta_i-\theta_t\) y cada reflexión interna \(180^\circ-2\theta_t\).</g>
</given>
<step op="Desviación total de un rayo con \(k\) reflexiones internas">
\[D=2(\theta_i-\theta_t)+k\,(180^\circ-2\theta_t)=k\,180^\circ+2\theta_i-2(k+1)\theta_t.\]
</step>
<step op="Mínimo de \(D\) (los rayos se acumulan cerca del mínimo): \(\mathrm dD/\mathrm d\theta_i=0\)">
\[\frac{\mathrm d\theta_t}{\mathrm d\theta_i}=\frac1{k+1},\qquad\cos\theta_i=n\cos\theta_t\,\frac{\mathrm d\theta_t}{\mathrm d\theta_i}\ \Longrightarrow\ (k+1)\cos\theta_i=n\cos\theta_t.\]
</step>
<step op="Eliminar \(\theta_t\) con Snell">
\[(k+1)^2\cos^2\theta_i=n^2-\sin^2\theta_i\ \Longrightarrow\ \cos^2\theta_i=\frac{n^2-1}{k(k+2)}.\]
</step>
<step op="Radio angular del arco (respecto del punto antisolar)">
\[\text{primario }(k=1):\ 180^\circ-D_\min;\qquad\text{secundario }(k=2):\ D_\min-180^\circ.\]
</step>
<result name="Arcoíris">\[\cos^2\theta_i=\frac{n^2-1}{k(k+2)},\qquad D=k\,180^\circ+2\theta_i-2(k+1)\theta_t.\]</result>
<vars>
<v s="D" n="desviación total" u="rad"/>
<v s="\theta_i,\,\theta_t" n="ángulos de incidencia y de refracción en la gota" u="rad"/>
<v s="n" n="índice de refracción del agua" u="1"/>
<v s="k" n="número de reflexiones internas" u="1"/>
</vars>
<effects>
<e>Con \(n=1.333\): arco primario a 42.08° del punto antisolar (\(\theta_i=59.41^\circ\)) y secundario a 50.89° (\(\theta_i=71.84^\circ\)). Luz roja (\(n=1.331\)): 42.37° y 50.37°; violeta (\(n=1.344\)): 40.51° y 53.73°.</e>
<e>El primario tiene el rojo por fuera (42.4°) y el violeta por dentro (40.5°), con anchura angular de 1.9°; el secundario invierte el orden (rojo por dentro, 50.4°; violeta por fuera, 53.7°), con 3.4° de anchura. Entre los dos arcos (42.4°–50.4°) el cielo es más oscuro: la banda de Alejandro.</e>
<e>Como el valor de 42° solo depende del índice del agua, el arcoíris se ve siempre a esa distancia angular del punto opuesto al Sol (el Sol debe estar a menos de 42° de altura).</e>
</effects>
<limits>
<l>Dimensiones: los ángulos y \(n\) son adimensionales. ✓</l>
<l>Óptica de rayos, gotas esféricas grandes (mayores que 1 mm); las características finas (arcos supernumerarios, polarización, gotitas pequeñas, niebla) requieren la teoría de Mie o la de Airy (capítulo 26). El mínimo existe para \(1<n<2\) en el arco primario (\(n<\sqrt{k(k+2)+1}\)).</l>
</limits>
<explore sim="arcoiris" title="Arcoíris: ángulos de los arcos primario y secundario según el índice"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(n=1.333\)): arco primario 42.0781°, secundario 50.8908° y ángulos de incidencia 59.4105° y 71.8427°.</li>
<li>Seleccione \(n\) en el eje: el primario se estrecha (cae) al aumentar \(n\) mientras el secundario se abre.</li>
</ul></div>
</deriv>

<deriv id="fibra-optica" title="La fibra óptica: apertura numérica y dispersión modal" tags="Óptica, Fibras">
<goal>El cono de luz que puede guiar una fibra de índice escalonado y el ensanchamiento de un pulso por los diferentes caminos.</goal>
<given>
<g>Reflexión total interna en la interfaz núcleo–revestimiento (\(n_1>n_2\)): ocurre si el ángulo de incidencia es mayor que \(\theta_c=\arcsin(n_2/n_1)\).</g>
</given>
<step op="Rayo que entra desde el aire con ángulo \(\theta_a\) respecto del eje; refracción en la cara de entrada y condición de reflexión total">
\[\sin\theta_a=n_1\sin\theta_r,\qquad\theta_r=90^\circ-\theta_c\ \Longrightarrow\ \sin\theta_a^\max=n_1\cos\theta_c.\]
</step>
<step op="Apertura numérica">
\[\mathrm{NA}=\sin\theta_a^\max=n_1\sqrt{1-\frac{n_2^2}{n_1^2}}=\sqrt{n_1^2-n_2^2}\simeq n_1\sqrt{2\Delta},\quad\Delta=\frac{n_1-n_2}{n_1}.\]
</step>
<step op="Caminos: el rayo axial tarda \(t_\min=Ln_1/c\); el rayo en el ángulo crítico recorre \(L/\sin\theta_c\)">
\[t_\max=\frac{Ln_1}{c\sin\theta_c}=\frac{Ln_1^2}{cn_2}.\]
</step>
<step op="Ensanchamiento modal y límite de velocidad de transmisión (\(B\lesssim1/2\Delta t\))">
\[\Delta t=t_\max-t_\min=\frac{Ln_1(n_1-n_2)}{cn_2},\qquad B\cdot L\lesssim\frac{1}{2\,(\Delta t/L)}.\]
</step>
<result name="Fibra de índice escalonado">\[\mathrm{NA}=\sqrt{n_1^2-n_2^2},\qquad\frac{\Delta t}L=\frac{n_1(n_1-n_2)}{cn_2}.\]</result>
<vars>
<v s="n_1,\,n_2" n="índices del núcleo y del revestimiento" u="1"/>
<v s="\theta_c" n="ángulo crítico interno" u="rad"/>
<v s="\theta_a" n="ángulo de aceptación en el aire" u="rad"/>
<v s="\mathrm{NA}" n="apertura numérica" u="1"/>
<v s="\Delta" n="diferencia relativa de índices" u="1"/>
<v s="L" n="longitud de la fibra" u="m"/>
<v s="c" n="velocidad de la luz" u="m s^-1"/>
<v s="\Delta t" n="ensanchamiento temporal" u="s"/>
</vars>
<effects>
<e>Fibra multimodo con \(n_1=1.48\) y \(\Delta=1\) % (\(n_2=1.4652\)): NA = 0.2088, ángulo de aceptación 12.05°, ángulo crítico 81.89°, ensanchamiento \(\Delta t/L=49.87\) ns/km y \(B\cdot L\lesssim10.0\) Mb/s·km. Con \(n_2=1.46\) (\(\Delta=1.35\) %): NA = 0.2425, 14.03° y 67.63 ns/km.</e>
<e>Reducir \(\Delta\) diez veces (0.1 %) baja NA a 0.0662 (3.79°) y \(\Delta t/L\) a 4.94 ns/km (\(B\cdot L\) de 101 Mb/s·km); con \(\Delta=5\) % la aceptación sube a 27.5° pero el pulso se ensancha 260 ns/km. Se aprecia el compromiso entre captar luz y conservar el ancho de banda.</e>
<e>Para eliminar la dispersión modal, las fibras monomodo usan un núcleo de ~9 µm y \(\Delta\sim0.3\) % (NA ≈ 0.1) en que solo se propaga un modo: allí aparece la dispersión cromática (capítulo 13) y se alcanzan Tb/s·km.</e>
</effects>
<limits>
<l>Dimensiones: \(\Delta t/L=n_1(n_1-n_2)/(cn_2)\) tiene unidades de s/m. ✓</l>
<l>Óptica de rayos con rayos meridianos y fibra gruesa (núcleo ≫ \(\lambda\)); para núcleos pequeños los modos de la ecuación de ondas (capítulo 26) sustituyen a los rayos. No incluye atenuación (Rayleigh, absorción), dispersión cromática ni la curvatura de la fibra.</l>
</limits>
<explore sim="fibra" title="Fibra óptica: apertura numérica, ángulos y ensanchamiento modal"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(n_1=1.48\), \(\Delta=0.01\)): NA = 0.208780, \(\theta_a=12.0508^\circ\), \(\theta_c=81.8904^\circ\), \(\Delta t/L=49.8661\) ns/km y \(B\cdot L=10.0268\) Mb/s·km.</li>
<li>Seleccione Δ en el eje (log–log): NA sube con pendiente 0.5 y \(\Delta t/L\) con pendiente 1; el producto \(B\cdot L\) baja con pendiente −1.</li>
</ul></div>
</deriv>
