    <h1 class="home-title">La fórmula por dentro<span>de dónde sale cada ecuación, paso a paso</span></h1>
    <p class="home-lead">Un curso hecho de deducciones. Cada fórmula de la física se construye desde sus principios: se dice qué se busca, de qué leyes se parte, y se muestra cada paso con la operación matemática que lo produce y la razón por la que se permite. Al final de cada una, un explorador deja variar los parámetros, grafica el resultado y calcula la <em>sensibilidad</em> (cuánto cambia la fórmula si se duplica una variable), para que se entienda qué significa cada letra y qué consecuencias tiene modificarla. La matemática que se necesite se deduce también. Todo está validado: cada paso se comprueba con cálculo simbólico (SymPy), cada dimensión con un análisis automático y cada simulación contra la expresión exacta; las fuentes son los textos de referencia de cada área.</p>
    <div class="maxwell-strip" aria-label="Fórmulas que se deducen">
      <div><small>Mecánica</small>\[T=2\pi\sqrt{L/g}\]</div>
      <div><small>Electromagnetismo</small>\[c=1/\sqrt{\mu_0\varepsilon_0}\]</div>
      <div><small>Relatividad</small>\[E=\gamma mc^2\]</div>
      <div><small>Cuántica</small>\[E_n=-\tfrac{13.6\,\mathrm{eV}}{n^2}\]</div>
    </div>
    <p class="home-count ctrl-note" style="margin-top:14px;font-size:13px"></p>

    <div class="box note" style="margin:0"><h4>Anatomía de una deducción</h4>
      <ol style="margin:6px 0 0">
        <li><b>Se busca</b>: el resultado, con sus magnitudes.</li>
        <li><b>Se parte de</b>: los principios y las hipótesis.</li>
        <li><b>Pasos</b>: cada uno con su <em>operación</em> (integrar, sustituir, aproximar…) y su <em>porqué</em>.</li>
        <li><b>Resultado</b> y tabla de variables con unidades SI.</li>
        <li><b>Qué ocurre si…</b>: efecto de cada parámetro, con cifras.</li>
        <li><b>Comprobaciones</b>: dimensiones y límites conocidos.</li>
        <li><b>Explorador</b>: deslizadores, gráfica y sensibilidad \(n=\partial\ln f/\partial\ln p\).</li>

<div class="home-howto">
  <div><b>Paso a paso, sin saltos</b><p>Si un paso usa un truco (un cambio de variable, una serie, una integral conocida), se explica de dónde sale. Las integrales y las ecuaciones diferenciales se resuelven a la vista.</p></div>
  <div><b>Variar para entender</b><p>Cada fórmula tiene un explorador. La tabla de sensibilidad responde «¿qué pasa si se duplica \(L\)?» sin hacer cuentas, y la gráfica en escala logarítmica muestra las leyes de potencias como rectas.</p></div>
  <div><b>Verificado de punta a punta</b><p>Cada paso algebraico, cada integral y cada solución de ecuación diferencial se comprueba con SymPy; las unidades se verifican con un analizador de dimensiones; y el explorador se compara con la fórmula exacta en muestras aleatorias. El apéndice B enumera las pruebas.</p></div>
  <div><b>Fuentes</b><p>Cada capítulo cierra con la bibliografía: Landau–Lifshitz, Goldstein, Jackson, Griffiths, Feynman, Kittel, Reif, Weinberg y artículos originales.</p></div>
