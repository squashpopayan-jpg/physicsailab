<template class="chapter-src" data-id="materia" data-num="24" data-title="Dieléctricos, magnetismo de la materia y plasmas" data-part="Parte V · Electromagnetismo" data-short="La relación de Clausius–Mossotti, la polarización orientacional de Langevin–Debye, la frecuencia de plasma y la longitud de Debye, el paramagnetismo de Curie y la relajación de Debye con el horno de microondas">
<p class="lead">La materia responde a los campos con cargas ligadas (dieléctricos) y con momentos permanentes que se orientan, y los gases ionizados responden con cargas libres (plasmas). Se deducen la permitividad en función de la polarizabilidad molecular (que conecta con el índice de refracción), la competencia entre la orientación del campo y la agitación térmica (ley de Curie), la oscilación colectiva de un plasma, el apantallamiento de Debye y, finalmente, la respuesta en frecuencia de un dieléctrico con relajación, que explica por qué el agua se calienta en un horno de microondas. El análogo magnético de la orientación, el paramagnetismo, se obtiene con las estadísticas del capítulo 18.</p>

<deriv id="clausius-mossotti" title="La relación de Clausius–Mossotti: polarizabilidad, permitividad e índice de refracción" tags="Dieléctricos, Polarización">
<goal>La constante dieléctrica de un material en función de la densidad de moléculas y de su polarizabilidad electrónica.</goal>
<given>
<g>Cada molécula adquiere un momento inducido \(\mathbf p=\alpha\mathbf E_\text{loc}\); la polarización es \(\mathbf P=n\alpha\mathbf E_\text{loc}\) y \(\mathbf P=\varepsilon_0(\varepsilon_r-1)\mathbf E\).</g>
<g>Campo local (cavidad esférica de Lorentz, medio isótropo): \(\mathbf E_\text{loc}=\mathbf E+\mathbf P/3\varepsilon_0\).</g>
</given>
<step op="Combinar polarización y campo local">
\[\mathbf P=n\alpha\left(\mathbf E+\frac{\mathbf P}{3\varepsilon_0}\right)\ \Longrightarrow\ \mathbf P=\frac{n\alpha\,\mathbf E}{1-n\alpha/3\varepsilon_0}.\]
</step>
<step op="Constante dieléctrica">
\[\varepsilon_r-1=\frac{P}{\varepsilon_0E}=\frac{n\alpha/\varepsilon_0}{1-n\alpha/3\varepsilon_0}.\]
</step>
<step op="Despejar: relación de Clausius–Mossotti">
\[\frac{\varepsilon_r-1}{\varepsilon_r+2}=\frac{n\alpha}{3\varepsilon_0}=\frac{4\pi}3n\alpha',\qquad\alpha=4\pi\varepsilon_0\alpha'.\]
<why>Con \(x=n\alpha/3\varepsilon_0\): \(\varepsilon_r-1=\dfrac{3x}{1-x}\), de donde \(\varepsilon_r=\dfrac{1+2x}{1-x}\).</why>
</step>
<step op="Gas diluido (\(x\ll1\)) y relación de Maxwell con el índice de refracción">
\[\varepsilon_r-1\simeq4\pi n\alpha',\qquad n_\text{refr}=\sqrt{\varepsilon_r}\ \ (\text{a frecuencias ópticas}).\]
</step>
<result name="Clausius–Mossotti">\[\frac{\varepsilon_r-1}{\varepsilon_r+2}=\frac{n\alpha}{3\varepsilon_0},\qquad\varepsilon_r=\frac{1+2x}{1-x}.\]</result>
<vars>
<v s="\varepsilon_r" n="constante dieléctrica relativa" u="1"/>
<v s="n" n="densidad de moléculas" u="m^-3"/>
<v s="\alpha" n="polarizabilidad" u="C m^2 V^-1"/>
<v s="\alpha'" n="polarizabilidad (volumen)" u="m^3"/>
<v s="\varepsilon_0" n="permitividad del vacío" u="F m^-1"/>
<v s="P" n="polarización" u="C m^-2"/>
<v s="E" n="campo eléctrico" u="V m^-1"/>
<v s="x" n="parámetro \(n\alpha/3\varepsilon_0\)" u="1"/>
</vars>
<effects>
<e>Nitrógeno a 1 atm (\(n=2.446\times10^{25}\) m⁻³, \(\alpha'=1.74\) Å³): \(\varepsilon_r=1.000535\) (medido 1.00055) y un índice \(\sqrt{\varepsilon_r}=1.000267\); con diez veces la densidad, \(\varepsilon_r-1=5.358\times10^{-3}\) (lineal en \(n\)). Con \(\alpha'\) doble, 1.00107.</e>
<e>Argón líquido (\(n=2.1\times10^{28}\) m⁻³, \(\alpha'=1.64\) Å³): \(\varepsilon_r=1.506\) (medido 1.51), mientras que la fórmula diluida daría 1.433 (el factor de campo local aporta +17 % a \(\varepsilon_r-1\)). Un material de \(n=5\times10^{28}\) y \(\alpha'=1\) Å³: \(\varepsilon_r=1.795\).</e>
<e>La relación explica la dependencia de \(\varepsilon_r\) con la densidad, no con la temperatura: es la polarizabilidad electrónica. Para moléculas con momento permanente hay que añadir el término orientacional (siguiente deducción).</e>
</effects>
<limits>
<l>Dimensiones: \([n\alpha/\varepsilon_0]=\mathrm{m^{-3}\,C\,m^2V^{-1}/(F\,m^{-1})}=1\). ✓</l>
<l>Vale para medios isótropos, polarizables y sin momentos permanentes; diverge cuando \(x\to1\) (catástrofe de polarización, base de la ferroelectricidad). Los líquidos polares (agua, \(\varepsilon_r=78\)) y los iones no cumplen la relación.</l>
</limits>
<explore sim="clausius" title="Constante dieléctrica según la densidad y la polarizabilidad"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(n=2.446\times10^{25}\) m⁻³, \(\alpha'=1.74\) Å³): \(\varepsilon_r=1.000535\), \(\varepsilon_r-1\approx5.34830\times10^{-4}\) (diluido), índice 1.000267 y \(x=1.78277\times10^{-4}\).</li>
<li>Seleccione \(n\) en el eje (log–log): \(\varepsilon_r-1\) crece con pendiente 1 en gases y se vuelve más rápida para \(x\sim1\).</li>
</ul></div>
</deriv>

<deriv id="langevin-debye" title="La polarización orientacional: la función de Langevin y la ley de Curie–Debye" tags="Dieléctricos, Estadística">
<goal>El momento medio alineado de moléculas polares con momento \(p\) en un campo \(E\) a temperatura \(T\), y la polarizabilidad orientacional.</goal>
<given>
<g>Energía de un dipolo en un campo: \(U=-pE\cos\theta\); factor de Boltzmann \(e^{-U/kT}=e^{x\cos\theta}\) con \(x=pE/kT\) (capítulo 18). Elemento de ángulo sólido \(\mathrm d\Omega=2\pi\sin\theta\,\mathrm d\theta\).</g>
</given>
<step op="Orientación media">
\[\langle\cos\theta\rangle=\frac{\int_0^\pi\cos\theta\,e^{x\cos\theta}\sin\theta\,\mathrm d\theta}{\int_0^\pi e^{x\cos\theta}\sin\theta\,\mathrm d\theta}=\coth x-\frac1x\equiv L(x).\]
</step>
<step op="Campo débil: \(L(x)=\tfrac x3-\tfrac{x^3}{45}+\ldots\)">
\[\langle p_\parallel\rangle=p\,L(x)\simeq\frac{p^2E}{3kT}\ \Longrightarrow\ \alpha_\text{or}=\frac{p^2}{3kT}.\]
</step>
<step op="Polarizabilidad total de Debye y ley de Curie">
\[\alpha=\alpha_e+\frac{p^2}{3kT},\qquad\varepsilon_r-1\simeq\frac n{\varepsilon_0}\left(\alpha_e+\frac{p^2}{3kT}\right).\]
</step>
<step op="Campo fuerte: saturación">
\[x\to\infty:\ L\to1-\frac1x\ \Longrightarrow\ \langle p_\parallel\rangle\to p.\]
</step>
<result name="Orientación y polarizabilidad de Debye">\[\langle p_\parallel\rangle=p\left(\coth\frac{pE}{kT}-\frac{kT}{pE}\right),\qquad\alpha_\text{or}=\frac{p^2}{3kT}.\]</result>
<vars>
<v s="p" n="momento dipolar de la molécula" u="C m"/>
<v s="E" n="campo eléctrico" u="V m^-1"/>
<v s="k" n="constante de Boltzmann" u="J K^-1"/>
<v s="T" n="temperatura" u="K"/>
<v s="x" n="parámetro \(pE/kT\)" u="1"/>
<v s="L" n="función de Langevin" u="1"/>
<v s="\alpha_\text{or}" n="polarizabilidad orientacional" u="C m^2 V^-1"/>
<v s="\alpha_e" n="polarizabilidad electrónica" u="C m^2 V^-1"/>
<v s="n" n="densidad de moléculas" u="m^-3"/>
<v s="\varepsilon_0" n="permitividad del vacío" u="F m^-1"/>
</vars>
<effects>
<e>Una molécula de agua (\(p=6.17\times10^{-30}\) C·m) a 300 K en 1 MV/m: \(x=1.49\times10^{-3}\) y la orientación media es \(L=4.97\times10^{-4}\) (menos del 0.05 % de los dipolos alineados). La polarizabilidad orientacional (volumen) es 27.5 Å³, unas 18 veces la electrónica (≈ 1.5 Å³). A 100 MV/m, \(L=0.0496\) (aún lineal, \(x/3=0.0497\)); a 1 GV/m, \(L=0.436\) (la saturación empieza: la fórmula lineal daría 0.497).</e>
<e>La contribución orientacional crece como \(1/T\): a 150 K es 55.07 Å³ (el doble que a 300 K), y a 373 K, 22.15 Å³. Vapor de agua a 100 °C y 1 atm (\(n=1.967\times10^{25}\) m⁻³): \(\varepsilon_r-1=5.84\times10^{-3}\), próximo al valor medido (≈ 6×10⁻³, \(\varepsilon_r\approx1.006\)).</e>
<e>En el agua líquida (\(\varepsilon_r=78\)) las moléculas interactúan y la fórmula lineal sobrestima; la teoría de Onsager y Kirkwood añade las correlaciones. Los campos fuertes (\(x\sim1\), \(E\sim10^9\) V/m) solo se alcanzan localmente.</e>
</effects>
<limits>
<l>Dimensiones: \(pE/kT\) y \(L(x)\) son adimensionales; \(p^2/(3kT)\) se mide en \(\mathrm{C^2m^2J^{-1}}=\mathrm{C\,m^2V^{-1}}\). ✓</l>
<l>Dipolos clásicos que rotan libremente (gases, líquidos diluidos); en sólidos los dipolos están fijos a una red y la orientación es discreta. A frecuencias altas los dipolos no siguen el campo (relajación de Debye, última deducción).</l>
</limits>
<explore sim="langevin" title="Orientación de dipolos polares: función de Langevin y polarizabilidad de Debye"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (agua, 300 K, 1 MV/m): \(x=1.48964\times10^{-3}\), \(L=4.96546\times10^{-4}\), \(\alpha'_\text{or}=27.5351\) Å³ y \(\langle p_\parallel\rangle=3.06369\times10^{-3}\) en unidades de 10⁻³⁰ C·m.</li>
<li>Seleccione \(T\) en el eje (log–log): \(\alpha'_\text{or}\) cae con pendiente −1; para \(x\ll1\) \(L\) sube con \(E\) con pendiente +1 y se satura para \(x\gtrsim3\).</li>
</ul></div>
</deriv>

<deriv id="plasma" title="El plasma: frecuencia de plasma, longitud de Debye y reflexión de ondas" tags="Plasmas, Maxwell">
<goal>La frecuencia a la que oscilan colectivamente los electrones de un plasma, la distancia de apantallamiento de una carga y la frecuencia mínima que atraviesa el plasma.</goal>
<given>
<g>Plasma neutro de densidad \(n\) de electrones (iones inmóviles). Ley de Gauss; segunda ley de Newton; Boltzmann (\(n_e=n\,e^{e\phi/kT}\)) y ecuación de Poisson \(\nabla^2\phi=-\rho/\varepsilon_0\).</g>
</given>
<step op="Se desplaza la nube de electrones una distancia \(\xi\): aparece una densidad de carga superficial \(\sigma=-ne\xi\) y un campo">
\[E=\frac{ne\,\xi}{\varepsilon_0}\ \ (\text{Gauss}),\qquad m\ddot\xi=-eE=-\frac{ne^2}{\varepsilon_0}\xi.\]
</step>
<step op="Oscilador armónico">
\[\ddot\xi=-\omega_p^2\xi,\qquad\omega_p=\sqrt{\frac{ne^2}{\varepsilon_0m}}.\]
</step>
<step op="Apantallamiento: linealizar \(n_e\simeq n(1+e\phi/kT)\) en Poisson (iones con densidad \(n\))">
\[\nabla^2\phi=\frac{ne^2}{\varepsilon_0kT}\phi\equiv\frac{\phi}{\lambda_D^2}\ \Longrightarrow\ \phi=\frac{q}{4\pi\varepsilon_0r}e^{-r/\lambda_D},\quad\lambda_D=\sqrt{\frac{\varepsilon_0kT}{ne^2}}.\]
</step>
<step op="Función dieléctrica y reflexión (electrones libres con \(\omega\gg\) colisiones)">
\[\varepsilon(\omega)=1-\frac{\omega_p^2}{\omega^2},\qquad k^2=\frac{\omega^2}{c^2}\varepsilon\ \Rightarrow\ \omega<\omega_p:\ k\ \text{imaginario (reflexión)}.\]
</step>
<result name="Plasma">\[\omega_p=\sqrt{\frac{ne^2}{\varepsilon_0m}},\qquad\lambda_D=\sqrt{\frac{\varepsilon_0kT}{ne^2}},\qquad\varepsilon(\omega)=1-\frac{\omega_p^2}{\omega^2}.\]</result>
<vars>
<v s="n" n="densidad de electrones" u="m^-3"/>
<v s="e" n="carga del electrón" u="C"/>
<v s="m" n="masa del electrón" u="kg"/>
<v s="\varepsilon_0" n="permitividad del vacío" u="F m^-1"/>
<v s="\omega_p" n="frecuencia angular de plasma" u="rad s^-1"/>
<v s="\lambda_D" n="longitud de Debye" u="m"/>
<v s="k" n="constante de Boltzmann" u="J K^-1"/>
<v s="T" n="temperatura" u="K"/>
<v s="\xi" n="desplazamiento" u="m"/>
<v s="\phi" n="potencial electrostático" u="V"/>
<v s="c" n="velocidad de la luz" u="m s^-1"/>
</vars>
<effects>
<e>La ionosfera (\(n=10^{12}\) m⁻³, \(T_e=0.1\) eV): \(f_p=8.98\) MHz, \(\lambda_D=2.35\) mm, \(N_D=5.4\times10^4\) electrones en la esfera de Debye y longitud de onda de corte 33.4 m: las ondas de radio con \(f<f_p\) rebotan (onda corta y AM de noche) y las de VHF, TV y satélite (\(f\gg f_p\)) la atraviesan.</e>
<e>Los electrones de un metal (\(n=8.47\times10^{28}\) m⁻³): \(\omega_p=1.64\times10^{16}\) rad/s, corte en 115 nm (ultravioleta): el metal es brillante en el visible (\(\omega<\omega_p\)). Un plasma de fusión (\(n=10^{20}\) m⁻³, 1 keV): \(f_p=89.8\) GHz, \(\lambda_D=23.5\) µm. El medio interestelar (\(n=10^6\) m⁻³, 10 eV): \(f_p=8.98\) kHz y \(\lambda_D=23.5\) m.</e>
<e>\(f_p\propto\sqrt n\) y \(\lambda_D\propto\sqrt{T/n}\): una densidad cien veces mayor multiplica \(f_p\) por 10 y divide \(\lambda_D\) entre 10. La condición de plasma es \(N_D\gg1\); en el metal (\(N_D=0.006\)) el gas de Fermi es degenerado y esta teoría clásica no aplica a \(\lambda_D\) (se usa la longitud de Thomas–Fermi).</e>
</effects>
<limits>
<l>Dimensiones: \([ne^2/\varepsilon_0m]=\mathrm{m^{-3}C^2/(F\,m^{-1}kg)}=\mathrm{s^{-2}}\). ✓</l>
<l>Plasma frío sin campo magnético ni colisiones; con campo \(\mathbf B\) aparecen la girofrecuencia y la frecuencia híbrida superior, y con temperatura (ondas de Langmuir) una dispersión \(\omega^2=\omega_p^2+3k^2v_t^2\). Apantalla solo si \(N_D\gg1\).</l>
</limits>
<explore sim="plasma" title="Plasma: frecuencia de plasma, longitud de Debye y longitud de onda de corte"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(n=10^{12}\) m⁻³, 0.1 eV): \(f_p=8.97866\) MHz, \(\lambda_D=2.35082\) mm, \(N_D=5.44184\times10^4\) y \(\lambda_c=33.3894\) m.</li>
<li>Seleccione \(n\) en el eje (log–log): \(f_p\) sube con pendiente 0.5, \(\lambda_D\) y \(\lambda_c\) caen con pendiente −0.5 y \(N_D\) con pendiente +0.5 (\(\propto n\lambda_D^3\)).</li>
</ul></div>
</deriv>

<deriv id="curie-paramagnetismo" title="El paramagnetismo de Curie" tags="Magnetismo, Estadística">
<goal>La magnetización de un conjunto de momentos de espín ½ en un campo \(B\) a temperatura \(T\) y la ley de Curie \(\chi\propto1/T\).</goal>
<given>
<g>Un electrón con espín ½ tiene dos orientaciones con energías \(\mp\mu_BB\) (\(g=2\)); poblaciones de Boltzmann (sistema de dos niveles, capítulo 18). \(M\) es el momento magnético por unidad de volumen y \(\chi=\mu_0M/B\).</g>
</given>
<step op="Poblaciones de los dos niveles (\(x=\mu_BB/kT\))">
\[\frac{N_\uparrow}N=\frac{e^{x}}{e^{x}+e^{-x}},\qquad\frac{N_\downarrow}N=\frac{e^{-x}}{e^{x}+e^{-x}}.\]
</step>
<step op="Magnetización neta">
\[M=n\mu_B\,\frac{N_\uparrow-N_\downarrow}N=n\mu_B\tanh x.\]
</step>
<step op="Campo débil (\(x\ll1\), \(\tanh x\simeq x\)): ley de Curie">
\[M\simeq\frac{n\mu_B^2B}{kT}\ \Longrightarrow\ \chi=\frac{\mu_0M}B=\frac{\mu_0n\mu_B^2}{kT}\equiv\frac CT.\]
</step>
<step op="Campo fuerte: saturación">
\[x\gg1:\ M\to n\mu_B\ (\text{todos alineados}).\]
</step>
<result name="Ley de Curie">\[M=n\mu_B\tanh\frac{\mu_BB}{kT},\qquad\chi=\frac{\mu_0n\mu_B^2}{kT}.\]</result>
<vars>
<v s="M" n="magnetización" u="A m^-1"/>
<v s="n" n="densidad de momentos magnéticos" u="m^-3"/>
<v s="\mu_B" n="magnetón de Bohr" u="J T^-1"/>
<v s="B" n="campo magnético" u="T"/>
<v s="k" n="constante de Boltzmann" u="J K^-1"/>
<v s="T" n="temperatura" u="K"/>
<v s="x" n="parámetro \(\mu_BB/kT\)" u="1"/>
<v s="\chi" n="susceptibilidad magnética" u="1"/>
<v s="\mu_0" n="permeabilidad del vacío" u="H m^-1"/>
</vars>
<effects>
<e>Una sal paramagnética (\(n=10^{27}\) m⁻³) a 300 K en 1 T: \(x=2.24\times10^{-3}\), \(M=20.76\) A/m (0.22 % de la saturación) y \(\chi=2.609\times10^{-5}\). A 100 K, \(\chi=7.828\times10^{-5}\) (tres veces mayor: ley \(1/T\)). Con diez veces más espines, \(\chi=2.609\times10^{-4}\).</e>
<e>A 2 K y 1 T, \(x=0.336\): \(M=3003\) A/m (32.4 % de saturación); la ley lineal de Curie daría 3115 A/m (3.7 % más). A 1 K y 5 T, \(x=3.36\): \(M=9252\) A/m, el 99.8 % de \(n\mu_B=9274\) A/m. Es el principio de la desmagnetización adiabática, usada para llegar a los milikelvin.</e>
<e>La susceptibilidad es pequeña (\(\sim10^{-5}\)) frente a la de un ferromagneto (\(\sim10^3\)–\(10^5\)), donde la interacción de intercambio alinea los espines por debajo de la temperatura de Curie (ley de Curie–Weiss \(\chi=C/(T-T_c)\)).</e>
</effects>
<limits>
<l>Dimensiones: \([\mu_0n\mu_B^2/kT]=\mathrm{H\,m^{-1}m^{-3}J^2T^{-2}/J}=1\) (con \(\mathrm{H}=\mathrm{T\,m^2A^{-1}}\)). ✓</l>
<l>Momentos independientes de espín ½; para otro momento angular total \(J\), la función tanh se reemplaza por la de Brillouin y \(\mu_B^2\to g^2J(J+1)\mu_B^2/3\). Los electrones de conducción de un metal (paramagnetismo de Pauli) no siguen la ley de Curie porque están degenerados (capítulo 18).</l>
</limits>
<explore sim="curie" title="Paramagnetismo: magnetización, susceptibilidad y saturación"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(n=10^{27}\) m⁻³, 300 K, 1 T): \(x=2.23905\times10^{-3}\), \(M=20.7649\) A/m, \(\chi=2.60940\times10^{-5}\) y \(M/M_\text{sat}=2.23904\times10^{-3}\).</li>
<li>Seleccione \(T\) en el eje (log–log): \(\chi\) cae con pendiente −1 y \(M\) igual a alta temperatura; por debajo de \(T\sim\mu_BB/k\) (0.67 K a 1 T) \(M\) se satura.</li>
</ul></div>
</deriv>

<deriv id="debye-microondas" title="La relajación de Debye y el horno de microondas" tags="Dieléctricos, Microondas">
<goal>La permitividad compleja de un dieléctrico polar en un campo alterno y la potencia absorbida, con la aplicación al calentamiento del agua en un horno de microondas.</goal>
<given>
<g>Los dipolos siguen al campo con un retraso: la polarización orientacional obedece \(\tau\,\dot P_o+P_o=\varepsilon_0(\varepsilon_s-\varepsilon_\infty)E\). La respuesta instantánea (electrónica) da \(P_\infty=\varepsilon_0(\varepsilon_\infty-1)E\).</g>
<g>Campo armónico \(E=E_0e^{-i\omega t}\) y potencia disipada por unidad de volumen \(\langle\mathbf J\cdot\mathbf E\rangle\).</g>
</given>
<step op="Respuesta en frecuencia de la polarización orientacional">
\[(1-i\omega\tau)P_o=\varepsilon_0(\varepsilon_s-\varepsilon_\infty)E\ \Longrightarrow\ \varepsilon(\omega)=\varepsilon_\infty+\frac{\varepsilon_s-\varepsilon_\infty}{1-i\omega\tau}.\]
</step>
<step op="Partes real e imaginaria (\(\varepsilon=\varepsilon'+i\varepsilon''\))">
\[\varepsilon'=\varepsilon_\infty+\frac{\varepsilon_s-\varepsilon_\infty}{1+\omega^2\tau^2},\qquad\varepsilon''=\frac{(\varepsilon_s-\varepsilon_\infty)\,\omega\tau}{1+\omega^2\tau^2}.\]
</step>
<step op="Máximo de las pérdidas">
\[\frac{\mathrm d\varepsilon''}{\mathrm d\omega}=0\ \Longrightarrow\ \omega\tau=1,\qquad\varepsilon''_\max=\frac{\varepsilon_s-\varepsilon_\infty}2,\quad f_\max=\frac1{2\pi\tau}.\]
</step>
<step op="Potencia absorbida (corriente de polarización \(J=\partial_tP\))">
\[p=\langle\mathbf J\cdot\mathbf E\rangle=\tfrac12\,\omega\,\varepsilon_0\,\varepsilon''\,E_0^2.\]
</step>
<step op="Profundidad de penetración en potencia, con \(k=(\omega/c)\sqrt{\varepsilon'+i\varepsilon''}\)">
\[D_p=\frac1{2\,\mathrm{Im}\,k}.\]
</step>
<result name="Relajación de Debye">\[\varepsilon''=\frac{(\varepsilon_s-\varepsilon_\infty)\omega\tau}{1+\omega^2\tau^2},\qquad p=\tfrac12\omega\varepsilon_0\varepsilon''E_0^2.\]</result>
<vars>
<v s="\varepsilon_s" n="constante dieléctrica estática" u="1"/>
<v s="\varepsilon_\infty" n="constante a frecuencia alta" u="1"/>
<v s="\tau" n="tiempo de relajación" u="s"/>
<v s="\omega" n="frecuencia angular" u="rad s^-1"/>
<v s="\varepsilon',\,\varepsilon''" n="partes real e imaginaria de la permitividad" u="1"/>
<v s="E_0" n="amplitud del campo eléctrico" u="V m^-1"/>
<v s="p" n="potencia absorbida por unidad de volumen" u="W m^-3"/>
<v s="\varepsilon_0" n="permitividad del vacío" u="F m^-1"/>
<v s="D_p" n="profundidad de penetración en potencia" u="m"/>
<v s="c" n="velocidad de la luz" u="m s^-1"/>
</vars>
<effects>
<e>Agua a 25 °C (\(\varepsilon_s=78.4\), \(\varepsilon_\infty=5.2\), \(\tau=8.27\) ps) a 2.45 GHz (\(\omega\tau=0.127\)): \(\varepsilon'=77.23\), \(\varepsilon''=9.170\), \(\tan\delta=0.1187\), penetración de potencia \(D_p=1.87\) cm y, con \(E_0=1\) kV/m, una potencia absorbida de 625 kW/m³ (\(0.149\) K/s de calentamiento por kV/m, unos 9 K/min).</e>
<e>El máximo de pérdidas está en \(f=1/(2\pi\tau)=19.2\) GHz, donde \(\varepsilon''=36.6\) (la mitad de \(\varepsilon_s-\varepsilon_\infty\)) pero la penetración es de solo 0.47 mm: calentaría solo la superficie. A 100 MHz, \(\varepsilon''=0.380\) y \(D_p=11.1\) m (no calienta); a 915 MHz (hornos industriales), \(\varepsilon''=3.47\) y \(D_p=13.3\) cm. El valor de 2.45 GHz es un compromiso entre potencia y penetración.</e>
<e>Los alimentos con agua líquida se calientan, el hielo (\(\tau\sim10^{-5}\) s, \(\omega\tau\gg1\) a 2.45 GHz) y los plásticos sin dipolos libres casi no; los dipolos de la sal disuelta añaden conducción iónica (pérdidas \(\sigma/\omega\varepsilon_0\)).</e>
</effects>
<limits>
<l>Dimensiones: \(\omega\tau\) es adimensional; \([\omega\varepsilon_0E_0^2]=\mathrm{s^{-1}F\,m^{-1}V^2m^{-2}}=\mathrm{W\,m^{-3}}\). ✓</l>
<l>Un solo tiempo de relajación (Debye); el agua real presenta una pequeña distribución (modelo de Cole–Cole) y su \(\tau\) depende de la temperatura (más lento al enfriarse). Campos débiles (respuesta lineal), sin conducción iónica ni efectos de borde de onda estacionaria.</l>
</limits>
