<template class="chapter-src" data-id="schrodinger" data-num="30" data-title="La ecuación de Schrödinger en una dimensión" data-part="Parte VIII · Física cuántica" data-short="La partícula en una caja, el oscilador armónico cuántico con operadores de escalera, el efecto túnel, el pozo finito y el ensanchamiento de un paquete de ondas libre">
<p class="lead">La ecuación de Schrödinger es la ecuación de movimiento de la función de onda \(\psi(x,t)\), cuyo cuadrado \(|\psi|^2\) es la densidad de probabilidad de encontrar la partícula. Se parte de las relaciones de Planck y De Broglie, \(E=\hbar\omega\) y \(p=\hbar k\), con la energía no relativista \(E=p^2/2m+V\); de ahí salen, como problemas de autovalores, las energías cuantizadas de la caja y del oscilador, el efecto túnel a través de una barrera, la cantidad de estados ligados de un pozo y la inevitable dispersión de una partícula libre, todo con una sola ecuación y condiciones de contorno.</p>

<deriv id="caja-infinita" title="La partícula en una caja: cuantización de la energía" tags="Cuántica, Schrödinger">
<goal>Las energías y las funciones de onda permitidas de una partícula de masa \(m\) confinada entre dos paredes impenetrables separadas \(L\).</goal>
<given>
<g>Onda plana \(\psi=e^{i(kx-\omega t)}\) con \(p=\hbar k\), \(E=\hbar\omega\) y \(E=p^2/2m\): de allí \(i\hbar\,\partial_t\psi=-\dfrac{\hbar^2}{2m}\partial_x^2\psi\) (ecuación para la partícula libre); con un potencial \(V(x)\) se añade \(V\psi\).</g>
<g>Estados estacionarios: \(\psi(x,t)=\phi(x)e^{-iEt/\hbar}\) con \(-\dfrac{\hbar^2}{2m}\phi''+V\phi=E\phi\). Condición de contorno: \(\phi=0\) en las paredes. Normalización: \(\int|\phi|^2\mathrm dx=1\).</g>
</given>
<step op="Dentro de la caja (\(V=0\)): ecuación del oscilador espacial">
\[\phi''=-k^2\phi,\qquad k=\frac{\sqrt{2mE}}\hbar\ \Longrightarrow\ \phi=A\sin kx+B\cos kx.\]
</step>
<step op="Condiciones de contorno \(\phi(0)=\phi(L)=0\)">
\[B=0,\qquad \sin kL=0\ \Longrightarrow\ k_n=\frac{n\pi}L,\quad n=1,2,3,\dots\]
</step>
<step op="Energías cuantizadas">
\[E_n=\frac{\hbar^2k_n^2}{2m}=\frac{n^2\pi^2\hbar^2}{2mL^2}.\]
</step>
<step op="Normalización">
\[\int_0^LA^2\sin^2\frac{n\pi x}L\,\mathrm dx=\frac{A^2L}2=1\ \Longrightarrow\ \phi_n(x)=\sqrt{\frac2L}\sin\frac{n\pi x}L.\]
</step>
<result name="Partícula en una caja">\[E_n=\frac{n^2\pi^2\hbar^2}{2mL^2},\qquad\phi_n=\sqrt{\frac2L}\sin\frac{n\pi x}L.\]</result>
<vars>
<v s="E_n" n="energía del estado \(n\)" u="J"/>
<v s="n" n="número cuántico" u="1"/>
<v s="\hbar" n="constante de Planck reducida" u="J s"/>
<v s="m" n="masa" u="kg"/>
<v s="L" n="anchura de la caja" u="m"/>
<v s="k" n="número de onda" u="m^-1"/>
</vars>
<effects>
<e>Un electrón en una caja de 1 nm: \(E_1=0.3760\) eV, \(E_2=1.504\) eV y \(E_3=3.384\) eV (\(E_n\propto n^2\)); el fotón de la transición 1 → 2 (1.128 eV) tiene 1099 nm (infrarrojo). Con 0.1 nm (tamaño atómico), \(E_1=37.60\) eV y con 10 nm, 3.76 meV: \(E\propto L^{-2}\).</e>
<e>La energía de confinamiento crece al disminuir la masa o el tamaño: un protón en un núcleo (\(L\approx10\) fm) tiene \(E_1\approx2.05\) MeV, la escala nuclear; en una caja de 1 nm solo \(2.05\times10^{-4}\) eV. Esta energía mínima distinta de cero (energía de punto cero) es consecuencia de la incertidumbre y evita el colapso del átomo.</e>
<e>Los puntos de nodos de \(\phi_n\) son \(n-1\) y la probabilidad es máxima en el centro para \(n=1\): el resultado contradice la idea clásica de una partícula con velocidad constante recorriendo toda la caja con igual probabilidad.</e>
</effects>
<limits>
<l>Dimensiones: \([\hbar^2/(mL^2)]=\mathrm{J^2s^2/(kg\,m^2)}=\mathrm J\). ✓</l>
<l>Paredes infinitas: la función de onda se anula exactamente en el borde. Los pozos reales son finitos (la función penetra en la pared, siguiente deducciones). Una caja tridimensional da \(E=\frac{\pi^2\hbar^2}{2mL^2}(n_x^2+n_y^2+n_z^2)\) y degeneraciones.</l>
</limits>
<explore sim="caja" title="Partícula en una caja: niveles de energía, separaciones y longitud de onda de la transición"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (electrón, 1 nm, \(n=1\)): \(E_n=0.376030\) eV, \(E_{n+1}-E_n=1.12809\) eV, \(\lambda=1099.06\) nm y \(p_nc=619.921\) eV.</li>
<li>Seleccione \(L\) en el eje (log–log): \(E_n\) cae con pendiente −2; con la masa, igual; con \(n\) crece como \(n^2\).</li>
</ul></div>
</deriv>

<deriv id="oscilador-cuantico" title="El oscilador armónico cuántico: operadores de escalera" tags="Cuántica, Oscilador">
<goal>Los niveles de energía \(E_n\) de una partícula en el potencial \(V=\tfrac12m\omega^2x^2\) y el estado fundamental.</goal>
<given>
<g>Hamiltoniano \(H=\dfrac{p^2}{2m}+\dfrac12m\omega^2x^2\) con \(p=-i\hbar\,\mathrm d/\mathrm dx\) y \([x,p]=i\hbar\).</g>
</given>
<step op="Operadores de aniquilación y creación">
\[a=\frac{m\omega x+ip}{\sqrt{2m\hbar\omega}},\qquad a^\dagger=\frac{m\omega x-ip}{\sqrt{2m\hbar\omega}},\qquad[a,a^\dagger]=1.\]
</step>
<step op="El hamiltoniano en función de \(a\) y \(a^\dagger\)">
\[H=\hbar\omega\left(a^\dagger a+\tfrac12\right).\]
</step>
<step op="Escalera: si \(H\psi=E\psi\), entonces \(H(a^\dagger\psi)=(E+\hbar\omega)(a^\dagger\psi)\) y \(H(a\psi)=(E-\hbar\omega)(a\psi)\)">
\[[H,a^\dagger]=\hbar\omega\,a^\dagger,\qquad[H,a]=-\hbar\omega\,a.\]
</step>
<step op="La escalera se detiene abajo: el estado fundamental cumple \(a\psi_0=0\)">
\[\left(m\omega x+\hbar\frac{\mathrm d}{\mathrm dx}\right)\psi_0=0\ \Longrightarrow\ \psi_0=\left(\frac{m\omega}{\pi\hbar}\right)^{1/4}e^{-m\omega x^2/2\hbar},\quad E_0=\tfrac12\hbar\omega.\]
</step>
<step op="Estados excitados">
\[\psi_n\propto(a^\dagger)^n\psi_0,\qquad E_n=\hbar\omega\left(n+\tfrac12\right).\]
</step>
<result name="Oscilador armónico cuántico">\[E_n=\hbar\omega\left(n+\tfrac12\right),\qquad\psi_0\propto e^{-m\omega x^2/2\hbar},\ \ x_0=\sqrt{\frac\hbar{m\omega}}.\]</result>
<vars>
<v s="E_n" n="energía" u="J"/>
<v s="\hbar" n="constante de Planck reducida" u="J s"/>
<v s="\omega" n="frecuencia angular" u="rad s^-1"/>
<v s="m" n="masa" u="kg"/>
<v s="k" n="constante del resorte" u="N m^-1"/>
<v s="x_0" n="anchura del estado fundamental" u="m"/>
<v s="x" n="posición" u="m"/>
<v s="n" n="número cuántico" u="1"/>
</vars>
<effects>
<e>La molécula de CO (masa reducida 6.857 u, \(k=1857\) N/m): \(\omega=4.038\times10^{14}\) rad/s, \(\hbar\omega=0.2658\) eV (2144 cm⁻¹, medido 2143 cm⁻¹ en el infrarrojo), energía del punto cero 0.1329 eV y anchura del fundamental \(x_0=4.79\) pm (≈ 4 % de la longitud del enlace, 113 pm).</e>
<e>Un protón con frecuencia de 10 THz: \(\hbar\omega=41.36\) meV, \(x_0=31.7\) pm; un ion de calcio-40 en una trampa de 1 MHz: \(\hbar\omega=4.14\) neV, \(x_0=15.9\) nm, cuando se enfría hasta \(n=0\). Un péndulo de 1 g con 1 Hz: \(x_0=1.3\times10^{-16}\) m, imperceptible.</e>
<e>Los niveles equiespaciados explican los espectros de vibración molecular, de fonones y de cuantos de luz (\(\hbar\omega\) por modo, capítulo 29). La separación de niveles \(\hbar\omega\) escala como \(\sqrt{k/m}\): al duplicar la masa, \(\hbar\omega\) baja un 29 %.</e>
</effects>
<limits>
<l>Dimensiones: \(\hbar\omega\) es una energía y \(\sqrt{\hbar/m\omega}\) una longitud. ✓</l>
<l>Potencial exactamente armónico; las moléculas reales tienen anarmonicidad (potencial de Morse): los niveles se juntan al subir. El método de operadores es también la base de la segunda cuantización (campos).</l>
</limits>
<explore sim="oscilador" title="Oscilador armónico cuántico: ħω, punto cero y anchura del fundamental"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (CO: 6.857 u, 1857 N/m): \(\omega=4.03840\times10^{14}\) rad/s, \(\hbar\omega=0.265813\) eV, \(E_0=0.132906\) eV, \(x_0=4.78891\) pm y 2143.92 cm⁻¹.</li>
<li>Seleccione \(k\) en el eje (log–log): \(\omega\) y \(\hbar\omega\) suben con pendiente 1/2 y \(x_0\) baja con pendiente −1/4.</li>
</ul></div>
</deriv>

<deriv id="tunel" title="El efecto túnel a través de una barrera rectangular" tags="Cuántica, Túnel">
<goal>La probabilidad de que una partícula de energía \(E<V_0\) atraviese una barrera de altura \(V_0\) y anchura \(L\).</goal>
<given>
<g>Barrera \(V=V_0\) para \(0<x<L\) y 0 fuera. Soluciones: ondas \(e^{\pm ikx}\) con \(k=\sqrt{2mE}/\hbar\) a los lados y \(e^{\pm\kappa x}\) dentro, \(\kappa=\sqrt{2m(V_0-E)}/\hbar\). Continuidad de \(\psi\) y \(\psi'\).</g>
</given>
<step op="Soluciones en las tres regiones (incidencia por la izquierda)">
\[\psi=\begin{cases}e^{ikx}+re^{-ikx}&x<0\\Ae^{\kappa x}+Be^{-\kappa x}&0<x<L\\te^{ikx}&x>L\end{cases}\]
</step>
<step op="Resolver las cuatro condiciones de continuidad; la transmisión \(T=|t|^2\)">
\[T=\left[1+\frac{V_0^2\sinh^2(\kappa L)}{4E(V_0-E)}\right]^{-1}.\]
</step>
<step op="Barrera ancha (\(\kappa L\gg1\), \(\sinh\kappa L\simeq e^{\kappa L}/2\))">
\[T\simeq16\frac E{V_0}\left(1-\frac E{V_0}\right)e^{-2\kappa L}.\]
</step>
<result name="Efecto túnel">\[T=\left[1+\frac{V_0^2\sinh^2\kappa L}{4E(V_0-E)}\right]^{-1}\simeq16\frac E{V_0}\left(1-\frac E{V_0}\right)e^{-2\kappa L}.\]</result>
<vars>
<v s="T" n="coeficiente de transmisión" u="1"/>
<v s="E" n="energía de la partícula" u="J"/>
<v s="V_0" n="altura de la barrera" u="J"/>
<v s="L" n="anchura de la barrera" u="m"/>
<v s="\kappa" n="constante de decaimiento" u="m^-1"/>
<v s="m" n="masa" u="kg"/>
<v s="\hbar" n="constante de Planck reducida" u="J s"/>
<v s="k" n="número de onda" u="m^-1"/>
</vars>
<effects>
<e>Un electrón de 1 eV frente a una barrera de 2 eV y 0.5 nm: \(\kappa=5.123\) nm⁻¹, \(T=0.02355\) (la aproximación da 0.02383); con 1 nm, \(T=1.42\times10^{-4}\); con 0.1 nm, 0.777; con 2 nm, \(5.0\times10^{-9}\): cada 0.1 nm de barrera adicional la reduce en \(e^{-2\kappa\cdot0.1}=0.36\).</e>
<e>Una barrera más alta lo reduce drásticamente: con 5 eV (0.5 nm), \(T=9.08\times10^{-5}\); con \(E/V_0=0.95\) (1.9 eV) sube a 0.189, y con 0.5 eV, 0.00564. En la microscopía de efecto túnel (STM), con una función de trabajo de 4.5 eV, \(\kappa=10.87\) nm⁻¹ y la corriente cambia por un factor 8.8 cada 0.1 nm de distancia punta–muestra: de ahí la resolución atómica.</e>
<e>La desintegración alfa de núcleos (vidas medias de 10⁻⁷ s a 10¹⁰ años) y la fusión en las estrellas (que ocurre a temperaturas muy por debajo de la barrera de Coulomb) son procesos túnel con \(T\) exponencialmente sensible.</e>
</effects>
<limits>
<l>Dimensiones: \(\kappa L\) y \(T\) son adimensionales. ✓</l>
<l>Barrera rectangular y partícula con \(E<V_0\) (para \(E>V_0\) basta sustituir \(\kappa\to ik'\) y \(\sinh\to\sin\)). Barreras de forma arbitraria se tratan con la aproximación WKB: \(T\sim\exp[-2\int\kappa(x)\mathrm dx]\).</l>
</limits>
<explore sim="tunel" title="Efecto túnel: transmisión exacta y aproximada según la barrera"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(V_0=2\) eV, \(E/V_0=0.5\), 0.5 nm): \(\kappa=5.12317\) nm⁻¹, \(T=0.0235471\), \(T_\text{aprox}=0.0238285\) y penetración 97.596 pm.</li>
<li>Seleccione \(L\) en el eje (log–log): \(T\) cae de 1 casi exponencialmente (pendiente creciente en valor absoluto); la aproximación coincide a partir de \(\kappa L\gtrsim1\).</li>
</ul></div>
</deriv>

<deriv id="pozo-finito" title="El pozo de potencial finito: estados ligados" tags="Cuántica, Pozos">
<goal>Los estados ligados de una partícula en un pozo cuadrado de profundidad \(V_0\) y anchura \(L\), y cuántos hay.</goal>
<given>
<g>Pozo \(V=0\) para \(|x|<L/2\) y \(V_0\) fuera; estados ligados con \(0<E<V_0\). Dentro \(\phi\propto\cos kx\) (pares) con \(k=\sqrt{2mE}/\hbar\); fuera \(\phi\propto e^{-\kappa|x|}\) con \(\kappa=\sqrt{2m(V_0-E)}/\hbar\). Continuidad de \(\phi\) y \(\phi'\) en \(x=L/2\).</g>
</given>
<step op="Continuidad de la derivada logarítmica en el borde">
\[-k\tan\frac{kL}2=-\kappa\ \Longrightarrow\ k\tan\frac{kL}2=\kappa.\]
</step>
<step op="Variables \(z=kL/2\) y \(z_0=\dfrac L{2\hbar}\sqrt{2mV_0}\) (de modo que \(\kappa L/2=\sqrt{z_0^2-z^2}\))">
\[z\tan z=\sqrt{z_0^2-z^2}\qquad(\text{estados pares}).\]
</step>
<step op="Número de estados ligados (pares e impares): cada intervalo de ancho \(\pi/2\) en \(z\) hasta \(z_0\) aporta uno">
\[N=\left\lceil\frac{2z_0}\pi\right\rceil\ge1.\]
</step>
<step op="Energía del fundamental a partir de la raíz \(z_1\in(0,\pi/2)\)">
\[E_1=\frac{\hbar^2z_1^2}{2m(L/2)^2}<\frac{\pi^2\hbar^2}{2mL^2}\ \ (\text{pozo infinito}).\]
</step>
<result name="Pozo finito">\[z\tan z=\sqrt{z_0^2-z^2},\qquad N=\lceil2z_0/\pi\rceil,\qquad E_1=\frac{4\hbar^2z_1^2}{2mL^2}.\]</result>
<vars>
<v s="z_0" n="parámetro del pozo" u="1"/>
<v s="z" n="variable \(kL/2\)" u="1"/>
<v s="V_0" n="profundidad del pozo" u="J"/>
<v s="L" n="anchura del pozo" u="m"/>
<v s="m" n="masa" u="kg"/>
<v s="\hbar" n="constante de Planck reducida" u="J s"/>
<v s="E_1" n="energía del estado fundamental" u="J"/>
<v s="N" n="número de estados ligados" u="1"/>
<v s="k,\,\kappa" n="números de onda dentro y fuera" u="m^-1"/>
</vars>
<effects>
<e>Un electrón en un pozo de 10 eV y 1 nm: \(z_0=8.100\), 6 estados ligados y \(E_1=0.2976\) eV, el 79 % del valor del pozo infinito (0.3760 eV) porque la función penetra en las paredes. Con 100 eV, \(N=17\) y \(E_1=0.3483\) eV (93 %): al aumentar \(V_0\) se recupera la caja infinita.</e>
<e>Con 1 eV: \(z_0=2.562\), \(N=2\) y \(E_1=0.1908\) eV (0.19 \(V_0\)); con 0.1 eV, \(N=1\) y \(E_1=0.0637\) eV (0.64 \(V_0\)): un pozo unidimensional siempre tiene al menos un estado ligado. Pozo de 50 eV y 0.5 nm: \(N=6\) y \(E_1=1.219\) eV; pozo de 10 eV y 2 nm: \(N=11\) y 0.0834 eV.</e>
<e>Aplicación: puntos y pozos cuánticos en semiconductores (GaAs/AlGaAs con masa efectiva 0.067 \(m_e\) y barreras de 0.3 eV), en que las transiciones entre niveles definen el color de los láseres y de los diodos.</e>
</effects>
<limits>
<l>Dimensiones: \(z_0\) y \(z\) son adimensionales; la energía \(\hbar^2z^2/(2m(L/2)^2)\) en julios. ✓</l>
<l>Pozo cuadrado unidimensional con masa constante; la ecuación trascendente se resuelve numéricamente (bisección o Newton). Los estados impares cumplen \(-z\cot z=\sqrt{z_0^2-z^2}\); este ejemplo calcula solo el fundamental (par).</l>
</limits>
<explore sim="pozo" title="Pozo finito: estados ligados y energía del fundamental"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (10 eV, 1 nm, electrón): \(z_0=8.10044\), \(N=6\), \(E_1=0.297602\) eV, \(E_1/V_0=0.0297602\) y pozo infinito 0.376030 eV.</li>
<li>Seleccione \(V_0\) en el eje (log–log): \(E_1\) sube hasta saturarse en el valor de la caja infinita; \(N\) crece como \(\sqrt{V_0}\).</li>
</ul></div>
</deriv>

<deriv id="paquete-ondas" title="El ensanchamiento de un paquete de ondas libre" tags="Cuántica, Paquetes">
<goal>La anchura \(\sigma(t)\) de un paquete gaussiano de una partícula libre de masa \(m\), cuya anchura inicial es \(\sigma_0\).</goal>
<given>
<g>Ecuación libre \(i\hbar\,\partial_t\psi=-\dfrac{\hbar^2}{2m}\partial_x^2\psi\). Paquete inicial gaussiano \(\psi(x,0)\propto e^{-x^2/4\sigma_0^2}\) (\(|\psi|^2\) tiene desviación típica \(\sigma_0\)).</g>
</given>
<step op="Descomposición en ondas planas (transformada de Fourier): cada una evoluciona con \(\omega(k)=\hbar k^2/2m\)">
\[\psi(x,t)=\int\tilde\psi(k)\,e^{i(kx-\hbar k^2t/2m)}\mathrm dk,\qquad\tilde\psi\propto e^{-\sigma_0^2k^2}.\]
</step>
<step op="Integral gaussiana compleja">
\[\psi(x,t)\propto\exp\!\left[-\frac{x^2}{4\sigma_0^2\,(1+i\hbar t/2m\sigma_0^2)}\right].\]
</step>
<step op="Anchura de \(|\psi|^2\)">
\[\sigma(t)=\sigma_0\sqrt{1+\left(\frac{\hbar t}{2m\sigma_0^2}\right)^2}.\]
</step>
<step op="Escalas de tiempo y relación con la incertidumbre (\(\Delta v=\hbar/2m\sigma_0\))">
\[\tau=\frac{2m\sigma_0^2}\hbar,\qquad\sigma(t)\to\Delta v\;t\ \ (t\gg\tau).\]
</step>
<result name="Ensanchamiento del paquete">\[\sigma(t)=\sigma_0\sqrt{1+\left(\frac{\hbar t}{2m\sigma_0^2}\right)^2}.\]</result>
<vars>
<v s="\sigma(t)" n="anchura del paquete" u="m"/>
<v s="\sigma_0" n="anchura inicial" u="m"/>
<v s="\hbar" n="constante de Planck reducida" u="J s"/>
<v s="m" n="masa" u="kg"/>
<v s="t" n="tiempo" u="s"/>
<v s="\tau" n="tiempo de ensanchamiento" u="s"/>
<v s="\Delta v" n="dispersión de velocidades" u="m s^-1"/>
<v s="k" n="número de onda" u="m^-1"/>
</vars>
<effects>
<e>Un electrón localizado en \(\sigma_0=0.1\) nm: \(\tau=0.1728\) fs y dispersión de velocidades 579 km/s. En 1 fs su anchura es 0.587 nm (5.9 veces) y en 10 fs, 5.79 nm: el electrón «libre» se esparce por escalas atómicas en femtosegundos. Con \(\sigma_0=1\) nm, \(\tau=17.28\) fs y en 1 fs apenas cambia (1.0017 nm).</e>
<e>La inercia frena la dispersión: un protón con 0.1 nm tarda \(\tau=317\) fs y en 1000 fs mide 0.331 nm; una partícula de polvo de 1 µg con 1 µm tarda \(2\times10^{13}\) s (unos 600 000 años). Para el paquete clásico el ensanchamiento es despreciable; para el electrón, dominante.</e>
<e>El ensanchamiento es la consecuencia temporal de la incertidumbre: reducir \(\sigma_0\) aumenta \(\Delta v\propto1/\sigma_0\) y acelera la dispersión (\(\tau\propto\sigma_0^2\)); el producto \(\sigma\,\Delta p\) permanece \(\ge\hbar/2\).</e>
</effects>
<limits>
<l>Dimensiones: \(\hbar t/(2m\sigma_0^2)\) es adimensional. ✓</l>
<l>Partícula libre y sin potencial; en presencia de un potencial armónico el paquete gaussiano no se ensancha (estado coherente). El resultado es exacto para este paquete, y cualitativo para otros.</l>
</limits>
<explore sim="paquete" title="Paquete de ondas gaussiano libre: anchura, dispersión de velocidades y tiempo de ensanchamiento"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (electrón, \(\sigma_0=0.1\) nm, 1 fs): \(\sigma(t)=0.587413\) nm, \(\sigma/\sigma_0=5.87413\), \(\Delta v=578.838\) km/s y \(\tau=0.172760\) fs.</li>
<li>Seleccione \(t\) en el eje (log–log): \(\sigma(t)\) es constante para \(t\ll\tau\) y luego crece linealmente (pendiente 1).</li>
</ul></div>
</deriv>
