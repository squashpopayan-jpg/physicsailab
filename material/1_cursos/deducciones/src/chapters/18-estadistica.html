<template class="chapter-src" data-id="estadistica" data-num="18" data-title="Mecánica estadística" data-part="Parte IV · Física térmica" data-short="La distribución de Boltzmann y el sistema de dos niveles, el calor específico de Einstein, la entropía de Sackur–Tetrode, el gas de Fermi de los metales y la condensación de Bose–Einstein">
<p class="lead">La mecánica estadística explica las leyes termodinámicas contando microestados. Su única hipótesis es que, en un sistema aislado, todos los microestados accesibles son igualmente probables; la entropía es \(S=k\ln\Omega\), y la temperatura sale de \(1/T=\partial S/\partial E\). De allí se deduce el factor de Boltzmann, la función de partición y las propiedades de sistemas modelo: dos niveles, osciladores armónicos, el gas ideal con su entropía absoluta, y los gases cuánticos de fermiones (electrones en un metal) y bosones (condensación). Estos resultados completan lo prometido en los capítulos 16 y 17 (congelación de modos, entropía absoluta).</p>

<deriv id="boltzmann-dos-niveles" title="La distribución de Boltzmann y el sistema de dos niveles" tags="Mecánica estadística, Boltzmann">
<goal>La probabilidad de que un sistema en contacto con un baño a temperatura \(T\) esté en un microestado de energía \(\varepsilon_i\), y las propiedades termodinámicas de un sistema de dos niveles.</goal>
<given>
<g>Postulado fundamental: los microestados accesibles del sistema total aislado (sistema + baño, energía \(E\)) son igualmente probables. Entropía de Boltzmann: \(S=k\ln\Omega\); temperatura: \(1/T=\partial S/\partial E\).</g>
</given>
<step op="Probabilidad del microestado \(i\) del sistema (el baño absorbe la energía restante)">
\[P_i\propto\Omega_R(E-\varepsilon_i).\]
</step>
<step op="Desarrollar \(\ln\Omega_R\) en torno a \(E\), con \(\varepsilon_i\ll E\)">
\[\ln\Omega_R(E-\varepsilon_i)\simeq\ln\Omega_R(E)-\varepsilon_i\frac{\partial\ln\Omega_R}{\partial E}=\ln\Omega_R(E)-\frac{\varepsilon_i}{kT}.\]
<why>El primer término de la serie ya basta porque el baño es enorme: su temperatura no cambia al ceder \(\varepsilon_i\).</why>
</step>
<step op="Normalizar">
\[P_i=\frac{e^{-\beta\varepsilon_i}}Z,\qquad Z=\sum_ie^{-\beta\varepsilon_i},\qquad\beta=\frac1{kT}.\]
</step>
<step op="Relaciones termodinámicas">
\[U=-\frac{\partial\ln Z}{\partial\beta},\qquad F=-kT\ln Z,\qquad S=\frac{U-F}T=k(\ln Z+\beta U),\qquad C=\frac{\partial U}{\partial T}.\]
</step>
<step op="Sistema de dos niveles (energías 0 y \(\Delta\)), \(x=\Delta/kT\)">
\[Z=1+e^{-x},\quad P_1=\frac1{e^x+1},\quad\frac UN=\frac\Delta{e^x+1},\quad\frac C{Nk}=\frac{x^2e^x}{(1+e^x)^2},\quad\frac S{Nk}=\ln(1+e^{-x})+\frac x{e^x+1}.\]
</step>
<result name="Distribución de Boltzmann">\[P_i=\frac{e^{-\varepsilon_i/kT}}{Z},\qquad\frac C{Nk}=\frac{x^2e^x}{(1+e^x)^2}\ \ (\text{dos niveles}).\]</result>
<vars>
<v s="P_i" n="probabilidad del microestado \(i\)" u="1"/>
<v s="\varepsilon_i" n="energía del microestado" u="J"/>
<v s="\beta" n="inverso de \(kT\)" u="J^-1"/>
<v s="Z" n="función de partición" u="1"/>
<v s="\Delta" n="separación de los niveles" u="J"/>
<v s="x" n="cociente \(\Delta/kT\)" u="1"/>
<v s="U,\,F" n="energía interna y libre de Helmholtz" u="J"/>
<v s="C,\,S" n="capacidad calorífica y entropía" u="J K^-1"/>
<v s="N" n="número de sistemas" u="1"/>
<v s="k" n="constante de Boltzmann" u="J K^-1"/>
<v s="T" n="temperatura" u="K"/>
</vars>
<effects>
<e>Con \(\Delta=10\) meV y \(T=100\) K (\(x=1.1605\)): el nivel superior tiene población 0.2386, la energía media es 2.386 meV, \(C/Nk=0.2446\) y \(S/Nk=0.5494\). A 1000 K (\(x=0.1160\)), las poblaciones casi se igualan (0.4710) y \(S/Nk\to\ln2=0.6931\) (0.69147); a 30 K (\(x=3.868\)), \(C/Nk=0.3000\).</e>
<e>El calor específico presenta un máximo, la anomalía de Schottky: \(C/Nk=0.4392\) en \(x=2.399\), que para \(\Delta=10\) meV corresponde a \(T=48.4\) K. A \(T\gg\Delta/k\) decae como \(T^{-2}\) (a 1000 K, 0.003355) y a \(T\ll\Delta/k\) exponencialmente: la energía del sistema deja de poder absorber calor.</e>
<e>Los mismos niveles con \(\Delta\) diez veces menor (1 meV) a 100 K tienen \(x=0.1160\) y casi igual población en ambos niveles (0.4710): la separación determina qué temperatura es «alta».</e>
</effects>
<limits>
<l>Dimensiones: \(\beta\varepsilon\) y \(x=\Delta/kT\) son adimensionales; \(C\) y \(S\) tienen unidades de \(k\). ✓</l>
<l>Hace falta un baño suficientemente grande y un sistema débilmente acoplado. Aplica a espines en un campo (paramagnetismo, resonancia magnética), defectos en cristales, etc.; los sistemas reales de varios niveles se obtienen sumando más términos a \(Z\).</l>
</limits>
<explore sim="dos-niveles" title="Sistema de dos niveles: poblaciones, energía, calor específico y entropía"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (10 meV, 100 K): \(x=1.16045\), \(P_1=0.238585\), \(U/N=2.38585\) meV, \(C/Nk=0.244635\) y \(S/Nk=0.549444\).</li>
<li>Seleccione \(T\) en el eje: la curva \(C/Nk\) sube hasta 0.4392 (a 48.4 K) y luego baja como \(T^{-2}\); \(S/Nk\) tiende a \(\ln 2\).</li>
</ul></div>
</deriv>

<deriv id="einstein-solido" title="El oscilador cuántico y el calor específico de Einstein" tags="Mecánica estadística, Sólidos">
<goal>La energía media de un oscilador armónico cuántico a temperatura \(T\), y el calor específico de un sólido modelado como \(3N\) osciladores iguales.</goal>
<given>
<g>Niveles del oscilador: \(E_n=\hbar\omega(n+\tfrac12)\), \(n=0,1,2,\dots\). Distribución de Boltzmann para cada oscilador.</g>
<g>Modelo de Einstein: cada átomo de un sólido es un oscilador independiente en 3 direcciones, de frecuencia \(\omega\).</g>
</given>
<step op="Función de partición (serie geométrica), con \(x=\hbar\omega/kT=\theta_E/T\)">
\[Z=\sum_{n=0}^\infty e^{-x(n+1/2)}=\frac{e^{-x/2}}{1-e^{-x}}=\frac1{2\sinh(x/2)}.\]
</step>
<step op="Energía media">
\[\langle E\rangle=-\frac{\partial\ln Z}{\partial\beta}=\hbar\omega\left(\frac12+\frac1{e^x-1}\right).\]
<why>El término \(\tfrac12\hbar\omega\) es la energía del punto cero; \(\bar n=1/(e^x-1)\) es el número medio de cuantos (distribución de Bose–Einstein para \(\mu=0\)).</why>
</step>
<step op="Calor específico de \(3N\) osciladores (un mol: \(N=N_A\))">
\[C_v=\frac{\partial(3N\langle E\rangle)}{\partial T}=3R\,\frac{x^2e^x}{(e^x-1)^2}.\]
</step>
<step op="Límite clásico \(x\to0\) y límite cuántico \(x\to\infty\)">
\[C_v\simeq3R\left(1-\frac{x^2}{12}+\cdots\right)\ \ \text{(Dulong–Petit)},\qquad C_v\simeq3R\,x^2e^{-x}\ \to0.\]
</step>
<result name="Calor específico de Einstein">\[C_v=3R\left(\frac{\theta_E}T\right)^2\frac{e^{\theta_E/T}}{\left(e^{\theta_E/T}-1\right)^2}.\]</result>
<vars>
<v s="E_n" n="nivel de energía" u="J"/>
<v s="\hbar\omega" n="cuanto de energía" u="J"/>
<v s="x" n="\(\theta_E/T\)" u="1"/>
<v s="\theta_E" n="temperatura de Einstein" u="K"/>
<v s="Z" n="función de partición" u="1"/>
<v s="\langle E\rangle" n="energía media de un oscilador" u="J"/>
<v s="C_v" n="calor específico molar" u="J mol^-1 K^-1"/>
<v s="R" n="constante de los gases" u="J mol^-1 K^-1"/>
<v s="T" n="temperatura" u="K"/>
<v s="\bar n" n="número medio de cuantos" u="1"/>
</vars>
<effects>
<e>Diamante (\(\theta_E\approx1320\) K) a 300 K (\(x=4.4\)): \(C_v=6.077\) J/(mol·K), solo 24.4 % del valor de Dulong–Petit, en acuerdo con el valor medido (≈ 6.1); a 1000 K, \(C_v=21.62\) (86.7 %), y a 100 K, \(8.0\times10^{-3}\): los modos «congelados» no almacenan energía.</e>
<e>Un sólido blando como el plomo o el sodio (\(\theta_E\) del orden de 100–200 K) está en el régimen clásico a 300 K. Con \(\theta_E=300\) K: a 300 K, 22.96 J/(mol·K) (92.1 %); a 3000 K, 24.92 (99.92 %); a 30 K, 0.113.</e>
<e>La vibración de las moléculas diatómicas obedece la misma fórmula (por mol de modos, \(C_v^\text{vib}/R=x^2e^x/(e^x-1)^2\)): el N₂ (\(\theta_\text{vib}=3374\) K) aporta 0.00165 \(R\) a 300 K, 0.418 \(R\) a 1000 K y 0.793 \(R\) a 2000 K, y el H₂ (6215 K) solo \(4.3\times10^{-7}R\) a 300 K: por eso el aire tiene \(\gamma=1.4\) a temperatura ambiente (capítulo 17).</e>
</effects>
<limits>
<l>Dimensiones: \(x\) es adimensional y \(C_v\) tiene unidades de \(R\). ✓</l>
<l>Es el primer modelo cuántico del calor específico (Einstein, 1907) y explica la caída a baja temperatura, pero predice una caída exponencial, mientras que los sólidos reales siguen \(C_v\propto T^3\) por los modos de baja frecuencia (modelo de Debye, capítulo 34). Tampoco incluye anarmonicidad.</l>
</limits>
<explore sim="einstein" title="Calor específico de Einstein: congelación de los modos de vibración"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(\theta_E=1320\) K, 300 K): \(C_v=6.07708\) J/(mol·K), \(C_v/3R=0.243635\), \(\bar n=0.0124299\) y \(U=16871.9\) J/mol (casi todo, 16462.6, es energía de punto cero).</li>
<li>Seleccione \(T\) en el eje: \(C_v\) sube como \(x^2e^{-x}\) y se satura en \(3R=24.94\) J/(mol·K); con \(\theta_E=300\) K y \(T=300\) K (\(x=1\)) es 0.9207.</li>
</ul></div>
</deriv>

<deriv id="sackur-tetrode" title="La entropía absoluta del gas ideal: Sackur–Tetrode" tags="Mecánica estadística, Entropía">
<goal>La entropía de un gas ideal monoatómico a partir de la función de partición, incluida la constante aditiva.</goal>
<given>
<g>Energía de una partícula libre \(p^2/2m\) en una caja de volumen \(V\); el número de estados cuánticos en una celda del espacio de fases \(\mathrm d^3q\,\mathrm d^3p\) es \(\mathrm d^3q\,\mathrm d^3p/h^3\).</g>
<g>Las \(N\) partículas son idénticas e indistinguibles: \(Z=z^N/N!\) (aproximación de Stirling \(\ln N!\simeq N\ln N-N\)).</g>
</given>
<step op="Función de partición de una partícula">
\[z=\frac1{h^3}\int\mathrm d^3q\int e^{-p^2/2mkT}\mathrm d^3p=\frac{V\,(2\pi mkT)^{3/2}}{h^3}=\frac V{\lambda^3},\qquad\lambda=\frac h{\sqrt{2\pi mkT}}.\]
</step>
<step op="Energía libre del gas">
\[F=-kT\ln Z=-NkT\left[\ln\frac V{N\lambda^3}+1\right].\]
</step>
<step op="Presión y energía">
\[p=-\frac{\partial F}{\partial V}=\frac{NkT}V,\qquad U=-\frac{\partial\ln Z}{\partial\beta}=\tfrac32NkT.\]
<why>Recupera la ley del gas ideal y la equipartición, sin haberlas supuesto.</why>
</step>
<step op="Entropía \(S=(U-F)/T\)">
\[S=Nk\left[\ln\frac{V}{N\lambda^3}+\frac52\right]=Nk\left[\ln\frac{kT}{p\,\lambda^3}+\frac52\right].\]
</step>
<result name="Sackur–Tetrode">\[S=Nk\left[\ln\!\left(\frac{V}{N}\,\frac{(2\pi mkT)^{3/2}}{h^3}\right)+\frac52\right].\]</result>
<vars>
<v s="S" n="entropía" u="J K^-1"/>
<v s="N" n="número de átomos" u="1"/>
<v s="k" n="constante de Boltzmann" u="J K^-1"/>
<v s="\lambda" n="longitud de onda térmica de de Broglie" u="m"/>
<v s="V" n="volumen" u="m^3"/>
<v s="m" n="masa del átomo" u="kg"/>
<v s="h" n="constante de Planck" u="J s"/>
<v s="T" n="temperatura" u="K"/>
<v s="p" n="presión" u="Pa"/>
<v s="n" n="densidad numérica \(N/V\)" u="m^-3"/>
<v s="F" n="energía libre de Helmholtz" u="J"/>
</vars>
<effects>
<e>Helio a 298.15 K y 1 bar: \(\lambda=50.54\) pm, \(n\lambda^3=3.136\times10^{-6}\) (muy clásico) y \(S=126.15\) J/(mol·K), igual al valor calorimétrico tabulado (126.15). Para Ne, Ar, Kr y Xe se obtiene 146.33, 154.85, 164.09 y 169.69 J/(mol·K), que coinciden con las tablas termoquímicas: la fórmula, con la constante \(h\), reproduce entropías medidas con calorimetría y tercera ley.</e>
<e>A presión constante \(S\) crece con \(\tfrac52R\ln T\): al duplicar la temperatura (596.3 K) sube 14.41 hasta 140.56 J/(mol·K); a 10 bar baja \(R\ln10=19.14\) hasta 107.01; y con el doble de masa molar crece \(\tfrac32R\ln2=8.645\): 134.80 J/(mol·K).</e>
<e>La fórmula falla cuando \(n\lambda^3\gtrsim1\): para He a 4.2 K y 1 bar \(\lambda=425.8\) pm y \(n\lambda^3=0.133\) y la entropía (37.55 J/(mol·K)) ya no es fiable; en \(T\to0\) diverge a \(-\infty\), lo que contradice la tercera ley y obliga a usar las estadísticas cuánticas (siguientes deducciones).</e>
</effects>
<limits>
<l>Dimensiones: \(V/(N\lambda^3)\) es adimensional; \(S\) tiene unidades de \(k\). ✓</l>
<l>Vale para un gas monoatómico clásico, \(n\lambda^3\ll1\) y sin grados de libertad internos (electrónicos, rotación y vibración los añaden). El factor \(1/N!\) elimina la paradoja de Gibbs (entropía de mezcla de gases idénticos).</l>
</limits>
<explore sim="sackur" title="Entropía absoluta de un gas monoatómico: Sackur–Tetrode"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (He, 298.15 K, 1 bar): \(S=126.153\) J/(mol·K), \(\lambda=50.5372\) pm, \(n\lambda^3=3.13557\times10^{-6}\) y \(S/Nk=15.1727\).</li>
<li>Seleccione \(M\) en el eje: \(S\) crece con \(\tfrac32R\ln M\); con \(M=131.3\) (Xe) es 169.69 J/(mol·K).</li>
</ul></div>
</deriv>

<deriv id="fermi-dirac" title="El gas de Fermi: la energía de Fermi y el calor específico electrónico" tags="Mecánica estadística, Fermiones">
<goal>El número medio de fermiones en un estado de energía \(\varepsilon\), la energía de Fermi de los electrones de un metal y su calor específico lineal en \(T\).</goal>
<given>
<g>Principio de exclusión de Pauli: cada estado de una partícula alberga 0 o 1 fermión. Electrones libres en una caja \(V\) con condiciones periódicas: los vectores de onda ocupan celdas de volumen \((2\pi)^3/V\) y cada uno admite 2 espines.</g>
<g>Distribución de Boltzmann generalizada (gran canónica) con potencial químico \(\mu\).</g>
</given>
<step op="Ocupación media de un orbital">
\[\Xi=1+e^{-\beta(\varepsilon-\mu)}\ \Rightarrow\ \langle n\rangle=\frac1{e^{(\varepsilon-\mu)/kT}+1}.\]
</step>
<step op="A \(T=0\) se llenan todos los estados hasta \(k_F\)">
\[N=2\,\frac V{(2\pi)^3}\,\frac43\pi k_F^3\ \Longrightarrow\ k_F=(3\pi^2n)^{1/3}.\]
</step>
<step op="Energía, temperatura y velocidad de Fermi">
\[E_F=\frac{\hbar^2k_F^2}{2m}=\frac{\hbar^2}{2m}(3\pi^2n)^{2/3},\qquad T_F=\frac{E_F}k,\qquad v_F=\frac{\hbar k_F}m.\]
</step>
<step op="Densidad de estados: \(N(\varepsilon)=N(\varepsilon/E_F)^{3/2}\)">
\[g(\varepsilon)=\frac{\mathrm dN}{\mathrm d\varepsilon}=\frac{3N}{2E_F}\sqrt{\frac\varepsilon{E_F}}\ \Longrightarrow\ g(E_F)=\frac{3N}{2E_F}.\]
</step>
<step op="Desarrollo de Sommerfeld para \(kT\ll E_F\)">
\[\int_0^\infty H(\varepsilon)\langle n\rangle\mathrm d\varepsilon\simeq\int_0^\mu H\,\mathrm d\varepsilon+\frac{\pi^2}6(kT)^2H'(\mu)\ \Longrightarrow\ U(T)-U(0)=\frac{\pi^2}6(kT)^2g(E_F).\]
<why>Solo los electrones a menos de unos \(kT\) de \(E_F\) pueden cambiar de estado; en la integral aparece \(H'(\mu)\) por la simetría de la función de Fermi alrededor de \(\mu\). El corrimiento de \(\mu\) con \(T\) se compensa para \(N\) fijo.</why>
</step>
<step op="Calor específico">
\[C=\frac{\partial U}{\partial T}=\frac{\pi^2}3k^2T\,g(E_F)=\frac{\pi^2}2Nk\,\frac T{T_F}.\]
</step>
<result name="Gas de Fermi">\[E_F=\frac{\hbar^2}{2m}(3\pi^2n)^{2/3},\qquad C_\text{el}=\frac{\pi^2}2\,Nk\,\frac T{T_F}.\]</result>
<vars>
<v s="n" n="densidad de electrones" u="m^-3"/>
<v s="k_F" n="vector de onda de Fermi" u="m^-1"/>
<v s="E_F" n="energía de Fermi" u="J"/>
<v s="T_F" n="temperatura de Fermi" u="K"/>
<v s="v_F" n="velocidad de Fermi" u="m s^-1"/>
<v s="\hbar" n="constante de Planck reducida" u="J s"/>
<v s="m" n="masa del electrón" u="kg"/>
<v s="C" n="capacidad calorífica" u="J K^-1"/>
<v s="N" n="número de electrones" u="1"/>
<v s="k" n="constante de Boltzmann" u="J K^-1"/>
<v s="T" n="temperatura" u="K"/>
<v s="\varepsilon,\,\mu" n="energía y potencial químico" u="J"/>
<v s="\beta" n="inverso de \(kT\)" u="J^-1"/>
</vars>
<effects>
<e>Cobre (\(n=8.47\times10^{28}\) m⁻³, un electrón por átomo): \(E_F=7.033\) eV, \(T_F=81\,612\) K y \(v_F=1.573\times10^{6}\) m/s (0.5 % de \(c\)). Sodio (2.65): 3.241 eV; aluminio (18.1): 11.67 eV; oro (5.90): 5.526 eV. Los electrones están «degenerados» a cualquier temperatura accesible, porque \(T_F\) es del orden de \(10^5\) K.</e>
<e>A 300 K, \(C_\text{el}/Nk=0.01814\), es decir, solo 1.2 % del valor clásico \(\tfrac32Nk\); por eso Dulong–Petit funciona aunque haya un electrón libre por átomo. El coeficiente de Sommerfeld es \(\gamma=0.503\) mJ/(mol·K²) para el Cu, frente a 0.695 medido: la masa efectiva térmica es \(m^*/m\approx1.38\) por las interacciones; con \(m^*=2m\), \(E_F=3.516\) eV y \(\gamma\) se duplica.</e>
<e>\(E_F\propto n^{2/3}\): al duplicar la densidad crece un 58.7 % (11.16 eV) y \(C_\text{el}/Nk\) cae en esa proporción (0.01143); a 3000 K (aún \(T\ll T_F\)), 0.1814, diez veces mayor que a 300 K. A 1 K, \(6.05\times10^{-5}\).</e>
</effects>
<limits>
<l>Dimensiones: \(\hbar^2n^{2/3}/m=\mathrm{J^2s^2m^{-2}/kg}\) = J. ✓</l>
<l>Modelo de electrones libres: ignora la red cristalina (bandas, capítulo 34) y las interacciones; la fórmula del calor específico exige \(T\ll T_F\). Explica también la presión de degeneración que sostiene a las enanas blancas (capítulo 38).</l>
</limits>
<explore sim="fermi" title="Gas de Fermi: energía, temperatura y velocidad de Fermi, y calor específico"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (Cu, \(m^*/m=1\), 300 K): \(E_F=7.03276\) eV, \(T_F=81611.8\) K, \(v_F=1.57285\times10^{6}\) m/s, \(C_\text{el}/Nk=0.0181400\) y \(\gamma=0.502749\) mJ/(mol·K²).</li>
<li>Seleccione \(n\) en el eje (log–log): \(E_F\) sube con pendiente \(2/3\) y \(C_\text{el}\) baja con pendiente \(-2/3\).</li>
</ul></div>
</deriv>

<deriv id="bose-einstein" title="La condensación de Bose–Einstein" tags="Mecánica estadística, Bosones">
<goal>El número medio de bosones en un estado, y la temperatura bajo la cual una fracción macroscópica del gas se acumula en el estado fundamental.</goal>
<given>
<g>Los bosones pueden ocupar un mismo estado con cualquier número de partículas \(n=0,1,2,\dots\) y se distribuyen con el factor de Boltzmann generalizado, con \(\mu\le0\).</g>
<g>Partículas libres en una caja \(V\): densidad de estados \(g(\varepsilon)=\dfrac V{4\pi^2}\left(\dfrac{2m}{\hbar^2}\right)^{3/2}\varepsilon^{1/2}\) (sin espín).</g>
</given>
<step op="Ocupación media de un orbital (serie geométrica)">
\[\Xi=\sum_{n=0}^\infty e^{-n\beta(\varepsilon-\mu)}=\frac1{1-e^{-\beta(\varepsilon-\mu)}}\ \Rightarrow\ \langle n\rangle=\frac1{e^{(\varepsilon-\mu)/kT}-1}.\]
</step>
<step op="Número de partículas excitadas en \(\mu=0\) (el máximo posible)">
\[N_\text{ex}=\int_0^\infty\frac{g(\varepsilon)\,\mathrm d\varepsilon}{e^{\varepsilon/kT}-1}=\frac V{4\pi^2}\left(\frac{2mkT}{\hbar^2}\right)^{3/2}\int_0^\infty\frac{x^{1/2}\,\mathrm dx}{e^x-1}.\]
</step>
<step op="Integral conocida: \(\int_0^\infty x^{1/2}/(e^x-1)\,\mathrm dx=\Gamma(\tfrac32)\zeta(\tfrac32)\)">
\[\frac{N_\text{ex}}V=\frac{\zeta(3/2)}{\lambda_T^3},\qquad\lambda_T=\frac h{\sqrt{2\pi mkT}}.\]
<why>\(\Gamma(3/2)=\sqrt\pi/2\) y \(\zeta(3/2)=2.612\). Las partículas que no caben en los estados excitados pasan al fundamental.</why>
</step>
<step op="Temperatura crítica: todas las partículas caben en los estados excitados (\(N_\text{ex}=N\))">
\[n\lambda_{T_c}^3=\zeta(\tfrac32)\ \Longrightarrow\ T_c=\frac{2\pi\hbar^2}{mk}\left(\frac n{\zeta(3/2)}\right)^{2/3}.\]
</step>
<step op="Fracción condensada para \(T<T_c\)">
\[\frac{N_0}N=1-\frac{N_\text{ex}}N=1-\left(\frac T{T_c}\right)^{3/2}.\]
<why>\(N_\text{ex}\propto T^{3/2}\) (de \(\lambda_T^{-3}\)).</why>
</step>
<result name="Condensación de Bose–Einstein">\[T_c=\frac{2\pi\hbar^2}{mk}\left(\frac n{\zeta(3/2)}\right)^{2/3},\qquad\frac{N_0}N=1-\left(\frac T{T_c}\right)^{3/2}.\]</result>

<effects>
<e>Si el helio-4 líquido (\(n=2.18\times10^{28}\) m⁻³, 4.0026 g/mol) se tratase como un gas ideal de bosones, \(T_c=3.133\) K; la transición superfluida observada ocurre a 2.17 K (las interacciones la reducen). A 1 K la fracción condensada ideal sería 0.820 (\(\lambda_T=0.873\) nm, \(n\lambda_T^3=14.49\)); a 2 K, 0.490; y a 3 K, 0.0629.</e>
<e>Una nube de rubidio-87 (86.909 g/mol) con \(n=10^{20}\) m⁻³ condensa por debajo de \(T_c=398.3\) nK. A 100 nK la fracción condensada es 0.874, a 170 nK, 0.721 y a 300 nK, 0.346; a 1 µK ya no hay condensado (\(n\lambda_T^3=0.657<2.612\)). Es el rango de temperaturas alcanzado en 1995, del orden de mil millones de veces menor que la ambiente.</e>
<e>\(T_c\propto n^{2/3}/m\): con una masa 4 veces menor o una densidad 8 veces mayor, \(T_c\) crece 4 veces. La condición de degeneración es la que ya apareció en Sackur–Tetrode: \(n\lambda^3\sim1\).</e>
</effects>
<limits>
<l>Dimensiones: \([\hbar^2n^{2/3}/(mk)]=\mathrm{J^2\,s^2\,m^{-2}/(kg\,J\,K^{-1})}=\mathrm K\). ✓</l>
<l>Es un gas ideal en una caja uniforme; en las trampas actuales el potencial armónico cambia el exponente (\(N_0/N=1-(T/T_c)^3\)) y las interacciones débiles dan correcciones pequeñas. Fotones y fonones no condensan porque su número no se conserva (\(\mu=0\)).</l>
</limits>
