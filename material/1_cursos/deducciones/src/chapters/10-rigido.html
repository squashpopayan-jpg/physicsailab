<template class="chapter-src" data-id="rigido" data-num="10" data-title="Cuerpo rígido" data-part="Parte II · Mecánica clásica" data-short="Momentos de inercia y el teorema de Steiner, la rodadura en un plano inclinado, la precesión del giróscopo, la inestabilidad del eje intermedio (teorema de la raqueta de tenis) y el golpe de billar que hace rodar la bola">
<p class="lead">Un cuerpo rígido es un sistema de partículas cuyas distancias no cambian. Su movimiento es una traslación del centro de masas más una rotación, y la rotación obedece una ecuación gemela de la de Newton: \(\mathrm d\mathbf L/\mathrm dt=\boldsymbol\tau\), con \(\mathbf L=I\boldsymbol\omega\) cuando se gira alrededor de un eje principal. Ese paralelismo explica casi todo: la inercia rotacional \(I\) hace de masa, el torque de fuerza, \(\tfrac12I\omega^2\) de energía. En este capítulo se calculan los momentos de inercia de los cuerpos habituales, se analiza la rodadura, se deduce por qué un giróscopo no cae sino que precesa, por qué girar alrededor del eje intermedio es inestable (la «raqueta de tenis») y desde qué altura debe golpearse una bola de billar para que ruede sin deslizar.</p>

<deriv id="momentos-inercia" title="Momentos de inercia y el teorema de Steiner" tags="Rotación, Integrales">
<goal>El momento de inercia \(I=\int r_\perp^2\,\mathrm dm\) de la varilla, el disco, el aro y la esfera, y su cambio al desplazar el eje.</goal>
<given>
<g>La energía cinética de un cuerpo que gira con velocidad angular \(\omega\) alrededor de un eje fijo es \(K=\sum\tfrac12m_i(\omega r_{\perp i})^2=\tfrac12I\omega^2\), con \(I=\sum m_ir_{\perp i}^2\).</g>
<g>Cuerpos homogéneos: la densidad es constante y la masa de cada elemento es densidad por volumen.</g>
</given>
<step op="Varilla delgada de longitud \(L\) por su centro">
\[I=\int_{-L/2}^{L/2}x^2\,\frac mL\,\mathrm dx=\frac mL\cdot\frac{2}{3}\Big(\frac L2\Big)^3=\frac{mL^2}{12}.\]
</step>
<step op="Aro y disco de radio \(R\), eje perpendicular por el centro">
\[\text{aro: }I=mR^2;\qquad \text{disco: }I=\int_0^Rr^2\,\frac m{\pi R^2}\,2\pi r\,\mathrm dr=\frac{2m}{R^2}\cdot\frac{R^4}4=\frac12mR^2.\]
<why>En el aro toda la masa está a la distancia \(R\). En el disco, el anillo entre \(r\) y \(r+\mathrm dr\) tiene masa \(\sigma\,2\pi r\,\mathrm dr\).</why>
</step>
<step op="Esfera maciza: apilar discos">
\[I=\int_{-R}^{R}\tfrac12\,\mathrm dm\,(R^2-z^2),\quad \mathrm dm=\rho\pi(R^2-z^2)\,\mathrm dz\ \Rightarrow\ I=\frac{\pi\rho}2\int_{-R}^{R}(R^2-z^2)^2\mathrm dz=\frac{\pi\rho}2\cdot\frac{16R^5}{15}=\frac25mR^2.\]
<why>Cada rebanada es un disco de radio \(\sqrt{R^2-z^2}\) y momento \(\tfrac12\,\mathrm dm\,(R^2-z^2)\); con \(\rho=3m/4\pi R^3\) queda \(\tfrac25mR^2\).</why>
</step>
<step op="Teorema de Steiner (ejes paralelos)">
\[I=\int|\mathbf r_{cm}+\mathbf r'|_\perp^2\mathrm dm=I_{cm}+md^2+2\,\mathbf d\cdot\int\mathbf r'\,\mathrm dm=I_{cm}+md^2.\]
<why>Con \(\mathbf r=\mathbf r_{cm}+\mathbf r'\), el término cruzado es proporcional a \(\int\mathbf r'\mathrm dm=0\) (definición del centro de masas); \(d\) es la distancia entre los ejes.</why>
</step>
<step op="Aplicación: varilla por un extremo">
\[I=\frac{mL^2}{12}+m\Big(\frac L2\Big)^2=\frac{mL^2}3.\]
</step>
<result name="Momentos de inercia">\[I_\text{varilla}=\tfrac1{12}mL^2,\quad I_\text{aro}=mR^2,\quad I_\text{disco}=\tfrac12mR^2,\quad I_\text{esfera}=\tfrac25mR^2,\quad I=I_{cm}+md^2.\]</result>
<vars>
<v s="I" n="momento de inercia" u="kg m^2"/>
<v s="m" n="masa" u="kg"/>
<v s="R" n="radio" u="m"/>
<v s="L" n="longitud de la varilla" u="m"/>
<v s="d" n="distancia entre el eje por el centro de masas y el eje paralelo" u="m"/>
<v s="r_\perp" n="distancia al eje" u="m"/>
</vars>
<effects>
<e>Con \(m=1\) kg, \(R=0.1\) m: disco \(5.0\times10^{-3}\) kg·m², esfera \(4.0\times10^{-3}\), aro \(1.0\times10^{-2}\) y varilla de 0.2 m por el centro \(3.33\times10^{-3}\) (por un extremo, \(1.33\times10^{-2}\), cuatro veces más). Con el eje del disco a \(d=0.05\) m: \(7.5\times10^{-3}\).</e>
<e>\(I\propto mR^2\): \(n_R=2\) y \(n_m=1\); el radio de giro del disco, \(R/\sqrt2=0.0707\) m, es la distancia a la que se concentraría la masa para la misma inercia. La masa lejana del eje cuenta mucho más: el aro, con toda la masa en el borde, tiene el doble de inercia que el disco.</e>
<e>Steiner: el momento mínimo siempre es por el centro de masas; alejar el eje \(d\) suma \(md^2\), que domina para \(d\gg R\): con \(d=R\) el disco ya triplica su inercia (\(0.5\to1.5\,mR^2\)).</e>
</effects>
<limits>
<l>Dimensiones: \([mR^2]=\mathsf M\mathsf L^2\). ✓</l>
<l>Comprobaciones: el aro (\(mR^2\)) es el máximo posible para un cuerpo de radio \(R\); una esfera hueca da \(\tfrac23mR^2\) (entre la maciza y el aro) y una esfera con toda la masa en el centro, 0. Steiner solo vale si uno de los dos ejes pasa por el centro de masas.</l>
</limits>
<explore sim="inercia" title="Momentos de inercia de varilla, disco, aro y esfera, y el teorema de Steiner"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(m=1\), \(R=0.1\), \(d=0.05\)): disco 0.005, esfera 0.004, aro 0.01, varilla \(3.3333\times10^{-3}\), disco con eje desplazado 0.0075 y radio de giro 0.070711.</li>
<li>Seleccione \(d\) en el eje (log–log): para \(d\) pequeño la curva es plana en \(I_{cm}=0.005\); para \(d\gg R\) sigue \(md^2\) (pendiente 2).</li>
</ul></div>
</deriv>

<deriv id="rodar-plano" title="Rodar sin deslizar por un plano inclinado" tags="Rotación, Rozamiento">
<goal>La aceleración, la rapidez al final y el rozamiento necesario para un cuerpo de inercia \(I=c\,mR^2\) que rueda sin deslizar por un plano de ángulo \(\theta\).</goal>
<given>
<g>Segunda ley de Newton para el centro de masas y \(I\alpha=\tau\) respecto del centro de masas.</g>
<g>Condición de rodadura: el punto de contacto está instantáneamente en reposo, \(v=\omega R\) y \(a=\alpha R\). El rozamiento estático \(f\) (hacia arriba del plano) no disipa energía.</g>
</given>
<step op="Ecuación de traslación a lo largo del plano">
\[ma=mg\sin\theta-f.\]
</step>
<step op="Ecuación de rotación respecto del centro">
\[fR=I\alpha=I\frac aR\ \Longrightarrow\ f=\frac I{R^2}a=c\,m\,a.\]
<why>Solo el rozamiento tiene torque respecto del centro: el peso actúa en él y la normal pasa por él.</why>
</step>
<step op="Resolver para la aceleración y la fuerza de rozamiento">
\[a=\frac{g\sin\theta}{1+c},\qquad f=\frac{c}{1+c}\,mg\sin\theta.\]
<why>De \(ma=mg\sin\theta-cma\).</why>
</step>
<step op="Exigir que el rozamiento estático alcance">
\[f\le\mu N=\mu\,mg\cos\theta\ \Longrightarrow\ \mu\ge\frac c{1+c}\tan\theta.\]
</step>
<step op="Comprobar con la energía">
\[\tfrac12mv^2+\tfrac12I\frac{v^2}{R^2}=mgh\ \Longrightarrow\ v=\sqrt{\frac{2gh}{1+c}}.\]
<why>Coincide con \(v^2=2a\,(h/\sin\theta)\). El rozamiento estático no trabaja porque su punto de aplicación no se mueve.</why>
</step>
<result name="Rodadura en un plano inclinado">\[a=\frac{g\sin\theta}{1+I/mR^2},\qquad \mu_\text{mín}=\frac{c}{1+c}\tan\theta,\qquad v=\sqrt{\frac{2gh}{1+c}}.\]</result>
<vars>
<v s="a" n="aceleración del centro de masas" u="m s^-2"/>
<v s="\theta" n="inclinación del plano" u="rad"/>
<v s="c" n="factor de inercia \(I/mR^2\)" u="1"/>
<v s="f" n="fuerza de rozamiento estático" u="N"/>
<v s="\mu" n="coeficiente de rozamiento estático" u="1"/>
<v s="v" n="rapidez al descender \(h\)" u="m s^-1"/>
<v s="h" n="altura descendida" u="m"/>
<v s="g" n="aceleración de la gravedad" u="m s^-2"/>
<v s="m" n="masa" u="kg"/>
</vars>
<effects>
<e>A 30° (\(g=9.81\)): esfera maciza (\(c=0.4\)), \(a=3.504\) m/s², \(\mu_\text{mín}=0.165\) y \(v=3.744\) m/s tras bajar 1 m; cilindro macizo (\(c=0.5\)), 3.270, 0.192 y 3.617; casquete esférico (\(c=2/3\)), 2.943, 0.231 y 3.431; aro (\(c=1\)), 2.452, 0.289 y 3.132. Sin rozamiento (bloque que desliza), 4.905 y 4.429. Gana la esfera, luego el cilindro y el aro: el ganador solo depende de \(c\), no de la masa ni del radio.</e>
<e>\(a\) baja cuando \(c\) sube: con más masa lejos del eje, más energía va a la rotación. Con \(c\to0\), \(a\to g\sin\theta\) (toda la masa en el centro); con \(c\to\infty\), \(a\to0\).</e>
<e>El coeficiente de rozamiento necesario crece con la pendiente: para el aro a 30° hace falta 0.289; a 60°, 0.866. Si \(\mu\) es menor, el cuerpo patina mientras gira.</e>
</effects>
<limits>
<l>Dimensiones: \(c\) es adimensional y \([g\sin\theta]=\mathsf L\mathsf T^{-2}\). ✓</l>
<l>Vale para rodadura pura; si \(\mu\) es insuficiente, se pasa a deslizar con rozamiento cinético (y se disipa energía). La rodadura sobre un suelo deformable añade un par de resistencia (coeficiente de rodadura, capítulo 7).</l>
</limits>
<explore sim="rodar" title="Rodadura por un plano inclinado: aceleración, rapidez y rozamiento necesario"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (esfera, \(c=0.4\), 30°, \(h=1\) m): \(a=3.5036\) m/s², \(v=3.7436\) m/s, \(\mu_\text{mín}=0.16496\) y \(f/mg=0.14286\) (=1/7).</li>
<li>Ponga \(c=1\) (aro): \(a=2.4525\), \(\mu_\text{mín}=0.28868\); con \(c=0.5\) (cilindro): 3.27.</li>
</ul></div>
</deriv>

<deriv id="giroscopio" title="La precesión del giróscopo" tags="Rotación, Torque">
<goal>La velocidad con que un giróscopo que gira rápido gira alrededor de la vertical bajo la acción de su peso.</goal>
<given>
<g>\(\mathrm d\mathbf L/\mathrm dt=\boldsymbol\tau\) respecto del pivote, con \(\mathbf L=I\omega\hat n\) a lo largo del eje de giro (\(\omega\) muy grande: se desprecia el momento angular de la precesión).</g>
<g>El peso \(mg\) actúa en el centro de masas, a distancia \(d\) del pivote sobre el eje.</g>
</given>
<step op="Calcular el torque del peso">
\[\boldsymbol\tau=\mathbf d\times m\mathbf g,\qquad |\boldsymbol\tau|=mgd\sin\alpha,\]
<why>\(\alpha\) es el ángulo del eje con la vertical. El torque es horizontal y perpendicular tanto al eje como a la vertical.</why>
</step>
<step op="Aplicar \(\mathrm d\mathbf L/\mathrm dt=\boldsymbol\tau\)">
\[\mathrm d\mathbf L=\boldsymbol\tau\,\mathrm dt\ \perp\ \mathbf L\ \Longrightarrow\ |\mathbf L|\ \text{no cambia, solo gira}.\]
<why>Un cambio perpendicular al vector no altera su módulo, solo su dirección: el eje se mueve en la dirección del torque, no hacia abajo.</why>
</step>
<step op="Relacionar con el ángulo de precesión \(\mathrm d\psi\)">
\[|\mathrm d\mathbf L|=L\sin\alpha\,\mathrm d\psi=mgd\sin\alpha\,\mathrm dt.\]
<why>La punta de \(\mathbf L\) recorre un círculo horizontal de radio \(L\sin\alpha\); en \(\mathrm dt\) avanza \(L\sin\alpha\,\mathrm d\psi\).</why>
</step>
<step op="Despejar la velocidad de precesión">
\[\Omega=\frac{\mathrm d\psi}{\mathrm dt}=\frac{mgd}{L}=\frac{mgd}{I\omega}.\]
<why>El factor \(\sin\alpha\) se cancela: la precesión no depende de la inclinación.</why>
</step>
<step op="Condición de validez">
\[\omega\gg\Omega\ \Longleftrightarrow\ \frac{I\omega^2}{mgd}\gg1.\]
</step>
<result name="Precesión del giróscopo">\[\Omega=\frac{mgd}{I\omega}.\]</result>
<vars>
<v s="\Omega" n="velocidad de precesión" u="rad s^-1"/>
<v s="m" n="masa" u="kg"/>
<v s="g" n="aceleración de la gravedad" u="m s^-2"/>
<v s="d" n="distancia del centro de masas al pivote" u="m"/>
<v s="I" n="momento de inercia respecto del eje de giro" u="kg m^2"/>
<v s="\omega" n="velocidad de giro propio" u="rad s^-1"/>
</vars>
<effects>
<e>Disco de 0.5 kg y 5 cm de radio (\(I=6.25\times10^{-4}\) kg·m²) con \(d=5\) cm y giro de 125.66 rad/s (20 rev/s): \(\Omega=3.122\) rad/s, un periodo de precesión de 2.013 s y \(\omega/\Omega=40.3\).</e>
<e>\(\Omega\propto1/\omega\): al frenarse por rozamiento, el giróscopo precesa más rápido (con \(\omega\) a la mitad, 6.243 rad/s), hasta que \(\omega\sim\Omega\) y cae. Duplicar \(d\) o \(m\) duplica \(\Omega\) (\(n=1\)); duplicar \(I\) lo divide por dos.</e>
<e>La misma física explica la precesión de los equinoccios de la Tierra (el torque de la Luna y el Sol sobre su abultamiento ecuatorial, con periodo cercano a 26 000 años) y la estabilidad de una bicicleta.</e>
</effects>
<limits>
<l>Dimensiones: \([mgd/(I\omega)]=\mathsf M\mathsf L\mathsf T^{-2}\mathsf L/(\mathsf M\mathsf L^2\mathsf T^{-1})=\mathsf T^{-1}\). ✓</l>
<l>La aproximación giroscópica desprecia la nutación y el momento angular de la precesión (corrección relativa \(\Omega/\omega\)). Para \(\omega\to0\) la fórmula pierde sentido: el cuerpo simplemente cae.</l>
</limits>
<explore sim="giroscopio" title="Precesión de un giróscopo según masa, brazo, inercia y giro"/>
<div class="sim-guide"><ul>
<li>Valores iniciales: \(\Omega=3.1216\) rad/s, periodo 2.0128 s y \(\omega/\Omega=40.254\).</li>
<li>Seleccione ω en el eje (log–log): recta de pendiente −1. La tabla de sensibilidad confirma \(n_\omega=-1\), \(n_I=-1\), \(n_m=n_d=1\).</li>
</ul></div>
</deriv>

<deriv id="euler-libre" title="La rotación libre y el teorema de la raqueta de tenis" tags="Rotación, Estabilidad">
<goal>Qué ocurre cuando un cuerpo con tres momentos principales distintos gira libremente alrededor de cada uno de sus ejes principales y recibe una pequeña perturbación.</goal>
<given>
<g>Sin torque, \(\mathbf L\) es constante en el espacio; en el sistema del cuerpo, \((\dot{\mathbf L})_\text{cuerpo}+\boldsymbol\omega\times\mathbf L=0\) con \(\mathbf L=(I_1\omega_1,I_2\omega_2,I_3\omega_3)\) en los ejes principales.</g>
<g>\(I_1\lt I_2\lt I_3\). Perturbaciones pequeñas: se desprecia el producto de dos perturbaciones.</g>
</given>
<step op="Escribir las ecuaciones de Euler">
\[I_1\dot\omega_1=(I_2-I_3)\,\omega_2\omega_3,\quad I_2\dot\omega_2=(I_3-I_1)\,\omega_3\omega_1,\quad I_3\dot\omega_3=(I_1-I_2)\,\omega_1\omega_2.\]
<why>Componente 1 de \(\boldsymbol\omega\times\mathbf L\): \(\omega_2I_3\omega_3-\omega_3I_2\omega_2=(I_3-I_2)\omega_2\omega_3\), que pasa con signo cambiado al otro miembro.</why>
</step>
<step op="Giro alrededor del eje 2 con \(\omega_2\simeq\Omega\) y perturbaciones \(\omega_1,\omega_3\)">
\[\dot\omega_1=\frac{I_2-I_3}{I_1}\,\Omega\,\omega_3,\qquad \dot\omega_3=\frac{I_1-I_2}{I_3}\,\Omega\,\omega_1,\qquad \dot\omega_2\simeq0.\]
<why>En la ecuación 2, el segundo miembro es producto de dos pequeñas, y se desprecia.</why>
</step>
<step op="Eliminar \(\omega_3\)">
\[\ddot\omega_1=\frac{(I_2-I_3)(I_1-I_2)}{I_1I_3}\,\Omega^2\,\omega_1=\lambda^2\omega_1,\qquad \lambda=\Omega\sqrt{\frac{(I_2-I_1)(I_3-I_2)}{I_1I_3}}.\]
<why>Con \(I_1\lt I_2\lt I_3\), los dos factores son negativos y su producto es positivo: \(\ddot\omega_1=+\lambda^2\omega_1\) tiene soluciones \(\mathrm e^{\pm\lambda t}\): la perturbación crece exponencialmente. El eje intermedio es inestable.</why>
</step>
<step op="Repetir con el eje 1 y con el eje 3">
\[\ddot\omega_2=-\omega_{(1)}^2\omega_2,\quad \omega_{(1)}=\Omega\sqrt{\frac{(I_2-I_1)(I_3-I_1)}{I_2I_3}};\qquad \omega_{(3)}=\Omega\sqrt{\frac{(I_3-I_1)(I_3-I_2)}{I_1I_2}}.\]
<why>En los ejes extremos el producto de los factores es negativo (\(\ddot\omega=-\omega^2_{(i)}\,\omega\)): oscilaciones pequeñas, no crecimiento. Son estables.</why>
</step>
<step op="Interpretar">
\[\text{menor }I:\ \text{estable};\qquad\text{intermedio: inestable};\qquad\text{mayor }I:\ \text{estable}.\]
<why>Es el «teorema de la raqueta de tenis»: al lanzar una raqueta girando alrededor del eje intermedio, da una media vuelta alrededor de otro eje en tiempos de orden \(1/\lambda\) (efecto Dzhanibékov).</why>
</step>
<result name="Estabilidad de la rotación libre">\[\lambda_2=\Omega\sqrt{\frac{(I_2-I_1)(I_3-I_2)}{I_1I_3}}\ \text{(crecimiento)},\quad \omega_{(1)},\ \omega_{(3)}\ \text{(oscilación estable)}.\]</result>
<vars>
<v s="I_1,\,I_2,\,I_3" n="momentos principales de inercia" u="kg m^2"/>
<v s="\Omega" n="velocidad angular alrededor del eje principal" u="rad s^-1"/>
<v s="\omega_1,\,\omega_2,\,\omega_3" n="componentes de la velocidad angular" u="rad s^-1"/>
<v s="\lambda" n="tasa de crecimiento de la inestabilidad" u="s^-1"/>
<v s="\omega_{(1)},\,\omega_{(3)}" n="frecuencias de oscilación alrededor de los ejes estables" u="rad s^-1"/>
</vars>
<effects>
<e>Con \(I_1:I_2:I_3=1:2:4\) y \(\Omega=10\) rad/s: \(\lambda=7.071\ \mathrm s^{-1}\) (tiempo de crecimiento 0.1414 s); alrededor del eje 1, oscila a 6.124 rad/s; alrededor del eje 3, a 17.32 rad/s (periodos 1.026 s y 0.363 s).</e>
<e>La inestabilidad crece con la velocidad de giro (\(\lambda\propto\Omega\), \(n=1\)) pero con una diferencia entre inercias pequeña es lenta: con \(I_1:I_2:I_3=1:1.1:1.21\), \(\lambda=0.953\ \mathrm s^{-1}\), todavía visible en un segundo. El cuerpo no necesita ser muy asimétrico para voltearse.</e>
<e>Si dos inercias son iguales (cuerpo simétrico: trompo libre o balón), \(\lambda=0\): sin eje intermedio, el giro es siempre estable, con precesión del eje en vez de volteo.</e>
</effects>
<limits>
<l>Dimensiones: \(\lambda\) tiene dimensión de \(\Omega\) (los cocientes de inercias son adimensionales). ✓</l>
<l>El resultado vale mientras la perturbación sea pequeña; para amplitudes grandes se resuelven las ecuaciones de Euler exactamente, con funciones elípticas de Jacobi (el movimiento es periódico, una media vuelta cada \(\sim\ln(1/\epsilon)/\lambda\)). Un cuerpo con disipación acaba girando alrededor del eje de mayor inercia (por eso el primer satélite de EE. UU. empezó a «tambalearse», Explorer 1).</l>
</limits>
<explore sim="euler-libre" title="Rotación libre: crecimiento de la inestabilidad del eje intermedio y oscilaciones estables"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(I_2/I_1=2\), \(I_3/I_2=2\), \(\Omega=10\)): \(\lambda=7.0711\ \mathrm s^{-1}\), \(1/\lambda=0.14142\) s, \(\omega_{(1)}=6.1237\) y \(\omega_{(3)}=17.3205\) rad/s.</li>
<li>Seleccione \(I_2/I_1\) en el eje: cuando tiende a 1, \(\lambda\to0\) (cuerpo simétrico).</li>
</ul></div>
</deriv>

<deriv id="billar" title="El golpe de billar: desde dónde hay que pegar para que ruede" tags="Rotación, Choques">
<goal>La altura del golpe para que una bola, inicialmente en reposo sobre la mesa, ruede sin deslizar desde el primer instante, y su velocidad final cuando el golpe es a otra altura.</goal>
<given>
<g>Un impulso horizontal \(J\) a una altura \(h\) sobre el centro de la bola (esfera maciza, \(I=\tfrac25mR^2\)), de duración muy corta: el rozamiento con la mesa no actúa durante el golpe.</g>
<g>Rozamiento cinético mientras desliza; el torque del rozamiento respecto del punto de contacto con la mesa es nulo (se aplica en él).</g>
</given>
<step op="Efecto del impulso sobre la traslación y la rotación">
\[mv_0=J,\qquad I\omega_0=Jh\ \Longrightarrow\ \omega_0=\frac{5v_0h}{2R^2}=\frac{5v_0q}{2R},\quad q=\frac hR.\]
<why>El impulso cambia el momento lineal y, como no pasa por el centro, también el angular respecto del centro. \(I=\tfrac25mR^2\).</why>
</step>
<step op="Velocidad del punto de contacto">
\[v_c=v_0-\omega_0R=v_0\left(1-\frac{5q}2\right).\]
<why>Con giro hacia adelante (\(q\gt0\), golpe sobre el centro) el punto de contacto retrocede respecto de la mesa.</why>
</step>
<step op="Condición de rodadura inmediata">
\[v_c=0\ \Longrightarrow\ q=\frac25,\qquad h=\frac25R\ \ (\text{o }\tfrac75R\text{ sobre la mesa}).\]
</step>
<step op="Si \(q\ne2/5\): conservar el momento angular respecto del punto de contacto">
\[mv_0R+I\omega_0=mv_fR+I\frac{v_f}R.\]
<why>Mientras desliza, el rozamiento actúa en el punto de contacto: su torque respecto de él es nulo; la normal y el peso se cancelan. Al terminar el deslizamiento, \(\omega_f=v_f/R\).</why>
</step>
<step op="Resolver para la velocidad final">
\[v_f=\frac{mv_0R+\tfrac25mR^2\omega_0}{mR+\tfrac25mR}=\frac57\,(1+q)\,v_0.\]
<why>Con \(I\omega_0=\tfrac25mR^2\cdot\tfrac{5v_0q}{2R}=mRv_0q\).</why>
</step>
<step op="Energía disipada por el rozamiento">
\[\Delta E=\tfrac12mv_0^2+\tfrac12I\omega_0^2-\tfrac7{10}mv_f^2.\]
<why>En rodadura pura, \(\tfrac12mv_f^2+\tfrac12I(v_f/R)^2=\tfrac7{10}mv_f^2\).</why>
</step>
<result name="Golpe de billar">\[q_\text{rodadura}=\frac25,\qquad v_f=\frac57(1+q)\,v_0,\qquad v_c=v_0\Big(1-\frac{5q}2\Big).\]</result>
<vars>
<v s="v_0" n="velocidad inicial del centro" u="m s^-1"/>
<v s="\omega_0" n="giro inicial" u="rad s^-1"/>
<v s="h" n="altura del golpe sobre el centro" u="m"/>
<v s="R" n="radio de la bola" u="m"/>
<v s="q" n="altura del golpe en radios \(h/R\)" u="1"/>
<v s="v_f" n="velocidad al empezar a rodar" u="m s^-1"/>
<v s="m" n="masa de la bola" u="kg"/>
<v s="I" n="momento de inercia" u="kg m^2"/>
<v s="J" n="impulso del golpe" u="N s"/>
</vars>
<effects>
<e>Bola de 0.17 kg y 28.6 mm de radio con \(v_0=2\) m/s. Golpe al centro (\(q=0\)): desliza con \(v_c=2\) m/s, acaba rodando a \(v_f=\tfrac57v_0=1.4286\) m/s y pierde 0.0971 J (28.6 % de su energía). Golpe a \(q=0.4\) (7R/5 sobre la mesa, a 11.4 mm del centro): \(\omega_0=69.93\) rad/s, no desliza, \(v_f=v_0\) y no se pierde energía.</e>
<e>Golpe bajo el centro (efecto retroceso): \(q=-0.5\): \(\omega_0=-87.41\) rad/s, desliza a \(v_c=4.5\) m/s y acaba con \(v_f=0.714\) m/s (pierde el 89 % de la energía); \(q=-0.9\): \(v_f=0.143\) m/s. Con \(q\to-1\), \(v_f\to0\): la bola se detiene en seco al empezar a rodar, y si choca de frente con otra, retrocede.</e>
<e>Un golpe alto (\(q=0.8\)) desliza hacia atrás (\(v_c=-2\) m/s), gana velocidad (\(v_f=2.571\) m/s, 29 % más que \(v_0\)) y pierde el 11 % de la energía.</e>
</effects>
<limits>
<l>Dimensiones: \(\omega_0=5v_0q/2R\) es s⁻¹ (\(q\) adimensional). ✓ \(J=mv_0\) tiene dimensión de impulso.</l>
<l>Supone esfera maciza, golpe horizontal y sin rozamiento durante el impacto; \(q\) se limita a \(|q|\lt1\) (más allá la tiza no agarra y el taco resbala: golpe «miscue»). El punto \(h=2R/5\) sobre el centro es el centro de percusión.</l>
</limits>
<explore sim="billar" title="Golpe de billar: giro inicial, deslizamiento, velocidad final y energía disipada"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(v_0=2\), golpe al centro): \(\omega_0=0\), \(v_c=2\) m/s, \(v_f=1.4286\) m/s y \(\Delta E=0.09714\) J.</li>
<li>Seleccione \(h/R\) en el eje: la velocidad de deslizamiento se anula en 0.4 y la energía disipada baja a cero allí; la velocidad final crece linealmente con \(q\).</li>
</ul></div>
