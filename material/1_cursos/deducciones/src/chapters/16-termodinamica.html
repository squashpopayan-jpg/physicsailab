<template class="chapter-src" data-id="termodinamica" data-num="16" data-title="Termodinámica" data-part="Parte IV · Física térmica" data-short="La adiabática del gas ideal y la relación de Mayer, el ciclo de Carnot, el rendimiento del ciclo Otto, la entropía del gas ideal y el punto crítico de van der Waals">
<p class="lead">La termodinámica parte de dos leyes: la energía se conserva (primera ley, \(\mathrm dU=\delta Q-p\,\mathrm dV\)) y el calor no pasa solo de un cuerpo frío a uno caliente (segunda ley, que se expresa con la entropía). Con el gas ideal como sistema de prueba, y sin ningún modelo molecular, se obtienen las transformaciones adiabáticas, los límites del rendimiento de las máquinas térmicas y el cambio de entropía; con la ecuación de van der Waals se deduce el punto crítico donde el líquido y el vapor se vuelven indistinguibles. El capítulo 17 explicará los calores específicos a partir de las moléculas, y el 18 la entropía como recuento de estados.</p>

<deriv id="adiabatica" title="La adiabática del gas ideal: \(pV^\gamma=\) constante y el trabajo de compresión" tags="Termodinámica, Gas ideal">
<goal>La relación entre presión, volumen y temperatura en una compresión o expansión sin intercambio de calor, junto con la relación de Mayer \(C_p-C_v=R\) y el trabajo realizado.</goal>
<given>
<g>Primera ley: \(\mathrm dU=\delta Q-p\,\mathrm dV\). Gas ideal: \(pV=nRT\), y su energía interna solo depende de la temperatura, \(\mathrm dU=nC_v\,\mathrm dT\) (con \(C_v\) constante).</g>
<g>Transformación adiabática y reversible: \(\delta Q=0\).</g>
</given>
<step op="Relación de Mayer: calentar a presión constante">
\[\delta Q_p=nC_p\,\mathrm dT=nC_v\,\mathrm dT+p\,\mathrm dV=nC_v\,\mathrm dT+nR\,\mathrm dT\ \Longrightarrow\ C_p=C_v+R.\]
<why>A presión constante el gas absorbe además el calor que gasta en expandirse: \(p\,\mathrm dV=nR\,\mathrm dT\). Con \(\gamma=C_p/C_v\), resulta \(C_v=R/(\gamma-1)\).</why>
</step>
<step op="Primera ley sin calor">
\[nC_v\,\mathrm dT=-p\,\mathrm dV=-\frac{nRT}{V}\,\mathrm dV.\]
</step>
<step op="Separar variables">
\[\frac{\mathrm dT}{T}=-\frac R{C_v}\frac{\mathrm dV}V=-(\gamma-1)\frac{\mathrm dV}V.\]
</step>
<step op="Integrar">
\[\ln T=-(\gamma-1)\ln V+\text{cte}\ \Longrightarrow\ TV^{\gamma-1}=\text{cte}.\]
</step>
<step op="Cambiar de variable con \(T=pV/nR\)">
\[pV^{\gamma}=\text{cte}\ \Longrightarrow\ \frac{p_2}{p_1}=r^{\gamma},\qquad T_2=T_1\,r^{\gamma-1},\qquad r=\frac{V_1}{V_2}.\]
</step>
<step op="Trabajo sobre el gas (igual a \(\Delta U\), pues \(Q=0\))">
\[W_\text{sobre}=-\int_{V_1}^{V_2}p\,\mathrm dV=nC_v(T_2-T_1)=\frac{nRT_1\,(r^{\gamma-1}-1)}{\gamma-1}.\]
</step>
<result name="Adiabática del gas ideal">\[pV^\gamma=\text{cte},\qquad TV^{\gamma-1}=\text{cte},\qquad W_\text{sobre}=\frac{nRT_1\,(r^{\gamma-1}-1)}{\gamma-1}.\]</result>
<vars>
<v s="\gamma" n="índice adiabático \(C_p/C_v\)" u="1"/>
<v s="C_p,\,C_v" n="calores molares a presión y a volumen constantes" u="J mol^-1 K^-1"/>
<v s="R" n="constante de los gases" u="J mol^-1 K^-1"/>
<v s="n" n="cantidad de gas" u="mol"/>
<v s="T_1,\,T_2" n="temperaturas inicial y final" u="K"/>
<v s="p" n="presión" u="Pa"/>
<v s="V" n="volumen" u="m^3"/>
<v s="r" n="razón de compresión \(V_1/V_2\)" u="1"/>
<v s="W" n="trabajo realizado sobre el gas" u="J"/>
</vars>
<effects>
<e>Aire (\(\gamma=1.4\)) a 300 K comprimido con \(r=10\): \(T_2=753.6\) K, \(p_2/p_1=25.12\) y \(W=9.428\) kJ por mol; en una compresión isotérmica haría falta menos (\(RT_1\ln r=5.743\) kJ/mol) porque el gas se mantiene frío. Con \(r=20\) (motor diésel) \(T_2=994.3\) K, por encima de la temperatura de ignición del gasóleo.</e>
<e>El gas monoatómico (\(\gamma=5/3\)) se calienta más: con \(r=10\), \(T_2=1392.5\) K y \(p_2/p_1=46.42\); con \(\gamma=1.1\) (moléculas complejas, muchos grados de libertad) solo 377.7 K. La temperatura sube como \(r^{\gamma-1}\).</e>
<e>La temperatura inicial escala el trabajo linealmente: con \(T_1=500\) K y \(r=10\), \(W=15.713\) kJ/mol y \(T_2=1255.9\) K. Con \(r=2\), \(T_2=395.9\) K y \(W=1.992\) kJ/mol.</e>
</effects>
<limits>
<l>Dimensiones: \(R\,T\) es una energía por mol y \(r^{\gamma-1}\) es adimensional, de modo que \(W=nRT_1(\ldots)/(\gamma-1)\) es una energía. ✓</l>
<l>Vale para un gas ideal con calores constantes y un proceso lento (cuasi-estático) y sin rozamiento; en una compresión rápida real aparece entropía y la temperatura final es mayor. Para el aire a altas temperaturas \(\gamma\) decrece porque se excitan las vibraciones (capítulo 17).</l>
</limits>
<explore sim="adiabatica" title="Compresión adiabática: temperatura final, presión y trabajo"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(\gamma=1.4\), 300 K, \(r=10\)): \(T_2=753.566\) K, \(p_2/p_1=25.1189\), \(W=9427.89\) J/mol y trabajo isotérmico \(5743.43\) J/mol.</li>
<li>Seleccione \(r\) en el eje (log–log): \(T_2\) sube con pendiente local \(\gamma-1=0.4\) y \(p_2/p_1\) con pendiente \(\gamma=1.4\).</li>
</ul></div>
</deriv>

<deriv id="carnot" title="El ciclo de Carnot y el límite de rendimiento de una máquina térmica" tags="Termodinámica, Segunda ley">
<goal>El rendimiento máximo de una máquina que opera entre un foco caliente a \(T_h\) y uno frío a \(T_c\).</goal>
<given>
<g>Un gas ideal recorre el ciclo: expansión isotérmica a \(T_h\) (1→2), expansión adiabática hasta \(T_c\) (2→3), compresión isotérmica a \(T_c\) (3→4) y compresión adiabática hasta \(T_h\) (4→1).</g>
<g>Primera ley: en un ciclo \(\Delta U=0\), de modo que \(W=Q_h-Q_c\). En una isoterma del gas ideal \(\Delta U=0\) y el calor es igual al trabajo: \(Q=nRT\ln(V_f/V_i)\).</g>
</given>
<step op="Calor absorbido en la isoterma caliente">
\[Q_h=nRT_h\ln\frac{V_2}{V_1}.\]
</step>
<step op="Calor cedido en la isoterma fría">
\[Q_c=nRT_c\ln\frac{V_3}{V_4}.\]
</step>
<step op="Las dos adiabáticas, con \(TV^{\gamma-1}=\) cte">
\[T_hV_2^{\gamma-1}=T_cV_3^{\gamma-1},\qquad T_hV_1^{\gamma-1}=T_cV_4^{\gamma-1}\ \Longrightarrow\ \frac{V_2}{V_1}=\frac{V_3}{V_4}.\]
<why>Se dividen las dos igualdades: las razones de volumen de las isotermas son iguales y los logaritmos se cancelan.</why>
</step>
<step op="Cociente de calores">
\[\frac{Q_c}{Q_h}=\frac{T_c}{T_h}\quad\Longleftrightarrow\quad\frac{Q_h}{T_h}-\frac{Q_c}{T_c}=0.\]
</step>
<step op="Rendimiento">
\[\eta=\frac W{Q_h}=1-\frac{Q_c}{Q_h}=1-\frac{T_c}{T_h}.\]
</step>
<step op="Ningún motor supera a Carnot">
\[\eta_\text{real}\le1-\frac{T_c}{T_h},\qquad\text{COP}_\text{refrig.}=\frac{Q_c}{W}=\frac{T_c}{T_h-T_c}.\]
<why>Si una máquina tuviese mayor rendimiento, acoplada a un ciclo de Carnot invertido (refrigerador) transportaría calor del foco frío al caliente sin gasto neto de trabajo, lo que viola la segunda ley (enunciado de Clausius). Al invertir el ciclo, \(W\) y los calores cambian de signo.</why>
</step>
<result name="Rendimiento de Carnot">\[\eta_C=1-\frac{T_c}{T_h},\qquad\frac{Q_h}{T_h}=\frac{Q_c}{T_c}.\]</result>
<vars>
<v s="\eta" n="rendimiento" u="1"/>
<v s="T_h,\,T_c" n="temperaturas absolutas de los focos" u="K"/>
<v s="Q_h,\,Q_c" n="calor absorbido y cedido por ciclo" u="J"/>
<v s="W" n="trabajo neto por ciclo" u="J"/>
<v s="n" n="cantidad de gas" u="mol"/>
<v s="R" n="constante de los gases" u="J mol^-1 K^-1"/>
<v s="V_1,\ldots,V_4" n="volúmenes en los vértices del ciclo" u="m^3"/>
<v s="COP" n="coeficiente de operación del refrigerador" u="1"/>
</vars>
<effects>
<e>Entre 500 K y 300 K (\(\tau=0.6\)): \(\eta=0.4\); con \(Q_h=1000\) J se obtienen 400 J de trabajo y se ceden 600 J. Subir la temperatura caliente a 600 K (\(\tau=0.5\)) da \(\eta=0.5\); bajar el foco frío a 250 K lo mismo. Duplicar la diferencia de temperaturas no duplica el rendimiento: \(\eta\) crece con \(1-\tau\), con saturación en 1.</e>
<e>Una central térmica con vapor a 540 °C (813.15 K) y un sumidero a 30 °C (303.15 K): \(\eta_C=0.6272\), mientras que las plantas reales alcanzan ≈ 40 %. Entre 100 °C y 20 °C el máximo es solo 21.4 %, lo que explica la baja eficiencia de las máquinas de baja temperatura.</e>
<e>Un refrigerador de Carnot entre −20 °C y 30 °C: \(\text{COP}=253.15/50=5.063\), es decir, extrae 5.06 J del interior por cada J de trabajo; con \(\tau=0.5\), COP = 1; el COP crece al acercar las temperaturas.</e>
</effects>
<limits>
<l>Dimensiones: \(T_c/T_h\), \(\eta\) y COP son adimensionales; \(nRT\ln(V_f/V_i)\) es una energía. ✓</l>
<l>El rendimiento de Carnot es un máximo para procesos reversibles; una máquina real tiene \(\eta<\eta_C\) por rozamiento, conducción de calor a través de diferencias finitas de temperatura (con potencia finita el límite de Curzon–Ahlborn es \(1-\sqrt{T_c/T_h}\)) y pérdidas. No depende de la sustancia de trabajo.</l>
</limits>
<explore sim="carnot" title="Máquina de Carnot: rendimiento, trabajo, calor cedido y COP"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (500 K, \(\tau=0.6\), 1000 J): \(\eta=0.4\), \(W=400\) J, \(Q_c=600\) J, \(T_c=300\) K y COP = 1.5.</li>
<li>Seleccione \(\tau\) en el eje: \(\eta\) decrece linealmente; el COP diverge al acercarse \(\tau\to1\); con \(\tau=0.5\): \(\eta=0.5\) y COP = 1.</li>
</ul></div>
</deriv>

<deriv id="otto" title="El rendimiento del ciclo Otto (motor de gasolina)" tags="Termodinámica, Ciclos">
<goal>La eficiencia ideal de un motor de encendido por chispa en función de la razón de compresión.</goal>
<given>
<g>Ciclo ideal con un gas de calores constantes: compresión adiabática (1→2), calentamiento a volumen constante por la combustión (2→3), expansión adiabática (3→4) y enfriamiento a volumen constante en el escape (4→1).</g>
<g>A volumen constante \(Q=nC_v\Delta T\), con \(C_v=R/(\gamma-1)\); las adiabáticas verifican \(TV^{\gamma-1}=\) cte.</g>
</given>
<step op="Calor aportado y cedido (a volumen constante)">
\[Q_\text{in}=nC_v(T_3-T_2),\qquad Q_\text{out}=nC_v(T_4-T_1).\]
</step>
<step op="Adiabáticas con \(r=V_1/V_2=V_4/V_3\)">
\[T_2=T_1\,r^{\gamma-1},\qquad T_4=T_3\,r^{1-\gamma}.\]
</step>
<step op="Escribir \(T_4-T_1\) con esas relaciones">
\[T_4-T_1=(T_3-T_2)\,r^{1-\gamma}.\]
<why>Porque \(T_1=T_2\,r^{1-\gamma}\), así que \(T_4-T_1=T_3r^{1-\gamma}-T_2r^{1-\gamma}\).</why>
</step>
<step op="Rendimiento">
\[\eta=1-\frac{Q_\text{out}}{Q_\text{in}}=1-\frac{T_4-T_1}{T_3-T_2}=1-r^{1-\gamma}.\]
</step>
<result name="Rendimiento del ciclo Otto">\[\eta_\text{Otto}=1-\frac1{r^{\gamma-1}}.\]</result>
<vars>
<v s="\eta" n="rendimiento" u="1"/>
<v s="r" n="razón de compresión" u="1"/>
<v s="\gamma" n="índice adiabático" u="1"/>
<v s="T_1,\ldots,T_4" n="temperaturas de los vértices del ciclo" u="K"/>
<v s="Q_\text{in},\,Q_\text{out}" n="calor aportado y cedido" u="J"/>
<v s="C_v" n="calor molar a volumen constante" u="J mol^-1 K^-1"/>
<v s="n" n="cantidad de gas" u="mol"/>
</vars>
<effects>
<e>Con \(r=10\) y aire (\(\gamma=1.4\)): \(\eta=0.6019\), con \(T_2=753.6\) K y, si \(T_3=1800\) K, \(T_4=716.6\) K; el calor aportado es 21.751 kJ/mol y el trabajo neto 13.092 kJ/mol. Con \(r=8\), \(\eta=0.5647\); con \(r=12\), 0.6299: elevar la compresión mejora el rendimiento con rendimientos decrecientes (\(\propto r^{1-\gamma}\)).</e>
<e>El rendimiento no depende de \(T_3\) (la temperatura máxima): con \(T_3=2200\) K sigue siendo 0.6019, aunque el trabajo sube a 18.096 kJ/mol. Con una mezcla de \(\gamma=1.3\) (gases de combustión, más moléculas complejas), \(\eta=0.4988\): una \(\gamma\) menor reduce el rendimiento.</e>
<e>Los motores reales alcanzan ≈ 30 %: la mitad del valor ideal porque la combustión no es instantánea, hay pérdidas de calor a las paredes, rozamiento y \(\gamma\) disminuye con la temperatura. La razón de compresión se limita por la detonación (\(r\approx10\)–\(12\)).</e>
</effects>
<limits>
<l>Dimensiones: \(\eta\) y \(r^{1-\gamma}\) son adimensionales. ✓</l>
<l>Es un ciclo de aire estándar con calores constantes, reversible y con procesos de calor instantáneos; sirve como cota. En comparación, el ciclo Carnot entre \(T_1=300\) K y \(T_3=1800\) K tendría \(\eta=0.833\), muy por encima de Otto porque el calor entra a temperaturas variables.</l>
</limits>
<explore sim="otto" title="Ciclo Otto: rendimiento, temperaturas, calor y trabajo"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(r=10\), \(\gamma=1.4\), 300 K, 1800 K): \(\eta=0.601893\), \(T_2=753.566\) K, \(T_4=716.593\) K, \(Q_\text{in}=21751.3\) J/mol y \(W=13092.0\) J/mol.</li>
<li>Seleccione \(r\) en el eje (log–log): \(1-\eta\) cae como \(r^{-0.4}\); con \(T_3\) el rendimiento no cambia.</li>
</ul></div>
</deriv>

<deriv id="entropia-gas" title="La entropía del gas ideal y la expansión libre" tags="Termodinámica, Entropía">
<goal>El cambio de entropía de un gas ideal entre dos estados, y su valor en una expansión libre irreversible.</goal>
<given>
<g>Definición de Clausius: \(\mathrm dS=\delta Q_\text{rev}/T\); la entropía es función de estado, de modo que \(\Delta S\) se calcula con cualquier camino reversible entre los mismos estados.</g>
<g>Gas ideal: \(\delta Q_\text{rev}=nC_v\,\mathrm dT+p\,\mathrm dV\) (primera ley) y \(p=nRT/V\).</g>
</given>
<step op="Entropía en un camino reversible">
\[\mathrm dS=\frac{nC_v\,\mathrm dT+p\,\mathrm dV}T=nC_v\frac{\mathrm dT}T+nR\frac{\mathrm dV}V.\]
</step>
<step op="Integrar entre el estado 1 y el 2">
\[\Delta S=nC_v\ln\frac{T_2}{T_1}+nR\ln\frac{V_2}{V_1},\qquad C_v=\frac f2R.\]
</step>
<step op="Forma en \(T\) y \(p\) (con \(C_p=C_v+R\))">
\[\Delta S=nC_p\ln\frac{T_2}{T_1}-nR\ln\frac{p_2}{p_1}.\]
<why>Se sustituye \(V_2/V_1=(T_2/T_1)(p_1/p_2)\).</why>
</step>
<step op="Expansión libre (Joule): gas aislado que se expande en el vacío">
\[Q=W=0\Rightarrow\Delta U=0\Rightarrow T_2=T_1\ \Longrightarrow\ \Delta S=nR\ln\frac{V_2}{V_1}>0.\]
<why>El proceso es irreversible, pero \(S\) es función de estado: se calcula con una isoterma reversible entre el mismo estado inicial y final. La entropía del universo aumenta (el gas está aislado).</why>
</step>
<result name="Entropía del gas ideal">\[\Delta S=nC_v\ln\frac{T_2}{T_1}+nR\ln\frac{V_2}{V_1}.\]</result>
<vars>
<v s="\Delta S" n="variación de entropía" u="J K^-1"/>
<v s="n" n="cantidad de gas" u="mol"/>
<v s="C_v" n="calor molar a volumen constante" u="J mol^-1 K^-1"/>
<v s="R" n="constante de los gases" u="J mol^-1 K^-1"/>
<v s="T_1,\,T_2" n="temperaturas" u="K"/>
<v s="V_1,\,V_2" n="volúmenes" u="m^3"/>
<v s="p_1,\,p_2" n="presiones" u="Pa"/>
<v s="f" n="grados de libertad por molécula" u="1"/>
</vars>
<effects>
<e>Un mol de gas monoatómico (\(f=3\)) que duplica la temperatura y el volumen: \(\Delta S=14.408\) J/K, de los cuales 8.645 son térmicos y 5.763 de volumen. Con \(f=5\), 20.171 J/K: más grados de libertad almacenan más entropía por kelvin.</e>
<e>La expansión libre de un mol que duplica su volumen: \(\Delta S=R\ln2=5.763\) J/K (ninguna transferencia de calor). Con \(n=2\) todo se duplica (28.816 J/K, extensiva); con una expansión libre de 1 a 10 volúmenes, \(R\ln10=19.145\) J/K.</e>
<e>Si el gas se comprime a la mitad, el término de volumen es negativo (\(-5.763\) J/K): la entropía del gas disminuye solo si se cede calor al entorno, cuya entropía crece en más de esa cantidad.</e>
</effects>
<limits>
<l>Dimensiones: \(nR\ln(V_2/V_1)\) tiene unidades de J/K. ✓</l>
<l>Se supone \(C_v\) constante y gas ideal; la entropía absoluta requiere la tercera ley y la constante de Sackur–Tetrode (capítulo 18). El caso de dos gases distintos que se mezclan da \(\Delta S=-nR\sum x_i\ln x_i\) (paradoja de Gibbs si los gases son idénticos).</l>
</limits>
<explore sim="entropia" title="Entropía de un gas ideal: variación con la temperatura y el volumen"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(f=3\), 1 mol, \(T_2/T_1=2\), \(V_2/V_1=2\)): \(\Delta S=14.4079\) J/K, térmica 8.64472, de volumen 5.76315.</li>
<li>Seleccione \(V_2/V_1\) en el eje: la parte de volumen crece como \(\ln\) y se anula en 1; la forma con \(T\) y \(p\) da el mismo resultado (14.4079).</li>
</ul></div>
</deriv>

<deriv id="vdw-critico" title="El punto crítico de van der Waals y los estados correspondientes" tags="Termodinámica, Gases reales">
<goal>La temperatura, presión y volumen críticos de un fluido que obedece \(\left(p+a/V^2\right)(V-b)=RT\), y su ecuación reducida.</goal>
<given>
<g>Ecuación de van der Waals por mol: \(p=\dfrac{RT}{V-b}-\dfrac a{V^2}\): \(b\) es el volumen propio de las moléculas y \(a\) la atracción entre ellas.</g>
<g>En el punto crítico la isoterma tiene un punto de inflexión con tangente horizontal: \(\partial p/\partial V=0\) y \(\partial^2p/\partial V^2=0\).</g>
</given>
<step op="Primera y segunda derivada">
\[\frac{\partial p}{\partial V}=-\frac{RT}{(V-b)^2}+\frac{2a}{V^3}=0,\qquad\frac{\partial^2p}{\partial V^2}=\frac{2RT}{(V-b)^3}-\frac{6a}{V^4}=0.\]
</step>
<step op="Despejar \(RT\) de cada una e igualar">
\[RT=\frac{2a(V-b)^2}{V^3}=\frac{3a(V-b)^3}{V^4}\ \Longrightarrow\ 2V=3(V-b)\ \Longrightarrow\ V_c=3b.\]
</step>
<step op="Temperatura crítica">
\[RT_c=\frac{2a(2b)^2}{27b^3}=\frac{8a}{27b}\ \Longrightarrow\ T_c=\frac{8a}{27Rb}.\]
</step>
<step op="Presión crítica y factor de compresibilidad">
\[p_c=\frac{RT_c}{V_c-b}-\frac a{V_c^2}=\frac{4a}{27b^2}-\frac{3a}{27b^2}=\frac a{27b^2},\qquad Z_c=\frac{p_cV_c}{RT_c}=\frac38.\]
</step>
<step op="Ecuación reducida (\(\pi=p/p_c\), \(\varphi=V/V_c\), \(\tau=T/T_c\))">
\[\left(\pi+\frac3{\varphi^2}\right)(3\varphi-1)=8\tau.\]
<why>No contiene \(a\) ni \(b\): todos los fluidos de van der Waals siguen la misma curva (ley de los estados correspondientes).</why>
</step>
<step op="Segundo coeficiente del virial y temperatura de Boyle">
\[p=\frac{RT}V\left[1+\frac{b-a/RT}V+\cdots\right]\ \Longrightarrow\ B(T)=b-\frac a{RT}=0\ \text{ en }\ T_B=\frac a{Rb}=\frac{27}8T_c.\]
<why>Por encima de \(T_B\) domina la repulsión y el gas es más «duro» que un gas ideal; por debajo, la atracción.</why>
</step>
<result name="Punto crítico de van der Waals">\[V_c=3b,\qquad T_c=\frac{8a}{27Rb},\qquad p_c=\frac a{27b^2}.\]</result>
<vars>
<v s="a" n="parámetro de atracción" u="Pa m^6 mol^-2"/>
<v s="b" n="covolumen" u="m^3 mol^-1"/>
<v s="T_c" n="temperatura crítica" u="K"/>
<v s="p_c" n="presión crítica" u="Pa"/>
<v s="V_c" n="volumen molar crítico" u="m^3 mol^-1"/>
<v s="R" n="constante de los gases" u="J mol^-1 K^-1"/>
<v s="T_B" n="temperatura de Boyle" u="K"/>
<v s="Z_c" n="factor de compresibilidad crítico" u="1"/>
</vars>
<effects>
<e>CO₂ (\(a=3.640\) L²·bar/mol², \(b=0.04267\) L/mol): \(T_c=304.0\) K, \(p_c=74.04\) bar y \(V_c=0.1280\) L/mol, frente a los valores medidos 304.1 K y 73.8 bar. N₂ (1.370 y 0.0387): 126.15 K y 33.88 bar (experimentales: 126.2 K y 33.9 bar). Son valores consistentes porque \(a\) y \(b\) tabulados se ajustan, justamente, al punto crítico.</e>
