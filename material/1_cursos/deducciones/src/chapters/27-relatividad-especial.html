<template class="chapter-src" data-id="relatividad-especial" data-num="27" data-title="Relatividad especial" data-part="Parte VII · Relatividad" data-short="La dilatación del tiempo y la contracción de longitudes, la suma relativista de velocidades, el efecto Doppler relativista, la energía y el momento relativistas, y el umbral de las reacciones de producción de partículas">
<p class="lead">La relatividad especial parte de dos postulados: las leyes de la física son iguales en todos los sistemas inerciales y la velocidad de la luz en el vacío es la misma para todos ellos. De ahí se deduce que tiempo y espacio no son absolutos: se mezclan mediante las transformaciones de Lorentz, que dejan invariante el intervalo \(c^2t^2-x^2\). Se obtienen las consecuencias cinemáticas (dilatación, contracción, composición de velocidades, Doppler) y dinámicas (energía en reposo, momento relativista, umbrales de reacción) con las que se calculan los aceleradores y la desintegración de partículas en vuelo.</p>

<deriv id="dilatacion-contraccion" title="La dilatación del tiempo, la contracción de longitudes y las transformaciones de Lorentz" tags="Relatividad, Cinemática">
<goal>El factor \(\gamma\) que relaciona los tiempos y longitudes medidos en dos sistemas inerciales con velocidad relativa \(v\).</goal>
<given>
<g>Postulados de Einstein: la velocidad de la luz \(c\) es la misma en todos los sistemas inerciales. Un reloj de luz: un pulso rebota entre dos espejos separados \(\ell\), con periodo propio \(\Delta t_0=2\ell/c\).</g>
</given>
<step op="Reloj de luz que se mueve con velocidad \(v\) perpendicular a los espejos; en el sistema del laboratorio, el pulso recorre una diagonal">
\[\left(\frac{c\,\Delta t}2\right)^2=\left(\frac{v\,\Delta t}2\right)^2+\ell^2.\]
</step>
<step op="Despejar el tiempo del laboratorio">
\[\Delta t=\frac{2\ell/c}{\sqrt{1-v^2/c^2}}=\gamma\,\Delta t_0,\qquad\gamma=\frac1{\sqrt{1-\beta^2}},\ \ \beta=\frac vc.\]
</step>
<step op="Transformación de Lorentz (la única lineal que conserva \(c^2t^2-x^2\) y reduce a Galileo para \(v\ll c\))">
\[x'=\gamma(x-vt),\qquad t'=\gamma\left(t-\frac{vx}{c^2}\right).\]
</step>
<step op="Longitud de una barra en movimiento: se marcan sus extremos al mismo tiempo \(t\) del laboratorio; la barra en reposo mide \(L_0=x_2'-x_1'\)">
\[L_0=\gamma\,(x_2-x_1)=\gamma L\ \Longrightarrow\ L=\frac{L_0}\gamma.\]
</step>
<step op="Comprobación: el intervalo es invariante">
\[c^2t'^2-x'^2=c^2t^2-x^2.\]
</step>
<result name="Dilatación y contracción">\[\Delta t=\gamma\,\Delta t_0,\qquad L=\frac{L_0}{\gamma},\qquad\gamma=\frac1{\sqrt{1-v^2/c^2}}.\]</result>
<vars>
<v s="\gamma" n="factor de Lorentz" u="1"/>
<v s="\beta" n="velocidad relativa \(v/c\)" u="1"/>
<v s="v" n="velocidad relativa" u="m s^-1"/>
<v s="c" n="velocidad de la luz" u="m s^-1"/>
<v s="\Delta t_0" n="tiempo propio" u="s"/>
<v s="\Delta t" n="tiempo medido en el laboratorio" u="s"/>
<v s="L_0,\,L" n="longitud propia y contraída" u="m"/>
<v s="\ell" n="separación de los espejos" u="m"/>
<v s="x,\,x'" n="posiciones en los dos sistemas" u="m"/>
<v s="t,\,t'" n="tiempos en los dos sistemas" u="s"/>
</vars>
<effects>
<e>Un muón (vida propia 2.197 µs) a \(\beta=0.998\) tiene \(\gamma=15.82\): en el laboratorio vive 34.76 µs y recorre 10.40 km (sin relatividad, solo 657 m). Los muones creados a 15 km de altura llegan al suelo (tardan 50.1 µs): sobrevive una fracción \(e^{-50.1/34.76}=0.236\) en vez de \(10^{-10}\) sin dilatación.</e>
<e>\(\gamma\) crece lentamente y luego se dispara: 1.25 a \(\beta=0.6\), 1.667 a 0.8, 7.089 a 0.99, 28.87 a 0.9994 y 70.71 a 0.9999. Una barra de 1 m a \(\beta=0.998\) mide 6.32 cm; a 0.6, 80 cm; a 0.8, 60 cm.</e>
<e>La contracción solo afecta a la dirección del movimiento. Es la razón de que el tiempo de vuelo de los muones y las longitudes de los aceleradores (visto por la partícula) sean compatibles: dilatación y contracción describen el mismo hecho desde sistemas distintos.</e>
</effects>
<limits>
<l>Dimensiones: \(v^2/c^2\) y \(\gamma\) son adimensionales; \(\gamma\Delta t_0\) es un tiempo. ✓</l>
<l>Sistemas inerciales y movimiento relativo uniforme; con aceleración, el reloj acelerado marca el tiempo propio \(\int\mathrm dt/\gamma\) (paradoja de los gemelos). La dilatación del tiempo está confirmada con una precisión de 10⁻⁸ en anillos de almacenamiento y con relojes atómicos en aviones.</l>
</limits>
<explore sim="dilatacion" title="Dilatación del tiempo y contracción de longitudes según β"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(1-\beta=0.002\), 2.197 µs, 1 m): \(\beta=0.998\), \(\gamma=15.8193\), \(\Delta t=34.7550\) µs, \(L=0.0632139\) m y distancia 10.3984 km.</li>
<li>Seleccione \(1-\beta\) en el eje (log–log): \(\gamma\) crece con pendiente −1/2 al acercarse β a 1 (\(\gamma\simeq1/\sqrt{2(1-\beta)}\)); la longitud contraída cae con pendiente +1/2.</li>
</ul></div>
</deriv>

<deriv id="suma-velocidades" title="La composición relativista de velocidades y el arrastre de Fresnel" tags="Relatividad, Cinemática">
<goal>La velocidad de un objeto vista desde un sistema que se mueve con velocidad \(v\) respecto de aquel en que el objeto tiene velocidad \(u\).</goal>
<given>
<g>Transformación de Lorentz del apartado anterior: \(x=\gamma(x'+vt')\), \(t=\gamma(t'+vx'/c^2)\).</g>
</given>
<step op="Diferenciales">
\[\mathrm dx=\gamma(\mathrm dx'+v\,\mathrm dt'),\qquad\mathrm dt=\gamma\left(\mathrm dt'+\frac{v\,\mathrm dx'}{c^2}\right).\]
</step>
<step op="Cociente con \(u=\mathrm dx'/\mathrm dt'\)">
\[w=\frac{\mathrm dx}{\mathrm dt}=\frac{u+v}{1+uv/c^2}.\]
</step>
<step op="Rapidez: \(\beta=\tanh\varphi\) convierte la composición en una suma">
\[\tanh(\varphi_1+\varphi_2)=\frac{\tanh\varphi_1+\tanh\varphi_2}{1+\tanh\varphi_1\tanh\varphi_2}.\]
</step>
<step op="Luz en un medio móvil (Fizeau): \(u=c/n\) con el medio moviéndose a \(v\ll c\)">
\[w=\frac{c/n+v}{1+v/(nc)}\simeq\frac cn+v\left(1-\frac1{n^2}\right).\]
</step>
<result name="Composición de velocidades">\[w=\frac{u+v}{1+uv/c^2},\qquad\text{arrastre de Fresnel: }1-\frac1{n^2}.\]</result>
<vars>
<v s="u" n="velocidad del objeto en el sistema móvil" u="m s^-1"/>
<v s="v" n="velocidad del sistema móvil" u="m s^-1"/>
<v s="w" n="velocidad compuesta" u="m s^-1"/>
<v s="c" n="velocidad de la luz" u="m s^-1"/>
<v s="\varphi" n="rapidez" u="1"/>
<v s="n" n="índice de refracción del medio" u="1"/>
</vars>
<effects>
<e>Dos velocidades de 0.9\(c\) se componen en \(w=0.994475\,c\), no en 1.8\(c\); dos de 0.5\(c\), en 0.8\(c\); dos de 0.99\(c\), en 0.999949\(c\). Con 0.1\(c\) cada una la corrección es pequeña: 0.198020\(c\) frente a 0.2\(c\). Nunca se supera \(c\).</e>
<e>Las rapideces se suman: para 0.9\(c\) + 0.9\(c\), \(\varphi=1.4722+1.4722=2.9444\) y \(\tanh2.9444=0.994475\); 0.9\(c\) con 0.5\(c\) da 0.965517\(c\) (\(\varphi=2.0215\)). Con \(u=c\) siempre resulta \(w=c\).</e>
<e>Fizeau (1851) midió el arrastre de la luz por agua en movimiento (\(n=1.333\)): el coeficiente \(1-1/n^2=0.4372\), de acuerdo con el medido (0.43 ± 0.02); con una corriente de 7 m/s la velocidad de la luz cambia en 3.06 m/s. Este resultado, mal explicado por Fresnel con un éter, es una consecuencia directa de la relatividad.</e>
</effects>
<limits>
<l>Dimensiones: \(uv/c^2\) es adimensional. ✓</l>
<l>Movimientos colineales; para velocidades no colineales la composición no es conmutativa y aparece la rotación de Wigner–Thomas. La relatividad general (capítulo 28) reemplaza este esquema en sistemas con gravedad.</l>
</limits>
<explore sim="velocidades" title="Suma relativista de velocidades y arrastre de Fizeau"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (0.9 y 0.9, n = 1.333): \(w/c=0.9944751\), suma clásica 1.8, rapidez 2.94444 y coeficiente de Fizeau 0.437219.</li>
<li>Seleccione \(u\) en el eje: \(w/c\) tiende a 1 de forma asintótica mientras que la suma clásica sigue creciendo.</li>
</ul></div>
</deriv>

<deriv id="doppler-relativista" title="El efecto Doppler relativista" tags="Relatividad, Ondas">
<goal>La frecuencia que recibe un observador de una fuente que se mueve con velocidad \(v\) en una dirección que forma un ángulo \(\theta\) con la línea de visión.</goal>
<given>
<g>Dilatación del tiempo (apartado 1). La fuente emite una onda con periodo propio \(T_0\). El ángulo \(\theta\) se mide en el sistema del observador entre la velocidad de la fuente y la dirección fuente → observador.</g>
</given>
<step op="Intervalo entre dos crestas emitidas, medido en el sistema del observador">
\[\Delta t_e=\gamma T_0.\]
</step>
<step op="Entre ambas emisiones la fuente se acerca al observador una distancia \(v\Delta t_e\cos\theta\)">
\[T=\Delta t_e-\frac{v\Delta t_e\cos\theta}c=\gamma T_0\,(1-\beta\cos\theta).\]
</step>
<step op="Frecuencia observada">
\[f=\frac{f_0}{\gamma\,(1-\beta\cos\theta)}.\]
</step>
<step op="Casos particulares">
\[\theta=0:\ f=f_0\sqrt{\frac{1+\beta}{1-\beta}};\qquad\theta=180^\circ:\ f=f_0\sqrt{\frac{1-\beta}{1+\beta}};\qquad\theta=90^\circ:\ f=\frac{f_0}\gamma.\]
</step>
<result name="Doppler relativista">\[f=\frac{f_0}{\gamma(1-\beta\cos\theta)},\qquad z=\frac{\lambda}{\lambda_0}-1=\gamma(1-\beta\cos\theta)-1.\]</result>
<vars>
<v s="f_0" n="frecuencia en el sistema de la fuente" u="Hz"/>
<v s="f" n="frecuencia observada" u="Hz"/>
<v s="T_0" n="periodo propio" u="s"/>
<v s="\beta" n="velocidad de la fuente \(v/c\)" u="1"/>
<v s="\gamma" n="factor de Lorentz" u="1"/>
<v s="\theta" n="ángulo en el sistema del observador" u="rad"/>
<v s="z" n="corrimiento al rojo" u="1"/>
</vars>
<effects>
<e>Fuente a \(\beta=0.5\): de frente \(f/f_0=1.7321\) (violeta, \(z=-0.423\)); alejándose, 0.5774 (\(z=0.732\)); y transversal, 0.8660 (\(z=0.155\)), el efecto Doppler transversal, puramente relativista. A 60° de la línea de visión, 1.1547; a 120°, 0.6928.</e>
<e>A \(\beta=0.9\) de frente la frecuencia se multiplica por 4.359; a 0.99, por 14.11; a 0.1, por 1.1055 (clásico: 1.1111). Un quásar con \(z=0.158\) (3C 273) se aleja a \(\beta=0.1457\); \(z=1\) corresponde a \(\beta=0.6\) (aunque en cosmología el corrimiento se debe a la expansión, capítulo 39).</e>
<e>En el efecto Doppler transversal la frecuencia observada es menor que la propia por la dilatación del tiempo (\(1/\gamma\)); fue confirmado por Ives y Stilwell (1938) con iones H₂⁺ en movimiento.</e>
</effects>
<limits>
<l>Dimensiones: \(f\) y \(f_0\) en Hz; \(\beta\cos\theta\) adimensional. ✓</l>
<l>Fuente puntual y movimiento uniforme en el vacío; el ángulo está medido en el sistema del observador (en el de la fuente es otro por la aberración relativista). Vale también para la luz y para cualquier fuente electromagnética.</l>
</limits>
<explore sim="doppler-rel" title="Efecto Doppler relativista: razón de frecuencias y corrimiento al rojo"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (β = 0.5, θ = 0°): \(f/f_0=1.732051\), \(z=-0.422650\), de frente 1.73205 y transversal 0.866025.</li>
<li>Seleccione θ en el eje: la razón de frecuencias decrece de 1.732 a 0.577 al pasar de 0° a 180°, cruzando 1 a 74.5° (cosθ = (1 − 1/γ)/β).</li>
</ul></div>
</deriv>

<deriv id="energia-momento" title="Energía y cantidad de movimiento relativistas" tags="Relatividad, Dinámica">
<goal>La energía total y el momento de una partícula con masa \(m\) y velocidad \(v\), y su relación con la energía cinética.</goal>
<given>
<g>El cuadrivector \((E/c,\mathbf p)\) se transforma como \((ct,\mathbf x)\), con módulo invariante \((E/c)^2-p^2=m^2c^2\). Para \(v\ll c\): \(\mathbf p\to m\mathbf v\) y \(T\to\tfrac12mv^2\).</g>
</given>
<step op="Momento y energía">
\[\mathbf p=\gamma m\mathbf v,\qquad E=\gamma mc^2.\]
</step>
<step op="Invariante">
\[E^2-(pc)^2=\gamma^2m^2c^4(1-\beta^2)=m^2c^4\ \Longrightarrow\ E^2=(pc)^2+(mc^2)^2.\]
</step>
<step op="Energía cinética y su límite clásico">
\[T=E-mc^2=(\gamma-1)mc^2\simeq\tfrac12mv^2+\tfrac38m\frac{v^4}{c^2}.\]
<why>\(\gamma=1+\tfrac12\beta^2+\tfrac38\beta^4+\cdots\). La energía en reposo \(mc^2\) es la famosa equivalencia masa–energía.</why>
</step>
<step op="Momento y velocidad en función de \(T\)">
\[pc=\sqrt{T^2+2Tmc^2},\qquad\beta=\frac{pc}{E}=\frac{\sqrt{T^2+2Tmc^2}}{T+mc^2}.\]
</step>
<result name="Energía–momento">\[E=\gamma mc^2,\quad E^2=(pc)^2+(mc^2)^2,\quad T=(\gamma-1)mc^2.\]</result>
<vars>
<v s="E" n="energía total" u="J"/>
<v s="T" n="energía cinética" u="J"/>
<v s="p" n="cantidad de movimiento" u="kg m s^-1"/>
<v s="m" n="masa en reposo" u="kg"/>
<v s="c" n="velocidad de la luz" u="m s^-1"/>
<v s="\gamma" n="factor de Lorentz" u="1"/>
<v s="\beta" n="velocidad \(v/c\)" u="1"/>
</vars>
<effects>
<e>Un electrón de 1 MeV (\(mc^2=0.5110\) MeV): \(\gamma=2.9570\), \(\beta=0.94108\), \(pc=1.4220\) MeV y energía total 1.5110 MeV; la fórmula clásica daría una velocidad de 1.978\(c\), absurda. Con 10 keV, \(\beta=0.195\) y el error clásico es del 1.5 %. A 100 MeV, \(\gamma=196.7\) y \(1-\beta=1.3\times10^{-5}\).</e>
<e>Un protón de 1 GeV: \(\gamma=2.0658\), \(\beta=0.87503\) y \(pc=1.696\) GeV; con 1 MeV, \(\beta=0.0461\) y la mecánica clásica sirve (error 0.1 %). En el LHC (7 TeV), \(\gamma=7461.5\) y el protón solo es 9×10⁻⁹\(c\) más lento que la luz.</e>
<e>La energía en reposo del electrón, 0.511 MeV, es la energía mínima de un par electrón–positrón; la del protón, 938.27 MeV. Un gramo de materia equivale a \(9\times10^{13}\) J (21 kt de TNT).</e>
</effects>
<limits>
<l>Dimensiones: \([mc^2]=\mathrm{kg\,m^2s^{-2}}=\mathrm J\) y \([pc]=\mathrm{J}\). ✓</l>
<l>Partícula libre con masa; para la luz (\(m=0\)) valen \(E=pc\) y \(p=h/\lambda\). La definición de masa que depende de la velocidad («masa relativista») es innecesaria: la masa \(m\) es un invariante. En campos externos fuertes hay que incluir la energía potencial.</l>
</limits>
<explore sim="energia" title="Energía cinética relativista: γ, β, momento y error clásico"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (electrón de 1 MeV): \(\gamma=2.956951\), \(\beta=0.94107923\), \(pc=1.4219697\) MeV, \(E=1.5109989\) MeV y \(v_\text{clásica}/c=1.97836\).</li>
<li>Seleccione \(T\) en el eje (log–log): para \(T\ll mc^2\), \(\beta\) crece como \(\sqrt T\); para \(T\gg mc^2\), \(\gamma\) crece linealmente y \(\beta\to1\).</li>
</ul></div>
</deriv>

<deriv id="umbral-reacciones" title="El umbral de energía de una reacción: blanco fijo frente a colisionador" tags="Relatividad, Partículas">
<goal>La energía cinética mínima de un proyectil para producir partículas de masa total \(\sum m_f\) al chocar con un blanco en reposo, comparada con la de un colisionador.</goal>
<given>
<g>Invariante \(s=(E_\text{tot}/c^2)^2c^4-|\mathbf p_\text{tot}|^2c^2\) (cuadrado de la energía en el sistema del centro de masas). Conservación de energía y momento.</g>
</given>
<step op="Proyectil (\(E_1,\mathbf p_1\)) sobre un blanco en reposo (\(m_2\))">
\[s=(E_1+m_2c^2)^2-p_1^2c^2=m_1^2c^4+m_2^2c^4+2E_1m_2c^2.\]
</step>
<step op="En el umbral, los productos quedan en reposo en el sistema del centro de masas">
\[s=\left(\sum m_f\right)^2c^4.\]
</step>
<step op="Despejar la energía cinética del proyectil \(T=E_1-m_1c^2\)">
\[T_\text{umbral}=\frac{\left[\left(\sum m_f\right)^2-(m_1+m_2)^2\right]c^2}{2m_2}.\]
</step>
<step op="Colisionador simétrico (haces iguales de energía \(E\) opuestos): \(s=(2E)^2\)">
\[2E=\sum m_fc^2\ \Longrightarrow\ T=\frac{\sum m_fc^2}2-m_1c^2.\]
</step>
<result name="Umbral de reacción">\[T_\text{umbral}=\frac{\left[(\sum m_f)^2-(m_1+m_2)^2\right]c^2}{2m_2},\qquad T_\text{colisionador}=\tfrac12\sum m_fc^2-m_1c^2.\]</result>
<vars>
<v s="s" n="invariante de Mandelstam" u="J^2"/>
<v s="m_1,\,m_2" n="masas del proyectil y del blanco" u="kg"/>
<v s="\sum m_f" n="masa total de los productos" u="kg"/>
<v s="T" n="energía cinética del proyectil" u="J"/>
<v s="E_1" n="energía total del proyectil" u="J"/>
<v s="c" n="velocidad de la luz" u="m s^-1"/>
<v s="Q" n="energía en reposo creada" u="J"/>
</vars>
<effects>
<e>Producción de antiprotones (\(p+p\to p+p+p+\bar p\), \(\sum m_f=4m_p\)): con blanco fijo \(T_\text{umbral}=6m_pc^2=5629.6\) MeV (\(\gamma=7\)), el Bevatron de Berkeley (1955, 6.2 GeV). En un colisionador simétrico basta \(T=m_pc^2=938.3\) MeV por haz: seis veces menos. El cociente \(T/Q=(\sum m_f+m_1+m_2)/2m_2=3\), donde \(Q=1876.5\) MeV es la masa creada.</e>
<e>Producción de un pión neutro (\(p+p\to p+p+\pi^0\), 134.98 MeV): \(T_\text{umbral}=279.7\) MeV, \(\gamma=1.298\); de tres piones cargados: 930.8 MeV. Un par μ⁺μ⁻ con un positrón sobre un electrón en reposo exige \(T=43.69\) GeV; con haces simétricos de \(e^\pm\) solo 105.1 MeV cada uno: 416 veces menos.</e>
<e>Esta es la razón de los colisionadores (LHC, LEP): para crear una partícula de masa \(M\) con blanco fijo se necesita una energía que crece como \(M^2\), con colisionador solo como \(M\). El bosón de Higgs (125 GeV) con un blanco de protones fijo exigiría ≈ 8.6 TeV.</e>
</effects>
<limits>
<l>Dimensiones: \(\left(\sum m_f\right)^2c^2/m_2\) es una energía. ✓</l>
<l>Calcula solo la condición de energía y momento; las leyes de conservación de carga, número bariónico y otros números cuánticos determinan qué productos son posibles (en la producción de antiprotones hace falta crear un par \(p\bar p\)). Las secciones eficaces cercanas al umbral son pequeñas.</l>
</limits>
<explore sim="umbral" title="Umbral de reacción: blanco fijo frente a colisionador"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(p+p\to p+p+p+\bar p\)): \(T_\text{umbral}=5629.63\) MeV, \(\gamma=7\), \(T/Q=3\) y \(T_\text{colisionador}=938.272\) MeV por haz.</li>
<li>Seleccione \(\sum m_f\) en el eje (log–log): \(T_\text{umbral}\) crece casi como \((\sum m_f)^2\) para masas grandes; el colisionador, solo linealmente.</li>
</ul></div>
</deriv>
