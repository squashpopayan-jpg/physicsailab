<template class="chapter-src" data-id="geoplasmas" data-num="42" data-title="Geofísica y plasmas: partículas en campos, apantallamiento, sismos, calor y geomagnetismo" data-part="Parte XII · Sistemas complejos y aplicados" data-short="El giro de las partículas cargadas y la deriva E×B, la longitud de Debye y la frecuencia de plasma, las ondas sísmicas P y S, el enfriamiento de la litosfera oceánica y el campo dipolar de la Tierra">
<p class="lead">Un último conjunto de aplicaciones cierra el recorrido: la Tierra y el plasma que la rodea. Las mismas ecuaciones de las partes anteriores —fuerza de Lorentz, ecuación de Poisson, elasticidad, difusión del calor y potencial magnético— explican por qué los electrones de la ionosfera reflejan las ondas de radio, a qué velocidad viajan los terremotos, cómo se enfría el fondo del océano y cómo cambia el campo magnético con la latitud.</p>

<deriv id="giro-deriva" title="El giro de una partícula cargada y la deriva E×B" tags="Plasmas, Electromagnetismo">
<goal>El radio y la frecuencia del movimiento circular de una carga en un campo magnético uniforme, y la deriva que aparece al añadir un campo eléctrico perpendicular.</goal>
<given>
<g>Fuerza de Lorentz \(m\,\dot{\mathbf v}=q(\mathbf E+\mathbf v\times\mathbf B)\) con \(\mathbf B\) uniforme y constante.</g>
</given>
<step op="Solo \(\mathbf B\): la fuerza es perpendicular a \(\mathbf v\), de modo que no realiza trabajo y \(|\mathbf v|\) es constante; la componente paralela a \(\mathbf B\) no cambia">
\[\frac{mv_\perp^2}{r}=|q|v_\perp B.\]
</step>
<step op="Radio de giro (de Larmor) y frecuencia del ciclotrón">
\[r_L=\frac{mv_\perp}{|q|B},\qquad\omega_c=\frac{v_\perp}{r_L}=\frac{|q|B}m,\qquad f_c=\frac{\omega_c}{2\pi}.\]
<why>La frecuencia no depende de la velocidad: es el principio del ciclotrón. La trayectoria completa es una hélice de eje paralelo a \(\mathbf B\).</why>
</step>
<step op="Con \(\mathbf E\perp\mathbf B\) constante: buscar un sistema en que el campo eléctrico se anule. En un sistema con velocidad \(\mathbf v_d\) el campo es \(\mathbf E'=\mathbf E+\mathbf v_d\times\mathbf B\)">
\[\mathbf E+\mathbf v_d\times\mathbf B=0\ \Longrightarrow\ \mathbf v_d=\frac{\mathbf E\times\mathbf B}{B^2}.\]
</step>
<step op="Verificación: el producto vectorial triple">
\[\mathbf v_d\times\mathbf B=\frac{(\mathbf E\times\mathbf B)\times\mathbf B}{B^2}=-\mathbf E\ \ (\mathbf E\perp\mathbf B).\]
</step>
<result name="Movimiento en campos cruzados">\[r_L=\frac{mv_\perp}{|q|B},\qquad\omega_c=\frac{|q|B}m,\qquad\mathbf v_d=\frac{\mathbf E\times\mathbf B}{B^2}.\]</result>
<vars>
<v s="r_L" n="radio de Larmor" u="m"/>
<v s="\omega_c" n="frecuencia angular de giro" u="rad s^-1"/>
<v s="m" n="masa de la partícula" u="kg"/>
<v s="q" n="carga" u="C"/>
<v s="v_\perp" n="velocidad perpendicular al campo magnético" u="m s^-1"/>
<v s="B" n="inducción magnética" u="T"/>
<v s="E" n="campo eléctrico" u="V m^-1"/>
<v s="v_d" n="velocidad de deriva" u="m s^-1"/>
</vars>
<effects>
<e>Electrón de 1 keV en el campo terrestre de la ionosfera (30 µT): \(v=1.8755\times10^7\) m/s, \(r_L=3.55\) m y \(f_c=0.840\) MHz. Protón de 1 MeV en un tokamak (5 T): \(v=1.384\times10^7\) m/s, \(r_L=28.9\) mm y \(f_c=76.2\) MHz. Protón de 10 keV en el viento solar (20 nT): \(r_L=722\) km, \(f_c=0.305\) Hz.</e>
<e>La deriva \(E\times B\) no depende de la carga ni de la masa: todo el plasma se mueve junto, sin corriente neta. Con \(E=1\) kV/m y \(B=1\) T la deriva es 1 km/s; con \(E=1000\) V/m y \(B=5\) T, 200 m/s. En el viento solar es la causa de que el plasma «congelado» arrastre el campo magnético del Sol.</e>
</effects>
<limits>
<l>Dimensiones: \(mv/qB\) tiene unidades de longitud (\(\mathrm{kg\,m\,s^{-1}/(C\,T)}\)). ✓</l>
<l>Campos uniformes y no relativistas (\(r_L\ll\)) y \(v\ll c\): para campos que varían en una escala \(L\gg r_L\) se añaden las derivas por gradiente y curvatura; si la partícula es relativista, \(m\to\gamma m\). La frecuencia es de la carga y la deriva exige \(E<cB\).</l>
</limits>
<explore sim="plas-giro" title="Giro de Larmor, frecuencia de ciclotrón y deriva E×B"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (protón de 1 MeV, 5 T, \(E=1000\) V/m): \(v=13.8411\times10^6\) m/s, \(r_L=28.8994\) mm, \(f_c=76.2259\) MHz y \(v_{E\times B}=200\) m/s.</li>
<li>Con \(B\) en el eje (log–log): \(r_L\propto B^{-1}\) (pendiente −1), \(f_c\propto B\) y \(v_{E\times B}\propto B^{-1}\).</li>
</ul></div>
</deriv>

<deriv id="debye-plasma" title="El apantallamiento de Debye y las oscilaciones de plasma" tags="Plasmas, Electrostática">
<goal>La distancia a la que un plasma neutraliza una carga introducida y la frecuencia a la que oscila cuando se desplazan sus electrones.</goal>
<given>
<g>Electrones en equilibrio térmico en un potencial \(\varphi\): densidad de Boltzmann \(n_e=n_0\,e^{e\varphi/kT}\); los iones, mucho más pesados, se toman inmóviles con densidad \(n_0\).</g>
<g>Ecuación de Poisson \(\nabla^2\varphi=-\rho/\varepsilon_0\) con \(\rho=e(n_0-n_e)\) más la carga de prueba.</g>
</given>
<step op="Linealizar la densidad para \(e\varphi\ll kT\)">
\[\rho\simeq-\frac{n_0e^2}{kT}\,\varphi\ \Longrightarrow\ \nabla^2\varphi=\frac{\varphi}{\lambda_D^2},\qquad\lambda_D=\sqrt{\frac{\varepsilon_0kT}{n_0e^2}}.\]
</step>
<step op="Solución de simetría esférica alrededor de una carga \(q\) (con \(u=r\varphi\), \(u''=u/\lambda_D^2\)); se recupera el potencial de Coulomb para \(r\ll\lambda_D\)">
\[\varphi(r)=\frac q{4\pi\varepsilon_0r}\,e^{-r/\lambda_D}.\]
</step>
<step op="Oscilaciones: se desplaza una lámina de electrones una distancia \(x\); el campo creado en la lámina neutralizante es \(E=n_0ex/\varepsilon_0\)">
\[m\ddot x=-eE=-\frac{n_0e^2}{\varepsilon_0}\,x.\]
</step>
<step op="Oscilador armónico de frecuencia">
\[\omega_p=\sqrt{\frac{n_0e^2}{\varepsilon_0m}},\qquad f_p=\frac{\omega_p}{2\pi}\simeq8.98\sqrt{n_0[\text{m}^{-3}]}\ \text{Hz}.\]
</step>
<step op="Número de partículas en la esfera de Debye: condición de plasma">
\[N_D=\frac{4\pi}3n_0\lambda_D^3\gg1.\]
</step>
<result name="Plasma">\[\lambda_D=\sqrt{\frac{\varepsilon_0kT}{ne^2}},\qquad\omega_p=\sqrt{\frac{ne^2}{\varepsilon_0m}},\qquad\varphi=\frac q{4\pi\varepsilon_0r}e^{-r/\lambda_D}.\]</result>
<vars>
<v s="\lambda_D" n="longitud de Debye" u="m"/>
<v s="\omega_p" n="frecuencia angular de plasma" u="rad s^-1"/>
<v s="n_0" n="densidad de electrones" u="m^-3"/>
<v s="e" n="carga elemental" u="C"/>
<v s="\varepsilon_0" n="permitividad del vacío" u="F m^-1"/>
<v s="k" n="constante de Boltzmann" u="J K^-1"/>
<v s="T" n="temperatura electrónica" u="K"/>
<v s="m" n="masa del electrón" u="kg"/>
<v s="\varphi" n="potencial electrostático" u="V"/>
<v s="N_D" n="partículas en la esfera de Debye" u="1"/>
</vars>
<effects>
<e>Ionosfera (\(n=10^{12}\ \text{m}^{-3}\), \(kT=0.1\) eV): \(\lambda_D=2.35\) mm, \(f_p=8.979\) MHz y \(N_D=5.4\times10^4\); las ondas de radio con frecuencia menor que \(f_p\) se reflejan (AM, onda corta) y las mayores la atraviesan (FM, satélites). Viento solar (\(5\times10^6\ \text{m}^{-3}\), 10 eV): \(\lambda_D=10.5\) m, \(f_p=20.08\) kHz y \(N_D=2.4\times10^{10}\).</e>
<e>Plasma de tokamak (\(n=10^{20}\ \text{m}^{-3}\), 10 keV): \(\lambda_D=74.3\ \mu\)m, \(f_p=89.8\) GHz y \(N_D=1.7\times10^8\). La longitud de Debye crece como \(\sqrt T\) y decrece como \(n^{-1/2}\): un plasma frío y denso (\(n=10^{25}\ \text{m}^{-3}\), 1 eV) tiene \(\lambda_D=2.35\) nm y menos de una partícula por esfera de Debye (0.544): ya no se comporta como un plasma.</e>
</effects>
<limits>
<l>Dimensiones: \(\varepsilon_0kT/(ne^2)\) tiene unidades de \(\mathrm{m^2}\). ✓</l>
<l>El apantallamiento requiere \(N_D\gg1\) (muchos portadores por esfera) y \(e\varphi\ll kT\); la oscilación de plasma es la de electrones fríos (sin movimiento térmico); con temperatura la frecuencia aumenta (relación de dispersión de Bohm–Gross) y las ondas se amortiguan por efecto Landau.</l>
</limits>
<explore sim="plas-debye" title="Plasma: longitud de Debye, frecuencia de plasma y partículas por esfera de Debye"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(n=10^{12}\ \text{m}^{-3}\), \(kT=0.1\) eV): \(\lambda_D=2.35082\) mm, \(\omega_p=5.64146\times10^7\) rad/s, \(f_p=8.97866\) MHz y \(N_D=54\,418.4\).</li>
<li>Con \(n\) en el eje (log–log): \(\lambda_D\propto n^{-1/2}\), \(\omega_p\propto n^{1/2}\) y \(N_D\propto n^{-1/2}\).</li>
</ul></div>
</deriv>

<deriv id="ondas-sismicas" title="Las ondas sísmicas P y S" tags="Geofísica, Elasticidad">
<goal>Las velocidades de las dos clases de ondas que atraviesan el interior de la Tierra y qué dicen sobre el material.</goal>
<given>
<g>Ecuación de movimiento de un sólido elástico isótropo (ecuación de Navier): \(\rho\,\ddot{\mathbf u}=(\lambda+2\mu)\nabla(\nabla\cdot\mathbf u)-\mu\nabla\times(\nabla\times\mathbf u)\), con los coeficientes de Lamé \(\lambda\) y \(\mu\); \(K=\lambda+\tfrac23\mu\).</g>
<g>Identidad vectorial \(\nabla^2\mathbf u=\nabla(\nabla\cdot\mathbf u)-\nabla\times(\nabla\times\mathbf u)\).</g>
</given>
<step op="Descomponer el desplazamiento \(\mathbf u=\nabla\phi+\nabla\times\boldsymbol\psi\) (parte irrotacional más parte solenoidal)">
\[\nabla\cdot\mathbf u=\nabla^2\phi,\qquad\nabla\times\mathbf u=\nabla\times\nabla\times\boldsymbol\psi.\]
</step>
<step op="Tomar la divergencia de la ecuación de Navier: ecuación de ondas del potencial escalar (ondas P, de compresión)">
\[\ddot\phi=\frac{\lambda+2\mu}\rho\nabla^2\phi,\qquad v_P=\sqrt{\frac{\lambda+2\mu}\rho}=\sqrt{\frac{K+\tfrac43\mu}\rho}.\]
</step>
<step op="Tomar el rotacional: ecuación de ondas del potencial vectorial (ondas S, de cizalladura)">
\[\ddot{\boldsymbol\psi}=\frac\mu\rho\nabla^2\boldsymbol\psi,\qquad v_S=\sqrt{\frac\mu\rho}.\]
<why>Las ondas S son transversales y no se propagan en fluidos (\(\mu=0\)): la ausencia de ondas S en el núcleo externo mostró que está líquido.</why>
</step>
<step op="Relaciones útiles">
\[\frac{v_P}{v_S}=\sqrt{\frac{K}{\mu}+\frac43},\qquad\nu=\frac{K-\tfrac23\mu}{2(K+\tfrac13\mu)}.\]
</step>
<result name="Velocidades sísmicas">\[v_P=\sqrt{\frac{K+\tfrac43\mu}\rho},\qquad v_S=\sqrt{\frac\mu\rho}.\]</result>
<vars>
<v s="v_P,\,v_S" n="velocidades de las ondas P y S" u="m s^-1"/>
<v s="K" n="módulo de compresibilidad" u="Pa"/>
<v s="\mu" n="módulo de cizalladura" u="Pa"/>
<v s="\lambda" n="primer coeficiente de Lamé" u="Pa"/>
<v s="\rho" n="densidad" u="kg m^-3"/>
<v s="\nu" n="coeficiente de Poisson" u="1"/>
<v s="\phi" n="potencial escalar del desplazamiento" u="m^2"/>
</vars>
<effects>
<e>Manto superior (\(K=130\) GPa, \(\mu=70\) GPa, \(\rho=3300\) kg/m³): \(v_P=8.227\) km/s, \(v_S=4.606\) km/s, \(v_P/v_S=1.786\) y \(\nu=0.2717\). Granito (55, 30 GPa, 2700 kg/m³): \(5.932\) y \(3.333\) km/s. Un fluido (agua, \(K=2.2\) GPa, \(\mu=0\)): \(v_P=1.483\) km/s sin ondas S y \(\nu=0.5\).</e>
<e>La onda P siempre es más rápida (\(v_P/v_S\ge\sqrt{4/3}\); para un sólido de Poisson \(\nu=0.25\) vale \(\sqrt3\)): la diferencia de llegada entre P y S da la distancia al epicentro. Si \(P\) llega 60 s antes que \(S\) y las velocidades medias son 8 y 4.5 km/s, el sismo está a unos 617 km de distancia.</e>
</effects>
<limits>
<l>Dimensiones: \(\sqrt{\mathrm{Pa/(kg\,m^{-3})}}=\mathrm{m/s}\). ✓</l>
<l>Medio homogéneo e isótropo, sin pérdidas: en la Tierra los módulos y la densidad aumentan con la profundidad (las trayectorias se curvan según la ley de Snell, con parámetro de rayo \(p=\sin i/v\)), y en la interfaz entre capas aparecen reflexiones y conversiones P↔S. Las ondas superficiales (Rayleigh y Love) son más lentas y se atenúan menos.</l>
</limits>
<explore sim="geo-sismica" title="Velocidades de las ondas sísmicas P y S"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (manto superior): \(v_P=8.22659\) km/s, \(v_S=4.60566\) km/s, \(v_P/v_S=1.78619\) y \(\nu=0.271739\).</li>
<li>Con \(\mu\) en el eje (log–log): \(v_S\propto\mu^{1/2}\) y \(v_P\) crece más despacio porque depende también de \(K\).</li>
</ul></div>
</deriv>

<deriv id="litosfera-oceanica" title="El enfriamiento de la litosfera oceánica" tags="Geofísica, Calor">
<goal>Cómo se enfría y engrosa el fondo oceánico al alejarse de la dorsal, y por qué el océano es más profundo cuanto más viejo es el fondo.</goal>
<given>
<g>Ecuación de conducción del calor unidimensional \(\partial_tT=\kappa\,\partial_z^2T\); en \(t=0\) (en la dorsal) la roca está a la temperatura del manto \(T_m\); el fondo del mar mantiene \(T_s\).</g>
</given>
<step op="Variable de similitud \(\eta=z/(2\sqrt{\kappa t})\): la ecuación se reduce a una ecuación ordinaria">
\[T''(\eta)+2\eta\,T'(\eta)=0\ \Longrightarrow\ T'(\eta)\propto e^{-\eta^2}.\]
</step>
<step op="Con \(T(0)=T_s\) y \(T(\infty)=T_m\)">
\[T(z,t)=T_s+(T_m-T_s)\,\operatorname{erf}\!\left(\frac z{2\sqrt{\kappa t}}\right).\]
</step>
<step op="Flujo de calor en la superficie">
\[q=k\frac{\partial T}{\partial z}\Big|_{z=0}=\frac{k(T_m-T_s)}{\sqrt{\pi\kappa t}}.\]
</step>
<step op="Espesor térmico: la profundidad donde \(T=T_s+0.9(T_m-T_s)\), es decir, \(\operatorname{erf}\eta_L=0.9\), \(\eta_L=1.163\)">
\[z_L=2\eta_L\sqrt{\kappa t}=2.326\sqrt{\kappa t}.\]
</step>
<step op="Hundimiento isostático: la columna enfriada es más densa (\(\rho=\rho_m[1-\alpha(T-T_m)]\)); el exceso de masa se compensa con un fondo más profundo, de agua">
\[w(t)=\frac{\rho_m\alpha}{\rho_m-\rho_w}\int_0^\infty(T_m-T)\,\mathrm dz=\frac{2\rho_m\alpha(T_m-T_s)}{\rho_m-\rho_w}\sqrt{\frac{\kappa t}\pi}.\]
</step>
<result name="Enfriamiento del semiespacio">\[T=T_s+\Delta T\,\operatorname{erf}\frac z{2\sqrt{\kappa t}},\qquad q=\frac{k\Delta T}{\sqrt{\pi\kappa t}},\qquad w\propto\sqrt t.\]</result>
<vars>
<v s="T" n="temperatura" u="K"/>
<v s="\kappa" n="difusividad térmica" u="m^2 s^-1"/>
<v s="t" n="edad del fondo oceánico" u="s"/>
<v s="z" n="profundidad" u="m"/>
<v s="k" n="conductividad térmica" u="W m^-1 K^-1"/>
<v s="q" n="flujo de calor" u="W m^-2"/>
<v s="\eta" n="variable de similitud" u="1"/>
<v s="z_L" n="espesor térmico" u="m"/>
<v s="\rho_m,\,\rho_w" n="densidades del manto y del agua" u="kg m^-3"/>
<v s="\alpha" n="coeficiente de dilatación térmica" u="K^-1"/>
<v s="\Delta T" n="diferencia \(T_m-T_s\)" u="K"/>
</vars>
<effects>
<e>Con \(\kappa=10^{-6}\) m²/s, \(\Delta T=1300\) K y \(k=3.1\) W/(m·K): a 10 Ma, \(z_L=41.3\) km y \(q=128.0\) mW/m²; a 50 Ma, \(z_L=92.4\) km y \(q=57.2\) mW/m²; a 80 Ma, \(z_L=116.9\) km y \(q=45.3\) mW/m²; a 100 Ma, \(z_L=130.7\) km y \(q=40.5\) mW/m². El flujo disminuye como \(t^{-1/2}\), de acuerdo con las medidas (≈ 100 mW/m² en fondos jóvenes y 50 en los de 80 Ma).</e>
<e>Hundimiento: con \(\alpha=3.1\times10^{-5}\ \text{K}^{-1}\), \(\rho_m=3330\) y \(\rho_w=1000\) kg/m³, a 80 Ma el modelo da 3265 m frente a los 3130 m de la relación empírica \(350\sqrt t\) (\(t\) en Ma), una diferencia de 4 %; la profundidad real pasa de 2.5 km en la dorsal a 5.6 km a 80 Ma. La ley \(\sqrt t\) falla en fondos de más de ≈ 80 Ma, donde se aplana por aporte de calor desde abajo.</e>
</effects>
<limits>
<l>Dimensiones: \(\kappa t\) es un área y \(\sqrt{\kappa t}\) una longitud. ✓</l>
<l>Conducción pura y propiedades constantes: ignora la convección bajo la placa, el calor radiogénico, el calentamiento por cizalladura y la dependencia de \(k\) y \(\kappa\) con la temperatura (el modelo de placa con base a 125 km mejora el ajuste en fondos viejos).</l>
</limits>
<explore sim="geo-litosfera" title="Enfriamiento de la litosfera oceánica: espesor, flujo de calor y hundimiento"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (80 Ma): \(z_L=116.880\) km, \(q=45.2515\) mW/m², hundimiento 3265.47 m y 350√t = 3130.50 m.</li>
<li>Con \(t\) en el eje (log–log): \(z_L\propto t^{1/2}\), \(q\propto t^{-1/2}\) y el hundimiento \(\propto t^{1/2}\).</li>
</ul></div>
</deriv>

<deriv id="dipolo-terrestre" title="El campo dipolar de la Tierra" tags="Geofísica, Magnetismo">
<goal>La intensidad y la inclinación del campo geomagnético dipolar en función de la latitud y la distancia.</goal>
<given>
<g>Fuera de las fuentes, \(\nabla\times\mathbf B=0\) y \(\mathbf B=-\nabla\Psi\) con potencial escalar \(\Psi\); lo más simple es el término dipolar \(\Psi=\dfrac{\mu_0}{4\pi}\dfrac{M\cos\theta}{r^2}\), con \(\theta\) la colatitud geomagnética y \(M=7.8\times10^{22}\ \text{A·m}^2\).</g>
</given>
<step op="Componentes del gradiente en coordenadas esféricas">
\[B_r=-\frac{\partial\Psi}{\partial r}=\frac{\mu_0M}{4\pi}\,\frac{2\cos\theta}{r^3},\qquad B_\theta=-\frac1r\frac{\partial\Psi}{\partial\theta}=\frac{\mu_0M}{4\pi}\,\frac{\sin\theta}{r^3}.\]
</step>
<step op="Latitud \(\lambda=90^\circ-\theta\) y campo ecuatorial en la superficie \(B_0=\mu_0M/4\pi R^3\)">
\[B_\text{vert}=2B_0\left(\frac Rr\right)^3\sin\lambda,\qquad B_\text{hor}=B_0\left(\frac Rr\right)^3\cos\lambda.\]
</step>
<step op="Módulo del campo">
\[B=B_0\left(\frac Rr\right)^3\sqrt{1+3\sin^2\lambda}.\]
</step>
<step op="Inclinación (ángulo de las líneas de campo con la horizontal)">
\[\tan I=\frac{B_\text{vert}}{B_\text{hor}}=2\tan\lambda.\]
</step>
<result name="Dipolo geomagnético">\[B=B_0\left(\frac Rr\right)^3\sqrt{1+3\sin^2\lambda},\qquad\tan I=2\tan\lambda,\qquad B_0=\frac{\mu_0M}{4\pi R^3}.\]</result>
<vars>
<v s="B" n="inducción magnética" u="T"/>
<v s="B_0" n="campo ecuatorial en la superficie" u="T"/>
<v s="M" n="momento dipolar magnético" u="A m^2"/>
<v s="R" n="radio de la Tierra" u="m"/>
<v s="r" n="distancia al centro" u="m"/>
<v s="\lambda" n="latitud geomagnética" u="rad"/>
<v s="I" n="inclinación" u="rad"/>
<v s="\mu_0" n="permeabilidad del vacío" u="H m^-1"/>
<v s="\Psi" n="potencial magnético escalar" u="T m"/>
</vars>
<effects>
<e>Con \(M=7.8\times10^{22}\ \text{A·m}^2\): \(B_0=30.163\ \mu\)T; a 30° de latitud \(B=39.90\ \mu\)T e \(I=49.1^\circ\); a 45°, \(B=47.69\ \mu\)T e \(I=63.43^\circ\); a 60°, \(B=54.38\ \mu\)T e \(I=73.90^\circ\); en los polos \(B=60.33\ \mu\)T (el doble del ecuador) y las líneas son verticales.</e>
<e>El campo decrece como \(r^{-3}\): a una distancia de 2 radios terrestres es \(1/8\) del de la superficie y en la órbita geoestacionaria (\(r=6.6R\)) vale \(0.105\ \mu\)T en el ecuador geomagnético. La brújula de inclinación (\(\tan I=2\tan\lambda\)) permite deducir la latitud a la que se formó una roca magnetizada (paleomagnetismo).</e>
</effects>
<limits>
<l>Dimensiones: \(\mu_0M/(4\pi R^3)\) tiene unidades de \(\mathrm{H\,m^{-1}\cdot A\,m^2/m^3}=\mathrm T\). ✓</l>
<l>Solo el término dipolar centrado (≈ 90 % del campo): el campo real tiene componentes de orden superior, el dipolo está inclinado ≈ 10° respecto al eje de rotación y descentrado, varía con el tiempo (deriva, inversiones) y a grandes distancias el viento solar lo deforma (magnetosfera).</l>
</limits>
<explore sim="geo-dipolo" title="Campo dipolar de la Tierra: intensidad, componentes e inclinación"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(\lambda=45^\circ\), \(r=R\), \(B_0=30.1628\ \mu\)T): \(B=47.6916\ \mu\)T, \(B_\text{vert}=42.66\ \mu\)T, \(B_\text{hor}=21.33\ \mu\)T e \(I=63.435^\circ\).</li>
<li>Con \(r/R\) en el eje (log–log): pendiente −3.</li>
</ul></div>
