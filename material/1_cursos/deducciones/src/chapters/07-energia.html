<template class="chapter-src" data-id="energia" data-num="7" data-title="Trabajo, energía, choques y potencia" data-part="Parte II · Mecánica clásica" data-short="El teorema trabajo–energía con un resorte y rozamiento, el rizo y su altura mínima de 5R/2, los choques unidimensionales con restitución, el ángulo de dispersión entre el laboratorio y el centro de masas y la velocidad máxima de un vehículo">
<p class="lead">La energía es la cantidad que permite resolver un problema de movimiento sin conocer los detalles de la trayectoria. Se deduce de la segunda ley de Newton con un solo truco, \(F\,\mathrm dx=m\,v\,\mathrm dv\), y de ahí salen el teorema trabajo–energía, la energía potencial, la conservación de la energía mecánica y el balance de potencia. Se aplican aquí a un resorte con rozamiento, al rizo (que no se supera con una altura de 2R, sino con 5R/2), a los choques (con y sin conservación de la energía cinética), a la dispersión de partículas, cuyo ángulo cambia al pasar del centro de masas al laboratorio, y a la velocidad máxima de un coche.</p>

<section>
<h2>Fuerzas conservativas y energía potencial</h2>
<p>El <span class="term">trabajo</span> de una fuerza a lo largo de una trayectoria es \(W=\int\mathbf F\cdot\mathrm d\mathbf r\). Una fuerza es <span class="term">conservativa</span> si ese trabajo depende solo de los extremos, lo que equivale a que el trabajo en cualquier circuito cerrado sea cero. Por el teorema de Stokes (capítulo 3), \(\oint\mathbf F\cdot\mathrm d\mathbf l=\iint(\nabla\times\mathbf F)\cdot\mathrm d\mathbf A=0\) para todo circuito si y solo si \(\nabla\times\mathbf F=0\), y entonces existe una función \(U(\mathbf r)\) tal que \(\mathbf F=-\nabla U\), con \(W_{A\to B}=U(A)-U(B)\). Ejemplos: el peso (\(U=mgy\)), el resorte (\(U=\tfrac12kx^2\)) y la fuerza de gravitación \(1/r^2\) (\(U=-GMm/r\)). El rozamiento cinético, que siempre se opone a la velocidad, no lo es: su trabajo en un circuito cerrado es negativo y la energía se transforma en calor. Cuando solo actúan fuerzas conservativas, \(E=K+U\) se conserva.</p>
</section>

<deriv id="resorte-trabajo" title="El teorema trabajo–energía: un bloque lanzado por un resorte con rozamiento" tags="Energía, Rozamiento">
<goal>La rapidez con que un bloque sale de un resorte comprimido sobre una superficie con rozamiento y la distancia total que recorre hasta detenerse.</goal>
<given>
<g>Segunda ley de Newton en una dimensión, \(F=m\,\mathrm dv/\mathrm dt\), y la regla de la cadena.</g>
<g>Resorte ideal, \(F=-kx\), comprimido \(x_0\); rozamiento cinético constante \(\mu mg\) opuesto al movimiento.</g>
</given>
<step op="Escribir el trabajo de una fuerza en una dimensión">
\[F\,\mathrm dx=m\frac{\mathrm dv}{\mathrm dt}\,\mathrm dx=m\,v\,\mathrm dv\ \Longrightarrow\ \int_{x_1}^{x_2}F\,\mathrm dx=\tfrac12mv_2^2-\tfrac12mv_1^2.\]
<why>Como \(\mathrm dx=v\,\mathrm dt\), el producto \(\mathrm dv/\mathrm dt\cdot\mathrm dx\) es \(v\,\mathrm dv\). En tres dimensiones \(\mathbf F\cdot\mathrm d\mathbf r=m\mathbf v\cdot\mathrm d\mathbf v=\mathrm d(\tfrac12mv^2)\): es el teorema trabajo–energía, \(W=\Delta K\).</why>
</step>
<step op="Trabajo del resorte al pasar de \(x=-x_0\) a la longitud natural">
\[W_\text{res}=\int_{-x_0}^{0}(-kx)\,\mathrm dx=\tfrac12kx_0^2.\]
<why>Con la posición \(x\) medida desde la longitud natural, la compresión es \(x=-x_0\) y la fuerza, positiva (empuja).</why>
</step>
<step op="Trabajo del rozamiento en ese tramo">
\[W_\text{roz}=-\mu mg\,x_0.\]
<why>Fuerza constante opuesta al desplazamiento \(x_0\).</why>
</step>
<step op="Aplicar el teorema hasta la longitud natural">
\[\tfrac12mv^2=\tfrac12kx_0^2-\mu mg\,x_0\ \Longrightarrow\ v=\sqrt{\frac{kx_0^2}m-2\mu g\,x_0}.\]
</step>
<step op="Continuar hasta detenerse (solo actúa el rozamiento)">
\[0-\tfrac12mv^2=-\mu mg\,s\ \Longrightarrow\ s=\frac{v^2}{2\mu g},\qquad d_\text{tot}=x_0+s=\frac{kx_0^2}{2\mu mg}.\]
<why>Equivale a igualar toda la energía inicial almacenada con el trabajo total del rozamiento: \(\tfrac12kx_0^2=\mu mg\,d_\text{tot}\).</why>
</step>
<result name="Resorte con rozamiento">\[v=\sqrt{\frac{kx_0^2}m-2\mu gx_0},\qquad d_\text{tot}=\frac{kx_0^2}{2\mu mg}.\]</result>
<vars>
<v s="k" n="constante del resorte" u="kg s^-2"/>
<v s="x_0" n="compresión inicial" u="m"/>
<v s="m" n="masa del bloque" u="kg"/>
<v s="\mu" n="coeficiente de rozamiento cinético" u="1"/>
<v s="g" n="aceleración de la gravedad" u="m s^-2"/>
<v s="v" n="rapidez al pasar por la longitud natural" u="m s^-1"/>
<v s="d_\text{tot}" n="recorrido total hasta detenerse" u="m"/>
</vars>
<effects>
<e>\(k=500\) N/m, \(x_0=0.1\) m, \(m=0.5\) kg, \(\mu=0.3\): \(v=3.068\) m/s (sin rozamiento: 3.162), \(d_\text{tot}=1.699\) m, y \(s=1.599\) m más allá de la longitud natural.</e>
<e>Con \(\mu=0.1\): \(v=3.131\) m/s pero \(d_\text{tot}=5.097\) m (tres veces más, \(d\propto1/\mu\)). Con \(k=1000\): \(v=4.406\); con \(x_0=0.2\): \(v=6.231\) y \(d_\text{tot}=6.796\) m: \(d\) crece como \(x_0^2\) (\(n=2\)) y como \(k\) (\(n=1\)).</e>
<e>La energía almacenada se reparte: \(\tfrac12kx_0^2=2.5\) J; el rozamiento disipa \(\mu mg\,d_\text{tot}=2.5\) J en total, 0.147 J de ellos durante la descompresión.</e>
</effects>
<limits>
<l>Dimensiones: \([kx_0^2/m]=\mathsf M\mathsf T^{-2}\mathsf L^2/\mathsf M=\mathsf L^2\mathsf T^{-2}\) y \([\mu gx_0]=\mathsf L^2\mathsf T^{-2}\). ✓</l>
<l>Si \(kx_0^2/m\lt2\mu gx_0\) el bloque no llega a la longitud natural (el rozamiento estático lo detiene antes); el resultado exige \(kx_0\gt2\mu mg\).</l>
</limits>
<explore sim="resorte" title="Resorte con rozamiento: rapidez de salida y recorrido total"/>
<div class="sim-guide"><ul>
<li>Valores iniciales: \(v=3.0678\) m/s, recorrido total 1.6989 m y distancia libre 1.5989 m.</li>
<li>Seleccione \(\mu\) en el eje: el recorrido total cae como \(1/\mu\) y la rapidez de salida casi no cambia (la fricción actúa solo a lo largo de \(x_0=0.1\) m).</li>
</ul></div>
</deriv>

<deriv id="rizo" title="El rizo: altura mínima y normales" tags="Energía, Movimiento circular">
<goal>La altura mínima desde la que debe soltarse una bolita para dar una vuelta completa en un rizo vertical de radio \(R\), y la fuerza normal en el punto más alto y en el más bajo.</goal>
<given>
<g>Conservación de la energía mecánica (sin rozamiento) y segunda ley de Newton con aceleración centrípeta \(v^2/R\).</g>
<g>Se suelta desde reposo a una altura \(h\) sobre el punto más bajo del rizo.</g>
</given>
<step op="Conservar la energía hasta la altura \(y\) sobre el punto más bajo">
\[mgh=\tfrac12mv^2+mgy\ \Longrightarrow\ v^2=2g(h-y).\]
</step>
<step op="Evaluar en el punto más alto, \(y=2R\)">
\[v_\text{arr}^2=2g(h-2R).\]
</step>
<step op="Segunda ley en la dirección radial en el punto más alto">
\[N+mg=\frac{mv_\text{arr}^2}R\ \Longrightarrow\ N=mg\left(\frac{2h}R-5\right).\]
<why>Arriba, tanto la normal como el peso apuntan hacia el centro. Sustituyendo \(v^2\): \(N=m[2g(h-2R)/R-g]=mg(2h/R-5)\).</why>
</step>
<step op="Exigir que no se despegue (\(N\ge0\))">
\[h\ge\frac52R,\qquad v_\text{arr,mín}=\sqrt{gR}.\]
<why>La altura \(2R\) solo alcanzaría a llegar con velocidad nula y el cuerpo caería antes de llegar; hace falta que la velocidad arriba supere \(\sqrt{gR}\), de donde \(5R/2\).</why>
</step>
<step op="Normal en el punto más bajo (\(v^2=2gh\))">
\[N_\text{abajo}-mg=\frac{m\,2gh}R\ \Longrightarrow\ N_\text{abajo}=mg\left(1+\frac{2h}R\right).\]
</step>
<result name="Rizo">\[h_\text{mín}=\tfrac52R,\qquad \frac{N_\text{arriba}}{mg}=\frac{2h}R-5,\qquad \frac{N_\text{abajo}}{mg}=1+\frac{2h}R.\]</result>
<vars>
<v s="R" n="radio del rizo" u="m"/>
<v s="h" n="altura de salida sobre el punto más bajo" u="m"/>
<v s="g" n="aceleración de la gravedad" u="m s^-2"/>
<v s="v" n="rapidez" u="m s^-1"/>
<v s="N" n="fuerza normal" u="N"/>
<v s="m" n="masa" u="kg"/>
</vars>
<effects>
<e>Con \(R=1\) m y \(h=3.5R\): arriba \(v=5.425\) m/s y \(N=2mg\); abajo \(v=8.287\) m/s y \(N=8mg\) (ocho veces el peso). Con \(h=2.5R\): \(v=3.132=\sqrt{gR}\) y \(N=0\) arriba; con \(h=5R\): \(N=5mg\) arriba y \(11mg\) abajo.</e>
<e>La normal abajo supera en \(6mg\) a la de arriba, sea cual sea \(h\) (\(2h/R+1\) frente a \(2h/R-5\)). La masa no interviene. Con \(R=0.5\) m y \(h=3.5R\): \(v_\text{arr}=3.836\) m/s (\(\propto\sqrt R\)).</e>
</effects>
<limits>
<l>Dimensiones: \(N/mg\) es adimensional y \([2gR(q-2)]=\mathsf L^2\mathsf T^{-2}\). ✓</l>
<l>El mismo razonamiento vale para un péndulo con cuerda: dar la vuelta completa exige \(v_\text{abajo}\ge\sqrt{5gR}\). Con rozamiento, la altura necesaria es mayor.</l>
</limits>
<explore sim="rizo" title="El rizo vertical: velocidades y normales arriba y abajo"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(R=1\), \(h/R=3.5\)): \(N/mg=2\) arriba, \(v=5.4249\) m/s; \(v=8.2867\) m/s y \(N/mg=8\) abajo.</li>
<li>Seleccione \(h/R\) en el eje: la normal arriba cruza el cero en \(h/R=2.5\), el límite de despegue.</li>
</ul></div>
</deriv>

<deriv id="choque-1d" title="Choques unidimensionales con coeficiente de restitución" tags="Momento, Energía">
<goal>Las velocidades finales de dos cuerpos que chocan sobre una recta, con cualquier grado de elasticidad, y la energía que se disipa.</goal>
<given>
<g>Conservación del momento lineal (fuerzas internas iguales y opuestas, ley 3).</g>
<g>Coeficiente de restitución \(e=-(v_2'-v_1')/(v_2-v_1)\); \(e=1\) si se conserva la energía cinética y \(e=0\) si quedan unidos.</g>
</given>
<step op="Escribir la conservación del momento">
\[m_1v_1+m_2v_2=m_1v_1'+m_2v_2'.\]
</step>
<step op="Mostrar que con energía conservada la velocidad relativa se invierte (\(e=1\))">
\[m_1(v_1^2-v_1'^2)=m_2(v_2'^2-v_2^2),\quad m_1(v_1-v_1')=m_2(v_2'-v_2)\ \Rightarrow\ v_1+v_1'=v_2+v_2'.\]
<why>Se divide la ecuación de energías por la del momento (si \(v_1\ne v_1'\)). Es la definición con \(e=1\): \(v_2'-v_1'=-(v_2-v_1)\).</why>
</step>
<step op="Resolver el sistema lineal con \(e\) general">
\[v_1'=\frac{(m_1-em_2)\,v_1+m_2(1+e)\,v_2}{m_1+m_2},\qquad v_2'=\frac{(m_2-em_1)\,v_2+m_1(1+e)\,v_1}{m_1+m_2}.\]
<why>De la restitución, \(v_2'=v_1'+e(v_1-v_2)\); se sustituye en el momento y se despeja \(v_1'\).</why>
</step>
<step op="Calcular la energía disipada">
\[\Delta K=\tfrac12\mu_r(1-e^2)(v_1-v_2)^2,\qquad \mu_r=\frac{m_1m_2}{m_1+m_2}.\]
<why>En el sistema del centro de masas la velocidad relativa pasa de \(v_1-v_2\) a \(-e(v_1-v_2)\); la energía cinética relativa es \(\tfrac12\mu_rv_\text{rel}^2\) y la del centro de masas no cambia.</why>
</step>
<step op="Casos particulares">
\[m_1=m_2,\ e=1:\ v_1'=v_2,\ v_2'=v_1;\qquad e=0:\ v_1'=v_2'=\frac{m_1v_1+m_2v_2}{m_1+m_2};\qquad m_2\to\infty:\ v_1'\to-e\,v_1.\]
</step>
<result name="Choque unidimensional">\[v_1'=\frac{(m_1-em_2)v_1+m_2(1+e)v_2}{m_1+m_2},\qquad \Delta K=\tfrac12\frac{m_1m_2}{m_1+m_2}(1-e^2)(v_1-v_2)^2.\]</result>
<vars>
<v s="m_1,\,m_2" n="masas" u="kg"/>
<v s="v_1,\,v_2" n="velocidades iniciales" u="m s^-1"/>
<v s="v_1',\,v_2'" n="velocidades finales" u="m s^-1"/>
<v s="e" n="coeficiente de restitución" u="1"/>
<v s="\Delta K" n="energía cinética disipada" u="kg m^2 s^-2"/>
<v s="\mu_r" n="masa reducida" u="kg"/>
</vars>
<effects>
<e>\(m_1=2\), \(m_2=1\) kg, \(v_1=5\), \(v_2=-2\) m/s (energía inicial 27 J): \(e=1\): \(v_1'=0.333\), \(v_2'=7.333\) m/s (sin pérdida); \(e=0.5\): 1.5 y 5.0 m/s, \(\Delta K=12.25\) J; \(e=0\): ambas 2.667 m/s, \(\Delta K=16.33\) J (60 %).</e>
<e>Masas iguales (\(e=1\)): intercambian velocidades (\(5\to0\), \(0\to5\)). Una masa tres veces mayor en reposo: \(m_1=1\), \(m_2=3\), \(v_1=4\): rebota con \(-2\) m/s y la otra sale con 2 m/s. Proyectil pesado (\(m_1=10\), \(m_2=1\), \(v_1=3\)): 2.455 y 5.455 m/s: casi no pierde velocidad y el blanco sale a \(\approx2v_1\).</e>
<e>La energía disipada es proporcional a \((1-e^2)\): el 50 % de restitución en velocidad pierde el 75 % de la energía cinética relativa.</e>
</effects>
<limits>
<l>Dimensiones: ambos lados son velocidades; \(\Delta K\) tiene dimensión de energía. ✓ Con \(e=1\): \(\Delta K=0\).</l>
<l>El momento se conserva siempre; la energía solo si \(e=1\). En choques reales \(e\) depende de la velocidad y de los materiales.</l>
</limits>
<explore sim="choque-1d" title="Choque unidimensional: velocidades finales y energía disipada"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(e=1\)): \(v_1'=0.3333\), \(v_2'=7.3333\) m/s, disipación 0 J y \(K_0=27\) J. Seleccione \(e\) en el eje: la energía disipada crece hasta 16.33 J cuando \(e\to0\).</li>
<li>Con \(e=0.5\): \(v_1'=1.5\), \(v_2'=5.0\), \(\Delta K=12.25\) J.</li>
</ul></div>
</deriv>

<deriv id="choque-lab" title="Dispersión elástica: ángulos en el laboratorio y energía transferida" tags="Momento, Dispersión">
<goal>La relación entre el ángulo de dispersión en el sistema del centro de masas y en el laboratorio, el ángulo máximo de desviación y la fracción de energía que recibe el blanco.</goal>
<given>
<g>Partícula 1 (masa \(m_1\), velocidad \(v\)) choca elásticamente con la 2 (masa \(m_2\)) en reposo.</g>
<g>En el sistema del centro de masas (CM), las dos partículas tienen momentos iguales y opuestos; en un choque elástico las rapideces no cambian y solo gira la dirección, un ángulo \(\theta_{cm}\).</g>
</given>
<step op="Velocidad del CM y de la partícula 1 en el CM">
\[V=\frac{m_1v}{m_1+m_2},\qquad u_1=v-V=\frac{m_2v}{m_1+m_2}\ \Longrightarrow\ r\equiv\frac{V}{u_1}=\frac{m_1}{m_2}.\]
</step>
<step op="Rotar \(u_1\) un ángulo \(\theta_{cm}\) y volver al laboratorio sumando \(V\)">
\[v_{1x}'=V+u_1\cos\theta_{cm},\qquad v_{1y}'=u_1\sin\theta_{cm}.\]
</step>
<step op="Obtener el ángulo en el laboratorio">
\[\tan\theta_\text{lab}=\frac{u_1\sin\theta_{cm}}{V+u_1\cos\theta_{cm}}=\frac{\sin\theta_{cm}}{r+\cos\theta_{cm}}.\]
</step>
<step op="Buscar el ángulo máximo">
\[\frac{\mathrm d}{\mathrm d\theta_{cm}}\tan\theta_\text{lab}=0\ \Rightarrow\ \cos\theta_{cm}=-\frac1r\quad(r\gt1)\ \Rightarrow\ \sin\theta_\text{lab,máx}=\frac1r.\]
<why>Si \(m_1\gt m_2\) (\(r\gt1\)) la partícula incidente nunca se desvía más de \(\arcsin(m_2/m_1)\); si \(m_1\le m_2\) puede rebotar hacia atrás (cualquier ángulo hasta 180°).</why>
</step>
<step op="Energía cedida al blanco">
\[|\mathbf v_2'|=2V\sin\frac{\theta_{cm}}2\ \Longrightarrow\ \frac{K_2'}{K_1}=\frac{4m_1m_2}{(m_1+m_2)^2}\sin^2\frac{\theta_{cm}}2.\]
<why>En el CM el blanco tiene rapidez \(V\) y gira el mismo ángulo; en el laboratorio su velocidad es \(V(1-\cos\theta_{cm},\ \sin\theta_{cm})\), de módulo \(2V\sin(\theta_{cm}/2)\).</why>
</step>
<result name="Dispersión elástica">\[\tan\theta_\text{lab}=\frac{\sin\theta_{cm}}{m_1/m_2+\cos\theta_{cm}},\qquad \frac{K_2'}{K_1}=\frac{4m_1m_2}{(m_1+m_2)^2}\sin^2\frac{\theta_{cm}}2.\]</result>
<vars>
<v s="m_1,\,m_2" n="masas del proyectil y del blanco" u="kg"/>
<v s="v" n="velocidad del proyectil" u="m s^-1"/>
<v s="V" n="velocidad del centro de masas" u="m s^-1"/>
<v s="\theta_{cm}" n="ángulo en el centro de masas" u="rad"/>
<v s="\theta_\text{lab}" n="ángulo en el laboratorio" u="rad"/>
<v s="r" n="razón de masas \(m_1/m_2\)" u="1"/>
</vars>
<effects>
<e>Masas iguales (\(r=1\)): \(\theta_\text{lab}=\theta_{cm}/2\), de modo que, con \(\theta_{cm}=90^\circ\), la partícula sale a 45° y el blanco a 45° del otro lado: los dos caminos forman un ángulo recto. Con \(r=2\) y \(\theta_{cm}=90^\circ\): \(\theta_\text{lab}=26.57^\circ\), con máximo \(30^\circ\) y energía cedida 44.4 %; con \(r=5\): 11.31° y máximo 11.54°; con \(r=0.5\): 63.43° (sin límite).</e>
<e>La transferencia máxima (\(\theta_{cm}=180^\circ\)) es \(4r/(1+r)^2\): 100 % para masas iguales, 88.9 % para \(r=2\), 33.1 % para \(r=0.1\) y 0.22 % para un electrón contra un protón. Un neutrón contra carbono-12 (\(r=1/12\)) pierde como máximo el 28.4 % de su energía por choque, y contra hidrógeno, el 100 %: por eso se moderan los neutrones con agua o parafina.</e>
<e>Si el proyectil es mucho más ligero que el blanco (partícula alfa contra oro, \(r=0.020\)), puede rebotar hacia atrás: es lo que Rutherford observó (capítulo 9).</e>
</effects>
<limits>
<l>Dimensiones: ambos resultados son adimensionales (ángulos y razones de energía). ✓</l>
<l>Límites: \(r\to\infty\) (proyectil muy pesado) da \(\theta_\text{lab}\to0\) y transferencia nula; \(r\to0\) da \(\theta_\text{lab}\to\theta_{cm}\) (el blanco pesado casi no se mueve y el proyectil rebota como contra una pared). La fórmula no vale para velocidades próximas a \(c\).</l>
</limits>
<explore sim="choque-lab" title="Dispersión elástica: ángulo en el laboratorio, máximo y energía transferida"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(r=2\), \(\theta_{cm}=90^\circ\)): \(\theta_\text{lab}=26.5651^\circ\), transferencia 0.44444 y máximo \(30.000^\circ\).</li>
<li>Con \(r=1\) y \(\theta_{cm}=90^\circ\): \(\theta_\text{lab}=45^\circ\), transferencia 0.5. Con \(r=0.5\): 63.43°, y el máximo se vuelve 180°.</li>
</ul></div>
</deriv>

<deriv id="vehiculo" title="Potencia y velocidad máxima de un vehículo" tags="Potencia, Fluidos">
<goal>La velocidad máxima que alcanza un vehículo con una potencia dada en las ruedas, teniendo en cuenta la resistencia del aire y la rodadura.</goal>
<given>
<g>Potencia instantánea \(P=\mathbf F\cdot\mathbf v\) (de \(\mathrm dW=\mathbf F\cdot\mathrm d\mathbf r\)).</g>
<g>Resistencia aerodinámica \(F_a=\tfrac12\rho C_DA\,v^2\) (capítulo 1) y de rodadura \(F_r=C_{rr}mg\) (constante).</g>
</given>
<step op="Imponer velocidad constante: la fuerza motriz iguala las resistencias">
\[F=\tfrac12\rho C_DA\,v^2+C_{rr}\,mg.\]
</step>
<step op="Multiplicar por \(v\) para obtener la potencia">
\[P=Fv=\tfrac12\rho C_DA\,v^3+C_{rr}\,mg\,v.\]
</step>
<step op="Comprobar que hay una sola velocidad máxima">
\[\frac{\mathrm dP}{\mathrm dv}=\tfrac32\rho C_DA\,v^2+C_{rr}mg\gt0.\]
<why>La potencia requerida crece de manera monótona con \(v\), así que para cada \(P\) hay una única solución \(v_{\max}\gt0\) de la ecuación cúbica.</why>
</step>
<step op="Límite dominado por el aire (rodadura despreciable)">
\[v_{\max}\simeq\left(\frac{2P}{\rho C_DA}\right)^{1/3}\ \Longrightarrow\ v_{\max}\propto P^{1/3}.\]
</step>
<step op="Resolver la cúbica">
\[\tfrac12\rho C_DA\,v^3+C_{rr}mg\,v-P=0\ \Longrightarrow\ v_{\max}=\text{raíz real positiva (Cardano o numéricamente)}.\]
<why>Al ser una cúbica sin término cuadrático, la fórmula de Cardano da la solución cerrada; aquí se halla por bisección.</why>
</step>
<result name="Velocidad máxima">\[P=\tfrac12\rho C_DA\,v_{\max}^3+C_{rr}mg\,v_{\max}\ \longrightarrow\ v_{\max}\simeq\left(\frac{2P}{\rho C_DA}\right)^{1/3}.\]</result>
<vars>
<v s="P" n="potencia en las ruedas" u="kg m^2 s^-3"/>
<v s="\rho" n="densidad del aire" u="kg m^-3"/>
<v s="C_DA" n="coeficiente de arrastre por área frontal" u="m^2"/>
