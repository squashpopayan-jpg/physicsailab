<template class="chapter-src" data-id="oscilaciones" data-num="8" data-title="Oscilaciones" data-part="Parte II · Mecánica clásica" data-short="El oscilador armónico con resortes en serie y paralelo, el periodo exacto del péndulo con integrales elípticas, el péndulo físico, los modos normales y los batidos de dos osciladores acoplados, y la potencia absorbida en resonancia">
<p class="lead">Cualquier sistema cerca de un equilibrio estable oscila con la misma ecuación: la energía potencial es, a primer orden, una parábola, \(U\simeq\tfrac12U''(x_0)(x-x_0)^2\), y una parábola da una fuerza lineal y un movimiento armónico. Por eso el oscilador es el modelo universal: resortes, péndulos, moléculas, circuitos, ondas. En este capítulo se deducen los resultados que usan las ecuaciones de los capítulos anteriores: la frecuencia del resorte y de sus combinaciones, el periodo exacto del péndulo (que en el capítulo 1 se anunció y aquí se demuestra), el péndulo físico y su periodo mínimo, los modos normales y los batidos de dos osciladores acoplados, y la potencia absorbida por un oscilador forzado, con su anchura de resonancia exacta.</p>

<deriv id="mas-resorte" title="El oscilador armónico: resorte, energía y combinaciones" tags="Oscilaciones, Energía">
<goal>La frecuencia, la energía y las máximas velocidad y aceleración de una masa unida a un resorte, y la constante equivalente de resortes en serie y en paralelo.</goal>
<given>
<g>Ley de Hooke \(F=-kx\): cerca del equilibrio todo potencial se aproxima por \(U\simeq\tfrac12kx^2\), con \(k=U''(x_0)\).</g>
<g>Solución de la ecuación del oscilador armónico (capítulo 4): \(x=A\cos(\omega t+\varphi)\).</g>
</given>
<step op="Escribir la segunda ley de Newton">
\[m\ddot x=-kx\ \Longrightarrow\ \ddot x+\omega^2x=0,\qquad \omega^2=\frac km.\]
</step>
<step op="Usar la solución del oscilador y calcular los derivados">
\[x=A\cos(\omega t+\varphi),\quad v=-\omega A\sin(\omega t+\varphi),\quad a=-\omega^2A\cos(\omega t+\varphi).\]
<why>La amplitud \(A\) y la fase \(\varphi\) son las dos constantes que fijan \(x_0\) y \(v_0\); el periodo \(T=2\pi\sqrt{m/k}\) no depende de ellas (isocronismo).</why>
</step>
<step op="Calcular la energía">
\[E=\tfrac12mv^2+\tfrac12kx^2=\tfrac12m\omega^2A^2\sin^2(\cdot)+\tfrac12kA^2\cos^2(\cdot)=\tfrac12kA^2.\]
<why>Con \(m\omega^2=k\) los dos términos suman \(\tfrac12kA^2\) para todo \(t\): la energía oscila entre cinética y potencial y su suma es constante. Los máximos son \(v_{\max}=\omega A\) y \(a_{\max}=\omega^2A\).</why>
</step>
<step op="Colgar verticalmente: el peso solo desplaza el equilibrio">
\[m\ddot y=-ky+mg\ \Longrightarrow\ y_e=\frac{mg}k,\quad \ddot u+\omega^2u=0\ \text{ con }u=y-y_e.\]
<why>Un peso constante equivale a una fuerza uniforme: cambia el punto de equilibrio, no la frecuencia.</why>
</step>
<step op="Combinar resortes en paralelo y en serie">
\[\text{paralelo (misma extensión): }k_p=k_1+k_2;\qquad \text{serie (misma fuerza): }\frac1{k_s}=\frac1{k_1}+\frac1{k_2}.\]
<why>En paralelo las fuerzas se suman; en serie la fuerza es la misma en cada resorte y las extensiones, \(F/k_i\), se suman: \(F/k_s=F/k_1+F/k_2\).</why>
</step>
<result name="Oscilador armónico">\[\omega=\sqrt{\frac km},\quad T=2\pi\sqrt{\frac mk},\quad E=\tfrac12kA^2,\quad v_{\max}=\omega A,\quad y_e=\frac{mg}k.\]</result>
<vars>
<v s="k" n="constante del resorte" u="kg s^-2"/>
<v s="m" n="masa" u="kg"/>
<v s="A" n="amplitud" u="m"/>
<v s="\omega" n="frecuencia angular" u="rad s^-1"/>
<v s="T" n="periodo" u="s"/>
<v s="E" n="energía total" u="kg m^2 s^-2"/>
<v s="v_{\max}" n="velocidad máxima" u="m s^-1"/>
<v s="y_e" n="desplazamiento del equilibrio por el peso" u="m"/>
<v s="g" n="aceleración de la gravedad" u="m s^-2"/>
</vars>
<effects>
<e>\(k=200\) N/m, \(m=0.5\) kg, \(A=5\) cm: \(\omega=20\) rad/s, \(f=3.183\) Hz, \(T=0.3142\) s, \(E=0.25\) J, \(v_{\max}=1.00\) m/s y \(y_e=2.45\) cm. Cuadruplicar la masa duplica el periodo (\(n_m=\tfrac12\)); cuadruplicar \(k\) lo divide por 2 (\(n_k=-\tfrac12\)); el periodo no depende de \(A\).</e>
<e>La energía crece como \(A^2\) (\(n_A=2\)) y no depende de \(m\): con \(A\) doble, \(E=1\) J, pero \(\omega\) no cambia. En la Luna, el mismo resorte oscila con el mismo periodo (solo cambia \(y_e\)).</e>
<e>Resortes de 100 y 300 N/m: en paralelo, 400 N/m; en serie, 75 N/m (siempre menor que el menor). Dos de 200 N/m en serie dan 100 N/m: partir un resorte a la mitad lo vuelve el doble de duro.</e>
</effects>
<limits>
<l>Dimensiones: \([\sqrt{k/m}]=\mathsf T^{-1}\) y \([kA^2]=\mathsf M\mathsf T^{-2}\mathsf L^2\). ✓</l>
<l>Vale para amplitudes pequeñas (el término cúbico del potencial es despreciable); para una amplitud grande el periodo depende de \(A\) (véase el péndulo).</l>
</limits>
<explore sim="mas-resorte" title="Oscilador armónico: frecuencia, periodo, energía y equilibrio"/>
<div class="sim-guide"><ul>
<li>Valores iniciales: \(\omega=20\) rad/s, \(f=3.1831\) Hz, \(T=0.31416\) s, \(E=0.25\) J, \(v_{\max}=1\) m/s y \(y_e=0.024517\) m. La tabla de sensibilidad de \(T\) muestra \(n_m=0.5\), \(n_k=-0.5\) y \(n_A=0\).</li>
<li>Con \(m=2\) kg: \(\omega=10\) y \(T=0.6283\) s.</li>
</ul></div>
</deriv>

<deriv id="pendulo-exacto" title="El periodo exacto del péndulo: integral elíptica" tags="Oscilaciones, Integrales">
<goal>El periodo de un péndulo simple de amplitud \(\theta_0\) cualquiera, y su desarrollo en potencias de \(\theta_0\).</goal>
<given>
<g>Energía mecánica conservada: \(\tfrac12mL^2\dot\theta^2-mgL\cos\theta=-mgL\cos\theta_0\), con velocidad nula en \(\theta_0\).</g>
<g>Integral elíptica completa de primera especie \(K(m)=\int_0^{\pi/2}(1-m\sin^2\varphi)^{-1/2}\mathrm d\varphi\).</g>
</given>
<step op="Despejar la velocidad angular de la conservación de la energía">
\[\dot\theta=\sqrt{\frac{2g}L\,(\cos\theta-\cos\theta_0)}.\]
</step>
<step op="Integrar un cuarto de periodo (de 0 a \(\theta_0\))">
\[T=4\int_0^{\theta_0}\frac{\mathrm d\theta}{\dot\theta}=4\sqrt{\frac L{2g}}\int_0^{\theta_0}\frac{\mathrm d\theta}{\sqrt{\cos\theta-\cos\theta_0}}.\]
<why>El movimiento es simétrico: el tiempo de ir de 0 a \(\theta_0\) es un cuarto del periodo.</why>
</step>
<step op="Reescribir con el ángulo mitad">
\[\cos\theta-\cos\theta_0=2\left(\sin^2\tfrac{\theta_0}2-\sin^2\tfrac\theta2\right)\ \Longrightarrow\ T=2\sqrt{\frac Lg}\int_0^{\theta_0}\frac{\mathrm d\theta}{\sqrt{k^2-\sin^2(\theta/2)}},\quad k=\sin\tfrac{\theta_0}2.\]
<why>De \(\cos\alpha=1-2\sin^2(\alpha/2)\).</why>
</step>
<step op="Sustituir \(\sin(\theta/2)=k\sin\varphi\)">
\[\mathrm d\theta=\frac{2k\cos\varphi\,\mathrm d\varphi}{\sqrt{1-k^2\sin^2\varphi}},\quad k^2-\sin^2\tfrac\theta2=k^2\cos^2\varphi\ \Longrightarrow\ T=4\sqrt{\frac Lg}\int_0^{\pi/2}\frac{\mathrm d\varphi}{\sqrt{1-k^2\sin^2\varphi}}.\]
<why>Cuando \(\theta\) va de 0 a \(\theta_0\), \(\varphi\) va de 0 a \(\pi/2\). Con \(\cos(\theta/2)=\sqrt{1-k^2\sin^2\varphi}\) se simplifica.</why>
</step>
<step op="Reconocer la integral elíptica">
\[T=4\sqrt{\frac Lg}\,K\!\left(\sin^2\tfrac{\theta_0}2\right).\]
</step>
<step op="Desarrollar en serie con \(K(m)=\tfrac\pi2(1+\tfrac m4+\tfrac{9m^2}{64}+\cdots)\)">
\[T=2\pi\sqrt{\frac Lg}\left(1+\frac{\theta_0^2}{16}+\frac{11\,\theta_0^4}{3072}+\cdots\right).\]
<why>Con \(m=\sin^2(\theta_0/2)\simeq\theta_0^2/4-\theta_0^4/48\); el primer término da la corrección de amplitud del capítulo 1.</why>
</step>
<result name="Periodo exacto del péndulo">\[T=4\sqrt{\frac Lg}\,K\!\left(\sin^2\frac{\theta_0}2\right)=2\pi\sqrt{\frac Lg}\left(1+\frac{\theta_0^2}{16}+\frac{11\theta_0^4}{3072}+\cdots\right).\]</result>
<vars>
<v s="T" n="periodo" u="s"/>
<v s="L" n="longitud del péndulo" u="m"/>
<v s="g" n="aceleración de la gravedad" u="m s^-2"/>
<v s="\theta_0" n="amplitud angular" u="rad"/>
<v s="K" n="integral elíptica completa de primera especie" u="1"/>
</vars>
<effects>
<e>\(T/T_0=2K/\pi\): 1.00191 (10°), 1.01741 (30°), 1.07318 (60°), 1.18034 (90°), 1.37288 (120°), 1.76220 (150°), 2.43936 (170°) y 3.9011 (179°): el periodo diverge logarítmicamente cuando la amplitud tiende a 180°. Con \(L=1\) m, \(g=9.81\): \(T_0=2.0061\) s y \(T(60^\circ)=2.153\) s.</e>
<e>La serie truncada converge deprisa: a 60°, el primer orden (\(1+\theta_0^2/16\)) da 1.06854 (error 0.43 %) y el segundo, 1.07285 (0.03 %); a 120° el primer orden da 1.2742 y el segundo 1.3431 frente a 1.3729 (la serie ya converge mal).</e>
<e>El periodo mide la gravedad con un error que crece con la amplitud: con 10°, la corrección es 0.19 %.</e>
</effects>
<limits>
<l>Dimensiones: \([\sqrt{L/g}]=\mathsf T\) y \(K\) es adimensional. ✓</l>
<l>Límites: \(\theta_0\to0\) da \(K\to\pi/2\) y \(T_0=2\pi\sqrt{L/g}\); \(\theta_0\to\pi\) da \(K\to\infty\): el péndulo tarda un tiempo infinito en dejar el equilibrio inestable.</l>
</limits>
<explore sim="pendulo-exacto" title="Periodo del péndulo con amplitud finita: exacto y serie"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(L=1\), \(g=9.81\), \(60^\circ\)): \(T=2.15287\) s, \(T_0=2.00607\) s, \(T/T_0=1.07318\) y la serie de 2.º orden, 1.07285.</li>
<li>Seleccione θ₀ en el eje: el cociente sube de 1 a más de 3 al acercarse a 175°; el exponente local de \(T\) respecto de \(L\) es 0.5 siempre.</li>
</ul></div>
</deriv>

<deriv id="pendulo-fisico" title="El péndulo físico: periodo y pivote óptimo" tags="Oscilaciones, Rotación">
<goal>El periodo de un cuerpo rígido que oscila alrededor de un eje horizontal que no pasa por su centro de masas, y el punto de suspensión que lo hace mínimo.</goal>
<given>
<g>Ecuación de rotación \(I\ddot\theta=\tau\) respecto del eje, con el peso aplicado en el centro de masas a distancia \(d\) del eje (capítulo 10).</g>
<g>Teorema de Steiner (ejes paralelos): \(I=I_{cm}+md^2\), y para una varilla delgada \(I_{cm}=mL^2/12\) (se deducen en el capítulo 10).</g>
</given>
<step op="Escribir la ecuación de rotación">
\[I\ddot\theta=-mgd\sin\theta\simeq-mgd\,\theta.\]
<why>Para ángulos pequeños \(\sin\theta\simeq\theta\).</why>
</step>
<step op="Identificar la frecuencia">
\[\omega^2=\frac{mgd}I\ \Longrightarrow\ T=2\pi\sqrt{\frac I{mgd}}.\]
</step>
<step op="Insertar el momento de inercia de una varilla">
\[I=\frac{mL^2}{12}+md^2\ \Longrightarrow\ T=2\pi\sqrt{\frac{L^2/12+d^2}{g\,d}}=2\pi\sqrt{\frac{L_\text{eq}}g}.\]
<why>\(L_\text{eq}=(L^2/12+d^2)/d\) es la longitud del péndulo simple con el mismo periodo.</why>
</step>
<step op="Minimizar el periodo respecto de \(d\)">
\[\frac{\mathrm d}{\mathrm dd}\left(\frac{L^2}{12d}+d\right)=0\ \Longrightarrow\ d_m=\frac L{\sqrt{12}}=0.2887\,L,\qquad T_{\min}=2\pi\sqrt{\frac{2d_m}g}.\]
<why>En el mínimo los dos sumandos de \(L_\text{eq}=L^2/12d+d\) son iguales, así que \(L_\text{eq}=2d_m\).</why>
</step>
<step op="Comparar con la suspensión por un extremo">
\[d=\frac L2:\ L_\text{eq}=\frac{L^2/12+L^2/4}{L/2}=\frac23L,\qquad T=2\pi\sqrt{\frac{2L}{3g}}.\]
</step>
<result name="Péndulo físico">\[T=2\pi\sqrt{\frac I{mgd}},\qquad \text{varilla: }\ T=2\pi\sqrt{\frac{L^2/12+d^2}{gd}},\quad d_m=\frac L{\sqrt{12}}.\]</result>
<vars>
<v s="I" n="momento de inercia respecto del eje" u="kg m^2"/>
<v s="d" n="distancia del eje al centro de masas" u="m"/>
<v s="L" n="longitud de la varilla" u="m"/>
<v s="m" n="masa" u="kg"/>
<v s="g" n="aceleración de la gravedad" u="m s^-2"/>
<v s="T" n="periodo" u="s"/>
</vars>
<effects>
<e>Varilla de 1 m, \(g=9.81\): colgada de un extremo (\(d=0.5\) m), \(T=1.638\) s y \(L_\text{eq}=0.667\) m. Con \(d=0.2887\) m el periodo baja a 1.5243 s (mínimo); con \(d=0.1\) m sube a 1.938 s y con \(d=0.3\) m es 1.5248 s (casi igual al mínimo).</e>
<e>El mínimo es muy plano: el periodo varía menos del 0.15 % para \(d\) entre 0.27 y 0.31 m. \(T\propto\sqrt L\) para una fracción \(d/L\) dada (\(n_L=0.5\)). Cerca del centro de masas (\(d\to0\)) el periodo diverge como \(d^{-1/2}\), porque el peso casi no ejerce torque.</e>
<e>Si se suspende un cuerpo de dos ejes \(d_1\), \(d_2\) con el mismo periodo, \(g=4\pi^2(d_1+d_2)/T^2\): el péndulo reversible de Kater, con el que se midió \(g\) con precisión.</e>
</effects>
<limits>
<l>Dimensiones: \([I/(mgd)]=\mathsf M\mathsf L^2/(\mathsf M\mathsf L\mathsf T^{-2}\mathsf L)=\mathsf T^2\). ✓</l>
<l>Límite \(L\to0\) con \(d\) fijo: recupera el péndulo simple, \(L_\text{eq}=d\). Para amplitudes grandes aparece la misma integral elíptica que en el péndulo simple, con \(L\to L_\text{eq}\).</l>
</limits>
<explore sim="pendulo-fisico" title="Péndulo físico de varilla: periodo, longitud equivalente y pivote óptimo"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (varilla de 1 m colgada de un extremo): \(T=1.63795\) s, \(L_\text{eq}=0.66667\) m, \(d_m=0.28868\) m y \(T_{\min}=1.52428\) s.</li>
<li>Seleccione \(d/L\) en el eje: la curva baja hasta 0.289 y vuelve a subir; en la tabla el exponente local de \(T\) respecto de \(d/L\) se anula en el mínimo.</li>
</ul></div>
</deriv>

<deriv id="modos-acoplados" title="Dos osciladores acoplados: modos normales y batidos" tags="Oscilaciones, Álgebra lineal">
<goal>Las frecuencias de oscilación de dos masas iguales unidas entre sí y a las paredes por tres resortes, y el movimiento cuando solo una se desplaza inicialmente.</goal>
<given>
<g>Dos masas \(m\) con desplazamientos \(x_1,x_2\); resortes exteriores \(k\) y resorte central \(k_c\).</g>
<g>Los dos osciladores se suman o se restan: la ecuación es lineal, y la suma y la diferencia se desacoplan por simetría.</g>
</given>
<step op="Escribir las dos ecuaciones de movimiento">
\[m\ddot x_1=-kx_1-k_c(x_1-x_2),\qquad m\ddot x_2=-kx_2-k_c(x_2-x_1).\]
<why>El resorte central se estira \(x_2-x_1\).</why>
</step>
<step op="Sumar y restar">
\[q_+=x_1+x_2:\ m\ddot q_+=-k\,q_+;\qquad q_-=x_1-x_2:\ m\ddot q_-=-(k+2k_c)\,q_-.\]
<why>En la suma el resorte central desaparece (no se estira); en la resta su efecto se duplica.</why>
</step>
<step op="Leer las frecuencias de los modos normales">
\[\omega_1=\sqrt{\frac km}\ (\text{en fase}),\qquad \omega_2=\sqrt{\frac{k+2k_c}m}\ (\text{en oposición}).\]
</step>
<step op="Volver a las coordenadas originales con el desplazamiento inicial \(x_1=A\), \(x_2=0\), reposo">
\[q_\pm(0)=A\ \Rightarrow\ x_1=\tfrac A2(\cos\omega_1t+\cos\omega_2t),\qquad x_2=\tfrac A2(\cos\omega_1t-\cos\omega_2t).\]
</step>
<step op="Usar la identidad suma–producto">
\[x_1=A\cos\frac{(\omega_2-\omega_1)t}2\cos\frac{(\omega_1+\omega_2)t}2,\qquad x_2=A\sin\frac{(\omega_2-\omega_1)t}2\sin\frac{(\omega_1+\omega_2)t}2.\]
<why>\(\cos a+\cos b=2\cos\frac{a+b}2\cos\frac{a-b}2\) y \(\cos a-\cos b=-2\sin\frac{a+b}2\sin\frac{a-b}2\). La amplitud de cada masa varía lentamente (batido) y oscila deprisa a la frecuencia media.</why>
</step>
<step op="Hallar el tiempo de transferencia de energía">
\[t_\text{transf}=\frac\pi{\omega_2-\omega_1},\qquad T_\text{batido}=\frac{2\pi}{\omega_2-\omega_1}.\]
<why>La amplitud de \(x_1\) se anula cuando \((\omega_2-\omega_1)t/2=\pi/2\): toda la energía ha pasado a la otra masa.</why>
</step>
<result name="Modos normales">\[\omega_1=\sqrt{\frac km},\quad \omega_2=\sqrt{\frac{k+2k_c}m},\quad t_\text{transf}=\frac\pi{\omega_2-\omega_1}.\]</result>
<vars>
<v s="k" n="constante de cada resorte exterior" u="kg s^-2"/>
<v s="k_c" n="constante del resorte de acople" u="kg s^-2"/>
<v s="m" n="masa de cada bloque" u="kg"/>
<v s="\omega_1,\,\omega_2" n="frecuencias de los modos normales" u="rad s^-1"/>
<v s="t_\text{transf}" n="tiempo de transferencia total de energía" u="s"/>
</vars>
<effects>
<e>\(k=100\), \(k_c=20\), \(m=1\): \(\omega_1=10\), \(\omega_2=11.832\) rad/s, transferencia total en 1.715 s y batido de 3.429 s. Con acople más débil (\(k_c=5\)): \(\omega_2=10.488\) y 6.437 s; con \(k_c=50\): \(\omega_2=14.142\) y 0.758 s.</e>
<e>Para acople débil (\(k_c\ll k\)): \(\omega_2-\omega_1\simeq k_c/(m\omega_1)\) y el tiempo de transferencia \(\simeq\pi m\omega_1/k_c\): inversamente proporcional al acople (\(n_{k_c}\to-1\)). Con \(k_c=5\) la aproximación da 6.28 s frente a 6.44 s.</e>
<e>Es el mismo fenómeno que la oscilación de dos péndulos acoplados y de los estados de una molécula con dos niveles degenerados: el acople separa las frecuencias en \(\Delta\omega\) y hace saltar la excitación de uno a otro (capítulo 32).</e>
</effects>
<limits>
<l>Dimensiones: \(k/m\) es s⁻². ✓</l>
<l>Límites: \(k_c\to0\) da \(\omega_1=\omega_2\) y los osciladores independientes (el tiempo de transferencia diverge); \(k_c\to\infty\) fuerza \(x_1=x_2\) en el modo \(\omega_1\) (los bloques se mueven juntos).</l>
</limits>
<explore sim="modos-acoplados" title="Osciladores acoplados: frecuencias de los modos y tiempo de transferencia"/>
<div class="sim-guide"><ul>
<li>Valores iniciales: \(\omega_1=10\), \(\omega_2=11.8322\), \(t_\text{transf}=1.71469\) s y \(T_\text{batido}=3.42939\) s.</li>
<li>Seleccione \(k_c\) en el eje (log): el tiempo de transferencia cae casi como \(1/k_c\) para acople débil: la pendiente local es −0.995 en \(k_c=1\) y −0.923 en \(k_c=20\) (\(n=-k_c/[m\omega_2(\omega_2-\omega_1)]\)).</li>
</ul></div>
</deriv>

<deriv id="resonancia-potencia" title="Potencia absorbida por un oscilador forzado y anchura de la resonancia" tags="Oscilaciones, Potencia">
<goal>La potencia media que una fuerza periódica entrega a un oscilador amortiguado, su máximo, y la anchura de la curva de resonancia.</goal>
<given>
<g>Respuesta estacionaria del capítulo 4: \(x=A\cos(\omega t-\delta)\), \(A=(F_0/m)/\sqrt D\), \(\sin\delta=2\gamma\omega/\sqrt D\), con \(D=(\omega_0^2-\omega^2)^2+4\gamma^2\omega^2\).</g>
<g>Promedio de un periodo: \(\langle\cos\omega t\,\sin(\omega t-\delta)\rangle=-\tfrac12\sin\delta\).</g>
</given>
<step op="Calcular la potencia instantánea \(F\dot x\) y promediar">
\[P=\langle F_0\cos\omega t\cdot\dot x\rangle=\langle F_0\cos\omega t\,(-A\omega)\sin(\omega t-\delta)\rangle=\tfrac12F_0\,A\,\omega\,\sin\delta.\]
</step>
<step op="Insertar amplitud y fase">
\[P=\tfrac12F_0\,\omega\,\frac{F_0}{m\sqrt D}\cdot\frac{2\gamma\omega}{\sqrt D}=\frac{F_0^2}{2m}\,\frac{2\gamma\,\omega^2}{(\omega_0^2-\omega^2)^2+4\gamma^2\omega^2}.\]
</step>
<step op="Comprobar con el balance de energía">
\[P_\text{disipada}=b\langle\dot x^2\rangle=2m\gamma\cdot\tfrac12\omega^2A^2=m\gamma\omega^2A^2=\frac{F_0^2\gamma\,\omega^2}{m\,D}.\]
<why>En régimen estacionario la energía almacenada es constante, así que toda la potencia entregada se disipa en el amortiguador (\(b=2m\gamma\)). Coincide con el paso anterior.</why>
</step>
<step op="Máximo: \(\omega=\omega_0\)">
\[P(\omega_0)=\frac{F_0^2}{2m}\cdot\frac{2\gamma\omega_0^2}{4\gamma^2\omega_0^2}=\frac{F_0^2}{4m\gamma}.\]
<why>Para la potencia, a diferencia de la amplitud, el máximo está exactamente en \(\omega_0\) (el denominador es \(4\gamma^2\omega^2\) cuando \(\omega^2=\omega_0^2\)).</why>
</step>
<step op="Puntos de media potencia">
\[\frac{P}{P_{\max}}=\frac{4\gamma^2\omega^2}D=\frac12\ \Rightarrow\ (\omega_0^2-\omega^2)^2=4\gamma^2\omega^2\ \Rightarrow\ \omega_\pm=\sqrt{\omega_0^2+\gamma^2}\pm\gamma.\]
<why>De \(\omega_0^2-\omega^2=\pm2\gamma\omega\) resultan dos cuadráticas en \(\omega\) cuyas raíces positivas son las dos \(\omega_\pm\).</why>
</step>
<step op="Anchura y factor de calidad">
\[\Delta\omega=\omega_+-\omega_-=2\gamma\ \ (\text{exacto}),\qquad Q=\frac{\omega_0}{2\gamma}=\frac{\omega_0}{\Delta\omega}.\]
</step>
<result name="Resonancia de potencia">\[P(\omega)=\frac{F_0^2}{2m}\,\frac{2\gamma\omega^2}{(\omega_0^2-\omega^2)^2+4\gamma^2\omega^2},\quad P_{\max}=\frac{F_0^2}{4m\gamma},\quad \Delta\omega=2\gamma.\]</result>
<vars>
<v s="P" n="potencia media absorbida" u="W"/>
<v s="F_0" n="amplitud de la fuerza" u="N"/>
<v s="m" n="masa" u="kg"/>
<v s="\gamma" n="coeficiente de amortiguamiento" u="s^-1"/>
<v s="\omega" n="frecuencia de la fuerza" u="rad s^-1"/>
<v s="\omega_0" n="frecuencia natural" u="rad s^-1"/>
<v s="\omega_\pm" n="frecuencias de media potencia" u="rad s^-1"/>
</vars>
<effects>
<e>\(m=1\), \(\omega_0=10\), \(\zeta=0.1\) (\(\gamma=1\)), \(F_0=1\) N: \(P_{\max}=0.25\) W a \(\omega_0\); a media potencia (0.125 W), \(\omega_-=9.0499\) y \(\omega_+=11.0499\) rad/s, ancho 2.000 rad/s y \(Q=5\). A \(\omega=5\) y a \(\omega=20\) (ambos a un factor 2 de \(\omega_0\)) la potencia es igual, 4.367 mW: \(P(\omega)=P(\omega_0^2/\omega)\).</e>
<e>\(P_{\max}\propto1/\gamma\) (\(n_\zeta=-1\)) y la anchura \(\propto\gamma\): menos disipación da una resonancia más alta y más estrecha, y el producto «altura × anchura» es constante, \(F_0^2/2m\). \(P_{\max}\propto F_0^2\) (\(n_{F_0}=2\)).</e>
<e>Un diapasón con \(Q\sim10^3\) responde en una banda de 0.1 % de su frecuencia; un amortiguador de coche (\(Q\sim1\)) responde a todas las frecuencias de manera uniforme.</e>
</effects>
<limits>
<l>Dimensiones: \(F_0^2/(m\gamma)=\mathsf M^2\mathsf L^2\mathsf T^{-4}/(\mathsf M\mathsf T^{-1})=\mathsf M\mathsf L^2\mathsf T^{-3}\), una potencia. ✓</l>
<l>Límites: \(\omega\to0\) y \(\omega\to\infty\): \(P\to0\) (en el primer caso la masa sigue la fuerza sin disipar; en el segundo no se mueve). Es la misma forma lorentziana de las líneas espectrales y de las resonancias de partículas (capítulo 37).</l>
</limits>
