<template class="chapter-src" data-id="moleculas" data-num="33" data-title="Moléculas: enlace, orbitales π, vibración, rotación y espectros" data-part="Parte VIII · Física cuántica" data-short="El enlace del H₂⁺ por combinación lineal de orbitales atómicos, los orbitales π de Hückel, el potencial de Morse, el rotor rígido y la banda de rotovibración con el efecto isotópico">
<p class="lead">Una molécula es un problema de muchos cuerpos que se vuelve tratable por una separación de escalas: los núcleos, miles de veces más pesados, se mueven despacio frente a los electrones. De allí salen la curva de energía que explica el enlace, los orbitales moleculares, y los dos movimientos nucleares cuantizados —vibración y rotación— cuyos saltos de energía son los espectros infrarrojo y de microondas que identifican las moléculas.</p>

<deriv id="enlace-h2plus" title="El enlace químico: el ion H₂⁺ por combinación lineal de orbitales atómicos" tags="Moléculas, Enlace">
<goal>La energía del electrón único del H₂⁺ en función de la distancia \(R\) entre los dos protones, y por qué existe un estado enlazante y uno antienlazante.</goal>
<given>
<g>Aproximación de Born–Oppenheimer: como \(M/m\approx1836\), el electrón sigue instantáneamente a los núcleos, que se toman fijos a distancia \(R\); la energía electrónica más la repulsión nuclear, \(U(R)\), es el potencial en que se mueven los núcleos.</g>
<g>Unidades atómicas (\(\hbar=m=e=4\pi\varepsilon_0=1\); longitud en \(a_0\), energía en hartree \(E_h=27.2114\) eV): \(H_\text{el}=-\tfrac12\nabla^2-\dfrac1{r_a}-\dfrac1{r_b}\); orbitales 1s \(a\) y \(b\) centrados en cada protón, \(H_\text{el}\,a=(E_1-1/r_b)\,a\) con \(E_1=-\tfrac12\).</g>
</given>
<step op="Combinación lineal de orbitales atómicos (LCAO) con la normalización correspondiente">
\[\varphi_\pm=\frac{a\pm b}{\sqrt{2(1\pm S)}},\qquad S=\langle a|b\rangle.\]
<why>Por la simetría de intercambio de los dos protones, el orbital debe ser par (g, «gerade») o impar (u, «ungerade») bajo la inversión; ninguna otra combinación es una autofunción de la simetría.</why>
</step>
<step op="Valor medio de la energía electrónica (con \(H_{aa}=H_{bb}\))">
\[E_\pm=\frac{H_{aa}\pm H_{ab}}{1\pm S},\qquad H_{aa}=E_1-J,\quad H_{ab}=E_1S-K,\]
con \(J=\langle a|1/r_b|a\rangle\) (atracción de la nube de un átomo por el otro protón) y \(K=\langle a|1/r_b|b\rangle\) (integral de intercambio).
</step>
<step op="Sumar la repulsión nuclear \(1/R\)">
\[U_\pm(R)=\frac1R-\frac12-\frac{J\pm K}{1\pm S}.\]
</step>
<step op="Integrales en coordenadas esferoidales prolatas (\(r_{a,b}=R(\xi\pm\eta)/2\), \(\mathrm dV=(R/2)^3(\xi^2-\eta^2)\mathrm d\xi\mathrm d\eta\mathrm d\phi\))">
\[S=e^{-R}\left(1+R+\frac{R^2}3\right),\quad J=\frac1R-e^{-2R}\left(1+\frac1R\right),\quad K=e^{-R}(1+R).\]
<why>El jacobiano \((\xi^2-\eta^2)\) cancela la singularidad \(1/r_b=2/R(\xi-\eta)\): todas las integrales se reducen a polinomios por exponenciales.</why>
</step>
<step op="Mínimo del estado g: \(\mathrm dU_g/\mathrm dR=0\) (resolución numérica)">
\[R_e=2.4928\,a_0=1.3191\ \text{Å},\qquad D_e=-\left[U_g(R_e)+\tfrac12\right]E_h=1.7641\ \text{eV}.\]
</step>
<result name="Energía del H₂⁺ (LCAO)">\[U_\pm(R)=E_h\left[\frac1R-\frac12-\frac{J\pm K}{1\pm S}\right]\quad(R\ \text{en unidades de }a_0).\]</result>
<vars>
<v s="U_\pm" n="energía total (electrón + repulsión nuclear)" u="J"/>
<v s="E_h" n="hartree (energía atómica)" u="J"/>
<v s="R" n="distancia entre los núcleos" u="m"/>
<v s="a_0" n="radio de Bohr" u="m"/>
<v s="S" n="integral de solapamiento" u="1"/>
<v s="J" n="integral de Coulomb (en unidades atómicas)" u="1"/>
<v s="K" n="integral de intercambio (en unidades atómicas)" u="1"/>
<v s="D_e" n="energía de enlace" u="J"/>
<v s="\hbar" n="constante de Planck reducida" u="J s"/>
<v s="m" n="masa del electrón" u="kg"/>
</vars>
<effects>
<e>El estado g tiene un mínimo en \(R_e=2.4928\,a_0=1.3191\) Å con \(D_e=1.7641\) eV (la solución exacta, en esferoidales prolatas, da 1.057 Å y 2.793 eV: el LCAO describe el 63 % del enlace). El solapamiento en \(R_e\) es \(S=0.4600\).</e>
<e>A \(R=2\,a_0=1.058\) Å: \(U_g=-1.4632\) eV y \(U_u=+9.2286\) eV; el estado u es repulsivo a toda distancia. A \(R=5\,a_0\) (2.646 Å) \(U_g=-0.5225\) eV y a \(R=10\,a_0\) (5.292 Å) la separación \(U_u-U_g\) es solo 0.0162 eV: al separarse, el electrón queda con un protón y los dos estados convergen al mismo átomo de hidrógeno.</e>
<e>La acumulación de carga entre los núcleos en el estado g (\(\varphi_+^2\) mayor que la suma de las densidades atómicas) es la explicación física del enlace: baja la energía potencial \(-K/(1+S)\) más de lo que sube la cinética.</e>
</effects>
<limits>
<l>Dimensiones: \(E_h=\hbar^2/ma_0^2\) es una energía y todo el corchete es adimensional. ✓</l>
<l>La función de prueba no permite que el orbital se contraiga cerca de los núcleos: dar a \(a\) y \(b\) una carga efectiva variable \(\zeta\) (método variacional del capítulo anterior) conduce a \(\zeta=1.238\), \(R_e=1.060\) Å y \(D_e=2.354\) eV; el valor exacto requiere la solución en esferoidales prolatas (Bates, Ledsham y Stewart, 1953).</l>
</limits>
<explore sim="h2plus" title="Curvas de energía del H₂⁺: orbital enlazante y antienlazante"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(R=1.319\) Å): \(S=0.460094\), \(U_g=-1.76414\) eV, \(U_u=5.73682\) eV e integral \(K=0.28883\).</li>
<li>Con \(R\) en el eje: el mínimo de \(U_g\) está cerca de 1.32 Å y \(U_u\) sube a 28.447 eV a \(R=1\,a_0=0.529\) Å.</li>
</ul></div>
</deriv>

<deriv id="huckel" title="Orbitales π: el método de Hückel, el benceno y la regla 4n + 2" tags="Moléculas, Orbitales">
<goal>Las energías de los electrones π de una cadena cíclica de \(N\) átomos de carbono, la estabilización por deslocalización del benceno y qué anillos son aromáticos.</goal>
<given>
<g>Separación σ–π: los electrones π (uno por átomo) ocupan orbitales \(\psi=\sum_jc_j\,p_j\) de los orbitales \(p\) perpendiculares al plano; los σ forman el esqueleto.</g>
<g>Hückel: \(H_{jj}=\alpha\), \(H_{jk}=\beta<0\) si \(j\) y \(k\) son vecinos (0 en otro caso), solapamientos \(S_{jk}=\delta_{jk}\).</g>
</given>
<step op="Ecuación secular para el anillo (átomos \(j=0,\dots,N-1\) con \(c_{j+N}=c_j\))">
\[\alpha c_j+\beta\,(c_{j-1}+c_{j+1})=E\,c_j.\]
</step>
<step op="Ansatz de onda de Bloch en el anillo: \(c_j=e^{2\pi ikj/N}\)">
\[E_k=\alpha+\beta\,(e^{2\pi ik/N}+e^{-2\pi ik/N})=\alpha+2\beta\cos\frac{2\pi k}N,\qquad k=0,1,\dots,N-1.\]
<why>La condición de periodicidad \(c_{j+N}=c_j\) fuerza \(k\) entero; los valores \(k\) y \(N-k\) dan la misma energía, de modo que todos los niveles salvo \(k=0\) (y \(k=N/2\)) están doblemente degenerados.</why>
</step>
<step op="Benceno (\(N=6\)): seis niveles y llenado con seis electrones (dos por orbital)">
\[E=\alpha+2\beta\ (\times1),\quad\alpha+\beta\ (\times2),\quad\alpha-\beta\ (\times2),\quad\alpha-2\beta\ (\times1)\ \Longrightarrow\ E_\pi=2(\alpha+2\beta)+4(\alpha+\beta)=6\alpha+8\beta.\]
</step>
<step op="Comparar con tres enlaces dobles aislados (etileno, \(2\alpha+2\beta\) cada uno)">
\[E_\text{deslocalización}=(6\alpha+8\beta)-(6\alpha+6\beta)=2\beta\quad(2|\beta|\ \text{de estabilización}).\]
</step>
<step op="Regla 4n + 2: con \(N\) electrones, el anillo cierra capa si \(N=4n+2\)">
\[N=4n+2\ \Longrightarrow\ \text{HOMO–LUMO}=E_{n+1}-E_n=2|\beta|\left[\cos\tfrac{2\pi n}N-\cos\tfrac{2\pi(n+1)}N\right]>0;\qquad N=4n:\ \text{par degenerado y semilleno.}\]
</step>
<result name="Niveles π de un anillo de Hückel">\[E_k=\alpha+2\beta\cos\frac{2\pi k}N,\qquad E_\pi^{\text{benceno}}=6\alpha+8\beta.\]</result>
<vars>
<v s="E_k" n="energía del orbital \(k\)" u="J"/>
<v s="\alpha" n="energía de un electrón en un orbital \(p\) aislado" u="J"/>
<v s="\beta" n="integral de resonancia (negativa)" u="J"/>
<v s="c_j" n="coeficiente del orbital \(p\) del átomo \(j\)" u="1"/>
<v s="N" n="número de átomos del anillo" u="1"/>
<v s="k" n="índice del orbital" u="1"/>
</vars>
<effects>
<e>Benceno: niveles \(-2,-1,-1,+1,+1,+2\) (en unidades de \(|\beta|\) desde \(\alpha\)), \(E_\pi=-8|\beta|\) y deslocalización \(2|\beta|\). Con \(|\beta|=2.4\) eV, la separación HOMO–LUMO es \(2|\beta|=4.8\) eV, es decir, una absorción en \(\lambda=258.3\) nm (el benceno absorbe cerca de 254 nm).</e>
<e>Otros anillos: \(N=4\) (ciclobutadieno) tiene dos orbitales no enlazantes semillenos, deslocalización 0 y brecha 0 (antiaromático); \(N=8\) también brecha 0 (el ciclooctatetraeno real no es plano); \(N=10\): deslocalización \(2.944|\beta|\) y brecha \(1.236|\beta|\) (2.97 eV, \(\lambda=418\) nm); \(N=14\): \(3.976|\beta|\) y \(0.890|\beta|\); \(N=18\): \(5.035|\beta|\) y \(0.695|\beta|\).</e>
<e>Cadena abierta (los niveles son \(\alpha+2\beta\cos[k\pi/(N+1)]\)): butadieno (\(N=4\)) tiene \(\alpha\pm1.618\beta\), \(\alpha\pm0.618\beta\), \(E_\pi=4\alpha+4.472\beta\) y deslocalización de solo \(0.472|\beta|\); hexatrieno, \(0.988|\beta|\). La estabilización del anillo \(4n+2\) es mayor.</e>
</effects>
<limits>
<l>Dimensiones: \(\alpha\) y \(\beta\) son energías; los cosenos son adimensionales. ✓</l>
<l>\(\beta\) es un parámetro empírico: la termoquímica (calor de hidrogenación del benceno) da \(|\beta|\approx0.8\) eV y los espectros \(|\beta|\approx2.4\) eV; el método no incluye repulsión entre electrones y solo es fiable para tendencias (aromaticidad, orden de niveles), no para valores absolutos.</l>
</limits>
<explore sim="huckel" title="Anillos conjugados de Hückel: energía, deslocalización y brecha HOMO–LUMO"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(N=6\), \(|\beta|=2.4\) eV): \(E_\pi-N\alpha=-19.2\) eV, deslocalización 4.8 eV, HOMO–LUMO 4.8 eV y \(\lambda=258.333\) nm.</li>
<li>Seleccione \(N\) en el eje: la brecha desaparece para \(N=4,8,12,\dots\) y es máxima en \(N=6\).</li>
</ul></div>
</deriv>

<deriv id="morse" title="La vibración molecular y el potencial de Morse" tags="Moléculas, Vibración">
<goal>Los niveles de energía vibracionales de una molécula diatómica con un potencial realista que se disocia, y la anarmonicidad que separa los sobretonos del múltiplo exacto de la fundamental.</goal>
<given>
<g>Potencial de Morse \(V(x)=D_e\left(1-e^{-ax}\right)^2\), con \(x=r-r_e\), profundidad \(D_e\) y alcance \(a\); masa reducida \(\mu\).</g>
<g>Cerca del mínimo \(V\approx D_ea^2x^2\), es decir, \(k=2D_ea^2\) y \(\omega_0=\sqrt{k/\mu}=a\sqrt{2D_e/\mu}\).</g>
</given>
<step op="Medir la energía desde el límite de disociación (\(\epsilon=E-D_e\)) y cambiar a \(y=2\lambda e^{-ax}\), con \(\lambda=\sqrt{2\mu D_e}/(a\hbar)\)">
\[y^2\psi''+y\psi'+\left(-\frac{y^2}4+\lambda y-s^2\right)\psi=0,\qquad s^2=-\frac{\lambda^2\epsilon}{D_e}.\]
<why>Con \(\mathrm d/\mathrm dx=-ay\,\mathrm d/\mathrm dy\) y \(\hbar^2a^2/2\mu=D_e/\lambda^2\) la ecuación de Schrödinger se vuelve la de Whittaker; \(y\to0\) corresponde a \(x\to\infty\) (disociación) y \(y\to\infty\) a la compresión.</why>
</step>
<step op="Solución regular en ambos extremos: \(\psi=y^{s}e^{-y/2}f(y)\) transforma la ecuación en la de Kummer">
\[y\,f''+(2s+1-y)\,f'+\left(\lambda-s-\tfrac12\right)f=0.\]
</step>
<step op="La solución es un polinomio (de Laguerre) si el coeficiente es un entero no negativo">
\[\lambda-s-\tfrac12=v=0,1,2,\dots\ \Longrightarrow\ s=\lambda-v-\tfrac12,\qquad\psi_v=y^{s}e^{-y/2}L_v^{(2s)}(y).\]
<why>Si no, \(f\) crece como \(e^y\) y \(\psi\) no es normalizable. Además \(s>0\) (decaimiento hacia la disociación): \(v<\lambda-\tfrac12\), de modo que hay un número finito de niveles ligados.</why>
</step>
<step op="Energía: \(\epsilon=-(D_e/\lambda^2)\,s^2\), sumar \(D_e\) y desarrollar">
\[E_v=D_e-\frac{\hbar^2a^2}{2\mu}\left(\lambda-v-\tfrac12\right)^2=\hbar\omega_0\left(v+\tfrac12\right)-\frac{\left[\hbar\omega_0\left(v+\tfrac12\right)\right]^2}{4D_e}.\]
</step>
<result name="Niveles de Morse">\[E_v=\hbar\omega_0\left(v+\tfrac12\right)-\hbar\omega_0x_e\left(v+\tfrac12\right)^2,\qquad x_e=\frac{\hbar\omega_0}{4D_e},\qquad v_\text{máx}<\frac{1}{2x_e}-\frac12.\]</result>
<vars>
<v s="E_v" n="energía del nivel \(v\) (desde el fondo del pozo)" u="J"/>
<v s="D_e" n="profundidad del pozo" u="J"/>
<v s="a" n="alcance del potencial" u="m^-1"/>
<v s="\mu" n="masa reducida" u="kg"/>
<v s="\hbar" n="constante de Planck reducida" u="J s"/>
<v s="\omega_0" n="frecuencia angular armónica" u="rad s^-1"/>
<v s="x_e" n="constante de anarmonicidad" u="1"/>
<v s="v" n="número vibracional" u="1"/>
<v s="x" n="desplazamiento respecto al equilibrio" u="m"/>
<v s="k" n="constante de fuerza" u="N m^-1"/>
</vars>
<effects>
<e>Monóxido de carbono (\(\mu=6.8562\) u, \(\omega_e=2169.81\ \text{cm}^{-1}\), \(D_e=11.226\) eV): \(k=1901.86\) N/m, \(a=2.2994\ \text{Å}^{-1}\), \(\omega_ex_e=12.999\ \text{cm}^{-1}\). La fundamental cae en \(\omega_e-2\omega_ex_e=2143.81\ \text{cm}^{-1}\) (medida: 2143.27) y el primer sobretono en \(2\omega_e-6\omega_ex_e=4261.62\ \text{cm}^{-1}\) (medido: 4260.06), unos 0.03 % de diferencia.</e>
<e>Niveles: \(E_0=1081.66\ \text{cm}^{-1}\) (energía del punto cero: 134.11 meV), \(E_1=3225.47\), \(E_2=5343.28\), \(E_3=7435.09\ \text{cm}^{-1}\); la separación entre niveles contiguos disminuye linealmente, \(\omega_e-2\omega_ex_e(v+1)\). El último nivel ligado es \(v=82\) (83 niveles).</e>
<e>Si el pozo es más somero (\(D_e\) menor), la anarmonicidad crece como \(1/D_e\): doblar \(D_e\) a igual \(\omega_e\) reduce a la mitad \(\omega_ex_e\).</e>
</effects>
<limits>
<l>Dimensiones: \(\hbar\omega_0\) y \(D_e\) son energías, \(x_e\) adimensional; \(a\sqrt{2D_e/\mu}\) está en \(\mathrm s^{-1}\). ✓</l>
<l>El potencial de Morse es una buena descripción cerca del equilibrio, pero cerca de la disociación los niveles reales siguen la ley de LeRoy–Bernstein, no la de Morse. Los términos de orden superior (\(\omega_ey_e\)) aparecen en el ajuste experimental.</l>
</limits>
<explore sim="morse" title="Niveles de Morse: anarmonicidad, fundamental, sobretono y último nivel ligado"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (CO, \(v=0\)): \(\omega_ex_e=12.9994\ \text{cm}^{-1}\), \(E_0=1081.66\ \text{cm}^{-1}\), fundamental 2143.81, sobretono 4261.62 y \(v_\text{máx}=82\).</li>
<li>Con \(v\) en el eje: \(E_v\) crece menos que linealmente; con \(D_e\): \(\omega_ex_e\propto1/D_e\).</li>
</ul></div>
</deriv>

<deriv id="rotor-rigido" title="La rotación molecular: el rotor rígido y el espectro de microondas" tags="Moléculas, Rotación">
<goal>Los niveles de energía rotacionales de una molécula diatómica, las líneas de absorción de microondas y el nivel más poblado a una temperatura dada.</goal>
<given>
<g>Dos masas \(m_1\) y \(m_2\) a distancia fija \(r\) giran en torno al centro de masa: equivale a una partícula de masa reducida \(\mu\) a distancia \(r\) con momento de inercia \(I=\mu r^2\).</g>
<g>Sin potencial, \(H=\mathbf L^2/(2I)\); las autofunciones de \(\mathbf L^2\) son los armónicos esféricos con autovalor \(J(J+1)\hbar^2\) (capítulo 31).</g>
</given>
<step op="Energías y degeneración">
\[E_J=\frac{\hbar^2}{2I}J(J+1)\ \ (J=0,1,2,\dots),\qquad g_J=2J+1.\]
</step>
<step op="Constante rotacional en número de onda">
\[E_J=hc\,B\,J(J+1),\qquad B=\frac{h}{8\pi^2cI}.\]
</step>
<step op="Regla de selección dipolar: \(\langle J',M|\cos\theta|J,M\rangle\ne0\) solo si \(J'=J\pm1\)">
\[\tilde\nu_{J\to J+1}=B\,[(J+1)(J+2)-J(J+1)]=2B\,(J+1).\]
<why>La molécula debe tener un dipolo eléctrico permanente que gire (las homonucleares como N₂ no tienen espectro de microondas); el integrando \(\cos\theta\) conecta solo armónicos con \(\Delta J=\pm1\), y las líneas resultan equiespaciadas en \(2B\).</why>
</step>
<step op="Población de equilibrio a la temperatura \(T\) (Boltzmann, incluyendo la degeneración)">
\[\frac{N_J}{N_0}=(2J+1)\,e^{-hcBJ(J+1)/kT}.\]
</step>
<step op="Máximo respecto a \(J\): \(\mathrm d/\mathrm dJ=0\)">
\[2-\frac{hcB}{kT}(2J+1)^2=0\ \Longrightarrow\ J_\text{máx}=\sqrt{\frac{kT}{2hcB}}-\frac12.\]
</step>
<result name="Rotor rígido">\[E_J=hcB\,J(J+1),\qquad B=\frac{h}{8\pi^2c\mu r^2},\qquad\tilde\nu_{J\to J+1}=2B(J+1),\qquad J_\text{máx}=\sqrt{\frac{kT}{2hcB}}-\frac12.\]</result>
<vars>
<v s="E_J" n="energía rotacional" u="J"/>
<v s="I" n="momento de inercia" u="kg m^2"/>
<v s="\mu" n="masa reducida" u="kg"/>
<v s="r" n="longitud del enlace" u="m"/>
<v s="B" n="constante rotacional" u="m^-1"/>
<v s="J" n="número rotacional" u="1"/>
<v s="T" n="temperatura" u="K"/>
<v s="k" n="constante de Boltzmann" u="J K^-1"/>
<v s="h" n="constante de Planck" u="J s"/>
<v s="\hbar" n="constante de Planck reducida" u="J s"/>
<v s="c" n="velocidad de la luz" u="m s^-1"/>
</vars>
<effects>
<e>¹²C¹⁶O (\(\mu=6.8562\) u, \(r_e=1.1283\) Å): \(I=1.4494\times10^{-46}\) kg m², \(B_e=1.9314\ \text{cm}^{-1}\), líneas separadas \(2B=3.8627\ \text{cm}^{-1}\) y la primera línea (\(J=0\to1\)) en 115.80 GHz con \(B_e\) (medida: 115.27 GHz, porque la molécula vibra y \(B_0<B_e\) en 0.5 %).</e>
<e>A 300 K, \(kT/hc=208.51\ \text{cm}^{-1}\) y \(J_\text{máx}=6.85\); el nivel discreto más poblado es \(J=7\), con \(N_7/N_0=8.93\). A 100 K, \(J_\text{máx}=3.74\): el espectro se estrecha al enfriar.</e>
<e>\(B\propto1/\mu r^2\): el isótopo ¹³C¹⁶O (\(\mu=7.1724\) u) tiene \(B=1.8462\ \text{cm}^{-1}\) (4.4 % menor), y duplicar \(r\) reduce \(B\) a la cuarta parte (0.48284 cm⁻¹).</e>
</effects>
<limits>
<l>Dimensiones: \(\hbar^2/I\) es una energía; \(h/(8\pi^2cI)\) está en \(\mathrm m^{-1}\). ✓</l>
<l>Rotor rígido: la fuerza centrífuga alarga el enlace en los \(J\) altos (corrección \(-DJ^2(J+1)^2\)) y la molécula vibra (\(B_v=B_e-\alpha_e(v+\tfrac12)\)). En moléculas homonucleares la simetría nuclear (estadística de espín) permite solo \(J\) pares o impares.</l>
</limits>
<explore sim="rotor" title="Rotor rígido: constante B, líneas de microondas y población rotacional"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (CO, \(T=300\) K, \(J=1\)): \(B=1.93136\ \text{cm}^{-1}\), línea \(J=1\to2\) en 231.603 GHz, \(E_1=0.478916\) meV, \(J_\text{máx}=6.84712\) y \(N_1/N_0=2.94494\).</li>
<li>Con \(J\) en el eje: la población pasa por un máximo en \(J_\text{máx}\); con \(r\) o \(\mu\) (log): \(B\propto1/(\mu r^2)\).</li>
</ul></div>
</deriv>

<deriv id="rotovibracion" title="La banda de rotovibración y el efecto isotópico" tags="Moléculas, Espectros">
<goal>Las posiciones de las líneas del espectro infrarrojo de una molécula diatómica (ramas P y R) y el corrimiento de las frecuencias al cambiar un isótopo.</goal>
<given>
<g>Energía en la aproximación armónica y de rotor rígido: \(E_{vJ}=hc\left[\tilde\nu_e\left(v+\tfrac12\right)+BJ(J+1)\right]\), con \(\tilde\nu_e=\omega_e/2\pi c\).</g>
<g>Reglas de selección dipolares: \(\Delta v=+1\) (absorción) y \(\Delta J=\pm1\); en una molécula diatómica de capa cerrada no hay \(\Delta J=0\).</g>
</given>
<step op="Diferencia de energía en el salto \(v=0\to1\), \(J\to J+1\) (rama R)">
\[\tilde\nu_R(J)=\tilde\nu_0+B\left[(J+1)(J+2)-J(J+1)\right]=\tilde\nu_0+2B(J+1),\quad J=0,1,\dots\]
</step>
<step op="Salto \(J\to J-1\) (rama P)">
\[\tilde\nu_P(J)=\tilde\nu_0+B\left[(J-1)J-J(J+1)\right]=\tilde\nu_0-2BJ,\quad J=1,2,\dots\]
</step>
<step op="Estructura de la banda: dos ramas equiespaciadas con hueco central">
\[\tilde\nu_R(0)-\tilde\nu_P(1)=4B,\qquad\text{la línea }\tilde\nu_0\text{ está prohibida }(\Delta J=0).\]
</step>
<step op="Efecto isotópico: la curva de energía de Born–Oppenheimer es la misma, solo cambia \(\mu\)">
\[\omega=\sqrt{\frac k\mu}\ \Longrightarrow\ \tilde\nu'=\tilde\nu\sqrt{\frac\mu{\mu'}},\qquad B'=B\,\frac{\mu}{\mu'}.\]
<why>La constante de fuerza \(k\) depende solo de la distribución electrónica, que es idéntica para isótopos; por eso el cambio de frecuencia permite pesar los isótopos y confirmar el modelo.</why>
</step>
<result name="Banda de rotovibración e isótopos">\[\tilde\nu_R(J)=\tilde\nu_0+2B(J+1),\quad\tilde\nu_P(J)=\tilde\nu_0-2BJ,\quad\tilde\nu'=\tilde\nu\sqrt{\mu/\mu'}.\]</result>
<vars>
<v s="\tilde\nu_0" n="origen de la banda" u="m^-1"/>
<v s="\tilde\nu_{R},\tilde\nu_P" n="números de onda de las ramas R y P" u="m^-1"/>
<v s="B" n="constante rotacional" u="m^-1"/>
<v s="J" n="número rotacional del nivel inferior" u="1"/>
<v s="\mu,\ \mu'" n="masas reducidas de los isotopólogos" u="kg"/>
<v s="k" n="constante de fuerza" u="N m^-1"/>
<v s="\omega" n="frecuencia angular de vibración" u="rad s^-1"/>
</vars>
<effects>
<e>H³⁵Cl (\(\tilde\nu_0=2885.98\ \text{cm}^{-1}\), \(B=10.5934\ \text{cm}^{-1}\)): las líneas están separadas \(2B=21.187\ \text{cm}^{-1}\), R(0) cae en 2907.17 cm⁻¹ y P(1) en 2864.79 cm⁻¹, con un hueco central de \(4B=42.374\ \text{cm}^{-1}\).</e>
<e>H³⁷Cl (\(\mu=0.981077\) u frente a 0.979593 u): \(\tilde\nu'=2883.80\ \text{cm}^{-1}\), corrimiento \(-2.185\ \text{cm}^{-1}\) (cada línea aparece duplicada, en proporción de las abundancias 3:1), y \(B'/B=0.99849\).</e>
<e>Hidrógeno pesado: \(\omega_e(\text{H}_2)/\omega_e(\text{D}_2)\) predicho \(=\sqrt{\mu_{D_2}/\mu_{H_2}}=1.41367\); medido \(4401.21/3115.50=1.41268\), con 0.07 % de diferencia (por la anarmonicidad y la corrección de Born–Oppenheimer).</e>
</effects>
<limits>
<l>Dimensiones: todo está en números de onda (m⁻¹); el cociente \(\mu/\mu'\) es adimensional. ✓</l>
<l>Con \(B_1<B_0\) (el enlace se alarga al vibrar) las líneas R se acercan y las P se separan al crecer \(J\); aparece una rama Q (\(\Delta J=0\)) en moléculas con momento angular electrónico, como NO. A temperatura ambiente, el espectro de rotovibración tiene intensidad modulada por \((2J+1)e^{-E_J/kT}\).</l>
</limits>
