<template class="chapter-src" data-id="estrellas" data-num="38" data-title="Estrellas: equilibrio, escalas de tiempo, enanas blancas y límites" data-part="Parte XI · Astrofísica y cosmología" data-short="El equilibrio hidrostático y la ecuación de Lane–Emden, las escalas de tiempo estelares, el radio de una enana blanca, la masa de Chandrasekhar y el límite de Eddington">
<p class="lead">Una estrella es una esfera de gas que se sostiene a sí misma: la gravedad la comprime y la presión interior —térmica, de degeneración o de radiación— la sostiene. De ese balance, con unas pocas ecuaciones, se estiman la presión y la temperatura del centro del Sol, el tiempo que vive y cuánto tarda en colapsar, el radio de un cadáver estelar y la masa máxima que puede tener, y la luminosidad máxima que no hace estallar la materia que cae sobre un objeto compacto.</p>

<deriv id="politropos" title="Equilibrio hidrostático y politropos: presión y temperatura en el centro del Sol" tags="Estrellas, Estructura">
<goal>La densidad, la presión y la temperatura centrales de una estrella en equilibrio a partir de su masa y su radio, usando una ecuación de estado politrópica.</goal>
<given>
<g>Equilibrio hidrostático y conservación de la masa: \(\dfrac{\mathrm dP}{\mathrm dr}=-\dfrac{Gm(r)\rho}{r^2}\), \(\dfrac{\mathrm dm}{\mathrm dr}=4\pi r^2\rho\).</g>
<g>Ecuación de estado politrópica \(P=K\rho^{1+1/n}\) (el índice \(n\) agrupa una familia de modelos con distinto gradiente de densidad).</g>
</given>
<step op="Estimación por el teorema del virial: multiplicar el equilibrio por \(4\pi r^3\) e integrar">
\[3\int_0^R P\,\mathrm dV=-\Omega,\qquad\Omega=-\int_0^M\frac{Gm}r\mathrm dm\ \Longrightarrow\ \bar T\sim\frac{GM\mu m_u}{kR}.\]
<why>Con una estrella uniforme \(\Omega=-\tfrac35GM^2/R\); para un gas ideal \(\int P\mathrm dV=NkT\): la temperatura media escala como la energía gravitatoria por partícula.</why>
</step>
<step op="Variables adimensionales \(\rho=\rho_c\theta^n\), \(r=a\xi\) con \(a^2=\dfrac{(n+1)K\rho_c^{1/n-1}}{4\pi G}\)">
\[\frac1{\xi^2}\frac{\mathrm d}{\mathrm d\xi}\left(\xi^2\frac{\mathrm d\theta}{\mathrm d\xi}\right)=-\theta^n,\qquad\theta(0)=1,\ \theta'(0)=0.\]
<why>Es la ecuación de Poisson combinada con el equilibrio hidrostático. Sus soluciones son exactas para \(n=0\) (\(\theta=1-\xi^2/6\)), \(n=1\) (\(\sin\xi/\xi\)) y \(n=5\) (\((1+\xi^2/3)^{-1/2}\)); en los demás casos se integra numéricamente.</why>
</step>
<step op="Radio, masa y densidad media: el primer cero \(\xi_1\) de \(\theta\) define la superficie">
\[R=a\xi_1,\qquad M=4\pi a^3\rho_c\left(-\xi^2\theta'\right)_{\xi_1},\qquad\frac{\rho_c}{\bar\rho}=\frac{\xi_1}{3|\theta'(\xi_1)|}.\]
</step>
<step op="Presión central, eliminando \(a\) y \(\rho_c\)">
\[P_c=K\rho_c^{1+1/n}=\frac1{4\pi(n+1)\,\theta'(\xi_1)^2}\,\frac{GM^2}{R^4}.\]
</step>
<step op="Temperatura central con gas ideal">
\[T_c=\frac{P_c\,\mu m_u}{\rho_c\,k}.\]
</step>
<result name="Estructura politrópica">\[\frac{\rho_c}{\bar\rho}=\frac{\xi_1}{3|\theta'_1|},\qquad P_c=\frac{GM^2}{4\pi(n+1)\theta_1'^2R^4},\qquad T_c=\frac{P_c\mu m_u}{\rho_ck}.\]</result>
<vars>
<v s="P" n="presión" u="Pa"/>
<v s="\rho" n="densidad" u="kg m^-3"/>
<v s="G" n="constante de gravitación" u="m^3 kg^-1 s^-2"/>
<v s="M" n="masa de la estrella" u="kg"/>
<v s="R" n="radio de la estrella" u="m"/>
<v s="m_u" n="unidad de masa atómica" u="kg"/>
<v s="\mu" n="peso molecular medio" u="1"/>
<v s="k" n="constante de Boltzmann" u="J K^-1"/>
<v s="T" n="temperatura" u="K"/>
<v s="a" n="escala de longitud del politropo" u="m"/>
<v s="\xi" n="radio adimensional" u="1"/>
</vars>
<effects>
<e>Sol como politropo \(n=3\) (modelo de Eddington; \(\xi_1=6.8968\), \(-\xi^2\theta'=2.0182\)): densidad media 1.410 g/cm³, \(\rho_c/\bar\rho=54.18\), \(\rho_c=76.39\) g/cm³, \(P_c=1.245\times10^{16}\) Pa y \(T_c=11.96\) MK (con \(\mu=0.61\)). Los modelos solares reales dan \(\rho_c\approx150\) g/cm³, \(P_c\approx2.5\times10^{16}\) Pa y \(T_c\approx15.7\) MK: el politropo acierta el orden de magnitud y la forma, no los detalles. La estimación del virial da \(GM\mu m_u/kR=14.0\) MK.</e>
<e>El cociente \(\rho_c/\bar\rho\) crece al aumentar \(n\) (más concentración central): 3.290 para \(n=1\), 5.991 para \(n=3/2\) y 54.18 para \(n=3\). Para \(n=5\) la estrella tendría radio infinito.</e>
<e>Escalas: a masa fija, \(P_c\propto R^{-4}\) y \(T_c\propto M/R\): comprimir una estrella a la mitad del radio multiplica por 16 la presión central y por 2 su temperatura central.</e>
</effects>
<limits>
<l>Dimensiones: \(GM^2/R^4\) tiene unidades de presión. ✓</l>
<l>Un politropo único supone una relación \(P(\rho)\) válida en toda la estrella; el Sol real tiene núcleo radiativo y envoltura convectiva con distinto efectivo \(n\) y la composición cambia con la fusión. El modelo no determina la luminosidad (necesita el transporte de energía).</l>
</limits>
<explore sim="est-politropo" title="Estrella politrópica: ξ₁, densidad, presión y temperatura centrales"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(n=3\), \(M=1\,M_\odot\), \(R=1\,R_\odot\), \(\mu=0.61\)): \(\xi_1=6.89685\), \(\rho_c/\bar\rho=54.1825\), \(\rho_c=76.3854\) g/cm³, \(P_c=1.24485\times10^{16}\) Pa y \(T_c=11.9565\) MK.</li>
<li>Con \(n\) en el eje: \(\rho_c/\bar\rho\) crece rápidamente (de 3.29 en \(n=1\) a 54.2 en \(n=3\)).</li>
</ul></div>
</deriv>

<deriv id="escalas-tiempo" title="Las escalas de tiempo de una estrella: caída libre, Kelvin–Helmholtz y nuclear" tags="Estrellas, Evolución">
<goal>Los tres tiempos que gobiernan la vida de una estrella: cuánto tarda en colapsar, en contraerse radiando su energía gravitatoria y en agotar su combustible nuclear.</goal>
<given>
<g>Una esfera uniforme de masa \(M\) y radio \(R_0\) cae sin presión; la energía gravitatoria es \(\Omega\sim GM^2/R\); la luminosidad \(L\) es constante.</g>
<g>La fusión de 4 hidrógenos en 1 helio libera una fracción \(\epsilon=\dfrac{4m_H-m_\text{He}}{4m_H}=0.0071\) de la masa en reposo y solo el ≈ 10 % del hidrógeno (el núcleo) se quema en la secuencia principal.</g>
</given>
<step op="Caída libre: conservación de la energía de una capa que parte del reposo en \(R_0\)">
\[\dot r^2=2GM\left(\frac1r-\frac1{R_0}\right).\]
</step>
<step op="Integrar con \(r=R_0\cos^2\chi\): tiempo hasta el centro">
\[t_\text{ff}=\int_0^{R_0}\frac{\mathrm dr}{\sqrt{2GM(1/r-1/R_0)}}=\frac\pi2\sqrt{\frac{R_0^3}{2GM}}=\sqrt{\frac{3\pi}{32G\bar\rho}}.\]
<why>La última igualdad usa \(M=\tfrac43\pi R_0^3\bar\rho\): el tiempo de caída libre depende solo de la densidad media.</why>
</step>
<step op="Kelvin–Helmholtz: si la estrella radiara su energía gravitatoria (teorema del virial: la mitad se irradia)">
\[t_\text{KH}\simeq\frac{|\Omega|}L\simeq\frac{GM^2}{RL}.\]
</step>
<step op="Escala nuclear: energía disponible \(0.1\,\epsilon Mc^2\)">
\[t_\text{nuc}=\frac{0.1\times0.007\,Mc^2}L.\]
</step>
<result name="Escalas de tiempo estelares">\[t_\text{ff}=\sqrt{\frac{3\pi}{32G\bar\rho}},\qquad t_\text{KH}=\frac{GM^2}{RL},\qquad t_\text{nuc}=\frac{7\times10^{-4}Mc^2}L.\]</result>
<vars>
<v s="t_\text{ff}" n="tiempo de caída libre" u="s"/>
<v s="t_\text{KH}" n="tiempo de Kelvin–Helmholtz" u="s"/>
<v s="t_\text{nuc}" n="tiempo nuclear" u="s"/>
<v s="\bar\rho" n="densidad media" u="kg m^-3"/>
<v s="G" n="constante de gravitación" u="m^3 kg^-1 s^-2"/>
<v s="M" n="masa" u="kg"/>
<v s="R" n="radio" u="m"/>
<v s="L" n="luminosidad" u="W"/>
<v s="c" n="velocidad de la luz" u="m s^-1"/>
<v s="\epsilon" n="fracción de masa convertida en energía" u="1"/>
</vars>
<effects>
<e>El Sol: \(t_\text{ff}=1769\) s (29.5 minutos), \(t_\text{KH}=3.14\times10^{7}\) años y \(t_\text{nuc}=1.04\times10^{10}\) años; cada segundo convierte \(L/c^2=4.26\times10^{9}\) kg de masa en energía. La jerarquía \(t_\text{ff}\ll t_\text{KH}\ll t_\text{nuc}\) explica por qué la estrella está en equilibrio casi siempre y por qué es estable (ajusta su estructura en tiempos mucho más cortos que los de evolución).</e>
<e>Una estrella de \(10\,M_\odot\) con \(R=5\,R_\odot\) y \(L=10^4\,L_\odot\) vive \(t_\text{nuc}=1.04\times10^{7}\) años, mil veces menos que el Sol; \(t_\text{nuc}\propto M/L\) y como \(L\) crece mucho más rápido que \(M\), las estrellas más masivas son las más efímeras.</e>
</effects>
<limits>
<l>Dimensiones: \(GM^2/(RL)\) es \(\mathrm{J/W}=\mathrm s\). ✓</l>
<l>Estimaciones de orden de magnitud: la caída libre real depende de la presión y la rotación; el 10 % de combustible varía con la masa y la convección; \(t_\text{KH}\) fue la «edad» del Sol que Kelvin propuso en el siglo XIX, incompatible con la geología hasta que se conoció la fusión.</l>
</limits>
<explore sim="est-tiempos" title="Escalas de tiempo estelares: caída libre, Kelvin–Helmholtz y nuclear"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (Sol): \(t_\text{ff}=29.4870\) min, \(t_\text{KH}=31.3993\) millones de años, \(t_\text{nuc}=10.3555\) miles de millones de años y \(L/c^2=4.25922\times10^{9}\) kg/s.</li>
<li>Con \(M\) en el eje (log–log): \(t_\text{KH}\propto M^2\) y \(t_\text{ff}\propto M^{-1/2}\) a \(R\) fijo.</li>
</ul></div>
</deriv>

<deriv id="enana-blanca" title="Enanas blancas: el radio de una estrella degenerada" tags="Estrellas, Degeneración">
<goal>El radio de una estrella sostenida por la presión de degeneración de los electrones, en función de su masa.</goal>
<given>
<g>Gas de Fermi de electrones (capítulo 34): presión \(P=\tfrac25nE_F\) con \(E_F=\dfrac{\hbar^2}{2m_e}(3\pi^2n)^{2/3}\); densidad \(\rho=\mu_em_un_e\), con \(\mu_e\simeq2\) nucleones por electrón.</g>
<g>Equilibrio hidrostático y politropo de índice \(n=3/2\) (ecuación de Lane–Emden con \(\xi_1=3.65375\) y \(-\xi^2\theta'=2.71406\)).</g>
</given>
<step op="Presión de los electrones degenerados no relativistas">
\[P=\frac15\left(3\pi^2\right)^{2/3}\frac{\hbar^2}{m_e}n_e^{5/3}=K\rho^{5/3},\qquad K=\frac{(3\pi^2)^{2/3}\hbar^2}{5m_e(\mu_em_u)^{5/3}}.\]
</step>
<step op="Politropo \(n=3/2\): relación entre masa y escala \(a\)">
\[M=4\pi a^3\rho_c\,m_{3/2},\qquad a^2=\frac{5K}{8\pi G}\rho_c^{-1/3},\qquad R=\xi_1a.\]
</step>
<step op="Eliminar \(\rho_c\): sale una relación explícita \(a(M)\)">
\[a=\frac{5K}{8\pi G}\,(4\pi m_{3/2})^{1/3}\,M^{-1/3}.\]
</step>
<step op="Radio como función de la masa">
\[R=\xi_1\,\frac{5K}{8\pi G}\,(4\pi m_{3/2})^{1/3}\,M^{-1/3}.\]
<why>A mayor masa, menor radio: la gravedad aumenta, y el gas de Fermi se comprime más. Es un comportamiento opuesto al de las estrellas normales.</why>
</step>
<result name="Relación masa–radio de una enana blanca">\[R\propto\frac{\hbar^2}{Gm_e(\mu_em_u)^{5/3}}\,M^{-1/3}.\]</result>
<vars>
<v s="R" n="radio" u="m"/>
<v s="M" n="masa" u="kg"/>
<v s="\hbar" n="constante de Planck reducida" u="J s"/>
<v s="m_e" n="masa del electrón" u="kg"/>
<v s="m_u" n="unidad de masa atómica" u="kg"/>
<v s="\mu_e" n="nucleones por electrón" u="1"/>
<v s="G" n="constante de gravitación" u="m^3 kg^-1 s^-2"/>
<v s="a" n="escala del politropo" u="m"/>
<v s="\rho_c" n="densidad central" u="kg m^-3"/>
</vars>
<effects>
<e>Una enana blanca de \(0.6\,M_\odot\) (\(\mu_e=2\)) tiene \(R=10\,527\) km (0.01513 \(R_\odot\), 1.652 \(R_\oplus\)) y \(\rho_c=1.463\times10^{6}\) g/cm³; con \(1.4\,M_\odot\), \(R=7937\) km. Doblar la masa reduce el radio a \(2^{-1/3}=0.794\) de su valor.</e>
<e>Para Sirius B (\(1.02\,M_\odot\)) el modelo da 8820 km, contra 5840 km observados (+51 %): la aproximación no relativista sobreestima el radio porque en estas densidades los electrones ya son semi-relativistas y la ecuación de estado es más blanda (véase la masa de Chandrasekhar).</e>
</effects>
<limits>
<l>Dimensiones: \(\hbar^2/(Gm_e\,m_u^{5/3})\cdot M^{-1/3}\) tiene unidades de longitud. ✓</l>
<l>Supone electrones totalmente degenerados y no relativistas, temperatura nula y composición uniforme; los iones aportan una presión despreciable. La relación falla cerca de la masa límite, donde \(R\to0\) en el modelo relativista.</l>
</limits>
<explore sim="est-enana" title="Enana blanca: radio y densidad central en función de la masa"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(M=0.6\,M_\odot\), \(\mu_e=2\)): \(R=10\,526.8\) km, \(R/R_\oplus=1.65230\), \(\rho_c=1.46271\times10^{6}\) g/cm³ y \(R/R_\odot=0.0151312\).</li>
<li>Con \(M\) en el eje (log–log): pendiente local −1/3 en \(R\).</li>
</ul></div>
</deriv>

<deriv id="chandrasekhar" title="La masa límite de Chandrasekhar" tags="Estrellas, Relatividad">
<goal>La máxima masa que puede sostener la presión de degeneración de electrones.</goal>
<given>
<g>Para densidades altas los electrones degenerados son ultrarrelativistas: \(E=pc\); presión \(P=\tfrac13\,n\,\langle pc\rangle\) con \(\langle p\rangle=\tfrac34p_F\) y \(p_F=\hbar(3\pi^2n)^{1/3}\).</g>
<g>Politropo \(n=3\) (\(\xi_1=6.89685\), \(\omega_3=-\xi^2\theta'=2.01824\)).</g>
</given>
<step op="Presión ultrarrelativista">
\[P=\frac14\,n_e\,p_Fc=\frac14\left(3\pi^2\right)^{1/3}\hbar c\,n_e^{4/3}=K\rho^{4/3},\qquad K=\frac{(3\pi^2)^{1/3}\hbar c}{4(\mu_em_u)^{4/3}}.\]
</step>
<step op="Masa del politropo en general: \(M=4\pi\left[\dfrac{(n+1)K}{4\pi G}\right]^{3/2}\rho_c^{(3-n)/2}\,\omega_n\)">
\[n=3:\quad\rho_c^{(3-n)/2}=\rho_c^0=1.\]
<why>Para el índice 3 la masa no depende de la densidad central: existe una sola masa de equilibrio. Para masas menores la estrella es no relativista (y más densa al crecer \(M\)); al acercarse a esa masa, \(R\to0\).</why>
</step>
<step op="Masa límite">
\[M_\text{Ch}=4\pi\left(\frac K{\pi G}\right)^{3/2}\omega_3=\frac{\sqrt{3\pi}}2\,\omega_3\,\frac{(\hbar c/G)^{3/2}}{(\mu_em_u)^2}.\]
</step>
<result name="Masa de Chandrasekhar">\[M_\text{Ch}=\frac{\sqrt{3\pi}}2\,\omega_3\left(\frac{\hbar c}G\right)^{3/2}\frac1{(\mu_em_u)^2}\simeq\frac{5.83}{\mu_e^2}\,M_\odot.\]</result>
<vars>
<v s="M_\text{Ch}" n="masa de Chandrasekhar" u="kg"/>
<v s="\hbar" n="constante de Planck reducida" u="J s"/>
<v s="c" n="velocidad de la luz" u="m s^-1"/>
<v s="G" n="constante de gravitación" u="m^3 kg^-1 s^-2"/>
<v s="m_u" n="unidad de masa atómica" u="kg"/>
<v s="\mu_e" n="nucleones por electrón" u="1"/>
<v s="n" n="densidad numérica de electrones" u="m^-3"/>
<v s="p_F" n="cantidad de movimiento de Fermi" u="kg m s^-1"/>
<v s="P" n="presión" u="Pa"/>
<v s="\omega_3" n="constante de Lane–Emden \(-\xi^2\theta'\) en \(n=3\)" u="1"/>
</vars>
<effects>
<e>Con \(\mu_e=2\) (helio, carbono, oxígeno): \(M_\text{Ch}=1.4563\,M_\odot\) (la aproximación 5.83/\(\mu_e^2\) da 1.4575). Con \(\mu_e=2.154\) (núcleo de hierro de una supernova): \(1.2555\,M_\odot\). Ninguna enana blanca fría supera \(\approx1.4\,M_\odot\); por encima el núcleo colapsa a estrella de neutrones o agujero negro, como en las supernovas de tipo Ia (límite de explosión).</e>
<e>\(M_\text{Ch}\) depende solo de constantes fundamentales: \((\hbar c/G)^{3/2}/m_u^2=1.880\,M_\odot\) y el factor numérico es \(\tfrac{\sqrt{3\pi}}{2}\omega_3=3.098\), de modo que el producto es \(5.825\,M_\odot/\mu_e^2\): la masa estelar «universal». Es sensible a \(\mu_e\): \(\propto\mu_e^{-2}\).</e>
</effects>
<limits>
<l>Dimensiones: \((\hbar c/G)^{3/2}/m_u^2\) es una masa (\(\hbar c/G\) es una masa al cuadrado). ✓</l>
<l>Modelo de temperatura nula, composición uniforme y relatividad solo especial; la corrección completa (Chandrasekhar 1931) usa la ecuación de estado general y da 1.4 \(M_\odot\) para \(\mu_e=2\); la rotación, el campo magnético y las capturas electrónicas modifican el límite real.</l>
</limits>
<explore sim="est-chandra" title="Masa de Chandrasekhar según la composición"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(\mu_e=2\)): \(M_\text{Ch}=1.45630\,M_\odot\), aproximación \(1.4575\,M_\odot\) y \(K=4.93482\times10^{9}\) (unidades SI).</li>
<li>Con \(\mu_e\) en el eje (log–log): pendiente local −2 (\(M\propto\mu_e^{-2}\)).</li>
</ul></div>
</deriv>

<deriv id="eddington" title="El límite de Eddington" tags="Estrellas, Radiación">
<goal>La luminosidad máxima de un objeto de masa \(M\) para que la presión de radiación no venza a la gravedad.</goal>
<given>
<g>Plasma de hidrógeno: la radiación empuja a los electrones por dispersión de Thomson (sección eficaz \(\sigma_T\)) y los electrones arrastran a los protones por atracción eléctrica; la gravedad actúa sobre todo en los protones (\(m_p\gg m_e\)).</g>
<g>Flujo de energía a distancia \(r\): \(S=L/4\pi r^2\); la radiación transporta una cantidad de movimiento \(S/c\) por unidad de área y de tiempo.</g>
</given>
<step op="Fuerza de radiación sobre un electrón">
\[F_\text{rad}=\frac{\sigma_TS}c=\frac{\sigma_TL}{4\pi r^2c}.\]
</step>
<step op="Fuerza gravitatoria sobre el par electrón–protón">
\[F_\text{grav}=\frac{GM(m_p+m_e)}{r^2}\simeq\frac{GMm_p}{r^2}.\]
</step>
<step op="Igualar: ambas fuerzas varían como \(1/r^2\), así que el límite no depende de la distancia">
\[L_\text{Edd}=\frac{4\pi GMm_pc}{\sigma_T}=\frac{4\pi GMc}{\kappa},\qquad\kappa=\frac{\sigma_T}{m_p}.\]
</step>
<step op="Crecimiento por acreción con eficiencia \(\eta\): \(L=\eta\dot Mc^2\) y \(\dot M=(1-\eta)\dot M_\text{ac}\)">
\[\frac{\mathrm dM}{\mathrm dt}=\frac{1-\eta}\eta\,\frac{L_\text{Edd}}{c^2}\propto M\ \Longrightarrow\ t_S=\frac{\eta}{1-\eta}\,\frac{\kappa c}{4\pi G}.\]
</step>
<result name="Luminosidad de Eddington">\[L_\text{Edd}=\frac{4\pi GMm_pc}{\sigma_T}\simeq1.26\times10^{31}\,\frac M{M_\odot}\ \text{W}.\]</result>
<vars>
<v s="L_\text{Edd}" n="luminosidad de Eddington" u="W"/>
<v s="G" n="constante de gravitación" u="m^3 kg^-1 s^-2"/>
<v s="M" n="masa del objeto" u="kg"/>
<v s="m_p" n="masa del protón" u="kg"/>
<v s="c" n="velocidad de la luz" u="m s^-1"/>
<v s="\sigma_T" n="sección eficaz de Thomson" u="m^2"/>
<v s="\kappa" n="opacidad por unidad de masa" u="m^2 kg^-1"/>
<v s="\eta" n="eficiencia radiativa" u="1"/>
<v s="t_S" n="tiempo de Salpeter" u="s"/>
</vars>
<effects>
<e>Para \(M=1\,M_\odot\): \(L_\text{Edd}=1.257\times10^{31}\) W \(=3.284\times10^{4}\,L_\odot\); crece linealmente con la masa: \(3.28\times10^{5}\,L_\odot\) para \(10\,M_\odot\) y \(3.28\times10^{6}\,L_\odot\) para \(100\,M_\odot\), de modo que las estrellas muy masivas (cerca de \(100\,M_\odot\)) rozan el límite y pierden masa en vientos intensos.</e>
<e>Agujero negro con \(\eta=0.1\): acretar a \(L_\text{Edd}\) exige \(\dot M=2.2\times10^{-8}\,M_\odot\)/año por cada \(M_\odot\); el tiempo de Salpeter es \(t_S=50\) millones de años (\(\eta/(1-\eta)\) por \(0.45\) mil millones de años), el tiempo en que la masa se multiplica por \(e\); por eso hacen falta semillas de agujeros negros ya a \(z\sim7\) para que existan cuásares de \(10^9\,M_\odot\).</e>
</effects>
<limits>
<l>Dimensiones: \(GMm_pc/\sigma_T\) es \(\mathrm{N\,m^2\,kg^{-1}\cdot kg\cdot m\,s^{-1}/m^2}\cdots=\mathrm W\). ✓</l>
<l>Geometría esférica, acreción estacionaria y opacidad de Thomson: con opacidades mayores (líneas, polvo) el límite efectivo baja; la acreción con geometría de disco puede exceder transitoriamente \(L_\text{Edd}\) (acreción super-Eddington).</l>
</limits>
