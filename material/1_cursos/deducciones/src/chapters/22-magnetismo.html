<template class="chapter-src" data-id="magnetismo" data-num="22" data-title="Magnetostática e inducción" data-part="Parte V · Electromagnetismo" data-short="La ley de Biot–Savart en una espira y las bobinas de Helmholtz, la ley de Ampère en el solenoide con su inductancia, la fuerza de Lorentz y el ciclotrón, la ley de Faraday del generador y el dipolo magnético con el magnetón de Bohr">
<p class="lead">Las corrientes crean campos magnéticos (ley de Biot–Savart, o su forma integral de Ampère) y los campos magnéticos actúan sobre las cargas en movimiento (fuerza de Lorentz). Cuando el campo cambia en el tiempo aparece un campo eléctrico: la ley de Faraday. Estas son las leyes que sostienen los motores, los generadores, los transformadores y los aceleradores de partículas. Se deducen aquí los campos de una espira, un solenoide y un par de bobinas, el movimiento circular de las cargas, la fuerza electromotriz de un generador y la energía de un dipolo magnético, cuyo valor atómico es el magnetón de Bohr (capítulo 31).</p>

<deriv id="biot-espira" title="La ley de Biot–Savart: el campo de una espira y las bobinas de Helmholtz" tags="Magnetostática, Biot–Savart">
<goal>El campo magnético en el eje de una espira circular de radio \(R\) con corriente \(I\), y la disposición de dos bobinas que produce un campo casi uniforme.</goal>
<given>
<g>Ley de Biot–Savart: \(\mathrm d\mathbf B=\dfrac{\mu_0I}{4\pi}\dfrac{\mathrm d\mathbf l\times\hat{\mathbf r}}{r^2}\), con \(\hat{\mathbf r}\) el vector unitario del elemento al punto de observación. Superposición.</g>
</given>
<step op="Geometría sobre el eje: cada elemento está a \(r=\sqrt{R^2+z^2}\) y \(\mathrm d\mathbf l\perp\hat{\mathbf r}\)">
\[|\mathrm d\mathbf B|=\frac{\mu_0I}{4\pi}\frac{\mathrm dl}{R^2+z^2}.\]
</step>
<step op="Solo sobrevive la componente axial (las radiales se cancelan por simetría), con factor \(R/\sqrt{R^2+z^2}\)">
\[\mathrm dB_z=\frac{\mu_0I}{4\pi}\frac{\mathrm dl}{R^2+z^2}\,\frac R{\sqrt{R^2+z^2}}.\]
</step>
<step op="Sumar sobre la circunferencia (\(\oint\mathrm dl=2\pi R\)) y \(N\) espiras">
\[B(z)=\frac{\mu_0NI\,R^2}{2\,(R^2+z^2)^{3/2}},\qquad B(0)=\frac{\mu_0NI}{2R}.\]
</step>
<step op="Dos bobinas coaxiales en \(z=\pm d/2\): anular la segunda derivada en el centro">
\[\frac{\mathrm d^2B}{\mathrm dz^2}\bigg|_{0}\propto\frac{4(d/2)^2-R^2}{\left[R^2+(d/2)^2\right]^{7/2}}=0\ \Longrightarrow\ d=R.\]
</step>
<step op="Campo en el centro del par de Helmholtz">
\[B_H=2\cdot\frac{\mu_0NIR^2}{2\,[R^2+R^2/4]^{3/2}}=\left(\frac45\right)^{3/2}\frac{\mu_0NI}R.\]
</step>
<result name="Espira y Helmholtz">\[B(z)=\frac{\mu_0NIR^2}{2(R^2+z^2)^{3/2}},\qquad B_H=\left(\tfrac45\right)^{3/2}\frac{\mu_0NI}R.\]</result>
<vars>
<v s="B" n="campo magnético sobre el eje" u="T"/>
<v s="\mu_0" n="permeabilidad del vacío" u="H m^-1"/>
<v s="N" n="número de espiras" u="1"/>
<v s="I" n="corriente" u="A"/>
<v s="R" n="radio de la espira" u="m"/>
<v s="z" n="distancia al centro sobre el eje" u="m"/>
<v s="d" n="separación entre las bobinas" u="m"/>
</vars>
<effects>
<e>Una bobina de 100 espiras de 5 cm de radio y 1 A: \(B(0)=1.2566\) mT; a \(z=5\) cm cae a 0.4443 mT (35.4 %, \(2^{-3/2}\)), a 20 cm a 0.01793 mT (1.4 %); decae como \(z^{-3}\) lejos. Con 10 cm de radio, \(B(0)\) es la mitad (0.6283 mT).</e>
<e>Dos bobinas de Helmholtz de estas características dan \(B_H=1.7984\) mT en el centro; a \(z=R/10=5\) mm del centro la variación es de solo \(-0.0114\) %, frente a \(-1.48\) % de una bobina sola. Para anular el campo terrestre (50 µT) con este par bastarían 27.8 mA.</e>
<e>\(B\propto NI\): con 200 espiras o 2 A se duplica (2.513 mT en el centro de una bobina). Un solenoide es la apilación de espiras (siguiente deducción).</e>
</effects>
<limits>
<l>Dimensiones: \([\mu_0I/R]=\mathrm{H\,m^{-1}\,A/m}=\mathrm T\). ✓</l>
<l>Corriente estacionaria en un hilo delgado; las espiras reales tienen espesor y el campo fuera del eje requiere integrales elípticas. La ley de Biot–Savart vale para corrientes que no varían rápidamente (magnetostática).</l>
</limits>
<explore sim="espira" title="Campo de una bobina circular y de un par de Helmholtz"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(N=100\), 1 A, \(R=5\) cm, \(z=5\) cm): \(B(z)=0.444288\) mT, \(B(0)=1.25664\) mT, \(B_H=1.79835\) mT y \(B(z)/B(0)=0.353553\).</li>
<li>Seleccione \(z\) en el eje: \(B\) cae con la forma \((1+z^2/R^2)^{-3/2}\), con pendiente −3 lejos de la espira.</li>
</ul></div>
</deriv>

<deriv id="ampere-solenoide" title="La ley de Ampère: el solenoide, su inductancia y la energía magnética" tags="Magnetostática, Ampère">
<goal>El campo dentro de un solenoide largo, su autoinducción y la energía que almacena el campo.</goal>
<given>
<g>Ley de Ampère: \(\oint\mathbf B\cdot\mathrm d\mathbf l=\mu_0I_\text{enc}\). Flujo magnético \(\Phi=\int\mathbf B\cdot\mathrm d\mathbf A\); autoinducción \(L=N\Phi/I\).</g>
<g>Ley de Faraday (siguiente deducción): una variación de corriente induce \(\varepsilon=-L\,\mathrm dI/\mathrm dt\), de modo que la fuente realiza el trabajo \(\mathrm dW=LI\,\mathrm dI\).</g>
</given>
<step op="Espira rectangular de longitud \(a\) con un lado dentro y otro fuera (\(B\) interior uniforme y \(B_\text{exterior}\approx0\))">
\[B\,a=\mu_0\,n a\,I\ \Longrightarrow\ B=\mu_0nI=\frac{\mu_0NI}\ell.\]
<why>Con \(n=N/\ell\) espiras por metro, la corriente encerrada en la longitud \(a\) es \(naI\). Los lados perpendiculares no aportan porque \(B\) es axial.</why>
</step>
<step op="Flujo concatenado y autoinducción">
\[N\Phi=N\,B\,\pi R^2=\frac{\mu_0N^2\pi R^2}\ell\,I\ \Longrightarrow\ L=\frac{\mu_0N^2\pi R^2}\ell.\]
</step>
<step op="Energía almacenada al subir la corriente de 0 a \(I\)">
\[U=\int_0^ILI'\,\mathrm dI'=\tfrac12LI^2.\]
</step>
<step op="Densidad de energía del campo (volumen \(\pi R^2\ell\))">
\[u=\frac{U}{\pi R^2\ell}=\frac{\tfrac12\mu_0N^2\pi R^2I^2/\ell}{\pi R^2\ell}=\frac{B^2}{2\mu_0}.\]
</step>
<step op="Solenoide corto: centro de un solenoide de longitud \(\ell\) y radio \(R\)">
\[B_c=\frac{\mu_0NI}{\sqrt{\ell^2+4R^2}}.\]
<why>Resulta de sumar las espiras con la expresión de la espira: \(B_c=\tfrac12\mu_0nI(\cos\theta_1-\cos\theta_2)\), con \(\cos\theta=\pm(\ell/2)/\sqrt{R^2+\ell^2/4}\).</why>
</step>
<result name="Solenoide">\[B=\frac{\mu_0NI}\ell,\qquad L=\frac{\mu_0N^2\pi R^2}\ell,\qquad u=\frac{B^2}{2\mu_0}.\]</result>
<vars>
<v s="B" n="campo magnético" u="T"/>
<v s="N" n="número de espiras" u="1"/>
<v s="\ell" n="longitud" u="m"/>
<v s="R" n="radio" u="m"/>
<v s="I" n="corriente" u="A"/>
<v s="L" n="autoinducción" u="H"/>
<v s="U" n="energía magnética" u="J"/>
<v s="u" n="densidad de energía" u="J m^-3"/>
<v s="\mu_0" n="permeabilidad del vacío" u="H m^-1"/>
<v s="\Phi" n="flujo magnético" u="Wb"/>
</vars>
<effects>
<e>Solenoide de 500 espiras, 20 cm de longitud, 2 cm de radio y 2 A: \(B=6.283\) mT dentro (6.161 mT en el centro con la fórmula exacta, 1.9 % menos), \(L=1.974\) mH, \(U=3.948\) mJ y \(u=15.71\) J/m³. Con 1000 espiras: \(B\) se duplica (12.57 mT), \(L\) se cuadruplica (7.896 mH) y \(U\) también (15.79 mJ).</e>
<e>Con la mitad de longitud, \(B\) y \(L\) se duplican (\(\propto1/\ell\)); con el doble de radio, \(L\) se cuadruplica (7.896 mH) pero \(B\) no cambia. A 4 A, la energía se cuadruplica (15.79 mJ). Con 5 cm de longitud la formula del solenoide largo sobreestima el centro: 25.13 frente a 19.63 mT.</e>
<e>Un núcleo de hierro con permeabilidad relativa \(\mu_r\approx10^3\) multiplica \(B\) y \(L\) por \(\mu_r\); la energía de un campo de 1 T es 4×10⁵ J/m³.</e>
</effects>
<limits>
<l>Dimensiones: \([\mu_0N^2A/\ell]=\mathrm{H\,m^{-1}\,m^2/m}=\mathrm H\); \(B^2/\mu_0\) es una energía por volumen. ✓</l>
<l>El campo uniforme y nulo fuera exige \(\ell\gg R\); un solenoide corto necesita las correcciones de borde (\(\sim R/\ell\)). Sin material magnético y a baja frecuencia (sin efecto pelicular). La inductancia mutua se define análogamente.</l>
</limits>
<explore sim="solenoide" title="Solenoide: campo, autoinducción y energía magnética"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(N=500\), 20 cm, 2 cm, 2 A): \(B=6.28319\) mT, \(B_c=6.16117\) mT, \(L=1.97392\) mH, \(U=3.94784\) mJ y \(u=15.7080\) J/m³.</li>
<li>Seleccione \(N\) en el eje (log–log): \(B\) sube con pendiente +1, \(L\) y \(U\) con pendiente +2.</li>
</ul></div>
</deriv>

<deriv id="lorentz-ciclotron" title="La fuerza de Lorentz: el ciclotrón y el efecto Hall" tags="Magnetostática, Lorentz">
<goal>La trayectoria de una carga en un campo magnético uniforme, su frecuencia, y la tensión que aparece en un conductor con corriente (efecto Hall).</goal>
<given>
<g>Fuerza de Lorentz: \(\mathbf F=q\,\mathbf v\times\mathbf B\) (perpendicular a \(\mathbf v\), de modo que no realiza trabajo y \(|\mathbf v|\) es constante).</g>
</given>
<step op="Movimiento circular en el plano perpendicular a \(\mathbf B\): la fuerza magnética es la centrípeta">
\[qvB=\frac{mv^2}r\ \Longrightarrow\ r=\frac{mv}{qB}=\frac p{qB}.\]
</step>
<step op="Frecuencia angular y periodo">
\[\omega_c=\frac vr=\frac{qB}m,\qquad f_c=\frac{qB}{2\pi m},\qquad T=\frac{2\pi m}{qB}.\]
<why>Independientes de \(v\) y del radio (si \(v\ll c\)): es el principio del ciclotrón, que acelera las partículas con un campo eléctrico de frecuencia fija.</why>
</step>
<step op="Velocidad con la energía cinética \(E=\tfrac12mv^2\) y radio en función de \(E\)">
\[v=\sqrt{\frac{2E}m},\qquad r=\frac{\sqrt{2mE}}{qB}.\]
</step>
<step op="Efecto Hall: en un conductor de espesor \(t\) con corriente \(I\) y campo \(B\) perpendicular, en el estado estacionario la fuerza eléctrica equilibra la magnética">
\[qE_H=qv_dB,\qquad I=nqv_dwt\ \Longrightarrow\ V_H=E_Hw=\frac{IB}{nqt}.\]
</step>
<result name="Movimiento en un campo magnético">\[r=\frac{mv}{qB},\qquad f_c=\frac{qB}{2\pi m},\qquad V_H=\frac{IB}{nqt}.\]</result>
<vars>
<v s="r" n="radio de giro (de Larmor)" u="m"/>
<v s="m" n="masa" u="kg"/>
<v s="v" n="velocidad" u="m s^-1"/>
<v s="q" n="carga" u="C"/>
<v s="B" n="campo magnético" u="T"/>
<v s="f_c" n="frecuencia de ciclotrón" u="Hz"/>
<v s="T" n="periodo" u="s"/>
<v s="E" n="energía cinética" u="J"/>
<v s="V_H" n="tensión de Hall" u="V"/>
<v s="I" n="corriente" u="A"/>
<v s="n" n="densidad de portadores" u="m^-3"/>
<v s="t" n="espesor de la lámina" u="m"/>
</vars>
<effects>
<e>Un protón de 1 keV en 1 T: \(v=4.377\times10^5\) m/s, \(r=4.569\) mm, \(f_c=15.245\) MHz y \(T=65.59\) ns. Un electrón de la misma energía: \(r=0.1066\) mm y \(f_c=27.99\) GHz (1836 veces mayor). Un protón de 1 MeV: \(r=0.1445\) m, con la misma frecuencia de 15.245 MHz. Un núcleo de helio (4.0015 u, carga 2): \(r=4.554\) mm y \(f_c=7.675\) MHz.</e>
<e>En el campo terrestre (50 µT) un protón de 1 keV gira con \(r=91.4\) m y \(f_c=762\) Hz, y un electrón de 1 keV con \(r=2.13\) m: así quedan atrapadas las partículas en los cinturones de Van Allen. El radio escala como \(\sqrt{mE}/B\).</e>
<e>Efecto Hall: lámina de cobre de 0.1 mm con 1 A en 1 T: \(V_H=0.737\) µV (\(n=8.47\times10^{28}\) m⁻³); en un semiconductor (\(n=10^{22}\) m⁻³), 6.24 V. El signo da el de los portadores: la prueba histórica de que en algunos materiales conducen cargas positivas.</e>
</effects>
<limits>
<l>Dimensiones: \([mv/qB]=\mathrm{kg\,m\,s^{-1}/(C\,T)}=\mathrm m\) (con \(\mathrm T=\mathrm{kg\,C^{-1}s^{-1}}\)). ✓</l>
<l>No relativista: para \(v\to c\) debe usarse \(m\to\gamma m\), y la frecuencia disminuye con la energía (de ahí el sincrociclotrón). El campo uniforme se supone constante en la escala del radio; si varía, la partícula deriva (deriva \(\nabla B\), espejos magnéticos).</l>
</limits>
<explore sim="ciclotron" title="Partícula cargada en un campo magnético: radio, frecuencia y periodo"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (protón, 1 keV, 1 T): \(r=4.56939\) mm, \(f_c=15.2452\) MHz, \(v=4.37695\times10^5\) m/s y \(T=65.5944\) ns.</li>
<li>Seleccione \(B\) en el eje (log–log): \(r\) cae con pendiente −1 y \(f_c\) sube con pendiente +1; con la energía \(r\) sube con pendiente +0.5 y \(f_c\) no cambia.</li>
</ul></div>
</deriv>

<deriv id="faraday-generador" title="La ley de Faraday: la fuerza electromotriz de un generador" tags="Inducción, Faraday">
<goal>La fuerza electromotriz inducida en un conductor que se mueve en un campo magnético y la de una bobina que gira (generador de corriente alterna).</goal>
<given>
<g>Fuerza de Lorentz sobre las cargas del conductor; ley de Faraday–Lenz: \(\varepsilon=-\mathrm d\Phi/\mathrm dt\).</g>
</given>
<step op="Barra de longitud \(l\) que se mueve con velocidad \(v\) perpendicular a \(B\): la fuerza sobre una carga por unidad de carga es \(\mathbf v\times\mathbf B\)">
\[\varepsilon=\int(\mathbf v\times\mathbf B)\cdot\mathrm d\mathbf l=Blv.\]
</step>
<step op="La misma fem con la regla del flujo (barra deslizando sobre carriles, \(\Phi=Blx\))">
\[\left|\frac{\mathrm d\Phi}{\mathrm dt}\right|=Bl\frac{\mathrm dx}{\mathrm dt}=Blv.\]
<why>Las dos descripciones coinciden: es la ley de Faraday en su forma de flujo. El signo menos (Lenz) dice que la corriente inducida se opone a la variación de flujo.</why>
</step>
<step op="Bobina de \(N\) espiras de área \(A\) que gira con velocidad angular \(\omega\): flujo concatenado">
\[\Phi(t)=NBA\cos\omega t.\]
</step>
<step op="Derivar">
\[\varepsilon(t)=-\frac{\mathrm d\Phi}{\mathrm dt}=NBA\omega\,\sin\omega t,\qquad\varepsilon_0=NBA\omega,\qquad\varepsilon_\text{rms}=\frac{\varepsilon_0}{\sqrt2}.\]
</step>
<result name="Fuerza electromotriz inducida">\[\varepsilon=Blv,\qquad\varepsilon(t)=NBA\omega\sin\omega t.\]</result>
<vars>
<v s="\varepsilon" n="fuerza electromotriz" u="V"/>
<v s="B" n="campo magnético" u="T"/>
<v s="l" n="longitud de la barra" u="m"/>
<v s="v" n="velocidad de la barra" u="m s^-1"/>
<v s="\Phi" n="flujo magnético" u="Wb"/>
<v s="N" n="número de espiras" u="1"/>
<v s="A" n="área de la bobina" u="m^2"/>
<v s="\omega" n="velocidad angular" u="rad s^-1"/>
<v s="t" n="tiempo" u="s"/>
<v s="x" n="posición de la barra" u="m"/>
</vars>
<effects>
<e>Una bobina de 100 espiras de 100 cm² en un campo de 0.5 T que gira a 50 Hz (\(\omega=314.16\) rad/s) produce \(\varepsilon_0=157.08\) V (111.07 V eficaces). A 60 Hz, 188.50 V; con el doble de espiras, o el doble de campo o de área, 314.16 V; a 25 Hz, 78.54 V. El flujo máximo es 0.5 Wb.</e>
<e>Una barra de 0.2 m que se mueve a 3 m/s en un campo de 0.5 T: \(\varepsilon=0.3\) V. Si cierra un circuito de resistencia \(R\), la corriente \(I=Blv/R\) produce una fuerza de frenado \(B^2l^2v/R\): la energía eléctrica sale del trabajo mecánico (conservación).</e>
<e>La fem es proporcional a la velocidad de giro, por lo que las turbinas hidráulicas y de vapor, que giran a 50–60 Hz, necesitan miles de espiras y campos de 1–2 T para generar tensiones de kilovoltios.</e>
</effects>
<limits>
<l>Dimensiones: \([Blv]=\mathrm{T\,m\cdot m/s}=\mathrm{V}\) y \([NBA\omega]=\mathrm{T\,m^2\,s^{-1}}=\mathrm{Wb\,s^{-1}}=\mathrm V\). ✓</l>
<l>Campo uniforme y circuito rígido; con campos variables la ley sigue valiendo en su forma local, \(\nabla\times\mathbf E=-\partial\mathbf B/\partial t\) (primera ecuación de Maxwell que se estudia en el capítulo 23). Las corrientes de Foucault y la autoinducción de la bobina reducen la tensión útil.</l>
</limits>
<explore sim="generador" title="Generador de corriente alterna: fem máxima y eficaz"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (100 espiras, 0.5 T, 100 cm², 50 Hz): \(\varepsilon_0=157.080\) V, \(\varepsilon_\text{rms}=111.072\) V, \(\omega=314.159\) rad/s y \(\Phi_0=0.5\) Wb.</li>
<li>Seleccione \(f\) en el eje (log–log): ε y ω suben con pendiente +1; el flujo máximo no depende de la frecuencia.</li>
</ul></div>
</deriv>

<deriv id="dipolo-magnetico" title="El dipolo magnético: par, energía y magnetón de Bohr" tags="Magnetostática, Dipolos">
<goal>El par y la energía de una espira con corriente en un campo \(\mathbf B\), y el momento magnético de un electrón en órbita.</goal>
<given>
<g>Fuerza sobre un segmento de corriente: \(\mathbf F=I\,\mathbf l\times\mathbf B\). Momento angular orbital cuantizado \(L=\hbar\) en el estado fundamental (modelo de Bohr, capítulo 29).</g>
</given>
<step op="Espira rectangular de lados \(a\) y \(b\), con su normal formando un ángulo \(\theta\) con \(\mathbf B\): las fuerzas en los lados de longitud \(a\) forman un par">
\[F=IaB,\qquad\tau=F\,b\sin\theta=I\,(ab)\,B\sin\theta=\mu B\sin\theta,\qquad\mu=IA.\]
</step>
<step op="Energía de orientación (trabajo del par)">
\[U(\theta)=\int\tau\,\mathrm d\theta=-\mu B\cos\theta=-\boldsymbol\mu\cdot\mathbf B.\]
</step>
<step op="Electrón en órbita circular: corriente \(I=-e/T=-ev/(2\pi r)\) y momento angular \(L=mvr\)">
\[\mu=I\pi r^2=-\frac{e\,v\,r}{2}=-\frac e{2m}L.\]
</step>
<step op="Con \(L=\hbar\): magnetón de Bohr">
\[\mu_B=\frac{e\hbar}{2m_e}=9.274\times10^{-24}\ \mathrm{J/T}.\]
</step>
<step op="Energía de un electrón (\(\mu=\mu_B\)) en un campo \(B\) y frecuencia de transición entre orientaciones">
\[\Delta E=2\mu_BB\ \Longrightarrow\ f=\frac{\mu_BB}h\quad(\text{precesión de Larmor, }13.996\ \mathrm{GHz/T}).\]
</step>
<result name="Dipolo magnético">\[\tau=\mu B\sin\theta,\qquad U=-\mu B\cos\theta,\qquad\mu_B=\frac{e\hbar}{2m_e}.\]</result>
<vars>
<v s="\mu" n="momento magnético" u="A m^2"/>
<v s="I" n="corriente" u="A"/>
<v s="A" n="área de la espira" u="m^2"/>
<v s="B" n="campo magnético" u="T"/>
<v s="\theta" n="ángulo entre \(\mu\) y \(B\)" u="rad"/>
<v s="\tau" n="par" u="N m"/>
<v s="U" n="energía" u="J"/>
<v s="e" n="carga elemental" u="C"/>
<v s="m_e" n="masa del electrón" u="kg"/>
<v s="\hbar" n="constante de Planck reducida" u="J s"/>
<v s="\mu_B" n="magnetón de Bohr" u="J T^-1"/>
<v s="L" n="momento angular" u="kg m^2 s^-1"/>
<v s="f" n="frecuencia de precesión" u="Hz"/>
<v s="h" n="constante de Planck" u="J s"/>
</vars>
<effects>
<e>Una bobina de 10 espiras de 10 cm² con 1 A: \(\mu=0.01\) A·m². En 0.1 T y \(\theta=60^\circ\): \(\tau=0.866\) mN·m y \(U=-0.5\) mJ; a 90° el par es máximo (1 mN·m); a 0° el equilibrio es estable (\(U=-1\) mJ) y a 180° inestable (\(U=+1\) mJ), con par nulo en ambos. Con el doble de espiras todo se duplica (\(\mu=0.02\)).</e>
<e>Ese momento equivale a \(1.078\times10^{21}\mu_B\). El electrón libre (con espín, \(g\approx2\)) en 0.1 T precesa a 1.3996 GHz con el momento orbital y 2.799 GHz con \(g=2\) (resonancia de espín electrónico); a 0.34 T son 9.52 GHz, la banda X habitual de la resonancia de espín electrónico (el mismo principio sostiene la resonancia magnética nuclear).</e>
<e>Es el mismo par que mueve un motor: \(\tau=NIAB\sin\theta\); el conmutador invierte la corriente cada media vuelta para mantener el signo.</e>
</effects>
<limits>
<l>Dimensiones: \([IA]=\mathrm{A\,m^2}\) y \([\mu B]=\mathrm{A\,m^2\,T}=\mathrm J\). ✓</l>
<l>Campo uniforme (en un campo no uniforme, además hay fuerza \(\nabla(\boldsymbol\mu\cdot\mathbf B)\), usada en la prueba de Stern–Gerlach). El valor cuántico del momento orbital y del espín requiere la mecánica cuántica (capítulos 31–32); el argumento de Bohr es heurístico pero da el valor correcto de \(\mu_B\).</l>
