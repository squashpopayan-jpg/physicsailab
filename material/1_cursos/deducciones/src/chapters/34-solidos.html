<template class="chapter-src" data-id="solidos" data-num="34" data-title="Los sólidos cristalinos: difracción, fonones, electrones y bandas" data-part="Parte IX · Materia condensada" data-short="La ley de Bragg y el factor de estructura, la dispersión de fonones, el calor específico de Debye, el gas de electrones libres de Sommerfeld y las bandas de Kronig–Penney">
<p class="lead">Un cristal es una repetición exacta de una celda. Esa periodicidad cambia las reglas: la luz y los electrones solo se difractan en direcciones discretas, las vibraciones se organizan en ondas colectivas (fonones) y los niveles de energía de los electrones forman bandas separadas por brechas. Las cinco deducciones de este capítulo dan, con aproximaciones simples, los números que miden los laboratorios: ángulos de difracción, calores específicos, energías de Fermi y anchos de brecha.</p>

<deriv id="bragg" title="Difracción de rayos X: la ley de Bragg, la condición de Laue y el factor de estructura" tags="Sólidos, Difracción">
<goal>Las direcciones en que un cristal difracta rayos X y qué reflexiones desaparecen por la simetría de la celda (silicio, estructura de diamante).</goal>
<given>
<g>Red de puntos \(\mathbf R=n_1\mathbf a_1+n_2\mathbf a_2+n_3\mathbf a_3\); onda incidente \(e^{i\mathbf k\cdot\mathbf r}\) con \(k=2\pi/\lambda\); dispersión elástica \(|\mathbf k'|=|\mathbf k|\) y dispersión por cada punto con amplitud \(f\).</g>
<g>Red recíproca: vectores \(\mathbf G\) con \(e^{i\mathbf G\cdot\mathbf R}=1\) para todo \(\mathbf R\); el \(\mathbf G\) más corto perpendicular a una familia de planos tiene módulo \(2\pi/d\).</g>
</given>
<step op="Amplitud difractada: suma de las ondas de todos los puntos de la red">
\[A(\Delta\mathbf k)\propto\sum_{\mathbf R}e^{-i\Delta\mathbf k\cdot\mathbf R},\qquad\Delta\mathbf k=\mathbf k'-\mathbf k.\]
<why>Con un número enorme de celdas, la suma se cancela salvo si \(\Delta\mathbf k\cdot\mathbf R\) es múltiplo de \(2\pi\) para todo \(\mathbf R\), es decir, si \(\Delta\mathbf k=\mathbf G\): condición de Laue.</why>
</step>
<step op="Dispersión elástica: \(|\mathbf k+\mathbf G|=|\mathbf k|\)">
\[2\,\mathbf k\cdot\mathbf G+G^2=0.\]
</step>
<step op="El ángulo entre \(\mathbf k\) y los planos es \(\theta\) (\(\mathbf k\cdot\mathbf G=-kG\sin\theta\))">
\[2k\sin\theta=G\ \Longrightarrow\ 2\cdot\frac{2\pi}\lambda\sin\theta=\frac{2\pi n}d.\]
</step>
<step op="Ley de Bragg">
\[2d\sin\theta=n\lambda.\]
</step>
<step op="Red cúbica de arista \(a\), planos de índices de Miller \((hkl)\)">
\[d_{hkl}=\frac a{\sqrt{h^2+k^2+l^2}}.\]
</step>
<step op="Factor de estructura del diamante (red fcc con base en \(\mathbf 0\) y \(\tfrac14(1,1,1)a\))">
\[F_{hkl}=f\left[1+e^{i\pi(h+k)}+e^{i\pi(h+l)}+e^{i\pi(k+l)}\right]\left[1+e^{i\pi(h+k+l)/2}\right].\]
<why>El primer corchete (red fcc) vale 4 si \(h,k,l\) son todos pares o todos impares y 0 si no; el segundo se anula si \(h,k,l\) son pares con \(h+k+l\) no múltiplo de 4.</why>
</step>
<result name="Ley de Bragg">\[2d\sin\theta=n\lambda,\qquad d_{hkl}=\frac a{\sqrt{h^2+k^2+l^2}}.\]</result>
<vars>
<v s="d" n="distancia entre planos" u="m"/>
<v s="\theta" n="ángulo de Bragg" u="rad"/>
<v s="\lambda" n="longitud de onda de los rayos X" u="m"/>
<v s="n" n="orden de la reflexión" u="1"/>
<v s="G" n="módulo del vector recíproco" u="m^-1"/>
<v s="k" n="número de onda de la radiación" u="m^-1"/>
<v s="a" n="arista de la celda cúbica" u="m"/>
<v s="h,\,k,\,l" n="índices de Miller" u="1"/>
</vars>
<effects>
<e>Silicio (\(a=5.431\) Å) con rayos X de Cu Kα (\(\lambda=1.5406\) Å): (111) \(d=3.1356\) Å y \(2\theta=28.442^\circ\); (220) \(d=1.9201\) Å y \(2\theta=47.302^\circ\); (311) \(d=1.6375\) Å y \(2\theta=56.122^\circ\). Esos son los tres primeros picos del patrón de polvo del Si.</e>
<e>La reflexión (200) (\(d=2.7155\) Å) está prohibida: el factor de estructura se anula. También (222): el segundo orden de (111) con \(\sin\theta=0.4913\) (\(2\theta=58.856^\circ\)) cae sobre \(d_{222}=1.5678\) Å, pero \(F_{222}=0\) (pares con \(h+k+l=6\)). En cambio (220), (311) y (400) están permitidas, con \(|F|/f=8,\ 5.657,\ 8\).</e>
<e>Reducir \(\lambda\) a la mitad acerca todos los picos al haz (\(\sin\theta\propto\lambda\)); no hay difracción de un plano si \(\lambda>2d/n\): la resolución máxima es \(\lambda/2\).</e>
</effects>
<limits>
<l>Dimensiones: \(n\lambda/2d\) es adimensional. ✓</l>
<l>Teoría cinemática: un solo evento de dispersión por fotón, válida en cristales pequeños o imperfectos; en cristales grandes y perfectos aparece la difracción dinámica. La intensidad también depende del factor de forma atómico \(f(q)\) y del factor de Debye–Waller.</l>
</limits>
<explore sim="bragg" title="Difracción de Bragg en un cristal cúbico: distancia entre planos y ángulo 2θ"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (Si, (111), Cu Kα): \(d=3.13559\) Å, \(|G|=2.00383\ \text{Å}^{-1}\), \(\sin\theta=0.245664\) y \(2\theta=28.4421^\circ\).</li>
<li>Con \(\lambda\) en el eje: \(2\theta\) crece con \(\lambda\) hasta que \(\sin\theta=1\) y desaparece la difracción (la salida se anula).</li>
</ul></div>
</deriv>

<deriv id="cadena-fonones" title="Vibraciones de la red: la relación de dispersión de los fonones" tags="Sólidos, Fonones">
<goal>Las frecuencias de las ondas elásticas de una cadena de átomos, su velocidad del sonido y el límite en el borde de la zona de Brillouin.</goal>
<given>
<g>Átomos de masa \(M\) en posiciones de equilibrio \(na\), unidos a sus vecinos por resortes de constante \(K\); desplazamientos \(u_n(t)\).</g>
<g>Aproximación armónica: la fuerza sobre el átomo \(n\) es \(K(u_{n+1}-u_n)-K(u_n-u_{n-1})\).</g>
</given>
<step op="Segunda ley de Newton para el átomo \(n\)">
\[M\ddot u_n=K\left(u_{n+1}+u_{n-1}-2u_n\right).\]
</step>
<step op="Ansatz de onda viajera \(u_n=A\,e^{i(kna-\omega t)}\)">
\[-M\omega^2=K\left(e^{ika}+e^{-ika}-2\right)=-4K\sin^2\frac{ka}2.\]
</step>
<step op="Despejar \(\omega\)">
\[\omega(k)=2\sqrt{\frac KM}\left|\sin\frac{ka}2\right|.\]
<why>\(k\) y \(k+2\pi/a\) describen los mismos desplazamientos en los puntos de la red, de modo que \(k\) se restringe a la primera zona de Brillouin, \(-\pi/a<k\le\pi/a\): hay exactamente \(N\) modos para \(N\) átomos.</why>
</step>
<step op="Ondas largas (\(ka\ll1\)): \(\omega\approx a\sqrt{K/M}\,k\), ondas de sonido">
\[v_s=a\sqrt{\frac KM},\qquad v_g=\frac{\mathrm d\omega}{\mathrm dk}=v_s\cos\frac{ka}2.\]
</step>
<step op="Borde de zona (\(k=\pi/a\)): máxima frecuencia y velocidad de grupo nula (onda estacionaria)">
\[\omega_\text{máx}=2\sqrt{\frac KM},\qquad v_g=0.\]
</step>
<result name="Dispersión de la cadena monoatómica">\[\omega(k)=2\sqrt{\frac KM}\left|\sin\frac{ka}2\right|,\qquad v_s=a\sqrt{\frac KM}.\]</result>
<vars>
<v s="\omega" n="frecuencia angular" u="rad s^-1"/>
<v s="k" n="número de onda" u="m^-1"/>
<v s="K" n="constante del resorte" u="N m^-1"/>
<v s="M" n="masa del átomo" u="kg"/>
<v s="a" n="distancia entre átomos" u="m"/>
<v s="u_n" n="desplazamiento del átomo \(n\)" u="m"/>
<v s="v_s" n="velocidad del sonido" u="m s^-1"/>
<v s="v_g" n="velocidad de grupo" u="m s^-1"/>
</vars>
<effects>
<e>Con \(K=30\) N/m, \(M=63.546\) u y \(a=2.55\) Å: \(v_s=4299.6\) m/s, \(f_\text{máx}=5.367\) THz (\(\hbar\omega_\text{máx}=22.20\) meV, equivalente a 257.6 K) y, a \(ka/\pi=0.5\), \(f=3.795\) THz y \(v_g=3040.3\) m/s con \(\lambda=10.2\) Å.</e>
<e>Todas las frecuencias son proporcionales a \(\sqrt{K/M}\): duplicar \(K\) las multiplica por \(\sqrt2=1.4142\) y duplicar la masa por \(1/\sqrt2\). La curva es lineal solo hasta \(ka\approx1\): en el borde de zona la frecuencia se aplana.</e>
</effects>
<limits>
<l>Dimensiones: \(\sqrt{K/M}\) tiene unidades de \(\sqrt{\mathrm{N\,m^{-1}/kg}}=\mathrm s^{-1}\). ✓</l>
<l>Solo vecinos próximos, en una dimensión y un tipo de átomo. Con dos átomos por celda aparecen ramas ópticas; en tres dimensiones hay tres ramas acústicas (una longitudinal, dos transversales). Cuánticamente cada modo tiene energía \(\hbar\omega(\bar n+\tfrac12)\) y los cuantos son los fonones.</l>
</limits>
<explore sim="cadena" title="Dispersión de fonones de una cadena monoatómica"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(K=30\) N/m, \(M=63.546\) u, \(a=2.55\) Å, \(ka/\pi=0.5\)): \(f=3.79513\) THz, \(v_s=4299.64\) m/s, \(v_g=3040.30\) m/s, \(f_\text{máx}=5.36713\) THz y \(\lambda=10.2\) Å.</li>
<li>Con \(ka/\pi\) en el eje: la frecuencia sube como un seno y \(v_g\) cae a cero en el borde.</li>
</ul></div>
</deriv>

<deriv id="debye-calor" title="El calor específico de la red: el modelo de Debye" tags="Sólidos, Calor específico">
<goal>La variación del calor específico de un sólido con la temperatura: el límite clásico de Dulong–Petit a alta temperatura y la ley \(T^3\) a baja temperatura.</goal>
<given>
<g>Fonones con energía \(\hbar\omega\) y ocupación de Bose–Einstein \(\bar n=1/(e^{\hbar\omega/kT}-1)\); tres ramas con la misma velocidad \(v\) (sonido en el continuo).</g>
<g>El sólido tiene \(N\) átomos, es decir, \(3N\) modos en total.</g>
</given>
<step op="Densidad de modos en un volumen \(V\) con tres polarizaciones">
\[g(\omega)\,\mathrm d\omega=\frac{3V\omega^2}{2\pi^2v^3}\,\mathrm d\omega.\]
</step>
<step op="Corte de Debye: el número total de modos debe ser \(3N\)">
\[\int_0^{\omega_D}g\,\mathrm d\omega=3N\ \Longrightarrow\ \omega_D=v\left(6\pi^2\frac NV\right)^{1/3},\quad g(\omega)=\frac{9N\omega^2}{\omega_D^3}.\]
</step>
<step op="Energía interna (sin el punto cero) y temperatura de Debye \(\theta_D=\hbar\omega_D/k\)">
\[U=\int_0^{\omega_D}\frac{\hbar\omega}{e^{\hbar\omega/kT}-1}\,g\,\mathrm d\omega=9NkT\left(\frac T{\theta_D}\right)^3\int_0^{\theta_D/T}\frac{x^3\,\mathrm dx}{e^x-1}.\]
</step>
<step op="Derivar respecto a \(T\)">
\[C_V=9Nk\left(\frac T{\theta_D}\right)^3\int_0^{\theta_D/T}\frac{x^4e^x}{(e^x-1)^2}\,\mathrm dx.\]
</step>
<step op="Límites: \(T\gg\theta_D\) (integrando \(\approx x^2\)) y \(T\ll\theta_D\) (\(\int_0^\infty=4\pi^4/15\))">
\[C_V\to3Nk\ \text{(Dulong–Petit)},\qquad C_V\to\frac{12\pi^4}5\,Nk\left(\frac T{\theta_D}\right)^3.\]
</step>
<result name="Calor específico de Debye">\[C_V=9Nk\left(\frac T{\theta_D}\right)^3\int_0^{\theta_D/T}\frac{x^4e^x}{(e^x-1)^2}\,\mathrm dx,\qquad\theta_D=\frac{\hbar\omega_D}k.\]</result>
<vars>
<v s="C_V" n="calor específico molar" u="J mol^-1 K^-1"/>
<v s="T" n="temperatura" u="K"/>
<v s="\theta_D" n="temperatura de Debye" u="K"/>
<v s="\omega_D" n="frecuencia de corte de Debye" u="rad s^-1"/>
<v s="v" n="velocidad del sonido" u="m s^-1"/>
<v s="N/V" n="densidad de átomos" u="m^-3"/>
<v s="V" n="volumen del sólido" u="m^3"/>
<v s="R" n="constante de los gases" u="J mol^-1 K^-1"/>
<v s="k" n="constante de Boltzmann" u="J K^-1"/>
<v s="\hbar" n="constante de Planck reducida" u="J s"/>
<v s="x" n="variable \(\hbar\omega/kT\)" u="1"/>
</vars>
<effects>
<e>Cobre (\(\theta_D=343\) K): \(C_V(300\ \text{K})=23.386\) J/(mol K), es decir, 93.76 % de \(3R=24.943\) J/(mol K); \(C_V(T=\theta_D)=0.9517\cdot3R\). A 10 K, \(C_V=0.048168\) J/(mol K), igual al valor de la ley \(T^3\) (0.048168). Aluminio (\(\theta_D=428\) K) a 300 K: 22.579 J/(mol K) (90.52 % de \(3R\)); plomo (\(\theta_D=105\) K): 24.791 J/(mol K) (99.39 %).</e>
<e>La frecuencia de corte del cobre es \(k\theta_D/h=7.147\) THz. La ley \(T^3\) es buena solo para \(T\lesssim\theta_D/50\): en el plomo a 10 K da 1.679 J/(mol K), 2 % por encima del valor de Debye (1.646).</e>
<e>Los electrones aportan un término lineal \(\gamma T\); con \(\gamma_\text{Cu}=0.695\) mJ/(mol K²), ambos coinciden en \(T=\sqrt{\gamma/\beta}=3.80\) K: por debajo de esa temperatura el calor específico del cobre lo dominan los electrones.</e>
</effects>
<limits>
<l>Dimensiones: \(9Nk\) es una capacidad calorífica y la integral es adimensional. ✓</l>
<l>Una velocidad única y un corte esférico son una aproximación: la densidad de modos real tiene singularidades de van Hove y \(\theta_D\) ajustada varía algunos por ciento con \(T\). A alta temperatura la anarmonicidad añade términos y \(C_P\ne C_V\).</l>
</limits>
<explore sim="debye-red" title="Calor específico de Debye: dependencia con la temperatura"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (Cu, \(T=300\) K): \(C_V=23.3862\) J/(mol K), \(C_V/3R=0.937572\) y \(\nu_D=7.14696\) THz.</li>
<li>Seleccione \(T\) en el eje (log–log): pendiente 3 por debajo de \(\theta_D/10\) y saturación en \(3R=24.943\) J/(mol K).</li>
</ul></div>
</deriv>

<deriv id="sommerfeld" title="El gas de electrones libres: energía de Fermi y calor específico electrónico" tags="Sólidos, Electrones">
<goal>La energía y la velocidad de los electrones más energéticos de un metal y por qué solo una fracción diminuta de los electrones contribuye al calor específico.</goal>
<given>
<g>\(N\) electrones libres en un cubo de lado \(L\) con condiciones periódicas: \(\mathbf k=\frac{2\pi}L(n_x,n_y,n_z)\) y \(E=\hbar^2k^2/2m\); principio de exclusión (dos electrones por estado \(\mathbf k\), por el espín).</g>
<g>Ocupación de Fermi–Dirac \(f(E)=1/[e^{(E-\mu)/kT}+1]\).</g>
</given>
<step op="Número de estados con vector de onda menor que \(k\) (esfera por el volumen de cada estado, por dos)">
\[N(k)=2\cdot\frac{4\pi k^3/3}{(2\pi/L)^3}=\frac{Vk^3}{3\pi^2}.\]
</step>
<step op="A \(T=0\) se llenan los estados hasta \(k_F\)">
\[k_F=(3\pi^2n)^{1/3},\qquad E_F=\frac{\hbar^2k_F^2}{2m}=\frac{\hbar^2}{2m}(3\pi^2n)^{2/3},\qquad v_F=\frac{\hbar k_F}m.\]
</step>
<step op="Densidad de estados por energía">
\[g(E)=\frac{\mathrm dN}{\mathrm dE}=\frac V{2\pi^2}\left(\frac{2m}{\hbar^2}\right)^{3/2}\sqrt E=\frac{3N}{2E_F^{3/2}}\sqrt E,\qquad g(E_F)=\frac{3N}{2E_F}.\]
</step>
<step op="Expansión de Sommerfeld (\(kT\ll E_F\)) para una función suave \(H(E)\)">
\[\int_0^\infty H(E)f(E)\,\mathrm dE=\int_0^\mu H\,\mathrm dE+\frac{\pi^2}6(kT)^2H'(\mu)+\cdots\]
<why>\(f\) difiere de un escalón solo en una franja de ancho \(\sim kT\) alrededor de \(\mu\); allí se desarrolla \(H\) en serie de Taylor.</why>
</step>
<step op="Energía interna y calor específico (\(\mu\simeq E_F\))">
\[U=U_0+\frac{\pi^2}6(kT)^2g(E_F)\ \Longrightarrow\ C_\text{el}=\frac{\pi^2}3k^2T\,g(E_F)=\frac{\pi^2}2\,Nk\,\frac T{T_F}=\gamma T.\]
</step>
<result name="Gas de Fermi">\[E_F=\frac{\hbar^2}{2m}(3\pi^2n)^{2/3},\qquad C_\text{el}=\frac{\pi^2}2\,Nk\,\frac T{T_F},\qquad T_F=\frac{E_F}k.\]</result>
<vars>
<v s="E_F" n="energía de Fermi" u="J"/>
<v s="k_F" n="número de onda de Fermi" u="m^-1"/>
<v s="v_F" n="velocidad de Fermi" u="m s^-1"/>
<v s="n" n="densidad de electrones" u="m^-3"/>
<v s="m" n="masa del electrón" u="kg"/>
<v s="\hbar" n="constante de Planck reducida" u="J s"/>
<v s="g" n="densidad de estados por unidad de energía" u="J^-1"/>
<v s="C_\text{el}" n="capacidad calorífica electrónica" u="J K^-1"/>
<v s="T_F" n="temperatura de Fermi" u="K"/>
<v s="T" n="temperatura" u="K"/>
<v s="k" n="constante de Boltzmann" u="J K^-1"/>
<v s="N" n="número de electrones" u="1"/>
<v s="V" n="volumen" u="m^3"/>
</vars>
<effects>
<e>Cobre (\(n=8.47\times10^{28}\ \text{m}^{-3}\)): \(k_F=1.3586\ \text{Å}^{-1}\), \(E_F=7.033\) eV, \(T_F=81\,612\) K y \(v_F=1.573\times10^6\) m/s (0.52 % de \(c\)). El coeficiente es \(\gamma=0.5027\) mJ/(mol K²) y el medido, 0.695: la masa efectiva térmica es 1.38 veces la del electrón.</e>
<e>Sodio (\(n=2.65\times10^{28}\ \text{m}^{-3}\)): \(E_F=3.241\) eV, \(T_F=37\,612\) K, \(v_F=1.068\times10^6\) m/s y \(\gamma=1.091\) mJ/(mol K²). Aluminio (\(n=18.1\times10^{28}\ \text{m}^{-3}\)): \(E_F=11.668\) eV y \(T_F=135\,399\) K; con 3 electrones por átomo, \(3\times0.3030=0.909\) mJ/(mol K²) por mol de átomos.</e>
<e>A 300 K solo una fracción \(T/T_F=0.37\ \%\) de los electrones del cobre cambia de estado: \(C_\text{el}=0.151\) J/(mol K), es decir, 0.60 % de \(3R\) y no \(\tfrac32R\) como daría la física clásica; \(E_F\propto n^{2/3}\) y \(\gamma\propto n^{-2/3}\).</e>
</effects>
<limits>
<l>Dimensiones: \(\hbar^2k_F^2/2m\) es una energía; \(Nk\,T/T_F\) es una capacidad calorífica. ✓</l>
<l>Electrones independientes en un potencial uniforme: se ignoran la interacción entre ellos y la red. Las desviaciones (cociente \(m^*/m\)) se absorben en una masa efectiva. El potencial químico se desplaza como \(\mu=E_F[1-\tfrac{\pi^2}{12}(kT/E_F)^2]\), despreciable a todas las temperaturas del sólido.</l>
</limits>
<explore sim="sommerfeld" title="Gas de Fermi de electrones libres: E_F, T_F, v_F y coeficiente γ"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (Cu, \(n=8.47\times10^{28}\ \text{m}^{-3}\)): \(E_F=7.03276\) eV, \(T_F=81\,611.8\) K, \(v_F=1.57285\times10^6\) m/s, \(k_F=1.35863\ \text{Å}^{-1}\) y \(\gamma=0.502749\) mJ/(mol K²).</li>
<li>Con \(n\) en el eje (log–log): \(E_F\propto n^{2/3}\) y \(\gamma\propto n^{-2/3}\).</li>
</ul></div>
</deriv>

<deriv id="bandas-kronig-penney" title="Bandas de energía: el teorema de Bloch y el modelo de Kronig–Penney" tags="Sólidos, Bandas">
<goal>Por qué los niveles de un electrón en un potencial periódico forman bandas separadas por brechas, y el ancho de la primera brecha.</goal>
<given>
<g>Potencial periódico \(V(x+a)=V(x)\): una red de deltas \(V=\alpha\sum_n\delta(x-na)\) (barreras si \(\alpha>0\)); ecuación \(-\dfrac{\hbar^2}{2m}\psi''+V\psi=E\psi\).</g>
<g>Teorema de Bloch: las autofunciones cumplen \(\psi(x+a)=e^{ika}\psi(x)\), con \(k\) real.</g>
</given>
<step op="Entre deltas el electrón es libre: \(\psi=Ae^{iqx}+Be^{-iqx}\) con \(q=\sqrt{2mE}/\hbar\)">
<why>En cada celda hay dos constantes; las condiciones de enlace entre celdas las fijan.</why>
</step>
<step op="Condiciones en cada delta: continuidad de \(\psi\) y salto de la derivada">
\[\psi'(0^+)-\psi'(0^-)=\frac{2m\alpha}{\hbar^2}\psi(0).\]
</step>
<step op="Usar Bloch para relacionar la celda \((-a,0)\) con \((0,a)\) y exigir solución no trivial">
\[\det\ne0\ \Longrightarrow\ \cos ka=\cos qa+\frac{m\alpha}{\hbar^2q}\sin qa.\]
</step>
<step op="Bandas permitidas: solo existe un \(k\) real si el lado derecho está entre \(-1\) y \(1\)">
\[\left|\cos qa+P\,\frac{\sin qa}{qa}\right|\le1,\qquad P=\frac{m\alpha a}{\hbar^2}.\]
<why>Donde el módulo supera 1, \(k\) es complejo y la onda decae: brecha de energías prohibidas.</why>
</step>
<step op="Borde de la primera banda: en \(qa=\pi\) el lado derecho vale exactamente \(-1\) (\(k=\pi/a\)), cualquiera que sea \(\alpha\)">
\[E_\text{techo}=\frac{\hbar^2\pi^2}{2ma^2}\quad(\text{independiente de }\alpha).\]
</step>
<step op="Brecha para barreras débiles (\(P\ll1\)): con \(qa=\pi+\delta\), \(f+1=-P\delta/\pi+(\tfrac12+P/\pi^2)\delta^2+\cdots\) y la condición \(f=-1\) da \(\delta\simeq2P/\pi\)">
\[\Delta E=\frac{\hbar^2}{2ma^2}\left[(\pi+\delta)^2-\pi^2\right]\simeq\frac{\hbar^2}{2ma^2}\,4P=\frac{2\alpha}a=2|V_G|.\]
<why>Coincide con la teoría de perturbaciones degenerada (capítulo anterior): las ondas \(\pm\pi/a\) tienen la misma energía y el coeficiente de Fourier \(V_G=\alpha/a\) las mezcla, abriendo una brecha \(2|V_G|\).</why>
</step>
<result name="Relación de Kronig–Penney">\[\cos ka=\cos qa+P\,\frac{\sin qa}{qa},\qquad P=\frac{m\alpha a}{\hbar^2},\qquad\Delta E_\text{gap}\simeq\frac{2\alpha}a\ (P\ll1).\]</result>

<e>Con \(a=0.3\) nm y \(\alpha=0.3\) eV·nm (\(P=1.1811\), energía de escala \(\hbar^2/2ma^2=0.42333\) eV): la primera banda va de \(0.8308\) eV (el electrón libre empezaría en 0) hasta \(4.1781\) eV, su ancho es 3.347 eV y la brecha de energías prohibidas, 1.780 eV; la estimación de electrones casi libres \(2\alpha/a=2.0\) eV sobrestima por 12 % porque \(P\) no es pequeño.</e>
<e>La estimación \(\Delta E\simeq4P\,\hbar^2/2ma^2\) mejora al debilitar la barrera: para \(P=0.05\) el valor exacto es \(0.19899\) en esas unidades y la fórmula da \(0.2\) (0.5 %); para \(P=0.2\), 0.7840 frente a 0.8; para \(P=1\), 3.6228 frente a 4.0.</e>
<e>Al aumentar \(P\) la banda se estrecha (ancho en esas unidades: 9.770, 9.483, 8.163, 4.651, 1.703 para \(P=0.05,\,0.2,\,1,\,5,\,20\)) y tiende a un nivel atómico: el límite de enlace fuerte.</e>
