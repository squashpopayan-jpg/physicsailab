<template class="chapter-src" data-id="cosmologia" data-num="39" data-title="Cosmología: expansión, edad, distancias, fondo de microondas y recombinación" data-part="Parte XI · Astrofísica y cosmología" data-short="La ecuación de Friedmann newtoniana y la densidad crítica, la edad del universo, las distancias cosmológicas, el fondo cósmico de microondas y la recombinación del hidrógeno por la ecuación de Saha">
<p class="lead">La cosmología aplica la gravitación y la termodinámica al universo entero. Un puñado de ecuaciones —la ley de Hubble, la ecuación de Friedmann, la ley de Planck y la ecuación de Saha— permite calcular la densidad que haría plano al universo, su edad, la distancia a una galaxia de corrimiento al rojo conocido, el número de fotones de la radiación de fondo y la temperatura a la que los átomos se formaron.</p>

<deriv id="friedmann" title="La expansión de Hubble, la ecuación de Friedmann y la densidad crítica" tags="Cosmología, Friedmann">
<goal>La dinámica de un universo homogéneo e isótropo que se expande: cómo depende la tasa de expansión de la densidad, y cuál es la densidad que separa un universo abierto de uno cerrado.</goal>
<given>
<g>Principio cosmológico: homogeneidad e isotropía. Las distancias propias son \(R=a(t)\,x\), con \(x\) las coordenadas comóviles fijas de cada galaxia y \(a(t)\) el factor de escala (\(a_0=1\) hoy).</g>
<g>Teorema de la capa de Newton: la fuerza sobre una masa en una esfera uniforme solo depende de la masa interior; la ecuación del fluido \(\dot\rho+3H(\rho+p/c^2)=0\).</g>
</given>
<step op="Velocidad de recesión: derivar \(R=a x\)">
\[v=\dot R=\dot a\,x=\frac{\dot a}a\,R=H(t)\,R,\qquad H=\frac{\dot a}a.\]
<why>Es la ley de Hubble: la velocidad de alejamiento es proporcional a la distancia, sin que haya un centro especial.</why>
</step>
<step op="Energía de una galaxia de prueba en el borde de una esfera de radio \(R\) y densidad \(\rho\) (masa \(M=\tfrac43\pi\rho R^3\))">
\[\tfrac12\dot R^2-\frac{GM}R=E=\text{constante}.\]
</step>
<step op="Sustituir \(R=ax\), \(M\) y definir \(2E=-kc^2x^2\) (\(k\) es la curvatura)">
\[\dot a^2x^2-\frac{8\pi G\rho}3a^2x^2=-kc^2x^2\ \Longrightarrow\ H^2=\frac{8\pi G}3\rho-\frac{kc^2}{a^2}.\]
<why>La relatividad general añade el término de la constante cosmológica: \(H^2=\tfrac{8\pi G}3\rho-\tfrac{kc^2}{a^2}+\tfrac\Lambda3c^2\); la forma newtoniana da el mismo resultado sin él.</why>
</step>
<step op="Densidad crítica (\(k=0\), universo plano)">
\[\rho_c=\frac{3H^2}{8\pi G},\qquad\Omega=\frac\rho{\rho_c}:\quad\Omega>1\ (k>0,\text{ cerrado}),\ \Omega<1\ (\text{abierto}).\]
</step>
<step op="Evolución de la densidad para cada componente: \(\rho\propto a^{-3(1+w)}\)">
\[\text{materia }(w=0):\ \rho\propto a^{-3};\quad\text{radiación }(w=\tfrac13):\ \rho\propto a^{-4};\quad\Lambda\ (w=-1):\ \rho=\text{constante}.\]
<why>La materia se diluye con el volumen; la radiación pierde además energía por el corrimiento al rojo de cada fotón (un factor \(a^{-1}\) extra).</why>
</step>
<result name="Ecuación de Friedmann">\[H^2=\frac{8\pi G}3\rho-\frac{kc^2}{a^2},\qquad\rho_c=\frac{3H_0^2}{8\pi G}.\]</result>
<vars>
<v s="H" n="parámetro de Hubble" u="s^-1"/>
<v s="a" n="factor de escala" u="1"/>
<v s="\rho" n="densidad media" u="kg m^-3"/>
<v s="\rho_c" n="densidad crítica" u="kg m^-3"/>
<v s="G" n="constante de gravitación" u="m^3 kg^-1 s^-2"/>
<v s="k" n="índice de curvatura (en unidades de \(1/R^2\))" u="1"/>
<v s="c" n="velocidad de la luz" u="m s^-1"/>
<v s="\Omega" n="parámetro de densidad" u="1"/>
<v s="R" n="distancia propia" u="m"/>
<v s="v" n="velocidad de recesión" u="m s^-1"/>
</vars>
<effects>
<e>Con \(H_0=67.4\) km/s/Mpc (\(2.1843\times10^{-18}\ \text{s}^{-1}\)): \(\rho_c=8.533\times10^{-27}\) kg/m³, el equivalente a 5.10 protones por metro cúbico; el tiempo de Hubble es \(1/H_0=14.51\) mil millones de años y el radio de Hubble \(c/H_0=4448\) Mpc. Con \(\Omega_m=0.315\) la materia media es \(2.688\times10^{-27}\) kg/m³ (1.6 protones por metro cúbico).</e>
<e>\(\rho_c\propto H_0^2\): si \(H_0\) fuera el doble, la densidad crítica sería 4 veces mayor. En términos de \(h=H_0/100\): \(\rho_c=1.878\times10^{-26}\,h^2\) kg/m³.</e>
</effects>
<limits>
<l>Dimensiones: \(3H^2/8\pi G\) tiene unidades de \(\mathrm{s^{-2}/(m^3\,kg^{-1}\,s^{-2})}=\mathrm{kg/m^3}\). ✓</l>
<l>La deducción newtoniana es heurística (en relatividad general la presión también gravita y la curvatura es del espacio–tiempo), pero conduce a la misma ecuación para la expansión. No incluye la radiación de forma rigurosa ni la inflación.</l>
</limits>
<explore sim="cos-hubble" title="Densidad crítica, tiempo y radio de Hubble"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(H_0=67.4\), \(\Omega_m=0.315\)): \(\rho_c=8.53286\times10^{-27}\) kg/m³, 5.10148 protones/m³, \(\rho_m=2.68785\times10^{-27}\) kg/m³, \(1/H_0=14.5073\) y \(c/H_0=4447.96\) Mpc.</li>
<li>Con \(H_0\) en el eje (log–log): \(\rho_c\propto H_0^2\) (pendiente 2) y \(1/H_0\) con pendiente −1.</li>
</ul></div>
</deriv>

<deriv id="edad-universo" title="La edad del universo" tags="Cosmología, Edad">
<goal>El tiempo transcurrido desde la singularidad inicial en un universo plano con materia y constante cosmológica.</goal>
<given>
<g>Ecuación de Friedmann para un universo plano: \(H^2=H_0^2\left(\Omega_ma^{-3}+\Omega_\Lambda\right)\), con \(\Omega_m+\Omega_\Lambda=1\) (se desprecia la radiación, importante solo en \(z>3000\)).</g>
</given>
<step op="Edad = tiempo transcurrido desde \(a=0\): \(\mathrm dt=\mathrm da/(aH)\)">
\[t_0=\int_0^1\frac{\mathrm da}{aH(a)}=\frac1{H_0}\int_0^1\frac{\mathrm da}{a\sqrt{\Omega_ma^{-3}+\Omega_\Lambda}}=\frac1{H_0}\int_0^1\frac{\sqrt a\,\mathrm da}{\sqrt{\Omega_m+\Omega_\Lambda a^3}}.\]
</step>
<step op="Sustitución \(u=\sqrt{\Omega_\Lambda/\Omega_m}\;a^{3/2}\), con \(\mathrm du=\tfrac32\sqrt{\Omega_\Lambda/\Omega_m}\;a^{1/2}\mathrm da\)">
\[t_0=\frac2{3H_0\sqrt{\Omega_\Lambda}}\int_0^{u_1}\frac{\mathrm du}{\sqrt{1+u^2}},\qquad u_1=\sqrt{\frac{\Omega_\Lambda}{\Omega_m}}.\]
</step>
<step op="Integral elemental: \(\operatorname{arcsinh}u\)">
\[t_0=\frac2{3H_0\sqrt{\Omega_\Lambda}}\operatorname{arcsinh}\sqrt{\frac{\Omega_\Lambda}{\Omega_m}}.\]
</step>
<step op="Límite sin constante cosmológica (\(\Omega_\Lambda\to0\)): universo de Einstein–de Sitter">
\[t_0\to\frac2{3H_0}.\]
<why>\(\operatorname{arcsinh}u\simeq u\) para \(u\to0\): el límite recupera \(2/3H_0\).</why>
</step>
<result name="Edad del universo plano">\[t_0=\frac{2}{3H_0\sqrt{\Omega_\Lambda}}\operatorname{arcsinh}\sqrt{\frac{\Omega_\Lambda}{\Omega_m}}.\]</result>
<vars>
<v s="t_0" n="edad del universo" u="s"/>
<v s="H_0" n="constante de Hubble" u="s^-1"/>
<v s="\Omega_m" n="parámetro de densidad de materia" u="1"/>
<v s="\Omega_\Lambda" n="parámetro de densidad de la constante cosmológica" u="1"/>
<v s="a" n="factor de escala" u="1"/>
<v s="u" n="variable de integración" u="1"/>
</vars>
<effects>
<e>Con \(H_0=67.4\) km/s/Mpc, \(\Omega_m=0.315\): \(t_0=13.796\) mil millones de años (\(H_0t_0=0.9510\)); la integral numérica da el mismo valor. Sin constante cosmológica (\(\Omega_m=1\)) sería \(2/3H_0=9.672\) mil millones de años, menor que la edad de los cúmulos globulares (> 12 mil millones): ese fue el «problema de la edad» que anticipó la energía oscura.</e>
<e>La edad crece al aumentar \(\Omega_\Lambda\): para \(\Omega_m=0.3\) y \(H_0=70\), \(t_0=13.47\) mil millones de años. El parámetro de deceleración \(q_0=\Omega_m/2-\Omega_\Lambda=-0.5275\) es negativo: la expansión se acelera.</e>
</effects>
<limits>
<l>Dimensiones: \(1/H_0\) es un tiempo y la arcsenh es adimensional. ✓</l>
<l>Se desprecia la radiación (que cambia \(t_0\) en un 0.05 %), la curvatura y la evolución de la energía oscura; los valores de \(\Omega_m\), \(H_0\) vienen de las observaciones del fondo de microondas y las supernovas (tensión de Hubble: 67.4 frente a ≈ 73).</l>
</limits>
<explore sim="cos-edad" title="Edad del universo plano en función de H₀ y Ω_m"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(H_0=67.4\), \(\Omega_m=0.315\)): \(t_0=13.7962\) mil millones de años, \(t_\text{EdS}=9.67154\), \(H_0t_0=0.950985\) y \(q_0=-0.5275\).</li>
<li>Con \(\Omega_m\) en el eje: \(t_0\) disminuye al aumentar la materia y tiende a \(2/3H_0\) cuando \(\Omega_m\to1\).</li>
</ul></div>
</deriv>

<deriv id="distancias" title="Distancias cosmológicas y el corrimiento al rojo" tags="Cosmología, Distancias">
<goal>La distancia a un objeto con corrimiento al rojo \(z\) según se mida por el recorrido comóvil, por su brillo o por su tamaño aparente.</goal>
<given>
<g>Un fotón se mueve a \(c\) en el espacio comóvil: \(c\,\mathrm dt=a\,\mathrm dr\) (trayectoria nula, universo plano).</g>
<g>El factor de escala determina el corrimiento al rojo: \(1+z=a_0/a(t_e)=1/a\).</g>
</given>
<step op="Distancia comóvil recorrida por la luz emitida con corrimiento \(z\)">
\[d_C=\int\frac{c\,\mathrm dt}a=c\int_0^z\frac{\mathrm dz'}{H(z')},\qquad\mathrm dz=-\frac{\dot a}{a^2}\mathrm dt=-(1+z)H\,\mathrm dt.\]
</step>
<step op="Con \(H(z)=H_0E(z)\), \(E(z)=\sqrt{\Omega_m(1+z)^3+\Omega_\Lambda}\)">
\[d_C=\frac c{H_0}\int_0^z\frac{\mathrm dz'}{E(z')}.\]
</step>
<step op="Distancia de luminosidad: flujo \(F=L/4\pi d_L^2\). La luz se reparte en una esfera de área \(4\pi d_C^2\); la energía de cada fotón y su tasa de llegada se reducen por \((1+z)\) cada una">
\[F=\frac L{4\pi d_C^2(1+z)^2}\ \Longrightarrow\ d_L=(1+z)\,d_C.\]
</step>
<step op="Distancia de diámetro angular: un objeto de tamaño propio \(\ell\) subtiende \(\theta=\ell/(a\,d_C)\)">
\[d_A=\frac{\ell}\theta=\frac{d_C}{1+z}.\]
</step>
<step op="Aproximación para \(z\ll1\)">
\[d_L\simeq\frac{cz}{H_0}\left[1+\frac{1-q_0}2\,z\right].\]
</step>
<result name="Distancias cosmológicas">\[d_C=\frac c{H_0}\int_0^z\frac{\mathrm dz'}{E(z')},\qquad d_L=(1+z)d_C,\qquad d_A=\frac{d_C}{1+z}.\]</result>
<vars>
<v s="d_C" n="distancia comóvil" u="m"/>
<v s="d_L" n="distancia de luminosidad" u="m"/>
<v s="d_A" n="distancia de diámetro angular" u="m"/>
<v s="z" n="corrimiento al rojo" u="1"/>
<v s="H_0" n="constante de Hubble" u="s^-1"/>
<v s="c" n="velocidad de la luz" u="m s^-1"/>
<v s="E(z)" n="parámetro de Hubble normalizado" u="1"/>
<v s="L" n="luminosidad intrínseca" u="W"/>
<v s="F" n="flujo observado" u="W m^-2"/>
</vars>
<effects>
<e>Con \(H_0=67.4\) y \(\Omega_m=0.315\): \(z=0.1\): \(d_L=477.5\) Mpc (la aproximación lineal \(cz/H_0=444.8\) Mpc subestima en un 7 %); \(z=0.5\): \(d_C=1951.4\) Mpc, \(d_L=2927.1\) Mpc y \(d_A=1300.9\) Mpc; \(z=1\): \(d_C=3401.3\), \(d_L=6802.5\) y \(d_A=1700.6\) Mpc, con tiempo de retrospección de 7.951 mil millones de años.</e>
<e>La distancia de diámetro angular no crece indefinidamente: \(d_A(z=1)=1700.6\) Mpc, \(d_A(z=2)=1770.7\) Mpc y vuelve a bajar a \(d_A(z=1100)=12.66\) Mpc; los objetos muy lejanos parecen más grandes de lo que serían un poco más cerca. Para el fondo de microondas, \(d_C=13\,935\) Mpc.</e>
</effects>
<limits>
<l>Dimensiones: \(c/H_0\) tiene unidades de longitud. ✓</l>
<l>Universo plano y sin radiación; en universos curvos la relación entre \(d_C\) y la distancia transversal cambia por \(\sin\) o \(\sinh\). Las distancias son modelo-dependientes: la luminosidad de las supernovas Ia es lo que permitió medir la aceleración.</l>
</limits>
<explore sim="cos-distancias" title="Distancias comóvil, de luminosidad y de diámetro angular"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(z=1\), \(H_0=67.4\), \(\Omega_m=0.315\)): \(d_C=3401.26\), \(d_L=6802.53\), \(d_A=1700.63\) Mpc y retrospección 7.95061 mil millones de años.</li>
<li>Con \(z\) en el eje (log–log): \(d_L\propto z\) a \(z\ll1\) y la pendiente local aumenta luego por el factor \((1+z)\).</li>
</ul></div>
</deriv>

<deriv id="fondo-microondas" title="El fondo cósmico de microondas: fotones y energía de la radiación de Planck" tags="Cosmología, Radiación">
<goal>El número y la energía de los fotones del fondo cósmico, y cómo evoluciona su temperatura con el corrimiento al rojo.</goal>
<given>
<g>Espectro de cuerpo negro (capítulo 29): ocupación de Bose–Einstein de los fotones con dos polarizaciones, densidad de estados \(g(\omega)=\omega^2/\pi^2c^3\) por unidad de volumen.</g>
<g>La expansión estira las longitudes de onda \(\lambda\propto a\); un espectro de Planck conserva su forma con \(T\propto1/a\).</g>
</given>
<step op="Densidad de fotones: integrar la ocupación">
\[n_\gamma=\frac1{\pi^2}\left(\frac{kT}{\hbar c}\right)^3\int_0^\infty\frac{x^2\,\mathrm dx}{e^x-1}=\frac{2\zeta(3)}{\pi^2}\left(\frac{kT}{\hbar c}\right)^3.\]
<why>\(\int_0^\infty x^2/(e^x-1)\mathrm dx=2\zeta(3)=2.4041\).</why>
</step>
<step op="Densidad de energía">
\[u=\frac{(kT)^4}{\pi^2(\hbar c)^3}\int_0^\infty\frac{x^3\,\mathrm dx}{e^x-1}=\frac{\pi^2(kT)^4}{15\,(\hbar c)^3}.\]
<why>\(\int_0^\infty x^3/(e^x-1)\mathrm dx=\pi^4/15\).</why>
</step>
<step op="Energía media por fotón">
\[\langle E\rangle=\frac u{n_\gamma}=\frac{\pi^4}{30\,\zeta(3)}\,kT=2.701\,kT.\]
</step>
<step op="Evolución cósmica">
\[T(z)=T_0(1+z),\qquad n_\gamma\propto(1+z)^3,\qquad\rho_\gamma c^2=u\propto(1+z)^4.\]
</step>
<step op="Equivalencia radiación–materia: \(\Omega_r(1+z)^4=\Omega_m(1+z)^3\)">
\[1+z_\text{eq}=\frac{\Omega_m}{\Omega_r}.\]
</step>
<result name="Fotones del fondo">\[n_\gamma=\frac{2\zeta(3)}{\pi^2}\left(\frac{kT}{\hbar c}\right)^3,\qquad u=\frac{\pi^2(kT)^4}{15(\hbar c)^3},\qquad T(z)=T_0(1+z).\]</result>
<vars>
<v s="n_\gamma" n="densidad de fotones" u="m^-3"/>
<v s="u" n="densidad de energía" u="J m^-3"/>
<v s="T" n="temperatura" u="K"/>
<v s="k" n="constante de Boltzmann" u="J K^-1"/>
<v s="\hbar" n="constante de Planck reducida" u="J s"/>
<v s="c" n="velocidad de la luz" u="m s^-1"/>
<v s="\zeta(3)" n="constante de Apéry (1.2021)" u="1"/>
<v s="\langle E\rangle" n="energía media de un fotón" u="J"/>
<v s="z" n="corrimiento al rojo" u="1"/>
</vars>
<effects>
<e>Con \(T_0=2.7255\) K: \(n_\gamma=410.73\ \text{cm}^{-3}\), \(u=4.1748\times10^{-14}\ \text{J/m}^3\) (\(\rho_\gamma=4.645\times10^{-31}\) kg/m³, \(\Omega_\gamma h^2=2.473\times10^{-5}\)), \(\langle E\rangle=0.6344\) meV. Con tres neutrinos relativistas, \(\Omega_rh^2=4.184\times10^{-5}\) y la equivalencia radiación–materia ocurre en \(z_\text{eq}=3417\) (para \(\Omega_mh^2=0.1430\); Planck: 3402).</e>
<e>A \(z=1100\) la temperatura era \(T=3000.8\) K: lo bastante fría para que los átomos de hidrógeno sobrevivan (véase la deducción siguiente). La relación entre fotones y bariones es \(\eta=6.1\times10^{-10}\): cada barión en el universo comparte el espacio con unos 1.6 mil millones de fotones.</e>
</effects>
<limits>
<l>Dimensiones: \((kT/\hbar c)^3\) es una inversa de volumen y \((kT)^4/(\hbar c)^3\) una energía por volumen. ✓</l>
<l>El espectro del fondo es un cuerpo negro con precisión de 50 partes por millón (COBE/FIRAS), pero no es exacto: hay anisotropías de 10⁻⁵ que contienen la información sobre la geometría y el contenido del universo. La fórmula para \(\Omega_r\) incluye neutrinos con la razón de temperaturas \((4/11)^{1/3}\).</l>
</limits>
<explore sim="cos-cmb" title="Fondo cósmico de microondas: temperatura, fotones y energía"/>
<div class="sim-guide"><ul>
<li>Valores iniciales (\(T_0=2.7255\) K, \(z=0\)): \(n_\gamma=410.727\ \text{cm}^{-3}\), \(u=4.17480\times10^{-14}\) J/m³, \(\Omega_\gamma h^2=2.47298\times10^{-5}\) y \(\langle E\rangle=0.634413\) meV.</li>
<li>Con \(z\) en el eje: \(T\propto(1+z)\), \(n_\gamma\propto(1+z)^3\) y \(u\propto(1+z)^4\).</li>
</ul></div>
</deriv>

<deriv id="recombinacion-saha" title="La recombinación del hidrógeno: la ecuación de Saha" tags="Cosmología, Recombinación">
<goal>La fracción de hidrógeno ionizado en el universo primitivo en función de la temperatura, y la época en que se formaron los átomos.</goal>
<given>
<g>Equilibrio térmico \(\mathrm p+\mathrm e^-\rightleftharpoons\mathrm H\) con energía de ligadura \(B=13.606\) eV; estadística de Boltzmann para partículas no relativistas; pesos estadísticos \(g_p g_e/g_H=2\cdot2/4=1\).</g>
<g>Neutralidad: \(n_e=n_p=x\,n_b\) y \(n_H=(1-x)\,n_b\), con \(n_b=\eta\,n_\gamma\) la densidad de bariones.</g>
</given>
<step op="Condición de equilibrio químico entre partículas libres no relativistas (idéntica a la de los semiconductores del capítulo 35)">
\[\frac{n_en_p}{n_H}=\left(\frac{m_ekT}{2\pi\hbar^2}\right)^{3/2}e^{-B/kT}.\]
</step>
<step op="Dividir por \(n_b\) y usar la neutralidad">
\[\frac{x^2}{1-x}=S(T),\qquad S=\frac1{n_b}\left(\frac{m_ekT}{2\pi\hbar^2}\right)^{3/2}e^{-B/kT}.\]
</step>
<step op="Raíz positiva de la ecuación de segundo grado \(x^2+Sx-S=0\)">
\[x=\frac{-S+\sqrt{S^2+4S}}2=\frac{2S}{S+\sqrt{S^2+4S}}.\]
</step>
<step op="Con \(n_b=\eta\,n_\gamma(T)\) y \(T=T_0(1+z)\): \(S\) depende solo de \(T\) y \(\eta\)">
\[S=\frac{\pi^2}{2\zeta(3)\,\eta}\left(\frac{m_ec^2}{2\pi kT}\right)^{3/2}e^{-B/kT}.\]
</step>
<result name="Ecuación de Saha">\[\frac{x^2}{1-x}=\frac1{\eta n_\gamma}\left(\frac{m_ekT}{2\pi\hbar^2}\right)^{3/2}e^{-B/kT},\qquad x=\frac{2S}{S+\sqrt{S^2+4S}}.\]</result>
<vars>
<v s="x" n="fracción de hidrógeno ionizado" u="1"/>
<v s="S" n="lado derecho de la ecuación de Saha" u="1"/>
<v s="n_b" n="densidad de bariones" u="m^-3"/>
<v s="\eta" n="razón bariones/fotones" u="1"/>
<v s="m_e" n="masa del electrón" u="kg"/>
<v s="k" n="constante de Boltzmann" u="J K^-1"/>
<v s="T" n="temperatura" u="K"/>
<v s="\hbar" n="constante de Planck reducida" u="J s"/>
<v s="B" n="energía de ionización del hidrógeno" u="J"/>
<v s="n_\gamma" n="densidad de fotones" u="m^-3"/>
</vars>
<effects>
<e>Con \(\eta=6.1\times10^{-10}\): la mitad del hidrógeno está ionizada a \(T=3762\) K (\(z=1379\)) y el 10 % a \(T=3439\) K (\(z=1261\)); la temperatura de recombinación es \(kT\approx B/42\) y no \(B\): el enorme número de fotones por barión (\(1/\eta\approx1.6\times10^9\)) mantiene ionizado el gas hasta temperaturas mucho menores que la energía de ligadura.</e>
<e>En \(z=1100\), Saha da \(x=4.1\times10^{-3}\) y en \(z=1833\) (5000 K) \(x=0.99991\). La recombinación real es más lenta que la de equilibrio (la reacción de captura directa al estado fundamental emite un fotón que reioniza otro átomo: el cálculo de Peebles da \(x\sim0.1\) en \(z\approx1100\)); el escape de la superficie de última dispersión ocurre en \(z\approx1090\).</e>
</effects>
<limits>
<l>Dimensiones: \(S\) es adimensional; \((m_ekT/2\pi\hbar^2)^{3/2}\) es una inversa de volumen. ✓</l>
<l>Equilibrio estricto, solo hidrógeno, sin la cinética de las transiciones Lyα ni la recombinación del helio (\(z\approx6000\) y \(2500\)); a baja ionización la tasa de recombinación no mantiene el equilibrio y la fracción residual (\(\sim10^{-4}\)) queda «congelada».</l>
</limits>
<explore sim="cos-saha" title="Ecuación de Saha: fracción de hidrógeno ionizado en el universo primitivo"/>
