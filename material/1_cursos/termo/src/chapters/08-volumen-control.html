<p class="lead">Casi todos los equipos de ingeniería térmica tienen materia que entra y sale: turbinas, compresores, calderas, condensadores, toberas, válvulas, la ducha eléctrica y el propio cuerpo humano. Para ellos el sistema cerrado no sirve; hace falta seguir una región del espacio, un <span class="term">volumen de control</span>. Este capítulo extiende las leyes de conservación a esos sistemas abiertos y las aplica a los dispositivos que forman los ciclos de potencia y refrigeración.</p>

<section>
<h2>Conservación de la masa y trabajo de flujo</h2>
<p>La masa dentro de un volumen de control cambia según lo que entra y lo que sale:</p>
<div class="eq">\[\frac{\dd m_{VC}}{\dd t}=\sum_{ent}\dot m-\sum_{sal}\dot m,\qquad \dot m=\rho VA=\frac{VA}{v}.\]</div>
<p>Para empujar un elemento de fluido de volumen \(V_e\) hacia dentro del volumen de control contra la presión \(P\), el fluido que viene detrás hace un trabajo \(PV_e\): por unidad de masa, \(Pv\). Es el <span class="term">trabajo de flujo</span>. La energía que transporta cada kilogramo que cruza la frontera es entonces \(u+Pv+\tfrac12V^2+gz=h+\tfrac12V^2+gz\). Esa es la razón profunda por la que la entalpía aparece en todo análisis de flujo.</p>
<div class="eq key" data-name="Primera ley, volumen de control">\[\frac{\dd E_{VC}}{\dd t}=\dot Q-\dot W+\sum_{ent}\dot m\left(h+\tfrac12V^2+gz\right)-\sum_{sal}\dot m\left(h+\tfrac12V^2+gz\right).\]</div>
<p>En <span class="term">flujo estacionario</span> nada cambia en el tiempo dentro del volumen de control. Con una entrada y una salida:</p>
<div class="eq">\[\dot Q-\dot W=\dot m\left[h_2-h_1+\tfrac12\left(V_2^2-V_1^2\right)+g(z_2-z_1)\right].\]</div>
</section>

<section>
<h2>Toberas y difusores</h2>
<p>Una <span class="term">tobera</span> acelera un fluido reduciendo su presión; un <span class="term">difusor</span> hace lo contrario. No hay trabajo, el calor es despreciable y la energía cinética es protagonista: \(V_2^2=V_1^2+2(h_1-h_2)\). Para un gas ideal en expansión isentrópica,</p>
<div class="eq">\[V_2=\sqrt{V_1^2+2c_pT_1\left[1-\left(\frac{P_2}{P_1}\right)^{(k-1)/k}\right]}.\]</div>
<p>Una caída de entalpía de apenas 44 kJ/kg acelera el aire de 30 a casi 300 m/s: la energía cinética es pequeña frente a la térmica, salvo en toberas, difusores y turbinas de gas. Si la presión de salida baja de la presión crítica, \(P^*=P_1[2/(k+1)]^{k/(k-1)}=0.528P_1\) para el aire, la tobera convergente se <b>ahoga</b>: en la garganta el flujo llega a la velocidad del sonido y no puede acelerarse más sin una sección divergente (la tobera de De Laval de los cohetes).</p>
<div class="sim" data-sim="tobera" data-title="Tobera convergente de aire: velocidad, temperatura y ahogamiento"></div>
<div class="sim-guide"><ul>
<li>Aire a 300 kPa y 400 K entra a 30 m/s y sale a 200 kPa: se enfría a 356 K y sale a 298 m/s.</li>
<li>Baje la presión de salida por debajo del 52.8 % de la de entrada: la velocidad queda fija en la del sonido en la garganta y el caudal no aumenta más.</li>
</ul></div>
</section>

<section>
<h2>Turbinas y compresores</h2>
<p>En una turbina el fluido entrega trabajo de eje al expandirse; en un compresor, una bomba o un ventilador, lo recibe. Las energías cinética y potencial suelen ser despreciables y, si el equipo está aislado, \(\dot W=\dot m(h_1-h_2)\). Las turbinas reales no son reversibles; se califican con la <span class="term">eficiencia isentrópica</span> (capítulo 11): \(\eta_T=(h_1-h_2)/(h_1-h_{2s})\), entre 0.85 y 0.92 en las grandes turbinas de vapor.</p>
<div class="sim" data-sim="turbina-vapor" data-title="Turbina de vapor en el diagrama de Mollier"></div>
<div class="sim-guide"><ul>
<li>Vapor a 3 MPa y 400 °C se expande hasta 10 kPa con eficiencia de 85 %: entrega 883 kJ/kg y sale con calidad 0.90. Con 10 kg/s, la potencia es 8.8 MW.</li>
<li>El diagrama \(h\)–\(s\) (de Mollier) es el de los diseñadores de turbinas: el trabajo es la caída vertical. La expansión real (línea roja) genera entropía y entrega menos trabajo que la isentrópica.</li>
<li>Una calidad de salida menor que 0.88 erosiona los álabes de las últimas etapas con gotas de agua; por eso se sobrecalienta el vapor.</li>
</ul></div>
</section>

<section>
<h2>Válvulas de estrangulamiento y el efecto Joule–Thomson</h2>
<p>Una válvula parcialmente cerrada, un tubo capilar o un tapón poroso producen una gran caída de presión sin trabajo, sin calor apreciable y sin cambio de energía cinética. La primera ley se reduce a</p>
<div class="eq key" data-name="Estrangulamiento">\[h_2=h_1.\]</div>
<p>Para un gas ideal \(h=h(T)\), así que la temperatura no cambia. Para un fluido real sí: el <span class="term">coeficiente de Joule–Thomson</span> \(\mu_{JT}=(\partial T/\partial P)_h\) mide cuánto. Joule y Thomson (Lord Kelvin) lo midieron entre 1852 y 1862 haciendo pasar gases por un tapón de algodón. A temperatura ambiente casi todos los gases se enfrían al expandirse (\(\mu_{JT}>0\)): el nitrógeno, unos 0.21 K/bar. El hidrógeno y el helio se calientan, porque están por encima de su <span class="term">temperatura de inversión</span> (202 K y 45 K). Linde (1895) usó el enfriamiento en cascada para licuar el aire, y todo refrigerador doméstico lo usa en su válvula de expansión.</p>
<div class="sim" data-sim="joule-thomson" data-title="Estrangulamiento: refrigerante, vapor de agua y gases reales"></div>
<div class="sim-guide"><ul>
<li>R-134a líquido saturado a 0.8 MPa (31.3 °C) que se estrangula a 0.12 MPa sale a −22.3 °C con calidad 0.34: el corazón de la nevera.</li>
<li>Con gases reales el cálculo usa Peng–Robinson con calores específicos estadísticos. El nitrógeno que pasa de 200 bar a 1 bar a 27 °C se enfría a −8 °C según Peng–Robinson; la ecuación de referencia da −4 °C. La diferencia mide la exactitud de las ecuaciones cúbicas para entalpías.</li>
<li>La curva de inversión separa la región donde el gas se enfría de aquella donde se calienta.</li>
</ul></div>
</section>

<section>
<h2>Cámaras de mezcla e intercambiadores: la ducha eléctrica</h2>
<p>En una <span class="term">cámara de mezcla</span> dos corrientes se juntan; si está aislada, \(\sum\dot m_eh_e=\sum\dot m_sh_s\). En un <span class="term">intercambiador de calor</span> dos fluidos intercambian energía sin mezclarse; el calor que pierde uno lo gana el otro.</p>
<p>La ducha eléctrica, muy común en Colombia, es un calentador de paso: el agua cruza una resistencia de 3 a 5.5 kW. Su balance es \(\dot W_{el}=\dot mc\,(T_2-T_1)\). Con 5.5 kW y un caudal de 5 L/min, el agua sube 15.8 °C: de 16 °C a casi 32 °C. Por eso hay que cerrar un poco el grifo en Popayán para bañarse con agua tibia: a menor caudal, mayor temperatura.</p>
<div class="sim" data-sim="ducha" data-title="La ducha eléctrica y el mezclador de agua"></div>
<div class="sim-guide"><ul>
<li>Ajuste el caudal: la temperatura de salida varía en proporción inversa. Duplicar el caudal reduce el salto a la mitad.</li>
<li>Active el mezclador con agua de un calentador a gas: la temperatura final es la media ponderada por los caudales.</li>
<li>El costo de energía usa la tarifa que se elija: un baño de 10 min a 5.5 kW consume 0.92 kWh.</li>
</ul></div>
</section>

<section>
<h2>Procesos transitorios: llenar un tanque</h2>
<p>Cuando la masa dentro del volumen de control cambia, la primera ley integrada entre los instantes 1 y 2 es</p>
<div class="eq">\[Q-W+\sum_{ent}m_eh_e-\sum_{sal}m_sh_s=m_2u_2-m_1u_1.\]</div>
<p>Un tanque vacío y aislado conectado a una línea de aire a \(T_l\) se llena hasta la presión de la línea. Sin calor ni trabajo, \(m_2u_2=m_2h_l\), y para un gas ideal con calores constantes, \(c_vT_2=c_pT_l\):</p>
<div class="eq">\[T_2=kT_l.\]</div>
<p>¡El aire dentro del tanque queda más caliente que el de la línea! Con la línea a 27 °C, el tanque llega a 147 °C. La energía extra es el trabajo de flujo que hizo el aire de la línea para empujar el que entraba. Al llenar un tanque de buceo, este calentamiento obliga a llenarlo lentamente o dentro de agua.</p>
<div class="sim" data-sim="llenado-tanque" data-title="Llenado de un tanque desde una línea de aire comprimido"></div>
<div class="sim-guide"><ul>
<li>El flujo por el orificio está ahogado al principio (la presión en el tanque es menor que el 52.8 % de la de la línea) y luego disminuye hasta detenerse.</li>
<li>Sin transferencia de calor la temperatura final es \(kT_l=420\) K, independiente de la presión de la línea. Con paredes conductoras, el aire se enfría hacia la temperatura ambiente y entra más masa.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Por una tubería de 5 cm de diámetro fluye agua a 2 m/s. Halle el caudal másico.
<details><summary>Respuesta</summary><p>\(\dot m=\rho VA=1000(2)(1.963\times10^{-3})=3.93\) kg/s.</p></details></li>
<li><span class="lvl">Básico</span>Una ducha de 4.5 kW calienta agua de 17 °C. ¿Qué caudal da agua a 38 °C?
<details><summary>Respuesta</summary><p>\(\dot m=4500/(4186\times21)=0.0512\) kg/s ≈ 3.1 L/min.</p></details></li>
<li><span class="lvl">Intermedio</span>Agua líquida saturada a 2 MPa se estrangula hasta 1 atm. Halle la temperatura y la calidad finales.
<details><summary>Respuesta</summary><p>\(h=908.5\) kJ/kg; a 101.3 kPa: \(T=99.97\) °C, \(x=0.217\). Es el «vapor flash» de las purgas de calderas.</p></details></li>
<li><span class="lvl">Intermedio</span>Un compresor aspira 0.5 kg/s de aire a 100 kPa y 20 °C y lo descarga a 600 kPa y 220 °C, perdiendo 8 kW de calor. Halle la potencia.
<details><summary>Respuesta</summary><p>\(\dot W=\dot Q-\dot m c_p\Delta T=-8-0.5(1.005)(200)=-108.5\) kW (consumidos).</p></details></li>
<li><span class="lvl">Avanzado</span>Un tanque rígido aislado de 0.1 m³ contiene aire a 100 kPa y 300 K y se conecta a una línea a 1 MPa y 300 K hasta igualar presiones. Halle la temperatura final y la masa que entra.
<details><summary>Respuesta</summary><p>Energía: \(m_2c_vT_2-m_1c_vT_1=(m_2-m_1)c_pT_l\), y como \(mc_vT=c_vPV/R\), el lado izquierdo es \(c_v(P_2-P_1)V/R\). Entonces \(m_2-m_1=(P_2-P_1)V/(kRT_l)\) y \(T_2=P_2/[P_1/T_1+(P_2-P_1)/(kT_l)]=1000/[0.3333+900/420]=403.8\) K. \(m_2=0.863\) kg, \(m_1=0.116\) kg: entran 0.747 kg.</p></details></li>
</ol>
