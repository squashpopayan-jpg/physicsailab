<template class="chapter-src" data-id="boltzmann" data-num="21" data-title="Distribución de Boltzmann y función de partición" data-part="Parte VI · Termodinámica estadística" data-short="El colectivo canónico, el factor de Boltzmann, la función de partición y las propiedades termodinámicas que se derivan de ella, el sistema de dos niveles y la anomalía de Schottky, las poblaciones rotacionales de las moléculas, el paramagnetismo y la transición de fase del modelo de Ising">
<p class="lead">Contar microestados de un sistema aislado es difícil. Casi siempre es más cómodo pensar en un sistema pequeño en contacto con un depósito a temperatura fija: un átomo en un gas, una molécula en un cristal, un espín en un imán. Para ellos, toda la termodinámica cabe en una sola función, la <em>función de partición</em>. Este capítulo la construye y la aplica a sistemas que se miden en el laboratorio: capacidades caloríficas con picos inesperados, espectros moleculares, imanes y la transición de fase más estudiada de la física.</p>

<section>
<h2>El factor de Boltzmann y la función de partición</h2>
<p>El capítulo 20 mostró que un sistema pequeño en contacto con un depósito a temperatura \(T\) tiene una probabilidad de estar en un microestado de energía \(E_i\) proporcional a \(\ee^{-E_i/k_BT}\), el <span class="term">factor de Boltzmann</span>. La constante de normalización es la <span class="term">función de partición</span>:</p>
<div class="eq key" data-name="Distribución de Boltzmann">\[P_i=\frac{\ee^{-\beta E_i}}{Z},\qquad Z=\sum_i\ee^{-\beta E_i},\qquad \beta=\frac1{k_BT}.\]</div>
<p>\(Z\) cuenta, con peso, cuántos estados son accesibles a la temperatura \(T\). De ella se obtienen todas las propiedades:</p>
<div class="eq key" data-name="Termodinámica desde Z">\[U=-\frac{\partial\ln Z}{\partial\beta},\qquad F=-k_BT\ln Z,\qquad S=\frac{U-F}{T},\qquad C_V=\frac{\partial U}{\partial T}=\frac{\langle E^2\rangle-\langle E\rangle^2}{k_BT^2}.\]</div>
<p>La última igualdad dice que la capacidad calorífica mide las fluctuaciones de la energía: una relación profunda entre respuesta y fluctuación que reaparece en el capítulo 23. Para un gas de moléculas independientes, \(Z=q^N/N!\), con \(q\) la función de partición de una molécula, que se factoriza en traslación, rotación, vibración y estados electrónicos. Así se calcularon los calores específicos estadísticos que el curso usa desde el capítulo 2.</p>
</section>

<section>
<h2>El sistema de dos niveles</h2>
<p>El sistema más simple tiene dos estados, de energías 0 y \(\Delta\): un espín en un campo magnético, un defecto con dos configuraciones, un átomo con un estado excitado bajo. Su función de partición es \(Z=1+\ee^{-\Delta/k_BT}\), y</p>
<div class="eq">\[\frac{U}{N}=\frac{\Delta}{\ee^{\Delta/k_BT}+1},\qquad \frac{C}{Nk_B}=\left(\frac{\Delta}{k_BT}\right)^2\frac{\ee^{\Delta/k_BT}}{\left(\ee^{\Delta/k_BT}+1\right)^2}.\]</div>
<p>La capacidad calorífica tiene un pico en \(k_BT\approx0.42\Delta\), la <span class="term">anomalía de Schottky</span>: a baja temperatura no hay energía para excitar el nivel superior; a alta, los dos niveles ya están casi igualmente poblados y no se puede absorber más. A diferencia de un oscilador, el sistema de dos niveles se satura. Esas anomalías aparecen en las medidas de \(c_p\) de sales paramagnéticas y de vidrios a temperaturas de pocos kelvin.</p>
<div class="sim" data-sim="dos-niveles" data-title="Sistema de dos niveles: poblaciones, energía, entropía y anomalía de Schottky"></div>
<div class="sim-guide"><ul>
<li>A alta temperatura las poblaciones tienden a 50 % y 50 %, y la entropía a \(k_B\ln2\) por partícula: dos estados igualmente probables.</li>
<li>El pico de \(C\) vale \(0.44\,k_B\) por partícula y está en \(k_BT/\Delta=0.417\).</li>
<li>Más población arriba que abajo correspondería a una «temperatura negativa»: es posible en sistemas de espines aislados de la red, y es el estado de un láser con inversión de población.</li>
</ul></div>
</section>

<section>
<h2>Moléculas: poblaciones rotacionales y espectros</h2>
<p>Una molécula diatómica que rota tiene niveles \(E_J=J(J+1)\,k_B\Theta_r\), cada uno con \(2J+1\) estados. La población de cada nivel es</p>
<div class="eq">\[P(J)\propto(2J+1)\,\ee^{-J(J+1)\Theta_r/T},\qquad J_{máx}\approx\sqrt{\frac{T}{2\Theta_r}}-\frac12.\]</div>
<p>El factor de degeneración crece y el de Boltzmann decrece: la población tiene un máximo. Para el CO (\(\Theta_r=2.77\) K) a 300 K el nivel más poblado es \(J=7\); para el HCl (\(\Theta_r=15.2\) K), \(J=3\). Las intensidades de las líneas de los espectros infrarrojos siguen esta distribución, y a partir de ellas los astrónomos miden la temperatura de nubes interestelares y atmósferas de planetas.</p>
<div class="sim" data-sim="rotacional" data-title="Poblaciones rotacionales y el espectro de rotación–vibración"></div>
<div class="sim-guide"><ul>
<li>Las barras son las poblaciones relativas de cada \(J\); el espectro simulado (ramas P y R) tiene intensidades proporcionales a ellas.</li>
<li>Enfríe la molécula: se pueblan solo los niveles bajos y el espectro se estrecha. A 10 K el CO tiene casi toda la población en \(J\le2\): así se observa en las nubes moleculares frías.</li>
</ul></div>
</section>

<section>
<h2>Paramagnetismo</h2>
<p>Un átomo con momento magnético \(\mu\) en un campo \(B\) tiene, si su espín es ½, dos energías \(\mp\mu B\). La magnetización media es</p>
<div class="eq">\[\langle\mu_z\rangle=\mu\tanh\left(\frac{\mu B}{k_BT}\right)\ \xrightarrow{\ \mu B\ll k_BT\ }\ \frac{\mu^2B}{k_BT}.\]</div>
<p>El límite de campo débil es la <span class="term">ley de Curie</span>: la susceptibilidad cae como \(1/T\). A temperatura ambiente y 1 T, \(\mu_BB/k_BT=0.002\): los espines apenas se orientan. Para alinearlos hacen falta campos de varios teslas y temperaturas de pocos kelvin. La desmagnetización adiabática de sales paramagnéticas, la técnica inversa, enfría a milikelvin.</p>
<div class="sim" data-sim="paramagnetismo" data-title="Magnetización de un paramagneto: función de Brillouin y ley de Curie"></div>
<div class="sim-guide"><ul>
<li>Las curvas son las funciones de Brillouin para \(J=1/2\), \(3/2\) y \(7/2\) (el ion Gd³⁺) y el límite clásico de Langevin.</li>
<li>Todas coinciden con la ley de Curie a campos débiles y se saturan a campos fuertes.</li>
</ul></div>
</section>

<section>
<h2>El modelo de Ising y las transiciones de fase</h2>
<p>¿Por qué el hierro es imán por debajo de 770 °C y deja de serlo por encima? Ningún sistema de partículas independientes tiene una transición de fase; hace falta interacción. El <span class="term">modelo de Ising</span> es el más simple: espines \(s_i=\pm1\) en una red, con energía \(E=-J\sum_{\langle ij\rangle}s_is_j\) que favorece a los vecinos alineados. Ernst Ising lo resolvió en una dimensión en 1925 y no encontró transición. Lars Onsager, en 1944, resolvió el caso bidimensional exactamente: hay una transición a</p>
<div class="eq key" data-name="Temperatura crítica de Onsager">\[\frac{k_BT_c}{J}=\frac{2}{\ln(1+\sqrt2)}=2.269.\]</div>
<p>Por debajo, los espines se alinean espontáneamente; por encima, el desorden térmico gana. Cerca de \(T_c\) aparecen dominios de todos los tamaños y la susceptibilidad y la capacidad calorífica divergen: es un punto crítico como el del agua (capítulo 3), con los mismos fenómenos y, sorprendentemente, la misma matemática.</p>
<div class="sim" data-sim="ising" data-title="Modelo de Ising en dos dimensiones con el algoritmo de Metropolis"></div>
<div class="sim-guide"><ul>
<li>El algoritmo de Metropolis (1953) elige un espín al azar y lo invierte con probabilidad \(\min(1,\ee^{-\Delta E/k_BT})\): así muestrea la distribución de Boltzmann sin calcular \(Z\).</li>
<li>Baje la temperatura por debajo de 2.27: se forman dominios que crecen hasta que uno domina. Súbala: el orden se pierde.</li>
<li>Justo en \(T_c\) aparecen dominios de todos los tamaños, una imagen fractal. La magnetización medida se compara con la exacta de Onsager–Yang, \(M=[1-\operatorname{senh}^{-4}(2J/k_BT)]^{1/8}\).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un nivel excitado está 0.1 eV por encima del fundamental. ¿Qué fracción de átomos lo ocupa a 300 K y a 3000 K?
<details><summary>Respuesta</summary><p>\(k_BT=0.02585\) eV a 300 K: \(\ee^{-3.87}/(1+\ee^{-3.87})=2.0\) %. A 3000 K (\(\Delta/k_BT=0.387\)): 40 %.</p></details></li>
<li><span class="lvl">Básico</span>Halle la entropía de un sistema de dos niveles a temperatura muy alta.
<details><summary>Respuesta</summary><p>\(S=Nk_B\ln2\).</p></details></li>
<li><span class="lvl">Intermedio</span>¿Qué nivel rotacional está más poblado en el N₂ (\(\Theta_r=2.88\) K) a 1000 K?
<details><summary>Respuesta</summary><p>\(\sqrt{1000/5.76}-0.5=12.7\): \(J=13\) (12 y 13 tienen poblaciones casi iguales).</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que, para un oscilador armónico clásico, la función de partición lleva a \(U=k_BT\) (equipartición).
<details><summary>Respuesta</summary><p>\(Z=\int\ee^{-\beta(p^2/2m+kx^2/2)}\dd x\,\dd p/h=2\pi/(h\omega\beta)\). \(U=-\partial\ln Z/\partial\beta=1/\beta=k_BT\).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que \(C_V=(\langle E^2\rangle-\langle E\rangle^2)/k_BT^2\).
<details><summary>Respuesta</summary><p>\(U=-\partial_\beta\ln Z\); \(\partial_\beta U=-\langle E^2\rangle+\langle E\rangle^2\). Como \(\partial_T=-k_B\beta^2\partial_\beta\), \(C_V=k_B\beta^2(\langle E^2\rangle-\langle E\rangle^2)\).</p></details></li>
</ol>
