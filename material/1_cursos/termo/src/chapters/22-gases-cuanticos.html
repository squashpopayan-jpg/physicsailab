<template class="chapter-src" data-id="gases-cuanticos" data-num="22" data-title="Gases cuánticos y radiación" data-part="Parte VI · Termodinámica estadística" data-short="Fermiones y bosones, distribuciones de Fermi–Dirac y de Bose–Einstein, el gas de fotones y la ley de Planck, el fondo cósmico de microondas, los electrones de un metal y su capacidad calorífica, la condensación de Bose–Einstein y el gas de fonones de Debye">
<p class="lead">Cuando la longitud de onda térmica de las partículas se acerca a la distancia entre ellas, la física clásica deja de servir y el carácter cuántico de las partículas idénticas se vuelve decisivo. Los fermiones (electrones, protones, neutrones) no pueden ocupar el mismo estado; los bosones (fotones, fonones, átomos de helio-4) prefieren hacerlo. De esa diferencia salen la radiación de cuerpo negro, la estabilidad de las enanas blancas, la conducción eléctrica de los metales y los condensados de Bose–Einstein. Este capítulo recorre esos gases cuánticos con la maquinaria del capítulo 21.</p>

<section>
<h2>Fermiones y bosones</h2>
<p>Para partículas idénticas que no interactúan, conviene contar cuántas ocupan cada estado de una partícula. Con un depósito que fija la temperatura y el potencial químico \(\mu\), el número medio de partículas en un estado de energía \(\varepsilon\) es</p>
<div class="eq key" data-name="Distribuciones cuánticas">\[\bar n_{FD}=\frac{1}{\ee^{(\varepsilon-\mu)/k_BT}+1},\qquad \bar n_{BE}=\frac{1}{\ee^{(\varepsilon-\mu)/k_BT}-1},\qquad \bar n_{MB}=\ee^{-(\varepsilon-\mu)/k_BT}.\]</div>
<p>La de Fermi–Dirac nunca supera 1, por el principio de exclusión de Pauli. La de Bose–Einstein diverge cuando \(\varepsilon\to\mu\): los bosones se acumulan en los estados más bajos. Cuando la ocupación es muy pequeña (\(\varepsilon-\mu\gg k_BT\)) las tres coinciden con la de Maxwell–Boltzmann: es el régimen clásico, en el que \(n\lambda^3\ll1\).</p>
<div class="sim" data-sim="distribuciones" data-title="Ocupación media de un estado: Fermi–Dirac, Bose–Einstein y Maxwell–Boltzmann"></div>
<div class="sim-guide"><ul>
<li>El eje horizontal es \((\varepsilon-\mu)/k_BT\). Para valores grandes las tres curvas se juntan.</li>
<li>La de Fermi–Dirac vale exactamente ½ en \(\varepsilon=\mu\), y se vuelve un escalón cuando \(T\to0\).</li>
</ul></div>
</section>

<section>
<h2>El gas de fotones y la ley de Planck</h2>
<p>Los fotones dentro de una cavidad a temperatura \(T\) son bosones sin masa cuyo número no se conserva, así que \(\mu=0\). Contando los modos electromagnéticos de la cavidad (dos polarizaciones, densidad \(8\pi\nu^2/c^3\) por unidad de volumen y de frecuencia) y multiplicando por la ocupación de Bose–Einstein y por \(h\nu\), Planck obtuvo en 1900 la densidad espectral de energía:</p>
<div class="eq key" data-name="Ley de Planck">\[u_\nu(T)=\frac{8\pi h\nu^3}{c^3}\,\frac{1}{\ee^{h\nu/k_BT}-1},\qquad u=\int_0^\infty u_\nu\,\dd\nu=\frac{4\sigma}{c}T^4.\]</div>
<p>De la mecánica estadística salen además la presión de radiación \(P=u/3\), la entropía \(S=\tfrac43uV/T\) y el número de fotones \(n=0.2436\,(k_BT/\hbar c)^3\). La constante de Stefan–Boltzmann queda expresada con constantes fundamentales, \(\sigma=2\pi^5k_B^4/(15h^3c^2)\), lo que se comprobó con exactitud a principios del siglo XX.</p>
<p>El universo entero está lleno de un gas de fotones: el <span class="term">fondo cósmico de microondas</span>, emitido cuando el universo se volvió transparente, 380 000 años después de la Gran Explosión, y enfriado por la expansión hasta 2.7255 K. El satélite COBE midió en 1990 que su espectro es el de Planck con una desviación menor que 50 partes por millón: el cuerpo negro más perfecto conocido. Hay unos 411 fotones del fondo por centímetro cúbico, y su máximo está en 160 GHz.</p>
<div class="sim" data-sim="foton-gas" data-title="El gas de fotones: espectro de Planck y propiedades termodinámicas"></div>
<div class="sim-guide"><ul>
<li>Del fondo cósmico (2.7 K) a la superficie del Sol (5772 K): la densidad de energía crece como \(T^4\) y la de fotones como \(T^3\), de modo que la energía media por fotón es \(2.70\,k_BT\).</li>
<li>La presión de radiación en la superficie del Sol es 0.28 Pa; en el centro de las estrellas masivas domina sobre la del gas.</li>
</ul></div>
</section>

<section>
<h2>Electrones en un metal</h2>
<p>Los electrones de conducción de un metal forman un gas de Fermi muy denso: \(n=8.47\times10^{28}\) m⁻³ en el cobre. A 0 K llenan todos los estados hasta la <span class="term">energía de Fermi</span>,</p>
<div class="eq">\[E_F=\frac{\hbar^2}{2m}\left(3\pi^2n\right)^{2/3},\]</div>
<p>7.0 eV para el cobre, equivalente a una temperatura de Fermi de 81 600 K. A temperatura ambiente, el gas es por lo tanto «frío»: casi todos los estados por debajo de \(E_F\) siguen ocupados, y solo una franja de ancho \(\sim k_BT\) cerca de \(E_F\) puede excitarse. Eso resolvió un misterio del siglo XIX: los electrones libres deberían añadir \(\tfrac32R\) al calor específico de los metales, y no lo hacen. Solo una fracción \(\sim T/T_F\) participa, y la contribución electrónica es lineal en \(T\):</p>
<div class="eq key" data-name="Capacidad calorífica electrónica">\[C_{el}=\gamma T,\qquad \gamma=\frac{\pi^2}{2}\frac{R}{T_F}.\]</div>
<p>Para el cobre, \(\gamma=0.50\) mJ/mol·K² según el modelo de electrones libres y 0.695 medido: el cociente, 1.38, mide la masa efectiva de los electrones en la red. La presión de ese gas de Fermi, 38 GPa en el cobre, contrarresta la atracción de los iones; en las enanas blancas, la presión de degeneración de los electrones sostiene una estrella entera contra su gravedad.</p>
<div class="sim" data-sim="fermi" data-title="Gas de electrones de un metal: distribución de Fermi–Dirac a temperatura finita"></div>
<div class="sim-guide"><ul>
<li>La ocupación es un escalón suavizado en un ancho de unos pocos \(k_BT\) alrededor de \(E_F\). A 300 K ese ancho es 0.026 eV, menos del 0.4 % de \(E_F\).</li>
<li>La curva sombreada es el número de electrones por unidad de energía, \(g(\varepsilon)\bar n(\varepsilon)\), con \(g\propto\sqrt\varepsilon\).</li>
<li>Suba la temperatura a decenas de miles de kelvin: solo entonces el gas se vuelve clásico.</li>
</ul></div>
</section>

<section>
<h2>Condensación de Bose–Einstein</h2>
<p>En un gas de bosones con número fijo de partículas, al bajar la temperatura el potencial químico se acerca a cero. Por debajo de una temperatura crítica,</p>
<div class="eq key" data-name="Temperatura de condensación de Bose–Einstein">\[T_c=\frac{2\pi\hbar^2}{mk_B}\left(\frac{n}{\zeta(3/2)}\right)^{2/3},\qquad \frac{N_0}{N}=1-\left(\frac{T}{T_c}\right)^{3/2},\]</div>
<p>una fracción macroscópica de las partículas ocupa el estado fundamental: un solo estado cuántico con millones de átomos. Einstein lo predijo en 1924 y Cornell, Wieman y Ketterle lo lograron en 1995 con átomos de rubidio y sodio enfriados por láser y evaporación hasta cientos de nanokelvin. Con la densidad del helio-4 líquido, la fórmula da 3.13 K, cerca de los 2.17 K a los que el helio se vuelve superfluido; las interacciones explican la diferencia.</p>
<div class="sim" data-sim="bec" data-title="Fracción condensada de un gas de Bose ideal"></div>
<div class="sim-guide"><ul>
<li>Ajuste la densidad y la masa atómica: \(T_c\) crece con la densidad y cae con la masa.</li>
<li>Por debajo de \(T_c\) la fracción condensada crece como \(1-(T/T_c)^{3/2}\); la animación muestra los átomos en el estado fundamental en el centro.</li>
</ul></div>
</section>

<section>
<h2>Fonones: el sólido de Debye</h2>
<p>Las vibraciones de un sólido cristalino son también un gas de bosones, los <span class="term">fonones</span>, con \(\mu=0\) como los fotones. Debye (1912) trató el cristal como un medio elástico con \(3N\) modos y una frecuencia de corte \(\omega_D\), y obtuvo la capacidad calorífica que el curso usa desde el capítulo 2:</p>
<div class="eq">\[\frac{C_V}{3Nk_B}=3\left(\frac{T}{\Theta_D}\right)^3\int_0^{\Theta_D/T}\frac{x^4\ee^x}{(\ee^x-1)^2}\dd x\ \xrightarrow{\ T\ll\Theta_D\ }\ \frac{4\pi^4}5\left(\frac{T}{\Theta_D}\right)^3.\]</div>
<p>La ley \(T^3\) a baja temperatura es la misma de la radiación de cuerpo negro (\(u\propto T^4\)): fonones y fotones son bosones sin masa con dispersión lineal. En un metal a muy baja temperatura, el término electrónico \(\gamma T\) supera al de los fonones: por debajo de unos 4 K en el cobre.</p>
<div class="sim" data-sim="debye" data-title="Capacidad calorífica de un sólido: fonones de Debye y electrones"></div>
<div class="sim-guide"><ul>
<li>La curva de Debye tiende a \(3R\) (Dulong–Petit) a alta temperatura y a \(T^3\) a baja. El modelo de Einstein, con una sola frecuencia, cae demasiado rápido.</li>
<li>En la gráfica \(C/T\) contra \(T^2\), un metal da una recta: la ordenada en el origen es \(\gamma\) y la pendiente, \(12\pi^4R/5\Theta_D^3\). Es la forma en que se miden ambos.</li>
</ul></div>
</section>

<details><summary>Respuesta</summary><p>\(h\nu_{máx}=2.821\,k_BT\): 160.2 GHz.</p></details></li>
<li><span class="lvl">Básico</span>Calcule la temperatura de Fermi del aluminio (\(n=18.1\times10^{28}\) m⁻³).
<details><summary>Respuesta</summary><p>\(E_F=11.7\) eV; \(T_F=1.36\times10^5\) K.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Cuál es la densidad de energía de la radiación dentro de un horno a 1000 K, y qué presión ejerce?
<details><summary>Respuesta</summary><p>\(u=aT^4=7.57\times10^{-4}\) J/m³; \(P=u/3=2.5\times10^{-4}\) Pa: despreciable frente a la del aire.</p></details></li>
<li><span class="lvl">Intermedio</span>Halle \(T_c\) para átomos de ⁸⁷Rb con \(n=10^{20}\) m⁻³.
<details><summary>Respuesta</summary><p>398 nK.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que la energía media por fotón en un cuerpo negro es \(\pi^4k_BT/(30\zeta(3))=2.70\,k_BT\).
<details><summary>Respuesta</summary><p>\(u\propto\int x^3/(\ee^x-1)\dd x=\pi^4/15\) y \(n\propto\int x^2/(\ee^x-1)\dd x=2\zeta(3)\), con el mismo prefactor. El cociente es \(k_BT\,\pi^4/(30\zeta(3))=2.701\,k_BT\).</p></details></li>
</ol>
