<template class="chapter-src" data-id="exergia" data-num="12" data-title="Exergía e irreversibilidad" data-part="Parte III · Segunda ley" data-short="Estado muerto, exergía del calor y factor de Carnot, trabajo reversible, irreversibilidad y teorema de Gouy–Stodola, exergía de sistemas cerrados y de flujo, balance de exergía y eficiencia de segunda ley de equipos domésticos e industriales">
<p class="lead">Un litro de agua a 40 °C y un litro de vapor a 550 °C pueden contener la misma energía si se toman las cantidades adecuadas, pero no valen lo mismo: con el vapor se mueve una turbina; con el agua tibia, apenas se lava la loza. La primera ley no distingue la calidad de la energía; la segunda sí. La <em>exergía</em> mide la parte de la energía que puede convertirse en trabajo útil en un ambiente dado, y la irreversibilidad mide cuánta se destruye. Es el concepto que guía el diseño de procesos eficientes.</p>

<section>
<h2>El estado muerto y la exergía del calor</h2>
<p>Un sistema solo puede producir trabajo mientras esté fuera de equilibrio con su entorno. Cuando alcanza la temperatura \(T_0\) y la presión \(P_0\) del ambiente (y, para la exergía química, su composición), está en el <span class="term">estado muerto</span>: ya no puede hacer nada. La <span class="term">exergía</span> es el máximo trabajo útil que se obtiene llevando el sistema reversiblemente desde su estado hasta el estado muerto.</p>
<p>El caso más simple es el calor. Una cantidad de calor \(Q\) disponible a temperatura \(T\) puede alimentar, como máximo, una máquina de Carnot que deseche al ambiente:</p>
<div class="eq key" data-name="Exergía del calor">\[X_Q=Q\left(1-\frac{T_0}{T}\right).\]</div>
<p>El paréntesis, el <span class="term">factor de Carnot</span>, mide la calidad del calor: 0.85 para una llama a 2000 K, 0.64 para vapor a 550 °C, 0.30 para un fluido geotérmico a 150 °C y apenas 0.05 para agua a 40 °C, con un ambiente a 25 °C. El calor a temperatura ambiente no vale nada como fuente de trabajo, aunque haya mucho: el océano contiene energía de sobra, pero casi ninguna exergía.</p>
<div class="sim" data-sim="factor-carnot" data-title="La calidad del calor: factor de Carnot según la temperatura"></div>
<div class="sim-guide"><ul>
<li>Las barras comparan 100 kJ de calor disponibles a distintas temperaturas: la energía es la misma; la exergía, muy distinta.</li>
<li>Por debajo de \(T_0\) el factor es negativo: el «frío» también tiene exergía, porque una máquina puede trabajar entre el ambiente y un cuerpo frío. La exergía del calor que se extrae de un congelador es \(Q(T_0/T-1)\).</li>
</ul></div>
</section>

<section>
<h2>Trabajo reversible e irreversibilidad</h2>
<p>El <span class="term">trabajo reversible</span> \(W_{rev}\) es el máximo trabajo útil (o el mínimo consumido) entre dos estados, intercambiando calor solo con el ambiente. La diferencia con el trabajo real es la <span class="term">irreversibilidad</span>, o exergía destruida. El teorema de Gouy (1889) y Stodola (1898) la relaciona con la entropía generada:</p>
<div class="eq key" data-name="Teorema de Gouy–Stodola">\[I=X_{dest}=W_{rev}-W_{útil}=T_0\,S_{gen}\ge0.\]</div>
<p>Cada irreversibilidad tiene un precio en trabajo perdido. Transferir calor \(Q\) de un cuerpo a \(T_H\) a otro a \(T_L\) destruye \(I=T_0Q(1/T_L-1/T_H)\). En una caldera, los gases de combustión a 1800 K calientan agua que hierve a 600 K: por cada megajulio transferido se destruyen 331 kJ de exergía, aunque la primera ley no registre pérdida alguna. Esa es la mayor irreversibilidad de una central térmica, mucho mayor que el calor que sale por la chimenea.</p>
<div class="sim" data-sim="perdida-calor" data-title="La exergía que se destruye al transferir calor a través de una diferencia de temperatura"></div>
<div class="sim-guide"><ul>
<li>La energía \(Q\) llega completa al lado frío; la exergía no. La diferencia es \(T_0S_{gen}\).</li>
<li>Con diferencias de temperatura pequeñas la destrucción es pequeña, pero hace falta un intercambiador más grande: es el compromiso económico de todo diseño térmico.</li>
</ul></div>
</section>

<section>
<h2>Exergía de sistemas cerrados y de corrientes</h2>
<p>Aplicando la primera y la segunda ley a un proceso reversible desde un estado cualquiera hasta el estado muerto se obtiene la exergía específica de un sistema cerrado y la de una corriente de flujo:</p>
<div class="eq key" data-name="Exergía de un sistema y de una corriente">\[\phi=(u-u_0)+P_0(v-v_0)-T_0(s-s_0)+\tfrac12V^2+gz,\qquad \psi=(h-h_0)-T_0(s-s_0)+\tfrac12V^2+gz.\]</div>
<p>El término \(-T_0(s-s_0)\) descuenta la energía que inevitablemente debe ir al ambiente como calor. El vapor a 10 MPa y 550 °C tiene 3397 kJ/kg de entalpía sobre el estado muerto pero solo 1491 kJ/kg de exergía (44 %). El vapor húmedo que sale de la turbina a 10 kPa todavía tiene 2240 kJ/kg de entalpía, pero apenas 143 kJ/kg de exergía: ese calor enorme que se tira al condensador casi no vale nada.</p>
<div class="sim" data-sim="exergia-vapor" data-title="Energía y exergía del agua en sus distintos estados"></div>
<div class="sim-guide"><ul>
<li>Recorra estados del agua: el líquido caliente tiene poca exergía; el vapor a alta presión y temperatura, mucha.</li>
<li>Cambie la temperatura ambiente: el estado muerto se mueve y la exergía cambia. La exergía depende del sistema y de su entorno.</li>
<li>En el diagrama \(h\)–\(s\) las líneas de exergía de flujo constante son rectas de pendiente \(T_0\) (en verde, cada 200 kJ/kg). La recta \(\psi=0\) pasa por el estado muerto; la exergía de flujo puede ser algo negativa en corrientes por debajo de la presión ambiente, porque habría que gastar trabajo para devolverlas a \(P_0\).</li>
</ul></div>
</section>

<section>
<h2>Eficiencia de segunda ley</h2>
<p>La eficiencia de primera ley compara energías; la de <span class="term">segunda ley</span> compara exergías: la útil frente a la gastada, o el desempeño real frente al reversible.</p>
<div class="eq key" data-name="Eficiencia de segunda ley">\[\eta_{II}=\frac{X_{recuperada}}{X_{suministrada}}=1-\frac{X_{dest}+X_{pérdidas}}{X_{suministrada}},\qquad \eta_{II,máquina}=\frac{\eta}{\eta_C},\qquad \eta_{II,refr}=\frac{\text{COP}}{\text{COP}_C}.\]</div>
<p>Los resultados son reveladores. Un calentador eléctrico de ambiente tiene eficiencia de primera ley del 100 %, pero de segunda ley del 3.7 % (calentar una habitación a 21 °C con 10 °C afuera): convierte electricidad, exergía pura, en calor de bajísima calidad. Una ducha eléctrica que calienta el agua de 16 a 38 °C tiene \(\eta_{II}=3.6\) %. Una bomba de calor con COP 3.5 que calienta agua a 45 °C, unos 30 %. La exergía señala dónde está el desperdicio verdadero.</p>
<div class="sim" data-sim="eficiencia-ii" data-title="Eficiencias de primera y segunda ley de equipos comunes"></div>
<div class="sim-guide"><ul>
<li>Elija un equipo y ajuste sus temperaturas. La barra de primera ley suele estar cerca del 100 %; la de segunda ley revela la oportunidad de mejora.</li>
<li>La central de ciclo combinado tiene la mejor eficiencia de segunda ley entre las de conversión de combustibles: más del 60 %.</li>
</ul></div>
<div class="box ex"><h4>La ducha eléctrica, vista con la segunda ley</h4>
<p>Una ducha eléctrica calienta agua de 16 °C a 38 °C. Con el ambiente a 16 °C, ¿cuál es su eficiencia de segunda ley?</p>
<details><summary>Solución</summary><p>Energía recibida por kilogramo de agua: \(c\Delta T=4.186(22)=92.1\) kJ, igual al trabajo eléctrico (primera ley: 100 %). Exergía ganada: \(c[(T_2-T_1)-T_0\ln(T_2/T_1)]=4.186[22-289.15\ln(311.15/289.15)]=3.34\) kJ. \(\eta_{II}=3.34/92.1=3.6\) %. Una bomba de calor ideal podría entregar el mismo baño con 3.6 % de esa electricidad.</p></details>
</div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Cuánta exergía tienen 500 kJ de calor disponibles a 400 °C con \(T_0=25\) °C?
<details><summary>Respuesta</summary><p>\(500(1-298.15/673.15)=278.5\) kJ.</p></details></li>
<li><span class="lvl">Básico</span>Una máquina térmica entre 800 K y 300 K tiene \(\eta=0.40\). Halle \(\eta_{II}\).
<details><summary>Respuesta</summary><p>\(\eta_C=0.625\); \(\eta_{II}=0.64\).</p></details></li>
<li><span class="lvl">Intermedio</span>Un intercambiador transfiere 50 kW de gases a 500 °C a aire a 50 °C, con \(T_0=25\) °C. Halle la exergía destruida (suponga temperaturas uniformes).
<details><summary>Respuesta</summary><p>\(I=298.15\times50(1/323.15-1/773.15)=26.9\) kW.</p></details></li>
<li><span class="lvl">Intermedio</span>Halle la exergía de flujo del vapor a 3 MPa y 400 °C con estado muerto a 25 °C y 100 kPa.
<details><summary>Respuesta</summary><p>\(\psi=(3231.7-104.9)-298.15(6.9234-0.3672)=1172\) kJ/kg.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que \(\eta_{II}\) de una bomba de calor ideal-real (COP = \(f\cdot\)COP\(_C\)) que calienta un espacio a \(T_H\) desde un ambiente a \(T_0\) es exactamente \(f\).
<details><summary>Respuesta</summary><p>Exergía entregada: \(Q_H(1-T_0/T_H)\); trabajo: \(Q_H/\text{COP}\). \(\eta_{II}=\text{COP}(1-T_0/T_H)=f\,\frac{T_H}{T_H-T_0}\cdot\frac{T_H-T_0}{T_H}=f\).</p></details></li>
</ol>
