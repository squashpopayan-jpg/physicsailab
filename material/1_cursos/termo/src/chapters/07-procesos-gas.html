<template class="chapter-src" data-id="procesos-gas" data-num="7" data-title="Procesos del gas ideal" data-part="Parte II · Primera ley" data-short="Procesos isotérmico, isobárico, isocórico y adiabático reversible, la familia politrópica, el motor diésel y la bomba de bicicleta, la medición de γ con el experimento de Rüchardt y el exponente politrópico que surge de la transferencia de calor">
<p class="lead">Cuando se infla una llanta, la bomba se calienta. Cuando se abre una botella de gaseosa, se forma una neblina en el cuello. En un motor diésel el aire comprimido se calienta tanto que enciende el combustible sin chispa. Los tres fenómenos son el mismo: un gas que cambia de volumen más rápido de lo que intercambia calor. Este capítulo resuelve los procesos del gas ideal con la primera ley y conecta los idealizados con los reales.</p>

<section>
<h2>Los cuatro procesos básicos</h2>
<p>Para un gas ideal con calores específicos constantes, la primera ley y la ecuación de estado bastan para resolver cualquier proceso cuasiestático. Los cuatro casos clásicos son:</p>
<div class="tablewrap"><table>
<tr><th>Proceso</th><th class="c">Relación</th><th class="c">\(W_b\)</th><th class="c">\(Q\)</th></tr>
<tr><td>Isocórico</td><td class="c">\(P/T=\text{cte}\)</td><td class="c">0</td><td class="c">\(mc_v\Delta T\)</td></tr>
<tr><td>Isobárico</td><td class="c">\(V/T=\text{cte}\)</td><td class="c">\(mR\Delta T\)</td><td class="c">\(mc_p\Delta T\)</td></tr>
<tr><td>Isotérmico</td><td class="c">\(PV=\text{cte}\)</td><td class="c">\(mRT\ln(V_2/V_1)\)</td><td class="c">\(=W_b\)</td></tr>
<tr><td>Adiabático reversible</td><td class="c">\(PV^k=\text{cte}\)</td><td class="c">\(-mc_v\Delta T\)</td><td class="c">0</td></tr>
</table></div>
<h3>El proceso adiabático reversible</h3>
<p>Si no hay calor, \(\dd U=-P\,\dd V\). Con \(\dd U=mc_v\,\dd T\) y \(P=mRT/V\):</p>
<div class="eq">\[c_v\frac{\dd T}{T}=-R\frac{\dd V}{V}\quad\Longrightarrow\quad TV^{R/c_v}=TV^{k-1}=\text{cte}.\]</div>
<p>Combinando con la ecuación de estado se obtienen las tres formas equivalentes:</p>
<div class="eq key" data-name="Adiabática reversible del gas ideal">\[PV^k=\text{cte},\qquad TV^{k-1}=\text{cte},\qquad TP^{(1-k)/k}=\text{cte}.\]</div>
<p>La adiabática es más empinada que la isoterma en el diagrama \(P\)–\(V\) (pendiente \(k\) veces mayor): al comprimir sin dejar escapar calor, la presión sube por dos causas, la reducción del volumen y el aumento de la temperatura. El capítulo 11 mostrará que este proceso es <b>isentrópico</b>.</p>
</section>

<section>
<h2>La familia politrópica</h2>
<p>Los procesos reales de compresión y expansión no son ni isotérmicos ni adiabáticos: el gas pierde algo de calor. Se describen muy bien con un <span class="term">proceso politrópico</span>, \(PV^n=\text{cte}\), con un exponente \(n\) que se mide. Todos los procesos anteriores son casos particulares: \(n=0\) (isobárico), \(n=1\) (isotérmico), \(n=k\) (adiabático) y \(n\to\infty\) (isocórico). Para el gas ideal,</p>
<div class="eq">\[W_b=\frac{mR(T_2-T_1)}{1-n},\qquad Q=W_b\,\frac{k-n}{k-1},\qquad \frac{T_2}{T_1}=\left(\frac{V_1}{V_2}\right)^{n-1}.\]</div>
<p>Cuando \(1&lt;n&lt;k\), una compresión calienta el gas pero le saca calor al mismo tiempo: es el caso de los compresores reales, con \(n\approx1.3\) para el aire.</p>
<div class="sim" data-sim="politropicos" data-title="La familia politrópica desde un mismo estado"></div>
<div class="sim-guide"><ul>
<li>Desde el estado 1 (100 kPa, 0.1 m³, 300 K) se comprime el aire hasta 0.02 m³. Isotérmicamente el trabajo consumido es 16.1 kJ; adiabáticamente, 22.6 kJ y la temperatura sube a 571 K.</li>
<li>Barra el exponente: el calor cambia de signo en \(n=k\). Entre 1 y \(k\) el gas se calienta y a la vez cede calor.</li>
<li>Las curvas de temperatura constante (en gris) muestran cómo la adiabática corta las isotermas: en una compresión adiabática el gas salta de una isoterma a otra más caliente.</li>
</ul></div>
</section>

<section>
<h2>Compresiones rápidas: el motor diésel y la bomba de bicicleta</h2>
<p>En 1893 Rudolf Diesel patentó un motor que no necesitaba bujía: comprime solo aire, tan rápido que casi no pierde calor, hasta que su temperatura supera la de autoignición del combustible (unos 210 °C para el gasóleo), y entonces lo inyecta. Con una relación de compresión de 18, el aire a 27 °C llega a</p>
<div class="eq">\[T_2=T_1r^{k-1}=300\times18^{0.4}=953\ \text{K}=680\ °\text{C},\qquad P_2=P_1r^k=57\ P_1.\]</div>
<p>El mismo principio tiene el pistón de fuego del sudeste asiático, que enciende yesca con un golpe de la mano. La bomba de bicicleta se calienta por la misma razón, aunque mucho menos de lo que predice el cálculo adiabático (comprimir aire de 81.9 a 600 kPa daría 518 K), porque el bombeo es lento y la bomba disipa calor.</p>
<div class="sim" data-sim="compresion-rapida" data-title="Compresión con transferencia de calor: del proceso isotérmico al adiabático"></div>
<div class="sim-guide"><ul>
<li>El modelo resuelve la primera ley con un coeficiente de transferencia de calor a la pared: \(mc_v\dot T=-P\dot V+hA(T_w-T)\). El exponente politrópico <b>no se supone</b>: se calcula del resultado.</li>
<li>Compresión lenta (varios segundos): \(n\to1\). Compresión en una centésima de segundo, como en un motor a 3000 rpm: \(n\to k\).</li>
<li>El parámetro que decide es el cociente entre el tiempo de compresión y el tiempo térmico \(mc_v/hA\).</li>
</ul></div>
</section>

<section>
<h2>Medir γ: el experimento de Rüchardt</h2>
<p>En 1929 Eduard Rüchardt midió el cociente \(\gamma=c_p/c_v\) con un frasco grande y un tubo vertical de vidrio en el que ajusta una esfera de acero. Si la esfera baja una distancia \(y\), comprime el gas; la presión sube \(\Delta P=-\gamma P\,Ay/V\) (adiabática, porque la oscilación es rápida) y empuja la esfera hacia arriba. Es un oscilador armónico:</p>
<div class="eq key" data-name="Oscilador de Rüchardt">\[m\ddot y=-\frac{\gamma PA^2}{V}\,y\qquad\Longrightarrow\qquad \gamma=\frac{4\pi^2mV}{A^2P\tau^2}.\]</div>
<p>Con un frasco de 10 L, un tubo de 16 mm y una esfera de 16.6 g, el período es de 1.18 s en Popayán: fácil de medir con un cronómetro. El método da \(\gamma\) con un 2–5 % de error; la fricción y la fuga de gas alrededor de la esfera lo sesgan hacia abajo.</p>
<div class="sim" data-sim="ruchardt" data-title="Oscilador de Rüchardt: medir γ con un frasco y una esfera"></div>
<div class="sim-guide"><ul>
<li>Elija el gas: el argón (\(\gamma=5/3\)) oscila más rápido que el aire (1.40) y el CO₂ (1.29). La diferencia es medible a mano.</li>
<li>Active el modo isotérmico (oscilación hipotéticamente lenta): el período aumenta en \(\sqrt\gamma\). Rüchardt confirmó así que la oscilación es adiabática.</li>
<li>El simulador «mide» el período contando cruces por cero y despeja \(\gamma\), igual que en el laboratorio.</li>
</ul></div>
<div class="box ex"><h4>La neblina al destapar una gaseosa</h4>
<p>El gas en el cuello de una botella está a 3.5 atm y 20 °C. Al destaparla, se expande casi adiabáticamente hasta 1 atm. ¿A qué temperatura llega?</p>
<details><summary>Solución</summary><p>\(T_2=T_1(P_2/P_1)^{(k-1)/k}\). El gas es casi todo CO₂ (\(k=1.29\)): \(T_2=293(1/3.5)^{0.225}=221\) K \(=-52\) °C. El vapor de agua del cuello se condensa en una neblina instantánea. (La expansión no es del todo reversible, así que el enfriamiento real es algo menor.)</p></details>
</div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Aire a 100 kPa y 20 °C se comprime adiabática y reversiblemente hasta 800 kPa. Halle \(T_2\) y el trabajo por kilogramo.
<details><summary>Respuesta</summary><p>\(T_2=293.15(8)^{0.2857}=531\) K; \(w=c_v(T_2-T_1)=0.718(238)=171\) kJ/kg consumidos.</p></details></li>
<li><span class="lvl">Básico</span>¿Qué relación de compresión necesita un motor diésel para llevar aire de 27 °C a 500 °C adiabáticamente?
<details><summary>Respuesta</summary><p>\(r=(773/300)^{2.5}=10.7\).</p></details></li>
<li><span class="lvl">Intermedio</span>Un compresor comprime aire politrópicamente con \(n=1.3\) de 100 kPa y 300 K a 900 kPa. Halle el trabajo de frontera y el calor por kilogramo.
<details><summary>Respuesta</summary><p>\(T_2=300(9)^{0.3/1.3}=498.1\) K; \(w=R(T_2-T_1)/(1-n)=-189.5\) kJ/kg; \(q=w(k-n)/(k-1)=-47.4\) kJ/kg.</p></details></li>
<li><span class="lvl">Intermedio</span>En el experimento de Rüchardt con aire, el período medido es 1.21 s con los datos del texto. ¿Qué \(\gamma\) resulta?
<details><summary>Respuesta</summary><p>\(\gamma=1.40(1.183/1.21)^2=1.34\): un 4 % bajo, típico por la fuga de aire alrededor de la esfera.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que en el diagrama \(P\)–\(V\) la pendiente de la adiabática es \(k\) veces la de la isoterma que pasa por el mismo punto.
<details><summary>Respuesta</summary><p>Isoterma: \(\dd P/\dd V=-P/V\). Adiabática: \(\dd P/\dd V=-kP/V\). El cociente es \(k\).</p></details></li>
</ol>
