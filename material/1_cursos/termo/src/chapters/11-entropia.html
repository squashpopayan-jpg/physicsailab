<p class="lead">La segunda ley dice qué procesos son imposibles. Para convertirla en una herramienta de cálculo, Clausius (1865) definió una propiedad nueva que cambia de una manera precisa en cada proceso y que solo puede aumentar en un sistema aislado. La llamó <em>entropía</em>, del griego «transformación». Este capítulo la define, enseña a calcularla para cualquier sustancia y la usa para medir cuán lejos de lo ideal están las máquinas reales.</p>

<section>
<h2>La desigualdad de Clausius y la definición de entropía</h2>
<p>Considere un ciclo cualquiera que intercambia calor \(\delta Q\) con su entorno a través de una frontera a temperatura \(T\). Acoplando máquinas de Carnot imaginarias entre esa frontera y un único depósito, y aplicando el enunciado de Kelvin–Planck al conjunto, Clausius demostró que</p>
<div class="eq key" data-name="Desigualdad de Clausius">\[\oint\frac{\delta Q}{T}\le0,\]</div>
<p>con la igualdad solo para ciclos reversibles. Como en un ciclo reversible la integral se anula, \(\delta Q_{rev}/T\) es la diferencial de una propiedad:</p>
<div class="eq key" data-name="Entropía">\[\dd S=\left(\frac{\delta Q}{T}\right)_{rev},\qquad S_2-S_1=\int_1^2\left(\frac{\delta Q}{T}\right)_{rev}.\]</div>
<p>La entropía es una propiedad: su cambio entre dos estados es el mismo por cualquier camino. Para calcularlo en un proceso irreversible basta imaginar <b>cualquier</b> camino reversible entre los mismos estados.</p>
</section>

<section>
<h2>El principio de incremento de la entropía</h2>
<p>Si un proceso irreversible lleva un sistema de 1 a 2 y uno reversible lo devuelve, la desigualdad de Clausius da \(S_2-S_1\ge\int_1^2\delta Q/T\). Se convierte en igualdad añadiendo un término positivo, la <span class="term">entropía generada</span>:</p>
<div class="eq key" data-name="Balance de entropía">\[S_2-S_1=\int_1^2\frac{\delta Q}{T_b}+S_{gen},\qquad S_{gen}\ge0.\]</div>
<p>La entropía de un sistema cambia por dos razones: se transfiere con el calor (\(\delta Q/T_b\), con \(T_b\) la temperatura de la frontera) y se genera por irreversibilidades. La transferencia puede ser de cualquier signo; la generación, nunca negativa. En un sistema aislado no hay transferencia, y</p>
<div class="eq">\[\Delta S_{aislado}=S_{gen}\ge0.\]</div>
<p>Este es el <b>principio de incremento de la entropía</b>. Un proceso es posible si y solo si genera entropía no negativa; es reversible si genera cero. La entropía no se conserva: el universo la produce sin cesar.</p>
<div class="sim" data-sim="dos-bloques" data-title="Dos bloques: contacto directo frente a una máquina reversible entre ellos"></div>
<div class="sim-guide"><ul>
<li>Dos bloques de cobre de 1 kg a 400 K y 300 K en contacto directo llegan a 350 K y generan 7.94 J/K: el proceso es irreversible.</li>
<li>Si entre ellos se pone una máquina reversible, la temperatura final es la media geométrica, \(\sqrt{T_1T_2}=346.4\) K, la entropía generada es cero y se obtienen 2.76 kJ de trabajo. Es el trabajo que el contacto directo desperdició; su valor es muy cercano a \(T_{f,rev}\,S_{gen}=2.75\) kJ, la forma del «trabajo perdido» que se precisa en el capítulo 12.</li>
<li>Con bloques de capacidades distintas, la temperatura final se acerca a la del bloque más grande.</li>
</ul></div>
</section>

<section>
<h2>Las relaciones T dS y el cálculo de la entropía</h2>
<p>Para un sistema simple compresible que sigue un camino reversible, \(\delta Q=T\,\dd S\) y \(\delta W=P\,\dd V\). La primera ley da las <span class="term">relaciones de Gibbs</span>, que solo contienen propiedades y por lo tanto valen para <b>cualquier</b> proceso:</p>
<div class="eq key" data-name="Relaciones de Gibbs">\[T\,\dd s=\dd u+P\,\dd v,\qquad T\,\dd s=\dd h-v\,\dd P.\]</div>
<h3>Sólidos y líquidos</h3>
<p>Con \(\dd v\approx0\) y \(\dd u=c\,\dd T\): \(s_2-s_1=c\ln(T_2/T_1)\). Calentar 1 kg de agua de 20 a 80 °C aumenta su entropía en 0.778 kJ/K.</p>
<h3>Gases ideales</h3>
<p>Con \(\dd h=c_p\,\dd T\) y \(v=RT/P\):</p>
<div class="eq key" data-name="Entropía del gas ideal">\[s_2-s_1=\int_1^2c_p(T)\frac{\dd T}{T}-R\ln\frac{P_2}{P_1}=c_v\ln\frac{T_2}{T_1}+R\ln\frac{v_2}{v_1}\ \ (c\ \text{constantes}).\]</div>
<p>En un proceso isentrópico con calores constantes se recuperan las relaciones adiabáticas del capítulo 7, \(Pv^k=\text{cte}\): <b>adiabático y reversible implica isentrópico</b>. Lo contrario no vale: un proceso puede ser isentrópico y no adiabático si la entropía que sale con el calor iguala a la generada.</p>
<h3>Cambios de fase</h3>
<p>Durante un cambio de fase a presión constante la temperatura no cambia, y \(s_{fg}=h_{fg}/T_{sat}\). Para el agua a 100 °C, \(s_{fg}=2256.4/373.15=6.047\) kJ/kg·K. Las tablas de vapor dan \(s\) directamente.</p>
<div class="box ex"><h4>Un cubo de hielo que se funde en la mesa</h4>
<p>Un kilogramo de hielo a 0 °C se funde en una cocina a 20 °C. Halle la entropía generada.</p>
<details><summary>Solución</summary><p>Hielo: \(\Delta S=Q/T=333.6/273.15=1.2213\) kJ/K. Cocina (depósito): \(\Delta S=-333.6/293.15=-1.1380\) kJ/K. Generada: \(S_{gen}=0.0833\) kJ/K &gt; 0. La irreversibilidad está en la transferencia de calor a través de una diferencia finita de temperatura.</p></details>
</div>
</section>

<section>
<h2>El diagrama T–s</h2>
<p>En un diagrama \(T\)–\(s\), el área bajo la curva de un proceso reversible es el calor por unidad de masa, \(q=\int T\,\dd s\), así como en el \(P\)–\(v\) es el trabajo. Los procesos isentrópicos son verticales; los isotérmicos, horizontales. Por eso el ciclo de Carnot es un rectángulo y el diagrama \(T\)–\(s\) es la herramienta preferida para analizar ciclos de potencia y refrigeración.</p>
<div class="sim" data-sim="ts-agua" data-title="El diagrama T–s del agua: isóbaras, calidades y áreas de calor"></div>
<div class="sim-guide"><ul>
<li>Las isóbaras son horizontales bajo el domo (cambio de fase a \(T\) constante) y suben como exponenciales en el vapor, donde \(\dd T/\dd s=T/c_p\).</li>
<li>Elija un proceso a presión constante entre dos estados: el área sombreada es el calor, igual a \(\Delta h\).</li>
<li>Las líneas de calidad constante dividen el domo; la expansión de una turbina ideal es una línea vertical que puede cruzarlas.</li>
</ul></div>
</section>

<section>
<h2>Eficiencias isentrópicas</h2>
<p>Las turbinas, compresores y toberas reales son casi adiabáticos pero no reversibles: generan entropía por fricción y turbulencia. Su referencia ideal es el proceso isentrópico entre la misma entrada y la misma presión de salida, y su calidad se mide con la <span class="term">eficiencia isentrópica</span>:</p>
<div class="eq key" data-name="Eficiencias isentrópicas">\[\eta_T=\frac{h_1-h_2}{h_1-h_{2s}},\qquad \eta_C=\frac{h_{2s}-h_1}{h_2-h_1},\qquad \eta_N=\frac{V_2^2}{V_{2s}^2}.\]</div>
<p>Valores típicos: 0.85–0.92 en turbinas grandes, 0.80–0.88 en compresores centrífugos y axiales, más de 0.95 en toberas.</p>
<div class="sim" data-sim="compresor-ts" data-title="Compresor de aire real e isentrópico en el diagrama T–s"></div>
<div class="sim-guide"><ul>
<li>Aire de 100 kPa y 300 K se comprime a 800 kPa. Isentrópicamente sale a 543 K; con \(\eta_C=0.85\), a 586 K, y su entropía aumenta 0.077 kJ/kg·K.</li>
<li>El trabajo extra (\(h_2-h_{2s}\)) termina como energía interna del aire de salida: un compresor ineficiente entrega aire más caliente.</li>
<li>Pase al modo turbina: la expansión real termina a la derecha y por encima de la isentrópica.</li>
</ul></div>
</section>

<section>
<h2>La entropía de mezcla</h2>
<p>Si dos gases ideales distintos, inicialmente separados a la misma \(T\) y \(P\), se mezclan, cada uno se expande hasta ocupar todo el volumen: su entropía aumenta como en una expansión libre, \(-R\ln x_i\) por mol. La mezcla genera</p>
<div class="eq key" data-name="Entropía de mezcla">\[\Delta S_{mez}=-\bar R\sum_in_i\ln x_i.\]</div>
<p>Formar un mol de aire a partir de oxígeno y nitrógeno puros genera 4.27 J/K. La separación inversa (plantas criogénicas de oxígeno, desalinización por ósmosis inversa) requiere como mínimo un trabajo \(T\Delta S_{mez}\).</p>
<p>Si los dos gases son idénticos, retirar la partición no cambia nada macroscópico y \(\Delta S=0\). Que la entropía salte de \(R\ln2\) a 0 según los gases sean apenas distintos o idénticos es la <span class="term">paradoja de Gibbs</span>; su solución exige que las partículas idénticas sean indistinguibles, un hecho cuántico (capítulo 20).</p>
<div class="sim" data-sim="mezcla" data-title="Mezcla de dos gases y crecimiento de la entropía"></div>
<div class="sim-guide"><ul>
<li>Retire la partición: las partículas rojas y azules se mezclan y no vuelven a separarse. La curva muestra la entropía de mezcla estimada contando partículas en celdas: crece hasta el valor ideal \(-Nk_B\sum x_i\ln x_i\) y fluctúa a su alrededor.</li>
<li>Con pocas partículas las fluctuaciones son grandes y a veces la entropía «baja» un poco: la segunda ley es estadística. Con \(10^{23}\) partículas esas fluctuaciones son inobservables.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un depósito a 500 K cede 1000 kJ a otro a 300 K. Halle la entropía generada.
<details><summary>Respuesta</summary><p>\(-1000/500+1000/300=1.333\) kJ/K.</p></details></li>
<li><span class="lvl">Básico</span>Halle el cambio de entropía de 2 kg de aire calentados a presión constante de 300 a 600 K (\(c_p=1.005\)).
<details><summary>Respuesta</summary><p>\(2(1.005)\ln2=1.393\) kJ/K.</p></details></li>
<li><span class="lvl">Intermedio</span>Vapor a 3 MPa y 400 °C se expande en una turbina adiabática hasta 50 kPa con \(\eta_T=0.85\). Halle el estado de salida y la entropía generada por kilogramo.
<details><summary>Respuesta</summary><p>\(h_1=3231.7\), \(s_1=6.9235\); \(h_{2s}=2407.9\) (\(x=0.897\)); \(h_2=2531.5\) kJ/kg, \(x_2=0.951\), \(s_2=7.2721\): \(s_{gen}=0.349\) kJ/kg·K.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Cuánta entropía se genera al estrangular R-134a líquido saturado de 0.8 MPa a 0.12 MPa?
<details><summary>Respuesta</summary><p>\(s_{gen}=s_2-s_1=0.0297\) kJ/kg·K (proceso adiabático, toda la variación es generación).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que poner en contacto dos bloques iguales a \(T_1\) y \(T_2\) siempre genera entropía, \(S_{gen}=mc\ln[(T_1+T_2)^2/(4T_1T_2)]\ge0\).
<details><summary>Respuesta</summary><p>\(T_f=(T_1+T_2)/2\); \(\Delta S=mc[\ln(T_f/T_1)+\ln(T_f/T_2)]=mc\ln[T_f^2/(T_1T_2)]\). Por la desigualdad entre las medias aritmética y geométrica, \(T_f\ge\sqrt{T_1T_2}\), con igualdad solo si \(T_1=T_2\).</p></details></li>
</ol>
