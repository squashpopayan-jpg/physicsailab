<p class="lead">Todos los cálculos de las simulaciones salen de una biblioteca única (<code>src/core/30-thermo.js</code>) y de unas tablas de propiedades generadas una sola vez (<code>src/core/29-tablas.js</code>). Un programa automático compara esa biblioteca con tres tipos de referencia independiente. Este apéndice explica el método y lista cada comprobación con su resultado.</p>

<section>
<h2>Método</h2>
<ol>
<li><b>Propiedades de fluidos reales con CoolProp</b>. Las tablas del agua (formulación IAPWS-95 de Wagner y Pruß) y del R-134a (Tillner-Roth y Baehr) se generaron con la biblioteca abierta CoolProp en una malla de saturación y de vapor sobrecalentado; el curso las interpola con splines cúbicos. Las pruebas comparan estados <b>fuera</b> de los nodos de la malla con CoolProp, y calculan con CoolProp, de forma independiente, ciclos de Rankine, Rankine regenerativo y refrigeración completos. También se contrastan con CoolProp la presión de vapor de Wagner–Pruß, la psicrometría (formulación de aire húmedo ASHRAE RP-1485), el factor de compresibilidad de Peng–Robinson frente a las ecuaciones de referencia del CO₂, N₂ y CH₄, la estrangulación de Joule–Thomson y los calores específicos de gas ideal.</li>
<li><b>Referencias numéricas con SciPy</b>: funciones especiales (error, gamma), integrales de Debye, de Fermi–Dirac y de Bose–Einstein, fracciones de emisión de cuerpo negro, la construcción de Maxwell para van der Waals (resuelta con <code>brentq</code> y <code>quad</code>) y las raíces de la ecuación cúbica de Peng–Robinson (<code>numpy.roots</code>). Tolerancias entre \(10^{-6}\) y \(10^{-12}\).</li>
<li><b>Datos de la literatura</b>: tablas de Çengel y Boles, NIST-JANAF (calores específicos, entalpías y constantes de equilibrio), CODATA (entropías absolutas de los gases nobles, constantes), Kittel (energía de Fermi), Turns (temperaturas de llama) y ejemplos resueltos de los textos. La tolerancia refleja la incertidumbre del dato o del modelo.</li>
</ol>
<p>Todos los ejemplos resueltos y las respuestas de los problemas se calcularon con la misma biblioteca antes de escribirlos. Cuando un número del borrador no coincidió con el cálculo, se corrigió el texto: así se ajustaron, entre otros, la masa de nitrógeno de un cilindro y la presión que da Peng–Robinson, las respuestas de varios problemas de vapor, el factor de compresibilidad del metano a 200 bar, la temperatura de las superficies de una ventana, la fracción ocupada de un nivel excitado y la constante de Avogadro del problema de Perrin. También fallaron, al principio, algunas pruebas cuyo valor de referencia estaba mal citado (la eficiencia de una aleta, el calor específico de Debye del cobre a 300 K, la temperatura de condensación de un experimento con rubidio): se reemplazaron por referencias verificables, nunca se aflojó la tolerancia para hacerlas pasar.</p>
<div class="box warn"><h4>Exactitud de los modelos</h4><p>Algunas comparaciones no buscan coincidencia exacta sino medir el error de un modelo: Peng–Robinson tiene 2–4 % de error en \(Z\) cerca del punto crítico y 10–20 % en el enfriamiento de Joule–Thomson; los calores específicos estadísticos (rotor rígido y osciladores armónicos) se desvían 1–3 % de NIST-JANAF a alta temperatura por la anarmonicidad; la temperatura de llama con disociación incluye solo CO, H₂ y O₂. Esas tolerancias están declaradas en la tabla.</p></div>
<div class="box warn"><h4>Lo que es ilustrativo</h4><p>Algunas simulaciones usan modelos simplificados y así lo dicen: el café que se enfría (coeficientes de convección y evaporación típicos), el consumo de la nevera (conductancias estimadas de un aparato de 300 L), los equipos de la gráfica de COP y de las tecnologías de cómputo (valores típicos u órdenes de magnitud), el balance de sudor del cuerpo humano y el modelo de una capa del efecto invernadero. Reproducen la física y los órdenes de magnitud, no un equipo o un clima específico.</p></div>
</section>
