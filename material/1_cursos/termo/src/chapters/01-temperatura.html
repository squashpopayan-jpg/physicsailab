<template class="chapter-src" data-id="temperatura" data-num="1" data-title="Sistemas, equilibrio y temperatura" data-part="Parte I · Fundamentos" data-short="Sistemas y fronteras, propiedades y estados, equilibrio, ley cero, termómetro de gas ideal, escalas de temperatura, ITS-90 y sensores reales: termistores y termopares">
<p class="lead">La termodinámica describe sistemas de miles de trillones de partículas con un puñado de números: presión, volumen, temperatura. Que eso funcione no es obvio; descansa en la idea de equilibrio y en un principio tan básico que se formuló de último y se le llamó «ley cero». Este capítulo fija el vocabulario del curso y construye la temperatura desde cero, hasta los sensores que se usan en el laboratorio.</p>

<section>
<h2>Sistema, frontera y alrededores</h2>
<p>Un <span class="term">sistema</span> es la porción del universo que elegimos estudiar; lo separa de los <span class="term">alrededores</span> una <span class="term">frontera</span>, real o imaginaria, fija o móvil. Según lo que la frontera deja pasar, el sistema es:</p>
<ul>
<li><b>aislado</b>: no intercambia ni materia ni energía (un termo ideal);</li>
<li><b>cerrado</b> o <b>masa de control</b>: intercambia energía pero no materia (el gas en un cilindro con pistón);</li>
<li><b>abierto</b> o <b>volumen de control</b>: lo atraviesa materia (una turbina, una tobera, el cuerpo humano).</li>
</ul>
<p>Una pared <span class="term">adiabática</span> impide el paso de calor; una <span class="term">diatérmica</span> lo permite. La elección del sistema es la primera decisión de cualquier problema y la que más errores evita: el mismo fenómeno se describe con calor en una elección y con trabajo en otra.</p>
<h3>Propiedades y estado</h3>
<p>Una <span class="term">propiedad</span> es cualquier magnitud medible del sistema en un instante: \(P\), \(V\), \(T\), la masa, la energía interna. Las propiedades <span class="term">extensivas</span> son proporcionales a la cantidad de materia (\(V\), \(U\), \(S\)); las <span class="term">intensivas</span>, no (\(P\), \(T\), \(\rho\)). El cociente de una extensiva entre la masa es una propiedad <span class="term">específica</span>, que se escribe en minúscula: \(v=V/m\), \(u=U/m\).</p>
<p>El <span class="term">estado</span> es el conjunto de valores de todas las propiedades. Para una sustancia pura simple compresible, el <b>postulado de estado</b> dice que dos propiedades intensivas independientes bastan para fijar todas las demás. Una relación entre ellas, como \(Pv=RT\), es una <span class="term">ecuación de estado</span>.</p>
<p>Las propiedades solo están bien definidas en <span class="term">equilibrio</span>: cuando no hay gradientes que impulsen cambios (equilibrio mecánico, térmico, de fases y químico). Un <span class="term">proceso cuasiestático</span> pasa por una sucesión de estados de equilibrio, lo bastante lento para que el sistema se reacomode en cada paso; solo esos procesos se dibujan como curvas en un diagrama \(P\)–\(v\).</p>
</section>

<section>
<h2>La ley cero y la temperatura</h2>
<p>Si dos cuerpos se ponen en contacto a través de una pared diatérmica, sus propiedades cambian hasta que dejan de hacerlo: alcanzan el <span class="term">equilibrio térmico</span>. La experiencia muestra algo que no se deduce de nada más:</p>
<div class="eq key" data-name="Ley cero">\[\text{Si }A\sim C\ \text{y}\ B\sim C\ \Longrightarrow\ A\sim B.\]</div>
<p>Dos sistemas en equilibrio térmico con un tercero lo están entre sí. La relación «estar en equilibrio térmico» es transitiva, y por eso existe una propiedad que toma el mismo valor en todos los sistemas mutuamente en equilibrio: la <span class="term">temperatura</span>. El tercer sistema \(C\) es el termómetro. Fowler la bautizó «ley cero» en 1939, cuando la primera y la segunda ya tenían nombre.</p>
<p>La rapidez con que dos cuerpos llegan al equilibrio depende de sus capacidades caloríficas \(C_1,C_2\) y de la conductancia \(G\) del contacto. Si \(G\) es constante, la diferencia de temperaturas decae exponencialmente:</p>
<div class="eq">\[T_1-T_2=(T_{1,0}-T_{2,0})\,\ee^{-t/\tau},\qquad \tau=\frac{C_1C_2}{G\,(C_1+C_2)},\qquad T_f=\frac{C_1T_{1,0}+C_2T_{2,0}}{C_1+C_2}.\]</div>
<div class="sim" data-sim="contacto-termico" data-title="Dos cuerpos en contacto: la llegada al equilibrio"></div>
<div class="sim-guide"><ul>
<li>La temperatura final es la media ponderada por las capacidades caloríficas: un termómetro pequeño (\(C\) baja) casi no perturba al sistema que mide.</li>
<li>Duplique la conductancia: \(\tau\) se reduce a la mitad, pero la temperatura final no cambia. El equilibrio no depende del camino.</li>
<li>Con un termómetro de \(C\) comparable a la del sistema, la lectura se aleja de la temperatura original: es el error de inserción.</li>
</ul></div>
</section>

<section>
<h2>El termómetro de gas ideal</h2>
<p>Cualquier propiedad que varíe con la temperatura sirve de termómetro (la longitud de una columna de mercurio, la resistencia de un hilo de platino), pero cada una define su propia escala, y las escalas no coinciden entre los puntos de calibración. Hace falta un termómetro cuya lectura no dependa de la sustancia.</p>
<p>El <span class="term">termómetro de gas a volumen constante</span> lo logra. Se llena un bulbo con un gas, se mide su presión \(P_{tp}\) en el punto triple del agua y su presión \(P\) en el sistema, y se define</p>
<div class="eq key" data-name="Temperatura del gas ideal">\[T=273.16\ \text{K}\times\lim_{P_{tp}\to0}\frac{P}{P_{tp}}.\]</div>
<p>A presión finita, cada gas da una lectura distinta porque sus moléculas interactúan; su ecuación de estado es \(Pv=RT\,(1+B(T)/v+\dots)\), con un <span class="term">segundo coeficiente virial</span> \(B(T)\) propio. Pero al vaciar el bulbo (\(P_{tp}\to0\)) todas las lecturas convergen al mismo valor. Esa es la <b>escala del gas ideal</b>; el capítulo 10 demostrará que coincide con la escala termodinámica de Kelvin, definida sin referencia a ninguna sustancia.</p>
<div class="sim" data-sim="termometro-gas" data-title="Termómetro de gas a volumen constante: la extrapolación a presión cero"></div>
<div class="sim-guide"><ul>
<li>Las lecturas con nitrógeno, argón, dióxido de carbono e hidrógeno difieren a presión alta, pero las rectas convergen a 373.12 K al extrapolar a \(P_{tp}=0\): la temperatura de ebullición del agua a 1 atm.</li>
<li>El hidrógeno casi no se desvía: su \(B(T)\) es pequeño. El CO₂, con atracciones intensas, se desvía mucho. Los coeficientes provienen de la ecuación de van der Waals, que da el signo y el orden de magnitud correctos.</li>
<li>Note que la pendiente es proporcional a \(B(T_{\text{medida}})-B(273.16)\): por eso un gas más «ideal» no necesita una extrapolación tan larga.</li>
</ul></div>
<div class="box note"><h4>El kelvin desde 2019</h4><p>Hasta 2019 el kelvin se definía fijando la temperatura del punto triple del agua en 273.16 K exactos. El SI revisado fija en cambio la constante de Boltzmann: \(k_B=1.380\,649\times10^{-23}\) J/K exactamente. El punto triple pasó a ser una medición (273.1600 K con incertidumbre de 0.1 mK). En la práctica nada cambió; en principio, la temperatura quedó atada a la energía de las moléculas.</p></div>
</section>

<section>
<h2>Escalas de temperatura</h2>
<p>La escala Celsius se define hoy a partir de la kelvin, \(t/{}^\circ\text{C}=T/\text{K}-273.15\). Con la revisión de la escala, el agua ya no hierve exactamente a 100 °C a 1 atm sino a 99.97 °C. La escala Fahrenheit, todavía usada en Estados Unidos, y su versión absoluta, la Rankine, se relacionan por</p>
<div class="eq">\[t_F=\tfrac95t_C+32,\qquad T_R=\tfrac95T_K=t_F+459.67.\]</div>
<p>Un intervalo de 1 K es igual a uno de 1 °C; uno de 1 °F es igual a uno de 1 R y vale 5/9 K. Las ecuaciones que contienen \(T\) en un cociente o en una exponencial (gas ideal, Carnot, Arrhenius) exigen <b>temperatura absoluta</b>; las que solo contienen diferencias (\(Q=mc\,\Delta T\)) admiten cualquiera de las dos.</p>
<p>En los laboratorios de metrología se usa la <b>Escala Internacional de Temperatura de 1990 (ITS-90)</b>, que define la temperatura por puntos fijos (puntos triples, de fusión y de solidificación de sustancias puras) e instrumentos de interpolación: termómetros de resistencia de platino entre 13.8 K y 961.78 °C, y pirómetros de radiación por encima.</p>

<section>
<h2>Sensores reales: termistores y termopares</h2>
<p>En el laboratorio y en la industria la temperatura se mide con sensores eléctricos. Un <span class="term">termistor NTC</span> es un semiconductor cerámico cuya resistencia cae de forma casi exponencial al calentarse, porque aumenta el número de portadores activados térmicamente. Su curva se describe con la ecuación de Steinhart y Hart (1968):</p>
<div class="eq key" data-name="Ecuación de Steinhart–Hart">\[\frac1T=A+B\ln R+C(\ln R)^3,\]</div>
<p>o, en un intervalo estrecho, con el modelo de parámetro \(\beta\): \(R=R_0\,\ee^{\beta(1/T-1/T_0)}\). Un termistor comercial de 10 kΩ (\(\beta_{25/85}=3977\) K) cambia su resistencia un 4.5 % por grado a 25 °C, diez veces más que un termómetro de platino.</p>
<p>Un <span class="term">termopar</span> son dos alambres de metales distintos unidos en un extremo. Por el efecto Seebeck (capítulo 23) aparece una tensión que depende de la diferencia de temperaturas entre la unión caliente y la de referencia, unos 41 µV/K en el tipo K (cromel–alumel). Es robusto, barato y llega a 1250 °C, pero exige compensar la unión fría.</p>
<div class="sim" data-sim="termistor" data-title="Termistor NTC en un divisor de tensión leído por un microcontrolador"></div>
<div class="sim-guide"><ul>
<li>El divisor con resistencia fija de 10 kΩ convierte la resistencia en tensión; el convertidor analógico-digital de 10 o 12 bits la cuantiza. La resolución en temperatura es mejor cerca de 25 °C, donde \(R_{NTC}\approx R_{fija}\).</li>
<li>Compare el modelo \(\beta\) (calibrado en 0 y 25 °C) con la curva de Steinhart–Hart del fabricante: a 50 °C difieren 0.6 °C; a 100 °C, más de 3 °C.</li>
<li>Es el montaje de las prácticas con ESP32 y Arduino: el programa invierte la ecuación para mostrar la temperatura.</li>
</ul></div>
<div class="box ex"><h4>Calibrar un termistor con dos puntos</h4>
<p>Un termistor mide 32.65 kΩ en agua con hielo (0 °C) y 10.00 kΩ a 25 °C. Halle \(\beta\) y prediga su resistencia en agua hirviendo en Popayán (94.1 °C).</p>
<details><summary>Solución</summary><p>\(\beta=\ln(R_1/R_2)/(1/T_1-1/T_2)=\ln(3.265)/(1/273.15-1/298.15)=1.1833/3.0697\times10^{-4}=3855\) K. A 367.25 K: \(R=10\,\ee^{3855(1/367.25-1/298.15)}=10\,\ee^{-2.433}=0.878\) kΩ. La curva de Steinhart–Hart del fabricante (\(A=1.1291\times10^{-3}\), \(B=2.3412\times10^{-4}\), \(C=8.769\times10^{-8}\)) da 0.808 kΩ. Si el programa usara el modelo \(\beta\) para convertir esa resistencia, leería 97.0 °C: casi 3 °C de error lejos de los puntos de calibración. Por eso conviene calibrar en tres puntos que cubran el intervalo de uso.</p></details>
</div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Clasifique como abierto, cerrado o aislado: una olla a presión con la válvula cerrada, una olla con la válvula silbando, una nevera desconectada y bien cerrada, un ser humano.
<details><summary>Respuesta</summary><p>Cerrado; abierto; casi aislado (intercambia calor lentamente, luego cerrado); abierto.</p></details></li>
<li><span class="lvl">Básico</span>La temperatura normal del cuerpo es 37.0 °C. Exprésela en K, °F y R.
<details><summary>Respuesta</summary><p>310.15 K, 98.6 °F, 558.27 R.</p></details></li>
<li><span class="lvl">Intermedio</span>Un termómetro de 5 g de vidrio (\(c=0.84\) J/g·K) a 20 °C se sumerge en 10 g de agua a 60 °C. ¿Qué lee al equilibrio, sin pérdidas?
<details><summary>Respuesta</summary><p>\(C_1=4.2\) J/K, \(C_2=41.86\) J/K; \(T_f=(4.2\cdot20+41.86\cdot60)/46.06=56.4\) °C. El termómetro introdujo un error de 3.6 °C.</p></details></li>
<li><span class="lvl">Intermedio</span>Un termómetro de gas a volumen constante marca \(P_{tp}=80.00\) kPa en el punto triple y 109.32 kPa en un baño. Con \(P_{tp}=40.00\) kPa marca 54.67 kPa. Estime la temperatura del baño en la escala del gas ideal.
<details><summary>Respuesta</summary><p>Lecturas: \(273.16\cdot109.32/80=373.27\) K y \(273.16\cdot54.67/40=373.34\) K. Extrapolando linealmente a \(P_{tp}=0\): \(373.34+(373.34-373.27)=373.41\) K.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que para un gas con \(Pv=RT(1+B/v)\) la lectura del termómetro de volumen constante es, a primer orden, \(T^*=T\,[1+(B(T)-B(T_{tp}))P_{tp}/(RT_{tp})]\).
<details><summary>Respuesta</summary><p>\(P/P_{tp}=(T/T_{tp})(1+B/v)/(1+B_{tp}/v)\approx(T/T_{tp})(1+(B-B_{tp})/v)\) y \(1/v\approx P_{tp}/(RT_{tp})\). Multiplicando por 273.16 K se obtiene el resultado: la lectura es lineal en \(P_{tp}\) y la pendiente es proporcional a \(B(T)-B(T_{tp})\).</p></details></li>
</ol>
