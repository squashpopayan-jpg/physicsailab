<template class="chapter-src" data-id="transferencia" data-num="9" data-title="Mecanismos de transferencia de calor" data-part="Parte II · Primera ley" data-short="Conducción y ley de Fourier, resistencias térmicas y paredes compuestas, convección y ley de enfriamiento de Newton, el café que se enfría, aletas y disipadores, radiación de cuerpo negro y gris, e inercia térmica de muros">
<p class="lead">La termodinámica dice cuánta energía hay que transferir; la transferencia de calor dice con qué rapidez. Una pared, una taza de café, el disipador de un procesador y el cuerpo humano obedecen las mismas tres leyes: la de Fourier para la conducción, la de Newton para la convección y la de Stefan–Boltzmann para la radiación. Este capítulo las presenta con el detalle suficiente para resolver problemas de ingeniería y de la vida diaria.</p>

<section>
<h2>Conducción: la ley de Fourier</h2>
<p>En un sólido o un fluido en reposo, el calor fluye de las regiones calientes a las frías en proporción al gradiente de temperatura. Fourier (1822) lo escribió como</p>
<div class="eq key" data-name="Ley de Fourier">\[\vb q=-k\,\grad T,\qquad \dot Q=-kA\,\frac{\dd T}{\dd x}.\]</div>
<p>La <span class="term">conductividad térmica</span> \(k\) va de 0.026 W/m·K (aire quieto) a 400 W/m·K (cobre) y 2000 W/m·K (diamante). Los buenos aislantes (lana de vidrio, poliestireno expandido, plumas) son casi todo aire atrapado en celdas pequeñas que impiden la convección.</p>
<p>En una pared plana en régimen estacionario, \(\dot Q=kA\Delta T/L\). La analogía con la ley de Ohm es exacta: la diferencia de temperatura es el voltaje, el flujo de calor la corriente, y la pared tiene una <span class="term">resistencia térmica</span> \(R=L/kA\). Las resistencias en serie se suman; también las de convección en cada cara, \(R=1/hA\):</p>
<div class="eq key" data-name="Pared compuesta">\[\dot Q=\frac{T_{\infty,1}-T_{\infty,2}}{R_{total}},\qquad R_{total}=\frac1{h_1A}+\sum_i\frac{L_i}{k_iA}+\frac1{h_2A},\qquad U=\frac1{R_{total}A}.\]</div>
<p>El coeficiente global \(U\) (W/m²·K) es el número con el que se califican muros, techos y ventanas. Un muro de ladrillo macizo de 12 cm con revoque tiene \(U\approx2.7\); con 5 cm de poliestireno, 0.56: casi cinco veces menos pérdidas.</p>
<div class="sim" data-sim="pared-compuesta" data-title="Pared compuesta: resistencias térmicas en serie"></div>
<div class="sim-guide"><ul>
<li>El perfil de temperatura es una recta por capa; su pendiente es inversamente proporcional a \(k\). Las capas aislantes concentran casi toda la caída de temperatura.</li>
<li>Las resistencias superficiales (\(1/h\)) siguen la norma ISO 6946: 0.13 m²·K/W en el interior y 0.04 en el exterior.</li>
<li>La temperatura de la cara interior decide si hay condensación: si baja del punto de rocío del aire de la habitación (capítulo 17), aparece humedad y moho.</li>
</ul></div>
</section>

<section>
<h2>Convección: la ley de enfriamiento de Newton</h2>
<p>Entre una superficie y un fluido en movimiento el calor se transfiere por conducción en la capa límite y por el transporte del propio fluido. Newton propuso, y la ingeniería adoptó, una ley simple:</p>
<div class="eq key" data-name="Ley de enfriamiento de Newton">\[\dot Q=hA\,(T_s-T_\infty).\]</div>
<p>Toda la física queda en el <span class="term">coeficiente de convección</span> \(h\), que depende del fluido, de la geometría y del régimen de flujo: 2–25 W/m²·K en convección natural con aire, 25–250 con aire forzado, 100–20 000 con agua, y hasta 100 000 en ebullición y condensación. Se obtiene de correlaciones con números adimensionales; para una placa vertical en convección natural, por ejemplo, la de Churchill y Chu relaciona el número de Nusselt \(Nu=hL/k\) con el de Rayleigh, que mide la intensidad de la flotación.</p>
<p>Si un cuerpo es buen conductor comparado con la convección en su superficie (número de Biot \(Bi=hL_c/k&lt;0.1\)), su temperatura es casi uniforme y se enfría exponencialmente, \(T-T_\infty=(T_0-T_\infty)\ee^{-t/\tau}\), con \(\tau=mc/hA\). Es el <span class="term">modelo de parámetros concentrados</span>.</p>
<div class="sim" data-sim="cafe" data-title="Una taza de café que se enfría: convección, radiación y evaporación"></div>
<div class="sim-guide"><ul>
<li>El modelo suma tres pérdidas por la superficie abierta y la pared de la taza: convección natural, radiación (\(\varepsilon=0.95\)) y evaporación. Con la tapa puesta, la evaporación desaparece.</li>
<li>Al principio la evaporación es la pérdida dominante: crece casi exponencialmente con la temperatura porque depende de la presión de vapor. Por eso el café sin tapa no sigue la ley de Newton: se enfría más rápido al comienzo.</li>
<li>Los coeficientes son estimaciones típicas (convección natural, analogía de Lewis para la evaporación); el modelo da unos 12 min para bajar de 85 °C a 60 °C con la taza abierta en Popayán, dentro del intervalo de las mediciones caseras con tazas de cerámica (10 a 25 min, según la taza y las corrientes de aire). A mayor altitud el aire es menos denso y el vapor se difunde más rápido: el café se enfría algo antes.</li>
<li>¿Leche antes o después? Si se agrega la leche fría al principio, el café queda más frío durante la espera y pierde menos calor: llega más caliente al final.</li>
</ul></div>
</section>

<section>
<h2>Aletas y disipadores</h2>
<p>Para aumentar la transferencia de calor desde una superficie se le agregan <span class="term">aletas</span>: más área expuesta al fluido. Pero la aleta no está toda a la temperatura de la base; se enfría a lo largo. Para una aleta de sección constante con extremo aislado,</p>
<div class="eq">\[\frac{T(x)-T_\infty}{T_b-T_\infty}=\frac{\cosh m(L-x)}{\cosh mL},\qquad m=\sqrt{\frac{hP}{kA_c}},\qquad \eta_{aleta}=\frac{\tanh mL}{mL}.\]</div>
<p>La eficiencia de la aleta compara el calor que disipa con el que disiparía si estuviera toda a la temperatura de la base. Una aleta muy larga desperdicia material: más allá de \(mL\approx2\) casi no aporta. Por eso los disipadores de computadores usan aluminio o cobre (\(k\) alto), aletas delgadas y ventiladores (\(h\) alto).</p>
<div class="sim" data-sim="aleta" data-title="Perfil de temperatura y eficiencia de una aleta"></div>
<div class="sim-guide"><ul>
<li>Un pasador de aluminio de 5 mm de diámetro y 5 cm de largo, en aire quieto (\(h=15\)), tiene eficiencia 0.95: es casi isotérmico.</li>
<li>Cambie a acero inoxidable (\(k=16\)) o a un plástico: la eficiencia se desploma. Con ventilador (\(h=100\)) también cae, pero el calor total sube.</li>
</ul></div>
</section>

<section>
<h2>Radiación térmica</h2>
<p>Todo cuerpo por encima del cero absoluto emite ondas electromagnéticas por la agitación térmica de sus cargas. Un <span class="term">cuerpo negro</span>, que absorbe toda la radiación que le llega, emite el espectro de Planck (capítulo 22), cuyo máximo sigue la ley de desplazamiento de Wien y cuya potencia total sigue la de Stefan–Boltzmann:</p>
<div class="eq key" data-name="Radiación de cuerpo negro">\[\lambda_{max}T=2897.8\ \mu\text{m·K},\qquad E_b=\sigma T^4,\quad \sigma=5.670\times10^{-8}\ \text{W/m}^2\text{K}^4.\]</div>
<p>El Sol (5772 K) emite con máximo en 502 nm, en el verde, y el 37 % de su energía cae en el visible. Un bombillo incandescente (2800 K) tiene el máximo en 1.03 µm, en el infrarrojo: solo el 6 % de su emisión es luz visible. El cuerpo humano (34 °C en la piel) emite con máximo en 9.4 µm, el infrarrojo que ven las cámaras térmicas.</p>
<p>Las superficies reales emiten una fracción \(\varepsilon\) (emisividad) del cuerpo negro. Un cuerpo pequeño de área \(A\) dentro de un recinto grande a \(T_{alr}\) intercambia</p>
<div class="eq">\[\dot Q_{rad}=\varepsilon\sigma A\left(T_s^4-T_{alr}^4\right).\]</div>
<p>Una persona desnuda con la piel a 34 °C en una habitación con paredes a 20 °C pierde unos 150 W por radiación y 100 W por convección: más que su metabolismo en reposo (unos 100 W). La ropa reduce la temperatura de la superficie expuesta y nos permite estar cómodos.</p>
<div class="sim" data-sim="radiacion" data-title="Espectro de Planck, ley de Wien y radiación de superficies"></div>
<div class="sim-guide"><ul>
<li>Arrastre la temperatura del cuerpo humano al Sol: el máximo se corre a longitudes de onda cortas y la potencia crece como \(T^4\) (cinco órdenes de magnitud).</li>
<li>La banda sombreada es el visible (0.4–0.7 µm): la fracción visible de un bombillo de 2800 K es de apenas 6 %, la de un LED blanco no se describe con Planck.</li>
</ul></div>
</section>

<section>
<h2>Inercia térmica: muros que retrasan el calor</h2>
<p>En régimen transitorio la ecuación del calor es \(\partial T/\partial t=\alpha\,\partial^2T/\partial x^2\), con la <span class="term">difusividad</span> \(\alpha=k/\rho c\). Una variación periódica de temperatura en una cara penetra amortiguándose como \(\ee^{-x/\delta}\), con profundidad de penetración \(\delta=\sqrt{\alpha P/\pi}\) para un período \(P\). Para el ciclo diario en ladrillo o adobe, \(\delta\approx11\) cm.</p>
<p>Por eso los muros gruesos de adobe y bahareque de la arquitectura tradicional del Cauca mantienen el interior fresco de día y templado de noche: la onda térmica exterior llega al interior atenuada y con horas de retraso. Un muro liviano de panel de yeso, con poca masa, deja pasar la onda casi sin retraso.</p>
<div class="sim" data-sim="muro-diario" data-title="Ciclo diario de temperatura a través de un muro"></div>
<div class="sim-guide"><ul>
<li>La temperatura exterior oscila ±8 °C alrededor de 18 °C (un día típico de Popayán, con sol). El simulador resuelve la ecuación del calor en el muro con diferencias finitas.</li>
<li>Con 30 cm de adobe, la oscilación en la cara interior es una fracción pequeña de la exterior y llega con unas 8–10 horas de retraso. Con panel de yeso, casi sin retraso.</li>
<li>El aislamiento reduce el flujo medio; la masa térmica amortigua las oscilaciones. Son dos virtudes distintas.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una ventana de vidrio de 1.5 m² y 4 mm (\(k=0.96\)) separa 20 °C interiores de 10 °C exteriores. Con \(h_i=8\) y \(h_e=25\) W/m²·K, halle la pérdida de calor.
<details><summary>Respuesta</summary><p>\(R''=0.125+0.0042+0.04=0.169\) m²·K/W; \(\dot Q=1.5\times10/0.169=88.7\) W. Casi toda la resistencia está en las películas de aire.</p></details></li>
<li><span class="lvl">Básico</span>¿A qué longitud de onda emite con máximo un horno a 1000 °C?
<details><summary>Respuesta</summary><p>\(2897.8/1273=2.28\) µm.</p></details></li>
<li><span class="lvl">Intermedio</span>Una esfera de acero de 2 cm de diámetro (\(\rho=7850\), \(c=460\), \(k=45\)) a 300 °C se enfría en aire a 25 °C con \(h=20\). Compruebe que vale el modelo concentrado y halle el tiempo para llegar a 100 °C.
<details><summary>Respuesta</summary><p>\(L_c=V/A=r/3=3.33\) mm, \(Bi=0.0015\). \(\tau=\rho cL_c/h=602\) s; \(t=\tau\ln(275/75)=782\) s ≈ 13 min.</p></details></li>
<li><span class="lvl">Intermedio</span>Compare la pérdida por radiación de un radiador negro (\(\varepsilon=0.95\)) y de uno de aluminio pulido (\(\varepsilon=0.05\)), ambos de 1 m² a 60 °C en una sala a 20 °C.
<details><summary>Respuesta</summary><p>\(\sigma(333^4-293^4)=280\) W/m²: 266 W frente a 14 W. Los «radiadores» calientan sobre todo por convección, pero la pintura importa.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que para una aleta infinitamente larga \(\dot Q=\sqrt{hPkA_c}\,(T_b-T_\infty)\) y discuta cuándo la aproximación es buena.
<details><summary>Respuesta</summary><p>Con \(L\to\infty\), \(T-T_\infty\propto\ee^{-mx}\) y \(\dot Q=-kA_c\,\dd T/\dd x|_0=kA_cm(T_b-T_\infty)\). Basta \(mL>2.65\) para que \(\tanh mL>0.99\).</p></details></li>
</ol>
