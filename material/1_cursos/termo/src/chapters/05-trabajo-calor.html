<p class="lead">Hasta mediados del siglo XIX se pensaba que el calor era un fluido, el «calórico», que pasaba de los cuerpos calientes a los fríos y se conservaba. Joule demostró con paletas, pesas y un termómetro muy fino que el trabajo mecánico produce calor en una proporción fija. Desde entonces calor y trabajo son dos maneras de transferir una misma cosa: energía. Este capítulo define ambas con precisión y prepara el balance de energía de la primera ley.</p>

<section>
<h2>Formas de energía</h2>
<p>La energía total de un sistema se divide en la que depende de su movimiento y posición como un todo (energía cinética \(\tfrac12mV^2\) y potencial \(mgz\)) y la que depende de su estado interno, la <span class="term">energía interna</span> \(U\): la suma de las energías cinéticas de traslación, rotación y vibración de las moléculas, de sus interacciones, de los enlaces químicos y de los núcleos.</p>
<div class="eq">\[E=U+\tfrac12mV^2+mgz.\]</div>
<p>La termodinámica no necesita saber cómo se reparte \(U\) entre esas contribuciones; solo necesita que sea una <b>propiedad</b>: que dependa del estado y no de la historia. Pero el reparto explica los números: calentar 1 kg de agua 1 K cuesta 4.18 kJ; evaporarlo, 2257 kJ, porque hay que romper sus puentes de hidrógeno; y quemar 1 kg de metano libera 50 000 kJ de energía química.</p>
<p>Calor y trabajo, en cambio, <b>no son propiedades</b>. Son energía en tránsito a través de la frontera, y solo existen durante un proceso. Un sistema no «tiene» calor ni trabajo; tiene energía. Por eso sus diferenciales se escriben \(\delta Q\) y \(\delta W\) (inexactas): su integral depende del camino.</p>
</section>

<section>
<h2>El trabajo de frontera</h2>
<p>Cuando un gas empuja un pistón de área \(A\) una distancia \(\dd x\), realiza un trabajo \(\delta W=F\,\dd x=PA\,\dd x=P\,\dd V\). En un proceso cuasiestático en que la presión está definida en todo momento,</p>
<div class="eq key" data-name="Trabajo de frontera">\[W_b=\int_1^2P\,\dd V,\]</div>
<p>el área bajo la curva del proceso en el diagrama \(P\)–\(V\). Con la convención de este curso (la de Clausius y la de la mayoría de textos de ingeniería), \(W>0\) cuando el sistema entrega trabajo (expansión) y \(Q>0\) cuando el sistema recibe calor.</p>
<p>Como el área depende de la curva, el trabajo entre los mismos estados inicial y final depende del camino. Para un gas ideal, los procesos más comunes dan:</p>
<div class="tablewrap"><table>
<tr><th>Proceso</th><th class="c">Condición</th><th class="c">\(W_b\)</th></tr>
<tr><td>Isocórico</td><td class="c">\(V=\text{cte}\)</td><td class="c">\(0\)</td></tr>
<tr><td>Isobárico</td><td class="c">\(P=\text{cte}\)</td><td class="c">\(P(V_2-V_1)\)</td></tr>
<tr><td>Isotérmico (gas ideal)</td><td class="c">\(PV=\text{cte}\)</td><td class="c">\(P_1V_1\ln(V_2/V_1)\)</td></tr>
<tr><td>Politrópico, \(n\ne1\)</td><td class="c">\(PV^n=\text{cte}\)</td><td class="c">\((P_2V_2-P_1V_1)/(1-n)\)</td></tr>
</table></div>
<div class="sim" data-sim="trabajo-pv" data-title="El trabajo depende del camino: tres procesos entre los mismos estados"></div>
<div class="sim-guide"><ul>
<li>Aire en un cilindro pasa de 0.1 m³ y 400 kPa a 0.4 m³ y 100 kPa (la misma temperatura final). Por el camino isotérmico el gas entrega 55.5 kJ; subiendo primero por la isóbara, 120 kJ; bajando primero por la isócora, 30 kJ.</li>
<li>El cambio de energía interna es el mismo (cero, porque \(T_2=T_1\) y el gas es ideal), así que el calor recibido tiene que ser distinto en cada camino: \(Q=W\). Es la primera ley, que el capítulo 6 formaliza.</li>
<li>Recorra el ciclo completo: el área encerrada es el trabajo neto del ciclo, la base de toda máquina térmica.</li>
</ul></div>
<h3>Otras formas de trabajo</h3>
<p>Todo trabajo es el producto de una «fuerza generalizada» por el cambio de un «desplazamiento generalizado»:</p>
<ul>
<li><b>de eje</b>: \(W=\int T_{par}\,\dd\theta=2\pi nT_{par}\) para \(n\) revoluciones;</li>
<li><b>eléctrico</b>: \(W=\int VI\,\dd t\); una resistencia dentro de un sistema recibe trabajo eléctrico, no calor;</li>
<li><b>de un resorte</b>: \(W=\tfrac12k(x_2^2-x_1^2)\);</li>
<li><b>de tensión superficial</b>: \(\delta W=-\sigma\,\dd A\); <b>magnético</b>: \(\delta W=-\mu_0H\,\dd(VM)\); <b>de una barra elástica</b>: \(\delta W=-F\,\dd L\).</li>
</ul>
</section>

<section>
<h2>El calor y el experimento de Joule</h2>
<p>El <span class="term">calor</span> es la energía que cruza la frontera debido a una diferencia de temperatura. Se transfiere por conducción, convección y radiación (capítulo 9). Un proceso sin calor es <span class="term">adiabático</span>; no hay que confundirlo con isotérmico: en una compresión adiabática la temperatura sube.</p>
<p>Entre 1843 y 1850 James Prescott Joule midió cuánto trabajo mecánico hace falta para calentar una cantidad de agua. Unas pesas que caían hacían girar unas paletas dentro de un recipiente aislado; la fricción viscosa calentaba el agua unas décimas de grado, que Joule medía con termómetros graduados a 1/200 °F. Su resultado de 1850, 772 pie·libra por BTU, equivale a 4.16 J/cal, menos del 1 % del valor moderno:</p>
<div class="eq key" data-name="Equivalente mecánico del calor">\[1\ \text{cal}_{th}=4.184\ \text{J}.\]</div>
<p>El experimento demostró que el calor no se conserva por sí solo: se crea a partir del trabajo. Lo que se conserva es la energía.</p>
<div class="sim" data-sim="joule-paletas" data-title="El experimento de las paletas de Joule"></div>
<div class="sim-guide"><ul>
<li>Dos pesas de 15 kg que caen 2 m, veinte veces, calientan 6 kg de agua en 0.47 K. Joule necesitaba esa precisión: el calentamiento es pequeño porque el agua tiene una capacidad calorífica enorme.</li>
<li>Agregue pérdidas de calor hacia el ambiente: la temperatura aparente sube menos y el «equivalente» medido sale mayor. Joule corregía ese efecto alternando corridas con el agua más fría y más caliente que el ambiente.</li>
</ul></div>
</section>

<section>
<h2>Calores específicos, calores latentes y calorimetría</h2>
<p>El <span class="term">calor específico</span> es la energía necesaria para elevar un grado la temperatura de un kilogramo. Depende del proceso: a volumen constante, \(c_v=(\partial u/\partial T)_v\); a presión constante, \(c_p=(\partial h/\partial T)_P\) (capítulo 6). Para sólidos y líquidos, casi incompresibles, \(c_p\approx c_v=c\), y</p>
<div class="eq">\[Q=mc\,\Delta T\qquad\text{(sin cambio de fase)},\qquad Q=mh_{sf}\ \text{(fusión)},\qquad Q=mh_{fg}\ \text{(evaporación)}.\]</div>
<div class="tablewrap"><table>
<tr><th>Sustancia</th><th class="c">\(c\) (kJ/kg·K)</th><th>Sustancia</th><th class="c">\(c\) (kJ/kg·K)</th></tr>
<tr><td>Agua líquida (25 °C)</td><td class="c">4.18</td><td>Aluminio</td><td class="c">0.90</td></tr>
<tr><td>Hielo (−10 °C)</td><td class="c">2.05</td><td>Hierro</td><td class="c">0.45</td></tr>
<tr><td>Vapor de agua (1 atm, 110 °C)</td><td class="c">2.04</td><td>Cobre</td><td class="c">0.385</td></tr>
<tr><td>Aceite de cocina</td><td class="c">≈ 2.0</td><td>Vidrio</td><td class="c">0.84</td></tr>
<tr><td>Aire (\(c_p\))</td><td class="c">1.005</td><td>Concreto</td><td class="c">0.88</td></tr>
</table></div>
<p>Calor latente de fusión del hielo: 333.6 kJ/kg. El agua tiene uno de los calores específicos más altos de todas las sustancias: por eso modera el clima de las costas y es el refrigerante de los motores.</p>
<p>La <span class="term">calorimetría</span> usa un recipiente aislado: la energía que pierden unos cuerpos la ganan otros, \(\sum_im_ic_i(T_f-T_i)+\sum(\text{calores latentes})=0\). Si hay hielo, hay que comprobar primero si se funde todo.</p>
<div class="sim" data-sim="calorimetro" data-title="Calorímetro de mezclas: metal, agua y hielo"></div>
<div class="sim-guide"><ul>
<li>200 g de aluminio a 100 °C en 500 g de agua a 20 °C, dentro de un vaso de cobre de 100 g: el equilibrio llega a 26.2 °C.</li>
<li>Añada hielo: si el agua no tiene energía suficiente para fundirlo todo, el estado final es una mezcla a 0 °C y el simulador reporta cuánto hielo queda.</li>
<li>Invierta el problema: con la temperatura final medida se despeja el calor específico de un metal desconocido, el método de las prácticas de laboratorio.</li>
</ul></div>
<div class="sim" data-sim="curva-calentamiento" data-title="Curva de calentamiento del agua en Popayán: de hielo a vapor"></div>
<div class="sim-guide"><ul>
<li>Las mesetas son los cambios de fase: la energía entra pero la temperatura no sube. La de evaporación es casi siete veces más larga que la de fusión.</li>
<li>En Popayán la meseta de ebullición queda en 94.1 °C. Aumente la altitud a la de Bogotá: la curva cambia poco, pero la meseta baja a 91 °C.</li>
<li>De los 3092 kJ que cuesta llevar 1 kg de hielo a −20 °C hasta vapor a 120 °C, el 73 % se gasta en evaporar.</li>
</ul></div>
<div class="box ex"><h4>Hielo en un vaso de agua</h4>
<p>Se echan 50 g de hielo a −10 °C en 300 g de agua a 25 °C. ¿Cuál es la temperatura final si el vaso no intercambia calor?</p>
<details><summary>Solución</summary><p>Calor disponible al enfriar el agua hasta 0 °C: \(0.3(4.186)(25)=31.4\) kJ. Calor para llevar el hielo a 0 °C y fundirlo: \(0.05(2.09)(10)+0.05(333.6)=17.7\) kJ. Sobra energía: todo se funde. Balance: \(0.3(4.186)(T_f-25)+17.7+0.05(4.186)T_f=0\Rightarrow T_f=9.3\) °C.</p></details>
</div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un gas se expande a presión constante de 200 kPa de 0.05 a 0.12 m³. ¿Cuánto trabajo realiza?
<details><summary>Respuesta</summary><p>14 kJ.</p></details></li>
<li><span class="lvl">Básico</span>Un hervidor eléctrico de 1500 W calienta 1 L de agua de 18 °C a ebullición en Popayán. ¿Cuánto tarda, sin pérdidas?
<details><summary>Respuesta</summary><p>\(Q=0.997(4.18)(76.1)=317\) kJ; \(t=211\) s ≈ 3.5 min.</p></details></li>
<li><span class="lvl">Intermedio</span>Un resorte (\(k=80\) kN/m) sostiene un pistón de 0.05 m². El gas se calienta y el pistón sube 0.2 m comprimiendo el resorte desde su longitud natural, contra una atmósfera de 82 kPa. ¿Cuánto trabajo hace el gas?
<details><summary>Respuesta</summary><p>Contra la atmósfera: \(82\,000(0.05)(0.2)=820\) J; sobre el resorte: \(\tfrac12(80\,000)(0.2)^2=1600\) J. Total 2.42 kJ (más el peso del pistón, si lo hay).</p></details></li>
<li><span class="lvl">Intermedio</span>Una muestra de 150 g de un metal a 98 °C se echa en 200 g de agua a 21 °C (calorímetro de capacidad despreciable). La temperatura final es 26.8 °C. Halle \(c\) e identifique el metal.
<details><summary>Respuesta</summary><p>\(c=0.2(4.186)(5.8)/(0.15\times71.2)=0.455\) kJ/kg·K: hierro o acero.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que el trabajo de un proceso politrópico \(PV^n=C\) es \((P_2V_2-P_1V_1)/(1-n)\) y que tiende a \(P_1V_1\ln(V_2/V_1)\) cuando \(n\to1\).
<details><summary>Respuesta</summary><p>\(\int CV^{-n}\dd V=C(V_2^{1-n}-V_1^{1-n})/(1-n)\). Con \(n=1+\epsilon\), \(V^{-\epsilon}\approx1-\epsilon\ln V\): el cociente tiende a \(C\ln(V_2/V_1)\).</p></details></li>
</ol>
