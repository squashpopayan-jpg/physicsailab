<p class="lead">Un cilindro de nitrógeno de 50 L cargado a 200 bar contiene 10.6 kg de gas; la ecuación del gas ideal predice 11.2 kg. Un cilindro de CO₂ a temperatura ambiente no contiene gas sino líquido. Para diseñar recipientes, gasoductos o procesos químicos hace falta saber cuándo el gas ideal deja de servir y con qué reemplazarlo. Este capítulo construye las ecuaciones de estado de los gases reales desde la idea física de van der Waals hasta las ecuaciones cúbicas que usa la industria.</p>

<section>
<h2>El factor de compresibilidad</h2>
<p>La desviación del comportamiento ideal se mide con el <span class="term">factor de compresibilidad</span></p>
<div class="eq key" data-name="Factor de compresibilidad">\[Z=\frac{Pv}{RT}=\frac{P\bar v}{\bar RT}.\]</div>
<p>\(Z=1\) para el gas ideal. \(Z<1\) indica que dominan las atracciones entre moléculas (el gas es más compresible que el ideal); \(Z>1\), que domina la repulsión de corto alcance (las moléculas ocupan volumen). A baja presión todo gas tiende a \(Z=1\). Para cuantificar la corrección se desarrolla \(Z\) en potencias de la densidad, el <span class="term">desarrollo virial</span>:</p>
<div class="eq">\[Z=1+\frac{B(T)}{\bar v}+\frac{C(T)}{\bar v^2}+\cdots\]</div>
<p>El segundo coeficiente virial \(B(T)\) es la corrección de primer orden y la mecánica estadística lo relaciona con el potencial entre pares de moléculas, \(B=-2\pi N_A\int_0^\infty\left(\ee^{-\phi(r)/k_BT}-1\right)r^2\,\dd r\). Es negativo a baja temperatura (dominan las atracciones) y positivo a alta (domina el núcleo repulsivo). La temperatura a la que se anula es la <span class="term">temperatura de Boyle</span>: allí el gas real se comporta como ideal en un amplio intervalo de presiones. Para el N₂ es 327 K; por eso el aire a temperatura ambiente es tan ideal.</p>
<div class="sim" data-sim="virial-b" data-title="El segundo coeficiente virial y la temperatura de Boyle"></div>
<div class="sim-guide"><ul>
<li>Los puntos son \(B(T)\) de las ecuaciones de referencia (Span–Wagner para N₂ y CO₂, Setzmann–Wagner para CH₄, Tegeler para Ar); la curva continua, la predicción de van der Waals \(B=b-a/RT\).</li>
<li>Van der Waals acierta el signo y la forma, pero ubica la temperatura de Boyle en \(27T_c/8\): 426 K para el N₂, 30 % por encima del valor real.</li>
<li>El CO₂ a 300 K tiene \(B=-121\) cm³/mol: a 1 atm su \(Z\) es 0.995, una desviación del 0.5 % que ya importa en metrología de gases.</li>
</ul></div>
</section>

<section>
<h2>La ecuación de van der Waals</h2>
<p>Van der Waals (1873) corrigió el gas ideal con dos ideas físicas. Las moléculas ocupan un volumen: el volumen disponible es \(\bar v-b\). Y se atraen: una molécula cerca de la pared es frenada por las del interior, y la presión que ejerce baja en una cantidad proporcional al cuadrado de la densidad, \(a/\bar v^2\):</p>
<div class="eq key" data-name="Ecuación de van der Waals">\[\left(P+\frac{a}{\bar v^2}\right)(\bar v-b)=\bar RT.\]</div>
<p>Sus isotermas tienen un rasgo notable: por debajo de cierta temperatura presentan un mínimo y un máximo. En el tramo entre ellos \((\partial P/\partial v)_T>0\): el fluido se comprimiría al bajar la presión, un estado mecánicamente inestable. Es la huella de la transición líquido–vapor. El punto donde el máximo y el mínimo se funden es el punto crítico, \((\partial P/\partial v)_T=(\partial^2P/\partial v^2)_T=0\), de donde</p>
<div class="eq">\[a=\frac{27\bar R^2T_c^2}{64P_c},\qquad b=\frac{\bar RT_c}{8P_c},\qquad Z_c=\frac{P_c\bar v_c}{\bar RT_c}=\frac38.\]</div>
<p>Escrita con variables reducidas \(P_r=P/P_c\), \(T_r=T/T_c\), \(v_r=v/v_c\), la ecuación queda sin parámetros del gas: \(P_r=8T_r/(3v_r-1)-3/v_r^2\).</p>
<h3>La construcción de Maxwell</h3>
<p>La isoterma de van der Waals no tiene meseta. Maxwell (1875) mostró dónde trazarla: el líquido y el vapor coexisten a la presión que hace iguales las dos áreas entre la isoterma y la recta horizontal. La razón es que ambas fases deben tener la misma energía de Gibbs, y \(g_g-g_f=\int v\,\dd P\) a lo largo de la isoterma (capítulo 16). Los estados entre la meseta y los extremos son <span class="term">metaestables</span>: el líquido sobrecalentado y el vapor sobresaturado, que existen de verdad en recipientes muy limpios (la cámara de burbujas, la cámara de niebla de Wilson).</p>
<div class="sim" data-sim="vdw-isotermas" data-title="Isotermas de van der Waals y construcción de Maxwell de áreas iguales"></div>
<div class="sim-guide"><ul>
<li>A \(T_r=0.9\) la presión de saturación de van der Waals es \(P_r=0.647\); la real del argón, del nitrógeno y del metano está entre 0.53 y 0.54. Van der Waals capta la física pero no los números.</li>
<li>La curva roja es la binodal (coexistencia); la punteada, la espinodal (límite de la metaestabilidad, donde \(\partial P/\partial v=0\)).</li>
<li>Por encima de \(T_r=1\) las isotermas son monótonas: no hay transición.</li>
</ul></div>
</section>

<section>
<h2>Estados correspondientes</h2>
<p>Si la ecuación reducida de van der Waals no depende del gas, todos los gases deberían tener el mismo \(Z\) a iguales \(P_r\) y \(T_r\). Es el <span class="term">principio de estados correspondientes</span>, y se cumple sorprendentemente bien para moléculas simples y casi esféricas: argón, nitrógeno, metano. La carta generalizada de compresibilidad de Nelson y Obert (1954) se basa en él y permite estimar \(Z\) de cualquier gas con solo \(T_c\) y \(P_c\), dentro de un 5 %.</p>
<p>Las moléculas alargadas o polares se desvían. Pitzer (1955) añadió un tercer parámetro, el <span class="term">factor acéntrico</span>, que mide cuánto baja la presión de vapor reducida a \(T_r=0.7\) respecto de la de los fluidos simples:</p>
<div class="eq">\[\omega=-\log_{10}\left(P_r^{sat}\right)_{T_r=0.7}-1.\]</div>
<p>Es ≈ 0 para el argón, 0.037 para el N₂, 0.224 para el CO₂ y 0.344 para el agua.</p>
<div class="sim" data-sim="carta-z" data-title="Carta generalizada de compresibilidad"></div>
<div class="sim-guide"><ul>
<li>Los puntos de Ar, N₂ y CH₄ (calculados con sus ecuaciones de referencia) caen casi encima a cada \(T_r\): estados correspondientes. Los del CO₂ se separan algunos por ciento, como predice su factor acéntrico.</li>
<li>Las curvas son Peng–Robinson con el \(\omega\) del gas elegido. Note el mínimo de \(Z\) cerca de \(P_r\approx2\) a \(T_r=1.1\): allí el gas es casi tan denso como un líquido.</li>
</ul></div>
</section>

<section>
<h2>Ecuaciones cúbicas modernas</h2>
<p>Van der Waals tiene la forma correcta, pero el término de atracción es demasiado simple. Redlich y Kwong (1949) y, sobre todo, Peng y Robinson (1976) lo mejoraron conservando una ecuación cúbica en \(\bar v\), que se resuelve con la fórmula de Cardano:</p>
<div class="eq key" data-name="Ecuación de Peng–Robinson">\[P=\frac{\bar RT}{\bar v-b}-\frac{a\,\alpha(T)}{\bar v^2+2b\bar v-b^2},\qquad \alpha=\left[1+\kappa\left(1-\sqrt{T_r}\right)\right]^2,\]</div>
<p>con \(a=0.45724\,\bar R^2T_c^2/P_c\), \(b=0.07780\,\bar RT_c/P_c\) y \(\kappa=0.37464+1.54226\omega-0.26992\omega^2\). La función \(\alpha(T)\) se ajustó para reproducir las presiones de vapor; por eso Peng–Robinson predice bien el equilibrio líquido–vapor de hidrocarburos y es la ecuación estándar en la industria del petróleo y el gas.</p>
<p>Cuando la ecuación tiene tres raíces reales, la menor corresponde al líquido y la mayor al vapor; la intermedia no tiene sentido físico.</p>
<div class="sim" data-sim="eos-compara" data-title="Cilindros de gas comprimido: cuatro ecuaciones de estado"></div>
<div class="sim-guide"><ul>
<li>Un cilindro de 50 L con 10.6 kg de N₂ a 27 °C está a 200 bar (dato de referencia). El gas ideal da 189 bar; Peng–Robinson, 194 bar.</li>
<li>Pase al CO₂ con 5 kg: a 20 °C las ecuaciones cúbicas encuentran dos raíces, líquido y vapor. El extintor real contiene líquido a la presión de saturación, 57.3 bar.</li>
<li>El gas natural vehicular (metano) se almacena a unos 200 bar: allí \(Z\approx0.80\) a 15 °C y el tanque guarda 25 % más gas que el que predice el modelo ideal.</li>
</ul></div>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule las constantes \(a\) y \(b\) de van der Waals del CO₂ (\(T_c=304.13\) K, \(P_c=7.377\) MPa).
<details><summary>Respuesta</summary><p>\(a=0.3657\) Pa·m⁶/mol², \(b=4.284\times10^{-5}\) m³/mol.</p></details></li>
<li><span class="lvl">Básico</span>Estime la temperatura de Boyle del metano con van der Waals y compárela con el valor real (≈ 510 K).
<details><summary>Respuesta</summary><p>\(27T_c/8=27(190.56)/8=643\) K; error de +26 %.</p></details></li>
<li><span class="lvl">Intermedio</span>Con la carta generalizada (\(Z\approx0.80\) para \(T_r=1.5\), \(P_r=3\)), estime la densidad del metano a 13.8 MPa y 286 K.
<details><summary>Respuesta</summary><p>\(T_r=286/190.56=1.50\), \(P_r=13.8/4.599=3.0\). \(\rho=P M/(ZRT)=13.8\times10^6\times0.016043/(0.79\times8.314\times286)=118\) kg/m³ (referencia: \(Z=0.787\)).</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que para van der Waals \(B(T)=b-a/\bar RT\).
<details><summary>Respuesta</summary><p>\(Z=\bar v/(\bar v-b)-a/(\bar R T\bar v)=1+b/\bar v+\dots-a/(\bar RT\bar v)\). El coeficiente de \(1/\bar v\) es \(b-a/\bar RT\).</p></details></li>
<li><span class="lvl">Avanzado</span>Deduzca \(Z_c=3/8\) para van der Waals a partir de las condiciones del punto crítico, y compárelo con los valores reales (0.29 para el argón, 0.27 para el CO₂, 0.23 para el agua).
<details><summary>Respuesta</summary><p>De \(\partial_vP=\partial_v^2P=0\) se obtiene \(\bar v_c=3b\), \(T_c=8a/27\bar Rb\), \(P_c=a/27b^2\); entonces \(Z_c=P_c\bar v_c/\bar RT_c=3/8=0.375\). Ningún fluido real lo alcanza: el modelo sobrestima el volumen crítico.</p></details></li>
</ol>
