<template class="chapter-src" data-id="primera-ley" data-num="6" data-title="Primera ley en sistemas cerrados" data-part="Parte II · Primera ley" data-short="Conservación de la energía en ciclos y procesos, energía interna y entalpía como propiedades, calores específicos de gases ideales, sólidos y líquidos, balances en cilindros con pistón y la expansión libre de Joule">
<p class="lead">La primera ley de la termodinámica es el principio de conservación de la energía extendido para incluir el calor. Parece obvia hoy, pero costó medio siglo de experimentos y cuatro descubridores independientes (Mayer, Joule, Helmholtz y Colding) llegar a ella. Este capítulo la enuncia, la convierte en una herramienta de cálculo para sistemas cerrados y muestra por qué la energía interna de un gas ideal solo depende de su temperatura.</p>

<section>
<h2>El enunciado</h2>
<p>Los experimentos de Joule mostraron que, en cualquier proceso cíclico, el calor neto recibido es igual al trabajo neto entregado:</p>
<div class="eq">\[\oint\delta Q=\oint\delta W.\]</div>
<p>De ahí se sigue que \(\delta Q-\delta W\) integrada entre dos estados es independiente del camino: es el cambio de una propiedad, la energía total \(E\). La primera ley para un sistema cerrado es</p>
<div class="eq key" data-name="Primera ley, sistema cerrado">\[\Delta E=\Delta U+\Delta KE+\Delta PE=Q-W,\qquad \dd U=\delta Q-\delta W\ \ \text{(en reposo)}.\]</div>
<p>Es una contabilidad: lo que entra menos lo que sale es lo que se acumula. En forma de tasas, \(\dd E/\dd t=\dot Q-\dot W\). Las tres preguntas de cualquier problema son siempre las mismas: ¿cuál es el sistema?, ¿qué energía cruza su frontera como calor y como trabajo?, ¿cómo cambia su energía almacenada?</p>
<div class="sim" data-sim="ciclo-primera-ley" data-title="Un ciclo de cuatro procesos: calor, trabajo y energía interna en cada tramo"></div>
<div class="sim-guide"><ul>
<li>El gas ideal recorre un rectángulo en el diagrama \(P\)–\(V\). En cada tramo, \(Q\), \(W\) y \(\Delta U\) son distintos, pero \(\Delta U\) suma cero en el ciclo completo: la energía interna es una propiedad.</li>
<li>El trabajo neto (el área encerrada) es igual al calor neto. Pero el calor <b>recibido</b> es mucho mayor que el trabajo: una parte se devuelve al ambiente en los tramos de enfriamiento. Esa observación lleva a la segunda ley (capítulo 10).</li>
<li>Recorra el ciclo al revés: todos los signos se invierten y el ciclo se convierte en un refrigerador.</li>
</ul></div>
</section>

<section>
<h2>Entalpía y calores específicos</h2>
<p>En un proceso a presión constante en el que solo hay trabajo de frontera, \(Q=\Delta U+P\Delta V=\Delta(U+PV)\). La combinación aparece tanto que merece nombre propio, la <span class="term">entalpía</span>:</p>
<div class="eq key" data-name="Entalpía">\[H=U+PV,\qquad h=u+Pv.\]</div>
<p>Los calores específicos son derivadas de estas propiedades, y por tanto también propiedades:</p>
<div class="eq">\[c_v=\left(\frac{\partial u}{\partial T}\right)_v,\qquad c_p=\left(\frac{\partial h}{\partial T}\right)_P.\]</div>
<h3>Gas ideal</h3>
<p>Para un gas ideal, \(u\) solo depende de \(T\) (se demuestra abajo con la expansión libre y, rigurosamente, en el capítulo 16). Entonces \(h=u+RT\) tampoco depende de la presión, y</p>
<div class="eq key" data-name="Gas ideal: u, h y calores específicos">\[\dd u=c_v(T)\,\dd T,\qquad \dd h=c_p(T)\,\dd T,\qquad c_p-c_v=R,\qquad k=\frac{c_p}{c_v}.\]</div>
<p>Estas relaciones valen para <b>cualquier</b> proceso del gas ideal, no solo para los de volumen o presión constante. El calor específico crece con la temperatura porque se van excitando las vibraciones moleculares (capítulo 2): el \(c_p\) del aire pasa de 1.004 kJ/kg·K a 300 K a 1.135 a 1000 K y 1.234 a 2000 K. Para cambios pequeños de temperatura basta un valor constante; para cámaras de combustión o turbinas hay que integrar.</p>
<div class="sim" data-sim="cp-variable" data-title="Calor específico variable: cuándo importa"></div>
<div class="sim-guide"><ul>
<li>Calentar aire de 300 a 1000 K cuesta 743.5 kJ/kg con \(c_p(T)\) del modelo estadístico (la tabla A-17 de Çengel da 745.9) y 703.5 kJ/kg con \(c_p\) constante: un error del 5 %.</li>
<li>Entre 280 y 320 K el error es despreciable. La regla práctica: use \(c_p\) evaluado a la temperatura media del proceso.</li>
<li>Los gases de combustión, con CO₂ y H₂O, tienen \(c_p\) mayor y más variable que el aire.</li>
</ul></div>
<h3>Sólidos y líquidos</h3>
<p>Una sustancia incompresible (\(v\) constante) no hace trabajo de frontera y tiene un solo calor específico, \(c_p=c_v=c\). Entonces \(\Delta u=c\,\Delta T\) y \(\Delta h=\Delta u+v\Delta P\). Para el agua líquida, el término \(v\Delta P\) es pequeño: elevar la presión de 1 kg de agua en 1 MPa aumenta su entalpía en solo 1 kJ, lo que equivale a calentarla 0.24 °C.</p>
</section>

<section>
<h2>Balances en cilindros con pistón</h2>
<p>El dispositivo cilindro–pistón es el laboratorio de la primera ley: el gas o el vapor de su interior es un sistema cerrado que intercambia trabajo de frontera con el pistón y calor con el exterior. Si el pistón se mueve libremente bajo un peso constante, la presión es constante y \(Q=m(h_2-h_1)\), la razón histórica de la entalpía.</p>
<div class="sim" data-sim="piston-agua" data-title="Calentar agua en un cilindro con pistón a presión constante"></div>
<div class="sim-guide"><ul>
<li>Dos kilogramos de agua a 200 kPa y 25 °C se calientan hasta vapor a 300 °C. El calor necesario es 5934 kJ; de ellos, 526 kJ salen como trabajo para levantar el pistón y 5408 kJ quedan como energía interna.</li>
<li>Note el salto de volumen durante la ebullición: el pistón sube mil veces más que mientras el agua estaba líquida.</li>
<li>A una presión mayor, la meseta de ebullición se acorta y la energía total cambia poco: la mayor parte del calor se gasta en evaporar.</li>
</ul></div>
<div class="box ex"><h4>Un calefactor en una habitación cerrada</h4>
<p>Una habitación de 3 m × 3 m × 2.5 m en Popayán (81.9 kPa, 20 °C) se considera perfectamente sellada y aislada. Un calefactor de 1 kW funciona 10 min. ¿Cuánto subirían la temperatura y la presión del aire si las paredes y los muebles no absorbieran nada?</p>
<details><summary>Solución</summary><p>Sistema: el aire (rígido, \(W_b=0\)). El calefactor entrega trabajo eléctrico: \(W=-600\) kJ. Masa: \(m=PV/RT=81\,900(22.5)/(287.05\times293.15)=21.9\) kg. Primera ley: \(mc_v\Delta T=600\) kJ, \(\Delta T=600/(21.9\times0.718)=38\) K, y \(P_2=P_1T_2/T_1=92.6\) kPa. En la realidad el aire sube unos pocos grados: casi toda la energía va a paredes, piso y muebles, cuya capacidad calorífica es cientos de veces mayor.</p></details>
</div>
</section>

<section>
<h2>La expansión libre de Joule</h2>
<p>En 1845 Joule conectó dos recipientes de cobre sumergidos en agua, uno con aire a 22 atm y otro vacío, y abrió la válvula. El gas se expandió contra el vacío (\(W=0\)), y Joule no detectó cambio en la temperatura del agua (\(Q=0\)). Por la primera ley, \(\Delta U=0\): si la temperatura no cambió mientras el volumen se duplicaba, la energía interna del gas no depende del volumen. Es la propiedad que define al gas ideal.</p>
<p>Con termómetros más finos, los gases reales sí se enfrían un poco en la expansión libre, porque al separarse las moléculas su energía potencial de atracción aumenta a costa de la cinética. Para un gas de van der Waals, \(u=c_vT-a/\bar v\), y la caída de temperatura es</p>
<div class="eq">\[\Delta T=-\frac{a}{\bar c_v}\left(\frac1{\bar v_1}-\frac1{\bar v_2}\right).\]</div>
<p>Para el CO₂ que se expande de 1 a 2 L/mol, \(\Delta T=-6.3\) K. El agua del experimento de Joule tenía una capacidad calorífica tan grande frente a la del gas que ese enfriamiento le pasó inadvertido.</p>
<div class="sim" data-sim="expansion-libre" data-title="Expansión libre: gas ideal y gas de van der Waals"></div>
<div class="sim-guide"><ul>
<li>Abra la válvula: las partículas ocupan todo el recipiente. Su energía cinética media (la temperatura) no cambia en el gas ideal.</li>
<li>El panel de la derecha calcula la caída de temperatura de un gas real con van der Waals: mayor para gases con atracción fuerte (CO₂) y casi nula para el helio.</li>
<li>La expansión libre es irreversible: las partículas nunca vuelven solas a un lado. El capítulo 11 mide esa irreversibilidad con la entropía, \(\Delta S=nR\ln2\).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un sistema recibe 50 kJ de calor y entrega 20 kJ de trabajo. ¿Cuánto cambia su energía interna?
<details><summary>Respuesta</summary><p>+30 kJ.</p></details></li>
<li><span class="lvl">Básico</span>Halle \(\Delta u\) y \(\Delta h\) de 1 kg de aire que se calienta de 20 a 120 °C, con calores específicos constantes.
<details><summary>Respuesta</summary><p>\(\Delta u=71.8\) kJ/kg, \(\Delta h=100.5\) kJ/kg, cualquiera sea el proceso.</p></details></li>
<li><span class="lvl">Intermedio</span>Un tanque rígido de 0.3 m³ contiene vapor saturado a 200 kPa. Se enfría hasta 100 kPa. Halle la calidad final y el calor extraído.
<details><summary>Respuesta</summary><p>\(m=0.3/0.8858=0.3387\) kg, \(u_1=2529.1\). A 100 kPa: \(x_2=(0.8858-0.00104)/(1.6939-0.00104)=0.5226\), \(u_2=417.4+0.5226(2088.2)=1508.6\) kJ/kg. \(Q=m(u_2-u_1)=-345.7\) kJ.</p></details></li>
<li><span class="lvl">Intermedio</span>Un bloque de cobre de 2 kg a 150 °C se sumerge en 5 kg de agua a 20 °C en un recipiente aislado. Halle la temperatura final.
<details><summary>Respuesta</summary><p>\(T_f=(2\times0.385\times150+5\times4.18\times20)/(0.77+20.9)=24.6\) °C.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que para un gas ideal en un proceso politrópico \(PV^n=C\), el calor es \(Q=W\,(k-n)/(k-1)\). ¿Qué signo tiene \(Q\) en una compresión con \(1&lt;n&lt;k\)?
<details><summary>Respuesta</summary><p>\(W=mR(T_2-T_1)/(1-n)\), \(\Delta U=mR(T_2-T_1)/(k-1)\); \(Q=\Delta U+W=W[(1-n)/(k-1)+1]=W(k-n)/(k-1)\). En compresión \(W&lt;0\) y \(k-n>0\): \(Q&lt;0\), el gas cede calor aunque se caliente.</p></details></li>
</ol>
