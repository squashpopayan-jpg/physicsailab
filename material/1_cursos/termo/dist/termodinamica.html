<!-- 04-gases-reales.html -->
<template class="chapter-src" data-id="gases-reales" data-num="4" data-title="Gases reales y ecuaciones de estado" data-part="Parte I · Fundamentos" data-short="Factor de compresibilidad, desarrollo virial y temperatura de Boyle, ecuación de van der Waals y construcción de Maxwell, principio de estados correspondientes, factor acéntrico y ecuaciones cúbicas de Redlich–Kwong y Peng–Robinson">
<p class="lead">Un cilindro de nitrógeno de 50 L cargado a 200 bar contiene 10.6 kg de gas; la ecuación del gas ideal predice 11.2 kg. Un cilindro de CO₂ a temperatura ambiente no contiene gas sino líquido. Para diseñar recipientes, gasoductos o procesos químicos hace falta saber cuándo el gas ideal deja de servir y con qué reemplazarlo. Este capítulo construye las ecuaciones de estado de los gases reales desde la idea física de van der Waals hasta las ecuaciones cúbicas que usa la industria.</p>

<section>
<h2>El factor de compresibilidad</h2>
<p>La desviación del comportamiento ideal se mide con el <span class="term">factor de compresibilidad</span></p>
<div class="eq key" data-name="Factor de compresibilidad">\[Z=\frac{Pv}{RT}=\frac{P\bar v}{\bar RT}.\]</div>
<p>\(Z=1\) para el gas ideal. \(Z<1\) indica que dominan las atracciones entre moléculas (el gas es más compresible que el ideal); \(Z>1\), que domina la repulsión de corto alcance (las moléculas ocupan volumen). A baja presión todo gas tiende a \(Z=1\). Para cuantificar la corrección se desarrolla \(Z\) en potencias de la densidad, el <span class="term">desarrollo virial</span>:</p>
<div class="eq">\[Z=1+\frac{B(T)}{\bar v}+\frac{C(T)}{\bar v^2}+\cdots\]</div>
<p>El segundo coeficiente virial \(B(T)\) es la corrección de primer orden y la mecánica estadística lo relaciona con el potencial entre pares de moléculas, \(B=-2\pi N_A\int_0^\infty\left(\ee^{-\phi(r)/k_BT}-1\right)r^2\,\dd r\). Es negativo a baja temperatura (dominan las atracciones) y positivo a alta (domina el núcleo repulsivo). La temperatura a la que se anula es la <span class="term">temperatura de Boyle</span>: allí el gas real se comporta como ideal en un amplio intervalo de presiones. Para el N₂ es 327 K; por eso el aire a temperatura ambiente es tan ideal.</p>
<div class="sim" data-sim="virial-b" data-title="El segundo coeficiente virial y la temperatura de Boyle"></div>
<div class="sim-guide"><ul>
<li>Los puntos son \(B(T)\) de las ecuaciones de referencia (Span–Wagner para N₂ y CO₂, Setzmann–Wagner para CH₄, Tegeler para Ar); la curva continua, la predicción de van der Waals \(B=b-a/RT\).</li>
<li>Van der Waals acierta el signo y la forma, pero ubica la temperatura de Boyle en \(27T_c/8\): 426 K para el N₂, 30 % por encima del valor real.</li>
<li>El CO₂ a 300 K tiene \(B=-121\) cm³/mol: a 1 atm su \(Z\) es 0.995, una desviación del 0.5 % que ya importa en metrología de gases.</li>
</ul></div>
</section>

<section>
<h2>La ecuación de van der Waals</h2>
<p>Van der Waals (1873) corrigió el gas ideal con dos ideas físicas. Las moléculas ocupan un volumen: el volumen disponible es \(\bar v-b\). Y se atraen: una molécula cerca de la pared es frenada por las del interior, y la presión que ejerce baja en una cantidad proporcional al cuadrado de la densidad, \(a/\bar v^2\):</p>
<div class="eq key" data-name="Ecuación de van der Waals">\[\left(P+\frac{a}{\bar v^2}\right)(\bar v-b)=\bar RT.\]</div>
<p>Sus isotermas tienen un rasgo notable: por debajo de cierta temperatura presentan un mínimo y un máximo. En el tramo entre ellos \((\partial P/\partial v)_T>0\): el fluido se comprimiría al bajar la presión, un estado mecánicamente inestable. Es la huella de la transición líquido–vapor. El punto donde el máximo y el mínimo se funden es el punto crítico, \((\partial P/\partial v)_T=(\partial^2P/\partial v^2)_T=0\), de donde</p>
<div class="eq">\[a=\frac{27\bar R^2T_c^2}{64P_c},\qquad b=\frac{\bar RT_c}{8P_c},\qquad Z_c=\frac{P_c\bar v_c}{\bar RT_c}=\frac38.\]</div>
<p>Escrita con variables reducidas \(P_r=P/P_c\), \(T_r=T/T_c\), \(v_r=v/v_c\), la ecuación queda sin parámetros del gas: \(P_r=8T_r/(3v_r-1)-3/v_r^2\).</p>
<h3>La construcción de Maxwell</h3>
<p>La isoterma de van der Waals no tiene meseta. Maxwell (1875) mostró dónde trazarla: el líquido y el vapor coexisten a la presión que hace iguales las dos áreas entre la isoterma y la recta horizontal. La razón es que ambas fases deben tener la misma energía de Gibbs, y \(g_g-g_f=\int v\,\dd P\) a lo largo de la isoterma (capítulo 16). Los estados entre la meseta y los extremos son <span class="term">metaestables</span>: el líquido sobrecalentado y el vapor sobresaturado, que existen de verdad en recipientes muy limpios (la cámara de burbujas, la cámara de niebla de Wilson).</p>
<div class="sim" data-sim="vdw-isotermas" data-title="Isotermas de van der Waals y construcción de Maxwell de áreas iguales"></div>
<div class="sim-guide"><ul>
<li>A \(T_r=0.9\) la presión de saturación de van der Waals es \(P_r=0.647\); la real del argón, del nitrógeno y del metano está entre 0.53 y 0.54. Van der Waals capta la física pero no los números.</li>
<li>La curva roja es la binodal (coexistencia); la punteada, la espinodal (límite de la metaestabilidad, donde \(\partial P/\partial v=0\)).</li>
<li>Por encima de \(T_r=1\) las isotermas son monótonas: no hay transición.</li>
</ul></div>
</section>

<section>
<h2>Estados correspondientes</h2>
<p>Si la ecuación reducida de van der Waals no depende del gas, todos los gases deberían tener el mismo \(Z\) a iguales \(P_r\) y \(T_r\). Es el <span class="term">principio de estados correspondientes</span>, y se cumple sorprendentemente bien para moléculas simples y casi esféricas: argón, nitrógeno, metano. La carta generalizada de compresibilidad de Nelson y Obert (1954) se basa en él y permite estimar \(Z\) de cualquier gas con solo \(T_c\) y \(P_c\), dentro de un 5 %.</p>
<p>Las moléculas alargadas o polares se desvían. Pitzer (1955) añadió un tercer parámetro, el <span class="term">factor acéntrico</span>, que mide cuánto baja la presión de vapor reducida a \(T_r=0.7\) respecto de la de los fluidos simples:</p>
<div class="eq">\[\omega=-\log_{10}\left(P_r^{sat}\right)_{T_r=0.7}-1.\]</div>
<p>Es ≈ 0 para el argón, 0.037 para el N₂, 0.224 para el CO₂ y 0.344 para el agua.</p>
<div class="sim" data-sim="carta-z" data-title="Carta generalizada de compresibilidad"></div>
<div class="sim-guide"><ul>
<li>Los puntos de Ar, N₂ y CH₄ (calculados con sus ecuaciones de referencia) caen casi encima a cada \(T_r\): estados correspondientes. Los del CO₂ se separan algunos por ciento, como predice su factor acéntrico.</li>
<li>Las curvas son Peng–Robinson con el \(\omega\) del gas elegido. Note el mínimo de \(Z\) cerca de \(P_r\approx2\) a \(T_r=1.1\): allí el gas es casi tan denso como un líquido.</li>
</ul></div>
</section>

<section>
<h2>Ecuaciones cúbicas modernas</h2>
<p>Van der Waals tiene la forma correcta, pero el término de atracción es demasiado simple. Redlich y Kwong (1949) y, sobre todo, Peng y Robinson (1976) lo mejoraron conservando una ecuación cúbica en \(\bar v\), que se resuelve con la fórmula de Cardano:</p>
<div class="eq key" data-name="Ecuación de Peng–Robinson">\[P=\frac{\bar RT}{\bar v-b}-\frac{a\,\alpha(T)}{\bar v^2+2b\bar v-b^2},\qquad \alpha=\left[1+\kappa\left(1-\sqrt{T_r}\right)\right]^2,\]</div>
<p>con \(a=0.45724\,\bar R^2T_c^2/P_c\), \(b=0.07780\,\bar RT_c/P_c\) y \(\kappa=0.37464+1.54226\omega-0.26992\omega^2\). La función \(\alpha(T)\) se ajustó para reproducir las presiones de vapor; por eso Peng–Robinson predice bien el equilibrio líquido–vapor de hidrocarburos y es la ecuación estándar en la industria del petróleo y el gas.</p>
<p>Cuando la ecuación tiene tres raíces reales, la menor corresponde al líquido y la mayor al vapor; la intermedia no tiene sentido físico.</p>
<div class="sim" data-sim="eos-compara" data-title="Cilindros de gas comprimido: cuatro ecuaciones de estado"></div>
<div class="sim-guide"><ul>
<li>Un cilindro de 50 L con 10.6 kg de N₂ a 27 °C está a 200 bar (dato de referencia). El gas ideal da 189 bar; Peng–Robinson, 194 bar.</li>
<li>Pase al CO₂ con 5 kg: a 20 °C las ecuaciones cúbicas encuentran dos raíces, líquido y vapor. El extintor real contiene líquido a la presión de saturación, 57.3 bar.</li>
<li>El gas natural vehicular (metano) se almacena a unos 200 bar: allí \(Z\approx0.80\) a 15 °C y el tanque guarda 25 % más gas que el que predice el modelo ideal.</li>
</ul></div>
<div class="tablewrap"><table>
<tr><th>Estado</th><th class="c">Ideal</th><th class="c">van der Waals</th><th class="c">Redlich–Kwong</th><th class="c">Peng–Robinson</th><th class="c">Referencia</th></tr>
<tr><td>CO₂, 320 K, 5 MPa</td><td class="c">1</td><td class="c">0.785</td><td class="c">0.769</td><td class="c">0.754</td><td class="c">0.771</td></tr>
<tr><td>CO₂, 300 K, 6 MPa</td><td class="c">1</td><td class="c">0.642</td><td class="c">0.599</td><td class="c">0.566</td><td class="c">0.581</td></tr>
<tr><td>N₂, 300 K, 20 MPa</td><td class="c">1</td><td class="c">1.007</td><td class="c">1.031</td><td class="c">1.028</td><td class="c">1.057</td></tr>
<tr><td>CH₄, 250 K, 8 MPa</td><td class="c">1</td><td class="c">0.702</td><td class="c">0.743</td><td class="c">0.715</td><td class="c">0.739</td></tr>
</table></div>
<p class="ctrl-note">Factor de compresibilidad \(Z\). Referencia: ecuaciones fundamentales de Span–Wagner (CO₂, N₂) y Setzmann–Wagner (CH₄) evaluadas con CoolProp. Las cúbicas cometen errores de 2 a 4 % cerca del punto crítico: suficiente para diseño, no para facturar gas.</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule las constantes \(a\) y \(b\) de van der Waals del CO₂ (\(T_c=304.13\) K, \(P_c=7.377\) MPa).
<details><summary>Respuesta</summary><p>\(a=0.3657\) Pa·m⁶/mol², \(b=4.284\times10^{-5}\) m³/mol.</p></details></li>
<li><span class="lvl">Básico</span>Estime la temperatura de Boyle del metano con van der Waals y compárela con el valor real (≈ 510 K).
<details><summary>Respuesta</summary><p>\(27T_c/8=27(190.56)/8=643\) K; error de +26 %.</p></details></li>
<li><span class="lvl">Intermedio</span>Con la carta generalizada (\(Z\approx0.80\) para \(T_r=1.5\), \(P_r=3\)), estime la densidad del metano a 13.8 MPa y 286 K.
<details><summary>Respuesta</summary><p>\(T_r=286/190.56=1.50\), \(P_r=13.8/4.599=3.0\). \(\rho=P M/(ZRT)=13.8\times10^6\times0.016043/(0.79\times8.314\times286)=118\) kg/m³ (referencia: \(Z=0.787\)).</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que para van der Waals \(B(T)=b-a/\bar RT\).
<details><summary>Respuesta</summary><p>\(Z=\bar v/(\bar v-b)-a/(\bar R T\bar v)=1+b/\bar v+\dots-a/(\bar RT\bar v)\). El coeficiente de \(1/\bar v\) es \(b-a/\bar RT\).</p></details></li>
<li><span class="lvl">Avanzado</span>Deduzca \(Z_c=3/8\) para van der Waals a partir de las condiciones del punto crítico, y compárelo con los valores reales (0.29 para el argón, 0.27 para el CO₂, 0.23 para el agua).
<details><summary>Respuesta</summary><p>De \(\partial_vP=\partial_v^2P=0\) se obtiene \(\bar v_c=3b\), \(T_c=8a/27\bar Rb\), \(P_c=a/27b^2\); entonces \(Z_c=P_c\bar v_c/\bar RT_c=3/8=0.375\). Ningún fluido real lo alcanza: el modelo sobrestima el volumen crítico.</p></details></li>
</ol>
<div class="box note"><h4>Para profundizar</h4><p>B. E. Poling, J. M. Prausnitz y J. P. O'Connell, <em>The Properties of Gases and Liquids</em>, 5.ª ed., McGraw-Hill, 2001, caps. 4–6. D.-Y. Peng y D. B. Robinson, «A new two-constant equation of state», <em>Ind. Eng. Chem. Fundam.</em> 15, 59 (1976). R. Span y W. Wagner, <em>J. Phys. Chem. Ref. Data</em> 25, 1509 (1996). J. D. van der Waals, <em>Over de continuiteit van den gas- en vloeistoftoestand</em>, tesis, Leiden, 1873.</p></div>
</section>

<!-- 05-trabajo-calor.html -->
<template class="chapter-src" data-id="trabajo-calor" data-num="5" data-title="Energía, trabajo y calor" data-part="Parte II · Primera ley" data-short="Formas de energía, trabajo de frontera y su dependencia del camino, otras formas de trabajo, el calor como energía en tránsito, el experimento de Joule, calores específicos y latentes, calorimetría y la curva de calentamiento del agua">
<p class="lead">Hasta mediados del siglo XIX se pensaba que el calor era un fluido, el «calórico», que pasaba de los cuerpos calientes a los fríos y se conservaba. Joule demostró con paletas, pesas y un termómetro muy fino que el trabajo mecánico produce calor en una proporción fija. Desde entonces calor y trabajo son dos maneras de transferir una misma cosa: energía. Este capítulo define ambas con precisión y prepara el balance de energía de la primera ley.</p>

<section>
<h2>Formas de energía</h2>
<p>La energía total de un sistema se divide en la que depende de su movimiento y posición como un todo (energía cinética \(\tfrac12mV^2\) y potencial \(mgz\)) y la que depende de su estado interno, la <span class="term">energía interna</span> \(U\): la suma de las energías cinéticas de traslación, rotación y vibración de las moléculas, de sus interacciones, de los enlaces químicos y de los núcleos.</p>
<div class="eq">\[E=U+\tfrac12mV^2+mgz.\]</div>
<p>La termodinámica no necesita saber cómo se reparte \(U\) entre esas contribuciones; solo necesita que sea una <b>propiedad</b>: que dependa del estado y no de la historia. Pero el reparto explica los números: calentar 1 kg de agua 1 K cuesta 4.18 kJ; evaporarlo, 2257 kJ, porque hay que romper sus puentes de hidrógeno; y quemar 1 kg de metano libera 50 000 kJ de energía química.</p>
<p>Calor y trabajo, en cambio, <b>no son propiedades</b>. Son energía en tránsito a través de la frontera, y solo existen durante un proceso. Un sistema no «tiene» calor ni trabajo; tiene energía. Por eso sus diferenciales se escriben \(\delta Q\) y \(\delta W\) (inexactas): su integral depende del camino.</p>
</section>

<section>
<h2>El trabajo de frontera</h2>
<p>Cuando un gas empuja un pistón de área \(A\) una distancia \(\dd x\), realiza un trabajo \(\delta W=F\,\dd x=PA\,\dd x=P\,\dd V\). En un proceso cuasiestático en que la presión está definida en todo momento,</p>
<div class="eq key" data-name="Trabajo de frontera">\[W_b=\int_1^2P\,\dd V,\]</div>
<p>el área bajo la curva del proceso en el diagrama \(P\)–\(V\). Con la convención de este curso (la de Clausius y la de la mayoría de textos de ingeniería), \(W>0\) cuando el sistema entrega trabajo (expansión) y \(Q>0\) cuando el sistema recibe calor.</p>
<p>Como el área depende de la curva, el trabajo entre los mismos estados inicial y final depende del camino. Para un gas ideal, los procesos más comunes dan:</p>
<div class="tablewrap"><table>
<tr><th>Proceso</th><th class="c">Condición</th><th class="c">\(W_b\)</th></tr>
<tr><td>Isocórico</td><td class="c">\(V=\text{cte}\)</td><td class="c">\(0\)</td></tr>
<tr><td>Isobárico</td><td class="c">\(P=\text{cte}\)</td><td class="c">\(P(V_2-V_1)\)</td></tr>
<tr><td>Isotérmico (gas ideal)</td><td class="c">\(PV=\text{cte}\)</td><td class="c">\(P_1V_1\ln(V_2/V_1)\)</td></tr>
<tr><td>Politrópico, \(n\ne1\)</td><td class="c">\(PV^n=\text{cte}\)</td><td class="c">\((P_2V_2-P_1V_1)/(1-n)\)</td></tr>
</table></div>
<div class="sim" data-sim="trabajo-pv" data-title="El trabajo depende del camino: tres procesos entre los mismos estados"></div>
<div class="sim-guide"><ul>
<li>Aire en un cilindro pasa de 0.1 m³ y 400 kPa a 0.4 m³ y 100 kPa (la misma temperatura final). Por el camino isotérmico el gas entrega 55.5 kJ; subiendo primero por la isóbara, 120 kJ; bajando primero por la isócora, 30 kJ.</li>
<li>El cambio de energía interna es el mismo (cero, porque \(T_2=T_1\) y el gas es ideal), así que el calor recibido tiene que ser distinto en cada camino: \(Q=W\). Es la primera ley, que el capítulo 6 formaliza.</li>
<li>Recorra el ciclo completo: el área encerrada es el trabajo neto del ciclo, la base de toda máquina térmica.</li>
</ul></div>
<h3>Otras formas de trabajo</h3>
<p>Todo trabajo es el producto de una «fuerza generalizada» por el cambio de un «desplazamiento generalizado»:</p>
<ul>
<li><b>de eje</b>: \(W=\int T_{par}\,\dd\theta=2\pi nT_{par}\) para \(n\) revoluciones;</li>
<li><b>eléctrico</b>: \(W=\int VI\,\dd t\); una resistencia dentro de un sistema recibe trabajo eléctrico, no calor;</li>
<li><b>de un resorte</b>: \(W=\tfrac12k(x_2^2-x_1^2)\);</li>
<li><b>de tensión superficial</b>: \(\delta W=-\sigma\,\dd A\); <b>magnético</b>: \(\delta W=-\mu_0H\,\dd(VM)\); <b>de una barra elástica</b>: \(\delta W=-F\,\dd L\).</li>
</ul>
</section>

<section>
<h2>El calor y el experimento de Joule</h2>
<p>El <span class="term">calor</span> es la energía que cruza la frontera debido a una diferencia de temperatura. Se transfiere por conducción, convección y radiación (capítulo 9). Un proceso sin calor es <span class="term">adiabático</span>; no hay que confundirlo con isotérmico: en una compresión adiabática la temperatura sube.</p>
<p>Entre 1843 y 1850 James Prescott Joule midió cuánto trabajo mecánico hace falta para calentar una cantidad de agua. Unas pesas que caían hacían girar unas paletas dentro de un recipiente aislado; la fricción viscosa calentaba el agua unas décimas de grado, que Joule medía con termómetros graduados a 1/200 °F. Su resultado de 1850, 772 pie·libra por BTU, equivale a 4.16 J/cal, menos del 1 % del valor moderno:</p>
<div class="eq key" data-name="Equivalente mecánico del calor">\[1\ \text{cal}_{th}=4.184\ \text{J}.\]</div>
<p>El experimento demostró que el calor no se conserva por sí solo: se crea a partir del trabajo. Lo que se conserva es la energía.</p>
<div class="sim" data-sim="joule-paletas" data-title="El experimento de las paletas de Joule"></div>
<div class="sim-guide"><ul>
<li>Dos pesas de 15 kg que caen 2 m, veinte veces, calientan 6 kg de agua en 0.47 K. Joule necesitaba esa precisión: el calentamiento es pequeño porque el agua tiene una capacidad calorífica enorme.</li>
<li>Agregue pérdidas de calor hacia el ambiente: la temperatura aparente sube menos y el «equivalente» medido sale mayor. Joule corregía ese efecto alternando corridas con el agua más fría y más caliente que el ambiente.</li>
</ul></div>
</section>

<section>
<h2>Calores específicos, calores latentes y calorimetría</h2>
<p>El <span class="term">calor específico</span> es la energía necesaria para elevar un grado la temperatura de un kilogramo. Depende del proceso: a volumen constante, \(c_v=(\partial u/\partial T)_v\); a presión constante, \(c_p=(\partial h/\partial T)_P\) (capítulo 6). Para sólidos y líquidos, casi incompresibles, \(c_p\approx c_v=c\), y</p>
<div class="eq">\[Q=mc\,\Delta T\qquad\text{(sin cambio de fase)},\qquad Q=mh_{sf}\ \text{(fusión)},\qquad Q=mh_{fg}\ \text{(evaporación)}.\]</div>
<div class="tablewrap"><table>
<tr><th>Sustancia</th><th class="c">\(c\) (kJ/kg·K)</th><th>Sustancia</th><th class="c">\(c\) (kJ/kg·K)</th></tr>
<tr><td>Agua líquida (25 °C)</td><td class="c">4.18</td><td>Aluminio</td><td class="c">0.90</td></tr>
<tr><td>Hielo (−10 °C)</td><td class="c">2.05</td><td>Hierro</td><td class="c">0.45</td></tr>
<tr><td>Vapor de agua (1 atm, 110 °C)</td><td class="c">2.04</td><td>Cobre</td><td class="c">0.385</td></tr>
<tr><td>Aceite de cocina</td><td class="c">≈ 2.0</td><td>Vidrio</td><td class="c">0.84</td></tr>
<tr><td>Aire (\(c_p\))</td><td class="c">1.005</td><td>Concreto</td><td class="c">0.88</td></tr>
</table></div>
<p>Calor latente de fusión del hielo: 333.6 kJ/kg. El agua tiene uno de los calores específicos más altos de todas las sustancias: por eso modera el clima de las costas y es el refrigerante de los motores.</p>
<p>La <span class="term">calorimetría</span> usa un recipiente aislado: la energía que pierden unos cuerpos la ganan otros, \(\sum_im_ic_i(T_f-T_i)+\sum(\text{calores latentes})=0\). Si hay hielo, hay que comprobar primero si se funde todo.</p>
<div class="sim" data-sim="calorimetro" data-title="Calorímetro de mezclas: metal, agua y hielo"></div>
<div class="sim-guide"><ul>

<li>Añada hielo: si el agua no tiene energía suficiente para fundirlo todo, el estado final es una mezcla a 0 °C y el simulador reporta cuánto hielo queda.</li>

</ul></div>
<div class="sim" data-sim="curva-calentamiento" data-title="Curva de calentamiento del agua en Popayán: de hielo a vapor"></div>

<p>Se echan 50 g de hielo a −10 °C en 300 g de agua a 25 °C. ¿Cuál es la temperatura final si el vaso no intercambia calor?</p>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un gas se expande a presión constante de 200 kPa de 0.05 a 0.12 m³. ¿Cuánto trabajo realiza?
<details><summary>Respuesta</summary><p>14 kJ.</p></details></li>
<li><span class="lvl">Básico</span>Un hervidor eléctrico de 1500 W calienta 1 L de agua de 18 °C a ebullición en Popayán. ¿Cuánto tarda, sin pérdidas?

<details><summary>Respuesta</summary><p>Contra la atmósfera: \(82\,000(0.05)(0.2)=820\) J; sobre el resorte: \(\tfrac12(80\,000)(0.2)^2=1600\) J. Total 2.42 kJ (más el peso del pistón, si lo hay).</p></details></li>

<!-- 06-primera-ley.html -->
<template class="chapter-src" data-id="primera-ley" data-num="6" data-title="Primera ley en sistemas cerrados" data-part="Parte II · Primera ley" data-short="Conservación de la energía en ciclos y procesos, energía interna y entalpía como propiedades, calores específicos de gases ideales, sólidos y líquidos, balances en cilindros con pistón y la expansión libre de Joule">
<p class="lead">La primera ley de la termodinámica es el principio de conservación de la energía extendido para incluir el calor. Parece obvia hoy, pero costó medio siglo de experimentos y cuatro descubridores independientes (Mayer, Joule, Helmholtz y Colding) llegar a ella. Este capítulo la enuncia, la convierte en una herramienta de cálculo para sistemas cerrados y muestra por qué la energía interna de un gas ideal solo depende de su temperatura.</p>

<section>
<h2>El enunciado</h2>
<p>Los experimentos de Joule mostraron que, en cualquier proceso cíclico, el calor neto recibido es igual al trabajo neto entregado:</p>
<div class="eq">\[\oint\delta Q=\oint\delta W.\]</div>
<p>De ahí se sigue que \(\delta Q-\delta W\) integrada entre dos estados es independiente del camino: es el cambio de una propiedad, la energía total \(E\). La primera ley para un sistema cerrado es</p>
<div class="eq key" data-name="Primera ley, sistema cerrado">\[\Delta E=\Delta U+\Delta KE+\Delta PE=Q-W,\qquad \dd U=\delta Q-\delta W\ \ \text{(en reposo)}.\]</div>
<p>Es una contabilidad: lo que entra menos lo que sale es lo que se acumula. En forma de tasas, \(\dd E/\dd t=\dot Q-\dot W\). Las tres preguntas de cualquier problema son siempre las mismas: ¿cuál es el sistema?, ¿qué energía cruza su frontera como calor y como trabajo?, ¿cómo cambia su energía almacenada?</p>
<div class="sim" data-sim="ciclo-primera-ley" data-title="Un ciclo de cuatro procesos: calor, trabajo y energía interna en cada tramo"></div>
<div class="sim-guide"><ul>
<li>El gas ideal recorre un rectángulo en el diagrama \(P\)–\(V\). En cada tramo, \(Q\), \(W\) y \(\Delta U\) son distintos, pero \(\Delta U\) suma cero en el ciclo completo: la energía interna es una propiedad.</li>
<li>El trabajo neto (el área encerrada) es igual al calor neto. Pero el calor <b>recibido</b> es mucho mayor que el trabajo: una parte se devuelve al ambiente en los tramos de enfriamiento. Esa observación lleva a la segunda ley (capítulo 10).</li>
<li>Recorra el ciclo al revés: todos los signos se invierten y el ciclo se convierte en un refrigerador.</li>
</ul></div>
</section>

<section>
<h2>Entalpía y calores específicos</h2>
<p>En un proceso a presión constante en el que solo hay trabajo de frontera, \(Q=\Delta U+P\Delta V=\Delta(U+PV)\). La combinación aparece tanto que merece nombre propio, la <span class="term">entalpía</span>:</p>
<div class="eq key" data-name="Entalpía">\[H=U+PV,\qquad h=u+Pv.\]</div>
<p>Los calores específicos son derivadas de estas propiedades, y por tanto también propiedades:</p>
<div class="eq">\[c_v=\left(\frac{\partial u}{\partial T}\right)_v,\qquad c_p=\left(\frac{\partial h}{\partial T}\right)_P.\]</div>
<h3>Gas ideal</h3>
<p>Para un gas ideal, \(u\) solo depende de \(T\) (se demuestra abajo con la expansión libre y, rigurosamente, en el capítulo 16). Entonces \(h=u+RT\) tampoco depende de la presión, y</p>
<div class="eq key" data-name="Gas ideal: u, h y calores específicos">\[\dd u=c_v(T)\,\dd T,\qquad \dd h=c_p(T)\,\dd T,\qquad c_p-c_v=R,\qquad k=\frac{c_p}{c_v}.\]</div>
<p>Estas relaciones valen para <b>cualquier</b> proceso del gas ideal, no solo para los de volumen o presión constante. El calor específico crece con la temperatura porque se van excitando las vibraciones moleculares (capítulo 2): el \(c_p\) del aire pasa de 1.004 kJ/kg·K a 300 K a 1.135 a 1000 K y 1.234 a 2000 K. Para cambios pequeños de temperatura basta un valor constante; para cámaras de combustión o turbinas hay que integrar.</p>
<div class="sim" data-sim="cp-variable" data-title="Calor específico variable: cuándo importa"></div>
<div class="sim-guide"><ul>
<li>Calentar aire de 300 a 1000 K cuesta 743.5 kJ/kg con \(c_p(T)\) del modelo estadístico (la tabla A-17 de Çengel da 745.9) y 703.5 kJ/kg con \(c_p\) constante: un error del 5 %.</li>
<li>Entre 280 y 320 K el error es despreciable. La regla práctica: use \(c_p\) evaluado a la temperatura media del proceso.</li>
<li>Los gases de combustión, con CO₂ y H₂O, tienen \(c_p\) mayor y más variable que el aire.</li>
</ul></div>
<h3>Sólidos y líquidos</h3>
<p>Una sustancia incompresible (\(v\) constante) no hace trabajo de frontera y tiene un solo calor específico, \(c_p=c_v=c\). Entonces \(\Delta u=c\,\Delta T\) y \(\Delta h=\Delta u+v\Delta P\). Para el agua líquida, el término \(v\Delta P\) es pequeño: elevar la presión de 1 kg de agua en 1 MPa aumenta su entalpía en solo 1 kJ, lo que equivale a calentarla 0.24 °C.</p>
</section>

<section>
<h2>Balances en cilindros con pistón</h2>
<p>El dispositivo cilindro–pistón es el laboratorio de la primera ley: el gas o el vapor de su interior es un sistema cerrado que intercambia trabajo de frontera con el pistón y calor con el exterior. Si el pistón se mueve libremente bajo un peso constante, la presión es constante y \(Q=m(h_2-h_1)\), la razón histórica de la entalpía.</p>
<div class="sim" data-sim="piston-agua" data-title="Calentar agua en un cilindro con pistón a presión constante"></div>
<div class="sim-guide"><ul>
<li>Dos kilogramos de agua a 200 kPa y 25 °C se calientan hasta vapor a 300 °C. El calor necesario es 5934 kJ; de ellos, 526 kJ salen como trabajo para levantar el pistón y 5408 kJ quedan como energía interna.</li>
<li>Note el salto de volumen durante la ebullición: el pistón sube mil veces más que mientras el agua estaba líquida.</li>
<li>A una presión mayor, la meseta de ebullición se acorta y la energía total cambia poco: la mayor parte del calor se gasta en evaporar.</li>
</ul></div>
<div class="box ex"><h4>Un calefactor en una habitación cerrada</h4>
<p>Una habitación de 3 m × 3 m × 2.5 m en Popayán (81.9 kPa, 20 °C) se considera perfectamente sellada y aislada. Un calefactor de 1 kW funciona 10 min. ¿Cuánto subirían la temperatura y la presión del aire si las paredes y los muebles no absorbieran nada?</p>
<details><summary>Solución</summary><p>Sistema: el aire (rígido, \(W_b=0\)). El calefactor entrega trabajo eléctrico: \(W=-600\) kJ. Masa: \(m=PV/RT=81\,900(22.5)/(287.05\times293.15)=21.9\) kg. Primera ley: \(mc_v\Delta T=600\) kJ, \(\Delta T=600/(21.9\times0.718)=38\) K, y \(P_2=P_1T_2/T_1=92.6\) kPa. En la realidad el aire sube unos pocos grados: casi toda la energía va a paredes, piso y muebles, cuya capacidad calorífica es cientos de veces mayor.</p></details>
</div>
</section>

<section>
<h2>La expansión libre de Joule</h2>
<p>En 1845 Joule conectó dos recipientes de cobre sumergidos en agua, uno con aire a 22 atm y otro vacío, y abrió la válvula. El gas se expandió contra el vacío (\(W=0\)), y Joule no detectó cambio en la temperatura del agua (\(Q=0\)). Por la primera ley, \(\Delta U=0\): si la temperatura no cambió mientras el volumen se duplicaba, la energía interna del gas no depende del volumen. Es la propiedad que define al gas ideal.</p>
<p>Con termómetros más finos, los gases reales sí se enfrían un poco en la expansión libre, porque al separarse las moléculas su energía potencial de atracción aumenta a costa de la cinética. Para un gas de van der Waals, \(u=c_vT-a/\bar v\), y la caída de temperatura es</p>
<div class="eq">\[\Delta T=-\frac{a}{\bar c_v}\left(\frac1{\bar v_1}-\frac1{\bar v_2}\right).\]</div>
<p>Para el CO₂ que se expande de 1 a 2 L/mol, \(\Delta T=-6.3\) K. El agua del experimento de Joule tenía una capacidad calorífica tan grande frente a la del gas que ese enfriamiento le pasó inadvertido.</p>
<div class="sim" data-sim="expansion-libre" data-title="Expansión libre: gas ideal y gas de van der Waals"></div>
<div class="sim-guide"><ul>
<li>Abra la válvula: las partículas ocupan todo el recipiente. Su energía cinética media (la temperatura) no cambia en el gas ideal.</li>
<li>El panel de la derecha calcula la caída de temperatura de un gas real con van der Waals: mayor para gases con atracción fuerte (CO₂) y casi nula para el helio.</li>
<li>La expansión libre es irreversible: las partículas nunca vuelven solas a un lado. El capítulo 11 mide esa irreversibilidad con la entropía, \(\Delta S=nR\ln2\).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un sistema recibe 50 kJ de calor y entrega 20 kJ de trabajo. ¿Cuánto cambia su energía interna?
<details><summary>Respuesta</summary><p>+30 kJ.</p></details></li>
<li><span class="lvl">Básico</span>Halle \(\Delta u\) y \(\Delta h\) de 1 kg de aire que se calienta de 20 a 120 °C, con calores específicos constantes.
<details><summary>Respuesta</summary><p>\(\Delta u=71.8\) kJ/kg, \(\Delta h=100.5\) kJ/kg, cualquiera sea el proceso.</p></details></li>
<li><span class="lvl">Intermedio</span>Un tanque rígido de 0.3 m³ contiene vapor saturado a 200 kPa. Se enfría hasta 100 kPa. Halle la calidad final y el calor extraído.
<details><summary>Respuesta</summary><p>\(m=0.3/0.8858=0.3387\) kg, \(u_1=2529.1\). A 100 kPa: \(x_2=(0.8858-0.00104)/(1.6939-0.00104)=0.5226\), \(u_2=417.4+0.5226(2088.2)=1508.6\) kJ/kg. \(Q=m(u_2-u_1)=-345.7\) kJ.</p></details></li>
<li><span class="lvl">Intermedio</span>Un bloque de cobre de 2 kg a 150 °C se sumerge en 5 kg de agua a 20 °C en un recipiente aislado. Halle la temperatura final.
<details><summary>Respuesta</summary><p>\(T_f=(2\times0.385\times150+5\times4.18\times20)/(0.77+20.9)=24.6\) °C.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que para un gas ideal en un proceso politrópico \(PV^n=C\), el calor es \(Q=W\,(k-n)/(k-1)\). ¿Qué signo tiene \(Q\) en una compresión con \(1&lt;n&lt;k\)?
<details><summary>Respuesta</summary><p>\(W=mR(T_2-T_1)/(1-n)\), \(\Delta U=mR(T_2-T_1)/(k-1)\); \(Q=\Delta U+W=W[(1-n)/(k-1)+1]=W(k-n)/(k-1)\). En compresión \(W&lt;0\) y \(k-n>0\): \(Q&lt;0\), el gas cede calor aunque se caliente.</p></details></li>
</ol>
<div class="box note"><h4>Para profundizar</h4><p>Çengel y Boles (2019), cap. 4. Zemansky y Dittman (1997), caps. 3–5. J. P. Joule, «On the changes of temperature produced by the rarefaction and condensation of air», <em>Phil. Mag.</em> 26, 369 (1845). T. S. Kuhn, «Energy conservation as an example of simultaneous discovery», en <em>The Essential Tension</em>, University of Chicago Press, 1977.</p></div>
</section>

<!-- 07-procesos-gas.html -->
<template class="chapter-src" data-id="procesos-gas" data-num="7" data-title="Procesos del gas ideal" data-part="Parte II · Primera ley" data-short="Procesos isotérmico, isobárico, isocórico y adiabático reversible, la familia politrópica, el motor diésel y la bomba de bicicleta, la medición de γ con el experimento de Rüchardt y el exponente politrópico que surge de la transferencia de calor">
<p class="lead">Cuando se infla una llanta, la bomba se calienta. Cuando se abre una botella de gaseosa, se forma una neblina en el cuello. En un motor diésel el aire comprimido se calienta tanto que enciende el combustible sin chispa. Los tres fenómenos son el mismo: un gas que cambia de volumen más rápido de lo que intercambia calor. Este capítulo resuelve los procesos del gas ideal con la primera ley y conecta los idealizados con los reales.</p>

<section>
<h2>Los cuatro procesos básicos</h2>
<p>Para un gas ideal con calores específicos constantes, la primera ley y la ecuación de estado bastan para resolver cualquier proceso cuasiestático. Los cuatro casos clásicos son:</p>
<div class="tablewrap"><table>
<tr><th>Proceso</th><th class="c">Relación</th><th class="c">\(W_b\)</th><th class="c">\(Q\)</th></tr>
<tr><td>Isocórico</td><td class="c">\(P/T=\text{cte}\)</td><td class="c">0</td><td class="c">\(mc_v\Delta T\)</td></tr>
<tr><td>Isobárico</td><td class="c">\(V/T=\text{cte}\)</td><td class="c">\(mR\Delta T\)</td><td class="c">\(mc_p\Delta T\)</td></tr>
<tr><td>Isotérmico</td><td class="c">\(PV=\text{cte}\)</td><td class="c">\(mRT\ln(V_2/V_1)\)</td><td class="c">\(=W_b\)</td></tr>
<tr><td>Adiabático reversible</td><td class="c">\(PV^k=\text{cte}\)</td><td class="c">\(-mc_v\Delta T\)</td><td class="c">0</td></tr>
</table></div>
<h3>El proceso adiabático reversible</h3>
<p>Si no hay calor, \(\dd U=-P\,\dd V\). Con \(\dd U=mc_v\,\dd T\) y \(P=mRT/V\):</p>
<div class="eq">\[c_v\frac{\dd T}{T}=-R\frac{\dd V}{V}\quad\Longrightarrow\quad TV^{R/c_v}=TV^{k-1}=\text{cte}.\]</div>
<p>Combinando con la ecuación de estado se obtienen las tres formas equivalentes:</p>
<div class="eq key" data-name="Adiabática reversible del gas ideal">\[PV^k=\text{cte},\qquad TV^{k-1}=\text{cte},\qquad TP^{(1-k)/k}=\text{cte}.\]</div>
<p>La adiabática es más empinada que la isoterma en el diagrama \(P\)–\(V\) (pendiente \(k\) veces mayor): al comprimir sin dejar escapar calor, la presión sube por dos causas, la reducción del volumen y el aumento de la temperatura. El capítulo 11 mostrará que este proceso es <b>isentrópico</b>.</p>
</section>

<section>
<h2>La familia politrópica</h2>
<p>Los procesos reales de compresión y expansión no son ni isotérmicos ni adiabáticos: el gas pierde algo de calor. Se describen muy bien con un <span class="term">proceso politrópico</span>, \(PV^n=\text{cte}\), con un exponente \(n\) que se mide. Todos los procesos anteriores son casos particulares: \(n=0\) (isobárico), \(n=1\) (isotérmico), \(n=k\) (adiabático) y \(n\to\infty\) (isocórico). Para el gas ideal,</p>
<div class="eq">\[W_b=\frac{mR(T_2-T_1)}{1-n},\qquad Q=W_b\,\frac{k-n}{k-1},\qquad \frac{T_2}{T_1}=\left(\frac{V_1}{V_2}\right)^{n-1}.\]</div>
<p>Cuando \(1&lt;n&lt;k\), una compresión calienta el gas pero le saca calor al mismo tiempo: es el caso de los compresores reales, con \(n\approx1.3\) para el aire.</p>
<div class="sim" data-sim="politropicos" data-title="La familia politrópica desde un mismo estado"></div>
<div class="sim-guide"><ul>
<li>Desde el estado 1 (100 kPa, 0.1 m³, 300 K) se comprime el aire hasta 0.02 m³. Isotérmicamente el trabajo consumido es 16.1 kJ; adiabáticamente, 22.6 kJ y la temperatura sube a 571 K.</li>
<li>Barra el exponente: el calor cambia de signo en \(n=k\). Entre 1 y \(k\) el gas se calienta y a la vez cede calor.</li>
<li>Las curvas de temperatura constante (en gris) muestran cómo la adiabática corta las isotermas: en una compresión adiabática el gas salta de una isoterma a otra más caliente.</li>
</ul></div>
</section>

<section>
<h2>Compresiones rápidas: el motor diésel y la bomba de bicicleta</h2>
<p>En 1893 Rudolf Diesel patentó un motor que no necesitaba bujía: comprime solo aire, tan rápido que casi no pierde calor, hasta que su temperatura supera la de autoignición del combustible (unos 210 °C para el gasóleo), y entonces lo inyecta. Con una relación de compresión de 18, el aire a 27 °C llega a</p>
<div class="eq">\[T_2=T_1r^{k-1}=300\times18^{0.4}=953\ \text{K}=680\ °\text{C},\qquad P_2=P_1r^k=57\ P_1.\]</div>
<p>El mismo principio tiene el pistón de fuego del sudeste asiático, que enciende yesca con un golpe de la mano. La bomba de bicicleta se calienta por la misma razón, aunque mucho menos de lo que predice el cálculo adiabático (comprimir aire de 81.9 a 600 kPa daría 518 K), porque el bombeo es lento y la bomba disipa calor.</p>
<div class="sim" data-sim="compresion-rapida" data-title="Compresión con transferencia de calor: del proceso isotérmico al adiabático"></div>
<div class="sim-guide"><ul>
<li>El modelo resuelve la primera ley con un coeficiente de transferencia de calor a la pared: \(mc_v\dot T=-P\dot V+hA(T_w-T)\). El exponente politrópico <b>no se supone</b>: se calcula del resultado.</li>
<li>Compresión lenta (varios segundos): \(n\to1\). Compresión en una centésima de segundo, como en un motor a 3000 rpm: \(n\to k\).</li>
<li>El parámetro que decide es el cociente entre el tiempo de compresión y el tiempo térmico \(mc_v/hA\).</li>
</ul></div>
</section>

<section>
<h2>Medir γ: el experimento de Rüchardt</h2>
<p>En 1929 Eduard Rüchardt midió el cociente \(\gamma=c_p/c_v\) con un frasco grande y un tubo vertical de vidrio en el que ajusta una esfera de acero. Si la esfera baja una distancia \(y\), comprime el gas; la presión sube \(\Delta P=-\gamma P\,Ay/V\) (adiabática, porque la oscilación es rápida) y empuja la esfera hacia arriba. Es un oscilador armónico:</p>
<div class="eq key" data-name="Oscilador de Rüchardt">\[m\ddot y=-\frac{\gamma PA^2}{V}\,y\qquad\Longrightarrow\qquad \gamma=\frac{4\pi^2mV}{A^2P\tau^2}.\]</div>
<p>Con un frasco de 10 L, un tubo de 16 mm y una esfera de 16.6 g, el período es de 1.18 s en Popayán: fácil de medir con un cronómetro. El método da \(\gamma\) con un 2–5 % de error; la fricción y la fuga de gas alrededor de la esfera lo sesgan hacia abajo.</p>
<div class="sim" data-sim="ruchardt" data-title="Oscilador de Rüchardt: medir γ con un frasco y una esfera"></div>
<div class="sim-guide"><ul>
<li>Elija el gas: el argón (\(\gamma=5/3\)) oscila más rápido que el aire (1.40) y el CO₂ (1.29). La diferencia es medible a mano.</li>
<li>Active el modo isotérmico (oscilación hipotéticamente lenta): el período aumenta en \(\sqrt\gamma\). Rüchardt confirmó así que la oscilación es adiabática.</li>
<li>El simulador «mide» el período contando cruces por cero y despeja \(\gamma\), igual que en el laboratorio.</li>
</ul></div>
<div class="box ex"><h4>La neblina al destapar una gaseosa</h4>
<p>El gas en el cuello de una botella está a 3.5 atm y 20 °C. Al destaparla, se expande casi adiabáticamente hasta 1 atm. ¿A qué temperatura llega?</p>
<details><summary>Solución</summary><p>\(T_2=T_1(P_2/P_1)^{(k-1)/k}\). El gas es casi todo CO₂ (\(k=1.29\)): \(T_2=293(1/3.5)^{0.225}=221\) K \(=-52\) °C. El vapor de agua del cuello se condensa en una neblina instantánea. (La expansión no es del todo reversible, así que el enfriamiento real es algo menor.)</p></details>
</div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Aire a 100 kPa y 20 °C se comprime adiabática y reversiblemente hasta 800 kPa. Halle \(T_2\) y el trabajo por kilogramo.
<details><summary>Respuesta</summary><p>\(T_2=293.15(8)^{0.2857}=531\) K; \(w=c_v(T_2-T_1)=0.718(238)=171\) kJ/kg consumidos.</p></details></li>
<li><span class="lvl">Básico</span>¿Qué relación de compresión necesita un motor diésel para llevar aire de 27 °C a 500 °C adiabáticamente?
<details><summary>Respuesta</summary><p>\(r=(773/300)^{2.5}=10.7\).</p></details></li>
<li><span class="lvl">Intermedio</span>Un compresor comprime aire politrópicamente con \(n=1.3\) de 100 kPa y 300 K a 900 kPa. Halle el trabajo de frontera y el calor por kilogramo.
<details><summary>Respuesta</summary><p>\(T_2=300(9)^{0.3/1.3}=498.1\) K; \(w=R(T_2-T_1)/(1-n)=-189.5\) kJ/kg; \(q=w(k-n)/(k-1)=-47.4\) kJ/kg.</p></details></li>
<li><span class="lvl">Intermedio</span>En el experimento de Rüchardt con aire, el período medido es 1.21 s con los datos del texto. ¿Qué \(\gamma\) resulta?
<details><summary>Respuesta</summary><p>\(\gamma=1.40(1.183/1.21)^2=1.34\): un 4 % bajo, típico por la fuga de aire alrededor de la esfera.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que en el diagrama \(P\)–\(V\) la pendiente de la adiabática es \(k\) veces la de la isoterma que pasa por el mismo punto.
<details><summary>Respuesta</summary><p>Isoterma: \(\dd P/\dd V=-P/V\). Adiabática: \(\dd P/\dd V=-kP/V\). El cociente es \(k\).</p></details></li>
</ol>
<div class="box note"><h4>Para profundizar</h4><p>Çengel y Boles (2019), caps. 4 y 7. E. Rüchardt, «Eine einfache Methode zur Bestimmung von \(c_p/c_v\)», <em>Phys. Z.</em> 30, 58 (1929). J. B. Heywood, <em>Internal Combustion Engine Fundamentals</em>, 2.ª ed., McGraw-Hill, 2018, cap. 5.</p></div>
</section>

<!-- 08-volumen-control.html -->
<template class="chapter-src" data-id="volumen-control" data-num="8" data-title="Primera ley en volúmenes de control" data-part="Parte II · Primera ley" data-short="Conservación de la masa, trabajo de flujo y entalpía, dispositivos de flujo estacionario (toberas, turbinas, compresores, válvulas, mezcladores e intercambiadores), el efecto Joule–Thomson, la ducha eléctrica y el llenado de un tanque">
<p class="lead">Casi todos los equipos de ingeniería térmica tienen materia que entra y sale: turbinas, compresores, calderas, condensadores, toberas, válvulas, la ducha eléctrica y el propio cuerpo humano. Para ellos el sistema cerrado no sirve; hace falta seguir una región del espacio, un <span class="term">volumen de control</span>. Este capítulo extiende las leyes de conservación a esos sistemas abiertos y las aplica a los dispositivos que forman los ciclos de potencia y refrigeración.</p>

<section>
<h2>Conservación de la masa y trabajo de flujo</h2>
<p>La masa dentro de un volumen de control cambia según lo que entra y lo que sale:</p>
<div class="eq">\[\frac{\dd m_{VC}}{\dd t}=\sum_{ent}\dot m-\sum_{sal}\dot m,\qquad \dot m=\rho VA=\frac{VA}{v}.\]</div>
<p>Para empujar un elemento de fluido de volumen \(V_e\) hacia dentro del volumen de control contra la presión \(P\), el fluido que viene detrás hace un trabajo \(PV_e\): por unidad de masa, \(Pv\). Es el <span class="term">trabajo de flujo</span>. La energía que transporta cada kilogramo que cruza la frontera es entonces \(u+Pv+\tfrac12V^2+gz=h+\tfrac12V^2+gz\). Esa es la razón profunda por la que la entalpía aparece en todo análisis de flujo.</p>
<div class="eq key" data-name="Primera ley, volumen de control">\[\frac{\dd E_{VC}}{\dd t}=\dot Q-\dot W+\sum_{ent}\dot m\left(h+\tfrac12V^2+gz\right)-\sum_{sal}\dot m\left(h+\tfrac12V^2+gz\right).\]</div>
<p>En <span class="term">flujo estacionario</span> nada cambia en el tiempo dentro del volumen de control. Con una entrada y una salida:</p>
<div class="eq">\[\dot Q-\dot W=\dot m\left[h_2-h_1+\tfrac12\left(V_2^2-V_1^2\right)+g(z_2-z_1)\right].\]</div>
</section>

<section>
<h2>Toberas y difusores</h2>
<p>Una <span class="term">tobera</span> acelera un fluido reduciendo su presión; un <span class="term">difusor</span> hace lo contrario. No hay trabajo, el calor es despreciable y la energía cinética es protagonista: \(V_2^2=V_1^2+2(h_1-h_2)\). Para un gas ideal en expansión isentrópica,</p>
<div class="eq">\[V_2=\sqrt{V_1^2+2c_pT_1\left[1-\left(\frac{P_2}{P_1}\right)^{(k-1)/k}\right]}.\]</div>
<p>Una caída de entalpía de apenas 44 kJ/kg acelera el aire de 30 a casi 300 m/s: la energía cinética es pequeña frente a la térmica, salvo en toberas, difusores y turbinas de gas. Si la presión de salida baja de la presión crítica, \(P^*=P_1[2/(k+1)]^{k/(k-1)}=0.528P_1\) para el aire, la tobera convergente se <b>ahoga</b>: en la garganta el flujo llega a la velocidad del sonido y no puede acelerarse más sin una sección divergente (la tobera de De Laval de los cohetes).</p>
<div class="sim" data-sim="tobera" data-title="Tobera convergente de aire: velocidad, temperatura y ahogamiento"></div>
<div class="sim-guide"><ul>
<li>Aire a 300 kPa y 400 K entra a 30 m/s y sale a 200 kPa: se enfría a 356 K y sale a 298 m/s.</li>
<li>Baje la presión de salida por debajo del 52.8 % de la de entrada: la velocidad queda fija en la del sonido en la garganta y el caudal no aumenta más.</li>
</ul></div>
</section>

<section>
<h2>Turbinas y compresores</h2>
<p>En una turbina el fluido entrega trabajo de eje al expandirse; en un compresor, una bomba o un ventilador, lo recibe. Las energías cinética y potencial suelen ser despreciables y, si el equipo está aislado, \(\dot W=\dot m(h_1-h_2)\). Las turbinas reales no son reversibles; se califican con la <span class="term">eficiencia isentrópica</span> (capítulo 11): \(\eta_T=(h_1-h_2)/(h_1-h_{2s})\), entre 0.85 y 0.92 en las grandes turbinas de vapor.</p>
<div class="sim" data-sim="turbina-vapor" data-title="Turbina de vapor en el diagrama de Mollier"></div>
<div class="sim-guide"><ul>
<li>Vapor a 3 MPa y 400 °C se expande hasta 10 kPa con eficiencia de 85 %: entrega 883 kJ/kg y sale con calidad 0.90. Con 10 kg/s, la potencia es 8.8 MW.</li>
<li>El diagrama \(h\)–\(s\) (de Mollier) es el de los diseñadores de turbinas: el trabajo es la caída vertical. La expansión real (línea roja) genera entropía y entrega menos trabajo que la isentrópica.</li>
<li>Una calidad de salida menor que 0.88 erosiona los álabes de las últimas etapas con gotas de agua; por eso se sobrecalienta el vapor.</li>
</ul></div>
</section>

<section>
<h2>Válvulas de estrangulamiento y el efecto Joule–Thomson</h2>
<p>Una válvula parcialmente cerrada, un tubo capilar o un tapón poroso producen una gran caída de presión sin trabajo, sin calor apreciable y sin cambio de energía cinética. La primera ley se reduce a</p>
<div class="eq key" data-name="Estrangulamiento">\[h_2=h_1.\]</div>
<p>Para un gas ideal \(h=h(T)\), así que la temperatura no cambia. Para un fluido real sí: el <span class="term">coeficiente de Joule–Thomson</span> \(\mu_{JT}=(\partial T/\partial P)_h\) mide cuánto. Joule y Thomson (Lord Kelvin) lo midieron entre 1852 y 1862 haciendo pasar gases por un tapón de algodón. A temperatura ambiente casi todos los gases se enfrían al expandirse (\(\mu_{JT}>0\)): el nitrógeno, unos 0.21 K/bar. El hidrógeno y el helio se calientan, porque están por encima de su <span class="term">temperatura de inversión</span> (202 K y 45 K). Linde (1895) usó el enfriamiento en cascada para licuar el aire, y todo refrigerador doméstico lo usa en su válvula de expansión.</p>
<div class="sim" data-sim="joule-thomson" data-title="Estrangulamiento: refrigerante, vapor de agua y gases reales"></div>
<div class="sim-guide"><ul>
<li>R-134a líquido saturado a 0.8 MPa (31.3 °C) que se estrangula a 0.12 MPa sale a −22.3 °C con calidad 0.34: el corazón de la nevera.</li>
<li>Con gases reales el cálculo usa Peng–Robinson con calores específicos estadísticos. El nitrógeno que pasa de 200 bar a 1 bar a 27 °C se enfría a −8 °C según Peng–Robinson; la ecuación de referencia da −4 °C. La diferencia mide la exactitud de las ecuaciones cúbicas para entalpías.</li>
<li>La curva de inversión separa la región donde el gas se enfría de aquella donde se calienta.</li>
</ul></div>
</section>

<section>
<h2>Cámaras de mezcla e intercambiadores: la ducha eléctrica</h2>
<p>En una <span class="term">cámara de mezcla</span> dos corrientes se juntan; si está aislada, \(\sum\dot m_eh_e=\sum\dot m_sh_s\). En un <span class="term">intercambiador de calor</span> dos fluidos intercambian energía sin mezclarse; el calor que pierde uno lo gana el otro.</p>
<p>La ducha eléctrica, muy común en Colombia, es un calentador de paso: el agua cruza una resistencia de 3 a 5.5 kW. Su balance es \(\dot W_{el}=\dot mc\,(T_2-T_1)\). Con 5.5 kW y un caudal de 5 L/min, el agua sube 15.8 °C: de 16 °C a casi 32 °C. Por eso hay que cerrar un poco el grifo en Popayán para bañarse con agua tibia: a menor caudal, mayor temperatura.</p>
<div class="sim" data-sim="ducha" data-title="La ducha eléctrica y el mezclador de agua"></div>
<div class="sim-guide"><ul>
<li>Ajuste el caudal: la temperatura de salida varía en proporción inversa. Duplicar el caudal reduce el salto a la mitad.</li>
<li>Active el mezclador con agua de un calentador a gas: la temperatura final es la media ponderada por los caudales.</li>
<li>El costo de energía usa la tarifa que se elija: un baño de 10 min a 5.5 kW consume 0.92 kWh.</li>
</ul></div>
</section>

<section>
<h2>Procesos transitorios: llenar un tanque</h2>
<p>Cuando la masa dentro del volumen de control cambia, la primera ley integrada entre los instantes 1 y 2 es</p>
<div class="eq">\[Q-W+\sum_{ent}m_eh_e-\sum_{sal}m_sh_s=m_2u_2-m_1u_1.\]</div>
<p>Un tanque vacío y aislado conectado a una línea de aire a \(T_l\) se llena hasta la presión de la línea. Sin calor ni trabajo, \(m_2u_2=m_2h_l\), y para un gas ideal con calores constantes, \(c_vT_2=c_pT_l\):</p>
<div class="eq">\[T_2=kT_l.\]</div>
<p>¡El aire dentro del tanque queda más caliente que el de la línea! Con la línea a 27 °C, el tanque llega a 147 °C. La energía extra es el trabajo de flujo que hizo el aire de la línea para empujar el que entraba. Al llenar un tanque de buceo, este calentamiento obliga a llenarlo lentamente o dentro de agua.</p>
<div class="sim" data-sim="llenado-tanque" data-title="Llenado de un tanque desde una línea de aire comprimido"></div>
<div class="sim-guide"><ul>
<li>El flujo por el orificio está ahogado al principio (la presión en el tanque es menor que el 52.8 % de la de la línea) y luego disminuye hasta detenerse.</li>
<li>Sin transferencia de calor la temperatura final es \(kT_l=420\) K, independiente de la presión de la línea. Con paredes conductoras, el aire se enfría hacia la temperatura ambiente y entra más masa.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Por una tubería de 5 cm de diámetro fluye agua a 2 m/s. Halle el caudal másico.
<details><summary>Respuesta</summary><p>\(\dot m=\rho VA=1000(2)(1.963\times10^{-3})=3.93\) kg/s.</p></details></li>
<li><span class="lvl">Básico</span>Una ducha de 4.5 kW calienta agua de 17 °C. ¿Qué caudal da agua a 38 °C?
<details><summary>Respuesta</summary><p>\(\dot m=4500/(4186\times21)=0.0512\) kg/s ≈ 3.1 L/min.</p></details></li>
<li><span class="lvl">Intermedio</span>Agua líquida saturada a 2 MPa se estrangula hasta 1 atm. Halle la temperatura y la calidad finales.
<details><summary>Respuesta</summary><p>\(h=908.5\) kJ/kg; a 101.3 kPa: \(T=99.97\) °C, \(x=0.217\). Es el «vapor flash» de las purgas de calderas.</p></details></li>
<li><span class="lvl">Intermedio</span>Un compresor aspira 0.5 kg/s de aire a 100 kPa y 20 °C y lo descarga a 600 kPa y 220 °C, perdiendo 8 kW de calor. Halle la potencia.
<details><summary>Respuesta</summary><p>\(\dot W=\dot Q-\dot m c_p\Delta T=-8-0.5(1.005)(200)=-108.5\) kW (consumidos).</p></details></li>
<li><span class="lvl">Avanzado</span>Un tanque rígido aislado de 0.1 m³ contiene aire a 100 kPa y 300 K y se conecta a una línea a 1 MPa y 300 K hasta igualar presiones. Halle la temperatura final y la masa que entra.
<details><summary>Respuesta</summary><p>Energía: \(m_2c_vT_2-m_1c_vT_1=(m_2-m_1)c_pT_l\), y como \(mc_vT=c_vPV/R\), el lado izquierdo es \(c_v(P_2-P_1)V/R\). Entonces \(m_2-m_1=(P_2-P_1)V/(kRT_l)\) y \(T_2=P_2/[P_1/T_1+(P_2-P_1)/(kT_l)]=1000/[0.3333+900/420]=403.8\) K. \(m_2=0.863\) kg, \(m_1=0.116\) kg: entran 0.747 kg.</p></details></li>
</ol>
<div class="box note"><h4>Para profundizar</h4><p>Çengel y Boles (2019), cap. 5. W. Thomson y J. P. Joule, «On the thermal effects of fluids in motion», <em>Phil. Trans. R. Soc.</em> 143, 357 (1853). A. H. Shapiro, <em>The Dynamics and Thermodynamics of Compressible Fluid Flow</em>, Ronald Press, 1953.</p></div>
</section>
</template>

<!-- 09-transferencia.html -->
<template class="chapter-src" data-id="transferencia" data-num="9" data-title="Mecanismos de transferencia de calor" data-part="Parte II · Primera ley" data-short="Conducción y ley de Fourier, resistencias térmicas y paredes compuestas, convección y ley de enfriamiento de Newton, el café que se enfría, aletas y disipadores, radiación de cuerpo negro y gris, e inercia térmica de muros">
<p class="lead">La termodinámica dice cuánta energía hay que transferir; la transferencia de calor dice con qué rapidez. Una pared, una taza de café, el disipador de un procesador y el cuerpo humano obedecen las mismas tres leyes: la de Fourier para la conducción, la de Newton para la convección y la de Stefan–Boltzmann para la radiación. Este capítulo las presenta con el detalle suficiente para resolver problemas de ingeniería y de la vida diaria.</p>

<section>
<h2>Conducción: la ley de Fourier</h2>
<p>En un sólido o un fluido en reposo, el calor fluye de las regiones calientes a las frías en proporción al gradiente de temperatura. Fourier (1822) lo escribió como</p>
<div class="eq key" data-name="Ley de Fourier">\[\vb q=-k\,\grad T,\qquad \dot Q=-kA\,\frac{\dd T}{\dd x}.\]</div>
<p>La <span class="term">conductividad térmica</span> \(k\) va de 0.026 W/m·K (aire quieto) a 400 W/m·K (cobre) y 2000 W/m·K (diamante). Los buenos aislantes (lana de vidrio, poliestireno expandido, plumas) son casi todo aire atrapado en celdas pequeñas que impiden la convección.</p>
<p>En una pared plana en régimen estacionario, \(\dot Q=kA\Delta T/L\). La analogía con la ley de Ohm es exacta: la diferencia de temperatura es el voltaje, el flujo de calor la corriente, y la pared tiene una <span class="term">resistencia térmica</span> \(R=L/kA\). Las resistencias en serie se suman; también las de convección en cada cara, \(R=1/hA\):</p>
<div class="eq key" data-name="Pared compuesta">\[\dot Q=\frac{T_{\infty,1}-T_{\infty,2}}{R_{total}},\qquad R_{total}=\frac1{h_1A}+\sum_i\frac{L_i}{k_iA}+\frac1{h_2A},\qquad U=\frac1{R_{total}A}.\]</div>
<p>El coeficiente global \(U\) (W/m²·K) es el número con el que se califican muros, techos y ventanas. Un muro de ladrillo macizo de 12 cm con revoque tiene \(U\approx2.7\); con 5 cm de poliestireno, 0.56: casi cinco veces menos pérdidas.</p>
<div class="sim" data-sim="pared-compuesta" data-title="Pared compuesta: resistencias térmicas en serie"></div>
<div class="sim-guide"><ul>
<li>El perfil de temperatura es una recta por capa; su pendiente es inversamente proporcional a \(k\). Las capas aislantes concentran casi toda la caída de temperatura.</li>
<li>Las resistencias superficiales (\(1/h\)) siguen la norma ISO 6946: 0.13 m²·K/W en el interior y 0.04 en el exterior.</li>
<li>La temperatura de la cara interior decide si hay condensación: si baja del punto de rocío del aire de la habitación (capítulo 17), aparece humedad y moho.</li>
</ul></div>
</section>

<section>
<h2>Convección: la ley de enfriamiento de Newton</h2>
<p>Entre una superficie y un fluido en movimiento el calor se transfiere por conducción en la capa límite y por el transporte del propio fluido. Newton propuso, y la ingeniería adoptó, una ley simple:</p>
<div class="eq key" data-name="Ley de enfriamiento de Newton">\[\dot Q=hA\,(T_s-T_\infty).\]</div>
<p>Toda la física queda en el <span class="term">coeficiente de convección</span> \(h\), que depende del fluido, de la geometría y del régimen de flujo: 2–25 W/m²·K en convección natural con aire, 25–250 con aire forzado, 100–20 000 con agua, y hasta 100 000 en ebullición y condensación. Se obtiene de correlaciones con números adimensionales; para una placa vertical en convección natural, por ejemplo, la de Churchill y Chu relaciona el número de Nusselt \(Nu=hL/k\) con el de Rayleigh, que mide la intensidad de la flotación.</p>
<p>Si un cuerpo es buen conductor comparado con la convección en su superficie (número de Biot \(Bi=hL_c/k&lt;0.1\)), su temperatura es casi uniforme y se enfría exponencialmente, \(T-T_\infty=(T_0-T_\infty)\ee^{-t/\tau}\), con \(\tau=mc/hA\). Es el <span class="term">modelo de parámetros concentrados</span>.</p>
<div class="sim" data-sim="cafe" data-title="Una taza de café que se enfría: convección, radiación y evaporación"></div>
<div class="sim-guide"><ul>
<li>El modelo suma tres pérdidas por la superficie abierta y la pared de la taza: convección natural, radiación (\(\varepsilon=0.95\)) y evaporación. Con la tapa puesta, la evaporación desaparece.</li>
<li>Al principio la evaporación es la pérdida dominante: crece casi exponencialmente con la temperatura porque depende de la presión de vapor. Por eso el café sin tapa no sigue la ley de Newton: se enfría más rápido al comienzo.</li>
<li>Los coeficientes son estimaciones típicas (convección natural, analogía de Lewis para la evaporación); el modelo da unos 12 min para bajar de 85 °C a 60 °C con la taza abierta en Popayán, dentro del intervalo de las mediciones caseras con tazas de cerámica (10 a 25 min, según la taza y las corrientes de aire). A mayor altitud el aire es menos denso y el vapor se difunde más rápido: el café se enfría algo antes.</li>
<li>¿Leche antes o después? Si se agrega la leche fría al principio, el café queda más frío durante la espera y pierde menos calor: llega más caliente al final.</li>
</ul></div>
</section>

<section>
<h2>Aletas y disipadores</h2>
<p>Para aumentar la transferencia de calor desde una superficie se le agregan <span class="term">aletas</span>: más área expuesta al fluido. Pero la aleta no está toda a la temperatura de la base; se enfría a lo largo. Para una aleta de sección constante con extremo aislado,</p>
<div class="eq">\[\frac{T(x)-T_\infty}{T_b-T_\infty}=\frac{\cosh m(L-x)}{\cosh mL},\qquad m=\sqrt{\frac{hP}{kA_c}},\qquad \eta_{aleta}=\frac{\tanh mL}{mL}.\]</div>
<p>La eficiencia de la aleta compara el calor que disipa con el que disiparía si estuviera toda a la temperatura de la base. Una aleta muy larga desperdicia material: más allá de \(mL\approx2\) casi no aporta. Por eso los disipadores de computadores usan aluminio o cobre (\(k\) alto), aletas delgadas y ventiladores (\(h\) alto).</p>
<div class="sim" data-sim="aleta" data-title="Perfil de temperatura y eficiencia de una aleta"></div>
<div class="sim-guide"><ul>
<li>Un pasador de aluminio de 5 mm de diámetro y 5 cm de largo, en aire quieto (\(h=15\)), tiene eficiencia 0.95: es casi isotérmico.</li>
<li>Cambie a acero inoxidable (\(k=16\)) o a un plástico: la eficiencia se desploma. Con ventilador (\(h=100\)) también cae, pero el calor total sube.</li>
</ul></div>
</section>

<section>
<h2>Radiación térmica</h2>
<p>Todo cuerpo por encima del cero absoluto emite ondas electromagnéticas por la agitación térmica de sus cargas. Un <span class="term">cuerpo negro</span>, que absorbe toda la radiación que le llega, emite el espectro de Planck (capítulo 22), cuyo máximo sigue la ley de desplazamiento de Wien y cuya potencia total sigue la de Stefan–Boltzmann:</p>
<div class="eq key" data-name="Radiación de cuerpo negro">\[\lambda_{max}T=2897.8\ \mu\text{m·K},\qquad E_b=\sigma T^4,\quad \sigma=5.670\times10^{-8}\ \text{W/m}^2\text{K}^4.\]</div>
<p>El Sol (5772 K) emite con máximo en 502 nm, en el verde, y el 37 % de su energía cae en el visible. Un bombillo incandescente (2800 K) tiene el máximo en 1.03 µm, en el infrarrojo: solo el 6 % de su emisión es luz visible. El cuerpo humano (34 °C en la piel) emite con máximo en 9.4 µm, el infrarrojo que ven las cámaras térmicas.</p>
<p>Las superficies reales emiten una fracción \(\varepsilon\) (emisividad) del cuerpo negro. Un cuerpo pequeño de área \(A\) dentro de un recinto grande a \(T_{alr}\) intercambia</p>
<div class="eq">\[\dot Q_{rad}=\varepsilon\sigma A\left(T_s^4-T_{alr}^4\right).\]</div>
<p>Una persona desnuda con la piel a 34 °C en una habitación con paredes a 20 °C pierde unos 150 W por radiación y 100 W por convección: más que su metabolismo en reposo (unos 100 W). La ropa reduce la temperatura de la superficie expuesta y nos permite estar cómodos.</p>
<div class="sim" data-sim="radiacion" data-title="Espectro de Planck, ley de Wien y radiación de superficies"></div>
<div class="sim-guide"><ul>
<li>Arrastre la temperatura del cuerpo humano al Sol: el máximo se corre a longitudes de onda cortas y la potencia crece como \(T^4\) (cinco órdenes de magnitud).</li>
<li>La banda sombreada es el visible (0.4–0.7 µm): la fracción visible de un bombillo de 2800 K es de apenas 6 %, la de un LED blanco no se describe con Planck.</li>
</ul></div>
</section>

<section>
<h2>Inercia térmica: muros que retrasan el calor</h2>
<p>En régimen transitorio la ecuación del calor es \(\partial T/\partial t=\alpha\,\partial^2T/\partial x^2\), con la <span class="term">difusividad</span> \(\alpha=k/\rho c\). Una variación periódica de temperatura en una cara penetra amortiguándose como \(\ee^{-x/\delta}\), con profundidad de penetración \(\delta=\sqrt{\alpha P/\pi}\) para un período \(P\). Para el ciclo diario en ladrillo o adobe, \(\delta\approx11\) cm.</p>
<p>Por eso los muros gruesos de adobe y bahareque de la arquitectura tradicional del Cauca mantienen el interior fresco de día y templado de noche: la onda térmica exterior llega al interior atenuada y con horas de retraso. Un muro liviano de panel de yeso, con poca masa, deja pasar la onda casi sin retraso.</p>
<div class="sim" data-sim="muro-diario" data-title="Ciclo diario de temperatura a través de un muro"></div>
<div class="sim-guide"><ul>
<li>La temperatura exterior oscila ±8 °C alrededor de 18 °C (un día típico de Popayán, con sol). El simulador resuelve la ecuación del calor en el muro con diferencias finitas.</li>
<li>Con 30 cm de adobe, la oscilación en la cara interior es una fracción pequeña de la exterior y llega con unas 8–10 horas de retraso. Con panel de yeso, casi sin retraso.</li>
<li>El aislamiento reduce el flujo medio; la masa térmica amortigua las oscilaciones. Son dos virtudes distintas.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una ventana de vidrio de 1.5 m² y 4 mm (\(k=0.96\)) separa 20 °C interiores de 10 °C exteriores. Con \(h_i=8\) y \(h_e=25\) W/m²·K, halle la pérdida de calor.
<details><summary>Respuesta</summary><p>\(R''=0.125+0.0042+0.04=0.169\) m²·K/W; \(\dot Q=1.5\times10/0.169=88.7\) W. Casi toda la resistencia está en las películas de aire.</p></details></li>
<li><span class="lvl">Básico</span>¿A qué longitud de onda emite con máximo un horno a 1000 °C?
<details><summary>Respuesta</summary><p>\(2897.8/1273=2.28\) µm.</p></details></li>
<li><span class="lvl">Intermedio</span>Una esfera de acero de 2 cm de diámetro (\(\rho=7850\), \(c=460\), \(k=45\)) a 300 °C se enfría en aire a 25 °C con \(h=20\). Compruebe que vale el modelo concentrado y halle el tiempo para llegar a 100 °C.
<details><summary>Respuesta</summary><p>\(L_c=V/A=r/3=3.33\) mm, \(Bi=0.0015\). \(\tau=\rho cL_c/h=602\) s; \(t=\tau\ln(275/75)=782\) s ≈ 13 min.</p></details></li>
<li><span class="lvl">Intermedio</span>Compare la pérdida por radiación de un radiador negro (\(\varepsilon=0.95\)) y de uno de aluminio pulido (\(\varepsilon=0.05\)), ambos de 1 m² a 60 °C en una sala a 20 °C.
<details><summary>Respuesta</summary><p>\(\sigma(333^4-293^4)=280\) W/m²: 266 W frente a 14 W. Los «radiadores» calientan sobre todo por convección, pero la pintura importa.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que para una aleta infinitamente larga \(\dot Q=\sqrt{hPkA_c}\,(T_b-T_\infty)\) y discuta cuándo la aproximación es buena.
<details><summary>Respuesta</summary><p>Con \(L\to\infty\), \(T-T_\infty\propto\ee^{-mx}\) y \(\dot Q=-kA_c\,\dd T/\dd x|_0=kA_cm(T_b-T_\infty)\). Basta \(mL>2.65\) para que \(\tanh mL>0.99\).</p></details></li>
</ol>
<div class="box note"><h4>Para profundizar</h4><p>T. L. Bergman, A. S. Lavine, F. P. Incropera y D. P. DeWitt, <em>Fundamentals of Heat and Mass Transfer</em>, 8.ª ed., Wiley, 2018. Y. A. Çengel y A. J. Ghajar, <em>Transferencia de calor y masa</em>, 5.ª ed., McGraw-Hill, 2015. ISO 6946:2017, <em>Building components and building elements — Thermal resistance and thermal transmittance</em>. J. Fourier, <em>Théorie analytique de la chaleur</em>, 1822.</p></div>
