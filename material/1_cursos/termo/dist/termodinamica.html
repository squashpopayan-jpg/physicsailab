<!-- 16-relaciones.html -->
<template class="chapter-src" data-id="relaciones" data-num="16" data-title="Potenciales y relaciones termodinámicas" data-part="Parte V · Relaciones, mezclas y reacciones" data-short="Energía interna, entalpía, energías de Helmholtz y de Gibbs, transformadas de Legendre, relaciones de Maxwell comprobadas con las tablas de vapor, ecuación de Clapeyron, relaciones generales para du, dh, ds y cp − cv, y el agua por debajo de 4 °C">
<p class="lead">Las tablas de vapor contienen \(h\), \(s\) y \(u\), pero ningún instrumento mide la entropía ni la entalpía: se miden presiones, temperaturas, volúmenes y calores específicos. ¿Cómo se obtienen las demás? Con relaciones exactas entre derivadas parciales que se deducen de que las propiedades son funciones de estado. Este capítulo construye esa maquinaria, la comprueba numéricamente con las tablas del agua y la usa para explicar fenómenos como la pendiente de la curva de ebullición y el comportamiento del agua cerca de 4 °C.</p>

<section>
<h2>Los cuatro potenciales termodinámicos</h2>
<p>Para un sistema simple compresible, la combinación de la primera y la segunda ley da la <span class="term">relación fundamental</span> \(\dd U=T\,\dd S-P\,\dd V\). La energía interna, vista como función de \(S\) y \(V\), lo contiene todo: sus derivadas dan \(T=(\partial U/\partial S)_V\) y \(P=-(\partial U/\partial V)_S\). Pero \(S\) y \(V\) son variables incómodas de controlar en el laboratorio. Las <span class="term">transformadas de Legendre</span> cambian una variable natural por su conjugada sin perder información:</p>
<div class="tablewrap"><table>
<tr><th>Potencial</th><th class="c">Definición</th><th class="c">Diferencial</th><th>Uso</th></tr>
<tr><td>Energía interna</td><td class="c">\(U\)</td><td class="c">\(\dd U=T\dd S-P\dd V\)</td><td>Sistemas aislados</td></tr>
<tr><td>Entalpía</td><td class="c">\(H=U+PV\)</td><td class="c">\(\dd H=T\dd S+V\dd P\)</td><td>Flujo, procesos isobáricos</td></tr>
<tr><td>Energía de Helmholtz</td><td class="c">\(A=U-TS\)</td><td class="c">\(\dd A=-S\dd T-P\dd V\)</td><td>Sistemas a \(T\) y \(V\) fijos; mecánica estadística</td></tr>
<tr><td>Energía de Gibbs</td><td class="c">\(G=H-TS\)</td><td class="c">\(\dd G=-S\dd T+V\dd P\)</td><td>Fases y reacciones a \(T\) y \(P\) fijos</td></tr>
</table></div>
<p>Cada potencial es mínimo en el equilibrio cuando se fijan sus variables naturales: la energía de Gibbs, por ejemplo, decide qué fase es estable a una \(T\) y \(P\) dadas y hacia dónde avanza una reacción química (capítulo 18). Las ecuaciones de referencia modernas, como la IAPWS-95 del agua, son expresiones de la energía de Helmholtz \(a(\rho,T)\): todas las propiedades de las tablas se obtienen derivándola.</p>
<p>Como \((\partial g/\partial T)_P=-s\), la energía de Gibbs de cada fase cae con la temperatura, y más rápido la de la fase con más entropía. Las curvas del sólido, del líquido y del vapor se cruzan: en cada cruce, dos fases tienen la misma \(g\) y coexisten. Así se explican, con un solo principio, las temperaturas de fusión y de ebullición.</p>
<div class="sim" data-sim="gibbs-fases" data-title="Energía de Gibbs de las tres fases del agua: la fase estable es la de menor g"></div>
<div class="sim-guide"><ul>
<li>Se grafica \(g\) de cada fase menos la del líquido. El líquido es estable entre los dos cruces; por debajo gana el hielo, por encima el vapor.</li>
<li>Al bajar la presión, la curva del vapor baja (\(g_v\) depende de \(RT\ln P\)) y el cruce con el líquido se mueve a menor temperatura: el agua hierve antes en la montaña.</li>
<li>Por debajo de 611.657 Pa, el vapor corta al hielo antes que al líquido: el hielo sublima, como la escarcha que desaparece sin derretirse en los páramos.</li>
</ul></div>
</section>

<section>
<h2>Las relaciones de Maxwell</h2>
<p>Si \(\dd z=M\,\dd x+N\,\dd y\) es una diferencial exacta, las derivadas cruzadas son iguales: \((\partial M/\partial y)_x=(\partial N/\partial x)_y\). Aplicado a los cuatro potenciales:</p>
<div class="eq key" data-name="Relaciones de Maxwell">\[\left(\frac{\partial T}{\partial V}\right)_S=-\left(\frac{\partial P}{\partial S}\right)_V,\quad \left(\frac{\partial T}{\partial P}\right)_S=\left(\frac{\partial V}{\partial S}\right)_P,\quad \left(\frac{\partial S}{\partial V}\right)_T=\left(\frac{\partial P}{\partial T}\right)_V,\quad \left(\frac{\partial S}{\partial P}\right)_T=-\left(\frac{\partial V}{\partial T}\right)_P.\]</div>
<p>Las dos últimas son las útiles: expresan cómo cambia la entropía, que no se mide, en términos de la ecuación de estado \(P\)–\(v\)–\(T\), que sí. Por ejemplo, la cuarta dice que comprimir isotérmicamente un fluido que se dilata al calentarse reduce su entropía.</p>
<div class="sim" data-sim="maxwell-check" data-title="Las relaciones de Maxwell comprobadas con las tablas del agua"></div>
<div class="sim-guide"><ul>
<li>El simulador calcula ambos lados de una relación de Maxwell por diferencias finitas sobre las tablas IAPWS-95. Coinciden dentro de la precisión de la interpolación (mejor que 0.1 %).</li>
<li>Para vapor a 1 MPa y 300 °C, \((\partial s/\partial P)_T=-4.960\times10^{-4}\) y \(-(\partial v/\partial T)_P=-4.959\times10^{-4}\), en m³/kg·K.</li>
<li>Compare con el gas ideal: \(-(\partial v/\partial T)_P=-R/P=-4.615\times10^{-4}\). La diferencia de 7 % es la no idealidad del vapor.</li>
</ul></div>
</section>

<section>
<h2>La ecuación de Clapeyron</h2>
<p>Durante un cambio de fase a temperatura fija la presión también es fija, así que \((\partial P/\partial T)_v\) es simplemente la pendiente de la curva de saturación. Integrando la tercera relación de Maxwell a lo largo de la evaporación, \(s_{fg}=(\dd P/\dd T)_{sat}\,v_{fg}\), y como \(s_{fg}=h_{fg}/T\):</p>
<div class="eq key" data-name="Ecuación de Clapeyron">\[\left(\frac{\dd P}{\dd T}\right)_{sat}=\frac{h_{fg}}{T\,v_{fg}}.\]</div>
<p>Permite calcular el calor latente a partir de mediciones de presión de vapor y volúmenes, sin calorímetro. Si el vapor es un gas ideal y el volumen del líquido es despreciable, \(v_{fg}\approx RT/P\) y se obtiene la ecuación de <span class="term">Clausius–Clapeyron</span>:</p>
<div class="eq">\[\frac{\dd\ln P}{\dd T}=\frac{h_{fg}}{RT^2}\qquad\Longrightarrow\qquad \ln\frac{P_2}{P_1}\approx\frac{h_{fg}}{R}\left(\frac1{T_1}-\frac1{T_2}\right).\]</div>
<p>Con ella, la presión de vapor del agua crece un 6–7 % por grado a temperatura ambiente: la razón de que el aire caliente pueda contener mucho más vapor que el frío, con enormes consecuencias meteorológicas.</p>
<div class="sim" data-sim="clapeyron" data-title="Clapeyron exacta y aproximación de Clausius–Clapeyron"></div>
<div class="sim-guide"><ul>
<li>A 100 °C, la pendiente medida de la curva de saturación es 3619 Pa/K; la ecuación de Clapeyron con \(h_{fg}\) y \(v_{fg}\) de las tablas da 3619 Pa/K. Clausius–Clapeyron da 3561 Pa/K (1.6 % menos).</li>
<li>Cerca del punto crítico la aproximación falla por completo: el vapor ya no es ideal y el volumen del líquido no es despreciable.</li>
<li>Para la fusión del hielo, \(v_{sf}&lt;0\) y la pendiente es negativa: −13.5 MPa/K (capítulo 3).</li>
</ul></div>
</section>

<section>
<h2>Relaciones generales para u, h, s y los calores específicos</h2>
<p>Con las relaciones de Maxwell se escriben los cambios de energía interna, entalpía y entropía de cualquier sustancia en función de la ecuación de estado y de un calor específico:</p>
<div class="eq">\[\dd u=c_v\,\dd T+\left[T\left(\frac{\partial P}{\partial T}\right)_v-P\right]\dd v,\qquad \dd s=\frac{c_p}{T}\dd T-\left(\frac{\partial v}{\partial T}\right)_P\dd P.\]</div>
<p>Para un gas ideal, \(T(\partial P/\partial T)_v-P=0\): queda demostrado que \(u\) solo depende de \(T\). Con el coeficiente de dilatación \(\beta=\frac1v(\partial v/\partial T)_P\) y la compresibilidad isotérmica \(\kappa=-\frac1v(\partial v/\partial P)_T\), la diferencia entre los calores específicos es</p>
<div class="eq key" data-name="Diferencia de calores específicos">\[c_p-c_v=\frac{Tv\beta^2}{\kappa}\ \ge0,\]</div>
<p>que vale \(R\) para el gas ideal y es pequeña para sólidos y líquidos. El agua líquida ofrece un caso notable: su densidad es máxima a 3.98 °C, donde \(\beta=0\) y por lo tanto \(c_p=c_v\). Por debajo de esa temperatura, \(\beta&lt;0\): el agua se contrae al calentarse, y una compresión adiabática la <b>enfría</b>.</p>
<div class="sim" data-sim="cp-cv" data-title="El agua líquida: dilatación anómala y diferencia de calores específicos"></div>
<div class="sim-guide"><ul>
<li>Los datos de \(\beta\), \(\kappa\), \(c_p\) y \(c_v\) a 1 atm provienen de IAPWS-95. La curva calcula \(c_p-c_v=Tv\beta^2/\kappa\) y los puntos muestran la diferencia directa de las tablas: coinciden.</li>
<li>A 4 °C ambas se anulan. Por eso los lagos se estratifican: el agua a 4 °C, la más densa, se queda en el fondo y no se congela.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Demuestre la relación \((\partial S/\partial P)_T=-(\partial V/\partial T)_P\) a partir de \(\dd G\).
<details><summary>Respuesta</summary><p>\(\dd G=-S\,\dd T+V\,\dd P\) es exacta; igualando las derivadas cruzadas, \(-(\partial S/\partial P)_T=(\partial V/\partial T)_P\).</p></details></li>
<li><span class="lvl">Básico</span>Con Clausius–Clapeyron y \(h_{fg}=2257\) kJ/kg, estime la presión de vapor del agua a 94 °C partiendo de 101.325 kPa a 100 °C.
<details><summary>Respuesta</summary><p>\(\ln(P/101.325)=(2257/0.4615)(1/373.15-1/367.15)=-0.2142\); \(P=81.8\) kPa. La tabla da 81.5 kPa: es casi la presión atmosférica de Popayán.</p></details></li>
<li><span class="lvl">Intermedio</span>Estime \(h_{fg}\) del R-134a a 0 °C a partir de su presión de vapor a −2 °C (272.2 kPa) y 2 °C (314.6 kPa), \(v_g=0.0693\) y \(v_f=0.00077\) m³/kg.
<details><summary>Respuesta</summary><p>\(\dd P/\dd T\approx42.4/4=10.60\) kPa/K; \(h_{fg}=Tv_{fg}\,\dd P/\dd T=273.15(0.06853)(10.60)=198.4\) kJ/kg (tabla: 198.6).</p></details></li>
<li><span class="lvl">Intermedio</span>Calcule \(c_p-c_v\) del cobre a 300 K (\(v=7.11\times10^{-6}\) m³/mol, \(\beta=5.0\times10^{-5}\) K⁻¹, \(\kappa=7.3\times10^{-12}\) Pa⁻¹).
<details><summary>Respuesta</summary><p>\(300(7.11\times10^{-6})(2.5\times10^{-9})/7.3\times10^{-12}=0.73\) J/mol·K, un 3 % de \(c_p=24.4\).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que el coeficiente de Joule–Thomson es \(\mu_{JT}=\frac{v}{c_p}(T\beta-1)\) y que se anula para el gas ideal.
<details><summary>Respuesta</summary><p>De \(\dd h=c_p\dd T+[v-T(\partial v/\partial T)_P]\dd P\), con \(\dd h=0\): \(\mu_{JT}=(\partial T/\partial P)_h=[T(\partial v/\partial T)_P-v]/c_p=v(T\beta-1)/c_p\). Para el gas ideal \(\beta=1/T\).</p></details></li>
</ol>
<div class="box note"><h4>Para profundizar</h4><p>Callen (1985), caps. 5–7. Çengel y Boles (2019), cap. 12. J. C. Maxwell, <em>Theory of Heat</em>, Longmans, 1871. W. Wagner y A. Pruß (2002), sección 6 (derivación de las propiedades a partir de la energía de Helmholtz).</p></div>
</section>
</template>

<!-- 17-psicrometria.html -->
<template class="chapter-src" data-id="psicrometria" data-num="17" data-title="Mezclas de gases y aire húmedo" data-part="Parte V · Relaciones, mezclas y reacciones" data-short="Leyes de Dalton y Amagat, propiedades de mezclas de gases ideales, aire húmedo, humedad específica y relativa, punto de rocío, temperatura de bulbo húmedo, carta psicrométrica a cualquier altitud, acondicionamiento de aire, enfriamiento evaporativo y condensación en muros y ventanas">
<p class="lead">El aire que respiramos es una mezcla de nitrógeno, oxígeno, argón y una cantidad variable de vapor de agua. Ese vapor, apenas el 1–2 % de la masa, decide si el día es bochornoso o seco, si una pared se llena de moho, si el aire acondicionado gotea y cuánto enfría un ventilador mojado. La <em>psicrometría</em> es la termodinámica del aire húmedo. Este capítulo la construye desde las mezclas de gases ideales y la aplica a las ciudades colombianas, cuya altitud cambia la carta psicrométrica.</p>

<section>
<h2>Mezclas de gases ideales</h2>
<p>La composición de una mezcla se describe con las <span class="term">fracciones molares</span> \(y_i=N_i/N\) o las <span class="term">fracciones másicas</span> \(mf_i=m_i/m\). La masa molar aparente es \(M=\sum y_iM_i\): 28.96 g/mol para el aire seco.</p>
<p>Dalton (1801) observó que cada gas de una mezcla ideal se comporta como si ocupara solo todo el volumen; Amagat (1880), que cada uno ocupa una fracción del volumen a la presión total. Para gases ideales ambas leyes coinciden:</p>
<div class="eq key" data-name="Leyes de Dalton y Amagat">\[P_i=y_iP,\qquad V_i=y_iV,\qquad \frac{P_i}{P}=\frac{V_i}{V}=\frac{N_i}{N}=y_i.\]</div>
<p>Las propiedades extensivas de la mezcla son la suma de las de sus componentes, cada uno evaluado a la temperatura de la mezcla y a su presión parcial: \(U=\sum m_iu_i(T)\), \(H=\sum m_ih_i(T)\), \(S=\sum m_is_i(T,P_i)\). El último término contiene la entropía de mezcla del capítulo 11.</p>
</section>

<section>
<h2>Aire húmedo</h2>
<p>A las temperaturas ambiente, el vapor de agua del aire está a presiones parciales de unos pocos kilopascales y se comporta como gas ideal. Se definen:</p>
<ul>
<li>la <span class="term">humedad específica</span> o razón de humedad, \(\omega=m_v/m_a=0.622\,P_v/(P-P_v)\), en kg de vapor por kg de aire seco;</li>
<li>la <span class="term">humedad relativa</span>, \(\phi=P_v/P_{sat}(T)\), cuánto vapor hay frente al máximo posible a esa temperatura;</li>
<li>el <span class="term">punto de rocío</span> \(T_{pr}\), la temperatura a la que el aire enfriado a presión constante se satura y empieza a condensar: \(P_{sat}(T_{pr})=P_v\);</li>
<li>la <span class="term">entalpía por kilogramo de aire seco</span>, \(h=1.006\,T+\omega(2501+1.86\,T)\) kJ/kg (con \(T\) en °C).</li>
</ul>
<p>Como \(P_{sat}\) crece exponencialmente con \(T\) (capítulo 16), el mismo aire tiene humedad relativa alta de madrugada y baja al mediodía sin que cambie su contenido de agua. Y como \(\omega\) depende de la presión total, en la altura el mismo \(\phi\) significa más agua por kilogramo de aire: a 20 °C y 75 %, el aire de Popayán tiene 13.6 g/kg y el del nivel del mar 11.0 g/kg.</p>
<h3>Bulbo húmedo y saturación adiabática</h3>
<p>Si el aire pasa por un canal largo sobre agua y sale saturado sin intercambiar calor, su temperatura final es la <span class="term">temperatura de saturación adiabática</span>, que se obtiene del balance de energía. Un termómetro con la ampolla envuelta en una mecha húmeda, ventilado, marca casi esa misma temperatura: la de <span class="term">bulbo húmedo</span>. El psicrómetro de dos termómetros, seco y húmedo, permite así medir la humedad. En Popayán, con 20 °C y 75 %, el bulbo húmedo marca 16.9 °C y el punto de rocío es 15.4 °C.</p>
</section>

<section>
<h2>La carta psicrométrica</h2>
<p>Todas estas propiedades, para una presión dada, se reúnen en la <span class="term">carta psicrométrica</span>: la temperatura de bulbo seco en el eje horizontal, la humedad específica en el vertical, y curvas de humedad relativa, rectas casi paralelas de bulbo húmedo y de entalpía. Las cartas impresas suelen ser para el nivel del mar; para Bogotá o Popayán hay que usar la de su presión atmosférica, o calcular, como hace el simulador.</p>
<div class="sim" data-sim="carta" data-title="Carta psicrométrica a cualquier altitud"></div>
<div class="sim-guide"><ul>
<li>Elija la ciudad o la altitud; las curvas se recalculan con la presión de la atmósfera estándar. Haga clic sobre la carta para escoger el estado del aire.</li>
<li>Las propiedades se calculan con la presión de vapor de Wagner–Pruß; la validación contra la formulación de aire húmedo de CoolProp (ASHRAE RP-1485) da diferencias menores que 0.6 % en ω y 0.15 °C en el bulbo húmedo.</li>
<li>La zona sombreada es la de confort térmico aproximada para actividad sedentaria con ropa ligera.</li>
</ul></div>
</section>

<section>
<h2>Acondicionamiento de aire</h2>
<p>Cada equipo de acondicionamiento produce un proceso sencillo sobre la carta:</p>
<ul>
<li><b>Calentamiento o enfriamiento sensible</b>: \(\omega\) constante, línea horizontal. Al calentar, la humedad relativa cae: el aire de una calefacción se siente seco.</li>
<li><b>Enfriamiento con deshumidificación</b>: el serpentín frío enfría el aire por debajo de su punto de rocío; el agua se condensa y gotea. Luego suele recalentarse para bajar la humedad relativa.</li>
<li><b>Enfriamiento evaporativo</b>: el aire pasa por un medio húmedo, a entalpía casi constante, siguiendo la línea de bulbo húmedo. Enfría mucho en climas secos y casi nada en húmedos.</li>
<li><b>Mezcla adiabática</b>: el estado final está sobre la recta que une los de las dos corrientes, en proporción inversa a sus caudales de aire seco.</li>
</ul>
<p>Los balances son los del capítulo 8, uno para la masa de aire seco, otro para el agua y otro para la energía: \(\dot Q=\dot m_a[(h_2-h_1)-(\omega_1-\omega_2)h_w]\).</p>
<div class="sim" data-sim="acondicionado" data-title="Enfriamiento con deshumidificación y recalentamiento"></div>
<div class="sim-guide"><ul>
<li>Aire de Cali a 32 °C y 60 % se enfría hasta saturación a 14 °C y se recalienta a 22 °C: sale con 60 % de humedad relativa. Se condensan 9.1 g de agua por kilogramo de aire seco y el serpentín extrae 41.4 kJ/kg.</li>
<li>Note que la mayor parte de la energía del serpentín no se gasta en bajar la temperatura sino en condensar vapor: es la carga latente.</li>
</ul></div>
<div class="sim" data-sim="evaporativo" data-title="Enfriamiento evaporativo y mezcla de corrientes de aire"></div>
<div class="sim-guide"><ul>
<li>En Valledupar, con 35 °C y 35 %, el bulbo húmedo es 22.7 °C: un enfriador evaporativo con efectividad 0.85 entrega aire a 24.5 °C sin compresor.</li>
<li>Con el aire de Popayán, ya húmedo, el mismo equipo apenas enfría 2–3 °C.</li>
<li>En el modo de mezcla, el estado final cae sobre la recta que une las dos corrientes.</li>
</ul></div>
</section>

<section>
<h2>Condensación en muros y ventanas</h2>
<p>Una superficie más fría que el punto de rocío del aire de la habitación se moja. En las casas de clima frío y húmedo los vidrios sencillos y los muros de una sola hoja amanecen empañados, y en los rincones con poca ventilación crece moho cuando la humedad relativa junto a la superficie supera el 80 % durante días. La temperatura de la cara interior se calcula con las resistencias térmicas del capítulo 9: \(T_{si}=T_i-U(T_i-T_e)R_{si}\).</p>
<div class="sim" data-sim="condensacion" data-title="¿Se empaña la ventana? Temperatura superficial y punto de rocío"></div>
<div class="sim-guide"><ul>
<li>Una habitación a 18 °C y 75 % (punto de rocío 13.5 °C) con 8 °C afuera: el vidrio sencillo (\(U\approx5.7\)) tiene su cara interior a 10.6 °C y se empaña; el doble vidrio (\(U\approx2.8\)), a 14.4 °C, no.</li>
<li>Ventilar baja la humedad del aire interior; aislar sube la temperatura de la superficie. Ambas cosas evitan la condensación.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Halle la presión parcial del oxígeno en Bogotá (73.4 kPa).
<details><summary>Respuesta</summary><p>\(0.2095\times73.4=15.4\) kPa, el 72 % del valor al nivel del mar.</p></details></li>
<li><span class="lvl">Básico</span>Aire a 25 °C con punto de rocío de 15 °C a 101.3 kPa: halle \(\phi\) y \(\omega\).
<details><summary>Respuesta</summary><p>\(P_v=P_{sat}(15\,°\text{C})=1.705\) kPa; \(\phi=1.705/3.170=0.538\); \(\omega=0.622(1.705)/99.6=0.01065\).</p></details></li>
<li><span class="lvl">Intermedio</span>Se calienta aire de Popayán de 12 °C y 90 % a 22 °C sin añadir agua. ¿Cuál es la humedad relativa final y cuánto calor por kilogramo de aire seco se necesita?
<details><summary>Respuesta</summary><p>\(\omega=0.00974\) (a 81.9 kPa) constante; \(\phi_2=0.48\); \(q=h_2-h_1=10.2\) kJ/kg.</p></details></li>
<li><span class="lvl">Intermedio</span>Se mezclan 2 kg/s de aire a 30 °C y 40 % con 1 kg/s a 15 °C y 90 % (101.3 kPa). Halle el estado de la mezcla.
<details><summary>Respuesta</summary><p>\(\omega_1=0.01061\), \(\omega_2=0.00957\); \(\omega_3=0.01026\); \(h_3\approx(2\cdot57.3+1\cdot39.3)/3=51.3\) kJ/kg ⇒ \(T_3\approx25.0\) °C, \(\phi_3\approx52\) %.</p></details></li>
<li><span class="lvl">Avanzado</span>Deduzca la ecuación de la temperatura de saturación adiabática y explique por qué las líneas de bulbo húmedo y de entalpía constante son casi paralelas.
<details><summary>Respuesta</summary><p>Balance: \(h_1+(\omega_2-\omega_1)h_f(T_2)=h_2\), con \(\omega_2=\omega_s(T_2)\). Como \((\omega_2-\omega_1)h_f\) es pequeño (unos 1–2 % de \(h\)), la saturación adiabática ocurre casi a entalpía constante.</p></details></li>
</ol>
<div class="box note"><h4>Para profundizar</h4><p>Çengel y Boles (2019), caps. 13–14. ASHRAE, <em>Handbook — Fundamentals</em>, 2021, cap. 1 (Psychrometrics). ISO 7730:2005, <em>Ergonomics of the thermal environment</em>. J. Dalton, «On the constitution of mixed gases», <em>Mem. Manchester Lit. Phil. Soc.</em> 5, 535 (1802).</p></div>
</section>

<!-- 18-equilibrio.html -->
<template class="chapter-src" data-id="equilibrio" data-num="18" data-title="Equilibrio químico y de fases" data-part="Parte V · Relaciones, mezclas y reacciones" data-short="Criterio de equilibrio por mínima energía de Gibbs, potencial químico, constante de equilibrio desde las tablas termoquímicas, van 't Hoff y Le Chatelier, disociación a alta temperatura, regla de las fases, ley de Raoult y destilación, y propiedades coligativas">
<p class="lead">¿Por qué el agua de mar hierve a más temperatura que la dulce? ¿Por qué a 3000 K una parte del CO₂ de una llama se descompone en CO y oxígeno? ¿Por qué se puede separar el benceno del tolueno destilando? Las tres preguntas tienen la misma respuesta: a temperatura y presión fijas, un sistema evoluciona hasta minimizar su energía de Gibbs. Este capítulo convierte ese principio en cálculos de composición de equilibrio para reacciones y mezclas.</p>

<section>
<h2>El criterio de equilibrio</h2>
<p>Para un sistema cerrado a \(T\) y \(P\) constantes que solo hace trabajo de frontera, la segunda ley da \(\dd G_{T,P}\le0\): la energía de Gibbs disminuye en todo proceso espontáneo y es mínima en el equilibrio. Si el sistema contiene varias especies que pueden reaccionar o pasar de una fase a otra,</p>
<div class="eq">\[\dd G=-S\,\dd T+V\,\dd P+\sum_i\mu_i\,\dd N_i,\qquad \mu_i=\left(\frac{\partial G}{\partial N_i}\right)_{T,P,N_{j\ne i}}.\]</div>
<p>El <span class="term">potencial químico</span> \(\mu_i\) es la energía de Gibbs por mol de la especie \(i\) en la mezcla. Para un gas ideal, \(\mu_i=g_i^\circ(T)+\bar RT\ln(P_i/P^\circ)\). Así como el calor fluye de mayor a menor temperatura, la materia pasa de la fase o la especie de mayor potencial químico a la de menor: en el equilibrio de fases, \(\mu_i\) es igual en todas las fases; en el químico, \(\sum\nu_i\mu_i=0\).</p>
<h3>La regla de las fases</h3>
<p>Gibbs dedujo cuántas variables intensivas pueden fijarse libremente en un sistema de \(C\) componentes y \(F\) fases en equilibrio: los <span class="term">grados de libertad</span> son \(L=C-F+2\). Para el agua pura, una fase deja dos variables libres (\(T\) y \(P\)); dos fases, una (la curva de saturación); tres fases, ninguna: el punto triple es único.</p>
</section>

<section>
<h2>La constante de equilibrio</h2>
<p>Considere una reacción entre gases ideales, \(\nu_AA+\nu_BB\rightleftharpoons\nu_CC+\nu_DD\). La condición \(\sum\nu_i\mu_i=0\) conduce a</p>
<div class="eq key" data-name="Constante de equilibrio">\[K_P=\frac{(P_C/P^\circ)^{\nu_C}(P_D/P^\circ)^{\nu_D}}{(P_A/P^\circ)^{\nu_A}(P_B/P^\circ)^{\nu_B}}=\exp\left(-\frac{\Delta G^\circ(T)}{\bar RT}\right),\qquad \Delta G^\circ=\sum_{prod}\nu_i\bar g_i^\circ-\sum_{reac}\nu_i\bar g_i^\circ.\]</div>
<p>La constante solo depende de la temperatura y se calcula con las tablas termoquímicas: \(\bar g^\circ=\bar h^\circ-T\bar s^\circ\), con la entalpía de formación y la entropía absoluta. El curso evalúa \(\bar h^\circ(T)\) y \(\bar s^\circ(T)\) con los calores específicos estadísticos del capítulo 2 y reproduce los valores de NIST-JANAF dentro de 0.06 en \(\ln K_P\).</p>
<p>La dependencia con la temperatura sigue la ecuación de <span class="term">van 't Hoff</span>, \(\dd\ln K_P/\dd T=\Delta H^\circ/(\bar RT^2)\): las reacciones endotérmicas avanzan al calentar. El efecto de la presión aparece a través de la composición: si la reacción aumenta el número de moles, subir la presión la hace retroceder. Son las dos caras del <span class="term">principio de Le Chatelier</span>.</p>
<div class="sim" data-sim="gibbs-reaccion" data-title="La reacción N₂O₄ ⇌ 2 NO₂: el mínimo de la energía de Gibbs"></div>
<div class="sim-guide"><ul>
<li>La curva es la energía de Gibbs de la mezcla en función del grado de avance. Su mínimo es el equilibrio: a 25 °C y 1 bar, el 18.7 % del N₂O₄ está disociado.</li>
<li>Caliente: la reacción es endotérmica (\(\Delta H^\circ=57.2\) kJ/mol) y la disociación llega a 89 % a 100 °C. El gas pardo NO₂ domina; en hielo, la mezcla se vuelve casi incolora.</li>
<li>Comprima: aumenta el N₂O₄, que ocupa menos moles. Es Le Chatelier.</li>
</ul></div>
<div class="sim" data-sim="disociacion" data-title="Constantes de equilibrio y disociación a alta temperatura"></div>
<div class="sim-guide"><ul>
<li>A 2000 K el CO₂ casi no se disocia (1.5 % a 1 atm); a 3000 K, el 43 %. Por eso la temperatura de llama real es menor que la calculada sin disociación (capítulo 19): parte de la energía se gasta en romper moléculas.</li>
<li>La formación de NO a partir del aire es despreciable a temperatura ambiente pero importante por encima de 1800 K: es el origen de los óxidos de nitrógeno de los motores y las calderas.</li>
<li>La curva de \(\ln K_P\) contra \(1/T\) es casi recta, con pendiente \(-\Delta H^\circ/\bar R\) (van 't Hoff).</li>
</ul></div>
</section>

<section>
<h2>Equilibrio líquido–vapor de mezclas</h2>
<p>En una mezcla líquida ideal, cada componente contribuye a la presión de vapor en proporción a su fracción molar en el líquido. Es la <span class="term">ley de Raoult</span>:</p>
<div class="eq key" data-name="Ley de Raoult">\[y_iP=x_iP_i^{sat}(T).\]</div>
<p>El componente más volátil se concentra en el vapor. Ese es el principio de la <span class="term">destilación</span>: el vapor que sale de una mezcla hirviendo es más rico en el componente liviano; condensándolo y repitiendo, se obtiene el componente casi puro. Una columna de destilación de una refinería hace decenas de esos pasos en serie. Para gases poco solubles en un líquido (CO₂ en agua, O₂ en la sangre) vale la <span class="term">ley de Henry</span>, \(P_i=Hx_i\), con \(H\) creciente con la temperatura: por eso la gaseosa caliente pierde el gas.</p>
<div class="sim" data-sim="raoult" data-title="Diagrama T–x–y de benceno y tolueno: la destilación"></div>
<div class="sim-guide"><ul>
<li>Las presiones de vapor salen de la ecuación de Antoine. Una mezcla equimolar hierve a 92.1 °C a 1 atm y su primer vapor tiene 71 % de benceno.</li>
<li>Los escalones muestran las etapas de una destilación ideal: cada una enriquece el vapor en benceno.</li>
<li>Cambie la presión a la de Popayán: todo el diagrama baja unos 6 °C.</li>
</ul></div>
<div class="box warn"><h4>Mezclas no ideales</h4><p>La mezcla etanol–agua no sigue Raoult: tiene un azeótropo con 89 % molar de etanol (95.6 % en masa) que hierve a 78.2 °C, por debajo del etanol puro. Por eso el aguardiente y el alcohol antiséptico no pueden destilarse más allá del 96 %: hacen falta coeficientes de actividad y métodos especiales.</p></div>
</section>

<section>
<h2>Propiedades coligativas</h2>
<p>Un soluto no volátil disuelto en un solvente reduce el potencial químico del solvente líquido. Para que el líquido vuelva a estar en equilibrio con su vapor, o con su sólido, hay que cambiar la temperatura. Para soluciones diluidas, con molalidad \(m\) y factor de van 't Hoff \(i\) (partículas por fórmula disuelta),</p>
<div class="eq key" data-name="Ascenso ebulloscópico y descenso crioscópico">\[\Delta T_b=iK_bm,\quad K_b=\frac{\bar RT_b^2M}{\Delta\bar h_{vap}};\qquad \Delta T_f=iK_fm,\quad K_f=\frac{\bar RT_f^2M}{\Delta\bar h_{fus}}.\]</div>
<p>Para el agua, \(K_b=0.513\) y \(K_f=1.86\) K·kg/mol, calculados solo con propiedades del agua pura: no dependen del soluto. Echarle sal a la olla apenas sube la ebullición (10 g en un litro: 0.18 K); el agua de mar (unos 1.1 mol/kg de iones) se congela a −2 °C; y la sal de las carreteras funde el hielo hasta unos −20 °C.</p>
<div class="sim" data-sim="coligativas" data-title="Sal y azúcar en agua: ebullición y congelación"></div>
<div class="sim-guide"><ul>
<li>El simulador usa \(K_b\) y \(K_f\) deducidos de \(h_{fg}\) y \(h_{sf}\) del agua a la presión elegida.</li>
<li>Una cucharada de sal en la olla no sirve para cocinar más rápido; para eso está la olla a presión (capítulo 3).</li>
<li>Para concentraciones altas la aproximación diluida falla: la sal no baja el punto de congelación por debajo del eutéctico, −21.1 °C.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Cuántos grados de libertad tiene una mezcla de hielo, agua líquida y agua salada en equilibrio con su vapor?
<details><summary>Respuesta</summary><p>\(C=2\) (agua y sal), \(F=3\) (hielo, solución, vapor): \(L=1\). Fijando la presión, la temperatura queda determinada por la concentración.</p></details></li>
<li><span class="lvl">Básico</span>Calcule \(K_P\) de \(\text{CO}_2\rightleftharpoons\text{CO}+\tfrac12\text{O}_2\) a 2000 K.
<details><summary>Respuesta</summary><p>\(\ln K_P=-6.635\Rightarrow K_P=1.31\times10^{-3}\).</p></details></li>
<li><span class="lvl">Intermedio</span>Halle la fracción de CO₂ disociada a 2500 K y 1 atm, y a 10 atm.
<details><summary>Respuesta</summary><p>Con 1 mol inicial y avance \(a\): \(K_P=\dfrac{a\sqrt{a/2}}{(1-a)\sqrt{1+a/2}}\sqrt{P}\). Con \(\ln K_P=-3.33\): \(a=0.128\) a 1 atm y 0.062 a 10 atm.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Cuánta sal hay que añadir a 1 kg de agua para que hierva a 101 °C a 1 atm?
<details><summary>Respuesta</summary><p>\(m=\Delta T/(iK_b)=1.03/(2\times0.513)=1.0\) mol/kg ≈ 59 g de NaCl.</p></details></li>
<li><span class="lvl">Avanzado</span>Deduzca \(K_b=\bar RT_b^2M/\Delta\bar h_{vap}\) igualando los potenciales químicos del solvente en la solución y en el vapor y usando Clausius–Clapeyron.
<details><summary>Respuesta</summary><p>Con Raoult, la presión de vapor de la solución es \(x_1P^{sat}(T)\). Para que iguale a \(P\): \(\ln x_1=-\ln[P^{sat}(T)/P]\approx-(\Delta\bar h/\bar RT_b^2)\Delta T\). Como \(\ln x_1\approx-x_2\approx-mM\), resulta \(\Delta T=(\bar RT_b^2M/\Delta\bar h)\,m\).</p></details></li>
</ol>
<div class="box note"><h4>Para profundizar</h4><p>Çengel y Boles (2019), cap. 16. J. W. Gibbs, «On the equilibrium of heterogeneous substances», <em>Trans. Connecticut Acad.</em> 3, 108 (1876) y 343 (1878). J. M. Smith, H. C. Van Ness y M. M. Abbott, <em>Introducción a la termodinámica en ingeniería química</em>, 7.ª ed., McGraw-Hill, 2007. M. W. Chase, <em>NIST-JANAF Thermochemical Tables</em>, 1998.</p></div>
</section>
</template>

<!-- 19-combustion.html -->
<template class="chapter-src" data-id="combustion" data-num="19" data-title="Combustión" data-part="Parte V · Relaciones, mezclas y reacciones" data-short="Combustibles, estequiometría y aire teórico, relación aire–combustible y exceso de aire, punto de rocío de los humos, entalpía de formación y de combustión, poderes caloríficos, primera ley en reacciones, temperatura de llama adiabática con y sin disociación, eficiencia de calderas y emisiones de CO₂">
<p class="lead">Más del 80 % de la energía primaria del mundo sale de quemar algo: carbón, petróleo, gas, leña, bagazo. La combustión es una reacción química rápida que convierte energía de enlace en energía térmica, y su análisis combina la estequiometría con la primera ley. Este capítulo enseña a balancear una combustión, a calcular cuánto calor libera y qué temperatura alcanza una llama, y a estimar la eficiencia de una estufa o una caldera y las emisiones de CO₂ de cada combustible.</p>

<section>
<h2>Estequiometría y aire teórico</h2>
<p>Un hidrocarburo \(\text{C}_x\text{H}_y\text{O}_z\) que se quema completamente produce CO₂ y H₂O. El aire seco se modela como 21 % de O₂ y 79 % de N₂ en moles, es decir, 3.76 moles de N₂ por mol de O₂. El nitrógeno no reacciona (salvo para formar trazas de NO), pero se calienta y se lleva energía. La reacción con el <span class="term">aire teórico</span>, la cantidad mínima para quemar todo, es</p>
<div class="eq key" data-name="Combustión estequiométrica">\[\text{C}_x\text{H}_y\text{O}_z+a_{th}(\text{O}_2+3.76\,\text{N}_2)\longrightarrow x\,\text{CO}_2+\tfrac y2\,\text{H}_2\text{O}+3.76\,a_{th}\,\text{N}_2,\qquad a_{th}=x+\tfrac y4-\tfrac z2.\]</div>
<p>La <span class="term">relación aire–combustible</span> es \(AC=m_{aire}/m_{comb}=4.76\,a\,M_{aire}/M_{comb}\): 17.2 para el metano, 15.1 para la gasolina, 34.2 para el hidrógeno. En la práctica se usa <span class="term">exceso de aire</span> (λ > 1) para asegurar que todo el combustible encuentre oxígeno: 5–20 % en quemadores de gas, 20–50 % en calderas de carbón y biomasa, y mucho más en las turbinas de gas, donde el aire sobrante enfría los gases. Con defecto de aire (λ &lt; 1) aparece monóxido de carbono, un gas tóxico.</p>
<p>El vapor de agua de los humos se condensa si se enfrían por debajo de su punto de rocío, que depende de su presión parcial: unos 59 °C para la combustión estequiométrica de metano a 1 atm. Las calderas «de condensación» aprovechan ese calor latente; las demás deben evitar que el condensado ácido corroa la chimenea.</p>
<div class="sim" data-sim="estequiometria" data-title="Balance de una combustión: productos, relación aire–combustible y punto de rocío"></div>
<div class="sim-guide"><ul>
<li>Elija el combustible y la fracción de aire teórico. La ecuación balanceada, las fracciones molares de los productos y la relación aire–combustible se actualizan.</li>
<li>Con exceso de aire aparece O₂ en los humos: los analizadores de gases miden ese O₂ para ajustar los quemadores.</li>
<li>Con defecto de aire, el carbono que no alcanza oxígeno sale como CO (el modelo supone que todo el hidrógeno se quema primero).</li>
</ul></div>
</section>

<section>
<h2>Entalpía de formación y poder calorífico</h2>
<p>En las reacciones la composición cambia, así que hace falta una referencia común para las entalpías de todas las especies. Se usa la <span class="term">entalpía de formación</span> \(\bar h_f^\circ\): la entalpía de un compuesto a 25 °C y 1 atm respecto de sus elementos en su forma estable, a los que se asigna cero. Así, la entalpía de cualquier especie a cualquier temperatura es \(\bar h=\bar h_f^\circ+(\bar h-\bar h^\circ)\), con el segundo término calculado con su calor específico (capítulo 2). Para el CO₂, \(\bar h_f^\circ=-393.5\) kJ/mol; para el vapor de agua, −241.8 kJ/mol: formarlos libera energía.</p>
<p>El calor liberado al quemar completamente un combustible y devolver los productos a 25 °C es la entalpía de combustión, o <span class="term">poder calorífico</span>:</p>
<div class="eq key" data-name="Poder calorífico">\[\text{PC}=-\Delta H_c=\sum_{reac}N_i\bar h_{f,i}^\circ-\sum_{prod}N_i\bar h_{f,i}^\circ.\]</div>
<p>Si el agua de los productos sale líquida se obtiene el <span class="term">poder calorífico superior</span> (PCS); si sale como vapor, el <span class="term">inferior</span> (PCI). Para el metano, 55.5 y 50.0 MJ/kg. La diferencia es el calor latente del agua formada, que casi ninguna máquina térmica aprovecha.</p>
<div class="sim" data-sim="combustibles" data-title="Poder calorífico y emisiones de CO₂ de los combustibles"></div>
<div class="sim-guide"><ul>
<li>El hidrógeno tiene el mayor poder calorífico por kilogramo y no emite CO₂, pero muy poco por litro, incluso comprimido.</li>
<li>Las emisiones por unidad de energía crecen con la proporción de carbono: 55 g/MJ el gas natural, 69 la gasolina, unos 95 el carbón. Cambiar carbón por gas reduce casi a la mitad el CO₂ por kilovatio-hora.</li>
<li>El CO₂ de la leña, el bagazo y el etanol es biogénico: lo absorbieron las plantas al crecer. Su balance neto depende de cómo se cultiven y se cosechen.</li>
</ul></div>
</section>

<section>
<h2>Primera ley y temperatura de llama adiabática</h2>
<p>Para un quemador de flujo estacionario, la primera ley se escribe con las entalpías absolutas:</p>
<div class="eq">\[\dot Q-\dot W=\sum_{prod}\dot N_i\left(\bar h_f^\circ+\bar h-\bar h^\circ\right)_i-\sum_{reac}\dot N_i\left(\bar h_f^\circ+\bar h-\bar h^\circ\right)_i.\]</div>
<p>Si no hay calor ni trabajo, toda la energía química calienta los productos: alcanzan la <span class="term">temperatura de llama adiabática</span>, la máxima posible. Para el metano con aire teórico y sin disociación resulta unos 2330 K. Al aumentar el exceso de aire, los productos se diluyen y la temperatura baja: 1800 K con 50 % de exceso.</p>
<p>A esas temperaturas el CO₂ y el H₂O se disocian parcialmente (capítulo 18) y la disociación absorbe energía. Incluyendo el equilibrio de CO₂ ⇌ CO + ½O₂ y H₂O ⇌ H₂ + ½O₂, la llama estequiométrica de metano baja a unos 2256 K; el equilibrio completo con OH, H, O y NO da 2226 K. Las llamas reales son aún más frías porque radian y conducen calor.</p>
<div class="sim" data-sim="llama" data-title="Temperatura de llama adiabática según el exceso de aire"></div>
<div class="sim-guide"><ul>
<li>El máximo está cerca de λ = 1. Con exceso de aire, las curvas con y sin disociación coinciden: a menos de 2000 K la disociación es despreciable.</li>
<li>Precalentar el aire (con los propios humos) sube la temperatura de llama: es la idea de los regeneradores de los hornos de vidrio y acero.</li>
<li>El cálculo usa \(c_p(T)\) estadístico de cada producto y las entalpías de formación de NIST-JANAF.</li>
</ul></div>
</section>

<section>
<h2>Eficiencia de estufas y calderas</h2>
<p>En una caldera o una estufa los humos salen a temperatura \(T_{ch}\), mayor que la ambiente, y se llevan una parte del poder calorífico. Despreciando las pérdidas por las paredes y por combustión incompleta, la eficiencia referida al PCI es</p>
<div class="eq">\[\eta\approx1-\frac{\sum_{prod}N_i\left[\bar h_i(T_{ch})-\bar h_i(T_0)\right]}{\text{PCI}}.\]</div>
<p>Una caldera de gas con 10 % de exceso de aire y humos a 150 °C llega a 94 %; con 50 % de exceso y humos a 250 °C, a 87 %. Por eso conviene ajustar el aire con un analizador de O₂ y recuperar calor de los humos. Una caldera de condensación, con humos por debajo de 55 °C, supera el 100 % referido al PCI porque recupera parte del calor latente (la referencia correcta sería el PCS).</p>
<div class="sim" data-sim="caldera" data-title="Pérdidas por la chimenea y eficiencia de una caldera"></div>
<div class="sim-guide"><ul>
<li>Reduzca la temperatura de los humos y el exceso de aire: la eficiencia sube. Por debajo del punto de rocío, el modelo suma el calor latente recuperado del agua que se condensa.</li>
<li>Con 5 % de O₂ en los humos el exceso de aire es ya del 30 %: muchos quemadores domésticos trabajan así sin necesidad.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Balancee la combustión del propano con 20 % de exceso de aire y halle la relación aire–combustible.
<details><summary>Respuesta</summary><p>\(\text{C}_3\text{H}_8+6(\text{O}_2+3.76\text{N}_2)\to3\text{CO}_2+4\text{H}_2\text{O}+\text{O}_2+22.56\text{N}_2\); \(AC=6\times4.76\times28.96/44.1=18.8\).</p></details></li>
<li><span class="lvl">Básico</span>Calcule el PCI del metano con las entalpías de formación.
<details><summary>Respuesta</summary><p>\(-[-393.52+2(-241.83)-(-74.87)]=802.3\) kJ/mol = 50.0 MJ/kg.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Cuántos kilogramos de CO₂ emite una estufa que consume 20 m³ de gas natural al mes (0.68 kg/m³, considerado metano)?
<details><summary>Respuesta</summary><p>13.6 kg de CH₄ × 44.01/16.04 = 37.3 kg de CO₂.</p></details></li>
<li><span class="lvl">Intermedio</span>Halle la temperatura del punto de rocío de los humos de propano estequiométrico a 1 atm.
<details><summary>Respuesta</summary><p>\(y_{H_2O}=4/(3+4+18.8)=0.155\); \(P_v=15.7\) kPa; \(T_{pr}=55\) °C.</p></details></li>
<li><span class="lvl">Avanzado</span>Estime la temperatura de llama adiabática del metano con aire estequiométrico suponiendo \(\bar c_p\) constante de 1.2 kJ/kg·K para los productos. Explique la diferencia con 2330 K.
<details><summary>Respuesta</summary><p>Masa de productos por kg de combustible: \(1+17.2=18.2\) kg. \(\Delta T=50\,000/(18.2\times1.2)=2290\) K, \(T\approx2590\) K. El \(c_p\) real crece mucho a alta temperatura (excitación vibracional): un valor medio de 1.35 da la respuesta correcta.</p></details></li>

<!-- 20-microestados.html -->
<template class="chapter-src" data-id="microestados" data-num="20" data-title="Entropía y microestados" data-part="Parte VI · Termodinámica estadística" data-short="Macroestados y microestados, multiplicidad, la entropía de Boltzmann, el modelo de Ehrenfest y las fluctuaciones, sólidos de Einstein en contacto, la temperatura como derivada de la entropía, la distribución exponencial que surge del intercambio aleatorio y la ecuación de Sackur–Tetrode">
<p class="lead">La segunda ley dice que la entropía de un sistema aislado no disminuye, pero no dice por qué. Boltzmann encontró la respuesta en la década de 1870: la entropía cuenta de cuántas maneras microscópicas puede realizarse un estado macroscópico, y los sistemas evolucionan hacia los estados que pueden realizarse de más maneras simplemente porque son abrumadoramente más probables. Este capítulo construye esa idea contando microestados en modelos sencillos y recupera, al final, la entropía del gas ideal con todos sus decimales.</p>

<section>
<h2>Macroestados, microestados y multiplicidad</h2>
<p>Un <span class="term">microestado</span> es la especificación completa del sistema a nivel microscópico: qué partícula está dónde, qué oscilador tiene cuánta energía. Un <span class="term">macroestado</span> es lo que medimos: la energía total, el volumen, cuántas partículas hay en la mitad izquierda. A cada macroestado le corresponden muchos microestados; ese número es su <span class="term">multiplicidad</span> \(\Omega\).</p>
<p>El <b>postulado fundamental</b> de la mecánica estadística dice que, en un sistema aislado en equilibrio, todos los microestados accesibles son igualmente probables. Entonces la probabilidad de un macroestado es proporcional a su multiplicidad, y el equilibrio es el macroestado de multiplicidad máxima.</p>
<p>Con \(N\) partículas que pueden estar en la mitad izquierda o derecha de una caja, el macroestado «\(n\) a la izquierda» tiene \(\Omega(n)=\binom Nn\) microestados. Para \(N=100\), el estado de 50 y 50 tiene \(10^{29}\) veces más microestados que el de 100 y 0. La distribución es una campana de ancho relativo \(1/\sqrt N\): para \(N=10^{23}\), las fluctuaciones son de una parte en \(3\times10^{11}\), imposibles de medir.</p>
<div class="sim" data-sim="ehrenfest" data-title="El modelo de Ehrenfest: partículas que saltan entre dos mitades"></div>
<div class="sim-guide"><ul>
<li>En cada paso, una partícula elegida al azar cambia de mitad (el modelo de las urnas de Paul y Tatiana Ehrenfest, 1907). Empezando con todas a la izquierda, el sistema llega a la mitad y fluctúa alrededor.</li>
<li>Con pocas partículas, a veces vuelve a acumularse en un lado: la segunda ley es estadística. Con 1000 partículas, nunca en la vida del universo.</li>
<li>El histograma del tiempo pasado en cada \(n\) reproduce la multiplicidad binomial.</li>
</ul></div>
</section>

<section>
<h2>La entropía de Boltzmann</h2>
<p>Boltzmann propuso que la entropía termodinámica es</p>
<div class="eq key" data-name="Entropía de Boltzmann">\[S=k_B\ln\Omega.\]</div>
<p>El logaritmo hace que la entropía sea aditiva: si dos sistemas independientes tienen multiplicidades \(\Omega_A\) y \(\Omega_B\), el conjunto tiene \(\Omega_A\Omega_B\) y \(S=S_A+S_B\). La segunda ley se vuelve una afirmación de probabilidades: un sistema aislado pasa a macroestados de mayor multiplicidad porque hay incomparablemente más microestados que llevan hacia allí que de regreso. La ecuación está grabada en la tumba de Boltzmann en Viena.</p>
<h3>Sólidos de Einstein y la temperatura</h3>
<p>Un sólido de Einstein tiene \(N\) osciladores cuánticos idénticos que comparten \(q\) cuantos de energía \(\hbar\omega\). El número de maneras de repartirlos es</p>
<div class="eq">\[\Omega(N,q)=\binom{q+N-1}{q}.\]</div>
<p>Si dos sólidos A y B se ponen en contacto, el total \(q=q_A+q_B\) se conserva y la multiplicidad del conjunto es \(\Omega_A(q_A)\,\Omega_B(q-q_A)\). Esa función tiene un pico agudo; el sistema termina en el reparto que la maximiza, donde \(\partial\ln\Omega_A/\partial q_A=\partial\ln\Omega_B/\partial q_B\). Esa igualdad es el equilibrio térmico, y la cantidad que se iguala define la temperatura:</p>
<div class="eq key" data-name="Definición estadística de temperatura">\[\frac1T=\left(\frac{\partial S}{\partial U}\right)_{V,N}.\]</div>
<p>El calor fluye del sólido de menor \(\partial S/\partial U\) (más caliente) al de mayor: así el sistema gana más entropía de la que pierde. La ley cero y la dirección del flujo de calor salen del conteo.</p>
<div class="sim" data-sim="solidos-einstein" data-title="Dos sólidos de Einstein que intercambian energía"></div>
<div class="sim-guide"><ul>
<li>La curva es \(\ln(\Omega_A\Omega_B)\) contra \(q_A\). Su máximo está en \(q_A/q=N_A/(N_A+N_B)\): la energía se reparte en proporción al número de osciladores.</li>
<li>Note la escala: con 300 y 200 osciladores y 100 cuantos, el reparto más probable (60 y 40) es \(10^{12}\) veces más probable que el reparto 20 y 80. El ancho relativo se reduce al aumentar el tamaño.</li>
<li>La animación intercambia cuantos al azar entre osciladores vecinos: el sistema camina hacia el pico y se queda cerca.</li>
</ul></div>
</section>

<section>
<h2>De la multiplicidad a la distribución de Boltzmann</h2>
<p>¿Qué probabilidad tiene un solo oscilador de tener \(n\) cuantos, si está en contacto con un sólido muy grande que hace de depósito? Si él tiene \(n\), el depósito tiene \(q-n\), y la probabilidad es proporcional a \(\Omega_{dep}(q-n)\). Desarrollando \(\ln\Omega_{dep}\) a primer orden, \(\ln\Omega_{dep}(q-n)\approx\ln\Omega_{dep}(q)-n\,\hbar\omega/k_BT\):</p>
<div class="eq">\[P(n)\propto\ee^{-n\hbar\omega/k_BT}.\]</div>
<p>Es la <span class="term">distribución de Boltzmann</span>, el resultado central del capítulo 21. Aparece en contextos insospechados: si en un modelo de economía los agentes intercambian dinero al azar conservando el total, la distribución de la riqueza también se vuelve exponencial, por la misma razón combinatoria.</p>
<div class="sim" data-sim="intercambio" data-title="Intercambio aleatorio de cuantos: nace la distribución exponencial"></div>
<div class="sim-guide"><ul>
<li>Todos los osciladores empiezan con la misma energía. En cada paso, un cuanto pasa de un oscilador al azar a otro al azar.</li>
<li>Muy pronto el histograma se vuelve exponencial: muchos osciladores con poca energía, pocos con mucha. La línea es \(P(n)=(1-x)x^n\) con \(x=\bar n/(1+\bar n)\), la distribución de Boltzmann de un oscilador cuántico.</li>
<li>La entropía del conjunto, calculada con las ocupaciones, crece y se estabiliza en su máximo.</li>
</ul></div>
</section>

<section>
<h2>La entropía del gas ideal: Sackur y Tetrode</h2>
<p>Contar los microestados de un gas ideal monoatómico exige dos ingredientes cuánticos: que el espacio de fases esté dividido en celdas de volumen \(h^3\) por partícula y que las partículas idénticas sean indistinguibles (dividir por \(N!\)). Sackur y Tetrode lo hicieron en 1912:</p>
<div class="eq key" data-name="Ecuación de Sackur–Tetrode">\[S=Nk_B\left[\ln\left(\frac{V}{N\lambda^3}\right)+\frac52\right],\qquad \lambda=\frac{h}{\sqrt{2\pi mk_BT}}.\]</div>
<p>La longitud de onda térmica \(\lambda\) de un átomo de argón a temperatura ambiente es 0.016 nm, mucho menor que la distancia entre átomos: por eso el gas es clásico. Para el argón a 298.15 K y 1 bar la fórmula da 154.85 J/mol·K; la medición calorimétrica, integrando \(c_p/T\) desde casi el cero absoluto con los calores latentes, da 154.8 ± 0.1 J/mol·K. El acuerdo confirma a la vez el conteo cuántico, la constante de Planck y la tercera ley. El factor \(N!\) es también la solución de la paradoja de Gibbs (capítulo 11): sin él, la entropía no sería extensiva.</p>
<div class="sim" data-sim="sackur" data-title="Entropía de los gases nobles: Sackur–Tetrode frente a la calorimetría"></div>
<div class="sim-guide"><ul>
<li>La entropía crece con la masa atómica (más estados de traslación accesibles) y con la temperatura.</li>
<li>Los puntos son los valores calorimétricos tabulados (CODATA); la curva, la fórmula. Coinciden dentro de 0.01 %.</li>
<li>A temperaturas muy bajas la fórmula da entropías negativas, señal de que el gas deja de ser clásico: \(\lambda\) se acerca a la distancia entre átomos (capítulo 22).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Cuál es la probabilidad de que 20 moléculas estén todas en la mitad izquierda de una caja?
<details><summary>Respuesta</summary><p>\(2^{-20}=9.5\times10^{-7}\).</p></details></li>
<li><span class="lvl">Básico</span>¿Cuántos microestados tiene un sólido de Einstein con 3 osciladores y 4 cuantos?
<details><summary>Respuesta</summary><p>\(\binom{6}{4}=15\).</p></details></li>
<li><span class="lvl">Intermedio</span>Calcule el cambio de entropía de 1 mol de gas ideal que se expande libremente al doble de volumen, contando microestados.
<details><summary>Respuesta</summary><p>Cada partícula tiene el doble de posiciones: \(\Omega_2/\Omega_1=2^{N_A}\). \(\Delta S=k_BN_A\ln2=R\ln2=5.76\) J/K, igual que con la termodinámica clásica.</p></details></li>
<li><span class="lvl">Intermedio</span>Con Sackur–Tetrode, halle la entropía molar del helio a 4.2 K y 1 atm (si fuera un gas ideal clásico). ¿Qué indica el resultado?
<details><summary>Respuesta</summary><p>Unos 37 J/mol·K, pero \(n\lambda^3\approx0.13\) ya no es despreciable y el helio real a esa temperatura y presión es líquido. La aproximación clásica deja de valer.</p></details></li>
<li><span class="lvl">Avanzado</span>Use la aproximación de Stirling para demostrar que, para un sólido de Einstein con \(q\gg N\gg1\), \(S\approx Nk_B[\ln(q/N)+1]\) y que \(U=Nk_BT\) (límite clásico).
<details><summary>Respuesta</summary><p>\(\ln\Omega\approx(q+N)\ln(q+N)-q\ln q-N\ln N\approx N\ln(q/N)+N\). Con \(U=q\epsilon\): \(1/T=\partial S/\partial U=Nk_B/(q\epsilon)\Rightarrow U=Nk_BT\).</p></details></li>
</ol>
<div class="box note"><h4>Para profundizar</h4><p>D. V. Schroeder, <em>An Introduction to Thermal Physics</em>, Addison-Wesley, 2000, caps. 2–3. L. Boltzmann, «Über die Beziehung zwischen dem zweiten Hauptsatze der mechanischen Wärmetheorie und der Wahrscheinlichkeitsrechnung», <em>Wiener Berichte</em> 76, 373 (1877). P. y T. Ehrenfest, «Über zwei bekannte Einwände gegen das Boltzmannsche H-Theorem», <em>Phys. Z.</em> 8, 311 (1907). A. Drăgulescu y V. M. Yakovenko, «Statistical mechanics of money», <em>Eur. Phys. J. B</em> 17, 723 (2000).</p></div>
</section>
</template>

<!-- 21-boltzmann.html -->
<template class="chapter-src" data-id="boltzmann" data-num="21" data-title="Distribución de Boltzmann y función de partición" data-part="Parte VI · Termodinámica estadística" data-short="El colectivo canónico, el factor de Boltzmann, la función de partición y las propiedades termodinámicas que se derivan de ella, el sistema de dos niveles y la anomalía de Schottky, las poblaciones rotacionales de las moléculas, el paramagnetismo y la transición de fase del modelo de Ising">
<p class="lead">Contar microestados de un sistema aislado es difícil. Casi siempre es más cómodo pensar en un sistema pequeño en contacto con un depósito a temperatura fija: un átomo en un gas, una molécula en un cristal, un espín en un imán. Para ellos, toda la termodinámica cabe en una sola función, la <em>función de partición</em>. Este capítulo la construye y la aplica a sistemas que se miden en el laboratorio: capacidades caloríficas con picos inesperados, espectros moleculares, imanes y la transición de fase más estudiada de la física.</p>

<section>
<h2>El factor de Boltzmann y la función de partición</h2>
<p>El capítulo 20 mostró que un sistema pequeño en contacto con un depósito a temperatura \(T\) tiene una probabilidad de estar en un microestado de energía \(E_i\) proporcional a \(\ee^{-E_i/k_BT}\), el <span class="term">factor de Boltzmann</span>. La constante de normalización es la <span class="term">función de partición</span>:</p>
<div class="eq key" data-name="Distribución de Boltzmann">\[P_i=\frac{\ee^{-\beta E_i}}{Z},\qquad Z=\sum_i\ee^{-\beta E_i},\qquad \beta=\frac1{k_BT}.\]</div>
<p>\(Z\) cuenta, con peso, cuántos estados son accesibles a la temperatura \(T\). De ella se obtienen todas las propiedades:</p>
<div class="eq key" data-name="Termodinámica desde Z">\[U=-\frac{\partial\ln Z}{\partial\beta},\qquad F=-k_BT\ln Z,\qquad S=\frac{U-F}{T},\qquad C_V=\frac{\partial U}{\partial T}=\frac{\langle E^2\rangle-\langle E\rangle^2}{k_BT^2}.\]</div>
<p>La última igualdad dice que la capacidad calorífica mide las fluctuaciones de la energía: una relación profunda entre respuesta y fluctuación que reaparece en el capítulo 23. Para un gas de moléculas independientes, \(Z=q^N/N!\), con \(q\) la función de partición de una molécula, que se factoriza en traslación, rotación, vibración y estados electrónicos. Así se calcularon los calores específicos estadísticos que el curso usa desde el capítulo 2.</p>
</section>

<section>
<h2>El sistema de dos niveles</h2>
<p>El sistema más simple tiene dos estados, de energías 0 y \(\Delta\): un espín en un campo magnético, un defecto con dos configuraciones, un átomo con un estado excitado bajo. Su función de partición es \(Z=1+\ee^{-\Delta/k_BT}\), y</p>
<div class="eq">\[\frac{U}{N}=\frac{\Delta}{\ee^{\Delta/k_BT}+1},\qquad \frac{C}{Nk_B}=\left(\frac{\Delta}{k_BT}\right)^2\frac{\ee^{\Delta/k_BT}}{\left(\ee^{\Delta/k_BT}+1\right)^2}.\]</div>
<p>La capacidad calorífica tiene un pico en \(k_BT\approx0.42\Delta\), la <span class="term">anomalía de Schottky</span>: a baja temperatura no hay energía para excitar el nivel superior; a alta, los dos niveles ya están casi igualmente poblados y no se puede absorber más. A diferencia de un oscilador, el sistema de dos niveles se satura. Esas anomalías aparecen en las medidas de \(c_p\) de sales paramagnéticas y de vidrios a temperaturas de pocos kelvin.</p>
<div class="sim" data-sim="dos-niveles" data-title="Sistema de dos niveles: poblaciones, energía, entropía y anomalía de Schottky"></div>
<div class="sim-guide"><ul>
<li>A alta temperatura las poblaciones tienden a 50 % y 50 %, y la entropía a \(k_B\ln2\) por partícula: dos estados igualmente probables.</li>
<li>El pico de \(C\) vale \(0.44\,k_B\) por partícula y está en \(k_BT/\Delta=0.417\).</li>
<li>Más población arriba que abajo correspondería a una «temperatura negativa»: es posible en sistemas de espines aislados de la red, y es el estado de un láser con inversión de población.</li>
</ul></div>
</section>

<section>
<h2>Moléculas: poblaciones rotacionales y espectros</h2>
<p>Una molécula diatómica que rota tiene niveles \(E_J=J(J+1)\,k_B\Theta_r\), cada uno con \(2J+1\) estados. La población de cada nivel es</p>
<div class="eq">\[P(J)\propto(2J+1)\,\ee^{-J(J+1)\Theta_r/T},\qquad J_{máx}\approx\sqrt{\frac{T}{2\Theta_r}}-\frac12.\]</div>
<p>El factor de degeneración crece y el de Boltzmann decrece: la población tiene un máximo. Para el CO (\(\Theta_r=2.77\) K) a 300 K el nivel más poblado es \(J=7\); para el HCl (\(\Theta_r=15.2\) K), \(J=3\). Las intensidades de las líneas de los espectros infrarrojos siguen esta distribución, y a partir de ellas los astrónomos miden la temperatura de nubes interestelares y atmósferas de planetas.</p>
<div class="sim" data-sim="rotacional" data-title="Poblaciones rotacionales y el espectro de rotación–vibración"></div>
<div class="sim-guide"><ul>
<li>Las barras son las poblaciones relativas de cada \(J\); el espectro simulado (ramas P y R) tiene intensidades proporcionales a ellas.</li>
<li>Enfríe la molécula: se pueblan solo los niveles bajos y el espectro se estrecha. A 10 K el CO tiene casi toda la población en \(J\le2\): así se observa en las nubes moleculares frías.</li>
</ul></div>
</section>

<section>
<h2>Paramagnetismo</h2>
<p>Un átomo con momento magnético \(\mu\) en un campo \(B\) tiene, si su espín es ½, dos energías \(\mp\mu B\). La magnetización media es</p>
<div class="eq">\[\langle\mu_z\rangle=\mu\tanh\left(\frac{\mu B}{k_BT}\right)\ \xrightarrow{\ \mu B\ll k_BT\ }\ \frac{\mu^2B}{k_BT}.\]</div>
<p>El límite de campo débil es la <span class="term">ley de Curie</span>: la susceptibilidad cae como \(1/T\). A temperatura ambiente y 1 T, \(\mu_BB/k_BT=0.002\): los espines apenas se orientan. Para alinearlos hacen falta campos de varios teslas y temperaturas de pocos kelvin. La desmagnetización adiabática de sales paramagnéticas, la técnica inversa, enfría a milikelvin.</p>
<div class="sim" data-sim="paramagnetismo" data-title="Magnetización de un paramagneto: función de Brillouin y ley de Curie"></div>
<div class="sim-guide"><ul>
<li>Las curvas son las funciones de Brillouin para \(J=1/2\), \(3/2\) y \(7/2\) (el ion Gd³⁺) y el límite clásico de Langevin.</li>
<li>Todas coinciden con la ley de Curie a campos débiles y se saturan a campos fuertes.</li>
</ul></div>
</section>

<section>
<h2>El modelo de Ising y las transiciones de fase</h2>
<p>¿Por qué el hierro es imán por debajo de 770 °C y deja de serlo por encima? Ningún sistema de partículas independientes tiene una transición de fase; hace falta interacción. El <span class="term">modelo de Ising</span> es el más simple: espines \(s_i=\pm1\) en una red, con energía \(E=-J\sum_{\langle ij\rangle}s_is_j\) que favorece a los vecinos alineados. Ernst Ising lo resolvió en una dimensión en 1925 y no encontró transición. Lars Onsager, en 1944, resolvió el caso bidimensional exactamente: hay una transición a</p>
<div class="eq key" data-name="Temperatura crítica de Onsager">\[\frac{k_BT_c}{J}=\frac{2}{\ln(1+\sqrt2)}=2.269.\]</div>
<p>Por debajo, los espines se alinean espontáneamente; por encima, el desorden térmico gana. Cerca de \(T_c\) aparecen dominios de todos los tamaños y la susceptibilidad y la capacidad calorífica divergen: es un punto crítico como el del agua (capítulo 3), con los mismos fenómenos y, sorprendentemente, la misma matemática.</p>
<div class="sim" data-sim="ising" data-title="Modelo de Ising en dos dimensiones con el algoritmo de Metropolis"></div>
<div class="sim-guide"><ul>
<li>El algoritmo de Metropolis (1953) elige un espín al azar y lo invierte con probabilidad \(\min(1,\ee^{-\Delta E/k_BT})\): así muestrea la distribución de Boltzmann sin calcular \(Z\).</li>
<li>Baje la temperatura por debajo de 2.27: se forman dominios que crecen hasta que uno domina. Súbala: el orden se pierde.</li>
<li>Justo en \(T_c\) aparecen dominios de todos los tamaños, una imagen fractal. La magnetización medida se compara con la exacta de Onsager–Yang, \(M=[1-\operatorname{senh}^{-4}(2J/k_BT)]^{1/8}\).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un nivel excitado está 0.1 eV por encima del fundamental. ¿Qué fracción de átomos lo ocupa a 300 K y a 3000 K?
<details><summary>Respuesta</summary><p>\(k_BT=0.02585\) eV a 300 K: \(\ee^{-3.87}/(1+\ee^{-3.87})=2.0\) %. A 3000 K (\(\Delta/k_BT=0.387\)): 40 %.</p></details></li>
<li><span class="lvl">Básico</span>Halle la entropía de un sistema de dos niveles a temperatura muy alta.
<details><summary>Respuesta</summary><p>\(S=Nk_B\ln2\).</p></details></li>
<li><span class="lvl">Intermedio</span>¿Qué nivel rotacional está más poblado en el N₂ (\(\Theta_r=2.88\) K) a 1000 K?
<details><summary>Respuesta</summary><p>\(\sqrt{1000/5.76}-0.5=12.7\): \(J=13\) (12 y 13 tienen poblaciones casi iguales).</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que, para un oscilador armónico clásico, la función de partición lleva a \(U=k_BT\) (equipartición).
<details><summary>Respuesta</summary><p>\(Z=\int\ee^{-\beta(p^2/2m+kx^2/2)}\dd x\,\dd p/h=2\pi/(h\omega\beta)\). \(U=-\partial\ln Z/\partial\beta=1/\beta=k_BT\).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que \(C_V=(\langle E^2\rangle-\langle E\rangle^2)/k_BT^2\).
<details><summary>Respuesta</summary><p>\(U=-\partial_\beta\ln Z\); \(\partial_\beta U=-\langle E^2\rangle+\langle E\rangle^2\). Como \(\partial_T=-k_B\beta^2\partial_\beta\), \(C_V=k_B\beta^2(\langle E^2\rangle-\langle E\rangle^2)\).</p></details></li>
</ol>
<div class="box note"><h4>Para profundizar</h4><p>Schroeder (2000), caps. 6 y 8. F. Reif (1965), caps. 6–7. L. Onsager, «Crystal statistics. I. A two-dimensional model with an order–disorder transition», <em>Phys. Rev.</em> 65, 117 (1944). N. Metropolis et al., «Equation of state calculations by fast computing machines», <em>J. Chem. Phys.</em> 21, 1087 (1953). G. Herzberg, <em>Molecular Spectra and Molecular Structure I</em>, Van Nostrand, 1950.</p></div>
</section>
