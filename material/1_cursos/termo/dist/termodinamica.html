<!-- 10-segunda-ley.html -->
<template class="chapter-src" data-id="segunda-ley" data-num="10" data-title="Segunda ley y máquinas térmicas" data-part="Parte III · Segunda ley" data-short="Máquinas térmicas, refrigeradores y bombas de calor, enunciados de Kelvin–Planck y Clausius, reversibilidad, el ciclo y los principios de Carnot, la escala termodinámica de temperatura y la eficiencia a máxima potencia de Curzon–Ahlborn">
<p class="lead">La primera ley permite convertir calor en trabajo uno a uno; la naturaleza no. Ninguna máquina, por perfecta que sea, convierte todo el calor que recibe en trabajo: siempre debe desechar una parte a un cuerpo más frío. Sadi Carnot lo entendió en 1824, antes de que se conociera la primera ley, al preguntarse cuánto trabajo puede dar una máquina de vapor. Este capítulo formula la segunda ley, demuestra el límite de Carnot y lo compara con las centrales reales.</p>

<section>
<h2>Máquinas térmicas, refrigeradores y bombas de calor</h2>
<p>Una <span class="term">máquina térmica</span> opera en un ciclo: recibe calor \(Q_H\) de una fuente caliente, entrega trabajo neto \(W\) y desecha calor \(Q_C\) a un sumidero frío. Por la primera ley, \(W=Q_H-Q_C\), y su desempeño es la <span class="term">eficiencia térmica</span></p>
<div class="eq key" data-name="Eficiencia térmica">\[\eta=\frac{W}{Q_H}=1-\frac{Q_C}{Q_H}.\]</div>
<p>Un <span class="term">refrigerador</span> es una máquina invertida: consume trabajo para sacar calor \(Q_C\) de un espacio frío y lo arroja al ambiente; una <span class="term">bomba de calor</span> es el mismo aparato visto desde el lado caliente. Sus desempeños son los coeficientes</p>
<div class="eq">\[\text{COP}_R=\frac{Q_C}{W},\qquad \text{COP}_{BC}=\frac{Q_H}{W}=\text{COP}_R+1.\]</div>
<p>Un COP mayor que 1 no viola nada: la bomba de calor no crea energía, la traslada. Una bomba de calor con COP 3 entrega 3 kWh de calor por cada kWh eléctrico, mientras que una resistencia entrega solo 1.</p>
</section>

<section>
<h2>Los dos enunciados de la segunda ley</h2>
<div class="box note"><h4>Enunciado de Kelvin–Planck</h4><p>Es imposible construir un dispositivo que, operando en un ciclo, no produzca otro efecto que recibir calor de un único depósito y entregar una cantidad equivalente de trabajo.</p></div>
<div class="box note"><h4>Enunciado de Clausius</h4><p>Es imposible construir un dispositivo que, operando en un ciclo, no produzca otro efecto que transferir calor de un cuerpo más frío a uno más caliente.</p></div>
<p>Los dos enunciados son equivalentes: si uno fallara, el otro también. Si existiera un refrigerador que bombeara calor sin trabajo (violando Clausius), se lo acoplaría a una máquina normal que devolviera al foco frío exactamente el calor que el refrigerador le saca; el conjunto recibiría calor del foco caliente y lo convertiría íntegramente en trabajo, violando Kelvin–Planck. El argumento inverso es análogo.</p>
<p>Un <span class="term">móvil perpetuo de segunda especie</span> (un barco que se moviera extrayendo calor del mar) no viola la conservación de la energía, pero sí la segunda ley. La segunda ley no se deduce de la primera ni de la mecánica: es un principio independiente, el más firmemente establecido de la física, según Eddington.</p>
<h3>Procesos reversibles e irreversibles</h3>
<p>Un proceso es <span class="term">reversible</span> si el sistema y sus alrededores pueden devolverse exactamente a su estado inicial. Ningún proceso real lo es; son irreversibles por fricción, por transferencia de calor con diferencia finita de temperatura, por expansión libre, por mezcla, por resistencia eléctrica, por reacciones químicas espontáneas. El proceso reversible es un límite ideal, como el plano sin fricción, pero indispensable: fija la mejor actuación posible.</p>
<div class="sim" data-sim="verificador" data-title="¿Es posible esta máquina? Primera y segunda ley"></div>
<div class="sim-guide"><ul>
<li>Introduzca los datos que asegura un inventor: calor recibido, trabajo entregado y temperaturas de los focos. El verificador aplica la primera ley (balance) y la segunda (comparación con Carnot).</li>
<li>Una máquina que entrega 60 kJ de trabajo con 100 kJ de calor entre 600 K y 300 K es imposible: el máximo es 50 kJ.</li>
<li>Pase al modo refrigerador: un COP de 8 entre −5 °C y 35 °C es imposible (el de Carnot es 6.7).</li>
</ul></div>
</section>

<section>
<h2>El ciclo de Carnot</h2>
<p>Carnot imaginó la máquina más eficiente posible: un ciclo de cuatro procesos reversibles entre dos focos, en el que el calor solo se transfiere sin diferencia de temperatura.</p>
<ol>
<li>Expansión isotérmica a \(T_H\): el gas recibe \(Q_H\) del foco caliente.</li>
<li>Expansión adiabática reversible: la temperatura baja de \(T_H\) a \(T_C\).</li>
<li>Compresión isotérmica a \(T_C\): el gas cede \(Q_C\) al foco frío.</li>
<li>Compresión adiabática reversible: la temperatura vuelve a \(T_H\).</li>
</ol>
<p>Para un gas ideal, \(Q_H=mRT_H\ln(V_2/V_1)\) y \(Q_C=mRT_C\ln(V_3/V_4)\); las adiabáticas imponen \(V_2/V_1=V_3/V_4\). Entonces \(Q_C/Q_H=T_C/T_H\) y</p>
<div class="eq key" data-name="Eficiencia de Carnot">\[\eta_C=1-\frac{T_C}{T_H},\qquad \text{COP}_{R,C}=\frac{T_C}{T_H-T_C},\qquad \text{COP}_{BC,C}=\frac{T_H}{T_H-T_C}.\]</div>
<div class="sim" data-sim="carnot" data-title="El ciclo de Carnot de un gas ideal en los diagramas P–V y T–S"></div>
<div class="sim-guide"><ul>
<li>En el diagrama \(T\)–\(S\) el ciclo es un rectángulo: el calor recibido es el área bajo la isoterma superior; el desechado, bajo la inferior. La eficiencia es el cociente de alturas.</li>
<li>Aumente la relación de expansión isotérmica: el trabajo por ciclo crece, pero la eficiencia no cambia. Solo dependen de las temperaturas.</li>
<li>Invierta el sentido: el mismo ciclo es el refrigerador de Carnot.</li>
</ul></div>
<h3>Los principios de Carnot y la escala termodinámica</h3>
<p>De la segunda ley se siguen dos principios: (1) ninguna máquina entre dos focos es más eficiente que una reversible entre los mismos focos; (2) todas las máquinas reversibles entre los mismos focos tienen la misma eficiencia, cualquiera sea la sustancia de trabajo. Por el segundo, \(Q_C/Q_H\) solo depende de las temperaturas de los focos, y Kelvin (1848) lo usó para definir una escala de temperatura independiente de toda sustancia: \(Q_C/Q_H=T_C/T_H\). La demostración anterior con el gas ideal prueba que esa escala termodinámica coincide con la del termómetro de gas del capítulo 1.</p>
</section>

<section>
<h2>Refrigeradores y bombas de calor reales</h2>
<p>El COP de Carnot crece sin límite cuando las temperaturas se acercan: bombear calor a través de una diferencia pequeña cuesta poco trabajo. Por eso un aire acondicionado rinde más cuando afuera no hace tanto calor, y una bomba de calor para calentar agua rinde más que una para calentar a 60 °C. Los equipos reales alcanzan entre el 30 y el 60 % del COP de Carnot.</p>
<div class="sim" data-sim="cop" data-title="COP de refrigeradores y bombas de calor frente al límite de Carnot"></div>
<div class="sim-guide"><ul>
<li>Una nevera con el congelador a −23 °C y el condensador a 35 °C tiene un COP de Carnot de 4.3; las reales logran entre 1.5 y 2.</li>
<li>Una bomba de calor que calienta agua para la ducha desde 18 °C ambiente hasta 45 °C tiene COP de Carnot 11.8; las comerciales logran 3 a 4. Frente a la ducha eléctrica, ahorra dos tercios de la electricidad.</li>
</ul></div>
</section>

<section>
<h2>Máquinas reales: la eficiencia a máxima potencia</h2>
<p>Una máquina de Carnot es infinitamente lenta: para transferir calor sin diferencia de temperatura hace falta un tiempo infinito, así que su potencia es cero. Curzon y Ahlborn (1975) consideraron una máquina reversible por dentro que intercambia calor con los focos a través de resistencias térmicas finitas, y encontraron que su potencia es máxima cuando la eficiencia vale</p>
<div class="eq key" data-name="Eficiencia de Curzon–Ahlborn">\[\eta_{CA}=1-\sqrt{\frac{T_C}{T_H}}.\]</div>
<p>El resultado, que no depende de las conductancias, predice sorprendentemente bien el desempeño de centrales reales, diseñadas precisamente para entregar mucha potencia:</p>
<div class="tablewrap"><table>
<tr><th>Central</th><th class="c">\(T_H\) (°C)</th><th class="c">\(T_C\) (°C)</th><th class="c">\(\eta_C\)</th><th class="c">\(\eta_{CA}\)</th><th class="c">\(\eta\) observada</th></tr>
<tr><td>West Thurrock (carbón, Reino Unido)</td><td class="c">565</td><td class="c">25</td><td class="c">0.64</td><td class="c">0.40</td><td class="c">0.36</td></tr>
<tr><td>CANDU (nuclear, Canadá)</td><td class="c">300</td><td class="c">25</td><td class="c">0.48</td><td class="c">0.28</td><td class="c">0.30</td></tr>
<tr><td>Larderello (geotérmica, Italia)</td><td class="c">250</td><td class="c">80</td><td class="c">0.32</td><td class="c">0.175</td><td class="c">0.16</td></tr>
</table></div>
<p class="ctrl-note">F. L. Curzon y B. Ahlborn, «Efficiency of a Carnot engine at maximum power output», <em>Am. J. Phys.</em> 43, 22 (1975), tabla I.</p>
<div class="sim" data-sim="curzon" data-title="Potencia contra eficiencia de una máquina endorreversible"></div>
<div class="sim-guide"><ul>
<li>La curva de potencia contra eficiencia es una parábola deformada: se anula en \(\eta=0\) (no hay trabajo) y en \(\eta=\eta_C\) (no hay flujo de calor).</li>
<li>Su máximo está en \(\eta_{CA}\), cualquiera sea la relación entre las conductancias de los dos lados.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una central recibe 2000 MW de calor y entrega 700 MW eléctricos. Halle su eficiencia y el calor desechado.
<details><summary>Respuesta</summary><p>\(\eta=0.35\); \(\dot Q_C=1300\) MW, casi el doble de la potencia útil.</p></details></li>
<li><span class="lvl">Básico</span>¿Cuál es la máxima eficiencia de una máquina que opera entre vapor a 550 °C y un río a 25 °C?
<details><summary>Respuesta</summary><p>\(1-298.15/823.15=0.638\).</p></details></li>
<li><span class="lvl">Intermedio</span>Un inventor dice que su refrigerador mantiene un congelador a −18 °C, saca 1.2 kW de él y consume 250 W en una cocina a 25 °C. ¿Es posible?
<details><summary>Respuesta</summary><p>COP declarado 4.8; COP de Carnot \(255.15/43=5.93\). Es posible, aunque sería un equipo excepcional (81 % de Carnot).</p></details></li>
<li><span class="lvl">Intermedio</span>Una bomba de calor con COP 3.2 calienta una casa que pierde 6 kW. ¿Cuánta electricidad ahorra respecto de calefacción por resistencias?
<details><summary>Respuesta</summary><p>Consume 1.875 kW en vez de 6 kW: ahorra 4.125 kW (69 %).</p></details></li>
<li><span class="lvl">Avanzado</span>Deduzca \(\eta_{CA}\). Suponga una máquina reversible que trabaja entre \(T_1\) y \(T_2\), conectada a los focos por conductancias \(K_H\) y \(K_C\): \(\dot Q_H=K_H(T_H-T_1)\), \(\dot Q_C=K_C(T_2-T_C)\), \(\dot Q_H/T_1=\dot Q_C/T_2\).
<details><summary>Respuesta</summary><p>Con \(T_2=(1-\eta)T_1\) y \(\dot Q_C=(1-\eta)\dot Q_H\), las dos ecuaciones de conducción permiten eliminar \(T_1\): \(\dot Q_H=K\,[T_H-T_C/(1-\eta)]\), con \(K=K_HK_C/(K_H+K_C)\). La potencia es \(P=\eta\dot Q_H=K\eta\,[T_H-T_C/(1-\eta)]\). Haciendo \(\dd P/\dd\eta=0\) y multiplicando por \((1-\eta)^2\): \(T_H(1-\eta)^2=T_C\), es decir \(\eta=1-\sqrt{T_C/T_H}\), sin importar \(K_H\) ni \(K_C\).</p></details></li>
</ol>
<div class="box note"><h4>Para profundizar</h4><p>S. Carnot, <em>Réflexions sur la puissance motrice du feu</em>, 1824 (traducción al español: <em>Reflexiones sobre la potencia motriz del fuego</em>, Alianza, 1987). Çengel y Boles (2019), cap. 6. Zemansky y Dittman (1997), caps. 6–7. A. Bejan, <em>Advanced Engineering Thermodynamics</em>, 4.ª ed., Wiley, 2016, cap. 4 (termodinámica de tiempo finito).</p></div>
</section>
</template>

<!-- 11-entropia.html -->
<template class="chapter-src" data-id="entropia" data-num="11" data-title="Entropía" data-part="Parte III · Segunda ley" data-short="Desigualdad de Clausius, definición de la entropía, principio de incremento de la entropía y entropía generada, relaciones T dS, cambios de entropía de sólidos, líquidos, gases ideales y vapor, diagramas T–s, eficiencias isentrópicas y entropía de mezcla">
<p class="lead">La segunda ley dice qué procesos son imposibles. Para convertirla en una herramienta de cálculo, Clausius (1865) definió una propiedad nueva que cambia de una manera precisa en cada proceso y que solo puede aumentar en un sistema aislado. La llamó <em>entropía</em>, del griego «transformación». Este capítulo la define, enseña a calcularla para cualquier sustancia y la usa para medir cuán lejos de lo ideal están las máquinas reales.</p>

<section>
<h2>La desigualdad de Clausius y la definición de entropía</h2>
<p>Considere un ciclo cualquiera que intercambia calor \(\delta Q\) con su entorno a través de una frontera a temperatura \(T\). Acoplando máquinas de Carnot imaginarias entre esa frontera y un único depósito, y aplicando el enunciado de Kelvin–Planck al conjunto, Clausius demostró que</p>
<div class="eq key" data-name="Desigualdad de Clausius">\[\oint\frac{\delta Q}{T}\le0,\]</div>
<p>con la igualdad solo para ciclos reversibles. Como en un ciclo reversible la integral se anula, \(\delta Q_{rev}/T\) es la diferencial de una propiedad:</p>
<div class="eq key" data-name="Entropía">\[\dd S=\left(\frac{\delta Q}{T}\right)_{rev},\qquad S_2-S_1=\int_1^2\left(\frac{\delta Q}{T}\right)_{rev}.\]</div>
<p>La entropía es una propiedad: su cambio entre dos estados es el mismo por cualquier camino. Para calcularlo en un proceso irreversible basta imaginar <b>cualquier</b> camino reversible entre los mismos estados.</p>
</section>

<section>
<h2>El principio de incremento de la entropía</h2>
<p>Si un proceso irreversible lleva un sistema de 1 a 2 y uno reversible lo devuelve, la desigualdad de Clausius da \(S_2-S_1\ge\int_1^2\delta Q/T\). Se convierte en igualdad añadiendo un término positivo, la <span class="term">entropía generada</span>:</p>
<div class="eq key" data-name="Balance de entropía">\[S_2-S_1=\int_1^2\frac{\delta Q}{T_b}+S_{gen},\qquad S_{gen}\ge0.\]</div>
<p>La entropía de un sistema cambia por dos razones: se transfiere con el calor (\(\delta Q/T_b\), con \(T_b\) la temperatura de la frontera) y se genera por irreversibilidades. La transferencia puede ser de cualquier signo; la generación, nunca negativa. En un sistema aislado no hay transferencia, y</p>
<div class="eq">\[\Delta S_{aislado}=S_{gen}\ge0.\]</div>
<p>Este es el <b>principio de incremento de la entropía</b>. Un proceso es posible si y solo si genera entropía no negativa; es reversible si genera cero. La entropía no se conserva: el universo la produce sin cesar.</p>
<div class="sim" data-sim="dos-bloques" data-title="Dos bloques: contacto directo frente a una máquina reversible entre ellos"></div>
<div class="sim-guide"><ul>
<li>Dos bloques de cobre de 1 kg a 400 K y 300 K en contacto directo llegan a 350 K y generan 7.94 J/K: el proceso es irreversible.</li>
<li>Si entre ellos se pone una máquina reversible, la temperatura final es la media geométrica, \(\sqrt{T_1T_2}=346.4\) K, la entropía generada es cero y se obtienen 2.76 kJ de trabajo. Es el trabajo que el contacto directo desperdició; su valor es muy cercano a \(T_{f,rev}\,S_{gen}=2.75\) kJ, la forma del «trabajo perdido» que se precisa en el capítulo 12.</li>
<li>Con bloques de capacidades distintas, la temperatura final se acerca a la del bloque más grande.</li>
</ul></div>
</section>

<section>
<h2>Las relaciones T dS y el cálculo de la entropía</h2>
<p>Para un sistema simple compresible que sigue un camino reversible, \(\delta Q=T\,\dd S\) y \(\delta W=P\,\dd V\). La primera ley da las <span class="term">relaciones de Gibbs</span>, que solo contienen propiedades y por lo tanto valen para <b>cualquier</b> proceso:</p>
<div class="eq key" data-name="Relaciones de Gibbs">\[T\,\dd s=\dd u+P\,\dd v,\qquad T\,\dd s=\dd h-v\,\dd P.\]</div>
<h3>Sólidos y líquidos</h3>
<p>Con \(\dd v\approx0\) y \(\dd u=c\,\dd T\): \(s_2-s_1=c\ln(T_2/T_1)\). Calentar 1 kg de agua de 20 a 80 °C aumenta su entropía en 0.778 kJ/K.</p>
<h3>Gases ideales</h3>
<p>Con \(\dd h=c_p\,\dd T\) y \(v=RT/P\):</p>
<div class="eq key" data-name="Entropía del gas ideal">\[s_2-s_1=\int_1^2c_p(T)\frac{\dd T}{T}-R\ln\frac{P_2}{P_1}=c_v\ln\frac{T_2}{T_1}+R\ln\frac{v_2}{v_1}\ \ (c\ \text{constantes}).\]</div>
<p>En un proceso isentrópico con calores constantes se recuperan las relaciones adiabáticas del capítulo 7, \(Pv^k=\text{cte}\): <b>adiabático y reversible implica isentrópico</b>. Lo contrario no vale: un proceso puede ser isentrópico y no adiabático si la entropía que sale con el calor iguala a la generada.</p>
<h3>Cambios de fase</h3>
<p>Durante un cambio de fase a presión constante la temperatura no cambia, y \(s_{fg}=h_{fg}/T_{sat}\). Para el agua a 100 °C, \(s_{fg}=2256.4/373.15=6.047\) kJ/kg·K. Las tablas de vapor dan \(s\) directamente.</p>
<div class="box ex"><h4>Un cubo de hielo que se funde en la mesa</h4>
<p>Un kilogramo de hielo a 0 °C se funde en una cocina a 20 °C. Halle la entropía generada.</p>
<details><summary>Solución</summary><p>Hielo: \(\Delta S=Q/T=333.6/273.15=1.2213\) kJ/K. Cocina (depósito): \(\Delta S=-333.6/293.15=-1.1380\) kJ/K. Generada: \(S_{gen}=0.0833\) kJ/K &gt; 0. La irreversibilidad está en la transferencia de calor a través de una diferencia finita de temperatura.</p></details>
</div>
</section>

<section>
<h2>El diagrama T–s</h2>
<p>En un diagrama \(T\)–\(s\), el área bajo la curva de un proceso reversible es el calor por unidad de masa, \(q=\int T\,\dd s\), así como en el \(P\)–\(v\) es el trabajo. Los procesos isentrópicos son verticales; los isotérmicos, horizontales. Por eso el ciclo de Carnot es un rectángulo y el diagrama \(T\)–\(s\) es la herramienta preferida para analizar ciclos de potencia y refrigeración.</p>
<div class="sim" data-sim="ts-agua" data-title="El diagrama T–s del agua: isóbaras, calidades y áreas de calor"></div>
<div class="sim-guide"><ul>
<li>Las isóbaras son horizontales bajo el domo (cambio de fase a \(T\) constante) y suben como exponenciales en el vapor, donde \(\dd T/\dd s=T/c_p\).</li>
<li>Elija un proceso a presión constante entre dos estados: el área sombreada es el calor, igual a \(\Delta h\).</li>
<li>Las líneas de calidad constante dividen el domo; la expansión de una turbina ideal es una línea vertical que puede cruzarlas.</li>
</ul></div>
</section>

<section>
<h2>Eficiencias isentrópicas</h2>
<p>Las turbinas, compresores y toberas reales son casi adiabáticos pero no reversibles: generan entropía por fricción y turbulencia. Su referencia ideal es el proceso isentrópico entre la misma entrada y la misma presión de salida, y su calidad se mide con la <span class="term">eficiencia isentrópica</span>:</p>
<div class="eq key" data-name="Eficiencias isentrópicas">\[\eta_T=\frac{h_1-h_2}{h_1-h_{2s}},\qquad \eta_C=\frac{h_{2s}-h_1}{h_2-h_1},\qquad \eta_N=\frac{V_2^2}{V_{2s}^2}.\]</div>
<p>Valores típicos: 0.85–0.92 en turbinas grandes, 0.80–0.88 en compresores centrífugos y axiales, más de 0.95 en toberas.</p>
<div class="sim" data-sim="compresor-ts" data-title="Compresor de aire real e isentrópico en el diagrama T–s"></div>
<div class="sim-guide"><ul>
<li>Aire de 100 kPa y 300 K se comprime a 800 kPa. Isentrópicamente sale a 543 K; con \(\eta_C=0.85\), a 586 K, y su entropía aumenta 0.077 kJ/kg·K.</li>
<li>El trabajo extra (\(h_2-h_{2s}\)) termina como energía interna del aire de salida: un compresor ineficiente entrega aire más caliente.</li>
<li>Pase al modo turbina: la expansión real termina a la derecha y por encima de la isentrópica.</li>
</ul></div>
</section>

<section>
<h2>La entropía de mezcla</h2>
<p>Si dos gases ideales distintos, inicialmente separados a la misma \(T\) y \(P\), se mezclan, cada uno se expande hasta ocupar todo el volumen: su entropía aumenta como en una expansión libre, \(-R\ln x_i\) por mol. La mezcla genera</p>
<div class="eq key" data-name="Entropía de mezcla">\[\Delta S_{mez}=-\bar R\sum_in_i\ln x_i.\]</div>
<p>Formar un mol de aire a partir de oxígeno y nitrógeno puros genera 4.27 J/K. La separación inversa (plantas criogénicas de oxígeno, desalinización por ósmosis inversa) requiere como mínimo un trabajo \(T\Delta S_{mez}\).</p>
<p>Si los dos gases son idénticos, retirar la partición no cambia nada macroscópico y \(\Delta S=0\). Que la entropía salte de \(R\ln2\) a 0 según los gases sean apenas distintos o idénticos es la <span class="term">paradoja de Gibbs</span>; su solución exige que las partículas idénticas sean indistinguibles, un hecho cuántico (capítulo 20).</p>
<div class="sim" data-sim="mezcla" data-title="Mezcla de dos gases y crecimiento de la entropía"></div>
<div class="sim-guide"><ul>
<li>Retire la partición: las partículas rojas y azules se mezclan y no vuelven a separarse. La curva muestra la entropía de mezcla estimada contando partículas en celdas: crece hasta el valor ideal \(-Nk_B\sum x_i\ln x_i\) y fluctúa a su alrededor.</li>
<li>Con pocas partículas las fluctuaciones son grandes y a veces la entropía «baja» un poco: la segunda ley es estadística. Con \(10^{23}\) partículas esas fluctuaciones son inobservables.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un depósito a 500 K cede 1000 kJ a otro a 300 K. Halle la entropía generada.
<details><summary>Respuesta</summary><p>\(-1000/500+1000/300=1.333\) kJ/K.</p></details></li>
<li><span class="lvl">Básico</span>Halle el cambio de entropía de 2 kg de aire calentados a presión constante de 300 a 600 K (\(c_p=1.005\)).
<details><summary>Respuesta</summary><p>\(2(1.005)\ln2=1.393\) kJ/K.</p></details></li>
<li><span class="lvl">Intermedio</span>Vapor a 3 MPa y 400 °C se expande en una turbina adiabática hasta 50 kPa con \(\eta_T=0.85\). Halle el estado de salida y la entropía generada por kilogramo.
<details><summary>Respuesta</summary><p>\(h_1=3231.7\), \(s_1=6.9235\); \(h_{2s}=2407.9\) (\(x=0.897\)); \(h_2=2531.5\) kJ/kg, \(x_2=0.951\), \(s_2=7.2721\): \(s_{gen}=0.349\) kJ/kg·K.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Cuánta entropía se genera al estrangular R-134a líquido saturado de 0.8 MPa a 0.12 MPa?
<details><summary>Respuesta</summary><p>\(s_{gen}=s_2-s_1=0.0297\) kJ/kg·K (proceso adiabático, toda la variación es generación).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que poner en contacto dos bloques iguales a \(T_1\) y \(T_2\) siempre genera entropía, \(S_{gen}=mc\ln[(T_1+T_2)^2/(4T_1T_2)]\ge0\).
<details><summary>Respuesta</summary><p>\(T_f=(T_1+T_2)/2\); \(\Delta S=mc[\ln(T_f/T_1)+\ln(T_f/T_2)]=mc\ln[T_f^2/(T_1T_2)]\). Por la desigualdad entre las medias aritmética y geométrica, \(T_f\ge\sqrt{T_1T_2}\), con igualdad solo si \(T_1=T_2\).</p></details></li>
</ol>
<div class="box note"><h4>Para profundizar</h4><p>R. Clausius, «Über verschiedene für die Anwendung bequeme Formen der Hauptgleichungen der mechanischen Wärmetheorie», <em>Ann. Phys.</em> 125, 353 (1865). Çengel y Boles (2019), cap. 7. H. B. Callen, <em>Thermodynamics and an Introduction to Thermostatistics</em>, 2.ª ed., Wiley, 1985, caps. 1–4. E. T. Jaynes, «The Gibbs paradox», en <em>Maximum Entropy and Bayesian Methods</em>, Kluwer, 1992.</p></div>
</section>
</template>

<!-- 12-exergia.html -->
<template class="chapter-src" data-id="exergia" data-num="12" data-title="Exergía e irreversibilidad" data-part="Parte III · Segunda ley" data-short="Estado muerto, exergía del calor y factor de Carnot, trabajo reversible, irreversibilidad y teorema de Gouy–Stodola, exergía de sistemas cerrados y de flujo, balance de exergía y eficiencia de segunda ley de equipos domésticos e industriales">
<p class="lead">Un litro de agua a 40 °C y un litro de vapor a 550 °C pueden contener la misma energía si se toman las cantidades adecuadas, pero no valen lo mismo: con el vapor se mueve una turbina; con el agua tibia, apenas se lava la loza. La primera ley no distingue la calidad de la energía; la segunda sí. La <em>exergía</em> mide la parte de la energía que puede convertirse en trabajo útil en un ambiente dado, y la irreversibilidad mide cuánta se destruye. Es el concepto que guía el diseño de procesos eficientes.</p>

<section>
<h2>El estado muerto y la exergía del calor</h2>
<p>Un sistema solo puede producir trabajo mientras esté fuera de equilibrio con su entorno. Cuando alcanza la temperatura \(T_0\) y la presión \(P_0\) del ambiente (y, para la exergía química, su composición), está en el <span class="term">estado muerto</span>: ya no puede hacer nada. La <span class="term">exergía</span> es el máximo trabajo útil que se obtiene llevando el sistema reversiblemente desde su estado hasta el estado muerto.</p>
<p>El caso más simple es el calor. Una cantidad de calor \(Q\) disponible a temperatura \(T\) puede alimentar, como máximo, una máquina de Carnot que deseche al ambiente:</p>
<div class="eq key" data-name="Exergía del calor">\[X_Q=Q\left(1-\frac{T_0}{T}\right).\]</div>
<p>El paréntesis, el <span class="term">factor de Carnot</span>, mide la calidad del calor: 0.85 para una llama a 2000 K, 0.64 para vapor a 550 °C, 0.30 para un fluido geotérmico a 150 °C y apenas 0.05 para agua a 40 °C, con un ambiente a 25 °C. El calor a temperatura ambiente no vale nada como fuente de trabajo, aunque haya mucho: el océano contiene energía de sobra, pero casi ninguna exergía.</p>
<div class="sim" data-sim="factor-carnot" data-title="La calidad del calor: factor de Carnot según la temperatura"></div>
<div class="sim-guide"><ul>
<li>Las barras comparan 100 kJ de calor disponibles a distintas temperaturas: la energía es la misma; la exergía, muy distinta.</li>
<li>Por debajo de \(T_0\) el factor es negativo: el «frío» también tiene exergía, porque una máquina puede trabajar entre el ambiente y un cuerpo frío. La exergía del calor que se extrae de un congelador es \(Q(T_0/T-1)\).</li>
</ul></div>
</section>

<section>
<h2>Trabajo reversible e irreversibilidad</h2>
<p>El <span class="term">trabajo reversible</span> \(W_{rev}\) es el máximo trabajo útil (o el mínimo consumido) entre dos estados, intercambiando calor solo con el ambiente. La diferencia con el trabajo real es la <span class="term">irreversibilidad</span>, o exergía destruida. El teorema de Gouy (1889) y Stodola (1898) la relaciona con la entropía generada:</p>
<div class="eq key" data-name="Teorema de Gouy–Stodola">\[I=X_{dest}=W_{rev}-W_{útil}=T_0\,S_{gen}\ge0.\]</div>
<p>Cada irreversibilidad tiene un precio en trabajo perdido. Transferir calor \(Q\) de un cuerpo a \(T_H\) a otro a \(T_L\) destruye \(I=T_0Q(1/T_L-1/T_H)\). En una caldera, los gases de combustión a 1800 K calientan agua que hierve a 600 K: por cada megajulio transferido se destruyen 331 kJ de exergía, aunque la primera ley no registre pérdida alguna. Esa es la mayor irreversibilidad de una central térmica, mucho mayor que el calor que sale por la chimenea.</p>
<div class="sim" data-sim="perdida-calor" data-title="La exergía que se destruye al transferir calor a través de una diferencia de temperatura"></div>
<div class="sim-guide"><ul>
<li>La energía \(Q\) llega completa al lado frío; la exergía no. La diferencia es \(T_0S_{gen}\).</li>
<li>Con diferencias de temperatura pequeñas la destrucción es pequeña, pero hace falta un intercambiador más grande: es el compromiso económico de todo diseño térmico.</li>
</ul></div>
</section>

<section>
<h2>Exergía de sistemas cerrados y de corrientes</h2>
<p>Aplicando la primera y la segunda ley a un proceso reversible desde un estado cualquiera hasta el estado muerto se obtiene la exergía específica de un sistema cerrado y la de una corriente de flujo:</p>
<div class="eq key" data-name="Exergía de un sistema y de una corriente">\[\phi=(u-u_0)+P_0(v-v_0)-T_0(s-s_0)+\tfrac12V^2+gz,\qquad \psi=(h-h_0)-T_0(s-s_0)+\tfrac12V^2+gz.\]</div>
<p>El término \(-T_0(s-s_0)\) descuenta la energía que inevitablemente debe ir al ambiente como calor. El vapor a 10 MPa y 550 °C tiene 3397 kJ/kg de entalpía sobre el estado muerto pero solo 1491 kJ/kg de exergía (44 %). El vapor húmedo que sale de la turbina a 10 kPa todavía tiene 2240 kJ/kg de entalpía, pero apenas 143 kJ/kg de exergía: ese calor enorme que se tira al condensador casi no vale nada.</p>
<div class="sim" data-sim="exergia-vapor" data-title="Energía y exergía del agua en sus distintos estados"></div>
<div class="sim-guide"><ul>
<li>Recorra estados del agua: el líquido caliente tiene poca exergía; el vapor a alta presión y temperatura, mucha.</li>
<li>Cambie la temperatura ambiente: el estado muerto se mueve y la exergía cambia. La exergía depende del sistema y de su entorno.</li>
<li>En el diagrama \(h\)–\(s\) las líneas de exergía de flujo constante son rectas de pendiente \(T_0\) (en verde, cada 200 kJ/kg). La recta \(\psi=0\) pasa por el estado muerto; la exergía de flujo puede ser algo negativa en corrientes por debajo de la presión ambiente, porque habría que gastar trabajo para devolverlas a \(P_0\).</li>
</ul></div>
</section>

<section>
<h2>Eficiencia de segunda ley</h2>
<p>La eficiencia de primera ley compara energías; la de <span class="term">segunda ley</span> compara exergías: la útil frente a la gastada, o el desempeño real frente al reversible.</p>
<div class="eq key" data-name="Eficiencia de segunda ley">\[\eta_{II}=\frac{X_{recuperada}}{X_{suministrada}}=1-\frac{X_{dest}+X_{pérdidas}}{X_{suministrada}},\qquad \eta_{II,máquina}=\frac{\eta}{\eta_C},\qquad \eta_{II,refr}=\frac{\text{COP}}{\text{COP}_C}.\]</div>
<p>Los resultados son reveladores. Un calentador eléctrico de ambiente tiene eficiencia de primera ley del 100 %, pero de segunda ley del 3.7 % (calentar una habitación a 21 °C con 10 °C afuera): convierte electricidad, exergía pura, en calor de bajísima calidad. Una ducha eléctrica que calienta el agua de 16 a 38 °C tiene \(\eta_{II}=3.6\) %. Una bomba de calor con COP 3.5 que calienta agua a 45 °C, unos 30 %. La exergía señala dónde está el desperdicio verdadero.</p>
<div class="sim" data-sim="eficiencia-ii" data-title="Eficiencias de primera y segunda ley de equipos comunes"></div>
<div class="sim-guide"><ul>
<li>Elija un equipo y ajuste sus temperaturas. La barra de primera ley suele estar cerca del 100 %; la de segunda ley revela la oportunidad de mejora.</li>
<li>La central de ciclo combinado tiene la mejor eficiencia de segunda ley entre las de conversión de combustibles: más del 60 %.</li>
</ul></div>
<div class="box ex"><h4>La ducha eléctrica, vista con la segunda ley</h4>
<p>Una ducha eléctrica calienta agua de 16 °C a 38 °C. Con el ambiente a 16 °C, ¿cuál es su eficiencia de segunda ley?</p>
<details><summary>Solución</summary><p>Energía recibida por kilogramo de agua: \(c\Delta T=4.186(22)=92.1\) kJ, igual al trabajo eléctrico (primera ley: 100 %). Exergía ganada: \(c[(T_2-T_1)-T_0\ln(T_2/T_1)]=4.186[22-289.15\ln(311.15/289.15)]=3.34\) kJ. \(\eta_{II}=3.34/92.1=3.6\) %. Una bomba de calor ideal podría entregar el mismo baño con 3.6 % de esa electricidad.</p></details>
</div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Cuánta exergía tienen 500 kJ de calor disponibles a 400 °C con \(T_0=25\) °C?
<details><summary>Respuesta</summary><p>\(500(1-298.15/673.15)=278.5\) kJ.</p></details></li>
<li><span class="lvl">Básico</span>Una máquina térmica entre 800 K y 300 K tiene \(\eta=0.40\). Halle \(\eta_{II}\).
<details><summary>Respuesta</summary><p>\(\eta_C=0.625\); \(\eta_{II}=0.64\).</p></details></li>
<li><span class="lvl">Intermedio</span>Un intercambiador transfiere 50 kW de gases a 500 °C a aire a 50 °C, con \(T_0=25\) °C. Halle la exergía destruida (suponga temperaturas uniformes).
<details><summary>Respuesta</summary><p>\(I=298.15\times50(1/323.15-1/773.15)=26.9\) kW.</p></details></li>
<li><span class="lvl">Intermedio</span>Halle la exergía de flujo del vapor a 3 MPa y 400 °C con estado muerto a 25 °C y 100 kPa.
<details><summary>Respuesta</summary><p>\(\psi=(3231.7-104.9)-298.15(6.9234-0.3672)=1172\) kJ/kg.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que \(\eta_{II}\) de una bomba de calor ideal-real (COP = \(f\cdot\)COP\(_C\)) que calienta un espacio a \(T_H\) desde un ambiente a \(T_0\) es exactamente \(f\).
<details><summary>Respuesta</summary><p>Exergía entregada: \(Q_H(1-T_0/T_H)\); trabajo: \(Q_H/\text{COP}\). \(\eta_{II}=\text{COP}(1-T_0/T_H)=f\,\frac{T_H}{T_H-T_0}\cdot\frac{T_H-T_0}{T_H}=f\).</p></details></li>
</ol>
<div class="box note"><h4>Para profundizar</h4><p>Çengel y Boles (2019), cap. 8. A. Bejan, <em>Advanced Engineering Thermodynamics</em>, 4.ª ed., Wiley, 2016, cap. 3. J. Szargut, D. R. Morris y F. R. Steward, <em>Exergy Analysis of Thermal, Chemical, and Metallurgical Processes</em>, Hemisphere, 1988. M. Gouy, «Sur l'énergie utilisable», <em>J. Phys.</em> 8, 501 (1889).</p></div>
</section>
</template>

<!-- 13-ciclos-gas.html -->
<template class="chapter-src" data-id="ciclos-gas" data-num="13" data-title="Ciclos de potencia de gas" data-part="Parte IV · Ciclos" data-short="Hipótesis de aire estándar, ciclo Otto de los motores de gasolina, ciclos Diesel y dual, presión media efectiva, ciclo Stirling con regenerador, ciclo Brayton de las turbinas de gas con eficiencias reales, regeneración y relación de presiones óptima">
<p class="lead">Un motor de automóvil, una turbina de avión y la turbina de gas de una central eléctrica queman combustible dentro del propio fluido de trabajo, que entra como aire y sale como gases de escape. Ninguno opera en un ciclo cerrado, pero todos se entienden con ciclos ideales de aire que los imitan. Este capítulo los resuelve, explica por qué un motor diésel rinde más que uno de gasolina y por qué las turbinas de gas necesitan materiales cada vez más resistentes al calor.</p>

<section>
<h2>Las hipótesis de aire estándar</h2>
<p>Para analizar un motor de combustión interna como un ciclo termodinámico se adoptan las <span class="term">hipótesis de aire estándar</span>:</p>
<ol>
<li>El fluido de trabajo es aire, que circula en un ciclo cerrado y se comporta como gas ideal.</li>
<li>Todos los procesos son internamente reversibles.</li>
<li>La combustión se reemplaza por una adición de calor desde una fuente externa.</li>
<li>El escape se reemplaza por un rechazo de calor que devuelve el aire a su estado inicial.</li>
</ol>
<p>Si además los calores específicos se toman constantes a 25 °C (\(k=1.4\)), se habla de <span class="term">aire estándar frío</span>. Los resultados sobrestiman la eficiencia real, pero muestran con claridad el efecto de cada parámetro.</p>
<p>Una medida útil para comparar motores de distinto tamaño es la <span class="term">presión media efectiva</span>: la presión constante que, actuando durante toda la carrera, produciría el mismo trabajo neto, \(\text{PME}=w_{neto}/(v_{max}-v_{min})\).</p>
</section>

<section>
<h2>El ciclo Otto</h2>
<p>En el motor de cuatro tiempos de encendido por chispa (Nikolaus Otto, 1876), la mezcla aire-combustible se comprime, la bujía la enciende cerca del punto muerto superior y la combustión es tan rápida que ocurre casi a volumen constante. El ciclo ideal tiene cuatro procesos: compresión isentrópica 1–2, adición de calor a volumen constante 2–3, expansión isentrópica 3–4 y rechazo de calor a volumen constante 4–1. Con aire estándar frío,</p>
<div class="eq key" data-name="Eficiencia del ciclo Otto">\[\eta_{Otto}=1-\frac{1}{r^{k-1}},\qquad r=\frac{V_{max}}{V_{min}}.\]</div>
<p>La eficiencia solo depende de la relación de compresión: 0.565 con \(r=8\), 0.602 con \(r=10\). No se puede subir \(r\) indefinidamente: por encima de 10–12, la mezcla se autoenciende antes de la chispa (<span class="term">detonación</span> o «cascabeleo»), que daña el motor. La gasolina de mayor octanaje resiste más compresión.</p>
<div class="sim" data-sim="otto" data-title="Ciclo Otto de aire estándar"></div>
<div class="sim-guide"><ul>
<li>Con \(r=8\), aire a 100 kPa y 17 °C y 800 kJ/kg de calor: la temperatura máxima es 1780 K, la presión máxima 4.9 MPa, la eficiencia 0.565 y la PME 620 kPa.</li>
<li>La eficiencia no depende del calor añadido (con calores constantes), pero el trabajo y la PME sí.</li>
<li>Un motor real alcanza 25–35 %: el ciclo ideal ignora la fricción, las pérdidas de calor por las paredes, la combustión no instantánea y el trabajo de bombeo.</li>
</ul></div>
</section>

<section>
<h2>Los ciclos Diesel y dual</h2>
<p>En el motor diésel solo se comprime aire, hasta temperaturas que encienden el combustible inyectado (capítulo 7). La inyección dura una parte de la carrera de expansión, así que la combustión ocurre aproximadamente a presión constante. Con la <span class="term">relación de corte</span> \(r_c=V_3/V_2\),</p>
<div class="eq key" data-name="Eficiencia del ciclo Diesel">\[\eta_{Diesel}=1-\frac{1}{r^{k-1}}\,\frac{r_c^k-1}{k(r_c-1)}.\]</div>
<p>El cociente es mayor que 1: a igual relación de compresión, el Diesel es menos eficiente que el Otto. Pero como no hay riesgo de detonación, los motores diésel trabajan con \(r=14\) a 22, y eso los hace más eficientes en la práctica: con \(r=18\) y \(r_c=2\), \(\eta=0.632\). Los motores reales se describen mejor con el <span class="term">ciclo dual</span>, que añade calor parte a volumen y parte a presión constante.</p>
<div class="sim" data-sim="diesel" data-title="Ciclos Diesel, dual y Otto comparados"></div>
<div class="sim-guide"><ul>
<li>A igual relación de compresión y calor añadido, el Otto rinde más; el dual queda entre ambos.</li>
<li>Suba la relación de compresión del Diesel hasta 18: supera al Otto limitado a 9 por la detonación.</li>
</ul></div>
</section>

<section>
<h2>Ciclos con regeneración: Stirling y Ericsson</h2>
<p>¿Puede un ciclo de gas alcanzar la eficiencia de Carnot? Sí, si todo el calor se recibe y se cede a temperatura constante. El <span class="term">ciclo Stirling</span> (Robert Stirling, 1816) tiene dos isotermas y dos isócoras; el calor que el gas cede en la isócora de enfriamiento se almacena en un <span class="term">regenerador</span> (una malla metálica) y se devuelve en la isócora de calentamiento. Con un regenerador ideal, todo el calor externo entra a \(T_H\) y sale a \(T_C\), y \(\eta=1-T_C/T_H\). Los motores Stirling funcionan con cualquier fuente de calor externa (solar, biomasa, radioisótopos) y son silenciosos; se usan en submarinos, criogenia y generación solar.</p>
<div class="sim" data-sim="stirling" data-title="Ciclo Stirling: el papel del regenerador"></div>
<div class="sim-guide"><ul>
<li>Con efectividad del regenerador igual a 1, la eficiencia coincide con la de Carnot.</li>
<li>Sin regenerador, el calor de las isócoras debe venir de la fuente y la eficiencia cae a menos de la mitad.</li>
</ul></div>
</section>

<section>
<h2>El ciclo Brayton y las turbinas de gas</h2>
<p>En una turbina de gas el aire se comprime en un compresor axial o centrífugo, se calienta en una cámara de combustión a presión constante y se expande en una turbina que mueve el compresor y entrega el resto como trabajo útil o como empuje. El ciclo ideal de Brayton (1872) tiene dos isentrópicas y dos isóbaras. Con aire estándar frío y relación de presiones \(r_p=P_2/P_1\),</p>
<div class="eq key" data-name="Eficiencia del ciclo Brayton ideal">\[\eta_{Brayton}=1-\frac{1}{r_p^{(k-1)/k}}.\]</div>
<p>Una peculiaridad decisiva: el compresor consume una fracción enorme del trabajo de la turbina, la <span class="term">relación de trabajo de retroceso</span> (40–80 %). Por eso las eficiencias del compresor y de la turbina importan muchísimo: con \(r_p=8\), \(T_3=1300\) K, \(\eta_C=0.80\) y \(\eta_T=0.85\), la eficiencia cae de 0.448 (ideal) a 0.27. Para una temperatura máxima dada, el trabajo neto es máximo cuando \(r_p=(T_3/T_1)^{k/[2(k-1)]}\).</p>
<p>Cuando los gases de escape salen más calientes que el aire comprimido, un <span class="term">regenerador</span> puede precalentar el aire con ellos: con efectividad 0.8, la eficiencia del ejemplo sube de 0.27 a 0.36. Las turbinas modernas de las centrales alcanzan 40 % solas y más de 60 % combinadas con un ciclo de vapor (capítulo 14); las de avión trabajan con \(T_3\) por encima de 1800 K gracias a álabes monocristalinos refrigerados y recubrimientos cerámicos.</p>
<div class="sim" data-sim="brayton" data-title="Ciclo Brayton real con regenerador"></div>
<div class="sim-guide"><ul>
<li>La curva de eficiencia contra relación de presiones tiene un máximo en el ciclo real; en el ideal crece sin límite.</li>
<li>Active el regenerador: es muy útil a relaciones de presión bajas y estorba a altas, cuando el escape ya está más frío que el aire comprimido.</li>
<li>Suba la temperatura de entrada a la turbina: es el parámetro que más mejora el desempeño.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Qué eficiencia tiene un ciclo Otto ideal con \(r=10.5\)?
<details><summary>Respuesta</summary><p>\(1-10.5^{-0.4}=0.609\).</p></details></li>
<li><span class="lvl">Básico</span>Un ciclo Brayton ideal tiene \(r_p=12\). Halle su eficiencia.
<details><summary>Respuesta</summary><p>\(1-12^{-0.2857}=0.508\).</p></details></li>
<li><span class="lvl">Intermedio</span>Un ciclo Diesel ideal tiene \(r=20\), \(T_1=300\) K y \(T_3=2000\) K. Halle \(r_c\) y la eficiencia.
<details><summary>Respuesta</summary><p>\(T_2=994.3\) K; \(r_c=T_3/T_2=2.011\); \(\eta=1-20^{-0.4}(2.011^{1.4}-1)/(1.4\times1.011)=0.646\).</p></details></li>
<li><span class="lvl">Intermedio</span>Para \(T_1=300\) K y \(T_3=1300\) K, ¿qué relación de presiones da el máximo trabajo neto en el ciclo Brayton ideal y cuánto vale ese trabajo?
<details><summary>Respuesta</summary><p>\(r_p=(1300/300)^{1.75}=13.0\); \(T_2=T_4=\sqrt{T_1T_3}=624.5\) K; \(w=c_p(T_3-T_4-T_2+T_1)=1.005(1300-2\times624.5+300)=353\) kJ/kg.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que la eficiencia de un ciclo Brayton ideal con regenerador perfecto es \(1-(T_1/T_3)\,r_p^{(k-1)/k}\) y que disminuye al aumentar \(r_p\).
<details><summary>Respuesta</summary><p>Con regenerador ideal, \(q_{in}=c_p(T_3-T_4)\) y \(q_{out}=c_p(T_2-T_1)\). Usando \(T_2=T_1r_p^{(k-1)/k}\), \(T_4=T_3r_p^{-(k-1)/k}\): \(q_{out}/q_{in}=(T_1/T_3)r_p^{(k-1)/k}\). Crece con \(r_p\), así que \(\eta\) disminuye.</p></details></li>
</ol>
<div class="box note"><h4>Para profundizar</h4><p>Çengel y Boles (2019), cap. 9. J. B. Heywood, <em>Internal Combustion Engine Fundamentals</em>, 2.ª ed., McGraw-Hill, 2018. H. I. H. Saravanamuttoo, G. F. C. Rogers, H. Cohen y P. V. Straznicky, <em>Gas Turbine Theory</em>, 7.ª ed., Pearson, 2017. G. Walker, <em>Stirling Engines</em>, Clarendon Press, 1980.</p></div>
</section>
</template>

<!-- 14-ciclos-vapor.html -->
<template class="chapter-src" data-id="ciclos-vapor" data-num="14" data-title="Ciclos de potencia de vapor" data-part="Parte IV · Ciclos" data-short="El ciclo de Rankine de las centrales térmicas, el efecto de las presiones y del sobrecalentamiento, el recalentamiento, la regeneración con calentadores de agua de alimentación, desviaciones reales, cogeneración y ciclos combinados de gas y vapor">
<p class="lead">Las centrales de carbón, nucleares, solares de concentración, geotérmicas y la mitad de cada central de ciclo combinado convierten calor en electricidad con agua que hierve, mueve una turbina, se condensa y vuelve a la caldera. Ese ciclo, propuesto por William Rankine en 1859, produce la mayor parte de la electricidad del mundo. Este capítulo lo resuelve con las tablas de vapor y recorre, una a una, las mejoras que llevaron su eficiencia del 10 % a casi el 50 %.</p>

<section>
<h2>El ciclo de Rankine ideal</h2>
<p>El ciclo de Carnot con vapor sería impráctico: comprimir una mezcla húmeda es difícil y limitarlo al domo restringe la temperatura máxima. El <span class="term">ciclo de Rankine</span> lo resuelve condensando el vapor por completo y bombeando líquido:</p>
<ol>
<li><b>1–2 Bomba</b>: el líquido saturado del condensador se comprime isentrópicamente hasta la presión de la caldera. Como el líquido es casi incompresible, \(w_b=v_1(P_2-P_1)\): muy poco trabajo.</li>
<li><b>2–3 Caldera</b>: el agua se calienta, hierve y se sobrecalienta a presión constante: \(q_{ent}=h_3-h_2\).</li>
<li><b>3–4 Turbina</b>: el vapor se expande isentrópicamente: \(w_t=h_3-h_4\).</li>
<li><b>4–1 Condensador</b>: el vapor húmedo se condensa a presión constante cediendo \(q_{sal}=h_4-h_1\) al agua de enfriamiento.</li>
</ol>
<div class="eq key" data-name="Eficiencia del ciclo de Rankine">\[\eta=\frac{w_t-w_b}{q_{ent}}=1-\frac{h_4-h_1}{h_3-h_2}.\]</div>
<p>La relación de trabajo de retroceso es menor que 1 %, frente al 40–80 % de las turbinas de gas: bombear líquido es barato. Con vapor a 3 MPa y 350 °C y un condensador a 75 kPa, la eficiencia ideal es 26.0 %.</p>
<div class="sim" data-sim="rankine" data-title="Ciclo de Rankine en el diagrama T–s del agua"></div>
<div class="sim-guide"><ul>
<li>El área encerrada en el diagrama \(T\)–\(s\) es el trabajo neto; el área bajo la línea 4–1, el calor que se tira al condensador.</li>
<li>Con 3 MPa, 350 °C y 75 kPa: \(\eta=0.260\) y \(x_4=0.886\). Baje el condensador a 10 kPa: \(\eta=0.334\), pero \(x_4=0.813\): demasiada humedad para la turbina.</li>
<li>Active el recalentamiento y las eficiencias isentrópicas reales de la turbina y la bomba para ver cada efecto por separado.</li>
</ul></div>
</section>

<section>
<h2>Cómo aumentar la eficiencia</h2>
<p>La idea general es la de Carnot: subir la temperatura media a la que se recibe el calor y bajar la temperatura a la que se cede.</p>
<ul>
<li><b>Bajar la presión del condensador</b>. A 10 kPa el agua se condensa a 45.8 °C. El límite es la temperatura del agua de enfriamiento (un río, el mar, una torre de enfriamiento). El condensador trabaja al vacío, y hay que evitar que entre aire.</li>
<li><b>Sobrecalentar el vapor</b>. Eleva la temperatura media de adición de calor y además seca el vapor de salida. El límite son los materiales: los aceros ferríticos de las tuberías y turbinas aguantan unos 565 °C; los austeníticos y las superaleaciones de níquel de las centrales ultrasupercríticas, 600–700 °C.</li>
<li><b>Subir la presión de la caldera</b>. Sube la temperatura de ebullición, pero aumenta la humedad a la salida de la turbina. Las centrales modernas operan por encima del punto crítico (25–30 MPa): el agua no hierve, pasa continuamente a vapor.</li>
</ul>
<div class="sim" data-sim="rankine-mapa" data-title="Mapa de eficiencia del ciclo de Rankine según la presión de la caldera y la temperatura del vapor"></div>
<div class="sim-guide"><ul>
<li>Las curvas de nivel muestran la eficiencia ideal; la región sombreada, los diseños con calidad a la salida de la turbina menor que 0.88, inaceptables sin recalentamiento.</li>
<li>Con 15 MPa y 600 °C sin recalentamiento, la eficiencia ideal es 43.0 % pero la calidad de salida es 0.80. Con recalentamiento a 4 MPa y 600 °C, 45.0 % y 0.90.</li>
</ul></div>
</section>

<section>
<h2>Recalentamiento y regeneración</h2>
<p>El <span class="term">recalentamiento</span> expande el vapor en una turbina de alta presión, lo devuelve a la caldera para recalentarlo y lo expande de nuevo en una de baja. Su principal virtud es secar el vapor de salida; mejora además la eficiencia unos 4–5 puntos. Más de dos recalentamientos no compensan su costo.</p>
<p>La <span class="term">regeneración</span> extrae una fracción \(y\) del vapor de la turbina a una presión intermedia y la usa para precalentar el agua de alimentación antes de la caldera. Así la caldera recibe agua más caliente y la temperatura media de adición de calor sube. En un <span class="term">calentador abierto</span> el vapor extraído se mezcla con el agua de alimentación; la fracción se obtiene del balance de energía, \(y=(h_3-h_2)/(h_6-h_2)\). Las centrales grandes usan siete u ocho calentadores (abiertos y cerrados) y la regeneración aporta varios puntos de eficiencia.</p>
<div class="sim" data-sim="regenerativo" data-title="Ciclo regenerativo con un calentador abierto de agua de alimentación"></div>
<div class="sim-guide"><ul>
<li>Con 15 MPa, 600 °C, condensador a 10 kPa y un calentador abierto a 1.2 MPa, se extrae el 22.7 % del vapor y la eficiencia ideal sube de 43.0 % a 46.3 %.</li>
<li>Barra la presión de extracción: la eficiencia tiene un máximo amplio cuando la temperatura de saturación del calentador está más o menos a medio camino entre las de la caldera y el condensador.</li>
</ul></div>
</section>

<section>
<h2>Ciclos reales, cogeneración y ciclo combinado</h2>
<p>En la central real hay pérdidas de presión en la caldera y las tuberías, transferencia de calor al ambiente y, sobre todo, irreversibilidades en la turbina (\(\eta_T\approx0.85\)–0.92). La eficiencia neta de una central de carbón subcrítica es 33–38 %; de una ultrasupercrítica, 44–47 %; de una nuclear de agua a presión, que produce vapor saturado a unos 7 MPa, 33 %.</p>
<p>El calor del condensador es enorme y de baja calidad. Si se necesita calor de proceso a temperatura moderada (una fábrica de papel, un ingenio azucarero, calefacción urbana), se puede extraer vapor a la presión requerida: es la <span class="term">cogeneración</span>, que aprovecha hasta el 80–90 % de la energía del combustible. Los ingenios del valle del Cauca generan así su vapor de proceso y su electricidad quemando bagazo.</p>
<p>El <span class="term">ciclo combinado</span> une una turbina de gas, que recibe el calor a muy alta temperatura (1500–1700 K), con un ciclo de vapor que aprovecha sus gases de escape (800–900 K) en una caldera de recuperación. Si la turbina de gas tiene eficiencia \(\eta_G\) y el ciclo de vapor \(\eta_V\) sobre el calor que recupera,</p>
<div class="eq">\[\eta_{CC}\approx\eta_G+\varepsilon_{rec}\,\eta_V\,(1-\eta_G),\]</div>
<p>con \(\varepsilon_{rec}\) la fracción del calor de escape que se recupera. Con \(\eta_G=0.38\), \(\eta_V=0.33\) y \(\varepsilon_{rec}=0.85\), resulta 0.55; las mejores centrales superan el 63 %, la máxima eficiencia de cualquier máquina térmica comercial.</p>
<div class="sim" data-sim="combinado" data-title="Ciclo combinado: turbina de gas, caldera de recuperación y turbina de vapor"></div>
<div class="sim-guide"><ul>
<li>El simulador resuelve el Brayton con eficiencias reales, la caldera de recuperación con un punto de pinza mínimo y el Rankine con las tablas de vapor, y suma potencias.</li>
<li>Aumente la temperatura de entrada a la turbina de gas: mejora ambos ciclos, porque los gases de escape salen más calientes.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Halle el trabajo de la bomba de un ciclo con condensador a 10 kPa y caldera a 15 MPa.
<details><summary>Respuesta</summary><p>\(w=v_f(P_2-P_1)=0.00101(14\,990)=15.1\) kJ/kg.</p></details></li>
<li><span class="lvl">Básico</span>¿Qué calidad tiene el vapor a la salida de una turbina ideal que recibe vapor a 3 MPa y 600 °C y descarga a 10 kPa?
<details><summary>Respuesta</summary><p>\(s=7.5103\); \(x=(7.5103-0.6492)/7.4996=0.915\).</p></details></li>
<li><span class="lvl">Intermedio</span>Un ciclo de Rankine ideal opera entre 3 MPa, 350 °C y 75 kPa. Halle la eficiencia y el caudal de vapor para producir 50 MW netos.
<details><summary>Respuesta</summary><p>\(\eta=0.260\), \(w_{neto}=710\) kJ/kg; \(\dot m=50\,000/710=70.4\) kg/s.</p></details></li>
<li><span class="lvl">Intermedio</span>Repita el problema anterior con \(\eta_T=0.87\) y \(\eta_B=0.85\).
<details><summary>Respuesta</summary><p>\(\eta=0.226\); \(w_{neto}=617\) kJ/kg; \(\dot m=81.1\) kg/s.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que, para un ciclo de Rankine ideal, \(\eta=1-T_C/\bar T_H\), con \(\bar T_H=(h_3-h_2)/(s_3-s_2)\) la temperatura media termodinámica de adición de calor.
<details><summary>Respuesta</summary><p>El calor se añade reversiblemente a presión constante: \(q_{ent}=\int T\,\dd s=\bar T_H(s_3-s_2)\). El rechazo ocurre a \(T_C\) constante con el mismo \(\Delta s\): \(q_{sal}=T_C(s_3-s_2)\). Entonces \(\eta=1-q_{sal}/q_{ent}=1-T_C/\bar T_H\).</p></details></li>
</ol>
<div class="box note"><h4>Para profundizar</h4><p>Çengel y Boles (2019), cap. 10. W. J. M. Rankine, <em>A Manual of the Steam Engine and Other Prime Movers</em>, 1859. R. Kehlhofer, F. Hannemann, F. Stirnimann y B. Rukes, <em>Combined-Cycle Gas &amp; Steam Turbine Power Plants</em>, 3.ª ed., PennWell, 2009. IEA, <em>Technology Roadmap: High-Efficiency, Low-Emissions Coal-Fired Power Generation</em>, 2012.</p></div>
</section>

<template class="chapter-src" data-id="refrigeracion" data-num="15" data-title="Refrigeración y bombas de calor" data-part="Parte IV · Ciclos" data-short="El ciclo de Carnot invertido, el ciclo de compresión de vapor ideal y real en el diagrama P–h, refrigerantes y su efecto ambiental, la nevera doméstica, bombas de calor para agua caliente, refrigeración por absorción y el ciclo de gas de los aviones">
<p class="lead">La nevera es probablemente la máquina térmica más común de una casa, y una de las que más energía consume. Funciona al revés que una central: gasta trabajo para sacar calor de un lugar frío y echarlo a uno más caliente. Este capítulo resuelve su ciclo con las propiedades reales del refrigerante, calcula cuánto cuesta mantenerla encendida y muestra cómo el mismo aparato, mirado desde el lado caliente, puede calentar agua con un tercio de la electricidad de una ducha eléctrica.</p>

<section>
<h2>Del ciclo de Carnot invertido al ciclo de compresión de vapor</h2>
<p>El refrigerador de Carnot tiene el máximo COP posible, \(T_C/(T_H-T_C)\), pero es impracticable: exigiría comprimir una mezcla húmeda y expandir líquido en una turbina diminuta. El <span class="term">ciclo ideal de compresión de vapor</span> lo resuelve con dos cambios: el refrigerante se evapora por completo antes del compresor, y la turbina se reemplaza por una válvula de expansión o un tubo capilar (capítulo 8). Sus cuatro procesos son:</p>
<ol>
<li><b>1–2 Compresión isentrópica</b> de vapor saturado hasta la presión del condensador: \(w=h_2-h_1\).</li>
<li><b>2–3 Condensación</b> a presión constante: el refrigerante cede \(q_H=h_2-h_3\) al ambiente (la rejilla detrás de la nevera).</li>
<li><b>3–4 Estrangulamiento</b>: \(h_4=h_3\); la temperatura cae por debajo de la del espacio refrigerado.</li>
<li><b>4–1 Evaporación</b> a presión constante: el refrigerante absorbe \(q_L=h_1-h_4\) del interior.</li>
</ol>
<div class="eq key" data-name="COP del ciclo de compresión de vapor">\[\text{COP}_R=\frac{h_1-h_4}{h_2-h_1},\qquad \text{COP}_{BC}=\frac{h_2-h_3}{h_2-h_1}.\]</div>
<p>El diagrama natural de este ciclo es el \(P\)–\(h\): la evaporación y la condensación son horizontales, el estrangulamiento vertical, y las longitudes horizontales son directamente los calores y el trabajo.</p>
<div class="sim" data-sim="refrig-ph" data-title="Ciclo de compresión de vapor con R-134a en el diagrama P–h"></div>
<div class="sim-guide"><ul>
<li>Entre 0.14 y 0.8 MPa (−18.8 °C y 31.3 °C) con 0.05 kg/s, el ciclo ideal extrae 7.18 kW, consume 1.81 kW y tiene COP 3.97. El vapor sale del compresor a 39 °C.</li>
<li>Agregue los efectos reales: compresor con eficiencia 0.80, 5 K de sobrecalentamiento y 3 K de subenfriamiento. El COP cae a 3.28 y el vapor sale a 53 °C.</li>
<li>El subenfriamiento mejora la capacidad (la entalpía en 4 baja); el sobrecalentamiento protege al compresor de recibir gotas de líquido.</li>
</ul></div>
</section>

<section>
<h2>Los refrigerantes y el ambiente</h2>
<p>Un buen refrigerante tiene una presión de evaporación algo mayor que la atmosférica (para que no entre aire) a la temperatura del evaporador, un calor latente grande, es químicamente estable y no es tóxico ni inflamable. Los clorofluorocarbonos (CFC, como el R-12) cumplían todo eso, pero destruían el ozono estratosférico; el Protocolo de Montreal (1987) los prohibió. Sus reemplazos, los hidrofluorocarbonos como el R-134a, no dañan el ozono pero son potentes gases de efecto invernadero: un kilogramo de R-134a equivale a 1430 kg de CO₂ en cien años. La enmienda de Kigali (2016) obliga a reducirlos.</p>

<section>
<h2>La nevera de la casa</h2>
<p>Una nevera bien aislada pierde calor por sus paredes de espuma de poliuretano, por los empaques de las puertas y cada vez que se abre. En régimen estacionario el compresor debe sacar exactamente esa carga térmica, y la electricidad que consume es la carga dividida por el COP real. Como el COP cae al aumentar la diferencia de temperaturas, una nevera junto a la estufa o al sol, con el congelador más frío de lo necesario o con la rejilla trasera llena de polvo consume bastante más.</p>
<div class="sim" data-sim="nevera" data-title="¿Cuánto consume una nevera? Carga térmica y COP"></div>
<div class="sim-guide"><ul>
<li>El modelo combina la carga por las paredes (\(UA\,\Delta T\)) de los dos compartimentos, las aperturas de puerta y el ciclo de R-134a con temperaturas de evaporación y condensación separadas 8–15 K de las del aire.</li>
<li>Con 22 °C en la cocina, 4 °C en la nevera y −18 °C en el congelador, el consumo estimado ronda 30 kWh al mes, en el intervalo de las etiquetas de eficiencia de las neveras de 300 L.</li>
<li>Suba la temperatura de la cocina 8 °C: el consumo aumenta más de un 50 %. Es la razón para no poner la nevera junto a la estufa.</li>
</ul></div>
</section>

<section>
<h2>Bombas de calor</h2>
<p>Una bomba de calor es el mismo ciclo usado para calentar: el evaporador saca calor del aire exterior (o del suelo, o de un río) y el condensador lo entrega al agua o al aire interior. Su \(\text{COP}_{BC}=\text{COP}_R+1\) es siempre mayor que 1. En climas templados, como el de los Andes colombianos, las bombas de calor para agua caliente sanitaria tienen COP de 3 a 4.5 todo el año, porque el aire exterior nunca está muy frío.</p>
<div class="sim" data-sim="bomba-calor" data-title="Agua caliente para la ducha: resistencia, gas o bomba de calor"></div>
<div class="sim-guide"><ul>
<li>La bomba de calor se calcula con el ciclo de R-134a: el evaporador 8 K por debajo del aire, el condensador 8 K por encima del agua y un compresor con eficiencia 0.70.</li>
<li>Con aire a 18 °C y agua a 45 °C, el COP resulta 4.5: el mismo baño cuesta menos de una cuarta parte de la energía de la ducha eléctrica.</li>
<li>Las tarifas son ajustables: compare con el gas natural, cuyo calentador tiene eficiencia de 75–90 %.</li>
</ul></div>
</section>

<section>
<h2>Otros ciclos de refrigeración</h2>
<p>La <span class="term">refrigeración por absorción</span> reemplaza el compresor por un absorbedor, una bomba de líquido y un generador que recibe calor: el refrigerante (amoníaco o agua) se disuelve en un absorbente (agua o bromuro de litio) a baja presión y se libera calentando la solución a alta presión. Bombear un líquido cuesta muy poco trabajo; casi toda la energía de entrada es calor, que puede venir de gas, del sol o de calor residual. Su COP es bajo (0.6–1.2), pero son silenciosas y aprovechan energía barata: las neveras de gas de los vehículos de recreo y los enfriadores de los hoteles las usan.</p>
<p>El <span class="term">ciclo de refrigeración de gas</span> es el Brayton invertido: el aire se comprime, se enfría con el ambiente, se expande en una turbina hasta temperaturas muy bajas y absorbe calor del espacio refrigerado. Su COP es menor que el de compresión de vapor, pero el equipo es liviano y usa el propio aire: es el sistema de aire acondicionado de los aviones, y con regeneración, la base de la licuefacción de gases.</p>
<div class="sim" data-sim="brayton-inverso" data-title="Ciclo de refrigeración de gas (Brayton invertido)"></div>
<div class="sim-guide"><ul>
<li>Con aire que entra al compresor a 0 °C, se enfría a 35 °C y una relación de presiones de 4, la turbina entrega aire a unos −65 °C y el COP ideal es 2.06.</li>
<li>El COP real cae mucho con las eficiencias del compresor y la turbina, porque el trabajo neto es la diferencia de dos trabajos grandes.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un refrigerador con COP 2.2 extrae 300 W del interior. ¿Cuánta potencia consume y cuánto calor cede a la cocina?
<details><summary>Respuesta</summary><p>136 W; 436 W.</p></details></li>
<li><span class="lvl">Básico</span>¿Cuál es el máximo COP de un aire acondicionado que mantiene 24 °C con 32 °C afuera?
<details><summary>Respuesta</summary><p>\(297.15/8=37\). Los equipos reales logran 3–6: la diferencia de temperaturas en los intercambiadores es mucho mayor que 8 K.</p></details></li>
<li><span class="lvl">Intermedio</span>Un ciclo ideal de R-134a opera entre −10 °C y 40 °C. Halle el COP, el efecto refrigerante y la temperatura de descarga.
<details><summary>Respuesta</summary><p>\(q_L=136.3\) kJ/kg, \(w=33.8\) kJ/kg, COP = 4.03, \(T_2=46.3\) °C (propiedades de Tillner-Roth y Baehr, como en la simulación).</p></details></li>
<li><span class="lvl">Intermedio</span>Una bomba de calor con COP 4 reemplaza una ducha eléctrica de 5.5 kW usada 30 minutos al día. Con la electricidad a $850/kWh, ¿cuánto ahorra al mes?
<details><summary>Respuesta</summary><p>Ducha: 82.5 kWh/mes; bomba: 20.6 kWh/mes. Ahorro: 61.9 kWh ≈ $52 600 al mes.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que el COP del ciclo de Brayton invertido ideal es \(1/(r_p^{(k-1)/k}-1)\).
<details><summary>Respuesta</summary><p>\(q_L=c_p(T_1-T_4)\), \(w=c_p[(T_2-T_1)-(T_3-T_4)]\). Con \(T_2=T_1\tau\), \(T_4=T_3/\tau\), \(\tau=r_p^{(k-1)/k}\): \(w=c_p(\tau-1)(T_1-T_3/\tau)=(\tau-1)\,c_p(T_1-T_4)\). Entonces COP \(=1/(\tau-1)\).</p></details></li>
</ol>
<div class="box note"><h4>Para profundizar</h4><p>Çengel y Boles (2019), cap. 11. W. F. Stoecker y J. W. Jones, <em>Refrigeración y acondicionamiento de aire</em>, McGraw-Hill, 1985. ASHRAE, <em>Handbook — Refrigeration</em>, 2022. R. Tillner-Roth y H. D. Baehr, «An international standard formulation for the thermodynamic properties of 1,1,1,2-tetrafluoroethane (HFC-134a)», <em>J. Phys. Chem. Ref. Data</em> 23, 657 (1994).</p></div>
</section>
