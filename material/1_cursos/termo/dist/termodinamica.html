<!-- 22-gases-cuanticos.html -->
<template class="chapter-src" data-id="gases-cuanticos" data-num="22" data-title="Gases cuánticos y radiación" data-part="Parte VI · Termodinámica estadística" data-short="Fermiones y bosones, distribuciones de Fermi–Dirac y de Bose–Einstein, el gas de fotones y la ley de Planck, el fondo cósmico de microondas, los electrones de un metal y su capacidad calorífica, la condensación de Bose–Einstein y el gas de fonones de Debye">
<p class="lead">Cuando la longitud de onda térmica de las partículas se acerca a la distancia entre ellas, la física clásica deja de servir y el carácter cuántico de las partículas idénticas se vuelve decisivo. Los fermiones (electrones, protones, neutrones) no pueden ocupar el mismo estado; los bosones (fotones, fonones, átomos de helio-4) prefieren hacerlo. De esa diferencia salen la radiación de cuerpo negro, la estabilidad de las enanas blancas, la conducción eléctrica de los metales y los condensados de Bose–Einstein. Este capítulo recorre esos gases cuánticos con la maquinaria del capítulo 21.</p>

<section>
<h2>Fermiones y bosones</h2>
<p>Para partículas idénticas que no interactúan, conviene contar cuántas ocupan cada estado de una partícula. Con un depósito que fija la temperatura y el potencial químico \(\mu\), el número medio de partículas en un estado de energía \(\varepsilon\) es</p>
<div class="eq key" data-name="Distribuciones cuánticas">\[\bar n_{FD}=\frac{1}{\ee^{(\varepsilon-\mu)/k_BT}+1},\qquad \bar n_{BE}=\frac{1}{\ee^{(\varepsilon-\mu)/k_BT}-1},\qquad \bar n_{MB}=\ee^{-(\varepsilon-\mu)/k_BT}.\]</div>
<p>La de Fermi–Dirac nunca supera 1, por el principio de exclusión de Pauli. La de Bose–Einstein diverge cuando \(\varepsilon\to\mu\): los bosones se acumulan en los estados más bajos. Cuando la ocupación es muy pequeña (\(\varepsilon-\mu\gg k_BT\)) las tres coinciden con la de Maxwell–Boltzmann: es el régimen clásico, en el que \(n\lambda^3\ll1\).</p>
<div class="sim" data-sim="distribuciones" data-title="Ocupación media de un estado: Fermi–Dirac, Bose–Einstein y Maxwell–Boltzmann"></div>
<div class="sim-guide"><ul>
<li>El eje horizontal es \((\varepsilon-\mu)/k_BT\). Para valores grandes las tres curvas se juntan.</li>
<li>La de Fermi–Dirac vale exactamente ½ en \(\varepsilon=\mu\), y se vuelve un escalón cuando \(T\to0\).</li>
</ul></div>
</section>

<section>
<h2>El gas de fotones y la ley de Planck</h2>
<p>Los fotones dentro de una cavidad a temperatura \(T\) son bosones sin masa cuyo número no se conserva, así que \(\mu=0\). Contando los modos electromagnéticos de la cavidad (dos polarizaciones, densidad \(8\pi\nu^2/c^3\) por unidad de volumen y de frecuencia) y multiplicando por la ocupación de Bose–Einstein y por \(h\nu\), Planck obtuvo en 1900 la densidad espectral de energía:</p>
<div class="eq key" data-name="Ley de Planck">\[u_\nu(T)=\frac{8\pi h\nu^3}{c^3}\,\frac{1}{\ee^{h\nu/k_BT}-1},\qquad u=\int_0^\infty u_\nu\,\dd\nu=\frac{4\sigma}{c}T^4.\]</div>
<p>De la mecánica estadística salen además la presión de radiación \(P=u/3\), la entropía \(S=\tfrac43uV/T\) y el número de fotones \(n=0.2436\,(k_BT/\hbar c)^3\). La constante de Stefan–Boltzmann queda expresada con constantes fundamentales, \(\sigma=2\pi^5k_B^4/(15h^3c^2)\), lo que se comprobó con exactitud a principios del siglo XX.</p>
<p>El universo entero está lleno de un gas de fotones: el <span class="term">fondo cósmico de microondas</span>, emitido cuando el universo se volvió transparente, 380 000 años después de la Gran Explosión, y enfriado por la expansión hasta 2.7255 K. El satélite COBE midió en 1990 que su espectro es el de Planck con una desviación menor que 50 partes por millón: el cuerpo negro más perfecto conocido. Hay unos 411 fotones del fondo por centímetro cúbico, y su máximo está en 160 GHz.</p>
<div class="sim" data-sim="foton-gas" data-title="El gas de fotones: espectro de Planck y propiedades termodinámicas"></div>
<div class="sim-guide"><ul>
<li>Del fondo cósmico (2.7 K) a la superficie del Sol (5772 K): la densidad de energía crece como \(T^4\) y la de fotones como \(T^3\), de modo que la energía media por fotón es \(2.70\,k_BT\).</li>
<li>La presión de radiación en la superficie del Sol es 0.28 Pa; en el centro de las estrellas masivas domina sobre la del gas.</li>
</ul></div>
</section>

<section>
<h2>Electrones en un metal</h2>
<p>Los electrones de conducción de un metal forman un gas de Fermi muy denso: \(n=8.47\times10^{28}\) m⁻³ en el cobre. A 0 K llenan todos los estados hasta la <span class="term">energía de Fermi</span>,</p>
<div class="eq">\[E_F=\frac{\hbar^2}{2m}\left(3\pi^2n\right)^{2/3},\]</div>
<p>7.0 eV para el cobre, equivalente a una temperatura de Fermi de 81 600 K. A temperatura ambiente, el gas es por lo tanto «frío»: casi todos los estados por debajo de \(E_F\) siguen ocupados, y solo una franja de ancho \(\sim k_BT\) cerca de \(E_F\) puede excitarse. Eso resolvió un misterio del siglo XIX: los electrones libres deberían añadir \(\tfrac32R\) al calor específico de los metales, y no lo hacen. Solo una fracción \(\sim T/T_F\) participa, y la contribución electrónica es lineal en \(T\):</p>
<div class="eq key" data-name="Capacidad calorífica electrónica">\[C_{el}=\gamma T,\qquad \gamma=\frac{\pi^2}{2}\frac{R}{T_F}.\]</div>
<p>Para el cobre, \(\gamma=0.50\) mJ/mol·K² según el modelo de electrones libres y 0.695 medido: el cociente, 1.38, mide la masa efectiva de los electrones en la red. La presión de ese gas de Fermi, 38 GPa en el cobre, contrarresta la atracción de los iones; en las enanas blancas, la presión de degeneración de los electrones sostiene una estrella entera contra su gravedad.</p>
<div class="sim" data-sim="fermi" data-title="Gas de electrones de un metal: distribución de Fermi–Dirac a temperatura finita"></div>
<div class="sim-guide"><ul>
<li>La ocupación es un escalón suavizado en un ancho de unos pocos \(k_BT\) alrededor de \(E_F\). A 300 K ese ancho es 0.026 eV, menos del 0.4 % de \(E_F\).</li>
<li>La curva sombreada es el número de electrones por unidad de energía, \(g(\varepsilon)\bar n(\varepsilon)\), con \(g\propto\sqrt\varepsilon\).</li>
<li>Suba la temperatura a decenas de miles de kelvin: solo entonces el gas se vuelve clásico.</li>
</ul></div>
</section>

<section>
<h2>Condensación de Bose–Einstein</h2>
<p>En un gas de bosones con número fijo de partículas, al bajar la temperatura el potencial químico se acerca a cero. Por debajo de una temperatura crítica,</p>
<div class="eq key" data-name="Temperatura de condensación de Bose–Einstein">\[T_c=\frac{2\pi\hbar^2}{mk_B}\left(\frac{n}{\zeta(3/2)}\right)^{2/3},\qquad \frac{N_0}{N}=1-\left(\frac{T}{T_c}\right)^{3/2},\]</div>
<p>una fracción macroscópica de las partículas ocupa el estado fundamental: un solo estado cuántico con millones de átomos. Einstein lo predijo en 1924 y Cornell, Wieman y Ketterle lo lograron en 1995 con átomos de rubidio y sodio enfriados por láser y evaporación hasta cientos de nanokelvin. Con la densidad del helio-4 líquido, la fórmula da 3.13 K, cerca de los 2.17 K a los que el helio se vuelve superfluido; las interacciones explican la diferencia.</p>
<div class="sim" data-sim="bec" data-title="Fracción condensada de un gas de Bose ideal"></div>
<div class="sim-guide"><ul>
<li>Ajuste la densidad y la masa atómica: \(T_c\) crece con la densidad y cae con la masa.</li>
<li>Por debajo de \(T_c\) la fracción condensada crece como \(1-(T/T_c)^{3/2}\); la animación muestra los átomos en el estado fundamental en el centro.</li>
</ul></div>
</section>

<section>
<h2>Fonones: el sólido de Debye</h2>
<p>Las vibraciones de un sólido cristalino son también un gas de bosones, los <span class="term">fonones</span>, con \(\mu=0\) como los fotones. Debye (1912) trató el cristal como un medio elástico con \(3N\) modos y una frecuencia de corte \(\omega_D\), y obtuvo la capacidad calorífica que el curso usa desde el capítulo 2:</p>
<div class="eq">\[\frac{C_V}{3Nk_B}=3\left(\frac{T}{\Theta_D}\right)^3\int_0^{\Theta_D/T}\frac{x^4\ee^x}{(\ee^x-1)^2}\dd x\ \xrightarrow{\ T\ll\Theta_D\ }\ \frac{4\pi^4}5\left(\frac{T}{\Theta_D}\right)^3.\]</div>
<p>La ley \(T^3\) a baja temperatura es la misma de la radiación de cuerpo negro (\(u\propto T^4\)): fonones y fotones son bosones sin masa con dispersión lineal. En un metal a muy baja temperatura, el término electrónico \(\gamma T\) supera al de los fonones: por debajo de unos 4 K en el cobre.</p>
<div class="sim" data-sim="debye" data-title="Capacidad calorífica de un sólido: fonones de Debye y electrones"></div>
<div class="sim-guide"><ul>
<li>La curva de Debye tiende a \(3R\) (Dulong–Petit) a alta temperatura y a \(T^3\) a baja. El modelo de Einstein, con una sola frecuencia, cae demasiado rápido.</li>
<li>En la gráfica \(C/T\) contra \(T^2\), un metal da una recta: la ordenada en el origen es \(\gamma\) y la pendiente, \(12\pi^4R/5\Theta_D^3\). Es la forma en que se miden ambos.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿A qué frecuencia tiene su máximo el fondo cósmico de microondas en \(u_\nu\)?
<details><summary>Respuesta</summary><p>\(h\nu_{máx}=2.821\,k_BT\): 160.2 GHz.</p></details></li>
<li><span class="lvl">Básico</span>Calcule la temperatura de Fermi del aluminio (\(n=18.1\times10^{28}\) m⁻³).
<details><summary>Respuesta</summary><p>\(E_F=11.7\) eV; \(T_F=1.36\times10^5\) K.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Cuál es la densidad de energía de la radiación dentro de un horno a 1000 K, y qué presión ejerce?
<details><summary>Respuesta</summary><p>\(u=aT^4=7.57\times10^{-4}\) J/m³; \(P=u/3=2.5\times10^{-4}\) Pa: despreciable frente a la del aire.</p></details></li>
<li><span class="lvl">Intermedio</span>Halle \(T_c\) para átomos de ⁸⁷Rb con \(n=10^{20}\) m⁻³.
<details><summary>Respuesta</summary><p>398 nK.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que la energía media por fotón en un cuerpo negro es \(\pi^4k_BT/(30\zeta(3))=2.70\,k_BT\).
<details><summary>Respuesta</summary><p>\(u\propto\int x^3/(\ee^x-1)\dd x=\pi^4/15\) y \(n\propto\int x^2/(\ee^x-1)\dd x=2\zeta(3)\), con el mismo prefactor. El cociente es \(k_BT\,\pi^4/(30\zeta(3))=2.701\,k_BT\).</p></details></li>
</ol>
<div class="box note"><h4>Para profundizar</h4><p>Schroeder (2000), cap. 7. C. Kittel, <em>Introduction to Solid State Physics</em>, 8.ª ed., caps. 5–6. J. C. Mather et al., «Measurement of the cosmic microwave background spectrum by the COBE FIRAS instrument», <em>Astrophys. J.</em> 420, 439 (1994). M. H. Anderson et al., «Observation of Bose–Einstein condensation in a dilute atomic vapor», <em>Science</em> 269, 198 (1995).</p></div>
</section>
</template>

<!-- 23-no-equilibrio.html -->
<template class="chapter-src" data-id="no-equilibrio" data-num="23" data-title="Termodinámica fuera del equilibrio" data-part="Parte VII · Fronteras" data-short="Equilibrio local, flujos y fuerzas, producción de entropía, relaciones de reciprocidad de Onsager, efectos termoeléctricos de Seebeck y Peltier, generadores y refrigeradores termoeléctricos, movimiento browniano y relación de Einstein, ruido de Johnson–Nyquist y el teorema de fluctuación-disipación">
<p class="lead">La termodinámica clásica describe estados de equilibrio y procesos entre ellos, pero el mundo está lleno de sistemas que nunca llegan al equilibrio: una barra entre una llama y el agua, una corriente eléctrica, una célula viva, la atmósfera. La termodinámica de los procesos irreversibles, desarrollada por Onsager, Prigogine y otros en el siglo XX, extiende las leyes a esos sistemas midiendo cuánta entropía producen. Este capítulo presenta sus ideas centrales y dos aplicaciones que se pueden construir y medir: el módulo termoeléctrico y el movimiento browniano.</p>

<section>
<h2>Equilibrio local, flujos y fuerzas</h2>
<p>Si los gradientes no son demasiado bruscos, cada pequeño elemento de un sistema fuera del equilibrio está casi en equilibrio y tiene su temperatura, su presión y su entropía: es la hipótesis de <span class="term">equilibrio local</span>. Los gradientes impulsan <span class="term">flujos</span>: el de temperatura impulsa calor (Fourier), el de concentración impulsa materia (Fick), el de potencial eléctrico impulsa carga (Ohm). La entropía se produce localmente a un ritmo que es la suma de productos de cada flujo por su <span class="term">fuerza termodinámica</span>:</p>
<div class="eq key" data-name="Producción de entropía">\[\sigma=\sum_kJ_kX_k\ge0,\qquad \text{por ejemplo}\quad \sigma_{calor}=\vb q\cdot\grad\left(\frac1T\right)=\frac{k\,|\grad T|^2}{T^2}.\]</div>
<p>Cerca del equilibrio los flujos son lineales en las fuerzas, \(J_i=\sum_jL_{ij}X_j\), y Onsager demostró en 1931, a partir de la reversibilidad microscópica, que la matriz de coeficientes es simétrica: \(L_{ij}=L_{ji}\). Las <span class="term">relaciones de reciprocidad</span>, que le valieron el Nobel de Química de 1968, conectan efectos aparentemente independientes, como la termoelectricidad y el efecto Peltier.</p>
<div class="sim" data-sim="produccion-entropia" data-title="Una barra entre dos focos: producción local de entropía y estado estacionario"></div>
<div class="sim-guide"><ul>
<li>La barra empieza a temperatura uniforme. El calor fluye, el perfil se vuelve lineal y la producción total de entropía se estabiliza en \(\dot Q(1/T_C-1/T_H)\).</li>
<li>La producción local es mayor del lado frío, donde \(1/T^2\) es mayor: el mismo flujo de calor genera más entropía a baja temperatura.</li>
<li>En el estado estacionario la producción de entropía es mínima frente a perfiles vecinos compatibles con los bordes: el principio de Prigogine, válido en el régimen lineal.</li>
</ul></div>
</section>

<section>
<h2>Termoelectricidad</h2>
<p>En un conductor, el calor y la carga viajan con los mismos portadores, así que sus flujos están acoplados. Tres efectos lo muestran:</p>
<ul>
<li><b>Seebeck</b> (1821): una diferencia de temperatura entre las uniones de dos conductores distintos produce una tensión, \(V=S_{AB}\Delta T\). Es el principio del termopar (capítulo 1).</li>
<li><b>Peltier</b> (1834): una corriente que cruza la unión absorbe o libera calor, \(\dot Q=\Pi_{AB}I\), según su sentido.</li>
<li><b>Thomson</b>: un conductor con gradiente de temperatura y corriente intercambia calor a lo largo de su longitud.</li>
</ul>
<p>Kelvin (1854) relacionó los coeficientes, \(\Pi=ST\), y Onsager lo justificó como un caso de reciprocidad. El desempeño de un material termoeléctrico se resume en la <span class="term">figura de mérito</span> \(ZT=S^2\sigma T/k\): buen coeficiente de Seebeck, alta conductividad eléctrica y baja conductividad térmica. Un generador con \(ZT\) medio tiene eficiencia máxima</p>
<div class="eq key" data-name="Eficiencia de un generador termoeléctrico">\[\eta_{máx}=\left(1-\frac{T_C}{T_H}\right)\frac{\sqrt{1+ZT}-1}{\sqrt{1+ZT}+T_C/T_H}.\]</div>
<p>El telururo de bismuto (\(ZT\approx1\)) entre 200 °C y 30 °C da 7.2 %, una quinta parte de Carnot. Es poco, pero sin partes móviles: las sondas Voyager se alimentan desde 1977 con generadores termoeléctricos calentados por plutonio, y los módulos Peltier enfrían neveras portátiles, sensores y láseres.</p>
<div class="sim" data-sim="termoelectrico" data-title="Módulo termoeléctrico: generador y refrigerador Peltier"></div>
<div class="sim-guide"><ul>
<li>Como generador, la potencia es máxima cuando la resistencia de carga iguala a la interna; la eficiencia es máxima con una carga algo mayor, \(R_L/R=\sqrt{1+ZT}\).</li>
<li>Como refrigerador, el COP máximo entre 7 °C y 27 °C con \(ZT=1\) es 2.0, contra 14 de Carnot: por eso las neveras Peltier gastan mucho más que las de compresor.</li>
</ul></div>
</section>

<section>
<h2>Movimiento browniano y la relación de Einstein</h2>
<p>En 1827 el botánico Robert Brown observó que los granos de polen suspendidos en agua se agitan sin cesar. En 1905 Einstein explicó el fenómeno como el resultado de los choques de las moléculas de agua y predijo que el desplazamiento cuadrático medio crece linealmente con el tiempo, \(\langle x^2\rangle=2Dt\) en cada dirección, con un coeficiente de difusión</p>
<div class="eq key" data-name="Relación de Stokes–Einstein">\[D=\frac{k_BT}{6\pi\eta r}.\]</div>
<p>La fórmula liga una fluctuación (la difusión) con una disipación (la fricción viscosa de Stokes). Jean Perrin la usó en 1908 para medir, siguiendo partículas de goma resina al microscopio, la constante de Avogadro: obtuvo \(6.8\times10^{23}\). Fue la prueba que convenció a los últimos escépticos de la existencia de los átomos. Una esfera de 1 µm de diámetro en agua a 20 °C tiene \(D=4.3\times10^{-13}\) m²/s: en un segundo se desplaza en promedio 0.93 µm en cada dirección.</p>
<div class="sim" data-sim="browniano" data-title="Movimiento browniano: trayectorias, desplazamiento cuadrático medio y constante de Avogadro"></div>
<div class="sim-guide"><ul>
<li>Cada partícula da pasos al azar con la estadística que fija \(D\). El desplazamiento cuadrático medio de todas crece linealmente: la pendiente da \(D\).</li>
<li>Con el \(D\) medido, la temperatura y la viscosidad, el simulador despeja \(N_A=RT/(6\pi\eta rD)\), como Perrin. Con pocas partículas el resultado fluctúa varios por ciento.</li>
<li>Caliente el agua: la viscosidad baja y la temperatura sube; las dos cosas aceleran la difusión.</li>
</ul></div>
</section>

<section>
<h2>Ruido térmico y el teorema de fluctuación-disipación</h2>
<p>La misma agitación térmica que mueve las partículas mueve los electrones de una resistencia. Johnson midió en 1928 que toda resistencia a temperatura \(T\) tiene en sus terminales una tensión fluctuante, y Nyquist dedujo su valor con la segunda ley:</p>
<div class="eq key" data-name="Ruido de Johnson–Nyquist">\[\langle V^2\rangle=4k_BTR\,\Delta f.\]</div>
<p>Una resistencia de 1 MΩ a temperatura ambiente, medida con un ancho de banda de 10 kHz, produce 12.9 µV eficaces: un límite fundamental para cualquier amplificador. Las relaciones de Einstein y de Nyquist son casos del <span class="term">teorema de fluctuación-disipación</span> (Callen y Welton, 1951): todo sistema que disipa energía cuando se lo empuja fluctúa espontáneamente en equilibrio, y las dos propiedades están ligadas por \(k_BT\). El ruido de Johnson se usa hoy como termómetro primario.</p>
<div class="sim" data-sim="johnson" data-title="Ruido térmico de una resistencia"></div>
<div class="sim-guide"><ul>
<li>La señal es ruido blanco gaussiano con la varianza de Nyquist. El histograma es una gaussiana; su ancho crece como \(\sqrt{TR\Delta f}\).</li>
<li>Enfriar la resistencia con nitrógeno líquido (77 K) reduce el ruido a la mitad: por eso los receptores de radioastronomía se enfrían.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Por una pared pasan 100 W de un interior a 400 K a un exterior a 300 K. ¿Cuánta entropía se produce por segundo?
<details><summary>Respuesta</summary><p>\(100(1/300-1/400)=0.0833\) W/K.</p></details></li>
<li><span class="lvl">Básico</span>Un termopar tipo K (41 µV/K) mide 4.1 mV con la unión fría a 0 °C. ¿Qué temperatura indica?
<details><summary>Respuesta</summary><p>Unos 100 °C (la curva real no es exactamente lineal).</p></details></li>
<li><span class="lvl">Intermedio</span>Calcule la eficiencia máxima de un generador termoeléctrico con \(ZT=0.5\) entre 200 °C y 30 °C.
<details><summary>Respuesta</summary><p>4.3 %.</p></details></li>
<li><span class="lvl">Intermedio</span>Perrin midió para esferas de 0.212 µm de radio en agua a 17 °C (\(\eta=1.08\times10^{-3}\) Pa·s) un \(\langle x^2\rangle\) de \(5.6\times10^{-11}\) m² en 30 s (datos ilustrativos del orden de los suyos). ¿Qué \(N_A\) se obtiene?
<details><summary>Respuesta</summary><p>\(D=\langle x^2\rangle/2t=9.33\times10^{-13}\) m²/s; \(N_A=RT/(6\pi\eta rD)=8.314(290)/(6\pi\times1.08\times10^{-3}\times0.212\times10^{-6}\times9.33\times10^{-13})=6.0\times10^{23}\).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que en una barra con conductividad constante entre \(T_H\) y \(T_C\), la integral de la producción local de entropía, \(\int kA(\dd T/\dd x)^2/T^2\,\dd x\), es igual a \(\dot Q(1/T_C-1/T_H)\).
<details><summary>Respuesta</summary><p>Con \(\dot Q=-kA\,\dd T/\dd x\) constante: \(\int kA(\dd T/\dd x)^2/T^2\dd x=\dot Q\int(-\dd T/\dd x)/T^2\dd x=\dot Q\int_{T_C}^{T_H}\dd T/T^2=\dot Q(1/T_C-1/T_H)\).</p></details></li>
</ol>
<div class="box note"><h4>Para profundizar</h4><p>S. R. de Groot y P. Mazur, <em>Non-Equilibrium Thermodynamics</em>, Dover, 1984. D. Kondepudi e I. Prigogine, <em>Modern Thermodynamics</em>, 2.ª ed., Wiley, 2015. L. Onsager, «Reciprocal relations in irreversible processes», <em>Phys. Rev.</em> 37, 405 (1931). A. Einstein, <em>Ann. Phys.</em> 17, 549 (1905). J. Perrin, <em>Les Atomes</em>, 1913. H. Nyquist, <em>Phys. Rev.</em> 32, 110 (1928).</p></div>
</section>

<!-- 24-informacion-vida.html -->
<template class="chapter-src" data-id="informacion-vida" data-num="24" data-title="Información, vida y planeta" data-part="Parte VII · Fronteras" data-short="El demonio de Maxwell, la máquina de Szilard y el principio de Landauer, entropía de Shannon y de Boltzmann, termodinámica del cuerpo humano y del metabolismo, balance radiativo de los planetas, efecto invernadero y el presupuesto de entropía de la Tierra">
<p class="lead">La termodinámica nació de las máquinas de vapor, pero sus leyes alcanzan mucho más lejos: fijan cuánta energía cuesta borrar un bit de memoria, cómo se mantiene vivo un organismo que produce entropía sin cesar y qué temperatura tiene un planeta iluminado por su estrella. Este capítulo final recorre esas fronteras y muestra que la entropía es, al mismo tiempo, una magnitud física, una medida de información y la clave del orden que vemos en la Tierra.</p>

<section>
<h2>El demonio de Maxwell</h2>
<p>En 1867 Maxwell imaginó un ser diminuto que vigila una compuerta entre dos recipientes de gas a la misma temperatura. Abre la compuerta solo para dejar pasar moléculas rápidas de izquierda a derecha y lentas de derecha a izquierda. Sin hacer trabajo, el demonio crearía una diferencia de temperatura, violando la segunda ley. El rompecabezas duró un siglo.</p>
<p>Szilard (1929) lo redujo a su esencia: una sola molécula en una caja. Si el demonio sabe en qué mitad está, coloca un pistón y deja que la molécula lo empuje isotérmicamente hasta ocupar toda la caja, extrayendo \(k_BT\ln2\) de trabajo del depósito. Un bit de información vale \(k_BT\ln2\) de trabajo. La pregunta es qué cuesta obtener o guardar esa información.</p>
<p>Landauer (1961) y Bennett (1982) dieron la respuesta: medir puede hacerse sin costo, pero la memoria del demonio es finita y debe <b>borrarse</b> para seguir trabajando. Borrar un bit, una operación lógicamente irreversible, reduce la entropía de la memoria en \(k_B\ln2\) y por lo tanto debe disipar al menos</p>
<div class="eq key" data-name="Principio de Landauer">\[Q_{borrado}\ge k_BT\ln2=2.87\times10^{-21}\ \text{J}\ \ \text{a 300 K}.\]</div>
<p>Con ese costo, el balance del demonio completo nunca viola la segunda ley. El principio se verificó experimentalmente en 2012 con una partícula coloidal en una trampa óptica (Bérut et al.). Los transistores actuales disipan del orden de \(10^{-15}\) J por operación, unas \(10^5\)–\(10^6\) veces más que el límite de Landauer: hay mucho margen, pero el límite existe.</p>
<div class="sim" data-sim="demonio" data-title="El demonio de Maxwell separa moléculas rápidas y lentas"></div>
<div class="sim-guide"><ul>
<li>El demonio deja pasar hacia la derecha solo las partículas más rápidas que el promedio y hacia la izquierda solo las más lentas. Aparece una diferencia de temperatura.</li>
<li>El contador de decisiones mide la información que el demonio adquirió. Borrarla cuesta al menos \(k_BT\ln2\) por bit, más que la entropía que el gas perdió.</li>
</ul></div>
</section>

<section>
<h2>Entropía e información</h2>
<p>Shannon (1948) definió la información de un mensaje como la incertidumbre que resuelve. Para una fuente que emite símbolos con probabilidades \(p_i\), la información media por símbolo es</p>
<div class="eq key" data-name="Entropía de Shannon">\[H=-\sum_ip_i\log_2p_i\ \ \text{bits},\qquad S=-k_B\sum_ip_i\ln p_i=k_B\ln2\cdot H.\]</div>
<p>La fórmula de Gibbs para la entropía termodinámica de un sistema con microestados de probabilidad \(p_i\) es la misma, salvo la constante: un bit equivale a \(k_B\ln2=9.57\times10^{-24}\) J/K. Jaynes (1957) mostró que toda la mecánica estadística puede verse como inferencia: la distribución de Boltzmann es la que maximiza la entropía de Shannon compatible con una energía media conocida. La entropía mide nuestra ignorancia sobre el microestado.</p>
<div class="sim" data-sim="landauer" data-title="La máquina de Szilard y el costo energético de la información"></div>
<div class="sim-guide"><ul>
<li>El ciclo de Szilard: medir la mitad (1 bit), expandir isotérmicamente (\(+k_BT\ln2\) de trabajo), borrar la memoria (\(-k_BT\ln2\) como mínimo). El balance neto nunca es positivo.</li>
<li>La gráfica compara la energía por operación lógica de distintas tecnologías con el límite de Landauer a su temperatura de trabajo (órdenes de magnitud típicos).</li>
</ul></div>
</section>

<section>
<h2>La termodinámica de la vida</h2>
<p>Un ser vivo es un sistema abierto muy lejos del equilibrio. Mantiene su estructura ordenada (baja entropía) y además la produce constantemente en sus reacciones; para no degradarse debe exportar entropía al entorno. Schrödinger lo resumió en <em>¿Qué es la vida?</em> (1944): los organismos se alimentan de «entropía negativa». Comen moléculas de baja entropía (glucosa, grasas) y devuelven CO₂, agua y calor, de entropía mucho mayor.</p>
<p>El cuerpo humano en reposo consume unos 80–100 W, la <span class="term">tasa metabólica basal</span>: unas 1650 kcal/día para un adulto de 70 kg. Los músculos convierten energía química en trabajo mecánico con una eficiencia cercana al 25 %; el resto sale como calor, que el cuerpo disipa por radiación, convección y evaporación del sudor (capítulo 9). El ATP, la moneda energética de las células, libera unos 50 kJ/mol al hidrolizarse en las condiciones del citoplasma.</p>
<div class="sim" data-sim="metabolismo" data-title="Balance energético del cuerpo humano"></div>
<div class="sim-guide"><ul>
<li>Subir 300 m de desnivel con 70 kg de masa total requiere 206 kJ de trabajo mecánico; con 25 % de eficiencia muscular, el cuerpo gasta 824 kJ (197 kcal) y debe disipar 618 kJ como calor.</li>
<li>Si todo ese calor se evaporara como sudor, harían falta unos 250 g de agua. El simulador calcula el sudor necesario según la temperatura y la humedad.</li>
<li>La tasa basal sigue la ecuación de Mifflin–St Jeor, la recomendada hoy por las guías de nutrición.</li>
</ul></div>
</section>

<section>
<h2>El balance energético de un planeta</h2>
<p>Un planeta en equilibrio radiativo emite al espacio, como cuerpo negro, la misma energía que absorbe de su estrella. Si la estrella entrega una irradiancia \(S\) (1361 W/m² en la Tierra) y el planeta refleja una fracción \(A\) (el albedo, 0.30 para la Tierra),</p>
<div class="eq key" data-name="Temperatura de equilibrio radiativo">\[\pi R^2S(1-A)=4\pi R^2\sigma T_e^4\qquad\Longrightarrow\qquad T_e=\left[\frac{S(1-A)}{4\sigma}\right]^{1/4}=255\ \text{K}.\]</div>
<p>La Tierra real tiene una temperatura media de superficie de 288 K: 33 K más. La diferencia es el <span class="term">efecto invernadero</span>. La atmósfera es casi transparente a la luz solar (máximo en 0.5 µm) pero absorbe buena parte del infrarrojo terrestre (máximo en 10 µm) gracias al vapor de agua, al CO₂ y a otros gases cuyas vibraciones moleculares (capítulo 2) caen en esa región. Una capa atmosférica que absorbe una fracción \(\varepsilon\) del infrarrojo y lo reemite hacia arriba y hacia abajo eleva la temperatura de la superficie a \(T_s=T_e[2/(2-\varepsilon)]^{1/4}\); con \(\varepsilon=0.78\) se obtienen los 288 K observados. Venus, con una atmósfera de CO₂ 90 veces más densa, llega a 737 K.</p>
<div class="sim" data-sim="planeta" data-title="Temperatura de los planetas: equilibrio radiativo y efecto invernadero"></div>
<div class="sim-guide"><ul>
<li>Sin atmósfera, la Tierra estaría a 255 K, bajo cero. El modelo de una capa con \(\varepsilon=0.78\) da 288 K.</li>
<li>Aumentar \(\varepsilon\) en 0.01 (más gases de invernadero) sube la superficie unos 0.6 K en este modelo sencillo; los modelos climáticos incluyen retroalimentaciones (vapor de agua, hielo, nubes) que cambian ese número.</li>
<li>Pruebe Marte (atmósfera tenue: casi sin invernadero) y Venus (invernadero extremo).</li>
</ul></div>
<div class="box note"><h4>El presupuesto de entropía de la Tierra</h4><p>La Tierra recibe y devuelve casi la misma energía, pero no la misma entropía. Recibe fotones solares emitidos a unos 5800 K y devuelve fotones infrarrojos a 255 K: por cada fotón que llega salen unos 20. La entropía que la Tierra exporta al espacio es unas 20 veces mayor que la que recibe. Esa diferencia es la que alimenta los vientos, el ciclo del agua, la fotosíntesis y la vida: el orden de la biosfera se paga con la entropía de la radiación que el planeta envía al espacio.</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Cuánta energía disiparía como mínimo borrar 1 terabyte (\(8\times10^{12}\) bits) a temperatura ambiente?
<details><summary>Respuesta</summary><p>\(8\times10^{12}\times2.87\times10^{-21}=2.3\times10^{-8}\) J.</p></details></li>
<li><span class="lvl">Básico</span>Halle la entropía de Shannon de una moneda cargada que sale cara el 90 % de las veces.
<details><summary>Respuesta</summary><p>\(H=-0.9\log_20.9-0.1\log_20.1=0.469\) bits.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Cuál sería la temperatura de equilibrio radiativo de la Tierra si su albedo bajara a 0.25 (menos hielo y nubes)?
<details><summary>Respuesta</summary><p>\(T_e=[1361(0.75)/(4\sigma)]^{1/4}=259.0\) K, 4.4 K más.</p></details></li>
<li><span class="lvl">Intermedio</span>Una persona de 70 kg sube 10 pisos (30 m) por las escaleras. Con 25 % de eficiencia, ¿cuántas kilocalorías gasta además de su metabolismo basal?
<details><summary>Respuesta</summary><p>\(mgh=20.6\) kJ; gasto 82.4 kJ = 19.7 kcal.</p></details></li>
<li><span class="lvl">Avanzado</span>Deduzca \(T_s=T_e[2/(2-\varepsilon)]^{1/4}\) para una atmósfera de una capa isotérmica, transparente a la luz solar, que absorbe una fracción \(\varepsilon\) del infrarrojo y emite \(\varepsilon\sigma T_a^4\) hacia cada lado.
<details><summary>Respuesta</summary><p>Atmósfera: \(\varepsilon\sigma T_s^4=2\varepsilon\sigma T_a^4\). Tope: \(\sigma T_e^4=(1-\varepsilon)\sigma T_s^4+\varepsilon\sigma T_a^4=\sigma T_s^4(1-\varepsilon/2)\). Entonces \(T_s^4=T_e^4/(1-\varepsilon/2)\).</p></details></li>
</ol>
<div class="box note"><h4>Para profundizar</h4><p>H. S. Leff y A. F. Rex (eds.), <em>Maxwell's Demon 2</em>, IOP, 2003. R. Landauer, «Irreversibility and heat generation in the computing process», <em>IBM J. Res. Dev.</em> 5, 183 (1961). A. Bérut et al., «Experimental verification of Landauer's principle linking information and thermodynamics», <em>Nature</em> 483, 187 (2012). E. Schrödinger, <em>¿Qué es la vida?</em>, Tusquets, 1983. D. J. Jacob, <em>Introduction to Atmospheric Chemistry</em>, Princeton, 1999, cap. 7. M. D. Mifflin et al., <em>Am. J. Clin. Nutr.</em> 51, 241 (1990).</p></div>
</section>

<template class="chapter-src" data-id="validacion" data-num="B" data-title="Validación de los cálculos" data-part="Apéndices" data-short="Cómo se comprobaron las propiedades, los modelos y los números del curso, con la lista completa de pruebas automáticas contra CoolProp, SciPy y la literatura">
<p class="lead">Todos los cálculos de las simulaciones salen de una biblioteca única (<code>src/core/30-thermo.js</code>) y de unas tablas de propiedades generadas una sola vez (<code>src/core/29-tablas.js</code>). Un programa automático compara esa biblioteca con tres tipos de referencia independiente. Este apéndice explica el método y lista cada comprobación con su resultado.</p>

<section>
<h2>Método</h2>
<ol>
<li><b>Propiedades de fluidos reales con CoolProp</b>. Las tablas del agua (formulación IAPWS-95 de Wagner y Pruß) y del R-134a (Tillner-Roth y Baehr) se generaron con la biblioteca abierta CoolProp en una malla de saturación y de vapor sobrecalentado; el curso las interpola con splines cúbicos. Las pruebas comparan estados <b>fuera</b> de los nodos de la malla con CoolProp, y calculan con CoolProp, de forma independiente, ciclos de Rankine, Rankine regenerativo y refrigeración completos. También se contrastan con CoolProp la presión de vapor de Wagner–Pruß, la psicrometría (formulación de aire húmedo ASHRAE RP-1485), el factor de compresibilidad de Peng–Robinson frente a las ecuaciones de referencia del CO₂, N₂ y CH₄, la estrangulación de Joule–Thomson y los calores específicos de gas ideal.</li>
<li><b>Referencias numéricas con SciPy</b>: funciones especiales (error, gamma), integrales de Debye, de Fermi–Dirac y de Bose–Einstein, fracciones de emisión de cuerpo negro, la construcción de Maxwell para van der Waals (resuelta con <code>brentq</code> y <code>quad</code>) y las raíces de la ecuación cúbica de Peng–Robinson (<code>numpy.roots</code>). Tolerancias entre \(10^{-6}\) y \(10^{-12}\).</li>
<li><b>Datos de la literatura</b>: tablas de Çengel y Boles, NIST-JANAF (calores específicos, entalpías y constantes de equilibrio), CODATA (entropías absolutas de los gases nobles, constantes), Kittel (energía de Fermi), Turns (temperaturas de llama) y ejemplos resueltos de los textos. La tolerancia refleja la incertidumbre del dato o del modelo.</li>
</ol>
<p>Todos los ejemplos resueltos y las respuestas de los problemas se calcularon con la misma biblioteca antes de escribirlos. Cuando un número del borrador no coincidió con el cálculo, se corrigió el texto: así se ajustaron, entre otros, la masa de nitrógeno de un cilindro y la presión que da Peng–Robinson, las respuestas de varios problemas de vapor, el factor de compresibilidad del metano a 200 bar, la temperatura de las superficies de una ventana, la fracción ocupada de un nivel excitado y la constante de Avogadro del problema de Perrin. También fallaron, al principio, algunas pruebas cuyo valor de referencia estaba mal citado (la eficiencia de una aleta, el calor específico de Debye del cobre a 300 K, la temperatura de condensación de un experimento con rubidio): se reemplazaron por referencias verificables, nunca se aflojó la tolerancia para hacerlas pasar.</p>
<div class="box warn"><h4>Exactitud de los modelos</h4><p>Algunas comparaciones no buscan coincidencia exacta sino medir el error de un modelo: Peng–Robinson tiene 2–4 % de error en \(Z\) cerca del punto crítico y 10–20 % en el enfriamiento de Joule–Thomson; los calores específicos estadísticos (rotor rígido y osciladores armónicos) se desvían 1–3 % de NIST-JANAF a alta temperatura por la anarmonicidad; la temperatura de llama con disociación incluye solo CO, H₂ y O₂. Esas tolerancias están declaradas en la tabla.</p></div>
<div class="box warn"><h4>Lo que es ilustrativo</h4><p>Algunas simulaciones usan modelos simplificados y así lo dicen: el café que se enfría (coeficientes de convección y evaporación típicos), el consumo de la nevera (conductancias estimadas de un aparato de 300 L), los equipos de la gráfica de COP y de las tecnologías de cómputo (valores típicos u órdenes de magnitud), el balance de sudor del cuerpo humano y el modelo de una capa del efecto invernadero. Reproducen la física y los órdenes de magnitud, no un equipo o un clima específico.</p></div>
</section>

    CO: { M: 28.0101, lin: true, Hf: -110530, vib: [3122] },

  /* ---------------- Combustión ---------------- */
  /* combustibles: [C, H, O, Hf (J/mol) en el estado indicado, M] */

  /* combustión completa con aire, fracción de aire teórico lam (≥ 1 para pobre; < 1 produce CO) */

  /* composición de productos con disociación de CO2 y H2O (CO, H2, O2) a T y P (bar) */

    H2O: { n: 'Agua', Tc: 647.096, Pc: 22.064e6, w: 0.3443, M: 18.015 },
    C3H8: { n: 'Propano', Tc: 369.89, Pc: 4.2512e6, w: 0.1521, M: 44.097 },

  /* factores de compresibilidad (todas las raíces) a T, P */

  /* entalpía molar real con Peng–Robinson: h_ig(T) (RRHO) + función de alejamiento; raíz de vapor por defecto */
  TH.prH = function (g, T, P, liquid = false) {

  /* van der Waals reducida y construcción de Maxwell */

    const roots = (Pr) => TH.cubicRoots(-(1 / 3) * (1 + (8 * Tr) / Pr), 3 / Pr, -1 / Pr);

  /* Rankine con agua: P alta, P baja (Pa), T de entrada a la turbina (K) o null (vapor saturado), eficiencias, recalentamiento */
  TH.rankine = function (o) {
    const W = TH.agua, { Ph, Pl, T3 = null, etat = 1, etap = 1, Prh = null, Trh = null } = o;

  };
  /* Rankine regenerativo con un calentador abierto a la presión Pb (Pa) */
  TH.rankineRegen = function (o) {
    const W = TH.agua, { Ph, Pl, Pb, T5, etat = 1, etap = 1 } = o;
    const s1 = W.state(Pl, { x: 0 }), wp1 = (s1.v * (Pb - Pl)) / etap, h2 = s1.h + wp1;

  /* compresión de vapor con R-134a: T del evaporador y del condensador (K), sobrecalentamiento, subenfriamiento, eficiencia del compresor */
  TH.refrig = function (o) {
    const F = TH.r134a, { Te, Tc, etac = 1, sh = 0, sc = 0 } = o;
    const Pe = F.Psat(Te), Pc = F.Psat(Tc);

/* 35-draw.js — Dibujos auxiliares (resortes, bloques, átomos, probetas) */
(function () {

    ctx.lineCap = 'round';

    ctx.moveTo(x1, y1);

    for (let i = 0; i <= N; i++) {
      const s = i / N, a = 2 * Math.PI * n * s;
      const along = lead + Lc * s;
      ctx.lineTo(x1 + ux * along + px * R * Math.sin(a), y1 + uy * along + py * R * Math.sin(a));
    }
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();
  };

  D.block = function (ctx, cx, cy, w, h, o = {}) {

    ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;

    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = EM.alpha('#000000', 0.25);
    ctx.lineWidth = 1;
    ctx.stroke();
    if (o.label) EM.text(ctx, o.label, cx, cy, { size: o.size || 13, color: '#FFFFFF', align: 'center', baseline: 'middle', weight: 600, italic: o.italic, family: o.italic ? EM.FONT_MATH : undefined });

  };

  D.bob = function (ctx, x, y, r, o = {}) {
    ctx.save();
    const col = C(o.color || '--c1');

    ctx.fill();
    ctx.strokeStyle = EM.alpha('#000000', 0.3);
    ctx.lineWidth = 1;
    ctx.stroke();

    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);

/* 36-gas.js — Gas bidimensional de discos duros (unidades reducidas m = kB = 1)

/* ==== core/37-diag.js ==== */
/* 37-diag.js — Diagramas de propiedades de fluidos reales (domo, isóbaras, isotermas)
   Claves de ejes: 'v' (m³/kg), 'P' (kPa), 'T' (°C), 'h' (kJ/kg), 's' (kJ/kg·K), 'u' (kJ/kg) */
(function () {
  'use strict';
  const EM = window.EM;
  const D = (EM.diag = {});
  const cache = new Map();
  /* valor de un estado (objeto con T K, P Pa, v, h J/kg, s J/kg·K) en las unidades del eje */
  D.val = function (st, k) {
    switch (k) {
      case 'v': return st.v;
      case 'P': return st.P / 1e3;
      case 'T': return st.T - 273.15;
      case 'h': return st.h / 1e3;
      case 's': return st.s / 1e3;
      case 'u': return st.u / 1e3;
    }
    return NaN;
  };
  D.dome = function (F) {
    if (cache.has(F)) return cache.get(F);
    const raw = F.domo(140);
    const f = raw.map((s) => ({ T: s.T, P: s.P, v: s.vf, h: s.hf, s: s.sf, u: s.uf }));
    const g = raw.map((s) => ({ T: s.T, P: s.P, v: s.vg, h: s.hg, s: s.sg, u: s.ug }));
    const out = { f, g, all: f.concat(g.slice().reverse()) };
    cache.set(F, out);
    return out;
  };
  /* dibuja el domo en un Plot */
  D.drawDome = function (pl, F, xk, yk, o = {}) {
    const d = D.dome(F);
    pl.path(d.all.map((s) => [D.val(s, xk), D.val(s, yk)]), { color: o.color || '--ink-2', width: o.width || 2, fill: o.fill ? '--c1' : null, fillAlpha: 0.06, base: o.base });
    const c = d.f[d.f.length - 1];
    if (o.crit !== false) pl.dot(D.val(c, xk), D.val(c, yk), { color: '--ink-2', r: 3.5, label: o.critLabel === undefined ? 'punto crítico' : o.critLabel });
  };
  /* estados a lo largo de una isóbara P (Pa), de Tmin a Tmax (K) */
  D.isobar = function (F, P, Tmin, Tmax, n = 60) {
    const out = [];
    if (P < F.Pc) {
      const Ts = F.Tsat(P);
      for (let i = 0; i <= n / 3; i++) { const T = Tmin + ((Ts - Tmin) * i) / (n / 3); if (T < Ts) out.push(F.state(P, { T })); }
      for (let i = 0; i <= 12; i++) out.push(F.state(P, { x: i / 12 }));
      for (let i = 1; i <= n; i++) { const T = Ts + (Tmax - Ts) * Math.pow(i / n, 1.5); out.push(F.sup(P, T)); }
    } else {
      for (let i = 0; i <= n; i++) { const T = Tmin + ((Tmax - Tmin) * i) / n; out.push(F.sup(Math.min(P, F.Pmax), Math.max(T, F.Tsat(Math.min(P, F.Pmax)) + 0.01))); }
    }
    return out;
  };
  /* estados a lo largo de una isoterma T (K), de Pmin a Pmax (Pa) */
  D.isotherm = function (F, T, Pmin, Pmax, n = 60) {
    const out = [];
    const lp = (i, a, b) => Math.exp(Math.log(a) + ((Math.log(b) - Math.log(a)) * i) / n);
    if (T < F.Tc) {
      const Ps = F.Psat(T);
      for (let i = 0; i <= n; i++) { const P = lp(i, Pmin, Ps); if (P < Ps * 0.9999) out.push(F.sup(P, T)); }
      const s = F.sat(T);
      for (let i = 12; i >= 0; i--) { const x = i / 12; out.push({ T, P: s.P, v: s.vf + x * (s.vg - s.vf), h: s.hf + x * s.hfg, s: s.sf + x * s.sfg }); }
      for (let i = 1; i <= 10; i++) { const P = Ps + ((Math.min(Pmax, F.Pmax) - Ps) * i) / 10; out.push(F.state(P, { T })); }
    } else {
      for (let i = 0; i <= n; i++) out.push(F.sup(lp(i, Pmin, Math.min(Pmax, F.Pmax)), T));
    }
    return out;
  };
  D.line = (pl, sts, xk, yk, st) => pl.path(sts.map((s) => [D.val(s, xk), D.val(s, yk)]), st);
})();

   40-view3d.js — Motor 3D ligero sobre Canvas 2D

        b.addEventListener('click', () => { fn(); this.sim.redraw(); });

        /* Jacobiano numérico en x,y */
        const h = 1e-3;
        const qx = this.P([p[0] + h, p[1], z0]), qy = this.P([p[0], p[1] + h, z0]);
        const a = (qx[0] - q[0]) / h, b = (qy[0] - q[0]) / h, c = (qx[1] - q[1]) / h, d = (qy[1] - q[1]) / h;
        const det = a * d - b * c;
        if (Math.abs(det) < 1e-9) break;
        p = [p[0] + (d * ex - b * ey) / det, p[1] + (-c * ex + a * ey) / det, z0];
      }
      return p;
    }
  }
  EM.View3D = View3D;
})();

/* Portada: gas de partículas en un cilindro con pistón */
(function () {
  'use strict';
  const EM = window.EM;
  EM.defineSim('home-hero', function (sim) {
    const cv = sim.canvas({ aspect: 1.15 });
    sim.seg('pr', { label: 'Pared izquierda', options: [['ad', 'Aislada (adiabático)'], ['iso', 'A temperatura fija (isotérmico)']], value: 'ad' });
    const g = new EM.GasBox({ N: 160, r: 0.011, W: 0.75, H: 1, T: 1 });
    let t = 0;
    const trail = [];
    sim.onChange = () => { g.thermal = sim.p.pr === 'iso' ? 1 : null; g.W = 0.75; g.vw = 0; g.reset(1); trail.length = 0; t = 0; };
    sim.animate((dt) => {
      if (!(dt > 0)) return;
      const sub = 6;
      for (let s = 0; s < sub; s++) {
        const h = Math.min(dt, 0.03) / sub * 0.6;
        t += h;
        const W = 0.75 + 0.35 * Math.sin(0.5 * t);
        g.vw = (W - g.W) / h; g.W = W;
        g.step(h);
      }
      const P = g.pressure(0.8);
      if (P !== null) { trail.push([g.W * g.H, P]); if (trail.length > 900) trail.shift(); }
    });
    sim.onDraw(() => {
      const ctx = cv.ctx, Wc = cv.w, Hc = cv.h;
      EM.draw.clear(cv);
      const bx = 18, by = 16, bh = Hc * 0.48, bw = (Wc - 36) / 1.1;
      ctx.strokeStyle = EM.col('--ink-2'); ctx.lineWidth = 2;
      ctx.strokeRect(bx, by, bw * 1.1, bh);
      if (g.thermal) { ctx.fillStyle = EM.alpha('--c2', 0.5); ctx.fillRect(bx - 6, by, 6, bh); }
      g.draw(ctx, bx, by, bw * g.W, bh, { speedColor: true, Tref: 1 });
      const px = bx + bw * g.W;
      ctx.fillStyle = EM.col('--ink-3'); ctx.fillRect(px, by + 2, 8, bh - 4); ctx.fillRect(px + 8, by + bh / 2 - 3, bw * 1.1 - bw * g.W, 6);
      const pl = new EM.Plot(ctx, { x: 0, y: by + bh + 6, w: Wc, h: Hc - bh - by - 6, xmin: 0.35, xmax: 1.15, ymin: 0, ymax: 420, xlabel: 'volumen (área de la caja)', ylabel: 'P', ml: 44, mb: 34, yticks: [] });
      pl.frame();
      pl.fn((V) => (g.N * 1) / V, { color: '--c3', width: 1.2, dash: [5, 4] });
      pl.fn((V) => (g.N * 1 / 0.75) * Math.pow(0.75 / V, 2), { color: '--c5', width: 1.2, dash: [2, 3] });
      pl.path(trail, { color: '--accent', width: 1.6 });
      if (trail.length) pl.dot(...trail[trail.length - 1]);
      pl.legend([{ label: 'isoterma PV = NkT', color: '--c3', dash: [5, 4] }, { label: 'adiabática PV² = cte (2D)', color: '--c5', dash: [2, 3] }], 'tr');
      EM.text(ctx, 'T cinética = ' + EM.fix(g.Tkin(), 2) + ' (unidades reducidas)', Wc / 2, by + bh + 2 + 0, { size: 11, align: 'center', color: '--ink-3', baseline: 'top' });
    });
  });
})();

(function () {
  'use strict';
  const EM = window.EM, TH = EM.th;

  /* 1.1 Contacto térmico entre dos cuerpos */
  EM.defineSim('contacto-termico', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });
    sim.slider('C1', { label: 'Capacidad calorífica del cuerpo 1', min: 1, max: 1000, step: 1, value: 400, unit: 'J/K', log: true, fmt: (v) => v.toFixed(0) });
    sim.slider('C2', { label: 'Capacidad calorífica del cuerpo 2 (termómetro)', min: 1, max: 1000, step: 1, value: 40, unit: 'J/K', log: true, fmt: (v) => v.toFixed(0) });
    sim.slider('T1', { label: 'Temperatura inicial 1', min: 0, max: 100, step: 0.5, value: 80, unit: '°C', fmt: (v) => v.toFixed(1) });
    sim.slider('T2', { label: 'Temperatura inicial 2', min: 0, max: 100, step: 0.5, value: 20, unit: '°C', fmt: (v) => v.toFixed(1) });
    sim.slider('G', { label: 'Conductancia del contacto <i>G</i>', min: 0.5, max: 20, step: 0.1, value: 4, unit: 'W/K', fmt: (v) => v.toFixed(1) });
    sim.out('tf', 'Temperatura final', { hl: true });
    sim.out('tau', 'Constante de tiempo τ');
    sim.out('q', 'Calor transferido 1 → 2');
    sim.out('err', 'Error de inserción del termómetro');
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx;
      EM.draw.clear(cv);
      const tau = (p.C1 * p.C2) / (p.G * (p.C1 + p.C2)), Tf = (p.C1 * p.T1 + p.C2 * p.T2) / (p.C1 + p.C2);
      const tmax = 5 * tau;
      const pl = new EM.Plot(ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: 0, xmax: tmax, ymin: 0, ymax: 100, xlabel: 't (s)', ylabel: 'T (°C)' });
      pl.frame();
      const d0 = p.T1 - p.T2;
      pl.fn((t) => Tf + (p.C2 / (p.C1 + p.C2)) * d0 * Math.exp(-t / tau), { color: '--c2', width: 2.6 });
      pl.fn((t) => Tf - (p.C1 / (p.C1 + p.C2)) * d0 * Math.exp(-t / tau), { color: '--c1', width: 2.6 });
      pl.hline(Tf, { color: '--ink-3', label: 'T_f = ' + EM.fix(Tf, 2) + ' °C', labelRight: true });
      pl.vline(tau, { label: 'τ' });
      pl.legend([{ label: 'cuerpo 1', color: '--c2' }, { label: 'cuerpo 2', color: '--c1' }], 'tr');
      sim.set('tf', EM.fix(Tf, 2) + ' °C');
      sim.set('tau', EM.fix(tau, 2) + ' s');
      sim.set('q', EM.fix((p.C1 * p.C2 / (p.C1 + p.C2)) * d0, 1) + ' J');
      sim.set('err', EM.fix(Tf - p.T1, 2) + ' °C respecto de la temperatura original del cuerpo 1');
    });
  });

  /* 1.2 Termómetro de gas a volumen constante */
  const GV = { N2: ['Nitrógeno', 0.137, 3.87e-5, '--c1'], Ar: ['Argón', 0.1355, 3.2e-5, '--c3'], CO2: ['Dióxido de carbono', 0.364, 4.267e-5, '--c2'], H2: ['Hidrógeno', 0.02476, 2.661e-5, '--c5'] };
  EM.defineSim('termometro-gas', function (sim) {
    const cv = sim.canvas({ aspect: 1.9 });
    sim.slider('T', { label: 'Temperatura real del sistema', min: 200, max: 700, step: 0.01, value: 373.124, unit: 'K', fmt: (v) => v.toFixed(2) });
    sim.slider('Pm', { label: 'Presión máxima de llenado', min: 20, max: 300, step: 5, value: 120, unit: 'kPa', fmt: (v) => v.toFixed(0) });
    for (const k of Object.keys(GV)) sim.check(k, { label: GV[k][0], value: true });
    sim.out('r', 'Lectura con P<sub>tp</sub> = máxima', { hl: true });
    sim.out('x', 'Extrapolación a P<sub>tp</sub> → 0');
    const Ttp = 273.16, R = TH.R;
    const B = (g, T) => GV[g][2] - GV[g][1] / (R * T);
    /* volumen molar con P = RT/v (1 + B/v): raíz mayor de P v² − RT v − RT B = 0 */
    const vOf = (g, T, P) => (R * T + Math.sqrt(R * R * T * T + 4 * P * R * T * B(g, T))) / (2 * P);
    const reading = (g, T, Ptp) => { const v = vOf(g, Ttp, Ptp), P = (R * T / v) * (1 + B(g, T) / v); return (Ttp * P) / Ptp; };
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx;
      EM.draw.clear(cv);
      const Pm = p.Pm * 1e3, act = Object.keys(GV).filter((k) => p[k]);
      let lo = p.T, hi = p.T;
      for (const g of act) { const r = reading(g, p.T, Pm); lo = Math.min(lo, r); hi = Math.max(hi, r); }
      const pad = Math.max(0.05, (hi - lo) * 0.15);
      const pl = new EM.Plot(ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: 0, xmax: p.Pm, ymin: lo - pad, ymax: hi + pad, xlabel: 'P_{tp} (kPa)', ylabel: 'T* = 273.16 P/P_{tp} (K)', ml: 64 });
      pl.frame();
      pl.hline(p.T, { color: '--accent', dash: [], width: 1.6, label: 'T real = ' + p.T.toFixed(3) + ' K' });
      const leg = [];
      for (const g of act) {
        pl.fn((x) => (x <= 0 ? NaN : reading(g, p.T, x * 1e3)), { color: GV[g][3], width: 2.2, from: 0.5 });
        for (let i = 1; i <= 5; i++) { const x = (p.Pm * i) / 5; pl.dot(x, reading(g, p.T, x * 1e3), { color: GV[g][3], r: 3.5 }); }
        leg.push({ label: GV[g][0], color: GV[g][3] });
      }
      if (leg.length) pl.legend(leg, 'br');
      sim.set('r', act.map((g) => GV[g][0] + ': ' + reading(g, p.T, Pm).toFixed(3) + ' K').join('<br>') || '—');
      sim.set('x', act.map((g) => { const r1 = reading(g, p.T, Pm), r2 = reading(g, p.T, Pm / 2); return GV[g][0] + ': ' + (2 * r2 - r1).toFixed(3) + ' K'; }).join('<br>') || '—');
    });
  });

  /* 1.3 Escalas de temperatura */
  const FIX = [[13.8033, 'p.t. H₂'], [83.8058, 'p.t. Ar'], [273.16, 'p.t. agua'], [310.15, 'cuerpo humano'], [373.124, 'ebullición agua'], [505.078, 'sol. Sn'], [692.677, 'sol. Zn'], [933.473, 'sol. Al'], [1234.93, 'sol. Ag']];
  EM.defineSim('escalas', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });
    sim.slider('T', { label: 'Temperatura', min: 0, max: 1300, step: 0.05, value: 293.15, unit: 'K', fmt: (v) => v.toFixed(2) });
    sim.out('k', 'Kelvin', { hl: true });
    sim.out('c', 'Celsius');
    sim.out('f', 'Fahrenheit');
    sim.out('r', 'Rankine');
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, W = cv.w, H = cv.h;
      EM.draw.clear(cv);
      const conv = [['K', (T) => T], ['°C', (T) => T - 273.15], ['°F', (T) => 1.8 * (T - 273.15) + 32], ['R', (T) => 1.8 * T]];
      const top = 24, bot = H - 26, Y = (T) => bot - ((bot - top) * T) / 1300;
      const xs = conv.map((_, i) => W * (0.2 + 0.16 * i));
      conv.forEach(([u, f], i) => {
        const x = xs[i];
        ctx.fillStyle = EM.alpha('--ink-3', 0.12); ctx.fillRect(x - 7, top, 14, bot - top);
        ctx.fillStyle = EM.col('--accent'); ctx.fillRect(x - 5, Y(p.T), 10, bot - Y(p.T));
        ctx.beginPath(); ctx.arc(x, bot + 8, 11, 0, 7); ctx.fill();
        /* marcas cada 100 unidades de la propia escala */
        const a = f(0), b = f(1300), st = 200;
        for (let v = Math.ceil(a / st) * st; v <= b; v += st) {
          const T = conv[0][1](0) + (v - a) / (b - a) * 1300;
          EM.text(ctx, String(v).replace('-', '−'), x + 12, Y(T) + 4, { size: 10, mono: true, color: '--ink-3' });
          ctx.fillStyle = EM.col('--ink-3'); ctx.fillRect(x + 7, Y(T), 4, 1);
        }
        EM.text(ctx, u, x, top - 8, { size: 13, align: 'center', color: '--ink', weight: 700 });
      });
      for (const [T, n] of FIX) {
        ctx.strokeStyle = EM.alpha('--c1', 0.35); ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(xs[0] - 10, Y(T)); ctx.lineTo(xs[3] + 50, Y(T)); ctx.stroke(); ctx.setLineDash([]);
        EM.text(ctx, n, xs[0] - 14, Y(T) + 4, { size: 10, align: 'right', color: '--c1' });
      }
      ctx.strokeStyle = EM.col('--accent'); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(xs[0] - 10, Y(p.T)); ctx.lineTo(xs[3] + 50, Y(p.T)); ctx.stroke();
      sim.set('k', p.T.toFixed(2) + ' K');
      sim.set('c', EM.fix(p.T - 273.15, 2) + ' °C');
      sim.set('f', EM.fix(1.8 * (p.T - 273.15) + 32, 2) + ' °F');
      sim.set('r', EM.fix(1.8 * p.T, 2) + ' R');
    });
  });

  /* 1.4 Termistor NTC en divisor de tensión */
  const SH = [1.1291294e-3, 2.3412491e-4, 8.769416e-8], BETA = 3854.57;
  const Tsh = (R) => { const L = Math.log(R); return 1 / (SH[0] + SH[1] * L + SH[2] * L * L * L); };
  const Rsh = (T) => { let lo = 10, hi = 1e8; for (let i = 0; i < 120; i++) { const m = Math.sqrt(lo * hi); if (Tsh(m) > T) lo = m; else hi = m; } return Math.sqrt(lo * hi); };
  EM.defineSim('termistor', function (sim) {
    const cv = sim.canvas({ aspect: 1.9 });
    sim.slider('t', { label: 'Temperatura del agua', min: -20, max: 120, step: 0.1, value: 25, unit: '°C', fmt: (v) => v.toFixed(1) });
    sim.slider('Rf', { label: 'Resistencia fija del divisor', min: 1, max: 100, step: 0.1, value: 10, unit: 'kΩ', log: true, fmt: (v) => v.toFixed(1) });
    sim.seg('bits', { label: 'Convertidor analógico-digital', options: [[10, '10 bits (Arduino)'], [12, '12 bits (ESP32)']], value: 12 });
    sim.out('R', 'Resistencia del NTC', { hl: true });
    sim.out('V', 'Tensión en el NTC (3.3 V)');
    sim.out('n', 'Cuenta del convertidor');
    sim.out('dT', 'Resolución en temperatura');
    sim.out('b', 'Lectura con el modelo β (0–25 °C)');
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx;
      EM.draw.clear(cv);
      const T = p.t + 273.15, R = Rsh(T), Rf = p.Rf * 1e3, Vcc = 3.3, N = Math.pow(2, p.bits);
      const V = (Vcc * R) / (R + Rf), n = Math.round((V / Vcc) * (N - 1));
      /* resolución: dT por cuenta */
      const nOf = (TT) => { const r = Rsh(TT); return (r / (r + Rf)) * (N - 1); };
      const dT = 0.02 / Math.abs(nOf(T + 0.01) - nOf(T - 0.01));
      const pl = new EM.Plot(ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: -20, xmax: 120, ymin: 300, ymax: 2e5, ylog: true, xlabel: 't (°C)', ylabel: 'R (Ω)', ml: 60 });
      pl.frame();
      pl.fn((t) => Rsh(t + 273.15), { color: '--accent', width: 2.6 });
      pl.fn((t) => 1e4 * Math.exp(BETA * (1 / (t + 273.15) - 1 / 298.15)), { color: '--c1', width: 1.6, dash: [6, 4] });
      pl.hline(Rf, { color: '--c3', label: 'R fija', labelRight: true });
      pl.dot(p.t, R);
      pl.legend([{ label: 'Steinhart–Hart (fabricante)', color: '--accent' }, { label: 'modelo β calibrado en 0 y 25 °C', color: '--c1', dash: [6, 4] }], 'tr');
      const Rmeas = (n / (N - 1)) * Rf / (1 - n / (N - 1));
      sim.set('R', EM.si(R, 'Ω'));
      sim.set('V', EM.fix(V, 4) + ' V');
      sim.set('n', n + ' de ' + (N - 1));
      sim.set('dT', EM.fix(dT, 3) + ' °C por cuenta');
      sim.set('b', isFinite(Rmeas) && Rmeas > 0 ? EM.fix(1 / (1 / 298.15 + Math.log(Rmeas / 1e4) / BETA) - 273.15, 2) + ' °C (Steinhart–Hart: ' + EM.fix(Tsh(Rmeas) - 273.15, 2) + ' °C)' : '—');
    });
  });
})();

/* Capítulo 2 — Gas ideal y teoría cinética */
(function () {
  'use strict';
  const EM = window.EM, TH = EM.th;

  /* 2.1 Caja de discos duros: presión cinética */
  EM.defineSim('caja-cinetica', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });
    sim.slider('N', { label: 'Número de partículas <i>N</i>', min: 20, max: 400, step: 10, value: 150, fmt: (v) => v.toFixed(0) });
    sim.slider('T', { label: 'Temperatura (reducida)', min: 0.25, max: 4, step: 0.05, value: 1, fmt: (v) => v.toFixed(2) });
    sim.slider('W', { label: 'Ancho de la caja (área)', min: 0.4, max: 1, step: 0.01, value: 1, fmt: (v) => v.toFixed(2) });
    sim.slider('r', { label: 'Radio de los discos', min: 0.003, max: 0.03, step: 0.001, value: 0.008, fmt: (v) => v.toFixed(3) });
    sim.check('same', { label: 'Empezar con todas las rapideces iguales', value: false });
    sim.out('P', 'Presión medida en la pared', { hl: true });
    sim.out('Pi', 'Ideal <i>Nk<sub>B</sub>T</i>/<i>A</i>');
    sim.out('Ph', 'Discos duros (Henderson)');
    sim.out('phi', 'Fracción de área ocupada');
    let g;
    const make = () => {
      const p = sim.p;
      g = new EM.GasBox({ N: p.N, r: p.r, W: p.W, H: 1, T: p.T });
      if (p.same) { const s = Math.sqrt(2 * p.T); for (let i = 0; i < g.N; i++) { const a = Math.random() * 2 * Math.PI; g.vx[i] = s * Math.cos(a); g.vy[i] = s * Math.sin(a); } }
    };
    make();
    sim.onChange = (id) => {
      if (id === 'T' && g) { g.scale(Math.sqrt(sim.p.T / Math.max(1e-9, g.Tkin()))); g.T = sim.p.T; g.Pavg = null; g._si = 0; g._st = 0; return; }
      make();
    };
    sim.resetButton(make);
    sim.animate((dt) => { if (!(dt > 0)) return; for (let s = 0; s < 8; s++) g.step(Math.min(dt, 0.03) / 8 * 0.5); g.pressure(3); });
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, W = cv.w, H = cv.h;
      EM.draw.clear(cv);
      const side = H - 20, bx = 10, by = 10;
      ctx.strokeStyle = EM.col('--ink-2'); ctx.lineWidth = 2; ctx.strokeRect(bx, by, side * p.W, side);
      g.draw(ctx, bx, by, side * p.W, side, { speedColor: true, Tref: p.T });
      /* histograma de rapideces */
      const vmax = 4 * Math.sqrt(p.T), nb = 24, hist = new Array(nb).fill(0);
      for (let i = 0; i < g.N; i++) { const v = Math.hypot(g.vx[i], g.vy[i]); const k = Math.floor((v / vmax) * nb); if (k < nb) hist[k]++; }
      const pl = new EM.Plot(ctx, { x: side + 20, y: 0, w: W - side - 20, h: H, xmin: 0, xmax: vmax, ymin: 0, ymax: 1.4 / Math.sqrt(p.T) * 0.62, xlabel: 'rapidez v', ylabel: 'f(v)', ml: 46, yticks: [] });
      pl.frame();
      const bw = vmax / nb;
      ctx.fillStyle = EM.alpha('--c1', 0.35);
      hist.forEach((c, k) => { const hgt = c / (g.N * bw); ctx.fillRect(pl.X(k * bw), pl.Y(hgt), pl.X(bw) - pl.X(0) - 1, pl.Y(0) - pl.Y(hgt)); });
      const Tk = g.Tkin();
      pl.fn((v) => (v / Tk) * Math.exp((-v * v) / (2 * Tk)), { color: '--accent', width: 2.4 });
      pl.legend([{ label: 'simulación', color: '--c1', kind: 'sq' }, { label: 'Maxwell 2D a la T cinética', color: '--accent' }], 'tr');
      const A = p.W, phi = (g.N * Math.PI * p.r * p.r) / A, Pi = (g.N * Tk) / A;
      const Ph = Pi * (1 + phi * phi / 8) / Math.pow(1 - phi, 2);
      sim.set('P', g.Pavg === null ? '—' : EM.fix(g.Pavg, 1) + ' (T cinética ' + EM.fix(Tk, 3) + ')');
      sim.set('Pi', EM.fix(Pi, 1));
      sim.set('Ph', EM.fix(Ph, 1));
      sim.set('phi', EM.fix(100 * phi, 2) + ' %');
    });
  });

  /* 2.2 Maxwell–Boltzmann y escape */
  const GAS = { H2: ['H₂', 2.016], He: ['He', 4.0026], H2O: ['H₂O', 18.015], N2: ['N₂', 28.013], O2: ['O₂', 31.999], Ar: ['Ar', 39.948], CO2: ['CO₂', 44.01], Xe: ['Xe', 131.29] };
  const BODY = { tierra: ['Tierra (exosfera, ~1000 K)', 11.19, 1000], luna: ['Luna (día, ~390 K)', 2.38, 390], marte: ['Marte (exosfera, ~300 K)', 5.03, 300], titan: ['Titán (~150 K)', 2.64, 150], jupiter: ['Júpiter (~1000 K)', 59.5, 1000] };
  EM.defineSim('maxwell', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });
    sim.select('g', { label: 'Gas', options: Object.entries(GAS).map(([k, v]) => [k, v[0] + ' (' + v[1] + ' g/mol)']), value: 'N2' });
    sim.slider('T', { label: 'Temperatura', min: 20, max: 3000, step: 1, value: 300, unit: 'K', log: true, fmt: (v) => v.toFixed(0) });
    sim.select('b', { label: 'Cuerpo celeste (para el escape)', options: Object.entries(BODY).map(([k, v]) => [k, v[0]]), value: 'tierra' });
    sim.button('Usar la temperatura de la exosfera', () => { sim.ctl.T.set(BODY[sim.p.b][2]); });

  /* 2.3 Equipartición: c_v(T) */

  const rotCv = (t) => { /* rotor rígido, t = T/Θ_r */
    let Z = 0, E = 0, E2 = 0;
    for (let J = 0; J < 200; J++) { const e = J * (J + 1), w = (2 * J + 1) * Math.exp(-e / t); Z += w; E += e * w; E2 += e * e * w; if (w < 1e-18 * Z && J > 5) break; }

    return TH.cpMol(sp, T) / TH.R - 1;

      const leg = [], vals = [];
      for (const k of Object.keys(SPE)) {
        if (!p[k]) continue;
        pl.fn((T) => (k === 'H2' ? cvR('H2', T) : T < 60 && k !== 'He' ? NaN : cvR(k, T)), { color: SPE[k][1], width: 2.4 });
        if (JANAF[k]) for (const [T, c] of JANAF[k]) pl.dot(T, c / TH.R - 1, { color: SPE[k][1], r: 3.5 });
        pl.dot(p.T, cvR(k, p.T), { color: SPE[k][1], r: 5 });
        leg.push({ label: SPE[k][0], color: SPE[k][1] });
        const c = cvR(k, p.T); vals.push([SPE[k][0], c]);
      }
      pl.vline(p.T, { color: '--accent' });
      if (leg.length) pl.legend(leg, 'tl');
      sim.set('cv', vals.map(([n, c]) => n + ': ' + c.toFixed(3)).join('<br>') || '—');
      sim.set('k', vals.map(([n, c]) => n + ': ' + ((c + 1) / c).toFixed(3)).join('<br>') || '—');
    });
  });

      }
      sim.set('ph', ph);
    });
  });
})();

    sim.check('cyc', { label: 'Cerrar el ciclo regresando por el camino isotérmico', value: false });
    sim.out('W', 'Trabajo de frontera 1 → 2', { hl: true });
    sim.out('dU', 'Cambio de energía interna (aire, gas ideal)');
    sim.out('Q', 'Calor recibido <i>Q</i> = Δ<i>U</i> + <i>W</i>');
    sim.out('Wc', 'Trabajo neto del ciclo');
    const V1 = 0.1;
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx;
      EM.draw.clear(cv);
      const P1 = p.P1, V2 = p.V2;
      const P2 = p.c === 'pol' ? P1 * Math.pow(V1 / V2, p.n) : (P1 * V1) / V2;
      const path = [];
      if (p.c === 'iso') for (let i = 0; i <= 100; i++) { const V = V1 + ((V2 - V1) * i) / 100; path.push([V, (P1 * V1) / V]); }
      else if (p.c === 'pv') path.push([V1, P1], [V2, P1], [V2, P2]);
      else if (p.c === 'vp') path.push([V1, P1], [V1, P2], [V2, P2]);
      else for (let i = 0; i <= 100; i++) { const V = V1 + ((V2 - V1) * i) / 100; path.push([V, P1 * Math.pow(V1 / V, p.n)]); }
      const W = p.c === 'iso' ? P1 * V1 * Math.log(V2 / V1) : p.c === 'pv' ? P1 * (V2 - V1) : p.c === 'vp' ? P2 * (V2 - V1) : Math.abs(p.n - 1) < 1e-9 ? P1 * V1 * Math.log(V2 / V1) : (P2 * V2 - P1 * V1) / (1 - p.n);
      const cvAir = 0.718 / 0.287; /* c_v/R para aire */
      const dU = cvAir * (P2 * V2 - P1 * V1);
      const pl = new EM.Plot(ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: 0, xmax: 0.65, ymin: 0, ymax: 1100, xlabel: 'V (m³)', ylabel: 'P (kPa)' });
      pl.frame();
      for (let T = 1; T <= 6; T++) pl.fn((V) => (T * 40) / V, { color: '--grid-2', width: 1, from: 0.03 });
      ctx.save(); ctx.fillStyle = EM.alpha('--accent', 0.18); ctx.beginPath(); ctx.moveTo(pl.X(V1), pl.Y(0));
      path.forEach(([V, P]) => ctx.lineTo(pl.X(V), pl.Y(P))); ctx.lineTo(pl.X(V2), pl.Y(0)); ctx.closePath(); ctx.fill(); ctx.restore();
      pl.path(path, { color: '--accent', width: 2.8 });
      let Wc = null;
      if (p.cyc) {
        const back = []; for (let i = 0; i <= 100; i++) { const V = V2 + ((V1 - V2) * i) / 100; back.push([V, (P2 * V2) / V]); }
        pl.path(back, { color: '--c1', width: 2, dash: [6, 4] });
        Wc = W - P2 * V2 * Math.log(V2 / V1);
      }
      pl.dot(V1, P1, { color: '--ink', label: '1' }); pl.dot(V2, P2, { color: '--ink', label: '2' });
      sim.set('W', EM.fix(W, 2) + ' kJ (área sombreada)');
      sim.set('dU', EM.fix(dU, 2) + ' kJ' + (Math.abs(P2 * V2 - P1 * V1) < 1e-9 ? ' (T₂ = T₁)' : ''));
      sim.set('Q', EM.fix(dU + W, 2) + ' kJ');
      sim.set('Wc', Wc === null ? '—' : EM.fix(Wc, 2) + ' kJ (área encerrada)');
    });
  });

  /* 5.2 Experimento de Joule */
  EM.defineSim('joule-paletas', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });
    sim.slider('m', { label: 'Masa de cada pesa', min: 2, max: 30, step: 0.5, value: 15, unit: 'kg', fmt: (v) => v.toFixed(1) });
    sim.slider('h', { label: 'Altura de caída', min: 0.5, max: 3, step: 0.1, value: 2, unit: 'm', fmt: (v) => v.toFixed(1) });
    sim.slider('M', { label: 'Masa de agua', min: 1, max: 10, step: 0.1, value: 6, unit: 'kg', fmt: (v) => v.toFixed(1) });
    sim.slider('loss', { label: 'Conductancia de pérdidas al ambiente', min: 0, max: 1, step: 0.01, value: 0, unit: 'W/K', fmt: (v) => v.toFixed(2) });
    sim.slider('dTa', { label: 'Agua inicial respecto del ambiente', min: -1, max: 1, step: 0.05, value: 0, unit: 'K', fmt: (v) => v.toFixed(2) });
    sim.resetButton(() => reset());
    sim.out('n', 'Caídas realizadas', { hl: true });
    sim.out('W', 'Trabajo de las pesas');
    sim.out('dT', 'Aumento de temperatura');
    sim.out('J', 'Equivalente aparente <i>W</i>/(<i>Mc</i>Δ<i>T</i>)');
    let n, y, T, t, ang, W;
    const reset = () => { n = 0; y = 0; T = 0; t = 0; ang = 0; W = 0; };
    reset();
    sim.onChange = (id) => { if (id !== 'loss') reset(); };
    sim.animate((dt) => {
      if (!(dt > 0) || n >= 20) return;
      const p = sim.p, v = 0.6; /* caída a velocidad terminal casi constante */
      const dy = Math.min(p.h - y, v * dt * 3);
      y += dy; ang += dy * 12;
      const dW = 2 * p.m * TH.g * dy; W += dW;
      const C = p.M * 4186, Ta = -p.dTa;
      T += (dW - p.loss * (T - Ta) * dt * 30) / C;
      t += dt;
      if (y >= p.h - 1e-9) { n++; y = 0; }
    });
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, Wc = cv.w, H = cv.h;
      EM.draw.clear(cv);
      const cx = Wc * 0.25, top = 30, tank = [cx - 60, H * 0.45, 120, H * 0.45];
      ctx.fillStyle = EM.alpha('--c1', 0.25); ctx.fillRect(...tank);
      ctx.strokeStyle = EM.col('--ink-2'); ctx.lineWidth = 2; ctx.strokeRect(...tank);
      /* eje y paletas */
      ctx.beginPath(); ctx.moveTo(cx, top); ctx.lineTo(cx, tank[1] + tank[3] - 10); ctx.stroke();
      for (let k = 0; k < 4; k++) { const a = ang + (k * Math.PI) / 2, w = 45 * Math.cos(a); ctx.fillStyle = EM.alpha('--ink-2', 0.5 + 0.4 * Math.sin(a)); for (const yy of [0.62, 0.8]) ctx.fillRect(cx + Math.min(0, w), tank[1] + tank[3] * yy, Math.abs(w), 8); }
      /* cuerdas y pesas */
      const ys = top + 30 + (y / 3) * (H - 90);
      for (const s of [-1, 1]) {
        const px = cx + s * 110;
        ctx.strokeStyle = EM.col('--ink-3'); ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(cx, top + 6); ctx.lineTo(px, top + 6); ctx.lineTo(px, ys); ctx.stroke();
        ctx.fillStyle = EM.col('--c4'); ctx.fillRect(px - 14, ys, 28, 26);
        ctx.beginPath(); ctx.arc(px, top + 6, 6, 0, 7); ctx.stroke();
      }
      EM.text(ctx, 'ΔT = ' + EM.fix(T, 4) + ' K', cx, tank[1] + 18, { size: 12, align: 'center', mono: true, color: '--ink' });
      /* gráfica T vs trabajo */
      const C = p.M * 4186, Wmax = 20 * 2 * p.m * TH.g * p.h;
      const pl = new EM.Plot(ctx, { x: Wc * 0.5, y: 0, w: Wc * 0.5, h: H, xmin: 0, xmax: Wmax / 1e3, ymin: Math.min(0, -p.dTa) - 0.05, ymax: Math.max(Wmax / C, 0.05) * 1.15, xlabel: 'W (kJ)', ylabel: 'ΔT (K)' });
      pl.frame();
      pl.fn((x) => (x * 1e3) / C, { color: '--c3', width: 1.5, dash: [6, 4] });
      pl.dot(W / 1e3, T, { color: '--accent', r: 5 });
      sim.set('n', n + ' de 20');
      sim.set('W', EM.fix(W, 0) + ' J');
      sim.set('dT', EM.fix(T, 4) + ' K (ideal ' + EM.fix(W / C, 4) + ' K)');
      sim.set('J', T > 1e-6 ? EM.fix(W / (C * T) * 4.184, 3) + ' J/cal' : '—');
    });
  });

  /* 5.3 Calorímetro con posible fusión */
  const MET = { al: ['Aluminio', 0.9], fe: ['Hierro', 0.45], cu: ['Cobre', 0.385], pb: ['Plomo', 0.129], ag: ['Plata', 0.235], vid: ['Vidrio', 0.84] };
  EM.defineSim('calorimetro', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });
    sim.select('met', { label: 'Muestra', options: Object.entries(MET).map(([k, v]) => [k, v[0] + ' (c = ' + v[1] + ')']), value: 'al' });
    sim.slider('ms', { label: 'Masa de la muestra', min: 0, max: 1000, step: 5, value: 200, unit: 'g', fmt: (v) => v.toFixed(0) });
    sim.slider('Ts', { label: 'Temperatura de la muestra', min: 0, max: 300, step: 1, value: 100, unit: '°C', fmt: (v) => v.toFixed(0) });
    sim.slider('mw', { label: 'Masa de agua', min: 0, max: 1000, step: 5, value: 500, unit: 'g', fmt: (v) => v.toFixed(0) });
    sim.slider('Tw', { label: 'Temperatura del agua', min: 0, max: 90, step: 0.5, value: 20, unit: '°C', fmt: (v) => v.toFixed(1) });
    sim.slider('mi', { label: 'Masa de hielo a −10 °C', min: 0, max: 500, step: 5, value: 0, unit: 'g', fmt: (v) => v.toFixed(0) });
    sim.slider('mc', { label: 'Vaso de cobre', min: 0, max: 300, step: 5, value: 100, unit: 'g', fmt: (v) => v.toFixed(0) });
    sim.out('Tf', 'Temperatura final', { hl: true });
    sim.out('ice', 'Hielo remanente');
    sim.out('bal', 'Balance: calor cedido = calor ganado');
    const cw = 4.186, ci = 2.09, Lf = 333.6, ccu = 0.385;
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx;
      EM.draw.clear(cv);
      const cs = MET[p.met][1];
      /* sistema: muestra (ms, Ts), agua+vaso (Tw), hielo (−10 °C). Energía relativa a todo líquido a 0 °C */
      const Cnon = (p.ms * cs + p.mc * ccu) / 1000, mwk = p.mw / 1000, mik = p.mi / 1000;
      const E = Cnon * 0 + (p.ms * cs * p.Ts + p.mc * ccu * p.Tw) / 1000 + mwk * cw * p.Tw - mik * (ci * 10 + Lf);
      let Tf, iceLeft = 0, frozenWater = 0;
      if (E >= 0) Tf = E / (Cnon + (mwk + mik) * cw);
      else if (E >= -(mwk + mik) * Lf) { Tf = 0; iceLeft = -E / Lf; frozenWater = Math.max(0, iceLeft - mik); }
      else { Tf = (E + (mwk + mik) * Lf) / (Cnon + (mwk + mik) * ci); iceLeft = mik + mwk; }
      /* barras de energía */
      const items = [['muestra', (p.ms * cs * (p.Ts - Tf)) / 1000], ['vaso', (p.mc * ccu * (p.Tw - Tf)) / 1000], ['agua', mwk * cw * (p.Tw - Tf)]];
      const pl = new EM.Plot(ctx, { x: 0, y: 0, w: cv.w * 0.55, h: cv.h, xmin: 0, xmax: 5, ymin: -60, ymax: 60, xlabel: '', ylabel: 'calor cedido (+) / ganado (−) (kJ)', xticks: [] });
      pl.frame();
      const Qice = E >= 0 ? -mik * (ci * 10 + Lf + cw * Tf) : Tf === 0 ? -(mik * ci * 10 + (mik - iceLeft) * Lf) : -items.reduce((a, it) => a + it[1], 0);
      items.push(['hielo', Qice]);
      let sum = 0;
      items.forEach(([n, q], i) => {
        sum += q;
        ctx.fillStyle = EM.alpha(q >= 0 ? '--c2' : '--c1', 0.65);
        const x0 = pl.X(i + 0.6), x1 = pl.X(i + 1.4), y0 = pl.Y(0), y1 = pl.Y(Math.max(-60, Math.min(60, q)));
        ctx.fillRect(x0, Math.min(y0, y1), x1 - x0, Math.abs(y1 - y0));
        EM.text(ctx, n, (x0 + x1) / 2, pl.Y(-58), { size: 11, align: 'center', color: '--ink-2' });
      });
      pl.hline(0, { color: '--ink-2', dash: [] });
      /* termómetro */
      const tx = cv.w * 0.75, top = 30, bot = cv.h - 40, Y = (T) => bot - ((bot - top) * (T + 20)) / 320;
      ctx.fillStyle = EM.alpha('--ink-3', 0.15); ctx.fillRect(tx - 8, top, 16, bot - top);
      ctx.fillStyle = EM.col('--accent'); ctx.fillRect(tx - 6, Y(Tf), 12, bot - Y(Tf)); ctx.beginPath(); ctx.arc(tx, bot + 10, 14, 0, 7); ctx.fill();
      for (let T = 0; T <= 300; T += 50) EM.text(ctx, T + ' °C', tx + 14, Y(T) + 4, { size: 10, mono: true, color: '--ink-3' });
      sim.set('Tf', EM.fix(Tf, 2) + ' °C');
      sim.set('ice', iceLeft > 1e-6 ? EM.fix(iceLeft * 1000, 1) + ' g' + (frozenWater > 0 ? ' (se congela agua)' : '') : 'ninguno');
      sim.set('bal', 'suma = ' + EM.fix(sum, 3) + ' kJ');
    });
  });

  /* 5.4 Curva de calentamiento */
  EM.defineSim('curva-calentamiento', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });
    sim.slider('z', { label: 'Altitud', min: 0, max: 5000, step: 10, value: 1760, unit: 'm', fmt: (v) => v.toFixed(0) });
    sim.slider('Pw', { label: 'Potencia del fogón', min: 500, max: 5000, step: 50, value: 2000, unit: 'W', fmt: (v) => v.toFixed(0) });
    sim.slider('m', { label: 'Masa', min: 0.1, max: 3, step: 0.05, value: 1, unit: 'kg', fmt: (v) => v.toFixed(2) });
    sim.out('Tb', 'Ebullición', { hl: true });
    sim.out('Q', 'Energía por etapa (kJ)');
    sim.out('t', 'Tiempo total');
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx;
      EM.draw.clear(cv);
      const P = TH.isa(p.z).P, Tb = TH.agua.Tsat(P) - 273.15, hfg = TH.agua.sat(Tb + 273.15).hfg / 1e3;
      const Q = [2.09 * 20, 333.6, 4.18 * Tb, hfg, 2.0 * (120 - Tb)].map((q) => q * p.m);
      const pts = [[0, -20]]; let acc = 0;
      const temps = [[-20, 0], [0, 0], [0, Tb], [Tb, Tb], [Tb, 120]];
      Q.forEach((q, i) => { acc += q; pts.push([acc / p.Pw * 1000 / 60, temps[i][1]]); });
      const tmax = acc / p.Pw * 1000 / 60;
      const pl = new EM.Plot(ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: 0, xmax: tmax * 1.03, ymin: -30, ymax: 130, xlabel: 'tiempo (min)', ylabel: 'T (°C)' });
      pl.frame();
      pl.path(pts, { color: '--accent', width: 2.8 });
      const lbl = ['hielo', 'fusión', 'agua líquida', 'ebullición', 'vapor'];
      for (let i = 0; i < 5; i++) { const xm = (pts[i][0] + pts[i + 1][0]) / 2, ym = (pts[i][1] + pts[i + 1][1]) / 2; pl.label(xm, ym, lbl[i], { dy: -10, size: 11, align: 'center', color: '--ink-2' }); }
      pl.hline(Tb, { color: '--c1', label: 'T_{eb} = ' + EM.fix(Tb, 1) + ' °C' });
      sim.set('Tb', EM.fix(Tb, 2) + ' °C a ' + EM.fix(P / 1e3, 1) + ' kPa');
      sim.set('Q', Q.map((q) => q.toFixed(0)).join(' · ') + ' (total ' + acc.toFixed(0) + ')');
      sim.set('t', EM.fix(tmax, 1) + ' min, ' + EM.fix((100 * Q[3]) / acc, 1) + ' % en evaporar');
    });
  });
})();

/* Capítulo 6 — Primera ley en sistemas cerrados */
(function () {
  'use strict';
  const EM = window.EM, TH = EM.th, D = EM.diag;

  /* 6.1 Ciclo rectangular */
  EM.defineSim('ciclo-primera-ley', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });
    sim.slider('PL', { label: 'Presión baja', min: 50, max: 400, step: 5, value: 100, unit: 'kPa', fmt: (v) => v.toFixed(0) });
    sim.slider('PH', { label: 'Presión alta', min: 100, max: 1000, step: 5, value: 400, unit: 'kPa', fmt: (v) => v.toFixed(0) });
    sim.slider('V1', { label: 'Volumen menor', min: 0.05, max: 0.5, step: 0.01, value: 0.1, unit: 'm³', fmt: (v) => v.toFixed(2) });
    sim.slider('V2', { label: 'Volumen mayor', min: 0.1, max: 1, step: 0.01, value: 0.4, unit: 'm³', fmt: (v) => v.toFixed(2) });
    sim.seg('dir', { label: 'Sentido', options: [['cw', 'Horario (motor)'], ['ccw', 'Antihorario (refrigerador)']], value: 'cw' });
    sim.out('W', 'Trabajo neto', { hl: true });
    sim.out('Qin', 'Calor recibido · calor cedido');
    sim.out('eta', 'Fracción del calor recibido convertida en trabajo');
    let s = 0;
    sim.animate((dt) => { s = (s + dt * 0.15) % 1; });
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, Wc = cv.w, H = cv.h;
      EM.draw.clear(cv);
      const PL = Math.min(p.PL, p.PH - 5), PH = p.PH, V1 = Math.min(p.V1, p.V2 - 0.01), V2 = p.V2, f = 2.5; /* c_v/R diatómico */
      let corners = [[V1, PL], [V1, PH], [V2, PH], [V2, PL]];
      if (p.dir === 'ccw') corners = [[V1, PL], [V2, PL], [V2, PH], [V1, PH]];
      const legs = [];
      for (let i = 0; i < 4; i++) {
        const [Va, Pa] = corners[i], [Vb, Pb] = corners[(i + 1) % 4];
        const W = Pa === Pb ? Pa * (Vb - Va) : 0, dU = f * (Pb * Vb - Pa * Va);
        legs.push({ W, dU, Q: dU + W, name: (Va === Vb ? 'isocórico' : 'isobárico') + (Va === Vb ? (Pb > Pa ? ' ↑' : ' ↓') : Vb > Va ? ' →' : ' ←') });
      }
      const pw = Wc * 0.55;
      const pl = new EM.Plot(ctx, { x: 0, y: 0, w: pw, h: H, xmin: 0, xmax: 1.05, ymin: 0, ymax: 1050, xlabel: 'V (m³)', ylabel: 'P (kPa)' });
      pl.frame();
      ctx.fillStyle = EM.alpha(p.dir === 'cw' ? '--accent' : '--c1', 0.15);
      ctx.fillRect(pl.X(V1), pl.Y(PH), pl.X(V2) - pl.X(V1), pl.Y(PL) - pl.Y(PH));
      const path = corners.concat([corners[0]]);
      pl.path(path, { color: p.dir === 'cw' ? '--accent' : '--c1', width: 2.6 });
      corners.forEach(([V, P], i) => pl.dot(V, P, { color: '--ink', r: 3.5, label: String(i + 1) }));
      /* punto móvil */
      const k = Math.floor(s * 4), t = s * 4 - k, [Va, Pa] = corners[k], [Vb, Pb] = corners[(k + 1) % 4];
      pl.dot(Va + (Vb - Va) * t, Pa + (Pb - Pa) * t, { color: '--c3', r: 6 });
      /* tabla */
      const x0 = pw + 10, cols = [x0, x0 + 96, x0 + 150, x0 + 204];
      const y0 = 30;
      ['tramo', 'Q (kJ)', 'W (kJ)', 'ΔU (kJ)'].forEach((h, i) => EM.text(ctx, h, cols[i] + (i ? 48 : 0), y0, { size: 11.5, color: '--ink-2', align: i ? 'right' : 'left' }));
      let sQ = 0, sW = 0, sU = 0, Qin = 0, Qout = 0;
      legs.forEach((L, i) => {
        const y = y0 + 24 * (i + 1);
        EM.text(ctx, i + 1 + '→' + (((i + 1) % 4) + 1) + ' ' + L.name, cols[0], y, { size: 10.5, color: '--ink' });
        [L.Q, L.W, L.dU].forEach((v, j) => EM.text(ctx, EM.fix(v, 1), cols[j + 1] + 48, y, { size: 10.5, mono: true, align: 'right', color: v > 0 ? '--c2' : v < 0 ? '--c1' : '--ink-3' }));
        sQ += L.Q; sW += L.W; sU += L.dU; if (L.Q > 0) Qin += L.Q; else Qout -= L.Q;
      });
      const y = y0 + 24 * 5 + 4;
      ctx.fillStyle = EM.col('--rule'); ctx.fillRect(cols[0], y - 16, 252, 1);
      EM.text(ctx, 'ciclo', cols[0], y, { size: 11.5, color: '--ink' });
      [sQ, sW, sU].forEach((v, j) => EM.text(ctx, EM.fix(Math.abs(v) < 1e-9 ? 0 : v, 1), cols[j + 1] + 48, y, { size: 11.5, mono: true, align: 'right', color: '--ink' }));
      EM.text(ctx, 'gas ideal diatómico, c_v = 5R/2', cols[0], y + 28, { size: 10.5, color: '--ink-3' });
      sim.set('W', EM.fix(sW, 2) + ' kJ' + (sW > 0 ? ' entregado' : ' recibido'));

      sim.set('eta', p.dir === 'cw' ? EM.fix((100 * sW) / Qin, 1) + ' %' : 'COP de refrigeración = ' + EM.fix(legs.filter((L) => L.Q > 0).reduce((a, L) => a + L.Q, 0) / -sW, 2));
    });
