<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Termodinámica</title>
<meta name="author" content="Mg. Manuel Alejandro Obando — Departamento de Física, Universidad del Cauca">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&display=swap">
<style>
/* ===================================================================
   Vibraciones y Ondas — hoja de estilos
   Paleta: papel milimetrado frío, tinta azul marino, acento ciruela.
   =================================================================== */
:root {
  --bg: #EEF1F5;
  --surface: #FFFFFF;
  --surface-2: #E6EBF1;
  --surface-3: #D9E0E8;
  --ink: #131D2A;
  --ink-2: #405066;
  --ink-3: #6A7A8E;
  --rule: #D2D9E2;
  --rule-strong: #AFBBC9;
  --accent: #B3123F;
  --accent-2: #D63A5E;
  --accent-ink: #FFFFFF;
  --accent-soft: #FBE3E9;
  --focus: #1D5FD1;
  --shadow: 0 1px 2px rgba(19, 29, 42, .06), 0 8px 24px -12px rgba(19, 29, 42, .18);

  /* Colores físicos (convención de libro de texto) */
  --pos: #D0342C;
  --neg: #1D5FD1;
  --fline: #22303F;
  --bline: #0A7C70;
  --equip: #2A9255;
  --cur: #7A44C9;
  --efield: #C2561A;
  --bfield: #0A7C70;
  --c1: #1D5FD1;
  --c2: #D0342C;
  --c3: #0A8A67;
  --c4: #B0601F;
  --c5: #7A44C9;
  --c6: #5F6B7A;
  --gold: #B8860B;

  /* Lienzo (papel milimetrado) */
  --canvas: #FBFCFD;
  --grid: #E7ECF2;
  --grid-2: #D0D9E4;
  --axis: #56657A;
  --surf-a: #4F83D9;
  --surf-b: #D98A4F;
  --surf-c: #43A37A;

  /* Recuadros */
  --def-bg: #EAF0FA;
  --def-ink: #1B4FA8;
  --law-bg: #F7EBE1;
  --law-ink: #8E4312;
  --ex-bg: #E8F4EE;
  --ex-ink: #0B6E53;
  --warn-bg: #FBEBEA;
  --warn-ink: #A8281F;
  --note-bg: #EDF0F4;
  --note-ink: #4E5D70;

  --font-ui: "Archivo", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-text: "Source Serif 4", "Iowan Old Style", Georgia, Cambria, serif;
  --font-mono: "JetBrains Mono", "Cascadia Mono", Consolas, Menlo, monospace;

  --sidebar-w: 300px;
  --topbar-h: 56px;
  --prose: 46rem;
  --wide: 72rem;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0C1117;
    --surface: #131A23;
    --surface-2: #1A232E;
    --surface-3: #243040;
    --ink: #E4EAF2;
    --ink-2: #A8B5C5;
    --ink-3: #758499;
    --rule: #26313E;
    --rule-strong: #3A4757;
    --accent: #FF7D99;
    --accent-2: #FFA3B6;
    --accent-ink: #24030B;
    --accent-soft: #3D1520;
    --focus: #6FA3FF;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px -14px rgba(0, 0, 0, .6);
    --pos: #FF6A5C;
    --neg: #5C9DFF;
    --fline: #CBD5E1;
    --bline: #3FD0C0;
    --equip: #5ED08E;
    --cur: #B28CFF;
    --efield: #FF9A5C;
    --bfield: #3FD0C0;
    --c1: #5C9DFF;
    --c2: #FF6A5C;
    --c3: #3ED3A0;
    --c4: #F0A36B;
    --c5: #B28CFF;
    --c6: #9AA7B8;
    --gold: #E6C35C;
    --canvas: #0F151D;
    --grid: #18212B;
    --grid-2: #243140;
    --axis: #8C9AAD;
    --surf-a: #4C7FD6;
    --surf-b: #D6884D;
    --surf-c: #3E9E76;
    --def-bg: #142034;
    --def-ink: #8DB6FF;
    --law-bg: #2A1C12;
    --law-ink: #F2AE7C;
    --ex-bg: #10271F;
    --ex-ink: #6FE0B5;
    --warn-bg: #2E1614;
    --warn-ink: #FF8F84;
    --note-bg: #19212B;
    --note-ink: #A8B5C5;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0C1117;
  --surface: #131A23;
  --surface-2: #1A232E;
  --surface-3: #243040;
  --ink: #E4EAF2;
  --ink-2: #A8B5C5;
  --ink-3: #758499;
  --rule: #26313E;
  --rule-strong: #3A4757;
  --accent: #FF7D99;
  --accent-2: #FFA3B6;
  --accent-ink: #24030B;
  --accent-soft: #3D1520;
  --focus: #6FA3FF;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px -14px rgba(0, 0, 0, .6);
  --pos: #FF6A5C;
  --neg: #5C9DFF;
  --fline: #CBD5E1;
  --bline: #3FD0C0;
  --equip: #5ED08E;
  --cur: #B28CFF;
  --efield: #FF9A5C;
  --bfield: #3FD0C0;
  --c1: #5C9DFF;
  --c2: #FF6A5C;
  --c3: #3ED3A0;
  --c4: #F0A36B;
  --c5: #B28CFF;
  --c6: #9AA7B8;
  --gold: #E6C35C;
  --canvas: #0F151D;
  --grid: #18212B;
  --grid-2: #243140;
  --axis: #8C9AAD;
  --surf-a: #4C7FD6;
  --surf-b: #D6884D;
  --surf-c: #3E9E76;
  --def-bg: #142034;
  --def-ink: #8DB6FF;
  --law-bg: #2A1C12;
  --law-ink: #F2AE7C;
  --ex-bg: #10271F;
  --ex-ink: #6FE0B5;
  --warn-bg: #2E1614;
  --warn-ink: #FF8F84;
  --note-bg: #19212B;
  --note-ink: #A8B5C5;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: var(--accent); text-underline-offset: 2px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
::selection { background: var(--accent-soft); }

/* ---------- Estructura ---------- */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  min-height: 100%;
}
.sidebar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  height: 100vh;
  height: 100dvh;
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--surface);
  border-right: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
  z-index: 30;
}
.brand {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 18px 18px 14px;
  text-decoration: none;
  color: var(--ink);
}
.brand-mark { width: 38px; height: 38px; flex: none; }
.brand-name {
  font-weight: 800;
  font-stretch: 80%;
  font-size: 19px;
  line-height: 1.05;
  letter-spacing: .005em;
}
.brand-name small {
  display: block;
  font-weight: 500;
  font-stretch: 100%;
  font-size: 11.5px;
  color: var(--ink-3);
  letter-spacing: .02em;
  margin-top: 3px;
}
.search {
  position: relative;
  margin: 0 14px 10px;
}
.search input {
  width: 100%;
  padding: 8px 10px 8px 32px;
  border: 1px solid var(--rule);
  border-radius: 6px;
  background: var(--bg);
  font-size: 13.5px;
}
.search svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 15px;
  height: 15px;
  color: var(--ink-3);
  pointer-events: none;
}
.search-results {
  position: absolute;
  left: 0;
  right: 0;
  top: calc(100% + 4px);
  background: var(--surface);
  border: 1px solid var(--rule-strong);
  border-radius: 6px;
  box-shadow: var(--shadow);
  max-height: 60vh;
  overflow: auto;
  z-index: 50;
}
.search-results button {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  background: none;
  padding: 8px 12px;
  border-bottom: 1px solid var(--rule);
  cursor: pointer;
}
.search-results button:hover, .search-results button.sel { background: var(--surface-2); }
.search-results .sr-ch { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
.search-results .sr-t { font-weight: 600; font-size: 13.5px; }
.search-results .sr-s { font-size: 12.5px; color: var(--ink-2); font-family: var(--font-text); }
.search-results mark { background: var(--accent-soft); color: inherit; padding: 0 1px; }
.search-results .sr-none { padding: 12px; color: var(--ink-3); }

.toc { padding: 4px 0 24px; flex: 1; }
.toc-part {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
  padding: 16px 18px 6px;
}
.toc a {
  display: grid;
  grid-template-columns: 30px 1fr;
  align-items: baseline;
  padding: 5px 14px 5px 18px;
  color: var(--ink-2);
  text-decoration: none;
  font-size: 13.5px;
  line-height: 1.3;
  border-left: 3px solid transparent;
}
.toc a:hover { background: var(--surface-2); color: var(--ink); }
.toc a .n {
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.toc a.active {
  color: var(--ink);
  font-weight: 650;
  background: var(--surface-2);
  border-left-color: var(--accent);
}
.toc a.active .n { color: var(--accent); }
.toc .toc-secs { margin: 2px 0 6px; }
.toc .toc-secs a {
  font-size: 12.5px;
  padding: 3px 14px 3px 48px;
  grid-template-columns: 34px 1fr;
  border-left: 3px solid transparent;
  color: var(--ink-3);
  background: none;
  font-weight: 450;
}
.toc .toc-secs a:hover { color: var(--ink); }
.toc .toc-secs a.here { color: var(--accent); }
.toc .toc-secs a .n { font-size: 11px; }

.sidebar-foot {
  padding: 12px 18px 18px;
  border-top: 1px solid var(--rule);
  color: var(--ink-3);
  font-size: 12px;
}
.sidebar-foot .credit { color: var(--ink-2); margin-bottom: 8px; line-height: 1.45; }
.sidebar-foot .credit b { color: var(--ink); font-weight: 600; }
.site-foot { max-width: var(--wide); margin: 10px auto 0; padding: 18px 16px 28px; border-top: 1px solid var(--rule); color: var(--ink-3); font-size: 12.5px; text-align: center; line-height: 1.6; text-wrap: balance; }
.site-foot b { color: var(--ink-2); font-weight: 600; }
.chapter p.home-author, .home-author { margin: 18px 0 0; padding: 8px 0 8px 14px; border-left: 3px solid var(--accent); font-family: var(--font-ui); color: var(--ink-2); line-height: 1.35; }
.home-author small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 3px; }
.home-author b { display: block; font-size: 18px; font-weight: 700; color: var(--ink); }
.home-author span { display: block; font-size: 13.5px; color: var(--ink-3); margin-top: 2px; }

.mainwrap { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  gap: 12px;
  padding-inline: clamp(16px, 3vw, 36px);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule);
}
.topbar .crumb {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 13.5px;
  color: var(--ink-2);
}
.topbar .crumb b { color: var(--ink); font-weight: 650; }
.iconbtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 34px;
  min-width: 34px;
  padding: 0 10px;
  border: 1px solid var(--rule);
  background: var(--surface);
  border-radius: 6px;
  cursor: pointer;
  color: var(--ink-2);
  font-size: 13px;
}
.iconbtn:hover { color: var(--ink); border-color: var(--rule-strong); }
.iconbtn svg { width: 16px; height: 16px; }
.menu-btn { display: none; }
.progress {
  position: absolute;
  left: 0;
  bottom: -1px;
  height: 2px;
  background: var(--accent);
  width: 0;
  transition: width .15s linear;
}

main#main {
  padding-inline: clamp(16px, 4vw, 56px);
  padding-block: 28px 80px;
  min-width: 0;
}

/* ---------- Capítulo ---------- */
.chapter { max-width: var(--wide); margin: 0 auto; }
.chapter[hidden] { display: none !important; }
.ch-head {
  padding-block: 18px 26px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 26px;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  column-gap: 28px;
  align-items: end;
}
.ch-num {
  font-family: var(--font-ui);
  font-weight: 800;
  font-stretch: 62%;
  font-size: clamp(64px, 9vw, 116px);
  line-height: .8;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.02em;
}
.ch-part {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 8px;
}
.ch-title {
  font-weight: 750;
  font-stretch: 85%;
  font-size: clamp(30px, 4.2vw, 50px);
  line-height: 1.02;
  margin: 0;
  text-wrap: balance;
  letter-spacing: -.01em;
}
.ch-lead {
  grid-column: 1 / -1;
  font-family: var(--font-text);
  font-size: 19px;
  line-height: 1.55;
  color: var(--ink-2);
  max-width: var(--prose);
  margin: 22px 0 0;
}
.ch-contents {
  grid-column: 1 / -1;
  margin-top: 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 8px;
}
.ch-contents a {
  font-size: 12.5px;
  text-decoration: none;
  color: var(--ink-2);
  border: 1px solid var(--rule);
  background: var(--surface);
  border-radius: 999px;
  padding: 3px 11px;
}
.ch-contents a:hover { border-color: var(--accent); color: var(--accent); }
.ch-contents a .n { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); margin-right: 5px; }
.ch-contents a.simlink { border-style: dashed; }

/* Prosa (teoría) */
.chapter section { margin-bottom: 44px; scroll-margin-top: calc(var(--topbar-h) + 12px); }
.chapter h2 {
  font-weight: 720;
  font-stretch: 88%;
  font-size: 28px;
  line-height: 1.12;
  margin: 8px 0 14px;
  text-wrap: balance;
  max-width: var(--prose);
  scroll-margin-top: calc(var(--topbar-h) + 12px);
}
.chapter h2 .n {
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: 15px;
  color: var(--accent);
  margin-right: 12px;
  vertical-align: 4px;
  font-stretch: 100%;
}
.chapter h3 {
  font-weight: 680;
  font-stretch: 92%;
  font-size: 20px;
  margin: 28px 0 8px;
  max-width: var(--prose);
  scroll-margin-top: calc(var(--topbar-h) + 12px);
}
.chapter h4 { font-size: 15.5px; font-weight: 680; margin: 18px 0 6px; }
.chapter p, .chapter li, .chapter dd, .chapter td, .chapter th, .chapter figcaption, .chapter summary {
  font-family: var(--font-text);
}
.chapter p, .chapter > section > ul, .chapter > section > ol, .chapter section > .box, .chapter section > details, .chapter section > .eq, .chapter section > .tablewrap.narrow, .chapter section > dl {
  max-width: var(--prose);
}
.chapter p, .chapter li { font-size: 17.5px; line-height: 1.62; }
.chapter p { margin: 0 0 14px; }
.chapter ul, .chapter ol { padding-left: 1.4em; margin: 0 0 14px; }
.chapter li { margin-bottom: 5px; }
.chapter li::marker { color: var(--ink-3); }
.chapter strong { font-weight: 650; }
.chapter em { font-style: italic; }
.chapter .term { font-style: italic; color: var(--ink); background: linear-gradient(transparent 62%, var(--accent-soft) 62%); }
.chapter code { font-family: var(--font-mono); font-size: .86em; background: var(--surface-2); padding: 1px 4px; border-radius: 3px; }

/* Ecuaciones */
mjx-container { color: inherit; }
mjx-container[display="true"] {
  overflow-x: auto;
  overflow-y: hidden;
  max-width: 100%;
  padding: 3px 0;
  margin: 12px 0 !important;
}
mjx-container[jax="SVG"] > svg { overflow: visible; }
.eq {
  position: relative;
  margin: 14px 0 18px;
}
.eq.key {
  border: 1px solid var(--rule-strong);
  background: var(--surface);
  padding: 4px 18px;
  border-radius: 4px;
}
.eq.key::after {
  content: attr(data-name);
  position: absolute;
  top: -9px;
  left: 14px;
  background: var(--bg);
  padding: 0 6px;
  font-family: var(--font-ui);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--accent);
}
.eq.key:not([data-name])::after { display: none; }

/* Recuadros */
.box {
  position: relative;
  margin: 22px 0 22px;
  padding: 16px 20px 6px;
  border-radius: 3px;
  border: 1px solid transparent;
}
.box::before {
  display: inline-block;
  font-family: var(--font-ui);
  font-size: 10.5px;
  font-weight: 750;
  letter-spacing: .13em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.box > h4 {
  margin: 0 0 8px;
  font-size: 16px;
  font-weight: 700;
  font-family: var(--font-ui);
}
.box p, .box li { font-size: 16.5px; }
.box.def { background: var(--def-bg); border-color: color-mix(in srgb, var(--def-ink) 30%, transparent); }
.box.def::before { content: "Definición"; color: var(--def-ink); }
.box.law { background: var(--law-bg); border-color: color-mix(in srgb, var(--law-ink) 30%, transparent); }
.box.law::before { content: "Resultado clave"; color: var(--law-ink); }
.box.ex { background: var(--ex-bg); border-color: color-mix(in srgb, var(--ex-ink) 30%, transparent); }
.box.ex::before { content: attr(data-label); color: var(--ex-ink); }
.box.warn { background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn-ink) 30%, transparent); }
.box.warn::before { content: "Cuidado"; color: var(--warn-ink); }
.box.note { background: var(--note-bg); border-color: var(--rule); }
.box.note::before { content: "Nota"; color: var(--note-ink); }
.box.hist { background: var(--note-bg); border-color: var(--rule); }
.box.hist::before { content: "Contexto histórico"; color: var(--note-ink); }
.box > h4 + * { margin-top: 0; }
.box details { margin: 4px 0 12px; }
.box summary, .problems summary {
  cursor: pointer;
  font-family: var(--font-ui);
  font-weight: 650;
  font-size: 13.5px;
  color: var(--ex-ink);
  list-style: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border: 1px solid color-mix(in srgb, var(--ex-ink) 40%, transparent);
  border-radius: 999px;
  background: var(--surface);
}
.box summary::-webkit-details-marker, .problems summary::-webkit-details-marker { display: none; }
.box summary::before, .problems summary::before { content: "▸"; transition: transform .15s; }
details[open] > summary::before { transform: rotate(90deg); }
.box details[open] > summary { margin-bottom: 10px; }

/* Tablas */
.tablewrap { overflow-x: auto; margin: 16px 0 22px; }
.chapter table {
  border-collapse: collapse;
  width: 100%;
  font-size: 15px;
  background: var(--surface);
}
.chapter th, .chapter td {
  border: 1px solid var(--rule);
  padding: 7px 10px;
  text-align: left;
  vertical-align: middle;
}
.chapter th {
  font-family: var(--font-ui);
  font-weight: 650;
  font-size: 13px;
  background: var(--surface-2);
  color: var(--ink);
}
.chapter td.c, .chapter th.c { text-align: center; }
.chapter td.num { font-family: var(--font-mono); font-size: 13.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Problemas */
.problems { counter-reset: prob; list-style: none; padding-left: 0 !important; max-width: var(--prose); }
.problems > li {
  counter-increment: prob;
  position: relative;
  padding: 12px 0 12px 44px;
  border-top: 1px solid var(--rule);
}
.problems > li::before {
  content: counter(prob);
  position: absolute;
  left: 0;
  top: 12px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--surface-2);
  font-family: var(--font-mono);
  font-size: 13px;
  display: grid;
  place-items: center;
  color: var(--ink-2);
}
.problems details { margin-top: 8px; }
.problems details[open] > summary { margin-bottom: 8px; }
.problems .lvl {
  font-family: var(--font-ui);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-right: 6px;
}

/* Figura estática */
figure.fig { margin: 18px 0 24px; max-width: var(--prose); }
figure.fig svg { width: 100%; height: auto; display: block; }
figure.fig figcaption { font-size: 14.5px; color: var(--ink-2); margin-top: 6px; }

/* ---------- Simulaciones ---------- */
.sim {
  margin: 26px 0 30px;
  border: 1px solid var(--rule-strong);
  background: var(--surface);
  border-radius: 6px;
  box-shadow: var(--shadow);
  overflow: hidden;
  scroll-margin-top: calc(var(--topbar-h) + 12px);
}
.sim-head {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 14px 10px 16px;
  border-bottom: 1px solid var(--rule);
  flex-wrap: wrap;
}
.sim-num {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--accent);
  white-space: nowrap;
}
.sim-title { margin: 0; font-size: 16px; font-weight: 700; flex: 1; min-width: 12ch; font-stretch: 95%; }
.sim-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 11px;
  border-radius: 5px;
  border: 1px solid var(--rule-strong);
  background: var(--surface);
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  color: var(--ink);
  white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
.btn svg { width: 13px; height: 13px; }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.sim-body {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
}
.sim-body.below { grid-template-columns: minmax(0, 1fr); }
.sim-body.below .sim-side { border-left: 0; border-top: 1px solid var(--rule); display: grid; grid-template-columns: minmax(0, 2fr) minmax(230px, 1fr); gap: 0 26px; align-items: start; }
.sim-body.below .sim-ctrls { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 24px; align-items: start; }
.sim-body.below .ctrl-group + .ctrl-group { border-top: 0; padding-top: 0; }
.sim-body.below .sim-out { border-top: 0; padding-top: 0; }
@media (max-width: 820px) { .sim-body.below .sim-side { grid-template-columns: minmax(0, 1fr); } .sim-body.below .sim-out { border-top: 1px solid var(--rule); padding-top: 10px; } }
.sim-stagecol { min-width: 0; display: flex; flex-direction: column; background: var(--canvas); }
.sim-stage {
  position: relative;
  background: var(--canvas);
  min-width: 0;
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
}
.sim-stage.cols2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-content: start; flex: 0 0 auto; }
.sim-stage.cols2 > .full { grid-column: 1 / -1; }
.sim-canvas {
  position: relative;
  width: 100%;
  background: var(--canvas);
  max-height: 80vh;
  min-height: 160px;
  flex: 1 0 auto;
}
.sim-canvas.fixed { flex: 0 0 auto; }
.sim-canvas canvas { display: block; position: absolute; inset: 0; }
.sim-canvas + .sim-canvas { border-top: 1px solid var(--rule); }
.sim-stage.cols2 > .sim-canvas + .sim-canvas { border-top: 0; border-left: 1px solid var(--rule); }
.sim-stage.cols2 > .sim-canvas.full { border-top: 1px solid var(--rule); border-left: 0; }
.sim-hint {
  position: absolute;
  left: 10px;
  top: 8px;
  font-size: 11.5px;
  color: var(--ink-3);
  background: color-mix(in srgb, var(--canvas) 80%, transparent);
  padding: 2px 7px;
  border-radius: 4px;
  pointer-events: none;
}
.v3d-tools {
  position: absolute;
  right: 8px;
  top: 8px;
  display: flex;
  gap: 4px;
}
.v3d-tools button {
  width: 28px;
  height: 28px;
  border-radius: 5px;
  border: 1px solid var(--rule);
  background: color-mix(in srgb, var(--surface) 85%, transparent);
  cursor: pointer;
  display: grid;
  place-items: center;
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1;
  padding: 0;
}
.v3d-tools button:hover { color: var(--accent); border-color: var(--accent); }
.sim-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  padding: 8px 14px;
  background: var(--surface);
  border-top: 1px solid var(--rule);
  font-size: 12.5px;
  color: var(--ink-2);
}
.sim-legend > span { display: inline-flex; align-items: center; gap: 6px; }
.sim-legend .sw { display: inline-block; width: 18px; height: 0; border-top: 2.5px solid currentColor; flex: none; }
.sim-legend .sw.dash { border-top-style: dashed; }
.sim-legend .sw.dot { width: 10px; height: 10px; border-radius: 50%; border: 0; background: currentColor; }
.sim-legend .sw.sq { width: 12px; height: 12px; border: 0; background: currentColor; opacity: .75; border-radius: 2px; }
.sim-legend i { font-family: var(--font-text); }

.sim-side {
  border-left: 1px solid var(--rule);
  padding: 12px 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
  background: var(--surface);
}
.sim-ctrls { display: flex; flex-direction: column; gap: 10px; }
.ctrl-group {
  border: 0;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 9px;
  min-width: 0;
}
.ctrl-group + .ctrl-group { border-top: 1px dashed var(--rule); padding-top: 10px; }
.ctrl-group legend {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-3);
  padding: 0;
  margin-bottom: 6px;
  float: left;
  width: 100%;
}
.ctrl-group legend + * { clear: both; }
.ctrl { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.ctrl-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.ctrl label { font-size: 13px; color: var(--ink-2); }
.ctrl label i, .sim-out dt i { font-family: var(--font-text); font-size: 1.07em; }
.ctrl-val {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.ctrl input[type="range"] {
  width: 100%;
  accent-color: var(--accent);
  margin: 2px 0 0;
  height: 20px;
}
.ctrl select {
  width: 100%;
  padding: 6px 8px;
  border: 1px solid var(--rule-strong);
  border-radius: 5px;
  background: var(--surface);
  font-size: 13px;
}
.ctrl.check { flex-direction: row; align-items: center; gap: 8px; }
.ctrl.check input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.ctrl.check label { cursor: pointer; }
.seg { display: flex; border: 1px solid var(--rule-strong); border-radius: 5px; overflow: hidden; }
.seg button {
  flex: 1;
  border: 0;
  background: var(--surface);
  padding: 5px 4px;
  font-size: 12.5px;
  cursor: pointer;
  color: var(--ink-2);
  border-right: 1px solid var(--rule);
  min-width: 0;
}
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 650; }
.ctrl-row { display: flex; gap: 6px; flex-wrap: wrap; }
.ctrl .num-in {
  width: 100%;
  padding: 5px 8px;
  border: 1px solid var(--rule-strong);
  border-radius: 5px;
  background: var(--surface);
  font-family: var(--font-mono);
  font-size: 12.5px;
}
.ctrl-note { font-size: 12px; color: var(--ink-3); line-height: 1.45; }
.sim-out {
  margin: 0;
  display: grid;
  grid-template-columns: minmax(45%, 1fr) minmax(0, auto);
  gap: 3px 10px;
  font-size: 12.5px;
  border-top: 1px solid var(--rule);
  padding-top: 10px;
}
.sim-out:empty { display: none; }
.sim-out dt { color: var(--ink-2); }
.sim-out dd {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 12px;
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  overflow-wrap: anywhere;
}
.sim-out dd.hl { color: var(--accent); font-weight: 600; }
.sim-out .sep { grid-column: 1 / -1; height: 1px; background: var(--rule); margin: 3px 0; }
.sim-out .sub { grid-column: 1 / -1; font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-top: 4px; }
.sim-error {
  padding: 14px;
  color: var(--warn-ink);
  background: var(--warn-bg);
  font-size: 13px;
}
.sim-guide {
  max-width: var(--prose);
  margin: -14px 0 28px;
  padding: 12px 16px;
  border: 1px dashed var(--rule-strong);
  border-radius: 4px;
  background: var(--surface);
}
.sim-guide::before {
  content: "Guía de exploración";
  display: block;
  font-size: 10.5px;
  font-weight: 750;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 4px;
}
.sim-guide ul, .sim-guide ol { margin: 0; }
.sim-guide li, .sim-guide p { font-size: 15.5px; }
.sim-guide p:last-child { margin-bottom: 0; }

/* ---------- Navegación entre capítulos ---------- */
.ch-nav {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 50px;
  padding-top: 20px;
  border-top: 1px solid var(--rule);
}
.ch-nav a {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 14px 16px;
  border: 1px solid var(--rule);
  border-radius: 6px;
  background: var(--surface);
  text-decoration: none;
  color: var(--ink);
}
.ch-nav a:hover { border-color: var(--accent); }
.ch-nav a small { color: var(--ink-3); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; }
.ch-nav a span { font-weight: 650; font-size: 15px; }
.ch-nav a.next { text-align: right; grid-column: 2; }

/* ---------- Portada ---------- */
.home-hero {
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
  gap: 32px;
  align-items: stretch;
  padding-block: 10px 34px;
  border-bottom: 1px solid var(--rule);
}
.home-kicker {

}

}
.home-title span { display: block; color: var(--ink-3); font-weight: 300; font-stretch: 100%; font-size: .36em; letter-spacing: 0; margin-top: 10px; line-height: 1.1; }

}

}

}
@media (max-width: 820px) {
  .sim-body { grid-template-columns: minmax(0, 1fr); }

@media (prefers-reduced-motion: reduce) {

}

/* Matriz numérica dentro de una simulación */
.sim-mat { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-2); }

<template class="chapter-src" data-id="inicio" data-num="0" data-title="Portada">
<div class="home-hero">
  <div>
    <div class="home-kicker">Curso interactivo · Física e ingeniería térmica</div>

<template class="chapter-src" data-id="temperatura" data-num="1" data-title="Sistemas, equilibrio y temperatura" data-part="Parte I · Fundamentos" data-short="Sistemas y fronteras, propiedades y estados, equilibrio, ley cero, termómetro de gas ideal, escalas de temperatura, ITS-90 y sensores reales: termistores y termopares">
<p class="lead">La termodinámica describe sistemas de miles de trillones de partículas con un puñado de números: presión, volumen, temperatura. Que eso funcione no es obvio; descansa en la idea de equilibrio y en un principio tan básico que se formuló de último y se le llamó «ley cero». Este capítulo fija el vocabulario del curso y construye la temperatura desde cero, hasta los sensores que se usan en el laboratorio.</p>

<section>
<h2>Sistema, frontera y alrededores</h2>
<p>Un <span class="term">sistema</span> es la porción del universo que elegimos estudiar; lo separa de los <span class="term">alrededores</span> una <span class="term">frontera</span>, real o imaginaria, fija o móvil. Según lo que la frontera deja pasar, el sistema es:</p>
<ul>
<li><b>aislado</b>: no intercambia ni materia ni energía (un termo ideal);</li>
<li><b>cerrado</b> o <b>masa de control</b>: intercambia energía pero no materia (el gas en un cilindro con pistón);</li>
<li><b>abierto</b> o <b>volumen de control</b>: lo atraviesa materia (una turbina, una tobera, el cuerpo humano).</li>
</ul>
<p>Una pared <span class="term">adiabática</span> impide el paso de calor; una <span class="term">diatérmica</span> lo permite. La elección del sistema es la primera decisión de cualquier problema y la que más errores evita: el mismo fenómeno se describe con calor en una elección y con trabajo en otra.</p>
<h3>Propiedades y estado</h3>
<p>Una <span class="term">propiedad</span> es cualquier magnitud medible del sistema en un instante: \(P\), \(V\), \(T\), la masa, la energía interna. Las propiedades <span class="term">extensivas</span> son proporcionales a la cantidad de materia (\(V\), \(U\), \(S\)); las <span class="term">intensivas</span>, no (\(P\), \(T\), \(\rho\)). El cociente de una extensiva entre la masa es una propiedad <span class="term">específica</span>, que se escribe en minúscula: \(v=V/m\), \(u=U/m\).</p>
<p>El <span class="term">estado</span> es el conjunto de valores de todas las propiedades. Para una sustancia pura simple compresible, el <b>postulado de estado</b> dice que dos propiedades intensivas independientes bastan para fijar todas las demás. Una relación entre ellas, como \(Pv=RT\), es una <span class="term">ecuación de estado</span>.</p>
<p>Las propiedades solo están bien definidas en <span class="term">equilibrio</span>: cuando no hay gradientes que impulsen cambios (equilibrio mecánico, térmico, de fases y químico). Un <span class="term">proceso cuasiestático</span> pasa por una sucesión de estados de equilibrio, lo bastante lento para que el sistema se reacomode en cada paso; solo esos procesos se dibujan como curvas en un diagrama \(P\)–\(v\).</p>
</section>

<section>
<h2>La ley cero y la temperatura</h2>
<p>Si dos cuerpos se ponen en contacto a través de una pared diatérmica, sus propiedades cambian hasta que dejan de hacerlo: alcanzan el <span class="term">equilibrio térmico</span>. La experiencia muestra algo que no se deduce de nada más:</p>
<div class="eq key" data-name="Ley cero">\[\text{Si }A\sim C\ \text{y}\ B\sim C\ \Longrightarrow\ A\sim B.\]</div>
<p>Dos sistemas en equilibrio térmico con un tercero lo están entre sí. La relación «estar en equilibrio térmico» es transitiva, y por eso existe una propiedad que toma el mismo valor en todos los sistemas mutuamente en equilibrio: la <span class="term">temperatura</span>. El tercer sistema \(C\) es el termómetro. Fowler la bautizó «ley cero» en 1939, cuando la primera y la segunda ya tenían nombre.</p>
<p>La rapidez con que dos cuerpos llegan al equilibrio depende de sus capacidades caloríficas \(C_1,C_2\) y de la conductancia \(G\) del contacto. Si \(G\) es constante, la diferencia de temperaturas decae exponencialmente:</p>
<div class="eq">\[T_1-T_2=(T_{1,0}-T_{2,0})\,\ee^{-t/\tau},\qquad \tau=\frac{C_1C_2}{G\,(C_1+C_2)},\qquad T_f=\frac{C_1T_{1,0}+C_2T_{2,0}}{C_1+C_2}.\]</div>
<div class="sim" data-sim="contacto-termico" data-title="Dos cuerpos en contacto: la llegada al equilibrio"></div>
<div class="sim-guide"><ul>
<li>La temperatura final es la media ponderada por las capacidades caloríficas: un termómetro pequeño (\(C\) baja) casi no perturba al sistema que mide.</li>
<li>Duplique la conductancia: \(\tau\) se reduce a la mitad, pero la temperatura final no cambia. El equilibrio no depende del camino.</li>
<li>Con un termómetro de \(C\) comparable a la del sistema, la lectura se aleja de la temperatura original: es el error de inserción.</li>
</ul></div>
</section>

<section>
<h2>El termómetro de gas ideal</h2>
<p>Cualquier propiedad que varíe con la temperatura sirve de termómetro (la longitud de una columna de mercurio, la resistencia de un hilo de platino), pero cada una define su propia escala, y las escalas no coinciden entre los puntos de calibración. Hace falta un termómetro cuya lectura no dependa de la sustancia.</p>
<p>El <span class="term">termómetro de gas a volumen constante</span> lo logra. Se llena un bulbo con un gas, se mide su presión \(P_{tp}\) en el punto triple del agua y su presión \(P\) en el sistema, y se define</p>
<div class="eq key" data-name="Temperatura del gas ideal">\[T=273.16\ \text{K}\times\lim_{P_{tp}\to0}\frac{P}{P_{tp}}.\]</div>
<p>A presión finita, cada gas da una lectura distinta porque sus moléculas interactúan; su ecuación de estado es \(Pv=RT\,(1+B(T)/v+\dots)\), con un <span class="term">segundo coeficiente virial</span> \(B(T)\) propio. Pero al vaciar el bulbo (\(P_{tp}\to0\)) todas las lecturas convergen al mismo valor. Esa es la <b>escala del gas ideal</b>; el capítulo 10 demostrará que coincide con la escala termodinámica de Kelvin, definida sin referencia a ninguna sustancia.</p>
<div class="sim" data-sim="termometro-gas" data-title="Termómetro de gas a volumen constante: la extrapolación a presión cero"></div>
<div class="sim-guide"><ul>
<li>Las lecturas con nitrógeno, argón, dióxido de carbono e hidrógeno difieren a presión alta, pero las rectas convergen a 373.12 K al extrapolar a \(P_{tp}=0\): la temperatura de ebullición del agua a 1 atm.</li>
<li>El hidrógeno casi no se desvía: su \(B(T)\) es pequeño. El CO₂, con atracciones intensas, se desvía mucho. Los coeficientes provienen de la ecuación de van der Waals, que da el signo y el orden de magnitud correctos.</li>
<li>Note que la pendiente es proporcional a \(B(T_{\text{medida}})-B(273.16)\): por eso un gas más «ideal» no necesita una extrapolación tan larga.</li>
</ul></div>
<div class="box note"><h4>El kelvin desde 2019</h4><p>Hasta 2019 el kelvin se definía fijando la temperatura del punto triple del agua en 273.16 K exactos. El SI revisado fija en cambio la constante de Boltzmann: \(k_B=1.380\,649\times10^{-23}\) J/K exactamente. El punto triple pasó a ser una medición (273.1600 K con incertidumbre de 0.1 mK). En la práctica nada cambió; en principio, la temperatura quedó atada a la energía de las moléculas.</p></div>
</section>

<section>
<h2>Escalas de temperatura</h2>
<p>La escala Celsius se define hoy a partir de la kelvin, \(t/{}^\circ\text{C}=T/\text{K}-273.15\). Con la revisión de la escala, el agua ya no hierve exactamente a 100 °C a 1 atm sino a 99.97 °C. La escala Fahrenheit, todavía usada en Estados Unidos, y su versión absoluta, la Rankine, se relacionan por</p>
<div class="eq">\[t_F=\tfrac95t_C+32,\qquad T_R=\tfrac95T_K=t_F+459.67.\]</div>
<p>Un intervalo de 1 K es igual a uno de 1 °C; uno de 1 °F es igual a uno de 1 R y vale 5/9 K. Las ecuaciones que contienen \(T\) en un cociente o en una exponencial (gas ideal, Carnot, Arrhenius) exigen <b>temperatura absoluta</b>; las que solo contienen diferencias (\(Q=mc\,\Delta T\)) admiten cualquiera de las dos.</p>
<p>En los laboratorios de metrología se usa la <b>Escala Internacional de Temperatura de 1990 (ITS-90)</b>, que define la temperatura por puntos fijos (puntos triples, de fusión y de solidificación de sustancias puras) e instrumentos de interpolación: termómetros de resistencia de platino entre 13.8 K y 961.78 °C, y pirómetros de radiación por encima.</p>
<div class="sim" data-sim="escalas" data-title="Escalas Kelvin, Celsius, Fahrenheit y Rankine"></div>
<div class="sim-guide"><ul>
<li>Las cuatro escalas son lineales entre sí. La de Fahrenheit y la de Celsius coinciden en −40°.</li>
<li>Observe la posición de los puntos fijos de la ITS-90: el punto triple del agua es el único que se usa en las cuatro escalas como referencia histórica.</li>
</ul></div>

</section>

<section>
<h2>Sensores reales: termistores y termopares</h2>
<p>En el laboratorio y en la industria la temperatura se mide con sensores eléctricos. Un <span class="term">termistor NTC</span> es un semiconductor cerámico cuya resistencia cae de forma casi exponencial al calentarse, porque aumenta el número de portadores activados térmicamente. Su curva se describe con la ecuación de Steinhart y Hart (1968):</p>
<div class="eq key" data-name="Ecuación de Steinhart–Hart">\[\frac1T=A+B\ln R+C(\ln R)^3,\]</div>
<p>o, en un intervalo estrecho, con el modelo de parámetro \(\beta\): \(R=R_0\,\ee^{\beta(1/T-1/T_0)}\). Un termistor comercial de 10 kΩ (\(\beta_{25/85}=3977\) K) cambia su resistencia un 4.5 % por grado a 25 °C, diez veces más que un termómetro de platino.</p>
<p>Un <span class="term">termopar</span> son dos alambres de metales distintos unidos en un extremo. Por el efecto Seebeck (capítulo 23) aparece una tensión que depende de la diferencia de temperaturas entre la unión caliente y la de referencia, unos 41 µV/K en el tipo K (cromel–alumel). Es robusto, barato y llega a 1250 °C, pero exige compensar la unión fría.</p>
<div class="sim" data-sim="termistor" data-title="Termistor NTC en un divisor de tensión leído por un microcontrolador"></div>
<div class="sim-guide"><ul>
<li>El divisor con resistencia fija de 10 kΩ convierte la resistencia en tensión; el convertidor analógico-digital de 10 o 12 bits la cuantiza. La resolución en temperatura es mejor cerca de 25 °C, donde \(R_{NTC}\approx R_{fija}\).</li>
<li>Compare el modelo \(\beta\) (calibrado en 0 y 25 °C) con la curva de Steinhart–Hart del fabricante: a 50 °C difieren 0.6 °C; a 100 °C, más de 3 °C.</li>
<li>Es el montaje de las prácticas con ESP32 y Arduino: el programa invierte la ecuación para mostrar la temperatura.</li>
</ul></div>
<div class="box ex"><h4>Calibrar un termistor con dos puntos</h4>
<p>Un termistor mide 32.65 kΩ en agua con hielo (0 °C) y 10.00 kΩ a 25 °C. Halle \(\beta\) y prediga su resistencia en agua hirviendo en Popayán (94.1 °C).</p>
<details><summary>Solución</summary><p>\(\beta=\ln(R_1/R_2)/(1/T_1-1/T_2)=\ln(3.265)/(1/273.15-1/298.15)=1.1833/3.0697\times10^{-4}=3855\) K. A 367.25 K: \(R=10\,\ee^{3855(1/367.25-1/298.15)}=10\,\ee^{-2.433}=0.878\) kΩ. La curva de Steinhart–Hart del fabricante (\(A=1.1291\times10^{-3}\), \(B=2.3412\times10^{-4}\), \(C=8.769\times10^{-8}\)) da 0.808 kΩ. Si el programa usara el modelo \(\beta\) para convertir esa resistencia, leería 97.0 °C: casi 3 °C de error lejos de los puntos de calibración. Por eso conviene calibrar en tres puntos que cubran el intervalo de uso.</p></details>
</div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Clasifique como abierto, cerrado o aislado: una olla a presión con la válvula cerrada, una olla con la válvula silbando, una nevera desconectada y bien cerrada, un ser humano.
<details><summary>Respuesta</summary><p>Cerrado; abierto; casi aislado (intercambia calor lentamente, luego cerrado); abierto.</p></details></li>
<li><span class="lvl">Básico</span>La temperatura normal del cuerpo es 37.0 °C. Exprésela en K, °F y R.
<details><summary>Respuesta</summary><p>310.15 K, 98.6 °F, 558.27 R.</p></details></li>
<li><span class="lvl">Intermedio</span>Un termómetro de 5 g de vidrio (\(c=0.84\) J/g·K) a 20 °C se sumerge en 10 g de agua a 60 °C. ¿Qué lee al equilibrio, sin pérdidas?
<details><summary>Respuesta</summary><p>\(C_1=4.2\) J/K, \(C_2=41.86\) J/K; \(T_f=(4.2\cdot20+41.86\cdot60)/46.06=56.4\) °C. El termómetro introdujo un error de 3.6 °C.</p></details></li>
<li><span class="lvl">Intermedio</span>Un termómetro de gas a volumen constante marca \(P_{tp}=80.00\) kPa en el punto triple y 109.32 kPa en un baño. Con \(P_{tp}=40.00\) kPa marca 54.67 kPa. Estime la temperatura del baño en la escala del gas ideal.
<details><summary>Respuesta</summary><p>Lecturas: \(273.16\cdot109.32/80=373.27\) K y \(273.16\cdot54.67/40=373.34\) K. Extrapolando linealmente a \(P_{tp}=0\): \(373.34+(373.34-373.27)=373.41\) K.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que para un gas con \(Pv=RT(1+B/v)\) la lectura del termómetro de volumen constante es, a primer orden, \(T^*=T\,[1+(B(T)-B(T_{tp}))P_{tp}/(RT_{tp})]\).
<details><summary>Respuesta</summary><p>\(P/P_{tp}=(T/T_{tp})(1+B/v)/(1+B_{tp}/v)\approx(T/T_{tp})(1+(B-B_{tp})/v)\) y \(1/v\approx P_{tp}/(RT_{tp})\). Multiplicando por 273.16 K se obtiene el resultado: la lectura es lineal en \(P_{tp}\) y la pendiente es proporcional a \(B(T)-B(T_{tp})\).</p></details></li>
</ol>
<div class="box note"><h4>Para profundizar</h4><p>M. W. Zemansky y R. H. Dittman, <em>Heat and Thermodynamics</em>, 7.ª ed., McGraw-Hill, 1997, caps. 1–2. Y. A. Çengel y M. A. Boles, <em>Termodinámica</em>, 9.ª ed., McGraw-Hill, 2019, cap. 1. J. S. Steinhart y S. R. Hart, «Calibration curves for thermistors», <em>Deep-Sea Research</em> 15, 497 (1968). BIPM, <em>The International System of Units</em>, 9.ª ed., 2019.</p></div>
</section>

<!-- 02-gas-ideal.html -->
<template class="chapter-src" data-id="gas-ideal" data-num="2" data-title="Gas ideal y teoría cinética" data-part="Parte I · Fundamentos" data-short="Ecuación de estado del gas ideal, presión y temperatura desde las colisiones moleculares, distribución de Maxwell–Boltzmann, equipartición, capacidades caloríficas de los gases y la atmósfera barométrica">
<p class="lead">El gas ideal es el modelo más útil de la termodinámica: describe el aire, los gases de combustión y el vapor a baja presión con un error de pocos por ciento, y es el único sistema macroscópico cuyas propiedades se pueden deducir de principio a fin desde el movimiento de las moléculas. Este capítulo hace esa deducción y la usa para entender por qué la Tierra perdió su hidrógeno y por qué el agua hierve antes en Popayán.</p>

<section>
<h2>La ecuación de estado</h2>
<p>Boyle (1662) encontró que a temperatura fija \(PV\) es constante; Charles y Gay-Lussac, que a presión fija \(V\) crece linealmente con la temperatura; Avogadro, que volúmenes iguales de gases a igual \(P\) y \(T\) contienen el mismo número de moléculas. Las tres leyes se condensan en</p>
<div class="eq key" data-name="Gas ideal">\[PV=nRT=Nk_BT\qquad\Longleftrightarrow\qquad Pv=R_gT,\quad R_g=\frac{R}{M},\]</div>
<p>con \(R=N_Ak_B=8.314\) J/mol·K. La forma específica usa la constante particular del gas: \(R_g=287.05\) J/kg·K para el aire seco (\(M=28.965\) g/mol), 461.5 J/kg·K para el vapor de agua, 4124 J/kg·K para el hidrógeno.</p>
<p>Ningún gas real es ideal; todos lo son en el límite de baja densidad, cuando las moléculas pasan casi todo el tiempo lejos unas de otras. El aire a 1 atm y 20 °C se desvía menos del 0.1 %; el vapor de agua a 10 MPa, más del 20 %. El capítulo 4 mide esa desviación con el factor de compresibilidad.</p>
<div class="box ex"><h4>El aire de un salón de clase en Popayán</h4>
<p>Un salón mide 8 m × 6 m × 3 m. En Popayán (1760 m de altitud) la presión atmosférica es 81.9 kPa. ¿Cuánta masa de aire contiene a 20 °C? ¿Cuántas moléculas?</p>
<details><summary>Solución</summary><p>\(m=PV/(R_gT)=81\,900\times144/(287.05\times293.15)=140\) kg. El número de moléculas es \(N=PV/(k_BT)=2.91\times10^{27}\). Al nivel del mar el mismo salón contendría 173 kg: un 19 % más.</p></details>
</div>
</section>

<section>
<h2>Presión y temperatura desde las colisiones</h2>
<p>Considere \(N\) moléculas de masa \(m\) en una caja. Una molécula que choca elásticamente con una pared perpendicular a \(x\) le transfiere \(2mv_x\). En un tiempo \(\Delta t\) chocan contra un área \(A\) las moléculas con \(v_x>0\) que están a menos de \(v_x\Delta t\) de la pared. Sumando sobre todas,</p>
<div class="eq">\[P=\frac{F}{A}=n\,m\,\langle v_x^2\rangle=\frac13\,n\,m\,\langle v^2\rangle,\qquad n=\frac NV,\]</div>
<p>donde se usó la isotropía \(\langle v_x^2\rangle=\langle v_y^2\rangle=\langle v_z^2\rangle=\langle v^2\rangle/3\). Comparando con \(P=nk_BT\):</p>
<div class="eq key" data-name="Temperatura cinética">\[\left\langle\tfrac12mv^2\right\rangle=\tfrac32k_BT.\]</div>
<p>La temperatura <b>es</b> la energía cinética media de traslación, salvo un factor. No depende de la masa: en el aire a 300 K, una molécula de N₂ y una de O₂ tienen la misma energía cinética media, \(6.2\times10^{-21}\) J, aunque la de N₂ se mueve un 7 % más rápido.</p>
<div class="sim" data-sim="caja-cinetica" data-title="La presión medida con las colisiones de discos duros"></div>
<div class="sim-guide"><ul>
<li>La simulación es bidimensional (en 2D, \(PA=Nk_BT\) y \(\langle\tfrac12mv^2\rangle=k_BT\)). La presión se mide contando la cantidad de movimiento que reciben las paredes, igual que en la deducción.</li>
<li>Duplique \(N\) o \(T\): la presión medida se duplica. Al reducir el área, aumenta en proporción inversa.</li>
<li>Con discos grandes (mayor fracción de área ocupada) la presión medida supera la ideal: el volumen excluido de van der Waals (capítulo 4).</li>
<li>Los choques entre partículas no cambian la presión ideal, pero sí redistribuyen las rapideces: el histograma se acerca a la distribución de Maxwell–Boltzmann en 2D aunque todas empiecen con la misma rapidez.</li>
</ul></div>
</section>

<section>
<h2>La distribución de Maxwell–Boltzmann</h2>
<p>Maxwell (1860) dedujo la distribución de velocidades de un gas en equilibrio suponiendo solo que las tres componentes son independientes y que la distribución es isótropa. Cada componente es gaussiana, y la rapidez \(v=|\vb v|\) se distribuye como</p>
<div class="eq key" data-name="Distribución de Maxwell–Boltzmann">\[f(v)=4\pi\left(\frac{m}{2\pi k_BT}\right)^{3/2}v^2\,\ee^{-mv^2/2k_BT}.\]</div>
<p>Tres rapideces características, todas proporcionales a \(\sqrt{T/m}\):</p>
<div class="eq">\[v_p=\sqrt{\frac{2k_BT}m},\qquad \bar v=\sqrt{\frac{8k_BT}{\pi m}},\qquad v_{rms}=\sqrt{\frac{3k_BT}m}.\]</div>
<p>Para el N₂ a 300 K: 422, 476 y 517 m/s, más rápido que el sonido en el aire (347 m/s), como debe ser: el sonido se propaga por choques moleculares.</p>
<p>La cola de alta rapidez es la responsable de la <b>evaporación de las atmósferas</b>. En la exosfera terrestre, a unos 500 km de altura y 1000 K, la fracción de moléculas que supera la velocidad de escape (11.2 km/s) es \(10^{-6}\) para el hidrógeno, \(5\times10^{-13}\) para el helio y \(10^{-91}\) para el nitrógeno. A lo largo de miles de millones de años, eso basta para que la Tierra haya perdido casi todo su hidrógeno y su helio libres, y conserve el N₂ y el O₂.</p>
<div class="sim" data-sim="maxwell" data-title="Distribución de Maxwell–Boltzmann y escape atmosférico"></div>
<div class="sim-guide"><ul>
<li>Al subir la temperatura la curva se ensancha y se corre hacia la derecha; su área sigue siendo 1.</li>
<li>Elija la Luna (escape 2.38 km/s, 390 K de día): incluso el argón tiene una fracción no despreciable por encima del escape. Por eso la Luna no tiene atmósfera.</li>
<li>La fracción por encima de \(v\) se calcula exactamente con la función error: \(1-\operatorname{erf}x+\tfrac{2}{\sqrt\pi}x\ee^{-x^2}\), con \(x=v/v_p\).</li>
</ul></div>
</section>

<section>
<h2>Equipartición y capacidades caloríficas</h2>
<p>El <span class="term">teorema de equipartición</span> de la mecánica estadística clásica (capítulo 21) dice que cada término cuadrático de la energía de una molécula aporta \(\tfrac12k_BT\) a su energía media. Un átomo tiene tres términos de traslación; una molécula lineal añade dos de rotación; cada modo de vibración añade dos (cinética y potencial). La energía interna molar y la capacidad calorífica a volumen constante son</p>
<div class="eq">\[\bar u=\frac f2RT,\qquad \bar c_v=\frac f2R,\qquad \bar c_p=\bar c_v+R,\qquad k=\gamma=\frac{c_p}{c_v}.\]</div>
<p>Así, un gas monoatómico tiene \(\bar c_v=\tfrac32R=12.47\) J/mol·K y \(k=5/3\), y uno diatómico «rígido», \(\bar c_v=\tfrac52R\) y \(k=1.4\), el valor del aire. Pero la equipartición falla: los modos de vibración del N₂ no se excitan a temperatura ambiente, y la rotación del H₂ se «congela» por debajo de unos 80 K. Es la mecánica cuántica: un modo con separación de niveles \(\hbar\omega\) solo participa si \(k_BT\gtrsim\hbar\omega\). La contribución de un oscilador cuántico es la función de Einstein,</p>
<div class="eq key" data-name="Capacidad calorífica de un modo de vibración">\[\frac{c_{vib}}{R}=\left(\frac{\Theta_v}T\right)^2\frac{\ee^{\Theta_v/T}}{\left(\ee^{\Theta_v/T}-1\right)^2},\qquad \Theta_v=\frac{\hbar\omega}{k_B},\]</div>
<p>que vale 0 para \(T\ll\Theta_v\) y 1 para \(T\gg\Theta_v\). Con las temperaturas vibracionales espectroscópicas (N₂: 3393 K; O₂: 2274 K; CO₂: 960 K dos veces, 1918 K y 3380 K) este modelo reproduce los calores específicos de las tablas NIST-JANAF dentro del 1–2 % hasta 2000 K. Es el modelo que usa el curso para el aire y los gases de combustión.</p>
<div class="sim" data-sim="equiparticion" data-title="Capacidad calorífica de los gases: equipartición y modos congelados"></div>
<div class="sim-guide"><ul>
<li>Cada escalón de la curva es un grupo de grados de libertad que «despierta». El H₂ muestra la rotación (cerca de \(\Theta_r=87.6\) K) y la vibración (6332 K).</li>
<li>El CO₂, lineal y triatómico, tiene cuatro modos de vibración; dos de ellos (flexión, 960 K) ya se excitan parcialmente a temperatura ambiente: por eso su \(k\) es 1.29 y no 1.4. Esos mismos modos absorben la radiación infrarroja de la Tierra: el efecto invernadero (capítulo 24).</li>
<li>Los puntos son los valores de NIST-JANAF; la curva, el modelo estadístico.</li>
</ul></div>
<div class="box warn"><h4>El hidrógeno a baja temperatura</h4><p>La rotación del H₂ que se muestra usa la suma exacta del rotor rígido sin distinguir orto- y parahidrógeno. El H₂ real, con sus dos especies de espín nuclear, tiene un pico distinto por debajo de 300 K; fue uno de los rompecabezas que resolvió Dennison en 1927.</p></div>
</section>

<section>
<h2>La atmósfera barométrica</h2>
<p>Una columna de aire en reposo cumple el equilibrio hidrostático, \(\dd P=-\rho g\,\dd z\). Con \(\rho=P/(R_gT)\) y temperatura constante,</p>
<div class="eq key" data-name="Fórmula barométrica">\[P(z)=P_0\,\ee^{-z/H},\qquad H=\frac{R_gT}{g}=\frac{k_BT}{mg},\]</div>
<p>con altura de escala \(H\approx8.4\) km a 15 °C. Es una distribución de Boltzmann: la probabilidad de hallar una molécula a altura \(z\) es proporcional a \(\ee^{-mgz/k_BT}\). En la troposfera real la temperatura baja 6.5 K por kilómetro, y la atmósfera estándar internacional (ISA) da</p>
<div class="eq">\[P(z)=101\,325\ \text{Pa}\left(1-\frac{0.0065\,z}{288.15\ \text{K}}\right)^{5.2559}.\]</div>
<p>En Popayán (1760 m) resultan 81.9 kPa; en Bogotá (2640 m), 73.4 kPa; en la cima del Everest, unos 31 kPa. Como el agua hierve cuando su presión de vapor iguala la atmosférica, el punto de ebullición cae con la altura: 94.1 °C en Popayán, 91.2 °C en Bogotá, 70 °C en el Everest (capítulo 3).</p>
<div class="sim" data-sim="barometrica" data-title="Presión, densidad y punto de ebullición con la altura"></div>
<div class="sim-guide"><ul>
<li>Compare la atmósfera isoterma con la ISA: hasta 3 km difieren menos del 2 %.</li>
<li>Al cambiar el gas, cambia la altura de escala: el hidrógeno puro tendría \(H\approx120\) km. Por eso en la alta atmósfera dominan los gases livianos.</li>
</ul></div>
<div class="box note"><h4>El recorrido libre medio</h4><p>Entre choques, una molécula recorre en promedio \(\lambda=k_BT/(\sqrt2\pi d^2P)\). Para el aire (\(d\approx0.37\) nm) a 20 °C vale 66 nm al nivel del mar y 81 nm en Popayán: unas 20 veces la distancia media entre moléculas (3.4 nm). Ese recorrido fija la viscosidad y la conductividad térmica de los gases (capítulo 23) y explica por qué no dependen de la presión, como descubrió con sorpresa Maxwell en 1866.</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un neumático de bicicleta de 2 L se infla a 450 kPa manométricos en Popayán a 18 °C. ¿Cuántos gramos de aire contiene?
<details><summary>Respuesta</summary><p>\(P=531.9\) kPa absolutos; \(m=PV/(R_gT)=531\,900\times0.002/(287.05\times291.15)=12.7\) g.</p></details></li>
<li><span class="lvl">Básico</span>Calcule \(v_{rms}\) del helio y del xenón (131.3 g/mol) a 25 °C.
<details><summary>Respuesta</summary><p>1363 m/s y 238 m/s.</p></details></li>
<li><span class="lvl">Intermedio</span>¿A qué temperatura la \(v_{rms}\) del H₂ igualaría la velocidad de escape de la Tierra? ¿Por qué el H₂ escapa a temperaturas mucho menores?
<details><summary>Respuesta</summary><p>\(T=mv^2/3k_B=1.0\times10^4\) K. Escapa la cola de la distribución: aunque la fracción sea \(10^{-6}\), se renueva continuamente durante millones de años.</p></details></li>
<li><span class="lvl">Intermedio</span>Con equipartición, prediga \(\bar c_p\) y \(k\) del vapor de agua (no lineal) a 400 K si las vibraciones están congeladas. Compare con el valor tabulado \(\bar c_p=34.3\) J/mol·K.
<details><summary>Respuesta</summary><p>\(f=6\): \(\bar c_v=3R=24.9\), \(\bar c_p=4R=33.3\) J/mol·K, \(k=4/3\). El 3 % de diferencia se debe a la flexión (2295 K), ya algo excitada.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre a partir de \(f(v)\) que \(\langle v^2\rangle=3k_BT/m\) y halle la fracción de moléculas con rapidez entre \(v_p\) y \(2v_p\).
<details><summary>Respuesta</summary><p>\(\int_0^\infty v^4\ee^{-av^2}\dd v=\tfrac38\sqrt{\pi}a^{-5/2}\) con \(a=m/2k_BT\) da el resultado. La fracción es \(F(2)-F(1)\) con \(F(x)=\operatorname{erf}x-\tfrac2{\sqrt\pi}x\ee^{-x^2}\): \(0.9540-0.4276=0.526\).</p></details></li>
</ol>
<div class="box note"><h4>Para profundizar</h4><p>F. Reif, <em>Fundamentals of Statistical and Thermal Physics</em>, McGraw-Hill, 1965, cap. 7. D. V. Schroeder, <em>An Introduction to Thermal Physics</em>, Addison-Wesley, 2000, caps. 1 y 6. J. C. Maxwell, «Illustrations of the dynamical theory of gases», <em>Phil. Mag.</em> 19, 19 (1860). M. W. Chase, <em>NIST-JANAF Thermochemical Tables</em>, 4.ª ed., 1998.</p></div>

<template class="chapter-src" data-id="sustancia-pura" data-num="3" data-title="Sustancias puras y cambio de fase" data-part="Parte I · Fundamentos" data-short="Fases del agua, superficie P–v–T, domo de saturación, calidad y regla de la palanca, tablas de vapor desde IAPWS-95, diagrama de fases con punto triple y crítico, la olla a presión y el tanque rígido">
<p class="lead">El agua es el fluido de trabajo de la civilización industrial: mueve las turbinas que generan la mayor parte de la electricidad del mundo, calienta, enfría y cocina. Su comportamiento no se parece al de un gas ideal: hierve, se condensa, se congela, y en el punto crítico deja de distinguir entre líquido y vapor. Este capítulo enseña a leer sus diagramas y sus tablas, la herramienta de trabajo de todos los capítulos de ingeniería del curso.</p>

<section>
<h2>Fases y cambios de fase</h2>
<p>Una <span class="term">sustancia pura</span> tiene composición química homogénea e invariable: el agua, el nitrógeno, el R-134a, y también el aire mientras no se condense. Puede existir en varias <span class="term">fases</span>, regiones físicamente homogéneas separadas por interfaces: sólido, líquido y vapor (y varias fases sólidas: el hielo tiene al menos 19).</p>
<p>Calentemos 1 kg de agua a presión constante de 1 atm, en un cilindro con pistón libre:</p>
<ol>
<li><b>Líquido comprimido</b> (o subenfriado): a 20 °C el agua no está a punto de hervir. Al calentarla, su temperatura sube y su volumen casi no cambia.</li>
<li><b>Líquido saturado</b>: a 99.97 °C aparece la primera burbuja. Esa es la <span class="term">temperatura de saturación</span> a 101.325 kPa.</li>
<li><b>Mezcla saturada</b>: el calor que se sigue añadiendo no eleva la temperatura; evapora líquido. Hacen falta 2257 kJ (el <span class="term">calor latente</span> \(h_{fg}\)) para evaporar todo el kilogramo, más de cinco veces lo que costó llevarlo de 0 a 100 °C. Mientras tanto el volumen crece 1600 veces.</li>
<li><b>Vapor saturado</b>: se evapora la última gota.</li>
<li><b>Vapor sobrecalentado</b>: el vapor vuelve a subir de temperatura.</li>
</ol>
<p>La temperatura de saturación depende de la presión: \(T_{sat}=T_{sat}(P)\). En Popayán, a 81.9 kPa, el agua hierve a 94.1 °C; en una olla a presión con 100 kPa manométricos, a 117 °C. La relación \(P_{sat}(T)\) es la <span class="term">curva de presión de vapor</span>.</p>
</section>

<section>
<h2>Diagramas P–v y T–v: el domo de saturación</h2>
<p>Si se repite el experimento a distintas presiones y se unen los estados de líquido saturado y de vapor saturado, se obtiene una campana: el <span class="term">domo de saturación</span>. A la izquierda queda la región de líquido comprimido; a la derecha, la de vapor sobrecalentado; bajo el domo, las mezclas. Al subir la presión, la meseta de evaporación se acorta, hasta desaparecer en el <span class="term">punto crítico</span>: para el agua, \(T_c=373.946\) °C, \(P_c=22.064\) MPa, \(v_c=0.003106\) m³/kg. Por encima de él no hay ebullición: el fluido pasa de forma continua de denso a ligero.</p>
<div class="sim" data-sim="domo-agua" data-title="El domo de saturación del agua (IAPWS-95) en los diagramas P–v y T–v"></div>
<div class="sim-guide"><ul>
<li>Las isotermas por debajo de \(T_c\) son horizontales dentro del domo en el diagrama \(P\)–\(v\): durante la evaporación, \(P\) y \(T\) no son independientes.</li>
<li>Note la escala logarítmica de \(v\): el vapor saturado a 10 kPa ocupa 14.7 m³/kg; el líquido, 0.00101 m³/kg.</li>
<li>Recorra la isóbara de 22.064 MPa: el punto de inflexión horizontal es el punto crítico.</li>
<li>Las curvas se calcularon con la formulación IAPWS-95, la ecuación de referencia internacional del agua, a través de CoolProp; el curso las interpola con un error menor que 0.1 %.</li>
</ul></div>
<h3>Calidad y regla de la palanca</h3>
<p>Bajo el domo, el estado se fija con la presión (o la temperatura) y la <span class="term">calidad</span> \(x\), la fracción de masa que es vapor. Como el volumen total es la suma de los volúmenes de cada fase,</p>
<div class="eq key" data-name="Propiedades de una mezcla saturada">\[v=v_f+x\,v_{fg},\qquad u=u_f+x\,u_{fg},\qquad h=h_f+x\,h_{fg},\qquad s=s_f+x\,s_{fg},\]</div>
<p>con \(v_{fg}=v_g-v_f\) y análogamente para las demás. Despejando, \(x=(v-v_f)/(v_g-v_f)\): la calidad es la fracción de la línea horizontal entre \(v_f\) y \(v\), la misma <b>regla de la palanca</b> de los diagramas de fase de aleaciones.</p>
<div class="box ex"><h4>Una mezcla a 200 kPa</h4>
<p>Un recipiente contiene agua a 200 kPa con calidad 0.6. Halle \(T\), \(v\) y \(h\).</p>
<details><summary>Solución</summary><p>Tabla de saturación a 200 kPa: \(T_{sat}=120.21\) °C, \(v_f=0.001061\), \(v_g=0.8858\) m³/kg, \(h_f=504.7\), \(h_{fg}=2201.6\) kJ/kg. Entonces \(v=0.001061+0.6(0.8847)=0.5318\) m³/kg y \(h=504.7+0.6(2201.6)=1825.6\) kJ/kg. Compruébelo con la calculadora de abajo.</p></details>
</div>
</section>

<section>
<h2>Tablas de propiedades</h2>
<p>Las propiedades de las sustancias reales no caben en una fórmula sencilla; se tabulan. Las tablas de vapor clásicas (Keenan y Keyes, 1936) se construyeron con miles de mediciones. Hoy se calculan con una <b>ecuación fundamental</b>: una expresión de la energía de Helmholtz \(a(\rho,T)\) con unas 50 constantes ajustadas, de la que todas las demás propiedades se obtienen por derivación (capítulo 16). Para el agua es la IAPWS-95 (Wagner y Pruß, 2002), que reproduce las mejores mediciones dentro de su incertidumbre experimental.</p>
<p>El uso de las tablas sigue un procedimiento fijo:</p>
<ol>
<li>Con dos propiedades, determine la región: compare \(T\) con \(T_{sat}(P)\), o \(v\), \(h\), \(s\) con los valores \(f\) y \(g\) a esa presión.</li>
<li>Si \(T>T_{sat}\) (o \(h>h_g\)), use la tabla de vapor sobrecalentado; si cae entre \(f\) y \(g\), calcule la calidad.</li>
<li>Para líquido comprimido sin tabla, aproxime con el líquido saturado <b>a la misma temperatura</b>: \(v\approx v_f(T)\), \(u\approx u_f(T)\), \(h\approx h_f(T)+v_f(T)[P-P_{sat}(T)]\).</li>
</ol>
<p>El cero de energía es arbitrario: la convención de la IAPWS fija \(u=0\) y \(s=0\) para el líquido saturado en el punto triple. Solo las diferencias tienen sentido físico, y por eso no se deben mezclar tablas de fuentes con referencias distintas.</p>
<div class="sim" data-sim="tablas-vapor" data-title="Calculadora de tablas: agua y R-134a"></div>
<div class="sim-guide"><ul>
<li>Elija el par de propiedades conocido. La calculadora decide la región, igual que el procedimiento manual, y muestra todas las demás.</li>
<li>Con \(P=1\) MPa y \(h=2900\) kJ/kg el estado es vapor sobrecalentado a 230.7 °C: \(h>h_g=2777\) kJ/kg.</li>
<li>El R-134a, refrigerante de neveras y aires acondicionados de automóvil, usa la referencia ASHRAE: \(h=200\) kJ/kg y \(s=1\) kJ/kg·K para el líquido saturado a 0 °C. Las tablas del capítulo 15 la usan.</li>
</ul></div>
</section>

<section>
<h2>El diagrama de fases P–T</h2>
<p>Proyectada sobre el plano \(P\)–\(T\), la superficie de estados se reduce a tres curvas que separan sólido, líquido y vapor y se cortan en el <span class="term">punto triple</span>, el único estado en que coexisten las tres fases: 0.01 °C y 611.657 Pa para el agua. La curva de vaporización termina en el punto crítico; la de fusión, que se sepa, no termina.</p>
<p>La pendiente de cada curva la da la ecuación de Clapeyron (capítulo 16), \(\dd P/\dd T=h_{fg}/(T\,v_{fg})\). El agua es anómala: el hielo es menos denso que el líquido (\(v_{sf}<0\)), así que la curva de fusión tiene pendiente <b>negativa</b>: presionar el hielo lo funde. Pero hacen falta 111 MPa para fundirlo a −10 °C; el patinaje sobre hielo no se explica así, sino por fricción y por una capa líquida superficial.</p>
<div class="sim" data-sim="fases-pt" data-title="Diagrama de fases del agua y la olla a presión"></div>
<div class="sim-guide"><ul>
<li>La curva de vaporización es la ecuación de Wagner y Pruß (IAPWS); la de sublimación y la de fusión del hielo I, las de la IAPWS (2011).</li>
<li>Mueva la altitud: la presión atmosférica baja y con ella la temperatura de ebullición.</li>
<li>Agregue presión manométrica con la válvula de una olla a presión (unos 100 kPa): el agua hierve por encima de 115 °C incluso en Popayán, y los fríjoles se cocinan en un tercio del tiempo.</li>
</ul></div>
<div class="box note"><h4>Por qué cocinar tarda más en la montaña</h4><p>La velocidad de las reacciones de cocción (desnaturalización, gelatinización del almidón, ablandamiento de la pectina) crece con la temperatura, típicamente al doble por cada 10 °C. En Popayán el agua hierve 6 °C más fría que en Cartagena, así que la cocción en olla abierta tarda alrededor de 1.5 veces más. La olla a presión invierte la situación.</p></div>
</section>

<section>
<h2>Calentar un tanque rígido</h2>
<p>Un caso que sorprende: un recipiente rígido y cerrado contiene una mezcla de agua líquida y vapor. Al calentarlo, el volumen específico \(v=V/m\) no cambia; el estado sube por una línea vertical en el diagrama \(T\)–\(v\). Si \(v<v_c\), la línea corta la rama del líquido: el líquido se dilata, el vapor se condensa, y el tanque termina lleno de líquido, lo que dispara la presión. Si \(v>v_c\), corta la rama del vapor: el líquido se evapora por completo. Solo si \(v=v_c\) el menisco desaparece en el punto crítico, a media altura. Es el experimento clásico de opalescencia crítica de Andrews (1869).</p>
<div class="sim" data-sim="tanque-rigido" data-title="Tanque rígido con mezcla líquido–vapor: ¿se llena o se seca?"></div>
<div class="sim-guide"><ul>
<li>Con una fracción inicial de líquido grande (\(v<v_c\)) el menisco sube hasta llenar el tanque; con poca, baja hasta secarlo.</li>
<li>Busque la fracción inicial de volumen líquido que lleva justo al punto crítico a 100 °C: es cercana a 0.33. Un tanque de vapor se diseña con mucho margen frente a esa condición.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Determine la fase y la temperatura del agua a 500 kPa con \(h=2000\) kJ/kg.
<details><summary>Respuesta</summary><p>\(h_f=640.1<h<h_g=2748.1\): mezcla a 151.8 °C con \(x=(2000-640.1)/2108.0=0.645\).</p></details></li>
<li><span class="lvl">Básico</span>¿Cuánto calor hace falta para evaporar 1 L de agua en Popayán, partiendo de 18 °C?
<details><summary>Respuesta</summary><p>Calentar hasta 94.1 °C: \(\approx4.19\times76.1=319\) kJ; evaporar: \(h_{fg}(94.1\,°\text{C})=2272\) kJ. Total ≈ 2590 kJ por kilogramo (0.997 kg en el litro).</p></details></li>
<li><span class="lvl">Intermedio</span>Un tanque rígido de 0.5 m³ contiene 10 kg de agua a 100 °C. Halle la calidad, la presión y la masa de líquido.
<details><summary>Respuesta</summary><p>\(v=0.05\) m³/kg; \(x=(0.05-0.001043)/(1.6720-0.001043)=0.0293\); \(P=101.4\) kPa; líquido: 9.71 kg.</p></details></li>
<li><span class="lvl">Intermedio</span>Agua a 5 MPa y 40 °C. Compare \(h\) con la aproximación de líquido saturado a 40 °C sin corrección de presión.
<details><summary>Respuesta</summary><p>\(h_f(40\,°\text{C})=167.5\) kJ/kg; con la corrección \(v_f(P-P_{sat})=0.001008\times4993=5.0\) kJ/kg, \(h\approx172.5\). La tabla de líquido comprimido da 171.9 kJ/kg.</p></details></li>
<li><span class="lvl">Avanzado</span>En el tanque rígido del texto, ¿qué fracción del volumen debe ocupar el líquido a 100 °C para que el estado pase por el punto crítico?
<details><summary>Respuesta</summary><p>Se necesita \(v=v_c\). Con fracción de volumen \(\phi\): \(m=V[\phi/v_f+(1-\phi)/v_g]\) y \(v=V/m\). Despejando \(\phi=(1/v_c-1/v_g)/(1/v_f-1/v_g)=(322.0-0.598)/(958.4-0.598)=0.336\).</p></details></li>
</ol>
<div class="box note"><h4>Para profundizar</h4><p>Çengel y Boles (2019), cap. 3. W. Wagner y A. Pruß, «The IAPWS formulation 1995 for the thermodynamic properties of ordinary water substance», <em>J. Phys. Chem. Ref. Data</em> 31, 387 (2002). IAPWS R14-08(2011), <em>Revised release on the pressure along the melting and sublimation curves of ordinary water substance</em>. I. H. Bell et al., «Pure and pseudo-pure fluid thermophysical property evaluation and the open-source thermophysical property library CoolProp», <em>Ind. Eng. Chem. Res.</em> 53, 2498 (2014).</p></div>
</section>
