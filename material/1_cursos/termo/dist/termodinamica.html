  /* 6.2 Calor específico variable */
  const GAS = { aire: ['Aire', (T) => TH.cpAire(T), (T) => TH.dhAire(T)], N2: ['Nitrógeno', (T) => (TH.cpMol('N2', T) / 28.0134) * 1e3, (T) => (TH.dhMol('N2', T) / 28.0134) * 1e3], CO2: ['Dióxido de carbono', (T) => (TH.cpMol('CO2', T) / 44.0095) * 1e3, (T) => (TH.dhMol('CO2', T) / 44.0095) * 1e3], H2O: ['Vapor de agua (gas ideal)', (T) => (TH.cpMol('H2O', T) / 18.0153) * 1e3, (T) => (TH.dhMol('H2O', T) / 18.0153) * 1e3] };
  EM.defineSim('cp-variable', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });
    sim.select('g', { label: 'Gas', options: Object.entries(GAS).map(([k, v]) => [k, v[0]]), value: 'aire' });
    sim.slider('T1', { label: 'Temperatura inicial', min: 250, max: 2500, step: 5, value: 300, unit: 'K', fmt: (v) => v.toFixed(0) });
    sim.slider('T2', { label: 'Temperatura final', min: 250, max: 2500, step: 5, value: 1000, unit: 'K', fmt: (v) => v.toFixed(0) });
    sim.out('dh', 'Δ<i>h</i> con <i>c<sub>p</sub></i>(<i>T</i>)', { hl: true });
    sim.out('c1', 'Con <i>c<sub>p</sub></i> a 300 K (error)');
    sim.out('cm', 'Con <i>c<sub>p</sub></i> a la temperatura media (error)');
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, [, cp, dh] = GAS[p.g];
      EM.draw.clear(cv);
      const lo = Math.min(p.T1, p.T2), hi = Math.max(p.T1, p.T2);
      const ymax = cp(2500) * 1.1 / 1e3;
      const pl = new EM.Plot(ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: 250, xmax: 2500, ymin: 0, ymax, xlabel: 'T (K)', ylabel: 'c_p (kJ/kg·K)' });
      pl.frame();
      pl.fn((T) => cp(T) / 1e3, { color: '--accent', width: 2.6 });
      pl.fn((T) => (T >= lo && T <= hi ? cp(T) / 1e3 : NaN), { color: '--accent', width: 0, fill: '--accent', fillAlpha: 0.2, base: 0 });
      pl.hline(cp(300) / 1e3, { color: '--c1', label: 'c_p(300 K)' });
      const ex = dh(p.T2) - dh(p.T1), c300 = cp(300) * (p.T2 - p.T1), cm = cp((p.T1 + p.T2) / 2) * (p.T2 - p.T1);
      const err = (v) => (Math.abs(ex) < 1e-9 ? '' : ' (' + EM.fix((100 * (v - ex)) / ex, 2) + ' %)');
      sim.set('dh', EM.fix(ex / 1e3, 2) + ' kJ/kg (área sombreada)');
      sim.set('c1', EM.fix(c300 / 1e3, 2) + ' kJ/kg' + err(c300));
      sim.set('cm', EM.fix(cm / 1e3, 2) + ' kJ/kg' + err(cm));
    });
  });

  /* 6.3 Pistón con agua a presión constante */
  EM.defineSim('piston-agua', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });
    sim.slider('P', { label: 'Presión (peso del pistón + atmósfera)', min: 50, max: 5000, step: 5, value: 200, unit: 'kPa', log: true, fmt: (v) => v.toFixed(0) });
    sim.slider('m', { label: 'Masa de agua', min: 0.1, max: 5, step: 0.1, value: 2, unit: 'kg', fmt: (v) => v.toFixed(1) });
    sim.slider('T2', { label: 'Temperatura final', min: 26, max: 600, step: 1, value: 300, unit: '°C', fmt: (v) => v.toFixed(0) });
    sim.out('st', 'Estado final', { hl: true });
    sim.out('Q', 'Calor <i>Q</i> = <i>m</i>Δ<i>h</i>');
    sim.out('W', 'Trabajo de frontera <i>P</i>Δ<i>V</i>');
    sim.out('U', 'Δ<i>U</i>');
    sim.out('V', 'Volumen inicial → final');
    const W = TH.agua;
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, Wc = cv.w, H = cv.h;
      EM.draw.clear(cv);
      const P = p.P * 1e3, s1 = W.state(P, { T: 298.15 }), s2 = W.state(P, { T: p.T2 + 273.15 });
      const Q = p.m * (s2.h - s1.h), Wb = p.m * P * (s2.v - s1.v), dU = p.m * (s2.u - s1.u);
      /* curva T vs Q a lo largo de la isóbara */
      const Ts = W.Tsat(P), pts = [];
      for (let i = 0; i <= 60; i++) { const T = 298.15 + (Math.min(Ts, p.T2 + 273.15) - 298.15) * (i / 60); pts.push([(p.m * (W.state(P, { T: Math.min(T, Ts - 1e-6) }).h - s1.h)) / 1e3, T - 273.15]); }
      if (p.T2 + 273.15 > Ts) {
        const g = W.state(P, { x: 1 }); pts.push([(p.m * (g.h - s1.h)) / 1e3, Ts - 273.15]);
        for (let i = 1; i <= 40; i++) { const T = Ts + (p.T2 + 273.15 - Ts) * (i / 40); pts.push([(p.m * (W.sup(P, T).h - s1.h)) / 1e3, T - 273.15]); }
      }
      const pl = new EM.Plot(ctx, { x: 0, y: 0, w: Wc * 0.7, h: H, xmin: 0, xmax: Math.max(10, (p.m * (W.sup(P, 873.15).h - s1.h)) / 1e3), ymin: 0, ymax: 620, xlabel: 'calor añadido Q (kJ)', ylabel: 'T (°C)' });
      pl.frame();
      pl.path(pts, { color: '--accent', width: 2.6 });
      pl.hline(Ts - 273.15, { color: '--c1', label: 'T_{sat} = ' + EM.fix(Ts - 273.15, 1) + ' °C' });
      pl.dot(Q / 1e3, p.T2, { color: '--accent', r: 6 });
      /* cilindro */
      const cx = Wc * 0.72 + 30, cw = Wc * 0.2, top = 20, bot = H - 20;
      const frac = Math.min(1, Math.log10(s2.v / s1.v + 1) / Math.log10(W.sup(50e3, 873.15).v / 0.001 + 1));
      const yP = bot - 20 - (bot - top - 40) * frac;
      ctx.strokeStyle = EM.col('--ink-2'); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, top); ctx.lineTo(cx, bot); ctx.lineTo(cx + cw, bot); ctx.lineTo(cx + cw, top); ctx.stroke();
      const liq = s2.x === null ? (s2.fase.startsWith('líquido') ? 1 : 0) : ((1 - s2.x) * W.satP(P).vf) / s2.v;
      ctx.fillStyle = EM.alpha('--c1', 0.15); ctx.fillRect(cx + 2, yP + 10, cw - 4, bot - yP - 10);
      ctx.fillStyle = EM.alpha('--c1', 0.55); ctx.fillRect(cx + 2, bot - Math.max(2, (bot - yP - 10) * liq), cw - 4, Math.max(2, (bot - yP - 10) * liq));
      ctx.fillStyle = EM.col('--ink-3'); ctx.fillRect(cx + 1, yP, cw - 2, 10);
      EM.text(ctx, 'altura ∝ log V', cx + cw / 2, bot + 14, { size: 10, align: 'center', color: '--ink-3' });
      sim.set('st', s2.fase + (s2.x !== null && s2.x !== undefined ? ' (x = ' + EM.fix(s2.x, 3) + ')' : ''));
      sim.set('Q', EM.fix(Q / 1e3, 1) + ' kJ');
      sim.set('W', EM.fix(Wb / 1e3, 1) + ' kJ');
      sim.set('U', EM.fix(dU / 1e3, 1) + ' kJ');
      sim.set('V', EM.sci(p.m * s1.v, 3) + ' → ' + EM.sci(p.m * s2.v, 3) + ' m³');
    });
  });

  /* 6.4 Expansión libre */
  const VG = { He: ['Helio', 0.00346, 12.47], N2: ['Nitrógeno', 0.137, 20.8], CH4: ['Metano', 0.2303, 27.4], CO2: ['Dióxido de carbono', 0.3657, 28.9] };
  EM.defineSim('expansion-libre', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });
    sim.select('g', { label: 'Gas real (van der Waals)', options: Object.entries(VG).map(([k, v]) => [k, v[0]]), value: 'CO2' });
    sim.slider('v1', { label: 'Volumen molar inicial', min: 0.2, max: 25, step: 0.1, value: 1, unit: 'L/mol', log: true, fmt: (v) => v.toFixed(1) });
    sim.button('Abrir la válvula', () => { open = true; }, { primary: true });
    sim.resetButton(() => reset());
    sim.out('T', 'Temperatura cinética de la simulación', { hl: true });
    sim.out('dT', 'Δ<i>T</i> del gas real al duplicar el volumen');
    sim.out('S', 'Entropía generada (gas ideal)');
    let g, open = false;
    const reset = () => { g = new EM.GasBox({ N: 160, r: 0.008, W: 0.5, H: 1, T: 1 }); open = false; };
    reset();
    sim.animate((dt) => { if (!(dt > 0)) return; if (open && g.W < 1) g.W = 1; for (let k = 0; k < 6; k++) g.step(Math.min(dt, 0.03) / 6 * 0.5); });
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, Wc = cv.w, H = cv.h;
      EM.draw.clear(cv);
      const side = H - 24, bx = 12, by = 12, bw = side * 1.6;
      ctx.strokeStyle = EM.col('--ink-2'); ctx.lineWidth = 2; ctx.strokeRect(bx, by, bw, side);
      if (!open) { ctx.fillStyle = EM.col('--ink-3'); ctx.fillRect(bx + bw / 2 - 2, by, 4, side); }
      else { ctx.strokeStyle = EM.alpha('--ink-3', 0.4); ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(bx + bw / 2, by); ctx.lineTo(bx + bw / 2, by + side); ctx.stroke(); ctx.setLineDash([]); }
      g.draw(ctx, bx, by, bw * g.W, side, { speedColor: true, Tref: 1 });
      if (!open) EM.text(ctx, 'vacío', bx + bw * 0.75, by + side / 2, { size: 13, align: 'center', color: '--ink-3' });
      let nl = 0; for (let i = 0; i < g.N; i++) if (g.x[i] < 0.5) nl++;
      EM.text(ctx, 'izquierda ' + nl + ' · derecha ' + (g.N - nl), bx + bw / 2, by + side + 10, { size: 11, align: 'center', color: '--ink-2', baseline: 'top' });
      const [, a, cvm] = VG[p.g], v1 = p.v1 * 1e-3, dT = -(a / cvm) * (1 / v1 - 1 / (2 * v1));
      EM.text(ctx, VG[p.g][0] + ': ΔT = ' + EM.fix(dT, 2) + ' K', bx + bw + 20, by + 30, { size: 13, color: '--accent' });
      EM.text(ctx, 'gas ideal: ΔT = 0', bx + bw + 20, by + 54, { size: 13, color: '--c3' });
      sim.set('T', EM.fix(g.Tkin(), 3) + ' (unidades reducidas)');
      sim.set('dT', EM.fix(dT, 3) + ' K (a = ' + a + ' Pa·m⁶/mol², c̄_v = ' + cvm + ' J/mol·K)');
      sim.set('S', 'ΔS = nR ln 2 = ' + EM.fix(TH.R * Math.log(2), 3) + ' J/K por mol');
    });
  });
})();

/* Capítulo 7 — Procesos del gas ideal */
(function () {
  'use strict';
  const EM = window.EM, TH = EM.th;

  /* 7.1 Familia politrópica */
  EM.defineSim('politropicos', function (sim) {
    const cv = sim.canvas({ aspect: 1.9 });
    sim.slider('n', { label: 'Exponente politrópico <i>n</i>', min: 0, max: 3, step: 0.01, value: 1.3, fmt: (v) => v.toFixed(2) });
    sim.slider('V2', { label: 'Volumen final', min: 0.01, max: 0.3, step: 0.005, value: 0.02, unit: 'm³', fmt: (v) => v.toFixed(3) });
    sim.out('st', 'Estado final', { hl: true });
    sim.out('W', 'Trabajo de frontera');
    sim.out('Q', 'Calor');
    sim.out('dU', 'Cambio de energía interna');
    const P1 = 100, V1 = 0.1, T1 = 300, k = 1.4, R = 0.287, m = (P1 * V1) / (R * T1), cvv = 0.718;
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx;
      EM.draw.clear(cv);
      const n = p.n, V2 = p.V2, P2 = P1 * Math.pow(V1 / V2, n), T2 = (P2 * V2) / (m * R);
      const W = Math.abs(n - 1) < 1e-6 ? P1 * V1 * Math.log(V2 / V1) : (P2 * V2 - P1 * V1) / (1 - n), dU = m * cvv * (T2 - T1), Q = dU + W;
      const pl = new EM.Plot(ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: 0.005, xmax: 0.32, xlog: true, ymin: 20, ymax: 5000, ylog: true, xlabel: 'V (m³)', ylabel: 'P (kPa)' });
      pl.frame();
      for (const T of [200, 300, 450, 600, 900, 1200]) pl.fn((V) => (m * R * T) / V, { color: '--grid-2', width: 1 });
      const fam = [[0, 'n = 0 (isobárico)', '--c6'], [1, 'n = 1 (isotérmico)', '--c3'], [k, 'n = k = 1.4 (adiabático)', '--c1']];
      for (const [nn, , col] of fam) pl.fn((V) => P1 * Math.pow(V1 / V, nn), { color: col, width: 1.6, dash: [6, 4] });
      pl.vline(V1, { color: '--c5', label: 'n → ∞', labelY: 20 });
      pl.fn((V) => (V >= Math.min(V1, V2) && V <= Math.max(V1, V2) ? P1 * Math.pow(V1 / V, n) : NaN), { color: '--accent', width: 3 });
      pl.dot(V1, P1, { color: '--ink', label: '1' }); pl.dot(V2, P2, { color: '--accent', label: '2' });
      pl.legend(fam.map(([, l, c]) => ({ label: l, color: c, dash: [6, 4] })).concat([{ label: 'proceso elegido', color: '--accent' }]), 'tr');
      sim.set('st', EM.fix(P2, 1) + ' kPa · ' + EM.fix(T2, 1) + ' K');
      sim.set('W', EM.fix(W, 2) + ' kJ' + (W < 0 ? ' (recibido)' : ' (entregado)'));
      sim.set('Q', EM.fix(Q, 2) + ' kJ' + (Q < -1e-9 ? ' (cedido)' : Q > 1e-9 ? ' (recibido)' : ''));
      sim.set('dU', EM.fix(dU, 2) + ' kJ');
    });
  });

  /* 7.2 Compresión con transferencia de calor */
  EM.defineSim('compresion-rapida', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });
    sim.slider('tc', { label: 'Duración de la compresión', min: 0.002, max: 20, step: 0.001, value: 0.2, log: true, fmt: (v) => (v < 0.1 ? (v * 1000).toFixed(1) + ' ms' : v.toFixed(2) + ' s') });
    sim.slider('h', { label: 'Coeficiente de transferencia de calor', min: 5, max: 1000, step: 1, value: 100, unit: 'W/m²·K', log: true, fmt: (v) => v.toFixed(0) });
    sim.slider('r', { label: 'Relación de compresión', min: 2, max: 22, step: 0.5, value: 10, fmt: (v) => v.toFixed(1) });
    sim.out('n', 'Exponente politrópico efectivo', { hl: true });
    sim.out('T', 'Temperatura máxima');
    sim.out('tau', 'Tiempo térmico <i>mc<sub>v</sub></i>/<i>hA</i>');
    const D = 0.08, L1 = 0.15, P1 = 100e3, T1 = 300, Rg = 287, cvg = 718, Tw = 300;
    const run = (tc, h, r) => {
      const V1 = (Math.PI * D * D / 4) * L1, V2 = V1 / r, m = (P1 * V1) / (Rg * T1);
      let T = T1; const N = 2000, dt = tc / N, out = [];
      for (let i = 0; i <= N; i++) {
        const t = i * dt, V = V1 - ((V1 - V2) * (1 - Math.cos((Math.PI * t) / tc))) / 2, dV = (-(V1 - V2) * Math.PI * Math.sin((Math.PI * t) / tc)) / (2 * tc);
        const L = V / (Math.PI * D * D / 4), A = Math.PI * D * L + (Math.PI * D * D) / 2;
        const P = (m * Rg * T) / V;
        out.push([t, V, P, T]);
        T += ((-P * dV + h * A * (Tw - T)) / (m * cvg)) * dt;
      }
      return { out, m, V1, V2 };
    };
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, W = cv.w, H = cv.h;
      EM.draw.clear(cv);
      const { out, m, V1, V2 } = run(p.tc, p.h, p.r);
      const last = out[out.length - 1], n = Math.log(last[2] / P1) / Math.log(V1 / V2);
      const pl = new EM.Plot(ctx, { x: 0, y: 0, w: W * 0.5, h: H, xmin: V2 * 0.8, xmax: V1 * 1.1, xlog: true, ymin: 80, ymax: P1 * Math.pow(p.r, 1.4) * 1.3 / 1e3, ylog: true, xlabel: 'V (m³)', ylabel: 'P (kPa)' });
      pl.frame();
      pl.fn((V) => (P1 * V1) / V / 1e3, { color: '--c3', width: 1.4, dash: [6, 4] });
      pl.fn((V) => (P1 * Math.pow(V1 / V, 1.4)) / 1e3, { color: '--c1', width: 1.4, dash: [6, 4] });
      pl.path(out.map((o) => [o[1], o[2] / 1e3]), { color: '--accent', width: 2.6 });
      pl.legend([{ label: 'isotérmica', color: '--c3', dash: [6, 4] }, { label: 'adiabática', color: '--c1', dash: [6, 4] }, { label: 'con transferencia', color: '--accent' }], 'tr');
      const Tmax = Math.max(...out.map((o) => o[3]));
      const p2 = new EM.Plot(ctx, { x: W * 0.5, y: 0, w: W * 0.5, h: H, xmin: 0, xmax: p.tc, ymin: 250, ymax: T1 * Math.pow(p.r, 0.4) * 1.1, xlabel: 't (s)', ylabel: 'T (K)' });
      p2.frame();
      p2.hline(T1 * Math.pow(p.r, 0.4), { color: '--c1', label: 'adiabática', labelRight: true });
      p2.path(out.map((o) => [o[0], o[3]]), { color: '--accent', width: 2.6 });
      const Am = Math.PI * D * L1 + (Math.PI * D * D) / 2;
      sim.set('n', EM.fix(n, 3));
      sim.set('T', EM.fix(Tmax, 1) + ' K (adiabática: ' + EM.fix(T1 * Math.pow(p.r, 0.4), 1) + ' K)');
      sim.set('tau', EM.fix((m * cvg) / (p.h * Am), 3) + ' s');
    });
  });

  /* 7.3 Rüchardt */
  const GG = { aire: ['Aire', 1.4], ar: ['Argón', 5 / 3], co2: ['CO₂', 1.289], he: ['Helio', 5 / 3], ch4: ['Metano', 1.304] };
  EM.defineSim('ruchardt', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });
    sim.select('g', { label: 'Gas en el frasco', options: Object.entries(GG).map(([k, v]) => [k, v[0] + ' (γ = ' + v[1].toFixed(3) + ')']), value: 'aire' });
    sim.slider('V', { label: 'Volumen del frasco', min: 1, max: 20, step: 0.5, value: 10, unit: 'L', fmt: (v) => v.toFixed(1) });
    sim.slider('m', { label: 'Masa de la esfera', min: 5, max: 50, step: 0.1, value: 16.6, unit: 'g', fmt: (v) => v.toFixed(1) });
    sim.slider('b', { label: 'Amortiguamiento (fricción y fuga)', min: 0, max: 0.05, step: 0.001, value: 0.008, unit: 'kg/s', fmt: (v) => v.toFixed(3) });
    sim.check('iso', { label: 'Oscilación isotérmica (hipotética)', value: false });
    sim.resetButton(() => reset());
    sim.out('T', 'Período medido', { hl: true });
    sim.out('g', 'γ despejado');
    sim.out('T0', 'Período teórico sin fricción');
    let y, v, t, hist, cross;
    const reset = () => { y = 0.03; v = 0; t = 0; hist = []; cross = []; };
    reset();
    sim.onChange = (id) => { if (id !== 'b') reset(); };
    const A = Math.PI * 0.008 * 0.008;
    const params = () => { const p = sim.p, m = p.m / 1000, V = p.V / 1000, P = 81900 + (m * TH.g) / A, gam = p.iso ? 1 : GG[p.g][1]; return { m, V, P, gam, k: (gam * P * A * A) / V }; };
    sim.animate((dt) => {
      if (!(dt > 0)) return;
      const { m, k } = params(), b = sim.p.b, N = 40, h = dt / N;
      for (let i = 0; i < N; i++) {
        const a = (-k * y - b * v) / m; v += a * h; const yn = y + v * h;
        if (y > 0 && yn <= 0) cross.push(t);
        y = yn; t += h;
      }
      hist.push([t, y]); if (hist.length > 1500) hist.shift();
      if (Math.abs(y) < 1e-5 && Math.abs(v) < 1e-4) reset();
    });
    sim.onDraw(() => {
      const ctx = cv.ctx, W = cv.w, H = cv.h;
      EM.draw.clear(cv);
      const { m, V, P, gam } = params();
      /* frasco y tubo */
      const fx = 40, fw = 110, fy = H * 0.45, fh = H * 0.45, tx = fx + fw / 2 - 8, tt = 20;
      ctx.fillStyle = EM.alpha('--c1', 0.12); ctx.fillRect(fx, fy, fw, fh);
      ctx.strokeStyle = EM.col('--ink-2'); ctx.lineWidth = 2; ctx.strokeRect(fx, fy, fw, fh);
      ctx.strokeRect(tx, tt, 16, fy - tt);
      const by = tt + (fy - tt) * 0.5 - y * 1500;
      ctx.fillStyle = EM.col('--c4'); ctx.beginPath(); ctx.arc(tx + 8, by, 8, 0, 7); ctx.fill();
      const pl = new EM.Plot(ctx, { x: 190, y: 0, w: W - 190, h: H, xmin: Math.max(0, t - 8), xmax: Math.max(8, t), ymin: -35, ymax: 35, xlabel: 't (s)', ylabel: 'y (mm)' });
      pl.frame();
      pl.path(hist.map(([a, b]) => [a, b * 1000]), { color: '--accent', width: 2 });
      let Tm = null;
      if (cross.length >= 3) { const c = cross.slice(-6); Tm = (c[c.length - 1] - c[0]) / (c.length - 1); }
      const T0 = 2 * Math.PI * Math.sqrt((m * V) / (gam * P * A * A));
      sim.set('T', Tm ? EM.fix(Tm, 4) + ' s' : 'midiendo…');
      sim.set('g', Tm ? EM.fix((4 * Math.PI * Math.PI * m * V) / (A * A * P * Tm * Tm), 3) : '—');
      sim.set('T0', EM.fix(T0, 4) + ' s (P = ' + EM.fix(P / 1e3, 2) + ' kPa en Popayán)');
    });
  });
})();

/* Capítulo 8 — Primera ley en volúmenes de control */
(function () {
  'use strict';
  const EM = window.EM, TH = EM.th, D = EM.diag;
  const k = 1.4, cp = 1005, Rg = 287;
  /* flujo isentrópico por un orificio: caudal por unidad de área (kg/s·m²) */
  const flux = (P0, T0, Pb) => {
    const r = Math.max(Pb / P0, Math.pow(2 / (k + 1), k / (k - 1)));
    return (P0 / Math.sqrt(Rg * T0)) * Math.sqrt(((2 * k) / (k - 1)) * (Math.pow(r, 2 / k) - Math.pow(r, (k + 1) / k)));
  };

  /* 8.1 Tobera convergente */
  EM.defineSim('tobera', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });

  EM.defineSim('llenado-tanque', function (sim) {

  /* 10.2 Ciclo de Carnot */
  EM.defineSim('carnot', function (sim) {

        (t) => { const V = V1 * Math.pow(V2 / V1, t); return [V, (R * TH_) / V, TH_, R * Math.log(V / V1)]; },
        (t) => { const T = TH_ + (TC - TH_) * t, V = V2 * Math.pow(TH_ / T, 1 / (k - 1)); return [V, (R * T) / V, T, R * Math.log(p.r)]; },
        (t) => { const V = V3 * Math.pow(V4 / V3, t); return [V, (R * TC) / V, TC, R * Math.log(p.r) + R * Math.log(V / V3)]; },
        (t) => { const T = TC + (TH_ - TC) * t, V = V4 * Math.pow(TC / T, 1 / (k - 1)); return [V, (R * T) / V, T, 0]; }

      ctx.fillStyle = EM.alpha('--c1', 0.08); ctx.fillRect(p2.X(0), p2.Y(TC), p2.X(R * Math.log(p.r)) - p2.X(0), p2.Y(0) - p2.Y(TC));

  });

  /* 10.4 Curzon–Ahlborn */
  EM.defineSim('curzon', function (sim) {

(function () {

  const cyclePath = (st, kinds, k = 1.4) => {
    const cv = R / (k - 1), out = [];

    for (let i = 0; i < st.length; i++) {
      const a = st[i], b = st[(i + 1) % st.length], kd = kinds[i];

        if (kd === 's') { v = a.v * Math.pow(b.v / a.v, t); T = a.T * Math.pow(a.v / v, k - 1); }

        else if (kd === 'p') { T = a.T + (b.T - a.T) * t; v = (a.v * T) / a.T; }
        else { T = a.T; v = a.v * Math.pow(b.v / a.v, t); }

      const cp = 1100; /* c_p medio de gases de escape */
      const b = TH.brayton({ rp: p.rp, T1: 300, T3: p.T3, etac: 0.88, etat: 0.9, cp: 1005 });
      const Pv = p.Pv * 1e6, Ts = W.Tsat(Pv), Tv = Math.min(873.15, b.T4 - 30);
      let res = null;
      if (Tv > Ts + 5) {
        const r = TH.rankine({ Ph: Pv, Pl: 8e3, T3: Tv, etat: 0.88, etap: 0.85 });
        const hv = r.s3.h, hpin = W.state(Pv, { x: 0 }).h;
        /* gas desde T4 hasta Ts + pinch evapora y sobrecalienta; el resto precalienta el agua */
        const ms = (cp * (b.T4 - (Ts + p.pinch))) / (hv - hpin);
        const Tstack = Math.max(330, Ts + p.pinch - (ms * (hpin - r.h2)) / cp);
        const Wg = b.wn, Wv = ms * r.wn, Q = b.qin;
        res = { r, ms, Tstack, eta: (Wg + Wv) / Q, Tv };
      }
      /* diagrama T–Q de la caldera de recuperación */
      const pl = new EM.Plot(ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: 0, xmax: 100, ymin: 280, ymax: Math.max(900, b.T4 + 50), xlabel: 'calor transferido en la caldera de recuperación (% del total)', ylabel: 'T (K)' });
      pl.frame();
      if (res) {
        const Qt = cp * (b.T4 - res.Tstack), x = (T) => (100 * cp * (b.T4 - T)) / Qt;
        pl.path([[0, b.T4], [100, res.Tstack]], { color: '--c2', width: 2.6 });
        const Qsup = res.ms * (res.r.s3.h - W.state(Pv, { x: 1 }).h), Qev = res.ms * W.satP(Pv).hfg;
        const q1 = (100 * Qsup) / Qt, q2 = q1 + (100 * Qev) / Qt;
        pl.path([[0, res.Tv], [q1, Ts], [q2, Ts], [100, TH.agua.state(Pv, { h: res.r.h2 }).T]], { color: '--c1', width: 2.6 });
        pl.legend([{ label: 'gases de escape', color: '--c2' }, { label: 'agua y vapor', color: '--c1' }], 'tr');
        pl.label(q2, Ts, 'punto de pinza', { dy: -8, size: 10.5, color: '--ink-2' });
      }
      sim.set('cc', res ? EM.fix(100 * res.eta, 2) + ' %' : 'el escape no alcanza para sobrecalentar el vapor');
      sim.set('g', EM.fix(100 * b.eta, 2) + ' % · ' + EM.fix(b.T4, 0) + ' K');
      sim.set('v', res ? EM.fix(100 * res.r.eta, 2) + ' % · ' + EM.fix(res.Tv - 273.15, 0) + ' °C' : '—');
      sim.set('m', res ? EM.fix(res.ms, 4) + ' kg · ' + EM.fix(res.Tstack - 273.15, 0) + ' °C' : '—');
    });
  });
})();

/* Capítulo 16 — Potenciales y relaciones termodinámicas */
(function () {
  'use strict';
  const EM = window.EM, TH = EM.th;
  const W = TH.agua, Rw = 461.52;
  /* presión de saturación sobre líquido (Wagner–Pruß, extrapolada por debajo del punto triple) y sobre hielo (IAPWS 2011) */
  const psatL = (T) => { const t = 1 - T / 647.096, a = [-7.85951783, 1.84408259, -11.7866497, 22.6807411, -15.9618719, 1.80122502], e = [1, 1.5, 3, 3.5, 4, 7.5]; let s = 0; for (let i = 0; i < 6; i++) s += a[i] * Math.pow(t, e[i]); return 22.064e6 * Math.exp((647.096 / T) * s); };

  /* 16.1 Energía de Gibbs de las fases */
  EM.defineSim('gibbs-fases', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });
    sim.slider('P', { label: 'Presión', min: 0.1, max: 500, step: 0.01, value: 81.9, unit: 'kPa', log: true, fmt: (v) => v.toFixed(v < 1 ? 3 : 1) });
    sim.out('st', 'Fase estable a cada temperatura', { hl: true });
    sim.out('Tm', 'Fusión · ebullición (o sublimación)');
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, P = p.P * 1e3;
      EM.draw.clear(cv);
      const Tm = 273.16 - 7.4e-8 * (P - 611.657), hsf = 333.6;
      const gv = (t) => (Rw * (t + 273.15) * Math.log(P / psatL(t + 273.15))) / 1000, gs = (t) => hsf * ((t + 273.15) / Tm - 1);
      const pl = new EM.Plot(ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: -40, xmax: 140, ymin: -60, ymax: 60, xlabel: 't (°C)', ylabel: 'g − g_{líquido} (kJ/kg)' });
      pl.frame();
      pl.hline(0, { color: '--c1', dash: [], width: 2.4, label: 'líquido' });
      pl.fn(gs, { color: '--c5', width: 2.4 });
      pl.fn(gv, { color: '--c2', width: 2.4 });
      /* envolvente estable */
      pl.fn((t) => Math.min(0, gs(t), gv(t)), { color: '--ink', width: 1, dash: [2, 3] });
      pl.legend([{ label: 'hielo', color: '--c5' }, { label: 'líquido', color: '--c1' }, { label: 'vapor', color: '--c2' }, { label: 'fase estable (mínimo)', color: '--ink', dash: [2, 3] }], 'tl');
      const Tb = TH.bisect((t) => gv(t), -40, 300, 1e-9);
      let Tsub = null; try { Tsub = TH.bisect((t) => gv(t) - gs(t), -80, 0.02, 1e-9); } catch (e) { /* */ }
      const liquidExists = Tb > Tm - 273.15;
      if (liquidExists) { pl.vline(Tm - 273.15, { color: '--c5', label: 'fusión' }); pl.vline(Tb, { color: '--c2', label: 'ebullición', labelY: 28 }); }
      else if (Tsub !== null) pl.vline(Tsub, { color: '--c5', label: 'sublimación' });
      sim.set('st', liquidExists ? 'hielo · líquido · vapor' : 'hielo · vapor (no hay líquido estable)');
      sim.set('Tm', liquidExists ? EM.fix(Tm - 273.15, 3) + ' °C · ' + EM.fix(Tb, 2) + ' °C' : 'sublimación a ' + EM.fix(Tsub, 2) + ' °C');
    });
  });

  /* 16.2 Comprobación de relaciones de Maxwell */
  EM.defineSim('maxwell-check', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });
    sim.seg('rel', { label: 'Relación', options: [['a', '(∂s/∂P)_T = −(∂v/∂T)_P'], ['b', '(∂T/∂P)_s = (∂v/∂s)_P']], value: 'a' });
    sim.slider('P', { label: 'Presión', min: 0.05, max: 15, step: 0.01, value: 1, unit: 'MPa', log: true, fmt: (v) => v.toFixed(2) });
    sim.slider('T', { label: 'Temperatura', min: 100, max: 600, step: 1, value: 300, unit: '°C', fmt: (v) => v.toFixed(0) });
    sim.out('L', 'Lado izquierdo', { hl: true });
    sim.out('R', 'Lado derecho');
    sim.out('e', 'Diferencia relativa');
    sim.out('ig', 'Gas ideal (referencia)');
    const sides = (rel, P, T) => {
      if (rel === 'a') { const dP = P * 1e-3, dT = 0.25; return [(W.sup(P + dP, T).s - W.sup(P - dP, T).s) / (2 * dP), -(W.sup(P, T + dT).v - W.sup(P, T - dT).v) / (2 * dT), -Rw / P]; }
      const s0 = W.sup(P, T).s, dP = P * 1e-3, ds = 1;
      const Tp = W.state(P + dP, { s: s0 }).T, Tm = W.state(P - dP, { s: s0 }).T;
      const vp = W.state(P, { s: s0 + ds }).v, vm = W.state(P, { s: s0 - ds }).v;
      return [(Tp - Tm) / (2 * dP), (vp - vm) / (2 * ds), (Rw * T) / (P * 2013)];
    };
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, P = p.P * 1e6;
      EM.draw.clear(cv);
      const Tlo = W.Tsat(P) + 3, Thi = 873;
      const T = Math.max(Tlo, p.T + 273.15);
      const pl = new EM.Plot(ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: Tlo - 273.15, xmax: 600, ymin: 0, ymax: 1, xlabel: 't (°C) a la presión elegida', ylabel: p.rel === 'a' ? '|derivada| (m³/kg·K)' : 'derivada (K/Pa)' });
      const xs = [], L = [], Rr = [];
      for (let i = 0; i <= 40; i++) { const t = Tlo + ((Thi - Tlo) * i) / 40; const s = sides(p.rel, P, t); xs.push(t - 273.15); L.push(Math.abs(s[0])); Rr.push(Math.abs(s[1])); }
      const mx = Math.max(...L, ...Rr) * 1.1;
      pl.set({ ymax: mx });
      pl.frame();
      pl.xy(xs, L, { color: '--accent', width: 4, alpha: 0.5 });
      pl.xy(xs, Rr, { color: '--c1', width: 1.6, dash: [5, 4] });
      const s = sides(p.rel, P, T);
      pl.dot(T - 273.15, Math.abs(s[0]), { color: '--accent' });
      pl.legend([{ label: 'lado izquierdo', color: '--accent', width: 4 }, { label: 'lado derecho', color: '--c1', dash: [5, 4] }], 'tr');
      sim.set('L', EM.sci(s[0], 5));

(function () {

  EM.defineSim('gibbs-reaccion', function (sim) {

    });
  });

  /* 18.2 Constantes de equilibrio y disociación */
  EM.defineSim('disociacion', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });
    sim.slider('T', { label: 'Temperatura', min: 1000, max: 3500, step: 10, value: 2500, unit: 'K', fmt: (v) => v.toFixed(0) });
    sim.slider('P', { label: 'Presión', min: 0.1, max: 50, step: 0.1, value: 1, unit: 'atm', log: true, fmt: (v) => v.toFixed(1) });
    sim.out('co2', 'CO₂ disociado', { hl: true });
    sim.out('h2o', 'H₂O disociada');

      pl.label(0.3, Tbub(0.3) + 0.65 * (tt - tb) * 0.18, 'vapor saturado (rocío)', { size: 10.5, color: '--c2', dy: -10 });
      /* escalones */

  EM.defineSim('coligativas', function (sim) {

(function () {
  'use strict';
  const EM = window.EM, TH = EM.th;
  const FUELS = ['CH4', 'C3H8', 'C4H10', 'C8H18', 'C2H5OH', 'H2', 'C'];
  const SPN = { CO2: 'CO₂', H2O: 'H₂O', N2: 'N₂', O2: 'O₂', CO: 'CO', H2: 'H₂' };
  const SPC = { CO2: '--c2', H2O: '--c1', N2: '--c6', O2: '--c3', CO: '--c4', H2: '--c5' };
  const formula = (f) => { const F = TH.FUEL[f]; const p = (n, s) => (n === 0 ? '' : s + (n === 1 ? '' : EM.sup ? String(n).replace(/\d/g, (d) => '₀₁₂₃₄₅₆₇₈₉'[d]) : n)); return f === 'C2H5OH' ? 'C₂H₅OH' : p(F.C, 'C') + p(F.H, 'H') + p(F.O, 'O'); };
  const fx = (n) => (Math.abs(n - Math.round(n)) < 1e-9 ? String(Math.round(n)) : EM.fix(n, 3));

  /* 19.1 Estequiometría */
  EM.defineSim('estequiometria', function (sim) {
    const cv = sim.canvas({ aspect: 2.2 });
    sim.select('f', { label: 'Combustible', options: FUELS.map((k) => [k, TH.FUEL[k].n]), value: 'CH4' });
    sim.slider('lam', { label: 'Fracción de aire teórico λ', min: 0.6, max: 3, step: 0.01, value: 1, fmt: (v) => v.toFixed(2) });
    sim.out('eq', 'Reacción balanceada', { hl: true });
    sim.out('af', 'Relación aire–combustible (masa)');
    sim.out('o2', 'O₂ en humos secos');
    sim.out('dp', 'Punto de rocío de los humos (1 atm)');
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, W = cv.w, H = cv.h;
      EM.draw.clear(cv);
      const c = TH.combustion(p.f, p.lam), pr = c.prod, n = Object.values(pr).reduce((a, b) => a + b, 0);
      const keys = Object.keys(pr).filter((k) => pr[k] > 1e-12);
      /* barra apilada de fracciones molares */
      let x = 40; const bw = W - 80, by = H * 0.35, bh = 46;
      EM.text(ctx, 'Composición molar de los productos', W / 2, by - 16, { size: 12, align: 'center', color: '--ink-2' });
      for (const k of keys) {
        const w = (bw * pr[k]) / n;
        ctx.fillStyle = EM.alpha(SPC[k], 0.7); ctx.fillRect(x, by, w, bh);
        if (w > 34) EM.text(ctx, SPN[k] + ' ' + EM.fix((100 * pr[k]) / n, 1) + ' %', x + w / 2, by + bh / 2 + 4, { size: 11, align: 'center', color: '--ink' });
        x += w;
      }
      const dry = n - pr.H2O;
      sim.set('eq', formula(p.f) + ' + ' + fx(c.a) + ' (O₂ + 3.76 N₂) → ' + keys.map((k) => fx(pr[k]) + ' ' + SPN[k]).join(' + '));
      sim.set('af', EM.fix(c.AF, 2) + ' kg de aire por kg de combustible');
      sim.set('o2', EM.fix((100 * pr.O2) / dry, 2) + ' %' + (pr.CO > 0 ? ' · CO ' + EM.fix((100 * pr.CO) / dry, 2) + ' %' : ''));
      sim.set('dp', pr.H2O > 0 ? EM.fix(TH.tsatW((pr.H2O / n) * 101325) - 273.15, 1) + ' °C' : '— (sin agua)');
    });
  });

  /* 19.2 Combustibles: poder calorífico y CO2 */
  const LIT = [
    ['Hidrógeno', TH.PCI('H2') / 1e6, 0, 0.0899, false],
    ['Gas natural (metano)', TH.PCI('CH4') / 1e6, 54.9, 0.68, false],
    ['GLP (propano)', TH.PCI('C3H8') / 1e6, 64.6, 1.88, false],
    ['Gasolina', 44.4, 69.4, 745, false],
    ['Diésel', 42.8, 74.1, 835, false],
    ['Etanol', TH.PCI('C2H5OH') / 1e6, 71.3, 789, true],
    ['Carbón bituminoso', 25.8, 94.6, 800, false],
    ['Leña seca', 15.6, 112, 450, true],
    ['Bagazo (50 % humedad)', 7.6, 100, 150, true]

  EM.defineSim('combustibles', function (sim) {

        ctx.fillStyle = EM.alpha(r[4] && !m ? '--c3' : m ? '--c1' : '--c2', 0.7);
        ctx.fillRect(pl.X(0), pl.Y(y + 0.32), pl.X(v) - pl.X(0), pl.Y(y - 0.32) - pl.Y(y + 0.32));

        EM.text(ctx, EM.fix(v, 1) + (r[4] && !m ? ' (biogénico)' : ''), pl.X(v) + 4, pl.Y(y) + 4, { size: 10.5, mono: true, color: '--ink-3' });

  EM.defineSim('llama', function (sim) {

    sim.slider('Tr', { label: 'Temperatura del aire de entrada', min: 298, max: 1000, step: 1, value: 298, unit: 'K', fmt: (v) => v.toFixed(0) });
    sim.out('T', 'Llama adiabática sin disociación', { hl: true });

      const p = sim.p, ctx = cv.ctx;

      const k = p.f + '|' + p.Tr;

        cache = { a: [], b: [] };

      }

      sim.set('Td', isFinite(Td) ? EM.fix(Td, 0) + ' K' : 'mezcla rica: no calculada');
    });
  });

  /* 19.4 Caldera */
  EM.defineSim('caldera', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });
    sim.select('f', { label: 'Combustible', options: [['CH4', 'Gas natural (metano)'], ['C3H8', 'GLP (propano)']], value: 'CH4' });
    sim.slider('lam', { label: 'Fracción de aire teórico λ', min: 1, max: 2.5, step: 0.01, value: 1.3, fmt: (v) => v.toFixed(2) });
    sim.slider('Ts', { label: 'Temperatura de los humos', min: 30, max: 400, step: 1, value: 200, unit: '°C', fmt: (v) => v.toFixed(0) });
    sim.out('e', 'Eficiencia (sobre el PCI)', { hl: true });
    sim.out('l', 'Pérdida sensible · latente recuperado');
    sim.out('o2', 'O₂ en humos secos');
    sim.out('dp', 'Punto de rocío de los humos');
    const T0 = 298.15;
    const eff = (f, lam, Ts) => {
      const c = TH.combustion(f, lam), F = TH.FUEL[f], PCI = TH.PCI(f) * F.M * 1e-3, n = Object.values(c.prod).reduce((a, b) => a + b, 0);
      let L = 0; for (const [k, nn] of Object.entries(c.prod)) L += nn * (TH.dhMol(k, Ts + 273.15) - TH.dhMol(k, T0));

      const Pv = TH.psatW(Ts + 273.15), dryn = n - c.prod.H2O, nvmax = Pv >= 101325 ? Infinity : (Pv / (101325 - Pv)) * dryn;

    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx;
      EM.draw.clear(cv);

/* Capítulo 20 — Entropía y microestados */
(function () {
  'use strict';
  const EM = window.EM, TH = EM.th;

  /* 20.1 Modelo de Ehrenfest */
  EM.defineSim('ehrenfest', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });
    sim.slider('N', { label: 'Número de partículas', min: 4, max: 1000, step: 1, value: 50, log: true, fmt: (v) => v.toFixed(0) });
    sim.slider('sp', { label: 'Saltos por segundo', min: 10, max: 5000, step: 10, value: 300, log: true, fmt: (v) => v.toFixed(0) });
    sim.resetButton(() => reset());
    sim.out('n', 'Partículas a la izquierda', { hl: true });
    sim.out('S', 'Entropía ln Ω(n) / ln Ω(N/2)');
    sim.out('p', 'Probabilidad de volver a tenerlas todas a la izquierda');
    let n, t, trace, hist, acc;
    const reset = () => { const N = Math.round(sim.p.N); n = N; t = 0; trace = [[0, N]]; hist = new Float64Array(N + 1); acc = 0; };
    reset();
    sim.onChange = (id) => { if (id === 'N') reset(); };
    sim.animate((dt) => {
      if (!(dt > 0)) return;
      const N = Math.round(sim.p.N);
      acc += dt * sim.p.sp;
      while (acc >= 1) { acc -= 1; if (Math.random() < n / N) n--; else n++; t++; hist[n]++; if (t % Math.max(1, Math.round(sim.p.sp / 60)) === 0) { trace.push([t, n]); if (trace.length > 1500) trace.shift(); } }
    });
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, W = cv.w, H = cv.h, N = Math.round(p.N);
      EM.draw.clear(cv);
      /* caja */
      const bx = 10, by = 14, bw = W * 0.28, bh = H * 0.42;
      ctx.strokeStyle = EM.col('--ink-2'); ctx.lineWidth = 2; ctx.strokeRect(bx, by, bw, bh);
      ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(bx + bw / 2, by); ctx.lineTo(bx + bw / 2, by + bh); ctx.stroke(); ctx.setLineDash([]);
      const show = Math.min(N, 300), sc = show / N;
      let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      for (let i = 0; i < show; i++) { const left = i < Math.round(n * sc); ctx.fillStyle = EM.col('--c1'); ctx.beginPath(); ctx.arc(bx + 4 + (left ? 0 : bw / 2) + rnd() * (bw / 2 - 8), by + 4 + rnd() * (bh - 8), 2.2, 0, 7); ctx.fill(); }
      /* traza */
      const pl = new EM.Plot(ctx, { x: W * 0.3, y: 0, w: W * 0.7, h: H * 0.55, xmin: trace[0][0], xmax: Math.max(trace[trace.length - 1][0], trace[0][0] + 10), ymin: 0, ymax: N, xlabel: 'saltos', ylabel: 'n izquierda', mb: 30 });
      pl.frame(); pl.hline(N / 2, { color: '--c3' }); pl.path(trace, { color: '--accent', width: 1.6 });
      /* histograma frente a binomial */
      const tot = hist.reduce((a, b) => a + b, 0) || 1;
      const p2 = new EM.Plot(ctx, { x: 0, y: H * 0.55, w: W, h: H * 0.45, xmin: 0, xmax: N, ymin: 0, ymax: Math.exp(TH.lnChoose(N, Math.floor(N / 2)) - N * Math.log(2)) * 1.3, xlabel: 'n', ylabel: 'P(n)', mb: 30 });
      p2.frame();
      ctx.fillStyle = EM.alpha('--c1', 0.4);
      for (let k = 0; k <= N; k++) if (hist[k]) { const x0 = p2.X(k - 0.5), x1 = p2.X(k + 0.5); ctx.fillRect(x0, p2.Y(hist[k] / tot), Math.max(1, x1 - x0), p2.Y(0) - p2.Y(hist[k] / tot)); }
      p2.fn((k) => Math.exp(TH.lnChoose(N, Math.round(k)) - N * Math.log(2)), { color: '--accent', width: 1.8 });
      sim.set('n', n + ' de ' + N);
      sim.set('S', EM.fix(TH.lnChoose(N, n) / TH.lnChoose(N, Math.floor(N / 2)), 4));
      sim.set('p', '2' + EM.sup('-' + N) + ' = ' + EM.sci(Math.pow(2, -N), 3));
    });
  });

  /* 20.2 Dos sólidos de Einstein */
  EM.defineSim('solidos-einstein', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });
    sim.slider('NA', { label: 'Osciladores del sólido A', min: 10, max: 600, step: 10, value: 300, fmt: (v) => v.toFixed(0) });
    sim.slider('NB', { label: 'Osciladores del sólido B', min: 10, max: 600, step: 10, value: 200, fmt: (v) => v.toFixed(0) });
    sim.slider('q', { label: 'Cuantos de energía en total', min: 10, max: 600, step: 10, value: 100, fmt: (v) => v.toFixed(0) });
    sim.resetButton(() => reset());
    sim.out('qa', '<i>q<sub>A</sub></i> actual · más probable', { hl: true });
    sim.out('T', 'Temperaturas <i>k<sub>B</sub>T</i>/ħω de A y B');
    sim.out('r', 'Probabilidad relativa del estado inicial');
    let osc, NA, NB, trace, t;
    const reset = () => { const p = sim.p; NA = p.NA; NB = p.NB; osc = new Int32Array(NA + NB); for (let i = 0; i < p.q; i++) osc[NA + Math.floor(Math.random() * NB)]++; trace = []; t = 0; };
    reset();
    sim.onChange = reset;
    const qA = () => { let s = 0; for (let i = 0; i < NA; i++) s += osc[i]; return s; };
    sim.animate((dt) => {
      if (!(dt > 0)) return;
      for (let k = 0; k < 300; k++) { const a = Math.floor(Math.random() * osc.length); if (osc[a] === 0) continue; const b = Math.floor(Math.random() * osc.length); osc[a]--; osc[b]++; }
      t++; trace.push([t, qA()]); if (trace.length > 600) trace.shift();
    });
    const Tof = (N, q) => 1 / Math.log(1 + N / Math.max(q, 1e-9)); /* k_BT/ħω de un sólido de Einstein */
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, W = cv.w, H = cv.h, q = p.q;
      EM.draw.clear(cv);
      const lnO = (a) => TH.lnOmegaE(NA, a) + TH.lnOmegaE(NB, q - a);
      let best = 0; for (let a = 0; a <= q; a++) if (lnO(a) > lnO(best)) best = a;
      const pl = new EM.Plot(ctx, { x: 0, y: 0, w: W / 2, h: H, xmin: 0, xmax: q, ymin: lnO(0) - 2, ymax: lnO(best) + 3, xlabel: 'q_A', ylabel: 'ln(Ω_A Ω_B)' });
      pl.frame();
      pl.fn((a) => lnO(Math.round(a)), { color: '--accent', width: 2.4 });
      const cur = qA();
      pl.vline(best, { color: '--c3', label: 'máximo' });
      pl.dot(cur, lnO(cur), { color: '--c1', r: 6 });
      const p2 = new EM.Plot(ctx, { x: W / 2, y: 0, w: W / 2, h: H, xmin: trace.length ? trace[0][0] : 0, xmax: Math.max(10, trace.length ? trace[trace.length - 1][0] : 10), ymin: 0, ymax: q, xlabel: 'tiempo (pasos)', ylabel: 'q_A' });
      p2.frame(); p2.hline(best, { color: '--c3' }); p2.path(trace, { color: '--c1', width: 1.8 });
      sim.set('qa', cur + ' · ' + best + ' (= q·N_A/(N_A+N_B) = ' + EM.fix((q * NA) / (NA + NB), 1) + ')');
      sim.set('T', EM.fix(Tof(NA, cur), 3) + ' · ' + EM.fix(Tof(NB, q - cur), 3));
      sim.set('r', 'exp(' + EM.fix(lnO(0) - lnO(best), 1) + ') = ' + EM.sci(Math.exp(lnO(0) - lnO(best)), 2));
    });
  });

  /* 20.3 Intercambio aleatorio de cuantos */
  EM.defineSim('intercambio', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });
    sim.slider('N', { label: 'Número de osciladores', min: 100, max: 5000, step: 100, value: 2000, fmt: (v) => v.toFixed(0) });
    sim.slider('m', { label: 'Cuantos por oscilador al inicio', min: 1, max: 10, step: 1, value: 3, fmt: (v) => v.toFixed(0) });
    sim.resetButton(() => reset());
    sim.out('S', 'Entropía por oscilador (en <i>k<sub>B</sub></i>)', { hl: true });
    sim.out('Sm', 'Máximo teórico');
    sim.out('t', 'Intercambios realizados');
    let osc, t, Strace;
    const reset = () => { osc = new Int32Array(sim.p.N).fill(sim.p.m); t = 0; Strace = []; };
    reset();
    sim.onChange = reset;
    const Sof = () => {
      /* entropía de la distribución de ocupaciones: ln de la multiplicidad multinomial por oscilador */
      const cnt = new Map(); for (const v of osc) cnt.set(v, (cnt.get(v) || 0) + 1);
      let S = 0; for (const c of cnt.values()) { const pr = c / osc.length; S -= pr * Math.log(pr); }
      return S;
    };
    sim.animate((dt) => {
      if (!(dt > 0)) return;
      const N = osc.length;
      for (let k = 0; k < 4000; k++) { const a = Math.floor(Math.random() * N); if (osc[a] === 0) continue; const b = Math.floor(Math.random() * N); osc[a]--; osc[b]++; t++; }
      Strace.push([t, Sof()]); if (Strace.length > 500) Strace.shift();
    });
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, W = cv.w, H = cv.h, N = osc.length, m = p.m;
      EM.draw.clear(cv);
      const nmax = Math.max(10, 6 * m), hist = new Float64Array(nmax + 1);
      for (const v of osc) if (v <= nmax) hist[v]++;

      const pl = new EM.Plot(ctx, { x: 0, y: 0, w: W * 0.6, h: H, xmin: -0.5, xmax: nmax + 0.5, ymin: 0, ymax: Math.max(1 - x, 0.05) * 1.2, xlabel: 'cuantos n de un oscilador', ylabel: 'fracción de osciladores' });

      pl.fn((k) => (1 - x) * Math.pow(x, k), { color: '--accent', width: 2.4 });
      pl.legend([{ label: 'simulación', color: '--c1', kind: 'sq' }, { label: 'Boltzmann (1 − x)xⁿ', color: '--accent' }], 'tr');
      const Smax = (1 + m) * Math.log(1 + m) - m * Math.log(m);
      const p2 = new EM.Plot(ctx, { x: W * 0.6, y: 0, w: W * 0.4, h: H, xmin: Strace.length ? Strace[0][0] : 0, xmax: Strace.length ? Math.max(Strace[Strace.length - 1][0], 1) : 1, ymin: 0, ymax: Smax * 1.2, xlabel: 'intercambios', ylabel: 'S/(N k_B)' });
      p2.frame(); p2.hline(Smax, { color: '--c3', label: 'máximo' }); p2.path(Strace, { color: '--accent', width: 2 });
      sim.set('S', EM.fix(Strace.length ? Strace[Strace.length - 1][1] : 0, 4));
      sim.set('Sm', EM.fix(Smax, 4) + ' = (1+m) ln(1+m) − m ln m, con m cuantos medios');
      sim.set('t', t.toLocaleString('es-CO'));
    });
  });

  /* 20.4 Sackur–Tetrode */
  const NOB = { He: ['Helio', 4.0026, 126.153, '--c5'], Ne: ['Neón', 20.1797, 146.328, '--c4'], Ar: ['Argón', 39.948, 154.846, '--c1'], Kr: ['Kriptón', 83.798, 164.085, '--c3'], Xe: ['Xenón', 131.293, 169.685, '--c2'] };

      const p = sim.p, ctx = cv.ctx, P = p.P * 1e5;
      EM.draw.clear(cv);
      const pl = new EM.Plot(ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: 5, xmax: 2000, xlog: true, ymin: 0, ymax: 250, xlabel: 'T (K)', ylabel: 'S° (J/mol·K)' });
      pl.frame();
      for (const k of Object.keys(NOB)) { pl.fn((T) => TH.sackur(NOB[k][1], T, P), { color: NOB[k][3], width: 2 }); pl.dot(298.15, NOB[k][2] - TH.R * Math.log(p.P), { color: NOB[k][3], r: 4 }); }

/* Capítulo 21 — Distribución de Boltzmann y función de partición */
(function () {
  'use strict';
  const EM = window.EM, TH = EM.th;

  /* 21.1 Sistema de dos niveles */
  EM.defineSim('dos-niveles', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });
    sim.slider('t', { label: 'Temperatura reducida <i>k<sub>B</sub>T</i>/Δ', min: 0.02, max: 4, step: 0.005, value: 0.417, log: true, fmt: (v) => v.toFixed(3) });
    sim.out('p', 'Población del nivel superior', { hl: true });
    sim.out('u', 'Energía media <i>U</i>/(<i>N</i>Δ)');
    sim.out('c', 'Capacidad calorífica <i>C</i>/(<i>Nk<sub>B</sub></i>)');
    sim.out('s', 'Entropía <i>S</i>/(<i>Nk<sub>B</sub></i>)');
    const pu = (t) => 1 / (Math.exp(1 / t) + 1);
    const S = (t) => { const p = pu(t), q = 1 - p; return -(p > 0 ? p * Math.log(p) : 0) - (q > 0 ? q * Math.log(q) : 0); };
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, W = cv.w, H = cv.h;
      EM.draw.clear(cv);
      const pl = new EM.Plot(ctx, { x: 0, y: 0, w: W * 0.72, h: H, xmin: 0.02, xmax: 4, xlog: true, ymin: 0, ymax: 0.75, xlabel: 'k_BT/Δ', ylabel: 'por partícula' });
      pl.frame();
      pl.fn(pu, { color: '--c1', width: 2.2 });
      pl.fn(TH.schottky, { color: '--accent', width: 2.6 });
      pl.fn(S, { color: '--c3', width: 2.2 });
      pl.hline(Math.log(2), { color: '--c3', label: 'ln 2', labelRight: true });
      pl.vline(p.t, { color: '--ink-3' });
      pl.legend([{ label: 'población superior = U/(NΔ)', color: '--c1' }, { label: 'C/(Nk_B): Schottky', color: '--accent' }, { label: 'S/(Nk_B)', color: '--c3' }], 'tl');
      /* diagrama de niveles */
      const x0 = W * 0.78, x1 = W * 0.96, y0 = H * 0.75, y1 = H * 0.25, up = pu(p.t);
      ctx.strokeStyle = EM.col('--ink'); ctx.lineWidth = 2;
      for (const y of [y0, y1]) { ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); }
      const nd = 40; let seed = 3; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      const nu = Math.round(nd * up);
      for (let i = 0; i < nd; i++) { const top = i < nu; ctx.fillStyle = EM.col(top ? '--c2' : '--c1'); ctx.beginPath(); ctx.arc(x0 + 6 + rnd() * (x1 - x0 - 12), (top ? y1 : y0) - 6 - rnd() * 14, 3, 0, 7); ctx.fill(); }
      EM.text(ctx, 'E = Δ', x1 + 4, y1 + 4, { size: 11, color: '--ink-2' }); EM.text(ctx, 'E = 0', x1 + 4, y0 + 4, { size: 11, color: '--ink-2' });
      sim.set('p', EM.fix(100 * up, 2) + ' %');
      sim.set('u', EM.fix(up, 4));
      sim.set('c', EM.fix(TH.schottky(p.t), 4));
      sim.set('s', EM.fix(S(p.t), 4) + ' (ln 2 = 0.6931)');
    });
  });

  /* 21.2 Poblaciones rotacionales y espectro */
  const MOL = { CO: ['CO', 2.77, 2143], HCl: ['HCl', 15.2, 2886], N2O: ['NO', 2.45, 1876] };
  EM.defineSim('rotacional', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });
    sim.select('m', { label: 'Molécula', options: Object.entries(MOL).map(([k, v]) => [k, v[0] + ' (Θr = ' + v[1] + ' K)']), value: 'CO' });
    sim.slider('T', { label: 'Temperatura', min: 5, max: 2000, step: 1, value: 300, unit: 'K', log: true, fmt: (v) => v.toFixed(0) });
    sim.out('j', 'Nivel más poblado', { hl: true });
    sim.out('q', 'Función de partición rotacional (exacta · <i>T</i>/Θ<sub>r</sub>)');
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, W = cv.w, H = cv.h;

      const P = w.map((v) => v / Z), mx = Math.max(...P);

      pl.frame();
      ctx.fillStyle = EM.alpha('--c1', 0.6);
      P.forEach((v, J) => { if (J <= 40) ctx.fillRect(pl.X(J - 0.35), pl.Y(v), pl.X(0.7) - pl.X(0), pl.Y(0) - pl.Y(v)); });
      const span = Math.max(40, 2 * B * 45);
      const p2 = new EM.Plot(ctx, { x: W * 0.4, y: 0, w: W * 0.6, h: H, xmin: nu0 - span * 1.1, xmax: nu0 + span * 1.1, ymin: 0, ymax: mx * 1.15, xlabel: 'número de onda (cm⁻¹)', ylabel: 'intensidad relativa' });
      p2.frame();
      for (let J = 0; J <= Jm; J++) {
        const vr = nu0 + 2 * B * (J + 1); if (vr < p2.o.xmax) p2.path([[vr, 0], [vr, P[J]]], { color: '--c2', width: 1.6 });
        if (J >= 1) { const vp = nu0 - 2 * B * J; if (vp > p2.o.xmin) p2.path([[vp, 0], [vp, P[J]]], { color: '--c1', width: 1.6 }); }
      }
      p2.label(nu0 + span * 0.5, mx * 1.05, 'rama R', { size: 11, color: '--c2', align: 'center' });
      p2.label(nu0 - span * 0.5, mx * 1.05, 'rama P', { size: 11, color: '--c1', align: 'center' });
      sim.set('j', 'J = ' + jbest + ' (fórmula: ' + EM.fix(Math.sqrt(p.T / (2 * th)) - 0.5, 2) + ')');
      sim.set('q', EM.fix(Z, 3) + ' · ' + EM.fix(p.T / th, 3));
    });
  });

  /* 21.3 Paramagnetismo */
  const brill = (J, x) => { if (Math.abs(x) < 1e-8) return ((J + 1) / (3 * J)) * x; const a = (2 * J + 1) / (2 * J), b = 1 / (2 * J); return a / Math.tanh(a * x) - b / Math.tanh(b * x); };
  const lang = (x) => (Math.abs(x) < 1e-6 ? x / 3 : 1 / Math.tanh(x) - 1 / x);
  EM.defineSim('paramagnetismo', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });
    sim.slider('B', { label: 'Campo magnético', min: 0.01, max: 20, step: 0.01, value: 5, unit: 'T', log: true, fmt: (v) => v.toFixed(2) });
    sim.slider('T', { label: 'Temperatura', min: 0.5, max: 300, step: 0.1, value: 2, unit: 'K', log: true, fmt: (v) => v.toFixed(1) });
    sim.seg('J', { label: 'Momento angular del ion', options: [['0.5', 'J = ½'], ['1.5', 'J = 3/2'], ['3.5', 'J = 7/2 (Gd³⁺)']], value: '3.5' });
    sim.out('x', 'Parámetro <i>gμ<sub>B</sub>JB</i>/<i>k<sub>B</sub>T</i>', { hl: true });
    sim.out('m', 'Magnetización relativa <i>M</i>/<i>M<sub>s</sub></i>');
    sim.out('c', 'Ley de Curie (campo débil)');
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, J = +p.J;

      const muB = 9.2740100783e-24, x = (2 * muB * J * p.B) / (TH.kB * p.T);
      const pl = new EM.Plot(ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: 0, xmax: 10, ymin: 0, ymax: 1.1, xlabel: 'gμ_BJB/k_BT', ylabel: 'M/M_s' });
      pl.frame();
      [['0.5', '--c1'], ['1.5', '--c3'], ['3.5', '--c2']].forEach(([j, c]) => pl.fn((xx) => brill(+j, xx), { color: c, width: j === p.J ? 2.8 : 1.4 }));
      pl.fn(lang, { color: '--c6', width: 1.4, dash: [5, 4] });
      pl.fn((xx) => ((J + 1) / (3 * J)) * xx, { color: '--ink-3', width: 1, dash: [3, 3], to: 3 });
      pl.dot(Math.min(x, 10), brill(J, x), { color: '--accent', r: 6 });
      pl.legend([{ label: 'Brillouin J = ½', color: '--c1' }, { label: 'J = 3/2', color: '--c3' }, { label: 'J = 7/2', color: '--c2' }, { label: 'Langevin (clásico)', color: '--c6', dash: [5, 4] }, { label: 'Curie, recta inicial', color: '--ink-3', dash: [3, 3] }], 'br');

  /* 21.4 Modelo de Ising 2D */
  EM.defineSim('ising', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });
    sim.slider('T', { label: 'Temperatura <i>k<sub>B</sub>T</i>/<i>J</i>', min: 1, max: 4, step: 0.01, value: 2.27, fmt: (v) => v.toFixed(2) });
    sim.slider('h', { label: 'Campo externo <i>h</i>/<i>J</i>', min: -0.5, max: 0.5, step: 0.01, value: 0, fmt: (v) => v.toFixed(2) });
    sim.seg('init', { label: 'Estado inicial', options: [['rand', 'Al azar'], ['up', 'Todo hacia arriba']], value: 'rand' });
    sim.resetButton(() => reset());
    sim.out('m', 'Magnetización |<i>M</i>| (media reciente)', { hl: true });
    sim.out('o', 'Valor exacto de Onsager–Yang');
    sim.out('e', 'Energía por espín');
    const L = 96, N = L * L;
    let s, mh, img, off, offc;
    const reset = () => { s = new Int8Array(N); for (let i = 0; i < N; i++) s[i] = sim.p.init === 'up' ? 1 : Math.random() < 0.5 ? 1 : -1; mh = []; };
    reset();
    sim.onChange = (id) => { if (id === 'init') reset(); };
    sim.animate((dt) => {
      if (!(dt > 0)) return;
      const b = 1 / sim.p.T, h = sim.p.h;
      for (let sw = 0; sw < 3; sw++) {
        for (let k = 0; k < N; k++) {
          const i = (Math.random() * N) | 0, x = i % L, y = (i / L) | 0;
          const nb = s[((y + L - 1) % L) * L + x] + s[((y + 1) % L) * L + x] + s[y * L + ((x + L - 1) % L)] + s[y * L + ((x + 1) % L)];
          const dE = 2 * s[i] * (nb + h);
          if (dE <= 0 || Math.random() < Math.exp(-b * dE)) s[i] = -s[i];
        }
        let M = 0; for (let i = 0; i < N; i++) M += s[i];
        mh.push(Math.abs(M) / N); if (mh.length > 150) mh.shift();
      }
    });
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, W = cv.w, H = cv.h;
      EM.draw.clear(cv);
      if (!off) { off = document.createElement('canvas'); off.width = L; off.height = L; offc = off.getContext('2d'); img = offc.createImageData(L, L); }
      const up = EM.rgb('--c2'), dn = EM.rgb('--c1');
      for (let i = 0; i < N; i++) { const c = s[i] > 0 ? up : dn; img.data[4 * i] = c[0]; img.data[4 * i + 1] = c[1]; img.data[4 * i + 2] = c[2]; img.data[4 * i + 3] = 255; }
      offc.putImageData(img, 0, 0);
      const side = H - 16; ctx.imageSmoothingEnabled = false; ctx.drawImage(off, 8, 8, side, side);
      const Tc = 2 / Math.log(1 + Math.SQRT2), exact = (T) => (T < Tc ? Math.pow(1 - Math.pow(Math.sinh(2 / T), -4), 1 / 8) : 0);
      const pl = new EM.Plot(ctx, { x: side + 16, y: 0, w: W - side - 16, h: H, xmin: 1, xmax: 4, ymin: 0, ymax: 1.05, xlabel: 'k_BT/J', ylabel: '|M|' });
      pl.frame();
      pl.fn(exact, { color: '--c3', width: 2.2, n: 300 });
      pl.vline(Tc, { label: 'T_c = 2.269' });
      const mavg = mh.length ? mh.reduce((a, b) => a + b, 0) / mh.length : 0;
      pl.dot(p.T, mavg, { color: '--accent', r: 6 });
      let E = 0; for (let y = 0; y < L; y++) for (let x = 0; x < L; x++) { const i = y * L + x; E -= s[i] * (s[y * L + ((x + 1) % L)] + s[((y + 1) % L) * L + x]) + p.h * s[i]; }
      sim.set('m', EM.fix(mavg, 3));
      sim.set('o', EM.fix(exact(p.T), 3) + (Math.abs(p.h) > 0 ? ' (para h = 0)' : ''));
      sim.set('e', EM.fix(E / N, 3) + ' J');
    });
  });
})();

/* Capítulo 22 — Gases cuánticos y radiación */
(function () {
  'use strict';
  const EM = window.EM, TH = EM.th;

  /* 22.1 Distribuciones */
  EM.defineSim('distribuciones', function (sim) {

    sim.out('mb', 'Maxwell–Boltzmann');
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx;
      EM.draw.clear(cv);
      const fd = (x) => 1 / (Math.exp(x) + 1), be = (x) => (x > 0 ? 1 / Math.expm1(x) : NaN), mb = (x) => Math.exp(-x);
      const pl = new EM.Plot(ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: -4, xmax: 6, ymin: 0, ymax: 2.2, xlabel: '(ε − μ)/k_BT', ylabel: 'ocupación media n̄' });
      pl.frame();

      sim.set('fd', EM.fix(fd(p.x), 5));
      sim.set('be', p.x > 0 ? EM.fix(be(p.x), 5) : 'no definida (ε ≤ μ)');

  /* 22.2 Gas de fotones */
  EM.defineSim('foton-gas', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });
    sim.slider('T', { label: 'Temperatura', min: 1, max: 10000, step: 0.0001, value: 2.7255, unit: 'K', log: true, fmt: (v) => (v < 10 ? v.toFixed(4) : v.toFixed(0)) });
    sim.out('nu', 'Máximo de <i>u<sub>ν</sub></i>', { hl: true });
    sim.out('u', 'Densidad de energía · presión');
    sim.out('n', 'Fotones por cm³ · energía media');
    sim.out('s', 'Entropía por unidad de volumen');
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, T = p.T;
      EM.draw.clear(cv);
      const a = (4 * TH.sigma) / TH.c0, numax = (2.821439 * TH.kB * T) / TH.h;
      const unu = (nu) => ((8 * Math.PI * TH.h * nu * nu * nu) / Math.pow(TH.c0, 3)) / Math.expm1((TH.h * nu) / (TH.kB * T));
      const pl = new EM.Plot(ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: numax / 30, xmax: numax * 8, xlog: true, ymin: 0, ymax: 1.15, xlabel: 'frecuencia ν (Hz)', ylabel: 'u_ν / u_ν(máximo)' });
      const u0 = unu(numax);

      pl.fn((nu) => unu(nu) / u0, { color: '--accent', width: 2.6, fill: '--accent', fillAlpha: 0.1 });
      pl.fn((nu) => (8 * Math.PI * nu * nu * TH.kB * T) / Math.pow(TH.c0, 3) / u0, { color: '--c1', width: 1.4, dash: [5, 4] });
      pl.vline(numax, { color: '--c3', label: 'máximo' });
      pl.legend([{ label: 'Planck', color: '--accent' }, { label: 'Rayleigh–Jeans (clásico)', color: '--c1', dash: [5, 4] }], 'tr');
      const u = a * Math.pow(T, 4), n = 0.2436 * Math.pow((TH.kB * T) / (TH.hbar * TH.c0), 3);
      sim.set('nu', EM.si(numax, 'Hz') + ' (c/ν = ' + EM.si(TH.c0 / numax, 'm') + '; el máximo en longitud de onda está en ' + EM.si(TH.wienB / T, 'm') + ')');
      sim.set('u', EM.sci(u, 4) + ' J/m³ · ' + EM.sci(u / 3, 4) + ' Pa');
      sim.set('n', EM.sci(n / 1e6, 4) + ' · ' + EM.fix(u / n / (TH.kB * T), 3) + ' k_BT');
      sim.set('s', EM.sci((4 * u) / (3 * T), 4) + ' J/K·m³');
    });
  });

  /* 22.3 Electrones en un metal */
  const MET = { cu: ['Cobre', 8.47e28, 0.695], al: ['Aluminio', 18.1e28, 1.35], na: ['Sodio', 2.65e28, 1.38], ag: ['Plata', 5.86e28, 0.646], au: ['Oro', 5.9e28, 0.729] };
  EM.defineSim('fermi', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });
    sim.select('m', { label: 'Metal', options: Object.entries(MET).map(([k, v]) => [k, v[0]]), value: 'cu' });
    sim.slider('T', { label: 'Temperatura', min: 1, max: 100000, step: 1, value: 300, unit: 'K', log: true, fmt: (v) => v.toFixed(0) });
    sim.out('ef', 'Energía y temperatura de Fermi', { hl: true });
    sim.out('w', 'Ancho térmico <i>k<sub>B</sub>T</i>/<i>E<sub>F</sub></i>');
    sim.out('g', 'γ electrones libres · medido (mJ/mol·K²)');
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, [, n, gm] = MET[p.m];
      EM.draw.clear(cv);
      const EF = TH.fermiE(n) / TH.eV, kT = (TH.kB * p.T) / TH.eV, TF = (EF * TH.eV) / TH.kB;
      /* potencial químico aproximado (Sommerfeld) para T ≪ T_F */
      const mu = p.T < 0.3 * TF ? EF * (1 - (Math.PI * Math.PI / 12) * Math.pow(p.T / TF, 2)) : EF * (1 - (Math.PI * Math.PI / 12) * 0.09);
      const fd = (e) => 1 / (Math.exp((e - mu) / kT) + 1);
      const emax = Math.max(EF * 1.5, mu + 8 * kT);
      const pl = new EM.Plot(ctx, { x: 0, y: 0, w: cv.w, h: cv.h, xmin: 0, xmax: emax, ymin: 0, ymax: 1.25, xlabel: 'energía ε (eV)', ylabel: 'n̄(ε) · g(ε)n̄(ε) relativa' });
      pl.frame();
      pl.fn((e) => (Math.sqrt(e / EF) * fd(e)), { color: '--c1', width: 0, fill: '--c1', fillAlpha: 0.2 });
      pl.fn(fd, { color: '--accent', width: 2.6 });
      pl.fn((e) => (e < EF ? 1 : 0), { color: '--ink-3', width: 1, dash: [4, 3] });
      pl.vline(EF, { label: 'E_F' });
      sim.set('ef', EM.fix(EF, 3) + ' eV · ' + EM.fix(TF, 0) + ' K');
      sim.set('w', EM.fix(kT / EF, 6) + (p.T > 0.3 * TF ? ' (el gas deja de ser degenerado; μ es aproximado)' : ''));
      sim.set('g', EM.fix(((Math.PI * Math.PI) / 2) * (TH.R / TF) * 1000, 3) + ' · ' + gm + ' (Kittel, tabla 6.3)');
    });
  });

  /* 22.4 Condensado de Bose–Einstein */
  EM.defineSim('bec', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });
    sim.select('a', { label: 'Átomo', options: [['86.909', 'Rubidio-87'], ['22.99', 'Sodio-23'], ['6.015', 'Litio-6 (fermión: no condensa)'], ['4.0026', 'Helio-4']], value: '86.909' });
    sim.slider('n', { label: 'Densidad', min: 1e18, max: 1e21, step: 1e17, value: 2.5e19, unit: 'm⁻³', log: true, fmt: (v) => EM.sci(v, 2) });
    sim.slider('T', { label: 'Temperatura', min: 1, max: 2000, step: 1, value: 100, unit: 'nK', log: true, fmt: (v) => v.toFixed(0) });
    sim.out('tc', 'Temperatura crítica', { hl: true });
    sim.out('f', 'Fracción condensada');
    sim.out('l', '<i>n</i>λ³ (≥ 2.612 para condensar)');
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, W = cv.w, H = cv.h, M = +p.a;
      EM.draw.clear(cv);
      const ferm = p.a === '6.015';
      const Tc = TH.becTc(M, p.n) * 1e9, f = !ferm && p.T < Tc ? 1 - Math.pow(p.T / Tc, 1.5) : 0;
      const lam = TH.h / Math.sqrt(2 * Math.PI * ((M * 1e-3) / TH.NA) * TH.kB * p.T * 1e-9);
      const pl = new EM.Plot(ctx, { x: 0, y: 0, w: W * 0.55, h: H, xmin: 0, xmax: 1.5, ymin: 0, ymax: 1.05, xlabel: 'T/T_c', ylabel: 'N₀/N' });
      pl.frame();
      if (!ferm) pl.fn((t) => (t < 1 ? 1 - Math.pow(t, 1.5) : 0), { color: '--accent', width: 2.6 });
      pl.dot(p.T / Tc, f, { color: '--c1', r: 6 });
      /* nube: térmica (gaussiana ancha) + condensado (pico central) */
      const cx = W * 0.78, cy = H * 0.5, R = Math.min(W * 0.2, H * 0.42);
      let seed = 11; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      const g = () => { let u = 0, v = 0; while (u === 0) u = rnd(); v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
      const Nd = 900;
      for (let i = 0; i < Nd; i++) { const cond = i < Nd * f; const s = cond ? 0.08 : 0.38; ctx.fillStyle = EM.alpha(cond ? '--c2' : '--c1', cond ? 0.6 : 0.35); ctx.beginPath(); ctx.arc(cx + g() * s * R, cy + g() * s * R, 1.6, 0, 7); ctx.fill(); }

      sim.set('tc', ferm ? 'el litio-6 es un fermión: no hay condensación de Bose' : EM.fix(Tc, 1) + ' nK');
      sim.set('f', EM.fix(100 * f, 1) + ' %');
      sim.set('l', EM.fix(p.n * lam * lam * lam, 3));
    });
  });

  /* 22.5 Debye y electrones */
  EM.defineSim('debye', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });

      }
      sim.set('c3', EM.fix(b * 1000, 5));
      sim.set('x', g > 0 ? EM.fix(Math.sqrt(g / b), 2) + ' K' : '—');
    });
  });
})();

/* Capítulo 23 — Termodinámica fuera del equilibrio */
(function () {
  'use strict';
  const EM = window.EM, TH = EM.th;

  /* 23.1 Producción de entropía en una barra */
  EM.defineSim('produccion-entropia', function (sim) {
    const cv = sim.canvas({ aspect: 2.0 });
    sim.slider('TH', { label: 'Foco caliente', min: 310, max: 800, step: 1, value: 500, unit: 'K', fmt: (v) => v.toFixed(0) });
    sim.slider('TC', { label: 'Foco frío', min: 250, max: 400, step: 1, value: 300, unit: 'K', fmt: (v) => v.toFixed(0) });
    sim.slider('k', { label: 'Material (conductividad)', min: 1, max: 400, step: 1, value: 50, unit: 'W/m·K', log: true, fmt: (v) => v.toFixed(0) });
    sim.resetButton(() => reset());
    sim.out('S', 'Producción total de entropía', { hl: true });
    sim.out('Sst', 'Valor estacionario <i>Q̇</i>(1/<i>T<sub>C</sub></i> − 1/<i>T<sub>H</sub></i>)');
    sim.out('Q', 'Calor que entra · que sale');
    const N = 50, L = 0.2, A = 1e-4, rho = 7800, c = 470;
    let T, t;
    const reset = () => { T = new Float64Array(N).fill(sim.p.TC); T[0] = sim.p.TH; t = 0; };
    reset();
    sim.onChange = (id) => { if (id !== 'k') reset(); };
    sim.animate((dt) => {
      if (!(dt > 0)) return;
      const D = sim.p.k / (rho * c), dx = L / (N - 1), tau = (L * L) / D, simdt = dt * tau * 0.03, hmax = (0.4 * dx * dx) / D, n = Math.min(3000, Math.ceil(simdt / hmax));
      for (let i = 0; i < n; i++) T = TH.heatStep(T, D, dx, simdt / n, sim.p.TH, sim.p.TC);
      t += simdt;
    });
    sim.onDraw(() => {
      const p = sim.p, ctx = cv.ctx, W = cv.w, H = cv.h;
      EM.draw.clear(cv);
      const dx = L / (N - 1), xs = [], sig = [];
      let S = 0;
      for (let i = 0; i < N - 1; i++) { const g = (T[i + 1] - T[i]) / dx, Tm = (T[i] + T[i + 1]) / 2, s = (p.k * g * g) / (Tm * Tm); xs.push((i + 0.5) * dx * 100); sig.push(s / 1000); S += s * dx * A; }
      const pl = new EM.Plot(ctx, { x: 0, y: 0, w: W / 2, h: H, xmin: 0, xmax: 20, ymin: p.TC - 10, ymax: p.TH + 10, xlabel: 'x (cm)', ylabel: 'T (K)' });
      pl.frame(); pl.xy(Array.from({ length: N }, (_, i) => i * dx * 100), Array.from(T), { color: '--accent', width: 2.6 });
      pl.fn((x) => p.TH - ((p.TH - p.TC) * x) / 20, { color: '--grid-2', dash: [5, 4] });
      const Qs = (p.k * A * (p.TH - p.TC)) / L, Sst = Qs * (1 / p.TC - 1 / p.TH);
