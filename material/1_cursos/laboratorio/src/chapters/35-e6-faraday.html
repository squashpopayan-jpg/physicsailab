<p class="lead">Cuando un imán atraviesa una bobina, el flujo magnético sube y baja, y aparece una fuerza electromotriz que lo «registra». Dejando caer un imán de neodimio por un tubo con una bobina, la ESP32 captura la señal a 10 000 muestras por segundo: dos pulsos de signo contrario, y en sus áreas, la ley de Faraday.</p>

<dt>Objetivo</dt><dd>Registrar la fem inducida, comprobar que el área de cada pulso es el cambio de flujo y que la fem máxima es proporcional a la rapidez del imán.</dd>

<section>
<h2>Fundamento</h2>
<p>La ley de Faraday dice que la fem inducida en una bobina de \(N\) espiras es menos la rapidez de cambio del flujo magnético que la atraviesa:</p>
<div class="eq key" data-name="Ley de Faraday">\[\mathcal E=-N\frac{d\Phi}{dt}=-N\frac{d\Phi}{dz}\,v .\]</div>
<p>Cuando el imán se acerca, el flujo crece y la fem tiene un signo; cuando se aleja, el flujo decrece y la fem cambia de signo (la ley de Lenz expresa que la corriente inducida se opone al cambio). Como el imán va acelerando, sale más rápido de lo que entró: el segundo pulso es más alto y más angosto. Pero el área bajo cada pulso es la misma, porque</p>
<div class="eq">\[\int\mathcal E\,dt=-N\,\Delta\Phi,\]</div>
<p>y el flujo sube de cero a \(\Phi_{\max}\) y vuelve a cero, sin importar la rapidez. En cambio la fem máxima es proporcional a la rapidez con que el imán cruza la bobina: \(\mathcal E_{\max}\propto v=\sqrt{2gh}\).</p>
<h3>Medir una señal que cambia de signo</h3>
<p>El ADC sólo lee voltajes positivos. Por eso la bobina se conecta entre un punto fijo de 1.65 V (un divisor de dos resistencias de 10 kΩ entre 3.3 V y GND) y la entrada del ADC: la señal queda centrada en 1.65 V y puede subir o bajar. Los pulsos duran unos milisegundos, así que hay que muestrear a 10 kHz y guardar los datos en memoria antes de enviarlos.</p>
</section>

<section>
<h2>Configuración: el programa</h2>
<pre class="code" data-lang="cpp" data-file="E6_faraday.ino">// E6 · Captura rápida de la fem de una bobina (GPIO 34, centrada en 1.65 V)
// Muestrea siempre a 10 kHz en un búfer circular; al detectar la señal guarda
// también los 30 ms anteriores al disparo (pre-disparo), como un osciloscopio.
const int PIN = 34;
const int N = 3000, PRE = 300;           // 0.3 s en total, 30 ms antes del disparo
const unsigned long DT_US = 100;         // 10 000 muestras por segundo
uint16_t buf[N];
int cero;

void setup() {
  Serial.begin(115200);
  analogReadResolution(12);
  long s = 0;
  for (int i = 0; i < 500; i++) s += analogRead(PIN);
  cero = s / 500;                         // nivel sin señal (≈ 1.65 V)
  Serial.println("Listo: suelte el imán");
}

void loop() {
  static int i = 0, faltan = -1;          // faltan: muestras por tomar tras el disparo
  static unsigned long tSig = micros();
  if ((long)(micros() - tSig) < 0) return;
  tSig += DT_US;
  int v = analogRead(PIN);
  buf[i] = v;
  if (faltan < 0 && abs(v - cero) > 15) faltan = N - PRE;   // disparo
  i = (i + 1) % N;
  if (faltan > 0 && --faltan == 0) {
    Serial.println("t_ms,fem_mV");
    for (int k = 0; k < N; k++) {
      int j = (i + k) % N;                // de la muestra más antigua a la más reciente
      Serial.print((k - PRE) * 0.1, 1);
      Serial.print(',');
      Serial.println((buf[j] - cero) * 3300.0 / 4095.0, 1);  // conversión aproximada
    }
    faltan = -1;
    delay(2000);
    tSig = micros();
  }
}
</pre>
<p><code>analogRead()</code> tarda unos 10 µs en la ESP32, de modo que 10 kHz es alcanzable. La conversión a milivoltios es aproximada (ganancia nominal), suficiente para comparar áreas y alturas de pulsos.</p>
</section>

<section>
<h2>Experimento virtual</h2>
<div class="sim" data-sim="e6-faraday" data-title="Imán que cae por una bobina: fem, flujo y rapidez" data-layout="below"></div>
<div class="sim-guide"><ul>
<li>Observe los dos pulsos: el segundo es mayor y más corto, pero las áreas sombreadas son iguales.</li>
<li>Suelte desde varias alturas y agregue cada caída: \(\mathcal E_{\max}\) contra \(\sqrt h\) es una recta.</li>
<li>Baje la frecuencia de muestreo a 500 Hz: los picos se recortan y su altura deja de ser confiable.</li>
</ul></div>

<section>
<h2>Procedimiento</h2>
<ol class="steps">
<li><b>Arme el divisor y la bobina</b><p>y compruebe con el Monitor Serie que, sin imán, el nivel es estable.</p></li>
<li><b>Primera caída.</b><p>Suelte el imán desde la boca del tubo y copie los datos.</p></li>
<li><b>Alturas.</b><p>Suelte desde 2, 4, 8, 12 y 16 cm sobre la bobina (tres veces cada una), sosteniendo el imán con una placa LEGO que se retira.</p></li>
<li><b>Orientación.</b><p>Invierta el imán (polo sur abajo) y repita una altura: los pulsos cambian de signo.</p></li>
</ol>
</section>

<section>
<h2>Análisis de los datos</h2>
<ol>
<li>Integre cada pulso con la regla del trapecio (sume \(\mathcal E\,\Delta t\)): compare el área del primer pulso con la del segundo.</li>
<li>Lea \(\mathcal E_{\max}\) de cada pulso y grafíquela contra \(\sqrt{h}\) (o contra la rapidez calculada en la bobina).</li>
<li>El tiempo entre los dos picos y la longitud de la bobina dan una estimación de la rapidez: compárela con \(\sqrt{2gh}\).</li>
</ol>
</section>

<section>
<h2>Preguntas, fuentes de error y extensiones</h2>
<ol class="problems">
<li><span class="lvl">Concepto</span>¿Por qué no se puede usar la frecuencia de muestreo de 200 Hz de las otras prácticas?
<details><summary>Respuesta</summary><p>Porque cada pulso dura unos 5–10 ms: a 200 Hz habría uno o dos puntos por pulso, y el pico se perdería. Se necesitan decenas de puntos por pulso (capítulo 3).</p></details></li>
<li><span class="lvl">Concepto</span>Si la bobina se cierra con una resistencia pequeña, ¿cae el imán más despacio?
<details><summary>Respuesta</summary><p>Sí, un poco: circula corriente, la bobina disipa energía y aparece una fuerza que se opone al movimiento (ley de Lenz). Con la entrada del ADC, de alta impedancia, casi no circula corriente y el efecto es despreciable. Es la idea del freno magnético de la práctica E7.</p></details></li>
<li><span class="lvl">Extensión</span>Ponga dos bobinas separadas 10 cm y mida el tiempo entre los pulsos: obtenga \(g\).</li>
</ol>
</section>
