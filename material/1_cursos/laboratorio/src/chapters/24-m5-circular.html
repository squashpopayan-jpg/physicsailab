<template class="chapter-src" data-id="m5" data-num="M5" data-title="Movimiento circular y aceleración centrípeta" data-part="Parte III · Prácticas de mecánica" data-kits="cel lego" data-short="El celular gira sobre una plataforma LEGO: aceleración centrípeta contra ω², y cómo encontrar el acelerómetro dentro del celular">
<p class="lead">Sobre una plataforma giratoria, el giroscopio mide ω y el acelerómetro mide la aceleración hacia el centro. Si la física es correcta, \(a=\omega^2 r\) y la gráfica de \(a\) contra \(\omega^2\) es una recta cuya pendiente es el radio. El resultado sorprendente es que ese radio no coincide con la distancia al centro del celular: revela dónde está escondido el sensor.</p>

<div class="ficha"><div class="ficha-head"><b>Ficha de la práctica</b><span>M5 · 1.5 horas</span></div><dl>
<dt>Objetivo</dt><dd>Verificar \(a_c=\omega^2r\) y localizar la posición del acelerómetro dentro del celular.</dd>
<dt>Herramientas</dt><dd><span class="kit cel">Celular</span><span class="kit lego">LEGO</span> (plataforma giratoria Technic o una base de ensaladera centrífuga)</dd>
<dt>Se mide</dt><dd>\(\omega_z\) (giroscopio) y la componente radial de la aceleración</dd>
<dt>Conceptos</dt><dd>Aceleración centrípeta y tangencial, cuerpo rígido, sistemas de referencia</dd>
<dt>Costo extra</dt><dd>Ninguno (o una centrífuga de ensalada, unos 20 000 pesos)</dd>
</dl></div>

<section>
<h2>Fundamento</h2>
<p>Un punto que gira a distancia \(r\) de un eje fijo con velocidad angular \(\omega\) y aceleración angular \(\alpha\) tiene dos componentes de aceleración:</p>
<div class="eq key" data-name="Aceleración en movimiento circular">\[a_{\text{radial}}=\omega^2 r\ \ (\text{hacia el eje}),\qquad a_{\text{tangencial}}=\alpha\,r .\]</div>
<p>El celular plano sobre la plataforma tiene su eje \(z\) paralelo al eje de giro: el giroscopio mide \(\omega=\omega_z\). Si se coloca con el eje \(y\) apuntando hacia afuera, el acelerómetro mide \(f_y=-\omega^2r_s\), donde \(r_s\) es la distancia del eje de giro al <strong>chip del acelerómetro</strong>, no al centro del celular. Al acelerar la plataforma aparece además \(f_x=\pm\alpha r_s\).</p>
<p>El chip suele estar a 2–5 cm del centro del aparato. Para encontrarlo se mide dos veces: con el celular orientado \(y\) hacia afuera y luego girado 180° en el mismo sitio. Si \(r_c\) es la distancia del eje al centro del celular y \(\delta\) el desplazamiento del sensor a lo largo de \(y\):</p>
<div class="eq">\[r_1=r_c+\delta,\qquad r_2=r_c-\delta\qquad\Rightarrow\qquad r_c=\frac{r_1+r_2}{2},\quad \delta=\frac{r_1-r_2}{2}.\]</div>
</section>

<section>

<p>Gire la plataforma con la mano, sin pasar de unas 2 vueltas por segundo (ω ≈ 12 rad/s): a 10 cm del eje eso ya son 14 m/s². El celular debe ir sujeto con bandas elásticas y el contrapeso evita que la plataforma vibre.</p>

</section>

<section>
<h2>Configuración</h2>
<p>phyphox tiene el experimento «Aceleración centrípeta», que grafica directamente \(a\) contra \(\omega\) y ajusta el radio. Para hacer el análisis completo, use «Aceleración (sin g)» y «Giroscopio» a la vez con la herramienta «Multi» o el editor de experimentos, o registre por separado y sincronice por el tiempo.</p>
</section>

<section>
<h2>Experimento virtual</h2>
<div class="sim" data-sim="m5-circular" data-title="Centrípeta: a contra ω² en una plataforma giratoria" data-layout="below"></div>
<div class="sim-guide"><ul>
<li>Pulse «Impulsar» varias veces: la plataforma se acelera y luego frena sola. Los puntos de \(a\) contra \(\omega^2\) forman una recta.</li>
<li>Agregue el resultado a la tabla, gire el celular 180° y repita. Con las dos pendientes se halla dónde está el sensor.</li>
<li>Durante los impulsos aparece la aceleración tangencial en \(f_x\).</li>
</ul></div>
</section>

<section>
<h2>Procedimiento</h2>
<ol class="steps">
<li><b>Mida \(r_c\)</b><p>desde el eje de la plataforma hasta el centro geométrico del celular, con regla.</p></li>
<li><b>Orientación 1.</b><p>Celular plano, eje \(y\) hacia afuera del eje de giro. Inicie el registro y haga girar la plataforma con impulsos suaves hasta unas 2 vueltas por segundo; déjela frenar sola.</p></li>
<li><b>Orientación 2.</b><p>Gire el celular 180° en el mismo lugar (eje \(y\) hacia adentro) sin mover su centro, y repita.</p></li>
<li><b>Otro radio.</b><p>Cambie el celular a otra posición radial (8 mm más afuera, un módulo LEGO) y repita las dos orientaciones.</p></li>
<li><b>Exporte</b><p>los datos de cada registro.</p></li>
</ol>
</section>

<section>
<h2>Análisis de los datos</h2>
<ol>
<li>Para cada registro, empareje cada valor de \(f_y\) con el de \(\omega_z\) del mismo instante (interpolando) y grafique \(|f_y|\) contra \(\omega_z^2\).</li>
<li>Ajuste una recta por el origen: la pendiente es \(r_s\). Use sólo los tramos sin impulsos (la plataforma frenando sola), donde la aceleración tangencial es pequeña.</li>
<li>Con las dos orientaciones calcule \(r_c\) y \(\delta\). Compare \(r_c\) con lo medido con la regla.</li>
<li>Repita con el otro radio: \(\delta\) debe ser el mismo (es una propiedad del celular) y \(r_c\) debe haber aumentado 8 mm.</li>
</ol>
</section>

<section>
<h2>Preguntas, fuentes de error y extensiones</h2>
<ol class="problems">
<li><span class="lvl">Problema</span>Con \(y\) hacia afuera la pendiente es 0.1274 m; girado 180°, 0.0798 m. ¿Dónde está el sensor?
<details><summary>Respuesta</summary><p>\(r_c=(0.1274+0.0798)/2=0.1036\) m; \(\delta=(0.1274-0.0798)/2=0.0238\) m. El sensor está 2.4 cm del centro, hacia la parte superior del celular (el lado al que apuntaba \(y\) en la primera orientación).</p></details></li>
<li><span class="lvl">Concepto</span>¿Por qué se recomienda usar los tramos en que la plataforma frena sola?
<details><summary>Respuesta</summary><p>Porque durante los impulsos hay aceleración angular grande y vibraciones de la mano; la componente tangencial y los golpes aparecen también en \(f_y\) si el celular no está perfectamente alineado. Al frenar sola, \(\alpha\) es pequeña y constante.</p></details></li>
<li><span class="lvl">Error</span>Si la plataforma no está horizontal, ¿qué aparece en \(f_y\)?
<details><summary>Respuesta</summary><p>Una componente de la gravedad que gira con la plataforma: una oscilación de \(f_y\) con la frecuencia de giro, de amplitud \(g\,\sen\beta\) (β, la inclinación). Promediando sobre vueltas completas se cancela, pero aumenta la dispersión.</p></details></li>
<li><span class="lvl">Extensión</span>Ponga el celular de canto, con \(z\) apuntando hacia afuera, y repita. ¿Qué componente del desplazamiento del sensor encuentra ahora?</li>
</ol>
</section>
