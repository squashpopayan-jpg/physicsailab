<p class="lead">Una medición que no se comunica bien se pierde. El informe cuenta qué se midió, cómo, con qué resultado y qué tan confiable es ese resultado, de modo que otro grupo podría repetir el experimento y comprobarlo. Este apéndice resume las normas del curso y trae una plantilla, una calculadora para reportar y comparar resultados y la rúbrica de evaluación.</p>

<section>
<h2>Estructura</h2>
<div class="tablewrap"><table>
<thead><tr><th>Sección</th><th>Qué debe contener</th><th>Extensión</th></tr></thead>
<tbody>
<tr><td><b>Título y autores</b></td><td>Un título que diga qué se midió («Medición de la tensión superficial del agua con el método del anillo»), integrantes, grupo y fecha.</td><td>—</td></tr>
<tr><td><b>Resumen</b></td><td>Objetivo, método en una frase, resultado principal con incertidumbre y su comparación con la referencia. Se escribe al final.</td><td>4–6 líneas</td></tr>
<tr><td><b>Fundamento</b></td><td>El modelo físico y la ecuación que se usa para obtener el resultado, con sus suposiciones. No copie el libro: explique sólo lo que se necesita.</td><td>½ página</td></tr>
<tr><td><b>Montaje y procedimiento</b></td><td>Foto o esquema del montaje (con la lista de piezas LEGO si aplica), sensores y su configuración (frecuencia de muestreo, rango), y los pasos seguidos. Debe bastar para repetir el experimento.</td><td>½–1 página</td></tr>
<tr><td><b>Datos y análisis</b></td><td>Tablas con los datos medidos, gráficas, el ajuste usado, los parámetros con incertidumbre y la propagación hasta el resultado final.</td><td>1–2 páginas</td></tr>
<tr><td><b>Discusión</b></td><td>¿El resultado es compatible con la referencia? ¿Cuál es la fuente de incertidumbre dominante? ¿Hubo errores sistemáticos? ¿Qué cambiaría para mejorar?</td><td>½ página</td></tr>
<tr><td><b>Conclusiones</b></td><td>Lo que se puede afirmar con los datos, ni más ni menos.</td><td>3–5 líneas</td></tr>
<tr><td><b>Referencias y anexos</b></td><td>Fuentes de los valores de referencia; archivos de datos crudos y programas usados (adjuntos).</td><td>—</td></tr>
</tbody></table></div>
</section>

<section>
<h2>Tablas y gráficas</h2>
<ul>
<li><b>Tablas</b>: cada columna con el nombre de la magnitud y su unidad en el encabezado, <i>t</i> (s), y no en cada celda. Los números de una misma columna con los mismos decimales. Numere las tablas y deles un título que diga qué contienen.</li>
<li><b>Gráficas</b>: ejes con magnitud y unidad; puntos de los datos con marcadores (no unidos por líneas) y, si hay ajuste, la curva del ajuste como línea continua. Barras de incertidumbre cuando sean visibles. Si la gráfica es una linealización, diga en el texto qué se graficó contra qué y por qué debería ser una recta.</li>
<li><b>Residuos</b>: incluya la gráfica de residuos del ajuste principal. Es la prueba de que el modelo describe los datos.</li>
<li><b>Datos crudos</b>: nunca los borre ni los «corrija». Si descarta un punto (por ejemplo, un eco falso del HC-SR04), dígalo y explique por qué.</li>
</ul>
<div class="box warn"><b>Simulación no es medición.</b> Los experimentos virtuales de este libro sirven para prepararse, para ensayar el análisis y para prever lo que se va a ver. Los datos del informe deben ser los medidos con su montaje. Presentar datos simulados como medidos es una falta grave.</div>
</section>

<section>
<h2>Cómo se reporta un resultado</h2>
<p>Todo resultado se reporta como \(x=\bar x\pm u_c\) con su unidad, donde la incertidumbre combinada reúne la parte estadística (tipo A, de la dispersión de las repeticiones o del ajuste) y la parte de los instrumentos y del método (tipo B), como en el capítulo 2:</p>
<div class="eq key" data-name="Incertidumbre combinada">\[u_c=\sqrt{u_A^2+u_B^2}.\]</div>
<ol>
<li>Redondee la incertidumbre a <b>una o dos cifras significativas</b> (dos si la primera es 1 o 2).</li>
<li>Redondee el valor <b>al mismo decimal</b> que la incertidumbre: \(g=(9.781\pm0.023)\) m/s², no \(9.78134\pm0.0231\).</li>
<li>Dé también la incertidumbre relativa \(u_c/\bar x\) en porcentaje: dice de un vistazo qué tan buena fue la medición.</li>
</ol>
<p>Para comparar con un valor de referencia \(x_{\text{ref}}\pm u_{\text{ref}}\) no basta el «porcentaje de error»: hay que compararlo con las incertidumbres. La <span class="term">discrepancia normalizada</span></p>
<div class="eq key" data-name="Discrepancia normalizada">\[z=\frac{|\bar x-x_{\text{ref}}|}{\sqrt{u_c^2+u_{\text{ref}}^2}}\]</div>
<p>indica si la diferencia se explica por las incertidumbres: con \(z&lt;2\) los valores son compatibles; con \(z&gt;3\) hay algo que no se tuvo en cuenta (un error sistemático, un modelo incompleto o una incertidumbre subestimada), y eso es lo que debe discutirse.</p>
<div class="sim" data-sim="informe-reporte" data-title="Reportar y comparar un resultado" data-layout="below"></div>
<div class="sim-guide"><ul>
<li>Escriba el valor medido, sus incertidumbres A y B y el valor de referencia: la calculadora redondea el resultado y calcula la discrepancia.</li>
<li>Pruebe los ejemplos: una medición puede tener un error relativo pequeño y aun así ser incompatible, si su incertidumbre es todavía más pequeña.</li>
</ul></div>
</section>

<section>
<h2>Plantilla</h2>
<p>Copie esta plantilla en su procesador de texto y reemplace lo que está entre corchetes.</p>
<pre class="code" data-lang="txt" data-file="plantilla_informe.txt">[Título: qué se midió y con qué método]
[Integrantes] · [Grupo] · [Fecha]
Física [I/II/III] · Departamento de Física · Universidad del Cauca

RESUMEN
Se midió [magnitud] mediante [método, sensor]. Se obtuvo [x = valor ± u unidad]
([u relativa] %), compatible / no compatible con el valor de referencia
[x_ref ± u_ref] (z = [valor]).

1. FUNDAMENTO
[Modelo físico, ecuación de trabajo, suposiciones.]

2. MONTAJE Y PROCEDIMIENTO
[Foto o esquema. Sensores, frecuencia de muestreo, rango.
Piezas LEGO principales. Pasos seguidos y número de repeticiones.]

3. DATOS Y ANÁLISIS
Tabla 1. [Título]   (unidades en los encabezados)
Figura 1. [Gráfica de los datos con el ajuste]
Figura 2. [Residuos]
[Parámetros del ajuste con incertidumbre; propagación hasta el resultado;
tabla de incertidumbres tipo B (instrumentos, longitudes, calibración).]

4. DISCUSIÓN
[Comparación con la referencia (z). Fuente de incertidumbre dominante.
Errores sistemáticos posibles. Mejoras.]

5. CONCLUSIONES
[Lo que los datos permiten afirmar.]

REFERENCIAS
[Fuente de los valores de referencia.]
ANEXOS: [archivos CSV crudos, programa de la ESP32 o de App Inventor]</pre>
</section>

<section>
<h2>Rúbrica de evaluación</h2>
<div class="tablewrap"><table>
<thead><tr><th>Criterio</th><th>Peso</th><th>Excelente</th><th>Aceptable</th><th>Por mejorar</th></tr></thead>
<tbody>
<tr><td><b>Montaje y toma de datos</b></td><td>20 %</td><td>Montaje firme y documentado; repeticiones suficientes; datos crudos adjuntos</td><td>Montaje descrito; pocas repeticiones</td><td>No se puede reproducir; faltan datos</td></tr>
<tr><td><b>Análisis</b></td><td>25 %</td><td>Ajuste adecuado con residuos; linealización justificada; propagación completa</td><td>Ajuste correcto sin residuos o con propagación parcial</td><td>Cálculos con un solo dato o sin ajuste</td></tr>
<tr><td><b>Incertidumbre</b></td><td>20 %</td><td>Tipos A y B identificados y combinados; cifras significativas correctas</td><td>Sólo tipo A o tipo B; redondeo irregular</td><td>Sin incertidumbre</td></tr>
<tr><td><b>Discusión</b></td><td>20 %</td><td>Compara con \(z\); identifica la fuente dominante y los sistemáticos; propone mejoras concretas</td><td>Compara sólo con el porcentaje de error</td><td>No discute o atribuye todo a «errores humanos»</td></tr>
<tr><td><b>Presentación</b></td><td>15 %</td><td>Tablas y gráficas completas, numeradas y con unidades; texto claro y breve</td><td>Algunas gráficas sin unidades o sin título</td><td>Desordenado; gráficas ilegibles</td></tr>
</tbody></table></div>
<div class="box tip"><b>«Errores humanos» no es una explicación.</b> Diga cuál: ¿el tiempo de reacción al soltar? ¿el paralaje al leer la regla? ¿la temperatura del agua? Y estime cuánto pudo afectar el resultado. Si no puede estimarlo, proponga cómo medirlo.</div>
</section>
