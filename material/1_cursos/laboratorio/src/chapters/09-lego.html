<template class="chapter-src" data-id="lego" data-num="9" data-title="LEGO como banco de montaje" data-part="Parte II · Herramientas" data-kits="lego" data-short="Las medidas del sistema LEGO, ángulos de rampa exactos, técnicas para montajes firmes, los montajes base del kit y transmisiones con engranajes">
<p class="lead">Un laboratorio necesita soportes, carriles, pivotes y marcos que no se muevan y que otro grupo pueda reproducir. Las piezas LEGO cumplen esas tres condiciones: se fabrican con tolerancias del orden de centésimas de milímetro, sus medidas son múltiplos exactos de unos pocos números y se arman y desarman sin herramientas. Con ellas, un ángulo de rampa o la longitud de un péndulo se conocen <em>por construcción</em>.</p>

<div class="keyideas"><ul>
<li>El módulo horizontal (distancia entre pivotes) es 8.0 mm; un ladrillo mide 9.6 mm de alto y una placa, 3.2 mm: tres placas forman un ladrillo.</li>
<li>Un ladrillo más dos placas miden 16 mm, exactamente dos módulos: así se alinean vigas Technic horizontales y verticales.</li>
<li>Con una rampa de largo y altura conocidos en módulos y placas, el ángulo se calcula sin transportador.</li>
<li>Un montaje firme se logra traslapando ladrillos como en un muro, cruzando vigas Technic y dando a la base peso y anchura.</li>
</ul></div>

<section>
<h2>Las medidas del sistema</h2>
<div class="tablewrap"><table>
<thead><tr><th>Medida</th><th class="r">Valor</th><th>Uso en el laboratorio</th></tr></thead>
<tbody>
<tr><td>Distancia entre pivotes (módulo, <i>stud</i>)</td><td class="num r">8.0 mm</td><td>Largos horizontales: una viga de 16 agujeros tiene 15 × 8 = 120 mm entre los extremos</td></tr>
<tr><td>Altura de un ladrillo (sin pivote)</td><td class="num r">9.6 mm</td><td>Alturas de torres: 10 ladrillos = 96 mm</td></tr>
<tr><td>Altura de una placa</td><td class="num r">3.2 mm</td><td>Ajuste fino de alturas y de ángulos</td></tr>
<tr><td>Altura del pivote</td><td class="num r">1.7 mm</td><td>No cuenta al apilar</td></tr>
<tr><td>Distancia entre agujeros Technic</td><td class="num r">8.0 mm</td><td>Pivotes de péndulos, ejes de poleas, reglas para calibrar videos</td></tr>
<tr><td>1 ladrillo + 2 placas</td><td class="num r">16.0 mm</td><td>Igual a 2 módulos: permite estructuras cuadradas y triángulos 3-4-5</td></tr>
</tbody></table></div>
<p>La relación entre la altura del ladrillo y su ancho es 9.6 : 8 = 6 : 5, y la de la placa, 3.2 : 8 = 2 : 5. Por eso 5 placas (16 mm) equivalen a 2 módulos. Con estas reglas se puede construir un triángulo rectángulo exacto de lados 3, 4 y 5 módulos usando vigas Technic, y la regla de 8 mm entre agujeros sirve de patrón de longitud para calibrar un video.</p>
<div class="sim" data-sim="lego-medidas" data-title="Calculadora LEGO: alturas, rampas y ángulos exactos"></div>
<div class="sim-guide"><ul>
<li>Elija la altura de la torre en ladrillos y placas y el largo de la rampa en módulos: el ángulo y \(\sen\theta\) salen exactos.</li>
<li>La lista muestra combinaciones que dan ángulos «redondos» (10°, 15°, 20°, 30°) con error menor de 0.2°.</li>
</ul></div>
<div class="box warn">
<p>Las piezas «compatibles» de otras marcas pueden tener tolerancias mayores: unas encajan muy duro y otras quedan flojas. Para pivotes, carriles y reglas use piezas originales o verifique con un calibrador. Las piezas usadas suelen venderse por kilo a buen precio.</p>
</div>
</section>

<section>
<h2>Técnicas para montajes firmes</h2>
<ul>
<li><strong>Traslape como en un muro.</strong> Cada fila de ladrillos debe cubrir las uniones de la fila de abajo. Una columna de ladrillos apilados sin traslape se parte con el primer golpe.</li>
<li><strong>Base ancha y pesada.</strong> Una torre de péndulo necesita una base al menos tan ancha como un tercio de su altura, o un peso encima (un libro, una bolsa de arena). La oscilación de la torre se suma a la del péndulo y altera el periodo.</li>
<li><strong>Vigas Technic cruzadas.</strong> Unidas con pasadores, forman marcos rígidos y triángulos que no se deforman. Úselas en carriles largos y en torres altas.</li>
<li><strong>Pivotes con poca fricción.</strong> Un eje Technic de sección en cruz girando dentro de un agujero redondo tiene poca fricción si nada lo presiona de lado. Para péndulos de precisión, los ejes deben quedar horizontales y la pieza que gira no debe rozar las caras laterales.</li>
<li><strong>Sujetar el celular.</strong> Bandeja con paredes y dos bandas elásticas cruzadas. El celular no debe poder moverse ni un milímetro respecto al soporte.</li>
<li><strong>Medir lo que no se conoce.</strong> Las piezas dan medidas exactas, pero el centro de masa de un celular o la posición de su sensor no: esas se miden (en las prácticas se explica cómo).</li>
</ul>
<div class="tablewrap"><table>
<thead><tr><th>Piezas recomendadas para el lote</th><th>Para qué</th></tr></thead>
<tbody>
<tr><td>Placas grandes (6×16, 8×16, 16×16)</td><td>Bases de torres y carriles</td></tr>
<tr><td>Ladrillos 2×4, 2×2, 1×4, 1×6, 1×8</td><td>Torres, paredes, soportes</td></tr>
<tr><td>Vigas Technic (de 7, 9, 11, 13 y 15 agujeros) y ladrillos Technic 1×16</td><td>Carriles, brazos de péndulo, marcos, reglas</td></tr>
<tr><td>Ejes Technic (de 4 a 12 módulos), pasadores y bujes</td><td>Pivotes, ejes de ruedas y poleas</td></tr>
<tr><td>Ruedas con neumático y llantas Technic, poleas</td><td>Carritos, máquina de Atwood, rodadura</td></tr>
<tr><td>Engranajes Technic de 8, 16, 24 y 40 dientes; plataforma giratoria</td><td>Transmisiones, mesas giratorias</td></tr>
<tr><td>Ladrillos transparentes 1×2 o 1×4</td><td>Vallas de fotocompuerta (picket fence)</td></tr>
</tbody></table></div>
</section>

<section>
<h2>Los montajes base del kit</h2>
<p>Estos cinco montajes reaparecen, con variaciones, en las prácticas. Recorra los pasos con el deslizador, gire el modelo para verlo desde otro lado y copie la lista de piezas.</p>
<h3>Soporte para el celular</h3>
<p>Una bandeja con paredes de un ladrillo de alto y dos bandas elásticas. Se monta sobre un carrito, cuelga de un péndulo o gira sobre una plataforma.</p>
<div class="sim" data-sim="lego-modelo" data-model="soporte-celular" data-title="Soporte para el celular"></div>
<h3>Rampa de ángulo conocido</h3>
<p>Dos carriles de vigas Technic apoyados en una torre. Con la calculadora de arriba se elige la altura de la torre para el ángulo deseado.</p>
<div class="sim" data-sim="lego-modelo" data-model="rampa" data-title="Rampa con torre de altura variable"></div>
<h3>Torre para péndulo</h3>
<p>Dos columnas trabadas en la base y unidas arriba por una viga Technic con un eje como pivote. La base lleva peso encima.</p>
<div class="sim" data-sim="lego-modelo" data-model="pendulo" data-title="Torre de péndulo con pivote Technic"></div>
<h3>Marco de fotocompuerta y valla</h3>
<p>Dos columnas sostienen frente a frente un LED infrarrojo y un fototransistor (o un optointerruptor ranurado). La valla de ladrillos alternados, negros y transparentes, cae a través del haz: cada franja mide 9.6 mm, así que el periodo de la valla es exactamente 19.2 mm.</p>
<div class="sim" data-sim="lego-modelo" data-model="marco-foto" data-title="Marco de fotocompuerta"></div>
<div class="sim" data-sim="lego-modelo" data-model="valla" data-title="Valla de franjas (picket fence)"></div>
</section>

<section>
<h2>Engranajes y transmisiones</h2>
<p>Los engranajes Technic siguen una regla sencilla: el diámetro primitivo, en milímetros, es igual al número de dientes (son de módulo 1). Dos engranajes de \(N_1\) y \(N_2\) dientes engranan si sus ejes están a \((N_1+N_2)/2\) mm. Por eso 8 + 24, 16 + 16 o 12 + 20 dientes funcionan con ejes a 2 módulos (16 mm), y 24 + 24 o 8 + 40 a 3 módulos (24 mm). La relación de velocidades es</p>
<div class="eq">\[\frac{\omega_2}{\omega_1}=\frac{N_1}{N_2},\qquad \frac{\tau_2}{\tau_1}=\frac{N_2}{N_1}\ \ \text{(sin pérdidas)}.\]</div>
<div class="sim" data-sim="engranajes" data-title="Tren de engranajes Technic"></div>
<div class="sim-guide"><ul>
<li>Un engranaje de 8 dientes que mueve uno de 40 reduce la velocidad 5 veces y multiplica el torque por 5.</li>
<li>Con un engranaje intermedio el sentido de giro se mantiene, pero la relación no cambia.</li>
</ul></div>
</section>

<section>
<h2>Si no hay piezas LEGO</h2>
<p>Los montajes de este curso se pueden reproducir con madera, cartón grueso, tubos de PVC o piezas impresas en 3D. Lo que se pierde es la geometría «gratis»: hay que medir cada longitud y cada ángulo, y comprobar que el montaje no se deforma. Una alternativa intermedia son los perfiles de aluminio con agujeros a 8 mm y las placas perforadas de los juegos de construcción metálicos.</p>
</section>

<section>
<h2>Preguntas y problemas</h2>
<ol class="problems">
<li><span class="lvl">Problema</span>Una rampa de 30 módulos de largo descansa en una torre de 5 ladrillos y 1 placa (medidos desde la base de la rampa). ¿Cuál es el ángulo?
<details><summary>Respuesta</summary><p>Altura: \(5(9.6)+3.2=51.2\) mm; largo: \(30\times8=240\) mm. \(\sen\theta=51.2/240=0.2133\), \(\theta=12.32°\).</p></details></li>
<li><span class="lvl">Diseño</span>Necesita un péndulo de 40 cm de longitud. ¿Cuántos ladrillos de alto debe tener la torre si el celular cuelga 5 cm por encima de la base?
<details><summary>Respuesta</summary><p>El pivote debe estar a unos 45 cm más la mitad del celular (≈ 8 cm): unos 53 cm, es decir, \(530/9.6\approx55\) ladrillos. Es una torre alta: necesita base ancha, refuerzos con vigas Technic y peso en la base. Una alternativa es colgarla del borde de una mesa con la torre sólo como soporte del eje.</p></details></li>
<li><span class="lvl">Concepto</span>¿Por qué el periodo de la valla de ladrillos alternados no depende de la exactitud con que se mida cada franja?
<details><summary>Respuesta</summary><p>Porque el periodo (franja opaca + franja transparente) es la altura de dos ladrillos, 19.2 mm, fijada por la fabricación. En el análisis se usan los tiempos entre flancos del mismo tipo (bajada a bajada), que corresponden a un periodo completo, y así tampoco importa el umbral de la fotocompuerta.</p></details></li>
</ol>
</section>
