<template class="chapter-src" data-id="f8" data-num="F8" data-title="Tensión superficial con la celda de carga" data-part="Parte V · Prácticas de fluidos" data-kits="esp lego" data-short="Un anillo de alambre colgado de la celda de carga se desprende de la superficie del agua: la fuerza máxima da la tensión superficial, y el jabón la reduce a menos de la mitad">
<p class="lead">La superficie del agua se comporta como una membrana tensa: sostiene a los insectos zapateros y redondea las gotas. Esa tensión se puede pesar. Un anillo de alambre que se separa lentamente de la superficie arrastra una película de agua, y la celda de carga registra la fuerza máxima justo antes de que la película se rompa: algo más de un gramo, suficiente para medir la tensión superficial con un error de pocos por ciento.</p>

<div class="ficha"><div class="ficha-head"><b>Ficha de la práctica</b><span>F8 · 1.5 horas</span></div><dl>
<dt>Objetivo</dt><dd>Medir la tensión superficial del agua con el método del anillo (du Noüy) y comparar con agua jabonosa y alcohol.</dd>
<dt>Herramientas</dt><dd><span class="kit esp">ESP32</span> con celda de carga (mejor de 100 g) y HX711 · <span class="kit lego">LEGO</span> (plataforma que baja de a una placa)</dd>
<dt>Se mide</dt><dd>Fuerza sobre el anillo en función de la altura del recipiente</dd>
<dt>Conceptos</dt><dd>Tensión superficial, energía superficial, tensoactivos, factor de corrección</dd>
<dt>Costo extra</dt><dd>Alambre de cobre delgado, detergente, alcohol</dd>
</dl></div>

<section>
<h2>Fundamento</h2>
<p>La <span class="term">tensión superficial</span> γ es la fuerza por unidad de longitud que ejerce la superficie de un líquido sobre cualquier borde que la sostenga (o, equivalentemente, la energía por unidad de área de superficie). Un anillo horizontal de radio \(R\), al separarse de la superficie, sostiene una película con dos caras, por dentro y por fuera, cada una de longitud \(2\pi R\). La fuerza máxima antes de que la película se rompa es</p>
<div class="eq key" data-name="Método del anillo">\[F_{\max}=4\pi R\,\gamma\,f\qquad\Rightarrow\qquad\gamma=\frac{F_{\max}}{4\pi R\,f},\]</div>
<p>donde \(f\) es un factor de corrección cercano a 1 (entre 0.9 y 0.95 para anillos de alambre delgado) que tiene en cuenta la forma real de la película. El agua pura a 20 °C tiene γ = 0.0728 N/m; el detergente la reduce a unos 0.03 N/m; el alcohol al 70 % tiene unos 0.025 N/m. Para un anillo de 3 cm de diámetro en agua, \(F_{\max}\approx13.7\) mN, es decir, el peso de 1.4 g.</p>
</section>

<section>
<h2>Materiales y montaje</h2>
<div class="tablewrap narrow"><table class="bom">
<thead><tr><th>Material</th><th>Cantidad</th></tr></thead>
<tbody>
<tr><td>Celda de carga (de 100 g, o la de 1 kg con más ruido) con HX711 y ESP32</td><td>1</td></tr>
<tr><td>Anillo de alambre de cobre de 3 cm de diámetro, horizontal, colgado de tres hilos</td><td>1</td></tr>
<tr><td>Vaso ancho sobre una plataforma de placas LEGO</td><td>1</td></tr>
<tr><td>Agua destilada, detergente, alcohol; calibrador</td><td>—</td></tr>
</tbody></table></div>
<p>Use el montaje en voladizo de la práctica F3. El anillo debe quedar perfectamente horizontal (cuélguelo de tres hilos iguales) y muy limpio: lávelo con detergente, enjuáguelo con agua destilada y no lo toque con los dedos (la grasa cambia γ). Para bajar el vaso de a poco, quite placas de la plataforma una por una (3.2 mm) o, mejor, use una plataforma de tornillo.</p>
</section>

<section>
<h2>Configuración</h2>
<p>Use el programa de la balanza del capítulo 7 con <code>get_units(1)</code> para leer rápido, y tare con el anillo colgando en el aire. La celda dará valores negativos de masa cuando la película tire del anillo hacia abajo: la fuerza es \(F=|m|\,g\).</p>
</section>

<section>
<h2>Experimento virtual</h2>
<div class="sim" data-sim="f8-tension" data-title="Anillo de du Noüy en la celda de carga" data-layout="below"></div>
<div class="sim-guide"><ul>
<li>Baje el vaso lentamente: la fuerza crece mientras la película se estira, llega a un máximo y cae a cero cuando se rompe.</li>
<li>Agregue el máximo a la tabla y repita con agua jabonosa y con alcohol.</li>
<li>Con un anillo más grande, la fuerza crece en proporción al perímetro.</li>
</ul></div>
</section>

<section>
<h2>Procedimiento</h2>
<ol class="steps">
<li><b>Mida el diámetro</b><p>del anillo con el calibrador (al centro del alambre).</p></li>
<li><b>Tare</b><p>con el anillo colgando en el aire.</p></li>
<li><b>Sumerja el anillo</b><p>unos 3 mm subiendo el vaso, y espere que la lectura se estabilice.</p></li>
<li><b>Baje el vaso</b><p>muy despacio mientras registra; anote el valor más negativo antes del desprendimiento.</p></li>
<li><b>Cinco repeticiones</b><p>con agua destilada; luego con agua y una gota de detergente, y con alcohol.</p></li>
</ol>
</section>

<section>
<h2>Análisis de los datos</h2>
<ol>
<li>Convierta la masa máxima en fuerza: \(F_{\max}=|m_{\max}|g\).</li>
<li>Calcule γ con \(f=0.93\) y su incertidumbre (domina la dispersión entre repeticiones).</li>
<li>Compare con los valores de referencia y explique el efecto del detergente.</li>
</ol>
</section>

<section>
<h2>Preguntas, fuentes de error y extensiones</h2>
<ol class="problems">
<li><span class="lvl">Problema</span>Un anillo de 30.0 mm de diámetro marca una masa mínima de −1.30 g antes de desprenderse del agua. Halle γ con \(f=0.93\).
<details><summary>Respuesta</summary><p>\(F=0.00130(9.777)=0.01271\) N; \(\gamma=0.01271/(4\pi\times0.0150\times0.93)=0.0725\) N/m.</p></details></li>
<li><span class="lvl">Concepto</span>¿Por qué basta una gota de detergente para cambiar tanto la tensión superficial?
<details><summary>Respuesta</summary><p>Porque las moléculas del detergente (tensoactivos) se acumulan justo en la superficie, con su parte que repele el agua hacia afuera, y basta una capa de una molécula de espesor para cambiar la energía de la superficie.</p></details></li>
<li><span class="lvl">Extensión</span>Mida γ del agua a 20 °C y a 50 °C (con el DS18B20): disminuye con la temperatura.</li>
</ol>
</section>
