<template class="chapter-src" data-id="f9" data-num="F9" data-title="Velocidad del sonido con una botella que suena" data-part="Parte V · Prácticas de fluidos" data-kits="cel lego" data-short="Soplando sobre una botella con distintas cantidades de agua y midiendo el tono con el micrófono del celular se obtiene la velocidad del sonido, que no depende de la presión del aire">
<p class="lead">Al soplar sobre la boca de una botella se oye un tono grave. El aire del cuello se mueve como un pistón y el aire encerrado en la botella actúa como un resorte: es un oscilador masa–resorte hecho de aire, el <span class="term">resonador de Helmholtz</span>. Su frecuencia depende de la velocidad del sonido. Echando agua en la botella se cambia el volumen del «resorte», y con el analizador de espectro del celular se mide el tono con precisión de 1 Hz.</p>

<div class="ficha"><div class="ficha-head"><b>Ficha de la práctica</b><span>F9 · 1.5 horas</span></div><dl>
<dt>Objetivo</dt><dd>Medir la frecuencia de resonancia de una botella para varios volúmenes de aire y obtener de ahí la velocidad del sonido y el volumen de la botella.</dd>
<dt>Herramientas</dt><dd><span class="kit cel">Celular</span> con phyphox («Espectro de audio») · <span class="kit lego">LEGO</span> (soporte que mantiene el celular a 10 cm de la boca)</dd>
<dt>Se mide</dt><dd>Frecuencia del pico del espectro del sonido</dd>
<dt>Conceptos</dt><dd>Compresibilidad del aire, oscilador masa–resorte, resonancia, velocidad del sonido \(c=\sqrt{\gamma p/\rho}\), linealización</dd>
<dt>Costo extra</dt><dd>Ninguno: una botella de vidrio vacía y una jarra medidora</dd>
</dl></div>

<section>
<h2>Fundamento</h2>
<p>El aire del cuello, de área \(A\) y longitud efectiva \(L_{\text{ef}}\), tiene masa \(m=\rho A L_{\text{ef}}\). Si baja una distancia \(x\), comprime el aire de la botella (volumen \(V\)) y la presión sube \(\Delta p=\gamma p\,A x/V\) (compresión adiabática, \(\gamma=1.40\) para el aire). La fuerza de restitución es \(-(\gamma p A^2/V)\,x\): un resorte de constante \(k=\gamma pA^2/V\). La frecuencia del oscilador \(\omega=\sqrt{k/m}\) queda</p>
<div class="eq key" data-name="Resonador de Helmholtz">\[f=\frac{c}{2\pi}\sqrt{\frac{A}{V\,L_{\text{ef}}}},\qquad c=\sqrt{\frac{\gamma\,p}{\rho}} .\]</div>
<p>La combinación \(\sqrt{\gamma p/\rho}\) es justamente la velocidad del sonido. La longitud efectiva es algo mayor que la del cuello porque arrastra un poco de aire en cada extremo: \(L_{\text{ef}}\approx L+1.45\,r\) (unos \(0.85r\) por dentro y \(0.6r\) por fuera).</p>
<p>Si se echa un volumen \(V_w\) de agua en una botella de volumen \(V_0\), el aire ocupa \(V=V_0-V_w\). Elevando al cuadrado e invirtiendo:</p>
<div class="eq key" data-name="Linealización">\[\frac{1}{f^2}=\frac{4\pi^2L_{\text{ef}}}{c^2A}\,(V_0-V_w) .\]</div>
<p>La gráfica de \(1/f^2\) contra \(V_w\) es una recta de pendiente negativa: de la pendiente sale \(c\) y del corte con el eje horizontal sale \(V_0\), el volumen de la botella.</p>
<div class="box local"><b>¿Y la presión de Popayán?</b> En Popayán \(p\approx822\) hPa y \(\rho\approx0.98\) kg/m³; en Cartagena, 1013 hPa y 1.20 kg/m³. El cociente \(p/\rho=RT/M\) sólo depende de la temperatura, así que el sonido viaja igual de rápido en los dos lugares a la misma temperatura: \(c=331.3\sqrt{1+T/273.15}\) m/s, unos 343 m/s a 20 °C. Ésta es una de las predicciones que la práctica pone a prueba.</div>
</section>

<section>
<h2>Materiales y montaje</h2>
<div class="tablewrap narrow"><table class="bom">
<thead><tr><th>Material</th><th>Cantidad</th></tr></thead>
<tbody>
<tr><td>Botella de vidrio de cuello recto (cerveza o vino), limpia</td><td>1</td></tr>
<tr><td>Jarra medidora o jeringa de 60 mL (o la celda de carga: 1 g de agua = 1 mL)</td><td>1</td></tr>
<tr><td>Celular con phyphox; soporte LEGO para dejarlo a 10 cm de la boca</td><td>1</td></tr>
<tr><td>Calibrador (diámetro interior y largo del cuello); termómetro o DS18B20</td><td>1</td></tr>
</tbody></table></div>
<p>Mida el diámetro interior del cuello y su longitud recta (hasta donde empieza a ensancharse). Deje el celular en un soporte de ladrillos con el micrófono (abajo del teléfono) apuntando a la boca de la botella, siempre a la misma distancia. Trabaje en un salón silencioso.</p>
</section>

<section>
<h2>Configuración</h2>
<p>En phyphox abra <b>Espectro de audio</b> (en la sección «Acústica»). Muestra la amplitud contra la frecuencia y el valor del pico. Use una ventana de 8192 o 16384 muestras para tener buena resolución, y fije el pico con el botón de pausa. Alternativa: <b>Autocorrelación de audio</b>, que da directamente la frecuencia del tono dominante.</p>
<div class="box tip">La resolución del espectro es \(\Delta f=f_s/N\): con \(f_s=48\,000\) Hz y \(N=16\,384\) muestras, \(\Delta f\approx2.9\) Hz; phyphox interpola el pico y alcanza fracciones de hertz. Grabar más tiempo afina el pico (capítulo 3).</div>
</section>

<section>
<h2>Experimento virtual</h2>
<div class="sim" data-sim="f9-helmholtz" data-title="Botella resonante y espectro de audio" data-layout="below"></div>
<div class="sim-guide"><ul>
<li>Sople con la botella vacía y lea el pico del espectro; agréguelo a la tabla. Luego eche agua de a 100 mL y repita.</li>
<li>La recta de \(1/f^2\) contra \(V_w\) corta el eje en el volumen de la botella. De su pendiente sale \(c\).</li>
<li>Cambie el lugar a Cartagena: la presión y la densidad cambian, la velocidad del sonido no. Cambie la temperatura: ahí sí.</li>
<li>Con «Escuchar» puede oír el tono de la botella.</li>
</ul></div>
</section>

<section>
<h2>Procedimiento</h2>
<ol class="steps">
<li><b>Mida el cuello</b><p>Diámetro interior y longitud (tres veces cada uno). Anote la temperatura del salón.</p></li>
<li><b>Botella vacía.</b><p>Sople suave y sostenido, de lado sobre la boca, hasta que suene limpio. Registre el pico en el espectro. Cinco soplidos.</p></li>
<li><b>Con agua.</b><p>Agregue 100 mL de agua medidos con la jarra o la balanza y repita. Siga hasta que la botella esté casi llena (el agua no debe llegar al cuello).</p></li>
<li><b>Llene la botella</b><p>hasta la base del cuello y mida ese volumen: es \(V_0\), para comparar con el ajuste.</p></li>
</ol>
</section>

<section>
<h2>Análisis de los datos</h2>
<ol>
<li>Promedie las cinco frecuencias de cada volumen y estime su incertidumbre.</li>
<li>Grafique \(1/f^2\) contra \(V_w\) y ajuste una recta \(y=a+bV_w\).</li>
<li>Obtenga \(c=\sqrt{-4\pi^2L_{\text{ef}}/(A\,b)}\) y \(V_0=-a/b\). Propague las incertidumbres de \(b\), \(r\) y \(L\) (¿cuál domina?).</li>
<li>Compare \(c\) con \(331.3\sqrt{1+T/273.15}\) y \(V_0\) con el volumen medido.</li>
</ol>
</section>

<section>
<h2>Preguntas, fuentes de error y extensiones</h2>
<ol class="problems">
<li><span class="lvl">Problema</span>Una botella de vino tiene cuello de 19 mm de diámetro interior y 75 mm de largo, y 750 mL de cuerpo. ¿Qué frecuencia se espera a 20 °C?
<details><summary>Respuesta</summary><p>\(r=9.5\) mm, \(A=2.84\times10^{-4}\) m², \(L_{\text{ef}}=0.075+1.45(0.0095)=0.0888\) m. \(f=\dfrac{343}{2\pi}\sqrt{\dfrac{2.84\times10^{-4}}{7.5\times10^{-4}\times0.0888}}=113\) Hz.</p></details></li>
<li><span class="lvl">Problema</span>Con agua, la frecuencia sube de 113 Hz a 226 Hz. ¿Qué fracción del volumen se llenó?
<details><summary>Respuesta</summary><p>\(f\propto V^{-1/2}\): doblar la frecuencia exige reducir el volumen de aire a la cuarta parte, es decir, llenar 3/4 de la botella.</p></details></li>
<li><span class="lvl">Concepto</span>¿Por qué se usa \(\gamma p\) y no simplemente \(p\) (compresión a temperatura constante)?
<details><summary>Respuesta</summary><p>Las oscilaciones son tan rápidas (cientos por segundo) que el calor no alcanza a fluir: la compresión es adiabática. Con \(p\) en lugar de \(\gamma p\) se obtendría \(c\approx290\) m/s, el error histórico de Newton.</p></details></li>
<li><span class="lvl">Extensión</span>Mida la velocidad del sonido con un tubo de PVC sumergido en un balde (resonancia de un cuarto de onda, \(f=c/[4(L+0.6r)]\)) y compare los dos métodos.</li>
</ol>
</section>
