<p class="lead">Un celular de gama media lleva dentro un acelerómetro, un giroscopio, un magnetómetro, un barómetro, un sensor de luz, un micrófono y una cámara de alta velocidad. Una placa ESP32 cuesta lo mismo que un almuerzo y mide voltajes, tiempos de microsegundos y cualquier sensor que se le conecte. Las piezas LEGO encajan con tolerancias de centésimas de milímetro. Con estas herramientas y un poco de método se pueden hacer mediciones de física que compiten con las de equipos comerciales que cuestan cien veces más.</p>

<div class="keyideas"><ul>
<li>El kit combina cuatro herramientas: el <strong>celular</strong> (sensores ya calibrados), la <strong>ESP32</strong> (electrónica a medida), <strong>App Inventor</strong> (aplicaciones propias sin saber programar en Java) y <strong>LEGO</strong> (montajes rígidos, repetibles y medibles).</li>
<li>Cada magnitud tiene una herramienta preferida: el celular para aceleración, rotación, campo magnético y presión; la ESP32 para tiempos, voltajes, fuerzas y distancias.</li>
<li>Un kit completo para un grupo de tres estudiantes cuesta del orden de 400 000 pesos, y casi todo se reutiliza año tras año.</li>
<li>La calidad de la medición depende más del método (montaje firme, repetición, análisis con incertidumbre) que del precio del sensor.</li>
</ul></div>

<section>
<h2>Un laboratorio que cabe en una caja</h2>
<p>Los laboratorios de física tradicionales usan sensores dedicados: un sensor de movimiento, una fotocompuerta, un sensor de fuerza, cada uno con su interfaz y su programa. Funcionan muy bien, pero cada sensor cuesta cientos de dólares y casi nunca alcanzan para que cada grupo trabaje con el suyo. La propuesta de este curso es distinta: usar lo que ya está en el bolsillo de los estudiantes y completarlo con electrónica barata y piezas de construcción.</p>
<p>La idea no es improvisar. Los sensores del celular son dispositivos <span class="term">MEMS</span> (sistemas microelectromecánicos) fabricados en serie, calibrados en fábrica y con resoluciones del orden de milésimas de m/s². La ESP32 tiene un procesador de 240 MHz, un convertidor analógico-digital de 12 bits y un reloj que cuenta microsegundos. Lo que falta para convertirlos en instrumentos de laboratorio es un <strong>montaje firme</strong>, un <strong>protocolo de medición</strong> y un <strong>análisis honesto de la incertidumbre</strong>. Eso es lo que enseña este curso.</p>
<div class="box note">
<p>Cada práctica de este curso tiene la misma estructura: una ficha con el objetivo y los materiales, el fundamento teórico, el montaje con instrucciones LEGO paso a paso, la configuración del sensor (código de la ESP32, ajustes de phyphox o bloques de App Inventor), una <strong>simulación del experimento</strong> que genera datos realistas, el procedimiento con casillas para marcar, el análisis de los datos y las preguntas para el informe.</p>
</div>
</section>

<section>
<h2>Las cuatro herramientas</h2>
<div class="modgrid">
<div class="mod"><div class="mod-top"><b>El celular</b><span class="kit cel">Celular</span></div>
<p>Sensores integrados y calibrados; la aplicación gratuita <i>phyphox</i> los registra, grafica y exporta.</p>
<ul><li>Acelerómetro, giroscopio, magnetómetro, barómetro, luz, proximidad, micrófono, cámara.</li><li>Hasta 400–500 muestras por segundo en los sensores de movimiento.</li><li>Limitación: el sensor está dentro de una caja de 150–200 g y no se sabe exactamente dónde.</li></ul></div>
<div class="mod"><div class="mod-top"><b>La placa ESP32</b><span class="kit esp">ESP32</span></div>
<p>Microcontrolador con Wi-Fi y Bluetooth que se programa desde el entorno de Arduino.</p>
<ul><li>Mide tiempos con resolución de 1 µs, voltajes con 12 bits y lee decenas de módulos sensores.</li><li>Envía los datos al computador por USB o al celular por Bluetooth.</li><li>Limitación: hay que armar el circuito y escribir (o copiar) el programa.</li></ul></div>
<div class="mod"><div class="mod-top"><b>MIT App Inventor</b><span class="kit ai">App Inventor</span></div>
<p>Entorno web gratuito para crear aplicaciones Android encajando bloques.</p>
<ul><li>Aplicaciones propias para registrar sensores, recibir datos de la ESP32 y graficar.</li><li>Se prueba al instante en el celular con la aplicación <i>MIT AI2 Companion</i>.</li><li>Limitación: el muestreo con temporizador es irregular; hay que guardar el tiempo de cada dato.</li></ul></div>
<div class="mod"><div class="mod-top"><b>Piezas LEGO</b><span class="kit lego">LEGO</span></div>
<p>Sistema de construcción con medidas exactas: módulo de 8.0 mm, ladrillo de 9.6 mm, placa de 3.2 mm.</p>
<ul><li>Soportes, carriles, rampas de ángulo conocido, péndulos, poleas y marcos para sensores.</li><li>Montajes repetibles: otro grupo arma exactamente lo mismo.</li><li>Limitación: el plástico es liviano y algo flexible; los montajes altos necesitan refuerzos.</li></ul></div>
</div>
<p>Las herramientas se combinan. En la práctica del péndulo, por ejemplo, el celular cuelga de un eje Technic y su giroscopio mide la velocidad angular; en la máquina de Atwood, una polea LEGO con una rueda ranurada interrumpe un haz infrarrojo que la ESP32 cronometra, y una aplicación de App Inventor recibe los tiempos por Bluetooth y los grafica.</p>
<p>La simulación siguiente funciona como una guía rápida: elija la magnitud que quiere medir y compare las opciones disponibles en el kit, con su resolución típica, su frecuencia de muestreo y su costo adicional.</p>
<div class="sim" data-sim="kit-selector" data-title="¿Con qué mido? Guía de selección de sensores"></div>
<div class="sim-guide"><ul>
<li>Observe que para una misma magnitud suele haber una opción «sin costo» (el celular) y otra más flexible (la ESP32 con un módulo).</li>
<li>La barra de resolución está en escala logarítmica: cada marca es un factor 10.</li>
<li>Para medir tiempos de paso, la fotocompuerta con la ESP32 es 1000 veces más fina que un cronómetro manual.</li>
</ul></div>
</section>

<h2>Contenido del kit y presupuesto</h2>
<p>El kit se organiza en módulos que se pueden comprar por etapas. El <strong>kit base</strong> (ESP32, protoboard, cables y componentes) sirve para todas las áreas; los kits de mecánica, electromagnetismo y fluidos añaden los sensores específicos. Las piezas LEGO pueden ser originales usadas (se venden por kilo) o compatibles; para los montajes de este curso conviene un lote con vigas y ejes Technic.</p>

<section>
<h2>Organización del trabajo en el aula</h2>
<p>Las prácticas están pensadas para grupos de tres estudiantes con roles que rotan en cada sesión:</p>
<ul>
<li><strong>Montaje:</strong> arma la estructura LEGO, nivela y mide longitudes, ángulos y masas.</li>
<li><strong>Instrumentación:</strong> conecta la ESP32 o configura el celular, carga el programa y comprueba que los datos tienen sentido.</li>
<li><strong>Análisis:</strong> organiza las tablas, hace las gráficas y los ajustes y estima las incertidumbres.</li>
</ul>
<p>Cada práctica tiene tres momentos. <strong>Antes</strong> de la sesión, el grupo lee el fundamento, explora la simulación y responde las preguntas previas: así llega sabiendo qué esperar. <strong>Durante</strong> la sesión, sigue el procedimiento y marca los pasos. <strong>Después</strong>, analiza los datos reales, los compara con los simulados y escribe el informe (vea el apéndice <a href="#informe">El informe de laboratorio</a>).</p>
<div class="tablewrap narrow"><table>
<thead><tr><th>Momento</th><th>Duración típica</th><th>Producto</th></tr></thead>
<tbody>
<tr><td>Preparación con la simulación</td><td class="num">30–45 min</td><td>Predicciones y tabla de datos vacía</td></tr>
<tr><td>Montaje y prueba</td><td class="num">20–30 min</td><td>Montaje fotografiado, sensor funcionando</td></tr>
<tr><td>Toma de datos</td><td class="num">40–60 min</td><td>Archivos CSV con nombre claro</td></tr>

</tbody></table></div>

</div>

<section>
<h2>Seguridad</h2>
<div class="box safe">
<h4>Imanes de neodimio</h4>
<p>Son muy fuertes: dos imanes que se atraen pueden pellizcar la piel o romperse en astillas. Guárdelos separados con espaciadores. Nunca deben estar al alcance de niños pequeños (si se tragan dos, pueden perforar el intestino). Manténgalos lejos de marcapasos, tarjetas con banda magnética y discos duros. Acérquelos al celular sólo lo necesario: un campo muy intenso puede desmagnetizar levemente el sensor y habrá que recalibrar la brújula.</p>
</div>
<div class="box safe">
<h4>Agua y electrónica</h4>
<p>En las prácticas de fluidos el celular o la ESP32 entran en bolsas herméticas dobles. Revise la bolsa antes de cada inmersión, trabaje sobre una bandeja y tenga papel absorbente a mano. Nunca conecte la ESP32 al computador si se mojó: desconéctela, séquela durante un día y pruébela con un cargador.</p>
</div>
<div class="box safe">
<h4>Energía</h4>
<p>La ESP32 se alimenta por USB (5 V). No la conecte a fuentes de más de 12 V por el pin VIN y no conecte nunca un pin de entrada a 5 V: sus entradas toleran como máximo 3.3 V. Las baterías de litio (de los celulares y de las baterías portátiles) no se perforan, no se calientan y no se dejan cargando sin vigilancia. Las corrientes de las prácticas de electromagnetismo son menores de 1 A, pero un alambre en cortocircuito con una pila se calienta mucho: desconecte siempre al terminar la medición.</p>
</div>
<div class="box safe">
<h4>Mecánica y materiales</h4>
<p>Los celulares que oscilan, ruedan o giran deben ir sujetos con bandas elásticas o en un soporte con tope; el piso bajo un experimento de caída se cubre con una toalla o un cojín. La glicerina y la miel son inofensivas, pero resbalosas. Los balines de acero y las arandelas se guardan contados.</p>
</div>
</section>

<section>
<h2>Preguntas para empezar</h2>
<ol class="problems">
<li><span class="lvl">Reflexión</span>¿Qué sensores tiene su celular? Instale <i>phyphox</i> y revise la lista de sensores disponibles en el menú. Anote el modelo del celular y los sensores que faltan.
<details><summary>Orientación</summary><p>En el menú de phyphox (tres puntos) está «Información del dispositivo», que muestra cada sensor con su fabricante, su rango, su resolución y su frecuencia máxima. Casi todos los celulares tienen acelerómetro; el giroscopio y el magnetómetro faltan en algunos de gama baja; el barómetro sólo está en los de gama media o alta.</p></details></li>
<li><span class="lvl">Planeación</span>Su institución puede comprar este año sólo el kit base y un módulo. Si el curso es de Física I, ¿cuál elegiría? ¿Qué prácticas podría hacer?
<details><summary>Orientación</summary><p>El kit base más el de mecánica permite las nueve prácticas de mecánica. Varias se pueden hacer sólo con el celular y LEGO (péndulo, plano inclinado, movimiento circular, rodadura, fricción).</p></details></li>
<li><span class="lvl">Concepto</span>¿Por qué un montaje LEGO puede dar mejores mediciones que un montaje improvisado con cinta y cartón, si los dos «sostienen» el sensor?
<details><summary>Orientación</summary><p>Porque es rígido, sus dimensiones se conocen sin medir (múltiplos de 8.0 mm y 3.2 mm) y se puede repetir exactamente: si se desarma y se vuelve a armar, la geometría es la misma. Eso reduce la incertidumbre de tipo B en longitudes y ángulos y permite comparar resultados entre grupos.</p></details></li>
</ol>
</section>
