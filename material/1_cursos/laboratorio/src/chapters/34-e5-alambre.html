<p class="lead">Un alambre recto con corriente rodea su espacio de líneas de campo circulares que se debilitan como \(1/r\). Enrollado en espiral, el mismo alambre concentra un campo casi uniforme dentro de un tubo. Con separadores LEGO que fijan la distancia en múltiplos de 3.2 mm se mide la ley de Ampère y se calibra el sensor Hall del kit.</p>

<div class="ficha"><div class="ficha-head"><b>Ficha de la práctica</b><span>E5 · 2 horas</span></div><dl>
<dt>Objetivo</dt><dd>Comprobar \(B=\mu_0I/(2\pi r)\) para un alambre largo y \(B=\mu_0nI\) para un solenoide; calibrar un sensor Hall SS49E.</dd>
<dt>Herramientas</dt><dd><span class="kit cel">Celular</span> (alambre) · <span class="kit esp">ESP32</span> con SS49E (solenoide) · <span class="kit lego">LEGO</span> (separadores)</dd>
<dt>Se mide</dt><dd>Campo magnético contra distancia y contra corriente</dd>
<dt>Conceptos</dt><dd>Ley de Ampère, ley de Biot–Savart, superposición, calibración de sensores</dd>
<dt>Costo extra</dt><dd>Cable de 1 m, tubo de PVC con alambre esmaltado enrollado, resistencia de potencia</dd>
</dl></div>

<section>
<h2>Fundamento</h2>
<p>La ley de Ampère aplicada a un círculo de radio \(r\) alrededor de un alambre recto y largo con corriente \(I\) da</p>
<div class="eq key" data-name="Alambre recto largo">\[B=\frac{\mu_0 I}{2\pi r}=2\times10^{-7}\,\frac{I}{r}\ \text{T},\]</div>
<p>tangente a círculos alrededor del alambre. A 1 cm de un alambre con 1 A, son 20 µT: comparable al campo terrestre, y fácil de medir con el celular si se resta el fondo. Como no se sabe a qué profundidad está el sensor bajo la superficie del celular, la distancia real es \(r=h+\delta\), con \(h\) la altura del alambre sobre el celular (fijada con placas LEGO de 3.2 mm). Linealizando: \(1/B=2\pi(h+\delta)/(\mu_0I)\), recta en \(h\) cuyo intercepto da \(\delta\).</p>
<p>Dentro de un solenoide largo de \(n\) espiras por metro, el campo es uniforme y vale</p>
<div class="eq key" data-name="Solenoide largo">\[B=\mu_0\,n\,I .\]</div>
<p>Con 400 espiras en 20 cm (\(n=2000\) m⁻¹) y 0.8 A, \(B=2.0\) mT: demasiado para el magnetómetro del celular dentro del tubo, pero adecuado para el sensor Hall SS49E, que cabe dentro y da unos 18 mV. Como \(B\) se conoce, el solenoide sirve para calibrar el sensor. La señal es pequeña: promedie muchas lecturas del ADC.</p>
</section>

<section>
<h2>Materiales y montaje</h2>
<div class="tablewrap narrow"><table class="bom">
<thead><tr><th>Material</th><th>Cantidad</th></tr></thead>
<tbody>
<tr><td>Cable de cobre recto de 1 m sobre una regla, y cables de retorno largos</td><td>1</td></tr>
<tr><td>Portapilas de 2 AA y resistencia de potencia de 2.2 Ω (5 W) o reóstato</td><td>1</td></tr>
<tr><td>Placas LEGO como separadores (múltiplos de 3.2 mm)</td><td>10</td></tr>
<tr><td>Tubo de PVC de 2 cm con 400 vueltas de alambre esmaltado (dos capas) en 20 cm</td><td>1</td></tr>
<tr><td>Sensor SS49E en la punta de una viga Technic (para meterlo al tubo)</td><td>1</td></tr>
<tr><td>INA219 o multímetro; celular con phyphox</td><td>1</td></tr>
</tbody></table></div>
<div class="box safe">
<p>Una resistencia de 2.2 Ω con 3 V disipa unos 4 W y se calienta mucho: use una de 5 W o más, sobre una superficie que no se queme, y cierre el circuito sólo unos segundos por medición. Nunca cortocircuite las pilas directamente con el alambre.</p>
</div>
<p><b>Alambre:</b> el celular plano sobre la mesa; el alambre recto pasa por encima, perpendicular al eje \(y\), apoyado sobre una pila de placas LEGO a cada lado. El circuito de retorno debe ir lejos (más de 50 cm), para que su campo no se sume. <b>Solenoide:</b> el SS49E entra por el tubo montado en una viga Technic graduada en módulos de 8 mm, para medir el campo a lo largo del eje.</p>
</section>

<section>
<h2>Configuración</h2>
<p>Celular: «Magnetómetro», registrando 3 s con corriente y 3 s sin ella en cada altura. Sensor Hall: el programa del capítulo 7, que ya resta el cero sin campo. Corriente: INA219 o multímetro en serie.</p>
</section>

<section>
<h2>Experimento virtual</h2>
<div class="sim" data-sim="e5-alambre" data-title="Alambre recto y solenoide" data-layout="below"></div>
<div class="sim-guide"><ul>
<li>Alambre: suba el alambre de a una placa (3.2 mm) y agregue cada medida. \(1/B\) contra \(h\) es una recta; su intercepto revela la profundidad del sensor.</li>
<li>Solenoide: varíe la corriente con el sensor en el centro y ajuste \(V\) contra \(B=\mu_0nI\): la pendiente es la sensibilidad del SS49E.</li>
<li>Recorra el eje del solenoide: el campo es uniforme en el centro y baja a la mitad en los extremos.</li>
</ul></div>
</section>

<section>
<h2>Procedimiento</h2>
<ol class="steps">
<li><b>Alambre: fondo.</b><p>Con el circuito abierto, registre el campo con el celular quieto.</p></li>
<li><b>Primera altura.</b><p>Alambre apoyado directamente sobre el celular (\(h\) = 0). Cierre el circuito, registre 3 s, abra.</p></li>
<li><b>Más alturas.</b><p>Agregue placas a los apoyos (1, 2, 3, 5, 8, 12 placas) y repita. Mida la corriente en cada caso.</p></li>
<li><b>Solenoide: centro.</b><p>Con el SS49E en el centro del tubo, mida el voltaje para 6 corrientes entre 0 y 1 A (unos segundos cada una).</p></li>
<li><b>Solenoide: perfil.</b><p>Con 0.6 A fijos, recorra el eje en pasos de un módulo LEGO (8 mm), desde 5 cm afuera hasta el centro.</p></li>
</ol>
</section>

<section>
<h2>Análisis de los datos</h2>
<ol>
<li>Alambre: calcule \(\Delta B\) (con y sin corriente). Grafique \(1/\Delta B\) contra \(h\): la pendiente es \(2\pi/(\mu_0I)\) y el intercepto/pendiente es \(\delta\). Obtenga \(\mu_0\).</li>
<li>Con \(r=h+\delta\), compruebe en log–log que la pendiente es −1.</li>
<li>Solenoide: calcule \(B=\mu_0nI\) y grafique el voltaje del sensor contra \(B\): la pendiente es su sensibilidad (mV/mT). Compárela con la nominal (≈ 9 mV/mT a 3.3 V).</li>
<li>Perfil: grafique \(B(z)/B_{\text{centro}}\) y compárelo con la fórmula del solenoide finito: \(\tfrac12[\cos\alpha_1+\cos\alpha_2]\).</li>
</ol>
</section>

<section>
<h2>Preguntas, fuentes de error y extensiones</h2>
<ol class="problems">
<li><span class="lvl">Problema</span>Con 1.20 A, el campo medido pasa de 30.5 µT (alambre a 3.2 mm sobre el celular) a 12.9 µT (a 12.8 mm). Halle la profundidad del sensor.
<details><summary>Respuesta</summary><p>\(30.5(3.2+\delta)=12.9(12.8+\delta)\Rightarrow 97.6+30.5\delta=165.1+12.9\delta\Rightarrow\delta=3.8\) mm. Comprobación: \(B=2\times10^{-7}(1.20)/0.0070=34\) µT a 7.0 mm; los datos dan 30.5 µT, un 10 % menos, señal de que el alambre no es infinitamente largo o de que la corriente es algo menor.</p></details></li>
<li><span class="lvl">Concepto</span>¿Por qué el circuito de retorno debe ir lejos del celular?
<details><summary>Respuesta</summary><p>Porque la corriente de regreso va en sentido contrario y su campo se resta. Si los dos tramos están cerca, el campo neto cae mucho más rápido que \(1/r\) (como el de un dipolo de corriente).</p></details></li>
<li><span class="lvl">Extensión</span>Mida el campo de dos alambres paralelos con corrientes iguales en el mismo sentido y en sentidos opuestos.</li>
</ol>
</section>
