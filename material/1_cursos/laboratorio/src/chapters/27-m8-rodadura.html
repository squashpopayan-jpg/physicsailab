<template class="chapter-src" data-id="m8" data-num="M8" data-title="Rodadura y momento de inercia" data-part="Parte III · Prácticas de mecánica" data-kits="cel esp lego" data-short="Carrera de aros, discos y esferas por una rampa: la aceleración revela cómo se reparte la masa. El giroscopio dentro de un tarro mide la aceleración angular">
<p class="lead">Suelte a la vez un aro, un disco y una bola por la misma rampa: no llegan juntos, aunque tengan masas y tamaños distintos. Lo que decide la carrera es cómo está repartida la masa alrededor del eje, es decir, el momento de inercia. En esta práctica se mide con fotocompuertas, con el sensor ultrasónico y con un celular metido en un tarro que rueda.</p>

<div class="ficha"><div class="ficha-head"><b>Ficha de la práctica</b><span>M8 · 2 horas</span></div><dl>
<dt>Objetivo</dt><dd>Medir la aceleración de cuerpos que ruedan sin deslizar y obtener su factor de inercia \(\beta=I/(mR^2)\).</dd>
<dt>Herramientas</dt><dd><span class="kit cel">Celular</span> (giroscopio) · <span class="kit esp">ESP32</span> (fotocompuertas o HC-SR04) · <span class="kit lego">LEGO</span></dd>
<dt>Se mide</dt><dd>Tiempos de paso o posición; velocidad angular del tarro</dd>
<dt>Conceptos</dt><dd>Rodadura sin deslizamiento, energía de rotación, momento de inercia</dd>
<dt>Costo extra</dt><dd>Objetos caseros: un tubo, una lata, una bola, un tarro de pintura de 5 L vacío</dd>
</dl></div>

<section>
<h2>Fundamento</h2>
<p>Un cuerpo de masa \(m\), radio \(R\) y momento de inercia \(I=\beta mR^2\) rueda sin deslizar por un plano de ángulo θ. Combinando la segunda ley para la traslación y para la rotación (o la conservación de la energía):</p>
<div class="eq key" data-name="Aceleración en rodadura">\[a=\frac{g\,\sen\theta}{1+\beta},\qquad \beta=\frac{I}{mR^2},\qquad \alpha=\frac{a}{R}.\]</div>
<div class="tablewrap narrow"><table>
<thead><tr><th>Cuerpo</th><th class="c">β</th><th class="c">\(a/(g\,\sen\theta)\)</th></tr></thead>
<tbody>
<tr><td>Aro o tubo delgado</td><td class="c num">1</td><td class="c num">0.500</td></tr>
<tr><td>Esfera hueca</td><td class="c num">2/3</td><td class="c num">0.600</td></tr>
<tr><td>Disco o cilindro macizo</td><td class="c num">1/2</td><td class="c num">0.667</td></tr>
<tr><td>Esfera maciza</td><td class="c num">2/5</td><td class="c num">0.714</td></tr>
<tr><td>Bloque que desliza sin fricción</td><td class="c num">0</td><td class="c num">1.000</td></tr>
</tbody></table></div>
<p>La masa y el radio se cancelan: todas las esferas macizas bajan igual, sean de acero o de vidrio, grandes o pequeñas. Midiendo \(a\) y \(\theta\) se obtiene \(\beta=g\,\sen\theta/a-1\).</p>
<h3>El celular dentro de un tarro</h3>
<p>Un celular pegado (con cinta doble faz y relleno de espuma) en el fondo de un tarro cilíndrico grande gira con él. Su giroscopio mide \(\omega_z(t)\) directamente: la pendiente es \(\alpha\), y \(a=\alpha R\). Como el celular y la espuma están cerca del eje, el tarro sigue siendo casi un aro.</p>
</section>

<section>
<h2>Materiales y montaje</h2>
<div class="tablewrap narrow"><table class="bom">
<thead><tr><th>Material</th><th>Cantidad</th></tr></thead>
<tbody>
<tr><td>Tabla lisa de 1 m o carril ancho de placas LEGO, con torre LEGO para fijar el ángulo</td><td>1</td></tr>
<tr><td>Tubo de PVC (aro), cilindro macizo (vela, rodillo), bola maciza, pelota hueca</td><td>1 c/u</td></tr>

</tbody></table></div>
<div class="sim" data-sim="lego-modelo" data-model="rampa" data-title="Rampa LEGO (la misma de M2, más larga)"></div>
<p>Para que los cuerpos rueden sin deslizar, el ángulo debe ser moderado (5° a 15°) y la superficie, poco resbalosa (una tira de cartulina o papel de lija fino sobre la tabla). Una placa LEGO como compuerta de salida permite soltar todos los cuerpos a la vez.</p>
</section>

<section>
<h2>Configuración</h2>
<p><b>Con fotocompuertas:</b> use el programa de M6. Con dos compuertas a distancia \(D\) y los tiempos de paso del cuerpo por cada una (\(v=d_{\text{cuerpo}}/\Delta t\)), la aceleración es \(a=(v_2^2-v_1^2)/(2D)\). <b>Con el HC-SR04:</b> ajuste \(x(t)\) a una parábola. <b>Con el tarro:</b> phyphox, «Giroscopio», ejecución temporizada de 3 s y 6 s.</p>
</section>

<section>
<h2>Experimento virtual</h2>
<div class="sim" data-sim="m8-rodadura" data-title="Carrera de rodadura y el tarro con el celular" data-layout="below"></div>
<div class="sim-guide"><ul>
<li>Lance la carrera: el orden de llegada es siempre esfera maciza, disco, esfera hueca, aro, sin importar las masas.</li>
<li>Elija el tarro con celular: la pendiente de \(\omega_z(t)\) es α. Agregue cada cuerpo a la tabla y compare β medido con el teórico.</li>
<li>Aumente el ángulo hasta que el cuerpo deslice: β aparente baja, porque ya no rueda sin deslizar.</li>
</ul></div>
</section>

<section>
<h2>Procedimiento</h2>
<ol class="steps">
<li><b>Fije el ángulo</b><p>con la torre y mida el largo y la altura de la rampa (o léalo con el inclinómetro de phyphox).</p></li>
<li><b>Carrera cualitativa.</b><p>Suelte dos cuerpos a la vez y anote cuál llega primero. Repita con todas las parejas.</p></li>
<li><b>Mediciones.</b><p>Para cada cuerpo, cinco bajadas con fotocompuertas o ultrasonido.</p></li>
<li><b>El tarro.</b><p>Fije el celular con espuma en el fondo del tarro, centrado, con la pantalla hacia la tapa. Ciérrelo y hágalo rodar tres veces con ejecución temporizada.</p></li>
<li><b>Mida masas y radios</b><p>de todos los cuerpos (para la discusión, no para el cálculo de β).</p></li>
</ol>
</section>

<section>
<h2>Análisis de los datos</h2>
<ol>
<li>Calcule \(a\) de cada bajada y su promedio por cuerpo. Con el tarro, ajuste \(\omega_z(t)\) en el tramo de bajada: \(a=\alpha R\).</li>
<li>Obtenga \(\beta=g\,\sen\theta/a-1\) con su incertidumbre (propague las de \(a\) y θ).</li>
<li>Compare con los valores ideales. Las diferencias de unos pocos por ciento suelen deberse a la resistencia a la rodadura; si son grandes, el cuerpo deslizó.</li>
<li>Para el tarro, estime β teniendo en cuenta la tapa, el fondo y el celular, y compárelo con el medido.</li>
</ol>
</section>

<section>
<h2>Preguntas, fuentes de error y extensiones</h2>
<ol class="problems">
<li><span class="lvl">Problema</span>En una rampa de 8.0°, un cilindro baja con \(a=0.905\) m/s². ¿Cuánto vale β? ¿Es macizo o hueco?
<details><summary>Respuesta</summary><p>\(g\,\sen\theta=9.777(0.1392)=1.361\) m/s²; \(\beta=1.361/0.905-1=0.504\): macizo (β = 0.5).</p></details></li>
<li><span class="lvl">Concepto</span>Una lata de sopa llena de líquido y una lata de frijoles compactos tienen la misma masa y tamaño. ¿Cuál baja más rápido?
<details><summary>Respuesta</summary><p>La de sopa: el líquido casi no gira con la lata (sólo gira la lámina metálica), así que su β efectivo es pequeño y acelera más. La de frijoles gira como un cilindro macizo (β ≈ 0.5).</p></details></li>
<li><span class="lvl">Error</span>¿Qué indica una aceleración angular del tarro que crece durante la bajada?
<details><summary>Respuesta</summary><p>Que no rueda sin deslizar (patina al comienzo) o que la rampa no es plana. Con rodadura pura, α es constante.</p></details></li>
</ol>
</section>
