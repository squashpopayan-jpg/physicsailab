<p class="lead">¿Cuánto hay que inclinar una tabla para que un objeto empiece a deslizar? La respuesta da el coeficiente de fricción estática, y la aceleración con que luego baja da el cinético. El celular hace las dos mediciones a la vez: es inclinómetro antes de deslizar y acelerómetro después.</p>

<div class="ficha"><div class="ficha-head"><b>Ficha de la práctica</b><span>M9 · 1.5 horas</span></div><dl>
<dt>Objetivo</dt><dd>Medir \(\mu_s\) y \(\mu_k\) para varios pares de superficies y comprobar que no dependen (casi) de la masa ni del área de contacto.</dd>
<dt>Herramientas</dt><dd><span class="kit cel">Celular</span><span class="kit lego">LEGO</span> · alternativa <span class="kit esp">ESP32</span> con celda de carga</dd>
<dt>Se mide</dt><dd>Ángulo de inclinación al empezar a deslizar; aceleración del deslizamiento; fuerza de tracción</dd>
<dt>Conceptos</dt><dd>Fricción estática y cinética, plano inclinado, efecto de adherencia y deslizamiento</dd>
<dt>Costo extra</dt><dd>Muestras de materiales: fieltro, lija, caucho, papel, cartón</dd>
</dl></div>

<section>
<h2>Fundamento</h2>
<p>Un bloque quieto sobre un plano inclinado necesita una fuerza de fricción estática \(f_s=mg\,\sen\theta\), que no puede superar \(\mu_s mg\cos\theta\). El bloque empieza a deslizar en el ángulo crítico:</p>
<div class="eq key" data-name="Ángulo crítico">\[\tan\theta_s=\mu_s .\]</div>
<p>Una vez que desliza, la fricción cinética es \(\mu_k mg\cos\theta\) (con \(\mu_k\lt\mu_s\)) y la aceleración es</p>
<div class="eq">\[a=g\,(\sen\theta-\mu_k\cos\theta)\quad\Rightarrow\quad \mu_k=\tan\theta-\frac{a}{g\cos\theta}.\]</div>
<p>El celular, con su eje \(y\) hacia arriba del plano, mide \(f_y=g\,\sen\theta\) y \(f_z=g\cos\theta\) mientras está quieto: el ángulo es \(\theta=\arctan(f_y/f_z)\), sin necesidad de transportador. Cuando desliza, \(f_y=g\,\sen\theta-a=\mu_k g\cos\theta\). Es decir, \(\mu_k=f_y/f_z\) durante el deslizamiento: ¡el cociente de las dos lecturas da directamente el coeficiente!</p>
<p><b>Variante con la celda de carga:</b> se tira horizontalmente del trineo con un hilo atado a la celda, que se mueve a velocidad constante. La fuerza sube hasta \(\mu_s mg\), cae de golpe y oscila alrededor de \(\mu_k mg\): es el fenómeno de <span class="term">adherencia y deslizamiento</span> (stick-slip), el mismo que hace chirriar una puerta.</p>
</section>

<section>
<h2>Configuración</h2>
<p>En phyphox use «Aceleración con g» con ejecución temporizada de 3 s y 30 s, o «Plano inclinado», que muestra el ángulo en vivo. Para la variante, el programa de la balanza del capítulo 7 con <code>get_units(1)</code> (sin promediar) para ver los saltos de la fuerza.</p>
</section>

<section>
<h2>Experimento virtual</h2>
<div class="sim" data-sim="m9-friccion" data-title="Plano que se inclina y tracción con la celda de carga" data-layout="below"></div>
<div class="sim-guide"><ul>
<li>Pulse «Inclinar»: el ángulo sube hasta que el trineo desliza; en ese instante \(f_y\) cae a \(\mu_k g\cos\theta\).</li>
<li>Repita varias veces: \(\theta_s\) varía unos grados entre ensayos. Promedie.</li>

<section>
<h2>Procedimiento</h2>
<ol class="steps">
<li><b>Limpie las superficies</b><p>(polvo y grasa cambian mucho los resultados) y nivele la tabla en posición horizontal.</p></li>
<li><b>Coloque el trineo</b><p>con el celular y su eje \(y\) apuntando hacia el extremo de la tabla que se va a levantar.</p></li>
<li><b>Inclinación lenta.</b><p>Inicie el registro y levante la tabla despacio hasta que el trineo deslice; atájelo al final.</p></li>
<li><b>Diez ensayos</b><p>con cada material, volviendo a poner el trineo siempre en el mismo lugar.</p></li>
<li><b>Masa.</b><p>Con un material, repita con 2 y 3 veces la masa.</p></li>
<li><b>Variante de tracción.</b><p>Tire con la celda de carga a velocidad constante y registre la fuerza.</p></li>
</ol>
</section>

<section>
<h2>Análisis de los datos</h2>
<ol>
<li>En cada registro calcule \(\theta(t)=\arctan(f_y/f_z)\). El ángulo crítico es el último valor antes de la caída brusca de \(f_y\). \(\mu_s=\tan\theta_s\).</li>
<li>Durante el deslizamiento promedie \(f_y/f_z\): es \(\mu_k\).</li>
<li>Para cada material informe \(\mu_s\) y \(\mu_k\) con media y error estándar de los diez ensayos. La dispersión de \(\mu_s\) suele ser mayor: el inicio del deslizamiento es un fenómeno «estadístico».</li>
<li>Con la masa variable, compruebe si los coeficientes cambian (en el modelo de Coulomb, no deberían).</li>
</ol>
</section>

<section>
<h2>Preguntas, fuentes de error y extensiones</h2>
<ol class="problems">
<li><span class="lvl">Problema</span>Un trineo empieza a deslizar a 24.5° y, deslizando, el celular marca \(f_y=3.56\) m/s² y \(f_z=8.90\) m/s². Halle \(\mu_s\) y \(\mu_k\).
<details><summary>Respuesta</summary><p>\(\mu_s=\tan24.5°=0.456\). \(\mu_k=3.56/8.90=0.400\). (Note que \(f_z=g\cos24.5°\): la tabla sigue en el ángulo crítico).</p></details></li>
<li><span class="lvl">Concepto</span>¿Por qué no importa la masa del trineo?
<details><summary>Respuesta</summary><p>Porque tanto la componente del peso que lo hace deslizar como la normal (y con ella la fricción máxima) son proporcionales a \(mg\); la masa se cancela en \(\tan\theta_s\).</p></details></li>
<li><span class="lvl">Error</span>Si la tabla se levanta rápido, ¿el ángulo crítico medido es mayor o menor?
<details><summary>Respuesta</summary><p>Mayor: entre el instante en que se supera el ángulo crítico y el momento en que el deslizamiento se nota, la tabla sigue subiendo. Además, las vibraciones de la mano pueden disparar el deslizamiento antes. Por eso se pide subirla despacio y de forma pareja.</p></details></li>
</ol>
</section>
