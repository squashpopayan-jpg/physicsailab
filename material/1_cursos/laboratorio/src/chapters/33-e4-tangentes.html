<template class="chapter-src" data-id="e4" data-num="E4" data-title="Campo terrestre y brújula de tangentes" data-part="Parte IV · Prácticas de electromagnetismo" data-kits="cel esp" data-short="Una bobina circular en el meridiano magnético desvía la brújula: con el magnetómetro del celular se miden el campo de la bobina, μ₀ y la componente horizontal del campo terrestre en Popayán">
<p class="lead">En 1820 Ørsted vio que una corriente desviaba una brújula. Pocos años después, el galvanómetro de tangentes convirtió esa desviación en un medidor de corriente. Hoy se puede hacer al revés: con una corriente conocida y el magnetómetro del celular, se mide el campo terrestre de Popayán y se comprueba el valor de \(\mu_0\).</p>

<div class="ficha"><div class="ficha-head"><b>Ficha de la práctica</b><span>E4 · 2 horas</span></div><dl>
<dt>Objetivo</dt><dd>Medir el campo en el centro de una bobina circular, obtener \(\mu_0\), y medir la componente horizontal y la inclinación del campo terrestre.</dd>
<dt>Herramientas</dt><dd><span class="kit cel">Celular</span> · <span class="kit esp">ESP32</span> con INA219 (o un multímetro) para la corriente</dd>
<dt>Se mide</dt><dd>Componentes del campo magnético; corriente en la bobina</dd>
<dt>Conceptos</dt><dd>Ley de Biot–Savart, campo de una espira, superposición de campos, campo geomagnético</dd>
<dt>Costo extra</dt><dd>Alambre esmaltado, un bastidor de bordado de 20 cm, portapilas AA</dd>
</dl></div>

<section>
<h2>Fundamento</h2>
<p>Una bobina circular de \(N\) espiras y radio \(R\) con corriente \(I\) produce en su centro un campo perpendicular a su plano (ley de Biot–Savart):</p>
<div class="eq key" data-name="Campo en el centro de una bobina">\[B_b=\frac{\mu_0 N I}{2R}.\]</div>
<p>Si el plano de la bobina es vertical y está orientado en el meridiano magnético (norte–sur), su campo en el centro apunta al este o al oeste, perpendicular a la componente horizontal del campo terrestre \(B_H\). La brújula (o el «norte» que calcula el celular) se orienta según la suma de los dos y se desvía un ángulo</p>
<div class="eq">\[\tan\theta=\frac{B_b}{B_H}=\frac{\mu_0 N}{2RB_H}\,I .\]</div>
<p>Con el celular en el centro hay dos mediciones posibles. El aumento de la componente este–oeste, \(\Delta B_x\), da directamente \(B_b\): la pendiente de \(\Delta B_x\) contra \(I\) es \(\mu_0N/(2R)\). Y la tangente del ángulo de desviación contra \(I\) tiene pendiente \(\mu_0N/(2RB_H)\), de donde sale \(B_H\). El valor esperado en Popayán es \(B_H\approx26.7\) µT, con una componente vertical de 11.7 µT hacia abajo (inclinación de 24°).</p>
</section>

<section>
<h2>Materiales y montaje</h2>
<div class="tablewrap narrow"><table class="bom">
<thead><tr><th>Material</th><th>Cantidad</th></tr></thead>
<tbody>
<tr><td>Bastidor de bordado de unos 20 cm (o un aro de cartón rígido)</td><td>1</td></tr>
<tr><td>Alambre esmaltado calibre 24–26, unos 15 m (20 vueltas)</td><td>1</td></tr>
<tr><td>Portapilas de 2 AA, resistencias de potencia de 10 y 22 Ω (o un reóstato)</td><td>1</td></tr>
<tr><td>INA219 con ESP32, o multímetro en modo amperímetro</td><td>1</td></tr>
<tr><td>Celular con phyphox; soporte LEGO que lo sostenga en el centro del aro</td><td>1</td></tr>
</tbody></table></div>
<p>Enrolle las espiras juntas sobre el aro y raspe el esmalte de las puntas con lija. Ponga el aro de pie, sostenido por una base LEGO, y dentro una plataforma LEGO que deje el celular plano exactamente en el centro. Oriente el conjunto con la brújula de phyphox para que el plano del aro quede norte–sur. Aleje todo objeto de hierro (patas de mesa, tornillos) y el portapilas a más de 50 cm.</p>
<div class="box safe">
<p>La corriente no debe pasar de 0.5 A, y sólo durante la medición: el alambre delgado se calienta y las pilas se agotan. Desconecte entre medición y medición.</p>
</div>
</section>

<section>
<h2>Configuración</h2>
<p>En phyphox use «Magnetómetro» y la pestaña «Simple». Antes de empezar, calibre la brújula del celular con el movimiento en ocho y luego no lo mueva más. Para cada corriente registre 3 s con y 3 s sin corriente (la diferencia elimina el campo del propio celular). Para la corriente use el programa del INA219 del capítulo 7 o un multímetro.</p>
</section>

<section>
<h2>Experimento virtual</h2>
<div class="sim" data-sim="e4-tangentes" data-title="La bobina en el meridiano y el celular en su centro" data-layout="below"></div>
<div class="sim-guide"><ul>
<li>Aumente la corriente y agregue cada medida a la tabla: \(\Delta B_x\) crece en línea recta; \(\theta\) crece cada vez más despacio (es una tangente).</li>
<li>Desoriente la bobina 20° respecto al meridiano: \(\Delta B_x\) casi no cambia, pero la relación \(\tan\theta\) contra \(I\) deja de ser lineal.</li>
<li>Lea la inclinación del campo terrestre en las salidas: \(\arctan(B_z/B_H)\approx24°\).</li>
</ul></div>
</section>

<section>
<h2>Procedimiento</h2>
<ol class="steps">
<li><b>Mida el radio del aro</b><p>(al centro del haz de espiras) y cuente las vueltas.</p></li>
<li><b>Campo terrestre.</b><p>Con la bobina desconectada y el celular calibrado y plano, registre \(B_x\), \(B_y\), \(B_z\). Calcule \(B_H=\sqrt{B_x^2+B_y^2}\) y la inclinación.</p></li>
<li><b>Oriente la bobina</b><p>girando todo el montaje hasta que el celular, con su eje \(y\) en el plano del aro, marque \(B_x\approx0\).</p></li>
<li><b>Corrientes.</b><p>Para 6 corrientes entre 0.05 y 0.4 A, registre \(B_x\), \(B_y\) y la corriente. Invierta la polaridad y repita dos valores.</p></li>
</ol>
</section>

<section>
<h2>Análisis de los datos</h2>
<ol>
<li>Grafique \(\Delta B_x\) contra \(I\) y ajuste una recta: la pendiente es \(\mu_0N/(2R)\). Calcule \(\mu_0\) y compárelo con \(4\pi\times10^{-7}\) T·m/A.</li>
<li>Calcule \(\theta=\arctan(B_x/B_y)\) para cada corriente. Grafique \(\tan\theta\) contra \(I\): pendiente \(\mu_0N/(2RB_H)\). Con el \(\mu_0\) conocido, obtenga \(B_H\).</li>
<li>Compare los tres valores de \(B_H\): directo con el celular, del galvanómetro de tangentes, y el del modelo IGRF (26.7 µT).</li>
</ol>
</section>

<section>
<h2>Preguntas, fuentes de error y extensiones</h2>
<ol class="problems">
<li><span class="lvl">Problema</span>Una bobina de 20 espiras y 10.0 cm de radio lleva 0.200 A. ¿Qué campo produce en su centro? ¿Cuánto desvía la brújula en Popayán?
<details><summary>Respuesta</summary><p>\(B_b=4\pi\times10^{-7}(20)(0.200)/(2\times0.100)=25.1\) µT. \(\theta=\arctan(25.1/26.7)=43°\).</p></details></li>
<li><span class="lvl">Concepto</span>¿Por qué el galvanómetro de tangentes es más sensible para corrientes pequeñas que para grandes?
<details><summary>Respuesta</summary><p>Porque \(\theta=\arctan(kI)\): para \(I\) pequeña, θ crece linealmente; para \(I\) grande, θ se acerca a 90° y casi no cambia. La mejor sensibilidad (\(d\theta/dI\) relativa) está cerca de 45°.</p></details></li>
<li><span class="lvl">Error</span>Los cables que llevan la corriente al aro también producen campo. ¿Cómo se minimiza su efecto?
<details><summary>Respuesta</summary><p>Trenzando los dos cables (ida y vuelta) desde el aro hasta la fuente: sus campos se cancelan casi por completo.</p></details></li>
<li><span class="lvl">Extensión</span>Con dos bobinas iguales separadas una distancia igual a su radio (bobinas de Helmholtz), el campo en el centro es casi uniforme. Mida el campo a lo largo del eje.</li>
</ol>
</section>
