<template class="chapter-src" data-id="f3" data-num="F3" data-title="Principio de Arquímedes con la celda de carga" data-part="Parte V · Prácticas de fluidos" data-kits="esp lego" data-short="Un cilindro colgado de la celda de carga se sumerge poco a poco: el empuje crece con el volumen sumergido. Densidad del sólido y del líquido">
<p class="lead">«Todo cuerpo sumergido en un fluido experimenta un empuje vertical hacia arriba igual al peso del fluido que desaloja». Con una celda de carga que pesa centésimas de gramo y un soporte LEGO que baja el objeto de a 3.2 mm, el principio se ve aparecer gradualmente: el peso aparente disminuye en línea recta mientras el cilindro entra al agua, y se queda constante cuando ya está todo adentro.</p>

<div class="ficha"><div class="ficha-head"><b>Ficha de la práctica</b><span>F3 · 2 horas</span></div><dl>
<dt>Objetivo</dt><dd>Medir el empuje en función del volumen sumergido y determinar la densidad de un sólido y de varios líquidos.</dd>
<dt>Herramientas</dt><dd><span class="kit esp">ESP32</span> con celda de carga y HX711 · <span class="kit lego">LEGO</span> (soporte y plataforma elevadora)</dd>
<dt>Se mide</dt><dd>Masa aparente del objeto; profundidad de inmersión</dd>
<dt>Conceptos</dt><dd>Empuje, densidad, peso aparente, tercera ley de Newton</dd>
<dt>Costo extra</dt><dd>Un cilindro metálico (un tornillo grueso, un trozo de varilla de aluminio) y un vaso alto</dd>
</dl></div>

<section>
<h2>Fundamento</h2>
<p>Un cilindro de sección \(A\), altura \(H\) y masa \(m\) cuelga de la celda de carga. Si se sumerge una profundidad \(d\) en un líquido de densidad \(\rho_\ell\), el líquido lo empuja hacia arriba con una fuerza igual al peso del líquido desalojado, y la celda indica una masa aparente</p>
<div class="eq key" data-name="Peso aparente">\[m_{\text{ap}}=m-\rho_\ell\,A\,d\quad(d\lt H),\qquad m_{\text{ap}}=m-\rho_\ell V\quad(d\ge H).\]</div>
<p>La gráfica de \(m_{\text{ap}}\) contra \(d\) es una recta de pendiente \(-\rho_\ell A\) que se vuelve horizontal cuando el cilindro queda sumergido. Con el objeto completamente sumergido, la densidad del sólido sale de una razón de masas, sin medir el volumen:</p>
<div class="eq">\[\frac{\rho_s}{\rho_\ell}=\frac{m}{m-m_{\text{ap}}} .\]</div>
<p>Con el mismo objeto en otro líquido, la pérdida de peso es proporcional a la densidad de ese líquido: \(\rho_{\ell2}=\rho_{\ell1}\,(m-m_{\text{ap},2})/(m-m_{\text{ap},1})\).</p>
</section>

<section>
<h2>Materiales y montaje</h2>
<div class="tablewrap narrow"><table class="bom">
<thead><tr><th>Material</th><th>Cantidad</th></tr></thead>
<tbody>
<tr><td>Celda de carga de 1 kg con HX711 y ESP32 (capítulo 7)</td><td>1</td></tr>
<tr><td>Torre LEGO en voladizo que sostiene la celda horizontal</td><td>1</td></tr>
<tr><td>Cilindro de aluminio de unos 2 cm × 6 cm, hilo de nailon y gancho</td><td>1</td></tr>
<tr><td>Vaso alto sobre una plataforma LEGO de altura ajustable con placas</td><td>1</td></tr>
<tr><td>Agua, agua salada, aceite, alcohol; calibrador</td><td>—</td></tr>
</tbody></table></div>
<div class="sim" data-sim="lego-modelo" data-model="arquimedes" data-title="Celda de carga en voladizo y vaso sobre plataforma"></div>
<p>La celda va atornillada a la torre por un extremo; del otro extremo cuelga el hilo con el cilindro. La flecha indica el sentido de la fuerza grabado en la celda. El vaso se apoya en una plataforma de placas LEGO: agregar una placa debajo sube el vaso 3.2 mm, es decir, sumerge el cilindro 3.2 mm más (si el nivel del agua sube poco, porque el vaso es ancho).</p>
<div class="box warn">
<p>El nivel del agua en el vaso sube al sumergir el cilindro: la profundidad real es mayor que lo que subió la plataforma. Con un vaso de radio \(R_v\) y un cilindro de radio \(r\), la profundidad real es \(d=\Delta z\,R_v^2/(R_v^2-r^2)\). Use un vaso mucho más ancho que el cilindro o mida \(d\) directamente.</p>
</div>
</section>

<section>
<h2>Configuración</h2>
<p>Use el programa de la balanza del capítulo 7 (calibrado con una masa conocida). Tare con el cilindro <em>fuera</em> del agua y anote su masa \(m\); o tare sin nada colgado y lea directamente \(m\) y \(m_{\text{ap}}\). Espere 5 s en cada posición: el agua oscila y la celda tarda en estabilizarse.</p>
</section>

<section>
<h2>Experimento virtual</h2>
<div class="sim" data-sim="f3-arquimedes" data-title="Masa aparente contra profundidad sumergida" data-layout="below"></div>
<div class="sim-guide"><ul>
<li>Suba la plataforma de a una placa y agregue cada lectura: la recta descendente se vuelve horizontal a la altura del cilindro.</li>
<li>Con el cilindro sumergido, la densidad del sólido sale de \(m/(m-m_{\text{ap}})\).</li>
<li>Cambie de líquido sin cambiar el objeto: la pérdida de peso cambia en proporción a la densidad.</li>
</ul></div>
</section>

<section>
<h2>Procedimiento</h2>
<ol class="steps">
<li><b>Calibre la celda</b><p>con una masa patrón y mida \(m\) del cilindro en el aire.</p></li>
<li><b>Mida el cilindro</b><p>(diámetro y altura) con el calibrador.</p></li>
<li><b>Posición inicial.</b><p>Ajuste la plataforma para que la base del cilindro toque justo la superficie del agua.</p></li>
<li><b>Sumerja de a una placa</b><p>(3.2 mm), registrando la masa aparente en cada paso, hasta 1 cm más allá de la inmersión completa.</p></li>
<li><b>Otros líquidos.</b><p>Con el cilindro completamente sumergido, mida la masa aparente en agua salada, aceite y alcohol.</p></li>
</ol>
</section>

<section>
<h2>Análisis de los datos</h2>
<ol>
<li>Grafique \(m_{\text{ap}}\) contra \(d\). Ajuste una recta al tramo inclinado: la pendiente es \(-\rho_\ell A\). Con \(A\) medida con el calibrador, obtenga \(\rho_\ell\).</li>
<li>Con el tramo horizontal, calcule \(\rho_s/\rho_\ell=m/(m-m_{\text{ap}})\) y la densidad del sólido. Identifique el material.</li>
<li>Con los demás líquidos, calcule sus densidades relativas al agua.</li>
</ol>
</section>

<section>
<h2>Preguntas, fuentes de error y extensiones</h2>
<ol class="problems">
<li><span class="lvl">Problema</span>Un cilindro pesa 50.90 g en el aire y 32.07 g sumergido en agua. ¿De qué metal es?
<details><summary>Respuesta</summary><p>\(\rho_s/\rho_w=50.90/18.83=2.70\): aluminio.</p></details></li>
<li><span class="lvl">Concepto</span>Si el vaso estuviera sobre una balanza, ¿qué marcaría al sumergir el cilindro (sin tocar el fondo)?
<details><summary>Respuesta</summary><p>Aumentaría exactamente lo que el cilindro «pierde»: \(\rho_\ell V\). Por la tercera ley de Newton, el agua empuja al cilindro hacia arriba y el cilindro empuja al agua hacia abajo con la misma fuerza.</p></details></li>
<li><span class="lvl">Error</span>Unas burbujas de aire pegadas al cilindro, ¿hacen que la densidad calculada sea mayor o menor?
<details><summary>Respuesta</summary><p>Menor: las burbujas aumentan el volumen desalojado y el empuje, de modo que \(m-m_{\text{ap}}\) crece y \(\rho_s\) calculada disminuye. Por eso se sacuden antes de medir.</p></details></li>
</ol>
</section>
