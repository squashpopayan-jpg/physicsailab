<template class="chapter-src" data-id="dinamica" data-num="16" data-title="Dinámica semiclásica de los electrones" data-part="Parte III · Electrones en sólidos" data-short="Paquetes de ondas de Bloch, velocidad de grupo y teorema de aceleración, tensor de masa efectiva, elipsoides del silicio, oscilaciones de Bloch y escalera de Wannier–Stark, huecos, ecuación de Boltzmann, transporte con dos tipos de portadores y magnetorresistencia">
<p class="lead">Un electrón en un cristal no se mueve como un electrón libre: su velocidad la da la pendiente de la banda, su respuesta a una fuerza la da la curvatura, y si la fuerza es constante puede oscilar en lugar de acelerar. Este capítulo construye el modelo semiclásico, que trata el campo externo clásicamente y el potencial periódico cuánticamente (a través de las bandas), y lo usa para entender la masa efectiva, los huecos y el transporte en presencia de campos magnéticos.</p>

<section>
<h2>Velocidad y teorema de aceleración</h2>
<p>Un paquete de ondas formado con estados de Bloch de una banda \(n\), centrado en \(\vb k\), se mueve con la velocidad de grupo</p>
<div class="eq key" data-name="Velocidad de un electrón de Bloch">\[\vb v_n(\vb k)=\frac1\hbar\nabla_{\vb k}E_n(\vb k).\]</div>
<p>Es perpendicular a las superficies de energía constante y no se anula en un cristal perfecto: el electrón se propaga sin ser dispersado por los iones. Si sobre él actúa una fuerza externa \(\vb F\) (eléctrica o magnética) que varía lentamente en la escala atómica, el trabajo \(\vb F\cdot\vb v\,\dd t\) cambia su energía en \(\nabla_{\vb k}E\cdot\dd\vb k\). De ahí el <span class="term">teorema de aceleración</span>:</p>
<div class="eq key" data-name="Teorema de aceleración">\[\hbar\frac{\dd\vb k}{\dd t}=\vb F=-e\left(\vb E+\vb v\times\vb B\right).\]</div>
<p>La fuerza externa cambia el momento cristalino, no el momento verdadero; la fuerza del potencial periódico ya está incluida en la forma de la banda. El modelo vale si los campos no inducen transiciones entre bandas: \(eEa\ll E_g^2/E_F\) y \(\hbar\omega_c\ll E_g^2/E_F\).</p>
</section>

<section>
<h2>La masa efectiva</h2>
<p>Derivando la velocidad respecto del tiempo, \(\dd v_i/\dd t=\sum_j(\hbar^{-2}\partial^2E/\partial k_i\partial k_j)F_j\). El electrón responde como una partícula de masa dada por el <span class="term">tensor de masa efectiva</span></p>
<div class="eq key" data-name="Masa efectiva">\[\left(\frac1{m^*}\right)_{ij}=\frac1{\hbar^2}\frac{\partial^2E}{\partial k_i\partial k_j}.\]</div>
<p>Cerca de un mínimo de banda la masa es positiva y puede ser mucho menor que la del electrón libre (0.067 \(m\) en el GaAs, 0.014 \(m\) en el InSb): una banda muy curva corresponde a un electrón «ligero». Cerca de un máximo es negativa: el electrón se acelera en sentido opuesto a la fuerza, porque el potencial de la red le quita más momento del que la fuerza le da. En el silicio los seis mínimos de conducción están sobre los ejes ⟨100⟩ a 85 % del camino a X, y las superficies de energía constante son <span class="term">elipsoides</span> alargados con masa longitudinal \(m_l=0.92\,m\) y transversal \(m_t=0.19\,m\). Para la conductividad cuenta la media armónica \(m_c=3/(1/m_l+2/m_t)=0.26\,m\); para la densidad de estados, \(m_{ds}=6^{2/3}(m_lm_t^2)^{1/3}=1.08\,m\).</p>
<div class="sim" data-sim="masa-efectiva" data-title="Velocidad y masa efectiva a lo largo de una banda"></div>
<div class="sim-guide"><ul>
<li>Arriba la banda de enlace fuerte \(E(k)\); en el medio la velocidad \(v=\hbar^{-1}\dd E/\dd k\); abajo la masa efectiva, que diverge en los puntos de inflexión y es negativa en la mitad superior de la banda.</li>
<li>Mueva el punto \(k\): la lectura da los tres valores. Con salto a segundos vecinos la masa en el fondo cambia.</li>
</ul></div>
</section>

<section>
<h2>Oscilaciones de Bloch</h2>
<p>Con un campo eléctrico constante \(\vb k\) crece linealmente: \(k(t)=k_0-eEt/\hbar\). Cuando llega al borde de zona reaparece en el borde opuesto, y la velocidad, que sigue a la pendiente de la banda, se invierte. En una banda de enlace fuerte \(E=-2t\cos ka\) la posición es</p>
<div class="eq key" data-name="Oscilación de Bloch">\[x(t)=x_0+\frac{2t}{eE}\left[\cos(k_0a)-\cos\!\left(k_0a-\frac{eEa}{\hbar}t\right)\right],\qquad T_B=\frac{2\pi\hbar}{eEa}.\]</div>
<p>¡Un campo constante produce un movimiento oscilatorio de amplitud \(W/(eE)\), con \(W\) el ancho de banda! En un metal no se observa porque \(T_B\) (del orden de \(10^{-5}\) s con 1 V/m) es enorme frente al tiempo entre choques, \(10^{-14}\) s. En una <span class="term">superred</span> semiconductora con período \(d=10\) nm y campo \(10^6\) V/m, \(T_B=0.4\) ps: Feldmann, Leo y colaboradores (1992) detectaron la radiación de terahercios emitida por los electrones que oscilan. En la imagen cuántica, la banda se rompe en una <span class="term">escalera de Wannier–Stark</span> de niveles separados \(eEd\), y en átomos fríos en redes ópticas las oscilaciones se ven directamente.</p>
<div class="sim" data-sim="bloch-osc" data-title="Oscilaciones de Bloch de un paquete en una cadena"></div>
<div class="sim-guide"><ul>
<li>Se resuelve la ecuación de Schrödinger dependiente del tiempo (Crank–Nicolson) para un paquete en una cadena de enlace fuerte con un potencial lineal. Arriba la densidad del paquete; abajo \(\langle x\rangle(t)\) y la predicción semiclásica.</li>
<li>El paquete parte del fondo de la banda: avanza, se frena al llegar a \(k=\pi/a\), retrocede y vuelve al punto de partida tras un período \(T_B\).</li>
</ul></div>
</section>

<section>
<h2>Huecos</h2>
<p>Una banda llena no conduce. Si falta un solo electrón, en el estado \(\vb k_e\), la corriente es la de la banda llena menos la del electrón faltante: \(\vb j=-(-e)\vb v(\vb k_e)=+e\vb v(\vb k_e)\). Es la corriente de una partícula de carga positiva con la velocidad del estado vacío. Esa partícula ficticia es el <span class="term">hueco</span>, con</p>
<div class="eq key" data-name="Propiedades del hueco">\[\vb k_h=-\vb k_e,\quad E_h(\vb k_h)=-E_e(\vb k_e),\quad \vb v_h=\vb v_e,\quad m_h^*=-m_e^*,\quad q_h=+e.\]</div>
<p>Como los estados vacíos están cerca del máximo de la banda, donde \(m_e^*<0\), el hueco tiene masa positiva y carga positiva, y obedece \(\hbar\,\dd\vb k_h/\dd t=+e(\vb E+\vb v\times\vb B)\): se comporta en todo como un portador positivo. Esto explica el coeficiente de Hall positivo del berilio, el magnesio, el aluminio o el silicio tipo p, que el modelo de Drude no entendía.</p>
<div class="sim" data-sim="huecos" data-title="Una banda casi llena en un campo eléctrico"></div>
<div class="sim-guide"><ul>
<li>Los puntos son estados de una banda de enlace fuerte; todos ocupados salvo uno. El campo desplaza todos los \(k\) por igual; el estado vacío se mueve con ellos.</li>
<li>La corriente de la banda (lectura) es exactamente la de una carga positiva con la velocidad del estado vacío.</li>
</ul></div>
</section>

<section>
<h2>Transporte: ecuación de Boltzmann y dos tipos de portadores</h2>
<p>Para describir la conducción hace falta una función de distribución \(f(\vb r,\vb k,t)\) que evolucione por el movimiento semiclásico y por los choques. En la aproximación del tiempo de relajación, la <span class="term">ecuación de Boltzmann</span> estacionaria y homogénea es \(-\tfrac e\hbar\vb E\cdot\nabla_{\vb k}f=-(f-f_0)/\tau\). A primer orden en el campo, \(f=f_0+\tfrac{e\tau}\hbar\vb E\cdot\nabla_{\vb k}f_0\), y la conductividad es</p>
<div class="eq">\[\sigma_{ij}=e^2\int\frac{2\,\dd^3k}{(2\pi)^3}\,\tau\,v_iv_j\left(-\frac{\partial f_0}{\partial E}\right),\]</div>
<p>una integral sobre la superficie de Fermi: solo los electrones cerca de \(E_F\) conducen. Para electrones libres se recupera \(ne^2\tau/m\). Si conducen electrones (densidad \(n\), movilidad \(\mu_n\)) y huecos (\(p\), \(\mu_p\)), las conductividades se suman como tensores. El coeficiente de Hall en campo débil y la magnetorresistencia resultan</p>
<div class="eq key" data-name="Hall con dos portadores">\[R_H=\frac{p\mu_p^2-n\mu_n^2}{e(p\mu_p+n\mu_n)^2},\qquad \frac{\Delta\rho}{\rho_0}=\frac{np\,\mu_n\mu_p(\mu_n+\mu_p)^2B^2}{(n\mu_n+p\mu_p)^2}\ \ (B\to0),\]</div>
<p>y en campo fuerte \(R_H\to1/[e(p-n)]\). Con un solo tipo de portador la magnetorresistencia es nula; con dos crece como \(B^2\). En un semimetal compensado (\(n=p\), bismuto) crece sin saturar: la resistencia del bismuto se multiplica por millones en 10 T a baja temperatura.</p>
<div class="sim" data-sim="dos-bandas" data-title="Efecto Hall y magnetorresistencia con electrones y huecos"></div>
<div class="sim-guide"><ul>
<li>Resistividad longitudinal y coeficiente de Hall en función de \(B\) para dos portadores (modelo de Drude de dos bandas, inversión exacta del tensor de conductividad).</li>
<li>Iguale \(n\) y \(p\): \(R_H\) cambia de signo con el campo y la magnetorresistencia no se satura.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule el período de Bloch para una superred de 5 nm en un campo de 50 kV/cm. ¿Qué frecuencia emitirían los electrones?
<details><summary>Respuesta</summary><p>\(T_B=h/(eEd)=4.14\times10^{-15}\ \text{eV·s}/(5\times10^6\ \text{V/m}\times5\times10^{-9}\ \text{m})=0.165\) ps; 6 THz.</p></details></li>
<li><span class="lvl">Básico</span>Calcule las masas de conductividad y de densidad de estados del Si con \(m_l=0.916\) y \(m_t=0.191\).
<details><summary>Respuesta</summary><p>\(m_c=3/(1/0.916+2/0.191)=0.26\); \(m_{ds}=6^{2/3}(0.916\times0.191^2)^{1/3}=1.08\).</p></details></li>
<li><span class="lvl">Intermedio</span>Para \(E=-2t\cos ka\), demuestre que la masa efectiva es \(\hbar^2/(2ta^2\cos ka)\) y que cambia de signo en \(ka=\pi/2\).
<details><summary>Respuesta</summary><p>\(\dd^2E/\dd k^2=2ta^2\cos ka\); positiva para \(|ka|<\pi/2\), negativa más allá.</p></details></li>
<li><span class="lvl">Intermedio</span>En un semiconductor intrínseco con \(\mu_n=3\mu_p\), ¿qué signo tiene \(R_H\)?
<details><summary>Respuesta</summary><p>Con \(n=p\): \(R_H\propto\mu_p^2-\mu_n^2<0\): negativo, dominan los electrones por su mayor movilidad.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que en campo magnético fuerte (\(\mu B\gg1\) para ambos portadores) \(R_H\to1/[e(p-n)]\) si \(p\neq n\).
<details><summary>Respuesta</summary><p>Con \(\sigma_{xx}\approx\sum\sigma_i/(\mu_iB)^2\propto B^{-2}\) y \(\sigma_{xy}\approx e(p-n)/B\), en campo fuerte \(\sigma_{xx}^2\ll\sigma_{xy}^2\) y \(\rho_{xy}=\sigma_{xy}/(\sigma_{xx}^2+\sigma_{xy}^2)\to1/\sigma_{xy}=B/[e(p-n)]\).</p></details></li>
</ol>
