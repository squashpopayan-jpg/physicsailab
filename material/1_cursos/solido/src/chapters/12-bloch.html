<p class="lead">¿Por qué un electrón puede atravesar un cristal de cobre recorriendo cientos de distancias interatómicas sin chocar con los iones que encuentra a cada paso? Felix Bloch encontró la respuesta en 1928, en su tesis doctoral con Heisenberg: en un potencial perfectamente periódico los estados propios son ondas que se extienden por todo el cristal, moduladas por una función con el período de la red. La periodicidad no dispersa a los electrones; solo lo hacen las desviaciones de ella. Las consecuencias, bandas de energía permitidas separadas por brechas, son la base de toda la física electrónica de los sólidos.</p>

<section>
<h2>El teorema de Bloch</h2>
<p>Un electrón en un cristal siente el potencial de los iones y el promedio de los demás electrones, un potencial efectivo \(U(\vb r)\) con la periodicidad de la red: \(U(\vb r+\vb R)=U(\vb r)\). El hamiltoniano \(H=-\tfrac{\hbar^2}{2m}\nabla^2+U(\vb r)\) conmuta entonces con todos los operadores de traslación \(T_{\vb R}\psi(\vb r)=\psi(\vb r+\vb R)\), y estos conmutan entre sí. Por tanto los estados propios de \(H\) pueden elegirse como estados propios de todas las traslaciones. Como \(T_{\vb R}T_{\vb R'}=T_{\vb R+\vb R'}\), los autovalores deben ser de la forma \(\ee^{\ii\vb k\cdot\vb R}\). El resultado es el</p>
<div class="box def"><h4>Teorema de Bloch</h4><p>Los estados propios de un electrón en un potencial periódico tienen la forma \(\psi_{n\vb k}(\vb r)=\ee^{\ii\vb k\cdot\vb r}u_{n\vb k}(\vb r)\), con \(u_{n\vb k}(\vb r+\vb R)=u_{n\vb k}(\vb r)\). Equivalentemente, \(\psi_{n\vb k}(\vb r+\vb R)=\ee^{\ii\vb k\cdot\vb R}\psi_{n\vb k}(\vb r)\).</p></div>
<p>El vector \(\vb k\) toma los valores permitidos por las condiciones de Born–von Kármán (capítulo 3) y está definido salvo un vector de la red recíproca: \(\vb k\) y \(\vb k+\vb G\) describen el mismo conjunto de estados. Para cada \(\vb k\) la ecuación para \(u_{n\vb k}\) en una celda tiene infinitas soluciones discretas, numeradas por el <span class="term">índice de banda</span> \(n\). Las funciones \(E_n(\vb k)\) son periódicas en la red recíproca y continuas en \(\vb k\): son las <span class="term">bandas de energía</span>.</p>
<p>La cantidad \(\hbar\vb k\), el <span class="term">momento cristalino</span>, no es el momento del electrón (\(\psi\) no es autoestado de \(-\ii\hbar\nabla\)), pero juega su papel en las leyes de conservación y en la dinámica (capítulo 16). Las bandas se dibujan de tres maneras: en el <span class="term">esquema de zona extendida</span> cada banda ocupa una zona de Brillouin distinta, como una parábola libre con cortes; en el <span class="term">esquema de zona reducida</span> todas se trasladan a la primera zona; en el <span class="term">esquema repetido</span> se dibujan periódicas en todo el espacio \(\vb k\).</p>
<div class="sim" data-sim="bloch-funcion" data-title="Una función de Bloch: onda plana por función periódica"></div>
<div class="sim-guide"><ul>
<li>Potencial \(U(x)=2U_1\cos(2\pi x/a)\) y estado de Bloch calculado con la ecuación central (capítulo 13). Se muestran la parte real de \(\psi\), \(|\psi|^2\) (periódica) y la parte periódica \(u_k\).</li>
<li>Lleve \(k\) al borde de zona: la función se vuelve una onda estacionaria, con la carga concentrada sobre los mínimos del potencial (banda inferior) o sobre los máximos (banda superior).</li>
</ul></div>
</section>

<section>
<h2>El modelo de Kronig–Penney</h2>
<p>Ralph Kronig y William Penney (1931) resolvieron exactamente un potencial periódico unidimensional: pozos de ancho \(a\) con \(U=0\) separados por barreras de ancho \(b\) y altura \(U_0\). En el pozo la solución es una combinación de \(\ee^{\pm\ii\alpha x}\) con \(\hbar^2\alpha^2/2m=E\); en la barrera, de \(\ee^{\pm\beta x}\) con \(\hbar^2\beta^2/2m=U_0-E\). Imponiendo continuidad de \(\psi\) y \(\psi'\) en las dos interfaces y la condición de Bloch \(\psi(x+a+b)=\ee^{\ii k(a+b)}\psi(x)\), el determinante del sistema se anula solo si</p>
<div class="eq key" data-name="Kronig–Penney">\[\cos k(a+b)=\cos\alpha a\cosh\beta b+\frac{\beta^2-\alpha^2}{2\alpha\beta}\sen\alpha a\senh\beta b\equiv F(E).\]</div>
<p>Para \(E>U_0\) se reemplaza \(\beta\) por \(\ii\gamma\). El lado izquierdo está entre \(-1\) y 1: las energías con \(|F(E)|\le1\) forman las <span class="term">bandas permitidas</span>, y aquellas con \(|F|>1\) las <span class="term">brechas</span>, donde \(k\) sería complejo y las soluciones crecerían exponencialmente. En el límite de barreras delgadas y altas, con \(U_0b\) fijo (un <span class="term">peine de Dirac</span>), la ecuación se simplifica a \(\cos ka=\cos\alpha a+P\,\sen(\alpha a)/(\alpha a)\) con \(P=mU_0ba/\hbar^2\).</p>
<div class="sim" data-sim="kronig-penney" data-title="Modelo de Kronig–Penney: la función F(E) y las bandas"></div>
<div class="sim-guide"><ul>
<li>Izquierda: \(F(E)\) con la franja \(|F|\le1\); donde la curva está dentro hay estados. Derecha: \(E(k)\) en zona reducida, resolviendo la ecuación para cada \(k\); la línea gris es la parábola libre plegada.</li>
<li>Los bordes de banda se validan contra SciPy (<code>brentq</code>), contra un cálculo independiente con 301 ondas planas y contra un hamiltoniano de diferencias finitas.</li>
</ul></div>
</section>

<section>
<h2>Entre electrones libres y átomos aislados</h2>
<p>El modelo de Kronig–Penney muestra cómo una sola ecuación interpola entre dos límites. Con barreras bajas (\(U_0\ll\hbar^2\pi^2/2ma^2\)) las bandas son casi las parábolas del electrón libre, con brechas pequeñas en los bordes de zona \(k=\pm n\pi/(a+b)\), proporcionales a la componente de Fourier del potencial: es el modelo de <span class="term">electrones casi libres</span> del capítulo 13. Con barreras altas y anchas, los electrones quedan casi confinados en cada pozo, las bandas se estrechan alrededor de los niveles del pozo aislado y su forma tiende a \(E(k)=\bar E-\tfrac W2\cos k(a+b)\): es el modelo de <span class="term">enlace fuerte</span> del capítulo 14, con un ancho \(W\) que decrece exponencialmente con \(\beta b\).</p>
<div class="sim" data-sim="kp-abanico" data-title="Bandas permitidas en función de la altura de las barreras"></div>
<div class="sim-guide"><ul>
<li>Para cada \(U_0\) se pintan las bandas permitidas. A la izquierda, sin barreras, todo está permitido; al subir las barreras las brechas se abren y las bandas se estrechan hacia los niveles del pozo infinito (líneas punteadas).</li>
</ul></div>
</section>

<section>
<h2>De N pozos a una banda</h2>
<p>¿Cómo aparece una banda continua a partir de niveles discretos? Considérese una cadena finita de \(N\) pozos idénticos encerrados entre paredes. Con un pozo hay un nivel por estado ligado; con dos, cada nivel se desdobla en un par (simétrico y antisimétrico); con \(N\), en \(N\) niveles que se reparten dentro del intervalo de la banda de Kronig–Penney. Para \(N\to\infty\) el número de estados por banda es exactamente \(N\) por cada orientación del espín, uno por celda: una banda admite \(2N\) electrones. Este conteo decide, como se verá en el capítulo 15, si un sólido es metal o aislante.</p>
<div class="sim" data-sim="n-pozos" data-title="Niveles de N pozos acoplados y bandas de Kronig–Penney"></div>
<div class="sim-guide"><ul>
<li>Los niveles de la cadena finita se calculan por diferencias finitas (contando autovalores con secuencias de Sturm); las franjas son las bandas del cristal infinito. Cada banda contiene exactamente \(N\) niveles.</li>
<li>Elija un nivel para ver su función de onda: los de la banda inferior son envolventes sinusoidales sobre los estados de cada pozo.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Demuestre que si \(\psi_{\vb k}\) es una función de Bloch, también lo es con el vector \(\vb k+\vb G\), y encuentre la nueva función periódica \(u\).
<details><summary>Respuesta</summary><p>\(\psi=\ee^{\ii(\vb k+\vb G)\cdot\vb r}[\ee^{-\ii\vb G\cdot\vb r}u_{\vb k}]\) y \(\ee^{-\ii\vb G\cdot\vb r}u_{\vb k}\) tiene la periodicidad de la red porque \(\ee^{-\ii\vb G\cdot\vb R}=1\).</p></details></li>
<li><span class="lvl">Básico</span>En una cadena de 1000 celdas con condiciones periódicas, ¿cuántos valores de \(k\) hay en la primera zona y cuántos electrones caben en una banda?
<details><summary>Respuesta</summary><p>1000 valores de \(k\) y 2000 electrones.</p></details></li>
<li><span class="lvl">Intermedio</span>Deduzca el límite del peine de Dirac: \(U_0\to\infty\), \(b\to0\) con \(U_0b\) fijo.
<details><summary>Respuesta</summary><p>\(\beta b\to0\) pero \(\beta^2b\to2mU_0b/\hbar^2\): \(\cosh\beta b\to1\), \(\senh\beta b\to\beta b\), y \((\beta^2/2\alpha\beta)\beta b\to mU_0b/(\hbar^2\alpha)\), que da \(P\sen\alpha a/(\alpha a)\) con \(P=mU_0ba/\hbar^2\).</p></details></li>
<li><span class="lvl">Intermedio</span>Para el peine de Dirac con \(P=3\pi/2\), demuestre que la primera banda empieza en \(\alpha a\approx2.25\) y termina en \(\pi\).
<details><summary>Respuesta</summary><p>El borde superior está donde \(\sen\alpha a=0\) y \(\cos\alpha a=-1\): \(\alpha a=\pi\). El inferior es la raíz de \(\cos x+(3\pi/2)\sen x/x=1\), \(x\approx2.25\) (resolver numéricamente).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que en el modelo de Kronig–Penney \(\dd E/\dd k=0\) en \(k=0\) y en \(k=\pi/(a+b)\), salvo cuando dos bandas se tocan.
<details><summary>Respuesta</summary><p>\(\sen k(a+b)\,(a+b)\dd k=-F'(E)\dd E\): si \(F'\neq0\), \(\dd E/\dd k\propto\sen k(a+b)=0\) en esos puntos. Si las bandas se tocan, \(F=\pm1\) y \(F'=0\) simultáneamente.</p></details></li>
</ol>
