<p class="lead">En 1911 Heike Kamerlingh Onnes, que acababa de licuar el helio, enfrió mercurio hasta 4.2 K y vio que su resistencia caía bruscamente a cero. Una corriente inducida en un anillo superconductor circula durante años sin decaer. Pero la superconductividad es más que conducir sin pérdidas: un superconductor expulsa el campo magnético, su energía tiene una brecha, el flujo que atraviesa un anillo está cuantizado en unidades de \(h/2e\), y dos superconductores separados por una barrera delgada intercambian una supercorriente controlada por la diferencia de fase cuántica. Todo esto revela un estado cuántico macroscópico de electrones apareados.</p>

<section>
<h2>Fenomenología: resistencia nula y efecto Meissner</h2>
<p>Por debajo de una temperatura crítica \(T_c\) la resistividad de muchos metales y compuestos cae a cero (menos de \(10^{-25}\) Ω·m en los experimentos con anillos). En 1933 Walther Meissner y Robert Ochsenfeld descubrieron que un superconductor enfriado en un campo magnético débil lo expulsa: dentro, \(\vb B=0\). Esto no se deduce de la resistencia nula (un conductor perfecto conservaría el flujo que tenía); es una propiedad de equilibrio que define un nuevo estado termodinámico. Un campo suficientemente intenso destruye la superconductividad: el campo crítico termodinámico sigue aproximadamente \(B_c(T)=B_c(0)[1-(T/T_c)^2]\).</p>

<p>La diferencia de energía libre entre el estado normal y el superconductor es la energía magnética del campo crítico, \(F_n-F_s=B_c^2/2\mu_0\). Derivando dos veces se obtiene un salto del calor específico en \(T_c\): la transición es de segundo orden. A baja temperatura el calor específico electrónico cae exponencialmente, \(\propto\ee^{-\Delta/k_BT}\): la huella de una brecha en el espectro de excitaciones.</p>
</section>

<section>
<h2>Las ecuaciones de London</h2>
<p>Fritz y Heinz London (1935) propusieron que la densidad de supercorriente responde al potencial vector, \(\vb j_s=-(n_se^2/m)\vb A\). Combinada con la ley de Ampère, \(\nabla^2\vb B=\vb B/\lambda_L^2\): el campo decae exponencialmente dentro del superconductor en la <span class="term">longitud de penetración de London</span></p>
<div class="eq key" data-name="Longitud de London">\[\lambda_L=\sqrt{\frac{m}{\mu_0n_se^2}} .\]</div>
<p>Con \(n_s\) del orden de la densidad de electrones de un metal, \(\lambda_L\) es de unas decenas de nanómetros (16 nm en el Al, 37 nm en el Pb, según Kittel). Al acercarse a \(T_c\) la densidad de superelectrones se anula y \(\lambda\) diverge, aproximadamente como \(\lambda(0)/\sqrt{1-(T/T_c)^4}\) (modelo de dos fluidos). En una lámina de espesor comparable a \(\lambda\) el campo no se expulsa del todo.</p>

</section>

<section>
<h2>La teoría BCS</h2>
<p>La clave microscópica la dio el <span class="term">efecto isotópico</span> (1950): \(T_c\propto M^{-1/2}\), la red interviene. John Bardeen, Leon Cooper y Robert Schrieffer (1957) construyeron la teoría. Un electrón que pasa deforma la red de iones y deja tras de sí una región de carga positiva que atrae a otro electrón: una atracción retardada, mediada por fonones, efectiva entre electrones en una capa de energía \(\hbar\omega_D\) alrededor de \(E_F\). Cooper mostró que cualquier atracción, por débil que sea, liga dos electrones de momentos y espines opuestos sobre el mar de Fermi: un <span class="term">par de Cooper</span>. El estado BCS es un condensado coherente de pares, separado de las excitaciones por una <span class="term">brecha</span> \(\Delta\) que cumple</p>
<div class="eq key" data-name="Ecuación de la brecha BCS">\[\frac1{N(0)V}=\int_0^{\hbar\omega_D}\frac{\tanh\left(\sqrt{\xi^2+\Delta^2}/2k_BT\right)}{\sqrt{\xi^2+\Delta^2}}\,\dd\xi .\]</div>
<p>En el límite de acoplamiento débil resultan predicciones universales, independientes del material: \(\Delta(0)=1.764\,k_BT_c\) (es decir \(2\Delta/k_BT_c=3.53\)), un salto del calor específico \(\Delta C/\gamma T_c=12/7\zeta(3)=1.43\), y la forma de \(\Delta(T)\), que cerca de \(T_c\) se anula como \(3.06\,k_BT_c\sqrt{1-T/T_c}\). Los valores medidos de \(2\Delta/k_BT_c\) son 3.4 para Al, 3.5 para Sn, 3.8 para Nb y 4.3 para Pb (acoplamiento fuerte). La brecha se mide por absorción de microondas e infrarrojo, por calor específico y por efecto túnel (Giaever, 1960).</p>
<div class="sim" data-sim="bcs" data-title="La brecha BCS en función de la temperatura"></div>
<div class="sim-guide"><ul>
<li>\(\Delta(T)/\Delta(0)\) resolviendo la ecuación de la brecha (forma independiente del corte, validada contra SciPy), su aproximación cerca de \(T_c\), y la densidad de estados de las excitaciones \(N_s(E)=N(0)E/\sqrt{E^2-\Delta^2}\) a la temperatura elegida.</li>
<li>Los puntos marcan \(2\Delta/k_BT_c\) medido de varios elementos frente a 3.53.</li>
</ul></div>
</section>

<section>
<h2>Ginzburg–Landau: tipo I y tipo II</h2>
<p>Vitaly Ginzburg y Lev Landau (1950) describieron el superconductor con un parámetro de orden complejo \(\psi(\vb r)\), la función de onda del condensado, y una energía libre de Landau con acoplamiento al campo. Aparecen dos longitudes: \(\lambda\), donde varía el campo, y la <span class="term">longitud de coherencia</span> \(\xi\), donde varía \(|\psi|\). Su cociente, \(\kappa=\lambda/\xi\), decide la respuesta a campos intensos. Si \(\kappa<1/\sqrt2\) la energía de una interfaz entre zonas normal y superconductora es positiva y el material pasa de golpe al estado normal en \(B_c\): <span class="term">tipo I</span> (Al, Sn, Pb). Si \(\kappa>1/\sqrt2\) la interfaz tiene energía negativa: entre \(B_{c1}\) y \(B_{c2}\) el campo penetra en tubos de flujo, los <span class="term">vórtices de Abrikosov</span> (1957), cada uno con un cuanto de flujo</p>
<div class="eq key" data-name="Cuanto de flujo">\[\Phi_0=\frac h{2e}=2.0678\times10^{-15}\ \text{Wb},\qquad B_{c2}=\frac{\Phi_0}{2\pi\xi^2},\qquad B_{c1}\simeq\frac{\Phi_0}{4\pi\lambda^2}\ln\kappa .\]</div>
<p>El factor 2 en \(h/2e\) (medido por Deaver y Fairbank y por Doll y Näbauer en 1961) prueba que los portadores son pares. Los superconductores de tipo II con \(\xi\) pequeño tienen \(B_{c2}\) enormes: 15 T para el Nb–Ti, 30 T para el Nb₃Sn, más de 100 T para los cupratos. Si los vórtices se anclan en defectos, el material lleva grandes corrientes en campos intensos: así funcionan los imanes de resonancia magnética de los hospitales y los 1232 dipolos del LHC, de Nb–Ti a 1.9 K y 8.3 T.</p>
<div class="sim" data-sim="tipo2" data-title="Superconductores de tipo I y II: magnetización y vórtices"></div>
<div class="sim-guide"><ul>
<li>Izquierda: magnetización \(-M\) frente al campo aplicado para el \(\kappa\) elegido (tipo I: diamagnetismo perfecto hasta \(B_c\); tipo II: Meissner hasta \(B_{c1}\), estado mixto hasta \(B_{c2}\)). Derecha: la red triangular de vórtices, con un cuanto de flujo por celda, y el perfil de campo de un vórtice \(\propto K_0(r/\lambda)\).</li>
</ul></div>
</section>

<section>
<h2>El efecto Josephson</h2>
<p>Brian Josephson predijo en 1962 que entre dos superconductores separados por una barrera aislante de 1–2 nm circula una supercorriente sin tensión, que depende de la diferencia de fase \(\varphi\) de los condensados:</p>
<div class="eq key" data-name="Relaciones de Josephson">\[I=I_c\sen\varphi,\qquad \frac{\dd\varphi}{\dd t}=\frac{2eV}{\hbar}.\]</div>
<p>Con una tensión constante la corriente oscila a \(f=2eV/h=483.6\) GHz por milivoltio. Si se irradia la unión con microondas de frecuencia \(f\), la característica corriente–tensión muestra escalones en \(V_n=nhf/2e\) (escalones de Shapiro): desde 1990 el voltio se realiza con cadenas de miles de uniones, y la constante \(K_J=2e/h\) es exacta en el SI. Un anillo con dos uniones, el <span class="term">SQUID</span>, tiene una corriente crítica modulada por el flujo con período \(\Phi_0\): mide campos de \(10^{-15}\) T, los que produce la actividad del cerebro (magnetoencefalografía). Las uniones de Josephson son también la base de los cúbits superconductores de los computadores cuánticos.</p>
<div class="sim" data-sim="josephson" data-title="Unión de Josephson: modelo RSJ y escalones de Shapiro"></div>
<div class="sim-guide"><ul>
<li>Característica \(V(I)\) de una unión sobreamortiguada (modelo RSJ, integrado con Runge–Kutta), con y sin radiación de microondas. Con microondas aparecen mesetas exactas en \(V=n\hbar\omega/2e\).</li>
</ul></div>
</section>

<section>
<h2>Superconductores no convencionales</h2>
<p>En 1986 Georg Bednorz y K. Alex Müller encontraron superconductividad a 35 K en un óxido de lantano, bario y cobre; un año después el YBa₂Cu₃O₇ superó la temperatura del nitrógeno líquido (92 K). Los cupratos tienen planos CuO₂ y su brecha tiene simetría \(d\) (se anula en ciertas direcciones), lo que indica un mecanismo no fonónico, aún debatido, relacionado con las fluctuaciones antiferromagnéticas. Después aparecieron los pnicturos de hierro (2008, hasta 55 K) y los hidruros bajo presiones de megabares (H₃S a 203 K en 2015, LaH₁₀ a unos 250 K en 2019), que son superconductores convencionales de acoplamiento muy fuerte con los fonones de alta frecuencia del hidrógeno.</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule la brecha BCS del aluminio (\(T_c=1.175\) K) y la frecuencia de los fotones que pueden romper un par.
<details><summary>Respuesta</summary><p>\(\Delta=1.764k_BT_c=0.179\) meV; \(h\nu=2\Delta=0.357\) meV, \(\nu=86\) GHz.</p></details></li>
<li><span class="lvl">Básico</span>¿Qué frecuencia emite una unión de Josephson con 10 µV?
<details><summary>Respuesta</summary><p>\(f=2eV/h=4.84\) GHz.</p></details></li>
<li><span class="lvl">Intermedio</span>Calcule \(\lambda_L\) para \(n_s=10^{28}\) m⁻³ y estime el espesor de una lámina para que el campo en su centro sea el 10 % del exterior.
<details><summary>Respuesta</summary><p>\(\lambda_L=53\) nm. \(1/\cosh(d/2\lambda)=0.1\Rightarrow d/2\lambda=2.99\), \(d=0.32\) µm.</p></details></li>
<li><span class="lvl">Intermedio</span>Un superconductor tiene \(\xi=2\) nm. ¿Cuál es \(B_{c2}\)? ¿Cuánto vale la distancia entre vórtices en 10 T?
<details><summary>Respuesta</summary><p>\(B_{c2}=\Phi_0/(2\pi\xi^2)=82\) T. Red triangular: \(a=\sqrt{2\Phi_0/(\sqrt3B)}=15\) nm.</p></details></li>
<li><span class="lvl">Avanzado</span>A partir de \(F_n-F_s=B_c^2/2\mu_0\) y \(B_c=B_c(0)[1-t^2]\), calcule el salto del calor específico por unidad de volumen en \(T_c\) y compárelo con la predicción BCS.
<details><summary>Respuesta</summary><p>\(\Delta C=T\,\partial^2(F_n-F_s)/\partial T^2\) en \(T_c\): \(\Delta C=4B_c(0)^2/(\mu_0T_c)\). Con la parábola y \(\gamma\) electrónico se obtiene \(\Delta C/\gamma T_c=2\) en lugar de 1.43: la ley parabólica es solo aproximada.</p></details></li>
</ol>
