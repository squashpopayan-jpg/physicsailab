<template class="chapter-src" data-id="solido" data-num="1" data-title="El estado sólido" data-part="Parte I · Cristales" data-short="Qué distingue a un sólido: orden de largo alcance, escalas de distancia y energía, fuerzas entre átomos, la separación entre núcleos y electrones, de los niveles atómicos a las bandas y la clasificación de los sólidos por su conductividad">
<p class="lead">Un centímetro cúbico de cobre contiene unos \(8.5\times10^{22}\) átomos, y sin embargo su resistencia, su color, su calor específico o su dureza se calculan con unas pocas ideas. La razón es el orden: en un cristal los átomos se repiten con un período de unos pocos ángstroms en las tres direcciones, y esa periodicidad convierte un problema de \(10^{23}\) cuerpos en uno de una sola celda. Este capítulo presenta las escalas del estado sólido, las fuerzas que mantienen unidos a los átomos y la idea central del curso: al acercar los átomos, sus niveles de energía se ensanchan en bandas.</p>

<section>
<h2>Orden, escalas y una breve historia</h2>
<p>La materia condensada se distingue de un gas por la densidad: en el aire a 300 K hay \(2.4\times10^{19}\) moléculas por centímetro cúbico, separadas unos 3.4 nm; en un sólido hay entre \(10^{22}\) y \(2\times10^{23}\) átomos por centímetro cúbico, a distancias de 2 a 4 Å, es decir, tocándose. Lo que distingue a un <span class="term">cristal</span> de un líquido o de un vidrio es el <span class="term">orden de largo alcance</span>: conocida la posición de un átomo, se predice la de otro a un millón de distancias interatómicas. Un vidrio tiene orden de corto alcance (cada átomo de silicio de la sílice sigue rodeado de cuatro oxígenos) pero pierde la correlación al cabo de pocos vecinos.</p>
<p>Las escalas típicas guían todo el curso. Las distancias interatómicas son del orden del radio de Bohr multiplicado por unos pocos: \(a_0=0.529\) Å. Las energías de enlace y las de los electrones de valencia son de electronvoltios, del orden del rydberg (13.6 eV). Las energías de las vibraciones de la red son mucho menores, de 1 a 100 meV, y corresponden a temperaturas de 10 a 1000 K; por eso las vibraciones dominan las propiedades térmicas. La razón entre ambas escalas es aproximadamente \(\sqrt{m/M}\), con \(m\) la masa del electrón y \(M\) la de un núcleo, como se verá abajo.</p>

<tr><th>Cantidad</th><th class="c">Valor típico</th><th>Ejemplo</th></tr>
<tr><td>Densidad de átomos</td><td class="c">\(10^{22}\)–\(10^{23}\) cm⁻³</td><td>Cu: \(8.47\times10^{22}\); Si: \(5.00\times10^{22}\); Na: \(2.65\times10^{22}\)</td></tr>

<p>La física del estado sólido nació con la cristalografía. René Just Haüy propuso en 1784 que los cristales son apilamientos de bloques idénticos; Auguste Bravais clasificó en 1848 las catorce redes posibles en tres dimensiones. En 1912 Max von Laue, Walter Friedrich y Paul Knipping difractaron rayos X en un cristal de sulfato de cobre, y William Lawrence Bragg y su padre William Henry Bragg resolvieron al año siguiente las primeras estructuras. Paul Drude explicó en 1900 la conducción con un gas clásico de electrones; Arnold Sommerfeld corrigió el modelo con la estadística de Fermi en 1928, el mismo año en que Felix Bloch resolvió la ecuación de Schrödinger en un potencial periódico. Alan Wilson explicó en 1931 la diferencia entre metales, semiconductores y aislantes, y de allí salieron el transistor (1947), el circuito integrado, el láser semiconductor y la celda solar.</p>
<div class="box note"><h4>Sólidos que no son cristales</h4><p>No todos los sólidos son periódicos. Los <b>vidrios</b> y los polímeros amorfos solo tienen orden local; los <b>cuasicristales</b>, descubiertos por Dan Shechtman en 1982 en una aleación de aluminio y manganeso, tienen orden de largo alcance sin periodicidad y simetrías prohibidas a los cristales, como la de orden cinco. El curso trata sobre todo de cristales, pero el capítulo 30 vuelve sobre el desorden y los cuasicristales.</p></div>
</section>

<section>
<h2>Las fuerzas entre átomos</h2>
<p>Dos átomos se atraen a distancias grandes y se repelen a distancias cortas. La atracción tiene orígenes distintos según el tipo de enlace (capítulo 5): fuerzas de van der Waals entre átomos neutros, atracción electrostática entre iones, compartición de electrones en el enlace covalente o un mar de electrones en los metales. La repulsión es siempre la misma en el fondo: el principio de exclusión de Pauli impide que las nubes electrónicas llenas se superpongan. Un modelo sencillo que reúne ambas es el potencial de <span class="term">Lennard-Jones</span>,</p>
<div class="eq key" data-name="Lennard-Jones">\[U(r)=4\varepsilon\left[\left(\frac{\sigma}{r}\right)^{12}-\left(\frac{\sigma}{r}\right)^{6}\right],\]</div>
<p>con un mínimo de profundidad \(\varepsilon\) en \(r_0=2^{1/6}\sigma=1.122\,\sigma\). Otro muy usado es el de <span class="term">Morse</span>, \(U(r)=D\left[1-\ee^{-a(r-r_0)}\right]^2-D\), que describe bien los enlaces covalentes y tiene solución cuántica exacta.</p>
<p>Cerca del mínimo todo potencial suave es una parábola: \(U(r)\approx U(r_0)+\tfrac12k(r-r_0)^2\) con la constante de fuerza \(k=U''(r_0)\). Para Lennard-Jones \(k=36\cdot2^{2/3}\varepsilon/\sigma^2=57.1\,\varepsilon/\sigma^2\). Esta aproximación armónica es la base de toda la teoría de las vibraciones de la red (capítulos 6 a 8). Los términos cúbicos que la corrigen producen la dilatación térmica y limitan la conducción del calor (capítulo 9).</p>
<div class="box ex"><h4>La molécula de argón</h4><p>Para el argón \(\varepsilon=0.0104\) eV y \(\sigma=3.40\) Å. La distancia de equilibrio de la molécula Ar₂ es \(1.122\sigma=3.82\) Å y la constante de fuerza \(k=57.1\varepsilon/\sigma^2=0.82\) N/m, cien veces más blanda que la de un enlace covalente. Con la masa reducida \(\mu=m_{Ar}/2=20\) u, la frecuencia de vibración es \(\omega=\sqrt{k/\mu}=5.0\times10^{12}\) rad/s, una energía \(\hbar\omega=3.3\) meV (26 cm⁻¹), cerca del primer intervalo vibracional medido para la molécula, 25.7 cm⁻¹. Frente a \(k_BT=26\) meV a temperatura ambiente, el enlace de van der Waals apenas sujeta los átomos: el argón solo es sólido por debajo de 84 K.</p></div>
<div class="sim" data-sim="potencial-par" data-title="Potencial entre dos átomos, fuerza y aproximación armónica"></div>
<div class="sim-guide"><ul>
<li>La curva continua es la energía potencial y la discontinua la fuerza \(F=-\dd U/\dd r\); la parábola es la aproximación armónica con la constante \(k=U''(r_0)\).</li>

</ul></div>
</section>

<section>
<h2>Núcleos lentos, electrones rápidos</h2>
<p>El hamiltoniano de un sólido contiene la energía cinética de los núcleos y de los electrones y todas las interacciones de Coulomb entre ellos. Resolverlo exactamente es imposible, pero hay una jerarquía que lo simplifica. Los núcleos son al menos 1836 veces más pesados que los electrones; si sobre ambos actúan fuerzas comparables, los electrones se ajustan casi instantáneamente a cada configuración de los núcleos. Esta es la <span class="term">aproximación de Born–Oppenheimer</span> (o adiabática): primero se resuelve el problema electrónico con los núcleos fijos en posiciones \(\{\vb R\}\), y la energía electrónica \(E_0(\{\vb R\})\) actúa después como energía potencial para el movimiento de los núcleos.</p>
<div class="box def"><h4>Las dos escalas de energía</h4><p>Si un electrón confinado en una distancia \(a\) tiene energía \(E_e\sim\hbar^2/(ma^2)\), la energía potencial de la red cambia en \(E_e\) cuando un núcleo se desplaza una distancia \(a\), de modo que su constante de fuerza es \(k\sim E_e/a^2\) y su energía de vibración \(\hbar\omega=\hbar\sqrt{k/M}\sim E_e\sqrt{m/M}\). Con \(E_e\sim 5\) eV y \(\sqrt{m/M}\sim 1/200\), \(\hbar\omega\sim 25\) meV: las vibraciones viven en la escala de los milielectronvoltios porque los núcleos pesan mucho.</p></div>
<p>La separación organiza el curso. La Parte II estudia el movimiento de los núcleos en el potencial \(E_0(\{\vb R\})\), aproximado como armónico: los modos normales son los <span class="term">fonones</span>. Las Partes III a VI estudian los electrones en el potencial periódico de los núcleos fijos. Los acoplamientos que la aproximación desprecia, la interacción electrón–fonón, reaparecen en la resistencia eléctrica de los metales (capítulo 10) y en la superconductividad (capítulo 29).</p>
</section>

<section>
<h2>De los niveles atómicos a las bandas</h2>
<p>Un átomo aislado tiene niveles de energía discretos. Si se acercan dos átomos iguales, los orbitales se superponen y cada nivel se desdobla en un par, enlazante y antienlazante, separados \(2t\), donde \(t\) es la integral de salto entre los orbitales vecinos. Con \(N\) átomos en cadena cada nivel atómico se abre en \(N\) niveles repartidos en un intervalo de ancho \(4t\). Para \(N\sim10^{23}\) los niveles quedan tan juntos que forman un continuo: una <span class="term">banda de energía</span>. Entre bandas de orbitales distintos pueden quedar intervalos sin estados, las <span class="term">brechas</span> o bandas prohibidas.</p>
<p>La integral de salto crece rápidamente al acortar la distancia, porque las colas de los orbitales caen exponencialmente. Por eso los niveles internos, muy localizados, siguen casi atómicos en el sólido, mientras que los de valencia forman bandas anchas de varios electronvoltios. Cada banda que proviene de un orbital tiene \(2N\) estados (contando el espín): si los electrones disponibles llenan exactamente un número entero de bandas y la siguiente está separada por una brecha, el sólido es aislante; si una banda queda parcialmente llena, es un metal. Este argumento de llenado, que el capítulo 15 hará preciso, explica por qué el sodio (un electrón 3s por átomo, banda llena a medias) conduce y el diamante no.</p>

<div class="sim-guide"><ul>

</section>

<section>
<h2>Metales, semiconductores y aislantes</h2>
<p>Ninguna propiedad varía tanto entre sólidos como la conductividad eléctrica: la resistividad va de \(1.6\times10^{-8}\) Ω·m en la plata a más de \(10^{16}\) Ω·m en el teflón o el cuarzo, veinticuatro órdenes de magnitud. La temperatura distingue a las dos grandes familias. En un <b>metal</b> la resistividad crece con la temperatura, casi linealmente por encima de unos 100 K, porque los electrones chocan con más fonones (capítulo 10). En un <b>semiconductor</b> puro disminuye al calentar, porque el número de electrones excitados a través de la brecha crece como \(\ee^{-E_g/2k_BT}\) (capítulo 18). Un <b>aislante</b> es un semiconductor de brecha tan grande que a temperatura ambiente casi no hay portadores.</p>
<div class="box ex"><h4>Silicio puro frente a cobre</h4><p>El silicio puro a 300 K tiene \(n_i=1.07\times10^{10}\) electrones de conducción por centímetro cúbico (y otros tantos huecos), con movilidades de 1417 y 471 cm²/V·s. Su resistividad es \(\rho=1/[e\,n_i(\mu_n+\mu_p)]=3.1\times10^{5}\) Ω·cm. El cobre tiene \(8.5\times10^{22}\) electrones de conducción por cm³ y una resistividad de \(1.7\times10^{-6}\) Ω·cm: casi doscientos mil millones de veces menor. Bastan \(10^{15}\) átomos de fósforo por cm³, una impureza por cada cincuenta millones de átomos de silicio, para bajar la resistividad del silicio a 4.4 Ω·cm: esa sensibilidad al dopaje es la base de la electrónica (capítulo 19).</p></div>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>El aluminio tiene una densidad de 2.70 g/cm³ y masa atómica 26.98 u. ¿Cuántos átomos hay por cm³ y cuál es el volumen por átomo?
<details><summary>Respuesta</summary><p>\(n=\rho N_A/M=6.03\times10^{22}\) cm⁻³; volumen por átomo \(1/n=16.6\) Å³, un cubo de 2.55 Å de lado.</p></details></li>
<li><span class="lvl">Básico</span>Demuestre que el mínimo del potencial de Lennard-Jones está en \(r_0=2^{1/6}\sigma\) con \(U(r_0)=-\varepsilon\), y que la fuerza se anula allí.
<details><summary>Respuesta</summary><p>\(U'(r)=4\varepsilon(-12\sigma^{12}/r^{13}+6\sigma^6/r^7)=0\) da \(r^6=2\sigma^6\); sustituyendo, \(U=4\varepsilon(1/4-1/2)=-\varepsilon\).</p></details></li>
<li><span class="lvl">Intermedio</span>Calcule \(k=U''(r_0)\) para el potencial de Morse y compare con Lennard-Jones de igual profundidad y posición del mínimo. ¿Qué valor de \(a\) da la misma curvatura?
<details><summary>Respuesta</summary><p>Morse: \(k=2Da^2\). Igualando a \(57.1\varepsilon/\sigma^2\) con \(D=\varepsilon\) y \(r_0=1.122\sigma\): \(a=5.34/\sigma=6.0/r_0\).</p></details></li>
<li><span class="lvl">Intermedio</span>Con el argumento de Born–Oppenheimer estime la razón entre la energía de un fonón del litio y la de su electrón de valencia (masa atómica 6.94 u).
<details><summary>Respuesta</summary><p>\(\sqrt{m/M}=\sqrt{1/(6.94\times1823)}=0.0089\). Con unos 5 eV para el electrón, \(\hbar\omega\sim45\) meV, en buen acuerdo con \(k_B\theta_D=30\) meV.</p></details></li>
<li><span class="lvl">Avanzado</span>En una cadena de \(N\) átomos con un orbital cada uno y salto \(t\) entre vecinos, con condiciones periódicas, los niveles son \(E_j=\varepsilon-2t\cos(2\pi j/N)\). Demuestre que la densidad de estados por unidad de energía es \(g(E)=N/[\pi\sqrt{4t^2-(E-\varepsilon)^2}]\) y que diverge en los bordes de la banda.
<details><summary>Respuesta</summary><p>Con \(k=2\pi j/N\) hay \(N/2\pi\) estados por unidad de \(k\); \(g=2\cdot(N/2\pi)/|\dd E/\dd k|\) con \(|\dd E/\dd k|=2t|\sen k|=\sqrt{4t^2-(E-\varepsilon)^2}\). El factor 2 cuenta \(\pm k\). La divergencia en \(E=\varepsilon\pm2t\) es la singularidad de van Hove de una dimensión.</p></details></li>
</ol>
