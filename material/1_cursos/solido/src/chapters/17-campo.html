<template class="chapter-src" data-id="campo" data-num="17" data-title="Electrones en campo magnético" data-part="Parte III · Electrones en sólidos" data-short="Órbitas en el espacio recíproco y en el real, frecuencia y resonancia ciclotrón, niveles de Landau y su degeneración, factor de llenado, efecto de Haas–van Alphen y medida de la superficie de Fermi, efecto Hall cuántico entero, estados de borde y mariposa de Hofstadter">
<p class="lead">Un campo magnético no cambia la energía de un electrón, pero curva su trayectoria. En un cristal la curva sigue la superficie de Fermi, y cuando el campo es intenso el movimiento circular se cuantiza en niveles de Landau. Los efectos que resultan son a la vez herramientas de medida y fenómenos fundamentales: la resonancia ciclotrón da las masas efectivas, las oscilaciones de Haas–van Alphen dibujan la superficie de Fermi y el efecto Hall cuántico define hoy el ohmio con una precisión de partes en mil millones.</p>

<section>
<h2>Órbitas ciclotrón</h2>
<p>Con \(\vb E=0\) la ecuación semiclásica \(\hbar\dot{\vb k}=-e\vb v\times\vb B\) hace que \(\vb k\) se mueva perpendicular a \(\vb B\) y a la velocidad: sobre la intersección de una superficie de energía constante con un plano perpendicular al campo. La órbita en el espacio real es la misma curva girada 90° y escalada por \(\hbar/(eB)\): en 1 T, una órbita de \(k_F=1\) Å⁻¹ mide \(\hbar k_F/(eB)=6.6\) µm de radio. Para electrones libres el período es el de la <span class="term">frecuencia ciclotrón</span></p>
<div class="eq key" data-name="Frecuencia ciclotrón">\[\omega_c=\frac{eB}{m^*},\]</div>
<p>que en general define la <span class="term">masa ciclotrón</span> \(m_c^*=\tfrac{\hbar^2}{2\pi}\,\partial A/\partial E\), con \(A\) el área de la órbita en el espacio \(\vb k\). Según la orientación de la banda, una órbita puede rodear estados ocupados (electrónica) o vacíos (de huecos), y girar en sentidos opuestos. Si la superficie de Fermi es abierta, como las «cuellos» del cobre que tocan las caras hexagonales de la zona, hay órbitas abiertas que no se cierran y producen magnetorresistencias anisótropas enormes.</p>
<p>La <span class="term">resonancia ciclotrón</span> mide \(m^*\) directamente: se absorbe radiación de microondas cuando \(\omega=\omega_c\). Dresselhaus, Kip y Kittel (1955) midieron así las masas del Si y del Ge, y la anisotropía con la orientación del cristal reveló los elipsoides de conducción. En GaAs con \(m^*=0.067\,m\), \(\hbar\omega_c=1.73\) meV por tesla, quince veces el valor del electrón libre.</p>
<div class="sim" data-sim="orbitas" data-title="Órbitas ciclotrón en el espacio recíproco y en el real"></div>
<div class="sim-guide"><ul>
<li>Izquierda: contorno de Fermi de una red cuadrada de enlace fuerte y el punto que lo recorre bajo el campo. Derecha: la órbita en el espacio real, girada y escalada.</li>
<li>Con poca ocupación la órbita es electrónica y casi circular; con más de media banda llena rodea los estados vacíos de la esquina y gira en sentido contrario: una órbita de huecos.</li>
</ul></div>
</section>

<section>
<h2>Niveles de Landau</h2>
<p>Lev Landau resolvió en 1930 el problema cuántico de un electrón libre en un campo uniforme. Con el potencial vector \(\vb A=(0,Bx,0)\), la ecuación de Schrödinger separa en una onda plana en \(y\) y \(z\) y un oscilador armónico en \(x\), centrado en \(x_0=\hbar k_y/(eB)\) y de frecuencia \(\omega_c\):</p>
<div class="eq key" data-name="Niveles de Landau">\[E_{n,k_z}=\hbar\omega_c\left(n+\tfrac12\right)+\frac{\hbar^2k_z^2}{2m^*},\qquad n=0,1,2,\dots\]</div>
<p>Cada nivel tiene una degeneración enorme: tantos estados como centros \(x_0\) caben en la muestra, \(eB/h\) por unidad de área y por espín (2.4×10¹⁰ cm⁻² en 1 T). La longitud magnética \(\ell_B=\sqrt{\hbar/eB}\), 25.7 nm en 1 T, es el tamaño de la órbita fundamental. En un gas de electrones bidimensional, como el de una heteroestructura GaAs/AlGaAs, no hay movimiento en \(z\) y la densidad de estados se convierte en una serie de picos separados \(\hbar\omega_c\). El número de niveles llenos es el <span class="term">factor de llenado</span> \(\nu=nh/(eB)\).</p>
<div class="sim" data-sim="landau" data-title="Niveles de Landau de un gas de electrones bidimensional"></div>
<div class="sim-guide"><ul>
<li>Arriba la densidad de estados: el valor constante sin campo se reorganiza en picos ensanchados (desorden \(\Gamma\)), cada uno con \(eB/h\) estados por espín. Abajo, el nivel de Fermi frente a \(B\) a densidad fija: salta de un nivel al siguiente cada vez que \(\nu\) cruza un entero.</li>
</ul></div>
</section>

<section>
<h2>El efecto de Haas–van Alphen</h2>
<p>Cuando el campo cambia, los niveles de Landau cruzan sucesivamente la energía de Fermi y la energía total del gas oscila. Las oscilaciones de la magnetización (Wander de Haas y P. M. van Alphen, 1930, en bismuto) y de la resistividad (Shubnikov–de Haas) son periódicas en \(1/B\). Lars Onsager (1952) mostró que el período está fijado por el área extrema \(A_F\) de la superficie de Fermi perpendicular al campo:</p>
<div class="eq key" data-name="Período de Haas–van Alphen">\[\Delta\!\left(\frac1B\right)=\frac{2\pi e}{\hbar A_F},\qquad F=\frac{\hbar A_F}{2\pi e}.\]</div>
<p>Girando el cristal se miden las áreas en todas las direcciones y se reconstruye la superficie de Fermi. Para el cobre, la sección central de la esfera libre daría \(F=\hbar k_F^2/2e=6.1\times10^4\) T; las mediciones de David Shoenberg mostraron además las órbitas pequeñas de los cuellos sobre las caras hexagonales. La amplitud cae con la temperatura según el factor de Lifshitz y Kosevich \(X/\senh X\), \(X=2\pi^2k_BT/\hbar\omega_c\): hay que medir a pocos kelvin y en campos de decenas de teslas.</p>
<div class="sim" data-sim="dhva" data-title="Oscilaciones de Haas–van Alphen de un gas bidimensional"></div>
<div class="sim-guide"><ul>
<li>La energía del gas bidimensional se suma nivel por nivel y la magnetización se obtiene derivando respecto de \(B\). En \(1/B\) las oscilaciones tienen período constante \(e/(\pi\hbar n)\) (con dos espines), igual a \(2\pi e/(\hbar A_F)\).</li>
<li>La temperatura y el ensanchamiento amortiguan las oscilaciones según el factor de Lifshitz–Kosevich.</li>
</ul></div>
</section>

<section>
<h2>El efecto Hall cuántico</h2>
<p>En 1980 Klaus von Klitzing midió la resistencia de Hall de un transistor MOSFET de silicio a 1.5 K y 18 T y encontró mesetas exactamente en \(\rho_{xy}=h/(\nu e^2)\) con \(\nu\) entero, mientras la resistencia longitudinal se anulaba. La explicación combina dos ingredientes. Primero, si \(\nu\) niveles de Landau están llenos, la corriente que llevan es \(\sigma_{xy}=\nu e^2/h\) (resultado que puede deducirse con el argumento de Laughlin de medio cuanto de flujo). Segundo, el desorden localiza los estados de las colas de cada nivel: mientras el nivel de Fermi recorre estados localizados, que no conducen, la ocupación de los estados extendidos no cambia y \(\rho_{xy}\) queda fija en una meseta. La corriente la llevan <span class="term">estados de borde</span> quirales que no pueden retrodispersarse, de ahí \(\rho_{xx}=0\).</p>
<div class="eq key" data-name="Constante de von Klitzing">\[R_K=\frac{h}{e^2}=25\,812.807\,45\ \Omega .\]</div>
<p>La cuantización es universal: no depende del material, la geometría ni las impurezas. Por eso, desde 2019, el ohmio del SI se realiza con el efecto Hall cuántico. La conductancia de Hall es además un invariante topológico, el número de Chern de las bandas llenas (Thouless, Kohmoto, Nightingale y den Nijs, 1982): el primer ejemplo de una fase topológica de la materia, emparentada con el modelo SSH del capítulo 14.</p>
<div class="sim" data-sim="hall-cuantico" data-title="Mesetas del efecto Hall cuántico"></div>
<div class="sim-guide"><ul>
<li>Modelo fenomenológico: niveles de Landau ensanchados con una fracción central de estados extendidos. \(\rho_{xy}\) sigue la ocupación de los estados extendidos y \(\rho_{xx}\) es proporcional a su densidad en el nivel de Fermi.</li>
<li>Aumente el desorden (fracción de estados localizados): las mesetas se ensanchan. Con todos los estados extendidos se recupera la recta clásica \(B/(ne)\).</li>
</ul></div>
</section>

<section>
<h2>La mariposa de Hofstadter</h2>
<p>¿Qué pasa cuando el campo es tan intenso que la órbita ciclotrón es comparable a la celda? En una red cuadrada de enlace fuerte con un flujo \(\Phi\) por celda, la ecuación de Harper (1955) muestra que el espectro depende de \(\alpha=\Phi/\Phi_0\) (con \(\Phi_0=h/e\)): si \(\alpha=p/q\) racional, la banda se rompe en \(q\) subbandas. Douglas Hofstadter dibujó en 1976 el espectro frente a \(\alpha\) y obtuvo un fractal, la «mariposa». En los cristales comunes harían falta miles de teslas; se ha observado en superredes de moiré de grafeno sobre nitruro de boro (2013), donde la celda es de unos 14 nm.</p>
<div class="sim" data-sim="hofstadter" data-title="Mariposa de Hofstadter"></div>
<div class="sim-guide"><ul>
<li>Para cada flujo racional \(p/q\) con \(q\) hasta el máximo elegido se diagonaliza la matriz de Harper de \(q\times q\) en dos puntos \(k\) y se dibujan las subbandas. La estructura se repite a todas las escalas.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿A qué frecuencia de microondas resuenan los electrones del GaAs (\(m^*=0.067m\)) en 0.5 T?
<details><summary>Respuesta</summary><p>\(f=eB/(2\pi m^*)=209\) GHz.</p></details></li>
<li><span class="lvl">Básico</span>Un gas bidimensional tiene \(n=3\times10^{11}\) cm⁻². ¿En qué campo el factor de llenado vale 2?
<details><summary>Respuesta</summary><p>\(B=nh/(2e)=6.2\) T.</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que el período de las oscilaciones en \(1/B\) de un gas bidimensional con dos espines es \(\Delta(1/B)=e/(\pi\hbar n)\), y verifique que coincide con la fórmula de Onsager.
<details><summary>Respuesta</summary><p>Los niveles se vacían cuando \(\nu=nh/(eB)\) disminuye en 2 (dos espines): \(\Delta(1/B)=2e/(nh)=e/(\pi\hbar n)\). Con \(A_F=\pi k_F^2=2\pi^2n\): \(2\pi e/(\hbar A_F)=e/(\pi\hbar n)\).</p></details></li>
<li><span class="lvl">Intermedio</span>¿Qué resistencia de Hall se mide en la meseta \(\nu=4\)?
<details><summary>Respuesta</summary><p>\(R_K/4=6453.20\) Ω.</p></details></li>
<li><span class="lvl">Avanzado</span>Para \(\alpha=1/2\) en la red cuadrada, demuestre que el espectro de Harper es \(E=\pm2\sqrt{\cos^2k_x+\cos^2k_y}\) y que tiene puntos de Dirac.
<details><summary>Respuesta</summary><p>Con dos sitios por celda magnética, \(H=\begin{pmatrix}2\cos k_y&1+\ee^{2\ii k_x}\\1+\ee^{-2\ii k_x}&-2\cos k_y\end{pmatrix}\) (en una base adecuada); \(E^2=4\cos^2k_y+4\cos^2k_x\). Se anula en \(k_x=k_y=\pi/2\): un cono de Dirac.</p></details></li>
</ol>
