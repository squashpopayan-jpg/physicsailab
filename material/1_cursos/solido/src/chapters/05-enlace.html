<p class="lead">¿Por qué el argón es sólido solo por debajo de 84 K, la sal funde a 801 °C y el tungsteno a 3422 °C? La respuesta está en la energía que gana cada átomo al formar parte del cristal. Este capítulo calcula esa energía para los cuatro tipos clásicos de enlace: el de van der Waals de los gases nobles, el iónico de los halogenuros alcalinos, el covalente del diamante y el metálico. Dos de esos cálculos son exactos dentro de su modelo y se comparan con la medición: las sumas de red de Lennard-Jones y la constante de Madelung.</p>

<section>
<h2>Energía de cohesión</h2>
<p>La <span class="term">energía de cohesión</span> es la energía necesaria para separar el cristal en átomos neutros aislados en reposo, a temperatura cero. La <span class="term">energía de red</span> de un cristal iónico se refiere en cambio a iones libres. Varían en tres órdenes de magnitud: 0.02 eV por átomo en el neón, 1.1 eV en el sodio, 3.5 eV en el cobre, 7.4 eV en el diamante y 8.9 eV en el tungsteno. La temperatura de fusión y el módulo de compresibilidad siguen la misma tendencia: un pozo de potencial profundo es también estrecho y rígido.</p>
<p>Las tendencias a lo largo de la tabla periódica cuentan qué electrones participan. En los metales de transición la cohesión crece hasta la mitad de la serie d (W, Mo, Nb) porque los orbitales d forman una banda que se llena primero con estados enlazantes; los alcalinos, con un solo electrón s difuso, se mantienen unidos débilmente; los gases nobles, con capas completas, solo se atraen por fluctuaciones.</p>

</section>

<section>
<h2>Cristales de van der Waals</h2>
<p>Dos átomos neutros de capa cerrada se atraen porque las fluctuaciones del dipolo de uno polarizan al otro. El cálculo de London con dos osciladores acoplados da una energía \(-A/r^6\). A distancias cortas domina la repulsión de Pauli, que se modela como \(B/r^{12}\); juntas dan el potencial de Lennard-Jones \(4\varepsilon[(\sigma/r)^{12}-(\sigma/r)^6]\). En un cristal de \(N\) átomos la energía total es</p>
<div class="eq key" data-name="Energía de Lennard-Jones del cristal">\[U_{tot}=2N\varepsilon\left[A_{12}\left(\frac{\sigma}{R}\right)^{12}-A_6\left(\frac{\sigma}{R}\right)^{6}\right],\qquad A_n=\sum_{j\neq0}\left(\frac{R}{r_j}\right)^n,\]</div>
<p>con \(R\) la distancia a primeros vecinos y \(A_n\) las <span class="term">sumas de red</span>, que solo dependen de la estructura. Para la fcc, \(A_{12}=12.13188\) (12 vecinos dominan) y \(A_6=14.45392\). Minimizando,</p>
<div class="eq key" data-name="Cristal de Lennard-Jones fcc">\[\frac{R_0}{\sigma}=\left(\frac{2A_{12}}{A_6}\right)^{1/6}=1.09,\qquad U_0=-\frac{A_6^2}{2A_{12}}N\varepsilon=-8.60\,N\varepsilon,\qquad B=\frac{75\,\varepsilon}{\sigma^3}.\]</div>

</table></div>
<p>El acuerdo empeora para el neón porque el modelo es clásico: la energía de punto cero de las vibraciones, mayor para el átomo más liviano, expande la red y reduce la cohesión. En el helio el efecto es tan grande que no solidifica a presión atmosférica ni en el cero absoluto. Las sumas de red también explican por qué los gases nobles son fcc y no hcp: la diferencia de energía entre ambas es de una parte en diez mil (\(A_6\) es 14.45489 en la hcp), demasiado pequeña para el modelo, y la elección la deciden efectos de tres cuerpos.</p>

<section>
<h2>Cristales iónicos y la constante de Madelung</h2>
<p>En el NaCl el sodio cede su electrón 3s al cloro: cuesta 5.14 eV ionizar el Na y se recuperan 3.61 eV con la afinidad electrónica del Cl. El balance negativo de 1.53 eV lo paga con creces la atracción electrostática entre los iones del cristal. La energía de un ion en el potencial de todos los demás es</p>
<div class="eq key" data-name="Energía de Madelung">\[U_i=-\frac{\alpha e^2}{4\pi\varepsilon_0R},\qquad \alpha=\sum_{j\neq i}\frac{\pm1}{r_{ij}/R},\]</div>
<p>donde \(\alpha\) es la <span class="term">constante de Madelung</span>, una suma con signos alternados que converge muy lentamente y de forma condicional: el resultado depende del orden en que se sumen los términos. En una dimensión, para una cadena de iones alternados, \(\alpha=2(1-\tfrac12+\tfrac13-\dots)=2\ln2=1.386\). En tres dimensiones la suma se hace con el método de Ewald (1921): se divide cada carga puntual en una carga apantallada por una gaussiana, cuyo potencial decae muy rápido en el espacio real, más la gaussiana compensadora, que se suma rápido en el espacio recíproco. El curso implementa la suma de Ewald y la compara con pymatgen:</p>

<section>
<h2>El modelo de Born–Mayer</h2>
<p>La atracción de Madelung hace colapsar el cristal si no hay repulsión. Max Born y Joseph Mayer (1932) la modelaron con un término exponencial entre vecinos, que imita el solapamiento de las nubes de capa cerrada. Por par de iones, con \(z\) vecinos,</p>
<div class="eq key" data-name="Born–Mayer">\[U(R)=-\frac{\alpha e^2}{4\pi\varepsilon_0R}+z\lambda\,\ee^{-R/\rho}.\]</div>
<p>En el equilibrio \(\dd U/\dd R=0\) fija \(z\lambda\ee^{-R_0/\rho}=\rho\alpha e^2/(4\pi\varepsilon_0R_0^2)\), y la energía de red queda</p>
<div class="eq key" data-name="Energía de red">\[U_0=-\frac{\alpha e^2}{4\pi\varepsilon_0R_0}\left(1-\frac{\rho}{R_0}\right).\]</div>
<p>El alcance \(\rho\approx0.3\) Å se obtiene del módulo de compresibilidad medido. La repulsión solo reduce la energía en un 10 %: el cristal iónico es, en esencia, electrostático.</p>
<div class="box ex"><h4>Energía de red del NaCl</h4><p>Con \(R_0=2.820\) Å, \(\alpha=1.747565\) y \(e^2/4\pi\varepsilon_0=14.400\) eV·Å, la energía de Madelung es 8.92 eV por par. Con \(\rho=0.321\) Å, \(U_0=-8.92(1-0.114)=-7.91\) eV por par, es decir 182.4 kcal/mol, frente a 182.6 kcal/mol medidos por el ciclo de Born–Haber. El mismo modelo da un módulo de compresibilidad \(B=\alpha e^2(R_0/\rho-2)/(18\cdot4\pi\varepsilon_0R_0^4)=24.0\) GPa, igual al medido.</p></div>
<div class="sim" data-sim="born-mayer" data-title="Energía de un cristal iónico de Born–Mayer"></div>
<div class="sim-guide"><ul>
<li>Las curvas separan la atracción de Madelung, la repulsión y la suma. Elija el cristal: \(R_0\) y \(\rho\) son los de Kittel, tabla 3.6, y la lectura compara la energía de red con la experimental.</li>
<li>Mueva \(\rho\): con una repulsión más blanda el mínimo se vuelve menos profundo y la curvatura (el módulo de compresibilidad) disminuye.</li>
</ul></div>
</section>

<section>
<h2>Enlace covalente y enlace metálico</h2>
<p>El enlace covalente es cuántico: dos átomos comparten electrones en un orbital que se extiende sobre ambos. El caso más simple es el ion H₂⁺, un electrón y dos protones a distancia \(R\). Con la combinación lineal de orbitales atómicos \(\psi_\pm=(\phi_A\pm\phi_B)/\sqrt{2(1\pm S)}\), la energía es</p>
<div class="eq key" data-name="H₂⁺ en LCAO">\[E_\pm(R)=E_{1s}+\frac{e^2}{4\pi\varepsilon_0R}-\frac{J\pm K}{1\pm S},\]</div>
<p>con la integral de solapamiento \(S\), la de Coulomb \(J\) y la de intercambio (o resonancia) \(K\), todas calculables en forma cerrada. El estado enlazante \(\psi_+\) acumula carga entre los núcleos y tiene un mínimo; el antienlazante, con un nodo en el medio, es repulsivo. Este es el germen de las bandas: con \(N\) átomos, los \(N\) orbitales enlazantes y antienlazantes se convierten en la banda de enlace fuerte del capítulo 14.</p>
<p>En el carbono, silicio y germanio los orbitales s y p se mezclan en cuatro híbridos sp³ dirigidos a los vértices de un tetraedro, y cada uno forma un enlace con un vecino. Los cuatro orbitales enlazantes por átomo forman la banda de valencia, llena con los cuatro electrones; los antienlazantes forman la banda de conducción, vacía. La brecha entre ambas es la de un semiconductor o un aislante. En compuestos como GaAs o ZnSe el enlace es parcialmente iónico, y la <span class="term">ionicidad de Phillips</span> mide esa fracción.</p>
<p>En los metales los electrones de valencia se deslocalizan por todo el cristal. La energía de cohesión proviene de que su energía cinética baja al tener más volumen disponible y de que se apantallan mutuamente los iones; la teoría cuantitativa es la del gas de electrones (capítulos 10 y 11). El <span class="term">puente de hidrógeno</span>, en fin, une moléculas con un H entre dos átomos muy electronegativos (O, N, F) con unos 0.2 eV: mantiene el hielo y las dos hebras del ADN.</p>
<div class="sim" data-sim="h2plus" data-title="Ion H₂⁺: orbitales enlazante y antienlazante"></div>

<li>El mínimo LCAO está en 1.32 Å con 1.76 eV de enlace; el resultado exacto es 1.06 Å y 2.79 eV. La diferencia muestra el límite de una base mínima.</li>

</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Con las sumas de red de la fcc demuestre \(R_0=1.09\sigma\) y \(U_0=-8.6N\varepsilon\).
<details><summary>Respuesta</summary><p>\(\dd U/\dd R=0\) da \((\sigma/R_0)^6=A_6/(2A_{12})\), \(R_0/\sigma=(2\cdot12.132/14.454)^{1/6}=1.090\); sustituyendo, \(U_0=-2N\varepsilon A_6^2/(4A_{12})=-8.60N\varepsilon\).</p></details></li>
<li><span class="lvl">Básico</span>Demuestre que la constante de Madelung de una cadena infinita de cargas \(\pm e\) alternadas, separadas \(R\), es \(2\ln2\).
<details><summary>Respuesta</summary><p>\(\alpha=2\sum_{n\ge1}(-1)^{n+1}/n=2\ln(1+1)\), por la serie de \(\ln(1+x)\) en \(x=1\).</p></details></li>
<li><span class="lvl">Intermedio</span>Estime la energía de red del KCl con \(R_0=3.147\) Å y \(\rho=0.326\) Å. ¿Cuánto cuesta separar el cristal en átomos neutros si la ionización del K cuesta 4.34 eV y la afinidad del Cl es 3.61 eV?
<details><summary>Respuesta</summary><p>\(U_0=-(1.7476\times14.40/3.147)(1-0.1036)=-7.17\) eV por par (165 kcal/mol). Respecto de átomos neutros: \(7.17-4.34+3.61=6.44\) eV por par.</p></details></li>
<li><span class="lvl">Intermedio</span>Para el potencial de Born–Mayer demuestre que el módulo de compresibilidad del NaCl es \(B=\alpha e^2(R_0/\rho-2)/(18\cdot4\pi\varepsilon_0R_0^4)\) (volumen por par \(2R_0^3\)).
<details><summary>Respuesta</summary><p>\(B=V\,\dd^2U/\dd V^2\) con \(V=2R^3\): en el mínimo \(B=U''(R_0)/(18R_0)\). Derivando dos veces y usando la condición de equilibrio, \(U''=(\alpha e^2/4\pi\varepsilon_0R_0^3)(R_0/\rho-2)\).</p></details></li>
<li><span class="lvl">Avanzado</span>Dos osciladores tridimensionales de frecuencia \(\omega_0\) y carga \(\pm e\) acoplados por la interacción dipolar. Demuestre que la energía de punto cero baja en \(\Delta U=-A/R^6\) con \(A=\tfrac34\hbar\omega_0\alpha_0^2\), donde \(\alpha_0=e^2/(4\pi\varepsilon_0m\omega_0^2)\) es la polarizabilidad.
<details><summary>Respuesta</summary><p>El acoplamiento dipolar desdobla cada modo en \(\omega_0\sqrt{1\pm c}\); la suma de las energías de punto cero de los seis modos, desarrollada hasta segundo orden en \(c\propto\alpha_0/R^3\), da \(-\tfrac18\hbar\omega_0\sum c_i^2\), con los factores 2, 1, 1 de las tres direcciones: \(-\tfrac34\hbar\omega_0\alpha_0^2/R^6\) (London, 1930).</p></details></li>
</ol>
