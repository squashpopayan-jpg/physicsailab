<p class="lead">Los átomos de un sólido no están quietos: oscilan alrededor de sus posiciones de equilibrio, y como están unidos por resortes efectivos, sus movimientos se acoplan y se propagan como ondas. El modelo más simple, una cadena de masas y resortes, contiene ya todas las ideas clave: la relación de dispersión, la zona de Brillouin, la diferencia entre velocidad de fase y de grupo, y la aparición de ramas acústicas y ópticas cuando la celda tiene más de un átomo.</p>

<section>
<h2>La cadena monoatómica</h2>
<p>En la aproximación armónica (capítulo 1) la energía potencial es cuadrática en los desplazamientos. Para una cadena de átomos de masa \(m\) separados \(a\), unidos a sus vecinos por resortes de constante \(K\), la ecuación de Newton para el desplazamiento \(u_n\) del átomo \(n\) es</p>
<div class="eq">\[m\ddot u_n=K(u_{n+1}-u_n)-K(u_n-u_{n-1})=K(u_{n+1}+u_{n-1}-2u_n).\]</div>
<p>Se buscan soluciones de onda, \(u_n=A\,\ee^{\ii(kna-\omega t)}\). Al sustituir, la dependencia en \(n\) se cancela (por la periodicidad) y queda \(-m\omega^2=K(\ee^{\ii ka}+\ee^{-\ii ka}-2)=-4K\sen^2(ka/2)\):</p>
<div class="eq key" data-name="Dispersión de la cadena monoatómica">\[\omega(k)=2\sqrt{\frac Km}\,\left|\sen\frac{ka}2\right| .\]</div>
<p>Para longitudes de onda largas (\(ka\ll1\)) la relación es lineal, \(\omega=v_sk\), con la velocidad del sonido \(v_s=a\sqrt{K/m}\): la cadena se comporta como un medio continuo. Al acercarse al borde de zona la curva se dobla y alcanza la frecuencia máxima \(\omega_{max}=2\sqrt{K/m}\) en \(k=\pi/a\). Por encima de \(\omega_{max}\) no hay ondas que se propaguen: una perturbación de frecuencia mayor decae exponencialmente.</p>
<p>Un detalle fundamental: \(k\) y \(k+2\pi/a\) describen exactamente el mismo movimiento de los átomos, porque \(\ee^{\ii(k+2\pi/a)na}=\ee^{\ii kna}\). Una onda solo tiene sentido en los puntos de la red, y longitudes de onda más cortas que \(2a\) no aportan nada nuevo (es el mismo fenómeno de <span class="term">aliasing</span> que en el muestreo de señales). Basta entonces con \(-\pi/a<k\le\pi/a\): la primera zona de Brillouin de la cadena.</p>
<div class="box ex"><h4>Orden de magnitud para un metal</h4><p>Para el cobre la distancia entre vecinos es 2.56 Å y la masa 63.5 u. Una velocidad del sonido de 3500 m/s corresponde, en una cadena con \(a=2.56\) Å, a \(\sqrt{K/m}=v_s/a=1.37\times10^{13}\) s⁻¹, con \(K=m(v_s/a)^2=19\) N/m. La frecuencia máxima \(\omega_{max}/2\pi=2\sqrt{K/m}/2\pi=4.4\) THz es del orden de la medida por neutrones (7.3 THz en el cobre real, donde cada átomo tiene 12 vecinos).</p></div>
<div class="sim" data-sim="cadena1" data-title="Cadena monoatómica: modos normales y relación de dispersión"></div>
<div class="sim-guide"><ul>
<li>Arriba los átomos de la cadena (desplazamientos transversales exagerados para verlos mejor; la física es la misma para ondas longitudinales). Abajo la relación de dispersión con el punto del modo elegido.</li>
<li>Lleve \(k\) más allá de \(\pi/a\): active «onda continua» y verá que la sinusoide de longitud de onda corta pasa por los mismos átomos que otra de \(k-2\pi/a\).</li>
</ul></div>
</section>

<section>
<h2>Velocidad de fase, velocidad de grupo y paquetes</h2>
<p>La velocidad de fase \(\omega/k\) da el avance de las crestas, pero la energía y la información viajan con la <span class="term">velocidad de grupo</span></p>
<div class="eq key" data-name="Velocidad de grupo">\[v_g=\frac{\dd\omega}{\dd k}=a\sqrt{\frac Km}\cos\frac{ka}2 .\]</div>
<p>En el borde de zona \(v_g=0\): la onda es estacionaria, con átomos vecinos en oposición de fase. Es la misma reflexión de Bragg del capítulo 4, ahora para ondas elásticas: con \(k=\pi/a\), la condición \(2k=G=2\pi/a\) se cumple y las ondas que viajan en los dos sentidos se superponen. Un paquete de ondas centrado en \(k_0\) avanza a \(v_g(k_0)\) y se ensancha, porque sus componentes tienen velocidades distintas: la cadena es un medio <span class="term">dispersivo</span>.</p>
<div class="sim" data-sim="paquete-cadena" data-title="Un paquete de ondas en la cadena"></div>
<div class="sim-guide"><ul>
<li>Se integran numéricamente las ecuaciones de Newton de 400 átomos. El paquete parte con número de onda \(k_0\) y la lectura compara su velocidad medida con \(v_g(k_0)\).</li>
<li>Con \(k_0\) cerca de \(\pi/a\) el paquete casi no se mueve, aunque los átomos oscilan con su frecuencia máxima.</li>
</ul></div>
</section>

<section>
<h2>La cadena diatómica: ramas acústica y óptica</h2>
<p>Si la celda contiene dos átomos, de masas \(m_1\) y \(m_2\), unidos alternadamente por resortes \(K_1\) (dentro de la celda) y \(K_2\) (entre celdas), hay dos ecuaciones de movimiento por celda y dos frecuencias para cada \(k\):</p>
<div class="eq key" data-name="Cadena diatómica">\[\omega_\pm^2=\frac{(K_1+K_2)(m_1+m_2)}{2m_1m_2}\pm\sqrt{\left[\frac{(K_1+K_2)(m_1+m_2)}{2m_1m_2}\right]^2-\frac{4K_1K_2}{m_1m_2}\sen^2\frac{ka}2} .\]</div>
<p>La rama inferior, \(\omega_-\), es la <span class="term">rama acústica</span>: tiende a cero en \(k=0\), donde los dos átomos se mueven juntos, y describe el sonido. La superior es la <span class="term">rama óptica</span>: en \(k=0\) los dos átomos de la celda oscilan en oposición, con el centro de masas quieto, a \(\omega_+=\sqrt{(K_1+K_2)(1/m_1+1/m_2)}\). Si los átomos tienen cargas opuestas, como en el NaCl, ese movimiento crea un dipolo oscilante que absorbe radiación infrarroja: de ahí el nombre «óptica» (capítulo 24).</p>
<p>Con \(K_1=K_2=K\) y \(m_1>m_2\), en el borde de zona las frecuencias son \(\sqrt{2K/m_1}\) y \(\sqrt{2K/m_2}\): entre ellas hay una <span class="term">brecha</span> de frecuencias prohibidas. En el modo acústico de borde solo se mueven los átomos pesados; en el óptico, solo los livianos. Si \(m_1=m_2\) y \(K_1=K_2\) la brecha se cierra y se recupera la cadena monoatómica con la zona plegada a la mitad.</p>
<div class="sim" data-sim="cadena2" data-title="Cadena diatómica: modos acústicos y ópticos"></div>
<div class="sim-guide"><ul>
<li>Elija la rama y el número de onda: la animación muestra el modo normal. En \(k=0\) óptico los dos átomos van en sentidos opuestos; en el borde de zona uno de los dos queda quieto.</li>
<li>Iguale las masas y los resortes: la brecha se cierra.</li>
</ul></div>
</section>

<section>
<h2>Constantes de fuerza a vecinos lejanos</h2>
<p>Las fuerzas entre átomos no se limitan a los primeros vecinos. Si cada átomo está unido al vecino \(p\)-ésimo con una constante \(K_p\), la dispersión es</p>
<div class="eq key" data-name="Dispersión con vecinos lejanos">\[\omega^2(k)=\frac2m\sum_{p\ge1}K_p\left[1-\cos(pka)\right],\]</div>
<p>una serie de Fourier en \(k\). La relación se invierte: midiendo \(\omega(k)\) por dispersión de neutrones, los coeficientes de Fourier de \(\omega^2\) dan las constantes de fuerza, \(K_p=-\tfrac{ma}{2\pi}\int_{-\pi/a}^{\pi/a}\omega^2(k)\cos(pka)\,\dd k\). En los metales las constantes decaen lentamente, porque los electrones de conducción apantallan la interacción entre iones; en la dispersión aparecen pequeñas irregularidades en \(q=2k_F\), las <span class="term">anomalías de Kohn</span> (1959), donde el apantallamiento cambia bruscamente.</p>
<div class="sim" data-sim="cadenaN" data-title="Cadena con constantes de fuerza a primeros, segundos y terceros vecinos"></div>
<div class="sim-guide"><ul>
<li>Cambie \(K_2\) y \(K_3\): la curva se deforma y su pendiente en el origen da \(v_s^2=(a^2/m)\sum p^2K_p\). Con \(K_2\) negativo grande la frecuencia puede volverse imaginaria: la red es inestable.</li>
<li>La gráfica inferior muestra los coeficientes recuperados por el análisis de Fourier de \(\omega^2(k)\).</li>
</ul></div>
</section>

<section>
<h2>Conteo de modos</h2>
<p>Con condiciones de contorno periódicas en una cadena de \(N\) celdas (capítulo 3), \(k=2\pi j/(Na)\) toma \(N\) valores en la zona de Brillouin. Una cadena monoatómica tiene \(N\) modos, uno por átomo, como corresponde a \(N\) grados de libertad. Una diatómica tiene \(2N\): \(N\) acústicos y \(N\) ópticos. En tres dimensiones cada átomo aporta tres grados de libertad, y un cristal con \(s\) átomos por celda primitiva tiene \(3s\) ramas: tres acústicas (una longitudinal y dos transversales) y \(3s-3\) ópticas, cada una con \(N\) modos. El silicio, con dos átomos por celda, tiene 3 ramas acústicas y 3 ópticas; el cobre, con uno, solo 3 acústicas.</p>
<div class="box note"><h4>De la mecánica clásica a los fonones</h4><p>Cada modo normal es un oscilador armónico independiente. En mecánica cuántica su energía está cuantizada, \(E=(n+\tfrac12)\hbar\omega\), y el número \(n\) de cuantos excitados se interpreta como un número de partículas: los <span class="term">fonones</span>. El capítulo 7 desarrolla esta idea y el capítulo 8 la usa para calcular el calor específico.</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Demuestre que la velocidad de grupo de la cadena monoatómica es \(v_g=v_s\cos(ka/2)\) y calcule la razón entre las velocidades de fase y de grupo en \(k=\pi/2a\).
<details><summary>Respuesta</summary><p>\(v_\phi=\omega/k=v_s\,\sen(ka/2)/(ka/2)\); en \(ka=\pi/2\): \(v_\phi=0.900v_s\) y \(v_g=0.707v_s\), razón 1.27.</p></details></li>
<li><span class="lvl">Básico</span>En una cadena diatómica con \(K_1=K_2=K\), \(m_1=2m\) y \(m_2=m\), ¿cuál es la brecha en el borde de zona y la frecuencia óptica en \(k=0\)?
<details><summary>Respuesta</summary><p>Entre \(\sqrt{K/m}\) y \(\sqrt{2K/m}\); \(\omega_+(0)=\sqrt{2K(1/2m+1/m)}=\sqrt{3K/m}\).</p></details></li>
<li><span class="lvl">Intermedio</span>Muestre que en el modo óptico de \(k=0\) de la cadena diatómica la razón de amplitudes es \(u_1/u_2=-m_2/m_1\) y que el centro de masas no se mueve.
<details><summary>Respuesta</summary><p>En \(k=0\) las ecuaciones dan \(m_1\omega^2u_1=(K_1+K_2)(u_1-u_2)\); con \(\omega_+^2=(K_1+K_2)(1/m_1+1/m_2)\) resulta \(m_1u_1=-m_2u_2\).</p></details></li>
<li><span class="lvl">Intermedio</span>Una perturbación de frecuencia \(\omega>\omega_{max}\) se aplica al extremo de una cadena monoatómica. Demuestre que su amplitud decae como \((-1)^n\ee^{-\kappa n a}\) con \(\cosh(\kappa a)=2\omega^2/\omega_{max}^2-1\).
<details><summary>Respuesta</summary><p>Con \(k=\pi/a+\ii\kappa\): \(\sen^2(ka/2)=\cosh^2(\kappa a/2)\) y \(\omega^2=\omega_{max}^2\cosh^2(\kappa a/2)\), equivalente a la expresión dada.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que la densidad de modos por unidad de frecuencia de la cadena monoatómica de \(N\) átomos es \(g(\omega)=(2N/\pi)/\sqrt{\omega_{max}^2-\omega^2}\) y que integra a \(N\).
<details><summary>Respuesta</summary><p>\(g=2\cdot\tfrac{Na}{2\pi}\cdot|\dd k/\dd\omega|\) con \(\dd\omega/\dd k=\tfrac a2\sqrt{\omega_{max}^2-\omega^2}\). \(\int_0^{\omega_{max}}g\,\dd\omega=(2N/\pi)(\pi/2)=N\).</p></details></li>
</ol>
