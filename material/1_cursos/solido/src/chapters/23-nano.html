<p class="lead">Desde los años setenta se crecen cristales capa por capa, con precisión de un plano atómico, por epitaxia de haces moleculares. Así se combinan semiconductores con brechas distintas en una misma red y se diseñan potenciales a la medida para los electrones: pozos, barreras, escaleras. Cuando las dimensiones bajan a unos nanómetros, la mecánica cuántica del confinamiento domina las propiedades. Este capítulo trata esas «estructuras de diseño», presentes en todos los láseres, LED, transistores de alta frecuencia y pantallas de puntos cuánticos.</p>

<section>
<h2>Heterouniones y alineamiento de bandas</h2>
<p>En una <span class="term">heterounión</span> dos semiconductores de igual estructura y constante de red parecida (GaAs y AlAs difieren en 0.1 %) se unen sin defectos. La pregunta clave es cómo se alinean sus bandas. La regla de Anderson (1962) usa las afinidades electrónicas \(\chi\) (distancia de \(E_c\) al vacío): \(\Delta E_c=\chi_1-\chi_2\) y \(\Delta E_v=\Delta E_g-\Delta E_c\). La regla es aproximada (los dipolos de interfaz la corrigen) y en la práctica los desplazamientos se miden. Según el alineamiento hay tres tipos: en el <b>tipo I</b> (GaAs/AlGaAs) la brecha menor queda dentro de la mayor y electrones y huecos se confinan en el mismo material; en el <b>tipo II</b> (InP/InAlAs, Si/Ge) quedan en materiales distintos; en el <b>tipo III</b> (InAs/GaSb) las brechas no se superponen.</p>
<p>Para Al\(_x\)Ga\(_{1-x}\)As, \(E_g=1.424+1.247x\) eV (para \(x<0.45\)) y cerca del 65 % de la diferencia queda en la banda de conducción. Si se dopa solo la barrera de AlGaAs, los electrones caen al GaAs y quedan separados de sus donadores ionizados: el <span class="term">dopaje modulado</span> (Dingle, Störmer, Gossard y Wiegmann, 1978) produce un gas de electrones bidimensional con movilidades de más de \(10^7\) cm²/V·s a baja temperatura, base de los transistores HEMT de los teléfonos y los receptores satelitales, y del efecto Hall cuántico fraccionario.</p>

<section>
<h2>Pozos cuánticos</h2>
<p>Una capa delgada de GaAs entre barreras de AlGaAs es un <span class="term">pozo cuántico</span>: en la dirección de crecimiento los electrones tienen niveles discretos \(E_n\), y en el plano se mueven libremente. Cada nivel es el fondo de una <span class="term">subbanda</span> bidimensional, \(E=E_n+\hbar^2k_\parallel^2/2m^*\). Para un pozo de ancho \(L\) y profundidad \(V_0\), los niveles pares cumplen \(v=u\tan u\) y los impares \(v=-u\cot u\), con \(u^2+v^2=u_0^2=m^*V_0L^2/2\hbar^2\): siempre hay al menos un estado ligado y el número total es \(\lceil2u_0/\pi\rceil\). En un pozo de GaAs de 10 nm con barreras de Al\(_{0.3}\)Ga\(_{0.7}\)As (\(V_0=0.24\) eV), los niveles de electrones están a 32, 125 y 240 meV, más bajos que los del pozo infinito (56, 225 meV) porque la función de onda penetra en las barreras. Las transiciones entre subbandas son la base de los láseres de cascada cuántica en el infrarrojo, y los pozos múltiples forman la zona activa de casi todos los láseres de semiconductor.</p>

</section>

<section>
<h2>Densidad de estados y dimensionalidad</h2>
<p>El confinamiento cambia la forma de la densidad de estados. En tres dimensiones crece como \(\sqrt E\); en un pozo (dos dimensiones libres) es una escalera, con \(m^*/\pi\hbar^2\) por unidad de área en cada subbanda; en un hilo cuántico (una dimensión libre) cada subbanda aporta un pico que decae como \(1/\sqrt{E-E_n}\); en un punto cuántico (cero dimensiones) solo quedan niveles discretos, como en un átomo. La concentración de estados cerca del borde de la banda hace más eficientes los láseres de pozos y puntos cuánticos: con menos portadores se alcanza la inversión, y la corriente umbral es menor y menos sensible a la temperatura.</p>

<section>
<h2>Puntos cuánticos</h2>
<p>Un nanocristal de semiconductor de pocos nanómetros confina electrones y huecos en las tres direcciones. Louis Brus (1984) estimó la energía del primer excitón de un cristal esférico de radio \(R\) sumando la brecha, el confinamiento del electrón y del hueco y la atracción coulombiana entre ellos:</p>
<div class="eq key" data-name="Ecuación de Brus">\[E(R)=E_g+\frac{\hbar^2\pi^2}{2R^2}\left(\frac1{m_e^*}+\frac1{m_h^*}\right)-1.786\,\frac{e^2}{4\pi\varepsilon_0\varepsilon_rR}.\]</div>
<p>Para el CdSe (\(E_g=1.74\) eV, \(m_e^*=0.13\), \(m_h^*=0.45\), \(\varepsilon_r=10.6\)) da emisión a 648 nm con \(R=4\) nm y a 554 nm con \(R=2.5\) nm: el mismo material emite cualquier color según su tamaño. La fórmula sobrestima la energía para cristales muy pequeños (el pozo no es infinito y la masa efectiva deja de valer), pero capta la física. Los puntos cuánticos coloidales de Alexei Ekimov, Louis Brus y Moungi Bawendi (Premio Nobel de Química 2023) se usan en pantallas QLED, marcadores biológicos y celdas solares.</p>
<div class="sim" data-sim="puntos-cuanticos" data-title="Color de los puntos cuánticos de CdSe según su tamaño"></div>
<div class="sim-guide"><ul>
<li>Energía de emisión de la ecuación de Brus y sus tres términos frente al radio, con el color de cada tamaño. El círculo muestra el nanocristal a escala con su red de átomos.</li>
</ul></div>
</section>

<section>
<h2>Superredes y minibandas</h2>
<p>Una secuencia periódica de pozos y barreras delgadas es una <span class="term">superred</span> (Esaki y Tsu, 1970): un cristal artificial de período \(d\) de unos 5–20 nm, cuyo potencial de Kronig–Penney (capítulo 12) es exactamente el de las heterouniones. Los niveles de los pozos se acoplan por efecto túnel y forman <span class="term">minibandas</span> de ancho de decenas de meV, con zonas de Brillouin de \(\pi/d\), mucho menores que las del cristal. En las superredes se observaron las oscilaciones de Bloch (capítulo 16), la conducción por efecto túnel resonante y la resistencia diferencial negativa, y son la base de los detectores infrarrojos y de los láseres de cascada cuántica.</p>
<div class="sim" data-sim="superred" data-title="Minibandas de una superred GaAs/AlGaAs"></div>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Con la regla de Anderson, calcule \(\Delta E_c\) y \(\Delta E_v\) para GaAs (\(\chi=4.07\) eV, \(E_g=1.42\)) e InP (\(\chi=4.38\), \(E_g=1.34\)).
<details><summary>Respuesta</summary><p>\(\Delta E_c=\chi_{InP}-\chi_{GaAs}=0.31\) eV: la banda de conducción del InP queda más baja. Los máximos de valencia están en \(-(\chi+E_g)\): \(-5.49\) eV en GaAs y \(-5.72\) eV en InP. Ambas bandas del InP quedan por debajo: alineamiento escalonado (tipo II) según la regla de Anderson.</p></details></li>
<li><span class="lvl">Básico</span>¿Cuántos estados ligados tiene un pozo de GaAs de 20 nm con \(V_0=0.24\) eV?
<details><summary>Respuesta</summary><p>\(u_0=\tfrac L2\sqrt{2m^*V_0}/\hbar=6.48\); \(\lceil2u_0/\pi\rceil=5\).</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que la densidad de estados de una subbanda bidimensional es \(m^*/(\pi\hbar^2)\) por unidad de área (con dos espines) e independiente de la energía.
<details><summary>Respuesta</summary><p>\(N(E)=2\cdot\pi k^2\cdot A/(2\pi)^2=Am^*E/(\pi\hbar^2)\); \(\dd N/\dd E=Am^*/(\pi\hbar^2)\).</p></details></li>
<li><span class="lvl">Intermedio</span>Con la ecuación de Brus, ¿qué radio debe tener un punto de CdSe para emitir en verde (530 nm)?
<details><summary>Respuesta</summary><p>Hay que resolver \(E(R)=2.34\) eV: \(R\approx2.3\) nm (diámetro de unos 4.5 nm).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que en el límite de barreras muy gruesas el ancho de la miniband más baja de una superred decae como \(\ee^{-\kappa b}\), con \(\kappa=\sqrt{2m^*(V_0-E_1)}/\hbar\).
<details><summary>Respuesta</summary><p>En el límite de enlace fuerte el ancho es \(4t\) con \(t\) proporcional al solapamiento de las colas de los estados de pozos vecinos, cada una \(\propto\ee^{-\kappa x}\) dentro de la barrera: \(t\propto\ee^{-\kappa b}\).</p></details></li>
</ol>
<div class="box note"><h4>Para profundizar</h4><p>G. Bastard, <em>Wave Mechanics Applied to Semiconductor Heterostructures</em>, Les Éditions de Physique, 1988. L. Esaki y R. Tsu, «Superlattice and negative differential conductivity in semiconductors», <em>IBM J. Res. Dev.</em> 14, 61 (1970). R. Dingle et al., «Electron mobilities in modulation-doped semiconductor heterojunction superlattices», <em>Appl. Phys. Lett.</em> 33, 665 (1978). L. E. Brus, «Electron–electron and electron–hole interactions in small semiconductor crystallites», <em>J. Chem. Phys.</em> 80, 4403 (1984).</p></div>
