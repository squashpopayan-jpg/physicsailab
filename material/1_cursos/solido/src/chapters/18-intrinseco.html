<template class="chapter-src" data-id="intrinseco" data-num="18" data-title="Semiconductores intrínsecos" data-part="Parte IV · Semiconductores" data-short="Bandas cerca de la brecha, electrones y huecos, huecos pesados y ligeros, densidades efectivas de estados, estadística no degenerada, ley de acción de masas, concentración intrínseca y nivel intrínseco, dependencia de la brecha con la temperatura (Varshni) y conductividad intrínseca">
<p class="lead">Un semiconductor es un aislante de brecha pequeña. En el cero absoluto la banda de valencia está llena y la de conducción vacía, y no conduce. A temperatura ambiente unos pocos electrones saltan la brecha por agitación térmica, dejan huecos en la banda de valencia y el material conduce un poco. Ese «poco» depende de la temperatura de manera exponencial, y esa sensibilidad, junto con la posibilidad de controlar el número de portadores con impurezas (capítulo 19), es lo que hace útiles a los semiconductores.</p>

<section>
<h2>Electrones y huecos cerca de la brecha</h2>
<p>En un semiconductor solo importan los estados cerca de los bordes: el mínimo de la banda de conducción \(E_c\) y el máximo de la de valencia \(E_v\), separados por la brecha \(E_g=E_c-E_v\). Cerca de esos extremos las bandas son parabólicas, \(E=E_c+\hbar^2k^2/2m_e^*\) para los electrones y \(E=E_v-\hbar^2k^2/2m_h^*\) para la valencia, descrita con huecos de masa positiva \(m_h^*\) (capítulo 16). En el silicio, el germanio y los compuestos III-V el máximo de valencia en Γ es degenerado: hay una banda de <span class="term">huecos pesados</span> y otra de <span class="term">huecos ligeros</span> (en GaAs, 0.51 y 0.082 \(m\)), más una banda desdoblada por el acoplamiento espín–órbita. Los mínimos de conducción pueden ser varios (6 en el Si, 4 en el Ge), cada uno con su elipsoide.</p>
<p>Todo esto se resume en dos <span class="term">masas efectivas de densidad de estados</span>. La densidad de estados de conducción es la de un gas libre de masa \(m_e^*\), multiplicada por el número de valles: \(g_c(E)=\tfrac1{2\pi^2}(2m_{e}^*/\hbar^2)^{3/2}\sqrt{E-E_c}\) con \(m_e^*=6^{2/3}(m_lm_t^2)^{1/3}=1.08\,m\) en el silicio; análogamente para la valencia, con \(m_h^*=(m_{hh}^{3/2}+m_{lh}^{3/2})^{2/3}\).</p>
</section>

<section>
<h2>Concentraciones de portadores</h2>
<p>El número de electrones en la banda de conducción es \(n=\int g_c(E)f(E)\,\dd E\). Si el nivel de Fermi está a más de unos \(3k_BT\) de las bandas (semiconductor <span class="term">no degenerado</span>), la función de Fermi se reduce a la cola de Boltzmann y</p>
<div class="eq key" data-name="Concentraciones de portadores">\[n=N_c\,\ee^{-(E_c-E_F)/k_BT},\qquad p=N_v\,\ee^{-(E_F-E_v)/k_BT},\qquad N_{c,v}=2\left(\frac{m_{e,h}^*k_BT}{2\pi\hbar^2}\right)^{3/2}.\]</div>
<p>\(N_c\) y \(N_v\) son las <span class="term">densidades efectivas de estados</span>: todo pasa como si la banda tuviera \(N_c\) estados concentrados en su borde. En el silicio a 300 K, \(N_c=2.86\times10^{19}\) cm⁻³ y \(N_v=3.10\times10^{19}\) cm⁻³ (Green, 1990). Si el nivel de Fermi se acerca a una banda, hace falta la integral de Fermi–Dirac exacta: \(n=N_c\mathcal F_{1/2}(\eta)\) con \(\eta=(E_F-E_c)/k_BT\). El producto de las dos concentraciones no depende de \(E_F\):</p>
<div class="eq key" data-name="Ley de acción de masas">\[np=N_cN_v\,\ee^{-E_g/k_BT}=n_i^2 .\]</div>
<p>Es la <span class="term">ley de acción de masas</span>: si se aumenta \(n\) con impurezas, \(p\) disminuye en la misma proporción. Vale en equilibrio y en condiciones no degeneradas, con o sin dopaje.</p>
<div class="sim" data-sim="portadores" data-title="Densidad de estados, ocupación y portadores"></div>
<div class="sim-guide"><ul>
<li>Las bandas de conducción y de valencia del silicio con su densidad de estados \(\propto\sqrt{|E-E_{c,v}|}\), la función de Fermi y los portadores resultantes (escala logarítmica en las colas). Mueva \(E_F\): \(n\) y \(p\) cambian en sentidos opuestos y su producto se mantiene en \(n_i^2\).</li>
<li>Acerque \(E_F\) a una banda: la aproximación de Boltzmann sobrestima \(n\), y la lectura muestra el valor exacto con \(\mathcal F_{1/2}\).</li>
</ul></div>
</section>

<section>
<h2>La concentración intrínseca</h2>
<p>En un semiconductor puro cada electrón de conducción deja un hueco: \(n=p=n_i\), con</p>
<div class="eq key" data-name="Concentración intrínseca">\[n_i=\sqrt{N_cN_v}\,\ee^{-E_g/2k_BT},\qquad E_i=\frac{E_c+E_v}2+\frac{k_BT}2\ln\frac{N_v}{N_c}.\]</div>
<p>El nivel de Fermi intrínseco \(E_i\) queda casi en la mitad de la brecha (en el Si, 1 meV por encima; en el GaAs, 38 meV por encima, porque la masa de los electrones es mucho menor que la de los huecos). La concentración intrínseca crece de forma exponencial: en el silicio vale \(1.07\times10^{10}\) cm⁻³ a 300 K, \(5.6\times10^{12}\) a 400 K y \(2.7\times10^{14}\) a 500 K. Comparada con los \(5\times10^{22}\) átomos por cm³, es una parte en \(5\times10^{12}\) a temperatura ambiente. Una gráfica de \(\ln n_i\) frente a \(1/T\) es casi una recta de pendiente \(-E_g/2k_B\): así se mide la brecha.</p>

<section>
<h2>La brecha depende de la temperatura</h2>
<p>La brecha disminuye al calentar: la red se dilata (los enlaces se debilitan) y la interacción electrón–fonón renormaliza las bandas. Yatendra Varshni (1967) propuso una fórmula empírica que se usa en todas las tablas:</p>
<div class="eq key" data-name="Varshni">\[E_g(T)=E_g(0)-\frac{\alpha T^2}{T+\beta},\]</div>
<p>cuadrática a baja temperatura y lineal a alta. Para el silicio \(E_g(0)=1.170\) eV, \(\alpha=4.73\times10^{-4}\) eV/K y \(\beta=636\) K, que dan 1.124 eV a 300 K; para el GaAs, 1.519 eV a 0 K y 1.422 eV a 300 K. El corrimiento es del orden de 0.3–0.5 meV/K: por eso un láser semiconductor cambia de color al calentarse y hay que estabilizar su temperatura.</p>
<div class="sim" data-sim="varshni" data-title="Brecha en función de la temperatura y conductividad intrínseca"></div>
<div class="sim-guide"><ul>
<li>Izquierda: \(E_g(T)\) de Varshni. Derecha: conductividad intrínseca \(\sigma=en_i(\mu_n+\mu_p)\) con movilidades que caen como \(T^{-3/2}\) o más rápido por los fonones; a pesar de eso, la conductividad crece de forma exponencial.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule \(N_c\) del GaAs a 300 K con \(m_e^*=0.067m\).
<details><summary>Respuesta</summary><p>\(N_c=2.5\times10^{19}(0.067)^{3/2}=4.3\times10^{17}\) cm⁻³ (con \(2(mk_BT/2\pi\hbar^2)^{3/2}=2.51\times10^{19}\) cm⁻³ para \(m^*=m\)).</p></details></li>
<li><span class="lvl">Básico</span>¿En qué factor aumenta \(n_i\) del silicio al pasar de 300 a 350 K (tome \(E_g=1.12\) eV constante)?
<details><summary>Respuesta</summary><p>\((350/300)^{3/2}\exp[\tfrac{E_g}{2k_B}(1/300-1/350)]=1.26\times\exp(3.09)=28\).</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que \(E_i\) se desplaza respecto del centro de la brecha en \(\tfrac34k_BT\ln(m_h^*/m_e^*)\).
<details><summary>Respuesta</summary><p>De \(n=p\): \(N_c\ee^{-(E_c-E_i)/k_BT}=N_v\ee^{-(E_i-E_v)/k_BT}\), \(E_i=\tfrac{E_c+E_v}2+\tfrac{k_BT}2\ln(N_v/N_c)\) y \(N_v/N_c=(m_h^*/m_e^*)^{3/2}\).</p></details></li>
<li><span class="lvl">Intermedio</span>Con \(\mu_n=1417\) y \(\mu_p=471\) cm²/V·s, calcule la resistividad del silicio intrínseco a 300 K.
<details><summary>Respuesta</summary><p>\(\rho=1/[en_i(\mu_n+\mu_p)]=1/(1.6\times10^{-19}\times1.07\times10^{10}\times1888)=3.1\times10^5\) Ω·cm.</p></details></li>
<li><span class="lvl">Avanzado</span>Deduzca \(N_c=2(m^*k_BT/2\pi\hbar^2)^{3/2}\) integrando \(g_c(E)\ee^{-(E-E_F)/k_BT}\) desde \(E_c\).
<details><summary>Respuesta</summary><p>\(\int_0^\infty\sqrt x\,\ee^{-x/k_BT}\dd x=\tfrac{\sqrt\pi}2(k_BT)^{3/2}\); multiplicado por \(\tfrac1{2\pi^2}(2m^*/\hbar^2)^{3/2}\) da el resultado.</p></details></li>
</ol>
