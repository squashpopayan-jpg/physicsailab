<p class="lead">Las distancias entre átomos son de unos pocos ángstroms, justo la longitud de onda de los rayos X de un tubo de cobre. Por eso un cristal actúa como una red de difracción tridimensional: refleja la radiación solo en direcciones muy precisas, y de esas direcciones y de sus intensidades se deduce la red y la posición de cada átomo. Casi todo lo que se sabe de la estructura de los sólidos, desde la sal de mesa hasta la doble hélice del ADN, salió de experimentos de difracción.</p>

<section>
<h2>Ley de Bragg y condición de Laue</h2>
<p>William Lawrence Bragg imaginó en 1912 el cristal como una pila de planos paralelos separados \(d\) que reflejan parcialmente la radiación de forma especular. Las ondas reflejadas por planos sucesivos recorren una distancia extra \(2d\sen\theta\), donde \(\theta\) es el ángulo entre el haz y los planos (no con la normal). Solo hay interferencia constructiva si esa diferencia es un número entero de longitudes de onda:</p>
<div class="eq key" data-name="Ley de Bragg">\[2d\sen\theta=n\lambda .\]</div>
<p>Como \(\sen\theta\le1\), hace falta \(\lambda\le2d\): la luz visible no se difracta en un cristal, los rayos X sí. El haz desviado forma un ángulo \(2\theta\) con el incidente, y eso es lo que se mide en un difractómetro. La reflexión de orden \(n\) en los planos \((hkl)\) se trata como de primer orden en los planos ficticios \((nh\,nk\,nl)\) con separación \(d/n\); por eso se habla de la reflexión 200 aunque los planos (200) no contengan átomos distintos de los (100).</p>
<p>Max von Laue planteó el mismo problema sin planos: cada punto de red dispersa una onda, y la dispersión desde el punto \(\vb R\) tiene una fase \(\ee^{\ii(\vb k-\vb k')\cdot\vb R}\) respecto de la del origen, con \(\vb k\) y \(\vb k'\) los vectores de onda incidente y dispersado, de igual módulo \(2\pi/\lambda\) en la dispersión elástica. Todas las fases coinciden si el cambio de vector de onda es un vector de la red recíproca:</p>
<div class="eq key" data-name="Condición de Laue">\[\Delta\vb k=\vb k'-\vb k=\vb G .\]</div>
<p>Elevando al cuadrado \(\vb k'=\vb k+\vb G\) con \(k'=k\) se obtiene \(2\vb k\cdot\vb G+G^2=0\): \(\vb k\) termina en un plano de Bragg de la red recíproca (capítulo 3). Con \(|\vb G|=2\pi n/d\) y \(\vb k\cdot\vb G=-kG\sen\theta\), resulta \(2d\sen\theta=n\lambda\): ambas formulaciones son la misma.</p>
<div class="sim" data-sim="bragg" data-title="Reflexión de Bragg en una pila de planos atómicos"></div>
<div class="sim-guide"><ul>
<li>Cambie el ángulo: las ondas reflejadas por los planos sucesivos se suman en fase solo cuando la diferencia de camino \(2d\sen\theta\) es un múltiplo de \(\lambda\). La curva muestra la intensidad reflejada por \(N\) planos.</li>
<li>Con más planos los picos se estrechan como \(1/N\): un cristal macroscópico tiene picos casi infinitamente finos.</li>
</ul></div>
</section>

<section>
<h2>La esfera de Ewald</h2>
<p>Paul Ewald dio en 1913 una construcción geométrica que muestra de un vistazo qué reflexiones aparecen. Se dibuja la red recíproca y el vector \(\vb k\) del haz incidente terminando en el origen. La esfera de radio \(k=2\pi/\lambda\) centrada en el inicio de \(\vb k\) contiene todos los \(\vb k'\) posibles de la dispersión elástica. Hay un haz difractado por cada punto de la red recíproca que cae sobre la esfera, en la dirección del centro a ese punto.</p>
<p>Con radiación monocromática y un cristal fijo, en general ningún punto toca la esfera. Los métodos experimentales lo resuelven de tres maneras: el <b>método de Laue</b> usa un espectro continuo (una familia de esferas entre \(k_{min}\) y \(k_{max}\)); el <b>método del cristal giratorio</b> rota el cristal y con él la red recíproca; el <b>método de polvo</b> usa millones de cristalitos con orientaciones al azar, de modo que cada \(\vb G\) se convierte en una esfera de radio \(|\vb G|\) que corta a la de Ewald en un círculo: un cono de difracción de semiángulo \(2\theta\).</p>
<div class="sim" data-sim="ewald" data-title="Esfera de Ewald: reflexiones en un cristal que gira"></div>
<div class="sim-guide"><ul>
<li>El círculo es la esfera de Ewald (corte en el plano). Gire el cristal: cuando un punto de la red recíproca toca el círculo se ilumina y aparece un haz difractado.</li>
<li>Reduzca la longitud de onda: la esfera crece y entran en juego más reflexiones. Con \(\lambda>2d_{max}\) no hay ninguna.</li>
</ul></div>
</section>

<section>
<h2>Factor de estructura y reglas de extinción</h2>
<p>Los rayos X se dispersan en los electrones. La amplitud dispersada con cambio de vector de onda \(\Delta\vb k\) es proporcional a la transformada de Fourier de la densidad electrónica \(n(\vb r)\):</p>
<div class="eq">\[A(\Delta\vb k)\propto\int n(\vb r)\,\ee^{-\ii\Delta\vb k\cdot\vb r}\,\dd^3r .\]</div>
<p>Como \(n\) es periódica, la integral solo es distinta de cero si \(\Delta\vb k=\vb G\), y vale \(N\) veces la integral sobre una celda. Si la densidad es una suma de átomos centrados en las posiciones \(\vb d_j\) de la base, la integral por celda se separa en el <span class="term">factor de estructura</span></p>
<div class="eq key" data-name="Factor de estructura">\[F_{\vb G}=\sum_j f_j(\vb G)\,\ee^{-\ii\vb G\cdot\vb d_j}=\sum_j f_j\,\ee^{-2\pi\ii(hx_j+ky_j+lz_j)},\]</div>
<p>donde \((x_j,y_j,z_j)\) son las coordenadas fraccionarias en la celda convencional y \(f_j\) es el factor de forma atómico. La intensidad es \(I\propto|F|^2\): la fase se pierde en la medida, y ese es el «problema de la fase» de la cristalografía. Cuando la base hace que \(F=0\) para ciertos \((hkl)\), esas reflexiones desaparecen. Son las <span class="term">reglas de extinción</span>:</p>
<div class="tablewrap"><table>
<tr><th>Estructura (celda cúbica convencional)</th><th>Reflexiones presentes</th><th>Primeras líneas</th></tr>
<tr><td>sc</td><td>todas</td><td>100, 110, 111, 200, 210</td></tr>
<tr><td>bcc</td><td>\(h+k+l\) par (\(F=2f\))</td><td>110, 200, 211, 220, 310</td></tr>
<tr><td>fcc</td><td>\(h,k,l\) todos pares o todos impares (\(F=4f\))</td><td>111, 200, 220, 311, 222</td></tr>
<tr><td>diamante</td><td>fcc y además \(h+k+l\neq4m+2\)</td><td>111, 220, 311, 400, 331</td></tr>
<tr><td>NaCl</td><td>fcc; \(F=4(f_A+f_B)\) si todos pares, \(4(f_A-f_B)\) si todos impares</td><td>111 débil, 200, 220, 311 débil, 222</td></tr>
</table></div>
<div class="box ex"><h4>KCl parece cúbico simple</h4><p>Los iones K⁺ y Cl⁻ tienen 18 electrones cada uno, así que \(f_K\approx f_{Cl}\) y las reflexiones con índices impares, proporcionales a \(f_K-f_{Cl}\), casi desaparecen: el KCl difracta como una red cúbica simple de lado \(a/2\). En el NaCl (11 y 17 electrones en los átomos neutros) la línea 111 sí se ve, con un 8 % de la intensidad de la 200. Este contraste fue la clave con que los Bragg resolvieron en 1913 la estructura de los halogenuros alcalinos.</p></div>
<div class="sim" data-sim="factor-estructura" data-title="Factor de estructura y reflexiones prohibidas"></div>
<div class="sim-guide"><ul>
<li>El mapa muestra \(|F_{hkl}|\) para \(h,k\) en el plano elegido de \(l\); los círculos vacíos son reflexiones prohibidas por la base. Compare fcc, bcc, diamante y NaCl.</li>
<li>Con NaCl, haga \(f_B\to f_A\) (como en KCl) y vea cómo se apagan las reflexiones impares.</li>
</ul></div>
</section>

<section>
<h2>Factor de forma atómico y temperatura</h2>
<p>Un átomo no es un punto: sus electrones ocupan una nube de radio comparable a la longitud de onda, y las ondas dispersadas en distintas partes de la nube se cancelan parcialmente. Para una densidad esférica \(n_a(r)\),</p>
<div class="eq key" data-name="Factor de forma atómico">\[f(G)=\int_0^\infty 4\pi r^2n_a(r)\frac{\sen Gr}{Gr}\,\dd r ,\]</div>
<p>que vale \(Z\), el número de electrones, en \(G=0\), y decae al crecer \(\sen\theta/\lambda=G/4\pi\). Las tablas internacionales dan \(f\) como suma de gaussianas ajustadas a cálculos de Hartree–Fock; el curso usa los mismos coeficientes que pymatgen. Los elementos ligeros (H, Li, B) dispersan muy poco los rayos X: por eso es difícil localizar el hidrógeno con rayos X y se usan neutrones.</p>
<p>Los átomos vibran alrededor de sus posiciones. El promedio térmico de la fase multiplica cada factor de forma por el <span class="term">factor de Debye–Waller</span> \(\ee^{-B(\sen\theta/\lambda)^2}\), con \(B=8\pi^2\langle u^2\rangle\) y \(\langle u^2\rangle\) el desplazamiento cuadrático medio en una dirección. Los picos no se ensanchan: solo pierden intensidad, más a ángulos grandes y a temperatura alta, y esa intensidad se reparte como un fondo difuso.</p>
<div class="sim" data-sim="factor-atomico" data-title="Factores de forma atómicos y factor de Debye–Waller"></div>
<div class="sim-guide"><ul>
<li>Compare elementos ligeros y pesados: todos parten de \(f=Z\). Las líneas verticales marcan \(\sen\theta/\lambda\) de las reflexiones del cobre con Cu Kα.</li>
<li>Aumente \(B\): el factor de temperatura reduce más las reflexiones de ángulo alto.</li>
</ul></div>
</section>

<section>
<h2>El método de polvo</h2>
<p>En un difractómetro de polvo (Debye y Scherrer, 1916; Hull, 1917) una muestra policristalina se ilumina con radiación monocromática y un detector recorre el ángulo \(2\theta\). Cada familia de planos da un pico en \(2\theta=2\arcsen(\lambda/2d_{hkl})\) con intensidad</p>
<div class="eq key" data-name="Intensidad de polvo">\[I_{hkl}\propto m_{hkl}\,|F_{hkl}|^2\,\frac{1+\cos^22\theta}{\sen^2\theta\cos\theta}\,\ee^{-2B(\sen\theta/\lambda)^2},\]</div>
<p>donde \(m_{hkl}\) es la multiplicidad (cuántos planos equivalentes contribuyen: 6 para {100}, 8 para {111}, 12 para {110} en un cubo) y la fracción es el factor de Lorentz y de polarización. El patrón es la huella digital del material: las posiciones dan la red y la constante de red, las intensidades la base. Las bases de datos (ICDD) contienen cientos de miles de patrones.</p>
<p>El ancho de los picos informa sobre el tamaño de los cristalitos. Un cristal con \(N\) planos tiene picos de ancho angular proporcional a \(1/N\); la <span class="term">fórmula de Scherrer</span> lo cuantifica: \(\tau=K\lambda/(\beta\cos\theta)\), con \(\beta\) el ancho a media altura en radianes y \(K\approx0.9\). Nanopartículas de cobre de 20 nm dan un pico 111 de 0.43° de ancho con Cu Kα.</p>
<div class="box ex"><h4>Indexar el patrón del cobre</h4><p>Con Cu Kα (\(\lambda=1.5418\) Å) el cobre muestra picos en \(2\theta=43.35°\), 50.49° y 74.20°. Las distancias son 2.087, 1.808 y 1.278 Å, y sus cuadrados inversos están en la razón 3 : 4 : 8, la secuencia \(h^2+k^2+l^2\) de una red fcc (111, 200, 220). De \(d_{111}=a/\sqrt3\) se obtiene \(a=3.615\) Å. Las intensidades relativas calculadas, 100, 47 y 27, coinciden con las de pymatgen y con las de la ficha ICDD 04-0836 (100, 46, 20).</p></div>
<div class="sim" data-sim="polvo" data-title="Patrón de difracción de polvo"></div>
<div class="sim-guide"><ul>
<li>Elija el material y la radiación. Las posiciones y las intensidades se calculan con los factores atómicos de pymatgen, multiplicidad, Lorentz–polarización y Debye–Waller; cada pico se ensancha según el tamaño de cristalito (Scherrer).</li>
<li>Compare NaCl y KCl, o Cu y Al (ambos fcc): la misma red da picos en otras posiciones porque cambia \(a\).</li>
</ul></div>
</section>

<section>
<h2>Electrones y neutrones</h2>
<p>Cualquier partícula con longitud de onda de De Broglie \(\lambda=h/p\) del orden de los ángstroms se difracta en un cristal. Clinton Davisson y Lester Germer observaron en 1927 la difracción de electrones de 54 eV en níquel; un electrón de 100 eV tiene \(\lambda=12.26/\sqrt{100}=1.23\) Å. Los electrones interactúan tan fuertemente con la materia que solo penetran unas pocas capas: la difracción de electrones lentos (LEED) estudia superficies, y la de electrones rápidos en un microscopio electrónico estudia láminas delgadas y nanopartículas.</p>
<p>Los neutrones térmicos (25 meV, \(\lambda=1.80\) Å) se dispersan en los núcleos, con amplitudes que no crecen con \(Z\) y varían de un isótopo a otro: ven el hidrógeno y el deuterio, distinguen elementos vecinos de la tabla periódica y, por su momento magnético, revelan el orden magnético (capítulo 28). Además, su energía es comparable a la de los fonones, de modo que la dispersión inelástica de neutrones mide las relaciones de dispersión de las vibraciones de la red (capítulo 7).</p>
<div class="sim" data-sim="debroglie" data-title="Longitud de onda de fotones, electrones y neutrones"></div>
<div class="sim-guide"><ul>
<li>Para una misma energía, la partícula más pesada tiene menor longitud de onda. La franja sombreada marca las distancias interatómicas (1–5 Å).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>El silicio (\(a=5.431\) Å) se mide con Cu Kα (1.5418 Å). ¿Dónde aparecen las reflexiones 111 y 220? ¿Por qué no aparece la 200?
<details><summary>Respuesta</summary><p>\(d_{111}=3.136\) Å → \(2\theta=28.4°\); \(d_{220}=1.920\) Å → 47.3°. La 200 tiene \(h+k+l=2\): está prohibida por la base del diamante.</p></details></li>
<li><span class="lvl">Básico</span>Calcule el factor de estructura de la red bcc con la celda cúbica convencional y deduzca la regla de extinción.
<details><summary>Respuesta</summary><p>\(F=f[1+\ee^{-\ii\pi(h+k+l)}]\): vale \(2f\) si \(h+k+l\) es par y 0 si es impar.</p></details></li>
<li><span class="lvl">Intermedio</span>Un metal cúbico da picos con \(\sen^2\theta\) en la razón 2 : 4 : 6 : 8 : 10. ¿Qué red es? Si el primer pico está en \(2\theta=44.7°\) con Cu Kα, ¿cuánto vale \(a\)?
<details><summary>Respuesta</summary><p>bcc (110, 200, 211, 220, 310). \(d_{110}=\lambda/(2\sen22.35°)=2.026\) Å, \(a=\sqrt2d=2.865\) Å: hierro α.</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que en el diamante \(F_{hkl}=4f[1+\ee^{-\ii\pi(h+k+l)/2}]\) para índices fcc permitidos, y que la reflexión 222 está prohibida aunque sus índices sean todos pares.
<details><summary>Respuesta</summary><p>La base agrega un segundo átomo en \((\tfrac14,\tfrac14,\tfrac14)\). Para 222, \(\ee^{-\ii\pi\cdot3}=-1\) y \(F=0\). (En el Si real aparece muy débil por la asimetría de los enlaces.)</p></details></li>
<li><span class="lvl">Avanzado</span>Calcule el factor de forma de un átomo de hidrógeno en su estado fundamental, \(n(r)=\ee^{-2r/a_0}/(\pi a_0^3)\).
<details><summary>Respuesta</summary><p>\(f(G)=1/[1+(Ga_0/2)^2]^2\). Vale 1 en \(G=0\) y cae a la mitad en \(Ga_0=1.29\), es decir, \(\sen\theta/\lambda\approx0.19\) Å⁻¹.</p></details></li>
</ol>
