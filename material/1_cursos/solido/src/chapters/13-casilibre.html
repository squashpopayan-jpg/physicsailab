<p class="lead">En los metales simples, como el sodio o el aluminio, los electrones de valencia sienten un potencial efectivo sorprendentemente débil: los electrones internos apantallan el núcleo, y la ortogonalidad con ellos actúa como una repulsión que cancela buena parte de la atracción (la idea del pseudopotencial). Por eso sus bandas se parecen mucho a las del electrón libre, salvo cerca de los planos de Bragg, donde se abren brechas. Este capítulo desarrolla esa imagen con la ecuación central y la aplica al aluminio.</p>

<section>
<h2>La ecuación central</h2>
<p>Se expanden el potencial y la función de onda en ondas planas: \(U(\vb r)=\sum_{\vb G}U_{\vb G}\ee^{\ii\vb G\cdot\vb r}\) y \(\psi(\vb r)=\sum_{\vb q}C(\vb q)\ee^{\ii\vb q\cdot\vb r}\). Al sustituir en la ecuación de Schrödinger, cada componente de Fourier da una ecuación:</p>
<div class="eq key" data-name="Ecuación central">\[\left(\frac{\hbar^2(\vb k-\vb G)^2}{2m}-E\right)C(\vb k-\vb G)+\sum_{\vb G'}U_{\vb G'-\vb G}\,C(\vb k-\vb G')=0 .\]</div>
<p>Solo se acoplan las ondas cuyo vector difiere en un vector recíproco: \(\vb k\), \(\vb k-\vb G_1\), \(\vb k-\vb G_2\)… Esto demuestra de nuevo el teorema de Bloch (\(\psi=\sum_{\vb G}C(\vb k-\vb G)\ee^{\ii(\vb k-\vb G)\cdot\vb r}=\ee^{\ii\vb k\cdot\vb r}u(\vb r)\)) y da un método práctico: truncando a las ondas de energía cinética menor que un corte, la ecuación central es un problema de autovalores de una matriz hermítica. Es el método de las ondas planas que usan los programas de primeros principios.</p>
</section>

<section>
<h2>La brecha en el borde de zona</h2>
<p>Si \(U\) es débil, la mayoría de los estados son casi ondas planas, \(E\approx\varepsilon_{\vb k}=\hbar^2k^2/2m\), con una corrección de segundo orden pequeña. La teoría de perturbaciones falla donde dos ondas acopladas por \(U_{\vb G}\) tienen la misma energía: \(\varepsilon_{\vb k}=\varepsilon_{\vb k-\vb G}\), es decir, sobre un plano de Bragg. Allí basta con las dos ondas y el determinante de \(2\times2\) da</p>
<div class="eq key" data-name="Modelo de dos ondas">\[E_\pm=\frac{\varepsilon_{\vb k}+\varepsilon_{\vb k-\vb G}}2\pm\sqrt{\left(\frac{\varepsilon_{\vb k}-\varepsilon_{\vb k-\vb G}}2\right)^2+|U_{\vb G}|^2}.\]</div>
<p>Sobre el plano de Bragg las dos soluciones están separadas por una <span class="term">brecha</span> \(E_g=2|U_{\vb G}|\). Las funciones de onda correspondientes son ondas estacionarias: en una dimensión con \(U(x)=2U_1\cos(2\pi x/a)\) y \(U_1<0\) (atracción en los iones), la combinación \(\cos(\pi x/a)\) acumula la carga sobre los iones y tiene la energía menor; la combinación \(\sen(\pi x/a)\) la acumula entre ellos y queda arriba. Lejos del plano las bandas se acercan a las parábolas libres, y la pendiente se anula al cruzarlo: la velocidad de grupo perpendicular al plano es cero en el borde de zona.</p>
<div class="sim" data-sim="dos-ondas" data-title="Ecuación central en una dimensión y modelo de dos ondas"></div>
<div class="sim-guide"><ul>
<li>Las bandas completas (ecuación central con 15 ondas planas) y la aproximación de dos ondas. Aumente \(U_1\): la brecha en \(k=\pi/a\) es \(2|U_1|\); con \(U_2\) se abre la segunda brecha en \(k=0\) de la zona reducida.</li>
<li>Abajo, las densidades de carga de los dos estados del borde de zona respecto de la posición de los iones.</li>
</ul></div>
</section>

<section>
<h2>La red vacía y el aluminio</h2>
<p>El punto de partida para un cristal real es la <span class="term">red vacía</span>: electrones libres con la simetría de la red, \(E=\hbar^2|\vb k-\vb G|^2/2m\), dibujados en zona reducida a lo largo de las líneas de alta simetría. En la red fcc aparecen degeneraciones características: en Γ la segunda banda es 8 veces degenerada (los ocho \(\vb G\) de tipo ⟨111⟩), en X se cruzan dos parábolas. El potencial cristalino rompe esas degeneraciones y abre brechas de tamaño \(2|U_{\vb G}|\).</p>
<p>Para el aluminio basta un pseudopotencial con dos coeficientes, \(U_{111}=0.24\) eV y \(U_{200}=0.76\) eV, ajustados por Neil Ashcroft (1963) a las mediciones de la superficie de Fermi por efecto de Haas–van Alphen. Con 3 electrones por átomo, \(E_F=11.7\) eV sobre el fondo de la banda y \(k_F=1.13\,(2\pi/a)\), más allá de la distancia a X (\(1.0\)) y a L (\(0.87\)): la esfera de Fermi atraviesa las caras de la zona y la superficie de Fermi del aluminio tiene piezas en la segunda y la tercera zona. Las bandas calculadas reproducen las de cálculos de primeros principios con un error de pocas décimas de eV.</p>
<div class="sim" data-sim="nfe-al" data-title="Bandas del aluminio: red vacía y pseudopotencial"></div>
<div class="sim-guide"><ul>
<li>Bandas fcc a lo largo de Γ–X–W–L–Γ–K. Con los coeficientes en cero se ve la red vacía; con los de Ashcroft, el aluminio. La línea roja es el nivel de Fermi de 3 electrones por átomo.</li>
<li>La lectura da las brechas en X y en L, cercanas a \(2|U_{200}|\) y \(2|U_{111}|\).</li>
</ul></div>
</section>

<section>
<h2>La superficie de Fermi en zonas: construcción de Harrison</h2>
<p>¿Qué forma tiene la superficie de Fermi de un metal casi libre? Walter Harrison (1960) propuso una construcción geométrica. Se dibuja la esfera de Fermi libre de radio \(k_F\) (que encierra \(Z\) electrones por celda) sobre las zonas de Brillouin. La parte de la esfera en la zona \(n\) es la superficie de Fermi de la banda \(n\) en el esquema extendido; trasladando sus piezas a la primera zona por vectores \(\vb G\) se obtiene la superficie en zona reducida. El potencial redondea las esquinas, pero la topología queda. Con valencia par la esfera tiene el volumen de un número entero de zonas, pero no las llena porque no tiene su forma: los metales divalentes, como el magnesio, conducen porque la segunda banda se superpone con la primera.</p>
<div class="sim" data-sim="harrison" data-title="Construcción de Harrison en la red cuadrada"></div>
<div class="sim-guide"><ul>
<li>Izquierda: el círculo de Fermi de \(Z\) electrones por celda sobre las zonas de Brillouin. Derecha: las piezas ocupadas de la zona elegida, trasladadas a la primera zona.</li>
<li>Con \(Z=2\) el círculo tiene el área de la primera zona pero sobresale: quedan huecos en las esquinas de la primera zona y bolsillos de electrones en la segunda.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>En el modelo de dos ondas, ¿cuánto vale la brecha en el punto X del aluminio si \(U_{200}=0.76\) eV?
<details><summary>Respuesta</summary><p>\(2|U_{200}|=1.52\) eV; el cálculo con muchas ondas planas da 1.48 eV por la mezcla con otras ondas.</p></details></li>
<li><span class="lvl">Básico</span>Calcule la energía de la red vacía fcc en el punto X para las dos primeras bandas, en unidades de \(\hbar^2(2\pi/a)^2/2m\).
<details><summary>Respuesta</summary><p>En X, \(\vb k=(0,1,0)\): con \(\vb G=0\) y \(\vb G=(0,2,0)\) la energía es 1 (dos veces degenerada); la siguiente, con \(\vb G=(\pm1,1,\pm1)\), vale 3.</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que en el modelo de dos ondas, cerca del plano de Bragg, la banda tiene curvatura \(\dd^2E/\dd k_\perp^2=(\hbar^2/m)(1\pm2\varepsilon_G/|U_G|)\) con \(\varepsilon_G=\hbar^2G^2/8m\), y que la masa efectiva es pequeña si la brecha es pequeña.
<details><summary>Respuesta</summary><p>Con \(\vb k=\vb G/2+\vb q\), \(\varepsilon_{\vb k}-\varepsilon_{\vb k-\vb G}=\hbar^2Gq/m\); desarrollando la raíz, \(E_\pm\approx\varepsilon_G+\hbar^2q^2/2m\pm[|U|+\hbar^4G^2q^2/(2m^2\cdot4|U|)]\), que da la curvatura indicada. Brecha pequeña → masa pequeña: es el origen de las masas efectivas pequeñas de los semiconductores de brecha estrecha (InSb).</p></details></li>
<li><span class="lvl">Intermedio</span>¿Cuántos electrones por celda hacen que el círculo de Fermi de la red cuadrada toque los bordes de la primera zona?
<details><summary>Respuesta</summary><p>\(k_F=\pi/a\): \(Z=2\cdot\pi k_F^2/(2\pi/a)^2=\pi/2=1.57\) (dos espines por estado).</p></details></li>
<li><span class="lvl">Avanzado</span>Para un potencial unidimensional \(U(x)=2U_1\cos(2\pi x/a)\), calcule la corrección de segundo orden de la energía en \(k=0\) para la banda más baja.
<details><summary>Respuesta</summary><p>\(\Delta E=-2|U_1|^2/\varepsilon_{G}\) con \(\varepsilon_G=\hbar^2(2\pi/a)^2/2m\): las ondas \(\pm2\pi/a\) bajan la energía del estado \(k=0\).</p></details></li>
</ol>
<div class="box note"><h4>Para profundizar</h4><p>Ashcroft y Mermin, cap. 9; Kittel, cap. 7 y 9. N. W. Ashcroft, «The Fermi surface of aluminium», <em>Phil. Mag.</em> 8, 2055 (1963). W. A. Harrison, «Band structure of aluminum», <em>Phys. Rev.</em> 118, 1182 (1960). M. L. Cohen y V. Heine, «The fitting of pseudopotentials to experimental data», <em>Solid State Phys.</em> 24, 37 (1970).</p></div>
</section>
