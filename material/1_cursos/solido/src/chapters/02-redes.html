<p class="lead">Un cristal es un motivo de átomos repetido sobre una red de puntos. Separar la red (la periodicidad) de la base (lo que se repite) es la primera herramienta del estado sólido: con ella se describen en unas pocas líneas estructuras tan distintas como el cobre, el silicio, la sal de mesa o la perovskita de las celdas solares. Este capítulo construye las redes de Bravais, explica por qué solo hay catorce, recorre las estructuras más comunes y enseña a nombrar planos y direcciones.</p>

<section>
<h2>Red, base y celda primitiva</h2>
<p>Una <span class="term">red de Bravais</span> es el conjunto infinito de puntos</p>
<div class="eq key" data-name="Red de Bravais">\[\vb R=n_1\vb a_1+n_2\vb a_2+n_3\vb a_3,\qquad n_1,n_2,n_3\in\mathbb Z,\]</div>
<p>generado por tres vectores no coplanares \(\vb a_i\), los <span class="term">vectores primitivos</span>. La definición equivalente es geométrica: una red de Bravais se ve exactamente igual desde cualquiera de sus puntos. Una <span class="term">estructura cristalina</span> se obtiene al colocar en cada punto de la red una copia idéntica de un grupo de átomos, la <span class="term">base</span>, con posiciones \(\vb r_j=\vb R+\vb d_j\). La sal de mesa, por ejemplo, es una red fcc con una base de dos átomos: Na en \(\vb d_1=0\) y Cl en \(\vb d_2=\tfrac a2\uv x\).</p>
<p>La <span class="term">celda primitiva</span>, el paralelepípedo definido por los \(\vb a_i\), contiene exactamente un punto de red y tiene volumen \(V_c=|\vb a_1\cdot(\vb a_2\times\vb a_3)|\). La elección de los vectores primitivos no es única, pero todas las celdas primitivas tienen el mismo volumen. A menudo conviene usar una <span class="term">celda convencional</span> más grande que muestre la simetría (el cubo de la red fcc contiene cuatro puntos). La <span class="term">celda de Wigner–Seitz</span> es la celda primitiva con toda la simetría de la red: la región de puntos más cercanos a un punto de red que a cualquier otro, construida trazando los planos mediatrices a los vecinos. En la red recíproca, esa misma construcción dará la primera zona de Brillouin (capítulo 3).</p>
<div class="box def"><h4>Las cinco redes del plano</h4><p>En dos dimensiones hay cinco redes de Bravais: <b>oblicua</b> (\(a\neq b\), \(\gamma\) cualquiera), <b>rectangular</b> (\(\gamma=90°\)), <b>rectangular centrada</b>, <b>cuadrada</b> (\(a=b\), \(\gamma=90°\)) y <b>hexagonal</b> (\(a=b\), \(\gamma=120°\)). El panal de abejas del grafeno no es una red de Bravais: sus átomos no son todos equivalentes por traslación. Es una red hexagonal con una base de dos átomos.</p></div>
<div class="sim" data-sim="red2d" data-title="Redes del plano: celdas primitiva, convencional y de Wigner–Seitz"></div>
<div class="sim-guide"><ul>
<li>Elija la red y deforme \(b\) y \(\gamma\). La celda de Wigner–Seitz se construye recortando el plano con las mediatrices a los vecinos; su área siempre es igual a la de la celda primitiva.</li>
<li>Active la base de dos átomos con la red hexagonal: aparece el panal del grafeno, una red hexagonal con dos átomos por celda.</li>
</ul></div>
</section>

<section>
<h2>Las catorce redes de Bravais</h2>
<p>Las operaciones que llevan una red en sí misma, además de las traslaciones, forman su <span class="term">grupo puntual</span>: rotaciones, reflexiones, la inversión y sus combinaciones. Una red solo admite rotaciones de orden 1, 2, 3, 4 y 6. La prueba es corta: una rotación de ángulo \(\theta\) lleva puntos de red en puntos de red, así que en una base de vectores primitivos su matriz tiene elementos enteros; la traza es invariante ante cambios de base y vale \(1+2\cos\theta\) en tres dimensiones. Por tanto \(2\cos\theta\) es entero, y \(\theta\in\{0°,60°,90°,120°,180°\}\). Esta <span class="term">restricción cristalográfica</span> prohíbe los ejes de orden 5, 7 u 8, y por eso los cuasicristales con simetría de orden cinco fueron una sorpresa.</p>
<p>Según su grupo puntual las redes se agrupan en siete <span class="term">sistemas cristalinos</span>; dentro de cada uno puede haber redes primitivas (P) y centradas en el cuerpo (I), en las caras (F) o en una cara (C), para un total de catorce.</p>

<tr><th>Sistema</th><th>Ejes y ángulos de la celda convencional</th><th class="c">Redes</th><th>Ejemplos</th></tr>
<tr><td>Triclínico</td><td>\(a\neq b\neq c\); \(\alpha\neq\beta\neq\gamma\)</td><td class="c">P</td><td>CuSO₄·5H₂O, K₂Cr₂O₇</td></tr>
<tr><td>Monoclínico</td><td>\(a\neq b\neq c\); \(\alpha=\gamma=90°\neq\beta\)</td><td class="c">P, C</td><td>yeso, azufre β</td></tr>
<tr><td>Ortorrómbico</td><td>\(a\neq b\neq c\); \(\alpha=\beta=\gamma=90°\)</td><td class="c">P, C, I, F</td><td>Ga, azufre α, U</td></tr>
<tr><td>Tetragonal</td><td>\(a=b\neq c\); \(\alpha=\beta=\gamma=90°\)</td><td class="c">P, I</td><td>Sn β, TiO₂ rutilo, In</td></tr>
<tr><td>Trigonal</td><td>\(a=b=c\); \(\alpha=\beta=\gamma\neq90°\)</td><td class="c">R</td><td>Bi, As, calcita, Al₂O₃</td></tr>

<p>Al combinar los grupos puntuales con las traslaciones, incluidas las operaciones con traslación fraccionaria (ejes helicoidales y planos de deslizamiento), resultan los 230 <span class="term">grupos espaciales</span>, catalogados en las <em>International Tables for Crystallography</em>. El diamante, por ejemplo, pertenece al grupo \(Fd\bar3m\) (número 227): tiene un plano de deslizamiento diamante que la red fcc sola no tiene. El programa spglib, que se usa en la validación del curso, identifica el grupo espacial a partir de las posiciones atómicas.</p>

<section>
<h2>Estructuras cúbicas y hexagonales</h2>
<p>La mayoría de los elementos y de los compuestos sencillos cristalizan en unas pocas estructuras. El <span class="term">número de coordinación</span> es la cantidad de vecinos más próximos.</p>

<tr><th>Estructura</th><th>Red y base</th><th class="c">Átomos/celda conv.</th><th class="c">Coordinación</th><th class="c">Vecinos a</th><th>Ejemplos</th></tr>

</table></div>
<p>El diamante merece atención especial. Cada átomo tiene cuatro vecinos en los vértices de un tetraedro, con ángulos de 109.47° entre enlaces: la geometría de los orbitales híbridos sp³. A pesar de que el diamante es el material más duro, su estructura es muy abierta: si los átomos fueran esferas que se tocan ocuparían solo el 34 % del volumen, frente al 74 % del cobre. La densidad del cristal se calcula con la celda convencional: \(\rho=Z_cM/(N_AV_c)\), con \(Z_c\) fórmulas por celda.</p>
<div class="box ex"><h4>Densidad del silicio y del cobre</h4><p>El silicio tiene \(a=5.431\) Å y 8 átomos por celda: \(\rho=8\times28.086\) g/mol \(/(6.022\times10^{23}\times1.602\times10^{-22}\text{ cm}^3)=2.329\) g/cm³, igual al valor medido. El cobre, con \(a=3.615\) Å y 4 átomos de 63.55 u, da 8.93 g/cm³ (medido: 8.96). La distancia Cu–Cu es \(a/\sqrt2=2.556\) Å y la Si–Si \(\sqrt3a/4=2.352\) Å.</p></div>

<section>
<h2>Empaquetamiento compacto</h2>
<p>¿Cómo se apilan esferas iguales para ocupar el máximo volumen? Una capa compacta tiene cada esfera rodeada de seis en un triángulo (capa A). La segunda capa se asienta en la mitad de los huecos de la primera (posiciones B), y para la tercera hay dos opciones: sobre los huecos que repiten la capa A, o sobre los huecos C que no están encima de A ni de B. La secuencia ABABAB… es la <span class="term">hexagonal compacta</span>; la secuencia ABCABC… es la <span class="term">cúbica centrada en las caras</span>, cuyas capas compactas son los planos (111). Ambas tienen coordinación 12 y la misma fracción de empaquetamiento,</p>
<div class="eq key" data-name="Empaquetamiento compacto">\[f=\frac{\pi}{3\sqrt2}=0.7405,\]</div>
<p>la máxima posible para esferas iguales (conjetura de Kepler, demostrada por Thomas Hales en 1998). En la hcp ideal la razón \(c/a=\sqrt{8/3}=1.633\). Los metales hcp reales se apartan: Mg 1.624 y Co 1.623 están cerca del ideal, mientras que Zn (1.856) y Cd (1.886) están estirados, y Be (1.568) y Ti (1.588) comprimidos.</p>
<p>Entre las esferas quedan huecos. En la red fcc hay 4 sitios <span class="term">octaédricos</span> por celda (en el centro del cubo y en el centro de las aristas), que admiten una esfera de radio \(0.414R\), y 8 sitios <span class="term">tetraédricos</span> (en \(\tfrac a4(\pm1,\pm1,\pm1)\)), para una esfera de \(0.225R\). Muchas estructuras se describen como una red compacta de aniones con cationes en estos huecos: NaCl tiene todos los octaédricos ocupados, la blenda de zinc la mitad de los tetraédricos y la fluorita CaF₂ todos los tetraédricos.</p>
<div class="sim" data-sim="apilamiento" data-title="Apilamiento de capas compactas: ABAB y ABCABC"></div>
<div class="sim-guide"><ul>
<li>Agregue capas y elija la secuencia. Vista desde arriba, la capa C de la fcc tapa los huecos que la hcp deja abiertos a lo largo de \(c\).</li>
<li>La vista lateral muestra la secuencia de capas; con «falla de apilamiento» se inserta un error ABCAB<b>A</b>BC, un defecto plano frecuente en metales fcc.</li>
</ul></div>

<section>
<h2>Planos y direcciones: índices de Miller</h2>
<p>Una dirección en el cristal se escribe \([uvw]\), con \(u\vb a_1+v\vb a_2+w\vb a_3\) en la base convencional y los enteros más pequeños; \(\langle uvw\rangle\) denota la familia de direcciones equivalentes por simetría. Un plano de red se describe con los <span class="term">índices de Miller</span> \((hkl)\): se toman las intersecciones del plano con los ejes en unidades de \(a_1,a_2,a_3\), se invierten y se reducen a los enteros más pequeños con la misma razón. Un plano que corta en \(1,\infty,\infty\) es el \((100)\); uno que corta en \(1,1,1\), el \((111)\); un índice negativo se escribe con barra, \((1\bar10)\). La familia de planos equivalentes se escribe \(\{hkl\}\).</p>
<p>Los planos \((hkl)\) forman una familia equiespaciada que contiene todos los puntos de red. En un cristal cúbico la distancia entre planos vecinos es</p>
<div class="eq key" data-name="Distancia interplanar cúbica">\[d_{hkl}=\frac{a}{\sqrt{h^2+k^2+l^2}},\]</div>
<p>y la dirección \([hkl]\) es perpendicular al plano \((hkl)\). Ambas propiedades son casos particulares de un resultado general del capítulo 3: el vector de la red recíproca \(\vb G_{hkl}\) es normal a los planos \((hkl)\) y \(d_{hkl}=2\pi/|\vb G_{hkl}|\).</p>
<div class="box ex"><h4>Planos del cobre</h4><p>Para el cobre, \(d_{111}=3.615/\sqrt3=2.087\) Å, \(d_{200}=1.808\) Å y \(d_{220}=1.278\) Å. La densidad de átomos por unidad de área es máxima en los planos compactos {111}: \(4/(\sqrt3a^2)=17.7\) nm⁻², frente a 15.3 nm⁻² en {100} y 10.8 nm⁻² en {110}. Por eso los metales fcc se deforman deslizando sobre los planos {111} en las direcciones ⟨110⟩, y las superficies (111) son las más estables.</p></div>
<div class="sim" data-sim="miller" data-title="Planos (hkl) y direcciones [uvw] en una celda cúbica"></div>
<div class="sim-guide"><ul>
<li>Elija los índices: se dibujan todos los planos de la familia que cortan la celda y la normal \([hkl]\). La lectura da \(d_{hkl}\) y el ángulo con el plano (100).</li>
<li>Pruebe (200) frente a (100): son paralelos, pero (200) tiene el doble de planos. En una red fcc o bcc solo algunos aparecen en la difracción (capítulo 4).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule la fracción de empaquetamiento de las redes sc, bcc y fcc con esferas que se tocan a primeros vecinos.
<details><summary>Respuesta</summary><p>sc: \(\pi/6=0.524\); bcc: \(\sqrt3\pi/8=0.680\); fcc: \(\sqrt2\pi/6=0.740\).</p></details></li>
<li><span class="lvl">Básico</span>El hierro α es bcc con \(a=2.867\) Å. Calcule su densidad y la distancia entre vecinos más próximos.
<details><summary>Respuesta</summary><p>\(\rho=2\times55.85/(N_Aa^3)=7.87\) g/cm³; \(d=\sqrt3a/2=2.483\) Å.</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que los vectores \(\vb a_1=\tfrac a2(0,1,1)\), \(\vb a_2=\tfrac a2(1,0,1)\), \(\vb a_3=\tfrac a2(1,1,0)\) generan la red fcc y que la celda primitiva tiene volumen \(a^3/4\). ¿Qué ángulo forman?
<details><summary>Respuesta</summary><p>Las combinaciones enteras dan todas las esquinas y centros de caras del cubo. \(V=|\vb a_1\cdot(\vb a_2\times\vb a_3)|=a^3/4\). El ángulo entre dos de ellos es 60°: la celda primitiva fcc es un romboedro de 60°.</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que en la hcp ideal \(c/a=\sqrt{8/3}\).
<details><summary>Respuesta</summary><p>Un átomo de la capa B está sobre el centro de un triángulo de la capa A, a distancia horizontal \(a/\sqrt3\) de sus vértices. Si toca a los tres: \((a/\sqrt3)^2+(c/2)^2=a^2\), de donde \(c/2=a\sqrt{2/3}\).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre la restricción cristalográfica en dos dimensiones con un argumento geométrico: si \(A\) y \(B\) son puntos de red a distancia mínima \(a\), al rotar \(B\) alrededor de \(A\) un ángulo \(\theta\) y \(A\) alrededor de \(B\) un ángulo \(-\theta\) se obtienen dos puntos de red cuya distancia es \(a(1-2\cos\theta)\). ¿Qué ángulos sobreviven?
<details><summary>Respuesta</summary><p>La distancia debe ser un múltiplo entero \(ma\) de \(a\): \(1-2\cos\theta=m\), \(\cos\theta=(1-m)/2\in[-1,1]\) da \(m=-1,0,1,2,3\) y \(\theta=0°,60°,90°,120°,180°\): órdenes 1, 6, 4, 3 y 2.</p></details></li>
</ol>
<div class="box note"><h4>Para profundizar</h4><p>Kittel, cap. 1; Ashcroft y Mermin, cap. 4 y 7. M. De Graef y M. E. McHenry, <em>Structure of Materials</em>, 2.ª ed., Cambridge, 2012. T. Hahn (ed.), <em>International Tables for Crystallography</em>, vol. A, 2006. A. Togo e I. Tanaka, «Spglib: a software library for crystal symmetry search», arXiv:1808.01590 (2018).</p></div>
