<template class="chapter-src" data-id="calor" data-num="8" data-title="Calor específico de la red" data-part="Parte II · Vibraciones de la red" data-short="Ley de Dulong y Petit y su fracaso a baja temperatura, modelo de Einstein, modelo de Debye y ley T³, temperaturas de Debye, contribución electrónica γT, temperatura de Debye efectiva y densidad de estados real">
<p class="lead">En 1819 Pierre Dulong y Alexis Petit observaron que el calor específico molar de casi todos los sólidos a temperatura ambiente es el mismo, unos 25 J/(mol·K). La física clásica lo explicó, pero no pudo explicar por qué el diamante tenía apenas una cuarta parte de ese valor, ni por qué todos los calores específicos se desploman al enfriar. La respuesta de Einstein (1907), uno de los primeros éxitos de la teoría cuántica fuera de la radiación, y su refinamiento por Debye (1912), son el tema de este capítulo.</p>

<section>
<h2>La ley de Dulong y Petit</h2>
<p>Un sólido de \(N\) átomos tiene \(3N\) modos normales, osciladores armónicos independientes. Clásicamente cada uno tiene energía media \(k_BT\) (\(\tfrac12k_BT\) cinética y \(\tfrac12k_BT\) potencial), así que \(U=3Nk_BT\) y</p>
<div class="eq key" data-name="Dulong–Petit">\[C_V=3Nk_B=3R=24.94\ \text{J mol}^{-1}\text{K}^{-1}.\]</div>
<p>Funciona bien a temperatura ambiente para el cobre (24.4), el aluminio (24.2) o el plomo (26.4), pero el diamante tiene 6.1, el silicio 20.0 y el berilio 16.4. Y a temperaturas bajas todos los calores específicos tienden a cero, como exige además el tercer principio de la termodinámica. La clave es la cuantización: un oscilador de frecuencia \(\omega\) apenas se excita si \(k_BT\ll\hbar\omega\).</p>
</section>

<section>
<h2>El modelo de Einstein</h2>
<p>Einstein supuso que los \(3N\) osciladores tienen la misma frecuencia \(\omega_E\) y usó la energía media cuántica \(\hbar\omega_E/(\ee^{\hbar\omega_E/k_BT}-1)\) (sin la de punto cero, que no depende de \(T\)). Derivando,</p>
<div class="eq key" data-name="Calor específico de Einstein">\[C_V=3Nk_B\,\frac{x^2\ee^x}{(\ee^x-1)^2},\qquad x=\frac{\theta_E}{T},\quad \theta_E=\frac{\hbar\omega_E}{k_B}.\]</div>
<p>Para \(T\gg\theta_E\) se recupera Dulong–Petit; para \(T\ll\theta_E\) el calor específico cae como \(\ee^{-\theta_E/T}\). Con \(\theta_E=1320\) K, Einstein ajustó razonablemente los datos del diamante de Heinrich Weber. Pero la caída exponencial es demasiado brusca: a baja temperatura los datos de todos los sólidos aislantes siguen una ley \(T^3\). El modelo ignora que las vibraciones de longitud de onda larga (el sonido) tienen frecuencias arbitrariamente bajas y se excitan a cualquier temperatura. El modelo de Einstein sigue siendo útil para describir las ramas ópticas, casi planas.</p>
</section>

<section>
<h2>El modelo de Debye</h2>
<p>Peter Debye reemplazó el espectro real por el de un medio elástico continuo, \(\omega=vq\), con tres ramas acústicas de velocidad media \(v\), y cortó el espectro en una frecuencia \(\omega_D\) elegida para que haya exactamente \(3N\) modos. La densidad de estados es \(g(\omega)=9N\omega^2/\omega_D^3\) para \(\omega<\omega_D\), con \(\omega_D=v(6\pi^2n)^{1/3}\) y \(n=N/V\). La energía térmica y el calor específico resultan</p>
<div class="eq key" data-name="Calor específico de Debye">\[C_V=9Nk_B\left(\frac T{\theta_D}\right)^3\int_0^{\theta_D/T}\frac{x^4\ee^x}{(\ee^x-1)^2}\,\dd x,\qquad \theta_D=\frac{\hbar\omega_D}{k_B}.\]</div>
<p>A temperatura alta la integral vale \((\theta_D/T)^3/3\) y se recupera \(3Nk_B\). A temperatura baja el límite superior se va a infinito, la integral vale \(4\pi^4/15\), y se obtiene la <span class="term">ley \(T^3\) de Debye</span>:</p>
<div class="eq key" data-name="Ley T³">\[C_V\simeq\frac{12\pi^4}{5}Nk_B\left(\frac T{\theta_D}\right)^3=1944\left(\frac T{\theta_D}\right)^3\ \text{J mol}^{-1}\text{K}^{-1}.\]</div>
<p>Este límite es exacto para cualquier sólido, no solo para el modelo, porque a baja temperatura solo se excitan los fonones acústicos de longitud de onda larga, que siempre son lineales. En la práctica se cumple bien por debajo de \(\theta_D/50\). La temperatura de Debye mide la «dureza» de la red: es alta en sólidos ligeros y rígidos y baja en los pesados y blandos.</p>

<div class="box ex"><h4>El diamante a temperatura ambiente</h4><p>Con \(\theta_D=2230\) K (de las mediciones a baja temperatura), a 300 K se tiene \(T/\theta_D=0.135\) y la fórmula de Debye da \(C_V=4.1\) J/(mol·K), muy por debajo de Dulong–Petit; el valor medido es 6.1. El desacuerdo indica que una sola \(\theta_D\) no describe todo el intervalo: a 300 K el valor que reproduce la medición es \(\theta_D\approx1870\) K. Esta dependencia de la temperatura efectiva es la huella de que la densidad de estados real no es una parábola.</p></div>

<section>
<h2>La contribución de los electrones</h2>
<p>En un metal los electrones de conducción también contribuyen al calor específico, pero mucho menos de lo que predice la física clásica: solo los electrones a una distancia \(k_BT\) de la energía de Fermi pueden excitarse (capítulo 11). Su contribución es lineal, \(C_{el}=\gamma T\). A baja temperatura el calor específico de un metal es</p>
<div class="eq key" data-name="Calor específico de un metal">\[C=\gamma T+\beta T^3,\qquad \frac CT=\gamma+\beta T^2 .\]</div>
<p>Una gráfica de \(C/T\) frente a \(T^2\) es una recta: la ordenada en el origen da \(\gamma\) (la densidad de estados en el nivel de Fermi) y la pendiente da \(\beta=1944/\theta_D^3\). En el cobre, \(\gamma=0.695\) mJ/(mol·K²) y \(\beta=0.0482\) mJ/(mol·K⁴): las dos contribuciones son iguales a 3.8 K, y por debajo domina la electrónica. A temperatura ambiente, en cambio, la contribución electrónica es apenas el 1 % del total.</p>

</section>

<section>
<h2>Temperatura de Debye efectiva y densidad de estados real</h2>
<p>Si para cada temperatura se busca la \(\theta_D\) que reproduce el calor específico medido, se obtiene una función \(\theta_D(T)\) que no es constante: suele bajar un 5–10 % hacia \(\theta_D/10\) y volver a subir. La razón es que la densidad de estados real tiene picos de van Hove y no crece como \(\omega^2\) hasta un corte abrupto (capítulo 7). A temperatura alta el calor específico depende solo del segundo momento de \(g(\omega)\), y a baja del coeficiente de \(\omega^2\); la temperatura de Debye efectiva interpola entre ambos. A presión constante, además, \(C_P-C_V=9\alpha^2BVT\), con \(\alpha\) el coeficiente de dilatación lineal (capítulo 9), lo que hace que los datos de \(C_P\) superen el límite de Dulong–Petit a temperaturas altas.</p>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule el calor específico molar del aluminio (\(\theta_D=428\) K) a 10 K con la ley \(T^3\). ¿Cuánto aportan los electrones (\(\gamma=1.35\) mJ/mol·K²)?
<details><summary>Respuesta</summary><p>Red: \(1944\times(10/428)^3=0.0248\) J/(mol·K). Electrones: 0.0135 J/(mol·K), más de la mitad de la red.</p></details></li>
<li><span class="lvl">Básico</span>Demuestre que el modelo de Einstein da \(C_V\approx3R[1-\tfrac1{12}(\theta_E/T)^2]\) a temperatura alta.
<details><summary>Respuesta</summary><p>Con \(x\) pequeño, \(x^2\ee^x/(\ee^x-1)^2=(x/2)^2/\senh^2(x/2)\approx1-x^2/12\).</p></details></li>
<li><span class="lvl">Intermedio</span>Deduzca la ley \(T^3\) usando \(\int_0^\infty x^4\ee^x/(\ee^x-1)^2\dd x=4\pi^4/15\).
<details><summary>Respuesta</summary><p>\(C_V=9Nk_B(T/\theta_D)^3\cdot4\pi^4/15=\tfrac{12\pi^4}5Nk_B(T/\theta_D)^3\). Con \(N=N_A\): \(\tfrac{12\pi^4}5R=1944\) J/(mol·K).</p></details></li>
<li><span class="lvl">Intermedio</span>Calcule la energía de punto cero de un mol de cobre en el modelo de Debye.
<details><summary>Respuesta</summary><p>\(\int\tfrac12\hbar\omega\,g\,\dd\omega=\tfrac98N\hbar\omega_D=\tfrac98R\theta_D=3.2\) kJ/mol, el 0.9 % de la energía de cohesión.</p></details></li>
<li><span class="lvl">Avanzado</span>Para una red bidimensional (grafeno, capas de un cristal laminar) demuestre que el calor específico de Debye a baja temperatura es proporcional a \(T^2\). ¿Y para una cadena?
<details><summary>Respuesta</summary><p>En \(d\) dimensiones \(g(\omega)\propto\omega^{d-1}\) y \(U\propto\int\omega^d/(\ee^{\hbar\omega/k_BT}-1)\dd\omega\propto T^{d+1}\): \(C\propto T^d\). En 2D, \(T^2\); en 1D, \(T\).</p></details></li>
</ol>
