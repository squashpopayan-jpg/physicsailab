<template class="chapter-src" data-id="fonones" data-num="7" data-title="Fonones en tres dimensiones" data-part="Parte II · Vibraciones de la red" data-short="Matriz dinámica, ramas longitudinales y transversales, el cobre con fuerzas centrales, densidad de estados y singularidades de van Hove, cuantización y fonones, ocupación de Bose–Einstein, desplazamiento cuadrático medio y criterio de Lindemann, dispersión inelástica de neutrones y momento cristalino">
<p class="lead">En tres dimensiones cada átomo puede moverse en tres direcciones, y para cada vector de onda hay tres modos (o \(3s\) si la celda tiene \(s\) átomos) con polarizaciones distintas. Este capítulo generaliza la cadena a un cristal real, calcula la relación de dispersión del cobre con un modelo de una sola constante y la compara con la medición, introduce la densidad de estados de vibración y cuantiza los modos: los fonones. Termina con la técnica que mide todo esto, la dispersión inelástica de neutrones.</p>

<section>
<h2>La matriz dinámica</h2>
<p>Sea \(\vb u(\vb R)\) el desplazamiento del átomo en el sitio \(\vb R\) de una red de Bravais. En la aproximación armónica la energía potencial es \(U=\tfrac12\sum_{\vb R\vb R'}\vb u(\vb R)\cdot\mathsf\Phi(\vb R-\vb R')\cdot\vb u(\vb R')\), con \(\mathsf\Phi\) la matriz de constantes de fuerza. Buscando soluciones \(\vb u=\vb e\,\ee^{\ii(\vb q\cdot\vb R-\omega t)}\) se obtiene un problema de autovalores de \(3\times3\):</p>
<div class="eq key" data-name="Matriz dinámica">\[M\omega^2\,\vb e=\mathsf D(\vb q)\,\vb e,\qquad \mathsf D(\vb q)=\sum_{\vb R}\mathsf\Phi(\vb R)\,\ee^{-\ii\vb q\cdot\vb R}.\]</div>
<p>Para cada \(\vb q\) hay tres frecuencias \(\omega_s(\vb q)\) y tres vectores de polarización \(\vb e_s\) ortogonales. En direcciones de alta simetría uno es paralelo a \(\vb q\) (modo <span class="term">longitudinal</span>, L) y dos perpendiculares (modos <span class="term">transversales</span>, T); en general son mezclas. Con fuerzas centrales de constante \(C\) entre primeros vecinos, que se encuentran en las posiciones \(\vb\delta\),</p>
<div class="eq">\[\mathsf D(\vb q)=C\sum_{\vb\delta}\left[1-\cos(\vb q\cdot\vb\delta)\right]\uv\delta\,\uv\delta .\]</div>
<p>En la red fcc con este modelo, en el punto X las frecuencias son \(\omega_L=\sqrt{8C/M}\) y \(\omega_T=\sqrt{4C/M}\), una razón de \(\sqrt2\). En el cobre los neutrones dan 7.25 y 5.13 THz en X, razón 1.41: el modelo de una sola constante, ajustada con \(C=27.4\) N/m, reproduce el cociente y da en el punto L 7.25 y 3.62 THz frente a 7.30 y 3.43 medidos. También predice la velocidad del sonido transversal en [100], 2911 m/s, igual a \(\sqrt{C_{44}/\rho}=2906\) m/s de las constantes elásticas medidas.</p>
<p>Si la celda tiene \(s\) átomos, \(\mathsf D\) es de \(3s\times3s\) y aparecen \(3s-3\) ramas ópticas, que en \(\vb q=0\) tienen frecuencia finita. En el silicio, con dos átomos iguales por celda, el modo óptico de \(\Gamma\) está a 15.5 THz (520 cm⁻¹), la línea que se ve en todo espectro Raman de silicio.</p>
<div class="sim" data-sim="fonones-fcc" data-title="Dispersión de fonones de un metal fcc con fuerzas centrales"></div>
<div class="sim-guide"><ul>
<li>Curvas del modelo de fuerzas centrales a primeros (y opcionalmente segundos) vecinos, ajustado al cobre. Los puntos son las frecuencias medidas por dispersión de neutrones en X y L (Svensson, Brockhouse y Rowe, 1967).</li>
<li>Agregue la constante de segundos vecinos: las ramas transversales en L bajan y se acercan a la medición.</li>
</ul></div>
</section>

<section>
<h2>Densidad de estados de vibración</h2>
<p>La <span class="term">densidad de estados</span> \(g(\omega)\,\dd\omega\) cuenta los modos con frecuencia entre \(\omega\) y \(\omega+\dd\omega\). Como en la zona de Brillouin hay \(N\) vectores \(\vb q\) uniformemente distribuidos,</p>
<div class="eq key" data-name="Densidad de estados">\[g(\omega)=\frac{V}{(2\pi)^3}\sum_s\int_{\omega_s(\vb q)=\omega}\frac{\dd S}{|\nabla_{\vb q}\omega_s|},\]</div>
<p>una integral sobre la superficie de frecuencia constante, pesada por la inversa de la velocidad de grupo. Donde la velocidad de grupo se anula (máximos, mínimos y puntos de silla de \(\omega(\vb q)\)) la densidad tiene singularidades: las <span class="term">singularidades de van Hove</span> (1953), que en tres dimensiones son quiebres con pendiente infinita. A frecuencias bajas, donde \(\omega=v\,q\), la densidad crece como \(\omega^2\): \(g(\omega)=V\omega^2/(2\pi^2)\sum_s v_s^{-3}\). Esta forma, extrapolada a toda la zona, es el modelo de Debye del capítulo 8.</p>
<div class="sim" data-sim="dos-fonones" data-title="Densidad de estados de fonones: histograma sobre la zona de Brillouin"></div>
<div class="sim-guide"><ul>
<li>Se diagonaliza la matriz dinámica en una malla uniforme de la zona y se hace un histograma. Aumente la malla: aparecen los picos de van Hove de las ramas transversales y longitudinal.</li>
<li>La parábola es la aproximación de Debye con las mismas velocidades del sonido; solo coincide a frecuencias bajas.</li>
</ul></div>
</section>

<section>
<h2>Cuantización: fonones</h2>
<p>Los modos normales son osciladores armónicos independientes. Al cuantizarlos, el modo \((\vb q,s)\) tiene energías \((n_{\vb qs}+\tfrac12)\hbar\omega_s(\vb q)\) con \(n\) entero. Se dice que hay \(n\) <span class="term">fonones</span> en ese modo. Los fonones son bosones sin conservación de número: en equilibrio térmico su ocupación media es la de Bose–Einstein con potencial químico cero,</p>
<div class="eq key" data-name="Ocupación de Bose–Einstein">\[\langle n\rangle=\frac1{\ee^{\hbar\omega/k_BT}-1}.\]</div>
<p>A temperaturas altas \(\langle n\rangle\approx k_BT/\hbar\omega\) y cada modo tiene energía \(k_BT\), el resultado clásico de equipartición; a temperaturas bajas los modos con \(\hbar\omega\gg k_BT\) se «congelan». Incluso a cero absoluto queda la energía de punto cero \(\tfrac12\hbar\omega\) por modo: los átomos nunca están quietos. El desplazamiento cuadrático medio de un átomo, en el modelo de Debye, es</p>
<div class="eq">\[\langle u^2\rangle=\frac{9\hbar^2}{Mk_B\theta_D}\left[\frac14+\left(\frac T{\theta_D}\right)^2\int_0^{\theta_D/T}\frac{x\,\dd x}{\ee^x-1}\right]\;\xrightarrow{T\gg\theta_D}\;\frac{9\hbar^2T}{Mk_B\theta_D^2}.\]</div>
<div class="box ex"><h4>El criterio de Lindemann en el cobre</h4><p>Frederick Lindemann propuso en 1910 que un sólido funde cuando la amplitud de vibración alcanza una fracción fija, cerca del 10 %, de la distancia entre vecinos. Para el cobre (\(\theta_D=343\) K) a su temperatura de fusión de 1358 K, \(\sqrt{\langle u^2\rangle}=0.28\) Å, el 11 % de los 2.56 Å entre vecinos. A cero absoluto la amplitud de punto cero es 0.071 Å. En el helio, muy liviano y débilmente ligado, la amplitud de punto cero es tan grande que impide la solidificación sin presión.</p></div>
<div class="sim" data-sim="bose" data-title="Ocupación de los modos y amplitud de vibración"></div>

</section>

<section>
<h2>Medición: dispersión inelástica de neutrones</h2>
<p>Un neutrón térmico tiene energía de unas decenas de meV, como un fonón, y longitud de onda de ángstroms, como un vector de la red recíproca: es la sonda ideal. Al atravesar el cristal puede crear o absorber un fonón, conservando la energía y el momento cristalino:</p>
<div class="eq key" data-name="Conservación en la dispersión de neutrones">\[\frac{\hbar^2k^2}{2m_n}-\frac{\hbar^2k'^2}{2m_n}=\pm\hbar\omega_s(\vb q),\qquad \vb k-\vb k'=\vb Q=\pm\vb q+\vb G .\]</div>
<p>En un espectrómetro de tres ejes (Brockhouse, Premio Nobel 1994) se fijan \(\vb k\) y \(\vb k'\) con monocromadores y analizadores de cristal, y se barre \(\omega\) a \(\vb Q\) fijo: cada pico de intensidad es un fonón. Para la luz, en cambio, el vector de onda es miles de veces menor que el tamaño de la zona, y la dispersión Raman (fonones ópticos) y Brillouin (acústicos) solo ve modos con \(\vb q\approx0\).</p>
<p>La cantidad \(\hbar\vb q\) se llama <span class="term">momento cristalino</span>. No es un momento verdadero (un fonón no transporta momento neto salvo en \(\vb q=0\)), pero se conserva módulo un vector de la red recíproca, porque el cristal es invariante ante traslaciones discretas. Los procesos con \(\vb G\neq0\) se llaman <span class="term">umklapp</span>, y son los que limitan la conducción del calor (capítulo 9).</p>

<li>Donde la curva de barrido cruza la dispersión hay un pico en el detector.</li>

</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Cuántas ramas de fonones tiene el GaAs y cuántas son ópticas? ¿Y el YBa₂Cu₃O₇, con 13 átomos por celda?
<details><summary>Respuesta</summary><p>GaAs: 6 ramas (3 acústicas, 3 ópticas). YBCO: 39 ramas, 36 ópticas.</p></details></li>
<li><span class="lvl">Básico</span>Calcule el número medio de fonones de un modo de 5 THz a 77 K y a 300 K.
<details><summary>Respuesta</summary><p>\(\hbar\omega=20.7\) meV. A 77 K, \(\hbar\omega/k_BT=3.12\) y \(\langle n\rangle=0.046\); a 300 K, 0.80 y \(\langle n\rangle=0.81\).</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que con fuerzas centrales a primeros vecinos en la red fcc, \(\omega_L(X)=\sqrt{8C/M}\) y \(\omega_T(X)=\sqrt{4C/M}\).
<details><summary>Respuesta</summary><p>En X, \(\vb q=\tfrac{2\pi}a(0,1,0)\) y \(\vb q\cdot\vb\delta=\pi\) para los 8 vecinos con componente \(y\) no nula, 0 para los otros 4. La suma de \(2\,\uv\delta\uv\delta\) sobre esos 8 da \(D_{yy}=8C\) y \(D_{xx}=D_{zz}=4C\).</p></details></li>
<li><span class="lvl">Intermedio</span>Un neutrón de 25 meV crea un fonón de 10 meV. ¿Cuál es la energía y el número de onda del neutrón dispersado?
<details><summary>Respuesta</summary><p>15 meV; \(k=\sqrt{2m_nE}/\hbar\): de 3.47 Å⁻¹ pasa a 2.69 Å⁻¹.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que a baja frecuencia \(g(\omega)=\frac{V\omega^2}{2\pi^2}\left(\frac1{v_L^3}+\frac2{v_T^3}\right)\) para un sólido isótropo.
<details><summary>Respuesta</summary><p>Cada rama con \(\omega=v_sq\) contribuye \(V\cdot4\pi q^2\dd q/(2\pi)^3=V\omega^2\dd\omega/(2\pi^2v_s^3)\); hay una longitudinal y dos transversales.</p></details></li>
</ol>
