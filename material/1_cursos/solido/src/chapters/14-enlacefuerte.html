<p class="lead">El modelo de electrones casi libres parte de ondas planas y les agrega el potencial. El de enlace fuerte hace lo contrario: parte de los orbitales de átomos aislados y deja que los electrones salten de un átomo a su vecino. Es la descripción natural de las bandas estrechas (las d de los metales de transición, las f de las tierras raras), de los enlaces covalentes y de materiales como el grafeno, y es el lenguaje de la física moderna de los materiales topológicos.</p>

<section>
<h2>Sumas de Bloch y la cadena</h2>
<p>Sea \(\phi(\vb r)\) un orbital atómico de energía \(\varepsilon_0\). En un cristal con un átomo por celda se forman las <span class="term">sumas de Bloch</span></p>
<div class="eq">\[\psi_{\vb k}(\vb r)=\frac1{\sqrt N}\sum_{\vb R}\ee^{\ii\vb k\cdot\vb R}\phi(\vb r-\vb R),\]</div>
<p>que cumplen el teorema de Bloch por construcción. Si los orbitales de sitios distintos son casi ortogonales y solo hay elementos de matriz \(-t\) entre vecinos (la <span class="term">integral de salto</span>), la energía es</p>
<div class="eq key" data-name="Enlace fuerte">\[E(\vb k)=\varepsilon_0-\sum_{\vb\delta}t(\vb\delta)\,\ee^{\ii\vb k\cdot\vb\delta}.\]</div>
<p>En una cadena de período \(a\) con salto \(t\) a primeros vecinos y \(t'\) a segundos, \(E(k)=\varepsilon_0-2t\cos ka-2t'\cos2ka\). La banda tiene ancho \(W=4t\) (con \(t'=0\)): cada nivel atómico se abre en una banda tanto más ancha cuanto mayor es el solapamiento. Cerca del fondo, \(E\approx\varepsilon_0-2t+ta^2k^2\): el electrón se mueve como una partícula libre con <span class="term">masa efectiva</span></p>
<div class="eq key" data-name="Masa efectiva de enlace fuerte">\[m^*=\frac{\hbar^2}{2ta^2},\]</div>
<p>grande si los saltos son débiles. Una banda d con \(t=0.3\) eV y \(a=2.5\) Å tiene \(m^*=2.0\,m\); una banda f, con saltos diez veces menores, masas de decenas a cientos de \(m\): los «fermiones pesados».</p>
<div class="sim" data-sim="tb-cadena" data-title="Cadena de enlace fuerte: dispersión, masa efectiva y densidad de estados"></div>
<div class="sim-guide"><ul>
<li>La banda \(E(k)\) con saltos a primeros y segundos vecinos, su densidad de estados (histograma de 20 000 valores de \(k\)) y la parábola de masa efectiva en el fondo.</li>
<li>Con \(t'\neq0\) la banda se vuelve asimétrica y el mínimo puede desplazarse fuera de \(k=0\).</li>
</ul></div>
</section>

<section>
<h2>Red cuadrada: superficie de Fermi y van Hove</h2>
<p>En una red cuadrada, \(E(\vb k)=-2t(\cos k_xa+\cos k_ya)\), con ancho \(8t\). La densidad de estados tiene forma exacta en términos de la integral elíptica completa:</p>
<div class="eq key" data-name="DOS de la red cuadrada">\[g(E)=\frac1{2\pi^2t}\,K\!\left(1-\frac{E^2}{16t^2}\right),\]</div>
<p>por sitio y por espín, con una divergencia logarítmica en \(E=0\): la <span class="term">singularidad de van Hove</span> de los puntos de silla \((\pi/a,0)\) y \((0,\pi/a)\). A media ocupación la superficie de Fermi es un cuadrado girado 45° que une esos puntos: está <span class="term">anidada</span>, porque un solo vector \((\pi/a,\pi/a)\) traslada sus lados unos sobre otros. Ese anidamiento favorece inestabilidades (ondas de densidad de carga y de espín) y es una pieza clave en la física de los cupratos superconductores, cuyos planos CuO₂ se describen con este modelo.</p>
<div class="sim" data-sim="tb-cuadrada" data-title="Red cuadrada: contornos de energía, superficie de Fermi y densidad de estados"></div>
<div class="sim-guide"><ul>
<li>Mapa de \(E(\vb k)\) en la primera zona con el contorno de Fermi para la ocupación elegida. A la derecha la densidad de estados exacta (fórmula elíptica) y el área ocupada.</li>
<li>Con \(t'\neq0\) (salto a segundos vecinos) la singularidad se desplaza y la superficie se curva, como en los cupratos reales.</li>
</ul></div>
</section>

<section>
<h2>El grafeno</h2>
<p>El grafeno es una lámina de átomos de carbono en panal de abejas: una red hexagonal con dos átomos por celda, A y B, cada uno rodeado de tres vecinos del otro tipo a \(a=1.42\) Å. Los orbitales \(p_z\) forman las bandas π. Con salto \(t\approx2.7\) eV entre vecinos, el hamiltoniano de \(2\times2\) en la base de las dos subredes tiene elementos fuera de la diagonal \(-tf(\vb k)\), con \(f(\vb k)=\sum_{j=1}^3\ee^{\ii\vb k\cdot\vb\delta_j}\), y</p>
<div class="eq key" data-name="Bandas del grafeno">\[E_\pm(\vb k)=\pm t\,|f(\vb k)| .\]</div>
<p>Las dos bandas se tocan en los vértices K y K′ de la zona de Brillouin, donde \(f=0\). Alrededor de esos puntos la dispersión es lineal, \(E=\pm\hbar v_F|\vb q|\), con \(v_F=3ta/2\hbar\approx9\times10^5\) m/s: los electrones se comportan como partículas de Dirac sin masa, con la velocidad de la luz reemplazada por \(v_F\). Con un electrón π por átomo la banda inferior está llena y el nivel de Fermi pasa exactamente por los <span class="term">conos de Dirac</span>; la densidad de estados se anula linealmente allí. Si las dos subredes son distintas, como en el nitruro de boro hexagonal, aparece un término de masa \(\pm\Delta\) en la diagonal y se abre una brecha \(2\Delta\) (unos 6 eV en el hBN).</p>
<div class="sim" data-sim="grafeno" data-title="Bandas π del grafeno y del nitruro de boro"></div>
<div class="sim-guide"><ul>
<li>Izquierda: mapa de la banda de conducción en la zona hexagonal, con los conos en los vértices K y K′. Centro: bandas a lo largo de Γ–M–K–Γ. Derecha: densidad de estados.</li>
<li>Agregue la asimetría de subred \(\Delta\): se abre una brecha en K y la densidad de estados desarrolla bordes de banda.</li>
</ul></div>
</section>

<section>
<h2>Topología: el modelo SSH</h2>
<p>Wu-Pei Su, Robert Schrieffer y Alan Heeger estudiaron en 1979 el poliacetileno, una cadena con enlaces alternadamente cortos y largos: saltos \(v\) dentro de la celda y \(w\) entre celdas. Las bandas son \(E=\pm|v+w\ee^{\ii ka}|\), con una brecha \(2|v-w|\). Las dos dimerizaciones, \(v>w\) y \(v<w\), tienen el mismo espectro en volumen pero son topológicamente distintas: al recorrer la zona de Brillouin, el vector \((v+w\cos ka,\,w\sen ka)\) da una vuelta alrededor del origen solo si \(w>v\). Ese <span class="term">número de enrollamiento</span> no puede cambiar sin cerrar la brecha. En una cadena finita con \(w>v\) aparecen dos <span class="term">estados de borde</span> de energía cero, localizados en los extremos y protegidos por la simetría quiral. Es el ejemplo más simple de la <span class="term">correspondencia volumen–borde</span> que explica los aislantes topológicos y el efecto Hall cuántico (capítulo 17).</p>
<div class="sim" data-sim="ssh" data-title="Cadena SSH: brecha, número de enrollamiento y estados de borde"></div>

<li>Izquierda: espectro de una cadena abierta de 40 sitios al variar \(v/w\); cuando \(v<w\) aparecen dos niveles en cero, separados del resto. Derecha: la curva \(h(k)\) y la densidad del estado de menor \(|E|\).</li>

</section>

<section>
<h2>Bandas d y la cohesión de los metales de transición</h2>
<p>En los metales de transición coexisten una banda s ancha (casi libre) y una banda d estrecha de 5 a 10 eV de ancho con capacidad para 10 electrones. Jacques Friedel (1969) modeló la banda d con una densidad de estados rectangular de ancho \(W\): la energía de enlace al llenarla con \(N_d\) electrones es \(E_{coh}=\tfrac{W}{20}N_d(10-N_d)\), una parábola con máximo en la mitad de la serie. Explica la forma de la energía de cohesión y de las temperaturas de fusión que se vio en el capítulo 5 (máximos en W, Mo, Re, Os), y la gran densidad de estados en el nivel de Fermi de Ni, Pd y Pt, responsable de su calor específico electrónico alto y, en el níquel, del ferromagnetismo (capítulo 27).</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule el ancho de banda y la masa efectiva en el fondo de una cadena con \(t=1\) eV y \(a=3\) Å.
<details><summary>Respuesta</summary><p>\(W=4\) eV; \(m^*=\hbar^2/(2ta^2)=0.42\,m\).</p></details></li>
<li><span class="lvl">Básico</span>Demuestre que en la red cúbica simple con salto \(t\), \(E=-2t(\cos k_xa+\cos k_ya+\cos k_za)\), el ancho es \(12t\) y la masa efectiva en Γ es isótropa.
<details><summary>Respuesta</summary><p>Mínimo \(-6t\) en Γ y máximo \(6t\) en R. Cerca de Γ, \(E\approx-6t+ta^2k^2\), igual en todas las direcciones.</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que \(f(\vb K)=0\) en el vértice \(\vb K=(4\pi/3\sqrt3a,0)\) del grafeno con vecinos \(\vb\delta_1=a(0,1)\), \(\vb\delta_{2,3}=a(\pm\sqrt3/2,-1/2)\).
<details><summary>Respuesta</summary><p>\(\vb K\cdot\vb\delta_1=0\), \(\vb K\cdot\vb\delta_{2,3}=\pm2\pi/3\): \(f=1+\ee^{2\pi\ii/3}+\ee^{-2\pi\ii/3}=0\).</p></details></li>
<li><span class="lvl">Intermedio</span>Desarrolle \(f(\vb K+\vb q)\) a primer orden en \(\vb q\) y deduzca \(v_F=3ta/2\hbar\).
<details><summary>Respuesta</summary><p>\(f\approx\ii\sum_j(\vb q\cdot\vb\delta_j)\ee^{\ii\vb K\cdot\vb\delta_j}=\tfrac{3a}2(q_x\pm\ii q_y)\) salvo una fase; \(|E|=\tfrac32ta|\vb q|\).</p></details></li>
<li><span class="lvl">Avanzado</span>Para la cadena SSH semiinfinita con \(w>v\), busque una solución de energía cero que solo ocupe la subred A y demuestre que decae como \((v/w)^n\).
<details><summary>Respuesta</summary><p>Con \(E=0\) las ecuaciones de la subred B dan \(v\,a_n+w\,a_{n+1}=0\): \(a_{n+1}=-(v/w)a_n\), normalizable si \(v<w\).</p></details></li>
</ol>
