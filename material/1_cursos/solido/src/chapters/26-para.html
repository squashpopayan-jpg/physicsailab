<p class="lead">Todos los materiales responden a un campo magnético, aunque la mayoría tan débilmente que no se nota. Los diamagnéticos se oponen al campo, los paramagnéticos lo refuerzan un poco y solo unos pocos se magnetizan espontáneamente. Este capítulo trata los dos primeros, en los que los momentos magnéticos no interactúan entre sí. Explica de dónde salen los momentos de los átomos, cómo se orientan con la temperatura y cómo se usan para llegar a temperaturas de milikelvin.</p>

<section>
<h2>Magnetización y susceptibilidad</h2>
<p>La magnetización \(\vb M\) es el momento magnético por unidad de volumen; en un medio lineal \(\vb M=\chi\vb H\), con la susceptibilidad adimensional \(\chi\) (en el SI). En los diamagnéticos \(\chi\) es negativa y pequeña: \(-9.6\times10^{-6}\) en el cobre, \(-9.0\times10^{-6}\) en el agua, \(-1.7\times10^{-4}\) en el bismuto. En los paramagnéticos es positiva: \(2.2\times10^{-5}\) en el aluminio, \(10^{-3}\) a \(10^{-2}\) en las sales de tierras raras a temperatura ambiente. En los ferromagnéticos (capítulo 27) puede superar \(10^5\). La energía de un momento \(\vb\mu\) en un campo \(\vb B\) es \(-\vb\mu\cdot\vb B\), y con \(\mu_B=e\hbar/2m=9.27\times10^{-24}\) J/T y \(B=1\) T vale 58 µeV, equivalente a 0.67 K: la agitación térmica a temperatura ambiente es cuatrocientas veces mayor.</p>
</section>

<section>
<h2>Diamagnetismo de Larmor</h2>
<p>Un campo magnético que aparece induce en los electrones de un átomo una corriente que, por la ley de Lenz, crea un momento opuesto: los electrones giran con la frecuencia de Larmor \(\omega_L=eB/2m\). Para \(N\) átomos por unidad de volumen con \(Z\) electrones cada uno,</p>
<div class="eq key" data-name="Diamagnetismo de Larmor">\[\chi=-\frac{\mu_0Ne^2Z}{6m}\langle r^2\rangle .\]</div>
<p>Todos los materiales tienen esta contribución, pero solo se ve sola en los átomos de capa cerrada (gases nobles, iones de los halogenuros alcalinos, moléculas orgánicas). Es independiente de la temperatura. Un campo suficientemente intenso y no uniforme puede hacer levitar un diamagnético: con 16 T, Andre Geim y Michael Berry hicieron levitar una rana (Premio Ig Nobel 2000), cuyo diamagnetismo es el del agua. Un superconductor es un diamagnético perfecto, \(\chi=-1\) (capítulo 29).</p>
</section>

<section>
<h2>Momentos atómicos y reglas de Hund</h2>
<p>Un átomo con capas incompletas tiene un momento magnético permanente, que proviene del espín y del momento orbital de los electrones: \(\vb\mu=-\mu_B(\vb L+2\vb S)\). Cuando el acoplamiento espín–órbita es débil frente a la repulsión electrónica, el estado fundamental lo fijan las <span class="term">reglas de Hund</span>:</p>
<ol>
<li>El espín total \(S\) es el máximo compatible con el principio de exclusión (los electrones ocupan orbitales distintos con espines paralelos, lo que reduce su repulsión).</li>
<li>Con ese \(S\), el momento orbital \(L\) es el máximo posible.</li>
<li>\(J=|L-S|\) si la capa está menos que medio llena y \(J=L+S\) si está más que medio llena.</li>
</ol>
<p>El momento efectivo en la dirección de \(\vb J\) es \(g\mu_B\vb J\) con el <span class="term">factor de Landé</span></p>
<div class="eq key" data-name="Factor de Landé">\[g=1+\frac{J(J+1)+S(S+1)-L(L+1)}{2J(J+1)},\qquad p=g\sqrt{J(J+1)} .\]</div>
<p>Para los iones trivalentes de tierras raras (capa 4f, bien protegida dentro del átomo) los valores de \(p\) calculados coinciden con los medidos: 7.94 frente a 8.0 en el Gd³⁺ (\(4f^7\), \({}^8S_{7/2}\)), 10.63 frente a 10.6 en el Dy³⁺. Las excepciones, Sm³⁺ y Eu³⁺, tienen niveles excitados de \(J\) muy cercanos. En los iones del grupo del hierro (capa 3d, la más externa) el campo eléctrico de los iones vecinos, el <span class="term">campo cristalino</span>, es más intenso que el acoplamiento espín–órbita y bloquea el momento orbital: el momento medido es el de solo espín, \(p=2\sqrt{S(S+1)}\). Esa <span class="term">extinción del momento orbital</span> explica, por ejemplo, que el Cr³⁺ tenga \(p=3.8\) (solo espín 3.87) en lugar de 0.77.</p>

</section>

<section>
<h2>Función de Brillouin y ley de Curie</h2>
<p>Un ion con momento angular \(J\) en un campo tiene \(2J+1\) niveles, \(E=m_Jg\mu_BB\). Promediando con los pesos de Boltzmann, la magnetización de \(N\) iones por unidad de volumen es</p>
<div class="eq key" data-name="Magnetización de Brillouin">\[M=Ng\mu_BJ\,B_J\!\left(\frac{g\mu_BJB}{k_BT}\right),\qquad B_J(x)=\frac{2J+1}{2J}\coth\frac{(2J+1)x}{2J}-\frac1{2J}\coth\frac x{2J}.\]</div>
<p>En campos altos o temperaturas bajas la magnetización se satura en \(Ng\mu_BJ\). En el límite opuesto \(B_J(x)\approx(J+1)x/3J\) y se obtiene la <span class="term">ley de Curie</span>:</p>
<div class="eq key" data-name="Ley de Curie">\[\chi=\frac{C}{T},\qquad C=\frac{\mu_0Np^2\mu_B^2}{3k_B}.\]</div>
<p>Para \(J\to\infty\) con \(g\mu_BJ\) fijo se recupera la función de Langevin de los momentos clásicos, \(\coth x-1/x\). Warren Henry (1952) midió la magnetización de sales de Cr³⁺, Fe³⁺ y Gd³⁺ hasta 1.3 K y 5 T: los datos caen exactamente sobre las funciones de Brillouin con \(J=S=3/2\), \(5/2\) y \(7/2\), una confirmación directa de la cuantización del espín.</p>
<div class="sim" data-sim="brillouin" data-title="Magnetización de un paramagneto: funciones de Brillouin"></div>

<li>Magnetización reducida \(M/M_s\) frente a \(B/T\) para varios \(J\) (con \(g=2\)), como en los datos de Henry, y el límite clásico de Langevin. La recta de Curie es la pendiente en el origen.</li>
</ul></div>
</section>

<section>
<h2>Electrones de conducción: Pauli y Landau</h2>
<p>Los electrones de un metal tienen momento de espín, pero la susceptibilidad no sigue la ley de Curie: solo los electrones cerca del nivel de Fermi pueden invertir el espín. Wolfgang Pauli (1927) mostró que la susceptibilidad es</p>
<div class="eq key" data-name="Paramagnetismo de Pauli">\[\chi_P=\mu_0\mu_B^2g(E_F),\]</div>
<p>independiente de la temperatura y unas cien veces menor que la de un gas clásico de los mismos momentos a temperatura ambiente. Para el sodio da \(8.3\times10^{-6}\). Los electrones libres tienen además un diamagnetismo orbital, el de Landau, \(\chi_L=-\chi_P/3\) (para \(m^*=m\)): consecuencia de la cuantización en niveles de Landau. En metales con densidad de estados alta en \(E_F\) (Pd, Pt), la interacción entre electrones refuerza mucho el paramagnetismo de Pauli (factor de Stoner), y en el Ni, el Co y el Fe lo lleva al ferromagnetismo.</p>
</section>

<section>
<h2>Desmagnetización adiabática</h2>
<p>La entropía de un sistema de momentos independientes depende solo de \(B/T\). Si se magnetiza una sal paramagnética a temperatura baja en un campo intenso, extrayendo el calor, y luego se la aísla y se reduce el campo, la entropía se conserva y la temperatura baja en la misma proporción que el campo, \(T_f=T_iB_f/B_i\). El límite lo pone el campo interno de las interacciones entre momentos, de 10 a 100 mT. Propuesta por Debye y Giauque en 1926, la <span class="term">desmagnetización adiabática</span> alcanzó 0.25 K en 1933 y hoy, con sales como el nitrato de cerio y magnesio (CMN), llega a unos milikelvin; con los momentos nucleares, mil veces menores, se llega a microkelvin.</p>

</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Aplique las reglas de Hund al Fe³⁺ (\(3d^5\)) y al Ce³⁺ (\(4f^1\)).
<details><summary>Respuesta</summary><p>Fe³⁺: \(S=5/2\), \(L=0\), \(J=5/2\), \({}^6S_{5/2}\), \(g=2\), \(p=5.92\). Ce³⁺: \(S=1/2\), \(L=3\), \(J=5/2\), \({}^2F_{5/2}\), \(g=6/7\), \(p=2.54\).</p></details></li>
<li><span class="lvl">Básico</span>¿A qué temperatura la energía Zeeman \(\mu_BB\) de un espín en 1 T iguala a \(k_BT\)?
<details><summary>Respuesta</summary><p>\(T=\mu_BB/k_B=0.67\) K.</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que para \(J=1/2\), \(B_{1/2}(x)=\tanh x\), y deduzca la ley de Curie con \(p^2=3\).
<details><summary>Respuesta</summary><p>Dos niveles \(\pm\mu_BB\): \(M=N\mu_B\tanh(\mu_BB/k_BT)\approx N\mu_B^2B/k_BT\). Con \(g=2\), \(J=1/2\): \(p^2=g^2J(J+1)=3\) y \(C=\mu_0N3\mu_B^2/3k_B\).</p></details></li>
<li><span class="lvl">Intermedio</span>Calcule la susceptibilidad de Pauli del potasio (\(n=1.40\times10^{22}\) cm⁻³, \(E_F=2.12\) eV).
<details><summary>Respuesta</summary><p>\(g(E_F)=3n/2E_F=6.19\times10^{46}\) J⁻¹m⁻³; \(\chi_P=\mu_0\mu_B^2g=6.7\times10^{-6}\).</p></details></li>
<li><span class="lvl">Avanzado</span>Una sal paramagnética con \(J=1/2\) se magnetiza a 1 K en 2 T y se desmagnetiza hasta un campo interno de 20 mT. ¿Qué temperatura alcanza? ¿Qué fracción de la entropía máxima \(R\ln2\) se extrajo en la magnetización?
<details><summary>Respuesta</summary><p>\(T_f=1\times0.02/2=10\) mK. Con \(x=\mu_BB/k_BT=1.34\): \(S/R=\ln(2\cosh x)-x\tanh x=0.24\), frente a \(\ln2=0.69\): se extrajo el 66 %.</p></details></li>
</ol>
