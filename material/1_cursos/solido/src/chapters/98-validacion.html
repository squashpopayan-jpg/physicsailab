<p class="lead">Todos los cálculos de las simulaciones salen de una biblioteca única: <code>src/core/29-lin.js</code> (autovalores, cuadraturas, raíces y funciones especiales), <code>30-ss.js</code> y <code>31-ss2.js</code> (la física del curso), más una tabla de factores de dispersión de rayos X generada una vez desde pymatgen y las tablas de datos del apéndice B. Un programa automático compara esa biblioteca con referencias independientes. Este apéndice explica el método y lista cada comprobación con su resultado.</p>

<section>
<h2>Método</h2>
<ol>
<li><b>SciPy, NumPy y mpmath</b> calculan de forma independiente, en Python: las integrales de Fermi–Dirac (como polilogaritmos de mpmath), las funciones gamma, zeta, elípticas, erfc y \(K_0\); los autovalores de matrices simétricas y hermíticas; las dispersiones de fonones de la red fcc y de la cadena diatómica; las integrales de Debye y la inversión de \(\theta_D\); la dilatación de Morse; el potencial químico del gas de electrones; los bordes de banda de Kronig–Penney (<code>brentq</code>); la ecuación central; la densidad de estados de la red cuadrada; el grafeno y la cadena SSH; la ecuación de Harper; el pseudopotencial empírico de Si, Ge y GaAs (programado de nuevo en NumPy); la neutralidad de carga con ionización incompleta; el campo y el potencial de la unión p–n por la primera integral exacta de Poisson–Boltzmann; el límite de Shockley–Queisser; los pozos cuánticos finitos; las funciones de Brillouin; el campo medio de Weiss y la brecha BCS, con y sin corte de Debye.</li>
<li><b>ASE, spglib y scipy.spatial</b>: spglib identifica el grupo espacial de las doce estructuras que genera el curso (exportadas por <code>tools/export_structs.js</code>); ASE construye las mismas estructuras y da las capas de vecinos, las fracciones de empaquetamiento, el volumen recíproco y los puntos especiales de su <code>bandpath</code>; la celda de Voronoi de la red recíproca (scipy.spatial) da los vértices, las caras y el volumen de las zonas de Brillouin; una suma directa independiente da las sumas de red de Lennard-Jones, y la calculadora de Lennard-Jones de ASE da la energía y el módulo del cristal.</li>
<li><b>pymatgen</b> calcula los patrones de difracción de polvo (<code>XRDCalculator</code>, Cu Kα) de trece estructuras, comparados pico a pico en posición e intensidad, las distancias interplanares de redes cúbicas y hexagonales, y las energías de Ewald (<code>EwaldSummation</code>) de las que salen las constantes de Madelung.</li>
<li><b>Soluciones numéricas contra exactas</b>: Kronig–Penney por la ecuación trascendente contra 301 ondas planas y contra diferencias finitas con extrapolación de Richardson; la banda de enlace fuerte como límite; la densidad de estados por histograma contra la fórmula elíptica; Debye contra la ley \(T^3\) y Dulong–Petit; Morse contra la dilatación anarmónica; Sommerfeld contra Fermi–Dirac exacto; el período y la amplitud de las oscilaciones de Bloch por Crank–Nicolson; el campo medio cerca de \(T_C\); el Ising por Monte Carlo contra Onsager; el campo de inversión de Stoner–Wohlfarth contra la astroide; Kramers–Kronig contra el oscilador de Lorentz; el modelo RSJ contra la solución analítica y los escalones de Shapiro; la localización de Anderson contra la fórmula de Thouless; Poisson contra la aproximación de agotamiento corregida.</li>
<li><b>Datos y literatura</b>: sumas de red y constantes de Madelung tabuladas; los parámetros de los gases nobles; las energías de red de Born–Mayer de los halogenuros alcalinos; densidades; la ley \(T^3\) y la \(\theta_D\) del cobre a partir de sus velocidades del sonido; los parámetros de Fermi, tiempos de relajación, \(\gamma\) y plasmones de Ashcroft–Mermin y Kittel; constantes CODATA; \(n_i\), brechas y \(N_{c,v}\) de Sze y Green; las resistividades de la norma ASTM F723; las brechas del pseudopotencial empírico; los momentos efectivos de Kittel; las relaciones de Lyddane–Sachs–Teller; Onsager, Bloch y BCS; y ejemplos de Callister.</li>
</ol>
<p>Los ejemplos resueltos y las respuestas de los problemas se calcularon con la misma biblioteca antes de escribirlos, y varios se corrigieron al no coincidir con el cálculo (por ejemplo, el borde de banda del peine de Dirac del capítulo 12, el radio de la órbita ciclotrón del 17, la temperatura intrínseca del 19 y la entropía extraída en la desmagnetización del 26).</p>
<div class="box note"><h4>Lo que enseñó la validación</h4><p>La comparación con referencias independientes encontró errores reales que ahora están corregidos. Los factores de forma antisimétricos de Cohen y Bergstresser van en las capas \(|\vb G|^2=3,4,11\) y no en \(3,8,11\) como los simétricos: con el error el GaAs salía con brecha indirecta. La búsqueda de vecinos usaba una tolerancia absoluta que fallaba con distancias en metros. La unión p–n asimétrica mostró que la aproximación de agotamiento se aparta un 40 % del campo exacto cuando la cola de portadores del lado muy dopado invade la zona de carga, y que la derivada numérica en la unión necesita una fórmula lateral porque \(\psi''\) salta. La comparación con datos también corrigió valores de tablas recordados de memoria: los parámetros de movilidad del silicio se reemplazaron por los de Masetti, que reproducen las resistividades de la norma ASTM, y se descartaron dos valores de plasmones de Kittel que no se pudieron confirmar.</p></div>
<div class="box warn"><h4>Lo que es ilustrativo</h4><p>Algunas simulaciones usan modelos simplificados y lo dicen: la conductividad térmica con el modelo de Callaway en la aproximación de Debye, la velocidad de saturación del GaAs, la recombinación del diodo, la emisión de los LED, el Hall cuántico (fenomenológico), la mariposa de Hofstadter dibujada con dos puntos \(\vb k\) por subbanda, la magnetización del estado mixto de tipo II, el color de las nanopartículas de oro sin transiciones interbanda y la cadena de Fibonacci. Reproducen la física y los órdenes de magnitud, no un material concreto.</p></div>
