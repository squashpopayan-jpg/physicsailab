<p class="lead">Todo el curso ha supuesto cristales perfectos. Los reales no lo son, y muchas de sus propiedades más útiles dependen de las imperfecciones: la difusión que permite dopar un chip o templar un acero, el color de una gema, la ductilidad de los metales, la resistencia residual a baja temperatura. Y cuando el desorden es fuerte, la física cambia de naturaleza: los electrones pueden quedar localizados aunque haya estados disponibles. Este capítulo cierra el curso con los defectos y con los sólidos sin periodicidad.</p>

<section>
<h2>Defectos puntuales</h2>
<p>Una <span class="term">vacancia</span> es un sitio de la red sin átomo; un <span class="term">intersticial</span>, un átomo fuera de los sitios de la red. Crear una vacancia cuesta una energía \(E_v\) de 0.5 a 3 eV, pero aumenta la entropía configuracional: hay \(N!/[n!(N-n)!]\) maneras de distribuir \(n\) vacancias. Minimizando la energía libre se obtiene la concentración de equilibrio</p>
<div class="eq key" data-name="Concentración de vacancias">\[\frac nN=\ee^{S_v/k_B}\,\ee^{-E_v/k_BT},\]</div>
<p>donde \(S_v\) es la entropía de vibración asociada (de 1 a 2 \(k_B\)). Los defectos son termodinámicamente inevitables. En el aluminio (\(E_v=0.67\) eV) el factor de Boltzmann da \(2.4\times10^{-4}\) a la temperatura de fusión; Simmons y Balluffi (1960), comparando la dilatación macroscópica con la de la red medida por rayos X, encontraron \(9.4\times10^{-4}\), lo que corresponde a una entropía de formación de unos \(1.4\,k_B\). En los cristales iónicos la neutralidad exige defectos en pares: un par de vacancias de catión y anión (<span class="term">defecto de Schottky</span>, en NaCl) o un ion desplazado a un intersticio (<span class="term">defecto de Frenkel</span>, en AgBr), con concentraciones \(\propto\ee^{-E/2k_BT}\).</p>
<div class="sim" data-sim="vacancias" data-title="Concentración de vacancias en equilibrio"></div>
<div class="sim-guide"><ul>
<li>Gráfica de Arrhenius de la fracción de vacancias de varios metales con sus energías de formación; los marcadores están en la temperatura de fusión de cada uno.</li>
</ul></div>
</section>

<section>
<h2>Difusión</h2>
<p>Los átomos se mueven por el cristal saltando a sitios vecinos vacantes. Cada salto requiere superar una barrera, con una frecuencia \(\Gamma\propto\nu\ee^{-E_m/k_BT}\), y la sucesión de saltos al azar es una caminata aleatoria con \(\langle r^2\rangle=6Dt\) y \(D=\Gamma a^2/6\) en tres dimensiones. Como también hace falta una vacancia vecina, el coeficiente de difusión sigue la ley de Arrhenius</p>
<div class="eq key" data-name="Difusión de Arrhenius">\[D=D_0\,\ee^{-Q/RT},\]</div>
<p>con la energía de activación \(Q\) igual a la de formación más la de migración. La segunda ley de Fick, \(\partial C/\partial t=D\,\partial^2C/\partial x^2\), con concentración superficial constante, da el perfil \(C(x,t)=C_s\,\text{erfc}(x/2\sqrt{Dt})\). Es el cálculo de la cementación de los aceros: el carbono en hierro γ a 1000 °C (\(D_0=2.3\times10^{-5}\) m²/s, \(Q=148\) kJ/mol, Callister) tiene \(D=1.9\times10^{-11}\) m²/s y penetra \(\sqrt{Dt}\approx0.26\) mm en una hora. El mismo cálculo fija los perfiles de dopaje por difusión del fósforo y el boro en el silicio.</p>
<div class="sim" data-sim="difusion" data-title="Caminata aleatoria y perfil de difusión"></div>
<div class="sim-guide"><ul>
<li>Izquierda: miles de átomos que saltan al azar en una red, todos partiendo de la superficie; la nube se ensancha como \(\sqrt t\). Derecha: el histograma de profundidades y la solución de Fick (la mitad de una gaussiana para una cantidad fija; erfc para concentración superficial constante).</li>
</ul></div>
</section>

<section>
<h2>Centros de color</h2>
<p>Los halogenuros alcalinos puros son transparentes, pero calentados en vapor del metal alcalino o irradiados se colorean: el NaCl se vuelve amarillo, el KCl violeta. El color lo da el <span class="term">centro F</span> (de <em>Farbe</em>, color): un electrón atrapado en una vacancia de anión. Es una partícula en una caja de tamaño comparable a la constante de red, y su energía de absorción baja con el tamaño de la caja. Mollwo (1931) e Ivey (1947) encontraron la regla empírica \(E_F\propto a^{-n}\) con \(n\approx1.8\), cercana al \(a^{-2}\) de una partícula en una caja. Los centros de color son los precursores de los defectos cuánticos de hoy: el centro de nitrógeno-vacancia del diamante es un espín aislado que se lee con luz y sirve como sensor cuántico.</p>
<div class="sim" data-sim="centros-f" data-title="Regla de Mollwo–Ivey de los centros F"></div>
<div class="sim-guide"><ul>
<li>Energía de absorción del centro F (Kittel, tabla 18.1) frente a la constante de red, en escala doblemente logarítmica, con el ajuste por mínimos cuadrados. El color de cada punto es el de la luz que absorbe.</li>
</ul></div>
</section>

<section>
<h2>Dislocaciones</h2>
<p>Un cristal perfecto debería resistir esfuerzos de corte del orden de \(G/2\pi\) (Frenkel, 1926), unos 7 GPa en el cobre; los metales reales fluyen con mil o diez mil veces menos. En 1934 Taylor, Orowan y Polanyi explicaron la diferencia con las <span class="term">dislocaciones</span>: defectos lineales que permiten deslizar un plano sobre otro moviendo una fila de átomos a la vez, como se mueve una alfombra empujando una arruga. Una dislocación se caracteriza por su <span class="term">vector de Burgers</span> \(\vb b\), el desplazamiento que falta para cerrar un circuito alrededor de ella; si \(\vb b\) es perpendicular a la línea la dislocación es <span class="term">de borde</span> (un semiplano extra de átomos), y si es paralelo, <span class="term">helicoidal</span>. La energía por unidad de longitud es del orden de \(Gb^2\). El endurecimiento de los metales por deformación, por aleación o por precipitados consiste en estorbar el movimiento de las dislocaciones; los semiconductores para chips, en cambio, se crecen casi sin ellas.</p>
<div class="sim" data-sim="dislocacion" data-title="Una dislocación de borde y su deslizamiento"></div>
<div class="sim-guide"><ul>
<li>Red con una dislocación de borde, con los desplazamientos de la teoría elástica isótropa. Mueva la dislocación: al atravesar el cristal, la mitad superior queda desplazada un vector de Burgers.</li>
<li>El circuito de Burgers (en rojo) no se cierra alrededor del núcleo; el vector que falta es \(\vb b\).</li>
</ul></div>
</section>

<section>
<h2>Localización de Anderson</h2>
<p>En un cristal perfecto los estados de Bloch se extienden por todo el sistema. Philip Anderson (1958) se preguntó qué pasa si las energías de los sitios son aleatorias, distribuidas en un ancho \(W\). Encontró que si el desorden es suficiente los estados quedan <span class="term">localizados</span>: decaen exponencialmente, \(|\psi|\sim\ee^{-|x|/\xi}\), y el sistema no conduce aunque haya estados en el nivel de Fermi. En una y dos dimensiones cualquier desorden localiza todos los estados; en tres hay un umbral, la <span class="term">transición de Anderson</span>. En la cadena de enlace fuerte con salto \(t\), la teoría de perturbaciones da \(\xi\approx24(4t^2-E^2)/W^2\) en unidades de la red (\(105t^2/W^2\) en el centro de la banda, por una anomalía), que el curso comprueba con el método de la matriz de transferencia. La localización explica la conducción por saltos de los semiconductores desordenados y amorfos, y se ha observado directamente con ondas de luz y de sonido y con átomos fríos (2008).</p>
<div class="sim" data-sim="anderson" data-title="Localización de Anderson en una cadena desordenada"></div>
<div class="sim-guide"><ul>
<li>Arriba: un autoestado de la cadena desordenada de 300 sitios, cerca de la energía elegida, en escala lineal y logarítmica. Abajo: la longitud de localización por matriz de transferencia frente a la fórmula perturbativa.</li>
<li>Con \(W\to0\) el estado se extiende por toda la cadena; al aumentar \(W\) se concentra en una región cada vez menor.</li>
</ul></div>
</section>

<section>
<h2>Cuasicristales</h2>
<p>En 1982 Dan Shechtman observó en una aleación de Al y Mn enfriada rápidamente un patrón de difracción con picos agudos y simetría de orden 10, prohibida para un cristal (capítulo 2). Era un <span class="term">cuasicristal</span>: orden de largo alcance sin periodicidad, como un mosaico de Penrose, que puede verse como un corte irracional de una red periódica de dimensión mayor. Shechtman recibió el Premio Nobel de Química en 2011, tras décadas de escepticismo. El ejemplo unidimensional es la <span class="term">cadena de Fibonacci</span>: dos tipos de enlace, A y B, ordenados según la regla de sustitución A → AB, B → A. Su espectro de electrones no es ni continuo (bandas) ni discreto (estados ligados), sino un conjunto de Cantor fractal: a cada generación cada banda se divide en tres.</p>
<div class="sim" data-sim="fibonacci" data-title="Espectro de la cadena de Fibonacci"></div>
<div class="sim-guide"><ul>
<li>Niveles de energía de una cadena de enlace fuerte con saltos \(t_A\) y \(t_B\) en el orden de Fibonacci, para varias generaciones. Con \(t_A=t_B\) se recupera la banda de la cadena periódica; al separarlos aparecen brechas a todas las escalas.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule la fracción de vacancias del cobre (\(E_v=1.28\) eV) a 1000 K y a 300 K, sin el factor de entropía.
<details><summary>Respuesta</summary><p>\(3.6\times10^{-7}\) a 1000 K y \(3\times10^{-22}\) a 300 K.</p></details></li>
<li><span class="lvl">Básico</span>¿Cuánto tarda el carbono en penetrar 1 mm en hierro γ a 1000 °C?
<details><summary>Respuesta</summary><p>Con \(x\approx\sqrt{Dt}\): \(t=x^2/D=(10^{-3})^2/1.9\times10^{-11}=5.1\times10^4\) s, unas 14 horas.</p></details></li>
<li><span class="lvl">Intermedio</span>Deduzca \(n/N=\ee^{-E_v/k_BT}\) minimizando \(F=nE_v-k_BT\ln[N!/n!(N-n)!]\) con la aproximación de Stirling.
<details><summary>Respuesta</summary><p>\(\partial F/\partial n=E_v-k_BT\ln[(N-n)/n]=0\Rightarrow n/(N-n)=\ee^{-E_v/k_BT}\approx n/N\).</p></details></li>
<li><span class="lvl">Intermedio</span>Con la regla de Mollwo–Ivey ajustada (\(E\approx60a^{-1.81}\) eV con \(a\) en Å), estime la energía del centro F del CsCl con estructura de NaCl hipotética de \(a=7.0\) Å.
<details><summary>Respuesta</summary><p>\(E\approx60\times7.0^{-1.81}=1.8\) eV (absorbe en el rojo, unos 700 nm).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que en la cadena de Anderson el número de sitios con peso apreciable en un estado localizado (inverso de la participación) es del orden de \(\xi\), y estime cuántos átomos abarca un estado en el centro de la banda con \(W=2t\).
<details><summary>Respuesta</summary><p>Con \(|\psi_n|^2\propto\ee^{-2|n|/\xi}\), \(\sum|\psi|^4/(\sum|\psi|^2)^2\approx1/\xi\). Con \(\xi=105/4\approx26\), unos 26 sitios.</p></details></li>
</ol>
