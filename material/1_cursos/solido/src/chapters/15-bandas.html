<p class="lead">Con el teorema de Bloch y los dos modelos límite ya se puede responder la pregunta que el modelo de Drude no podía: ¿por qué unos sólidos conducen y otros no? La respuesta de Alan Wilson (1931) es un argumento de conteo. Este capítulo lo desarrolla, presenta cómo se calculan las bandas de materiales reales y calcula, con el método del pseudopotencial empírico, las de los semiconductores que sostienen la electrónica: silicio, germanio y arseniuro de galio.</p>

<section>
<h2>Llenado de bandas</h2>
<p>Cada banda contiene \(N\) estados de \(\vb k\) (uno por celda primitiva) y, con el espín, admite \(2N\) electrones. Una banda llena no conduce: al aplicar un campo los electrones cambian de \(\vb k\), pero como todos los estados están ocupados la distribución no cambia, y la corriente total \(\sum_{\vb k}(-e)\vb v(\vb k)\) es cero porque \(\vb v(\vb k)=-\vb v(-\vb k)\). Por tanto:</p>
<ul>
<li>Si el número de electrones de valencia por celda es <b>impar</b>, la última banda queda a medio llenar: el sólido es un <b>metal</b> (Na, K, Cu, Ag, Au, Al con 3).</li>
<li>Si es <b>par</b>, puede llenar un número entero de bandas. Si la última banda llena está separada de la siguiente por una brecha, el sólido es <b>aislante</b> o <b>semiconductor</b> (diamante, Si, Ge, con 8 electrones por celda; NaCl).</li>
<li>Si con un número par las bandas se superponen en energía, los electrones se reparten entre dos bandas parcialmente llenas: el sólido es un <b>metal</b> (Be, Mg, Ca, Zn, divalentes) o, si la superposición es pequeña, un <span class="term">semimetal</span> con pocos portadores de cada signo (Bi, Sb, As, grafito, con \(10^{17}\)–\(10^{20}\) cm⁻³).</li>
</ul>
<p>La distinción entre semiconductor y aislante es de grado: a temperatura ambiente un sólido con brecha menor de unos 3 eV tiene portadores intrínsecos medibles o puede doparse. El argumento falla cuando la repulsión entre electrones es muy fuerte: los <span class="term">aislantes de Mott</span> como NiO o CoO tienen un número impar de electrones por celda y no conducen, porque poner dos electrones en el mismo sitio cuesta demasiada energía.</p>
<div class="sim" data-sim="llenado" data-title="Llenado de dos bandas: metal, semimetal, semiconductor y aislante"></div>

<li>Dos bandas de enlace fuerte de una red cuadrada separadas por una energía ajustable. Elija los electrones por celda: el nivel de Fermi se coloca contando los estados ocupados.</li>
<li>Con 2 electrones por celda y bandas separadas el sistema es aislante; si se superponen, quedan bolsillos de electrones y de huecos (semimetal).</li>
</ul></div>
</section>

<section>
<h2>Cómo se calculan las bandas</h2>
<p>Un cálculo realista tiene que resolver dos problemas: el potencial cristalino es fuerte cerca de los núcleos (donde los electrones internos oscilan rápido) y débil entre ellos, y el potencial depende a su vez de la distribución de los propios electrones. Los métodos históricos atacan el primero: ondas planas aumentadas (APW, Slater 1937), Korringa–Kohn–Rostoker (1947–1954), ondas planas ortogonalizadas (OPW, Herring 1940) y el <span class="term">pseudopotencial</span> (Phillips y Kleinman 1959), que reemplaza el núcleo y los electrones internos por un potencial suave que reproduce la dispersión de los de valencia. El segundo problema lo resuelve hoy la <span class="term">teoría del funcional de la densidad</span> (DFT; Hohenberg y Kohn 1964, Kohn y Sham 1965), que calcula la energía y la densidad del estado fundamental con un potencial efectivo de un electrón. La DFT con funcionales locales subestima las brechas (el Si da 0.5 eV en lugar de 1.17): es el «problema de la brecha», que se corrige con funcionales híbridos o con la aproximación GW de muchos cuerpos.</p>
</section>

<section>
<h2>El pseudopotencial empírico</h2>
<p>Marvin Cohen y T. K. Bergstresser (1966) calcularon las bandas de catorce semiconductores con estructura de diamante y de blenda de zinc usando un pseudopotencial local con solo tres coeficientes de Fourier simétricos y tres antisimétricos, ajustados a brechas ópticas medidas. Con el origen en el punto medio del enlace y los átomos en \(\pm\vb\tau=\pm\tfrac a8(1,1,1)\), el potencial es</p>
<div class="eq key" data-name="Pseudopotencial de Cohen–Bergstresser">\[U(\vb G)=V^S(|\vb G|)\cos(\vb G\cdot\vb\tau)+\ii V^A(|\vb G|)\sen(\vb G\cdot\vb\tau),\]</div>
<p>con \(V^S\) en las capas \(|\vb G|^2=3,8,11\) y \(V^A\) en \(3,4,11\) (en unidades de \((2\pi/a)^2\)); en el diamante \(V^A=0\). La ecuación central con unas 60 a 110 ondas planas da las bandas en toda la zona. Los resultados reproducen los rasgos principales: el silicio y el germanio tienen <span class="term">brecha indirecta</span> (el máximo de valencia en Γ y el mínimo de conducción cerca de X o en L), mientras que el GaAs tiene <span class="term">brecha directa</span> en Γ. El modelo da 3.4 eV para la transición directa \(\Gamma_{25'}\to\Gamma_{15}\) del Si, igual a la medida, y 1.4 eV para la brecha directa del GaAs (1.52 eV a 0 K); subestima la brecha indirecta del silicio (0.8 eV frente a 1.17), porque un potencial local no basta para los estados de conducción en X.</p>

</section>

<section>
<h2>Brechas directas e indirectas</h2>
<p>Un fotón tiene momento despreciable a la escala de la zona de Brillouin, así que una transición óptica conserva \(\vb k\): es vertical en el diagrama de bandas. En un semiconductor de brecha directa un electrón de conducción puede recombinarse con un hueco emitiendo un fotón, con alta probabilidad: GaAs, InP, GaN y sus aleaciones son los materiales de los LED y los láseres semiconductores. En uno de brecha indirecta la transición requiere además un fonón que aporte el momento, un proceso de segundo orden mil veces más lento; por eso el silicio es un pésimo emisor de luz, aunque absorbe bien por encima de su brecha directa. La brecha también decide el color: un semiconductor absorbe los fotones con \(h\nu>E_g\), y su color es el de la luz que transmite (el CdS amarillo con 2.42 eV, el GaP anaranjado con 2.26 eV).</p>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Por qué el calcio (valencia 2, fcc) conduce y el diamante (valencia 4, 2 átomos por celda) no?
<details><summary>Respuesta</summary><p>Ambos tienen número par de electrones por celda (2 y 8), pero en el Ca las bandas s y p se superponen, mientras que en el diamante la banda de valencia llena está separada por 5.5 eV de la de conducción.</p></details></li>
<li><span class="lvl">Básico</span>¿Qué longitud de onda emite un LED de GaAs (\(E_g=1.42\) eV) y uno de GaN (3.39 eV)?
<details><summary>Respuesta</summary><p>\(\lambda=1240/E_g\): 873 nm (infrarrojo) y 366 nm (ultravioleta).</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que \(\sen(\vb G\cdot\vb\tau)=0\) para \(\vb G=\tfrac{2\pi}a(2,2,0)\) y que por eso no hay factor antisimétrico en \(|\vb G|^2=8\).
<details><summary>Respuesta</summary><p>\(\vb G\cdot\vb\tau=\tfrac{2\pi}a\cdot\tfrac a8(2+2+0)=\pi\), \(\sen\pi=0\). En cambio para (2,0,0), \(\vb G\cdot\vb\tau=\pi/2\) y el seno vale 1.</p></details></li>
<li><span class="lvl">Intermedio</span>Muestre que en un semiconductor sin simetría de inversión (blenda de zinc) el hamiltoniano de pseudopotencial es hermítico pero no real, mientras que en el diamante puede tomarse real.
<details><summary>Respuesta</summary><p>\(U(-\vb G)=V^S\cos(\vb G\cdot\vb\tau)-\ii V^A\sen(\vb G\cdot\vb\tau)=U(\vb G)^*\): hermítico. Con \(V^A=0\) todos los elementos son reales.</p></details></li>
<li><span class="lvl">Avanzado</span>Una banda llena no conduce. Demuéstrelo usando que la velocidad media de una banda, \(\sum_{\vb k}\nabla_{\vb k}E/\hbar\), es la integral de un gradiente de una función periódica sobre la zona de Brillouin.
<details><summary>Respuesta</summary><p>\(\int_{ZB}\nabla_{\vb k}E\,\dd^3k=\oint E\,\dd\vb S=0\), porque las contribuciones de caras opuestas de la zona se cancelan por la periodicidad de \(E\).</p></details></li>
</ol>
