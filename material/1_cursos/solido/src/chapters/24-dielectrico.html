<p class="lead">Un aislante en un campo eléctrico no conduce, pero se polariza: sus nubes electrónicas se deforman, sus iones se desplazan y sus moléculas polares se orientan. Cada mecanismo responde hasta una frecuencia característica, y juntos determinan la constante dieléctrica, el índice de refracción y la absorción del material desde la corriente continua hasta el ultravioleta. En algunos cristales la polarización aparece sola, sin campo: son los ferroeléctricos de las memorias, los sensores y los actuadores piezoeléctricos.</p>

<section>
<h2>Campo local y Clausius–Mossotti</h2>
<p>La polarización \(\vb P\) es el momento dipolar por unidad de volumen. En un medio lineal \(\vb P=\varepsilon_0\chi\vb E\) y la permitividad relativa es \(\varepsilon_r=1+\chi\). Pero cada átomo no siente el campo macroscópico \(\vb E\) sino el <span class="term">campo local</span>, que incluye el de todos los demás dipolos. Para un sitio de simetría cúbica, Lorentz mostró que</p>
<div class="eq key" data-name="Campo local de Lorentz">\[\vb E_{loc}=\vb E+\frac{\vb P}{3\varepsilon_0}.\]</div>
<p>Si cada átomo tiene polarizabilidad \(\alpha\) (\(\vb p=\alpha\vb E_{loc}\)) y hay \(N\) por unidad de volumen, \(\vb P=N\alpha\vb E_{loc}\), y se obtiene la relación de <span class="term">Clausius–Mossotti</span>:</p>
<div class="eq key" data-name="Clausius–Mossotti">\[\frac{\varepsilon_r-1}{\varepsilon_r+2}=\frac{N\alpha}{3\varepsilon_0}.\]</div>
<p>Cuando \(N\alpha/3\varepsilon_0\to1\) la permitividad diverge: el campo local se refuerza a sí mismo y el sistema se polariza espontáneamente. Esa «catástrofe de polarización» es una forma simple de entender la ferroelectricidad.</p>
<p>La polarizabilidad tiene tres contribuciones. La <b>electrónica</b> (deformación de las nubes) responde hasta el ultravioleta y da el índice de refracción óptico, \(\varepsilon_\infty=n^2\). La <b>iónica</b> (desplazamiento relativo de iones de signo opuesto) responde hasta el infrarrojo lejano, a las frecuencias de los fonones ópticos. La de <b>orientación</b> de dipolos permanentes (moléculas polares, como el agua) solo sigue campos lentos, hasta las microondas, y depende de la temperatura como \(p^2/3k_BT\) (Debye). Por eso el agua tiene \(\varepsilon_r=80\) en estática y \(n^2=1.78\) en el visible.</p>
<div class="sim" data-sim="polarizabilidad" data-title="Contribuciones a la constante dieléctrica en todo el espectro"></div>
<div class="sim-guide"><ul>
<li>Parte real e imaginaria de \(\varepsilon_r(\omega)\) con una relajación de Debye (orientación), un oscilador iónico en el infrarrojo y uno electrónico en el ultravioleta. Al cruzar cada frecuencia característica la contribución correspondiente desaparece, con un pico de absorción.</li>
</ul></div>
</section>

<section>
<h2>Fonones ópticos y reststrahlen</h2>
<p>Un modo óptico transversal de frecuencia \(\omega_T\) en un cristal iónico es un oscilador forzado por el campo de la radiación. Con un amortiguamiento \(\gamma\), su contribución a la permitividad es la de un oscilador de Lorentz:</p>
<div class="eq key" data-name="Oscilador de Lorentz">\[\varepsilon(\omega)=\varepsilon_\infty+\frac{(\varepsilon(0)-\varepsilon_\infty)\,\omega_T^2}{\omega_T^2-\omega^2-\ii\gamma\omega}.\]</div>
<p>Sin amortiguamiento, \(\varepsilon\) es negativa entre \(\omega_T\) y la frecuencia \(\omega_L\) donde vuelve a anularse. En ese intervalo no se propagan ondas y el cristal refleja casi todo: es la <span class="term">banda de reststrahlen</span> («rayos residuales»), que Heinrich Rubens usaba a fines del siglo XIX para aislar radiación infrarroja reflejándola varias veces en cristales de sal. La frecuencia donde \(\varepsilon=0\) es la del modo óptico longitudinal, y de la fórmula se deduce la <span class="term">relación de Lyddane–Sachs–Teller</span> (1941):</p>
<div class="eq key" data-name="Lyddane–Sachs–Teller">\[\frac{\omega_L^2}{\omega_T^2}=\frac{\varepsilon(0)}{\varepsilon_\infty}.\]</div>
<p>El modo longitudinal es más rígido que el transversal porque su campo de polarización (\(\vb E=-\vb P/\varepsilon_0\)) agrega una fuerza restauradora. Para el NaCl, \(\omega_T=164\) cm⁻¹, \(\omega_L=264\) cm⁻¹, \(\varepsilon(0)=5.9\) y \(\varepsilon_\infty=2.25\): la relación se cumple con un 1 %. En el GaAs (268.6 y 292 cm⁻¹; 12.9 y 10.9) con un 0.1 %.</p>
<div class="sim" data-sim="reststrahlen" data-title="Reflectividad infrarroja de cristales iónicos"></div>
<div class="sim-guide"><ul>
<li>Reflectividad a incidencia normal calculada con el oscilador de Lorentz y los parámetros medidos de cada cristal. La banda casi total entre \(\omega_T\) y \(\omega_L\) es la de reststrahlen; el mínimo después de \(\omega_L\) ocurre donde \(\varepsilon=1\).</li>
<li>Aumente el amortiguamiento: la banda se redondea y baja.</li>
</ul></div>
</section>

<section>
<h2>Polaritones</h2>
<p>Cerca de \(\omega_T\) la luz y el fonón óptico tienen la misma frecuencia y el mismo vector de onda, y no pueden tratarse por separado: se mezclan en <span class="term">polaritones</span>. La relación de dispersión sale de combinar la ecuación de ondas, \(c^2k^2=\omega^2\varepsilon(\omega)\), con el oscilador de Lorentz:</p>
<div class="eq key" data-name="Polaritón de fonón">\[c^2k^2=\omega^2\left[\varepsilon_\infty+\frac{(\varepsilon(0)-\varepsilon_\infty)\omega_T^2}{\omega_T^2-\omega^2}\right].\]</div>
<p>Hay dos ramas: la inferior empieza como luz en un medio de permitividad \(\varepsilon(0)\) y termina como fonón en \(\omega_T\); la superior empieza en \(\omega_L\) y termina como luz en un medio de permitividad \(\varepsilon_\infty\). Entre \(\omega_T\) y \(\omega_L\) no hay estados: es la banda de reststrahlen vista desde la dispersión. Henry y Hopfield los midieron en GaP en 1965 con dispersión Raman a ángulos pequeños.</p>
<div class="sim" data-sim="polariton" data-title="Dispersión de los polaritones de fonón"></div>
<div class="sim-guide"><ul>
<li>Las dos ramas del polaritón y las rectas de la luz con \(\varepsilon(0)\) y \(\varepsilon_\infty\). La franja es la banda prohibida entre \(\omega_T\) y \(\omega_L\).</li>
</ul></div>
</section>

<section>
<h2>Relaciones de Kramers–Kronig</h2>
<p>La causalidad (la polarización no puede responder antes del campo) obliga a que \(\varepsilon(\omega)\) sea analítica en el semiplano superior complejo. De ahí resultan las <span class="term">relaciones de Kramers–Kronig</span>, que ligan la parte real con la imaginaria:</p>
<div class="eq key" data-name="Kramers–Kronig">\[\varepsilon_1(\omega)-\varepsilon_\infty=\frac2\pi\,\mathcal P\!\int_0^\infty\frac{\omega'\varepsilon_2(\omega')}{\omega'^2-\omega^2}\dd\omega' .\]</div>
<p>Toda absorción produce dispersión, y viceversa: midiendo la absorción en todo el espectro se calcula el índice de refracción. En la práctica se mide la reflectividad y se obtiene la fase por una relación análoga. La regla de suma \(\int_0^\infty\omega\varepsilon_2\dd\omega=\tfrac\pi2\omega_p^2\) relaciona la absorción total con la densidad de electrones.</p>
<div class="sim" data-sim="kramers-kronig" data-title="Kramers–Kronig numérico frente al oscilador exacto"></div>
<div class="sim-guide"><ul>
<li>A partir de \(\varepsilon_2\) de un oscilador de Lorentz se calcula \(\varepsilon_1\) por la integral de valor principal (sustrayendo la singularidad) y se compara con el valor exacto. La validación del curso hace la misma comparación.</li>
</ul></div>
</section>

<section>
<h2>Ferroelectricidad</h2>
<p>Un <span class="term">ferroeléctrico</span> tiene polarización espontánea que puede invertirse con un campo, con un ciclo de histéresis como el de los ferromagnetos. El titanato de bario (BaTiO₃) es cúbico por encima de 393 K; al enfriar, el ion Ti⁴⁺ se desplaza respecto del octaedro de oxígenos y aparece \(P_s=26\) µC/cm². Por encima de la transición la permitividad sigue una ley de Curie–Weiss, \(\varepsilon\propto1/(T-T_0)\), y llega a valores de 10 000: por eso el BaTiO₃ es el material de los condensadores cerámicos.</p>
<p>William Cochran (1960) mostró que la transición se debe a un <span class="term">modo blando</span>: un fonón óptico transversal cuya frecuencia baja al acercarse a \(T_c\), \(\omega_T^2\propto T-T_0\). Por la relación de Lyddane–Sachs–Teller, \(\varepsilon(0)=\varepsilon_\infty\omega_L^2/\omega_T^2\) diverge. La <span class="term">teoría de Landau</span> describe la transición con una energía libre desarrollada en el parámetro de orden:</p>
<div class="eq key" data-name="Teoría de Landau">\[F(P,T)=F_0+\tfrac12a(T-T_0)P^2+\tfrac14bP^4+\tfrac16cP^6-EP .\]</div>
<p>Con \(b>0\) la transición es continua (de segundo orden), con \(P_s\propto\sqrt{T_0-T}\); con \(b<0\) y \(c>0\) es discontinua (de primer orden), como en el BaTiO₃, con un salto de la polarización y una región de coexistencia con histéresis térmica. El mismo esquema describe el ferromagnetismo (capítulo 27) y la superconductividad (capítulo 29).</p>
<div class="sim" data-sim="landau-ferro" data-title="Teoría de Landau: energía libre, polarización e histéresis"></div>
<div class="sim-guide"><ul>
<li>Izquierda: \(F(P)\) a la temperatura elegida, con el mínimo actual. Centro: \(P_s(T)\). Derecha: ciclo \(P(E)\) siguiendo el mínimo local al barrer el campo.</li>
<li>Cambie \(b\) a negativo: la transición se vuelve de primer orden y aparecen mínimos coexistentes.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Con la relación LST, ¿cuál es \(\omega_L\) del GaP si \(\omega_T=367\) cm⁻¹, \(\varepsilon(0)=11.1\) y \(\varepsilon_\infty=9.11\)?
<details><summary>Respuesta</summary><p>\(\omega_L=367\sqrt{11.1/9.11}=405\) cm⁻¹ (medido: 403).</p></details></li>
<li><span class="lvl">Básico</span>¿En qué intervalo de longitudes de onda refleja fuertemente el NaCl?
<details><summary>Respuesta</summary><p>Entre \(1/\omega_L=38\) µm y \(1/\omega_T=61\) µm, en el infrarrojo lejano.</p></details></li>
<li><span class="lvl">Intermedio</span>Deduzca Clausius–Mossotti a partir de \(\vb P=N\alpha(\vb E+\vb P/3\varepsilon_0)\).
<details><summary>Respuesta</summary><p>\(P(1-N\alpha/3\varepsilon_0)=N\alpha E\), \(\chi=P/\varepsilon_0E=(N\alpha/\varepsilon_0)/(1-N\alpha/3\varepsilon_0)\); con \(\varepsilon_r=1+\chi\) se despeja \((\varepsilon_r-1)/(\varepsilon_r+2)=N\alpha/3\varepsilon_0\).</p></details></li>
<li><span class="lvl">Intermedio</span>En la teoría de Landau de segundo orden demuestre que la susceptibilidad por debajo de \(T_0\) es la mitad de la de arriba a la misma distancia \(|T-T_0|\).
<details><summary>Respuesta</summary><p>\(\chi^{-1}=\partial^2F/\partial P^2\): arriba \(a(T-T_0)\); abajo, con \(P_s^2=a(T_0-T)/b\), \(\chi^{-1}=a(T-T_0)+3bP_s^2=2a(T_0-T)\).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre la regla de suma \(\int_0^\infty\omega\,\varepsilon_2(\omega)\,\dd\omega=\tfrac\pi2(\varepsilon(0)-\varepsilon_\infty)\omega_T^2\) para el oscilador de Lorentz.
<details><summary>Respuesta</summary><p>Del comportamiento a frecuencia alta: \(\varepsilon_1-\varepsilon_\infty\to-(\varepsilon(0)-\varepsilon_\infty)\omega_T^2/\omega^2\), y la relación de Kramers–Kronig para \(\omega\to\infty\) da \(-\tfrac2{\pi\omega^2}\int\omega'\varepsilon_2\dd\omega'\). Igualando se obtiene la regla.</p></details></li>
</ol>
