<p class="lead">Un cristal perfectamente armónico tendría propiedades absurdas: no se dilataría al calentarlo, sus constantes elásticas no cambiarían con la temperatura y conduciría el calor infinitamente bien, porque sus modos normales no interactúan entre sí. Las tres anomalías desaparecen al incluir los términos cúbicos y cuárticos del potencial. Este capítulo trata las dos consecuencias más importantes: la dilatación térmica y la resistencia térmica de la red.</p>

<section>
<h2>Dilatación térmica</h2>
<p>En un potencial parabólico el desplazamiento medio de un átomo es cero a cualquier temperatura. El potencial real es asimétrico: más duro al comprimir (repulsión de Pauli) que al estirar. Si \(U(x)=cx^2-gx^3\), el promedio clásico de Boltzmann a primer orden en \(g\) da</p>
<div class="eq key" data-name="Desplazamiento térmico medio">\[\langle x\rangle=\frac{\int x\,\ee^{-U/k_BT}\dd x}{\int\ee^{-U/k_BT}\dd x}\simeq\frac{3g}{4c^2}k_BT ,\]</div>
<p>una dilatación lineal en \(T\). Para el potencial de Morse \(c=Da^2\) y \(g=Da^3\), y \(\langle x\rangle=3k_BT/(4Da)\). A baja temperatura la cuantización congela las vibraciones y la dilatación se anula como el calor específico.</p>
<p>La forma termodinámica de este resultado es la <span class="term">relación de Grüneisen</span>. Si las frecuencias de los modos cambian con el volumen según el parámetro \(\gamma=-\dd\ln\omega/\dd\ln V\), supuesto igual para todos, el coeficiente de dilatación lineal es</p>
<div class="eq key" data-name="Relación de Grüneisen">\[\alpha=\frac{\gamma\,C_V}{3BV_m},\]</div>
<p>con \(B\) el módulo de compresibilidad y \(V_m\) el volumen molar. Por eso \(\alpha\) sigue al calor específico: crece como \(T^3\) a baja temperatura y se satura por encima de \(\theta_D\). El parámetro de Grüneisen es de 1.5 a 2.5 en la mayoría de los sólidos.</p>
<div class="box ex"><h4>Dilatación del cobre y del aluminio</h4><p>Para el cobre \(\gamma=2.0\), \(B=137\) GPa, \(V_m=7.09\) cm³/mol y \(C_V=24.4\) J/(mol·K): \(\alpha=2.0\times24.4/(3\times137\times10^9\times7.09\times10^{-6})=1.67\times10^{-5}\) K⁻¹, frente a \(1.65\times10^{-5}\) medido. Para el aluminio, con \(\gamma=2.17\), \(B=76\) GPa y \(V_m=10.0\) cm³/mol, \(\alpha=2.3\times10^{-5}\) K⁻¹, igual al valor de tabla. El silicio tiene \(\alpha\) negativo por debajo de 120 K: algunos modos transversales se ablandan al comprimir (\(\gamma<0\)).</p></div>
<div class="sim" data-sim="dilatacion" data-title="Dilatación térmica en un potencial de Morse"></div>
<div class="sim-guide"><ul>
<li>Izquierda: el pozo de Morse con la distribución de Boltzmann de la posición a la temperatura elegida; la línea marca \(\langle x\rangle\). Derecha: \(\langle x\rangle\) frente a \(k_BT\), calculado por cuadratura, y la aproximación lineal \(3k_BT/4Da\).</li>
<li>Con un potencial armónico de la misma curvatura (casilla) la dilatación desaparece.</li>
</ul></div>
</section>

<section>
<h2>Conductividad térmica: el gas de fonones</h2>
<p>En un aislante el calor lo transportan los fonones, que se comportan como un gas de partículas que viajan con la velocidad del sonido y chocan. La teoría cinética da</p>
<div class="eq key" data-name="Conductividad térmica cinética">\[\kappa=\tfrac13\,C\,v\,\ell ,\]</div>
<p>con \(C\) el calor específico por unidad de volumen, \(v\) la velocidad media de los fonones y \(\ell\) su recorrido libre medio. En el silicio a 300 K, \(\kappa=148\) W/(m·K), \(C=1.66\times10^6\) J/(m³·K) y \(v\approx6.4\) km/s dan \(\ell\approx40\) nm: unas 170 distancias interatómicas. (El espectro real de recorridos es muy ancho y buena parte del calor la llevan fonones con \(\ell\) de micras, lo que importa en los transistores de pocos nanómetros.)</p>
<p>¿Qué limita \(\ell\)? En un cristal perfecto, las colisiones entre fonones causadas por la anarmonicidad: dos fonones se funden en uno, o uno se divide en dos, conservando la energía y el momento cristalino módulo \(\vb G\),</p>
<div class="eq key" data-name="Procesos de tres fonones">\[\vb q_1+\vb q_2=\vb q_3+\vb G .\]</div>
<p>Si \(\vb G=0\) el proceso es <span class="term">normal</span> y conserva el momento total del gas de fonones: no puede detener un flujo de calor, igual que los choques entre moléculas no frenan un gas que fluye por un tubo sin rozamiento. Solo los procesos <span class="term">umklapp</span> («dar la vuelta», Peierls 1929), con \(\vb G\neq0\), invierten la dirección del momento y producen resistencia térmica. Para que \(\vb q_1+\vb q_2\) salga de la zona de Brillouin hace falta que los fonones tengan vectores de onda de la mitad de la zona, energías del orden de \(k_B\theta_D/2\); a temperaturas bajas su número es \(\propto\ee^{-\theta_D/bT}\) con \(b\approx2\).</p>
<div class="sim" data-sim="umklapp" data-title="Procesos normales y umklapp en la zona de Brillouin"></div>
<div class="sim-guide"><ul>
<li>Arrastre las puntas de \(\vb q_1\) y \(\vb q_2\). Si la suma cae fuera de la zona, se le resta un \(\vb G\) para devolverla: el fonón resultante viaja «hacia atrás», un proceso umklapp.</li>
</ul></div>
</section>

<section>
<h2>Dependencia de la temperatura</h2>
<p>La conductividad térmica de un aislante cristalino tiene una forma característica. A temperatura alta (\(T\gtrsim\theta_D\)) el número de fonones crece como \(T\) y con él la tasa de umklapp: \(\kappa\propto1/T\). Al enfriar, el umklapp se congela exponencialmente y \(\kappa\) sube muchísimo, hasta que \(\ell\) alcanza el tamaño de la muestra o la distancia entre defectos. Por debajo, el recorrido queda fijo en el tamaño \(L\) y \(\kappa=\tfrac13CvL\propto T^3\), como el calor específico. Entre ambos regímenes hay un máximo, tanto más alto cuanto más puro y grande es el cristal. Los isótopos, átomos de distinta masa al azar, dispersan fonones con una tasa \(\propto\omega^4\) (como la dispersión de Rayleigh de la luz): el diamante isotópicamente puro (99.9 % de ¹²C) conduce el calor un 50 % mejor que el natural a temperatura ambiente, 3300 frente a 2200 W/(m·K).</p>
<div class="sim" data-sim="kappa-T" data-title="Conductividad térmica de un aislante: tamaño, isótopos y umklapp"></div>
<div class="sim-guide"><ul>
<li>Modelo de Callaway en la aproximación de Debye: tasas de dispersión por los bordes \(v/L\), por isótopos \(A\omega^4\) y umklapp \(B\omega^2T\ee^{-\theta_D/3T}\), sumadas según la regla de Matthiessen.</li>
<li>Reduzca el tamaño de la muestra o aumente el desorden isotópico: el máximo baja y se desplaza; a temperatura alta todas las curvas coinciden.</li>
</ul></div>
<div class="box note"><h4>Metales y vidrios</h4><p>En los metales el calor lo llevan sobre todo los electrones, y la ley de Wiedemann–Franz liga \(\kappa\) con la conductividad eléctrica (capítulo 10). En los vidrios, sin periodicidad, el recorrido libre medio de los fonones es de pocos ángstroms a temperatura ambiente y \(\kappa\approx1\) W/(m·K), casi independiente de la temperatura; a baja temperatura sigue una ley \(T^2\) asociada a los sistemas de dos niveles.</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Demuestre que en un potencial \(U=cx^2\) el promedio \(\langle x\rangle\) es cero a cualquier temperatura.
<details><summary>Respuesta</summary><p>El integrando \(x\,\ee^{-cx^2/k_BT}\) es impar.</p></details></li>
<li><span class="lvl">Básico</span>Una barra de aluminio de 1 m se calienta de 20 °C a 80 °C. ¿Cuánto se alarga?
<details><summary>Respuesta</summary><p>\(\Delta L=\alpha L\Delta T=2.3\times10^{-5}\times1\times60=1.4\) mm.</p></details></li>
<li><span class="lvl">Intermedio</span>Deduzca \(\langle x\rangle=3gk_BT/4c^2\) desarrollando \(\ee^{gx^3/k_BT}\approx1+gx^3/k_BT\) en las integrales.
<details><summary>Respuesta</summary><p>Numerador: \((g/k_BT)\int x^4\ee^{-cx^2/k_BT}\dd x=(g/k_BT)\tfrac34\sqrt\pi(k_BT/c)^{5/2}\); denominador \(\sqrt{\pi k_BT/c}\). El cociente es \(3gk_BT/4c^2\).</p></details></li>
<li><span class="lvl">Intermedio</span>Un cristal de NaCl tiene \(\kappa=6.5\) W/(m·K) a 300 K, \(C=1.87\times10^6\) J/(m³·K) y \(v\approx3.5\) km/s. ¿Cuánto vale el recorrido libre medio? ¿Y a 600 K si \(\kappa\propto1/T\)?
<details><summary>Respuesta</summary><p>\(\ell=3\kappa/(Cv)=3.0\) nm; a 600 K, 1.5 nm (\(C\) ya casi constante).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que la conservación de la energía y del momento cristalino impide que un fonón acústico de una cadena con dispersión lineal se divida en dos de la misma rama si la dispersión real es cóncava (\(\omega''<0\)).
<details><summary>Respuesta</summary><p>Hay que satisfacer \(\omega(q_1+q_2)=\omega(q_1)+\omega(q_2)\). Con \(\omega\) cóncava y \(\omega(0)=0\), \(\omega\) es subaditiva: \(\omega(q_1+q_2)<\omega(q_1)+\omega(q_2)\) para \(q_1,q_2>0\); solo es posible con ramas distintas o con umklapp.</p></details></li>
</ol>
