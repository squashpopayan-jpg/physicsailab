<p class="lead">El modelo de Drude tenía un problema grave: si los electrones son un gas clásico, cada uno debería aportar \(\tfrac32k_B\) al calor específico, y los metales tendrían un 50 % más que los aislantes. No es así: a temperatura ambiente la contribución de los electrones es cien veces menor. Arnold Sommerfeld (1928) lo resolvió aplicando al gas de Drude el principio de exclusión de Pauli y la estadística de Fermi–Dirac. Solo una pequeña fracción de los electrones, los que están cerca de la energía de Fermi, puede absorber energía térmica.</p>

<section>
<h2>Electrones en una caja: la esfera de Fermi</h2>
<p>Un electrón libre en un cubo de lado \(L\) con condiciones de contorno periódicas tiene funciones de onda planas \(\psi_{\vb k}=\ee^{\ii\vb k\cdot\vb r}/\sqrt V\) con energía \(\hbar^2k^2/2m\) y vectores de onda \(\vb k=\tfrac{2\pi}L(n_x,n_y,n_z)\). Cada \(\vb k\) ocupa un volumen \((2\pi)^3/V\) del espacio recíproco y admite dos electrones (espín arriba y abajo). En el estado fundamental los \(N\) electrones llenan los estados de menor energía, una esfera de radio \(k_F\), la <span class="term">esfera de Fermi</span>:</p>
<div class="eq">\[2\cdot\frac{\tfrac43\pi k_F^3}{(2\pi)^3/V}=N\quad\Longrightarrow\quad k_F=(3\pi^2n)^{1/3}.\]</div>
<div class="eq key" data-name="Energía de Fermi">\[E_F=\frac{\hbar^2k_F^2}{2m}=\frac{\hbar^2}{2m}(3\pi^2n)^{2/3},\qquad v_F=\frac{\hbar k_F}m,\qquad T_F=\frac{E_F}{k_B}.\]</div>
<p>Para el cobre (\(n=8.47\times10^{22}\) cm⁻³): \(k_F=1.36\) Å⁻¹, \(E_F=7.03\) eV, \(v_F=1.57\times10^6\) m/s (0.5 % de la velocidad de la luz) y \(T_F=81\,600\) K. La temperatura de Fermi es tan alta que a temperatura ambiente el gas está profundamente <span class="term">degenerado</span>: \(T/T_F\approx0.004\). Incluso en el cero absoluto los electrones se mueven a velocidades enormes y la energía media es \(\tfrac35E_F=4.2\) eV.</p>
<div class="sim" data-sim="esfera-fermi" data-title="Llenado de los estados: el disco y la esfera de Fermi"></div>
<div class="sim-guide"><ul>
<li>Cada punto es un vector \(\vb k\) permitido de un cristal bidimensional de \(L\times L\); se llenan con dos electrones por punto, del menos energético al más energético. Aumente el número de electrones: el borde de los estados ocupados se aproxima al círculo de Fermi.</li>
<li>La lectura compara \(k_F\) contado con la fórmula \(k_F=\sqrt{2\pi n}\) del caso bidimensional.</li>
</ul></div>
</section>

<section>
<h2>Densidad de estados</h2>
<p>El número de estados con energía menor que \(E\) es \(N(E)=V(2mE)^{3/2}/(3\pi^2\hbar^3)\). Derivando, la <span class="term">densidad de estados</span> por unidad de volumen es</p>
<div class="eq key" data-name="Densidad de estados 3D">\[g(E)=\frac1{2\pi^2}\left(\frac{2m}{\hbar^2}\right)^{3/2}\sqrt E,\qquad g(E_F)=\frac{3n}{2E_F}.\]</div>
<p>En el cobre, \(g(E_F)=0.21\) estados por eV y por átomo (con los dos espines). La dimensión cambia la forma: en dos dimensiones \(g\) es constante, \(m/\pi\hbar^2\) por unidad de área, y en una dimensión diverge como \(1/\sqrt E\). Este hecho es la base de los dispositivos de pozos y hilos cuánticos (capítulo 23).</p>
</section>

<section>
<h2>Distribución de Fermi–Dirac y potencial químico</h2>
<p>A temperatura finita la probabilidad de ocupación de un estado de energía \(E\) es la función de Fermi–Dirac</p>
<div class="eq key" data-name="Fermi–Dirac">\[f(E)=\frac1{\ee^{(E-\mu)/k_BT}+1},\]</div>
<p>que vale ½ en el potencial químico \(\mu\) y pasa de 1 a 0 en un intervalo de unos \(4k_BT\). El potencial químico se fija con la condición \(n=\int g(E)f(E)\dd E\), que en general requiere las integrales de Fermi–Dirac \(\mathcal F_j(\eta)\). Para un gas degenerado la <span class="term">expansión de Sommerfeld</span>,</p>
<div class="eq key" data-name="Expansión de Sommerfeld">\[\int_0^\infty H(E)f(E)\,\dd E=\int_0^\mu H(E)\,\dd E+\frac{\pi^2}6(k_BT)^2H'(\mu)+\mathcal O(T^4),\]</div>
<p>da \(\mu=E_F[1-\tfrac{\pi^2}{12}(T/T_F)^2]\): en el cobre a 300 K el corrimiento es de 0.08 meV, despreciable. A temperaturas comparables con \(T_F\) (en un plasma denso o en el gas de electrones de un semiconductor) el potencial químico baja hasta volverse negativo y la distribución se acerca a la de Maxwell–Boltzmann.</p>
<div class="sim" data-sim="fermi-dirac" data-title="Distribución de Fermi–Dirac y ocupación de la densidad de estados"></div>
<div class="sim-guide"><ul>
<li>Arriba \(f(E)\); abajo \(g(E)f(E)\), los electrones por unidad de energía. El potencial químico se calcula invirtiendo la integral de Fermi–Dirac \(\mathcal F_{1/2}\). Suba la temperatura hasta \(T\sim T_F\): \(\mu\) cae y la distribución se vuelve clásica.</li>
<li>La zona sombreada marca \(\pm2k_BT\) alrededor de \(\mu\): solo esos electrones participan en procesos térmicos.</li>
</ul></div>
</section>

<section>
<h2>Calor específico electrónico</h2>
<p>Al calentar, solo los electrones dentro de \(k_BT\) del nivel de Fermi pueden excitarse, porque los demás no encuentran estados libres cerca. Son una fracción \(T/T_F\) del total y cada uno gana unos \(k_BT\): \(U\sim Nk_BT^2/T_F\) y \(C\sim Nk_BT/T_F\). La expansión de Sommerfeld da el coeficiente exacto:</p>
<div class="eq key" data-name="Calor específico electrónico">\[C_{el}=\frac{\pi^2}3g(E_F)k_B^2T=\frac{\pi^2}2Nk_B\frac T{T_F}=\gamma T .\]</div>
<p>En el cobre a 300 K esto es apenas el 0.6 % de Dulong–Petit, en acuerdo con la experiencia. A temperaturas de pocos kelvin, en cambio, domina sobre el término \(T^3\) de la red (capítulo 8). La razón entre el \(\gamma\) medido y el de electrones libres define una <span class="term">masa térmica</span> \(m^*_{th}/m=\gamma_{med}/\gamma_{libre}\): 1.0 en la plata, 1.4 en el cobre, 2.2 en el litio y 2.0 en el plomo. Los efectos de la red periódica (bandas), de la interacción electrón–fonón y de la interacción entre electrones explican la diferencia.</p>
<div class="sim" data-sim="calor-electronico" data-title="Calor específico del gas de electrones: degenerado y clásico"></div>
<div class="sim-guide"><ul>
<li>El calor específico se calcula derivando numéricamente la energía con las integrales de Fermi–Dirac exactas. A \(T\ll T_F\) sigue la recta de Sommerfeld; a \(T\gg T_F\) tiende al valor clásico \(\tfrac32nk_B\).</li>
<li>Pruebe una densidad baja, como la de los electrones de un semiconductor (\(10^{24}\) m⁻³): el gas es clásico a temperatura ambiente.</li>
</ul></div>
</section>

<section>
<h2>Presión de degeneración y emisión termoiónica</h2>
<p>El gas de Fermi ejerce presión incluso a cero absoluto: \(P=\tfrac23nE_F\cdot\tfrac35=\tfrac25nE_F\), con un módulo de compresibilidad \(B=\tfrac23nE_F\). Para el sodio da 9.2 GPa (medido 6.4) y para el potasio 3.2 GPa (medido 3.1): en los alcalinos la rigidez del metal es casi toda presión de los electrones. En el cobre o el aluminio el acuerdo es malo, porque los iones y los electrones d contribuyen. La misma presión, a escala estelar, sostiene a las enanas blancas contra la gravedad.</p>
<p>Para escapar del metal un electrón necesita superar la <span class="term">función de trabajo</span> \(W\), la distancia entre el nivel de Fermi y el vacío: de 2 a 6 eV. A temperatura alta, la cola de la distribución de Fermi–Dirac tiene electrones suficientes para salir. Contando los que llegan a la superficie con suficiente velocidad perpendicular se obtiene la ley de <span class="term">Richardson–Dushman</span>:</p>
<div class="eq key" data-name="Richardson–Dushman">\[J=A\,T^2\,\ee^{-W/k_BT},\qquad A=\frac{4\pi mek_B^2}{h^3}=120\ \text{A cm}^{-2}\,\text{K}^{-2}.\]</div>
<p>Un filamento de tungsteno (\(W=4.55\) eV) emite 0.5 A/cm² a 2500 K y 25 A/cm² a 3000 K: la fuerte dependencia exponencial es la base de los tubos de vacío, los cátodos de los microscopios electrónicos y los tubos de rayos X.</p>
<div class="sim" data-sim="termoionica" data-title="Emisión termoiónica de Richardson–Dushman"></div>
<div class="sim-guide"><ul>
<li>Densidad de corriente frente a la temperatura para varios metales; la gráfica de Richardson (\(\ln(J/T^2)\) frente a \(1/T\)) es una recta de pendiente \(-W/k_B\).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule \(E_F\), \(v_F\) y \(T_F\) del aluminio (\(n=18.1\times10^{22}\) cm⁻³).
<details><summary>Respuesta</summary><p>\(k_F=1.75\) Å⁻¹, \(E_F=11.7\) eV, \(v_F=2.03\times10^6\) m/s, \(T_F=1.36\times10^5\) K.</p></details></li>
<li><span class="lvl">Básico</span>Demuestre que la energía media por electrón del gas de Fermi a \(T=0\) es \(\tfrac35E_F\).
<details><summary>Respuesta</summary><p>\(\int_0^{E_F}E\,g\,\dd E/\int_0^{E_F}g\,\dd E\) con \(g\propto\sqrt E\): \((2/5)E_F^{5/2}/((2/3)E_F^{3/2})=\tfrac35E_F\).</p></details></li>
<li><span class="lvl">Intermedio</span>Con la expansión de Sommerfeld demuestre que \(\mu=E_F[1-\tfrac{\pi^2}{12}(T/T_F)^2]\).
<details><summary>Respuesta</summary><p>Aplique la expansión a \(H=g\): \(n=\int_0^\mu g+\tfrac{\pi^2}6(k_BT)^2g'(\mu)\). Con \(n=\int_0^{E_F}g\), \((\mu-E_F)g(E_F)\approx-\tfrac{\pi^2}6(k_BT)^2g'(E_F)\) y \(g'/g=1/(2E_F)\).</p></details></li>
<li><span class="lvl">Intermedio</span>En un gas de electrones bidimensional con \(n=3\times10^{11}\) cm⁻² y masa efectiva \(0.067m\) (heteroestructura de GaAs), calcule \(E_F\) y \(k_F\).
<details><summary>Respuesta</summary><p>\(g_{2D}=m^*/(\pi\hbar^2)\), \(E_F=n/g=\pi\hbar^2n/m^*=10.7\) meV; \(k_F=\sqrt{2\pi n}=1.37\times10^6\) cm⁻¹.</p></details></li>
<li><span class="lvl">Avanzado</span>Deduzca la ley de Richardson–Dushman contando los electrones con \(p_z>\sqrt{2m(E_F+W)}\) que llegan a la superficie, usando la cola de Boltzmann de la distribución.
<details><summary>Respuesta</summary><p>\(J=e\int\tfrac{2\,\dd^3p}{h^3}\tfrac{p_z}m\ee^{-(E-\mu)/k_BT}\); las integrales en \(p_x,p_y\) dan \(2\pi mk_BT\) y la de \(p_z\), \(mk_BT\ee^{-W/k_BT}\): \(J=4\pi emk_B^2T^2\ee^{-W/k_BT}/h^3\).</p></details></li>
</ol>
