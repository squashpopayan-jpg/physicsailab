<p class="lead">¿Por qué el silicio es gris y opaco, el vidrio transparente, el oro amarillo y una suspensión de nanopartículas de oro roja? La interacción de la luz con un sólido se resume en su función dieléctrica \(\varepsilon(\omega)\), y en ella se leen las brechas, los excitones, los electrones libres y sus oscilaciones colectivas. Este capítulo recorre las absorciones principales de semiconductores y metales.</p>

<section>
<h2>Constantes ópticas</h2>
<p>La luz en un medio se propaga con un índice complejo \(\tilde n=n+\ii\kappa=\sqrt{\varepsilon}\), de modo que \(\varepsilon_1=n^2-\kappa^2\) y \(\varepsilon_2=2n\kappa\). La intensidad decae como \(\ee^{-\alpha z}\) con el <span class="term">coeficiente de absorción</span></p>
<div class="eq key" data-name="Coeficiente de absorción">\[\alpha=\frac{2\omega\kappa}{c}=\frac{4\pi\kappa}{\lambda},\qquad R=\frac{(n-1)^2+\kappa^2}{(n+1)^2+\kappa^2}.\]</div>
<p>La profundidad de penetración \(1/\alpha\) va de metros en el vidrio a decenas de nanómetros en un metal. En el silicio cambia enormemente con el color: la luz azul (450 nm, \(\alpha\approx2.5\times10^4\) cm⁻¹) se absorbe en 0.4 µm, la roja (650 nm, \(3\times10^3\) cm⁻¹) en 3 µm y la del infrarrojo cercano (1000 nm, 60 cm⁻¹) en 160 µm: por eso las obleas de las celdas solares tienen unos 150 µm y llevan texturas para atrapar la luz.</p>
</section>

<section>
<h2>Absorción interbanda</h2>
<p>Un fotón de energía \(\hbar\omega>E_g\) puede llevar un electrón de la banda de valencia a la de conducción. En un semiconductor de brecha directa la transición es vertical y la probabilidad es proporcional a la densidad conjunta de estados, que para bandas parabólicas crece como \(\sqrt{\hbar\omega-E_g}\):</p>
<div class="eq key" data-name="Absorción directa">\[\alpha(\hbar\omega)\propto\frac{\sqrt{\hbar\omega-E_g}}{\hbar\omega}.\]</div>
<p>En uno de brecha indirecta hace falta además absorber o emitir un fonón de energía \(\hbar\Omega\) y momento que compense la diferencia de \(\vb k\). Es un proceso de segundo orden, y como se integra sobre todos los estados iniciales y finales,</p>
<div class="eq key" data-name="Absorción indirecta">\[\alpha\propto\frac{n_\Omega(\hbar\omega-E_g+\hbar\Omega)^2+(n_\Omega+1)(\hbar\omega-E_g-\hbar\Omega)^2}{\hbar\omega},\]</div>
<p>con \(n_\Omega\) la ocupación de Bose–Einstein. Las dos ramas (absorción y emisión del fonón) dan umbrales separados \(2\hbar\Omega\), y la de absorción desaparece a baja temperatura: así Macfarlane y colaboradores (1958) midieron los fonones que asisten la absorción del Si y del Ge. Las <span class="term">gráficas de Tauc</span> (\((\alpha\hbar\omega)^2\) o \((\alpha\hbar\omega)^{1/2}\) frente a \(\hbar\omega\)) linealizan las dos formas y dan la brecha por extrapolación. Una absorción directa es típicamente cien veces más fuerte: el GaAs absorbe la luz solar en un par de micras.</p>
<div class="sim" data-sim="absorcion" data-title="Absorción directa e indirecta y gráficas de Tauc"></div>
<div class="sim-guide"><ul>
<li>Izquierda: absorción de un semiconductor directo y de uno indirecto (con fonón de 58 meV, como el TA del silicio). Derecha: la gráfica de Tauc correspondiente, cuya extrapolación lineal da la brecha.</li>
<li>Enfríe el material: la rama de absorción de fonones se apaga y el umbral indirecto se corre en \(\hbar\Omega\).</li>
</ul></div>
</section>

<section>
<h2>Excitones</h2>
<p>El electrón y el hueco creados por el fotón se atraen. Si la atracción está apantallada por \(\varepsilon_r\) y las masas son las efectivas, forman un átomo de hidrógeno diluido, el <span class="term">excitón de Wannier–Mott</span>, con niveles por debajo de la brecha:</p>
<div class="eq key" data-name="Serie excitónica">\[E_n=E_g-\frac{R^*}{n^2},\qquad R^*=\frac{\mu/m}{\varepsilon_r^2}\,13.6\ \text{eV},\qquad a^*=\frac{\varepsilon_r}{\mu/m}\,a_0,\]</div>
<p>con \(\mu\) la masa reducida electrón–hueco. Para el GaAs, \(R^*\approx4.8\) meV (medido 4.2) y \(a^*=12\) nm: el excitón solo se ve como un pico estrecho a baja temperatura. En los materiales de brecha ancha y poco apantallamiento es mucho más robusto: 60 meV en el ZnO, y 92 meV en el Cu₂O, donde Evgenii Gross observó en 1952 la serie hidrogenoide completa; en 2014 se midieron excitones de Rydberg con \(n=25\), de 2 µm de diámetro. En los cristales iónicos y moleculares, con \(a^*\) menor que la distancia interatómica, el excitón queda en una sola celda (<span class="term">excitón de Frenkel</span>), con energías de enlace de 1 eV. La atracción también refuerza la absorción por encima de la brecha: el factor de Sommerfeld hace que el borde directo sea abrupto en lugar de crecer como una raíz (fórmula de Elliott, 1957).</p>
<div class="sim" data-sim="excitones" data-title="Absorción excitónica: fórmula de Elliott"></div>
<div class="sim-guide"><ul>
<li>Espectro de absorción con la serie de picos excitónicos (pesos \(\propto1/n^3\)) y el continuo reforzado por el factor de Sommerfeld; la línea discontinua es la absorción sin interacción, \(\propto\sqrt{E-E_g}\).</li>
<li>Aumente el ensanchamiento (temperatura): los picos se funden en un borde redondeado, como en el GaAs a temperatura ambiente.</li>
</ul></div>
</section>

<section>
<h2>Metales y plasmones</h2>
<p>En un metal los electrones libres reflejan la luz por debajo de la frecuencia de plasma (capítulo 10). El color de los metales nobles lo dan las transiciones interbanda desde la banda d: en el cobre empiezan cerca de 2.1 eV y en el oro hacia 2.4 eV, absorben el azul y dejan reflejados el rojo y el amarillo; en la plata empiezan a 3.9 eV, en el ultravioleta, y la plata refleja todo el visible. En el aluminio la reflectividad es alta hasta el ultravioleta lejano, por eso se usa en los espejos de los telescopios.</p>
<p>Las oscilaciones colectivas del gas de electrones son los <span class="term">plasmones</span>. En el volumen tienen frecuencia \(\omega_p\), donde \(\varepsilon=0\) (15 eV en el aluminio), y se excitan con electrones rápidos: un haz que atraviesa una lámina pierde energía en múltiplos de \(\hbar\omega_p\). En una superficie plana la condición es \(\varepsilon=-1\), y \(\omega_{sp}=\omega_p/\sqrt2\). En una esfera pequeña frente a la longitud de onda la polarizabilidad es \(4\pi R^3\varepsilon_0\varepsilon_m(\varepsilon-\varepsilon_m)/(\varepsilon+2\varepsilon_m)\), y resuena cuando \(\varepsilon=-2\varepsilon_m\): el <span class="term">plasmón de superficie localizado</span>. Para nanopartículas de oro en agua ocurre hacia 520 nm: absorben el verde y la suspensión se ve roja, como en la copa de Licurgo del siglo IV y los vitrales medievales. La posición depende del medio, base de los sensores de plasmón y de las pruebas rápidas de embarazo y de antígenos.</p>
<div class="sim" data-sim="plasmones" data-title="Plasmón de superficie de nanopartículas metálicas"></div>
<div class="sim-guide"><ul>
<li>Sección eficaz de extinción en la aproximación cuasiestática, con la función dieléctrica de Drude (con \(\varepsilon_\infty\) de los electrones d). La franja de color muestra el tono de la luz transmitida.</li>
<li>Aumente el índice del medio: la resonancia se corre al rojo. Es el principio de los biosensores de plasmón.</li>
<li>El modelo de Drude omite la absorción interbanda del oro por debajo de 500 nm; con ella el azul también se absorbe y la suspensión real se ve rojo rubí en lugar de anaranjada.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Qué espesor de silicio absorbe el 90 % de la luz de 650 nm (\(\alpha=3\times10^3\) cm⁻¹)?
<details><summary>Respuesta</summary><p>\(z=\ln10/\alpha=7.7\) µm.</p></details></li>
<li><span class="lvl">Básico</span>Calcule \(R^*\) y \(a^*\) del excitón del ZnO (\(\mu=0.19\), \(\varepsilon_r=8.1\)).
<details><summary>Respuesta</summary><p>\(R^*=13.6\times0.19/65.6=39\) meV (el medido, 60 meV, es mayor por el apantallamiento reducido a distancias cortas); \(a^*=2.3\) nm.</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que en la aproximación cuasiestática la resonancia de una esfera de Drude sin amortiguamiento en un medio \(\varepsilon_m\) ocurre en \(\omega=\omega_p/\sqrt{\varepsilon_\infty+2\varepsilon_m}\).
<details><summary>Respuesta</summary><p>\(\varepsilon=\varepsilon_\infty-\omega_p^2/\omega^2=-2\varepsilon_m\Rightarrow\omega^2=\omega_p^2/(\varepsilon_\infty+2\varepsilon_m)\).</p></details></li>
<li><span class="lvl">Intermedio</span>¿Por qué la absorción indirecta del silicio no desaparece a 0 K?
<details><summary>Respuesta</summary><p>La rama de emisión de un fonón tiene peso \(n_\Omega+1\), que vale 1 a temperatura cero.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que el factor de Sommerfeld \(\pi x\ee^{\pi x}/\senh(\pi x)\), con \(x=\sqrt{R^*/(E-E_g)}\), tiende a \(2\pi\sqrt{R^*/(E-E_g)}\) cerca de la brecha y que la absorción del continuo llega entonces a un valor finito.
<details><summary>Respuesta</summary><p>Para \(x\gg1\), \(\ee^{\pi x}/\senh\pi x\to2\) y el factor vale \(2\pi x\). Multiplicado por \(\sqrt{E-E_g}\) da \(2\pi\sqrt{R^*}\): un escalón en el borde en lugar de una raíz.</p></details></li>
</ol>
