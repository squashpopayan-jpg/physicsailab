<p class="lead">Todo lo que se repite en el cristal (la densidad de electrones, el potencial, las amplitudes de vibración) se escribe como una serie de Fourier cuyas frecuencias espaciales forman otra red: la red recíproca. Las ondas de rayos X, de electrones y de fonones se describen con vectores de onda que viven en ese espacio, y su celda de Wigner–Seitz, la primera zona de Brillouin, es el escenario donde se dibujan las bandas de energía y las relaciones de dispersión de todo el curso.</p>

<section>
<h2>Definición y construcción</h2>
<p>Dada una red de Bravais con vectores primitivos \(\vb a_1,\vb a_2,\vb a_3\), su <span class="term">red recíproca</span> es el conjunto de vectores \(\vb G\) tales que \(\ee^{\ii\vb G\cdot\vb R}=1\) para todo vector de red \(\vb R\). Está generada por</p>
<div class="eq key" data-name="Vectores recíprocos">\[\vb b_1=2\pi\frac{\vb a_2\times\vb a_3}{\vb a_1\cdot(\vb a_2\times\vb a_3)},\quad \vb b_2=2\pi\frac{\vb a_3\times\vb a_1}{\vb a_1\cdot(\vb a_2\times\vb a_3)},\quad \vb b_3=2\pi\frac{\vb a_1\times\vb a_2}{\vb a_1\cdot(\vb a_2\times\vb a_3)},\]</div>
<p>que cumplen \(\vb b_i\cdot\vb a_j=2\pi\delta_{ij}\). Entonces \(\vb G=m_1\vb b_1+m_2\vb b_2+m_3\vb b_3\) con \(m_i\) enteros da \(\vb G\cdot\vb R=2\pi(m_1n_1+m_2n_2+m_3n_3)\). La recíproca de la recíproca es la red original, y el volumen de la celda recíproca es \((2\pi)^3/V_c\).</p>
<p>La importancia de la red recíproca está en el análisis de Fourier. Una función con la periodicidad de la red, \(f(\vb r+\vb R)=f(\vb r)\), solo contiene las ondas planas que son periódicas:</p>
<div class="eq key" data-name="Serie de Fourier periódica">\[f(\vb r)=\sum_{\vb G}f_{\vb G}\,\ee^{\ii\vb G\cdot\vb r},\qquad f_{\vb G}=\frac1{V_c}\int_{\text{celda}}f(\vb r)\,\ee^{-\ii\vb G\cdot\vb r}\,\dd^3r .\]</div>
<p>En el capítulo 4 se verá que la amplitud de difracción de un cristal es proporcional a los coeficientes de Fourier \(n_{\vb G}\) de la densidad electrónica: un experimento de difracción mide directamente la red recíproca.</p>

<section>
<h2>Planos de red y vectores recíprocos</h2>
<p>Existe una correspondencia uno a uno entre las familias de planos de red y los vectores recíprocos más cortos en cada dirección. Para cada familia de planos separados una distancia \(d\) hay vectores recíprocos perpendiculares a ellos, y el más corto mide \(2\pi/d\). Recíprocamente, para cada \(\vb G\) los planos \(\vb G\cdot\vb r=\text{const}\) con \(\ee^{\ii\vb G\cdot\vb r}=1\) son planos de red. Por eso los índices de Miller tienen una definición más limpia que la de las intersecciones: \((hkl)\) son las coordenadas del vector recíproco más corto \(\vb G_{hkl}=h\vb b_1+k\vb b_2+l\vb b_3\) normal a los planos, y</p>
<div class="eq key" data-name="Distancia interplanar">\[d_{hkl}=\frac{2\pi}{|\vb G_{hkl}|}.\]</div>
<p>Para una red hexagonal se obtiene \(1/d^2=\tfrac43(h^2+hk+k^2)/a^2+l^2/c^2\); para una ortorrómbica, \(1/d^2=h^2/a^2+k^2/b^2+l^2/c^2\). El ángulo entre dos familias de planos es el ángulo entre sus vectores \(\vb G\).</p>
<div class="box ex"><h4>La recíproca de la fcc es bcc</h4><p>Con \(\vb a_1=\tfrac a2(0,1,1)\), \(\vb a_2=\tfrac a2(1,0,1)\), \(\vb a_3=\tfrac a2(1,1,0)\) y \(V_c=a^3/4\) se obtiene \(\vb b_1=\tfrac{2\pi}a(-1,1,1)\), \(\vb b_2=\tfrac{2\pi}a(1,-1,1)\), \(\vb b_3=\tfrac{2\pi}a(1,1,-1)\): los vectores primitivos de una red bcc de lado \(4\pi/a\). Los vectores recíprocos son \(\tfrac{2\pi}a(h,k,l)\) con \(h,k,l\) todos pares o todos impares. Los más cortos son los ocho \(\tfrac{2\pi}a(\pm1,\pm1,\pm1)\), normales a los planos compactos {111}.</p></div>
</section>

<section>
<h2>Zonas de Brillouin</h2>
<p>La <span class="term">primera zona de Brillouin</span> es la celda de Wigner–Seitz de la red recíproca: los puntos \(\vb k\) más cercanos al origen que a cualquier otro \(\vb G\). Sus caras están sobre los planos mediatrices de los vectores \(\vb G\), los <span class="term">planos de Bragg</span>, que cumplen</p>
<div class="eq key" data-name="Plano de Bragg">\[2\vb k\cdot\vb G=G^2 .\]</div>
<p>Esta es exactamente la condición de difracción del capítulo 4: una onda con vector \(\vb k\) sobre un plano de Bragg se refleja con \(\vb k'=\vb k-\vb G\) de igual módulo. Por eso los bordes de zona son donde las ondas en el cristal (electrones, fonones) dejan de propagarse libremente y se abren brechas.</p>
<p>La <span class="term">zona \(n\)-ésima</span> es el conjunto de puntos a los que se llega desde el origen cruzando exactamente \(n-1\) planos de Bragg. Las zonas superiores están fragmentadas en piezas, pero cada una tiene el mismo volumen que la primera y, trasladando sus piezas por vectores \(\vb G\), se rearma una primera zona completa. Esta propiedad sostiene el <span class="term">esquema de zona reducida</span>, en el que todos los estados se dibujan dentro de la primera zona.</p>
<div class="sim" data-sim="zonas2d" data-title="Zonas de Brillouin de las redes cuadrada y hexagonal"></div>
<div class="sim-guide"><ul>
<li>Cada color es una zona: un punto pertenece a la zona \(n\) si para llegar a él desde el centro se cruzan \(n-1\) planos de Bragg (las líneas grises).</li>
<li>La lectura mide el área de cada zona contando píxeles: todas son iguales a la de la primera. Active «zona reducida» para ver cómo las piezas trasladadas rellenan la primera zona.</li>
</ul></div>
</section>

<section>
<h2>Zonas de Brillouin en tres dimensiones</h2>
<p>La primera zona de la red fcc es un <span class="term">octaedro truncado</span> con 8 caras hexagonales (normales a ⟨111⟩) y 6 cuadradas (normales a ⟨100⟩), 24 vértices y volumen \(4(2\pi/a)^3\). La de la red bcc es un <span class="term">dodecaedro rómbico</span> de 12 caras y 14 vértices. Los puntos y líneas de alta simetría tienen nombres estandarizados (Bouckaert, Smoluchowski y Wigner, 1936) que se usan en todas las figuras de bandas:</p>

<tr><th>Red</th><th>Punto</th><th class="c">Coordenadas (unidades de \(2\pi/a\))</th><th>Significado</th></tr>

<tr><td>X</td><td class="c">(0, 1, 0)</td><td>centro de la cara cuadrada</td></tr>
<tr><td>L</td><td class="c">(½, ½, ½)</td><td>centro de la cara hexagonal</td></tr>
<tr><td>W</td><td class="c">(½, 1, 0)</td><td>vértice</td></tr>
<tr><td>K, U</td><td class="c">(¾, ¾, 0), (¼, 1, ¼)</td><td>punto medio de arista entre dos hexágonos / hexágono y cuadrado</td></tr>
<tr><td rowspan="3">bcc</td><td>H</td><td class="c">(0, 1, 0)</td><td>vértice de cuatro caras</td></tr>
<tr><td>N</td><td class="c">(½, ½, 0)</td><td>centro de cara</td></tr>

<p>Las líneas Γ–X, Γ–L y Γ–K se llaman Δ, Λ y Σ. Para el cobre (\(a=3.615\) Å), \(\Gamma X=2\pi/a=1.74\) Å⁻¹ y \(\Gamma L=\sqrt3\pi/a=1.51\) Å⁻¹: la zona no es una esfera, y esa anisotropía hará que la superficie de Fermi del cobre toque las caras hexagonales.</p>

<section>
<h2>Condiciones de contorno periódicas y conteo de estados</h2>
<p>Un cristal real tiene \(N=N_1N_2N_3\) celdas. Para no tratar la superficie se imponen las <span class="term">condiciones de Born–von Kármán</span>: la función de onda se repite después de \(N_i\) celdas en cada dirección, \(\psi(\vb r+N_i\vb a_i)=\psi(\vb r)\). Las ondas planas permitidas tienen entonces</p>
<div class="eq key" data-name="Vectores k permitidos">\[\vb k=\frac{m_1}{N_1}\vb b_1+\frac{m_2}{N_2}\vb b_2+\frac{m_3}{N_3}\vb b_3,\qquad m_i\ \text{enteros}.\]</div>
<p>Cada \(\vb k\) ocupa un volumen \((2\pi)^3/V\) del espacio recíproco, con \(V=NV_c\) el volumen del cristal, y en la primera zona caben exactamente \(N\) valores de \(\vb k\): tantos como celdas. Este resultado es la base de todos los conteos del curso: hay \(N\) modos de vibración por rama de fonones, y cada banda electrónica admite \(2N\) electrones. Para sumas sobre \(\vb k\) en un cristal macroscópico se usa</p>
<div class="eq">\[\sum_{\vb k}F(\vb k)\;\longrightarrow\;\frac{V}{(2\pi)^3}\int F(\vb k)\,\dd^3k .\]</div>
<div class="sim" data-sim="puntosk" data-title="Valores de k permitidos en un cristal finito"></div>
<div class="sim-guide"><ul>
<li>Un cristal de \(N\times N\) celdas tiene \(N^2\) valores de \(\vb k\) en la primera zona. Aumente \(N\): la malla se vuelve un continuo.</li>
<li>En la red hexagonal la malla sigue los vectores recíprocos; los puntos en el borde de la zona se cuentan una sola vez porque los bordes opuestos son equivalentes.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Demuestre que la red recíproca de la bcc de lado \(a\) es una fcc de lado \(4\pi/a\).
<details><summary>Respuesta</summary><p>Con \(\vb a_1=\tfrac a2(-1,1,1)\) etc. y \(V_c=a^3/2\) resulta \(\vb b_1=\tfrac{2\pi}a(0,1,1)\), \(\vb b_2=\tfrac{2\pi}a(1,0,1)\), \(\vb b_3=\tfrac{2\pi}a(1,1,0)\): los vectores primitivos de una fcc de lado \(4\pi/a\).</p></details></li>
<li><span class="lvl">Básico</span>¿Cuál es el volumen de la primera zona de Brillouin del cobre (\(a=3.615\) Å) y cuántos vectores \(\vb k\) contiene por centímetro cúbico de cristal?
<details><summary>Respuesta</summary><p>\(4(2\pi/a)^3=21.0\) Å⁻³; tantos \(\vb k\) como celdas primitivas: \(4/a^3=8.47\times10^{22}\) cm⁻³.</p></details></li>
<li><span class="lvl">Intermedio</span>Deduzca la fórmula de \(d_{hkl}\) para una red hexagonal con \(\vb a_1=a(1,0,0)\), \(\vb a_2=a(-\tfrac12,\tfrac{\sqrt3}2,0)\), \(\vb a_3=c\,\uv z\).
<details><summary>Respuesta</summary><p>\(\vb b_1=\tfrac{2\pi}a(1,\tfrac1{\sqrt3},0)\), \(\vb b_2=\tfrac{2\pi}a(0,\tfrac2{\sqrt3},0)\), \(\vb b_3=\tfrac{2\pi}c\uv z\); \(|\vb G|^2=(2\pi)^2[\tfrac43(h^2+hk+k^2)/a^2+l^2/c^2]\).</p></details></li>
<li><span class="lvl">Intermedio</span>Muestre que el área de la segunda zona de Brillouin de la red cuadrada es igual a la de la primera.
<details><summary>Respuesta</summary><p>La segunda zona es el cuadrado girado de vértices \((\pm2\pi/a,0)\), \((0,\pm2\pi/a)\) menos el primero: área \(2(2\pi/a)^2-(2\pi/a)^2=(2\pi/a)^2\). Sus cuatro triángulos, trasladados por \(\vb G\), rearman la primera zona.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que la transformada de Fourier de una función periódica solo es no nula en los vectores de la red recíproca, y que \(\sum_{\vb R}\ee^{\ii\vb k\cdot\vb R}=N\) si \(\vb k\) es un \(\vb G\) y 0 en otro caso (para los \(\vb k\) permitidos por las condiciones de Born–von Kármán).
<details><summary>Respuesta</summary><p>La suma factoriza en tres sumas geométricas \(\sum_{n=0}^{N_i-1}\ee^{2\pi\ii m_in/N_i}\), que valen \(N_i\) si \(m_i/N_i\) es entero y 0 si no. Una función periódica integrada contra \(\ee^{-\ii\vb k\cdot\vb r}\) es la suma de las integrales en cada celda multiplicadas por \(\ee^{-\ii\vb k\cdot\vb R}\).</p></details></li>
</ol>
