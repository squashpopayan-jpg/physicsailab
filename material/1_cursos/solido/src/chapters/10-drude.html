<p class="lead">Tres años después del descubrimiento del electrón, Paul Drude (1900) explicó la conducción de los metales con una idea audaz: los electrones de valencia se desprenden de los átomos y forman un gas que se mueve entre los iones, chocando de vez en cuando. Con solo dos parámetros, la densidad de electrones y el tiempo entre choques, el modelo explica la ley de Ohm, el efecto Hall, la reflectividad de los metales y la razón universal entre conductividad térmica y eléctrica. Sus fracasos, igual de instructivos, prepararon el camino a la mecánica cuántica.</p>

<section>
<h2>El gas de electrones de conducción</h2>
<p>En un metal de valencia \(Z\) cada átomo aporta \(Z\) electrones de conducción; los demás quedan ligados al núcleo formando un ion. La densidad de electrones es \(n=ZN_A\rho_m/M\), entre \(10^{22}\) y \(2.5\times10^{23}\) cm⁻³: mil veces la de un gas en condiciones normales. Se suele expresar con el radio \(r_s\) de la esfera que contiene en promedio un electrón, \(\tfrac43\pi r_s^3=1/n\), que vale de 2 a 6 radios de Bohr.</p>
<p>Drude supuso que entre choques los electrones se mueven libremente (sin interactuar entre sí ni con los iones, salvo en el choque), que los choques son instantáneos y ocurren con probabilidad \(\dd t/\tau\) por unidad de tiempo, y que tras cada choque el electrón sale con una velocidad al azar correspondiente a la temperatura local. El parámetro \(\tau\) es el <span class="term">tiempo de relajación</span>.</p>
</section>

<section>
<h2>Conductividad eléctrica</h2>
<p>En un campo \(\vb E\) el momento medio \(\vb p\) de un electrón obedece</p>
<div class="eq key" data-name="Ecuación de Drude">\[\frac{\dd\vb p}{\dd t}=-\frac{\vb p}{\tau}-e\vb E ,\]</div>
<p>donde el primer término es la «fricción» de los choques. En estado estacionario la velocidad de arrastre es \(\vb v_d=-e\tau\vb E/m\) y la densidad de corriente \(\vb j=-ne\vb v_d\):</p>
<div class="eq key" data-name="Conductividad de Drude">\[\vb j=\sigma\vb E,\qquad \sigma=\frac{ne^2\tau}{m}.\]</div>
<p>Con las resistividades medidas se obtienen tiempos de relajación de \(10^{-14}\) s a temperatura ambiente: 2.7×10⁻¹⁴ s en el cobre, 3.2×10⁻¹⁴ s en el sodio. Las velocidades de arrastre son diminutas: con 1 A/mm² en un cable de cobre, \(v_d=j/(ne)=0.07\) mm/s.</p>
<div class="box ex"><h4>El recorrido libre medio del cobre</h4><p>Drude estimó la velocidad de los electrones con la equipartición, \(\sqrt{3k_BT/m}=1.2\times10^5\) m/s a 300 K, y obtuvo un recorrido libre medio \(\ell=v\tau=3\) Å, la distancia entre átomos: parecía confirmar que los electrones chocan con los iones. Pero la velocidad correcta es la de Fermi (capítulo 11), \(v_F=1.57\times10^6\) m/s, y entonces \(\ell=42\) nm, más de cien distancias interatómicas. A 4 K, en cobre puro, el recorrido llega a milímetros. Los electrones no chocan con los iones de una red perfecta (el teorema de Bloch del capítulo 12 lo explica); chocan con sus vibraciones y con las imperfecciones.</p></div>
<div class="sim" data-sim="drude-gas" data-title="Electrones que chocan: arrastre y ley de Ohm"></div>
<div class="sim-guide"><ul>
<li>Cada electrón se mueve en línea recta y cambia de dirección al azar con probabilidad \(\dd t/\tau\); el campo lo acelera entre choques. La lectura promedia la velocidad de arrastre y la compara con \(-e\tau E/m\).</li>
<li>Duplique \(\tau\) o \(E\): el arrastre se duplica. La agitación térmica es mucho mayor que el arrastre, pero se promedia a cero.</li>
</ul></div>
</section>

<section>
<h2>Resistividad y temperatura</h2>
<p>Las distintas causas de choque se suman en las tasas: \(1/\tau=1/\tau_{imp}+1/\tau_{fon}(T)\). Es la <span class="term">regla de Matthiessen</span>: \(\rho(T)=\rho_0+\rho_{fon}(T)\), con una resistividad residual \(\rho_0\) debida a impurezas y defectos, independiente de \(T\), y una parte de los fonones que se anula en el cero absoluto. La razón \(\rho(300\,\text K)/\rho(4\,\text K)\), el <span class="term">cociente de resistividad residual</span> (RRR), mide la pureza de un metal: 50 en cobre comercial y más de 10 000 en cobre ultrapuro recocido.</p>
<p>La teoría de la dispersión por fonones da la <span class="term">ley de Bloch–Grüneisen</span>:</p>
<div class="eq key" data-name="Bloch–Grüneisen">\[\rho_{fon}(T)=A\left(\frac T{\theta_R}\right)^5\int_0^{\theta_R/T}\frac{x^5\,\dd x}{(\ee^x-1)(1-\ee^{-x})},\]</div>
<p>lineal en \(T\) por encima de \(\theta_R\approx\theta_D\) (el número de fonones crece como \(T\)) y proporcional a \(T^5\) a baja temperatura: hay pocos fonones y además solo desvían al electrón un ángulo pequeño. Con \(\theta_R=320\) K y \(A\) ajustada a 1.55 µΩ·cm a 0 °C, la fórmula da 0.21 µΩ·cm para el cobre a 77 K, igual al valor medido.</p>
<div class="sim" data-sim="bloch-gruneisen" data-title="Resistividad de un metal: Matthiessen y Bloch–Grüneisen"></div>
<div class="sim-guide"><ul>
<li>La curva total es la suma de la residual y la de fonones. Aumente la impureza: la curva se traslada hacia arriba sin cambiar de forma (regla de Matthiessen).</li>
<li>En la escala logarítmica la parte de fonones muestra la pendiente 5 a baja temperatura y 1 a alta.</li>
</ul></div>
</section>

<section>
<h2>El efecto Hall</h2>
<p>Edwin Hall descubrió en 1879 que al pasar corriente por una lámina en un campo magnético perpendicular aparece un voltaje transversal. Los portadores se desvían por la fuerza de Lorentz hasta que la carga acumulada en los bordes crea un campo \(E_y\) que la compensa. En el estado estacionario \(E_y=R_Hj_xB\) con el <span class="term">coeficiente de Hall</span></p>
<div class="eq key" data-name="Coeficiente de Hall">\[R_H=\frac{E_y}{j_xB}=-\frac1{ne},\]</div>
<p>que no depende de \(\tau\): mide directamente la densidad y el signo de los portadores. La tabla compara \(-1/(R_Hne)\), con \(n\) de la valencia, con el valor medido en campos altos.</p>
<div class="tablewrap"><table>
<tr><th>Metal</th><th class="c">Valencia</th><th class="c">−1/(R_H n e)</th><th>Metal</th><th class="c">Valencia</th><th class="c">−1/(R_H n e)</th></tr>
<tr><td>Li</td><td class="c">1</td><td class="c">0.8</td><td>Ag</td><td class="c">1</td><td class="c">1.3</td></tr>
<tr><td>Na</td><td class="c">1</td><td class="c">1.2</td><td>Au</td><td class="c">1</td><td class="c">1.5</td></tr>
<tr><td>K</td><td class="c">1</td><td class="c">1.1</td><td>Be</td><td class="c">2</td><td class="c">−0.2</td></tr>
<tr><td>Cu</td><td class="c">1</td><td class="c">1.5</td><td>Al</td><td class="c">3</td><td class="c">−0.3</td></tr>
</table></div>
<p>Los alcalinos se acercan al valor 1 del modelo. Pero el berilio, el magnesio y el aluminio tienen \(R_H\) <b>positivo</b>, como si la corriente la llevaran cargas positivas. Ningún modelo de electrones libres lo explica; la explicación son los <span class="term">huecos</span> de las bandas casi llenas (capítulo 16).</p>

<li>La lectura calcula \(V_H=IB/(nqt)\) para una lámina del material elegido.</li>

<section>
<h2>Conductividad de alterna y frecuencia de plasma</h2>
<p>Con un campo \(E(t)=E_0\ee^{-\ii\omega t}\) la ecuación de Drude da una conductividad compleja y, a través de las ecuaciones de Maxwell, una función dieléctrica:</p>
<div class="eq key" data-name="Drude en alterna">\[\sigma(\omega)=\frac{\sigma_0}{1-\ii\omega\tau},\qquad \varepsilon(\omega)=1-\frac{\omega_p^2}{\omega^2+\ii\omega/\tau},\qquad \omega_p^2=\frac{ne^2}{\varepsilon_0m}.\]</div>
<p>Para \(\omega\tau\gg1\) y \(\omega<\omega_p\), \(\varepsilon\) es negativa, el índice de refracción es imaginario y el metal refleja casi toda la radiación: por eso los metales brillan. Por encima de la <span class="term">frecuencia de plasma</span> \(\omega_p\) la función dieléctrica es positiva y el metal se vuelve transparente. Para el sodio, \(\hbar\omega_p=6.0\) eV: el metal debe transmitir por debajo de 205 nm, y Wood observó en 1933 que los alcalinos son transparentes en el ultravioleta, el sodio por debajo de unos 210 nm. En la plata los electrones d agregan una polarizabilidad de fondo \(\varepsilon_\infty\approx3.7\) que desplaza el borde a \(\hbar\omega_p/\sqrt{\varepsilon_\infty}\approx3.8\) eV, en el ultravioleta cercano; en el cobre y el oro, la absorción de esos electrones d cae en el visible y les da su color.</p>
<div class="sim" data-sim="drude-optica" data-title="Reflectividad de un metal de Drude"></div>
<div class="sim-guide"><ul>
<li>Reflectividad a incidencia normal calculada con \(\varepsilon(\omega)\) de Drude. La franja de colores marca el visible. Compare sodio, aluminio y plata.</li>
<li>Reduzca \(\tau\): el borde de plasma se suaviza y la reflectividad por debajo de \(\omega_p\) baja de 100 %.</li>
</ul></div>
</section>

<section>
<h2>Conducción del calor y ley de Wiedemann–Franz</h2>
<p>Gustav Wiedemann y Rudolph Franz observaron en 1853 que la razón \(\kappa/\sigma\) es casi la misma para todos los metales a una temperatura dada, y Ludvig Lorenz notó en 1872 que es proporcional a \(T\). Drude lo explicó: los mismos electrones transportan carga y calor. Con la teoría cinética, \(\kappa=\tfrac13c_vv^2\tau\), y la razón no depende de \(\tau\) ni de \(n\). Drude obtuvo \(\tfrac32(k_B/e)^2T\), con dos errores de un factor 100 que se cancelaban (el calor específico electrónico clásico es cien veces mayor que el real y \(v^2\) clásica cien veces menor que \(v_F^2\)). La teoría de Sommerfeld da el valor correcto:</p>
<div class="eq key" data-name="Ley de Wiedemann–Franz">\[\frac{\kappa}{\sigma T}=L_0=\frac{\pi^2}3\left(\frac{k_B}e\right)^2=2.44\times10^{-8}\ \text{W Ω K}^{-2}.\]</div>
<p>Los valores medidos a 273 K son 2.20×10⁻⁸ (Cu), 2.31×10⁻⁸ (Ag), 2.35×10⁻⁸ (Au), 2.14×10⁻⁸ (Al) y 2.12×10⁻⁸ (Na). La ley se cumple a temperatura ambiente y a temperaturas muy bajas, donde dominan los choques elásticos con impurezas; falla en el intervalo intermedio, donde los fonones degradan la corriente térmica más que la eléctrica.</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>El aluminio tiene \(\rho=2.45\) µΩ·cm a 273 K y \(n=18.1\times10^{22}\) cm⁻³. Calcule \(\tau\) y el recorrido libre medio con \(v_F=2.03\times10^6\) m/s.
<details><summary>Respuesta</summary><p>\(\tau=m/(\rho ne^2)=8.0\times10^{-15}\) s; \(\ell=v_F\tau=16\) nm.</p></details></li>
<li><span class="lvl">Básico</span>Una cinta de cobre de 0.1 mm de espesor lleva 10 A en un campo de 1 T. ¿Cuál es el voltaje de Hall?
<details><summary>Respuesta</summary><p>\(V_H=IB/(net)=10\times1/(8.47\times10^{28}\times1.6\times10^{-19}\times10^{-4})=7.4\) µV.</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que en el modelo de Drude la magnetorresistencia es nula: \(\rho_{xx}\) no depende de \(B\).
<details><summary>Respuesta</summary><p>En estado estacionario \(\vb E=\rho_0\vb j+R_H\vb B\times\vb j\) con \(\vb B\perp\vb j\); la componente de \(\vb E\) paralela a \(\vb j\) es \(\rho_0j\), independiente de \(B\). Una magnetorresistencia no nula requiere varios tipos de portadores (capítulo 16).</p></details></li>
<li><span class="lvl">Intermedio</span>Calcule la frecuencia de plasma del potasio (\(n=1.40\times10^{22}\) cm⁻³) y la longitud de onda por debajo de la cual es transparente.
<details><summary>Respuesta</summary><p>\(\hbar\omega_p=4.39\) eV, \(\lambda_p=282\) nm (se mide transparencia por debajo de unos 315 nm; la diferencia se atribuye a la masa efectiva y a la polarización del ion).</p></details></li>
<li><span class="lvl">Avanzado</span>Muestre que la regla de suma \(\int_0^\infty\Rea\sigma(\omega)\,\dd\omega=\pi ne^2/(2m)\) se cumple con la conductividad de Drude, independientemente de \(\tau\).
<details><summary>Respuesta</summary><p>\(\Rea\sigma=\sigma_0/(1+\omega^2\tau^2)\); \(\int_0^\infty\dd\omega/(1+\omega^2\tau^2)=\pi/(2\tau)\), y \(\sigma_0\pi/(2\tau)=\pi ne^2/(2m)\).</p></details></li>
</ol>
