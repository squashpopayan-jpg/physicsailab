<p class="lead">El estado ordenado de un ferromagneto también tiene excitaciones: los espines pueden precesar en fase alrededor de la dirección de magnetización, formando ondas que, cuantizadas, son los magnones. Este capítulo las estudia, junto con los otros tipos de orden (antiferromagnético y ferrimagnético) y con la estructura de dominios, que decide el comportamiento macroscópico de un imán: su histéresis, su coercitividad y su utilidad para guardar información o transformar energía.</p>

<section>
<h2>Ondas de espín y magnones</h2>
<p>En el estado fundamental de una cadena ferromagnética de Heisenberg todos los espines apuntan igual. La excitación más baja no es invertir un espín (cuesta \(8JS\) en una cadena), sino repartir la inversión entre todos: cada espín precesa alrededor del eje con un pequeño ángulo, y la fase avanza de un sitio al siguiente como en una onda. Tratando cada espín como un momento angular en el campo de intercambio de sus vecinos se obtiene la relación de dispersión</p>
<div class="eq key" data-name="Magnones de la cadena">\[\hbar\omega=4JS\left(1-\cos ka\right)\;\xrightarrow{ka\ll1}\;2JSa^2k^2 .\]</div>
<p>Es cuadrática a longitud de onda larga, a diferencia de los fonones: el ferromagneto no tiene un «sonido magnético» lineal. En tres dimensiones \(\hbar\omega=Dk^2\) con la <span class="term">rigidez de espín</span> \(D\) (281 meV·Å² en el hierro, medida por dispersión inelástica de neutrones). Cuantizadas, estas ondas son los <span class="term">magnones</span>, bosones que reducen cada uno la magnetización en una unidad de \(g\mu_B\).</p>

<li>Cada flecha es un espín que precesa alrededor del eje vertical; la fase avanza \(ka\) de un sitio al siguiente. Abajo la relación de dispersión con el modo elegido.</li>
</ul></div>
</section>

<section>
<h2>La ley \(T^{3/2}\) de Bloch</h2>
<p>A baja temperatura la magnetización disminuye por los magnones excitados térmicamente. Con \(\hbar\omega=Dk^2\) y la ocupación de Bose–Einstein, el número de magnones por unidad de volumen es \(\int\dd^3k/(2\pi)^3\,(\ee^{Dk^2/k_BT}-1)^{-1}\propto T^{3/2}\). Felix Bloch obtuvo en 1930</p>
<div class="eq key" data-name="Ley de Bloch">\[\frac{\Delta M}{M(0)}=\frac{0.0587}{SQ}\left(\frac{k_BT}{2JS}\right)^{3/2},\]</div>
<p>con \(Q=1,2,4\) para las redes sc, bcc y fcc (el coeficiente es \(\zeta(3/2)/(4\pi)^{3/2}\)). La ley se cumple muy bien en el hierro y el níquel por debajo de un tercio de \(T_C\), mientras que el campo medio predice una caída exponencial. En dos dimensiones la integral diverge: no hay ferromagnetismo de Heisenberg a temperatura finita en dos dimensiones (teorema de Mermin y Wagner, 1966), a menos que haya anisotropía, como en el modelo de Ising.</p>

<li>Caída relativa de la magnetización con la ley de Bloch y con el campo medio (\(J=S\)), en escala logarítmica para mostrar las pendientes 3/2 y la caída exponencial.</li>
</ul></div>
</section>

<section>
<h2>Antiferromagnetismo y ferrimagnetismo</h2>
<p>Si \(J<0\) los vecinos se antialinean y la red se divide en dos subredes con magnetizaciones opuestas. Louis Néel desarrolló en 1936 la teoría de campo medio con dos subredes: por encima de la <span class="term">temperatura de Néel</span> \(T_N\) la susceptibilidad sigue \(\chi=C/(T+\theta)\), con \(\theta>0\) (en el MnO, \(T_N=116\) K y \(\theta=610\) K); por debajo depende de la dirección del campo. Si es paralelo a los espines, \(\chi_\parallel\) cae a cero en \(T=0\) (no hay espines que invertir); si es perpendicular, \(\chi_\perp\) se mantiene constante (los espines se inclinan un poco). Clifford Shull y J. Samuel Smart (1949) demostraron el orden antiferromagnético del MnO por difracción de neutrones: por debajo de \(T_N\) aparecen picos magnéticos en posiciones que corresponden a una celda magnética del doble de tamaño. Los magnones antiferromagnéticos tienen dispersión lineal, \(\hbar\omega=4|J|S|\sen ka|\).</p>
<p>Si las dos subredes tienen momentos distintos el resultado es un <span class="term">ferrimagneto</span>, con magnetización neta. La magnetita Fe₃O₄, el imán natural conocido desde la Antigüedad, es ferrimagnética: los Fe³⁺ de los sitios tetraédricos se oponen a los Fe²⁺ y Fe³⁺ de los octaédricos y queda el momento de los Fe²⁺, 4 \(\mu_B\) por fórmula (medido 4.1). Las ferritas y el granate de itrio y hierro (YIG) son aislantes magnéticos usados en microondas.</p>
<div class="sim" data-sim="antiferro" data-title="Susceptibilidad de un antiferromagneto de campo medio"></div>
<div class="sim-guide"><ul>
<li>Susceptibilidades paralela, perpendicular y de un polvo (\(\tfrac13\chi_\parallel+\tfrac23\chi_\perp\)) en la teoría de dos subredes con \(S=1/2\), y la inversa \(1/\chi\) con su extrapolación a \(-\theta\).</li>
</ul></div>
</section>

<section>
<h2>Dominios y paredes</h2>
<p>¿Por qué un clavo de hierro no está magnetizado aunque cada región sí lo esté? Lev Landau y Evgeny Lifshitz (1935) mostraron que la magnetización se divide en <span class="term">dominios</span> para reducir la energía magnetostática del campo que sale de la muestra. Entre dominios hay <span class="term">paredes</span> donde la magnetización gira gradualmente. El intercambio (rigidez \(A\), en J/m) prefiere paredes anchas; la <span class="term">anisotropía magnetocristalina</span> (densidad \(K\sen^2\theta\), en J/m³), que favorece ciertas direcciones del cristal, prefiere paredes estrechas. El compromiso da una pared de Bloch con perfil \(\theta(x)=2\arctan\ee^{x/\delta_0}\), \(\delta_0=\sqrt{A/K}\), y</p>
<div class="eq key" data-name="Pared de Bloch">\[\delta=\pi\sqrt{\frac AK},\qquad \sigma=4\sqrt{AK}.\]</div>
<p>En el hierro (\(A=2.1\times10^{-11}\) J/m, \(K=4.8\times10^4\) J/m³) la pared mide unos 66 nm y cuesta 4 mJ/m²; en el NdFeB, con anisotropía cien veces mayor, unos 4 nm. Los dominios se observan con la técnica de Bitter (polvo magnético), por efecto Kerr magneto-óptico y con microscopía de fuerza magnética.</p>
<div class="sim" data-sim="pared" data-title="Perfil de una pared de Bloch"></div>
<div class="sim-guide"><ul>
<li>El ángulo de la magnetización a través de la pared y las flechas que giran. Cambie \(A\) y \(K\): la anchura escala como \(\sqrt{A/K}\) y la energía como \(\sqrt{AK}\).</li>
</ul></div>
</section>

<section>
<h2>Histéresis: la partícula de Stoner–Wohlfarth</h2>
<p>Una partícula más pequeña que el ancho de una pared es un dominio único. Edmund Stoner y Erich Wohlfarth (1948) estudiaron su inversión: con anisotropía uniaxial y un campo a un ángulo \(\psi\) del eje fácil, la energía por volumen es \(K\sen^2\theta-\mu_0M_sH\cos(\theta-\psi)\). La magnetización sigue un mínimo local hasta que este desaparece y salta al otro: la curva de histéresis. El campo de inversión, en unidades de \(H_K=2K/\mu_0M_s\), dibuja una <span class="term">astroide</span>:</p>
<div class="eq key" data-name="Astroide de Stoner–Wohlfarth">\[h_{sw}(\psi)=\left(\cos^{2/3}\psi+\sen^{2/3}\psi\right)^{-3/2},\]</div>
<p>que vale 1 a lo largo del eje fácil y 1/2 a 45°. Los imanes duros (NdFeB, SmCo, ferritas) buscan coercitividades altas con anisotropías grandes y granos aislados; los materiales blandos (hierro silicio de los transformadores, permalloy, aleaciones amorfas) buscan anisotropía casi nula y paredes que se muevan con facilidad para reducir las pérdidas. En los discos duros y las memorias MRAM cada bit es una pequeña región magnética que se invierte con un campo o con una corriente polarizada en espín.</p>
<div class="sim" data-sim="stoner-wohlfarth" data-title="Partícula de Stoner–Wohlfarth: ciclo de histéresis y astroide"></div>
<div class="sim-guide"><ul>
<li>Izquierda: ciclo \(m(h)\) para el ángulo \(\psi\) elegido, calculado siguiendo el mínimo local de la energía. Derecha: la astroide; los saltos del ciclo ocurren donde el campo la cruza (el curso valida el campo de inversión numérico contra la fórmula).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule el ancho y la energía de una pared en el níquel (\(A=0.9\times10^{-11}\) J/m, \(K=4.5\times10^3\) J/m³).
<details><summary>Respuesta</summary><p>\(\delta=\pi\sqrt{2\times10^{-15}}=140\) nm; \(\sigma=4\sqrt{4.05\times10^{-8}}=0.8\) mJ/m².</p></details></li>
<li><span class="lvl">Básico</span>Para el MnO (\(T_N=116\) K, \(\theta=610\) K), ¿a qué temperatura extrapola a cero \(1/\chi\)?
<details><summary>Respuesta</summary><p>En \(T=-\theta=-610\) K. La razón \(\theta/T_N=5.3\) indica interacciones con segundos vecinos frustradas.</p></details></li>
<li><span class="lvl">Intermedio</span>Deduzca \(\hbar\omega=4JS(1-\cos ka)\) para la cadena tratando cada espín como un momento que precesa en el campo de intercambio de sus dos vecinos.
<details><summary>Respuesta</summary><p>\(\hbar\,\dd\vb S_p/\dd t=2J\vb S_p\times(\vb S_{p-1}+\vb S_{p+1})\); linealizando con \(S^z\approx S\) y \(S^x+\ii S^y\propto\ee^{\ii(pka-\omega t)}\) resulta \(\hbar\omega=2JS(2-2\cos ka)\).</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que en el modelo de Stoner–Wohlfarth con el campo a lo largo del eje fácil el ciclo es rectangular con \(h_c=1\).
<details><summary>Respuesta</summary><p>Con \(\psi=0\), \(e=\tfrac12\sen^2\theta-h\cos\theta\). El mínimo en \(\theta=0\) es estable mientras \(e''(0)=1+h>0\): se pierde en \(h=-1\), donde salta a \(\theta=\pi\).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que el número de magnones en un ferromagneto bidimensional de Heisenberg diverge a cualquier \(T>0\).
<details><summary>Respuesta</summary><p>\(n\propto\int_0\frac{k\,\dd k}{\ee^{Dk^2/k_BT}-1}\approx\int_0\frac{k_BT}{Dk}\dd k\), divergente logarítmicamente en \(k\to0\): el orden se destruye (Mermin–Wagner).</p></details></li>
</ol>
