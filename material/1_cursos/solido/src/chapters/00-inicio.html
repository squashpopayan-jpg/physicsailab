    <h1 class="home-title">Física del Estado Sólido<span>del átomo al cristal</span></h1>
    <p class="home-lead">Un curso completo de física del estado sólido: la geometría de los cristales y su red recíproca, la difracción, el enlace, las vibraciones de la red y los fonones, el calor específico y la conducción del calor, los electrones libres de Drude y Sommerfeld, el teorema de Bloch y las bandas de energía, la dinámica de los electrones en campos eléctricos y magnéticos, los semiconductores y sus dispositivos, las nanoestructuras, la respuesta dieléctrica y óptica, el magnetismo, la superconductividad y los defectos. Cada capítulo deduce los resultados desde los principios, los aplica con ejemplos resueltos y los pone a prueba con simulaciones de parámetros ajustables. Las estructuras se comprueban con spglib, la difracción y las sumas de Madelung con pymatgen, las redes y las zonas de Brillouin con ASE, y los cálculos con SciPy, soluciones exactas y datos experimentales publicados.</p>

<div class="home-howto">
  <div><b>Cristales, ondas y electrones</b><p>La periodicidad de la red organiza todo: la difracción revela la red recíproca, las vibraciones se vuelven fonones con relaciones de dispersión, y los electrones forman bandas separadas por brechas que deciden si un sólido conduce o aísla.</p></div>
  <div><b>Simulaciones con parámetros</b><p>Celdas y zonas de Brillouin en 3D, patrones de difracción de polvo, cadenas de átomos que vibran, calor específico de Debye, esferas de Fermi, bandas de Kronig–Penney y del silicio, oscilaciones de Bloch, la mariposa de Hofstadter, uniones p–n resueltas con Poisson, el modelo de Ising y la brecha superconductora.</p></div>
  <div><b>Validado contra referencias</b><p>Más de ochocientas pruebas automáticas: grupos espaciales con spglib, difracción y constantes de Madelung con pymatgen, puntos especiales y celdas de Voronoi con ASE y scipy.spatial, integrales y raíces con SciPy y mpmath, y datos de Kittel, Ashcroft–Mermin y Sze.</p></div>
  <div><b>Ejemplos con contexto</b><p>El silicio de las celdas solares, el cobre de los cables, el LED del celular, los imanes de un motor, la resonancia magnética del hospital y los cables superconductores del LHC. Problemas con respuesta en tres niveles al final de cada capítulo.</p></div>
