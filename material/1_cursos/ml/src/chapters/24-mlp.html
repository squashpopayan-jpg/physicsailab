<template class="chapter-src" data-id="mlp" data-num="24" data-title="Del perceptrón a la red multicapa" data-part="Parte VI · Redes neuronales" data-short="La neurona artificial; el perceptrón y su regla; el problema del XOR; capas ocultas y activaciones; aproximación universal; capas de salida y pérdidas; un laboratorio de redes">
<p class="lead">Una red neuronal es una composición de muchas funciones simples: sumas ponderadas seguidas de una no linealidad. Cada capa transforma la representación de los datos hasta que, en la última, el problema se vuelve fácil. Este capítulo construye la idea desde la neurona de Rosenblatt hasta la red multicapa, y la pone a prueba en un laboratorio donde usted elige la arquitectura y observa cómo aprende.</p>

<section>
<h2>La neurona y el perceptrón</h2>
<p>Una neurona artificial calcula una suma ponderada de sus entradas y le aplica una función de activación:</p>
<div class="eq key" data-name="Neurona">\[a=\phi\Big(\sum_{j=1}^pw_jx_j+b\Big)=\phi(\vb w\cdot\vb x+b).\]</div>
<p>Con \(\phi\) igual a un escalón, es el <span class="term">perceptrón</span> de Rosenblatt (1958), entrenado con una regla sencilla: ante cada error, mover los pesos hacia el ejemplo mal clasificado, \(\vb w\leftarrow\vb w+\eta(y-\hat y)\vb x\). Si los datos son linealmente separables, la regla converge en un número finito de pasos (teorema de Novikoff). Si no lo son, nunca se detiene.</p>
<div class="sim" data-sim="perceptron" data-title="La regla del perceptrón época a época"></div>
<div class="sim-guide"><ul>
<li>Con clases separables, la recta se ajusta en cada época hasta que no queda ningún punto con anillo (mal clasificado).</li>
<li>Con XOR la recta salta de un lado a otro sin converger: ninguna recta separa las cuatro esquinas.</li>
</ul></div>
<div class="box hist"><p>Minsky y Papert (1969) demostraron que un perceptrón de una capa no puede representar XOR. El resultado, malinterpretado como un límite de todas las redes, contribuyó al primer «invierno» de la inteligencia artificial. La salida era conocida: añadir capas ocultas. Lo que faltaba era una forma eficiente de entrenarlas, que llegó con la retropropagación (Rumelhart, Hinton y Williams, 1986; capítulo 25).</p></div>
</section>

<section>
<h2>Capas ocultas y activaciones</h2>
<p>Una <span class="term">red multicapa</span> (MLP) apila capas de neuronas; la salida de cada capa es la entrada de la siguiente:</p>
<div class="eq key" data-name="Red multicapa">\[\vb a^{(0)}=\vb x,\qquad \vb z^{(l)}=W^{(l)}\vb a^{(l-1)}+\vb b^{(l)},\qquad \vb a^{(l)}=\phi\big(\vb z^{(l)}\big),\qquad \hat y=g\big(\vb z^{(L)}\big).\]</div>
<p>Sin la no linealidad \(\phi\), la composición de capas lineales sería una sola capa lineal: no se ganaría nada. Las activaciones más usadas:</p>
<ul>
<li><b>Sigmoide</b> \(\sigma(z)=1/(1+\ee^{-z})\): histórica; satura en ambos extremos y su derivada máxima es 0.25, lo que frena el aprendizaje en redes profundas.</li>
<li><b>tanh</b>: como la sigmoide pero centrada en cero (de −1 a 1); mejor comportada, aunque también satura.</li>
<li><b>ReLU</b> \(\max(0,z)\): no satura para \(z>0\), es barata y es la opción por defecto en redes profundas. Sus neuronas pueden «morir» (quedarse siempre en cero); variantes como Leaky ReLU y GELU lo mitigan.</li>
</ul>
<p>Cada neurona oculta con ReLU es una «bisagra»: una función lineal a trozos con un quiebre. Sumando muchas bisagras con distintos quiebres y pendientes se aproxima cualquier curva.</p>
<div class="sim" data-sim="aproximador-relu" data-title="Aproximar una función sumando bisagras ReLU"></div>
<div class="sim-guide"><ul>
<li>Cada curva gris es la contribución de una neurona: cero hasta su quiebre (punto violeta) y luego una recta. La red suma todas.</li>
<li>Con 2 o 3 neuronas la aproximación es tosca; con 15–20 sigue el seno de cerca. El escalón necesita neuronas con quiebres casi juntos y pendientes enormes.</li>
</ul></div>
<div class="box law"><p><b>Teorema de aproximación universal</b> (Cybenko, 1989; Hornik, 1991): una red con una sola capa oculta y suficientes neuronas puede aproximar cualquier función continua en un dominio acotado con la precisión que se quiera. El teorema garantiza que la red existe, no que el entrenamiento la encuentre, ni cuántas neuronas o datos hacen falta. En la práctica, las redes profundas (varias capas) representan las mismas funciones con muchos menos parámetros.</p></div>
</section>

<section>
<h2>Capa de salida y pérdida</h2>
<div class="tablewrap"><table>
<thead><tr><th>Problema</th><th>Salida \(g\)</th><th>Pérdida</th><th>En PyTorch</th></tr></thead>
<tbody>
<tr><td>Regresión</td><td>lineal (identidad)</td><td>error cuadrático (o Huber)</td><td><code>nn.MSELoss</code></td></tr>
<tr><td>Binaria</td><td>sigmoide, 1 neurona</td><td>entropía cruzada binaria</td><td><code>nn.BCEWithLogitsLoss</code> (sobre el logit)</td></tr>
<tr><td>Multiclase</td><td>softmax, \(K\) neuronas</td><td>entropía cruzada</td><td><code>nn.CrossEntropyLoss</code> (sobre los logits)</td></tr>
<tr><td>Multietiqueta</td><td>sigmoide por etiqueta</td><td>entropía cruzada binaria por etiqueta</td><td><code>nn.BCEWithLogitsLoss</code></td></tr>
</tbody></table></div>
<p>La última capa de una red de clasificación es exactamente una regresión logística o softmax sobre las representaciones que aprendieron las capas anteriores (capítulo 10). Las bibliotecas combinan la activación de salida con la pérdida en una sola función por estabilidad numérica: no aplique la sigmoide o el softmax antes de esas pérdidas.</p>
</section>

<section>
<h2>Un laboratorio de redes</h2>
<div class="sim" data-sim="playground" data-title="Laboratorio: elija la arquitectura y observe el aprendizaje"></div>
<div class="sim-guide"><ul>
<li>Con una capa de 1 o 2 neuronas, la frontera de las espirales es casi recta: falta capacidad.</li>
<li>Con 2 capas de 8 neuronas tanh, la frontera se enrolla siguiendo las espirales en unos cientos de épocas.</li>
<li>Con 3 capas de 16 y poco ruido, la pérdida de prueba termina subiendo mientras la de entrenamiento sigue bajando: sobreajuste. Suba la regularización L2 y compare.</li>
<li>Pruebe la sigmoide con 3 capas: aprende mucho más despacio (gradientes que se desvanecen, capítulo 25). Con tasas de aprendizaje altas, la pérdida oscila o se dispara.</li>
</ul></div>
</section>

<section>
<h2>Práctica: del XOR a PyTorch</h2>
<div class="box py"><p>El programa muestra que el perceptrón no resuelve XOR y una red de 4 neuronas sí, compara redes de distinto tamaño en las lunas con <code>MLPClassifier</code> y entrena una red equivalente en PyTorch con el bucle de entrenamiento escrito paso a paso.</p>
<div class="py" data-py="24-mlp"></div></div>
<div class="box read"><ul>
<li><b>XOR</b>: el perceptrón obtiene 0.5 (lo mejor que puede hacer una recta con estas cuatro esquinas); la red 2–4–1 clasifica las cuatro bien.</li>
<li><b>Tamaño</b>: con 2 u 8 neuronas la red apenas supera a la logística lineal (0.838–0.842 frente a 0.840); con 32 neuronas sube a 0.930. Pasar de 1 185 a 17 025 parámetros casi no mejora (0.930 → 0.934): el límite ya lo pone el ruido de los datos, no la capacidad.</li>
<li><b>Sin sobreajuste visible</b> aun con 17 025 parámetros y 500 datos: la regularización \(\alpha=10^{-4}\), la parada por convergencia y Adam limitan la complejidad efectiva (recuerde el doble descenso del capítulo 3).</li>
<li><b>PyTorch</b>: el bucle tiene siempre los mismos cuatro pasos: <code>zero_grad</code>, calcular la pérdida, <code>backward</code> (retropropagación) y <code>step</code>. La pérdida de validación baja de 0.451 a 0.156 en 50 épocas y luego se estanca entre 0.16 y 0.18 mientras la de entrenamiento sigue bajando: el punto donde convendría parar (capítulo 26). La pérdida de entrenamiento impresa es la del último mini-lote, por eso es ruidosa.</li>
</ul></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>Neurona = suma ponderada + activación. El perceptrón converge solo si los datos son separables.</li>
<li>Las capas ocultas con activaciones no lineales permiten fronteras arbitrarias; sin no linealidad, todo es lineal.</li>
<li>ReLU por defecto en capas ocultas; sigmoide y tanh saturan.</li>
<li>Aproximación universal: existencia, no garantía de entrenamiento.</li>
<li>Salida y pérdida van en pareja: lineal + MSE, sigmoide + BCE, softmax + entropía cruzada.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Cuántos parámetros tiene una red 10–32–16–3?
<details><summary>Respuesta</summary><p>\(10\cdot32+32+32\cdot16+16+16\cdot3+3=320+32+512+16+48+3=931\).</p></details></li>
<li><span class="lvl">Básico</span>Con pesos \(w=(1,1)\), \(b=-1.5\) y escalón, ¿qué función lógica calcula la neurona sobre entradas 0/1?
<details><summary>Respuesta</summary><p>AND: solo (1,1) da \(0.5>0\).</p></details></li>
<li><span class="lvl">Intermedio</span>Construya a mano una red de dos neuronas ocultas con escalón que calcule XOR.
<details><summary>Respuesta</summary><p>\(h_1=\text{OR}\) (pesos 1, 1, sesgo −0.5), \(h_2=\text{AND}\) (pesos 1, 1, sesgo −1.5); salida \(h_1-h_2-0.5>0\): verdadero solo si exactamente una entrada es 1.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Por qué una red de varias capas lineales, sin activaciones, equivale a una sola capa?
<details><summary>Respuesta</summary><p>\(W_2(W_1\vb x+\vb b_1)+\vb b_2=(W_2W_1)\vb x+(W_2\vb b_1+\vb b_2)\): un producto de matrices es otra matriz.</p></details></li>
<li><span class="lvl">Avanzado</span>Muestre que \(\text{ReLU}(x)-\text{ReLU}(x-1)\) es una rampa acotada entre 0 y 1 y explique cómo, combinando rampas, se aproxima un escalón.
<details><summary>Respuesta</summary><p>Vale 0 si \(x\le0\), \(x\) en \([0,1]\) y 1 si \(x\ge1\). Escalando la entrada, \(\text{ReLU}(kx)-\text{ReLU}(kx-1)\) sube de 0 a 1 en un intervalo de ancho \(1/k\): con \(k\) grande es un escalón. Sumando escalones se aproxima cualquier función continua.</p></details></li>
</ol>
