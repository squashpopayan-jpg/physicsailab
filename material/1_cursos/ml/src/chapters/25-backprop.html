<template class="chapter-src" data-id="backprop" data-num="25" data-title="Retropropagación" data-part="Parte VI · Redes neuronales" data-short="Grafos de cómputo; la regla de la cadena hacia atrás; las ecuaciones de la retropropagación; un ejemplo numérico completo; gradientes que se desvanecen o explotan; inicialización Xavier y He; comprobar gradientes; autograd">
<p class="lead">Entrenar una red con descenso de gradiente exige la derivada de la pérdida respecto de cada uno de sus miles o millones de pesos. La retropropagación las calcula todas con el costo aproximado de dos pasadas por la red, aplicando la regla de la cadena de atrás hacia delante. Es el algoritmo que hizo posible el aprendizaje profundo y la base de los sistemas de diferenciación automática como PyTorch.</p>

<section>
<h2>Grafos de cómputo y la regla de la cadena</h2>
<p>Cualquier cálculo se puede escribir como un grafo de operaciones elementales. Para derivar el resultado respecto de una entrada se recorre el grafo hacia atrás: el gradiente que llega a un nodo se multiplica por la derivada local de su operación y se reparte hacia sus entradas. Si una variable alimenta varios nodos, sus gradientes se suman.</p>
<div class="eq key" data-name="Regla de la cadena en un grafo">\[\pdv{L}{u}=\sum_{v\,\in\,\text{hijos}(u)}\pdv{L}{v}\,\pdv{v}{u}.\]</div>
<div class="box ex"><p>Con \(f=(x+y)\,z\), \(x=2\), \(y=-1\), \(z=3\): hacia delante, \(q=x+y=1\) y \(f=qz=3\). Hacia atrás, \(\partial f/\partial f=1\); \(\partial f/\partial z=q=1\); \(\partial f/\partial q=z=3\); y como \(q=x+y\), \(\partial f/\partial x=\partial f/\partial y=3\cdot1=3\). Cada derivada se obtiene con información local más el gradiente que llega desde arriba.</p></div>
</section>

<section>
<h2>Las ecuaciones de la retropropagación</h2>
<p>Para una red con \(\vb z^{(l)}=W^{(l)}\vb a^{(l-1)}+\vb b^{(l)}\) y \(\vb a^{(l)}=\phi(\vb z^{(l)})\), se define el <span class="term">error</span> de cada capa \(\boldsymbol\delta^{(l)}=\partial L/\partial\vb z^{(l)}\). Entonces:</p>
<div class="eq key" data-name="Retropropagación">\[\boldsymbol\delta^{(L)}=\hat{\vb y}-\vb y\ \ (\text{softmax/sigmoide + entropía cruzada}),\qquad \boldsymbol\delta^{(l)}=\big(W^{(l+1)}\big)\T\boldsymbol\delta^{(l+1)}\odot\phi'\big(\vb z^{(l)}\big),\]
\[\pdv{L}{W^{(l)}}=\boldsymbol\delta^{(l)}\,\big(\vb a^{(l-1)}\big)\T,\qquad \pdv{L}{\vb b^{(l)}}=\boldsymbol\delta^{(l)} .\]</div>
<ul>
<li>El error de la salida, combinado con la entropía cruzada, es simplemente predicción menos etiqueta: el mismo de la regresión logística.</li>
<li>Cada capa recibe el error de la siguiente a través de la transpuesta de sus pesos y lo multiplica por la derivada de su activación (\(\odot\) es el producto elemento a elemento).</li>
<li>El gradiente de un peso es su error por la activación que entra en él: una regla local, «la neurona de salida culpa a la de entrada en proporción a cuánto contribuyó».</li>
<li>Con mini-lotes, los gradientes se promedian sobre los ejemplos; todo se escribe con productos de matrices, lo que la hace eficiente en GPU.</li>
</ul>

<div class="sim-guide"><ul>
<li>En modo «Hacia delante», cada nodo muestra su valor; en «Gradientes», cada conexión muestra \(\partial L/\partial w\) y cada nodo su error \(\delta\).</li>

</section>

<section>
<h2>Gradientes que se desvanecen o explotan</h2>
<p>El error de la capa 1 es un producto de muchos factores: \(\boldsymbol\delta^{(1)}\propto W^{(2)\top}\phi'\cdots W^{(L)\top}\phi'\,\boldsymbol\delta^{(L)}\). Si esos factores son sistemáticamente menores que 1, el gradiente decrece exponencialmente con la profundidad (<span class="term">desvanecimiento</span>) y las primeras capas casi no aprenden. Si son mayores que 1, crece exponencialmente (<span class="term">explosión</span>) y el entrenamiento diverge.</p>
<ul>
<li>La derivada de la sigmoide vale como máximo 0.25: diez capas pueden reducir el gradiente por \(0.25^{10}\approx10^{-6}\). Por eso las redes profundas con sigmoide no aprendían.</li>
<li>ReLU tiene derivada 1 en la zona activa, lo que alivia el problema, aunque sus neuronas pueden quedar inactivas.</li>
<li>La <b>inicialización</b> fija la escala inicial de los factores. <b>Xavier/Glorot</b>: \(\Var(w)=2/(n_\text{ent}+n_\text{sal})\), pensada para tanh y sigmoide; <b>He</b>: \(\Var(w)=2/n_\text{ent}\), para ReLU (compensa que la mitad de las neuronas valen cero). Ambas mantienen la varianza de las activaciones y de los gradientes aproximadamente constante entre capas.</li>
<li>Otras soluciones: normalización por lotes o por capa (capítulo 26), conexiones residuales (ResNet, capítulo 27), recorte del gradiente para la explosión, y puertas en las redes recurrentes (LSTM, capítulo 28).</li>
</ul>
<div class="sim" data-sim="gradientes-capas" data-title="Gradientes y saturación capa por capa"></div>
<div class="sim-guide"><ul>
<li>Sigmoide con pesos pequeños: el gradiente de la capa 1 es millones de veces menor que el de la última (escala logarítmica).</li>
<li>tanh con Xavier o ReLU con He: las barras quedan aproximadamente al mismo nivel en todas las capas.</li>
<li>ReLU con pesos pequeños: el gradiente también se desvanece. La activación y la inicialización van en pareja.</li>
<li>La gráfica de la derecha muestra la dispersión de las activaciones: con pesos demasiado pequeños la señal se apaga capa a capa (con sigmoide, todas las neuronas quedan en 0.5 y no distinguen un ejemplo de otro); con la inicialización adecuada se mantiene.</li>
</ul></div>
</section>

<section>
<h2>Comprobar gradientes y diferenciación automática</h2>
<p>Un gradiente mal programado puede entrenar «más o menos» y pasar desapercibido. La <span class="term">comprobación numérica</span> compara cada derivada con la diferencia centrada \(\big(L(w+h)-L(w-h)\big)/2h\); un error relativo de \(10^{-7}\) o menor indica que la implementación es correcta. Es lenta (dos evaluaciones por parámetro), así que se aplica a redes pequeñas.</p>
<p>Las bibliotecas modernas implementan <span class="term">diferenciación automática en modo inverso</span>: al ejecutar la pasada hacia delante registran el grafo de operaciones (<code>requires_grad=True</code> en PyTorch), y <code>backward()</code> aplica la regla de la cadena de forma exacta y automática. No es diferenciación numérica (no hay error de truncamiento) ni simbólica (no construye fórmulas): es la retropropagación generalizada a cualquier programa.</p>
</section>

<section>
<h2>Práctica: retropropagación a mano y con autograd</h2>
<div class="box py"><p>El programa calcula a mano la pasada hacia delante y hacia atrás de una red 2–2–1 (la misma de la simulación), compara el resultado con el autograd de PyTorch y con diferencias finitas, y mide los gradientes de cada capa en redes de 10 capas con distintas activaciones e inicializaciones.</p>
<div class="py" data-py="25-backprop"></div></div>
<div class="box read"><ul>
<li><b>Hacia delante</b>: \(\vb z_1=(0.45,-0.10)\), \(\vb a_1=(0.611,0.475)\), \(p=0.611\) y pérdida 0.493 (la etiqueta es 1, así que \(-\log0.611\)).</li>
<li><b>Hacia atrás</b>: \(\delta_2=p-y=-0.389\) (negativo: hay que subir \(p\)). \(\delta_1=W_2\delta_2\odot\sigma'\): \(1.2\cdot(-0.389)\cdot0.611\cdot0.389=-0.111\) para la primera neurona.</li>
<li><b>Coincidencia</b>: el gradiente a mano y el de autograd difieren en \(10^{-17}\) (redondeo de máquina) y el error relativo frente a diferencias finitas es \(10^{-9}\). Las tres formas de derivar concuerdan.</li>
<li><b>Desvanecimiento</b>: con sigmoide y pesos \(\mathcal N(0,0.1^2)\), el gradiente de la capa 10 es \(10^6\) veces mayor que el de la capa 1; con Xavier mejora poco (\(5\times10^5\)): la sigmoide sigue aplastando. Con tanh + Xavier la razón es 0.78 y con ReLU + He 2.2: todas las capas aprenden a un ritmo comparable.</li>
</ul></div>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>La retropropagación es la regla de la cadena aplicada de la salida hacia la entrada sobre el grafo de cómputo.</li>
<li>\(\boldsymbol\delta^{(l)}=W^{(l+1)\top}\boldsymbol\delta^{(l+1)}\odot\phi'(\vb z^{(l)})\) y \(\partial L/\partial W^{(l)}=\boldsymbol\delta^{(l)}\vb a^{(l-1)\top}\).</li>
<li>Los productos de muchas derivadas hacen que el gradiente se desvanezca o explote con la profundidad.</li>
<li>ReLU + He, tanh + Xavier, normalización, conexiones residuales y recorte del gradiente lo controlan.</li>
<li>Verifique gradientes con diferencias finitas; en la práctica, use autograd.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Con \(f=xy+z\), \(x=3\), \(y=-2\), \(z=4\), calcule \(\partial f/\partial x\), \(\partial f/\partial y\) y \(\partial f/\partial z\).
<details><summary>Respuesta</summary><p>\(y=-2\), \(x=3\) y 1.</p></details></li>
<li><span class="lvl">Básico</span>¿Cuánto vale la derivada de la sigmoide en \(z=0\)? ¿Y la de tanh?
<details><summary>Respuesta</summary><p>\(\sigma'(0)=0.25\); \(\tanh'(0)=1\).</p></details></li>
<li><span class="lvl">Intermedio</span>Una capa tiene 256 entradas y usa ReLU. ¿Qué desviación de los pesos da la inicialización de He?
<details><summary>Respuesta</summary><p>\(\sqrt{2/256}=0.088\).</p></details></li>
<li><span class="lvl">Intermedio</span>¿Por qué el error de salida de una red con softmax y entropía cruzada es \(\hat{\vb y}-\vb y\)?
<details><summary>Respuesta</summary><p>Con \(L=-\sum_ky_k\log\hat y_k\) y \(\hat y_k=\ee^{z_k}/\sum\ee^{z_j}\), se tiene \(\partial L/\partial z_k=\hat y_k-y_k\): las derivadas del logaritmo y del softmax se simplifican.</p></details></li>
<li><span class="lvl">Avanzado</span>Estime cuántas operaciones cuesta la retropropagación frente a calcular cada derivada con diferencias finitas en una red con \(P\) parámetros.
<details><summary>Respuesta</summary><p>Retropropagación: del orden de 2–3 pasadas hacia delante, \(O(P)\). Diferencias finitas: dos pasadas por parámetro, \(O(P^2)\). Con \(P=10^6\), la diferencia es de un millón de veces.</p></details></li>
</ol>
