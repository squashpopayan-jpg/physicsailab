<p class="lead">No existe el mejor algoritmo en abstracto: el teorema de «no hay almuerzo gratis» (Wolpert, 1996) dice que, promediado sobre todos los problemas posibles, ningún método supera a otro. Lo que existe es el mejor algoritmo para un tipo de datos, un tamaño, un costo de error y unas restricciones de uso. Este capítulo reúne los criterios de todo el curso en una guía de decisión y la pone a prueba.</p>

<section>
<h2>Las preguntas que deciden</h2>
<ol>
<li><b>¿Qué se predice y cómo se juzga?</b> Regresión, clasificación, grupos o anomalías; la métrica y el costo de cada error (capítulos 9, 11 y 12).</li>
<li><b>¿Qué tipo de datos?</b> Con tablas de variables heterogéneas dominan los árboles potenciados; con imágenes, audio y texto, las redes profundas preentrenadas.</li>
<li><b>¿Cuántos datos?</b> Con cientos de filas, modelos simples y regularizados; con millones, casi cualquier modelo flexible y el costo computacional pasa a importar.</li>
<li><b>¿Hay que explicar cada decisión?</b> Si la regulación o el usuario lo exigen, un modelo intrínsecamente interpretable puede valer más que un punto de exactitud.</li>
<li><b>¿Dónde y con qué rapidez se usará?</b> Latencia, memoria, actualización frecuente, dispositivo.</li>
<li><b>¿Cómo son las variables?</b> Escalas distintas, categóricas de alta cardinalidad, faltantes, muchas irrelevantes, estructura temporal o de grupos.</li>
</ol>
<div class="sim" data-sim="asistente-algoritmo" data-title="Asistente: por dónde empezar"></div>
<div class="sim-guide"><ul>
<li>Describa su problema con los controles. El asistente aplica las reglas del curso y propone un orden para probar, con las razones.</li>
<li>Es un punto de partida, no un veredicto: la decisión final la da la validación cruzada con sus datos.</li>
</ul></div>
</section>

<div class="box law"><p>Un orden de prueba que rara vez falla con datos tabulares: (1) línea base trivial; (2) modelo lineal regularizado con un buen preprocesamiento; (3) bosque aleatorio con valores por defecto; (4) gradient boosting con parada temprana; (5) ajuste de hiperparámetros del mejor. Si la diferencia entre (2) y (4) es pequeña, el modelo lineal suele ser la mejor elección: más simple, más rápido, más explicable y más estable.</p></div>
</section>

<section>
<h2>Una arena: ocho algoritmos, los mismos datos</h2>
<div class="sim" data-sim="arena" data-title="Arena: el mismo conjunto de datos para ocho algoritmos"></div>
<div class="sim-guide"><ul>
<li>Con datos lineales, la logística es tan buena como cualquier otro y su frontera es la más sencilla.</li>
<li>Con espirales o XOR, la logística y Bayes ingenuo fracasan; los métodos flexibles (SVM RBF, bosques, boosting, red) compiten entre sí.</li>
<li>Con pocos puntos y mucho ruido, los modelos más flexibles sobreajustan y las diferencias entre los mejores caben en el ruido de la prueba.</li>
<li>Observe las formas: escalones paralelos a los ejes en los árboles, curvas suaves en la SVM y la red, islas en k-NN.</li>
</ul></div>
</section>

<section>
<h2>Práctica: el mismo protocolo en tres problemas</h2>
<div class="box py"><p>El programa compara nueve modelos (incluida la línea base) con la misma validación cruzada estratificada de 5 pliegues en tres conjuntos: el cáncer de mama (tabla pequeña y limpia), los dígitos (imágenes pequeñas) y una tabla sintética con 30 de sus 40 variables inútiles y 5 % de etiquetas erróneas.</p>
<div class="py" data-py="30-elegir"></div></div>
<div class="box read"><ul>
<li><b>No hay un ganador universal</b>: en el cáncer de mama gana la regresión logística (0.979), empatada con la red; en los dígitos, la SVM RBF (0.981); en la tabla con variables inútiles, el gradient boosting (0.897) y el bosque (0.892).</li>
<li><b>Cáncer de mama</b>: la frontera es casi lineal en las 30 variables estandarizadas; los árboles (0.926) y el bosque (0.958) quedan por debajo de los modelos lineales. Con 569 casos, la diferencia entre 0.979 y 0.970 (boosting) son unos 5 tumores: dentro del ruido (desviaciones de ±0.01).</li>
<li><b>Dígitos</b>: los métodos basados en distancias y en núcleos brillan (k-NN 0.974, SVM 0.981) porque los píxeles están en la misma escala y los dígitos parecidos son vecinos. El árbol solo es el peor (0.838).</li>
<li><b>Tabla sintética</b>: los métodos de árboles ignoran las 30 variables inútiles; k-NN (0.804) y la red (0.829) sufren con ellas, y la logística no captura las interacciones (0.825). Así se ven los datos tabulares reales en los que dominan los árboles.</li>
<li><b>Línea base</b>: 0.627, 0.101 y 0.501. Sin ella, 0.80 en la tabla sintética podría parecer mal o bien: es 30 puntos sobre el azar.</li>
<li><b>Tiempo</b>: la logística entrena en milisegundos; boosting, bosque y red en décimas a segundos. Con datos de este tamaño el tiempo no decide, pero con millones de filas sí.</li>
</ul></div>
</section>

<section>
<h2>Resumen y problemas</h2>
<div class="box keys"><ul>
<li>Ningún algoritmo es el mejor en general: decida por tipo de datos, tamaño, costo de error y restricciones.</li>
<li>Tablas: líneas base, modelo lineal, bosque, boosting. Imágenes y texto: modelos preentrenados.</li>
<li>Compare siempre con el mismo protocolo, la misma métrica y una línea base, e interprete las diferencias con su incertidumbre.</li>
<li>Ante empate, gana el modelo más simple, rápido y explicable.</li>
</ul></div>
<ol class="problems">
<li><span class="lvl">Básico</span>Tiene 300 pacientes, 12 variables clínicas y debe explicar cada predicción a los médicos. ¿Qué probaría primero?
<details><summary>Respuesta</summary><p>Regresión logística regularizada (odds ratios) y un árbol poco profundo, contra una línea base; un boosting solo como referencia de cuánto se pierde por interpretar.</p></details></li>
<li><span class="lvl">Básico</span>Clasificar 50 000 fotos de productos en 20 categorías. ¿Qué haría?
<details><summary>Respuesta</summary><p>Transferencia de aprendizaje con una CNN o ViT preentrenado, ajustando la última capa (o las últimas) con aumento de datos.</p></details></li>
<li><span class="lvl">Intermedio</span>Dos modelos obtienen 0.912 ± 0.010 y 0.918 ± 0.012 en validación cruzada de 5 pliegues. ¿Cuál elige?
<details><summary>Respuesta</summary><p>La diferencia (0.006) es menor que la desviación entre pliegues; compare las diferencias pareadas por pliegue y, si siguen sin ser consistentes, elija por simplicidad, costo o interpretabilidad.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Por qué k-NN pierde mucho en la tabla sintética del programa y no en los dígitos?
<details><summary>Respuesta</summary><p>En la tabla, 30 de 40 variables son ruido y dominan la distancia; en los dígitos casi todos los píxeles aportan y están en la misma escala.</p></details></li>
<li><span class="lvl">Avanzado</span>Explique el teorema de «no hay almuerzo gratis» y por qué, aun así, el gradient boosting gana tan a menudo con datos tabulares.
<details><summary>Respuesta</summary><p>Promediado sobre todas las funciones objetivo posibles (incluidas las caóticas), todos los algoritmos rinden igual. Los problemas reales no son uniformes: las tablas reales tienen interacciones de orden bajo, variables irrelevantes y relaciones irregulares, exactamente el sesgo inductivo de los árboles potenciados.</p></details></li>
</ol>
