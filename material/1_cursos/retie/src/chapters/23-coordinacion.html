<p class="lead">Aquí el ingeniero civil tiene la última palabra. Un tubo eléctrico que atraviesa una viga o una caja que pica una columna son decisiones estructurales, no eléctricas. La guía del proyecto pide revisar al menos dos puntos de conflicto, presentar una imagen de cada uno y la solución adoptada, con una advertencia: el dibujo no autoriza perforaciones ni modificaciones en la estructura.</p>

<section>
<h2>Tubos embebidos en el concreto</h2>
<p>El Título C de la NSR-10 trata las tuberías y ductos embebidos en el concreto en su sección C.6.3, con el mismo criterio del ACI 318. Salvo que el ingeniero estructural apruebe los planos de tuberías, los tubos embebidos en una losa, muro o viga (distintos de los que solo la atraviesan) deben cumplir:</p>
<ul>
<li>Su dimensión exterior no puede ser mayor que un tercio del espesor total del elemento.</li>
<li>No pueden quedar a menos de tres diámetros entre centros.</li>
<li>No pueden reducir de manera significativa la resistencia de la construcción.</li>
<li>En columnas, no pueden desplazar más del 4 % del área de la sección.</li>
<li>El recubrimiento de concreto no puede ser menor de 40 mm donde el concreto está expuesto a la tierra o a la intemperie, ni de 20 mm en el resto.</li>
</ul>
<div class="box warn"><p>Estos son los criterios generales de la sección C.6.3 tal como los recoge la NSR-10 a partir del ACI 318. Verifique su redacción exacta y sus excepciones en el Título C vigente antes de citarlos, y recuerde que la decisión final es del ingeniero estructural responsable.</p></div>
<div class="sim" data-sim="tubo-losa" data-title="Tubos embebidos en la losa maciza"></div>
<div class="sim-guide"><ul>
<li>En la losa de 0,12 m caben tubos de diámetro exterior hasta 40 mm: el de 1/2 in (21,3 mm) y el de 3/4 in (26,7 mm) cumplen; el de 1 1/4 in (42,2 mm), no.</li>
<li>Junte dos tubos de 3/4 in a 6 cm entre centros: no cumple los tres diámetros (8 cm). Al salir del tablero, los tubos deben abrirse en abanico.</li>
<li>Cambie a losa aligerada con loseta de 5 cm: en la loseta no caben ni los tubos de 1/2 in; van en las viguetas o en el relleno, según lo diga el estructural.</li>
</ul></div>
</section>

<section>
<h2>Vigas: bajantes y cruces</h2>
<p>En una estructura de pórticos con vigas descolgadas, los muros que están bajo las vigas terminan en el fondo de la viga. Una tubería que viene de la losa y debe llegar a un interruptor en ese muro tiene que atravesar la viga verticalmente. Una tubería de la losa que pasa de un paño a otro cruza la viga horizontalmente, en la franja de la losa que se funde con ella.</p>
<p>La zona más delicada es la de confinamiento: en estructuras con capacidad de disipación de energía, los estribos se concentran en una longitud de dos veces la altura de la viga desde la cara de la columna (NSR-10, capítulo C.21). En la casa ejemplo, con vigas de 0,35 m, esa franja mide 0,70 m. Cualquier pase debe quedar fuera de ella.</p>
<div class="sim" data-sim="conflicto-viga" data-title="Bajante a través de una viga"></div>
<div class="sim-guide"><ul>
<li>Mueva el punto a lo largo del muro: dentro de la franja de 0,70 m junto a la columna el pase choca con los estribos de confinamiento.</li>
<li>Compare las tres soluciones: dejar una camisa en la viga antes del vaciado, alimentar el interruptor desde el contrapiso o mover el interruptor a un muro que no esté bajo una viga.</li>
</ul></div>
</section>

<section>
<h2>Columnas</h2>
<p>Las columnas no se ranuran. Una caja junto a una columna obliga a picar el concreto o deja la caja apoyada en el pañete. La regla práctica es dejar la caja en la mampostería, a una distancia de la cara de la columna que permita hacer la regata sin tocarla, y no correr tubos dentro de la columna.</p>
</section>

<section>
<h2>Cómo documentar un conflicto</h2>
<p>Cada conflicto se presenta en la memoria con una imagen (la vista de coordinación del 3D o un corte), una descripción, la solución adoptada y su fundamento. Los dos de la casa ejemplo:</p>
<div class="box ex" data-label="Conflicto 1"><p><b>Tubería de alumbrado que cruza la viga del eje 2.</b> El tramo LC–LK1 del circuito C1 (tubo PVC de 1/2 in con fase, neutro y tierra de 14 AWG) pasa de la sala a la cocina dentro de la losa y cruza la viga V-2(A-B) a 1,85 m de la cara de la columna más cercana. <b>Solución adoptada:</b> cruce perpendicular a la viga, dentro del espesor de la losa, entre las barras superiores y sin cortar acero, fuera de la zona de confinamiento de 0,70 m; diámetro exterior 21,3 mm menor que un tercio de la losa (40 mm). El cruce se marca en E03 y se somete a aprobación del ingeniero estructural antes del vaciado. Fuentes: NSR-10 C.6.3; vista de coordinación del M3D.</p></div>
<div class="box ex" data-label="Conflicto 2"><p><b>Caja de toma junto a la columna B-2.</b> La toma TS5 de la sala quedaba pegada a la cara de la columna B-2 en el muro del eje B. <b>Solución adoptada:</b> se desplazó la caja hasta dejar 0,40 m libres a la cara de la columna, dentro de la mampostería; la subida del contrapiso va por el muro y no toca el concreto de la columna. Fuentes: criterio de coordinación; RETIE 3.17.5 (la caja debe quedar fija y su volumen completo).</p></div>
<div class="box crit"><p>Las bajantes de los interruptores S1, S2, S3 y S5, de los apliques LF y LP y de la ducha XD atraviesan vigas porque esos muros están bajo vigas. Todas quedan fuera de las zonas de confinamiento y se resuelven con camisas de PVC dejadas en la formaleta antes del vaciado, con aprobación estructural. La alternativa, alimentar esos interruptores desde el contrapiso, se evaluó y se descartó por alargar los recorridos.</p></div>
<div class="box entrega"><ul>
<li>Al menos dos conflictos documentados con imagen, descripción, solución y fuente.</li>
<li>La vista de coordinación del M3D con el recorrido de canalización y los elementos estructurales.</li>
<li>Marcas en E03 de los cruces y pases que requieren aprobación estructural.</li>
</ul></div>
</section>

<section>
<h2>Resumen</h2>
<div class="box keys"><ul>
<li>Tubos embebidos: diámetro exterior ≤ 1/3 del espesor, separación ≥ 3 diámetros, recubrimiento ≥ 20 mm en interiores (NSR-10 C.6.3).</li>
<li>Los muros bajo vigas obligan a pasar las bajantes por la viga: siempre fuera de la zona de confinamiento de 2h.</li>
<li>Las columnas no se ranuran; las cajas van en la mampostería.</li>
<li>Cada conflicto se documenta con imagen, solución y fuente, y lo aprueba el ingeniero estructural.</li>
</ul></div>
</section>
