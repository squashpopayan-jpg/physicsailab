<template class="chapter-src" data-id="canal" data-num="22" data-title="Circuitos y canalizaciones (E03)" data-part="Parte IV · El proyecto paso a paso" data-short="Etapa 4: por dónde van las tuberías, cómo contar los conductores de cada tramo con el árbol del circuito, las marcas de conductores, la planta E03 de la casa ejemplo y la verificación de llenado">
<p class="lead">La planta E03 es la que mira el maestro de obra cuando deja los tubos en la losa antes del vaciado. Debe decir por dónde va cada tubo, de qué diámetro es, qué conductores lleva y dónde cambia de nivel. El esquema constructivo del RETIE exige exactamente esa información: ubicación, diámetros, tipo y material de las canalizaciones, y número y calibre de los conductores de cada tramo (3.3.2.1 d y e).</p>

<section>
<h2>Por dónde van las tuberías</h2>
<ul>
<li><b>Alumbrado y ducha por la losa.</b> Los tubos se tienden sobre la formaleta antes del vaciado, en línea recta entre cajas, y bajan por los muros hasta interruptores y apliques.</li>
<li><b>Tomas y estufa por el contrapiso.</b> Los tubos van en el concreto del piso y suben por el muro hasta la caja.</li>
<li><b>Muros de mampostería</b> para las bajantes y subidas. Las regatas se hacen verticales; las horizontales debilitan el muro.</li>
<li><b>Nunca a lo largo dentro de una viga o una columna.</b> Un cruce perpendicular de una viga en la losa es posible si se coordina; un tubo embebido a lo largo de la viga, no.</li>
<li><b>Fuera de las zonas de confinamiento</b>, la franja de 2h junto a las columnas donde los estribos se concentran (capítulo 23).</li>
</ul>
<p>En la planta, los tramos de losa se dibujan con línea continua, en arco entre cajas, y los de contrapiso con línea discontinua. Cada tramo lleva su diámetro y sus marcas de conductores.</p>
</section>

<section>
<h2>Cuántos conductores lleva cada tramo</h2>
<p>Los circuitos de una casa son árboles: desde el tablero salen ramas que pasan de caja en caja. Cada «señal» (fase, neutro, tierra, retorno de un interruptor, viajero de un conmutable) recorre solo el camino mínimo que une los puntos que la necesitan. El número de conductores de un tramo es el número de señales que pasan por él.</p>
<ul>
<li><b>Fase, neutro y tierra</b>: desde el tablero hasta cada punto que los necesita. Las luminarias reciben neutro y retorno; los interruptores, fase y retorno; todas las cajas, tierra (3.12.2.3 d).</li>
<li><b>Retorno</b>: entre el interruptor y las luminarias que controla.</li>
<li><b>Viajeros</b>: entre los dos conmutables.</li>
</ul>
<div class="sim" data-sim="arbol-c1" data-title="El árbol del circuito de alumbrado C1"></div>
<div class="sim-guide"><ul>
<li>Escoja una señal para ver su camino. El retorno de S1a va de S1 a LS1 y LS2 y no llega al tablero.</li>
<li>Los viajeros del hall van de S5 a S6 pasando por la caja de LH: por eso el tramo LH–S5 lleva fase, dos viajeros y tierra.</li>
<li>El tramo LS1–S1 lleva cuatro conductores: fase y retorno hacia el interruptor, y neutro y tierra que siguen hacia el aplique de la fachada.</li>
</ul></div>
<div class="box note"><p>Las marcas de la planta siguen los símbolos de la Tabla 1.3.4.a: una raya inclinada por cada conductor de fase, la raya con punto para el neutro y la raya con barra para la tierra. La guía agrega la raya con círculo para el retorno y la raya con gancho para los viajeros, y lo declara en el cuadro de convenciones.</p></div>
</section>

<section>
<h2>La planta E03 de la casa ejemplo</h2>
<div class="sim" data-sim="plano-e03" data-title="Planta E03: recorridos, tubos y conductores"></div>
<div class="sim-guide"><ul>
<li>Haga clic sobre un tramo para ver su recorrido, su longitud con bajantes, los conductores que lleva con su color y el llenado del tubo.</li>
<li>Filtre por nivel: losa o contrapiso. Acérquese para ver las marcas de conductores.</li>
<li>Todos los tramos caben en tubo de 1/2 in; el más cargado, el de la ducha con tres conductores de 10 AWG, llena el 22 %.</li>
</ul></div>
<div class="box entrega"><ul>
<li>Plano E03 a escala 1:50 con todos los recorridos, diferenciando losa y contrapiso.</li>
<li>Diámetro y tipo de tubo por tramo; marcas de conductores con calibre.</li>
<li>Cajas con su tipo y cambios de nivel (subidas y bajantes).</li>
<li>Referencia a los cruces con estructura revisados en la etapa 5 (capítulo 23).</li>
</ul></div>
</section>

<section>
<h2>Resumen</h2>
<div class="box keys"><ul>
<li>Losa para alumbrado y ducha; contrapiso para tomas y estufa; muros para bajantes.</li>
<li>Cada señal recorre el camino mínimo entre los puntos que la necesitan; los conductores de un tramo son las señales que lo cruzan.</li>
<li>La tierra acompaña a los conductores activos en todos los tramos (3.12.2.3 d).</li>
<li>E03 da ubicación, diámetro, tipo, conductores y calibres de cada tramo (3.3.2.1 d y e).</li>
</ul></div>
</section>
