<p class="lead">El diagrama unifilar dibuja con una sola línea por circuito todo el camino de la energía: de la red al medidor, del medidor al totalizador y de las barras del tablero a cada carga, con sus protecciones, calibres y la puesta a tierra. El diseño básico lo exige (3.3.1.2 a.6) y el tablero debe tenerlo adherido (3.17.8 s); si el tablero se modifica, se actualiza (3.17.8 o).</p>

<section>
<h2>Los símbolos obligatorios</h2>
<p>Son de obligatoria aplicación los símbolos de la Tabla 1.3.4.a del Libro 1, tomados de IEC 60617, ANSI Y32, CSA Z99 e IEEE 315. Cuando se requieran otros, se puede acudir a esas mismas normas; si por razones técnicas no se usan, se justifica por escrito (1.3.4). La galería reproduce los de la tabla, redibujados para esta guía.</p>
<div class="sim" data-sim="simbolos" data-title="Símbolos de la Tabla 1.3.4.a"></div>

<li>Note la diferencia entre el interruptor termomagnético y el diferencial, y entre tierra, tierra de protección y tierra aislada.</li>
</ul></div>
</section>

<section>
<h2>El unifilar de la casa ejemplo</h2>
<div class="sim" data-sim="unifilar" data-title="Diagrama unifilar generado desde el modelo"></div>
<div class="sim-guide"><ul>
<li>Cada rama muestra el circuito, la protección, los conductores (fases, neutro y tierra con su calibre), el tubo, la carga y la fase del tablero.</li>
<li>El puente entre la barra de neutro y la de tierra está solo en el tablero general (Título 27). De la barra de tierra sale el conductor de 8 AWG hacia las dos varillas.</li>
<li>Descargue el SVG para llevarlo a LibreCAD o a la memoria.</li>

</section>

<section>
<h2>Cómo representar la puesta a tierra</h2>
<ul>
<li>El electrodo o los electrodos con su tipo, material, longitud y la caja de inspección (3.3.2.1 a).</li>
<li>El conductor del electrodo con su calibre y material, y su conexión a la barra de tierra del tablero general.</li>
<li>El puente equipotencial principal entre neutro y tierra en el tablero general (3.17.8 x y Título 27).</li>
<li>El conductor de protección de cada circuito, con su calibre, acompañando a los activos (3.12.2.3 d).</li>
<li>La conexión del acero de refuerzo de la estructura a la puesta a tierra, si se prevé (3.12.1 b).</li>
</ul>
<div class="box entrega"><ul>
<li><b>E04</b>: diagrama unifilar con símbolos de la Tabla 1.3.4.a, cuadro de cargas (capítulo 24) y representación de la puesta a tierra.</li>
<li>Directorio de circuitos para la tapa del tablero.</li>
<li>Cuadro de convenciones, con los símbolos adicionales declarados.</li>
</ul></div>
</section>

<section>
<h2>Resumen</h2>
<div class="box keys"><ul>
<li>El unifilar recorre la energía desde la red hasta cada carga con una línea por circuito.</li>
<li>Los símbolos de la Tabla 1.3.4.a son obligatorios; los demás se toman de IEC 60617 y se declaran.</li>
<li>El tablero lleva su unifilar adherido y se actualiza con cada modificación.</li>
<li>E04 reúne unifilar, cuadro de cargas y puesta a tierra.</li>
</ul></div>
</section>
