<template class="chapter-src" data-id="software" data-num="2" data-title="Qué programa usar para qué" data-part="Parte I · El proyecto y sus herramientas" data-short="Las tres rutas de la guía, lo que cada programa abre y exporta en su versión gratuita, cómo se mueven los archivos entre programas y una ayuda para escoger la ruta">
<p class="lead">El proyecto se puede hacer con programas gratuitos o con licencias educativas. Lo que no cambia es la evidencia: un modelo 3D, unas plantas 2D con capas y bloques, un cuadro de cargas y una memoria. Este capítulo compara las rutas y muestra por dónde viaja cada archivo, porque el error más común no es de dibujo sino de formato: un archivo que el siguiente programa no puede abrir.</p>

<section>
<h2>Las tres rutas</h2>
<div class="tablewrap"><table>
<thead><tr><th>Ruta</th><th>Modelo 3D</th><th>Planos 2D</th><th>Condiciones</th></tr></thead>
<tbody>
<tr><td>Inicial (recomendada)</td><td>SketchUp Free (en el navegador)</td><td>LibreCAD (escritorio, libre)</td><td>Sin pago. Exige conservar la misma geometría en dos archivos y comprobar que coincidan.</td></tr>
<tr><td>Con conocimientos de CAD</td><td>SketchUp Free</td><td>AutoCAD</td><td>Acceso educativo gratuito sujeto a la elegibilidad y verificación de Autodesk.</td></tr>
<tr><td>Integrada con BIM</td><td colspan="2">Revit: modelo, vistas eléctricas, circuitos y cuadros de tableros en un solo archivo</td><td>Más aprendizaje y equipos con más memoria. Acceso educativo sujeto a elegibilidad.</td></tr>
</tbody></table></div>
<p>La ruta inicial queda definida como SketchUp Free más LibreCAD. Si el grupo ya usa CAD o tiene formación en Revit, el docente puede adoptar otra ruta para toda la clase. Todas las rutas producen las mismas evidencias evaluables.</p>
<div class="box note"><p>Estado consultado en octubre de 2026: LibreCAD 2.2.1 es la serie estable; QElectroTech publicó la versión 0.100 en enero de 2026; FreeCAD 1.1 salió en marzo de 2026 con mejoras en su banco de trabajo BIM; DIALux evo sigue siendo gratuito y su versión Pro es gratis un año para estudiantes y docentes que acrediten su condición. Las condiciones de licencias cambian: verifíquelas al iniciar el semestre.</p></div>
</section>

<section>
<h2>Lo que abre y exporta cada programa</h2>
<p>El dato que más sorprende: el plan gratuito de SketchUp para la web importa solo archivos SKP, JPG y PNG, y exporta STL, PDF y PNG (con marca de agua). La importación directa de DWG o DXF corresponde a las suscripciones de pago. Por eso, en la ruta inicial, el plano viaja de LibreCAD a SketchUp como <b>imagen PNG a escala conocida</b>, no como DXF.</p>
<div class="sim" data-sim="flujo-archivos" data-title="Cómo viajan los archivos entre programas"></div>
<div class="sim-guide"><ul>
<li>Escoja una ruta y siga las flechas: cada una dice qué formato pasa de un programa al siguiente.</li>
<li>Haga clic en un programa para ver qué abre, qué guarda y qué exporta.</li>
<li>Las flechas rojas punteadas marcan los pasos donde se suele perder la escala o la correspondencia: ahí hay que comprobar una cota.</li>
</ul></div>
</section>

<section>
<h2>Complementos gratuitos que ayudan</h2>
<div class="tablewrap"><table>
<thead><tr><th>Programa</th><th>Para qué sirve aquí</th><th>Obligatorio</th></tr></thead>
<tbody>
<tr><td>LibreOffice Calc o Excel</td><td>Cuadro de cargas con fórmulas, balance de fases, caída de tensión</td><td>Sí, o una tabla equivalente</td></tr>
<tr><td>QElectroTech</td><td>Diagrama unifilar con símbolos IEC y exportación a PDF o DXF</td><td>No: el unifilar también se dibuja en CAD</td></tr>
<tr><td>DIALux evo</td><td>Cálculo de iluminación de un ambiente (iluminancia y uniformidad)</td><td>No: en vivienda privada el RETILAP no exige diseño de iluminación</td></tr>
<tr><td>FreeCAD (banco BIM)</td><td>Alternativa libre y sin conexión a SketchUp o Revit</td><td>No; solo si el docente lo autoriza</td></tr>
</tbody></table></div>
</section>

<section>
<h2>Escoger la ruta del equipo</h2>
<p>La elección depende de la experiencia previa, del equipo de cómputo y del acceso a licencias. Esta ayuda aplica los criterios de la guía; la decisión final la toma el docente para toda la clase.</p>
<div class="sim" data-sim="elegir-ruta" data-title="¿Qué ruta le conviene al equipo?"></div>

<section>
<h2>Reglas para no perder información entre programas</h2>
<ol>
<li><b>Un solo origen de coordenadas.</b> Ponga el cruce de los ejes A y 1 en (0, 0) en todos los archivos.</li>
<li><b>Unidades declaradas.</b> Metros en SketchUp; milímetros en LibreCAD o AutoCAD. Escriba la unidad en el rótulo.</li>
<li><b>Nombres iguales.</b> Las capas de CAD y las etiquetas de SketchUp usan los mismos nombres; los puntos, los mismos códigos.</li>
<li><b>Versiones con fecha.</b> <code>E02_tomas_v3_2026-10-20.dxf</code>. Nunca «final_final».</li>
<li><b>Comprobación cruzada.</b> Antes de cada entrega, mida en el 3D y en la planta la misma distancia (por ejemplo, del tablero a la ducha) y anote ambas.</li>
</ol>
</section>

<section>
<h2>Resumen</h2>
<div class="box keys"><ul>
<li>Ruta inicial: SketchUp Free + LibreCAD; ruta CAD: SketchUp Free + AutoCAD; ruta BIM: Revit. Todas entregan lo mismo.</li>
<li>SketchUp Free importa SKP, JPG y PNG: el plano entra como imagen a escala y se comprueba con una cota.</li>
<li>LibreCAD trabaja en DXF y exporta PDF e imágenes; el cuadro de cargas va en hoja de cálculo.</li>
<li>Mismo origen, mismas unidades declaradas, mismos nombres y versiones con fecha.</li>
</ul></div>
</section>
