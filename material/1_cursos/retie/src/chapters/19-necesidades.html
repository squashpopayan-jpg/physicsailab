<p class="lead">Antes de dibujar un solo símbolo, el equipo debe saber qué necesita cada ambiente y por qué. La lista de puntos y cargas por ambiente es la evidencia de la semana 3. Se arma con dos fuentes: las reglas de la NTC 2050 a las que remite el RETIE y los supuestos de uso que el equipo declara.</p>

<section>
<h2>Del uso del ambiente a los puntos</h2>
<p>Para cada ambiente, el equipo responde cuatro preguntas y anota las respuestas en la memoria como supuestos:</p>
<ol>
<li><b>¿Qué se hace allí?</b> Cocinar, dormir, estudiar, lavar. De eso salen los aparatos.</li>
<li><b>¿Qué aparatos fijos o especiales hay?</b> Ducha, estufa, nevera, lavadora, calentador. Tienen circuito o salida propia.</li>
<li><b>¿Hay agua cerca?</b> Lavaplatos, lavamanos, ducha, lavadero, intemperie. Define dónde va GFCI y qué encerramiento.</li>
<li><b>¿Cómo se ilumina y desde dónde se enciende?</b> Puntos de luz y la ubicación del interruptor junto a la chapa de la puerta.</li>
</ol>
<div class="tablewrap"><table>

<tbody>

</section>

<section>
<h2>Tomas cada 1,8 m</h2>
<p>En salas, comedores, alcobas y estudios, ningún punto de la línea de piso de un espacio de pared puede quedar a más de 1,8 m de una toma, medidos a lo largo del muro (NTC 2050, 210.52(A), por remisión del RETIE 3.28.1 o). Las puertas y los vanos interrumpen la línea; las ventanas no. Todo espacio de pared de 0,6 m o más cuenta. La idea es que cualquier aparato con un cordón de 1,8 m alcance una toma sin extensión.</p>
<div class="sim" data-sim="tomas-perimetro" data-title="Regla de 1,8 m en un ambiente"></div>
<div class="sim-guide"><ul>
<li>La línea verde es la parte del perímetro cubierta; la roja, la que queda a más de 1,8 m de una toma de su mismo espacio de pared.</li>
<li>Arrastre las tomas a lo largo de los muros. Con <b>Sugerir mínimo</b>, la simulación las reparte: un espacio de L metros necesita aproximadamente L/3,6 tomas.</li>
<li>En la sala, la puerta de entrada y el vano hacia la cocina parten el perímetro en tres espacios: cada uno se cubre por separado.</li>
</ul></div>
</section>

<section>
<h2>Los mesones de la cocina</h2>
<p>Sobre los mesones, ningún punto de la línea de pared puede quedar a más de 600 mm de una toma, y todo tramo de mesón de 300 mm o más lleva cobertura (NTC 2050, 210.52(C)). No se exige toma detrás de la estufa ni del lavaplatos. En la práctica, una toma cada 1,2 m a 1,10 m de altura.</p>
<div class="sim" data-sim="meson" data-title="Tomas del mesón en L"></div>
<div class="sim-guide"><ul>
<li>La casa ejemplo usa cuatro tomas en 4,35 m de mesón en L. Quite una y vea qué tramo queda descubierto.</li>
<li>Note que todas sirven el mesón: todas requieren GFCI (210.8(A)(6)).</li>
</ul></div>
</section>

<div class="box crit"><p>Los niveles de iluminación de una vivienda son criterio de diseño: el RETILAP de 2026 exceptúa de diseño de iluminación las áreas privadas de uso final residencial (Libro 3 del RETILAP, 3.1.4.2 y 3.1.4.3), y el RETIE pide ubicar las salidas e interruptores para una iluminación eficiente y segura (3.14.1 b). La guía usa como referencia orientativa: sala-comedor 150 lx, cocina 200 lx (300 lx con luz de trabajo sobre el mesón), alcobas 100 lx, baño 150 lx, hall 100 lx y patio de ropas 100 lx, y lo declara así en la memoria.</p></div>

<section>
<h2>Resumen</h2>
<div class="box keys"><ul>
<li>Cada ambiente se describe por su uso, sus aparatos, el agua cercana y su iluminación.</li>
<li>Tomas cada 1,8 m por espacio de pared; en mesones, a no más de 600 mm de cualquier punto.</li>
<li>Las cargas especiales se toman de la placa o se suponen y se declaran.</li>
<li>El inventario por ambiente es la evidencia de la semana 3 y la base del cuadro de cargas.</li>
</ul></div>
