<template class="chapter-src" data-id="tierra" data-num="7" data-title="Puesta a tierra y equipotencialidad" data-part="Parte II · Electricidad para ingenieros civiles" data-short="Título 12 del Libro 3: para qué sirve la puesta a tierra, el régimen TN-C-S, el puente entre neutro y tierra solo en el tablero general, electrodos, valores de referencia, Wenner, caída de potencial, tensión de contacto y conductores">
<p class="lead">La puesta a tierra es lo que convierte una falla de aislamiento en un disparo en lugar de un accidente. Para un ingeniero civil tiene además un lado constructivo: la varilla se entierra en el antejardín, la caja de inspección se deja en el andén y el acero de refuerzo de la estructura debe quedar conectado al sistema. Este capítulo es la base de la exposición sobre el Título 12.</p>

<section>
<h2>Para qué sirve</h2>
<div class="box norma"><p>Entre los objetivos que el RETIE asigna al sistema de puesta a tierra están permitir a los equipos de protección despejar rápidamente las fallas, servir de referencia común al sistema eléctrico, conducir y disipar las corrientes de falla, electrostática y de rayo, y realizar una conexión de baja resistencia con la tierra. El reglamento advierte que el criterio fundamental para la seguridad de las personas es la máxima energía que pueden soportar por las tensiones de paso, contacto o transferidas, <b>y no el valor de resistencia de puesta a tierra tomado aisladamente</b>, aunque un valor bajo es siempre deseable (Libro 3, Título 12).</p></div>
<ul>
<li>Los elementos metálicos que no forman parte de la instalación eléctrica no pueden usarse como conductores del sistema de puesta a tierra, aunque muchas veces deban conectarse a él (3.12.1 a).</li>
<li>Los elementos metálicos principales que actúan como refuerzo estructural de una edificación deben tener una conexión eléctrica permanente con el sistema de puesta a tierra general (3.12.1 b).</li>
<li>Cuando un edificio tiene varias puestas a tierra, todas deben estar interconectadas; quedan prohibidas las puestas a tierra separadas o independientes (3.12.1 e y f).</li>
</ul>
</section>

<section>
<h2>El régimen TN-C-S y el puente en el tablero general</h2>
<p>En la red de baja tensión para servicio domiciliario solo se aceptan los regímenes de conexión a tierra TN-C-S o TN-S: el neutro del transformador está puesto a tierra sólidamente y el usuario conecta las masas al conductor puesto a tierra. Queda prohibido el régimen TN-C, en el que el mismo conductor hace de neutro y de protección en toda la instalación. Aguas abajo del primer medio de desconexión de la casa se considera el sistema TN-S (Libro 3, Título 25).</p>
<div class="box norma"><p>En toda instalación de uso final, el conductor neutro y el conductor de puesta a tierra deben ir independientes entre sí y deben conectarse con un puente equipotencial <b>solo en el tablero general</b>, donde está la protección principal y la conexión al electrodo de puesta a tierra (Libro 3, Título 27).</p></div>
<div class="sim" data-sim="tn-cs" data-title="Por dónde vuelve la corriente: puente correcto y puente indebido"></div>
<div class="sim-guide"><ul>
<li>Con el puente solo en el tablero, toda la corriente de la carga vuelve por el neutro; el conductor de tierra no lleva nada en operación normal.</li>
<li>Agregue un <b>puente indebido</b> en una caja de toma (un error común de obra): la corriente se reparte y el conductor de tierra y las carcasas quedan transportando corriente de carga.</li>
<li>Abra el neutro aguas arriba con el puente indebido: las carcasas metálicas quedan al potencial de la fase a través de la carga.</li>
</ul></div>
</section>

<section>
<h2>El electrodo y su resistencia</h2>
<p>El electrodo más común en vivienda es la varilla vertical. El Libro 2 exige que la varilla o el tubo tenga mínimo <b>2,4 m</b> de longitud; para cobre, 12,7 mm de diámetro, y para acero recubierto de cobre electrodepositado, 14 mm con 250 µm de recubrimiento (2.3.15.1.1, Tabla 2.3.15.1.1.a). No se permite aluminio en los electrodos.</p>
<div class="eq key" data-name="Varilla vertical (Dwight)">\[ R_1 = \frac{\rho}{2\pi L}\left[\ln\!\left(\frac{4L}{a}\right) - 1\right] \]</div>
<p>donde \(\rho\) es la resistividad del suelo, \(L\) la longitud y \(a\) el radio de la varilla. Con varias varillas separadas una distancia comparable a su longitud la resistencia baja, pero no en proporción al número de varillas, porque sus zonas de influencia se traslapan.</p>
<div class="sim" data-sim="varillas" data-title="Resistencia de puesta a tierra con una o varias varillas"></div>
<div class="sim-guide"><ul>
<li>Con un suelo de 100 Ω·m, una varilla de 2,4 m da unos 40 Ω: no alcanza el valor de referencia de 25 Ω del punto neutro de la acometida.</li>
<li>Dos varillas separadas 2,4 m bajan a unos 23 Ω. La casa ejemplo usa dos varillas en el antejardín.</li>
<li>Juntar las varillas a 0,5 m casi no ayuda: compare con la separación de 4 m.</li>
<li>Alargar la varilla ayuda poco: la resistencia depende del logaritmo de la longitud.</li>
</ul></div>
<div class="tablewrap narrow"><table>
<thead><tr><th>Aplicación</th><th class="c">Valor máximo de referencia</th></tr></thead>
<tbody>
<tr><td>Estructuras y torrecillas metálicas de líneas o redes con cable de guarda</td><td class="num c">20 Ω</td></tr>
<tr><td>Subestaciones de alta y extra alta tensión</td><td class="num c">1 Ω</td></tr>
<tr><td>Subestaciones de media tensión</td><td class="num c">10 Ω</td></tr>
<tr><td>Protección contra rayos</td><td class="num c">10 Ω</td></tr>
<tr><td><b>Punto neutro de acometida en baja tensión</b></td><td class="num c"><b>25 Ω</b></td></tr>
<tr><td>Redes para equipos electrónicos o sensibles</td><td class="num c">10 Ω</td></tr>
</tbody></table></div>
<p>Es la Tabla 3.12.3.a. Cumplir el valor no exonera de garantizar que las tensiones de paso, contacto y transferidas no superen las permitidas (3.12.3).</p>
<div class="box norma"><ul>
<li>Las conexiones bajo el nivel del suelo se hacen con soldadura exotérmica o con conector certificado para enterramiento directo (3.12.1 c).</li>
<li>Se dejan puntos de conexión accesibles e inspeccionables, con cajas de inspección de mínimo 30 cm × 30 cm (o 30 cm de diámetro) con tapa removible (3.12.1 d).</li>
<li>La parte superior del electrodo puede quedar visible máximo 15 cm desde el fondo de la caja de registro (3.12.2.1 c.2).</li>
<li>El electrodo puede instalarse vertical, a 45° o horizontal a 75 cm de profundidad (3.12.2.1 c.3).</li>
</ul></div>
</section>

<section>
<h2>Medir la resistividad del suelo: método de Wenner</h2>
<p>Se clavan cuatro electrodos en línea separados una distancia \(a\); se inyecta corriente por los extremos y se mide la tensión entre los centrales. Cuando la profundidad de los electrodos es menor que una décima parte de \(a\), la resistividad aparente es (Ecuación 6 del Libro 3):</p>
<div class="eq">\[ \rho = 2\pi a R \]</div>
<p>Al aumentar \(a\), la corriente penetra más hondo: la curva de resistividad aparente contra separación revela si el suelo tiene capas.</p>
<div class="sim" data-sim="wenner" data-title="Sondeo de Wenner en un suelo de dos capas"></div>
<div class="sim-guide"><ul>
<li>Con separaciones pequeñas se mide la capa superficial; con separaciones grandes, la profunda.</li>
<li>Pruebe una capa vegetal húmeda de 60 Ω·m sobre un estrato de 400 Ω·m: una varilla de 2,4 m queda casi toda en el suelo bueno.</li>
</ul></div>
</section>

<section>
<h2>Medir la resistencia de puesta a tierra: caída de potencial</h2>
<p>Con un telurómetro se ubica un electrodo auxiliar de corriente a una distancia \(d\) de al menos cinco veces la mayor dimensión de la puesta a tierra, y uno de tensión a una distancia \(x\). El valor que se toma es el medido con la sonda de tensión al <b>61,8 %</b> de la distancia del electrodo de corriente, si el terreno es uniforme (3.12.4.2).</p>
<div class="sim" data-sim="caida-potencial" data-title="Curva de caída de potencial"></div>
<div class="sim-guide"><ul>
<li>La curva tiene una meseta en el centro: allí la sonda está fuera de las zonas de influencia de ambos electrodos.</li>
<li>Acerque el electrodo de corriente a 5 m: la meseta desaparece y el valor depende mucho de dónde se ponga la sonda.</li>
</ul></div>
</section>

<section>
<h2>Tensión de contacto admisible</h2>
<p>La Tabla 3.12.1.a da la máxima tensión de contacto que puede aplicarse a una persona (con resistencia de 1 000 Ω) según el tiempo de despeje de la falla. La columna de público en general se obtuvo de la curva C1 de la norma IEC 60479-1; la ocupacional, de IEEE 80 para personas de 50 kg.</p>

<section>
<h2>Los conductores de tierra</h2>
<ul>
<li>El conductor que une el electrodo con el barraje principal se selecciona con la Tabla 250-66 de la NTC 2050 (3.12.2.2): para una acometida de 6 AWG de cobre es de 8 AWG de cobre.</li>
<li>El conductor de protección de cada circuito se selecciona con la Tabla 250-122 según el interruptor (3.12.2.3 a): 14 AWG para 15 A, 12 AWG para 20 A y 10 AWG para 30 A y hasta 60 A.</li>
<li>Los conductores de tierra son continuos, sin interruptores ni medios de desconexión (3.12.2.3 c).</li>
<li>El conductor de tierra acompaña a los conductores activos en todo su recorrido y por la misma canalización; en las cajas, incluso no metálicas, debe haber un elemento de conexión para él (3.12.2.3 d).</li>
<li>Si va aislado, su aislamiento es verde o verde con rayas amarillas (3.12.2.3 e).</li>
</ul>
<div class="box entrega"><p>En la planta E04 y en el unifilar se representan: el electrodo con su caja de inspección, el conductor del electrodo con su calibre, el barraje de tierra del tablero, el puente equipotencial entre neutro y tierra en el tablero general y el conductor de protección de cada circuito. El esquema constructivo de una instalación básica debe señalar la ubicación de la puesta a tierra, incluyendo la longitud y el material del electrodo y el calibre y tipo del conductor (3.3.2.1 a).</p></div>
</section>

<section>
<h2>Resumen</h2>
<div class="box keys"><ul>
<li>La seguridad la dan las tensiones de paso y contacto; la resistencia es un indicador.</li>
<li>Régimen TN-C-S hasta el tablero general; TN-S aguas abajo; un solo puente neutro-tierra, en el tablero general.</li>
<li>Varilla de 2,4 m mínimo; 25 Ω como referencia para el neutro de la acometida; caja de inspección de 30 × 30 cm.</li>
<li>Wenner para la resistividad; caída de potencial al 61,8 % para la resistencia.</li>
<li>Electrodo con 8 AWG para una acometida de 6 AWG; tierra de circuitos por la Tabla 250-122.</li>
</ul></div>
</section>
