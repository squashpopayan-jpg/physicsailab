<p class="lead">La última semana no es para dibujar más, sino para que todo se corresponda: el código de cada punto igual en el 3D y en las plantas, cada decisión con su fuente y su evidencia, y cada integrante capaz de abrir un archivo y explicar una decisión respaldada por la norma.</p>

<section>
<h2>Láminas: formato y escala</h2>
<p>La guía propone escala 1:50, ajustable si el formato de impresión exige otra para mantener la lectura clara. Las plantas diferencian arquitectura, estructura y electricidad por capas, e incluyen escala, cotas, leyenda, circuitos, referencias al tablero y las alturas justificadas.</p>
<div class="sim" data-sim="escala-formato" data-title="¿En qué formato cabe la planta?"></div>
<div class="sim-guide"><ul>
<li>A 1:50, la casa ejemplo con sus ejes y cotas ocupa unos 22 cm × 26 cm: cabe en un pliego A3 vertical con el rótulo.</li>
<li>A 1:25 haría falta un A1; a 1:100 cabe en un A4, pero las marcas de conductores ya no se leen.</li>
<li>El texto de 2,5 mm en el papel mide 12,5 cm en el modelo a 1:50: es el tamaño que se usa al rotular en LibreCAD.</li>
</ul></div>
<div class="box note"><p>El rótulo de cada lámina incluye: nombre del proyecto y del caso, código de la lámina (A01, E01…), contenido, escala, fecha, versión, integrantes, curso y docente, y la nota «Propuesta académica de coordinación; no apta para construcción».</p></div>
</section>

<section>
<h2>La matriz normativa</h2>
<p>La matriz relaciona al menos ocho decisiones del proyecto con su fuente y su evidencia. Se registra el libro, artículo, numeral o literal exacto y la versión consultada. Si una decisión es un criterio propio de diseño, se identifica como tal y se explica su fundamento. Escribir el artículo sin aplicarlo al caso no demuestra cumplimiento.</p>
<div class="sim" data-sim="matriz-normativa" data-title="Matriz normativa del proyecto"></div>
<div class="sim-guide"><ul>
<li>La matriz viene con doce decisiones de la casa ejemplo. Edítelas para su caso: los cambios se guardan en este navegador.</li>
<li>La revisión marca los renglones sin fuente exacta o sin código de evidencia (A01, M3D, E01 a E04, MEM).</li>
<li>Descárguela en CSV para pegarla en la memoria.</li>
</ul></div>
</section>

<section>
<h2>La memoria</h2>
<p>La memoria es breve, de unas 4 a 6 páginas más planos y anexos. Explica el uso de la edificación, la alimentación supuesta, las cargas consideradas, la organización de circuitos y la ubicación del tablero, con el origen de los datos y los supuestos. Distingue lo calculado, lo supuesto y lo pendiente, y justifica los ítems que no aplican.</p>
<div class="sim" data-sim="memoria" data-title="Borrador de la memoria con los datos del proyecto"></div>
<div class="sim-guide"><ul>
<li>El borrador se arma con los números del modelo: áreas, cargas, demanda, acometida, circuitos, puesta a tierra y conflictos.</li>
<li>Escriba los nombres del equipo y descárguelo en Markdown o HTML para terminarlo en el procesador de texto.</li>
</ul></div>
</section>

<section>
<h2>La carpeta de entrega</h2>
<div class="tablewrap narrow"><table>

</section>

<section>
<h2>La sustentación</h2>
<ul>
<li>Cada integrante abre un archivo, muestra una parte que elaboró y explica una decisión respaldada por la norma.</li>
<li>Preguntas típicas: ¿por qué el tablero está ahí?, ¿qué cambia si la acometida es de 4 AWG?, ¿qué pasa si se quita el GFCI de la cocina?, ¿por qué ese tubo cruza la viga en ese punto?, ¿qué falta para que un profesional pudiera firmar esto?</li>
<li>No se requiere un render fotorrealista para demostrar el aprendizaje.</li>
</ul>
<div class="sim" data-sim="rubrica" data-title="Autoevaluación con la rúbrica"></div>
</section>

<section>

<li>Memoria de 4 a 6 páginas que separa lo calculado, lo supuesto y lo pendiente.</li>
