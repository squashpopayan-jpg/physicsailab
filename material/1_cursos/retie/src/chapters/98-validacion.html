<p class="lead">Las simulaciones de la guía no llaman a ningún programa externo: los calibres, las resistencias, la demanda, las curvas de disparo, la puesta a tierra, la iluminación, el DXF y el ZIP están escritos para la guía. Para confiar en lo que muestran, cada cálculo se compara aquí con un valor publicado o con un cálculo hecho a mano, independiente del código que se prueba.</p>

<section>
<h2>Cómo se valida</h2>
<ul>
<li><b>Valores publicados:</b> áreas y resistencias de la Tabla 8 del capítulo 9 de la NTC 2050, factores de temperatura de la Tabla 310.15(B)(2)(a), el ejemplo D1(a) del anexo D de la NEC para la demanda, la fórmula de disparo del GFCI de UL 943, los puntos convencionales de IEC 60898-1 y el valor de una varilla de la IEEE Std 142.</li>
<li><b>Cálculos a mano:</b> demanda, balance y caídas de tensión de la casa ejemplo rehechos con aritmética explícita, el llenado con las áreas de las Tablas 4 y 5 y el volumen de una caja con la regla de 314.16(B).</li>
<li><b>Identidades y límites:</b> el método de Wenner en suelo homogéneo, los límites de capa gruesa y delgada, la regla del 61,8 % de la caída de potencial y la conservación del flujo luminoso.</li>
<li><b>Archivos:</b> estructura del DXF, capas declaradas, página de códigos de los textos y el valor de comprobación del CRC-32 del ZIP.</li>
</ul>
<p>Cada prueba muestra el valor obtenido, la referencia, la fuente y la tolerancia. Las tolerancias reflejan el redondeo de las tablas publicadas (por ejemplo, 0,05 Ω/km en resistencias que la tabla da con tres cifras).</p>
<div class="box note"><p>Fuera del navegador, <code>node tests/validar.js</code> ejecuta las mismas pruebas. Las 130 fórmulas de la plantilla XLSX se verificaron además con un motor de cálculo de hojas independiente, que obtuvo los mismos valores que la biblioteca.</p></div>
</section>
