<p class="lead">El RETIE es el Reglamento Técnico de Instalaciones Eléctricas de Colombia, expedido por el Ministerio de Minas y Energía. No es una norma voluntaria ni una recomendación: es de obligatorio cumplimiento y sin la demostración de conformidad el operador de red no debe energizar la instalación. Este capítulo enseña a moverse dentro de él y a citarlo con exactitud, que es lo primero que se evalúa en las exposiciones.</p>

<section>
<h2>Reglamento técnico y norma técnica</h2>
<p>Una <b>norma técnica</b>, como la NTC 2050 (Código Eléctrico Colombiano), la expide un organismo de normalización y es voluntaria hasta que algo la vuelve obligatoria. Un <b>reglamento técnico</b> lo expide el Estado, es obligatorio y puede adoptar partes de normas técnicas. El RETIE hace exactamente eso: adapta requisitos de los primeros siete capítulos de la NTC 2050 segunda actualización, basada en la NFPA 70 de 2017, y sus tablas del capítulo 9 (Libro 3, Título 24). Si una norma referenciada contradice un requisito del reglamento, prima el reglamento.</p>
<div class="box hist"><ul>
<li><b>2004</b>: primera versión, Resolución 180398 del 7 de abril de 2004, en vigencia desde el 1 de mayo de 2005. Las instalaciones construidas antes de esa fecha deben al menos no representar alto riesgo.</li>
<li><b>2013</b>: Resolución 90708, la versión que muchos libros y cursos todavía citan.</li>
<li><b>2024</b>: Resolución 40117 del 2 de abril de 2024, que reorganiza el reglamento en cuatro libros.</li>
<li><b>2025 y 2026</b>: modificaciones por las Resoluciones 40304 de 2025 y 40284 del 23 de junio de 2026. Esta última es la referencia vigente en la consulta de octubre de 2026, y el portal del Ministerio ofrece sus cuatro libros y los anexos.</li>
</ul></div>
<div class="box warn"><p>Al citar, registre siempre la versión: «RETIE, Libro 3, artículo 3.28.1, literal g (Res. 40117 de 2024 modificada por la Res. 40284 de 2026)». Un numeral de la versión de 2013 casi nunca coincide con la de 2024: el antiguo artículo 20 no es el actual Título 20.</p></div>
</section>

<section>
<h2>Campo de aplicación y prohibiciones</h2>
<p>Para el reglamento son instalaciones eléctricas los circuitos con sus conductores, equipos y aparatos que se usan para generación, transmisión, transformación, distribución o uso final, con tensión nominal mayor o igual a 50 V en corriente continua o mayor de 25 V en corriente alterna, a menos de 1 000 Hz (Libro 3, 3.1.1). Aplica a las instalaciones nuevas, a las ampliaciones y a las remodelaciones. Entre las exclusiones están las instalaciones propias de vehículos que no sean vivienda, las de señales de telecomunicaciones, radio y televisión, y las de alarmas contra incendios (3.1.1.3).</p>
<div class="box norma"><ul>
<li>Se prohíbe instalar pararrayos con material radiactivo (3.1.2.1).</li>
<li>Se prohíbe usar materiales o artefactos reutilizados o remanufacturados en instalaciones de uso final, en especial interruptores automáticos, relés diferenciales e interruptores de falla a tierra, salvo que demuestren el cumplimiento con ensayos (3.1.2.2).</li>
<li>Se prohíbe usar la tierra como único conductor de retorno: no se aceptan sistemas monofilares (3.1.2.3).</li>
</ul></div>
</section>

<section>
<h2>Cómo citar con exactitud</h2>
<p>El Libro 3 se organiza en capítulos y títulos; dentro de los títulos, artículos con número de tres niveles (el primero es el libro); dentro de los artículos, numerales; y dentro de estos, literales y ordinales.</p>
<div class="tablewrap narrow"><table>
<thead><tr><th>Nivel</th><th>Ejemplo</th></tr></thead>
<tbody>
<tr><td>Libro</td><td>Libro 3 · Instalaciones objeto del RETIE</td></tr>
<tr><td>Capítulo</td><td>Capítulo 6 · Requisitos para instalaciones de uso final</td></tr>
<tr><td>Título</td><td>Título 28 · Clasificación de las instalaciones de uso final</td></tr>
<tr><td>Artículo</td><td>Artículo 3.28.1 · Instalaciones básicas</td></tr>
<tr><td>Literal</td><td>3.28.1, literal g · tomacorrientes con protección por falla a tierra</td></tr>
<tr><td>Remisión</td><td>NTC 2050 segunda actualización, sección 210.8, literales (A), (B) y (D)</td></tr>
</tbody></table></div>
<p>Cuando el RETIE remite a la NTC 2050, la cita completa incluye la sección de la norma. Y una cita no demuestra cumplimiento: hay que aplicarla al caso. «3.28.1 g» no dice nada; «TB, a 0,20 m del lavamanos, protegida por GFCI según 3.28.1 g y la sección 210.8(A)(1) de la NTC 2050» sí.</p>

</section>

<section>
<h2>Las normas que acompañan al RETIE</h2>
<ul>
<li><b>NTC 2050 segunda actualización</b>: a la que remite el artículo 3.28.1 para circuitos ramales, cálculos de carga, protecciones, puesta a tierra y métodos de alambrado (secciones 110, 210, 215, 220, 225, 230, 240, 250 y 300). Su texto completo se consulta en una copia de la institución o con acceso autorizado.</li>
<li><b>RETILAP</b> (Reglamento Técnico de Iluminación y Alumbrado Público): rige la iluminación como tal. El RETIE pide prever los puntos para cumplirlo (3.14.1); el RETILAP de 2026 exceptúa de diseño de iluminación las áreas privadas de vivienda.</li>
<li><b>NSR-10</b> (Reglamento Colombiano de Construcción Sismo Resistente): el RETIE lo cita para la canalización flexible en juntas de dilatación (3.17.6.1 c); su Título C regula las tuberías embebidas en el concreto.</li>
<li><b>Normas del operador de red</b>: definen acometidas, cajas de medidor y puntos de conexión en cada zona.</li>
<li><b>Leyes del ejercicio profesional</b> (Ley 51 de 1986 y Ley 842 de 2003): definen quién puede diseñar y construir (3.2.1).</li>
</ul>
</section>

<section>
<h2>Resumen</h2>
<div class="box keys"><ul>
<li>El RETIE es un reglamento técnico obligatorio; la versión vigente en octubre de 2026 es la Res. 40117 de 2024 modificada por las Res. 40304 de 2025 y 40284 de 2026.</li>
<li>Cuatro libros: disposiciones generales, productos, instalaciones y evaluación de la conformidad.</li>
<li>Aplica desde 25 V en corriente alterna; prohíbe materiales reutilizados en uso final y sistemas monofilares.</li>
<li>Se cita con libro, artículo, literal y versión, y la cita se aplica al caso.</li>
<li>Remite a la NTC 2050 (NFPA 70-2017) para circuitos, cálculos, protecciones y tierra; prima el reglamento.</li>
</ul></div>
