<p class="lead">Antes de dibujar hay que saber qué documento exige la ley para la casa y quién lo firma. La respuesta depende de un dato que parece menor: el calibre de la acometida, porque de él sale la capacidad instalable. Este capítulo prepara la exposición sobre los Títulos 2 y 3 del Libro 3.</p>

<section>
<h2>Quién puede intervenir una instalación</h2>
<div class="box norma"><p>El diseño, construcción, ampliación, modificación, remodelación e inspección de toda instalación objeto del RETIE, así como su operación, mantenimiento e intervención, deben ser dirigidos, supervisados y ejecutados por personas técnica y legalmente competentes según la ley colombiana (Libro 3, 3.2.1): ingenieros electricistas, electromecánicos y de distribución y redes eléctricas (Leyes 51 de 1986 y 842 de 2003); otros ingenieros solo en las partes de su especialización; tecnólogos en electricidad; y técnicos electricistas en el alcance de su matrícula.</p></div>
<p>Dos parágrafos del mismo artículo tocan directamente a la obra civil:</p>
<ul>
<li>Las actividades que no están directamente asociadas con riesgos de origen eléctrico, como la apertura de regatas o excavaciones, las obras civiles y el tendido de conductores, pueden ejecutarlas personas no electricistas, pero bajo la supervisión de una persona competente en electrotecnia (parágrafo 1).</li>
<li>Si quien dirige o ejecuta la instalación no tiene matrícula o no tiene la competencia legal, el operador de red no debe poner en servicio la instalación y debe informar a la Superintendencia de Industria y Comercio y al consejo profesional (parágrafo 3).</li>
</ul>
</section>

<section>
<h2>Deberes del constructor y del diseñador</h2>
<div class="tablewrap"><table>
<thead><tr><th>Quién</th><th>Debe</th><th>Referencia</th></tr></thead>
<tbody>
<tr><td>Responsable de la obra civil y de la instalación eléctrica</td><td>Contratar personas competentes; usar productos con certificado; estar inscrito en el registro de la SIC si emite declaraciones; revisar los diseños desde el inicio e informar si no cumplen; firmar los planos finales y el manual de operación y mantenimiento; suscribir la declaración de cumplimiento</td><td>3.2.2 a–f</td></tr>
<tr><td>Constructor</td><td>Dejar evidencia verificable de los productos usados en cada fase: certificados (marca, referencia, número y vigencia), fotografías o videos del producto instalado</td><td>3.2.2, parágrafo 3</td></tr>
<tr><td>Diseñador</td><td>Diseñar para que la construcción cumpla todo el RETIE; firmar memorias, especificaciones y planos con nombre y matrícula; verificar distancias de seguridad y servidumbres; estar inscrito en el registro de la SIC</td><td>3.2.3</td></tr>
</tbody></table></div>
<div class="box explain"><p>El ingeniero civil que dirige la obra de una casa es «el responsable de la construcción de la obra civil» del artículo 3.2.2. No firma el diseño eléctrico, pero sí responde por contratar a quien lo firme, por no comprar breakers usados y por dejar las fotografías de los productos instalados antes de pañetar.</p></div>
</section>

<section>
<h2>¿Diseño detallado, diseño básico o esquema constructivo?</h2>
<p>Toda instalación debe tener un diseño hecho por personas competentes, detallado o básico según el caso (3.3.1). Las de mayor riesgo deben contar con diseño antes de construirse: generación, líneas, redes, subestaciones, instalaciones especiales, instituciones de enseñanza, lugares de atención al público, urbanizaciones, edificaciones de más de cuatro cuentas e instalaciones básicas individuales mayores a 15 kVA de capacidad instalada, entre otras.</p>
<p>Las instalaciones básicas de baja complejidad no requieren diseño eléctrico y se soportan en un <b>esquema constructivo</b>: hasta cuatro cuentas, capacidad instalable no mayor a 15 kVA y tensión no mayor a 240 V, como las residenciales, los pequeños comercios y las pequeñas industrias (3.3.2). El esquema lo firma una persona competente y se entrega al propietario y al operador de red.</p>
<div class="box def"><p><b>Capacidad o potencia instalable</b>: la capacidad en kVA que puede soportar la acometida a tensión nominal de la red sin que su temperatura supere 60 °C, para instalaciones con capacidad de corriente menor de 100 A, o 75 °C si es mayor (Libro 1, 1.2.1).</p></div>
<div class="eq">\[ S_{\text{instalable}} = I_{\text{acometida}}(60\,^\circ\mathrm{C})\times V \quad\Rightarrow\quad 6\ \text{AWG: } 55\ \text{A}\times 240\ \text{V} = 13{,}2\ \text{kVA} \]</div>
<div class="sim" data-sim="ruta-conformidad" data-title="¿Qué exige el RETIE para esta instalación?"></div>
<div class="sim-guide"><ul>
<li>La casa ejemplo, con acometida de 6 AWG a 120/240 V, tiene 13,2 kVA instalables: esquema constructivo y declaración de cumplimiento del constructor, sin dictamen de inspección.</li>
<li>Cambie la acometida a 4 AWG: 70 A × 240 V = 16,8 kVA. La misma casa pasa a requerir diseño y certificación plena. Escoger el calibre es también escoger el trámite.</li>
<li>Pruebe un conjunto de cinco casas con una misma licencia: requiere certificación plena aunque cada una tenga menos de 15 kVA.</li>
</ul></div>
</section>

<section>
<h2>El contenido mínimo que adopta el proyecto</h2>
<p>Aunque la casa ejemplo solo requiera esquema constructivo, el proyecto académico entrega más: toma como guía los ítems del <b>diseño básico</b> (3.3.1.2 a) y el contenido del <b>esquema constructivo</b> (3.3.2.1). Así cada equipo practica lo que exigiría una instalación un poco mayor.</p>
<div class="tablewrap"><table>
<thead><tr><th>Exigencia</th><th>Fuente</th><th>Entregable del proyecto</th></tr></thead>
<tbody>
<tr><td>Análisis de riesgos de origen eléctrico y medidas para mitigarlos</td><td>3.3.1.2 a.1</td><td>MEM (matriz del Libro 1)</td></tr>
<tr><td>Diseño del sistema de puesta a tierra</td><td>3.3.1.2 a.2</td><td>E04 y MEM</td></tr>
<tr><td>Cálculo y coordinación de protecciones contra sobrecorrientes</td><td>3.3.1.2 a.3</td><td>E04 (cuadro) y circuito representativo</td></tr>
<tr><td>Cálculos de canalizaciones y volumen de encerramientos</td><td>3.3.1.2 a.4</td><td>E03 y MEM</td></tr>
<tr><td>Cálculos de regulación de tensión</td><td>3.3.1.2 a.5</td><td>MEM (circuito representativo y acometida)</td></tr>
<tr><td>Diagramas unifilares</td><td>3.3.1.2 a.6</td><td>E04</td></tr>
<tr><td>Planos eléctricos para construcción</td><td>3.3.1.2 a.7</td><td>E01, E02, E03</td></tr>
<tr><td>Distancias de seguridad requeridas</td><td>3.3.1.2 a.8</td><td>MEM (acometida y fachada)</td></tr>
<tr><td>Ubicación de la puesta a tierra con longitud y material del electrodo, calibre y tipo de conductor</td><td>3.3.2.1 a</td><td>E04</td></tr>
<tr><td>Ubicación del sistema de medida y del tablero</td><td>3.3.2.1 b y c</td><td>E02 y E04</td></tr>
<tr><td>Ubicación de canalizaciones y encerramientos con diámetros, tipo y material</td><td>3.3.2.1 d</td><td>E03</td></tr>
<tr><td>Número y calibre de conductores por tramo (neutro, fases, tierra), tipo y material</td><td>3.3.2.1 e</td><td>E03 (marcas de conductores)</td></tr>

<div class="box note"><p>En las memorias de cálculo, el diseñador debe mencionar expresamente los ítems que, a su juicio, no aplican y explicar por qué (3.3.1.2, parágrafo 1). En el proyecto, la memoria debe hacer lo mismo: por ejemplo, «campos electromagnéticos: no aplica, la corriente de la acometida es muy inferior a 1 000 A (3.3.3.2)».</p></div>
</section>

<section>
<h2>Resumen</h2>
<div class="box keys"><ul>
<li>Solo personas competentes con matrícula diseñan, construyen e inspeccionan (3.2.1); la obra civil asociada se hace bajo su supervisión.</li>
<li>El constructor contrata personas competentes, usa productos certificados y guarda la evidencia (3.2.2).</li>
<li>Instalación básica de hasta 4 cuentas, ≤ 15 kVA instalables y ≤ 240 V: esquema constructivo (3.3.2).</li>
<li>La capacidad instalable sale de la acometida a 60 °C; el calibre decide el trámite.</li>
<li>El proyecto entrega el contenido del diseño básico y del esquema constructivo, y justifica lo que no aplica.</li>
</ul></div>
</section>
