<p class="lead">El tablero es el único punto de la casa donde se ven juntos todos los circuitos, la puesta a tierra y el neutro. El RETIE lo considera un equipo de frecuente riesgo de arco eléctrico y por eso le dedica requisitos de ubicación, de rotulado y de verificación. Su ubicación es, además, una decisión de arquitectura y de estructura.</p>

<section>
<h2>Dónde se ubica</h2>
<div class="box norma"><ul>
<li>El tablero debe ser fácilmente accesible, sin retirar obstáculos, y permitir accionar los interruptores; el espacio de trabajo debe tener las dimensiones del Título 4 (3.17.8 r).</li>
<li>Con partes energizadas de hasta 150 V a tierra, el espacio de trabajo mínimo es de 2 m de alto, 0,76 m de ancho (o el del equipo) y 0,9 m de profundidad, y debe permitir abrir las puertas a 90° (Título 4, literal e).</li>
<li>Se prohíbe instalar tableros en paredes adyacentes a los peldaños de las escaleras; bajo escaleras se permite si se cumplen los espacios de trabajo (3.17.8 v).</li>
<li>Los tableros con partes energizadas expuestas van en lugares permanentemente secos (3.17.8 y).</li>
<li>No se instalan interruptores automáticos dentro de espacios para bañeras o duchas (3.17.19 f), y la palanca más alta no queda a más de 2,0 m del piso (3.17.19 g).</li>
</ul></div>
<p>A esas reglas se suman criterios de diseño que el RETIE no fija pero que cambian el resultado: un tablero cerca del centro de las cargas acorta los circuitos y reduce la caída de tensión, y un tablero en un muro que está bajo una viga obliga a que todas las tuberías hacia la losa atraviesen esa viga.</p>
<div class="sim" data-sim="ubicar-tablero" data-title="¿Dónde poner el tablero de la casa ejemplo?"></div>
<div class="sim-guide"><ul>
<li>La posición B es la que adopta la casa ejemplo: en el muro del hall que no está bajo una viga, con más de 1 m libre al frente y cerca del centro de cargas.</li>
<li>La posición A, en el muro de la sala del eje B, cumple el RETIE, pero todas las salidas hacia la losa atraviesan la viga del eje B.</li>
<li>La posición D, en el baño, viola 3.17.19 f. La E, junto al mesón de la cocina, queda en zona húmeda.</li>
<li>Arrastre el marcador para probar otra ubicación y compare la longitud total de los circuitos.</li>
</ul></div>
</section>

<section>
<h2>Lo que debe tener el tablero</h2>
<div class="box norma"><ul>
<li>Rotulados e instructivos adheridos de manera clara y permanente, con su diagrama unifilar; los paneles rotulados por el fabricante con corriente y tensión nominales, número de fases y marca (3.17.8 s).</li>
<li>Los circuitos identificados en el cuerpo del tablero y de forma visible (3.17.8 w).</li>
<li>Alambrado de potencia con el código de colores del Título 5 (3.17.8 t).</li>
<li>Partes metálicas del armario, gabinete y marcos equipotencializadas y conectadas a tierra (3.17.8 u y p).</li>
<li>Si se usa como equipo de acometida, un puente de conexión equipotencial principal según 250.28(D) de la NTC 2050 (3.17.8 x).</li>
<li>Cada conductor puesto a tierra termina en un borne individual (3.17.8 aa).</li>
<li>El panel protegido por un dispositivo de sobrecorriente de valor no mayor que el del panel (3.17.8 z); en tableros de riel DIN no se supera la ocupación definida por el productor (3.17.8 b).</li>
<li>En vivienda, instalado con sus tapas para evitar contactos directos por personas no competentes (3.17.19 e).</li>
</ul></div>
<p>Antes de energizar, el instalador verifica, entre otros puntos, la identificación de conductores, la conexión a tierra de las puertas, los torques, que no queden objetos extraños dentro y la resistencia de aislamiento con un megóhmetro de al menos 500 V c.c., que no debe ser menor de 1 000 Ω/V (3.17.8 n). Para 240 V eso significa al menos 0,24 MΩ.</p>
</section>

<section>
<h2>Protección de las instalaciones de uso final</h2>
<div class="box norma"><ul>
<li>Toda edificación debe contar con al menos un tablero general con protección de sobrecorriente para cada alimentador o acometida (3.27.3 a), y cada circuito con su interruptor automático identificado (3.27.3 b).</li>
<li>Toda instalación debe disponer de un sistema de puesta a tierra y las carcasas de los equipos deben conectarse a tierra (3.27.2 b y d).</li>
<li>Se usan protecciones diferenciales de alta sensibilidad (GFCI o RCD) donde la persona es más vulnerable, como lugares húmedos y mojados (3.27.2 e).</li>
<li>No se conecta un dispositivo de sobrecorriente en el conductor puesto a tierra, a menos que abra simultáneamente todos los conductores del circuito (3.27.3 f).</li>
</ul></div>
</section>

<section>
<h2>Organizar los circuitos y balancear las fases</h2>
<p>En un tablero monofásico trifilar, las posiciones se alternan entre la fase A y la fase B. Un interruptor de dos polos ocupa dos posiciones contiguas y toma las dos fases (240 V). Repartir los circuitos de 120 V entre A y B de modo que las cargas queden parecidas reduce la corriente del neutro y la del totalizador en la fase más cargada.</p>
<div class="sim" data-sim="centro-carga" data-title="Centro de carga de la casa ejemplo"></div>
<div class="sim-guide"><ul>
<li>La asignación de la casa ejemplo deja las fases con 8 722 VA y 8 940 VA de carga conectada: poco más del 1 % de desbalance.</li>
<li>Pase la ducha (C7) a la fase B: el desbalance sube por encima del 40 % y el neutro lleva decenas de amperios.</li>
<li>Deje dos espacios de reserva: el RETIE no los exige, pero una casa crece.</li>
</ul></div>
<div class="box entrega"><p>En la planta E02 se ubica el tablero con su código, y en E04 se dibuja su diagrama unifilar con el directorio de circuitos: número, descripción, fase, protección, calibre y carga. Ese mismo directorio es el que va adherido en la tapa (3.17.8 s y w).</p></div>
</section>

<section>
<h2>Resumen</h2>
<div class="box keys"><ul>
<li>Tablero accesible, en lugar seco, fuera de baños y de muros junto a escaleras, con 0,9 m × 0,76 m × 2 m libres al frente.</li>
<li>Unifilar y directorio de circuitos adheridos; un neutro por borne; partes metálicas a tierra; con tapa.</li>
<li>Megóhmetro de 500 V c.c. y al menos 1 000 Ω/V antes de energizar.</li>
<li>Ubicarlo cerca del centro de cargas y en un muro que no esté bajo una viga ahorra cable y conflictos.</li>
<li>Repartir los circuitos entre las dos fases; los de 240 V ocupan dos posiciones.</li>
</ul></div>
</section>
