<p class="lead">Los manuales de los programas, la NEC (en la que se basa la NTC 2050) y buena parte de los tutoriales están en inglés. Este glosario da, para cada término de la guía, su nombre en inglés, una definición de una línea y el capítulo donde se estudia. También puede usar el buscador del menú lateral.</p>

<section>

<div class="tablewrap"><table class="cmp glos">

<tbody>
