<section>
<h2>Normas técnicas citadas</h2>
<ul>
<li>ICONTEC. <b>NTC 2050, Código Eléctrico Colombiano</b>, segunda actualización, basada en la NFPA 70 (NEC) de 2017. Artículos 210, 220, 240, 250, 310 y 314, y Capítulo 9. Es una norma de pago: consúltela en la biblioteca de la universidad.</li>
<li>NFPA 70, <b>National Electrical Code</b>, edición 2017, Anexo D (ejemplos de cálculo de demanda).</li>
<li><b>NSR-10</b>, Reglamento Colombiano de Construcción Sismo Resistente, Título C (concreto estructural), en particular C.6.3 sobre tubos embebidos en el concreto.</li>
<li>IEC 60479-1, efectos de la corriente sobre las personas; IEC 60617, símbolos gráficos para esquemas; IEC 60898-1, interruptores automáticos para instalaciones domésticas; IEC 61008-1, interruptores diferenciales.</li>
<li>UL 943, interruptores de circuito por falla a tierra (GFCI).</li>
<li>IEEE Std 142, puesta a tierra de sistemas industriales y comerciales (fórmula de Dwight); IEEE Std 81, medición de resistividad del suelo y de resistencia de puesta a tierra.</li>
</ul>
</section>

<section>
<h2>Documento de partida</h2>
<p>La guía desarrolla la propuesta «Guía del proyecto RETIE — Ingeniería Civil» del curso: equipos de 3 o 4 integrantes, vivienda de un piso de 60 a 120 m², tres rutas de software, seis semanas con evidencias, entregables A01, M3D, E01 a E04 y MEM, matriz normativa de al menos ocho decisiones y la rúbrica de evaluación.</p>
<div class="box note"><p>Esta guía es material académico. No sustituye el texto oficial del RETIE ni de la NTC 2050, ni el criterio de un profesional competente. Los diseños que se desarrollan en el curso son propuestas académicas de coordinación, no aptas para construcción.</p></div>
