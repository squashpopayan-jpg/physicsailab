<p class="lead">AutoCAD hace lo mismo que LibreCAD en la ruta inicial, más tres cosas que ahorran trabajo en este proyecto: bloques con <b>atributos</b> (cada toma sabe su código y su circuito), <b>presentaciones</b> con varias láminas del mismo modelo y <b>extracción de datos</b>, que cuenta los puntos por circuito y los lleva a la hoja de cálculo. Este taller supone que el equipo ya sabe dibujar en AutoCAD; se concentra en lo que es propio del proyecto eléctrico.</p>

<section>
<h2>Acceso y versión</h2>
<ul>
<li><b>Licencia educativa.</b> Autodesk ofrece acceso gratuito a estudiantes y docentes que verifiquen su condición en <a href="https://www.autodesk.com/education">autodesk.com/education</a>. La verificación puede tardar días: hágala en la semana 1.</li>
<li><b>Versión.</b> Cualquier versión reciente sirve. Para que todo el equipo pueda abrir los archivos, guarde en un formato DWG común (por ejemplo, AutoCAD 2018) o entregue también el DXF.</li>
<li><b>Idioma.</b> En AutoCAD en español los comandos tienen nombres traducidos; anteponiendo un guion bajo se usa el nombre inglés en cualquier idioma: <code>_OFFSET</code>, <code>_ATTDEF</code>. Esta guía escribe los comandos en inglés.</li>
</ul>

<section>
<h2>Lo que debe devolver la extracción de datos</h2>
<p>Con los bloques de la casa ejemplo y sus atributos llenos, la extracción de datos agrupada por bloque y circuito debe dar esta tabla. Úsela para comprobar la suya: si una fila no coincide, falta un atributo, sobra un bloque o hay un punto en la capa equivocada.</p>
<div class="sim" data-sim="extraccion-atributos" data-title="Extracción de datos esperada"></div>
<div class="sim-guide"><ul>
<li>Cambie el agrupamiento para ver la tabla por circuito, por ambiente o por bloque.</li>
<li>El conteo por circuito es el insumo del cuadro de cargas (capítulo 24): tomas generales a 180 VA y luminarias por su potencia.</li>
<li>Descargue el CSV para compararlo, columna por columna, con el que exporta AutoCAD.</li>

<section>
<h2>Resumen</h2>
<div class="box keys"><ul>
<li>El DXF del kit se abre directamente y se guarda como DWG; las unidades son milímetros.</li>
<li>Los bloques eléctricos llevan atributos CODIGO, CIRCUITO y ALTURA; <code>ATTSYNC</code> actualiza los ya insertados.</li>
<li>Una presentación por lámina, ventana a 1:50 bloqueada y capas congeladas por ventana.</li>
<li><code>DATAEXTRACTION</code> cuenta los puntos por circuito y alimenta el cuadro de cargas.</li>
<li><code>PUBLISH</code> genera el PDF de todas las láminas; a SketchUp Free se pasa un PNG.</li>
</ul></div>
</section>
