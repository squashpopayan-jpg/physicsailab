<p class="lead">Una vivienda es una instalación de uso final básica. El artículo 3.28.1 del Libro 3 es el que más decisiones fija en la casa: remite a la NTC 2050 para los circuitos y las protecciones y agrega reglas propias de Colombia, como el circuito exclusivo para ducha por encima de 1 500 m de altitud, que aplica de lleno en Popayán.</p>

<div class="box norma"><p>Parágrafo 2 del artículo 3.28.1: para este tipo de instalaciones no es obligatorio el uso de interruptores ni tomacorrientes AFCI, ni se requiere el uso de dos circuitos ramales para pequeños artefactos. Parágrafo 3: no es obligatorio un circuito exclusivo para los baños, salvo que las condiciones particulares lo requieran.</p></div>
<p>Los parágrafos muestran cómo el RETIE adapta la NTC 2050: la norma de origen pide dos circuitos de pequeños artefactos y un circuito de baño, y el reglamento colombiano los vuelve opcionales en instalaciones básicas. La casa ejemplo tiene dos circuitos de cocina igual, como criterio de diseño, porque la cocina concentra la mayor carga de tomas.</p>

<section>
<h2>Dónde se exige protección por falla a tierra</h2>
<p>La sección 210.8(A) de la NTC 2050 segunda actualización, a la que remite el literal g, lista los lugares de las unidades de vivienda donde los tomacorrientes de 125 V y hasta 20 A deben tener GFCI. En la NFPA 70 de 2017, su base, son: baños; garajes; exteriores; espacios bajo el piso a nivel o por debajo del terreno; sótanos sin acabados; cocinas, en las tomas que sirven los mesones; tomas a menos de 1,8 m del borde interior de un lavaplatos o lavamanos; cobertizos para botes; tomas a menos de 1,8 m del borde exterior de bañeras o duchas, y áreas de lavandería. La distancia se mide por el camino más corto que seguiría el cordón de un aparato sin atravesar pisos, muros, techos, puertas ni ventanas.</p>
<div class="box ntc"><p>La lista anterior resume la sección 210.8(A) de la NFPA 70 de 2017 en la que se basa la NTC 2050 segunda actualización. Antes de citarla en la memoria, verifíquela en el texto oficial de la NTC 2050 disponible en la institución.</p></div>
<div class="sim" data-sim="gfci-zonas" data-title="¿Necesita GFCI este tomacorriente?"></div>
<div class="sim-guide"><ul>
<li>Arrastre el tomacorriente rojo por la cocina: la toma de la nevera, a 1,2 m del lavaplatos, necesita GFCI aunque no sirva el mesón.</li>
<li>Llévelo al muro de la alcoba 2 que está detrás de la ducha: está a menos de 1,8 m en línea recta, pero el cordón no atraviesa el muro, así que no se exige.</li>
<li>Póngalo en el exterior o en el patio de ropas: siempre requiere GFCI.</li>
</ul></div>
</section>

<section>
<h2>La ducha eléctrica</h2>
<div class="box norma"><ul>
<li>Se alimenta por un circuito exclusivo, diseñado para la corriente nominal del fabricante, con su protección termomagnética; si solo se deja el circuito sin la ducha, se dimensiona para 30 A (3.17.15 b).</li>
<li>Si la ducha no tiene resistencia blindada, el circuito lleva protección diferencial contra falla a tierra (3.17.15 c).</li>
<li>El circuito no tiene derivaciones (3.17.15 d) y su protección queda fuera del alcance de una persona en el área mojada (3.17.15 e).</li>
<li>La conexión entre el circuito y la ducha es a prueba de agua; no se permite empalme con cinta aislante expuesto (3.17.15 f).</li>
<li>No se instalan tomacorrientes dentro ni encima del compartimento de la ducha; los que estén a menos de 1,8 m de su borde exterior llevan GFCI (3.17.15 g).</li>
<li>El circuito tiene conductor de puesta a tierra conectado al barraje del tablero y al terminal de la ducha (3.17.15 h).</li>
</ul></div>
<div class="box explain"><p>En Popayán casi todas las casas usan ducha eléctrica. Por eso el RETIE la exige por encima de 1 500 m de altitud (3.28.1 m): si no se deja el circuito, el usuario conecta la ducha a cualquier toma del baño con un empalme de cinta, que es justamente lo que el artículo 3.17.15 prohíbe.</p></div>
</section>

<section>
<h2>Circuitos mínimos</h2>
<div class="sim" data-sim="circuitos-minimos" data-title="¿Cuántos circuitos necesita la vivienda?"></div>
<div class="sim-guide"><ul>
<li>Una vivienda de 45 m² con acometida de 8 AWG a 120 V (4,8 kVA) cae en el literal l: tres circuitos de 20 A como mínimo.</li>
<li>Cambie la altitud a 1 760 m: aparece el circuito exclusivo de la ducha, salvo que marque otro medio de calentamiento.</li>
<li>Con 82,7 m² la regla es la de la NTC 2050 con los parágrafos del RETIE: compare el mínimo con los nueve circuitos de la casa ejemplo.</li>

<section>
<h2>La acometida</h2>
<div class="box norma"><ul>
<li>La acometida aérea de baja tensión es de tipo antifraude (concéntrico o trenzado), apta para intemperie, de cobre no menor a 8 AWG o 6 AWG si es de aluminio, validada con el cálculo de la sección 220, parte III (Título 26 d).</li>
<li>Caída de tensión en la acometida ≤ 3 % y en alimentadores y ramales ≤ 5 % (Título 26 f).</li>
<li>En la fachada los conductores que llegan a la caja del medidor van canalizados en tubería no metálica empotrada (Título 26 g); se evita que la acometida conduzca agua lluvia a la fachada o al medidor (h).</li>
<li>No se suministra energía a un inmueble desde otro ni se comparten neutro o tierra: cada inmueble con su acometida, medida y protección (Título 26 j).</li>
</ul></div>
</section>

<section>
<h2>La instalación provisional de la obra</h2>
<p>Mientras se construye la casa, la obra necesita energía para herramientas y luz. Esa instalación provisional es responsabilidad del constructor y tiene su propio artículo (3.28.2): se otorga por periodos de hasta seis meses, prorrogables por el operador de red.</p>
<div class="box norma"><ul>
<li>Se alimenta desde un tablero con protección de sobrecorriente y protección de falla a tierra (3.28.2 b).</li>
<li>Una persona competente presenta al operador de red un esquema constructivo y un procedimiento escrito de control de riesgos, y responde por su cumplimiento (3.28.2 c).</li>
<li>No se instalan en el piso cables que puedan ser pisados por personas o vehículos, salvo que estén certificados para trabajo pesado; no hay tomas sin caja; los conductores móviles son tipo cable con revestimiento (3.28.2 g).</li>
<li>Los tomacorrientes para las herramientas del personal de construcción tienen interruptor de circuito por falla a tierra (3.28.2 k).</li>
<li>La instalación provisional nunca se deja como definitiva (3.28.2 e).</li>
</ul></div>
</section>

<section>
<h2>Resumen</h2>
<div class="box keys"><ul>
<li>3.28.1 remite a la NTC 2050 (110, 210, 220, 240, 250, 300) y agrega reglas propias.</li>
<li>GFCI en baños, mesones, exteriores, lavandería y a menos de 1,8 m de lavaplatos, lavamanos o duchas, medido por el recorrido del cordón.</li>
<li>Ducha: circuito exclusivo de 30 A con diferencial, sin derivaciones ni cinta; obligatorio por encima de 1 500 m.</li>
<li>Tomas cada 1,8 m en la línea de piso; en mesones, cada 1,2 m; dormitorios de 9 m² o menos, dos tomas opuestas.</li>
<li>La instalación provisional de la obra es parte del RETIE (3.28.2) y lleva GFCI para las herramientas.</li>
</ul></div>
</section>
