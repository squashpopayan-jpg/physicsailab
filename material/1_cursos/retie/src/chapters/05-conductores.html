<p class="lead">Escoger un conductor es escoger cuánto se va a calentar. Un cable demasiado delgado no se nota el primer día: se nota años después, cuando el aislamiento endurecido se agrieta dentro de un tubo embebido en la losa. Este capítulo explica de dónde sale la capacidad de corriente y cuánto se pierde de tensión en el camino.</p>

<section>
<h2>Calibres AWG</h2>
<p>En Colombia los conductores de cobre se designan por el calibre AWG (American Wire Gauge), y el RETIE los cita también en mm². El número AWG decrece al aumentar la sección: cada tres números la sección se duplica, aproximadamente.</p>
<div class="eq">\[ d = 0{,}127\ \text{mm}\cdot 92^{(36-n)/39}, \qquad A = \frac{\pi d^2}{4}, \qquad R = \frac{\rho\,L}{A},\quad \rho_{20\,^\circ\mathrm{C}} = 0{,}017\,241\ \Omega\cdot\text{mm}^2/\text{m} \]</div>
<div class="sim" data-sim="awg" data-title="Explorador de calibres de cobre"></div>
<div class="sim-guide"><ul>
<li>Recorra los calibres usuales en vivienda: 14 AWG (alumbrado), 12 AWG (tomas), 10 AWG (ducha y estufa), 8 y 6 AWG (alimentador y acometida).</li>
<li>Compare las tres columnas de capacidad: en vivienda casi siempre manda la de 60 °C, porque los bornes de interruptores y tomas de circuitos de menos de 100 A se califican a esa temperatura.</li>
<li>Note el tope de la sección 240.4(D): 14 AWG no admite más de 15 A, 12 AWG más de 20 A y 10 AWG más de 30 A, aunque su columna de 90 °C diga más.</li>
</ul></div>
</section>

<section>
<h2>Por qué un conductor tiene una capacidad de corriente</h2>
<p>La corriente disipa en el conductor una potencia \(I^2R\) por metro. El calor sale a través del aislamiento, del tubo y del concreto o la mampostería. El conductor se calienta hasta que lo que entra iguala lo que sale. La capacidad de corriente es la corriente que lleva el conductor justo a la temperatura máxima que soporta su aislamiento.</p>
<div class="eq">\[ C\,\frac{\dd T}{\dd t} = I^2 R'(T) - \frac{T - T_a}{R_{\text{th}}} \quad\Longrightarrow\quad T_\infty \approx T_a + I^2 R'\,R_{\text{th}} \]</div>
<p>La temperatura de régimen crece con el cuadrado de la corriente: duplicar la corriente cuadruplica el aumento de temperatura. Por eso una sobrecarga del 45 % ya es grave para el aislamiento.</p>
<div class="sim" data-sim="calentamiento" data-title="Calentamiento de un conductor en tubo"></div>
<div class="sim-guide"><ul>
<li>Con 12 AWG y 20 A el conductor se estabiliza por debajo de 60 °C. Suba a 30 A: pasa de 75 °C y se acerca a los 90 °C del THHN.</li>
<li>Aunque el aislamiento aguante 90 °C, los bornes de la toma y del interruptor están calificados a 60 °C o 75 °C: esa es la temperatura que limita (RETIE 3.17.13 h y NTC 2050, 110.14(C)).</li>
<li>Baje la temperatura ambiente a 19 °C, la media de Popayán: la capacidad mejora. En la memoria, sin embargo, conviene usar 30 °C, la base de la tabla, y declarar el supuesto.</li>
</ul></div>

<section>
<h2>Caída de tensión</h2>
<p>El conductor de ida y el de regreso tienen resistencia: parte de la tensión se queda en el camino y el aparato recibe menos. En un circuito de dos hilos con carga resistiva:</p>
<div class="eq key" data-name="Caída de tensión">\[ \Delta V = 2\,I\,R'\,L, \qquad \%\Delta V = 100\,\frac{\Delta V}{V} \]</div>
<div class="box norma"><p>Se debe asegurar que la regulación (caída de tensión) en la acometida no supere el 3 % calculada en el dispositivo de corte, y que la caída de tensión en alimentadores y circuitos ramales a carga plena de diseño no sea mayor al 5 % (Libro 3, Título 26, literal f).</p></div>
<div class="sim" data-sim="caida-tension" data-title="Caída de tensión en un circuito ramal"></div>
<div class="sim-guide"><ul>
<li>El circuito de la ducha de la casa ejemplo mide unos 3,2 m contando las bajantes: con 10 AWG y 29 A la caída es menor al 1 %.</li>
<li>Lleve la longitud a 30 m con 12 AWG y 20 A: la caída pasa del 3 %. Subir a 10 AWG la reduce casi a la mitad.</li>
<li>La longitud máxima para un 3 % es una buena regla para decidir dónde poner el tablero: cuanto más central, más cortos los circuitos.</li>
</ul></div>
</section>

<section>
<h2>Lo que exige el RETIE a los conductores</h2>
<div class="box norma"><ul>
<li>En interiores, los conductores aislados deben ser <b>retardantes a la llama y no propagadores del fuego</b> (3.17.13 a).</li>
<li>Los empalmes solo se permiten en partes accesibles, como cajas de empalme, conexión o inspección, con métodos que mantengan la continuidad y el aislamiento (3.17.13 d).</li>
<li>No se debe superar el número de conductores del Capítulo 9, Tabla 1, de la NTC 2050 en tubos y tuberías (3.17.13 e).</li>
<li>Los conductores de calibre 8 AWG o mayor deben ser <b>cables</b>; no se acepta alambre de esos calibres (3.17.13 g).</li>
<li>La capacidad de corriente se coordina para no superar la temperatura nominal más baja de cualquier elemento del circuito, como terminales y dispositivos (3.17.13 h).</li>
<li>No se acepta el uso de cables o alambres de <b>aluminio en circuitos ramales</b> de unidades residenciales (3.17.13 l).</li>
</ul></div>
<div class="box err"><ul>
<li>Escoger el calibre por la columna de 90 °C porque el cable dice THHN/THWN-2: los bornes de 60 °C mandan.</li>
<li>Proteger un 12 AWG con un interruptor de 30 A «para que no dispare»: el interruptor deja de proteger el conductor.</li>
<li>Calcular la caída de tensión con la longitud en planta y olvidar las bajantes desde la losa: en una casa pueden ser 2 m por punto.</li>
</ul></div>
</section>

<section>
<h2>Resumen</h2>
<div class="box keys"><ul>
<li>14, 12 y 10 AWG para alumbrado, tomas y cargas especiales; 6 AWG para la acometida de una casa típica.</li>
<li>La capacidad de corriente depende de la temperatura que soportan el aislamiento y los bornes; en vivienda manda la columna de 60 °C.</li>
<li>\(\Delta V = 2IR'L\); acometida ≤ 3 %, alimentadores más ramales ≤ 5 % (Título 26 f).</li>
<li>Cables desde 8 AWG, retardantes a la llama, sin aluminio en ramales residenciales, empalmes solo en cajas.</li>
</ul></div>
</section>
