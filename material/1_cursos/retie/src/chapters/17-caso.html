<p class="lead">La segunda semana define el caso sobre el que trabajará el equipo. Todo lo que viene después (modelo 3D, plantas eléctricas, cálculos y memoria) depende de que el plano base esté completo, acotado y a escala. Una medida mal tomada aquí se arrastra hasta la sustentación.</p>

<section>
<h2>Qué vivienda escoger</h2>
<p>La guía del proyecto propone una vivienda de un piso de 60 a 120 m², con cuatro a seis ambientes, para que todos los equipos tengan una dificultad comparable. La vivienda puede ser la casa de un integrante, un proyecto de vivienda publicado o un plano que el docente entregue. Lo importante es que el equipo pueda verificar las medidas.</p>
<ul>
<li><b>Un piso.</b> Evita escaleras, alimentadores entre niveles y tableros de distribución secundarios, que no aportan al objetivo del curso.</li>
<li><b>Cuatro a seis ambientes</b> con usos distintos: al menos una zona social, una cocina, un baño, una zona de ropas y alcobas. La variedad de usos es la que obliga a aplicar reglas distintas: zonas húmedas, mesones, circuitos exclusivos.</li>
<li><b>Estructura conocida.</b> Hace falta saber dónde están los ejes, las columnas y las vigas, y de qué es la cubierta o la losa. Sin eso no hay coordinación posible.</li>
<li><b>Medidas verificables.</b> Si el plano viene de una fotografía o de un PDF escaneado, hay que tener al menos dos cotas confiables para fijar la escala y comprobarla.</li>
</ul>
<div class="box note"><p>Si el equipo solo consigue el plano estructural, debe completar la distribución arquitectónica (muros, puertas, ventanas y usos) y validarla con el docente antes de seguir. Si solo tiene el arquitectónico, debe proponer una estructura razonable de pórticos o de mampostería confinada y también validarla.</p></div>
</section>

<section>

<p>El entregable A01 reúne estos planos con su origen (de dónde salió el plano, quién lo midió, qué se supuso) y las dimensiones y usos de cada ambiente.</p>
</section>

<h2>La casa ejemplo</h2>
<p>A lo largo de la parte IV se resuelve el proyecto completo sobre una casa de un piso en Popayán. Mide 8,00 m por 10,00 m entre ejes (8,15 m por 10,15 m por fuera de los muros, 82,7 m²) y tiene seis ambientes y un hall: sala-comedor, cocina, patio de ropas, baño y dos alcobas. La estructura es de pórticos de concreto reforzado: nueve columnas de 0,30 m × 0,30 m en los cruces de los ejes A, B, C y 1, 2, 3; vigas descolgadas de 0,30 m × 0,35 m en todos los ejes; losa maciza de 0,12 m y vigas de cimentación de 0,30 m × 0,30 m. Los muros son de mampostería de 0,15 m terminada.</p>

<section>
<h2>Llevar una imagen a escala real</h2>
<p>Muchos planos llegan como fotografía o PDF escaneado. Antes de dibujar encima hay que escalar la imagen: se mide en la imagen una cota conocida, se escribe su valor real y el programa calcula el factor. LibreCAD y SketchUp lo hacen con herramientas distintas (capítulos 28 y 29), pero el principio es el mismo. La regla de oro es <b>comprobar una segunda medida</b>: si no coincide, la imagen está deformada (fotografía inclinada, escáner que estira) o se hizo clic en el punto equivocado.</p>
<div class="eq">\[ k = \frac{L_{\text{real}}}{L_{\text{imagen}}}, \qquad L'_{\text{calculada}} = k\,L'_{\text{imagen}}, \qquad \varepsilon = \frac{L'_{\text{calculada}} - L'_{\text{cota}}}{L'_{\text{cota}}} \]</div>
<div class="sim" data-sim="escala-imagen" data-title="Calibrar la escala de un plano escaneado"></div>
<div class="sim-guide"><ul>
<li>Arrastre los marcadores <b>A</b> y <b>B</b> a los extremos de la cota horizontal de 8,00 m y escriba ese valor como longitud real. Luego lleve <b>C</b> y <b>D</b> a los extremos de la cota vertical de 10,00 m.</li>
<li>Con el <b>ajuste a extremos</b> activado, los marcadores saltan a los extremos de las cotas, como lo hacen los modos de referencia de LibreCAD y SketchUp. Desactívelo y repita: un error de pocos píxeles en una cota corta produce errores grandes.</li>
<li>Active la <b>deformación del escáner</b> (la imagen se estira 3 % en vertical). La calibración horizontal queda perfecta y la comprobación vertical falla: por eso se comprueba en la otra dirección.</li>
<li>Calibre con una cota corta (la de 1,20 m del hall, por ejemplo) y compare el error con el que obtiene usando la cota de 8,00 m.</li>
</ul></div>
<div class="box err"><ul>
<li>Escalar con una puerta «de 0,90 m» que en realidad mide 0,80 m. Use cotas escritas en el plano o medidas tomadas con cinta.</li>
<li>Calibrar sin comprobar. Un error del 2 % en una casa de 10 m son 20 cm: cambia la distancia de una toma a un lavamanos y la decisión sobre el GFCI.</li>
<li>Fotografiar el plano en ángulo. La perspectiva deforma distinto cada zona; si no hay escáner, fotografíe de frente y verifique tres cotas.</li>
</ul></div>
</section>

<section>
<h2>Leer la estructura con ojos eléctricos</h2>
<p>Para el diseño eléctrico, el plano estructural responde tres preguntas: por dónde puede ir una tubería, qué elementos no se pueden perforar y qué altura libre queda bajo las vigas.</p>
<ul>
<li><b>Losa maciza de 0,12 m.</b> Admite tubos embebidos de diámetro exterior hasta un tercio de su espesor (40 mm), con separación de al menos tres diámetros (NSR-10, Título C, sección C.6.3, que reproduce el criterio del ACI 318). Un tubo de 1/2 in tiene 21,3 mm de diámetro exterior.</li>
<li><b>Vigas descolgadas de 0,35 m.</b> Su fondo queda a 2,27 m del piso; los muros que están debajo terminan ahí. Las puertas de 2,10 m caben; un aplique sobre una puerta, no siempre.</li>
<li><b>Columnas.</b> No se ranuran ni se perforan. Una caja de toma pegada a una columna obliga a picar concreto estructural.</li>
<li><b>Vigas de cimentación.</b> Las tuberías del contrapiso pasan por encima, dentro del espesor del contrapiso, sin cortar acero.</li>
</ul>
<div class="box norma"><p>El RETIE pide coordinar las canalizaciones con la estructura en dos puntos concretos: en las juntas de dilatación se instala canalización flexible conforme al Reglamento Colombiano de Construcción Sismo Resistente (Libro 3, 3.17.6.1 c), y en las tuberías embebidas en concreto se deben colocar tapones en los extremos antes del vaciado para que no se taponen (3.17.6.6 g).</p></div>
</section>

<section>
<h2>Resumen</h2>
<div class="box keys"><ul>
<li>Un caso adecuado tiene un piso, 60 a 120 m², cuatro a seis ambientes de usos distintos y una estructura conocida.</li>
<li>El plano base necesita espesores de muro, sentido de giro de puertas, mobiliario fijo, ejes, columnas, vigas y alturas.</li>
<li>Toda imagen se escala con una cota conocida y se comprueba con otra en la dirección perpendicular.</li>
<li>Desde esta etapa conviene marcar qué muros están bajo vigas y dónde no se puede perforar: ahí aparecerán los conflictos.</li>
</ul></div>
