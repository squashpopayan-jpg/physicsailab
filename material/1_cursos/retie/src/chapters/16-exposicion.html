<p class="lead">En la primera semana cada equipo expone un tema del RETIE durante 8 a 10 minutos: explica el requisito con sus propias palabras, localiza el numeral y muestra un ejemplo en un plano. Al final entrega una ficha de una página que los demás equipos usarán durante todo el proyecto. Si hay pocos equipos, se combinan temas.</p>

<section>
<h2>Cómo preparar el tema</h2>
<ol>
<li><b>Lean el artículo completo</b> en el PDF oficial del libro, no en un resumen. Anoten la versión.</li>
<li><b>Marquen las remisiones</b>: cuando el RETIE dice «sección 210.8 de la NTC 2050», hay que ir a esa sección y comprobar su aplicabilidad (Libro 3, 3.28.1 lo hace muchas veces).</li>
<li><b>Escojan tres requisitos</b> que una vivienda de un piso realmente encuentre. No los más llamativos, los más útiles para el proyecto.</li>
<li><b>Busquen un ejemplo en un plano</b>: la casa ejemplo de esta guía sirve, pero es mejor uno del caso del equipo.</li>
<li><b>Identifiquen un error frecuente</b> que se vea en obra o en planos de estudiantes.</li>
<li><b>Ensayen con reloj</b>: 2 minutos de contexto, 5 de requisitos con su ejemplo, 2 de error frecuente y cierre.</li>
</ol>
<div class="box explain"><p>Una buena explicación del Título 12 no empieza con «el sistema de puesta a tierra es el conjunto de elementos conductores…». Empieza con la lavadora del patio de ropas: qué pasa si su carcasa queda a 120 V y quién toca primero. Después viene el numeral.</p></div>
</section>

<section>
<h2>Errores frecuentes por tema</h2>
<div class="tablewrap"><table>
<thead><tr><th>Tema</th><th>Error frecuente que vale la pena mostrar</th></tr></thead>
<tbody>
<tr><td>Alcance y riesgos</td><td>Creer que las instalaciones de muy baja tensión o las de telecomunicaciones de la casa están cubiertas igual; confundir contacto directo e indirecto</td></tr>
<tr><td>Diseño y responsabilidades</td><td>Suponer que el plano del estudiante o del maestro de obra reemplaza el esquema constructivo firmado por una persona competente</td></tr>
<tr><td>Productos</td><td>Guardar la factura y no el certificado; comprar interruptores usados</td></tr>
<tr><td>Conductores e identificación</td><td>Fase en blanco, tierra sin marcar, escoger el calibre por la columna de 90 °C</td></tr>
<tr><td>Cajas y canalizaciones</td><td>Tubo liviano a la vista, más de 360° de curvas sin caja de paso, tubos sin tapones al vaciar la losa</td></tr>
<tr><td>Tableros y protecciones</td><td>Tablero dentro del baño o tapado por un mueble; subir el interruptor «porque se dispara»</td></tr>
<tr><td>Puesta a tierra</td><td>Unir neutro y tierra en cada toma; varilla de 1,5 m; caja de inspección cubierta por el piso</td></tr>
<tr><td>Uso final y conformidad</td><td>Citar 3.28.1 sin ir a la sección 210.8; olvidar el circuito exclusivo de la ducha sobre 1 500 m</td></tr>
</tbody></table></div>
</section>

<section>
<h2>La ficha de exposición</h2>
<p>La ficha tiene una página: tema, numerales, tres requisitos relevantes, un ejemplo aplicado y un error frecuente. El generador arma la ficha con un formato uniforme; cargue el ejemplo de puesta a tierra para ver cómo queda una completa.</p>
