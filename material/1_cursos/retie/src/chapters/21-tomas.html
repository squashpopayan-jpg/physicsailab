<p class="lead">La planta E02 reúne los tomacorrientes, las cargas particulares, el circuito de cada punto y el tablero. Es la lámina donde más se nota la aplicación del RETIE: cada GFCI, cada salida especial y cada toma del mesón responde a un literal o a una sección de la NTC 2050 que debe poder citarse.</p>

<section>
<h2>Cómo se agrupan las tomas</h2>
<div class="tablewrap"><table>

<tr><td>C3</td><td>Tomas de las dos alcobas y toma exterior posterior (GFCI)</td><td>1P 20 A, 12 AWG</td><td>Zona privada; cargas pequeñas</td></tr>

<div class="box note"><p>Un GFCI de tomacorriente protege también a las tomas conectadas a sus bornes de carga (LOAD). Así, un solo GFCI al principio de un circuito protege todo lo que sigue. En la cocina conviene revisar con el usuario si la nevera debe ir aguas abajo de un GFCI: un disparo en la noche apaga la nevera. La NFPA 70 de 2017 lo exige porque la toma está a menos de 1,8 m del lavaplatos; una alternativa es reubicar la toma de la nevera a más de 1,8 m del lavaplatos.</p></div>
</section>
