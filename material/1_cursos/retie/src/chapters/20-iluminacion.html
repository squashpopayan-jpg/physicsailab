<template class="chapter-src" data-id="iluminacion" data-num="20" data-title="Planta de iluminación (E01)" data-part="Parte IV · El proyecto paso a paso" data-short="Etapa 4: cuántas luminarias por el método de los lúmenes, dónde van los interruptores, el circuito conmutable, requisitos de portalámparas y encendido, y la planta E01 de la casa ejemplo">
<p class="lead">La planta E01 muestra cada punto de iluminación, el interruptor que lo controla, la relación entre ambos y el circuito al que pertenecen. En una vivienda el número de luminarias es un criterio de diseño, pero se puede justificar con un cálculo sencillo, y la ubicación de los interruptores sí tiene reglas.</p>

<section>
<h2>Cuántas luminarias: el método de los lúmenes</h2>
<p>El método reparte el flujo luminoso necesario sobre el área del ambiente. El factor de utilización \(CU\) depende de la forma del local (índice \(K\)) y de las reflectancias; el factor de mantenimiento \(FM\) descuenta el envejecimiento y el polvo.</p>
<div class="eq key" data-name="Método de los lúmenes">\[ N = \frac{E\,A}{\Phi\,CU\,FM}, \qquad K = \frac{L\,W}{h\,(L+W)} \]</div>
<p>donde \(E\) es la iluminancia buscada (lx), \(A\) el área (m²), \(\Phi\) el flujo de cada luminaria (lm) y \(h\) la altura de la luminaria sobre el plano de trabajo.</p>
<div class="sim" data-sim="metodo-lumenes" data-title="Luminarias de un ambiente y su mapa de iluminancia"></div>
<div class="sim-guide"><ul>
<li>La sala-comedor de 4,65 m × 5,45 m con luminarias de 2 400 lm y 150 lx necesita tres luminarias; con dos, el promedio baja a unos 100 lx. Con luminarias de 1 500 lm harían falta cinco.</li>
<li>El mapa muestra la iluminancia punto a punto a 0,75 m del piso. La uniformidad \(U_o = E_{\min}/E_{\text{medio}}\) cae si las luminarias quedan muy separadas.</li>
<li>Los valores de \(CU\) son orientativos para luminarias LED de techo; con la ficha fotométrica real se obtiene el valor del fabricante, o se hace el cálculo en DIALux evo (capítulo 32).</li>
</ul></div>
<div class="box crit"><p>Recuerde que en vivienda el nivel de iluminación es criterio de diseño (el RETILAP exceptúa las áreas privadas residenciales). La memoria debe decir qué nivel se buscó, con qué luminaria y cuántas resultaron, y presentarlo como decisión propia en la matriz normativa.</p></div>
</section>

<section>
<h2>Dónde van los interruptores</h2>
<ul>
<li>Junto a la puerta, del lado de la chapa (no detrás de la hoja abierta), a 1,20 m del piso, dentro del recinto que controlan.</li>
<li>En recintos con dos accesos o en pasillos, un par de conmutables, uno en cada extremo, como en el hall de la casa ejemplo.</li>
<li>Fuera de los espacios de bañeras o duchas; en el lavamanos, no a menos de 80 cm de la puerta de la ducha (3.28.1 j).</li>
<li>Siempre en la fase, nunca en el neutro (3.17.20 a y b); la caja metálica, a tierra (3.17.20 d); con tapa (3.17.20 e).</li>
</ul>
<div class="box norma"><p>Todo sistema de iluminación debe contar con dispositivos para encender y apagar las lámparas, sectorizando los espacios y en lo posible individualizándolas (3.14.2 b). En los portalámparas conectados entre fase y neutro, la fase va al terminal central y el neutro a la parte roscada (3.14.2 a).</p></div>
</section>

<section>
<h2>El circuito conmutable</h2>
<p>Dos interruptores de dos vías controlan una lámpara desde dos lugares. La fase llega al común del primero; dos conductores «viajeros» unen los dos interruptores; el común del segundo es el retorno a la lámpara. La lámpara se enciende cuando los dos interruptores apuntan al mismo viajero.</p>
<div class="sim" data-sim="conmutable" data-title="Encender el hall desde dos lugares"></div>
<div class="sim-guide"><ul>
<li>Accione cada interruptor: cualquiera de los dos cambia el estado de la lámpara.</li>
<li>Escoja el <b>alambrado incorrecto</b>, con los conmutables en el neutro: la lámpara apaga y prende igual, pero el portalámpara queda energizado con la lámpara apagada. Es la razón de 3.17.20 b y de 3.14.2 a.</li>
<li>Note en el plano E03 que el tramo entre los dos conmutables lleva los dos viajeros y la tierra (capítulo 22).</li>
</ul></div>
</section>

<section>
<h2>Resumen</h2>
<div class="box keys"><ul>
<li>\(N = EA/(\Phi\,CU\,FM)\) justifica el número de luminarias; el nivel es criterio de diseño en vivienda.</li>
<li>Interruptores junto a la chapa, a 1,20 m, en la fase, fuera de la ducha; conmutables en recintos con dos accesos.</li>
<li>En los portalámparas, la fase va al terminal central.</li>
<li>E01 muestra puntos, control, circuito y alturas, con su cuadro de convenciones.</li>
</ul></div>
</section>
