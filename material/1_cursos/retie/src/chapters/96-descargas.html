<section>
<h2>Cómo se generan</h2>
<p>El DXF es de la versión R12 (la más compatible), en milímetros y con el origen en el cruce de los ejes A y 1; los textos usan la página de códigos ANSI 1252, que conserva tildes y eñes. Se generan en el navegador desde el modelo de la casa (<code>lib/20-casa.js</code>) con <code>core/87-dxf.js</code>; la plantilla XLSX se genera con <code>tools/xlsx.py</code> desde <code>lib/60-hoja.js</code>, y sus fórmulas se verificaron con un motor de cálculo independiente. El apéndice D comprueba los archivos junto con los cálculos.</p>
