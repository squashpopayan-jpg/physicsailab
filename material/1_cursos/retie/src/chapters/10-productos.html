<p class="lead">Una instalación bien diseñada con productos sin certificado no cumple el RETIE. El Libro 2 lista los productos que deben demostrar su conformidad antes de usarse, y el Libro 4 dice quién lo certifica. En obra, el constructor compara la referencia de cada producto con su certificado y guarda la prueba: es una tarea típica de la residencia de obra.</p>

<section>
<h2>El certificado de conformidad</h2>
<p>El certificado de producto o la declaración de conformidad del proveedor la expide, entre otras alternativas, un organismo de certificación acreditado por el ONAC para ese tipo de producto y ese reglamento (Libro 4, 4.2.1). Los organismos de certificación de productos se acreditan bajo la norma ISO/IEC 17065 y los de inspección de instalaciones bajo la ISO/IEC 17020 (4.1.2).</p>
<div class="box norma"><ul>
<li>El constructor debe usar productos que cumplan la reglamentación y cuenten con certificado (Libro 3, 3.2.2 b) y dejar evidencia verificable de los productos usados en cada fase: certificados con marca, referencia, número y vigencia, y fotografías o videos donde se vea que el producto instalado corresponde al certificado (3.2.2, parágrafo 3).</li>
<li>En la inspección se verifica que cada producto tenga su certificado y que la referencia instalada corresponda a la certificada; si se detectan inconformidades, aunque el producto esté certificado, se rechaza y se informa a la SIC (Libro 4, 4.3.1 n).</li>
<li>Se prohíbe el uso de materiales o artefactos reutilizados o remanufacturados en instalaciones de uso final, en especial interruptores automáticos, relés diferenciales e interruptores de falla a tierra, salvo que demuestren el cumplimiento con ensayos tipo (Libro 3, 3.1.2.2).</li>
</ul></div>
</section>

<section>
<h2>Cómo documentar la evidencia en obra</h2>
<ol>
<li>Antes de comprar, pida al proveedor el certificado de cada referencia y verifique su vigencia.</li>
<li>Al recibir, compare la marca y la referencia del producto con el certificado; guarde una foto de la etiqueta.</li>
<li>Durante la instalación, fotografíe los productos instalados antes de que queden ocultos (tubos en losa antes del vaciado, cajas antes del pañete, electrodo antes de cerrar la caja de inspección).</li>
<li>Organice la carpeta por producto, con el certificado, las fotos y la fecha. Esa carpeta se anexa a la declaración de cumplimiento del constructor.</li>
</ol>
<div class="box err"><ul>
<li>Comprar el breaker «usado pero bueno» de una obra anterior: es un producto reutilizado (3.1.2.2).</li>
<li>Guardar la factura y no el certificado: la factura no demuestra conformidad.</li>
<li>Fotografiar después del pañete: la tubería embebida ya no se ve y la evidencia se pierde.</li>
</ul></div>
</section>

<section>
<h2>Resumen</h2>
<div class="box keys"><ul>
<li>Conductores, cajas, tomas, interruptores, tubos, tableros, electrodos, duchas y DPS son productos objeto del RETIE.</li>
<li>El certificado lo expide un organismo acreditado por el ONAC (u otra alternativa del artículo 4.2.1).</li>
<li>El constructor guarda certificados y fotos de lo instalado (3.2.2, parágrafo 3); el inspector compara referencias (4.3.1 n).</li>
<li>Nada reutilizado en uso final, en especial interruptores y diferenciales (3.1.2.2).</li>
</ul></div>
</section>
