<p class="lead">Este taller lleva al equipo desde una imagen de la planta hasta el entregable M3D en SketchUp Free, el plan gratuito que funciona en el navegador. Cada paso dice qué herramienta usar, qué escribir en el cuadro de medidas y cómo comprobar que quedó bien antes de seguir. El avance se guarda en este navegador.</p>

<section>
<h2>Antes de empezar</h2>
<ul>
<li><b>Cuenta.</b> SketchUp Free se abre en <a href="https://app.sketchup.com">app.sketchup.com</a> con una cuenta Trimble gratuita. Los modelos se guardan en Trimble Connect (10 GB en el plan gratuito).</li>
<li><b>Equipo.</b> Un navegador actualizado (Chrome o Edge) y, casi indispensable, un ratón con rueda: la rueda acerca y aleja; presionada, orbita.</li>
<li><b>Archivo de partida.</b> La planta base en PNG a escala conocida. El kit de la guía trae la de la casa ejemplo a 80 px por metro (apéndice B); para el caso propio, expórtela desde LibreCAD (capítulo 29, paso 14).</li>
</ul>
<div class="tablewrap narrow"><table>
<thead><tr><th>En el plan gratuito</th><th>Sí</th><th>No</th></tr></thead>
<tbody>
<tr><td>Importar</td><td>SKP, PNG, JPG</td><td>DWG, DXF (solo con suscripción)</td></tr>
<tr><td>Exportar</td><td>PDF, STL y PNG (con marca de agua)</td><td>DWG, DXF, OBJ y otros</td></tr>
<tr><td>Organizar</td><td>Etiquetas, componentes, grupos, escenas, planos de sección</td><td>Panel Esquema (<em>Outliner</em>)</td></tr>
</tbody></table></div>
<div class="box note"><p>Condiciones consultadas en octubre de 2026 en la ayuda oficial de SketchUp. Los planes cambian: verifíquelas al iniciar el semestre. Si la interfaz no muestra una herramienta donde dice el paso, use la búsqueda de comandos (la lupa de la barra izquierda) y escriba su nombre.</p></div>
</section>

<section>
<h2>Atajos que se usan todo el tiempo</h2>
<p>Las letras son los atajos predeterminados de SketchUp y no cambian con el idioma de la interfaz. La regla de oro: haga clic para empezar, mueva el ratón en la dirección deseada, <b>escriba la medida</b> y pulse <kbd>Enter</kbd>. El valor aparece en el cuadro de medidas, abajo a la derecha.</p>

<tbody>

<section>
<h2>La lista de puntos para comprobar el modelo</h2>
<p>Esta tabla trae todos los puntos de la casa ejemplo con su código, el componente que se usa, la etiqueta, el muro y la altura. Sirve para ubicar los componentes sin abrir el plano y, al final, para contarlos. En el caso propio, la misma tabla sale del inventario de puntos (capítulo 19).</p>
<div class="sim" data-sim="lista-sketchup" data-title="Puntos eléctricos para el modelo 3D"></div>
<div class="sim-guide"><ul>
<li>Filtre por tipo para ubicar primero todas las tomas, luego los interruptores y así sucesivamente.</li>
<li>Las coordenadas son las del modelo: origen en el cruce de los ejes A y 1, x hacia el oriente (eje rojo de SketchUp), y hacia el norte (eje verde), z hacia arriba (eje azul).</li>
<li>Descargue el CSV para marcar en la hoja de cálculo los puntos ya ubicados.</li>
</ul></div>

<section>
<h2>Problemas típicos</h2>
<div class="tablewrap"><table>
<thead><tr><th>Síntoma</th><th>Causa</th><th>Solución</th></tr></thead>
<tbody>
<tr><td>El piso parpadea con la imagen</td><td>Dos caras en el mismo plano</td><td>Mueva el grupo de la imagen 1 mm hacia abajo (<kbd>M</kbd>, flecha abajo, <code>0,001</code>)</td></tr>
<tr><td>Al mover un muro se deforma otro</td><td>La geometría está suelta y pegada</td><td>Haga grupos: muros, estructura y cada tubería por separado</td></tr>
<tr><td>Caras de color gris azulado</td><td>Caras invertidas (se ve el reverso)</td><td>Clic derecho sobre la cara ▸ <b>Invertir caras</b></td></tr>
<tr><td>Empujar/Tirar no abre el vano</td><td>La profundidad no alcanzó el espesor o el rectángulo no está sobre la cara</td><td>Empuje 0,15 m o hasta la cara opuesta; dibuje el rectángulo sobre la cara (se pinta azul)</td></tr>
<tr><td>Todo el modelo cambió de tamaño</td><td>Se escaló con la cinta métrica después de modelar</td><td>Deshaga (<kbd>Ctrl</kbd>+<kbd>Z</kbd>) y escale solo la imagen, o entre al grupo antes de medir</td></tr>
<tr><td>El tubo de Sígueme sale torcido</td><td>El círculo no es perpendicular a la ruta</td><td>Dibuje el círculo con su eje en la dirección del primer tramo (flechas de dirección mientras dibuja)</td></tr>
<tr><td>El navegador se pone lento</td><td>Imagen muy grande o demasiados círculos de muchos lados</td><td>Use PNG de menos de 2 000 px de lado; tubos con 12 lados</td></tr>
</tbody></table></div>
</section>

<section>
<h2>Resumen</h2>
<div class="box keys"><ul>
<li>Plantilla en metros, imagen escalada con la cinta métrica antes de dibujar y comprobada con una segunda cota.</li>
<li>Geometría siempre en grupos o componentes; la etiqueta se asigna al grupo, no a las caras.</li>
<li>Un componente por tipo de punto, cada instancia con el código del plano.</li>
<li>Una tubería modelada con Sígueme que cruce o bordee la estructura.</li>
<li>Tres escenas guardadas: general, puntos eléctricos y coordinación; PNG o PDF de cada una para la memoria.</li>
</ul></div>
</section>
