<p class="lead">El RETIE existe para proteger a las personas, a los animales y a los bienes. Antes de entrar en los artículos conviene entender qué hace la corriente en el cuerpo, porque de ahí salen casi todas las exigencias de la casa: la puesta a tierra, los diferenciales en zonas húmedas, la altura de los interruptores y la prohibición de empalmes con cinta en una ducha.</p>

<section>
<h2>Qué decide la gravedad de un accidente</h2>
<p>El Libro 1 (1.5.1.2) resume la electropatología: el resultado de una descarga depende de la intensidad de la corriente, la resistencia del cuerpo, la trayectoria, la duración del contacto, la tensión aplicada y la frecuencia. Los accidentes se producen por contactos directos (con una parte energizada), contactos indirectos (con una masa que quedó energizada por una falla), tensiones de paso y de contacto, arcos, incendios, sobrecorrientes y sobretensiones.</p>
<div class="box norma"><p>El reglamento señala tres umbrales muy bajos: percepción de unos <b>1,1 mA</b>, reacción a soltarse de <b>10 mA</b> y rigidez muscular o fibrilación desde unos <b>25 mA</b>. Para los cálculos, la resistencia del cuerpo se normaliza en <b>1 000 Ω</b> (Libro 1, 1.5.1.2 e y r).</p></div>
<p>Con 1 000 Ω, una tensión de 120 V haría circular 120 mA: cinco veces el umbral de fibrilación. La única defensa es que la corriente no llegue al cuerpo o que se corte en milésimas de segundo.</p>
</section>

<section>
<h2>Las zonas tiempo-corriente</h2>
<p>La Figura 1.5.1.2.a del Libro 1, adaptada de la norma NTC-IEC 60479-1, divide el plano corriente-tiempo en seis zonas para corriente alterna de 15 a 100 Hz. La curva C1 marca el límite a partir del cual aparece riesgo de fibrilación y es la que se toma para diseñar los equipos de protección (1.5.1.2 k).</p>
<div class="sim" data-sim="zonas-cuerpo" data-title="¿En qué zona queda un contacto?"></div>
<div class="sim-guide"><ul>
<li>Con 120 V, piel mojada y sin protección, un contacto de 1 s cae en la zona 4 o 5: riesgo de fibrilación.</li>
<li>Agregue un <b>interruptor termomagnético</b>: nada cambia. Para él, 100 mA son cero; está hecho para proteger los conductores, no a las personas.</li>
<li>Agregue un <b>GFCI</b> (dispara a 4–6 mA) o un diferencial de <b>30 mA</b>: el tiempo cae a unas decenas de milisegundos y el punto baja hacia las zonas 2 y 3.</li>
<li>Cambie la piel de seca a sumergida: la impedancia cae a la mitad o menos y la corriente sube en proporción. Por eso los baños, las cocinas y los patios de ropas exigen más cuidado.</li>
</ul></div>
<div class="tablewrap narrow"><table>
<thead><tr><th>Estado de la piel</th><th class="c">Tensión de seguridad asociada</th></tr></thead>
<tbody>
<tr><td>Perfectamente seca (excepcional)</td><td class="num c">80 V</td></tr>
<tr><td>Húmeda (normal) en ambiente seco</td><td class="num c">50 V</td></tr>
<tr><td>Mojada en ambientes muy húmedos</td><td class="num c">24 V</td></tr>
<tr><td>Sumergida en agua</td><td class="num c">12 V</td></tr>
</tbody></table></div>
<p>La tabla es del Libro 1 (1.5.1.2 s). La nota que la acompaña es explícita: en áreas mojadas como baños, mesones de cocina y terrazas se deben tomar mayores precauciones, como tomacorrientes o interruptores con protección de falla a tierra.</p>

</section>

<section>
<h2>El contacto indirecto: la carcasa que se energiza</h2>
<p>Una lavadora tiene la carcasa metálica aislada de las partes vivas. Si el aislamiento falla y la fase toca la carcasa, quien la toque queda entre 120 V y el piso. Lo que pasa después depende de dos cosas: si la carcasa tiene conductor de puesta a tierra hasta el tablero y si el circuito tiene protección diferencial.</p>
<div class="sim" data-sim="contacto-indirecto" data-title="Falla de aislamiento en la lavadora del patio de ropas"></div>
<div class="sim-guide"><ul>
<li><b>Con tierra y sin diferencial</b>: la falla es casi un cortocircuito fase-tierra; la corriente de falla supera la parte magnética del interruptor y lo dispara en milésimas de segundo. Mientras tanto, la carcasa queda a una fracción de los 120 V: la caída en el conductor de tierra, unos 30 V en este ejemplo.</li>
<li><b>Sin tierra y sin diferencial</b>: no hay corriente de falla; la carcasa queda a 120 V hasta que alguien la toque. La única corriente es la que pasa por la persona, y ningún termomagnético la ve.</li>
<li><b>Sin tierra, con GFCI</b>: la corriente por la persona es una fuga y el GFCI la corta rápido. El GFCI protege incluso sin tierra; la tierra y el diferencial se complementan.</li>
<li>Alargue el circuito: con 30 m de 12 AWG la corriente de falla baja y puede no alcanzar el disparo magnético. Es una de las razones para no hacer circuitos muy largos.</li>
</ul></div>
<div class="box norma"><p>El Libro 3 recoge estas medidas en el artículo 3.27.2: toda instalación debe tener sistema de puesta a tierra; las carcasas de los equipos deben tener conexión eléctrica a tierra; se deben usar protecciones diferenciales de alta sensibilidad (GFCI o RCD) en lugares húmedos y mojados, y los circuitos con interruptor diferencial deben operar con una curva de sensibilidad que supere la exigencia de la curva C1.</p></div>
</section>

<section>
<h2>Factores de riesgo más comunes</h2>
<div class="tablewrap"><table>
<thead><tr><th>Factor</th><th>Posibles causas</th><th>Medidas de protección</th></tr></thead>
<tbody>
<tr><td>Arcos eléctricos</td><td>Malos contactos, cortocircuitos, apertura de interruptores con carga, herramientas olvidadas en tableros</td><td>Envolventes resistentes al arco, distancia de seguridad, prendas y gafas adecuadas</td></tr>
<tr><td>Contacto directo</td><td>Negligencia o impericia, violación de distancias de seguridad</td><td>Distancias, obstáculos, aislamiento de partes activas, diferenciales, verificar ausencia de tensión</td></tr>
<tr><td>Contacto indirecto</td><td>Fallas de aislamiento, mal mantenimiento, falta de conductor de puesta a tierra</td><td>Puesta a tierra, conexiones equipotenciales, diferenciales, muy baja tensión, mantenimiento</td></tr>
<tr><td>Cortocircuito</td><td>Fallas de aislamiento, humedades, equipos defectuosos</td><td>Interruptores automáticos o fusibles</td></tr>
<tr><td>Sobrecarga</td><td>Superar la capacidad de conductores o equipos, conexiones flojas</td><td>Interruptores bien dimensionados, cálculo técnico de conductores</td></tr>
<tr><td>Tensión de contacto</td><td>Fallas a tierra o de aislamiento</td><td>Puestas a tierra de baja resistencia, equipotencializar</td></tr>
</tbody></table></div>
<p>Es un extracto de la Tabla 1.5.1.3.a del Libro 1, que también incluye rayos, electricidad estática, equipos defectuosos, campos electromagnéticos, tensión de paso y ausencia de electricidad.</p>
</section>

<section>
<h2>La matriz de análisis de riesgos</h2>
<p>El Libro 1 (1.5.1.4.1) propone una matriz para valorar un riesgo: se define el factor y su fuente, se estima la consecuencia en cuatro clases (personas, económicas, ambientales, imagen) y la frecuencia, y se toma el cruce más crítico. El nivel resultante fija la decisión. El análisis de riesgos de origen eléctrico es el primer ítem tanto del diseño detallado como del básico (Libro 3, 3.3.1.1 a y 3.3.1.2 a.1), y conviene que la memoria del proyecto incluya uno sencillo para la casa.</p>
<div class="sim" data-sim="matriz-riesgo" data-title="Matriz de análisis de riesgos del RETIE"></div>
<div class="sim-guide"><ul>
<li>Pruebe el caso de la ducha eléctrica sin protección diferencial: consecuencia en personas 5 (muerte), frecuencia D (ha ocurrido en el sector). El nivel es ALTO.</li>
<li>Con diferencial y conductor de tierra, la consecuencia probable baja a lesión menor: el nivel baja a BAJO o MEDIO. Así se documenta una medida de mitigación.</li>
</ul></div>
</section>

<section>
<h2>Resumen</h2>
<div class="box keys"><ul>
<li>Umbrales: 1,1 mA percepción, 10 mA no soltarse, 25 mA fibrilación; resistencia de cálculo del cuerpo, 1 000 Ω.</li>
<li>La curva C1 de la Figura 1.5.1.2.a es el límite para diseñar protecciones.</li>
<li>El termomagnético protege conductores; a las personas las protegen la puesta a tierra y los diferenciales.</li>
<li>En lugares húmedos y mojados se exige protección diferencial de alta sensibilidad (3.27.2 e).</li>
<li>La memoria debe incluir un análisis de riesgos con la matriz del Libro 1.</li>
</ul></div>
</section>
