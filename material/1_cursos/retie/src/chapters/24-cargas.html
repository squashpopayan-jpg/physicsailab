<p class="lead">El cuadro de cargas relaciona cada circuito con su ambiente o equipo, la cantidad de puntos y la potencia o carga aparente, con unidades consistentes. El esquema constructivo del RETIE lo exige, «señalando potencias y tensiones aplicadas en cada circuito» (3.3.2.1 g). Con él se calcula la demanda de la casa, y con la demanda, la acometida.</p>

<section>
<h2>El cuadro de cargas de la casa ejemplo</h2>
<div class="sim" data-sim="cuadro-cargas" data-title="Cuadro de cargas por circuito"></div>
<div class="sim-guide"><ul>
<li>Las tomas generales se cargan con 180 VA por salida; los circuitos de cocina y de ropas con 1 500 VA, y la ducha y la estufa con su potencia de placa.</li>
<li>La columna de carga respecto a la protección muestra qué tan exigido queda cada circuito: la ducha llega al 97 % porque su circuito es exclusivo y dimensionado para ella.</li>
<li>Descargue el cuadro en CSV o la plantilla en XLSX con las fórmulas para su propia casa.</li>
</ul></div>
<div class="box crit"><p>Los 180 VA por toma no son la demanda de la vivienda: en unidades de vivienda las tomas generales se incluyen en la carga de alumbrado general de 33 VA/m² (NTC 2050, 220.14(J)). En el cuadro sirven como criterio para repartir las salidas entre circuitos y para no sobrecargar ninguno. La memoria debe decirlo así.</p></div>
</section>

<section>
<h2>Carga instalada y demanda</h2>
<p>Si se suman todas las cargas de la casa se obtiene la carga instalada, pero nunca funcionan todas a la vez. La NTC 2050 (artículo 220, parte III), a la que remiten el literal b del 3.28.1 y el Título 26 para dimensionar la acometida, aplica factores de demanda:</p>
<ol>
<li>Alumbrado general y tomas: 33 VA/m² del área de la vivienda, medida por las caras exteriores (Tabla 220.12).</li>
<li>Más 1 500 VA por cada circuito de pequeños artefactos y 1 500 VA por el de lavandería (220.52).</li>
<li>Sobre ese subtotal: los primeros 3 000 VA al 100 % y el resto al 35 % (Tabla 220.42).</li>
<li>Estufa: una estufa de hasta 8,75 kW se toma al 80 % de su placa (Tabla 220.55, columna C y nota 3).</li>
<li>Artefactos fijos (ducha, calentador): al 100 % si son menos de cuatro, al 75 % si son cuatro o más (220.53).</li>
</ol>
<div class="eq">\[ S_d = 3\,000 + 0{,}35\,(S_{\text{alumbrado}} + S_{\text{pa}} + S_{\text{lav}} - 3\,000) + 0{,}8\,P_{\text{estufa}} + \sum P_{\text{fijos}}, \qquad I = \frac{S_d}{240\ \text{V}} \]</div>
<div class="sim" data-sim="demanda" data-title="Demanda de la vivienda y acometida"></div>
<div class="sim-guide"><ul>
<li>La casa ejemplo: 82,7 m², dos circuitos de cocina, uno de ropas, estufa de 6 kW y ducha de 3 500 W. La demanda es de 12,8 kVA (53 A a 240 V) frente a una carga instalada de 16,7 kVA.</li>
<li>Con 53 A, el calibre mínimo de cobre a 60 °C es 6 AWG (55 A), con totalizador de 60 A (240.4(B)). La capacidad instalable resulta de 13,2 kVA: esquema constructivo y declaración de cumplimiento (capítulo 9).</li>
<li>Agregue una secadora de ropa eléctrica de 5 kW: la demanda llega a 17,8 kVA (74 A) y la acometida debe subir a 3 AWG; la capacidad instalable pasa a 20,4 kVA, por encima de 15 kVA, y cambia el trámite.</li>
</ul></div>
<div class="box warn"><p>Una estimación de cargas, por sí sola, no valida la ampacidad ni la caída de tensión. Si se seleccionan conductores o protecciones, hay que justificarlos con cálculos y tablas aplicables (capítulo 25). La memoria debe distinguir lo calculado, lo supuesto y lo pendiente de revisión.</p></div>
</section>

<section>
<h2>Resumen</h2>
<div class="box keys"><ul>
<li>El cuadro de cargas da por circuito: descripción, ambiente, cantidad de puntos, VA, tensión, corriente, protección, calibre y fase.</li>
<li>La demanda de una vivienda se calcula con 33 VA/m², 1 500 VA por circuito de pequeños artefactos y de lavandería, factores 100 %/35 %, la estufa al 80 % y los fijos.</li>
<li>Casa ejemplo: 12,8 kVA de demanda, 53 A, acometida de 6 AWG, totalizador de 60 A, 13,2 kVA instalables.</li>
<li>La demanda no valida conductores ni caídas de tensión: eso se calcula aparte.</li>
</ul></div>
</section>
