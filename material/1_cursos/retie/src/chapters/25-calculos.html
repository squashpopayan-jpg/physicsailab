<template class="chapter-src" data-id="calculos" data-num="25" data-title="Un circuito representativo, calculado completo" data-part="Parte IV · El proyecto paso a paso" data-short="Etapa 5: los ocho pasos para justificar un circuito (carga, protección, conductor, correcciones, caída de tensión, tubo, tierra y diferencial), el cálculo de la acometida y cómo separar lo calculado, lo supuesto y lo pendiente">
<p class="lead">Antes del trabajo práctico, el docente fija qué cálculos se enseñaron y serán exigibles. En un curso introductorio basta con calcular por completo un circuito representativo y dejar explícitas las verificaciones pendientes del resto. Este capítulo muestra ese cálculo con la ducha de la casa ejemplo y con cualquiera de sus nueve circuitos.</p>

<section>
<h2>Los ocho pasos</h2>
<ol>
<li><b>Carga y corriente de diseño.</b> \(I_b = S/V\); al 125 % si la carga es continua.</li>
<li><b>Protección.</b> El interruptor normalizado con \(I_n \ge I_b\) (240.6(A)).</li>
<li><b>Conductor.</b> Capacidad a 60 °C (bornes de menos de 100 A) con \(I_n \le I_z\) y los topes de 240.4(D) (RETIE 3.17.13 h y k; 3.27.3 c).</li>
<li><b>Correcciones.</b> Por temperatura ambiente y por más de tres portadores en el mismo tubo.</li>
<li><b>Caída de tensión.</b> Con la longitud real, incluidas las bajantes, hasta el punto más lejano; ramal y acometida sumados ≤ 5 % (Título 26 f).</li>
<li><b>Tubo.</b> Llenado del tramo más cargado ≤ 40 % (Cap. 9, Tabla 1).</li>
<li><b>Conductor de tierra.</b> Según la protección, Tabla 250-122 (3.12.2.3 a).</li>
<li><b>Protección de las personas.</b> GFCI o diferencial donde lo exigen 3.28.1 g y 3.17.15 c.</li>
</ol>
<div class="sim" data-sim="circuito-rep" data-title="Cálculo completo de un circuito de la casa"></div>
<div class="sim-guide"><ul>
<li>El circuito de la ducha (C7) es el representativo natural: la carga más grande, un circuito exclusivo y la protección diferencial.</li>
<li>Cambie a C3 o C4 para ver que el procedimiento es el mismo. Copie el texto generado a la memoria y ajuste los supuestos a su caso.</li>
<li>Pruebe a cambiar el calibre del C7 a 12 AWG: falla el paso 3 aunque la caída de tensión siga siendo baja.</li>
</ul></div>
</section>

<section>
<h2>La acometida y el alimentador</h2>
<p>Con la demanda de 12,8 kVA (capítulo 24), la corriente a 240 V es de 53,3 A. El cobre de 6 AWG admite 55 A a 60 °C y se protege con el totalizador de 60 A, el valor normalizado siguiente (240.4(B)). Entre el medidor y el tablero hay unos 9,8 m contando las subidas y bajadas: la caída de tensión es del 0,70 %, por debajo del 3 % de la acometida. El conductor del electrodo de puesta a tierra es de 8 AWG de cobre (Tabla 250-66 para una acometida de 6 AWG).</p>
<div class="eq">\[ \Delta V = 2 \times 53{,}3\ \text{A} \times 1{,}61\ \tfrac{\Omega}{\text{km}} \times 9{,}8\ \text{m} \approx 1{,}7\ \text{V} \;\Rightarrow\; 0{,}70\ \% \text{ de } 240\ \text{V} \]</div>
</section>

<section>
<h2>Resumen</h2>
<div class="box keys"><ul>
<li>Un circuito representativo se justifica en ocho pasos, de la carga a la protección de las personas.</li>
<li>La caída de tensión se calcula con la longitud real, incluidas las bajantes, y se suma a la de la acometida.</li>
<li>La acometida de la casa: 53,3 A, 6 AWG, 60 A, 0,70 % de caída, electrodo con 8 AWG.</li>
<li>La memoria separa lo calculado, lo supuesto y lo pendiente.</li>
</ul></div>
