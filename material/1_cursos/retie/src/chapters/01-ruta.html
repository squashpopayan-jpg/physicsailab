<p class="lead">El proyecto tiene una sola pregunta de fondo: ¿pueden ustedes leer un requisito del RETIE, aplicarlo a una casa concreta y demostrar en los planos, el modelo y la memoria que lo aplicaron? Este capítulo organiza el trabajo: qué se hace cada semana, qué se entrega y cómo se evalúa.</p>

<section>
<h2>Objetivo y alcance</h2>
<p>El objetivo es interpretar requisitos de seguridad eléctrica y coordinar una propuesta de instalación con los espacios y elementos estructurales de una edificación pequeña. El trabajo produce tres cosas que se corresponden entre sí: un <b>modelo 3D</b> del espacio con los puntos eléctricos, las <b>plantas eléctricas</b> y una <b>memoria</b> que relaciona cada decisión con su fundamento normativo.</p>
<ul>
<li>Equipos de 3 o 4 integrantes; vivienda de un piso de 60 a 120 m².</li>
<li>Plano arquitectónico con cotas, usos, puertas y ventanas, y plano estructural.</li>
<li>Instalación con tablero, tomacorrientes, interruptores, puntos de iluminación, circuitos, recorridos de canalización y representación de la puesta a tierra.</li>
<li>Modelo 3D con el espacio, la ubicación de los puntos y un recorrido de canalización que muestre su relación con vigas y columnas.</li>
</ul>
<div class="box warn"><p>El trabajo es una propuesta académica de coordinación. El diseño, la construcción y la inspección de una instalación real deben ser dirigidos, supervisados y ejecutados por personas técnica y legalmente competentes, es decir, ingenieros electricistas, electromecánicos o de distribución y redes, tecnólogos y técnicos electricistas con matrícula, en el alcance que la ley les da (Libro 3, artículo 3.2.1). El dibujo de un estudiante no autoriza perforaciones ni modificaciones en la estructura.</p></div>
<div class="box explain"><p>¿Por qué lo estudia un ingeniero civil si no lo puede firmar? Porque como constructor o residente de obra será responsable de contratar a personas competentes, de usar productos certificados y de coordinar la obra civil con la instalación (Libro 3, artículo 3.2.2). Las regatas, los pases en vigas y la ubicación del tablero los decide la obra civil tanto como el diseño eléctrico.</p></div>
</section>

<section>
<h2>Seis semanas, una evidencia por semana</h2>
<p>La guía propone seis semanas, con una evidencia revisada por el docente al cerrar cada etapa. Si las exposiciones ya se hicieron, el proyecto arranca en la segunda.</p>

<section>
<h2>Los entregables y sus códigos</h2>
<p>La entrega final es una carpeta con los archivos editables y sus versiones en PDF, organizada con estos códigos. Una misma lámina puede reunir varias vistas si mantiene los códigos y se lee con claridad.</p>
<div class="entregables">
<div><b>A01</b><span>Planos base</span><small>Arquitectura y estructura, con origen del plano, dimensiones y usos.</small></div>
<div><b>M3D</b><span>Modelo 3D</span><small>Archivo SKP o RVT y tres vistas identificadas: general, puntos y coordinación.</small></div>
<div><b>E01</b><span>Planta de iluminación</span><small>Puntos de iluminación, interruptores, relación de control y circuitos.</small></div>
<div><b>E02</b><span>Planta de tomacorrientes</span><small>Tomas, cargas particulares, circuito de cada punto y tablero.</small></div>
<div><b>E03</b><span>Planta de canalizaciones</span><small>Recorridos, cajas, cambios de nivel y relación con la estructura.</small></div>
<div><b>E04</b><span>Diagrama y cuadro</span><small>Unifilar, cuadro de cargas y representación de la puesta a tierra.</small></div>
<div><b>MEM</b><span>Memoria del proyecto</span><small>Supuestos, criterios, matriz normativa y revisión de coordinación.</small></div>
</div>
<p>Los planos 2D se conservan en DXF o DWG, según el programa, o dentro del RVT si se usa Revit. La memoria tiene unas 4 a 6 páginas más planos y anexos.</p>
</section>

<section>
<h2>Cómo se evalúa</h2>
<div class="tablewrap narrow"><table>
<thead><tr><th>Criterio</th><th>Evidencia para valorar</th><th class="c">Puntos</th></tr></thead>
<tbody>
<tr><td>Exposición</td><td>Explicación comprensible, fuentes localizadas y ejemplo aplicado</td><td class="num c">15</td></tr>
<tr><td>Aplicación normativa</td><td>Decisiones justificadas y matriz trazable al plano y al caso</td><td class="num c">25</td></tr>
<tr><td>Planos eléctricos</td><td>Lectura clara, circuitos identificados y correspondencia entre láminas</td><td class="num c">20</td></tr>
<tr><td>Modelo 3D</td><td>Dimensiones coherentes y correspondencia con los planos</td><td class="num c">15</td></tr>
<tr><td>Memoria y coordinación</td><td>Datos consistentes, alcance de cálculos claro y conflictos resueltos</td><td class="num c">15</td></tr>
<tr><td>Sustentación</td><td>Participación del equipo y explicación individual del trabajo</td><td class="num c">10</td></tr>
<tr><td><b>Total</b></td><td></td><td class="num c"><b>100</b></td></tr>
</tbody></table></div>
<p>La distribución es una propuesta para el docente. Se valora la corrección técnica, la justificación y la coherencia entre archivos; la ruta de software escogida no cambia los criterios. Antes del trabajo práctico, el docente fija qué cálculos se enseñaron y serán exigibles: en un curso introductorio puede pedirse el cálculo completo de un circuito representativo (capítulo 25) y dejar explícitas las verificaciones pendientes del resto.</p>
</section>

<section>
<h2>Roles dentro del equipo</h2>
<p>Cada integrante debe poder abrir los archivos, mostrar una parte que elaboró y explicar una decisión respaldada por la norma. Repartir roles ayuda, siempre que todos conozcan el conjunto.</p>
<div class="tablewrap narrow"><table>
<thead><tr><th>Rol</th><th>Responde por</th><th>Revisa a</th></tr></thead>
<tbody>
<tr><td>Modelador</td><td>M3D, escenas, correspondencia de códigos con las plantas</td><td>Dibujante</td></tr>
<tr><td>Dibujante</td><td>A01, E01 a E03, capas, bloques, láminas en PDF</td><td>Modelador</td></tr>
<tr><td>Calculista</td><td>Cuadro de cargas, circuito representativo, E04</td><td>Normativo</td></tr>
<tr><td>Normativo</td><td>Fichas de exposición, matriz normativa, memoria</td><td>Calculista</td></tr>
</tbody></table></div>
<p>En equipos de tres, el normativo y el calculista suelen ser la misma persona.</p>
</section>

<section>
<h2>Resumen</h2>
<div class="box keys"><ul>
<li>El proyecto demuestra la aplicación del RETIE a una casa concreta, con planos, modelo y memoria que se corresponden.</li>
<li>Seis semanas: exposiciones, caso y software, modelo y necesidades, plantas, cargas y coordinación, cierre y sustentación.</li>
<li>Siete entregables con código: A01, M3D, E01, E02, E03, E04 y MEM.</li>
<li>Es una propuesta académica: la ejecución real exige personas competentes (3.2.1) y el constructor debe contratarlas (3.2.2).</li>
</ul></div>
</section>
