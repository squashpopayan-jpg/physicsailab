<p class="lead">Una instalación no cumple el RETIE porque alguien diga que cumple, sino porque lo declara bajo juramento una persona competente y, en los casos que fija el Libro 4, lo verifica un organismo de inspección acreditado. Sin esa demostración, el operador de red no debe energizar (Libro 3, 3.1.1.1 b). Este capítulo cierra la exposición sobre uso final y conformidad.</p>

<section>
<h2>Cómo se demuestra la conformidad</h2>
<div class="box norma"><ul>
<li>Las instalaciones eléctricas se consideran un producto según la Ley 1480 de 2011; su conformidad se declara con las «declaraciones de cumplimiento» y, cuando aplica, con un dictamen de inspección (Libro 4, 4.3.1 a).</li>
<li>En las instalaciones que requieren certificación plena, la declaración del diseñador y la del constructor se validan con un dictamen de un organismo de inspección acreditado por el ONAC bajo ISO/IEC 17020; mientras no exista, los usuarios no pueden usar la instalación (4.3.1 b).</li>
<li>La certificación es individual para cada cuenta del servicio de energía (4.3.1 c), y el comercializador debe pedirla antes de prestar el servicio (4.3.1 f).</li>
<li>En ampliaciones o remodelaciones, la parte intervenida demuestra la conformidad; si la remodelación supera el 80 %, toda la instalación se trata como nueva (4.3.1 g).</li>
<li>Una inspección de una instalación domiciliaria no puede durar menos de 40 minutos (4.3.1 p).</li>
</ul></div>
</section>

<section>
<h2>¿Cuándo hay dictamen de inspección?</h2>
<p>Requieren certificación plena, entre otras, las instalaciones especiales, las residenciales con capacidad instalable individual superior a 15 kVA, los proyectos residenciales o comerciales de cinco o más cuentas con una misma licencia, las comerciales y oficiales de más de 15 kVA, las industriales de 20 kVA o más y los cargadores de vehículos eléctricos (Libro 4, 4.3.2.1). En vivienda también la requieren las ampliaciones de más de 10 kVA y las remodelaciones de más del 50 % de los dispositivos o conductores cuando la parte remodelada pasa de 10 kVA (4.3.2.2 a).</p>
<p>Las demás se exceptúan del dictamen, pero no de la declaración de cumplimiento suscrita por la persona competente responsable del diseño y de la construcción (4.3.5). La casa ejemplo, con 13,2 kVA instalables, está en este grupo.</p>
</section>

<section>
<h2>Las tres declaraciones de cumplimiento</h2>
<div class="tablewrap"><table>
<thead><tr><th>Declaración</th><th>La firma</th><th>Declara bajo juramento</th><th>Formato</th></tr></thead>
<tbody>
<tr><td>Del diseño</td><td>El diseñador, con su matrícula</td><td>Que el diseño cumple los requisitos del RETIE para diseño detallado o básico, y las desviaciones justificadas con su análisis de riesgos</td><td>4.3.6.1</td></tr>
<tr><td>De la construcción</td><td>El constructor, con su matrícula</td><td>Que la instalación cumple, que los productos tienen certificado y que los verificó contra lo instalado; si requirió diseño o esquema constructivo</td><td>4.3.6.2</td></tr>
<tr><td>De operación y mantenimiento</td><td>El operador o mantenedor</td><td>Que la instalación mantiene el cumplimiento según el manual y no presenta alto riesgo</td><td>4.3.6.3</td></tr>
</tbody></table></div>
<p>Los formatos son textos fijos del Libro 4: no se altera su contenido, solo se diligencian los espacios (4.3.6).</p>
</section>

<section>
<h2>El formato de dictamen de uso final como autoverificación</h2>
<p>El Anexo 5 del Libro 4 contiene el formato que diligencia el inspector en una instalación de uso final. Aunque la casa ejemplo no lo requiera, es la mejor lista para revisar el proyecto antes de entregarlo: cada ítem que aplica debe tener una evidencia en los planos, el modelo o la memoria.</p>
<div class="sim" data-sim="pre-dictamen" data-title="Autoverificación con el formato del Anexo 5"></div>
<div class="sim-guide"><ul>
<li>Cada ítem trae una sugerencia de si aplica a una vivienda básica y qué entregable del proyecto lo respalda.</li>
<li>Marque los que el equipo ya tiene listos. El avance se guarda en este navegador.</li>
<li>Los ítems que no aplican se justifican en la memoria, como pide el parágrafo 1 de 3.3.1.2.</li>
</ul></div>
</section>

<section>
<h2>Manual de operación y mantenimiento</h2>
<p>El constructor entrega al usuario un manual que detalle como mínimo: consideraciones y periodicidad del mantenimiento, reemplazo de productos al final de su vida útil, condiciones de diseño relevantes para la seguridad (por ejemplo, el tipo y material de los conductores), prohibiciones para el usuario, protocolos de maniobra, condiciones especiales, precauciones para el personal y qué hacer en caso de falla, con los datos de contacto del operador de red (Libro 3, Título 6). El manual va firmado por la persona competente (3.2.2 e). En el proyecto se incluye un borrador de una página como anexo de la memoria.</p>
<div class="box ex" data-label="Ejemplo"><ul>
<li>Pruebe cada mes los GFCI con el botón de prueba (TEST) y rearme con RESET.</li>
<li>No reemplace un interruptor por otro de mayor capacidad: el conductor del circuito no lo admite (3.27.3 c).</li>
<li>No conecte la ducha a una toma del baño: tiene su circuito C7 con diferencial.</li>
<li>Revise cada año la caja de inspección de la puesta a tierra; un electricista competente mide la resistencia.</li>
<li>En una emergencia, abra el totalizador del tablero del hall. Falla de la red: operador de red de la zona.</li>
</ul></div>
</section>

<section>
<h2>Resumen</h2>
<div class="box keys"><ul>
<li>La conformidad se demuestra con declaraciones de cumplimiento y, en los casos del 4.3.2, con dictamen de inspección.</li>
<li>Vivienda de más de 15 kVA instalables o proyecto de cinco o más cuentas: certificación plena.</li>
<li>Tres declaraciones con formato fijo: diseño, construcción, operación y mantenimiento.</li>
<li>El formato del Anexo 5 sirve como lista de autoverificación del proyecto.</li>
<li>El manual de operación y mantenimiento es parte de la entrega al usuario (Título 6).</li>
</ul></div>
</section>
