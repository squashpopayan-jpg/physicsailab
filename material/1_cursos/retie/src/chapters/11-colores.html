<p class="lead">El color de un conductor es la primera información de seguridad que recibe quien abre una caja. Un neutro marcado como fase, o una tierra sin marcar, lleva a conexiones invertidas y a carcasas energizadas. El Título 5 del Libro 3 fija el código; este capítulo prepara la exposición sobre conductores e identificación junto con el capítulo 5.</p>

<section>
<h2>La Tabla 3.5.a</h2>
<p>Con el objeto de evitar accidentes por errónea interpretación del nivel de tensión y del tipo de sistema, se debe cumplir el código de colores de las Tablas 3.5.a (corriente alterna) y 3.5.b (corriente continua). Vale el color del acabado exterior del conductor o una marcación clara en las partes visibles, con pintura, cinta o rótulos adhesivos del color respectivo (Libro 3, Título 5).</p>
<div class="sim" data-sim="codigo-colores" data-title="Colores de los conductores según el sistema"></div>
<div class="box norma"><ul>
<li>En todos los casos el neutro es blanco o marcado con blanco en todas sus partes visibles, y la tierra de protección es verde o con franja verde. <b>No se debe utilizar el blanco ni el verde para las fases.</b></li>
<li>En circuitos monofásicos derivados de sistemas trifásicos, la fase se marca con el color asignado a esa fase en el sistema trifásico. Igual con los sistemas monofásicos derivados de dos fases. Si la acometida es monofásica derivada de un sistema trifásico, una fase también puede identificarse con negro.</li>
<li>En sistemas de más de 380 V, además de los colores, se fija en los tableros y en puntos accesibles una leyenda con el nivel de tensión.</li>
<li>La tierra aislada (para equipos sensibles) es verde o verde/amarillo.</li>
</ul></div>
</section>

<section>
<h2>Los colores de la casa ejemplo</h2>
<p>La casa tiene un sistema monofásico trifilar 120/240 V. El proyecto adopta estos colores, que se escriben en el cuadro de convenciones y en la memoria:</p>
<div class="tablewrap narrow"><table>
<thead><tr><th>Conductor</th><th>Color</th><th>Fuente</th></tr></thead>
<tbody>
<tr><td>Fase A</td><td>Negro</td><td>Tabla 3.5.a (una fase puede ser negra)</td></tr>
<tr><td>Fase B</td><td>Rojo</td><td>Tabla 3.5.a (color de fase)</td></tr>
<tr><td>Neutro</td><td>Blanco</td><td>Tabla 3.5.a</td></tr>
<tr><td>Tierra de protección</td><td>Verde (o desnudo)</td><td>Tabla 3.5.a y 3.12.2.3 e</td></tr>
<tr><td>Retorno de interruptor</td><td>Amarillo</td><td>Criterio de diseño: un color de fase distinto, nunca blanco ni verde</td></tr>
<tr><td>Viajeros de conmutables</td><td>Azul</td><td>Criterio de diseño</td></tr>
</tbody></table></div>
<div class="box crit"><p>El RETIE no asigna un color propio a los retornos ni a los viajeros: son conductores de fase conmutada. El proyecto escoge colores de fase distintos para que se reconozcan en las cajas. Esa elección es un criterio de diseño y así se declara en la matriz normativa.</p></div>
</section>

<section>
<h2>Encuentre los errores</h2>
<p>El tablero siguiente tiene ocho conductores señalados. Algunos cumplen y otros no. Decida en cada uno y compare con la regla.</p>
<div class="sim" data-sim="error-tablero" data-title="Tablero con errores de identificación"></div>

<section>
<h2>Resumen</h2>
<div class="box keys"><ul>
<li>Neutro blanco; tierra verde, verde/amarillo o desnuda; fases de cualquier color de fase, nunca blanco ni verde.</li>
<li>En 120/240 V monofásico, una fase puede ser negra; en derivaciones de trifásico se respeta el color de la fase de origen.</li>
<li>La marcación con cinta del color respectivo en las partes visibles es válida.</li>
<li>Los colores de retornos y viajeros son criterio del diseño y se declaran.</li>
</ul></div>
</section>
