<p class="lead">Las cajas y los tubos son la parte de la instalación que más toca la obra civil: se dejan en la losa antes del vaciado, se embeben en los muros y se cruzan con vigas. El RETIE trata las cajas como un elemento fundamental de la protección contra contacto directo y los tubos como la protección mecánica del aislamiento.</p>

<section>
<h2>Cajas</h2>
<div class="box norma"><ul>
<li>El volumen de la caja, calculado según la sección 314.16(A) de la NTC 2050, no debe ser menor al volumen de ocupación de la sección 314.16(B) (3.17.5 a).</li>
<li>Las cajas para salidas de alumbrado deben estar diseñadas para ese fin: no se permiten cajas rectangulares (3.17.5 b).</li>
<li>No se permiten cajas redondas cuando a sus lados llegan canalizaciones que necesitan contratuercas o boquillas (3.17.5 c).</li>
<li>Al vaciar y curar el concreto se debe proteger el interior de las cajas para no perder el galvanizado (3.17.5 g).</li>
<li>Las cajas metálicas se equipotencializan y conectan a la puesta a tierra (3.17.5 h).</li>
<li>En lugares húmedos, las cajas, cuerpos de tubo, campanas y accesorios deben ser a prueba de agua (3.17.5 i).</li>
</ul></div>
<p>El volumen de ocupación suma, en unidades del calibre: un volumen por cada conductor que entra a la caja, dos por cada aparato (toma o interruptor) del calibre mayor conectado a él, uno por todos los conductores de tierra juntos y uno por las abrazaderas internas.</p>
<div class="sim" data-sim="volumen-caja" data-title="¿Cabe todo en la caja?"></div>
<div class="sim-guide"><ul>
<li>La caja de LS1 en la casa ejemplo recibe fase, neutro, retorno y tierra de 14 AWG por un tubo y los entrega por otro: seis conductores más una unidad por las tierras. La octagonal de 4 in × 1 1/2 in queda al 90 %: cabe, pero justa.</li>
<li>Una toma de paso de 12 AWG (entran y salen fase, neutro y tierra) con su aparato necesita 258 cm³: no cabe en la caja rectangular no metálica de dimensiones mínimas del RETIE (211 cm³) y llena la metálica mínima al 100 %. Por eso las cajas comerciales de tomas suelen ser más profundas que el mínimo.</li>
<li>El interruptor doble S1 tampoco cabe en la rectangular mínima: es el caso típico para una caja cuadrada de 4 in con suplemento rectangular.</li>
</ul></div>
</section>

<section>
<h2>Tubos: tipos y usos</h2>
<p>El RETIE remite a los artículos de la NTC 2050 para cada tipo de canalización (3.17.6.1 g). En vivienda los usuales son el tubo rígido de PVC (artículo 352), la tubería eléctrica metálica EMT (358), la tubería no metálica ENT (362) y las canaletas superficiales (386 y 388).</p>
<div class="box norma"><ul>
<li>Las partes de canalizaciones expuestas o a la vista se marcan con franjas de color naranja de al menos 10 cm de ancho (3.17.6.1 a).</li>
<li>En las juntas de dilatación se instala canalización flexible conforme al Reglamento Colombiano de Construcción Sismo Resistente (3.17.6.1 c).</li>
<li>Si en una misma canalización van conductores eléctricos y cableados o tuberías de otros usos, debe haber una separación física (3.17.6.1 d).</li>
<li>No se usan tuberías no metálicas expuestas a daño físico o a la luz solar directa, ni directamente enterradas si no están certificadas para eso (3.17.6.6 a).</li>
<li>Las tuberías flexibles no metálicas pueden ir ocultas en cielorrasos, pisos, muros o techos si los materiales tienen resistencia al fuego de al menos 15 min (3.17.6.6 b).</li>
<li>Los soportes de tubería no metálica se separan como máximo 1,2 m para tubos hasta de 19 mm, 1,5 m de 25 a 51 mm, 1,8 m de 63 a 76 mm y 2,1 m de 89 a 102 mm (3.17.6.6 c).</li>
<li>Las tuberías livianas (tipo A o tipo L) solo se instalan embebidas en concreto u otro material resistente al fuego; nunca a la vista ni en cielos falsos (3.17.6.6 f).</li>
<li>En tuberías embebidas en concreto se colocan tapones provisionales en los extremos antes del vaciado (3.17.6.6 g).</li>
<li>No se permite el uso de bandejas portacables en instalaciones residenciales (3.17.6.2 s).</li>
</ul></div>
</section>

<section>
<h2>Cuántos conductores caben en un tubo</h2>
<p>No se debe superar el número de conductores del Capítulo 9, Tabla 1, de la NTC 2050 (3.17.13 e): con un conductor, 53 % del área interior; con dos, 31 %; con tres o más, 40 %. El área de cada conductor incluye su aislamiento.</p>
<div class="eq">\[ \frac{\sum A_{\text{conductores}}}{A_{\text{interior del tubo}}} \le 0{,}40 \qquad (\text{tres o más conductores}) \]</div>
<div class="sim" data-sim="llenado-tubo" data-title="Llenado de un tubo"></div>
<div class="sim-guide"><ul>
<li>El tramo TG–LH de la casa lleva fase, neutro y tierra de 14 AWG: en tubo PVC de 1/2 in ocupa un 10 %.</li>
<li>Meta en el mismo tubo de 1/2 in dos circuitos de 12 AWG con sus tierras (seis conductores): llega al 28 %. Con cuatro circuitos ya no cabe y además habría que aplicar el factor de ajuste por más de tres portadores.</li>
<li>Note que con dos conductores el límite baja al 31 %: dos cables rígidos se trancan con facilidad.</li>
</ul></div>
</section>

<section>
<h2>Curvas entre cajas</h2>
<p>Entre dos puntos de halado (cajas o conduletas) la suma de los ángulos de las curvas no debe pasar de 360° (secciones 352.26 y 358.26 de la NTC 2050). Con más curvas el conductor no se puede halar sin dañar su aislamiento; la solución es una caja de paso intermedia.</p>
<div class="sim" data-sim="curvas-tramo" data-title="Suma de curvas en un recorrido"></div>
<div class="sim-guide"><ul>
<li>Una bajante desde la losa hasta un interruptor ya suma 90° arriba; si el tubo cambia de dirección en la losa y luego llega a la caja por un costado, se acumulan fácilmente 270°.</li>
<li>Agregue curvas hasta pasar de 360° y vea dónde conviene la caja de paso.</li>
</ul></div>
</section>

<section>
<h2>Lo que se dibuja en la planta E03</h2>
<div class="box entrega"><ul>
<li>Recorridos de tubería diferenciando los que van por la losa (línea continua) y por el contrapiso (línea discontinua).</li>
<li>Diámetro y tipo de tubo de cada tramo, y número y calibre de los conductores con sus marcas (3.3.2.1 d y e).</li>
<li>Cajas con su tipo: octagonal para alumbrado, rectangular para aparatos, cuadrada para empalmes.</li>
<li>Cambios de nivel (subidas y bajantes) y cruces con elementos estructurales, con referencia a la revisión de coordinación.</li>
</ul></div>
</section>

<section>
<h2>Resumen</h2>
<div class="box keys"><ul>
<li>El volumen de la caja debe cubrir conductores, aparatos, tierras y abrazaderas (314.16); alumbrado en cajas no rectangulares.</li>
<li>Llenado máximo: 53 % con uno, 31 % con dos y 40 % con tres o más conductores.</li>
<li>Máximo 360° de curvas entre cajas; si no, caja de paso.</li>
<li>Tubería liviana solo embebida; tapones antes del vaciado; naranja si queda a la vista; flexible en juntas de dilatación.</li>
<li>Sin bandejas portacables en vivienda.</li>
</ul></div>
</section>
