<template class="chapter-src" data-id="circuitos" data-num="3" data-title="Tensión, corriente y potencia en la vivienda" data-part="Parte II · Electricidad para ingenieros civiles" data-short="Las magnitudes eléctricas con números de una casa, el circuito ramal como cargas en paralelo, el sistema monofásico trifilar 120/240 V, el peligro del neutro abierto y la energía de la factura">
<p class="lead">Para aplicar el RETIE no hace falta resolver circuitos complejos, pero sí entender cuatro magnitudes y dos ideas: que las cargas de una casa están en paralelo y que el neutro es tan importante como la fase. Con eso se entienden las protecciones, los calibres y la mitad de los requisitos del reglamento.</p>

<section>
<h2>Las cuatro magnitudes</h2>
<div class="box def"><ul>
<li><b>Tensión</b> \(V\), en voltios (V): la diferencia de potencial que empuja la corriente. En Colombia la red de baja tensión de uso general entrega 120 V entre fase y tierra y 240 V entre fases en los sistemas monofásicos trifilares (Libro 3, Título 9), a 60 Hz.</li>
<li><b>Corriente</b> \(I\), en amperios (A): la carga que circula por segundo. Es la que calienta los conductores y la que atraviesa el cuerpo en un accidente.</li>
<li><b>Resistencia</b> \(R\), en ohmios (Ω): la oposición al paso de la corriente. Ley de Ohm: \(V = I R\).</li>
<li><b>Potencia</b> \(P\), en vatios (W): la rapidez con que se transforma energía. En corriente alterna \(P = V I \cos\varphi\); la potencia aparente \(S = V I\) se mide en voltamperios (VA). En una ducha o una estufa \(\cos\varphi \approx 1\) y \(P \approx S\).</li>
</ul></div>
<div class="eq key" data-name="Potencia y corriente">\[ I = \frac{S}{V} \qquad\Longrightarrow\qquad I_{\text{ducha}} = \frac{3\,500\ \text{W}}{120\ \text{V}} \approx 29{,}2\ \text{A} \]</div>
<p>Los valores de tensión y corriente alterna que se citan son eficaces (rms): una tensión de 120 V eficaces oscila entre ±170 V de pico, 60 veces por segundo. Las tablas de conductores, las protecciones y los efectos sobre el cuerpo se expresan siempre en valores eficaces.</p>
</section>

<section>
<h2>El circuito ramal: cargas en paralelo</h2>
<p>Todas las tomas de un circuito están conectadas en paralelo entre la fase y el neutro: cada aparato recibe los mismos 120 V y toma su propia corriente. La corriente total que sale del tablero es la suma de todas, y es la que el interruptor automático vigila.</p>
<div class="eq">\[ I_{\text{circuito}} = \sum_k I_k = \frac{1}{V}\sum_k S_k \]</div>
<div class="sim" data-sim="circuito-ramal" data-title="¿Cuántos aparatos aguanta un circuito de 20 A?"></div>
<div class="sim-guide"><ul>
<li>Encienda aparatos de cocina en el circuito de 20 A: con el horno microondas, la cafetera y la licuadora juntos se superan los 2 400 VA del circuito.</li>
<li>Observe la línea del 80 %: es el criterio usual para cargas que funcionan tres horas o más seguidas (una ducha, un calentador).</li>
<li>Cuando la corriente supera la nominal, el interruptor no dispara de inmediato: la parte térmica tarda segundos o minutos. El capítulo 6 explica la curva.</li>
<li>Cambie a 15 A con conductor 14 AWG: es el circuito típico de alumbrado, no de cocina.</li>
</ul></div>
</section>

<section>
<h2>El sistema monofásico trifilar 120/240 V</h2>
<p>La acometida de una casa en sistema monofásico trifilar trae dos conductores de fase y un neutro. Entre cada fase y el neutro hay 120 V; entre las dos fases, 240 V, porque las dos tensiones están en oposición. Las cargas de 120 V se reparten entre las dos fases y las de 240 V (estufa, algunas duchas) se conectan entre fases.</p>
<div class="eq">\[ V_{AN} = 120\angle 0^\circ,\quad V_{BN} = 120\angle 180^\circ,\quad V_{AB} = 240\ \text{V},\qquad I_N = \abs{I_A - I_B}\ \text{(cargas resistivas)} \]</div>
<p>Si las cargas de las dos fases son iguales, el neutro casi no lleva corriente. Por eso se balancean los circuitos en el tablero (capítulo 24). En zonas urbanas también se encuentra el servicio bifásico 208/120 V, tomado de dos fases de una red trifásica: entre fases hay 208 V, no 240 V, y una estufa o ducha de 240 V entrega allí un 25 % menos de potencia.</p>
<div class="sim" data-sim="neutro-abierto" data-title="Qué pasa si se abre el neutro"></div>
<div class="sim-guide"><ul>
<li>Con el neutro conectado, cada carga recibe 120 V aunque las potencias sean muy distintas.</li>
<li>Abra el neutro: las dos cargas quedan en serie a 240 V. La de menor potencia (mayor resistencia) recibe casi toda la tensión. Con 100 W en una fase y 1 500 W en la otra, el bombillo queda a más de 220 V.</li>
<li>Por eso el RETIE prohíbe conectar un dispositivo de protección en el conductor puesto a tierra si no abre a la vez todos los conductores del circuito (Libro 3, 3.27.3 f) y exige que cada neutro termine en un borne individual del tablero (3.17.8 aa).</li>
</ul></div>
<div class="box warn"><p>Un neutro flojo en la acometida o en el tablero produce sobretensiones que dañan equipos y pueden iniciar incendios. Es una de las fallas que el operador de red y el inspector revisan con más cuidado.</p></div>
</section>

<section>
<h2>Energía y factura</h2>
<p>La energía es la potencia sostenida en el tiempo: \(E = P\,t\). La factura se cobra en kilovatios-hora (kWh): un aparato de 1 000 W encendido una hora consume 1 kWh. Una ducha eléctrica de 3 500 W, usada 40 minutos al día por una familia, gasta unos 70 kWh al mes, a menudo la carga más grande de la casa.</p>
<div class="sim" data-sim="consumo-mes" data-title="Consumo mensual de la casa ejemplo"></div>
<div class="sim-guide"><ul>
<li>Ajuste las horas de uso diario y el valor del kWh (el que aparece en una factura reciente de su zona).</li>
<li>Compare la ducha con la nevera: la nevera tiene menos potencia, pero funciona muchas horas.</li>
</ul></div>
</section>

<section>
<h2>Resumen</h2>
<div class="box keys"><ul>
<li>\(I = S/V\): una ducha de 3 500 W a 120 V toma unos 29 A; un circuito de 20 A soporta 2 400 VA.</li>
<li>Las cargas de un circuito están en paralelo y sus corrientes se suman en el tablero.</li>
<li>Sistema monofásico trifilar: 120 V fase-neutro, 240 V entre fases; el neutro lleva la diferencia.</li>
<li>Un neutro abierto pone cargas en serie a 240 V: sobretensiones peligrosas.</li>
<li>La factura se mide en kWh; la ducha eléctrica suele ser el mayor consumo en clima frío.</li>
</ul></div>
</section>
