<p class="lead">Estos programas completan cualquiera de las tres rutas. La hoja de cálculo es obligatoria (o una tabla equivalente): en ella vive el cuadro de cargas con sus fórmulas a la vista. DIALux evo y QElectroTech son opcionales pero muy útiles para la iluminación y el unifilar. FreeCAD es la alternativa libre y sin conexión para el modelo, solo si el docente la autoriza.</p>

<section>
<h2>La hoja de cálculo del cuadro de cargas</h2>
<p>La plantilla de la guía tiene cinco hojas: <b>Léame</b>, <b>Cuadro</b> (los circuitos ramales), <b>Demanda</b> (el método estándar de la NTC 2050), <b>Acometida</b> (calibre, totalizador y caída) y <b>Tablas</b> (capacidad, protección máxima y resistencia de los conductores). Las celdas azules son los datos del caso; las negras, fórmulas. Con los datos de la casa ejemplo da los mismos resultados de los capítulos 24 y 25.</p>
<div class="sim" data-sim="hoja-formulas" data-title="La plantilla, celda por celda"></div>
<div class="sim-guide"><ul>
<li>Haga clic en una celda: la barra de fórmulas muestra lo que hay escrito y el valor que resulta.</li>
<li>Active <b>Ver fórmulas</b> para leer la hoja como la lee el programa, y <b>En español</b> para ver los nombres de funciones y separadores con que aparecen en Excel o LibreOffice en español (<code>SI</code>, <code>BUSCARV</code>, punto y coma).</li>
<li>Siga una cadena completa: la caída total del C2 (celda X6) usa la corriente (J6), la resistencia de la hoja Tablas (V6), la longitud (U6) y la caída de la acometida (Acometida!B10), que a su vez depende de la demanda.</li>
</ul></div>
<div class="pasos" data-pasos="hoja"></div>
</section>

<section>
<h2>DIALux evo: la iluminación de un ambiente</h2>
<p>En vivienda privada el RETILAP no exige un diseño de iluminación, pero el equipo debe justificar sus luminarias (capítulo 20). DIALux evo calcula punto por punto la iluminancia y la uniformidad de un ambiente con luminarias reales o genéricas. Es gratuito; su versión Pro se ofrece gratis un año a estudiantes y docentes que acrediten su condición.</p>
<div class="pasos" data-pasos="dialux"></div>
<div class="box note"><p>Con el método de los lúmenes, la sala-comedor de la casa ejemplo (4,65 × 5,45 m libres) con tres luminarias de 2 400 lm y factor de mantenimiento 0,8 da unos 154 lx. DIALux, que calcula las reflexiones con las reflectancias que se le den, suele dar un valor algo distinto: la diferencia y su explicación van en la memoria.</p></div>
</section>

<section>
<h2>QElectroTech: el diagrama unifilar</h2>
<p>QElectroTech es un programa libre para esquemas eléctricos, con una colección de símbolos normalizados y exportación a PDF, SVG, PNG y DXF. Sirve para dibujar el unifilar de la lámina E04 con más orden que en un CAD general.</p>
<div class="pasos" data-pasos="qet"></div>
</section>

<section>
<h2>FreeCAD: la alternativa libre al BIM</h2>
<p>FreeCAD 1.1 trae un banco de trabajo <b>BIM</b> con muros, estructura, ventanas, niveles, planos de sección y exportación IFC, todo libre y sin conexión. Es una opción para equipos que quieran un modelo BIM sin licencia, a cambio de una interfaz menos pulida y menos tutoriales en español. Se usa solo con autorización del docente.</p>
<div class="tablewrap narrow"><table>
<thead><tr><th>Tarea del proyecto</th><th>Herramienta de FreeCAD</th></tr></thead>
<tbody>
<tr><td>Calcar el plano base</td><td>Importar el DXF del kit (Archivo ▸ Importar) o insertar una imagen de referencia</td></tr>
<tr><td>Muros, columnas, vigas, losa</td><td>Banco BIM: Muro, Estructura (columna y viga), Losa a partir de un contorno</td></tr>
<tr><td>Vanos</td><td>Ventana y Puerta con sus ajustes predefinidos</td></tr>
<tr><td>Tubos</td><td>Barrido de un círculo sobre una ruta, o el módulo de tuberías del banco BIM</td></tr>
<tr><td>Cortes y láminas</td><td>Plano de sección y TechDraw para vistas a escala con rótulo</td></tr>
<tr><td>Intercambio</td><td>Exportar IFC, DXF o PDF</td></tr>
</tbody></table></div>
</section>

<section>
<h2>Resumen</h2>
<div class="box keys"><ul>
<li>La hoja de cálculo tiene datos en azul y fórmulas en negro; con la casa ejemplo reproduce los capítulos 24 y 25.</li>
<li>Al agregar un circuito se copia la fila completa y se revisan los rangos de los totales.</li>
<li>DIALux evo da iluminancia y uniformidad punto por punto; se compara con el método de los lúmenes.</li>
<li>QElectroTech dibuja el unifilar con símbolos normalizados y lo exporta a PDF, SVG o DXF.</li>
<li>FreeCAD BIM es la alternativa libre al modelo de Revit, con autorización del docente.</li>
</ul></div>
</section>
