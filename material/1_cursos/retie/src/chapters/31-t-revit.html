<p class="lead">En Revit el modelo 3D, las plantas eléctricas, los circuitos y el cuadro del tablero son vistas del mismo archivo. Al asignar una toma a un circuito, el cuadro del tablero se actualiza solo; al mover una viga, la comprobación de interferencias lo detecta. El precio es una curva de aprendizaje mayor y un computador con más memoria, por eso la guía la propone solo para equipos con formación previa en BIM.</p>

<section>
<h2>Antes de empezar</h2>
<ul>
<li><b>Licencia y equipo.</b> Revit tiene acceso educativo gratuito sujeto a la verificación de Autodesk, igual que AutoCAD. Funciona en Windows; con 16 GB de RAM el trabajo es fluido.</li>
<li><b>Plantilla.</b> Empiece con una plantilla <b>eléctrica en métrico</b> (o la de sistemas en métrico) para tener las vistas y familias eléctricas.</li>
<li><b>Interfaz.</b> Las rutas de la cinta se dan con los nombres en inglés, que son los de la ayuda oficial de Autodesk y de la mayoría de tutoriales; en la interfaz en español las pestañas están en el mismo orden.</li>
</ul>
<div class="box note"><p>Lo que Revit calcula (cargas por fase, corriente del circuito, caída de tensión según el tipo de cable) sigue sus propias tablas y factores de demanda. Las decisiones de la memoria se justifican con el RETIE y la NTC 2050 (capítulos 24 y 25), no con el valor que muestra el programa: compárelos y explique las diferencias.</p></div>
</section>

<section>
<h2>El cuadro del tablero que debe obtener</h2>
<p>Revit arma el cuadro del tablero en dos columnas, con los circuitos impares a la izquierda y los pares a la derecha, y la carga de cada uno en la fase a la que está conectado. Este es el de la casa ejemplo, con los circuitos ordenados para que las fases queden balanceadas.</p>
<div class="sim" data-sim="cuadro-tablero" data-title="Cuadro del tablero TG con la disposición de Revit"></div>
<div class="sim-guide"><ul>
<li>En un tablero monofásico trifilar, las posiciones 1-2, 5-6 y 9-10 van en la fase A, y 3-4, 7-8 y 11-12 en la fase B. Un interruptor bipolar ocupa dos posiciones del mismo lado, una en cada fase.</li>
<li>Cambie la disposición para ver cómo se desbalancean las fases si todos los circuitos de la cocina quedan en la misma.</li>
<li>Compare los totales con el cuadro de cargas del capítulo 24: deben coincidir.</li>
</ul></div>
</section>

<section>
<h2>El informe de interferencias</h2>
<p>La comprobación de interferencias de Revit compara dos categorías (por ejemplo, tubos contra armazón estructural) y lista cada par de elementos que se cruzan. Esta es la lista equivalente para la casa ejemplo, con el criterio de la guía para cada cruce.</p>
<div class="sim" data-sim="informe-interferencias" data-title="Interferencias entre tuberías y estructura"></div>
<div class="sim-guide"><ul>
<li>Cada fila es un par de elementos; Revit los muestra con su identificador, aquí con el nombre del tramo y de la viga o columna.</li>
<li>Las interferencias críticas (en la zona de confinamiento, a menos de 0,70 m de la columna) obligan a mover el recorrido; las demás se aprueban con el ingeniero estructural y se documentan.</li>
</ul></div>
</section>

<section>
<h2>Resumen</h2>
<div class="box keys"><ul>
<li>Configuración eléctrica primero: tensiones de 120 y 240 V y un sistema de distribución monofásico trifilar.</li>
<li>El DXF del kit se vincula en el origen y sirve de calco para muros, columnas y vigas.</li>
<li>Cada dispositivo lleva su código en la marca y queda asignado a un circuito del tablero TG.</li>
<li>El cuadro del tablero y la comprobación de interferencias salen del modelo; sus resultados se contrastan con los cálculos de la guía.</li>
<li>Las láminas A01 a E04 son vistas del mismo archivo, exportadas a PDF.</li>
</ul></div>
