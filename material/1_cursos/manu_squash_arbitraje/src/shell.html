<title>Manu_Squash Arbitraje · Sistema Oficial WSF</title>
<meta name="description" content="Aplicación interactiva de arbitraje de squash: simulador 3D/2D, árbol de decisión oficial WSF para interferencias, manual de reglas 1 a 15 y planilla/marcador con llamados reglamentarios.">
<meta name="author" content="Manu_Squash">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
{{CSS}}
</style>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#inicio" data-go="inicio" aria-label="Inicio · Manu_Squash">
      <img src="{{LOGO}}" alt="Manu Squash" width="102" height="36">
      <div class="bt">
        <b>Arbitraje Oficial WSF</b>
        <span>Simulador · Decisiones · Marcador</span>
      </div>
    </a>
    <nav class="nav" aria-label="Secciones principales">
      <button class="active" data-go="inicio">Inicio</button>
      <button data-go="simulador">Simulador 3D/2D</button>
      <button data-go="interferencia">Árbol de Decisión</button>
      <button data-go="reglamento">Reglamento WSF</button>
      <button data-go="marcador">Planilla y Marcador</button>
      <button data-go="acerca">Acerca</button>
    </nav>
    <button class="theme-btn" id="themeBtn" title="Cambiar tema claro/oscuro" aria-label="Cambiar tema claro u oscuro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="4.5"/>

  </div>
</header>

<main id="app">
{{SECTIONS}}
</main>

<footer class="foot">
  <div class="wrap">
    <div class="credit">
      <img src="{{LOGO}}" alt="Manu Squash" width="80" height="28">
      <span>Elaborado por <b>Manu_Squash</b> · Sistema Integral de Arbitraje según la World Squash Federation</span>

  </div>
</footer>
