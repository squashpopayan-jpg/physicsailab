<template class="chapter-src" data-id="radiacion" data-num="23" data-title="Radiación y antenas" data-part="Parte VI · Ondas y radiación" data-short="Potenciales retardados, fórmula de Larmor, dipolo hertziano, antenas lineales y arreglos">
<p class="lead">Las cargas en reposo producen campos estáticos y las que se mueven con velocidad constante los arrastran consigo. Sólo las cargas <em>aceleradas</em> emiten radiación: un campo que se desprende de la fuente, decae como \(1/r\) y transporta energía hasta el infinito. De esa radiación dependen las antenas, el color del cielo y la inestabilidad del átomo clásico.</p>

<section>
<h2>Potenciales retardados</h2>
<p>Con los potenciales \(\vb B=\curl\vb A\) y \(\vb E=-\grad V-\partial\vb A/\partial t\), e imponiendo la condición de Lorenz \(\divg\vb A+\frac1{c^2}\pdv{V}{t}=0\), las ecuaciones de Maxwell se reducen a dos ecuaciones de onda con fuentes:</p>
<div class="eq">\[\lap V-\frac1{c^2}\frac{\partial^2 V}{\partial t^2}=-\frac{\rho}{\eo},\qquad \lap\vb A-\frac1{c^2}\frac{\partial^2\vb A}{\partial t^2}=-\mo\vb J .\]</div>
<p>Su solución generaliza las fórmulas de la electrostática y de Biot–Savart, con una diferencia esencial: cada elemento de carga contribuye con el valor que tenía cuando partió la “noticia” que llega al punto de observación.</p>
<div class="eq key" data-name="Potenciales retardados">\[V(\vb r,t)=\frac{1}{4\pi\eo}\int\frac{\rho(\vb r',t_r)}{\abs{\vb r-\vb r'}}\dd\tau',\qquad \vb A(\vb r,t)=\frac{\mo}{4\pi}\int\frac{\vb J(\vb r',t_r)}{\abs{\vb r-\vb r'}}\dd\tau',\qquad t_r=t-\frac{\abs{\vb r-\vb r'}}{c}.\]</div>
<p>El <span class="term">tiempo retardado</span> \(t_r\) expresa que las perturbaciones electromagnéticas se propagan a velocidad finita \(c\). Al derivar los potenciales retardados aparecen términos proporcionales a las derivadas temporales de las fuentes, que decaen sólo como \(1/r\): son los <span class="term">campos de radiación</span>.</p>
</section>

<section>
<h2>Radiación de una carga acelerada</h2>
<p>Un argumento geométrico de J. J. Thomson, popularizado por E. Purcell, muestra el origen de la radiación. Una carga se mueve con velocidad \(v\) y frena bruscamente durante un intervalo \(\Delta t\). En el instante \(t\) posterior, dentro de la esfera de radio \(ct\) el campo ya “sabe” que la carga está en reposo y es coulombiano. Fuera de la esfera de radio \(c(t+\Delta t)\) nada se ha enterado aún, y el campo sigue apuntando hacia la posición que la carga tendría si no hubiese frenado. Las líneas de campo, que no pueden cortarse, se unen en la cáscara intermedia mediante un tramo casi transversal: el <em>pulso de radiación</em>, que se aleja a velocidad \(c\). Midiendo la pendiente del tramo se obtiene el campo transversal:</p>
<div class="eq key" data-name="Campo de radiación de una carga acelerada">\[E_\text{rad}=\frac{q\,a\sen\theta}{4\pi\eo c^2\,r},\qquad \vb B_\text{rad}=\frac1c\,\uv r\times\vb E_\text{rad}.\]</div>
<p>El campo radiado decae como \(1/r\), no como \(1/r^2\), y es máximo en la dirección perpendicular a la aceleración. Integrando el flujo de Poynting \(S=E_\text{rad}^2/(\mo c)\) sobre una esfera resulta la <span class="term">fórmula de Larmor</span>:</p>
<div class="eq key" data-name="Fórmula de Larmor">\[\frac{\dd P}{\dd\Omega}=\frac{q^2a^2}{16\pi^2\eo c^3}\sen^2\theta,\qquad P=\frac{q^2a^2}{6\pi\eo c^3}\qquad(v\ll c).\]</div>
<div class="sim" data-sim="radiation-kink" data-title="El pulso de radiación de una carga que frena (construcción de Thomson y Purcell)"></div>
<div class="sim-guide"><ul>
<li>Observe que el tramo transversal es más largo, y por tanto el campo radiado es más intenso, en la dirección perpendicular al movimiento, y que se anula a lo largo de él.</li>
<li>Reduzca la duración del frenado: la aceleración aumenta y el pulso se vuelve más delgado e intenso.</li>
<li>Con velocidades cercanas a \(c\), las líneas exteriores se concentran en el plano perpendicular a la velocidad (contracción de Heaviside, capítulo 24).</li>
</ul></div>
<div class="box hist"><p><b>El átomo clásico se derrumba.</b> Un electrón que gira alrededor del núcleo está acelerado y, según Larmor, debería perder toda su energía en unos \(10^{-11}\) s y caer en espiral hacia el núcleo. Este fracaso de la física clásica fue una de las motivaciones de la mecánica cuántica. La misma fórmula describe, en cambio, con éxito la <em>radiación de frenado</em> (rayos X de un tubo) y la <em>radiación sincrotrón</em> de los aceleradores.</p></div>
</section>

<section>
<h2>El dipolo eléctrico oscilante</h2>
<p>La fuente de radiación más simple es un elemento de corriente \(I_0\cos\omega t\) de longitud \(\ell\ll\lambda\) (el <span class="term">dipolo hertziano</span>), equivalente a un dipolo \(p(t)=p_0\cos\omega t\) con \(p_0=I_0\ell/\omega\). Con \(k=\omega/c\), sus campos fasoriales son:</p>
<div class="eq key" data-name="Campos del dipolo hertziano">\[H_\phi=\frac{jkI_0\ell\sen\theta}{4\pi r}\left(1+\frac1{jkr}\right)e^{-jkr},\qquad E_\theta=\frac{j\eta kI_0\ell\sen\theta}{4\pi r}\left(1+\frac1{jkr}-\frac1{(kr)^2}\right)e^{-jkr},\]
\[E_r=\frac{\eta I_0\ell\cos\theta}{2\pi r^2}\left(1+\frac1{jkr}\right)e^{-jkr}.\]</div>
<ul>
<li><b>Zona cercana</b> (\(kr\ll1\), es decir \(r\ll\lambda/2\pi\)): dominan los términos \(1/r^3\) y \(1/r^2\). Son el campo cuasiestático de un dipolo eléctrico y el de Biot–Savart. \(\vb E\) y \(\vb H\) están desfasados \(90^\circ\) y la energía va y vuelve sin escapar.</li>
<li><b>Zona lejana</b> (\(kr\gg1\)): sólo sobreviven los términos \(1/r\). Queda una onda esférica TEM con \(E_\theta=\eta H_\phi\), en fase, que transporta energía hacia afuera.</li>
</ul>
<p>Las líneas de \(\vb E\) en un plano meridiano son las curvas de nivel de la función \(Q=\sen^2\theta\left[\frac{\cos(\omega t-kr)}{kr}-\sen(\omega t-kr)\right]\). Cerca del dipolo nacen y mueren en las cargas; a partir de \(r\approx\lambda/4\) se cierran sobre sí mismas y se desprenden como lazos que viajan a velocidad \(c\).</p>
<div class="sim" data-sim="dipole-radiation" data-title="Líneas de campo eléctrico de un dipolo oscilante: desprendimiento de la radiación"></div>
<div class="sim-guide"><ul>
<li>Siga un lazo desde que se forma junto al dipolo: se separa cada medio período y se aleja manteniendo una separación de \(\lambda/2\) con el siguiente.</li>
<li>No hay líneas de radiación a lo largo del eje del dipolo (\(\theta=0\)): allí \(\sen\theta=0\).</li>
<li>Active \(H_\phi\) para ver el campo magnético, perpendicular a la pantalla, en fase con \(E\) en la zona lejana.</li>
</ul></div>
<p>El vector de Poynting medio en la zona lejana y la potencia total radiada son</p>
<div class="eq key" data-name="Potencia del dipolo hertziano">\[\langle\vb S\rangle=\frac{\eta}{2}\left(\frac{kI_0\ell}{4\pi r}\right)^2\sen^2\theta\,\uv r,\qquad P=\frac{\eta(kI_0\ell)^2}{12\pi}=\frac{\mo p_0^2\omega^4}{12\pi c},\qquad R_\text{rad}=\frac{2P}{I_0^2}=80\pi^2\left(\frac{\ell}{\lambda}\right)^2\ \Omega .\]</div>
<p>La dependencia \(\omega^4\) explica el azul del cielo: las moléculas del aire, polarizadas por la luz solar, se comportan como dipolos oscilantes y dispersan la luz azul (450 nm) unas 5.9 veces más que la roja (700 nm). Por la misma razón, la luz del cielo a \(90^\circ\) del Sol está fuertemente polarizada.</p>
</section>

<section>
<h2>Antenas lineales</h2>
<p>En un dipolo delgado de longitud total \(L\) alimentado en el centro, la corriente forma una onda estacionaria \(I(z)=I_m\sen\left[k\left(\frac L2-\abs z\right)\right]\). Sumando las contribuciones de todos los elementos, en la zona lejana:</p>
<div class="eq key" data-name="Campo lejano de un dipolo de longitud L">\[E_\theta=\frac{j\eta I_m}{2\pi r}e^{-jkr}\,F(\theta),\qquad F(\theta)=\frac{\cos\!\left(\frac{kL}{2}\cos\theta\right)-\cos\frac{kL}{2}}{\sen\theta}.\]</div>
<p>Para el <span class="term">dipolo de media onda</span> (\(L=\lambda/2\)), \(F=\cos\!\left(\frac\pi2\cos\theta\right)/\sen\theta\), la resistencia de radiación es \(73.1\ \Omega\) y la directividad 1.64 (2.15 dBi). Un monopolo de \(\lambda/4\) sobre un plano conductor se comporta, por el método de las imágenes, como medio dipolo: \(36.5\ \Omega\).</p>
<p>Los parámetros de una antena son:</p>
<ul>
<li><b>Diagrama de radiación</b>: la intensidad \(U(\theta,\phi)=r^2\langle S\rangle\) (W/sr) normalizada. El <em>ancho de haz a media potencia</em> es el ángulo entre las direcciones en que \(U\) cae a la mitad.</li>
<li><b>Directividad</b> \(D=4\pi U_\text{máx}/P\), que compara la antena con una isótropa, y <b>ganancia</b> \(G=e\,D\), que incluye la eficiencia \(e=R_\text{rad}/(R_\text{rad}+R_\text{pérd})\). Ambas se expresan a menudo en dBi.</li>
<li><b>Área efectiva</b> en recepción: \(A_e=\dfrac{\lambda^2}{4\pi}G\). La potencia recibida es \(P_r=A_e\,S\).</li>
</ul>
<div class="eq key" data-name="Ecuación de transmisión de Friis">\[\frac{P_r}{P_t}=G_tG_r\left(\frac{\lambda}{4\pi R}\right)^2 .\]</div>
<div class="sim" data-sim="antenna-pattern" data-title="Distribución de corriente y diagrama de radiación de un dipolo de longitud L"></div>
<div class="sim-guide"><ul>
<li>Para \(L\ll\lambda\) el diagrama es \(\sen^2\theta\) y la resistencia de radiación es muy pequeña: las antenas cortas son ineficientes.</li>
<li>Hasta \(L=\lambda\) el diagrama tiene un único lóbulo que se estrecha. A partir de ahí aparecen lóbulos secundarios, y en \(L=2\lambda\) el campo se anula en el plano ecuatorial.</li>
<li>Gire el diagrama tridimensional: el dipolo radia igual en todas las direcciones del plano ecuatorial (antena omnidireccional).</li>
</ul></div>
</section>

<section>
<h2>Arreglos de antenas</h2>
<p>Varias antenas idénticas alimentadas con fases controladas interfieren y concentran la potencia en direcciones elegidas. Para \(N\) elementos a lo largo de un eje, separados \(d\), con desfase progresivo \(\alpha\) entre elementos sucesivos, el campo total es el de un elemento multiplicado por el <span class="term">factor de arreglo</span> (principio de multiplicación de diagramas):</p>
<div class="eq key" data-name="Factor de arreglo uniforme">\[AF(\gamma)=\sum_{n=0}^{N-1}e^{jn\psi}=e^{j(N-1)\psi/2}\,\frac{\sen(N\psi/2)}{\sen(\psi/2)},\qquad \psi=kd\cos\gamma+\alpha,\]</div>
<p>donde \(\gamma\) es el ángulo medido desde el eje del arreglo. El haz principal apunta donde \(\psi=0\), es decir \(\cos\gamma_0=-\alpha/kd\): con \(\alpha=0\) el haz es perpendicular al eje (arreglo <em>transversal</em>) y con \(\alpha=-kd\) sale a lo largo del eje (arreglo <em>longitudinal</em>). Variar \(\alpha\) electrónicamente permite dirigir el haz sin mover la antena: es el principio de los <em>radares de fase</em> y de las antenas de telefonía 5G. El haz se estrecha como \(\lambda/(Nd)\). Si \(d\) es demasiado grande (\(d\gt\lambda/(1+\abs{\cos\gamma_0})\)), aparecen <span class="term">lóbulos de difracción</span> tan intensos como el principal.</p>
<div class="sim" data-sim="array-factor" data-title="Arreglo de antenas: interferencia, dirección del haz y lóbulos"></div>
<div class="sim-guide"><ul>
<li>Con \(\alpha=0\) el haz es transversal; mueva el control de dirección y observe cómo los frentes de onda se inclinan.</li>
<li>Aumente \(N\): el haz se estrecha y aparecen \(N-2\) lóbulos secundarios entre los principales.</li>
<li>Con \(d\gt\lambda\) surgen lóbulos de difracción: la misma física que en una red de difracción óptica.</li>
</ul></div>
<div class="box hist"><p><b>Hertz y Marconi.</b> En 1887 Heinrich Hertz produjo y detectó ondas de unos 4 m con un dipolo alimentado por una chispa y un anillo receptor, y midió su reflexión, refracción y polarización: la confirmación experimental de Maxwell. Hertz no creía que tuvieran aplicación práctica. Catorce años después, Guglielmo Marconi transmitía señales a través del Atlántico.</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Qué potencia radia un electrón con una aceleración de \(1.0\times10^{18}\) m/s²?
<details><summary>Respuesta</summary><p>\(P=e^2a^2/(6\pi\eo c^3)=5.7\times10^{-18}\) W.</p></details></li>
<li><span class="lvl">Básico</span>Un dipolo hertziano de 1 m lleva una corriente de 10 A de amplitud a 3 MHz. Halle su resistencia de radiación y la potencia radiada.
<details><summary>Respuesta</summary><p>\(\lambda=100\) m, \(R_\text{rad}=80\pi^2(0.01)^2=0.079\ \Omega\), \(P=\tfrac12R_\text{rad}I_0^2=3.9\) W.</p></details></li>
<li><span class="lvl">Intermedio</span>Un dipolo de media onda se alimenta con 1 A de amplitud. Halle la potencia radiada y la amplitud del campo eléctrico a 10 km en el plano ecuatorial.
<details><summary>Respuesta</summary><p>\(P=36.6\) W; \(E=60I_m/r=6.0\) mV/m.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Cuántas veces más dispersa el aire la luz de 450 nm que la de 700 nm?
<details><summary>Respuesta</summary><p>\((700/450)^4=5.9\).</p></details></li>
<li><span class="lvl">Intermedio</span>Un enlace de microondas a 3 GHz usa antenas de 30 dBi, 10 W de potencia y 40 km de distancia. Halle la potencia recibida.
<details><summary>Respuesta</summary><p>\(P_r=10\cdot10^3\cdot10^3\,(0.1/4\pi\cdot4\times10^4)^2=4.0\times10^{-7}\) W \(\approx-34\) dBm.</p></details></li>
<li><span class="lvl">Avanzado</span>Un arreglo de 8 elementos con \(d=\lambda/2\) debe apuntar a \(30^\circ\) de la normal al arreglo. ¿Qué desfase progresivo necesita? ¿Aparecen lóbulos de difracción?
<details><summary>Respuesta</summary><p>\(\gamma_0=60^\circ\): \(\alpha=-kd\cos\gamma_0=-90^\circ\). No aparecen, porque \(d=0.5\lambda\lt\lambda/(1+0.5)=0.67\lambda\).</p></details></li>
<li><span class="lvl">Avanzado</span>Halle el área efectiva de un dipolo de media onda sin pérdidas a 100 MHz.
<details><summary>Respuesta</summary><p>\(A_e=1.64\,\lambda^2/4\pi=0.13\lambda^2=1.18\) m².</p></details></li>
</ol>
</section>
