<template class="chapter-src" data-id="relatividad" data-num="24" data-title="Electrodinámica y relatividad" data-part="Parte VI · Ondas y radiación" data-short="Transformación de los campos, carga en movimiento uniforme y el magnetismo como efecto relativista">
<p class="lead">Las ecuaciones de Maxwell predicen una velocidad de la luz \(c=1/\sqrt{\eo\mo}\) sin mencionar respecto a qué se mide. La relatividad especial nació de tomar esto en serio. Y la relatividad, a su vez, muestra que los campos eléctrico y magnético no son entidades separadas: son dos caras de un mismo objeto, y lo que un observador llama campo eléctrico, otro lo llama en parte magnético.</p>

<section>
<h2>Un problema de simetría</h2>
<p>El artículo de Einstein de 1905, “Sobre la electrodinámica de los cuerpos en movimiento”, empieza con un ejemplo de inducción. Si un imán se mueve cerca de un conductor en reposo, aparece un campo eléctrico inducido (ley de Faraday) que mueve las cargas. Si es el conductor el que se mueve y el imán está quieto, no hay campo eléctrico, pero las cargas sienten la fuerza magnética \(q\vb v\times\vb B\). Ambas explicaciones dan exactamente la misma corriente; sólo importa el movimiento <em>relativo</em>. Sin embargo, la física de 1905 describía los dos casos de modo completamente distinto.</p>
<p>Las ecuaciones de Maxwell no son invariantes bajo la transformación de Galileo (\(x'=x-vt\), \(t'=t\)), pero sí bajo la de <span class="term">Lorentz</span>:</p>
<div class="eq key" data-name="Transformación de Lorentz">\[x'=\gamma(x-vt),\qquad y'=y,\qquad z'=z,\qquad t'=\gamma\left(t-\frac{vx}{c^2}\right),\qquad \gamma=\frac{1}{\sqrt{1-\beta^2}},\ \beta=\frac vc .\]</div>
<p>Einstein postuló que las leyes de la física, incluidas las de Maxwell, tienen la misma forma en todos los sistemas inerciales y que \(c\) es la misma para todos. Consecuencias: dilatación del tiempo, contracción de longitudes \(L=L_0/\gamma\) y relatividad de la simultaneidad.</p>
<div class="box law"><p><b>Invariancia de la carga.</b> La carga eléctrica total de un sistema es la misma para todos los observadores inerciales. La neutralidad de los átomos con electrones rápidos y la de un gas que se calienta lo confirman con enorme precisión. La <em>densidad</em> de carga, en cambio, sí cambia: una distribución que se mueve se contrae y su densidad aumenta en un factor \(\gamma\).</p></div>
</section>

<section>
<h2>Transformación de los campos</h2>
<p>Si el sistema \(S'\) se mueve con velocidad \(\vb v\) respecto a \(S\), los campos que mide un observador en \(S'\) en un mismo punto del espacio-tiempo son:</p>
<div class="eq key" data-name="Transformación de E y B">\[\vb E'_\parallel=\vb E_\parallel,\qquad \vb B'_\parallel=\vb B_\parallel,\]
\[\vb E'_\perp=\gamma\left(\vb E+\vb v\times\vb B\right)_\perp,\qquad \vb B'_\perp=\gamma\left(\vb B-\frac{\vb v\times\vb E}{c^2}\right)_\perp ,\]</div>
<p>donde \(\parallel\) y \(\perp\) se refieren a la dirección de \(\vb v\). Para \(v\ll c\) se reducen a \(\vb E'\approx\vb E+\vb v\times\vb B\): la fuerza de Lorentz sobre una carga que se mueve es, vista desde la carga, una fuerza puramente eléctrica. Dos combinaciones no cambian:</p>
<div class="eq key" data-name="Invariantes del campo">\[\vb E\cdot\vb B=\vb E'\cdot\vb B',\qquad E^2-c^2B^2=E'^2-c^2B'^2 .\]</div>
<ul>
<li>Si \(\vb E\cdot\vb B=0\) y \(E\lt cB\), existe un sistema en el que el campo es puramente magnético; se mueve con la velocidad de deriva \(\vb v=\vb E\times\vb B/B^2\) (capítulo 13).</li>
<li>Si \(\vb E\cdot\vb B=0\) y \(E\gt cB\), existe un sistema en el que el campo es puramente eléctrico.</li>
<li>En una onda plana \(\vb E\perp\vb B\) y \(E=cB\): ambos invariantes son nulos, y la luz es “luz” para todos los observadores, aunque su amplitud y su frecuencia cambian (efecto Doppler).</li>
</ul>
<div class="sim" data-sim="field-transform" data-title="Los mismos campos vistos desde dos sistemas inerciales"></div>
<div class="sim-guide"><ul>
<li>Elija “Carga en reposo”: un observador que se mueve ve, además del campo eléctrico, un campo magnético \(\vb B'=-\gamma\,\vb v\times\vb E/c^2\).</li>
<li>Con “Campos cruzados, \(E\lt cB\)” y la velocidad de deriva, el campo eléctrico desaparece por completo.</li>
<li>Compruebe que los dos invariantes no cambian al mover la velocidad del observador.</li>
</ul></div>
</section>

<section>
<h2>Campo de una carga en movimiento uniforme</h2>
<p>En su sistema de reposo, una carga produce el campo de Coulomb. Transformando al sistema en que se mueve con velocidad \(\vb v\) (Heaviside, 1888) resulta un campo que sigue apuntando radialmente desde la posición <em>actual</em> de la carga, pero ya no es isótropo:</p>
<div class="eq key" data-name="Campo de una carga en movimiento uniforme">\[\vb E=\frac{q}{4\pi\eo}\,\frac{1-\beta^2}{\left(1-\beta^2\sen^2\theta\right)^{3/2}}\,\frac{\uv R}{R^2},\qquad \vb B=\frac{1}{c^2}\,\vb v\times\vb E ,\]</div>
<p>donde \(\vb R\) va de la posición actual de la carga al punto de observación y \(\theta\) es el ángulo entre \(\vb R\) y \(\vb v\). En la dirección del movimiento el campo se debilita en un factor \(1/\gamma^2\); en la dirección perpendicular se refuerza en un factor \(\gamma\). A velocidades cercanas a \(c\) el campo se concentra en un “disco” perpendicular a la velocidad, de semiancho angular \(\sim1/\gamma\). Por eso un protón ultrarrelativista que pasa junto a un núcleo le transmite un pulso de campo muy breve, casi como un pulso de luz. Para \(v\ll c\), \(\vb B\) se reduce a la ley de Biot–Savart para una carga puntual.</p>
<div class="sim" data-sim="moving-charge" data-title="Campo eléctrico de una carga en movimiento uniforme (contracción de Heaviside)"></div>
<div class="sim-guide"><ul>
<li>Aumente \(\beta\): las líneas se agrupan en el plano perpendicular a la velocidad.</li>
<li>La gráfica polar muestra \(E(\theta)R^2\) relativo al valor de Coulomb: vale \(\gamma\) a \(90^\circ\) y \(1/\gamma^2\) a \(0^\circ\).</li>
<li>El campo magnético forma círculos alrededor de la trayectoria, con la dirección dada por la regla de la mano derecha.</li>
</ul></div>
</section>

<section>
<h2>El magnetismo como efecto relativista</h2>
<p>Un alambre neutro conduce corriente: los iones positivos están en reposo y los electrones derivan con velocidad \(v\). Una carga de prueba \(q\) se mueve paralela al alambre con velocidad \(u\).</p>
<ul>
<li><b>En el laboratorio</b> el alambre es neutro, así que no hay fuerza eléctrica. Pero hay una corriente y un campo magnético, y la carga siente la fuerza \(F=quB=\dfrac{q\,\mo\,I\,u}{2\pi r}\).</li>
<li><b>En el sistema de la carga</b>, la carga está en reposo, así que no hay fuerza magnética. Pero los iones y los electrones se mueven con velocidades distintas, se contraen de modo distinto y el alambre deja de ser neutro. La densidad neta resulta \(\lambda'=\gamma_u\,\dfrac{uv}{c^2}\,\lambda_0\), y la fuerza eléctrica \(F'=\dfrac{q\lambda'}{2\pi\eo r}\) es exactamente \(\gamma_uF\), como exige la transformación relativista de las fuerzas transversales.</li>
</ul>
<p>Con velocidades de deriva de milímetros por segundo, \(uv/c^2\) es del orden de \(10^{-20}\): el desequilibrio de carga es minúsculo. Sin embargo, el alambre contiene del orden de \(10^{23}\) electrones por centímetro, y el resultado es una fuerza perfectamente medible. El magnetismo es el efecto relativista más cotidiano: lo vemos en cada motor eléctrico.</p>
<div class="sim" data-sim="wire-relativity" data-title="Fuerza magnética en el laboratorio, fuerza eléctrica en el sistema de la carga"></div>
<div class="sim-guide"><ul>
<li>Cambie de sistema de referencia: en \(S'\) las separaciones entre iones y entre electrones dejan de ser iguales y aparece una densidad de carga neta.</li>
<li>Con \(u=0\) no hay fuerza en ningún sistema; con \(v=0\) (sin corriente) tampoco.</li>
<li>Invierta el signo de \(u\): la fuerza cambia de atractiva a repulsiva en ambos sistemas, y siempre \(F'=\gamma_uF\).</li>
</ul></div>
</section>

<section>
<h2>Formulación covariante</h2>
<p>La relatividad agrupa las magnitudes electromagnéticas en cuadrivectores y tensores del espacio-tiempo de Minkowski (\(x^\mu=(ct,\vb r)\)): la cuadricorriente \(J^\mu=(c\rho,\vb J)\), cuya conservación es \(\partial_\mu J^\mu=0\), y el cuadripotencial \(A^\mu=(V/c,\vb A)\). Los campos forman el tensor antisimétrico \(F^{\mu\nu}=\partial^\mu A^\nu-\partial^\nu A^\mu\), cuyas componentes son \(E_i/c\) y \(B_i\), y las cuatro ecuaciones de Maxwell se reducen a dos:</p>
<div class="eq key" data-name="Maxwell en forma covariante">\[\partial_\mu F^{\mu\nu}=\mo J^\nu,\qquad \partial_\lambda F_{\mu\nu}+\partial_\mu F_{\nu\lambda}+\partial_\nu F_{\lambda\mu}=0 .\]</div>
<p>La primera contiene las leyes de Gauss y de Ampère–Maxwell; la segunda, la ausencia de monopolos y la ley de Faraday. La fuerza de Lorentz se escribe \(\dd p^\mu/\dd\tau=qF^{\mu\nu}u_\nu\). La transformación de los campos vista arriba es simplemente la regla de transformación de un tensor de rango 2, y los invariantes son \(F_{\mu\nu}F^{\mu\nu}\propto B^2-E^2/c^2\) y el pseudoescalar \(\propto\vb E\cdot\vb B\).</p>
<div class="box note"><p><b>Una teoría ya relativista.</b> A diferencia de la mecánica de Newton, que hubo que corregir, la teoría de Maxwell de 1865 ya era relativista y no necesitó ningún cambio. En cierto sentido, la relatividad especial es la descripción de la simetría que Maxwell había escrito sin saberlo.</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>En el laboratorio hay un campo magnético uniforme \(B=0.5\) T. ¿Qué campo eléctrico mide un observador que se mueve a 1000 m/s perpendicularmente a \(\vb B\)?
<details><summary>Respuesta</summary><p>\(E'\approx vB=500\) V/m, perpendicular a \(\vb v\) y a \(\vb B\) (\(\gamma\approx1\)).</p></details></li>
<li><span class="lvl">Intermedio</span>En un sistema, \(\vb E=3\times10^5\,\uv y\) V/m y \(\vb B=2\times10^{-3}\,\uv z\) T. ¿Existe un sistema donde sólo haya campo magnético? ¿Con qué velocidad se mueve?
<details><summary>Respuesta</summary><p>Sí, porque \(\vb E\cdot\vb B=0\) y \(E=3\times10^5\lt cB=6\times10^5\) V/m. \(\vb v=\vb E\times\vb B/B^2=1.5\times10^8\,\uv x\) m/s, es decir \(0.5c\). Allí \(B'=B\sqrt{1-E^2/c^2B^2}=1.73\times10^{-3}\) T.</p></details></li>
<li><span class="lvl">Intermedio</span>Un protón de 7 TeV (LHC) tiene \(\gamma\approx7460\). ¿En qué factor aumenta su campo eléctrico transversal? ¿Qué semiancho angular tiene el “disco” de campo?
<details><summary>Respuesta</summary><p>El campo transversal aumenta en \(\gamma\approx7.5\times10^3\); el semiancho angular es \(\sim1/\gamma\approx1.3\times10^{-4}\) rad \(\approx0.008^\circ\).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que \(E^2-c^2B^2\) es invariante para el caso \(\vb E=E\,\uv y\), \(\vb B=B\,\uv z\) y \(\vb v=v\,\uv x\).
<details><summary>Respuesta</summary><p>\(E'=\gamma(E-vB)\), \(B'=\gamma(B-vE/c^2)\). Entonces \(E'^2-c^2B'^2=\gamma^2\left[(E-vB)^2-(cB-vE/c)^2\right]=\gamma^2(1-v^2/c^2)(E^2-c^2B^2)=E^2-c^2B^2\).</p></details></li>
<li><span class="lvl">Avanzado</span>Un alambre de cobre con \(I=10\) A tiene electrones de deriva con \(v=0.37\) mm/s. Un electrón externo se mueve paralelo a él con \(u=10^6\) m/s. Estime el cociente \(\lambda'/\lambda_0\) en el sistema del electrón.
<details><summary>Respuesta</summary><p>\(\lambda'/\lambda_0\approx uv/c^2=(10^6\cdot3.7\times10^{-4})/(9\times10^{16})\approx4\times10^{-15}\).</p></details></li>
</ol>
</section>
