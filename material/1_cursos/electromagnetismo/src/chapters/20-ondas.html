<template class="chapter-src" data-id="ondas" data-num="20" data-title="Ondas electromagnéticas" data-part="Parte VI · Ondas y radiación" data-short="Ecuación de onda, ondas planas, energía, presión de radiación, polarización y espectro">
<p class="lead">Las ecuaciones de Maxwell predicen que los campos eléctrico y magnético pueden sostenerse mutuamente y propagarse por el vacío sin cargas ni corrientes. Esas ondas viajan a la velocidad de la luz: la luz, las ondas de radio, las microondas y los rayos X son el mismo fenómeno a distintas frecuencias.</p>

<section>
<h2>La ecuación de onda</h2>
<p>En el vacío (\(\rho_v=0\), \(\vb{J}=\vb{0}\)), tomando el rotacional de la ley de Faraday y usando Ampère–Maxwell:</p>
<div class="eq">\[\curl(\curl\vb{E})=-\pdv{}{t}(\curl\vb{B})=-\mo\eo\frac{\partial^2\vb{E}}{\partial t^2},\qquad \curl(\curl\vb{E})=\nabla(\divg\vb{E})-\lap\vb{E}=-\lap\vb{E}.\]</div>
<p>Cada componente de \(\vb{E}\) (y, del mismo modo, de \(\vb{B}\)) cumple la ecuación de onda tridimensional:</p>
<div class="eq key" data-name="Ecuación de onda y velocidad de la luz">\[\lap\vb{E}=\frac{1}{c^2}\frac{\partial^2\vb{E}}{\partial t^2},\qquad \lap\vb{B}=\frac{1}{c^2}\frac{\partial^2\vb{B}}{\partial t^2},\qquad c=\frac{1}{\sqrt{\mo\eo}}=299\,792\,458\un{m/s}.\]</div>
<p>La velocidad de la luz no depende de la frecuencia ni del movimiento de la fuente: es una constante universal (desde 1983, el metro se define a partir de ella). Sin la corriente de desplazamiento, esta deducción no sería posible.</p>
</section>

<section>
<h2>Ondas planas</h2>
<p>La solución más simple es una onda plana monocromática que viaja según \(+z\):</p>
<div class="eq key" data-name="Onda plana">\[\vb{E}=E_0\cos(kz-\omega t+\varphi)\,\uv{x},\qquad \vb{B}=\frac{E_0}{c}\cos(kz-\omega t+\varphi)\,\uv{y},\qquad \omega=ck,\ \ k=\frac{2\pi}{\lambda},\ \ c=\lambda f.\]</div>
<p>Las ecuaciones de Maxwell (no sólo la de onda) imponen propiedades adicionales:</p>
<ul>
<li><strong>Transversalidad:</strong> \(\vb{E}\) y \(\vb{B}\) son perpendiculares a la dirección de propagación (de \(\divg\vb{E}=0\) y \(\divg\vb{B}=0\)).</li>
<li><strong>Relación entre los campos:</strong> \(\vb{B}=\dfrac1c\,\uv{k}\times\vb{E}\). Los campos están en fase, son perpendiculares entre sí y \(E=cB\).</li>
<li>\(\vb{E}\times\vb{B}\) apunta en la dirección de propagación.</li>
</ul>
<p>La razón \(E/H=\sqrt{\mo/\eo}=\eta_0\approx377\ \Omega\) es la <span class="term">impedancia intrínseca del vacío</span>.</p>
<div class="sim" data-sim="plane-wave" data-title="Onda plana: campos E y B en fase y perpendiculares"></div>
<div class="sim-guide"><ul>
<li>Congele la animación: \(\vb{E}\) y \(\vb{B}\) son máximos en los mismos puntos. Una onda electromagnética no “intercambia” energía entre \(E\) y \(B\) como un circuito LC.</li>
<li>Invierta la dirección de propagación: \(\vb{B}\) cambia de sentido para que \(\vb{E}\times\vb{B}\) siga apuntando hacia donde va la onda.</li>
</ul></div>
</section>

<section>
<h2>Energía, intensidad y momento</h2>
<p>En una onda plana las densidades de energía eléctrica y magnética son iguales, \(\tfrac12\eo E^2=\tfrac{1}{2\mo}B^2\), de modo que \(u=\eo E^2\). La energía fluye a la velocidad \(c\): el vector de Poynting es \(\vb{S}=c\,u\,\uv{k}\). Promediando sobre un período (\(\langle\cos^2\rangle=\tfrac12\)) se obtiene la <span class="term">intensidad</span>:</p>
<div class="eq key" data-name="Intensidad">\[I=\langle S\rangle=\frac12c\eo E_0^2=\frac{E_0^2}{2\eta_0}=\frac{E_{\text{ef}}^2}{\eta_0}\quad[\mathrm{W/m^2}].\]</div>
<p>La onda también transporta momento lineal con densidad \(\vb{S}/c^2\). Al ser absorbida por una superficie ejerce una <span class="term">presión de radiación</span>:</p>
<div class="eq key" data-name="Presión de radiación">\[P_{\text{rad}}=\frac Ic\ \ (\text{absorción total}),\qquad P_{\text{rad}}=\frac{2I}{c}\ \ (\text{reflexión total, incidencia normal}).\]</div>
<p>La luz solar fuera de la atmósfera tiene \(I\approx1361\) W/m², con \(E_0\approx1.0\) kV/m, \(B_0\approx3.4\ \mu\)T y una presión de unos 9 µPa sobre un espejo: suficiente para impulsar velas solares y para orientar las colas de los cometas.</p>
<div class="sim" data-sim="radiation-pressure" data-title="Intensidad, amplitud de los campos y presión de radiación"></div>
</section>

<section>
<h2>Polarización</h2>
<p>La dirección de \(\vb{E}\) define la polarización. En general, la superposición de dos ondas polarizadas linealmente según \(x\) y \(y\), con amplitudes \(E_{0x}\), \(E_{0y}\) y desfase \(\delta\),</p>
<div class="eq">\[\vb{E}=E_{0x}\cos(kz-\omega t)\,\uv{x}+E_{0y}\cos(kz-\omega t+\delta)\,\uv{y},\]</div>
<p>hace que el extremo de \(\vb{E}\), en un plano fijo, describa una elipse. Si \(\delta=0\) o \(\pi\), la polarización es <em>lineal</em>; si \(E_{0x}=E_{0y}\) y \(\delta=\pm\pi/2\), es <em>circular</em>; en los demás casos, <em>elíptica</em>. La luz del Sol o de una bombilla es no polarizada: la dirección de \(\vb{E}\) cambia al azar en tiempos del orden de \(10^{-14}\) s.</p>
<div class="sim" data-sim="polarization" data-title="Polarización lineal, circular y elíptica"></div>
<div class="sim-guide"><ul>
<li>Con \(\delta=90^\circ\) y amplitudes iguales el extremo de \(\vb{E}\) describe una circunferencia; la onda completa forma una hélice en el espacio.</li>
<li>Cambie el signo de \(\delta\): la hélice cambia de sentido de giro.</li>
</ul></div>
<h3>Polarizadores y ley de Malus</h3>
<p>Un polarizador ideal transmite sólo la componente de \(\vb{E}\) paralela a su eje. Si incide luz polarizada linealmente formando un ángulo \(\theta\) con el eje, la amplitud transmitida es \(E_0\cos\theta\) y la intensidad</p>
<div class="eq key" data-name="Ley de Malus">\[I=I_0\cos^2\theta .\]</div>
<p>Con luz no polarizada, el primer polarizador transmite la mitad de la intensidad. Dos polarizadores cruzados no dejan pasar nada, pero si entre ellos se coloca un tercero a \(45^\circ\), pasa la octava parte de la intensidad inicial.</p>
<div class="sim" data-sim="malus" data-title="Cadena de polarizadores: ley de Malus"></div>
</section>

<section>
<h2>El espectro electromagnético</h2>
<p>Todas las ondas electromagnéticas obedecen las mismas ecuaciones; lo que cambia de una región a otra del espectro es la escala de longitudes y energías, y con ella la forma en que interactúan con la materia. La energía de un fotón es \(E=hf\).</p>

<section>
<h2>Las ecuaciones de Maxwell en acción</h2>
<p>La simulación siguiente no usa ninguna fórmula de ondas: resuelve numéricamente las ecuaciones de Maxwell en el plano (método de Yee, o FDTD), avanzando alternadamente \(\vb{E}\) con la ley de Ampère–Maxwell y \(\vb{B}\) con la de Faraday. Las ondas, su velocidad, la interferencia y la difracción emergen por sí solas.</p>
<div class="sim" data-sim="fdtd-waves" data-title="Ondas calculadas a partir de las ecuaciones de Maxwell (FDTD)"></div>
<div class="sim-guide"><ul>
<li>Fuente puntual: se emiten ondas cilíndricas cuya amplitud decae con la distancia porque la energía se reparte en circunferencias cada vez mayores.</li>
<li>Dos fuentes: aparecen franjas de interferencia constructiva y destructiva.</li>
<li>Rendija: con una abertura comparable a la longitud de onda, la onda se abre (difracción).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una emisora de FM transmite a 98.5 MHz. Halle su longitud de onda, \(k\) y \(\omega\).
<details><summary>Respuesta</summary><p>\(\lambda=3.04\) m; \(k=2.06\) rad/m; \(\omega=6.19\times10^8\) rad/s.</p></details></li>
<li><span class="lvl">Básico</span>Una onda tiene \(E_0=100\) V/m. Halle \(B_0\), la intensidad y la densidad media de energía.
<details><summary>Respuesta</summary><p>\(B_0=333\) nT; \(I=13.3\) W/m²; \(\langle u\rangle=I/c=44\) nJ/m³.</p></details></li>
<li><span class="lvl">Intermedio</span>Un láser de 5 mW tiene un haz de 1 mm de diámetro. Halle \(I\), \(E_0\) y la fuerza sobre un espejo que lo refleja.
<details><summary>Respuesta</summary><p>\(I=6.37\) kW/m²; \(E_0=2.19\) kV/m; \(F=2P/c=33\) pN.</p></details></li>
<li><span class="lvl">Intermedio</span>Luz no polarizada de 40 W/m² atraviesa tres polarizadores a 0°, 30° y 90°. Halle la intensidad final.
<details><summary>Respuesta</summary><p>\(20\cdot\cos^230^\circ\cdot\cos^260^\circ=3.75\) W/m².</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que \(\vb{E}=E_0\cos(kz-\omega t)\uv{x}\) y \(\vb{B}=(E_0/c)\cos(kz-\omega t)\uv{y}\) satisfacen las cuatro ecuaciones de Maxwell en el vacío si \(\omega=ck\).
<details><summary>Respuesta</summary><p>Las divergencias son nulas; \(\curl\vb{E}=-kE_0\sen(\cdot)\uv{y}=-\partial\vb{B}/\partial t\) requiere \(k=\omega/c\); análogamente para Ampère–Maxwell.</p></details></li>
<li><span class="lvl">Avanzado</span>Una vela solar perfectamente reflectante de 1 km² y 100 kg está a 1 UA del Sol. Halle su aceleración y compárela con la gravedad solar a esa distancia (\(5.9\times10^{-3}\) m/s²).
<details><summary>Respuesta</summary><p>\(F=2IA/c=9.1\) N; \(a=0.091\) m/s², unas 15 veces la atracción gravitatoria.</p></details></li>
</ol>
</section>
