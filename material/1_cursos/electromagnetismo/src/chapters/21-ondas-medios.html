<template class="chapter-src" data-id="ondas-medios" data-num="21" data-title="Ondas en medios: reflexión y refracción" data-part="Parte VI · Ondas y radiación" data-short="Índice de refracción, medios con pérdidas, profundidad de penetración, Snell, Fresnel y Brewster">
<p class="lead">Al entrar en la materia, una onda electromagnética se frena, se atenúa o se refleja según las propiedades eléctricas y magnéticas del medio. Todas las leyes de la óptica geométrica —la reflexión, la ley de Snell, la reflexión total— y la fracción de luz reflejada por un vidrio se deducen de las ecuaciones de Maxwell y sus condiciones de frontera.</p>

<section>
<h2>Ondas en dieléctricos</h2>
<p>En un medio lineal, homogéneo y sin pérdidas, basta sustituir \(\eo\) y \(\mo\) por \(\varepsilon\) y \(\mu\) en la ecuación de onda:</p>
<div class="eq key" data-name="Propagación en un dieléctrico">\[v=\frac{1}{\sqrt{\mu\varepsilon}}=\frac cn,\qquad n=\sqrt{\varepsilon_r\mu_r}\approx\sqrt{\varepsilon_r},\qquad \eta=\sqrt{\frac\mu\varepsilon}=\frac{\eta_0}{n},\qquad \lambda=\frac{\lambda_0}{n}.\]</div>
<p>La frecuencia no cambia al pasar de un medio a otro (la fijan las condiciones de continuidad en la frontera, que deben cumplirse en todo instante); cambian la velocidad, la longitud de onda y la relación entre \(E\) y \(H\). Como \(\varepsilon_r\) depende de la frecuencia, también \(n\) depende de ella (<span class="term">dispersión</span>): por eso un prisma separa los colores. Para el agua, \(\varepsilon_r=80\) en estática pero \(n=1.33\) en el visible.</p>
</section>

<section>
<h2>Medios con pérdidas y conductores</h2>
<p>En un medio de conductividad \(\sigma\), la ley de Ampère–Maxwell incluye \(\vb{J}=\sigma\vb{E}\). Para una onda \(e^{j(\omega t-\gamma z)}\) resulta un número de onda complejo:</p>
<div class="eq key" data-name="Constante de propagación">\[\tilde k=\beta-j\alpha,\qquad \tilde k^2=\omega^2\mu\varepsilon\left(1-j\frac{\sigma}{\omega\varepsilon}\right),\qquad E(z,t)=E_0e^{-\alpha z}\cos(\omega t-\beta z).\]</div>
<p>La <span class="term">tangente de pérdidas</span> \(\sigma/\omega\varepsilon\) compara la corriente de conducción con la de desplazamiento. En un <em>buen conductor</em> (\(\sigma\gg\omega\varepsilon\)):</p>
<div class="eq key" data-name="Profundidad de penetración">\[\alpha=\beta=\sqrt{\pi f\mu\sigma},\qquad \delta=\frac1\alpha=\sqrt{\frac{2}{\omega\mu\sigma}}.\]</div>
<p>La onda se atenúa en un factor \(e\) cada <span class="term">profundidad de penetración</span> \(\delta\), y en el conductor \(\vb{H}\) va \(45^\circ\) retrasado respecto de \(\vb{E}\). En el cobre, \(\delta=8.5\) mm a 60 Hz, 66 µm a 1 MHz y 0.66 µm a 10 GHz: las corrientes de alta frecuencia circulan sólo por la “piel” de los conductores (efecto pelicular). El agua de mar (\(\sigma\approx4\) S/m) tiene \(\delta\approx25\) cm a 1 kHz: por eso los submarinos se comunican con ondas de muy baja frecuencia.</p>
<div class="sim" data-sim="lossy-medium" data-title="Atenuación en un medio con pérdidas y profundidad de penetración"></div>
<div class="sim-guide"><ul>
<li>En un buen conductor la onda desaparece en pocas profundidades de penetración; su longitud de onda interior es \(2\pi\delta\).</li>
<li>Aumente la frecuencia: \(\delta\) disminuye como \(1/\sqrt f\) (pendiente −1/2 en la gráfica logarítmica).</li>
<li>En un dieléctrico con pocas pérdidas la tangente de pérdidas es muy pequeña y la onda recorre muchas longitudes de onda antes de atenuarse.</li>
</ul></div>
</section>

<section>
<h2>Incidencia normal sobre una frontera</h2>
<p>Una onda que viaja en el medio 1 incide perpendicularmente sobre el medio 2. Las condiciones de continuidad de \(\vb{E}_t\) y \(\vb{H}_t\) (sin corrientes superficiales) dan los coeficientes de amplitud:</p>
<div class="eq key" data-name="Coeficientes de reflexión y transmisión">\[r=\frac{E_r}{E_i}=\frac{\eta_2-\eta_1}{\eta_2+\eta_1},\qquad t=\frac{E_t}{E_i}=\frac{2\eta_2}{\eta_2+\eta_1}=1+r .\]</div>
<p>Para medios no magnéticos, \(r=\dfrac{n_1-n_2}{n_1+n_2}\). La fracción de potencia reflejada es \(R=r^2\) y la transmitida \(T=\dfrac{n_2}{n_1}t^2\), con \(R+T=1\). Del aire al vidrio (\(n=1.5\)), \(r=-0.2\): se refleja el 4 % y la onda reflejada se invierte. Sobre un conductor perfecto, \(\eta_2=0\) y \(r=-1\): toda la onda se refleja y la superposición forma una <span class="term">onda estacionaria</span> con nodos de \(\vb{E}\) cada \(\lambda/2\), el primero en la superficie. En general, la razón de onda estacionaria es \(\text{ROE}=\dfrac{1+\abs r}{1-\abs r}\).</p>
<div class="sim" data-sim="normal-incidence" data-title="Incidencia normal: ondas incidente, reflejada, transmitida y estacionaria"></div>
<div class="sim-guide"><ul>
<li>Con \(n_2\gt n_1\) la onda reflejada tiene fase invertida (\(r\lt0\)); con \(n_2\lt n_1\), no.</li>
<li>Elija el conductor perfecto: la envolvente del campo total muestra nodos fijos separados \(\lambda/2\).</li>
<li>En el medio 2 la longitud de onda es \(n_1/n_2\) veces la del medio 1.</li>
</ul></div>
</section>

<section>
<h2>Incidencia oblicua: leyes de Snell</h2>
<p>Para una onda que incide con ángulo \(\theta_i\) (medido desde la normal), las condiciones de frontera deben cumplirse en todos los puntos de la superficie y en todo instante. Eso obliga a que las fases de las tres ondas coincidan a lo largo de la frontera: las componentes tangenciales de los vectores de onda son iguales. Resultan:</p>
<div class="eq key" data-name="Reflexión y refracción">\[\theta_r=\theta_i,\qquad n_1\sen\theta_i=n_2\sen\theta_t\quad(\text{ley de Snell}).\]</div>
<p>Si \(n_1\gt n_2\), existe un <span class="term">ángulo crítico</span> \(\theta_c=\arcsen(n_2/n_1)\) por encima del cual no hay onda transmitida propagante: <span class="term">reflexión total interna</span>. En el medio 2 queda una onda evanescente que decae exponencialmente en unas pocas longitudes de onda. En ella se basan las fibras ópticas.</p>
</section>

<section>
<h2>Ecuaciones de Fresnel y ángulo de Brewster</h2>
<p>La amplitud reflejada depende de la polarización. Para \(\vb{E}\) perpendicular al plano de incidencia (polarización <em>s</em> o TE) y paralelo a él (polarización <em>p</em> o TM), en medios no magnéticos:</p>
<div class="eq key" data-name="Ecuaciones de Fresnel">\[r_s=\frac{n_1\cos\theta_i-n_2\cos\theta_t}{n_1\cos\theta_i+n_2\cos\theta_t},\qquad r_p=\frac{n_2\cos\theta_i-n_1\cos\theta_t}{n_2\cos\theta_i+n_1\cos\theta_t},\]
\[R=\abs r^2,\qquad T=1-R .\]</div>
<p>(El signo de \(r_p\) depende de la convención elegida para los sentidos de los campos; \(R_p\) no.) Para la polarización <em>p</em> existe un ángulo en el que no hay reflexión: el <span class="term">ángulo de Brewster</span>,</p>
<div class="eq">\[\tan\theta_B=\frac{n_2}{n_1},\qquad \theta_B+\theta_t=90^\circ .\]</div>
<p>Luz no polarizada que se refleja a ese ángulo queda completamente polarizada <em>s</em>: por eso las gafas polarizadas eliminan los reflejos del agua y del asfalto. Físicamente, los dipolos del medio 2 oscilan en la dirección en que deberían radiar la onda reflejada, y un dipolo no radia a lo largo de su eje.</p>
<div class="sim" data-sim="fresnel" data-title="Reflectancia y transmitancia en función del ángulo (Fresnel)"></div>
<div class="sim-guide"><ul>
<li>Del aire al vidrio: \(R_p\) se anula en \(\theta_B=56.3^\circ\); a incidencia rasante ambas reflectancias tienden a 1.</li>
<li>Del vidrio al aire: por encima de \(\theta_c=41.8^\circ\) toda la luz se refleja.</li>
<li>El diagrama de rayos dibuja cada rayo con un grosor proporcional a su potencia.</li>
</ul></div>
<div class="sim" data-sim="fdtd-refraction" data-title="Refracción y reflexión total calculadas con las ecuaciones de Maxwell (FDTD)"></div>
<div class="sim-guide"><ul>
<li>Observe que la longitud de onda se acorta en el medio más denso y que el haz se desvía según la ley de Snell.</li>
<li>Invierta los medios y aumente el ángulo por encima del crítico: el haz se refleja por completo y en el segundo medio sólo queda un campo evanescente pegado a la frontera.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Luz de 600 nm (en el vacío) entra en vidrio de \(n=1.5\). Halle su velocidad, longitud de onda y frecuencia en el vidrio.
<details><summary>Respuesta</summary><p>\(v=2.0\times10^8\) m/s; \(\lambda=400\) nm; \(f=500\) THz (sin cambio).</p></details></li>
<li><span class="lvl">Básico</span>¿Qué fracción de la luz se refleja al incidir normalmente del aire al agua (\(n=1.33\))? ¿Y al diamante (\(n=2.42\))?
<details><summary>Respuesta</summary><p>Agua: 2.0 %; diamante: 17.2 %.</p></details></li>
<li><span class="lvl">Intermedio</span>Halle la profundidad de penetración en el aluminio (\(\sigma=3.5\times10^7\) S/m) a 1 MHz y a 1 GHz.
<details><summary>Respuesta</summary><p>85 µm y 2.7 µm.</p></details></li>
<li><span class="lvl">Intermedio</span>Halle el ángulo de Brewster y el ángulo crítico entre agua (\(n=1.33\)) y aire.
<details><summary>Respuesta</summary><p>Del aire al agua \(\theta_B=53.1^\circ\); del agua al aire \(\theta_B=36.9^\circ\) y \(\theta_c=48.8^\circ\).</p></details></li>
<li><span class="lvl">Avanzado</span>Una fibra óptica tiene núcleo de \(n_1=1.48\) y revestimiento de \(n_2=1.46\). Halle el ángulo crítico y la apertura numérica \(\sqrt{n_1^2-n_2^2}\).
<details><summary>Respuesta</summary><p>\(\theta_c=80.6^\circ\); AN = 0.242, que corresponde a un ángulo de aceptación de \(14.0^\circ\) en el aire.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que en incidencia normal \(R+T=1\) con \(R=r^2\) y \(T=(n_2/n_1)t^2\).
<details><summary>Respuesta</summary><p>\(\left(\frac{n_1-n_2}{n_1+n_2}\right)^2+\frac{n_2}{n_1}\left(\frac{2n_1}{n_1+n_2}\right)^2=\frac{(n_1-n_2)^2+4n_1n_2}{(n_1+n_2)^2}=1\).</p></details></li>
</ol>
</section>
