<template class="chapter-src" data-id="fuerza-magnetica" data-num="13" data-title="Campo magnético y fuerza de Lorentz" data-part="Parte IV · Magnetostática" data-short="Fuerza sobre cargas y corrientes, movimiento ciclotrónico, espectrómetro, efecto Hall y torque en espiras">
<p class="lead">Una carga en movimiento siente, además de la fuerza eléctrica, una fuerza perpendicular a su velocidad que depende del campo magnético. Esa fuerza no realiza trabajo pero curva las trayectorias: con ella funcionan los aceleradores de partículas, los espectrómetros de masas, los motores eléctricos y los sensores de efecto Hall.</p>

<section>
<h2>La fuerza de Lorentz</h2>
<p>Los experimentos muestran que sobre una carga \(q\) que se mueve con velocidad \(\vb{v}\) actúa, además de \(q\vb{E}\), una fuerza proporcional a \(q\), a \(v\) y perpendicular a \(\vb{v}\). Esa fuerza define el campo magnético \(\vb{B}\):</p>
<div class="eq key" data-name="Fuerza de Lorentz">\[\vb{F}=q\left(\vb{E}+\vb{v}\times\vb{B}\right),\qquad \abs{\vb{F}_B}=\abs{q}vB\sen\theta .\]</div>
<p>La unidad de \(\vb{B}\) es el tesla: \(1\un{T}=1\un{N/(A\,m)}\). También se usa el gauss, \(1\un{G}=10^{-4}\un{T}\). Propiedades esenciales de la fuerza magnética:</p>
<ul>
<li>Es perpendicular a \(\vb{v}\) y a \(\vb{B}\) (regla de la mano derecha para \(q\gt0\); invertida para \(q\lt0\)).</li>
<li>Es nula si la carga está en reposo o se mueve paralela a \(\vb{B}\).</li>
<li><strong>No realiza trabajo</strong>: \(\vb{F}_B\cdot\vb{v}=0\). Puede cambiar la dirección de la velocidad pero no su módulo ni la energía cinética.</li>
</ul>
<div class="tablewrap narrow"><table>
<tr><th>Fuente</th><th class="c">\(B\) aproximado</th></tr>
<tr><td>Espacio interestelar</td><td class="c num">\(10^{-10}\) T</td></tr>
<tr><td>Campo terrestre en la superficie</td><td class="c num">\(3\) a \(6\times10^{-5}\) T</td></tr>
<tr><td>Imán de nevera</td><td class="c num">\(5\times10^{-3}\) T</td></tr>
<tr><td>Imán de neodimio</td><td class="c num">\(1\) T</td></tr>
<tr><td>Resonancia magnética clínica</td><td class="c num">\(1.5\) a \(3\) T</td></tr>
<tr><td>Imanes superconductores del LHC</td><td class="c num">\(8.3\) T</td></tr>
<tr><td>Superficie de una estrella de neutrones</td><td class="c num">\(10^{8}\) T</td></tr>
</table></div>
<p>Las líneas de campo magnético se dibujan con las mismas reglas que las eléctricas, con una diferencia fundamental: nunca empiezan ni terminan, porque no existen cargas magnéticas aisladas (\(\divg\vb{B}=0\)). Salen del polo norte de un imán y entran por el sur, y se cierran por dentro del imán.</p>
</section>

<section>
<h2>Movimiento de una carga en un campo uniforme</h2>
<p>Si \(\vb{v}\perp\vb{B}\), la fuerza tiene módulo constante y es siempre perpendicular a la velocidad: el movimiento es circular uniforme. Igualando \(\abs{q}vB=mv^2/r\):</p>
<div class="eq key" data-name="Movimiento ciclotrónico">\[r=\frac{mv}{\abs{q}B},\qquad \omega_c=\frac{\abs{q}B}{m},\qquad T=\frac{2\pi m}{\abs{q}B}.\]</div>
<p>La <span class="term">frecuencia de ciclotrón</span> no depende de la velocidad: partículas más rápidas describen círculos mayores en el mismo tiempo (mientras \(v\ll c\)). Para un protón en 1 T, \(f_c=15.2\) MHz; para un electrón en el campo terrestre, unos 1.4 MHz.</p>
<p>Si \(\vb{v}\) tiene una componente \(v_\parallel\) a lo largo de \(\vb{B}\), ésta no cambia: la trayectoria es una <span class="term">hélice</span> de radio \(mv_\perp/\abs{q}B\) y paso \(p=2\pi mv_\parallel/\abs{q}B\). En campos no uniformes, las partículas pueden quedar atrapadas entre dos regiones de campo intenso (botella magnética), como en los cinturones de Van Allen.</p>
<h3>Campos eléctrico y magnético cruzados</h3>
<p>Con \(\vb{E}\perp\vb{B}\) y la partícula inicialmente en reposo, la trayectoria es una cicloide; en general, el centro de la órbita se desplaza con la <span class="term">velocidad de deriva</span></p>
<div class="eq">\[\vb{v}_D=\frac{\vb{E}\times\vb{B}}{B^2},\]</div>
<p>que es la misma para cargas positivas y negativas y no depende de la masa. Una componente de \(\vb{E}\) paralela a \(\vb{B}\) acelera la partícula a lo largo del campo.</p>
<div class="sim" data-sim="lorentz-3d" data-title="Trayectorias en campos eléctricos y magnéticos uniformes"></div>
<div class="sim-guide"><ul>
<li>Con \(E=0\) y velocidad perpendicular a \(\vb{B}\): círculo. Incline la velocidad: hélice. Compare el período medido con \(2\pi m/\abs{q}B\).</li>
<li>Cambie a electrón: gira en sentido contrario. El radio cambia en el factor \(m_p/m_e\) si la velocidad es la misma.</li>
<li>Active \(\vb{E}\perp\vb{B}\): la órbita deriva en la dirección de \(\vb{E}\times\vb{B}\) con velocidad \(E/B\), para ambos signos de carga.</li>
</ul></div>
</section>

<section>
<h2>Aplicaciones: selector de velocidades, espectrómetro y ciclotrón</h2>
<h3>Selector de velocidades</h3>
<p>En una región con \(\vb{E}\perp\vb{B}\), ambos perpendiculares a la velocidad del haz, la fuerza neta es nula sólo para las partículas con \(qE=qvB\):</p>
<div class="eq">\[v=\frac EB .\]</div>
<p>Las más rápidas se desvían en un sentido y las más lentas en el otro; una rendija a la salida deja pasar sólo las de la velocidad elegida.</p>
<h3>Espectrómetro de masas</h3>
<p>Tras el selector, los iones entran en un campo \(B'\) donde describen semicírculos de radio \(r=mv/(qB')\). Como \(v\) es fija, el punto de impacto mide la razón \(m/q\):</p>
<div class="eq key" data-name="Espectrómetro de Bainbridge">\[\frac mq=\frac{rB'B}{E}.\]</div>
<p>Así se descubrieron los isótopos y así se mide hoy la composición de muestras en química, geología y medicina.</p>
<div class="sim" data-sim="mass-spectrometer" data-title="Espectrómetro de masas con selector de velocidades"></div>
<div class="sim-guide"><ul>
<li>Ajuste \(E\) y \(B\): sólo pasan los iones con \(v=E/B\) (los demás chocan con las placas).</li>
<li>Los isótopos se separan en la placa detectora en proporción a su masa: compare la separación entre \(^{12}\)C y \(^{13}\)C con la de \(^{235}\)U y \(^{238}\)U.</li>
</ul></div>
<h3>El ciclotrón</h3>
<p>Dos electrodos huecos en forma de “D” están dentro de un campo magnético uniforme. Una tensión alterna de frecuencia \(f_c=qB/2\pi m\) acelera a la partícula cada vez que cruza el espacio entre ellos. Como el período no depende de la velocidad, la partícula siempre llega en fase y describe una espiral de radio creciente hasta salir con</p>
<div class="eq">\[K_{\max}=\frac{q^2B^2R^2}{2m},\]</div>
<p>donde \(R\) es el radio de las “D”. A energías relativistas el período aumenta y hay que ajustar la frecuencia (sincrociclotrón).</p>
<div class="sim" data-sim="cyclotron" data-title="Ciclotrón"></div>
</section>

<section>
<h2>Efecto Hall</h2>
<p>Una lámina de espesor \(t\) conduce una corriente \(I\) en un campo \(\vb{B}\) perpendicular. La fuerza magnética desvía los portadores hacia una cara; allí se acumula carga hasta que el campo eléctrico transversal equilibra la fuerza magnética, \(qE_H=qv_dB\). La diferencia de potencial transversal es la <span class="term">tensión de Hall</span>:</p>
<div class="eq key" data-name="Tensión de Hall">\[V_H=\frac{IB}{nqt},\qquad R_H=\frac{1}{nq}.\]</div>
<p>El signo de \(V_H\) revela el signo de los portadores (en algunos metales y en los semiconductores tipo p resultan ser “huecos” positivos) y su valor, la densidad \(n\). Como \(n\) es pequeña en los semiconductores, \(V_H\) es grande en ellos: las sondas de Hall son los magnetómetros más comunes.</p>
<div class="sim" data-sim="hall-effect" data-title="Efecto Hall en una lámina conductora"></div>
</section>

<section>
<h2>Fuerza sobre un conductor con corriente</h2>
<p>La fuerza sobre los portadores de un tramo de hilo de longitud \(\dd\vb{l}\) es \(\dd\vb{F}=(nqA\,\dd l)\,\vb{v}_d\times\vb{B}=I\,\dd\vb{l}\times\vb{B}\):</p>
<div class="eq key" data-name="Fuerza sobre una corriente">\[\dd\vb{F}=I\,\dd\vb{l}\times\vb{B},\qquad \vb{F}=I\vb{L}\times\vb{B}\ \ (\text{tramo recto en campo uniforme}).\]</div>
<p>En un campo uniforme, la fuerza sobre un hilo curvo entre dos puntos \(a\) y \(b\) es la misma que sobre un hilo recto de \(a\) a \(b\): \(\vb{F}=I\left(\int_a^b\dd\vb{l}\right)\times\vb{B}\). En consecuencia, la fuerza neta sobre cualquier espira cerrada en un campo uniforme es cero.</p>
</section>

<section>
<h2>Torque sobre una espira y momento magnético</h2>
<p>Aunque la fuerza neta sea nula, sobre una espira en un campo uniforme actúa un par. Para una espira rectangular de lados \(a\) y \(b\) con \(N\) vueltas, las fuerzas sobre los lados de longitud \(a\) forman un par de brazo \(b\sen\theta\):</p>
<div class="eq key" data-name="Momento magnético, torque y energía">\[\vb{m}=NIA\,\uv{n},\qquad \boldsymbol{\tau}=\vb{m}\times\vb{B},\qquad U=-\vb{m}\cdot\vb{B}.\]</div>
<p>\(\uv{n}\) se orienta con la regla de la mano derecha según el sentido de la corriente. El resultado vale para espiras planas de cualquier forma. El torque tiende a alinear \(\vb{m}\) con \(\vb{B}\), exactamente como el dipolo eléctrico del capítulo 5. En un <span class="term">motor de corriente continua</span> un conmutador invierte la corriente cada media vuelta para que el torque mantenga siempre el mismo sentido de giro.</p>
<div class="sim" data-sim="loop-torque" data-title="Espira en un campo magnético: torque y motor de corriente continua"></div>
<div class="sim-guide"><ul>
<li>Sin conmutador, la espira oscila alrededor de la posición en que \(\vb{m}\parallel\vb{B}\) (mínimo de energía).</li>
<li>Con conmutador, el torque medio es positivo y la espira gira continuamente: es un motor. El rozamiento limita la velocidad final.</li>
</ul></div>
</section>

<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un protón se mueve a \(3\times10^6\) m/s perpendicular a un campo de 0.5 T. Halle la fuerza, el radio y el período.
<details><summary>Respuesta</summary><p>\(F=2.40\times10^{-13}\) N; \(r=6.27\) cm; \(T=131\) ns.</p></details></li>
<li><span class="lvl">Básico</span>Un hilo de 20 cm con 5 A forma \(30^\circ\) con un campo de 0.8 T. Halle la fuerza.
<details><summary>Respuesta</summary><p>\(F=ILB\sen30^\circ=0.40\) N.</p></details></li>
<li><span class="lvl">Intermedio</span>Un electrón entra con \(2\times10^6\) m/s formando \(60^\circ\) con un campo de 1 mT. Halle el radio y el paso de la hélice.
<details><summary>Respuesta</summary><p>\(r=mv\sen60^\circ/eB=9.85\) mm; \(p=2\pi mv\cos60^\circ/eB=35.7\) mm.</p></details></li>
<li><span class="lvl">Intermedio</span>En un selector con \(E=2\times10^4\) V/m y \(B=0.1\) T entran iones de \(^{20}\)Ne\(^+\) y \(^{22}\)Ne\(^+\) que luego giran en \(B'=0.2\) T. Halle la separación de los impactos.
<details><summary>Respuesta</summary><p>\(v=2\times10^5\) m/s; diámetros \(2mv/qB'\): 41.4 cm y 45.6 cm; separación 4.1 cm.</p></details></li>
<li><span class="lvl">Intermedio</span>Un ciclotrón tiene \(B=1.5\) T y radio 0.5 m. Halle la frecuencia y la energía máxima para protones.
<details><summary>Respuesta</summary><p>\(f=22.9\) MHz; \(K=26.9\) MeV.</p></details></li>
<li><span class="lvl">Avanzado</span>Una tira de cobre de 0.1 mm de espesor lleva 5 A en un campo de 1 T. Halle la tensión de Hall (\(n=8.5\times10^{28}\) m⁻³).
<details><summary>Respuesta</summary><p>\(V_H=IB/(net)=3.7\ \mu\)V.</p></details></li>
<li><span class="lvl">Avanzado</span>Una bobina circular de 100 vueltas y radio 2 cm lleva 0.2 A en un campo de 0.3 T. Halle el torque máximo y el trabajo para girarla de la orientación estable a la inestable.
<details><summary>Respuesta</summary><p>\(m=NI\pi r^2=0.0251\) A·m²; \(\tau_{\max}=7.54\) mN·m; \(W=2mB=15.1\) mJ.</p></details></li>
</ol>
