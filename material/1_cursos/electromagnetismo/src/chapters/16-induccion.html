<template class="chapter-src" data-id="induccion" data-num="16" data-title="Inducción electromagnética" data-part="Parte V · Electrodinámica" data-short="Flujo magnético, ley de Faraday, ley de Lenz, fem de movimiento, generadores y corrientes de Foucault">
<p class="lead">En 1831 Faraday descubrió que un campo magnético variable produce una corriente en un circuito cercano. Es el principio de los generadores que abastecen la red eléctrica, de los transformadores, de las cocinas de inducción y de los lectores de tarjetas. Con él, los campos eléctrico y magnético dejan de ser independientes.</p>

<section>
<h2>Flujo magnético</h2>
<p>El flujo del campo magnético a través de una superficie \(S\) limitada por un circuito es</p>
<div class="eq key" data-name="Flujo magnético">\[\Phi_B=\int_S\vb{B}\cdot\dd\vb{A}\qquad[1\un{Wb}=1\un{T\,m^2}].\]</div>
<p>Como \(\divg\vb{B}=0\), el flujo es el mismo para todas las superficies que comparten el mismo borde; depende sólo del circuito. Para una espira plana de área \(A\) en un campo uniforme, \(\Phi_B=BA\cos\theta\).</p>
</section>

<section>
<h2>Ley de Faraday y ley de Lenz</h2>
<p>Faraday observó corriente inducida al mover un imán respecto de una bobina, al acercar o alejar un circuito con corriente y al conectar o desconectar ese circuito; nunca con los objetos quietos y las corrientes constantes. Todas las situaciones tienen en común un cambio de flujo:</p>
<div class="eq key" data-name="Ley de Faraday">\[\mathcal{E}=-\odv{\Phi_B}{t},\qquad \mathcal{E}=-N\odv{\Phi_B}{t}\ \ (N\text{ espiras}).\]</div>
<p>El flujo puede cambiar porque cambia \(B\), porque cambia el área o porque cambia la orientación. El signo menos es la <span class="term">ley de Lenz</span>: <em>la corriente inducida circula en el sentido que se opone al cambio de flujo que la produce</em>. Si el flujo aumenta, la corriente inducida crea un campo opuesto; si disminuye, lo refuerza. Es una consecuencia de la conservación de la energía: si la corriente inducida favoreciera el cambio, se tendría un movimiento perpetuo.</p>
<div class="sim" data-sim="magnet-coil" data-title="Imán que atraviesa una bobina: flujo y fem inducida"></div>
<div class="sim-guide"><ul>
<li>Al acercar el polo norte el flujo aumenta y la fem es negativa (convención del sentido positivo indicado); al alejarlo cambia de signo.</li>
<li>La fem es máxima donde el flujo cambia más rápido, no donde es máximo. En el centro de la bobina el flujo es máximo y la fem, cero.</li>
<li>Mueva el imán más rápido: la fem crece en proporción a la velocidad, pero el área bajo la curva, \(\int\mathcal{E}\,\dd t=-\Delta\Phi\), es la misma.</li>
</ul></div>
</section>

<section>
<h2>Fem de movimiento</h2>
<p>Una barra conductora de longitud \(l\) se desliza con velocidad \(\vb{v}\) sobre dos rieles en un campo \(\vb{B}\) perpendicular. La fuerza magnética sobre los portadores de la barra, \(q\vb{v}\times\vb{B}\), los empuja a lo largo de ella: actúa como una fuente de</p>
<div class="eq key" data-name="Fem de movimiento">\[\mathcal{E}=Blv,\qquad \mathcal{E}=\oint(\vb{v}\times\vb{B})\cdot\dd\vb{l}.\]</div>
<p>El mismo resultado sale de Faraday: el área del circuito crece a razón \(lv\) y \(\dd\Phi/\dd t=Blv\). Si el circuito tiene resistencia \(R\), circula \(I=Blv/R\) y la barra sufre una fuerza \(F=IlB=B^2l^2v/R\) opuesta a su movimiento (Lenz). Para mantener la velocidad hay que empujar con esa fuerza; la potencia mecánica \(Fv=B^2l^2v^2/R\) es exactamente la potencia eléctrica \(I^2R\) disipada: es un generador. Si se empuja con una fuerza constante \(F\), la barra alcanza la velocidad terminal \(v_t=FR/(B^2l^2)\).</p>
<div class="sim" data-sim="sliding-bar" data-title="Barra deslizante sobre rieles: generador elemental"></div>
<div class="sim-guide"><ul>
<li>Aplique una fuerza constante: la velocidad tiende exponencialmente a \(v_t\) con constante de tiempo \(mR/(B^2l^2)\).</li>
<li>Con fuerza nula y velocidad inicial, la barra frena: toda su energía cinética termina como calor en el resistor.</li>
<li>El balance de potencias \(P_{\text{mec}}=P_{\text{eléc}}+\dd K/\dd t\) se cumple en cada instante.</li>
</ul></div>
</section>

<section>
<h2>Generadores</h2>
<p>Una bobina de \(N\) espiras y área \(A\) que gira con velocidad angular \(\omega\) en un campo uniforme tiene flujo \(\Phi=NBA\cos\omega t\) y genera</p>
<div class="eq key" data-name="Generador de corriente alterna">\[\mathcal{E}(t)=NBA\omega\,\sen\omega t,\qquad \mathcal{E}_{\max}=NBA\omega .\]</div>
<p>Con anillos rozantes, la tensión en los terminales es alterna (alternador). Con un conmutador de dos segmentos, que invierte las conexiones cada media vuelta, la tensión es siempre del mismo signo aunque pulsante (dínamo de corriente continua). Un motor de corriente continua es la misma máquina funcionando al revés; cuando gira también genera una “fuerza contraelectromotriz” que limita la corriente.</p>
<div class="sim" data-sim="ac-generator" data-title="Generador: bobina que gira en un campo magnético"></div>
</section>

<section>
<h2>El campo eléctrico inducido</h2>
<p>Si el circuito está en reposo y lo que cambia es \(\vb{B}\), no hay fuerza magnética sobre los portadores. Lo que los mueve es un <span class="term">campo eléctrico inducido</span> por el campo magnético variable, que existe haya o no un conductor:</p>
<div class="eq key" data-name="Faraday en forma integral y diferencial">\[\oint_C\vb{E}\cdot\dd\vb{l}=-\odv{}{t}\int_S\vb{B}\cdot\dd\vb{A},\qquad \curl\vb{E}=-\pdv{\vb{B}}{t}.\]</div>
<p>Este campo no es conservativo: su circulación no es cero y no puede escribirse como \(-\nabla V\). Sus líneas son cerradas, como las del campo magnético. Dentro de un solenoide largo de radio \(R\) cuyo campo varía a razón \(\dd B/\dd t\), por simetría las líneas son circunferencias y</p>
<div class="eq">\[E=\frac r2\left|\odv Bt\right|\ \ (r\lt R),\qquad E=\frac{R^2}{2r}\left|\odv Bt\right|\ \ (r\gt R).\]</div>
<p>Fuera del solenoide \(\vb{B}=\vb{0}\) pero \(\vb{E}\ne\vb{0}\). El betatrón acelera electrones en una órbita circular con este campo.</p>
<div class="sim" data-sim="induced-efield" data-title="Campo eléctrico inducido por un solenoide con corriente variable"></div>
<div class="sim-guide"><ul>
<li>Las líneas de \(\vb{E}\) son circunferencias cerradas: no nacen ni mueren en cargas.</li>
<li>Invierta el signo de \(\dd B/\dd t\): el sentido de \(\vb{E}\) se invierte (Lenz).</li>
</ul></div>
</section>

<section>
<h2>Corrientes de Foucault</h2>
<p>En un bloque conductor extenso que se mueve en un campo magnético no uniforme, o que está en un campo variable, se inducen corrientes en remolino (<span class="term">corrientes de Foucault</span>). Por la ley de Lenz, frenan el movimiento relativo y disipan energía como calor. Se aprovechan en frenos magnéticos de trenes, en detectores de metales y en las cocinas de inducción; se evitan en los núcleos de transformadores construyéndolos con láminas aisladas entre sí.</p>
<div class="sim" data-sim="eddy-brake" data-title="Freno por corrientes de Foucault: péndulo con placa metálica"></div>
<div class="sim-guide"><ul>
<li>La placa maciza se detiene en pocas oscilaciones al atravesar el campo; la ranurada casi no se frena porque las ranuras interrumpen los remolinos.</li>
<li>La fuerza de frenado es proporcional a \(B^2\): duplicar el campo cuadruplica el amortiguamiento.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una bobina de 200 espiras y 10 cm² está en un campo que pasa de 0 a 0.5 T en 0.1 s. Halle la fem media.
<details><summary>Respuesta</summary><p>\(\mathcal{E}=NA\Delta B/\Delta t=1.0\) V.</p></details></li>
<li><span class="lvl">Básico</span>Una barra de 50 cm se mueve a 4 m/s en un campo de 0.3 T sobre rieles unidos por 2 Ω. Halle la fem, la corriente y la fuerza necesaria para mantener la velocidad.
<details><summary>Respuesta</summary><p>\(\mathcal{E}=0.6\) V; \(I=0.3\) A; \(F=IlB=0.045\) N.</p></details></li>
<li><span class="lvl">Intermedio</span>Un generador de 100 espiras de 0.02 m² gira a 60 Hz en un campo de 0.25 T. Halle la fem máxima y la eficaz.
<details><summary>Respuesta</summary><p>\(\mathcal{E}_{\max}=NBA\omega=188\) V; \(\mathcal{E}_{\text{ef}}=133\) V.</p></details></li>
<li><span class="lvl">Intermedio</span>El campo de un solenoide de radio 3 cm aumenta a razón de 0.2 T/s. Halle \(E\) a 1 cm y a 6 cm del eje.
<details><summary>Respuesta</summary><p>\(E(1\text{ cm})=1.0\) mV/m; \(E(6\text{ cm})=R^2\dot B/2r=1.5\) mV/m.</p></details></li>
<li><span class="lvl">Avanzado</span>Una espira cuadrada de lado \(a\) y resistencia \(R\) sale con velocidad constante \(v\) de una región con campo uniforme \(B\). Halle la corriente y la energía disipada.
<details><summary>Respuesta</summary><p>\(I=Bav/R\) mientras sale; \(W=I^2R\cdot(a/v)=B^2a^3v/R\).</p></details></li>
<li><span class="lvl">Avanzado</span>En la barra deslizante con fuerza constante \(F\), demuestre que \(v(t)=v_t\left(1-e^{-t/\tau}\right)\) con \(\tau=mR/(B^2l^2)\).
<details><summary>Respuesta</summary><p>\(m\dot v=F-\frac{B^2l^2}{R}v\), ecuación lineal de primer orden con solución exponencial.</p></details></li>
</ol>
</section>
