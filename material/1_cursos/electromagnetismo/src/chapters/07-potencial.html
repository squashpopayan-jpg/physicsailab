<template class="chapter-src" data-id="potencial" data-num="7" data-title="Potencial eléctrico" data-part="Parte II · Electrostática" data-short="Energía potencial, potencial, E = −∇V, equipotenciales, energía electrostática y multipolos">
<p class="lead">Como la fuerza electrostática es conservativa, podemos asociarle una energía potencial y, dividiendo por la carga, un campo escalar: el potencial eléctrico. Trabajar con \(V\) en lugar de con \(\vb{E}\) suele ser más sencillo, porque los escalares se suman sin preocuparse por direcciones.</p>

<section>
<h2>Energía potencial eléctrica</h2>
<p>El trabajo que hace el campo de una carga puntual \(q\) sobre una carga \(q_0\) que se mueve de \(a\) a \(b\) es</p>
<div class="eq">\[W_{a\to b}=\int_a^b q_0\vb{E}\cdot\dd\vb{l}=\frac{qq_0}{4\pi\eo}\int_{r_a}^{r_b}\frac{\dd r}{r^2}=\frac{qq_0}{4\pi\eo}\left(\frac1{r_a}-\frac1{r_b}\right),\]</div>
<p>porque \(\uv{r}\cdot\dd\vb{l}=\dd r\): sólo cuenta el desplazamiento radial. El trabajo depende únicamente de los extremos, así que la fuerza es conservativa y se define una energía potencial con \(W_{a\to b}=U_a-U_b\). Tomando \(U=0\) cuando las cargas están infinitamente separadas:</p>
<div class="eq key" data-name="Energía potencial de dos cargas">\[U=\frac{1}{4\pi\eo}\,\frac{q\,q_0}{r}.\]</div>
<p>Es positiva para cargas del mismo signo (hay que hacer trabajo para acercarlas) y negativa para cargas opuestas (sistema ligado). Para un sistema de varias cargas, la energía necesaria para ensamblarlo trayéndolas una a una desde el infinito es la suma sobre todos los pares:</p>
<div class="eq">\[U=\frac{1}{4\pi\eo}\sum_{i\lt j}\frac{q_iq_j}{r_{ij}}.\]</div>
</section>

<section>
<h2>El potencial eléctrico</h2>
<p>El <span class="term">potencial eléctrico</span> es la energía potencial por unidad de carga de prueba, y la diferencia de potencial es menos la integral de línea del campo:</p>
<div class="eq key" data-name="Potencial">\[V=\frac{U}{q_0},\qquad V_b-V_a=-\int_a^b\vb{E}\cdot\dd\vb{l}.\]</div>
<p>Su unidad es el voltio, \(1\un{V}=1\un{J/C}\); de aquí que el campo se mida también en V/m. En física atómica se usa el <span class="term">electronvoltio</span>, la energía que gana un electrón al atravesar 1 V: \(1\un{eV}=1.602\times10^{-19}\un{J}\).</p>
<p>Una carga positiva libre se mueve hacia potenciales menores (“cae” por el potencial); una negativa, hacia potenciales mayores. Sólo las <em>diferencias</em> de potencial tienen significado físico; el origen se elige por conveniencia, normalmente en el infinito o en tierra.</p>
<h3>Potencial de cargas puntuales y distribuciones</h3>
<div class="eq key" data-name="Carga puntual y superposición">\[V(\vb{r})=\frac{1}{4\pi\eo}\frac{q}{R},\qquad V(\vb{r})=\frac{1}{4\pi\eo}\sum_i\frac{q_i}{R_i},\qquad V(\vb{r})=\frac{1}{4\pi\eo}\int\frac{\dd q'}{R}.\]</div>
<p>La suma es escalar: no hay componentes que proyectar. Resultados importantes:</p>
<div class="tablewrap"><table>
<tr><th>Fuente</th><th>Potencial</th></tr>
<tr><td>Anillo de radio \(a\), en su eje</td><td>\(V=\dfrac{Q}{4\pi\eo\sqrt{z^2+a^2}}\)</td></tr>
<tr><td>Disco de radio \(a\), en su eje</td><td>\(V=\dfrac{\sigma}{2\eo}\left(\sqrt{z^2+a^2}-\abs{z}\right)\)</td></tr>
<tr><td>Línea infinita (referencia en \(\rho_0\))</td><td>\(V=-\dfrac{\lambda}{2\pi\eo}\ln\dfrac{\rho}{\rho_0}\)</td></tr>
<tr><td>Esfera conductora (radio \(R\), carga \(Q\))</td><td>\(V=\dfrac{Q}{4\pi\eo r}\) fuera; \(V=\dfrac{Q}{4\pi\eo R}\) dentro</td></tr>
<tr><td>Esfera maciza uniforme</td><td>\(V=\dfrac{Q}{4\pi\eo r}\) fuera; \(V=\dfrac{Q\,(3R^2-r^2)}{8\pi\eo R^3}\) dentro</td></tr>
</table></div>
<div class="box warn"><p>Para distribuciones que se extienden al infinito (línea o plano infinitos) no se puede tomar \(V(\infty)=0\): la integral diverge. Se elige otro punto de referencia, como \(\rho_0\) en la tabla.</p></div>
<div class="sim" data-sim="potential-landscape" data-title="El paisaje del potencial"></div>
<div class="sim-guide"><ul>
<li>Las cargas positivas son “montañas” y las negativas “pozos”. Una carga positiva libre rodaría cuesta abajo.</li>
<li>Las curvas de nivel del paisaje son las equipotenciales; la pendiente del terreno es proporcional a \(\abs{\vb{E}}\).</li>
</ul></div>
</section>

<section>
<h2>El campo como gradiente del potencial</h2>
<p>De \(\dd V=-\vb{E}\cdot\dd\vb{l}\) y de la definición de gradiente \(\dd V=\nabla V\cdot\dd\vb{l}\) se sigue la relación inversa:</p>
<div class="eq key" data-name="Campo a partir del potencial">\[\vb{E}=-\nabla V,\qquad E_x=-\pdv{V}{x},\ \ E_y=-\pdv{V}{y},\ \ E_z=-\pdv{V}{z};\qquad E_r=-\pdv{V}{r},\ \ E_\theta=-\frac1r\pdv{V}{\theta}.\]</div>
<p>El campo apunta hacia donde \(V\) disminuye más rápido y su magnitud es la pendiente máxima. Como el rotacional de un gradiente es cero, \(\curl\vb{E}=\vb{0}\) en electrostática: la circulación del campo por cualquier camino cerrado es nula.</p>
<div class="box ex">
<h4>Del potencial del anillo a su campo</h4>
<p>Obtenga \(E_z\) en el eje del anillo derivando \(V=\dfrac{Q}{4\pi\eo\sqrt{z^2+a^2}}\).</p>
<details><summary>Solución</summary>
<p>\(E_z=-\pdv{V}{z}=\dfrac{Q}{4\pi\eo}\dfrac{z}{(z^2+a^2)^{3/2}}\), el mismo resultado del capítulo 5, obtenido sin integrar vectores. Advertencia: conocer \(V\) sólo sobre el eje permite obtener \(E_z\) en el eje, pero no las componentes transversales (para eso hace falta \(V\) fuera del eje).</p>
</details>
</div>
<div class="sim" data-sim="sphere-potential" data-title="Potencial y campo de esferas y cilindros cargados"></div>
<div class="sim-guide"><ul>
<li>En cada punto, \(E=-\dd V/\dd r\): donde \(V(r)\) es plano, el campo es cero (interior del conductor); donde es más empinado, el campo es mayor.</li>
<li>El potencial es siempre continuo; el campo salta en una superficie cargada (conductor), pero no en la superficie de la esfera maciza.</li>
</ul></div>
</section>

<section>
<h2>Superficies equipotenciales</h2>
<p>Una <span class="term">superficie equipotencial</span> es el lugar geométrico de los puntos con el mismo potencial. Propiedades:</p>
<ul>
<li>El campo eléctrico es perpendicular a ellas en cada punto (el gradiente es normal a las superficies de nivel).</li>
<li>Mover una carga sobre una equipotencial no requiere trabajo.</li>
<li>Si se dibujan con un mismo salto \(\Delta V\), están más juntas donde el campo es más intenso: \(E\approx\Delta V/\Delta n\).</li>
<li>La superficie de un conductor en equilibrio es equipotencial.</li>
</ul>
<p>Para una carga puntual son esferas concéntricas; para un campo uniforme, planos perpendiculares; para un dipolo, superficies en forma de ocho que rodean cada carga.</p>
<div class="sim" data-sim="work-path" data-title="Trabajo y diferencia de potencial entre dos puntos"></div>
<div class="sim-guide"><ul>
<li>Arrastre A y B: el trabajo que hace el campo sobre \(q_0\) es \(q_0(V_A-V_B)\), independiente del camino dibujado.</li>
<li>Coloque A y B sobre la misma equipotencial: el trabajo es cero aunque el camino cruce otras equipotenciales.</li>
</ul></div>
</section>

<section>
<h2>Energía electrostática de una distribución</h2>
<p>La energía para ensamblar un sistema de cargas puntuales puede escribirse con el potencial que las demás cargas crean en cada una:</p>
<div class="eq">\[U=\frac12\sum_iq_i\,V(\vb{r}_i),\qquad V(\vb{r}_i)=\frac{1}{4\pi\eo}\sum_{j\ne i}\frac{q_j}{r_{ij}}.\]</div>
<p>El factor \(\tfrac12\) evita contar cada par dos veces. Para una distribución continua, y usando la ley de Gauss para eliminar \(\rho_v\), la energía puede atribuirse al propio campo:</p>
<div class="eq key" data-name="Energía y densidad de energía">\[U=\frac12\int\rho_vV\,\dd V=\frac{\eo}{2}\int_{\text{todo el espacio}}E^2\,\dd V,\qquad u_E=\frac{\eo}{2}E^2\ \ [\mathrm{J/m^3}].\]</div>
<p>Ejemplos: una esfera conductora de carga \(Q\) almacena \(U=\dfrac{Q^2}{8\pi\eo R}\); una esfera maciza uniforme, \(U=\dfrac{3Q^2}{20\pi\eo R}\). Para una carga puntual (\(R\to0\)) la energía diverge: la “autoenergía” de una partícula puntual es uno de los problemas abiertos de la electrodinámica clásica. Igualando \(U\) con \(m_ec^2\) se obtiene el radio clásico del electrón, \(r_e=e^2/(4\pi\eo m_ec^2)=2.82\times10^{-15}\) m.</p>
<div class="sim" data-sim="energy-assembly" data-title="Ensamblaje de un sistema de cargas: energía por pares"></div>
<div class="sim-guide"><ul>
<li>Traiga las cargas una a una: el trabajo de cada paso es \(q_k\) por el potencial que crean las ya colocadas.</li>
<li>La energía total no depende del orden en que se traen las cargas; compruébelo cambiando el orden.</li>
</ul></div>
</section>

<section>
<h2>Conservación de la energía en el movimiento de cargas</h2>
<p>Una partícula de carga \(q\) que sólo sufre fuerzas electrostáticas conserva su energía mecánica:</p>
<div class="eq">\[\tfrac12mv_a^2+qV_a=\tfrac12mv_b^2+qV_b .\]</div>
<p>En un experimento de dispersión de partículas alfa (\(q=2e\)) sobre núcleos de oro (\(Z=79\)), la distancia mínima de aproximación en un choque frontal se alcanza cuando toda la energía cinética se ha convertido en potencial:</p>
<div class="eq">\[r_{\min}=\frac{1}{4\pi\eo}\frac{(2e)(Ze)}{K}.\]</div>
<p>Con \(K=5\) MeV y \(e^2/4\pi\eo=1.44\) MeV·fm, \(r_{\min}=45.5\) fm, más de seis veces el radio del núcleo de oro (unos 7 fm). Para trayectorias no frontales con parámetro de impacto \(b\), la partícula describe una hipérbola y se desvía un ángulo \(\Theta\) dado por \(\tan(\Theta/2)=r_{\min}/(2b)\) (Rutherford, 1911).</p>
<div class="sim" data-sim="rutherford" data-title="Dispersión de Rutherford: trayectorias en un potencial coulombiano"></div>
<div class="sim-guide"><ul>
<li>Reduzca el parámetro de impacto: el ángulo de desviación crece; para \(b=0\) la partícula rebota en \(r_{\min}\).</li>
<li>Duplique la energía: \(r_{\min}\) se reduce a la mitad y las desviaciones disminuyen.</li>
</ul></div>
</section>

<section>
<h2>Potencial del dipolo y desarrollo multipolar</h2>
<p>Para el dipolo, con \(r\gg d\), las distancias a las cargas son \(r\mp\frac d2\cos\theta\) y</p>
<div class="eq key" data-name="Potencial del dipolo">\[V=\frac{1}{4\pi\eo}\frac{p\cos\theta}{r^2}=\frac{1}{4\pi\eo}\frac{\vb{p}\cdot\uv{r}}{r^2}.\]</div>
<p>Derivando, \(E_r=\dfrac{2p\cos\theta}{4\pi\eo r^3}\) y \(E_\theta=\dfrac{p\sen\theta}{4\pi\eo r^3}\), el resultado del capítulo 5.</p>
<p>En general, el potencial lejos de cualquier distribución localizada puede desarrollarse en potencias de \(1/r\). Usando la expansión de \(1/R\) en polinomios de Legendre:</p>
<div class="eq key" data-name="Desarrollo multipolar">\[V(\vb{r})=\frac{1}{4\pi\eo}\sum_{n=0}^{\infty}\frac{1}{r^{n+1}}\int(r')^nP_n(\cos\alpha)\,\rho_v(\vb{r}')\,\dd V',\]</div>
<p>donde \(\alpha\) es el ángulo entre \(\vb{r}\) y \(\vb{r}'\), y \(P_0=1\), \(P_1=x\), \(P_2=\frac12(3x^2-1)\), \(P_3=\frac12(5x^3-3x)\). El término \(n=0\) es el <em>monopolo</em> \(Q/(4\pi\eo r)\); el \(n=1\), el <em>dipolo</em> \(\vb{p}\cdot\uv{r}/(4\pi\eo r^2)\) con \(\vb{p}=\int\vb{r}'\rho_v\,\dd V'\); el \(n=2\), el <em>cuadrupolo</em>. Lejos, domina el primer término no nulo: una distribución neutra se ve como un dipolo; una neutra y sin momento dipolar, como un cuadrupolo, y así sucesivamente.</p>
<div class="sim" data-sim="multipole" data-title="Desarrollo multipolar de cargas sobre un eje"></div>
<div class="sim-guide"><ul>
<li>Con el cuadrupolo lineal (\(+q,-2q,+q\)) los términos de monopolo y dipolo son nulos: el potencial lejano cae como \(1/r^3\).</li>
<li>Aumente el orden del desarrollo: la aproximación es buena para \(r\) mayor que la extensión de la distribución y falla dentro de ella.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Qué potencial crea una carga de 3 nC a 15 cm? ¿Qué trabajo hace falta para traer allí una carga de 2 nC desde el infinito?
<details><summary>Respuesta</summary><p>\(V=180\) V; \(W=qV=3.6\times10^{-7}\) J.</p></details></li>
<li><span class="lvl">Básico</span>Un protón se acelera desde el reposo a través de 1 kV. Halle su energía cinética en eV y en J, y su rapidez.
<details><summary>Respuesta</summary><p>\(K=1\) keV \(=1.60\times10^{-16}\) J; \(v=4.38\times10^5\) m/s.</p></details></li>
<li><span class="lvl">Intermedio</span>Cuatro cargas iguales \(q\) están en los vértices de un cuadrado de lado \(a\). Halle la energía del sistema.
<details><summary>Respuesta</summary><p>4 lados y 2 diagonales: \(U=\dfrac{q^2}{4\pi\eo a}\left(4+\sqrt2\right)=5.41\,\dfrac{q^2}{4\pi\eo a}\).</p></details></li>
<li><span class="lvl">Intermedio</span>Halle el potencial en el centro de una esfera maciza uniforme y compárelo con el de su superficie.
<details><summary>Respuesta</summary><p>\(V(0)=\dfrac{3Q}{8\pi\eo R}=\tfrac32V(R)\).</p></details></li>
<li><span class="lvl">Intermedio</span>El potencial en una región es \(V=5x^2y-3yz\) (V, con coordenadas en m). Halle \(\vb{E}\) en \((1,2,-1)\).
<details><summary>Respuesta</summary><p>\(\vb{E}=-(10xy,\ 5x^2-3z,\ -3y)=(-20,\,-8,\,6)\) V/m.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que la energía de una esfera maciza uniforme es \(\dfrac{3Q^2}{20\pi\eo R}\) de dos maneras: con \(\tfrac12\int\rho_vV\,\dd V\) y con \(\tfrac{\eo}{2}\int E^2\dd V\).
<details><summary>Respuesta</summary><p>Con la densidad de energía: \(\frac{\eo}{2}\left[\int_0^R\left(\frac{Qr}{4\pi\eo R^3}\right)^24\pi r^2\dd r+\int_R^\infty\left(\frac{Q}{4\pi\eo r^2}\right)^24\pi r^2\dd r\right]=\frac{Q^2}{8\pi\eo R}\left(\frac15+1\right)\).</p></details></li>
<li><span class="lvl">Avanzado</span>Tres cargas sobre el eje \(z\): \(+q\) en \(z=a\), \(-2q\) en \(0\), \(+q\) en \(-a\). Halle el potencial lejano.
<details><summary>Respuesta</summary><p>Monopolo y dipolo nulos; \(V\approx\dfrac{1}{4\pi\eo}\dfrac{2qa^2}{r^3}P_2(\cos\theta)=\dfrac{qa^2(3\cos^2\theta-1)}{4\pi\eo r^3}\).</p></details></li>
</ol>
</section>
