<template class="chapter-src" data-id="vectores" data-num="1" data-title="Álgebra vectorial" data-part="Parte I · Herramientas matemáticas" data-short="Escalares, vectores, productos punto, cruz y triples">
<p class="lead">Los campos eléctrico y magnético son magnitudes vectoriales definidas en cada punto del espacio. Antes de estudiar su física necesitamos un lenguaje preciso para sumarlos, proyectarlos y multiplicarlos. Este capítulo reúne el álgebra vectorial que se usa en todo el curso.</p>

<section>
<h2>Escalares y vectores</h2>
<p>Una <span class="term">magnitud escalar</span> queda completamente especificada por un número real y su unidad: la temperatura, la masa, la carga eléctrica \(q\), el potencial eléctrico \(V\) o la energía. Una <span class="term">magnitud vectorial</span> requiere además una dirección y un sentido: la velocidad, la fuerza, el campo eléctrico \(\vb{E}\) o la densidad de corriente \(\vb{J}\).</p>
<p>En este curso los vectores se escriben en negrita, \(\vb{A}\); su <em>magnitud</em> o <em>módulo</em>, que es un escalar no negativo, se escribe \(A = \abs{\vb{A}}\). Un <span class="term">vector unitario</span> tiene magnitud uno y sólo indica una dirección; se marca con un circunflejo:</p>
<div class="eq key" data-name="Vector unitario">\[\uv{a}_A=\frac{\vb{A}}{\abs{\vb{A}}}=\frac{\vb{A}}{A},\qquad \vb{A}=A\,\uv{a}_A .\]</div>
<p>Dos vectores son iguales si tienen la misma magnitud, dirección y sentido, sin importar dónde se dibujen. Sin embargo, en electromagnetismo casi siempre trabajamos con <span class="term">campos</span>: a cada punto del espacio se le asigna un vector, y entonces sí importa el punto de aplicación. Distinguiremos:</p>
<ul>
<li><strong>Vector de posición</strong> \(\vb{r}\): va del origen al punto donde se evalúa el campo (punto de campo).</li>
<li><strong>Vector de posición de la fuente</strong> \(\vb{r}'\): va del origen al punto donde está la carga o corriente que produce el campo (punto fuente).</li>
<li><strong>Vector de separación</strong> \(\vb{R}=\vb{r}-\vb{r}'\): va de la fuente al punto de campo. Su magnitud \(R\) es la distancia entre ambos y \(\uv{R}=\vb{R}/R\) su dirección.</li>
</ul>
<div class="box note"><p>La notación primada para la fuente y sin primar para el punto de campo se mantiene en todo el curso. Por ejemplo, la ley de Coulomb se escribe \(\vb{E}(\vb{r})=\dfrac{q}{4\pi\eo}\dfrac{\uv{R}}{R^2}\) con \(\vb{R}=\vb{r}-\vb{r}'\).</p></div>
</section>

<section>
<h2>Componentes cartesianas y operaciones básicas</h2>
<p>En un sistema cartesiano dextrógiro con vectores unitarios \(\uv{x},\uv{y},\uv{z}\), todo vector se descompone de forma única como</p>
<div class="eq">\[\vb{A}=A_x\uv{x}+A_y\uv{y}+A_z\uv{z},\qquad A=\sqrt{A_x^2+A_y^2+A_z^2}.\]</div>
<p>Las componentes \(A_x, A_y, A_z\) son escalares (pueden ser negativas). La suma y la multiplicación por un escalar se hacen componente a componente:</p>
<div class="eq">\[\vb{A}\pm\vb{B}=(A_x\pm B_x)\uv{x}+(A_y\pm B_y)\uv{y}+(A_z\pm B_z)\uv{z},\qquad k\vb{A}=kA_x\uv{x}+kA_y\uv{y}+kA_z\uv{z}.\]</div>
<p>Geométricamente, \(\vb{A}+\vb{B}\) es la diagonal del paralelogramo formado por \(\vb{A}\) y \(\vb{B}\) (regla del paralelogramo), o bien el vector que va del origen de \(\vb{A}\) al extremo de \(\vb{B}\) cuando se colocan uno a continuación del otro (regla del polígono). La suma cumple:</p>
<div class="tablewrap narrow"><table>
<tr><th>Propiedad</th><th>Enunciado</th></tr>
<tr><td>Conmutativa</td><td>\(\vb{A}+\vb{B}=\vb{B}+\vb{A}\)</td></tr>
<tr><td>Asociativa</td><td>\(\vb{A}+(\vb{B}+\vb{C})=(\vb{A}+\vb{B})+\vb{C}\)</td></tr>
<tr><td>Distributiva</td><td>\(k(\vb{A}+\vb{B})=k\vb{A}+k\vb{B}\)</td></tr>
<tr><td>Elemento neutro</td><td>\(\vb{A}+\vb{0}=\vb{A}\)</td></tr>
<tr><td>Opuesto</td><td>\(\vb{A}+(-\vb{A})=\vb{0}\)</td></tr>
</table></div>
<div class="box ex">
<h4>Vector de separación y su unitario</h4>
<p>Una carga está en \(P'(1,-2,3)\) m y el campo se evalúa en \(P(4,2,3)\) m. Halle \(\vb{R}\), \(R\) y \(\uv{R}\).</p>
<details><summary>Solución</summary>
<p>\(\vb{R}=\vb{r}-\vb{r}'=(4-1)\uv{x}+(2+2)\uv{y}+(3-3)\uv{z}=3\uv{x}+4\uv{y}\) m. Su magnitud es \(R=\sqrt{9+16}=5\) m y el unitario \(\uv{R}=0.6\,\uv{x}+0.8\,\uv{y}\). Observe que \(\uv{R}\) apunta de la fuente al punto de campo.</p>
</details>
</div>
<div class="sim" data-sim="vec-sum2d" data-title="Suma, resta y componentes de vectores en el plano"></div>
<div class="sim-guide"><ul>
<li>Arrastre los extremos de \(\vb{A}\) y \(\vb{B}\). Verifique que las componentes de \(\vb{A}+\vb{B}\) son la suma de las componentes.</li>
<li>Active la resta: \(\vb{A}-\vb{B}\) es el vector que va del extremo de \(\vb{B}\) al extremo de \(\vb{A}\).</li>
<li>¿Qué condición deben cumplir \(\vb{A}\) y \(\vb{B}\) para que \(\abs{\vb{A}+\vb{B}}=A+B\)? ¿Y para que \(\abs{\vb{A}+\vb{B}}=\abs{A-B}\)?</li>
</ul></div>
</section>

<section>
<h2>Producto escalar</h2>
<p>El <span class="term">producto escalar</span> (o producto punto) de dos vectores es el escalar</p>
<div class="eq key" data-name="Producto escalar">\[\vb{A}\cdot\vb{B}=AB\cos\theta_{AB}=A_xB_x+A_yB_y+A_zB_z,\]</div>
<p>donde \(0\le\theta_{AB}\le\pi\) es el ángulo más pequeño entre ellos. La igualdad entre las dos formas se sigue de que \(\uv{x}\cdot\uv{x}=\uv{y}\cdot\uv{y}=\uv{z}\cdot\uv{z}=1\) y \(\uv{x}\cdot\uv{y}=\uv{y}\cdot\uv{z}=\uv{z}\cdot\uv{x}=0\). Propiedades:</p>
<ul>
<li>Conmutativo: \(\vb{A}\cdot\vb{B}=\vb{B}\cdot\vb{A}\); distributivo: \(\vb{A}\cdot(\vb{B}+\vb{C})=\vb{A}\cdot\vb{B}+\vb{A}\cdot\vb{C}\).</li>
<li>\(\vb{A}\cdot\vb{A}=A^2\). Dos vectores no nulos son perpendiculares si y sólo si \(\vb{A}\cdot\vb{B}=0\).</li>
<li>El signo indica si el ángulo es agudo (\(>0\)), recto (\(=0\)) u obtuso (\(<0\)).</li>
</ul>
<h3>Proyecciones</h3>
<p>La <em>componente escalar</em> de \(\vb{A}\) en la dirección de un unitario \(\uv{a}\) es \(A_a=\vb{A}\cdot\uv{a}=A\cos\theta\); la <em>proyección vectorial</em> es \((\vb{A}\cdot\uv{a})\,\uv{a}\). En particular, \(A_x=\vb{A}\cdot\uv{x}\): las componentes cartesianas son proyecciones. Esta idea es la base de las transformaciones entre sistemas de coordenadas del capítulo 2.</p>
<h3>Uso en física</h3>
<p>El trabajo de una fuerza a lo largo de un desplazamiento \(\dd\vb{l}\) es \(\dd W=\vb{F}\cdot\dd\vb{l}\); el flujo de un campo a través de un elemento de superficie orientado \(\dd\vb{S}\) es \(\dd\Phi=\vb{E}\cdot\dd\vb{S}\). Ambos sólo cuentan la parte del vector paralela al desplazamiento o a la normal.</p>
<div class="box ex">
<h4>Ángulo entre dos vectores</h4>
<p>Sean \(\vb{A}=2\uv{x}-\uv{y}+2\uv{z}\) y \(\vb{B}=\uv{x}+4\uv{y}+\uv{z}\). Halle el ángulo entre ellos y la componente de \(\vb{A}\) a lo largo de \(\vb{B}\).</p>
<details><summary>Solución</summary>
<p>\(\vb{A}\cdot\vb{B}=2-4+2=0\): los vectores son perpendiculares, \(\theta_{AB}=90^\circ\), y la componente de \(\vb{A}\) sobre \(\vb{B}\) es nula. Compruebe con \(A=3\), \(B=\sqrt{18}\).</p>
</details>
</div>
</section>

<section>
<h2>Producto vectorial</h2>
<p>El <span class="term">producto vectorial</span> (o producto cruz) de \(\vb{A}\) y \(\vb{B}\) es un vector perpendicular a ambos:</p>
<div class="eq key" data-name="Producto vectorial">\[\vb{A}\times\vb{B}=AB\sen\theta_{AB}\,\uv{n},\qquad
\vb{A}\times\vb{B}=\begin{vmatrix}\uv{x}&\uv{y}&\uv{z}\\ A_x&A_y&A_z\\ B_x&B_y&B_z\end{vmatrix}.\]</div>
<p>El unitario \(\uv{n}\) se elige con la <strong>regla de la mano derecha</strong>: al girar los dedos de \(\vb{A}\) hacia \(\vb{B}\) por el ángulo menor, el pulgar señala \(\uv{n}\). Desarrollando el determinante,</p>
<div class="eq">\[\vb{A}\times\vb{B}=(A_yB_z-A_zB_y)\uv{x}+(A_zB_x-A_xB_z)\uv{y}+(A_xB_y-A_yB_x)\uv{z}.\]</div>
<ul>
<li>Anticonmutativo: \(\vb{A}\times\vb{B}=-\vb{B}\times\vb{A}\). Por tanto \(\vb{A}\times\vb{A}=\vb{0}\).</li>
<li>No asociativo: en general \(\vb{A}\times(\vb{B}\times\vb{C})\neq(\vb{A}\times\vb{B})\times\vb{C}\).</li>
<li>Distributivo: \(\vb{A}\times(\vb{B}+\vb{C})=\vb{A}\times\vb{B}+\vb{A}\times\vb{C}\).</li>
<li>Su magnitud \(\abs{\vb{A}\times\vb{B}}=AB\sen\theta\) es el área del paralelogramo definido por \(\vb{A}\) y \(\vb{B}\).</li>
<li>En un sistema dextrógiro: \(\uv{x}\times\uv{y}=\uv{z}\), \(\uv{y}\times\uv{z}=\uv{x}\), \(\uv{z}\times\uv{x}=\uv{y}\) (orden cíclico).</li>
</ul>
<p>En electromagnetismo aparece constantemente: la fuerza de Lorentz \(\vb{F}=q\vb{v}\times\vb{B}\), la ley de Biot–Savart \(\dd\vb{B}\propto I\,\dd\vb{l}\times\uv{R}\), el torque sobre un dipolo \(\boldsymbol{\tau}=\vb{m}\times\vb{B}\) y el vector de Poynting \(\vb{S}=\vb{E}\times\vb{H}\).</p>
<div class="sim" data-sim="vec-products3d" data-title="Productos escalar y vectorial en tres dimensiones"></div>
<div class="sim-guide"><ul>
<li>Haga \(\vb{A}\) paralelo a \(\vb{B}\): el paralelogramo colapsa y \(\vb{A}\times\vb{B}=\vb{0}\), mientras \(\vb{A}\cdot\vb{B}\) es máximo.</li>
<li>Haga \(\vb{A}\perp\vb{B}\): ahora \(\vb{A}\cdot\vb{B}=0\) y el área es \(AB\).</li>
<li>Active “intercambiar orden” para ver \(\vb{B}\times\vb{A}=-\vb{A}\times\vb{B}\). Gire la vista y compruebe la regla de la mano derecha.</li>
</ul></div>
<div class="box ex">
<h4>Área de un triángulo</h4>
<p>Halle el área del triángulo con vértices \(P_1(1,0,0)\), \(P_2(0,2,0)\), \(P_3(0,0,3)\).</p>
<details><summary>Solución</summary>
<p>Con \(\vb{a}=P_2-P_1=(-1,2,0)\) y \(\vb{b}=P_3-P_1=(-1,0,3)\): \(\vb{a}\times\vb{b}=(6-0)\uv{x}+(0+3)\uv{y}+(0+2)\uv{z}=6\uv{x}+3\uv{y}+2\uv{z}\). El área del triángulo es la mitad del paralelogramo: \(S=\tfrac12\sqrt{36+9+4}=3.5\) unidades².</p>
</details>
</div>
</section>

<section>
<h2>Productos triples</h2>
<h3>Producto triple escalar</h3>
<div class="eq key" data-name="Producto triple escalar">\[\vb{A}\cdot(\vb{B}\times\vb{C})=\begin{vmatrix}A_x&A_y&A_z\\B_x&B_y&B_z\\C_x&C_y&C_z\end{vmatrix}=\vb{B}\cdot(\vb{C}\times\vb{A})=\vb{C}\cdot(\vb{A}\times\vb{B}).\]</div>
<p>Su valor absoluto es el volumen del paralelepípedo generado por los tres vectores. Es positivo si \((\vb{A},\vb{B},\vb{C})\) forman una terna dextrógira y se anula si los tres son coplanares. Permutar cíclicamente no cambia su valor; intercambiar dos vectores cambia el signo.</p>
<h3>Producto triple vectorial</h3>
<div class="eq key" data-name="Regla BAC–CAB">\[\vb{A}\times(\vb{B}\times\vb{C})=\vb{B}\,(\vb{A}\cdot\vb{C})-\vb{C}\,(\vb{A}\cdot\vb{B}).\]</div>
<p>El resultado está en el plano de \(\vb{B}\) y \(\vb{C}\). Esta identidad reaparece en forma diferencial como \(\curl(\curl\vb{A})=\nabla(\divg\vb{A})-\lap\vb{A}\), clave para deducir la ecuación de onda.</p>
<div class="sim" data-sim="vec-triple" data-title="Producto triple escalar: volumen del paralelepípedo"></div>
<div class="sim-guide"><ul>
<li>Lleve \(\vb{C}\) al plano de \(\vb{A}\) y \(\vb{B}\): el volumen se anula.</li>
<li>Pase \(\vb{C}\) al otro lado del plano: el producto triple cambia de signo (la terna deja de ser dextrógira).</li>
</ul></div>
</section>

<section>
<h2>Campos escalares y vectoriales</h2>
<p>Un <span class="term">campo escalar</span> asigna un número a cada punto, \(f(\vb{r})\): la temperatura de una placa o el potencial eléctrico \(V(x,y,z)\). Se visualiza mediante <em>superficies de nivel</em> \(f=\text{cte}\) (en el plano, curvas de nivel). Un <span class="term">campo vectorial</span> asigna un vector a cada punto, \(\vb{F}(\vb{r})\): la velocidad de un fluido o el campo eléctrico. Se visualiza con flechas en una cuadrícula o con <em>líneas de campo</em>, curvas tangentes al vector en cada punto:</p>
<div class="eq">\[\frac{\dd x}{F_x}=\frac{\dd y}{F_y}=\frac{\dd z}{F_z}.\]</div>
<p>Las líneas de campo nunca se cruzan donde el campo es no nulo y finito (el campo tiene una sola dirección en cada punto). Su densidad es proporcional a la magnitud del campo en tres dimensiones; en un corte plano esta proporcionalidad es sólo cualitativa.</p>
<div class="box warn"><p>En un campo, el vector depende del punto. Sumar \(\vb{E}(\vb{r}_1)+\vb{E}(\vb{r}_2)\) casi nunca tiene sentido físico; en cambio la superposición \(\vb{E}_1(\vb{r})+\vb{E}_2(\vb{r})\) de dos fuentes evaluadas en el <em>mismo</em> punto es la base de todo el curso.</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Dados \(\vb{A}=3\uv{x}+4\uv{y}-\uv{z}\) y \(\vb{B}=-\uv{x}+2\uv{z}\), calcule \(\vb{A}+2\vb{B}\), \(\vb{A}\cdot\vb{B}\), \(\vb{A}\times\vb{B}\) y el ángulo entre ellos.
<details><summary>Respuesta</summary><p>\(\vb{A}+2\vb{B}=\uv{x}+4\uv{y}+3\uv{z}\); \(\vb{A}\cdot\vb{B}=-5\); \(\vb{A}\times\vb{B}=8\uv{x}-5\uv{y}+4\uv{z}\); \(\theta=\arccos(-5/\sqrt{26\cdot5})\approx116.0^\circ\).</p></details></li>
<li><span class="lvl">Básico</span>Halle un vector unitario perpendicular al plano que contiene a \(\vb{A}=\uv{x}+\uv{y}\) y \(\vb{B}=\uv{y}+\uv{z}\).
<details><summary>Respuesta</summary><p>\(\vb{A}\times\vb{B}=\uv{x}-\uv{y}+\uv{z}\); \(\uv{n}=\pm(\uv{x}-\uv{y}+\uv{z})/\sqrt3\).</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que \(\abs{\vb{A}\times\vb{B}}^2+(\vb{A}\cdot\vb{B})^2=A^2B^2\) (identidad de Lagrange).
<details><summary>Respuesta</summary><p>Use \(\abs{\vb{A}\times\vb{B}}=AB\sen\theta\) y \(\vb{A}\cdot\vb{B}=AB\cos\theta\); la suma de cuadrados es \(A^2B^2(\sen^2\theta+\cos^2\theta)\).</p></details></li>
<li><span class="lvl">Intermedio</span>Calcule el volumen del paralelepípedo generado por \((1,0,0)\), \((1,2,0)\) y \((0,1,3)\).
<details><summary>Respuesta</summary><p>\(\det=1\cdot(6-0)-0+0=6\); volumen \(=6\) unidades³.</p></details></li>
<li><span class="lvl">Avanzado</span>Una partícula de carga \(q\) se mueve con \(\vb{v}=v_0(\uv{x}+\uv{y})/\sqrt2\) en un campo \(\vb{B}=B_0\uv{z}\). Halle la fuerza \(q\vb{v}\times\vb{B}\) y verifique que es perpendicular a \(\vb{v}\).
<details><summary>Respuesta</summary><p>\(\vb{F}=\frac{qv_0B_0}{\sqrt2}(\uv{x}\times\uv{z}+\uv{y}\times\uv{z})=\frac{qv_0B_0}{\sqrt2}(\uv{x}-\uv{y})\); \(\vb{F}\cdot\vb{v}\propto 1-1=0\).</p></details></li>
<li><span class="lvl">Avanzado</span>Use la regla BAC–CAB para demostrar la identidad de Jacobi \(\vb{A}\times(\vb{B}\times\vb{C})+\vb{B}\times(\vb{C}\times\vb{A})+\vb{C}\times(\vb{A}\times\vb{B})=\vb{0}\).
<details><summary>Respuesta</summary><p>Al expandir, cada término \(\vb{X}(\vb{Y}\cdot\vb{Z})\) aparece una vez con signo + y otra con signo −.</p></details></li>
</ol>
</section>
