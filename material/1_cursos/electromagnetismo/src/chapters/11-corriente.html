<p class="lead">Cuando las cargas se mueven de forma ordenada hay una corriente eléctrica. Dentro de un conductor con corriente el campo ya no es cero: impulsa a los portadores, que chocan continuamente con la red cristalina y avanzan con una velocidad media muy pequeña. De ese equilibrio entre empuje y fricción nace la ley de Ohm.</p>

<section>
<h2>Corriente eléctrica</h2>
<p>La <span class="term">corriente</span> a través de una superficie es la carga neta que la atraviesa por unidad de tiempo:</p>
<div class="eq key" data-name="Corriente">\[I=\frac{\dd Q}{\dd t},\qquad 1\un{A}=1\un{C/s}.\]</div>
<p>Por convención, el sentido de la corriente es el del movimiento de las cargas positivas. En un metal los portadores son electrones, que se mueven en sentido contrario a la corriente convencional; en un electrolito se mueven iones de ambos signos, y en un semiconductor, electrones y huecos. En todos los casos, portadores de signos opuestos que se mueven en sentidos opuestos contribuyen a la corriente en el mismo sentido.</p>
</section>

<section>
<h2>Densidad de corriente y velocidad de deriva</h2>
<p>Si hay \(n\) portadores por unidad de volumen, cada uno con carga \(q\) y velocidad media (de deriva) \(\vb{v}_d\), la carga que atraviesa un área \(A\) perpendicular en un tiempo \(\dd t\) es la contenida en un cilindro de volumen \(Av_d\,\dd t\). Se define la <span class="term">densidad de corriente</span>:</p>
<div class="eq key" data-name="Densidad de corriente">\[\vb{J}=nq\,\vb{v}_d\quad[\mathrm{A/m^2}],\qquad I=\int_S\vb{J}\cdot\dd\vb{A}.\]</div>
<p>En un hilo uniforme, \(J=I/A\). La corriente es un escalar (un flujo); la densidad de corriente es un campo vectorial que describe cómo se reparte la corriente en el conductor.</p>
<div class="box ex">
<h4>¿Qué tan rápido van los electrones?</h4>
<p>Un hilo de cobre de 1 mm² transporta 1 A. El cobre tiene \(n=8.5\times10^{28}\) electrones libres por m³. Halle la velocidad de deriva.</p>
<details><summary>Solución</summary>
<p>\(v_d=\dfrac{I}{neA}=\dfrac{1}{(8.5\times10^{28})(1.6\times10^{-19})(10^{-6})}=7.4\times10^{-5}\) m/s, menos de un décimo de milímetro por segundo. Sin embargo, la luz se enciende al instante: lo que viaja rápido es la señal (el campo eléctrico que se establece en el hilo a una fracción apreciable de \(c\)), no los electrones. La velocidad térmica de los electrones, en cambio, es del orden de \(10^6\) m/s.</p>
</details>
</div>
</section>

<section>
<h2>Ecuación de continuidad</h2>
<p>La conservación de la carga en forma local: la corriente que sale de un volumen cerrado es igual a la disminución de la carga que contiene. Con el teorema de la divergencia:</p>
<div class="eq key" data-name="Continuidad">\[\oint_S\vb{J}\cdot\dd\vb{A}=-\odv{Q_{\text{enc}}}{t}\qquad\Longleftrightarrow\qquad \divg\vb{J}+\pdv{\rho_v}{t}=0 .\]</div>
<p>En régimen estacionario (\(\partial\rho_v/\partial t=0\)), \(\divg\vb{J}=0\): las líneas de corriente son cerradas y, en un nodo de un circuito, la suma de corrientes que entran es igual a la suma de las que salen (primera ley de Kirchhoff).</p>
</section>

<section>
<h2>Ley de Ohm</h2>
<p>En muchos materiales, a temperatura constante, la densidad de corriente es proporcional al campo eléctrico:</p>
<div class="eq key" data-name="Ley de Ohm microscópica">\[\vb{J}=\sigma\vb{E},\qquad \rho=\frac1\sigma,\]</div>
<p>donde \(\sigma\) es la <span class="term">conductividad</span> [S/m] y \(\rho\) la <span class="term">resistividad</span> [Ω·m] (no confundir con la densidad de carga \(\rho_v\) ni con la coordenada cilíndrica). Para un conductor de longitud \(L\) y sección \(A\) uniformes, \(V=EL\) y \(I=JA=\sigma EA\), de donde</p>
<div class="eq key" data-name="Ley de Ohm y resistencia">\[V=IR,\qquad R=\frac{\rho L}{A},\qquad 1\un{\Omega}=1\un{V/A}.\]</div>
<p>La ley de Ohm no es una ley fundamental sino una propiedad de ciertos materiales (los <em>óhmicos</em>). Un diodo, una lámpara de filamento o un gas ionizado no la cumplen.</p>

<section>
<h2>Modelo de Drude</h2>
<p>En 1900 Paul Drude propuso tratar los electrones de conducción como un gas clásico. Entre colisiones, el campo acelera a cada electrón con \(\vb{a}=-e\vb{E}/m\); en cada choque con los iones la velocidad se “aleatoriza”. Si \(\tau\) es el tiempo medio entre colisiones (tiempo de relajación), la velocidad media adquirida es</p>
<div class="eq key" data-name="Modelo de Drude">\[\vb{v}_d=-\frac{e\tau}{m}\vb{E},\qquad \vb{J}=-ne\vb{v}_d=\frac{ne^2\tau}{m}\vb{E}\quad\Longrightarrow\quad \sigma=\frac{ne^2\tau}{m}.\]</div>
<p>El modelo explica la ley de Ohm: \(\sigma\) no depende de \(E\) porque el campo sólo añade una pequeña deriva a un movimiento aleatorio muy rápido. Para el cobre, \(\tau\approx2.5\times10^{-14}\) s. La explicación correcta de la dependencia con la temperatura y del valor del recorrido libre medio requiere la mecánica cuántica (modelo de Sommerfeld), pero la expresión de \(\sigma\) se conserva.</p>
<div class="sim" data-sim="drude" data-title="Modelo de Drude: deriva de electrones en un conductor"></div>
<div class="sim-guide"><ul>
<li>Sin campo, el movimiento es completamente aleatorio y la velocidad media es cero.</li>
<li>Con campo, cada electrón describe arcos de parábola entre choques. La velocidad media medida se acerca a \(e\tau E/m\) (compare las lecturas).</li>
<li>Duplique \(\tau\): la deriva se duplica, igual que la conductividad.</li>
</ul></div>
</section>

<section>
<h2>Resistividad y temperatura</h2>
<p>En los metales, al aumentar la temperatura aumentan las vibraciones de la red, disminuye \(\tau\) y aumenta \(\rho\). En un intervalo moderado la dependencia es aproximadamente lineal:</p>
<div class="eq">\[\rho(T)=\rho_0\left[1+\alpha\,(T-T_0)\right],\qquad R(T)=R_0\left[1+\alpha\,(T-T_0)\right].\]</div>
<p>En los semiconductores, en cambio, el número de portadores crece exponencialmente con la temperatura y la resistividad disminuye (\(\alpha\lt0\)). En los <span class="term">superconductores</span>, por debajo de una temperatura crítica \(T_c\) la resistencia cae exactamente a cero (mercurio a 4.2 K, cupratos por encima de 90 K).</p>

<div class="sim-guide"><ul>
<li>Duplique la longitud: \(R\) se duplica. Duplique el diámetro: \(R\) se reduce a la cuarta parte.</li>
<li>Caliente el hilo de tungsteno de 20 °C a 2500 °C (un filamento de lámpara): su resistencia aumenta más de diez veces.</li>
</ul></div>

<section>
<h2>Potencia eléctrica</h2>
<p>Cuando una carga \(\dd q\) atraviesa un elemento con diferencia de potencial \(V\), el campo realiza el trabajo \(V\dd q\). La potencia entregada al elemento es</p>
<div class="eq key" data-name="Potencia">\[P=IV=I^2R=\frac{V^2}{R},\qquad p=\vb{J}\cdot\vb{E}=\sigma E^2\ \ [\mathrm{W/m^3}].\]</div>
<p>En un resistor esta energía se disipa como calor (efecto Joule): las colisiones transfieren a la red la energía cinética que el campo da a los electrones. Por eso la energía eléctrica se transporta a alta tensión: para una potencia dada, \(I=P/V\) es menor y las pérdidas \(I^2R\) en las líneas se reducen con el cuadrado de la tensión.</p>
<div class="box ex">
<h4>Pérdidas en una línea de transmisión</h4>
<p>Una línea de 10 Ω transporta 10 MW. Compare las pérdidas si se transmite a 10 kV y a 200 kV.</p>
<details><summary>Solución</summary>
<p>A 10 kV, \(I=1000\) A y \(P_{\text{pérd}}=I^2R=10\) MW: ¡toda la potencia! A 200 kV, \(I=50\) A y \(P_{\text{pérd}}=25\) kW, el 0.25 %.</p>
</details>
</div>
</section>

<section>
<h2>Relajación de la carga en un conductor</h2>
<p>¿Qué pasa si se coloca carga en el interior de un conductor? Combinando la continuidad, la ley de Ohm y la ley de Gauss:</p>
<div class="eq">\[\pdv{\rho_v}{t}=-\divg\vb{J}=-\sigma\divg\vb{E}=-\frac{\sigma}{\varepsilon}\rho_v\quad\Longrightarrow\quad \rho_v(t)=\rho_v(0)\,e^{-t/\tau_r},\qquad \tau_r=\frac{\varepsilon}{\sigma}.\]</div>
<p>La carga interior desaparece exponencialmente (se va a la superficie). El <span class="term">tiempo de relajación dieléctrica</span> \(\tau_r\) mide qué tan buen conductor es un material: para el cobre, \(\tau_r\approx10^{-19}\) s (en la práctica el límite lo imponen las colisiones, \(\sim10^{-14}\) s); para el agua de mar, \(\sim2\times10^{-10}\) s; para el cuarzo fundido, meses.</p>

</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Por un hilo circulan 3 A durante 2 minutos. ¿Cuántos electrones pasan por una sección?
<details><summary>Respuesta</summary><p>\(Q=360\) C, \(n=2.25\times10^{21}\) electrones.</p></details></li>
<li><span class="lvl">Básico</span>Halle la resistencia de 100 m de cable de cobre de 2 mm de diámetro.
<details><summary>Respuesta</summary><p>\(R=\rho L/A=(1.68\times10^{-8})(100)/(3.14\times10^{-6})=0.535\ \Omega\).</p></details></li>
<li><span class="lvl">Intermedio</span>Un filamento de tungsteno tiene 20 Ω a 20 °C. ¿Cuál es su resistencia a 2020 °C (use la aproximación lineal)? ¿Qué potencia disipa a 120 V?
<details><summary>Respuesta</summary><p>\(R=20[1+4.5\times10^{-3}(2000)]=200\ \Omega\); \(P=72\) W.</p></details></li>
<li><span class="lvl">Intermedio</span>Calcule el tiempo de relajación \(\tau\) de Drude para el cobre.
<details><summary>Respuesta</summary><p>\(\tau=m/(ne^2\rho)=9.11\times10^{-31}/[(8.5\times10^{28})(1.6\times10^{-19})^2(1.68\times10^{-8})]=2.5\times10^{-14}\) s.</p></details></li>
<li><span class="lvl">Avanzado</span>Un cono truncado de material de resistividad \(\rho\), altura \(h\) y radios \(a\) y \(b\) en sus caras. Halle su resistencia entre las caras.
<details><summary>Respuesta</summary><p>\(R=\int_0^h\frac{\rho\,\dd x}{\pi r(x)^2}\) con \(r\) lineal: \(R=\dfrac{\rho h}{\pi ab}\).</p></details></li>
<li><span class="lvl">Avanzado</span>Entre dos cilindros coaxiales (radios \(a\lt b\), longitud \(L\)) hay un material de conductividad \(\sigma\). Halle la resistencia radial y verifique que \(RC=\varepsilon/\sigma\).
<details><summary>Respuesta</summary><p>\(R=\dfrac{\ln(b/a)}{2\pi\sigma L}\); con \(C=\dfrac{2\pi\varepsilon L}{\ln(b/a)}\), \(RC=\varepsilon/\sigma\), resultado válido para cualquier geometría.</p></details></li>
</ol>
