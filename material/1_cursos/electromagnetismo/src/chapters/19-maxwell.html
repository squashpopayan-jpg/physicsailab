<template class="chapter-src" data-id="maxwell" data-num="19" data-title="Ecuaciones de Maxwell" data-part="Parte V · Electrodinámica" data-short="Corriente de desplazamiento, las cuatro ecuaciones, potenciales, condiciones de frontera y teorema de Poynting">
<p class="lead">En 1865 James Clerk Maxwell completó la ley de Ampère con un término nuevo, la corriente de desplazamiento, y reunió todo el electromagnetismo en cuatro ecuaciones. De ellas se desprende que la luz es una onda electromagnética. Junto con la fuerza de Lorentz, describen todos los fenómenos electromagnéticos clásicos.</p>

<section>
<h2>Una inconsistencia en la ley de Ampère</h2>
<p>Considere un condensador que se está cargando con una corriente \(I\). Aplique la ley de Ampère a una curva \(C\) que rodea el cable. Si la superficie que limita \(C\) es un disco atravesado por el cable, \(I_{\text{enc}}=I\); pero si se elige una superficie en forma de bolsa que pasa entre las placas, ninguna corriente la atraviesa e \(I_{\text{enc}}=0\). La ley de Ampère da dos respuestas distintas para la misma curva.</p>
<p>El problema aparece también en forma diferencial: la divergencia de un rotacional es cero, de modo que \(\curl\vb{B}=\mo\vb{J}\) exige \(\divg\vb{J}=0\). Pero la ecuación de continuidad dice que \(\divg\vb{J}=-\partial\rho_v/\partial t\), que no es cero mientras la carga de las placas cambia.</p>
</section>

<section>
<h2>La corriente de desplazamiento</h2>
<p>Usando la ley de Gauss, \(\partial\rho_v/\partial t=\eo\,\divg(\partial\vb{E}/\partial t)\), de modo que la combinación \(\vb{J}+\eo\,\partial\vb{E}/\partial t\) siempre tiene divergencia nula. Maxwell propuso</p>
<div class="eq key" data-name="Ley de Ampère–Maxwell">\[\curl\vb{B}=\mo\vb{J}+\mo\eo\pdv{\vb{E}}{t},\qquad \oint_C\vb{B}\cdot\dd\vb{l}=\mo\left(I_{\text{enc}}+\eo\odv{\Phi_E}{t}\right).\]</div>
<p>El término \(\vb{J}_d=\eo\,\partial\vb{E}/\partial t\) se llama <span class="term">corriente de desplazamiento</span>. Entre las placas del condensador, el campo eléctrico crece y \(I_d=\eo\,\dd\Phi_E/\dd t=I\): la corriente de desplazamiento continúa exactamente a la corriente de conducción y las dos superficies dan el mismo resultado. Un campo eléctrico variable produce un campo magnético, así como un campo magnético variable produce uno eléctrico (Faraday).</p>
<div class="sim" data-sim="displacement-current" data-title="Corriente de desplazamiento en un condensador que se carga"></div>
<div class="sim-guide"><ul>
<li>Entre las placas, \(B\) crece linealmente con \(r\) hasta el borde y luego decae como \(1/r\): exactamente como dentro y fuera de un hilo grueso por el que circula \(I_d\).</li>
<li>Compare las dos superficies de Ampère: la plana cuenta \(I\); la bolsa entre las placas cuenta \(I_d\). Son iguales en todo instante.</li>
</ul></div>
</section>

<section>
<h2>Las cuatro ecuaciones</h2>
<div class="tablewrap"><table>
<tr><th>Nombre</th><th>Forma integral</th><th>Forma diferencial</th><th>Contenido físico</th></tr>
<tr><td>Ley de Gauss</td><td>\(\oint_S\vb{E}\cdot\dd\vb{A}=\dfrac{Q_{\text{enc}}}{\eo}\)</td><td>\(\divg\vb{E}=\dfrac{\rho_v}{\eo}\)</td><td>Las cargas son fuentes de \(\vb{E}\)</td></tr>
<tr><td>Gauss magnética</td><td>\(\oint_S\vb{B}\cdot\dd\vb{A}=0\)</td><td>\(\divg\vb{B}=0\)</td><td>No hay monopolos magnéticos</td></tr>
<tr><td>Ley de Faraday</td><td>\(\oint_C\vb{E}\cdot\dd\vb{l}=-\dfrac{\dd}{\dd t}\displaystyle\int_S\vb{B}\cdot\dd\vb{A}\)</td><td>\(\curl\vb{E}=-\pdv{\vb{B}}{t}\)</td><td>\(\vb{B}\) variable crea \(\vb{E}\)</td></tr>
<tr><td>Ley de Ampère–Maxwell</td><td>\(\oint_C\vb{B}\cdot\dd\vb{l}=\mo I_{\text{enc}}+\mo\eo\dfrac{\dd}{\dd t}\displaystyle\int_S\vb{E}\cdot\dd\vb{A}\)</td><td>\(\curl\vb{B}=\mo\vb{J}+\mo\eo\pdv{\vb{E}}{t}\)</td><td>Corrientes y \(\vb{E}\) variable crean \(\vb{B}\)</td></tr>
</table></div>
<p>Completan la teoría la fuerza de Lorentz, \(\vb{F}=q(\vb{E}+\vb{v}\times\vb{B})\), que dice cómo actúan los campos sobre las cargas, y la conservación de la carga, que ya está contenida en las ecuaciones (tome la divergencia de Ampère–Maxwell y use Gauss). Las ecuaciones son lineales: vale la superposición. En ausencia de cargas y corrientes son casi simétricas entre \(\vb{E}\) y \(\vb{B}\); la asimetría restante refleja que no se han observado monopolos magnéticos.</p>
<div class="box note"><p>Maxwell calculó la velocidad de las ondas predichas por sus ecuaciones, \(1/\sqrt{\mo\eo}\), y obtuvo \(3.1\times10^8\) m/s, muy cerca de la velocidad medida de la luz. Escribió: “difícilmente podemos evitar la conclusión de que la luz consiste en ondulaciones transversales del mismo medio que es la causa de los fenómenos eléctricos y magnéticos”. Hertz confirmó las ondas electromagnéticas en 1887.</p></div>
</section>

<section>
<h2>Ecuaciones de Maxwell en la materia</h2>
<p>Separando las cargas y corrientes libres de las ligadas (\(\rho_b=-\divg\vb{P}\), \(\vb{J}_b=\curl\vb{M}\) y la corriente de polarización \(\vb{J}_p=\partial\vb{P}/\partial t\)):</p>
<div class="eq key" data-name="Maxwell en medios">\[\divg\vb{D}=\rho_f,\qquad \divg\vb{B}=0,\qquad \curl\vb{E}=-\pdv{\vb{B}}{t},\qquad \curl\vb{H}=\vb{J}_f+\pdv{\vb{D}}{t},\]</div>
<p>con las relaciones constitutivas \(\vb{D}=\varepsilon\vb{E}\), \(\vb{B}=\mu\vb{H}\) y \(\vb{J}_f=\sigma\vb{E}\) en medios lineales. Las condiciones de frontera generales son:</p>
<div class="tablewrap narrow"><table>
<tr><th>Componente</th><th>Condición (\(\uv{n}\) de 2 hacia 1)</th></tr>
<tr><td>Normal de \(\vb{D}\)</td><td>\(D_{1n}-D_{2n}=\sigma_f\)</td></tr>
<tr><td>Normal de \(\vb{B}\)</td><td>\(B_{1n}=B_{2n}\)</td></tr>
<tr><td>Tangencial de \(\vb{E}\)</td><td>\(\vb{E}_{1t}=\vb{E}_{2t}\)</td></tr>
<tr><td>Tangencial de \(\vb{H}\)</td><td>\(\uv{n}\times(\vb{H}_1-\vb{H}_2)=\vb{K}_f\)</td></tr>
</table></div>
</section>

<section>
<h2>Potenciales electromagnéticos</h2>
<p>Como \(\divg\vb{B}=0\), sigue siendo \(\vb{B}=\curl\vb{A}\). Pero ahora \(\curl\vb{E}\ne\vb{0}\); de Faraday, \(\curl(\vb{E}+\partial\vb{A}/\partial t)=\vb{0}\), y por tanto</p>
<div class="eq key" data-name="Potenciales">\[\vb{E}=-\nabla V-\pdv{\vb{A}}{t},\qquad \vb{B}=\curl\vb{A}.\]</div>
<p>Los potenciales no son únicos: la transformación de gauge \(\vb{A}\to\vb{A}+\nabla\lambda\), \(V\to V-\partial\lambda/\partial t\) deja los campos invariantes. En el <em>gauge de Lorenz</em>, \(\divg\vb{A}+\mo\eo\,\partial V/\partial t=0\), las ecuaciones de Maxwell se convierten en ecuaciones de onda con fuentes:</p>
<div class="eq">\[\lap V-\frac{1}{c^2}\frac{\partial^2V}{\partial t^2}=-\frac{\rho_v}{\eo},\qquad \lap\vb{A}-\frac{1}{c^2}\frac{\partial^2\vb{A}}{\partial t^2}=-\mo\vb{J}.\]</div>
<p>Sus soluciones son los <em>potenciales retardados</em>, en los que las fuentes se evalúan en el tiempo retardado \(t-R/c\): la información viaja a la velocidad de la luz (capítulo 23).</p>
</section>

<section>
<h2>Energía electromagnética: el teorema de Poynting</h2>
<p>El trabajo por unidad de tiempo que los campos hacen sobre las cargas en un volumen es \(\int\vb{J}\cdot\vb{E}\,\dd V\). Eliminando \(\vb{J}\) con Ampère–Maxwell y usando la identidad \(\divg(\vb{E}\times\vb{H})=\vb{H}\cdot\curl\vb{E}-\vb{E}\cdot\curl\vb{H}\):</p>
<div class="eq key" data-name="Teorema de Poynting">\[-\odv{}{t}\int_V u\,\dd V=\oint_S\vb{S}\cdot\dd\vb{A}+\int_V\vb{J}\cdot\vb{E}\,\dd V,\qquad u=\frac12\left(\eo E^2+\frac{B^2}{\mo}\right),\qquad \vb{S}=\vb{E}\times\vb{H}=\frac{1}{\mo}\vb{E}\times\vb{B}.\]</div>
<p>La energía que se pierde en el volumen sale por su superficie (flujo del <span class="term">vector de Poynting</span> \(\vb{S}\), en W/m²) o se entrega a las cargas. Un resultado sorprendente: en un hilo con corriente, la energía que se disipa como calor no viaja por dentro del cable sino que entra por su superficie lateral desde el campo que lo rodea.</p>
<div class="box ex">
<h4>Energía que entra en un resistor</h4>
<p>Un hilo de radio \(a\) y longitud \(L\), con resistencia \(R\), lleva una corriente \(I\) con una caída de tensión \(V=IR\). Calcule el flujo de \(\vb{S}\) a través de su superficie.</p>
<details><summary>Solución</summary>
<p>En la superficie, \(\vb{E}=(V/L)\uv{z}\) (a lo largo del hilo) y \(\vb{B}=\dfrac{\mo I}{2\pi a}\uv{\phi}\). Entonces \(\vb{S}=\dfrac{1}{\mo}\vb{E}\times\vb{B}=-\dfrac{VI}{2\pi aL}\uv{\rho}\), dirigido hacia el eje. El flujo entrante es \(S\cdot2\pi aL=VI=I^2R\): exactamente la potencia disipada.</p>
</details>
</div>
<div class="sim" data-sim="poynting" data-title="Flujo de energía: vector de Poynting en un resistor y en un condensador"></div>
<div class="sim-guide"><ul>
<li>Resistor: \(\vb{E}\) va a lo largo del hilo, \(\vb{B}\) lo rodea y \(\vb{S}\) apunta radialmente hacia dentro.</li>
<li>Condensador que se carga: la energía entra por el borde entre las placas; su flujo es \(\dd U/\dd t\).</li>
</ul></div>
<p>El campo también transporta momento lineal, con densidad \(\vb{g}=\vb{S}/c^2\), y momento angular. Por eso la luz ejerce presión sobre las superficies que ilumina (capítulo 20).</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un condensador de placas circulares de 5 cm de radio se carga con 2 A. Halle \(\dd E/\dd t\) entre las placas y \(B\) a 3 cm y a 8 cm del eje.
<details><summary>Respuesta</summary><p>\(\dd E/\dd t=I/(\eo\pi R^2)=2.88\times10^{13}\) V/(m·s). \(B(3\text{ cm})=\mo Ir/(2\pi R^2)=4.8\ \mu\)T; \(B(8\text{ cm})=\mo I/(2\pi r)=5.0\ \mu\)T.</p></details></li>
<li><span class="lvl">Intermedio</span>En un medio con \(\sigma=4\) S/m y \(\varepsilon_r=80\) (agua de mar), ¿a qué frecuencia la corriente de desplazamiento iguala a la de conducción?
<details><summary>Respuesta</summary><p>\(\sigma=\omega\varepsilon\Rightarrow f=\sigma/(2\pi\varepsilon)=899\) MHz.</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que las ecuaciones de Maxwell implican la ecuación de continuidad.
<details><summary>Respuesta</summary><p>Tome la divergencia de Ampère–Maxwell: \(0=\mo\divg\vb{J}+\mo\eo\,\partial(\divg\vb{E})/\partial t=\mo(\divg\vb{J}+\partial\rho_v/\partial t)\).</p></details></li>
<li><span class="lvl">Avanzado</span>Un condensador de placas circulares (radio \(R\), separación \(d\)) se carga lentamente. Demuestre que el flujo del vector de Poynting por la superficie lateral entre las placas es igual a \(\dd U/\dd t\).
<details><summary>Respuesta</summary><p>En \(r=R\): \(B=\frac{\mo\eo R}{2}\dot E\), \(S=\frac{\eo R}{2}E\dot E\) hacia dentro; flujo \(S\cdot2\pi Rd=\eo E\dot E\,\pi R^2d=\frac{\dd}{\dd t}\left(\tfrac12\eo E^2\pi R^2d\right)\).</p></details></li>
<li><span class="lvl">Avanzado</span>Verifique que la transformación de gauge \(\vb{A}\to\vb{A}+\nabla\lambda\), \(V\to V-\partial\lambda/\partial t\) no cambia \(\vb{E}\) ni \(\vb{B}\).
<details><summary>Respuesta</summary><p>\(\curl\nabla\lambda=\vb{0}\); \(-\nabla(-\dot\lambda)-\partial_t\nabla\lambda=\vb{0}\).</p></details></li>
</ol>
</section>
