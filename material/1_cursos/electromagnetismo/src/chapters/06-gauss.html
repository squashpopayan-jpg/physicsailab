<template class="chapter-src" data-id="gauss" data-num="6" data-title="Ley de Gauss" data-part="Parte II · Electrostática" data-short="Flujo eléctrico, ley de Gauss, simetrías y conductores en equilibrio">
<p class="lead">La ley de Gauss relaciona el flujo del campo eléctrico a través de una superficie cerrada con la carga que encierra. Es equivalente a la ley de Coulomb para cargas en reposo, pero mucho más general: es una de las cuatro ecuaciones de Maxwell. Cuando el problema tiene simetría, permite calcular el campo en una línea.</p>

<section>
<h2>Flujo eléctrico</h2>
<p>El <span class="term">flujo eléctrico</span> a través de una superficie mide “cuánto campo la atraviesa”. Para una superficie plana de área \(A\) en un campo uniforme, con \(\uv{n}\) formando un ángulo \(\theta\) con \(\vb{E}\), y en general:</p>
<div class="eq key" data-name="Flujo eléctrico">\[\Phi_E=EA\cos\theta=\vb{E}\cdot\vb{A},\qquad \Phi_E=\int_S\vb{E}\cdot\dd\vb{A}\quad[\mathrm{N\,m^2/C}].\]</div>
<p>El flujo es máximo cuando la superficie es perpendicular al campo (\(\theta=0\)), nulo cuando el campo es paralelo a ella (\(\theta=90^\circ\)) y negativo cuando el campo atraviesa la superficie en sentido opuesto a \(\uv{n}\). Para una superficie cerrada se toma siempre la normal <strong>hacia afuera</strong>: el flujo saliente es positivo y el entrante negativo. Intuitivamente, el flujo es proporcional al número neto de líneas de campo que atraviesan la superficie.</p>
<div class="sim" data-sim="flux-surface" data-title="Flujo de un campo uniforme a través de una superficie"></div>
<div class="sim-guide"><ul>
<li>Incline la superficie: el flujo es igual al campo por el área de la “sombra” de la superficie sobre un plano perpendicular a \(\vb{E}\), es decir, \(A\cos\theta\).</li>
<li>En el modo cubo, el flujo neto de un campo uniforme a través de cualquier superficie cerrada es cero: lo que entra por una cara sale por otra.</li>
</ul></div>
</section>

<section>
<h2>La ley de Gauss</h2>
<div class="eq key" data-name="Ley de Gauss">\[\oint_S\vb{E}\cdot\dd\vb{A}=\frac{Q_{\text{enc}}}{\eo}.\]</div>
<p>El flujo del campo eléctrico a través de <em>cualquier</em> superficie cerrada es igual a la carga neta encerrada dividida por \(\eo\).</p>
<h3>Deducción desde la ley de Coulomb</h3>
<p>Para una carga puntual \(q\) en el origen y una esfera de radio \(r\) centrada en ella, \(\vb{E}\) es radial y de magnitud constante sobre la esfera: \(\Phi=\dfrac{q}{4\pi\eo r^2}\cdot4\pi r^2=q/\eo\). El radio se cancela porque el campo decae como \(1/r^2\) mientras el área crece como \(r^2\).</p>
<p>Para una superficie cerrada arbitraria, cada elemento \(\dd\vb{A}\) aporta \(\dd\Phi=\dfrac{q}{4\pi\eo}\dfrac{\uv{r}\cdot\dd\vb{A}}{r^2}=\dfrac{q}{4\pi\eo}\dd\Omega\), donde \(\dd\Omega\) es el ángulo sólido que subtiende. Si la carga está dentro, el ángulo sólido total es \(4\pi\) y \(\Phi=q/\eo\). Si está fuera, cada cono que entra en la superficie vuelve a salir: las contribuciones se cancelan y \(\Phi=0\). Por superposición, el resultado vale para cualquier distribución.</p>
<div class="box warn"><h4>Qué dice y qué no dice la ley de Gauss</h4>
<ul>
<li>El campo \(\vb{E}\) en la integral es el campo <em>total</em>, producido por todas las cargas, dentro y fuera de \(S\). Sólo el <em>flujo neto</em> depende únicamente de la carga interior.</li>
<li>\(\Phi=0\) no implica \(\vb{E}=\vb{0}\) sobre la superficie: significa que entra tanto como sale.</li>
<li>La ley siempre es cierta, pero sólo permite despejar \(E\) cuando la simetría garantiza que \(E\) es constante sobre la superficie (o sobre partes de ella) y que \(\vb{E}\) es paralelo o perpendicular a \(\dd\vb{A}\).</li>
</ul></div>
<div class="sim" data-sim="gauss-2d" data-title="Flujo a través de una curva cerrada deformable"></div>
<div class="sim-guide"><ul>
<li>Deforme la superficie arrastrando sus puntos de control: mientras las cargas encerradas no cambien, el flujo no cambia.</li>
<li>Saque una carga de la superficie: su contribución al flujo neto desaparece, aunque sigue modificando el campo en cada punto de la superficie.</li>
<li>Las cargas son líneas infinitas perpendiculares a la pantalla y la superficie es un cilindro de altura unidad: la ley de Gauss se aplica al flujo por unidad de longitud, \(\oint\vb{E}\cdot\uv{n}\,\dd l=\lambda_{\text{enc}}/\eo\).</li>
</ul></div>
</section>

<section>
<h2>Aplicaciones con simetría</h2>
<p>El procedimiento es siempre el mismo: (1) usar la simetría para determinar la dirección de \(\vb{E}\) y de qué coordenada depende; (2) elegir una superficie gaussiana sobre la que \(E\) sea constante y perpendicular, o paralelo, a la superficie; (3) calcular la carga encerrada; (4) despejar \(E\).</p>
<h3>Simetría esférica</h3>
<p>Superficie gaussiana: esfera concéntrica de radio \(r\), sobre la cual \(\oint\vb{E}\cdot\dd\vb{A}=E(r)\,4\pi r^2\). Así \(E(r)=\dfrac{Q_{\text{enc}}(r)}{4\pi\eo r^2}\).</p>
<ul>
<li><strong>Cascarón esférico</strong> de radio \(R\) con carga \(Q\): \(E=0\) dentro, \(E=Q/(4\pi\eo r^2)\) fuera. El exterior es idéntico al de una carga puntual en el centro.</li>
<li><strong>Esfera maciza uniforme</strong> (\(\rho_v=3Q/4\pi R^3\)): dentro \(Q_{\text{enc}}=Q\,r^3/R^3\) y</li>
</ul>
<div class="eq key" data-name="Esfera uniforme">\[E(r)=\begin{cases}\dfrac{Q\,r}{4\pi\eo R^3}, & r\le R,\\ \dfrac{Q}{4\pi\eo r^2}, & r\ge R.\end{cases}\]</div>
<p>El campo crece linealmente dentro, es máximo en la superficie y decae como \(1/r^2\) fuera. Es continuo en \(r=R\) porque no hay carga superficial.</p>
<h3>Simetría cilíndrica</h3>
<p>Superficie gaussiana: cilindro coaxial de radio \(\rho\) y longitud \(\ell\). Por las tapas no hay flujo (\(\vb{E}\) es radial); por la cara lateral, \(E\,2\pi\rho\ell\). Para una línea infinita de densidad \(\lambda\):</p>
<div class="eq key" data-name="Línea o cilindro cargado (exterior)">\[E=\frac{\lambda}{2\pi\eo\rho}.\]</div>
<p>Dentro de un cilindro macizo uniforme de radio \(R\), \(E=\lambda\rho/(2\pi\eo R^2)\). En un cable coaxial con \(+\lambda\) en el conductor interior y \(-\lambda\) en el exterior, el campo sólo existe entre los conductores.</p>
<h3>Simetría plana</h3>
<p>Superficie gaussiana: “caja de píldoras”, un cilindro corto de tapas \(A\) que atraviesa el plano. Sólo hay flujo por las tapas: \(2EA=\sigma A/\eo\), luego</p>
<div class="eq key" data-name="Plano infinito">\[E=\frac{\sigma}{2\eo}.\]</div>
<p>Dos planos paralelos con \(+\sigma\) y \(-\sigma\) (condensador ideal): los campos se suman entre las placas, \(E=\sigma/\eo\), y se cancelan fuera.</p>
<div class="sim" data-sim="gauss-symmetry" data-title="Superficies gaussianas y el campo E(r)"></div>
<div class="sim-guide"><ul>
<li>Recorra la superficie gaussiana de dentro hacia fuera: el flujo es proporcional a la carga encerrada y \(E\) se obtiene dividiendo por el área.</li>
<li>Compare la esfera maciza uniforme con la de densidad \(\rho_v\propto r\): fuera son idénticas; dentro, \(E\propto r\) frente a \(E\propto r^2\).</li>
<li>En el cable coaxial y en el par de planos el campo exterior es nulo porque la carga encerrada total es cero.</li>
</ul></div>
<div class="box ex">
<h4>Esfera con densidad no uniforme</h4>
<p>Una esfera de radio \(R\) tiene \(\rho_v=\rho_0\,r/R\). Halle su carga total y el campo dentro y fuera.</p>
<details><summary>Solución</summary>
<p>\(Q_{\text{enc}}(r)=\int_0^r\rho_0\frac{r'}{R}4\pi r'^2\dd r'=\frac{\pi\rho_0r^4}{R}\), de modo que \(Q=\pi\rho_0R^3\). Dentro, \(E=\dfrac{Q_{\text{enc}}}{4\pi\eo r^2}=\dfrac{\rho_0r^2}{4\eo R}=\dfrac{Q\,r^2}{4\pi\eo R^4}\); fuera, \(E=\dfrac{Q}{4\pi\eo r^2}\).</p>
</details>
</div>
</section>

<section>
<h2>Conductores en equilibrio electrostático</h2>
<p>En un conductor las cargas libres se mueven mientras exista campo en su interior. En el equilibrio (alcanzado en tiempos del orden de \(10^{-19}\) s en un metal) se cumplen cuatro propiedades:</p>
<ol>
<li><strong>\(\vb{E}=\vb{0}\) en el interior del conductor.</strong></li>
<li><strong>Toda la carga neta está en la superficie.</strong> Aplicando la ley de Gauss a una superficie justo dentro del conductor, donde \(\vb{E}=\vb{0}\), la carga encerrada es cero.</li>
<li><strong>Justo fuera, el campo es perpendicular a la superficie y vale</strong></li>
</ol>
<div class="eq key" data-name="Campo en la superficie de un conductor">\[\vb{E}=\frac{\sigma}{\eo}\,\uv{n}.\]</div>
<p>(Se obtiene con una caja de píldoras que atraviesa la superficie: sólo la tapa exterior tiene flujo.) Una componente tangencial movería las cargas superficiales, lo que contradice el equilibrio.</p>
<ol start="4">
<li><strong>El conductor es un volumen equipotencial.</strong> Como \(\vb{E}=\vb{0}\) dentro, la integral \(\int\vb{E}\cdot\dd\vb{l}\) entre dos puntos cualesquiera del conductor es nula.</li>
</ol>
<p>En un conductor de forma irregular la carga se acumula en las zonas de menor radio de curvatura: \(\sigma\) y el campo exterior son mayores en las puntas. Allí el aire se ioniza primero (efecto corona), principio del pararrayos. Si el conductor tiene una cavidad sin cargas en su interior, el campo en la cavidad es cero aunque haya campos externos: es la <span class="term">jaula de Faraday</span>.</p>
<div class="sim" data-sim="conductor-tip" data-title="Distribución de carga en conductores: el efecto de las puntas"></div>
<div class="sim-guide"><ul>
<li>En la gota, la densidad de carga (banda de color) y la densidad de líneas son máximas en la punta.</li>
<li>En “dos esferas unidas”, ambas están al mismo potencial y la pequeña tiene mayor \(\sigma\). Para esferas reales, \(\sigma_1/\sigma_2=R_2/R_1\); la simulación es bidimensional (su sección corresponde a cilindros largos), por lo que la razón es algo menor, pero la tendencia es la misma.</li>
<li>El campo es siempre perpendicular a la superficie del conductor y las equipotenciales cercanas copian su forma.</li>
</ul></div>
</section>

<section>
<h2>Forma diferencial de la ley de Gauss</h2>
<p>Aplicando el teorema de la divergencia al primer miembro y escribiendo \(Q_{\text{enc}}=\int_V\rho_v\,\dd V\):</p>
<div class="eq">\[\int_V(\divg\vb{E})\,\dd V=\int_V\frac{\rho_v}{\eo}\,\dd V\quad\text{para todo }V\quad\Longrightarrow\quad \boxed{\divg\vb{E}=\frac{\rho_v}{\eo}}.\]</div>
<p>Es la primera ecuación de Maxwell en forma local: la densidad de carga es la fuente del campo eléctrico. Con \(\vb{E}=-\nabla V\) conduce a la ecuación de Poisson \(\lap V=-\rho_v/\eo\).</p>
<div class="box ex">
<h4>De vuelta a la densidad</h4>
<p>Dentro de una esfera, \(\vb{E}=\dfrac{Q\,r}{4\pi\eo R^3}\uv{r}\). Verifique que \(\divg\vb{E}=\rho_v/\eo\).</p>
<details><summary>Solución</summary>
<p>\(\divg\vb{E}=\frac{1}{r^2}\pdv{}{r}\left(r^2\frac{Qr}{4\pi\eo R^3}\right)=\frac{3Q}{4\pi\eo R^3}=\frac{\rho_v}{\eo}\) con \(\rho_v=\frac{3Q}{4\pi R^3}\). ✔</p>
</details>
</div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una carga de \(5\ \mu\)C está en el centro de un cubo de 20 cm de arista. Halle el flujo por el cubo completo y por una cara.
<details><summary>Respuesta</summary><p>\(\Phi=q/\eo=5.65\times10^5\) N·m²/C; por cara, \(9.41\times10^4\) N·m²/C.</p></details></li>
<li><span class="lvl">Básico</span>Un campo uniforme de 300 N/C atraviesa un disco de radio 10 cm cuya normal forma \(30^\circ\) con el campo. Halle el flujo.
<details><summary>Respuesta</summary><p>\(\Phi=EA\cos30^\circ=8.16\) N·m²/C.</p></details></li>
<li><span class="lvl">Intermedio</span>Un cascarón esférico conductor (radios 10 y 20 cm) tiene carga neta \(+3\ \mu\)C y en su centro hay una carga puntual \(-1\ \mu\)C. Halle la carga en cada superficie y \(E\) en \(r=5\), 15 y 30 cm.
<details><summary>Respuesta</summary><p>Interior: \(+1\ \mu\)C; exterior: \(+2\ \mu\)C. \(E(5)=3.60\times10^6\) N/C hacia adentro; \(E(15)=0\); \(E(30)=2.00\times10^5\) N/C hacia afuera.</p></details></li>
<li><span class="lvl">Intermedio</span>Un cilindro infinito de radio \(R\) tiene \(\rho_v=\rho_0(1-\rho/R)\). Halle \(E\) dentro y fuera.
<details><summary>Respuesta</summary><p>Dentro: \(E=\dfrac{\rho_0}{\eo}\left(\dfrac{\rho}{2}-\dfrac{\rho^2}{3R}\right)\). Fuera: \(E=\dfrac{\rho_0R^2}{6\eo\rho}\).</p></details></li>
<li><span class="lvl">Intermedio</span>Una lámina infinita de espesor \(2d\) tiene densidad uniforme \(\rho_v\). Halle \(E(x)\).
<details><summary>Respuesta</summary><p>\(E=\rho_vx/\eo\) para \(\abs{x}\le d\); \(E=\pm\rho_vd/\eo\) fuera.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que el campo dentro de una cavidad esférica excéntrica, practicada en una esfera de densidad uniforme \(\rho_v\), es uniforme e igual a \(\rho_v\vb{a}/(3\eo)\), donde \(\vb{a}\) va del centro de la esfera al de la cavidad.
<details><summary>Respuesta</summary><p>Superponga la esfera completa (\(\rho_v\vb{r}/3\eo\)) y una esfera de densidad \(-\rho_v\) en la cavidad (\(-\rho_v(\vb{r}-\vb{a})/3\eo\)).</p></details></li>
<li><span class="lvl">Avanzado</span>El campo en una región es \(\vb{E}=kr^3\,\uv{r}\) (esféricas). Halle la densidad de carga y la carga encerrada en una esfera de radio \(a\).
<details><summary>Respuesta</summary><p>\(\rho_v=\eo\divg\vb{E}=5\eo kr^2\); \(Q=4\pi\eo ka^5\) (igual a \(\eo E(a)\,4\pi a^2\)).</p></details></li>
</ol>
</section>
