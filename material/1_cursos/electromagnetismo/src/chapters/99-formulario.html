<section>
<h2>Operadores vectoriales</h2>
<p><b>Cartesianas</b> \((x,y,z)\):</p>
<div class="eq">\[\grad f=\pdv{f}{x}\uv x+\pdv{f}{y}\uv y+\pdv{f}{z}\uv z,\qquad \divg\vb A=\pdv{A_x}{x}+\pdv{A_y}{y}+\pdv{A_z}{z},\]
\[\curl\vb A=\left(\pdv{A_z}{y}-\pdv{A_y}{z}\right)\uv x+\left(\pdv{A_x}{z}-\pdv{A_z}{x}\right)\uv y+\left(\pdv{A_y}{x}-\pdv{A_x}{y}\right)\uv z,\]\[\lap f=\frac{\partial^2f}{\partial x^2}+\frac{\partial^2f}{\partial y^2}+\frac{\partial^2f}{\partial z^2}.\]</div>
<p><b>Cilíndricas</b> \((\rho,\phi,z)\):</p>
<div class="eq">\[\grad f=\pdv{f}{\rho}\uv\rho+\frac1\rho\pdv{f}{\phi}\uv\phi+\pdv{f}{z}\uv z,\]\[\divg\vb A=\frac1\rho\pdv{(\rho A_\rho)}{\rho}+\frac1\rho\pdv{A_\phi}{\phi}+\pdv{A_z}{z},\]
\[\curl\vb A=\left(\frac1\rho\pdv{A_z}{\phi}-\pdv{A_\phi}{z}\right)\uv\rho+\left(\pdv{A_\rho}{z}-\pdv{A_z}{\rho}\right)\uv\phi+\frac1\rho\left(\pdv{(\rho A_\phi)}{\rho}-\pdv{A_\rho}{\phi}\right)\uv z,\]
\[\lap f=\frac1\rho\pdv{}{\rho}\left(\rho\pdv{f}{\rho}\right)+\frac1{\rho^2}\frac{\partial^2f}{\partial\phi^2}+\frac{\partial^2f}{\partial z^2}.\]</div>
<p><b>Esféricas</b> \((r,\theta,\phi)\):</p>
<div class="eq">\[\grad f=\pdv{f}{r}\uv r+\frac1r\pdv{f}{\theta}\uv\theta+\frac1{r\sen\theta}\pdv{f}{\phi}\uv\phi,\]\[\divg\vb A=\frac1{r^2}\pdv{(r^2A_r)}{r}+\frac1{r\sen\theta}\pdv{(\sen\theta\,A_\theta)}{\theta}+\frac1{r\sen\theta}\pdv{A_\phi}{\phi},\]
\[\curl\vb A=\frac1{r\sen\theta}\left(\pdv{(\sen\theta\,A_\phi)}{\theta}-\pdv{A_\theta}{\phi}\right)\uv r+\frac1r\left(\frac1{\sen\theta}\pdv{A_r}{\phi}-\pdv{(rA_\phi)}{r}\right)\uv\theta+\frac1r\left(\pdv{(rA_\theta)}{r}-\pdv{A_r}{\theta}\right)\uv\phi,\]
\[\lap f=\frac1{r^2}\pdv{}{r}\left(r^2\pdv{f}{r}\right)+\frac1{r^2\sen\theta}\pdv{}{\theta}\left(\sen\theta\pdv{f}{\theta}\right)+\frac1{r^2\sen^2\theta}\frac{\partial^2f}{\partial\phi^2}.\]</div>
<p>Elementos de longitud, superficie y volumen: \(\dd\vb l=\dd x\,\uv x+\dd y\,\uv y+\dd z\,\uv z=\dd\rho\,\uv\rho+\rho\dd\phi\,\uv\phi+\dd z\,\uv z=\dd r\,\uv r+r\dd\theta\,\uv\theta+r\sen\theta\dd\phi\,\uv\phi\), y \(\dd\tau=\dd x\dd y\dd z=\rho\dd\rho\dd\phi\dd z=r^2\sen\theta\dd r\dd\theta\dd\phi\). Las deducciones están en el capítulo 2.</p>
<p><b>Identidades</b>:</p>
<div class="eq">\[\curl(\grad f)=0,\qquad \divg(\curl\vb A)=0,\qquad \curl(\curl\vb A)=\grad(\divg\vb A)-\lap\vb A,\]
\[\divg(f\vb A)=f\,\divg\vb A+\vb A\cdot\grad f,\qquad \curl(f\vb A)=f\,\curl\vb A+\grad f\times\vb A,\]\[\divg(\vb A\times\vb B)=\vb B\cdot(\curl\vb A)-\vb A\cdot(\curl\vb B).\]</div>
<p><b>Teoremas fundamentales</b>:</p>
<div class="eq">\[\int_a^b\grad f\cdot\dd\vb l=f(b)-f(a),\qquad \int_V\divg\vb A\,\dd\tau=\oint_S\vb A\cdot\dd\vb S,\qquad \int_S(\curl\vb A)\cdot\dd\vb S=\oint_C\vb A\cdot\dd\vb l .\]</div>
</section>

<section>
<h2>Leyes fundamentales</h2>
<div class="tablewrap"><table>
<tr><th>Ley</th><th class="c">Forma diferencial</th><th class="c">Forma integral</th></tr>
<tr><td>Gauss</td><td class="c">\(\divg\vb D=\rho_v\)</td><td class="c">\(\oint_S\vb D\cdot\dd\vb S=Q_\text{libre,int}\)</td></tr>
<tr><td>Gauss magnética</td><td class="c">\(\divg\vb B=0\)</td><td class="c">\(\oint_S\vb B\cdot\dd\vb S=0\)</td></tr>
<tr><td>Faraday</td><td class="c">\(\curl\vb E=-\pdv{\vb B}{t}\)</td><td class="c">\(\oint_C\vb E\cdot\dd\vb l=-\dfrac{\dd}{\dd t}\int_S\vb B\cdot\dd\vb S\)</td></tr>
<tr><td>Ampère–Maxwell</td><td class="c">\(\curl\vb H=\vb J+\pdv{\vb D}{t}\)</td><td class="c">\(\oint_C\vb H\cdot\dd\vb l=I_\text{libre}+\dfrac{\dd}{\dd t}\int_S\vb D\cdot\dd\vb S\)</td></tr>
</table></div>
<ul>
<li><b>Relaciones constitutivas</b> (medios lineales e isótropos): \(\vb D=\eo\vb E+\vb P=\varepsilon\vb E\), \(\vb B=\mo(\vb H+\vb M)=\mu\vb H\), \(\vb J=\sigma\vb E\), con \(\varepsilon=\eo(1+\chi_e)\) y \(\mu=\mo(1+\chi_m)\).</li>
<li><b>Fuerza de Lorentz</b>: \(\vb F=q(\vb E+\vb v\times\vb B)\). <b>Continuidad</b>: \(\divg\vb J+\partial\rho_v/\partial t=0\).</li>
<li><b>Energía</b>: \(u=\tfrac12(\vb E\cdot\vb D+\vb B\cdot\vb H)\); vector de Poynting \(\vb S=\vb E\times\vb H\); teorema de Poynting \(-\dfrac{\dd}{\dd t}\int_Vu\dd\tau=\oint_S\vb S\cdot\dd\vb S+\int_V\vb J\cdot\vb E\dd\tau\).</li>
<li><b>Condiciones de frontera</b> (\(\uv n\) apunta del medio 2 al medio 1): \(\uv n\cdot(\vb D_1-\vb D_2)=\rho_s\), \(\uv n\times(\vb E_1-\vb E_2)=0\), \(\uv n\cdot(\vb B_1-\vb B_2)=0\), \(\uv n\times(\vb H_1-\vb H_2)=\vb K\).</li>
<li><b>Potenciales</b>: \(\vb B=\curl\vb A\), \(\vb E=-\grad V-\partial\vb A/\partial t\); en estática \(\lap V=-\rho_v/\varepsilon\) (Poisson) y \(\lap\vb A=-\mu\vb J\).</li>
</ul>
</section>
