<template class="chapter-src" data-id="inductancia" data-num="17" data-title="Inductancia y circuitos RL, LC y RLC" data-part="Parte V · Electrodinámica" data-short="Autoinducción, inducción mutua, energía magnética y circuitos con bobinas">
<p class="lead">Una corriente variable produce un flujo variable que induce una fem en el propio circuito y en los circuitos vecinos. Esa “inercia eléctrica” es la inductancia. Combinada con resistores y condensadores da lugar a transitorios exponenciales y a oscilaciones eléctricas, la base de los sintonizadores de radio y de los filtros.</p>

<section>
<h2>Autoinductancia</h2>
<p>Si por una bobina de \(N\) espiras circula una corriente \(I\), el flujo que la atraviesa es proporcional a \(I\) (en ausencia de materiales ferromagnéticos). La constante de proporcionalidad es la <span class="term">autoinductancia</span>:</p>
<div class="eq key" data-name="Autoinductancia">\[L=\frac{N\Phi_B}{I},\qquad \mathcal{E}_L=-L\odv It,\qquad 1\un{H}=1\un{Wb/A}=1\un{V\,s/A}.\]</div>
<p>La fem autoinducida se opone a los cambios de corriente (Lenz): una bobina no impide que circule corriente, sino que ésta cambie bruscamente. La inductancia depende sólo de la geometría (y del medio):</p>
<div class="tablewrap"><table>
<tr><th>Elemento</th><th>Inductancia</th></tr>
<tr><td>Solenoide largo (\(N\) espiras, área \(A\), longitud \(l\))</td><td>\(L=\dfrac{\mo N^2A}{l}\)</td></tr>
<tr><td>Toroide de sección rectangular (altura \(h\), radios \(a\), \(b\))</td><td>\(L=\dfrac{\mo N^2h}{2\pi}\ln\dfrac ba\)</td></tr>
<tr><td>Cable coaxial (por unidad de longitud)</td><td>\(\dfrac Ll=\dfrac{\mo}{2\pi}\ln\dfrac ba\)</td></tr>
<tr><td>Línea bifilar (hilos de radio \(a\) separados \(D\gg a\))</td><td>\(\dfrac Ll\approx\dfrac{\mo}{\pi}\ln\dfrac Da\)</td></tr>
</table></div>
<p>Con un núcleo de permeabilidad \(\mu_r\) la inductancia se multiplica por \(\mu_r\) (mientras el núcleo no se sature).</p>
</section>

<section>
<h2>Inductancia mutua</h2>
<p>Si la corriente \(I_1\) de un circuito produce un flujo \(\Phi_{21}\) en cada espira de un segundo circuito, se define la <span class="term">inductancia mutua</span></p>
<div class="eq key" data-name="Inductancia mutua">\[M_{21}=\frac{N_2\Phi_{21}}{I_1},\qquad \mathcal{E}_2=-M\odv{I_1}{t},\qquad M_{21}=M_{12}=M .\]</div>
<p>La igualdad \(M_{12}=M_{21}\) (reciprocidad) se deduce de la fórmula de Neumann, \(M=\dfrac{\mo}{4\pi}\oint\oint\dfrac{\dd\vb{l}_1\cdot\dd\vb{l}_2}{R}\), simétrica en los dos circuitos. El <span class="term">coeficiente de acoplamiento</span> \(k=M/\sqrt{L_1L_2}\le1\) mide qué fracción del flujo es compartida. Para dos espiras coaxiales de radios \(a\) y \(b\) separadas \(d\), la integral de Neumann da</p>
<div class="eq">\[M=\mo\sqrt{ab}\left[\left(\frac2k-k\right)K(k)-\frac2kE(k)\right],\qquad k^2=\frac{4ab}{(a+b)^2+d^2},\]</div>
<p>con \(K\) y \(E\) las integrales elípticas completas. Así funcionan los transformadores, los cargadores inalámbricos y las tarjetas sin contacto.</p>
<div class="sim" data-sim="mutual-coils" data-title="Inductancia mutua de dos espiras coaxiales"></div>
<div class="sim-guide"><ul>
<li>Separe las espiras: \(M\) cae rápidamente, como \(1/d^3\) cuando \(d\) es grande (acoplamiento dipolar).</li>
<li>Con espiras muy próximas y del mismo radio, \(M\) crece sin límite (en la aproximación de hilo delgado).</li>
</ul></div>
</section>

<section>
<h2>Energía magnética</h2>
<p>Para aumentar la corriente en una bobina hay que vencer su fem autoinducida: la fuente entrega la potencia \(LI\,\dd I/\dd t\). La energía almacenada al llevar la corriente de 0 a \(I\) es</p>
<div class="eq key" data-name="Energía magnética">\[U_B=\frac12LI^2,\qquad u_B=\frac{B^2}{2\mo}\ \ (\text{en el vacío}),\qquad u_B=\frac12\vb{B}\cdot\vb{H}\ \ (\text{en medios lineales}).\]</div>
<p>Para un solenoide, \(\tfrac12LI^2=\tfrac12\dfrac{\mo N^2A}{l}I^2=\dfrac{(\mo NI/l)^2}{2\mo}Al\): la energía es la densidad \(B^2/2\mo\) por el volumen. Un campo de 1 T almacena unos 400 kJ/m³.</p>
</section>

<section>
<h2>El circuito RL</h2>
<p>Al conectar una fuente \(\mathcal{E}\) a una resistencia \(R\) y una bobina \(L\) en serie, la ley de mallas da \(\mathcal{E}-iR-L\,\dd i/\dd t=0\). La corriente no puede saltar; crece exponencialmente:</p>
<div class="eq key" data-name="Circuito RL">\[i(t)=\frac{\mathcal{E}}{R}\left(1-e^{-t/\tau}\right),\qquad v_L=\mathcal{E}e^{-t/\tau},\qquad \tau=\frac LR .\]</div>
<p>Al retirar la fuente (cerrando el circuito sobre \(R\)), la corriente decae como \(i=I_0e^{-t/\tau}\) y la energía \(\tfrac12LI_0^2\) se disipa en la resistencia. Si en cambio se abre bruscamente el circuito, \(\dd i/\dd t\) es enorme y aparece una sobretensión: así funcionan las bobinas de encendido de los motores, y por eso los relés llevan un diodo en paralelo.</p>
<div class="sim" data-sim="rl-circuit" data-title="Establecimiento y extinción de la corriente en un circuito RL"></div>
</section>

<section>
<h2>Oscilaciones LC</h2>
<p>Un condensador cargado conectado a una bobina (sin resistencia) produce una corriente que carga el condensador con la polaridad opuesta, y así indefinidamente: \(L\,\ddot q+q/C=0\). Es un oscilador armónico:</p>
<div class="eq key" data-name="Circuito LC">\[q(t)=Q_0\cos(\omega_0t+\varphi),\qquad \omega_0=\frac{1}{\sqrt{LC}},\qquad \frac{q^2}{2C}+\frac12Li^2=\frac{Q_0^2}{2C}=\text{cte}.\]</div>
<p>La energía pasa del campo eléctrico del condensador al campo magnético de la bobina y viceversa, dos veces por período. La analogía mecánica es exacta: \(q\leftrightarrow x\), \(i\leftrightarrow v\), \(L\leftrightarrow m\), \(1/C\leftrightarrow k\).</p>
<div class="sim" data-sim="lc-oscillator" data-title="Oscilaciones en un circuito LC: intercambio de energía"></div>
<div class="sim-guide"><ul>
<li>Cuando la carga es máxima la corriente es nula y toda la energía está en el condensador; un cuarto de período después ocurre lo contrario.</li>
<li>Cuadruplique \(L\) o \(C\): el período se duplica.</li>
</ul></div>
</section>

<section>
<h2>El circuito RLC serie</h2>
<p>Con resistencia, \(L\ddot q+R\dot q+q/C=0\). Con \(\alpha=R/2L\) y \(\omega_0=1/\sqrt{LC}\) hay tres regímenes:</p>
<ul>
<li><strong>Subamortiguado</strong> (\(\alpha\lt\omega_0\)): \(q=Q_0e^{-\alpha t}\cos(\omega_dt+\varphi)\), con \(\omega_d=\sqrt{\omega_0^2-\alpha^2}\).</li>
<li><strong>Crítico</strong> (\(\alpha=\omega_0\), \(R=2\sqrt{L/C}\)): vuelve a cero lo más rápido posible sin oscilar.</li>
<li><strong>Sobreamortiguado</strong> (\(\alpha\gt\omega_0\)): suma de dos exponenciales decrecientes, sin oscilación.</li>
</ul>
<p>El <span class="term">factor de calidad</span> \(Q=\dfrac{\omega_0L}{R}=\dfrac1R\sqrt{\dfrac LC}\) indica cuántas oscilaciones ocurren antes de que la energía decaiga apreciablemente: la energía disminuye en un factor \(e^{-2\pi/Q}\) por ciclo.</p>
<div class="sim" data-sim="rlc-damped" data-title="Circuito RLC: regímenes de amortiguamiento"></div>
<div class="sim-guide"><ul>
<li>Aumente \(R\) hasta el valor crítico \(2\sqrt{L/C}\) y compare las tres curvas.</li>
<li>El retrato de fase \((q, i)\) es una espiral hacia el origen en el caso subamortiguado y una curva sin vueltas en los otros.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un solenoide de 500 espiras, 20 cm de largo y 3 cm de radio. Halle \(L\) y la energía con 2 A.
<details><summary>Respuesta</summary><p>\(L=\mo N^2\pi r^2/l=4.44\) mH; \(U=8.9\) mJ.</p></details></li>
<li><span class="lvl">Básico</span>En un circuito RL con \(L=50\) mH y \(R=10\ \Omega\), ¿cuánto tarda la corriente en llegar al 90 % de su valor final?
<details><summary>Respuesta</summary><p>\(t=\tau\ln10=5\text{ ms}\times2.303=11.5\) ms.</p></details></li>
<li><span class="lvl">Intermedio</span>Un circuito LC tiene \(L=2\) mH y \(C=5\) nF. Halle la frecuencia de oscilación. Si \(Q_0=10\) nC, ¿cuál es la corriente máxima?
<details><summary>Respuesta</summary><p>\(f_0=\frac{1}{2\pi\sqrt{LC}}=50.3\) kHz; \(I_{\max}=\omega_0Q_0=3.16\) mA.</p></details></li>
<li><span class="lvl">Intermedio</span>Con \(L=2\) mH y \(C=5\) nF, ¿qué resistencia produce amortiguamiento crítico? ¿Cuál es \(Q\) con \(R=50\ \Omega\)?
<details><summary>Respuesta</summary><p>\(R_c=2\sqrt{L/C}=1.26\) kΩ; \(Q=\frac1R\sqrt{L/C}=12.6\).</p></details></li>
<li><span class="lvl">Avanzado</span>Dos solenoides coaxiales largos de longitud \(l\): el interior de radio \(r_1\) y \(N_1\) espiras, el exterior de radio \(r_2\) y \(N_2\) espiras. Halle \(M\) y demuestre que \(k=r_1/r_2\).
<details><summary>Respuesta</summary><p>\(M=\mo N_1N_2\pi r_1^2/l\); \(L_1=\mo N_1^2\pi r_1^2/l\), \(L_2=\mo N_2^2\pi r_2^2/l\); \(k=M/\sqrt{L_1L_2}=r_1/r_2\).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que la energía disipada en \(R\) durante la extinción de la corriente en un circuito RL es \(\tfrac12LI_0^2\).
<details><summary>Respuesta</summary><p>\(\int_0^\infty I_0^2e^{-2Rt/L}R\,\dd t=\frac12LI_0^2\).</p></details></li>
</ol>
</section>
