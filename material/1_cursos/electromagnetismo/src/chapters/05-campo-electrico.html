<template class="chapter-src" data-id="campo-electrico" data-num="5" data-title="El campo eléctrico" data-part="Parte II · Electrostática" data-short="Campo de cargas y distribuciones, líneas de campo, dipolos y movimiento de cargas">
<p class="lead">En lugar de pensar que una carga actúa a distancia sobre otra, decimos que cada carga crea en el espacio que la rodea un campo eléctrico, y que ese campo actúa sobre cualquier otra carga que se encuentre allí. El campo es una entidad física real: transporta energía y momento, y sus perturbaciones viajan a la velocidad de la luz.</p>

<section>
<h2>Definición del campo eléctrico</h2>
<p>El campo eléctrico en un punto es la fuerza por unidad de carga que experimentaría una carga de prueba positiva \(q_0\) colocada allí, en el límite en que \(q_0\) es tan pequeña que no perturba las cargas fuente:</p>
<div class="eq key" data-name="Campo eléctrico">\[\vb{E}(\vb{r})=\lim_{q_0\to0}\frac{\vb{F}}{q_0},\qquad \vb{F}=q\,\vb{E}.\]</div>
<p>Sus unidades son N/C, equivalentes a V/m. Aplicando la ley de Coulomb, el campo de una carga puntual \(q\) situada en \(\vb{r}'\) y el de un conjunto de cargas son</p>
<div class="eq key" data-name="Carga puntual y superposición">\[\vb{E}(\vb{r})=\frac{q}{4\pi\eo}\,\frac{\uv{R}}{R^2},\qquad \vb{E}(\vb{r})=\frac{1}{4\pi\eo}\sum_i q_i\,\frac{\vb{r}-\vb{r}_i}{\abs{\vb{r}-\vb{r}_i}^3}.\]</div>
<p>El campo de una carga positiva apunta radialmente hacia afuera; el de una negativa, hacia la carga. Una vez conocido \(\vb{E}\), la fuerza sobre cualquier carga \(q\) es \(q\vb{E}\), sin necesidad de volver a considerar las fuentes.</p>
<div class="tablewrap narrow"><table>
<tr><th>Situación</th><th>\(E\) aproximado (N/C)</th></tr>
<tr><td>Atmósfera en buen tiempo, cerca del suelo</td><td class="num">\(10^2\)</td></tr>
<tr><td>Bajo una nube de tormenta</td><td class="num">\(10^4\)</td></tr>
<tr><td>Ruptura dieléctrica del aire seco</td><td class="num">\(3\times10^6\)</td></tr>
<tr><td>A través de una membrana celular</td><td class="num">\(10^7\)</td></tr>
<tr><td>En la órbita del electrón del hidrógeno</td><td class="num">\(5\times10^{11}\)</td></tr>
<tr><td>En la superficie de un núcleo de uranio</td><td class="num">\(2\times10^{21}\)</td></tr>
</table></div>
</section>

<section>
<h2>Líneas de campo</h2>
<p>Las líneas de campo, introducidas por Faraday, son curvas tangentes a \(\vb{E}\) en cada punto. Para dibujarlas correctamente:</p>
<ul>
<li>Salen de las cargas positivas y terminan en las negativas (o van al infinito).</li>
<li>El número de líneas que sale de o llega a una carga es proporcional a su valor.</li>
<li>La densidad de líneas (número que atraviesa una superficie perpendicular, por unidad de área) es proporcional a \(\abs{\vb{E}}\).</li>
<li>Dos líneas nunca se cruzan: en cada punto el campo tiene una única dirección. Sólo pueden encontrarse en puntos donde \(\vb{E}=\vb{0}\) o en las propias cargas.</li>
</ul>
<p>Las <span class="term">superficies equipotenciales</span> (capítulo 7) son perpendiculares a las líneas de campo. En un diagrama plano, las líneas representan un corte del campo tridimensional; por eso la proporcionalidad entre densidad y magnitud es sólo cualitativa.</p>
<div class="sim" data-sim="field-lines" data-title="Líneas de campo de un sistema de cargas puntuales"></div>
<div class="sim-guide"><ul>
<li>Con el dipolo, siga una línea desde la carga positiva: todas terminan en la negativa o escapan. Con “+2q y −q”, la mitad de las líneas de \(+2q\) escapa al infinito.</li>
<li>En “Dos cargas iguales” busque el punto donde \(\vb{E}=\vb{0}\): las líneas se separan allí y las equipotenciales se cruzan formando una X.</li>
<li>Coloque la sonda lejos de un sistema neutro (dipolo o cuadrupolo): el campo decae mucho más rápido que el de una carga aislada.</li>
</ul></div>
</section>

<section>
<h2>El dipolo eléctrico</h2>
<p>Un <span class="term">dipolo eléctrico</span> está formado por dos cargas \(+q\) y \(-q\) separadas una distancia \(d\). Se caracteriza por su <span class="term">momento dipolar</span>, un vector que va de la carga negativa a la positiva:</p>
<div class="eq key" data-name="Momento dipolar">\[\vb{p}=q\,\vb{d},\qquad [p]=\mathrm{C\cdot m}.\]</div>
<p>Muchas moléculas (agua, \(p=6.2\times10^{-30}\) C·m) son dipolos permanentes, y cualquier átomo en un campo externo se convierte en un dipolo inducido. Con el dipolo sobre el eje \(z\) y centrado en el origen, el campo exacto en el eje y en el plano perpendicular es:</p>
<div class="eq">\[E_{\text{eje}}=\frac{q}{4\pi\eo}\left[\frac{1}{(z-d/2)^2}-\frac{1}{(z+d/2)^2}\right]=\frac{1}{4\pi\eo}\,\frac{2pz}{(z^2-d^2/4)^2},\]
\[E_{\perp}=\frac{1}{4\pi\eo}\,\frac{p}{(y^2+d^2/4)^{3/2}}\quad(\text{dirigido en sentido opuesto a }\vb{p}).\]</div>
<p>Lejos del dipolo (\(r\gg d\)) el campo sólo depende de \(\vb{p}\) y decae como \(1/r^3\), un orden más rápido que el de una carga:</p>
<div class="eq key" data-name="Campo lejano del dipolo">\[\vb{E}=\frac{p}{4\pi\eo r^3}\left(2\cos\theta\,\uv{r}+\sen\theta\,\uv{\theta}\right)=\frac{1}{4\pi\eo}\,\frac{3(\vb{p}\cdot\uv{r})\uv{r}-\vb{p}}{r^3}.\]</div>
<p>En el eje (\(\theta=0\)) vale \(2p/(4\pi\eo r^3)\) y en el plano ecuatorial (\(\theta=90^\circ\)) vale la mitad, dirigido en sentido contrario a \(\vb{p}\).</p>
<div class="sim" data-sim="dipole-field" data-title="Campo del dipolo: exacto frente a la aproximación de campo lejano"></div>
<div class="sim-guide"><ul>
<li>En la gráfica logarítmica el campo exacto sigue la recta de pendiente \(-3\) para \(r\gg d\). ¿A partir de qué \(r/d\) el error es menor que 1 %?</li>
<li>Compare las dos curvas: en el eje el campo es el doble que en el plano ecuatorial a la misma distancia.</li>
</ul></div>
</section>

<section>
<h2>Campo de distribuciones continuas</h2>
<p>Para una distribución continua se suman las contribuciones de los elementos \(\dd q\):</p>
<div class="eq key" data-name="Distribución continua">\[\vb{E}(\vb{r})=\frac{1}{4\pi\eo}\int\frac{\dd q'}{R^2}\,\uv{R}=\frac{1}{4\pi\eo}\int\frac{(\vb{r}-\vb{r}')\,\dd q'}{\abs{\vb{r}-\vb{r}'}^3},\qquad \dd q'=\lambda\,\dd l',\ \sigma\,\dd S',\ \rho_v\,\dd V'.\]</div>
<p>La estrategia es siempre la misma: (1) elegir un elemento \(\dd q'\) y escribir \(\vb{R}\); (2) usar la simetría para decidir qué componentes se cancelan; (3) integrar sólo las componentes que sobreviven.</p>
<h3>Anillo en su eje</h3>
<p>Un anillo de radio \(a\) con carga \(Q\) uniforme en el plano \(xy\). Para un punto en el eje a altura \(z\), todos los elementos están a la misma distancia \(\sqrt{z^2+a^2}\); las componentes radiales se cancelan de dos en dos y sobrevive la componente \(z\), que es la fracción \(z/\sqrt{z^2+a^2}\) de cada contribución:</p>
<div class="eq key" data-name="Anillo">\[E_z=\frac{1}{4\pi\eo}\,\frac{Qz}{(z^2+a^2)^{3/2}}.\]</div>
<p>Es nulo en el centro, máximo en \(z=a/\sqrt2\) y tiende a \(Q/(4\pi\eo z^2)\) para \(z\gg a\).</p>
<h3>Disco en su eje y plano infinito</h3>
<p>Dividiendo un disco de radio \(a\) y densidad \(\sigma\) en anillos de radio \(\rho'\) y carga \(\dd Q=\sigma\,2\pi\rho'\,\dd\rho'\), y sumando el resultado anterior:</p>
<div class="eq key" data-name="Disco (z > 0)">\[E_z=\frac{\sigma z}{2\eo}\int_0^a\frac{\rho'\,\dd\rho'}{(z^2+\rho'^2)^{3/2}}=\frac{\sigma}{2\eo}\left[1-\frac{z}{\sqrt{z^2+a^2}}\right].\]</div>
<p>Cuando \(a\to\infty\) (o \(z\ll a\)), se obtiene el campo de un plano infinito, <strong>uniforme</strong> e independiente de la distancia: \(E=\sigma/(2\eo)\), dirigido hacia afuera del plano a ambos lados.</p>
<h3>Segmento recto y línea infinita</h3>
<p>Para un segmento de longitud \(L\) con densidad \(\lambda\), en un punto de su mediatriz a distancia \(y\):</p>
<div class="eq">\[E_y=\frac{1}{4\pi\eo}\,\frac{\lambda L}{y\sqrt{y^2+L^2/4}}\ \xrightarrow{\ L\to\infty\ }\ \frac{\lambda}{2\pi\eo y}.\]</div>
<p>El campo de una línea infinita decae como \(1/y\): más lento que el de una carga (\(1/r^2\)) y más rápido que el de un plano (constante). Cada dimensión de la fuente “ahorra” una potencia de la distancia.</p>
<div class="sim" data-sim="continuous-axis" data-title="Campo en el eje de un anillo, un disco y un segmento"></div>
<div class="sim-guide"><ul>
<li>Anillo: observe cómo las contribuciones \(\dd\vb{E}\) forman un cono y sólo su componente axial sobrevive. Localice el máximo en \(z=a/\sqrt2\approx0.707\,a\).</li>
<li>Disco: cerca del disco el campo es el del plano infinito, \(\sigma/2\eo\); lejos, el de una carga puntual. ¿Dónde se cruzan las dos aproximaciones?</li>
<li>Segmento: para \(y\ll L\) coincide con la línea infinita.</li>
</ul></div>
<div class="box ex">
<h4>Arco semicircular</h4>
<p>Una varilla doblada en semicircunferencia de radio \(a\) (de \(\phi=0\) a \(\pi\)) tiene carga \(Q\) uniforme. Halle el campo en el centro.</p>
<details><summary>Solución</summary>
<p>\(\lambda=Q/(\pi a)\), \(\dd q=\lambda a\,\dd\phi\). El vector de la fuente al centro es \(\vb{R}=-a\,\uv{\rho}\). Por simetría sobrevive la componente \(y\): \(E_y=-\dfrac{1}{4\pi\eo}\displaystyle\int_0^\pi\frac{\lambda a\,\sen\phi}{a^2}\dd\phi=-\frac{2\lambda}{4\pi\eo a}=-\frac{Q}{2\pi^2\eo a^2}\). El campo apunta alejándose del arco (si \(Q\gt0\)).</p>
</details>
</div>
</section>

<section>
<h2>Movimiento de cargas en un campo eléctrico</h2>
<p>Una partícula de carga \(q\) y masa \(m\) en un campo \(\vb{E}\) sufre la aceleración \(\vb{a}=q\vb{E}/m\) (despreciando la gravedad, casi siempre muy pequeña frente a la fuerza eléctrica). En un campo uniforme el movimiento es el de un proyectil: uniformemente acelerado en la dirección de \(\vb{E}\) y uniforme en la perpendicular.</p>
<h3>Deflexión electrostática</h3>
<p>Un electrón acelerado desde el reposo por una diferencia de potencial \(V_a\) adquiere una rapidez \(v_0=\sqrt{2eV_a/m}\). Si entra horizontalmente entre dos placas de longitud \(\ell\) y separación \(s\) con diferencia de potencial \(V_p\) (campo \(E=V_p/s\)), al salir se ha desviado</p>
<div class="eq">\[y_1=\frac12\,\frac{eE}{m}\left(\frac{\ell}{v_0}\right)^2=\frac{V_p\,\ell^2}{4sV_a},\qquad \tan\alpha=\frac{v_y}{v_0}=\frac{V_p\,\ell}{2sV_a},\]</div>
<p>y sobre una pantalla situada a distancia \(D\) del borde de las placas la desviación total es \(Y=\dfrac{V_p\ell}{2sV_a}\left(\dfrac{\ell}{2}+D\right)\). Es el principio del tubo de rayos catódicos y del osciloscopio analógico. Observe que \(Y\) no depende de \(q/m\): cualquier partícula con el mismo signo acelerada por el mismo \(V_a\) sigue la misma trayectoria.</p>
<div class="sim" data-sim="crt-deflection" data-title="Deflexión de un haz entre placas paralelas"></div>
<div class="sim-guide"><ul>
<li>Duplique \(V_p\): la desviación en la pantalla se duplica. Duplique \(V_a\): se reduce a la mitad.</li>
<li>Cambie el electrón por un protón: la trayectoria no cambia (sólo cambia de lado, por el signo), aunque el tiempo de vuelo es 43 veces mayor.</li>
<li>Si el haz toca una placa, la partícula queda atrapada: busque el valor crítico de \(V_p\).</li>
</ul></div>
<h3>El experimento de Millikan</h3>
<p>Entre 1909 y 1913 Robert Millikan midió la carga de gotas de aceite microscópicas suspendidas entre dos placas horizontales. Ajustando el voltaje hasta que una gota queda en reposo, \(qV/d=mg\), y conociendo la masa de la gota por su velocidad de caída libre (ley de Stokes), obtuvo cargas que eran siempre múltiplos enteros de \(e\): la primera demostración directa de la cuantización de la carga.</p>
<div class="sim" data-sim="millikan" data-title="Experimento de la gota de aceite de Millikan"></div>
<div class="sim-guide"><ul>
<li>Ajuste el voltaje hasta que la gota quede quieta; con ese valor calcule \(q=mgd/V\) y compárelo con \(e\).</li>
<li>Pida varias gotas nuevas: los valores de \(q\) obtenidos son siempre múltiplos de \(1.60\times10^{-19}\) C.</li>
</ul></div>
</section>

<section>
<h2>Dipolo en un campo externo</h2>
<p>En un campo <strong>uniforme</strong> las fuerzas sobre \(+q\) y \(-q\) son iguales y opuestas: la fuerza neta es cero, pero forman un par que tiende a alinear \(\vb{p}\) con \(\vb{E}\):</p>
<div class="eq key" data-name="Torque y energía del dipolo">\[\boldsymbol{\tau}=\vb{p}\times\vb{E},\qquad U=-\vb{p}\cdot\vb{E}=-pE\cos\theta .\]</div>
<p>La energía es mínima (\(-pE\), equilibrio estable) cuando \(\vb{p}\) es paralelo a \(\vb{E}\) y máxima (\(+pE\), equilibrio inestable) cuando es antiparalelo. Para desviaciones pequeñas el dipolo oscila con frecuencia angular \(\omega_0=\sqrt{pE/I}\), donde \(I\) es su momento de inercia. En un campo <strong>no uniforme</strong> aparece además una fuerza neta \(\vb{F}=(\vb{p}\cdot\nabla)\vb{E}\) que arrastra al dipolo hacia la región de campo más intenso: por eso un peine cargado atrae trocitos de papel neutros.</p>
<div class="sim" data-sim="dipole-torque" data-title="Oscilación de un dipolo en un campo uniforme"></div>
<div class="sim-guide"><ul>
<li>Suelte el dipolo desde \(170^\circ\): el punto en la curva \(U(\theta)\) oscila entre dos puntos de retorno sobre la línea de energía total.</li>
<li>Para ángulos pequeños mida el período y compárelo con \(2\pi/\omega_0\). Para amplitudes grandes el período crece (oscilador no lineal, como el péndulo).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Halle el campo en el punto medio entre \(+2\ \mu\)C y \(-2\ \mu\)C separadas 10 cm.
<details><summary>Respuesta</summary><p>Ambas contribuciones apuntan hacia la carga negativa: \(E=2k(2\times10^{-6})/(0.05)^2=1.44\times10^7\) N/C.</p></details></li>
<li><span class="lvl">Básico</span>¿Qué campo eléctrico equilibra el peso de un electrón? ¿Y de un protón?
<details><summary>Respuesta</summary><p>\(E=mg/e\): \(5.6\times10^{-11}\) N/C (electrón, hacia abajo) y \(1.0\times10^{-7}\) N/C (protón, hacia arriba).</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que el campo del anillo es máximo en \(z=a/\sqrt2\) y que el valor máximo es \(\dfrac{Q}{6\sqrt3\,\pi\eo a^2}\).
<details><summary>Respuesta</summary><p>\(\dd E_z/\dd z=0\Rightarrow z^2+a^2-3z^2=0\). Sustituyendo, \(E_{\max}=\frac{Q}{4\pi\eo}\frac{2}{3\sqrt3a^2}\).</p></details></li>
<li><span class="lvl">Intermedio</span>Un electrón entra con \(v_0=2\times10^7\) m/s entre placas de 4 cm con \(E=2\times10^4\) N/C perpendicular. Halle la desviación a la salida.
<details><summary>Respuesta</summary><p>\(t=2\times10^{-9}\) s, \(a=3.51\times10^{15}\) m/s², \(y=\tfrac12at^2=7.0\) mm.</p></details></li>
<li><span class="lvl">Intermedio</span>Un disco de radio 10 cm tiene \(\sigma=5\ \mu\)C/m². Halle el campo en su eje a 2 cm y a 50 cm, y compare con las aproximaciones de plano infinito y carga puntual.
<details><summary>Respuesta</summary><p>2 cm: \(E=2.27\times10^5\) N/C (plano: \(2.82\times10^5\)). 50 cm: \(E=5.48\times10^3\) N/C (puntual: \(5.65\times10^3\)).</p></details></li>
<li><span class="lvl">Avanzado</span>Una molécula de agua (\(p=6.2\times10^{-30}\) C·m) está en un campo de \(10^6\) N/C. ¿Qué trabajo hace falta para girarla de la orientación estable a la inestable?
<details><summary>Respuesta</summary><p>\(W=2pE=1.24\times10^{-23}\) J, unas 0.003 veces \(k_BT\) a temperatura ambiente: la agitación térmica domina.</p></details></li>
<li><span class="lvl">Avanzado</span>Halle el campo sobre el eje de una distribución lineal finita \(0\le x\le L\) en un punto \(x=L+d\) y verifique el límite \(d\gg L\).
<details><summary>Respuesta</summary><p>\(E_x=\dfrac{\lambda}{4\pi\eo}\left(\dfrac1d-\dfrac1{d+L}\right)=\dfrac{Q}{4\pi\eo d(d+L)}\to\dfrac{Q}{4\pi\eo d^2}\).</p></details></li>
</ol>
