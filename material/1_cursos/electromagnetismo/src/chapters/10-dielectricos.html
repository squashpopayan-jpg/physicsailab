<p class="lead">Un aislante colocado en un campo eléctrico no conduce, pero tampoco es pasivo: sus moléculas se polarizan y crean un campo propio que se opone parcialmente al aplicado. Este efecto aumenta la capacitancia de los condensadores y obliga a introducir un nuevo campo, el desplazamiento eléctrico \(\vb{D}\), que sólo “ve” las cargas libres.</p>

<section>
<h2>Dieléctricos en un condensador</h2>
<p>Faraday descubrió que al llenar el espacio entre las placas de un condensador con un aislante la capacitancia aumenta en un factor \(\kappa\gt1\), la <span class="term">constante dieléctrica</span> o permitividad relativa \(\varepsilon_r\) del material:</p>
<div class="eq key" data-name="Condensador con dieléctrico">\[C=\kappa\,C_0 .\]</div>
<p>Si el condensador está aislado (\(Q\) fija), el campo y la tensión disminuyen: \(E=E_0/\kappa\), \(V=V_0/\kappa\), y la energía también: \(U=U_0/\kappa\) (el dieléctrico es atraído hacia dentro). Si está conectado a una batería (\(V\) fija), la carga aumenta a \(\kappa Q_0\) y la energía a \(\kappa U_0\).</p>

<p>La <span class="term">rigidez dieléctrica</span> es el campo máximo que soporta el material antes de volverse conductor (ruptura). Un buen dieléctrico para condensadores combina \(\kappa\) alta y rigidez alta.</p>
</section>

<section>
<h2>Polarización</h2>
<p>A escala molecular hay dos mecanismos:</p>
<ul>
<li><strong>Polarización inducida (electrónica).</strong> En una molécula no polar el campo desplaza la nube electrónica respecto de los núcleos y crea un dipolo \(\vb{p}=\alpha\vb{E}\), donde \(\alpha\) es la <span class="term">polarizabilidad</span>. Para un modelo de átomo como esfera conductora de radio \(R\), \(\alpha=4\pi\eo R^3\).</li>
<li><strong>Polarización por orientación.</strong> Las moléculas polares (agua, HCl) tienen un dipolo permanente \(p_0\). El campo tiende a alinearlas y la agitación térmica a desordenarlas. El promedio en 3D es \(\langle p_z\rangle=p_0\,\mathcal{L}(a)\), con la función de Langevin \(\mathcal{L}(a)=\coth a-1/a\) y \(a=p_0E/k_BT\). Como en la práctica \(a\ll1\), \(\langle p_z\rangle\approx p_0^2E/(3k_BT)\): la respuesta es lineal y disminuye con la temperatura (ley de Curie).</li>
</ul>
<p>El estado de un dieléctrico se describe con el vector <span class="term">polarización</span>, el momento dipolar por unidad de volumen: \(\vb{P}=N\langle\vb{p}\rangle\) [C/m²].</p>
<div class="sim" data-sim="molecular-polarization" data-title="Polarización molecular: orientación frente a agitación térmica"></div>
<div class="sim-guide"><ul>
<li>Moléculas polares: aumente \(E\) o baje \(T\); el grado de alineación sigue la función de Langevin (curva de la derecha).</li>
<li>Para campos reales (unos MV/m) \(a\) es del orden de \(10^{-3}\): la polarización es proporcional al campo.</li>
<li>Moléculas no polares: la polarización es inducida, lineal en \(E\) e independiente de la temperatura.</li>
</ul></div>
</section>

<section>
<h2>Cargas de polarización</h2>
<p>El potencial de un material polarizado es la suma de los potenciales de sus dipolos, \(V=\frac{1}{4\pi\eo}\int\frac{\vb{P}\cdot\uv{R}}{R^2}\dd V'\). Integrando por partes resulta el potencial de dos distribuciones de carga ficticias, llamadas <span class="term">cargas ligadas</span>:</p>
<div class="eq key" data-name="Cargas ligadas">\[\sigma_b=\vb{P}\cdot\uv{n},\qquad \rho_b=-\divg\vb{P}.\]</div>
<p>No son ficticias en el sentido físico: son el resultado neto de pequeños desplazamientos de cargas reales. En una lámina uniformemente polarizada, las cargas dentro del material se cancelan de molécula a molécula, pero en las caras queda una capa de carga sin compensar. La carga ligada total de un cuerpo neutro es cero.</p>
<div class="box ex">
<h4>Esfera uniformemente polarizada</h4>
<p>Halle el campo dentro de una esfera de radio \(R\) con polarización uniforme \(\vb{P}=P\uv{z}\).</p>
<details><summary>Solución</summary>
<p>\(\rho_b=0\) y \(\sigma_b=P\cos\theta\). Es la misma distribución superficial que la de una esfera conductora en un campo uniforme. El potencial es \(V=\frac{P}{3\eo}r\cos\theta\) dentro, así que el campo interior es uniforme: \(\vb{E}=-\vb{P}/(3\eo)\). Fuera, el campo es el de un dipolo \(\vb{p}=\tfrac43\pi R^3\vb{P}\) en el centro.</p>
</details>
</div>
</section>

<section>
<h2>El desplazamiento eléctrico D</h2>
<p>La ley de Gauss incluye todas las cargas: \(\eo\divg\vb{E}=\rho_f+\rho_b=\rho_f-\divg\vb{P}\), donde \(\rho_f\) es la carga <em>libre</em> (la que controlamos). Agrupando los términos se define</p>
<div class="eq key" data-name="Desplazamiento eléctrico">\[\vb{D}=\eo\vb{E}+\vb{P},\qquad \divg\vb{D}=\rho_f,\qquad \oint\vb{D}\cdot\dd\vb{A}=Q_{f,\text{enc}}.\]</div>
<p>\(\vb{D}\) tiene unidades de C/m². Su ley de Gauss sólo involucra la carga libre, por eso es útil en problemas con dieléctricos y simetría. Cuidado: \(\vb{D}\) no queda determinado sólo por \(\rho_f\), porque en general \(\curl\vb{D}=\curl\vb{P}\ne\vb{0}\).</p>
<h3>Dieléctricos lineales</h3>
<p>En la mayoría de los materiales, para campos no demasiado intensos, la polarización es proporcional al campo:</p>
<div class="eq key" data-name="Medio lineal, isótropo y homogéneo">\[\vb{P}=\eo\chi_e\vb{E},\qquad \vb{D}=\varepsilon\vb{E},\qquad \varepsilon=\eo(1+\chi_e)=\eo\varepsilon_r,\qquad \kappa=\varepsilon_r=1+\chi_e .\]</div>
<p>\(\chi_e\) es la <span class="term">susceptibilidad eléctrica</span>. En un medio lineal homogéneo que llena todo el espacio donde hay campo, basta sustituir \(\eo\) por \(\varepsilon\) en todas las fórmulas del vacío: la fuerza entre dos cargas libres se reduce en un factor \(\kappa\). La relación entre la polarizabilidad molecular y la permitividad macroscópica es la ecuación de Clausius–Mossotti, \(\dfrac{\varepsilon_r-1}{\varepsilon_r+2}=\dfrac{N\alpha}{3\eo}\).</p>
<div class="box ex">
<h4>Carga ligada en un condensador</h4>
<p>Un condensador de placas con densidad libre \(\sigma_f\) está lleno de un dieléctrico de constante \(\kappa\). Halle \(D\), \(E\), \(P\) y \(\sigma_b\).</p>
<details><summary>Solución</summary>
<p>Gauss para \(\vb{D}\): \(D=\sigma_f\). Entonces \(E=\sigma_f/(\kappa\eo)\), \(P=D-\eo E=\sigma_f(1-1/\kappa)\) y \(\sigma_b=P=\sigma_f(1-1/\kappa)\), de signo opuesto a la carga libre de la placa adyacente. El campo neto se debe a \(\sigma_f-\sigma_b=\sigma_f/\kappa\).</p>
</details>
</div>
<div class="sim" data-sim="capacitor-dielectric" data-title="Condensador con una lámina dieléctrica"></div>
<div class="sim-guide"><ul>
<li>Lámina lateral (condensadores en paralelo): \(E\) es igual en las dos zonas, pero la carga libre en la zona con dieléctrico es \(\kappa\) veces mayor.</li>
<li>Lámina horizontal (en serie): \(D\) es igual en las dos capas y \(E\) es \(\kappa\) veces menor dentro del dieléctrico.</li>
<li>Observe la fuerza: con la batería conectada, el dieléctrico es arrastrado hacia dentro con una fuerza constante \(F=\tfrac12V^2\eo(\kappa-1)w/d\).</li>
</ul></div>
</section>

<section>
<h2>Condiciones de frontera</h2>
<p>En la superficie de separación entre dos medios, aplicando la ley de Gauss a una caja de píldoras y \(\oint\vb{E}\cdot\dd\vb{l}=0\) a un lazo rectangular delgado:</p>
<div class="eq key" data-name="Condiciones de frontera electrostáticas">\[E_{1t}=E_{2t},\qquad D_{1n}-D_{2n}=\sigma_f\quad(\uv{n}\text{ de 2 hacia 1}).\]</div>
<p>La componente tangencial de \(\vb{E}\) es continua; la normal de \(\vb{D}\) salta en la carga libre superficial (que suele ser cero entre dos dieléctricos). Sin carga libre, dividiendo las dos condiciones se obtiene la “refracción” de las líneas de campo, con ángulos medidos desde la normal:</p>
<div class="eq key" data-name="Refracción de las líneas de campo">\[\frac{\tan\theta_1}{\tan\theta_2}=\frac{\varepsilon_1}{\varepsilon_2}.\]</div>
<p>Al entrar en un medio de mayor permitividad, las líneas se alejan de la normal. En la frontera entre un dieléctrico y un conductor (\(\vb{E}=\vb{0}\) dentro), las condiciones dan \(E_t=0\) y \(D_n=\sigma_f\): el campo es perpendicular al conductor.</p>
<div class="sim" data-sim="field-refraction" data-title="Refracción de las líneas de campo en la frontera entre dos dieléctricos"></div>
<div class="sim-guide"><ul>
<li>Con \(\varepsilon_2\gt\varepsilon_1\) las líneas se inclinan alejándose de la normal y \(E\) disminuye en el medio 2.</li>
<li>Cambie a líneas de \(\vb{D}\): su componente normal es continua, de modo que las líneas de \(\vb{D}\) no se interrumpen en la frontera.</li>
</ul></div>
</section>

<section>
<h2>Esfera dieléctrica en un campo uniforme</h2>
<p>Resolviendo la ecuación de Laplace dentro y fuera con las condiciones de frontera anteriores, se obtiene que el campo dentro de una esfera dieléctrica colocada en un campo uniforme \(\vb{E}_0\) es también uniforme:</p>
<div class="eq key" data-name="Esfera dieléctrica">\[\vb{E}_{\text{int}}=\frac{3}{\varepsilon_r+2}\,\vb{E}_0,\qquad \vb{P}=3\eo\,\frac{\varepsilon_r-1}{\varepsilon_r+2}\,\vb{E}_0 .\]</div>
<p>Fuera, al campo aplicado se suma el de un dipolo \(\vb{p}=4\pi\eo R^3\frac{\varepsilon_r-1}{\varepsilon_r+2}\vb{E}_0\). En el límite \(\varepsilon_r\to\infty\) se recupera la esfera conductora (\(E_{\text{int}}=0\), \(\sigma=3\eo E_0\cos\theta\)); para \(\varepsilon_r=1\) no hay perturbación.</p>
<div class="sim" data-sim="dielectric-sphere" data-title="Esfera dieléctrica en un campo uniforme"></div>
</section>

<section>
<h2>Energía y fuerzas en presencia de dieléctricos</h2>
<p>El trabajo para aumentar la carga libre en \(\delta\rho_f\) es \(\delta W=\int\delta\rho_fV\,\dd V=\int\vb{E}\cdot\delta\vb{D}\,\dd V\). En un medio lineal, \(\vb{E}\cdot\delta\vb{D}=\tfrac12\delta(\vb{D}\cdot\vb{E})\), de modo que</p>
<div class="eq key" data-name="Energía en medios lineales">\[W=\frac12\int\vb{D}\cdot\vb{E}\,\dd V,\qquad u=\frac12\vb{D}\cdot\vb{E}=\frac12\varepsilon E^2 .\]</div>
<p>La fuerza sobre un dieléctrico se calcula a partir de la energía. Con carga fija, \(F_x=-\partial W/\partial x\); con potencial fijo hay que incluir el trabajo de la batería, y resulta \(F_x=+\partial W/\partial x\). En ambos casos el dieléctrico es atraído hacia la región de campo intenso: es la fuerza de franjas en los bordes de las placas la que tira de él.</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un condensador de 5 nF se carga a 200 V, se desconecta y se le introduce vidrio Pyrex (\(\kappa=5.6\)). Halle la nueva tensión y la variación de energía.
<details><summary>Respuesta</summary><p>\(V=35.7\) V; \(U_0=100\ \mu\)J, \(U=17.9\ \mu\)J: disminuye en 82.1 µJ.</p></details></li>
<li><span class="lvl">Básico</span>¿Cuál es la tensión máxima de un condensador de placas con papel de 0.1 mm de espesor?
<details><summary>Respuesta</summary><p>\(V_{\max}=E_{\max}d=(16\text{ MV/m})(10^{-4}\text{ m})=1.6\) kV.</p></details></li>
<li><span class="lvl">Intermedio</span>Placas de área \(A\) separadas \(d\), con una lámina de espesor \(t\) y constante \(\kappa\) paralela a ellas. Demuestre que \(C=\dfrac{\eo A}{d-t+t/\kappa}\).
<details><summary>Respuesta</summary><p>Dos condensadores en serie: \(\eo A/(d-t)\) y \(\kappa\eo A/t\).</p></details></li>
<li><span class="lvl">Intermedio</span>Un campo de 1 kV/m en aire incide sobre una frontera con agua (\(\varepsilon_r=80\)) formando \(30^\circ\) con la normal. Halle el ángulo y la magnitud del campo en el agua.
<details><summary>Respuesta</summary><p>\(\tan\theta_2=80\tan30^\circ\Rightarrow\theta_2=88.8^\circ\). \(E_t=500\) V/m, \(E_n=866/80=10.8\) V/m, \(E_2=500\) V/m.</p></details></li>
<li><span class="lvl">Intermedio</span>Una carga puntual \(q\) está en el centro de una esfera dieléctrica de radio \(R\) y constante \(\varepsilon_r\). Halle \(D\), \(E\) y \(P\) dentro y fuera, y las cargas ligadas.
<details><summary>Respuesta</summary><p>\(D=q/(4\pi r^2)\) en todas partes. Dentro \(E=q/(4\pi\varepsilon r^2)\), \(P=\frac{\varepsilon_r-1}{\varepsilon_r}\frac{q}{4\pi r^2}\). \(\sigma_b(R)=\frac{\varepsilon_r-1}{\varepsilon_r}\frac{q}{4\pi R^2}\); junto a la carga hay una carga ligada puntual \(-q(\varepsilon_r-1)/\varepsilon_r\).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que el campo dentro de una esfera dieléctrica en un campo uniforme es \(3E_0/(\varepsilon_r+2)\) usando superposición: campo aplicado más el de la esfera uniformemente polarizada.
<details><summary>Respuesta</summary><p>\(E_{\text{int}}=E_0-\frac{P}{3\eo}\) con \(P=\eo(\varepsilon_r-1)E_{\text{int}}\Rightarrow E_{\text{int}}\left(1+\frac{\varepsilon_r-1}{3}\right)=E_0\).</p></details></li>
</ol>
</section>
