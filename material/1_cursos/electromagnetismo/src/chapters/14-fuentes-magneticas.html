<template class="chapter-src" data-id="fuentes-magneticas" data-num="14" data-title="Biot–Savart y ley de Ampère" data-part="Parte IV · Magnetostática" data-short="Campo de corrientes: hilos, espiras, bobinas, solenoides; Ampère, potencial vector y dipolo magnético">
<p class="lead">Las corrientes son las fuentes del campo magnético. La ley de Biot–Savart da el campo de cualquier distribución de corriente, del mismo modo que Coulomb da el de cualquier distribución de carga; la ley de Ampère, su análogo de la ley de Gauss, permite calcularlo en una línea cuando hay simetría.</p>

<section>
<h2>La ley de Biot–Savart</h2>
<p>Un elemento de corriente \(I\,\dd\vb{l}'\) situado en \(\vb{r}'\) produce en \(\vb{r}\) el campo</p>
<div class="eq key" data-name="Ley de Biot–Savart">\[\dd\vb{B}=\frac{\mo}{4\pi}\,\frac{I\,\dd\vb{l}'\times\uv{R}}{R^2},\qquad \vb{B}(\vb{r})=\frac{\mo}{4\pi}\int\frac{I\,\dd\vb{l}'\times\uv{R}}{R^2}=\frac{\mo}{4\pi}\int\frac{\vb{J}(\vb{r}')\times\uv{R}}{R^2}\dd V',\]</div>
<p>con \(\vb{R}=\vb{r}-\vb{r}'\) y la <span class="term">permeabilidad del vacío</span> \(\mo=1.256\,637\times10^{-6}\) N/A² (muy cercana a \(4\pi\times10^{-7}\), que fue su valor exacto hasta 2019). El campo de cada elemento es perpendicular tanto al elemento como a \(\vb{R}\): las líneas de campo de un hilo recto son circunferencias alrededor de él, con el sentido dado por la regla de la mano derecha (pulgar en el sentido de la corriente, dedos en el sentido de \(\vb{B}\)). Se verifica además que \(\mo\eo=1/c^2\).</p>
<h3>Segmento recto</h3>
<p>Para un segmento de longitud \(L\) y un punto a distancia \(d\) de su punto medio, sobre la mediatriz:</p>
<div class="eq">\[B=\frac{\mo I}{4\pi d}\,\frac{L}{\sqrt{d^2+L^2/4}}\quad\xrightarrow{\ L\to\infty\ }\quad \boxed{B=\frac{\mo I}{2\pi d}}.\]</div>
<p>En general, si \(\beta_1\) y \(\beta_2\) son los ángulos con que se ven los extremos desde el punto, medidos desde la perpendicular al hilo, \(B=\dfrac{\mo I}{4\pi d}(\sen\beta_2-\sen\beta_1)\).</p>
<h3>Espira circular</h3>
<p>En el eje de una espira de radio \(a\), todos los elementos están a la misma distancia y las componentes radiales de \(\dd\vb{B}\) se cancelan por pares:</p>
<div class="eq key" data-name="Espira en su eje">\[B_z=\frac{\mo Ia^2}{2\left(a^2+z^2\right)^{3/2}},\qquad B_{\text{centro}}=\frac{\mo I}{2a},\qquad B_{\text{arco de ángulo }\varphi}=\frac{\mo I\varphi}{4\pi a}.\]</div>
<p>Lejos de la espira (\(\abs z\gg a\)), \(B_z\approx\dfrac{\mo}{4\pi}\dfrac{2m}{\abs z^3}\), con \(m=I\pi a^2\): es el campo de un <span class="term">dipolo magnético</span>, idéntico en forma al del dipolo eléctrico,</p>
<div class="eq key" data-name="Dipolo magnético (campo lejano)">\[\vb{B}=\frac{\mo m}{4\pi r^3}\left(2\cos\theta\,\uv{r}+\sen\theta\,\uv{\theta}\right),\qquad \vb{m}=I\vb{A}.\]</div>
<div class="sim" data-sim="biot-savart" data-title="Ley de Biot–Savart: contribuciones de cada elemento de corriente"></div>
<div class="sim-guide"><ul>
<li>Segmento: acerque el punto al hilo o alárguelo; la lectura se acerca a la del hilo infinito \(\mo I/2\pi d\).</li>
<li>Espira: en el eje, las contribuciones \(\dd\vb{B}\) forman un cono y sólo sobrevive la componente axial. Fuera del eje ya no hay cancelación completa.</li>
</ul></div>
</section>

<section>
<h2>Fuerza entre conductores paralelos</h2>
<p>El hilo 1 crea en el hilo 2, a distancia \(d\), el campo \(B_1=\mo I_1/2\pi d\), perpendicular al hilo 2. La fuerza por unidad de longitud sobre éste es</p>
<div class="eq key" data-name="Fuerza entre corrientes paralelas">\[\frac FL=\frac{\mo I_1I_2}{2\pi d}.\]</div>
<p>Corrientes en el mismo sentido se <strong>atraen</strong>; en sentidos opuestos se <strong>repelen</strong> (al revés que las cargas). Esta fuerza sirvió para definir el ampere hasta 2019: la corriente que, en dos hilos paralelos separados 1 m, produce una fuerza de \(2\times10^{-7}\) N por metro.</p>
<div class="sim" data-sim="parallel-wires" data-title="Campo y fuerza entre dos hilos paralelos"></div>
<div class="sim-guide"><ul>
<li>Las líneas de campo son las curvas de nivel del potencial vector \(A_z\): donde están más juntas el campo es más intenso.</li>
<li>Con corrientes iguales y paralelas, el campo se anula en el punto medio y las líneas lejanas rodean a ambos hilos; con corrientes opuestas, el campo entre ellos se refuerza.</li>
</ul></div>
</section>

<section>
<h2>La ley de Ampère</h2>
<p>Para un hilo recto infinito, la circulación de \(\vb{B}\) por una circunferencia concéntrica es \(\frac{\mo I}{2\pi r}\cdot2\pi r=\mo I\), independiente del radio. El resultado se generaliza a cualquier curva cerrada y cualquier distribución de corrientes estacionarias:</p>
<div class="eq key" data-name="Ley de Ampère">\[\oint_C\vb{B}\cdot\dd\vb{l}=\mo I_{\text{enc}},\qquad \curl\vb{B}=\mo\vb{J}.\]</div>
<p>\(I_{\text{enc}}\) es la corriente neta que atraviesa cualquier superficie limitada por \(C\), con signo dado por la regla de la mano derecha respecto del sentido de recorrido. Como la ley de Gauss, siempre es válida (en magnetostática), pero sólo sirve para despejar \(B\) cuando la simetría permite sacarlo de la integral.</p>
<div class="tablewrap"><table>
<tr><th>Distribución</th><th>Curva amperiana</th><th>Resultado</th></tr>
<tr><td>Hilo grueso de radio \(R\), corriente uniforme</td><td>Circunferencia de radio \(r\)</td><td>\(B=\dfrac{\mo Ir}{2\pi R^2}\) dentro; \(\dfrac{\mo I}{2\pi r}\) fuera</td></tr>
<tr><td>Cable coaxial (\(\pm I\))</td><td>Circunferencia</td><td>\(B=\dfrac{\mo I}{2\pi r}\) entre conductores; 0 fuera</td></tr>
<tr><td>Solenoide ideal (\(n\) espiras/m)</td><td>Rectángulo con un lado dentro</td><td>\(B=\mo nI\) dentro, uniforme; 0 fuera</td></tr>
<tr><td>Toroide de \(N\) espiras</td><td>Circunferencia de radio \(r\) dentro del núcleo</td><td>\(B=\dfrac{\mo NI}{2\pi r}\); 0 fuera</td></tr>
<tr><td>Lámina con densidad superficial \(K\) (A/m)</td><td>Rectángulo que la atraviesa</td><td>\(B=\mo K/2\) a cada lado, paralelo a la lámina</td></tr>
</table></div>
<div class="sim" data-sim="ampere-loop" data-title="Ley de Ampère con una curva deformable"></div>
<div class="sim-guide"><ul>
<li>Deforme la curva: la circulación sólo depende de las corrientes encerradas. Un hilo fuera de la curva cambia \(\vb{B}\) en cada punto pero no la circulación.</li>
<li>Invierta el sentido de una corriente (valor negativo = entrando en la pantalla): su contribución cambia de signo.</li>
</ul></div>
<div class="box ex">
<h4>Solenoide ideal</h4>
<p>Aplique la ley de Ampère a un rectángulo de lado \(\ell\) con un lado dentro y otro fuera de un solenoide largo de \(n\) espiras por metro.</p>
<details><summary>Solución</summary>
<p>Fuera del solenoide largo el campo es despreciable y en los lados perpendiculares \(\vb{B}\perp\dd\vb{l}\). Sólo contribuye el lado interior: \(B\ell=\mo(n\ell)I\), luego \(B=\mo nI\), independiente de la posición dentro del solenoide.</p>
</details>
</div>
</section>

<section>
<h2>Bobinas de Helmholtz y solenoides reales</h2>
<p>Dos espiras coaxiales de radio \(a\) con la misma corriente, separadas una distancia igual a su radio (\(d=a\)), producen en su centro un campo notablemente uniforme: las segundas derivadas de \(B_z\) se cancelan. En el centro,</p>
<div class="eq">\[B=\left(\frac45\right)^{3/2}\frac{\mo NI}{a}\approx0.716\,\frac{\mo NI}{a}.\]</div>
<p>Con corrientes opuestas (configuración anti-Helmholtz) el campo es nulo en el centro y varía linealmente: se usa para atrapar átomos fríos. Un solenoide de longitud finita \(L\) tiene en su eje</p>
<div class="eq">\[B_z=\frac{\mo nI}{2}\left[\frac{z+L/2}{\sqrt{(z+L/2)^2+a^2}}-\frac{z-L/2}{\sqrt{(z-L/2)^2+a^2}}\right],\]</div>
<p>que vale \(\mo nI\) en el centro si \(L\gg a\) y la mitad en los extremos.</p>
<div class="sim" data-sim="coil-field" data-title="Espiras, bobinas de Helmholtz y solenoides: mapa del campo"></div>
<div class="sim-guide"><ul>
<li>Helmholtz: con \(d=a\) la curva \(B_z(z)\) es plana en el centro. Con \(d\lt a\) aparece un máximo; con \(d\gt a\), un mínimo.</li>
<li>Solenoide: aumente \(L/a\); el campo interior se vuelve uniforme y el exterior casi desaparece. En los extremos vale la mitad.</li>
</ul></div>
</section>

<section>
<h2>Divergencia y rotacional de B</h2>
<p>Tomando la divergencia y el rotacional de la ley de Biot–Savart se obtienen las dos ecuaciones locales de la magnetostática:</p>
<div class="eq key" data-name="Ecuaciones de la magnetostática">\[\divg\vb{B}=0,\qquad \curl\vb{B}=\mo\vb{J}.\]</div>
<p>La primera expresa que no hay monopolos magnéticos: el flujo magnético por cualquier superficie cerrada es cero y las líneas de \(\vb{B}\) son cerradas. La segunda es la forma diferencial de la ley de Ampère; requiere \(\divg\vb{J}=0\), es decir, corrientes estacionarias. En el capítulo 19 Maxwell la corregirá para corrientes variables.</p>
</section>

<section>
<h2>El potencial vector magnético</h2>
<p>Como \(\divg\vb{B}=0\), el campo magnético puede escribirse como el rotacional de un <span class="term">potencial vector</span>:</p>
<div class="eq key" data-name="Potencial vector">\[\vb{B}=\curl\vb{A},\qquad \vb{A}(\vb{r})=\frac{\mo}{4\pi}\int\frac{\vb{J}(\vb{r}')}{R}\dd V'=\frac{\mo}{4\pi}\int\frac{I\,\dd\vb{l}'}{R},\qquad \lap\vb{A}=-\mo\vb{J}.\]</div>
<p>\(\vb{A}\) no es único: sumarle el gradiente de cualquier función no cambia \(\vb{B}\) (libertad de <em>gauge</em>); la expresión anterior corresponde al gauge de Coulomb, \(\divg\vb{A}=0\). Cada componente cartesiana de \(\vb{A}\) cumple una ecuación de Poisson como el potencial eléctrico. Por el teorema de Stokes, el flujo magnético a través de una superficie es la circulación de \(\vb{A}\) por su borde: \(\Phi_B=\oint\vb{A}\cdot\dd\vb{l}\).</p>
<div class="box ex">
<h4>Potencial vector de un solenoide</h4>
<p>Halle \(\vb{A}\) dentro y fuera de un solenoide ideal de radio \(a\) con campo interior \(B_0=\mo nI\).</p>
<details><summary>Solución</summary>
<p>Por simetría \(\vb{A}=A_\phi(\rho)\uv{\phi}\). Con \(\oint\vb{A}\cdot\dd\vb{l}=\Phi_B\): dentro, \(2\pi\rho A_\phi=B_0\pi\rho^2\Rightarrow A_\phi=B_0\rho/2\); fuera, \(2\pi\rho A_\phi=B_0\pi a^2\Rightarrow A_\phi=B_0a^2/(2\rho)\). ¡Fuera del solenoide \(\vb{B}=\vb{0}\) pero \(\vb{A}\ne\vb{0}\)! En mecánica cuántica esto tiene consecuencias observables (efecto Aharonov–Bohm).</p>
</details>
</div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Halle el campo a 5 cm de un hilo largo con 10 A y compárelo con el campo terrestre.
<details><summary>Respuesta</summary><p>\(B=4.0\times10^{-5}\) T, del orden del campo terrestre.</p></details></li>
<li><span class="lvl">Básico</span>Una espira de 10 cm de radio con 50 vueltas lleva 2 A. Halle \(B\) en el centro y a 10 cm sobre el eje.
<details><summary>Respuesta</summary><p>Centro: \(\mo NI/2a=6.28\times10^{-4}\) T. En \(z=a\): \(\mo NIa^2/[2(2a^2)^{3/2}]=2.22\times10^{-4}\) T.</p></details></li>
<li><span class="lvl">Intermedio</span>Dos hilos paralelos separados 10 cm llevan 20 A y 5 A en sentidos opuestos. Halle la fuerza por metro y el punto (en la línea que los une) donde \(B=0\).
<details><summary>Respuesta</summary><p>\(F/L=2\times10^{-4}\) N/m, repulsiva. \(B=0\) fuera del segmento, del lado del hilo de 5 A: \(20/(x)=5/(x-0.1)\Rightarrow x=13.3\) cm del hilo de 20 A.</p></details></li>
<li><span class="lvl">Intermedio</span>Un solenoide de 50 cm con 1000 espiras lleva 3 A. Halle \(B\) en su interior. ¿Qué corriente requiere un toroide de 500 espiras y radio medio 10 cm para producir el mismo campo?
<details><summary>Respuesta</summary><p>\(B=\mo nI=7.54\) mT. Toroide: \(I=2\pi rB/(\mo N)=7.54\) A.</p></details></li>
<li><span class="lvl">Intermedio</span>Un hilo de radio \(R\) lleva una densidad de corriente \(J=J_0r/R\). Halle \(B\) dentro y fuera.
<details><summary>Respuesta</summary><p>\(I_{\text{enc}}=\frac{2\pi J_0r^3}{3R}\): dentro \(B=\frac{\mo J_0r^2}{3R}\); fuera \(B=\frac{\mo J_0R^2}{3r}\).</p></details></li>
<li><span class="lvl">Avanzado</span>Un hilo se dobla en forma de cuadrado de lado \(a\). Halle \(B\) en el centro.
<details><summary>Respuesta</summary><p>Cada lado: \(\frac{\mo I}{4\pi(a/2)}\cdot2\sen45^\circ\). Total: \(B=\frac{2\sqrt2\,\mo I}{\pi a}\).</p></details></li>
<li><span class="lvl">Avanzado</span>Verifique que la separación \(d=a\) anula \(\dd^2B_z/\dd z^2\) en el centro de las bobinas de Helmholtz.
<details><summary>Respuesta</summary><p>\(\frac{\dd^2}{\dd z^2}(a^2+z^2)^{-3/2}=3(4z^2-a^2)(a^2+z^2)^{-7/2}\); se anula en \(z=a/2\), la posición de cada espira respecto del centro.</p></details></li>
</ol>
</section>
