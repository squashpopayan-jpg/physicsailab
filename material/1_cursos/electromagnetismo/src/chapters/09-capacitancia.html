<template class="chapter-src" data-id="capacitancia" data-num="9" data-title="Capacitancia" data-part="Parte II · Electrostática" data-short="Condensadores, cálculo de capacitancias, combinaciones y energía almacenada">
<p class="lead">Un condensador son dos conductores separados por un aislante que almacenan cargas iguales y opuestas. La razón entre la carga y la diferencia de potencial depende sólo de la geometría y del medio: es la capacitancia. Los condensadores almacenan energía en el campo eléctrico y son componentes esenciales de todos los circuitos.</p>

<section>
<h2>Capacitancia</h2>
<p>Si dos conductores tienen cargas \(+Q\) y \(-Q\), la diferencia de potencial \(V\) entre ellos es proporcional a \(Q\) (por la linealidad de las ecuaciones de la electrostática). La constante de proporcionalidad define la capacitancia:</p>
<div class="eq key" data-name="Capacitancia">\[C=\frac{Q}{V},\qquad 1\un{F}=1\un{C/V}.\]</div>
<p>La capacitancia es siempre positiva y no depende de \(Q\) ni de \(V\), sino de la forma, el tamaño y la separación de los conductores y del material entre ellos. El faradio es una unidad enorme: los condensadores comunes van de picofaradios (\(10^{-12}\) F) a milifaradios, y los supercondensadores llegan a miles de faradios gracias a superficies efectivas gigantescas.</p>
<div class="box law"><h4>Procedimiento para calcular C</h4>
<ol><li>Suponga cargas \(+Q\) y \(-Q\) en los conductores.</li><li>Calcule \(\vb{E}\) entre ellos (casi siempre con la ley de Gauss).</li><li>Integre: \(V=-\int_-^+\vb{E}\cdot\dd\vb{l}\), del conductor negativo al positivo.</li><li>Divida: \(C=Q/V\). La carga supuesta debe cancelarse.</li></ol></div>
</section>

<section>
<h2>Geometrías fundamentales</h2>
<h3>Placas paralelas</h3>
<p>Dos placas de área \(A\) separadas \(d\), con \(d\ll\sqrt A\). Despreciando los efectos de borde, el campo entre ellas es uniforme, \(E=\sigma/\eo=Q/(\eo A)\), y \(V=Ed\):</p>
<div class="eq key" data-name="Placas paralelas">\[C=\frac{\eo A}{d}.\]</div>
<h3>Condensador cilíndrico (coaxial)</h3>
<p>Conductor interior de radio \(a\) y exterior de radio \(b\), longitud \(L\). Entre ellos \(E=\dfrac{Q}{2\pi\eo L\rho}\) y \(V=\dfrac{Q}{2\pi\eo L}\ln\dfrac ba\):</p>
<div class="eq key" data-name="Cilíndrico">\[C=\frac{2\pi\eo L}{\ln(b/a)}.\]</div>
<h3>Condensador esférico</h3>
<p>Esferas concéntricas de radios \(a\lt b\): \(E=\dfrac{Q}{4\pi\eo r^2}\), \(V=\dfrac{Q}{4\pi\eo}\left(\dfrac1a-\dfrac1b\right)\):</p>
<div class="eq key" data-name="Esférico">\[C=4\pi\eo\,\frac{ab}{b-a},\qquad C_{\text{esfera aislada}}=4\pi\eo R\ \ (b\to\infty).\]</div>
<p>La Tierra, considerada como esfera aislada, tiene \(C=4\pi\eo(6.37\times10^6\un{m})\approx709\ \mu\)F. Cuando \(b-a\ll a\), las fórmulas cilíndrica y esférica se reducen a la de placas paralelas con \(A\) igual al área de las armaduras.</p>
<div class="sim" data-sim="capacitor-geometry" data-title="Capacitancia de placas, cilindros y esferas"></div>
<div class="sim-guide"><ul>
<li>Placas: duplique el área o reduzca la separación a la mitad; \(C\) se duplica en ambos casos.</li>
<li>Cilindro y esfera: haga \(b\to a\). La gráfica muestra que la capacitancia diverge como la de unas placas de separación \(b-a\).</li>
</ul></div>
<div class="box ex">
<h4>Un condensador de un metro cuadrado</h4>
<p>Halle la capacitancia de dos placas de 1 m² separadas 1 mm en el vacío y la carga que almacenan a 100 V.</p>
<details><summary>Solución</summary>
<p>\(C=\eo A/d=8.85\times10^{-9}\) F \(=8.85\) nF; \(Q=CV=0.885\ \mu\)C. Incluso con placas de un metro cuadrado la capacitancia es pequeña: por eso los condensadores reales enrollan láminas muy delgadas con un dieléctrico de alta permitividad.</p>
</details>
</div>
</section>

<section>
<h2>Combinaciones de condensadores</h2>
<p><strong>En paralelo</strong> todos los condensadores tienen la misma diferencia de potencial y las cargas se suman: \(Q=\sum Q_i=V\sum C_i\).</p>
<p><strong>En serie</strong> todos tienen la misma carga (la placa interna de un condensador y la placa del siguiente forman un conductor aislado y neutro) y las tensiones se suman: \(V=\sum V_i=Q\sum 1/C_i\).</p>
<div class="eq key" data-name="Equivalentes">\[C_{\text{paralelo}}=C_1+C_2+\cdots,\qquad \frac{1}{C_{\text{serie}}}=\frac{1}{C_1}+\frac{1}{C_2}+\cdots\]</div>
<p>La capacitancia en paralelo es mayor que la mayor de las individuales (aumenta el área efectiva); en serie es menor que la menor (aumenta la separación efectiva). En serie, el condensador más pequeño soporta la mayor tensión.</p>
<div class="sim" data-sim="capacitor-network" data-title="Condensadores en serie y en paralelo"></div>
<div class="sim-guide"><ul>
<li>En serie, verifique que las tres cargas son iguales y que las tensiones suman la de la fuente.</li>
<li>En la red mixta, calcule a mano \(C_{\text{eq}}\) y compárelo con la lectura.</li>
</ul></div>
</section>

<section>
<h2>Energía almacenada</h2>
<p>Para cargar un condensador hay que transportar carga de una placa a la otra contra la diferencia de potencial ya establecida. Llevar \(\dd q\) cuando la tensión es \(v=q/C\) cuesta \(\dd W=(q/C)\,\dd q\):</p>
<div class="eq key" data-name="Energía del condensador">\[U=\int_0^Q\frac{q}{C}\,\dd q=\frac{Q^2}{2C}=\frac12CV^2=\frac12QV.\]</div>
<p>En el condensador de placas paralelas, \(U=\tfrac12(\eo A/d)(Ed)^2=\tfrac12\eo E^2\,(Ad)\): la energía es la densidad \(u_E=\tfrac12\eo E^2\) por el volumen entre las placas, en acuerdo con el resultado general del capítulo 7.</p>
<h3>Fuerza entre las placas</h3>
<p>Con carga constante, \(U=Q^2d/(2\eo A)\) y la fuerza es \(F=-\partial U/\partial d=-\dfrac{Q^2}{2\eo A}\) (atractiva). Equivale a \(F=\tfrac12QE\): cada placa siente sólo el campo de la <em>otra</em>, que es la mitad del campo total. La presión electrostática sobre un conductor es \(\tfrac12\eo E^2=\sigma^2/(2\eo)\).</p>
<h3>¿Batería conectada o condensador aislado?</h3>
<p>Si se separan las placas con la batería conectada, \(V\) es constante y la carga disminuye: la energía almacenada <em>baja</em>, aunque hay que hacer trabajo mecánico. La explicación es que la batería recibe carga de vuelta: su energía aumenta en \(V\abs{\Delta Q}\), el doble de lo que pierde el condensador. Con el condensador aislado, \(Q\) es constante y todo el trabajo mecánico queda en el condensador.</p>
<div class="sim" data-sim="plates-energy" data-title="Separar las placas: balance de energía con Q o V constante"></div>
<div class="sim-guide"><ul>
<li>Con la batería conectada, aumente \(d\): \(E=V/d\) disminuye, \(Q\) disminuye y \(U\) disminuye. El balance: \(W_{\text{mec}}+W_{\text{batería}}=\Delta U\).</li>
<li>Aislado: \(E=\sigma/\eo\) no cambia, \(V\) crece con \(d\) y \(U\) aumenta linealmente.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Qué área deben tener las placas de un condensador de 1 F con separación de 1 mm en el vacío?
<details><summary>Respuesta</summary><p>\(A=Cd/\eo=1.13\times10^8\) m², un cuadrado de unos 10.6 km de lado.</p></details></li>
<li><span class="lvl">Básico</span>Tres condensadores de 2, 3 y 6 µF. Halle la capacitancia equivalente en serie y en paralelo.
<details><summary>Respuesta</summary><p>Serie: \(1/C=1/2+1/3+1/6=1\Rightarrow C=1\ \mu\)F. Paralelo: 11 µF.</p></details></li>
<li><span class="lvl">Intermedio</span>Un cable coaxial tiene \(a=0.5\) mm y \(b=2\) mm con vacío entre los conductores. Halle su capacitancia por metro.
<details><summary>Respuesta</summary><p>\(C/L=2\pi\eo/\ln4=40.1\) pF/m.</p></details></li>
<li><span class="lvl">Intermedio</span>Un condensador de 10 µF cargado a 100 V se conecta en paralelo con otro de 5 µF descargado. Halle la tensión final y la energía perdida.
<details><summary>Respuesta</summary><p>\(V=1\text{ mC}/15\ \mu\text{F}=66.7\) V. \(U_i=50\) mJ, \(U_f=33.3\) mJ: se pierden 16.7 mJ (radiación y calor en los conductores).</p></details></li>
<li><span class="lvl">Intermedio</span>Placas de 200 cm² separadas 2 mm, aisladas con 20 nC. ¿Qué trabajo hace falta para duplicar la separación?
<details><summary>Respuesta</summary><p>\(W=\dfrac{Q^2\Delta d}{2\eo A}=\dfrac{(2\times10^{-8})^2(0.002)}{2(8.85\times10^{-12})(0.02)}=2.26\ \mu\)J.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que la capacitancia por unidad de longitud de dos hilos paralelos de radio \(a\) separados \(D\gg a\) es \(\pi\eo/\ln(D/a)\).
<details><summary>Respuesta</summary><p>Superponga los potenciales de \(+\lambda\) y \(-\lambda\): \(V=\dfrac{\lambda}{\pi\eo}\ln\dfrac{D-a}{a}\approx\dfrac{\lambda}{\pi\eo}\ln\dfrac Da\).</p></details></li>
<li><span class="lvl">Avanzado</span>Calcule la energía de un condensador esférico integrando \(u_E\) entre las esferas y compruebe que coincide con \(Q^2/2C\).
<details><summary>Respuesta</summary><p>\(\int_a^b\frac{\eo}{2}\left(\frac{Q}{4\pi\eo r^2}\right)^24\pi r^2\dd r=\frac{Q^2}{8\pi\eo}\left(\frac1a-\frac1b\right)=\frac{Q^2}{2C}\).</p></details></li>
</ol>
</section>
