<template class="chapter-src" data-id="coulomb" data-num="4" data-title="Carga eléctrica y ley de Coulomb" data-part="Parte II · Electrostática" data-short="Propiedades de la carga, inducción, fuerza de Coulomb y superposición">
<p class="lead">La carga eléctrica es la propiedad de la materia que origina todas las interacciones electromagnéticas. En reposo, dos cargas se atraen o se repelen con una fuerza que decrece como el inverso del cuadrado de la distancia: la ley de Coulomb, punto de partida de toda la electrostática.</p>

<section>
<h2>La carga eléctrica y sus propiedades</h2>
<p>Los experimentos de frotamiento del siglo XVIII mostraron que existen dos clases de carga, que Benjamin Franklin llamó <em>positiva</em> y <em>negativa</em>: cargas del mismo signo se repelen y de signo contrario se atraen. Hoy sabemos que la materia ordinaria está hecha de protones (carga \(+e\)), electrones (\(-e\)) y neutrones (sin carga). La carga tiene cuatro propiedades fundamentales:</p>
<ul>
<li><strong>Cuantización.</strong> Toda carga libre observada es un múltiplo entero de la carga elemental, \(q=ne\), con</li>
</ul>
<div class="eq key" data-name="Carga elemental (valor exacto en el SI)">\[e=1.602\,176\,634\times10^{-19}\un{C}.\]</div>
<ul>
<li><strong>Conservación.</strong> La carga total de un sistema aislado es constante. La carga puede transferirse, pero no crearse ni destruirse neta: en la creación de pares se producen a la vez un electrón y un positrón.</li>
<li><strong>Invariancia.</strong> La carga de una partícula no depende de su velocidad; tiene el mismo valor en todos los sistemas de referencia.</li>
<li><strong>Aditividad.</strong> La carga de un cuerpo es la suma algebraica de las cargas de sus partes.</li>
</ul>
<p>Los quarks tienen cargas \(\pm e/3\) y \(\pm2e/3\), pero están confinados dentro de los hadrones, de modo que no se observan cargas libres fraccionarias. Un culombio equivale a \(6.24\times10^{18}\) cargas elementales: es una carga enorme. Un globo frotado adquiere del orden de \(10^{-8}\) C y un rayo transporta entre 5 y 25 C.</p>
<h3>Conductores y aislantes</h3>
<p>En un <span class="term">conductor</span> (metales, soluciones iónicas, plasmas) algunas cargas pueden moverse libremente por el material: en los metales, uno o dos electrones por átomo forman un “gas” de electrones de conducción. En un <span class="term">aislante</span> o dieléctrico (vidrio, plásticos, aire seco) las cargas están ligadas a sus átomos y sólo pueden desplazarse distancias subatómicas. Los <span class="term">semiconductores</span> (silicio, germanio) tienen un número de portadores libres intermedio que depende fuertemente de la temperatura y de las impurezas.</p>
<h3>Formas de cargar un cuerpo</h3>
<ul>
<li><strong>Frotamiento (triboelectricidad):</strong> al poner en contacto dos materiales distintos, los electrones pasan al que tiene mayor afinidad electrónica.</li>
<li><strong>Contacto (conducción):</strong> un conductor cargado comparte su carga con otro conductor al tocarlo.</li>
<li><strong>Inducción:</strong> una carga externa redistribuye las cargas libres de un conductor sin tocarlo. Si mientras tanto el conductor se conecta a tierra, parte de su carga fluye a tierra; al desconectar y retirar la carga externa, el conductor queda cargado con signo opuesto al de la carga inductora.</li>
</ul>
<p>Un objeto neutro también es atraído por un cuerpo cargado: la carga externa polariza el objeto (separa ligeramente sus cargas), y como las cargas inducidas de signo contrario quedan más cerca, la atracción vence a la repulsión. Por eso un peine frotado levanta trocitos de papel.</p>
<div class="sim" data-sim="induction-sphere" data-title="Carga por inducción de una esfera conductora"></div>
<div class="sim-guide"><ol>
<li>Paso 1: con la esfera aislada, la carga inducida total es cero; la cara cercana a la varilla adquiere carga de signo opuesto y la lejana del mismo signo.</li>
<li>Paso 2: al conectar a tierra, la carga del mismo signo que la varilla escapa a tierra. La esfera queda con carga neta \(-Qa/D\).</li>
<li>Paso 3: al desconectar y retirar la varilla, esa carga neta se reparte uniformemente sobre la superficie. Acerque más la varilla antes del paso 3 para obtener más carga.</li>
</ol></div>
</section>

<section>
<h2>Ley de Coulomb</h2>
<p>En 1785 Charles-Augustin de Coulomb midió con una balanza de torsión la fuerza entre esferas cargadas pequeñas. Su resultado, expresado en forma vectorial moderna, es: la fuerza que la carga \(q_1\) situada en \(\vb{r}_1\) ejerce sobre la carga \(q_2\) situada en \(\vb{r}_2\) es</p>
<div class="eq key" data-name="Ley de Coulomb">\[\vb{F}_{21}=\frac{1}{4\pi\eo}\,\frac{q_1q_2}{R^2}\,\uv{R}=\frac{q_1q_2}{4\pi\eo}\,\frac{\vb{r}_2-\vb{r}_1}{\abs{\vb{r}_2-\vb{r}_1}^3},\qquad \vb{R}=\vb{r}_2-\vb{r}_1 .\]</div>
<ul>
<li>La fuerza actúa a lo largo de la recta que une las cargas; es repulsiva si \(q_1q_2\gt0\) y atractiva si \(q_1q_2\lt0\).</li>
<li>Es proporcional al producto de las cargas e inversamente proporcional al cuadrado de la distancia.</li>
<li>Cumple la tercera ley de Newton: \(\vb{F}_{12}=-\vb{F}_{21}\).</li>
</ul>
<p>La constante se escribe como \(k=1/(4\pi\eo)\), donde \(\eo\) es la <span class="term">permitividad del vacío</span>:</p>
<div class="eq">\[\eo=8.854\,187\,8\times10^{-12}\un{C^2/(N\,m^2)}\ (\text{o F/m}),\]\[k=\frac{1}{4\pi\eo}=8.987\,55\times10^{9}\un{N\,m^2/C^2}\approx9\times10^9\un{N\,m^2/C^2}.\]</div>
<p>El factor \(4\pi\) se incluye en la ley de Coulomb para que no aparezca en las ecuaciones de Maxwell (sistema “racionalizado”). Desde la redefinición del SI de 2019, \(e\) tiene un valor exacto y \(\eo\) es una cantidad medida.</p>
<div class="box ex">
<h4>Electrón y protón en el átomo de hidrógeno</h4>
<p>En el modelo de Bohr el electrón orbita a \(r=5.29\times10^{-11}\) m del protón. Calcule la fuerza eléctrica y compárela con la gravitacional.</p>
<details><summary>Solución</summary>
<p>\(F_e=\dfrac{ke^2}{r^2}=\dfrac{(8.99\times10^9)(1.602\times10^{-19})^2}{(5.29\times10^{-11})^2}=8.24\times10^{-8}\) N (atractiva).</p>
<p>\(F_g=\dfrac{Gm_em_p}{r^2}=\dfrac{(6.674\times10^{-11})(9.109\times10^{-31})(1.673\times10^{-27})}{(5.29\times10^{-11})^2}=3.63\times10^{-47}\) N.</p>
<p>El cociente es \(F_e/F_g\approx2.3\times10^{39}\): en el mundo atómico la gravedad es completamente despreciable. Para dos protones el cociente es \(1.24\times10^{36}\), independiente de la distancia porque ambas fuerzas decrecen como \(1/r^2\).</p>
</details>
</div>
<div class="sim" data-sim="coulomb-two" data-title="Fuerza entre dos cargas puntuales"></div>
<div class="sim-guide"><ul>

<li>Cambie el signo de una carga: las flechas se invierten (atracción), pero siempre son iguales y opuestas.</li>
</ul></div>

<section>
<h2>Principio de superposición</h2>
<p>La fuerza entre dos cargas no se modifica por la presencia de otras. Por tanto, la fuerza total sobre una carga \(q\) debida a \(N\) cargas es la suma <em>vectorial</em> de las fuerzas individuales:</p>
<div class="eq key" data-name="Superposición">\[\vb{F}=\sum_{i=1}^{N}\frac{q\,q_i}{4\pi\eo}\,\frac{\vb{r}-\vb{r}_i}{\abs{\vb{r}-\vb{r}_i}^3}.\]</div>
<p>La superposición es un hecho experimental (la electrodinámica clásica es lineal); falla sólo en campos extremos de la electrodinámica cuántica. En la práctica: calcule cada fuerza por separado, descompóngala en componentes cartesianas y sume componente a componente.</p>
<div class="box ex">
<h4>Tres cargas en el plano</h4>
<p>\(q_1=+3\ \mu\)C está en el origen, \(q_2=-4\ \mu\)C en \((0.3,\,0)\) m y \(q_3=+1\ \mu\)C en \((0,\,0.4)\) m. Halle la fuerza neta sobre \(q_3\).</p>
<details><summary>Solución</summary>
<p>\(\vb{F}_{31}\): distancia 0.4 m, magnitud \(k(3\times10^{-6})(10^{-6})/0.16=0.169\) N, repulsiva, dirección \(+\uv{y}\).</p>
<p>\(\vb{F}_{32}\): distancia \(\sqrt{0.3^2+0.4^2}=0.5\) m, magnitud \(k(4\times10^{-6})(10^{-6})/0.25=0.144\) N, atractiva: apunta de \(q_3\) hacia \(q_2\), dirección \((0.6,\,-0.8)\). Así \(\vb{F}_{32}=(0.0863,\,-0.1150)\) N.</p>
<p>Total: \(\vb{F}=(0.0863,\ 0.0535)\) N, de magnitud \(0.102\) N a \(31.8^\circ\) sobre el eje \(+x\).</p>
</details>
</div>
<div class="sim" data-sim="coulomb-superposition" data-title="Superposición de fuerzas sobre una carga de prueba"></div>
<div class="sim-guide"><ul>
<li>Arrastre la carga de prueba \(q_0\) (amarilla) y observe cómo la fuerza neta (flecha gruesa) es la suma de las individuales, construida punta con cola.</li>
<li>Busque un punto donde la fuerza neta se anule. ¿Es posible encontrarlo si todas las cargas tienen el mismo signo? ¿Y fuera de la región entre ellas?</li>
</ul></div>
<h3>Equilibrio en una recta</h3>
<p>Un problema clásico: dos cargas fijas \(q_1\) en \(x=0\) y \(q_2\) en \(x=d\). ¿Dónde puede quedar en equilibrio una tercera carga \(q_0\)? La condición \(\abs{q_1}/x^2=\abs{q_2}/(x-d)^2\) con fuerzas en sentidos opuestos da:</p>
<ul>
<li>Si \(q_1\) y \(q_2\) tienen el <em>mismo</em> signo, el punto está entre ellas, en \(x=\dfrac{d}{1+\sqrt{q_2/q_1}}\), más cerca de la carga menor.</li>
<li>Si tienen signos <em>opuestos</em>, está fuera del segmento, del lado de la carga de menor magnitud.</li>
</ul>
<p>La posición no depende de \(q_0\). La estabilidad sí: un equilibrio estable en la recta es siempre inestable en alguna dirección perpendicular. Es el <span class="term">teorema de Earnshaw</span>: ninguna configuración de cargas en reposo puede mantenerse en equilibrio estable sólo con fuerzas electrostáticas (capítulo 7).</p>
<div class="sim" data-sim="line-equilibrium" data-title="Fuerza sobre una carga de prueba a lo largo de una recta"></div>
<div class="sim-guide"><ul>
<li>Con \(q_1=+4\ \mu\)C, \(q_2=+1\ \mu\)C y \(d=30\) cm el equilibrio está en \(x=20\) cm. Compruébelo.</li>
<li>Cambie el signo de \(q_2\): el punto de equilibrio salta fuera del segmento, a \(x=60\) cm.</li>
<li>La pendiente de \(F_x(x)\) en el punto de equilibrio indica la estabilidad a lo largo de la recta: pendiente negativa significa fuerza restauradora.</li>
</ul></div>
</section>

<section>
<h2>Distribuciones continuas de carga</h2>
<p>A escala macroscópica, la carga de un cuerpo se describe mediante densidades continuas. Un elemento de carga \(\dd q\) se escribe según la geometría:</p>
<div class="tablewrap narrow"><table>
<tr><th>Distribución</th><th>Densidad</th><th>Unidades</th><th>Elemento</th></tr>
<tr><td>Lineal (hilo, anillo)</td><td>\(\lambda\)</td><td>C/m</td><td>\(\dd q=\lambda\,\dd l\)</td></tr>
<tr><td>Superficial (lámina, disco)</td><td>\(\sigma\)</td><td>C/m²</td><td>\(\dd q=\sigma\,\dd S\)</td></tr>
<tr><td>Volumétrica (esfera, nube)</td><td>\(\rho_v\)</td><td>C/m³</td><td>\(\dd q=\rho_v\,\dd V\)</td></tr>
</table></div>
<p>La fuerza sobre una carga puntual \(q\) en \(\vb{r}\) se obtiene sumando (integrando) las contribuciones:</p>
<div class="eq">\[\vb{F}=\frac{q}{4\pi\eo}\int\frac{\uv{R}}{R^2}\,\dd q',\qquad \vb{R}=\vb{r}-\vb{r}'.\]</div>
<div class="box warn"><p>\(\uv{R}\) cambia de dirección de un elemento a otro. Antes de integrar, escriba \(\uv{R}/R^2=\vb{R}/R^3\) en componentes cartesianas y aproveche la simetría para ver qué componentes se cancelan.</p></div>
<div class="box ex">
<h4>Varilla cargada y carga en su eje</h4>
<p>Una varilla de longitud \(L\) con carga \(Q\) uniforme está sobre el eje \(x\) entre \(x=0\) y \(x=L\). Halle la fuerza sobre una carga \(q\) situada en \(x=L+d\).</p>
<details><summary>Solución</summary>
<p>Con \(\lambda=Q/L\), el elemento en \(x'\) está a distancia \(L+d-x'\). Todas las contribuciones apuntan en \(+\uv{x}\) (si \(qQ\gt0\)):</p>
<p>\(F=\dfrac{q\lambda}{4\pi\eo}\displaystyle\int_0^L\frac{\dd x'}{(L+d-x')^2}=\frac{q\lambda}{4\pi\eo}\left[\frac1d-\frac1{L+d}\right]=\frac{qQ}{4\pi\eo\,d(d+L)}.\)</p>
<p>Para \(d\gg L\) resulta \(F\approx qQ/(4\pi\eo d^2)\): desde lejos, la varilla actúa como una carga puntual.</p>
</details>
</div>
<div class="sim" data-sim="rod-force" data-title="Fuerza de una varilla cargada: suma de contribuciones"></div>
<div class="sim-guide"><ul>
<li>Las flechas de colores son las contribuciones de cada tramo, dibujadas punta con cola: su suma es la fuerza total (flecha ancha).</li>
<li>Arrastre la carga \(q\) hasta un punto frente al centro de la varilla: las componentes \(x\) de las contribuciones se cancelan por simetría.</li>
<li>Aléjela: la fuerza total se acerca a la de una carga puntual \(Q\) en el centro (compare las dos lecturas).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Cuántos electrones hay que quitar a una esfera para que adquiera una carga de \(+1.0\ \mu\)C?
<details><summary>Respuesta</summary><p>\(n=q/e=6.24\times10^{12}\) electrones.</p></details></li>
<li><span class="lvl">Básico</span>Dos esferas pequeñas con cargas \(+2\ \mu\)C y \(-5\ \mu\)C están a 20 cm. Halle la fuerza. Si se tocan y se separan de nuevo 20 cm (esferas idénticas), ¿cuál es la nueva fuerza?
<details><summary>Respuesta</summary><p>\(F=2.25\) N atractiva. Tras el contacto cada una tiene \(-1.5\ \mu\)C; \(F=0.506\) N repulsiva.</p></details></li>
<li><span class="lvl">Intermedio</span>Tres cargas iguales \(q\) están en los vértices de un triángulo equilátero de lado \(a\). Halle la fuerza sobre una de ellas.
<details><summary>Respuesta</summary><p>\(F=\sqrt3\,\dfrac{q^2}{4\pi\eo a^2}\), dirigida hacia afuera a lo largo de la bisectriz.</p></details></li>
<li><span class="lvl">Intermedio</span>Dos esferitas de masa \(m=2\) g cuelgan de hilos de 50 cm desde un mismo punto; con cargas iguales se separan formando \(10^\circ\) cada hilo con la vertical. Halle la carga.
<details><summary>Respuesta</summary><p>Separación \(r=2L\sen10^\circ=0.1736\) m; \(F_e=mg\tan10^\circ=3.46\times10^{-3}\) N; \(q=r\sqrt{F_e/k}=1.08\times10^{-7}\) C.</p></details></li>
<li><span class="lvl">Intermedio</span>\(q_1=+9\ \mu\)C en \(x=0\) y \(q_2=-1\ \mu\)C en \(x=1\) m. ¿Dónde se anula la fuerza sobre una tercera carga?
<details><summary>Respuesta</summary><p>Fuera del segmento, del lado de \(q_2\): \(3/x=1/(x-1)\Rightarrow x=1.5\) m.</p></details></li>
<li><span class="lvl">Avanzado</span>Un anillo de radio \(a\) con carga \(Q\) uniforme. Halle la fuerza sobre una carga \(q\) en su eje a distancia \(z\) del centro.
<details><summary>Respuesta</summary><p>\(F_z=\dfrac{qQz}{4\pi\eo(z^2+a^2)^{3/2}}\); las componentes radiales se cancelan.</p></details></li>
<li><span class="lvl">Avanzado</span>Una carga \(-q\) de masa \(m\) está en el centro del anillo del problema anterior (con \(Q\gt0\)) y se desplaza ligeramente a lo largo del eje. Demuestre que oscila y halle el período.
<details><summary>Respuesta</summary><p>Para \(z\ll a\), \(F_z\approx-\dfrac{qQ}{4\pi\eo a^3}z\): movimiento armónico simple con \(T=2\pi\sqrt{4\pi\eo ma^3/(qQ)}\).</p></details></li>
</ol>
</section>
