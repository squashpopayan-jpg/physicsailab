<template class="chapter-src" data-id="materiales-magneticos" data-num="15" data-title="Magnetismo en la materia" data-part="Parte IV · Magnetostática" data-short="Magnetización, campo H, dia-, para- y ferromagnetismo, histéresis y circuitos magnéticos">
<p class="lead">Toda la materia responde a un campo magnético, porque sus átomos contienen corrientes microscópicas: electrones que orbitan y que tienen espín. En la mayoría de los materiales la respuesta es diminuta, pero en el hierro, el níquel y el cobalto los dipolos atómicos se alinean espontáneamente y el campo puede multiplicarse por miles.</p>

<section>
<h2>Magnetización</h2>
<p>Un electrón en órbita es una pequeña espira de corriente con momento magnético proporcional a su momento angular, \(\vb{m}=-\dfrac{e}{2m_e}\vb{L}\). El electrón tiene además un momento magnético intrínseco (espín) de valor cercano al <span class="term">magnetón de Bohr</span>:</p>
<div class="eq">\[\mu_B=\frac{e\hbar}{2m_e}=9.274\times10^{-24}\un{A\,m^2}.\]</div>
<p>En un material, estos dipolos se describen en promedio mediante la <span class="term">magnetización</span>, el momento magnético por unidad de volumen, \(\vb{M}=N\langle\vb{m}\rangle\) [A/m]. Un material magnetizado produce el mismo campo que ciertas corrientes ligadas:</p>
<div class="eq key" data-name="Corrientes de magnetización">\[\vb{J}_b=\curl\vb{M},\qquad \vb{K}_b=\vb{M}\times\uv{n}.\]</div>
<p>Un cilindro uniformemente magnetizado a lo largo de su eje equivale, por tanto, a un solenoide con densidad superficial de corriente \(K=M\): dentro, \(B=\mo M\). Las corrientes interiores de dipolos vecinos se cancelan; sólo sobrevive la corriente en la superficie.</p>
</section>

<section>
<h2>El campo H</h2>
<p>La ley de Ampère con todas las corrientes es \(\curl\vb{B}=\mo(\vb{J}_f+\curl\vb{M})\). Agrupando los términos se define el campo \(\vb{H}\), cuyas fuentes son sólo las corrientes libres (las que circulan por los cables y controlamos):</p>
<div class="eq key" data-name="Campo H">\[\vb{H}=\frac{\vb{B}}{\mo}-\vb{M},\qquad \curl\vb{H}=\vb{J}_f,\qquad \oint\vb{H}\cdot\dd\vb{l}=I_{f,\text{enc}}\quad[\mathrm{A/m}].\]</div>
<p>\(\vb{H}\) es el análogo magnético de \(\vb{D}\). En un material <em>lineal</em>, la magnetización es proporcional al campo:</p>
<div class="eq key" data-name="Medio magnético lineal">\[\vb{M}=\chi_m\vb{H},\qquad \vb{B}=\mo(1+\chi_m)\vb{H}=\mu\vb{H},\qquad \mu_r=\frac{\mu}{\mo}=1+\chi_m .\]</div>

<section>
<h2>Diamagnetismo, paramagnetismo y ferromagnetismo</h2>
<ul>
<li><strong>Diamagnetismo</strong> (\(\chi_m\lt0\), muy pequeña): el campo modifica las órbitas electrónicas y aparece un momento inducido opuesto al campo, como una ley de Lenz atómica. Lo presentan todos los materiales, pero sólo se nota cuando no hay otro efecto. Un material diamagnético es repelido por los imanes; con 16 T se puede levitar una rana. Un superconductor es un diamagneto perfecto (\(\chi_m=-1\)).</li>
<li><strong>Paramagnetismo</strong> (\(\chi_m\gt0\), pequeña): los átomos tienen momentos permanentes que el campo tiende a alinear contra la agitación térmica, igual que los dipolos eléctricos del capítulo 10. Resulta la <span class="term">ley de Curie</span>, \(\chi_m=C/T\).</li>
<li><strong>Ferromagnetismo</strong>: en Fe, Co, Ni y algunas aleaciones, una interacción cuántica entre espines vecinos (el intercambio) los alinea espontáneamente en regiones llamadas <span class="term">dominios</span>. Un trozo de hierro sin imanar tiene dominios orientados al azar; un campo externo hace crecer los dominios favorables y rota los demás. Por encima de la <span class="term">temperatura de Curie</span> el orden desaparece y el material se vuelve paramagnético (\(\chi_m=C/(T-T_C)\)): Fe 1043 K, Co 1388 K, Ni 627 K, Gd 293 K.</li>
</ul>
<div class="sim" data-sim="ising-domains" data-title="Dominios magnéticos: modelo de Ising en dos dimensiones"></div>
<div class="sim-guide"><ul>
<li>A baja temperatura (\(T\lt T_C\approx2.27\,J/k_B\)) se forman dominios que crecen hasta magnetizar toda la muestra. Por encima de \(T_C\) el orden desaparece: paramagnetismo.</li>
<li>Active el ciclo automático de campo a baja temperatura: la magnetización traza un lazo de histéresis. Suba la temperatura: el lazo se estrecha y desaparece cerca de \(T_C\).</li>
</ul></div>
</section>

<section>
<h2>Histéresis</h2>
<p>En un ferromagneto la relación entre \(B\) y \(H\) no es lineal ni única: depende de la historia. Partiendo de un material desimanado, la <em>curva de primera imanación</em> crece hasta la saturación. Al reducir \(H\) a cero queda una <span class="term">remanencia</span> \(B_r\); hay que aplicar un campo opuesto, la <span class="term">coercitividad</span> \(H_c\), para anular \(B\). El recorrido completo es el <span class="term">ciclo de histéresis</span>.</p>
<p>El área encerrada es la energía disipada por ciclo y por unidad de volumen, \(w=\oint H\,\dd B\). Los materiales <em>blandos</em> (hierro al silicio, ferritas) tienen ciclos estrechos y se usan en transformadores y motores; los <em>duros</em> (alnico, NdFeB) tienen gran \(H_c\) y \(B_r\), y sirven como imanes permanentes.</p>
<div class="sim" data-sim="bh-hysteresis" data-title="Ciclo de histéresis B–H (modelo de Jiles–Atherton)"></div>
<div class="sim-guide"><ul>
<li>El primer cuarto de ciclo recorre la curva de primera imanación desde el estado desimanado.</li>
<li>Compare el material blando con el duro: \(H_c\) difiere en más de un orden de magnitud y el área del ciclo (pérdidas) también.</li>
<li>Reduzca la amplitud del campo: el ciclo se estrecha y no llega a la saturación.</li>
</ul></div>
</section>

<section>
<h2>Condiciones de frontera magnéticas</h2>
<p>De \(\divg\vb{B}=0\) y \(\curl\vb{H}=\vb{J}_f\), aplicadas a una caja de píldoras y a un lazo que atraviesan la frontera:</p>
<div class="eq key" data-name="Condiciones de frontera">\[B_{1n}=B_{2n},\qquad \vb{H}_{1t}-\vb{H}_{2t}=\vb{K}_f\times\uv{n}\quad(\text{sin corrientes superficiales, }H_{1t}=H_{2t}).\]</div>
<p>Sin corrientes superficiales, las líneas de campo se “refractan” según \(\tan\theta_1/\tan\theta_2=\mu_1/\mu_2\). Como \(\mu_r\) del hierro es enorme, las líneas dentro del hierro corren casi paralelas a su superficie y salen al aire casi perpendiculares a ella. Por eso un material de alta permeabilidad “canaliza” el flujo y se usa como blindaje magnético.</p>
</section>

<section>
<h2>Circuitos magnéticos</h2>
<p>En un núcleo de alta permeabilidad el flujo queda confinado, como la corriente en un cable. Aplicando \(\oint\vb{H}\cdot\dd\vb{l}=NI\) a lo largo del núcleo:</p>
<div class="eq key" data-name="Ley de Hopkinson">\[\Phi=\frac{\mathcal{F}}{\mathcal{R}},\qquad \mathcal{F}=NI,\qquad \mathcal{R}=\frac{l}{\mu A}.\]</div>
<p>La <span class="term">fuerza magnetomotriz</span> \(\mathcal{F}\) hace el papel de la fem, el flujo el de la corriente y la <span class="term">reluctancia</span> \(\mathcal{R}\) el de la resistencia; las reluctancias en serie se suman. Un pequeño entrehierro de aire de longitud \(g\) añade \(g/(\mo A)\), que puede ser mayor que la reluctancia de todo el núcleo: casi toda la fuerza magnetomotriz “cae” en el entrehierro, donde \(B\approx\mo NI/g\).</p>
<div class="sim" data-sim="magnetic-circuit" data-title="Circuito magnético con entrehierro"></div>
<div class="sim-guide"><ul>
<li>Con \(g=0\), \(B\) es proporcional a \(\mu_r\). Abra un entrehierro de 1 mm: el campo cae drásticamente y deja de depender de \(\mu_r\).</li>
<li>Si \(B\) supera unos 1.6 T, el hierro real se satura y el modelo lineal deja de ser válido.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un solenoide largo de 1000 espiras/m con 2 A tiene un núcleo de hierro con \(\mu_r=4000\). Halle \(H\), \(B\) y \(M\).
<details><summary>Respuesta</summary><p>\(H=nI=2000\) A/m; \(B=\mu_r\mo H=10.1\) T (en la práctica el hierro se saturaría hacia 2 T); \(M=(\mu_r-1)H\approx8\times10^6\) A/m.</p></details></li>
<li><span class="lvl">Básico</span>Un imán cilíndrico tiene magnetización uniforme \(M=10^6\) A/m a lo largo de su eje. ¿Qué corriente superficial equivalente tiene? ¿Qué campo hay en su interior si es muy largo?
<details><summary>Respuesta</summary><p>\(K_b=M=10^6\) A/m; \(B=\mo M=1.26\) T; \(H=0\).</p></details></li>
<li><span class="lvl">Intermedio</span>Un toroide de hierro (\(\mu_r=2000\)) de radio medio 10 cm y sección 2 cm² tiene 400 espiras con 0.5 A. Halle el flujo. Repita con un entrehierro de 2 mm.
<details><summary>Respuesta</summary><p>Sin entrehierro: \(B=\mu NI/(2\pi r)=0.80\) T, \(\Phi=0.16\) mWb. Con entrehierro: \(\mathcal{R}=\frac{0.628}{2000\mo A}+\frac{0.002}{\mo A}\), \(B=0.109\) T.</p></details></li>
<li><span class="lvl">Intermedio</span>Una línea de campo pasa del aire al hierro (\(\mu_r=1000\)) formando \(1^\circ\) con la normal. ¿Qué ángulo forma dentro del hierro?
<details><summary>Respuesta</summary><p>\(\tan\theta_2=1000\tan1^\circ=17.5\Rightarrow\theta_2=86.7^\circ\): casi paralela a la superficie.</p></details></li>
<li><span class="lvl">Avanzado</span>El ciclo de histéresis de un núcleo tiene un área de 250 J/m³. ¿Qué potencia se pierde a 60 Hz en un núcleo de 2 kg (densidad 7650 kg/m³)?
<details><summary>Respuesta</summary><p>\(V=2.61\times10^{-4}\) m³; \(P=250\times60\times V=3.9\) W.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que en una esfera uniformemente magnetizada el campo interior es \(\vb{B}=\tfrac23\mo\vb{M}\).
<details><summary>Respuesta</summary><p>\(\vb{K}_b=M\sen\theta\,\uv{\phi}\), la misma distribución de una esfera cargada que gira; su campo interior es uniforme e igual a \(\tfrac23\mo\vb{M}\).</p></details></li>
</ol>
</section>
