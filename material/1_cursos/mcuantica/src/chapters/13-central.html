<template class="chapter-src" data-id="central" data-num="13" data-title="Potenciales centrales" data-part="Parte III · Momento angular y el átomo" data-short="La ecuación radial y la barrera centrífuga, la partícula libre y las ondas parciales, el pozo esférico infinito y los puntos cuánticos, el oscilador isótropo y los números mágicos del modelo de capas nuclear, el pozo finito y el deuterón">
<p class="lead">Cuando la energía potencial solo depende de la distancia al centro, \(V=V(r)\), el momento angular se conserva y la ecuación tridimensional de Schrödinger se reduce a una ecuación unidimensional para la parte radial, con una contribución extra, la barrera centrífuga. Con ella se resuelven el pozo esférico (puntos cuánticos), el oscilador isótropo (modelo de capas nuclear) y, en el capítulo siguiente, el átomo de hidrógeno. La parte angular es siempre la misma, los armónicos esféricos del capítulo 12, y lo que cambia de un problema a otro es una sola función de una variable.</p>

<section>
<h2>La ecuación radial</h2>
<p>Con \(V=V(r)\), \(\hat H=-\tfrac{\hbar^2}{2m}\nabla^2+V(r)\) conmuta con \(\hat L^2\) y \(\hat L_z\), así que se buscan soluciones \(\psi(\mathbf r)=R(r)Y_l^m(\theta,\phi)\). En coordenadas esféricas, \(\nabla^2=\tfrac1{r^2}\partial_r(r^2\partial_r)-\tfrac{\hat L^2}{\hbar^2r^2}\), y con \(\hat L^2Y=\hbar^2l(l+1)Y\) queda una ecuación solo en \(r\). Con el cambio \(u(r)=rR(r)\), que elimina el término de primera derivada:</p>
<div class="eq key" data-name="Ecuación radial">\[-\frac{\hbar^2}{2m}\frac{\dd^2u}{\dd r^2}+\left[V(r)+\frac{\hbar^2l(l+1)}{2mr^2}\right]u=Eu,\qquad u(0)=0,\qquad\int_0^\infty|u|^2\dd r=1.\]</div>
<p>Es la ecuación de una partícula unidimensional en \(r\gt0\) con el <span class="term">potencial efectivo</span> \(V_\text{ef}=V+\hbar^2l(l+1)/2mr^2\): el segundo término es la energía cinética de la rotación, la <em>barrera centrífuga</em>, que aleja a la partícula del centro cuando \(l\gt0\). Cerca del origen, si \(V\) no es más singular que \(1/r\), la solución regular es \(u\sim r^{l+1}\), esto es, \(R\sim r^l\): los estados con \(l\) grande casi no «ven» el centro. La condición \(u(0)=0\) elimina la solución irregular \(R\sim r^{-l-1}\). La densidad de probabilidad radial es \(P(r)\dd r=|u(r)|^2\dd r\), pues \(\int|\psi|^2r^2\dd r\,\dd\Omega=\int|R|^2r^2\dd r=\int|u|^2\dd r\). Los niveles se etiquetan con \(l\) y con un número \(n_r=0,1,2,\dots\) igual al número de nodos de \(u\) en \(r\gt0\). La energía \(E_{n_rl}\) no depende de \(m\): cada nivel tiene al menos la degeneración \(2l+1\), consecuencia de la simetría esférica (capítulo 18). Algunos potenciales (oscilador y Coulomb) tienen además degeneraciones «accidentales» entre distintos \(l\).</p>
<div class="sim" data-sim="radial" data-title="Ecuación radial: potencial efectivo, niveles y funciones u(r) en cuatro potenciales"></div>
<div class="sim-guide"><ul>
<li>Oscilador con \(l=1\): \(E=2n_r+l+\tfrac32=2.5,\ 4.5,\ 6.5,\ 8.5\) (diferencias finitas: 2.5000, 4.5000, 6.4999, 8.4999). Con \(l=2\), \(n_r=1\): \(E=5.5\). La barrera centrífuga empuja el máximo de \(u\) hacia afuera (\(r=1.415\) para 1p).</li>
<li>Caja esférica con \(l=1\): \(E=\xi^2/2\) con \(\xi=4.4934,\ 7.7253,\ 10.9041,\ 14.0662\): 10.095, 29.840, 59.450, 98.929 (unidades \(\hbar^2/ma^2\)); el pozo finito con \(V_0=30\) y \(l=0\) tiene 2 estados ligados, \(-26.149\) y \(-14.905\), y con \(l\ge1\) la barrera centrífuga los vuelve casi ligados.</li>
<li>Coulomb con \(l=0\): \(-0.5000,\ -0.1250,\ -0.0556,\ -0.0312\) (\(-1/2n^2\) para \(n=1\) a 4). Para el mismo \(n_r\) y \(l\) crecientes se obtiene la misma energía \(E=-1/2(n_r+l+1)^2\): la degeneración accidental de \(l\) del hidrógeno (capítulo 14).</li>
</ul></div>
</section>

<section>
<h2>La partícula libre en coordenadas esféricas</h2>
<p>Con \(V=0\), la ecuación radial se resuelve con las <span class="term">funciones de Bessel esféricas</span>: \(R=j_l(kr)\) (regular en 0) y \(n_l(kr)\) (singular), con \(k=\sqrt{2mE}/\hbar\). Las primeras son \(j_0(x)=\dfrac{\sin x}x\), \(j_1(x)=\dfrac{\sin x}{x^2}-\dfrac{\cos x}x\), con el comportamiento \(j_l\sim x^l/(2l+1)!!\) para \(x\to0\) y \(j_l\to\sin(x-l\pi/2)/x\) para \(x\to\infty\). Una onda plana, que tiene un momento lineal definido, es una superposición de estados de \(l\) definido, las <em>ondas parciales</em> (desarrollo de Rayleigh):</p>
<div class="eq key" data-name="Onda plana en ondas parciales">\[e^{\ii kz}=\sum_{l=0}^{\infty}\ii^l(2l+1)\,j_l(kr)\,P_l(\cos\theta).\]</div>
<p>Cada onda parcial representa a las partículas que pasan a una «distancia de impacto» \(b\approx l/k\) del centro (\(L=\hbar l=pb\)); como \(j_l(kr)\) es casi nula para \(l\gt kr\) (la barrera centrífuga), a una distancia \(r\) solo contribuyen las \(l\lesssim kr\). Esta descomposición es la base de la teoría de la dispersión (capítulo 25): un potencial de alcance \(r_0\) solo afecta a las ondas con \(l\lesssim kr_0\), y a baja energía basta con \(l=0\).</p>
<div class="sim" data-sim="parciales" data-title="Ondas parciales: la onda plana como suma de ondas de momento angular definido"></div>
<div class="sim-guide"><ul>
<li>A \(kr=10\) y \(\theta=0\): con \(L=10\) términos el error aún es 0.74; con \(L=15\), 0.011; hacen falta \(L=23\) para bajar de \(10^{-6}\). A \(kr=5\) bastan 15 y a \(kr=20\), 36: el número de ondas parciales necesarias crece algo más rápido que \(kr\) (la cola de la serie decae solo cuando \(l\gt kr\) en una anchura \(\sim(kr)^{1/3}\)).</li>
<li>Con \(L=0\) la onda parcial \(j_0(kr)=\sin kr/kr\) (onda esférica estacionaria) es una pobre descripción de la onda plana, con error 0.95: la onda plana no tiene simetría esférica.</li>
</ul></div>
</section>

<section>
<h2>El pozo esférico infinito: puntos cuánticos</h2>
<p>Para \(V=0\) en \(r\lt a\) y \(V=\infty\) fuera, se exige \(u(a)=0\), es decir, \(j_l(ka)=0\): \(ka=\xi_{n,l}\), el \(n\)-ésimo cero de \(j_l\). Para \(l=0\), \(j_0=\sin x/x\) tiene ceros en \(n\pi\) (como la caja unidimensional), y los demás se encuentran numéricamente:</p>
<div class="eq key" data-name="Pozo esférico infinito">\[E_{n,l}=\frac{\hbar^2\xi_{n,l}^2}{2ma^2},\quad\xi_{1,0}=\pi,\ \xi_{1,1}=4.4934,\ \xi_{1,2}=5.7635,\ \xi_{2,0}=2\pi,\ \xi_{1,3}=6.9879,\ \xi_{2,1}=7.7253,\ \xi_{1,4}=8.1826\ \dots\]</div>
<p>El orden de los niveles es \(1s\lt1p\lt1d\lt2s\lt1f\lt2p\lt1g\dots\) (con \(\xi^2=9.87,\ 20.19,\ 33.22,\ 39.48,\ 48.83,\ 59.68,\ 66.95\)). Es el modelo más simple de un <span class="term">punto cuántico</span>: un nanocristal semiconductor donde electrones y huecos están confinados. Como \(E\propto1/a^2\), el <em>color</em> de la luz absorbida o emitida depende del radio.</p>
<div class="box ex"><h4>El color de un punto cuántico de CdSe</h4>
<p><strong>Datos.</strong> Nanocristal esférico de radio \(a\), brecha del material \(E_g=1.74\) eV, masas efectivas \(m_e^*=0.13\,m_e\) y \(m_h^*=0.45\,m_e\); \(\hbar^2/2m_e=0.0381\) eV·nm². <strong>Procedimiento.</strong> (1) La energía mínima de confinamiento del par electrón–hueco en el nivel \(1s\) de cada uno es \(\dfrac{\hbar^2\pi^2}{2a^2}\left(\dfrac1{m_e^*}+\dfrac1{m_h^*}\right)\). Con \(a=2\) nm: \(0.0381\times9.8696/4\times(7.692+2.222)=0.932\) eV. (2) Energía de absorción: \(E_g+0.932=2.672\) eV, \(\lambda=464\) nm (azul). (3) Con \(a=1.5\) nm: 3.397 eV (365 nm); con \(a=3\) nm: 2.154 eV (576 nm); con \(a=4\) nm: 1.973 eV (628 nm). (4) El electrón: \(1s\to1p\) cuesta \(\tfrac{\hbar^2}{2m_e^*a^2}(\xi_{1,1}^2-\pi^2)=0.756\) eV (1.64 µm, infrarrojo). <strong>Resultado.</strong> El color pasa del azul al rojo al crecer el radio de 2 a 4 nm. El modelo omite la atracción coulombiana electrón–hueco y la profundidad finita de la barrera (capítulo 7), que corrigen la energía en decenas de meV a más de 100 meV; el premio Nobel de Química de 2023 reconoció el descubrimiento y la síntesis de estos puntos cuánticos.</p></div>
</section>

<section>
<h2>El oscilador isótropo y los números mágicos</h2>
<p>Para \(V=\tfrac12m\omega^2r^2\) la ecuación se separa también en cartesianas, y \(E=\hbar\omega(n_x+n_y+n_z+\tfrac32)\) con \(n_i=0,1,\dots\) (capítulo 9). En esféricas, la ecuación radial da \(E=\hbar\omega(2n_r+l+\tfrac32)\): la energía depende solo de \(N=2n_r+l\), y los \(\tfrac12(N+1)(N+2)\) estados de cada capa se reparten entre \(l=N,N-2,\dots\) (por ejemplo \(N=2\): \(l=2\) con 5 estados y \(l=0\) con 1: \(6\) en total). Con espín (dos proyecciones) cada capa tiene \((N+1)(N+2)\) estados, y llenar capas completas da el total \(2,\,8,\,20,\,40,\,70,\,112,\dots\) El modelo de capas nuclear (Goeppert Mayer y Jensen, 1949, Nobel 1963) trata a cada nucleón como una partícula en un potencial central medio, y los núcleos con un número de protones o neutrones igual a 2, 8, 20, 28, 50, 82 o 126 (los <span class="term">números mágicos</span>) son particularmente estables. El oscilador explica los tres primeros, pero no 28, 50, 82 ni 126, y para obtenerlos hay que agregar dos términos: uno \(\propto-\boldsymbol l^2\) (el potencial real es más plano que un oscilador, lo que baja los estados de \(l\) grande) y un fuerte <em>acoplamiento espín–órbita</em> \(-2\kappa\,\boldsymbol l\cdot\boldsymbol s\), con \(\boldsymbol l\cdot\boldsymbol s=\tfrac12[j(j+1)-l(l+1)-\tfrac34]\hbar^2\), esto es \(+l/2\) para \(j=l+\tfrac12\) y \(-(l+1)/2\) para \(j=l-\tfrac12\). El nivel con \(j\) mayor baja, y con \(l\) grande el desdoblamiento es tan grande que un subnivel (\(1f_{7/2}\), \(1g_{9/2}\), \(1h_{11/2}\), \(1i_{13/2}\)) baja a la capa inferior y la cierra en 28, 50, 82 y 126.</p>
<div class="sim" data-sim="capas" data-title="Capas cerradas: caja esférica, oscilador 3D y modelo de capas nuclear con espín–órbita"></div>
<div class="sim-guide"><ul>
<li>Oscilador puro: capas cerradas en 2, 8, 20, 40, 70, 112, 168 (brechas iguales a \(\hbar\omega\) entre capas \(N\)). Caja esférica: 2, 8, 20, 34, 40, 58, 92, 132…: ordenados \(1s,1p,1d,2s,1f,2p,1g,2d,1h,3s\), con 58 y 92 como cierres nítidos.</li>
<li>Modelo nuclear con \(\kappa=0.05\), \(\mu=0.5\): umbral 0.3 \(\hbar\omega\): 2, 8, 20, 28, 40, 50, 82, 126, 210…; los siete números mágicos reales (2, 8, 20, 28, 50, 82, 126) aparecen todos; con el umbral 0.4 (el valor por defecto) quedan 2, 8, 20, 50, 82, 126 y 210, porque el 28 y el 40 son brechas más pequeñas. Los niveles \(1s_{1/2},1p_{3/2},1p_{1/2},1d_{5/2},1d_{3/2},2s_{1/2}\) cierran en 20; \(1f_{7/2}\) (8 estados) cierra el 28 y \(1g_{9/2}\) (10 estados) el 50.</li>
<li>Haga \(\kappa=0\): se recuperan los números del oscilador. El espín–órbita rompe la degeneración de cada \(l\) en \(j=l\pm\tfrac12\) y es la clave de los números mágicos mayores.</li>
</ul></div>
</section>

<section>
<h2>El pozo esférico finito y el deuterón</h2>
<p>Para \(V=-V_0\) en \(r\lt a\) y 0 fuera, con \(l=0\): \(u=\sin kr\) dentro (\(k=\sqrt{2m(E+V_0)}/\hbar\)) y \(u=e^{-\kappa r}\) fuera (\(\kappa=\sqrt{-2mE}/\hbar\)). La continuidad de \(u'/u\) en \(r=a\) da \(k\cot ka=-\kappa\); con \(x=ka\) y \(z_0=a\sqrt{2mV_0}/\hbar\):</p>
<div class="eq key" data-name="Pozo esférico finito, l = 0">\[-x\cot x=\sqrt{z_0^2-x^2}\qquad\Longrightarrow\qquad\text{hay un estado ligado solo si }z_0\gt\frac\pi2,\ \ \text{es decir}\ \ V_0a^2\gt\frac{\pi^2\hbar^2}{8m}.\]</div>
<p>A diferencia del pozo unidimensional (capítulo 7), en tres dimensiones <em>hace falta una profundidad mínima</em>: \(u(0)=0\) equivale a una pared infinita en \(r=0\), y entonces el estado fundamental unidimensional del semipozo es el primero con un nodo en 0, que exige \(z_0\gt\pi/2\). El deuterón (un protón y un neutrón ligados con \(B=2.2246\) MeV) es el caso límite: su fuerza nuclear es casi lo bastante débil como para no ligar.</p>
<div class="box ex"><h4>El deuterón como un pozo esférico</h4>
<p><strong>Datos.</strong> Masa reducida \(\mu=0.50399\) u, \(\hbar^2/2\mu=41.471\) MeV·fm², \(B=2.2246\) MeV, alcance de la fuerza \(a=2.0\) fm. <strong>Procedimiento.</strong> (1) \(\kappa=\sqrt{2\mu B}/\hbar=0.2316\) fm⁻¹: la función de onda decae con \(1/\kappa=4.32\) fm. (2) Umbral: \(V_0^\text{mín}=\pi^2\hbar^2/8\mu a^2=41.471\pi^2/(4\times4)=25.58\) MeV. (3) Para reproducir \(B=2.2246\) MeV se necesita \(V_0=36.57\) MeV (\(k=0.910\) fm⁻¹, \(ka=1.820\)). (4) Probabilidad de hallar al protón y al neutrón fuera del alcance de la fuerza (\(r\gt a\)): 64.2 %. <strong>Resultado.</strong> El deuterón es un sistema poco ligado, casi un «halo»: dos tercios del tiempo los nucleones están más allá del alcance de su fuerza, y el sistema es muy sensible a pequeños cambios de \(V_0\) (con \(V_0=35\) MeV, un 4 % menos, \(B=1.69\) MeV, 24 % menos; con 38 MeV, un 4 % más, 2.76 MeV, 24 % más).</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un electrón está en una caja esférica de 1 nm de radio. Calcule las energías de \(1s\), \(1p\), \(1d\) y \(2s\), y la longitud de onda de la transición \(1s\to1p\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Fórmula.</b> \(E_{n,l}=\hbar^2\xi_{n,l}^2/2ma^2\), con \(\hbar^2/2m_e=0.03810\) eV·nm² y \(a=1\) nm.</li>
<li><b>Ceros de \(j_l\).</b> \(\xi_{1,0}=\pi\), \(\xi_{1,1}=4.4934\) (raíz de \(\tan x=x\)), \(\xi_{1,2}=5.7635\), \(\xi_{2,0}=2\pi\).</li>
<li><b>Energías.</b> \(1s\): \(0.0381\times9.8696=0.3760\) eV. \(1p\): \(0.0381\times20.191=0.7693\) eV. \(1d\): \(0.0381\times33.217=1.2656\) eV. \(2s\): \(0.0381\times39.478=1.5041\) eV.</li>
<li><b>Transición.</b> \(1s\to1p\): \(0.7693-0.3760=0.3932\) eV, \(\lambda=1239.84/0.3933=3152\) nm (infrarrojo).</li>
<li><b>Resultado.</b> <span class="ans">0.376, 0.769, 1.266 y 1.504 eV; \(\lambda=3.15\) µm.</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Para el oscilador isótropo, calcule la degeneración de las capas \(N=0,\dots,4\) con y sin espín, y los números mágicos que resultan.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Sin espín.</b> El número de ternas \((n_x,n_y,n_z)\) con suma \(N\) es \(\tfrac12(N+1)(N+2)\): 1, 3, 6, 10, 15.</li>
<li><b>Con espín.</b> Se multiplica por 2: 2, 6, 12, 20, 30.</li>
<li><b>Reparto por \(l\).</b> \(N=3\): \(l=3\) (7 estados) y \(l=1\) (3): total 10 ✓. \(N=4\): \(l=4,2,0\): \(9+5+1=15\) ✓.</li>
<li><b>Acumulado.</b> \(2,\ 8,\ 20,\ 40,\ 70\): son los números mágicos del oscilador (los tres primeros coinciden con los nucleares; 28 y 50 no aparecen).</li>
<li><b>Resultado.</b> <span class="ans">Degeneraciones con espín 2, 6, 12, 20, 30; capas cerradas en 2, 8, 20, 40, 70.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Deduzca la ecuación radial para \(u=rR\), muestre que cerca del origen \(u\sim r^{l+1}\) y compruebe que \(u=r\,e^{-r^2/2}\) (\(l=0\), \(\hbar=m=\omega=1\)) es solución del oscilador isótropo con \(E=\tfrac32\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Laplaciano.</b> \(\nabla^2(R\,Y)=Y\,\dfrac1{r^2}(r^2R')'-\dfrac{l(l+1)}{r^2}RY\). Con \(R=u/r\): \(R'=u'/r-u/r^2\), \(r^2R'=ru'-u\), \((r^2R')'=ru''\), así que \(\tfrac1{r^2}(r^2R')'=u''/r\).</li>
<li><b>Ecuación.</b> \(-\tfrac{\hbar^2}{2m}\left[\dfrac{u''}r-\dfrac{l(l+1)u}{r^3}\right]+V\dfrac ur=E\dfrac ur\); multiplicando por \(r\): la ecuación radial.</li>
<li><b>Origen.</b> Si \(V\) es regular, domina la barrera: \(u''\approx\dfrac{l(l+1)}{r^2}u\), con soluciones \(u=r^{l+1}\) y \(r^{-l}\); la regular es \(r^{l+1}\).</li>
<li><b>Comprobación del ejemplo.</b> \(u=re^{-r^2/2}\): \(u'=(1-r^2)e^{-r^2/2}\), \(u''=(r^3-3r)e^{-r^2/2}\). Con \(V=r^2/2\), \(l=0\): \(-\tfrac12u''+\tfrac12r^2u=\tfrac12(3r-r^3)e^{-r^2/2}+\tfrac12r^3e^{-r^2/2}=\tfrac32re^{-r^2/2}=\tfrac32u\).</li>
<li><b>Resultado.</b> <span class="ans">\(E=\tfrac32\hbar\omega\); \(u\sim r^{l+1}\) cerca del origen.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que \(u=\sin kr\) resuelve la ecuación radial libre con \(l=0\) y que \(j_0\) es la onda parcial \(l=0\) de la onda plana. Estime cuántas ondas parciales se necesitan en \(kr=10\) y 20.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Ecuación.</b> \(-\tfrac{\hbar^2}2u''=Eu\) con \(u=\sin kr\): \(u''=-k^2u\), luego \(E=\hbar^2k^2/2m\) ✓. \(u(0)=0\) ✓.</li>
<li><b>\(R\).</b> \(R=u/r=\sin kr/r\propto j_0(kr)\).</li>
<li><b>Onda parcial \(l=0\).</b> Promedio angular de \(e^{\ii kz}\): \(\tfrac12\int_{-1}^1e^{\ii kr\cos\theta}\dd\cos\theta=\tfrac{\sin kr}{kr}=j_0(kr)\) ✓ (coeficiente \(\ii^0(2\cdot0+1)=1\)).</li>
<li><b>Convergencia.</b> Evaluando la serie \(\sum(2l+1)\ii^lj_l(kr)\) para \(\theta=0\) (donde debe dar \(e^{\ii kr}\)): error \(\lt10^{-6}\) con \(L=15\) en \(kr=5\), \(L=23\) en \(kr=10\) y \(L=36\) en \(kr=20\). Es algo más que \(kr\): hay que superar el «borde clásico» \(l\approx kr\).</li>
<li><b>Resultado.</b> <span class="ans">\(j_0\) es la onda parcial \(l=0\); se necesitan unas 15, 23 y 36 ondas parciales en \(kr=5,10,20\).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Para un punto cuántico de CdSe de radio 2 nm (\(m_e^*=0.13\), \(m_h^*=0.45\), \(E_g=1.74\) eV), calcule la energía y la longitud de onda de absorción y la transición \(1s\to1p\) del electrón; compare con radios de 3 y 4 nm.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Confinamiento.</b> Para cada portador, \(E_{1s}=\hbar^2\pi^2/(2m^*a^2)\). Con \(\hbar^2/2m_e=0.0381\) eV·nm² y \(a=2\) nm: \(0.0381\times9.8696/4=0.09401\) eV·\(m_e/m^*\).</li>
<li><b>Suma.</b> \(0.09401\times(1/0.13+1/0.45)=0.09400\times9.915=0.932\) eV.</li>
<li><b>Absorción.</b> \(E=1.74+0.932=2.672\) eV; \(\lambda=1239.84/2.672=464\) nm.</li>
<li><b>\(1s\to1p\) del electrón.</b> \(\Delta E=\dfrac{0.0381}{0.13\times4}(20.191-9.870)=0.07327\times10.321=0.756\) eV, \(\lambda=1.64\) µm.</li>
<li><b>Otros radios.</b> \(a=3\) nm: \(0.0381\times9.8696/9\times9.915=0.4143\) eV, \(E=2.154\) eV (576 nm). \(a=4\) nm: \(0.2329\) eV, 1.973 eV (628 nm).</li>
<li><b>Resultado.</b> <span class="ans">464 nm (2.67 eV), 576 nm y 628 nm para 2, 3 y 4 nm; \(1s\to1p\): 0.756 eV (1.64 µm).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Con un pozo esférico de \(a=2.0\) fm, determine el umbral de profundidad para un estado ligado y el valor de \(V_0\) que da el deuterón (\(B=2.2246\) MeV); calcule \(\kappa\), \(1/\kappa\) y la probabilidad de estar fuera del pozo.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Umbral.</b> \(z_0=\pi/2\Rightarrow V_0^\text{mín}=\dfrac{\pi^2\hbar^2}{8\mu a^2}=\dfrac{\pi^2(2\hbar^2/2\mu)}{8a^2}=\dfrac{\pi^2\times82.94}{8\times4}=25.58\) MeV (con \(\hbar^2/2\mu=41.471\) MeV·fm²).</li>
<li><b>\(\kappa\).</b> \(\kappa=\sqrt{B/(\hbar^2/2\mu)}=\sqrt{2.2246/41.471}=0.2316\) fm⁻¹; \(1/\kappa=4.318\) fm.</li>
<li><b>Condición de empalme.</b> \(k\cot ka=-\kappa\) con \(k=\sqrt{(V_0-B)/(\hbar^2/2\mu)}\). Para \(a=2\) fm se resuelve por bisección en \(k\in(\pi/2a,\pi/a)\): \(V_0=36.57\) MeV, \(k=0.9100\) fm⁻¹, \(ka=1.820\).</li>
<li><b>Normalización.</b> \(u=A\sin kr\) (\(r\lt a\)), \(u=A\sin ka\,e^{-\kappa(r-a)}\) (\(r\gt a\)). \(\int_0^a=A^2\left[\tfrac a2-\tfrac{\sin2ka}{4k}\right]\), \(\int_a^\infty=A^2\sin^2ka/2\kappa\).</li>
<li><b>Fuera.</b> \(P_\text{fuera}=\dfrac{\sin^2ka/2\kappa}{\tfrac a2-\tfrac{\sin2ka}{4k}+\sin^2ka/2\kappa}=0.642\).</li>
<li><b>Resultado.</b> <span class="ans">\(V_0^\text{mín}=25.58\) MeV; \(V_0=36.57\) MeV; \(1/\kappa=4.32\) fm; \(P(r\gt a)=64.2\ \%\).</span></li>
</ol></details></li>
</ol>
