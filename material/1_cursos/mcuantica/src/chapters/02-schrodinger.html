<template class="chapter-src" data-id="schrodinger" data-num="2" data-title="La ecuación de Schrödinger y la interpretación de Born" data-part="Parte I · Los orígenes y la función de onda" data-short="La función de onda y su interpretación probabilística, la ecuación de Schrödinger, la conservación de la probabilidad y la corriente, los estados estacionarios, las frecuencias de Bohr y la interferencia de electrones">
<p class="lead">El capítulo anterior terminó pidiendo una ecuación para la onda de materia. Aquí se plantea (Schrödinger, 1926), se explica por qué tiene la forma que tiene, se fija su significado (Born, 1926) y se extraen sus primeras consecuencias generales: la probabilidad se conserva, existen estados de energía definida cuya densidad no cambia con el tiempo, y toda superposición de ellos oscila con las frecuencias de Bohr. El capítulo termina con la interferencia de electrones, el experimento donde se ve con más claridad que lo que se suma son amplitudes y no probabilidades.</p>

<section>
<h2>La ecuación de Schrödinger</h2>
<p>Una partícula libre tiene energía \(E=p^2/2m\). La onda de de Broglie asociada es \(\Psi=e^{i(kx-\omega t)}\) con \(p=\hbar k\) y \(E=\hbar\omega\), así que su relación de dispersión es \(\hbar\omega=\hbar^2k^2/2m\). Se busca una ecuación diferencial de la que esa relación salga para toda onda plana, y que cumpla tres exigencias: ser <em>lineal</em> (para que las superposiciones de soluciones sean soluciones, condición de la interferencia), ser de <em>primer orden en el tiempo</em> (para que \(\Psi(x,0)\) determine \(\Psi(x,t)\)) y reproducir \(E=p^2/2m\). Derivando la onda plana, \(\partial_t\Psi=-i\omega\Psi\) y \(\partial_x^2\Psi=-k^2\Psi\), de modo que</p>
<div class="eq">\[\ii\hbar\,\partial_t\Psi=\hbar\omega\,\Psi=\frac{\hbar^2k^2}{2m}\Psi=-\frac{\hbar^2}{2m}\,\partial_x^2\Psi .\]</div>
<p>Si además hay una energía potencial \(V(\mathbf r,t)\), la energía total \(E=p^2/2m+V\) se traduce, con las sustituciones \(E\to\ii\hbar\partial_t\) y \(\mathbf p\to-\ii\hbar\nabla\), en:</p>
<div class="eq key" data-name="Ecuación de Schrödinger dependiente del tiempo">\[\ii\hbar\frac{\partial\Psi(\mathbf r,t)}{\partial t}=\hat H\Psi=\left[-\frac{\hbar^2}{2m}\nabla^2+V(\mathbf r,t)\right]\Psi(\mathbf r,t).\]</div>
<p>Esto <em>no</em> es una deducción: es un postulado que se justifica por sus consecuencias, y que Schrödinger obtuvo en 1926 a partir de la analogía óptico-mecánica de Hamilton. Dos observaciones. La presencia de \(\ii\) no es un adorno: una ecuación real de primer orden en \(t\) y de segundo en \(x\) sería la de difusión del calor, cuyas soluciones se amortiguan; el \(\ii\) convierte la difusión en propagación ondulatoria (\(e^{-iEt/\hbar}\) tiene módulo constante). Y la función \(\Psi\) es compleja: no es una cantidad medible, sino una <em>amplitud de probabilidad</em>.</p>
</section>

<section>
<h2>La interpretación de Born</h2>
<p>Max Born propuso en 1926, en una nota al pie de un artículo sobre colisiones, que \(|\Psi(\mathbf r,t)|^2\) es una <span class="term">densidad de probabilidad</span>:</p>
<div class="eq key" data-name="Regla de Born">\[P(a\lt x\lt b,\,t)=\int_a^b|\Psi(x,t)|^2\,\dd x,\qquad \int_{-\infty}^{\infty}|\Psi(x,t)|^2\,\dd x=1.\]</div>
<p>La segunda igualdad es la <em>normalización</em>: la partícula está en algún sitio con probabilidad 1. Una función que no es de cuadrado integrable no representa un estado físico (se tratan aparte las ondas planas, en el capítulo 3). Como la ecuación es lineal, si \(\Psi\) es solución también lo es \(A\Psi\); se escoge la constante \(A\) para normalizar, y queda libre solo una fase global \(e^{i\gamma}\), sin efecto físico. La <em>fase relativa</em> entre dos partes de la función, en cambio, sí importa: determina la interferencia.</p>
<p>Con esta regla, los resultados de las medidas se predicen con promedios ponderados por \(|\Psi|^2\):</p>
<div class="eq">\[\langle x\rangle=\int x|\Psi|^2\dd x,\qquad \langle x^2\rangle=\int x^2|\Psi|^2\dd x,\qquad \Delta x=\sqrt{\langle x^2\rangle-\langle x\rangle^2}.\]</div>
<div class="box ex"><h4>Normalización de un paquete gaussiano</h4>
<p><strong>Problema.</strong> Normalizar \(\psi(x)=Ae^{-x^2/4\sigma^2}\) y calcular \(\langle x\rangle\) y \(\Delta x\). <strong>Procedimiento.</strong> (1) La integral gaussiana es \(\int_{-\infty}^\infty e^{-x^2/2\sigma^2}\dd x=\sigma\sqrt{2\pi}\). (2) \(|\psi|^2=A^2e^{-x^2/2\sigma^2}\), de modo que \(1=A^2\sigma\sqrt{2\pi}\Rightarrow A=(2\pi\sigma^2)^{-1/4}\). (3) \(|\psi|^2\) es par, luego \(\langle x\rangle=0\). (4) \(\langle x^2\rangle=A^2\int x^2e^{-x^2/2\sigma^2}\dd x=A^2\sigma^3\sqrt{2\pi}=\sigma^2\). <strong>Resultado.</strong> \(\Delta x=\sigma\): el parámetro \(\sigma\) es exactamente la desviación típica de la posición, y por eso se escribe \(e^{-x^2/4\sigma^2}\).</p></div>
<div class="sim" data-sim="norma" data-title="Normalización y probabilidades con una función de onda dada"></div>
<div class="sim-guide"><ul>
<li>Con la gaussiana (\(\sigma=1\)) la constante es \(A=0.63162=(2\pi)^{-1/4}\); la probabilidad en \([-1,1]\) es 68.27 %, la regla del «un sigma» de la estadística. En \([-2,2]\) pasa a 95.45 %.</li>
<li>Elija la función con \(|\psi|^2\) lorentziana, \(\psi=(1+x^2/a^2)^{-1/2}\): se puede normalizar (\(\int|\psi|^2\dd x=\pi a\), luego \(A=1/\sqrt{\pi a}=0.56419\) con \(a=1\)) pero \(\langle x^2\rangle=\infty\), de modo que \(\Delta x\) diverge. Hay funciones de onda legítimas sin dispersión definida, y por eso la incertidumbre del capítulo 4 se enuncia con cuidado.</li>
<li>La parábola \(x(L-x)\) con \(L=2\) (el parámetro vale 1) da \(A^2=30/L^5\), \(\langle x\rangle=L/2\) y \(\Delta x=L/\sqrt{28}\): es el primer problema propuesto al final del capítulo.</li>
</ul></div>
</section>

<section>
<h2>Conservación de la probabilidad y corriente</h2>
<p>Si la probabilidad total es 1 en \(t=0\), ¿lo seguirá siendo? Debe, o la teoría sería incoherente. La ecuación lo garantiza si \(V\) es real. Se multiplica la ecuación de Schrödinger por \(\Psi^*\) y su conjugada por \(\Psi\), y se restan:</p>
<div class="eq">\[\Psi^*\left(\ii\hbar\partial_t\Psi\right)-\Psi\left(-\ii\hbar\partial_t\Psi^*\right)=-\frac{\hbar^2}{2m}\left(\Psi^*\nabla^2\Psi-\Psi\nabla^2\Psi^*\right)\ \Rightarrow\ \ii\hbar\,\partial_t|\Psi|^2=-\frac{\hbar^2}{2m}\nabla\cdot\left(\Psi^*\nabla\Psi-\Psi\nabla\Psi^*\right),\]</div>
<p>pues los términos con \(V\) se cancelan (\(V\Psi^*\Psi\) en ambos lados). Definiendo la densidad \(\rho=|\Psi|^2\) y la <span class="term">corriente de probabilidad</span> \(\mathbf j\):</p>
<div class="eq key" data-name="Ecuación de continuidad">\[\frac{\partial\rho}{\partial t}+\nabla\cdot\mathbf j=0,\qquad \mathbf j=\frac{\hbar}{2m\ii}\left(\Psi^*\nabla\Psi-\Psi\nabla\Psi^*\right)=\frac\hbar m\,\mathrm{Im}\!\left(\Psi^*\nabla\Psi\right).\]</div>
<p>Integrando sobre todo el espacio, \(\dfrac{\dd}{\dd t}\int\rho\,\dd V=-\oint\mathbf j\cdot\dd\mathbf S=0\) porque \(\Psi\to0\) en el infinito: la normalización se mantiene para siempre. La probabilidad se mueve de un lugar a otro como un fluido, sin crearse ni destruirse. Para una onda plana \(\Psi=Ae^{ikx}\), \(j=\dfrac{\hbar k}{m}|A|^2=\rho v\): la corriente es densidad por velocidad. Para una función real (como los estados ligados), \(j=0\): no hay flujo neto.</p>
<div class="box ex"><h4>Corriente de una onda estacionaria y de una onda con reflexión</h4>
<p><strong>Problema.</strong> Calcular \(j\) para \(\Psi=Ae^{ikx}+Be^{-ikx}\) (con \(A,B\) reales). <strong>Procedimiento.</strong> (1) \(\partial_x\Psi=ik(Ae^{ikx}-Be^{-ikx})\); \(\Psi^*=Ae^{-ikx}+Be^{ikx}\). (2) \(\Psi^*\partial_x\Psi=ik\left(A^2-AB\,e^{-2ikx}+AB\,e^{2ikx}-B^2\right)=ik\left(A^2-B^2\right)-2kAB\sin2kx\). (3) La parte imaginaria es \(k(A^2-B^2)\), y así \(j=\dfrac{\hbar k}{m}(A^2-B^2)\). <strong>Resultado.</strong> La corriente es la de la onda incidente menos la de la reflejada; si \(|A|=|B|\) (reflexión total, como en una pared) es cero, y \(\rho=4A^2\cos^2kx\) es una onda estacionaria sin flujo neto.</p></div>
</section>

<section>
<h2>Estados estacionarios</h2>
<p>Cuando \(V\) no depende del tiempo, la ecuación se resuelve por separación de variables: \(\Psi(x,t)=\psi(x)\,T(t)\). Sustituyendo y dividiendo por \(\psi T\):</p>
<div class="eq">\[\ii\hbar\frac{1}{T}\frac{\dd T}{\dd t}=\frac{1}{\psi}\left[-\frac{\hbar^2}{2m}\frac{\dd^2\psi}{\dd x^2}+V\psi\right]=E.\]</div>
<p>El lado izquierdo depende solo de \(t\), el derecho solo de \(x\): ambos son una constante \(E\), con unidades de energía. De ahí salen dos ecuaciones. La temporal da \(T=e^{-iEt/\hbar}\). La espacial es la <span class="term">ecuación de Schrödinger independiente del tiempo</span>:</p>
<div class="eq key" data-name="Estados estacionarios">\[\hat H\psi=E\psi,\qquad -\frac{\hbar^2}{2m}\psi''(x)+V(x)\psi(x)=E\psi(x),\qquad \Psi_E(x,t)=\psi_E(x)\,e^{-iEt/\hbar}.\]</div>
<p>En un <em>estado estacionario</em> la densidad \(|\Psi_E|^2=|\psi_E(x)|^2\) no depende del tiempo (el factor de fase se cancela), y lo mismo ocurre con el valor esperado de cualquier magnitud que no dependa explícitamente del tiempo. Eso explica por qué los átomos son estables: en cada nivel de energía el átomo no radia. Las condiciones de contorno hacen el resto: de las infinitas soluciones de la ecuación diferencial solo valen las normalizables, y esto <em>selecciona</em> valores discretos de \(E\), como las frecuencias permitidas de una cuerda con extremos fijos. La cuantización de la energía no se postula: se deduce.</p>
<h3>Propiedades generales (en una dimensión)</h3>
<ul>
<li><strong>\(E\) es real y \(E\gt V_\text{mín}\).</strong> Multiplicando \(\hat H\psi=E\psi\) por \(\psi^*\) e integrando por partes (\(\psi\to0\) en los extremos): \(E=\int\left[\dfrac{\hbar^2}{2m}|\psi'|^2+V|\psi|^2\right]\dd x\ge V_\text{mín}\int|\psi|^2\dd x\). Como \(|\psi'|^2\) no puede anularse en todas partes, la desigualdad es estricta. La energía cinética de un estado ligado es siempre positiva, de ahí la energía de punto cero.</li>
<li><strong>Curvatura.</strong> \(\psi''/\psi=2m(V-E)/\hbar^2\). Donde \(E\gt V\) la función es oscilatoria (curva hacia el eje); donde \(E\lt V\) es exponencial (se aleja del eje), y por eso un estado ligado decae en la región clásicamente prohibida y solo ciertos \(E\) permiten que no diverja.</li>
<li><strong>Continuidad.</strong> \(\psi\) es siempre continua. \(\psi'\) también, salvo donde \(V\) tiene una discontinuidad infinita (pared rígida, o potencial delta; capítulo 7). Si \(V\) tiene un salto finito, \(\psi''\) salta pero \(\psi'\) es continua.</li>
<li><strong>Nodos y degeneración.</strong> Los estados ligados de un potencial unidimensional no son degenerados, pueden tomarse reales, y el \(n\)-ésimo (\(n=1,2,\dots\)) tiene \(n-1\) nodos (teorema de oscilación de Sturm).</li>
</ul>
<p>La solución general es la superposición de todos los estados estacionarios, \(\Psi(x,t)=\sum_nc_n\psi_n(x)e^{-iE_nt/\hbar}\); los coeficientes se fijan con la condición inicial \(\Psi(x,0)\) (se verá con detalle en los capítulos 4 y 6). Una superposición no es un estado estacionario, y ahí está la dinámica.</p>
</section>

<section>
<h2>Frecuencias de Bohr: la dinámica de una superposición</h2>
<p>Sea \(\Psi=c_1\psi_1e^{-iE_1t/\hbar}+c_2\psi_2e^{-iE_2t/\hbar}\), con \(\psi_{1,2}\) reales y normalizadas. Con \(c_k=|c_k|e^{i\delta_k}\):</p>
<div class="eq key" data-name="Densidad de una superposición de dos estados">\[|\Psi|^2=|c_1|^2\psi_1^2+|c_2|^2\psi_2^2+2|c_1||c_2|\,\psi_1\psi_2\cos\!\left(\frac{E_2-E_1}{\hbar}\,t-\delta\right),\qquad \delta=\delta_2-\delta_1.\]</div>
<p>Los dos primeros términos son estacionarios; el tercero, el <em>término de interferencia</em>, oscila con la <span class="term">frecuencia de Bohr</span> \(\omega_{21}=(E_2-E_1)/\hbar\). Esta es la conexión con los espectros del capítulo 1: un átomo en una superposición de dos niveles tiene una densidad de carga que oscila a la frecuencia \(\nu=(E_2-E_1)/h\) y, como carga oscilante, radia precisamente a esa frecuencia, la de la línea espectral. La hipótesis de Bohr, \(h\nu=E_2-E_1\), queda explicada: la frecuencia de la luz emitida es la del latido entre dos niveles.</p>
<p>El valor esperado de la posición es \(\langle x\rangle=|c_1|^2x_{11}+|c_2|^2x_{22}+2|c_1||c_2|\,x_{12}\cos(\omega_{21}t-\delta)\), con \(x_{jk}=\int\psi_jx\psi_k\dd x\). Si \(x_{12}=0\) (por simetría) la partícula no «oscila», y la transición no se acopla a la luz: ese es el origen de las reglas de selección (capítulo 23).</p>
<div class="box ex"><h4>Una partícula en una caja de 1 nm que oscila</h4>
<p><strong>Datos.</strong> Electrón en una caja de ancho \(L=1\) nm, estados \(n=1,2\) con pesos iguales, \(\delta=0\); \(E_n=n^2\pi^2\hbar^2/2mL^2\). <strong>Procedimiento.</strong> (1) \(E_1=0.37603\) eV, \(E_2=4E_1\); \(E_2-E_1=3E_1=1.1281\) eV. (2) \(\omega_{21}=(E_2-E_1)/\hbar=1.714\times10^{15}\) rad/s, periodo \(T=2\pi/\omega_{21}=3.666\) fs. (3) El elemento de matriz es \(x_{12}=\tfrac2L\int_0^Lx\sin\frac{\pi x}{L}\sin\frac{2\pi x}{L}\dd x=-\dfrac{16L}{9\pi^2}\); \(x_{11}=x_{22}=L/2\). (4) \(\langle x\rangle=\tfrac L2-\dfrac{16L}{9\pi^2}\cos\omega_{21}t\): oscila con amplitud \(0.1801L=0.180\) nm alrededor del centro. (5) Si el sistema radia, lo hace con \(h\nu=1.128\) eV, \(\lambda=1099\) nm. <strong>Resultado.</strong> Una oscilación de 3.7 fs: un dipolo microscópico que irradia en el infrarrojo cercano.</p></div>
<div class="sim" data-sim="bohrfreq" data-title="Superposición de dos estados estacionarios: densidad, fase y corriente de probabilidad"></div>
<div class="sim-guide"><ul>
<li>Con \(n_1=1\), \(n_2=2\), pesos iguales y \(\delta=0\): \(\langle x\rangle\) oscila con amplitud 0.1801 (en unidades de \(L\)) y la continuidad se cumple con un residuo del orden de \(10^{-6}\) o menor (error de las diferencias finitas, no de la ecuación). Pulse «Pausar»: aun con el tiempo detenido la corriente \(j\) no es cero, y su signo indica hacia dónde se desplaza la densidad.</li>
<li>Ponga \(n_1=1\) y \(n_2=3\): ambos estados son pares respecto al centro de la caja, \(x_{13}=0\), y \(\langle x\rangle\) queda inmóvil en 0.5; la densidad respira (cambia de forma) pero no oscila de un lado a otro. Esa es la regla de selección de paridad.</li>
<li>Con \(|c_2|^2=0\) o \(1\) (un solo estado) la densidad no depende del tiempo y \(j=0\) en todas partes: es un estado estacionario. Con \(n_1=n_2\) ocurre lo mismo, por la misma razón.</li>
<li>La fase relativa \(\delta\) no cambia la amplitud de las oscilaciones, solo el instante inicial: es la diferencia entre el sistema «preparado» a la izquierda o a la derecha de la caja.</li>
</ul></div>
</section>

<section>
<h2>La interferencia de electrones: se suman amplitudes</h2>
<p>La regla de Born convierte el experimento de la doble rendija en un cálculo. Un electrón que llega a una pantalla tras pasar por dos rendijas tiene una amplitud \(\Psi=\Psi_1+\Psi_2\), donde \(\Psi_k\) es la que tendría con solo la rendija \(k\) abierta. La probabilidad de impacto es</p>
<div class="eq">\[|\Psi_1+\Psi_2|^2=|\Psi_1|^2+|\Psi_2|^2+2\,\mathrm{Re}\,(\Psi_1^*\Psi_2).\]</div>
<p>El último término es la interferencia. Con rendijas de anchura \(a\), separadas \(d\), en la aproximación de Fraunhofer (pantalla lejana, \(\theta\) pequeño), \(\Psi_{1,2}\) tienen la misma amplitud y una diferencia de fase \(2\pi d\sin\theta/\lambda\), con lo que:</p>
<div class="eq key" data-name="Doble rendija (Fraunhofer)">\[I(\theta)=I_0\left[\frac{\sin\beta}{\beta}\right]^2\cos^2\delta,\qquad \beta=\frac{\pi a\sin\theta}{\lambda},\quad \delta=\frac{\pi d\sin\theta}{\lambda}.\]</div>
<p>El primer factor es la difracción de una rendija (envolvente) y el segundo la interferencia de las dos (franjas, de interfranja \(\lambda L/d\) en una pantalla a distancia \(L\)). Si un detector registra por cuál rendija pasó el electrón, las probabilidades se suman, \(|\Psi_1|^2+|\Psi_2|^2\), y desaparecen las franjas: obtener información del camino destruye la interferencia (no hace falta que alguien la lea; basta que quede registrada en el entorno, tema del capítulo 32). Jönsson realizó el experimento con electrones de 50 keV en 1961 (rendijas de 0.5 µm separadas 2 µm); Tonomura y colaboradores (1989) mostraron que con un electrón a la vez las franjas se construyen punto a punto: cada electrón llega a un solo lugar, y la regla de Born gobierna la estadística.</p>
<div class="sim" data-sim="rendijas" data-title="Doble rendija con electrones: las franjas aparecen impacto a impacto"></div>
<div class="sim-guide"><ul>
<li>Con los valores de Jönsson (50 keV, \(d=2\) µm, \(a=0.5\) µm): \(\lambda=5.355\) pm, interfranja 0.937 µm a 0.35 m de las rendijas, y 8 interfranjas bajo el máximo central (\(2d/a\)). Deje correr la simulación: con unos cientos de impactos el patrón es ruido, con miles se ve el peine de franjas, y el contorno sigue la envolvente de una sola rendija.</li>
<li>Active el detector de rendija: queda solo la envolvente de la difracción, \(\mathrm{sinc}^2\). Las franjas no se «borran» por una perturbación mecánica de los electrones: la información disponible cambia la regla (suma de probabilidades en lugar de amplitudes).</li>
<li>Baje la energía a 10 keV: \(\lambda=12.2\) pm y la interfranja crece a 2.1 µm; con electrones más rápidos (200 keV, \(\lambda=2.51\) pm) se hace más fina, 0.44 µm. Ensanche las rendijas (\(a\) grande): la envolvente se cierra y quedan pocas franjas.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una partícula en \([0,L]\) tiene \(\psi=Ax(L-x)\). Normalice la función, calcule \(\langle x\rangle\), \(\Delta x\) y la probabilidad de hallarla en el tercio central \(L/4\lt x\lt3L/4\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Planteamiento.</b> \(1=\int_0^L|\psi|^2\dd x=A^2\int_0^Lx^2(L-x)^2\dd x\). Se escribe \(x=Lu\), con \(u\in[0,1]\): \(\int_0^L x^2(L-x)^2\dd x=L^5\int_0^1u^2(1-u)^2\dd u\).</li>
<li><b>Normalización.</b> \(\int_0^1u^2(1-u)^2\dd u=\int_0^1(u^2-2u^3+u^4)\dd u=\tfrac13-\tfrac12+\tfrac15=\tfrac1{30}\). Entonces \(A^2=30/L^5\) y \(A=\sqrt{30/L^5}\).</li>
<li><b>Valor esperado.</b> \(\langle x\rangle=30L\int_0^1u\cdot u^2(1-u)^2\dd u=30L\left(\tfrac14-\tfrac25+\tfrac16\right)=30L\cdot\tfrac1{60}=\tfrac L2\) (también por simetría respecto a \(L/2\)).</li>
<li><b>Dispersión.</b> \(\langle x^2\rangle=30L^2\int_0^1u^4(1-u)^2\dd u=30L^2\left(\tfrac15-\tfrac26+\tfrac17\right)=30L^2\cdot\tfrac1{105}=\tfrac27L^2\). Luego \(\Delta x^2=\tfrac27L^2-\tfrac14L^2=\tfrac1{28}L^2\) y \(\Delta x=L/\sqrt{28}=0.18898\,L\).</li>
<li><b>Probabilidad en el tercio central.</b> \(P=30\int_{1/4}^{3/4}(u^2-2u^3+u^4)\dd u=30\left[\tfrac{u^3}3-\tfrac{u^4}2+\tfrac{u^5}5\right]_{1/4}^{3/4}=30(0.0298828-0.0034505)=0.79297\) (exactamente \(203/256\)).</li>
<li><b>Resultado.</b> <span class="ans">\(A=\sqrt{30/L^5}\), \(\langle x\rangle=L/2\), \(\Delta x=0.189L\), \(P=203/256=79.3\ \%\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Un electrón en una caja de \(L=1\) nm está en \(\Psi=\tfrac1{\sqrt2}(\psi_1e^{-iE_1t/\hbar}+\psi_2e^{-iE_2t/\hbar})\). Demuestre que \(\langle x\rangle=L/2-\tfrac{16L}{9\pi^2}\cos\omega t\), halle \(\omega\), el periodo y la longitud de onda de la radiación que emitiría.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Planteamiento.</b> Con \(c_1=c_2=1/\sqrt2\) y \(\psi_n=\sqrt{2/L}\sin(n\pi x/L)\) reales, \(\langle x\rangle=\tfrac12x_{11}+\tfrac12x_{22}+x_{12}\cos\omega_{21}t\), con \(\omega_{21}=(E_2-E_1)/\hbar\).</li>
<li><b>Elementos diagonales.</b> \(x_{nn}=\tfrac2L\int_0^Lx\sin^2\tfrac{n\pi x}{L}\dd x=\tfrac L2\) para todo \(n\), pues \(\sin^2\) es simétrica respecto a \(L/2\) y vale \(\tfrac12\) en promedio.</li>
<li><b>Elemento cruzado.</b> Con \(\sin A\sin B=\tfrac12[\cos(A-B)-\cos(A+B)]\): \(x_{12}=\tfrac1L\int_0^Lx\left[\cos\tfrac{\pi x}L-\cos\tfrac{3\pi x}L\right]\dd x\). Con \(\int_0^Lx\cos\tfrac{k\pi x}{L}\dd x=\left(\tfrac L{k\pi}\right)^2[(-1)^k-1]\): para \(k=1\) vale \(-2L^2/\pi^2\); para \(k=3\), \(-2L^2/(9\pi^2)\). Así \(x_{12}=\tfrac1L\left[-\tfrac{2L^2}{\pi^2}+\tfrac{2L^2}{9\pi^2}\right]=-\tfrac{16L}{9\pi^2}\).</li>
<li><b>Resultado simbólico.</b> \(\langle x\rangle=\tfrac L2-\tfrac{16L}{9\pi^2}\cos\omega_{21}t\), de amplitud \(16L/9\pi^2=0.1801L=0.180\) nm.</li>
<li><b>Números.</b> \(E_1=\pi^2\hbar^2/2mL^2=0.37603\) eV; \(\hbar\omega_{21}=3E_1=1.1281\) eV, \(\omega_{21}=1.7139\times10^{15}\) rad/s, \(T=3.666\) fs. \(\lambda=hc/(3E_1)=1239.84/1.1281=1099\) nm.</li>
<li><b>Resultado.</b> <span class="ans">\(\omega=1.714\times10^{15}\) s⁻¹, \(T=3.67\) fs, \(\lambda=1099\) nm, amplitud 0.180 nm.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Un electrón de 1 eV está descrito por \(\Psi=e^{ikx}+\tfrac12e^{-ikx}\) (por metro de ancho). Calcule la velocidad \(v=\hbar k/m\), la corriente de probabilidad \(j\) y diga qué fracción de la onda incidente se refleja.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Número de onda.</b> \(k=\sqrt{2mE}/\hbar\). Con \(E=1\) eV: \(k=\sqrt{2\times9.1094\times10^{-31}\times1.6022\times10^{-19}}/1.05457\times10^{-34}=5.1232\times10^9\) m⁻¹ \(=5.123\) nm⁻¹.</li>
<li><b>Velocidad.</b> \(v=\hbar k/m=5.931\times10^{5}\) m/s.</li>
<li><b>Corriente.</b> Del ejemplo resuelto, \(j=v(A^2-B^2)=v(1-\tfrac14)=0.75\,v=4.448\times10^5\) m/s (en unidades de \(|A|^2=1\ \text{m}^{-1}\)).</li>
<li><b>Reflexión.</b> La corriente incidente es \(vA^2=v\) y la reflejada \(vB^2=v/4\), de modo que se refleja \(R=B^2/A^2=\tfrac14=25\) % y se transmite el 75 % (lo transmitido tendría que ir a otra región, sin la cual la onda no sería solución del problema en una caja cerrada).</li>
<li><b>Resultado.</b> <span class="ans">\(k=5.12\) nm⁻¹, \(v=5.93\times10^5\) m/s, \(j=0.75v=4.45\times10^5\) m/s, \(R=25\ \%\).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Demuestre la ecuación de continuidad y la conservación de la norma, y verifíquela para \(\Psi(x,0)=(2\pi\sigma^2)^{-1/4}e^{ik_0x-x^2/4\sigma^2}\) calculando \(\int j\,\dd x\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Ecuaciones.</b> Schrödinger: \(\partial_t\Psi=\tfrac{1}{i\hbar}\left(-\tfrac{\hbar^2}{2m}\Psi''+V\Psi\right)\); su conjugada (\(V\) real): \(\partial_t\Psi^*=-\tfrac1{i\hbar}\left(-\tfrac{\hbar^2}{2m}\Psi^{*\prime\prime}+V\Psi^*\right)\).</li>
<li><b>Derivada de \(\rho\).</b> \(\partial_t(\Psi^*\Psi)=\Psi^*\partial_t\Psi+\Psi\partial_t\Psi^*=\tfrac{1}{i\hbar}\left[-\tfrac{\hbar^2}{2m}(\Psi^*\Psi''-\Psi\Psi^{*\prime\prime})\right]\) (el término con \(V\) se cancela). Como \(\Psi^*\Psi''-\Psi\Psi^{*\prime\prime}=\partial_x(\Psi^*\Psi'-\Psi\Psi^{*\prime})\):</li>
<li><b>Corriente.</b> \(\partial_t\rho=-\partial_x\left[\tfrac{\hbar}{2im}(\Psi^*\Psi'-\Psi\Psi^{*\prime})\right]=-\partial_xj\), con \(j=\tfrac\hbar m\mathrm{Im}(\Psi^*\Psi')\).</li>
<li><b>Norma.</b> \(\tfrac{\dd}{\dd t}\int\rho\dd x=-[j]_{-\infty}^{\infty}=0\) si \(\Psi,\Psi'\to0\) en \(\pm\infty\).</li>
<li><b>Verificación con el paquete.</b> \(\Psi'=(ik_0-\tfrac{x}{2\sigma^2})\Psi\), luego \(\Psi^*\Psi'=(ik_0-\tfrac x{2\sigma^2})\rho\) y \(j=\tfrac{\hbar k_0}{m}\rho(x)\). Entonces \(\int j\,\dd x=\tfrac{\hbar k_0}{m}\int\rho\,\dd x=\tfrac{\hbar k_0}{m}\). Es la velocidad media del paquete, \(\langle p\rangle/m\), y es el flujo total: la probabilidad atraviesa un punto fijo a ese ritmo.</li>
<li><b>Resultado.</b> <span class="ans">\(\partial_t\rho+\partial_xj=0\); \(\int j\,\dd x=\hbar k_0/m=\langle p\rangle/m\).</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>En el experimento de Jönsson los electrones tienen 50 keV, \(d=2\) µm y \(a=0.5\) µm. Calcule \(\lambda\), la interfranja en una pantalla a \(L=0.35\) m y la posición del primer cero de la envolvente. ¿Cuántas franjas brillantes caben en el máximo central?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Longitud de onda.</b> A 50 keV la corrección relativista no es despreciable: \(\lambda=\dfrac{hc}{\sqrt{K(K+2mc^2)}}=\dfrac{1239.84\ \text{eV·nm}}{\sqrt{50\,000(50\,000+1\,021\,998)}\ \text{eV}}=5.3553\) pm. (Sin la corrección saldría 5.4847 pm, un 2.4 % mayor.)</li>
<li><b>Interfranja.</b> \(\Delta y=\lambda L/d=5.3553\times10^{-12}\times0.35/(2\times10^{-6})=9.372\times10^{-7}\) m \(=0.937\) µm.</li>
<li><b>Envolvente.</b> El primer cero de \(\sin\beta/\beta\) es \(\beta=\pi\Rightarrow\sin\theta=\lambda/a\), \(y_1=\lambda L/a=3.749\) µm.</li>
<li><b>Franjas.</b> \(y_1/\Delta y=d/a=4\): el máximo central abarca \(2d/a=8\) interfranjas. Los órdenes \(m=0,\pm1,\pm2,\pm3\) caen dentro; el \(\pm4\) coincide con un cero de la envolvente (falta). Hay 7 franjas brillantes.</li>
<li><b>Resultado.</b> <span class="ans">\(\lambda=5.355\) pm, \(\Delta y=0.937\) µm, \(y_1=3.75\) µm, 7 franjas brillantes.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Para describir la absorción de partículas se usa un potencial complejo \(V=V_R-\ii\Gamma/2\) (\(V_R\) y \(\Gamma\) reales y constantes). Demuestre que la norma decae exponencialmente y halle la vida media. Evalúe para un estado con \(\Gamma=4.11\times10^{-7}\) eV (el 2p del hidrógeno).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Planteamiento.</b> Se repite la deducción de continuidad con \(V\) complejo: \(\partial_t\Psi=\tfrac1{i\hbar}\hat H\Psi\), \(\partial_t\Psi^*=-\tfrac1{i\hbar}\left(-\tfrac{\hbar^2}{2m}\Psi^{*\prime\prime}+V^*\Psi^*\right)\).</li>
<li><b>Término nuevo.</b> En \(\partial_t\rho\) quedan, además de \(-\partial_xj\), los términos \(\tfrac{1}{i\hbar}(V-V^*)\Psi^*\Psi=\tfrac{1}{i\hbar}(-i\Gamma)\rho=-\tfrac\Gamma\hbar\rho\).</li>
<li><b>Ecuación.</b> \(\partial_t\rho+\partial_xj=-(\Gamma/\hbar)\rho\). Integrando: \(\dfrac{\dd N}{\dd t}=-\dfrac\Gamma\hbar N\), con \(N=\int\rho\dd x\), luego \(N(t)=N_0e^{-\Gamma t/\hbar}\).</li>
<li><b>Vida media.</b> \(\tau=\hbar/\Gamma\); vida media (mitad de la población) \(t_{1/2}=\tau\ln2\). La anchura \(\Gamma\) de un nivel y su vida están ligadas: \(\Gamma\tau=\hbar\).</li>
<li><b>Evaluación.</b> \(\hbar=6.5821\times10^{-16}\) eV·s. \(\tau=6.5821\times10^{-16}/4.11\times10^{-7}=1.60\times10^{-9}\) s \(=1.6\) ns, que es la vida del 2p del hidrógeno (por cada eV de anchura, \(\tau=0.658\) fs; por cada meV, 0.658 ps).</li>
<li><b>Resultado.</b> <span class="ans">\(N=N_0e^{-\Gamma t/\hbar}\), \(\tau=\hbar/\Gamma=1.6\) ns.</span></li>
</ol></details></li>
</ol>
