<p class="lead">Los estados ligados de los capítulos 6 y 7 tienen energías discretas. Cuando la partícula puede escapar al infinito, la energía es continua y la pregunta cambia: ¿qué fracción de las partículas incidentes se refleja y cuál atraviesa? Este capítulo resuelve el escalón y la barrera rectangular con todos los pasos, deduce el <em>efecto túnel</em> (la transmisión a través de una región donde la energía clásica es negativa) y su dependencia exponencial de la masa, el espesor y la altura, y extiende el método a potenciales de varias capas, donde aparece el túnel resonante que usan los diodos de efecto túnel resonante.</p>

<section>
<h2>Estados de dispersión y flujo</h2>
<p>Con \(E\gt0\) el espectro es continuo y las funciones propias no son normalizables, pero describen un flujo estacionario de partículas. En una región con potencial constante \(V\), con \(k=\sqrt{2m(E-V)}/\hbar\), la solución es \(\psi=Ae^{ikx}+Be^{-ikx}\): \(Ae^{ikx}\) viaja a la derecha y \(Be^{-ikx}\) a la izquierda. La corriente de probabilidad del capítulo 2 es \(j=\tfrac{\hbar k}{m}(|A|^2-|B|^2)\): densidad por velocidad, con una contribución por cada onda. Para un problema de dispersión con incidencia desde la izquierda se escribe \(\psi=e^{ikx}+re^{-ikx}\) a la izquierda y \(\psi=te^{ik'x}\) a la derecha (sin onda que llegue desde la derecha), y se definen las probabilidades como cocientes de flujos:</p>
<div class="eq key" data-name="Reflexión y transmisión">\[R=\frac{|j_\text{refl}|}{|j_\text{inc}|}=|r|^2,\qquad T=\frac{j_\text{trans}}{j_\text{inc}}=\frac{k'}{k}\,|t|^2,\qquad R+T=1.\]</div>
<p>El factor \(k'/k\) en \(T\) es esencial: \(T\) no es \(|t|^2\) cuando la velocidad cambia entre las regiones. La igualdad \(R+T=1\) es la conservación de la probabilidad: en un estado estacionario \(\partial_x j=0\), de modo que el flujo es el mismo a ambos lados.</p>
</section>

<section>
<h2>El escalón de potencial</h2>
<p>Sea \(V=0\) para \(x\lt0\) y \(V=V_0\) para \(x\gt0\), con una partícula que incide desde la izquierda con \(E\gt0\). <strong>Caso \(E\gt V_0\).</strong> Con \(k=\sqrt{2mE}/\hbar\) y \(k'=\sqrt{2m(E-V_0)}/\hbar\), la continuidad de \(\psi\) y \(\psi'\) en \(x=0\) da \(1+r=t\) y \(k(1-r)=k't\); sumando y restando:</p>
<div class="eq key" data-name="Escalón (E > V₀)">\[r=\frac{k-k'}{k+k'},\quad t=\frac{2k}{k+k'},\quad R=\left(\frac{k-k'}{k+k'}\right)^2,\quad T=\frac{k'}{k}t^2=\frac{4kk'}{(k+k')^2}.\]</div>
<p>Hay reflexión aun cuando \(E\gt V_0\): la mecánica clásica no la tiene, y es un efecto ondulatorio (como la reflexión parcial de la luz en una interfase de vidrio). La reflexión es total cuando \(k'\to0\) (\(E\to V_0\)) y se anula cuando \(V_0\to0\). <strong>Caso \(E\lt V_0\).</strong> A la derecha la solución es \(te^{-\kappa x}\) con \(\kappa=\sqrt{2m(V_0-E)}/\hbar\); la continuidad da \(r=(k-\ii\kappa)/(k+\ii\kappa)\), con \(|r|=1\): <em>reflexión total</em>, \(T=0\). Pero la función de onda penetra en la región prohibida con una cola \(e^{-\kappa x}\) de longitud \(1/\kappa\), y la reflexión viene acompañada de un desfase (el \(\ii\) del numerador). Esa cola evanescente es el germen del efecto túnel: si el escalón terminara en una distancia corta, la onda podría llegar al otro lado.</p>
<div class="box ex"><h4>Un electrón de 5 eV ante un escalón de 3 eV</h4>
<p><strong>Procedimiento.</strong> (1) \(k\propto\sqrt E\): \(k'/k=\sqrt{(5-3)/5}=0.6325\). (2) \(R=\left(\dfrac{1-0.6325}{1+0.6325}\right)^2=0.0507\); \(T=1-R=0.9493\). (3) Observación: \(t=2/(1+0.6325)=1.2250\) y \(|t|^2=1.50\gt1\); sin embargo \(T=0.6325\times1.50=0.949\lt1\): la amplitud transmitida puede superar 1, pero el flujo no, porque la velocidad cae a la derecha. Para \(E=1.5V_0\) los valores son \(R=0.0718\), \(T=0.9282\), y para \(E=2.5V_0\), \(R=0.0161\).</p></div>
<div class="sim" data-sim="escalon" data-title="Escalón de potencial: reflexión parcial, total y cola evanescente"></div>
<div class="sim-guide"><ul>
<li>Con \(E=1.5V_0\) (unidades \(\hbar=m=V_0=1\)): \(r=0.2679\), \(t=1.2679\), \(R=0.0718\), \(T=0.9282\) y \(|t|^2=1.608\gt1\) (no es una probabilidad). La densidad a la izquierda oscila entre \((1-r)^2\) y \((1+r)^2\): ondas estacionarias por la interferencia de la incidente y la reflejada, con periodo \(\pi/k\).</li>
<li>Con \(E=0.5V_0\): \(R=1\), \(T=0\), la densidad a la izquierda tiene nodos totales (\(|r|=1\)) y a la derecha cae como \(e^{-2\kappa x}\) con \(1/\kappa=1\). A \(E=0.9V_0\) la penetración sube a \(1/\kappa=2.24\). A \(E\to V_0^-\) la cola se extiende cada vez más lejos.</li>
</ul></div>
</section>

<section>
<h2>La barrera rectangular y el efecto túnel</h2>
<p>Una barrera de altura \(V_0\) y espesor \(a\) (\(V=V_0\) para \(0\lt x\lt a\)) conecta ambas ideas. Para \(0\lt E\lt V_0\), con \(k=\sqrt{2mE}/\hbar\) y \(\kappa=\sqrt{2m(V_0-E)}/\hbar\), se plantea \(\psi=e^{ikx}+re^{-ikx}\) (\(x\lt0\)), \(\psi=Ce^{\kappa x}+De^{-\kappa x}\) (\(0\lt x\lt a\)) y \(\psi=te^{ikx}\) (\(x\gt a\)). Las cuatro condiciones de empalme son: en \(x=0\), \(1+r=C+D\) y \(\ii k(1-r)=\kappa(C-D)\); en \(x=a\), \(Ce^{\kappa a}+De^{-\kappa a}=te^{\ii ka}\) y \(\kappa(Ce^{\kappa a}-De^{-\kappa a})=\ii kte^{\ii ka}\). Las dos últimas dan \(Ce^{\kappa a}=\tfrac12te^{\ii ka}(1+\ii k/\kappa)\) y \(De^{-\kappa a}=\tfrac12te^{\ii ka}(1-\ii k/\kappa)\). Se eliminan \(r\) de las dos primeras (sumando \(\kappa\) veces la primera con la segunda) y se sustituye \(C\) y \(D\); queda</p>
<div class="eq">\[t=\frac{2\ii k\kappa\,e^{-\ii ka}}{2\ii k\kappa\cosh\kappa a+(k^2-\kappa^2)\sinh\kappa a}\ \Rightarrow\ T=|t|^2=\frac{1}{\cosh^2\kappa a+\dfrac{(k^2-\kappa^2)^2}{4k^2\kappa^2}\sinh^2\kappa a}.\]</div>
<p>Como \(\cosh^2=1+\sinh^2\) y \(\left[1+\tfrac{(k^2-\kappa^2)^2}{4k^2\kappa^2}\right]=\tfrac{(k^2+\kappa^2)^2}{4k^2\kappa^2}=\tfrac{V_0^2}{4E(V_0-E)}\) (porque \(k^2+\kappa^2=2mV_0/\hbar^2\) y \(k^2\kappa^2=(2m/\hbar^2)^2E(V_0-E)\)):</p>
<div class="eq key" data-name="Transmisión de una barrera rectangular">\[T=\left[1+\frac{V_0^2\sinh^2\kappa a}{4E(V_0-E)}\right]^{-1}\ (E\lt V_0),\qquad T\simeq\frac{16E(V_0-E)}{V_0^2}\,e^{-2\kappa a}\ (\kappa a\gg1),\qquad T=\left[1+\frac{V_0^2\sin^2k'a}{4E(E-V_0)}\right]^{-1}\ (E\gt V_0).\]</div>
<p>Para \(E\gt V_0\), \(k'=\sqrt{2m(E-V_0)}/\hbar\) y el \(\sinh\) se vuelve \(\sin\) (continuación analítica \(\kappa\to\ii k'\)). Cuatro consecuencias. (1) <strong>Túnel.</strong> Para \(E\lt V_0\) clásicamente \(T=0\), y la mecánica cuántica da \(T\gt0\), con un factor \(e^{-2\kappa a}\) <em>exponencialmente sensible</em> al espesor, a la raíz de la masa y a la altura de la barrera. (2) <strong>Resonancias.</strong> Para \(E\gt V_0\), \(T=1\) cuando \(k'a=n\pi\), es decir en \(E_n=V_0+n^2\pi^2\hbar^2/2ma^2\): la barrera se vuelve transparente cuando cabe un número entero de semilongitudes de onda en su interior (interferencia constructiva, igual que en un interferómetro de Fabry–Pérot); entre resonancias hay reflexión. (3) <strong>Límite \(E=V_0\)</strong>: \(T=[1+ma^2V_0/2\hbar^2]^{-1}\). (4) <strong>Reversibilidad</strong>: \(T\) es la misma para incidencia desde la derecha.</p>
<div class="box ex"><h4>Un electrón ante una barrera de 1 eV y 0.5 nm</h4>
<p><strong>Datos.</strong> \(V_0=1\) eV, \(a=0.5\) nm, \(E=0.5\) eV, \(\hbar^2/m_e=0.0762\) eV·nm². <strong>Procedimiento.</strong> (1) \(\kappa=\sqrt{2(0.5)/0.0762}=3.623\) nm⁻¹ (longitud de penetración \(1/\kappa=0.276\) nm), \(\kappa a=1.811\). (2) \(\sinh1.811=2.978\), \(\sinh^2\kappa a=8.866\). (3) \(T=[1+V_0^2\sinh^2\kappa a/4E(V_0-E)]^{-1}=[1+8.866/(4\cdot0.5\cdot0.5)]^{-1}=[1+8.866]^{-1}=0.1014\). (4) Aproximación de barrera gruesa: \(16(0.25)e^{-3.623}=0.1068\), un 5 % mayor. (5) Primera resonancia por encima de la barrera: \(E_1=1+\pi^2(0.0762)/(2\times0.25)=2.504\) eV. <strong>Resultado.</strong> El 10 % de los electrones atraviesa una barrera que clásicamente es impenetrable.</p></div>
<div class="sim" data-sim="barrera" data-title="Barrera rectangular: transmisión T(E), resonancias y efecto túnel según la masa"></div>
<div class="sim-guide"><ul>
<li>Electrón, \(V_0=1\) eV, \(a=0.5\) nm: a \(E=V_0/2\), \(T=0.1014\) (la barrera gruesa da 0.1068); a \(E=0.9V_0\), 0.307 (frente a 0.285). Por encima de \(V_0\), \(T\) oscila: toca 1 en 2.504 eV y vale solo 0.674 en el primer mínimo (1.376 eV).</li>
<li>Con \(a=2\) nm la primera resonancia baja a \(1.094V_0\) y las oscilaciones se amontonan hacia \(V_0\): para \(a\) macroscópico las resonancias son infinitas y el promedio vuelve al valor clásico. Con \(a\to0\), \(T\to1\).</li>
<li>Cambie a protón con \(a=0.1\) nm: \(T=0.99\) a \(E=1.5V_0\), pero a \(E=V_0/2\) cae a \(10^{-13}\) (active la escala logarítmica): el túnel es exponencialmente sensible a la masa. Para deuterón, \(10^{-19}\).</li>
</ul></div>
<h3>Aplicaciones del túnel</h3>
<ul>
<li><strong>Microscopio de efecto túnel</strong> (Binnig y Rohrer, 1981). Entre la punta y la muestra hay un vacío que es la barrera, de altura la función de trabajo \(\varphi\approx4.5\) eV: \(\kappa=\sqrt{2m\varphi}/\hbar=1.087\) Å⁻¹ y la corriente varía como \(I\propto e^{-2\kappa d}\). Por cada ångström de separación la corriente cambia en un factor \(e^{2.174}=8.8\), un orden de magnitud por cada 1.06 Å. Eso permite resolver átomos individuales con una precisión vertical de picómetros.</li>
<li><strong>Efecto isotópico.</strong> Para una barrera de 0.5 eV y 0.05 nm con \(E=0.25\) eV, el protón atraviesa con \(T=6.8\times10^{-5}\) y el deuterón con \(7.3\times10^{-7}\): cociente 94. Con 1 eV y 0.1 nm, \(1.3\times10^{-13}\) y \(3.5\times10^{-19}\): cociente \(3.8\times10^5\). Por eso las reacciones de transferencia de hidrógeno tienen efectos isotópicos cinéticos grandes (capítulo 22 del curso de Fisicoquímica).</li>
<li><strong>Desintegración alfa y fusión nuclear.</strong> La partícula alfa atraviesa la barrera de Coulomb del núcleo (Gamow, Condon y Gurney, 1928) con \(T\sim e^{-2\int\kappa\dd x}\): las vidas medias van de nanosegundos a \(10^{10}\) años según una variación mínima de la energía (ley de Geiger–Nuttall). En el Sol, los protones fusionan por túnel a través de la repulsión coulombiana con energías de ~1 keV, mucho menores que la barrera (~0.5 MeV): sin túnel, no brilla. Ambos se calculan con el método WKB (capítulo 22).</li>
<li><strong>Dispositivos.</strong> Diodo túnel (Esaki, 1958), memorias flash (carga por túnel a través de óxido), uniones Josephson y emisión de campo.</li>
</ul>
</section>

<section>
<h2>Varias capas y túnel resonante</h2>
<p>Para un potencial constante a trozos de \(N\) capas se puede aplicar el mismo método: en cada capa \(\psi=A_je^{ik_jx}+B_je^{-ik_jx}\) (con \(k_j\) imaginario donde \(E\lt V_j\)), y la continuidad de \(\psi\) y \(\psi'\) en cada interfaz da un sistema lineal \(2N\times2N\), o bien se propagan \((\psi,\psi')\) capa a capa con una matriz \(2\times2\). Con esto se obtienen la transmisión y la función de onda para <em>cualquier</em> perfil de capas, y se aproxima cualquier potencial suave tomando capas finas. Es el método que usa el simulador de este capítulo.</p>
<p>La <span class="term">doble barrera</span> (dos barreras separadas por un pozo, como en una heteroestructura GaAs/AlGaAs) es el ejemplo más importante. Entre las dos barreras el pozo tiene estados <em>cuasi-ligados</em> (la partícula puede escapar por túnel), y la transmisión total presenta picos en la energía de esos estados, con \(T\) hasta 1 aun cuando cada barrera por separado transmita solo una pequeña fracción. Es una interferencia constructiva de los rebotes múltiples entre las barreras, y funciona de modo análogo al de un etalón de Fabry–Pérot. Cerca de un pico la forma es de Breit–Wigner (lorentziana):</p>
<div class="eq key" data-name="Túnel resonante (barreras simétricas)">\[T(E)\simeq\frac{(\Gamma/2)^2}{(E-E_r)^2+(\Gamma/2)^2},\qquad \Gamma\propto T_\text{una barrera},\qquad \tau=\frac{\hbar}{\Gamma}.\]</div>
<p>\(E_r\) es la energía del nivel y \(\Gamma\) su anchura (inversamente proporcional a su vida media \(\tau\) en el pozo, como en el capítulo 3); \(\Gamma\) crece con la transmisión de cada barrera, pues cuanto más permeables, antes escapa la partícula. Con espesores mayores, \(\Gamma\) baja exponencialmente y el pico se estrecha: el diodo de túnel resonante (Chang, Esaki y Tsu, 1974) usa esto para dar un pico de corriente con resistencia diferencial negativa a una tensión fijada por \(E_r\).</p>
<div class="sim" data-sim="resonante" data-title="Doble barrera GaAs/AlGaAs: transmisión resonante y vida media del estado cuasi-ligado"></div>
<div class="sim-guide"><ul>
<li>Con barreras de 0.3 eV y 2 nm y un pozo de 5 nm (electrón en GaAs, \(m^*=0.067\)): un pico en 0.0862 eV con \(T=1.000\), de anchura \(\Gamma=16.4\) meV (vida del estado \(\tau=\hbar/\Gamma=40\) fs), aunque una barrera sola transmite apenas 0.252 a esa energía. Es la interferencia constructiva de la doble barrera.</li>
<li>Con barreras de 3 nm: el pico (0.0886 eV) se estrecha a \(\Gamma=4.73\) meV (\(\tau=139\) fs), 3.5 veces menos, casi en proporción a la transmisión de una barrera sola (0.0829, 3.04 veces menos). Con barreras de 1 nm, la resonancia se ensancha hasta \(\Gamma=87.6\) meV (0.0788 eV): el estado vive 7.5 fs y apenas se distingue como pico.</li>
<li>Con un pozo de 8 nm (barreras de 2 nm) aparecen dos niveles cuasi-ligados, 0.0458 eV (\(\Gamma=4.47\) meV) y 0.1838 eV (\(\Gamma=39.9\) meV), cercanos a los de un pozo finito aislado de 8 nm (0.0478 y 0.1805 eV; líneas verdes discontinuas, capítulo 7); el nivel más alto, más próximo al borde de la barrera, es 9 veces más ancho: la anchura de los picos baja con el espesor de las barreras y su posición con el ancho del pozo.</li>
</ul></div>
</section>

<section>
<h2>La transmisión de un paquete de ondas</h2>
<p>Una onda plana no es una partícula; una partícula real es un paquete (capítulo 3), cuyos componentes de energía se transmiten con distinta probabilidad. Si el paquete es estrecho en \(k\) (ancho en el espacio), la probabilidad de transmisión del paquete es el promedio de \(T(E)\) sobre su distribución de energías,</p>
<div class="eq">\[P_\text{trans}=\int|\phi(k)|^2\,T\!\left(\tfrac{\hbar^2k^2}{2m}\right)\dd k\ \approx\ T(E_0)\ \text{si}\ T\ \text{varía poco en el ancho de energías}.\]</div>
<p>La integración numérica de la ecuación de Schrödinger lo confirma: el paquete gaussiano se parte en dos, uno reflejado y otro transmitido, con pesos \(R\) y \(T\); no se «parte» ninguna partícula (cada medida detecta una en un solo lado), pero se parten las probabilidades.</p>
<div class="sim" data-sim="choque" data-title="Un paquete de ondas contra una barrera: división en un paquete reflejado y otro transmitido"></div>
<div class="sim-guide"><ul>
<li>Con \(E_0=0.6V_0\), \(a=1\) y \(\sigma=6\): la fracción que pasa tras la colisión es 47.8 %, a comparar con \(T(E_0)=0.4806\) y con el promedio sobre el paquete \(\langle T\rangle=0.4800\). Para \(E_0=0.3\), la transmitida es 28.1 % (\(T=0.277\)); para \(E_0=1.5\), 80.5 % (\(T=0.809\), pues la resonancia en \(1.5\) tiene un \(T\) que varía más en el ancho del paquete).</li>
<li>Con \(a=2\) y \(E_0=0.6\): solo 10.7 % transmite (\(T=0.102\)): doblar el espesor cuadra la transmisión, como en \(e^{-2\kappa a}\). Dentro de la barrera nunca queda más de una fracción \(10^{-5}\), pues la partícula no se detiene en ella.</li>
<li>Reduzca \(\sigma\) a 3: el paquete es más ancho en \(k\) y la transmisión se aleja de \(T(E_0)\); el promedio \(\langle T\rangle\) lo sigue. La norma se conserva en 5 cifras.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un electrón de 5 eV incide sobre un escalón de 3 eV. Calcule los números de onda, \(R\) y \(T\), y compárelos con \(E=2\) eV (\(\lt V_0\)): longitud de penetración.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Números de onda.</b> Con \(\hbar^2/2m_e=0.0381\) eV·nm²: \(k=\sqrt{E/0.0381}=\sqrt{5/0.0381}=11.46\) nm⁻¹ y \(k'=\sqrt{(5-3)/0.0381}=7.245\) nm⁻¹; cociente \(k'/k=0.6325\).</li>
<li><b>Reflexión.</b> \(R=\left(\dfrac{k-k'}{k+k'}\right)^2=\left(\dfrac{1-0.6325}{1.6325}\right)^2=0.0507\).</li>
<li><b>Transmisión.</b> \(T=4kk'/(k+k')^2=4(0.6325)/(1.6325)^2=0.9493\) (suma 1).</li>
<li><b>Caso \(E=2\) eV.</b> \(\kappa=\sqrt{2m(V_0-E)}/\hbar=\sqrt{(3-2)/0.0381}=5.123\) nm⁻¹, longitud de penetración \(1/\kappa=0.195\) nm. Reflexión total, \(R=1\).</li>
<li><b>Resultado.</b> <span class="ans">\(R=0.0507\), \(T=0.9493\); con 2 eV, \(R=1\) y \(1/\kappa=0.195\) nm.</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Para el ejemplo de \(V_0=1\) eV, \(a=0.5\) nm, \(E=0.5\) eV, calcule \(T\) exacta y con la aproximación de barrera gruesa; encuentre la primera energía de resonancia por encima de la barrera y el valor de \(T\) en el primer mínimo.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Parámetros.</b> \(\kappa=\sqrt{2(0.5)/0.0762}=3.6226\) nm⁻¹, \(\kappa a=1.8113\), \(\sinh\kappa a=\tfrac12(e^{1.8113}-e^{-1.8113})=\tfrac12(6.1185-0.1634)=2.9775\).</li>
<li><b>\(T\) exacta.</b> \(T=\left[1+\dfrac{1\cdot2.9775^2}{4(0.5)(0.5)}\right]^{-1}=[1+8.866]^{-1}=0.1014\).</li>
<li><b>Barrera gruesa.</b> \(T\approx\dfrac{16(0.5)(0.5)}{1}e^{-3.6226}=4\times0.02671=0.1068\); error 5.4 %.</li>
<li><b>Primera resonancia.</b> \(k'a=\pi\Rightarrow E_1=V_0+\dfrac{\pi^2\hbar^2}{2ma^2}=1+\dfrac{\pi^2(0.0762)}{2(0.25)}=1+1.504=2.504\) eV.</li>
<li><b>Primer mínimo.</b> \(\sin^2k'a=1\) con \(k'a=\pi/2\): \(E=V_0+\tfrac14\left(\pi^2\hbar^2/2ma^2\right)=1+\tfrac14(1.504)=1.376\) eV, y \(T=[1+1/(4\cdot1.376\cdot0.376)]^{-1}=[1+0.4832]^{-1}=0.6742\).</li>
<li><b>Resultado.</b> <span class="ans">\(T=0.1014\) (exacta) y 0.1068 (gruesa); \(E_1=2.504\) eV; \(T_\text{mín}=0.674\) en 1.376 eV.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>En un microscopio de efecto túnel \(\varphi=4.5\) eV. Calcule \(\kappa\), el factor por el que cambia la corriente al aumentar la separación en 1 Å, y la variación de la separación que reduce la corriente 10 veces. Si la separación pasa de 0.50 a 0.55 nm, ¿cuánto cambia la corriente?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Constante.</b> \(\kappa=\sqrt{2m\varphi}/\hbar=\sqrt{\varphi/(\hbar^2/2m)}=\sqrt{4.5/0.0381}\ \text{nm}^{-1}=10.868\) nm⁻¹ \(=1.0868\) Å⁻¹.</li>
<li><b>Dependencia.</b> \(I\propto T\propto e^{-2\kappa d}\), con \(2\kappa=2.1736\) Å⁻¹.</li>
<li><b>Un ångström.</b> \(I(d+1\ \text{Å})/I(d)=e^{-2.1736}=0.1138\): la corriente baja 8.8 veces.</li>
<li><b>Una década.</b> \(\Delta d=\ln10/(2\kappa)=2.3026/2.1736=1.059\) Å.</li>
<li><b>0.05 nm.</b> \(\Delta d=0.5\) Å: \(e^{-2.1736\times0.5}=0.3373\), la corriente cae a un tercio (2.96 veces menos).</li>
<li><b>Resultado.</b> <span class="ans">\(\kappa=1.087\) Å⁻¹; 8.8 veces por ångström; una década por 1.06 Å; 0.5 Å → factor 0.337.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Una barrera de 0.5 eV y 0.05 nm la atraviesan protones y deuterones de 0.25 eV. Calcule \(\kappa a\) para cada uno con la aproximación de barrera gruesa y la relación \(T_H/T_D\); compárela con el valor exacto (94).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>\(\kappa\).</b> \(\kappa=\sqrt{2m(V_0-E)}/\hbar\) con \(V_0-E=0.25\) eV. Para el protón, \(m=1836.15\,m_e\): \(\kappa_H=\sqrt{1836.15\times0.25/0.0381}\ \text{nm}^{-1}=109.8\) nm⁻¹ y \(\kappa_Ha=5.49\). Para el deuterón (\(m=3670.48\,m_e\)), \(\kappa_D=155.2\) nm⁻¹, \(\kappa_Da=7.76\).</li>
<li><b>Exponentes.</b> \(e^{-2\kappa_Ha}=e^{-10.98}=1.7\times10^{-5}\); \(e^{-2\kappa_Da}=e^{-15.5}=1.8\times10^{-7}\). El prefactor es \(16E(V_0-E)/V_0^2=16(0.25)(0.25)/(0.5)^2=4\), de modo que \(T_H\approx4\times1.7\times10^{-5}=6.8\times10^{-5}\) y \(T_D\approx7.3\times10^{-7}\).</li>
<li><b>Cociente.</b> \(T_H/T_D=e^{2a(\kappa_D-\kappa_H)}=e^{2(0.05)(45.4)}=e^{4.54}=94\) (aproximado). El exacto, con \(\sinh\) en lugar de \(e^{\kappa a}/2\), da 94.</li>
<li><b>Resultado.</b> <span class="ans">\(\kappa_Ha=5.49\), \(\kappa_Da=7.77\); \(T_H/T_D\approx94\).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Deduzca la transmisión de una barrera rectangular para \(E\gt V_0\) y demuestre que \(T=1\) en \(k'a=n\pi\). Calcule las dos primeras resonancias para el caso \(V_0=1\) eV y \(a=0.5\) nm.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Continuación analítica.</b> Para \(E\gt V_0\), el número de onda dentro es real, \(k'=\sqrt{2m(E-V_0)}/\hbar\), y \(\kappa=\ii k'\); así \(\sinh\kappa a=\ii\sin k'a\) y \(\sinh^2\kappa a=-\sin^2k'a\); además \(E(V_0-E)=-E(E-V_0)\).</li>
<li><b>Fórmula.</b> En \(T=[1+V_0^2\sinh^2\kappa a/4E(V_0-E)]^{-1}\), ambos signos menos se cancelan: \(T=\left[1+\dfrac{V_0^2\sin^2k'a}{4E(E-V_0)}\right]^{-1}\).</li>
<li><b>Resonancias.</b> \(T=1\) cuando \(\sin k'a=0\): \(k'a=n\pi\), \(E_n=V_0+\dfrac{n^2\pi^2\hbar^2}{2ma^2}\).</li>
<li><b>Valores.</b> Con \(\pi^2\hbar^2/2ma^2=\pi^2(0.0381)/0.25=1.504\) eV: \(E_1=2.504\) eV, \(E_2=1+4(1.504)=7.016\) eV.</li>
<li><b>Mínimos.</b> \(\sin^2=1\) cuando \(k'a=(n-\tfrac12)\pi\): \(E=1+\tfrac14(1.504)=1.376\) eV, con \(T=0.674\); y \(1+\tfrac94(1.504)=4.384\) eV, \(T=0.983\). Las oscilaciones decaen con \(E\) porque \(V_0^2/4E(E-V_0)\to0\).</li>
<li><b>Resultado.</b> <span class="ans">\(E_1=2.504\) eV y \(E_2=7.016\) eV; mínimos de \(T\) de 0.674 y 0.983.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Un paquete gaussiano de \(\sigma=6\) (\(\hbar=m=1\)) con \(E_0=0.6\) incide sobre una barrera con \(V_0=1\), \(a=1\). Estime \(\langle T\rangle\) desarrollando \(T(k)\) alrededor de \(k_0\) hasta segundo orden y compare con \(T(E_0)=0.4806\) y con el resultado de la simulación (0.478).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Distribución de \(k\).</b> \(|\phi|^2\) es gaussiana con \(\sigma_k=1/(2\sigma)=0.0833\) y \(k_0=\sqrt{2(0.6)}=1.0954\).</li>
<li><b>Desarrollo.</b> \(\langle T\rangle\approx T(k_0)+\tfrac12T''(k_0)\sigma_k^2\) (el término lineal se anula por simetría).</li>
<li><b>Derivada segunda.</b> Con la \(T(k)\) exacta (\(E=k^2/2\)): \(T(k_0)=0.48062\), \(T(k_0\pm\sigma_k)=0.5323\) y \(0.4277\). Por diferencias centrales, \(T''\approx[0.5323+0.4277-2(0.48062)]/\sigma_k^2=-0.17\).</li>
<li><b>Corrección.</b> \(\tfrac12T''\sigma_k^2=\tfrac12(-0.1734)(0.08333)^2=-6.0\times10^{-4}\) (con una derivada segunda más precisa, \(h=10^{-3}\)): \(\langle T\rangle\approx0.48062-0.00060=0.4800\), que coincide con la integral numérica completa (0.4800).</li>
<li><b>Simulación.</b> La integración de la ecuación de Schrödinger (malla \(\Delta x=0.125\), 8 puntos en la barrera) da 0.478. La diferencia de 0.002 se debe a la discretización espacial de la barrera.</li>
<li><b>Resultado.</b> <span class="ans">\(\langle T\rangle=0.4800\); simulación 0.478; \(T(E_0)=0.4806\).</span></li>
</ol></details></li>
</ol>
