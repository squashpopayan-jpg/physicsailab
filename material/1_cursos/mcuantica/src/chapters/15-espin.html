<template class="chapter-src" data-id="espin" data-num="15" data-title="El espín del electrón" data-part="Parte III · Momento angular y el átomo" data-short="Experimento de Stern y Gerlach, el álgebra del espín ½ con las matrices de Pauli, la esfera de Bloch, medidas sucesivas, precesión de Larmor y el signo del espinor bajo una rotación de 2π">
<p class="lead">Hasta aquí todo momento angular ha tenido una contrapartida orbital: una función de onda en el espacio y números \(l\) enteros. Pero el electrón posee además un grado de libertad interno, el <span class="term">espín</span>, que no corresponde al movimiento de nada en el espacio, cuyo número cuántico es \(\tfrac12\) y que se describe con solo dos estados. Es el sistema cuántico más simple que existe (dos dimensiones) y por eso es el modelo de casi todo lo que sigue: medida, entrelazamiento, resonancia magnética y bits cuánticos.</p>

<section>
<h2>El experimento de Stern y Gerlach</h2>
<p>Un átomo con momento magnético \(\boldsymbol\mu\) en un campo \(\mathbf B\) inhomogéneo siente la fuerza \(F_z=\mu_z\,\partial B_z/\partial z\). Si el momento fuera orientable de modo continuo, un haz de átomos se abriría en una mancha continua. Si estuviera ligado a un momento angular orbital \(l\), el haz se dividiría en \(2l+1\) trazos, <em>un número impar</em>. En 1922 Stern y Gerlach hicieron pasar átomos de plata por un campo con gradiente de unos \(10^3\) T/m: el haz se partió en <strong>dos</strong> trazos separados, sin ninguna intensidad en el centro. Dos manchas solo caben con \(2s+1=2\), es decir, \(s=\tfrac12\). Uhlenbeck y Goudsmit (1925) identificaron el responsable: un momento angular intrínseco del electrón con momento magnético</p>
<div class="eq">\[\boldsymbol\mu=-g\,\frac{\mu_B}{\hbar}\,\mathbf S,\qquad\mu_B=\frac{e\hbar}{2m_e}=9.274\,010\times10^{-24}\ \text{J/T},\qquad g=2.002\,319\,3,\]</div>
<p>con \(g=2\) exactamente en la teoría de Dirac (capítulo 37) y la pequeña corrección \(\alpha/\pi\) proveniente de la electrodinámica cuántica, la predicción más precisa de la física.</p>
<div class="box ex"><h4>Separación de los haces en el experimento</h4>
<p><strong>Datos.</strong> Átomos de Ag (\(m=107.87\) u, \(\mu_z=\pm\mu_B\), el único electrón de valencia tiene \(l=0\)), \(\partial B/\partial z=10^3\) T/m, imán de \(L=3.5\) cm, velocidad \(v=500\) m/s. <strong>Procedimiento.</strong> (1) Fuerza \(F=\mu_B\,\partial_zB=9.274\times10^{-21}\) N. (2) Aceleración \(a=F/m=5.177\times10^4\) m/s². (3) Tiempo en el imán \(t=L/v=70\) µs. (4) Desviación \(d=\tfrac12at^2=0.1268\) mm hacia cada lado. <strong>Resultado.</strong> Los dos haces quedan separados por \(2d=0.254\) mm, justo lo observado (cerca de 0.2 mm): una distancia pequeña pero medible, pues se trata de la desviación de átomos neutros con un momento cuyo valor fija la naturaleza.</p></div>
</section>

<section>
<h2>El álgebra del espín ½ y las matrices de Pauli</h2>
<p>El espín obedece las mismas reglas de conmutación del momento angular, \([S_i,S_j]=\ii\hbar\varepsilon_{ijk}S_k\), pero con \(s=\tfrac12\): el espacio es de dimensión \(2s+1=2\), con la base \(|\!\uparrow\rangle\), \(|\!\downarrow\rangle\) de \(S_z=\pm\hbar/2\). Es el caso más pequeño de las matrices del capítulo 12, y se escribe \(\mathbf S=\tfrac\hbar2\boldsymbol\sigma\) con las <span class="term">matrices de Pauli</span></p>
<div class="eq key" data-name="Matrices de Pauli">\[\sigma_x=\begin{pmatrix}0&1\\1&0\end{pmatrix},\quad\sigma_y=\begin{pmatrix}0&-\ii\\\ii&0\end{pmatrix},\quad\sigma_z=\begin{pmatrix}1&0\\0&-1\end{pmatrix},\qquad\sigma_i\sigma_j=\delta_{ij}+\ii\varepsilon_{ijk}\sigma_k,\qquad(\mathbf n\cdot\boldsymbol\sigma)^2=1.\]</div>
<p>De \((\mathbf n\cdot\boldsymbol\sigma)^2=1\) se deduce que \(S_n=\mathbf n\cdot\mathbf S\) tiene solo los autovalores \(\pm\hbar/2\) para <em>cualquier</em> dirección \(\mathbf n\), y que \(\mathbf S^2=\tfrac34\hbar^2\) (en efecto \(s(s+1)=\tfrac34\)). Para \(\mathbf n=(\sin\theta\cos\phi,\sin\theta\sin\phi,\cos\theta)\) el autoestado con \(+\hbar/2\) es</p>
<div class="eq key" data-name="Estado de espín orientado según n">\[|\mathbf n,+\rangle=\cos\tfrac\theta2\,|\!\uparrow\rangle+\ee^{\ii\phi}\sin\tfrac\theta2\,|\!\downarrow\rangle,\qquad|\mathbf n,-\rangle=-\sin\tfrac\theta2\,|\!\uparrow\rangle+\ee^{\ii\phi}\cos\tfrac\theta2\,|\!\downarrow\rangle.\]</div>
<p>Todo estado puro de espín ½ (salvo una fase global) es de esta forma: es el estado «espín hacia \(\mathbf n\)» para una dirección única. El <span class="term">vector de Bloch</span> \(\mathbf b=\langle\boldsymbol\sigma\rangle\) de un estado puro es un vector <em>unitario</em> y los estados puros llenan la esfera (de Bloch). El valor esperado de \(S_z\) en el estado \(a|\!\uparrow\rangle+b|\!\downarrow\rangle\) es \(\tfrac\hbar2(|a|^2-|b|^2)\); y de forma general la probabilidad de encontrar el espín hacia \(\mathbf m\) cuando está hacia \(\mathbf n\) es</p>
<div class="eq key" data-name="Probabilidad entre dos direcciones">\[P(\mathbf m,+\,|\,\mathbf n,+)=|\langle\mathbf m,+|\mathbf n,+\rangle|^2=\frac{1+\mathbf m\cdot\mathbf n}2=\cos^2\frac\gamma2,\]</div>
<p>donde \(\gamma\) es el ángulo entre ambos ejes. Con \(\gamma=90^\circ\) la probabilidad es \(\tfrac12\) (ejes perpendiculares son «máximamente incompatibles»), con \(\gamma=180^\circ\) es cero. Con tres direcciones coplanares de ángulos \(\alpha_0\lt\alpha_1\lt\alpha_2\) la probabilidad de pasar la cadena es el producto \(\cos^2\tfrac{\alpha_1-\alpha_0}2\cos^2\tfrac{\alpha_2-\alpha_1}2\): la medida se «reinicia» en cada analizador, pues el estado posterior es el autoestado hallado.</p>
<div class="sim" data-sim="bloch-esp" data-title="Esfera de Bloch: espín en un campo magnético, precesión de Larmor"></div>
<div class="sim-guide"><ul>
<li>Con \(\theta=60^\circ\), \(\phi=0\) y \(B\parallel z\) (ángulo del campo \(0^\circ\)): el vector de Bloch recorre un paralelo, con longitud 1; \(\langle\sigma_z\rangle=\cos60^\circ=0.5\) constante (probabilidad de \(\uparrow\) del 75 %): lo único que cambia es la fase relativa, no las probabilidades de \(S_z\). La frecuencia de Larmor del electrón en 1 T es \(1.7609\times10^{11}\) rad/s (28.025 GHz, periodo 35.68 ps).</li>
<li>Incline el campo (\(90^\circ\)): ahora \(S_z\) oscila entre \(+\) y \(-\); el ángulo entre \(\langle\mathbf S\rangle\) y \(\mathbf B\) no cambia (columna «cos»); si el espín parte en \(+z\), la inversión máxima es el seno al cuadrado de ese ángulo (columna final). Con espín inicial \(\theta=0\) y campo a \(90^\circ\) el espín llega al polo sur: es la inversión de la resonancia magnética.</li>
</ul></div>
</section>

<section>
<h2>Medidas sucesivas</h2>
<p>La medida de \(S_n\) con un imán de Stern y Gerlach orientado según \(\mathbf n\) separa el haz en dos, \(S_n=\pm\hbar/2\); si se bloquea una de las ramas, los átomos que salen están en el estado propio correspondiente. Un segundo analizador orientado según \(\mathbf m\) vuelve a dividir el haz con probabilidades \(\cos^2\tfrac\gamma2\) y \(\sin^2\tfrac\gamma2\). El resultado es profundamente anticlásico: un haz \(z+\) pasa un analizador \(z-\) con probabilidad cero, pero si se intercala un analizador \(x\) entre ambos, el 25 % llega a \(z-\). La medida de \(S_x\) <em>destruyó</em> la información sobre \(S_z\) (los observables no conmutan: capítulo 4) y no es una simple lectura de una propiedad preexistente.</p>
<div class="sim" data-sim="sg-cadena" data-title="Cadena de analizadores de Stern y Gerlach: el analizador intermedio permite pasar"></div>
<div class="sim-guide"><ul>
<li>Con \(\alpha=90^\circ\) y \(\beta=180^\circ\) (el último analizador es el inverso del primero): el 25 % pasa por la cadena (50 % por el segundo, 50 % por el tercero), y sin el segundo analizador la fracción es cero. La curva derecha, \(\sin^2\alpha/4\), tiene el máximo 0.25 en \(\alpha=90^\circ\).</li>
<li>Con \(\beta=90^\circ\), el máximo de la curva está en \(\alpha=45^\circ\) con fracción \(\cos^4(22.5^\circ)=72.86\) %, frente al 50 % sin el analizador intermedio: intercalar un analizador <em>aumenta</em> el paso. Lance 4000 átomos y compare el recuento con la probabilidad exacta (el error estadístico es del orden de \(\sqrt{N p(1-p)}\)).</li>
</ul></div>
<div class="box note"><h4>Con muchos analizadores intermedios</h4><p>Con \(N\) pasos iguales de \(\pi/N\) (\(N-1\) analizadores intermedios) desde \(z+\) hasta \(z-\), la fracción que pasa es \(\cos^{2N}(\pi/2N)\to1\) para \(N\to\infty\) (0.25 con \(N=2\), 0.6054 con \(N=5\), 0.7805 con \(N=10\), 0.9756 con \(N=100\)): una sucesión de medidas poco exigentes puede <em>conducir</em> un espín de forma casi perfecta. Es el efecto Zenón cuántico y el fundamento de las puertas de rotación por pasos.</p></div>
</section>

<section>
<h2>Dinámica: Larmor, rotaciones y el signo del espinor</h2>
<p>En un campo \(\mathbf B\) el hamiltoniano es \(H=-\boldsymbol\mu\cdot\mathbf B=\tfrac\hbar2\,\omega_L\,\hat{\mathbf b}\cdot\boldsymbol\sigma\) con la <span class="term">frecuencia de Larmor</span> \(\omega_L=g\mu_BB/\hbar\) (el electrón tiene \(\omega_L/B=1.7609\times10^{11}\) rad s\(^{-1}\) T\(^{-1}\), es decir 28.025 GHz/T; el protón tiene \(42.577\) MHz/T). Por el mismo argumento que en el capítulo 5, la evolución es una rotación:</p>
<div class="eq key" data-name="Rotación de un espinor">\[\hat U(t)=\ee^{-\ii\omega_Lt\,\hat{\mathbf b}\cdot\boldsymbol\sigma/2}=\cos\frac{\omega_Lt}2-\ii\,\hat{\mathbf b}\cdot\boldsymbol\sigma\,\sin\frac{\omega_Lt}2,\qquad\frac{\dd\langle\boldsymbol\sigma\rangle}{\dd t}=\boldsymbol\omega_L\times\langle\boldsymbol\sigma\rangle.\]</div>
<p>El vector de Bloch <em>precesa</em> alrededor del campo sin cambiar de longitud, como un trompo; \(\langle\mathbf S\rangle\) conserva su ángulo con \(\mathbf B\) (hay conservación de energía). Si el espín parte hacia \(+z\) y el campo forma el ángulo \(\theta\) con \(z\), la probabilidad de invertirlo es (la fórmula de Rabi del capítulo 5)</p>
<div class="eq">\[P_{\uparrow\to\downarrow}(t)=\sin^2\theta\,\sin^2\frac{\omega_Lt}2 ,\]</div>
<p>con máximo \(\sin^2\theta\): solo un campo perpendicular al espín (\(\theta=90^\circ\)) lo invierte por completo. En la <em>resonancia magnética nuclear</em> se aplica un campo estático \(B_0\) y un campo de radiofrecuencia perpendicular, resonante con la frecuencia de Larmor; en el sistema que gira con el campo oscilante, el efecto es el de un campo transversal fijo.</p>
<p>La rotación por un ángulo \(\varphi\) alrededor de \(\mathbf n\) es \(\hat R_{\mathbf n}(\varphi)=\ee^{-\ii\varphi\,\mathbf n\cdot\boldsymbol\sigma/2}\). Pero el mismo cálculo da un resultado sin analogía clásica: \(\hat R(2\pi)=\cos\pi-\ii\,\mathbf n\cdot\boldsymbol\sigma\sin\pi=-1\). <strong>Una rotación de 360° cambia el signo del espinor</strong>, y solo la de 720° lo devuelve a su estado inicial. Las probabilidades no se ven afectadas, pues el signo global no es observable, pero se puede medir si se interfiere un haz girado con otro sin girar. Esto lo hicieron Rauch et al. (1975) y Werner et al. (1975) con neutrones en un interferómetro de silicio: una rama atraviesa una región con campo magnético que hace precesar el espín en el ángulo \(\varphi=\gamma_nBt\), y la intensidad a la salida es \(\cos^2(\varphi/4)\): nula con \(\varphi=2\pi\), máxima con \(\varphi=4\pi\). Es la manifestación más directa de que los espinores no son vectores: su grupo es SU(2), que recubre dos veces el grupo de las rotaciones SO(3).</p>
<div class="sim" data-sim="spinor-2pi" data-title="Giro de 2π de un espinor: interferometría de neutrones"></div>
<div class="sim-guide"><ul>
<li>Con \(\varphi=360^\circ\) la intensidad es 0 y \(\cos(\varphi/2)=-1\): el espinor vuelve con signo opuesto. Con 720° la intensidad vuelve a 1. A \(\varphi=180^\circ\) la intensidad es \(\cos^2(45^\circ)=0.5\).</li>
<li>El campo necesario: con neutrones de 2200 m/s (\(\lambda=1.798\) Å) y un tramo de 2 cm, el tiempo de vuelo es 9.09 µs y el campo que produce \(2\pi\) es 3.77 mT (7.54 mT para \(4\pi\)): campos del orden de un imán doméstico.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule la frecuencia de Larmor, \(\omega_L/2\pi\), de un electrón y de un protón en el campo de 1.5 T de un resonador de MRI, y el periodo de precesión de cada uno. Use \(g=2.00232\), \(\mu_B=9.2740\times10^{-24}\) J/T y \(\gamma_p/2\pi=42.577\) MHz/T.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Electrón.</b> \(\omega_L=g\mu_BB/\hbar=\dfrac{2.00232\times9.2740\times10^{-24}\times1.5}{1.05457\times10^{-34}}=2.641\times10^{11}\) rad/s.</li>
<li><b>Frecuencia.</b> \(f=\omega_L/2\pi=28.025\ \text{GHz/T}\times1.5\ \text{T}=42.04\) GHz (microondas, banda Ka), periodo \(T=1/f=23.79\) ps.</li>
<li><b>Protón.</b> \(f=42.577\ \text{MHz/T}\times1.5\ \text{T}=63.87\) MHz (radiofrecuencia, FM baja), periodo \(T=15.66\) ns.</li>
<li><b>Resultado.</b> <span class="ans">Electrón: 42.04 GHz y 23.79 ps; protón: 63.87 MHz y 15.66 ns. Es la razón por la que la RMN usa radio y la resonancia de espín electrónico usa microondas.</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Un electrón está en \(\psi=\tfrac35|\!\uparrow\rangle+\tfrac{4\ii}5|\!\downarrow\rangle\). Halle \(P(S_z=\pm\hbar/2)\), \(\langle\boldsymbol\sigma\rangle\), \(\Delta S_z\) y la probabilidad de medir \(S_y=+\hbar/2\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Probabilidades.</b> \(P_\uparrow=|3/5|^2=0.36\), \(P_\downarrow=|4\ii/5|^2=0.64\) (suman 1).</li>
<li><b>Vector de Bloch.</b> Con \(a=\tfrac35\), \(b=\tfrac{4\ii}5\): \(\langle\sigma_x\rangle=2\,\mathrm{Re}(a^*b)=0\), \(\langle\sigma_y\rangle=2\,\mathrm{Im}(a^*b)=2\times0.48=0.96\), \(\langle\sigma_z\rangle=|a|^2-|b|^2=-0.28\).</li>
<li><b>Verificación.</b> \(0^2+0.96^2+0.28^2=0.9216+0.0784=1\): el vector es unitario (estado puro) ✓.</li>
<li><b>Dispersión de \(S_z\).</b> \(\Delta S_z=\tfrac\hbar2\sqrt{1-\langle\sigma_z\rangle^2}=\tfrac\hbar2\sqrt{1-0.0784}=0.48\,\hbar\).</li>
<li><b>\(S_y\).</b> \(P(S_y=+\hbar/2)=\tfrac{1+\langle\sigma_y\rangle}2=\tfrac{1+0.96}2=0.98\).</li>
<li><b>Resultado.</b> <span class="ans">0.36 y 0.64; \(\langle\boldsymbol\sigma\rangle=(0,\,0.96,\,-0.28)\); \(\Delta S_z=0.48\hbar\); \(P(S_y=+)=0.98\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Un haz con espín \(z+\) atraviesa un analizador orientado a \(\alpha\) y luego uno orientado a \(180^\circ\) (es decir, \(z-\)). (a) Calcule la fracción que pasa para \(\alpha=90^\circ\) y sin el analizador intermedio. (b) Halle el \(\alpha\) que maximiza la fracción. (c) Con \(N-1\) analizadores intermedios que giran en \(N\) pasos iguales de \(\pi/N\), ¿qué fracción pasa para \(N=2,5,10\)?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Fracción total.</b> \(P(\alpha)=\cos^2\tfrac\alpha2\cos^2\tfrac{\pi-\alpha}2=\cos^2\tfrac\alpha2\sin^2\tfrac\alpha2=\tfrac14\sin^2\alpha\).</li>
<li><b>(a)</b> \(\alpha=90^\circ\): \(P=\tfrac12\cdot\tfrac12=\tfrac14=0.25\). Sin el analizador intermedio: \(\cos^2(90^\circ)=0\).</li>
<li><b>(b)</b> \(\dd P/\dd\alpha=\tfrac14\sin2\alpha=0\Rightarrow\alpha=90^\circ\), con \(P_\text{máx}=0.25\) (el máximo con un solo analizador intermedio).</li>
<li><b>(c)</b> Cada paso transmite \(\cos^2\tfrac\pi{2N}\), luego \(P=\cos^{2N}\tfrac\pi{2N}\): \(N=2\): \(\cos^4 45^\circ=0.25\); \(N=5\): \(\cos^{10}18^\circ=0.6054\); \(N=10\): \(\cos^{20}9^\circ=0.7805\).</li>
<li><b>Límite.</b> \(\ln P=2N\ln\cos\tfrac\pi{2N}\approx-2N\cdot\tfrac12(\tfrac\pi{2N})^2=-\tfrac{\pi^2}{4N}\to0\): \(P\to1\).</li>
<li><b>Resultado.</b> <span class="ans">0.25 (frente a 0); máximo en \(\alpha=90^\circ\); 0.25, 0.6054 y 0.7805; \(P\approx\exp(-\pi^2/4N)\to1\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Un electrón con espín hacia \(+x\) está en un campo \(B=0.1\) T paralelo a \(z\). Halle la frecuencia de Larmor, el tiempo que tarda el espín en apuntar a \(+y\), y \(\langle S_x\rangle(t)\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Frecuencia.</b> \(\omega_L=g\mu_BB/\hbar=1.7609\times10^{10}\) rad/s \(\Rightarrow\) \(f=2.8025\) GHz.</li>
<li><b>Evolución.</b> \(\hat U=\ee^{-\ii\omega_Lt\sigma_z/2}\) gira \(\langle\boldsymbol\sigma\rangle\) un ángulo \(\omega_Lt\) alrededor de \(z\): \(\langle\sigma_x\rangle=\cos\omega_Lt\), \(\langle\sigma_y\rangle=\sin\omega_Lt\), \(\langle\sigma_z\rangle=0\).</li>
<li><b>Tiempo.</b> De \(+x\) a \(+y\) hay un cuarto de vuelta: \(\omega_Lt=\pi/2\), \(t=\dfrac{\pi/2}{1.7609\times10^{10}}=8.921\times10^{-11}\) s \(=89.2\) ps.</li>
<li><b>Valor esperado.</b> \(\langle S_x\rangle=\tfrac\hbar2\cos(\omega_Lt)\), oscilante a 2.80 GHz (periodo 356.8 ps).</li>
<li><b>Resultado.</b> <span class="ans">\(\omega_L=1.7609\times10^{10}\) rad/s (2.8025 GHz); \(t=89.2\) ps; \(\langle S_x\rangle=\tfrac\hbar2\cos\omega_Lt\).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>El espín parte en \(+z\) y el campo, de módulo \(B=0.1\) T, forma 30° con \(z\) (en el plano \(xz\)). Deduzca \(P_{\downarrow}(t)\); halle su máximo, el tiempo en que ocurre y su valor cuando \(\omega_Lt=\pi/2\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Operador.</b> \(\hat U=\cos\tfrac{\omega t}2-\ii\sin\tfrac{\omega t}2\,(\sin\theta\,\sigma_x+\cos\theta\,\sigma_z)\), con \(\theta=30^\circ\).</li>
<li><b>Aplicar a \(|\!\uparrow\rangle\).</b> \(\sigma_x|\!\uparrow\rangle=|\!\downarrow\rangle\), \(\sigma_z|\!\uparrow\rangle=|\!\uparrow\rangle\): la componente \(\downarrow\) es \(-\ii\sin\theta\sin\tfrac{\omega t}2\).</li>
<li><b>Probabilidad.</b> \(P_\downarrow=\sin^2\theta\,\sin^2\tfrac{\omega t}2\) con \(\sin^2 30^\circ=0.25\).</li>
<li><b>Máximo.</b> \(0.25\), cuando \(\omega t=\pi\): \(t=\pi/\omega_L=\pi/(1.7609\times10^{10})=1.784\times10^{-10}\) s \(=178.4\) ps.</li>
<li><b>Con \(\omega_Lt=\pi/2\).</b> \(P_\downarrow=0.25\sin^2(\pi/4)=0.125\).</li>
<li><b>Resultado.</b> <span class="ans">\(P_\downarrow=\sin^2\theta\sin^2(\omega_Lt/2)\); máximo 0.25 a los 178.4 ps; 0.125 en \(\omega_Lt=\pi/2\).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>En un interferómetro de neutrones (\(v=2200\) m/s, \(\gamma_n=1.8325\times10^8\) rad s\(^{-1}\) T\(^{-1}\)) una rama atraviesa 2 cm de campo \(B\) transversal. Calcule el campo que gira el espín \(2\pi\) y \(4\pi\), la intensidad a la salida en \(\varphi=\pi\), \(2\pi\), \(4\pi\), y la longitud de onda de los neutrones.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Tiempo de vuelo.</b> \(t=L/v=0.02/2200=9.091\ \mu\)s.</li>
<li><b>Ángulo de precesión.</b> \(\varphi=\gamma_nBt\Rightarrow B=\varphi/(\gamma_nt)\).</li>
<li><b>Campos.</b> \(B_{2\pi}=\dfrac{2\pi}{1.8325\times10^8\times9.091\times10^{-6}}=3.772\) mT; \(B_{4\pi}=7.543\) mT.</li>
<li><b>Intensidad.</b> Amplitud de salida \(\propto\tfrac12(1+\ee^{-\ii\varphi/2})\Rightarrow I=\cos^2(\varphi/4)\): \(\varphi=\pi\): \(\cos^2 45^\circ=0.5\); \(\varphi=2\pi\): \(\cos^2 90^\circ=0\); \(\varphi=4\pi\): \(\cos^2\pi=1\).</li>
<li><b>Longitud de onda.</b> \(\lambda=h/m_nv=\dfrac{6.626\times10^{-34}}{1.6749\times10^{-27}\times2200}=1.798\) Å.</li>
<li><b>Resultado.</b> <span class="ans">3.772 mT y 7.543 mT; intensidades 0.5, 0 y 1; \(\lambda=1.798\) Å. Con \(2\pi\) la interferencia es <em>destructiva</em>: el signo del espinor es observable.</span></li>
</ol></details></li>
</ol>
