<template class="chapter-src" data-id="caja" data-num="6" data-title="El pozo infinito" data-part="Parte II · Problemas en una dimensión" data-short="Solución completa de la partícula en una caja: cuantización, ortonormalidad, valores esperados y límite clásico, dinámica con renacimientos y alfombras cuánticas, expansión súbita de las paredes, y la caja en dos y tres dimensiones con su degeneración y densidad de estados">
<p class="lead">La partícula en una caja es el problema más simple con estados ligados y por eso es el mejor laboratorio de las ideas cuánticas: el confinamiento produce niveles discretos, la energía mínima no es cero, la densidad se acerca a la clásica para \(n\) grande, y las superposiciones tienen una dinámica periódica, con renacimientos exactos, que ningún sistema clásico tiene. Se resuelve de manera completa, con todos los pasos, y las mismas ideas sirven para pozos más reales en el capítulo 7 y para modelos de electrones en moléculas conjugadas, puntos cuánticos y núcleos.</p>

<section>
<h2>Solución de la ecuación estacionaria</h2>
<p>Se toma \(V=0\) para \(0\lt x\lt L\) y \(V=\infty\) fuera. Dentro, la ecuación \(-\tfrac{\hbar^2}{2m}\psi''=E\psi\) es la de un oscilador espacial con \(k=\sqrt{2mE}/\hbar\) (\(E\gt0\), como se demostró en el capítulo 2): \(\psi=A\sin kx+B\cos kx\). Fuera de la caja, la función debe ser cero (la partícula no puede estar donde la energía potencial es infinita), y por continuidad de \(\psi\) se exigen \(\psi(0)=\psi(L)=0\). La primera condición elimina el coseno, \(B=0\); la segunda exige \(\sin kL=0\), esto es, \(kL=n\pi\). La derivada \(\psi'\) <em>no</em> es continua en las paredes (el salto de \(V\) es infinito), y eso está permitido. La normalización fija \(A\):</p>
<div class="eq key" data-name="Estados de la partícula en una caja">\[\psi_n(x)=\sqrt{\frac2L}\sin\frac{n\pi x}{L},\qquad E_n=\frac{n^2\pi^2\hbar^2}{2mL^2}=n^2E_1,\qquad n=1,2,3,\dots\]</div>
<p>Se descarta \(n=0\) (daría \(\psi\equiv0\)) y los \(n\lt0\) (la misma función con signo cambiado, el mismo estado físico). Propiedades que conviene retener:</p>
<ul>
<li><strong>Ortonormalidad y completitud.</strong> \(\int_0^L\psi_m\psi_n\dd x=\delta_{mn}\); cualquier función con \(\psi(0)=\psi(L)=0\) se desarrolla como serie de Fourier de senos: \(\Psi=\sum c_n\psi_n\) (capítulo 4).</li>
<li><strong>Nodos y paridad.</strong> \(\psi_n\) tiene \(n-1\) nodos interiores y es simétrica respecto al centro \(x=L/2\) si \(n\) es impar, antisimétrica si \(n\) es par: \(\psi_n(L-x)=(-1)^{n+1}\psi_n(x)\).</li>
<li><strong>Energía de punto cero.</strong> \(E_1=\pi^2\hbar^2/2mL^2>0\). Para un electrón en \(L=1\) nm, \(E_1=0.37603\) eV; para \(L=0.5\) nm, 1.504 eV, cuatro veces mayor. Confinar cuesta energía cinética: \(E\propto1/L^2\).</li>
<li><strong>Presión.</strong> \(E_n\) crece al reducir \(L\); la fuerza sobre una pared es \(F=-\dd E_n/\dd L=2E_n/L\) (hacia afuera): es la presión de degeneración cuántica.</li>
<li><strong>Valores esperados.</strong> \(\langle x\rangle=L/2\), \(\langle x^2\rangle=L^2\left(\tfrac13-\tfrac1{2n^2\pi^2}\right)\), \(\langle p\rangle=0\), \(\langle p^2\rangle=n^2\pi^2\hbar^2/L^2\), y por tanto \(\Delta x\Delta p=\tfrac\hbar2\sqrt{n^2\pi^2/3-2}\) (valores de 1.136, 3.341 y 5.254 veces \(\hbar/2\) para \(n=1,2,3\)).</li>
</ul>
<div class="box ex"><h4>Una caja nuclear y una caja macroscópica</h4>
<p><strong>(a) Un protón en un núcleo.</strong> Modelo burdo del núcleo como una caja de \(L=10\) fm: \(E_1=\pi^2\hbar^2/2m_pL^2=2.05\) MeV, y la transición \(2\to1\) libera \(3E_1=6.14\) MeV: la escala de energía observada en las transiciones nucleares (MeV), seis órdenes de magnitud sobre las químicas (eV). Es consecuencia de \(E\propto1/mL^2\): con \(L\) cuatro órdenes menor que un átomo (10 fm frente a 1 Å) la energía crece \(10^8\) veces, y la masa 1836 veces mayor la reduce en esa proporción, de modo que queda unas \(5\times10^4\) veces la escala atómica (de decenas de eV a MeV). <strong>(b) Una molécula de \(\mathrm N_2\) en una caja de 10 cm.</strong> \(E_1=7.36\times10^{-22}\) eV. A 300 K, \(k_BT=0.02585\) eV, es decir \(3.5\times10^{19}\) veces \(E_1\): el número de estados con energía menor que \(k_BT\) es \(\tfrac\pi6(k_BT/E_1)^{3/2}\approx1.1\times10^{29}\) (ver la sección 6.5). Los niveles son tan densos que se comportan como un continuo, y por eso la mecánica estadística de un gas puede tratar la traslación de forma clásica.</p></div>
<div class="sim" data-sim="caja1d" data-title="Estados de la caja, energías y el límite clásico"></div>
<div class="sim-guide"><ul>
<li>Electrón en \(L=1\) nm con \(n=3\): \(E_3=9E_1=3.384\) eV; el siguiente salto, \(3\to4\), cuesta \(7E_1=2.632\) eV (471 nm, azul). La probabilidad de hallarlo en la mitad central \([0.25,0.75]\) es 39.4 %, frente al 50 % clásico; para \(n=1\) es 81.8 % y para \(n=2\), 50.0 %.</li>
<li>Suba a \(n=30\): la densidad oscila tan rápido que sobre cualquier intervalo no muy pequeño el promedio es la línea clásica de \(1/L\), y la probabilidad en \([0.25,0.75]\) es 50.0 %. El cociente \(\Delta x\Delta p/(\hbar/2)\) crece con \(n\), \(\approx n\pi/\sqrt3\): la incertidumbre en \(p\) es grande porque \(\psi_n\) es la suma de dos ondas con \(p=\pm n\pi\hbar/L\).</li>
<li>Cambie a un protón con la misma \(L\): \(E_1=2.05\times10^{-4}\) eV (1836 veces menor). Y con N₂ en 10 cm, el espaciado entre niveles es de \(10^{-21}\) eV, millones de veces por debajo de \(k_BT\): el modelo de bola de billar es una buena descripción.</li>
</ul></div>
</section>

<section>
<h2>El límite clásico</h2>
<p>Una partícula clásica de energía \(E\) rebota entre las paredes con velocidad constante, y pasa el mismo tiempo en cada punto: densidad uniforme \(\rho_\text{cl}=1/L\). El estado cuántico \(|\psi_n|^2=\tfrac2L\sin^2(n\pi x/L)\) oscila entre 0 y \(2/L\), pero la media sobre un intervalo \([a,b]\) mayor que la longitud de onda se aproxima a la clásica:</p>
<div class="eq">\[P_n(a,b)=\int_a^b|\psi_n|^2\dd x=\frac{b-a}{L}-\frac{1}{2n\pi}\left[\sin\frac{2n\pi b}{L}-\sin\frac{2n\pi a}{L}\right]\ \xrightarrow{n\to\infty}\ \frac{b-a}L.\]</div>
<p>La diferencia entre las dos es de orden \(1/n\). Igualmente \(\langle x^2\rangle\to L^2/3\) (el valor de una distribución uniforme, \(\Delta x\to L/\sqrt{12}=0.2887L\)) y la separación relativa de niveles \((E_{n+1}-E_n)/E_n\to2/n\to0\): el espectro se vuelve un continuo. Es el <span class="term">principio de correspondencia</span> de Bohr: para números cuánticos grandes, las predicciones cuánticas se acercan a las clásicas. Para \(n\) pequeño no tiene nada que ver con lo clásico: el estado fundamental tiene máximo en el centro y es cero en las paredes.</p>
</section>

<section>
<h2>Dinámica: renacimientos y alfombras cuánticas</h2>
<p>La energía es \(E_n=n^2E_1\), proporcional a un cuadrado perfecto, y esto da una dinámica de una regularidad notable. En \(\Psi(x,t)=\sum_nc_n\psi_n(x)e^{-\ii n^2E_1t/\hbar}\) todas las fases son múltiplos enteros de una sola, \(\omega_1t=E_1t/\hbar\), y la función entera es periódica con el <span class="term">tiempo de renacimiento</span></p>
<div class="eq key" data-name="Renacimientos en la caja">\[T_\text{ren}=\frac{2\pi\hbar}{E_1}=\frac{4mL^2}{\pi\hbar},\qquad \Psi(x,T_\text{ren})=\Psi(x,0).\]</div>
<p>Más aún: en \(t=T_\text{ren}/2\) las fases son \(e^{-\ii n^2\pi}=(-1)^n\), y como \(\psi_n(L-x)=(-1)^{n+1}\psi_n(x)\), resulta \(\Psi(x,T_\text{ren}/2)=-\Psi(L-x,0)\): la imagen especular del estado inicial. En \(t=T_\text{ren}/4\) las fases son \(1\) para \(n\) par y \(-\ii\) para \(n\) impar; separando \(\Psi_0\) en sus partes simétrica \(\tfrac12[\Psi_0(x)+\Psi_0(L-x)]\) (los \(n\) impares) y antisimétrica (los pares), se obtiene \(\Psi=\tfrac12[(1-\ii)\Psi_0(x)-(1+\ii)\Psi_0(L-x)]\): el paquete se desdobla en <em>dos copias</em> iguales, una en \(x_0\) y otra en \(L-x_0\), con peso 1/2 cada una, un «estado gato» de Schrödinger. En otras fracciones racionales \(T_\text{ren}\,p/q\) aparecen \(q\) o \(q/2\) copias. Entre ellos, el paquete rebota en las paredes y se difunde. Al dibujar \(|\Psi|^2\) en función de \(x\) y \(t\) se ve una trama de interferencias, llamada <span class="term">alfombra cuántica</span> (Kinzel 1995; Berry 1996), con estructura fractal.</p>
<div class="box ex"><h4>El tiempo de renacimiento de un electrón en una caja</h4>
<p><strong>Procedimiento.</strong> \(T_\text{ren}=4mL^2/\pi\hbar\). Para \(L=1\) nm y electrón: \(4\times9.1094\times10^{-31}\times10^{-18}/(\pi\times1.05457\times10^{-34})=1.0998\times10^{-14}\) s \(=11.0\) fs. Para \(L=0.1\) nm (un átomo): 0.110 fs. Con la velocidad del paquete \(v=\hbar k_0/m\), el tiempo de ida y vuelta es \(2L/v\); con \(k_0L=20\pi\), \(2L/v=2mL^2/(20\pi\hbar)=T_\text{ren}/(40)\). <strong>Resultado.</strong> El estado inicial se reconstruye cada 11 fs en una caja de 1 nm, tiempos accesibles con láseres de femtosegundos; los renacimientos de paquetes de ondas se han observado en átomos de Rydberg (Yeazell, Stroud 1988).</p></div>
<div class="sim" data-sim="alfombra" data-title="Alfombra cuántica: evolución espacio–tiempo de un paquete gaussiano en la caja"></div>
<div class="sim-guide"><ul>
<li>Con los valores iniciales (\(x_0=0.3\), \(\sigma=0.04\), \(k_0=20\pi/L\)) el paquete corre hacia la derecha con \(v=62.8\) y rebota cada \(2/v=0.032=0.025\,T_\text{ren}\): la «zigzag» de las primeras líneas diagonales. Fije el tiempo mostrado en 0.25: en el borde inferior de la alfombra (\(t=T_\text{ren}/4\)) hay dos copias del paquete, en \(x_0\) y en \(1-x_0\), cada una con la mitad de la probabilidad.</li>
<li>Ponga el tiempo mostrado en 1 (un renacimiento completo): arriba y abajo de la figura el paquete es el mismo, y en la mitad (\(t=T_\text{ren}/2\)) es la imagen especular del inicial (en 0.7 si \(x_0=0.3\)). El cursor muestra el corte \(|\Psi|^2\) en el instante elegido.</li>
<li>Con \(k_0=0\) el paquete no tiene dirección preferida y se abre en dos mitades que se reflejan. Un paquete más ancho (\(\sigma=0.15\)) tiene menos modos y una alfombra menos «fina». Los estados con más de unos cientos de modos requieren \(\sigma\) pequeño.</li>
</ul></div>
</section>

<section>
<h2>Expansión súbita de las paredes</h2>
<p>Si una pared se aleja tan rápido (comparado con \(\hbar/E_1\)) que la función de onda no tiene tiempo de cambiar, el estado sigue siendo el mismo \(\psi_1\) de la caja de ancho \(L\), pero ahora vive en una caja de ancho \(L'=aL\), cuyos estados propios son \(\phi_n=\sqrt{2/L'}\sin(n\pi x/L')\). Lo que cambia es el desarrollo: \(c_n=\langle\phi_n|\psi_1\rangle\). Para \(a=2\) los coeficientes se calculan en forma cerrada:</p>
<div class="eq">\[c_n=\sqrt2\int_0^1\sin\pi u\,\sin\frac{n\pi u}2\dd u\ \Rightarrow\ P_2=\tfrac12,\qquad P_n=\frac{32\,\sin^2(n\pi/2)}{\pi^2(n^2-4)^2}\ \ (n\neq2),\ \ P_1=\frac{32}{9\pi^2}=0.3603,\ P_3=0.1297.\]</div>
<p>Los resultados se leen así: con probabilidad 1/2 el sistema queda en el estado \(n=2\) de la caja doble (que coincide con \(\psi_1\) en la mitad izquierda: media caja idéntica), y el resto se reparte en los estados impares con \(P_n\propto n^{-4}\). La energía media se conserva, \(\langle H'\rangle=\langle\psi_1|\hat p^2/2m|\psi_1\rangle=E_1(L)=4E_1(2L)\) (la energía cinética no cambia en un instante, y el potencial interior sigue siendo nulo), aunque ningún estado posible tenga esa energía exacta con certeza. La función evoluciona después con las fases de la caja nueva, ocupando poco a poco todo el espacio, con renacimientos en \(T'_\text{ren}=4(aL)^2m/\pi\hbar\).</p>
<div class="sim" data-sim="expansubita" data-title="Expansión súbita de la caja: reparto de probabilidad y evolución posterior"></div>
<div class="sim-guide"><ul>
<li>Con \(a=2\): \(P_1=0.3603\), \(P_2=0.5000\), \(P_3=0.1297\), \(P_4=0\) (el coeficiente, proporcional a \(\sin(n\pi/2)\), se anula para todo \(n\) par distinto de 2). La suma truncada a 80 términos da \(\langle E\rangle=4.910\), frente a la exacta \(\pi^2/2=4.935\): la serie converge como \(1/N\).</li>
<li>Con \(a=3\) o \(4\) el estado inicial ocupa una fracción menor de la caja nueva y se reparte entre más niveles (\(P_n\) más ancho). En \(a\to1\) (sin expansión) \(P_1\to1\).</li>
<li>Deje correr el tiempo: el paquete se expande hasta cubrir la caja, y al cabo de un tiempo de renacimiento \(T'_\text{ren}\) la forma inicial vuelve (la animación cubre un ciclo cada 12.5 s).</li>
</ul></div>
</section>

<section>
<h2>La caja en dos y tres dimensiones</h2>
<p>Para una caja rectangular \(L_x\times L_y\times L_z\) el hamiltoniano es suma de términos que dependen de una sola coordenada, y la ecuación se separa: \(\psi=\psi_{n_x}(x)\psi_{n_y}(y)\psi_{n_z}(z)\) con \(E=\tfrac{\pi^2\hbar^2}{2m}\left(\tfrac{n_x^2}{L_x^2}+\tfrac{n_y^2}{L_y^2}+\tfrac{n_z^2}{L_z^2}\right)\). Cuando la caja tiene simetría, algunos niveles tienen varios estados distintos con la misma energía: la <span class="term">degeneración</span>. En una caja cuadrada, \(E\propto n_x^2+n_y^2\), y \((1,2)\) y \((2,1)\) son degenerados por la simetría de intercambio \(x\leftrightarrow y\). Hay también degeneraciones «accidentales», sin simetría evidente detrás, de origen aritmético: \(1^2+7^2=5^2+5^2=50\) (tres estados: \((1,7)\), \((7,1)\), \((5,5)\)). En una caja cúbica, \(E=27E_1\) corresponde a \((1,1,5)\) y sus permutaciones y a \((3,3,3)\): cuatro estados. Si se rompe la simetría (\(L_y\ne L_x\)), la degeneración desaparece, por lo común.</p>
<p>Para \(N\) grande, el número de estados con energía menor que \(E\) es el de puntos enteros positivos dentro de un octante de esfera de radio \(R=\sqrt{E/E_1}\): \(\mathcal N(E)=\tfrac18\tfrac{4\pi}3R^3=\tfrac\pi6(E/E_1)^{3/2}\), con \(E_1=\pi^2\hbar^2/2mL^2\), y la densidad de estados \(g(E)=\dd\mathcal N/\dd E=\tfrac\pi4\sqrt E/E_1^{3/2}\propto V\sqrt E\) (con \(V=L^3\); en general no depende de la forma de la caja: ley de Weyl). Es la base del cálculo de la mecánica estadística de un gas ideal y del gas de electrones libres en un metal (capítulos 28 y 29).</p>
<div class="sim" data-sim="caja2d" data-title="Caja bidimensional: estados, degeneración y oscilación de una superposición"></div>
<div class="sim-guide"><ul>
<li>Caja cuadrada con \((2,1)\) y \((1,2)\): ambos tienen \(E=5E_1\), así que la superposición es <em>estacionaria</em> (la densidad no depende del tiempo) y tiene forma de una banda diagonal. La lectura marca degeneración 2 para \(n_x^2+n_y^2=5\).</li>
<li>Cambie el cociente de lados a 1.2: la degeneración se rompe, \(E(2,1)=4.69\) y \(E(1,2)=3.78\) (en unidades de \(E_1\)), y la superposición ahora oscila con \(|\Delta E|=0.92E_1\): la densidad se desplaza de un lado al otro de la caja.</li>
<li>Con \((3,4)\) y \((4,3)\) en una caja cuadrada: \(E=25E_1\) los dos, superposición estacionaria, y la lectura marca degeneración 2. La degeneración 3 de \(E=50E_1\) (\((1,7)\), \((7,1)\), \((5,5)\)) no cabe en los controles (\(n\le6\)); se comprueba en el problema 5.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un electrón está en una caja de 0.5 nm. Calcule \(E_1\), \(E_2\), \(E_3\) y la longitud de onda del fotón emitido en la transición \(3\to2\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Fórmula.</b> \(E_n=n^2\pi^2\hbar^2/2mL^2\). Con \(L=0.5\) nm: \(E_1=0.37603\ \text{eV}\times(1/0.5)^2=1.5041\) eV.</li>
<li><b>Niveles.</b> \(E_2=4E_1=6.0165\) eV; \(E_3=9E_1=13.537\) eV.</li>
<li><b>Transición 3→2.</b> \(\Delta E=5E_1=7.5206\) eV.</li>
<li><b>Longitud de onda.</b> \(\lambda=hc/\Delta E=1239.84/7.5206=164.9\) nm (ultravioleta).</li>
<li><b>Resultado.</b> <span class="ans">1.504, 6.017 y 13.54 eV; \(\lambda=164.9\) nm.</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Calcule la probabilidad de hallar la partícula en la mitad central \(L/4\lt x\lt3L/4\) para \(n=1,2,3\) y compárela con la clásica.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Fórmula general.</b> \(P_n=\dfrac12-\dfrac{1}{2n\pi}\left[\sin\dfrac{3n\pi}2-\sin\dfrac{n\pi}2\right]\) (con \(a=L/4\), \(b=3L/4\)).</li>
<li><b>\(n=1\).</b> \(\sin\tfrac{3\pi}2=-1\), \(\sin\tfrac\pi2=1\): corchete \(=-2\). \(P_1=\tfrac12+\tfrac1\pi=0.8183\).</li>
<li><b>\(n=2\).</b> \(\sin3\pi=\sin\pi=0\): \(P_2=\tfrac12\).</li>
<li><b>\(n=3\).</b> \(\sin\tfrac{9\pi}2=1\), \(\sin\tfrac{3\pi}2=-1\): corchete \(=2\). \(P_3=\tfrac12-\tfrac1{3\pi}=0.3939\).</li>
<li><b>Comparación.</b> Clásica: \((3/4-1/4)=0.5\). El estado fundamental se concentra en el centro (81.8 %), el \(n=3\) lo evita (39.4 %); la diferencia es de \(1/(n\pi)\) y se anula al crecer \(n\).</li>
<li><b>Resultado.</b> <span class="ans">\(P_1=0.8183\), \(P_2=0.5000\), \(P_3=0.3939\); clásico 0.5.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que \(\Psi(x,T_\text{ren})=\Psi(x,0)\) y \(\Psi(x,T_\text{ren}/2)=-\Psi(L-x,0)\), y calcule \(T_\text{ren}\) para un electrón en una caja de 1 nm y en una de 0.1 nm.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Fases.</b> \(\Psi(x,t)=\sum c_n\psi_n(x)e^{-\ii n^2\omega_1t}\), \(\omega_1=E_1/\hbar\). Con \(t=T=2\pi/\omega_1\): \(e^{-\ii n^2\cdot2\pi}=1\) para todo entero \(n\). Entonces \(\Psi(x,T)=\Psi(x,0)\).</li>
<li><b>Mitad de periodo.</b> Con \(t=T/2\), \(e^{-\ii n^2\pi}=(-1)^{n^2}=(-1)^n\) (\(n^2\) y \(n\) tienen la misma paridad).</li>
<li><b>Paridad.</b> \(\psi_n(L-x)=\sqrt{2/L}\sin(n\pi-n\pi x/L)=(-1)^{n+1}\psi_n(x)\).</li>
<li><b>Conclusión.</b> \((-1)^n\psi_n(x)=-\psi_n(L-x)\). Entonces \(\Psi(x,T/2)=\sum c_n(-1)^n\psi_n(x)=-\sum c_n\psi_n(L-x)=-\Psi(L-x,0)\).</li>
<li><b>Tiempos.</b> \(T=4mL^2/\pi\hbar\). Para 1 nm: \(1.0998\times10^{-14}\) s \(=11.0\) fs; para 0.1 nm, el factor \(L^2\) da \(1.0998\times10^{-16}\) s \(=0.110\) fs.</li>
<li><b>Resultado.</b> <span class="ans">\(T_\text{ren}=11.0\) fs (1 nm) y 0.110 fs (0.1 nm); en \(T/2\) se obtiene la imagen especular.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Una partícula está en el estado fundamental de una caja de ancho \(L\), y una pared se desplaza súbitamente hasta \(2L\). Halle la probabilidad de cada estado de la caja nueva, en particular \(P_1\) y \(P_2\), y la energía media.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Planteamiento.</b> Aproximación súbita: \(\Psi=\psi_1\) justo después. Estados nuevos: \(\phi_n=\sqrt{1/L}\sin(n\pi x/2L)\) en \([0,2L]\). \(c_n=\int_0^L\phi_n\psi_1\dd x\) (\(\psi_1=0\) para \(x\gt L\)).</li>
<li><b>Integral.</b> Con \(u=x/L\): \(c_n=\sqrt2\int_0^1\sin(\pi u)\sin(n\pi u/2)\dd u\). Para \(n=2\): \(\int_0^1\sin^2\pi u\dd u=\tfrac12\), \(c_2=\sqrt2/2\), \(P_2=\tfrac12\).</li>
<li><b>\(n\neq2\).</b> Con \(\sin A\sin B=\tfrac12[\cos(A-B)-\cos(A+B)]\): \(\int_0^1\sin\pi u\sin\tfrac{n\pi u}2\dd u=\dfrac{-4\sin(n\pi/2)}{\pi(n^2-4)}\). Entonces \(c_n=\dfrac{-4\sqrt2\sin(n\pi/2)}{\pi(n^2-4)}\), \(P_n=\dfrac{32\sin^2(n\pi/2)}{\pi^2(n^2-4)^2}\): nulo para \(n\) par, y para \(n\) impar \(P_n=\dfrac{32}{\pi^2(n^2-4)^2}\).</li>
<li><b>Valores.</b> \(P_1=\dfrac{32}{9\pi^2}=0.3603\); \(P_3=\dfrac{32}{25\pi^2}=0.1297\); \(P_5=0.00735\). Suma: \(0.3603+0.5+0.1297+0.0074+\dots=1\).</li>
<li><b>Energía media.</b> \(\langle H'\rangle=\langle\psi_1|\hat p^2/2m|\psi_1\rangle=E_1(L)=\pi^2\hbar^2/2mL^2=4E_1(2L)\); coincide con \(\sum P_nn^2E_1(2L)=\sum P_nE_n'\) (la serie converge lentamente: \(P_nn^2\sim n^{-2}\)).</li>
<li><b>Resultado.</b> <span class="ans">\(P_1=0.3603\), \(P_2=0.5\), \(P_3=0.1297\), \(P_{\text{par}\neq2}=0\); \(\langle E\rangle=4E_1(2L)=E_1(L)\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>En una caja cúbica, liste los estados con \(E=27E_1\) y \(E=14E_1\) y diga su degeneración. En una caja cuadrada, lo mismo para \(E=50E_1\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Condición.</b> Cubo: \(n_x^2+n_y^2+n_z^2=E/E_1\), con \(n_i\ge1\).</li>
<li><b>\(E=14E_1\).</b> \(1+4+9=14\): los seis ordenamientos de \((1,2,3)\). No hay otra combinación (\(9+4+1\) es la única descomposición en tres cuadrados positivos). Degeneración 6, por la simetría del cubo (grupo de permutaciones).</li>
<li><b>\(E=27E_1\).</b> \(1+1+25=27\): las tres permutaciones de \((1,1,5)\); y \(9+9+9=27\): \((3,3,3)\). Total 4. El \((3,3,3)\) no está relacionado por simetría con los otros: degeneración accidental.</li>
<li><b>Cuadrada, \(E=50E_1\).</b> \(1+49=50\): \((1,7)\) y \((7,1)\); \(25+25=50\): \((5,5)\). Total 3.</li>
<li><b>Resultado.</b> <span class="ans">\(14E_1\): 6 estados; \(27E_1\): 4 estados; en 2D, \(50E_1\): 3 estados.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que \(\langle x^2\rangle_n=L^2\left(\tfrac13-\tfrac1{2n^2\pi^2}\right)\) y que \(\Delta x\Delta p=\tfrac\hbar2\sqrt{n^2\pi^2/3-2}\). Evalúe para \(n=1,2,3,10\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Integral.</b> \(\langle x^2\rangle=\tfrac2L\int_0^Lx^2\sin^2\tfrac{n\pi x}L\dd x=\tfrac1L\int_0^Lx^2\left(1-\cos\tfrac{2n\pi x}L\right)\dd x=\tfrac{L^2}3-\tfrac1L\int_0^Lx^2\cos\tfrac{2n\pi x}L\dd x\).</li>
<li><b>Por partes.</b> \(\int_0^Lx^2\cos kx\,\dd x\) con \(k=2n\pi/L\): \(\left[\tfrac{x^2\sin kx}k\right]_0^L-\tfrac2k\int_0^Lx\sin kx\,\dd x=0-\tfrac2k\left(-\tfrac{L\cos kL}k+\tfrac{\sin kL}{k^2}\right)=\tfrac{2L}{k^2}\) (con \(\cos kL=1\), \(\sin kL=0\)). Entonces \(\tfrac2k\cdot\tfrac Lk=\tfrac{2L}{k^2}=\dfrac{L^3}{2n^2\pi^2}\).</li>
<li><b>Resultado.</b> \(\langle x^2\rangle=\tfrac{L^2}3-\tfrac{L^2}{2n^2\pi^2}\). Como \(\langle x\rangle=L/2\), \(\Delta x^2=L^2\left(\tfrac1{12}-\tfrac1{2n^2\pi^2}\right)\).</li>
<li><b>Momento.</b> \(\langle p\rangle=0\); \(\langle p^2\rangle=2mE_n=n^2\pi^2\hbar^2/L^2\), \(\Delta p=n\pi\hbar/L\).</li>
<li><b>Producto.</b> \(\Delta x\Delta p=n\pi\hbar\sqrt{\tfrac1{12}-\tfrac1{2n^2\pi^2}}=\tfrac\hbar2\sqrt{\tfrac{n^2\pi^2}3-2}\).</li>
<li><b>Valores.</b> \(n=1\): \(1.1357\); \(n=2\): \(3.3406\); \(n=3\): \(5.2544\); \(n=10\): \(18.083\), en unidades de \(\hbar/2\). Y \(\Delta x/L=0.1808,\ 0.2658,\ 0.2788,\ 0.2878\to0.2887\).</li>
<li><b>Resultado.</b> <span class="ans">\(\Delta x\Delta p=\tfrac\hbar2\sqrt{n^2\pi^2/3-2}\): 1.136, 3.341, 5.254 y 18.08 veces \(\hbar/2\).</span></li>
</ol></details></li>
</ol>
