<template class="chapter-src" data-id="momang" data-num="12" data-title="Momento angular" data-part="Parte III · Momento angular y el átomo" data-short="Las relaciones de conmutación, el método de los operadores de escalera, los armónicos esféricos, el modelo vectorial y las incertidumbres de las componentes, el rotor rígido y los renacimientos rotacionales">
<p class="lead">En un potencial central la energía no determina todo: hay una cantidad conservada, el momento angular, y su álgebra lleva por sí sola a resultados que no dependen de la forma del potencial: la cuantización del módulo y de la proyección, la existencia de funciones angulares universales (los armónicos esféricos) y la imposibilidad de conocer a la vez las tres componentes. Este capítulo desarrolla esa álgebra de dos maneras, una algebraica (operadores de escalera) y otra con ecuaciones diferenciales, y la aplica al rotor rígido, el modelo de la rotación molecular. Las mismas reglas gobiernan el espín (capítulo 15) y la suma de momentos (capítulo 16).</p>

<section>
<h2>Las relaciones de conmutación</h2>
<p>El momento angular orbital es \(\hat{\mathbf L}=\hat{\mathbf r}\times\hat{\mathbf p}\): \(\hat L_x=\hat y\hat p_z-\hat z\hat p_y\) y las cíclicas. De \([\hat x_i,\hat p_j]=\ii\hbar\delta_{ij}\) se calcula, por ejemplo,</p>
<div class="eq">\[[\hat L_x,\hat L_y]=[\hat y\hat p_z-\hat z\hat p_y,\ \hat z\hat p_x-\hat x\hat p_z]=\hat y[\hat p_z,\hat z]\hat p_x+\hat p_y[\hat z,\hat p_z]\hat x=\ii\hbar(\hat x\hat p_y-\hat y\hat p_x)=\ii\hbar\hat L_z,\]</div>
<p>pues solo sobreviven los términos donde un \(p\) encuentra a su coordenada. Con el símbolo de Levi-Civita y el operador \(\hat L^2=\hat L_x^2+\hat L_y^2+\hat L_z^2\):</p>
<div class="eq key" data-name="Álgebra del momento angular">\[[\hat L_i,\hat L_j]=\ii\hbar\,\epsilon_{ijk}\hat L_k,\qquad[\hat L^2,\hat L_i]=0,\qquad [\hat L_i,\hat x_j]=\ii\hbar\,\epsilon_{ijk}\hat x_k.\]</div>
<p>Las componentes no conmutan entre sí, así que no se pueden conocer a la vez con precisión arbitraria (Robertson, capítulo 4); pero cada una conmuta con \(\hat L^2\), y se puede escoger \(\hat L^2\) y \(\hat L_z\) como observables compatibles. Esta es la estructura de las rotaciones: \(\hat{\mathbf L}/\hbar\) genera rotaciones, y el álgebra de arriba es la del grupo \(\mathrm{SO}(3)\) (capítulo 18).</p>
</section>

<section>
<h2>Valores propios: el método de las escaleras</h2>
<p>Con las relaciones anteriores se obtienen todos los valores posibles sin resolver ninguna ecuación diferencial. Se definen los operadores de escalera \(\hat L_\pm=\hat L_x\pm\ii\hat L_y\), con \([\hat L_z,\hat L_\pm]=\pm\hbar\hat L_\pm\), \([\hat L^2,\hat L_\pm]=0\) y \(\hat L^2=\hat L_\mp\hat L_\pm+\hat L_z^2\pm\hbar\hat L_z\). Si \(\hat L^2f=\lambda f\) y \(\hat L_zf=\mu f\), entonces \(\hat L_\pm f\) es autofunción de \(\hat L^2\) con el mismo \(\lambda\) y de \(\hat L_z\) con \(\mu\pm\hbar\): \(\hat L_+\) sube y \(\hat L_-\) baja una unidad de \(\hbar\). La escalera no puede subir indefinidamente porque \(\mu^2\le\lambda\) (pues \(\hat L_x^2+\hat L_y^2\ge0\)): existe un peldaño más alto, \(\hat L_+f_t=0\). Escribiendo \(\mu_\text{máx}=\hbar l\) y usando \(\hat L^2=\hat L_-\hat L_++\hat L_z^2+\hbar\hat L_z\) sobre \(f_t\), resulta \(\lambda=\hbar^2l(l+1)\). De la misma manera existe un peldaño más bajo con \(\mu_\text{mín}=-\hbar l\) (sale de \(\hat L_-f_b=0\)), y como se llega de abajo a arriba en pasos de \(\hbar\), \(2l\) debe ser entero:</p>
<div class="eq key" data-name="Espectro del momento angular">\[\hat L^2|l,m\rangle=\hbar^2l(l+1)|l,m\rangle,\quad\hat L_z|l,m\rangle=\hbar m|l,m\rangle,\quad m=-l,-l+1,\dots,l\ \ (2l+1\text{ valores}),\quad l=0,\tfrac12,1,\tfrac32,\dots\]
\[\hat L_\pm|l,m\rangle=\hbar\sqrt{l(l+1)-m(m\pm1)}\;|l,m\pm1\rangle.\]</div>
<p>El álgebra admite \(l\) entero o semientero. Para el momento angular <em>orbital</em>, la función de onda debe ser unívoca al dar una vuelta completa (\(\phi\to\phi+2\pi\)), lo que fuerza \(m\) entero y por tanto \(l=0,1,2,\dots\) (letras \(s,p,d,f,g,\dots\) de la espectroscopía). Los valores semienteros son los del espín (capítulo 15). Un resultado clave: \(|\mathbf L|=\hbar\sqrt{l(l+1)}\gt\hbar l\): el momento angular nunca puede estar completamente alineado con el eje \(z\), pues entonces \(L_x\) y \(L_y\) quedarían ambas definidas e iguales a cero, en contra de la incertidumbre.</p>
</section>

<section>
<h2>Los armónicos esféricos</h2>
<p>En coordenadas esféricas, \(\hat L_z=-\ii\hbar\partial_\phi\) y \(\hat L^2=-\hbar^2\left[\dfrac1{\sin\theta}\partial_\theta(\sin\theta\,\partial_\theta)+\dfrac1{\sin^2\theta}\partial_\phi^2\right]\). La ecuación \(\hat L_z Y=\hbar mY\) da \(Y\propto e^{\ii m\phi}\); sustituyendo \(Y=\Theta(\theta)e^{\ii m\phi}\) en \(\hat L^2Y=\hbar^2l(l+1)Y\) y con \(x=\cos\theta\) se obtiene la ecuación asociada de Legendre, \((1-x^2)\Theta''-2x\Theta'+\left[l(l+1)-\tfrac{m^2}{1-x^2}\right]\Theta=0\), cuyas soluciones regulares en \(x=\pm1\) son las funciones de Legendre \(P_l^m(x)\). Normalizadas sobre la esfera:</p>
<div class="eq key" data-name="Armónicos esféricos">\[Y_l^m(\theta,\phi)=(-1)^{(m+|m|)/2}\sqrt{\frac{2l+1}{4\pi}\frac{(l-|m|)!}{(l+|m|)!}}\;P_l^{|m|}(\cos\theta)\,e^{\ii m\phi},\qquad \int Y_l^{m*}Y_{l'}^{m'}\,\dd\Omega=\delta_{ll'}\delta_{mm'},\qquad \hat\Pi Y_l^m=(-1)^lY_l^m.\]</div>
<p>Los primeros son \(Y_0^0=\tfrac1{\sqrt{4\pi}}\), \(Y_1^0=\sqrt{\tfrac3{4\pi}}\cos\theta\), \(Y_1^{\pm1}=\mp\sqrt{\tfrac3{8\pi}}\sin\theta\,e^{\pm\ii\phi}\), \(Y_2^0=\sqrt{\tfrac5{16\pi}}(3\cos^2\theta-1)\). \(Y_l^m\) tiene \(l-|m|\) nodos en \(\theta\) y \(|m|\) en \(\phi\) (\(l\) en total, superficies nodales cónicas y planos). La paridad (\(\mathbf r\to-\mathbf r\): \(\theta\to\pi-\theta\), \(\phi\to\phi+\pi\)) es \((-1)^l\). La suma \(\sum_{m=-l}^l|Y_l^m|^2=\tfrac{2l+1}{4\pi}\) no depende de la dirección: una subcapa completa es esféricamente simétrica (base de la regla de Hund y de la forma esférica de los gases nobles). Las combinaciones reales \(\mathrm{Re}\,Y\) son los orbitales «\(p_x\), \(d_{xy}\)…» que usa la química.</p>
<div class="sim" data-sim="armonicos" data-title="Armónicos esféricos en tres dimensiones"></div>
<div class="sim-guide"><ul>
<li>Con \(l=2\), \(m=1\): \(|\mathbf L|=\hbar\sqrt6=2.449\hbar\), \(L_z=\hbar\), \(\cos\theta=1/\sqrt6\) (65.9° con el eje). Con \(m=2\): 35.3°, y con \(m=0\): 90°. Ningún ángulo es 0: el vector no se alinea con \(z\).</li>
<li>Con \(l=1\), \(m=0\) en «\(|Y|^2\)»: dos lóbulos a lo largo de \(z\) (probabilidad de estar en el cono \(\theta\lt30^\circ\): 17.52 %, que es la mitad de \(1-\cos^330^\circ\)); con \(m=\pm1\): un toro alrededor del eje. En «Real» las dos fases del lóbulo tienen colores distintos (signo de \(Y\)).</li>
<li>Suba \(l\): aparecen \(l\) superficies nodales. Las formas con \(|m|=l\) se concentran en el ecuador (la órbita «clásica» perpendicular a \(z\)); las de \(m=0\), en los polos.</li>
</ul></div>
<div class="box ex"><h4>El momento angular \(l=2\): módulo y orientaciones</h4>
<p><strong>Procedimiento.</strong> (1) \(|\mathbf L|=\hbar\sqrt{l(l+1)}=\hbar\sqrt6=2.449\hbar\). (2) Proyecciones: \(m=2,1,0,-1,-2\) (cinco valores, \(2l+1\)). (3) Ángulos con el eje \(z\): \(\cos\theta=m/\sqrt6\): \(35.26^\circ\), \(65.91^\circ\), \(90^\circ\), \(114.09^\circ\), \(144.74^\circ\). (4) Las proyecciones en el plano: \(\langle L_x^2\rangle=\langle L_y^2\rangle=\tfrac12[l(l+1)-m^2]\hbar^2=\)3, 2.5 y 1 \(\hbar^2\) para \(m=0,\pm1,\pm2\).</p></div>
</section>

<section>
<h2>El modelo vectorial y la incertidumbre de las componentes</h2>
<p>El <span class="term">modelo vectorial</span> representa el estado \(|l,m\rangle\) como un vector de longitud \(\hbar\sqrt{l(l+1)}\) cuya proyección en \(z\) vale \(m\hbar\), pero con \(L_x\) y \(L_y\) completamente indeterminados: el vector está en cualquier punto de un cono alrededor de \(z\) (de ahí el movimiento de precesión del dibujo). Es una imagen, no una trayectoria. Los valores esperados son \(\langle L_x\rangle=\langle L_y\rangle=0\) y \(\langle L_x^2\rangle=\langle L_y^2\rangle=\tfrac12\hbar^2[l(l+1)-m^2]\) (porque \(\langle L^2\rangle=\langle L_x^2\rangle+\langle L_y^2\rangle+\langle L_z^2\rangle\) y la simetría respecto del eje \(z\)). Con eso, la desigualdad de Robertson para \(L_x\) y \(L_y\) es</p>
<div class="eq">\[\Delta L_x\,\Delta L_y=\tfrac12\hbar^2\left[l(l+1)-m^2\right]\ \ge\ \tfrac12\left|\langle[\hat L_x,\hat L_y]\rangle\right|=\tfrac12\hbar\,|\langle\hat L_z\rangle|=\tfrac12\hbar^2|m|,\]</div>
<p>con <em>igualdad</em> solo para \(m=\pm l\) (entonces \(l(l+1)-l^2=l\) y ambos lados valen \(\tfrac12l\hbar^2\)): son los estados de momento angular máximo en \(z\), los más «clásicos» (la órbita casi en el plano \(xy\)). En el límite \(l\to\infty\), \(|\mathbf L|/(l\hbar)\to1\) y la dispersión relativa \(\Delta L_x/|\mathbf L|\to0\): se recupera el vector clásico.</p>
<div class="sim" data-sim="vectorial" data-title="Modelo vectorial: conos de los 2l + 1 valores de m y la incertidumbre de Lₓ y L_y"></div>
<div class="sim-guide"><ul>
<li>Con \(l=2\), \(m=1\): \(|\mathbf L|^2=6\hbar^2\), \(\langle L_x^2\rangle=2.5\hbar^2\), \(\Delta L_x=1.581\hbar\) y el producto \(\Delta L_x\Delta L_y=2.5\hbar^2\) es cinco veces la cota \(0.5\hbar^2\).</li>
<li>Con \(l=3\), \(m=3\): \(\langle L_x^2\rangle=1.5\hbar^2\) y el producto vale exactamente la cota \(1.5\hbar^2\) (estado de incertidumbre mínima). Con \(l=3\), \(m=0\) el cociente a la cota es infinito (la cota se anula) pero el producto vale 6 \(\hbar^2\).</li>
<li>Suba \(l\) con \(m=l\): \(|\mathbf L|/(l\hbar)=\sqrt{(l+1)/l}\) baja hacia 1 (1.2247 para \(l=2\); 1.0408 para \(l=12\)).</li>
</ul></div>
</section>

<section>
<h2>El rotor rígido</h2>
<p>Una molécula diatómica que gira como una mancuerna rígida de momento de inercia \(I=\mu r_e^2\) tiene \(\hat H=\hat L^2/2I\), y sus estados son los \(Y_l^m\):</p>
<div class="eq key" data-name="Rotor rígido">\[E_l=\frac{\hbar^2}{2I}\,l(l+1)=hcB\,l(l+1),\qquad B=\frac{\hbar}{4\pi cI},\qquad g_l=2l+1,\qquad \nu_{l\to l+1}=2B(l+1)\ \ (\Delta l=\pm1).\]</div>
<p>De la separación de las líneas de absorción de microondas, \(2B\), se obtiene \(I\) y la longitud del enlace con una precisión mucho mayor que cualquier otra técnica. Como \(E_l\propto l(l+1)\) y \(l(l+1)\) es siempre par, las fases \(e^{-\ii E_lt/\hbar}\) son múltiplos de una sola, y un paquete de estados rotacionales es exactamente periódico con el <span class="term">tiempo de renacimiento</span> \(T_\text{ren}=\pi\hbar/(hcB)=1/(2cB)\) (con \(B\) en cm⁻¹ y \(c\) en cm/s): igual que la caja (capítulo 6). Un pulso láser corto crea un paquete de estados rotacionales pares en el que las moléculas se orientan, durante un instante, a lo largo del eje de polarización: es el <em>alineamiento molecular impulsivo</em> (Rosca-Pruna y Vrakking, 2001; Stapelfeldt y Seideman, 2003) y se repite en cada renacimiento. La medida es el valor esperado \(\langle\cos^2\theta\rangle\), que vale \(1/3\) para orientación al azar y 1 en alineamiento perfecto.</p>
<div class="box ex"><h4>El CO: del espectro de microondas a su estructura</h4>
<p><strong>Datos.</strong> \(B=1.9313\) cm⁻¹, \(\mu=6.8562\) u. <strong>Procedimiento.</strong> (1) \(I=\hbar/(4\pi cB)=1.0546\times10^{-34}/(4\pi\times2.9979\times10^{10}\times1.9313)=1.4494\times10^{-46}\) kg·m². (2) \(r_e=\sqrt{I/\mu}=\sqrt{1.4494\times10^{-46}/(6.8562\times1.6605\times10^{-27})}=1.1283\) Å. (3) Línea \(0\to1\): \(2B=3.863\) cm⁻¹ \(=115.80\) GHz, la que usan los radiotelescopios para mapear el gas molecular. (4) Tiempo de renacimiento: \(1/(2cB)=8.636\) ps. <strong>Resultado.</strong> \(r_e=1.1283\) Å con cinco cifras; para el HCl, \(B=10.5934\) cm⁻¹ da \(r_e=1.2746\) Å y \(T_\text{ren}=1.574\) ps.</p></div>
<div class="sim" data-sim="rotor-paquete" data-title="Rotor rígido: paquete de estados rotacionales, alineamiento y renacimientos"></div>
<div class="sim-guide"><ul>
<li>Con CO, \(l_0=8\), \(\sigma=2\): \(\langle\cos^2\theta\rangle\) oscila entre 0.059 (moléculas perpendiculares al eje) y 0.945 (alineadas), con el periodo de renacimiento de 8.636 ps; la lectura marca el instante actual y el diagrama polar de la derecha muestra la distribución angular \(|\Psi(\theta)|^2\), que pasa de dos lóbulos estrechos a un disco.</li>
<li>Con \(l_0=4\), \(\sigma=1.5\) el contraste es menor (0.917 a 0.096): menos estados mezclados. Cambie a HCl: \(T_\text{ren}\) baja a 1.574 ps (\(B\) mayor) y \(2B=21.19\) cm⁻¹ (635 GHz).</li>
<li>Un paquete formado solo por estados de \(l\) par tiene simetría de inversión: la molécula no se «orienta» (cabeza/cola), solo se «alinea» (eje); por eso \(\langle\cos\theta\rangle=0\) y solo se sigue \(\langle\cos^2\theta\rangle\).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Para \(l=3\) liste los valores posibles de \(L_z\), el módulo \(|\mathbf L|\) y los ángulos entre \(\mathbf L\) y el eje \(z\). ¿Cuál es el ángulo mínimo posible?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Módulo.</b> \(|\mathbf L|=\hbar\sqrt{3\cdot4}=\hbar\sqrt{12}=3.4641\hbar\).</li>
<li><b>Proyecciones.</b> \(L_z=m\hbar\), \(m=-3,\dots,3\): siete valores (\(2l+1=7\)).</li>
<li><b>Ángulos.</b> \(\cos\theta=m/\sqrt{12}\): \(m=3\): \(\theta=\arccos0.8660=30.00^\circ\); \(m=2\): \(54.74^\circ\); \(m=1\): \(73.22^\circ\); \(m=0\): \(90^\circ\); y los suplementarios.</li>
<li><b>Mínimo.</b> El menor ángulo es \(30^\circ\), no cero: \(|L_z|_\text{máx}=3\hbar\lt|\mathbf L|=3.46\hbar\).</li>
<li><b>Resultado.</b> <span class="ans">\(|\mathbf L|=3.464\hbar\); \(m=-3..3\); ángulo mínimo 30.0°.</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Demuestre que \([\hat L_x,\hat L_y]=\ii\hbar\hat L_z\) a partir de \([\hat x,\hat p_x]=\ii\hbar\), y que \(\hat L_z\) conmuta con \(\hat L^2\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Desarrollo.</b> \([\hat L_x,\hat L_y]=[\hat y\hat p_z,\hat z\hat p_x]-[\hat y\hat p_z,\hat x\hat p_z]-[\hat z\hat p_y,\hat z\hat p_x]+[\hat z\hat p_y,\hat x\hat p_z]\).</li>
<li><b>Término por término.</b> \([\hat y\hat p_z,\hat z\hat p_x]=\hat y[\hat p_z,\hat z]\hat p_x=-\ii\hbar\hat y\hat p_x\). Los términos 2 y 3 son nulos: operadores sobre coordenadas y momentos distintos conmutan. \([\hat z\hat p_y,\hat x\hat p_z]=\hat p_y[\hat z,\hat p_z]\hat x=\ii\hbar\hat x\hat p_y\).</li>
<li><b>Suma.</b> \([\hat L_x,\hat L_y]=\ii\hbar(\hat x\hat p_y-\hat y\hat p_x)=\ii\hbar\hat L_z\).</li>
<li><b>Con \(\hat L^2\).</b> \([\hat L_z,\hat L_x^2]=\hat L_x[\hat L_z,\hat L_x]+[\hat L_z,\hat L_x]\hat L_x=\ii\hbar(\hat L_x\hat L_y+\hat L_y\hat L_x)\) y \([\hat L_z,\hat L_y^2]=-\ii\hbar(\hat L_y\hat L_x+\hat L_x\hat L_y)\). Suman cero, y \([\hat L_z,\hat L_z^2]=0\).</li>
<li><b>Resultado.</b> <span class="ans">\([\hat L_x,\hat L_y]=\ii\hbar\hat L_z\); \([\hat L^2,\hat L_z]=0\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Para \(l=2\), calcule \(\hat L_+|2,1\rangle\), \(\hat L_-|2,1\rangle\), \(\langle L_x^2\rangle\) y \(\langle L_x^2\rangle+\langle L_y^2\rangle\) en \(|2,1\rangle\), y verifique con \(\hat L^2\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Coeficientes.</b> \(\hat L_\pm|l,m\rangle=\hbar\sqrt{l(l+1)-m(m\pm1)}|l,m\pm1\rangle\). Con \(l=2\), \(m=1\): \(\hat L_+\): \(\sqrt{6-1\cdot2}=2\): \(\hat L_+|2,1\rangle=2\hbar|2,2\rangle\). \(\hat L_-\): \(\sqrt{6-1\cdot0}=\sqrt6\): \(\hat L_-|2,1\rangle=\sqrt6\hbar|2,0\rangle\).</li>
<li><b>\(\hat L_x\).</b> \(\hat L_x=\tfrac12(\hat L_++\hat L_-)\), de modo que \(\hat L_x|2,1\rangle=\hbar|2,2\rangle+\tfrac{\sqrt6}2\hbar|2,0\rangle\) y \(\langle L_x^2\rangle=\|\hat L_x|2,1\rangle\|^2=\hbar^2\left(1+\tfrac64\right)=2.5\hbar^2\).</li>
<li><b>\(\langle L_y^2\rangle\).</b> Análogo con \(\hat L_y=\tfrac1{2\ii}(\hat L_+-\hat L_-)\): también 2.5\(\hbar^2\).</li>
<li><b>Comprobación.</b> \(\langle L_x^2\rangle+\langle L_y^2\rangle=5\hbar^2=\langle\hat L^2\rangle-\langle L_z^2\rangle=6\hbar^2-1\hbar^2\) ✓.</li>
<li><b>Resultado.</b> <span class="ans">\(\hat L_+|2,1\rangle=2\hbar|2,2\rangle\); \(\hat L_-|2,1\rangle=\sqrt6\hbar|2,0\rangle\); \(\langle L_x^2\rangle=\langle L_y^2\rangle=2.5\hbar^2\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Halle \(Y_1^1\) imponiendo \(L_+Y_1^1=0\) y normalizando; obtenga \(Y_1^0\) con el operador de bajada y calcule la probabilidad de hallar la dirección en \(	heta\lt30^\circ\) para \(Y_1^0\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Condición.</b> \(\hat L_+=\hbar e^{\ii\phi}(\partial_\theta+\ii\cot\theta\,\partial_\phi)\). Con \(Y=\Theta(\theta)e^{\ii\phi}\) (\(m=1\)): \(\Theta'-\cot\theta\,\Theta=0\Rightarrow\Theta=C\sin\theta\).</li>
<li><b>Normalización.</b> \(1=|C|^2\int_0^{2\pi}\dd\phi\int_0^\pi\sin^2\theta\sin\theta\dd\theta=|C|^2\cdot2\pi\cdot\tfrac43\Rightarrow|C|=\sqrt{3/8\pi}\). Con la convención de fase de Condon–Shortley, \(Y_1^1=-\sqrt{3/8\pi}\sin\theta\,e^{\ii\phi}\).</li>
<li><b>\(Y_1^0\).</b> \(\hat L_-Y_1^1=\hbar\sqrt2\,Y_1^0\), con \(\hat L_-=\hbar e^{-\ii\phi}(-\partial_\theta+\ii\cot\theta\,\partial_\phi)\): \(Y_1^0=\sqrt{3/4\pi}\cos\theta\).</li>
<li><b>Probabilidad en el cono.</b> \(P=\int|Y_1^0|^2\dd\Omega=\tfrac3{4\pi}\cdot2\pi\int_{\cos30^\circ}^1x^2\dd x=\tfrac32\cdot\tfrac{1-\cos^330^\circ}{3}=\tfrac{1-0.6495}2=0.1752\).</li>
<li><b>Resultado.</b> <span class="ans">\(Y_1^1=-\sqrt{3/8\pi}\sin\theta\,e^{\ii\phi}\); \(P(\theta\lt30^\circ)=17.52\ \%\) para \(Y_1^0\).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Con \(B=1.9313\) cm⁻¹ y \(\mu=6.8562\) u para el CO calcule \(I\), \(r_e\), la energía y frecuencia de \(0\to1\), la población relativa de \(l=7\) a 298 K, y el tiempo de renacimiento.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Momento de inercia.</b> \(I=\dfrac{\hbar}{4\pi cB}=\dfrac{1.05457\times10^{-34}}{4\pi(2.99792\times10^{10})(1.9313)}=1.4494\times10^{-46}\) kg·m².</li>
<li><b>Longitud.</b> \(\mu=6.8562\times1.66054\times10^{-27}=1.13851\times10^{-26}\) kg; \(r_e=\sqrt{I/\mu}=1.1283\) Å.</li>
<li><b>Transición.</b> \(\Delta E=2hcB=2\times1.9313=3.8626\) cm⁻¹ \(=4.789\times10^{-4}\) eV; \(\nu=c\times3.8626\ \text{cm}^{-1}=115.80\) GHz.</li>
<li><b>Población.</b> \(N_l\propto(2l+1)e^{-hcBl(l+1)/k_BT}\). A 298.15 K, \(k_BT/hc=207.22\) cm⁻¹. Para \(l=7\): \(15\,e^{-1.9313\times56/207.22}=15\,e^{-0.5219}=8.90\); la función de partición es \(q\approx k_BT/hcB+1/3=107.63\): fracción \(8.90/107.63=0.0827\) (8.3 %); es el nivel más poblado (8.2 % para \(l=6\) y 8.1 % para \(l=8\)).</li>
<li><b>Renacimiento.</b> \(T=1/(2cB)=1/(2\times2.99792\times10^{10}\times1.9313)=8.636\) ps.</li>
<li><b>Resultado.</b> <span class="ans">\(I=1.449\times10^{-46}\) kg·m²; \(r_e=1.1283\) Å; 115.8 GHz; \(P(l=7)=8.3\ \%\); \(T_\text{ren}=8.64\) ps.</span></li>
</ol></details></li>
