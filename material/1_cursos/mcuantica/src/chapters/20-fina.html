<template class="chapter-src" data-id="fina" data-num="20" data-title="Estructura fina e hiperfina" data-part="Parte IV · Métodos de aproximación" data-short="Correcciones relativistas del hidrógeno de orden α²: energía cinética, espín–órbita y Darwin; fórmula de Dirac y desplazamiento de Lamb; estructura hiperfina, la línea de 21 cm y el diagrama de Breit–Rabi">
<p class="lead">La ecuación de Schrödinger del capítulo 14 da niveles que dependen solo de \(n\), con \(n^2\) estados degenerados. Los espectros reales muestran que esas líneas son multipletes: la línea \(\mathrm H\alpha\) tiene una estructura fina de unos 14 GHz de ancho y cada nivel tiene una estructura hiperfina aún más fina. La escala de estas correcciones se ve de una sola vez: es \(\alpha^2\approx5.3\times10^{-5}\) veces la energía de Bohr, y la teoría de perturbaciones del capítulo 19 las calcula con una exactitud sorprendente.</p>

<section>
<h2>Las tres correcciones de orden \(\alpha^2\)</h2>
<p>Para el electrón del hidrógeno, \(v/c\sim\alpha\approx1/137\). El hamiltoniano de Dirac (capítulo 37), expandido en potencias de \(1/c\), añade a \(H_0=p^2/2m+V\) tres términos del orden \(\alpha^2\) respecto de \(H_0\):</p>
<ul>
<li><b>Energía cinética relativista</b> (de \(\sqrt{p^2c^2+m^2c^4}\)): \(H_\text{cin}=-\dfrac{p^4}{8m^3c^2}\). Reduce la energía y lo hace más para los estados \(s\), que penetran más cerca del núcleo (donde la velocidad es mayor).</li>
<li><b>Espín–órbita</b>: en el sistema de reposo del electrón, el protón en órbita crea un campo magnético \(\mathbf B\) que actúa sobre el momento magnético del espín, \(H_{SO}=\dfrac1{2m^2c^2}\dfrac1r\dfrac{\dd V}{\dd r}\,\mathbf L\cdot\mathbf S\) (el factor \(\tfrac12\) es la precesión de Thomas). Es nulo para \(l=0\) y separa los dos valores de \(j=l\pm\tfrac12\) (capítulo 16).</li>
<li><b>Término de Darwin</b>: \(H_D=\dfrac{\pi\hbar^2}{2m^2c^2}\,Ze^2/(4\pi\varepsilon_0)\,\delta^3(\mathbf r)\), una corrección por el «temblor» del electrón (<em>zitterbewegung</em>) en una longitud de Compton; solo afecta a los estados \(s\), con \(\psi(0)\neq0\).</li>
</ul>
<p>Como \(H_0\) conmuta con \(L^2\) y \(J^2\) y la perturbación también, no hay problema de degeneración: los buenos estados son los acoplados \(|n\,l\,j\,m_j\rangle\) del capítulo 16, y la corrección de primer orden de cada término se calcula con las integrales \(\langle r^{-3}\rangle=\tfrac1{n^3l(l+\frac12)(l+1)}\), \(\langle r^{-2}\rangle\) y \(\langle r^{-1}\rangle\) del capítulo 14. En unidades atómicas (energías en hartree):</p>
<div class="eq">\[E_\text{cin}=-\frac{Z^4\alpha^2}{2n^4}\left(\frac n{l+\frac12}-\frac34\right),\quad E_{SO}=\frac{Z^4\alpha^2}{2n^3}\frac{j(j+1)-l(l+1)-\frac34}{2l(l+\frac12)(l+1)}\ (l\ge1),\quad E_D=\frac{Z^4\alpha^2}{2n^3}\,\delta_{l0}.\]</div>
<p>La suma de las tres tiene una forma notablemente simple, que depende de \(l\) solo a través de \(j\):</p>
<div class="eq key" data-name="Estructura fina del hidrógeno">\[E_{nj}=-\frac{Z^2}{2n^2}-\frac{Z^4\alpha^2}{2n^4}\left(\frac n{j+\frac12}-\frac34\right)\quad\text{(hartree)},\qquad\Delta E_{\text{fina}}(2p_{3/2}-2p_{1/2})=\frac{\alpha^2}{32}\ \text{hartree}=10.949\ \text{GHz}.\]</div>
<p>La fórmula coincide con el desarrollo en \(\alpha\) de la energía exacta de Dirac (que vale para todo \(Z\alpha\lt1\)), \(E=mc^2\left[1+\dfrac{(Z\alpha)^2}{(n-\delta)^2}\right]^{-1/2}\) con \(\delta=j+\tfrac12-\sqrt{(j+\tfrac12)^2-(Z\alpha)^2}\). La estructura fina crece como \(Z^4\) (los iones muy cargados la tienen enorme) y decrece como \(n^{-3}\). Los niveles de igual \(n\) y \(j\) siguen siendo degenerados: \(2s_{1/2}\) y \(2p_{1/2}\) coinciden en la teoría de Dirac. Pero en 1947 Lamb y Retherford midieron que \(2s_{1/2}\) está <em>por encima</em> de \(2p_{1/2}\) en 1057.845 MHz: el <strong>desplazamiento de Lamb</strong>, debido a la interacción del electrón con las fluctuaciones del vacío electromagnético, explicada por Bethe esa misma semana y base de la electrodinámica cuántica moderna.</p>
<div class="sim" data-sim="fina-niveles" data-title="Estructura fina de un nivel n: contribuciones cinética, espín–órbita y Darwin"></div>
<div class="sim-guide"><ul>
<li>Con \(n=2\), \(Z=1\): los niveles \(2s_{1/2}\) y \(2p_{1/2}\) coinciden en \(-56.60\) µeV (respecto de Bohr) y el \(2p_{3/2}\) está en \(-11.32\) µeV: la separación es de 45.3 µeV \(=10.95\) GHz \(=0.3652\) cm\(^{-1}\). La contribución cinética (\(-26.4\) µeV en \(2p\), \(-147.2\) µeV en \(2s\)) es negativa para todos; la espín–órbita separa \(2p_{1/2}\) (\(-30.2\) µeV) de \(2p_{3/2}\) (\(+15.1\) µeV); y la de Darwin (\(+90.6\) µeV) solo afecta a \(2s\).</li>
<li>Con \(Z=10\) la separación del \(n=2\) es \(10^4\) veces mayor (109.5 THz): crece como \(Z^4\), mientras que la energía de Bohr crece como \(Z^2\), de modo que la corrección relativa es \((Z\alpha)^2\). En el caso \(Z=1\), \(n=1\): \(E_{1s}=-\alpha^2/8\) hartree \(=-181.1\) µeV, una fracción \(\alpha^2/4=1.33\times10^{-5}\) de la energía de Bohr.</li>
</ul></div>
</section>

<section>
<h2>Estructura hiperfina y la línea de 21 cm</h2>
<p>El protón tiene espín \(I=\tfrac12\) y momento magnético \(\boldsymbol\mu_p=g_p\mu_N\mathbf I/\hbar\) con \(g_p=5.5857\) y \(\mu_N=\mu_B\,m_e/m_p\). El electrón del orbital \(1s\) (que tiene densidad no nula en el núcleo) interactúa con él por el <em>contacto de Fermi</em>, \(H_{hf}=A\,\mathbf I\cdot\mathbf S/\hbar^2\) cuya energía es \(\Delta E=\tfrac23\mu_0\,g_s\mu_B\,g_p\mu_N\,|\psi_{1s}(0)|^2\). El resultado es el desdoblamiento del 1s en dos niveles, \(F=I+S=1\) (triplete) y \(F=0\) (singlete), por la regla de adición del capítulo 16:</p>
<div class="eq key" data-name="Desdoblamiento hiperfino del 1s">\[\Delta E_{hf}=E_{F=1}-E_{F=0}=\tfrac43\,g_p\frac{m_e}{m_p}\,\alpha^4m_ec^2=5.877\ \mu\text{eV}\ \ (\text{medido: }5.874\,326\ \mu\text{eV}=h\times1420.405\,751\,768\ \text{MHz}),\qquad\lambda=21.106\ \text{cm}.\]</div>
<p>La pequeña diferencia entre 5.877 y 5.874 µeV proviene de la masa reducida y del momento anómalo del electrón. Aunque es una transición prohibida por el dipolo eléctrico y su vida media es de 11 millones de años, la línea de 21 cm es la señal más importante de la radioastronomía: delata el hidrógeno neutro de las galaxias, su velocidad (efecto Doppler) y su temperatura; con el máser de hidrógeno es un patrón de frecuencia con una estabilidad de \(10^{-15}\).</p>
<p>En un campo magnético \(B\) el hamiltoniano es \(H=A\,\mathbf S\cdot\mathbf I+g_s\mu_BB\,S_z-g_p\mu_NB\,I_z\) y se resuelve exactamente: los estados estirados \(|\!\uparrow\Uparrow\rangle\) y \(|\!\downarrow\Downarrow\rangle\) (\(m_F=\pm1\)) son propios con \(E=\tfrac A4\pm\tfrac12(b_e-b_p)\) (\(b_e=g_s\mu_BB\), \(b_p=g_p\mu_NB\)), y los de \(m_F=0\) forman un bloque \(2\times2\) con \(E=-\tfrac A4\pm\sqrt{\tfrac{A^2}4+\tfrac{(b_e+b_p)^2}4}\): es la <span class="term">fórmula de Breit–Rabi</span>. A campo débil los niveles son rectas con las pendientes de Landé (\(g_F=\pm\tfrac12g_s\)) y a campo fuerte pasan al régimen de Paschen–Back, donde \(S_z\) y \(I_z\) se desacoplan.</p>
<div class="sim" data-sim="hiperfino-h" data-title="Diagrama de Breit–Rabi del 1s del hidrógeno"></div>
<div class="sim-guide"><ul>
<li>Con \(B=0.05\) T: \(E/h=+1054.66,\ +643.27,\ -344.46,\ -1353.48\) MHz para \(|1,+1\rangle\), \(|1,0\rangle\), \(|1,-1\rangle\) y \(|0,0\rangle\); el cociente \(x=(g_s\mu_B+g_p\mu_N)B/\Delta E=0.988\) indica el régimen intermedio. La frecuencia \(|1,0\rangle\to|0,0\rangle\) ya vale 1996.75 MHz (frente a 1420.41 MHz sin campo).</li>
<li>Los niveles \(m_F=\pm1\) son rectas exactas (energías lineales en \(B\)); los de \(m_F=0\) son hipérbolas que se curvan para \(B\gtrsim\Delta E/\mu_B\approx0.05\) T. En el límite \(B\to0\) los tres del triplete convergen a \(+\tfrac A4\) y el singlete a \(-\tfrac{3A}4\) (\(\pm\)355.10 y \(-1065.30\) MHz).</li>
</ul></div>
</section>

<section>
<h2>Las líneas del espectro: Hα</h2>
<p>La línea \(\mathrm H\alpha\) (\(n=3\to2\)) tiene \(3\times2\) combinaciones \(l\to l'\), de las cuales las reglas de selección \(\Delta l=\pm1\), \(\Delta j=0,\pm1\) (capítulo 18) permiten siete: \(3s_{1/2}\to2p_{1/2},2p_{3/2}\); \(3p_{1/2}\to2s_{1/2}\); \(3p_{3/2}\to2s_{1/2}\); \(3d_{3/2}\to2p_{1/2},2p_{3/2}\); \(3d_{5/2}\to2p_{3/2}\). Como los niveles de Dirac solo dependen de \(n\) y \(j\), siete líneas se reducen a cinco frecuencias distintas; el desplazamiento de Lamb las separa de nuevo en siete. El ancho total de la estructura es de unos 14 GHz, mientras que la anchura Doppler de \(\mathrm H\alpha\) a 300 K es de 5.6 GHz (FWHM): a temperatura ambiente la estructura apenas se insinúa, y para resolverla hace falta espectroscopía sin Doppler (absorción saturada, dos fotones), con la que se midió la constante de Rydberg y el radio del protón.</p>
<div class="sim" data-sim="halfa-fina" data-title="Hα: las componentes de estructura fina y el efecto del desplazamiento de Lamb"></div>
<div class="sim-guide"><ul>
<li>Sin Lamb: los desplazamientos respecto de la línea de Bohr (GHz) son \(8.821\) (dos transiciones coincidentes: \(3s_{1/2}\to2p_{1/2}\) y \(3p_{1/2}\to2s_{1/2}\)), \(-2.129\), \(12.065\) (dos coincidentes) y \(1.115\), \(2.197\). La componente más intensa \(3d_{5/2}\to2p_{3/2}\) está en \(+2.197\) GHz.</li>
<li>Con Lamb: las líneas que terminan o empiezan en un nivel \(s\) se desplazan unos 1.06 GHz (\(2s\)) y 0.31 GHz (\(3s\)): se rompe la coincidencia y aparecen las siete componentes. La longitud de onda central es 656.470 nm (con la masa reducida).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule la separación de estructura fina \(2p_{3/2}-2p_{1/2}\) del hidrógeno en eV, GHz y cm\(^{-1}\), y la longitud de onda de la radiación que la excitaría. Use \(\alpha=1/137.036\), \(E_h=27.2114\) eV.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Fórmula.</b> \(E_{nj}=-\tfrac{\alpha^2}{2n^4}\left(\tfrac n{j+\frac12}-\tfrac34\right)\): \(n=2\): \(j=\tfrac12\): \(-\tfrac{\alpha^2}{32}\left(2-\tfrac34\right)\); \(j=\tfrac32\): \(-\tfrac{\alpha^2}{32}\left(1-\tfrac34\right)\).</li>
<li><b>Diferencia.</b> \(\dfrac{\alpha^2}{32}\left(1.25-0.25\right)=\dfrac{\alpha^2}{32}\) hartree \(=\dfrac{5.3251\times10^{-5}}{32}=1.6641\times10^{-6}\) hartree.</li>
<li><b>Energía.</b> \(1.6641\times10^{-6}\times27.2114=4.528\times10^{-5}\) eV \(=45.28\ \mu\)eV.</li>
<li><b>Frecuencia.</b> \(1.6641\times10^{-6}\times6.5797\times10^{6}\) GHz \(=10.949\) GHz; número de ondas \(10.949/29.9792=0.3652\) cm\(^{-1}\).</li>
<li><b>Longitud de onda.</b> \(\lambda=c/\nu=\dfrac{29.9792\ \text{GHz·cm}}{10.949\ \text{GHz}}=2.738\) cm (microondas).</li>
<li><b>Resultado.</b> <span class="ans">\(45.28\ \mu\)eV; 10.949 GHz; 0.3652 cm\(^{-1}\); \(\lambda=2.738\) cm. (La medida, 10.969 GHz, difiere en 0.2 % por correcciones de QED.)</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>¿Qué fracción de la energía de Bohr es la corrección de estructura fina del estado fundamental? Calcule la corrección en µeV y compárela con la escala de \(E_1=-13.6\) eV.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Corrección.</b> \(n=1\), \(j=\tfrac12\): \(E^{(1)}=-\tfrac{\alpha^2}{2}\left(\tfrac1{1}-\tfrac34\right)=-\dfrac{\alpha^2}8\) hartree.</li>
<li><b>Valor.</b> \(-\dfrac{5.3251\times10^{-5}}{8}=-6.6564\times10^{-6}\) hartree \(=-181.13\ \mu\)eV \(=-0.1811\) meV.</li>
<li><b>Fracción.</b> \(E^{(1)}/E_1=\dfrac{-\alpha^2/8}{-1/2}=\dfrac{\alpha^2}4=1.331\times10^{-5}\).</li>
<li><b>Resultado.</b> <span class="ans">\(-181.1\ \mu\)eV, \(1.33\times10^{-5}\) de la energía de Bohr: el nivel baja.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Calcule las contribuciones cinética, espín–órbita y de Darwin de los niveles \(2p_{3/2}\), \(2p_{1/2}\) y \(2s_{1/2}\), y compruebe que su suma coincide con la fórmula general. Use \(\alpha^2E_h=1449.04\ \mu\)eV.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>\(2p_{3/2}\) (n=2, l=1, j=3/2).</b> Cinética: \(-\tfrac{\alpha^2}{32}\left(\tfrac2{1.5}-\tfrac34\right)=-0.018229\,\alpha^2E_h=-26.41\ \mu\)eV. Espín–órbita: \(\tfrac{\alpha^2}{16}\cdot\tfrac{3.75-2-0.75}{2\cdot1\cdot1.5\cdot2}=\tfrac{\alpha^2}{16}\cdot\tfrac16=0.010417\,\alpha^2E_h=+15.09\ \mu\)eV. Suma: \(-11.32\ \mu\)eV.</li>
<li><b>\(2p_{1/2}\).</b> Cinética: igual, \(-26.41\ \mu\)eV. Espín–órbita: \(j(j+1)=0.75\): \(\tfrac{\alpha^2}{16}\cdot\tfrac{0.75-2-0.75}{6}=-\tfrac{\alpha^2}{16}\cdot\tfrac13\Rightarrow-30.19\ \mu\)eV. Suma: \(-56.60\ \mu\)eV.</li>
<li><b>\(2s_{1/2}\).</b> Cinética: \(-\tfrac{\alpha^2}{32}\left(\tfrac2{0.5}-\tfrac34\right)=-\tfrac{3.25\alpha^2}{32}=-147.17\ \mu\)eV. Espín–órbita: 0. Darwin: \(\tfrac{\alpha^2}{16}=+90.57\ \mu\)eV. Suma: \(-56.60\ \mu\)eV.</li>
<li><b>Comprobación con la fórmula.</b> \(-\tfrac{\alpha^2}{32}\left(\tfrac2{j+\frac12}-\tfrac34\right)\): \(j=\tfrac32\): \(-\tfrac{0.25}{32}\alpha^2E_h=-11.32\ \mu\)eV ✓; \(j=\tfrac12\): \(-\tfrac{1.25}{32}\alpha^2E_h=-56.60\ \mu\)eV ✓ (para \(2s_{1/2}\) y \(2p_{1/2}\)).</li>
<li><b>Resultado.</b> <span class="ans">\(2p_{3/2}\): \(-26.41+15.09=-11.32\ \mu\)eV; \(2p_{1/2}\): \(-26.41-30.19=-56.60\ \mu\)eV; \(2s_{1/2}\): \(-147.17+90.57=-56.60\ \mu\)eV (degenerado con \(2p_{1/2}\)).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Para la línea de 21 cm: \(\nu=1420.405752\) MHz. Calcule \(\Delta E\) en µeV, \(\lambda\), la temperatura equivalente \(h\nu/k_B\) y compare con la fórmula de Fermi.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Energía.</b> \(\Delta E=h\nu=4.135668\times10^{-15}\ \text{eV·s}\times1.420406\times10^9\ \text{Hz}=5.8743\times10^{-6}\) eV \(=5.874\ \mu\)eV.</li>
<li><b>Longitud de onda.</b> \(\lambda=c/\nu=\dfrac{2.99792\times10^{10}\ \text{cm/s}}{1.420406\times10^9\ \text{Hz}}=21.106\) cm.</li>
<li><b>Temperatura.</b> \(T=\dfrac{\Delta E}{k_B}=\dfrac{5.8743\times10^{-6}}{8.6173\times10^{-5}}=0.06817\) K \(=68.2\) mK: el contraste entre estados es notable incluso en el fondo cósmico (2.7 K, que ya los puebla casi estadísticamente: \(g_1/g_0=3\)).</li>
<li><b>Fórmula de Fermi.</b> \(\tfrac43\times5.5857\times\tfrac1{1836.153}\times\alpha^4\times510998.95\ \text{eV}=5.877\ \mu\)eV, una diferencia de 0.05 % con la medida (masa reducida y \(g_e-2\)).</li>
<li><b>Resultado.</b> <span class="ans">\(\Delta E=5.874\ \mu\)eV; \(\lambda=21.106\) cm; \(T=68.2\) mK; Fermi: 5.877 µeV.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Deduzca las energías de Breit–Rabi del 1s del hidrógeno para \(m_F=\pm1\) y \(m_F=0\), y calcúlelas con \(B=0.05\) T (\(\nu_{hf}=1420.4058\) MHz, \(g_s\mu_B/h=28.0249\) GHz/T, \(g_p\mu_N/h=42.577\) MHz/T).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Hamiltoniano.</b> \(H=A\,\mathbf S\cdot\mathbf I+b_eS_z-b_pI_z\) con \(A=h\nu_{hf}\), \(b_e=g_s\mu_BB\), \(b_p=g_p\mu_NB\) (el signo \(-\) viene de que \(\boldsymbol\mu_p\parallel\mathbf I\) y \(\boldsymbol\mu_e\parallel-\mathbf S\)).</li>
<li><b>Estados estirados.</b> \(|\!\uparrow\Uparrow\rangle\): \(\mathbf S\cdot\mathbf I=\tfrac14\), \(S_z=I_z=\tfrac12\): \(E=\tfrac A4+\tfrac{b_e-b_p}2\). Igual con \(\downarrow\Downarrow\): \(E=\tfrac A4-\tfrac{b_e-b_p}2\).</li>
<li><b>Bloque \(m_F=0\).</b> Base \((\uparrow\Downarrow,\downarrow\Uparrow)\): \(\mathbf S\cdot\mathbf I=S_zI_z+\tfrac12(S_+I_-+S_-I_+)\): diagonal \(-\tfrac14\), fuera de la diagonal \(\tfrac12\): matriz \(\begin{pmatrix}-\tfrac A4+\tfrac{b_e+b_p}2&\tfrac A2\\\tfrac A2&-\tfrac A4-\tfrac{b_e+b_p}2\end{pmatrix}\), con autovalores \(-\tfrac A4\pm\sqrt{\tfrac{A^2}4+\tfrac{(b_e+b_p)^2}4}\).</li>
<li><b>Valores (MHz).</b> \(b_e=1401.25\), \(b_p=2.129\), \(A=1420.406\): \(\tfrac A4=355.10\); \(E_{+1}=355.10+\tfrac{1401.25-2.13}2=1054.66\); \(E_{-1}=355.10-699.56=-344.46\); raíz: \(\sqrt{710.20^2+701.69^2}=998.38\ \Rightarrow\) \(-355.10\pm998.27=643.27,\ -1353.48\).</li>
<li><b>Transición.</b> \(|1,0\rangle\to|0,0\rangle\): \(643.27+1353.48=1996.75\) MHz.</li>
<li><b>Resultado.</b> <span class="ans">\(1054.66,\ 643.27,\ -344.46,\ -1353.48\) MHz (\(m_F=+1,\,0_{hi},\,-1,\,0_{lo}\)); la línea \(0\to0\) sube a 1996.75 MHz.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Calcule las siete componentes de \(\mathrm H\alpha\) con la fórmula de estructura fina (sin Lamb), indique cuántas frecuencias distintas hay y compare su ancho con el ensanchamiento Doppler a 300 K.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Energías (en \(\alpha^2/32\)).</b> Cada término \(n,j\): \(\delta_{nj}=-\tfrac{\alpha^2}{2n^4}\left(\tfrac n{j+\frac12}-\tfrac34\right)\) hartree. \(n=2\): \(j=\tfrac12\): \(-1.25\tfrac{\alpha^2}{32}\); \(j=\tfrac32\): \(-0.25\tfrac{\alpha^2}{32}\). \(n=3\): \(\tfrac{\alpha^2}{162}\left(\tfrac3{j+\frac12}-\tfrac34\right)\): \(j=\tfrac12\): \(-2.25\tfrac{\alpha^2}{162}\); \(j=\tfrac32\): \(-0.75\tfrac{\alpha^2}{162}\); \(j=\tfrac52\): \(-0.25\tfrac{\alpha^2}{162}\); con ellas se obtienen las diferencias que siguen.</li>
<li><b>Desplazamientos (GHz respecto de Bohr).</b> \(3s_{1/2}\to2p_{1/2}\) y \(3p_{1/2}\to2s_{1/2}\): \(+8.821\); \(3s_{1/2}\to2p_{3/2}\): \(-2.129\); \(3p_{3/2}\to2s_{1/2}\) y \(3d_{3/2}\to2p_{1/2}\): \(+12.065\); \(3d_{3/2}\to2p_{3/2}\): \(+1.115\); \(3d_{5/2}\to2p_{3/2}\): \(+2.197\).</li>
<li><b>Frecuencias distintas.</b> 5 (cada nivel solo depende de \(n,j\)).</li>
<li><b>Ancho total.</b> \(12.065-(-2.129)=14.19\) GHz.</li>
<li><b>Doppler.</b> \(\Delta\nu_D=\nu_0\sqrt{\dfrac{8k_BT\ln2}{mc^2}}=4.5667\times10^{14}\times1.2357\times10^{-5}=5.64\) GHz (FWHM, 300 K).</li>
<li><b>Resultado.</b> <span class="ans">5 frecuencias en 14.19 GHz; el ensanchamiento Doppler (5.64 GHz) es comparable: la estructura fina de \(\mathrm H\alpha\) apenas se resuelve a temperatura ambiente.</span></li>
</ol></details></li>
</ol>
