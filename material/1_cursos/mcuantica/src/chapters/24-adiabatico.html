<template class="chapter-src" data-id="adiabatico" data-num="24" data-title="Teorema adiabático, fase de Berry y Landau–Zener" data-part="Parte IV · Métodos de aproximación" data-short="Evolución lenta de un hamiltoniano: teorema adiabático y su condición, fase geométrica de Berry, el espín en un campo que gira, transiciones de Landau–Zener en los niveles evitados y el límite brusco">
<p class="lead">Si se cambia un parámetro del hamiltoniano (un campo, la longitud de una caja, la distancia entre átomos) muy lentamente, el sistema no tiene tiempo de saltar de un nivel a otro: «sigue» al estado propio instantáneo. Es el <span class="term">teorema adiabático</span> (Born y Fock, 1928). Pero al seguirlo, además de la fase dinámica habitual, el estado acumula una fase que solo depende de la <em>geometría</em> del camino recorrido en el espacio de parámetros, la fase de Berry (1984). Y cuando dos niveles se acercan, la fórmula de Landau–Zener da la probabilidad de que el sistema «salte» el hueco. Estos tres resultados explican los espectros moleculares, la resonancia magnética, los pulsos adiabáticos de la computación cuántica y la fase topológica de las bandas.</p>

<section>
<h2>El teorema adiabático</h2>
<p>Sea \(H(t)=H(\mathbf R(t))\) con autoestados instantáneos \(H|n(t)\rangle=E_n(t)|n(t)\rangle\) no degenerados. Se busca la solución como \(|\psi\rangle=\sum_nc_n(t)\ee^{\ii\theta_n(t)}|n(t)\rangle\) con la fase dinámica \(\theta_n=-\tfrac1\hbar\int^tE_n\,\dd t'\). Al sustituir en la ecuación de Schrödinger se obtiene \(\dot c_m=-\langle m|\dot n\rangle c_n\ee^{\ii(\theta_n-\theta_m)}+\dots\) con \(\langle m|\dot n\rangle=\dfrac{\langle m|\dot H|n\rangle}{E_n-E_m}\) para \(m\neq n\). Los términos con \(m\neq n\) oscilan rápidamente a la frecuencia \(\omega_{mn}\) y su efecto se promedia a cero si el cambio es lento comparado con ellos:</p>
<div class="eq key" data-name="Condición adiabática">\[\hbar\,\frac{|\langle m|\dot H|n\rangle|}{(E_m-E_n)^2}\ll1\quad\text{para todo }m\neq n\ \ \Longrightarrow\ \ |\psi(t)\rangle\approx\ee^{\ii\theta_n(t)}\ee^{\ii\gamma_n(t)}|n(t)\rangle,\qquad\gamma_n=\ii\int\langle n|\dot n\rangle\,\dd t .\]</div>
<p>Cuando la brecha \(E_m-E_n\) es grande o \(\dot H\) pequeño, el sistema permanece en el \(n\)-ésimo estado instantáneo; los números cuánticos y la ocupación no cambian. La brecha es la que manda: si se cierra (cruce de niveles), no hay adiabaticidad. En mecánica clásica corresponde a la conservación de los <em>invariantes adiabáticos</em> \(\oint p\,\dd q\): para un oscilador, \(E/\omega\) es constante cuando \(\omega\) cambia lentamente, y cuánticamente \(E_n=\hbar\omega(n+\tfrac12)\) con \(n\) fijo es exactamente esa conservación (Ehrenfest, 1916, antes de la mecánica cuántica). Para una caja con pared móvil lenta, \(E_n\propto1/L^2\) con el mismo \(n\) (el contrario de la expansión brusca del capítulo 6, que dispersa el estado en muchos \(n\)).</p>
<div class="sim" data-sim="adiab-ho" data-title="Oscilador con frecuencia variable: de la expansión brusca al invariante adiabático"></div>
<div class="sim-guide"><ul>
<li>Con \(\omega_1/\omega_0=2\) y una rampa muy corta (\(\tau=0.05/\omega_0\)): la probabilidad de hallar el estado fundamental del oscilador nuevo es \(2\sqrt{\omega_0\omega_1}/(\omega_0+\omega_1)=0.9428\) (el solapamiento de dos gaussianas, el límite brusco) y la energía final es \(\tfrac{\omega_0^2+\omega_1^2}{4\omega_0\omega_1}\hbar\omega_1=0.625\hbar\omega_1\), el 25 % por encima del mínimo.</li>
<li>Con \(\tau=20/\omega_0\) la probabilidad de permanecer en el estado fundamental sube a \(0.99988\) y la energía es \(0.5002\,\hbar\omega_1\): se conserva el número cuántico \(n\) y la energía sigue a \(\omega\) (\(E/\omega\) constante). La transición entre los dos regímenes ocurre cuando \(\tau\sim1/\omega\).</li>
</ul></div>
</section>

<section>
<h2>La fase de Berry</h2>
<p>Cuando el parámetro recorre un camino cerrado \(\mathcal C\) en el espacio de parámetros, el estado adiabático vuelve al mismo estado propio, pero con una fase adicional:</p>
<div class="eq key" data-name="Fase geométrica de Berry">\[\gamma_n(\mathcal C)=\ii\oint_{\mathcal C}\langle n(\mathbf R)|\nabla_{\mathbf R}\,n(\mathbf R)\rangle\cdot\dd\mathbf R=\ii\iint_S\nabla\times\langle n|\nabla n\rangle\cdot\dd\mathbf S,\qquad\gamma_n(\text{espín }\tfrac12,\ m=\pm\tfrac12)=\mp\tfrac12\,\Omega .\]</div>
<p>\(\mathbf A_n=\ii\langle n|\nabla n\rangle\) es la «conexión de Berry», un potencial vectorial en el espacio de parámetros (la fase cambia con la gauge de \(|n\rangle\), pero la integral sobre una curva cerrada no, igual que el flujo en Aharonov–Bohm) y su rotacional es la curvatura de Berry. Para un espín \(\tfrac12\) en un campo \(\mathbf B\) cuya dirección recorre un cono de semiángulo \(\theta\), la curvatura es la de un <em>monopolo magnético</em> en el origen (\(\mathbf B=0\), donde los dos niveles se cruzan) y la fase es \(\mp\tfrac12\) del <strong>ángulo sólido</strong> que subtiende el camino: \(\Omega=2\pi(1-\cos\theta)\). Es una fase que no depende del tiempo que se tarde ni de la energía, solo de la geometría, lo que se verificó con fotones en una fibra óptica helicoidal (Tomita y Chiao, 1986) y con neutrones. Es la misma matemática que el péndulo de Foucault: el transporte paralelo a lo largo de un camino cerrado sobre una esfera deja una rotación igual al ángulo sólido.</p>
<p>Un caso exactamente soluble es el del espín en el campo \(\mathbf B(t)=B(\sin\theta\cos\omega t,\sin\theta\sin\omega t,\cos\theta)\). En el sistema que gira con el campo, el hamiltoniano es constante, con precesión alrededor de \(\mathbf w_\text{eff}=(\omega_L\sin\theta,0,\omega_L\cos\theta-\omega)\), y la probabilidad de que el espín siga alineado con \(\mathbf B(t)\) es</p>
<div class="eq">\[P_\text{alin}(t)=1-\sin^2\chi\,\sin^2\frac{W t}2,\qquad W=|\mathbf w_\text{eff}|,\qquad\sin\chi=\frac{\omega\sin\theta}{W},\ \ \text{luego}\ P_\text{alin}\ge1-\frac{\omega^2\sin^2\theta}{W^2}\ \xrightarrow{\ \omega\ll\omega_L\ }\ 1 .\]</div>
<div class="sim" data-sim="berry-espin" data-title="Espín en un campo que gira: seguimiento adiabático y fase de Berry"></div>
<div class="sim-guide"><ul>
<li>Con \(\theta=60^\circ\) y \(\omega=0.1\,\omega_L\): la probabilidad mínima de seguir al campo es \(0.99176\) (el espín «cabecea» alrededor de \(\mathbf B\) con amplitud pequeña) y la fase de Berry por ciclo es \(-\pi(1-\cos60^\circ)=-\pi/2\) rad \(=-90^\circ\), sea cual sea la velocidad. La fase dinámica, \(-\omega_LT/2=-31.4\) rad, es mucho mayor y depende de \(\omega\).</li>
<li>Con \(\theta=90^\circ\) (el campo gira en el plano) \(\gamma=-\pi\): cambia el signo del espinor, observable por interferencia. Con \(\omega=\omega_L\) y \(\theta=90^\circ\), la probabilidad mínima baja a 0.5: no hay adiabaticidad.</li>
</ul></div>
</section>

<section>
<h2>El cruce evitado: la fórmula de Landau–Zener</h2>
<p>Cuando dos niveles se acercan al variar un parámetro, lo hacen de manera «evitada» si hay un acoplamiento \(g\): los estados diabáticos \(|1\rangle,|2\rangle\) (los de \(g=0\)) se cruzan, pero los niveles exactos (adiabáticos) se repelen con una brecha mínima \(2g\). Con el modelo lineal \(H=\begin{pmatrix}vt/2&g\\g&-vt/2\end{pmatrix}\) (\(\hbar=1\)) las energías adiabáticas son \(\pm\sqrt{(vt/2)^2+g^2}\) y el barrido pasa por la brecha con velocidad \(v\). Landau, Zener, Stückelberg y Majorana (1932) resolvieron el modelo exactamente (con funciones parabólicas cilíndricas):</p>
<div class="eq key" data-name="Fórmula de Landau–Zener">\[P_\text{dia}=\exp\left(-\frac{2\pi g^2}{\hbar v}\right),\qquad P_\text{adia}=1-P_\text{dia},\qquad v=\frac{\dd(E_1-E_2)}{\dd t}.\]</div>
<p>\(P_\text{dia}\) es la probabilidad de «saltar» el hueco (de seguir el nivel diabático, es decir, de cambiar de estado propio). Con un barrido lento (\(g^2\gg\hbar v\)) el sistema sigue el nivel adiabático: es la <em>pasada adiabática rápida</em> que invierte poblaciones en RMN y en átomos fríos y que sustenta el recocido cuántico. Con un barrido rápido, el sistema atraviesa sin enterarse. La fórmula, con el exponente \(2\pi g^2/\hbar v\) como único parámetro, sirve en colisiones atómicas y moleculares, en cruces en estructuras de bandas, en los transistores de un solo electrón y en los qubits.</p>
<div class="sim" data-sim="landau-zener" data-title="Landau–Zener: poblaciones al barrer un cruce evitado"></div>
<div class="sim-guide"><ul>
<li>Con \(g=0.5\): \(v=0.5\) da \(P_\text{dia}=0.0432\) (casi toda la población sigue al nivel adiabático); \(v=2\) da \(0.4559\) (reparto casi por mitades) y \(v=12\) da \(0.8773\). La velocidad crítica \(v_c=2\pi g^2=1.571\) corresponde a \(P_\text{dia}=1/e=0.368\).</li>
<li>La integración numérica (en un intervalo finito) oscila alrededor del valor de Landau–Zener con un error que decrece como el inverso del tiempo recorrido; si extiende el intervalo se aproxima al valor exacto: con \(v=2\) vale entre 0.44 y 0.48 según el intervalo que usa el simulador.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Con \(g=0.5\) (\(\hbar=1\)) halle \(P_\text{dia}\) para \(v=0.5,\ 2,\ 8\) y la velocidad \(v_c\) para la que \(P_\text{dia}=1/e\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Exponente.</b> \(2\pi g^2=2\pi\times0.25=1.5708\); \(P_\text{dia}=\ee^{-1.5708/v}\).</li>
<li><b>\(v=0.5\).</b> \(\ee^{-3.1416}=0.0432\).</li>
<li><b>\(v=2\).</b> \(\ee^{-0.7854}=0.4559\).</li>
<li><b>\(v=8\).</b> \(\ee^{-0.19635}=0.8217\).</li>
<li><b>Velocidad crítica.</b> \(P=1/e\Rightarrow2\pi g^2/v=1\Rightarrow v_c=2\pi g^2=1.5708\).</li>
<li><b>Resultado.</b> <span class="ans">\(P_\text{dia}=0.0432,\ 0.4559,\ 0.8217\); \(v_c=1.571\) (el barrido es lento si \(v\ll2\pi g^2\)).</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Un espín \(\tfrac12\) sigue adiabáticamente un campo cuya dirección describe un cono de semiángulo \(\theta\). Calcule la fase de Berry por ciclo para \(m=\pm\tfrac12\) con \(\theta=60^\circ\), \(90^\circ\) y para \(\theta\) pequeño.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Ángulo sólido.</b> \(\Omega=2\pi(1-\cos\theta)\).</li>
<li><b>Fase.</b> \(\gamma_m=-m\Omega\).</li>
<li><b>\(\theta=60^\circ\).</b> \(\Omega=2\pi\times0.5=\pi\): \(\gamma_{+1/2}=-\pi/2\), \(\gamma_{-1/2}=+\pi/2\).</li>
<li><b>\(\theta=90^\circ\).</b> \(\Omega=2\pi\): \(\gamma_{+1/2}=-\pi\) (un cambio de signo del espinor).</li>
<li><b>\(\theta\) pequeño.</b> \(1-\cos\theta\approx\theta^2/2\Rightarrow\gamma\approx-\tfrac{\pi\theta^2}2\) (el área del círculo en el plano).</li>
<li><b>Resultado.</b> <span class="ans">\(\mp\pi/2\) (60°), \(\mp\pi\) (90°), \(\gamma\approx-\pi\theta^2/2\) para \(\theta\ll1\); la diferencia entre \(m=\pm\tfrac12\) es \(\Omega\) (observable por interferometría).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Un electrón atraviesa un campo magnético que cambia de \(-B_z\) a \(+B_z\) con \(B_z=\alpha t\), \(\alpha=1\) T/ms, con un campo transversal \(B_\perp\). Calcule la probabilidad de que el espín siga adiabáticamente al campo para \(B_\perp=10\ \mu\)T y el campo transversal crítico.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Hamiltoniano.</b> \(H=\tfrac12g_s\mu_B(B_\perp\sigma_x+\alpha t\,\sigma_z)\): corresponde a \(H=\begin{pmatrix}vt/2&g\\g&-vt/2\end{pmatrix}\) con \(v=g_s\mu_B\alpha/\hbar\) y \(g=g_s\mu_BB_\perp/2\hbar\).</li>
<li><b>Valores.</b> \(g_s\mu_B/\hbar=1.7609\times10^{11}\) rad s\(^{-1}\)T\(^{-1}\): \(v=1.7609\times10^{14}\) rad/s², \(g=8.804\times10^5\) rad/s.</li>
<li><b>Exponente.</b> \(2\pi g^2/v=2\pi\times7.752\times10^{11}/1.7609\times10^{14}=0.02766\).</li>
<li><b>Probabilidades.</b> \(P_\text{dia}=\ee^{-0.02766}=0.9727\): el espín <em>no</em> sigue el campo (97.3 %) y solo el 2.7 % lo hace.</li>
<li><b>Campo crítico.</b> \(2\pi g^2=v\Rightarrow B_\perp=\dfrac{2\hbar}{g_s\mu_B}\sqrt{v/2\pi}=60.1\ \mu\)T: por encima de él, el seguimiento domina (con 1 mT es casi total: \(\ee^{-277}\)).</li>
<li><b>Resultado.</b> <span class="ans">\(P_\text{dia}=0.973\) con 10 µT (seguimiento adiabático de solo 2.7 %); \(B_\perp^\text{crit}=60.1\ \mu\)T. Es el origen de las pérdidas «Majorana» de los átomos en las trampas magnéticas en el cero del campo.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Un oscilador \(\omega_0\) pasa a \(\omega_1=2\omega_0\): (a) de golpe; (b) de forma adiabática. Halle la probabilidad de quedar en el estado fundamental final y la energía final de cada caso.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>(a) Solapamiento.</b> \(\psi_0\propto\ee^{-m\omega_0x^2/2\hbar}\) y \(\phi_0\propto\ee^{-m\omega_1x^2/2\hbar}\): \(\langle\phi_0|\psi_0\rangle=\left(\dfrac{2\sqrt{\omega_0\omega_1}}{\omega_0+\omega_1}\right)^{1/2}\), luego \(P=\dfrac{2\sqrt{\omega_0\omega_1}}{\omega_0+\omega_1}=\dfrac{2\sqrt2}3=0.9428\).</li>
<li><b>Energía brusca.</b> \(\langle H_1\rangle=\tfrac{\hbar\omega_0}4+\tfrac{\hbar\omega_1^2}{4\omega_0}=\hbar\omega_0(\tfrac14+1)=1.25\hbar\omega_0=0.625\hbar\omega_1\) (el estado no cambia pero el hamiltoniano sí).</li>
<li><b>(b) Adiabático.</b> \(n\) se conserva: \(P=1\) y \(E=\tfrac12\hbar\omega_1=\hbar\omega_0\) (el invariante \(E/\omega=\hbar/2\)).</li>
<li><b>Comparación.</b> La diferencia de energía entre los dos casos, \(0.25\hbar\omega_0\), es el trabajo extra que se hace al cambiar la frecuencia de golpe.</li>
<li><b>Resultado.</b> <span class="ans">Brusco: \(P=0.9428\), \(E=1.25\hbar\omega_0\); adiabático: \(P=1\), \(E=\hbar\omega_0\).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Para el espín en el campo que gira (\(\theta=60^\circ\), \(\omega=0.1\omega_L\)) calcule \(W\), \(\sin\chi\) y la probabilidad mínima de alineación; indique cuándo se pierde la adiabaticidad.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Campo efectivo.</b> En el sistema giratorio \(H=\tfrac12\boldsymbol\sigma\cdot\mathbf w_\text{eff}\) con \(\mathbf w_\text{eff}=(\sin\theta,0,\cos\theta-\omega)\) (en unidades de \(\omega_L\)): \(=(0.8660,\,0,\,0.4)\).</li>
<li><b>Módulo.</b> \(W=\sqrt{0.75+0.16}=0.95394\).</li>
<li><b>Ángulo con \(\mathbf n\).</b> \(\sin\chi=|\mathbf n\times\mathbf w_\text{eff}|/W=\dfrac{\omega\sin\theta}{W}=\dfrac{0.1\times0.8660}{0.95394}=0.09078\); \(\sin^2\chi=0.008242\).</li>
<li><b>Probabilidad.</b> \(P_\text{alin}(t)=1-\sin^2\chi\sin^2(Wt/2)\ge1-0.008242=0.99176\).</li>
<li><b>Adiabaticidad.</b> \(\sin\chi\approx(\omega/\omega_L)\sin\theta\): pequeño mientras \(\omega\ll\omega_L\). Con \(\omega=\omega_L\), \(\theta=90^\circ\): \(\mathbf w_\text{eff}=(1,0,-1)\), \(W=\sqrt2\), \(\sin^2\chi=\tfrac12\) y \(P_\text{mín}=0.5\).</li>
<li><b>Resultado.</b> <span class="ans">\(W=0.9539\); \(\sin\chi=0.0908\); \(P_\text{mín}=0.99176\). El criterio de adiabaticidad es \(\omega\ll\omega_L\) (el campo debe girar lentamente frente a la precesión de Larmor).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Muestre que la fase total tras un ciclo del campo (\(\omega T=2\pi\)) es \(-\omega_LT/2-\pi(1-\cos\theta)\) módulo \(2\pi\), con la geométrica \(-\pi(1-\cos\theta)\), y compruébelo para \(\theta=60^\circ\), \(\omega=0.01\omega_L\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Propagador.</b> \(U(T)=\ee^{-\ii\omega T\sigma_z/2}\,\ee^{-\ii H_\text{rot}T}\) con \(H_\text{rot}=\tfrac12\boldsymbol\sigma\cdot\mathbf w_\text{eff}\); con \(\omega T=2\pi\), el primer factor vale \(-1\) (rotación de \(2\pi\) de un espinor).</li>
<li><b>Estado alineado.</b> En el límite adiabático \(\mathbf w_\text{eff}\parallel\mathbf n\) y el espinor alineado adquiere \(\ee^{-\ii WT/2}\) con \(W=\sqrt{\sin^2\theta+(\cos\theta-\omega)^2}\approx1-\omega\cos\theta\).</li>
<li><b>Fase.</b> \(\varphi=\pi-\tfrac{WT}2\approx\pi-\tfrac\pi\omega+\pi\cos\theta=-\tfrac{\omega_LT}2+\pi(1+\cos\theta)\), donde \(\omega_LT/2=\pi/\omega\).</li>
<li><b>Módulo \(2\pi\).</b> \(\pi(1+\cos\theta)\equiv\pi(1+\cos\theta)-2\pi=-\pi(1-\cos\theta)\): la fase geométrica.</li>
<li><b>Numérico.</b> \(\theta=60^\circ\): \(\gamma=-\pi/2=-1.5708\). Con \(\omega=0.1\): la fase exacta es \(-1.695\); con \(\omega=0.01\): \(-1.5826\); con \(\omega=0.002\): \(-1.5732\): converge a \(-\pi/2\) con una corrección \(\propto\omega\).</li>
<li><b>Resultado.</b> <span class="ans">\(\varphi=-\omega_LT/2-\pi(1-\cos\theta)\ (\mathrm{mod}\ 2\pi)\); numéricamente \(-1.5826\) (\(\omega=0.01\)) frente a \(\gamma_B=-1.5708\).</span></li>
</ol></details></li>
</ol>
