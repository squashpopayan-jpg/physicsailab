<template class="chapter-src" data-id="sumamom" data-num="16" data-title="Suma de momentos angulares" data-part="Parte III · Momento angular y el átomo" data-short="Acoplamiento de dos momentos angulares: base acoplada y no acoplada, coeficientes de Clebsch–Gordan, singlete y triplete, acoplamiento espín–órbita, factor de Landé y efecto Zeeman anómalo">
<p class="lead">Un átomo con un electrón tiene dos momentos angulares: el orbital \(\mathbf L\) y el de espín \(\mathbf S\). Con dos electrones hay cuatro. Estos momentos no son independientes porque interactúan, y lo que se conserva es su suma \(\mathbf J=\mathbf L+\mathbf S\). La pregunta es cuántica: si el sistema está en un estado propio de \(J^2\) y \(J_z\), ¿en qué estados de los momentos individuales se encuentra? La respuesta son los <span class="term">coeficientes de Clebsch–Gordan</span>, y sus consecuencias son la estructura fina, la multiplicidad de los términos atómicos y el efecto Zeeman anómalo.</p>

<section>
<h2>Dos bases para el mismo espacio</h2>
<p>Dos momentos \(\mathbf J_1\) y \(\mathbf J_2\) (de sistemas distintos, de modo que conmutan) con números \(j_1\) y \(j_2\) generan el espacio producto de dimensión \((2j_1+1)(2j_2+1)\). Hay dos bases útiles:</p>
<ul>
<li><b>No acoplada</b>: \(|j_1m_1\rangle|j_2m_2\rangle\), propia de \(J_1^2,J_{1z},J_2^2,J_{2z}\).</li>
<li><b>Acoplada</b>: \(|JM\rangle\) (con \(j_1,j_2\) implícitos), propia de \(J^2,J_z\) con \(\mathbf J=\mathbf J_1+\mathbf J_2\), y también de \(J_1^2\) y \(J_2^2\).</li>
</ul>
<p>La relación entre ellas es \(|JM\rangle=\sum_{m_1+m_2=M}\langle j_1m_1j_2m_2|JM\rangle\,|j_1m_1\rangle|j_2m_2\rangle\), con coeficientes reales (en la convención de Condon–Shortley) que satisfacen la ortonormalidad de una matriz ortogonal. Los valores de \(J\) permitidos son</p>
<div class="eq key" data-name="Regla de adición de momentos angulares">\[J=|j_1-j_2|,\ |j_1-j_2|+1,\ \dots,\ j_1+j_2,\qquad M=m_1+m_2,\qquad(2j_1+1)(2j_2+1)=\sum_{J=|j_1-j_2|}^{j_1+j_2}(2J+1).\]</div>
<p>La suma de las dimensiones tiene una interpretación simple: el número de estados no cambia al cambiar de base. El valor máximo \(M=j_1+j_2\) solo se obtiene de una manera (\(m_1=j_1\), \(m_2=j_2\)); con \(M\) uno menos, hay dos estados no acoplados: una combinación es \(J=j_1+j_2\) (se obtiene aplicando \(J_-\) al estado superior) y la otra, ortogonal, es el máximo de \(J=j_1+j_2-1\); así se construye toda la tabla. La fórmula cerrada de Racah da cualquier coeficiente y se programa fácilmente (es la que usa el simulador).</p>
<div class="box ex"><h4>Dos espines ½: singlete y triplete</h4>
<p><strong>Procedimiento.</strong> Con \(j_1=j_2=\tfrac12\), \(J=0,1\) y \(2\times2=1+3\). El estado de \(M=1\) es \(|\!\uparrow\uparrow\rangle\) (\(J=1\)). Aplicando \(S_-=S_{1-}+S_{2-}\): \(S_-|1,1\rangle=\sqrt2\hbar|1,0\rangle=\hbar(|\!\downarrow\uparrow\rangle+|\!\uparrow\downarrow\rangle)\), luego \(|1,0\rangle=\tfrac1{\sqrt2}(|\!\uparrow\downarrow\rangle+|\!\downarrow\uparrow\rangle)\). El estado ortogonal de \(M=0\) es \(|0,0\rangle=\tfrac1{\sqrt2}(|\!\uparrow\downarrow\rangle-|\!\downarrow\uparrow\rangle)\). <strong>Resultado.</strong> El <em>triplete</em> (\(S=1\)) es simétrico bajo el intercambio de los dos espines; el <em>singlete</em> (\(S=0\)) es antisimétrico y es invariante bajo cualquier rotación (\(\mathbf S_{tot}|0,0\rangle=0\)): en él los dos espines apuntan en direcciones opuestas sea cual sea el eje de medida, un hecho clave de la desigualdad de Bell (capítulo 31). \(\mathbf S_1\cdot\mathbf S_2=\tfrac12[S(S+1)-\tfrac32]\hbar^2=\tfrac14\hbar^2\) en el triplete y \(-\tfrac34\hbar^2\) en el singlete: la interacción de intercambio \(\propto\mathbf S_1\cdot\mathbf S_2\) del magnetismo.</p></div>
<div class="sim" data-sim="cg-tabla" data-title="Coeficientes de Clebsch–Gordan: tabla para cada M y verificación de la ortonormalidad"></div>
<div class="sim-guide"><ul>
<li>\(j_1=1\), \(j_2=\tfrac12\), \(M=\tfrac12\): dos filas \((1,-\tfrac12)\) y \((0,\tfrac12)\) y dos columnas \(J=\tfrac32,\tfrac12\); la matriz \(\begin{pmatrix}0.5774&0.8165\\0.8165&-0.5774\end{pmatrix}\) es ortogonal: las sumas de cuadrados por filas y columnas valen 1. Las dimensiones \(6=4+2\).</li>
<li>\(j_1=j_2=1\): \(J=2,1,0\) y \(9=5+3+1\). Con \(M=0\) hay tres filas (1,−1), (0,0), (−1,1); la columna \(J=0\) vale \((0.5774,-0.5774,0.5774)\): el estado de \(J=0\) de dos espines 1 reparte la probabilidad \(\tfrac13\) entre las tres combinaciones.</li>
</ul></div>
</section>

<section>
<h2>Acoplamiento L–S y estructura fina</h2>
<p>El movimiento orbital del electrón crea en su sistema de reposo un campo magnético que actúa sobre el espín; el resultado (que la ecuación de Dirac explica con rigor, incluida la corrección de Thomas) es el acoplamiento espín–órbita \(H_{LS}=\xi(r)\,\mathbf L\cdot\mathbf S\), que en un término \(^{2S+1}L\) se reduce a \(A\,\mathbf L\cdot\mathbf S\). El producto escalar se halla de \(\mathbf J^2=\mathbf L^2+\mathbf S^2+2\mathbf L\cdot\mathbf S\):</p>
<div class="eq key" data-name="Producto L·S y regla del intervalo de Landé">\[\mathbf L\cdot\mathbf S=\tfrac\hbar2\!\cdot\!\hbar\left[J(J+1)-L(L+1)-S(S+1)\right]\Rightarrow E_J=\tfrac A2\left[J(J+1)-L(L+1)-S(S+1)\right],\qquad E_J-E_{J-1}=AJ.\]</div>
<p>Los niveles del término se separan según \(J=|L-S|,\dots,L+S\) con intervalos proporcionales al \(J\) del nivel superior. Para \(^2P\) (\(L=1\), \(S=\tfrac12\)): \(J=\tfrac12\) con \(E=-A\) y \(J=\tfrac32\) con \(E=+A/2\), una separación fina \(3A/2\). La notación espectroscópica \(^{2S+1}L_J\) indica la multiplicidad de espín \(2S+1\), la letra de \(L\) (S, P, D, F, G, ...) y el valor de \(J\). El nivel de \(J\) está \((2J+1)\) veces degenerado; el total \(\sum(2J+1)=(2L+1)(2S+1)\).</p>
<div class="sim" data-sim="acople-ls" data-title="Modelo vectorial del acoplamiento L–S y estructura fina de un término"></div>
<div class="sim-guide"><ul>
<li>\(L=1\), \(S=\tfrac12\): dos niveles \(^2P_{1/2}\) y \(^2P_{3/2}\). Con el nivel \(J=\tfrac12\), \(\mathbf L\cdot\mathbf S=-1\) y el ángulo entre \(\mathbf L\) y \(\mathbf S\) es de 144.7° (casi antiparalelos); con \(J=\tfrac32\), \(\mathbf L\cdot\mathbf S=+\tfrac12\) y el ángulo es de 65.9°. El intervalo entre niveles es \(A\cdot\tfrac32\), la regla de Landé.</li>
<li>\(L=2\), \(S=1\) (\(^3D\)): tres niveles \(J=1,2,3\) con intervalos \(2A\) y \(3A\): la proporción 2:3 es la regla de Landé. Los vectores \(\mathbf L\) y \(\mathbf S\) precesan alrededor de \(\mathbf J\) y solo la suma, \(|\mathbf J|=\sqrt{J(J+1)}\hbar\), es constante en el tiempo.</li>
</ul></div>
</section>

<section>
<h2>El efecto Zeeman anómalo</h2>
<p>En un campo \(\mathbf B\) pequeño, comparado con la separación fina, \(\mathbf L\) y \(\mathbf S\) siguen acoplados y el nivel de \(J\) se separa en \(2J+1\) subniveles \(M_J\). El momento magnético es \(\boldsymbol\mu=-\mu_B(\mathbf L+2\mathbf S)/\hbar\), que <em>no</em> es paralelo a \(\mathbf J\) porque \(g_s=2\neq g_l=1\); solo su componente a lo largo de \(\mathbf J\) sobrevive en promedio (precesa rápido en torno a \(\mathbf J\)), lo que da (teorema de la proyección)</p>
<div class="eq key" data-name="Factor de Landé y efecto Zeeman débil">\[E_{J,M}=E_J+g_J\mu_BBM,\qquad g_J=1+\frac{J(J+1)+S(S+1)-L(L+1)}{2J(J+1)}.\]</div>
<p>Para \(^2P_{3/2}\): \(g=\tfrac43\); \(^2P_{1/2}\): \(g=\tfrac23\); \(^2S_{1/2}\): \(g=2\). Como los factores \(g\) de los niveles inicial y final difieren, las líneas se desdoblan en patrones no equidistantes, el llamado efecto Zeeman «anómalo» (anómalo solo respecto de la teoría clásica de Lorentz, que sin espín predecía el tríplete normal). Con campos fuertes (\(\mu_BB\gg A\)) \(\mathbf L\) y \(\mathbf S\) se desacoplan y precesan por separado en torno de \(\mathbf B\): la energía pasa a ser \(\mu_BB(m_l+2m_s)\) más una pequeña corrección \(A\,m_lm_s\); es el <span class="term">efecto Paschen–Back</span>. El caso intermedio se resuelve diagonalizando bloques \(2\times2\) de la matriz de \(A\mathbf L\cdot\mathbf S+\mu_BB(L_z+2S_z)\) (es lo que hace el simulador).</p>
<div class="sim" data-sim="zeeman-anom" data-title="Término ²P en un campo magnético: del Zeeman anómalo al Paschen–Back"></div>
<div class="sim-guide"><ul>
<li>Con \(\mu_BB/A\) pequeño, los seis niveles de \(^2P\) se ordenan en dos fanes con las pendientes \(g_JM\): los \(^2P_{3/2}\) con \(\pm2,\pm\tfrac23\) y los \(^2P_{1/2}\) con \(\pm\tfrac13\); las rectas punteadas son la aproximación de campo débil y coinciden con las curvas solo para campos pequeños. Los niveles \(M=\pm\tfrac32\) son rectas exactas, \(\tfrac A2\pm2\mu_BB\).</li>
<li>Con campos grandes las curvas tienden a rectas con pendientes \(m_l+2m_s=2,1,0,0,-1,-2\) (dos niveles comparten la pendiente 0): el patrón de Paschen–Back.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Dos electrones están en \(|\!\uparrow\downarrow\rangle\). Halle \(\langle S_z\rangle\), \(\langle\mathbf S^2\rangle\) y las probabilidades de encontrar el sistema en el singlete y en el triplete.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Descomposición.</b> \(|\!\uparrow\downarrow\rangle=\tfrac1{\sqrt2}\left(|1,0\rangle+|0,0\rangle\right)\) (suma y diferencia de los estados \(M=0\)).</li>
<li><b>Probabilidades.</b> \(P(S=1)=|\tfrac1{\sqrt2}|^2=\tfrac12\); \(P(S=0)=\tfrac12\).</li>
<li><b>\(\langle S_z\rangle\).</b> \(M=0\) en ambos: \(\langle S_z\rangle=0\).</li>
<li><b>\(\langle\mathbf S^2\rangle\).</b> \(\tfrac12\cdot S(S+1)|_{S=1}+\tfrac12\cdot0=\tfrac12\cdot2\hbar^2=\hbar^2\).</li>
<li><b>Resultado.</b> <span class="ans">\(\langle S_z\rangle=0\); \(\langle\mathbf S^2\rangle=\hbar^2\); singlete 50 %, triplete 50 %.</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Acople \(l=1\) con \(s=\tfrac12\). Escriba los estados \(|J,M\rangle\) con \(M=\tfrac12\) en términos de \(|m_l,m_s\rangle\) y calcule \(\langle L_z\rangle\) y \(\langle S_z\rangle\) en cada uno.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Dimensión.</b> \(3\times2=6=4+2\): \(J=\tfrac32,\tfrac12\).</li>
<li><b>Estados no acoplados con \(M=\tfrac12\).</b> \(|1,\downarrow\rangle\) y \(|0,\uparrow\rangle\).</li>
<li><b>\(J=\tfrac32\).</b> Se obtiene con \(J_-\) desde \(|\tfrac32,\tfrac32\rangle=|1,\uparrow\rangle\): \(J_-|1,\uparrow\rangle=\sqrt2\hbar|0,\uparrow\rangle+\hbar|1,\downarrow\rangle\) y la norma \(\sqrt3\): \(|\tfrac32,\tfrac12\rangle=\sqrt{\tfrac23}|0,\uparrow\rangle+\sqrt{\tfrac13}|1,\downarrow\rangle\).</li>
<li><b>\(J=\tfrac12\).</b> Ortogonal: \(|\tfrac12,\tfrac12\rangle=\sqrt{\tfrac23}|1,\downarrow\rangle-\sqrt{\tfrac13}|0,\uparrow\rangle\) (signo de Condon–Shortley).</li>
<li><b>Valores esperados en \(J=\tfrac32\).</b> \(\langle L_z\rangle=\tfrac13\cdot1=0.3333\hbar\); \(\langle S_z\rangle=\tfrac23\cdot\tfrac12+\tfrac13\cdot(-\tfrac12)=0.1667\hbar\); suman \(M=\tfrac12\) ✓.</li>
<li><b>En \(J=\tfrac12\).</b> \(\langle L_z\rangle=\tfrac23\hbar=0.6667\hbar\); \(\langle S_z\rangle=\tfrac23(-\tfrac12)+\tfrac13\cdot\tfrac12=-0.1667\hbar\) ✓.</li>
<li><b>Resultado.</b> <span class="ans">\(|\tfrac32,\tfrac12\rangle=\sqrt{\tfrac23}|0,\uparrow\rangle+\sqrt{\tfrac13}|1,\downarrow\rangle\) y \(|\tfrac12,\tfrac12\rangle=\sqrt{\tfrac23}|1,\downarrow\rangle-\sqrt{\tfrac13}|0,\uparrow\rangle\); \(\langle L_z\rangle=\tfrac13\hbar,\ \tfrac23\hbar\) y \(\langle S_z\rangle=\tfrac16\hbar,\ -\tfrac16\hbar\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Las líneas D del sodio (\(3^2P_{1/2,3/2}\to3^2S_{1/2}\)) están en 589.592 nm (D\(_1\)) y 588.995 nm (D\(_2\)) (en el aire). Calcule la separación fina, la constante \(A\) del acoplamiento espín–órbita del nivel \(3p\) y el cociente de los intervalos.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Energías.</b> \(\Delta E=hc\left(\tfrac1{588.995}-\tfrac1{589.592}\right)\text{nm}^{-1}\): \(\Delta\tilde\nu=17.19\) cm\(^{-1}\) y \(\Delta E=2.131\) meV.</li>
<li><b>Regla de Landé.</b> \(E(^2P_{3/2})-E(^2P_{1/2})=\tfrac32A\) (de \(E_J=\tfrac A2[J(J+1)-\tfrac{11}4]\): \(E_{3/2}=\tfrac A2(\tfrac{15}4-\tfrac{11}4)=\tfrac A2\) y \(E_{1/2}=\tfrac A2(\tfrac34-\tfrac{11}4)=-A\), con diferencia \(\tfrac32A\)).</li>
<li><b>Constante.</b> \(A=\tfrac23\Delta E=1.421\) meV (11.46 cm\(^{-1}\)).</li>
<li><b>Energías de los niveles.</b> \(E(^2P_{3/2})=+\tfrac A2=0.710\) meV y \(E(^2P_{1/2})=-A=-1.421\) meV respecto del baricentro (el baricentro ponderado por \(2J+1\) es cero: \(4\times0.5A+2\times(-A)=0\) ✓).</li>
<li><b>Resultado.</b> <span class="ans">\(\Delta E=2.131\) meV (17.19 cm\(^{-1}\)); \(A=1.421\) meV; el nivel \(^2P_{3/2}\) queda 0.710 meV por encima del baricentro y el \(^2P_{1/2}\), 1.421 meV por debajo.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Obtenga los desplazamientos de las cuatro componentes de la línea D\(_1\) (\(^2P_{1/2}\to{}^2S_{1/2}\)) en un campo de 1 T y compruebe que se trata del régimen de campo débil.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Factores \(g\).</b> \(g(^2P_{1/2})=1+\dfrac{\tfrac34+\tfrac34-2}{2\cdot\tfrac34}=\dfrac23\); \(g(^2S_{1/2})=1+\dfrac{\tfrac34+\tfrac34-0}{2\cdot\tfrac34}=2\).</li>
<li><b>Desplazamiento.</b> \(\Delta E=\mu_BB\left(g_uM_u-g_lM_l\right)\), con \(M_u,M_l=\pm\tfrac12\) (\(\Delta M=0,\pm1\)).</li>
<li><b>Las cuatro líneas.</b> \(\left(\tfrac12,\tfrac12\right)\): \(\tfrac13-1=-\tfrac23\); \(\left(-\tfrac12,-\tfrac12\right)\): \(+\tfrac23\); \(\left(\tfrac12,-\tfrac12\right)\): \(\tfrac13+1=\tfrac43\); \(\left(-\tfrac12,\tfrac12\right)\): \(-\tfrac43\).</li>
<li><b>En unidades físicas.</b> \(\mu_B/h=13.996\) GHz/T: \(\pm\tfrac23\to\pm9.331\) GHz; \(\pm\tfrac43\to\pm18.662\) GHz. En longitud de onda \(\Delta\lambda=\lambda^2\Delta\nu/c\): \(\pm0.01082\) nm y \(\pm0.02164\) nm.</li>
<li><b>Régimen.</b> \(\mu_BB=57.88\ \mu\)eV frente a \(A=1421\ \mu\)eV: el cociente es 0.041 ≪ 1: campo débil ✓.</li>
<li><b>Resultado.</b> <span class="ans">Desplazamientos \(\pm\tfrac23\mu_BB\) y \(\pm\tfrac43\mu_BB\): \(\pm9.331\) y \(\pm18.662\) GHz (\(\pm0.0108\) y \(\pm0.0216\) nm) en 1 T; \(\mu_BB/A=0.041\).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Halle los términos de dos electrones \(p\) no equivalentes (\(np\,n'p\)) y de dos electrones equivalentes (\(np^2\)), comprobando la dimensión. Indique el término fundamental según Hund.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>No equivalentes.</b> \(l_1=l_2=1\), \(s_1=s_2=\tfrac12\): \(L=0,1,2\) y \(S=0,1\); los seis términos son \(^1S,{}^3S,{}^1P,{}^3P,{}^1D,{}^3D\) con dimensiones \(1+3+3+9+5+15=36=6\times6\) ✓.</li>
<li><b>Equivalentes.</b> Con la misma \((n,l)\), el principio de Pauli exige que los dos electrones no tengan los mismos \((m_l,m_s)\): hay \(\binom62=15\) estados.</li>
<li><b>Tabla de \((M_L,M_S)\).</b> \(M_S=0\): \(M_L=2,1,0,-1,-2\) con multiplicidades 1, 2, 3, 2, 1; \(M_S=\pm1\): \(M_L=1,0,-1\) (una vez cada uno). Suma \(9+6=15\).</li>
<li><b>Descomposición.</b> \(M_S=1\) (3 estados) es un \(^3P\) completo (9 estados). Restan 6 con \(M_S=0\): \(M_L=2,1,0,-1,-2\) forman un \(^1D\) (5), y queda \(M_L=0\): un \(^1S\).</li>
<li><b>Términos.</b> \(^3P,{}^1D,{}^1S\) con \(9+5+1=15\) ✓.</li>
<li><b>Hund.</b> Máximo \(S\), luego máximo \(L\): el fundamental es \(^3P\) (con \(J=0,1,2\); como la capa tiene menos de media ocupación, el \(J\) mínimo, \(^3P_0\), es el de menor energía: ejemplos, C y Si).</li>
<li><b>Resultado.</b> <span class="ans">\(np\,n'p\): \(^1S,{}^3S,{}^1P,{}^3P,{}^1D,{}^3D\) (36 estados); \(np^2\): \(^3P,{}^1D,{}^1S\) (15 estados); fundamental \(^3P_0\).</span></li>
</ol></details></li>
</ol>
