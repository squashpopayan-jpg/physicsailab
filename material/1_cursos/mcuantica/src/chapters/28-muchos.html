<template class="chapter-src" data-id="muchos" data-num="28" data-title="Átomos de muchos electrones" data-part="Parte VI · Muchos cuerpos" data-short="Aproximación de campo central, ecuaciones de Hartree–Fock y la energía de correlación, el método de Roothaan con gaussianas, el helio, la tabla periódica y las reglas de Slater y de Hund">
<p class="lead">El helio ya no tiene solución exacta; un átomo de uranio tiene 92 electrones que se repelen entre sí. Aun así, la tabla periódica y la química se explican con una idea sencilla: cada electrón se mueve en el campo promedio del núcleo y de los demás. Este capítulo formula esa idea con rigor (Hartree–Fock), la resuelve para el helio con una base de gaussianas, mide lo que deja fuera (la energía de correlación) y deduce el patrón de la tabla periódica y de los potenciales de ionización.</p>

<section>
<h2>Campo central y ecuaciones de Hartree–Fock</h2>
<p>El hamiltoniano de un átomo de \(N\) electrones es \(H=\sum_i\left(-\tfrac12\nabla_i^2-\tfrac Z{r_i}\right)+\sum_{i\lt j}\tfrac1{r_{ij}}\) en unidades atómicas. La repulsión \(1/r_{ij}\) impide separar las variables. La aproximación de <span class="term">campo central</span> la reemplaza por un potencial promedio de simetría esférica \(V_\text{ef}(r)\) que cada electrón siente: los orbitales son \(\psi_{nlm}=R_{nl}(r)Y_{lm}\), con la numeración del hidrógeno, y la energía de cada capa depende de \(n\) y \(l\) (la degeneración en \(l\) se rompe: el potencial no es \(1/r\)). El método de <span class="term">Hartree–Fock</span> encuentra el <em>mejor</em> determinante de Slater (capítulo 27) mediante el principio variacional (capítulo 21): los orbitales \(\phi_i\) cumplen</p>
<div class="eq key" data-name="Ecuaciones de Hartree–Fock">\[\hat F\phi_i=\varepsilon_i\phi_i,\qquad\hat F=-\tfrac12\nabla^2-\frac Zr+\sum_j\left(\hat J_j-\hat K_j\right),\qquad E_\text{HF}=\sum_ih_{ii}+\tfrac12\sum_{ij}(J_{ij}-K_{ij}),\]</div>
<p>donde \(\hat J_j\) es el potencial de Coulomb de la densidad del electrón \(j\) (el campo de Hartree) y \(\hat K_j\) el <em>operador de intercambio</em> (capítulo 27), no local, que elimina la autointeracción (\(J_{ii}=K_{ii}\)). Las ecuaciones son no lineales (el operador depende de los orbitales) y se resuelven iterando hasta la autoconsistencia (SCF). El <span class="term">teorema de Koopmans</span> da la interpretación de las energías orbitales: \(-\varepsilon_i\) es aproximadamente la energía necesaria para extraer el electrón \(i\) (sin que los demás se relajen). La energía que Hartree–Fock no captura, por tratar a los electrones como independientes salvo por el intercambio, es la <span class="term">energía de correlación</span> \(E_c=E_\text{exacta}-E_\text{HF}\) (negativa, y de apenas el 1 % de la energía total pero comparable con la energía de los enlaces químicos). Con una base de funciones \(\{\chi_i\}\), el problema se convierte en las ecuaciones de Roothaan, \(\mathsf F\mathbf c=\varepsilon\mathsf S\mathbf c\) (capítulo 21), con \(F_{ij}=h_{ij}+\sum_{kl}P_{kl}[(ij|kl)-\tfrac12(ik|jl)]\) y las integrales de repulsión \((ij|kl)\); para gaussianas \(s\), \((ij|kl)=\dfrac{2\pi^{5/2}}{pq\sqrt{p+q}}\) con \(p=a_i+a_j\), \(q=a_k+a_l\).</p>
<div class="sim" data-sim="hf-dos" data-title="Hartree–Fock con gaussianas para el helio y los iones de dos electrones"></div>
<div class="sim-guide"><ul>
<li>Helio con \(N=8\) gaussianas (\(a_1=0.05\), \(\beta=3.2\)): \(E_\text{HF}=-2.86113\) hartree, cerca del límite de Hartree–Fock (\(-2.86168\)); la energía exacta es \(-2.90372\): la <em>energía de correlación</em> es \(-0.04204\) hartree \(=-1.144\) eV (1.45 % de la energía total). Con \(N=10\) (\(a_1=0.03\), \(\beta=3\)): \(-2.86156\). La energía orbital \(\varepsilon=-0.91795\) hartree da, por Koopmans, \(I=24.98\) eV (experimental 24.59 eV).</li>
<li>Con solo \(N=3\) la energía es \(-2.244\), muy lejos: la base no cubre el rango del orbital (es la lentitud de las gaussianas con el cúspide). Al aumentar \(Z\) la energía de correlación crece lentamente (\(-0.0435\) para Li\(^+\), \(-0.0451\) para C\(^{4+}\)) y la HF mejora en términos relativos. El orbital HF (curva azul) es más compacto en el origen que \(\ee^{-\zeta r}\) con \(\zeta=Z-5/16\); la diferencia de energías es \(-0.38\) eV: HF es mejor que el ajuste de un parámetro.</li>
</ul></div>
</section>

<section>
<h2>La tabla periódica</h2>
<p>El llenado de las capas sigue de la mecánica cuántica con el principio de exclusión: cada subcapa \((n,l)\) tiene \(2(2l+1)\) lugares. Las energías orbitales en un átomo dependen de \(n\) y de \(l\): los orbitales \(s\) <em>penetran</em> cerca del núcleo, donde sienten menos apantallamiento, y por tanto \(E_{ns}\lt E_{np}\lt E_{nd}\lt E_{nf}\). La regla de Madelung (Janet, Klechkowsky) los ordena por \(n+l\) creciente y, a igual \(n+l\), por \(n\) creciente: \(1s\,|\,2s\,2p\,|\,3s\,3p\,|\,4s\,3d\,4p\,|\,5s\,4d\,5p\,|\dots\) Los gases nobles (\(Z=2,10,18,36\)) cierran una capa: grandes potenciales de ionización (24.6, 21.6, 15.8, 14.0 eV); el siguiente electrón entra en una capa nueva y menos ligada (los alcalinos: 5.4, 5.1, 4.3 eV).</p>
<p>Las reglas de Slater estiman la <em>carga efectiva</em> que siente un electrón, \(Z_\text{ef}=Z-\sigma\), con una constante de apantallamiento \(\sigma\) que suma las contribuciones de los demás: 0.35 por cada electrón del mismo grupo (0.30 en \(1s\)), 0.85 por cada uno de la capa \(n-1\) (para \(s,p\)) y 1.00 por cada uno de capas inferiores. Como \(Z_\text{ef}\) del electrón externo crece a lo largo de un período (de 1.30 en el Li a 5.85 en el Ne), el orbital se contrae y el potencial de ionización aumenta; al empezar el período siguiente, \(n\) crece y el electrón queda lejos y casi apantallado por completo (\(Z_\text{ef}=2.20\) en el Na). Los metales de transición se explican porque la capa \(3d\) se llena después de la \(4s\) (menos penetrante), y las excepciones (Cr: \(3d^54s^1\), Cu: \(3d^{10}4s^1\)) por la estabilidad de las subcapas semillenas o llenas debida al intercambio.</p>
<div class="sim" data-sim="periodica" data-title="Los potenciales de ionización y la configuración de cada elemento"></div>
<div class="sim-guide"><ul>
<li>Sodio (\(Z=11\)): \(1s^22s^22p^63s^1\), \(I=5.139\) eV, un electrón de valencia con \(Z_\text{ef}=2.20\) y \(n^*=3\); \(\langle r\rangle\approx n^{*2}/Z_\text{ef}=4.09\,a_0\). Neón (\(Z=10\)): \(I=21.565\) eV, con \(Z_\text{ef}=5.85\) y el orbital más compacto (\(0.68\,a_0\)).</li>
<li>El cromo (\(Z=24\)) llega con \(3d^44s^2\) por Madelung, pero experimentalmente es \(3d^54s^1\): una subcapa \(d\) semillena con seis electrones de espín paralelo. El cobre (\(Z=29\)): \(3d^{10}4s^1\).</li>
</ul></div>
</section>

<section>
<h2>Apantallamiento, subcapas y la regla de Hund</h2>
<p>Los términos de una configuración (capítulo 16) se ordenan con las <span class="term">reglas de Hund</span>: (1) el máximo espín total \(S\), (2) con ese \(S\), el máximo \(L\), (3) \(J=|L-S|\) si la subcapa está menos de media llena y \(J=L+S\) si está más de media llena. La primera es consecuencia del hueco de intercambio (capítulo 27): los electrones con espín paralelo se evitan y se repelen menos. El nitrógeno (\(2p^3\)) tiene como fundamental \(^4S_{3/2}\) (semillena: espín máximo 3/2); el oxígeno (\(2p^4\)), \(^3P_2\); el hierro (\(3d^6\)), \(^5D_4\). Para configuraciones con electrones equivalentes, los términos permitidos los limita el principio de Pauli (capítulo 16).</p>
<div class="sim" data-sim="slater" data-title="Apantallamiento de Slater: carga efectiva y energía de cada subcapa"></div>
<div class="sim-guide"><ul>
<li>Potasio (\(Z=19\)): \(Z_\text{ef}=2.20\) para el electrón \(4s\) (el apantallamiento de los 18 electrones internos: \(0.85\times8+1.00\times10=16.8\)). Hierro (\(Z=26\)): \(4s\): \(Z_\text{ef}=3.75\) (\(E=-14.0\) eV con \(n^*=3.7\)), \(3d\): \(Z_\text{ef}=6.25\) (\(E=-59.1\) eV): los \(3d\) son más compactos y quedan más profundos que los \(4s\) en el átomo neutro.</li>
<li>La energía de Slater, \(-13.606\,Z_\text{ef}^2/n^{*2}\), da tendencias correctas (sobreestima los potenciales de ionización de los gases nobles, porque ignora la repulsión mutua de los electrones de valencia). Sirve sobre todo para estimar tamaños orbitales: \(\langle r\rangle\approx n^{*2}/Z_\text{ef}\).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Escriba las configuraciones electrónicas fundamentales de N (\(Z=7\)), S (16), Fe (26) y Cu (29), indicando las excepciones.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Orden de llenado.</b> \(1s\ 2s\ 2p\ 3s\ 3p\ 4s\ 3d\ 4p\ \dots\) con capacidades 2, 2, 6, 2, 6, 2, 10, 6.</li>
<li><b>N (7).</b> \(1s^22s^22p^3\).</li>
<li><b>S (16).</b> \(1s^22s^22p^63s^23p^4=[\mathrm{Ne}]3s^23p^4\).</li>
<li><b>Fe (26).</b> \([\mathrm{Ar}]\,4s^23d^6\) (por Madelung se llena \(4s\) antes que \(3d\)).</li>
<li><b>Cu (29).</b> Madelung daría \([\mathrm{Ar}]3d^94s^2\), pero la configuración real es \([\mathrm{Ar}]3d^{10}4s^1\) (subcapa \(d\) llena).</li>
<li><b>Resultado.</b> <span class="ans">N: \(1s^22s^22p^3\); S: \([\mathrm{Ne}]3s^23p^4\); Fe: \([\mathrm{Ar}]3d^64s^2\); Cu: \([\mathrm{Ar}]3d^{10}4s^1\) (excepción; también el Cr: \(3d^54s^1\)).</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Con las reglas de Hund halle el término fundamental \(^{2S+1}L_J\) de \(2p^3\) (N), \(2p^4\) (O) y \(3d^6\) (Fe).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>\(2p^3\).</b> Tres orbitales con espín paralelo: \(M_S=\tfrac32\Rightarrow S=\tfrac32\); \(m_l=1,0,-1\Rightarrow L=0\); semillena: \(J=S=\tfrac32\): \(^4S_{3/2}\).</li>
<li><b>\(2p^4\).</b> Una pareja apareada y dos desapareados: \(S=1\); la pareja en \(m_l=1\) y los otros en 0 y \(-1\): \(M_L=1\Rightarrow L=1\); más de media llena: \(J=L+S=2\): \(^3P_2\).</li>
<li><b>\(3d^6\).</b> Cinco electrones con espín \(\uparrow\) y uno \(\downarrow\): \(S=2\); el \(\downarrow\) en \(m_l=2\): \(L=2\); más de media llena: \(J=4\): \(^5D_4\).</li>
<li><b>Resultado.</b> <span class="ans">N: \(^4S_{3/2}\); O: \(^3P_2\); Fe: \(^5D_4\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Con las reglas de Slater halle \(Z_\text{ef}\) del electrón de valencia del Li, Na y K y estime \(E=13.606\,Z_\text{ef}^2/n^{*2}\); compárelas con el potencial de ionización medido (5.392, 5.139, 4.341 eV).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Li (\(2s\)).</b> Apantallamiento: 2 electrones de \(1s\) (capa \(n-1\)): \(\sigma=0.85\times2=1.70\); \(Z_\text{ef}=3-1.70=1.30\); \(n^*=2\).</li>
<li><b>Na (\(3s\)).</b> \(\sigma=0.85\times8+1.00\times2=8.80\); \(Z_\text{ef}=11-8.8=2.20\); \(n^*=3\).</li>
<li><b>K (\(4s\)).</b> \(\sigma=0.85\times8+1.00\times10=16.8\); \(Z_\text{ef}=19-16.8=2.20\); \(n^*=3.7\).</li>
<li><b>Energías.</b> Li: \(13.606\times1.69/4=5.748\) eV; Na: \(13.606\times4.84/9=7.317\) eV; K: \(13.606\times4.84/13.69=4.810\) eV.</li>
<li><b>Comparación.</b> Errores: \(+6.6\,\%\), \(+42\,\%\), \(+11\,\%\); el sodio sale mal (\(n^*=3\) y apantallamiento insuficiente).</li>
<li><b>Resultado.</b> <span class="ans">\(Z_\text{ef}=1.30,\ 2.20,\ 2.20\); \(E=5.75,\ 7.32,\ 4.81\) eV (medidos: 5.39, 5.14, 4.34 eV): tendencias correctas, valores a ~10–40 %.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>El Hartree–Fock del helio da \(E_\text{HF}=-2.86168\) hartree y \(\varepsilon=-0.91795\) hartree. Calcule la energía de correlación, el potencial de ionización de Koopmans y las diferencias con el modelo de carga efectiva (\(-2.84766\)).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Correlación.</b> \(E_c=E_\text{exacta}-E_\text{HF}=-2.90372+2.86168=-0.04204\) hartree \(=-1.144\) eV.</li>
<li><b>Fracción.</b> \(0.04204/2.90372=1.45\,\%\) de la energía total.</li>
<li><b>Koopmans.</b> \(I_K=-\varepsilon=0.91795\) hartree \(=24.98\) eV (experimento: 24.59 eV, error 1.6 %: la relajación del \(\mathrm{He}^+\) y la correlación se compensan en parte).</li>
<li><b>Frente al modelo variacional.</b> \(E_\text{HF}-E_\text{var}=-2.86168+2.84766=-0.01402\) hartree \(=-0.382\) eV: HF baja la energía más allá del ajuste de la carga efectiva (que usa \(\ee^{-\zeta r}\) con un parámetro).</li>
<li><b>Resultado.</b> <span class="ans">\(E_c=-0.04204\) hartree (\(-1.144\) eV, 1.45 %); \(I_K=24.98\) eV; HF está 0.382 eV por debajo del modelo de un parámetro.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Resuelva el helio de Hartree–Fock con una sola gaussiana normalizada \(g=(2a/\pi)^{3/4}\ee^{-ar^2}\): obtenga \(E(a)\) y el óptimo; compárelo con el límite HF.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Valores esperados.</b> \(\langle T\rangle=\tfrac32a\), \(\langle1/r\rangle=2\sqrt{2a/\pi}\) y \(J=(gg|gg)=2\sqrt{a/\pi}\).</li>
<li><b>Energía.</b> \(E=2\left[\tfrac32a-2\sqrt{\tfrac{2a}\pi}\right]+2\sqrt{\tfrac a\pi}=3a-\dfrac{(8\sqrt2-2)}{\sqrt\pi}\sqrt a\)</li>
<li><b>Mínimo.</b> Con \(u=\sqrt a\): \(E=3u^2-cu\), \(c=\dfrac{8\sqrt2-2}{\sqrt\pi}=5.2547\); \(u^*=c/6\Rightarrow a^*=\dfrac{c^2}{36}=0.76700\).</li>
<li><b>Energía.</b> \(E_\text{mín}=-\dfrac{c^2}{12}=-2.30099\) hartree.</li>
<li><b>Comparación.</b> El límite HF es \(-2.86168\): una gaussiana da un 80 % de la energía; con 8 gaussianas se llega al 99.98 %.</li>
<li><b>Resultado.</b> <span class="ans">\(E(a)=3a-4Z\sqrt{2a/\pi}+2\sqrt{a/\pi}\) con \(Z=2\); \(a^*=0.7670\), \(E=-2.3010\) hartree.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Halle los términos de la configuración \(d^2\) (dos electrones \(d\) equivalentes), compruebe su dimensión y el fundamental.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Estados.</b> \(\binom{10}2=45\) (principio de Pauli).</li>
<li><b>Tabla \((M_L,M_S)\).</b> \(M_S=\pm1\): \(M_L=3,2,1,0,-1,-2,-3\) pero sin repetir orbital: con espín igual hay \(\binom52=10\) estados por cada \(M_S=\pm1\) (\(M_L=3,\dots,-3\) con multiplicidades 1,1,2,2,2,1,1 → sumas 10); \(M_S=0\): 25 estados.</li>
<li><b>Descomposición.</b> \(S=1\): \(L=3\) (\(^3F\), 21 estados) y \(L=1\) (\(^3P\), 9): total 30 con \(M_S=\pm1,0\). Con \(S=0\): \(L=4\) (\(^1G\), 9), \(L=2\) (\(^1D\), 5), \(L=0\) (\(^1S\), 1): 15.</li>
<li><b>Suma.</b> \(21+9+9+5+1=45\) ✓.</li>
<li><b>Hund.</b> Máximo \(S\) (\(S=1\)) y máximo \(L\) (\(L=3\)): el fundamental es \(^3F\); como la subcapa está menos de la mitad llena, \(J=L-S=2\): \(^3F_2\) (ejemplos: Ti, Ni\(^{2+}\)).</li>
<li><b>Resultado.</b> <span class="ans">\(d^2\): \(^1S,\ ^1D,\ ^1G,\ ^3P,\ ^3F\) (\(1+5+9+9+21=45\)); fundamental \(^3F_2\).</span></li>
</ol></details></li>
</ol>
