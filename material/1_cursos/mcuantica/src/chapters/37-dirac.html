<template class="chapter-src" data-id="dirac" data-num="37" data-title="La ecuación de Dirac: hacia la mecánica cuántica relativista" data-part="Parte VIII · Caminos de Feynman y mecánica relativista" data-short="Linealización de la relación relativista, espinores de onda plana y energías negativas, el momento magnético g = 2, el temblor del electrón (zitterbewegung), la paradoja de Klein y el átomo hidrogenoide exacto">
<p class="lead">La ecuación de Schrödinger no es relativista: trata el tiempo y el espacio de modo asimétrico y su energía cinética es \(p^2/2m\). Los intentos de «relativizarla» con \(E^2=p^2c^2+m^2c^4\) chocan con dos dificultades: la ecuación de Klein–Gordon es de segundo orden en el tiempo y su densidad de probabilidad no es definida positiva. Dirac (1928) buscó una ecuación de primer orden en \(\partial_t\) y en \(\nabla\), con una densidad positiva, y la encontró a costa de introducir espinores de cuatro componentes. De ella salen, sin añadirlos, el espín \(\tfrac12\), el momento magnético \(g=2\), la estructura fina del hidrógeno, y también lo inesperado: las soluciones de energía negativa, la antimateria (el positrón, descubierto en 1932) y un temblor del electrón a la frecuencia \(2mc^2/\hb\).</p>

<section>
<h2>De la relación relativista a la ecuación de Dirac</h2>
<p>Se exige un hamiltoniano lineal en el momento, \(H=c\,\vec\alpha\cdot\vec p+\beta mc^2\), tal que \(H^2=p^2c^2+m^2c^4\). Eso obliga a que \(\alpha_i\) y \(\beta\) sean matrices que cumplan el álgebra</p>
<div class="eq key" data-name="Álgebra de Dirac">\[\{\alpha_i,\alpha_j\}=2\delta_{ij},\qquad\{\alpha_i,\beta\}=0,\qquad\alpha_i^2=\beta^2=1,\]</div>
<p>que no tiene soluciones de dimensión menor que 4. Una elección es \(\alpha_i=\begin{pmatrix}0&\sigma_i\\\sigma_i&0\end{pmatrix}\), \(\beta=\begin{pmatrix}1&0\\0&-1\end{pmatrix}\) (cada bloque de \(2\times2\)). La función de onda \(\psi\) es un espinor de cuatro componentes (dos para el espín, dos para el signo de la energía), y la ecuación \(\ii\hb\,\partial_t\psi=H\psi\) tiene la forma covariante \((\ii\hb\gamma^\mu\partial_\mu-mc)\psi=0\) con \(\gamma^0=\beta\), \(\gamma^i=\beta\alpha_i\), \(\{\gamma^\mu,\gamma^\nu\}=2g^{\mu\nu}\). La densidad \(\rho=\psi^\dagger\psi\ge0\) es positiva y cumple la ecuación de continuidad con la corriente \(\vec j=c\,\psi^\dagger\vec\alpha\psi\): la velocidad del electrón es el operador \(c\vec\alpha\), cuyos autovalores son \(\pm c\).</p>
<p>Las ondas planas son espinores \(u(\vec p)\,\ee^{\ii(\vec p\cdot\vec x-Et)/\hb}\) con \(E=\pm\sqrt{p^2c^2+m^2c^4}\):</p>
<div class="eq key" data-name="Espinores de onda plana">\[u_+(\vec p)=\sqrt{\frac{E+mc^2}{2E}}\begin{pmatrix}\chi\\\dfrac{c\,\vec\sigma\cdot\vec p}{E+mc^2}\chi\end{pmatrix},\qquad u_-(\vec p)=\sqrt{\frac{E+mc^2}{2E}}\begin{pmatrix}-\dfrac{c\,\vec\sigma\cdot\vec p}{E+mc^2}\chi\\\chi\end{pmatrix},\]</div>
<p>donde \(\chi\) es un espinor de Pauli arbitrario (los dos estados de espín) y \(E=+\sqrt{p^2c^2+m^2c^4}\). En el límite no relativista, la componente «pequeña» es \(\sim v/2c\) veces la grande, y la ecuación de Dirac se reduce a la de Pauli, \(\big[\tfrac{(\vec p-e\vec A)^2}{2m}-\tfrac{e\hb}{2m}\vec\sigma\cdot\vec B\big]\chi=E\chi\): el espín y el momento magnético con <em>\(g=2\)</em> salen sin suposición alguna. Un efecto vistoso es la cuantización de Landau, \(E_n=\sqrt{m^2c^4+2n\hb c^2eB}\) (con \(p_z=0\)): el nivel \(n=0\) está <em>exactamente</em> en \(mc^2\), porque con \(g=2\) la energía de punto cero del movimiento ciclotrónico se cancela con la del espín. La corrección anómala \(a=(g-2)/2=\alpha/2\pi=0.0011614\) (Schwinger) viene de la electrodinámica cuántica, no de Dirac.</p>
<p>Los estados de energía negativa no se pueden descartar: sin ellos las soluciones no forman un conjunto completo, y un electrón de energía positiva decaería a ellos radiando. Dirac propuso que están <em>todos ocupados</em> (el «mar» de Dirac) y que un hueco en el mar se comporta como una partícula de carga opuesta y masa igual: el <span class="term">positrón</span>. La interpretación moderna (teoría cuántica de campos) trata partícula y antipartícula en pie de igualdad, con el umbral de creación de pares \(2mc^2=1.022\) MeV.</p>
</section>

<section>
<h2>Zitterbewegung: el temblor del electrón</h2>
<p>La velocidad \(c\vec\alpha\) no conmuta con \(H\), y su valor medio contiene un término que oscila a la frecuencia \(2E/\hb\), por la interferencia entre las componentes de energía positiva y negativa del paquete (Schrödinger, 1930). En una dimensión, \(H=\sigma_xk+\sigma_zm\) (\(\hb=c=1\)) se resuelve exactamente en el espacio de momentos por una rotación \(\ee^{-\ii Et\,\hat n\cdot\vec\sigma}\) por modo. Para un electrón en reposo con la mezcla de signos más desfavorable, la posición oscila con amplitud \(\hb/2mc=1.93\times10^{-13}\) m (la mitad de la longitud de Compton reducida) y frecuencia \(2mc^2/\hb=1.55\times10^{21}\ \text{s}^{-1}\) (periodo \(4.05\times10^{-21}\) s), imposibles de medir directamente en un electrón libre; el efecto sí se ha simulado con iones atrapados (Gerritsma et al., 2010) y con redes ópticas. Si el paquete es mucho más ancho que \(\hb/mc\), casi no tiene componentes de energía negativa y el temblor desaparece: el peso negativo es \(\int|g(k)|^2\frac{E-m}{2E}\dd k\).</p>
<div class="sim" data-sim="zitterbewegung" data-title="Zitterbewegung: un paquete de Dirac 1D cuya posición tiembla a la frecuencia 2E"></div>
<div class="sim-guide"><ul>
<li>Con \(\sigma=1\), \(p_0=0\), \(\chi=45^\circ\) (espinor \((1,1)/\sqrt2\)): el peso de energía negativa es \(50\,\%\), la velocidad \(\langle\sigma_x\rangle\) oscila con periodo \(\pi/E_0=3.1416\) y \(\langle x\rangle\) tiembla sobre una deriva lenta; en \(t=3\), \(\langle\sigma_x\rangle=0.8609\). La norma se conserva (\(1.000000\)).</li>
<li>Con \(\sigma=3\) (paquete muy ancho) el temblor de \(\langle x\rangle\) sigue entre \(-0.42\) y \(0.71\) (amplitud \(\lesssim0.5\), la cota \(\hb/2mc\)). Con \(\chi=0\) (espinor puro \((1,0)\)), \(\sigma=0.4\), \(p_0=1\): \(\langle x\rangle\) crece de \(0\) a \(2.80\) por el movimiento de grupo \(p/E\).</li>
</ul></div>
</section>

<section>
<h2>La paradoja de Klein</h2>
<p>Una partícula de energía \(E>mc^2\) incide sobre un escalón de potencial \(V_0\). Si \(V_0<E-m\), pasa con la transmisión normal; si \(E-m<V_0<E+m\), el momento del otro lado es imaginario y la reflexión es total (onda evanescente); pero si \(V_0>E+m\) reaparece una onda propagante, y la partícula atraviesa con probabilidad <em>no nula, incluso para escalones muy altos</em>, algo que la mecánica no relativista nunca permite (efecto túnel suprimido exponencialmente). La causa: dentro del escalón, el estado transmitido es del continuo de <em>energía negativa</em> (\(E-V_0<-m\)): un hueco / antipartícula. Igualando los espinores en \(x=0\) y eligiendo la onda transmitida con velocidad de grupo hacia \(+x\) (el momento \(k=-q\) cuando \(E-V_0<0\)):</p>
<div class="eq key" data-name="Escalón de Dirac">\[r=\frac{k\,(E+m)}{p\,(E-V_0+m)},\quad R=\left(\frac{1-r}{1+r}\right)^2,\quad T=\frac{4r}{(1+r)^2},\quad R+T=1;\qquad T_\infty=\frac{4p(E+m)}{(p+E+m)^2}\ \ (V_0\to\infty).\]</div>
<p>(\(p=\sqrt{E^2-m^2}\), \(q=\sqrt{(E-V_0)^2-m^2}\), \(c=1\).) No hay paradoja si se interpreta correctamente: la barrera se hace «transparente» porque el campo es suficientemente fuerte (\(V_0>2mc^2\)) para crear pares; es el origen del <em>túnel de Klein</em> observado en grafeno (cuasipartículas de Dirac sin masa), donde la transmisión normal es 1.</p>
<div class="sim" data-sim="klein" data-title="Escalón de Dirac y paradoja de Klein: la transmisión no se anula para V₀ grandes"></div>
<div class="sim-guide"><ul>
<li>Con \(E=2mc^2\): \(V_0=0.5\) da \(r=0.7746\), \(T=0.98387\), \(R=0.01613\); \(V_0\in(1,3)\): reflexión total; \(V_0=5\) (régimen de Klein): \(q=2.8284\), \(r=2.4495\), \(R=0.17657\), \(T=0.82343\); y \(V_0\to\infty\): \(T_\infty=0.92820\).</li>
<li>La suma \(R+T=1\) en todos los regímenes. Para \(E\to m\) (partícula lenta), \(T_\infty\to0\); para \(E\gg m\), \(T_\infty\to1\): el túnel de Klein es perfecto a altas energías.</li>
</ul></div>
</section>

<section>
<h2>El átomo hidrogenoide de Dirac</h2>
<p>Con el potencial de Coulomb \(V=-Ze^2/4\pi\varepsilon_0r\) la ecuación de Dirac se resuelve exactamente. Los niveles dependen solo de \(n\) y del momento angular total \(j\) (no de \(l\)):</p>
<div class="eq key" data-name="Niveles de Dirac del hidrogenoide">\[E_{nj}=mc^2\left[1+\frac{(Z\alpha)^2}{\big(n-\delta_j\big)^2}\right]^{-1/2},\qquad\delta_j=j+\tfrac12-\sqrt{\big(j+\tfrac12\big)^2-(Z\alpha)^2}.\]</div>
<p>Al desarrollar en \(Z\alpha\), el primer término es \(mc^2-\tfrac12mc^2(Z\alpha)^2/n^2\) (Bohr) y el siguiente es la estructura fina \(\propto(Z\alpha)^4\) del capítulo 20: \(\Delta E_{2p}=E_{2p_{3/2}}-E_{2p_{1/2}}=Z^4\alpha^4mc^2/32\), que para el hidrógeno es \(4.528\times10^{-5}\) eV \(=10.95\) GHz. Los niveles \(2s_{1/2}\) y \(2p_{1/2}\) son <em>exactamente degenerados</em> en Dirac; el experimento de Lamb–Retherford (1947) los encontró separados 1057 MHz (el desplazamiento de Lamb: efecto de las fluctuaciones del vacío del capítulo 35, base de la QED). Para \(Z\alpha\to1\) (\(Z=137\)), la raíz cuadrada del 1s, \(E_{1s}=mc^2\sqrt{1-(Z\alpha)^2}\), tiende a 0: con un núcleo puntual la ecuación deja de tener solución; con un núcleo de tamaño finito el nivel sigue bajando hasta \(-mc^2\) en \(Z\approx173\), donde se hunde en el continuo negativo y el vacío crea pares espontáneamente (el régimen supercrítico).</p>
<div class="sim" data-sim="dirac-hidrogeno" data-title="Niveles de Dirac de un átomo hidrogenoide: la corrección relativista crece con Z"></div>
<div class="sim-guide"><ul>
<li>Para el uranio hidrogenoide (\(Z=92\)): \(E_{1s}=0.74113\,mc^2\); ligadura \(132.28\) keV frente a \(115.16\) keV no relativista (cociente \(1.1487\)); desdoblamiento fino \(2p_{3/2}-2p_{1/2}\): \(4565.6\) eV exacto frente a \(3244.0\) eV de la fórmula \(\alpha^4\) (la serie en \(Z\alpha\) converge mal).</li>
<li>Para el hidrógeno (\(Z=1\)): ligadura \(0.013606\) keV (cociente \(1.00001\)), desdoblamiento \(4.5284\times10^{-5}\) eV; el cociente a Bohr crece como \(1+(Z\alpha)^2/4+\cdots\).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un electrón con \(\vec p=(0,0,mc)\) y espín «hacia arriba» (\(\chi=(1,0)\)). Halle \(E\), el espinor \(u_+\) normalizado y la razón entre las componentes pequeña y grande, y verifique que \(Hu=Eu\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Energía.</b> \(E=\sqrt{p^2c^2+m^2c^4}=\sqrt2\,mc^2=1.4142\,mc^2=722.66\) keV.</li>
<li><b>Factor de normalización.</b> \(\sqrt{(E+m)/2E}=\sqrt{2.4142/2.8284}=0.9239\) (con \(c=1\)).</li>
<li><b>Componente pequeña.</b> \(\vec\sigma\cdot\vec p\,\chi=p\,\sigma_z(1,0)=(p,0)\): razón \(p/(E+m)=1/(1+\sqrt2)=0.4142\).</li>
<li><b>Espinor.</b> \(u_+=(0.9239,\,0,\,0.3827,\,0)\): \(u^\dagger u=0.9239^2+0.3827^2=0.8536+0.1464=1\).</li>
<li><b>Comprobación.</b> Primera fila de \(H=\alpha_zp+\beta m\): \(m\,u_1+p\,u_3=0.9239+0.3827=1.3066\); \(E\,u_1=1.4142\times0.9239=1.3066\) ✓. Tercera fila: \(p\,u_1-m\,u_3=0.9239-0.3827=0.5412=E\,u_3=1.4142\times0.3827\) ✓.</li>
<li><b>Resultado.</b> <span class="ans">\(E=\sqrt2\,mc^2\); \(u_+=(0.9239,0,0.3827,0)\); razón \(0.4142\); \(Hu=Eu\).</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Halle la frecuencia, el periodo y la amplitud del zitterbewegung de un electrón en reposo y compárelos con la longitud de Compton reducida.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Frecuencia.</b> Interfieren las componentes \(\pm E\) con \(E=mc^2\): \(\omega=2mc^2/\hb=2\times8.187\times10^{-14}/1.0546\times10^{-34}=1.553\times10^{21}\ \text{s}^{-1}\).</li>
<li><b>Periodo.</b> \(2\pi/\omega=4.05\times10^{-21}\) s (en 1D, con \(\langle\sigma_x\rangle=\cos2mt\), el periodo de \(\langle\sigma_x\rangle\) es \(\pi\hb/mc^2\), el mismo).</li>
<li><b>Amplitud.</b> \(\langle x\rangle=\hb\sin(2mc^2t/\hb)/(2mc)\): \(\hb/2mc=1.931\times10^{-13}\) m.</li>
<li><b>Longitud de Compton reducida.</b> \(\hb/mc=3.862\times10^{-13}\) m: la amplitud es la mitad.</li>
<li><b>Interpretación.</b> La amplitud es del tamaño de la región donde un paquete tendría energía suficiente para crear pares (\(\Delta p\,c\sim mc^2\)): por debajo de la longitud de Compton no hay partícula única, y el campo de un solo electrón deja de ser consistente.</li>
<li><b>Resultado.</b> <span class="ans">\(\omega=1.553\times10^{21}\ \text{s}^{-1}\); periodo \(4.05\times10^{-21}\) s; amplitud \(1.93\times10^{-13}\) m \(=\tfrac12\hb/mc\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Una partícula de \(E=2mc^2\) incide sobre un escalón \(V_0=5mc^2\). Halle \(p\), \(q\), \(r\), \(R\), \(T\) y el límite \(V_0\to\infty\); compare con \(V_0=0.5mc^2\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Momento incidente.</b> \(p=\sqrt{4-1}=1.7321\,mc\).</li>
<li><b>Dentro del escalón.</b> \(\varepsilon=E-V_0=-3\); \(q=\sqrt{9-1}=2.8284\); como \(\varepsilon<-m\), el régimen es de Klein y \(k=-q\) (la velocidad de grupo \(k/\varepsilon>0\)).</li>
<li><b>Razón \(r\).</b> \(r=\dfrac{k(E+m)}{p(\varepsilon+m)}=\dfrac{(-2.8284)(3)}{(1.7321)(-2)}=2.4495\).</li>
<li><b>Reflexión y transmisión.</b> \(R=\big(\tfrac{1-2.4495}{1+2.4495}\big)^2=0.17657\); \(T=\tfrac{4(2.4495)}{(3.4495)^2}=0.82343\); \(R+T=1\).</li>
<li><b>Límite \(V_0\to\infty\).</b> \(q\to V_0\), \(k/(\varepsilon+m)\to1\): \(r\to(E+m)/p=1.7321\), \(T_\infty=4p(E+m)/(p+E+m)^2=0.92820\).</li>
<li><b>\(V_0=0.5\).</b> \(\varepsilon=1.5\), \(q=\sqrt{2.25-1}=1.1180\), \(r=\tfrac{1.1180\times3}{1.7321\times2.5}=0.7746\): \(T=0.98387\), \(R=0.01613\). Sin relatividad, con \(V_0=5mc^2\), \(T\) sería exponencialmente pequeña.</li>
<li><b>Resultado.</b> <span class="ans">\(r=2.4495\), \(R=0.1766\), \(T=0.8234\); \(T_\infty=0.9282\); (\(V_0=0.5\): \(T=0.9839\)).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Con la fórmula de Dirac halle, para \(Z=1\) y \(Z=92\), la energía de ligadura del \(1s_{1/2}\) y el desdoblamiento fino \(2p_{3/2}-2p_{1/2}\), y compare con el desarrollo a orden \(\alpha^4\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>\(1s_{1/2}\), \(Z=92\).</b> \(Z\alpha=0.67136\); \(E=mc^2\sqrt{1-0.45071}=0.74113\,mc^2\); ligadura \(=(1-0.74113)\times510.999\) keV \(=132.28\) keV.</li>
<li><b>No relativista.</b> \(\tfrac12(Z\alpha)^2mc^2=115.16\) keV; cociente \(1.1487\) (un 15 % más ligado).</li>
<li><b>\(Z=1\).</b> Ligadura \(13.6059\) eV frente a Bohr \(13.6057\) eV: la diferencia es la corrección fina \(\sim\alpha^2/4\) en términos relativos (\(1.3\times10^{-5}\)).</li>
<li><b>Fina, \(Z=1\).</b> \(\delta_{3/2}\) y \(\delta_{1/2}\) con la fórmula: \(E_{2p_{3/2}}-E_{2p_{1/2}}=4.5284\times10^{-5}\) eV \(=10.950\) GHz (con \(h=4.1357\times10^{-15}\) eV·s); orden \(\alpha^4\): \(\alpha^4mc^2/32=4.5283\times10^{-5}\) eV.</li>
<li><b>Fina, \(Z=92\).</b> Exacto \(4565.6\) eV; orden \(\alpha^4\): \(Z^4\alpha^4mc^2/32=3244.0\) eV: la serie en \(Z\alpha\) ya converge mal (\(Z\alpha=0.67\)).</li>
<li><b>Degeneración.</b> \(2s_{1/2}\) y \(2p_{1/2}\) tienen igual \(n\) y \(j\): \(E\) idéntica; en la realidad se separan 1057 MHz por el desplazamiento de Lamb (QED).</li>
<li><b>Resultado.</b> <span class="ans">\(Z=92\): ligadura \(132.28\) keV (no rel. \(115.16\)), fina \(4565.6\) eV; \(Z=1\): ligadura \(13.6059\) eV, fina \(4.528\times10^{-5}\) eV \(=10.95\) GHz.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Con \(\hb=c=1\), \(m=1\) y \(eB=0.3\), halle los primeros niveles de Landau de Dirac \(E_n=\sqrt{m^2+2neB}\) y compárelos con la aproximación no relativista \(m+n\,eB/m\) y con su desarrollo de segundo orden. ¿Qué significa que \(E_0=m\)?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Hamiltoniano.</b> Con \(\pi_+=\sqrt{2eB}\,a\), \(\pi_-=\sqrt{2eB}\,a^\dagger\), \(H=\alpha\cdot\pi+\beta m\) conecta \(|n+1\rangle\) con \(|n\rangle\) en bloques \(2\times2\): \(\begin{pmatrix}m&\sqrt{2eB(n+1)}\\\sqrt{2eB(n+1)}&-m\end{pmatrix}\), con autovalores \(\pm\sqrt{m^2+2(n+1)eB}\); el estado \(|0\rangle\) de una componente queda aislado con \(E=\pm m\).</li>
<li><b>Valores.</b> \(n=1\): \(\sqrt{1.6}=1.2649\); \(n=2\): \(\sqrt{2.2}=1.4832\); \(n=3\): \(1.6733\); \(n=4\): \(1.8439\).</li>
<li><b>No relativista.</b> \(m+n\,eB/m\): \(1.3,\ 1.6,\ 1.9,\ 2.2\). La diferencia con \(\sqrt{m^2+2neB}\) crece con \(n\): el espaciado \(\hb\omega_c\) deja de ser constante (a energías relativistas la masa efectiva crece).</li>
<li><b>Segundo orden.</b> \(\sqrt{1+x}\approx1+\tfrac x2-\tfrac{x^2}8\) con \(x=2neB\): \(m+neB/m-(neB)^2/2m^3\): \(1.255,\ 1.420,\ 1.495,\ 1.480\) para \(n=1\ldots4\): converge solo para \(neB\ll m^2\).</li>
<li><b>\(E_0=m\).</b> Con \(g=2\), el término de espín \(-\tfrac g2\,\hb\omega_c/2\) del nivel de espín alineado cancela el punto cero \(\hb\omega_c/2\): la energía de Landau más baja de Dirac es exactamente \(mc^2\), sin corrimiento por el campo (\(E_0\) independiente de \(B\)). Con \(g\neq2\) dependería de \(B\).</li>
<li><b>Resultado.</b> <span class="ans">\(E_n=1,\ 1.2649,\ 1.4832,\ 1.6733,\ 1.8439\); no relativista \(1,\ 1.3,\ 1.6,\ 1.9,\ 2.2\); \(E_0=m\) exacto por \(g=2\).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Para el uranio hidrogenoide (\(Z=92\)) estime el radio de la primera órbita de Bohr, compárelo con el radio nuclear (\(\approx7.4\) fm) y halle el \(Z\) para el que el \(1s_{1/2}\) (núcleo puntual) cae a \(E=\tfrac12mc^2\) y el \(Z_c\) en que se anula. Compare el umbral de producción de pares y la energía del estado fundamental del positronio.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Radio de Bohr.</b> \(a_0/Z=5.292\times10^{-11}/92=5.75\times10^{-13}\) m \(=575\) fm: unas 78 veces el radio nuclear, así que el núcleo puntual es una buena aproximación aunque muy relativista (\(v/c\approx Z\alpha=0.67\)).</li>
<li><b>\(E=\tfrac12mc^2\).</b> \(\sqrt{1-(Z\alpha)^2}=0.5\Rightarrow Z\alpha=0.8660\Rightarrow Z=0.8660/0.0072974=118.68\).</li>
<li><b>Colapso.</b> \(E_{1s}=0\) en \(Z\alpha=1\): \(Z_c=1/\alpha=137.04\) (núcleo puntual); con un núcleo extenso, el nivel llega a \(-mc^2\) en \(Z\approx173\).</li>
<li><b>Pares.</b> Umbral de creación: \(2mc^2=1021.998\) keV \(=1.022\) MeV (un electrón y un positrón en reposo).</li>
<li><b>Positronio.</b> Masa reducida \(m/2\): \(E=-13.6057/2=-6.8028\) eV (la mitad que el hidrógeno).</li>
<li><b>Resultado.</b> <span class="ans">\(575\) fm (\(\approx78\) radios nucleares); \(Z=118.68\) para \(E=\tfrac12mc^2\); \(Z_c=137.04\); umbral \(1.022\) MeV; positronio \(-6.8028\) eV.</span></li>
</ol></details></li>
</ol>
</section>
