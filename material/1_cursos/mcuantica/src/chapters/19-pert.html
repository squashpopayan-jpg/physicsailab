<template class="chapter-src" data-id="pert" data-num="19" data-title="Teoría de perturbaciones independiente del tiempo" data-part="Parte IV · Métodos de aproximación" data-short="Series de Rayleigh–Schrödinger para niveles no degenerados y degenerados, correcciones de primer y segundo orden, el oscilador anarmónico como serie asintótica y el efecto Stark del hidrógeno">
<p class="lead">Casi ningún problema real se puede resolver exactamente: el hidrógeno es una excepción. La estrategia más productiva es partir de un problema exacto \(H_0\) y tratar lo que falta como una perturbación pequeña \(\lambda V\). Los niveles y estados se desarrollan en serie de \(\lambda\) con coeficientes calculables a partir de \(H_0\) solamente. Con este método se obtienen la polarizabilidad de un átomo, el efecto Stark, la estructura fina (capítulo 20) y casi toda la espectroscopía.</p>

<section>
<h2>La serie de Rayleigh–Schrödinger</h2>
<p>Sea \(H=H_0+\lambda V\) con \(H_0|n\rangle=E_n^{(0)}|n\rangle\) conocido y \(E_n^{(0)}\) no degenerado. Se escribe \(E_n=E_n^{(0)}+\lambda E_n^{(1)}+\lambda^2E_n^{(2)}+\dots\) y \(|\psi_n\rangle=|n\rangle+\lambda|\psi_n^{(1)}\rangle+\dots\) con la normalización intermedia \(\langle n|\psi_n\rangle=1\). Al sustituir en \(H|\psi\rangle=E|\psi\rangle\) y reunir los términos del mismo orden en \(\lambda\) se obtiene, orden por orden,</p>
<div class="eq">\[(H_0-E_n^{(0)})|\psi_n^{(k)}\rangle=\sum_{j=1}^{k}E_n^{(j)}|\psi_n^{(k-j)}\rangle-V|\psi_n^{(k-1)}\rangle .\]</div>
<p>Proyectando sobre \(\langle n|\) se obtiene \(E_n^{(k)}=\langle n|V|\psi_n^{(k-1)}\rangle\) (la ecuación no se puede invertir en el subespacio de \(|n\rangle\), pues \(H_0-E_n^{(0)}\) es singular ahí) y proyectando sobre \(\langle m|\), \(m\neq n\), se halla el estado. Los dos primeros órdenes son los resultados de uso universal:</p>
<div class="eq key" data-name="Perturbaciones no degeneradas, orden 1 y 2">\[E_n^{(1)}=\langle n|V|n\rangle,\qquad E_n^{(2)}=\sum_{m\neq n}\frac{|\langle m|V|n\rangle|^2}{E_n^{(0)}-E_m^{(0)}},\qquad|\psi_n^{(1)}\rangle=\sum_{m\neq n}\frac{\langle m|V|n\rangle}{E_n^{(0)}-E_m^{(0)}}|m\rangle.\]</div>
<p>El primer orden es el valor esperado de la perturbación en el estado sin perturbar. El segundo orden de un <em>estado fundamental</em> es siempre negativo (todos los denominadores lo son): la perturbación siempre baja el nivel más bajo, un caso de «repulsión de niveles»: cada nivel es empujado lejos de los que lo acoplan con \(V\), de modo que el superior sube y el inferior baja. El método exige \(|\langle m|V|n\rangle|\ll|E_n^{(0)}-E_m^{(0)}|\); la serie es útil mientras ese cociente sea pequeño, pero en general no converge. Al contrario: casi siempre es una <em>serie asintótica</em>, con un radio de convergencia nulo.</p>
<div class="sim" data-sim="pert-dos" data-title="Dos niveles acoplados: la serie de perturbaciones y su radio de convergencia"></div>
<div class="sim-guide"><ul>
<li>El modelo \(H=\begin{pmatrix}0&V\\V&\Delta\end{pmatrix}\) se resuelve exactamente: \(E=\tfrac\Delta2-\sqrt{\tfrac{\Delta^2}4+V^2}=-\tfrac{V^2}\Delta+\tfrac{V^4}{\Delta^3}-\tfrac{2V^6}{\Delta^5}+\dots\) Con \(V=0.3\Delta\) las sumas parciales son \(-0.0900\) (\(k=1\)), \(-0.0819\) (\(k=2\)) y \(-0.0834\) (\(k=3\)), frente al valor exacto \(-0.0831\,\Delta\).</li>
<li>La serie solo converge para \(|V|\lt\Delta/2\): con \(V=0.6\Delta\) las sumas parciales oscilan y se alejan del valor exacto \(-0.281\,\Delta\). La razón está en la singularidad compleja \(V=\pm\ii\Delta/2\) de la raíz cuadrada, que no se ve en el eje real.</li>
</ul></div>
</section>

<section>
<h2>Estados degenerados</h2>
<p>Si \(E_n^{(0)}\) es degenerado, la fórmula de segundo orden tiene denominadores nulos. La causa es que los estados correctos de orden cero no son arbitrarios dentro del subespacio degenerado: son los que diagonalizan la perturbación. El primer orden de un nivel de degeneración \(g\) se obtiene diagonalizando la matriz \(g\times g\) \(W_{ab}=\langle n,a|V|n,b\rangle\); sus autovalores son las correcciones y sus autovectores, los «buenos» estados. Si \(V\) conmuta con una simetría, los estados correctos ya están determinados por sus números cuánticos: la matriz es diagonal en la base de \(L_z\) si \(V\) es invariante bajo rotaciones alrededor de \(z\).</p>
<div class="box ex"><h4>Efecto Stark del hidrógeno: lineal en \(n=2\), cuadrático en \(n=1\)</h4>
<p><strong>Planteamiento.</strong> Un campo \(\mathbf F=F\hat z\) añade \(V=eFz\) (la carga del electrón es \(-e\); el signo no importa en los resultados). \(V\) tiene paridad impar y conmuta con \(L_z\), de modo que \(\langle nlm|z|n'l'm'\rangle\neq0\) solo si \(m=m'\) y \(l'=l\pm1\). <strong>Estado fundamental.</strong> \(\langle1s|z|1s\rangle=0\): no hay corrección de primer orden (no tiene dipolo permanente). El segundo orden, \(E^{(2)}=-\tfrac12\alpha F^2\), lo da la polarizabilidad \(\alpha=\tfrac92\cdot4\pi\varepsilon_0a_0^3=7.419\times10^{-41}\) C\(^2\)m\(^2\)/J (en unidades atómicas, \(E^{(2)}=-\tfrac94F^2\)); la suma sobre estados incluye el continuo. <strong>Nivel \(n=2\).</strong> Es cuatro veces degenerado (\(2s\), \(2p_0\), \(2p_{\pm1}\)), y el único elemento no nulo es \(\langle2s|z|2p_0\rangle=-3a_0\). La matriz \(2\times2\) \(\begin{pmatrix}0&-3eFa_0\\-3eFa_0&0\end{pmatrix}\) da \(E=\pm3ea_0F\) con los estados \((|2s\rangle\mp|2p_0\rangle)/\sqrt2\): <em>efecto Stark lineal</em>, porque estos estados tienen un dipolo permanente \(\pm3ea_0\) (la degeneración \(l\) del hidrógeno, capítulo 18). Los estados \(2p_{\pm1}\) quedan sin cambio en primer orden. <strong>Resultado.</strong> Con \(F=10^7\) V/m, el desdoblamiento de \(n=2\) es \(\pm1.5875\) meV (separación 3.175 meV) mientras que el corrimiento del estado fundamental es de solo 0.023 µeV: el segundo orden es unas \(6.9\times10^4\) veces menor que el primero.</p></div>
<div class="sim" data-sim="stark-h" data-title="Efecto Stark del hidrógeno: corrimiento cuadrático del 1s y desdoblamiento lineal del n = 2"></div>
<div class="sim-guide"><ul>
<li>Con \(F=20\) MV/m: el estado fundamental baja \(0.093\) µeV con un dipolo inducido de \(1.484\times10^{-33}\) C·m, mientras que el nivel \(n=2\) se abre \(\pm3.175\) meV: el dipolo permanente de los estados \(2s\pm2p_0\) es \(3ea_0=2.54\times10^{-29}\) C·m, \(10^4\) veces mayor que el inducido.</li>
<li>El campo de ionización clásica de \(n=2\) es \(F\approx1/(16n^4)\) u. at. \(=2.0\times10^9\) V/m, al final de la gráfica: más allá, la teoría de perturbaciones deja de valer porque el electrón puede escapar por túnel (capítulo 22).</li>
</ul></div>
</section>

<section>
<h2>El oscilador anarmónico: una serie asintótica</h2>
<p>El ejemplo canónico es \(H=\tfrac12p^2+\tfrac12x^2+gx^4\) (\(\hbar=m=\omega=1\)). Como \(x=(a+a^\dagger)/\sqrt2\), \(\langle n|x^4|n\rangle=\tfrac34(2n^2+2n+1)\) y los elementos fuera de la diagonal conectan \(n\) con \(n\pm2,\pm4\). Al primer y segundo orden</p>
<div class="eq key" data-name="Oscilador con un término g x⁴">\[E_n=n+\tfrac12+\tfrac34(2n^2+2n+1)\,g-\tfrac18(34n^3+51n^2+59n+21)\,g^2+\dots,\qquad E_0=\tfrac12+\tfrac34g-\tfrac{21}8g^2+\tfrac{333}{16}g^3-\tfrac{30885}{128}g^4+\dots\]</div>
<p>Los coeficientes crecen como \(k!\) (Bender y Wu, 1969): la serie tiene radio de convergencia cero. Esto es inevitable: para \(g<0\) el potencial no está acotado inferiormente y el sistema no tiene estado fundamental, de modo que \(E(g)\) tiene una singularidad en \(g=0\). Sin embargo, la serie es una buena aproximación mientras \(g\) sea pequeño: la suma parcial mejora hasta un orden óptimo \(K_\text{opt}\sim1/(\text{const}\cdot g)\) y empeora después. El error mínimo es del orden del primer término omitido, \(\sim\ee^{-c/g}\).</p>
<div class="sim" data-sim="anarmonico" data-title="Oscilador anarmónico g·x⁴: sumas parciales de la serie y su divergencia"></div>
<div class="sim-guide"><ul>
<li>Con \(g=0.05\) y \(n=0\): la energía exacta es \(0.532643\); las sumas parciales son \(0.5375,\ 0.53094,\ 0.53354,\ 0.53203,\ 0.53315,\ \dots\), que oscilan alrededor del valor exacto con amplitud decreciente hasta el orden 5 o 6 y después se alejan. El error mínimo ronda \(10^{-3}\)–\(10^{-4}\).</li>
<li>Con \(g=0.3\) (acoplamiento fuerte) la serie ya diverge desde el segundo orden (\(0.725,\ 0.489,\ 1.051,\ -0.904,\ \dots\)) frente al valor exacto 0.638: no sirve. Los métodos de resumación (Padé, Borel) recuperan resultados útiles de esta serie divergente.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un electrón en una caja de longitud \(L=1\) nm recibe una perturbación \(V=\gamma\,\delta(x-L/2)\) con \(\gamma=0.02\) eV·nm. Halle el corrimiento de primer orden de los niveles \(n=1,2,3\) y compárelo con \(E_1\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Funciones.</b> \(\psi_n=\sqrt{2/L}\sin(n\pi x/L)\).</li>
<li><b>Primer orden.</b> \(E_n^{(1)}=\gamma\,|\psi_n(L/2)|^2=\dfrac{2\gamma}L\sin^2\dfrac{n\pi}2\).</li>
<li><b>Valores.</b> \(n\) impar: \(\sin^2=1\Rightarrow E^{(1)}=2\gamma/L=0.04\) eV; \(n\) par: \(\sin^2=0\Rightarrow0\) (el nodo en el centro).</li>
<li><b>Comparación.</b> \(E_1=\dfrac{\hbar^2\pi^2}{2m_eL^2}=0.3760\) eV: \(E_1^{(1)}/E_1=0.106\), un 10.6 %: la perturbación es pequeña.</li>
<li><b>Resultado.</b> <span class="ans">\(\Delta E_1=\Delta E_3=+0.040\) eV; \(\Delta E_2=0\); \(\Delta E_1/E_1=10.6\,\%\).</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Un oscilador de frecuencia \(\hbar\omega=0.1\) eV y masa \(m_e\) recibe una fuerza uniforme \(F=eE\) con \(E=10^6\) V/m, \(V=-Fx\). Calcule el corrimiento de segundo orden y compárelo con el resultado exacto.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Primer orden.</b> \(\langle n|x|n\rangle=0\Rightarrow E_n^{(1)}=0\).</li>
<li><b>Segundo orden.</b> \(x\) solo conecta \(n\) con \(n\pm1\), \(|\langle n\pm1|x|n\rangle|^2=\tfrac{\hbar}{2m\omega}\{n+1,n\}\): \(E_n^{(2)}=F^2\tfrac\hbar{2m\omega}\left[\dfrac{n+1}{-\hbar\omega}+\dfrac n{\hbar\omega}\right]=-\dfrac{F^2}{2m\omega^2}\), independiente de \(n\).</li>
<li><b>Exacto.</b> Completando el cuadrado, \(\tfrac12m\omega^2x^2-Fx=\tfrac12m\omega^2(x-F/m\omega^2)^2-\tfrac{F^2}{2m\omega^2}\): el mismo desplazamiento, así que la serie termina en el segundo orden.</li>
<li><b>Valores.</b> \(\omega=\hbar\omega/\hbar=1.519\times10^{14}\) rad/s, \(m\omega^2=2.103\times10^{-2}\) N/m, \(F=1.602\times10^{-13}\) N: \(E^{(2)}=-\dfrac{(1.602\times10^{-13})^2}{2\times2.103\times10^{-2}}=-6.10\times10^{-25}\) J \(=-3.81\ \mu\)eV.</li>
<li><b>Resultado.</b> <span class="ans">\(E_n^{(2)}=-F^2/2m\omega^2=-3.81\ \mu\)eV para todo \(n\), exacto; el centro del pozo se desplaza \(F/m\omega^2=7.62\) pm.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Para \(H=\tfrac12p^2+\tfrac12x^2+gx^4\) con \(g=0.05\), calcule la energía del estado fundamental con las series de órdenes 1, 2, 3 y 4 y compárelas con el valor exacto 0.532643.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Coeficientes.</b> \(E_0=\tfrac12+\tfrac34g-\tfrac{21}8g^2+\tfrac{333}{16}g^3-\tfrac{30885}{128}g^4\).</li>
<li><b>Términos.</b> \(g=0.05\): \(0.5\); \(+0.0375\); \(-2.625\times0.0025=-0.0065625\); \(+20.8125\times1.25\times10^{-4}=+0.0026016\); \(-241.289\times6.25\times10^{-6}=-0.0015081\).</li>
<li><b>Sumas.</b> Orden 1: \(0.5375\); orden 2: \(0.5309375\); orden 3: \(0.5335391\); orden 4: \(0.5320310\).</li>
<li><b>Errores.</b> \(+4.9\times10^{-3}\), \(-1.7\times10^{-3}\), \(+9.0\times10^{-4}\), \(-6.1\times10^{-4}\) respecto de 0.532643: la serie oscila con amplitud decreciente (aún dentro del orden óptimo).</li>
<li><b>Resultado.</b> <span class="ans">0.5375, 0.53094, 0.53354, 0.53203 (exacto 0.532643): el error baja del 0.9 % al 0.11 %; con órdenes mayores que ~6 la serie empieza a divergir.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Halle la corrección de los cuatro estados \(n=2\) del hidrógeno en un campo \(F\) y los estados correctos de orden cero; calcule el desdoblamiento para \(F=10^6\) y \(10^7\) V/m.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Elementos.</b> Con \(V=eFz\): paridad y \(m\) dejan solo \(\langle2s|V|2p_0\rangle=W\) con \(|W|=3eFa_0\); todos los demás son nulos.</li>
<li><b>Matriz.</b> En la base \((2s,2p_0)\): \(\begin{pmatrix}0&W\\W&0\end{pmatrix}\); \(2p_{\pm1}\) tienen corrección nula.</li>
<li><b>Autovalores.</b> \(E^{(1)}=\pm|W|=\pm3ea_0F\), con autovectores \((|2s\rangle\pm|2p_0\rangle)/\sqrt2\) (el signo depende del convenio de fase).</li>
<li><b>Valores.</b> \(3ea_0F/e=3\times5.2918\times10^{-11}\,\text{m}\times F\): \(F=10^6\) V/m: \(\pm158.75\ \mu\)eV; \(F=10^7\) V/m: \(\pm1.5875\) meV.</li>
<li><b>Resultado.</b> <span class="ans">Dos estados a \(\pm3ea_0F\) y dos sin cambio; \(\pm158.75\ \mu\)eV (1 MV/m) y \(\pm1.5875\) meV (10 MV/m); desdoblamiento total \(6ea_0F\).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Demuestre (método de Dalgarno–Lewis) que la corrección de primer orden del estado fundamental del hidrógeno en el campo \(F\) es \(\psi^{(1)}=-F\left(r+\tfrac{r^2}2\right)\cos\theta\,\psi_{1s}\), y deduzca \(E^{(2)}=-\tfrac94F^2\) y la polarizabilidad.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Ecuación.</b> En unidades atómicas \((H_0-E_0)\psi^{(1)}=-(Fz-E^{(1)})\psi_0\) con \(E^{(1)}=0\), \(\psi_0=\ee^{-r}/\sqrt\pi\), \(z=r\cos\theta\).</li>
<li><b>Ansatz.</b> \(\psi^{(1)}=f(r)\cos\theta\,\psi_0\). Como \(\nabla^2(f\cos\theta\,\psi_0)=\cos\theta\left[(f\psi_0)''+\tfrac2r(f\psi_0)'-\tfrac2{r^2}f\psi_0\right]\) y \(\psi_0'/\psi_0=-1\), la ecuación se reduce a \(\tfrac12\left[f''+\left(\tfrac2r-2\right)f'-\tfrac2{r^2}f\right]=Fr\).</li>
<li><b>Solución.</b> Probando \(f=-F(r+r^2/2)\): \(f'=-F(1+r)\), \(f''=-F\): \(\tfrac12\left[-F-(\tfrac2r-2)F(1+r)+\tfrac2{r^2}F(r+\tfrac{r^2}2)\right]=\tfrac F2\left[-1-\tfrac2r-2+2+2r+\tfrac2r+1\right]=Fr\) ✓.</li>
<li><b>Segundo orden.</b> \(E^{(2)}=\langle\psi_0|Fz|\psi^{(1)}\rangle=-F^2\cdot\tfrac1\pi\cdot\tfrac{4\pi}3\int_0^\infty\ee^{-2r}\left(r^4+\tfrac{r^5}2\right)\dd r=-\tfrac43F^2\left[\tfrac{4!}{2^5}+\tfrac12\tfrac{5!}{2^6}\right]=-\tfrac43F^2\left[\tfrac34+\tfrac{15}{16}\right]=-\tfrac94F^2\).</li>
<li><b>Polarizabilidad.</b> \(E^{(2)}=-\tfrac12\alpha F^2\Rightarrow\alpha=\tfrac92\) u. at. \(=\tfrac92\,a_0^3\) (en volumen) o \(\tfrac92\cdot4\pi\varepsilon_0a_0^3=7.419\times10^{-41}\) C²m²/J. La suma solo sobre estados ligados daría un valor menor: falta la contribución del continuo.</li>
<li><b>Resultado.</b> <span class="ans">\(\psi^{(1)}=-F(r+r^2/2)\cos\theta\,\psi_{1s}\); \(E^{(2)}=-\tfrac94F^2\); \(\alpha=\tfrac92a_0^3\) (\(4.5\times0.1482\) Å\(^3\) \(=0.6668\) Å\(^3\)).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Para el modelo de dos niveles con \(\Delta=1\): (a) halle la serie de \(E\) en \(V\); (b) evalúe las sumas parciales con \(V=0.4\) y \(V=0.6\) y compárelas con el valor exacto; (c) explique el radio de convergencia.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Serie.</b> \(E=\tfrac12-\tfrac12\sqrt{1+4V^2}\) y \(\sqrt{1+4x}=1+2x-2x^2+4x^3-10x^4+\dots\) con \(x=V^2\): \(E=-V^2+V^4-2V^6+5V^8-14V^{10}+\dots\) (números de Catalan).</li>
<li><b>\(V=0.4\).</b> Exacto: \(\tfrac12-\sqrt{0.25+0.16}=-0.140312\). Sumas: \(-0.16\), \(-0.1344\), \(-0.142592\), \(-0.139315\): convergen alternando.</li>
<li><b>\(V=0.6\).</b> Exacto: \(\tfrac12-\sqrt{0.61}=-0.281025\). Sumas: \(-0.36\), \(-0.2304\), \(-0.323712\), \(-0.239731\): las oscilaciones <em>no</em> se cierran (los términos \(C_kV^{2k}\) crecen).</li>
<li><b>Radio.</b> \(\sqrt{1+4V^2}\) tiene puntos de ramificación en \(V=\pm\ii/2\): el radio de convergencia es \(|V|=\tfrac12\Delta\), aunque en \(V\) real nada ocurre. La serie en \(V/\Delta\) converge si y solo si \(|V|\lt\Delta/2\).</li>
<li><b>Resultado.</b> <span class="ans">\(E=-V^2+V^4-2V^6+5V^8-\dots\); con \(V=0.4\) converge (\(-0.1403\)); con \(V=0.6\) diverge; radio de convergencia \(\Delta/2\).</span></li>
</ol></details></li>
</ol>
