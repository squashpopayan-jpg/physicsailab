<template class="chapter-src" data-id="campos" data-num="17" data-title="Partículas cargadas en campos electromagnéticos" data-part="Parte III · Momento angular y el átomo" data-short="Acoplamiento mínimo y simetría de gauge, niveles de Landau y su degeneración, efecto Aharonov–Bohm, efecto Hall cuántico entero y la casi degeneración del espín con el movimiento ciclotrón">
<p class="lead">En mecánica clásica el campo magnético no realiza trabajo, pero la mecánica cuántica trabaja con los potenciales \(\varphi\) y \(\mathbf A\), no con los campos. Un campo magnético uniforme transforma el espectro continuo de una partícula libre en una escalera de niveles discretos (los niveles de Landau), y un flujo magnético encerrado en una región donde el campo es nulo desplaza la figura de interferencia de las partículas que nunca lo tocan. Ambos hechos sostienen el efecto Hall cuántico y la metrología moderna de la resistencia.</p>

<section>
<h2>Acoplamiento mínimo y simetría de gauge</h2>
<p>Una partícula de carga \(q\) y masa \(m\) en un campo electromagnético tiene el hamiltoniano \(H=\dfrac{(\mathbf p-q\mathbf A)^2}{2m}+q\varphi\), donde \(\mathbf p=-\ii\hbar\nabla\) es el momento canónico. El operador que mide la velocidad es el <em>momento cinemático</em> \(\boldsymbol\pi=\mathbf p-q\mathbf A=m\mathbf v\), y es el único con significado físico directo. Los campos \(\mathbf B=\nabla\times\mathbf A\) y \(\mathbf E=-\nabla\varphi-\partial_t\mathbf A\) no cambian con la transformación de gauge \(\mathbf A\to\mathbf A+\nabla\chi\), \(\varphi\to\varphi-\partial_t\chi\), y la ecuación de Schrödinger tampoco, <em>siempre que</em> la función de onda cambie de fase:</p>
<div class="eq key" data-name="Invariancia de gauge">\[\psi\ \to\ \ee^{\ii q\chi(\mathbf r,t)/\hbar}\,\psi,\qquad[\pi_i,\pi_j]=\ii\hbar q\,\varepsilon_{ijk}B_k .\]</div>
<p>El conmutador de las componentes del momento cinemático es la fuente de todo lo que sigue: en un campo \(B\hat z\) las componentes \(\pi_x\) y \(\pi_y\) son como \(\hat x\) y \(\hat p\) de un oscilador: no pueden tomar valores definidos al mismo tiempo, con «\(\hbar\)» efectivo igual a \(\hbar qB\).</p>
</section>

<section>
<h2>Niveles de Landau</h2>
<p>Para \(\mathbf B=B\hat z\) con \(\mathbf A=(0,Bx,0)\) (gauge de Landau) el hamiltoniano es \(H=\tfrac{p_x^2}{2m}+\tfrac{(p_y-qBx)^2}{2m}\), que no depende de \(y\): \(\psi=\ee^{\ii ky}\phi(x)\) y</p>
<div class="eq">\[\left[-\frac{\hbar^2}{2m}\frac{\dd^2}{\dd x^2}+\frac12m\omega_c^2(x-x_0)^2\right]\phi=E\phi,\qquad\omega_c=\frac{|q|B}m,\qquad x_0=\frac{\hbar k}{qB}.\]</div>
<p>Es un oscilador armónico con la <span class="term">frecuencia ciclotrón</span> \(\omega_c\) (la clásica) centrado en \(x_0\). La energía no depende de \(k\), de modo que cada nivel es muy degenerado. En una muestra \(L_x\times L_y\) con condiciones periódicas en \(y\), \(k=2\pi j/L_y\) y \(x_0\) debe estar dentro de la muestra, \(0\le x_0\le L_x\): el número de valores de \(k\) es \(qBL_xL_y/h\).</p>
<div class="eq key" data-name="Niveles de Landau">\[E_n=\hbar\omega_c\left(n+\tfrac12\right),\qquad\ell=\sqrt{\frac\hbar{|q|B}},\qquad\frac{N_\text{estados por nivel}}{\text{área}}=\frac{|q|B}{h}=\frac1{2\pi\ell^2}.\]</div>
<p>La <span class="term">longitud magnética</span> \(\ell\) fija la escala de las funciones de onda (\(\phi_n\) tiene extensión \(\sim\ell\sqrt{2n+1}\), el radio de la órbita clásica con esa energía) y la degeneración es <em>un estado por cada cuanto de flujo</em> \(\Phi_0=h/q\) que atraviesa la muestra: \(N_\Phi=\Phi/\Phi_0\). Antes de aplicar el campo había un continuo de estados con densidad constante en 2D (\(m/2\pi\hbar^2\) por unidad de área y energía); el campo los agrupa en niveles equiespaciados, cada uno con la misma cantidad de estados por el espacio que ocupaban, \(m\omega_c/2\pi\hbar=qB/h\). Si se incluye el espín (\(H_Z=g\mu_BBS_z/\hbar\)), cada nivel se parte en dos.</p>
<div class="sim" data-sim="landau" data-title="Niveles de Landau: el oscilador desplazado, la longitud magnética y el abanico de energías"></div>
<div class="sim-guide"><ul>
<li>Con GaAs (\(m^*=0.067\,m_e\)) en \(B=5\) T: \(\hbar\omega_c=8.639\) meV (unos 100 K), \(\ell=11.47\) nm y \(1209\) estados por \(\mu\text{m}^2\) en cada nivel. El nivel \(n=2\) tiene la energía \(\tfrac52\hbar\omega_c=21.60\) meV y una extensión clásica de \(\ell\sqrt5=25.7\) nm. Al mover \(x_0\) la parábola y la función se desplazan sin cambiar la energía: la degeneración.</li>
<li>El abanico de la derecha muestra \(E_n\propto B\) con pendiente \((n+\tfrac12)\hbar e/m^*\); con \(m^*=m_e\) en 1 T el espaciado \(\hbar\omega_c\) es solo 0.1158 meV.</li>
</ul></div>
</section>

<section>
<h2>El efecto Aharonov–Bohm</h2>
<p>En una región simplemente conexa donde \(\mathbf B=0\) se puede elegir \(\mathbf A=\nabla\chi\), y la función de onda es la de la partícula libre multiplicada por la fase de gauge, \(\psi=\ee^{\ii q\int^{\mathbf r}\mathbf A\cdot\dd\mathbf l/\hbar}\psi_0\). Pero si la región <em>rodea</em> un flujo (un solenoide infinito), la integral de línea depende del camino y no se puede eliminar con un cambio de gauge. Dos caminos que rodean el solenoide por lados opuestos adquieren la diferencia de fase</p>
<div class="eq key" data-name="Fase de Aharonov–Bohm">\[\Delta\varphi=\frac q\hbar\oint\mathbf A\cdot\dd\mathbf l=\frac{q\Phi}\hbar=2\pi\frac\Phi{\Phi_0},\qquad\Phi_0=\frac hq=4.135\,668\ \text{fWb (electrones)}.\]</div>
<p>Aunque los electrones nunca pasen por la región con \(\mathbf B\neq0\) (la fuerza de Lorentz sobre ellos es nula), la figura de interferencia se desplaza lateralmente en \(\Phi/\Phi_0\) interfranjas, y la figura se repite cuando el flujo aumenta en un cuanto \(\Phi_0\). Fue predicho por Ehrenberg y Siday (1949) y por Aharonov y Bohm (1959) y confirmado por Chambers (1960) y, sin duda, por Tonomura (1986) con electrones que rodeaban un toroide de material magnético blindado. Muestra que los potenciales, y no solo los campos, tienen significado físico en la teoría cuántica, aunque sus efectos son siempre invariantes de gauge (dependen de \(\oint\mathbf A\cdot\dd\mathbf l\)). Las corrientes persistentes en anillos mesoscópicos, la cuantización del flujo \(h/2e\) en un superconductor y los interferómetros de espín dependen del mismo principio.</p>
<div class="sim" data-sim="ab-flujo" data-title="Efecto Aharonov–Bohm: las franjas se desplazan con el flujo encerrado"></div>
<div class="sim-guide"><ul>
<li>Con radio \(a=0.5\ \mu\)m, un campo de 5.266 mT encierra exactamente un cuanto \(\Phi_0=4.1357\) fWb: la figura vuelve a ser idéntica a la original (desplazada una franja completa). Con 2.633 mT (medio cuanto) las franjas se desplazan media interfranja y el máximo central se vuelve mínimo.</li>
<li>La separación de las franjas no cambia con el flujo; solo se desplazan. Con electrones de 100 eV (\(\lambda=122.6\) pm) se necesitan solenoides de tamaño micrométrico para campos de milésimas de tesla.</li>
</ul></div>
</section>

<section>
<h2>El efecto Hall cuántico entero</h2>
<p>Una corriente \(I\) por una lámina de electrones de densidad superficial \(n_e\) con campo \(B\) perpendicular produce un voltaje transversal con \(\rho_{xy}=B/(n_ee)\) (clásicamente, una recta). En 1980 von Klitzing observó que en gases bidimensionales de electrones a baja temperatura y campos fuertes, \(\rho_{xy}\) se queda en <em>mesetas</em> exactamente cuantizadas, a la vez que \(\rho_{xx}\) se anula:</p>
<div class="eq key" data-name="Efecto Hall cuántico entero">\[\rho_{xy}=\frac{h}{\nu e^2},\quad\nu=1,2,3,\dots,\qquad\frac h{e^2}=R_K=25\,812.807\ \Omega,\qquad\nu=\frac{n_eh}{eB}.\]</div>
<p>El factor de llenado \(\nu\) es el número de niveles de Landau llenos. Las mesetas aparecen cuando el nivel de Fermi está en una brecha entre niveles de Landau; en una muestra real el desorden ensancha los niveles y deja estados <em>localizados</em> en sus colas, que no transportan corriente, y solo los estados cerca del centro de cada nivel son extendidos. Mientras el nivel de Fermi recorre estados localizados, \(\rho_{xy}\) no cambia, y \(\rho_{xx}\) es nula; solo cuando cruza el centro de un nivel hay un salto en \(\rho_{xy}\) y un pico en \(\rho_{xx}\). La exactitud de la cuantización (partes por mil millones, independiente de la forma de la muestra y del material) tiene un origen topológico (Laughlin 1981; Thouless et al. 1982), y desde 1990 el ohm se mantenía con \(R_{K-90}\); desde 2019 \(h\) y \(e\) están fijadas por definición y \(R_K\) es exacta. El simulador usa un modelo mínimo: cada nivel contribuye con una sigmoide centrada en media ocupación.</p>
<div class="sim" data-sim="hall-ent" data-title="Efecto Hall cuántico entero: mesetas de ρxy y picos de ρxx (modelo)"></div>
<div class="sim-guide"><ul>
<li>Con \(n_e=3\times10^{15}\) m\(^{-2}\) (\(3\times10^{11}\) cm\(^{-2}\), típico de GaAs) y \(B=6\) T, \(\nu=2.068\): estamos en la meseta \(\nu=2\), con \(\rho_{xy}=h/2e^2=12.906\) k\(\Omega\) (la recta clásica daría 12.48 k\(\Omega\) con \(B/n_ee\)) y \(\rho_{xx}\) pequeña. Las mesetas \(\nu=1,2,4\) están en \(12.41\), \(6.20\) y \(3.10\) T.</li>
<li>Con \(w\) mayor, las mesetas se estrechan y los picos de \(\rho_{xx}\) se ensanchan: más desorden, pero la cuantización persiste mientras haya estados localizados entre los niveles. Esta es una de las pocas medidas de la física con una exactitud de \(10^{-9}\).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>En un gas de electrones de GaAs (\(m^*=0.067\,m_e\)) con \(B=5\) T calcule la frecuencia ciclotrón, \(\hbar\omega_c\) (en meV y en kelvin), la longitud magnética y la densidad de estados por nivel.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Frecuencia.</b> \(\omega_c=\dfrac{eB}{m^*}=\dfrac{1.6022\times10^{-19}\times5}{0.067\times9.1094\times10^{-31}}=1.3126\times10^{13}\) rad/s.</li>
<li><b>Energía.</b> \(\hbar\omega_c=1.05457\times10^{-34}\times1.3126\times10^{13}=1.3842\times10^{-21}\) J \(=8.639\) meV; en kelvin, \(\hbar\omega_c/k_B=100.3\) K.</li>
<li><b>Longitud magnética.</b> \(\ell=\sqrt{\hbar/eB}=\sqrt{\dfrac{1.05457\times10^{-34}}{1.6022\times10^{-19}\times5}}=1.1474\times10^{-8}\) m \(=11.47\) nm.</li>
<li><b>Degeneración.</b> \(eB/h=\dfrac{1.6022\times10^{-19}\times5}{6.6261\times10^{-34}}=1.209\times10^{15}\) m\(^{-2}\) \(=1209\) \(\mu\)m\(^{-2}\); equivale a \(1/2\pi\ell^2\) ✓.</li>
<li><b>Resultado.</b> <span class="ans">\(\omega_c=1.313\times10^{13}\) rad/s; \(\hbar\omega_c=8.639\) meV (100.3 K); \(\ell=11.47\) nm; 1209 estados/\(\mu\)m² por nivel (y por espín).</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>(a) Calcule el cuanto de flujo \(h/e\) y el campo que lo produce en un solenoide de 0.5 µm de radio. (b) ¿Cuántos cuantos de flujo atraviesan 1 cm² con 1 T?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Cuanto.</b> \(\Phi_0=h/e=\dfrac{6.62607\times10^{-34}}{1.602177\times10^{-19}}=4.1357\times10^{-15}\) Wb.</li>
<li><b>Campo.</b> \(B=\Phi_0/\pi a^2=\dfrac{4.1357\times10^{-15}}{\pi(0.5\times10^{-6})^2}=5.266\times10^{-3}\) T.</li>
<li><b>Cuantos en 1 cm².</b> \(N=BA/\Phi_0=\dfrac{1\times10^{-4}}{4.1357\times10^{-15}}=2.418\times10^{10}\).</li>
<li><b>Resultado.</b> <span class="ans">\(\Phi_0=4.136\) fWb; \(B=5.266\) mT; \(2.418\times10^{10}\) cuantos por cm² en 1 T.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Un gas con \(n_e=3\times10^{15}\) m\(^{-2}\). Halle \(\nu\) en \(B=6\) T, los campos de las mesetas \(\nu=1,2,3,4\) y las resistencias Hall correspondientes.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Llenado.</b> \(\nu=n_eh/eB=\dfrac{3\times10^{15}\times4.1357\times10^{-15}}{6}=2.068\).</li>
<li><b>Campos.</b> \(B_\nu=n_eh/(e\nu)=\dfrac{12.407}{\nu}\) T: \(12.41,\ 6.204,\ 4.136,\ 3.102\) T para \(\nu=1,2,3,4\).</li>
<li><b>Resistencias.</b> \(\rho_{xy}=R_K/\nu\) con \(R_K=25.8128\) k\(\Omega\): \(25.813,\ 12.906,\ 8.604,\ 6.453\) k\(\Omega\).</li>
<li><b>Comentario.</b> En \(B=6\) T, \(\nu=2.068\) está en la meseta de \(\nu=2\) (poco campo por debajo de \(B_2\)).</li>
<li><b>Resultado.</b> <span class="ans">\(\nu=2.068\); \(B=12.41,\ 6.204,\ 4.136,\ 3.102\) T; \(\rho_{xy}=25.813,\ 12.906,\ 8.604,\ 6.453\) k\(\Omega\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Electrones de 100 eV atraviesan un interferómetro de dos rendijas con un solenoide de radio 0.5 µm entre ellas. Halle su longitud de onda, el campo que desplaza las franjas media interfranja y el desplazamiento con \(B=1\) mT.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Longitud de onda.</b> \(\lambda=h/\sqrt{2mE}=\dfrac{6.626\times10^{-34}}{\sqrt{2\times9.109\times10^{-31}\times100\times1.602\times10^{-19}}}=1.2264\times10^{-10}\) m \(=122.6\) pm.</li>
<li><b>Fase.</b> El desplazamiento de las franjas es \(\Phi/\Phi_0\) interfranjas; media interfranja requiere \(\Phi=\Phi_0/2\).</li>
<li><b>Campo.</b> \(B=\dfrac{\Phi_0/2}{\pi a^2}=\dfrac{5.266}{2}=2.633\) mT.</li>
<li><b>Con 1 mT.</b> \(\Phi=B\pi a^2=10^{-3}\times7.854\times10^{-13}=7.854\times10^{-16}\) Wb \(=0.7854\ \text{fWb}\); \(\Phi/\Phi_0=0.1899\) interfranjas, o \(2\pi\times0.1899=1.193\) rad.</li>
<li><b>Resultado.</b> <span class="ans">\(\lambda=122.6\) pm; \(B=2.633\) mT; con 1 mT las franjas se desplazan 0.190 interfranja (fase 1.193 rad).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que \(H=\boldsymbol\pi^2/2m\) en \(B\hat z\) es un oscilador armónico: defina \(a=(\pi_x+\ii\pi_y)/\sqrt{2\hbar qB}\) y halle \(E_n\); calcule el radio clásico para \(n=2\) a 5 T en GaAs.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Conmutador.</b> \([\pi_x,\pi_y]=\ii\hbar qB\) (con \(q>0\), \(B>0\)).</li>
<li><b>Operadores.</b> \(a=\dfrac{\pi_x+\ii\pi_y}{\sqrt{2\hbar qB}}\), \(a^\dagger=\dfrac{\pi_x-\ii\pi_y}{\sqrt{2\hbar qB}}\): \([a,a^\dagger]=\dfrac{-\ii[\pi_x,\pi_y]+\ii[\pi_y,\pi_x]}{2\hbar qB}=\dfrac{-\ii(\ii\hbar qB)\cdot2}{2\hbar qB}=1\).</li>
<li><b>Hamiltoniano.</b> \(a^\dagger a=\dfrac{\pi_x^2+\pi_y^2+\ii[\pi_x,\pi_y]}{2\hbar qB}=\dfrac{\pi_x^2+\pi_y^2}{2\hbar qB}-\dfrac12\), luego \(\dfrac{\pi_x^2+\pi_y^2}{2m}=\hbar\omega_c\left(a^\dagger a+\tfrac12\right)\) con \(\omega_c=qB/m\).</li>
<li><b>Espectro.</b> \(E_n=\hbar\omega_c(n+\tfrac12)\), \(n=0,1,\dots\) (el mismo cálculo del capítulo 9).</li>
<li><b>Radio clásico.</b> \(E=\tfrac12mv^2=\hbar\omega_c(n+\tfrac12)\) y \(r=mv/qB\Rightarrow r^2=\dfrac{2E}{m\omega_c^2}=\ell^2(2n+1)\); con \(n=2\) y \(\ell=11.47\) nm: \(r=11.47\sqrt5=25.66\) nm.</li>
<li><b>Resultado.</b> <span class="ans">\([a,a^\dagger]=1\); \(E_n=\hbar\omega_c(n+\tfrac12)\); \(r_n=\ell\sqrt{2n+1}=25.66\) nm para \(n=2\) (5 T, GaAs).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Un electrón libre en \(B=1\) T tiene niveles \(E_{n,s}=\hbar\omega_c(n+\tfrac12)+g\mu_BBs\) con \(s=\pm\tfrac12\). Calcule \(\hbar\omega_c\), la separación Zeeman y la diferencia \(E_{n+1,\downarrow}-E_{n,\uparrow}\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Ciclotrón.</b> \(\hbar\omega_c=\hbar eB/m_e=1.0546\times10^{-34}\times1.7588\times10^{11}=1.8548\times10^{-23}\) J \(=115.77\ \mu\)eV.</li>
<li><b>Zeeman.</b> \(g\mu_BB=2.00232\times57.884\ \mu\)eV \(=115.90\ \mu\)eV.</li>
<li><b>Casi degeneración.</b> \(E_{n+1,\downarrow}-E_{n,\uparrow}=\hbar\omega_c-g\mu_BB=\hbar\omega_c\left(1-\tfrac g2\right)\): con \(g/2=1.00116\), \(=-0.134\ \mu\)eV.</li>
<li><b>Interpretación.</b> Que \(g\) sea casi exactamente 2 hace coincidir el espaciado de espín con el orbital: los niveles se agrupan en pares casi degenerados, y su pequeña diferencia, \(\hbar\omega_c(g-2)/2\), es una medida directa de la anomalía del momento magnético (\(a_e=(g-2)/2=0.00116\)). Es el principio de las medidas en trampas de Penning del orden de 1 parte en \(10^{13}\).</li>
<li><b>Resultado.</b> <span class="ans">\(\hbar\omega_c=115.77\ \mu\)eV; \(g\mu_BB=115.90\ \mu\)eV; \(E_{n+1,\downarrow}-E_{n,\uparrow}=-0.134\ \mu\)eV \(=-\hbar\omega_c\,a_e\).</span></li>
</ol></details></li>
</ol>
