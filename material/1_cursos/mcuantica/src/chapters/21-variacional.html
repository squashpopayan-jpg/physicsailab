<template class="chapter-src" data-id="variacional" data-num="21" data-title="El método variacional" data-part="Parte IV · Métodos de aproximación" data-short="Principio variacional de Rayleigh–Ritz, bases lineales y la ecuación secular, helio con carga efectiva, oscilador anarmónico con gaussianas y el enlace químico en H₂⁺">
<p class="lead">La teoría de perturbaciones necesita un problema cercano que se pueda resolver exactamente. El método variacional no lo necesita: parte de una familia de funciones de prueba y elige la mejor. Su gran ventaja es una garantía: la energía calculada es siempre una <em>cota superior</em> de la verdadera, y el error de energía es de segundo orden en el error de la función. Es la base de la química cuántica (Hartree–Fock, interacción de configuraciones, teoría del funcional de la densidad) y el método con que se resuelven los átomos de varios electrones y las moléculas.</p>

<section>
<h2>El principio variacional</h2>
<p>Sea \(H\) un hamiltoniano con autovalores \(E_0\le E_1\le\dots\) y autofunciones ortonormales \(\phi_n\). Para cualquier función \(\psi\) (normalizable, en el dominio de \(H\)) definimos el funcional \(E[\psi]=\langle\psi|H|\psi\rangle/\langle\psi|\psi\rangle\). Desarrollando \(\psi=\sum c_n\phi_n\):</p>
<div class="eq key" data-name="Principio variacional de Rayleigh–Ritz">\[E[\psi]=\frac{\sum_n|c_n|^2E_n}{\sum_n|c_n|^2}\ \ge\ E_0,\qquad E[\psi]-E_0=\frac{\sum_{n\ge1}|c_n|^2(E_n-E_0)}{\sum_n|c_n|^2}=O(\|\delta\psi\|^2).\]</div>
<p>La igualdad solo se da cuando \(\psi=\phi_0\). Por tanto, minimizar \(E[\psi]\) sobre una familia de funciones da la mejor aproximación posible al estado fundamental dentro de esa familia y, sobre todo, una cota superior de la energía exacta. Es más: la condición de estacionariedad \(\delta E[\psi]=0\) equivale a la ecuación de Schrödinger, de modo que los autoestados son los puntos estacionarios del funcional (el estado \(n\)-ésimo es un punto de silla). La segunda parte de la ecuación es de enorme utilidad práctica: una función con un error del 10 % da una energía con un error de solo el 1 %. Por esa razón, la energía suele ser mucho mejor que otras propiedades calculadas con la misma función (como la densidad en el núcleo).</p>
<p><b>Variación lineal.</b> Si se toma \(\psi=\sum_{i=1}^Nc_i\chi_i\) con funciones de base \(\chi_i\) fijas y se minimiza respecto de los coeficientes, se obtiene la ecuación secular generalizada</p>
<div class="eq">\[\sum_jH_{ij}c_j=E\sum_jS_{ij}c_j,\qquad\det(H-ES)=0,\qquad H_{ij}=\langle\chi_i|H|\chi_j\rangle,\ S_{ij}=\langle\chi_i|\chi_j\rangle .\]</div>
<p>Sus \(N\) raíces \(E_1^{(N)}\le\dots\le E_N^{(N)}\) cumplen el <span class="term">teorema de Hylleraas–Undheim–MacDonald</span>: \(E_k^{(N)}\ge E_k\) (cada una es una cota superior del nivel \(k\) exacto) y al agregar funciones de base las raíces solo pueden bajar. Es la diagonalización de la matriz del hamiltoniano en una base finita, con la garantía de la dirección del error.</p>
</section>

<section>
<h2>Una función de prueba con un parámetro</h2>
<p>El oscilador \(H=\tfrac12p^2+\tfrac12x^2+gx^4\) del capítulo 19 puede tratarse con \(\psi_\alpha\propto\ee^{-\alpha x^2/2}\), la solución exacta para \(g=0\) con un ancho ajustable. Con \(\langle T\rangle=\alpha/4\), \(\langle x^2\rangle=1/2\alpha\) y \(\langle x^4\rangle=3/4\alpha^2\):</p>
<div class="eq">\[E(\alpha)=\frac\alpha4+\frac1{4\alpha}+\frac{3g}{4\alpha^2},\qquad\frac{\dd E}{\dd\alpha}=0\ \Rightarrow\ \alpha^3-\alpha-6g=0 .\]</div>
<p>El mínimo da una energía siempre por encima de la exacta, y es válido con cualquier \(g\), a diferencia de la serie de perturbaciones (que diverge para \(g\) grandes).</p>
<div class="sim" data-sim="var-gauss" data-title="Oscilador anarmónico: energía variacional con una gaussiana de ancho variable"></div>
<div class="sim-guide"><ul>
<li>Con \(g=0.3\): \(E(\alpha=1)=0.725\) (la gaussiana del oscilador armónico sin ajustar); el mínimo está en \(\alpha^*=1.4868\) con \(E=0.64163\), frente al valor exacto \(0.637992\): un error de \(3.6\times10^{-3}\) (0.57 %). La serie de perturbaciones de segundo orden da \(0.48875\), con un error 40 veces mayor y del signo contrario.</li>
<li>Con \(g=1\): \(\alpha^*=2\) exactamente (\(8-2-6=0\)) y \(E=0.8125\) frente a \(0.80377\) (1.1 %). Compare las curvas de densidad: la gaussiana de ancho óptimo se estrecha respecto de la del oscilador armónico, porque el término \(x^4\) confina más.</li>
</ul></div>
</section>

<section>
<h2>Bases de gaussianas: Rayleigh–Ritz con el hidrógeno</h2>
<p>En la práctica, las funciones de base de la química cuántica son gaussianas \(\ee^{-ar^2}\), cuyas integrales de varios centros se calculan en forma cerrada. Para los orbitales \(s\) de un hidrogenoide de carga \(Z\) con primitivas sin normalizar \(\chi_i=\ee^{-a_ir^2}\):</p>
<div class="eq">\[S_{ij}=\left(\frac\pi{a_i+a_j}\right)^{3/2},\qquad H_{ij}=\frac{3a_ia_j}{a_i+a_j}\,S_{ij}-\frac{2\pi Z}{a_i+a_j}.\]</div>
<p>Con una sola gaussiana el óptimo es \(a=8/9\pi\) con \(E=-4/3\pi=-0.42441\) hartree (15 % por encima de \(-0.5\)). Con varias, la energía converge, pero los pesos y exponentes deben cubrir una gran escala de longitudes porque una gaussiana tiene derivada nula en el origen y no reproduce la cúspide \(\psi\sim\ee^{-r}\) del electrón sobre el núcleo (la condición de Kato). Por eso \(\psi(0)\) converge mucho más lento que la energía, un caso claro de la segunda parte del principio: error cuadrático en la energía, lineal en la función.</p>
<div class="sim" data-sim="ritz-h" data-title="Hidrógeno con N gaussianas: convergencia de la energía y de la función de onda"></div>
<div class="sim-guide"><ul>
<li>Con exponentes \(0.1,\,0.4,\,1.6,\dots\) (razón 4): \(E=-0.35460\ (N=1),\ -0.45827\ (N=2),\ -0.49142\ (N=3),\ -0.49833\ (N=4),\ -0.49930\ (N=5)\). La energía baja monótonamente con \(N\) (teorema de Hylleraas–Undheim) y no la sobrepasa nunca.</li>
<li>Mire \(\psi(0)\): con \(N=5\) es 0.5289 y no 0.5642: el error de la función en el núcleo es del 6.3 %, mientras que el de la energía es solo del 0.14 %. Los demás autovalores de la base (por encima de \(-0.5\)) son aproximaciones a estados excitados y al continuo.</li>
</ul></div>
</section>

<section>
<h2>El helio</h2>
<p>El átomo de helio (\(Z=2\), dos electrones) no tiene solución analítica: \(H=\sum_i\left(-\tfrac12\nabla_i^2-\tfrac Z{r_i}\right)+\tfrac1{r_{12}}\) en unidades atómicas. Sin la repulsión \(1/r_{12}\) cada electrón estaría en un orbital 1s hidrogenoide de carga \(Z=2\) y la energía sería \(-Z^2=-4\) hartree. Con la repulsión como perturbación de primer orden, \(E^{(1)}=\langle1/r_{12}\rangle=\tfrac58Z\), se obtiene \(-4+\tfrac54=-2.75\) hartree; la medida es \(-2.9037\). Una mejora sencilla es la función de prueba \(\psi=\tfrac{\zeta^3}\pi\ee^{-\zeta(r_1+r_2)}\) con la carga efectiva \(\zeta\) como parámetro: cada electrón «ve» el núcleo apantallado por el otro. Con \(\langle T\rangle=\zeta^2\), \(\langle V_{ne}\rangle=-2Z\zeta\) y \(\langle1/r_{12}\rangle=\tfrac58\zeta\):</p>
<div class="eq key" data-name="Helio con carga efectiva">\[E(\zeta)=\zeta^2-2Z\zeta+\tfrac58\zeta\ \Rightarrow\ \zeta^*=Z-\tfrac5{16},\qquad E_\text{var}=-\left(Z-\tfrac5{16}\right)^2=-2.84766\ \text{hartree}\ (Z=2),\quad E_\text{exacta}=-2.90372.\]</div>
<p>Cada electrón apantalla \(\tfrac5{16}=0.3125\) de la carga del núcleo. El error es de 0.056 hartree (1.53 eV, 1.9 %): grande en términos químicos, pero producido por una sola función con un parámetro. Hylleraas (1929) añadió funciones de la distancia entre los electrones \(r_{12}\) (correlación) y con muy pocos términos redujo el error por debajo de 0.002 hartree; con cientos de términos se llega a \(-2.90372437703\) (Pekeris, 1958; Drake): la mejor concordancia entre teoría y experimento en un átomo de varios electrones.</p>
<div class="sim" data-sim="helio-var" data-title="Átomos de dos electrones: la carga efectiva variacional y su comparación con la energía exacta"></div>
<div class="sim-guide"><ul>
<li>Con \(Z=2\): \(\zeta^*=1.6875\), \(E=-2.84766\) (variacional), \(-2.75\) (perturbación de primer orden) y \(-2.903724\) (exacta). El primer potencial de ionización variacional es \(23.07\) eV frente a los 24.59 eV experimentales.</li>
<li>Al aumentar \(Z\) el error variacional crece muy poco (1.53 eV con \(Z=2\); 1.56 eV con \(Z=3\)) mientras que la energía total crece como \(Z^2\): el error relativo desciende del 1.93 % al 0.79 %; en los iones con mucha carga la repulsión entre electrones es una perturbación cada vez menor frente a la atracción nuclear.</li>
</ul></div>
</section>

<section>
<h2>El enlace químico: el ion molecular H₂⁺</h2>
<p>El sistema molecular más sencillo, un electrón y dos protones a distancia \(R\), se trata con la combinación lineal de orbitales atómicos (LCAO) \(\psi_\pm=(\phi_a\pm\phi_b)/\sqrt{2(1\pm S)}\), donde \(\phi_{a,b}=\ee^{-r_{a,b}}/\sqrt\pi\) son los 1s de cada protón. Las integrales son analíticas: \(S=\ee^{-R}\left(1+R+\tfrac{R^2}3\right)\), \(j=\tfrac1R-\ee^{-2R}\left(1+\tfrac1R\right)\) y \(k=\ee^{-R}(1+R)\), y las energías electrónicas más la repulsión de los protones,</p>
<div class="eq key" data-name="H₂⁺ en la aproximación LCAO">\[E_\pm(R)=-\frac12+\frac1R-\frac{j\pm k}{1\pm S}\quad\text{(hartree)},\qquad E_g(R_e)\ \text{mínimo en}\ R_e=2.49\,a_0,\ D_e=1.76\ \text{eV}\ \ (\text{exacto: }2.00\,a_0,\ 2.79\ \text{eV}).\]</div>
<p>El estado simétrico \(\sigma_g\) acumula densidad entre los núcleos (interferencia constructiva), lo que reduce la energía cinética y atrae a ambos protones: es el orbital <em>enlazante</em>. El antisimétrico \(\sigma_u\) tiene un nodo en el plano medio y es repulsivo en todo \(R\): es <em>antienlazante</em>. El resultado cuantitativo es modesto, pero el cualitativo es exacto: la mecánica cuántica explica por qué dos átomos de hidrógeno se unen (con espines opuestos, en el \(\mathrm H_2\)), y el desacuerdo con el valor exacto (que se calcula en coordenadas elipsoidales) se corrige añadiendo flexibilidad: orbitales con exponente \(\zeta\) variable (\(R_e=2.00\), \(D_e=2.25\) eV) y polarización.</p>
<div class="sim" data-sim="h2plus-lcao" data-title="H₂⁺: las curvas enlazante y antienlazante en la aproximación LCAO"></div>
<div class="sim-guide"><ul>
<li>Con \(R=2.5\): \(S=0.4583\), \(j=0.3906\), \(k=0.2873\), \(E_g=-0.56483\) y \(E_u=-0.29064\) (por encima de la asíntota \(-0.5\): repulsivo). El mínimo de \(\sigma_g\) en \(R_e=2.493\,a_0\) da \(D_e=1.764\) eV.</li>
<li>La densidad de \(\sigma_g\) sobre el eje es mayor en la región entre los núcleos que la suma de las dos densidades atómicas; la de \(\sigma_u\) se anula en \(z=0\).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Para el hidrógeno use la función de prueba \(\psi=\ee^{-\beta r^2}\): calcule \(E(\beta)\), el parámetro óptimo y el error respecto de \(-0.5\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Valores esperados.</b> Con \(N^2=(2\beta/\pi)^{3/2}\): \(\langle T\rangle=\tfrac32\beta\), \(\langle1/r\rangle=2\sqrt{2\beta/\pi}\).</li>
<li><b>Energía.</b> \(E(\beta)=\tfrac32\beta-2\sqrt{\tfrac{2\beta}\pi}\).</li>
<li><b>Mínimo.</b> \(E'=\tfrac32-\sqrt{\tfrac2{\pi\beta}}=0\Rightarrow\beta=\tfrac8{9\pi}=0.28294\).</li>
<li><b>Valor.</b> \(E=\tfrac32\cdot\tfrac8{9\pi}-2\sqrt{\tfrac{16}{9\pi^2}}=\tfrac4{3\pi}-\tfrac8{3\pi}=-\tfrac4{3\pi}=-0.42441\) hartree \(=-11.55\) eV.</li>
<li><b>Error.</b> \((-0.42441+0.5)/0.5=15.1\,\%\) por encima de la energía exacta (cota superior ✓).</li>
<li><b>Resultado.</b> <span class="ans">\(\beta^*=8/9\pi=0.2829\); \(E=-4/3\pi=-0.4244\) hartree (15.1 % de error).</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Una partícula en la caja \(0\lt x\lt L\) con la función de prueba \(\psi=x(L-x)\). Calcule la energía variacional y compárela con \(E_1=\pi^2\hbar^2/2mL^2\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Normalización.</b> \(\langle\psi|\psi\rangle=\int_0^Lx^2(L-x)^2\dd x=\tfrac{L^5}{30}\).</li>
<li><b>Energía cinética.</b> \(\psi''=-2\): \(\langle\psi|H|\psi\rangle=-\tfrac{\hbar^2}{2m}\int_0^Lx(L-x)(-2)\dd x=\tfrac{\hbar^2}m\cdot\tfrac{L^3}6\).</li>
<li><b>Cociente.</b> \(E=\dfrac{\hbar^2L^3/6m}{L^5/30}=\dfrac{5\hbar^2}{mL^2}\).</li>
<li><b>Comparación.</b> \(E_1=\tfrac{\pi^2}2\tfrac{\hbar^2}{mL^2}=4.9348\,\tfrac{\hbar^2}{mL^2}\): el cociente es \(5/4.9348=1.01321\).</li>
<li><b>Resultado.</b> <span class="ans">\(E=5\hbar^2/mL^2=1.0132\,E_1\) (1.32 % por encima, cota superior ✓).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Con \(g=0.3\) halle el \(\alpha\) óptimo de la gaussiana de prueba, la energía y los errores relativos frente al valor exacto \(0.637992\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Ecuación del mínimo.</b> \(\alpha^3-\alpha-1.8=0\).</li>
<li><b>Raíz.</b> Con Newton desde \(\alpha=1.5\): \(f=3.375-1.5-1.8=0.075\), \(f'=3\cdot2.25-1=5.75\Rightarrow\alpha=1.4870\); una iteración más: \(\alpha^*=1.48682\).</li>
<li><b>Energía.</b> \(E=\tfrac{1.48682}4+\tfrac1{4\times1.48682}+\tfrac{0.9}{4\times2.21064}=0.371705+0.168144+0.101781=0.641630\).</li>
<li><b>Errores.</b> \((0.641630-0.637992)/0.637992=0.57\,\%\). Con \(\alpha=1\) sin ajustar: \(0.725\) (13.6 % de error).</li>
<li><b>Resultado.</b> <span class="ans">\(\alpha^*=1.4868\); \(E_\text{var}=0.64163\) (0.57 % sobre la exacta); con \(\alpha=1\): 0.725 (13.6 %).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Deduzca \(E(\zeta)=\zeta^2-2Z\zeta+\tfrac58\zeta\) para el helio, halle \(\zeta^*\), la energía, el error y el potencial de ionización para \(Z=2\) y \(Z=3\) (Li\(^+\), \(E_\text{exacta}=-7.279913\)).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Términos.</b> Para \(\psi=\tfrac{\zeta^3}\pi\ee^{-\zeta(r_1+r_2)}\): \(\langle T\rangle=2\cdot\tfrac{\zeta^2}2=\zeta^2\); \(\langle V_{ne}\rangle=-2Z\langle1/r\rangle=-2Z\zeta\); \(\langle1/r_{12}\rangle=\tfrac58\zeta\) (integral de Coulomb de dos orbitales 1s).</li>
<li><b>Mínimo.</b> \(E'=2\zeta-2Z+\tfrac58=0\Rightarrow\zeta^*=Z-\tfrac5{16}\); \(E_\text{var}=-\zeta^{*2}\).</li>
<li><b>Helio.</b> \(\zeta^*=1.6875\), \(E=-2.84766\); error \(=-2.84766+2.90372=0.05607\) hartree \(=1.526\) eV (1.93 %). Ionización: \(E(\mathrm{He}^+)-E=-2+2.84766=0.84766\) hartree \(=23.07\) eV (experimento: 24.59 eV).</li>
<li><b>Li\(^+\).</b> \(\zeta^*=2.6875\), \(E=-7.22266\); error \(0.05726\) hartree \(=1.558\) eV (0.79 %); ionización \(-4.5+7.22266=2.72266\) hartree \(=74.09\) eV (exacta: 75.65 eV).</li>
<li><b>Resultado.</b> <span class="ans">He: \(\zeta^*=1.6875\), \(E=-2.8477\) (error 1.53 eV), \(I=23.07\) eV. Li\(^+\): \(\zeta^*=2.6875\), \(E=-7.2227\) (error 1.56 eV), \(I=74.09\) eV.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Evalúe las energías \(E_\pm\) del H\(_2^+\) en la aproximación LCAO para \(R=2\,a_0\) y \(R=2.4928\,a_0\), y la energía de disociación.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>\(R=2\).</b> \(S=\ee^{-2}(1+2+\tfrac43)=0.13534\times4.3333=0.58645\); \(j=\tfrac12-\ee^{-4}\cdot1.5=0.5-0.02747=0.47253\); \(k=\ee^{-2}\cdot3=0.40601\).</li>
<li><b>Energías.</b> \(E_g=-0.5+0.5-\tfrac{0.47253+0.40601}{1.58645}=-0.55377\); \(E_u=-\tfrac{0.47253-0.40601}{0.41355}=-0.16085\) hartree.</li>
<li><b>Mínimo.</b> \(R_e=2.4928\): \(S=0.46003\), \(j=0.39157\), \(k=0.28877\); \(E_g=-0.5+0.40115-\tfrac{0.68035}{1.46003}=-0.56483\).</li>
<li><b>Disociación.</b> \(D_e=-0.5-(-0.56483)=0.06483\) hartree \(=1.764\) eV.</li>
<li><b>Comparación.</b> Exacto: \(D_e=0.10263\) hartree \(=2.793\) eV en \(R_e=1.997\,a_0\): el LCAO simple da el 63 % de la energía de enlace.</li>
<li><b>Resultado.</b> <span class="ans">\(E_g(2)=-0.5538\), \(E_u(2)=-0.1609\); \(R_e=2.493\,a_0\); \(D_e=1.764\) eV (exacto 2.793 eV).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Resuelva el hidrógeno con dos gaussianas, \(a_1=0.2\) y \(a_2=1.0\): construya \(S\) y \(H\), halle las raíces de \(\det(H-ES)=0\) y verifique el teorema de Hylleraas–Undheim.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Solapamientos.</b> \(S_{ij}=(\pi/(a_i+a_j))^{3/2}\): \(S_{11}=(\pi/0.4)^{3/2}=22.0107\); \(S_{12}=(\pi/1.2)^{3/2}=4.2360\); \(S_{22}=(\pi/2)^{3/2}=1.9687\).</li>
<li><b>Hamiltoniano.</b> \(H_{ij}=\tfrac{3a_ia_j}{a_i+a_j}S_{ij}-\tfrac{2\pi}{a_i+a_j}\): \(H_{11}=0.3\times22.0107-15.7080=-9.1047\); \(H_{12}=0.5\times4.2360-5.2360=-3.1180\); \(H_{22}=1.5\times1.9687-3.1416=-0.1885\).</li>
<li><b>Ecuación secular.</b> \(\det\begin{pmatrix}-9.1047-22.0107E&-3.1180-4.2360E\\-3.1180-4.2360E&-0.1885-1.9687E\end{pmatrix}=0\), que es una ecuación cuadrática en \(E\).</li>
<li><b>Raíces.</b> \(E_1=-0.48250\), \(E_2=0.65348\) hartree.</li>
<li><b>Teorema.</b> \(E_1=-0.4825\ge-0.5\) (cota superior de la fundamental) y la función \(\chi_1\) sola da \(1.5a_1-2\sqrt{2a_1/\pi}=-0.4136\ge E_1\): al ampliar la base la energía solo baja. \(E_2=0.6535\) es cota superior del siguiente nivel \(s\) del problema, \(-0.125\) (2s). Con exponentes \(0.1,0.4,1.6\) (3 funciones) baja a \(-0.4914\).</li>
<li><b>Resultado.</b> <span class="ans">\(E_1=-0.4825\), \(E_2=0.6535\) hartree; con \(N=2\) se recupera el 96.5 % de la energía (0.4825/0.5), y con \(N=5\) el 99.86 %.</span></li>
</ol></details></li>
</ol>
