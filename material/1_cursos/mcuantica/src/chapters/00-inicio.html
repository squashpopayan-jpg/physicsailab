    <h1 class="home-title">Mecánica Cuántica<span>del cuanto de Planck al qubit</span></h1>
    <p class="home-lead">Un curso completo de mecánica cuántica en ocho partes: los orígenes y la función de onda, los problemas en una dimensión, el momento angular y el átomo, los métodos de aproximación, la dispersión, las partículas idénticas y los muchos cuerpos, los sistemas abiertos, la medida y la información cuántica, y, por último, las integrales de camino de Feynman y la ecuación de Dirac. Cada capítulo deduce los resultados desde los postulados, con todos los pasos; los aplica en ejemplos resueltos; los ilustra con simulaciones de parámetros ajustables (evolución temporal, orbitales, espín, entrelazamiento, circuitos cuánticos) y termina con problemas en tres niveles, cada uno con su solución paso a paso. La biblioteca de cálculo se valida contra SciPy, SymPy y mpmath, y las cifras de las soluciones se comprueban de forma independiente.</p>
    <div class="maxwell-strip" aria-label="Ecuaciones centrales del curso">

      <div><small>Entrelazamiento</small>\[|\Psi^-\rangle=\tfrac{1}{\sqrt2}(|01\rangle-|10\rangle)\]</div>

<div class="home-howto">
  <div><b>De los postulados al resultado</b><p>Se parte de la función de onda, los operadores y la ecuación de Schrödinger, y se llega al átomo de hidrógeno, el espín, la estructura fina, las colisiones y la computación cuántica, sin saltarse pasos.</p></div>
  <div><b>Simulaciones con parámetros</b><p>Paquetes de onda, pozos, barreras y bandas, el oscilador y los estados coherentes, los armónicos esféricos y los orbitales, la esfera de Bloch, perturbaciones, dispersión, Bell, Lindblad, Grover y Shor, Jaynes–Cummings, integrales de camino y zitterbewegung.</p></div>
  <div><b>Todas las soluciones</b><p>Cada problema propuesto tiene su solución paso a paso: planteamiento, desarrollo, resultado y comprobación. El apéndice B enumera las pruebas numéricas que verifican la biblioteca y las cifras de las soluciones.</p></div>
  <div><b>Ejemplos con contexto</b><p>El color de una estrella, el reloj atómico, la resonancia magnética, el microscopio de efecto túnel, el láser, la inversión del amoníaco, la línea de 21 cm del hidrógeno y los qubits superconductores.</p></div>
