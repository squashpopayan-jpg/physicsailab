<template class="chapter-src" data-id="campo" data-num="35" data-title="El campo cuantizado y el modelo de Jaynes–Cummings" data-part="Parte VII · Sistemas abiertos, medida e información" data-short="Los modos del campo electromagnético como osciladores, las fluctuaciones del vacío y el efecto Casimir, el hamiltoniano de Jaynes–Cummings, el desdoblamiento del vacío de Rabi, el colapso y el revival de las oscilaciones y el gato de Schrödinger en el campo">
<p class="lead">Hasta ahora la luz entró en la teoría como un campo clásico que perturba al átomo (capítulos 23 y 24). Pero un campo electromagnético confinado en una cavidad es un conjunto de osciladores armónicos, y con la cuantización del capítulo 9 resulta que cada modo tiene niveles de energía discretos —los <em>fotones</em>— y una energía del vacío no nula. Este capítulo cuantiza el campo de un modo y lo acopla a un átomo de dos niveles, el sistema más sencillo que muestra lo esencialmente cuántico de la luz: la emisión «espontánea» como una oscilación de Rabi del vacío, la discretización de la intensidad que se revela en los revivals de las oscilaciones de Rabi, y el entrelazamiento átomo–campo que produce gatos de Schrödinger electromagnéticos.</p>

<section>
<h2>Modos del campo y fluctuaciones del vacío</h2>
<p>En una cavidad de volumen \(V\) el campo se descompone en modos normales de frecuencias \(\omega_k\); cada uno es un oscilador armónico, y el hamiltoniano del campo es \(H=\sum_k\hb\omega_k(a_k^\dagger a_k+\tfrac12)\). Para un solo modo estacionario con polarización fija, el campo eléctrico en el punto \(z\) es</p>
<div class="eq key" data-name="Campo eléctrico cuantizado">\[\hat E(z,t)=\mathcal E_0\sin(kz)\,\big(a\,\ee^{-\ii\omega t}+a^\dagger\ee^{\ii\omega t}\big),\qquad\mathcal E_0=\sqrt{\frac{\hb\omega}{2\varepsilon_0V}}\ .\]</div>
<p>Con \(n\) fotones, \(\langle E\rangle=0\) y \(\langle E^2\rangle=\mathcal E_0^2\sin^2(kz)\,(2n+1)\): <em>el vacío tiene fluctuaciones</em>, \(\Delta E=\mathcal E_0|\sin kz|\), sin ningún fotón; son las responsables de la emisión espontánea y del desplazamiento de Lamb. Un estado de número bien definido no tiene fase; un estado coherente \(|\alpha\rangle\) (capítulo 10) tiene \(\langle E\rangle\) oscilante y fluctuaciones del vacío, y es lo más parecido al campo clásico. El tamaño de \(\mathcal E_0\) para una cavidad de microondas es diminuto: a 51 GHz y \(V=1\ \text{cm}^3\), \(\mathcal E_0=1.38\ \text{mV/m}\) (problema 1); pero los átomos de Rydberg tienen momentos dipolares enormes y lo detectan.</p>
<p>La energía del punto cero \(\tfrac12\hb\omega_k\) de cada modo, sumada sobre todos los modos, diverge, pero <em>las diferencias</em> son finitas y medibles. Dos placas conductoras paralelas a distancia \(d\) cambian el espectro de modos (\(k_z=n\pi/d\)); regularizando la suma (con una función de corte, o por continuación analítica \(\zeta(-3)=1/120\)) queda una energía por unidad de área y una presión atractiva, el <span class="term">efecto Casimir</span>:</p>
<div class="eq key" data-name="Efecto Casimir">\[\frac{E}{A}=-\frac{\pi^2\hb c}{720\,d^3},\qquad\frac{F}{A}=-\frac{\pi^2\hb c}{240\,d^4}.\]</div>
<p>A \(d=1\ \mu\)m la presión es \(1.30\) mPa; a 100 nm, 13.0 Pa; a 10 nm, \(1.3\times10^5\) Pa, más de una atmósfera. Medida con precisión por Lamoreaux (1997) y Mohideen–Roy (1998), con correcciones por conductividad finita, rugosidad y temperatura.</p>
</section>

<section>
<h2>El hamiltoniano de Jaynes–Cummings</h2>
<p>Un átomo de dos niveles (fundamental \(|g\rangle\), excitado \(|e\rangle\), frecuencia \(\omega_0\)) en la posición \(z\) interactúa con el modo mediante el acoplamiento dipolar \(-\hat{\vec d}\cdot\hat{\vec E}\). Con \(\hat d=d(\sigma_++\sigma_-)\), el acoplamiento tiene cuatro términos, \(\hb g(\sigma_++\sigma_-)(a+a^\dagger)\), con \(g=d\,\mathcal E_0\sin(kz)/\hb\). Los términos \(\sigma_+a^\dagger\) y \(\sigma_-a\) (excitar el átomo <em>creando</em> un fotón) oscilan rápido, a \(\omega_0+\omega\), y su efecto es despreciable cuando \(g\ll\omega\): la <em>aproximación de onda rotante</em> (RWA) los elimina y deja el modelo de Jaynes–Cummings (1963):</p>
<div class="eq key" data-name="Modelo de Jaynes–Cummings">\[H=\hb\omega\,a^\dagger a+\tfrac12\hb\omega_0\sigma_z+\hb g\left(\sigma_+a+\sigma_-a^\dagger\right),\qquad\Delta=\omega_0-\omega.\]</div>
<p>El hamiltoniano conserva el número de excitaciones \(N=a^\dagger a+\sigma_+\sigma_-\) (\([H,N]=0\)), de modo que se descompone en bloques \(2\times2\) en la base \(\{|e,n\rangle,|g,n+1\rangle\}\) (más el estado \(|g,0\rangle\), desacoplado). En el sistema que gira a la frecuencia del campo, cada bloque es</p>
<div class="eq" data-name="Bloque n de Jaynes–Cummings">\[H_n=\begin{pmatrix}\Delta/2&g\sqrt{n+1}\\g\sqrt{n+1}&-\Delta/2\end{pmatrix},\qquad E_{n,\pm}=\pm\frac{\hb\Omega_n}2,\quad\Omega_n=\sqrt{\Delta^2+4g^2(n+1)}\ .\]</div>
<p>Las energías «vestidas» forman <em>dobletes</em> con un cruce evitado: a resonancia (\(\Delta=0\)) los estados vestidos son las combinaciones \(|\pm,n\rangle=(|e,n\rangle\pm|g,n+1\rangle)/\sqrt2\) separadas por \(\hb\Omega_n=2\hb g\sqrt{n+1}\). Incluso con \(n=0\) el desdoblamiento es \(2\hb g\) (<em>desdoblamiento del vacío de Rabi</em>): se observa en un espectro de transmisión de cavidad con un átomo. La raíz cuadrada \(\sqrt{n+1}\) es la huella de la cuantización: un campo clásico daría un desdoblamiento proporcional a la amplitud, no a \(\sqrt{n+1}\) con \(n\) entero.</p>
<div class="sim" data-sim="jc-vestidos" data-title="El doblete vestido de Jaynes–Cummings y las oscilaciones de Rabi con n fotones"></div>
<div class="sim-guide"><ul>
<li>A resonancia con el vacío (\(n=0\)): \(\Omega_0=2.0000\,g\), energías \(\pm g\), mezcla de \(45^\circ\), y \(P_e(t)=\cos^2(gt)\), con periodo \(3.1416/g\) y transferencia completa \(e\to g\). Con \(n=3\): \(\Omega_3=4g\), periodo \(\pi/2g\): el átomo oscila el doble de rápido (\(\sqrt{n+1}=2\)).</li>
<li>Con desintonía \(\Delta=3g\) (\(n=0\)): \(\Omega_0=3.6056\,g\), la transferencia máxima cae a \(4/13=0.3077\) y el ángulo de mezcla baja a \(16.85^\circ\). Los niveles se acercan a las energías desnudas \(\pm\Delta/2\) (líneas punteadas) lejos de la resonancia.</li>
</ul></div>
</section>

<section>
<h2>Colapso y revival: la luz es granular</h2>
<p>Con el átomo en \(|e\rangle\) y el campo en \(\sum_nc_n|n\rangle\), cada bloque evoluciona por separado, y la probabilidad de encontrar el átomo excitado es</p>
<div class="eq key" data-name="Oscilaciones de Rabi">\[P_e(t)=\sum_n|c_n|^2\left[1-\frac{4g^2(n+1)}{\Omega_n^2}\sin^2\!\frac{\Omega_nt}2\right]\ \xrightarrow{\ \Delta=0\ }\ \tfrac12\Big[1+\sum_n|c_n|^2\cos\!\big(2g\sqrt{n+1}\,t\big)\Big].\]</div>
<p>Con un estado de Fock \(|n\rangle\), \(P_e=\cos^2(g\sqrt{n+1}\,t)\): una oscilación pura (con el vacío, \(\cos^2gt\): el átomo emite y reabsorbe el mismo fotón, la «oscilación de Rabi del vacío», que es el origen reversible de la emisión espontánea). Con un estado coherente, la suma es sobre una distribución de Poisson, y como \(\Omega_n\approx2g\sqrt{\bar n}+g(n-\bar n)/\sqrt{\bar n}\), la suma de cosenos de frecuencias ligeramente distintas se desfasa en un <em>tiempo de colapso</em> \(t_c\approx\sqrt2/g\) (envolvente \(\ee^{-g^2t^2/2}\), independiente de \(\bar n\)) y vuelve a reconstruirse cuando las fases de términos vecinos en \(n\) se alinean de nuevo, en el <em>tiempo de revival</em></p>
<div class="eq key" data-name="Colapso y revival">\[t_c\simeq\frac{\sqrt2}{g},\qquad t_r\simeq\frac{2\pi\sqrt{\bar n}}{g},\qquad\frac{t_r}{t_c}=\sqrt2\,\pi\sqrt{\bar n}.\]</div>
<p>El colapso es un efecto «clásico» (también aparecería con una distribución ancha de intensidades), pero el <em>revival</em> es puramente cuántico: exige que \(n\) tome valores enteros discretos. Fue observado en un micromáser de Rydberg por Rempe, Walther y Klein (1987). Entre ambos, \(P_e\) vale \(\approx\tfrac12\) y el átomo está entrelazado con el campo (entropía \(\approx1\) bit).</p>
<div class="sim" data-sim="jc-colapso" data-title="Colapso y revival de las oscilaciones de Rabi con un campo coherente"></div>
<div class="sim-guide"><ul>
<li>Con \(\bar n=25\) y \(\Delta=0\): \(t_c=1.414/g\), \(t_r=31.42/g\). El primer revival cae en \(gt=32.1\) (\(1.02\,t_r\): la corrección \(\sqrt{\bar n+1}\) y la no linealidad) con \(P_e\approx0.78\); el segundo, en \(63.5\) con \(0.70\) (los revivals se ensanchan y se aplanan). En el colapso, \(P_e(3/g)=0.5057\).</li>
<li>La entropía de entrelazamiento átomo–campo sube a \(\approx1\) bit en \(gt\approx2\) (átomo máximamente entrelazado), baja a \(0.0724\) en \(t_r/2\) (átomo casi puro: el campo guarda toda la correlación en un estado de gato) y vuelve a subir. Con un estado de Fock no hay revivals: una sola frecuencia.</li>
</ul></div>
</section>

<section>
<h2>El gato de Schrödinger en el campo</h2>
<p>La evolución exacta de \(|e\rangle\otimes|\alpha\rangle\) es \(|\Psi(t)\rangle=|e\rangle|\phi_e(t)\rangle+|g\rangle|\phi_g(t)\rangle\): átomo y campo entrelazados, con el campo reducido en la mezcla \(\rho_F=|\phi_e\rangle\langle\phi_e|+|\phi_g\rangle\langle\phi_g|\) (su función de Wigner es la suma de las dos). A resonancia, el desfase lineal en \(n\) de los términos \(\ee^{\pm\ii\Omega_nt/2}\) hace girar el estado coherente en el plano de fases un ángulo \(\pm gt/(2\sqrt{\bar n})\). En \(t=t_r/2=\pi\sqrt{\bar n}/g\), ese ángulo es \(\pm\pi/2\): las dos ramas del campo apuntan a \(\pm\ii\alpha\) y el átomo queda casi desacoplado y puro, de modo que el campo está en una superposición \(|\ii\alpha\rangle+|-\ii\alpha\rangle\) (Gea-Banacloche, 1990) —un gato de Schrödinger electromagnético, con las franjas de interferencia de la función de Wigner entre los dos paquetes (valores negativos de \(W\)), que se destruirían por decoherencia (capítulo 32) si la cavidad perdiera fotones.</p>
<div class="sim" data-sim="jc-wigner" data-title="Función de Wigner del campo en Jaynes–Cummings: el gato aparece en t_r/2"></div>
<div class="sim-guide"><ul>
<li>Con \(\bar n=9\) en \(t=0.5\,t_r\): pureza \(\operatorname{Tr}\rho^2=0.9506\), entropía \(S=0.1705\) bits, \(P_e=0.5022\); \(W_\text{mín}=-0.2144\) y volumen negativo \(\delta=0.4023\). Se ven los dos paquetes de la rama \(e\) y \(g\) en lados opuestos y las franjas de interferencia (en rojo y azul) entre ellos.</li>
<li>En \(t=0\): \(\operatorname{Tr}\rho^2=1\), \(W\ge0\), un único paquete gaussiano a distancia \(\sqrt2\alpha\) del origen. Para \(t\) cercano a \(t_r\) el campo se vuelve a reunir en un solo paquete (el revival).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una cavidad de microondas de \(V=1\ \text{cm}^3\) resuena a \(\nu=51\) GHz. Calcule la amplitud del campo del vacío \(\mathcal E_0\). Un átomo de Rydberg circular con dipolo \(d=1250\,ea_0\) está en un antinodo (\(\sin kz=1\)): halle \(g\), \(g/2\pi\), el desdoblamiento del vacío de Rabi y el tiempo en que el átomo, inicialmente en \(|e\rangle\) y con la cavidad vacía, queda en \(|g\rangle\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Energía del fotón.</b> \(\omega=2\pi\nu=3.204\times10^{11}\ \text{s}^{-1}\); \(\hb\omega=3.379\times10^{-23}\) J.</li>
<li><b>Campo del vacío.</b> \(\mathcal E_0=\sqrt{\hb\omega/(2\varepsilon_0V)}=\sqrt{3.379\times10^{-23}/(2\times8.854\times10^{-12}\times10^{-6})}=\sqrt{1.908\times10^{-6}}=1.381\times10^{-3}\) V/m.</li>
<li><b>Dipolo.</b> \(d=1250\,ea_0=1250\times1.602\times10^{-19}\times5.292\times10^{-11}=1.060\times10^{-26}\) C·m.</li>
<li><b>Acoplamiento.</b> \(g=d\mathcal E_0/\hb=1.060\times10^{-26}\times1.381\times10^{-3}/1.0546\times10^{-34}=1.388\times10^5\ \text{s}^{-1}\), es decir \(g/2\pi=22.09\) kHz.</li>
<li><b>Desdoblamiento del vacío de Rabi.</b> \(2g/2\pi=44.19\) kHz.</li>
<li><b>Transferencia.</b> \(P_e=\cos^2gt\) se anula en \(gt=\pi/2\): \(t=\pi/2g=11.31\ \mu\)s (el periodo completo es \(\pi/g=22.63\ \mu\)s).</li>
<li><b>Resultado.</b> <span class="ans">\(\mathcal E_0=1.38\) mV/m; \(g=1.388\times10^5\ \text{s}^{-1}\) (\(g/2\pi=22.1\) kHz); desdoblamiento \(44.2\) kHz; \(t=11.3\ \mu\)s.</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Un átomo en \(|e\rangle\) con la cavidad vacía y desintonía \(\Delta=3g\) (con \(g\) del problema 1). Halle \(\Omega_0\), la probabilidad máxima de transferirlo a \(|g\rangle\), el periodo de \(P_e(t)\) y el ángulo de mezcla de los estados vestidos.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Frecuencia de Rabi generalizada.</b> \(\Omega_0=\sqrt{\Delta^2+4g^2}=\sqrt{9+4}\,g=3.606\,g\).</li>
<li><b>Transferencia máxima.</b> \(P_e(t)=1-(4g^2/\Omega_0^2)\sin^2(\Omega_0t/2)\) alcanza el mínimo \(1-4g^2/\Omega_0^2\): se transfiere como máximo \(4g^2/\Omega_0^2=4/13=0.3077\).</li>
<li><b>Periodo.</b> \(2\pi/\Omega_0=1.743/g=1.743/1.388\times10^5=12.55\ \mu\)s.</li>
<li><b>Ángulo de mezcla.</b> \(\tan2\theta=2g/\Delta=2/3\Rightarrow2\theta=33.69^\circ\), \(\theta=16.85^\circ\): los estados vestidos son casi los desnudos, con una mezcla de \(\sin^2\theta=8.4\,\%\).</li>
<li><b>Comparación.</b> A resonancia (\(\Delta=0\)): transferencia total y periodo \(\pi/g=22.6\ \mu\)s: la desintonía reduce la transferencia y acorta el periodo.</li>
<li><b>Resultado.</b> <span class="ans">\(\Omega_0=3.606\,g\); transferencia máxima \(4/13=0.3077\); periodo \(12.55\ \mu\)s; \(\theta=16.85^\circ\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que el hamiltoniano de Jaynes–Cummings conserva \(N=a^\dagger a+\sigma_+\sigma_-\), que en cada bloque \(\{|e,n\rangle,|g,n+1\rangle\}\) tiene la forma \(H_n\) dada y halle \(\Omega_n\) a resonancia para \(n=0,1,2\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Commutador.</b> \([a^\dagger a,\sigma_+a]=-\sigma_+a\) (pues \([a^\dagger a,a]=-a\)) y \([\sigma_+\sigma_-,\sigma_+a]=\sigma_+a\) (pues \([\sigma_+\sigma_-,\sigma_+]=\sigma_+\)): la suma es 0. Análogamente con \(\sigma_-a^\dagger\). Los términos \(\omega a^\dagger a\) y \(\tfrac12\omega_0\sigma_z\) conmutan con \(N\) (son diagonales en la base).</li>
<li><b>Bloques.</b> Como \(N=n+1\) en \(\{|e,n\rangle,|g,n+1\rangle\}\), \(H\) no conecta estados de distinto \(N\) y es block-diagonal.</li>
<li><b>Elemento de matriz.</b> \(\langle g,n+1|\,g\sigma_-a^\dagger\,|e,n\rangle=g\sqrt{n+1}\) (pues \(a^\dagger|n\rangle=\sqrt{n+1}|n+1\rangle\)); en el sistema rotante las diagonales son \(\pm\Delta/2\).</li>
<li><b>Autovalores.</b> \(\det(H_n-E)=E^2-\Delta^2/4-g^2(n+1)=0\Rightarrow E=\pm\tfrac12\sqrt{\Delta^2+4g^2(n+1)}=\pm\Omega_n/2\).</li>
<li><b>Resonancia.</b> \(\Omega_n=2g\sqrt{n+1}\): \(n=0\): \(2g\); \(n=1\): \(2\sqrt2g=2.828g\); \(n=2\): \(2\sqrt3g=3.464g\).</li>
<li><b>Estado \(|g,0\rangle\).</b> No se acopla a nada (\(\sigma_-a^\dagger|g,0\rangle=0\) y \(\sigma_+a|g,0\rangle=0\)): es el estado fundamental de energía \(-\Delta/2\) en este sistema.</li>
<li><b>Resultado.</b> <span class="ans">\([H,N]=0\); \(H_n=\begin{pmatrix}\Delta/2&g\sqrt{n+1}\\g\sqrt{n+1}&-\Delta/2\end{pmatrix}\); a resonancia \(\Omega_n=2g,\,2.828g,\,3.464g\) para \(n=0,1,2\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Un átomo en \(|e\rangle\) interactúa a resonancia con un campo coherente de \(\bar n=25\) fotones en una cavidad con \(g=1.388\times10^5\ \text{s}^{-1}\). Halle \(t_c\), \(t_r\), su cociente y compárelos con el primer revival exacto; ¿cuánto vale \(P_e\) en el colapso?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Frecuencia de Rabi dominante.</b> \(\Omega_{\bar n}=2g\sqrt{\bar n+1}\approx2g\sqrt{\bar n}=10g\); la dispersión de frecuencias es \(\delta\Omega=\Omega'(n)\,\sigma_n=\frac{g}{\sqrt{\bar n}}\sqrt{\bar n}=g\), con \(\sigma_n=\sqrt{\bar n}\) (Poisson).</li>
<li><b>Colapso.</b> La suma de cosenos decae como \(\ee^{-(\delta\Omega\,t)^2/2}=\ee^{-g^2t^2/2}\): \(t_c=\sqrt2/g=1.414/g=10.2\ \mu\)s.</li>
<li><b>Revival.</b> Términos vecinos difieren en \(\Delta\Omega=g/\sqrt{\bar n}\); se realinean cuando \(\Delta\Omega\,t_r=2\pi\): \(t_r=2\pi\sqrt{\bar n}/g=31.42/g=226.3\ \mu\)s.</li>
<li><b>Cociente.</b> \(t_r/t_c=\sqrt2\pi\sqrt{\bar n}=22.2\): el revival llega mucho después del colapso, y se ve como un segundo «paquete».</li>
<li><b>Exacto.</b> La suma exacta \(\sum_nP_n\cos(2g\sqrt{n+1}t)\) da el primer revival en \(gt=32.10\) (\(1.022\,t_r\)) con \(P_e=0.779\); la pequeña diferencia es el \(\sqrt{\bar n+1}\) frente a \(\sqrt{\bar n}\), y la curvatura de \(\Omega_n\).</li>
<li><b>En el colapso.</b> Para \(gt\gtrsim3\) la suma es muy pequeña: \(P_e(3/g)=0.5057\approx\tfrac12\).</li>
<li><b>Resultado.</b> <span class="ans">\(t_c=1.414/g=10.2\ \mu\)s; \(t_r=31.42/g=226\ \mu\)s; \(t_r/t_c=22.2\); revival exacto en \(32.10/g\) con \(P_e=0.779\); \(P_e\approx0.506\) en el colapso.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Deduzca el efecto Casimir: regularice la energía del punto cero entre dos placas y compruebe el coeficiente \(-\pi^2/720\). Calcule la presión a 1 μm, 100 nm y 10 nm.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Modos.</b> Entre placas, \(k_z=n\pi/d\) (\(n=1,2,\dots\)) con dos polarizaciones (para \(n=0\), una); \(\omega=c\sqrt{k_\parallel^2+\kappa_n^2}\) con \(\kappa_n=n\pi/d\). Energía de punto cero por área: \(E/A=\hb c\sum_n\int\frac{\dd^2k}{(2\pi)^2}\sqrt{k^2+\kappa_n^2}\) (los dos factores \(\tfrac12\) y dos polarizaciones dan 1; el término \(n=0\) cuenta la mitad).</li>
<li><b>Regularización por corte.</b> Con el factor \(\ee^{-\epsilon\omega/c}\): la integral en \(k\) vale \(\frac1{2\pi}\ee^{-\epsilon\kappa}\big(\kappa^2/\epsilon+2\kappa/\epsilon^2+2/\epsilon^3\big)\). Se suma sobre \(n\) con series geométricas exactas y se resta la energía del mismo volumen sin placas (la integral en \(\kappa\)).</li>
<li><b>Desarrollo en \(\epsilon\).</b> Todas las potencias negativas de \(\epsilon\) se cancelan y queda el término finito \(E/A=-\pi^2\hb c/(720d^3)\) (se verifica con álgebra simbólica).</li>
<li><b>Regularización por continuación analítica.</b> \(\int\frac{\dd^2k}{(2\pi)^2}\sqrt{k^2+\kappa^2}\to-\frac{\kappa^3}{6\pi}\), de modo que \(E/A=-\frac{\hb c}{6\pi}\big(\frac\pi d\big)^3\sum n^3=-\frac{\pi^2\hb c}{6d^3}\zeta(-3)=-\frac{\pi^2\hb c}{720d^3}\), con \(\zeta(-3)=1/120\).</li>
<li><b>Presión.</b> \(F/A=-\partial(E/A)/\partial d=-\pi^2\hb c/(240d^4)\); \(\pi^2\hb c/240=1.3001\times10^{-27}\) J·m.</li>
<li><b>Valores.</b> \(d=1\ \mu\)m: \(1.300\times10^{-3}\) Pa. \(d=100\) nm: \(13.0\) Pa. \(d=10\) nm: \(1.30\times10^5\) Pa \(=1.28\) atm (atractiva).</li>
<li><b>Resultado.</b> <span class="ans">\(E/A=-\pi^2\hb c/(720d^3)\); \(P=-\pi^2\hb c/(240d^4)\): \(1.30\) mPa (1 μm), \(13.0\) Pa (100 nm), \(1.30\times10^5\) Pa (10 nm).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>En Jaynes–Cummings con campo coherente (\(\bar n=25\)) y resonancia, calcule el entrelazamiento átomo–campo en \(t=3/g\) y en \(t_r/2\) (entropía y pureza del átomo), y explique por qué en \(t_r/2\) el campo queda en un gato de Schrödinger.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Estado del átomo.</b> \(\rho_A=\begin{pmatrix}P_e&\sum_n\phi_e\phi_g^*\\\cdot&P_g\end{pmatrix}\) con \(\phi_e(n)=c_n\cos(\Omega_nt/2)\), \(\phi_g(n+1)=-\ii c_n\sin(\Omega_nt/2)\).</li>
<li><b>En \(t=3/g\).</b> Tras el colapso: \(P_e=0.5057\), coherencia \(|\rho_{eg}|=0.150\), \(\operatorname{Tr}\rho_A^2=0.5451\) y autovalores \(\tfrac12(1\pm\sqrt{2\cdot0.5451-1})=0.650,\ 0.350\): \(S=-0.65\log_20.65-0.35\log_20.35=0.934\) bits (casi máximamente mezclado).</li>
<li><b>En \(t_r/2=\pi\sqrt{\bar n}/g=15.71/g\).</b> \(P_e=0.5000\), \(\operatorname{Tr}\rho_A^2=0.9827\) y \(S=0.0724\) bits: el átomo está casi puro.</li>
<li><b>Descomposición de Schmidt.</b> El campo reducido tiene la misma pureza \(0.9827\) que el átomo (en un estado puro bipartito, \(\rho_A\) y \(\rho_F\) tienen los mismos autovalores no nulos).</li>
<li><b>Por qué es un gato.</b> A resonancia las dos ramas \(\ee^{\pm\ii\Omega_nt/2}\) giran el estado coherente en \(\pm gt/(2\sqrt{\bar n})\); en \(t_r/2\) es \(\pm\pi/2\). El estado total es, aproximadamente, \(\tfrac1{\sqrt2}(|{\ii\alpha}\rangle\,|\chi_+\rangle+|{-\ii\alpha}\rangle\,|\chi_-\rangle)\) con \(\chi_\pm\) ortogonales que se desacoplan en un estado atómico común: el campo queda en \(|\ii\alpha\rangle+|-\ii\alpha\rangle\), y la función de Wigner muestra dos paquetes separados \(2\sqrt2\alpha\) con franjas de interferencia entre ellos.</li>
<li><b>Resultado.</b> <span class="ans">\(S(3/g)=0.934\) bits (pureza \(0.545\)); \(S(t_r/2)=0.0724\) bits (pureza \(0.9827\)); el campo en \(t_r/2\) es un gato \(|\ii\alpha\rangle+|-\ii\alpha\rangle\) aproximado.</span></li>
</ol></details></li>
</ol>
