<template class="chapter-src" data-id="formalismo" data-num="4" data-title="Operadores, observables y postulados" data-part="Parte I · Los orígenes y la función de onda" data-short="x̂ y p̂ como operadores, hermiticidad, autovalores y desarrollo en autofunciones, los postulados, medida y colapso, conmutadores, incertidumbre de Robertson y el teorema de Ehrenfest">
<p class="lead">Hasta aquí se ha trabajado con la función de onda \(\Psi(x,t)\) y con la ecuación que la gobierna. Este capítulo da el segundo pilar de la teoría: cómo se extrae información de \(\Psi\). A cada magnitud física (posición, momento, energía, momento angular) corresponde un <em>operador</em> lineal y hermítico; los resultados posibles de medirla son sus valores propios; y la probabilidad de cada uno es el módulo cuadrado de un coeficiente de desarrollo. De la estructura algebraica de los operadores, y en particular de sus conmutadores, se deducen la incertidumbre general, la compatibilidad de las medidas y el teorema de Ehrenfest, que explica en qué sentido la mecánica de Newton sobrevive dentro de la cuántica.</p>

<section>
<h2>Observables como operadores</h2>
<p>En la representación de posiciones, \(\hat x\) actúa multiplicando por \(x\) y \(\hat p\) derivando. Toda magnitud clásica \(A(x,p)\) se traduce sustituyendo \(x\to\hat x\), \(p\to\hat p=-\ii\hbar\,\partial_x\):</p>
<div class="eq key" data-name="Operadores básicos">\[\hat x\,\psi=x\,\psi,\qquad \hat p\,\psi=-\ii\hbar\frac{\partial\psi}{\partial x},\qquad \hat H=\frac{\hat p^2}{2m}+V(\hat x)=-\frac{\hbar^2}{2m}\frac{\partial^2}{\partial x^2}+V(x),\qquad \hat T=\frac{\hat p^2}{2m}.\]</div>
<p>El valor esperado (el promedio de muchas medidas sobre sistemas idénticamente preparados) es \(\langle A\rangle=\int\Psi^*\hat A\Psi\,\dd x\). Hay una ambigüedad de orden para productos como \(xp\) (\(\hat x\hat p\neq\hat p\hat x\)); se resuelve simetrizando, \(\tfrac12(\hat x\hat p+\hat p\hat x)\), de modo que el operador sea hermítico. Un operador es <span class="term">hermítico</span> (autoadjunto) si</p>
<div class="eq key" data-name="Hermiticidad">\[\int f^*\,(\hat A g)\,\dd x=\int(\hat Af)^*\,g\,\dd x\quad\text{para todo }f,g;\qquad\text{en notación de Dirac: }\ \langle f|\hat Ag\rangle=\langle\hat Af|g\rangle .\]</div>
<p>Se exige porque implica que \(\langle A\rangle\) es real: \(\langle A\rangle^*=\langle\Psi|\hat A\Psi\rangle^*=\langle\hat A\Psi|\Psi\rangle=\langle\Psi|\hat A\Psi\rangle\). Para \(\hat p\), integrando por partes (con \(f,g\to0\) en el infinito): \(\int f^*(-\ii\hbar g')\dd x=\ii\hbar\int f'^*g\dd x=\int(-\ii\hbar f')^*g\dd x\): es hermítico. El operador \(\mathrm{d}/\mathrm{d}x\) solo, en cambio, es antihermítico (el signo cambia), y por eso en \(\hat p\) hace falta el \(\ii\).</p>
</section>

<section>
<h2>Autovalores, autofunciones y completitud</h2>
<p>Un valor propio \(a\) y su función propia \(\psi_a\) cumplen \(\hat A\psi_a=a\,\psi_a\). Los operadores hermíticos tienen dos propiedades que dan sentido físico a toda la teoría:</p>
<ul>
<li><strong>Los valores propios son reales.</strong> \(a\langle\psi_a|\psi_a\rangle=\langle\psi_a|\hat A\psi_a\rangle=\langle\hat A\psi_a|\psi_a\rangle=a^*\langle\psi_a|\psi_a\rangle\), luego \(a=a^*\). Los resultados de una medida son números reales.</li>
<li><strong>Las funciones propias de valores propios distintos son ortogonales.</strong> Con \(\hat A\psi_a=a\psi_a\), \(\hat A\psi_b=b\psi_b\): \(\langle\psi_a|\hat A\psi_b\rangle=b\langle\psi_a|\psi_b\rangle\) y también \(=\langle\hat A\psi_a|\psi_b\rangle=a\langle\psi_a|\psi_b\rangle\). Restando, \((a-b)\langle\psi_a|\psi_b\rangle=0\). Si hay degeneración, siempre se puede ortogonalizar (Gram–Schmidt).</li>
</ul>
<p>El postulado de <em>completitud</em> afirma que las funciones propias de un observable forman una base: cualquier función de onda se desarrolla en ellas,</p>
<div class="eq key" data-name="Desarrollo en una base propia">\[\Psi=\sum_nc_n\psi_n,\qquad c_n=\langle\psi_n|\Psi\rangle=\int\psi_n^*\Psi\,\dd x,\qquad \sum_n|c_n|^2=1.\]</div>
<p>Los coeficientes se obtienen por ortogonalidad (el truco de Fourier). Para espectros continuos la suma es una integral y la ortogonalidad es de Dirac. Dos casos continuos son clave: las funciones propias de \(\hat p\) son ondas planas \(f_p(x)=e^{ipx/\hbar}/\sqrt{2\pi\hbar}\), con \(\langle f_p|f_{p'}\rangle=\delta(p-p')\) (el desarrollo en ellas es la transformada de Fourier del capítulo 3), y las de \(\hat x\) son deltas, \(g_{x_0}(x)=\delta(x-x_0)\): \(\Psi(x_0)\) es el coeficiente de desarrollo de \(\Psi\) en la base de posiciones.</p>
</section>

<section>
<h2>Los postulados de la mecánica cuántica</h2>
<p>Con lo anterior se puede enunciar la teoría completa, en versión no relativista:</p>
<div class="box def"><h4>Postulados</h4><ol>
<li><strong>Estado.</strong> El estado de un sistema en un instante está descrito por una función de onda normalizada \(\Psi\) (un vector de un espacio de Hilbert). Los múltiplos \(e^{i\gamma}\Psi\) describen el mismo estado.</li>
<li><strong>Observables.</strong> A cada magnitud física \(A\) corresponde un operador hermítico \(\hat A\), construido a partir de la expresión clásica con \(x\to\hat x\), \(p\to-\ii\hbar\partial_x\).</li>
<li><strong>Medida: resultados.</strong> Los únicos resultados posibles de medir \(A\) son los valores propios \(a_n\) de \(\hat A\).</li>
<li><strong>Medida: probabilidades.</strong> Si el sistema está en \(\Psi=\sum c_n\psi_n\), la probabilidad de obtener \(a_n\) es \(|c_n|^2=|\langle\psi_n|\Psi\rangle|^2\) (regla de Born generalizada; en el espectro continuo, \(|\langle a|\Psi\rangle|^2\dd a\)). Por tanto \(\langle A\rangle=\sum|c_n|^2a_n=\langle\Psi|\hat A\Psi\rangle\).</li>
<li><strong>Colapso.</strong> Inmediatamente después de una medida que dio \(a_n\), el estado es la función propia \(\psi_n\) (proyectada y normalizada, si hay degeneración). Una segunda medida inmediata da \(a_n\) con certeza.</li>
<li><strong>Evolución.</strong> Entre medidas, el estado evoluciona según \(\ii\hbar\,\partial_t\Psi=\hat H\Psi\).</li>
</ol></div>
<p>Los postulados 5 y 6 describen dos tipos de cambio completamente diferentes: la evolución de Schrödinger es continua, determinista y reversible (unitaria), y el colapso es instantáneo, aleatorio e irreversible. Esta tensión es el <em>problema de la medida</em> (capítulo 32). De momento basta con usar el recetario, que ha sido comprobado en todos los experimentos hasta hoy.</p>
<div class="box ex"><h4>Medir la energía de una partícula en la caja</h4>
<p><strong>Problema.</strong> Una partícula en una caja \(0\lt x\lt L\) está en \(\Psi=Ax(L-x)\). ¿Qué energías pueden obtenerse y con qué probabilidades? <strong>Procedimiento.</strong> (1) Estados propios de \(\hat H\): \(\psi_n=\sqrt{2/L}\sin(n\pi x/L)\), \(E_n=n^2\pi^2\hbar^2/2mL^2\). (2) Normalizar: \(A=\sqrt{30/L^5}\) (capítulo 2). (3) Coeficientes: \(c_n=\sqrt{\tfrac2L}A\int_0^Lx(L-x)\sin\tfrac{n\pi x}{L}\dd x=\sqrt{\tfrac{60}{L^6}}\cdot\dfrac{2L^3}{(n\pi)^3}\left[1-(-1)^n\right]\), es decir \(c_n=\dfrac{8\sqrt{15}}{(n\pi)^3}\) para \(n\) impar y \(0\) para \(n\) par. (4) Probabilidades: \(P_n=|c_n|^2=\dfrac{960}{(n\pi)^6}\), con \(P_1=960/\pi^6=0.99856\), \(P_3=0.00137\), \(P_5=6.4\times10^{-5}\), y \(P_n=0\) si \(n\) es par (la parábola es simétrica respecto al centro, igual que \(\psi_1,\psi_3,\dots\) y opuesta a \(\psi_2,\psi_4,\dots\)). (5) Energía media: \(\langle E\rangle=\sum P_nE_n=\dfrac{5\hbar^2}{mL^2}=\dfrac{10}{\pi^2}E_1=1.0132\,E_1\). <strong>Resultado.</strong> Casi seguro se mide \(E_1\) (99.86 %), y el valor medio supera a \(E_1\) en solo 1.3 %: la parábola se parece mucho al estado fundamental.</p></div>
<div class="sim" data-sim="expansion" data-title="Desarrollo en autoestados de la energía y probabilidades de cada resultado"></div>
<div class="sim-guide"><ul>
<li>Parábola, un solo término: el error cuadrático \(\|\psi-\psi_1\|^2\) es \(1.44\times10^{-3}\), y \(P_1=99.856\ \%\), la cifra del ejemplo. Con tres términos (\(n=1,3\) y el \(n=2\) que vale cero) el error baja a \(7.5\times10^{-5}\) y la serie reproduce la parábola a simple vista.</li>
<li>Triángulo con pico en 1/2: los coeficientes pares también se anulan por la simetría, pero la serie converge más despacio (\(c_n\propto1/n^2\)) porque la función tiene un vértice. Con el pulso rectangular los coeficientes decaen como \(1/n\) y \(\langle E\rangle\) diverge: un estado con bordes abruptos no tiene energía finita.</li>
<li>«Mezcla ψ₂ + 0.5 ψ₅»: solo dos resultados posibles, con \(P_2=0.8\) y \(P_5=0.2\); con \(N=1\) ya se pierde la mitad del contenido. Y con «Estado propio ψ₃» una sola barra vale 1: medir \(E\) da \(E_3\) con certeza.</li>
</ul></div>
<div class="sim" data-sim="medida" data-title="Medidas repetidas de la energía: frecuencias frente a |c_n|² y colapso"></div>
<div class="sim-guide"><ul>
<li>Con pesos 0.5, 0.3, 0.2 se predice \(\langle E\rangle=0.5\cdot1+0.3\cdot4+0.2\cdot9=3.5\,E_1\). Los histogramas convergen a las barras azules con un error típico \(\sqrt{p(1-p)/N}\) (la barra negra): con \(N=100\) las frecuencias fluctúan en unos 5 puntos porcentuales, con \(N=10^5\) en 0.15.</li>
<li>Cada medida individual es impredecible; solo la estadística lo es. Y la medida cambia el estado: la segunda medida sobre el sistema ya colapsado repite el resultado el 100 % de las veces, como exige el postulado 5.</li>
<li>Ponga dos pesos en cero: queda un estado propio puro y todos los resultados son iguales. Es el único caso en que una medida de \(E\) no tiene aleatoriedad.</li>
</ul></div>
</section>

<section>
<h2>Conmutadores y compatibilidad</h2>
<p>El producto de operadores no es conmutativo en general. Se define el <span class="term">conmutador</span> \([\hat A,\hat B]=\hat A\hat B-\hat B\hat A\). El fundamental es el de posición y momento: aplicando a una función de prueba,</p>
<div class="eq">\[[\hat x,\hat p]f=-\ii\hbar\left[x f'-(xf)'\right]=\ii\hbar f\quad\Longrightarrow\quad [\hat x,\hat p]=\ii\hbar.\]</div>
<p>Esta única relación contiene toda la cinemática cuántica. De ella y de la regla \([\hat A,\hat B\hat C]=[\hat A,\hat B]\hat C+\hat B[\hat A,\hat C]\) salen \([\hat x,\hat p^2]=2\ii\hbar\hat p\), \([\hat x,f(\hat p)]=\ii\hbar f'(\hat p)\) y \([\hat p,V(\hat x)]=-\ii\hbar V'(\hat x)\). Dos observables son <span class="term">compatibles</span> si sus operadores conmutan, y entonces tienen una base común de funciones propias: si \(\hat A\psi=a\psi\) y \([\hat A,\hat B]=0\), \(\hat A(\hat B\psi)=\hat B\hat A\psi=a(\hat B\psi)\), de modo que \(\hat B\psi\) es otra función propia de \(\hat A\) con el mismo \(a\) (para un valor no degenerado, es proporcional a \(\psi\)). Se pueden medir con precisión arbitraria a la vez. Si no conmutan, no.</p>
<h3>La incertidumbre de Robertson</h3>
<div class="eq key" data-name="Desigualdad de incertidumbre general (Robertson, 1929)">\[\Delta A\,\Delta B\ \ge\ \tfrac12\left|\langle[\hat A,\hat B]\rangle\right|,\qquad \Delta A=\sqrt{\langle\hat A^2\rangle-\langle\hat A\rangle^2}.\]</div>
<p><strong>Demostración.</strong> Sean \(f=(\hat A-\langle A\rangle)\Psi\) y \(g=(\hat B-\langle B\rangle)\Psi\), de modo que \(\|f\|=\Delta A\), \(\|g\|=\Delta B\). La desigualdad de Schwarz da \(\Delta A^2\Delta B^2\ge|\langle f|g\rangle|^2\). Escribiendo \(\langle f|g\rangle=z=x+\ii y\), \(|z|^2\ge y^2\) con \(y=\mathrm{Im}\,z=\dfrac1{2\ii}(\langle f|g\rangle-\langle g|f\rangle)\). Con la hermiticidad, \(\langle f|g\rangle=\langle\hat A\hat B\rangle-\langle A\rangle\langle B\rangle\) y \(\langle g|f\rangle=\langle\hat B\hat A\rangle-\langle A\rangle\langle B\rangle\); la diferencia es \(\langle[\hat A,\hat B]\rangle\). Entonces \(y=\langle[\hat A,\hat B]\rangle/2\ii\) y \(\Delta A\Delta B\ge|y|\). \(\blacksquare\) Con \([\hat x,\hat p]=\ii\hbar\) sale \(\Delta x\Delta p\ge\hbar/2\), el resultado del capítulo 3, ahora para <em>cualquier</em> estado.</p>
<p>La incertidumbre así entendida es una propiedad del estado: describe la dispersión de resultados de dos magnitudes medidas en réplicas idénticas, no un límite de precisión del aparato. Y el cociente no es fijo: depende de \(\langle[\hat A,\hat B]\rangle\), que en el caso del momento angular (capítulo 12) puede anularse en ciertos estados.</p>
<div class="box ex"><h4>¿Cuánto vale ΔxΔp en el estado fundamental de la caja?</h4>
<p><strong>Procedimiento.</strong> (1) \(\psi_1=\sqrt{2/L}\sin(\pi x/L)\): por simetría \(\langle x\rangle=L/2\); \(\langle x^2\rangle=L^2\left(\tfrac13-\tfrac1{2\pi^2}\right)\), luego \(\Delta x^2=L^2\left(\tfrac1{12}-\tfrac1{2\pi^2}\right)\) y \(\Delta x=0.1807L\). (2) \(\langle p\rangle=0\) (la función es real); \(\langle p^2\rangle=2mE_1=\pi^2\hbar^2/L^2\), \(\Delta p=\pi\hbar/L\). (3) Producto: \(\Delta x\Delta p=0.5679\,\hbar=1.1357\times\tfrac\hbar2\). <strong>Resultado.</strong> Cumple la cota con un 13.6 % de margen; la gaussiana es el único estado con el 0 %.</p></div>
</section>

<section>
<h2>Evolución de los valores esperados: el teorema de Ehrenfest</h2>
<p>¿Cómo cambia en el tiempo el valor esperado de un observable \(\hat A\)? Derivando \(\langle A\rangle=\langle\Psi|\hat A\Psi\rangle\) y usando \(\partial_t\Psi=\hat H\Psi/\ii\hbar\) con \(\hat H\) hermítico:</p>
<div class="eq key" data-name="Ecuación de movimiento de un valor esperado">\[\frac{\dd\langle A\rangle}{\dd t}=\frac{\ii}{\hbar}\left\langle[\hat H,\hat A]\right\rangle+\left\langle\frac{\partial\hat A}{\partial t}\right\rangle.\]</div>
<p>Para \(\hat A=\hat x\) y \(\hat A=\hat p\), con \([\hat H,\hat x]=-\ii\hbar\hat p/m\) y \([\hat H,\hat p]=\ii\hbar V'(\hat x)\), se obtiene el <span class="term">teorema de Ehrenfest</span> (1927):</p>
<div class="eq key" data-name="Teorema de Ehrenfest">\[\frac{\dd\langle x\rangle}{\dd t}=\frac{\langle p\rangle}{m},\qquad \frac{\dd\langle p\rangle}{\dd t}=-\left\langle V'(x)\right\rangle.\]</div>
<p>Son las ecuaciones de Newton para los valores esperados, salvo un detalle esencial: la fuerza que aparece es \(-\langle V'(x)\rangle\), el promedio de la fuerza sobre la distribución de probabilidad, y no \(-V'(\langle x\rangle)\), la fuerza en el punto medio. Si \(V'\) es lineal en \(x\) (potencial armónico), ambas coinciden, y el paquete sigue exactamente la trayectoria clásica. Si no, expandiendo \(V'(x)\) alrededor de \(\langle x\rangle\), \(\langle V'\rangle=V'(\langle x\rangle)+\tfrac12V'''(\langle x\rangle)\Delta x^2+\dots\): la corrección es proporcional a la anchura del paquete al cuadrado y a la anarmonicidad. En el límite clásico (paquetes estrechos respecto de la escala de variación del potencial) tiende a cero, y de ahí vuelve la mecánica de Newton.</p>
<div class="sim" data-sim="ehrenfest" data-title="Ehrenfest: el valor esperado frente a la trayectoria clásica en distintos potenciales"></div>
<div class="sim-guide"><ul>
<li>Potencial armónico: \(\langle x\rangle(t)\) y la trayectoria clásica se superponen para siempre, y \(\langle V'\rangle=V'(\langle x\rangle)\) exactamente. El paquete solo cambia de anchura, y para \(\sigma=1/\sqrt2\) (el estado fundamental desplazado) ni siquiera eso: es un estado coherente (capítulo 10).</li>
<li>Anarmónico (\(V=x^2/2+x^4/4\)): las dos curvas se separan tras pocos periodos, con el paquete más ensanchado y amortiguado (se «desfasa» por la dependencia del periodo con la energía). Las dos fuerzas de la lectura difieren, y la diferencia crece con la anchura \(\sigma\): con \(\sigma=1.5\), ya desde el primer ciclo.</li>
<li>La energía \(\langle E\rangle\) y la norma se conservan con 4–5 cifras (el método de operador dividido es unitario); es una comprobación de la solución numérica.</li>
</ul></div>
<p>El mismo formalismo da las leyes de conservación. Si \(\hat A\) no depende explícitamente del tiempo y conmuta con \(\hat H\), \(\dd\langle A\rangle/\dd t=0\) en <em>todos</em> los estados: es una cantidad conservada. La energía (\(\hat A=\hat H\)) siempre lo es si \(V\) no depende de \(t\). El momento \(\hat p\) se conserva si \([\hat H,\hat p]=0\), esto es, si \(V\) es constante (invariancia bajo traslaciones); y la paridad, si \(V(-x)=V(x)\). Este enlace entre simetrías y conservación se formaliza en el capítulo 18. Y con \(\hat A=\hat x\hat p\) se obtiene el <span class="term">teorema del virial</span>: \(\dd\langle xp\rangle/\dd t=2\langle T\rangle-\langle xV'\rangle\); en un estado estacionario la derivada es nula y \(2\langle T\rangle=\langle xV'(x)\rangle\) (en tres dimensiones, \(2\langle T\rangle=\langle\mathbf r\cdot\nabla V\rangle\)).</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Demuestre que los operadores \(\hat x\hat p\) y \(\hat p\hat x\) no son hermíticos pero \(\tfrac12(\hat x\hat p+\hat p\hat x)\) sí, y calcule \(\hat x\hat p-\hat p\hat x\) actuando sobre \(f(x)\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Adjunto de un producto.</b> \((\hat A\hat B)^\dagger=\hat B^\dagger\hat A^\dagger\). Con \(\hat x^\dagger=\hat x\) y \(\hat p^\dagger=\hat p\): \((\hat x\hat p)^\dagger=\hat p\hat x\), y \((\hat p\hat x)^\dagger=\hat x\hat p\).</li>
<li><b>Conclusión.</b> Como \(\hat x\hat p\neq\hat p\hat x\), ninguno de los dos es igual a su adjunto: no son hermíticos. En cambio \(\tfrac12(\hat x\hat p+\hat p\hat x)^\dagger=\tfrac12(\hat p\hat x+\hat x\hat p)\): es hermítico.</li>
<li><b>Conmutador.</b> \(\hat x\hat pf=-\ii\hbar xf'\); \(\hat p\hat xf=-\ii\hbar(xf)'=-\ii\hbar(f+xf')\). Entonces \((\hat x\hat p-\hat p\hat x)f=-\ii\hbar xf'+\ii\hbar f+\ii\hbar xf'=\ii\hbar f\).</li>
<li><b>Resultado.</b> <span class="ans">\([\hat x,\hat p]=\ii\hbar\); la combinación simetrizada \(\tfrac12(\hat x\hat p+\hat p\hat x)=\hat x\hat p-\tfrac{\ii\hbar}2\) es hermítica.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Para \(\Psi=\sqrt{30/L^5}\,x(L-x)\) en la caja, compruebe que \(P_1=960/\pi^6\), que \(\langle E\rangle=10E_1/\pi^2\) y que \(\sum_nP_n=1\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Coeficientes.</b> \(c_n=\sqrt{\tfrac2L}\sqrt{\tfrac{30}{L^5}}\int_0^Lx(L-x)\sin\tfrac{n\pi x}L\dd x\). Con \(x=Lu\): \(\int_0^1u(1-u)\sin n\pi u\,\dd u=\dfrac{2[1-(-1)^n]}{(n\pi)^3}\). Entonces \(c_n=\sqrt{60}\,\dfrac{2[1-(-1)^n]}{(n\pi)^3}\), igual a \(\dfrac{4\sqrt{60}}{(n\pi)^3}=\dfrac{8\sqrt{15}}{(n\pi)^3}\) para \(n\) impar.</li>
<li><b>Probabilidad de \(E_1\).</b> \(P_1=c_1^2=\dfrac{64\cdot15}{\pi^6}=\dfrac{960}{\pi^6}=0.99856\).</li>
<li><b>Suma.</b> \(\sum_nP_n=\dfrac{960}{\pi^6}\sum_{n\ \text{impar}}n^{-6}=\dfrac{960}{\pi^6}\cdot\dfrac{\pi^6}{960}=1\), pues \(\sum_{n\ \text{impar}}n^{-6}=(1-2^{-6})\zeta(6)=\dfrac{63}{64}\cdot\dfrac{\pi^6}{945}=\dfrac{\pi^6}{960}\).</li>
<li><b>Energía media.</b> Directamente: \(\langle E\rangle=\dfrac{\hbar^2}{2m}\int|\Psi'|^2\dd x=\dfrac{\hbar^2}{2m}\dfrac{30}{L^5}\int_0^L(L-2x)^2\dd x=\dfrac{\hbar^2}{2m}\dfrac{30}{L^5}\dfrac{L^3}3=\dfrac{5\hbar^2}{mL^2}\). Con \(E_1=\pi^2\hbar^2/2mL^2\): \(\langle E\rangle=\dfrac{10}{\pi^2}E_1=1.0132\,E_1\). (Por la serie: \(\sum_nP_nn^2E_1=\dfrac{960}{\pi^6}\sum_{\text{impar}}n^{-4}E_1=\dfrac{960}{\pi^6}\cdot\dfrac{\pi^4}{96}E_1=\dfrac{10}{\pi^2}E_1\); mismo valor.)</li>
<li><b>Resultado.</b> <span class="ans">\(P_1=0.99856\), \(\sum P_n=1\), \(\langle E\rangle=10E_1/\pi^2=1.0132\,E_1\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que \([\hat x^2,\hat p]=2\ii\hbar\hat x\), \([\hat x,\hat p^2]=2\ii\hbar\hat p\) y use \([\hat H,\hat x]\) para obtener \(\dd\langle x\rangle/\dd t\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Regla.</b> \([\hat A\hat B,\hat C]=\hat A[\hat B,\hat C]+[\hat A,\hat C]\hat B\) y \([\hat A,\hat B\hat C]=[\hat A,\hat B]\hat C+\hat B[\hat A,\hat C]\).</li>
<li><b>\([\hat x^2,\hat p]\).</b> \([\hat x\hat x,\hat p]=\hat x[\hat x,\hat p]+[\hat x,\hat p]\hat x=\ii\hbar\hat x+\ii\hbar\hat x=2\ii\hbar\hat x\).</li>
<li><b>\([\hat x,\hat p^2]\).</b> \([\hat x,\hat p\hat p]=[\hat x,\hat p]\hat p+\hat p[\hat x,\hat p]=2\ii\hbar\hat p\).</li>
<li><b>\([\hat H,\hat x]\).</b> \(\hat H=\hat p^2/2m+V(\hat x)\), y \(V(\hat x)\) conmuta con \(\hat x\): \([\hat H,\hat x]=\dfrac1{2m}[\hat p^2,\hat x]=-\dfrac{2\ii\hbar\hat p}{2m}=-\dfrac{\ii\hbar\hat p}m\).</li>
<li><b>Ehrenfest.</b> \(\dfrac{\dd\langle x\rangle}{\dd t}=\dfrac\ii\hbar\langle[\hat H,\hat x]\rangle=\dfrac\ii\hbar\left(-\dfrac{\ii\hbar}m\right)\langle p\rangle=\dfrac{\langle p\rangle}m\).</li>
<li><b>Resultado.</b> <span class="ans">\([\hat x^2,\hat p]=2\ii\hbar\hat x\); \([\hat x,\hat p^2]=2\ii\hbar\hat p\); \(\dd\langle x\rangle/\dd t=\langle p\rangle/m\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Calcule \(\Delta x\), \(\Delta p\) y el cociente \(\Delta x\Delta p/(\hbar/2)\) para el estado \(n=1\) de la caja, y compruebe la desigualdad de Robertson.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Posición.</b> \(\langle x^2\rangle=\tfrac2L\int_0^Lx^2\sin^2\tfrac{\pi x}L\dd x=L^2\left(\tfrac13-\tfrac1{2\pi^2}\right)=0.28267L^2\); \(\langle x\rangle=L/2\). \(\Delta x^2=0.28267L^2-0.25L^2=0.03267L^2\), \(\Delta x=0.18076L\).</li>
<li><b>Momento.</b> \(\langle p\rangle=0\). \(\langle p^2\rangle=2mE_1=\pi^2\hbar^2/L^2\), luego \(\Delta p=\pi\hbar/L=3.1416\,\hbar/L\).</li>
<li><b>Producto.</b> \(\Delta x\Delta p=0.18076\times3.1416\,\hbar=0.56786\,\hbar\). Cociente con \(\hbar/2\): \(1.1357\).</li>
<li><b>Cota.</b> La cota \(\tfrac12|\langle[\hat x,\hat p]\rangle|=\tfrac\hbar2\). Como \(0.5679\hbar\ge0.5\hbar\), se cumple. En general \(\Delta x\Delta p=\tfrac\hbar2\sqrt{n^2\pi^2/3-2}\), que crece con \(n\).</li>
<li><b>Resultado.</b> <span class="ans">\(\Delta x=0.1808\,L\), \(\Delta p=\pi\hbar/L\), \(\Delta x\Delta p=1.136\,\hbar/2\).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Demuestre el teorema del virial para estados estacionarios, \(2\langle T\rangle=\langle xV'\rangle\), y úselo para hallar \(\langle T\rangle\) y \(\langle V\rangle\) en un oscilador armónico y en el átomo de hidrógeno (\(V=-k/r\); en tres dimensiones \(2\langle T\rangle=\langle\mathbf r\cdot\nabla V\rangle\)), con \(E_1=-13.606\) eV.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Movimiento de \(\hat x\hat p\).</b> Con la ecuación de movimiento, \(\dfrac{\dd\langle xp\rangle}{\dd t}=\dfrac\ii\hbar\langle[\hat H,\hat x\hat p]\rangle\). Se calcula \([\hat H,\hat x\hat p]=[\hat H,\hat x]\hat p+\hat x[\hat H,\hat p]=-\dfrac{\ii\hbar}m\hat p^2+\ii\hbar\hat xV'(\hat x)\).</li>
<li><b>Resultado general.</b> \(\dfrac{\dd\langle xp\rangle}{\dd t}=\dfrac\ii\hbar\left(-\dfrac{\ii\hbar}m\langle p^2\rangle+\ii\hbar\langle xV'\rangle\right)=\dfrac{\langle p^2\rangle}m-\langle xV'\rangle=2\langle T\rangle-\langle xV'\rangle\).</li>
<li><b>Estado estacionario.</b> Los valores esperados no dependen de \(t\), luego la derivada es nula: \(2\langle T\rangle=\langle xV'\rangle\).</li>
<li><b>Oscilador.</b> \(V=\tfrac12m\omega^2x^2\), \(xV'=2V\): \(\langle T\rangle=\langle V\rangle\); con \(E=\langle T\rangle+\langle V\rangle\), cada uno vale \(E/2\) (para \(E_n=\hbar\omega(n+\tfrac12)\)).</li>
<li><b>Hidrógeno.</b> \(V=-k/r\): \(\mathbf r\cdot\nabla V=r\,\partial_rV=k/r=-V\). Entonces \(2\langle T\rangle=-\langle V\rangle\), \(E=\langle T\rangle+\langle V\rangle=-\langle T\rangle\). Para el estado fundamental, \(E_1=-13.606\) eV: \(\langle T\rangle=+13.606\) eV y \(\langle V\rangle=2E_1=-27.211\) eV.</li>
<li><b>Resultado.</b> <span class="ans">Oscilador: \(\langle T\rangle=\langle V\rangle=E/2\). Hidrógeno: \(\langle T\rangle=-E=13.606\) eV, \(\langle V\rangle=2E=-27.211\) eV.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>La matriz hermítica \(A=\begin{pmatrix}2&1-\ii\\1+\ii&3\end{pmatrix}\) representa un observable de un sistema de dos estados, y el sistema está en \(\psi=(1,0)^T\). Halle los resultados posibles, sus probabilidades, \(\langle A\rangle\) y \(\Delta A\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Valores propios.</b> \(\det(A-\lambda)=(2-\lambda)(3-\lambda)-|1-\ii|^2=\lambda^2-5\lambda+6-2=\lambda^2-5\lambda+4=0\Rightarrow\lambda=1,\,4\) (reales, como debe ser).</li>
<li><b>Vectores propios.</b> Para \(\lambda=1\): \((A-1)v=0\Rightarrow v_1+(1-\ii)v_2=0\), \(v\propto(-1+\ii,\,1)\), normalizado, \(v_{(1)}=(-1+\ii,\,1)/\sqrt3\). Para \(\lambda=4\): \(-2v_1+(1-\ii)v_2=0\), \(v\propto(1-\ii,\,2)\), \(v_{(4)}=(1-\ii,\,2)/\sqrt6\). Se comprueba la ortogonalidad: \(\langle v_{(1)}|v_{(4)}\rangle\propto(-1+\ii)^*(1-\ii)+1\cdot2=(-1-\ii)(1-\ii)+2=-2+2=0\). ✓</li>
<li><b>Probabilidades.</b> \(P(1)=|\langle v_{(1)}|\psi\rangle|^2=|(-1-\ii)/\sqrt3|^2=2/3\); \(P(4)=|(1+\ii)/\sqrt6|^2=2/6=1/3\). Suman 1.</li>
<li><b>Promedio.</b> \(\langle A\rangle=\tfrac23(1)+\tfrac13(4)=2\), igual al elemento \(A_{11}=2\) (\(\langle\psi|A|\psi\rangle\)).</li>
<li><b>Dispersión.</b> \(\langle A^2\rangle=\tfrac23(1)+\tfrac13(16)=6\), que coincide con \((A^2)_{11}=A_{11}^2+|A_{12}|^2=4+2=6\). \(\Delta A^2=6-4=2\), \(\Delta A=\sqrt2=1.414\).</li>
<li><b>Resultado.</b> <span class="ans">Resultados 1 y 4 con probabilidades 2/3 y 1/3; \(\langle A\rangle=2\); \(\Delta A=\sqrt2\).</span></li>
</ol></details></li>
</ol>
