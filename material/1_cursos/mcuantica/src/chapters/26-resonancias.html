<template class="chapter-src" data-id="resonancias" data-num="26" data-title="Baja energía, resonancias y el teorema de Levinson" data-part="Parte V · Dispersión y resonancias" data-short="Longitud de dispersión y estados ligados virtuales, dispersión a energía cero, efecto Ramsauer–Townsend, resonancias de forma y fórmula de Breit–Wigner, retardo de Wigner y teorema de Levinson">
<p class="lead">Una sección eficaz es una función de la energía, y sus rasgos más llamativos (picos agudos, mínimos profundos, valores enormes cerca del umbral) tienen una interpretación física precisa: estados casi ligados, estados ligados que están a punto de aparecer, partículas inestables. Este capítulo muestra cómo leer esos rasgos a partir de los desplazamientos de fase \(\delta_l(E)\) del capítulo 25: la longitud de dispersión a baja energía, las resonancias que se ven como un aumento brusco de \(\delta_l\) en \(\pi\) y el teorema de Levinson, que cuenta los estados ligados a partir de la dispersión.</p>

<section>
<h2>Baja energía y la longitud de dispersión</h2>
<p>A energías muy bajas solo contribuye la onda s, y en el límite \(k\to0\) el desplazamiento de fase es \(\delta_0\approx-ka_s\), lo que define la <span class="term">longitud de dispersión</span> \(a_s\) (para la esfera dura es el radio \(a\)). Con corrección de rango efectivo,</p>
<div class="eq key" data-name="Desarrollo de rango efectivo">\[k\cot\delta_0=-\frac1{a_s}+\frac12r_ek^2+\dots,\qquad\sigma(k\to0)=4\pi a_s^2,\qquad a_s=a\left(1-\frac{\tan K_0a}{K_0a}\right)\ \text{(pozo esférico, }K_0=\sqrt{2mV_0}/\hbar).\]</div>
<p>La longitud de dispersión contiene toda la información de baja energía en un solo número: su signo y su magnitud indican si el potencial es esencialmente repulsivo (\(a_s>0\) pequeño) o atractivo. Para un pozo se anula cuando \(\tan K_0a=K_0a\) (\(K_0a=4.4934\)), y diverge cuando \(K_0a=(n+\tfrac12)\pi\): justo cuando el pozo se hace lo bastante profundo como para atar un nuevo estado ligado, \(a_s\to\pm\infty\) y la sección eficaz a energía cero se hace enorme (una «resonancia a energía cero»). Para \(a_s>0\) grande, el pozo tiene un estado ligado débil con energía \(B\approx\hbar^2/2\mu a_s^2\) y a bajas energías la dispersión es universal: depende solo de \(a_s\), no de los detalles del potencial. Con \(a_s<0\) grande el sistema está justo del lado sin enlace: hay un <em>estado virtual</em> (el caso del dineutrón o del singlete np, con \(a_s=-23.7\) fm). En átomos ultrafríos se ajusta \(a_s\) a voluntad con un campo magnético (resonancias de Feshbach), pasando de \(-\infty\) a \(+\infty\), para estudiar el cruce entre superconductividad BCS y condensación de moléculas.</p>
<p>El <span class="term">efecto Ramsauer–Townsend</span> (1921) es la contrapartida: para electrones lentos en gases nobles, la sección eficaz presenta un mínimo cercano a 0.7 eV en el xenón, donde el gas es casi transparente. Sucede cuando el pozo atómico es tal que \(\delta_0=\pi\) (o \(a_s\approx0\)): la onda s «pasa» el átomo sin dispersarse, porque la fase acumulada dentro del potencial es una vuelta completa; es un fenómeno puramente ondulatorio sin análogo clásico.</p>
<div class="sim" data-sim="long-dispersion" data-title="Longitud de dispersión de un pozo esférico: polos en el umbral de cada estado ligado"></div>
<div class="sim-guide"><ul>
<li>\(K_0a=1.2\): \(a_s=-1.143\,a\), \(\sigma(0)=16.43\,a^2\) (sin estados ligados). Con \(K_0a=1.55\) (casi \(\pi/2=1.5708\)): \(a_s=-30.0\,a\) y \(\sigma(0)=11\,324\,a^2\), cuatro órdenes de magnitud mayor que el área del pozo: el umbral del primer estado ligado. Con \(K_0a=2.2\): \(a_s=1.624\,a\) (1 estado ligado, \(a_s>0\)) y con \(K_0a=4\): \(a_s=0.711\,a\).</li>
<li>Con \(K_0a=4.4934\): \(a_s=4\times10^{-5}\,a\approx0\): la dispersión de baja energía desaparece y \(\sigma\) tiene un mínimo casi nulo: el efecto Ramsauer–Townsend. El panel de la derecha muestra \(a_s/a\) con sus polos en \(\pi/2\), \(3\pi/2\), \(5\pi/2\), …</li>
</ul></div>
</section>

<section>
<h2>Resonancias y la fórmula de Breit–Wigner</h2>
<p>Para \(l\ge1\) la barrera centrífuga \(\hbar^2l(l+1)/2\mu r^2\) sumada a un pozo atractivo forma un pozo con una barrera: una partícula con energía menor que el tope de la barrera puede quedar «atrapada» un tiempo, hasta que escapa por túnel. Es una <span class="term">resonancia de forma</span>: un estado casi ligado de energía \(E_r\) y vida media \(\tau=\hbar/\Gamma\). En la dispersión se manifiesta como un aumento rápido del desplazamiento de fase en \(\pi\) en un intervalo de energías \(\sim\Gamma\), que pasa por \(\pi/2\) en \(E_r\); cerca de \(E_r\):</p>
<div class="eq key" data-name="Fórmula de Breit–Wigner">\[\delta_l(E)\approx\delta_\text{fondo}+\arctan\frac{\Gamma/2}{E_r-E},\qquad\sigma_l(E)=\frac{4\pi(2l+1)}{k^2}\,\frac{(\Gamma/2)^2}{(E-E_r)^2+(\Gamma/2)^2},\qquad\Gamma=\frac2{\dd\delta_l/\dd E}\Big|_{E_r}.\]</div>
<p>En el pico, \(\sigma_l\) alcanza el valor máximo permitido por la unitariedad, \(4\pi(2l+1)/k^2\) (\(\delta_l=\pi/2\)), mucho mayor que el área geométrica. En términos de la matriz \(S_l=\ee^{2\ii\delta_l}\), la resonancia es un polo en la energía compleja \(E=E_r-\ii\Gamma/2\), cuya parte imaginaria da la vida media. El <strong>retardo de Wigner</strong> \(\tau_W=2\hbar\,\dd\delta_l/\dd E\) mide el tiempo adicional que pasa la partícula cerca del blanco, y vale \(4\hbar/\Gamma\) en el pico: una resonancia estrecha retiene la partícula mucho tiempo. Resonancias de este tipo son las partículas inestables de la física de altas energías (\(\Delta\), \(\rho\), \(Z^0\)), los núcleos compuestos en las reacciones nucleares y los estados autoionizantes de los átomos.</p>
<div class="sim" data-sim="resonancia-bw" data-title="Una resonancia de forma: δ sube π, σ_l alcanza el límite unitario y el retardo de Wigner se dispara"></div>
<div class="sim-guide"><ul>
<li>Con \(l=3\) y un pozo de Woods–Saxon de profundidad 15 (\(R=1\)): \(E_r=1.316\), \(\Gamma=0.1138\) y \(\tau=\hbar/\Gamma=8.79\), mucho menor que la barrera centrífuga \(l(l+1)/2R^2=6\); \(\sigma_l\) llega a \(33.2\) (unitario: \(4\pi\cdot7/k^2=33.4\)) y el retardo de Wigner es 35.1 \(=4/\Gamma\) ✓.</li>
<li>Al aumentar \(V_0\) el estado se hace más ligado: con \(V_0=16\), \(E_r=0.733\) y \(\Gamma=0.0190\) (seis veces más estrecha: el túnel es exponencialmente más difícil); con \(V_0=14\), \(E_r=1.861\) y \(\Gamma=0.312\). La anchura cae exponencialmente con la profundidad de la barrera sobre \(E_r\): la regla WKB del capítulo 22.</li>
</ul></div>
</section>

<section>
<h2>El teorema de Levinson y el retardo de Wigner</h2>
<p>El desplazamiento de fase de una onda parcial a energía cero está determinado por el número de estados ligados de esa onda parcial:</p>
<div class="eq key" data-name="Teorema de Levinson">\[\delta_l(0)-\delta_l(\infty)=N_l\,\pi\qquad\left(\text{y }\left(N_0+\tfrac12\right)\pi\ \text{si hay una resonancia a energía cero en }l=0\right),\]</div>
<p>donde \(N_l\) es el número de estados ligados con momento angular \(l\), y \(\delta_l(\infty)=0\). Por tanto, a partir de \(\delta_l(k)\) medido, se cuenta el número de estados ligados (por ejemplo, en la dispersión nucleón–nucleón se sabe que el singlete no tiene estado ligado y el triplete tiene uno, el deuterón). La razón es la oscilación de la función de onda en el pozo: cada estado ligado añade un nodo a la función de onda radial a \(E=0\), y a cada nodo corresponde un adelanto de fase \(\pi\) respecto de la onda libre. Un potencial que sostiene \(N\) estados tiene un desplazamiento de fase que empieza en \(N\pi\) y baja a 0 al crecer la energía.</p>
<div class="sim" data-sim="levinson" data-title="Teorema de Levinson: δ₀(0) = Nπ y retardo de Wigner"></div>
<div class="sim-guide"><ul>
<li>Con \(K_0a=5\): \(N=\lfloor5/\pi+\tfrac12\rfloor=2\) estados ligados (con energías \(-9.131\) y \(-0.464\) en unidades de \(\hbar^2/ma^2\)) y \(\delta_0(0)=2\pi\) (el valor en \(ka=0.004\) es \(1.998\pi\): la diferencia es \(-ka_s=0.0067\)). Con \(K_0a=10\): \(N=3\) y \(\delta_0(0)=3\pi\).</li>
<li>La curva \(\delta_0(k)\) cae de \(N\pi\) a 0: con un estado a punto de aparecer (\(K_0a\) cerca de \((n+\tfrac12)\pi\)) la caída es casi vertical a \(k\to0\): la divergencia de \(a_s\). En \(ka=0.5\) el retardo de Wigner es \(\tau_W=-5.85\) (\(K_0a=5\)) y \(-3.72\) (\(K_0a=10\)): negativo cuando hay estados ligados (la onda sale antes de lo esperado, porque en el pozo el momento es mayor); con \(K_0a=1.2\), sin estados ligados, es positivo (\(+2.07\)).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule \(a_s\), \(\sigma(0)\) y el número de estados ligados de un pozo esférico para \(K_0a=1.2,\ 2.2,\ 4\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Fórmulas.</b> \(a_s/a=1-\tan K_0a/K_0a\); \(\sigma(0)=4\pi a_s^2\); \(N=\lfloor K_0a/\pi+\tfrac12\rfloor\).</li>
<li><b>\(K_0a=1.2\).</b> \(\tan1.2=2.5722\): \(a_s=1-2.1435=-1.1435\,a\); \(\sigma=4\pi\times1.3076=16.43\,a^2\); \(N=0\).</li>
<li><b>\(K_0a=2.2\).</b> \(\tan2.2=-1.3738\): \(a_s=1+0.6245=1.6245\,a\); \(\sigma=33.16\,a^2\); \(N=1\).</li>
<li><b>\(K_0a=4\).</b> \(\tan4=1.1578\): \(a_s=1-0.2895=0.7105\,a\); \(\sigma=6.344\,a^2\); \(N=1\) (porque \(4/\pi+\tfrac12=1.77\)).</li>
<li><b>Resultado.</b> <span class="ans">\(-1.1435\,a\) (16.43 \(a^2\), \(N=0\)); \(+1.6245\,a\) (33.16 \(a^2\), \(N=1\)); \(+0.7105\,a\) (6.344 \(a^2\), \(N=1\)).</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>En el sistema neutrón–protón en triplete, \(a_t=5.42\) fm y \(r_t=1.75\) fm. Con el desarrollo de rango efectivo halle la energía del deuterón (\(\mu c^2=469.46\) MeV, \(\hbar c=197.327\) MeV·fm) y compárela con la aproximación \(\hbar^2/2\mu a_t^2\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Polo de la matriz S.</b> Un estado ligado es un polo en \(k=\ii\kappa\): \(k\cot\delta_0=\ii k\) da \(-\dfrac1{a_t}-\dfrac12r_t\kappa^2=-\kappa\), es decir \(\kappa-\tfrac12r_t\kappa^2=\dfrac1{a_t}\).</li>
<li><b>Resolver.</b> \(0.18450=\kappa-0.875\kappa^2\Rightarrow\kappa=0.23132\) fm\(^{-1}\).</li>
<li><b>Energía.</b> \(B=\dfrac{(\hbar c)^2\kappa^2}{2\mu c^2}=\dfrac{38938\times0.053511}{938.92}=2.219\) MeV (medida: 2.2246 MeV).</li>
<li><b>Aproximación de rango cero.</b> \(\hbar^2/2\mu a_t^2=\dfrac{38938}{938.92\times29.376}=1.412\) MeV: un 36 % menor, porque el rango efectivo no es despreciable frente a \(a_t\).</li>
<li><b>Resultado.</b> <span class="ans">\(\kappa=0.2313\) fm\(^{-1}\), \(B=2.219\) MeV (casi el valor real, 2.2246 MeV); sin rango efectivo, 1.412 MeV.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Para el pozo de Woods–Saxon con \(l=3\) y \(V_0=15\) (\(\hbar=m=R=1\)): \(\dd\delta/\dd E=17.57\) en el pico y \(E_r=1.3158\). Obtenga \(\Gamma\), \(\tau\), el retardo de Wigner y la sección eficaz máxima.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Anchura.</b> \(\Gamma=2/(\dd\delta/\dd E)=2/17.57=0.1138\).</li>
<li><b>Vida media.</b> \(\tau=\hbar/\Gamma=8.79\).</li>
<li><b>Retardo de Wigner.</b> \(\tau_W=2\,\dd\delta/\dd E=35.1=4\tau\) (en unidades de \(\hbar\)).</li>
<li><b>Número de onda.</b> \(k_r=\sqrt{2E_r}=1.6222\).</li>
<li><b>Pico.</b> \(\sigma_l^\text{máx}=\dfrac{4\pi(2l+1)}{k_r^2}=\dfrac{4\pi\times7}{2.6316}=33.43\).</li>
<li><b>Barrera.</b> \(l(l+1)/2R^2=6\gg E_r\): estado atrapado por túnel (\(E_r/V_\text{barrera}=0.22\)).</li>
<li><b>Resultado.</b> <span class="ans">\(\Gamma=0.1138\), \(\tau=8.79\), \(\tau_W=35.1\), \(\sigma_l^\text{máx}=33.4\) (el límite unitario).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Para un electrón (\(m_e\)) en un pozo esférico de radio \(a=0.1\) nm, ¿qué profundidad \(V_0\) produce el mínimo de Ramsauer–Townsend a energía cero, \(a_s=0\)?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Condición.</b> \(a_s=a(1-\tan K_0a/K_0a)=0\Rightarrow\tan K_0a=K_0a\).</li>
<li><b>Raíz.</b> La menor raíz positiva (distinta de 0) es \(K_0a=4.4934\) (entre \(\pi\) y \(3\pi/2\)).</li>
<li><b>Profundidad.</b> \(V_0=\dfrac{\hbar^2K_0^2}{2m_e}=\dfrac{\hbar^2}{2m_ea^2}(K_0a)^2=\dfrac{0.0381\ \text{eV nm}^2}{(0.1\ \text{nm})^2}\times20.19=76.9\) eV.</li>
<li><b>Estados ligados.</b> \(N=\lfloor4.4934/\pi+\tfrac12\rfloor=1\): un estado ligado en un pozo con \(a_s=0\).</li>
<li><b>Resultado.</b> <span class="ans">\(K_0a=4.4934\), \(V_0=76.9\) eV: la onda s no se dispersa (a energía cero); la sección eficaz total crece luego por las ondas \(l\ge1\), de modo que el mínimo medido es poco profundo.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Verifique el teorema de Levinson para el pozo con \(K_0a=5\): halle los estados ligados con \(\xi\cot\xi=-\sqrt{25-\xi^2}\) y \(\delta_0(0)\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Estados ligados.</b> Dentro \(u=\sin Kr\) con \(K=\xi/a\); fuera \(u\propto\ee^{-\kappa r}\); la continuidad de \(u'/u\) da \(\xi\cot\xi=-\kappa a\) con \(\xi^2+(\kappa a)^2=K_0^2a^2=25\).</li>
<li><b>Raíces.</b> \(\xi_1=2.5957\), \(\xi_2=4.9063\) (\(\xi<5\) y con \(\xi\cot\xi<0\)).</li>
<li><b>Energías.</b> \(E=-\kappa^2/2\) con \(\kappa a=\sqrt{25-\xi^2}\): \(E_1=-9.131\), \(E_2=-0.4641\) (en \(\hbar^2/ma^2\)).</li>
<li><b>Número.</b> \(N=2\) (coincide con \(\lfloor5/\pi+\tfrac12\rfloor=2\)).</li>
<li><b>Fase a energía cero.</b> \(\delta_0(k\to0)=N\pi-ka_s\) con \(a_s=1-\tan5/5=1.676\,a\): para \(ka=0.02\), \(\delta_0=2\pi-0.0335=1.989\pi\).</li>
<li><b>Resultado.</b> <span class="ans">\(N=2\) estados (\(E=-9.131,\ -0.464\)); \(\delta_0(0)=2\pi\) ✓ (teorema de Levinson); \(a_s=1.676\,a\).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Con \(\delta=\delta_\text{fondo}+\arctan\dfrac{\Gamma/2}{E_r-E}\) y \(\delta_\text{fondo}=0\), demuestre que \(\sigma_l\) es la lorentziana de Breit–Wigner, que la matriz \(S=\ee^{2\ii\delta}\) tiene un polo en \(E_r-\ii\Gamma/2\) y que el retardo de Wigner en \(E_r\) es \(4\hbar/\Gamma\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Seno.</b> \(\tan\delta=\dfrac{\Gamma/2}{E_r-E}\Rightarrow\sin^2\delta=\dfrac{(\Gamma/2)^2}{(E_r-E)^2+(\Gamma/2)^2}\); luego \(\sigma_l=\dfrac{4\pi(2l+1)}{k^2}\sin^2\delta\) es la lorentziana de Breit–Wigner.</li>
<li><b>Matriz S.</b> \(\ee^{2\ii\delta}=\dfrac{1+\ii\tan\delta}{1-\ii\tan\delta}=\dfrac{(E_r-E)+\ii\Gamma/2}{(E_r-E)-\ii\Gamma/2}=\dfrac{E-E_r-\ii\Gamma/2}{E-E_r+\ii\Gamma/2}\): el polo está en \(E=E_r-\ii\Gamma/2\) (energía compleja, vida media \(\hbar/\Gamma\)).</li>
<li><b>Derivada.</b> \(\dfrac{\dd\delta}{\dd E}=\dfrac{\Gamma/2}{(E-E_r)^2+(\Gamma/2)^2}\); en \(E_r\): \(2/\Gamma\).</li>
<li><b>Retardo.</b> \(\tau_W=2\hbar\,\dd\delta/\dd E=4\hbar/\Gamma\); con \(\Gamma=0.1138\): 35.1 (el valor del simulador).</li>
<li><b>Unitariedad.</b> \(|S|=1\) para \(E\) real: el módulo del cociente de los números complejos conjugados es 1.</li>
<li><b>Resultado.</b> <span class="ans">\(\sigma_l=\frac{4\pi(2l+1)}{k^2}\frac{(\Gamma/2)^2}{(E-E_r)^2+(\Gamma/2)^2}\); polo de \(S\) en \(E_r-\ii\Gamma/2\); \(\tau_W(E_r)=4\hbar/\Gamma\).</span></li>
</ol></details></li>
</ol>
