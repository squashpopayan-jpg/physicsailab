<p class="lead">Dos partículas que han interactuado pueden quedar en un estado que no es el producto de un estado para cada una, aunque después se separen cualquier distancia. Schrödinger lo llamó <em>entrelazamiento</em> (1935) y lo señaló como «el rasgo característico de la mecánica cuántica». Einstein, Podolsky y Rosen sostuvieron ese mismo año que revelaba una incompletitud de la teoría; Bell demostró en 1964 que no se puede resolver con ninguna teoría local de variables ocultas, y los experimentos (Aspect 1982, y con todas las rendijas cerradas, Hensen et al. 2015) han decidido a favor de la mecánica cuántica. Es el recurso central de la computación, la criptografía y la metrología cuánticas.</p>

<section>
<h2>El estado entrelazado y el argumento EPR</h2>
<p>Un estado de dos partículas \(|\Psi\rangle\) es <em>separable</em> si es un producto \(|a\rangle|b\rangle\) (o, en general, una mezcla de productos) y <span class="term">entrelazado</span> si no. El singlete de dos espines \(\tfrac12\) (capítulo 16),</p>
<div class="eq">\[|\psi^-\rangle=\frac1{\sqrt2}\left(|\!\uparrow\downarrow\rangle-|\!\downarrow\uparrow\rangle\right)\ \Rightarrow\ \rho_A=\tfrac12\mathbb 1,\qquad E(\mathbf a,\mathbf b)=\langle(\boldsymbol\sigma\cdot\mathbf a)\otimes(\boldsymbol\sigma\cdot\mathbf b)\rangle=-\mathbf a\cdot\mathbf b=-\cos\theta,\]</div>
<p>tiene correlaciones perfectas: si Alicia mide el espín de su partícula a lo largo de \(\mathbf a\) y obtiene \(+\), Bob obtendrá \(-\) a lo largo de \(\mathbf a\) con certeza, sea cual sea la dirección elegida y por muy alejados que estén. Para EPR, esto implicaría que el resultado ya estaba determinado antes de la medida (un «elemento de realidad» local), y que la mecánica cuántica, que no lo describe, es incompleta. Pero la correlación para direcciones <em>distintas</em> \(-\cos\theta\) (en el plano perpendicular a los ejes de medida, ningún análisis anterior vale) es la que una teoría local no puede reproducir.</p>
</section>

<section>
<h2>Desigualdades de Bell y CHSH</h2>
<p>Supongamos una teoría de <em>variables ocultas locales</em>: un parámetro \(\lambda\) compartido por el par determina los resultados \(A(\mathbf a,\lambda)=\pm1\) y \(B(\mathbf b,\lambda)=\pm1\) de forma independiente. Con \(E(\mathbf a,\mathbf b)=\int\rho(\lambda)A(\mathbf a,\lambda)B(\mathbf b,\lambda)\dd\lambda\) y dos ajustes por observador (\(\mathbf a,\mathbf a'\) y \(\mathbf b,\mathbf b'\)), el combinado de Clauser, Horne, Shimony y Holt (1969) cumple</p>
<div class="eq key" data-name="Desigualdad CHSH">\[S=\left|E(\mathbf a,\mathbf b)-E(\mathbf a,\mathbf b')+E(\mathbf a',\mathbf b)+E(\mathbf a',\mathbf b')\right|\le2\ \ \text{(local)},\qquad S_\text{cuántico}^\text{máx}=2\sqrt2\ \ \text{(Tsirelson)}.\]</div>
<p>La cota local es un teorema elemental: \(S=A(B-B')+A'(B+B')\) con todos los valores \(\pm1\); uno de los paréntesis es \(\pm2\) y el otro 0. Pero para el singlete, con los ángulos \(\mathbf a=0\), \(\mathbf a'=\pi/2\), \(\mathbf b=\pi/4\), \(\mathbf b'=3\pi/4\) en un plano, \(E=-\cos(a-b)\) y \(S=2\sqrt2=2.828\). Ni la causalidad relativista ni la señalización se violan (Alicia no puede usar el entrelazamiento para enviar un mensaje: su resultado es aleatorio), pero la teoría local de variables ocultas es incompatible con la mecánica cuántica. La violación se ha medido con fotones, iones, átomos y espines en diamante, con distancias de 1.3 km (Hensen 2015) y de 1203 km por satélite (Yin 2017); en 2022 Aspect, Clauser y Zeilinger recibieron el Nobel por ello.</p>
<div class="sim" data-sim="bell-mc" data-title="Experimento de Bell simulado: modelo de variables ocultas frente a la mecánica cuántica"></div>
<div class="sim-guide"><ul>
<li>Con \(N=20000\) pares por configuración: el singlete cuántico da \(S=2.8355\pm0.014\) (teoría \(2.8284\)); el mejor modelo local en el plano da \(1.981\) (el máximo local es 2). Las correlaciones medidas del singlete, \(-0.718,\,0.706,\,-0.702,\,-0.709\), se acercan al valor \(\mp0.7071=\mp\cos45^\circ\); las del modelo local, \(\mp0.5\) (la recta de pendiente \(2/\pi\)), nunca alcanzan ese valor.</li>
<li>El error estadístico \(2/\sqrt N\) permite decidir con pocos pares: para distinguir 2.83 de 2 a \(5\sigma\) bastan \(N\approx150\) pares por configuración (en la práctica, los «agujeros» de detección y localidad exigieron años de ingeniería).</li>
</ul></div>
</section>

<section>
<h2>Estados mezclados: entrelazamiento frente a no localidad</h2>
<p>Con ruido, la situación es más sutil. Un estado de Werner, \(\rho_W=p|\psi^-\rangle\langle\psi^-|+(1-p)\tfrac14\mathbb 1\), tiene una concurrencia (medida de entrelazamiento) \(C=\max\{0,(3p-1)/2\}\) y, según el criterio de <span class="term">Peres–Horodecki</span> (la transpuesta parcial de un estado separable tiene autovalores no negativos, y para dos qubits la condición es suficiente), está entrelazado si y solo si \(p>1/3\). La violación de CHSH es más exigente: el máximo es \(2\sqrt2\,p\) (fórmula de Horodecki), mayor que 2 solo para \(p>1/\sqrt2=0.7071\). Hay entonces tres regiones: separable (\(p\le\tfrac13\)), entrelazado pero con modelo local para CHSH (\(\tfrac13\lt p\le0.7071\)) y no local (\(p>0.7071\)). El entrelazamiento y la no localidad de Bell son recursos distintos.</p>
<div class="sim" data-sim="werner" data-title="Estados de Werner: entrelazamiento, criterio PPT y violación de CHSH"></div>
<div class="sim-guide"><ul>
<li>Con \(p=0.85\): \(C=0.775\), CHSH máximo \(2\sqrt2\times0.85=2.404\) (violación: 0.404); la correlación \(E(0)=-0.85\). Con \(p=0.5\): \(C=0.25\), negatividad \(0.125\), entropía \(1.5488\) bits y CHSH máximo \(1.414\): entrelazado pero sin violar Bell. Con \(p=0.2\): separable, entropía \(1.9219\) bits y CHSH máximo \(0.566\).</li>
<li>La curva de correlación cuántica \(-p\cos\theta\) tiene una pendiente de signo distinto a la del modelo local en \(\theta=\pi/4\); para \(p=1\) la diferencia máxima entre ambas es \(\cos45^\circ-\tfrac12=0.207\), la que acumulan los cuatro términos de CHSH para exceder 2 en 0.83.</li>
</ul></div>
</section>

<section>
<h2>Tres partículas: GHZ y W</h2>
<p>Con tres qubits hay dos clases esencialmente distintas de entrelazamiento: \(|\mathrm{GHZ}\rangle=\tfrac1{\sqrt2}(|000\rangle+|111\rangle)\) y \(|W\rangle=\tfrac1{\sqrt3}(|001\rangle+|010\rangle+|100\rangle)\). El GHZ (Greenberger, Horne, Zeilinger 1989) permite una refutación de la localidad sin desigualdades estadísticas: con el operador de Mermin \(M=\langle XXX\rangle-\langle XYY\rangle-\langle YXY\rangle-\langle YYX\rangle\), toda teoría local da \(|M|\le2\) y el GHZ da \(M=4\) (el valor máximo). Su fragilidad es la contrapartida: si se pierde uno de los tres qubits, el estado de los otros dos es una mezcla separable, \(\tfrac12(|00\rangle\langle00|+|11\rangle\langle11|)\). En cambio, el estado W conserva entrelazamiento tras perder un qubit (\(C=2/3\)), pero no viola Mermin.</p>
<div class="sim" data-sim="ghz-w" data-title="GHZ y W: violación de Mermin y robustez frente a la pérdida de un qubit"></div>
<div class="sim-guide"><ul>
<li>GHZ puro: \(M=4\); con ruido blanco \(p\): \(M=4(1-p)\), que viola la cota 2 mientras \(p<\tfrac12\). Al trazar un qubit, la concurrencia de los otros dos es 0 y su negatividad también (separable).</li>
<li>W puro: \(M=0\), pero tras perder un qubit \(C=0.6667\) y negatividad \(0.2060\). La pureza global vale 1 y la entropía de un qubit \(0.9183\) bits.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Para el singlete con \(a=0\), \(a'=\pi/2\), \(b=\pi/4\), \(b'=3\pi/4\) calcule las cuatro correlaciones \(E=-\cos(a-b)\) y el valor de \(S\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>\(E(a,b)\).</b> \(-\cos(0-\pi/4)=-0.7071\).</li>
<li><b>\(E(a,b')\).</b> \(-\cos(0-3\pi/4)=+0.7071\).</li>
<li><b>\(E(a',b)\).</b> \(-\cos(\pi/2-\pi/4)=-0.7071\).</li>
<li><b>\(E(a',b')\).</b> \(-\cos(\pi/2-3\pi/4)=-0.7071\).</li>
<li><b>\(S\).</b> \(|-0.7071-0.7071-0.7071-0.7071|=2.8284=2\sqrt2\).</li>
<li><b>Resultado.</b> <span class="ans">\(S=2\sqrt2=2.828>2\): viola CHSH en 41 % y alcanza el máximo cuántico (Tsirelson).</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Demuestre que cualquier modelo local determinista cumple \(|S|\le2\), y compruébelo con una asignación de valores.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Reescritura.</b> Para un \(\lambda\) dado: \(S=A(B-B')+A'(B+B')\) con \(A,A',B,B'=\pm1\).</li>
<li><b>Casos.</b> Si \(B=B'\): \(B-B'=0\) y \(B+B'=\pm2\): \(S=\pm2A'\), \(|S|=2\). Si \(B=-B'\): \(B-B'=\pm2\), \(B+B'=0\): \(S=\pm2A\), \(|S|=2\).</li>
<li><b>Promedio.</b> \(|\langle S\rangle|\le\langle|S|\rangle=2\) (promediando sobre \(\lambda\)).</li>
<li><b>Ejemplo.</b> \(A=A'=B=1\), \(B'=-1\): \(S=1\cdot2+1\cdot0=2\).</li>
<li><b>Resultado.</b> <span class="ans">\(|S|\le2\) para cualquier modelo local de variables ocultas; la mecánica cuántica llega a \(2\sqrt2=2.83\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Para el estado de Werner halle los autovalores de la transpuesta parcial, la negatividad y los umbrales de separabilidad y de violación de CHSH.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Transpuesta del singlete.</b> \((|\psi^-\rangle\langle\psi^-|)^{T_B}\) tiene autovalores \(+\tfrac12,+\tfrac12,+\tfrac12,-\tfrac12\) (el \(-\tfrac12\) es el estado simétrico del triplete).</li>
<li><b>Werner.</b> \(\rho_W^{T_B}\) tiene autovalores \(\tfrac{1-p}4+\tfrac p2=\tfrac{1+p}4\) (tres veces) y \(\tfrac{1-p}4-\tfrac p2=\tfrac{1-3p}4\).</li>
<li><b>Entrelazamiento.</b> Negativo si \(p>\tfrac13\): negatividad \(N=(3p-1)/4\) (\(p=0.5\): 0.125 ✓; \(p=0.85\): 0.3875).</li>
<li><b>CHSH.</b> \(T=-p\,\mathbb 1_3\): \(T^TT=p^2\mathbb 1\), \(S_\text{máx}=2\sqrt{2p^2}=2\sqrt2\,p>2\iff p>1/\sqrt2\).</li>
<li><b>Resultado.</b> <span class="ans">\(N=(3p-1)/4\); separable para \(p\le\tfrac13\), entrelazado para \(p>\tfrac13\), viola CHSH para \(p>1/\sqrt2=0.7071\); \(S_\text{máx}=2\sqrt2\,p\) (2.404 con \(p=0.85\)).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>En una simulación de \(N\) pares por configuración, el error de cada \(E\) es \(\approx\sqrt{(1-E^2)/N}\). Estime el error de \(S\) y el \(N\) mínimo para separar 2.828 de 2 con \(5\sigma\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Cada correlación.</b> \(|E|=0.7071\): \(\sigma_E=\sqrt{(1-0.5)/N}=0.7071/\sqrt N\).</li>
<li><b>Suma de cuatro.</b> \(S\) es suma de cuatro variables independientes: \(\sigma_S=\sqrt{4}\,\sigma_E=1.414/\sqrt N\) (en el simulador se muestra la cota conservadora \(2/\sqrt N\)).</li>
<li><b>\(N=20000\).</b> \(\sigma_S\approx1.414/141.4=0.0100\) (con la cota \(2/\sqrt N=0.0141\)).</li>
<li><b>\(5\sigma\).</b> \(2.828-2=0.828\ge5\times1.414/\sqrt N\Rightarrow N\ge(5\times1.414/0.828)^2=73\); con la cota \(2/\sqrt N\): \(N\ge146\).</li>
<li><b>Resultado.</b> <span class="ans">\(\sigma_S=1.41/\sqrt N\) (0.010 con 20 000 pares); bastan unos 75–150 pares por configuración para una violación a \(5\sigma\).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Calcule el valor de Mermin del GHZ puro y con ruido blanco \(p\), y el \(p\) máximo para violar \(|M|\le2\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Valores esperados.</b> En GHZ: \(\langle XXX\rangle=1\) (pues \(XXX|000\rangle=|111\rangle\)) y \(\langle XYY\rangle=\langle YXY\rangle=\langle YYX\rangle=-1\) (\(Y|0\rangle=\ii|1\rangle\), \(Y|1\rangle=-\ii|0\rangle\): el producto \(\ii\cdot\ii=-1\)).</li>
<li><b>Mermin.</b> \(M=1-(-1)-(-1)-(-1)=4\).</li>
<li><b>Ruido blanco.</b> \(\rho=(1-p)|\mathrm{GHZ}\rangle\langle\mathrm{GHZ}|+p\mathbb 1/8\): el término \(\mathbb 1/8\) tiene valor esperado nulo para estos operadores: \(M=4(1-p)\).</li>
<li><b>Violación.</b> \(4(1-p)>2\iff p<\tfrac12\).</li>
<li><b>Resultado.</b> <span class="ans">\(M=4\) (GHZ puro) y \(M=4(1-p)\) con ruido: viola la cota local \(2\) hasta \(p=\tfrac12\).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Muestre que el estado reducido de dos qubits del W es \(\tfrac23|\psi^+\rangle\langle\psi^+|+\tfrac13|00\rangle\langle00|\), con \(C=\tfrac23\), y que el del GHZ es separable.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>W.</b> Escribiendo \(|W\rangle=\sqrt{\tfrac23}\,|\psi^+\rangle|0\rangle+\sqrt{\tfrac13}\,|00\rangle|1\rangle\) con \(|\psi^+\rangle=(|01\rangle+|10\rangle)/\sqrt2\) en los dos primeros qubits.</li>
<li><b>Traza sobre el tercero.</b> \(\rho_{AB}=\tfrac23|\psi^+\rangle\langle\psi^+|+\tfrac13|00\rangle\langle00|\) (los términos cruzados llevan \(\langle0|1\rangle=0\)).</li>
<li><b>Concurrencia.</b> La fórmula de Wootters da \(C=\tfrac23=0.6667\) y la transpuesta parcial tiene un autovalor negativo, de modo que la negatividad vale \(0.2060\): el estado sigue entrelazado.</li>
<li><b>GHZ.</b> \(\mathrm{Tr}_C|\mathrm{GHZ}\rangle\langle\mathrm{GHZ}|=\tfrac12(|00\rangle\langle00|+|11\rangle\langle11|)\): diagonal, es una mezcla de productos, \(C=0\).</li>
<li><b>Resultado.</b> <span class="ans">W: \(\rho_{AB}=\tfrac23|\psi^+\rangle\langle\psi^+|+\tfrac13|00\rangle\langle00|\), \(C=2/3\), \(N=0.206\); GHZ: \(\tfrac12(|00\rangle\langle00|+|11\rangle\langle11|)\), separable.</span></li>
</ol></details></li>
</ol>
