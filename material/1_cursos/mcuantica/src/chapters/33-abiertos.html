<template class="chapter-src" data-id="abiertos" data-num="33" data-title="Sistemas cuánticos abiertos y la ecuación de Lindblad" data-part="Parte VII · Sistemas abiertos, medida e información" data-short="La ecuación maestra de Gorini–Kossakowski–Sudarshan–Lindblad, la relajación T₁ y T₂ de un qubit, las ecuaciones ópticas de Bloch de un átomo con láser y los canales cuánticos de Kraus y Choi">
<p class="lead">Hasta aquí el sistema estaba aislado y su evolución era unitaria, \(\ii\hb\,\partial_t|\psi\rangle=H|\psi\rangle\). Pero ningún sistema real está aislado: un átomo excitado emite un fotón, un qubit superconductor pierde su coherencia por el ruido de carga, un espín nuclear se relaja contra la red. En el capítulo 32 vimos el mecanismo (el entrelazamiento con el entorno); este capítulo da la herramienta para <em>calcular</em> sus consecuencias sin tener que seguir al entorno: una ecuación cerrada para el operador densidad del sistema, la <span class="term">ecuación de Lindblad</span>. Con ella se obtienen los tiempos \(T_1\) y \(T_2\) de la resonancia magnética y de la computación cuántica, la fluorescencia de resonancia y el ensanchamiento por potencia, y se clasifican todas las evoluciones físicamente posibles de un qubit (los canales cuánticos).</p>

<section>
<h2>De la evolución unitaria a la ecuación de Lindblad</h2>
<p>Supongamos que el sistema \(S\) interactúa con un entorno \(E\) enorme, cuya memoria es muy corta comparada con el tiempo en que \(S\) cambia de manera apreciable (aproximación de Born–Markov). Entonces la matriz densidad reducida \(\rho=\operatorname{Tr}_E\rho_{SE}\) obedece una ecuación diferencial lineal, de primer orden en el tiempo, que debe conservar la traza, la hermiticidad y la positividad —y no solo de \(\rho\), sino de \(\rho\) acoplado a cualquier ancilla, lo que se llama <em>positividad completa</em>—. El teorema de Gorini, Kossakowski, Sudarshan y Lindblad (1976) dice que la forma más general de tal ecuación es</p>
<div class="eq key" data-name="Ecuación de Lindblad (GKSL)">\[\frac{\dd\rho}{\dd t}=-\frac{\ii}{\hb}[H,\rho]+\sum_k\gamma_k\Big(L_k\rho L_k^\dagger-\tfrac12\big\{L_k^\dagger L_k,\rho\big\}\Big),\qquad\gamma_k\ge0.\]</div>
<p>El primer término es la evolución hamiltoniana de siempre; cada <span class="term">operador de salto</span> \(L_k\) describe un canal por el que el entorno actúa sobre el sistema, con tasa \(\gamma_k\) (unidades de 1/tiempo). Los dos operadores más importantes de un qubit son el <em>descenso</em> \(\sigma_-=|0\rangle\langle1|\) (emisión espontánea: el estado excitado \(|1\rangle\) cae al fundamental \(|0\rangle\)) y el <em>desfase</em> \(\sigma_z\) (el entorno «mide» la energía sin cambiarla). Hay dos maneras de entender la ecuación, ambas útiles.</p>
<p><b>(a) Como «salto o no-salto».</b> En un intervalo corto \(\dd t\) ocurre, con probabilidad \(\gamma_k\langle L_k^\dagger L_k\rangle\dd t\), el salto \(\rho\to L_k\rho L_k^\dagger/\operatorname{Tr}(\ldots)\) (se detecta, por ejemplo, un fotón); en caso contrario el estado evoluciona con un hamiltoniano <em>efectivo no hermítico</em> \(H_\text{ef}=H-\tfrac{\ii\hb}{2}\sum_k\gamma_kL_k^\dagger L_k\), cuya parte antihermítica hace decaer la norma (la probabilidad de «no haber saltado»). Promediando sobre las historias de saltos se recupera la ecuación de Lindblad: el término \(\sum\gamma_kL_k\rho L_k^\dagger\) son los saltos y el anticonmutador, la pérdida de norma que los compensa para que \(\operatorname{Tr}\rho=1\).</p>
<p><b>(b) Como evolución de Kraus.</b> En un intervalo finito, el estado evoluciona con un <em>mapa</em> lineal \(\rho\mapsto\Lambda(\rho)=\sum_aK_a\rho K_a^\dagger\) con \(\sum_aK_a^\dagger K_a=1\) (sección 4). Para \(\dd t\) infinitesimal, \(K_0=1-\tfrac{\ii}{\hb}H_\text{ef}\dd t\) y \(K_k=\sqrt{\gamma_k\dd t}\,L_k\): la ecuación de Lindblad es el generador de un semigrupo de canales cuánticos, \(\Lambda_t=\ee^{t\mathcal L}\), con \(\Lambda_{t+s}=\Lambda_t\Lambda_s\) (de ahí «markoviano»).</p>
<p>Un baño térmico a temperatura \(T\) se describe con dos saltos: \(\sigma_-\) con tasa \(\gamma(\bar n+1)\) y \(\sigma_+\) con \(\gamma\bar n\), donde \(\bar n=(\ee^{\hb\omega/k_BT}-1)^{-1}\). El estado estacionario es el de Gibbs, \(p_\text{exc}/p_\text{fund}=\bar n/(\bar n+1)=\ee^{-\hb\omega/k_BT}\): la relajación lleva al equilibrio térmico, no solo al estado fundamental.</p>
</section>

<section>
<h2>Relajación de un qubit: \(T_1\) y \(T_2\)</h2>
<p>Tomemos \(H=\tfrac12\hb\omega\sigma_z\) con emisión espontánea (\(L=\sigma_-\), tasa \(\gamma\)) y desfase puro (\(L=\sigma_z\), tasa \(\gamma_\varphi/2\)). En términos del vector de Bloch \(\vec r=(x,y,z)\), con \(z=\rho_{00}-\rho_{11}\), la ecuación de Lindblad se reduce a las <span class="term">ecuaciones de Bloch</span> de la resonancia magnética:</p>
<div class="eq key" data-name="Relajación T₁ y T₂">\[\dot z=-\frac{z-1}{T_1},\qquad\dot x=-\omega y-\frac{x}{T_2},\quad\dot y=\omega x-\frac{y}{T_2};\qquad\frac1{T_2}=\frac1{2T_1}+\frac1{T_\varphi},\ \ T_1=\frac1\gamma,\ T_\varphi=\frac1{\gamma_\varphi}.\]</div>
<p>La población excitada decae como \(\ee^{-t/T_1}\) (relajación <em>longitudinal</em>): el vector de Bloch sube hacia el polo del estado fundamental. Las coherencias \(\rho_{01}\) giran a la frecuencia \(\omega\) y decaen como \(\ee^{-t/T_2}\) (relajación <em>transversal</em>). Siempre \(T_2\le2T_1\): la emisión espontánea destruye la coherencia a la mitad de la tasa a la que destruye la población, y cualquier desfase adicional solo acelera el decaimiento (\(T_2=2T_1\) si \(T_\varphi\to\infty\)). Un estado puro con \(\vec r\) inclinado un ángulo \(\theta\) del eje \(z\) tiene \(\vec r(t)\) con \(|\vec r|<1\) durante la relajación: se mezcla (aumenta la entropía) y, al final, vuelve a ser puro en \(|0\rangle\), con un máximo de entropía intermedio.</p>
<div class="sim" data-sim="relajacion" data-title="Relajación de un qubit: el vector de Bloch se encoge, gira y sube al polo"></div>
<div class="sim-guide"><ul>
<li>Con \(T_1=5\), \(T_\varphi=20\) (mismas unidades): \(1/T_2=0.1+0.05\Rightarrow T_2=6.6667\), \(T_2/T_1=1.3333\le2\). Estado inicial a \(70^\circ\) del eje \(z\), \(\omega=2\): a \(t=5T_1\) el vector de Bloch vale \((0.0213,-0.0058,0.9956)\), \(\operatorname{Tr}\rho^2=0.99582\), y la entropía alcanzó un máximo de \(0.3417\) bits por el camino.</li>
<li>Con \(T_\varphi\) en 40 el denominador crece y \(T_2=8\); con \(T_\varphi\to\infty\), \(T_2\to2T_1\) y las envolventes \(\pm\sin\theta\,\ee^{-t/T_2}\) (punteadas) abrazan a \(x(t)\), \(y(t)\) con la mayor lentitud posible.</li>
</ul></div>
</section>

<section>
<h2>Un átomo con un láser: ecuaciones ópticas de Bloch</h2>
<p>Un átomo de dos niveles (fundamental \(|0\rangle\), excitado \(|1\rangle\)) iluminado por un láser casi resonante se describe, en el sistema rotante, con \(H=\tfrac\hb2(\Delta\,\sigma_z+\Omega\,\sigma_x)\) (\(\Omega\) = frecuencia de Rabi, \(\Delta\) = desintonía) y con un único salto \(\sqrt\gamma\,\sigma_-\), la emisión espontánea. A tiempos largos el átomo alcanza un estado estacionario en el que los fotones absorbidos del láser se reemiten en direcciones al azar (fluorescencia de resonancia). Anulando las derivadas de las ecuaciones de Bloch y resolviendo el sistema lineal 3×3 se obtiene</p>
<div class="eq key" data-name="Estado estacionario y saturación">\[\rho_{ee}=\frac{s}{2(1+s)},\quad s=\frac{\Omega^2/2}{\Delta^2+\gamma^2/4}\ \Longrightarrow\ \rho_{ee}=\frac{\Omega^2/4}{\Delta^2+\gamma^2/4+\Omega^2/2},\qquad\mathrm{FWHM}=\gamma\sqrt{1+2\Omega^2/\gamma^2}.\]</div>
<p>La población excitada crece con la intensidad (\(\Omega^2\)) pero <em>satura</em> en \(\tfrac12\): un átomo de dos niveles nunca puede estar más tiempo excitado que fundamental en estado estacionario (una inversión de población necesitaría un tercer nivel). El perfil de absorción en función de \(\Delta\) es una lorentziana de anchura natural \(\gamma\) a baja potencia, que se ensancha como \(\gamma\sqrt{1+s_0}\) (con \(s_0=2\Omega^2/\gamma^2\)) a alta potencia: el <em>ensanchamiento por potencia</em>. La tasa de fotones dispersados es \(\gamma\rho_{ee}\). En el transitorio, y en resonancia, \(\rho_{ee}(t)\) realiza oscilaciones de Rabi amortiguadas: las raíces del polinomio característico son \(-\gamma/2\) y \(-\tfrac34\gamma\pm\ii\Omega'\), con</p>
<div class="eq" data-name="Oscilaciones de Rabi amortiguadas (resonancia)">\[\rho_{ee}(t)=\rho_{ee}^{(\infty)}\left[1-\ee^{-3\gamma t/4}\left(\cos\Omega't+\frac{3\gamma}{4\Omega'}\sin\Omega't\right)\right],\qquad\Omega'=\sqrt{\Omega^2-\gamma^2/16},\]</div>
<p>que se vuelve <em>sobreamortiguada</em> (sin oscilar) si \(\Omega<\gamma/4\).</p>
<div class="sim" data-sim="bloch-optico" data-title="Átomo de dos niveles con láser: oscilaciones de Rabi amortiguadas y ensanchamiento por potencia"></div>
<div class="sim-guide"><ul>
<li>Con \(\Omega=2\gamma\) y \(\Delta=0\): \(s_0=8\), \(\rho_{ee}^{(\infty)}=0.44444\) y \(\mathrm{FWHM}=3.0000\,\gamma\) (el triple de la anchura natural). La población oscila con \(\Omega'=1.9843\gamma\) y a \(\gamma t=8\) vale \(0.44560\), a \(0.26\,\%\) del estacionario.</li>
<li>Con \(\Omega=\gamma\) la saturación es \(s_0=2\): \(\rho_{ee}=0.33333\) y \(\mathrm{FWHM}=1.7321\,\gamma\). Si el láser se desintoniza \(\Delta=\gamma\), \(\rho_{ee}=0.14286\); con \(\Omega=2\gamma\) y \(\Delta=1.5\gamma\), \(\rho_{ee}=0.22222\), exactamente la mitad del máximo (el borde de la línea).</li>
</ul></div>
</section>

<section>
<h2>Canales cuánticos: Kraus, Choi y el elipsoide de Bloch</h2>
<p>Integrando la ecuación de Lindblad durante un tiempo finito se obtiene un <span class="term">canal cuántico</span> (mapa CPTP: lineal, que conserva la traza y es completamente positivo). El teorema de Kraus dice que todo canal se escribe como \(\Lambda(\rho)=\sum_aK_a\rho K_a^\dagger\) con \(\sum_aK_a^\dagger K_a=1\), y el de Choi–Jamiołkowski que \(\Lambda\) es completamente positivo si y solo si su <em>matriz de Choi</em> \(J_\Lambda=\sum_{ij}|i\rangle\langle j|\otimes\Lambda(|i\rangle\langle j|)\) es semidefinida positiva. Para un qubit, un canal transforma la esfera de Bloch en un <em>elipsoide</em> (posiblemente desplazado). Tres canales son canónicos, con \(p\in[0,1]\) la «intensidad»:</p>
<div class="eq key" data-name="Tres canales de un qubit">\[\begin{aligned}\text{amortig. de amplitud:}&\ K_0=\begin{pmatrix}1&0\\0&\sqrt{1-p}\end{pmatrix},\ K_1=\begin{pmatrix}0&\sqrt p\\0&0\end{pmatrix}:&(x,y,z)&\to\big(\sqrt{1-p}\,x,\sqrt{1-p}\,y,(1-p)z+p\big),\\\text{amortig. de fase:}&\ K_0=\sqrt{1-p}\,1,\ K_1=\sqrt p\,\sigma_z:&(x,y,z)&\to\big((1-2p)x,(1-2p)y,z\big),\\\text{despolarizante:}&\ \rho\to(1-p)\rho+p\,\tfrac{1}{2}:&(x,y,z)&\to(1-p)(x,y,z).\end{aligned}\]</div>
<p>El primero es la emisión espontánea de la sección 2 con \(p=1-\ee^{-\gamma t}\) (la esfera se aplasta hacia el polo \(z=1\)); el segundo es el desfase puro con \(1-2p=\ee^{-t/T_\varphi}\) (la esfera se estira en el eje \(z\) y se contrae en \(xy\), sin desplazarse); el tercero es el ruido blanco (la esfera se encoge uniformemente). La condición de positividad completa limita los canales posibles: el mapa \(\vec r\mapsto\lambda\vec r\) (despolarizante generalizado) solo es CPTP si \(-\tfrac13\le\lambda\le1\), de modo que, por ejemplo, <em>la inversión universal</em> \(\vec r\mapsto-\vec r\) (el «NOT» cuántico, que llevaría cada estado a su ortogonal) es positiva pero no completamente positiva y no puede realizarse físicamente. La mejor aproximación posible es \(\lambda=-\tfrac13\), con fidelidad \(\tfrac23\).</p>
<div class="sim" data-sim="canales" data-title="Canales de Kraus: la esfera de Bloch se convierte en un elipsoide"></div>
<div class="sim-guide"><ul>
<li>Amortiguamiento de amplitud con \(p=0.4\): semiejes \((0.7746,0.7746,0.6)\), centro desplazado a \(z=0.4\) y volumen relativo \(0.36\). El estado \(|+\rangle\) (puro) sale con \(\operatorname{Tr}\rho^2=0.88\) y \(S=0.34355\) bits. La suma \(\sum K^\dagger K\) es la identidad (conservación de la traza) y el menor autovalor de Choi es \(0\) (el canal está en la frontera de la positividad).</li>
<li>Amortiguamiento de fase con \(p=0.4\): semiejes \((0.2,0.2,1.0)\), \(\operatorname{Tr}\rho^2=0.52\), \(S=0.97095\) bits. Despolarizante con \(p=0.4\): \((0.6,0.6,0.6)\), \(\operatorname{Tr}\rho^2=0.68\), \(S=0.72193\) bits, menor autovalor de Choi \(0.2\).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un qubit superconductor tiene \(T_1=5\ \mu\)s y un desfase puro con \(T_\varphi=20\ \mu\)s. Calcule \(T_2\), compruebe \(T_2\le2T_1\) y halle la población excitada y la coherencia relativa a \(t=10\ \mu\)s. ¿Cuánto valdría \(T_2\) sin desfase puro?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Tasa de decoherencia.</b> \(\dfrac1{T_2}=\dfrac1{2T_1}+\dfrac1{T_\varphi}=\dfrac1{10}+\dfrac1{20}=0.15\ \mu\text{s}^{-1}\).</li>
<li><b>\(T_2\).</b> \(T_2=6.667\ \mu\)s; \(T_2/T_1=1.333\le2\) ✓ (si fuera mayor que \(2T_1\), el modelo violaría la positividad).</li>
<li><b>Población.</b> \(\ee^{-t/T_1}=\ee^{-2}=0.1353\): queda un 13.5 % de la población excitada inicial.</li>
<li><b>Coherencia.</b> \(\ee^{-t/T_2}=\ee^{-1.5}=0.2231\).</li>
<li><b>Sin desfase puro.</b> \(T_\varphi\to\infty\Rightarrow T_2=2T_1=10\ \mu\)s y la coherencia sería \(\ee^{-1}=0.3679\): el desfase puro cuesta un factor \(0.2231/0.3679=0.61\) en la coherencia a \(10\ \mu\)s.</li>
<li><b>Resultado.</b> <span class="ans">\(T_2=6.667\ \mu\)s; población \(0.1353\); coherencia \(0.2231\); sin desfase, \(T_2=10\ \mu\)s.</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>El estado \(|+\rangle=(|0\rangle+|1\rangle)/\sqrt2\) pasa por un canal de amortiguamiento de amplitud con \(p=0.4\). Halle el estado de salida, su vector de Bloch, su pureza y su entropía, y el tiempo \(\gamma t\) al que corresponde esa \(p\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Salida.</b> \(\rho_\text{in}=\tfrac12\begin{pmatrix}1&1\\1&1\end{pmatrix}\). Con \(K_0\rho K_0^\dagger=\tfrac12\begin{pmatrix}1&\sqrt{0.6}\\\sqrt{0.6}&0.6\end{pmatrix}\) y \(K_1\rho K_1^\dagger=\tfrac12p\begin{pmatrix}1&0\\0&0\end{pmatrix}=\begin{pmatrix}0.2&0\\0&0\end{pmatrix}\): \(\rho_\text{out}=\begin{pmatrix}0.7&0.3873\\0.3873&0.3\end{pmatrix}\).</li>
<li><b>Bloch.</b> \(x=2\rho_{01}=0.7746=\sqrt{1-p}\), \(y=0\), \(z=\rho_{00}-\rho_{11}=0.4=p\): coincide con la regla \((\sqrt{1-p}\,x,\ \cdot,\ (1-p)z+p)\) para \(\vec r=(1,0,0)\).</li>
<li><b>Pureza.</b> \(\operatorname{Tr}\rho^2=\tfrac12(1+0.6+0.16)=0.88\).</li>
<li><b>Entropía.</b> Autovalores \(\tfrac12(1\pm\sqrt{1-4\cdot0.06})=0.9359,\ 0.0641\): \(S=-0.9359\log_20.9359-0.0641\log_20.0641=0.3435\) bits.</li>
<li><b>Tiempo.</b> \(p=1-\ee^{-\gamma t}\Rightarrow\gamma t=-\ln0.6=0.5108\).</li>
<li><b>Resultado.</b> <span class="ans">\(\rho_\text{out}=\begin{pmatrix}0.7&0.3873\\0.3873&0.3\end{pmatrix}\); \(\vec r=(0.7746,0,0.4)\); \(\operatorname{Tr}\rho^2=0.88\); \(S=0.3435\) bits; \(\gamma t=0.5108\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Un átomo de dos niveles con \(\gamma=2\pi\times6.065\) MHz (línea D2 del rubidio) se ilumina en resonancia con \(\Omega=2\gamma\). Halle la población excitada estacionaria, la tasa de fotones dispersados, la anchura de la resonancia y la desintonía a la que la población cae a la mitad.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Saturación.</b> En resonancia, \(s_0=2\Omega^2/\gamma^2=2\cdot4=8\).</li>
<li><b>Población.</b> \(\rho_{ee}=s_0/[2(1+s_0)]=8/18=0.4444\) (cerca del máximo 1/2).</li>
<li><b>Tasa.</b> \(\gamma=2\pi\times6.065\times10^6=3.811\times10^7\ \text{s}^{-1}\); \(R=\gamma\rho_{ee}=1.694\times10^7\) fotones por segundo.</li>
<li><b>Anchura.</b> \(\mathrm{FWHM}=\gamma\sqrt{1+s_0}=3\gamma=2\pi\times18.2\) MHz (el triple de la natural).</li>
<li><b>Media altura.</b> \(\rho_{ee}(\Delta)=\tfrac12\rho_{ee}(0)\Leftrightarrow\Delta^2=\gamma^2/4+\Omega^2/2=\gamma^2(0.25+2)\Rightarrow|\Delta|=1.5\gamma\), es decir \(\pm2\pi\times9.10\) MHz: coincide con FWHM/2.</li>
<li><b>Resultado.</b> <span class="ans">\(\rho_{ee}=0.4444\); \(R=1.69\times10^7\ \text{s}^{-1}\); FWHM \(=3\gamma\); \(\Delta_{1/2}=\pm1.5\gamma\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que el operador de salto \(L=\sigma_z\) con tasa \(\gamma_\varphi/2\) hace decaer la coherencia como \(\ee^{-\gamma_\varphi t}\) sin alterar las poblaciones, y que equivale al canal de amortiguamiento de fase con \(p(t)=\tfrac12(1-\ee^{-t/T_\varphi})\). Calcule \(p\) para \(t=T_\varphi\) y \(t=0.1\,T_\varphi\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Término disipativo.</b> Con \(L=\sigma_z=L^\dagger\) y \(L^\dagger L=1\): \(\mathcal D[\rho]=\tfrac{\gamma_\varphi}2(\sigma_z\rho\sigma_z-\rho)\).</li>
<li><b>Elementos de matriz.</b> \(\sigma_z\rho\sigma_z\) deja las diagonales iguales y cambia el signo de \(\rho_{01}\): \(\dot\rho_{00}=0\), \(\dot\rho_{01}=\tfrac{\gamma_\varphi}2(-\rho_{01}-\rho_{01})=-\gamma_\varphi\rho_{01}\).</li>
<li><b>Solución.</b> \(\rho_{01}(t)=\rho_{01}(0)\ee^{-\gamma_\varphi t}=\rho_{01}(0)\ee^{-t/T_\varphi}\); las poblaciones son constantes.</li>
<li><b>Canal.</b> El amortiguamiento de fase da \(\rho_{01}\to(1-2p)\rho_{01}\) (la fila de la tabla). Igualando, \(1-2p=\ee^{-t/T_\varphi}\Rightarrow p=\tfrac12(1-\ee^{-t/T_\varphi})\) —que satisface \(0\le p\le\tfrac12\), y tiende a \(\tfrac12\), la pérdida total de coherencia, cuando \(t\to\infty\).</li>
<li><b>Valores.</b> \(t=T_\varphi\): \(p=\tfrac12(1-0.3679)=0.3161\). \(t=0.1T_\varphi\): \(p=\tfrac12(1-0.9048)=0.0476\).</li>
<li><b>Resultado.</b> <span class="ans">\(\rho_{01}\propto\ee^{-t/T_\varphi}\); \(p(t)=\tfrac12(1-\ee^{-t/T_\varphi})\); \(p(T_\varphi)=0.3161\), \(p(0.1T_\varphi)=0.0476\).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Para el mapa \(\Lambda_\lambda:\vec r\mapsto\lambda\vec r\) (es decir, \(\rho\mapsto\lambda\rho+(1-\lambda)\,\tfrac{1}{2}\operatorname{Tr}\rho\)) calcule los autovalores de la matriz de Choi, halle el intervalo de \(\lambda\) en el que el mapa es completamente positivo y demuestre que la inversión universal \(\lambda=-1\) no es física. ¿Cuál es la mejor fidelidad posible de un «NOT» cuántico universal?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Matriz de Choi.</b> \(J=\sum_{ij}|i\rangle\langle j|\otimes\Lambda(|i\rangle\langle j|)=\lambda\big(2|\Phi^+\rangle\langle\Phi^+|\big)+(1-\lambda)\tfrac12\,1_4\), pues \(\sum_{ij}|i\rangle\langle j|\otimes|i\rangle\langle j|=2|\Phi^+\rangle\langle\Phi^+|\) con \(|\Phi^+\rangle=(|00\rangle+|11\rangle)/\sqrt2\) y \(\sum_{ij}|i\rangle\langle j|\,\delta_{ij}\otimes\tfrac12 1=\tfrac12 1_4\).</li>
<li><b>Autovalores.</b> Sobre \(|\Phi^+\rangle\): \(2\lambda+\tfrac{1-\lambda}2=\tfrac{1+3\lambda}2\). Sobre los otros tres vectores de Bell: \(\tfrac{1-\lambda}2\) (triplemente degenerado).</li>
<li><b>Positividad completa.</b> \(J\ge0\Leftrightarrow\tfrac{1+3\lambda}2\ge0\) y \(\tfrac{1-\lambda}2\ge0\Leftrightarrow-\tfrac13\le\lambda\le1\).</li>
<li><b>Verificación.</b> \(\lambda=0.6\): autovalores \(1.4,\,0.2,\,0.2,\,0.2\) (el despolarizante con \(p=0.4\), como en el simulador). \(\lambda=-\tfrac13\): \(0,\tfrac23,\tfrac23,\tfrac23\) (frontera).</li>
<li><b>Inversión universal.</b> \(\lambda=-1\): el autovalor sobre \(|\Phi^+\rangle\) es \(\tfrac{1-3}2=-1<0\). El mapa es positivo (lleva cada estado a su ortogonal), pero acoplado a una ancilla entrelazada daría una matriz densidad con autovalor negativo: no existe ningún aparato que lo realice (es la transposición de Bloch, \(\sigma_y\rho^*\sigma_y\), como en la negatividad de Peres, capítulo 31).</li>
<li><b>Mejor NOT.</b> El canal físico más cercano es \(\lambda=-\tfrac13\). Para una entrada pura \(\vec r\), la salida \(\lambda\vec r\) tiene solapamiento con el estado ortogonal (\(-\vec r\)) igual a \(\tfrac12(1+(-\vec r)\cdot\lambda\vec r)=\tfrac{1-\lambda}2=\tfrac23\).</li>
<li><b>Resultado.</b> <span class="ans">Autovalores de Choi \(\tfrac{1+3\lambda}2\) y \(\tfrac{1-\lambda}2\) (×3); CP para \(-\tfrac13\le\lambda\le1\); \(\lambda=-1\) da \(-1\) (no física); fidelidad óptima del NOT \(=2/3\).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Para el átomo del problema 3 (\(\Omega=2\gamma\), \(\Delta=0\)), parta del estado fundamental y obtenga \(\rho_{ee}(t)\) resolviendo la ecuación diferencial de segundo orden. Halle el instante y el valor del primer máximo, su exceso sobre el estacionario y \(\rho_{ee}\) en \(\gamma t=1\) y \(\gamma t=8\). ¿Para qué \(\Omega\) desaparecen las oscilaciones?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Ecuación de segundo orden.</b> Las raíces del polinomio característico de las ecuaciones ópticas de Bloch en resonancia, \((\lambda+\gamma/2)\big[\lambda^2+\tfrac32\gamma\lambda+\gamma^2/2+\Omega^2\big]=0\), dan para \(y=\rho_{ee}-\rho_{ee}^{(\infty)}\) la ecuación \(\ddot y+\tfrac32\gamma\dot y+(\Omega^2+\gamma^2/2)y=0\), con raíces \(-\tfrac34\gamma\pm\ii\Omega'\) y \(\Omega'^2=\Omega^2-\gamma^2/16\).</li>
<li><b>Condiciones iniciales.</b> En el fundamental, \(\rho_{ee}(0)=0\Rightarrow y(0)=-\rho_{ee}^{(\infty)}\); y \(\dot\rho_{ee}(0)=0\) (sin coherencia aún) \(\Rightarrow\dot y(0)=0\).</li>
<li><b>Solución.</b> \(y=-\rho_{ee}^{(\infty)}\ee^{-3\gamma t/4}\big[\cos\Omega't+\tfrac{3\gamma}{4\Omega'}\sin\Omega't\big]\) (la derivada en cero se anula: \(-\tfrac34\gamma+\tfrac{3\gamma}{4\Omega'}\Omega'=0\)).</li>
<li><b>Números.</b> \(\Omega'=\sqrt{4-1/16}\,\gamma=1.9843\gamma\); \(\rho_{ee}^{(\infty)}=\Omega^2/(\gamma^2+2\Omega^2)=4/9=0.4444\).</li>
<li><b>Primer máximo.</b> \(\dot y\propto\ee^{-3\gamma t/4}\sin\Omega't\), de modo que el máximo está en \(\Omega't=\pi\): \(\gamma t=\pi/1.9843=1.5832\). Allí \(\cos=-1\), \(\sin=0\): \(\rho_{ee}=\rho_{ee}^{(\infty)}\big(1+\ee^{-3\pi\gamma/(4\Omega')}\big)=0.4444(1+0.3050)=0.5800\); exceso de \(30.5\,\%\).</li>
<li><b>Otros instantes.</b> \(\gamma t=1\): \(\rho_{ee}=0.4561\). \(\gamma t=8\): \(0.4456\) (queda un residuo \(\ee^{-6}\approx0.25\,\%\) de la amplitud).</li>
<li><b>Sin oscilaciones.</b> \(\Omega'\) deja de ser real cuando \(\Omega<\gamma/4\): régimen sobreamortiguado; el caso \(\Omega=\gamma/4\) es el amortiguamiento crítico.</li>
<li><b>Resultado.</b> <span class="ans">\(\rho_{ee}(t)=\tfrac49\big[1-\ee^{-3\gamma t/4}(\cos\Omega't+0.378\sin\Omega't)\big]\); primer máximo \(0.5800\) en \(\gamma t=1.583\); \(\rho_{ee}(1/\gamma)=0.4561\), \(\rho_{ee}(8/\gamma)=0.4456\); sin oscilaciones para \(\Omega\le\gamma/4\).</span></li>
</ol></details></li>
</ol>
