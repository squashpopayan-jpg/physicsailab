<template class="chapter-src" data-id="paquetes" data-num="3" data-title="Paquetes de onda, Fourier e incertidumbre" data-part="Parte I · Los orígenes y la función de onda" data-short="La partícula libre, las ondas planas y su normalización, los paquetes de onda como superposición de Fourier, las velocidades de fase y de grupo, el ensanchamiento del paquete gaussiano y las relaciones de incertidumbre">
<p class="lead">La solución más simple de la ecuación de Schrödinger, la partícula libre, es también una de las más instructivas. Sus soluciones de energía definida (ondas planas) no describen una partícula localizada ni se pueden normalizar; una partícula real es un <em>paquete</em> de ondas planas. De esa superposición salen tres resultados centrales: el paquete se mueve con la velocidad clásica (la velocidad de grupo), se ensancha con el tiempo, y no puede ser a la vez estrecho en posición y en momento. Esto último, la relación de incertidumbre, es una propiedad de la transformada de Fourier antes de ser un principio de la física.</p>

<section>
<h2>La partícula libre y las ondas planas</h2>
<p>Con \(V=0\), la ecuación estacionaria \(-\tfrac{\hbar^2}{2m}\psi''=E\psi\) tiene soluciones \(\psi_k=e^{ikx}\) con \(E=\hbar^2k^2/2m\) para cualquier \(k\) real, positiva (hacia la derecha) o negativa (hacia la izquierda); la dependencia temporal completa es \(\Psi_k=e^{i(kx-\omega t)}\), con \(\omega=\hbar k^2/2m\). Su momento está definido, \(p=\hbar k\), y su densidad \(|\Psi_k|^2=1\) es uniforme: no sabemos nada de la posición. Pero \(\int|\Psi_k|^2\dd x=\infty\): <em>no es normalizable</em> y no representa una partícula. Hay dos maneras de usarla de todos modos.</p>
<ul>
<li><strong>Normalización en una caja de periodicidad.</strong> Se impone \(\psi(x+L)=\psi(x)\) con \(L\) muy grande: \(k=2\pi n/L\) con \(n\in\mathbb Z\), y \(\psi_n=e^{ikx}/\sqrt L\) están normalizadas y son ortonormales, \(\int_0^L\psi_n^*\psi_m\dd x=\delta_{nm}\). En el límite \(L\to\infty\) el número de estados con \(k\) entre \(k\) y \(k+\dd k\) es \(L\,\dd k/2\pi\) (densidad de estados, usada en mecánica estadística y en la regla de oro del capítulo 23).</li>
<li><strong>Normalización a la delta de Dirac.</strong> Con \(\psi_k=e^{ikx}/\sqrt{2\pi}\), \(\int\psi_k^*\psi_{k'}\dd x=\delta(k-k')\). Ya no es un producto de Kronecker sino de Dirac: así se normalizan los estados del espectro continuo.</li>
</ul>
<p>La solución general de la ecuación dependiente del tiempo es la superposición lineal de todas las ondas planas, una integral de Fourier:</p>
<div class="eq key" data-name="Síntesis de Fourier del paquete libre">\[\Psi(x,t)=\frac{1}{\sqrt{2\pi}}\int_{-\infty}^{\infty}\phi(k)\,e^{i[kx-\omega(k)t]}\,\dd k,\qquad \phi(k)=\frac{1}{\sqrt{2\pi}}\int_{-\infty}^{\infty}\Psi(x,0)\,e^{-ikx}\,\dd x.\]</div>
<p>La función \(\phi(k)\) (o \(\phi(p)=\phi(k)/\sqrt\hbar\) en términos del momento) es la <span class="term">función de onda en el espacio de momentos</span>: \(|\phi(k)|^2\dd k\) es la probabilidad de que el número de onda esté entre \(k\) y \(k+\dd k\). El teorema de Plancherel garantiza que ambas descripciones están igualmente normalizadas, \(\int|\Psi|^2\dd x=\int|\phi|^2\dd k\), y que \(\phi\) no depende del tiempo en la partícula libre (solo cambian las fases \(e^{-i\omega t}\)). Para una partícula con \(V\neq0\) la ecuación \(\hat H\psi=E\psi\) se resuelve en los capítulos siguientes; la partícula libre es el caso donde se puede integrar a mano.</p>
</section>

<section>
<h2>Velocidad de fase y velocidad de grupo</h2>
<p>Una onda plana \(e^{i(kx-\omega t)}\) tiene crestas que se mueven con la <span class="term">velocidad de fase</span> \(v_f=\omega/k\). Para la partícula libre, \(v_f=\hbar k/2m=p/2m\): ¡la mitad de la velocidad clásica \(p/m\)! No hay contradicción, porque la onda plana no es una partícula. Lo que se mueve como una partícula es el <em>paquete</em>. Si \(\phi(k)\) es una campana estrecha alrededor de \(k_0\), se puede desarrollar \(\omega(k)\approx\omega_0+\omega_0'(k-k_0)\), con \(\omega_0'=\dd\omega/\dd k|_{k_0}\), y escribir \(k=k_0+q\):</p>
<div class="eq">\[\Psi(x,t)\approx e^{i(k_0x-\omega_0t)}\,\underbrace{\frac{1}{\sqrt{2\pi}}\int\phi(k_0+q)\,e^{iq(x-\omega_0't)}\,\dd q}_{F(x-\omega_0't)}.\]</div>
<p>El factor rápido es una onda plana (que se mueve a \(v_f\)); el factor \(F\) es la <em>envolvente</em>, y depende de \(x\) y \(t\) solo por la combinación \(x-\omega_0't\): se traslada rígidamente con la <span class="term">velocidad de grupo</span></p>
<div class="eq key" data-name="Velocidad de grupo">\[v_g=\left.\frac{\dd\omega}{\dd k}\right|_{k_0},\qquad \text{partícula libre: } v_g=\frac{\hbar k_0}{m}=\frac{p_0}{m}=2v_f .\]</div>
<p>El paquete se mueve como lo haría la partícula clásica de momento \(p_0\). La velocidad de grupo es la de transporte de energía y de probabilidad (ver la corriente del capítulo 2: \(\int j\,\dd x=\langle p\rangle/m\)). En la luz en el vacío, \(\omega=ck\) y \(v_f=v_g=c\): no hay dispersión. En un medio dispersivo \(\omega''\ne0\), y es ese término, de segundo orden, el que ensancha el paquete.</p>
<div class="sim" data-sim="grupo" data-title="Velocidad de fase frente a velocidad de grupo para distintas relaciones de dispersión"></div>
<div class="sim-guide"><ul>
<li>Partícula libre (\(\omega=k^2/2\), \(\hbar=m=1\), \(k_0=5\)): la envolvente avanza a \(v_g=5\) y la cresta a \(v_f=2.5\), la mitad. Siga el punto rojo: las crestas nacen en la cola del paquete, lo atraviesan y mueren en el frente. Además el grupo se ensancha (ensanchamiento por dispersión).</li>
<li>Luz (\(\omega=ck\)): \(v_g=v_f=5\) y el paquete conserva su forma indefinidamente: sin dispersión (\(\omega''=0\)).</li>
<li>Olas en agua profunda, \(\omega=\sqrt{gk}\): \(v_g=v_f/2\), de modo que las crestas adelantan al grupo; es lo que se observa en las olas de un barco. Con ondas capilares (\(\omega\propto k^{3/2}\)) ocurre lo contrario: \(v_g=\tfrac32v_f\).</li>
<li>Reduzca la anchura espectral \(\sigma_k\): el paquete se hace más ancho en el espacio y se ensancha más despacio. Es la incertidumbre de la sección 3.4.</li>
</ul></div>
</section>

<section>
<h2>El paquete gaussiano y su ensanchamiento</h2>
<p>El paquete gaussiano es el que se puede integrar de manera exacta. Se toma \(\Psi(x,0)=(2\pi\sigma^2)^{-1/4}\,e^{ik_0x}e^{-x^2/4\sigma^2}\) (centrado en el origen, con \(|\Psi|^2\) de desviación típica \(\sigma\)). Su transformada es otra gaussiana,</p>
<div class="eq">\[\phi(k)=\left(\frac{2\sigma^2}{\pi}\right)^{1/4}e^{-\sigma^2(k-k_0)^2},\qquad |\phi|^2\ \text{con}\ \Delta k=\frac{1}{2\sigma},\quad \Delta p=\frac\hbar{2\sigma}.\]</div>
<p>Para la evolución se inserta \(\omega=\hbar k^2/2m\) en la síntesis de Fourier y se completa el cuadrado en el exponente \(-\sigma^2q^2+iq(x-\hbar k_0t/m)-i\hbar q^2t/2m\) (con \(q=k-k_0\), y descartando la fase global). La integral gaussiana \(\int e^{-aq^2+bq}\dd q=\sqrt{\pi/a}\,e^{b^2/4a}\) con \(a=\sigma^2+i\hbar t/2m=\sigma^2\tau\), \(\tau=1+i\hbar t/2m\sigma^2\), da:</p>
<div class="eq key" data-name="Paquete gaussiano libre">\[\Psi(x,t)=\frac{(2\pi\sigma^2)^{-1/4}}{\sqrt{\tau}}\exp\!\left[-\frac{(x-v_gt)^2}{4\sigma^2\tau}+ik_0x-\frac{i\hbar k_0^2t}{2m}\right],\qquad |\Psi|^2=\frac{1}{\sqrt{2\pi}\,\sigma(t)}e^{-(x-v_gt)^2/2\sigma(t)^2},\]</div>
<div class="eq key" data-name="Ensanchamiento">\[\sigma(t)=\sigma\sqrt{1+\left(\frac{\hbar t}{2m\sigma^2}\right)^2}=\sigma\sqrt{1+(t/t^*)^2},\qquad t^*=\frac{2m\sigma^2}{\hbar}.\]</div>
<p>El centro se mueve con \(v_g=\hbar k_0/m\) y la anchura crece. La distribución de momentos (\(|\phi|^2\)) no cambia, y por tanto \(\Delta p=\hbar/2\sigma\) es constante: el producto \(\Delta x\Delta p=\tfrac\hbar2\sqrt{1+(t/t^*)^2}\) parte del mínimo y crece. La razón física es simple: las componentes rápidas (\(k\) grande) se adelantan y las lentas se retrasan, y el paquete se estira. El tiempo característico \(t^*=2m\sigma^2/\hbar\) depende de la masa y del cuadrado de la anchura inicial, y las escalas macroscópicas lo hacen enorme:</p>
<div class="box ex"><h4>¿Cuánto tarda en ensancharse un paquete?</h4>
<p><strong>Datos.</strong> \(\hbar=1.0546\times10^{-34}\) J·s; electrón (\(m=9.109\times10^{-31}\) kg), protón (\(1.6726\times10^{-27}\) kg) y una pelota de béisbol (\(m=0.145\) kg) con \(\sigma=1\) Å (átomos) o 1 mm (pelota). <strong>Procedimiento.</strong> (1) Electrón: \(t^*=2m\sigma^2/\hbar=2(9.109\times10^{-31})(10^{-10})^2/1.0546\times10^{-34}=1.727\times10^{-16}\) s \(=0.173\) fs. En 1 fs, \(t/t^*=5.79\) y \(\sigma\) pasa de 1 Å a \(5.87\) Å; en 10 fs, a 57.9 Å: un electrón confinado en un átomo se «difumina» casi al instante, que es lo que impide hablar de su trayectoria. (2) Protón: \(t^*=317\) fs, 1836 veces más lento: los núcleos se comportan casi clásicamente. (3) Pelota: \(t^*=2(0.145)(10^{-3})^2/1.0546\times10^{-34}=2.75\times10^{27}\) s \(=8.7\times10^{19}\) años, unas \(6\times10^{9}\) veces la edad del Universo (\(4.35\times10^{17}\) s). <strong>Conclusión.</strong> El ensanchamiento cuántico es dramático para electrones y desdeñable para cuerpos macroscópicos.</p></div>
<div class="sim" data-sim="paquete" data-title="Paquete gaussiano libre: ensanchamiento, velocidad de grupo y momento constante"></div>
<div class="sim-guide"><ul>
<li>Electrón con \(\sigma_0=1\) Å: \(t^*=1.727\times10^{-16}\) s. En \(t=t^*\) el paquete mide \(\sqrt2\,\sigma_0\) y el producto \(\Delta x\Delta p/(\hbar/2)=1.414\). Con \(k_0\sigma_0=3\) (\(k_0=3\) Å⁻¹) el centro viaja a \(v_g=\hbar k_0/m=3.47\times10^6\) m/s (energía cinética media 34.3 eV) y la cresta, a la mitad.</li>
<li>Cambie a protón: \(t^*\) crece 1836 veces, hasta 317 fs: el mismo paquete en unidades de \(t^*\) se ve idéntico (la forma depende solo de \(t/t^*\)), pero el tiempo real es mucho más largo. Con C₆₀ y \(\sigma_0=1\) Å, \(t^*=0.23\) ns.</li>
<li>La gráfica de la derecha, la distribución de momentos, no se mueve ni cambia de forma con \(t\) (solo se desplaza con \(k_0\)): un paquete libre conserva su \(\Delta p\) y su energía.</li>
</ul></div>
</section>

<section>
<h2>La relación de incertidumbre posición–momento</h2>
<p>Un paquete angosto en \(x\) necesita muchas ondas planas con \(k\) distintos para anularse fuera de la región, y por eso su \(\phi(k)\) es ancho. Esa es la relación de reciprocidad de Fourier, y en mecánica cuántica \(p=\hbar k\), de modo que</p>
<div class="eq key" data-name="Relación de incertidumbre de Heisenberg">\[\Delta x\,\Delta k\ge\tfrac12\quad\Longleftrightarrow\quad \Delta x\,\Delta p\ge\frac\hbar2,\qquad \Delta x=\sqrt{\langle x^2\rangle-\langle x\rangle^2},\ \ \Delta p=\sqrt{\langle p^2\rangle-\langle p\rangle^2}.\]</div>
<p><strong>Demostración.</strong> Sea \(\psi\) normalizada, con \(\langle x\rangle=\langle p\rangle=0\) (basta con trasladar \(x\) y \(k\)). Se tiene \(\Delta x^2=\int x^2|\psi|^2\dd x=\|x\psi\|^2\) y, por el teorema de Parseval, \(\Delta k^2=\int k^2|\phi|^2\dd k=\|\psi'\|^2\). La desigualdad de Cauchy–Schwarz da \(\|x\psi\|\,\|\psi'\|\ge|\langle x\psi,\psi'\rangle|\ge\left|\mathrm{Re}\int x\psi^*\psi'\dd x\right|\). Pero \(\mathrm{Re}(\psi^*\psi')=\tfrac12(|\psi|^2)'\), y por partes \(\int x\,\tfrac12(|\psi|^2)'\dd x=-\tfrac12\int|\psi|^2\dd x=-\tfrac12\) (el término de borde se anula). Entonces \(\Delta x\,\Delta k\ge\tfrac12\). La igualdad exige que \(\psi'\) sea proporcional a \(x\psi\), esto es, \(\psi\propto e^{-x^2/4\sigma^2}\): solo la gaussiana alcanza el mínimo. \(\blacksquare\)</p>
<p>Con esto, la «incertidumbre» no es una perturbación del aparato de medida: es el ancho de dos distribuciones de probabilidad ligadas por la transformada de Fourier, y existe antes de cualquier medida. La versión general para operadores cualesquiera (Robertson, 1929) se demuestra en el capítulo 4.</p>
<div class="sim" data-sim="fourier" data-title="Pares de Fourier: el producto de las anchuras Δx·Δk"></div>
<div class="sim-guide"><ul>
<li>Gaussiana: \(\Delta x\Delta k=0.5000\) para cualquier \(a\): el valor mínimo, que no cambia al variar la anchura (lo que se gana en un lado se pierde en el otro). Con \(a=1\), \(\Delta x=1\) y \(\Delta k=0.5\).</li>
<li>Secante hiperbólica (\(\pi/6=0.5236\)), exponencial doble (\(1/\sqrt2=0.7071\)) y triangular (\(\sqrt{0.3}=0.5477\)): todas por encima del límite \(\tfrac12\). Las funciones con «picos» tienen colas más lentas en \(k\), y sus \(\Delta k\) son mayores.</li>
<li>Pulso rectangular: \(\phi(k)\propto\sin(ka)/k\) decae solo como \(1/k\), \(|\phi|^2\sim1/k^2\), y \(\langle k^2\rangle=\infty\). La función de onda es normalizable y tiene \(\Delta x\) finita, pero \(\Delta p=\infty\): la energía cinética esperada de una partícula con bordes abruptos es infinita. Ningún estado físico tiene bordes rigurosamente abruptos.</li>
</ul></div>
</section>

<section>
<h2>Energía y tiempo</h2>
<p>También se cumple una relación \(\Delta E\,\Delta t\gtrsim\hbar/2\), pero su significado es distinto: el tiempo no es un operador (no hay «operador de tiempo» con espectro bueno), y \(\Delta t\) es una escala de tiempo, no una desviación típica. Un paquete de duración \(\Delta t\) (un pulso láser, la vida de un estado) está formado por frecuencias en un intervalo \(\Delta\omega\gtrsim1/2\Delta t\), con la misma matemática de Fourier del párrafo anterior. En un estado que decae con vida media \(\tau\) (probabilidad \(e^{-t/\tau}\)), la distribución de energías es una lorentziana de <span class="term">anchura natural</span> \(\Gamma=\hbar/\tau\): los estados de vida corta tienen niveles «borrosos» y las líneas espectrales son anchas.</p>
<div class="box ex"><h4>Anchura natural de dos líneas</h4>
<p><strong>Datos.</strong> (a) Estado 2p del hidrógeno, \(\tau=1.6\) ns, transición Lyman-α de 10.20 eV. (b) Nivel de 14.4 keV del \(^{57}\)Fe, vida media 98.3 ns (\(\tau=t_{1/2}/\ln2=141.8\) ns). <strong>Procedimiento.</strong> \(\Gamma=\hbar/\tau\), con \(\hbar=6.5821\times10^{-16}\) eV·s. (a) \(\Gamma=4.11\times10^{-7}\) eV, cociente \(\Gamma/E=4.0\times10^{-8}\). (b) \(\Gamma=4.64\times10^{-9}\) eV \(=4.6\) neV, cociente \(\Gamma/E=3.2\times10^{-13}\). <strong>Resultado.</strong> La línea del hierro es tan estrecha que la energía de retroceso del núcleo (1.95 meV, que es \(4\times10^5\) veces la anchura) basta para desafinar el emisor del absorbente, y hay que fijar el núcleo en un cristal (efecto Mössbauer, 1958) para observar la resonancia; con ella se midió el corrimiento gravitacional al rojo en 22.5 m de altura (Pound y Rebka, 1960).</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un electrón libre tiene 100 eV de energía cinética. Calcule su longitud de onda, la velocidad de grupo y la de fase.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Planteamiento.</b> \(\omega=\hbar k^2/2m\), de modo que \(v_g=\hbar k/m=\sqrt{2E/m}\) y \(v_f=\omega/k=\hbar k/2m=v_g/2\). La longitud de onda es \(\lambda=2\pi/k=h/\sqrt{2mE}\).</li>
<li><b>Velocidad de grupo.</b> \(v_g=\sqrt{2(100)(1.60218\times10^{-19})/9.10938\times10^{-31}}=5.931\times10^{6}\) m/s \(=0.0198c\) (la aproximación no relativista es válida: el error es de 0.015 %).</li>
<li><b>Velocidad de fase.</b> \(v_f=v_g/2=2.966\times10^6\) m/s.</li>
<li><b>Longitud de onda.</b> \(\lambda=1.2264\ \text{nm}/\sqrt{100}=0.12264\) nm \(=1.226\) Å, comparable con una distancia interatómica: de ahí la difracción de electrones (capítulo 1).</li>
<li><b>Resultado.</b> <span class="ans">\(\lambda=0.1226\) nm, \(v_g=5.93\times10^6\) m/s, \(v_f=2.97\times10^6\) m/s.</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Un electrón se localiza con \(\sigma_0=1\) Å. Calcule \(t^*\), la anchura tras 1 fs y tras 10 fs. Repita para un protón y para una pelota de 0.145 kg localizada a \(\sigma_0=1\) mm.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Planteamiento.</b> \(\sigma(t)=\sigma_0\sqrt{1+(t/t^*)^2}\), con \(t^*=2m\sigma_0^2/\hbar\).</li>
<li><b>Electrón.</b> \(t^*=2(9.1094\times10^{-31})(10^{-10})^2/1.05457\times10^{-34}=1.7274\times10^{-16}\) s. Para \(t=1\) fs: \(t/t^*=5.788\); \(\sigma=\sqrt{1+33.51}\ \text{Å}=5.874\) Å. Para \(t=10\) fs: \(57.9\) Å.</li>
<li><b>Protón.</b> \(t^*=3.171\times10^{-13}\) s. A 1 fs, \(t/t^*=3.15\times10^{-3}\): \(\sigma=1.000005\) Å. A 10 fs, \(\sigma=1.0005\) Å (ensanchamiento de 0.05 %).</li>
<li><b>Pelota.</b> \(t^*=2(0.145)(10^{-6})/1.05457\times10^{-34}=2.75\times10^{27}\) s \(=8.7\times10^{19}\) años. En 1 s el cambio relativo es \((t/t^*)^2/2=6.6\times10^{-56}\).</li>
<li><b>Resultado.</b> <span class="ans">\(t^*=0.1727\) fs (e⁻), 317.1 fs (p⁺), \(2.75\times10^{27}\) s (pelota); \(\sigma(1\text{ fs})=5.87\) Å, \(\sigma(10\text{ fs})=57.9\) Å para el electrón.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Para el paquete gaussiano del problema anterior (electrón, \(\sigma_0=1\) Å), halle \(\Delta p\) y la dispersión de energía cinética \(\Delta p^2/2m\), y compruebe \(\Delta x\Delta p=\hbar/2\) en \(t=0\) y su valor en \(t=t^*\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Dispersión de momento.</b> De \(\phi(k)\propto e^{-\sigma_0^2(k-k_0)^2}\), \(|\phi|^2\propto e^{-2\sigma_0^2(k-k_0)^2}\) es una gaussiana de varianza \(1/(4\sigma_0^2)\): \(\Delta k=1/2\sigma_0\), \(\Delta p=\hbar/2\sigma_0=1.05457\times10^{-34}/(2\times10^{-10})=5.273\times10^{-25}\) kg·m/s.</li>
<li><b>Energía.</b> \(\Delta p^2/2m=(5.273\times10^{-25})^2/(2\times9.1094\times10^{-31})=1.526\times10^{-19}\) J \(=0.9525\) eV. Esta es la «energía de localización»: confinar al electrón a 1 Å cuesta del orden de 1 eV, la escala de la energía atómica.</li>
<li><b>Producto.</b> En \(t=0\), \(\Delta x\Delta p=\sigma_0\cdot\hbar/2\sigma_0=\hbar/2\). Para \(t=t^*\), \(\Delta x=\sqrt2\sigma_0\) y \(\Delta p\) igual: \(\Delta x\Delta p=\sqrt2\,\hbar/2=0.7071\hbar\).</li>
<li><b>Resultado.</b> <span class="ans">\(\Delta p=5.27\times10^{-25}\) kg·m/s; 0.952 eV; \(\Delta x\Delta p=\hbar/2\) en \(t=0\) y \(1.414\,\hbar/2\) en \(t=t^*\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>El nivel de 14.4 keV del \(^{57}\)Fe tiene una vida media de 98.3 ns. Calcule \(\tau\), la anchura natural \(\Gamma\) y el cociente \(\Gamma/E\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Vida media.</b> La probabilidad de supervivencia es \(e^{-t/\tau}\), y la vida media (mitad de la población) \(t_{1/2}=\tau\ln2\). Luego \(\tau=98.3/0.6931=141.8\) ns.</li>
<li><b>Anchura.</b> \(\Gamma=\hbar/\tau=6.5821\times10^{-16}\ \text{eV·s}/141.8\times10^{-9}\ \text{s}=4.64\times10^{-9}\) eV.</li>
<li><b>Cociente.</b> \(\Gamma/E=4.64\times10^{-9}/14\,400=3.2\times10^{-13}\).</li>
<li><b>Resultado.</b> <span class="ans">\(\tau=142\) ns, \(\Gamma=4.6\) neV, \(\Gamma/E=3.2\times10^{-13}\).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que el producto \(\Delta x\Delta k\) vale \(\sqrt{3/10}\) para el pulso triangular \(\psi=1-|x|/a\) (\(|x|\lt a\)) y \(1/\sqrt2\) para \(\psi=e^{-|x|/a}\), usando \(\Delta k^2=\int|\psi'|^2\dd x/\int|\psi|^2\dd x\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Fundamento.</b> Por Parseval, \(\langle k^2\rangle=\int k^2|\phi|^2\dd k=\int|\psi'|^2\dd x\) (si \(\psi\) está normalizada), y \(\langle k\rangle=0\) para \(\psi\) real. Se divide por la norma \(\int\psi^2\dd x\) para funciones sin normalizar.</li>
<li><b>Triangular.</b> \(\int\psi^2\dd x=2\int_0^a(1-x/a)^2\dd x=2a/3\). \(\psi'=\mp1/a\) para \(0\lt|x|\lt a\): \(\int\psi'^2\dd x=2a\cdot a^{-2}=2/a\). Luego \(\Delta k^2=(2/a)/(2a/3)=3/a^2\), \(\Delta k=\sqrt3/a\).</li>
<li><b>Dispersión en \(x\) (triangular).</b> \(\langle x^2\rangle=\dfrac{2\int_0^ax^2(1-x/a)^2\dd x}{2a/3}=\dfrac{2a^3/30}{2a/3}=\dfrac{a^2}{10}\) (con \(\int_0^1u^2(1-u)^2\dd u=1/30\)). Así \(\Delta x=a/\sqrt{10}\).</li>
<li><b>Producto (triangular).</b> \(\Delta x\Delta k=\dfrac{a}{\sqrt{10}}\cdot\dfrac{\sqrt3}a=\sqrt{3/10}=0.5477\).</li>
<li><b>Exponencial.</b> \(\int\psi^2\dd x=2\int_0^\infty e^{-2x/a}\dd x=a\); \(\psi'=\mp\psi/a\), de modo que \(\int\psi'^2=a/a^2=1/a\) y \(\Delta k^2=1/a^2\). \(\langle x^2\rangle=\dfrac{2\int_0^\infty x^2e^{-2x/a}\dd x}{a}=\dfrac{2\cdot2(a/2)^3}{a}=\dfrac{a^2}2\), \(\Delta x=a/\sqrt2\). Producto: \(\tfrac{a}{\sqrt2}\cdot\tfrac1a=1/\sqrt2=0.7071\).</li>
<li><b>Resultado.</b> <span class="ans">\(\sqrt{3/10}=0.548\) y \(1/\sqrt2=0.707\), ambos mayores que \(\tfrac12\) como exige la desigualdad.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Deduzca la anchura \(\sigma(t)\) del paquete gaussiano libre y la posición de su centro a partir de la integral de Fourier, y verifique que \(\sigma(t^*)=\sqrt2\sigma_0\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Espectro.</b> \(\phi(k)=(2\sigma_0^2/\pi)^{1/4}e^{-\sigma_0^2(k-k_0)^2}\), con \(\int|\phi|^2\dd k=1\).</li>
<li><b>Integral.</b> \(\Psi=\dfrac{1}{\sqrt{2\pi}}\left(\dfrac{2\sigma_0^2}{\pi}\right)^{1/4}\displaystyle\int e^{-\sigma_0^2q^2+iqx'-i\hbar t\,q^2/2m}\dd q\cdot e^{i(k_0x-\omega_0t)}\), con \(q=k-k_0\), \(x'=x-v_gt\), \(v_g=\hbar k_0/m\) (los términos lineales de \(q\) en la fase se agrupan en \(x'\)).</li>
<li><b>Gaussiana compleja.</b> El exponente es \(-aq^2+iqx'\) con \(a=\sigma_0^2(1+it/t^*)\equiv\sigma_0^2\tau\) (\(t^*=2m\sigma_0^2/\hbar\)). Se usa \(\int e^{-aq^2+bq}\dd q=\sqrt{\pi/a}\,e^{b^2/4a}\) con \(b=ix'\): resulta \(\sqrt{\pi/(\sigma_0^2\tau)}\,e^{-x'^2/(4\sigma_0^2\tau)}\).</li>
<li><b>Módulo.</b> \(|\Psi|^2\propto|\tau|^{-1}\exp\!\left[-\dfrac{x'^2\,\mathrm{Re}(1/\tau)}{2\sigma_0^2}\right]\). Con \(1/\tau=(1-it/t^*)/(1+(t/t^*)^2)\), \(\mathrm{Re}(1/\tau)=1/(1+(t/t^*)^2)\), de modo que \(|\Psi|^2\propto e^{-x'^2/2\sigma(t)^2}\) con \(\sigma(t)^2=\sigma_0^2(1+(t/t^*)^2)\), y el prefactor \(|\tau|^{-1}\) conserva la norma.</li>
<li><b>Comprobación.</b> Para \(t=t^*\), \(\sigma^2=2\sigma_0^2\), \(\sigma=\sqrt2\sigma_0\).</li>
<li><b>Resultado.</b> <span class="ans">\(\sigma(t)=\sigma_0\sqrt{1+(\hbar t/2m\sigma_0^2)^2}\), centro en \(x=\hbar k_0t/m\), \(\sigma(t^*)=\sqrt2\,\sigma_0\).</span></li>
</ol></details></li>
</ol>
