<template class="chapter-src" data-id="bandas" data-num="11" data-title="Potenciales periódicos y bandas de Bloch" data-part="Parte II · Problemas en una dimensión" data-short="El teorema de Bloch, el peine de deltas (Kronig–Penney), la aproximación de electrones casi libres y el origen de las brechas, el límite de enlace fuerte, la masa efectiva y las oscilaciones de Bloch">
<p class="lead">Un electrón en un cristal siente un potencial que se repite con el periodo \(a\) de la red. De esa periodicidad, y solo de ella, salen la estructura de bandas y brechas de energía que distingue a los metales, los semiconductores y los aislantes. Este capítulo resuelve el problema en una dimensión, con tres modelos complementarios que reaparecen en el curso de estado sólido: el peine de deltas, con solución exacta; los electrones casi libres, que explican las brechas como reflexiones de Bragg; y el enlace fuerte, que las explica como acoplamiento de estados atómicos por efecto túnel, el desdoblamiento del capítulo 7 repetido en una cadena.</p>

<section>
<h2>El teorema de Bloch</h2>
<p>Sea \(V(x+a)=V(x)\). Entonces el hamiltoniano es invariante bajo la traslación \(\hat T_a\psi(x)=\psi(x+a)\): \([\hat H,\hat T_a]=0\). Como conmutan, tienen autofunciones comunes. Como \(\hat T_a\) es unitario, sus valores propios son fases, \(e^{\ii ka}\), con \(k\) real definido salvo \(2\pi/a\). Por tanto:</p>
<div class="eq key" data-name="Teorema de Bloch">\[\psi_{k}(x+a)=e^{\ii ka}\psi_k(x)\quad\Longleftrightarrow\quad\psi_k(x)=e^{\ii kx}\,u_k(x),\qquad u_k(x+a)=u_k(x).\]</div>
<p>Las autofunciones son ondas planas moduladas con la periodicidad de la red. El número \(k\) (el <span class="term">cuasimomento</span> o vector de onda de Bloch) solo está definido en la <span class="term">primera zona de Brillouin</span> \(-\pi/a\lt k\le\pi/a\), pues \(k\) y \(k+2\pi/a\) describen la misma función. En un cristal finito de \(N\) celdas con condiciones periódicas \(\psi(x+Na)=\psi(x)\), \(e^{\ii kNa}=1\) y \(k=2\pi j/Na\): hay \(N\) valores en la zona, uno por celda. Para cada \(k\) hay una familia de energías \(E_n(k)\), la <span class="term">estructura de bandas</span>; cada banda \(n\) tiene \(N\) estados (el doble con espín). Un electrón en un estado de Bloch tiene una velocidad de grupo \(v=\hbar^{-1}\partial E_n/\partial k\) constante: se propaga <em>sin dispersión</em> por la red perfecta, razón por la que un cristal puede conducir con resistencia nula en el límite de ausencia de defectos y de fonones.</p>
</section>

<section>
<h2>El peine de deltas (Kronig–Penney)</h2>
<p>El modelo de Kronig y Penney (1931) es el cristal unidimensional soluble. Aquí se usa su versión con barreras delgadas: \(V=\alpha\sum_n\delta(x-na)\) (\(\alpha\gt0\) barreras, \(\alpha\lt0\) pozos). En cada celda \(0\lt x\lt a\) la solución es \(\psi=A\sin qx+B\cos qx\), \(q=\sqrt{2mE}/\hbar\). El teorema de Bloch da la función en la celda vecina, \(\psi(x)=e^{-\ii ka}\psi(x+a)\) para \(-a\lt x\lt0\), y se exigen en \(x=0\) la continuidad de \(\psi\) y el salto \(\psi'(0^+)-\psi'(0^-)=\tfrac{2m\alpha}{\hbar^2}\psi(0)\) (capítulo 7). La continuidad da \(B=e^{-\ii ka}(A\sin qa+B\cos qa)\) y el salto \(qA-e^{-\ii ka}q(A\cos qa-B\sin qa)=\tfrac{2m\alpha}{\hbar^2}B\). Eliminando \(A\) y \(B\) se obtiene la condición, con \(P=m\alpha a/\hbar^2\) (adimensional):</p>
<div class="eq key" data-name="Relación de dispersión del peine de deltas">\[\cos ka=\cos qa+\frac{P}{qa}\,\sin qa\equiv f(E),\qquad E=\frac{\hbar^2q^2}{2m}\quad\left(E\lt0:\ f=\cosh\kappa a+\frac{P}{\kappa a}\sinh\kappa a\right).\]</div>
<p>Como \(|\cos ka|\le1\), solo hay solución si \(|f(E)|\le1\): las energías <em>permitidas</em> forman <span class="term">bandas</span> y las demás son <span class="term">brechas</span> prohibidas, donde \(k\) sería complejo y la función crece o decae exponencialmente. Resultados exactos: los extremos de las bandas están en \(qa=n\pi\) (donde \(f=(-1)^n\)) y en las energías donde \(f=\pm1\) por el otro lado. Para barreras (\(P\gt0\)), cada banda <em>termina</em> en \(qa=n\pi\), esto es, en la energía \(E_n=n^2\pi^2\hbar^2/2ma^2\) de la partícula libre con \(k=n\pi/a\) (borde de zona o centro), y empieza más arriba que la anterior brecha: la brecha se ubica justo <em>por encima</em> de \(E_n\). Para pozos (\(P\lt0\)), la primera banda baja de la energía cero y queda estrecha.</p>
<div class="box ex"><h4>Un cristal unidimensional con una brecha de 1.4 eV</h4>
<p><strong>Datos.</strong> Un electrón en una red de periodo \(a=0.5\) nm, con barreras de intensidad \(P=3\). La unidad de energía es \(\hbar^2/ma^2=0.0762/0.25=0.3048\) eV. <strong>Procedimiento.</strong> (1) Se resuelve \(|f(E)|=1\): las bandas permitidas (en unidades \(\hbar^2/ma^2\)) son \([1.9532,4.9348]\), \([9.4580,19.7392]\) y \([25.0939,44.4132]\). (2) El borde superior de la primera es \(\pi^2/2=4.9348\) (\(qa=\pi\)); el inferior, \(qa=1.9765\), \(E=1.9532\). (3) En eV: primera banda de 0.595 a 1.504 eV, ancho 0.909 eV; brecha de 1.504 a 2.883 eV, de anchura \(4.5232\times0.3048=1.379\) eV; segunda banda de 2.883 a 6.016 eV. <strong>Resultado.</strong> Un modelo de un solo parámetro produce una brecha de 1.4 eV, la escala de los semiconductores (Si: 1.12 eV; GaAs: 1.42 eV).</p></div>
<div class="sim" data-sim="kp" data-title="Bandas del peine de deltas: zona reducida, zona extendida y condición |f(E)| ≤ 1"></div>
<div class="sim-guide"><ul>
<li>Con \(P=3\): bandas \([1.953,4.935]\), \([9.458,19.739]\), \([25.094,44.413]\); brecha de 4.523 entre las dos primeras (la primera banda tiene un ancho de 2.982). Masa efectiva en el fondo: \(m^*=1.125\,m\), y en el borde de la zona la curvatura cambia de signo (\(m^*=-0.30\,m\)): allí los electrones se comportan como partículas de carga positiva (huecos).</li>
<li>Con \(P=0.5\) (potencial débil): bandas \([0.461,4.935]\) y \([5.886,19.739]\): brecha de 0.951, casi \(2P=1.0\), la predicción de electrones casi libres (siguiente sección). Con \(P=0\) las bandas desaparecen y solo queda la parábola libre.</li>
<li>Con pozos fuertes (\(P=-6\)): la banda más baja \([-18.174,-17.817]\) tiene un ancho de solo 0.357 y es casi plana (\(m^*=5.85\,m\)): es el estado ligado de un pozo (\(E_0=-P^2/2=-18\)) ensanchado por el túnel entre pozos. La siguiente banda parte de \(\pi^2/2=4.935\).</li>
</ul></div>
</section>

<section>
<h2>Electrones casi libres: las brechas son reflexiones de Bragg</h2>
<p>Si el potencial es débil, \(V(x)=\sum_GV_Ge^{\ii Gx}\) con \(G=2\pi m/a\), se trata como una perturbación de la partícula libre, cuyas funciones son \(e^{\ii kx}\), con \(E_k=\hbar^2k^2/2m\). El potencial acopla \(e^{\ii kx}\) con \(e^{\ii(k+G)x}\), y solo importa cuando ambos estados son casi degenerados, \(E_k\approx E_{k+G}\): esto es la condición de reflexión de Bragg \(k=-G/2\), por ejemplo \(k=\pm\pi/a\) en el borde de zona. Los dos estados degenerados \(e^{\ii\pi x/a}\) y \(e^{-\ii\pi x/a}\) (ondas que van en sentidos opuestos) se combinan en dos ondas <em>estacionarias</em> \(\cos(\pi x/a)\) y \(\sin(\pi x/a)\), con energías \(E=E_\pi\pm|V_G|\) (diagonalización de la matriz \(2\times2\) como en el capítulo 5):</p>
<div class="eq key" data-name="Brecha de electrones casi libres">\[E_\pm\left(\tfrac\pi a\right)=\frac{\hbar^2\pi^2}{2ma^2}\pm|V_{2\pi/a}|,\qquad E_\text{gap}=2\,|V_{2\pi/a}|,\qquad V(x)=2V_1\cos\frac{2\pi x}a\Rightarrow E_\text{gap}\simeq2V_1.\]</div>
<p>Las dos ondas estacionarias tienen densidades diferentes: \(|\sin(\pi x/a)|^2\) concentra el electrón donde el potencial \(V=2V_1\cos(2\pi x/a)\) es mínimo (\(x=a/2\)), con energía más baja; \(|\cos(\pi x/a)|^2\) lo concentra en los máximos del potencial (\(x=0\)), con energía más alta. La brecha es la diferencia de energía potencial entre las dos distribuciones de carga: una onda estacionaria sobre los iones o sobre el espacio entre ellos. Una onda que viaja con \(k\) dentro de la brecha sería reflejada totalmente por la red (Bragg), y por eso no hay estados propagantes ahí. El cálculo exacto en el simulador (ondas planas, matriz de \(17\times17\)) confirma que \(E_\text{gap}\approx2V_1\) con correcciones de orden \(V_1^2\).</p>
<div class="sim" data-sim="pw" data-title="Electrones casi libres: bandas y estados en el borde de la zona"></div>
<div class="sim-guide"><ul>
<li>Con \(V_1=0.5\) (en \(\hbar^2/ma^2\)): brecha numérica de 0.99984, frente a \(2V_1=1\); los bordes están en 4.4285 y 5.4284, simétricos respecto de \(\pi^2/2=4.9348\) (con una desviación de segundo orden de 0.0063). Con \(V_1=0.8\): 1.5993 frente a 1.6; con \(V_1=1.5\): 2.9957 frente a 3.</li>
<li>Los dos estados del borde (curvas roja y azul): el inferior es \(\propto\sin^2(\pi x/a)\) y tiene su máximo en \(x=a/2\), donde el potencial \(2V_1\cos(2\pi x/a)\) es mínimo; el superior, \(\cos^2\), en \(x=0\), donde el potencial es máximo. Aumente \(V_1\) y vea cómo se ensancha la brecha y se deforman las bandas lejos del borde.</li>
</ul></div>
</section>

<section>
<h2>Enlace fuerte: la banda como acoplamiento de estados atómicos</h2>
<p>El límite opuesto: pozos profundos y separados, con un estado ligado \(\varphi(x-na)\) en cada uno de energía \(E_0\), y solapamiento pequeño entre vecinos. En un pozo doble (capítulo 7) el acoplamiento por túnel \(-t\) desdobla el nivel en \(E_0\mp t\) (\(\Delta E=2t\)). En una cadena, la función de Bloch es la combinación \(\psi_k=\sum_ne^{\ii kna}\varphi_n\). El hamiltoniano solo conecta vecinos: \(\hat H\varphi_n=E_0\varphi_n-t(\varphi_{n+1}+\varphi_{n-1})\), y entonces</p>
<div class="eq key" data-name="Banda de enlace fuerte">\[E(k)=E_0-2t\cos ka,\qquad v=\frac{2ta}{\hbar}\sin ka,\qquad \frac1{m^*}=\frac{1}{\hbar^2}\frac{\partial^2E}{\partial k^2}=\frac{2ta^2}{\hbar^2}\cos ka,\qquad \text{ancho de banda}=4t.\]</div>
<p>La banda es una coseno con ancho \(4t\); la masa efectiva en el fondo es \(m^*=\hbar^2/(2ta^2)\) (grande si \(t\) es pequeño: los electrones se mueven por túnel de un sitio a otro) y se vuelve negativa en la mitad superior de la banda (\(k\gt\pi/2a\)). La velocidad es máxima en el centro de la banda, \(v_\text{máx}=2ta/\hbar\). La densidad de estados de la cadena es \(g(E)=\dfrac{1}{\pi\sqrt{4t^2-(E-E_0)^2}}\) (por sitio), con singularidades en los bordes (singularidades de van Hove en 1D). Para el peine de deltas con \(P=-6\) (\(\kappa_0a=6\), \(E_0=-18\)), el modelo da \(t=2|E_0|e^{-\kappa_0a}=0.0892\), ancho de banda \(4t=0.3569\) frente al exacto 0.3573 (0.1 %).</p>
<h3>Oscilaciones de Bloch</h3>
<p>Una fuerza constante \(F\) (un campo eléctrico) actúa sobre un electrón de Bloch como \(\hbar\dot k=F\): el vector de onda crece linealmente, y al llegar al borde de la zona vuelve al otro lado (\(k\) está definido módulo \(2\pi/a\)). La velocidad \(v(k)=\tfrac{2ta}\hbar\sin ka\) cambia de signo, y el electrón <em>oscila</em> en lugar de acelerarse indefinidamente:</p>
<div class="eq">\[x(t)=\frac{2t}{F}\left[1-\cos\frac{Fat}\hbar\right],\qquad T_B=\frac{2\pi\hbar}{Fa},\qquad \text{amplitud}=\frac{4t}{F}=\frac{\text{ancho de banda}}{F}.\]</div>
<p>Es una oscilación coherente en un cristal perfecto bajo un campo constante, predicha por Bloch (1929) y Zener, y observada solo en 1992 en superredes semiconductoras (Feldmann et al.) y, de forma limpia, en átomos fríos en redes ópticas (Ben Dahan et al., 1996), porque en un cristal real los choques la destruyen antes de completar un periodo.</p>
<div class="sim" data-sim="tb" data-title="Enlace fuerte: banda cosenoidal, niveles de un anillo y oscilación de Bloch"></div>
<div class="sim-guide"><ul>
<li>Con \(t=0.4\): ancho de banda 1.6, \(m^*=1/(2t)=1.25\), velocidad máxima 0.8. Los \(N=12\) niveles del anillo coinciden con \(-2t\cos(2\pi j/N)\) a \(10^{-15}\); los puntos rojos son esos valores de \(k\). Con \(N\) mayor llenan la banda.</li>
<li>Con \(F=0.1\): periodo de Bloch \(T_B=2\pi/F=62.83\) y amplitud espacial \(4t/F=16\) celdas. Duplique \(F\): el periodo se reduce a la mitad y la amplitud también. Para \(t\to0\) la banda es plana y la amplitud se anula: un electrón en un nivel atómico aislado no se mueve.</li>
</ul></div>
<div class="box ex"><h4>Oscilaciones de Bloch en una superred de GaAs/AlGaAs</h4>
<p><strong>Datos.</strong> Superred de periodo \(d=10\) nm con una miniband de ancho \(4t=20\) meV, y un campo \(E=10^6\) V/m (10 kV/cm). <strong>Procedimiento.</strong> (1) \(Fd=eEd=10\) meV. (2) \(T_B=h/(Fd)=4.1357\times10^{-15}\ \text{eV·s}/10^{-2}\ \text{eV}=0.4136\) ps. (3) Amplitud: \(4t/(eE)=20\ \text{meV}/(10^6\ \text{V/m})=20\) nm, dos periodos de la red. <strong>Resultado.</strong> Un electrón oscila con una frecuencia de 2.4 THz en 20 nm, solo si el tiempo entre choques supera 0.4 ps (en GaAs de calidad, 1 ps), la razón por la que se vio en superredes y no en cristales ordinarios.</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un cristal unidimensional tiene \(a=0.5\) nm. Calcule el borde de la primera zona de Brillouin, la energía de un electrón libre en ese punto y la longitud de onda de la onda reflejada por Bragg.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Zona de Brillouin.</b> \(k_\text{borde}=\pi/a=\pi/0.5\ \text{nm}=6.283\) nm⁻¹.</li>
<li><b>Energía libre.</b> \(E=\hbar^2k^2/2m=\dfrac{\hbar^2\pi^2}{2ma^2}=\dfrac{\pi^2}{2}\dfrac{\hbar^2}{ma^2}=4.9348\times0.3048\ \text{eV}=1.504\) eV (con \(\hbar^2/ma^2=0.0762/0.25=0.3048\) eV).</li>
<li><b>Longitud de onda.</b> \(\lambda=2\pi/k=2a=1.0\) nm: la condición de Bragg \(2a=\lambda\), en que las ondas reflejadas por cada plano interfieren constructivamente.</li>
<li><b>Resultado.</b> <span class="ans">\(k=6.283\) nm⁻¹; \(E=1.504\) eV; \(\lambda=1.0\) nm.</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Con electrones casi libres y \(V_1=0.8\) (en \(\hbar^2/ma^2\)) calcule los bordes de la brecha y compárelos con la predicción de primer orden; exprese el resultado en eV para \(a=0.5\) nm.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Primer orden.</b> \(E_\pm=\pi^2/2\pm V_1=4.9348\pm0.8\): 4.1348 y 5.7348; brecha \(2V_1=1.6\).</li>
<li><b>Resultado exacto.</b> Diagonalizando la matriz de ondas planas (17×17): \(E_-=4.1189\), \(E_+=5.7183\), brecha 1.5993.</li>
<li><b>Diferencia.</b> La brecha difiere del primer orden en 0.04 % y los bordes se desplazan 0.016 hacia abajo (efecto de segundo orden de los estados \(k\pm2\pi/a\) más lejanos).</li>
<li><b>En eV.</b> Con 0.3048 eV por unidad: \(E_-=1.2554\) eV, \(E_+=1.7429\) eV, brecha 0.4875 eV.</li>
<li><b>Resultado.</b> <span class="ans">Bordes 4.119 y 5.718 (1.255 y 1.743 eV); brecha 1.599 (0.487 eV) frente a 2V₁ = 1.6.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Demuestre el teorema de Bloch y que en un anillo de \(N\) celdas hay exactamente \(N\) valores de \(k\) en la primera zona.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Simetría.</b> \(\hat T_a\psi(x)=\psi(x+a)\). Con \(V(x+a)=V(x)\), \(\hat T_a\hat H\psi=\hat H\hat T_a\psi\): \([\hat H,\hat T_a]=0\).</li>
<li><b>Unitariedad.</b> \(\hat T_a^\dagger\hat T_a=1\) (la traslación conserva la norma): sus valores propios \(\lambda\) cumplen \(|\lambda|=1\), \(\lambda=e^{\ii ka}\).</li>
<li><b>Forma de Bloch.</b> Si \(\psi(x+a)=e^{\ii ka}\psi(x)\), la función \(u(x)=e^{-\ii kx}\psi(x)\) cumple \(u(x+a)=e^{-\ii k(x+a)}e^{\ii ka}\psi(x)=u(x)\): periódica. Por tanto \(\psi=e^{\ii kx}u(x)\).</li>
<li><b>Anillo.</b> Con \(\psi(x+Na)=\psi(x)\), \(\hat T_a^N=1\): \(e^{\ii kNa}=1\), \(k=2\pi j/Na\) con \(j\in\mathbb Z\).</li>
<li><b>Contar.</b> \(k\) y \(k+2\pi/a\) dan la misma función. En \(-\pi/a\lt k\le\pi/a\) hay \(\dfrac{2\pi/a}{2\pi/Na}=N\) valores.</li>
<li><b>Resultado.</b> <span class="ans">\(\psi=e^{\ii kx}u_k(x)\) con \(u\) periódica; \(N\) estados por banda.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>En el peine de deltas con \(P=3\) calcule los bordes de la primera banda y la primera brecha; compruebe que los bordes superiores están en \(qa=n\pi\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Condición.</b> \(f(q)=\cos q+3\sin q/q\) (con \(a=1\)); bandas donde \(|f|\le1\).</li>
<li><b>Bordes en \(qa=n\pi\).</b> \(\sin n\pi=0\Rightarrow f=(-1)^n\): borde de banda. Para \(n=1\): \(f(\pi)=-1\) (\(k=\pi\)), energía \(E=\pi^2/2=4.9348\): borde superior de la primera banda. Para \(n=2\): \(f(2\pi)=1\), \(E=2\pi^2=19.7392\): superior de la segunda.</li>
<li><b>Borde inferior de la primera banda.</b> \(f(q)=1\) (\(k=0\)): \(\cos q+3\sin q/q=1\). Por bisección, \(q=1.9765\), \(E=q^2/2=1.9532\) (en \(q=0\), \(f=1+P=4\gt1\) y \(f\) baja al cruzar 1).</li>
<li><b>Segunda banda.</b> Su inferior: \(f(q)=-1\) con \(q\) entre \(\pi\) y \(2\pi\): \(q=4.3493\), \(E=9.4580\).</li>
<li><b>Brecha.</b> De 4.9348 a 9.4580: anchura 4.5232. La primera banda mide \(4.9348-1.9532=2.9816\).</li>
<li><b>Resultado.</b> <span class="ans">Primera banda [1.9532, 4.9348]; segunda [9.4580, 19.7392]; brecha 4.523 (en \(\hbar^2/ma^2\)).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Deduzca \(E(k)=E_0-2t\cos ka\), \(m^*\) y la densidad de estados del enlace fuerte; aplique al peine con \(P=-6\) y compare el ancho de banda con el exacto.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Ansatz.</b> \(\psi_k=\sum_ne^{\ii kna}\varphi_n\) con \(\hat H\varphi_n=E_0\varphi_n-t(\varphi_{n+1}+\varphi_{n-1})\). Entonces \(\hat H\psi_k=\sum_ne^{\ii kna}[E_0\varphi_n-t\varphi_{n+1}-t\varphi_{n-1}]=\left[E_0-t(e^{-\ii ka}+e^{\ii ka})\right]\psi_k\).</li>
<li><b>Energía.</b> \(E(k)=E_0-2t\cos ka\), ancho \(4t\).</li>
<li><b>Masa efectiva.</b> \(\partial^2E/\partial k^2=2ta^2\cos ka\); en \(k=0\), \(m^*=\hbar^2/(2ta^2)\).</li>
<li><b>Densidad de estados.</b> \(g(E)=\dfrac{1}{2\pi}\left|\dfrac{\dd k}{\dd E}\right|\times2\) (\(\pm k\)) \(=\dfrac{1}{\pi}\dfrac1{2t\sin ka}=\dfrac{1}{\pi\sqrt{4t^2-(E-E_0)^2}}\) por sitio.</li>
<li><b>Aplicación.</b> \(P=-6\): \(\kappa_0=6\), \(E_0=-18\). Del pozo doble, \(t=\Delta E/2=2|E_0|e^{-\kappa_0d}\) con \(d=1\): \(t=2\times18\,e^{-6}=0.08924\). Ancho \(4t=0.3569\); exacto (Kronig–Penney): \(-17.8169-(-18.1742)=0.3573\); error 0.1 %.</li>
<li><b>Masa efectiva.</b> \(m^*=1/(2t)=5.60\), exacta 5.85 (la banda no es un coseno perfecto: 4 % de diferencia).</li>
<li><b>Resultado.</b> <span class="ans">\(t=0.0892\), ancho 0.3569 (exacto 0.3573); \(m^*=5.6\) (exacta 5.85).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Deduzca las oscilaciones de Bloch para la banda de enlace fuerte y calcule el periodo y la amplitud en una superred de \(d=10\) nm con ancho de miniband de 20 meV y un campo de \(10^6\) V/m.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Dinámica del cuasimomento.</b> \(\hbar\dot k=F\Rightarrow k(t)=k_0+Ft/\hbar\) (para \(k_0=0\)).</li>
<li><b>Velocidad y posición.</b> \(v(t)=\dfrac1\hbar\dfrac{\partial E}{\partial k}=\dfrac{2ta}\hbar\sin\dfrac{Fat}\hbar\). Integrando, \(x(t)=\dfrac{2t}F\left[1-\cos\dfrac{Fat}\hbar\right]\) (en unidades de longitud, con \(a\) del cociente).</li>
<li><b>Periodo y amplitud.</b> \(T_B=2\pi\hbar/(Fa)=h/(Fa)\); la amplitud de oscilación total (máximo − mínimo) es \(4t/F\) = ancho de banda/\(F\).</li>
<li><b>Números.</b> \(F=eE=1.602\times10^{-13}\) N; \(Fd=10\) meV. \(T_B=h/(Fd)=4.1357\times10^{-15}/0.010=4.136\times10^{-13}\) s \(=0.414\) ps; frecuencia 2.42 THz. Amplitud \(=20\ \text{meV}/(eE)=20\) nm.</li>
<li><b>Condición.</b> Se observa si el tiempo de relajación \(\tau\) supera \(T_B\): \(\omega_B\tau\gt1\).</li>
<li><b>Resultado.</b> <span class="ans">\(T_B=0.414\) ps (2.4 THz), amplitud 20 nm.</span></li>
</ol></details></li>
</ol>
