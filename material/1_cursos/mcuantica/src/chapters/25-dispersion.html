<template class="chapter-src" data-id="dispersion" data-num="25" data-title="Teoría de la dispersión: ondas parciales y Born" data-part="Parte V · Dispersión y resonancias" data-short="Sección eficaz y amplitud de dispersión, desarrollo en ondas parciales y desplazamientos de fase, teorema óptico, esfera dura, aproximación de Born y la dispersión de Rutherford">
<p class="lead">Casi todo lo que se sabe de la estructura de la materia viene de experimentos de dispersión: se lanzan partículas contra un blanco y se mide cuántas salen en cada dirección. Rutherford descubrió el núcleo así, los aceleradores sondean los quarks igual, y los neutrones lentos revelan la estructura de los cristales. En mecánica cuántica el problema se reduce a hallar la amplitud de dispersión \(f(\theta)\) para un potencial \(V(r)\), y hay dos caminos complementarios: las ondas parciales, exactas y adecuadas a bajas energías, y la aproximación de Born, perturbativa y adecuada a altas energías.</p>

<section>
<h2>Sección eficaz y amplitud de dispersión</h2>
<p>Un haz de partículas con densidad de corriente \(J\) incide sobre un potencial de alcance finito. Lejos del blanco, la función de onda estacionaria es una onda plana más una onda esférica saliente (las energías son \(E=\hbar^2k^2/2\mu\)):</p>
<div class="eq key" data-name="Amplitud de dispersión">\[\psi(\mathbf r)\ \xrightarrow{\ r\to\infty\ }\ \ee^{\ii kz}+f(\theta)\frac{\ee^{\ii kr}}r,\qquad\frac{\dd\sigma}{\dd\Omega}=|f(\theta)|^2,\qquad\sigma=\int|f|^2\dd\Omega .\]</div>
<p>La sección eficaz diferencial \(\dd\sigma/\dd\Omega\) es el número de partículas dispersadas por unidad de ángulo sólido y por unidad de flujo incidente (dimensión de área). La amplitud \(f\) contiene fase e interferencia, que las probabilidades clásicas no tienen. Con simetría esférica, \(f\) no depende de \(\phi\).</p>
</section>

<section>
<h2>Ondas parciales y desplazamientos de fase</h2>
<p>Para un potencial central, \(L^2\) se conserva y cada onda parcial \(l\) se dispersa por separado: la función radial \(R_l(r)\) cumple la ecuación del capítulo 13 y, fuera del alcance de \(V\), es una combinación de \(j_l\) y \(y_l\) que a gran distancia se escribe \(R_l\to\sin(kr-l\pi/2+\delta_l)/kr\). La <span class="term">fase de dispersión</span> \(\delta_l(k)\) mide cuánto se adelanta o atrasa la onda respecto de la libre: positivo para un potencial atractivo, negativo para uno repulsivo. Se halla integrando la ecuación radial hasta un radio \(a\) fuera del alcance y comparando la derivada logarítmica \(\beta=aR_l'/R_l\) con la solución libre:</p>
<div class="eq">\[\tan\delta_l=\frac{ka\,j_l'(ka)-\beta\,j_l(ka)}{ka\,y_l'(ka)-\beta\,y_l(ka)}\qquad(\text{esfera dura: }\beta\to\infty,\ \tan\delta_l=j_l(ka)/y_l(ka)).\]</div>
<p>Con \(\ee^{ikz}=\sum_l(2l+1)\ii^lj_l(kr)P_l(\cos\theta)\) (capítulo 13) y la forma asintótica, se obtienen las fórmulas centrales de la teoría:</p>
<div class="eq key" data-name="Ondas parciales y teorema óptico">\[f(\theta)=\frac1k\sum_{l=0}^\infty(2l+1)\,\ee^{\ii\delta_l}\sin\delta_l\,P_l(\cos\theta),\qquad\sigma=\frac{4\pi}{k^2}\sum_l(2l+1)\sin^2\delta_l=\frac{4\pi}k\,\mathrm{Im}\,f(0).\]</div>
<p>La sección eficaz total es la suma de contribuciones \(\sigma_l\le4\pi(2l+1)/k^2\) (el límite «unitario», \(\delta_l=\pi/2\)), y está ligada con la dispersión hacia delante: el <span class="term">teorema óptico</span>, consecuencia de la conservación de la probabilidad: lo que se quita del haz incidente (la absorción por la «sombra») se debe a la interferencia con la onda dispersada hacia delante. Los términos con \(l\gg ka\) se anulan (\(j_l(kr)\) no penetra la zona de alcance \(a\): la barrera centrífuga), de modo que a baja energía solo contribuyen las primeras ondas parciales, y a \(ka\ll1\) basta la onda s: \(\sigma\approx4\pi a_s^2\) con la <em>longitud de dispersión</em> \(a_s=-\lim\delta_0/k\) (capítulo 26).</p>
<p>El caso más sencillo es la esfera dura de radio \(a\) (\(\psi=0\) en \(r=a\)): \(\delta_0=-ka\) exacto (la onda se desplaza hacia afuera), \(\sigma\to4\pi a^2\) para \(ka\to0\), cuatro veces la sección geométrica. Para \(ka\gg1\) participan unos \(ka\) valores de \(l\) y la sección eficaz tiende a \(2\pi a^2\): la mitad es la reflexión clásica sobre la esfera y la otra mitad es la <em>dispersión de sombra</em>: detrás de la esfera la onda debe anularse, y eso exige una onda difractada de la misma intensidad (el principio de Babinet).</p>
<div class="sim" data-sim="esfera-dura" data-title="Esfera dura: ondas parciales, sección eficaz y verificación del teorema óptico"></div>
<div class="sim-guide"><ul>
<li>\(ka=0.1\): \(\delta_0=-0.1\), \(\delta_1=-3.3\times10^{-4}\) y \(\sigma=3.987\,\pi a^2\) (casi 4: onda s pura). Con \(ka=1\): \(\delta_l=-1.000,\,-0.2146,\,-0.0172,\,-5.4\times10^{-4}\) y \(\sigma=3.382\pi a^2=10.63\,a^2\).</li>
<li>Con \(ka=8\): hacen falta unas 10 ondas parciales y \(\sigma\to2.455\pi a^2\), acercándose al valor 2 desde arriba; la distribución angular (derecha) se concentra hacia delante: la difracción de la sombra. La última lectura confirma el teorema óptico: \((4\pi/k)\,\mathrm{Im}f(0)/\sigma=1.000000\).</li>
</ul></div>
</section>

<section>
<h2>La aproximación de Born</h2>
<p>A energías altas o potenciales débiles, el potencial es una perturbación de la onda plana. Al primer orden (ecuación de Lippmann–Schwinger, capítulo 26) la amplitud es la transformada de Fourier del potencial respecto del momento transferido \(\mathbf q=\mathbf k'-\mathbf k\), \(q=2k\sin(\theta/2)\):</p>
<div class="eq key" data-name="Primera aproximación de Born">\[f_B(\theta)=-\frac{\mu}{2\pi\hbar^2}\int V(\mathbf r)\,\ee^{-\ii\mathbf q\cdot\mathbf r}\,\dd^3r=-\frac{2\mu}{\hbar^2q}\int_0^\infty rV(r)\sin(qr)\,\dd r\qquad(\text{central}).\]</div>
<p>La sección eficaz es entonces el cuadrado del <em>factor de forma</em> del potencial: medir \(\dd\sigma/\dd\Omega\) frente a \(q\) es medir la transformada de Fourier de \(V\) (así se mide el tamaño del núcleo y de los protones con electrones). Dos ejemplos solubles, con \(\hbar=\mu=1\):</p>
<ul>
<li><b>Yukawa</b> \(V=-V_0ae^{-r/a}/r\): \(f_B=\dfrac{2V_0a}{q^2+a^{-2}}\) y \(\sigma_B=\dfrac{16\pi V_0^2a^6}{1+4k^2a^2}\).</li>
<li><b>Gaussiano</b> \(V=-V_0e^{-r^2/a^2}\): \(f_B=\tfrac{\sqrt\pi}2V_0a^3\ee^{-q^2a^2/4}\) y \(\sigma_B=\dfrac{\pi^2V_0^2a^4}{2k^2}\left(1-\ee^{-2k^2a^2}\right)\).</li>
</ul>
<p>Condición de validez: la onda dispersada debe ser pequeña frente a la incidente dentro del potencial, \(\left|\tfrac{\mu}{2\pi\hbar^2}\int V\ee^{ikr}\dots\right|\ll1\), que para un potencial de profundidad \(V_0\) y alcance \(a\) significa \(\mu|V_0|a^2/\hbar^2\ll1\) (a bajas energías) o \(|V_0|\ll E\) (a altas). Born no puede dar ondas parciales resonantes ni estados ligados (capítulo 26); sí es exacto en el límite de energías muy altas.</p>
<div class="sim" data-sim="born-exacta" data-title="Born frente a la solución exacta de ondas parciales"></div>
<div class="sim-guide"><ul>
<li>Yukawa con \(V_0=0.5\): a \(k=1\), \(\sigma_B=2.513\) frente a la exacta \(3.227\) (el Born subestima un 22 %: la energía \(E=0.5\) es del orden de \(V_0\)); a \(k=4\), \(0.1933\) frente a \(0.1967\) (1.7 %): el Born converge a altas energías. Con \(V_0=3\) a \(k=1\): \(90.5\) frente a \(34.7\): el Born sobreestima 2.6 veces.</li>
<li>Gaussiano con \(V_0=0.5\) y \(k=2\): \(0.3083\) (Born) frente a \(0.3125\) (exacta). Mueva \(V_0\) a valores grandes y observe que la curva exacta se aparta de la de Born en las bajas energías: allí aparecen las oscilaciones por ondas parciales casi resonantes.</li>
</ul></div>
</section>

<section>
<h2>La dispersión de Rutherford</h2>
<p>Una partícula de carga \(Z_1e\) y energía \(E\) contra un núcleo de carga \(Z_2e\) sigue una hipérbola; su ángulo de dispersión \(\theta\) y su parámetro de impacto \(b\) cumplen \(b=\tfrac d2\cot\tfrac\theta2\), con \(d=\dfrac{Z_1Z_2e^2}{4\pi\varepsilon_0E}\) la distancia del acercamiento frontal. La sección eficaz diferencial es</p>
<div class="eq key" data-name="Fórmula de Rutherford">\[\frac{\dd\sigma}{\dd\Omega}=\left(\frac{Z_1Z_2e^2}{4\pi\varepsilon_0\,4E}\right)^2\frac1{\sin^4(\theta/2)}=\left(\frac d4\right)^2\frac1{\sin^4(\theta/2)} .\]</div>
<p>Es una de las coincidencias más notables de la física: la fórmula clásica de Rutherford (1911) coincide <em>exactamente</em> con el resultado de la mecánica cuántica (con la aproximación de Born, y también con la solución exacta del potencial de Coulomb, en ondas parciales con las funciones de Coulomb). Geiger y Marsden (1909) observaron que partículas alfa de 5 MeV se reflejaban hacia atrás en una fina lámina de oro, \(1/8000\) de las veces: la masa positiva del átomo estaba en un núcleo diminuto. Con \(E=5.3\) MeV, \(d=42.9\) fm: una distancia de acercamiento mucho mayor que el radio nuclear del oro, de 7 fm, de modo que el núcleo se ve como una carga puntual y la fórmula vale hasta ángulos de 180°.</p>
<div class="sim" data-sim="rutherford" data-title="Dispersión de Rutherford: la sección eficaz, las trayectorias y el experimento de Geiger y Marsden"></div>
<div class="sim-guide"><ul>
<li>Alfa de 5.3 MeV sobre oro: \(d=42.93\) fm; a 90° el parámetro de impacto es \(b=21.46\) fm y \(\dd\sigma/\dd\Omega=460.7\) fm\(^2\)/sr \(=4.607\) b/sr. La fracción desviada a más de 90° en una lámina de 1 µm es \(8.5\times10^{-5}\) (1 de cada 11 700), del orden de lo medido por Geiger y Marsden.</li>
<li>Aumente \(E\) hasta 30 MeV con \(Z=79\): \(d=7.6\) fm, ya comparable con el radio nuclear: se alcanza la zona nuclear y se observarán desviaciones de Rutherford (el experimento que mide el radio del núcleo). Con carbono (\(Z=6\)) a 30 MeV \(d=0.6\) fm: el alfa penetra el núcleo hasta con \(\theta\) pequeños.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Para la esfera dura con \(ka=0.1\) calcule los desplazamientos de fase \(\delta_0,\delta_1\) y la sección eficaz total en unidades de \(\pi a^2\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Fórmula.</b> \(\tan\delta_l=j_l(ka)/y_l(ka)\).</li>
<li><b>\(l=0\).</b> \(j_0/y_0=\sin x/(-\cos x)=-\tan x\Rightarrow\delta_0=-ka=-0.1\).</li>
<li><b>\(l=1\).</b> \(j_1(0.1)=0.033300\), \(y_1(0.1)=-100.5\cdots\): \(\delta_1=-3.313\times10^{-4}\). (Para \(x\to0\): \(\delta_l\approx-\dfrac{x^{2l+1}}{(2l+1)!!\,(2l-1)!!}\).)</li>
<li><b>Sección eficaz.</b> \(\sigma=\dfrac{4\pi}{k^2}\left[\sin^2\delta_0+3\sin^2\delta_1+\dots\right]=\dfrac{4\pi}{0.01}\left[0.0099667+3.3\times10^{-7}\right]a^2=12.525\,a^2\) (con \(k=0.1/a\)).</li>
<li><b>En unidades de \(\pi a^2\).</b> \(12.525/\pi=3.987\).</li>
<li><b>Resultado.</b> <span class="ans">\(\delta_0=-0.1\), \(\delta_1=-3.3\times10^{-4}\); \(\sigma=3.987\,\pi a^2\) (el límite de baja energía es \(4\pi a^2\)).</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Alfas de 5.3 MeV chocan con núcleos de oro. Halle \(d\), el parámetro de impacto a 90°, \(\dd\sigma/\dd\Omega\) a 90° y la fracción desviada a más de 90° en una lámina de 1 µm (\(n=5.9\times10^{28}\) m\(^{-3}\)).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Acercamiento frontal.</b> \(d=\dfrac{Z_1Z_2e^2}{4\pi\varepsilon_0E}=\dfrac{2\times79\times1.43996\ \text{MeV·fm}}{5.3\ \text{MeV}}=42.93\) fm.</li>
<li><b>Parámetro de impacto.</b> \(b=\tfrac d2\cot45^\circ=21.46\) fm.</li>
<li><b>Sección diferencial.</b> \((d/4)^2/\sin^4(45^\circ)=115.17/0.25=460.7\) fm\(^2\)/sr \(=4.607\) b/sr.</li>
<li><b>Sección acumulada.</b> \(\sigma(>90^\circ)=\pi(d/2)^2\cot^2(45^\circ)=\pi\times(21.46\ \text{fm})^2=1447\) fm\(^2\).</li>
<li><b>Fracción.</b> \(nt\,\sigma=5.9\times10^{28}\times10^{-6}\times1447\times10^{-30}=8.54\times10^{-5}\).</li>
<li><b>Resultado.</b> <span class="ans">\(d=42.93\) fm; \(b=21.46\) fm; \(4.607\) b/sr; fracción \(8.5\times10^{-5}\) (1 de cada 11 700).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Deduzca la amplitud de Born del potencial de Yukawa \(V=-V_0ae^{-r/a}/r\) y su sección eficaz total; evalúe \(V_0=0.5\), \(a=1\) para \(k=1\) y \(k=4\) (\(\hbar=\mu=1\)).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Integral.</b> \(\int_0^\infty rV\sin(qr)\,\dd r=-V_0a\int_0^\infty\ee^{-r/a}\sin(qr)\,\dd r=-V_0a\dfrac q{q^2+a^{-2}}\).</li>
<li><b>Amplitud.</b> \(f_B=-\dfrac2q\left(-V_0a\dfrac q{q^2+a^{-2}}\right)=\dfrac{2V_0a}{q^2+a^{-2}}\).</li>
<li><b>Sección total.</b> \(\sigma=\dfrac{2\pi}{k^2}\int_0^{2k}f_B^2\,q\,\dd q=\dfrac{2\pi}{k^2}4V_0^2a^2\cdot\dfrac{2k^2}{a^{-2}(4k^2+a^{-2})}=\dfrac{16\pi V_0^2a^6}{1+4k^2a^2}\), usando \(\dd\Omega=2\pi\sin\theta\,\dd\theta\) y \(q\,\dd q=k^2\sin\theta\,\dd\theta\).</li>
<li><b>\(k=1\).</b> \(\sigma_B=\dfrac{16\pi\times0.25}{5}=2.513\).</li>
<li><b>\(k=4\).</b> \(\sigma_B=\dfrac{16\pi\times0.25}{65}=0.1933\).</li>
<li><b>Resultado.</b> <span class="ans">\(f_B=2V_0a/(q^2+a^{-2})\); \(\sigma_B=16\pi V_0^2a^6/(1+4k^2a^2)\): 2.513 (\(k=1\)) y 0.1933 (\(k=4\)); los valores exactos son 3.227 y 0.1967.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Compruebe el teorema óptico para la esfera dura con \(ka=1\): calcule \(\sigma\) con las ondas parciales y \(\tfrac{4\pi}k\mathrm{Im}f(0)\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Fases.</b> \(\delta_0=-1\), \(\delta_1=-0.21460\), \(\delta_2=-0.017206\), \(\delta_3=-5.41\times10^{-4}\), \(\delta_4=-9.0\times10^{-6}\).</li>
<li><b>Términos.</b> \((2l+1)\sin^2\delta_l\): \(0.70807\), \(0.13605\), \(0.001480\), \(2.05\times10^{-6}\), \(7\times10^{-10}\).</li>
<li><b>Suma.</b> \(0.84561\); \(\sigma=4\pi\times0.84561=10.626\,a^2\) (con \(k=1/a\)).</li>
<li><b>Teorema óptico.</b> \(\mathrm{Im}f(0)=\dfrac1k\sum(2l+1)\sin^2\delta_l\) (porque \(\mathrm{Im}\,[\ee^{\ii\delta}\sin\delta]=\sin^2\delta\) y \(P_l(1)=1\)): \(\dfrac{4\pi}k\mathrm{Im}f(0)=4\pi\times0.84561=10.626\) ✓.</li>
<li><b>Resultado.</b> <span class="ans">\(\sigma=10.626\,a^2=3.382\,\pi a^2\); el teorema óptico se cumple identicamente (el cociente es 1).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Halle la amplitud y la sección eficaz de Born del potencial gaussiano \(V=-V_0\ee^{-r^2/a^2}\) y evalúe \(V_0=0.5\), \(a=1\), \(k=2\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Integral.</b> \(\int_0^\infty r\ee^{-r^2/a^2}\sin(qr)\,\dd r=\dfrac{\sqrt\pi\,a^3q}4\,\ee^{-q^2a^2/4}\).</li>
<li><b>Amplitud.</b> \(f_B=-\dfrac2q(-V_0)\dfrac{\sqrt\pi a^3q}4\ee^{-q^2a^2/4}=\dfrac{\sqrt\pi}2V_0a^3\,\ee^{-q^2a^2/4}\).</li>
<li><b>Sección.</b> \(\sigma=\dfrac{2\pi}{k^2}\cdot\dfrac\pi4V_0^2a^6\int_0^{2k}\ee^{-q^2a^2/2}q\,\dd q=\dfrac{2\pi}{k^2}\cdot\dfrac\pi4V_0^2a^6\cdot\dfrac{1-\ee^{-2k^2a^2}}{a^2}=\dfrac{\pi^2V_0^2a^4}{2k^2}\left(1-\ee^{-2k^2a^2}\right)\).</li>
<li><b>Valores.</b> \(\dfrac{\pi^2\times0.25}{8}\left(1-\ee^{-8}\right)=0.30843\times0.99966=0.3083\).</li>
<li><b>Resultado.</b> <span class="ans">\(f_B=\tfrac{\sqrt\pi}2V_0a^3\ee^{-q^2a^2/4}\); \(\sigma_B=0.3083\) con \(k=2\) (exacta 0.3125, error 1.4 %).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Muestre que el límite de pantalla infinita del potencial de Yukawa apantallado \(V=Z_1Z_2e^2\ee^{-r/\lambda}/r\) en la aproximación de Born da la fórmula de Rutherford.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Amplitud de Born.</b> Con la integral del problema 3, \(f_B=-\dfrac{2\mu}{\hbar^2}\dfrac{Z_1Z_2e^2}{q^2+\lambda^{-2}}\) (potencial repulsivo; el signo de \(f\) no afecta a \(|f|^2\)).</li>
<li><b>Límite.</b> \(\lambda\to\infty\): \(f_B\to-\dfrac{2\mu Z_1Z_2e^2}{\hbar^2q^2}\).</li>
<li><b>Momento transferido.</b> \(q=2k\sin(\theta/2)\) y \(E=\hbar^2k^2/2\mu\Rightarrow q^2=4\cdot\dfrac{2\mu E}{\hbar^2}\sin^2\dfrac\theta2\).</li>
<li><b>Sustitución.</b> \(f_B=-\dfrac{2\mu Z_1Z_2e^2}{\hbar^2}\cdot\dfrac{\hbar^2}{8\mu E\sin^2(\theta/2)}=-\dfrac{Z_1Z_2e^2}{4E\sin^2(\theta/2)}\).</li>
<li><b>Sección diferencial.</b> \(\dfrac{\dd\sigma}{\dd\Omega}=\left(\dfrac{Z_1Z_2e^2}{4E}\right)^2\dfrac1{\sin^4(\theta/2)}\): la fórmula de Rutherford (en unidades de Gauss; en SI se sustituye \(e^2\to e^2/4\pi\varepsilon_0\)).</li>
<li><b>Resultado.</b> <span class="ans">\(f_B\to-Z_1Z_2e^2/[4E\sin^2(\theta/2)]\) y \(\dd\sigma/\dd\Omega=(Z_1Z_2e^2/4E)^2/\sin^4(\theta/2)\): Born, la mecánica clásica y la solución exacta coinciden para el Coulomb.</span></li>
</ol></details></li>
</ol>
