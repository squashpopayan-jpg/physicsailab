<template class="chapter-src" data-id="coherentes" data-num="10" data-title="Estados coherentes y comprimidos" data-part="Parte II · Problemas en una dimensión" data-short="Autoestados del operador de aniquilación: paquetes que oscilan sin deformarse, estadística de Poisson y luz láser, estados comprimidos y el interferómetro LIGO, función de Wigner y estados no clásicos (Fock y gatos de Schrödinger)">
<p class="lead">Entre las infinitas superposiciones de estados del oscilador armónico hay una familia especial: las que reproducen lo más fielmente posible el movimiento clásico. Schrödinger la descubrió en 1926, en el mismo artículo donde buscaba un paquete que no se ensanchara; Glauber la redescubrió en 1963 como el estado cuántico de la luz de un láser. Son los <em>estados coherentes</em>. Sus parientes, los estados <em>comprimidos</em>, permiten medir por debajo del ruido cuántico estándar (de ahí la mejora del detector de ondas gravitacionales LIGO), y la <em>función de Wigner</em> es la herramienta con la que se ve, en el espacio de fases, qué estados son clásicos y cuáles no.</p>

<section>
<h2>El estado coherente</h2>
<p>Un estado coherente \(|\alpha\rangle\) se define como un autoestado del operador de aniquilación, \(\hat a|\alpha\rangle=\alpha|\alpha\rangle\), con \(\alpha\) complejo (\(\hat a\) no es hermítico, así que su autovalor puede ser complejo). Desarrollando en la base de números, \(|\alpha\rangle=\sum c_n|n\rangle\), la ecuación de autovalores da \(\sqrt n\,c_n=\alpha\,c_{n-1}\), y por recurrencia \(c_n=\alpha^nc_0/\sqrt{n!}\). La normalización \(\sum|c_n|^2=e^{|\alpha|^2}|c_0|^2=1\) fija \(c_0=e^{-|\alpha|^2/2}\):</p>
<div class="eq key" data-name="Estado coherente">\[|\alpha\rangle=e^{-|\alpha|^2/2}\sum_{n=0}^\infty\frac{\alpha^n}{\sqrt{n!}}|n\rangle=\hat D(\alpha)|0\rangle,\qquad \hat D(\alpha)=e^{\alpha\hat a^\dagger-\alpha^*\hat a},\qquad P(n)=e^{-|\alpha|^2}\frac{|\alpha|^{2n}}{n!}.\]</div>
<p>El operador de desplazamiento \(\hat D(\alpha)\) traslada el estado fundamental (la gaussiana) en el espacio de fases al punto \((\langle x\rangle,\langle p\rangle)\). La distribución de cuantos es una <span class="term">distribución de Poisson</span>: \(\langle n\rangle=|\alpha|^2\) y \(\Delta n=|\alpha|\), de modo que \(\Delta n/\langle n\rangle=1/|\alpha|\) decrece al aumentar la amplitud. Con \(\hat x=\tfrac\ell{\sqrt2}(\hat a+\hat a^\dagger)\) y \(\hat p=\tfrac{\ii\hbar}{\sqrt2\ell}(\hat a^\dagger-\hat a)\):</p>
<div class="eq">\[\langle x\rangle=\sqrt2\,\ell\,\mathrm{Re}\,\alpha,\quad\langle p\rangle=\sqrt2\,\frac\hbar\ell\,\mathrm{Im}\,\alpha,\quad\Delta x=\frac{\ell}{\sqrt2},\quad\Delta p=\frac{\hbar}{\sqrt2\,\ell},\quad \Delta x\,\Delta p=\frac\hbar2,\quad\langle E\rangle=\hbar\omega\left(|\alpha|^2+\tfrac12\right).\]</div>
<p>Las incertidumbres son las del fundamental y no dependen de \(\alpha\): el desplazamiento no deforma. Todos los estados coherentes tienen incertidumbre mínima. La dependencia temporal es la clave: como \(e^{-\ii\hat Ht/\hbar}\) multiplica cada \(c_n\) por \(e^{-\ii(n+1/2)\omega t}\), el estado sigue siendo coherente con \(\alpha(t)=\alpha e^{-\ii\omega t}\) (salvo una fase global):</p>
<div class="eq key" data-name="Evolución de un estado coherente">\[|\alpha\rangle\ \xrightarrow{\ t\ }\ e^{-\ii\omega t/2}\,|\alpha e^{-\ii\omega t}\rangle,\qquad \langle x\rangle_t=\sqrt2\ell|\alpha|\cos(\omega t-\theta),\quad\langle p\rangle_t=\sqrt2\frac\hbar\ell|\alpha|\sin(\omega t-\theta)\ \ (\alpha=|\alpha|e^{\ii\theta}),\]</div>
<p>es decir, el paquete gaussiano oscila a lo largo de la trayectoria clásica de amplitud \(\sqrt2\ell|\alpha|\) con una anchura <em>constante</em> \(\ell/\sqrt2\): ni se ensancha (como el paquete libre del capítulo 3) ni se deforma. Es lo más parecido posible a una partícula clásica. Para amplitudes grandes (\(|\alpha|\gg1\)) el tamaño relativo \(\Delta x/\text{amplitud}=1/(2|\alpha|)\) tiende a cero: el límite clásico. Otras propiedades: los estados coherentes no son ortogonales, \(|\langle\alpha|\beta\rangle|^2=e^{-|\alpha-\beta|^2}\), y forman una base <em>sobrecompleta</em>, con \(\tfrac1\pi\int|\alpha\rangle\langle\alpha|\,\dd^2\alpha=\mathbb 1\).</p>
<div class="box ex"><h4>La luz de un láser de He–Ne</h4>
<p><strong>Datos.</strong> Potencia 1 mW, \(\lambda=632.8\) nm. <strong>Procedimiento.</strong> (1) Energía del fotón: \(hc/\lambda=1239.84/632.8=1.9593\) eV \(=3.1391\times10^{-19}\) J. (2) Flujo: \(P/E=3.186\times10^{15}\) fotones por segundo. (3) En una ventana de 1 ns, la luz de un láser es un estado coherente con \(\langle n\rangle=3.19\times10^6\) y \(\Delta n=\sqrt{\langle n\rangle}=1785\), un 0.056 % de fluctuación relativa: el <em>ruido de disparo</em>, la reducción de ruido máxima posible para un campo clásico. <strong>Resultado.</strong> La estadística de Poisson de los fotones es el límite cuántico estándar de toda medición óptica con luz láser, y los estados comprimidos lo superan.</p></div>
<div class="sim" data-sim="coherente" data-title="Estado coherente: un paquete gaussiano que oscila sin deformarse"></div>
<div class="sim-guide"><ul>
<li>Con \(|\alpha|=2.5\): \(\langle n\rangle=6.25\), \(\Delta n=2.5\) y \(\Delta n/\langle n\rangle=0.4\). El paquete (gaussiano, \(\Delta x=0.7071\)) oscila entre \(\pm\sqrt2|\alpha|=\pm3.54\), siempre con la misma forma; el producto \(\Delta x\Delta p/(\hbar/2)=1\) en todo momento.</li>
<li>Suba a \(|\alpha|=5\): la distribución de Poisson se estrecha en términos relativos (\(\Delta n/\langle n\rangle=0.2\)) y la amplitud del movimiento sube a 7.07; con \(|\alpha|=0\) se recupera el estado fundamental (\(P(0)=1\), el paquete queda inmóvil).</li>
<li>La probabilidad de estar en el estado fundamental es \(e^{-|\alpha|^2}\): 0.0183 para \(|\alpha|=2\) y \(1.2\times10^{-4}\) para \(|\alpha|=3\). La fase inicial \(\theta\) solo cambia el punto de partida de la oscilación.</li>
</ul></div>
</section>

<section>
<h2>Estados comprimidos</h2>
<p>Con la misma incertidumbre mínima, \(\Delta x\Delta p=\hbar/2\), se puede intercambiar la precisión entre \(x\) y \(p\): ganar en una cuadratura a costa de la otra. El <span class="term">operador de compresión</span> \(\hat S(r)=\exp\left[\tfrac r2(\hat a^2-\hat a^{\dagger2})\right]\) actúa como \(\hat S^\dagger\hat x\hat S=e^{-r}\hat x\) y \(\hat S^\dagger\hat p\hat S=e^{r}\hat p\); el estado \(\hat D(\alpha)\hat S(r)|0\rangle\) es un <em>estado coherente comprimido</em>:</p>
<div class="eq key" data-name="Estado comprimido">\[\Delta x=\frac{\ell}{\sqrt2}\,e^{-r},\quad\Delta p=\frac{\hbar}{\sqrt2\,\ell}\,e^{r},\quad\Delta x\Delta p=\frac\hbar2;\qquad \text{compresión (dB)}=-10\log_{10}e^{-2r}=8.686\,r;\qquad \langle n\rangle=\sinh^2r+|\alpha|^2.\]</div>
<p>La elipse de incertidumbre del espacio de fases (ver la simulación) tiene área constante (la del círculo del vacío) y semiejes \(e^{\mp r}/\sqrt2\). Como el oscilador hace girar el espacio de fases con velocidad angular \(\omega\) (Hamilton: \(x\to x\cos\omega t+p\sin\omega t\)), la elipse <em>gira</em> y las anchuras «respiran» con periodo \(\pi/\omega\): \(\Delta x(t)^2=\tfrac12\left[e^{-2r}\cos^2\omega t+e^{2r}\sin^2\omega t\right]\), que oscila entre \(e^{-r}/\sqrt2\) y \(e^{r}/\sqrt2\). El vacío comprimido (\(\alpha=0\)) solo contiene un número <em>par</em> de cuantos, con \(P(0)=1/\cosh r\). Aplicación: en un interferómetro la señal se codifica en una cuadratura (fase), y comprimir esa cuadratura baja el ruido de disparo; LIGO inyecta luz comprimida desde 2010 (6 dB de compresión medidos, \(r=0.69\)) y ha mejorado así su sensibilidad por encima del límite cuántico estándar.</p>
<div class="box ex"><h4>Convertir decibelios en r</h4>
<p><strong>Procedimiento.</strong> De la relación \(\text{dB}=8.686\,r\): 3 dB \(\Rightarrow r=0.3454\) (varianza \(e^{-2r}=0.501\), la mitad); 6 dB \(\Rightarrow r=0.6908\) (\(e^{-2r}=0.251\)); 10 dB \(\Rightarrow r=1.1513\) (varianza \(0.100\), un décimo). El estado correspondiente a \(r=1\) tiene \(\Delta x=0.2601\,\ell\) en el mínimo, \(1.922\,\ell\) en el máximo, y \(\sinh^2r=1.381\) cuantos en promedio, con \(P(0)=1/\cosh1=0.648\).</p></div>
<div class="sim" data-sim="comprimido" data-title="Estado coherente comprimido: la elipse de incertidumbre en el espacio de fases"></div>
<div class="sim-guide"><ul>
<li>Con \(r=0.8\) y \(|\alpha|=2\): compresión de 6.95 dB; \(\Delta x\) oscila entre 0.318 y 1.574 (en unidades de \(\ell\)) dos veces por periodo; el centro de la elipse recorre la circunferencia clásica de radio \(\sqrt2|\alpha|=2.83\). El determinante de la covarianza queda fijo: \(2\sqrt{\det}=1\) (estado puro de incertidumbre mínima).</li>
<li>Con \(r=0\) la elipse es el círculo del vacío (\(\Delta x=\Delta p=0.7071\) siempre). Con \(r=1.5\) (13 dB): \(\Delta x\) llega a 0.158 en el mejor instante, pero \(\Delta p\) sube a 3.17 en ese mismo instante.</li>
<li>Gire el eje comprimido (por ejemplo 90°): se invierte el papel de \(x\) y \(p\) y el ciclo se desplaza un cuarto de periodo.</li>
</ul></div>
</section>

<section>
<h2>La función de Wigner</h2>
<p>En mecánica clásica un estado es un punto \((x,p)\) del espacio de fases. En mecánica cuántica no hay puntos, pero Wigner (1932) definió una función en el espacio de fases que codifica el estado:</p>
<div class="eq key" data-name="Función de Wigner">\[W(x,p)=\frac{1}{\pi\hbar}\int_{-\infty}^{\infty}\psi^*(x+y)\,\psi(x-y)\,e^{2\ii py/\hbar}\,\dd y,\qquad \int W\,\dd p=|\psi(x)|^2,\quad\int W\,\dd x=|\phi(p)|^2,\quad\iint W\,\dd x\,\dd p=1.\]</div>
<p>Reproduce las distribuciones marginales correctas y permite calcular valores esperados de funciones de \(x\) y \(p\) como promedios en el espacio de fases, pero <em>no es una densidad de probabilidad</em> porque puede ser <strong>negativa</strong>, lo que es una firma de comportamiento no clásico: una distribución de probabilidad clásica nunca lo es. La incertidumbre se refleja en que \(W\) no puede concentrarse en una región de área menor que \(\hbar/2\). Para el oscilador, la evolución de \(W\) es una rotación rígida en el espacio de fases, idéntica a la de la mecánica clásica (la ecuación de Liouville). Los casos principales (en unidades \(\ell=\hbar=\omega=1\), con \(\rho=\xi^2+\pi^2\)):</p>
<ul>
<li><strong>Coherente y comprimido:</strong> gaussianas positivas centradas en \((\langle x\rangle,\langle p\rangle)\) (círculo o elipse): son los estados «clásicos», \(W\ge0\).</li>
<li><strong>Fock \(|n\rangle\):</strong> \(W_n=\dfrac{(-1)^n}{\pi}e^{-\rho}L_n(2\rho)\), con \(n\) anillos concéntricos de signo alternante. \(W_n(0,0)=(-1)^n/\pi\); para \(n=1\) el mínimo es \(-1/\pi=-0.3183\).</li>
<li><strong>Gato de Schrödinger</strong> \(|\alpha\rangle\pm|-\alpha\rangle\): dos gaussianas en \(\xi=\pm\sqrt2\alpha\) y, entre ellas, franjas de interferencia que oscilan en signo, \(\propto\pm2e^{-\rho}\cos(2\sqrt2\alpha\pi)\): son la huella de la coherencia cuántica entre las dos «mitades» (capítulo 32). Se miden por tomografía en iones atrapados (Monroe et al., 1996) y en cavidades de microondas (Haroche, 2008).</li>
</ul>
<div class="sim" data-sim="wigner" data-title="Función de Wigner de estados de Fock, coherentes, comprimidos y gatos de Schrödinger"></div>
<div class="sim-guide"><ul>
<li>Fock \(n=1\): \(W(0,0)=-0.3183=-1/\pi\), el mínimo, y el volumen negativo \(\delta=0.2131\); los marginales son positivos (\(|\psi_1|^2\) con un nodo, y \(|\phi_1|^2\)). \(n=2\): \(W(0,0)=+1/\pi\), mínimo \(-0.1318\), \(\delta=0.3645\); \(n=5\): \(\delta=0.6917\), crece con \(n\).</li>
<li>El estado coherente y el vacío comprimido nunca tienen negatividad (\(\delta=0\)): \(W\) es una gaussiana. El gato par con \(\alpha=1.5\): \(W(0,0)=+1/\pi\), mínimo \(-0.1898\) y \(\delta=0.2402\); el impar, \(W(0,0)=-1/\pi\) y \(\delta=0.2545\). Con \(\alpha=2\): \(\delta=0.2937\) y \(0.2943\).</li>
<li>En todos los casos la normalización es 1.0000 y los marginales son positivos: la negatividad de \(W\) no contradice ninguna probabilidad.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un oscilador de HCl (\(\ell=0.1073\) Å) está en un estado coherente con \(|\alpha|=3\). Calcule \(\langle n\rangle\), \(\Delta n\), \(\langle E\rangle\), el valor más probable de \(n\) con su probabilidad, y la amplitud de oscilación del enlace.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Estadística.</b> \(\langle n\rangle=|\alpha|^2=9\), \(\Delta n=|\alpha|=3\) (relativa \(1/3\)).</li>
<li><b>Energía.</b> \(\langle E\rangle=\hbar\omega(|\alpha|^2+\tfrac12)=9.5\,\hbar\omega\) (\(9.5\times2990.95=28\,414\) cm⁻¹ \(=3.52\) eV, superior a la mitad del \(D_e\) real; la aproximación armónica ya no vale).</li>
<li><b>Valor más probable.</b> Para Poisson de media 9: \(P(8)=P(9)=e^{-9}9^9/9!=0.13176\) (empate); \(P(10)=0.11858\).</li>
<li><b>Amplitud.</b> \(\sqrt2|\alpha|\ell=\sqrt2\times3\times0.1073=0.4551\) Å, 36 % de la longitud de enlace (1.275 Å).</li>
<li><b>Resultado.</b> <span class="ans">\(\langle n\rangle=9\), \(\Delta n=3\), \(\langle E\rangle=9.5\hbar\omega\); \(P(8)=P(9)=0.1318\); amplitud 0.455 Å.</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Un puntero láser de 1 mW a 632.8 nm: ¿cuántos fotones llegan en 1 ns, cuál es la fluctuación y qué fracción es?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Energía de un fotón.</b> \(E=hc/\lambda=1239.84\ \text{eV·nm}/632.8\ \text{nm}=1.9593\) eV \(=3.1391\times10^{-19}\) J.</li>
<li><b>Flujo.</b> \(P/E=10^{-3}/3.1391\times10^{-19}=3.1856\times10^{15}\) s⁻¹.</li>
<li><b>En 1 ns.</b> \(\langle n\rangle=3.19\times10^6\).</li>
<li><b>Fluctuación.</b> Poisson: \(\Delta n=\sqrt{\langle n\rangle}=1785\); relativa \(1/\sqrt{\langle n\rangle}=5.6\times10^{-4}\).</li>
<li><b>Resultado.</b> <span class="ans">\(3.19\times10^6\) fotones; \(\Delta n=1785\) (0.056 %).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que \(|\alpha\rangle=e^{-|\alpha|^2/2}\sum\alpha^n|n\rangle/\sqrt{n!}\) es autoestado de \(\hat a\) y calcule \(\langle n\rangle\), \(\Delta n\) y \(\langle\hat a^\dagger\hat a^\dagger\hat a\hat a\rangle\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Autoestado.</b> \(\hat a|\alpha\rangle=e^{-|\alpha|^2/2}\sum_{n\ge1}\dfrac{\alpha^n}{\sqrt{n!}}\sqrt n\,|n-1\rangle=\alpha\,e^{-|\alpha|^2/2}\sum_{n\ge1}\dfrac{\alpha^{n-1}}{\sqrt{(n-1)!}}|n-1\rangle=\alpha|\alpha\rangle\).</li>
<li><b>Número medio.</b> \(\langle\hat a^\dagger\hat a\rangle=\langle\alpha|\hat a^\dagger\hat a|\alpha\rangle=\alpha^*\alpha=|\alpha|^2\) (usando \(\hat a|\alpha\rangle=\alpha|\alpha\rangle\) y su adjunta).</li>
<li><b>Segundo momento.</b> \(\langle\hat n^2\rangle=\langle\hat a^\dagger\hat a\hat a^\dagger\hat a\rangle=\langle\hat a^\dagger(\hat a^\dagger\hat a+1)\hat a\rangle=\langle\hat a^{\dagger2}\hat a^2\rangle+\langle\hat a^\dagger\hat a\rangle=|\alpha|^4+|\alpha|^2\).</li>
<li><b>Dispersión.</b> \(\Delta n^2=|\alpha|^4+|\alpha|^2-|\alpha|^4=|\alpha|^2\): Poisson.</li>
<li><b>Correlación.</b> \(\langle\hat a^{\dagger2}\hat a^2\rangle=|\alpha|^4=\langle n\rangle^2\): \(g^{(2)}=1\) (no hay agrupamiento de fotones ni antiagrupamiento, la luz láser).</li>
<li><b>Resultado.</b> <span class="ans">\(\hat a|\alpha\rangle=\alpha|\alpha\rangle\); \(\langle n\rangle=\Delta n^2=|\alpha|^2\); \(\langle\hat a^{\dagger2}\hat a^2\rangle=|\alpha|^4\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que en \(|\alpha\rangle\) la incertidumbre es mínima: \(\Delta x=\ell/\sqrt2\), \(\Delta p=\hbar/\sqrt2\ell\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Valores medios.</b> \(\langle x\rangle=\tfrac{\ell}{\sqrt2}(\alpha+\alpha^*)\), \(\langle p\rangle=\tfrac{\ii\hbar}{\sqrt2\ell}(\alpha^*-\alpha)\).</li>
<li><b>Cuadrado de \(x\).</b> \(\hat x^2=\tfrac{\ell^2}2(\hat a^2+\hat a^{\dagger2}+2\hat a^\dagger\hat a+1)\) (con \(\hat a\hat a^\dagger=\hat a^\dagger\hat a+1\)). \(\langle x^2\rangle=\tfrac{\ell^2}2(\alpha^2+\alpha^{*2}+2|\alpha|^2+1)=\tfrac{\ell^2}2\left[(\alpha+\alpha^*)^2+1\right]\).</li>
<li><b>Varianza.</b> \(\Delta x^2=\langle x^2\rangle-\langle x\rangle^2=\tfrac{\ell^2}2\).</li>
<li><b>Momento.</b> Análogamente, \(\hat p^2=-\tfrac{\hbar^2}{2\ell^2}(\hat a^2+\hat a^{\dagger2}-2\hat a^\dagger\hat a-1)\) y \(\Delta p^2=\tfrac{\hbar^2}{2\ell^2}\).</li>
<li><b>Producto.</b> \(\Delta x\Delta p=\tfrac{\hbar}2\): mínimo.</li>
<li><b>Resultado.</b> <span class="ans">\(\Delta x=\ell/\sqrt2\), \(\Delta p=\hbar/(\sqrt2\ell)\), \(\Delta x\Delta p=\hbar/2\), independientes de \(\alpha\).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que \(|\langle\alpha|\beta\rangle|^2=e^{-|\alpha-\beta|^2}\) y evalúe para \(\alpha=0\), \(\beta=1\) y \(\beta=3\). ¿Qué significan los valores?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Producto.</b> \(\langle\alpha|\beta\rangle=e^{-(|\alpha|^2+|\beta|^2)/2}\sum_n\dfrac{(\alpha^*\beta)^n}{n!}=e^{-(|\alpha|^2+|\beta|^2)/2+\alpha^*\beta}\).</li>
<li><b>Módulo.</b> \(|\langle\alpha|\beta\rangle|^2=e^{-|\alpha|^2-|\beta|^2+2\mathrm{Re}(\alpha^*\beta)}=e^{-|\alpha-\beta|^2}\).</li>
<li><b>Evaluación.</b> \(\alpha=0\), \(\beta=1\): \(e^{-1}=0.3679\). \(\beta=3\): \(e^{-9}=1.234\times10^{-4}\).</li>
<li><b>Significado.</b> Dos estados coherentes son casi ortogonales cuando \(|\alpha-\beta|\gtrsim2\) (separados por más de dos veces el radio del vacío en el plano de \(x,p\)), pero nunca lo son exactamente: no hay dos estados coherentes ortogonales. Por eso el conjunto es sobrecompleto.</li>
<li><b>Resultado.</b> <span class="ans">\(|\langle\alpha|\beta\rangle|^2=e^{-|\alpha-\beta|^2}\): 0.368 (\(\Delta\alpha=1\)) y \(1.2\times10^{-4}\) (\(\Delta\alpha=3\)).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Para un estado comprimido con \(r=1\) y su eje comprimido a lo largo de \(x\) en \(t=0\), obtenga \(\Delta x(t)\) y \(\Delta p(t)\), sus extremos, el periodo de la respiración, la compresión en dB, \(\langle n\rangle\) con \(\alpha=0\) y \(P(0)\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Covarianza inicial.</b> \(\sigma_{xx}=\tfrac12e^{-2r}\), \(\sigma_{pp}=\tfrac12e^{2r}\), \(\sigma_{xp}=0\).</li>
<li><b>Rotación.</b> \(\hat x(t)=\hat x\cos\omega t+\hat p\sin\omega t\), luego \(\Delta x(t)^2=\sigma_{xx}\cos^2\omega t+\sigma_{pp}\sin^2\omega t\) y \(\Delta p(t)^2=\sigma_{xx}\sin^2\omega t+\sigma_{pp}\cos^2\omega t\).</li>
<li><b>Extremos.</b> \(\Delta x\) varía entre \(e^{-r}/\sqrt2=0.2601\) (en \(\omega t=0,\pi\)) y \(e^{r}/\sqrt2=1.9221\) (en \(\omega t=\pi/2\)), en unidades de \(\ell\). \(\Delta p\) lo hace al revés.</li>
<li><b>Periodo.</b> Dependen de \(\cos^2,\sin^2\): periodo \(\pi/\omega\) (la mitad del periodo del oscilador).</li>
<li><b>Compresión.</b> \(8.686\,r=8.69\) dB.</li>
<li><b>Estadística.</b> \(\langle n\rangle=\sinh^2r=1.381\); \(P(0)=1/\cosh r=0.648\); solo hay \(n\) par.</li>
<li><b>Resultado.</b> <span class="ans">\(\Delta x\in[0.260,1.922]\,\ell\), periodo \(\pi/\omega\), 8.69 dB, \(\langle n\rangle=1.381\), \(P(0)=0.648\).</span></li>
</ol></details></li>
</ol>
