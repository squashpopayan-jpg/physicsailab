<template class="chapter-src" data-id="wkb" data-num="22" data-title="La aproximación WKB" data-part="Parte IV · Métodos de aproximación" data-short="Aproximación semiclásica de Wentzel–Kramers–Brillouin: validez, puntos de retorno y fórmulas de conexión, regla de Bohr–Sommerfeld, efecto túnel, desintegración alfa de Gamow, fusión estelar y emisión de campo">
<p class="lead">La teoría de perturbaciones y el método variacional parten de un problema cercano. La aproximación WKB parte de otra idea: que la longitud de onda de de Broglie varíe poco a lo largo de la partícula, de modo que localmente la onda sea una onda plana. Es la mecánica cuántica en el límite \(\hbar\to0\), pero con la información cuántica de las fases y la penetración en las regiones prohibidas. Con ella se cuantizan los niveles de potenciales no resolubles, se calcula el efecto túnel con una sola integral y se explican fenómenos tan distintos como la vida media del uranio, el brillo del Sol y la emisión de electrones por una punta metálica.</p>

<section>
<h2>La onda semiclásica</h2>
<p>En una dimensión, con \(\psi=\ee^{\ii S(x)/\hbar}\), la ecuación de Schrödinger se convierte en \(\tfrac12S'^2-\tfrac{\ii\hbar}2S''=E-V\). Desarrollando \(S=S_0+\hbar S_1+\dots\) con \(p(x)=\sqrt{2m(E-V)}\):</p>
<div class="eq key" data-name="Función de onda WKB">\[\psi(x)\approx\frac{C_\pm}{\sqrt{p(x)}}\exp\left(\pm\frac\ii\hbar\int^xp\,\dd x'\right)\ \ (E>V),\qquad\psi(x)\approx\frac{D_\pm}{\sqrt{|p(x)|}}\exp\left(\pm\frac1\hbar\int^x|p|\,\dd x'\right)\ \ (E<V).\]</div>
<p>La fase es la acción clásica \(\int p\,\dd x/\hbar\) y el factor \(1/\sqrt p\) hace que la densidad \(|\psi|^2\propto1/p\propto1/v\) sea la probabilidad clásica de hallar la partícula en cada punto (la partícula pasa más tiempo donde va más lenta). La aproximación vale mientras la longitud de onda cambie poco en una longitud de onda: \(\left|\dfrac{\dd\lambda}{\dd x}\right|=\dfrac{\hbar\,m|V'|}{p^3}\cdot2\pi\ll1\). Falla justamente en los <span class="term">puntos de retorno</span> (\(E=V\), donde \(p\to0\) y \(\lambda\to\infty\)) y cerca de ellos hay que unir las soluciones oscilante y exponencial.</p>
</section>

<section>
<h2>Puntos de retorno y la regla de Bohr–Sommerfeld</h2>
<p>Cerca de un punto de retorno \(b\) (con la región permitida a la izquierda) el potencial se puede aproximar por una recta, y la ecuación de Schrödinger se resuelve con funciones de Airy. Al empalmar las soluciones asintóticas se obtiene la <span class="term">fórmula de conexión</span>:</p>
<div class="eq">\[\frac2{\sqrt p}\cos\left(\frac1\hbar\int_x^bp\,\dd x'-\frac\pi4\right)\ \longleftrightarrow\ \frac1{\sqrt{|p|}}\exp\left(-\frac1\hbar\int_b^x|p|\,\dd x'\right).\]</div>
<p>La solución decae a la derecha de \(b\) y, a su izquierda, es una onda con una fase adelantada de \(\pi/4\) respecto de la acción clásica. Para un pozo con dos puntos de retorno \(x_1\lt x_2\), la función debe ser compatible con el decaimiento en ambos lados, lo que fuerza la condición de cuantización:</p>
<div class="eq key" data-name="Regla de Bohr–Sommerfeld (con la corrección de Maslov)">\[\int_{x_1}^{x_2}p\,\dd x=\left(n+\tfrac12\right)\pi\hbar\quad\Longleftrightarrow\quad\oint p\,\dd x=\left(n+\tfrac12\right)h,\qquad n=0,1,2,\dots\]</div>
<p>Es la regla de cuantización «antigua» de Bohr y Sommerfeld, con el \(\tfrac12\) (el índice de Maslov) que la teoría antigua no tenía y que corrige la energía del punto cero. El número de nodos de \(\psi_n\) es \(n\), igual que en la ecuación exacta. Para paredes rígidas, que imponen \(\psi=0\), cada pared aporta una fase \(\pi/2\) en lugar de \(\pi/4\): con dos paredes \(\int p\,\dd x=(n+1)\pi\hbar\) y con una pared y un punto de retorno, \((n+\tfrac34)\pi\hbar\). La integral \(\oint p\,\dd x\) es el área encerrada por la órbita clásica en el espacio de fases: cada estado ocupa un área \(h\), en concordancia con el recuento de estados del capítulo 3.</p>
<p>Para el oscilador armónico el área de la elipse es \(2\pi E/\omega\), de modo que \(E_n=(n+\tfrac12)\hbar\omega\): <em>exacto</em>. También es exacto para el potencial de Morse y el de Coulomb; en otros casos el error relativo decrece como \(1/n^2\).</p>
<div class="sim" data-sim="wkb-niveles" data-title="Bohr–Sommerfeld frente a los niveles exactos en cuatro potenciales"></div>
<div class="sim-guide"><ul>
<li>Potencial lineal \(V=|x|\): WKB da \(E_n=\left[\tfrac{3\pi(n+\frac12)}{4\sqrt2}\right]^{2/3}\), con el estado fundamental en \(0.8853\) frente a \(0.8086\) (error 9.5 %), pero el primer excitado en \(1.8416\) frente a \(1.8558\) (0.76 %) y el tercero (\(n=3\)) en \(3.2397\) frente a \(3.2446\) (0.15 %): el error cae rápidamente con \(n\).</li>
<li>Potencial cuártico \(x^4\): estado fundamental \(0.5463\) (exacto \(0.6680\), error 18 %), \(n=1\): \(2.364\) (\(2.394\), 1.3 %). Morse con \(D=12\): WKB reproduce los 5 niveles ligados (\(2.3245\), \(6.2235,\dots\)) con un error por debajo de \(0.01\,\%\) (la cuantización es exacta: es el resultado de Morse con el área de la órbita). La mayor desviación está siempre en el estado más bajo.</li>
</ul></div>
</section>

<section>
<h2>El efecto túnel en la aproximación WKB</h2>
<p>En una región prohibida \((x_1,x_2)\) la onda decae como \(\exp\left(-\tfrac1\hbar\int|p|\,\dd x\right)\). Una partícula incidente con \(E\lt V\) tiene entonces una transmisión de forma universal:</p>
<div class="eq key" data-name="Transmisión WKB por una barrera">\[T\approx\ee^{-2S},\qquad S=\frac1\hbar\int_{x_1}^{x_2}\sqrt{2m\,(V(x)-E)}\,\dd x,\qquad T_\text{Kemble}=\frac1{1+\ee^{2S}}.\]</div>
<p>La integral \(S\) mide el «grosor óptico» de la barrera y entra en el exponente: un cambio pequeño de \(V\), \(E\) o \(m\) cambia \(T\) en muchos órdenes de magnitud. La fórmula tiene dos límitaciones: omite un factor de orden 1 que depende de la forma de la barrera (para una rectangular, \(16E(V_0-E)/V_0^2\)) y falla cuando \(E\) se acerca a la cima (\(S\to0\)), donde la fórmula de Kemble, \(1/(1+\ee^{2S})\), la corrige (da \(\tfrac12\) en la cima de un máximo parabólico, el valor exacto). Para barreras suaves el error en \(T\) es del orden del 10–30 %.</p>
<div class="sim" data-sim="wkb-tunel" data-title="Transmisión por una barrera suave: exacta frente a WKB y Kemble"></div>
<div class="sim-guide"><ul>
<li>Barrera parabólica truncada, \(V_0=20\), \(E=0.4V_0\): \(S=5.961\), \(T_\text{exacta}=8.98\times10^{-6}\), \(T_\text{WKB}=6.65\times10^{-6}\) (cociente 0.74). Con \(E=0.9V_0\): \(S=0.9935\), \(T=0.1221\) exacta, \(0.1371\) WKB y \(0.1206\) con Kemble: la fórmula de Kemble mejora cerca de la cima.</li>
<li>Con la barrera triangular (\(E=0.4V_0\)) el cociente es 0.52 y con la gaussiana 0.88: en una escala logarítmica (la curva de la derecha) las tres coinciden: el exponente domina. Cambie \(V_0\) de 20 a 40 y vea cómo \(T\) cae unas 5 decenas de órdenes con solo duplicar \(V_0\).</li>
</ul></div>
</section>

<section>
<h2>Aplicaciones: alfa, fusión y emisión de campo</h2>
<p><b>Desintegración alfa (Gamow, Condon y Gurney, 1928).</b> Una partícula alfa dentro de un núcleo de radio \(R\) ve la barrera de Coulomb \(V=k/r\) con \(k=2(Z-2)e^2/4\pi\varepsilon_0\) hasta salir al punto de retorno \(b=k/Q\). La integral se resuelve en forma cerrada: con \(x=R/b\) y \(v=\sqrt{2Q/\mu}\),</p>
<div class="eq key" data-name="Factor de Gamow">\[2G=\frac2\hbar\int_R^b\sqrt{2\mu\left(\frac kr-Q\right)}\,\dd r=\frac{4k}{\hbar v}\left[\arccos\sqrt x-\sqrt{x(1-x)}\right]\ \xrightarrow{x\to0}\ \frac{2\pi k}{\hbar v}=2\pi\eta,\qquad\lambda=f\,\ee^{-2G},\ \ f=\frac v{2R}.\]</div>
<p>La constante de desintegración es la frecuencia con que la alfa golpea la pared (\(f\sim10^{21}\) s\(^{-1}\)) por la probabilidad de atravesarla. Como \(2G\propto Q^{-1/2}\), una variación de \(Q\) de 4 a 9 MeV cambia la vida media en 24 órdenes de magnitud, la ley empírica de Geiger y Nuttall (1911), que la mecánica clásica no podía explicar: esta fue la primera aplicación de la mecánica cuántica al núcleo.</p>
<div class="sim" data-sim="alfa-gamow" data-title="Desintegración alfa: la teoría de Gamow frente a las vidas medias medidas"></div>
<div class="sim-guide"><ul>
<li>\(^{238}\)U: \(2G=87.99\), \(e^{-2G}=6.1\times10^{-39}\), \(f=2.4\times10^{21}\) s\(^{-1}\): \(t_{1/2}=4.8\times10^{16}\) s \(=1.5\times10^9\) años (medida: \(4.47\times10^9\) años). \(^{212}\)Po: \(2G=32.29\), \(t_{1/2}=2.8\times10^{-8}\) s frente a \(3.0\times10^{-7}\) s medida. Con un solo parámetro (\(r_0\)) la teoría acierta en un factor \(\lesssim10\) a lo largo de 24 órdenes de magnitud (desviación típica de 0.49 en \(\log_{10}\)).</li>
<li>Mueva \(r_0\) de 1.2 a 1.4 fm: todas las vidas medias suben o bajan en conjunto (R mayor reduce el grosor de la barrera). La teoría no explica los factores de formación del núcleo hijo, que dan las desviaciones residuales.</li>
</ul></div>
<p><b>Fusión nuclear en las estrellas.</b> Dos protones deben acercarse a unos 1.5 fm para fusionarse; su energía de repulsión coulombiana en ese punto es de 0.96 MeV, pero a la temperatura del centro del Sol (\(1.5\times10^7\) K, \(k_BT=1.29\) keV) casi ningún protón tiene tanta energía. La probabilidad de fusión es el producto de la distribución de Maxwell, \(\ee^{-E/k_BT}\), por la transmisión de Gamow, \(\ee^{-\sqrt{E_G/E}}\) con la <em>energía de Gamow</em> \(E_G=2\mu c^2(\pi\alpha Z_1Z_2)^2\) (493 keV para \(pp\)). Su producto tiene un máximo estrecho, el <span class="term">pico de Gamow</span> en \(E_0=\left(\tfrac{E_G(k_BT)^2}4\right)^{1/3}\approx5.9\) keV: una energía mucho menor que la barrera, donde la fusión «efectiva» ocurre solo por el túnel. Sin el efecto túnel el Sol no brillaría. <b>Emisión de campo.</b> Un campo \(F\) en la superficie de un metal convierte la barrera en un triángulo de altura igual a la función de trabajo \(\Phi\); el WKB da la ley de Fowler–Nordheim, \(T\approx\exp\left(-\dfrac{4\sqrt{2m}\,\Phi^{3/2}}{3\hbar eF}\right)\), con \(\dfrac{4\sqrt{2m}}{3\hbar e}=6.831\ \text{V\,eV}^{-3/2}\text{nm}^{-1}\): una recta en el gráfico de \(\ln(J/F^2)\) frente a \(1/F\), base de los microscopios de efecto de campo y de los microscopios de efecto túnel.</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Con \(\hbar=m=1\), halle los niveles WKB de \(V=|x|\) y compárelos con los exactos (ceros de la función de Airy: \(E_n=-a_{n}'/2^{1/3}\) para estados pares y \(-a_n/2^{1/3}\) para impares, con \(a_n,a_n'\) los ceros de \(\mathrm{Ai}\) y \(\mathrm{Ai}'\)).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Puntos de retorno.</b> \(V=E\Rightarrow x=\pm E\).</li>
<li><b>Acción.</b> \(\int_{-E}^{E}\sqrt{2(E-|x|)}\,\dd x=2\sqrt2\int_0^E\sqrt{E-x}\,\dd x=2\sqrt2\cdot\tfrac23E^{3/2}=\tfrac{4\sqrt2}3E^{3/2}\).</li>
<li><b>Cuantización.</b> \(\tfrac{4\sqrt2}3E^{3/2}=(n+\tfrac12)\pi\Rightarrow E_n=\left[\dfrac{3\pi(n+\frac12)}{4\sqrt2}\right]^{2/3}\).</li>
<li><b>Valores.</b> \(n=0\): \(\left(\tfrac{3\pi}{8\sqrt2}\right)^{2/3}=0.8853\); \(n=1\): \(\left(\tfrac{9\pi}{8\sqrt2}\right)^{2/3}=1.8416\); \(n=2\): \(2.5888\).</li>
<li><b>Exactos.</b> Ceros de \(\mathrm{Ai}'\): \(1.01879,\ 3.24820,\ 4.82010\Rightarrow E=0.8086,\ 2.5781,\ 3.8257\); ceros de \(\mathrm{Ai}\): \(2.33811,\ 4.08795\Rightarrow E=1.8558,\ 3.2446\). Ordenados: \(0.8086,\ 1.8558,\ 2.5781,\ 3.2446\).</li>
<li><b>Errores.</b> \(n=0\): 9.5 %; \(n=1\): 0.76 %; \(n=2\): 0.41 %.</li>
<li><b>Resultado.</b> <span class="ans">\(E_n^\text{WKB}=0.8853,\ 1.8416,\ 2.5888\) frente a \(0.8086,\ 1.8558,\ 2.5781\) (errores 9.5, 0.76, 0.41 %).</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Demuestre que la regla de Bohr–Sommerfeld da exactamente \(E_n=(n+\tfrac12)\hbar\omega\) para el oscilador armónico.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Órbita.</b> \(p^2/2m+\tfrac12m\omega^2x^2=E\): elipse con semiejes \(x_0=\sqrt{2E/m\omega^2}\) y \(p_0=\sqrt{2mE}\).</li>
<li><b>Área.</b> \(\oint p\,\dd x=\pi x_0p_0=\pi\sqrt{\tfrac{2E}{m\omega^2}\cdot2mE}=\dfrac{2\pi E}\omega\).</li>
<li><b>Cuantización.</b> \(\dfrac{2\pi E}\omega=(n+\tfrac12)\,2\pi\hbar\) (la integral de \(x_1\) a \(x_2\) es la mitad del lazo: \(\int p\,\dd x=\tfrac{\pi E}\omega=(n+\tfrac12)\pi\hbar\)).</li>
<li><b>Resultado.</b> <span class="ans">\(E_n=(n+\tfrac12)\hbar\omega\): el resultado exacto de Schrödinger. La corrección \(\tfrac12\) (Maslov) es esencial: sin ella el cero de energía sería \(0\), no \(\tfrac12\hbar\omega\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Un electrón de 1 eV incide sobre una barrera rectangular de 5 eV y 1 nm de ancho. Calcule \(\kappa\), la transmisión WKB y la exacta, y el cociente.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>\(\kappa\).</b> \(\kappa=\dfrac{\sqrt{2m(V_0-E)}}\hbar=\dfrac{\sqrt{2\times9.109\times10^{-31}\times4\times1.602\times10^{-19}}}{1.0546\times10^{-34}}=1.0246\times10^{10}\) m\(^{-1}\) \(=10.246\) nm\(^{-1}\).</li>
<li><b>WKB.</b> \(2S=2\kappa a=20.493\Rightarrow T_\text{WKB}=\ee^{-20.493}=1.259\times10^{-9}\).</li>
<li><b>Exacta.</b> \(T=\left[1+\dfrac{V_0^2\sinh^2\kappa a}{4E(V_0-E)}\right]^{-1}=3.224\times10^{-9}\).</li>
<li><b>Cociente.</b> \(T/T_\text{WKB}=\dfrac{16E(V_0-E)}{V_0^2}=\dfrac{16\times1\times4}{25}=2.56\) (el prefactor que omite WKB).</li>
<li><b>Resultado.</b> <span class="ans">\(\kappa=10.25\) nm\(^{-1}\); \(T_\text{WKB}=1.26\times10^{-9}\); \(T_\text{exacta}=3.22\times10^{-9}\); la fórmula exponencial acierta el orden de magnitud con un factor 2.56.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Un electrón sale de una punta de tungsteno (\(\Phi=4.5\) eV) bajo un campo \(F=5\) V/nm. Calcule la transmisión de la barrera triangular y la pendiente de la gráfica de Fowler–Nordheim.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Barrera.</b> \(V-E=\Phi-eFx\), con punto de retorno \(x_2=\Phi/eF\).</li>
<li><b>Acción.</b> \(S=\dfrac{\sqrt{2m}}\hbar\int_0^{\Phi/eF}\sqrt{\Phi-eFx}\,\dd x=\dfrac{2\sqrt{2m}\,\Phi^{3/2}}{3\hbar eF}\), luego \(2S=\dfrac{4\sqrt{2m}\,\Phi^{3/2}}{3\hbar eF}\).</li>
<li><b>Constante.</b> \(\dfrac{4\sqrt{2m}}{3\hbar e}=6.831\ \text{V\,eV}^{-3/2}\text{nm}^{-1}\).</li>
<li><b>Valor.</b> \(2S=6.831\times\dfrac{4.5^{3/2}}{5}=6.831\times\dfrac{9.546}{5}=13.04\); \(T=\ee^{-13.04}=2.17\times10^{-6}\).</li>
<li><b>Pendiente.</b> En \(\ln(J/F^2)\) frente a \(1/F\): \(-6.831\,\Phi^{3/2}=-65.2\) V/nm.</li>
<li><b>Resultado.</b> <span class="ans">\(2S=13.04\); \(T=2.17\times10^{-6}\); pendiente de Fowler–Nordheim \(-65.2\) V/nm (una recta con \(\Phi\) y con \(F\) en V/nm).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Calcule el exponente de Gamow y la vida media de \(^{238}\)U (\(Q=4.270\) MeV) con \(R=1.2\,(A_d^{1/3}+4^{1/3})\) fm, \(V_0=35\) MeV.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Barrera.</b> Hijo \(^{234}\)Th (\(Z_d=90\)): \(k=2Z_de^2/4\pi\varepsilon_0=2\times90\times1.43996=259.19\) MeV·fm.</li>
<li><b>Masa reducida.</b> \(\mu c^2=\dfrac{(4.0015\times931.494)(234\times931.494)}{(4.0015+234)\times931.494}=3664.7\) MeV.</li>
<li><b>Geometría.</b> \(R=1.2(234^{1/3}+4^{1/3})=1.2(6.1622+1.5874)=9.2996\) fm; \(b=k/Q=60.70\) fm; \(x=R/b=0.15320\).</li>
<li><b>Velocidad.</b> \(v/c=\sqrt{2Q/\mu c^2}=0.048274\).</li>
<li><b>Exponente.</b> \(2G=\dfrac{4k}{\hbar c\,(v/c)}\left[\arccos\sqrt x-\sqrt{x(1-x)}\right]=\dfrac{4\times259.19}{197.327\times0.048274}\left[1.16863-0.36018\right]=87.99\).</li>
<li><b>Frecuencia de asalto.</b> \(v_\text{in}=c\sqrt{2(Q+V_0)/\mu c^2}=0.14639\,c\) y \(f=v_\text{in}/2R=2.36\times10^{21}\) s\(^{-1}\).</li>
<li><b>Vida media.</b> \(t_{1/2}=\dfrac{\ln2}{f\,\ee^{-2G}}=4.81\times10^{16}\) s \(=1.52\times10^9\) años (medida \(4.47\times10^9\) años; cociente 0.34).</li>
<li><b>Resultado.</b> <span class="ans">\(2G=87.99\); \(f=2.36\times10^{21}\) s\(^{-1}\); \(t_{1/2}=4.8\times10^{16}\) s \(\approx1.5\times10^9\) años: acierta en un factor 3 una vida media de 4.5 mil millones de años.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Halle la energía de Gamow para la fusión \(pp\), el pico de Gamow en el centro del Sol (\(T=1.5\times10^7\) K), su anchura y la probabilidad de túnel en el pico.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Masa reducida.</b> \(\mu c^2=\tfrac12m_pc^2=469.14\) MeV.</li>
<li><b>Energía de Gamow.</b> \(E_G=2\mu c^2(\pi\alpha)^2=938.27\times(\pi/137.036)^2=938.27\times5.2557\times10^{-4}=0.4931\) MeV \(=493.1\) keV.</li>
<li><b>Térmica.</b> \(k_BT=8.617\times10^{-5}\times1.5\times10^7=1.2926\) keV.</li>
<li><b>Pico.</b> \(E_0=\left(\tfrac{E_G(k_BT)^2}4\right)^{1/3}=\left(\tfrac{493.1\times1.6708}4\right)^{1/3}=(205.98)^{1/3}=5.906\) keV.</li>
<li><b>Anchura.</b> \(\Delta=4\sqrt{E_0k_BT/3}=4\sqrt{5.906\times1.2926/3}=6.38\) keV.</li>
<li><b>Transmisión en el pico.</b> \(\ee^{-\sqrt{E_G/E_0}}=\ee^{-\sqrt{493.1/5.906}}=\ee^{-9.138}=1.08\times10^{-4}\).</li>
<li><b>Resultado.</b> <span class="ans">\(E_G=493.1\) keV; \(E_0=5.91\) keV (4.6 \(k_BT\)); anchura 6.4 keV; probabilidad de túnel \(1.1\times10^{-4}\) en el pico.</span></li>
</ol></details></li>
</ol>
