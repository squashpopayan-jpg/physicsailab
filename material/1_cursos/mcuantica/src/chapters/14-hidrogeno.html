<template class="chapter-src" data-id="hidrogeno" data-num="14" data-title="El átomo de hidrógeno" data-part="Parte III · Momento angular y el átomo" data-short="Solución de la ecuación radial de Coulomb por series, niveles de energía y su degeneración, funciones radiales con polinomios de Laguerre, valores esperados, orbitales, y los átomos hidrogenoides exóticos: positronio y hidrógeno muónico">
<p class="lead">El átomo de hidrógeno es el problema donde nació la teoría y es, junto con el oscilador armónico, uno de los dos que tienen solución exacta en una infinidad de estados. De él salen los niveles de la espectroscopía, la forma de los orbitales que organizan toda la química y la escala de tamaños y energías del mundo atómico. La solución completa se obtiene con la ecuación radial del capítulo 13 y el potencial de Coulomb; el resultado reproduce los niveles de Bohr y contiene más información: las funciones de onda, la degeneración y los valores esperados.</p>

<section>
<h2>El problema de dos cuerpos y las unidades atómicas</h2>
<p>El electrón y el núcleo (carga \(Ze\)) se atraen con \(V(r)=-Ze^2/4\pi\varepsilon_0r\). El movimiento del centro de masa se separa, y el movimiento relativo es el de una partícula con la <span class="term">masa reducida</span> \(\mu=m_eM/(m_e+M)\) en el potencial \(V(r)\). En <span class="term">unidades atómicas</span> (\(\hbar=m_e=e=4\pi\varepsilon_0=1\)) la longitud es el radio de Bohr \(a_0=0.529\,177\) Å y la energía es el hartree, \(E_h=27.2114\) eV \(=2Ry\). La ecuación radial para \(u=rR\) queda</p>
<div class="eq">\[-\frac{1}{2\mu}\frac{\dd^2u}{\dd r^2}+\left[-\frac Zr+\frac{l(l+1)}{2\mu r^2}\right]u=Eu.\]</div>
<p>Para \(E\lt0\) (estados ligados), con \(\kappa=\sqrt{-2\mu E}\), lejos del núcleo \(u''\approx\kappa^2u\), \(u\sim e^{-\kappa r}\); y cerca del origen \(u\sim r^{l+1}\). Se factoriza la conducta asintótica: \(u=\rho^{l+1}e^{-\rho}v(\rho)\), con \(\rho=\kappa r\) y \(\rho_0=2Z\mu/\kappa\). La ecuación para \(v\) tiene solución en serie de potencias \(v=\sum c_j\rho^j\), con la recurrencia</p>
<div class="eq">\[c_{j+1}=\frac{2(j+l+1)-\rho_0}{(j+1)(j+2l+2)}\,c_j .\]</div>
<p>Para \(j\) grande \(c_{j+1}/c_j\to2/j\), el comportamiento de \(e^{2\rho}\), de modo que \(u\sim e^{+\rho}\) divergería: la serie debe <em>terminar</em>, es decir, existe un entero \(n_r=j_\text{máx}\) con \(2(n_r+l+1)=\rho_0\). Con \(n=n_r+l+1\) (el <span class="term">número cuántico principal</span>, \(n=1,2,\dots\)) se obtienen las energías de Bohr, y \(\kappa=Z\mu/n\):</p>
<div class="eq key" data-name="Niveles del hidrógeno">\[E_n=-\frac{\mu Z^2}{2n^2}E_h=-\frac{Z^2}{n^2}\frac{\mu}{m_e}Ry,\qquad Ry=13.605\,693\ \text{eV},\qquad n=1,2,\dots;\quad l=0,1,\dots,n-1;\quad m=-l,\dots,l.\]</div>
<p>\(E_n\) depende solo de \(n\): para cada \(n\) hay \(\sum_{l=0}^{n-1}(2l+1)=n^2\) estados (sin espín; \(2n^2\) con espín). La degeneración en \(m\) es la de la simetría esférica; la degeneración en \(l\) es una propiedad especial del potencial \(1/r\), ligada a una simetría oculta (la conservación del vector de Runge–Lenz, que hace al problema invariante bajo \(\mathrm{SO}(4)\)), y se rompe en cuanto el potencial se aparta de \(1/r\), por ejemplo en los átomos con varios electrones (donde \(2s\lt2p\)) o por la estructura fina (capítulo 20).</p>
</section>

<section>
<h2>Funciones de onda y valores esperados</h2>
<p>Con \(a=a_0/Z\mu\), las funciones radiales normalizadas, \(\int_0^\infty R^2r^2\dd r=1\), son</p>
<div class="eq key" data-name="Funciones radiales de los hidrogenoides">\[R_{nl}(r)=\sqrt{\left(\frac2{na}\right)^3\frac{(n-l-1)!}{2n(n+l)!}}\ \rho^l e^{-\rho/2}L_{n-l-1}^{2l+1}(\rho),\qquad\rho=\frac{2r}{na},\qquad\psi_{nlm}=R_{nl}(r)\,Y_l^m(\theta,\phi),\]</div>
<p>con los polinomios de Laguerre asociados \(L_k^{\alpha}\). Los primeros son \(R_{10}=2a^{-3/2}e^{-r/a}\), \(R_{20}=\tfrac1{\sqrt2}a^{-3/2}\left(1-\tfrac{r}{2a}\right)e^{-r/2a}\) y \(R_{21}=\tfrac1{\sqrt{24}}a^{-3/2}\tfrac ra e^{-r/2a}\). La función \(R_{nl}\) tiene \(n-l-1\) nodos radiales (en \(r\gt0\)). La densidad de probabilidad radial es \(P(r)=r^2R^2\), con máximo en \(r=a\) para \(1s\) (el radio de Bohr, aunque la densidad por unidad de volumen sea máxima en el núcleo, \(|\psi_{1s}(0)|^2=1/\pi a^3=2.148\times10^{30}\) m⁻³). Los valores esperados exactos son</p>
<div class="eq key" data-name="Valores esperados en el hidrógeno">\[\langle r\rangle=\frac a2\left[3n^2-l(l+1)\right],\ \ \langle r^2\rangle=\frac{a^2n^2}{2}\left[5n^2+1-3l(l+1)\right],\ \ \left\langle\frac1r\right\rangle=\frac{1}{n^2a},\ \ \left\langle\frac1{r^2}\right\rangle=\frac{1}{n^3(l+\tfrac12)a^2},\ \ \langle V\rangle=2E_n,\ \ \langle T\rangle=-E_n.\]</div>
<p>El último par es el teorema del virial del capítulo 4 (\(2\langle T\rangle=-\langle V\rangle\) para \(V\propto1/r\)). El tamaño crece como \(n^2\): el orbital \(n=2\) es 4 veces mayor que el \(n=1\), y un átomo de Rydberg con \(n=100\) tiene un radio de \(10^4a_0\approx0.5\) µm. Los átomos de Rydberg y los orbitales más externos son los responsables de las propiedades químicas.</p>
<div class="sim" data-sim="radial-h" data-title="Funciones radiales del hidrógeno y de los hidrogenoides: nodos, tamaño y virial"></div>
<div class="sim-guide"><ul>
<li>\(1s\): \(\langle r\rangle=1.5\,a\) y el máximo de \(P(r)\) en \(r=a\); \(\langle V\rangle=2E=-27.197\) eV y \(\langle T\rangle=+13.598\) eV (con la masa reducida, \(E_1=-13.5983\) eV). \(2s\): un nodo en \(r=2a\), \(\langle r\rangle=6a\), y dos máximos en \((3\pm\sqrt5)a=0.76a\) y \(5.24a\); \(3s\): dos nodos en 1.90 y 7.10 \(a\), \(\langle r\rangle=13.5a\).</li>
<li>Cambie a \(2p\) (\(n=2\), \(l=1\)): sin nodos, máximo en \(4a\), \(\langle r\rangle=5a\): dentro de la capa \(n=2\) el \(2p\) está más cerca del núcleo en promedio que el \(2s\) (6 \(a\)) pero este último penetra más en el núcleo (por sus máximos interiores): es la razón de que en los átomos con muchos electrones el \(2s\) tenga menos energía que el \(2p\).</li>
<li>Sistemas hidrogenoides: He\(^+\) reduce \(a\) a la mitad y \(E\) se multiplica por 4 (\(E_1=-54.415\) eV con la masa reducida); positronio (\(\mu=\tfrac12\)) tiene \(a=105.8\) pm y \(E_1=-6.803\) eV.</li>
</ul></div>
<div class="box ex"><h4>Probabilidades en el estado fundamental</h4>
<p><strong>Procedimiento.</strong> Con \(|\psi_{1s}|^2=e^{-2r/a}/\pi a^3\), \(P(r)=4r^2e^{-2r/a}/a^3\). (1) \(P(r\lt a)=\int_0^1 4x^2e^{-2x}\dd x=1-5e^{-2}=0.3233\). (2) \(P(r\gt2a)=\int_2^\infty4x^2e^{-2x}\dd x=13e^{-4}=0.2381\): casi un cuarto del tiempo, el electrón está en la región clásicamente prohibida (\(E=-\tfrac12\) hartree, \(V=-1/r\gt E\) para \(r\gt2a\)). (3) \(\langle r\rangle=\tfrac32a=0.794\) Å. (4) \(\langle V\rangle=-1\) hartree \(=-27.21\) eV y \(\langle T\rangle=+13.61\) eV, la mitad en valor absoluto. <strong>Resultado.</strong> La penetración del electrón en la región prohibida es enorme, mucho mayor que para el oscilador (15.7 %): una consecuencia de \(E\) tan cercana a \(V\) lejos del núcleo.</p></div>
</section>

<section>
<h2>Los orbitales</h2>
<p>La función \(\psi_{nlm}\) se llama <span class="term">orbital</span>. Para \(m\neq0\) es compleja (\(e^{\ii m\phi}\)); en química se usan las combinaciones reales \(\mathrm{Re}\,\psi\), \(\mathrm{Im}\,\psi\) (\(p_x,p_y,p_z\), \(d_{z^2},d_{xz},\dots\)), que son igualmente propias del hamiltoniano por ser degeneradas. Los orbitales \(s\) son esféricos y tienen densidad no nula en el núcleo; los \(p,d,\dots\) tienen densidad nula en el núcleo (por la barrera centrífuga \(R\sim r^l\)) y planos o conos nodales. El número total de nodos (radiales más angulares) es \(n-1\). El corte por un plano permite ver los signos: lóbulos de signo opuesto separados por un nodo.</p>
<div class="sim" data-sim="orbitales-h" data-title="Orbitales del hidrógeno: corte del plano xz con la fase (signo) y la densidad"></div>
<div class="sim-guide"><ul>
<li>\(3d_{xz}\) (\(n=3\), \(l=2\), \(m=1\)): cuatro lóbulos alternando signo en el plano \(xz\), sin nodos radiales y con dos nodos angulares (los planos \(x=0\) y \(z=0\)). La probabilidad de estar a menos de \(2a_0\) es de apenas 0.047 % (el orbital \(d\) evita el núcleo), y 4.58 % más allá de \(2n^2a_0=18a_0\).</li>
<li>\(2s\): círculo nodal en \(r=2a_0\) con signo opuesto dentro y fuera; \(2p_z\): dos lóbulos de signo opuesto a lo largo de \(z\); \(1s\): una sola zona, sin nodos. Pase a «densidad» para ver \(|\psi|^2\): las fases se pierden pero se ve el tamaño.</li>
</ul></div>
</section>

<section>
<h2>Átomos hidrogenoides exóticos</h2>
<p>La fórmula de Bohr vale para cualquier sistema de dos cuerpos con interacción de Coulomb, sustituyendo \(\mu\) y \(Z\): \(E_n\propto\mu Z^2\) y \(a\propto1/\mu Z\). Con \(\mu\) se obtiene la escala. El <em>positronio</em> (\(e^-e^+\), \(\mu=\tfrac12m_e\)) tiene niveles la mitad de profundos (\(E_1=-6.803\) eV) y un tamaño doble (\(a=2a_0=105.8\) pm); su línea Lyman-\(\alpha\) está en 243.0 nm. El <em>hidrógeno muónico</em> (\(\mu^-p\), \(\mu=185.84\,m_e\)) es 186 veces más pequeño (\(a=284.7\) fm, \(E_1=-2528.5\) eV) y el muón pasa una fracción apreciable de su tiempo dentro del protón: la energía del nivel \(2s\) depende del radio del protón, y la medida del corrimiento de Lamb muónico (Pohl et al., 2010) dio un radio del protón de 0.8409 fm, 4 % menor que el medido con electrones, el «enigma del radio del protón». Los iones hidrogenoides \(\mathrm{He}^+\), \(\mathrm{Li}^{2+}\) tienen \(E_1=-54.4\) y \(-122.5\) eV y radios \(a_0/2\) y \(a_0/3\).</p>
<div class="sim" data-sim="exoticos" data-title="Sistemas hidrogenoides: energía de ionización, tamaño y líneas espectrales"></div>
<div class="sim-guide"><ul>
<li>Hidrógeno \(13.598\) eV, deuterio \(13.602\) eV, He\(^+\) 54.415, Li\(^{2+}\) 122.44, positronio 6.803, hidrógeno muónico 2528.5 eV: seis órdenes de magnitud en \(\mu Z^2\) entre extremos (la escala va de 6.8 eV a 2.5 keV). Los radios, 105.8 pm, 52.95, 26.46, 17.64 y 0.2847 pm.</li>
<li>Con \(n=3\): Hα en 656.47 nm (H) y 656.29 nm (D); en He\(^+\), 164.05 nm (ultravioleta); en positronio, 1312.2 nm (infrarrojo); y la línea \(3\to1\) del hidrógeno muónico está en 0.5516 nm (rayos X de 2.25 keV).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule la energía de ionización y el radio de Bohr del positronio, del hidrógeno muónico, de He\(^+\) y de Li\(^{2+}\) (con masa nuclear infinita para los iones).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Escalas.</b> \(E_1=-Ry\,Z^2\mu/m_e\) y \(a=a_0/(Z\mu/m_e)\), con \(Ry=13.6057\) eV y \(a_0=52.918\) pm.</li>
<li><b>Positronio.</b> \(Z=1\), \(\mu/m_e=\tfrac12\): \(E_1=-6.803\) eV; \(a=2a_0=105.8\) pm.</li>
<li><b>Hidrógeno muónico.</b> \(\mu/m_e=\dfrac{206.768\times1836.153}{206.768+1836.153}=185.84\): \(E_1=-13.6057\times185.84=-2528.5\) eV; \(a=52.918/185.84=0.2847\) pm \(=284.7\) fm.</li>
<li><b>He\(^+\) y Li\(^{2+}\).</b> \(Z=2\): \(E_1=-4Ry=-54.42\) eV, \(a=a_0/2=26.46\) pm. \(Z=3\): \(-9Ry=-122.45\) eV, \(a=a_0/3=17.64\) pm.</li>
<li><b>Resultado.</b> <span class="ans">6.803 eV y 105.8 pm; 2528.5 eV y 284.7 fm; 54.42 eV y 26.46 pm; 122.45 eV y 17.64 pm.</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Para el estado \(1s\) del hidrógeno calcule \(\langle r\rangle\), \(\langle V\rangle\), \(\langle T\rangle\), \(P(r\lt a_0)\), \(P(r\gt2a_0)\) y \(|\psi(0)|^2\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Función.</b> \(\psi=e^{-r/a_0}/\sqrt{\pi a_0^3}\), \(P(r)=4r^2e^{-2r/a_0}/a_0^3\).</li>
<li><b>\(\langle r\rangle\).</b> \(\int_0^\infty4x^3e^{-2x}\dd x\,a_0=4\cdot\tfrac{3!}{2^4}a_0=1.5\,a_0=0.794\) Å.</li>
<li><b>Energía.</b> \(\langle V\rangle=-\langle1/r\rangle=-1\) hartree \(=-27.211\) eV; \(E=-\tfrac12\) hartree, luego \(\langle T\rangle=E-\langle V\rangle=+0.5\) hartree \(=13.606\) eV.</li>
<li><b>Probabilidades.</b> \(\int_0^1 4x^2e^{-2x}\dd x=1-e^{-2}(1+2+2)=1-5e^{-2}=0.3233\). \(\int_2^\infty=e^{-4}(1+4+8)=13e^{-4}=0.2381\).</li>
<li><b>Densidad en el núcleo.</b> \(|\psi(0)|^2=1/(\pi a_0^3)=1/(\pi\times(5.2918\times10^{-11})^3)=2.148\times10^{30}\) m⁻³.</li>
<li><b>Resultado.</b> <span class="ans">1.5 \(a_0\); \(-27.21\) eV y \(+13.61\) eV; 32.33 % y 23.81 %; \(2.148\times10^{30}\) m⁻³.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Compruebe que \(R_{20}=\tfrac1{\sqrt2}a^{-3/2}(1-\tfrac r{2a})e^{-r/2a}\) está normalizada, calcule su nodo, \(\langle r\rangle\) y los máximos de \(P(r)\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Variable.</b> \(x=r/a\): \(\int R^2r^2\dd r=\tfrac12\int_0^\infty x^2(1-\tfrac x2)^2e^{-x}\dd x=\tfrac12\left[\Gamma(3)-\Gamma(4)+\tfrac14\Gamma(5)\right]=\tfrac12[2-6+6]=1\) ✓.</li>
<li><b>Nodo.</b> \(1-x/2=0\Rightarrow r=2a\) (un nodo: \(n-l-1=1\)).</li>
<li><b>\(\langle r\rangle\).</b> \(\tfrac12\int x^3(1-\tfrac x2)^2e^{-x}\dd x\,a=\tfrac a2\left[\Gamma(4)-\Gamma(5)+\tfrac14\Gamma(6)\right]=\tfrac a2[6-24+30]=6a\).</li>
<li><b>Máximos de \(P\).</b> \(P\propto x^2(1-x/2)^2e^{-x}\): \(\dd\ln P/\dd x=2/x-2/(2-x)-1=0\) \(\Rightarrow x^2-6x+4=0\), \(x=3\pm\sqrt5=0.764,\ 5.236\).</li>
<li><b>Resultado.</b> <span class="ans">Nodo en \(2a\); \(\langle r\rangle=6a\); máximos de \(P(r)\) en \(0.764a\) y \(5.236a\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Muestre cómo la condición de que la serie termine da \(E_n=-Z^2\mu/2n^2\), y obtenga \(R_{10}\) con \(l=0\), \(n_r=0\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Ansatz.</b> \(u=\rho^{l+1}e^{-\rho}v(\rho)\), con \(\rho=\kappa r\), \(\kappa=\sqrt{-2\mu E}\), \(\rho_0=2Z\mu/\kappa\); la ecuación para \(v\): \(\rho v''+2(l+1-\rho)v'+[\rho_0-2(l+1)]v=0\).</li>
<li><b>Serie.</b> \(v=\sum c_j\rho^j\): \(c_{j+1}=\dfrac{2(j+l+1)-\rho_0}{(j+1)(j+2l+2)}c_j\).</li>
<li><b>Terminación.</b> Para que \(v\) sea un polinomio de grado \(n_r\): \(c_{n_r+1}=0\Rightarrow\rho_0=2(n_r+l+1)=2n\). Entonces \(\kappa=Z\mu/n\) y \(E=-\kappa^2/2\mu=-Z^2\mu/(2n^2)\).</li>
<li><b>\(1s\).</b> \(n=1\), \(l=0\), \(n_r=0\): \(v=c_0\), \(u=c_0\kappa re^{-\kappa r}\), \(R=u/r=c_0\kappa e^{-\kappa r}\) con \(\kappa=Z\mu=1/a\). Normalización: \(1=c_0^2\kappa^2\int r^2e^{-2\kappa r}\dd r=c_0^2\kappa^2\cdot\tfrac{2}{8\kappa^3}=\tfrac{c_0^2}{4\kappa}\Rightarrow c_0\kappa=2\kappa^{3/2}\).</li>
<li><b>Resultado.</b> <span class="ans">\(E_n=-Z^2\mu/2n^2\); \(R_{10}=2a^{-3/2}e^{-r/a}\).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Para el orbital \(2p\) calcule \(\langle r\rangle\), \(\langle r^2\rangle\), \(\Delta r\), \(\langle1/r\rangle\) y \(\langle1/r^2\rangle\), con las fórmulas generales y por integración.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Fórmulas con \(n=2\), \(l=1\).</b> \(\langle r\rangle=\tfrac a2[12-2]=5a\). \(\langle r^2\rangle=\tfrac{a^2\cdot4}{2}[20+1-6]=30a^2\). \(\langle1/r\rangle=1/(4a)\). \(\langle1/r^2\rangle=1/(8\times1.5\,a^2)=1/(12a^2)\).</li>
<li><b>Integración.</b> \(R_{21}^2r^2=\tfrac1{24a^3}\tfrac{r^4}{a^2}e^{-r/a}\): \(\langle r^k\rangle=\tfrac{a^k}{24}\Gamma(k+5)\). Para \(k=1\): \(\Gamma(6)/24=5\); \(k=2\): \(\Gamma(7)/24=30\); \(k=-1\): \(\Gamma(4)/24=\tfrac14\); \(k=-2\): \(\Gamma(3)/24=\tfrac1{12}\) ✓.</li>
<li><b>Dispersión.</b> \(\Delta r=\sqrt{\langle r^2\rangle-\langle r\rangle^2}=\sqrt{30-25}\,a=2.236\,a\): relativa \(0.447\).</li>
<li><b>Virial.</b> \(\langle V\rangle=-\langle1/r\rangle=-\tfrac14\) hartree \(=2E_2\) ✓ (\(E_2=-\tfrac18\)).</li>
<li><b>Resultado.</b> <span class="ans">\(\langle r\rangle=5a\), \(\langle r^2\rangle=30a^2\), \(\Delta r=\sqrt5\,a\), \(\langle1/r\rangle=1/4a\), \(\langle1/r^2\rangle=1/12a^2\).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Cuente la degeneración de las capas \(n=1,\dots,4\) del hidrógeno (con y sin espín) y el número de estados con \(n\le n_\text{máx}\). Compare con la tabla periódica.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Por \(l\).</b> Para cada \(n\), \(l=0,\dots,n-1\) con \(2l+1\) valores de \(m\): \(g_n=\sum_{l=0}^{n-1}(2l+1)=n^2\).</li>
<li><b>Valores.</b> \(n=1\): 1; \(n=2\): \(1+3=4\); \(n=3\): \(1+3+5=9\); \(n=4\): \(1+3+5+7=16\). Con espín: 2, 8, 18, 32.</li>
<li><b>Acumulado.</b> \(\sum_{n=1}^{n_\text{máx}}n^2=\tfrac16n_\text{máx}(n_\text{máx}+1)(2n_\text{máx}+1)\): 1, 5, 14, 30 (sin espín); 2, 10, 28, 60 (con espín).</li>
<li><b>Comparación.</b> La tabla periódica tiene períodos de 2, 8, 8, 18, 18, 32, 32: no coinciden con 2, 8, 18, 32, pues en átomos con muchos electrones la energía depende de \(l\) y se llena \(4s\) antes que \(3d\) (capítulo 28); el hidrógeno solo da la estructura de las capas.</li>
<li><b>Resultado.</b> <span class="ans">\(g_n=n^2\) (\(2n^2\) con espín): 2, 8, 18, 32; acumulado con espín 2, 10, 28, 60.</span></li>
</ol></details></li>
</ol>
