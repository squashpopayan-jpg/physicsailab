<template class="chapter-src" data-id="crisis" data-num="1" data-title="Del cuerpo negro al átomo de Bohr" data-part="Parte I · Los orígenes y la función de onda" data-short="El cuerpo negro y el cuanto de Planck, el efecto fotoeléctrico, el efecto Compton, el átomo de Bohr y las ondas de materia de de Broglie: los experimentos que obligaron a abandonar la física clásica">
<p class="lead">Hacia 1900 la física parecía casi completa: la mecánica de Newton, la termodinámica y el electromagnetismo de Maxwell explicaban lo que se había medido. Quedaban unas nubes en el horizonte, y de ellas salió la mecánica cuántica. Este capítulo recorre cinco experimentos, en el orden en que se hicieron, y en cada uno muestra exactamente dónde falla la teoría clásica y qué hay que añadir: la radiación del cuerpo negro, el efecto fotoeléctrico, la dispersión de rayos X por electrones, los espectros atómicos y la difracción de electrones. Cada resultado se deduce con todos los pasos y se comprueba con números.</p>

<section>
<h2>La radiación del cuerpo negro</h2>
<p>Un horno cerrado con un pequeño orificio es un <span class="term">cuerpo negro</span>: la radiación que sale por el agujero está en equilibrio térmico con las paredes y su espectro depende solo de la temperatura \(T\), no del material. Tres hechos experimentales eran firmes en 1900: la potencia emitida por unidad de área crece como \(T^4\) (Stefan, 1879; Boltzmann, 1884), el máximo del espectro se desplaza como \(\lambda_\text{máx}T=\text{cte}\) (Wien, 1893) y la forma de la curva había sido medida con precisión en el infrarrojo por Lummer, Pringsheim, Rubens y Kurlbaum.</p>
<h3>El cálculo clásico y su fracaso</h3>
<p>La radiación en una cavidad de volumen \(V\) se descompone en ondas estacionarias (modos). Contar los modos con frecuencia entre \(\nu\) y \(\nu+\dd\nu\), con dos polarizaciones, da \(8\pi\nu^2V\,\dd\nu/c^3\). La física estadística clásica asigna a cada modo, por equipartición, una energía media \(k_BT\) (\(\tfrac12k_BT\) por cada término cuadrático de la energía, con dos: el eléctrico y el magnético). La densidad de energía por unidad de frecuencia sería</p>
<div class="eq key" data-name="Rayleigh–Jeans (1900–1905)">\[u(\nu,T)=\frac{8\pi\nu^2}{c^3}\,k_BT.\]</div>
<p>Esto concuerda con el experimento a frecuencias bajas, pero crece sin límite como \(\nu^2\): la energía total \(\int_0^\infty u\,\dd\nu\) diverge. Ehrenfest llamó a esto, en 1911, la <span class="term">catástrofe ultravioleta</span>: la teoría clásica predice que un horno emite una potencia infinita, sobre todo en el ultravioleta, y el experimento muestra una curva que sube, alcanza un máximo y cae.</p>
<h3>La hipótesis de Planck</h3>
<p>El 14 de diciembre de 1900 Planck presentó una fórmula que ajustaba todos los datos y la justificó con una hipótesis que él mismo consideraba un recurso de cálculo: los osciladores de las paredes de frecuencia \(\nu\) solo pueden intercambiar energía en múltiplos enteros de \(h\nu\). Si la energía de un modo es \(E_n=nh\nu\) con \(n=0,1,2,\dots\), la probabilidad de \(n\) es proporcional a \(e^{-nh\nu/k_BT}\) y la energía media es</p>
<div class="eq">\[\langle E\rangle=\frac{\sum_{n}nh\nu\,e^{-nh\nu/k_BT}}{\sum_{n}e^{-nh\nu/k_BT}}=\frac{h\nu}{e^{h\nu/k_BT}-1}.\]</div>
<p>Con la serie geométrica \(\sum_n q^n=1/(1-q)\), \(q=e^{-h\nu/k_BT}\), y \(\sum_nnq^n=q/(1-q)^2\). Para \(h\nu\ll k_BT\), \(\langle E\rangle\to k_BT\) (recupera la equipartición); para \(h\nu\gg k_BT\), \(\langle E\rangle\to h\nu\,e^{-h\nu/k_BT}\to0\): los modos de alta frecuencia están «congelados» porque cuesta un cuanto entero excitarlos. Multiplicando por la densidad de modos:</p>
<div class="eq key" data-name="Ley de Planck">\[u(\nu,T)=\frac{8\pi h\nu^3}{c^3}\frac{1}{e^{h\nu/k_BT}-1},\qquad B_\lambda(T)=\frac{2hc^2}{\lambda^5}\frac{1}{e^{hc/\lambda k_BT}-1}.\]</div>
<p>\(B_\lambda\) es la radiancia (potencia por unidad de área, de ángulo sólido y de longitud de onda); la emitancia hemisférica es \(M_\lambda=\pi B_\lambda\). Dos consecuencias se deducen de forma exacta. Derivando respecto a \(\lambda\) y escribiendo \(x=hc/\lambda k_BT\), el máximo cumple \(x=5(1-e^{-x})\), cuya raíz es \(x=4.965\,114\) (se resuelve por iteración): la <span class="term">ley de desplazamiento de Wien</span> es \(\lambda_\text{máx}T=hc/(4.965\,114\,k_B)=b=2.897\,772\times10^{-3}\) m·K. Integrando sobre todas las longitudes de onda y usando \(\int_0^\infty x^3/(e^x-1)\,\dd x=\pi^4/15\) se obtiene la <span class="term">ley de Stefan–Boltzmann</span> \(M=\sigma T^4\) con \(\sigma=2\pi^5k_B^4/(15h^3c^2)=5.670\,374\times10^{-8}\) W m⁻² K⁻⁴. Es notable: una constante que se medía en el laboratorio térmico queda expresada por \(k_B\), \(h\) y \(c\).</p>
<div class="box ex"><h4>El Sol, el cuerpo humano y el fondo cósmico</h4>
<p><strong>Datos.</strong> \(T_\odot=5772\) K, \(T_\text{piel}=310\) K, \(T_\text{CMB}=2.725\) K, \(b=2.8978\times10^{-3}\) m·K, \(\sigma=5.6704\times10^{-8}\) W m⁻² K⁻⁴. <strong>Procedimiento.</strong> (1) Longitud de onda del máximo: \(\lambda_\text{máx}=b/T\). Sol: \(502.0\) nm (verde-azul; la energía del fotón en ese máximo es \(hc/\lambda=2.470\) eV). Cuerpo humano: \(9.348\) µm, infrarrojo medio, razón por la que las cámaras térmicas trabajan en 8–14 µm. CMB: \(1.063\) mm, microondas. (2) Emitancia: \(M=\sigma T^4\). Sol: \(6.294\times10^7\) W/m²; piel: \(523.7\) W/m². (3) Con el radio solar \(6.957\times10^8\) m, la potencia es \(4\pi R^2M=3.83\times10^{26}\) W, la luminosidad del Sol medida. <strong>Observación.</strong> Solo el 46.5 % de la emisión solar cae entre 380 y 780 nm; el 53.5 % restante es infrarrojo y ultravioleta.</p></div>
<div class="sim" data-sim="planck" data-title="Espectro de Planck, ley de Wien y catástrofe ultravioleta"></div>
<div class="sim-guide"><ul>
<li>Con \(T=5772\) K el máximo está en 502 nm y el 46.5 % de la potencia es luz visible. Active los ejes logarítmicos: a 400 nm la fórmula clásica supera a la de Planck en un factor 81 (la «catástrofe»), mientras que a 4 µm el cociente es solo 1.39 y las dos curvas casi se confunden.</li>
<li>Baje la temperatura a 2000 K (un filamento incandescente): el máximo pasa a 1.45 µm, y solo el 1.7 % de la potencia es visible; por eso una bombilla incandescente es ineficaz. A 310 K la fracción visible es de \(5\times10^{-22}\): ningún cuerpo a temperatura ambiente brilla.</li>
<li>La curva de Wien (línea de puntos) coincide con Planck en el lado de longitudes de onda cortas y se separa en el infrarrojo; la de Rayleigh–Jeans, al revés. Planck interpola entre las dos.</li>
</ul></div>
</section>

<section>
<h2>El efecto fotoeléctrico</h2>
<p>Cuando la luz incide sobre un metal, este emite electrones. Hertz (1887) lo observó, y J. J. Thomson y Lenard (1899–1902) midieron lo esencial. La teoría ondulatoria clásica, en la que la energía de la onda se reparte de manera continua sobre la superficie, predecía lo contrario de lo que se veía:</p>
<div class="tablewrap"><table>
<tr><th>Observación</th><th>Predicción clásica</th></tr>
<tr><td>Hay una frecuencia umbral \(\nu_0\) por debajo de la cual no se emiten electrones, por intensa que sea la luz</td><td>Con suficiente intensidad toda frecuencia debería arrancar electrones</td></tr>
<tr><td>La energía cinética máxima crece linealmente con \(\nu\) y no depende de la intensidad</td><td>Más intensidad = más energía por electrón</td></tr>
<tr><td>La emisión es instantánea (\(\lt10^{-9}\) s), incluso con luz muy tenue</td><td>El electrón necesitaría un tiempo para acumular energía</td></tr>
<tr><td>El número de electrones es proporcional a la intensidad</td><td>(Se explica)</td></tr>
</table></div>
<p>En 1905 Einstein propuso que la propia luz está formada por cuantos de energía \(h\nu\) (hoy, fotones), y que cada fotón cede toda su energía a un solo electrón. Con la <span class="term">función de trabajo</span> \(\varphi\) (la energía mínima para arrancar un electrón del metal):</p>
<div class="eq key" data-name="Ecuación fotoeléctrica de Einstein">\[K_\text{máx}=h\nu-\varphi,\qquad eV_0=K_\text{máx},\qquad \nu_0=\frac{\varphi}{h},\quad \lambda_0=\frac{hc}{\varphi}.\]</div>
<p>\(V_0\) es el <span class="term">potencial de frenado</span>: el voltaje que detiene hasta a los electrones más rápidos. Las tres primeras observaciones se siguen de inmediato: la energía de un fotón no depende de la intensidad, el fotón actúa sobre un solo electrón en un acto, y si \(h\nu\lt\varphi\) no hay forma de acumular la diferencia. Einstein predijo una recta de pendiente universal \(h\) (en voltios, \(h/e\)); Millikan, que esperaba refutarla, la midió en 1914–1916 con sodio y litio y obtuvo \(h\) con una precisión del orden del 1 %. Einstein recibió el Nobel de 1921 por esta explicación, y no por la relatividad.</p>
<div class="box ex"><h4>Cesio iluminado con luz verde-azulada</h4>
<p><strong>Datos.</strong> Cs, \(\varphi=2.14\) eV (Michaelson, 1977); \(\lambda=500\) nm; \(hc=1239.84\) eV·nm. <strong>Procedimiento.</strong> (1) Energía del fotón: \(E=hc/\lambda=1239.84/500=2.480\) eV. (2) Como \(E\gt\varphi\), hay emisión: \(K_\text{máx}=2.480-2.14=0.340\) eV, es decir, \(V_0=0.340\) V. (3) Velocidad máxima, no relativista: \(v=\sqrt{2K/m_e}=\sqrt{2\times0.3397\times1.6022\times10^{-19}/9.109\times10^{-31}}=3.46\times10^5\) m/s. (4) Umbral: \(\lambda_0=1239.84/2.14=579.4\) nm; la luz amarilla de 589 nm ya no basta. <strong>Resultado.</strong> \(K_\text{máx}=0.340\) eV, \(\lambda_0=579\) nm.</p></div>
<div class="sim" data-sim="fotoelectrico" data-title="Efecto fotoeléctrico: recta de Millikan y curvas corriente–voltaje"></div>
<div class="sim-guide"><ul>
<li>Sodio (\(\varphi=2.75\) eV) con 300 nm: fotón de 4.133 eV, \(K_\text{máx}=1.383\) eV, \(V_0=1.383\) V, umbral en 450.9 nm (\(6.65\times10^{14}\) Hz). Duplique la intensidad: la corriente de saturación se duplica, \(V_0\) no cambia.</li>
<li>Suba λ a 500 nm: no hay fotoelectrones aunque la intensidad llegue al máximo. Con cesio (\(\varphi=2.14\) eV) y 500 nm, sí (0.340 eV): la misma luz produce o no el efecto según el metal.</li>
<li>La pendiente de la recta de la izquierda es \(h/e=4.1357\times10^{-15}\) V·s para cualquier metal; solo cambia la ordenada en el origen, \(-\varphi\). La forma lineal de la corriente frente a \(V\) en la derecha es una idealización (se supone una distribución uniforme de energías); lo medido es el voltaje donde la corriente se anula.</li>
</ul></div>
</section>

<section>
<h2>El efecto Compton</h2>
<p>En 1923 A. H. Compton hizo incidir rayos X de molibdeno (\(\lambda=71.07\) pm) sobre grafito y midió la radiación dispersada a distintos ángulos. Además de la línea original aparecía otra, con mayor longitud de onda, cuyo desplazamiento dependía solo del ángulo: la teoría ondulatoria (dispersión de Thomson) exige que la onda dispersada tenga la misma frecuencia que la incidente. Si el fotón tiene energía \(E=hc/\lambda\) y momento \(p=h/\lambda\), y choca con un electrón en reposo como una bola de billar, la conservación basta.</p>
<h3>Deducción</h3>
<p>Sea \(\theta\) el ángulo de dispersión del fotón (de longitud de onda \(\lambda'\)) y \(\mathbf p_e\) el momento del electrón tras el choque. La conservación del momento da \(\mathbf p_e=\mathbf p-\mathbf p'\), de modo que \(p_e^2=p^2+p'^2-2pp'\cos\theta\). La conservación de la energía relativista da \(pc+m_ec^2=p'c+E_e\), con \(E_e^2=p_e^2c^2+m_e^2c^4\). Despejando \(E_e=(p-p')c+m_ec^2\), elevando al cuadrado y comparando con la relación anterior:</p>
<div class="eq">\[(p-p')^2c^2+2(p-p')m_ec^3+m_e^2c^4=p^2c^2+p'^2c^2-2pp'c^2\cos\theta+m_e^2c^4\ \Rightarrow\ (p-p')m_ec=pp'(1-\cos\theta).\]</div>
<p>Dividiendo por \(pp'm_ec\) y recordando que \(1/p=\lambda/h\):</p>
<div class="eq key" data-name="Desplazamiento Compton">\[\lambda'-\lambda=\frac{h}{m_ec}(1-\cos\theta)=\lambda_C(1-\cos\theta),\qquad \lambda_C=\frac{h}{m_ec}=2.426\,310\ \text{pm}.\]</div>
<p>El desplazamiento no depende de \(\lambda\): vale 0 hacia delante, \(\lambda_C\) a 90° y \(2\lambda_C\) en la retrodispersión. Por eso es apreciable solo con rayos X o gamma: para luz visible (500 nm) el cambio relativo es \(10^{-5}\) y se pierde. La energía cinética del electrón es \(K=hc(1/\lambda-1/\lambda')\) y su ángulo de retroceso \(\varphi\) cumple \(\cot\varphi=(1+h\nu/m_ec^2)\tan(\theta/2)\). El efecto Compton convenció a los escépticos de que el fotón tiene momento.</p>
<div class="box ex"><h4>El experimento original, a 90°</h4>
<p><strong>Datos.</strong> \(\lambda=71.07\) pm (\(E=17.445\) keV), \(\theta=90^\circ\). <strong>Procedimiento.</strong> (1) \(\Delta\lambda=\lambda_C(1-\cos90^\circ)=2.4263\) pm. (2) \(\lambda'=71.07+2.4263=73.496\) pm. (3) Energía del electrón: \(K=hc(1/\lambda-1/\lambda')=1239.84\ \text{eV·nm}\,(1/0.07107-1/0.073496)\ \text{nm}^{-1}=575.9\) eV, el 3.30 % de la energía del fotón. (4) Retroceso: \(\cot\varphi=(1+17.445/511.0)\tan45^\circ=1.0341\Rightarrow\varphi=44.04^\circ\). <strong>Comprobación.</strong> El momento transversal se compensa: \(p'\sin\theta=p_e\sin\varphi\) (se verifica en el problema 3).</p></div>
<div class="sim" data-sim="compton" data-title="Dispersión Compton: desplazamiento, retroceso y energía transferida"></div>
<div class="sim-guide"><ul>
<li>Con 17.44 keV y 90°: \(\Delta\lambda=2.4263\) pm, \(\lambda'=73.496\) pm, \(K=575.9\) eV y retroceso de 44.04°. En la retrodispersión (180°) \(\Delta\lambda=4.8526\) pm y el electrón recibe 1.115 keV (6.4 % de la energía).</li>
<li>Suba la energía a 1 MeV (rayos gamma) y 180°: \(\Delta\lambda/\lambda=3.91\) (\(\lambda'=4.91\lambda\)) y el electrón se lleva 796 keV, el 79.6 %. Entre unos 30 keV y 30 MeV el efecto Compton es el mecanismo dominante de atenuación de la radiación en el tejido blando.</li>
<li>Baje a 1 keV (\(\lambda=1.24\) nm, el mínimo del control): el cambio relativo máximo es de 0.39 %. Para luz visible sería de \(10^{-5}\): por eso la dispersión de luz visible parece «elástica».</li>
</ul></div>
</section>

<section>
<h2>Espectros atómicos y el átomo de Bohr</h2>
<p>Los gases excitados emiten luz solo en líneas discretas. En 1885 Balmer encontró que las del hidrógeno visible obedecen a una regla numérica simple, que Rydberg generalizó en 1888:</p>
<div class="eq key" data-name="Fórmula de Rydberg">\[\frac1\lambda=R\left(\frac1{n_f^2}-\frac1{n_i^2}\right),\qquad n_i\gt n_f,\quad R_\infty=1.097\,373\times10^{7}\ \text{m}^{-1}.\]</div>
<p>\(n_f=1\) es la serie de Lyman (ultravioleta), 2 la de Balmer (visible), 3 la de Paschen y 4 la de Brackett (infrarrojo). Un modelo planetario del átomo (Rutherford, 1911) no puede explicar esto: un electrón en órbita está acelerado y, según Maxwell, irradiaría y caería al núcleo en unos \(10^{-11}\) s; además emitiría un espectro continuo. Bohr (1913) renunció a la electrodinámica clásica dentro del átomo con dos postulados: (i) existen órbitas circulares estacionarias, en las que el electrón no irradia, con momento angular cuantizado \(L=mvr=n\hbar\); (ii) la luz se emite o absorbe al saltar entre estados, con \(h\nu=E_i-E_f\).</p>
<h3>Los niveles de Bohr</h3>
<p>Para un electrón de masa \(m\) y carga \(-e\) en torno a un núcleo de carga \(Ze\), la segunda ley de Newton con la fuerza de Coulomb da \(mv^2/r=Ze^2/(4\pi\varepsilon_0r^2)\). Con \(mvr=n\hbar\), se despeja \(v=n\hbar/mr\) y se sustituye:</p>
<div class="eq">\[\frac{m\,n^2\hbar^2}{m^2r^3}=\frac{Ze^2}{4\pi\varepsilon_0r^2}\ \Rightarrow\ r_n=\frac{n^2}{Z}a_0,\quad a_0=\frac{4\pi\varepsilon_0\hbar^2}{me^2}=0.529\,177\ \text{Å},\quad v_n=\frac{Z\alpha c}{n},\]</div>
<p>donde \(\alpha=e^2/(4\pi\varepsilon_0\hbar c)\approx1/137.036\) es la constante de estructura fina. La energía total es \(E=\tfrac12mv^2-Ze^2/(4\pi\varepsilon_0r)=-\tfrac12mv^2\) (teorema del virial para una fuerza \(1/r^2\)):</p>
<div class="eq key" data-name="Niveles de energía de Bohr">\[E_n=-\frac{Z^2}{n^2}\,\frac12m(\alpha c)^2=-\frac{Z^2}{n^2}\,Ry,\qquad Ry=13.605\,693\ \text{eV},\qquad \frac1\lambda=\frac{E_i-E_f}{hc}=Z^2R\left(\frac1{n_f^2}-\frac1{n_i^2}\right).\]</div>
<p>Con \(R=m e^4/(8\varepsilon_0^2h^3c)\) la fórmula de Rydberg queda deducida, sin parámetros libres. Como el núcleo no es infinitamente pesado, la masa \(m\) debe ser la <span class="term">masa reducida</span> \(\mu=m_eM/(m_e+M)\): \(R_M=R_\infty\mu/m_e\). Para el hidrógeno \(R_H=10\,967\,758\) m⁻¹, el 0.9995 de \(R_\infty\). La corrección permitió a Urey en 1932 descubrir el deuterio: su Hα está 0.179 nm por debajo de la del hidrógeno.</p>
<div class="box ex"><h4>Las líneas Hα, Hβ y el límite de Balmer</h4>
<p><strong>Datos.</strong> Hidrógeno con masa reducida, \(R_H=1.0967758\times10^7\) m⁻¹. <strong>Procedimiento.</strong> (1) Hα (\(3\to2\)): \(1/\lambda=R_H(1/4-1/9)=R_H\cdot5/36=1\,523\,300\) m⁻¹ \(\Rightarrow\lambda=656.47\) nm (rojo); energía \(1.8887\) eV. (2) Hβ (\(4\to2\)): \(1/\lambda=R_H\cdot3/16\Rightarrow\lambda=486.27\) nm. (3) Límite de la serie (\(n_i\to\infty\)): \(1/\lambda=R_H/4\Rightarrow\lambda=364.71\) nm. (4) Primera línea de Lyman (\(2\to1\)): \(121.57\) nm, 10.20 eV. <strong>Resultado.</strong> Estas son longitudes en el vacío; en aire (índice 1.000277) Hα mide 656.29 nm, y el valor tabulado, 656.28 nm, difiere en unos 0.01 nm por la estructura fina (capítulo 20).</p></div>
<div class="sim" data-sim="bohr" data-title="Niveles de Bohr, series espectrales e isótopos"></div>
<div class="sim-guide"><ul>
<li>Hidrógeno, Balmer, \(n_i=3\): 656.47 nm; las cuatro líneas visibles (Hα, Hβ, Hγ, Hδ) aparecen entre 656 y 410 nm. Las demás series quedan fuera del visible: Lyman (91–122 nm) en el ultravioleta lejano, y Paschen (0.82–1.88 µm) y Brackett (1.46–4.05 µm) en el infrarrojo.</li>
<li>Cambie a deuterio: la línea de Balmer se mueve a 656.29 nm. Con He⁺ (\(Z=2\)) y \(n_f=3\), \(n_i=4\) se obtiene 468.72 nm, la línea azul de Pickering que en 1896 se atribuyó al hidrógeno y que Bohr explicó como He⁺; la energía de ionización del He⁺ es \(4Ry=54.42\) eV.</li>
<li>Sin embargo, el modelo falla para átomos con más de un electrón, no da las intensidades de las líneas ni su estructura fina, y viola la incertidumbre (supone una trayectoria definida). Es un puente histórico, no una teoría: el capítulo 14 lo reemplaza con la ecuación de Schrödinger, que da los mismos niveles \(E_n\) y mucho más.</li>
</ul></div>
</section>

<section>
<h2>Las ondas de materia</h2>
<p>En 1924 Louis de Broglie, en su tesis, razonó por simetría: si la luz, que es una onda, tiene propiedades de partícula (\(E=h\nu\), \(p=h/\lambda\)), la materia, formada por partículas, debe tener propiedades de onda con</p>
<div class="eq key" data-name="Relación de de Broglie">\[\lambda=\frac hp,\qquad \nu=\frac Eh;\qquad \lambda=\frac{hc}{\sqrt{K(K+2mc^2)}}\ \xrightarrow{K\ll mc^2}\ \frac{h}{\sqrt{2mK}}.\]</div>
<p>Para un electrón acelerado por \(V\) voltios, \(\lambda\approx1.2264\ \text{nm}/\sqrt V\), con una corrección relativista que a 100 kV ya es del 5 %. Con \(L=mvr=n\hbar\) de Bohr, la condición de que una onda estacionaria cierre sobre la órbita, \(2\pi r=n\lambda=nh/p\), es exactamente la cuantización del momento angular: los niveles estables corresponden a ondas que se cierran sobre sí mismas.</p>
<p>La confirmación fue accidental. En 1927 Davisson y Germer, en los Bell Labs, enviaron electrones de 54 V contra un cristal de níquel y observaron un máximo agudo de intensidad dispersada a 50° del haz incidente. La condición de interferencia de una fila de átomos separados \(d=0.215\) nm es \(d\sin\varphi=n\lambda\); con \(\lambda=0.1669\) nm (de Broglie) se obtiene \(\varphi=50.9^\circ\), frente a los 50° medidos. Independientemente, G. P. Thomson obtuvo anillos de difracción de electrones a través de películas finas (ambos compartieron el Nobel de 1937). Después se difractaron neutrones, átomos de helio, moléculas de H₂ y, en 1999, moléculas de C₆₀ (Arndt, Zeilinger y colaboradores) con \(\lambda=4.7\) pm para 117 m/s.</p>
<div class="box warn"><h4>Qué ondea y qué no</h4><p>La onda de de Broglie no es una vibración de un medio ni la «forma» del electrón. Cada electrón llega a la pantalla como un punto; la onda determina dónde es probable que llegue, y el patrón de franjas aparece solo al acumular muchos impactos (Tonomura, 1989; Jönsson, 1961, con rendijas). Esta interpretación estadística se formula en el capítulo 2.</p></div>
<div class="sim" data-sim="broglie" data-title="Longitud de onda de de Broglie y difracción de electrones por un cristal"></div>
<div class="sim-guide"><ul>
<li>Con \(V=54\) V y \(d=0.215\) nm: \(\lambda=0.16689\) nm y el primer máximo cae en \(\varphi=50.9^\circ\), cerca del valor del experimento. Suba a 100 V: \(\lambda=0.1226\) nm y el máximo se desplaza a 34.8°. A partir de unos 130 V (\(\lambda\le d/2\)) aparece también el segundo orden.</li>
<li>A igual energía cinética de 54 eV, el neutrón tiene 3.89 pm y el átomo de helio 1.95 pm: las masas más grandes dan longitudes de onda más cortas, y por ello difractan solo con redes muy finas. Un balón de béisbol (0.145 kg, 40 m/s) tiene \(\lambda=1.1\times10^{-34}\) m, 19 órdenes de magnitud menor que un núcleo: la naturaleza ondulatoria del mundo macroscópico es indetectable.</li>
<li>Los neutrones térmicos (300 K, \(K=\tfrac32k_BT\)) tienen \(\lambda=0.145\) nm, comparable a los espaciados atómicos: de ahí la utilidad de la difracción de neutrones en el estudio de cristales.</li>
</ul></div>
</section>

<section>
<h2>Qué queda después de estos experimentos</h2>
<p>La luz se comporta como onda (interferencia) y como partícula (fotoeléctrico, Compton); los electrones, que se medían como partículas, producen difracción. Ninguna de las dos imágenes sola basta, y la «dualidad onda–corpúsculo» no es una contradicción sino la señal de que hace falta un objeto nuevo, la <span class="term">función de onda</span>, cuyo módulo cuadrado da probabilidades. El programa de los capítulos siguientes es: encontrar la ecuación que gobierna esa onda (Schrödinger, 1926), fijar su significado (Born, 1926) y sus límites (Heisenberg, 1927), y aprender a resolverla en los problemas que dieron origen a todo esto: el átomo, la molécula, el sólido y la luz.</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>El espectro de una estrella tiene su máximo en 450 nm. Calcule su temperatura superficial, su emitancia y compárela con la del Sol (5772 K).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Planteamiento.</b> Wien: \(\lambda_\text{máx}T=b\); Stefan–Boltzmann: \(M=\sigma T^4\). <span class="given">Datos: \(b=2.8978\times10^{-3}\) m·K, \(\sigma=5.6704\times10^{-8}\) W m⁻² K⁻⁴.</span></li>
<li><b>Temperatura.</b> \(T=b/\lambda_\text{máx}=2.8978\times10^{-3}/(450\times10^{-9})=6439.5\) K.</li>
<li><b>Emitancia.</b> \(T^4=(6439.5)^4=1.7195\times10^{15}\) K⁴; \(M=5.6704\times10^{-8}\times1.7195\times10^{15}=9.750\times10^{7}\) W/m².</li>
<li><b>Comparación.</b> \(M/M_\odot=(T/T_\odot)^4=(6439.5/5772)^4=1.549\): emite 55 % más por unidad de área, con solo un 11.6 % más de temperatura.</li>
<li><b>Resultado.</b> <span class="ans">\(T=6439\) K, \(M=9.75\times10^7\) W/m², 1.55 veces la solar.</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Se ilumina sodio (\(\varphi=2.75\) eV) con luz de 300 nm. Halle la energía del fotón, \(K_\text{máx}\), el potencial de frenado, la velocidad máxima de los electrones y la longitud de onda umbral.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Fotón.</b> \(E=hc/\lambda=1239.84/300=4.1328\) eV.</li>
<li><b>Energía cinética.</b> \(K_\text{máx}=E-\varphi=4.1328-2.75=1.3828\) eV \(=2.2155\times10^{-19}\) J. Potencial de frenado: \(V_0=K_\text{máx}/e=1.383\) V.</li>
<li><b>Velocidad.</b> \(v=\sqrt{2K/m_e}=\sqrt{2\times2.2155\times10^{-19}/9.1094\times10^{-31}}=6.97\times10^{5}\) m/s (es el 0.23 % de \(c\): el tratamiento no relativista es correcto).</li>
<li><b>Umbral.</b> \(\lambda_0=hc/\varphi=1239.84/2.75=450.85\) nm (\(\nu_0=6.649\times10^{14}\) Hz).</li>
<li><b>Resultado.</b> <span class="ans">\(E=4.133\) eV, \(K_\text{máx}=1.383\) eV, \(V_0=1.383\) V, \(v=6.97\times10^5\) m/s, \(\lambda_0=450.9\) nm.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Rayos X de 71.07 pm se dispersan 90° por un electrón libre. Calcule \(\Delta\lambda\), \(\lambda'\), la energía cinética y el ángulo de retroceso del electrón, y compruebe la conservación del momento transversal.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Desplazamiento.</b> \(\Delta\lambda=\lambda_C(1-\cos90^\circ)=2.4263\) pm y \(\lambda'=73.4963\) pm.</li>
<li><b>Energías.</b> \(E=1239.84/0.07107=17445.4\) eV; \(E'=1239.84/0.0734963=16869.4\) eV. \(K=E-E'=575.9\) eV (fracción \(3.30\) %).</li>
<li><b>Retroceso.</b> \(\cot\varphi=(1+E/m_ec^2)\tan(\theta/2)=(1+17445.4/510\,999)\cdot1=1.03414\Rightarrow\varphi=44.04^\circ\).</li>
<li><b>Comprobación del momento.</b> \(p=E/c=17.445\) keV/\(c\), \(p'=16.8695\) keV/\(c\). Componente a lo largo de la incidencia: \(p_e\cos\varphi=p-p'\cos90^\circ=17.445\). Transversal: \(p_e\sin\varphi=p'\sin90^\circ=16.8695\). Entonces \(\tan\varphi=16.8695/17.445=0.9670\Rightarrow\varphi=44.04^\circ\), igual que antes, y \(p_e=\sqrt{17.445^2+16.8695^2}=24.27\) keV/\(c\). La energía relativista \(\sqrt{(24.27)^2+511^2}-511=0.5759\) keV confirma \(K\).</li>
<li><b>Resultado.</b> <span class="ans">\(\Delta\lambda=2.426\) pm, \(\lambda'=73.496\) pm, \(K=575.9\) eV, \(\varphi=44.04^\circ\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Calcule (a) la longitud de onda de la línea \(4\to3\) del ion He⁺ y la energía de ionización del He⁺, (b) el desplazamiento isotópico de Hα entre hidrógeno y deuterio.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Planteamiento.</b> Para un ion hidrogenoide, \(1/\lambda=Z^2R_M(1/n_f^2-1/n_i^2)\) con \(R_M=R_\infty\,\mu/m_e\). <span class="given">He⁺: \(Z=2\), \(M=6.6447\times10^{-27}\) kg \(=7294.3\,m_e\).</span></li>
<li><b>Constante de Rydberg del He⁺.</b> \(R_M=R_\infty/(1+m_e/M)=1.0973732\times10^7/(1+1/7294.3)=1.0972227\times10^7\) m⁻¹.</li>
<li><b>Línea 4→3.</b> \(1/\lambda=4R_M(1/9-1/16)=4R_M\cdot7/144=2.13349\times10^6\) m⁻¹ \(\Rightarrow\lambda=468.72\) nm (energía 2.645 eV).</li>
<li><b>Ionización.</b> \(E_1=-Z^2Ry\,\mu/m_e=-4\times13.6057\times0.999863=-54.42\) eV.</li>
<li><b>Hα, H frente a D.</b> \(R_H=R_\infty/(1+m_e/m_p)\) da 656.470 nm; para el deuterón (\(m_d=3670.48\,m_e\)), \(R_D=R_\infty/(1+1/3670.48)\) da 656.291 nm. \(\Delta\lambda=0.179\) nm (se resuelve con un espectrómetro común).</li>
<li><b>Resultado.</b> <span class="ans">468.72 nm; 54.42 eV; 0.179 nm.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>(a) Longitud de onda de un electrón acelerado a 54 V y ángulo del primer máximo de Bragg para \(d=0.215\) nm. (b) Longitud de onda de un neutrón térmico a 300 K. (c) Error relativo de la fórmula no relativista a 100 kV.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>(a) Electrón.</b> \(K=54\) eV; \(\lambda=h/\sqrt{2m_eK}=1.2264/\sqrt{54}\) nm \(=0.16689\) nm. \(\sin\varphi=\lambda/d=0.16689/0.215=0.7762\Rightarrow\varphi=50.9^\circ\) (medido: 50°, con \(\lambda\) efectiva algo menor por el potencial interno del cristal).</li>
<li><b>(b) Neutrón.</b> \(K=\tfrac32k_BT=\tfrac32(1.3806\times10^{-23})(300)=6.213\times10^{-21}\) J. \(\lambda=h/\sqrt{2m_nK}=6.626\times10^{-34}/\sqrt{2(1.6749\times10^{-27})(6.213\times10^{-21})}=1.452\times10^{-10}\) m.</li>
<li><b>(c) Corrección relativista.</b> A 100 kV: \(K=100\) keV, \(mc^2=511\) keV; exacta \(\lambda=hc/\sqrt{K(K+2mc^2)}=1239.84/\sqrt{100(1122)}=3.7014\) pm. No relativista: \(h/\sqrt{2mK}=1239.84/\sqrt{2(511)(100)}=3.8783\) pm. Error relativo \(+4.78\) %.</li>
<li><b>Resultado.</b> <span class="ans">\(0.16689\) nm y 50.9°; 0.1452 nm; 4.8 %.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que la ley de Planck se reduce a Rayleigh–Jeans para \(h\nu\ll k_BT\) y a la de Wien para \(h\nu\gg k_BT\), y deduzca el valor de \(\sigma\) a partir de \(\int_0^\infty x^3/(e^x-1)\,\dd x=\pi^4/15\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Límite clásico.</b> Si \(x=h\nu/k_BT\ll1\), \(e^x-1\approx x\), luego \(u\approx\dfrac{8\pi h\nu^3}{c^3}\dfrac{k_BT}{h\nu}=\dfrac{8\pi\nu^2}{c^3}k_BT\): Rayleigh–Jeans.</li>
<li><b>Límite de Wien.</b> Si \(x\gg1\), \(e^x-1\approx e^x\), luego \(u\approx\dfrac{8\pi h\nu^3}{c^3}e^{-h\nu/k_BT}\), la forma que Wien había propuesto en 1896.</li>
<li><b>Integral.</b> Se desarrolla \(1/(e^x-1)=\sum_{k\ge1}e^{-kx}\) y se integra término a término: \(\int_0^\infty x^3e^{-kx}\dd x=3!/k^4\). Entonces \(\int x^3/(e^x-1)\dd x=6\sum_k k^{-4}=6\zeta(4)=6\pi^4/90=\pi^4/15=6.49394\).</li>
<li><b>Emitancia total.</b> \(M=\dfrac{c}{4}\int u\,\dd\nu=\dfrac c4\dfrac{8\pi h}{c^3}\left(\dfrac{k_BT}h\right)^4\dfrac{\pi^4}{15}=\dfrac{2\pi^5k_B^4}{15h^3c^2}T^4\).</li>
<li><b>Valor numérico.</b> \(2\pi^5=612.039\); \(k_B^4=3.6336\times10^{-92}\); \(h^3=2.9092\times10^{-100}\); \(c^2=8.9876\times10^{16}\). \(\sigma=612.039\times3.6336\times10^{-92}/(15\times2.9092\times10^{-100}\times8.9876\times10^{16})=5.6704\times10^{-8}\) W m⁻² K⁻⁴.</li>
<li><b>Resultado.</b> <span class="ans">\(\sigma=2\pi^5k_B^4/15h^3c^2=5.6704\times10^{-8}\) W m⁻² K⁻⁴.</span></li>
</ol></details></li>
</ol>
