<template class="chapter-src" data-id="pozos" data-num="7" data-title="Pozo finito, delta y doble pozo" data-part="Parte II · Problemas en una dimensión" data-short="Estados ligados de un pozo de profundidad finita (ecuaciones trascendentes y solución gráfica), el potencial delta y su condición de salto, el doble pozo, el desdoblamiento por efecto túnel y la inversión del amoníaco">
<p class="lead">En un pozo real las paredes no son infinitas: la función de onda penetra en la región prohibida clásicamente, la energía de los niveles es menor que en la caja, y el número de estados ligados es finito. Los casos límite ilustran dos ideas generales: la cuantización resulta de empalmar soluciones en las interfaces, y los pozos acoplados dan lugar a desdoblamientos de energía que se deben exclusivamente al efecto túnel, y que explican desde el enlace químico hasta la inversión de la molécula de amoníaco.</p>

<section>
<h2>El pozo finito</h2>
<p>Sea \(V=-V_0\) para \(|x|\lt L/2\) y \(V=0\) fuera (\(V_0\gt0\)). Un <em>estado ligado</em> tiene \(-V_0\lt E\lt0\). Se definen, con \(a=L/2\),</p>
<div class="eq">\[k=\frac{\sqrt{2m(E+V_0)}}{\hbar},\qquad \kappa=\frac{\sqrt{-2mE}}{\hbar},\qquad k^2+\kappa^2=\frac{2mV_0}{\hbar^2}\equiv\frac{z_0^2}{a^2},\qquad z=ka,\ \ \xi=\kappa a.\]</div>
<p>Dentro la solución es oscilatoria y fuera, exponencial decreciente. El potencial es par, así que las soluciones tienen paridad definida, y es suficiente imponer el empalme en \(x=a\) (el de \(x=-a\) se sigue por paridad). <strong>Estados pares:</strong> \(\psi=A\cos kx\) dentro, \(\psi=Be^{-\kappa x}\) fuera. La continuidad de \(\psi\) y de \(\psi'\) en \(a\) da \(A\cos ka=Be^{-\kappa a}\) y \(-kA\sin ka=-\kappa Be^{-\kappa a}\); dividiendo, \(k\tan ka=\kappa\). <strong>Estados impares:</strong> \(\psi=A\sin kx\) y la misma deducción da \(-k\cot ka=\kappa\). Multiplicando por \(a\):</p>
<div class="eq key" data-name="Cuantización del pozo finito">\[\text{pares: } z\tan z=\sqrt{z_0^2-z^2},\qquad \text{impares: } -z\cot z=\sqrt{z_0^2-z^2},\qquad z_0=\frac L2\frac{\sqrt{2mV_0}}\hbar.\]</div>
<p>No tienen solución en forma cerrada, pero la <em>solución gráfica</em> es muy clara: se dibuja la curva \(\xi=\sqrt{z_0^2-z^2}\) (un cuarto de circunferencia de radio \(z_0\)) junto con \(z\tan z\) y \(-z\cot z\); cada intersección es un estado. Las ramas aparecen alternadas, una cada \(\pi/2\) en \(z\): el número de estados ligados es</p>
<div class="eq">\[N=\left\lceil\frac{2z_0}{\pi}\right\rceil,\qquad E_n+V_0=\frac{\hbar^2z_n^2}{2ma^2}\ \lt\ \frac{n^2\pi^2\hbar^2}{2mL^2}\ \ (\text{energía de la caja}).\]</div>
<p>Propiedades. (i) <em>Siempre existe al menos un estado ligado</em> (el par), por pequeño que sea \(V_0\): la rama \(z\tan z\) parte de cero y corta al arco de circunferencia para todo \(z_0\gt0\). Esto es propio de una dimensión: en tres dimensiones hace falta una profundidad mínima (capítulo 13). (ii) Los niveles quedan por debajo de los de la caja infinita, porque la función ocupa más espacio (\(L\) efectivo mayor); al aumentar \(V_0\to\infty\) tienden a los de la caja. (iii) Hay probabilidad de hallar a la partícula en la región clásicamente prohibida, con longitud de penetración \(1/\kappa\); para un estado de energía cercana al borde del pozo \(\kappa\to0\) y la función se extiende lejos. (iv) La paridad y los \(n-1\) nodos se mantienen.</p>
<div class="box ex"><h4>Un pozo cuántico de GaAs/AlGaAs: el origen del láser de cascada</h4>
<p><strong>Datos.</strong> Un electrón en un pozo de GaAs de ancho \(L\) entre barreras de Al\(_{0.3}\)Ga\(_{0.7}\)As, con masa efectiva \(m^*=0.067\,m_e\) y profundidad \(V_0\approx0.25\) eV. Con \(\hbar^2/m_e=0.0762\) eV·nm². <strong>Procedimiento.</strong> (1) Parámetro \(z_0=\tfrac L2\sqrt{2m^*V_0}/\hbar\): para \(L=10\) nm, \(z_0=5\ \text{nm}\times\sqrt{2(0.067)(0.25)/0.0762}\ \text{nm}^{-1}=3.315\). (2) Número de estados: \(\lceil2z_0/\pi\rceil=3\). (3) Se resuelven las ecuaciones trascendentes: \(z_1=1.2003\), \(z_2=2.3526\), \(z_3=3.2824\), y \(E_n=\hbar^2z_n^2/(2m^*a^2)\): 32.8, 125.9 y 245.1 meV desde el fondo. La caja infinita daría 56.1, 224.5 y 505 meV: los niveles reales son más bajos, el tercero casi a la mitad. (4) La transición \(1\to2\) tiene 93.1 meV, \(\lambda=13.3\) µm (infrarrojo lejano). Con \(L=5\) nm quedan 2 estados (83.2 y 248.3 meV), y la transición de 165.2 meV cae en 7.5 µm, la región de operación de los láseres de cascada cuántica (Faist et al., 1994), donde el color se diseña con el ancho del pozo. <strong>Resultado.</strong> \(E_n\) por debajo de la caja, y transiciones intersubbanda en el infrarrojo, sintonizables con \(L\).</p></div>

</section>

<section>
<h2>El potencial delta</h2>
<p>Al reducir el ancho de un pozo a cero manteniendo fijo el producto \(\alpha=V_0L\), se obtiene \(V(x)=-\alpha\,\delta(x)\), el pozo más delgado posible. Como \(V\) es infinito en un punto, \(\psi'\) no es continua. Integrando la ecuación de Schrödinger sobre \((-\varepsilon,\varepsilon)\) y haciendo \(\varepsilon\to0\) (la integral de \(\psi''\) es el salto de \(\psi'\); la de \(E\psi\) se anula, pues \(\psi\) es finita):</p>
<div class="eq key" data-name="Condición de salto de la delta">\[\psi'(0^+)-\psi'(0^-)=-\frac{2m\alpha}{\hbar^2}\,\psi(0)\qquad\text{para }V=-\alpha\delta(x).\]</div>
<p><strong>Estado ligado.</strong> Con \(E\lt0\), fuera del origen \(\psi=Ae^{-\kappa|x|}\), con \(\kappa=\sqrt{-2mE}/\hbar\) (continua en 0). Su derivada salta de \(+\kappa A\) a \(-\kappa A\), de modo que \(\psi'(0^+)-\psi'(0^-)=-2\kappa A\). Igualando con la condición de salto:</p>
<div class="eq key" data-name="Estado ligado de la delta">\[\kappa=\frac{m\alpha}{\hbar^2},\qquad E_0=-\frac{\hbar^2\kappa^2}{2m}=-\frac{m\alpha^2}{2\hbar^2},\qquad \psi_0(x)=\sqrt\kappa\,e^{-\kappa|x|}.\]</div>
<p>Hay <em>un único</em> estado ligado. Su incertidumbre es \(\Delta x=1/\sqrt2\kappa\), \(\Delta p=\hbar\kappa\), y \(\Delta x\Delta p=\hbar/\sqrt2=1.414\,\hbar/2\). <strong>Dispersión.</strong> Para una onda incidente por la izquierda con \(E\gt0\), \(\psi=e^{ikx}+re^{-ikx}\) (\(x\lt0\)) y \(\psi=te^{ikx}\) (\(x\gt0\)): la continuidad da \(1+r=t\) y el salto, con \(V=\pm\alpha\delta\), \(\ii kt-\ii k(1-r)=\pm\tfrac{2m\alpha}{\hbar^2}t\). Despejando, \(t=\dfrac{1}{1\pm\ii\,m\alpha/\hbar^2k}\) (signo superior para la barrera, inferior para el pozo) y</p>
<div class="eq key" data-name="Transmisión por una delta">\[T=|t|^2=\frac{1}{1+\dfrac{m\alpha^2}{2\hbar^2E}}=\frac{1}{1+|E_0|/E},\qquad R=1-T.\]</div>
<p>El resultado es el mismo para la delta atractiva y la repulsiva (depende de \(\alpha^2\)). A baja energía la reflexión es casi total (\(T\to0\) cuando \(E\to0\), incluso para una delta <em>atractiva</em>, un efecto puramente ondulatorio); a \(E=|E_0|\), \(T=\tfrac12\); a energías altas \(T\to1\). Hay una relación entre las dos clases de estados: \(T\) tiene un polo en \(E=-|E_0|\), la energía del estado ligado (en \(k=\ii\kappa\)), regla general de la teoría de la dispersión (capítulo 25).</p>
<div class="box ex"><h4>Una delta de α = 1 eV·nm para un electrón</h4>
<p><strong>Procedimiento.</strong> Con \(\hbar^2/m_e=0.0762\) eV·nm²: \(\kappa=\alpha m/\hbar^2=1/0.0762=13.12\) nm⁻¹; longitud de penetración \(1/\kappa=0.0762\) nm (0.76 Å); \(E_0=-\alpha^2m/2\hbar^2=-1/(2\times0.0762)=-6.56\) eV. Una delta de intensidad 1 eV·nm equivale, por ejemplo, a un pozo de 0.1 nm y 10 eV. Para \(E=2|E_0|=13.1\) eV: \(T=1/(1+1/2)=2/3\), \(R=1/3\). <strong>Observación.</strong> La energía de ligadura crece como \(\alpha^2\), no como \(\alpha\): doblar la intensidad la multiplica por 4.</p></div>
<div class="sim" data-sim="delta" data-title="Potencial delta: estado ligado y transmisión"></div>
<div class="sim-guide"><ul>
<li>Con \(\alpha=1\) (unidades \(\hbar=m=1\)): \(\kappa=1\), \(E_0=-0.5\), \(\Delta x=0.707\) y \(\Delta x\Delta p/(\hbar/2)=1.414\). Con \(\alpha=2\): \(\kappa=2\), \(E_0=-2\); el estado es el doble de estrecho y 4 veces más ligado.</li>
<li>La curva de la derecha es la misma para ambos signos de \(\alpha\) (active «repulsiva»: desaparece el estado ligado y la transmisión no cambia). En \(E=|E_0|\) vale 1/2 y en \(E=4|E_0|\), 0.8; para \(E\ll|E_0|\) casi todo se refleja.</li>
</ul></div>
</section>

<section>
<h2>Dos pozos acoplados: efecto túnel y desdoblamiento</h2>
<p>Con dos pozos delta idénticos, \(V=-\alpha[\delta(x-a)+\delta(x+a)]\), el sistema modela una molécula diatómica de un electrón (como el H\(_2^+\)) y tiene simetría de paridad. Se resuelve con el mismo método: entre los pozos las soluciones pares son \(\cosh\kappa x\) y las impares \(\sinh\kappa x\), con \(e^{-\kappa|x|}\) fuera; las condiciones de salto en \(x=\pm a\) dan, con \(\kappa_0=m\alpha/\hbar^2\) (el \(\kappa\) de un pozo aislado):</p>
<div class="eq key" data-name="Doble delta">\[\text{pares: }\ \kappa\,(1+\tanh\kappa a)=2\kappa_0,\qquad \text{impares: }\ \kappa\,(1+\coth\kappa a)=2\kappa_0\quad(\text{existe si }2\kappa_0a\gt1).\]</div>
<p>El estado par concentra carga entre los pozos y queda más ligado (\(\kappa\gt\kappa_0\)); el impar tiene un nodo en el centro y está menos ligado (\(\kappa\lt\kappa_0\)). Para pozos muy separados (\(\kappa_0a\gg1\)), \(\tanh\) y \(\coth\) se aproximan a \(1\mp2e^{-2\kappa a}\) y \(\kappa\approx\kappa_0(1\pm e^{-2\kappa_0a})\); entonces</p>
<div class="eq key" data-name="Desdoblamiento por efecto túnel">\[E_{\pm}\approx E_0\left(1\pm2e^{-2\kappa_0a}\right),\qquad \Delta E=E_\text{impar}-E_\text{par}\approx4|E_0|\,e^{-2\kappa_0a}.\]</div>
<p>Cada nivel de un pozo aislado se desdobla en dos, con una separación que decrece <em>exponencialmente</em> con la distancia entre los pozos y con la masa: es una medida del efecto túnel, pues \(e^{-2\kappa_0a}\) es la penetración de la función en la barrera. Esta es la raíz del <span class="term">enlace covalente</span> (el nivel enlazante, par, baja y el antienlazante sube) y de las bandas de energía de un cristal (capítulo 11). Lo más interesante es la dinámica. Si se prepara el sistema en \(\Psi(0)=(\psi_{\text{par}}+\psi_{\text{impar}})/\sqrt2\), la partícula está localizada en un pozo, pero la superposición de dos estados con energías \(E_\pm\) oscila con frecuencia \(\Delta E/\hbar\) (capítulo 2): la partícula <em>pasa de un pozo al otro</em> con periodo</p>
<div class="eq">\[P_\text{izq}(t)=\cos^2\frac{\Delta E\,t}{2\hbar},\qquad T_\text{túnel}=\frac{2\pi\hbar}{\Delta E}=\frac{h}{\Delta E}.\]</div>
<p>Hay oscilaciones coherentes entre los pozos sin que la partícula tenga nunca energía suficiente para superar la barrera.</p>
<div class="box ex"><h4>La inversión de la molécula de amoníaco</h4>
<p><strong>Datos.</strong> El NH\(_3\) es una pirámide con el N sobre el plano de los H, y existen dos configuraciones equivalentes (N arriba o abajo), separadas por una barrera de unos 2000 cm⁻¹ (0.25 eV). El estado fundamental vibracional de la inversión se desdobla en un doblete par/impar con \(\Delta E=0.7934\) cm⁻¹. <strong>Procedimiento.</strong> (1) \(\Delta E=hc\cdot0.7934\ \text{cm}^{-1}=9.837\times10^{-5}\) eV. (2) Frecuencia: \(\nu=\Delta E/h=c\times79.34\ \text{m}^{-1}=23.786\) GHz. (3) Periodo de inversión \(T=1/\nu=42.0\) ps: la molécula pasa de una configuración a la otra 24 mil millones de veces por segundo, sin energía para saltar la barrera. <strong>Resultado.</strong> La transición \(\text{par}\leftrightarrow\text{impar}\) cae en las microondas (1.26 cm) y fue la base del primer máser (Gordon, Zeiger y Townes, 1954) y de los relojes de amoníaco, los primeros relojes atómicos (1949).</p></div>
<div class="sim" data-sim="dobledoble" data-title="Doble pozo: desdoblamiento de los niveles y oscilación por efecto túnel"></div>
<div class="sim-guide"><ul>
<li>Con \(V_0=12\) y \(a=1.5\) (\(\hbar=m=1\)): \(E_0=3.1430\), \(E_1=3.1458\), \(\Delta E=2.80\times10^{-3}\) y periodo de túnel \(\approx2.2\times10^3\). La barrera es unas 4 veces más alta que \(E_0\), y los niveles son casi iguales a los del oscilador de un solo pozo (\(\omega/2=3.27\)).</li>
<li>Suba la barrera a \(V_0=24\): \(\Delta E=8.4\times10^{-5}\), periodo \(7.4\times10^4\), 33 veces mayor: el túnel se frena de manera exponencial con la altura (\(\propto e^{-2\kappa a}\)). Con \(a=2.5\) y \(V_0=12\), \(\Delta E=3.3\times10^{-6}\).</li>
<li>La esfera roja se mueve sobre la curva \(\cos^2(\pi t/T)\), y la densidad del panel izquierdo transporta la partícula de un pozo al otro; la distancia entre los picos no cambia: solo cambia el reparto entre ellos.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un electrón está en un pozo de 1 nm y 5 eV de profundidad. Calcule \(z_0\), el número de estados ligados y la energía del estado fundamental (desde el fondo). Compárela con la de la caja infinita.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Parámetro.</b> \(z_0=\tfrac L2\sqrt{2mV_0}/\hbar=0.5\ \text{nm}\times\sqrt{2\times5/0.0762}\ \text{nm}^{-1}=0.5\times11.456=5.728\).</li>
<li><b>Número de estados.</b> \(N=\lceil2z_0/\pi\rceil=\lceil3.646\rceil=4\).</li>
<li><b>Estado fundamental.</b> Se resuelve \(z\tan z=\sqrt{z_0^2-z^2}\) en \((0,\pi/2)\) por bisección: \(z_1=1.3355\) (comprobación: \(1.3355\tan1.3355=5.5700\) y \(\sqrt{32.81-1.78}=5.5700\)).</li>
<li><b>Energía.</b> \(E_1+V_0=\hbar^2z_1^2/(2ma^2)=0.0381\times1.7835/0.25=0.2718\) eV, medida desde el fondo (es decir, \(-4.728\) eV respecto del borde).</li>
<li><b>Comparación.</b> Caja infinita: 0.3760 eV. El pozo finito la reduce un 28 %, porque la función se extiende fuera del pozo.</li>
<li><b>Resultado.</b> <span class="ans">\(z_0=5.728\); 4 estados; \(E_1=0.272\) eV (caja: 0.376 eV).</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Una delta atractiva tiene \(\alpha=1\) eV·nm y actúa sobre un electrón. Halle \(\kappa\), la energía de ligadura, la longitud de penetración y las probabilidades de transmisión y reflexión para \(E=2|E_0|\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Constante.</b> \(\hbar^2/m_e=0.0762\) eV·nm². \(\kappa=m\alpha/\hbar^2=\alpha/(\hbar^2/m)=1/0.0762=13.12\) nm⁻¹.</li>
<li><b>Energía.</b> \(E_0=-\hbar^2\kappa^2/2m=-0.0381\ \text{eV·nm}^2\times172.2\ \text{nm}^{-2}=-6.56\) eV.</li>
<li><b>Penetración.</b> \(1/\kappa=0.0762\) nm.</li>
<li><b>Dispersión.</b> \(T=1/(1+|E_0|/E)\) con \(E=2|E_0|=13.12\) eV: \(T=1/(1+\tfrac12)=\tfrac23=0.667\); \(R=\tfrac13=0.333\).</li>
<li><b>Resultado.</b> <span class="ans">\(\kappa=13.1\) nm⁻¹; \(E_0=-6.56\) eV; \(1/\kappa=0.076\) nm; \(T=2/3\), \(R=1/3\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Deduzca la condición de salto \(\psi'(0^+)-\psi'(0^-)=-2m\alpha\psi(0)/\hbar^2\) y aplíquela para hallar el estado ligado; verifique la normalización.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Integración.</b> De \(-\tfrac{\hbar^2}{2m}\psi''-\alpha\delta(x)\psi=E\psi\), se integra de \(-\varepsilon\) a \(\varepsilon\): \(-\tfrac{\hbar^2}{2m}[\psi'(\varepsilon)-\psi'(-\varepsilon)]-\alpha\psi(0)=E\int_{-\varepsilon}^{\varepsilon}\psi\,\dd x\to0\).</li>
<li><b>Salto.</b> \(\psi'(0^+)-\psi'(0^-)=-\dfrac{2m\alpha}{\hbar^2}\psi(0)\).</li>
<li><b>Ansatz.</b> \(\psi=Ae^{-\kappa|x|}\): \(\psi'(0^\pm)=\mp\kappa A\); salto \(=-2\kappa A=-\tfrac{2m\alpha}{\hbar^2}A\Rightarrow\kappa=\dfrac{m\alpha}{\hbar^2}\).</li>
<li><b>Normalización.</b> \(1=A^2\cdot2\int_0^\infty e^{-2\kappa x}\dd x=A^2/\kappa\Rightarrow A=\sqrt\kappa\).</li>
<li><b>Energía y no unicidad.</b> \(E=-\hbar^2\kappa^2/2m=-m\alpha^2/2\hbar^2\). No hay otro estado: una solución con un nodo exigiría \(\psi(0)=0\), pero entonces el salto de \(\psi'\) sería nulo y se trataría de una función impar sin ligadura.</li>
<li><b>Resultado.</b> <span class="ans">\(\kappa=m\alpha/\hbar^2\), \(E_0=-m\alpha^2/2\hbar^2\), \(\psi=\sqrt\kappa\,e^{-\kappa|x|}\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Para dos deltas con \(\kappa_0=1\) (\(\hbar=m=1\)) y separación \(2a\), resuelva las ecuaciones para \(a=1\) y \(a=2\); compare el desdoblamiento con \(4|E_0|e^{-2\kappa_0a}\). ¿Cuántos estados ligados hay si \(a=0.4\)?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Ecuaciones.</b> Par: \(\kappa(1+\tanh\kappa a)=2\); impar: \(\kappa(1+\coth\kappa a)=2\); \(E=-\kappa^2/2\), \(|E_0|=1/2\).</li>
<li><b>\(a=1\).</b> Par: \(\kappa=1.10886\), \(E=-0.61478\). Impar: \(\kappa=0.79681\), \(E=-0.31745\). \(\Delta E=0.29733\). Aproximación \(4(0.5)e^{-2}=0.27067\): error 9 %.</li>
<li><b>\(a=2\).</b> Par: \(\kappa=1.01710\), \(E=-0.51725\); impar: \(\kappa=0.98017\), \(E=-0.48037\). \(\Delta E=0.036882\) frente a \(2e^{-4}=0.036631\): error 0.7 %.</li>
<li><b>\(a=0.4\).</b> La rama impar exige \(2\kappa_0a\gt1\), y aquí \(2\kappa_0a=0.8\lt1\): \(f(\kappa)=\kappa(1+\coth\kappa a)-2\kappa_0\) vale \(1/a-2\kappa_0=0.5\gt0\) en \(\kappa\to0\) y crece, sin cruzar el eje. Solo existe el estado par, \(\kappa=1.3418\), \(E=-0.9002\): más ligado que en un pozo aislado (\(-0.5\)), porque la carga se acumula entre los dos pozos.</li>
<li><b>Resultado.</b> <span class="ans">\(a=1\): \(-0.6148\) y \(-0.3175\); \(a=2\): \(-0.5173\) y \(-0.4804\); con \(a=0.4\) hay un solo estado ligado.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>La inversión del NH\(_3\) tiene un desdoblamiento de 0.7934 cm⁻¹. Calcule la frecuencia, el periodo de oscilación y la longitud de onda de la transición, y muestre que \(P_\text{arriba}(t)=\cos^2(\pi t/T)\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Estados.</b> Con barrera alta, los estados par e impar son \(\psi_\pm=(\varphi_A\pm\varphi_B)/\sqrt2\), con \(\varphi_{A,B}\) localizadas en cada configuración (casi sin solapamiento). El estado inicial \(\Psi(0)=(\psi_++\psi_-)/\sqrt2=\varphi_A\) está en la configuración A.</li>
<li><b>Evolución.</b> \(\Psi(t)=\tfrac1{\sqrt2}(\psi_+e^{-\ii E_+t/\hbar}+\psi_-e^{-\ii E_-t/\hbar})\propto\varphi_A\cos\tfrac{\omega t}2-\ii\varphi_B\sin\tfrac{\omega t}2\), con \(\omega=\Delta E/\hbar\). Entonces \(P_A=\cos^2(\omega t/2)\) y \(P_B=\sin^2(\omega t/2)\).</li>
<li><b>Resultado temporal.</b> \(P(t)=\tfrac12(1+\cos\omega t)=\cos^2(\omega t/2)=\cos^2(\pi t/T)\) con \(T=2\pi/\omega\).</li>
<li><b>Números.</b> \(\Delta E=hc\times79.34\ \text{m}^{-1}=9.837\times10^{-5}\) eV. \(\nu=\Delta E/h=23.786\) GHz. \(T=1/\nu=42.04\) ps. Longitud de onda: \(c/\nu=1.260\) cm.</li>
<li><b>Resultado.</b> <span class="ans">\(\nu=23.79\) GHz, \(T=42.0\) ps, \(\lambda=1.26\) cm; \(P=\cos^2(\pi t/T)\).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que un pozo finito unidimensional siempre tiene un estado ligado, y que para \(z_0\ll1\) su energía de ligadura tiende a la de una delta con \(\alpha=V_0L\). Evalúelo para \(V_0=0.1\) eV, \(L=0.2\) nm, electrón.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Existencia.</b> Estado par: \(z\tan z=\sqrt{z_0^2-z^2}\) en \(0\lt z\lt\min(\pi/2,z_0)\). A la izquierda \(f(z)=z\tan z-\sqrt{z_0^2-z^2}\) vale \(-z_0\lt0\) en \(z=0\), y crece sin cota si \(z_0\gt\pi/2\), o vale \(z_0\tan z_0\gt0\) en \(z=z_0\). En todo caso cambia de signo: hay raíz, para cualquier \(z_0\gt0\).</li>
<li><b>Límite débil.</b> Con \(z\le z_0\ll1\): \(\tan z\approx z\), de modo que \(z^2\approx\xi=\sqrt{z_0^2-z^2}\). De ahí \(z\approx z_0\) y \(\xi\approx z_0^2\) (pues \(\xi^2=z_0^2-z^2\ll z_0^2\) implica \(\xi\approx z^2\approx z_0^2\) a primer orden).</li>
<li><b>Ligadura.</b> \(\kappa a=\xi\approx z_0^2\Rightarrow\kappa=\dfrac{z_0^2}{a}=\dfrac{a\cdot2mV_0}{\hbar^2}=\dfrac{mV_0L}{\hbar^2}=\dfrac{m\alpha}{\hbar^2}\), con \(\alpha=V_0L\): es el \(\kappa\) de la delta.</li>
<li><b>Números.</b> \(\alpha=0.1\times0.2=0.02\) eV·nm. Delta: \(E_0=-\alpha^2/(2\hbar^2/m)=-4\times10^{-4}/0.1524=-2.62\) meV. El cálculo exacto del pozo da \(z_1=0.15994\), \(E_1+V_0=97.46\) meV, es decir, ligadura \(2.54\) meV (error 3 %). \(1/\kappa\approx3.9\) nm, 19 veces el ancho del pozo.</li>
<li><b>Resultado.</b> <span class="ans">Siempre existe al menos un estado par; \(E\to-m(V_0L)^2/2\hbar^2\); en el ejemplo \(-2.6\) meV (delta) frente a \(-2.54\) meV (exacto).</span></li>
</ol></details></li>
</ol>
