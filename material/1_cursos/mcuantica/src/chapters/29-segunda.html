<template class="chapter-src" data-id="segunda" data-num="29" data-title="Segunda cuantización y gases cuánticos" data-part="Parte VI · Muchos cuerpos" data-short="Espacio de Fock y operadores de creación y aniquilación, el hamiltoniano de muchos cuerpos, el modelo de Hubbard de dos sitios, el gas de Fermi degenerado y la condensación de Bose–Einstein">
<p class="lead">Escribir la función de onda de \(10^{23}\) electrones como un determinante de Slater es impracticable, e imposible si el número de partículas cambia (fotones, cuasipartículas). La <span class="term">segunda cuantización</span> resuelve ambos problemas: en lugar de funciones de onda de \(N\) coordenadas, se usan estados que dicen <em>cuántas partículas hay en cada orbital</em> y operadores que las crean o destruyen. La simetría de intercambio queda codificada en el álgebra de estos operadores, y no en la forma de la función de onda. Es el lenguaje de la física de la materia condensada, de la física nuclear y de la teoría de campos.</p>

<section>
<h2>El espacio de Fock y los operadores de campo</h2>
<p>Dada una base de orbitales de una partícula \(\{\phi_k\}\), un estado de muchas partículas se rotula por los <em>números de ocupación</em> \(|n_1,n_2,\dots\rangle\). Los operadores \(a_k^\dagger\) y \(a_k\) crean y destruyen una partícula en el orbital \(k\). Su álgebra define la estadística:</p>
<div class="eq key" data-name="Relaciones de conmutación y anticonmutación">\[\text{Bosones:}\ \ [a_i,a_j^\dagger]=\delta_{ij},\ \ [a_i,a_j]=0,\ \ a|n\rangle=\sqrt n|n-1\rangle,\ \ a^\dagger|n\rangle=\sqrt{n+1}|n+1\rangle;\qquad\text{Fermiones:}\ \ \{c_i,c_j^\dagger\}=\delta_{ij},\ \ \{c_i,c_j\}=0 .\]</div>
<p>En el caso fermiónico, \(c_i^2=0\): no se puede crear dos veces una partícula en el mismo orbital (el principio de exclusión es un teorema del álgebra), y \(n_i=c_i^\dagger c_i\) solo tiene los valores 0 y 1. Los signos de anticonmutación llevan implícita la antisimetría de la función de onda. Un operador de una partícula \(\hat T=\sum_in_i\varepsilon_i\) (o, en general, \(\sum_{ij}t_{ij}a_i^\dagger a_j\)) y uno de dos partículas, \(\hat V=\tfrac12\sum_{ijkl}V_{ijkl}\,a_i^\dagger a_j^\dagger a_la_k\), con \(V_{ijkl}=\langle ij|V|kl\rangle\), se escriben para cualquier número de partículas. Con los operadores de campo \(\hat\psi(\mathbf r)=\sum_k\phi_k(\mathbf r)a_k\) el hamiltoniano de muchos cuerpos es \(\hat H=\int\hat\psi^\dagger\left(-\tfrac{\hbar^2}{2m}\nabla^2+U\right)\hat\psi\,\dd^3r+\tfrac12\iint\hat\psi^\dagger\hat\psi^\dagger V\hat\psi\hat\psi\). En una máquina, los operadores fermiónicos de \(M\) modos son matrices de dimensión \(2^M\) (con la transformación de Jordan–Wigner).</p>
</section>

<section>
<h2>El modelo de Hubbard de dos sitios</h2>
<p>El modelo más sencillo de electrones que interactúan es el de Hubbard: electrones que saltan entre sitios con amplitud \(-t\) y se repelen con una energía \(U\) si dos ocupan el mismo sitio:</p>
<div class="eq key" data-name="Hubbard de dos sitios">\[H=-t\sum_\sigma\left(c_{1\sigma}^\dagger c_{2\sigma}+c_{2\sigma}^\dagger c_{1\sigma}\right)+U\sum_{i}n_{i\uparrow}n_{i\downarrow},\qquad E_\text{singlete}=\frac U2-\sqrt{\frac{U^2}4+4t^2},\quad E_\text{triplete}=0 .\]</div>
<p>En el sector de dos electrones con \(S_z=0\), el singlete \((\ket{\uparrow,\downarrow}-\ket{\downarrow,\uparrow})/\sqrt2\) se acopla con el estado simétrico de doble ocupación \((\ket{\uparrow\downarrow,0}+\ket{0,\uparrow\downarrow})/\sqrt2\) con elemento \(-2t\), y el triplete \(S_z=0\) no se acopla. Para \(U=0\), \(E_S=-2t\) (el enlace covalente: ambos electrones en el orbital enlazante) y la doble ocupación vale \(\tfrac12\); al crecer \(U\), los electrones se evitan y se <em>localizan</em> uno en cada sitio (aislante de Mott), \(\langle D\rangle\to0\), y el desdoblamiento singlete–triplete se reduce a \(J=4t^2/U\) (superintercambio de Anderson): un acoplamiento de Heisenberg antiferromagnético \(J\,\mathbf S_1\cdot\mathbf S_2\). Es el origen del magnetismo de los aislantes y, con dopaje, del modelo de los superconductores de alta temperatura.</p>
<div class="sim" data-sim="hubbard2" data-title="Hubbard de dos sitios: de los electrones itinerantes a los espines localizados"></div>
<div class="sim-guide"><ul>
<li>Con \(U=4t\): \(E_S=-0.8284t\), el triplete en 0, \(\langle D\rangle=0.1464\) (frente a 0.5 sin interacción) y el desdoblamiento \(0.8284t\) frente a \(4t^2/U=1.0t\) (el cociente 0.83: todavía no se cumple \(U\gg t\)). La diagonalización completa en el espacio de Fock de 16 estados con matrices de Jordan–Wigner contiene exactamente este valor.</li>
<li>Con \(U=20t\): \(E_S=-0.1980t\), \(\langle D\rangle=0.0097\) y \(J=0.1980t\) frente a \(4t^2/U=0.2t\) (cociente 0.990): casi un modelo de Heisenberg con electrones localizados. Con \(U=0\): \(E_S=-2t\), \(\langle D\rangle=0.5\).</li>
</ul></div>
</section>

<section>
<h2>El gas de Fermi degenerado</h2>
<p>Para \(N\) fermiones libres de espín \(\tfrac12\) en un volumen \(V\), los orbitales de onda plana con \(\mathbf k\) en una esfera de radio \(k_F\) están ocupados a \(T=0\), y contando estados (\(2\times\tfrac V{(2\pi)^3}\tfrac{4\pi}3k_F^3=N\)):</p>
<div class="eq key" data-name="Gas de Fermi ideal">\[E_F=\frac{\hbar^2}{2m}\left(3\pi^2n\right)^{2/3},\qquad\bar E=\tfrac35E_F,\qquad P=\tfrac25nE_F,\qquad\mu(T)\approx E_F\left[1-\frac{\pi^2}{12}\left(\frac{k_BT}{E_F}\right)^2\right],\qquad\frac C{Nk_B}=\frac{\pi^2}2\frac T{T_F}.\]</div>
<p>La energía de Fermi es la del último nivel ocupado, y para los electrones de un metal vale unos eV, de modo que \(T_F\sim10^4\)–\(10^5\) K: a temperatura ambiente el gas está profundamente degenerado, \(k_BT\ll E_F\), y solo los electrones en una franja de anchura \(k_BT\) alrededor de \(E_F\) contribuyen al calor específico (de ahí que el calor específico electrónico sea mucho menor que el clásico \(\tfrac32Nk_B\), la paradoja que resolvió Sommerfeld en 1928). Incluso a \(T=0\) el gas ejerce una presión \(P=\tfrac25nE_F\) por el principio de exclusión: la presión de degeneración sostiene a las enanas blancas contra la gravedad (el límite de Chandrasekhar, 1.4 masas solares) y a las estrellas de neutrones.</p>
<div class="sim" data-sim="gas-fermi" data-title="Gas de Fermi: ocupación, potencial químico y escalas de energía"></div>
<div class="sim-guide"><ul>
<li>Cobre (\(n=8.47\times10^{28}\) m\(^{-3}\)): \(E_F=7.033\) eV, \(T_F=8.16\times10^4\) K; a \(T=0.05\,T_F\) (4080 K), \(\mu=0.99793\,E_F\) (Sommerfeld: 0.99794), el calor específico es \(0.247\,k_B\) por electrón (frente a \(1.5\,k_B\)) y la presión de degeneración \(3.82\times10^{10}\) Pa (382 kbar).</li>
<li>Con \(T=T_F\) el gas deja de ser degenerado (\(n\lambda_T^3=1.5\), el potencial químico se vuelve negativo y se acerca a la estadística de Boltzmann). Con \(^3\)He líquido: \(E_F=0.43\) meV y \(T_F=4.97\) K.</li>
</ul></div>
</section>

<section>
<h2>Condensación de Bose–Einstein</h2>
<p>Los bosones no tienen límite de ocupación por estado. Un gas ideal de bosones de masa \(m\) y densidad \(n\) cuya longitud de onda térmica \(\lambda_T=h/\sqrt{2\pi mk_BT}\) iguala a la distancia media entre partículas \(\sim n^{-1/3}\) se condensa: por debajo de una temperatura crítica un número macroscópico de partículas ocupa el estado de menor energía.</p>
<div class="eq key" data-name="Condensación de Bose–Einstein (gas ideal homogéneo)">\[n\lambda_T^3=\zeta(\tfrac32)=2.612\ \Longleftrightarrow\ T_c=\frac{2\pi\hbar^2}{mk_B}\left(\frac n{\zeta(3/2)}\right)^{2/3},\qquad\frac{N_0}N=1-\left(\frac T{T_c}\right)^{3/2}\ (T\lt T_c).\]</div>
<p>Einstein predijo el fenómeno en 1925, siguiendo la estadística de Bose para fotones. Para el helio-4 líquido (\(n=2.18\times10^{28}\) m\(^{-3}\)) la fórmula da \(T_c=3.13\) K, cerca de la transición superfluida observada (\(T_\lambda=2.17\) K; la diferencia se debe a las interacciones). En 1995 Cornell y Wieman (Rb) y Ketterle (Na) lograron condensar gases atómicos diluidos enfriados con láser y por evaporación a unos 100 nK, con densidades 8 órdenes de magnitud menores que las de un líquido. En una trampa armónica, \(T_c=\tfrac{\hbar\bar\omega}{k_B}\left(N/\zeta(3)\right)^{1/3}\). El condensado es una onda de materia macroscópica coherente: interfiere consigo mismo y es el análogo atómico del láser.</p>
<div class="sim" data-sim="bec" data-title="Condensación de Bose–Einstein: temperatura crítica y fracción condensada"></div>
<div class="sim-guide"><ul>
<li>\(^{87}\)Rb con \(n=10^{20}\) m\(^{-3}\): \(T_c=398\) nK, \(\lambda_T(T_c)=297\) nm frente a una distancia entre átomos de \(n^{-1/3}=215\) nm (cociente \(2.612^{1/3}=1.38\)). A \(T=0.7\,T_c\), la fracción condensada es \(0.4143\) y la temperatura 279 nK; \(n\lambda_T^3=4.46\).</li>
<li>\(^4\)He líquido: \(T_c=3.13\) K (\(\lambda_T=0.49\) nm, con \(n^{-1/3}=0.36\) nm). La temperatura crítica crece como \(n^{2/3}\) y decrece con la masa: el hidrógeno atómico, mucho más ligero, se condensaría a una temperatura 86 veces mayor que el rubidio con la misma densidad.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Con las relaciones de conmutación bosónicas calcule \(a|3\rangle\), \(a^\dagger a|3\rangle\), \([a,a^\dagger]|2\rangle\); y muestre para fermiones que \(c^\dagger c^\dagger=0\) y que \(n=c^\dagger c\) cumple \(n^2=n\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>\(a|3\rangle\).</b> \(\sqrt3\,|2\rangle\).</li>
<li><b>\(a^\dagger a|3\rangle\).</b> \(\sqrt3\,a^\dagger|2\rangle=\sqrt3\cdot\sqrt3\,|3\rangle=3|3\rangle\): \(N=a^\dagger a\) cuenta partículas.</li>
<li><b>Conmutador en \(|2\rangle\).</b> \(aa^\dagger|2\rangle=\sqrt3\sqrt3|2\rangle=3|2\rangle\); \(a^\dagger a|2\rangle=2|2\rangle\); \([a,a^\dagger]|2\rangle=(3-2)|2\rangle=|2\rangle\) ✓.</li>
<li><b>Fermiones.</b> \(\{c^\dagger,c^\dagger\}=0\Rightarrow2c^\dagger c^\dagger=0\); \(n^2=c^\dagger cc^\dagger c=c^\dagger(1-c^\dagger c)c=c^\dagger c-c^\dagger c^\dagger cc=n\) (autovalores 0 y 1).</li>
<li><b>Resultado.</b> <span class="ans">\(\sqrt3|2\rangle\); \(3|3\rangle\); \([a,a^\dagger]|2\rangle=|2\rangle\); \(c^{\dagger2}=0\) y \(n^2=n\): el principio de exclusión es un teorema del álgebra.</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Para el cobre (\(n=8.47\times10^{28}\) m\(^{-3}\)) calcule \(E_F\), \(T_F\), la velocidad de Fermi, el potencial químico y el calor específico electrónico a 300 K.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Energía de Fermi.</b> \(E_F=\dfrac{\hbar^2}{2m_e}(3\pi^2n)^{2/3}\), con \(3\pi^2n=2.508\times10^{30}\) m\(^{-3}\): \(E_F=1.1268\times10^{-18}\) J \(=7.033\) eV.</li>
<li><b>Temperatura de Fermi.</b> \(T_F=E_F/k_B=8.16\times10^4\) K.</li>
<li><b>Velocidad.</b> \(v_F=\sqrt{2E_F/m_e}=1.573\times10^6\) m/s (0.5 % de \(c\)).</li>
<li><b>A 300 K.</b> \(k_BT/E_F=3.68\times10^{-3}\): \(\mu=E_F\left[1-\tfrac{\pi^2}{12}(3.68\times10^{-3})^2\right]=0.999989\,E_F\).</li>
<li><b>Calor específico.</b> \(C/Nk_B=\tfrac{\pi^2}2\tfrac{300}{81612}=0.0181\): solo 1.2 % del valor clásico 1.5.</li>
<li><b>Resultado.</b> <span class="ans">\(E_F=7.033\) eV; \(T_F=8.16\times10^4\) K; \(v_F=1.57\times10^6\) m/s; \(\mu=0.999989E_F\); \(C=0.0181\,Nk_B\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>En el Hubbard de dos sitios con \(U=4t\) y \(U=20t\) halle la energía del singlete, la doble ocupación y el desdoblamiento frente a \(4t^2/U\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Matriz.</b> En la base \(\{|S\rangle,|D_+\rangle\}\): \(\begin{pmatrix}0&-2t\\-2t&U\end{pmatrix}\); autovalores \(\tfrac U2\pm\sqrt{\tfrac{U^2}4+4t^2}\).</li>
<li><b>\(U=4t\).</b> \(\sqrt{4+4}=2.8284\): \(E_S=2-2.8284=-0.8284\,t\).</li>
<li><b>Doble ocupación.</b> \(\langle D\rangle=\tfrac12\left(1-\dfrac{U/2}{\sqrt{U^2/4+4t^2}}\right)=\tfrac12\left(1-\dfrac2{2.8284}\right)=0.1464\).</li>
<li><b>\(U=20t\).</b> \(\sqrt{100+4}=10.198\): \(E_S=10-10.198=-0.1980\,t\); \(\langle D\rangle=\tfrac12(1-10/10.198)=0.00971\).</li>
<li><b>Heisenberg.</b> \(4t^2/U\): \(1.0\,t\) y \(0.2\,t\); el cociente \(|E_S|/(4t^2/U)\) vale 0.828 y 0.990.</li>
<li><b>Resultado.</b> <span class="ans">\(U=4t\): \(E_S=-0.8284t\), \(\langle D\rangle=0.1464\); \(U=20t\): \(E_S=-0.1980t\), \(\langle D\rangle=0.0097\); \(J\to4t^2/U\) para \(U\gg t\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Calcule \(T_c\) para \(^{87}\)Rb con \(n=10^{20}\) m\(^{-3}\) y para \(^4\)He líquido (\(n=2.18\times10^{28}\) m\(^{-3}\)), la longitud de onda térmica en \(T_c\) y la fracción condensada de Rb a \(0.7\,T_c\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Fórmula.</b> \(T_c=\dfrac{2\pi\hbar^2}{mk_B}\left(\dfrac n{2.612}\right)^{2/3}\).</li>
<li><b>Rb.</b> \(m=86.909\) u \(=1.4432\times10^{-25}\) kg: \(\dfrac{2\pi\hbar^2}{mk_B}=3.507\times10^{-20}\) K·m²; \((n/2.612)^{2/3}=(3.828\times10^{19})^{2/3}=1.136\times10^{13}\) m\(^{-2}\): \(T_c=3.98\times10^{-7}\) K \(=398\) nK.</li>
<li><b>He.</b> \(m=4.0026\) u: \(T_c=3.13\) K.</li>
<li><b>Longitud térmica.</b> Rb: \(\lambda_T(T_c)=297\) nm; He: 0.493 nm.</li>
<li><b>Fracción.</b> \(1-0.7^{3/2}=1-0.5857=0.4143\).</li>
<li><b>Resultado.</b> <span class="ans">Rb: \(T_c=398\) nK, \(\lambda_T=297\) nm; He: \(T_c=3.13\) K, \(\lambda_T=0.493\) nm; \(N_0/N=0.414\) a \(0.7\,T_c\).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Deduzca \(E_F\) a partir de la densidad de estados, la energía media \(\tfrac35E_F\) y la presión de degeneración; evalúe la presión del cobre.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Densidad de estados.</b> \(g(\varepsilon)=\dfrac V{2\pi^2}\left(\dfrac{2m}{\hbar^2}\right)^{3/2}\sqrt\varepsilon\) (con el factor 2 de espín).</li>
<li><b>Número.</b> \(N=\int_0^{E_F}g\,\dd\varepsilon=\dfrac V{3\pi^2}\left(\dfrac{2mE_F}{\hbar^2}\right)^{3/2}\Rightarrow E_F=\dfrac{\hbar^2}{2m}(3\pi^2n)^{2/3}\).</li>
<li><b>Energía.</b> \(U=\int_0^{E_F}\varepsilon g\,\dd\varepsilon=\tfrac35NE_F\) (porque \(g\propto\sqrt\varepsilon\)).</li>
<li><b>Presión.</b> \(P=-\partial U/\partial V\) con \(E_F\propto V^{-2/3}\): \(U\propto V^{-2/3}\Rightarrow P=\tfrac23\dfrac UV=\tfrac25nE_F\).</li>
<li><b>Cobre.</b> \(P=0.4\times8.47\times10^{28}\times1.1268\times10^{-18}=3.82\times10^{10}\) Pa (382 kbar).</li>
<li><b>Resultado.</b> <span class="ans">\(E_F=\frac{\hbar^2}{2m}(3\pi^2n)^{2/3}\); \(\bar E=\tfrac35E_F=4.22\) eV por electrón; \(P=\tfrac25nE_F=3.8\times10^{10}\) Pa para el Cu.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Construya con la transformación de Jordan–Wigner los cuatro operadores \(c_{i\sigma}\) del dímero de Hubbard (matrices \(16\times16\)), verifique \(\{c_i,c_j^\dagger\}=\delta_{ij}\) y diagonalícelo para \(t=1\), \(U=4\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Operadores.</b> \(c_j=\sigma^z\otimes\cdots\otimes\sigma^z\otimes\sigma^-_j\otimes1\otimes\cdots\otimes1\) para \(M=4\) modos (dimensión 16): la cadena de \(\sigma^z\) a la izquierda produce los signos fermiónicos.</li>
<li><b>Álgebra.</b> El máximo de \(|\{c_i,c_j^\dagger\}-\delta_{ij}|\) y de \(|\{c_i,c_j\}|\) es exactamente 0.</li>
<li><b>Hamiltoniano.</b> \(H=-t\sum_\sigma(c^\dagger_{1\sigma}c_{2\sigma}+\text{h.c.})+U(n_{1\uparrow}n_{1\downarrow}+n_{2\uparrow}n_{2\downarrow})\).</li>
<li><b>Espectro (\(t=1\), \(U=4\)).</b> \(-1\ (\times2),\ -0.8284,\ 0\ (\times4),\ 1\ (\times2),\ 3\ (\times2),\ 4\ (\times2),\ 4.8284,\ 5\ (\times2),\ 8\).</li>
<li><b>Identificación.</b> \(-0.8284=E_S\) y \(4.8284\) son los singletes del sector \(N=2\); el \(0\) (triple) es el triplete; \(\pm1\) son los sectores de uno y tres electrones; el 8 es \(N=4\) (\(2U\)).</li>
<li><b>Resultado.</b> <span class="ans">Anticonmutadores exactos; el espectro contiene \(E_S=-0.8284\) y \(U/2+\sqrt{U^2/4+4t^2}=4.8284\) y concuerda con la fórmula analítica de dos niveles.</span></li>
</ol></details></li>
</ol>
