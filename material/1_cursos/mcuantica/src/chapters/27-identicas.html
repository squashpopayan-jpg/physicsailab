<template class="chapter-src" data-id="identicas" data-num="27" data-title="Partículas idénticas y el helio" data-part="Parte VI · Muchos cuerpos" data-short="Indistinguibilidad cuántica, simetrización de la función de onda, bosones y fermiones, el principio de exclusión, la energía de intercambio y la estructura del helio: orto y paraelio">
<p class="lead">En mecánica clásica dos electrones se pueden seguir uno a uno, aunque sean idénticos. En mecánica cuántica no: si se intercambian dos partículas idénticas, el estado del sistema es el mismo, y eso restringe las funciones de onda a dos clases, simétricas (bosones) y antisimétricas (fermiones). La consecuencia más inmediata es el principio de exclusión de Pauli, que organiza la tabla periódica; la más sutil es la <em>interacción de intercambio</em>, una energía sin análogo clásico que decide el magnetismo, el enlace químico y la estructura del helio.</p>

<section>
<h2>El postulado de simetrización</h2>
<p>El operador de permutación \(\hat P_{12}\) intercambia todas las coordenadas (posición y espín) de dos partículas idénticas, \(\hat P_{12}\Psi(1,2)=\Psi(2,1)\). Como las partículas son indistinguibles, \([\hat P_{12},H]=0\) y \(\hat P_{12}^2=1\): los autovalores son \(\pm1\). El <span class="term">postulado de simetrización</span> afirma que solo una de las dos clases existe para cada especie:</p>
<div class="eq key" data-name="Bosones y fermiones">\[\Psi(2,1)=+\Psi(1,2)\ \ \text{(bosones: espín entero)},\qquad\Psi(2,1)=-\Psi(1,2)\ \ \text{(fermiones: espín semientero)}.\]</div>
<p>La relación entre espín y estadística (Pauli, 1940) se demuestra en la teoría cuántica de campos relativista. Los electrones, protones, neutrones y quarks son fermiones, los fotones, mesones y los átomos con un número par de fermiones (\(^4\)He) son bosones. Con partículas independientes en orbitales \(\phi_a,\phi_b\), la función de dos partículas es el <em>producto simetrizado</em> o antisimetrizado: \(\Psi_\pm=\tfrac1{\sqrt2}[\phi_a(1)\phi_b(2)\pm\phi_b(1)\phi_a(2)]\), y para \(N\) fermiones, el <strong>determinante de Slater</strong> \(\Psi=\tfrac1{\sqrt{N!}}\det[\phi_i(\mathbf r_j)]\). Si dos orbitales (espacio y espín) coinciden, el determinante tiene dos filas iguales y se anula: <span class="term">el principio de exclusión</span>: dos fermiones no pueden ocupar el mismo estado. Los bosones, en cambio, pueden acumularse en el mismo estado (condensación de Bose–Einstein, láser).</p>
<p>La simetrización no es una fuerza, pero tiene consecuencias dinámicas. Para dos partículas en estados \(a\ne b\), la distancia cuadrática media es</p>
<div class="eq">\[\langle(x_1-x_2)^2\rangle_\pm=\langle x^2\rangle_a+\langle x^2\rangle_b-2\langle x\rangle_a\langle x\rangle_b\ \mp\ 2\,|\langle a|x|b\rangle|^2 .\]</div>
<p>El último término, el de intercambio, acerca a los bosones y aleja a los fermiones: es una «atracción» o «repulsión» efectiva puramente estadística. Para dos fermiones de espín paralelo la función espacial es antisimétrica y se anula en \(x_1=x_2\): el hueco de intercambio (o de Fermi) que evita que dos electrones del mismo espín se acerquen, y por tanto reduce su repulsión de Coulomb.</p>
<div class="sim" data-sim="idem-caja" data-title="Dos partículas idénticas en una caja: simetrización, hueco de Fermi y agrupamiento de bosones"></div>
<div class="sim-guide"><ul>
<li>Estados \(n_A=1\), \(n_B=2\) en una caja de longitud \(L\): \(\langle x\rangle_{12}=-16L/9\pi^2=-0.18013L\). Distinguibles: \(\langle(x_1-x_2)^2\rangle=0.10334L^2\); bosones (simétrica): \(0.03845L^2\) (más juntos); fermiones (antisimétrica): \(0.16823L^2\) (más lejos). La probabilidad de estar ambos en la misma mitad de la caja es \(0.860\) para bosones y \(0.140\) para fermiones.</li>
<li>La energía de primer orden de una interacción de contacto repulsiva \(g\delta(x_1-x_2)\) vale \(g/L\) para distinguibles, \(2g/L\) para bosones y \(0\) para fermiones: el hueco de Fermi apaga la interacción de contacto. Con \(n_A=n_B=1\), solo hay bosones (\(1.5\,g/L\)): los fermiones no pueden ocupar el mismo estado espacial con el mismo espín.</li>
</ul></div>
</section>

<section>
<h2>Espín, simetría espacial y el helio excitado</h2>
<p>Como \(\Psi\) total debe ser antisimétrica (electrones), cada simetría espacial se acopla con la simetría de espín contraria: el <em>singlete</em> de espín (\(S=0\), antisimétrico, capítulo 16) va con una parte espacial simétrica, y el <em>triplete</em> (\(S=1\), simétrico) con una espacial antisimétrica. En el átomo de helio, el repulsión \(1/r_{12}\) hace que la energía dependa de la simetría espacial: con orbitales \(1s\) y \(2s\) (configuración \(1s2s\)),</p>
<div class="eq key" data-name="Energía de intercambio en el helio excitado">\[E_{\text{triplete}}=E_0+J-K,\qquad E_{\text{singlete}}=E_0+J+K,\qquad J=\iint\frac{|\psi_{1s}(1)|^2|\psi_{2s}(2)|^2}{r_{12}},\quad K=\iint\frac{\psi_{1s}^*(1)\psi_{2s}^*(2)\,\psi_{2s}(1)\psi_{1s}(2)}{r_{12}} .\]</div>
<p>\(J\) es la repulsión de Coulomb entre las dos distribuciones de carga y \(K>0\) la <span class="term">integral de intercambio</span>, que no tiene análogo clásico. El estado triplete tiene menor energía que el singlete (por \(2K\)) porque los electrones con espín paralelo se evitan y se repelen menos: es el origen de la <strong>regla de Hund</strong> y del ferromagnetismo (la interacción de Heisenberg \(-2\mathcal J\,\mathbf S_1\cdot\mathbf S_2\) es una forma efectiva de esta energía). Por eso el helio tiene dos «especies»: el <em>parahelio</em> (singletes, \(S=0\)) y el <em>ortohelio</em> (tripletes, \(S=1\)) que, sin interacción espín–órbita fuerte, casi no se mezclan: el nivel \(2^3S\) es metaestable (vida media de unos 8000 s) porque la transición al fundamental (singlete) exige cambiar el espín. Con orbitales hidrogenoides de carga \(Z\) iguales: \(J=\tfrac{17}{81}Z\) y \(K=\tfrac{16}{729}Z\) hartree.</p>
<div class="sim" data-sim="helio-orto" data-title="Helio 1s2s: integrales de Coulomb y de intercambio, triplete y singlete"></div>
<div class="sim-guide"><ul>
<li>Con \(Z_1=Z_2=2\): \(J=0.41975\) y \(K=0.04390\) hartree (coinciden con \(17Z/81\) y \(16Z/729\)) y el desdoblamiento \(2K=2.389\) eV, tres veces el medido (0.796 eV): los orbitales hidrogenoides sin apantallar comprimen demasiado el \(2s\) y sobreestiman el solapamiento con el \(1s\).</li>
<li>Con \(Z_1=2\), \(Z_2=1\) (el \(2s\) apantallado por el \(1s\)): \(J=0.22848\), \(K=0.05407\), \(E_0=-2.125\), triplete en \(-1.95059\) y singlete en \(-1.84245\). Con \(Z_2=0.6\) (más difuso), \(2K=1.681\) eV: el desdoblamiento baja al hacerse menor el solapamiento. En todos los casos \(K>0\) y el triplete queda <em>por debajo</em> del singlete, como en el experimento.</li>
</ul></div>
</section>

<section>
<h2>Estadística y conteo de estados</h2>
<p>Las dos clases de partículas tienen también estadísticas de ocupación distintas en un gas en equilibrio a temperatura \(T\) y potencial químico \(\mu\): para los niveles de energía \(\varepsilon\),</p>
<div class="eq key" data-name="Distribuciones cuánticas">\[\bar n_\text{FD}=\frac1{\ee^{(\varepsilon-\mu)/kT}+1}\le1,\qquad\bar n_\text{BE}=\frac1{\ee^{(\varepsilon-\mu)/kT}-1}\ (\mu<\varepsilon),\qquad\bar n_\text{MB}=\ee^{-(\varepsilon-\mu)/kT} .\]</div>
<p>Las dos coinciden con la de Boltzmann cuando \(\bar n\ll1\) (gas diluido o alta temperatura). El conteo de microestados de \(N\) partículas en \(M\) niveles lo muestra directamente: \(M^N\) distinguibles, \(\binom{M+N-1}N\) bosones y \(\binom MN\) fermiones, y la probabilidad de que dos partículas estén en el mismo nivel es \(1/M\), \(2/(M+1)\) y \(0\): los bosones «se agrupan» y los fermiones «se evitan». La distribución de Fermi–Dirac explica las propiedades de los electrones en los metales y de las enanas blancas; la de Bose–Einstein, la radiación del cuerpo negro (capítulo 1) y la condensación.</p>
<div class="sim" data-sim="estadisticas" data-title="Contar estados: distinguibles, bosones y fermiones; funciones de distribución"></div>
<div class="sim-guide"><ul>
<li>Dos partículas en tres niveles: \(9\) estados distinguibles, \(6\) bosónicos y \(3\) fermiónicos; la probabilidad de coincidir es \(0.333\), \(0.500\) y \(0\). Con tres partículas en cinco niveles: \(125\), \(35\) y \(10\).</li>
<li>Con \((\varepsilon-\mu)/kT=1\): \(\bar n_\text{FD}=0.2689\), \(\bar n_\text{MB}=0.3679\) y \(\bar n_\text{BE}=0.5820\); \(\bar n_\text{FD}\lt\bar n_\text{MB}\lt\bar n_\text{BE}\) siempre (exclusión frente a agrupamiento), y las tres coinciden para \(\varepsilon-\mu\gg kT\).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Cuente los microestados de (a) dos partículas en 3 niveles y (b) tres partículas en 5 niveles, para distinguibles, bosones y fermiones, y la probabilidad de que dos partículas estén en el mismo nivel en (a).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Fórmulas.</b> Distinguibles: \(M^N\); bosones: \(\binom{M+N-1}N\); fermiones: \(\binom MN\).</li>
<li><b>(a) \(N=2\), \(M=3\).</b> \(9\); \(\binom42=6\); \(\binom32=3\).</li>
<li><b>(b) \(N=3\), \(M=5\).</b> \(125\); \(\binom73=35\); \(\binom53=10\).</li>
<li><b>Coincidencia en (a).</b> Distinguibles: \(3/9=\tfrac13\); bosones: \(3/6=\tfrac12\) (los 3 estados con ambos en el mismo nivel); fermiones: \(0/3=0\).</li>
<li><b>Resultado.</b> <span class="ans">(a) 9, 6, 3 con probabilidades \(\tfrac13,\tfrac12,0\); (b) 125, 35, 10. En general \(2/(M+1)\) para bosones.</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Dos partículas idénticas en una caja de longitud \(L=1\), en los estados \(n=1\) y \(n=2\). Calcule \(\langle(x_1-x_2)^2\rangle\) para distinguibles, simétrica y antisimétrica.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Momentos.</b> \(\langle x\rangle=\tfrac L2\); \(\langle x^2\rangle_n=L^2\left(\tfrac13-\tfrac1{2n^2\pi^2}\right)\): \(\langle x^2\rangle_1=0.28267\), \(\langle x^2\rangle_2=0.32067\).</li>
<li><b>Distinguibles.</b> \(0.28267+0.32067-2\times0.25=0.10334\).</li>
<li><b>Elemento de intercambio.</b> \(\langle1|x|2\rangle=\dfrac2L\int_0^Lx\sin\tfrac{\pi x}L\sin\tfrac{2\pi x}L\dd x=-\dfrac{16L}{9\pi^2}=-0.18013\); su cuadrado \(0.032446\).</li>
<li><b>Simétrica.</b> \(0.10334-2\times0.032446=0.03845\).</li>
<li><b>Antisimétrica.</b> \(0.10334+2\times0.032446=0.16823\).</li>
<li><b>Resultado.</b> <span class="ans">\(0.10334\), \(0.03845\) y \(0.16823\) (en \(L^2\)): los bosones se acercan, los fermiones se alejan.</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Con una interacción de contacto \(V=g\,\delta(x_1-x_2)\) calcule el desplazamiento de energía de primer orden para: bosones ambos en \(n=1\); el estado \((1,2)\) simétrico, antisimétrico y distinguible.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Fórmula.</b> \(\Delta E=g\int_0^L|\Psi(x,x)|^2\dd x\).</li>
<li><b>Bosones (1,1).</b> \(\Psi=\phi_1(x_1)\phi_1(x_2)\): \(\Delta E=g\int\phi_1^4\dd x=g\dfrac4{L^2}\cdot\dfrac{3L}8=\dfrac{3g}{2L}\).</li>
<li><b>Distinguibles (1,2).</b> \(g\int\phi_1^2\phi_2^2\dd x=g\dfrac4{L^2}\cdot\dfrac L4=\dfrac gL\).</li>
<li><b>Simétrica.</b> \(\Psi(x,x)=\sqrt2\phi_1\phi_2\): \(\Delta E=2\times\dfrac gL=\dfrac{2g}L\).</li>
<li><b>Antisimétrica.</b> \(\Psi(x,x)=0\): \(\Delta E=0\).</li>
<li><b>Resultado.</b> <span class="ans">\(\tfrac{3g}{2L}\) (bosones 1,1); \(\tfrac gL\) (distinguibles); \(\tfrac{2g}L\) (simétrica); \(0\) (antisimétrica).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Para el helio \(1s2s\) con orbitales hidrogenoides de \(Z=2\) halle \(J\), \(K\), el desdoblamiento singlete–triplete y compárelo con el experimental (0.796 eV).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Fórmulas.</b> Con \(R_{10}=2Z^{3/2}\ee^{-Zr}\) y \(R_{20}=\tfrac{Z^{3/2}}{\sqrt2}(1-\tfrac{Zr}2)\ee^{-Zr/2}\), los promedios angulares de \(1/r_{12}\) dan \(1/r_>\) y las integrales radiales resultan \(J=\tfrac{17}{81}Z\), \(K=\tfrac{16}{729}Z\).</li>
<li><b>Valores.</b> \(J=\tfrac{34}{81}=0.41975\) hartree; \(K=\tfrac{32}{729}=0.043896\) hartree.</li>
<li><b>Desdoblamiento.</b> \(2K=0.087791\) hartree \(=2.389\) eV.</li>
<li><b>Comparación.</b> \(2.389/0.796=3.0\): el modelo hidrogenoide triplica el valor real (los orbitales reales están más extendidos).</li>
<li><b>Signo.</b> Triplete \(=E_0+J-K\), singlete \(=E_0+J+K\): el triplete queda por debajo, de acuerdo con el experimento (\(2^3S\) a 19.82 eV, \(2^1S\) a 20.62 eV) y con la regla de Hund.</li>
<li><b>Resultado.</b> <span class="ans">\(J=0.4198\), \(K=0.04390\) hartree; \(2K=2.389\) eV (experimento 0.796 eV); el triplete es el más bajo.</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Halle la energía del estado fundamental de \(N=3\) y \(N=4\) partículas de espín \(\tfrac12\) en un oscilador armónico 1D (\(\hbar\omega\)), y de tres bosones.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Niveles.</b> \(E_n=(n+\tfrac12)\hbar\omega\); cada nivel acepta 2 fermiones (espín \(\uparrow\downarrow\)).</li>
<li><b>\(N=3\).</b> Dos en \(n=0\) y uno en \(n=1\): \(2\times\tfrac12+\tfrac32=\tfrac52\hbar\omega\).</li>
<li><b>\(N=4\).</b> Dos en \(n=0\) y dos en \(n=1\): \(2\times\tfrac12+2\times\tfrac32=4\hbar\omega\).</li>
<li><b>Tres bosones.</b> Todos en \(n=0\): \(\tfrac32\hbar\omega\).</li>
<li><b>Energía de Fermi.</b> Para \(N\) par, \(E_F=(N/2-\tfrac12)\hbar\omega\) (el último nivel ocupado): \(1.5\hbar\omega\) con \(N=4\).</li>
<li><b>Resultado.</b> <span class="ans">\(\tfrac52\hbar\omega\) (\(N=3\)), \(4\hbar\omega\) (\(N=4\)) y \(\tfrac32\hbar\omega\) para tres bosones: el principio de Pauli eleva la energía \(\tfrac52-\tfrac32=1\ \hbar\omega\).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Muestre que el determinante de Slater de tres orbitales ortonormales está normalizado con \(1/\sqrt{3!}\), que es antisimétrico y que se anula si dos orbitales coinciden. Verifique la normalización numérica con tres estados de una caja.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Desarrollo.</b> \(\Psi=\tfrac1{\sqrt6}\sum_{P}(-1)^P\phi_{P(1)}(1)\phi_{P(2)}(2)\phi_{P(3)}(3)\): 6 términos con signo \(\pm\).</li>
<li><b>Normalización.</b> \(\langle\Psi|\Psi\rangle=\tfrac16\sum_{P,Q}(-1)^{P+Q}\prod\langle\phi_{P(i)}|\phi_{Q(i)}\rangle\): por ortonormalidad solo sobreviven \(P=Q\) (6 términos de valor 1): \(\tfrac16\times6=1\) ✓.</li>
<li><b>Antisimetría.</b> Intercambiar dos coordenadas intercambia dos columnas del determinante: cambia el signo.</li>
<li><b>Exclusión.</b> Dos orbitales iguales dan dos filas iguales: \(\det=0\).</li>
<li><b>Numérico.</b> Con \(\phi_n=\sqrt2\sin n\pi x\) (\(n=1,2,3\)) la integral de \(|\Psi|^2\) sobre \([0,1]^3\) vale \(1.0000\); con \(n=(1,2,2)\): 0.</li>
<li><b>Resultado.</b> <span class="ans">\(\Psi=\tfrac1{\sqrt6}\det[\phi_i(x_j)]\), norma 1, antisimétrico y nulo con orbitales repetidos (principio de exclusión).</span></li>
</ol></details></li>
</ol>
