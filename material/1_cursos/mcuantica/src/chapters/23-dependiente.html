<template class="chapter-src" data-id="dependiente" data-num="23" data-title="Perturbaciones dependientes del tiempo y regla de oro" data-part="Parte IV · Métodos de aproximación" data-short="Teoría de perturbaciones dependiente del tiempo, pulsos y relación tiempo–frecuencia, regla de oro de Fermi, decaimiento exponencial y reaparición de Poincaré, coeficientes de Einstein y emisión estimulada">
<p class="lead">Hasta ahora hemos buscado niveles de energía. Pero la espectroscopía mide <em>transiciones</em>: la luz y los campos externos dependen del tiempo, los átomos absorben y emiten y los estados excitados tienen una vida media. La teoría de perturbaciones dependiente del tiempo calcula la probabilidad de que un sistema salte de un estado propio de \(H_0\) a otro bajo un campo débil, y su resultado más importante, la regla de oro de Fermi, da la tasa de transición a un continuo de estados: la base de la desintegración nuclear, la absorción de la luz, la dispersión de electrones y el láser.</p>

<section>
<h2>La amplitud de primer orden</h2>
<p>Sea \(H=H_0+V(t)\), con \(H_0|n\rangle=E_n|n\rangle\) y el sistema en \(|i\rangle\) en \(t=0\). Se expande \(|\psi(t)\rangle=\sum_nc_n(t)\ee^{-\ii E_nt/\hbar}|n\rangle\) y se sustituye en la ecuación de Schrödinger; las amplitudes cumplen el sistema acoplado exacto \(\ii\hbar\dot c_f=\sum_nV_{fn}(t)\ee^{\ii\omega_{fn}t}c_n\) con \(\omega_{fn}=(E_f-E_n)/\hbar\). Con \(c_i=1\) y \(c_n=0\) en orden cero, la primera corrección para \(f\neq i\) es</p>
<div class="eq key" data-name="Amplitud de transición de primer orden">\[c_f^{(1)}(t)=-\frac\ii\hbar\int_0^tV_{fi}(t')\,\ee^{\ii\omega_{fi}t'}\,\dd t',\qquad P_{i\to f}(t)=|c_f^{(1)}(t)|^2 .\]</div>
<p>La amplitud es la <em>transformada de Fourier</em> de \(V_{fi}(t)\) a la frecuencia \(\omega_{fi}\). Para una perturbación armónica \(V(t)=V_0\cos\omega t\) (luz de frecuencia \(\omega\)), solo el término resonante, \(\tfrac12V_0\ee^{-\ii\omega t}\), contribuye cuando \(\omega\approx\omega_{fi}\) (aproximación de onda rotante), y para un pulso cuadrado de duración \(T\) y desintonía \(\Delta=\omega_{fi}-\omega\):</p>
<div class="eq">\[P(T)=\frac{|V_{fi}|^2}{\hbar^2}\left[\frac{\sin(\Delta T/2)}{\Delta/2}\right]^2\quad\xrightarrow{\ \Delta=0\ }\quad\left(\frac{\Omega T}2\right)^2,\qquad\Omega=\frac{|V_{fi}|}\hbar .\]</div>
<p>La función \(\sin^2(\Delta T/2)/(\Delta/2)^2\) tiene un máximo \(T^2\) en \(\Delta=0\), su primer cero en \(\Delta=2\pi/T\) y una anchura a mitad de altura de \(5.566/T\): un pulso más corto excita en un intervalo de frecuencias más ancho. Es la <span class="term">relación de incertidumbre tiempo–frecuencia</span> \(\Delta\omega\,\Delta t\gtrsim1\) (capítulo 3), y para otras formas la anchura cambia (la gaussiana tiene un espectro gaussiano, sin lóbulos laterales). La teoría vale mientras \(P\ll1\); cuando \(\Omega T\) se acerca a 1 el sistema se mueve a otro estado y hay que usar la solución exacta de dos niveles (Rabi, capítulo 5).</p>
<div class="sim" data-sim="pulso-tdpt" data-title="Pulsos y perturbaciones: la probabilidad de primer orden es el espectro del pulso"></div>
<div class="sim-guide"><ul>
<li>Pulso cuadrado con \(\Omega=0.1\), \(T=12\), \(\Delta=0\): primer orden \(P=(\Omega T/2)^2=0.36\); exacta (Rabi) \(\sin^2(0.6)=0.3188\): la teoría de perturbaciones sobreestima un 13 % porque ya \(\Omega T/2=0.6\) no es pequeño. Con \(\Delta=0.2\): \(0.2172\) frente a \(0.1897\). Con \(\Omega=0.03\) la diferencia cae por debajo del 2 %.</li>
<li>Cambie a un pulso gaussiano: el espectro no tiene lóbulos laterales (suave) pero es más ancho en el pico que el del cuadrado de igual duración. Alargue \(T\) y vea que la anchura baja como \(1/T\): el producto \(\Delta\omega\cdot T\) es una constante de orden 1 para cada forma.</li>
</ul></div>
</section>

<section>
<h2>La regla de oro de Fermi</h2>
<p>Con una perturbación constante (o armónica) que dura un tiempo \(t\) grande y un estado final dentro de un continuo, \(\sin^2(\Delta t/2)/(\Delta/2)^2\to2\pi t\,\delta(\Delta)\) (porque \(\int\sin^2(xt/2)/(x/2)^2\dd x=2\pi t\)): la probabilidad crece <em>linealmente</em> con \(t\) y define una tasa constante. Sumando sobre los estados finales con densidad \(\rho(E)\):</p>
<div class="eq key" data-name="Regla de oro de Fermi">\[\Gamma_{i\to f}=\frac{2\pi}\hbar\,|\langle f|V|i\rangle|^2\,\rho(E_f)\Big|_{E_f=E_i},\qquad\text{(armónica:)}\quad\Gamma=\frac{2\pi}\hbar\left|\frac{V_{fi}}2\right|^2\rho(E_i\pm\hbar\omega).\]</div>
<p>Aunque se deduce en primer orden y para tiempos cortos frente a la vida media, el resultado sirve a todos los tiempos: el decaimiento exacto de un estado discreto acoplado a un continuo es exponencial, \(|c_0(t)|^2=\ee^{-\Gamma t}\) (Weisskopf–Wigner, 1930), con el mismo \(\Gamma\), y la línea espectral es una lorentziana de anchura \(\hbar\Gamma\), que ensancha el nivel («anchura natural»: \(\Gamma\hbar=\hbar/\tau\)). Con un continuo <em>discretizado</em> (niveles a distancia \(\varepsilon\)) el decaimiento es exponencial solo durante un tiempo \(2\pi\hbar/\varepsilon\), el tiempo de retorno de Poincaré; después reaparece el estado inicial, con una amplitud atenuada por \(\ee^{-\Gamma T_\text{ret}}\). Es la distinción entre un continuo verdadero (decaimiento irreversible) y una caja finita.</p>
<div class="sim" data-sim="regla-oro" data-title="Un estado discreto acoplado a una banda de niveles: decaimiento exponencial y reaparición"></div>
<div class="sim-guide"><ul>
<li>Con \(V=0.01\), \(\varepsilon=0.1\) (\(\hbar=1\)): \(\Gamma=2\pi V^2/\varepsilon=6.283\times10^{-3}\), \(\tau=159.2\); el tiempo de retorno \(2\pi/\varepsilon=62.83\) llega cuando la supervivencia exponencial valdría \(\ee^{-\Gamma T}=0.674\): como \(\Gamma T_\text{ret}=0.395\) es pequeño, la reaparición es casi completa (0.6744 coincide con \(\ee^{-0.3948}\)). En el panel derecho, los pesos de los niveles propios trazan la lorentziana de anchura \(\Gamma\).</li>
<li>Con \(V=0.03\): \(\Gamma=0.0566\), \(\Gamma/\varepsilon=0.57\) (acoplamiento fuerte) y la supervivencia en \(T_\text{ret}\) cae a 0.029: el estado ha decaído antes de que el continuo discreto «se entere» de que es finito. La regla de oro exige \(\Gamma\) pequeño frente al ancho de banda \(N\varepsilon\), no frente a \(\varepsilon\).</li>
</ul></div>
</section>

<section>
<h2>Absorción, emisión estimulada y los coeficientes de Einstein</h2>
<p>Para un átomo en un campo de radiación isótropo con densidad de energía por frecuencia angular \(\rho(\omega)\), la regla de oro con la interacción dipolar \(V=-\mathbf d\cdot\mathbf E\) da tasas de absorción \(W_{12}=B_{12}\rho(\omega)\) y de emisión estimulada \(W_{21}=B_{21}\rho(\omega)\), con \(B_{21}=\pi|d_{12}|^2/(3\varepsilon_0\hbar^2)\) para un nivel sin degeneración. Einstein (1917) añadió la emisión <em>espontánea</em>, con tasa \(A_{21}\) independiente del campo, y las relacionó exigiendo que el equilibrio térmico con la radiación de Planck \(\rho(\omega)=\dfrac{\hbar\omega^3}{\pi^2c^3}\dfrac1{\ee^{\hbar\omega/kT}-1}\) reproduzca la distribución de Boltzmann \(N_2/N_1=\tfrac{g_2}{g_1}\ee^{-\hbar\omega/kT}\):</p>
<div class="eq key" data-name="Relaciones de Einstein">\[g_1B_{12}=g_2B_{21},\qquad\frac{A_{21}}{B_{21}}=\frac{\hbar\omega^3}{\pi^2c^3},\qquad\frac{\text{emisión estimulada}}{\text{emisión espontánea}}=\frac{B_{21}\rho}{A_{21}}=\bar n=\frac1{\ee^{\hbar\omega/kT}-1}.\]</div>
<p>Con \(\bar n\) el número medio de fotones por modo. El cociente entre emisión estimulada y espontánea es \(\bar n\): despreciable en el visible con radiación térmica de unos miles de kelvin y muy grande en microondas y radio, donde \(\bar n\gg1\): por eso el máser (microondas) es anterior al láser y por eso la línea de 21 cm es estimulada por el fondo cósmico. La emisión espontánea no aparece en la teoría con un campo clásico: surge de la cuantización del campo electromagnético (capítulo 35), donde \(\bar n\to\bar n+1\) y el «+1» es la emisión espontánea.</p>
<div class="sim" data-sim="einstein-ab" data-title="Ocupación de los modos térmicos: cuándo domina la emisión estimulada"></div>
<div class="sim-guide"><ul>
<li>Hα con radiación de 5800 K: \(h\nu/kT=3.780\), \(\bar n=0.0234\): la emisión estimulada es el 2.3 % de la espontánea (para \(A=4.41\times10^7\) s\(^{-1}\), \(B_{21}=4.70\times10^{21}\) m\(^3\)J\(^{-1}\)s\(^{-2}\)). Lyman-\(\alpha\): \(h\nu/kT=20.41\) y \(\bar n=1.4\times10^{-9}\): casi toda la emisión es espontánea y la absorción es \(3\bar nA=2.6\) s\(^{-1}\) (\(g_2/g_1=3\)).</li>
<li>La línea de 21 cm con el fondo cósmico de 2.725 K: \(h\nu/kT=0.0250\), \(\bar n=39.5\): la tasa estimulada, \(\bar nA=1.1\times10^{-13}\) s\(^{-1}\), supera 40 veces a la espontánea (\(2.9\times10^{-15}\) s\(^{-1}\)): el estado triplete se pobla casi estadísticamente (\(N_2/N_1\approx3\)).</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un pulso cuadrado resonante con \(\Omega=0.1\) (en unidades de \(1/T_0\)) dura \(T=12\). Calcule la probabilidad de excitación en primer orden y la exacta de Rabi, y el error relativo.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Primer orden.</b> \(P=(\Omega T/2)^2=(0.1\times12/2)^2=0.36\).</li>
<li><b>Exacta.</b> \(P=\sin^2(\Omega T/2)=\sin^2(0.6)=0.31882\).</li>
<li><b>Error.</b> \((0.36-0.31882)/0.31882=12.9\,\%\): la perturbación sobreestima porque ignora que el nivel de partida se despuebla.</li>
<li><b>Criterio.</b> \(\sin^2x\approx x^2\) con error relativo \(\approx x^2/3\): con \(x=0.6\) da 12 %.</li>
<li><b>Resultado.</b> <span class="ans">\(P^{(1)}=0.360\); \(P_\text{exacta}=0.3188\); error del 12.9 %. La teoría de primer orden exige \(\Omega T\ll1\).</span></li>
</ol></details></li>
<li><span class="lvl">Básico</span>Para un pulso cuadrado de duración \(T\), halle el primer cero del espectro de excitación y su anchura a mitad de altura. Para \(T=12\) dé los valores numéricos.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Espectro.</b> \(P(\Delta)\propto\sin^2(\Delta T/2)/(\Delta/2)^2=T^2\,\mathrm{sinc}^2(\Delta T/2)\).</li>
<li><b>Primer cero.</b> \(\sin(\Delta T/2)=0\Rightarrow\Delta=2\pi/T=0.5236\) (\(T=12\)).</li>
<li><b>Mitad de altura.</b> \(\mathrm{sinc}^2(u)=\tfrac12\) en \(u=1.39156\), luego \(\Delta=2u/T\) por cada lado y la anchura completa es \(4u/T=5.566/T=0.4639\).</li>
<li><b>Producto.</b> \(\Delta\omega\cdot T=5.566\) (un número de orden 1, ligado a la forma del pulso).</li>
<li><b>Resultado.</b> <span class="ans">Primer cero en \(2\pi/T=0.524\); anchura \(5.566/T=0.464\) para \(T=12\); \(\Delta\omega\,T=5.566\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Un nivel discreto se acopla con \(V=0.01\) a una banda de \(N=200\) niveles con separación \(\varepsilon=0.1\) (\(\hbar=1\)). Halle \(\Gamma\), \(\tau\), el tiempo de retorno de Poincaré y la supervivencia en ese instante; ¿qué pasa con \(V=0.03\)?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Densidad.</b> \(\rho=1/\varepsilon=10\) (niveles por unidad de energía).</li>
<li><b>Tasa.</b> \(\Gamma=2\pi V^2\rho=2\pi\times10^{-4}\times10=6.283\times10^{-3}\); \(\tau=1/\Gamma=159.15\).</li>
<li><b>Retorno.</b> \(T_\text{ret}=2\pi/\varepsilon=62.83\); \(\Gamma T_\text{ret}=(2\pi)^2V^2/\varepsilon^2=0.3948\).</li>
<li><b>Reaparición.</b> \(|c_0(T_\text{ret})|^2\approx\ee^{-\Gamma T_\text{ret}}=0.674\) (la exacta, 0.6744).</li>
<li><b>\(V=0.03\).</b> \(\Gamma=0.05655\), \(\Gamma T_\text{ret}=3.553\): \(\ee^{-3.553}=0.0286\), una reaparición casi invisible.</li>
<li><b>Resultado.</b> <span class="ans">\(\Gamma=6.28\times10^{-3}\), \(\tau=159\); \(T_\text{ret}=62.8\), supervivencia 0.674. Con \(V=0.03\): \(\Gamma=0.0566\), 0.029 en \(T_\text{ret}\).</span></li>
</ol></details></li>
<li><span class="lvl">Intermedio</span>Un átomo de hidrógeno en \(1s\) recibe un campo resonante \(E_0\cos\omega t\) con \(E_0=10^6\) V/m, \(\hbar\omega=E_{2p}-E_{1s}\). Con \(\langle2p_0|z|1s\rangle=0.7449\,a_0\) halle la frecuencia de Rabi y el tiempo en que la probabilidad de primer orden alcanza el 1 %.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Acoplamiento.</b> \(V_{fi}=eE_0z_{fi}=1.602\times10^{-19}\times10^6\times0.7449\times5.2918\times10^{-11}=6.316\times10^{-24}\) J.</li>
<li><b>Frecuencia de Rabi.</b> \(\Omega=V_{fi}/\hbar=5.989\times10^{10}\) rad/s.</li>
<li><b>Probabilidad.</b> En resonancia, \(P=(\Omega t/2)^2\).</li>
<li><b>Tiempo.</b> \(P=0.01\Rightarrow\Omega t/2=0.1\Rightarrow t=0.2/\Omega=3.34\) ps.</li>
<li><b>Comentario.</b> Es un campo de 1 MV/m, mucho menor que el campo en el átomo (\(5.1\times10^{11}\) V/m): la perturbación es débil, pero la excitación resonante es rápida.</li>
<li><b>Resultado.</b> <span class="ans">\(\Omega=5.99\times10^{10}\) rad/s; \(t_{1\%}=3.34\) ps (en la práctica, la anchura de línea limitará el tiempo coherente).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Deduzca \(A_{21}/B_{21}=\hbar\omega^3/\pi^2c^3\) y calcule \(B_{21}\) de Hα (\(A=4.41\times10^7\) s\(^{-1}\), 656.28 nm), el cociente estimulada/espontánea a 5800 K y la absorción de Lyman-\(\alpha\) en un cuerpo negro a esa temperatura.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Equilibrio.</b> \(N_1B_{12}\rho=N_2(A_{21}+B_{21}\rho)\) con \(N_2/N_1=\tfrac{g_2}{g_1}\ee^{-\hbar\omega/kT}\Rightarrow\rho=\dfrac{A_{21}/B_{21}}{\tfrac{g_1B_{12}}{g_2B_{21}}\ee^{\hbar\omega/kT}-1}\).</li>
<li><b>Identificación con Planck.</b> Para que coincida con \(\rho=\tfrac{\hbar\omega^3}{\pi^2c^3}(\ee^{\hbar\omega/kT}-1)^{-1}\) con cualquier \(T\): \(g_1B_{12}=g_2B_{21}\) y \(A_{21}/B_{21}=\hbar\omega^3/\pi^2c^3\).</li>
<li><b>Hα.</b> \(\omega=2\pi c/\lambda=2.870\times10^{15}\) rad/s: \(B_{21}=\dfrac{\pi^2c^3A}{\hbar\omega^3}=4.703\times10^{21}\) m\(^3\)J\(^{-1}\)s\(^{-2}\).</li>
<li><b>Cociente.</b> \(h\nu/kT=3.780\) a 5800 K: \(\bar n=1/(\ee^{3.780}-1)=0.02336\).</li>
<li><b>Lyman-\(\alpha\).</b> \(h\nu/kT=20.41\), \(\bar n=1.374\times10^{-9}\); \(W_{12}=(g_2/g_1)\bar nA_{21}=3\times1.374\times10^{-9}\times6.265\times10^8=2.58\) s\(^{-1}\).</li>
<li><b>Resultado.</b> <span class="ans">\(B_{21}(\mathrm H\alpha)=4.70\times10^{21}\) m³J\(^{-1}\)s\(^{-2}\); \(\bar n=0.0234\) (2.3 % de la espontánea); Lyman-\(\alpha\): \(\bar n=1.37\times10^{-9}\) y \(W_{12}=2.6\) s\(^{-1}\) frente a \(A=6.3\times10^8\) s\(^{-1}\).</span></li>
</ol></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que \(\int_{-\infty}^\infty\sin^2(xt/2)/(x/2)^2\,\dd x=2\pi t\) y deduzca con ello la regla de oro desde la probabilidad de primer orden de una perturbación constante.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li><b>Cambio de variable.</b> \(u=xt/2\), \(\dd x=2\dd u/t\): \(\int\dfrac{\sin^2u}{(u/t)^2}\dfrac{2\dd u}t=2t\int_{-\infty}^\infty\dfrac{\sin^2u}{u^2}\dd u\).</li>
<li><b>Integral conocida.</b> \(\int_{-\infty}^\infty\dfrac{\sin^2u}{u^2}\dd u=\pi\), luego el resultado es \(2\pi t\) ✓ (con \(t=5\): \(31.416\)).</li>
<li><b>Límite de tiempos largos.</b> \(\dfrac{\sin^2(\Delta t/2)}{(\Delta/2)^2}\to2\pi t\,\delta(\Delta)\), con \(\Delta=\omega_{fi}=(E_f-E_i)/\hbar\).</li>
<li><b>Probabilidad total.</b> \(P(t)=\dfrac{|V_{fi}|^2}{\hbar^2}\int\rho(E_f)\dd E_f\,2\pi t\,\delta\!\left(\tfrac{E_f-E_i}\hbar\right)=\dfrac{2\pi t}\hbar|V_{fi}|^2\rho(E_i)\) (con \(\delta(x/\hbar)=\hbar\,\delta(x)\)).</li>
<li><b>Tasa.</b> \(\Gamma=\dd P/\dd t=\dfrac{2\pi}\hbar|V_{fi}|^2\rho(E_i)\): la regla de oro.</li>
<li><b>Resultado.</b> <span class="ans">\(\int\sin^2(xt/2)/(x/2)^2\dd x=2\pi t\); \(\Gamma=\tfrac{2\pi}\hbar|V_{fi}|^2\rho\).</span></li>
</ol></details></li>
</ol>
