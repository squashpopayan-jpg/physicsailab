<p class="lead">Los cerámicos son los materiales más antiguos que el ser humano fabricó y algunos de los más avanzados que usa hoy: ladrillos y porcelana, pero también álabes de turbina, sustratos de microchips, implantes y blindajes. Su enlace iónico-covalente les da dureza, rigidez y estabilidad química y térmica, y también su gran debilidad, la fragilidad. Este capítulo muestra cómo se diseña con un material frágil.</p>

<section>
<h2>Silicatos y carbono</h2>
<p>La unidad estructural de los silicatos es el tetraedro \(\text{SiO}_4^{4-}\): un silicio rodeado por cuatro oxígenos, con enlace en buena parte covalente (44 % de carácter iónico, capítulo 2). Los tetraedros comparten vértices de muchas maneras: aislados (olivino), en cadenas (piroxenos), en láminas (arcillas como la caolinita, micas) o en redes tridimensionales (cuarzo, cristobalita, tridimita). Cuando la red tridimensional no tiene orden de largo alcance se obtiene el vidrio de sílice.</p>
<p>Los óxidos que se agregan al vidrio se clasifican por su papel. Los <span class="term">formadores de red</span> (SiO₂, B₂O₃) construyen la red; los <span class="term">modificadores</span> (Na₂O, CaO, K₂O) rompen enlaces Si–O–Si y crean oxígenos no puente, bajando la viscosidad y la temperatura de trabajo; los <span class="term">intermedios</span> (Al₂O₃, TiO₂) pueden hacer de ambos. El vidrio de ventana, sílice-sosa-cal, tiene ≈ 70 % SiO₂, 15 % Na₂O y 10 % CaO.</p>
<p>El carbono merece un lugar aparte: diamante (sp³, el material más duro y mejor conductor térmico a temperatura ambiente), grafito (láminas sp² unidas por fuerzas de van der Waals, lubricante y conductor), fullerenos (C₆₀), nanotubos y grafeno (capítulo 27).</p>
</section>

<section>
<h2>Defectos con neutralidad eléctrica</h2>
<p>En un cristal iónico cualquier defecto debe conservar la neutralidad. Además de los pares de Schottky y de Frenkel (capítulo 6), las impurezas de distinta valencia exigen defectos compensadores: al disolver CaO en ZrO₂, cada Ca²⁺ que sustituye a un Zr⁴⁺ crea media vacancia de oxígeno. Esa es la base de la circonia estabilizada con itria, un conductor de iones O²⁻ usado en sensores de oxígeno y celdas de combustible de óxido sólido. Algunos óxidos son no estequiométricos: el «FeO» real es Fe₁₋ₓO, con vacancias de hierro compensadas por iones Fe³⁺.</p>
</section>

<section>
<h2>Comportamiento mecánico</h2>
<p>A temperatura ambiente casi todos los cerámicos se rompen antes de deformarse plásticamente. Su resistencia la controlan los defectos (poros, grietas de mecanizado, inclusiones) a través de la mecánica de la fractura del capítulo 10, con tenacidades de solo 1–10 MPa√m. En tracción son difíciles de ensayar (las mordazas los rompen), por eso se mide la <span class="term">resistencia a la flexión</span> o módulo de rotura en tres o cuatro puntos:</p>
<div class="eq key" data-name="Resistencia a la flexión">\[\sigma_{fs}=\frac{3F_fL}{2bd^2}\ \ (\text{sección rectangular}),\qquad \sigma_{fs}=\frac{F_fL}{\pi R^3}\ \ (\text{sección circular}),\]</div>
<p>con \(F_f\) la carga de fractura, \(L\) la distancia entre apoyos, \(b\) y \(d\) el ancho y el espesor, y \(R\) el radio. La resistencia a la compresión es unas diez veces mayor, porque en compresión las grietas se cierran.</p>
<p>La <span class="term">porosidad</span>, inevitable en los cerámicos sinterizados, reduce el módulo y la resistencia:</p>
<div class="eq">\[E=E_0\left(1-1.9P+0.9P^2\right),\qquad \sigma_{fs}=\sigma_0\,\ee^{-nP},\]</div>
<p>donde \(P\) es la fracción volumétrica de poros y \(n\) una constante experimental (4–7). Un 5 % de poros baja el módulo de la alúmina de 393 a 357 GPa y su resistencia en un 20–30 %.</p>
<div class="sim" data-sim="flexural-test" data-title="Ensayo de flexión en tres puntos y efecto de la porosidad"></div>
<div class="sim-guide"><ul>
<li>Una barra circular de alúmina de 5 mm de radio, con apoyos a 40 mm, que se rompe a 3000 N tiene \(\sigma_{fs}=306\) MPa.</li>
<li>Aumente la porosidad: el módulo cae casi linealmente; la resistencia, exponencialmente.</li>
</ul></div>
</section>

<section>
<h2>Estadística de Weibull</h2>
<p>Como la resistencia depende del defecto más grande, que varía de una probeta a otra, la dispersión de los cerámicos es grande y crece la probabilidad de encontrar un defecto peligroso cuanto mayor es el volumen sometido a tensión. Weibull (1939) modeló esta idea del «eslabón más débil»:</p>
<div class="eq key" data-name="Distribución de Weibull">\[P_f(\sigma)=1-\exp\left[-\frac{V}{V_0}\left(\frac{\sigma}{\sigma_0}\right)^m\right],\]</div>
<p>donde \(P_f\) es la probabilidad de falla a un esfuerzo \(\sigma\), \(\sigma_0\) la resistencia característica (63 % de falla) del volumen de referencia \(V_0\), y \(m\) el <span class="term">módulo de Weibull</span>: 5–10 en cerámicos tradicionales, 15–25 en técnicos bien controlados, más de 50 en metales. Linealizando, \(\ln\ln[1/(1-P_f)]=m\ln\sigma-m\ln\sigma_0\): los datos ordenados, con \(P_{f,i}=(i-0.3)/(N+0.4)\), caen sobre una recta de pendiente \(m\).</p>
<p>Dos consecuencias para el diseño: el esfuerzo admisible para una probabilidad de falla de \(10^{-6}\) es una fracción pequeña de \(\sigma_0\) (con \(m=10\), el 25 %), y una pieza diez veces más grande es más débil, \(\sigma_2/\sigma_1=(V_1/V_2)^{1/m}\) (con \(m=10\), un 21 % menos).</p>
<div class="sim" data-sim="weibull" data-title="Ensayo de un lote de probetas y gráfica de Weibull"></div>
<div class="sim-guide"><ul>
<li>Ensaye 20 probetas con \(m=10\): el ajuste recupera \(m\) con un error de ±20 %; con 5 probetas, el error es mucho mayor.</li>
<li>Multiplique el volumen por 10: la curva se corre a la izquierda.</li>
<li>Lea el esfuerzo de diseño para \(P_f=10^{-4}\) y compárelo con la media del lote.</li>
</ul></div>
</section>

<section>
<h2>Vidrios: viscosidad y procesamiento</h2>
<p>Un vidrio no tiene una temperatura de fusión: se ablanda gradualmente. Su viscosidad cambia catorce órdenes de magnitud entre el horno y la temperatura ambiente, y el proceso se organiza alrededor de puntos de viscosidad fija:</p>
<div class="tablewrap"><table>
<tr><th>Punto</th><th class="c">Viscosidad (Pa·s)</th><th>Significado</th></tr>
<tr><td>De fusión</td><td class="c">10</td><td>el vidrio es un líquido que se puede afinar</td></tr>
<tr><td>De trabajo</td><td class="c">10³</td><td>se conforma fácilmente (soplado, prensado)</td></tr>
<tr><td>De ablandamiento</td><td class="c">4 × 10⁶</td><td>máxima temperatura de manipulación sin deformarse por su peso</td></tr>
<tr><td>De recocido</td><td class="c">10¹²</td><td>los esfuerzos internos se relajan en minutos</td></tr>
<tr><td>De deformación (strain)</td><td class="c">3 × 10¹³</td><td>por debajo, el vidrio se rompe antes de deformarse</td></tr>
</table></div>
<p>Entre esos puntos, la viscosidad sigue con buena precisión la ecuación de Vogel–Fulcher–Tammann:</p>
<div class="eq key" data-name="Ecuación de Vogel–Fulcher–Tammann">\[\log_{10}\eta=A+\frac{B}{T-T_0}.\]</div>
<p>Ajustada a los puntos de trabajo (1000 °C), ablandamiento (700 °C) y recocido (510 °C) del vidrio sílice-sosa-cal, predice el punto de deformación en 479 °C, contra los 470 °C que registra Callister (fig. 13.7): otra validación del modelo.</p>
<div class="sim" data-sim="glass-viscosity" data-title="Viscosidad de vidrios con la ecuación VFT"></div>
<div class="sim-guide"><ul>
<li>Compare los tres vidrios: el borosilicato, con menos modificadores, trabaja 250 °C más caliente que el sílice-sosa-cal; el vidrio al plomo, el más fluido, es el de la cristalería tallada. (La sílice pura no se ablanda por debajo de unos 1600 °C.)</li>
<li>Los puntos de deformación predichos por la VFT quedan a menos del 3 % de los medidos en los tres vidrios.</li>
<li>Lea la temperatura de cada punto de viscosidad para el vidrio elegido.</li>
</ul></div>
<h3>Vidrio templado</h3>
<p>Como el vidrio falla por grietas superficiales en tracción, se puede reforzar dejando su superficie en compresión. En el <span class="term">templado térmico</span>, la placa se calienta sobre la temperatura de transición vítrea y se enfrían sus caras con chorros de aire: la superficie se rigidiza primero, el interior se contrae después y tira de ella, y al final la superficie queda comprimida y el centro traccionado, con un perfil aproximadamente parabólico. Una carga de flexión debe vencer primero la compresión superficial. Si el vidrio se rompe, la energía almacenada lo fragmenta en pequeños trozos romos, lo que lo hace un vidrio de seguridad. El templado químico (intercambio de Na⁺ por K⁺, más grande) logra el mismo efecto en vidrios delgados, como los de los teléfonos.</p>
<div class="sim" data-sim="tempered-glass" data-title="Esfuerzos residuales del vidrio templado bajo flexión"></div>
<div class="sim-guide"><ul>
<li>Con 100 MPa de compresión superficial, la carga de flexión que rompe el vidrio crece de 50 a 150 MPa.</li>
<li>Observe la tracción en el centro: es la mitad de la compresión superficial. Una grieta que la alcance libera toda la energía.</li>
</ul></div>
</section>

<section>
<h2>Procesamiento y aplicaciones</h2>
<p>La mayoría de los cerámicos cristalinos se fabrican a partir de polvos: se conforman (prensado, colado en barbotina, extrusión, inyección) y se <span class="term">sinterizan</span> a 0.6–0.8 \(T_f\). La fuerza impulsora es la reducción de la energía superficial: por difusión, los cuellos entre partículas crecen, los poros se redondean y se cierran, y la pieza se contrae y se densifica. Los aditivos que forman una fase líquida aceleran el proceso. Los productos de arcilla (ladrillos, porcelana) se secan y se cuecen; el cemento Portland endurece por hidratación química, no por secado.</p>
<div class="tablewrap"><table>
<tr><th>Cerámico avanzado</th><th>Propiedad clave</th><th>Aplicación</th></tr>
<tr><td>Circonia parcialmente estabilizada</td><td>Tenacidad por transformación (tetragonal → monoclínica en la punta de la grieta)</td><td>Cuchillas, implantes dentales, recubrimientos de barrera térmica</td></tr>
<tr><td>Nitruro de silicio</td><td>Baja densidad, dureza, resistencia al choque térmico</td><td>Rodamientos híbridos, herramientas de corte</td></tr>
<tr><td>Carburo de silicio</td><td>Dureza, conductividad térmica, semiconductor de banda ancha</td><td>Blindajes, abrasivos, electrónica de potencia</td></tr>
<tr><td>Alúmina</td><td>Aislante, dura, biocompatible</td><td>Sustratos, bujías, prótesis de cadera</td></tr>
<tr><td>Titanato de bario y PZT</td><td>Ferro y piezoelectricidad (capítulo 21)</td><td>Condensadores, sensores, ecografía</td></tr>
</table></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una barra rectangular de 10 mm de ancho y 4 mm de espesor, con apoyos a 30 mm, se rompe a 400 N en tres puntos. Calcule \(\sigma_{fs}\).
<details><summary>Respuesta</summary><p>\(3(400)(0.030)/[2(0.010)(0.004)^2]=112.5\) MPa.</p></details></li>
<li><span class="lvl">Básico</span>Calcule el módulo de una alúmina con 5 % de porosidad (\(E_0=393\) GPa).
<details><summary>Respuesta</summary><p>\(393(1-0.095+0.00225)=357\) GPa.</p></details></li>
<li><span class="lvl">Intermedio</span>Con \(m=10\) y \(\sigma_0=300\) MPa, ¿qué probabilidad de falla tiene una pieza a 250 MPa? ¿Qué esfuerzo da \(P_f=10^{-6}\)?
<details><summary>Respuesta</summary><p>\(1-\exp[-(250/300)^{10}]=0.149\). \(\sigma=300(10^{-6})^{1/10}=75\) MPa.</p></details></li>
<li><span class="lvl">Intermedio</span>Si un cerámico con \(m=5\) tiene \(\sigma_0=400\) MPa en probetas de 1 cm³, ¿cuál es la resistencia característica de una pieza de 100 cm³?
<details><summary>Respuesta</summary><p>\(400(1/100)^{1/5}=159\) MPa.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que en el perfil parabólico de esfuerzos residuales \(\sigma(u)=-\sigma_s(3u^2-1)/2\), con \(u\) la coordenada reducida del espesor, la fuerza neta es nula y la tracción central vale \(\sigma_s/2\).
<details><summary>Respuesta</summary><p>\(\int_{-1}^1(3u^2-1)\,\dd u=2-2=0\). En \(u=0\): \(\sigma=\sigma_s/2\) (tracción); en \(u=\pm1\): \(-\sigma_s\) (compresión).</p></details></li>
</ol>
