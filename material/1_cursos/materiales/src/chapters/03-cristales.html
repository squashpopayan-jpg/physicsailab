<template class="chapter-src" data-id="cristales" data-num="3" data-title="Estructuras cristalinas" data-part="Parte II · Estructura" data-short="Redes, celdas unitarias y sistemas cristalinos; las estructuras FCC, BCC y HCP; densidad teórica; apilamiento compacto; estructuras cerámicas por cociente de radios; polimorfismo, anisotropía y sólidos amorfos">
<p class="lead">En un sólido cristalino los átomos se repiten con periodicidad en las tres direcciones del espacio. Basta describir una pequeña celda para conocer la posición de los \(10^{23}\) átomos de un centímetro cúbico. Este capítulo presenta las celdas de los metales y de los cerámicos más comunes y calcula con ellas propiedades medibles: la densidad, el empaquetamiento y la coordinación.</p>

<section>
<h2>Redes, bases y celdas unitarias</h2>
<p>Un cristal se describe con dos ingredientes: una <span class="term">red</span>, conjunto infinito de puntos que se ven idénticos desde cualquiera de ellos, y una <span class="term">base</span>, el grupo de átomos que se coloca en cada punto de la red. La <span class="term">celda unitaria</span> es el bloque, por lo general un paralelepípedo, que repetido por traslaciones llena el espacio. Se define con seis <span class="term">parámetros de red</span>: las longitudes de las aristas \(a,b,c\) y los ángulos entre ellas \(\alpha,\beta,\gamma\).</p>
<p>Bravais demostró en 1848 que solo hay catorce redes tridimensionales distintas, agrupadas en siete sistemas cristalinos según las relaciones entre los parámetros:</p>
<div class="tablewrap"><table>
<tr><th>Sistema</th><th class="c">Aristas</th><th class="c">Ángulos</th><th>Redes de Bravais</th><th>Ejemplo</th></tr>
<tr><td>Cúbico</td><td class="c">\(a=b=c\)</td><td class="c">\(\alpha=\beta=\gamma=90^\circ\)</td><td>P, I, F</td><td>Cu, Fe-α, NaCl</td></tr>
<tr><td>Hexagonal</td><td class="c">\(a=b\neq c\)</td><td class="c">\(\alpha=\beta=90^\circ,\ \gamma=120^\circ\)</td><td>P</td><td>Mg, Zn, grafito</td></tr>
<tr><td>Tetragonal</td><td class="c">\(a=b\neq c\)</td><td class="c">\(\alpha=\beta=\gamma=90^\circ\)</td><td>P, I</td><td>Sn-β, martensita, TiO₂</td></tr>
<tr><td>Romboédrico (trigonal)</td><td class="c">\(a=b=c\)</td><td class="c">\(\alpha=\beta=\gamma\neq90^\circ\)</td><td>R</td><td>Bi, calcita, Al₂O₃</td></tr>
<tr><td>Ortorrómbico</td><td class="c">\(a\neq b\neq c\)</td><td class="c">\(\alpha=\beta=\gamma=90^\circ\)</td><td>P, C, I, F</td><td>S, U, Fe₃C</td></tr>
<tr><td>Monoclínico</td><td class="c">\(a\neq b\neq c\)</td><td class="c">\(\alpha=\gamma=90^\circ\neq\beta\)</td><td>P, C</td><td>ZrO₂ (ambiente), yeso</td></tr>
<tr><td>Triclínico</td><td class="c">\(a\neq b\neq c\)</td><td class="c">\(\alpha\neq\beta\neq\gamma\neq90^\circ\)</td><td>P</td><td>K₂Cr₂O₇, feldespatos</td></tr>
</table></div>
<p class="ctrl-note">P: primitiva; I: centrada en el cuerpo; F: centrada en todas las caras; C: centrada en un par de caras; R: romboédrica.</p>

<section>
<h2>Las estructuras de los metales</h2>
<p>Como el enlace metálico no es direccional, los átomos de un metal se comportan como esferas duras que se empaquetan lo más densamente posible. Tres estructuras cubren la gran mayoría de los metales de uso técnico.</p>
<h3>Cúbica centrada en las caras (FCC)</h3>
<p>Átomos en los ocho vértices y en el centro de las seis caras. Cada vértice se comparte entre ocho celdas y cada cara entre dos, así que la celda contiene \(n=8\times\tfrac18+6\times\tfrac12=4\) átomos. Los átomos se tocan a lo largo de la diagonal de una cara: \(4R=a\sqrt2\), es decir \(a=2R\sqrt2\). Cada átomo tiene 12 vecinos más próximos (número de coordinación, NC = 12). Ejemplos: Cu, Al, Ni, Ag, Au, Pb, Pt, Fe-γ.</p>
<h3>Cúbica centrada en el cuerpo (BCC)</h3>
<p>Átomos en los vértices y uno en el centro: \(n=8\times\tfrac18+1=2\). Se tocan a lo largo de la diagonal del cubo: \(4R=a\sqrt3\). NC = 8. Ejemplos: Fe-α, Cr, Mo, W, Ta, Nb, V.</p>
<h3>Hexagonal compacta (HCP)</h3>
<p>Planos compactos apilados en secuencia ABAB. El prisma hexagonal contiene 6 átomos (12 vértices ×1/6, 2 caras ×1/2 y 3 interiores). Con esferas ideales, \(a=2R\) y \(c/a=\sqrt{8/3}=1.633\); los metales reales se apartan algo de ese valor (Mg 1.624, Ti 1.588, Zn 1.856). NC = 12. Ejemplos: Mg, Ti-α, Zn, Co, Cd, Zr.</p>
<div class="box def"><h4>Factor de empaquetamiento atómico</h4><p>Es la fracción del volumen de la celda ocupada por esferas sólidas: \(\text{FEA}=n\,\tfrac43\pi R^3/V_C\). Para FCC y HCP ideal vale \(\pi/(3\sqrt2)=0.74\), el máximo posible para esferas iguales (conjetura de Kepler, demostrada por Hales en 1998). Para BCC, \(\sqrt3\pi/8=0.68\); para la cúbica simple, \(\pi/6=0.52\).</p></div>
<div class="sim" data-sim="unit-cell-3d" data-title="Celdas unitarias en 3D con conteo de átomos, coordinación y empaquetamiento"></div>
<div class="sim-guide"><ul>
<li>Pase de esferas reducidas a esferas duras: en FCC verá que los átomos se tocan en la diagonal de las caras; en BCC, en la diagonal del cuerpo.</li>
<li>Active «resaltar vecinos» para contar los 12 vecinos del átomo de una cara en FCC y los 8 del átomo central en BCC.</li>
<li>Repita la celda 2×2×2: cada átomo de un vértice pertenece a ocho celdas a la vez.</li>
</ul></div>
</section>

<section>
<h2>Densidad teórica</h2>
<p>Con la estructura cristalina y el radio atómico se predice la densidad de un metal:</p>
<div class="eq key" data-name="Densidad teórica">\[\rho=\frac{n\,A}{V_C\,N_A},\]</div>
<p>donde \(n\) es el número de átomos por celda, \(A\) la masa atómica, \(V_C\) el volumen de la celda y \(N_A=6.022\times10^{23}\) mol⁻¹. El acuerdo con la densidad medida es una prueba directa del modelo de esferas en una red.</p>
<div class="box ex"><h4>Densidad del cobre</h4>
<p>El cobre es FCC con \(R=0.128\) nm y \(A=63.5\) g/mol. Calcule su densidad.</p>
<details><summary>Solución</summary><p>\(a=2R\sqrt2=0.362\) nm, \(V_C=a^3=4.75\times10^{-23}\) cm³. \(\rho=\dfrac{4(63.5)}{(4.75\times10^{-23})(6.022\times10^{23})}=8.89\) g/cm³, frente a 8.94 g/cm³ medidos.</p></details>
</div>
<div class="sim" data-sim="density-calc" data-title="Densidad calculada a partir de la celda contra densidad medida"></div>
<div class="sim-guide"><ul>
<li>Recorra los 17 metales: todos coinciden con la densidad medida dentro de un 2 %.</li>
<li>Asigne al hierro una estructura FCC con el mismo radio: la densidad sube un 9 %. Al calentarse por encima de 912 °C el hierro hace justamente ese cambio (capítulo 13) y se contrae.</li>
</ul></div>
</section>

<section>
<h2>Planos compactos y secuencias de apilamiento</h2>
<p>FCC y HCP tienen el mismo empaquetamiento porque ambas se construyen apilando el mismo plano compacto, en el que cada esfera toca a seis vecinas. Sobre una capa A, la segunda capa se asienta en uno de los dos conjuntos de huecos, B o C. La tercera capa puede repetir la posición de la primera (ABAB…, HCP) o ocupar la tercera posición (ABCABC…, FCC). En FCC los planos compactos son los {111}; en HCP, el plano basal (0001).</p>
<div class="sim" data-sim="stacking" data-title="Apilamiento de planos compactos: ABAB (HCP) contra ABCABC (FCC)"></div>
<div class="sim-guide"><ul>
<li>Agregue capas una a una y observe que en ABAB los huecos C quedan abiertos a lo largo de todo el eje \(c\), mientras que en ABC se tapan.</li>
<li>Introduzca una <span class="term">falla de apilamiento</span> (ABCABABC): un defecto plano de baja energía, frecuente en metales FCC como el cobre y el acero inoxidable austenítico.</li>
</ul></div>
<p>Los huecos entre las esferas también importan: en FCC hay 4 huecos octaédricos y 8 tetraédricos por celda. Átomos pequeños como el carbono, el nitrógeno y el hidrógeno se alojan en ellos (soluciones sólidas intersticiales, capítulo 6), y muchas estructuras cerámicas se describen como una red FCC de aniones con cationes en una fracción de esos huecos.</p>
</section>

<section>
<h2>Estructuras cerámicas</h2>
<p>En un cerámico iónico la estructura queda determinada por dos condiciones: la neutralidad eléctrica (la fórmula química) y el tamaño relativo de los iones. Un catión es estable rodeado del mayor número de aniones que puedan tocarlo sin que los aniones se superpongan. Esto conduce a valores críticos del cociente \(r_C/r_A\):</p>
<div class="tablewrap"><table>
<tr><th class="c">NC</th><th class="c">\(r_C/r_A\)</th><th>Geometría</th><th>Ejemplos</th></tr>
<tr><td class="c">2</td><td class="c">&lt; 0.155</td><td>Lineal</td><td>—</td></tr>
<tr><td class="c">3</td><td class="c">0.155–0.225</td><td>Triangular</td><td>B₂O₃</td></tr>
<tr><td class="c">4</td><td class="c">0.225–0.414</td><td>Tetraédrica</td><td>SiO₂, ZnS</td></tr>
<tr><td class="c">6</td><td class="c">0.414–0.732</td><td>Octaédrica</td><td>NaCl, MgO, Al₂O₃</td></tr>
<tr><td class="c">8</td><td class="c">0.732–1.0</td><td>Cúbica</td><td>CsCl, CaF₂</td></tr>
</table></div>
<p>Cada límite es geométrico. Para NC = 6, cuatro aniones en un plano tocan al catión y se tocan entre sí: \(2(r_C+r_A)=2\sqrt2\,r_A\), de donde \(r_C/r_A=\sqrt2-1=0.414\).</p>
<div class="sim" data-sim="radius-ratio" data-title="Cociente de radios y número de coordinación"></div>
<div class="sim-guide"><ul>
<li>Elija Na⁺ y Cl⁻ (0.564): coordinación 6, estructura de sal gema. Cambie a Cs⁺ y Cl⁻ (0.939): coordinación 8.</li>
<li>Reduzca el catión por debajo de 0.414 con NC = 6: el catión «baila» dentro del hueco y los aniones se tocan entre sí, una configuración inestable.</li>
</ul></div>
<h3>Estructuras tipo</h3>
<ul>
<li><b>Sal gema (NaCl)</b>, AX: aniones en FCC y cationes en todos los huecos octaédricos. NC 6:6. MgO, FeO, NiO, CaO.</li>
<li><b>Cloruro de cesio (CsCl)</b>, AX: aniones en los vértices de un cubo simple y catión al centro. NC 8:8. No es BCC, porque los dos sitios están ocupados por especies distintas.</li>
<li><b>Blenda de zinc (ZnS)</b>, AX: aniones en FCC y cationes en la mitad de los huecos tetraédricos. NC 4:4. Es la estructura de GaAs, SiC-β y, con un solo tipo de átomo, la del diamante, el Si y el Ge.</li>
<li><b>Fluorita (CaF₂)</b>, AX₂: cationes en FCC y aniones en todos los huecos tetraédricos. UO₂, ZrO₂ cúbica.</li>
<li><b>Perovskita (CaTiO₃)</b>, ABX₃: el ion grande en los vértices, el pequeño en el centro y el oxígeno en las caras. BaTiO₃ (ferroeléctrico, capítulo 21), SrTiO₃ y las perovskitas de haluro de las celdas solares.</li>
</ul>
<p>La densidad de un cerámico se calcula igual que la de un metal, contando unidades fórmula:</p>
<div class="eq">\[\rho=\frac{n'\left(\sum A_C+\sum A_A\right)}{V_C\,N_A}.\]</div>
<div class="box ex"><h4>Densidad del cloruro de sodio</h4>
<p>Con \(r_{\text{Na}^+}=0.102\) nm y \(r_{\text{Cl}^-}=0.181\) nm, y sabiendo que en la sal gema los iones se tocan a lo largo de la arista, calcule la densidad del NaCl.</p>
<details><summary>Solución</summary><p>\(a=2(r_C+r_A)=0.566\) nm, \(V_C=1.81\times10^{-22}\) cm³, \(n'=4\). \(\rho=\dfrac{4(22.99+35.45)}{(1.81\times10^{-22})(6.022\times10^{23})}=2.14\) g/cm³; el valor medido es 2.16 g/cm³.</p></details>
</div>
</section>

<section>
<h2>Polimorfismo, anisotropía y orden</h2>
<p>Un mismo compuesto puede cristalizar en más de una estructura según la temperatura y la presión: es el <span class="term">polimorfismo</span> (alotropía en elementos). El hierro es BCC (α) hasta 912 °C, FCC (γ) hasta 1394 °C y otra vez BCC (δ) hasta la fusión; esa secuencia es la base de todo el tratamiento térmico de los aceros. El carbono existe como diamante, grafito, fullerenos y nanotubos. La circonia pasa de monoclínica a tetragonal hacia 1170 °C con un cambio de volumen del 4 % que agrieta las piezas, a menos que se estabilice con itria (capítulo 17).</p>
<p>Como la distancia entre átomos depende de la dirección, muchas propiedades de un monocristal son <span class="term">anisótropas</span>. El módulo de Young del hierro va de 125 GPa en la dirección [100] a 273 GPa en [111]. En un <span class="term">policristal</span>, formado por muchos granos orientados al azar, las propiedades se promedian y el material resulta prácticamente isótropo, salvo que el procesamiento induzca una orientación preferencial o <span class="term">textura</span> (por ejemplo, las chapas de acero al silicio de los transformadores se laminan para alinear la dirección [100], la de magnetización fácil).</p>
<p>Finalmente, un sólido puede carecer de orden de largo alcance: es un sólido <span class="term">amorfo</span> o no cristalino. El vidrio de sílice tiene los mismos tetraedros SiO₄ que el cuarzo, pero unidos en una red aleatoria. Los polímeros, los vidrios metálicos y muchas películas delgadas son total o parcialmente amorfos. La difracción de rayos X (capítulo 5) distingue de inmediato ambos casos.</p>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Demuestre que el FEA de la estructura BCC es \(\sqrt3\pi/8\).
<details><summary>Respuesta</summary><p>\(n=2\), \(a=4R/\sqrt3\), \(V_C=64R^3/(3\sqrt3)\). FEA \(=2(4/3)\pi R^3\cdot3\sqrt3/(64R^3)=\sqrt3\pi/8=0.680\).</p></details></li>
<li><span class="lvl">Básico</span>El molibdeno es BCC con \(R=0.1363\) nm y \(A=95.94\) g/mol. Calcule su densidad.
<details><summary>Respuesta</summary><p>\(a=0.3148\) nm; \(\rho=10.22\) g/cm³ (medido: 10.22).</p></details></li>
<li><span class="lvl">Intermedio</span>Un metal tiene densidad 7.25 g/cm³, masa atómica 50.0 g/mol y radio 0.1219 nm. ¿Es FCC o BCC?
<details><summary>Respuesta</summary><p>Con \(\rho V_CN_A/A=n\): para BCC, \(a=0.2815\) nm, \(n=1.95\approx2\); para FCC, \(a=0.3448\) nm, \(n=3.58\). Es BCC.</p></details></li>
<li><span class="lvl">Intermedio</span>Calcule el volumen de la celda HCP del titanio (\(a=0.2951\) nm, \(c=0.4686\) nm) y su densidad (\(A=47.87\) g/mol).
<details><summary>Respuesta</summary><p>\(V_C=\tfrac{3\sqrt3}2a^2c=0.1060\) nm³; \(\rho=6(47.87)/(1.060\times10^{-22}\cdot6.022\times10^{23})=4.50\) g/cm³.</p></details></li>
<li><span class="lvl">Intermedio</span>Al pasar de Fe-α (BCC, \(a=0.2866\) nm) a Fe-γ (FCC, \(a=0.3647\) nm a 912 °C), ¿cambia el volumen? Calcule el volumen por átomo en ambas fases.
<details><summary>Respuesta</summary><p>BCC: \(0.2866^3/2=0.01177\) nm³; FCC: \(0.3647^3/4=0.01213\) nm³ (con los parámetros a 912 °C, el BCC es \(a=0.2903\) nm y da 0.01223 nm³). Medido a la misma temperatura, la transformación α→γ es una contracción de cerca del 1 %.</p></details></li>
<li><span class="lvl">Avanzado</span>Deduzca el cociente de radios crítico para la coordinación tetraédrica, \(r_C/r_A=\sqrt{3/2}-1\).
<details><summary>Respuesta</summary><p>En un tetraedro de aristas \(2r_A\) (aniones tocándose), la distancia del centro a un vértice es \(\sqrt{3/8}\cdot2r_A=\sqrt{3/2}\,r_A\). Igualándola a \(r_C+r_A\): \(r_C/r_A=\sqrt{3/2}-1=0.225\).</p></details></li>
<li><span class="lvl">Avanzado</span>El MgO tiene la estructura de sal gema con \(r_{\text{Mg}^{2+}}=0.072\) nm y \(r_{\text{O}^{2-}}=0.140\) nm. Calcule su densidad y su FEA iónico.
<details><summary>Respuesta</summary><p>\(a=0.424\) nm; \(\rho=4(24.31+16.00)/(0.0762\times10^{-21}\cdot6.022\times10^{23})=3.51\) g/cm³ (medido 3.58). FEA \(=4\cdot\tfrac43\pi(0.072^3+0.140^3)/0.424^3=0.69\).</p></details></li>
</ol>
