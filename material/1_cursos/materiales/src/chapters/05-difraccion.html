<template class="chapter-src" data-id="difraccion" data-num="5" data-title="Difracción de rayos X" data-part="Parte II · Estructura" data-short="Ley de Bragg, factor de estructura y reglas de extinción, el difractograma de polvo, indexación de cristales cúbicos, tamaño de cristalito por Scherrer y sólidos amorfos">
<p class="lead">Casi todo lo que se sabe sobre la estructura de los cristales se aprendió dispersando rayos X, electrones o neutrones cuya longitud de onda es comparable a la distancia entre átomos. La difracción convierte la periodicidad de la red en un patrón de picos que se puede medir con precisión de una parte en diez mil. Este capítulo explica cómo se forma ese patrón y cómo se lee.</p>

<section>
<h2>La ley de Bragg</h2>
<p>Los rayos X son ondas electromagnéticas con \(\lambda\) entre 0.05 y 0.25 nm. Al incidir sobre un cristal, cada electrón dispersa una pequeña onda esférica; en casi todas las direcciones esas ondas se cancelan, pero en algunas interfieren constructivamente. W. L. Bragg (1913) dio la condición imaginando que los planos atómicos \((hkl)\), separados una distancia \(d_{hkl}\), reflejan parcialmente la onda como espejos. Dos rayos reflejados por planos vecinos recorren caminos que difieren en \(2d\sen\theta\); la interferencia es constructiva cuando esa diferencia es un número entero de longitudes de onda:</p>
<div class="eq key" data-name="Ley de Bragg">\[n\lambda=2d_{hkl}\sen\theta.\]</div>
<p>El ángulo \(\theta\) se mide entre el haz y los planos, de modo que el haz difractado forma \(2\theta\) con el incidente: por eso los difractómetros registran la intensidad contra \(2\theta\). El orden \(n\) se absorbe en los índices, escribiendo la reflexión de orden 2 de (111) como la de primer orden de (222), cuya distancia es \(d_{111}/2\).</p>
<div class="sim" data-sim="bragg-geometry" data-title="Interferencia de los rayos reflejados por planos sucesivos"></div>
<div class="sim-guide"><ul>
<li>Barra el ángulo: la intensidad resultante es casi nula salvo en los ángulos de Bragg, donde todos los rayos llegan en fase.</li>
<li>Aumente el número de planos: los picos se hacen más angostos. Es el origen del ensanchamiento por tamaño de cristalito (ecuación de Scherrer).</li>
<li>Con \(\lambda&gt;2d\) no existe ningún ángulo de Bragg: la radiación visible no difracta en las redes atómicas.</li>
</ul></div>
<div class="box ex"><h4>Un ángulo de difracción</h4>
<p>El hierro α es BCC con \(a=0.2866\) nm. ¿A qué \(2\theta\) aparece la reflexión (220) con radiación Cu Kα (\(\lambda=0.1541\) nm)?</p>
<details><summary>Solución</summary><p>\(d_{220}=0.2866/\sqrt8=0.1013\) nm; \(\sen\theta=0.1541/(2\times0.1013)=0.7605\); \(\theta=49.5^\circ\) y \(2\theta=99.0^\circ\). (Callister obtiene 98.8° con valores redondeados.)</p></details>
</div>
</section>

<section>
<h2>Factor de estructura y extinciones</h2>
<p>La ley de Bragg dice dónde puede haber un pico, pero no si lo habrá. Cuando la celda contiene varios átomos, las ondas dispersadas por cada uno tienen fases distintas, y pueden cancelarse. La amplitud de la reflexión \((hkl)\) es el <span class="term">factor de estructura</span>:</p>
<div class="eq key" data-name="Factor de estructura">\[F_{hkl}=\sum_{j=1}^{n}f_j\,\exp\!\left[2\pi\ii\,(hx_j+ky_j+lz_j)\right],\qquad I_{hkl}\propto\abs{F_{hkl}}^2,\]</div>
<p>donde \(x_jy_jz_j\) son las coordenadas fraccionarias de los átomos y \(f_j\) su factor de dispersión atómica, que vale \(Z\) a ángulo cero y decrece con \(\sen\theta/\lambda\). Con un solo tipo de átomo:</p>
<ul>
<li><b>BCC</b> (0 0 0 y ½ ½ ½): \(F=f[1+\ee^{\ii\pi(h+k+l)}]\). Vale \(2f\) si \(h+k+l\) es par y 0 si es impar. Reflexiones: 110, 200, 211, 220, 310…</li>
<li><b>FCC</b> (0 0 0, ½ ½ 0, ½ 0 ½, 0 ½ ½): \(F=4f\) si \(h,k,l\) son todos pares o todos impares; 0 si están mezclados. Reflexiones: 111, 200, 220, 311, 222…</li>
<li><b>Diamante</b>: FCC más una segunda red desplazada ¼ ¼ ¼. Además de las extinciones de FCC, desaparecen las de \(h+k+l=4n+2\) con índices pares: (200), (222), (420)…</li>
<li><b>Sal gema</b>: con todos pares, \(F=4(f_{\text{Na}}+f_{\text{Cl}})\); con todos impares, \(F=4(f_{\text{Na}}-f_{\text{Cl}})\): picos débiles. En el KCl, donde K⁺ y Cl⁻ tienen 18 electrones cada uno, los impares casi desaparecen y el patrón parece de una red cúbica simple de parámetro \(a/2\).</li>
</ul>
<div class="sim" data-sim="structure-factor" data-title="Factor de estructura como suma de fasores"></div>
<div class="sim-guide"><ul>
<li>En BCC con (100), los dos fasores apuntan en sentidos opuestos y se cancelan; con (110) se suman.</li>
<li>En diamante con (200), los ocho fasores se cancelan en grupos: es una extinción por la base, no por la red.</li>
<li>En NaCl compare (111) y (200): en el primero los fasores de Na y Cl se restan.</li>
</ul></div>
</section>

<section>
<h2>El difractograma de polvo</h2>
<p>En una muestra policristalina (polvo o metal de grano fino) hay granos con todas las orientaciones, y cada familia de planos encuentra siempre algunos granos en condición de Bragg. El detector, que gira a \(2\theta\) mientras la muestra gira a \(\theta\), registra un pico por cada familia \(\{hkl\}\) permitida. La intensidad integrada de cada pico es</p>
<div class="eq">\[I_{hkl}\propto\abs{F_{hkl}}^2\,p_{hkl}\,\underbrace{\frac{1+\cos^22\theta}{\sen^2\theta\cos\theta}}_{\text{Lorentz-polarización}}\,\ee^{-2B\sen^2\theta/\lambda^2},\]</div>
<p>con \(p_{hkl}\) la multiplicidad (número de planos equivalentes de la familia: 6 para {100}, 8 para {111}, 12 para {110}, 24 para {311}) y el último factor, de Debye–Waller, que reduce la intensidad por la vibración térmica de los átomos.</p>
<div class="sim" data-sim="xrd-pattern" data-title="Difractograma de polvo calculado"></div>
<div class="sim-guide"><ul>
<li>Compare el aluminio y el cobre (ambos FCC): mismas reflexiones, desplazadas porque el cobre tiene \(a\) menor.</li>
<li>Pase del cobre al hierro (BCC): cambia la secuencia de picos. Así se distingue una estructura de otra sin conocer la muestra.</li>
<li>Cambie de Cu Kα a Mo Kα: con \(\lambda\) más corta, todos los picos se corren a ángulos menores y aparecen más reflexiones.</li>
<li>Reduzca el tamaño de cristalito por debajo de 20 nm: los picos se ensanchan. Elija «amorfo» para ver el halo de un vidrio.</li>
</ul></div>
<div class="box note"><h4>Qué se validó</h4><p>Las posiciones \(2\theta\) de Al, Fe-α, Si y NaCl coinciden con las fichas ICDD dentro de 0.02°, y las intensidades relativas calculadas con factores de Cromer–Mann y de Debye–Waller quedan a menos de 12 unidades (sobre 100) de las fichas; el apéndice de validación lista cada caso. Las diferencias restantes se deben a la absorción, la orientación preferencial y la forma de medir de cada ficha.</p></div>
</section>

<section>
<h2>Indexación de cristales cúbicos</h2>
<p>Combinando la ley de Bragg con \(d=a/\sqrt{h^2+k^2+l^2}\),</p>
<div class="eq key" data-name="Indexación cúbica">\[\sen^2\theta=\frac{\lambda^2}{4a^2}\,(h^2+k^2+l^2)=\frac{\lambda^2}{4a^2}\,N.\]</div>
<p>Los cocientes \(\sen^2\theta_i/\sen^2\theta_1\) son cocientes de enteros \(N_i/N_1\) que delatan la red: en cúbica simple, \(N=1,2,3,4,5,6,8,9\ldots\) (falta el 7); en BCC, \(2,4,6,8,10,12,14,16\) (en proporción 1:2:3:4…); en FCC, \(3,4,8,11,12,16,19,20\); en diamante, \(3,8,11,16,19,24\). Identificada la secuencia, cada pico da un valor de \(a\), y su promedio (mejor aún, una extrapolación contra \(\cos^2\theta\)) da el parámetro de red con cuatro cifras.</p>
<div class="sim" data-sim="xrd-index" data-title="Indexe un difractograma desconocido"></div>
<div class="sim-guide"><ul>
<li>Elija una muestra problema y observe los cocientes \(\sen^2\theta/\sen^2\theta_1\). Pruebe las tres hipótesis de red: solo una hace que todos los \(N\) sean enteros.</li>
<li>Con la hipótesis correcta, la columna de \(a\) es constante. Con una incorrecta, deriva.</li>
<li>Note que con seis picos la cúbica simple y la BCC son indistinguibles (1:2:3:4:5:6 en ambas): el séptimo pico decide, porque ningún entero suma 7 como \(h^2+k^2+l^2\).</li>
</ul></div>
</section>

<section>
<h2>Tamaño de cristalito y sólidos amorfos</h2>
<p>Un cristal infinito daría picos infinitamente finos. Un cristalito de espesor \(t\) contiene unos \(t/d\) planos, y la interferencia deja de ser perfectamente destructiva cerca del ángulo de Bragg: el pico se ensancha. Scherrer (1918) obtuvo</p>
<div class="eq key" data-name="Ecuación de Scherrer">\[t=\frac{K\lambda}{\beta\cos\theta},\qquad K\approx0.9,\]</div>
<p>con \(\beta\) el ancho a media altura en radianes, una vez descontado el ancho instrumental. Es una estimación válida por debajo de unos 100–200 nm; las microdeformaciones también ensanchan los picos, como \(\beta=4\varepsilon\tan\theta\), y se separan del tamaño con el método de Williamson–Hall.</p>
<p>En un sólido amorfo no hay planos, solo una distancia típica entre vecinos. El patrón es un halo ancho centrado aproximadamente en \(2\theta\) tal que \(1.23\lambda/(2\sen\theta)\approx r_1\) (ecuación de Debye para la primera distancia \(r_1\)). La fracción de área bajo los picos cristalinos frente al halo mide la cristalinidad de polímeros y vitrocerámicos.</p>
<div class="box ex"><h4>Nanopartículas de oro</h4>
<p>Un pico (111) del oro a \(2\theta=38.2^\circ\) (Cu Kα) mide 0.45° de ancho a media altura tras restar el instrumental. Estime el tamaño de cristalito.</p>
<details><summary>Solución</summary><p>\(\beta=0.45\times\pi/180=7.85\times10^{-3}\) rad, \(\cos19.1^\circ=0.945\). \(t=0.9(0.1541)/(7.85\times10^{-3}\times0.945)=18.7\) nm.</p></details>
</div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule \(2\theta\) de la reflexión (111) del aluminio (\(a=0.4049\) nm) con Cu Kα.
<details><summary>Respuesta</summary><p>\(d=0.2338\) nm, \(\sen\theta=0.3295\), \(2\theta=38.47^\circ\).</p></details></li>
<li><span class="lvl">Básico</span>Liste las seis primeras reflexiones permitidas de una red BCC y de una FCC.
<details><summary>Respuesta</summary><p>BCC: 110, 200, 211, 220, 310, 222. FCC: 111, 200, 220, 311, 222, 400.</p></details></li>
<li><span class="lvl">Intermedio</span>Un metal cúbico da picos a \(2\theta=40.26^\circ\), 58.27°, 73.19° y 86.95° con Cu Kα. Identifique la red y calcule \(a\).
<details><summary>Respuesta</summary><p>\(\sen^2\theta\): 0.1184, 0.2370, 0.3554, 0.4734, en proporción 1:2:3:4 → BCC (110, 200, 211, 220). \(a=\lambda\sqrt2/(2\sen\theta_1)=0.3165\) nm: es tungsteno.</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que en FCC las reflexiones con índices mezclados se extinguen.
<details><summary>Respuesta</summary><p>\(F=f[1+\ee^{\ii\pi(h+k)}+\ee^{\ii\pi(h+l)}+\ee^{\ii\pi(k+l)}]\). Si dos índices son pares y uno impar (o al revés), dos de las sumas son impares y una par: \(F=f(1-1-1+1)=0\).</p></details></li>
<li><span class="lvl">Intermedio</span>¿Por qué el KCl, que tiene estructura de sal gema, da un difractograma que parece de una red cúbica simple?
<details><summary>Respuesta</summary><p>K⁺ y Cl⁻ son isoelectrónicos (18 e⁻), así que \(f_K\approx f_{Cl}\) y las reflexiones de índices impares, con \(F=4(f_K-f_{Cl})\), casi desaparecen. Las que quedan (todos pares) equivalen a las de una red cúbica simple de parámetro \(a/2\).</p></details></li>
<li><span class="lvl">Avanzado</span>Con Mo Kα (\(\lambda=0.07093\) nm), ¿cuántas reflexiones del cobre (\(a=0.3615\) nm) caben por debajo de \(2\theta=90^\circ\)?
<details><summary>Respuesta</summary><p>\(\sen^2\theta\le0.5\Rightarrow N\le 2a^2/\lambda^2=51.9\). Las reflexiones FCC con \(N\le51\): 3, 4, 8, 11, 12, 16, 19, 20, 24, 27, 32, 35, 36, 40, 43, 44, 48, 51 (contando cada \(N\) una vez): 18 picos.</p></details></li>
</ol>
