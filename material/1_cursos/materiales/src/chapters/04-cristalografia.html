<template class="chapter-src" data-id="cristalografia" data-num="4" data-title="Direcciones y planos cristalográficos" data-part="Parte II · Estructura" data-short="Coordenadas de puntos, índices de direcciones y de planos de Miller, familias equivalentes, distancia interplanar, densidades lineal y planar, e índices de Miller-Bravais para cristales hexagonales">
<p class="lead">Muchas propiedades de un cristal dependen de la dirección: el deslizamiento ocurre en ciertos planos y direcciones, la difracción selecciona planos, la magnetización prefiere ejes. Para hablar de ellos con precisión se usa una notación compacta, los índices de Miller, que este capítulo enseña a leer, escribir y usar en cálculos.</p>

<section>
<h2>Coordenadas de puntos</h2>
<p>La posición de un punto dentro de la celda se da en fracciones de las aristas: \(q\,r\,s\) significa el punto \(q\,a\) a lo largo de \(x\), \(r\,b\) a lo largo de \(y\) y \(s\,c\) a lo largo de \(z\). En la celda BCC, por ejemplo, los átomos están en 0 0 0 y ½ ½ ½; en la FCC, en 0 0 0, ½ ½ 0, ½ 0 ½ y 0 ½ ½. Estas fracciones son las mismas que usa el factor de estructura en el capítulo 5.</p>
</section>

<section>
<h2>Direcciones</h2>
<p>Una dirección cristalográfica es un vector. Sus índices se obtienen así: (1) se restan las coordenadas de la cola a las de la cabeza, en unidades de \(a,b,c\); (2) se multiplican o dividen por un factor común hasta obtener los enteros más pequeños; (3) se escriben entre corchetes, sin comas, con una barra encima de los negativos: \([u\,v\,w]\), por ejemplo \([1\,\bar1\,0]\).</p>
<p>Las direcciones equivalentes por la simetría del cristal forman una <span class="term">familia</span> que se denota con ángulos: en un cubo, \(\langle100\rangle\) agrupa \([100]\), \([010]\), \([001]\) y sus opuestos. En sistemas cúbicos, el ángulo entre dos direcciones se calcula con el producto escalar:</p>
<div class="eq">\[\cos\theta=\frac{u_1u_2+v_1v_2+w_1w_2}{\sqrt{u_1^2+v_1^2+w_1^2}\,\sqrt{u_2^2+v_2^2+w_2^2}}.\]</div>
<div class="box ex"><h4>Ángulo entre la arista y la diagonal del cubo</h4><p>¿Qué ángulo forman \([100]\) y \([111]\)?</p>
<details><summary>Solución</summary><p>\(\cos\theta=1/(1\cdot\sqrt3)\), \(\theta=54.74^\circ\). Es el ángulo que aparece al calcular el factor de Schmid de un monocristal cúbico cargado a lo largo de [100] (capítulo 9).</p></details></div>
</section>

<section>
<h2>Planos: índices de Miller</h2>
<p>Un plano se identifica por los recíprocos de sus intersecciones con los ejes. El procedimiento:</p>
<ol>
<li>Si el plano pasa por el origen, se elige otra celda o se desplaza el origen.</li>
<li>Se leen las intersecciones con los ejes, en unidades de \(a,b,c\); un plano paralelo a un eje lo corta en el infinito.</li>
<li>Se toman los recíprocos (el del infinito es cero).</li>
<li>Se reducen a los enteros más pequeños con un factor común y se escriben entre paréntesis: \((h\,k\,l)\).</li>
</ol>
<p>Un plano con intersecciones \((\tfrac12,1,\infty)\) tiene recíprocos \((2,1,0)\): es el plano (210). Las familias de planos equivalentes se escriben con llaves: \(\{111\}\) son los ocho planos de las caras de un octaedro, cuatro pares paralelos.</p>
<div class="box law"><h4>Propiedades útiles en cristales cúbicos</h4>
<ul>
<li>La dirección \([hkl]\) es perpendicular al plano \((hkl)\).</li>
<li>Los planos \((hkl)\) y \((nh\,nk\,nl)\) son paralelos; el segundo está a la \(n\)-ésima parte de la distancia.</li>
<li>La distancia entre planos adyacentes de la familia \(\{hkl\}\) es \(d_{hkl}=a/\sqrt{h^2+k^2+l^2}\).</li>
<li>Una dirección \([uvw]\) está contenida en el plano \((hkl)\) si \(hu+kv+lw=0\) (regla de la zona).</li>
</ul></div>
<div class="sim" data-sim="miller-plane" data-title="Planos de Miller y direcciones en la celda cúbica"></div>
<div class="sim-guide"><ul>
<li>Dibuje (100), (110) y (111): son los tres planos de bajo índice de un cubo. Observe la flecha \([hkl]\), normal al plano.</li>
<li>Cambie el signo de un índice: el origen se desplaza a la esquina opuesta para que el plano quede dentro de la celda.</li>
<li>Compare (111) y (222): son paralelos, y (222) corta los ejes en la mitad. Su \(d\) es la mitad.</li>
<li>Escriba una dirección \([uvw]\) y compruebe con la regla de la zona si está contenida en el plano.</li>
</ul></div>
<div class="sim" data-sim="miller-intercepts" data-title="De las intersecciones a los índices"></div>
<div class="sim-guide"><ul>
<li>Lleve \(z\) al infinito y \(x,y\) a ½ y 1: el plano es (210).</li>
<li>Pruebe intersecciones \((\tfrac12,\tfrac13,\infty)\): ¿por qué el resultado es (230) y no (2 3 0) con otro factor?</li>
</ul></div>
</section>

<section>
<h2>Densidades lineal y planar</h2>
<p>No todos los planos y direcciones son iguales: unos están más poblados de átomos que otros. Se definen</p>
<div class="eq key" data-name="Densidades lineal y planar">\[\text{DL}=\frac{\text{átomos centrados en el vector}}{\text{longitud del vector}},\qquad \text{DP}=\frac{\text{átomos centrados en el plano}}{\text{área del plano}}.\]</div>
<p>Se cuentan solo los átomos cuyo centro está sobre la línea o el plano, cada uno con la fracción que cae dentro del tramo o del área considerada. En FCC, la dirección más densa es \(\langle110\rangle\) (los átomos se tocan a lo largo de la diagonal de cara) y el plano más denso es \(\{111\}\). En BCC son \(\langle111\rangle\) y \(\{110\}\). Esta jerarquía decide los sistemas de deslizamiento (capítulo 9): los cristales deslizan sobre los planos más compactos y en las direcciones más compactas.</p>
<div class="box ex"><h4>Densidad planar del plano (110) en FCC</h4>
<p>Calcule la DP del plano (110) de una celda FCC en función del radio \(R\).</p>
<details><summary>Solución</summary><p>El plano (110) corta la celda en un rectángulo de lados \(a\) (arista) y \(a\sqrt2\) (diagonal de cara). Contiene 4 vértices ×¼ y 2 centros de cara ×½: 2 átomos. Con \(a=2R\sqrt2\), el área es \(a^2\sqrt2=8\sqrt2R^2\) y \(\text{DP}=2/(8\sqrt2R^2)=1/(4\sqrt2R^2)\). Para el cobre (\(R=0.128\) nm): \(10.8\) átomos/nm².</p></details>
</div>
<div class="sim" data-sim="planar-density" data-title="Átomos sobre los planos de bajo índice de FCC y BCC"></div>
<div class="sim-guide"><ul>
<li>Compare los tres planos en FCC: el {111} tiene la mayor densidad y los átomos se tocan en tres direcciones dentro del plano.</li>
<li>Repita en BCC: ahora el ganador es {110}. Los planos {111} de BCC están casi vacíos.</li>
</ul></div>
</section>

<section>
<h2>Cristales hexagonales: índices de Miller-Bravais</h2>
<p>En el sistema hexagonal, los tres ejes basales \(\vb a_1,\vb a_2,\vb a_3\) forman 120° entre sí, con \(\vb a_3=-(\vb a_1+\vb a_2)\), y el eje \(\vb c\) es perpendicular. Con cuatro índices \((hkil)\) las familias equivalentes por simetría hexagonal comparten los mismos números, lo que no ocurre con tres índices. El tercer índice no es independiente:</p>
<div class="eq">\[i=-(h+k)\quad\text{(planos)},\qquad t=-(u+v)\quad\text{(direcciones)}.\]</div>
<p>Para direcciones, la conversión de tres a cuatro índices es</p>
<div class="eq key" data-name="Conversión de Miller a Miller-Bravais">\[u=\tfrac13(2U-V),\qquad v=\tfrac13(2V-U),\qquad t=-(u+v),\qquad w=W,\]</div>
<p>seguida de la reducción a enteros. El plano basal es (0001), los planos prismáticos son \(\{10\bar10\}\) y los piramidales \(\{10\bar11\}\).</p>
<div class="sim" data-sim="hex-indices" data-title="Direcciones en el plano basal: tres y cuatro índices"></div>
<div class="sim-guide"><ul>
<li>La dirección [100] de tres índices se convierte en \([2\bar1\bar10]\). Las seis direcciones \(\langle2\bar1\bar10\rangle\) son las direcciones compactas del plano basal, donde deslizan el magnesio y el zinc.</li>
<li>Note que con cuatro índices las seis direcciones equivalentes son permutaciones de los mismos números; con tres no lo son.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Halle los índices de la dirección que va de ½ 1 0 a 0 0 1.
<details><summary>Respuesta</summary><p>Cabeza menos cola: \((-\tfrac12,-1,1)\); por 2: \([\bar1\bar22]\).</p></details></li>
<li><span class="lvl">Básico</span>Un plano corta los ejes en \(x=1\), \(y=-1\), \(z=\tfrac12\). Halle sus índices.
<details><summary>Respuesta</summary><p>Recíprocos \((1,-1,2)\): plano \((1\bar12)\).</p></details></li>
<li><span class="lvl">Intermedio</span>Calcule \(d_{110}\), \(d_{111}\) y \(d_{220}\) del aluminio (\(a=0.4050\) nm).
<details><summary>Respuesta</summary><p>0.2864, 0.2338 y 0.1432 nm.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Está la dirección \([1\bar10]\) contenida en el plano (111)? ¿Y \([1\bar11]\)?
<details><summary>Respuesta</summary><p>\(1-1+0=0\): sí. \(1-1+1=1\neq0\): no.</p></details></li>
<li><span class="lvl">Intermedio</span>Calcule la densidad lineal de \([110]\) en FCC y de \([111]\) en BCC en función de \(R\), y evalúelas para el cobre y el hierro α.
<details><summary>Respuesta</summary><p>FCC [110]: \(1/(2R)\); Cu: 3.91 nm⁻¹. BCC [111]: \(1/(2R)\); Fe: 4.03 nm⁻¹. En ambos casos los átomos se tocan a lo largo de la dirección.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que la DP del plano (111) en FCC es \(1/(2\sqrt3R^2)\) y compruebe que es la máxima posible para esferas de radio \(R\) en un plano.
<details><summary>Respuesta</summary><p>El triángulo equilátero de lado \(a\sqrt2=4R\) dentro de la celda contiene 3 vértices ×⅙ y 3 lados ×½: 2 átomos, en un área \(\tfrac{\sqrt3}4(4R)^2=4\sqrt3R^2\). DP \(=1/(2\sqrt3R^2)\). Es la densidad de un empaquetamiento hexagonal de discos, el más denso posible en el plano (Thue).</p></details></li>
<li><span class="lvl">Avanzado</span>Convierta \([110]\) y \([001]\) de tres a cuatro índices en un cristal hexagonal.
<details><summary>Respuesta</summary><p>\([110]\): \(u=\tfrac13\), \(v=\tfrac13\), \(t=-\tfrac23\): \([11\bar20]\). \([001]\): \([0001]\).</p></details></li>
</ol>
