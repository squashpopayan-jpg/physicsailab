<p class="lead">Por qué el oro es amarillo, el vidrio transparente, el silicio gris metálico y la alúmina blanca son preguntas de ciencia de los materiales. La respuesta está en cómo los electrones de cada material interactúan con fotones de energía entre 1.8 y 3.1 eV. Este capítulo recorre esas interacciones y las tecnologías que nacen de ellas, de las lentes a las fibras ópticas y los LED.</p>

<section>
<h2>Luz y materia</h2>
<p>La luz visible es radiación electromagnética de 400 a 700 nm, con fotones de \(E=hc/\lambda\) entre 3.1 y 1.8 eV (\(E[\text{eV}]=1240/\lambda[\text{nm}]\)). Al llegar a un material, una fracción se refleja (\(R\)), otra se absorbe (\(A\)) y otra se transmite (\(T\)), con \(R+A+T=1\). Los electrones del material responden según sus niveles disponibles: si hay estados vacíos a una energía \(h\nu\) por encima, el fotón puede absorberse; si no, el campo solo polariza los átomos (polarización electrónica, capítulo 21) y la luz se propaga más lenta.</p>
<p>En los <span class="term">metales</span>, la banda parcialmente llena ofrece estados libres para cualquier energía visible: toda la luz se absorbe en una capa de unos 0.1 µm y se reemite casi por completo como luz reflejada. Por eso son opacos y brillantes. El color del oro y del cobre aparece porque, por encima de cierta energía, se excitan electrones de la banda d y la reflectividad cae en el azul.</p>
</section>

<section>
<h2>Refracción y reflexión</h2>
<p>En un material transparente la luz viaja a \(v=c/n\), con el índice de refracción \(n=\sqrt{\varepsilon_r\mu_r}\approx\sqrt{\varepsilon_r}\) (a frecuencia óptica). Al cruzar una interfaz se cumple la ley de Snell, \(n_1\sen\theta_1=n_2\sen\theta_2\), y la fracción reflejada la dan las ecuaciones de Fresnel. A incidencia normal,</p>
<div class="eq key" data-name="Reflectancia a incidencia normal">\[R=\left(\frac{n_2-n_1}{n_2+n_1}\right)^2.\]</div>
<p>Una superficie de vidrio (\(n=1.5\)) refleja 4 %; un diamante (\(n=2.42\)), 17 %, lo que, junto con su alta dispersión, explica su brillo. A incidencia oblicua las dos polarizaciones se comportan distinto: la componente \(p\) no se refleja en el <span class="term">ángulo de Brewster</span>, \(\tan\theta_B=n_2/n_1\) (56.3° para el vidrio), el principio de las gafas polarizadas. Si la luz va de un medio denso a uno menos denso, por encima del ángulo crítico \(\sen\theta_c=n_2/n_1\) toda se refleja: es la reflexión total interna.</p>
<div class="sim" data-sim="fresnel-snell" data-title="Refracción, reflexión de Fresnel y ángulo de Brewster"></div>
<div class="sim-guide"><ul>
<li>Del aire al vidrio: a 0° se refleja 4 %; en 56.3° la reflectancia \(p\) se anula.</li>
<li>Del vidrio al aire: por encima de 41.8° no hay rayo refractado.</li>
<li>Pruebe un diamante y una capa antirreflectante: un recubrimiento de índice \(\sqrt{n}\) y espesor \(\lambda/4n\) anula la reflexión (no incluido en la simulación de una sola interfaz).</li>
</ul></div>
</section>

<section>
<h2>Dispersión</h2>
<p>El índice depende de la longitud de onda, porque la polarización electrónica tiene resonancias en el ultravioleta (capítulo 21): lejos de ellas, \(n\) crece hacia el azul. La ecuación de Sellmeier, con tres términos de resonancia, describe los vidrios ópticos con precisión de \(10^{-5}\):</p>
<div class="eq key" data-name="Ecuación de Sellmeier">\[n^2(\lambda)=1+\sum_{i=1}^3\frac{B_i\lambda^2}{\lambda^2-C_i}.\]</div>
<p>La dispersión se resume con el número de Abbe, \(V_d=(n_d-1)/(n_F-n_C)\), evaluado en las líneas d (587.6 nm), F (486.1 nm) y C (656.3 nm). Vidrios de \(V_d\) alto (crown, como el BK7, \(V_d=64.2\)) dispersan poco; los de \(V_d\) bajo (flint, con plomo) dispersan mucho. Combinando ambos se corrige la aberración cromática de las lentes.</p>
<div class="sim" data-sim="dispersion-prism" data-title="Dispersión de vidrios ópticos y descomposición en un prisma"></div>
<div class="sim-guide"><ul>
<li>Los coeficientes de Sellmeier del BK7 (Schott) y de la sílice fundida (Malitson) reproducen \(n_d\) y \(V_d\) dentro de 0.3 % (apéndice de validación).</li>
<li>Gire el prisma hasta la desviación mínima: el abanico de colores es más ancho con el vidrio flint.</li>
</ul></div>
</section>

<section>
<h2>Absorción y color</h2>
<p>En un semiconductor o aislante, un fotón solo se absorbe por excitación interbanda si su energía supera la brecha: \(h\nu\ge E_g\), es decir \(\lambda\le\lambda_g=hc/E_g\). Así:</p>
<ul>
<li>\(E_g&gt;3.1\) eV (diamante, sílice, alúmina pura, ZnS): toda la luz visible pasa; el material es incoloro.</li>
<li>\(1.8&lt;E_g&lt;3.1\) eV: se absorbe la parte azul y pasa la roja: CdS (2.42 eV) es amarillo-naranja, GaP (2.26 eV) naranja, CdSe (1.74 eV) rojo oscuro.</li>
<li>\(E_g&lt;1.8\) eV (Si, GaAs, Ge): se absorbe todo el visible; el material es opaco y se ve gris metálico por su reflectividad alta.</li>
</ul>
<p>La intensidad que atraviesa un espesor \(x\) decae exponencialmente (ley de Beer–Lambert), \(I=I_0\ee^{-\alpha x}\), con \(\alpha\) el coeficiente de absorción. Una placa con dos caras refleja además en cada una; con reflexiones múltiples incoherentes, \(T=(1-R)^2\ee^{-\alpha l}/(1-R^2\ee^{-2\alpha l})\).</p>
<p>Los aislantes coloreados deben su color a impurezas o defectos que crean niveles dentro de la brecha. El rubí es alúmina con 0.5 % de Cr³⁺, cuyos niveles absorben el violeta y el verde; el zafiro azul, alúmina con Fe y Ti. Los cerámicos policristalinos y los polímeros semicristalinos son opacos o translúcidos no por absorción sino por <span class="term">dispersión</span> en poros, bordes de grano y regiones cristalinas, como mostró el ejemplo de los tres discos de alúmina del capítulo 1.</p>
<div class="sim" data-sim="gap-color" data-title="Brecha de energía, color transmitido y ley de Beer–Lambert"></div>
<div class="sim-guide"><ul>
<li>Barra la brecha de 3.5 a 1.5 eV: el color transmitido pasa de incoloro a amarillo, naranja, rojo y negro.</li>
<li>Aumente el espesor: la absorción por la cola de la brecha oscurece el color.</li>
</ul></div>
</section>

<section>
<h2>Emisión de luz: luminiscencia, LED y láseres</h2>
<p>La recombinación de un electrón de la banda de conducción con un hueco puede emitir un fotón de energía \(\approx E_g\). En los semiconductores de brecha directa (GaAs, GaN, InGaN) es muy eficiente; en los de brecha indirecta (Si) requiere un fonón y es débil. Un <span class="term">LED</span> es una unión p-n polarizada en directa donde los portadores se recombinan radiativamente: su color lo fija la brecha (AlGaInP rojo-amarillo, InGaN azul-verde; los LED blancos combinan un chip azul con un fósforo amarillo). En un <span class="term">láser</span>, la inversión de población y la retroalimentación de una cavidad producen emisión estimulada coherente. La luminiscencia de los fósforos (fluorescencia y fosforescencia) aprovecha niveles de impurezas. El proceso inverso, la absorción que crea pares electrón-hueco, es el principio de las celdas solares y los fotodetectores.</p>
</section>

<section>
<h2>Fibras ópticas</h2>
<p>Una fibra óptica guía la luz por reflexión total interna en un núcleo de índice \(n_1\) rodeado de un revestimiento de índice \(n_2\) algo menor. Solo se guían los rayos que entran dentro del cono de aceptación definido por la apertura numérica:</p>
<div class="eq key" data-name="Apertura numérica">\[\text{AN}=\sen\theta_{\max}=\sqrt{n_1^2-n_2^2}.\]</div>
<p>En una fibra multimodo de índice escalonado, los rayos que zigzaguean recorren más camino que los axiales, y un pulso se ensancha en \(\Delta t\approx Ln_1\Delta/c\) con \(\Delta=(n_1-n_2)/n_2\); las fibras de índice gradual y las monomodo eliminan ese efecto. La sílice ultrapura alcanza pérdidas de 0.2 dB/km a 1550 nm, el mínimo entre la dispersión de Rayleigh (\(\propto\lambda^{-4}\)) y la absorción infrarroja: la señal pierde la mitad de su potencia cada 15 km y se amplifica cada 50–100 km.</p>
<div class="sim" data-sim="fiber-optic" data-title="Fibra óptica: cono de aceptación, ensanchamiento y atenuación"></div>
<div class="sim-guide"><ul>
<li>Con \(n_1=1.48\) y \(n_2=1.46\), AN = 0.24 y el cono de aceptación es de 14°. Un rayo más inclinado se escapa por el revestimiento.</li>
<li>Un kilómetro de esa fibra ensancha un pulso unos 68 ns: limita la velocidad de transmisión a unas decenas de Mbit/s.</li>
<li>A 0.2 dB/km, después de 50 km queda 10 % de la potencia.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Qué fracción de la luz refleja una superficie de diamante (\(n=2.42\)) a incidencia normal?
<details><summary>Respuesta</summary><p>\((1.42/3.42)^2=0.172\).</p></details></li>
<li><span class="lvl">Básico</span>¿Hasta qué longitud de onda absorbe el CdS (\(E_g=2.42\) eV)? ¿De qué color se ve?
<details><summary>Respuesta</summary><p>\(\lambda_g=1240/2.42=512\) nm: absorbe azul y violeta, transmite verde-amarillo-rojo; se ve amarillo-naranja.</p></details></li>
<li><span class="lvl">Intermedio</span>Calcule el ángulo de Brewster y el ángulo crítico para una interfaz vidrio (1.5)–aire.
<details><summary>Respuesta</summary><p>Brewster (aire → vidrio): 56.3°; crítico (vidrio → aire): 41.8°.</p></details></li>
<li><span class="lvl">Intermedio</span>Una placa de vidrio (\(n=1.5\)) sin absorción, ¿qué fracción transmite contando las reflexiones múltiples?
<details><summary>Respuesta</summary><p>\(R=0.04\), \(T=(1-R)/(1+R)=0.923\).</p></details></li>
<li><span class="lvl">Avanzado</span>Para una fibra de índice escalonado (\(n_1=1.48\), \(n_2=1.46\)), estime el ensanchamiento de un pulso en 1 km y la máxima tasa de bits si los pulsos deben estar separados al menos por ese ensanchamiento.
<details><summary>Respuesta</summary><p>\(\Delta t=1000(1.48)(0.0137)/3\times10^8=68\) ns; tasa \(\approx1/\Delta t\approx15\) Mbit/s.</p></details></li>
</ol>
