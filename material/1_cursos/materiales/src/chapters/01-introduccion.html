<p class="lead">La ciencia de los materiales estudia la relación entre la estructura de un material y sus propiedades; la ingeniería de materiales usa esa relación para diseñar la estructura que produce las propiedades que un uso exige. Este capítulo presenta el marco conceptual del curso, las grandes familias de materiales y una primera mirada cuantitativa a cómo se comparan.</p>

<section>
<h2>El tetraedro de los materiales</h2>
<p>Toda la disciplina se organiza alrededor de cuatro componentes ligados en cadena: el <span class="term">procesamiento</span> (cómo se fabrica el material: colada, laminado, tratamiento térmico, sinterizado, polimerización) determina la <span class="term">estructura</span> (la disposición de sus componentes en todas las escalas); la estructura determina las <span class="term">propiedades</span> (la respuesta a un estímulo: carga, campo eléctrico, calor, luz, ambiente químico), y las propiedades determinan el <span class="term">desempeño</span> del componente en servicio. Esta cadena suele dibujarse como un tetraedro con la caracterización en el centro, porque cada eslabón se conoce solo a través de mediciones.</p>
<div class="box def"><h4>Propiedad de un material</h4><p>Una propiedad es una relación entre un estímulo y la respuesta del material, expresada de forma que no dependa del tamaño ni de la forma de la muestra. El módulo de Young \(E=\sigma/\varepsilon\) relaciona esfuerzo y deformación; la conductividad \(\sigma_e=J/\mathcal E\) relaciona densidad de corriente y campo; la conductividad térmica \(k\) relaciona flujo de calor y gradiente de temperatura. Una barra puede ser más o menos rígida según su longitud, pero el módulo es el mismo.</p></div>
<p>Callister agrupa las propiedades en seis categorías: mecánicas, eléctricas, térmicas, magnéticas, ópticas y de deterioro (químicas). El curso las recorre todas, y en cada caso busca el mismo tipo de explicación: un mecanismo atómico o microestructural que hace que la propiedad tenga el valor que tiene.</p>
<div class="box ex"><h4>Tres vasos y una lámina</h4>
<p>Callister muestra tres discos de alúmina (\(\text{Al}_2\text{O}_3\)) de la misma composición: uno transparente, otro translúcido y otro opaco. ¿Qué cambia entre ellos?</p>
<details><summary>Solución</summary><p>Solo la estructura producida por el procesamiento. El transparente es un monocristal: la luz no encuentra interfaces. El translúcido es policristalino y denso: los bordes de grano dispersan algo de luz porque la alúmina es birrefringente. El opaco es policristalino y poroso: cada poro es una interfaz con un salto grande de índice de refracción y dispersa fuertemente. Misma química, propiedades ópticas opuestas.</p></details>
</div>
</section>

<section>
<h2>Las familias de materiales</h2>
<p>La clasificación clásica se basa en el tipo de enlace químico, que explica buena parte de las propiedades de cada familia:</p>
<div class="tablewrap"><table>
<tr><th>Familia</th><th>Enlace dominante</th><th>Rasgos típicos</th><th>Ejemplos</th></tr>
<tr><td>Metales</td><td>Metálico (electrones deslocalizados)</td><td>Rígidos, resistentes, dúctiles, tenaces; buenos conductores eléctricos y térmicos; opacos y brillantes</td><td>Aceros, aleaciones de Al, Cu, Ti, Ni</td></tr>
<tr><td>Cerámicos</td><td>Iónico y covalente</td><td>Muy rígidos y duros, refractarios, frágiles; aislantes; resistentes a la corrosión</td><td>\(\text{Al}_2\text{O}_3\), \(\text{SiC}\), \(\text{Si}_3\text{N}_4\), vidrios, concreto</td></tr>
<tr><td>Polímeros</td><td>Covalente en la cadena, secundario entre cadenas</td><td>Ligeros, poco rígidos, deformables, aislantes; propiedades muy sensibles a la temperatura</td><td>PE, PP, PVC, PMMA, nailon, epoxi, cauchos</td></tr>
<tr><td>Compuestos</td><td>Combinación de fases</td><td>Propiedades diseñadas a medida, a menudo anisótropas</td><td>CFRP, fibra de vidrio, concreto reforzado, madera</td></tr>
</table></div>
<p>A estas familias se suman los <span class="term">materiales avanzados</span>, definidos más por la función que por el enlace: semiconductores, biomateriales, materiales inteligentes (piezoeléctricos, aleaciones con memoria de forma, magnetostrictivos) y nanomateriales.</p>
<div class="box note"><h4>Por qué el enlace importa tanto</h4><p>Un metal se deforma plásticamente porque los planos de átomos pueden deslizar sin romper la neutralidad eléctrica: los electrones de conducción acompañan a los iones. En un cristal iónico, el mismo deslizamiento enfrentaría iones del mismo signo; en uno covalente, rompería enlaces direccionales. Por eso los cerámicos son frágiles. El capítulo 2 hace esta idea cuantitativa con los potenciales interatómicos, y el capítulo 9 la lleva a las dislocaciones.</p></div>
</section>

<section>
<h2>Las escalas de la estructura</h2>
<p>La palabra «estructura» abarca más de diez órdenes de magnitud. Cada escala controla propiedades distintas, y una parte importante del trabajo de un ingeniero de materiales consiste en reconocer en qué escala está el origen de una propiedad.</p>
<div class="tablewrap"><table>
<tr><th>Escala</th><th class="c">Tamaño típico</th><th>Qué se ve</th><th>Propiedades que controla</th></tr>
<tr><td>Subatómica</td><td class="c">\(10^{-15}\)–\(10^{-10}\) m</td><td>Núcleo, electrones, niveles de energía</td><td>Magnetismo, color, conductividad (bandas)</td></tr>
<tr><td>Atómica</td><td class="c">\(10^{-10}\) m</td><td>Enlace, celda unitaria, defectos puntuales</td><td>Módulo elástico, densidad, expansión térmica</td></tr>
<tr><td>Nanoestructura</td><td class="c">\(10^{-9}\)–\(10^{-7}\) m</td><td>Precipitados, dislocaciones, dominios</td><td>Resistencia mecánica, coercitividad</td></tr>
<tr><td>Microestructura</td><td class="c">\(10^{-7}\)–\(10^{-4}\) m</td><td>Granos, fases, poros (microscopio)</td><td>Resistencia, tenacidad, transparencia</td></tr>
<tr><td>Macroestructura</td><td class="c">\(&gt;10^{-3}\) m</td><td>Piezas, soldaduras, defectos visibles</td><td>Desempeño del componente</td></tr>
</table></div>

<section>
<h2>Mapas de propiedades</h2>
<p>Comparar materiales una propiedad a la vez es engañoso, porque el diseño casi siempre exige varias a la vez. Michael Ashby propuso representar dos propiedades en ejes logarítmicos: cada familia ocupa una región característica y, sobre esos ejes, los criterios de diseño se convierten en rectas. En el mapa de módulo contra densidad, por ejemplo, el cociente \(E/\rho\) (rigidez específica) es constante sobre rectas de pendiente 1; \(E^{1/2}/\rho\), que gobierna la rigidez de una viga ligera, sobre rectas de pendiente 2; y \(E^{1/3}/\rho\), propio de las placas ligeras, sobre rectas de pendiente 3.</p>
<div class="eq">\[\log E=\log\rho+\log C\quad(\text{tirante}),\qquad \log E=2\log\rho+2\log C\quad(\text{viga}),\qquad \log E=3\log\rho+3\log C\quad(\text{placa}).\]</div>
<div class="sim" data-sim="ashby-chart" data-title="Mapa de Ashby con 38 materiales reales"></div>
<div class="sim-guide"><ul>
<li>Con módulo contra densidad, mueva la línea guía de pendiente 2: los materiales por encima de ella hacen vigas más rígidas que los de debajo para el mismo peso. Note que la madera y el CFRP compiten con el acero y el aluminio.</li>
<li>Cambie a resistencia contra densidad y luego a tenacidad contra módulo: los cerámicos pasan de la cima del mapa a la base.</li>
<li>Pase el puntero sobre un punto para leer el material y sus valores.</li>
</ul></div>
<p>El capítulo 26 deduce estos índices de desempeño y los usa para seleccionar materiales con método; aquí basta con notar que cada familia ocupa una región, y que las regiones de los compuestos están precisamente entre las de sus fases constituyentes.</p>
</section>

<section>
<h2>Una breve historia</h2>
<p>Las edades de la prehistoria llevan nombre de material (piedra, cobre, bronce, hierro) porque el material disponible limitaba la técnica. La ciencia de los materiales como disciplina nació mucho después, a mediados del siglo XX, cuando la difracción de rayos X (Laue y los Bragg, 1912–1913), la teoría de dislocaciones (Taylor, Orowan y Polanyi, 1934), la mecánica de la fractura (Griffith 1921; Irwin 1957) y la física del estado sólido (bandas de energía, transistor de 1947) permitieron explicar las propiedades a partir de la estructura en lugar de solo medirlas.</p>
<div class="box hist"><h4>El primer departamento</h4><p>El primer departamento universitario con el nombre de ciencia de los materiales se creó en la Universidad Northwestern (EE. UU.) en 1959, al unir metalurgia, cerámica y física del estado sólido. Desde entonces, la disciplina incorporó los polímeros, los semiconductores, los biomateriales y la nanotecnología, y hoy integra la simulación computacional como una forma más de caracterización.</p></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Clasifique como metal, cerámico, polímero o compuesto: latón, vidrio de ventana, neumático, concreto reforzado, alúmina sinterizada, PET de botella, madera, acero inoxidable.
<details><summary>Respuesta</summary><p>Metales: latón, acero inoxidable. Cerámicos: vidrio, alúmina. Polímeros: PET. Compuestos: neumático (caucho con negro de humo y cuerdas), concreto reforzado, madera (compuesto natural de celulosa y lignina).</p></details></li>
<li><span class="lvl">Básico</span>Explique por qué el módulo de Young es una propiedad pero la rigidez \(k=F/\delta\) de una barra no lo es.
<details><summary>Respuesta</summary><p>Para una barra, \(k=EA/L\): depende del área y de la longitud. El módulo es la relación entre esfuerzo y deformación, que no depende de la geometría.</p></details></li>
<li><span class="lvl">Intermedio</span>Con los datos del mapa de Ashby, calcule \(E/\rho\) del acero 1020, del aluminio 6061 y del Ti-6Al-4V. ¿Qué observa?
<details><summary>Respuesta</summary><p>Acero: \(207/7.85=26.4\); aluminio: \(69/2.70=25.6\); titanio: \(114/4.43=25.7\) GPa·cm³/g. Casi idénticos: los tres metales estructurales tienen la misma rigidez específica, por eso un tirante del mismo peso es igual de rígido con cualquiera de ellos.</p></details></li>
<li><span class="lvl">Intermedio</span>Compare el índice de viga \(E^{1/2}/\rho\) del acero (207 GPa, 7.85 g/cm³) y de la madera de pino (10 GPa, 0.50 g/cm³). ¿Cuál hace la viga más ligera para la misma rigidez?
<details><summary>Respuesta</summary><p>Acero: \(\sqrt{207}/7.85=1.83\); pino: \(\sqrt{10}/0.50=6.32\). La madera da una viga unas 3.5 veces más ligera, lo que explica su uso histórico en estructuras y aviones.</p></details></li>
<li><span class="lvl">Avanzado</span>Una lámina de alúmina translúcida tiene granos de 20 µm. Si la mitad de la luz se pierde cada \(\ell\) de recorrido y cada borde de grano dispersa una fracción \(f=0.2\%\), estime \(\ell\).
<details><summary>Respuesta</summary><p>La luz cruza un borde cada 20 µm; tras \(N\) bordes queda \((1-f)^N\). Con \((0.998)^N=0.5\), \(N=346\) y \(\ell\approx346\times20\ \mu\text m\approx6.9\) mm.</p></details></li>
</ol>
