<p class="lead">Hay más de 160 000 materiales de ingeniería. Elegir uno no es buscar el «mejor» en abstracto, sino el que maximiza el desempeño de un componente bajo sus restricciones. Michael Ashby convirtió esa elección en un procedimiento: traducir el diseño en un índice de material y leer la respuesta en un mapa de propiedades. Este capítulo lo aplica y añade una dimensión ineludible: el impacto ambiental.</p>

<section>
<h2>Traducir el diseño</h2>
<p>Todo problema de selección se descompone en cuatro elementos:</p>
<ul>
<li><b>Función</b>: qué hace el componente (sostener una carga, transmitir calor, contener presión).</li>
<li><b>Objetivo</b>: qué se quiere minimizar o maximizar (masa, costo, energía, deflexión).</li>
<li><b>Restricciones</b>: lo que no se puede violar (no fallar, no deformarse más de cierto valor, resistir 200 °C, ser soldable).</li>
<li><b>Variables libres</b>: lo que el diseñador puede ajustar (casi siempre una dimensión de la sección y, por supuesto, el material).</li>
</ul>
<p>El método consiste en escribir el objetivo, eliminar la variable libre con la restricción y agrupar las propiedades del material en un solo cociente, el <span class="term">índice de desempeño</span> \(M\).</p>
<h3>Ejemplo 1: tirante ligero y resistente</h3>
<p>Un tirante de longitud \(L\) fija debe soportar una fuerza \(F\) sin fluir; el área \(A\) es libre. Masa: \(m=AL\rho\). Restricción: \(F/A\le\sigma_y\Rightarrow A=F/\sigma_y\). Sustituyendo, \(m=FL\,(\rho/\sigma_y)\): para minimizar la masa hay que maximizar \(M=\sigma_y/\rho\).</p>
<h3>Ejemplo 2: viga ligera y rígida</h3>
<p>Una viga de sección cuadrada \(b\times b\) (variable libre \(b\)) y longitud \(L\) debe tener una rigidez a flexión \(S=CEI/L^3\) dada, con \(I=b^4/12\). Despejando \(b^2=\sqrt{12SL^3/(CE)}\) y sustituyendo en \(m=b^2L\rho\):</p>
<div class="eq">\[m=\left(\frac{12S}{C}\right)^{1/2}L^{5/2}\left(\frac{\rho}{E^{1/2}}\right)\ \Rightarrow\ M=\frac{E^{1/2}}{\rho}.\]</div>
<div class="tablewrap"><table>
<tr><th>Componente y restricción</th><th class="c">Minimizar masa: maximizar</th><th class="c">Pendiente en el mapa log–log</th></tr>
<tr><td>Tirante, rigidez dada</td><td class="c">\(E/\rho\)</td><td class="c">1</td></tr>
<tr><td>Tirante, resistencia dada</td><td class="c">\(\sigma_y/\rho\)</td><td class="c">1</td></tr>
<tr><td>Viga o columna, rigidez o pandeo dados</td><td class="c">\(E^{1/2}/\rho\)</td><td class="c">2</td></tr>
<tr><td>Viga, resistencia dada</td><td class="c">\(\sigma_y^{2/3}/\rho\)</td><td class="c">1.5</td></tr>
<tr><td>Placa, rigidez dada</td><td class="c">\(E^{1/3}/\rho\)</td><td class="c">3</td></tr>
<tr><td>Placa, resistencia dada</td><td class="c">\(\sigma_y^{1/2}/\rho\)</td><td class="c">2</td></tr>
<tr><td>Recipiente a presión, fuga antes de rotura</td><td class="c">\(K_{Ic}^2/\sigma_y\)</td><td class="c">—</td></tr>

<p class="ctrl-note">Ashby (2011), apéndice B. Para minimizar el costo en lugar de la masa se reemplaza \(\rho\) por \(C_m\rho\).</p>
</section>

<section>
<h2>Selección con índices</h2>
<p>En un mapa logarítmico, todos los materiales con el mismo índice caen sobre una recta: \(\log E=2\log\rho+2\log M\) para \(M=E^{1/2}/\rho\). Se desplaza la línea guía hacia la región de materiales hasta dejar unos pocos por encima: esos son los candidatos. Las restricciones adicionales (temperatura máxima, tenacidad mínima, costo) eliminan opciones antes de ordenar por el índice.</p>
<div class="sim" data-sim="material-index" data-title="Ranking de materiales por índice de desempeño con restricciones"></div>
<div class="sim-guide"><ul>
<li>Viga ligera y rígida: la madera, el bambú y el CFRP superan a todos los metales.</li>
<li>Agregue una restricción de tenacidad (\(K_{Ic}\ge15\) MPa√m): desaparecen la madera y los cerámicos.</li>
<li>Cambie el objetivo a costo: el acero al carbono y el concreto pasan al frente. Por eso los puentes son de acero y concreto, y las bicicletas de competencia de carbono.</li>
</ul></div>
<div class="sim" data-sim="selection-chart" data-title="Mapa de selección con línea guía y restricciones"></div>
<div class="sim-guide"><ul>
<li>Mueva la línea guía de pendiente 2 hasta dejar cinco candidatos por encima.</li>
<li>Active la restricción de temperatura de servicio de 300 °C: los polímeros, la madera y el aluminio salen del mapa.</li>
</ul></div>
<h3>Forma de la sección</h3>
<p>El índice supone una forma fija. Una sección hueca o en I es más eficiente que una maciza porque aleja el material del eje neutro; Ashby lo cuantifica con el factor de forma \(\phi_B=12I/A^2\) (1 para un cuadrado macizo, 10–50 para perfiles de acero, menos para la madera o los compuestos, que no se pueden hacer tan delgados). El índice combinado de una viga es entonces \((\phi_BE)^{1/2}/\rho\), lo que explica por qué el acero, un material «pesado», compite en estructuras: se fabrica en perfiles muy eficientes.</p>
</section>

<section>
<h2>Materiales y ambiente</h2>
<p>El ciclo de vida de un producto tiene cinco fases: extracción y producción del material, fabricación, transporte, uso y fin de vida (reciclaje, reutilización, vertedero). La <span class="term">energía incorporada</span> (MJ/kg) y la <span class="term">huella de carbono</span> (kg CO₂/kg) de producción varían enormemente: el aluminio primario exige unas diez veces más energía por kilogramo que el acero, aunque reciclado necesita solo el 5–10 %. En los productos que consumen energía durante su uso (automóviles, aviones), la fase de uso domina y un material liviano pero «caro» en energía puede pagarse con el ahorro de combustible.</p>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Deduzca el índice de un tirante ligero de rigidez dada.
<details><summary>Respuesta</summary><p>Rigidez \(EA/L=S\Rightarrow A=SL/E\); \(m=AL\rho=SL^2\rho/E\): maximizar \(E/\rho\).</p></details></li>
<li><span class="lvl">Intermedio</span>Deduzca el índice de una placa ligera de rigidez dada (espesor libre, \(I\propto t^3\)).
<details><summary>Respuesta</summary><p>\(S\propto Et^3\Rightarrow t\propto(S/E)^{1/3}\); \(m\propto t\rho\propto\rho/E^{1/3}\): maximizar \(E^{1/3}/\rho\).</p></details></li>
<li><span class="lvl">Intermedio</span>Compare \(E^{1/2}/\rho\) del acero 1020, el aluminio 6061 y el CFRP cuasiisótropo de la base de datos.
<details><summary>Respuesta</summary><p>Acero: \(\sqrt{207}/7.85=1.83\); aluminio: \(\sqrt{69}/2.70=3.08\); CFRP: \(\sqrt{70}/1.55=5.40\) (GPa½·cm³/g).</p></details></li>
<li><span class="lvl">Avanzado</span>Una viga de rigidez dada se fabrica en acero (25 MJ/kg) o en aluminio primario (200 MJ/kg). Usando \(m\propto\rho/E^{1/2}\), ¿cuál tiene menor energía incorporada?
<details><summary>Respuesta</summary><p>Energía \(\propto H\rho/E^{1/2}\): acero \(25(7.85)/14.4=13.6\); aluminio \(200(2.70)/8.31=65\). El acero gasta casi cinco veces menos energía en producción, aunque pesa el doble.</p></details></li>
</ol>
