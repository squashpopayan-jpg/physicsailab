<p class="lead">El capítulo 2 estimó que romper los enlaces de un metal exige esfuerzos de varios gigapascales; el capítulo 8 midió que el cobre recocido fluye a 70 MPa. La diferencia la explica una idea de 1934: el cristal no desliza todo a la vez, sino enlace por enlace, gracias a las dislocaciones. Entender cómo se mueven y qué las frena es entender cómo se hace resistente un metal.</p>

<section>
<h2>La resistencia teórica y la paradoja</h2>
<p>Si dos planos atómicos deslizaran rígidamente uno sobre otro, el esfuerzo cortante necesario variaría periódicamente con el desplazamiento, con período \(b\). Frenkel (1926) lo aproximó con una senoide, \(\tau=\tau_{\max}\sen(2\pi x/b)\), e igualó la pendiente inicial con la ley de Hooke, \(\tau=G\,x/d\):</p>
<div class="eq">\[\tau_{\text{teórico}}=\frac{G\,b}{2\pi d}\approx\frac{G}{2\pi}\approx\frac{G}{10}.\]</div>
<p>Para el cobre (\(G=46\) GPa) daría unos 7 GPa; los monocristales de cobre fluyen a menos de 1 MPa. Taylor, Orowan y Polanyi, en tres artículos independientes de 1934, propusieron que el deslizamiento ocurre por el movimiento de dislocaciones: en cada instante solo se rompen y rehacen los enlaces de la línea de la dislocación, como se desplaza una alfombra empujando una arruga. El esfuerzo necesario, el de Peierls–Nabarro, es varios órdenes de magnitud menor que el teórico, y crece exponencialmente con el ancho del núcleo de la dislocación: pequeño en los metales FCC, mayor en BCC y enorme en cerámicos covalentes.</p>
<div class="box hist"><h4>La confirmación</h4><p>Las dislocaciones fueron una hipótesis durante veinte años. En 1956, Hirsch, Horne y Whelan las vieron moverse en láminas delgadas de aluminio con el microscopio electrónico de transmisión, y Menter obtuvo imágenes de los planos de red alrededor de una de ellas. Los «bigotes» (whiskers) monocristalinos sin dislocaciones, crecidos en los años cincuenta, alcanzan resistencias cercanas a la teórica.</p></div>
</section>

<section>
<h2>Sistemas de deslizamiento</h2>
<p>Las dislocaciones se mueven con preferencia sobre los planos más densos (los más separados entre sí) y en las direcciones más densas (donde \(b\) es mínimo). La combinación de un plano y una dirección contenida en él es un <span class="term">sistema de deslizamiento</span>.</p>
<div class="tablewrap"><table>
<tr><th>Estructura</th><th>Plano</th><th>Dirección</th><th class="c">Sistemas</th><th>Ejemplos</th></tr>
<tr><td>FCC</td><td>{111}</td><td>⟨1̅10⟩</td><td class="c">12</td><td>Cu, Al, Ni, Ag, Au</td></tr>
<tr><td>BCC</td><td>{110}</td><td>⟨1̅11⟩</td><td class="c">12</td><td>Fe-α, W, Mo</td></tr>
<tr><td>BCC</td><td>{211}, {321}</td><td>⟨1̅11⟩</td><td class="c">12 + 24</td><td>Fe-α, W, Mo, K</td></tr>
<tr><td>HCP</td><td>{0001}</td><td>⟨112̅0⟩</td><td class="c">3</td><td>Cd, Zn, Mg, Ti, Be</td></tr>
<tr><td>HCP</td><td>{101̅0}, {101̅1}</td><td>⟨112̅0⟩</td><td class="c">3 + 6</td><td>Ti, Mg, Zr</td></tr>
</table></div>
<p>Con 12 o más sistemas, los metales FCC y BCC son dúctiles: siempre hay alguno bien orientado. Los HCP con solo tres sistemas basales son poco dúctiles a temperatura ambiente. Para que un policristal se deforme sin abrir grietas, cada grano debe poder adoptar una forma arbitraria, lo que exige al menos cinco sistemas independientes (criterio de von Mises).</p>
</section>

<section>
<h2>La ley de Schmid</h2>
<p>Una dislocación solo responde a la componente del esfuerzo que cizalla su plano en su dirección. Para una tracción \(\sigma\) sobre un monocristal, si \(\phi\) es el ángulo entre el eje de carga y la normal del plano, y \(\lambda\) el ángulo entre el eje y la dirección de deslizamiento,</p>
<div class="eq key" data-name="Esfuerzo cortante resuelto">\[\tau_R=\sigma\cos\phi\cos\lambda,\qquad m=\cos\phi\cos\lambda\le\tfrac12.\]</div>
<p>El producto \(m\) es el <span class="term">factor de Schmid</span>. El deslizamiento empieza cuando, en el sistema más favorable, \(\tau_R\) alcanza el <span class="term">esfuerzo cortante resuelto crítico</span> \(\tau_{\text{crss}}\), una propiedad del material:</p>
<div class="eq">\[\sigma_y=\frac{\tau_{\text{crss}}}{(\cos\phi\cos\lambda)_{\max}}.\]</div>
<p>El mínimo de \(\sigma_y\) es \(2\tau_{\text{crss}}\), para \(\phi=\lambda=45^\circ\). Si la carga es paralela o perpendicular al plano, \(m=0\) y ese sistema no desliza.</p>
<div class="sim" data-sim="schmid" data-title="Factor de Schmid de un monocristal FCC"></div>
<div class="sim-guide"><ul>
<li>En modo «un sistema», mueva \(\phi\) y \(\lambda\): el máximo \(m=0.5\) exige que la normal, el eje y la dirección estén en un mismo plano a 45°.</li>
<li>En modo «FCC», cargue a lo largo de [001]: ocho sistemas comparten el máximo \(1/\sqrt6=0.408\). A lo largo de [111], el máximo baja a 0.272, y el cristal es 1.5 veces más resistente.</li>
<li>Un eje genérico como [123] activa un solo sistema (deslizamiento simple), con \(m\approx0.47\).</li>
</ul></div>
<div class="box ex"><h4>Esfuerzo cortante resuelto</h4>
<p>Un monocristal se tracciona con 52 MPa. El plano de deslizamiento forma \(\phi=60^\circ\) y la dirección \(\lambda=35^\circ\) con el eje. ¿Cuánto vale \(\tau_R\)? Si \(\tau_{\text{crss}}=30\) MPa, ¿a qué esfuerzo fluye?</p>
<details><summary>Solución</summary><p>\(\tau_R=52\cos60^\circ\cos35^\circ=21.3\) MPa, menor que el crítico: no fluye. \(\sigma_y=30/(\cos60^\circ\cos35^\circ)=73.2\) MPa.</p></details>
</div>
</section>

<section>
<h2>Endurecimiento por reducción del tamaño de grano</h2>
<p>En un policristal, una dislocación que llega a un borde de grano encuentra un cristal con otra orientación: no puede seguir en el mismo plano. Las dislocaciones se apilan contra el borde, y el campo de esfuerzos del apilamiento activa fuentes en el grano vecino cuando alcanza un valor crítico. Cuanto más pequeño es el grano, más corto es el apilamiento y mayor el esfuerzo externo necesario. El resultado es la relación de Hall–Petch (1951–1953):</p>
<div class="eq key" data-name="Ecuación de Hall–Petch">\[\sigma_y=\sigma_0+k_y\,d^{-1/2}.\]</div>
<p>\(\sigma_0\) es la resistencia de fricción de la red y \(k_y\) mide cuán eficaz es un borde como obstáculo; es grande en los aceros (≈ 0.7 MPa·m½) y pequeño en el aluminio y el cobre. La reducción del grano es el único mecanismo de endurecimiento que también mejora la tenacidad, y por eso los aceros microaleados de grano fino se usan en tuberías, puentes y automóviles. Por debajo de unos 10–20 nm la relación se invierte: los granos son demasiado pequeños para contener apilamientos y el borde de grano desliza.</p>
<div class="sim" data-sim="hall-petch" data-title="Ecuación de Hall–Petch para varios metales"></div>
<div class="sim-guide"><ul>
<li>Lleve un acero de 25 µm a 4 µm: el límite elástico pasa de unos 220 a 440 MPa sin cambiar la composición.</li>
<li>Note la escala: el eje horizontal es \(d^{-1/2}\), así que reducir el grano a la cuarta parte solo duplica el término de Hall–Petch.</li>
</ul></div>
</section>

<section>
<h2>Endurecimiento por solución sólida</h2>
<p>Un átomo de soluto distorsiona la red a su alrededor: uno más pequeño la comprime, uno más grande la expande. Esos campos interactúan con el de la dislocación (capítulo 6): los solutos pequeños se sitúan del lado comprimido del borde, los grandes del lado traccionado, y en ambos casos bajan la energía total. Mover la dislocación lejos de su atmósfera de solutos exige un esfuerzo adicional. El aumento de resistencia crece aproximadamente como \(c^{1/2}\) (Fleischer) o \(c^{2/3}\) (Labusch) con la concentración \(c\), y con el desajuste de tamaño y de módulo. Las aleaciones Cu–Ni ilustran el efecto: el níquel, disuelto en el cobre, aumenta su resistencia y su dureza y reduce su ductilidad.</p>
<p>Los solutos intersticiales (C y N en el hierro BCC) son mucho más eficaces porque producen distorsiones tetragonales que interactúan también con las dislocaciones de tornillo. Las atmósferas de Cottrell que forman explican el punto de fluencia y la meseta de Lüders de los aceros de bajo carbono, y el envejecimiento por deformación que aparece cuando un acero deformado se deja reposar.</p>
</section>

<section>
<h2>Endurecimiento por deformación</h2>
<p>Al deformarse un metal, las dislocaciones se multiplican (fuentes de Frank–Read) y se cruzan, formando bosques y marañas que se estorban entre sí. La densidad pasa de \(10^{10}\)–\(10^{12}\) m⁻² en el metal recocido a \(10^{15}\)–\(10^{16}\) m⁻² tras una deformación severa. El esfuerzo necesario para mover una dislocación a través del bosque es la relación de Taylor:</p>
<div class="eq key" data-name="Relación de Taylor">\[\tau=\alpha\,G\,b\,\sqrt{\rho_\perp},\qquad \alpha\approx0.2\text{–}0.5.\]</div>
<p>Industrialmente el endurecimiento se logra por <span class="term">trabajo en frío</span> (laminado, trefilado, estampado) a temperaturas por debajo de la de recristalización. Se cuantifica con el porcentaje de trabajo en frío,</p>
<div class="eq">\[\%\text{TF}=\frac{A_0-A_d}{A_0}\times100,\qquad \varepsilon_v=\ln\frac{A_0}{A_d}=-\ln\left(1-\frac{\%\text{TF}}{100}\right).\]</div>
<p>Cada pasada de laminado mueve el punto de partida sobre la curva de Hollomon del capítulo 8: el nuevo límite elástico es aproximadamente \(K\varepsilon_v^n\) y el alargamiento uniforme restante se reduce a \(n-\varepsilon_v\). Por eso un metal trabajado en frío es más resistente pero menos dúctil.</p>
<div class="sim" data-sim="cold-work" data-title="Trabajo en frío: resistencia, ductilidad y densidad de dislocaciones"></div>
<div class="sim-guide"><ul>
<li>Con cobre recocido (\(n=0.44\)), un 30 % de trabajo en frío lleva el límite elástico de unos 70 a más de 300 MPa.</li>
<li>Con \(n\) bajo (acero 4340 revenido) el endurecimiento por deformación es pequeño: ese acero se endurece por su microestructura, no por deformación.</li>
<li>En el cobre, pase del 36 % de trabajo en frío ((arepsilon_v=n=0.44)): el alargamiento uniforme restante llega a cero. Para seguir conformando hay que recocer.</li>
</ul></div>
<div class="box ex"><h4>Porcentaje de trabajo en frío</h4>
<p>Una barra de cobre de 15.2 mm de diámetro se trefila a 12.2 mm. Calcule el porcentaje de trabajo en frío y la deformación verdadera.</p>
<details><summary>Solución</summary><p>\(\%\text{TF}=100(15.2^2-12.2^2)/15.2^2=35.6\) %; \(\varepsilon_v=\ln(15.2^2/12.2^2)=0.44\).</p></details>
</div>
</section>

<section>
<h2>Recuperación, recristalización y crecimiento de grano</h2>
<p>Un metal trabajado en frío almacena energía en sus dislocaciones (unos pocos J/g). Al calentarlo, esa energía se libera en tres etapas:</p>
<ol>
<li><b>Recuperación</b>: las dislocaciones se reordenan en paredes de bajo ángulo (poligonización) y se aniquilan en parte; se recuperan la conductividad eléctrica y la térmica, y se alivian los esfuerzos residuales, con poco cambio en la resistencia.</li>
<li><b>Recristalización</b>: nacen granos nuevos, equiaxiales y casi libres de dislocaciones, que crecen consumiendo la matriz deformada. La resistencia y la ductilidad vuelven a los valores del metal recocido. La cinética sigue la ecuación de Avrami (JMAK), \(X=1-\exp(-kt^n)\), con \(k\) activado térmicamente. La <span class="term">temperatura de recristalización</span> (la que completa el proceso en una hora) está entre \(0.3\) y \(0.5\,T_f\) (en K), y baja con más trabajo en frío y con mayor pureza.</li>
<li><b>Crecimiento de grano</b>: a mayor tiempo o temperatura, los granos grandes crecen a expensas de los pequeños para reducir el área de borde de grano. Con frecuencia se ajusta a \(d^2-d_0^2=Kt\) con \(K\) de Arrhenius.</li>
</ol>
<p>Si el conformado se hace por encima de la temperatura de recristalización (<span class="term">trabajo en caliente</span>), el metal se ablanda mientras se deforma y admite deformaciones enormes; el plomo y el estaño recristalizan a temperatura ambiente y no se endurecen al deformarse.</p>
<div class="sim" data-sim="recrystallization" data-title="Cinética de recristalización y propiedades durante el recocido"></div>
<div class="sim-guide"><ul>
<li>En la gráfica de Avrami, cada temperatura es una sigmoide en escala logarítmica de tiempo. Subir 50 °C acorta el tiempo por un factor de diez o más.</li>
<li>En la vista de una hora de recocido, observe la caída brusca de la resistencia en el intervalo de recristalización y el aumento posterior del tamaño de grano.</li>
<li>Aumente el trabajo en frío previo: la recristalización ocurre a menor temperatura, porque hay más energía almacenada que la impulsa.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule el factor de Schmid para \(\phi=45^\circ\), \(\lambda=45^\circ\), y para \(\phi=30^\circ\), \(\lambda=70^\circ\).
<details><summary>Respuesta</summary><p>0.500 y 0.296.</p></details></li>
<li><span class="lvl">Básico</span>Un acero tiene \(\sigma_0=70\) MPa y \(k_y=0.74\) MPa·m½. Calcule \(\sigma_y\) para \(d=25\) µm y \(d=4\) µm.
<details><summary>Respuesta</summary><p>218 MPa y 440 MPa.</p></details></li>
<li><span class="lvl">Intermedio</span>Con la relación de Taylor (\(\alpha=0.3\), \(G=46\) GPa, \(b=0.256\) nm), compare el esfuerzo cortante del cobre con \(\rho_\perp=10^{12}\) y \(10^{15}\) m⁻².
<details><summary>Respuesta</summary><p>3.5 MPa y 112 MPa: mil veces más dislocaciones dan treinta veces más resistencia.</p></details></li>
<li><span class="lvl">Intermedio</span>Un monocristal de aluminio (\(\tau_{\text{crss}}=0.8\) MPa) se carga a lo largo de [001]. ¿A qué esfuerzo empieza a fluir?
<details><summary>Respuesta</summary><p>\(m_{\max}=1/\sqrt6\); \(\sigma_y=0.8\sqrt6=1.96\) MPa.</p></details></li>
<li><span class="lvl">Intermedio</span>Se quiere una chapa de cobre con \(\sigma_y\ge300\) MPa por trabajo en frío. Con \(K=530\) MPa y \(n=0.44\), ¿qué porcentaje de trabajo en frío hace falta?
<details><summary>Respuesta</summary><p>\(\varepsilon_v=(300/530)^{1/0.44}=0.274\); \(\%\text{TF}=100(1-\ee^{-0.274})=24\) %.</p></details></li>
<li><span class="lvl">Avanzado</span>La recristalización de un latón trabajado en frío alcanza el 50 % en 10 min a 600 K y en 1 min a 650 K. Suponiendo \(1/t_{50}\propto\exp(-Q/RT)\), calcule \(Q\) y estime \(t_{50}\) a 575 K.
<details><summary>Respuesta</summary><p>\(Q=R\ln10/(1/600-1/650)=149\) kJ/mol. \(t_{50}(575)=10\exp[(Q/R)(1/575-1/600)]=37\) min.</p></details></li>
</ol>
