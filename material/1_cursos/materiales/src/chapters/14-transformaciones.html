<template class="chapter-src" data-id="transformaciones" data-num="14" data-title="Cinética de las transformaciones de fase" data-part="Parte IV · Fases y transformaciones" data-short="Nucleación homogénea y heterogénea, crecimiento, velocidad global y la forma de C, ecuación de Avrami, diagramas TTT de un acero eutectoide, perlita, bainita, martensita y esferoidita">
<p class="lead">El diagrama de fase dice adónde va un sistema; la cinética dice cuándo llega y por qué camino. Un acero eutectoide enfriado en horas se vuelve perlita blanda; enfriado en segundos, martensita dura como el vidrio. Ambos tienen la misma composición y el mismo destino de equilibrio. Este capítulo explica cómo el tiempo y la temperatura deciden la microestructura.</p>

<section>
<h2>Nucleación</h2>
<p>Una fase nueva aparece en forma de pequeñas partículas, los <span class="term">núcleos</span>, que luego crecen. Formar un núcleo esférico de radio \(r\) baja la energía libre en volumen, \(\tfrac43\pi r^3\Delta G_v\) (con \(\Delta G_v&lt;0\) por debajo de la temperatura de equilibrio), pero cuesta energía de interfaz, \(4\pi r^2\gamma\):</p>
<div class="eq key" data-name="Energía de un núcleo esférico">\[\Delta G(r)=\tfrac43\pi r^3\Delta G_v+4\pi r^2\gamma,\qquad r^*=-\frac{2\gamma}{\Delta G_v},\qquad \Delta G^*=\frac{16\pi\gamma^3}{3\,\Delta G_v^2}.\]</div>
<p>Los embriones más pequeños que \(r^*\) tienden a disolverse; los mayores, a crecer. Como \(\Delta G_v\) es proporcional al subenfriamiento, \(\Delta G_v=\Delta H_f\Delta T/T_f\), el radio crítico y la barrera disminuyen al enfriar más: \(r^*\propto1/\Delta T\) y \(\Delta G^*\propto1/\Delta T^2\).</p>
<p>En la práctica, la nucleación casi nunca es homogénea. Sobre una superficie (pared del molde, inclusión, borde de grano) el núcleo tiene forma de casquete esférico con ángulo de mojado \(\theta\), y la barrera se reduce por el factor</p>
<div class="eq">\[\Delta G^*_{\text{het}}=\Delta G^*_{\text{hom}}\,S(\theta),\qquad S(\theta)=\frac{(2+\cos\theta)(1-\cos\theta)^2}{4}.\]</div>
<p>Por eso se añaden <span class="term">inoculantes</span> a los metales fundidos (TiB₂ en el aluminio, Mg en las fundiciones nodulares): proveen sitios de nucleación y producen grano fino.</p>
<div class="sim" data-sim="nucleation" data-title="Energía libre de un núcleo y radio crítico"></div>
<div class="sim-guide"><ul>
<li>Con los datos del oro (Callister, ej. 10.1) y \(\Delta T=230\) °C: \(r^*=1.32\) nm y \(\Delta G^*=9.7\times10^{-19}\) J. El núcleo crítico tiene unos 570 átomos.</li>
<li>Duplique el subenfriamiento: \(r^*\) se reduce a la mitad y la barrera a la cuarta parte.</li>
<li>Pase a nucleación heterogénea con \(\theta=60^\circ\): la barrera cae a 16 %.</li>
</ul></div>
</section>

<section>
<h2>Velocidades de nucleación, crecimiento y transformación</h2>
<p>La velocidad de nucleación es el producto de dos factores que compiten: la probabilidad de formar un núcleo crítico, \(\exp(-\Delta G^*/k_BT)\), que crece al enfriar; y la movilidad de los átomos que se agregan, \(\exp(-Q_d/k_BT)\), que decrece al enfriar:</p>
<div class="eq">\[\dot N=K\,\exp\!\left(-\frac{\Delta G^*}{k_BT}\right)\exp\!\left(-\frac{Q_d}{k_BT}\right).\]</div>
<p>El resultado es un máximo a una temperatura intermedia. La velocidad de crecimiento, controlada por la difusión, \(\dot G=C\exp(-Q/k_BT)\), es máxima cerca del equilibrio. La velocidad global de la transformación combina ambas, y su inverso (el tiempo para transformar) tiene forma de C con una «nariz»: es el origen de las curvas de los diagramas TTT.</p>
<div class="sim" data-sim="nucleation-rate" data-title="Nucleación, crecimiento y la curva en C"></div>
<div class="sim-guide"><ul>
<li>La curva de nucleación tiene su máximo muy por debajo de la de crecimiento. Su producto (velocidad global) tiene un máximo intermedio.</li>
<li>El tiempo de transformación es el inverso: una C acostada. Aumente la energía de activación de difusión y la nariz baja y se aleja en el tiempo.</li>
</ul></div>
</section>

<section>
<h2>La ecuación de Avrami</h2>
<p>A temperatura constante, la fracción transformada crece en forma de S: lento al principio (nucleación), rápido en el medio y lento al final, cuando los granos nuevos chocan entre sí y queda poca fase original. Johnson, Mehl, Avrami y Kolmogorov (JMAK) obtuvieron, para nucleación aleatoria en el volumen,</p>
<div class="eq key" data-name="Ecuación de Avrami">\[y=1-\exp\left(-k\,t^n\right),\qquad t_{0.5}=\left(\frac{\ln2}{k}\right)^{1/n},\]</div>
<p>donde \(n\) (1 a 4) depende del mecanismo: 4 para nucleación continua y crecimiento tridimensional, 3 para núcleos preexistentes, menos para crecimiento en dos dimensiones o controlado por difusión. La velocidad de la transformación se define a menudo como \(1/t_{0.5}\). Graficando \(\ln\ln[1/(1-y)]\) contra \(\ln t\) se obtiene una recta de pendiente \(n\), que es como se determina el exponente.</p>
<div class="sim" data-sim="avrami" data-title="Cinética de Avrami y su linealización"></div>
<div class="sim-guide"><ul>
<li>Cambie \(n\) manteniendo \(t_{0.5}\): la curva se hace más abrupta al aumentar \(n\).</li>
<li>Agregue ruido a los «datos» y ajuste: la pendiente de la recta recupera \(n\).</li>
</ul></div>
</section>

<section>
<h2>Diagramas de transformación isotérmica (TTT)</h2>
<p>Para el acero eutectoide se construye el diagrama TTT (temperatura–tiempo–transformación) austenitizando probetas, llevándolas muy rápido a una temperatura bajo 727 °C, manteniéndolas allí distintos tiempos y templándolas para «congelar» el avance. Dos curvas en C marcan el inicio (1 %) y el final (99 %) de la transformación. Los productos dependen de la temperatura:</p>
<ul>
<li><b>Entre 727 y unos 540 °C</b>: <span class="term">perlita</span>, gruesa cerca de 727 °C y fina más abajo. La nariz de la curva, donde la transformación es más rápida (alrededor de 1 s), está cerca de 540 °C.</li>
<li><b>Entre 540 °C y \(M_s\)</b>: <span class="term">bainita</span>, agujas o placas de ferrita con partículas finas de cementita; superior por encima de unos 350 °C e inferior por debajo. Es más dura que la perlita fina y conserva buena tenacidad.</li>
<li><b>Por debajo de \(M_s\)</b> (220 °C en el acero eutectoide): <span class="term">martensita</span>, si la austenita llegó hasta allí sin transformarse.</li>
</ul>
<div class="sim" data-sim="ttt" data-title="Diagrama TTT de un acero eutectoide con trayectorias de tratamiento"></div>
<div class="sim-guide"><ul>
<li>Lleve el acero a 350 °C y manténgalo \(10^4\) s antes de templar: 100 % bainita.</li>
<li>Enfríe a 250 °C, mantenga 100 s y temple: la austenita no empezó a transformarse; al templar se vuelve martensita (y algo de austenita retenida).</li>
<li>Dos etapas: 20 s a 650 °C y \(10^3\) s a 400 °C. La primera produce perlita; la austenita que sobrevive se vuelve bainita en la segunda.</li>
</ul></div>
<p>Los diagramas TTT valen para transformaciones isotérmicas. En la práctica las piezas se enfrían de forma continua, y se usan los diagramas de <span class="term">transformación en enfriamiento continuo</span> (CCT), con las curvas desplazadas a tiempos más largos y temperaturas más bajas, y sin región bainítica en el acero al carbono eutectoide (capítulo 15).</p>
</section>

<section>
<h2>Martensita</h2>
<p>Si la austenita se enfría tan rápido que no hay tiempo para la difusión, se transforma por un mecanismo completamente distinto: un cizallamiento cooperativo de la red, a velocidades cercanas a la del sonido, en el que cada átomo se mueve menos que una distancia interatómica. El carbono queda atrapado en los intersticios octaédricos y distorsiona la celda BCC en una tetragonal centrada en el cuerpo (BCT), con</p>
<div class="eq">\[\frac ca\approx1+0.045\,(\%\,\text{C}).\]</div>
<p>La martensita es la fase más dura del acero (hasta 65 HRC con 0.6–0.8 % C), pero frágil. Su dureza no viene de la estructura cristalina, sino de la supersaturación de carbono y de la enorme densidad de dislocaciones y maclas. Como no requiere difusión, la fracción transformada depende solo de la temperatura alcanzada, no del tiempo. La relación de Koistinen y Marburger la describe:</p>
<div class="eq key" data-name="Relación de Koistinen–Marburger">\[f_M=1-\exp\left[-0.011\,(M_s-T)\right],\qquad T&lt;M_s,\]</div>
<p>y \(M_s\) baja al aumentar el carbono y los aleantes (Andrews: \(M_s=539-423C-30.4Mn-17.7Ni-12.1Cr-7.5Mo\), en °C y % en peso). En los aceros de alto carbono, \(M_f\) queda por debajo de la temperatura ambiente y parte de la austenita queda retenida.</p>
<div class="sim" data-sim="martensite" data-title="Martensita: temperatura de inicio, fracción y tetragonalidad"></div>
<div class="sim-guide"><ul>
<li>Suba el carbono de 0.2 a 1.0 %: \(M_s\) baja de unos 450 a 120 °C y la austenita retenida a temperatura ambiente crece.</li>
<li>Observe la celda BCT: el eje \(c\) se alarga 3.6 % con 0.8 % C.</li>
</ul></div>
<p>Finalmente, si una perlita o una martensita se calientan largo tiempo justo bajo 727 °C, la cementita se reorganiza en partículas esféricas para reducir el área de interfaz: es la <span class="term">esferoidita</span>, la microestructura más blanda y dúctil del acero, buscada antes del maquinado o del conformado en frío.</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Cuánto vale \(S(\theta)\) para \(\theta=30^\circ\), 90° y 180°?
<details><summary>Respuesta</summary><p>0.013, 0.5 y 1: un mojado perfecto elimina casi la barrera; sin mojado la nucleación es homogénea.</p></details></li>
<li><span class="lvl">Básico</span>Calcule \(c/a\) de la martensita con 0.8 % C.
<details><summary>Respuesta</summary><p>1.036.</p></details></li>
<li><span class="lvl">Intermedio</span>Una transformación alcanza 10 % en 20 s y 50 % en 60 s. Halle \(n\) y \(k\) de Avrami.
<details><summary>Respuesta</summary><p>\(n=\ln[\ln0.9/\ln0.5]/\ln(20/60)=1.71\); \(k=\ln2/60^{1.71}=6.2\times10^{-4}\) s⁻ⁿ.</p></details></li>
<li><span class="lvl">Intermedio</span>Calcule \(M_s\) con Andrews para un acero 4340 (0.40 C, 0.7 Mn, 1.8 Ni, 0.8 Cr, 0.25 Mo).
<details><summary>Respuesta</summary><p>\(539-169.2-21.3-31.9-9.7-1.9=305\) °C.</p></details></li>
<li><span class="lvl">Intermedio</span>Con Koistinen–Marburger y \(M_s=220\) °C, ¿qué fracción de martensita hay a 25 °C? ¿Y si se enfría a −80 °C?
<details><summary>Respuesta</summary><p>0.883 y 0.963 (tratamiento subcero para reducir la austenita retenida).</p></details></li>
<li><span class="lvl">Avanzado</span>Derive \(r^*\) y \(\Delta G^*\) de \(\Delta G(r)\) y demuestre que el núcleo crítico es el máximo, no el mínimo, de la curva.
<details><summary>Respuesta</summary><p>\(\dd\Delta G/\dd r=4\pi r^2\Delta G_v+8\pi r\gamma=0\Rightarrow r^*=-2\gamma/\Delta G_v\). Sustituyendo, \(\Delta G^*=16\pi\gamma^3/(3\Delta G_v^2)\). La segunda derivada en \(r^*\) es \(8\pi r^*\Delta G_v+8\pi\gamma=-8\pi\gamma&lt;0\): es un máximo.</p></details></li>
</ol>
