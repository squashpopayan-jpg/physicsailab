<p class="lead">Un polímero es una molécula gigante formada por la repetición de una unidad pequeña, el mero. Un solo hilo de polietileno puede tener cien mil átomos de carbono en cadena. Esa longitud explica casi todo lo que los distingue de metales y cerámicos: se enredan, cristalizan solo en parte, tienen memoria del tiempo de carga y su rigidez cambia mil veces en unas decenas de grados.</p>

<section>
<h2>Moléculas de cadena larga</h2>
<p>Los átomos de la cadena principal (casi siempre carbono, a veces O, N, Si) se unen por enlaces covalentes; las cadenas entre sí, por enlaces de van der Waals y de hidrógeno. La estructura de una cadena se describe en varios niveles:</p>
<ul>
<li><b>Química del mero</b>: polietileno (—CH₂—CH₂—), polipropileno (un CH₃ lateral), PVC (un Cl), poliestireno (un anillo bencénico), nailon (grupos amida que forman puentes de hidrógeno).</li>
<li><b>Arquitectura</b>: lineal, ramificada (el polietileno de baja densidad tiene ramas cortas que impiden cristalizar), entrecruzada (cauchos vulcanizados) o en red tridimensional (epoxis y fenólicos).</li>
<li><b>Tacticidad</b>: los grupos laterales pueden estar todos del mismo lado (isotáctico), alternados (sindiotáctico) o al azar (atáctico). Solo las cadenas regulares cristalizan: el polipropileno isotáctico es un plástico rígido; el atáctico, una goma blanda.</li>
<li><b>Copolímeros</b>: con dos meros, al azar, alternados, en bloques (cauchos termoplásticos SBS) o injertados.</li>
</ul>
<p>Por su respuesta al calor se distinguen los <span class="term">termoplásticos</span> (cadenas lineales o ramificadas que se ablandan y se pueden moldear una y otra vez) de los <span class="term">termoestables</span> (redes entrecruzadas que no funden: se degradan).</p>
</section>

<section>
<h2>Peso molecular</h2>
<p>La polimerización produce cadenas de longitudes distintas, de modo que el peso molecular es una distribución. Se usan dos promedios:</p>
<div class="eq key" data-name="Pesos moleculares promedio">\[\bar M_n=\sum x_iM_i,\qquad \bar M_w=\sum w_iM_i,\qquad \text{IPD}=\frac{\bar M_w}{\bar M_n}\ge1,\]</div>
<p>donde \(x_i\) es la fracción en número de cadenas con peso \(M_i\) y \(w_i\) su fracción en masa. El promedio en peso siempre es mayor, porque pondera más las cadenas largas. El grado de polimerización es \(\text{GP}=\bar M_n/m\), con \(m\) la masa del mero. En la policondensación (poliésteres, nailon), Flory demostró que con un grado de avance \(p\) la distribución es la «más probable», con \(\bar M_n\propto1/(1-p)\) y \(\bar M_w\propto(1+p)/(1-p)\): el índice de polidispersión tiende a 2.</p>
<p>La resistencia a la tracción crece con el peso molecular y se satura: \(\sigma\approx\sigma_\infty-A/\bar M_n\). Las cadenas cortas se deslizan con facilidad; las largas se enredan.</p>
<div class="sim" data-sim="mw-distribution" data-title="Distribuciones de peso molecular y sus promedios"></div>
<div class="sim-guide"><ul>
<li>En la distribución de Flory, suba \(p\) de 0.99 a 0.999: \(\bar M_n\) se multiplica por diez. La policondensación exige conversiones altísimas.</li>
<li>Pase a una distribución estrecha (polimerización aniónica viva): el IPD se acerca a 1.</li>
</ul></div>
</section>

<section>
<h2>Forma de las cadenas</h2>
<p>Cada enlace C–C forma 109.5° con el siguiente, pero puede girar alrededor de su eje. Una cadena en el fundido o en un sólido amorfo no está estirada: adopta un ovillo aleatorio. Si fuera una caminata aleatoria de \(N\) pasos de longitud \(l\), la distancia media entre los extremos sería</p>
<div class="eq key" data-name="Distancia extremo a extremo">\[\langle r^2\rangle^{1/2}=C_\infty^{1/2}\,l\,\sqrt N,\]</div>
<p>con \(C_\infty=1\) para la cadena libremente articulada, 2 para ángulo de enlace fijo con giro libre y unos 6.7 para el polietileno real, cuyas conformaciones están restringidas. Una cadena de polietileno de \(\bar M_n=100\,000\) g/mol tiene unos 7100 enlaces y una longitud de contorno de unos 900 nm, pero sus extremos están a solo unos 34 nm. Esa enorme reserva de longitud es la base de la elasticidad del caucho.</p>
<div class="sim" data-sim="polymer-chain" data-title="Una cadena como caminata aleatoria"></div>
<div class="sim-guide"><ul>
<li>Genere muchas cadenas con el mismo \(N\): la distancia extremo a extremo fluctúa mucho, pero su media cuadrática sigue \(\sqrt N\).</li>
<li>Duplique \(N\): \(\langle r^2\rangle^{1/2}\) crece un 41 %, no el doble.</li>
</ul></div>
</section>

<section>
<h2>Cristalinidad y transiciones térmicas</h2>
<p>Las cadenas regulares pueden plegarse en láminas cristalinas de unos 10 nm de espesor, que se agrupan en <span class="term">esferulitas</span>, separadas por regiones amorfas. La fracción cristalina se mide por densidad:</p>
<div class="eq">\[\%\,\text{cristalinidad}=\frac{\rho_c(\rho_s-\rho_a)}{\rho_s(\rho_c-\rho_a)}\times100,\]</div>
<p>con \(\rho_s\) la densidad de la muestra y \(\rho_c\), \(\rho_a\) las de los polímeros totalmente cristalino y amorfo. Un polietileno de 0.925 g/cm³ (con \(\rho_c=0.998\), \(\rho_a=0.870\)) es 46 % cristalino.</p>
<p>Dos temperaturas organizan el comportamiento. La de <span class="term">fusión</span> \(T_m\) funde los cristales. La de <span class="term">transición vítrea</span> \(T_g\) es donde las regiones amorfas pasan de un vidrio rígido a un estado gomoso: por encima de \(T_g\), segmentos de cadena de decenas de átomos ganan movilidad. Ambas suben con la rigidez de la cadena (anillos, grupos laterales voluminosos), las interacciones entre cadenas (polares, puentes de hidrógeno) y el peso molecular.</p>

<section>
<h2>Viscoelasticidad</h2>
<p>Un polímero cerca de \(T_g\) responde como una combinación de sólido elástico y líquido viscoso. Los modelos mecánicos combinan resortes (\(\sigma=E\varepsilon\)) y amortiguadores (\(\sigma=\eta\dot\varepsilon\)):</p>
<ul>
<li><b>Maxwell</b> (en serie): bajo deformación constante, el esfuerzo se relaja como \(\sigma=\sigma_0\ee^{-t/\tau}\), \(\tau=\eta/E\); bajo carga constante, fluye sin límite.</li>
<li><b>Kelvin–Voigt</b> (en paralelo): bajo carga constante, la deformación crece hasta \(\sigma_0/E\) como \(1-\ee^{-t/\tau}\) (fluencia acotada), pero no relaja esfuerzos.</li>
<li><b>Sólido lineal estándar</b> (Zener): un resorte en paralelo con un Maxwell; relaja hasta un módulo de equilibrio y fluye hasta una deformación finita. Es el modelo mínimo realista.</li>
</ul>
<p>Bajo carga oscilante, el modelo de Zener da un módulo de almacenamiento \(E'\) que sube con la frecuencia y un módulo de pérdida \(E''\) con un máximo en \(\omega\tau=1\); su cociente, \(\tan\delta=E''/E'\), es lo que mide un análisis mecánico dinámico (DMA) y lo que se busca en amortiguadores de vibración.</p>
<div class="sim" data-sim="viscoelastic" data-title="Modelos de Maxwell, Kelvin–Voigt y Zener"></div>
<div class="sim-guide"><ul>
<li>Ensayo de relajación: el Kelvin no relaja; el Maxwell cae a cero; el Zener, al módulo de equilibrio.</li>
<li>Ensayo de fluencia y recuperación: el Maxwell deja una deformación permanente; el Kelvin y el Zener se recuperan.</li>
<li>En DMA, ubique el pico de \(\tan\delta\) y compruebe que está en \(\omega\tau\approx1\) (para el Zener, algo corrido).</li>
</ul></div>
<h3>Superposición tiempo–temperatura</h3>
<p>Calentar acelera todos los movimientos moleculares en la misma proporción. La curva de relajación a una temperatura es igual a la de otra, desplazada en el eje del tiempo por un factor \(a_T\). Cerca de \(T_g\), Williams, Landel y Ferry (1955) hallaron una forma casi universal:</p>
<div class="eq key" data-name="Ecuación WLF">\[\log a_T=\frac{-C_1\,(T-T_g)}{C_2+T-T_g},\qquad C_1=17.44,\ C_2=51.6\ \text{K}.\]</div>
<p>Diez grados sobre \(T_g\) los procesos son 700 veces más rápidos. Así se predice el comportamiento de décadas de servicio con ensayos de horas a temperatura algo mayor.</p>
</section>

<section>
<h2>Elasticidad del caucho</h2>
<p>En un caucho, la fuerza que se opone al estiramiento no viene de la energía de los enlaces, sino de la entropía: estirar una red de ovillos aleatorios reduce el número de conformaciones posibles. La teoría de la red gaussiana da, para estiramiento uniaxial \(\lambda=l/l_0\),</p>
<div class="eq key" data-name="Elasticidad de una red gaussiana">\[\sigma_{\text{nominal}}=G\left(\lambda-\frac1{\lambda^2}\right),\qquad G=nk_BT=\frac{\rho RT}{M_c},\]</div>
<p>donde \(n\) es la densidad de cadenas de la red y \(M_c\) el peso molecular entre puntos de entrecruzamiento. Tres consecuencias sorprendentes: el módulo crece con la temperatura (al revés que en metales), un caucho estirado se contrae al calentarlo (efecto Gough–Joule) y se calienta al estirarlo de golpe. A deformaciones grandes las cadenas llegan a su extensión máxima y la curva se endurece; el caucho natural, además, cristaliza al estirarse.</p>
<div class="sim" data-sim="rubber" data-title="Curva de un caucho y efecto de la temperatura y del entrecruzamiento"></div>
<div class="sim-guide"><ul>
<li>Con \(M_c=5000\) g/mol y \(\rho=0.92\) g/cm³ a 300 K, \(G=0.46\) MPa: un caucho blando.</li>
<li>Caliente de 300 a 360 K a carga fija: el estiramiento disminuye.</li>
<li>Más entrecruzamiento (\(M_c\) menor) da un caucho más rígido y menos extensible.</li>
</ul></div>
</section>

<section>
<h2>Procesamiento</h2>
<p>Los termoplásticos se procesan fundidos: extrusión (tubos, perfiles, películas), inyección (piezas complejas en segundos), soplado (botellas), termoformado (bandejas) e hilado (fibras, donde el estirado orienta las cadenas y multiplica la resistencia). Los termoestables se moldean antes de curar (moldeo por compresión, por transferencia, RTM). Los aditivos ajustan las propiedades: plastificantes (bajan \(T_g\): el PVC flexible), cargas (negro de humo en neumáticos), estabilizantes contra la luz ultravioleta y retardantes de llama.</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un polietileno tiene \(\bar M_n=21\,150\) g/mol. ¿Cuál es su grado de polimerización? (Mero C₂H₄: 28.05 g/mol.)
<details><summary>Respuesta</summary><p>\(21150/28.05=754\).</p></details></li>
<li><span class="lvl">Básico</span>Calcule la cristalinidad de un polietileno de 0.925 g/cm³ (\(\rho_c=0.998\), \(\rho_a=0.870\)).
<details><summary>Respuesta</summary><p>46.4 %.</p></details></li>
<li><span class="lvl">Intermedio</span>Para una cadena de polietileno de \(\bar M_n=100\,000\) g/mol (enlaces de 0.154 nm), estime la distancia extremo a extremo con \(C_\infty=6.7\) y la longitud de contorno.
<details><summary>Respuesta</summary><p>\(N=2(100000/28.05)=7130\); \(\langle r^2\rangle^{1/2}=\sqrt{6.7\cdot7130}\,(0.154)=34\) nm; contorno (zigzag) \(\approx N\,l\sen(54.75^\circ)=897\) nm.</p></details></li>
<li><span class="lvl">Intermedio</span>Un caucho de densidad 0.92 g/cm³ tiene \(G=1.0\) MPa a 300 K. ¿Cuánto vale \(M_c\)?
<details><summary>Respuesta</summary><p>\(M_c=\rho RT/G=920(8.314)(300)/10^6=2.29\) kg/mol \(=2290\) g/mol.</p></details></li>
<li><span class="lvl">Intermedio</span>Con WLF, ¿cuántas veces más rápido relaja un polímero a \(T_g+20\) que a \(T_g\)?
<details><summary>Respuesta</summary><p>\(\log a_T=-17.44(20)/71.6=-4.87\): \(7.4\times10^4\) veces.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que el modelo de Maxwell sometido a una deformación constante \(\varepsilon_0\) relaja como \(\sigma=E\varepsilon_0\ee^{-t/\tau}\).
<details><summary>Respuesta</summary><p>En serie, \(\dot\varepsilon=\dot\sigma/E+\sigma/\eta\). Con \(\dot\varepsilon=0\): \(\dot\sigma=-(E/\eta)\sigma\), cuya solución es \(\sigma=\sigma_0\ee^{-t/\tau}\) con \(\sigma_0=E\varepsilon_0\) y \(\tau=\eta/E\).</p></details></li>
</ol>
