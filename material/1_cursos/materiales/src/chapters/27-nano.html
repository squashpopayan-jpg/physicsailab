<p class="lead">Por debajo de unos 100 nm, las propiedades dejan de depender solo de la composición y la estructura: dependen también del tamaño. El oro de 3 nm funde 500 grados por debajo del oro macizo, y el color de un punto cuántico de CdSe se elige con su diámetro. Este capítulo explica esos efectos con física elemental y repasa las herramientas con que se observa la estructura a todas las escalas.</p>

<section>
<h2>Superficie y volumen</h2>
<p>En una partícula esférica de diámetro \(d\), la fracción de átomos en la superficie es aproximadamente \(f_s\approx6\,d_a/d\), con \(d_a\) el diámetro atómico. Una partícula de oro de 5 nm tiene un tercio de sus átomos en la superficie; una de 1 mm, uno de cada millón. Los átomos superficiales tienen menos vecinos y más energía, lo que hace a las nanopartículas excelentes catalizadores (oro, platino) y cambia su termodinámica. La temperatura de fusión baja según la relación de Gibbs–Thomson (forma simplificada de Pawlow):</p>
<div class="eq key" data-name="Fusión de nanopartículas">\[T_f(d)=T_f^\infty\left(1-\frac{4\sigma_{sl}}{\Delta H_f\,\rho\,d}\right).\]</div>
<p>Con \(\sigma_{sl}=0.27\) J/m² y \(\Delta H_f=63.7\) J/g, el oro de 2.5 nm funde cerca de 870 K, en acuerdo con las mediciones de Buffat y Borel (1976).</p>
<div class="sim" data-sim="nano-size" data-title="Fracción superficial y temperatura de fusión contra tamaño"></div>
<div class="sim-guide"><ul>
<li>Por debajo de 10 nm la fracción de átomos superficiales supera el 10 % y la temperatura de fusión cae visiblemente.</li>
<li>Los nanomateriales también cambian sus propiedades mecánicas: el grano nanométrico eleva la resistencia (Hall–Petch, capítulo 9) hasta unos 10–20 nm.</li>
</ul></div>
</section>

<section>
<h2>Confinamiento cuántico</h2>
<p>Cuando un semiconductor es más pequeño que el radio de Bohr de su excitón (5.6 nm en CdSe), los electrones y huecos quedan confinados como partículas en una caja y la brecha efectiva crece. La ecuación de Brus (1984) da la primera transición:</p>
<div class="eq key" data-name="Ecuación de Brus">\[E(r)=E_g+\frac{\hbar^2\pi^2}{2r^2}\left(\frac1{m_e^*}+\frac1{m_h^*}\right)-\frac{1.8e^2}{4\pi\varepsilon_r\varepsilon_0r}.\]</div>
<p>Con la misma composición, un punto de CdSe pequeño emite azul y uno grande, rojo. Se usan en pantallas QLED, marcadores biológicos y celdas solares. La aproximación de masa efectiva exagera el corrimiento en los puntos más pequeños, por lo que el modelo es cualitativo por debajo de unos 3 nm.</p>
<div class="sim" data-sim="quantum-dot" data-title="Puntos cuánticos de CdSe: tamaño y color"></div>
<div class="sim-guide"><ul>
<li>Barra el radio de 1.5 a 5 nm: la emisión va del violeta al rojo.</li>
<li>Observe los dos términos: el confinamiento (\(\propto1/r^2\)) domina sobre la atracción electrón–hueco (\(\propto1/r\)) en tamaños pequeños.</li>
</ul></div>
<h3>Nanoestructuras de carbono</h3>
<p>El <span class="term">grafeno</span>, una sola lámina de grafito (Geim y Novoselov, Nobel 2010), es el material más rígido conocido (\(E\approx1\) TPa) y conduce electrones como partículas sin masa. Los <span class="term">nanotubos</span> son grafeno enrollado: según el ángulo de enrollado son metálicos o semiconductores. Los <span class="term">fullerenos</span> (C₆₀) son moléculas esféricas. Otros nanomateriales importantes son las nanopartículas de plata (bactericidas), el TiO₂ nanométrico (fotocatálisis y protectores solares) y el nitruro de boro hexagonal, aislante con la misma red que el grafeno.</p>
</section>

<section>
<h2>Técnicas de caracterización</h2>
<p>Toda la ciencia de los materiales descansa en poder ver la estructura. El límite de resolución de un microscopio es del orden de la longitud de onda de la sonda (criterio de Abbe):</p>
<div class="eq key" data-name="Resolución de Abbe">\[d=\frac{0.61\lambda}{\text{AN}},\qquad \lambda_e=\frac{h}{\sqrt{2m_eeV\left(1+\dfrac{eV}{2m_ec^2}\right)}}.\]</div>
<ul>
<li><b>Microscopía óptica</b>: con luz visible y AN = 1.4, unos 0.2 µm. Granos, fases, inclusiones tras pulido y ataque químico.</li>
<li><b>Microscopía electrónica de barrido (SEM)</b>: un haz de 1–30 kV barre la superficie; los electrones secundarios dan topografía con resolución de 1–10 nm, y los rayos X característicos (EDS) la composición local. Superficies de fractura, polvos, recubrimientos.</li>
<li><b>Microscopía electrónica de transmisión (TEM)</b>: electrones de 100–300 kV (\(\lambda\approx2.5\) pm a 200 kV) atraviesan láminas de menos de 100 nm. Dislocaciones, precipitados, columnas atómicas en alta resolución, y difracción de áreas selectas.</li>
<li><b>Microscopías de sonda</b> (STM, AFM): una punta afilada recorre la superficie y mide corriente túnel o fuerza; resolución atómica en superficies.</li>
<li><b>Difracción</b> de rayos X, electrones y neutrones (capítulo 5): estructura cristalina, fases, tamaño de cristalito y esfuerzos residuales.</li>
<li><b>Análisis térmico</b> (DSC, TGA, dilatometría): transiciones de fase, \(T_g\), cristalinidad, cinética.</li>
<li><b>Espectroscopías</b> (XPS, Raman, FTIR): química de superficie, enlaces y estructura molecular.</li>
</ul>
<div class="sim" data-sim="resolution" data-title="Resolución de microscopios ópticos y electrónicos"></div>
<div class="sim-guide"><ul>
<li>A 200 kV la longitud de onda de los electrones es 2.5 pm (cálculo relativista, apéndice de validación). La resolución real del TEM, unos 50–100 pm, la limitan las aberraciones de las lentes, no la longitud de onda.</li>
<li>Compare con la luz visible: un factor de cien mil en longitud de onda.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Qué fracción aproximada de los átomos de una partícula de oro de 5 nm está en la superficie (\(d_a=0.288\) nm)?
<details><summary>Respuesta</summary><p>\(6(0.288)/5=0.35\).</p></details></li>
<li><span class="lvl">Básico</span>Calcule la longitud de onda de electrones acelerados a 10 kV (con corrección relativista).
<details><summary>Respuesta</summary><p>12.2 pm.</p></details></li>
<li><span class="lvl">Intermedio</span>Con la relación de Pawlow simplificada, ¿a qué temperatura funden partículas de oro de 5 y 10 nm?
<details><summary>Respuesta</summary><p>≈ 1100 K y ≈ 1220 K (oro macizo: 1337 K).</p></details></li>
<li><span class="lvl">Intermedio</span>Con la ecuación de Brus, estime la longitud de onda de emisión de un punto de CdSe de 2 nm de radio.
<details><summary>Respuesta</summary><p>\(E\approx2.55\) eV, \(\lambda\approx486\) nm (azul).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que la fracción de átomos en una capa superficial de espesor \(d_a\) en una esfera de diámetro \(d\gg d_a\) es \(f_s\approx6d_a/d\).
<details><summary>Respuesta</summary><p>Volumen de la capa \(\approx\pi d^2d_a\); volumen total \(\pi d^3/6\); cociente \(6d_a/d\).</p></details></li>
</ol>
