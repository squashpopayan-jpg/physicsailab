<p class="lead">Todos los cálculos de las simulaciones salen de una biblioteca única (<code>src/core/30-mat.js</code>). Esa biblioteca se comprueba con un programa automático que la compara con dos tipos de referencia independiente. Este apéndice explica el método y lista cada comprobación con su resultado.</p>

<section>
<h2>Método</h2>
<ol>
<li><b>Referencias numéricas con SciPy</b>: funciones especiales (error, gamma), integrales (Debye, Bloch–Grüneisen), ecuaciones no lineales (campo medio, solución regular, neutralidad de carga en semiconductores) y la integral de Paris se recalculan en Python con SciPy (<code>tests/referencias.py</code>) y se comparan con tolerancias de \(10^{-6}\) a \(10^{-12}\).</li>
<li><b>Datos de la literatura</b>: ejemplos resueltos de Callister y Rethwisch, fichas de difracción ICDD (posiciones e intensidades), normas ASTM, catálogos de vidrios (Schott, Corning) y artículos de referencia (Ehrhart, Matula, Green). La tolerancia refleja la incertidumbre del dato.</li>
<li><b>Coherencia interna</b>: límites conocidos (la ley \(T^3\), una lámina rotada contra la fórmula fuera de eje, Halpin–Tsai en sus extremos).</li>
</ol>
<p>Cuando una prueba falló durante la construcción del curso, se revisó el dato, no la prueba. Así se corrigieron, por ejemplo, la densidad de estados del silicio (el valor antiguo daba \(n_i\) un 40 % bajo), el diagrama Cu–Ni (el modelo ideal se desvía hasta 7 % en peso del experimental, que ahora se usa digitalizado), el radio atómico del titanio, la tabla de difusividades del capítulo 7 y varias respuestas numéricas de problemas.</p>
<div class="box warn"><h4>Lo que es ilustrativo</h4><p>Algunas simulaciones usan modelos cualitativos y así lo dicen en su nota: la curva de transición Charpy, las curvas Jominy, la dureza de revenido, el módulo contra temperatura de los polímeros, los parámetros «blando» y «duro» de histéresis y la cinética de recristalización. Reproducen tendencias de la literatura, no curvas certificadas de un material específico.</p></div>
</section>
