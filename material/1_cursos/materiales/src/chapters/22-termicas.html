<p class="lead">Calentar un sólido es excitar las vibraciones de su red y, en los metales, sus electrones libres. De cómo se almacenan y se transportan esas excitaciones dependen el calor específico, la dilatación, la conductividad térmica y la capacidad de soportar cambios bruscos de temperatura. Este capítulo trata las cuatro propiedades con los modelos de la física del estado sólido.</p>

<section>
<h2>Capacidad calorífica</h2>
<p>La capacidad calorífica molar a volumen constante, \(C_v=(\partial U/\partial T)_v\), mide la energía que absorbe la red por grado. En el siglo XIX, Dulong y Petit observaron que en muchos sólidos vale casi \(3R=24.9\) J/mol·K: es el resultado clásico de la equipartición (cada átomo es un oscilador tridimensional con \(3k_BT\) de energía media). Pero a baja temperatura la capacidad cae a cero, algo que la física clásica no puede explicar.</p>
<p>Einstein (1907) cuantizó los osciladores: todos con la misma frecuencia \(\omega_E\), su energía media es la de Planck, y</p>
<div class="eq">\[\frac{C_v}{3R}=\left(\frac{\Theta_E}T\right)^2\frac{\ee^{\Theta_E/T}}{\left(\ee^{\Theta_E/T}-1\right)^2},\qquad \Theta_E=\frac{\hbar\omega_E}{k_B}.\]</div>
<p>El modelo cae demasiado rápido (exponencialmente) a baja \(T\). Debye (1912) trató la red como un medio elástico con un espectro de frecuencias \(g(\omega)\propto\omega^2\) hasta un corte \(\omega_D\):</p>
<div class="eq key" data-name="Capacidad calorífica de Debye">\[\frac{C_v}{3R}=3\left(\frac{T}{\Theta_D}\right)^3\int_0^{\Theta_D/T}\frac{x^4\ee^x}{(\ee^x-1)^2}\,\dd x\ \xrightarrow{\ T\ll\Theta_D\ }\ \frac{4\pi^4}5\left(\frac{T}{\Theta_D}\right)^3.\]</div>
<p>La ley \(T^3\) se confirma en todos los aislantes cristalinos. En los metales se añade un término electrónico lineal, \(\gamma T\), que domina por debajo de unos pocos kelvin.</p>

<div class="sim-guide"><ul>
<li>Con \(T/\Theta\) en el eje horizontal, todos los sólidos de Debye caen sobre una sola curva universal.</li>
<li>Elija el plomo (\(\Theta_D=105\) K) y el diamante (\(\Theta_D=2230\) K): a temperatura ambiente el plomo ya está en el límite clásico; el diamante, muy lejos.</li>

<section>
<h2>Expansión térmica</h2>
<p>El capítulo 2 mostró que la dilatación nace de la asimetría del pozo de potencial. Macroscópicamente,</p>
<div class="eq key" data-name="Expansión térmica">\[\frac{\Delta l}{l_0}=\alpha_l\,\Delta T,\qquad \frac{\Delta V}{V_0}=\alpha_v\,\Delta T\approx3\alpha_l\,\Delta T.\]</div>
<p>Los coeficientes van de \(0.5\times10^{-6}\) K⁻¹ (sílice fundida) a \(10^{-4}\) K⁻¹ (polímeros). Los cerámicos con enlace fuerte se dilatan poco; los polímeros, con enlaces secundarios entre cadenas, mucho. El Invar (Fe–36 % Ni) tiene \(\alpha\approx1.6\times10^{-6}\) K⁻¹ porque una contracción magnetovolúmica compensa la dilatación: se usa en relojes de péndulo, instrumentos y moldes de compuestos.</p>
<p>Dos láminas de metales distintos soldadas se curvan al calentarse, porque una se dilata más. Timoshenko (1925) calculó la curvatura de la tira bimetálica:</p>
<div class="eq">\[\kappa=\frac{6(\alpha_2-\alpha_1)\Delta T\,(1+m)^2}{h\left[3(1+m)^2+(1+mn)\left(m^2+\dfrac1{mn}\right)\right]},\qquad m=\frac{t_1}{t_2},\ n=\frac{E_1}{E_2},\]</div>
<p>con \(h=t_1+t_2\). Es el principio de termostatos, interruptores térmicos y termómetros de aguja.</p>
<div class="sim" data-sim="bimetal" data-title="Tira bimetálica de Timoshenko"></div>
<div class="sim-guide"><ul>
<li>Con Invar y latón (\(\Delta\alpha\approx17\times10^{-6}\) K⁻¹), una tira de 1 mm de espesor y 50 mm de largo se desvía varios milímetros con 100 °C.</li>
<li>Pruebe distintos cocientes de espesor: la curvatura es casi máxima con capas iguales.</li>
</ul></div>
</section>

<section>
<h2>Conductividad térmica</h2>
<p>El flujo de calor sigue la ley de Fourier, \(q=-k\,\dd T/\dd x\). En los metales lo transportan sobre todo los electrones, los mismos que conducen la corriente; por eso los buenos conductores eléctricos son buenos conductores térmicos, y su cociente es casi universal (ley de Wiedemann–Franz):</p>
<div class="eq key" data-name="Ley de Wiedemann–Franz">\[\frac{k}{\sigma T}=L\approx2.44\times10^{-8}\ \text{W·Ω/K}^2.\]</div>
<p>En los aislantes el calor lo transportan los fonones, \(k=\tfrac13c_vv_s\ell\), con \(\ell\) el recorrido libre medio, limitado por los choques entre fonones (por eso \(k\) baja al subir \(T\)), por defectos, por bordes de grano y por poros. El diamante, con enlaces rígidos y átomos livianos, conduce el calor cinco veces mejor que el cobre; un aislante poroso como la espuma de poliuretano, cien mil veces peor. La <span class="term">difusividad térmica</span>, \(D_T=k/\rho c_p\), controla los transitorios: la rapidez con que una perturbación de temperatura penetra en el material.</p>
<div class="sim" data-sim="heat-conduction" data-title="Calentamiento de una pared: conducción transitoria"></div>
<div class="sim-guide"><ul>
<li>Caliente una cara: en el cobre la temperatura se iguala en segundos; en el vidrio, en minutos; en la espuma, casi nunca.</li>
<li>El tiempo para que el calor cruce un espesor \(L\) escala como \(L^2/D_T\), igual que en la difusión de átomos (capítulo 7).</li>
</ul></div>
</section>

<section>
<h2>Esfuerzos térmicos y choque térmico</h2>
<p>Si una barra se calienta sin poder dilatarse, aparece un esfuerzo \(\sigma=-E\alpha_l\Delta T\) (compresión al calentar, tracción al enfriar). Lo mismo ocurre dentro de una pieza enfriada bruscamente: la superficie se enfría y se contrae primero, y el interior caliente la tracciona. Si el esfuerzo supera la resistencia, un material frágil se agrieta. La diferencia de temperatura que soporta sin fractura es el parámetro de <span class="term">resistencia al choque térmico</span>:</p>
<div class="eq key" data-name="Resistencia al choque térmico">\[\Delta T_c=\frac{\sigma_f(1-\nu)}{E\,\alpha_l},\qquad R'=\frac{\sigma_fk}{E\alpha_l}\ \ \text{(con conducción)}.\]</div>
<p>El vidrio de ventana resiste unos 86 K; el borosilicato (tipo Pyrex), que se dilata casi tres veces menos, unos 260 K; la sílice fundida, más de 2000 K: se puede calentar al rojo y sumergir en agua. Los metales, dúctiles, no se agrietan, pero acumulan fatiga térmica en ciclos repetidos.</p>
<div class="sim" data-sim="thermal-shock" data-title="Choque térmico de cerámicos y vidrios"></div>
<div class="sim-guide"><ul>
<li>Enfríe una pieza de 300 °C a 20 °C: el vidrio común se rompe, el borosilicato no.</li>
<li>Note que la alúmina, muy resistente, tiene un \(\Delta T_c\) bajo (≈ 97 K) por su módulo alto; el nitruro de silicio, con baja dilatación, supera los 500 K.</li>
</ul></div>
<div class="box ex"><h4>Una barra que no puede dilatarse</h4>
<p>Una barra de latón (\(E=97\) GPa, \(\alpha=20\times10^{-6}\) K⁻¹) se fija entre dos soportes rígidos a 20 °C y se calienta a 100 °C. ¿Qué esfuerzo aparece?</p>
<details><summary>Solución</summary><p>\(\sigma=-E\alpha\Delta T=-(97\times10^9)(20\times10^{-6})(80)=-155\) MPa (compresión). Si el límite elástico es menor, la barra fluye; al volver a 20 °C quedará en tracción.</p></details>
</div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Cuánto se alarga un riel de aluminio de 1 m al calentarse 50 °C (\(\alpha=23.6\times10^{-6}\) K⁻¹)?
<details><summary>Respuesta</summary><p>1.18 mm.</p></details></li>
<li><span class="lvl">Básico</span>Con Wiedemann–Franz, estime \(k\) del aluminio a 293 K (\(\sigma=3.8\times10^7\) S/m).
<details><summary>Respuesta</summary><p>\(k=2.44\times10^{-8}(3.8\times10^7)(293)=272\) W/m·K (medido: 237).</p></details></li>
<li><span class="lvl">Intermedio</span>Con Debye, ¿cuánto vale \(C_v\) del cobre a 10 K? Compare con \(3R\).
<details><summary>Respuesta</summary><p>\(C_v=\tfrac{12\pi^4}{5}R(10/343)^3=0.048\) J/mol·K, unas 500 veces menos que \(3R\).</p></details></li>
<li><span class="lvl">Intermedio</span>Calcule \(\Delta T_c\) para el Si₃N₄ (\(\sigma_f=700\) MPa, \(E=300\) GPa, \(\alpha=3.3\times10^{-6}\) K⁻¹, \(\nu=0.27\)).
<details><summary>Respuesta</summary><p>\(700\times10^6(0.73)/(300\times10^9\cdot3.3\times10^{-6})=516\) K.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que en el límite \(T\gg\Theta_D\) la fórmula de Debye tiende a \(3R\).
<details><summary>Respuesta</summary><p>Para \(x\ll1\), \(x^4\ee^x/(\ee^x-1)^2\approx x^2\). La integral hasta \(x_D=\Theta_D/T\) vale \(x_D^3/3\), y \(3(T/\Theta_D)^3x_D^3/3=1\): \(C_v=3R\).</p></details></li>
</ol>
