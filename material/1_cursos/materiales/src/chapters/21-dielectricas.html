<p class="lead">Un aislante no es un material pasivo: en un campo eléctrico sus cargas se desplazan ligeramente y el material se polariza. De esa respuesta dependen los condensadores, el aislamiento de cables y transformadores, las memorias ferroeléctricas, los sensores de presión y los transductores de ultrasonido. Este capítulo relaciona la polarización macroscópica con los dipolos atómicos.</p>

<section>
<h2>Capacitancia y polarización</h2>
<p>Un condensador de placas paralelas de área \(A\) y separación \(l\) tiene capacitancia \(C_0=\varepsilon_0A/l\) en el vacío. Si se llena con un dieléctrico, la capacitancia crece en un factor \(\varepsilon_r\), la <span class="term">constante dieléctrica</span> (permitividad relativa):</p>
<div class="eq key" data-name="Capacitancia con dieléctrico">\[C=\varepsilon_r\varepsilon_0\frac Al,\qquad \vb D=\varepsilon_0\vb{\mathcal E}+\vb P=\varepsilon_r\varepsilon_0\vb{\mathcal E},\qquad \vb P=\varepsilon_0(\varepsilon_r-1)\vb{\mathcal E}.\]</div>
<p>\(\vb P\), la polarización, es el momento dipolar por unidad de volumen. Microscópicamente, el campo induce o alinea dipolos que generan cargas ligadas en las superficies del dieléctrico; esas cargas atraen más carga libre a las placas para el mismo voltaje.</p>
<div class="sim" data-sim="capacitor" data-title="Condensador de placas con dieléctrico"></div>
<div class="sim-guide"><ul>
<li>Con \(A=6.45\) cm², \(l=2\) mm y 10 V: en vacío la carga es \(2.9\times10^{-11}\) C; con un dieléctrico de \(\varepsilon_r=6\), seis veces más.</li>
<li>Suba el voltaje hasta la rigidez dieléctrica del material: allí se produce la ruptura.</li>
</ul></div>
</section>

<section>
<h2>Mecanismos de polarización y frecuencia</h2>
<ul>
<li><b>Electrónica</b>: la nube electrónica se desplaza respecto al núcleo. Ocurre en todos los materiales y responde hasta frecuencias ópticas (\(\sim10^{15}\) Hz). Es la única presente en los gases nobles y en el diamante, y determina el índice de refracción: \(n^2=\varepsilon_{r,\infty}\) (capítulo 24).</li>
<li><b>Iónica</b>: los cationes y aniones se desplazan en sentidos opuestos. Responde hasta el infrarrojo (\(\sim10^{13}\) Hz).</li>
<li><b>De orientación</b>: moléculas con dipolo permanente (agua, PVC, grupos polares) giran hacia el campo, contra la agitación térmica. Es la más lenta (hasta \(10^{6}\)–\(10^{11}\) Hz) y disminuye al subir la temperatura.</li>
<li><b>De carga espacial</b>: acumulación de portadores en interfaces; solo a muy baja frecuencia.</li>
</ul>
<p>Cada mecanismo deja de seguir al campo por encima de su frecuencia característica, y la constante dieléctrica cae en escalones. Cerca de cada caída, la componente imaginaria \(\varepsilon_r''\) presenta un máximo: el material absorbe energía y se calienta (así funciona el horno de microondas con el agua). Para la orientación, el modelo de relajación de Debye da</p>
<div class="eq">\[\varepsilon_r(\omega)=\varepsilon_\infty+\frac{\varepsilon_s-\varepsilon_\infty}{1+\ii\omega\tau}\quad\Rightarrow\quad \varepsilon_r'=\varepsilon_\infty+\frac{\varepsilon_s-\varepsilon_\infty}{1+\omega^2\tau^2},\quad \varepsilon_r''=\frac{(\varepsilon_s-\varepsilon_\infty)\omega\tau}{1+\omega^2\tau^2},\]</div>
<p>y las polarizaciones iónica y electrónica, que tienen inercia, siguen osciladores de Lorentz con resonancias. La pérdida dieléctrica se caracteriza con \(\tan\delta=\varepsilon_r''/\varepsilon_r'\): los cables de alta frecuencia usan polietileno o PTFE, que no tienen dipolos permanentes.</p>
<div class="sim" data-sim="dielectric-dispersion" data-title="Constante dieléctrica contra frecuencia"></div>
<div class="sim-guide"><ul>
<li>Recorra el espectro: los tres escalones de \(\varepsilon_r'\) coinciden con los picos de \(\varepsilon_r''\).</li>
<li>Aumente el tiempo de relajación de orientación (líquido más viscoso o más frío): la caída se corre a frecuencias menores.</li>
</ul></div>
<p>En un sólido no polar, la relación entre la polarizabilidad atómica \(\alpha\) y la constante dieléctrica la da la ecuación de Clausius–Mossotti, que incluye el campo local creado por los dipolos vecinos:</p>
<div class="eq key" data-name="Relación de Clausius–Mossotti">\[\frac{\varepsilon_r-1}{\varepsilon_r+2}=\frac{N\alpha}{3\varepsilon_0}.\]</div>
<p>Cuando \(N\alpha/3\varepsilon_0\to1\), \(\varepsilon_r\) diverge: es la «catástrofe de polarización» que anuncia la ferroelectricidad.</p>

<section>
<h2>Ferroelectricidad</h2>
<p>Algunos cristales tienen polarización espontánea, sin campo aplicado, que puede invertirse con un campo suficiente: son <span class="term">ferroeléctricos</span> (el nombre es por analogía con el ferromagnetismo; no tienen hierro). El ejemplo clásico es el titanato de bario, BaTiO₃, con estructura de perovskita. Por encima de su temperatura de Curie, 120 °C, es cúbico y el Ti⁴⁺ está en el centro del octaedro de oxígenos. Por debajo, la celda se vuelve tetragonal y el Ti⁴⁺ se desplaza unos 0.006 nm del centro: cada celda es un dipolo, y las celdas vecinas se alinean en dominios.</p>
<p>La teoría de Landau describe la transición expandiendo la energía libre en potencias de la polarización:</p>
<div class="eq key" data-name="Energía libre de Landau">\[G(P)=\tfrac12a_0(T-T_c)P^2+\tfrac14bP^4-\mathcal EP.\]</div>
<p>Sobre \(T_c\) el mínimo está en \(P=0\) y la susceptibilidad sigue la ley de Curie–Weiss, \(\varepsilon_r\approx C/(T-T_c)\). Bajo \(T_c\) aparecen dos mínimos simétricos en \(\pm P_s\), con \(P_s=\sqrt{a_0(T_c-T)/b}\): la polarización espontánea. Un campo inclina el doble pozo y, por encima del campo coercitivo, uno de los mínimos desaparece y la polarización se invierte. Así nace el ciclo de histéresis \(P\)–\(\mathcal E\), base de las memorias FeRAM.</p>
<div class="sim" data-sim="ferroelectric" data-title="Teoría de Landau de un ferroeléctrico y ciclo de histéresis"></div>
<div class="sim-guide"><ul>
<li>Por encima de \(T_c\) la energía tiene un solo pozo y no hay histéresis.</li>
<li>Por debajo, barra el campo de un lado a otro: la polarización salta al anularse la barrera. El campo coercitivo de Landau es \(\mathcal E_c=\tfrac{2}{3\sqrt3}\,a_0(T_c-T)P_s\); en los cristales reales es mucho menor porque la inversión ocurre por movimiento de paredes de dominio.</li>
</ul></div>
</section>

<section>
<h2>Piezoelectricidad</h2>
<p>En los cristales sin centro de simetría, una deformación mecánica desplaza las cargas y produce polarización (efecto directo), y un campo eléctrico produce deformación (efecto inverso). En una dirección dada,</p>
<div class="eq key" data-name="Relaciones piezoeléctricas">\[D=d\,\sigma\quad(\text{directo}),\qquad \varepsilon=d\,\mathcal E\quad(\text{inverso}),\]</div>
<p>con el mismo coeficiente \(d\) (C/N = m/V). El cuarzo tiene \(d_{11}=2.3\) pC/N; el titanato de bario, unos 190 pC/N; las cerámicas de PZT (titanato-circonato de plomo), entre 300 y 600 pC/N. Todo ferroeléctrico es piezoeléctrico, pero no al revés (el cuarzo es piezoeléctrico y no ferroeléctrico). Las cerámicas policristalinas deben <span class="term">polarizarse</span> con un campo intenso cerca de \(T_c\) para alinear sus dominios. Aplicaciones: encendedores y sensores de presión (efecto directo), actuadores de precisión, inyectores, transductores de ultrasonido médico, sonares y relojes de cuarzo (ambos efectos en resonancia).</p>
<div class="sim" data-sim="piezo" data-title="Encendedor y actuador piezoeléctricos"></div>
<div class="sim-guide"><ul>
<li>Un disco de PZT de 5 mm de diámetro y 5 mm de espesor bajo 1000 N genera unos 6 kV: suficiente para una chispa.</li>
<li>Efecto inverso: 1000 V sobre el mismo disco lo alargan apenas 0.4 µm. Por eso los actuadores de gran carrera apilan cientos de capas.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un condensador de placas de 6.45 cm² separadas 2 mm se llena con un material de \(\varepsilon_r=6\). Calcule \(C\) y la carga a 10 V.
<details><summary>Respuesta</summary><p>\(C=6(8.85\times10^{-12})(6.45\times10^{-4})/0.002=1.71\times10^{-11}\) F; \(Q=1.71\times10^{-10}\) C.</p></details></li>
<li><span class="lvl">Básico</span>Calcule la polarización del dieléctrico anterior.
<details><summary>Respuesta</summary><p>\(\mathcal E=5000\) V/m; \(P=\varepsilon_0(5)(5000)=2.2\times10^{-7}\) C/m².</p></details></li>
<li><span class="lvl">Intermedio</span>Con Clausius–Mossotti, ¿qué valor de \(N\alpha/3\varepsilon_0\) da \(\varepsilon_r=10\)? ¿Y \(\varepsilon_r=100\)?
<details><summary>Respuesta</summary><p>\((\varepsilon_r-1)/(\varepsilon_r+2)\): 0.75 y 0.97. Pequeños aumentos de polarizabilidad cerca de 1 producen constantes enormes.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Qué carga y qué voltaje produce un cristal de cuarzo (\(d=2.3\) pC/N, \(\varepsilon_r=4.5\)) de 5 mm de diámetro y 5 mm de espesor bajo 1000 N?
<details><summary>Respuesta</summary><p>\(Q=2.3\) nC; \(C=1.56\times10^{-13}\) F; \(V=Q/C=14.7\) kV (en circuito abierto).</p></details></li>
<li><span class="lvl">Avanzado</span>Minimice \(G(P)\) sin campo y obtenga \(P_s(T)\). Calcule \(1/\chi=\partial^2G/\partial P^2\) en ambos lados de \(T_c\) y muestre que la pendiente de \(1/\chi\) contra \(T\) es dos veces mayor por debajo.
<details><summary>Respuesta</summary><p>\(\partial G/\partial P=a_0(T-T_c)P+bP^3=0\Rightarrow P_s^2=a_0(T_c-T)/b\). Sobre \(T_c\): \(G''=a_0(T-T_c)\). Bajo \(T_c\): \(G''=a_0(T-T_c)+3bP_s^2=2a_0(T_c-T)\): pendiente \(-2a_0\), el doble en valor absoluto.</p></details></li>
</ol>
