<p class="lead">Un diagrama de fase es un mapa: para cada composición y temperatura dice qué fases son estables, de qué composición y en qué proporción. Es la herramienta con la que se diseñan las aleaciones, los tratamientos térmicos, las soldaduras y los cerámicos refractarios. Este capítulo deduce su forma de la termodinámica y enseña a leerlo cuantitativamente.</p>

<section>
<h2>Fases, componentes y equilibrio</h2>
<p>Los <span class="term">componentes</span> son las sustancias químicas independientes del sistema (Cu y Ni; Fe y C; H₂O y NaCl). Una <span class="term">fase</span> es una porción homogénea del sistema, con propiedades físicas y químicas uniformes, separada de las demás por interfaces. El agua con hielo es un sistema de un componente y dos fases; un latón α+β tiene dos componentes y dos fases sólidas. La <span class="term">solubilidad límite</span> es la máxima concentración de soluto que admite una fase a una temperatura dada; si se excede, aparece otra fase.</p>
<p>Un sistema está en <span class="term">equilibrio</span> cuando su energía libre de Gibbs, \(G=H-TS\), es mínima a temperatura y presión constantes. En la práctica, muchos estados que observamos son <span class="term">metaestables</span>: el equilibrio es el destino, pero la cinética (capítulo 14) puede tardar años o nunca llegar. Los diagramas de fase describen el equilibrio y no dicen nada sobre el tiempo.</p>
</section>

<section>
<h2>Por qué hay diagramas: la energía libre de mezcla</h2>
<p>Al mezclar \(x\) moles de B con \(1-x\) de A, la entropía configuracional siempre favorece la mezcla, y la entalpía puede favorecerla o no según cómo se atraigan los átomos distintos. El modelo de <span class="term">solución regular</span> resume esto con un parámetro de interacción \(\Omega\):</p>
<div class="eq key" data-name="Energía libre de una solución regular">\[\Delta G_{\text{mez}}=\Omega\,x(1-x)+RT\left[x\ln x+(1-x)\ln(1-x)\right].\]</div>
<p>Si \(\Omega\le0\), la curva es convexa a cualquier temperatura: los componentes se mezclan en todas las proporciones. Si \(\Omega&gt;0\) (los átomos A y B «se repelen»), por debajo de \(T_c=\Omega/2R\) la curva desarrolla dos mínimos. Una aleación con composición intermedia baja su energía separándose en dos fases cuyas composiciones se obtienen con la <span class="term">tangente común</span>: es una laguna de miscibilidad. Dentro de ella, la región donde la curvatura es negativa (\(\partial^2G/\partial x^2&lt;0\)) es la <span class="term">espinodal</span>: allí cualquier fluctuación de composición crece espontáneamente.</p>
<div class="sim" data-sim="regular-solution" data-title="Energía libre de mezcla, tangente común y laguna de miscibilidad"></div>
<div class="sim-guide"><ul>
<li>Con \(\Omega=20\) kJ/mol, \(T_c=1203\) K. Baje la temperatura por debajo de \(T_c\) y observe cómo nacen los dos mínimos y la tangente común.</li>
<li>Una aleación entre los puntos de tangencia se separa en dos fases; la regla de la palanca (más abajo) da sus proporciones.</li>
<li>Cambie el signo de \(\Omega\): con atracción entre átomos distintos no hay laguna; en la realidad, esa tendencia lleva al orden químico y a compuestos intermetálicos.</li>
</ul></div>
<p>Cuando hay más de una fase posible (líquido y sólido, dos sólidos de distinta estructura), cada una tiene su curva \(G(x)\), y las tangentes comunes entre ellas trazan las fronteras del diagrama. Así se construye, por ejemplo, el diagrama isomorfo ideal a partir de las temperaturas y entalpías de fusión de los dos componentes.</p>
</section>

<section>
<h2>La regla de las fases de Gibbs</h2>
<p>El número de variables intensivas que pueden cambiarse independientemente sin alterar el número de fases en equilibrio (los <span class="term">grados de libertad</span> \(F\)) es</p>
<div class="eq key" data-name="Regla de las fases">\[P+F=C+N,\]</div>
<p>con \(P\) el número de fases, \(C\) el de componentes y \(N\) el de variables no composicionales (temperatura y presión, \(N=2\); a presión fija, \(N=1\)). En un binario a presión atmosférica, \(F=3-P\): en una región monofásica se pueden variar la temperatura y la composición (\(F=2\)); en una bifásica, solo una de ellas, porque las composiciones de las fases quedan fijas en los extremos de la línea de reparto (\(F=1\)); y tres fases solo coexisten en puntos invariantes (\(F=0\)), como el eutéctico.</p>
</section>

<section>
<h2>Sistemas isomorfos y la regla de la palanca</h2>
<p>El cobre y el níquel cumplen las cuatro reglas de Hume-Rothery y son solubles en todas las proporciones, tanto en el líquido como en el sólido. Su diagrama tiene tres regiones: el líquido L arriba, la solución sólida FCC α abajo y una lente α+L entre la curva <span class="term">liquidus</span> y la <span class="term">solidus</span>.</p>
<p>Para un punto \((C_0,T)\) dentro de la región bifásica:</p>
<ol>
<li><b>Composiciones</b>: se traza la <span class="term">línea de reparto</span> (isoterma) a través del punto; sus cortes con el liquidus y el solidus dan \(C_L\) y \(C_\alpha\).</li>
<li><b>Proporciones</b>: la conservación de la masa, \(C_0=W_LC_L+W_\alpha C_\alpha\) con \(W_L+W_\alpha=1\), da la <span class="term">regla de la palanca</span>:</li>
</ol>
<div class="eq key" data-name="Regla de la palanca">\[W_L=\frac{C_\alpha-C_0}{C_\alpha-C_L},\qquad W_\alpha=\frac{C_0-C_L}{C_\alpha-C_L}.\]</div>
<p>Cada fase «pesa» en proporción al brazo opuesto de la palanca. Si las composiciones están en % en peso, las fracciones son másicas; para fracciones en volumen hay que dividir por las densidades.</p>
<div class="sim" data-sim="cuni-lever" data-title="Diagrama Cu–Ni con línea de reparto y regla de la palanca"></div>
<div class="sim-guide"><ul>
<li>Coloque el punto en 35 % Ni y 1250 °C: \(C_L=31.5\), \(C_\alpha=42.5\), \(W_L=0.68\) (Callister, ej. 9.2).</li>
<li>Enfríe la aleación de 35 % Ni lentamente: el primer sólido tiene unos 46 % Ni; al bajar la temperatura, el sólido y el líquido se empobrecen en níquel hasta que el último líquido, a 1220 °C, tiene unos 25 % Ni.</li>
<li>Superponga el modelo de solución ideal: reproduce la forma, pero se desvía hasta 7 % en peso; el Cu–Ni real no es ideal.</li>
</ul></div>
<p>En un enfriamiento real la difusión en el sólido no alcanza a homogeneizar los granos: el centro de cada dendrita queda rico en el componente de mayor punto de fusión y el borde, pobre. Esta <span class="term">segregación</span> o «coring» baja la temperatura a la que funde la aleación al recalentarla y se elimina con un recocido de homogeneización.</p>
</section>

<section>
<h2>Sistemas eutécticos</h2>
<p>Cuando la solubilidad en el sólido es limitada, el diagrama tiene dos soluciones sólidas terminales (α, rica en A; β, rica en B), un campo α+β y un punto especial, el <span class="term">eutéctico</span> \((C_E,T_E)\), donde el líquido se transforma, a temperatura constante, en dos sólidos:</p>
<div class="eq">\[L(C_E)\ \xrightarrow{\ \text{enfriamiento}\ }\ \alpha(C_{\alpha E})+\beta(C_{\beta E}).\]</div>
<p>En el sistema Pb–Sn (las soldaduras clásicas), \(T_E=183\) °C, \(C_E=61.9\) % Sn, \(C_{\alpha E}=18.3\) % y \(C_{\beta E}=97.8\) %. La aleación eutéctica funde a la temperatura más baja del sistema, mucho menos que cualquiera de sus componentes (327 y 232 °C).</p>
<h3>Microestructuras</h3>
<p>El camino de enfriamiento decide la microestructura:</p>
<ul>
<li><b>Fuera del campo α+β</b> (por ejemplo, 2 % Sn): solo granos de α.</li>
<li><b>Entre el solvus y la composición eutéctica</b>, pero sin cruzar la isoterma (por ejemplo, 15 % Sn): α primaria que, al cruzar el solvus, precipita partículas de β.</li>
<li><b>Composición eutéctica</b> (61.9 % Sn): a 183 °C todo el líquido se transforma en la <span class="term">estructura eutéctica</span>, láminas alternadas de α y β; la redistribución por difusión a corta distancia en el frente de solidificación explica la forma laminar.</li>
<li><b>Hipoeutéctica o hipereutéctica</b> (por ejemplo, 40 % Sn): primero crece α <span class="term">primaria</span> (o proeutéctica); al llegar a 183 °C el líquido restante tiene exactamente 61.9 % Sn y se convierte en eutéctico. La palanca justo bajo la isoterma da las fracciones de microconstituyentes:</li>
</ul>
<div class="eq">\[W_{\alpha'}=\frac{C_E-C_0}{C_E-C_{\alpha E}},\qquad W_e=\frac{C_0-C_{\alpha E}}{C_E-C_{\alpha E}},\]</div>
<p>mientras que las fracciones de las fases α y β totales se obtienen con la palanca entre \(C_{\alpha E}\) y \(C_{\beta E}\).</p>
<div class="sim" data-sim="pbsn-eutectic" data-title="Diagrama Pb–Sn, regla de la palanca y microestructura"></div>
<div class="sim-guide"><ul>
<li>Con 40 % Sn a 150 °C: \(W_\alpha=0.66\), \(W_\beta=0.34\) (Callister, ej. 9.2, da 0.67 y 0.33 con su lectura del diagrama).</li>
<li>Justo bajo 183 °C, la misma aleación tiene 50 % de α primaria y 50 % de eutéctico (Callister, ej. 9.3).</li>
<li>Recorra la composición a 182 °C: la fracción de eutéctico es 100 % en 61.9 % Sn y cae linealmente hacia 18.3 y 97.8 %.</li>
</ul></div>
</section>

<section>
<h2>Otras reacciones e intermetálicos</h2>
<p>Además del eutéctico hay otras reacciones invariantes, con tres fases en equilibrio a temperatura fija:</p>
<div class="tablewrap"><table>
<tr><th>Reacción</th><th class="c">Al enfriar</th><th>Ejemplo</th></tr>
<tr><td>Eutéctica</td><td class="c">\(L\to\alpha+\beta\)</td><td>Pb–Sn a 183 °C; Fe–C a 1147 °C</td></tr>
<tr><td>Eutectoide</td><td class="c">\(\gamma\to\alpha+\beta\)</td><td>Fe–C a 727 °C (perlita)</td></tr>
<tr><td>Peritéctica</td><td class="c">\(L+\delta\to\gamma\)</td><td>Fe–C a 1493 °C; Cu–Zn</td></tr>
<tr><td>Peritectoide</td><td class="c">\(\alpha+\beta\to\gamma\)</td><td>Ni–Mo</td></tr>
<tr><td>Monotéctica</td><td class="c">\(L_1\to\alpha+L_2\)</td><td>Cu–Pb</td></tr>
</table></div>
<p>Los <span class="term">compuestos intermetálicos</span> tienen fórmula química definida (Mg₂Pb, CuAl₂, Fe₃C, Ni₃Al) y aparecen como líneas verticales o campos angostos. Una transformación es <span class="term">congruente</span> si no cambia la composición (la fusión de un metal puro o de un compuesto como Mg₂Pb) e incongruente si la cambia (la fusión peritéctica). En los cerámicos se usan los mismos diagramas, por ejemplo Al₂O₃–Cr₂O₃ (isomorfo, el rubí) o SiO₂–Al₂O₃ (refractarios y mullita). Los sistemas de tres componentes requieren diagramas ternarios, representados con secciones isotérmicas en un triángulo.</p>
</section>

<section>
<h2>Análisis térmico: leer el diagrama en una curva de enfriamiento</h2>
<p>Los diagramas se determinan experimentalmente registrando la temperatura de muestras que se enfrían. Mientras no hay transformación, la temperatura cae suavemente (enfriamiento newtoniano); cuando se forma sólido, el calor latente frena la caída. Un metal puro o una aleación eutéctica muestra una meseta (\(F=0\)); una aleación que solidifica en un intervalo, un cambio de pendiente en el liquidus y otro en el solidus (\(F=1\)).</p>
<div class="sim" data-sim="cooling-curve" data-title="Curvas de enfriamiento de aleaciones Pb–Sn"></div>
<div class="sim-guide"><ul>
<li>Pb puro y 61.9 % Sn: mesetas a 327 y 183 °C.</li>
<li>40 % Sn: cambio de pendiente al cruzar el liquidus (unos 233 °C) y meseta eutéctica a 183 °C, cuya duración es proporcional a la fracción de eutéctico.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Cuántos grados de libertad hay en un binario a presión fija en un punto de la región α+L? ¿Y en el punto eutéctico?
<details><summary>Respuesta</summary><p>\(F=C-P+1=2-2+1=1\) y \(2-3+1=0\).</p></details></li>
<li><span class="lvl">Básico</span>Una aleación Cu–Ni de 35 % Ni está a 1250 °C. Con \(C_L=31.5\) y \(C_\alpha=42.5\) % Ni, calcule las fracciones de fase.
<details><summary>Respuesta</summary><p>\(W_L=(42.5-35)/(42.5-31.5)=0.68\); \(W_\alpha=0.32\).</p></details></li>
<li><span class="lvl">Intermedio</span>Para Pb–Sn de 50 % Sn a 200 °C, lea \(C_\alpha\) y \(C_L\) en la simulación y calcule las fracciones.
<details><summary>Respuesta</summary><p>Con el diagrama del curso: \(C_\alpha\approx16\) %, \(C_L\approx55\) %; \(W_\alpha\approx0.12\), \(W_L\approx0.88\).</p></details></li>
<li><span class="lvl">Intermedio</span>¿Qué composición Pb–Sn tiene, justo bajo 183 °C, 25 % de α primaria?
<details><summary>Respuesta</summary><p>\(0.25=(61.9-C_0)/(61.9-18.3)\Rightarrow C_0=51.0\) % Sn.</p></details></li>
<li><span class="lvl">Intermedio</span>Para una solución regular con \(\Omega=20\) kJ/mol, ¿por debajo de qué temperatura aparece la laguna? ¿Cuáles son los límites de la espinodal a 900 K?
<details><summary>Respuesta</summary><p>\(T_c=\Omega/2R=1203\) K. Espinodal: \(x=\tfrac12\left(1\pm\sqrt{1-2RT/\Omega}\right)=0.25\) y \(0.75\).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre la regla de la palanca a partir de la conservación de la masa de B.
<details><summary>Respuesta</summary><p>Masa total de B: \(C_0=W_LC_L+W_\alpha C_\alpha\) y \(W_L+W_\alpha=1\). Sustituyendo \(W_\alpha=1-W_L\): \(C_0=W_LC_L+(1-W_L)C_\alpha\Rightarrow W_L=(C_\alpha-C_0)/(C_\alpha-C_L)\).</p></details></li>
</ol>
