<p class="lead">La conductividad eléctrica de los materiales cubre 27 órdenes de magnitud, más que cualquier otra propiedad física: del cobre (\(6\times10^7\) S/m) al poliestireno (\(10^{-14}\) S/m). Esa enorme variedad se explica con una sola idea, las bandas de energía de los electrones en un sólido, y su control preciso en los semiconductores sostiene toda la electrónica.</p>

<section>
<h2>Ley de Ohm y conductividad</h2>
<p>Para un conductor de longitud \(l\) y sección \(A\), \(V=IR\) con \(R=\rho l/A\). La resistividad \(\rho\) (Ω·m) y su inverso, la conductividad \(\sigma=1/\rho\) (S/m), son propiedades del material. En forma local, \(\vb J=\sigma\vb{\mathcal E}\). La conductividad es el producto de tres factores: cuántos portadores hay, cuánta carga llevan y con qué facilidad se mueven,</p>
<div class="eq key" data-name="Conductividad y movilidad">\[\sigma=n\,\abs q\,\mu,\qquad \vb v_d=\mu\,\vb{\mathcal E},\]</div>
<p>donde \(\mu\) es la <span class="term">movilidad</span> (m²/V·s), la velocidad de deriva por unidad de campo. Si hay electrones y huecos, \(\sigma=ne\mu_e+pe\mu_h\).</p>

<section>
<h2>Bandas de energía</h2>
<p>En un átomo aislado los electrones ocupan niveles discretos. Cuando \(N\) átomos se acercan para formar un sólido, cada nivel se desdobla en \(N\) niveles muy próximos: una <span class="term">banda</span>. Entre las bandas pueden quedar intervalos prohibidos, las brechas o <em>gaps</em>. A 0 K los electrones llenan los estados de menor energía hasta la <span class="term">energía de Fermi</span> \(E_F\). La conducción exige que los electrones puedan ganar un poco de energía del campo, es decir, que haya estados vacíos justo encima de los ocupados:</p>
<ul>
<li><b>Metales</b>: la última banda ocupada está parcialmente llena (o se superpone con una vacía). Hay estados libres inmediatamente sobre \(E_F\).</li>
<li><b>Aislantes</b>: la banda de valencia está llena y la de conducción vacía, separadas por una brecha grande (\(E_g&gt;\) 3–4 eV: 9 eV en la sílice, 5.5 eV en el diamante).</li>
<li><b>Semiconductores</b>: igual que los aislantes pero con brecha pequeña (1.12 eV en Si, 0.66 en Ge, 1.42 en GaAs). A temperatura ambiente algunos electrones saltan a la banda de conducción y dejan <span class="term">huecos</span> en la de valencia.</li>
</ul>
<p>La ocupación de un estado de energía \(E\) en equilibrio la da la distribución de Fermi–Dirac:</p>
<div class="eq key" data-name="Distribución de Fermi–Dirac">\[f(E)=\frac1{1+\exp\left[(E-E_F)/k_BT\right]}.\]</div>
<p>A temperatura ambiente \(k_BT=25.9\) meV: la «cola» de la distribución se extiende unas décimas de eV. Un estado 0.56 eV sobre \(E_F\) (el fondo de la banda de conducción del silicio puro) está ocupado con probabilidad \(4\times10^{-10}\); multiplicada por los \(\sim10^{25}\) estados efectivos por m³, da los \(10^{16}\) electrones por m³ del silicio intrínseco.</p>
<div class="sim" data-sim="band-filling" data-title="Bandas, nivel de Fermi y ocupación térmica"></div>
<div class="sim-guide"><ul>
<li>En el metal, suba la temperatura: solo se redistribuyen los electrones a unas \(k_BT\) de \(E_F\). La mayoría no participa: por eso el calor específico electrónico es tan pequeño.</li>
<li>En el semiconductor, la ocupación de la banda de conducción crece exponencialmente con \(T\). Reduzca la brecha de 1.12 a 0.66 eV (Si → Ge): los portadores aumentan unas mil veces.</li>
</ul></div>
</section>

<section>
<h2>Conducción en metales</h2>
<p>El modelo de Drude (1900) trata a los electrones de conducción como un gas que se acelera con el campo y choca con una frecuencia \(1/\tau\). En estado estacionario,</p>
<div class="eq">\[\sigma=\frac{ne^2\tau}{m_e},\qquad \mu=\frac{e\tau}{m_e}.\]</div>
<p>Para el cobre (\(n=8.47\times10^{28}\) m⁻³), \(\tau\approx2.5\times10^{-14}\) s. La mecánica cuántica corrige la interpretación: un cristal perfecto no dispersa a los electrones; lo hacen las vibraciones térmicas (fonones), las impurezas y los defectos. Como son mecanismos independientes, sus resistividades se suman (regla de Matthiessen):</p>
<div class="eq key" data-name="Regla de Matthiessen">\[\rho=\rho_t+\rho_i+\rho_d.\]</div>
<ul>
<li>\(\rho_t\), térmica, crece casi linealmente con \(T\) por encima de unos \(\Theta_D/3\) y como \(T^5\) a muy baja temperatura (ley de Bloch–Grüneisen).</li>
<li>\(\rho_i\), por impurezas, es independiente de \(T\) y, para una solución sólida, sigue aproximadamente la regla de Nordheim \(\rho_i=Ax(1-x)\). Por eso las aleaciones conducen peor que los metales puros: el constantán (Cu–Ni) tiene una resistividad casi constante con la temperatura, ideal para resistencias de precisión.</li>
<li>\(\rho_d\), por deformación (dislocaciones), es pequeña y también independiente de \(T\).</li>
</ul>
<div class="sim" data-sim="matthiessen" data-title="Resistividad del cobre: temperatura, impurezas y deformación"></div>
<div class="sim-guide"><ul>
<li>Con cobre puro, \(\rho\) a 80 K es solo el 12 % de la de temperatura ambiente (Bloch–Grüneisen, validado contra Matula, 1979).</li>
<li>Agregue níquel: la curva entera se desplaza hacia arriba la misma cantidad, como predice Matthiessen. A 4 K, la resistividad residual mide la pureza (el «RRR» de los cobres para criogenia).</li>
</ul></div>
</section>

<section>
<h2>Semiconductores intrínsecos</h2>
<p>En un semiconductor puro, cada electrón excitado a la banda de conducción deja un hueco: \(n=p=n_i\). Con las densidades efectivas de estados \(N_c\) y \(N_v\) (que crecen como \(T^{3/2}\)),</p>
<div class="eq key" data-name="Concentración intrínseca">\[n_i=\sqrt{N_cN_v}\,\exp\left(-\frac{E_g}{2k_BT}\right),\qquad np=n_i^2.\]</div>
<p>La segunda igualdad, la <span class="term">ley de acción de masas</span>, vale también con dopantes. Para el silicio a 300 K, \(n_i\approx1.0\times10^{16}\) m⁻³ (\(1.0\times10^{10}\) cm⁻³), y la brecha disminuye con la temperatura según la relación de Varshni, \(E_g(T)=E_g(0)-\alpha T^2/(T+\beta)\). La conductividad intrínseca es \(\sigma=n_ie(\mu_e+\mu_h)\approx3\times10^{-4}\) S/m: el silicio puro es casi un aislante.</p>
</section>

<section>
<h2>Semiconductores extrínsecos</h2>
<p>Un átomo de fósforo (valencia 5) en la red del silicio usa cuatro electrones en los enlaces; el quinto queda débilmente ligado (unos 45 meV bajo la banda de conducción) y se libera a temperatura ambiente: el fósforo es un <span class="term">donador</span> y el material es tipo n. El boro (valencia 3) acepta un electrón de la banda de valencia (a 45 meV) y deja un hueco: es un <span class="term">aceptor</span> y el material es tipo p. Con una concentración de donadores \(N_d\gg n_i\), en el intervalo de temperaturas de uso \(n\approx N_d\) y \(p=n_i^2/N_d\).</p>
<p>La concentración de electrones contra la temperatura muestra tres regiones: <span class="term">congelamiento</span> a baja \(T\) (los donadores no están ionizados), <span class="term">extrínseca</span> o de saturación (\(n\approx N_d\), constante: el intervalo útil) e <span class="term">intrínseca</span> a alta \(T\) (\(n_i\) supera a \(N_d\)). Las tres salen de resolver numéricamente la neutralidad de carga, \(p+N_d^+=n+N_a^-\).</p>
<div class="sim" data-sim="si-carriers" data-title="Electrones en silicio dopado contra la temperatura"></div>
<div class="sim-guide"><ul>
<li>Con \(N_d=10^{21}\) m⁻³, la región extrínseca va de unos 100 K a 450 K. Aumente el dopado: la meseta sube y se extiende a temperaturas más altas.</li>
<li>Observe el nivel de Fermi: cerca de los donadores a baja \(T\), en la mitad de la brecha a alta \(T\).</li>
<li>La curva se calcula resolviendo la neutralidad con bisección; el apéndice de validación la compara con SciPy.</li>
</ul></div>
<p>La movilidad también depende del dopado (los iones dispersan a los portadores) y de la temperatura (los fonones). En silicio a 300 K, \(\mu_e\) cae de 0.14 m²/V·s en material puro a menos de 0.01 con dopados de \(10^{26}\) m⁻³. El <span class="term">efecto Hall</span> mide directamente el tipo y la concentración de portadores: una corriente en un campo magnético desvía las cargas y genera un voltaje transversal \(V_H=R_HIB/d\), con \(R_H=-1/(ne)\) para electrones.</p>
<div class="box ex"><h4>Silicio dopado con fósforo</h4>
<p>Un silicio tiene \(10^{23}\) átomos de P por m³. Estime su conductividad a 300 K (\(\mu_e=0.072\) m²/V·s a ese dopado).</p>
<details><summary>Solución</summary><p>Si todos los donadores estuvieran ionizados, \(n=10^{23}\) m⁻³; el cálculo de neutralidad da \(9.6\times10^{22}\) (96 % de ionización). \(\sigma=ne\mu_e=9.6\times10^{22}(1.602\times10^{-19})(0.072)=1.1\times10^3\) S/m: siete órdenes de magnitud más que el silicio puro con una impureza cada 500 000 átomos.</p></details>
</div>
</section>

<section>
<h2>La unión p-n</h2>
<p>Al poner en contacto silicio p y n, los electrones difunden hacia el lado p y los huecos hacia el n, y dejan una <span class="term">zona de agotamiento</span> con los iones fijos de los dopantes. Su campo detiene la difusión cuando se establece el potencial de contacto</p>
<div class="eq">\[V_{bi}=\frac{k_BT}{e}\ln\frac{N_aN_d}{n_i^2},\qquad W=\sqrt{\frac{2\varepsilon(V_{bi}-V)}{e}\left(\frac1{N_a}+\frac1{N_d}\right)}.\]</div>
<p>Con polarización directa la barrera baja y la corriente crece exponencialmente; con polarización inversa solo fluye una pequeña corriente de saturación. La ecuación del diodo ideal (Shockley) resume el comportamiento rectificador:</p>
<div class="eq key" data-name="Ecuación del diodo">\[I=I_s\left[\exp\left(\frac{eV}{nk_BT}\right)-1\right].\]</div>
<div class="sim" data-sim="pn-junction" data-title="Unión p-n: potencial de contacto, zona de agotamiento y curva I–V"></div>
<div class="sim-guide"><ul>
<li>Con \(N_a=N_d=10^{22}\) m⁻³, \(V_{bi}=0.71\) V y \(W=0.43\) µm.</li>
<li>Polarice en inversa: la zona de agotamiento se ensancha (así funcionan los varactores, condensadores controlados por voltaje).</li>
<li>Suba la temperatura 30 K: a corriente fija, el voltaje directo baja unos 2 mV/K, la base de los termómetros de diodo.</li>
</ul></div>
<p>Los transistores, las celdas solares, los LED y los láseres de semiconductor son variaciones de esta estructura. En el MOSFET, la base de los circuitos integrados, un voltaje en la compuerta crea un canal conductor bajo un óxido delgado; los chips actuales tienen decenas de miles de millones.</p>
</section>

<section>
<h2>Conducción iónica</h2>
<p>En los cerámicos iónicos y en los vidrios, la corriente también puede deberse al movimiento de iones por vacancias. La movilidad iónica sigue la relación de Nernst–Einstein, \(\mu_i=n_ieD_i/k_BT\), y como \(D_i\) es activado térmicamente, la conductividad iónica crece exponencialmente con la temperatura. Los electrolitos sólidos (circonia estabilizada para O²⁻, β-alúmina para Na⁺, óxidos y sulfuros de litio) son la base de los sensores de oxígeno, las celdas de combustible y las baterías de estado sólido.</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule la conductividad intrínseca del silicio a 300 K con \(n_i=1.07\times10^{16}\) m⁻³, \(\mu_e=0.145\) y \(\mu_h=0.050\) m²/V·s.
<details><summary>Respuesta</summary><p>\(\sigma=1.07\times10^{16}(1.602\times10^{-19})(0.195)=3.3\times10^{-4}\) S/m.</p></details></li>
<li><span class="lvl">Básico</span>Un alambre de cobre de 2 mm de diámetro y 100 m de largo, ¿qué resistencia tiene a 20 °C (\(\rho=1.68\times10^{-8}\) Ω·m)?
<details><summary>Respuesta</summary><p>\(R=\rho l/A=1.68\times10^{-8}(100)/(3.14\times10^{-6})=0.53\) Ω.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Cuánto vale el coeficiente de Hall del cobre (\(n=8.47\times10^{28}\) m⁻³)? ¿Qué voltaje de Hall aparece en una lámina de 0.1 mm con 10 A y 1 T?
<details><summary>Respuesta</summary><p>\(R_H=-7.4\times10^{-11}\) m³/C; \(V_H=R_HIB/d=-7.4\) µV: muy pequeño, por eso los sensores Hall usan semiconductores.</p></details></li>
<li><span class="lvl">Intermedio</span>Un silicio tipo n tiene \(N_d=10^{22}\) m⁻³. ¿Cuántos huecos hay a 300 K?
<details><summary>Respuesta</summary><p>\(p=n_i^2/N_d=(1.07\times10^{16})^2/10^{22}=1.1\times10^{10}\) m⁻³.</p></details></li>
<li><span class="lvl">Avanzado</span>Calcule \(V_{bi}\) y \(W\) para una unión de silicio con \(N_a=N_d=10^{22}\) m⁻³ (\(\varepsilon_r=11.7\)) a 300 K.
<details><summary>Respuesta</summary><p>\(V_{bi}=0.02585\ln(10^{44}/1.14\times10^{32})=0.71\) V; \(W=\sqrt{2(11.7)(8.85\times10^{-12})(0.71)(2\times10^{-22})/1.602\times10^{-19}}=0.43\) µm.</p></details></li>
</ol>
