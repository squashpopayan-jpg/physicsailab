<p class="lead">La corrosión cuesta a las economías industrializadas entre el 3 y el 4 % de su producto interno bruto cada año. No es una propiedad del metal solo, sino del par metal–ambiente: el mismo acero dura siglos en el desierto y meses en la zona de salpicadura del mar. La electroquímica permite predecir hacia dónde va la reacción (termodinámica) y con qué rapidez (cinética).</p>

<section>
<h2>Reacciones electroquímicas</h2>
<p>La corrosión metálica es una reacción de oxidación–reducción. En el <span class="term">ánodo</span> el metal se oxida y libera electrones, \(\text{M}\to\text{M}^{n+}+n\text{e}^-\); en el <span class="term">cátodo</span> otra especie los consume. En medios ácidos, \(2\text{H}^++2\text{e}^-\to\text{H}_2\); en medios neutros o básicos con oxígeno disuelto, \(\text{O}_2+2\text{H}_2\text{O}+4\text{e}^-\to4\text{OH}^-\). La oxidación del hierro en agua aireada termina formando \(\text{Fe(OH)}_3\), la herrumbre.</p>
<p>Cada semirreacción tiene un <span class="term">potencial estándar</span> \(E^0\), medido frente al electrodo de hidrógeno a 25 °C con concentraciones 1 M. Los metales con \(E^0\) más negativo son más activos (se oxidan con más facilidad). En una pila formada por dos metales, el de menor potencial es el ánodo y el voltaje es \(\Delta V^0=E_2^0-E_1^0\). Con concentraciones distintas de 1 M, la ecuación de Nernst corrige el potencial:</p>
<div class="eq key" data-name="Ecuación de Nernst">\[\Delta V=\left(E_2^0-E_1^0\right)-\frac{RT}{nF}\ln\frac{[\text{M}_1^{n+}]}{[\text{M}_2^{n+}]},\qquad \frac{RT}{F}\ln=0.0592\log\ \text{a 25 °C}.\]</div>
<div class="sim" data-sim="galvanic-cell" data-title="Pila galvánica y ecuación de Nernst"></div>
<div class="sim-guide"><ul>
<li>Zn–Cu con concentraciones 1 M: 1.103 V (la pila de Daniell).</li>
<li>Ni–Cd con [Cd²⁺] = 0.5 M y [Ni²⁺] = 10⁻³ M: el voltaje baja a 0.073 V (Callister, ej. 17.2). Cambie las concentraciones hasta invertir la polaridad.</li>
</ul></div>
<p>En la práctica se usa la <span class="term">serie galvánica</span> en agua de mar, que ordena aleaciones reales (incluidos estados pasivos) en lugar de metales puros: del extremo noble (platino, oro, titanio, inoxidables pasivos) al activo (aceros, aluminio, zinc, magnesio). Dos metales alejados en la serie, en contacto eléctrico y en un mismo electrolito, forman una pila: el activo se corroe aceleradamente.</p>
</section>

<section>
<h2>Velocidad de corrosión</h2>
<p>La termodinámica dice si un metal puede corroerse; la velocidad la decide la cinética de los electrodos. Cada reacción, desplazada de su equilibrio por un sobrepotencial \(\eta\), sigue la ecuación de Butler–Volmer, que para \(\abs\eta\) grande se reduce a la ley de Tafel:</p>
<div class="eq key" data-name="Ley de Tafel">\[\eta=\pm\beta\log\frac{i}{i_0},\]</div>
<p>con \(i_0\) la densidad de corriente de intercambio y \(\beta\) la pendiente de Tafel (≈ 0.1 V/década). Un metal que se corroe libremente se sitúa en el <span class="term">potencial mixto</span> \(E_{\text{corr}}\) donde la corriente anódica del metal iguala la catódica de la otra reacción. En un diagrama de Evans (potencial contra \(\log i\)), es el cruce de las dos rectas, y la corriente en ese punto, \(i_{\text{corr}}\), da la velocidad. Por la ley de Faraday,</p>
<div class="eq key" data-name="Velocidad de penetración">\[r=\frac{i}{nF},\qquad \text{CPR}=\frac{i\,A}{nF\rho}.\]</div>
<p>Una densidad de 1 µA/cm² en hierro equivale a unos 0.012 mm/año (ASTM G102).</p>
<div class="sim" data-sim="evans" data-title="Diagrama de Evans: potencial mixto y corriente de corrosión"></div>
<div class="sim-guide"><ul>
<li>Con los datos de Callister (ej. 17.4) para zinc en ácido: \(E_{\text{corr}}=-0.486\) V e \(i_{\text{corr}}=1.19\times10^{-4}\) A/cm², unos 1.8 mm/año.</li>
<li>Reduzca \(i_0\) del hidrógeno (una superficie que lo cataliza mal, como el mercurio): la corrosión se frena aunque la termodinámica no cambie.</li>
<li>Active la pasivación: por encima de un potencial, la corriente anódica cae varios órdenes de magnitud.</li>
</ul></div>
<h3>Pasivación</h3>
<p>Algunos metales (Cr, Ni, Ti, Al y los aceros inoxidables) forman en ciertos medios una película de óxido de pocos nanómetros, adherente e impermeable, que reduce la corrosión en factores de mil a un millón. Es una protección frágil: los cloruros la rompen localmente y provocan picaduras.</p>
</section>

<section>
<h2>Formas de corrosión</h2>
<ul>
<li><b>Uniforme</b>: la superficie se adelgaza de manera pareja; fácil de predecir con sobreespesores.</li>
<li><b>Galvánica</b>: dos metales distintos en contacto. Grave cuando el ánodo es pequeño y el cátodo grande (remaches de acero en placas de cobre); por eso se aíslan o se elige un ánodo grande.</li>
<li><b>Por aireación diferencial (rendijas)</b>: bajo depósitos, juntas o arandelas, el oxígeno se agota, la zona se vuelve anódica y se acidifica.</li>
<li><b>Por picaduras</b>: pequeños agujeros profundos, autocatalíticos; peligrosa porque pierde poco peso y perfora.</li>
<li><b>Intergranular</b>: en inoxidables sensibilizados (500–800 °C, por ejemplo cerca de soldaduras), precipitan carburos de cromo en los bordes de grano y la zona vecina queda sin protección. Se evita con bajo carbono (304L) o estabilizando con Ti o Nb.</li>
<li><b>Lixiviación selectiva</b>: el deszincado de los latones deja una esponja de cobre.</li>
<li><b>Erosión–corrosión</b>: el flujo remueve la película protectora.</li>
<li><b>Bajo tensión</b> y <b>fragilización por hidrógeno</b>: grietas que combinan esfuerzo y ambiente, a esfuerzos muy por debajo del límite elástico.</li>
</ul>
</section>

<section>
<h2>Oxidación a alta temperatura</h2>
<p>En aire caliente, el metal reacciona directamente con el oxígeno y forma una capa de óxido. Si la capa es protectora, su crecimiento lo controla la difusión a través de ella y el espesor sigue una ley parabólica, \(W^2=k_pt\); si es porosa o se agrieta, el crecimiento es lineal y la oxidación no se detiene. El cociente de Pilling y Bedworth predice cuál de los dos ocurre:</p>
<div class="eq key" data-name="Cociente de Pilling–Bedworth">\[\text{P–B}=\frac{A_O\,\rho_M}{a\,A_M\,\rho_O},\]</div>
<p>con \(A_O\) y \(\rho_O\) la masa molar y la densidad del óxido, \(A_M\) y \(\rho_M\) las del metal y \(a\) los átomos de metal por fórmula del óxido. Si P–B &lt; 1 (Mg: 0.81), el óxido no cubre la superficie y es poroso; si P–B está entre 1 y 2 (Al: 1.28; Cr: 2.0 en el límite), la capa es protectora; si es mucho mayor, acumula compresión y se descascara (Fe: 1.78, aunque su óxido crece rápido por difusión iónica).</p>
<div class="sim" data-sim="oxidation" data-title="Pilling–Bedworth y cinética de oxidación"></div>
<div class="sim-guide"><ul>
<li>Compare Mg, Al, Cr y Fe: solo Al y Cr forman capas protectoras; por eso el cromo y el aluminio son los aleantes que protegen a los aceros inoxidables y a las superaleaciones.</li>
<li>En la ley parabólica, cuadruplicar el tiempo solo duplica el espesor.</li>
</ul></div>
</section>

<section>
<h2>Prevención y protección</h2>
<ul>
<li><b>Selección del material y del diseño</b>: evitar pares galvánicos, rendijas y zonas de estancamiento; prever drenajes; añadir sobreespesor de corrosión.</li>
<li><b>Recubrimientos</b>: pinturas y polímeros como barrera; metálicos nobles (cromo, níquel) o de sacrificio (galvanizado con zinc, que protege incluso si se raya).</li>
<li><b>Inhibidores</b>: sustancias que, en pequeñas concentraciones, bloquean las reacciones anódica o catódica (en circuitos de refrigeración y calderas).</li>
<li><b>Protección catódica</b>: convertir la estructura en el cátodo de una pila, conectándola a un ánodo de sacrificio más activo (Mg, Zn, Al) o a una fuente de corriente impresa. Así se protegen tuberías enterradas, cascos de barco y calentadores de agua.</li>
</ul>
<div class="sim" data-sim="cathodic" data-title="Dimensionamiento de un ánodo de sacrificio"></div>
<div class="sim-guide"><ul>
<li>Una corriente de protección de 1 A consume unos 8 kg de magnesio por año con 50 % de eficiencia.</li>
<li>Compare Mg, Zn y Al: el aluminio entrega más carga por kilogramo, pero en agua dulce se pasiva y deja de protegerse.</li>
</ul></div>
<h3>Degradación de cerámicos y polímeros</h3>
<p>Los cerámicos son en general muy estables, aunque se disuelven en sales fundidas o en álcalis calientes (los vidrios). Los polímeros no se corroen electroquímicamente, pero se degradan por hinchamiento y disolución en solventes de parámetro de solubilidad parecido, por ruptura de enlaces por radiación ultravioleta, calor u oxidación (por eso se agregan estabilizantes), y por ataque químico. La resistencia al ambiente es parte esencial de la selección de cualquier material.</p>
</section>

<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule el voltaje estándar de una pila Zn–Cu e identifique el ánodo.
<details><summary>Respuesta</summary><p>\(0.340-(-0.763)=1.103\) V; el zinc es el ánodo.</p></details></li>
<li><span class="lvl">Básico</span>Calcule el cociente de Pilling–Bedworth del Al₂O₃ sobre aluminio (\(\rho_O=3.95\), \(\rho_M=2.70\) g/cm³).
<details><summary>Respuesta</summary><p>\(101.96(2.70)/[2(26.98)(3.95)]=1.29\): protector.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Qué velocidad de penetración corresponde a \(1.19\times10^{-4}\) A/cm² en zinc (\(\rho=7.14\) g/cm³)?
<details><summary>Respuesta</summary><p>1.79 mm/año.</p></details></li>
<li><span class="lvl">Intermedio</span>Un ánodo de magnesio debe entregar 0.5 A durante 10 años con 50 % de eficiencia. ¿Qué masa necesita?
<details><summary>Respuesta</summary><p>\(m=ItA/(nF\eta)=0.5(3.156\times10^8)(24.3)/[2(96485)(0.5)]=39.7\) kg.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que en el diagrama de Evans con dos rectas de Tafel, \(E_{\text{corr}}=\dfrac{\beta_c\beta_a\log(i_{0c}/i_{0a})+\beta_cE_a+\beta_aE_c}{\beta_a+\beta_c}\).
<details><summary>Respuesta</summary><p>Igualando \(i_{0a}10^{(E-E_a)/\beta_a}=i_{0c}10^{-(E-E_c)/\beta_c}\) y tomando logaritmos: \((E-E_a)/\beta_a+(E-E_c)/\beta_c=\log(i_{0c}/i_{0a})\), de donde se despeja \(E\).</p></details></li>
</ol>
