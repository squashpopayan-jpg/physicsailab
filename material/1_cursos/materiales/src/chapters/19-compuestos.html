<p class="lead">Un material compuesto combina dos o más fases para lograr propiedades que ninguna tiene por separado: fibras de carbono rígidas y frágiles en una resina epoxi blanda pero tenaz dan un material más rígido que el aluminio, más resistente que el acero y cinco veces más liviano. La naturaleza lo hizo antes: la madera, el hueso y el nácar son compuestos. Este capítulo deduce sus propiedades a partir de las de sus fases.</p>

<section>
<h2>Matrices, refuerzos y clasificación</h2>
<p>La fase continua, la <span class="term">matriz</span>, sostiene y protege el refuerzo, transfiere la carga y aporta tenacidad; puede ser polimérica (PMC: epoxi, poliéster, PEEK), metálica (MMC: Al con SiC) o cerámica (CMC: SiC/SiC en turbinas). La fase dispersa, el <span class="term">refuerzo</span>, aporta rigidez y resistencia. Según la forma del refuerzo, los compuestos se clasifican en reforzados con partículas (grandes, como el concreto, o dispersas, como los ODS), con fibras (continuas y alineadas, discontinuas alineadas o al azar) y estructurales (laminados y sándwich).</p>

<section>
<h2>La regla de las mezclas y sus cotas</h2>
<p>Si las fases sufren la misma deformación (carga paralela a fibras continuas: condición de isodeformación, Voigt), el módulo es el promedio ponderado por volumen; si sufren el mismo esfuerzo (carga perpendicular: isoesfuerzo, Reuss), lo es su inverso:</p>
<div class="eq key" data-name="Regla de las mezclas">\[E_{cl}=E_fV_f+E_mV_m,\qquad \frac1{E_{ct}}=\frac{V_f}{E_f}+\frac{V_m}{E_m}.\]</div>
<p>Ambas son cotas: ningún arreglo de dos fases puede ser más rígido que la de Voigt ni más blando que la de Reuss. Para partículas equiaxiales distribuidas al azar, Hashin y Shtrikman (1963) obtuvieron cotas más estrechas, y para el módulo transversal de fibras la expresión semiempírica de Halpin–Tsai,</p>
<div class="eq">\[\frac{E}{E_m}=\frac{1+\xi\eta V_f}{1-\eta V_f},\qquad \eta=\frac{E_f/E_m-1}{E_f/E_m+\xi},\]</div>
<p>interpola entre Reuss (\(\xi\to0\)) y Voigt (\(\xi\to\infty\)); con \(\xi=2\) reproduce bien el módulo transversal de fibras circulares.</p>
<div class="sim" data-sim="rule-of-mixtures" data-title="Módulo de un compuesto: Voigt, Reuss, Hashin–Shtrikman y Halpin–Tsai"></div>
<div class="sim-guide"><ul>
<li>Con vidrio E y poliéster (\(V_f=0.4\)): longitudinal 29.6 GPa y transversal 5.5 GPa (Callister, ej. 16.1 y 16.2). La anisotropía es enorme.</li>
<li>Cambie a partículas de WC en Co (cermet): las fases tienen módulos parecidos y todas las estimaciones casi coinciden.</li>
</ul></div>
<div class="box ex"><h4>Quién soporta la carga</h4>
<p>En el compuesto de vidrio y poliéster anterior (\(E_f=69\), \(E_m=3.4\) GPa, \(V_f=0.4\)), ¿qué fracción de la carga longitudinal soportan las fibras?</p>
<details><summary>Solución</summary><p>Con igual deformación, \(F_f/F_m=E_fV_f/(E_mV_m)=69(0.4)/[3.4(0.6)]=13.5\). Las fibras soportan \(13.5/14.5=93\) % de la carga.</p></details>
</div>
</section>

<section>
<h2>Transferencia de carga y longitud crítica</h2>
<p>La matriz no tira de las fibras por los extremos sino por la superficie, mediante esfuerzos cortantes en la interfaz. Si la interfaz (o la matriz) cede a un cortante \(\tau_c\), el esfuerzo en la fibra crece linealmente desde cada extremo: el equilibrio de un tramo \(\dd x\) da \(\tfrac{\pi d^2}4\dd\sigma_f=\tau_c\,\pi d\,\dd x\), es decir \(\sigma_f(x)=4\tau_cx/d\), hasta alcanzar su resistencia a una distancia \(l_c/2\) de cada extremo. Eso define la <span class="term">longitud crítica</span>, la mínima para que la fibra llegue a romperse:</p>
<div class="eq key" data-name="Longitud crítica de fibra">\[l_c=\frac{\sigma_f^*\,d}{2\tau_c}.\]</div>
<p>Las fibras mucho más largas que \(l_c\) (en la práctica, \(l&gt;15l_c\)) se comportan como continuas. Para fibras discontinuas alineadas,</p>
<div class="eq">\[\sigma_{cd}^*=\sigma_f^*V_f\left(1-\frac{l_c}{2l}\right)+\sigma_m'(1-V_f)\quad(l&gt;l_c),\qquad \sigma_{cd'}^*=\frac{l\tau_c}{d}V_f+\sigma_m'(1-V_f)\quad(l&lt;l_c).\]</div>
<div class="sim" data-sim="fiber-length" data-title="Esfuerzo a lo largo de una fibra y longitud crítica"></div>
<div class="sim-guide"><ul>
<li>Con \(l&lt;l_c\) el esfuerzo nunca llega a \(\sigma_f^*\): la fibra se arranca de la matriz sin romperse.</li>
<li>Con \(l=l_c\) el máximo se alcanza solo en el centro; con \(l=15l_c\), la mayor parte de la fibra trabaja a plena carga.</li>
<li>Mejore la adhesión (\(\tau_c\) mayor): \(l_c\) se acorta. Por eso las fibras se recubren con agentes de acoplamiento (silanos en el vidrio).</li>
</ul></div>
</section>

<section>
<h2>Resistencia de los compuestos de fibra continua</h2>
<p>En tracción longitudinal, las fibras (frágiles) fallan a su deformación de rotura \(\varepsilon_f^*=\sigma_f^*/E_f\); en ese momento la matriz soporta \(\sigma_m'=E_m\varepsilon_f^*\). Si hay suficientes fibras, el compuesto falla con ellas:</p>
<div class="eq key" data-name="Resistencia longitudinal">\[\sigma_{cl}^*=\sigma_m'(1-V_f)+\sigma_f^*V_f.\]</div>
<p>Con muy pocas fibras, la matriz puede soportar más carga que el compuesto tras la rotura de las fibras: existe una fracción mínima por debajo de la cual las fibras debilitan, y una crítica por debajo de la cual no conviene reforzar. En la práctica \(V_f\) va de 0.5 a 0.65; más allá la matriz no alcanza a mojar las fibras. En dirección transversal la resistencia la limitan la matriz y la interfaz, y es apenas de 30–100 MPa.</p>
<div class="sim" data-sim="composite-strength" data-title="Resistencia longitudinal contra fracción de fibras"></div>
<div class="sim-guide"><ul>
<li>Con carbono en epoxi y \(V_f=0.6\), \(\sigma_{cl}^*\approx2.1\) GPa, más que un acero de alta resistencia, con una densidad de 1.55 g/cm³.</li>
<li>Busque \(V_{\min}\) y \(V_{\text{crit}}\): con fibras fuertes en una matriz débil son de apenas una fracción de porcentaje.</li>
</ul></div>
</section>

<section>
<h2>Láminas fuera de eje y laminados</h2>
<p>Una lámina unidireccional es ortótropa: muy rígida a lo largo de las fibras (\(E_1\)), blanda en la dirección transversal (\(E_2\)) y en cizalla (\(G_{12}\)). Cargada a un ángulo \(\theta\) de las fibras, su módulo es</p>
<div class="eq">\[\frac1{E_x(\theta)}=\frac{\cos^4\theta}{E_1}+\left(\frac1{G_{12}}-\frac{2\nu_{12}}{E_1}\right)\sen^2\theta\cos^2\theta+\frac{\sen^4\theta}{E_2}.\]</div>
<p>Con una lámina de carbono-epoxi (\(E_1=140\), \(E_2=10\), \(G_{12}=5\) GPa) el módulo cae de 140 GPa a 80 GPa con solo 10° de desalineación, y a 13 GPa a 45°. Para cargas en varias direcciones se apilan láminas con distintas orientaciones; la <span class="term">teoría clásica de laminados</span> suma sus matrices de rigidez rotadas. El apilamiento [0/±45/90]<sub>s</sub> es <span class="term">cuasiisótropo</span> en el plano: su módulo no depende de la dirección y vale algo más de un tercio del longitudinal.</p>
<div class="sim" data-sim="laminate" data-title="Módulo en el plano de láminas y laminados (diagrama polar)"></div>
<div class="sim-guide"><ul>
<li>La lámina a 0° tiene un lóbulo agudo: rígida en una sola dirección.</li>
<li>[0/90]<sub>s</sub> es rígido a 0° y 90° y débil a 45°; agregar ±45° lo vuelve un círculo.</li>
<li>Compare el cuasiisótropo de carbono (≈ 54 GPa) con el aluminio (69 GPa): pesa 43 % menos, pero no es más rígido. La ventaja de los compuestos está en orientar las fibras donde hace falta.</li>
</ul></div>
<p>Los compuestos <span class="term">sándwich</span> separan dos pieles rígidas con un núcleo liviano (espuma, panal de abeja o madera de balsa): como la rigidez a flexión crece con el cuadrado de la separación, se obtienen paneles muy rígidos y livianos, como los pisos de los aviones.</p>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule los módulos longitudinal y transversal de un carbono-epoxi con \(V_f=0.6\) (\(E_f=230\), \(E_m=3.4\) GPa).
<details><summary>Respuesta</summary><p>\(E_{cl}=139.4\) GPa; \(E_{ct}=8.3\) GPa (Reuss).</p></details></li>
<li><span class="lvl">Básico</span>Calcule \(l_c\) para fibras de vidrio de 10 µm (\(\sigma_f^*=3.45\) GPa) con \(\tau_c=10\) MPa.
<details><summary>Respuesta</summary><p>\(l_c=3.45\times10^9(10^{-5})/(2\times10^7)=1.7\) mm.</p></details></li>
<li><span class="lvl">Intermedio</span>Para carbono-epoxi con \(V_f=0.6\), \(\sigma_f^*=3.5\) GPa, \(E_f=230\) y \(E_m=3.4\) GPa, calcule \(\sigma_m'\) y \(\sigma_{cl}^*\).
<details><summary>Respuesta</summary><p>\(\varepsilon_f^*=0.0152\); \(\sigma_m'=51.7\) MPa; \(\sigma_{cl}^*=0.4(51.7)+0.6(3500)=2121\) MPa.</p></details></li>
<li><span class="lvl">Intermedio</span>Si las fibras del problema anterior se cortan a 5 mm (\(l_c=0.31\) mm), ¿cuánto vale la resistencia?
<details><summary>Respuesta</summary><p>\(3500(0.6)(1-0.31/10)+51.7(0.4)=2056\) MPa: solo 3 % menos que con fibras continuas.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que la cota de Reuss es siempre menor o igual que la de Voigt (use la desigualdad entre las medias aritmética y armónica).
<details><summary>Respuesta</summary><p>Voigt es la media aritmética ponderada de \(E_f\) y \(E_m\); Reuss, la armónica ponderada. Para números positivos, la armónica nunca supera a la aritmética, con igualdad solo si \(E_f=E_m\).</p></details></li>
</ol>
