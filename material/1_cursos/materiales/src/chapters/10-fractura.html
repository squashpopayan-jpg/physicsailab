<p class="lead">El 16 de enero de 1943, el petrolero T2 <em>Schenectady</em>, recién terminado, se partió en dos mientras estaba amarrado en el muelle de Portland, Oregón, con el mar en calma. Ninguna carga excedía la resistencia del acero. La explicación tardó décadas en llegar y fundó una disciplina: la mecánica de la fractura, que relaciona la tensión, el tamaño de los defectos y una propiedad del material, la tenacidad.</p>

<section>
<h2>Fractura dúctil y frágil</h2>
<p>La fractura es la separación de un cuerpo en dos o más partes. Ocurre en dos etapas, la formación y la propagación de grietas, y el modo de propagación divide las fracturas en dos clases:</p>
<ul>
<li><b>Dúctil</b>: hay deformación plástica extensa antes y durante la propagación. La grieta avanza lentamente (es estable: se detiene si se retira la carga). En tracción, se forma un cuello, aparecen microcavidades en partículas de segunda fase, éstas crecen y coalescen, y la fractura final da la superficie de «copa y cono», con hoyuelos (<em>dimples</em>) visibles al microscopio electrónico.</li>
<li><b>Frágil</b>: casi sin deformación plástica, la grieta avanza muy rápido (cerca de la velocidad del sonido) y es inestable. La superficie es plana y brillante, con marcas en «V» o en abanico que apuntan al origen. Puede ser <span class="term">transgranular</span> (clivaje a lo largo de planos cristalográficos, con facetas) o <span class="term">intergranular</span> (a lo largo de bordes de grano debilitados por segregación o precipitados).</li>
</ul>
<p>La fractura dúctil es preferible: avisa con deformación y absorbe mucha más energía. Los metales FCC no muestran fractura frágil; los BCC y HCP sí, por debajo de cierta temperatura. Los cerámicos y los polímeros vítreos son frágiles a temperatura ambiente.</p>
</section>

<section>
<h2>Concentración de esfuerzos</h2>
<p>La resistencia a la fractura medida de los materiales frágiles es de 10 a 1000 veces menor que la resistencia teórica de los enlaces (\(\approx E/10\)). Inglis (1913) resolvió el campo de esfuerzos alrededor de un agujero elíptico en una placa: en la punta del eje mayor, el esfuerzo vale</p>
<div class="eq key" data-name="Concentración de esfuerzos de Inglis">\[\sigma_m=\sigma_0\left[1+2\left(\frac a{\rho_t}\right)^{1/2}\right]\approx2\sigma_0\left(\frac a{\rho_t}\right)^{1/2},\qquad K_t=\frac{\sigma_m}{\sigma_0},\]</div>
<p>con \(a\) la mitad de la longitud de la grieta interna (o la longitud de una grieta superficial) y \(\rho_t\) el radio de curvatura de la punta. Una grieta de 1 mm con radio de punta atómico concentra el esfuerzo por un factor de cientos. Lo mismo hacen, en menor grado, los agujeros, las esquinas vivas, las roscas y los cambios bruscos de sección: los «concentradores de esfuerzos» del diseño mecánico.</p>
<div class="sim" data-sim="inglis" data-title="Esfuerzo en la punta de un agujero elíptico"></div>
<div class="sim-guide"><ul>
<li>Con un agujero circular (\(a=\rho_t\)), \(K_t=3\): el clásico resultado de Kirsch.</li>
<li>Afile la punta: \(K_t\) crece como \(\sqrt{a/\rho_t}\), y la zona de esfuerzo alto se hace cada vez más pequeña. En un metal dúctil, la plasticidad en esa zona redondea la punta y frena la concentración.</li>
</ul></div>
</section>

<section>
<h2>El criterio de Griffith</h2>
<p>Griffith (1921) planteó la fractura como un balance de energía. Una grieta pasante de longitud \(2a\) en una placa de espesor unitario sometida a \(\sigma\) libera energía elástica \(\pi\sigma^2a^2/E\) (resultado de Inglis), pero cuesta energía de superficie \(4a\gamma_s\) (dos caras de longitud \(2a\)). La grieta crece si al hacerlo baja la energía total:</p>
<div class="eq">\[U(a)=4a\gamma_s-\frac{\pi\sigma^2a^2}{E},\qquad \odv{U}{a}=0\ \Rightarrow\ \sigma_c=\left(\frac{2E\gamma_s}{\pi a}\right)^{1/2}.\]</div>
<p>El esfuerzo crítico cae como \(1/\sqrt a\): los defectos grandes son los peligrosos. En los metales, la energía absorbida por la deformación plástica en la punta, \(\gamma_p\), es mucho mayor que \(\gamma_s\) (mil veces o más), y Orowan e Irwin propusieron sustituir \(\gamma_s\) por \(\gamma_s+\gamma_p\).</p>
<div class="sim" data-sim="griffith" data-title="Balance de energía de Griffith"></div>
<div class="sim-guide"><ul>
<li>Para un esfuerzo dado, la curva \(U(a)\) tiene un máximo en la longitud crítica \(a_c\). Las grietas más cortas no crecen (cerrarlas baja la energía); las más largas crecen sin límite.</li>
<li>Duplique el esfuerzo: \(a_c\) se reduce a la cuarta parte.</li>
<li>Cambie de vidrio a acero (con \(\gamma_p\)): con el mismo esfuerzo, la grieta crítica pasa de micrómetros a milímetros.</li>
</ul></div>
<div class="box ex"><h4>El vidrio de una ventana</h4>
<p>Una placa grande de vidrio (\(E=69\) GPa, \(\gamma_s=0.3\) J/m²) soporta 40 MPa. ¿Cuál es la grieta superficial más larga que tolera sin romperse? (Callister, ej. 8.1.)</p>
<details><summary>Solución</summary><p>\(a=2E\gamma_s/(\pi\sigma^2)=2(69\times10^9)(0.3)/[\pi(40\times10^6)^2]=8.2\times10^{-6}\) m \(=8.2\) µm. Un rayón invisible basta para romper el vidrio a una fracción de su resistencia teórica.</p></details>
</div>
</section>

<section>
<h2>Factor de intensidad de esfuerzos y tenacidad</h2>
<p>Irwin (1957) mostró que, cerca de la punta de cualquier grieta en un sólido elástico, el campo de esfuerzos tiene siempre la misma forma,</p>
<div class="eq">\[\sigma_{ij}=\frac{K}{\sqrt{2\pi r}}\,f_{ij}(\theta),\]</div>
<p>y que toda la información sobre la carga y la geometría queda en un solo número, el <span class="term">factor de intensidad de esfuerzos</span>. Para la apertura en modo I (tracción perpendicular a la grieta):</p>
<div class="eq key" data-name="Factor de intensidad de esfuerzos">\[K_I=Y\,\sigma\sqrt{\pi a},\]</div>
<p>donde \(Y\) es un factor geométrico adimensional (1 para una grieta interna en una placa infinita, 1.12 para una grieta de borde). La fractura ocurre cuando \(K_I\) alcanza un valor crítico, la <span class="term">tenacidad a la fractura</span> \(K_{Ic}\), una propiedad del material (MPa·√m). Con ella se resuelven los tres problemas del diseño tolerante al daño:</p>
<div class="eq">\[\sigma_c=\frac{K_{Ic}}{Y\sqrt{\pi a}},\qquad a_c=\frac1\pi\left(\frac{K_{Ic}}{Y\sigma}\right)^2,\qquad K_{Ic,\text{mín}}=Y\sigma\sqrt{\pi a}.\]</div>
<p>\(K_{Ic}\) se mide en <span class="term">deformación plana</span>, con probetas lo bastante gruesas como para que la zona plástica de la punta, de tamaño \(r_p\approx\frac1{2\pi}(K/\sigma_y)^2\), sea pequeña frente al espesor: la norma ASTM E399 exige \(B\ge2.5\,(K_{Ic}/\sigma_y)^2\). En láminas delgadas (tensión plana) la tenacidad aparente es mayor.</p>

<div class="box ex"><h4>¿Se ve la grieta crítica?</h4>
<p>Una placa ancha de acero (\(K_{Ic}=50\) MPa√m, \(\sigma_y=1200\) MPa) se diseña con \(\sigma=\sigma_y/2\) e \(Y=1\). El método de inspección detecta grietas de 3 mm o más. ¿Es detectable la grieta crítica?</p>
<details><summary>Solución</summary><p>\(a_c=\frac1\pi\left(\frac{50}{600}\right)^2=2.2\times10^{-3}\) m \(=2.2\) mm. Es menor que el umbral de 3 mm: una grieta crítica pasaría inadvertida. Hay que bajar el esfuerzo de diseño o usar otro acero.</p></details>
</div>
</section>

<section>
<h2>Ensayo de impacto y transición dúctil–frágil</h2>
<p>Tres factores favorecen la fractura frágil de un material normalmente dúctil: baja temperatura, alta velocidad de deformación y un estado triaxial de esfuerzos (como en el fondo de una entalla). El ensayo Charpy los reúne: un péndulo de masa \(m\) cae desde la altura \(h_0\), rompe una probeta entallada y sube hasta \(h_f\); la energía absorbida es \(mg(h_0-h_f)\).</p>
<p>En los aceros ferríticos (BCC) y en muchos polímeros, la energía de impacto cae bruscamente en un intervalo de temperaturas: es la <span class="term">transición dúctil–frágil</span>. Por encima, la fractura es dúctil y fibrosa; por debajo, por clivaje, plana y brillante. La transición se desplaza a temperaturas más altas con más carbono, con grano más grueso y con la irradiación neutrónica; los metales FCC (aluminio, cobre, aceros austeníticos) no la tienen. Los barcos Liberty y los T2 de la Segunda Guerra Mundial, soldados en acero con transición cerca de 0 °C, se partían en las aguas frías del Atlántico Norte.</p>
<div class="sim" data-sim="charpy" data-title="Ensayo Charpy y curva de transición dúctil–frágil"></div>
<div class="sim-guide"><ul>
<li>Suba el contenido de carbono: la temperatura de transición se desplaza hacia arriba y la meseta superior baja.</li>
<li>Cambie a un acero austenítico (FCC): no hay transición.</li>
<li>Elija una temperatura de servicio y lea la energía absorbida. Muchas normas exigen al menos 27 J a la mínima temperatura de servicio.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Una grieta interna de 0.5 mm de semilongitud tiene un radio de punta de 2 µm. Si el esfuerzo aplicado es 40 MPa, ¿cuánto vale el esfuerzo en la punta?
<details><summary>Respuesta</summary><p>\(K_t=1+2\sqrt{250}=32.6\); \(\sigma_m=1.3\) GPa.</p></details></li>
<li><span class="lvl">Básico</span>Un péndulo Charpy de 30 kg cae desde 1.5 m y sube hasta 0.9 m tras romper la probeta. ¿Qué energía absorbió?
<details><summary>Respuesta</summary><p>\(30(9.81)(0.6)=177\) J.</p></details></li>
<li><span class="lvl">Intermedio</span>Una placa de 7075-T651 (\(K_{Ic}=24\) MPa√m) tiene una grieta de borde de 1 mm (\(Y=1.12\)). ¿A qué esfuerzo se rompe? ¿Fluye antes?
<details><summary>Respuesta</summary><p>\(\sigma_c=24/(1.12\sqrt{\pi\cdot0.001})=382\) MPa, menor que \(\sigma_y=495\) MPa: falla por fractura sin fluir.</p></details></li>
<li><span class="lvl">Intermedio</span>Calcule el espesor mínimo para medir \(K_{Ic}\) válido en el aluminio 2024-T3 y en el acero 4340 revenido a 260 °C.
<details><summary>Respuesta</summary><p>2024: \(2.5(44/345)^2=40.7\) mm. 4340: \(2.5(50/1640)^2=2.3\) mm.</p></details></li>
<li><span class="lvl">Intermedio</span>Si el esfuerzo de diseño se reduce a la mitad, ¿cuánto crece la grieta crítica?
<details><summary>Respuesta</summary><p>\(a_c\propto1/\sigma^2\): se cuadruplica.</p></details></li>
<li><span class="lvl">Avanzado</span>Un recipiente a presión de pared delgada (radio \(r\), espesor \(t\), presión \(p\)) tiene esfuerzo circunferencial \(\sigma=pr/t\). Si una grieta pasante de longitud \(2a=t\) debe ser estable (criterio de «fuga antes de rotura»), demuestre que la presión máxima es \(p=\dfrac{K_{Ic}\,t}{r\sqrt{\pi t/2}}\) y concluya qué índice de material conviene maximizar con \(\sigma_y\) dado.
<details><summary>Respuesta</summary><p>Con \(a=t/2\) e \(Y=1\): \(K_{Ic}=\frac{pr}{t}\sqrt{\pi t/2}\). Si además la pared se diseña a fluencia, \(t=pr/\sigma_y\), y la condición se vuelve \(K_{Ic}^2/\sigma_y\ge\pi pr/2\): conviene maximizar \(K_{Ic}^2/\sigma_y\) (Ashby).</p></details></li>
</ol>
