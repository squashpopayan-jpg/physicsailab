<p class="lead">Ningún cristal real es perfecto, y casi ninguna propiedad útil de los materiales existiría si lo fuera. La resistencia de los metales depende de las dislocaciones, la difusión depende de las vacancias, la conductividad de los semiconductores depende de las impurezas, y la tenacidad depende de los bordes de grano. Este capítulo clasifica los defectos por su dimensión y cuantifica los más importantes.</p>

<section>
<h2>Vacancias: un defecto de equilibrio</h2>
<p>Una <span class="term">vacancia</span> es un sitio de la red que debería estar ocupado y está vacío. A diferencia de otros defectos, las vacancias existen en equilibrio termodinámico: crear una cuesta una energía \(Q_v\), pero aumenta la entropía configuracional, porque hay muchas formas de repartir \(N_v\) huecos entre \(N\) sitios. Minimizando la energía libre \(G=N_vQ_v-TS_{\text{conf}}\) con \(S_{\text{conf}}=k_B\ln\binom{N}{N_v}\) y la aproximación de Stirling se obtiene</p>
<div class="eq key" data-name="Concentración de vacancias en equilibrio">\[\frac{N_v}{N}=\exp\!\left(-\frac{Q_v}{k_BT}\right),\]</div>
<p>donde \(k_B=8.62\times10^{-5}\) eV/K. En el cobre cerca de su temperatura de fusión hay del orden de una vacancia cada mil sitios; a temperatura ambiente, una cada \(10^{20}\). La dependencia exponencial con \(T\) es la firma de todo proceso térmicamente activado, y reaparecerá en la difusión, la fluencia y la conductividad de los semiconductores.</p>
<div class="box ex"><h4>Vacancias en el cobre</h4>
<p>Callister calcula el número de vacancias por metro cúbico en el cobre a 1000 °C con \(Q_v=0.9\) eV, densidad 8.4 g/cm³ (a esa temperatura) y \(A=63.5\) g/mol.</p>
<details><summary>Solución</summary><p>\(N=N_A\rho/A=(6.022\times10^{23})(8.4\times10^6\ \text{g/m}^3)/63.5=8.0\times10^{28}\) átomos/m³. \(N_v=N\exp[-0.9/(8.62\times10^{-5}\times1273)]=8.0\times10^{28}\times2.74\times10^{-4}=2.2\times10^{25}\) m⁻³. (Las mediciones modernas dan \(Q_v\approx1.28\) eV para el Cu; con ese valor, \(N_v\approx7\times10^{23}\) m⁻³.)</p></details>
</div>
<div class="sim" data-sim="vacancies" data-title="Vacancias en equilibrio: fracción, gráfica de Arrhenius y red"></div>
<div class="sim-guide"><ul>
<li>Lleve el aluminio a su punto de fusión (933 K): la fracción ronda \(10^{-4}\). El tungsteno, con \(Q_v=3.67\) eV, tiene menos vacancias a 2000 K que el aluminio a 600 K.</li>
<li>En la gráfica de Arrhenius, \(\ln(N_v/N)\) contra \(1/T\) es una recta de pendiente \(-Q_v/k_B\): así se mide \(Q_v\) a partir de datos de dilatometría o de aniquilación de positrones.</li>
</ul></div>
<p>Un átomo de la propia red alojado en un hueco intersticial es un <span class="term">autointersticial</span>; distorsiona mucho la red y su concentración de equilibrio es despreciable, aunque se crean en abundancia bajo irradiación. En cerámicos iónicos, la neutralidad obliga a crear los defectos en pares: un <span class="term">defecto de Schottky</span> es un par vacancia catiónica–vacancia aniónica; un <span class="term">defecto de Frenkel</span>, un catión que deja su sitio y pasa a un intersticio.</p>
</section>

<section>
<h2>Impurezas y soluciones sólidas</h2>
<p>Ningún metal es puro: el «hierro puro» comercial tiene del orden de 0.01 % de impurezas, es decir \(10^{18}\) átomos extraños por centímetro cúbico. Cuando los átomos de soluto se incorporan a la red del solvente sin formar una nueva estructura se tiene una <span class="term">solución sólida</span>, que puede ser:</p>
<ul>
<li><b>Sustitucional</b>: el soluto ocupa sitios de la red. Ejemplos: Ni en Cu, Zn en Cu (latón), Cr en Fe.</li>
<li><b>Intersticial</b>: el soluto, mucho más pequeño, ocupa huecos. Solo H, C, N, O y B son lo bastante pequeños. El caso decisivo es el carbono en hierro.</li>
</ul>
<p>Hume-Rothery formuló cuatro reglas empíricas para que la solubilidad sustitucional sea extensa:</p>
<ol>
<li><b>Tamaño</b>: la diferencia de radios atómicos debe ser menor que ±15 %; más allá, la distorsión limita la solubilidad.</li>
<li><b>Estructura</b>: ambos metales deben tener la misma estructura cristalina.</li>
<li><b>Electronegatividad</b>: debe ser parecida; si no, tienden a formar compuestos intermetálicos.</li>
<li><b>Valencia</b>: a igualdad de lo demás, un metal disuelve mejor a otro de mayor valencia que a uno de menor.</li>
</ol>
<div class="sim" data-sim="hume-rothery" data-title="Reglas de Hume-Rothery contra solubilidades medidas"></div>
<div class="sim-guide"><ul>
<li>Cu–Ni cumple las cuatro reglas y es soluble en todas las proporciones: es el diagrama isomorfo del capítulo 12.</li>
<li>Cu–Zn falla en la estructura (el Zn es HCP) y la solubilidad se corta en 39 % de Zn: más zinc produce la fase β del latón.</li>
<li>Cu–Ag cumple casi todo, salvo el tamaño (13 %), y su solubilidad máxima es 8 %: las reglas son necesarias, no suficientes.</li>
</ul></div>
<h3>Solubilidad intersticial del carbono en el hierro</h3>
<p>El radio de un hueco octaédrico es \(0.414R\) en FCC y \(0.155R\) en BCC (el tetraédrico de BCC es algo mayor, \(0.291R\), pero el carbono prefiere el octaédrico porque solo dos vecinos quedan muy cerca). Para el hierro, con \(R\approx0.124\)–\(0.129\) nm, los huecos máximos son de unos 0.053 nm en la austenita (FCC) y 0.036 nm en la ferrita (BCC), ambos menores que el radio del carbono (0.071 nm). La red se deforma, mucho más en la ferrita. El resultado: la austenita disuelve hasta 2.14 % en peso de carbono y la ferrita apenas 0.022 %. Esa diferencia, cien veces, es la base de la metalurgia del acero.</p>
</section>

<section>
<h2>Especificación de la composición</h2>
<p>La composición se da en porcentaje en peso (masa) o en porcentaje atómico (moles). Para un binario de elementos 1 y 2, con masas atómicas \(A_1\) y \(A_2\):</p>
<div class="eq key" data-name="Conversión peso–átomo">\[C_1'=\frac{C_1A_2}{C_1A_2+C_2A_1}\times100,\qquad C_1=\frac{C_1'A_1}{C_1'A_1+C_2'A_2}\times100,\]</div>
<p>donde las primas indican porcentaje atómico. Para pasar a concentración volumétrica (masa por unidad de volumen, útil en difusión) se necesitan las densidades: \(C_1''=C_1\big/\left(C_1/\rho_1+C_2/\rho_2\right)\times10^3\) en kg/m³ con \(\rho\) en g/cm³.</p>
<div class="box ex"><h4>Un acero en átomos</h4>
<p>Un acero tiene 0.80 % en peso de carbono. ¿Qué porcentaje de los átomos son de carbono?</p>
<details><summary>Solución</summary><p>\(C_C'=\dfrac{0.80(55.85)}{0.80(55.85)+99.2(12.01)}\times100=3.62\) % atómico. Uno de cada 28 átomos es carbono, aunque la masa sea menos del 1 %.</p></details>
</div>
</section>

<section>
<h2>Dislocaciones: defectos lineales</h2>
<p>Una <span class="term">dislocación</span> es una línea alrededor de la cual los átomos están desalineados. En una <span class="term">dislocación de borde</span> (o de arista) se ha insertado un semiplano extra de átomos que termina dentro del cristal; la línea de dislocación es el borde de ese semiplano. En una <span class="term">dislocación de tornillo</span>, el cristal se ha cizallado una distancia atómica a lo largo de un semiplano, y los planos atómicos forman una rampa helicoidal alrededor de la línea. La mayoría de las dislocaciones reales son <span class="term">mixtas</span>.</p>
<p>La magnitud y la dirección de la distorsión se expresan con el <span class="term">vector de Burgers</span> \(\vb b\). Se traza un circuito que, en un cristal perfecto, se cerraría (el mismo número de pasos en cada sentido); alrededor de una dislocación no se cierra, y el vector que falta para cerrarlo es \(\vb b\). En una dislocación de borde, \(\vb b\) es perpendicular a la línea; en una de tornillo, paralelo. En los metales, \(\vb b\) apunta en una dirección compacta y su módulo es la distancia interatómica: \(\abs{\vb b}=a/\sqrt2\) en FCC (dirección ⟨110⟩) y \(a\sqrt3/2\) en BCC (⟨111⟩).</p>
<p>El campo de desplazamientos de una dislocación de borde recta en un medio elástico isótropo (Volterra, 1907) es</p>
<div class="eq">\[u_x=\frac{b}{2\pi}\left[\arctan\frac yx+\frac{xy}{2(1-\nu)(x^2+y^2)}\right],\quad u_y=-\frac{b}{2\pi}\left[\frac{1-2\nu}{4(1-\nu)}\ln(x^2+y^2)+\frac{x^2-y^2}{4(1-\nu)(x^2+y^2)}\right].\]</div>
<div class="sim" data-sim="edge-dislocation" data-title="Dislocación de borde: campo de Volterra, circuito de Burgers y deslizamiento"></div>
<div class="sim-guide"><ul>
<li>Trace el circuito de Burgers: el mismo número de pasos arriba, abajo, a la izquierda y a la derecha no cierra; el segmento rojo es \(\vb b\).</li>
<li>Mueva la dislocación con el control de cizalla. Al salir por el borde del cristal deja un escalón de altura \(b\): la deformación plástica es el resultado de muchísimos de estos pasos.</li>
<li>Observe la compresión arriba del plano de deslizamiento (donde está el semiplano extra) y la tracción abajo. Los átomos de soluto grandes prefieren la zona en tracción; los pequeños, la comprimida (atmósferas de Cottrell, capítulo 9).</li>
</ul></div>
<p>La densidad de dislocaciones \(\rho_\perp\), longitud total de línea por unidad de volumen, va de \(10^{9}\) m⁻² en cristales cuidadosamente recocidos a \(10^{15}\)–\(10^{16}\) m⁻² en metales muy deformados en frío. Las dislocaciones se observan con microscopía electrónica de transmisión, y su movimiento es el mecanismo de la deformación plástica de los metales (capítulo 9).</p>
</section>

<section>
<h2>Defectos de superficie y tamaño de grano</h2>
<p>Los defectos bidimensionales separan regiones del material con distinta orientación o estructura:</p>
<ul>
<li><b>Superficies externas</b>: los átomos tienen menos vecinos que en el volumen y una energía mayor, la energía superficial \(\gamma\) (J/m²).</li>
<li><b>Bordes de grano</b>: separan cristales de distinta orientación. Si la desorientación es pequeña (menos de unos 15°) el borde es un arreglo de dislocaciones (borde de bajo ángulo); si es grande, una región de unos pocos átomos de espesor con empaquetamiento imperfecto. Su energía (0.3–1 J/m² en metales) impulsa el crecimiento de grano a alta temperatura.</li>
<li><b>Maclas</b>: bordes especiales que reflejan la red como un espejo; se forman por deformación (en BCC y HCP) o por recocido (en FCC, como el latón).</li>
<li><b>Fallas de apilamiento</b>: interrupciones de la secuencia ABCABC en FCC (capítulo 3).</li>
<li><b>Bordes de fase</b>: separan fases distintas en materiales multifásicos.</li>
</ul>
<p>El <span class="term">tamaño de grano</span> controla la resistencia (ecuación de Hall–Petch, capítulo 9), la tenacidad a baja temperatura y la fluencia. La norma ASTM E112 lo expresa con un número \(G\) tal que, a 100 aumentos, hay \(n=2^{G-1}\) granos por pulgada cuadrada. Equivalentemente, a partir de los granos por mm² a 1× (\(N_A\)) o de la longitud media de intercepto \(\bar\ell\) (en mm) que un segmento recto atraviesa en cada grano:</p>
<div class="eq key" data-name="Número de tamaño de grano ASTM">\[G=3.3219\log_{10}N_A-2.954,\qquad G=-6.6439\log_{10}\bar\ell-3.288.\]</div>
<div class="sim" data-sim="grain-size" data-title="Medición del tamaño de grano por planimetría e intercepción"></div>
<div class="sim-guide"><ul>
<li>Aumente el número de granos: \(G\) sube (grano más fino). Doblar los granos por área sube \(G\) en una unidad.</li>
<li>Compare los dos métodos: dan valores parecidos pero no idénticos, porque la relación entre \(N_A\) y \(\bar\ell\) depende de la forma de los granos.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule la fracción de vacancias del aluminio (\(Q_v=0.67\) eV) a 25 °C y a 640 °C.
<details><summary>Respuesta</summary><p>A 298 K: \(4.7\times10^{-12}\). A 913 K: \(2.0\times10^{-4}\).</p></details></li>
<li><span class="lvl">Básico</span>Convierta a porcentaje atómico una aleación de 70 % Cu y 30 % Zn en peso (\(A_{\text{Cu}}=63.55\), \(A_{\text{Zn}}=65.41\)).
<details><summary>Respuesta</summary><p>Cu: 70.6 % at.; Zn: 29.4 % at.</p></details></li>
<li><span class="lvl">Intermedio</span>¿A qué temperatura la fracción de vacancias de un metal es el doble que a 800 K, si \(Q_v=1.0\) eV?
<details><summary>Respuesta</summary><p>\(1/T_2=1/800-k_B\ln2/Q_v=1.25\times10^{-3}-5.97\times10^{-5}\), \(T_2=840\) K.</p></details></li>
<li><span class="lvl">Intermedio</span>Calcule el módulo del vector de Burgers del cobre (FCC, \(a=0.3615\) nm) y del hierro α (BCC, \(a=0.2866\) nm).
<details><summary>Respuesta</summary><p>Cu: \(a/\sqrt2=0.2556\) nm. Fe: \(a\sqrt3/2=0.2482\) nm. En ambos es igual a \(2R\).</p></details></li>
<li><span class="lvl">Intermedio</span>Una micrografía a 250× muestra 30 granos en un cuadrado de 50 mm × 50 mm. Calcule \(G\).
<details><summary>Respuesta</summary><p>El cuadrado mide \(0.2\times0.2\) mm reales: \(N_A=30/0.04=750\) granos/mm². \(G=3.3219\log750-2.954=6.6\).</p></details></li>
<li><span class="lvl">Avanzado</span>Deduzca \(N_v/N=\exp(-Q_v/k_BT)\) minimizando \(G(N_v)=N_vQ_v-k_BT\ln[N!/(N_v!(N-N_v)!)]\) con la aproximación de Stirling.
<details><summary>Respuesta</summary><p>\(\partial G/\partial N_v=Q_v-k_BT\ln[(N-N_v)/N_v]=0\Rightarrow N_v/(N-N_v)=\ee^{-Q_v/k_BT}\), y con \(N_v\ll N\) se obtiene el resultado.</p></details></li>
</ol>
