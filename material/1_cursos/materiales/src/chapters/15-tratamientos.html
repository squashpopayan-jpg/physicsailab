<p class="lead">Un tratamiento térmico es una receta de temperaturas y tiempos que lleva una aleación de composición fija a la microestructura deseada. Con el mismo acero se puede obtener un material blando para conformar, uno duro para cortar o uno tenaz para un eje. Este capítulo aplica los diagramas de fase y la cinética a las recetas industriales más importantes.</p>

<section>
<h2>Procesos de recocido</h2>
<p>«Recocer» es calentar, mantener y enfriar lentamente para ablandar, homogeneizar o aliviar esfuerzos. Las variantes del acero se definen por la temperatura respecto a las líneas \(A_1\), \(A_3\) y \(A_{cm}\):</p>
<ul>
<li><b>Recocido de alivio de tensiones</b>: por debajo de \(A_1\) (500–650 °C), para eliminar esfuerzos residuales de soldadura, maquinado o enfriamiento desigual.</li>
<li><b>Recocido intermedio (de proceso)</b>: también bajo \(A_1\), para recuperar y recristalizar un metal trabajado en frío entre pasadas de conformado (capítulo 9).</li>
<li><b>Recocido completo</b>: unos 50 °C sobre \(A_3\) (hipoeutectoides) o sobre \(A_1\) (hipereutectoides) y enfriamiento en el horno: perlita gruesa, blanda y dúctil.</li>
<li><b>Normalizado</b>: unos 55 °C sobre \(A_3\) o \(A_{cm}\) y enfriamiento al aire: grano refinado y perlita fina; más resistente que el recocido completo.</li>
<li><b>Esferoidizado</b>: decenas de horas justo bajo \(A_1\) (o ciclando alrededor de ella): cementita globular en ferrita, la condición de máxima ductilidad y maquinabilidad de los aceros de medio y alto carbono.</li>
</ul>
</section>

<section>
<h2>Enfriamiento continuo: del TTT al CCT</h2>
<p>En un temple real la temperatura cae continuamente. Scheil (1935) propuso tratar el enfriamiento como una sucesión de pequeños escalones isotérmicos: cada intervalo \(\Delta t_i\) a la temperatura \(T_i\) consume una fracción \(\Delta t_i/t_s(T_i)\) del tiempo de incubación. La transformación empieza cuando</p>
<div class="eq key" data-name="Regla de aditividad de Scheil">\[\sum_i\frac{\Delta t_i}{t_s(T_i)}=1.\]</div>
<p>Aplicando esta regla al diagrama TTT del capítulo 14 se obtiene el diagrama de <span class="term">transformación en enfriamiento continuo</span> (CCT): sus curvas están desplazadas hacia tiempos más largos y temperaturas más bajas. La <span class="term">velocidad crítica de temple</span> es la mínima que evita tocar la curva de inicio y produce martensita completa. Para el acero eutectoide, el cálculo de aditividad del curso da unos 128 °C/s, a menos del 10 % del valor de 140 °C/s que reporta Callister (fig. 10.27): una validación independiente del modelo de cinética.</p>
<div class="sim" data-sim="cct" data-title="Enfriamiento continuo del acero eutectoide y velocidad crítica de temple"></div>
<div class="sim-guide"><ul>
<li>Con 200 °C/s el acero llega a \(M_s\) sin tocar la curva de inicio: martensita (más algo de austenita retenida).</li>
<li>Con 50 °C/s, parte de la austenita se transforma en perlita fina y el resto en martensita.</li>
<li>Con 1 °C/s (enfriamiento en el horno) toda la austenita se vuelve perlita gruesa.</li>
</ul></div>
<p>En los aceros al carbono eutectoides no se forma bainita en enfriamiento continuo: la perlita empieza antes. En los aceros aleados, con la nariz perlítica desplazada a la derecha, sí aparece una región bainítica en el CCT.</p>
</section>

<section>
<h2>Templabilidad y el ensayo Jominy</h2>
<p>La <span class="term">templabilidad</span> es la capacidad de un acero de formar martensita en profundidad. No es lo mismo que la dureza: la dureza máxima de la martensita depende casi solo del carbono, mientras que la templabilidad depende de los aleantes (Cr, Mo, Ni, Mn, B), que retrasan las transformaciones difusivas y permiten templar piezas gruesas con velocidades de enfriamiento menores.</p>
<p>El <span class="term">ensayo Jominy</span> (ASTM A255) la mide con una sola probeta: una barra de 25 mm de diámetro y 100 mm de largo, austenitizada, se enfría con un chorro de agua por un extremo. La velocidad de enfriamiento disminuye a lo largo de la barra, de cientos de grados por segundo en el extremo templado a unos pocos a 50 mm. La dureza medida a lo largo de una generatriz es la <span class="term">curva de templabilidad</span>.</p>
<div class="sim" data-sim="jominy" data-title="Curvas de templabilidad Jominy de aceros de 0.40 % C"></div>
<div class="sim-guide"><ul>
<li>Todos los aceros tienen la misma dureza en el extremo templado (≈ 55 HRC): la fija el carbono.</li>
<li>El 1040, sin aleantes, cae a la dureza de la perlita en pocos milímetros; el 4340 mantiene más de 50 HRC hasta 50 mm.</li>
<li>Elija una distancia y lea la velocidad de enfriamiento equivalente: así se traslada la curva Jominy al centro de una barra templada en agua o en aceite.</li>
</ul></div>
<p>La severidad del medio de temple también importa: el agua extrae calor más rápido que el aceite, y éste más que el aire; la agitación ayuda a romper la capa de vapor. Un temple severo endurece más a fondo pero aumenta las distorsiones y el riesgo de grietas, y la geometría de la pieza (secciones gruesas y delgadas, cantos vivos) agrava el problema.</p>
</section>

<section>
<h2>Revenido</h2>
<p>La martensita recién templada es demasiado frágil para casi cualquier uso. El <span class="term">revenido</span>, un calentamiento entre 150 y 650 °C, deja que el carbono salga de la martensita como partículas finísimas de cementita en una matriz de ferrita: la <span class="term">martensita revenida</span>. La dureza y la resistencia bajan, y la ductilidad y la tenacidad suben, más cuanto mayores son la temperatura y el tiempo. Ambos se combinan en el parámetro de Hollomon y Jaffe (1945):</p>
<div class="eq key" data-name="Parámetro de revenido">\[P=T\,(C+\log t),\qquad C\approx20,\ T\text{ en K},\ t\text{ en h}.\]</div>
<p>Una hora a 600 °C (\(P=17\,460\)) equivale a 16 horas a 550 °C. Entre 260 y 320 °C muchos aceros sufren la <span class="term">fragilización de la martensita revenida</span>, y entre 375 y 575 °C, en presencia de Sb, P, As o Sn, la fragilización por revenido; ambos rangos se evitan en la práctica.</p>
<div class="sim" data-sim="tempering" data-title="Dureza de la martensita revenida y equivalencia tiempo–temperatura"></div>
<div class="sim-guide"><ul>
<li>Cambie el tiempo y la temperatura: la dureza depende de la combinación \(P\), no de cada una por separado.</li>
<li>Busque la temperatura que, en 2 h, da la misma dureza que 1 h a 500 °C.</li>
</ul></div>
<p>Otras variantes evitan las grietas del temple directo: el <span class="term">martemplado</span> (temple en un baño justo sobre \(M_s\) hasta igualar la temperatura y luego enfriamiento al aire) y el <span class="term">austemplado</span> (mantener en la región bainítica hasta transformar todo en bainita).</p>
</section>

<section>
<h2>Endurecimiento por precipitación</h2>
<p>Las aleaciones de aluminio de alta resistencia (2xxx, 6xxx, 7xxx), muchas de níquel y algunos aceros inoxidables se endurecen por partículas finísimas de una segunda fase. La receta tiene tres pasos:</p>
<ol>
<li><b>Solubilizado</b>: calentar en el campo monofásico (Al–4 % Cu a unos 540 °C) para disolver todo el soluto.</li>
<li><b>Temple</b>: enfriar rápido para retener una solución sólida sobresaturada.</li>
<li><b>Envejecimiento</b>: mantener a temperatura moderada (o ambiente, envejecimiento natural) para que precipiten partículas: zonas de Guinier–Preston, luego fases θ″ y θ′ coherentes o semicoherentes, y finalmente la fase de equilibrio θ (CuAl₂).</li>
</ol>
<p>La resistencia pasa por un máximo. Mientras las partículas son pequeñas, las dislocaciones las cortan, y la resistencia crece con su tamaño (\(\Delta\tau\propto\sqrt{fr}\)). Cuando son grandes, las dislocaciones las rodean (mecanismo de Orowan) y la resistencia cae con la distancia entre ellas (\(\Delta\tau\propto\sqrt f/r\)). El máximo está en el radio de transición. Pasado ese punto, la aleación está <span class="term">sobreenvejecida</span>: las partículas siguen creciendo por maduración de Ostwald (\(r^3-r_0^3\propto t\)) y la aleación se ablanda.</p>
<div class="sim" data-sim="precipitation" data-title="Curvas de envejecimiento de una aleación Al–Cu"></div>
<div class="sim-guide"><ul>
<li>A mayor temperatura de envejecimiento, el máximo llega antes pero es más bajo (la fracción de equilibrio de precipitados es menor).</li>
<li>Observe en la gráfica de radios dónde se cruzan los mecanismos de corte y de Orowan: ese es el envejecimiento máximo (temple T6).</li>
<li>Un remache de 2017 se mantiene en el congelador hasta el momento de instalarlo para retrasar el envejecimiento natural.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿A qué temperatura se normaliza un acero de 0.40 % C? (\(A_3\approx810\) °C.)
<details><summary>Respuesta</summary><p>Unos 55 °C sobre \(A_3\): ≈ 865 °C.</p></details></li>
<li><span class="lvl">Básico</span>Calcule el parámetro de Hollomon–Jaffe para 1 h a 200, 400 y 600 °C.
<details><summary>Respuesta</summary><p>9463, 13 463 y 17 463.</p></details></li>
<li><span class="lvl">Intermedio</span>Un revenido de 1 h a 600 °C debe hacerse a 550 °C por limitaciones del horno. ¿Cuánto tiempo hace falta?
<details><summary>Respuesta</summary><p>\(\log t=17463/823.15-20=1.215\Rightarrow t=16.4\) h.</p></details></li>
<li><span class="lvl">Intermedio</span>Explique por qué dos aceros 1040 y 4340 tienen la misma dureza en el extremo templado de la probeta Jominy.
<details><summary>Respuesta</summary><p>Ambos tienen 0.40 % C y, en el extremo, se enfrían lo bastante rápido como para formar martensita completa. La dureza de la martensita depende del carbono, no de los aleantes.</p></details></li>
<li><span class="lvl">Intermedio</span>Con la regla de Scheil, ¿por qué el inicio de la transformación en enfriamiento continuo ocurre a una temperatura menor que la de la nariz del TTT?
<details><summary>Respuesta</summary><p>Porque mientras la pieza pasa por temperaturas altas, donde \(t_s\) es largo, la suma avanza muy poco; la mayor parte del «consumo» ocurre cerca de la nariz y debajo de ella. El inicio llega más tarde y más frío que la curva isotérmica.</p></details></li>
<li><span class="lvl">Avanzado</span>Con \(\Delta\tau_{\text{corte}}=A\sqrt{fr}\) y \(\Delta\tau_{\text{Orowan}}=B\sqrt f/r\), demuestre que la resistencia máxima ocurre en \(r_c=(B/A)^{2/3}\) y que no depende de \(f\).
<details><summary>Respuesta</summary><p>La resistencia efectiva es el mínimo de las dos. Igualándolas: \(A\sqrt{fr}=B\sqrt f/r\Rightarrow r^{3/2}=B/A\Rightarrow r_c=(B/A)^{2/3}\). La fracción \(f\) aparece en ambos lados y se cancela; sí determina la altura del máximo, \(\propto\sqrt f\).</p></details></li>
</ol>
