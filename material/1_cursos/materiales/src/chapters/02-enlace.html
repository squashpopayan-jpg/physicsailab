<template class="chapter-src" data-id="enlace" data-num="2" data-title="Estructura atómica y enlace" data-part="Parte I · Fundamentos" data-short="Electrones y tabla periódica, fuerzas y energías de enlace, potenciales de Lennard-Jones y Morse, enlaces primarios y secundarios, y cómo la curva de energía fija el módulo, la temperatura de fusión y la expansión térmica">
<p class="lead">Las propiedades de un sólido empiezan en la forma en que sus átomos se atraen y se repelen. Una sola curva, la energía de un par de átomos en función de su separación, contiene la distancia interatómica, la energía de cohesión, la rigidez y la expansión térmica. Este capítulo construye esa curva y aprende a leerla.</p>

<section>
<h2>Electrones y tabla periódica</h2>
<p>El comportamiento químico de un átomo lo deciden sus electrones de valencia, los de la capa más externa ocupada. La mecánica cuántica asigna a cada electrón cuatro números cuánticos: el principal \(n\) (capa: K, L, M…), el azimutal \(l\) (subcapa s, p, d, f, con \(2l+1\) orbitales), el magnético \(m_l\) y el de espín \(m_s=\pm\tfrac12\). El principio de exclusión de Pauli limita cada orbital a dos electrones de espín opuesto, y el llenado sigue aproximadamente el orden 1s, 2s, 2p, 3s, 3p, 4s, 3d, 4p…</p>

<tr><th>Elemento</th><th class="c">Z</th><th>Configuración</th><th>Comportamiento</th></tr>
<tr><td>Na</td><td class="c">11</td><td>\(1s^22s^22p^63s^1\)</td><td>Cede un electrón (electropositivo)</td></tr>
<tr><td>Cl</td><td class="c">17</td><td>\(1s^22s^22p^63s^23p^5\)</td><td>Acepta un electrón (electronegativo)</td></tr>

<tr><td>Fe</td><td class="c">26</td><td>\(1s^22s^22p^63s^23p^63d^64s^2\)</td><td>Metal de transición; la capa 3d incompleta da el magnetismo</td></tr>

</table></div>
<p>La <span class="term">electronegatividad</span> mide la tendencia de un átomo a atraer los electrones de un enlace. En la escala de Pauling va de 0.7 (Cs, Fr) a 4.0 (F) y crece hacia la derecha y hacia arriba en la tabla periódica. La diferencia de electronegatividad entre dos átomos decide, en buena medida, qué tipo de enlace forman.</p>
</section>

<section>
<h2>Fuerzas y energías de enlace</h2>
<p>Considere dos átomos aislados que se acercan. A distancias grandes no interactúan; al acercarse aparece una fuerza atractiva \(F_A\) cuyo origen depende del tipo de enlace, y a distancias cortas domina una fuerza repulsiva \(F_R\) debida a la superposición de las capas electrónicas internas (principio de Pauli). La fuerza neta \(F_N=F_A+F_R\) se anula en la <span class="term">distancia de equilibrio</span> \(r_0\), que en la mayoría de los átomos es de unos 0.3 nm.</p>
<p>Como la fuerza es menos el gradiente de la energía, la energía de interacción es</p>
<div class="eq key" data-name="Energía y fuerza de un par">\[E_N(r)=\int_r^{\infty}F_N\,\dd r=E_A+E_R,\qquad F_N=-\odv{E_N}{r},\qquad F_N(r_0)=0\iff \left.\odv{E_N}{r}\right|_{r_0}=0.\]</div>
<p>El mínimo de la curva, \(E_0=E_N(r_0)\), es la <span class="term">energía de enlace</span>: la energía necesaria para separar los dos átomos hasta el infinito. De la forma del pozo se leen tres propiedades:</p>
<ul>
<li><b>Profundidad</b> \(\abs{E_0}\): energía de cohesión. Pozos profundos significan temperaturas de fusión altas.</li>
<li><b>Curvatura</b> \(E_N''(r_0)\): rigidez del enlace. Para pequeños desplazamientos el par se comporta como un resorte de constante \(k=E_N''(r_0)\), y el módulo de Young es del orden de \(E\sim k/r_0\).</li>
<li><b>Asimetría</b>: la rama repulsiva es más empinada que la atractiva. Al vibrar con más energía, el átomo pasa más tiempo del lado de \(r\) grande, y la separación media crece: es la <span class="term">expansión térmica</span>.</li>
</ul>
<h3>Dos potenciales modelo</h3>
<p>El potencial de Lennard-Jones describe bien los enlaces de van der Waals (gases nobles, moléculas no polares):</p>
<div class="eq key" data-name="Potencial de Lennard-Jones">\[E(r)=4\varepsilon\left[\left(\frac{\sigma}{r}\right)^{12}-\left(\frac{\sigma}{r}\right)^{6}\right],\qquad r_0=2^{1/6}\sigma,\qquad E_0=-\varepsilon,\qquad k=\frac{72\varepsilon}{r_0^2}.\]</div>
<p>El de Morse, con tres parámetros independientes, se usa para enlaces covalentes y como potencial de par en metales (Girifalco y Weizer, 1959):</p>
<div class="eq key" data-name="Potencial de Morse">\[E(r)=D\left[\left(1-\ee^{-a(r-r_0)}\right)^2-1\right],\qquad k=2Da^2,\qquad F_{\max}=\frac{Da}{2}\ \text{en}\ r=r_0+\frac{\ln2}{a}.\]</div>
<p>La fuerza máxima \(F_{\max}\) es la resistencia teórica del enlace: la tensión necesaria para romperlo. El capítulo 10 mostrará que los materiales reales fallan a esfuerzos cien o mil veces menores que el teórico, y explicará por qué.</p>
<div class="sim" data-sim="bond-curves" data-title="Energía y fuerza de un par de átomos"></div>
<div class="sim-guide"><ul>
<li>Con Lennard-Jones, duplique \(\varepsilon\): el pozo se hace el doble de hondo y la rigidez se duplica, pero \(r_0\) no cambia.</li>
<li>Con Morse, aumente \(a\) manteniendo \(D\): el pozo se angosta, la rigidez crece como \(a^2\) y la fuerza máxima como \(a\).</li>
<li>Elija los pares de Cu, Al, Fe y Pb de Girifalco y Weizer y compare la estimación \(E\sim k/r_0\) con el módulo medido. ¿Respeta el orden?</li>
</ul></div>
<div class="box warn"><h4>Un par no es un cristal</h4><p>En un sólido cada átomo interactúa con muchos vecinos, y la rigidez macroscópica es una suma geométrica de las rigideces de los pares. La estimación \(E\sim k/r_0\) solo acierta en el orden de magnitud y en la tendencia entre materiales; el cálculo correcto suma sobre la red y, en metales, necesita potenciales de muchos cuerpos.</p></div>
</section>

<section>
<h2>El enlace iónico</h2>
<p>Cuando la diferencia de electronegatividad es grande, un átomo cede electrones al otro y ambos quedan con capas completas. Los iones resultantes se atraen por la ley de Coulomb:</p>
<div class="eq">\[E_A=-\frac{(Z_1e)(Z_2e)}{4\pi\varepsilon_0r}=-\frac Ar,\qquad E_R=\frac{B}{r^n},\qquad n\approx 7\text{–}12.\]</div>
<p>Con \(Z_1=Z_2=1\), \(A=e^2/4\pi\varepsilon_0=1.440\) eV·nm. Derivando e igualando a cero,</p>
<div class="eq">\[r_0=\left(\frac{nB}{A}\right)^{1/(n-1)},\qquad E_0=-\frac{A}{r_0}\left(1-\frac1n\right).\]</div>
<p>El enlace iónico no es direccional: cada ion se rodea del mayor número posible de iones de signo contrario que quepan, respetando la neutralidad. Por eso las estructuras de los cerámicos iónicos (capítulo 3) se deciden por el cociente de radios. Los materiales iónicos son duros, frágiles y aislantes, y tienen temperaturas de fusión altas.</p>
<div class="sim" data-sim="ionic-pair" data-title="Par iónico: atracción de Coulomb y repulsión de Born"></div>
<div class="sim-guide"><ul>
<li>Con los valores iniciales (\(A=1.436\) eV·nm, \(B=7.32\times10^{-6}\) eV·nm⁸, \(n=8\)) compruebe \(r_0=0.236\) nm y \(E_0=-5.32\) eV.</li>
<li>Pase a cargas \(\pm2\) (como en MgO): \(A\) se cuadruplica. El enlace es más corto y mucho más fuerte, lo que explica que el MgO funda a 2852 °C y el NaCl a 801 °C.</li>
</ul></div>
<div class="box ex"><h4>Distancia y energía de un par iónico</h4>
<p>Para un par de iones monovalentes con \(E_A=-1.436/r\) y \(E_R=7.32\times10^{-6}/r^8\) (energías en eV y \(r\) en nm), halle \(r_0\) y \(E_0\).</p>
<details><summary>Solución</summary><p>\(\odv{E_N}{r}=1.436/r^2-8(7.32\times10^{-6})/r^9=0\Rightarrow r_0^7=8(7.32\times10^{-6})/1.436=4.078\times10^{-5}\), así que \(r_0=0.236\) nm. Entonces \(E_0=-1.436/0.236+7.32\times10^{-6}/0.236^8=-6.08+0.76=-5.32\) eV. Note que la repulsión aporta exactamente \(1/n\) de la atracción en el equilibrio.</p></details>
</div>
</section>

<section>
<h2>Enlaces covalente, metálico y secundarios</h2>
<h3>Covalente</h3>
<p>Entre átomos de electronegatividad parecida y alta, los electrones se comparten. El enlace es <span class="term">direccional</span>: el carbono con hibridación \(sp^3\) forma cuatro enlaces a 109.5° (diamante), y con \(sp^2\) tres enlaces planos a 120° (grafito, grafeno). La direccionalidad impide que los planos atómicos deslicen con facilidad, por eso los sólidos covalentes son duros y frágiles. Las energías van de muy grandes (diamante, 7.4 eV/átomo de cohesión) a moderadas (bismuto).</p>
<h3>Metálico</h3>
<p>En los metales, los electrones de valencia (uno a tres por átomo) se deslocalizan y forman un «mar» que rodea a los núcleos iónicos y los mantiene unidos. El enlace no es direccional; los iones se apilan de forma compacta, y los electrones libres explican la alta conductividad eléctrica y térmica, el brillo y la ductilidad.</p>
<h3>Secundarios (de van der Waals)</h3>
<p>Entre moléculas o átomos con capas cerradas actúan fuerzas mucho más débiles, del orden de 0.1 eV o menos, debidas a dipolos eléctricos: dipolos inducidos fluctuantes (fuerzas de dispersión de London, las únicas en gases nobles), dipolos permanentes (moléculas polares como HCl) y el <span class="term">puente de hidrógeno</span>, el más fuerte de los secundarios (hasta 0.5 eV), entre un H unido a F, O o N y un átomo electronegativo vecino. Los enlaces secundarios unen las cadenas de los polímeros y las capas del grafito, y explican la anomalía del agua.</p>

<h3>¿Cuánto de iónico tiene un enlace?</h3>
<p>Casi ningún enlace es puramente de un tipo. Pauling propuso estimar el carácter iónico a partir de las electronegatividades \(X_A\) y \(X_B\):</p>
<div class="eq key" data-name="Carácter iónico de Pauling">\[\%\,\text{CI}=\left\{1-\exp\!\left[-0.25\,(X_A-X_B)^2\right]\right\}\times100.\]</div>
<div class="sim" data-sim="bond-triangle" data-title="Triángulo de van Arkel–Ketelaar: tipo de enlace a partir de la electronegatividad"></div>
<div class="sim-guide"><ul>
<li>Recorra la base del triángulo con pares de metales (Cu–Zn, Fe–Ni): enlace metálico. Suba hacia la derecha con Si–C y C–C: covalente. Vaya a la cima con Na–Cl, Mg–O y Cs–F: iónico.</li>
<li>Compare Si–O (en la sílice) con Ga–As: ambos son mixtos, pero en proporciones muy distintas.</li>
</ul></div>
</section>

<section>
<h2>La expansión térmica nace de la asimetría</h2>
<p>A temperatura \(T\) los átomos vibran alrededor de \(r_0\) con energía media del orden de \(k_BT\). Si el pozo fuera una parábola, la vibración sería simétrica y la distancia media seguiría siendo \(r_0\): no habría expansión. Desarrollando el potencial hasta tercer orden, \(E\approx E_0+\tfrac12kx^2-gx^3\) con \(x=r-r_0\), la mecánica estadística clásica da</p>
<div class="eq key" data-name="Expansión térmica de un par anarmónico">\[\langle x\rangle=\frac{3g\,k_BT}{k^2}\quad\Rightarrow\quad \alpha_\ell=\frac{1}{r_0}\odv{\langle x\rangle}{T}=\frac{3g\,k_B}{k^2r_0}.\]</div>
<p>Para Morse, \(k=2Da^2\) y \(g=Da^3\), y resulta \(\alpha_\ell=3k_B/(4Dar_0)\): la expansión es grande en pozos poco profundos (\(D\) pequeño), y por eso los materiales de baja temperatura de fusión se dilatan más. Es la correlación empírica entre \(\alpha\) y \(1/T_f\) que se observa en los metales.</p>
<div class="sim" data-sim="anharmonic-expansion" data-title="Vibración térmica en un pozo de Morse y desplazamiento del centro"></div>
<div class="sim-guide"><ul>
<li>Suba la temperatura y observe que el segmento horizontal (los puntos de retorno a energía \(k_BT\)) se alarga más hacia la derecha que hacia la izquierda; su punto medio se desplaza.</li>
<li>Compare el \(\alpha\) calculado por promedio de Boltzmann con la fórmula de primer orden: coinciden a baja \(T\) y se separan cerca de la disociación.</li>
<li>Con el par de Cu el modelo da \(\alpha\approx4.8\times10^{-5}\) K⁻¹, tres veces el valor medido (\(17\times10^{-6}\) K⁻¹): otra vez, un par no es un cristal.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Escriba la configuración electrónica de \(\text{Fe}^{2+}\), \(\text{Fe}^{3+}\), \(\text{Cu}^{+}\) y \(\text{O}^{2-}\).
<details><summary>Respuesta</summary><p>\(\text{Fe}^{2+}\): [Ar]\(3d^6\); \(\text{Fe}^{3+}\): [Ar]\(3d^5\); \(\text{Cu}^{+}\): [Ar]\(3d^{10}\); \(\text{O}^{2-}\): \(1s^22s^22p^6\) (los metales de transición pierden primero los electrones 4s).</p></details></li>
<li><span class="lvl">Básico</span>Calcule el carácter iónico de los enlaces Mg–O (1.31 y 3.44), Si–O (1.90 y 3.44) y Ga–As (1.81 y 2.18).
<details><summary>Respuesta</summary><p>Mg–O: 67.8 %; Si–O: 44.7 %; Ga–As: 3.4 %.</p></details></li>
<li><span class="lvl">Intermedio</span>Para el potencial de Lennard-Jones del argón (\(\varepsilon=0.0104\) eV, \(\sigma=0.340\) nm), halle \(r_0\), la constante \(k\) y la frecuencia de vibración de un par (masa reducida \(\mu=m_{\text{Ar}}/2\), \(m_{\text{Ar}}=39.95\) u).
<details><summary>Respuesta</summary><p>\(r_0=0.382\) nm; \(k=72\varepsilon/r_0^2=0.82\) N/m; \(\omega=\sqrt{k/\mu}=\sqrt{0.82/(3.32\times10^{-26})}=4.97\times10^{12}\) rad/s, \(f\approx0.79\) THz.</p></details></li>
<li><span class="lvl">Intermedio</span>Demuestre que en el equilibrio de un par iónico \(E_R(r_0)=-E_A(r_0)/n\) y obtenga la expresión de \(E_0\).
<details><summary>Respuesta</summary><p>De \(A/r_0^2=nB/r_0^{n+1}\) se sigue \(B/r_0^n=A/(nr_0)\), es decir \(E_R=-E_A/n\). Entonces \(E_0=E_A(1-1/n)=-(A/r_0)(1-1/n)\).</p></details></li>
<li><span class="lvl">Intermedio</span>Para el par de Morse del cobre (\(D=0.3429\) eV, \(a=13.588\) nm⁻¹, \(r_0=0.2866\) nm), calcule la fuerza máxima y estime un «esfuerzo teórico» dividiéndola entre \(r_0^2\).
<details><summary>Respuesta</summary><p>\(F_{\max}=Da/2=(0.3429)(1.602\times10^{-19})(1.3588\times10^{10})/2=3.73\times10^{-10}\) N; \(\sigma\approx F_{\max}/r_0^2=4.5\) GPa. El cobre recocido fluye a unos 70 MPa: sesenta veces menos (capítulo 9).</p></details></li>
<li><span class="lvl">Avanzado</span>Deduzca \(\langle x\rangle=3gk_BT/k^2\) a partir de \(\langle x\rangle=\int x\,\ee^{-E/k_BT}\dd x\big/\int\ee^{-E/k_BT}\dd x\), desarrollando \(\ee^{gx^3/k_BT}\approx1+gx^3/k_BT\).
<details><summary>Respuesta</summary><p>El numerador es \(\int x(1+gx^3/k_BT)\ee^{-kx^2/2k_BT}\dd x=(g/k_BT)\langle x^4\rangle_0Z_0\) y el denominador \(Z_0\). Con la gaussiana, \(\langle x^4\rangle_0=3(k_BT/k)^2\), así que \(\langle x\rangle=3gk_BT/k^2\).</p></details></li>
</ol>
