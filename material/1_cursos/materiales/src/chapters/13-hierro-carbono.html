<template class="chapter-src" data-id="hierro-carbono" data-num="13" data-title="El sistema hierro–carbono" data-part="Parte IV · Fases y transformaciones" data-short="Fases del hierro, el diagrama Fe–Fe₃C, la reacción eutectoide y la perlita, aceros hipo e hipereutectoides, cálculo de microconstituyentes, fundiciones, influencia de los aleantes y soldabilidad">
<p class="lead">El acero es el material de ingeniería más usado del mundo: se producen unos 1900 millones de toneladas al año. Su versatilidad nace de un hecho del diagrama de fase: la austenita disuelve cien veces más carbono que la ferrita. Al enfriarla, ese carbono tiene que salir, y la forma en que sale decide todas las propiedades. Este capítulo lee el diagrama en equilibrio; el siguiente añade el tiempo.</p>

<section>
<h2>Las fases del sistema</h2>
<p>El hierro puro es alotrópico (capítulo 3): BCC (α, ferrita) hasta 912 °C, FCC (γ, austenita) hasta 1394 °C, BCC de nuevo (δ) hasta la fusión a 1538 °C. El carbono se disuelve intersticialmente en las tres, en cantidades muy distintas, y por encima del límite forma el carburo de hierro, la <span class="term">cementita</span> (Fe₃C, 6.70 % en peso de C), ortorrómbica, dura y frágil.</p>
<div class="tablewrap"><table>
<tr><th>Fase</th><th>Estructura</th><th class="c">Solubilidad máxima de C</th><th>Propiedades</th></tr>
<tr><td>Ferrita α</td><td>BCC</td><td class="c">0.022 % a 727 °C</td><td>Blanda, dúctil, magnética por debajo de 768 °C</td></tr>
<tr><td>Austenita γ</td><td>FCC</td><td class="c">2.14 % a 1147 °C</td><td>Blanda, dúctil, no magnética; no es estable bajo 727 °C en aceros al carbono</td></tr>
<tr><td>Ferrita δ</td><td>BCC</td><td class="c">0.09 % a 1493 °C</td><td>Solo a muy alta temperatura</td></tr>
<tr><td>Cementita Fe₃C</td><td>Ortorrómbica</td><td class="c">6.70 % (compuesto)</td><td>Muy dura (≈ 800 HV) y frágil</td></tr>
</table></div>
<p>Estrictamente, la cementita es metaestable: con tiempo suficiente a alta temperatura se descompone en ferrita y grafito, y el diagrama estable es Fe–C (grafito). Para los aceros, la cinética es tan lenta que el diagrama Fe–Fe₃C es el que manda; para las fundiciones con silicio, no.</p>
</section>

<section>
<h2>El diagrama Fe–Fe₃C</h2>
<p>Tres reacciones invariantes organizan el diagrama:</p>
<ul>
<li><b>Peritéctica</b> a 1493 °C: \(L(0.53\,\%)+\delta(0.09\,\%)\to\gamma(0.17\,\%)\). Importa en la solidificación de los aceros de bajo carbono.</li>
<li><b>Eutéctica</b> a 1147 °C: \(L(4.30\,\%)\to\gamma(2.14\,\%)+\text{Fe}_3\text{C}(6.70\,\%)\). Su producto, la <span class="term">ledeburita</span>, aparece en las fundiciones blancas.</li>
<li><b>Eutectoide</b> a 727 °C: \(\gamma(0.76\,\%)\to\alpha(0.022\,\%)+\text{Fe}_3\text{C}(6.70\,\%)\). Es la reacción más importante de la metalurgia.</li>
</ul>
<p>Las líneas tienen nombres tradicionales: \(A_1\) es la isoterma eutectoide (727 °C), \(A_3\) la frontera entre γ y α+γ (de 912 °C a 727 °C) y \(A_{cm}\) la frontera entre γ y γ+Fe₃C. Los <span class="term">aceros</span> tienen menos de 2.14 % C (en la práctica, menos de 1 %); las <span class="term">fundiciones</span>, entre 2.14 y 6.70 % (en la práctica, entre 3 y 4.5 %).</p>
<div class="sim" data-sim="fec-diagram" data-title="Diagrama Fe–Fe₃C completo con regla de la palanca"></div>
<div class="sim-guide"><ul>
<li>Arrastre el punto a 0.35 % C y 726 °C: α 0.95 y Fe₃C 0.05 (Callister, ej. 9.5).</li>
<li>Recorra la isoterma de 1000 °C: austenita hasta la línea \(A_{cm}\) (unos 1.67 % C), luego γ + Fe₃C.</li>
<li>Visite la esquina de alta temperatura: allí están la ferrita δ y la reacción peritéctica.</li>
</ul></div>
</section>

<section>
<h2>La reacción eutectoide y la perlita</h2>
<p>Un acero de 0.76 % C enfriado lentamente desde la región γ llega a 727 °C sin cambios. Allí la austenita se transforma en <span class="term">perlita</span>: colonias de láminas alternadas de ferrita y cementita que crecen desde los bordes de grano de la austenita. La forma laminar resuelve un problema de difusión: el carbono debe pasar de 0.76 % a 0.022 % en la ferrita y a 6.70 % en la cementita, y la manera más rápida es redistribuirlo a lo largo de distancias cortas, del orden del espaciado entre láminas.</p>
<p>La palanca entre 0.022 y 6.70 % da la proporción de las fases dentro de la perlita:</p>
<div class="eq">\[W_\alpha=\frac{6.70-0.76}{6.70-0.022}=0.89,\qquad W_{\text{Fe}_3\text{C}}=0.11.\]</div>
<p>Como las densidades son parecidas (7.87 y 7.69 g/cm³), las láminas de ferrita son unas ocho veces más gruesas que las de cementita. El espaciado interlaminar disminuye al aumentar el subenfriamiento (Zener: \(\lambda\propto1/\Delta T\)): la perlita fina, formada cerca de 600 °C, es más dura y resistente que la gruesa, formada cerca de 727 °C.</p>
<div class="sim" data-sim="pearlite-growth" data-title="Crecimiento de una colonia de perlita"></div>
<div class="sim-guide"><ul>
<li>Observe el flujo de carbono (flechas) desde el frente de la ferrita, que lo rechaza, hacia la punta de la cementita, que lo absorbe.</li>
<li>Aumente el subenfriamiento: el espaciado se reduce y la colonia avanza más rápido.</li>
</ul></div>
</section>

<section>
<h2>Aceros hipoeutectoides e hipereutectoides</h2>
<p>Un acero de menos de 0.76 % C (<span class="term">hipoeutectoide</span>) que se enfría lentamente forma primero <span class="term">ferrita proeutectoide</span> en los bordes de grano de la austenita, al cruzar la línea \(A_3\). La austenita restante se enriquece en carbono siguiendo \(A_3\) hasta que, a 727 °C, tiene 0.76 % y se transforma en perlita. Justo bajo la eutectoide, las fracciones de microconstituyentes son</p>
<div class="eq key" data-name="Microconstituyentes de un acero hipoeutectoide">\[W_p=\frac{C_0-0.022}{0.76-0.022},\qquad W_{\alpha'}=\frac{0.76-C_0}{0.76-0.022}.\]</div>
<p>Uno de más de 0.76 % (<span class="term">hipereutectoide</span>) forma <span class="term">cementita proeutectoide</span>, una red continua en los bordes de grano que fragiliza el acero si no se controla:</p>
<div class="eq">\[W_p=\frac{6.70-C_0}{6.70-0.76},\qquad W_{\text{Fe}_3\text{C}'}=\frac{C_0-0.76}{6.70-0.76}.\]</div>
<p>Al revés, conociendo la fracción de perlita en una micrografía se puede estimar el carbono de un acero desconocido: es un método rápido de control en el taller.</p>
<div class="sim" data-sim="steel-micro" data-title="Microestructura de un acero al carbono enfriado lentamente"></div>
<div class="sim-guide"><ul>
<li>Baje la temperatura de un acero de 0.40 % C: la ferrita proeutectoide aparece al cruzar \(A_3\) (unos 810 °C) y la perlita a 727 °C. Al final, 49 % de ferrita proeutectoide y 51 % de perlita.</li>
<li>Pase a 1.2 % C: la red de cementita proeutectoide aparece al cruzar \(A_{cm}\).</li>
<li>Note que la ferrita total (proeutectoide más la de la perlita) siempre es mayor que la proeutectoide sola.</li>
</ul></div>
<div class="box ex"><h4>Fracciones en un acero de 0.35 % C</h4>
<p>Para un acero de 0.35 % C enfriado lentamente, calcule justo bajo 727 °C las fracciones de ferrita proeutectoide, perlita, ferrita total y cementita (Callister, ej. 9.5).</p>
<details><summary>Solución</summary><p>\(W_{\alpha'}=(0.76-0.35)/(0.76-0.022)=0.56\); \(W_p=0.44\). Fases: \(W_\alpha=(6.70-0.35)/(6.70-0.022)=0.95\); \(W_{\text{Fe}_3\text{C}}=0.05\). La ferrita de la perlita es \(0.95-0.56=0.39\).</p></details>
</div>
</section>

<section>
<h2>Fundiciones</h2>
<p>Con más de 2.14 % C, la solidificación termina en la eutéctica a 1147 °C. Según la velocidad de enfriamiento y el contenido de silicio (que estabiliza el grafito), el carbono queda como cementita o como grafito:</p>
<ul>
<li><b>Gris</b>: hojuelas de grafito en matriz de ferrita o perlita. Débil y frágil en tracción (las hojuelas actúan como grietas), pero excelente en compresión, amortiguamiento de vibraciones y maquinabilidad. Bloques de motor, bancadas.</li>
<li><b>Dúctil (nodular)</b>: con Mg o Ce el grafito crece en esferas. Resistencia y ductilidad cercanas a las de un acero. Cigüeñales, tuberías.</li>
<li><b>Blanca</b>: el carbono queda como cementita; muy dura y frágil. Superficies de desgaste.</li>
<li><b>Maleable</b>: fundición blanca recocida, en la que la cementita se descompone en nódulos irregulares de grafito.</li>
</ul>
</section>

<section>
<h2>Elementos de aleación y soldabilidad</h2>
<p>Los aleantes desplazan las líneas del diagrama. Los que estabilizan la austenita (Ni, Mn, C, N) bajan la temperatura eutectoide y, en cantidad suficiente, hacen austenítico al acero a temperatura ambiente (los inoxidables 304 tienen 8 % Ni y 18 % Cr). Los que estabilizan la ferrita (Cr, Mo, Si, W, Ti, V) la suben. Casi todos bajan el carbono eutectoide. Más importante aún, los aleantes retrasan las transformaciones controladas por difusión, lo que permite templar piezas gruesas (capítulos 14 y 15).</p>
<p>La contrapartida es la soldabilidad: los aceros que se templan fácilmente forman martensita frágil en la zona afectada por el calor de una soldadura y se agrietan. El riesgo se resume con el carbono equivalente del IIW,</p>
<div class="eq">\[\text{CE}=C+\frac{Mn}6+\frac{Cr+Mo+V}5+\frac{Ni+Cu}{15},\]</div>
<p>con todas las concentraciones en % en peso. Por debajo de 0.40 el acero suele soldarse sin precauciones; por encima de 0.45–0.50 requiere precalentamiento y control del hidrógeno.</p>
<div class="sim" data-sim="carbon-equivalent" data-title="Carbono equivalente y soldabilidad"></div>
<div class="sim-guide"><ul>
<li>Un acero estructural (0.20 C, 1.2 Mn) da CE ≈ 0.40: buena soldabilidad.</li>
<li>Un 4140 (0.40 C, 0.9 Mn, 1.0 Cr, 0.2 Mo) llega a 0.79: hace falta precalentar a 200–300 °C.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule las fracciones de ferrita y cementita en la perlita.
<details><summary>Respuesta</summary><p>\(W_\alpha=0.889\), \(W_{\text{Fe}_3\text{C}}=0.111\).</p></details></li>
<li><span class="lvl">Básico</span>Un acero tiene 75 % de ferrita proeutectoide. ¿Cuánto carbono contiene?
<details><summary>Respuesta</summary><p>\(0.75=(0.76-C_0)/0.738\Rightarrow C_0=0.21\) %.</p></details></li>
<li><span class="lvl">Intermedio</span>Para un acero de 1.2 % C enfriado lentamente, calcule la fracción de cementita proeutectoide, de perlita y de cementita total.
<details><summary>Respuesta</summary><p>Fe₃C′: \((1.2-0.76)/5.94=0.074\); perlita: 0.926; Fe₃C total: \((1.2-0.022)/6.678=0.176\).</p></details></li>
<li><span class="lvl">Intermedio</span>Un acero contiene 5 % de cementita proeutectoide. ¿Cuál es su contenido de carbono?
<details><summary>Respuesta</summary><p>\(C_0=0.76+0.05(5.94)=1.06\) %.</p></details></li>
<li><span class="lvl">Intermedio</span>¿Es posible un acero con \(W_{\alpha'}=0.70\) y \(W_{\text{Fe}_3\text{C}}=0.04\)? Justifique.
<details><summary>Respuesta</summary><p>De \(W_{\alpha'}=0.70\): \(C_0=0.76-0.70(0.738)=0.243\) %. Entonces \(W_{\text{Fe}_3\text{C}}=(0.243-0.022)/6.678=0.033\), no 0.04. Las dos fracciones no son compatibles.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que, para un acero hipoeutectoide, la ferrita contenida en la perlita es \(0.889\,W_p\) y verifique que \(W_{\alpha'}+0.889W_p=W_\alpha\) para \(C_0=0.40\).
<details><summary>Respuesta</summary><p>La perlita tiene composición fija 0.76 % y dentro de ella la palanca da 0.889 de ferrita. Para 0.40 %: \(W_{\alpha'}=0.488\), \(W_p=0.512\), \(0.488+0.889(0.512)=0.943\), y \(W_\alpha=(6.70-0.40)/6.678=0.943\).</p></details></li>
</ol>
