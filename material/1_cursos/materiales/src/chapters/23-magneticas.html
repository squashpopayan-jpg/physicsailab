<p class="lead">El magnetismo de los materiales es un fenómeno cuántico visible a simple vista: el espín de los electrones, combinado con una interacción de intercambio sin análogo clásico, alinea \(10^{23}\) momentos atómicos y produce imanes. Transformadores, motores, discos duros, resonancia magnética y la levitación de trenes dependen de controlar ese orden con la microestructura.</p>

<section>
<h2>Campo, inducción y magnetización</h2>
<p>Un campo magnético \(\vb H\) (A/m), producido por corrientes, actúa sobre un material y lo magnetiza: \(\vb M\) es el momento magnético por unidad de volumen. La inducción resultante es</p>
<div class="eq key" data-name="Inducción magnética">\[\vb B=\mu_0(\vb H+\vb M)=\mu_0\mu_r\vb H,\qquad \vb M=\chi_m\vb H,\qquad \mu_r=1+\chi_m,\]</div>
<p>con \(\mu_0=4\pi\times10^{-7}\) H/m. La susceptibilidad \(\chi_m\) clasifica los materiales: negativa y diminuta (≈ \(-10^{-5}\)) en los diamagnéticos, positiva y pequeña (\(10^{-5}\)–\(10^{-3}\)) en los paramagnéticos, y enorme y no lineal (hasta \(10^6\)) en los ferro y ferrimagnéticos.</p>
<p>El momento magnético de un átomo viene del momento orbital de los electrones y, sobre todo, de su espín. La unidad natural es el magnetón de Bohr, \(\mu_B=e\hbar/2m_e=9.27\times10^{-24}\) A·m². En las capas llenas los momentos se cancelan; solo contribuyen los electrones desapareados. En los metales de transición 3d, el orbital queda bloqueado por el campo cristalino y el momento es casi de espín: \(\mu=2\sqrt{S(S+1)}\,\mu_B\) para el ion libre, y en el sólido el momento por átomo saturado es de 2.22 \(\mu_B\) en Fe, 1.72 en Co y 0.60 en Ni.</p>
<div class="box ex"><h4>Magnetización de saturación del níquel</h4>
<p>Con 0.60 \(\mu_B\) por átomo, densidad 8.90 g/cm³ y \(A=58.69\) g/mol, calcule \(M_s\) del níquel (Callister, ej. 20.1).</p>
<details><summary>Solución</summary><p>\(N=\rho N_A/A=9.13\times10^{28}\) átomos/m³; \(M_s=0.60(9.27\times10^{-24})(9.13\times10^{28})=5.1\times10^5\) A/m, y \(B_s=\mu_0M_s=0.64\) T.</p></details>
</div>
</section>

<section>
<h2>Diamagnetismo y paramagnetismo</h2>
<p>Todo material es diamagnético: un campo aplicado modifica el movimiento orbital de los electrones e induce un momento opuesto (ley de Lenz a escala atómica). El efecto es débil y solo se nota cuando no hay otro; el bismuto y el grafito pirolítico son tan diamagnéticos que levitan sobre imanes de neodimio, y un superconductor es un diamagnético perfecto (\(\chi=-1\)).</p>
<p>En un material paramagnético, los momentos atómicos permanentes tienden a alinearse con el campo contra la agitación térmica. La mecánica estadística da \(M=N\mu\,L(\mu B/k_BT)\) (función de Langevin, o de Brillouin cuánticamente), y para campos débiles la ley de Curie:</p>
<div class="eq key" data-name="Ley de Curie">\[\chi_m=\frac{C}{T},\qquad C=\frac{\mu_0N\mu^2}{3k_B}.\]</div>
</section>

<section>
<h2>Ferromagnetismo</h2>
<p>En Fe, Co, Ni, Gd y muchas aleaciones, los momentos vecinos se alinean espontáneamente por la <span class="term">interacción de intercambio</span>, un efecto cuántico de la repulsión electrostática combinada con el principio de Pauli. Weiss (1907) la modeló como un campo interno proporcional a la propia magnetización, \(H_{\text{int}}=\lambda M\). La magnetización reducida \(m=M/M_0\) satisface entonces una ecuación autoconsistente (para espín ½):</p>
<div class="eq key" data-name="Campo medio de Weiss">\[m=\tanh\left(\frac{T_c}{T}\,m\right).\]</div>
<p>Por debajo de la temperatura de Curie \(T_c\) existe una solución \(m\neq0\) (orden espontáneo); por encima, solo \(m=0\), y la susceptibilidad sigue la ley de Curie–Weiss, \(\chi=C/(T-T_c)\). Las temperaturas de Curie son 1043 K (Fe), 1388 K (Co), 627 K (Ni) y 292 K (Gd). Calentar un imán por encima de \(T_c\) lo desmagnetiza.</p>
<div class="sim" data-sim="curie-weiss" data-title="Magnetización espontánea de campo medio y ley de Curie–Weiss"></div>
<div class="sim-guide"><ul>
<li>A la mitad de \(T_c\) la magnetización es todavía el 96 % de la de saturación; cae bruscamente cerca de \(T_c\).</li>
<li>Sobre \(T_c\), \(1/\chi\) es una recta que corta el eje en \(T_c\).</li>
<li>Compare con el gadolinio: con \(T_c=292\) K deja de ser ferromagnético en un día caluroso.</li>
</ul></div>
<p>Si el intercambio favorece momentos antiparalelos de igual tamaño, el material es <span class="term">antiferromagnético</span> (MnO, Cr, por debajo de su temperatura de Néel). Si los momentos antiparalelos son de distinto tamaño, queda una magnetización neta: es el <span class="term">ferrimagnetismo</span> de las ferritas cúbicas MFe₂O₄. En la magnetita (Fe₃O₄, estructura de espinela inversa), los Fe³⁺ de los sitios tetraédricos y octaédricos se cancelan, y la magnetización la aportan solo los Fe²⁺ (4 \(\mu_B\) cada uno). Las ferritas son aislantes, y por eso se usan en núcleos de alta frecuencia donde un metal tendría grandes pérdidas por corrientes inducidas.</p>
<div class="sim" data-sim="magnetic-moment" data-title="Momentos atómicos y magnetización de saturación"></div>
<div class="sim-guide"><ul>
<li>Fe₃O₄: 8 unidades fórmula por celda (\(a=0.839\) nm) con 4 \(\mu_B\) netos cada una dan \(M_s=5.0\times10^5\) A/m (Callister, ej. 20.2).</li>
<li>Cambie el ion divalente: NiFe₂O₄ (2 \(\mu_B\)) tiene la mitad de magnetización; MnFe₂O₄ (5 \(\mu_B\)), más.</li>
</ul></div>
</section>

<section>
<h2>Dominios e histéresis</h2>
<p>Un ferromagnético desmagnetizado no tiene orden aleatorio a escala atómica: está dividido en <span class="term">dominios</span>, cada uno magnetizado a saturación en una dirección distinta, separados por paredes de Bloch de unos cientos de átomos. La división reduce la energía magnetostática del campo que saldría del material. Al aplicar un campo, primero se desplazan las paredes (los dominios bien orientados crecen) y luego rota la magnetización. Las paredes se anclan en defectos, inclusiones y bordes de grano, y por eso el proceso es irreversible: la curva \(B\)–\(H\) forma un ciclo de histéresis caracterizado por la <span class="term">remanencia</span> \(B_r\) y la <span class="term">coercitividad</span> \(H_c\). El área del ciclo es la energía disipada por ciclo y por unidad de volumen.</p>
<p>El modelo de Jiles y Atherton (1986) describe el ciclo con cinco parámetros físicos: la magnetización de saturación, la forma de la curva anhisterética (\(a\)), el acoplamiento entre dominios (\(\alpha\)), la densidad de anclajes (\(k\), del orden de \(H_c\)) y la reversibilidad de las paredes (\(c\)).</p>
<div class="sim" data-sim="hysteresis" data-title="Ciclo de histéresis (modelo de Jiles–Atherton)"></div>
<div class="sim-guide"><ul>
<li>Material blando (acero al silicio, permalloy): ciclo angosto, coercitividad de decenas de A/m, pérdidas pequeñas. Ideal para transformadores.</li>
<li>Material duro (ferrita de bario, NdFeB): ciclo ancho; lo importante es el producto de energía \((BH)_{\max}\) en el segundo cuadrante.</li>
<li>Aumente el anclaje \(k\): crece la coercitividad. En el diseño de imanes se buscan precipitados que anclen las paredes; en el de núcleos, materiales limpios y de grano grande.</li>
</ul></div>
<h3>Anisotropía y partículas monodominio</h3>
<p>La magnetización prefiere ciertas direcciones cristalinas (ejes fáciles: ⟨100⟩ en Fe, ⟨111⟩ en Ni, el eje \(c\) en Co). En una partícula tan pequeña que no admite paredes, la inversión solo puede ocurrir por rotación coherente. Stoner y Wohlfarth (1948) resolvieron el problema: con una anisotropía uniaxial de constante \(K\), la energía es \(E=KV\sen^2\theta-\mu_0M_sHV\cos(\theta-\psi)\), y el campo de conmutación en unidades de \(H_K=2K/\mu_0M_s\) es</p>
<div class="eq">\[h_{sw}(\psi)=\frac{1}{\left(\cos^{2/3}\psi+\sen^{2/3}\psi\right)^{3/2}},\]</div>
<p>la famosa «astroide». Las partículas monodominio son la base de la grabación magnética y de los imanes de alta coercitividad.</p>
<div class="sim" data-sim="stoner-wohlfarth" data-title="Partícula de Stoner–Wohlfarth"></div>
<div class="sim-guide"><ul>
<li>Con el campo a lo largo del eje fácil (\(\psi=0\)), el ciclo es cuadrado y conmuta en \(h=1\).</li>
<li>A 45° el campo de conmutación es mínimo, \(h=0.5\); a 90° no hay histéresis.</li>
</ul></div>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Calcule la magnetización de saturación del hierro (2.22 \(\mu_B\)/átomo, 7.87 g/cm³) y su \(B_s\).
<details><summary>Respuesta</summary><p>\(N=8.49\times10^{28}\) m⁻³; \(M_s=1.75\times10^6\) A/m; \(B_s=2.2\) T.</p></details></li>
<li><span class="lvl">Básico</span>¿Qué momento de espín tiene un ion Mn²⁺ (5 electrones 3d desapareados)?
<details><summary>Respuesta</summary><p>\(\sqrt{5\cdot7}=5.92\,\mu_B\) para el ion libre; en un sólido ordenado aporta \(5\,\mu_B\).</p></details></li>
<li><span class="lvl">Intermedio</span>Con la teoría de campo medio, ¿qué fracción de su magnetización conserva un ferromagnético a \(0.9\,T_c\)?
<details><summary>Respuesta</summary><p>Resolviendo \(m=\tanh(m/0.9)\): \(m=0.525\).</p></details></li>
<li><span class="lvl">Intermedio</span>Estime el producto de energía máximo ideal de un imán con \(B_r=1.2\) T (curva de desmagnetización recta).
<details><summary>Respuesta</summary><p>\((BH)_{\max}=B_r^2/4\mu_0=286\) kJ/m³ (los mejores NdFeB llegan a unos 400 kJ/m³).</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que para \(\psi=45^\circ\) el campo de conmutación de Stoner–Wohlfarth es \(h=0.5\).
<details><summary>Respuesta</summary><p>\(\cos^{2/3}45^\circ=\sen^{2/3}45^\circ=2^{-1/3}\); su suma es \(2^{2/3}\), y \(h=(2^{2/3})^{-3/2}=2^{-1}=0.5\).</p></details></li>
</ol>
