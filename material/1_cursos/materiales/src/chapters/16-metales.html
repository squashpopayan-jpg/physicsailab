<p class="lead">Los capítulos anteriores explicaron por qué los metales son resistentes y dúctiles y cómo se controla su microestructura. Este capítulo recorre las familias de aleaciones que usa la ingeniería, la lógica de sus nombres y los procesos con que se les da forma, siempre buscando la razón metalúrgica detrás de cada elección.</p>

<section>
<h2>Aleaciones ferrosas</h2>
<p>Las aleaciones de hierro dominan la producción de metales por tres razones: el mineral es abundante, la reducción es económica y el diagrama Fe–C permite una gama enorme de microestructuras. Su debilidad es la corrosión y la densidad relativamente alta.</p>
<h3>Aceros al carbono y de baja aleación</h3>
<ul>
<li><b>Bajo carbono</b> (&lt; 0.25 % C): ferrita y perlita, blandos, dúctiles, soldables y baratos; no se templan. Carrocerías, perfiles, tubos, latas. Los aceros de <span class="term">alta resistencia y baja aleación</span> (HSLA) agregan Nb, V o Ti en centésimas de porcentaje y alcanzan 480 MPa con grano finísimo (Hall–Petch) y precipitados.</li>
<li><b>Medio carbono</b> (0.25–0.60 % C): se templan y revienen; con Cr, Ni y Mo ganan templabilidad (4140, 4340). Ejes, engranajes, cigüeñales, rieles.</li>
<li><b>Alto carbono</b> (0.60–1.4 % C): muy duros y resistentes al desgaste; los aceros de herramienta agregan W, Mo, V y Cr para formar carburos duros y estables (aceros rápidos M2, T1).</li>
</ul>
<h3>Aceros inoxidables</h3>
<p>Con más de 11 % de cromo, el acero forma una película pasiva de Cr₂O₃ de pocos nanómetros que se regenera sola (capítulo 25). Según la fase dominante se clasifican en <span class="term">ferríticos</span> (430: Cr, BCC, magnéticos), <span class="term">martensíticos</span> (410, 440C: más carbono, templables; cuchillería), <span class="term">austeníticos</span> (304, 316: con Ni, FCC, no magnéticos, los más resistentes a la corrosión y los más usados), <span class="term">dúplex</span> (ferrita y austenita, alta resistencia y resistencia a la corrosión bajo tensión) y <span class="term">endurecibles por precipitación</span> (17-4 PH).</p>
<h3>Designaciones AISI/SAE</h3>
<p>Los aceros al carbono y aleados se nombran con cuatro dígitos: los dos primeros indican la familia de aleación y los dos últimos el carbono en centésimas de porcentaje. Un 1045 es un acero al carbono con 0.45 % C; un 4340, un Ni–Cr–Mo con 0.40 % C.</p>
<div class="sim" data-sim="alloy-designation" data-title="Decodificador de designaciones de aceros y aleaciones de aluminio"></div>
<div class="sim-guide"><ul>
<li>Pruebe 1020, 4140 y 52100: la composición y los usos típicos cambian con los dos primeros dígitos.</li>
<li>En aluminio, combine una serie (por ejemplo 6061) con un temple (T6): la serie dice qué aleante tiene y el temple qué tratamiento recibió.</li>
</ul></div>
<h3>Fundiciones</h3>
<p>Las fundiciones grises, dúctiles, blancas y maleables (capítulo 13) aprovechan que las aleaciones de 3–4.5 % C funden a unos 1150–1300 °C, mucho menos que el acero, y llenan moldes complejos con facilidad.</p>
</section>

<section>
<h2>Conformado mecánico</h2>
<p>La mayoría de las piezas metálicas se forman por deformación plástica. Se distingue el trabajo en caliente (sobre la temperatura de recristalización: fuerzas menores, deformaciones grandes, superficie oxidada) del trabajo en frío (mejor acabado y tolerancias, endurecimiento por deformación). Los procesos principales son la forja (martillado o prensado en matrices), el laminado (entre rodillos), la extrusión (empuje a través de una matriz) y el trefilado (tracción a través de una matriz).</p>
<p>Una estimación clásica de la fuerza de laminado, sin fricción, multiplica el esfuerzo de fluencia medio por el área de contacto entre el rodillo y la chapa:</p>
<div class="eq key" data-name="Fuerza de laminado">\[F\approx\bar k\,w\,L,\qquad L=\sqrt{R\,\Delta h},\qquad \bar k=\frac{K\,\varepsilon^n}{1+n},\qquad \varepsilon=\ln\frac{h_0}{h_f},\]</div>
<p>con \(w\) el ancho, \(R\) el radio de los rodillos y \(\Delta h=h_0-h_f\) la reducción de espesor. El esfuerzo medio \(\bar k\) promedia la curva de Hollomon (capítulo 8) entre 0 y \(\varepsilon\).</p>
<div class="sim" data-sim="rolling" data-title="Laminado: fuerza, deformación y endurecimiento"></div>
<div class="sim-guide"><ul>
<li>Lamine una chapa de cobre recocido de 300 mm de ancho de 25 a 20 mm con rodillos de 250 mm de radio: unos 2 MN (sin fricción).</li>
<li>Repita varias pasadas sin recocer: la fuerza por pasada crece porque el material se endurece.</li>
<li>Rodillos de menor radio reducen la longitud de contacto y la fuerza: por eso los laminadores de chapa fina (Sendzimir) usan rodillos pequeños apoyados en otros grandes.</li>
</ul></div>
</section>

<section>
<h2>Fundición</h2>
<p>Verter metal líquido en un molde es la forma más directa de obtener piezas complejas. La pieza solidifica desde las paredes hacia adentro, y el tiempo total depende de cuánto calor hay que extraer (proporcional al volumen) y de la superficie por la que sale. Chvorinov (1940) lo resumió en una regla empírica:</p>
<div class="eq key" data-name="Regla de Chvorinov">\[t_s=C_m\left(\frac VA\right)^2,\]</div>
<p>con \(C_m\) una constante del molde y del metal (típicamente 2–4 min/cm² para acero en arena). El cociente \(V/A\) es el <span class="term">módulo</span> de la pieza. Como el metal se contrae al solidificar, se agregan <span class="term">mazarotas</span> que deben solidificar después que la pieza para alimentarla: su módulo debe ser mayor (en la práctica, 1.2 veces).</p>
<div class="sim" data-sim="chvorinov" data-title="Tiempo de solidificación y diseño de la mazarota"></div>
<div class="sim-guide"><ul>
<li>A igual volumen, la esfera tarda más en solidificar que el cubo y éste más que una placa: tiene la menor superficie por unidad de volumen.</li>
<li>Para un cubo de 10 cm (módulo 1.67 cm), una mazarota cilíndrica con \(H=D\) necesita \(D=12\) cm.</li>
</ul></div>
<p>Los procesos se diferencian por el molde: arena (barato, piezas grandes), coquilla permanente, inyección a presión (piezas delgadas de Al, Zn, Mg), cera perdida o microfusión (álabes, joyería, implantes) y colada continua (planchones y palanquillas de acero).</p>
</section>

<section>
<h2>Otras técnicas de fabricación</h2>
<ul>
<li><b>Pulvimetalurgia</b>: polvos compactados y sinterizados por difusión en estado sólido. Permite metales refractarios (W), materiales porosos autolubricados (bujes de bronce) y piezas casi terminadas sin maquinado.</li>
<li><b>Soldadura</b>: une piezas fundiendo localmente el metal. La zona afectada por el calor (ZAC) sufre ciclos térmicos que pueden templar, sobreenvejecer o hacer crecer el grano; el carbono equivalente (capítulo 13) anticipa los problemas en aceros.</li>
<li><b>Manufactura aditiva</b>: fusión selectiva por láser o haz de electrones de lechos de polvo (Ti-6Al-4V, Inconel, aceros) o deposición de alambre. Las velocidades de enfriamiento de \(10^3\)–\(10^6\) K/s producen microestructuras finas y fuera del equilibrio, con porosidad y esfuerzos residuales que requieren tratamiento posterior (prensado isostático en caliente).</li>
</ul>
</section>

<section>
<h2>Problemas propuestos</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>¿Qué composición nominal tiene un acero 8620? ¿Y un 1095?
<details><summary>Respuesta</summary><p>8620: Ni–Cr–Mo (≈ 0.55 Ni, 0.5 Cr, 0.2 Mo) con 0.20 % C, típico de carburización. 1095: acero al carbono con 0.95 % C (resortes, cuchillas).</p></details></li>
<li><span class="lvl">Básico</span>Calcule el módulo \(V/A\) de un cubo de 10 cm y el tiempo de solidificación con \(C_m=2\) min/cm².
<details><summary>Respuesta</summary><p>\(V/A=a/6=1.667\) cm; \(t=2(1.667)^2=5.6\) min.</p></details></li>
<li><span class="lvl">Intermedio</span>Una esfera tiene el mismo volumen que el cubo anterior. ¿Cuánto tarda en solidificar?
<details><summary>Respuesta</summary><p>\(r=6.20\) cm, \(V/A=r/3=2.07\) cm, \(t=8.6\) min.</p></details></li>
<li><span class="lvl">Intermedio</span>Estime la fuerza para laminar sin fricción una chapa de acero de bajo carbono recocido (\(K=600\) MPa, \(n=0.21\)) de 200 mm de ancho de 10 a 8 mm, con rodillos de 200 mm de radio.
<details><summary>Respuesta</summary><p>\(\varepsilon=0.223\), \(\bar k=600(0.223)^{0.21}/1.21=362\) MPa, \(L=\sqrt{200\cdot2}=20\) mm. \(F=362\times10^6(0.2)(0.02)=1.45\) MN.</p></details></li>
<li><span class="lvl">Avanzado</span>Demuestre que para un cilindro con \(H=D\) el módulo es \(D/6\), igual que el de un cubo de arista \(D\), y explique por qué las mazarotas cilíndricas se prefieren a las cúbicas.
<details><summary>Respuesta</summary><p>\(V=\pi D^3/4\), \(A=\pi D^2/2+\pi D^2=3\pi D^2/2\); \(V/A=D/6\). A igual módulo, el cilindro tiene \(\pi/4\) del volumen del cubo: usa menos metal (y se moldea más fácil).</p></details></li>
</ol>
