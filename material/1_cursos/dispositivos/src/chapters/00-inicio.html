    <h1 class="home-title">Dispositivos activos y pasivos<span>del resistor al circuito integrado</span></h1>
    <p class="home-lead">Un curso completo sobre los componentes de la electrónica: cómo están hechos, cómo se comportan y cómo se usan. Cada dispositivo —resistores, condensadores, inductores, diodos, transistores bipolares y de efecto de campo, amplificadores operacionales, reguladores, tiristores— se explica con su teoría, se <b>simula con un motor de análisis nodal real</b> y se prueba en un <b>taller de circuitos virtual</b> donde se pueden armar circuitos propios, medir con multímetro y osciloscopio, agregar elementos, <b>provocar cortocircuitos</b> y ver cómo y por qué se dañan los componentes. Termina con instrumentación, protección contra fallas, diez proyectos de laboratorio y un taller libre con retos.</p>

<div class="home-howto">
  <div><b>Seis partes, de lo pasivo a lo activo</b><p>Circuitos, señales y componentes pasivos (resistores, condensadores, inductores, transformadores, sensores); semiconductores, unión pn y diodos; transistores (BJT, MOSFET, JFET, potencia); circuitos integrados analógicos (operacionales, osciladores, reguladores, tiristores); y laboratorio.</p></div>
  <div><b>Un taller para romper cosas</b><p>El mismo editor de circuitos está en todos los capítulos: se agregan piezas, se mide con instrumentos virtuales y se prueban fallas —cortocircuitos, componentes abiertos, polaridad invertida, sobrecalentamiento— con daños reales: los componentes se queman, se funden y se apagan por protección térmica.</p></div>
  <div><b>Teoría completa y verificada</b><p>Más de cien simulaciones, problemas resueltos paso a paso y un apéndice de validación: el motor se contrasta con SciPy, NumPy y SymPy y con soluciones analíticas, y cada cifra citada en el texto se midió en el propio simulador.</p></div>
  <div><b>Del cálculo al banco de trabajo</b><p>Cada proyecto de laboratorio trae diseño, lista de materiales, procedimiento, resultados esperados y rúbrica, y cada capítulo termina con medidas para hacer con componentes reales.</p></div>
