<template class="chapter-src" data-id="transitorios" data-num="8" data-title="Circuitos RC, RL y RLC: transitorios y resonancia" data-part="Parte II · Dispositivos pasivos" data-short="Respuesta de primer orden con la fórmula general, tiempo de subida, integrador y derivador, circuito RLC de segundo orden (amortiguamiento, sobreimpulso), resonancia serie y paralelo, factor de calidad y ancho de banda">
<p class="lead">Cuando un circuito con elementos que almacenan energía recibe un cambio brusco —se cierra un interruptor, llega el flanco de una señal digital, se conecta una fuente— la respuesta no es instantánea: pasa por un <b>transitorio</b> antes de llegar al régimen permanente. Con un elemento almacenador (R con C, o R con L) la respuesta es una exponencial; con dos (R, L y C) puede oscilar. Estos dos casos explican por qué las señales digitales «rebotan» en las placas, cómo funciona un sintonizador de radio y por qué un filtro con buena selectividad también tiene un transitorio lento.</p>

<section>
<h2>Respuesta de primer orden: una fórmula para todo</h2>
<p>Cualquier magnitud \(x(t)\) de un circuito con un único elemento almacenador (la tensión de un condensador o la corriente de un inductor, y por tanto cualquier tensión o corriente del circuito, que son combinaciones lineales de ella) obedece a una ecuación de primer orden, cuya solución con una excitación constante es</p>
<div class="eq key" data-name="Respuesta general de primer orden">\[x(t)=x_\infty+\left[x(0^+)-x_\infty\right]e^{-t/\tau}\qquad \tau_{RC}=RC\qquad \tau_{RL}=\frac LR\]</div>
<p>Basta conocer tres números: el valor inicial \(x(0^+)\) (se obtiene sabiendo que \(v_C\) e \(i_L\) no saltan), el valor final \(x_\infty\) (con el condensador abierto y el inductor en cortocircuito) y la constante de tiempo \(\tau\) (con \(R\) la resistencia de Thévenin vista por el elemento). El <b>tiempo de subida</b> entre el 10 % y el 90 % del valor final es \(t_r=\tau\ln9=2.2\,\tau\); con \(\tau=1\) ms, \(t_r=2.2\) ms y el ancho de banda a −3 dB es \(f_c=0.35/t_r\), regla de oro que relaciona el dominio del tiempo con el de la frecuencia (un osciloscopio de 100 MHz tiene un tiempo de subida propio de 3.5 ns).</p>
</section>

<section>
<h2>Integrador y derivador</h2>
<p>Un divisor RC alimentado con una señal periódica se comporta de forma muy distinta según la relación entre \(\tau\) y el periodo \(T\):</p>
<ul>
<li>Si \(\tau\gg T\) y la salida se toma en el condensador, el condensador casi no alcanza a cargarse en un semiciclo y su tensión es proporcional a la <b>integral</b> de la entrada: \(v_{out}\approx\frac1{RC}\int v_{in}\,\mathrm{d}t\). Una cuadrada de ±1 V a 1 kHz con \(\tau=10\) ms produce una <i>triangular</i> de solo 50 mV pico a pico: \(A\,T/(2\tau)\).</li>
<li>Si \(\tau\ll T\) y la salida se toma en el resistor (circuito CR), la tensión es proporcional a la <b>derivada</b> de la entrada: \(v_{out}\approx RC\,\mathrm{d}v_{in}/\mathrm{d}t\). Una cuadrada se convierte en una sucesión de picos agudos positivos y negativos en los flancos, con duración \(\sim\tau\). Se usa para detectar flancos y generar disparos.</li>
</ul>
<div class="sim" data-sim="c8-difint" data-title="Integrador y derivador con una onda cuadrada"></div>
<div class="sim-guide"><ul>
<li>Montaje <b>integrador</b> con \(R=10\) kΩ, \(C=1\) µF y 1 kHz: \(\tau=10\) ms ≫ \(T\), y la salida es una triangular de unos 50 mV con un nivel medio igual al de la entrada.</li>
<li>Baje la frecuencia a 20 Hz (\(T=50\) ms, \(\tau\) comparable): la triangular crece y empieza a redondearse como una exponencial; ya no es un integrador ideal.</li>
<li>Montaje <b>derivador</b> con \(\tau=0.1\) ms y 100 Hz: en cada flanco hay un pico de la altura del escalón que decae en unos 0.5 ms (\(5\tau\)); entre flancos la salida es cero.</li>
</ul></div>
</section>

<section>
<h2>Circuito RLC serie: el oscilador amortiguado</h2>
<p>Con una resistencia, un inductor y un condensador en serie alimentados por un escalón \(V\), la tensión del condensador cumple \(LC\,\ddot v_C+RC\,\dot v_C+v_C=V\), una ecuación de segundo orden. Se caracteriza por dos parámetros:</p>
<div class="eq key" data-name="Segundo orden: frecuencia natural y amortiguamiento">\[\omega_0=\frac1{\sqrt{LC}}\qquad \zeta=\frac R2\sqrt{\frac CL}=\frac1{2Q}\qquad R_{crit}=2\sqrt{L/C}\]</div>
<p>Según el valor de \(\zeta\), la respuesta es distinta: <b>sobreamortiguada</b> (\(\zeta>1\)): dos exponenciales sin oscilar, lenta; <b>críticamente amortiguada</b> (\(\zeta=1\)): la más rápida sin sobreimpulso; <b>subamortiguada</b> (\(\zeta&lt;1\)): oscila a la frecuencia \(\omega_d=\omega_0\sqrt{1-\zeta^2}\) con una envolvente decreciente \(e^{-\zeta\omega_0t}\) y un <b>sobreimpulso</b> máximo de \(\exp\!\big(-\pi\zeta/\sqrt{1-\zeta^2}\big)\). Con \(L=10\) mH y \(C=1\) µF, \(f_0=1591.5\) Hz y \(R_{crit}=200\ \Omega\); con \(R=100\ \Omega\), \(\zeta=0.5\) (sobreimpulso 16.3 %, \(f_d=1378\) Hz); con \(R=20\ \Omega\), \(\zeta=0.1\) (sobreimpulso 72.9 %, oscila durante varias decenas de ciclos); con \(R=1\) kΩ, \(\zeta=5\) (lento, sin oscilación). Este es exactamente el «rebote» (<i>ringing</i>) que se ve en el flanco de una señal digital rápida en una pista con la inductancia del cable y la capacitancia de la entrada.</p>
<div class="sim" data-sim="c8-rlc" data-title="Respuesta de un circuito RLC serie a un escalón"></div>
<div class="sim-guide"><ul>
<li>Con \(R=100\ \Omega\), \(L=10\) mH y \(C=1\) µF: \(\zeta=0.5\). La tensión del condensador rebasa en un 16 % el valor final (2 V → 2.33 V) y se asienta en menos de 1 ms.</li>
<li>Baje \(R\) a 20 Ω: \(\zeta=0.1\) y la salida oscila largo tiempo con un sobreimpulso de casi 73 % (el condensador llega a 3.5 V con un escalón de 2 V).</li>
<li>Suba \(R\) a 200 Ω (amortiguamiento crítico): la respuesta es la más rápida posible sin rebasar. Con 1 kΩ es lenta.</li>
</ul></div>
</section>

<section>
<h2>Resonancia, factor de calidad y ancho de banda</h2>
<p>En régimen senoidal, la reactancia total del circuito serie \(X=\omega L-1/\omega C\) se anula en \(\omega_0\): ahí la impedancia es la mínima (\(Z=R\)) y la corriente la máxima (<b>resonancia serie</b>). La tensión en L y en C puede entonces superar muchas veces la de la fuente: \(V_L=V_C=Q\,V\), con \(Q=\omega_0L/R\). Así, un circuito con \(R=10\ \Omega\), \(L=10\) mH y \(C=100\) nF resuena a \(f_0=5.03\) kHz con \(Q=31.6\): una fuente de 1 V produce 31.6 V en el condensador. La selectividad se mide por el <b>ancho de banda</b> a −3 dB, \(B=f_0/Q=159\) Hz, y también por la duración del transitorio: la oscilación libre decae con constante \(2L/R=2\) ms.</p>
<div class="eq key" data-name="Resonancia">\[f_0=\frac1{2\pi\sqrt{LC}}\qquad Q_{serie}=\frac{\omega_0L}{R}=\frac1R\sqrt{\frac LC}\qquad Q_{paralelo}=R_p\sqrt{\frac CL}\qquad B=\frac{f_0}{Q}\]</div>
<p>El circuito <b>paralelo</b> (un inductor y un condensador en paralelo, con una resistencia en paralelo \(R_p\)) es el dual: la impedancia es máxima en la resonancia (\(Z=R_p\)). Con \(R_p=1\) kΩ, 10 mH y 100 nF resulta \(Q=3.16\) y \(B=1.59\) kHz. Los circuitos resonantes son la base de los sintonizadores, los filtros pasabanda y los osciladores; en la práctica el \(Q\) del inductor (su resistencia serie) suele limitar el del conjunto.</p>
<div class="sim" data-sim="c8-resonancia" data-title="Respuesta en frecuencia de un circuito RLC pasabanda"></div>
<div class="sim-guide"><ul>
<li>Con 10 Ω, 10 mH y 100 nF el pico de ganancia está en 5.03 kHz y la banda de −3 dB mide unos 159 Hz: \(Q=31.6\).</li>
<li>Aumente \(R\) a 100 Ω: el pico se ensancha (\(Q=3.2\), \(B\approx1.6\) kHz) y la fase cambia más suavemente. La fase pasa de +90° a −90° pasando por 0° en la resonancia.</li>
<li>Cambie \(C\) a 400 nF: \(f_0\) baja a la mitad (2.52 kHz): \(f_0\propto1/\sqrt{LC}\).</li>
</ul></div>
</section>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un condensador de 10 µF descargado se conecta a 5 V a través de 100 kΩ. ¿Cuál es la tensión a 1 s? ¿Cuánto tarda en llegar a 4.5 V? ¿Y el tiempo de subida 10–90 %?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li>\(\tau=RC=1\) s. \(v(1)=5(1-e^{-1})=3.16\) V.</li>
<li>\(4.5=5(1-e^{-t})\Rightarrow e^{-t}=0.1\Rightarrow t=2.30\) s.</li>
<li>\(t_r=2.2\tau=2.2\) s.</li>
<li><b>Resultado.</b> <span class="ans">3.16 V; 2.30 s; 2.2 s.</span></li></ol></details></li>
<li><span class="lvl">Básico</span>Un integrador RC con \(R=10\) kΩ y \(C=1\) µF recibe una onda cuadrada de ±1 V y 1 kHz. ¿Qué amplitud pico a pico tiene la triangular de salida?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li>\(\tau=10\) ms y \(T=1\) ms: \(\tau\gg T\).</li>
<li>Durante el semiciclo la pendiente es \(A/\tau=1/0.01=100\) V/s; en \(T/2=0.5\) ms: \(\Delta v=50\) mV.</li>
<li><b>Resultado.</b> <span class="ans">50 mV pico a pico.</span></li></ol></details></li>
<li><span class="lvl">Intermedio</span>En un RLC serie con \(L=10\) mH y \(C=1\) µF, calcule \(f_0\), la resistencia crítica y el sobreimpulso con \(R=100\ \Omega\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li>\(f_0=1/(2\pi\sqrt{10^{-8}})=1591.5\) Hz.</li>
<li>\(R_{crit}=2\sqrt{L/C}=2\sqrt{10^4}=200\ \Omega\).</li>
<li>\(\zeta=R/R_{crit}=0.5\); sobreimpulso \(=\exp(-\pi\cdot0.5/0.866)=16.3\ \%\).</li>
<li><b>Resultado.</b> <span class="ans">1591.5 Hz; 200 Ω; 16.3 %.</span></li></ol></details></li>
<li><span class="lvl">Intermedio</span>Un circuito serie con \(R=10\ \Omega\), \(L=10\) mH y \(C=100\) nF se alimenta con 1 V eficaz en resonancia. Calcule \(f_0\), \(Q\), la corriente y las tensiones en L y C.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li>\(f_0=5.03\) kHz; \(Q=\sqrt{L/C}/R=316/10=31.6\).</li>
<li>\(I=V/R=0.1\) A.</li>
<li>\(V_L=V_C=I\,X=0.1\times316=31.6\) V (= \(Q\,V\)).</li>
<li><b>Resultado.</b> <span class="ans">5.03 kHz; \(Q=31.6\); 100 mA; 31.6 V en cada reactancia (en oposición de fase, suman cero).</span></li></ol></details></li>
<li><span class="lvl">Avanzado</span>Un pasabanda debe tener \(f_0=10.7\) MHz y un ancho de banda de 200 kHz con \(L=2\ \mu\)H. Calcule \(Q\), \(C\) y la resistencia serie máxima admisible.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li>\(Q=f_0/B=10.7/0.2=53.5\).</li>
<li>\(C=1/(\omega_0^2L)=1/((6.723\times10^7)^2\cdot2\times10^{-6})=110.6\) pF.</li>
<li>\(R_{max}=\omega_0L/Q=134.5/53.5=2.51\ \Omega\).</li>
<li><b>Resultado.</b> <span class="ans">\(Q=53.5\); \(C=111\) pF; \(R\le2.5\ \Omega\): el factor de calidad del inductor debe ser al menos 54.</span></li></ol></details></li>
</ol>
