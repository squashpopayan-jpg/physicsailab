<section>

<div class="tablewrap"><table class="tbl"><tr><th>Concepto</th><th>Fórmula</th></tr>

<tr><td>Termistor NTC, LDR (10)</td><td>\(R=R_{25}e^{B(1/T-1/298.15)}\); \(R=R_{10}(10/E)^\gamma\)</td></tr></table></div>

<section>
<h2>Semiconductores, unión pn y diodos (capítulos 11–15)</h2>
<div class="tablewrap"><table class="tbl"><tr><th>Concepto</th><th>Fórmula</th></tr>
<tr><td>Portadores en equilibrio (11)</td><td>\(np=n_i^2\); \(n_i^2=N_cN_ve^{-E_g/kT}\)</td></tr>
<tr><td>Conductividad (11)</td><td>\(\sigma=q(n\mu_n+p\mu_p)\); deriva y difusión: \(D=\mu V_T\)</td></tr>
<tr><td>Potencial de contacto (12)</td><td>\(V_0=V_T\ln(N_AN_D/n_i^2)\)</td></tr>
<tr><td>Anchura de la zona de deplexión (12)</td><td>\(W=\sqrt{2\varepsilon(V_0-V)(1/N_A+1/N_D)/q}\)</td></tr>
<tr><td>Ecuación del diodo (12, 13)</td><td>\(I=I_S(e^{V/nV_T}-1)\); \(r_d=nV_T/I\)</td></tr>

<tr><td>Rectificador de media onda (14)</td><td>\(V_{dc}=V_{pk}/\pi\); \(V_{rms}=V_{pk}/2\); onda completa: \(2V_{pk}/\pi\), \(V_{pk}/\sqrt2\)</td></tr>
<tr><td>Rizado del filtro (14, 25)</td><td>\(\Delta V\le I_o/(2fC)\) (onda completa); \(I_o/(fC)\) (media onda)</td></tr>
<tr><td>Zener (15)</td><td>\(R_s=(V_{in}-V_Z)/(I_Z+I_L)\); \(P_Z=V_ZI_{Z,max}\)</td></tr>
<tr><td>LED (15)</td><td>\(R=(V_{cc}-V_F)/I_F\)</td></tr></table></div>
</section>

<section>
<h2>Transistores (capítulos 16–21)</h2>
<div class="tablewrap"><table class="tbl"><tr><th>Concepto</th><th>Fórmula</th></tr>
<tr><td>BJT, activa directa (16)</td><td>\(I_C=I_S(e^{V_{BE}/V_T}-1)(1+V_{CE}/V_A)\); \(I_C=\beta I_B\); \(I_E=(\beta+1)I_B\)</td></tr>
<tr><td>Pequeña señal del BJT (16, 18)</td><td>\(g_m=I_C/V_T\); \(r_\pi=\beta/g_m\); \(r_e=V_T/I_E\); \(r_o=(V_A+V_{CE})/I_C\)</td></tr>
<tr><td>Polarización por divisor (17)</td><td>\(I_C=\beta(V_{th}-V_{BE})/[R_{th}+(\beta+1)R_E]\)</td></tr>
<tr><td>Saturación forzada (17)</td><td>\(I_B\ge I_{C,sat}/\beta_{for}\), con \(\beta_{for}\approx10\)</td></tr>
<tr><td>Emisor común (18)</td><td>\(A_v=-g_m(R_C\parallel R_L)\); sin \(C_E\): \(-(R_C\parallel R_L)/(r_e+R_E)\)</td></tr>
<tr><td>Colector común (18)</td><td>\(A_v=(\beta+1)R'_E/[r_\pi+(\beta+1)R'_E]\); \(R_{out}=R_E\parallel(r_\pi+R'_s)/(\beta+1)\)</td></tr>
<tr><td>Frecuencia de corte superior (18)</td><td>\(C_{in}=C_{be}+C_{bc}(1+g_mR'_L)\); \(f_H=1/(2\pi R_{eq}C_{in})\)</td></tr>
<tr><td>Par diferencial (18)</td><td>\(A_d=g_mR_C\); \(A_{cm}=-R_C/(2R_T)\); CMRR \(=g_mR_T\)</td></tr>
<tr><td>MOSFET (19)</td><td>Saturación: \(I_D=\tfrac k2V_{ov}^2(1+\lambda V_{DS})\); triodo: \(k(V_{ov}V_{DS}-V_{DS}^2/2)\)</td></tr>
<tr><td>Pequeña señal del MOSFET (19)</td><td>\(g_m=kV_{ov}=2I_D/V_{ov}\); \(R_{DS(on)}=1/(kV_{ov})\)</td></tr>
<tr><td>Inversor CMOS (19)</td><td>\(V_M=[V_{thn}+r(V_{DD}-|V_{thp}|)]/(1+r)\), \(r=\sqrt{k_p/k_n}\); \(P=\alpha CV_{DD}^2f\)</td></tr>
<tr><td>JFET (20)</td><td>\(I_D=I_{DSS}(1-V_{GS}/V_P)^2\); \(g_m=g_{m0}(1-V_{GS}/V_P)\), \(g_{m0}=2I_{DSS}/|V_P|\)</td></tr>
<tr><td>Calor (21)</td><td>\(T_j=T_a+P(R_{\theta JC}+R_{\theta CS}+R_{\theta SA})\)</td></tr>
<tr><td>Clase B (21)</td><td>\(P_o=V_{pk}^2/2R_L\); \(P_s=2V_{CC}V_{pk}/\pi R_L\); \(\eta=\pi V_{pk}/4V_{CC}\)</td></tr>
<tr><td>Convertidores (21)</td><td>Buck: \(V_o=DV_{in}\), \(\Delta I_L=(V_{in}-V_o)D/Lf\); boost: \(V_o=V_{in}/(1-D)\)</td></tr></table></div>
</section>

<section>

<div class="tablewrap"><table class="tbl"><tr><th>Concepto</th><th>Fórmula</th></tr>
<tr><td>Realimentación (22)</td><td>\(A_f=A/(1+A\beta)\approx1/\beta\)</td></tr>
<tr><td>Inversor, no inversor (22)</td><td>\(A_v=-R_f/R_1\); \(A_v=1+R_f/R_g\); \(f_{-3\mathrm{dB}}=\mathrm{GBW}/A_v\)</td></tr>
<tr><td>Velocidad de respuesta (22)</td><td>\(f_{max}=\mathrm{SR}/(2\pi V_{pk})\)</td></tr>

<tr><td>Integrador, derivador (23)</td><td>\(v_o=-\tfrac1{RC}\int v_i\,\mathrm{d}t\); \(v_o=-RC\,\mathrm{d}v_i/\mathrm{d}t\)</td></tr>
<tr><td>Sallen–Key (23)</td><td>\(f_0=1/(2\pi RC)\); \(Q=1/(3-K)\); \(K=1+R_b/R_a\)</td></tr>
<tr><td>Schmitt (24)</td><td>\(V_{TH,TL}=\pm(R_1/R_2)V_{sat}\)</td></tr>
<tr><td>Relajación con A.O. (24)</td><td>\(f=1/[2RC\ln((1+\beta)/(1-\beta))]\)</td></tr>
<tr><td>Wien (24)</td><td>\(f_0=1/(2\pi RC)\); \(K>3\)</td></tr>
<tr><td>555 (24)</td><td>Astable: \(f=1.44/[(R_1+2R_2)C]\); \(D=(R_1+R_2)/(R_1+2R_2)\); monoestable: \(T=1.1RC\)</td></tr>
<tr><td>Regulador lineal (25)</td><td>\(P_d=(V_{in}-V_o)I_o+V_{in}I_Q\); LM317: \(V_o=1.25(1+R_2/R_1)+I_{ADJ}R_2\)</td></tr>
<tr><td>SCR, triac (26)</td><td>Media onda: \(\bar V=V_{pk}(1+\cos\alpha)/2\pi\); onda completa: \(V_{rms}=V_{pk}/\sqrt2\sqrt{(\pi-\alpha+\sin2\alpha/2)/\pi}\)</td></tr>
<tr><td>Optoacoplador (26)</td><td>\(\mathrm{CTR}=I_C/I_F\); \(R_{in}=(V_{in}-V_F)/I_F\)</td></tr></table></div>
