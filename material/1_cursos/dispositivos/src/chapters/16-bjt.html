<template class="chapter-src" data-id="bjt" data-num="16" data-title="El transistor bipolar de unión (BJT)" data-part="Parte IV · Transistores" data-short="Estructura npn y pnp, principio de funcionamiento y ganancias α y β, ecuaciones de Ebers–Moll y efecto Early, regiones de operación, curvas de entrada y salida, dependencia con la temperatura y parámetros de pequeña señal g_m, r_π y r_o">
<p class="lead">El transistor bipolar fue el primer dispositivo capaz de <b>amplificar</b> con un cristal: una corriente pequeña en un terminal controla una corriente mucho mayor entre otros dos. De ahí su nombre (<i>transfer resistor</i>) y su papel: es la base de los amplificadores, de los interruptores electrónicos y, mediante millones de ellos, de los primeros circuitos integrados. Sigue siendo insustituible en etapas analógicas de alta velocidad y bajo ruido, en amplificadores de potencia y en la lógica ECL. Este capítulo explica cómo funciona físicamente, cómo se modela y cómo se leen sus curvas.</p>

<section>
<h2>Estructura y símbolo</h2>
<p>Un BJT (<i>bipolar junction transistor</i>) son tres regiones de silicio dopadas en sándwich: <b>emisor</b>, <b>base</b> y <b>colector</b>. En un <b>npn</b> las regiones son n–p–n; en un <b>pnp</b>, p–n–p. Hay dos uniones: la base–emisor (BE) y la base–colector (BC). La región de la base es muy delgada (0.1–1 µm) y poco dopada; el emisor está muy dopado; el colector es de dopado moderado y de gran área. En el símbolo, la flecha está siempre en el emisor y apunta en el sentido de la corriente convencional: <i>hacia fuera</i> en el npn («no apunta»: <b>n</b>ot <b>p</b>ointing in) y <i>hacia dentro</i> en el pnp.</p>
</section>

<section>
<h2>Principio de funcionamiento</h2>
<p>En operación normal (<b>región activa directa</b>) la unión BE se polariza en directa y la BC en inversa. Para un npn: (1) la unión BE inyecta <b>electrones</b> del emisor a la base (y una pequeña corriente de huecos de la base al emisor); (2) la base es tan delgada, menor que la longitud de difusión, que casi todos los electrones la atraviesan por difusión sin recombinarse; (3) al llegar a la unión BC, el campo de la zona de vaciamiento (polarizada en inversa) los arrastra al colector. Solo una pequeña fracción se recombina en la base: esa es la corriente de base, que repone los huecos perdidos. Las corrientes cumplen</p>
<div class="eq key" data-name="Corrientes y ganancias del BJT en región activa">\[I_E=I_C+I_B\qquad I_C=\alpha\,I_E=\beta\,I_B\qquad \beta=\frac{\alpha}{1-\alpha}\qquad \alpha=\frac{\beta}{\beta+1}\qquad I_E=(\beta+1)I_B\]</div>
<p>\(\alpha\) es casi 1 (0.99–0.998) y \(\beta\) (también \(h_{FE}\)) está entre 50 y 500: un 2N3904 con \(\beta=416\) tiene \(\alpha=0.9976\). Lo esencial es que \(I_C\) <b>no depende</b> de la tensión \(V_{CE}\) (casi) sino de la tensión base–emisor: la unión BE controla cuántos portadores se inyectan. Es un dispositivo controlado por tensión que, por la delgadez de la base, parece controlado por la corriente de base: \(I_C=\beta I_B\).</p>
</section>

<section>
<h2>Ecuaciones de Ebers–Moll y efecto Early</h2>
<p>Como la inyección es exponencial (capítulo 12), la corriente del colector en región activa depende de la tensión de la base como en un diodo:</p>
<div class="eq key" data-name="Ebers–Moll en región activa (con efecto Early)">\[I_C=I_S\left(e^{V_{BE}/V_T}-1\right)\left(1+\frac{V_{CE}}{V_A}\right)\qquad I_B=\frac{I_C}{\beta}\qquad g_m=\frac{\mathrm{d}I_C}{\mathrm{d}V_{BE}}=\frac{I_C}{V_T}\]</div>
<p>La corriente de saturación \(I_S\) es de unos \(10^{-14}\) A (6.7 fA en el 2N3904): con \(I_C=1\) mA, \(V_{BE}=V_T\ln(I_C/I_S)=0.665\) V; con 10 mA, 0.725 V: una variación de solo 60 mV por década. La <b>transconductancia</b> \(g_m=I_C/V_T\) vale 38.7 mS a 1 mA (a 25 mA, 1 S): cuanto más corriente, más ganancia. La <b>tensión de Early</b> \(V_A\) (50–150 V en un transistor de señal) describe que la base se estrecha al aumentar \(V_{CE}\), con un ligero aumento de \(I_C\): una resistencia de salida finita \(r_o=(V_A+V_{CE})/I_C\) (si \(V_A=74\) V y \(I_C=1\) mA, \(r_o\approx79\) kΩ). En el modelo completo de Ebers–Moll cada unión conduce como un diodo y el transistor es la suma de dos fuentes de corriente controladas, lo que permite modelar el corte, la región activa, la saturación y el modo inverso con las mismas ecuaciones.</p>
</section>

<section>
<h2>Regiones de operación</h2>
<div class="tablewrap"><table class="tbl"><tr><th>Región</th><th>Unión BE</th><th>Unión BC</th><th>Comportamiento (npn)</th><th>Uso</th></tr>
<tr><td><b>Corte</b></td><td>inversa o &lt; 0.5 V</td><td>inversa</td><td>\(I_C\approx0\); interruptor abierto</td><td>Conmutación: «apagado»</td></tr>
<tr><td><b>Activa directa</b></td><td>directa (≈ 0.65 V)</td><td>inversa</td><td>\(I_C=\beta I_B\): fuente de corriente controlada</td><td>Amplificación</td></tr>
<tr><td><b>Saturación</b></td><td>directa</td><td>directa</td><td>\(V_{CE}\approx0.1\)–0.3 V; \(I_C<\beta I_B\) (β forzada menor)</td><td>Conmutación: «encendido»</td></tr>
<tr><td><b>Activa inversa</b></td><td>inversa</td><td>directa</td><td>β muy baja; no se usa</td><td>Lógica TTL</td></tr></table></div>
<p>En la simulación de abajo, un 2N3904 con \(R_C=1\) kΩ, \(V_{CC}=12\) V y una fuente de base \(V_B\) a través de 10 kΩ: con \(V_B=0.3\) V el transistor está en <b>corte</b> (\(V_{CE}=12\) V); con 0.6 V empieza a conducir (\(I_C=0.07\) mA); con 0.7 V ya está en <b>activa</b> (\(I_B=2.75\ \mu\)A, \(I_C=1.30\) mA, \(V_{CE}=10.7\) V); con 1 V está en el límite (\(I_B=27\ \mu\)A, \(V_{CE}=0.80\) V) y con 2 V o más en <b>saturación</b> (\(I_B=127\ \mu\)A, \(V_{CE}=0.09\) V, \(I_C=11.9\) mA, \(\beta_{forzada}=94\)): ya no sirve aumentar la corriente de base porque la corriente de colector la limita el circuito externo, \((V_{CC}-V_{CE,sat})/R_C\).</p>
<div class="sim" data-sim="c16-modos" data-title="Recorrido por las regiones de funcionamiento de un BJT"></div>
<div class="sim-guide"><ul>
<li>Con \(V_B=0.3\) V: corte. Con \(V_B=0.7\) V: región activa con \(I_C=1.3\) mA y \(\beta=472\) (algo mayor que la nominal de 416 por el efecto Early con \(V_{CE}=10.7\) V). Con 2 V: saturación, \(V_{CE}=0.09\) V y la \(\beta\) forzada cae a 94; con 5 V, a 28.</li>
<li>Entre unos 0.65 V y 1 V de \(V_B\) el colector pasa de 11.6 V a 0.8 V: el tramo activo es muy estrecho en términos de tensión de base. Es la característica exponencial: 60 mV multiplican \(I_C\) por diez.</li>
<li>Aumente \(R_B\) a 100 kΩ: se necesita más \(V_B\) para llegar a saturación; el criterio es \(I_B\ge I_{C,sat}/\beta\) (≈ 29 µA para 12 mA con \(\beta=416\), o 120 µA con \(\beta\) forzada de 100).</li>
</ul></div>
</section>

<section>
<h2>Curvas características</h2>
<p>La <b>característica de entrada</b> (\(I_B\) frente a \(V_{BE}\)) es la de un diodo. La <b>de transferencia</b> (\(I_C\) frente a \(V_{BE}\)) es la exponencial de arriba, que en escala logarítmica es una recta con 60 mV por década. La más usada es la familia de <b>curvas de salida</b>: \(I_C\) en función de \(V_{CE}\) para distintos valores de \(I_B\). Para \(V_{CE}\gtrsim0.3\) V cada curva es casi horizontal (región activa; la pendiente pequeña es el efecto Early); a la izquierda cae rápidamente a cero (saturación). Con \(I_B=30\ \mu\)A y \(\beta=416\), \(I_C=12.5\) mA; con 50 µA, 22 mA. Las curvas de la simulación se obtienen con el trazador del Taller, de la misma forma que con un trazador de curvas real.</p>
<div class="sim" data-sim="c16-curvas" data-title="Curvas de salida de un 2N3904: I_C frente a V_CE para varias I_B"></div>
<div class="sim-guide"><ul>
<li>En la pestaña «Curvas» se trazan las cinco curvas de 10 a 50 µA. Cada una es una recta casi horizontal con una pendiente leve (la resistencia de salida \(r_o\)).</li>
<li>Extrapolando hacia atrás las rectas de todas las curvas se cortan en un mismo punto del eje \(V_{CE}\), en \(-V_A=-74\) V: es la definición geométrica de la tensión de Early.</li>
<li>Elija el BC547 (\(V_A=80\) V, β = 300) o el TIP31C (β = 70 con \(I_B\) mayor): cambia la altura de las curvas, no su forma.</li>
</ul></div>
</section>

<section>
<h2>Temperatura, β y límites</h2>
<p>\(V_{BE}\) <b>disminuye</b> unos 2 mV/K a corriente fija (\(\mathrm{d}V_{BE}/\mathrm{d}T\approx(V_{BE}-V_{g0})/T\)) y, a tensión fija, \(I_C\) aumenta alrededor de un 8–10 % por kelvin (se duplica cada ~10 K). \(\beta\) <b>aumenta</b> con la temperatura (~0.5 %/K) y varía con la corriente: máxima a corrientes intermedias y menor tanto a corrientes muy bajas (recombinación en la unión) como muy altas (alta inyección). Entre ejemplares del mismo modelo la dispersión de \(\beta\) es de 2:1 o más (110 a 800 en un BC547): <b>un buen diseño no debe depender del valor de β</b> (capítulo 17). Los límites se dan en la hoja de datos: \(I_{C,max}\), las tensiones de ruptura \(BV_{CEO}\) (con la base abierta, 40–45 V en señal), \(BV_{CBO}\) y \(BV_{EBO}\) (solo 5–7 V), la potencia máxima \(P_D\) (con su derrateo térmico) y el área de operación segura (<i>SOA</i>), que limita el producto \(V_{CE}I_C\) en el tiempo (segunda ruptura).</p>
<p>Las tres magnitudes de pequeña señal, en un punto de operación \(I_C\): \(g_m=I_C/V_T\), \(r_\pi=\beta/g_m=\beta V_T/I_C\) (resistencia que ve la señal en la base: 10.7 kΩ a 1 mA con β = 416) y \(r_o=(V_A+V_{CE})/I_C\). Con ellas se calculan los amplificadores del capítulo 18.</p>
<div class="sim" data-sim="c16-ebersmoll" data-title="Característica I_C – V_BE (Ebers–Moll): exponencial, g_m y temperatura"></div>
<div class="sim-guide"><ul>
<li>En escala logarítmica la curva es una recta; cada 60 mV de \(V_{BE}\) multiplican \(I_C\) por 10 (\(V_T\ln2=17.9\) mV lo duplica). El cursor en 0.65 V da \(I_C\approx0.7\) mA, \(g_m=27\) mS y \(r_\pi=15\) kΩ.</li>
<li>Suba la temperatura a 400 K: la curva se desplaza hacia la izquierda unos 200 mV (−2 mV/K): el mismo \(V_{BE}\) da una corriente mucho mayor. Es el origen de la <b>fuga térmica</b>.</li>
<li>El transistor de potencia TIP31C tiene una \(I_S\) mayor y su curva está desplazada: con \(V_{BE}=0.65\) V conduce unos 80 mA.</li>
</ul></div>
</section>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un transistor tiene \(\beta=200\) y \(I_B=50\ \mu\)A en región activa. Calcule \(I_C\), \(I_E\) y \(\alpha\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li>\(I_C=\beta I_B=200\cdot50\ \mu\text{A}=10\) mA.</li>
<li>\(I_E=I_C+I_B=10.05\) mA.</li>
<li>\(\alpha=\beta/(\beta+1)=200/201=0.995\).</li>
<li><b>Resultado.</b> <span class="ans">10 mA, 10.05 mA y 0.995.</span></li></ol></details></li>
<li><span class="lvl">Básico</span>Un transistor con \(I_S=10^{-14}\) A conduce \(I_C=1\) mA. Calcule \(V_{BE}\) y \(g_m\) a 300 K (\(V_T=25.85\) mV).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li>\(V_{BE}=V_T\ln(I_C/I_S)=0.02585\ln(10^{11})=0.02585\times25.33=0.655\) V.</li>
<li>\(g_m=I_C/V_T=10^{-3}/0.02585=38.7\) mS.</li>
<li><b>Resultado.</b> <span class="ans">0.655 V y 38.7 mS.</span></li></ol></details></li>
<li><span class="lvl">Intermedio</span>El \(V_{BE}\) de un transistor es 0.65 V a 25 °C con \(I_C=1\) mA. ¿Cuál será a 85 °C con la misma corriente? ¿Y qué corriente tendría a 85 °C si \(V_{BE}\) se mantuviera en 0.65 V (≈ 8 %/K)?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li>\(\Delta T=60\) K; \(\Delta V_{BE}=-2\ \text{mV/K}\times60=-120\) mV: \(V_{BE}=0.53\) V.</li>
<li>A \(V_{BE}\) fija: \(I_C\) crece un factor \((1.08)^{60}\approx100\): ¡100 mA!</li>
<li><b>Resultado.</b> <span class="ans">0.53 V; la corriente se multiplicaría por ≈ 100: nunca se debe polarizar un BJT con una tensión \(V_{BE}\) fija.</span></li></ol></details></li>
<li><span class="lvl">Intermedio</span>Un 2N3904 (\(V_A=74\) V) tiene \(I_C=2\) mA con \(V_{CE}=5\) V. ¿Cuánto vale \(r_o\) y en cuánto cambia \(I_C\) si \(V_{CE}\) pasa a 10 V?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li>\(r_o=(V_A+V_{CE})/I_C=79/2\ \text{mA}=39.5\) kΩ.</li>
<li>\(\Delta I_C=\Delta V_{CE}/r_o=5/39.5\ \text{k}\Omega=0.127\) mA (6.3 %).</li>
<li><b>Resultado.</b> <span class="ans">\(r_o=39.5\) kΩ; la corriente sube a 2.13 mA.</span></li></ol></details></li>
<li><span class="lvl">Avanzado</span>Con la fuente de base del montaje (VCC = 12 V, \(R_C=1\) kΩ), ¿qué corriente de base garantiza saturación fuerte (β forzada = 10) si \(V_{CE,sat}=0.2\) V? ¿Y qué \(R_B\) hace falta con \(V_B=5\) V?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li>\(I_{C,sat}=(12-0.2)/1\ \text{k}\Omega=11.8\) mA.</li>
<li>\(I_B=I_{C,sat}/\beta_{for}=1.18\) mA.</li>
<li>\(R_B=(V_B-V_{BE})/I_B=(5-0.75)/1.18\ \text{mA}=3.6\) kΩ → 3.3 kΩ (E12).</li>
<li><b>Resultado.</b> <span class="ans">\(I_B=1.18\) mA y \(R_B\approx3.3\) kΩ (la regla práctica es forzar β = 10 para asegurar la saturación).</span></li></ol></details></li>
</ol>
</section>
