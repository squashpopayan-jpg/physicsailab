<template class="chapter-src" data-id="union-pn" data-num="12" data-title="La unión PN" data-part="Parte III · Semiconductores y diodos" data-short="Región de vaciamiento y potencial de contacto, campo y anchura según la polarización, ecuación del diodo de Shockley y corriente de saturación, dependencia con la temperatura, ruptura por avalancha y Zener, capacitancias de unión y de difusión">
<p class="lead">Si se pone en contacto un cristal tipo p con uno tipo n —aunque sea del mismo material y sin ninguna soldadura entre ellos, sino por simple difusión de impurezas durante la fabricación— aparece un dispositivo que conduce muy bien en un sentido y casi nada en el otro: la <b>unión PN</b>. Es la pieza elemental de los diodos, de los transistores bipolares (dos uniones) y de las celdas solares y los LED. Su comportamiento, deducido a partir de la física del capítulo anterior, se resume en una ecuación exponencial sencilla: la <b>ecuación del diodo de Shockley</b>.</p>

<section>
<h2>La unión en equilibrio</h2>
<p>Al juntar los dos lados, los electrones del n (muchos) difunden hacia el p (pocos) y los huecos del p hacia el n. Al marcharse, dejan atrás los iones fijos de las impurezas sin compensar (donores positivos en el n, aceptores negativos en el p): una zona, la <b>región de vaciamiento</b> (o de carga espacial), casi sin portadores móviles, con una carga positiva a un lado y negativa al otro. Esa carga crea un <b>campo eléctrico</b> dirigido de n hacia p que se opone a la difusión, hasta que ambas se equilibran. La caída de potencial a través de la región es el <b>potencial de contacto</b>:</p>
<div class="eq key" data-name="Unión abrupta en equilibrio">\[V_0=V_T\ln\frac{N_AN_D}{n_i^2}\qquad W=\sqrt{\frac{2\varepsilon_s}{q}\left(\frac1{N_A}+\frac1{N_D}\right)(V_0-V)}\qquad E_{max}=\frac{q\,N_D\,x_n}{\varepsilon_s}\qquad x_n=W\frac{N_A}{N_A+N_D}\]</div>
<p>(\(V\) es la tensión externa aplicada, positiva en directa.) Para silicio con \(N_A=N_D=10^{16}\) cm⁻³ y \(\varepsilon_s=11.7\,\varepsilon_0\): \(V_0=0.714\) V, \(W=0.43\ \mu\)m y un campo máximo de 33 kV/cm (3.3 MV/m) en el centro. La región se extiende <i>más</i> hacia el lado menos dopado: con \(N_A=10^{17}\) y \(N_D=10^{15}\) la anchura es de 0.97 µm y casi toda cae del lado n. Este es el caso de las uniones asimétricas \(p^+n\), muy frecuentes. El potencial de contacto <b>no se puede medir con un voltímetro</b>: cada contacto metal–semiconductor añade su propia diferencia de potencial y la suma alrededor del circuito es cero. Pero determina cuánta tensión externa hay que aplicar para vencer la barrera.</p>
<div class="sim" data-sim="c12-union" data-title="La unión PN: carga, campo y potencial según la polarización"></div>
<div class="sim-guide"><ul>
<li>Con \(N_A=N_D=10^{16}\) cm⁻³ y polarización cero: \(V_0=0.714\) V, \(W=0.43\ \mu\)m, \(E_{max}=33\) kV/cm. El campo es triangular y el potencial, una curva en «S».</li>
<li>Aplique −5 V (polarización inversa): la región se ensancha a 1.2 µm y el campo máximo sube a unos 94 kV/cm: la barrera crece de 0.71 V a 5.7 V.</li>
<li>Con +0.6 V (directa) la región se estrecha a 0.17 µm y la barrera cae a solo 0.11 V: la corriente de difusión supera a la de campo.</li>
</ul></div>
</section>

<section>
<h2>Polarización y la ecuación del diodo</h2>
<p>Con una tensión <b>inversa</b> (\(V&lt;0\), positivo en el lado n) la barrera crece, la región se ensancha, y solo pueden cruzar los portadores minoritarios que llegan a los bordes y son barridos por el campo: una pequeña corriente inversa (la <i>corriente de saturación</i> \(I_S\)). Con una tensión <b>directa</b> (\(V>0\)) la barrera baja y los portadores mayoritarios se inyectan al otro lado en una cantidad que crece <i>exponencialmente</i> con \(V\) (la distribución de Boltzmann): los electrones inyectados en el p y los huecos en el n son minoritarios que difunden y se recombinan. Resolviendo la ecuación de difusión en las regiones neutras se obtiene la <b>ecuación del diodo de Shockley</b>:</p>
<div class="eq key" data-name="Ecuación del diodo ideal">\[I=I_S\left(e^{V/nV_T}-1\right)\qquad I_S=q\,A\,n_i^2\left(\frac{D_p}{L_pN_D}+\frac{D_n}{L_nN_A}\right)\qquad V_T=\frac{kT}{q}\]</div>
<p>\(n\) es el <b>factor de idealidad</b> (1 para difusión pura, hasta 2 con recombinación en la región de carga espacial). Para el diodo de silicio simétrico anterior con \(A=10^{-4}\) cm² y tiempos de vida de 1 µs: \(I_S=1.4\) fA (\(1.4\times10^{-15}\) A). Con ello, 0.5 V dan 0.36 µA, 0.6 V dan 17 µA y 0.7 V dan 0.82 mA: por cada 60 mV (\(V_T\ln10=59.5\) mV) la corriente se multiplica por 10. Este es el origen de la «tensión de 0.6–0.7 V» de un diodo de silicio: no es un umbral físico sino el punto donde, con las corrientes habituales (0.1–10 mA), la exponencial alcanza ese valor. En inversa, \(I\to-I_S\) casi constante; en la práctica la fuga real, dominada por generación en la región de carga espacial, es mayor y crece con la tensión. Los diodos de germanio (\(I_S\) mil millones de veces mayor) conducen con 0.2–0.3 V; los de carburo de silicio y los LED azules (\(E_g\) grande) con 2–3 V. En general \(V_F\approx E_g/q-\)(0.4 a 0.5 V).</p>
<div class="sim" data-sim="c12-iv" data-title="Característica I–V de un diodo en escala lineal y logarítmica"></div>
<div class="sim-guide"><ul>
<li>En la escala lineal el diodo parece un interruptor: nada hasta ~0.6 V y luego casi vertical. En la <b>logarítmica</b> es una recta con pendiente de 60 mV por década (con \(n=1\)) en un rango enorme de corrientes: de nA a mA.</li>
<li>Cambie al 1N5819 (Schottky): la recta está desplazada a la izquierda (menor \(V_F\)) porque su \(I_S\) es 100 000 veces mayor.</li>
<li>Con corrientes muy altas la curva se aparta de la recta: la resistencia en serie del semiconductor y de los contactos (\(R_S\), de 0.04 a 0.6 Ω) añade \(IR_S\).</li>
</ul></div>
</section>

<section>
<h2>Efecto de la temperatura</h2>
<p>\(I_S\) depende de \(n_i^2\), y por tanto de \(T^3e^{-E_g/kT}\): crece alrededor de un <b>15 % por kelvin</b> (se duplica cada 5 K). Pero \(V_T\) también crece con \(T\). A corriente fija, la tensión directa disminuye aproximadamente \(\mathrm{d}V_F/\mathrm{d}T\approx(V_F-V_{g0})/T\), con \(V_{g0}\approx1.2\) V: para \(V_F=0.65\) V, unos <b>−1.8 mV/K</b> (se suele redondear a −2 mV/K). Esto permite usar un diodo como termómetro (con una corriente constante, 1 mV de cambio = 0.5 K) pero también implica que un diodo o un transistor que se calienta conduce más y por tanto se calienta más: es el principio de la <b>fuga térmica</b> (capítulo 17).</p>
<div class="sim" data-sim="c12-temperatura" data-title="Un diodo como termómetro: V_D con corriente constante"></div>
<div class="sim-guide"><ul>
<li>Con 1 mA y un 1N4148 (modelo del simulador): a 25 °C, \(V_D\approx0.59\) V; a 125 °C, \(V_D\approx0.38\) V. La pendiente es de unos −2.0 mV/K, de acuerdo con la teoría.</li>
<li>Con una corriente menor (10 µA) la tensión es menor (0.38 V a 25 °C) y la pendiente es mayor en valor absoluto (≈ −2.7 mV/K), porque \(V_F-V_{g0}\) es más negativa.</li>
</ul></div>
</section>

<section>
<h2>Ruptura inversa: avalancha y Zener</h2>
<p>Si la tensión inversa sigue creciendo llega un valor, la <b>tensión de ruptura</b> \(V_{BR}\), en que la corriente inversa aumenta bruscamente sin que la tensión suba apenas (el diodo no se destruye si la potencia se limita). Hay dos mecanismos:</p>
<ul>
<li><b>Avalancha</b> (\(V_{BR}\gtrsim7\) V): los portadores aceleran en el campo alto de la región de carga espacial, ganan energía y generan nuevos pares electrón–hueco al chocar, que a su vez los generan: una multiplicación en cadena. \(V_{BR}\) <i>aumenta</i> con la temperatura (coeficiente positivo).</li>
<li><b>Zener</b> (túnel, \(V_{BR}\lesssim5\) V, uniones muy dopadas y estrechas): el campo es tan intenso (\(>10^6\) V/cm) que los electrones pasan por efecto túnel de la banda de valencia a la de conducción. Su coeficiente de temperatura es negativo. Entre 5 y 7 V coexisten y el coeficiente se anula: los diodos de ~5.6 V son los más estables.</li>
</ul>
<p>Para una unión \(p^+n\), \(V_{BR}\approx60\,(E_g/1.1)^{3/2}(N_B/10^{16})^{-3/4}\) V (con \(N_B\) en cm⁻³ del lado poco dopado): 347 V con \(10^{15}\), 62 V con \(10^{16}\), 11 V con \(10^{17}\) y 1.9 V con \(10^{18}\). Se fabrican diodos Zener y reguladores con esta propiedad (capítulo 15); los diodos rectificadores se diseñan para no entrar nunca en ruptura (1N4007: 1000 V).</p>
</section>

<section>
<h2>Capacitancias de la unión</h2>
<p>La región de vaciamiento es un dieléctrico entre dos zonas conductoras: se comporta como un condensador, la <b>capacitancia de unión</b> o de transición, que depende de la tensión porque \(W\) depende de ella. Para una unión abrupta:</p>
<div class="eq key" data-name="Capacitancia de unión y de difusión">\[C_j=\frac{\varepsilon_sA}{W}=\frac{C_{j0}}{\left(1-V/V_0\right)^{m}}\quad(m=\tfrac12\ \text{abrupta},\ \tfrac13\ \text{gradual})\qquad C_d=\frac{\tau_T\,I}{V_T}\ \ (\text{directa})\]</div>
<p>En el ejemplo con \(A=10^{-4}\) cm², \(C_{j0}=2.4\) pF; con −5 V baja a 0.85 pF y con −10 V a 0.62 pF. Esta propiedad se aprovecha en el <b>varicap</b> (capítulo 15): un diodo en inversa que actúa como condensador controlado por tensión y sirve para sintonizar osciladores y receptores. En <b>directa</b> predomina la <b>capacitancia de difusión</b>: la carga de minoritarios almacenada, proporcional a la corriente: con \(\tau_T=3\ \mu\)s (1N4007) y 10 mA, \(C_d\approx1.2\ \mu\)F; con \(\tau_T=4\) ns (1N4148), 1.5 nF. Esa carga almacenada obliga a un tiempo de recuperación inversa \(t_{rr}\) al cambiar rápidamente de directa a inversa: el diodo sigue conduciendo en sentido inverso hasta que se evacúa la carga. Los diodos de señal (1N4148, 4 ns) y los Schottky (sin minoritarios, picosegundos) son rápidos; los rectificadores de red (1N4007, 3 µs) no.</p>
<div class="sim" data-sim="c12-capacidad" data-title="Capacitancia de la unión inversa y sintonía con un varicap"></div>
<div class="sim-guide"><ul>
<li>La capacitancia disminuye con la tensión inversa como \((1-V/V_0)^{-1/2}\): de 2.4 pF sin polarizar a 0.85 pF con −5 V y 0.62 pF con −10 V.</li>
<li>Un circuito resonante con \(L=100\ \mu\)H y un varicap de 40 pF resuena a 2.5 MHz; si la tensión inversa sube, \(C\) baja y la frecuencia sube: así se sintoniza una emisora con un potenciómetro.</li>
</ul></div>
</section>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Para una unión PN de silicio con \(N_A=10^{17}\) cm⁻³ y \(N_D=10^{15}\) cm⁻³ a 300 K, calcule el potencial de contacto (\(n_i=10^{10}\) cm⁻³).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li>\(V_0=V_T\ln(N_AN_D/n_i^2)=0.02585\ln(10^{32}/10^{20})\).</li>
<li>\(\ln(10^{12})=27.63\); \(V_0=0.02585\times27.63=0.714\) V.</li>
<li><b>Resultado.</b> <span class="ans">0.714 V (igual que con \(10^{16}\)/\(10^{16}\), porque el producto \(N_AN_D\) es el mismo).</span></li></ol></details></li>
<li><span class="lvl">Básico</span>¿Cuánto vale la corriente de un diodo con \(I_S=1.4\) fA a 0.6 V, 0.66 V y 0.72 V (T = 300 K)? ¿Cuántas veces aumenta por cada 60 mV?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li>\(I(0.6)=1.4\times10^{-15}e^{0.6/0.02585}=1.4\times10^{-15}\cdot1.2\times10^{10}=17\ \mu\)A.</li>
<li>\(I(0.66)=1.4\times10^{-15}e^{25.53}=1.4\times10^{-15}\cdot1.2\times10^{11}=0.17\) mA.</li>
<li>\(I(0.72)=1.4\times10^{-15}e^{27.85}=1.4\times10^{-15}\cdot1.2\times10^{12}=1.7\) mA.</li>
<li>Cada 59.5 mV se multiplica por 10.</li>
<li><b>Resultado.</b> <span class="ans">17 µA, 0.17 mA y 1.7 mA; ×10 por cada 60 mV.</span></li></ol></details></li>
<li><span class="lvl">Intermedio</span>Un diodo de silicio con 1 mA tiene 0.65 V a 25 °C. ¿Qué tensión tendrá a 100 °C, si \(\mathrm dV/\mathrm dT=-1.8\) mV/K?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li>\(\Delta T=75\) K.</li>
<li>\(\Delta V=-1.8\ \text{mV/K}\times75=-135\) mV.</li>
<li>\(V_D(100^\circ\text{C})=0.65-0.135=0.515\) V.</li>
<li><b>Resultado.</b> <span class="ans">≈ 0.515 V.</span></li></ol></details></li>
<li><span class="lvl">Intermedio</span>Calcule la anchura de la región de vaciamiento y la capacitancia de una unión de \(10^{-4}\) cm² con \(N_A=N_D=10^{16}\) cm⁻³ a −5 V.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li>\(V_0=0.714\) V; \(V_0-V=5.714\) V.</li>
<li>\(W=\sqrt{\tfrac{2\cdot1.036\times10^{-12}\cdot5.714}{1.602\times10^{-19}}\cdot\tfrac{2}{10^{16}}}=1.22\times10^{-4}\) cm \(=1.22\ \mu\)m.</li>
<li>\(C_j=\varepsilon_sA/W=1.036\times10^{-12}\cdot10^{-4}/1.22\times10^{-4}=0.85\) pF.</li>
<li><b>Resultado.</b> <span class="ans">W = 1.22 µm y \(C_j=0.85\) pF.</span></li></ol></details></li>
<li><span class="lvl">Avanzado</span>Un oscilador usa \(L=100\ \mu\)H y un varicap que varía de 80 pF (2 V inversos) a 20 pF (12 V inversos). Calcule el intervalo de frecuencias de sintonía y la relación entre extremos.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li>\(f=1/(2\pi\sqrt{LC})\): con 80 pF, \(f=1/(2\pi\sqrt{10^{-4}\cdot8\times10^{-11}})=1.78\) MHz.</li>
<li>Con 20 pF: \(f=3.56\) MHz.</li>
<li>Relación \(\sqrt{80/20}=2\).</li>
<li><b>Resultado.</b> <span class="ans">De 1.78 a 3.56 MHz: una octava completa con una variación de 4 : 1 de la capacitancia.</span></li></ol></details></li>
</ol>
</section>
