<p class="lead">Las simulaciones de este curso no son dibujos animados: cada circuito se resuelve con un <b>motor de análisis nodal modificado</b> con iteración de Newton–Raphson (el mismo método que usan los simuladores tipo SPICE), con integración trapezoidal para los transitorios y análisis de pequeña señal en el dominio de la frecuencia. Este apéndice recoge las pruebas automáticas que contrastan el motor con bibliotecas científicas independientes, con soluciones analíticas exactas y con datos de las hojas de datos, además de las cifras de varios problemas resueltos de los capítulos.</p>
<section>
<h2>Cómo se valida</h2>
<ul>
<li><b>NumPy y SciPy</b> (referencias independientes): redes resistivas contra <code>numpy.linalg.solve</code>; carga de un RC contra <code>scipy.integrate.solve_ivp</code>; respuesta en frecuencia de un filtro de segundo orden contra <code>scipy.signal.freqs</code>; punto de operación de un diodo con <code>scipy.optimize.brentq</code> y de un transistor con <code>fsolve</code>; transformada de Fourier contra <code>numpy.fft</code>.</li>
<li><b>SymPy</b> (cálculo simbólico exacto): la red RC serie–paralelo del oscilador de Wien.</li>
<li><b>Literatura y resultados analíticos</b>: la frecuencia de −3 dB de un filtro RC, la resonancia RLC, las ganancias de amplificadores con A.O. (con ganancia de lazo abierto finita), las ecuaciones del MOSFET y del JFET, los reguladores (7805, 7812, LM317), la frecuencia del 555, el enclavamiento del SCR, el Zener, el rectificador con filtro y la deriva térmica del diodo.</li>
<li><b>Problemas</b>: cada cifra de un problema resuelto se recalcula con una fórmula independiente.</li>
</ul>
