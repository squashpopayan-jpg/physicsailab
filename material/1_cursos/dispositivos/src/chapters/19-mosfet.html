<p class="lead">El transistor de efecto de campo metal–óxido–semiconductor (MOSFET) es el dispositivo más fabricado de la historia: un procesador moderno contiene decenas de miles de millones. A diferencia del BJT, <b>no toma corriente por el terminal de control</b>: una tensión aplicada a la <b>puerta</b>, aislada del canal por una película de óxido de unos nanómetros, crea o suprime por campo eléctrico un canal conductor entre <b>fuente</b> y <b>drenador</b>. Es un dispositivo controlado por tensión, con resistencia de entrada casi infinita, y esa propiedad, junto con su facilidad de integración y su bajo consumo, lo convirtió en la base de la electrónica digital (lógica CMOS), de las memorias y de los interruptores de potencia. Este capítulo explica cómo funciona, cómo se modela y cómo se usa como interruptor, inversor lógico y amplificador.</p>

<section>
<h2>Estructura y principio de funcionamiento</h2>
<p>Un MOSFET de <b>enriquecimiento de canal n</b> (NMOS) se construye sobre un sustrato de silicio tipo p, con dos regiones n⁺ muy dopadas (fuente y drenador) separadas por una región de longitud \(L\) y ancho \(W\) sobre la cual hay una capa de dióxido de silicio de espesor \(t_{ox}\) y encima un electrodo conductor, la puerta (antes de aluminio, hoy silicio policristalino o metal). La estructura puerta–óxido–sustrato es un <b>condensador</b> de capacitancia por unidad de área \(C_{ox}=\varepsilon_{ox}/t_{ox}\) (con \(t_{ox}=2\) nm, \(C_{ox}\approx17\) mF/m²).</p>
<p>Con \(V_{GS}=0\) entre fuente y drenador hay dos uniones pn en oposición: no circula corriente (<b>corte</b>). Al aplicar una tensión positiva a la puerta, el campo repele los huecos de la superficie del sustrato (región de deplexión) y, cuando \(V_{GS}\) supera la <b>tensión umbral</b> \(V_{th}\), atrae electrones minoritarios que forman una capa de <b>inversión</b> (el canal n) que conecta fuente y drenador. Cuanto mayor es \(V_{GS}-V_{th}\) (la <b>sobretensión</b> \(V_{ov}\)), más electrones hay en el canal y menor es su resistencia. La tensión umbral depende del dopado del sustrato, del espesor del óxido y de las cargas atrapadas:</p>
<div class="eq key" data-name="Tensión umbral del MOSFET">\[V_{th}=V_{FB}+2\phi_F+\frac{\sqrt{2\,q\,\varepsilon_{Si}N_A\,(2\phi_F)}}{C_{ox}}\qquad \phi_F=V_T\ln\frac{N_A}{n_i}\]</div>
<p>Con \(N_A=10^{17}\) cm⁻³ el potencial de Fermi es \(\phi_F=0.41\) V (a 300 K), y \(V_{th}\) típicos son 0.3–1 V en circuitos integrados modernos y 2–4 V en transistores discretos de potencia. El umbral aumenta con la tensión entre fuente y sustrato (<b>efecto de cuerpo</b>) y <b>disminuye con la temperatura</b> unos 2 mV/K, igual que \(V_{BE}\) en un BJT. Un MOSFET de <b>agotamiento</b> tiene el canal ya formado con \(V_{GS}=0\) (\(V_{th}&lt;0\)) y se apaga con una tensión negativa; el JFET del capítulo siguiente se comporta de esa manera. El <b>PMOS</b> es el complementario: sustrato n, canal p, conduce con \(V_{GS}\) negativo (\(V_{GS}&lt;-|V_{th}|\)) y todas las polaridades se invierten.</p>
<div class="box note"><p><b>La puerta es un condensador.</b> En continua no entra corriente, pero para cambiar \(V_{GS}\) hay que cargar \(C_{GS}\) y \(C_{GD}\): en conmutación rápida la excitación de la puerta consume corrientes de picos de amperios. Además el óxido se perfora con tensiones de 20 V (menos en circuitos integrados): una descarga electrostática basta para destruirlo; por eso los MOSFET se manipulan con pulsera antiestática y llevan diodos de protección.</p></div>
</section>

<section>
<h2>Regiones de funcionamiento y ecuaciones</h2>
<p>Con la fuente a tierra, la corriente de drenador depende de dos tensiones: \(V_{GS}\) (cuánto canal hay) y \(V_{DS}\) (cuánta tensión empuja los electrones por él). Hay tres regiones:</p>
<ul>
<li><b>Corte</b>: \(V_{GS}&lt;V_{th}\). No hay canal: \(I_D\approx0\).</li>
<li><b>Triodo (óhmica o lineal)</b>: \(V_{GS}>V_{th}\) y \(V_{DS}&lt;V_{ov}\). El canal llega hasta el drenador; el transistor se comporta como un <b>resistor controlado por tensión</b>.</li>
<li><b>Saturación</b>: \(V_{DS}\ge V_{ov}\). La tensión en el extremo del drenador ya no alcanza para mantener la inversión (estrangulamiento del canal, <i>pinch-off</i>) y la corriente deja de depender de \(V_{DS}\): el transistor es una <b>fuente de corriente controlada por \(V_{GS}\)</b>.</li>
</ul>
<div class="eq key" data-name="Ecuaciones de la corriente de drenador (modelo de ley cuadrática)">\[I_D=\begin{cases}0 & V_{GS}\le V_{th}\\ k\left(V_{ov}V_{DS}-\dfrac{V_{DS}^2}{2}\right)(1+\lambda V_{DS}) & V_{DS}&lt;V_{ov}\ \text{(triodo)}\\ \dfrac{k}{2}\,V_{ov}^2\,(1+\lambda V_{DS}) & V_{DS}\ge V_{ov}\ \text{(saturación)}\end{cases}\qquad k=\mu_nC_{ox}\frac{W}{L},\quad V_{ov}=V_{GS}-V_{th}\]</div>
<p>El parámetro de transconductancia \(k\) (A/V²) depende de la tecnología (\(\mu_nC_{ox}\)) y de la geometría (\(W/L\)): el diseñador de circuitos integrados lo elige dibujando transistores más anchos. El factor \((1+\lambda V_{DS})\) incluye la <b>modulación de la longitud del canal</b> (el punto de estrangulamiento se acerca a la fuente al subir \(V_{DS}\)): equivale al efecto Early del BJT con \(V_A=1/\lambda\). Con \(\lambda=0.02\) V⁻¹ (\(V_A=50\) V) la corriente sube un 10 % entre 0 y 5 V de \(V_{DS}\).</p>
<div class="eq key" data-name="Parámetros de pequeña señal del MOSFET">\[g_m=\frac{\partial I_D}{\partial V_{GS}}=k\,V_{ov}=\sqrt{2kI_D}=\frac{2I_D}{V_{ov}}\qquad r_o=\frac{1}{\lambda I_D}\qquad R_{DS(on)}=\frac{1}{k\,V_{ov}}\ \ (V_{DS}\ll V_{ov})\]</div>
<p>Con el 2N7000 (\(k=0.07\) A/V², \(V_{th}=2.1\) V, \(\lambda=0.02\) V⁻¹) a \(V_{GS}=3.5\) V (\(V_{ov}=1.4\) V): saturación para \(V_{DS}\ge1.4\) V con \(I_D=\frac{0.07}{2}\cdot1.4^2\cdot(1+0.02\cdot5)=75.5\) mA a \(V_{DS}=5\) V, \(g_m=0.07\cdot1.4=98\) mS y, para \(V_{DS}\) pequeño, \(R_{DS(on)}=1/(0.07\cdot1.4)=10.2\) Ω.</p>
<div class="sim" data-sim="c19-curvas" data-title="Curvas de salida I_D–V_DS del MOSFET: corte, triodo y saturación"></div>
<div class="sim-guide"><ul>
<li>En la pestaña «Curvas» se muestran las familias con \(V_{GS}\) de 2.5 a 5 V. Para cada curva hay un <b>codo</b> en \(V_{DS}=V_{ov}\): a la izquierda la corriente crece casi linealmente (triodo, pendiente \(=1/R_{DS(on)}\)), a la derecha es casi constante (saturación, con una leve inclinación por \(\lambda\)).</li>
<li>Las curvas no están espaciadas por igual: \(I_D\propto V_{ov}^2\). Con \(V_{GS}=2.5\) V (\(V_{ov}=0.4\) V) la corriente de saturación es de apenas 6 mA; con 5 V, 0.3 A.</li>
<li>Mueva \(V_{DS}\) con los controles: el panel indica la región y el valor de \(g_m\) y \(R_{DS(on)}\). Con \(V_{DS}=5\) V, \(V_{GS}=3.5\) V: saturación, \(I_D=75.5\) mA, \(g_m=98\) mS.</li>
<li>Cambie al IRF540N (\(V_{th}=3.5\) V, \(k=12\) A/V²): la forma es la misma pero con \(V_{GS}\) de 4 a 5 V las corrientes son de decenas de amperios, porque es un dispositivo de potencia con \(W/L\) enorme. Es el mismo modelo con otro \(k\).</li>
</ul></div>
<p>Una forma práctica de <b>extraer \(V_{th}\) y \(k\)</b> de un transistor real es aprovechar que en saturación \(\sqrt{I_D}=\sqrt{k/2}\,(V_{GS}-V_{th})\): al representar \(\sqrt{I_D}\) frente a \(V_{GS}\) se obtiene una <b>recta</b> cuya intersección con el eje horizontal es \(V_{th}\) y cuya pendiente permite hallar \(k=2\cdot\text{pendiente}^2\).</p>
<div class="sim" data-sim="c19-transfer" data-title="Característica de transferencia y extracción de V_th y k"></div>
<div class="sim-guide"><ul>
<li>Con el 2N7000 en saturación (\(V_{DS}=8\) V) la curva \(I_D(V_{GS})\) es una parábola que arranca en \(V_{th}=2.1\) V (línea punteada). Cámbiela a «√I_D»: se convierte en una recta que corta el eje en 2.1 V.</li>
<li>Reduzca \(V_{DS}\) a 0.5 V: el transistor está en triodo y la curva deja de ser parabólica (casi una recta \(I_D\approx kV_{ov}V_{DS}\)); el panel indica entonces \(g_m=kV_{DS}\).</li>
<li>Compare el IRLZ44N (\(V_{th}=1.7\) V, «de nivel lógico») con el IRF540N (\(V_{th}=3.5\) V): el primero conduce con 5 V de puerta, el segundo necesita 10 V.</li>
</ul></div>
</section>

<h2>MOSFET frente a BJT</h2>
<div class="tablewrap"><table class="tbl"><tr><th>Característica</th><th>BJT</th><th>MOSFET</th></tr>
<tr><td>Control</td><td>corriente de base \(I_B\)</td><td>tensión de puerta \(V_{GS}\)</td></tr>
<tr><td>Corriente de control en continua</td><td>\(I_C/\beta\) (µA–mA)</td><td>0 (sólo carga de capacitancias)</td></tr>
<tr><td>Relación \(I(V)\)</td><td>exponencial: \(I_C\propto e^{V_{BE}/V_T}\)</td><td>cuadrática: \(I_D\propto(V_{GS}-V_{th})^2\)</td></tr>
<tr><td>\(g_m/I\)</td><td>\(1/V_T\approx39\) S/A (máxima)</td><td>\(2/V_{ov}\approx9\) S/A para \(V_{ov}=0.22\) V</td></tr>
<tr><td>Tensión de saturación / resistencia</td><td>\(V_{CE,sat}\approx0.1\)–0.3 V (offset fijo)</td><td>\(R_{DS(on)}\) (sin offset, desde miliohmios)</td></tr>
<tr><td>Coeficiente térmico a \(I\) constante</td><td>\(V_{BE}\) −2 mV/K: fuga térmica</td><td>\(R_{DS(on)}\) crece ≈ 0.4–0.7 %/K: <b>autolimitante</b>, se pueden poner en paralelo</td></tr>
<tr><td>Velocidad de conmutación</td><td>almacenamiento de carga en la base</td><td>portadores mayoritarios: sin almacenamiento, sólo carga de \(C_{iss}\)</td></tr>
<tr><td>Integración en circuitos</td><td>buena (circuitos bipolares, ECL)</td><td>excelente: base de CMOS, memorias, microprocesadores</td></tr></table></div>
<p>El MOSFET obtiene menos ganancia por unidad de corriente (\(g_m\) menor), pero compensa con su entrada de resistencia infinita, su ausencia de offset de saturación y su comportamiento térmico estable. A corrientes de reposo iguales, un amplificador MOS tiene unas 4–5 veces menos ganancia que el bipolar (ver más abajo).</p>
</section>

<section>
<h2>El inversor CMOS</h2>
<p>La lógica <b>CMOS</b> (<i>complementary</i> MOS) combina un PMOS y un NMOS: la fuente del PMOS va a \(V_{DD}\), la del NMOS a tierra, las puertas se unen en la entrada y los drenadores en la salida. Con entrada baja (\(V_{in}=0\)) el NMOS está cortado y el PMOS conduce: la salida es \(V_{DD}\); con entrada alta ocurre lo contrario y la salida es 0. En <b>ambos estados estáticos uno de los dos transistores está cortado</b>, así que no circula corriente desde \(V_{DD}\) a tierra: el consumo estático es prácticamente nulo. Esa es la razón por la que CMOS desplazó a todas las demás familias lógicas.</p>
<p>La característica de transferencia (VTC) pasa de \(V_{DD}\) a 0 en un intervalo muy estrecho en torno al <b>umbral lógico</b> \(V_M\), donde \(V_{out}=V_{in}\). En ese punto ambos transistores están en saturación y llevan la misma corriente: igualando \(\frac{k_n}{2}(V_M-V_{thn})^2=\frac{k_p}{2}(V_{DD}-V_M-|V_{thp}|)^2\):</p>
<div class="eq key" data-name="Umbral lógico del inversor CMOS">\[V_M=\frac{V_{thn}+r\,(V_{DD}-|V_{thp}|)}{1+r}\qquad r=\sqrt{\frac{k_p}{k_n}}\qquad V_M=\frac{V_{DD}}{2}\ \text{si}\ k_p=k_n,\ V_{thn}=|V_{thp}|\]</div>
<p>El PMOS tiene la mitad de movilidad que el NMOS (huecos frente a electrones), por lo que en un inversor real se ensancha 2–3 veces para igualar \(k_p=k_n\) y centrar el umbral. La ganancia de la zona de transición (cientos de veces) regenera los niveles lógicos y da <b>márgenes de ruido</b> altos, de casi \(V_{DD}/2\).</p>
<div class="sim" data-sim="c19-cmos" data-title="Inversor CMOS: característica de transferencia y conmutación"></div>
<div class="sim-guide"><ul>
<li>El barrido muestra la VTC de un inversor simétrico (\(k_p=k_n\), \(V_{th}=1.5\) V, \(V_{DD}=5\) V): \(V_M=2.5\) V, con un cambio abrupto de 4 V a 1 V en una banda de unos 40 mV alrededor de \(V_M\).</li>
<li>Cambie la relación \(k_p/k_n\) a 4: el umbral se desplaza a 2.84 V (teoría: 2.83 V); con 0.25 baja a 2.17 V (teoría 2.17 V). Esa es la forma de ajustar los niveles.</li>
<li>El pico de corriente de cortocircuito (los dos transistores conducen a la vez al cruzar el umbral) es de ½·k·(V_M−V_th)² = 1.0 mA con \(V_{DD}=5\) V y 22.7 mA con 12 V (crece con \(V_{DD}\)²). Con \(V_{DD}=3.3\) V el pico cae a 0.02 mA, porque \(V_{DD}\) apenas supera \(2V_{th}=3\) V: <b>con \(V_{DD}&lt;V_{thn}+|V_{thp}|\) no hay corriente de cortocircuito</b>.</li>
<li>En el osciloscopio, con una onda cuadrada de 100 kHz, la salida carga y descarga la capacitancia \(C_L\) con la corriente de saturación de cada transistor (12 mA); sube \(C_L\) y verá cómo aumenta el tiempo de conmutación.</li>
</ul></div>
<h3>Potencia y retardo</h3>
<p>La potencia de un circuito CMOS se debe casi en su totalidad a la <b>carga y descarga de las capacitancias</b>. En cada ciclo la fuente entrega \(C_LV_{DD}^2\) (la mitad se disipa al cargar, la otra mitad al descargar), de modo que:</p>
<div class="eq key" data-name="Potencia dinámica y retardo de un inversor CMOS">\[P_{din}=\alpha\,C_L\,V_{DD}^2\,f\qquad t_{pd}\approx0.7\,\frac{C_LV_{DD}}{I_{sat}}\qquad I_{sat}=\frac{k}{2}(V_{DD}-V_{th})^2\]</div>
<p>donde \(\alpha\) es el factor de actividad (fracción de ciclos en que la salida conmuta). La potencia crece con el <b>cuadrado de la tensión</b>: reducir \(V_{DD}\) es la medida más eficaz para ahorrar energía, a costa de velocidad (\(I_{sat}\) disminuye). Con 1 nF, 5 V y 100 kHz el inversor de la simulación consume \(C_LV_{DD}^2f=2.5\) mW; con 1 pF y 1 GHz y 1 V, 1 mW. A este consumo se suman la <b>corriente de fuga</b> (subumbral y puerta), que en nodos de pocos nanómetros ya es comparable con la dinámica, y el cortocircuito durante la transición. Si \(C_{in}\) de la compuerta siguiente es \(C_L\), el retardo de una cadena de inversores es \(N\,t_{pd}\): es la base del diseño digital y del «<i>fan-out</i>».</p>
<p>Las compuertas se forman combinando transistores: en una <b>NAND</b> de dos entradas los NMOS están en serie y los PMOS en paralelo; en una <b>NOR</b>, al revés. Los PMOS en serie de una NOR son lentos (pobre movilidad), por eso las bibliotecas prefieren NAND. Una limitación histórica es el <i>latch-up</i> (un tiristor parásito pnpn que se dispara y cortocircuita la alimentación), que se evita con anillos de guarda.</p>
</section>

<section>
<h2>El MOSFET de potencia como interruptor</h2>
<p>Los MOSFET discretos de potencia (VDMOS y trench) conducen la corriente <b>verticalmente</b> a través de miles de celdas en paralelo, de modo que su \(R_{DS(on)}\) llega a milésimas de ohmio. Valores típicos: IRF540N, 100 V, 33 A, \(R_{DS(on)}=44\) mΩ a \(V_{GS}=10\) V; IRLZ44N, 55 V, 47 A, unos 25 mΩ a 5 V (22 mΩ en el modelo del simulador; «de nivel lógico»). Frente al BJT, las ventajas como interruptor son: sin corriente de excitación en continua, conmutación más rápida (decenas de ns), \(V_{DS}\) pequeña a corrientes grandes (\(I\cdot R_{DS}\)) y la facilidad de ponerlos en paralelo. Las pérdidas tienen dos componentes:</p>
<div class="eq key" data-name="Pérdidas del MOSFET de potencia">\[P_{cond}=I_D^2\,R_{DS(on)}\qquad P_{sw}\approx\frac{1}{2}\,V_{DS}\,I_D\,(t_r+t_f)\,f_{sw}\qquad P_{puerta}=Q_g\,V_{GS}\,f_{sw}\]</div>
<p>La <b>carga de puerta</b> \(Q_g\) (decenas de nC) es la que hay que suministrar a las capacitancias \(C_{iss}=C_{GS}+C_{GD}\) para pasar de 0 a \(V_{GS}\); con una resistencia de puerta \(R_g\) la carga sigue una exponencial de constante \(\tau=R_gC_{iss}\): para \(R_g=100\) Ω y \(C_{iss}=1.5\) nF (como el IRLZ44N del simulador), \(\tau=150\) ns. El tramo de la conmutación en que \(V_{GS}\) permanece casi constante (\(V_{plateau}\)) es la carga de \(C_{GD}\) por el efecto Miller; mientras tanto el transistor pasa por la zona de saturación con tensión y corriente simultáneas, y ahí se concentran las pérdidas de conmutación. Una resistencia de puerta grande reduce el ruido EMI y las oscilaciones pero aumenta \(P_{sw}\).</p>
<p>Reglas de uso: (1) \(|V_{GS}|\le V_{GS,max}\) (±20 V típico) y no dejar la puerta flotante: un resistor de 10–100 kΩ de puerta a fuente la mantiene apagada; (2) una resistencia en serie de 10–100 Ω limita la corriente pico y amortigua el oscilador \(L C_{iss}\) del cableado; (3) con carga inductiva, diodo de rueda libre (el MOSFET tiene uno parásito, el <b>diodo del cuerpo</b>, que sirve en muchos casos); (4) con una excitación de 3.3 V o 5 V se necesita un MOSFET de <b>nivel lógico</b> (\(V_{th}\) bajo y \(R_{DS(on)}\) especificado a 4.5 V); (5) en interruptores de «lado alto» con NMOS hay que elevar la tensión de puerta por encima de \(V_{DD}\) (\(V_{GS}=10\) V sobre la fuente) con una bomba de carga o un <i>bootstrap</i>; el PMOS evita esto pero tiene mayor \(R_{DS(on)}\) por la menor movilidad.</p>
<div class="sim" data-sim="c19-switch" data-title="MOSFET como interruptor de lado bajo: efecto de V_G, del tipo de transistor y de la carga"></div>
<div class="sim-guide"><ul>
<li>Una carga de 6 Ω (2 A a 12 V) con el IRLZ44N. Con \(V_G=5\) V: \(R_{DS}=22\) mΩ, \(V_{DS}=44\) mV, 0.09 W en el MOSFET frente a 24 W en la carga. Con 10 V la resistencia baja a 9 mΩ.</li>
<li>Ponga \(V_G=2\) V: el IRLZ44N conduce 0.67 A con \(V_{DS}=8\) V y disipa <b>5.3 W</b>: a medio encender el MOSFET trabaja en saturación y es mucho más peligroso que a pleno o apagado. Lo importante de un interruptor es atravesar esa zona muy rápido.</li>
<li>Cambie al IRF540N («estándar»): con \(V_G=3.3\) V (lógica de 3.3 V) <b>no conduce</b> (0 A: su \(V_{th}\) es 3.5 V); con 4 V pasa 1.5 A con \(V_{DS}=2.8\) V y disipa 4.3 W; sólo a 5 V se obtiene \(R_{DS}=58\) mΩ y 0.23 W; con 10 V, 13 mΩ. Los datos de \(R_{DS(on)}\) siempre se dan a una \(V_{GS}\) determinada: <b>hay que mirarla</b>.</li>
<li>Cambie al 2N7000 con \(R_L=100\) Ω: con \(V_G=3.3\) V disipa 0.36 W (el límite del transistor es 0.4 W y se calienta); con 5 V solo 0.07 W y \(R_{DS}=5.4\) Ω; con 10 V, 1.8 Ω. Si baja \(R_L\) a 12 Ω el transistor pasa 1 A, muy por encima de sus 0.2 A: «destruido».</li>
</ul></div>
</section>

<section>
<h2>Amplificador de fuente común y seguidor de fuente</h2>
<p>Las configuraciones son las del BJT con los nombres cambiados: <b>fuente común</b> (equivalente al emisor común), <b>drenador común o seguidor de fuente</b> (colector común) y <b>puerta común</b> (base común). Con polarización por divisor de tensión \(R_1,R_2\) y resistencia de fuente \(R_S\) desacoplada con \(C_S\), la resistencia de entrada es \(R_{in}=R_1\parallel R_2\) (cientos de kΩ o MΩ, porque la puerta no consume):</p>
<div class="eq key" data-name="Fuente común">\[A_v=-g_m\,(R_D\parallel R_L\parallel r_o)\qquad R_{in}=R_1\parallel R_2\qquad R_{out}\approx R_D\parallel r_o\qquad A_v\approx-\frac{R_D\parallel R_L}{1/g_m+R_S}\ \ (\text{sin }C_S)\]</div>
<div class="eq" data-name="Seguidor de fuente">\[A_v=\frac{g_mR'_S}{1+g_mR'_S}&lt;1\qquad R'_S=R_S\parallel R_L\qquad R_{out}\approx\frac{1}{g_m}\parallel R_S\]</div>
<p>En el montaje de la simulación (2N7000, \(V_{CC}=12\) V, \(R_1=680\) kΩ, \(R_2=390\) kΩ, \(R_D=3.3\) kΩ, \(R_S=1\) kΩ): el divisor da \(V_G=4.37\) V, el transistor lleva \(I_D=1.94\) mA con \(V_{GS}=2.33\) V (\(V_{ov}=0.23\) V) y \(g_m=0.07\cdot0.23=15.9\) mS. La ganancia es \(-15.9\text{ mS}\cdot(3.3\text{ k}\parallel10\text{ k})=-39.5\); el simulador mide −38.5 (el efecto de \(r_o\)). Compárese con el emisor común de ejemplo con la misma \(I_C\approx2\) mA, que daba −198: el BJT tiene 5 veces más \(g_m\) y por eso 5 veces más ganancia. A cambio, \(R_{in}=248\) kΩ frente a 3.1 kΩ.</p>
<div class="sim" data-sim="c19-cs" data-title="Amplificador de fuente común: ganancia, resistencia de entrada y respuesta en frecuencia"></div>
<div class="sim-guide"><ul>
<li>Con \(C_S\) la salida está en oposición de fase y 38.5 veces mayor (100 mV de pico a la entrada dan 1.9 V de pico a la salida). La ganancia teórica es −39.5 con \(g_m=15.9\) mS.</li>
<li>Pulse «Sin C_S»: \(g_mR_S=15.9\) y la ganancia baja a \(-39.5/16.9=-2.3\); la linealidad mejora (compruebe subiendo la amplitud).</li>
<li>El Bode (pestaña «Bode»): ganancia en banda de 31.8 dB y corte inferior en 28 Hz, determinado por \(C_S\) con \(1/g_m=63\) Ω.</li>
<li>La resistencia de entrada es 248 kΩ (el divisor): el transistor no carga a la fuente. En «Bode», con una fuente de 10 kΩ la ganancia en banda es 37.4 (frente a 38.9 con 50 Ω); el emisor común de la simulación 18.1, con \(R_{in}=3.1\) kΩ, pasaría de 183 a 45 (−76 %) con la misma fuente.</li>
</ul></div>
<p>Con las capacitancias parásitas activadas (\(C_{gd}=5\) pF) el comportamiento en alta frecuencia es el mismo que el del BJT, con el <b>efecto Miller</b> de \(C_{gd}\): \(C_{in}=C_{gs}+C_{gd}(1+g_mR'_L)\). Con \(R_s=50\) Ω, \(f_H=3.6\) MHz; con \(R_s=10\) kΩ cae a 70 kHz.</p>
</section>

<section>
<h2>Medidas de laboratorio</h2>
<ul>
<li><b>Curva de transferencia y extracción de \(V_{th}\) y \(k\).</b> Con un 2N7000 y una fuente de 5 V, un resistor de 100 Ω en el drenador y una fuente variable en la puerta (potenciómetro de 10 kΩ de 0 a 5 V), mida \(V_{GS}\) y \(V_R\) sobre el resistor. Calcule \(I_D=V_R/100\) y grafique \(\sqrt{I_D}\) frente a \(V_{GS}\): la recta da \(V_{th}\) (típico 1.8–2.5 V, con mucha dispersión de unidad a unidad) y \(k\).</li>
<li><b>\(R_{DS(on)}\).</b> Con \(V_{GS}=5\) V y 50 mA, mida \(V_{DS}\): \(R_{DS(on)}\) (de 1.8 a 5 Ω para el 2N7000 según \(V_{GS}\)). Repita con 3.3 V: ¿qué corriente pasa realmente?</li>
<li><b>Inversor CMOS.</b> Un CD4007 (dos NMOS + dos PMOS) o un CD4069 (inversores) a 5 V: trace la característica de transferencia con un potenciómetro y mida la corriente de la fuente: sólo hay un pico en \(V_M\) (≈ 2.5 V).</li>
<li><b>Manejo.</b> Toque tierra antes de manipular los MOSFET; nunca deje una puerta de CMOS flotante: un dedo cargado basta para encender o destruir el transistor.</li>
</ul>
</section>

<section>
<h2>Problemas</h2>
<ol class="problems">
<li><span class="lvl">Básico</span>Un NMOS con \(k=0.07\) A/V², \(V_{th}=2.1\) V y \(\lambda=0\) opera con \(V_{GS}=4\) V y \(V_{DS}=5\) V. Halle la región, \(I_D\) y \(g_m\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li>\(V_{ov}=4-2.1=1.9\) V; como \(V_{DS}=5\ge V_{ov}\): saturación.</li>
<li>\(I_D=\frac{k}{2}V_{ov}^2=0.035\cdot3.61=126\) mA.</li>
<li>\(g_m=kV_{ov}=0.07\cdot1.9=133\) mS (o \(2I_D/V_{ov}=133\) mS).</li>
<li><b>Resultado.</b> <span class="ans">Saturación, 126 mA (139 mA con \(\lambda=0.02\)) y 133 mS.</span></li></ol></details></li>
<li><span class="lvl">Básico</span>Calcule \(R_{DS(on)}\) de un MOSFET con \(k=13.8\) A/V² y \(V_{th}=1.7\) V (modelo del IRLZ44N) a \(V_{GS}=5\) V y a 2.5 V, y la potencia que disipa conduciendo 20 A.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li>5 V: \(V_{ov}=3.3\) V; \(R_{DS}=1/(13.8\cdot3.3)=22\) mΩ.</li>
<li>2.5 V: \(V_{ov}=0.8\) V; \(R_{DS}=1/(13.8\cdot0.8)=90.6\) mΩ.</li>
<li>\(P=I^2R_{DS}\): a 5 V, \(400\cdot0.022=8.8\) W; a 2.5 V, 36 W (4 veces más).</li>
<li><b>Resultado.</b> <span class="ans">22 mΩ y 91 mΩ; 8.8 W y 36 W: una tensión de puerta insuficiente multiplica las pérdidas.</span></li></ol></details></li>
<li><span class="lvl">Intermedio</span>Un inversor CMOS con \(V_{DD}=3.3\) V, \(V_{thn}=0.7\) V, \(|V_{thp}|=0.7\) V y \(k_p=2k_n\). Halle \(V_M\) y diga hacia qué lado se desplaza respecto de \(V_{DD}/2\).
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li>\(r=\sqrt{k_p/k_n}=\sqrt2=1.414\).</li>
<li>\(V_M=\dfrac{0.7+1.414\,(3.3-0.7)}{1+1.414}=\dfrac{0.7+3.677}{2.414}=1.81\) V.</li>
<li><b>Resultado.</b> <span class="ans">\(V_M=1.81\) V, mayor que 1.65 V: un PMOS más fuerte sube el umbral (la salida se mantiene alta hasta una entrada mayor).</span></li></ol></details></li>
<li><span class="lvl">Intermedio</span>Un procesador tiene \(10^8\) compuertas con \(C_L=1\) fF cada una, factor de actividad \(\alpha=0.1\), \(V_{DD}=1\) V y 3 GHz. Calcule su potencia dinámica. ¿Qué pasa si se baja \(V_{DD}\) a 0.8 V y \(f\) a 2.4 GHz?
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li>\(P=\alpha NC_LV_{DD}^2f=0.1\cdot10^8\cdot10^{-15}\cdot1\cdot3\cdot10^9=30\) W.</li>
<li>Con 0.8 V y 2.4 GHz: \(P=0.1\cdot10^8\cdot10^{-15}\cdot0.64\cdot2.4\cdot10^9=15.4\) W.</li>
<li><b>Resultado.</b> <span class="ans">30 W y 15.4 W: bajar un 20 % la tensión y la frecuencia reduce la potencia a la mitad (por \(V^2f\)): el escalado dinámico de tensión y frecuencia.</span></li></ol></details></li>
<li><span class="lvl">Intermedio</span>Una etapa de fuente común con \(I_D=2\) mA y \(V_{ov}=0.25\) V tiene \(R_D=4.7\) kΩ y \(R_L=4.7\) kΩ. Halle la ganancia y compárela con un emisor común con la misma corriente y carga.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li>\(g_m=2I_D/V_{ov}=16\) mS; \(R'_L=2.35\) kΩ; \(A_v=-0.016\cdot2350=-37.6\).</li>
<li>BJT: \(g_m=2\text{ mA}/25.9\text{ mV}=77\) mS; \(A_v=-0.077\cdot2350=-181\).</li>
<li><b>Resultado.</b> <span class="ans">−37.6 (31.5 dB) frente a −181 (45 dB): el BJT da 4.8 veces más ganancia con la misma corriente; el MOSFET tiene a cambio resistencia de entrada de megaohmios.</span></li></ol></details></li>
<li><span class="lvl">Avanzado</span>Se excita la puerta de un IRLZ44N (\(C_{iss}=1.5\) nF, \(V_{th}=1.7\) V) con un escalón de 0 a 5 V a través de \(R_g=100\) Ω. Calcule cuánto tarda \(V_{GS}\) en alcanzar \(V_{th}\) y el 90 % de 5 V, y la corriente máxima de la fuente de excitación.
<details class="sol"><summary>Solución paso a paso</summary><ol class="steps">
<li>\(\tau=R_gC_{iss}=100\cdot1.5\text{ nF}=150\) ns.</li>
<li>\(V_{GS}(t)=5(1-e^{-t/\tau})\). Para 1.7 V: \(t=-\tau\ln(1-1.7/5)=150\cdot0.416=62\) ns.</li>
<li>Para 4.5 V: \(t=-\tau\ln(0.1)=150\cdot2.303=345\) ns.</li>
<li>Corriente pico: \(5\text{ V}/100\ \Omega=50\) mA (al principio).</li>
<li><b>Resultado.</b> <span class="ans">62 ns hasta el umbral, 345 ns hasta el 90 %, y 50 mA de pico. Con un excitador más débil (por ejemplo, la salida de 20 mA de un microcontrolador) la conmutación sería más lenta y las pérdidas mayores.</span></li></ol></details></li>
</ol>
