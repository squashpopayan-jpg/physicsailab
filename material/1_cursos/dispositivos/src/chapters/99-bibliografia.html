<section>
<h2>Hojas de datos citadas</h2>
<p>Los modelos del simulador reproducen los parámetros típicos de estas hojas de datos (ON Semiconductor, Fairchild, Texas Instruments, STMicroelectronics, Vishay, Infineon, Diodes Inc.): 1N4148, 1N4007, 1N5819 (diodos); BC547, 2N3904, 2N2222A, BC557, 2N3906, TIP31C, TIP32C, TIP120, 2N3055 (bipolares); 2N7000, IRF540N, IRLZ44N, IRF9540, BS250 (MOSFET); 2N5457, J201, BF245A (JFET); LM741, TL081, LM358, LM393, OP07 (A.O.); 7805, 7812, 7905, 78L05, LM317, AMS1117 (reguladores); NE555 (temporizador); 4N25 (optoacoplador). Siempre debe consultar la hoja de datos del lote que use: los parámetros varían entre fabricantes y de un ejemplar a otro.</p>
</section>

<section>
<h2>Herramientas usadas para validar el curso</h2>
<ul>
<li>NumPy y SciPy (referencias numéricas independientes); SymPy (cálculo simbólico); y el propio motor de análisis nodal modificado del curso (con las pruebas del apéndice B).</li>

</ul>
